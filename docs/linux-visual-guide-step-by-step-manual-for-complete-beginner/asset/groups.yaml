    # tr (Replace Characters)


    ```

    tr ["original string"]["new string"]

    ```


    | Apple | Replace | Kiwi |

    | --- | --- | --- |

    | Apple | String | Kiwi |

    | Apple | | |


    To specify file input,


    cat [file path] | tr ["original string"]["new string"]


    tr ["original string"]["new string"] < [file path]


    tr (translate) command is used to replace a string with another string. As the
    command doesn''t have a file input argument, it is often used with the pipe or
    redirection.


    # tr command syntax


    The tr command syntax itself is tr ["original string"]["new string"]. The original
    and new strings should be quoted with " " or ''\''; however, the command doesn''t
    work on its own as it needs standard input.


    # tr command with pipe


    To make an input to the tr command, you can use the cat command and connect it
    with the tr command.


    To demonstrate the command, we use a customer purchase data set example below.
    The file name is purchase.txt and its data fields are, from left to right:


    - 1. Customer ID

    2. First name

    3. Last name

    4. Product name

    5. Purchase unit

    6. Purchase value


    purchase.txt


    ```

    274, Theresa, Webb, Apple,$19.2

    357, Guy, Hawkins,Orange,3,$6.6

    703, Devon, Lane, Apple,$12.8

    994, Arlene, McCoy, Apple,$12.8

    922, Ralph, Edwards, Bananas,3,$12.6

    177, Savannah, Nguyen, Apple,$19.2

    798, Marvin, McKinney, Grapes,7,$53.2

    429, Courtney, Henry, Bananas,3,$6.6

