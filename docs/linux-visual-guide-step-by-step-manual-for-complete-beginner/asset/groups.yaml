    # 创建包含多个命令的新别名


    要创建一个包含多个命令的新别名，请使用 `;`（分号）来组合命令。下面的示例展示了如何创建一个名为 `mdfa` 的别名来执行两个命令：`mkdir` 和
    `touch`。


    ## 命令行 - 输入


    ```

    ubuntu $ | alias mdfa="mkdir dir_a;touch dir_a/file_a"

    ```


    运行该命令并使用 `ls` 命令检查结果。


    ## 命令行 - 输入


    ```

    ubuntu $ | mdfa

    ubuntu $ | ls

    ```


    ## 命令行 - 输出


    ```

    dir_1 dir_a

    ```


    ## 命令行 - 输入


    ```

    ubuntu $ | ls dir_a

    ```


    ## 命令行 - 输出


    ```

    file_a

    ```


    你还可以通过运行 `alias` 命令来检查别名的注册情况。


    ## 命令行 - 输入


    ```

    ubuntu $ | alias

    ```


    ## 命令行 - 输出


    ```

    alias ls=''ls --color=auto''

    alias md1=''mkdir dir_1''

    alias mdfa=''mkdir dir_a;touch dir_a/file_a''

    ```


    # 删除已存在的别名


    要删除已存在的别名，可以使用 `unalias` 命令。


    删除别名 `md1`。


    ## 命令行 - 输入


    ```

    ubuntu $ | unalias mdi

    ```


    运行 `alias` 命令检查其是否已删除。


    ## 命令行 - 输入


    ```

    ubuntu $ | alias

    ```


    ## 命令行 - 输出


    ```

    : alias ls=''ls --color=auto''

    alias mdf=''mkdir dir_a;touch dir_a/file_a''

    ```


    # man (显示手册)


    ## man [命令名称]


    ```

    $ man ls

    NAME

    ls - 列出目录内容

    SYNOPSIS

    ls [OPTION]... [FILE]...

    DESCRIPTION

    列出关于文件 的信息（默认为当前目录）。

    如果未指定 -ctuvSUX 或 --sort，则按字母顺序对条目进行排序。


    -a, --all

    不忽略以 . 开头的条目

    ```


    ### 显示手册


    `man` (MANual) 命令用于显示命令的手册。当你想要查看某个命令的选项列表时，`man` 命令非常有用。


    ## 打开命令手册


    要打开手册，请带上命令名称运行 `man`。例如，要显示 `grep` 的手册，请运行 `man grep`。


    ## 命令行 - 输入


    ```

    ubuntu $ | man grep

    ```


    # 关闭手册


    要关闭手册，请按 Esc 键。


    # type, which 和 whereis (显示命令信息)


    - 返回命令类型，例如：

    - shell 内置命令

    - 外部命令

    - 别名


    ```

    type [命令名称]

    ```


    ```

    which [命令名称]

    ```


    返回命令的路径


    ```

    whereis [命令名称]

    ```


    返回命令路径以及相关的文档（如手册）


    除了命令本身外，还有几个 Linux 命令可以提供关于 Linux 命令的信息。


    ## type - 显示命令的类型


    `type` 命令返回命令的类型。主要有三种类型：


    - 1. Shell 内置命令（内部命令）

    - 2. 外部命令（shell 执行命令时会引用命令的路径）

    - 3. 别名 (Alias)


    以下是这三种类型的示例。


    ## 命令行 - 输入


    ```

    ubuntu $ | type echo

    ```


    ## 命令行 - 交互式


    ```

    echo is a shell builtin

    ```


    ## 命令行 - 输入


    ```

    ubuntu $ | type find

    ```


    ## 命令行 - 交互式


    ```

    find is /usr/bin/find

    ```


    ## 命令行 - 输入


    ```

    ubuntu $ | type l1

    ```


    ## 命令行 - 交互式


    ```

    l1 is aliased to ''ls -alF''

    ```


    # which - 显示命令的路径


    `which` 命令为你提供命令的文件路径。


    ## 命令行 - 输入


    ```

    ubuntu $ | which sort

    ```


    ## 命令行 - 输出


    ```

    /usr/bin/sort

    ```


    # whereis - 显示命令路径及相关文档


    `whereis` 命令与 `which` 命令类似，但它提供的信息更多。


    ## 命令行 - 输入


    ```

    ubuntu $ | whereis sort

    ```


    ## 命令行 - 输出


    ```

    sort: /usr/bin/sort /usr/share/man/manl/sort.1.gz

    ```


    # 包管理器命令


    | 发行版 | 命令 |

    | --- | --- |

    | 基于 Debian 的 | • Debian<br>• Ubuntu | • apt (apt-get)<br>• dpkg<br>• snap |

    | 基于 RPM 的 | • RHEL<br>• CentOS<br>• Fedora<br>• OpenSUSE | • rpm<br>• yum<br>•
    dnf |


    ![](img/87e31443ff747018655a0f4f95ee6187_245_0.png)


    包管理器是一种在 CUI 环境下自动化安装、升级、配置或删除程序的工具，你可以通过运行命令来使用包管理器。命令取决于 Linux Linux 发行版的不同。


    # 基于 Debian 和基于 RPM 的


    主要有两个包管理器组：基于 Debian 和基于 RPM。Debian 和 Ubuntu 使用 `apt (apt-get)`, `dpkg` 或 `snap`，而
    RHEL、CentOS、Fedora 和 OpenSUSE 使用 `rpm`, `yum` 或 `dnf`。


    包管理器是一种在 CUI 环境下自动化安装、升级、配置或删除程序的工具，你可以通过运行命令来使用包管理器。命令取决于 Linux 发行版的不同。


