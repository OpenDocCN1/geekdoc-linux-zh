    # Shell Script


    ![](img/87e31443ff747018655a0f4f95ee6187_215_0.png)


    A shell script is a text file that contains a sequence of commands for a Linux
    or Unix operating system. In the command line, you can usually run only one single
    command. Using the shell script, you can run multiple commands as one operation
    without another human intervention during the process.


    # How to develop a shell script?


    There are some rules to develop shell scripts.


    # File name


    Add .sh at the end of the file name as a file extension.


    # Document structure'
  - '[PAGE 216]


    +   - Declaration: You need to specify which shell will be used for the shell
    script.

    - Comment: You can add comments with # at the beginning of comments


    Here is an example of creating a shell script using some commands discussed in
    the previous section.


    Use vim to create a shell script named test.sh.


    # Command Line - INPUT


    ```

    ubuntu $ vim test.sh

    ```


    In the document, add declaration and commands with comments like the one below.
    Press the key to switch to the insert mode. Next, copy the code below and paste
    it into the file. After pasting the code, press the key followed by the key and
    save the file by pressing the keys. To learn how to use Vim, check Chapter 3.
    Vim Editor.


    test.sh


    ```

    #!/bin/bash

    # display product items

    cat purchase_product.txt

    # extract unique items and count duplicated items

    sort purchase_product.txt | uniq -c

    ```


    # Add an execution permission


    Usually, execution permission is not added when you create a file. In order to
    make the script executable, you need to add execution permission to the file.
    To grant permission to the owner of the file, run the chmod u+x command followed
    by the file path.


    For the test.sh file, grant the execution permission to the owner user.


    # Command Line - INPUT


    ```

    ubuntu $ | sudo chmod u+x test.sh

    ```'
- md: "\n# Run a shell script\n\nTo run a shell script, you just need to specify the\
    \ file path of the shell script like the one below.\n\nCommand Line - INPUT\n\n\
    ```\nubuntu $ | ./test.sh\n```\n\nYou'll see the original list of purchased products\
    \ followed by unique product items with numbers of duplicated items.\n\nCommand\
    \ Line - RESPONSE\n\n```\nApple\nOrange\nApple\nApple\nBananas\nApple\nGrapes\n\
    Orange\nBananas\nGrapes\nGrapes\nGrapes\nBananas\nBananas\nApple\nGrapes\n5 Apple\n\
    4 Bananas\n4 Grapes\n2 Orange\n```\n\n# Call another shell script from a shell\
    \ script\n\nYou can call another shell script from a shell script. This is like\
    \ creating a child process from a parent process.\n\n![](img/87e31443ff747018655a0f4f95ee6187_218_0.png)\n\
    \nTo call another shell script, you just need to add a shell script execution\
    \ command to the shell script.\n\nFor example, create a new shell script file\
    \ named test_child.sh and edit the file as shown below.\n\nNote: the echo command\
    \ will be explained in the next section.\n\nCommand Line - INPUT\n\n```\nubuntu\
    \ $ | vim test_child.sh\n```\n\n>test_child.sh\n\n```bash\n#!/bin/bash\necho \"\
    --------------------------------------\"\necho \"Unique Product List with # of\
    \ Duplicated Items\"\n```\n\nAlso, copy the test.sh file and create a new test\
    \ file *test_parent.sh*. Then, edit the file to add a command to execute test_child.sh.\n\
    \nCommand Line - INPUT\n\n```\nubuntu $ | cp test.sh test_parent.sh\nubuntu $\
    \ | vim test_parent.sh\n```\n\nAdd ./test_child.sh between the cat command and\
    \ the sort command.\n\ntest_parent.sh\n\n```bash\n#!/bin/bash\n# display product\
    \ items\n\n```\n\ncat purchase_product.txt\n./test_child.sh\n\n# extract unique\
    \ items and count duplicated items\nsort purchase_product.txt | uniq -c\n```\n\
    \nTo execute the shell scripts, add permissions and run the test_parent.sh like\
    \ shown below.\n\n# Command Line - INPUT\n\n```\nubuntu $ | sudo chmod +x test_parent.sh\n\
    ubuntu $ | sudo chmod +x test_child.sh\nubuntu # | ./test_parent.sh\n```\n\nYou\
    \ can see that test_parent.sh successfully called test_child.sh.\n\n# Command\
    \ Line - RESPONSE\n\n```\nApple\nOrange\nApple\nApple\nBananas\nApple\nGrapes\n\
    Orange\nBananas\nGrapes\nGrapes\nBananas\nBananas\nApple\nGrapes\n----------------------------------------------------------------------\n\
    Unique Product List with # of Duplicated Items\n5 Apple\n4 Bananas\n4 Grapes\n\
    2 Orange\n```\n\n# echo (Echo input)\n\n# echo [string] or [$variable]\n\n| String\
    \ Argument | Variable Argument |\n| --- | --- |\n| ABC | $ABC value assigned ABC\
    \ = 56 |\n| INPUT | INPUT |\n| Echo </|> | Echo </|> |\n| OUTPUT | OUTPUT |\n\
    | ABC | 56 |\n\nThe echo command is used for displaying a line of text/string\
    \ that is included in the argument.\n\n# echo with string\n\nWhen an argument\
    \ is a string, the echo command returns the string itself.\n\nCommand Line - INPUT\n\
    \n```\nubuntu $ | echo ABC\n```\n\nCommand Line - RESPONSE\n\n```\nABC\n```\n\n\
    # echo with variable\n\nWhen an argument is a variable, use $ before the variable.\
    \ the echo command returns an assigned string to the variable.\n\n# Command Line\
    \ - INPUT\n\n```\nubuntu $ | ABC=56\necho $ABC\n```\n\n# Command Line - RESPONSE\n\
    \n```\n56\n```\n\n# echo with string and variable\n\nYou can connect strings and\
    \ variables in the echo command.\n\n# Command Line - INPUT\n\n```\nubuntu $ |\
    \ ABC=56\nubuntu $ | echo ABC$ABC\n```\n\n# Command Line - RESPONSE\n\n```\nABC56\n\
    ```\n\n# \" \" double quotation and \" \" single quotation\n\nYou can connect\
    \ strings or variables with special characters or spaces with the \" \" or ' '\
    \ quotation; however, there is a slight difference.\n\n# \" \" double quotation\n\
    \nwith the \" \" quotation, variables are converted to assigned strings.\n\nCommand\
    \ Line - INPUT\n\n```\nubuntu $ | ABC=56\nubuntu $ | echo \"ABC$ABC ABC\"\n```\n\
    \n# Command Line - RESPONSE\n\n```\nABC56 ABC\n```\n\n# \" single quotation\n\n\
    with the ' quotation, variables are not converted to assigned strings. $ is considered\
    \ as a part of the strings.\n\n# Command Line - INPUT\n\n```\nubuntu $ | ABC=56\n\
    ubuntu $ | echo 'ABC$ABC ABC'\n```\n\n# Command Line - RESPONSE\n\n```\nABC$ABC\
    \ ABC\n```\n\n# read (Read and Store Input)\n\n```\nread [variable] \n[command\
    \ line input]\n```\n\n![](img/87e31443ff747018655a0f4f95ee6187_223_0.png)\n\n\
    The read command is used to read the contents of a line (from a command-line input\
    \ or a file) into a variable. The initial setting of the variable is $REPLY. If\
    \ the variable is not specified, $REPLY is used as a default variable.\n\n# read\
    \ command typical flow\n\nUnlike other commands, the read command is used in a\
    \ more interactive way.\n\nThere are three steps to use the read command.\n\n\
    # 1. Declare a variable\n\nBy running the read command, you can declare a variable.\
    \ If you don't specify it, $REPLY becomes the variable. After the declaration,\
    \ the command waits for the input of the variable.\n\nFor example, use ABC as\
    \ a variable. After the `enter` key is hit, the command line waits for command\
    \ line input.\n\n# Command Line - INPUT\n\n```\nubuntu $ | read ABC\n```\n\n#\
    \ 2. Make an input to the variable (assign value)\n\nAfter the variable is set,\
    \ you can make an input to the variable. For example, you can type `123` to assign\
    \ the value to the variable.\n\n# Command Line - INTERACTIVE\n\n```\n123\n```\n\
    \n# 3. Return an assigned value\n\nYou can use the variable in another command\
    \ such as the `echo` command to return the assigned value to the variable.\n\n\
    If you run the `echo` Command with $ABC, the command line returns the assigned\
    \ value 123.\n\n# Command Line - INPUT\n\n```\nubuntu $ | echo $ABC\n```\n\n#\
    \ Command Line - RESPONSE\n\n```\n123\n```\n\n# read command with a file input\n\
    \nYou can use a file for the `read` command input.\n\nFor example, we created\
    \ the `error.txt` file in the redirection section. We will use the file to demonstrate\
    \ how the command works. In the example below, you can see that the `read` command\
    \ reads the `error.txt` file and the `echo` command returns the content.\n\n#\
    \ Command Line - INPUT\n\n```\nubuntu $ | read ABC < error.txt\nubuntu $ | echo\
    \ $ABC\n```\n\n# Command Line - RESPONSE\n\n```\nls: cannot open directory '/lost+found':\
    \ Permission denied\n```\n\nFrom this example, you can also see that variable\
    \ ABC is overwritten by the new input.\n\n> Note: Multi-line text file\n\nThe\
    \ error.txt contains only one-line data; however, there are files with multiple\
    \ lines. If you use the read command with a multi-line text file as an input,\
    \ only the first line of the text file is the.\n\n# Shell Variable and Environmental\
    \ Variable\n\n| Shell Variable | Environmental Variable |\n| --- | --- |\n| Variable\
    \ defined for the current shell | Variable defined for the current shell is inherited\
    \ by any shells or processes.\n\n![](img/87e31443ff747018655a0f4f95ee6187_226_0.png)\n\
    \nThere are two types of variables in Linux - shell variables and environmental\
    \ variables. Shell variables are only defined for the current shell and the variables\
    \ cannot be used in other shells or processes. On the other hand, environmental\
    \ variables are variables that are also defined for other shells or processes,\
    \ and not just the current one.\n\n# Declaration of variables\n\nThe ways to declare\
    \ shell variables and environmental variables are different.\n\n**Shell variable:**\
    \ connect a variable and an assigned string with `=`. For example, `abc=2023`.\n\
    \n```\n[shell variable] = [assigned string]\n```\n\nEnvironmental variable: use\
    \ the export command and connect a variable and an assigned string with =. For\
    \ example, export ABC=1988.\n\n```\nexport [environmental variable] = [assigned\
    \ string]\n```\n\n# Inheritance of variables\n\nAs explained above, the key difference\
    \ occurs if the variables are inherited in child processes. To see the difference,\
    \ create two shell scripts.\n\nFirst, create a shell script for the parent process.\n\
    \n# Command Line - INPUT\n\n```\nubuntu $ vim variable_parent.sh\n```\n\nIn the\
    \ variable_parent.sh file, declare two types of variables.\n\n- abc: a shell variable\n\
    - ABC: an environmental variable\n\nIn the parent shell script below, we'll add\
    \ a command to run a child script (variable_child.sh).\n\n# variable_parent.sh\n\
    \n```bash\n#!/bin/bash\n#shell variable\nabc=2023\n#environmental variable\nexport\
    \ ABC=1988\necho \"A shell variable in the parent shell script\"\necho abc=$abc\n\
    echo \"An environmental variable in the parent shell script\"\necho ABC=\\$ABC\n\
    ```\n"
