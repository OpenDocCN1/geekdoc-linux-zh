- img_proc: true
  md: '# Special Characters and Escape Character


    | Special Characters | Description |

    | --- | --- |

    | / | Path Directory Separator |

    | . | Current Directory |

    | ~ | Home Directory |

    | # | Comment or Trim Strings |

    | <> | Input and Output Redirection |

    | | | Pipe |

    | ! | Pipeline logical NOT |

    | 0 | Group Commands - shellcheck |

    | | Group Commands - no shellcheck |

    | $ | Variable Expressions |

    | & | Background Process |

    | * | Character Sequence Wildcard |

    | [] | Character Set Wildcard |

    | ? | Single Character Wildcard |

    | ; | Shell Command Separator |


    ![](img/87e31443ff747018655a0f4f95ee6187_39_0.png)


    There are characters with special meanings assigned by Linux OS called **special
    characters**. You cannot use the characters in a file name or normal text sentence.
    If you want to use them without having a special meaning in a sentence, you need
    to use an **escape character**.


    In bash, **\backslash** is used as an escape character.


    For example, if you want to display the following sentence with the echo command,
    you may have difficulty showing "" (double quotes).


    He said "I''m learning Linux OS".


    With """ (double quotes) around the entire sentence in the command, you won''t
    get any returned value.


    Command Line - INPUT'
