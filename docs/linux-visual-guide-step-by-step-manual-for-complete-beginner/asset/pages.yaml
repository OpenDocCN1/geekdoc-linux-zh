    When there is no directory whose name is the same as the intended new file name,
    the `mv` command changes the file name as illustrated below.


    ![](img/87e31443ff747018655a0f4f95ee6187_68_0.png)


    When there is a directory whose name is the same as the intended new file name,
    the `mv` command moves the file to the directory as illustrated below.'
