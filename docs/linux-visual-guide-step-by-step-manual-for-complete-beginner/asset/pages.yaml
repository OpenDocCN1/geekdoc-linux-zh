- img_proc: true
  md: '# # What Is Service on Linux?


    +   Services on Linux

    - Services are processes that are usually called by other system processes to
    manage computer resources

    - Services usually run as daemons

    - Services can interact with each other without any human intervention


    Illustration of Services


    ![](img/87e31443ff747018655a0f4f95ee6187_321_0.png)


    There is a term service which is similar to the daemon. Services are processes
    that usually run in the background and respond to requests from other processes
    running on the same system or processes connected via a network. Many services
    usually run as daemons.


    A service can call another service without any human input. After a service calls
    another service, those services can interact with each other automatically (without
    any human intervention). How a service behaves is determined by its configuration
    file. On Linux OS, it is usually saved as a unit file in a certain directory under
    /usr/lib/systemd/system or /etc/systemd/system. Details will be explained in the
    next section.'
  merge: -1
  pgno: 321
- img_proc: true
  md: "# Systemd\n\n![](img/87e31443ff747018655a0f4f95ee6187_322_0.png)\n\n# What\
    \ is systemd?\n\nsystemd is a daemon (or a service) that manages other daemons\
    \ for Linux OS. When Linux OS starts or reboots, systemd also starts and continues\
    \ running to centrally control other daemons until the OS shuts down. You can\
    \ see how systemd is positioned in Linux OS by running the pstree command. The\
    \ pstree command shows current processes running on the OS in a hierarchical structure.\
    \ \n\n# Command Line - INPUT\n\n```\nubuntu@ip-172-26-0-53:~$ | pstree\n```\n\n\
    # Command Line - RESPONSE\n\n```\nsystemd—accounts-daemon—2*[(accounts-daemon)]\n\
    └acpid\n└2*[agetty]\n└amazon-ssm-agent—ssm-agent-worke—8*[[ssm-agent-worke]]\n\
    ```"
