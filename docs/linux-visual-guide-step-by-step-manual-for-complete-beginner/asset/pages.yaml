    option. It works as the OR function.


    If you want to find two different file names, you need to add the -name option
    both before and after the -o option. The following is an example of the command
    used to search documents named test or test_sub.


    # Command Line - INPUT


    ```

    ubuntu | find -name test -o -name test_sub

    ```


