  md: '# In (Create Link to File and Directory)


    | Symbolic link: | ln -s [file or directory path] [link name] |

    | Hard link: | ln [file or directory path] [link name] |


    ![](img/87e31443ff747018655a0f4f95ee6187_98_0.png)


    The in (LINK) command is used to create links to files or directories. There are
    two types of links in Linux - **symbolic link** and **hard link.**


    # Symbolic Link


    The symbolic link is an alias on Mac OS or a shortcut on Windows OS. It is linked
    with the original file or directory. Thus, when you delete the original file or
    directory, the symbolic link no longer works.


    # Creating a symbolic link


    To create a symbolic link, use the `in` command with the `-s` option. To see an
    example, create `file_a` first using the cat command.


    # Command Line - INPUT


    ```

    ubuntu $ | cat > file_a

    ```'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# Command Line - INTERACTIVE


    ```

    test test test

    ```


    After quitting the typing mode with `Ctrl+C` and running the `ln` command to create
    a symbolic link to `file_a`.


    # Command Line - INPUT


    ```

    ubuntu $ | ln -s file_a file_symbolic

    ```


    When you run the `ls -l` command, you can see file details. The first letter in
    the second row shows that it is a symbolic link and you can see that `file_symbolic`
    is linked with `file_a` under the name column.


    # Command Line - RESPONSE


    | total 0 |

    | -rw-rw-r-- 1 ubuntu ubuntu 0 Jan 9 06:47 file_a |

    | rwxrwxr-wx 1 ubuntu ubuntu 6 Jan 9 11:37 file_symbolic -> file_a |


    # Hard Link


    The concept of the hard link is a bit more complex. In the Linux file system,
    the actual data of each file is stored in a certain location on the hard disk.
    The location is described in the `inode` of each file. When you create a hard
    link of `file_a`, the link is connected to the inode of `file_a` directly. Thus,
    even if you delete `file_a`, still the file can exist unless all the hard links
    that are linked with the inode are deleted and no processes are using the data.


    # Creating a hard link


    To create a hard link, use the `ln` command without any option. To create `file_a`''s
    hard link named `file_hard` in the same directory, run the command below.


    # Command Line - INPUT


    ```

    ubuntu $ | ln file_a file_hard

    ```'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'When you run the ls -1 command, you can see file details. This time, there
    is no letter "I". Instead, the number after the access mode changed from 1 to
    2. This shows that there are two hard links to the file: file_a and file_hard.


    # Command Line - INPUT


    ```

    ubuntu $ | ls -1

    ```


    # Command Line - RESPONSE


    ```

    total 0

    -rw-rw-r-- 2 ubuntu ubuntu 0 Jan 06:47 file_a

    -rw-rw-r-- 2 ubuntu ubuntu 0 Jan 06:47 file_hard

    lrwxrxr-x 1 ubuntu ubuntu 6 Jan 11:37 file_symbolic -> file_a

    ```


    # You cannot create hard links to directories


    To avoid the circular reference issue, you cannot create a hard link to directories.
    If you try to make it, you''ll encounter an error message.


    # Command Line - INPUT


    ```

    ubuntu $ | ln dir_a dir_b

    ```


    # Command Line - RESPONSE


    ```

    ln: dir_a: hard link not allowed for directory

    ```


    # Deleting the original file


    When you delete the original file, you may see the difference between symbolic
    links and hard links. When you delete file_a, file_symbolic and file_hard are
    still shown in the current directory; however, when you check the contents of
    each file by running the cat command, you can see that file_symbolic no longer
    exists while file_hard shows the original contents of file_a.


    # Command Line - INPUT


    ```

    ubuntu $ | rm file_a

    ls

    ```


    # Command Line - RESPONSE'
