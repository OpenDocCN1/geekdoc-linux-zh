  md: '# # SCP (Secure Copy Protocol)


    ⬃ space


    | Local to Remote | Remote to Local |

    | :--- | :--- |

    | scp -i ① ② ③a 3b 3c | scp -i ① ② 2a 2b 2c ③ |

    | key info destination | key info source destination |

    | ① Private key file path (local) | ① Private key file path (local) |

    | ② Source file path (remote) | 2a User name (remote) |

    | ③ User name (remote) | 2b IP address (remote) |

    | 3b IP address (remote) | 2c Source file path (remote) |

    | 3c Destination directory path (remote) | ③ Destination directory path (local)
    |


    ![](img/87e31443ff747018655a0f4f95ee6187_283_0.png)


    SSH can be used not only for remote login but also for file transfer in a secure
    way. There are two protocols for transferring files with SSH - **SCP (Secure Copy
    Protocol)** and SFTP (Secure File Transfer Protocol). In this section, we''ll
    explain SCP.


    # ## Transferring from local to remote


    To transfer a file from the local computer to the remote server, the following
    five sets of information are needed for the SCP command.


    # ## Key file


    +   - **Private key file path** on your local computer (usually, under the .ssh
    directory)'
