  md: '# # Superuser (Root User) vs. Normal User


    ![](img/87e31443ff747018655a0f4f95ee6187_132_0.png)


    In Linux, there are two types of users - a **superuser** and a **normal user**.
    The superuser is a special user account used for system administration. The superuser
    has permissions for all Linux system resources while normal users have limited
    access to Linux system resources depending on the permission setting for each
    file and directory.


    # ## Superuser


    A superuser is a special user account used for system administration. It is also
    called **root**. As the default setting, the superuser is the owner of all system
    files and directories under the / (root) directory and has all permissions (read,
    write, and execute) for all system resources.


    # ## Normal users'
  merge: -1
