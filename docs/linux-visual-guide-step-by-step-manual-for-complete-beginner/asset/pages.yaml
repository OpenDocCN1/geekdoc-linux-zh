  md: '# Regular Expression


    ![](img/87e31443ff747018655a0f4f95ee6187_88_0.png)


    | Meta-Character | description |

    | ^ | begin with |

    | $ | end with |

    | [ | matches anything contained |

    | ] | matches anything NOT contained |

    | ^ | matches any character |

    | * | character(s) specified before * or no occurrence |


    **Regular Expression** is widely used in many programming languages. It is also
    called **regex** or **regexp**. Basically, it defines the pattern of strings with
    meta characters to effectively identify specific data in a data set.


    The **grep** command uses **regex** to specify a search string pattern. In this
    section, we''ll explain selected meta characters using the `grep` command. We
    use the same data set used in the previous section to show some examples.


    # ^ : begin with


    +   - defines data that begins with a specified string after ^. For example, to
    search the lines that begin with "I like a" in the data set prepared in the previous
    section, run the following command.


    **Command Line - INPUT**'
  merge: -1
  pgno: 88
- img_proc: true
  md: '```

    ubuntu $ | grep -r ^"I like a" test

    ```


    The command returns a line like the one below. The result doesn''t include the
    lines with "I like a" in the middle of the sentence.


    # Command Line - RESPONSE


    ```

    test/sample_1.txt:I like apples and he likes oranges

    ```


    # $ end with


    defines data that ends with a specified string before $. For example, to search
    the lines that end with "s bananas" in the data set prepared in the previous section,
    run the following command.


    # Command Line - INPUT


    ```

    ubuntu $ | grep -r "s bananas" test

    ```


    The command returns a result like the one below. The result doesn''t include the
    lines with "s bananas" in the middle of the sentence.


    # Command Line - RESPONSE


    ```

    test/sample_1.txt:I like grapes and he likes bananas

    test/sample_1.txt:He likes grapes and she likes bananas

    ```


    # [] matches anything contained


    +    defines one character that matches anything contained within the bracket.
    For example,


    +   [A-Z] : any uppercase alphabet character


    +   [a-z] : any lowercase alphabet character


    +   [0-9] : any single digit number


    For the data set prepared in the previous section, run the command below to see
    how [] works.


    # Command Line - INPUT'
  merge: -1
  pgno: 89
