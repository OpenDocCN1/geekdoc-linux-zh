    The config file for SSH is an extremely useful tool to speed up the SSH remote
    login process. By writing the following information in the config file, you can
    shorten the SSH command.


    # STEP 1. Describe SSH remote login key information in the config file under the
    .ssh directory


    Describe the following information in the config file. If the config file doesn''t
    exist, you can create a new one.


    +   - **Host** (SSH name): you can use any name to call the SSH configuration

    - **Hostname**: public IP address of the server that you want to connect to

    - **User**: user name of the server

    - **IdentityFile**: full path of the private key file for SSH remote login'
