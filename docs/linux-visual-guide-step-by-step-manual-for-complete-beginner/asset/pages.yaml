    |

    | - Install Apache using a package manager (e.g., apt for Ubuntu OS) | - Enable
    apache2 using the systemctl command | - Create and edit html files in /var/www/html
    directory | - Enable firewall (e.g., ufw) and allow ssh ports (80 and 22'') |


