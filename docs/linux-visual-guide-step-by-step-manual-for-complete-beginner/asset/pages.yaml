  md: '# sort (Sort File Contents)


    ![](img/87e31443ff747018655a0f4f95ee6187_77_0.png)


    The sort command is used to sort the content of a file. The command is often used
    with standard output redirection to save the output in another file.


    # Sort the content of a file in the command line


    If you don''t redirect the output of the command to a file, the command returns
    the output to itself.


    For example, we assume that you have the sample_sort.txt file with the contents
    like the one below.


    Command Line - INPUT


    ```

    ubuntu $ | cat sample_sort.txt

    ```


    Command Line - RESPONSE'
  merge: -1
  pgno: 77
- img_proc: true
  md: '```

    banana

    apple

    orange

    grapes

    ```


    When you run the sort command for the sample_sort.txt file, the sorted contents
    will be shown in the command line shown below.


    # Command Line -INPUT


    ```

    sort sample_sort.txt

    ```


    # Command Line - RESPONSE


    ```

    apple

    banana

    grapes

    orange

    ```


    # -r option: Reverse order


    When you use the -r option, the sorting order is reversed.


    For example, using the same sample_sort.txt file, run the sort -r command. The
    command line returns the list of items in a reverse alphabetical order as shown
    below.


    # Command Line -INPUT


    ```

    ubuntu $ | sort -r sample_sort.txt

    ```


    # Command Line - RESPONSE


    ```

    orange

    grapes

    banana

    apple

    ```


    # Redirect the output to another file


    The sort command won''t change the content of the file. It just gives sorted output
    in the command line as standard output.


    For example, you can confirm that the content of sample_sort.txt stays the same
    as the original one by running the cat command.'
  merge: -1
