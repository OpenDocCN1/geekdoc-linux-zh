  md: '# find (Find File and Directory)


    ```

    find [path to start] -name [file or directory name]

    ```


    ![](img/87e31443ff747018655a0f4f95ee6187_93_0.png)


    | Other Options | |

    |---||

    | -type | specify file type (e.g., f: normal file, d: directory, l: symbolic link,
    s: hard link) |

    | -size | search with size of document |

    | -empty | search empty document |

    | -o | or (combine two search criteria) |


    The `find` command is used to locate files or directories under the specified
    path.


    # Find with File or Directory Name


    Using a file or directory name is one of the frequently used approaches in the
    `find` command. Specify the file or directory name after the `-name` option.


    For example, to find the ssh key file named `authorized_keys`, you can run the
    command below.


    # Command Line - INPUT


    ```

    ubuntu $ | find -name authorized_keys

    ```


    The command returns the file path of the file like the one below.'
  merge: -1
  pgno: 93
- img_proc: true
  md: '# Command Line - RESPONSE


    ```

    /home/ubuntu/.ssh/authorized_keys

    ```


    # Find with Other Options


    There are many other approaches to finding files or directories. Here are the
    selected options for the fin command.


    # -type option


    You can specify what type of files or directories you are searching. To use the
    option, add the document type after the -type option. These are examples of the
    document type.


    +   - f: normal file

    - d: directory

    - l: symbolic link

    - s: hard link


    For example, to find a symbolic link whose name starts with "file" run the command
    below.


    # Command Line -INPUT


    ```

    ubuntu $ | find file* -type l

    ```


    # -size option


    You can also search files with the document data size. Specify the size that you
    are looking for.


    +   -size +10M: size is 10M or more than 10M

    -size 10M: size is 10M

    -size -10M: size is 10M or less than 10M


    # -empty option


    With this option, you can find empty documents only.'
