  md: '# Firewall


    ![](img/87e31443ff747018655a0f4f95ee6187_348_0.png)


    # Firewall


    | Firewall Hardware | Firewall Software on server |


    A firewall is a network security hardware device or software that monitors incoming
    and outgoing network traffic and permits or blocks data packets based on a set
    of security rules. Basically, you want to block malicious access or unnecessary
    access to avoid network security risks while allowing safe and legitimate traffic.
    In the Linux OS context, a firewall is a part of Linux services or a daemon process.


    # Four Types of Firewalls


    Firewalls can be categorized into four groups depending on their approaches to
    managing data traffic.'
  merge: -1
  pgno: 348
- img_proc: true
  md: '+   1. Packet Filtering

    2. Circuit Gateways

    3. Application Gateways

    4. MAC Layer Firewalls


    The most well-known approach is Packet Filtering. It mainly covers the Internet
    Layer but it can identify traffic based on the Transport Layer as well. Circuit
    Gateways cover the Transport Layer, and Application Gateways cover the Application
    Layer while MAC Layer Firewalls cover the Network Interface Layer.


    ![](img/87e31443ff747018655a0f4f95ee6187_349_0.png)


    # Netfilter


    Linux Kernel has its own network traffic management framework called Netfilter.
    Netfilter can be used for achieving several purposes - such as security enhancement
    and general network configurations - by managing network traffic, including packet
    filtering.


    # Netfilter backend tools'
  merge: -1
  pgno: 349
- img_proc: true
  md: 'As Netfilter is a framework (a set of rules), you need a tool to be able to
    utilize Netfilter. The most commonly used tool is **iptables**. An alternative
    to iptables is **nftables**. However, both tools are not easy to use.


    # Netfilter frontend tools


    To support backend tools, there are several frontend tools, which are more user-friendly.
    The frontend tools available differ by Linux distribution. For example, CentOS
    provides **firewalld** while Ubuntu provides UFW (Uncomplicated Firewall). Both
    programs run on Linux OS as a service or daemon process.'
  merge: -1
  pgno: 350
- img_proc: true
  md: '# # UFW (Uncomplicated Firewall)


    UFW Key Commands [xx] argument


    | 1. Check UFW Status | ufw status | ufw status verbose | ufw status numbered
    |

    | 2. Enable and Disable UFW | ufw enable | ufw disable |

    | 3. Default Policy | ufw default [allow or deny] |

    | 4. Allow or Deny Ports | ufw allow [port number] | ufw deny [port number] |

    | 5. Allow or Deny IP Addresses | ufw allow from [IP address] to [IP address or
    any] port [port number] |

    | 6. Delete | ufw delete [rule number] |


    The Linux kernel provides a packet filtering system called **netfilter**. Netfilter
    is usually controlled by the **iptables** commands. Using iptables, you can manage
    Netfilter in a flexible way; however, iptables are not easy to use. **UFW** (Uncomplicated
    Firewall) is a frontend program for iptables that provides an easy-to-use user
    interface for people who are not familiar with firewall concepts.


    # ## Overview of UFW


    There are six types of `ufw` commands.


    +   1. Check UFW Status

    2. Enable and Disable UFW'
  merge: -1
  pgno: 351
- img_proc: true
  md: '+   3. Default Policy Setting

    4. Allow or Deny Ports

    5. Allow or Deny IP Addresses

    6. Delete Policies


    To run ufw commands, you need the superuser privilege. For better operational
    efficiency, switch to the superuser for this section.


    # Command Line - INPUT


    ```

    ubuntu@ip-172-26-0-53:~# | sudo su -

    ```


    # 1. Check UFW Status


    As a default setting, UFW is not enabled yet, although the ufw.service daemon
    process may already be running. Check UFW status by running the ufw status command.


    # Command Line - INPUT


    ```

    root@ip-172-26-0-53:~# | ufw status

    ```


    # Command Line - RESPONSE


    ```

    Status: inactive

    ```


    # 2. Enable and Disable UFW


    To enable UFW, use the ufw enable command. There will be an alert about ssh connection.


    # Command Line - INPUT


    ```

    root@ip-172-26-0-53:~# | ufw enable

    ```


    # Command Line - RESPONSE


    ```

    Command may disrupt existing ssh connections. Proceed with operation (y|n)? y

    Firewall is active and enabled on system startup

    ```'
  merge: -1
  pgno: 352
- img_proc: true
  md: '# IMPORTANT


    As VPS or servers on the cloud are usually managed through SSH, you need to carefully
    manage the settings. The existing SSH session can be continued; however, as soon
    as the session ends, the firewall setting will be applied and there is a risk
    that you will not be able to connect to the server anymore.


    To avoid this risk, you need to allow SSH port 22 as soon as you enable UFW.


    Once UFW is enabled, you can check its status. Check the status using the ufw
    status verbose command time. This command will give you a more detailed status,
    including default policy status, which will be explained in the next section.


    # Command Line - INPUT


    ```

    root@ip-172-26-0-53:~ | ufw status verbose

    ```


    # Command Line - RESPONSE


    Status: active

    Logging: on (low)

    Default: deny (incoming), allow (outgoing), disabled (routed)

    New profiles: skip


    If you want to disable UFW, run the ufw disable command like shown below.


    # Command Line - INPUT


    ```

    root@ip-172-26-0-53:~ | ufw disable

    ```


    # Command Line - RESPONSE


    Firewall stopped and disabled on system startup


    # 3. Default Policy Setting'
  merge: -1
  pgno: 353
- img_proc: true
  md: 'The default policy is applied to all ports. As an initial setting, the incoming
    firewall policy is set as `deny`. This means all traffic to this server is denied
    regardless of ports. On the other hand, the outgoing traffic initial firewall
    policy is `allow`, which means outgoing traffic is allowed regardless of the ports.


    The default setting can be updated using the `ufw default` command. If you want
    to change the default policy to `allow`, run the command below.


    # Command Line - INPUT


    ```

    root@ip-172-26-0-53:~# | ufw default allow

    ```


    # Command Line - RESPONSE


    > Default incoming policy changed to ''allow''

    (be sure to update your rules accordingly)


    If you want to switch back to `deny`, run the command below.


    # Command Line - INPUT


    ```

    root@ip-172-26-0-53:~# | ufw default deny

    ```


    # Command Line - RESPONSE


    > Default incoming policy changed to ''deny''

    (be sure to update your rules accordingly)


    # 4. Allow or Deny Ports


    If the default is `deny`, you can list up ports (whitelist) using the `ufw allow`
    command. For example, if you want to `allow` port 22 for ssh, run the command
    below.


    # Command Line - INPUT


    ```

    root@ip-172-26-0-53:~# | ufw allow 22

    ```


    # Command Line - RESPONSE


    > Rules updated

    Rules updated (v6)


    You can also use a protocol name like `ssh` as an argument.'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# Command Line - INPUT


    ```

    root@ip-172-26-0-53:~# | ufw allow ssh

    ```


    # Note: Blacklist vs. Whitelist


    You can use allow as the default policy and list up ports as a blacklist; however,
    the whitelist approach, which is shown in the illustration below, is more common.


    ![](img/87e31443ff747018655a0f4f95ee6187_355_0.png)


    # 5. Allow or Deny IP Addresses


    You can also specify an IP address to block or allow. For example, if you want
    to allow access from network address "111.65.0.0/16" for HTTP, run the following
    command. The "any" part can be the host''s IP address.


    # Command Line - INPUT


    ```

    root@ip-172-26-0-53:~# | ufw allow from 111.65.0.0/16 to any port 80

    ```


    # 6. Delete Policies


    The policies listed can be deleted using the ufw delete command. For this command,
    you need to specify the number of the policy that you want to delete. You can
    check the policy number using the ufw status numbered command. If you don''t have
    many policies, you can also count from the top to find the number of the policy
    you want to delete.'
  merge: -1
  pgno: 355
- img_proc: true
  md: 'Check the policy number by running the ufw status numbered command when UFW
    is enabled.


    # Command Line - INPUT


    | root@ip-172-26-0-53:~# | ufw enable |

    | root@ip-172-26-0-53:~# | ufw status numbered |


    # Command Line - RESPONSE


    | To | Action | From |

    | --- | --- | --- |

    | [1] 22 | ALLOW IN | Anywhere |

    | [2] 80 | ALLOW IN | 111.65.0.0/16 |

    | [3] 22 (v6) | ALLOW IN | Anywhere (v6) |


    To delete a second policy, run the command below. The command will ask if you
    want to proceed. To delete, enter the 🔑 key.


    # Command Line - INPUT


    ```

    root@ip-172-26-0-53:~# | ufw delete 2

    ```


    # Command Line - INTERACTIVE


    Deleting:

    allow from 111.65.0.0/16 to any port 80

    Proceed with operation (y|n)? y

    Rule deleted


    Check the status to confirm that the policy has been deleted.


    # Command Line - INPUT


    ```

    root@ip-172-26-0-53:~# | ufw status

    ```


    # Command Line - RESPONSE


    | To | Action | From |

    | --- | --- | --- |

    | 22 | ALLOW | Anywhere |

    | 22 (v6) | ALLOW | Anywhere |'
  merge: -1
  pgno: 356
- img_proc: true
  md: '# Web Server


    ![](img/87e31443ff747018655a0f4f95ee6187_357_0.png)


    A web server is a software (or hardware that has web server software on it) that
    responds to client requests through the Internet using HTTP. In the Linux context,
    the web server runs as a service or daemon process.


    When a browser sends an HTTP request with a URL (Uniform Resource Locator) to
    the server, the web server handles requests and creates HTML responses with specified
    website resources including HTML, CSS, and Javascript documents with required
    image and media files.


    # Apache and Nginx


    There are two major web servers for Linux OS - Apache and Nginx. Both are open-source
    software and are available for free. According'
  merge: -1
  pgno: 357
- img_proc: true
  md: 'to W3Techs.com, more than 60% of all websites in the world were running on
    these two web servers as of February 2023.


    # Apache


    Apache used to be the most widely used web server software in the world until
    Nginx took its place in 2021. Apache adopts a module system. With Apache''s modules,
    users can easily add or remove functions and customize their server. Apache can
    handle both static and dynamic content without an additional application server.
    Although Apache covers more functions than Nginx, Apache tends to be slower and
    consumes more RAM space than Nginx.


    # Nginx


    Nginx was designed and developed to solve the C10K problem, which refers to the
    inability of a server to scale a large number (10K) of clients or connections
    (C). With a focus on static content handling, Nginx can be more scalable and faster
    than Apache. One major disadvantage of Nginx compared to Apache is that Nginx
    cannot handle dynamic content another application server to handle dynamic content.
    For Nginx, there is an enterprise version called Nginx Plus, which covers enterprise-grade
    features.'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# # Launch Apache Web Server


