  md: '# Wildcard


    > Wildcard

    symbol (or set of symbols) representing other characters


    The most commonly used wildcard


    ![](img/87e31443ff747018655a0f4f95ee6187_96_0.png)


    ![](img/87e31443ff747018655a0f4f95ee6187_96_1.png)


    any single or multiplencharacters


    any single character


    Example: ca*


    c?t


    "cat", "can", "caterpillar",

    "capital", etc.


    "cat", "cut", "cot", etc.


    Wildcard is a symbol (or a set of symbols) representing other characters.

    It is generally used for substituting any string or character.


    # Wildcard vs. Regular Expression


    Wildcard and regular expression look similar but they are different

    things. The definition of wildcard characters can differ by software while

    t definition of meta-characters in the regular expression is typically

    the same across different software.


    * (asterisk) and ? (question mark)


    +   * (asterisk) and ? (question mark) are the most commonly used

    wildcards. * represents any single or multiple characters while ?

    represents any single character.'
