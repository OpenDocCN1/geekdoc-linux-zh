  md: '# # What Are User, Group And Permission in Linux?


    ![](img/87e31443ff747018655a0f4f95ee6187_127_0.png)


    +   * All files and directories have permission settings (access modes) by user
    status

    * Superuser (root) has permissions for all files and directories


    # # Superuser (root user) vs. Normal user


    In Linux, there are two types of users - a **superuser** and a **normal user**.
    The superuser is a special user account used for system administration. The superuser
    has permissions for all Linux system resources while normal users have limited
    access to Linux system resources depending on the permission setting for each
    file and directory.


    # # File and Directory owner


    Each file or directory has an owner. Generally, the user who created the file
    or directory is the owner of the file or directory.'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# Group


    In Linux, you can manage users by group. File and directory permissions can be
    more efficient when users are registered in a certain group. There are two types
    of groups - **primary group** and **secondary group**. The primary group is used
    for the initial owner group when a new file or directory is created.


    # Owner Status


    There are three owner statuses of a file or directory.


    +   1. **Owner (of the file or directory)**: generally, the user who created the
    file or directory is the owner of the file or directory. You can change the owner
    by running the `chown` command.

    2. **Owner group**: generally, the owner''s primary group becomes the owner group
    of the file or directory. You can change the owner group by running the `chgrp`
    command.

    3. **Others**: users who are not in the owner group of the file or directory


    # Permission (Access Mode)


    Depending on the owner status of a file or directory, the accessibility of the
    file or directory can be different. This is called **permission** or **access
    mode**. When you run the `ls` command with the `-l` option, you can see the access
    mode of each file by user status.


    ```

    drwxr-xr-x 3 usr_a staff 4096 Jul 16 2020 media

    -drwxr-xr-x 15 usr_b staff 3180 Dec 21 12:53 sample.txt

    ```'
  merge: -1
  pgno: 128
- img_proc: true
  md: '# Permission (Access Mode) by Owner Status


    ```

    drw-r-x  3 usr_a staff 4096 Jul 16 2020 media

    ```


    ![](img/87e31443ff747018655a0f4f95ee6187_129_0.png)


    The ls -l command gives you the access mode information of a directory or file.
    Here are the key points of how to read the information.


    # Three User Types


    Based on the three owner statuses, the access mode is different for each one.
    By running the ls -l command, you''ll see 9 characters defining the access mode.


    +   - The first three letters: owner''s access mode

    - Next three letters: owner group''s access mode'
  merge: -1
