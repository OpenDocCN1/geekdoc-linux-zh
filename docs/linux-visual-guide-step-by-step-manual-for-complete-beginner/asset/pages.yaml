  md: '# # Shell Variable and Environmental Variable


    | Shell Variable | Environmental Variable |

    | --- | --- |

    | Variable defined for the current shell | Variable defined for the current shell
    is inherited by any child shells or processes.


    ![](img/87e31443ff747018655a0f4f95ee6187_226_0.png)


    There are two types of variables in Linux - shell variables and environmental
    variables. Shell variables are only defined for the current shell and the variables
    cannot be used in other shells or processes. On the other hand, environmental
    variables are variables that are also defined for other shells or processes, and
    not just the current one. The environmental variables are inherited by any child
    shells or processes.


    # ## Declaration of variables


    The ways to declare shell variables and environmental variables are different.


    **Shell variable:** connect a variable and an assigned string with `=`. For example,
    `abc=2023`.'
  merge: -1
