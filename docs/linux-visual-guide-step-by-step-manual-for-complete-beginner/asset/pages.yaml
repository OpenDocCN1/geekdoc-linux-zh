    To save the output in a file, you can use standard output redirection (refer to
    Chapter 5 Standard Input Output and Redirection). For example, you can run the
    command below to create a new file sample_sorted.txt with the sorted output.


    # Command Line - INPUT


    ```

    ubuntu $ | sort sample_sort.txt > sample_sorted.txt

    ```


    By running the cat command, you can confirm that a new file is created with the
