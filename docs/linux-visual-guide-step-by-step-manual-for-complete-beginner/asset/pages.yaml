    Press the i key to switch to the insert mode. Next, copy the code below and paste
    it into the file. After pasting the code, press the esc key followed by the :
    key and save the file by pressing the w + q keys. To learn how to use Vim, check
    Chapter 3. Vim Editor.


    loop.sh


    ```

    #!/bin/bash

    count=5000000

    while [ $count -ge 0 ]

    do

