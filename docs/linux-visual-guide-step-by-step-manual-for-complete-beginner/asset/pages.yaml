  md: '# Redirection of stderr (2> or 2>>)


    To redirect a standard error, use 2> or 2>> after a command followed by a new
    standard error.


    | overwrite contents: command 2> file path for error output |

    | append contents: command 2>> file path for error output |


    When you use 2>, the output will overwrite the existing contents while you use
    2>>, the output will be added at the end of the existing contents. To see how
    it works, run the command below as a normal user. As the normal user doesn''t
    have the read permission to the /lost+found directory, you''ll get an error message.


    # Command Line - INPUT


    ```

    ubuntu $ | ls /lost+found

    ```


    # Command Line - RESPONSE


    ```

    ls: cannot open directory ''/lost+found'': Permission denied

    ```


    If you want to redirect the error message to the error.txt file, run the same
    command with redirection. By running the cat command, you can see that the error
    message is saved in the error file.


    # Command Line - INPUT


    ```

    ubuntu $ | ls /lost+found 2> error.txt

    ubuntu $ | cat error.txt

    ```


    # Command Line - RESPONSE


    ```

    ls: cannot open directory ''/lost+found'': Permission denied

    ```


    # Redirection of stdout and stderr in the same file


    If you want to record standard output and error in the same file, use >& symbol.'
