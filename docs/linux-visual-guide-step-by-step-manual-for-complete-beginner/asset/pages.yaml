    # Units


    systemd manages and controls other processes through units. There are several
    types of units. Below are some examples.


    +   * .service: starts, stops, or reloads a service daemon

    * .socket: activates a service when the service receives incoming traffic on a
    listening socket

    * .path: activates and deactivates a service if a specified file or directory
    is accessed

    * .target: is a group of units

    * .timer: activates and deactivates a service with a timer


    # Unit files


    systemd starts, it triggers multiple units by loading unit files. Unit files are
    configuration files that contain directives for units. For example, when the unit
    will start, dependency on other units, which command will be triggered, etc.'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# Locations of unit files


    There are two major file locations for unit files. The unit files saved under
    these directories will be loaded by systemd, and systemd will follow the directives
    written in the unit files.


    +   * /usr/lib/systemd/system: default location for unit files. Original copies
    of unit files will be stored in this directory.

    * /etc/systemd/system: custom unit file location. If you have modified unit files,
    store them in this directory.


    When systemd loads unit files, the unit files in the /etc/systemd/system directory
    are prioritized. For example, if there are files with the same names in both directories,
    systemd prioritizes the unit file stored in the /etc/systemd/system directory.


    # systemctl


    Systemctl a command-line tool used to monitor and control systemd. It has sub-commands
    used to start, stop, restart, reload, enable, and disable units. systemctl is
    also used to show the statuses of units and unit files available in the system.


    # List unit files with ''systemctl list-unit-files''


    To view the list of unit files available in the system, run the following command.
