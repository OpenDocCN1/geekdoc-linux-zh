  md: '# Change the file or directory name


    You can also use the `mv` command, to change an existing file or directory name
    to a new name. The syntax structure is the same as the one to move a file or directory.
    The key difference is that the 2nd argument should be a name that you want to
    use for the file or directory.


    For example, if you run the same command as in the previous example when there
    is no `dir_a` directory, the file name of `file_a` becomes `dir_a`.


