  md: 'The meaning of * (asterisk) is different in a regular expression and a wildcard.


    In a wildcard, * means any character(s). The * is not related in any way to the
    character before it.


    In a regular expression, * has a relation with the character before *. For example,
    A* means A, AA, AAA, ..., or no occurrence.'
