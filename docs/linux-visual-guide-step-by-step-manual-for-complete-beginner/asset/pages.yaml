    Vim is an open-source Unix and Linux built-in text editor. It is also preinstalled
    in Mac OS. Vim is a contraction of Vi Improved (Vi is an earlier version of a
    Unix text editor).


    # CUI-based text editor


    Vim usually runs under the CUI (Character User Interface) environment. You can
    launch it from your command line. GUI-based text editors such as Visual Studio
    Code have been more popular recently; however, CUIbased editors are still useful,
    especially when you manage a remote server. You can launch a text editor from
    your command line connected to the remote server. A GUI-based text editor can
    be used for a remote server; however, you need to do additional settings. To learn
    how to set up Visual Studio Code for SSH remote login, check Chapter 7 SSH Remote
    Login with Visual Studio Code.'
