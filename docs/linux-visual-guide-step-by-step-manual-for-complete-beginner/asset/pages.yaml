  md: 'When you run the `su` command without any username, you can switch to the superuser.
    As the normal user usually doesn''t have the privilege to switch to the superuser,
    you need to add the "sudo" prefix when you run the `su` command.


    # Change user environment: " - - " option


    By adding the `- -` option, you can also change the user environment. For example,
    when you switch to the superuser with the `-` option, your command line''s current
    working directory changes to `/root` (root user''s home directory).


    # Switch back to the original user : exit


    To switch back to the original user, you can run the `exit` command. If you run
    the `su` command multiple times, you need to run the `exit` command the same number
    of times to go back to the original user.


