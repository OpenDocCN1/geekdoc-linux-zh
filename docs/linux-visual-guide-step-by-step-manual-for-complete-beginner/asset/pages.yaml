  md: '# Options


    There are many useful options for the grep command.


    # -r (recursive) option


    With the -r option, you can search a string or pattern in multiple files under
    a specified directory.


    For example, to search "He" under the test directory, run the command below.


    # Command Line - INPUT


    ```

    ubuntu $ grep -r He test

    ```


    The command returns multiple lines with the string "He" from multiple files. The
    file path is shown before each line like in the example below.


    # Command Line - RESPONSE


    ```

    test/sub/sample_2.txt:He likes the APPLE

    test/sub/sample_2.txt:He likes the ORANGE

    test/sub/sample_2.txt:He likes the GRAPES

    test/sub/sample_2.txt:He likes the BANANAS

    test/sample_1.txt:He likes apples and she likes oranges

    test/sample_1.txt:He likes oranges and she likes grapes

    test/sample_1.txt:He likes grapes and she likes bananas

    test/sample_1.txt:He likes bananas and I like apples

    ```


    # -i option


    The grep command differentiates upper and lower case characters; however, with
    the -i option, you can search a string regardless of upper or lower case.


    For example, to search "apple" regardless of lower case, run the command below.


    # Command Line - INPUT'
