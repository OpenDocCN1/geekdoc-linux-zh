  md: '# SSH Remote Login (2) - Use Key Pair Generated by Client


    ![](img/87e31443ff747018655a0f4f95ee6187_265_0.png)


    There are two major approaches to establishing an SSH remote connection:


    +   * 1) Use a key pair generated by the Server

    * 2) Use a key pair generated by the Client


    In this section, we''ll explain the second case, which is generally more complex
    than the first case.'
  merge: -1
  pgno: 265
- img_proc: true
  md: '![](img/87e31443ff747018655a0f4f95ee6187_266_0.png)


    # Key Steps


    # 1. Generate an SSH key pair on your local computer


    By running the following command, a key pair (**secret key and public key**) is
    generated.


    ```

    ssh-keygen -t rsa -C ["your email address"]

    ```


    When running the command, you''ll be asked to set a passphrase. Type your passphrase
    twice. Save the passphrase as it is used when you establish ssh connection. You
    can also skip setting a passphrase. In that case, just hit the `enter` key twice.


    **Note:** A passphrase is almost the same as a password, but unlike in a password,
    you can use spaces in it.


    # t and C options'
  merge: -1
  pgno: 266
- img_proc: true
  md: '-t option is used to set a security type. The default type is rsa.


    -C option is used to overwrite a comment in the key. As the default comment is
    username@hostname, it is good to overwrite the comment to avoid disclosing your
    hostname. Typically, an email address is used for the comment.


    # 2. Add a public key to your server


    Public key content is saved in the ~/.ssh/authorized_keys file on the Linux server.
    Copy the public key information and add the information into the authorized_keys
    file.


    There are several ways to share the public key. For AWS Lightsail, you can open
    the authorized_keys file through the browser-based SSH console, and save the public
    key information there.


    # 3. Run the SSH command from your local command line (on your local computer)


    Three sets of information are required to run the command


    +   1) private key file path


    +   2) user name of your server


    +   3) public IP address of your server


