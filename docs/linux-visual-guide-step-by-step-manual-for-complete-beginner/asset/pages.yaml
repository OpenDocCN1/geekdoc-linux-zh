    # Note: inode and inode number


    In the Linux file system, the actual contents of each file are stored at a certain
    disk block location on the hard disk. **inode**, or **Index NODE**, is a unique
    identifier used to keep track of all the files'' and directories'' data locations.
    Each inode is managed by an **inode number**. When you make a hard link, it records
    the inode number of the original file.'
