  md: '# Process and Job


    Terminal A (Shell A)


    ![](img/87e31443ff747018655a0f4f95ee6187_304_0.png)


    Terminal B (Shell B)


    ![](img/87e31443ff747018655a0f4f95ee6187_304_1.png)


    +   * Jobs are processes generated by a terminal (shell)

    * Processes are any programs running on a computer


    Processes and jobs sound similar; however, they are different concepts. Jobs are
    processes generated by a terminal (shell) while processes are any programs running
    on a computer. In other words, jobs are defined from a user point of view while
    processes are defined from an operating system point of view.


    # Job ID


    Jobs are separately managed by each terminal. As Linux is a multi-user operating
    system, the same system can be accessed by multiple terminals. Each job generated
    by a terminal has a unique ID called job ID. It is unique within the same terminal
    but the same ID number can be used for other terminals.'
  merge: -1
  pgno: 304
- img_proc: true
  md: '# Process ID


    Each process also has a unique ID called process ID. Each process within the same
    operating system (unique even among different terminals connecting to the same
    operating system). When a job is created, a process ID is assigned to the job.
    Thus, you can manage the job using either job ID or process ID. Process IDs are
    also assigned to system-generated processes which don''t have job IDs.


    ![](img/87e31443ff747018655a0f4f95ee6187_305_0.png)'
  merge: -1
  pgno: 305
- img_proc: true
  md: '# Foreground and Background Jobs


    +   Background Jobs

    - Jobs running in the background

    - Multiple jobs can be running at the same time

    - Run a command with & at the end to start a job


    +   Foreground Job

    - Jobs running on a terminal

    - Only one job can be running at the same time

    - Run a command in a usual way to start a job


    ![](img/87e31443ff747018655a0f4f95ee6187_306_0.png)


    There are two types of jobs. Oe is a job running as it connects with a terminal
    - called a foreground job. The other is a job running in the background called
    a background job. Understanding the concepts is important for managing multi-tasking
    jobs.


    # Foreground Job


    When you run a command on a terminal, usually it is executed as a foreground job.
    As one terminal has only one command line, only one job can be running at the
    same time.


    When you execute only a single command, usually the computer completes the process
    within a second. This makes it harder for us to see the difference between foreground
    jobs and background jobs. To see the difference clearly, try a practice task below.'
  merge: -1
  pgno: 306
