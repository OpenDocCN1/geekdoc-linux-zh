  md: "# # Apache2 Ubuntu Default Page\n\nThis is the default page used to test the\
    \ operation of the Apache2 server after installation on Ubuntu systems. It is\
    \ based on the equivalent page on Debian, which means that the Apache HTTP server\
    \ installed at this site is working properly. You should replace this file (at\
    \ /var/www/html/index.html) before continuing to configure your server.\n\nIf\
    \ you are a normal user of this web site and don't know what this page is about,\
    \ this is that the site is currently unavailable due to maintenance. If the problem\
    \ persists, please contact the site's administrator.\n\nUbuntu's default configuration\
    \ is different from the upstream configuration, and is split into several files\
    \ for interaction with modules. The configuration is fully documented in /var/share/apache2/README.Debian.gz.\
    \ Refer to this file for documentation about the server, which can be found by\
    \ accessing the manual if the apache2-package was installed on the server.\n\n\
    The configuration layout for an Apache2 server installation on Ubuntu systems\
    \ is as follows:\n\n```\n/etc/apache2/\n  ├── ports.conf\n  ├── modules-enabled/\n\
    \  │    └── dir.conf\n  ├── conf-enabled/\n  │    └── apache2.conf\n  └── sites-enabled/\n\
    \       └── 000-default.conf\n  ports.conf\n```\n\n+   * apache2.conf is the main\
    \ configuration file. It puts the pieces together by including all remaining configuration\
    \ files when starting up the web server.\n* ports.conf is always included from\
    \ the main configuration file. It is used to determine the listening ports for\
    \ incoming connections, and this can be customized.\n\nThis document is the index.html\
    \ file found in /var/www/html, which is a directory used to store website documents\
    \ that will be hosted by the Apache web server.\n\nAfter moving to the directory,\
    \ run the ls command. You can find the index.html file in the directory.\n\n#\
    \ ## Command Line - INPUT\n\n```\nubuntu@ip-172-26-0-53:~$ cd /var/www/html\n\
    ubuntu@ip-172-26-0-53:~$ ls\n```\n\n# ## Command Line - RESPONSE\n\n```\nindex.html\n\
    ```\n\n# ## Step 3. Place Website files\n\nTo host your website on the server,\
