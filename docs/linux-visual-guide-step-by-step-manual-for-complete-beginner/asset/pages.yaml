  md: '# SSH (Secure Shell)


    ![](img/87e31443ff747018655a0f4f95ee6187_253_0.png)


    # SSH Use Cases


    SSH (Secure Shell) is a network communication protocol that enables two computers
    to communicate in a secure way. SSH uses both password authentication and public
    key authentication. Typically, user authentication is done through public key
    authentication. After user authentication is done, SSH shifts to password authentication.


    # Public Key Authentication


    While conventional encryption technology uses only a single key for both encryption
    and decryption (Symmetric Encryption), Public-key Authentication uses a key pair
    (Private Key and Public Key for Asymmetric Encryption). In Public-key Authentication,
    a public key can be shared with anyone while a private key is kept secret (a'
  merge: -1
  pgno: 253
- img_proc: true
  md: 'private key is also called a secret key). The encryption of a message or data
    is done with the public key, and only the private key can decrypt the message
    or data.


    ![](img/87e31443ff747018655a0f4f95ee6187_254_0.png)


    # SSH use cases - Remote Login and Secure File Transfer


    There are two major use cases for SSH - **Remote Login** and **Secure File Transfer**.
    SSH remote login is widely used to manage servers remotely. It is also used for
    several cloud services such as AWS, Azure, and GCP. You can use SSH to connect
    to git remote repository services such as GitHub. SSH is also used for file transfer
    in a more secure way. There are two major commands for executing file transfer
    with SSH - **SCP** and **SFTP.**'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# Locate .ssh Directory


    ![](img/87e31443ff747018655a0f4f95ee6187_255_0.png)


    Understanding the .ssh directory on your local computer is important for starting
    SSH remote login. Usually, key pairs, the established host information document,
    and the configuration document are saved under this directory.


    # Location of .ssh directory


    The .ssh directory is located under your home directory.


    > The .ssh directory is hidden on Mac. In order to display the directory, you
    need to press the shift + command keys on Mac OS.'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# Key files under .ssh directory


    Initially, no file is located in this directory; however, there are three types
    of important files that will be created under this directory.


    # key files


    In the case of key pair generation (public key and secret key), usually, the key
    pair is generated in this directory unless you specify another path when generating
    the key pair. The default file names for RSA (a type of encryption technology)
    are id_rsa (secret key) and id_rsa.pub (public key). You can change the name of
    the key pair to manage multiple key pairs.


    Also, when you download a private key from a server or cloud service, usually,
    you''ll usually save the key under this directory. The key file type can be different
    from the type of the key file you generate on your computer. e.g., xxx.pem


    # config file


    The config file is very useful. You can write multiple SSH configurations so that
    you can build quick access to each SSH server with a simple command. How to write
    the config file will be explained later.


    # known_hosts


    The known_hosts file is an auto-generated file. Once you establish a new SSH remote
    connection, the public key information is recorded in this file and it is used
    for the authentication process afterwards.'
  merge: -1
  pgno: 256
