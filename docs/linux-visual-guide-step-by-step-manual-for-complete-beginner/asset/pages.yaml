- img_proc: true
  md: '```

    [shell variable] = [assigned string]

    ```


    Environmental variable: use the export command and connect a variable and an assigned
    string with =. For example, export ABC=1988.


    ```

    export [environmental variable] = [assigned string]

    ```


    # Inheritance of variables


    As explained above, the key difference occurs if the variables are inherited in
    child processes. To see the difference, create two shell scripts.


    First, create a shell script for the parent process.


    # Command Line - INPUT


    ```

    ubuntu $ vim variable_parent.sh

    ```


    In the variable_parent.sh file, declare two types of variables.


    +   * abc: a shell variable

    * ABC: an environmental variable


    In the parent shell script below, we''ll add a command to run a child script (variable_child.sh).


    # variable_parent.sh


    ```

    #!/bin/bash

    #shell variable

    abc=2023

    #environmental variable

    export ABC=1988

    echo "A shell variable in the parent shell script"

    echo abc=$abc

    echo "An environmental variable in the parent shell script"

    echo ABC=\$ABC

    ```'
