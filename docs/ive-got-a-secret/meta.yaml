  md: '![](img/3692bd9f13f40e4786591690d4b6f5a8_32_0.png)


    # TO JADE FROM MOM & DAD


    Dear Jade,


    We know that having diabetes is not always easy. However, a positive mental attitude
    like the one you have, can overtake any obstacle that jumps in your way. Having
    this disease has given our family an unforeseen perspective in the value of each
    day. We also want you to know that we share your struggles with you. You are very
    strong willed with regards to the demands that diabetes has put on you.


    ![](img/3692bd9f13f40e4786591690d4b6f5a8_32_1.png)


    If we could take your illness upon ourselves we would. Our hearts ache for you
    each time you stick your lovely skin with a needle. If we could simply take it
    all away, we would. We believe your strong character and spirit will help you
    through and enable you to lead a happy, healthy, and productive life. If there
    are ever times in the future when you''re not feeling well, remember we love you.
    We will always be there for you. Your brother and sister will also be there for
    you. There are many family members and friends that believe in you and love you.
    When you need a shoulder to cry on, you may find you have more shoulders than
    tears to go around.


    Our hopes are that you continue on this solid ground of courageousness, and care
    for yourself into adulthood with as much maturity as you show today.


    ![](img/3692bd9f13f40e4786591690d4b6f5a8_32_2.png)


    Darling Jade Girl, you are a very special person. We are proud to be your parents.
    You are contributing more than the proceeds from this book to find a cure, you
    are contributing yourself.


    All Our Love, MOM & DAD'
