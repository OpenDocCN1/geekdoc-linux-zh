  md: '# FACTS ABOUT DIABETES


    There are two different types of diabetes, Type 1, sometimes called juvenile diabetes
    or insulin dependent diabetes, and Type 2 sometimes called adult onset or non-insulin
    dependent diabetes.


    In Type 1 diabetes the organ that usually makes insulin, the pancreas, simply
    stops making insulin. Without insulin, your body cannot function. Treatment includes
    replacing the absent insulin by giving insulin shots. In Type 2 diabetes, the
    body has some insulin, but the insulin doesn''t seem to be working as it should.
    Type 2 is much more common than Type 1, and is treated differently. Treatment
    for Type 2 includes diet control, exercise, and sometimes oral medication. Occasionally,
    Type 2 diabetics will also need insulin.


    Type 1 diabetes is one of the most common chronic disease of youth. Experts estimate
    that every day 35 children in this country are newly diagnosed. No one knows exactly
    what causes Type 1 diabetes. Many experts believe that some people have a genetic
    make up that leaves them more likely to get diabetes. An environmental trigger
    (such as an unidentified virus infection) is then believed to stimulate the body
    to develop antibodies against the insulin producing part of the pancreas. The
    body then attacks itself and the insulin making cells are destroyed.


    There are several ways researchers are looking to cure diabetes. These include
    pancreas transplants, gene therapy, and stem cell research. Scientists are making
    huge strides towards a cure every day. With your support, we are even closer to
    a cure.


    ![](img/3692bd9f13f40e4786591690d4b6f5a8_31_0.png)'
