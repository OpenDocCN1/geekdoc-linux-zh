- img_proc: true
  md: '# HOW IT ALL STARTED


    Hello! My name is Jade, I am nine years old and I have diabetes.


    ![](img/3692bd9f13f40e4786591690d4b6f5a8_5_0.png)


    ![](img/3692bd9f13f40e4786591690d4b6f5a8_5_1.png)'
  merge: -1
  pgno: 5
- img_proc: true
  md: '![](img/3692bd9f13f40e4786591690d4b6f5a8_6_0.png)


    ![](img/3692bd9f13f40e4786591690d4b6f5a8_6_1.png)


    One day my third grade class was going on a field trip. I was feeling fine until
    I had to go to the bathroom really, really bad. So bad, I did not make it to the
    bathroom. I was very embarrassed. Luckily my Mom was there and we pretended that
    I spilled my pop in my lap. On the way home from the field trip I had another
    accident. My Mom thought I had a bladder infection so she took me right from school
    to the doctor.'
  merge: -1
  pgno: 6
- img_proc: true
  md: '# AT THE DOCTOR


    When I went to the doctor,

    first I had to do a urine test,

    then they wanted to use a

    needle and get some blood to

    do a test. I was very mad

    because my Mom told me that

    I would not have to get a shot

    but just have my urine tested.

    Needles really scared me!


    ![](img/3692bd9f13f40e4786591690d4b6f5a8_7_0.png)


    ![](img/3692bd9f13f40e4786591690d4b6f5a8_7_1.png)


    ![](img/3692bd9f13f40e4786591690d4b6f5a8_7_2.png)


    ![](img/3692bd9f13f40e4786591690d4b6f5a8_7_3.png)


    ![](img/3692bd9f13f40e4786591690d4b6f5a8_7_4.png)'
  merge: -1
  pgno: 7
- img_proc: true
  md: '![](img/3692bd9f13f40e4786591690d4b6f5a8_8_0.png)


    Then the doctor and nurses came and told us that my blood sugar was 450 and I
    had Type 1 diabetes. I did not know what that meant but my Mom was crying, my
    Dad was quiet and I was very, very scared.


    Dr. Ira looked sad and told us we needed to go right to the hospital.


    ![](img/3692bd9f13f40e4786591690d4b6f5a8_8_1.png)'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# # AT THE HOSPITAL


    ![](img/3692bd9f13f40e4786591690d4b6f5a8_9_0.png)


    At the hospital they told me I had to stay five days. They told me it was because
    of my diabetes that I had to go to the bathroom so bad. They also told me that
    I had to have shots twice a day, every day! The doctors said I had to check my
    blood sugar with a finger prick four times a day! I started to cry. My Mom and
    Dad hugged me.


    The next three days we learned all about diabetes, insulin and blood sugar. Your
    body needs sugar to keep going; in fact most of what you eat is turned into sugar
    for your body to use. When your blood sugar is too high, you may have lots of
    problems like blurry eyes, and it makes you go to the bathroom a lot. If it gets
    too high, you can become very, very sick. When your blood sugar is too low, your
    body can''t keep going and you might pass out. If your blood sugar is too low,
    it can hurt your brain.


    Insulin is something your body makes that helps control your blood sugar. Because
    of my diabetes, my body can''t make the insulin I need. That''s why I need to
    take insulin shots. I need to check my blood sugar so that I get just the right
    amount of insulin my body needs.


    The nurses were very nice. They taught me how to do my own finger pricks and it
    was no big deal. Soon it was time to go home and I was so happy to get out of
    the hospital.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '![](img/3692bd9f13f40e4786591690d4b6f5a8_10_0.png)


    ![](img/3692bd9f13f40e4786591690d4b6f5a8_10_1.png)


    One of the most important things that I learned was that I am not alone. A lot
    of other kids my age have diabetes too. Every day 35 children in America find
    out that they have diabetes.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# LIVING DAILY WITH DIABETES


    ![](img/3692bd9f13f40e4786591690d4b6f5a8_11_0.png)


    Since I''ve come home we have made a lot of changes in the way we eat. We have
    to make sure we time my snacks and meals to help keep my blood sugar OK.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '![](img/3692bd9f13f40e4786591690d4b6f5a8_12_0.png)


    Each day I know that God watches over me and I pray that God keeps me healthy.


    ![](img/3692bd9f13f40e4786591690d4b6f5a8_12_1.png)


    My Mom and Dad got me a real cool gold medical alert bracelet. My bracelet lets
    people know that I have diabetes and it tells them important medical stuff about
    me. It''s important to let other people know about my diabetes because I may get
    sick if my blood sugar is too high or too low.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# # ON VACATION WITH DIABETES


    ![](img/3692bd9f13f40e4786591690d4b6f5a8_13_0.png)


    ![](img/3692bd9f13f40e4786591690d4b6f5a8_13_1.png)


    ![](img/3692bd9f13f40e4786591690d4b6f5a8_13_2.png)'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'During summer vacation, only one month after I found out that I had diabetes,
    I went to Jamaica with my family. In Jamaica, I swam in the pool, went snorkeling
    in the ocean, climbed up Dunn''s River Falls, got my hair braided, played tennis,
    played on the playground, tye-dyed T-shirts and a whole bunch of stuff. My friend
    Mary Loretta also went to Jamaica. She watched me take my shots and do my finger
    pricks every day. Having diabetes is no big deal when you are on vacation.


    ![](img/3692bd9f13f40e4786591690d4b6f5a8_14_0.png)


