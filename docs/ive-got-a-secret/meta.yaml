  md: '# HAVING A DIABETIC REACTION


    Sometimes I get

    real bad headaches

    and I get cranky

    too. That''s when

    my Mom tells me to

    check my blood

    sugar to see if it

    is OK.


    ![](img/3692bd9f13f40e4786591690d4b6f5a8_17_0.png)'
