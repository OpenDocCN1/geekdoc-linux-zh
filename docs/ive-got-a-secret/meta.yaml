    ## 《我有个小秘密！》

    **作者：** 杰德·伊丽莎白·甘伯

    **编辑：** 夏琳·巴布科克·欧文 医学博士，美国急诊医师学会会员（FACEP）

    ### 照片提供：

    - 玛丽·欧文

    - 朱莉/吉姆·甘伯

    - 莉兹·霍洛瓦蒂

    ### 插图绘制：

    - 杰德·E·甘伯

    - 珍娜·L·甘伯

    - 丹尼尔·S·欧文

    - 米歇尔·D·欧文

    ### 平面设计：里克·J·里茨/BigHead 工作室


    ## 《我有个小秘密！》

    ## 献辞：献给我的肖恩阿姨


    ## 一切的由来

    你好！我叫杰德，今年九岁，患有糖尿病。有一天我三年级班级要组织外出游学。我本来感觉还好，直到我突然非常迫切想上洗手间，急到我根本没能赶去洗手间，当时特别尴尬。幸运的是我妈妈在场，我们假装我把汽水撒在了腿上。游学回家的路上我又出了意外，妈妈以为我得了膀胱感染，直接带我离开学校去了医院。


    ## 看诊时

    去看医生的时候，首先我得做尿检，然后他们要抽血做检测。我当时特别生气，因为妈妈告诉我只用做尿检，不用打针，我特别怕针头！后来医生和护士过来告诉我们，我的血糖值是450，确诊为1型糖尿病。我当时不知道这意味着什么，只见妈妈在哭，爸爸沉默不语，我特别害怕。艾拉医生看起来很伤心，告诉我们得立刻去医院。


    ### 住院期间

    到医院后他们说我得住院五天，频繁想上厕所都是糖尿病导致的。他们还说我每天得打两次胰岛素针，天天如此；每天还得扎四次手指测血糖！我一下子哭了出来，爸爸妈妈抱了抱我。接下来的三天我们学习了所有关于糖尿病、胰岛素和血糖的知识：你的身体需要糖分维持运转，吃的大部分食物都会被转化成身体可用的糖分；如果血糖过高，可能出现视力模糊、频繁上厕所等问题，继续升高甚至会引发重症；如果血糖过低，身体会无法正常运转，甚至可能晕倒，还会损伤大脑。胰岛素是身体分泌的、能帮助控制血糖的物质，因为我得了糖尿病，身体无法分泌所需胰岛素，所以得注射胰岛素，还要定期测血糖，才能注射身体所需的适量胰岛素。护士们都特别好，教我怎么自己扎手指测血糖，这根本没什么大不了的。很快到了出院的时间，我特别开心能离开医院。我学到的最重要的一点是，我并不是孤单一人，很多同龄孩子也患有糖尿病，美国每天有35个孩子确诊糖尿病。


    ## 日常与糖尿病共存

    自从回家后，我们调整了很多饮食习惯，会合理安排我的加餐和正餐时间，帮助维持血糖稳定。每天我都知道上帝在庇佑我，祈祷自己保持健康。爸爸妈妈给我买了一枚特别酷的金色医疗警报手环，能让别人知道我患有糖尿病，还能告知他人我的重要医疗信息。让周围人知道我的糖尿病情况很重要，因为如果血糖过高或过低，我可能会突发疾病。


    ### 和糖尿病一起度假

    暑假的时候，也就是我确诊糖尿病后仅仅一个月，我就和家人去了牙买加。在那里我在泳池里游泳，去海里浮潜，攀登邓恩河瀑布，编了辫子，打网球，在游乐场玩耍，扎染T恤，还做了好多别的事。我的朋友玛丽·洛雷塔也去了牙买加，她每天看着我打针、扎手指测血糖。度假的时候，有糖尿病根本不是什么大事。


    ### 当少年伴娘

    确诊糖尿病后大约两个月，我参加了一场婚礼，给我的保姆贝基当少年伴娘。婚宴上我得打一针，然后我就跳啊……跳啊！！太开心了！


    ## 出现糖尿病急性反应

    有时候我会头疼得特别厉害，还会变得烦躁易怒，这时候妈妈就会让我测血糖看看是否正常。如果血糖过高或过低，我可能会病得很重，所以我们每天至少得扎四次手指测血糖。如果血糖太低，我得吃点含糖的东西；如果太高，我可能需要注射更多的胰岛素。


    ## 自己给自己打针

    确诊糖尿病三个月后，我那天心情不好，和爸爸妈妈吵了一架，跑上楼回了房间。爸爸上楼来说：“该打针了，杰德。”我没好气地说：“我自己打！”我有点害怕，但我做到了！

    '
