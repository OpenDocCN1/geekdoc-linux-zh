    ## I''ve got a Secret!

    **BY:** Jade Elizabeth Gamber

    **EDITED BY:** Charlene Babcock Irvin, MD, FACEP


    ### PHOTOS BY:

    - Marie Irvin

    - Julie/Jim Gamber

    - Liz Holowaty


    ### ILLUSTRATIONS BY:

    - Jade E. Gamber

    - Jenna L. Gamber

    - Daniel S. Irvin

    - Michelle D. Irvin


    ### GRAPHIC DESIGN BY: Rick J. Ritts/BigHead Studios


    ## I''ve got a Secret!


    ## DEDICATED TO:

    My Aunt Shawn


    ## HOW IT ALL STARTED

    Hello! My name is Jade, I am nine years old and I have diabetes.


    One day my third grade class was going on a field trip. I was feeling fine until
    I had to go to the bathroom really, really bad. So bad, I did not make it to the
    bathroom. I was very embarrassed. Luckily my Mom was there and we pretended that
    I spilled my pop in my lap. On the way home from the field trip I had another
    accident. My Mom thought I had a bladder infection so she took me right from school
    to the doctor.


    ## AT THE DOCTOR

    When I went to the doctor, first I had to do a urine test, then they wanted to
    use a needle and get some blood to do a test. I was very mad because my Mom told
    me that I would not have to get a shot but just have my urine tested. Needles
    really scared me!


    Then the doctor and nurses came and told us that my blood sugar was 450 and I
    had Type 1 diabetes. I did not know what that meant but my Mom was crying, my
    Dad was quiet and I was very, very scared. Dr. Ira looked sad and told us we needed
    to go right to the hospital.


    ### AT THE HOSPITAL

    At the hospital they told me I had to stay five days. They told me it was because
    of my diabetes that I had to go to the bathroom so bad. They also told me that
    I had to have shots twice a day, every day! The doctors said I had to check my
    blood sugar with a finger prick four times a day! I started to cry. My Mom and
    Dad hugged me. The next three days we learned all about diabetes, insulin and
    blood sugar. Your body needs sugar to keep going; in fact most of what you eat
    is turned into sugar for your body to use. When your blood sugar is too high,
    you may have lots of problems like blurry eyes, and it makes you go to the bathroom
    a lot. If it gets too high, you can become very, very sick. When your blood sugar
    is too low, your body can''t keep going and you might pass out. If your blood
    sugar is too low, it can hurt your brain. Insulin is something your body makes
    that helps control your blood sugar. Because of my diabetes, my body can''t make
    the insulin I need. That''s why I need to take insulin shots. I need to check
    my blood sugar so that I get just the right amount of insulin my body needs. The
    nurses were very nice. They taught me how to do my own finger pricks and it was
    no big deal. Soon it was time to go home and I was so happy to get out of the
    hospital.


    One of the most important things that I learned was that I am not alone. A lot
    of other kids my age have diabetes too. Every day 35 children in America find
    out that they have diabetes.


    ## LIVING DAILY WITH DIABETES

    Since I''ve come home we have made a lot of changes in the way we eat. We have
    to make sure we time my snacks and meals to help keep my blood sugar OK.


    Each day I know that God watches over me and I pray that God keeps me healthy.
    My Mom and Dad got me a real cool gold medical alert bracelet. My bracelet lets
    people know that I have diabetes and it tells them important medical stuff about
    me. It''s important to let other people know about my diabetes because I may get
    sick if my blood sugar is too high or too low.


    ### ON VACATION WITH DIABETES

    During summer vacation, only one month after I found out that I had diabetes,
    I went to Jamaica with my family. In Jamaica, I swam in the pool, went snorkeling
    in the ocean, climbed up Dunn''s River Falls, got my hair braided, played tennis,
    played on the playground, tie-dyed T-shirts and a whole bunch of stuff. My friend
    Mary Loretta also went to Jamaica. She watched me take my shots and do my finger
    pricks every day. Having diabetes is no big deal when you are on vacation.


    ### BEING A JUNIOR BRIDESMAID

    About two months after I found out that I had diabetes, I was in a wedding. I
    was a junior bridesmaid for my babysitter Becki. I had to do my shot at the wedding
    reception. Then I danced . . .


    ... and danced!! It was so much fun!


    ## HAVING A DIABETIC REACTION

    Sometimes I get real bad headaches and I get cranky too. That''s when my Mom tells
    me to check my blood sugar to see if it is OK.


    I can get very sick if my blood sugar gets too high or too low. That''s why we
    need to do finger pricks at least four times a day to check my blood sugar. If
    my blood sugar is too low, I need to eat something with sugar in it. If it is
    too high, I may need more insulin.


    ## GIVING MY OWN SHOT

    Three months after I was diagnosed with diabetes I was having a bad day and got
    into a fight with my Mom and Dad. I ran upstairs to my room. My Dad came up and
    said, "It''s time to take your shot, Jade." I said, "I''ll do it!," meanly. I
    was kind of scared but I did it!'
