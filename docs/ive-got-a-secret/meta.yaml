  md: '![](img/3692bd9f13f40e4786591690d4b6f5a8_35_0.png)


    # **I''ve got a Secret!**


    ![](img/3692bd9f13f40e4786591690d4b6f5a8_35_1.png)


    Newly diagnosed children with diabetes, and even friends and classmates of diabetic
    children want to hear the "real stuff" from someone who has been there, someone
    who has actually dealt with the fear and reality of diabetes.


    Jade, a nine-year-old girl with diabetes, wrote this book based on her actual
    experiences as a newly diagnosed diabetic. This real life story tells what it''s
    like for a child living with diabetes, learning to cope with the many challenges,
    and going on to enjoy all the great experiences life has to offer.


    Jade will be donating all profits from this book to diabetes research.


    For additional copies, contact:


