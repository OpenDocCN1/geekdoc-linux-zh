    现在我已经可以每天自己给自己打针啦！

    ## 上学

    上学的时候，我的朋友莱利每天都会陪我在午饭前测血糖。我已经把所有关于糖尿病的知识都教给莱利了。

    ## 在外过夜

    我第一次离家过夜是在表妹艾玛家。我带了血糖测试套装，睡前要测血糖。因为表妹家就在街对面，我爸爸早上过来帮我打胰岛素。

    下一次在外过夜是在琳达阿姨家。我爸妈要出门过夜，所以我妈妈得教琳达阿姨怎么给我配胰岛素。因为我已经会自己打针了，所以整个过程都很顺利。得了糖尿病也能过正常的生活，你想做什么都可以！

    ## 我的弟弟妹妹和糖尿病

    我妹妹珍娜会帮我一起用血糖测试套装。我弟弟肯特问我“你血糖多少呀？”的时候，我觉得他特别可爱。肯特和珍娜让我觉得轻松多了，因为他们在的时候我不会吃甜食。（但我知道他们有时候会偷偷吃！）现在我们全家都吃得更加健康了。

    ## 秘密是……

    ### 我有一个秘密！

    这个大大的秘密就是……根本没有秘密！我得了糖尿病，但我并不孤单。我现在感觉特别棒！打针、扎手指测血糖都没那么难。只要勇敢，相信自己就行！

    ## 关于本书

    我从婕德出生的那一刻就认识她了，得知她确诊1型糖尿病的时候，我和她的家人一起忍不住默默流泪。我很快就意识到，婕德独特的性格和对生活的热情会帮她度过这个难关。当她描述自己不知道未来会怎样、不知道能不能过正常生活的恐惧时，我向她提出了做图画日记的想法，出版之后可以帮助其他孩子了解得了1型糖尿病是什么样的体验。

    研究完这个主题后，我发现很少有以儿童视角描述糖尿病体验的资料。这本书很棒的一点是，它鼓励婕德在日记里表达自己的感受。我希望这能帮助她应对一些非常艰难的困境。她已经从害怕针头的小孩，变成了每天可以自己打针的孩子。从一开始我们就计划把她的文字和照片出版成书，这也让她能够掌控自己的生活，参与到治愈糖尿病的行动中。

    这本书的所有收益都会捐赠给糖尿病研究，这是她帮助寻找治愈方法的方式。对于很多和糖尿病患者同班的孩子们，我们希望这本书能帮助他们了解糖尿病。

    最后，我们希望那些刚确诊1型糖尿病的孩子能看到，他们并不孤单，还有很多孩子就算得了这个病也生活得很好，这没什么不好意思的，根本不是什么秘密。希望你喜欢读婕德的日记。我们要感谢很多帮助完成这本书的人，包括非常爱她的朋友和家人。

    特别感谢那些默默无闻、不辞辛劳寻找治愈方法的研究人员，他们的无私付出很少得到感谢。特别感谢你，你的贡献让你也成为了治愈糖尿病行动的一份子。我可以说，这个项目是一段非常独特的学习经历。我现在更加珍惜自己孩子的健康，也对于那些每天都在应对长期健康问题的家庭更加尊敬。我从婕德的经历中学到了很多，包括孩子们面对生活艰难挑战时展现出的惊人勇气和从容。像婕德这样勇敢的孩子给了我们所有人鼓舞！

    查琳·巴布科克·欧文，医学博士，F.A.C.E.P（肖恩阿姨）

    ## 糖尿病相关知识

    糖尿病分为两种不同类型，1型糖尿病有时也被称为青少年糖尿病或胰岛素依赖型糖尿病，2型糖尿病有时被称为成人发病型或非胰岛素依赖型糖尿病。

    患上1型糖尿病后，通常会生产胰岛素的器官——胰腺会停止分泌胰岛素。没有胰岛素，身体就无法正常运作。治疗方式就是通过注射胰岛素来补充体内缺失的胰岛素。

    2型糖尿病患者体内仍能分泌部分胰岛素，但这些胰岛素没法正常发挥作用。2型糖尿病比1型常见得多，治疗方式也不一样。2型糖尿病的治疗包括控制饮食、运动，有时还需要口服药物。偶尔也有2型糖尿病患者需要注射胰岛素。

    1型糖尿病是最常见的青少年慢性病之一。专家估计，这个国家每天有35个孩子确诊患上糖尿病。

    目前没有人确切知道1型糖尿病的病因。很多专家认为，部分人的基因构成会让他们更容易患上糖尿病。之后外界诱因（比如未知的病毒感染）会促使身体产生针对胰腺分泌胰岛素部分的抗体，身体开始自我攻击，分泌胰岛素的细胞就会被破坏。

    研究人员正在探索几种治愈糖尿病的方法，包括胰腺移植、基因疗法和干细胞研究。科学家每一天都在向治愈糖尿病的目标迈出巨大步伐。有你的支持，我们离治愈那天就更近了。

    ## 爸爸妈妈给婕德的信

    亲爱的婕德：

    我们知道，得了糖尿病并不总是一帆风顺。但你拥有的积极心态会帮你克服前进路上的一切障碍。得这个病让我们全家对每一天的价值都有了全新的感悟。我们也想让你知道，我们会陪你一起面对所有挑战。面对糖尿病对你的要求，你意志非常坚定，我们都很钦佩。如果可以把你的病痛转到我们自己身上，我们一定会这么做。每次你拿针扎你可爱的小胳膊的时候，我们的心都特别疼。如果可以让你彻底摆脱这些痛苦，我们一定会这么做。

    我们相信你强大的性格和意志会帮你渡过难关，让你过上幸福、健康、充实的生活。如果将来你遇到不顺心的时候，请记住我们爱你。我们会永远陪着你。你的弟弟妹妹也会一直支持你。有很多家人和朋友都相信你、爱你。当你需要找人倾诉的时候，你会发现愿意听你哭的人比你的眼泪还多。

    我们希望你能始终保持这份勇敢，像现在这样成熟地照顾自己，直到长大成人。亲爱的婕德宝贝，你是一个非常特别的人。我们为能有你这样的孩子感到骄傲。你为了寻找治愈方法付出的，可不只是这本书的收益，你付出的是你自己。

    爱你的

    爸爸妈妈

    '
