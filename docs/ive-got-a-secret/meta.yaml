- md: 'Now I do my own shots every day!


    ## GOING TO SCHOOL

    When I am at school my friend Rylie comes with me everyday when I check my blood
    sugar before lunch. I have taught Rylie all about diabetes.


    ## SLEEP OVERS

    The first time I spent the night away from home was at my cousin Emma''s house.
    I brought my blood tester kit to test my blood sugar before I went to bed. Because
    my cousin lives across the street, my Dad came over in the morning to help me
    with my insulin shot.


    My next overnight stay was at my Aunt Linda''s house. My Mom and Dad were going
    on an overnight trip. So my Mom had to teach my Aunt Linda how to mix my insulin.
    Since I already know how to give myself shots, it went real cool. It''s OK to
    live a normal life with diabetes. You can do anything!


    ## MY BROTHER AND SISTER AND DIABETES

    My sister Jenna helps with my blood sugar testing kit. And I think it is really
    cute when my brother Kent asks, "What are your levels?" Kent and Jenna make it
    easier for me because they don''t eat sweets around me. (But I know they sneak
    sometimes!) Now our whole family eats healthier.


    ## THE SECRET IS . . .

    ### I''ve got a Secret!

    So, the big secret is . . . that there is NO secret! I have diabetes and I am
    not alone. Now I feel great! It''s not that hard to take shots or do finger pricks.
    Just be brave and believe in yourself!


    ## ABOUT THIS BOOK

    I have known Jade since she was born, and along with her family I cried silent
    tears when we found out her diagnosis was Type 1 diabetes. I soon realized that
    Jade''s unique personality and stamina for life would get her through this. When
    she described her fear of not knowing what was going to happen, if she was going
    to be able to live a normal life, I approached her with the idea of a picture
    journal. This could be published to help other children understand what it was
    like to have Type 1 diabetes. After researching the topic, I realized there were
    few resources written from the perspective of a child that described what it was
    like to have diabetes.


    One great thing about this book is that it has encouraged Jade to express her
    feelings in a journal. I hope this has helped her deal with some very difficult
    issues. She has gone from a child who was afraid of needles to one who gives herself
    shots every day. Knowing from the beginning that we were planning to put her words
    into a book, with pictures of her, has also allowed her to take control and to
    be part of a cure. All of the profits from this book will be donated to diabetes
    research, and it is her way of helping to find a cure. For the many children who
    share a classroom with someone who has diabetes, we hope this book may help educate
    them about diabetes. Finally, we hope children who are newly diagnosed with Type
    1 diabetes, can see that they are not alone, that many other children are living
    great lives in spite of it, and that it is nothing to be ashamed about. It is
    not a secret at all.


    We hope you enjoyed reading Jade''s journal. We owe thanks to so many people who
    helped with this book, including her friends and family who love her so much.
    A special thanks to the researchers, who often work silently and tirelessly on
    finding a cure, and are thanked so infrequently for their unselfish efforts. A
    special thanks to you for becoming part of the cure for diabetes through your
    contribution. I can honestly say that this project has been a unique learning
    experience. I appreciate my children''s health so much more, and find even more
    respect for those families who deal daily with ongoing health problems. I have
    learned so much from Jade''s journey, including the amazing courage and poise
    children have in dealing with life''s difficult challenges. Brave children like
    Jade give us all inspiration!


    Charlene Babcock Irvin, MD, F.A.C.E.P (Aunt Shawn)


    ## FACTS ABOUT DIABETES

    There are two different types of diabetes, Type 1, sometimes called juvenile diabetes
    or insulin dependent diabetes, and Type 2 sometimes called adult onset or non-insulin
    dependent diabetes. In Type 1 diabetes the organ that usually makes insulin, the
    pancreas, simply stops making insulin. Without insulin, your body cannot function.
    Treatment includes replacing the absent insulin by giving insulin shots. In Type
    2 diabetes, the body has some insulin, but the insulin doesn''t seem to be working
    as it should. Type 2 is much more common than Type 1, and is treated differently.
    Treatment for Type 2 includes diet control, exercise, and sometimes oral medication.
    Occasionally, Type 2 diabetics will also need insulin. Type 1 diabetes is one
    of the most common chronic disease of youth. Experts estimate that every day 35
    children in this country are newly diagnosed. No one knows exactly what causes
    Type 1 diabetes. Many experts believe that some people have a genetic make up
    that leaves them more likely to get diabetes. An environmental trigger (such as
    an unidentified virus infection) is then believed to stimulate the body to develop
    antibodies against the insulin producing part of the pancreas. The body then attacks
    itself and the insulin making cells are destroyed. There are several ways researchers
    are looking to cure diabetes. These include pancreas transplants, gene therapy,
    and stem cell research. Scientists are making huge strides towards a cure every
    day. With your support, we are even closer to a cure.


    ## TO JADE FROM MOM & DAD

    Dear Jade, We know that having diabetes is not always easy. However, a positive
    mental attitude like the one you have, can overtake any obstacle that jumps in
    your way. Having this disease has given our family an unforeseen perspective in
    the value of each day. We also want you to know that we share your struggles with
    you. You are very strong willed with regards to the demands that diabetes has
    put on you.


    If we could take your illness upon ourselves we would. Our hearts ache for you
    each time you stick your lovely skin with a needle. If we could simply take it
    all away, we would. We believe your strong character and spirit will help you
    through and enable you to lead a happy, healthy, and productive life. If there
    are ever times in the future when you''re not feeling well, remember we love you.
    We will always be there for you. Your brother and sister will also be there for
    you. There are many family members and friends that believe in you and love you.
    When you need a shoulder to cry on, you may find you have more shoulders than
    tears to go around. Our hopes are that you continue on this solid ground of courageousness,
    and care for yourself into adulthood with as much maturity as you show today.


    Darling Jade Girl, you are a very special person. We are proud to be your parents.
    You are contributing more than the proceeds from this book to find a cure, you
    are contributing yourself. All Our Love, MOM & DAD'
