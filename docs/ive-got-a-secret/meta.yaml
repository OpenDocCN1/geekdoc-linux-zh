- img_proc: true
  md: 'I can get very sick if my blood sugar gets too high or too low. That''s why
    we need to do finger pricks at least four times a day to check my blood sugar.
    If my blood sugar is too low, I need to eat something with sugar in it. If it
    is too high, I may need more insulin.


    ![](img/3692bd9f13f40e4786591690d4b6f5a8_18_0.png)


