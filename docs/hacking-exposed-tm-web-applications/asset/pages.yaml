- pgno: 381
  md: '# Appendix D: URLScan Installation and Configuration


    ![](img/2c61c2d28445b774d9266972920f432d_381_0.png)


    **Figure D-5.** The last step in the IISLockdown wizard—installing URLScan


    To specify an alternate Web server name, open the file %windir%system32\inetsrv\urlscan\urlscan.ini
    in a text editor like Notepad, and look for the line that:


    AlternateServerName=


    After the sign on this line, enter whatever server name you desire. Here''s something
    that will confuse the average attacker or Internet worm:


    AlternateServerName=Webserver 1.0


    This changes the banner presented by your web server to "Webserver 1.0," which
    prevents attackers from easily discovering what type of server you are running
    using the banner-grabbing techniques outlined in Chapter 2. Once you make this
    change, you will need to restart the IIS service. You can do this manually, or
    simply go on to the next step, updating URLScan, which restarts IIS for you. If
    you leave this setting at its default (i.e., not defined), and the RemoveServerHeader
    setting equals 1 in the [Options] section of UrlScan.ini, IIS will return its
    true banner for each request.'
