- pgno: 167
  md: '# Negotiate


    Negotiate authentication is an extension to NTLM auth; it was introduced in Windows
    2000. It provides Kerberos-based authentication over HTTP and is considered very
    secure. As the names imply, Negotiate authentication uses a negotiation process
    to decide on the level of security to be used. By default, Negotiate will use
    the strongest authentication method. In the case of Windows 2000 hosts, Negotiate
    will use Kerberos-based authentication. However, if the host is not in the same
    domain, Negotiate will fall back to NTLM-based authentication.


    Negotiate can provide strong security if the hosts are all Windows 2000 (or above)
    and are in the same domain. However, the configuration is factrie restrictive
    and uncommon in corporate environments. In addition, the natural fallback capability
    of negotiate, NTLM can be used in lieu of Kerberos authentication. Hackers treat
    Negotiate as NTLM and perform the attacks as if they were dealing with NTLM authentication.
    eavesdropping attacks on Windows 2000 machines on the domain are most likely going
    to fail, since the clients will probably use Kerberos authentication, which is
    not vulnerable to eavesdropping attacks.


    # Certificate-Based


    Certificate authentication is stronger than any of the authentication methods
    we have discussed so far. Certificate authentication uses public key cryptography,
    and a digital certificate to authenticate a user. Certificate authentication can
    be used in addition to other password-based schemes to provide stronger security.
    The security of certificates is considered an implementation of two-factor authentication.
    In addition to knowing you (your password), you must authenticate with something
    you have (your certificate). Certificates can be stored in hardware (that is,
    smart cards) to provide an even higher level of security—possession of a physical
    token and availability of an appropriate smart card reader would be used to access
    a site in such a manner.


    Client certificates provide strong security, at a cost. The difficulty of obtaining
    certificates, distributing certificates, and managing certificates for the client
    base makes this authentication method prohibitively expensive for large sites.
    However, sites that have very sensitive data or a limited user base, as is common
    with business-to-business (B2B) applications, would benefit greatly from the use
    of certificates.


    There are no known attacks against certificate-based authentication. There is
    the obvious attack against the PKI infrastructure or attacks against authorization
    (see Chapter 6), but that is not restricted to certificate-based authentication.


    In addition, very few hacking tools currently support client certificates. Internet
    Explorer is the best tool for hacking Web sites that use client certificates,
    but the hacker is extremely limited in the data he can modify. Recently, a few
    tools have been cropping up that programmatically hook into Internet Explorer
    using the IE object and allow the user to modify data to make nasty requests.
    In addition, some tools that allow modification of cookies still work, leaving
    the hacker with a few weapons in his arsenal.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# Multiple Authentication Methods


    All of the previous discussion should not imply that the various authentication
    methods are mutually exclusive. A protected resource can be configured to support
    multiple types of authentication, and then select from the strongest available
    method supported by the client. For example, a Windows 2000 or greater server
    configured to provide for Basic and Integrated Windows authentication will typically
    challenge clients with the following headers, all in the same challenge:


    ```

    WWW-Authenticate: Negotiate

    WWW-Authenticate: NTLM

    WWW-Authenticate: Basic

    ```


    The client is now free to select any of the proffered methods according to its
    capabilities. If it is not an Internet explorer client, it can use Basic and respond
    with a Base 64-encoded password value in the Authorization: header. Or, if it
    is a Windows 2000 client that is part of the same Windows domain as the server,
    it can respond to the Negotiation challenge using Kerberos. The client will fall
    back to the lowest denominator proffered by the server.


    Table 5-2 summarizes all of the authentication methods we have discussed so far.
    Next, we move on to discuss Forms-based authentication, which doesn''t rely on
    any features of the protocols underlying the World Wide Web.


    | Authentication Method | Security Level | Server Requirements | Client Requirements
    | Comments |

    |---|---|---|---|--|

    | Basic | | Valid accounts on server | Most any browser supports Basic | Transmits
    password in cleartext |

    | Digest | Medium | Valid accounts with cleartext password available | Browsers
    that support HTTP 1.1 | Unable across proxy servers and firewalls |

    | Integrated Windows | High | Valid Windows accounts | Internet Explorer 2 or
    later (if so Kerberos) | Suitable for private intranets |

    | Certificate | High | Server certificate issued by same authority as client certs
    | SSL support, client-side certificate installed | Certificate distribution an
    issue |


    **Table 5-2.** A Summary of the Web Authentication Mechanisms Discussed So Far'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# Forms-Based Authentication


    In contrast to the mechanisms we''ve discussed to this point, Forms-based authentication
    does not rely on features supported by the basic Web protocols like HTTP and SSL
    (such as Basic Auth or client-side certifications). It is a highly customizable
    mechanism that uses a form, usually composed of HTML with <FORM> and <INPUT> tags
    delineating fields for users to input their username/password information. The
    data is input via HTTP (or SSL), it is evaluated by server-side logic and, if
    the credentials are valid, some state or token is given to the client browser
    to use on subsequent requests. Because of its highly customizable and flexible
    nature, Forms-based authentication is probably the most popular technique deployed
    on the Internet. However, since it doesn''t rely on any features of standardized
    Web protocols, there is no standardized way to perform Forms-based authentication.


    The recent introduction of the FormsAuthentication class in Microsoft''s ASP.NET
    is one of the first standards of Forms-based authentication.


    Let''s present a simple example of Forms-based authentication to illustrate the
    basically on which it is based. This will be based on Microsoft ASP.NET FormsAuthentication
    because of its simplicity, we will note key points that are generic to forms auth.
    Here''s the scenario: a single directory on a Web server with a file, default.aspx,
    that should require forms auth to read. In order to implement ASP.NET forms auth,
    two other files are needed: a web.config file in the directory (or at the application
    root), and a login form to take username/password input (call it in login.aspx).
    The web.config file which will be protected by forms auth, and it contains a list
    of usernames and passwords that can be queried to validate credentials by users
    in login.aspx. Of course, any source of username/password information could be—for
    example, a SQL database. Here''s what happens when someone requests default.aspx:


    ```

    /default.aspx HTTP/1.0

    ```


    Since the web.config file provides all resources in this directory require forms
    auth, the server responds with an HTTP 302 redirect to the login page, login.aspx:


    ```

    HTTP/1.1 302 Found

    Location: /login.aspx?ReturnUrl=%2fdefault.aspx

    ```


    The client is now presented with the login.aspx form, shown in Figure 5-3. This
    form contains a hidden field called "state," and two visible fields called "txtUser"
    that takes the username input and "txtPassword" that takes the password input.
    These are all implemented using HTML <INPUT> tags. The user diligently enters'
