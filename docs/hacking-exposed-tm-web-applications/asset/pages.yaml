  md: '# Chapter 3: Hacking Web Servers


    # # WebInspect


    | Pro: | Clean interface, fast, comprehensive, easy to update, detailed reports,
    rudimentary custom checks |

    | Con: | Costly, licensed by target IP address |

    | Final Analysis: | Lots of potential, but pricey |


    WebInspect from SPI Dynamics is an impressive Web server and application-level
    vulnerability scanning tool. It harvests site content and analyzes it for vulnerability
    application-level issues just looking for over 1,500 known Web server and application
    vulnerabilities, it as guessing of common Web files that may not be indexed, password
    guessing, parameter passing, and hidden parameter checks. The tool is easily updated,
    and it can be extended to use custom checks with the speed of these—it was able
    to perform a full analysis of a basic Web server in under four minutes, not including
    over 1,500 HTML pages.


    WebInspect has some drawbacks. One is—we quoted a perpetual license-price of $5000
    per server plus 20 percent annual maintenance and support at the time of this
    writing. Another gripe is that licenses are tagged to target IP address ranges,
    a burdensome feature for large organizations. We were also intrigued with the
    message we received when scanning our test network with the demo version we received
    from SPI Dynamics:


    > > You are using a version of WebInspect that provides the IP address of all
    scanned sites to SPI Dynamics via a secure connection in order to authenticate
    your license.


    Hopefully, this is only the case with the demo version.

    One minor criticism we had was that scans need to be manually configured one site
    at a time—taking a text file of IPs would be much better for large environments.
    Overall, the tool has great promise, but is probably only accessible to well-funded
    organizations under the current pricing model. WebInspect is shown in Figure 3-9.'
