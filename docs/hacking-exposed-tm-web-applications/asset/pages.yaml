- pgno: 193
  md: '# Chapter 6: Authorization 167


    Directory traversal is another example of bypassing an application''s or Web server''s
    authorization scheme. The well-publicized Unicode Directory Traversal attack for
    IIS took advantage of a weakness in the server''s parsing and authorization engine.
    Normally, IIS blocks attempts to escape the Web document root with URIs like "/scripts/../../..../wwinnt".
    The Unicode representation for the slash (/) is "%c0%af". IIS did not interpret
    the Unicode representation during its authorization check, which alloweded a malicious
    user to escape the document root with a URI like "/scripts/..%c0%af/..%c0%af/..%c0%af/wwinnt".


    The Cisco and ActiveX examples should illustrate the point that the URI does not
    just mean the parameters in the query string. After all, we considered the parameters
    as a separate aspect. A careful survey of the application can reveal patterns
    in the convention for the application''s pages. If a /user/menu directory exists,
    perhaps an /admin/menu exists as well. Hopefully, the application does not rely
    on obscurity to protect its administration front-end.


    # HTTP Headers


    HTTP headers are not normally used by Web applications that work with browsers.
    They are sometimes used by applications that have http-clients that use the HTTP
    protocol, however. This is a small percentage of Web applications. However, we
    include it in this section to illustrate that any input can be modified. Cookies
    are perhaps the most well-known headers, but authorization schemes can also be
    based on “Location:” and “Referer”(the HTTP definition misspells the term). The
    application might also rely on custom headers to track a particular attribute
    of the user.


    One of the simplest authorization tests is the browser check. Many tools, curl
    included, enable the user to specify a custom User-Agent header. So, if an application
    requires Internet Explorer for popular reasons as opposed to technical ones (such
    as requiring a particular component), you can change this header to impersonate
    IE.


    ```

    $ curl --user-agent "Mozilla/4.0 (compatible; MSI 6.0; Windows NT 5.0) \ --url
    www.victim.com

    ```


    # Cookies


    Cookies are a popular form of session management even though the use of cookies
    has been plagued with security vulnerabilities. However, their use is still common
    and are often used to store important fields such as usernames and account numbers.
    Cookies can be used to store any data, and all of fields can be easily modified
    using a program like CookieSpy. CookieSpy (http://www.codeproject.com/shell/cookiespy.asp)
    is a plug-in for Internet Explorer that opens a pane in the browser to display
    all of a site''s cookies. Figure 6-1 shows a report from CookieSpy for an application.
    Figure 6-2 shows how to use CookieSpy to change a cookie''s value (click on the
    “x” to the left of a name to edit its value).


    You will still need a proxy tool to catch session cookies.'
