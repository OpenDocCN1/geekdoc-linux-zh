  md: '# FOUNDSTONE


    Foundstone is the industry''s premier security solutions provider delivering technology,
    professional and managed services, and education. We''ve earned our experience
    at the highest levels, including the United States Air Force, Black World defense
    contractors, and three of the Big Five consulting firms. That''s why leading dots
    com and Global 2000 companies rely on Foundstone to secure their enterprises.


    Foundstone''s business is to assist and educate you on all aspects of computer
    security so that you can protect your rapidly changing environment. The authors
    who brought you **Hacking Exposed: Network Security Secrets & Solutions** also
    bring you **FoundScan**, the continuous assessment managed vulnerability service,
    capable of detecting vulnerabilities in real time, closing the window of exposure.
    Foundstone, in cooperation with Global Knowledge, also delivers the definitive
    course on security, **Ultimate Hacking: Hands On**. With this combined team, you
    benefit from the collective wisdom behind the book and get hands on instruction
    from experts who have battled hackers for decades.


    When it comes to securing your company from hackers, Foundstone''s technology,
    professional services, and training are invaluable. Let our experts teach you
    how to defend your organization before hackers teach you a lesson you won''t forget.


    Foundstone''s all-star team is ready to put its knowledge to work for you. Please
    visit us on the web at...


