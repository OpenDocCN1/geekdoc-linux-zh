- pgno: 329
  md: '# Case Study #1 Countermeasures


    The Web application had several problems, most of which could be easily fixed:


    +   Incorrect chroot Environment (Host) A UNIX chroot environment places a program
    and all of its support files in a specific directory. The goal is to “jail” the
    program in this directory and not permit it to escape. For example, the Web server
    was installed in the /home/jail directory and should not have been able to access
    other users'' directories, the /var directory, or the system''s /etc directory.
    Someone had made an effector to sequester the Web server, but did not set it up
    correctly.


    +   Directory Traversal (Web) The dimlDisplay.cgi file accepted filenames as arguments.
    It would have been better to apply strong input validation, or create an array
    of acceptable filenames and pass an array index on the URL. In general, be would
    be wary of applications that take filenames as arguments—canonicalization issues
    could be undoing.


    +   Legacy Scripts (Web) The /cgi-bin/admin scripts had not been used for several
    months, but remained on the server. On the other hand, they were written in UNIX
    shell (ksh), which was a security faux pas from being ignored.


    # CASE STUDY #2: XOR DOES NOT EQUAL SECURITY


    Case number two involves a major legal services firm who sought to migrate much
    of their document processing capabilities to an Online application (let''s call
    them Acme, Inc.). Imagine the cost savings, their thinking went, if we could exchange
    documents with our clientele in electronic format directly through a Web interface—all
    of these copiers, scanners, printers, fax machines, cabinets, and so on would
    all go the way of the dinosaur. Of course, due to the sensitive nature of the
    legal documents they were entrusted to handle by their clients, security had to
    be a priority in the design of the application, not only in relation to external
    intruders, but also other authorized users (that is, clients). A order fill for
    a Web application, indeed.


    The application was based on Microsoft IIS and Active Server Pages (ASP). A client
    arranges to have a user account set up via an out-of-band mechanism (e-mail or
    a phone call), and then gains access to a virtual directory on Acme''s Internet-accessible
    application where they can exchange digital files with Acme. Although all the
    interaction with the server occurs over SSL, the account is accessible via a simple
    username/password mechanism.'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# Hacking Exposed Web Applications


    We were contracted to perform a Web application security review of the application,
    and immediately found several seemingly unrelated issues with the site:


    +   We guessed the logon credentials for a guest account that had an obvious username/password
    combination. The guest account was apparently used to showcase the application
    to potential clientele and initially appeared to have quite limited privileges
    on the system.


    +   Once authenticated, we obtained business logic from an ASP script using a
    known IIS .ht source disclosure issue (see the section on IIS vulnerabilities
    in Chapter 3). The script source code revealed the location of a directory on
    the server that contained several files.


    +   Using the account compromised we determined we could view the files in this
    directory by requesting them by filename with the extension .inc because include
    files are simple text files with they were perfectly legible within the browser.


    A closing reading of one of the files revealed the business logic that Acme was
    using to observe the Web server''s virtual directory structure from their clients.
    The logic was based entirely on a simple obfuscation algorithm, keyed XOR. The
    key value was also found in the file.


    XOR is commonly confused with real encryption algorithms, but is far from it.
    It performs an easily reversible bitwise transformation to change plaintext to
    ciphertext. The use of a key added to no additional security we determined what
    the value was. In short order, we built a "translator" script based on the logic
    from the include file that would translate ASCII into the XOR-encoded string.
    Now we could feed malicious input to the application in an attempt to traverse
    the system on the server.


    Sure enough, by inputting "...dot" to our script and posting the resulting value
    to the appropriate ASP script, we could view the root directory of the volume
    on which the Web server served, using only the guest account access we''d obtained
    earlier. All of Acme''s clients'' data was exposed (they appeared as hyperlinked
    directories in our browser). Even worse, we found a directory to administer the
    server, which included several ASP scripts that granted us super-equivalent access
    to the application. over.


    # Case Study #2 Countermeasures


    What Acme, Inc. have done differently? A lot of things.


    First of all, security best practices that guest/test/demo accounts and sample
    files are big no-no''s for any application. They provide the back doors by which
    many platforms are compromised (also look out for and eliminate the notorious
    dev team account or any external vendor/consultant accounts used to manage the
    system remotely). Without the guest account, we probably wouldn''t gotten far
    at all.'
  merge: -1
  img_proc: true
- pgno: 331
  md: '# Chapter 13: Case Studies


    # 305


    Second, keeping up with security patches is critical. .htr exploit greatly contributed
    to the downfall of Acme''s Web server, even though it was a known issue that had
    a patch available from Microsoft at the time.


    Acme should also have renamed its .inc files to .asp. Most people don''t realize
    it, this simple trick can prevent the downfall of .inc files to the client and
    it doesn''t affect server-side functionality one (as you update all your ASP files
    references with the new filenames). This measure would have prevented us from
    obtaining the source code of the .inc file containing the damaging business logic.


    Another critical error was the design decision to use a trivially breakable algorithm
    like XOR as the primary security mechanism for preventing commling of users''
    data. Don''t launch on big-name online investment house ETRADE got tokens for
    session cookies in late September 2000. In general, XOR is never a good choice
    when it comes to security algorithms.


    A further flawed decision, one made by many Web developers, was the reliance on
    the Web server''s file system as the store of mission-critical data. A good assumption
    to start with when designing a Web server is that the integrity of its system
    will be compromised at some point in its existence. Don''t keep any data on the
    file system that you don''t want revealed to public at. One alternative to storing
    data on the file system is to use a back-end relational database as SQL. This
    simplifies management and, if access to the data is secured (see Chapter 9), the
    risk of exposure can be reduced.


    Some things must be kept on the file system, though, and this is where Acme also
    let its client decide by not applying the least-privilege principle when assigning
    user accounts. The guest account was a harbinger of inadequate ACLs on most of
    the directories on the Web server volume, as indicated by our easy traversal of
    the directory structure using only guest privileges. Don''t forget the power you
    have in file system ACLs when designing your applications!


    # CASE STUDY #3: THE CROSS-SITE SCRIPTING CALENDAR


    We often wonder at the sensationalism that surrounds cross-site scripting (CSS)
    vulnerabilities (see Chapter 12 for a description and discussion of cross-site
    scripting). The media and certain members of the security community post CSS as
    a mechanism for directly attacking Web applications, which in actuality the problem
    is much more complex, and usually involves tricking an end-user into clicking
    on a maliciously crafted hyperlink. Of course, once you''ve tricked someone into
    clicking on a link (executing code), the game is pretty much over anyway.


    There are some situations where CSS can be quite a serious problem, however. As
    we noted in Chapter 10, those situations often involve Web applications that are
    designed to take input from one user and display the output to another (or to
    several other users). This provides for the first user a more-or-less direct vector
    of attack against other users of the same Web application.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# Hacking Exposed Web Applications


    Case study number three involves just such an application, an online group collaboration
    tool that includes e-mail, shared file directories, discussion groups, calendaring,
    and other features. We were assigned to assess this application, and along with
    the many other items in our standard methodology, we attempted to inject a JavaScript
    alert message into all of the potential input fields provided by the test for
    CSS vulnerabilities. Here''s the JavaScript we used:


    ```

    <SCRIPT Language="Javascript">alert(''Hello'');</SCRIPT>

    ```


    As you might, an application designed to provide a group collaboration platform
    can be quite complex, and indeed, offered dozens of opportunities for malicious
    input. We were able to identify issues with the file input/download functionality
    that allowed remote attackers to read configuration files on the server, and some
    other severe issues. However, we were surprised to note that most all of the inputs
    proved resistant to CSS injection testing. We were able to give our client a clean
    bill of health when we stumbled across a gold mine for CSS exploits that we hadn''t
    expected:


    Picture: this shared calendar rendered in HTML that allows users to create events
    that will be viewed by others. Upon second thought, we''ve seen this coming a
    mile away! Sure, when we logged on as a standard user, we were able to create
    a calendar event with the JavaScript alert message as its title, and when we logged
    on as other users of the application, an alert message popped up when we displayed
    the month where the first user had created the event. This vulnerability was made
    even by the fact that users of different privilege levels could view the calendar,
    enabling the first malicious user to potentially get administrative users to execute
    the injected script code. privilege escalation.


    # Case Study #3 Countermeasures


    This is a classic example of how one can be used to achieve total application
    compromise, even when the overall security of the app is tight. And so easily
    prevented—should anyone need to submit < or symbols into a calendar entry? Server-side
    input validation routines of the sort discussed in Chapter 12 would put a stop
    to that and we left our client with a much healthier application.


    Additionally, this example highlights the importance of each and every feature
    of an application, no matter seemingly benign. We ignored the potential implications
    of the innocent calendar feature upon our first glance at the application—but
    we can''t deny now! In general, any application assessment should begin with a
    thorough inventorying of all the features and functionality provided to all users
    (including administrators), documented or not.


    So, if during the design review for your next Web application someone pipes up
    with something like “How anyone ever hack the calendar feature? We don''t need
    to worry about security there!”, you know how to respond.'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# SUMMARY


    We hope that these vignettes have demonstrated that Web application testing should
    not be limited to running through a checklist of possible vulnerabilities. In
    fact, one of the main themes that runs throughout each of these stories is that
    discrete Web app vulnerabilities are often chained together in order to gain more
    privileges than any one of them would have offered individually. Keep this in
    mind as you are designing the security of your own Web applications—every potential
    flaw, no matter how small, could yield a larger compromise. Even worse, your adversaries
    need only find one, while you have to consider them all. Good luck!


