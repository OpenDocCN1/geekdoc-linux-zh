    The 3d.dat file contains an X, Y, and Z coordinate on each line. Use a tool such
    as Gnuplot to graph the results. Remember, this does not predict session ID values,
    but it can be useful for determining *how hard* it would be to predict values.


    # **Case Study: Netcraft Security Advisory


    On January 16, 2001, Netcraft, a web server tracking site, released an advisory
    related to the session IDs generated by some version 2.0 of the Java Software
    Development Kit for the Java Web Server, IBM WebSphere, and ATG Dynamo e-Business
    platforms. Netcraft identified the simple manner in which session IDs were encoded.'
