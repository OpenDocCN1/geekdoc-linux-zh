    cook have been moved to the Privacy tab of the Internet Options control panel,
    which is

    shown in Figure 12-8. For those cookies that you accept, check them out if they
    are written

    to disk, and see if it is storing any personal information about.


    Another issue for users is to consider the patch level of their Web clients.

    Some time ago, Bennett Hazelton and Jamie McCarthy of Peacefire posted a script
    at

    http://www.peacefire.org/security/iecookies that extracted cookies from the client


