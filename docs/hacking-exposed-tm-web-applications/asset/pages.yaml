- pgno: 2
  md: '# ABOUT THE AUTHORS


    # Joel Scrambay


    Joel Scrambay is co-author of Hacking Exposed (http://www.hackingexposed.com),
    the international best-selling Internet security book that reached its third edition
    in October 2001. He is also author of Hacking Exposed Windows 2000, the definitive
    insider''s analysis of Microsoft product security, released in September 2001
    and now in its second foreign language translation. Joel''s publications have
    included co-founding as InfoWorld''s Security Watch, InfoWorld Test Center Analyst,
    and inaugural author of Microsoft''s TechNet Ask About...Security format.


    Joel''s writing draws primarily on his years of experience as an IT consultant
    for clients ranging from members of the Fortune 50 to newly minted startups, where
    he has gained extensive, field-tested knowledge of numerous security technologies,
    and analyzed security architectures for a variety of applications and products.
    Joel''s experiences have also provided him a strong basis in management and backup,
    as he has personally managed several ventures, multinational projects; and sustained
    numerous security enterprises of substantial annual revenues, and various sizes
    over the last five years. He also maintains his own test laboratory, where he
    continues to research the frontiers of information security.


    Joel speaks widely on information security for organizations like The Computer
    Security Institute, ISSA, ISACA, private companies, and government agencies. He
    is currently Managing Principal with Foundstone Inc. (http://www.foundstone.com),
    and previously held positions at Ernst & Young, InfoWorld, and as Director of
    IT for a major commercial real estate firm. Joel''s academic background includes
    advanced degrees from the University of California at Davis and Los Angeles (UCLA),
    and he is a Certified Information Security Professional (CISSP).


    > —Joel Scrambay can be reached at @webhackingexposed.com.


    # Mike Shema


    Mike Shema is a Principal Consultant of Foundstone Inc. he has performed dozens
    of Zeus reviews for clients Fortune 100 companies, financial institutions, and
    software development companies. He has field-tested methodologies against numerous
    Web application platforms, as well as developing support tools to automate many
    aspects of testing. His work has led to the discovery of vulnerabilities in commercial
    Web software. Mike also has written technical columns about Web server security
    for Security Focus and DevX. He has also applied his security experience as a
    co-author for The Anti-Hacker Toolkit. In his spare time, Mike is an active role-playing
    gamer. He holds B.S. degrees in Electrical Engineering and French from Penn State
    University.


    > —Mike Shema can be reached at mike@webhackingexposed.com.'
  merge: -1
  img_proc: true
- pgno: 3
  md: '# About the Contributing Authors


    # Yen-Ming Chen


    Yen-Ming Chen (CISSP, MCSE) is a Principal Consultant at Foundstone, where he
    provides security service to clients. Yen-Ming has more than four years experience
    administrating UNIX and Internet servers. He also has extensive knowledge in the
    area of wireless networking, cryptography, intrusion detection, and survivability.
    His articles have been published SysAdmin, UnixReview, and other technology-related
    magazines. Before joining Foundstone, Yen-Ming worked in the Cybersecurity Center
    in CMRI, CMU, where he worked on an agent-based intrusion detection system. “snort,”
    which is a light-weighted network intrusion detection system. Yen-Ming holds his
    B.S. of Mathematics from National Central University in Taiwan and his M.S. of
    Information Networking from Carnegie Mellon University. Yen-Ming is also a contributing
    author of Hacking Exposed, Third Edition.


    # David Wong


    David is a computer security expert and is Principal Consultant at Foundstone.
    He has performed numerous security product reviews as well as network attack and
    penetration tests. David has previously held a software engineering position at
    a large telecommunications company where he developed software to perform reconnaissance
    and network monitoring. David is also a contributing author of Hacking Exposed
    Windows 2000 and Hacking Exposed, Third Edition.'
