    # General SQL Techniques


    The previous section''s focus on Microsoft SQL Server should not preclude you
    from trying SQL injection techniques against other databases. MS SQL Server merely
    has an extreme amount of functionality built into it that makes a SQL injection
    more devastating. There are several techniques that apply to SQL-based databases.
    These techniques manipulate the SQL statement by appending, inserting, and modifying
    normal SQL keywords—using SQL against itself.


    SQL Operators has a predefined list of keywords, or tokens, set aside to have
    special meanings. When you select data from a table, you use the SELECT statement.
    A application gets a lot out of SELECT, FROM, and WHERE tokens—these constitute
    a basic query. SQL injection can extend the query in order to retrieve alternate
    information or generate an always true condition.


    SQL statements are varied and often complicated. These few techniques represent
    the wrenches you can use to pry open a database. More directed techniques require
    more complicated structures, but all of them rely on these bases.


    > TIP These represent data manipulation techniques. The manner in which they are
    injected varies from a single tick, to double dashes, to multiple ticks and parentheses.
    This is why it''s so important to be able to walk through a series of SQL errors
    in order to find the right track into the database.'
