    correct. Here is a quick overview of the types of attacks that are typically made
    against each component of the architecture presented in Figure 1-1.


    +   ▼ Client Active content execution, client software vulnerability exploitation,
    cross-site scripting errors. Web client hacking is discussed in Chapter 12.


    +   ▶ Eavesdropping on client-server communications, SSL redirection.


