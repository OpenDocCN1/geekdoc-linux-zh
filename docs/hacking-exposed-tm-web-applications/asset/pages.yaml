    # File System Traversal Countermeasures


    A number of countermeasures can mitigate directory traversal vulnerabilities in
    IIS.


    # Keep up with Security Patches


    **Keep up with Security Patches** This sort of fundamental error in basic IIS
    functionality is best addressed with a patch. There is really no other way to
    fix it (although we will discuss several steps that you can take to mitigate the
    risk shortly). The fixes for the Unicode and double decode patches can be found
    in Microsoft Security Bulletins MS008-086 and MS011-026. Again, amass itself is
    not included in SP2.


    > MS011-026 also changes the InProcess|sap|Apps Metabase setting so privilege
    escalation Trojan DLLs that can revertToSelf can''t be used to escalate privileges
    on IIS 5.


    As always, we recommend the use of an automated tool like the Network Hotfix Checking
    Tool (hfetch) to help you keep up to date on IIS patches.

    In addition to the patch, IIS administrators can engage in other best practices
    to protect themselves proactively with Unicode, double decode, and future vulnerabilities
    like them. The following set of recommendations is adapted from Microsoft''s recommendations
    in MS00-078 and amplified with our own approach.


    **Install Your Web Folders on a Drive Other than the System Drive** As you have
    seen, directory traversal exploits like Unicode are restricted by URL syntax that
    currently hasn''t implemented the ability to jump across volumes. Thus, by moving
    the IIS Web root to a volume with powerful tools like cmd.exe, such exploits aren''t
    feasible. On IIS, the'
