- pgno: 21
  md: '# PREFACE


    # THE TANGLED WEB WE''VE WOVEN


    Over three years ago, Hacking Exposed, First Edition introduced many people to
    the ease with which computer networks and systems are broken into. Although there
    are still many today who are not lightened to this reality, large numbers are
    beginning to understand the necessity for firewalls, secure operating system system
    configuration, vendor patch maintenance, and many other previously arcane fundamentals
    of information system security.


    Unfortunately, the rapid evolution brought about by the Internet has already pushed
    the goal-posts far upheld. Firewalls, operating system security, and the latest
    patches can be bypassed with a simple attack these elements are still critical
    components of any security infrastructure, they are clearly powerless to stop
    a new generation of attacks that are increasing in frequency every day now.


    We cannot put the horse of Internet commerce back in the barn and shut the door.
    There is no other choice left to draw a line in the sand and defend the positions
    staked in cyberspace by countless organizations and individuals.


    For anyone who has assembled the most rudimentary Web site, you know this is a
    daunting task. Faced with the security limitations of existing protocols like
    HTTP, as well as the ever-accelerating onslaught of new technologies like WebDAV
    and XML Web Services, the act of designing and implementing a secure Web application
    can present a challenge of Gordian complexity.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Meeting the Web App Security Challenge


    We show you how to meet this challenge with the two-pronged approach adapted from
    the original Hacking Exposed, now in its third edition.


    First, we catalog the greatest threats your Web application will face and explain
    how we work in excavating detail. How do we know these are the greatest threats?
    Because we are hired by the world''s largest companies to break into their Web
    applications, and we use them on a daily basis to do our jobs. We''ve been doing
    it for over three years, researching the most recently published hacks, developing
    our own tools and techniques, and combining them with what we think is the most
    effective methodology for penetrating Web application (in)security in existence.


    Once we have your attention by showing you the damage that can be done, we tell
    you how to prevent and every attack. Deploying a Web application without understanding
    the information in this book is roughly equivalent to driving a car without seatbelts—down
    a slippery road, over a monstrous chasm, with no brakes, and the throttled down.


    # HOW THIS BOOK IS ORGANIZED


    This book is the sum of parts, each of which is described here from largest organizational
    level to smallest.


    # Parts


    This book is divided into three parts:


    # I: Reconnaissance


    Casing the establishment in preparation for the big heist, and how to deny your
    adversaries useful information at every turn.


    # II: The Attack


    Leveraging the information gathered so far, we will orchestrate a carefully calculated
    fusillade of attempts to gain unauthorized access to Web applications.


    # III: Appendices


    A collection of references, including a Web application security checklist (Appendix
    A); a cribsheet of Web hacking tools and techniques (Appendix B); a tutorial and
    sample scripts describing the use of the HTTP-hacking tool libwhisker (Appendix
    C); step-by-step instructions on how to deploy the robust IIS security filter
    UrlScan (Appendix D); and a brief word about the companion Web site to this book,
    www.webhackingexposed.com (Appendix E).'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Preface


    # xxii


    # Chapters: The Web Hacking Exposed Methodology


    Chapters make up each part, and the chapters in this book follow a definite plan
    of attack. That is the methodology of the malicious hacker, adapted from Hacking
    Exposed:


    +   - Profiling

    - Web server hacking

    - Surveying the authentication

    - Attacking authentication

    - Attacking authorization

    - Attacking session state management

    - Input validation attacks

    - Attacking Web datastores

    - Attacking XML Web Services

    - Attacking Web application management

    - Hacking Web clients

    - Case studies


    This structure forms the backbone of this book, for without a methodology, this
    would be nothing but a heap of information without context or meaning. It is the
    map by which we chart our progress throughout the book.


    # Modularity, Organization, and Accessibility


    Clearly, this book could be read from start to finish to achieve a soup-to-nuts
    portrayal of Web application penetration testing. We have attempted to make each
    section of each chapter on its own, so the book can be digested in modular chunks,
    suitable adhered to the frantic schedules of our target audience.


    Moreover, we have strictly adhered to the clear, readable, and concise style that
    readers overwhelmingly responded to in Hacking Exposed. We know you''re busy,
    and you need the right dirt without a lot of doubletalk and needless jargon. As
    a reader of Hacking Exposed once commenced, "Reads like fiction, scares like hell!"


    We think you will find as satisfying reading from beginning to end as you would
    piece by piece, but it is built to withstand ever treatment.


    # Chapter Summaries and References and Further Reading


    In an effort to improve the organization of this book, we have included two features
    at the end of each chapter: a "Summary" and "References and Further Reading" section.
    The "Summary" is exactly what it sounds like—a brief synopsis of the major concepts
    covered in the chapter, with an emphasis on countermeasures. We would expect that
    if'
