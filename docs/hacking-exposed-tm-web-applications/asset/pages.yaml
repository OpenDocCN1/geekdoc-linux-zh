- pgno: 338
  md: '# 312 Hacking Exposed Web Applications


    This checklist summarizes the many recommendations and countermeasures made throughout
    this book. Although we have not reiterated every detail relevant to each checklist
    item here, we hope they serve as discrete reminders of the best practices that
    should be implemented when designing any Web application.


    | Item | Check |

    |---|---|n| Perimeter firewall, screening router, or other filtering device established
    between Web application and untrusted networks | |

    | Firewall/router configured to allow only necessary traffic inbound to Web application
    (typically only HTTP and/or SSL) | |

    | Firewall/router configured to permit only necessary traffic outbound from the
    Web application (typically TCP SYN packets are dropped to prevent servers from
    initiating outbound connections) | |

    | Appropriate denial-of-service countermeasures enabled on firewall/gateway (for
    example, Cisco “rate limit” command) | |

    | Load balancers configured not to disclose information about internal networks
    | |

    | Network Intrusion Detection System (NIDS) may be optionally implemented to detect
    common TCP/IP attacks; appropriate log review and resources should be made available
    if NIDS is implemented | |

    | Network vulnerability scans conducted regularly to ensure no network or system-level
    vulnerabilities exist | |

    | Web Server | |

    | Latest software patches applied | |

    | Servers configured not to disclose information about the server software (for
    example, banner information changed) | |

    | Servers configured to disallow reverse proxy | |

    | Unnecessary network services disabled on all servers | |

    | OS and server vendor-specific security configurations implemented where appropriate
    | |

    | Unnecessary users or groups (e.g., Guest) disabled or removed | |'
  merge: -1
  img_proc: true
- pgno: 339
  md: '# Appendix A: Web Site Security Checklist 313


