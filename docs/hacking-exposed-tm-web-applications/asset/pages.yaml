    # Navigating Without Directory Listings


    Canonicalization attacks allow directory traversal inside and outside of the Web
    document root. Unfortunately, they rarely provide the ability to generate directory
    lists—it''s rather difficult to explore the terrain without a map! However, there
    are some tricks that ease the difficulty of enumerating files. The first step
    is to find where the actual directory root begins. This is a drive letter on Windows
    systems or Unix systems makes this a little easier, since the most topmost directory
    is "InetPub" By default, find the root directory (drive letter) on an IIS host
    by continually adding directory traversals until you successfully obtain a target
    HTML file. Here is an abbreviated example of a series of directory traversals
    that are tracking the root for a target application''s default.asp file:


    ```Microsoft VBScript runtime error ''800a0046''

    File not found

    /includes/printable.asp/../../../../inetpub/wwwroot/default.asp

    Microsoft VBScript runtime error ''800a0046''

    File not found

    /includes/printable.asp/../../../../inetpub/wwwroot/default.asp

    Microsoft VBScript runtime error ''800a0046''

    File not found

    /includes/printable.asp/../../../../inetpub/wwwroot/default.asp

    Microsoft VBScript runtime error ''800a0046''

    .source code of default.asp returned...

    ```


    It must seem pedantic that we go through the trouble of finding the number of
    directory traversals when a simple ../../../ would suffice. Yet before you pass
    judgment, take a closer look at the level of escapes. There are four directory
    traversals necessary before the printable.asp file dumps the source code. If we
    assume that the full path is /inetpub/wwwroot/includes/ Looks like the /includes
    directory is mapped somewhere else on the drive or the default location for the
    "Link" files is somewhere else.'
