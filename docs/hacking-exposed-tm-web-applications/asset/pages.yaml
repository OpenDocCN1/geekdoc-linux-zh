    ```


    HTTP is thus like a hacker’s—there is no need to understand cryptic syntax in
    order to generate requests, and likewise decipher the context of requests. Practically
    anyone can become a fairly proficient hacker with very little effort.


    Furthermore, HTTP is stateless—no concept of session is maintained by the protocol
    itself. If you request a resource and receive a valid response, then another,
    the server regards this as a wholly separate unique request. It does not maintain
    anything like a session or otherwise attempt to maintain the integrity of a link
    with the client. This also comes handy for hackers, as there is no need to plan
    multistage attacks to emulate maintenance mechanisms—a single request can bring
    a Web server or application to its knees.


    HTTP is also an ASCII text-based protocol. This works which anyone can read. There
    is no need to understand binary encoding or translators—everything a hacker needs
    to know is available within each request and response, in cleartext.


    Finally, HTTP operates over a well-known TCP port. Although it can be implemented
    on any other port, all web browsers automatically attempt to connect to TCP 80,
    first so every Web server lists on that port as well (see our discussion of SSL/TLS
    in the next section for one above this). This has great ramifications for the
    vast majority of networks that sit behind those massive devices called firewalls
    that are supposed to protect us from all of the outside world. Firewalls and other
    security devices are rendered defenseless against Web hacking when configured
    to allow TCP 80 through one or more servers. And what do you guess is the most
    common firewall configuration on the Internet today? Allowing TCP 80, of course—if
    you want a functional Web site, you’ve gotta make it accessible.


    Of course, we’re oversimplifying a great deal here. There are several exceptions
    and qualifications that one could make about the the previous discussion of HTTP.'
