- pgno: 384
  md: '# 358 Hacking Exposed Web Applications


    # Unattended IISLockdown Installation


    For those who wish to automate the deployment of the IIS Lockdown wizard and UrlScan
    across multiple servers, IISLockdown can be configured to run in an unattended
    fashion according to predefined settings specified in a file called islockdown.ini.
    The [Info] section contains basic configuration information used by the IIS Lockdown
    wizard. The short file RunLockUnattended comes with the IIS Lockdown installation
    explains the basics of configuring islockdown.ini files and there is a sample
    islockdown.ini file available in the distribution (don''t delete or overwrite
    this original, as it contains the syntax for configuring all available!). The
    key parameter is to Set Unattended=TRUE in the file, and run the IISLockdown tool
    in the desired directory as the islockdown.ini file using the command line or
    calling it from script. We''ve had erratic results using this feature (“No memory”)
    error messages), so your mileage may vary. It’s probably a better idea to integrate
    UrlScan into the standard template for servers throughout your organization, which
    means it will be deployed automatically with any new Web server in your configuration.


    > The IISLockdown installer is named islockdown.exe, same as the tool itself—don’t
    mix them up!


    # ADVANCED URLSCAN DEPLOYMENT


    Whew—who would have thought the “basic deployment” would be so involved! If you
    ache for the simplicity of copying files around, and you’re going to get your
    hands dirty with some of the technical details, read on. Manually installing UrlScan
    involves the following steps:


    +   - Extracting UrlScan.dll

    - Configuring UrlScan.ini

    - Installing UrlScan.dll as an API filter under IIS


    We will discuss each one of these steps below. We will complete our discussion
    with some brief instructions on how to manually remove UrlScan. In order to perform
    the steps below, you will require:


    +   - The latest UrlScan.exe installer (version 2.5 as of this writing; either
    Baseline or SRP is fine)

    - The IISLockdown installer (iislockdown.exe)


    Links to each of these items can be found in the “References and Further Reading”
    section at the end of this chapter.'
  merge: -1
  img_proc: true
- pgno: 385
  md: '# Appendix D: UrlScan Installation and Configuration


    # Extracting UrlScan.dll


    The first step is to extract the most recent version of UrlScan.dll to the desired
    directory.

    to do this, use the latest UrlScan.exe installer with the following command switches:


    ```

    urlscan.exe /q /c /t:%windir%\system32\inetsrv\urlscan

    ```


    Note that we specified files to be extracted to the default UrlScan directory
    here.

    this directory will be created if it not already exist. When placed in %windir%

    system32\inetsrv, UrlScan directory has the appropriate ACLs when set to inherit

    from its parent. Be aware that extracting UrlScan.dll to a directory with different
    ACLs

    prevent it from working properly.


    # Configuring UrlScan.ini


    In order for UrlScan.dll to work its magic, there must be a file called UrlScan.ini
    in its di-

    rect. You could write a UrlScan.ini file from scratch, but the best way is to
    start with a

    template. Several are available from within the IISLockdown tool. To obtain the

    UrlScan.ini template files, extract them from the iislockd.exe installer (not
    the tool itself!)

    using the following command:


    ```

    iislockd.exe /q /c /t:[full_path_to_desired_folder]

    ```


    where [full_path_to_desired_folder] is a user-specified path to a temporary directory

    where the files should be extracted (for example, d:\urlscan). Don''t extract
    to the direc-

    tory where you put UrlScan.dll in the previous step! This extracts numerous files,
    includ-

    ing the IISLockdown tool (iislockd.exe), the UrlScan exe automated installer,
    includ-

    UrlScan.dll itself, and the UrlScan.ini template files.


    Now you have to choose which template file you want to start with. The template
    files

    are named according to server roles:


    +   - urlscan-biztalkl.ini

    - urlscan-commerce.ini

    - urlscan-dynamic.ini

    - urlscan-exchange2000.ini

    - urlscan_frontpage.ini

    - urlscan_sbs2000.ini

    - urlscan_sharepoint_portal.ini

    - urlscan_sharepoint_teamservices.ini

    - urlscan_static.ini'
  merge: -1
  img_proc: true
- pgno: 386
  md: '# Hacking Exposed Web Applications


    If you are deploying UrlScan to any of the Microsoft product types identified
    in the previous list (for example, Commerce Server), use that template file. For
    maximum security, we recommend the urlscan_static.ini file. If you require dynamic
    content generation by scripts (as Active Server Page scripts), use the urlscan_dynamic.ini
    file. Don''t sweat this thing too much—you can edit this file at any time.


    Whichever file you choose, copy it to the directory where you installed UrlScan.dll.
    Then rename it to UrlScan.ini.


    Now you have to edit it so that UrlScan.dll rejects the requests you want it to.
    The syntax for UrlScan is pretty straightforward, and we''ve included a complete
    command reference in the section titled "UrlScan Command Reference" later in this
    chapter. If you''ve chosen your template well, you''ll only need to make configuration
    changes at this point. However, there are a few edits that we recommend you perform
    right away.


    # Specify AlternateServerName


    First, as we''ve noted before, you should specify an alternate server name by
    editing or creating a line that:


    ```

    AlternateServerName=Webserver 1.0

    ```


    You can select any non-IIS server name


    # Add Updates


    Next, we recommend making the appropriate changes to update your UrlScan.ini to
    version 2.5. Remember, there are two version 2.5 configurations, Baseline and
    SRP. The differences are minimal, and we''ll note them next. We favor the SRP
    settings, as they are more restrictive security-wise. To your UrlScan, add the
    following lines to the end:


    ```

    [RequestLimits]

    MaxAllowedContentLength=30,000,000 ;30MB

    ForBaseline, set previous to 2,000,000,000

    MaxUrl=16384 ;16K

    MaxQueryString=4096 ;4K

    ```


    The next addition is optional, but recommended. It protects IIS servers from exploits
    of a serious buffer overflow announced in April 2002, and this added setting is
    the main'
  merge: -1
  img_proc: true
- pgno: 387
  md: 'difference between Baseline and SRP (SRP has it). The drawback is that is will
    prevent clients that use chunked encoding from your Web app. Chunked encoding
    allows HTTP messages to be broken up into smaller pieces and transferred as a
    series of chunks, each with its own size indicator (for more information, see
    Section 3.6.1, “Chunked Transfer Coding”) in RFC 2616, the HTTP 1.1 specification).
    Chunked encoding is enabled by the client, typically when sending a dynamic amount
    of data (if data was fixed, it would simply use the Content-Length header). If
    you elect to implement this setting, in the [DenyHeaders] section, add:


    Transfer-Encoding:


    # Specify Log Directory


    UrlScan version 2.0 automatically logged all rejected URLs to the same directory
    where UrlScan.dll was installed. In version 2.5, Microsoft introduced the ability
    to specify a log directory by adding the following lines to the [options] section
    of UrlScan.ini:


    ```

    LoggingDirectory=path_to_log_directory

    LogLongUrls=0

    ```


    where path_to_log_directory represents any directory you choose. If you elect
    to enable UrlScan logging, we recommend confirming that this location can store
    a sizeable amount of log data. The LogLongUrls setting may be enabled to detect
    malicious attacks such as buffer overflows, but may result in additional performance
    overhead if your site uses URLs frequently.


    # Installing the UrlScan ISAPI Filter in IIS


    Now that you have UrlScan.dll and a properly configured UrlScan.ini file in the
    same directory, it’s time to actually install it to protect your IIS Web server.
    Open the IISAdmin tool (Run...inetmgr), select properties of the local computer,
    edit the Master Properties of the WWW Service, select the ISAPI Filters tab, and
    click the Add button. This brings up the Filter Properties window. Now click Browse,
    browse to the location where you installed UrlScan.dll, select it, and hit OK.
    You should be back at the Filter Properties window. Type UrlScan in the Filter
    name field. The Filter Properties window should look similar to Figure D-7.


    Click OK, and then you should be looking again at the ISAPI Filters tab in IISAdmin,
    which should now look something like Figure D-8.'
  merge: -1
  img_proc: true
