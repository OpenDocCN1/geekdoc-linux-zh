- pgno: 83
  md: '# Chapter 3: Hacking Web Servers


    # IIS Directory Traversal


    | Popularity: | 10 |

    | Simplicity: | 8 |

    | Impact: | 7 |

    | Risk Rating: | 8 |


    First leaked in the Packetstorm forums in early 2001 and formally developed by
    Rain Forest Puffy (RFP), the essence of the Unicode directory traversal problem
    is explained most simply in RFP''s words:


    > "%c0%af and %c1%9c are overlong Unicode representations for ''/'' and ''\''.
    There might be even longer (3+ byte) overlong representations, as well. IIS seems
    to decode Unicode at the wrong instance (after pathing, rather than before)."


    Thus, by feeding an HTTP request to follow the IIS, arbitrary commands can be
    executed on the server:


    ```

    GET /scripts/...%c0%af../winnt/system32/cmd.exe?+c/dir+c:\\ HTTP /1.0

    ```


    The Unicode representation %c0%af makes it possible to use "dot-dot-slash" nothing
    to back up into the system directory and feed input to the command shell, which
    is not possible using only ASCII characters. Several other "illegal" representations
    of "/" and ''\" are feasible, including %c1%1c, %c1%9c, %c1%1c, %c0%9v, %c0%af,
    %c0%a6, %c1%88, %c1%9e, and %c1%9c.


    In May 2001, researchers at NFocus released an advisory about an IIS vulnerability
    that bore a striking similarity to the Unicode directory traversal issue. Instead
    of Unicode representations of slashes (/ and \), IIS discovered that doubled hexadecimal
    characters also allowed HTTP requests to be constructed that escaped the normal
    IIS security checks and permitted access to resources of the Web root. For example,
    the backslash was represented to a Web server by the hexadecimal notation %5c.
    Similarly, the % character is represented by %25. Thus, the string %255c, if decoded
    sequentially two times in sequence, translates to a single backslash.


    The key is that two decodes are required, and this is the root of the problem
    with IIS: It performs two decodes on HTTP requests that traverse executable directories.
    This condition is exploitable in the same way as the Unicode hole.


    NOTE Microsoft refers to this vulnerability as the "superflu decode" issue, but
    we "double decode" sounds a tad perkier.'
  merge: -1
  img_proc: true
