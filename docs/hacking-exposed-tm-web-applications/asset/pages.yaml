- pgno: 389
  md: '# # Restarting IIS


    The next step is to restart IIS, which is critical to successfully installing
    UrlScan.


    > NOTE ISAPI filters like UrlScan are loaded into memory only during IIS startup,
    every time you make modifications to UrlScan.dll or UrlScan.ini, you must restart
    IIS.


    On IIS 4, you typically need to manually stop and start each IIS service that
    requires UrlScan protection. Typically, this is the only World Wide web service,
    or W3SVC, which can be stopped by typing the following at a command prompt:


    ```

    net stop w3svc /Y

    ```


    To start the w3svc, then type:


    ```

    net start w3svc

    ```


    On IIS 5, the iisreset command can be used. Simply type isreset at a command prompt,
    and all services will be restarted. Here is a simple batch file that gracefully
    stops IIS services, backs up the W3SVC logs, and starts IIS again:


    ```

    @echo off

    isreset /STOP /NOFORCE

    if errorlevel == 1 goto EXIT

    copy %systemroot\system32\LogFiles\W3SVC1 d:\backup\W3SVC1

    isreset /START

    :EXIT

    ```


    This script may prove useful if you need to gracefully restart IIS.


    # # Adjusting UrlScan Priority


    Finally, when the UrlScan filter is loaded, you need to adjust the priority, if
    necessary. Return to the ISAPI Filters in the IISAdmin tool (the scene depicted
    in Figure D-8). If UrlScan is not at the top of the list, and does not have a
    priority of High, you should consider it. UrlScan will intercept all incoming
    requests before they are passed to any other DLLs. Use the arrow buttons on the
    left side of this screen to adjust UrlScan''s priority until it looks something
    like Figure D-9.


    There are some cases where UrlScan should not be loaded first, depending on what
    products you may be running on the Web server. To that, the only exception we
    are aware of occurs if you use FrontPage Server Extensions (FPSE). In this case,
    you may need to move the UrlScan filter below the FPSE ISAPI filter (fpsexed.dll),
    and change its priority to Low.'
  merge: -1
  img_proc: true
- pgno: 390
  md: '# Hacking Exposed Web Applications


    ![](img/2c61c2d28445b774d9266972920f432d_390_0.png)


    **Figure D-9.** A successfully loaded UrlScan ISAPI filter


    > NOTE UrlScan priority can also be set with the AllowLateScanning setting in
    UrlScan.ini.


    # Removing UrlScan


    If you should ever need to disable/or remove UrlScan, you have a few options.
    If, after you install UrlScan, your application begins dropping certain client
    requests, you can set UrlScan into a logging-only mode that will permit all requests,
    but will log any requests that would normally reject. This could be helpful for
    troubleshooting. To set UrlScan in logging-only mode, add the value /* (slash-tilde-asterisk)
    to the RejectResponseUrl line in UrlScan.ini so that it looks like:


    ```

    RejectResponseUrl=*

    ```


    Then restart IIS to load the config. If you simply want to disable UrlScan, you
    can uninstall the ISAPI filter by reversing the steps discussed earlier in the
    section "Installing the UrlScan ISAPI Filter in IIS.\ Simply select the UrlScan
    filter on the ISAPI Filters tab and click Remove, then restart IIS.'
  merge: -1
  img_proc: true
- pgno: 391
  md: '# Appendix D: UrlScan Installation and Configuration


    This will not delete UrlScan.dll or UrlScan.ini. You will have to manually perform
    this task if desired.


    # URLSCAN.INI COMMAND REFERENCE


    This section will present a brief overview of the settings that can be configured
    within UrlScan.ini. It is adapted from the UrlScan.doc fact that we strongly recommend
    reading the original document, as it has more complete information. Our intention
    here is to provide a quick reference for readers who want a short, plainly worded
    explanation of each of the sections in UrlScan.ini, along with our recommendations
    for how each should be set.


    # Options Section


    Each setting is prefaced by the allowed options, 0 or 1 string.


    +   **AllowVerbs** (0,1), If set to 1, UrlScan rejects any request containing
    an HTTP verb not explicitly listed in the AllowVerbs section (case sensitive).
    If set to 0, UrlScan rejects any request containing an HTTP verb listed in the
    Denybs section (not case sensitive). The highest security is obtained by setting
    this to 1, and having a short list of verbs in the AllowVerbs section, as GET.

    **AllowExtensions** (0,1) If set to 1, UrlScan rejects any not explicitly listed
    in the AllowExtensions section. If set to 0, UrlScan rejects any request that
    contains a file extension listed in the DenyExtensions section. Both the AllowExtensions
    and DenyExtensions sections are case insensitive. If you have tight reign over
    the content on your Web site, set this to 1 and list the appropriate extensions
    in AllowExtensions. More typically, for sites with diverse content, this is set
    to 0, and populate DenyExtensions as we recommend in "DenyExtensions Section."

    **NormalizeUrlBefore** (0,1) When set to 1, IIS is allowed to normalize the request
    before UrlScan filters it. Normalization decoding URLs from hexadecimal or other
    encodings, canonization of filenames, and so. On set to 0, UrlScan filters the
    URLs as they are. We strongly recommend setting this to 1 to avoid canonicalization
    attacks like the directory travels discussed in Chapter 3.

    **VerifyNormalization** (0,1) If set to 1 this verifies normalization to ensure
    that requests are not encoded multiple times in an attempt to bypass standard
    normalization routines. We recommend setting this to 1.

    **AllowHighBitCharacters** (0,1) If set to 0, UrlScan rejects any request where
    the URL contains a character outside of the ASCII character set. This feature
    can defend against UNICODE- or UTF-8-based attacks, but will also reject legitimate
    requests on IIS servers that use a non-ASCII code page. We say 0 for this.'
  merge: -1
  img_proc: true
- pgno: 392
  md: '# Hacking Exposed Web Applications


    +   - AllowDotInPath (0,1) When set to 0, UrlScan rejects requests containing
    multiple instances of the dot (.) character within the entire URL. This defends
    against the case where an attacker uses path info to hide the true extension of
    the request (for example, setting “/path/TreeUrlAsp/Bogus.htm”). Be aware that
    if you have dots in your directory names, requests containing those directories
    will be rejected with this setting. We recommend setting this to 0.


    +   - RemoveServerHeader (0,1) When set to 1, UrlScan removes the server header
    on all responses. This prevents attackers from determining what HTTP software
    is running. We prefer to set this to 0 and specify a fake server header using
    the AlternateServerName discussed later in this section.


    +   - EnableLogging (0,1) If set to 1, UrlScan logs its actions to a file called
    UrlScan.dll, which will be created in the same directory that UrlScan.dll. If
    set to 0, no logging will be done. Note that the LoggingDirectory can be set to
    use a custom location to write UrlScan.dll version 2.5 or later (6.0.3615.0),
    but it is only available if you''re using UrlScan.dll. We recommend setting this
    to 1 only if you are actively troubleshooting what sort of attacks your Web server
    may be subject to. The IIS logs should be keeping a good record of Web server
    activity, and unless you''ve got extra free time to examine all of the malicious
    UrlScan rejects on a busy server, it''s probably not worth it to even log them.


    +   - ProcessLogging (0,1) When set to 1, UrlScan appends the ID of the IIS process
    hosting UrlScan.dll to the log filename (for example, UrlScan.1664.log). To our
    knowledge, this feature is only useful on IIS 6 and above, which can hold filters
    in more than one concurrently. Unless you''re running .NET server, set it to 0.


    +   - AlternateServerName (0,1) If this is string and set to 0, RemoveServerHeader
    returns its default “Server:” header in all responses with this string. If RemoveServerHeader
    is set to 1, no server header is sent to clients, and AlternateServerName has
    no meaning. We recommend setting RemoveServerHeader=0 and specifying an obscure
    value here; for example, AlternateServerName=Webserver 1.0.


    +   - AllowLateScanning (0,1) This sets the priority of the UrlScan filter. We
    recommend setting this to 0 (high priority) unless you''re using FrontPage Server
    Extensions (FPSE), in which case you should set this to 1 so that the FPSE filter
    has priority over UrlScan. If you are using FPSE, you should also use IISAdmin
    to move UrlScan below fpexed.dll, as discussed earlier in the section “Adjusting
    UrlScan Priority.”'
  merge: -1
  img_proc: true
- pgno: 393
  md: '# Appendix D: UrlScan Installation and Configuration


    **PerDayLogging (0,1)** If set to 1, UrlScan creates a new log file each day and
    appends a date to the log filename (for example, UrlScan.052202.log). If set to
    0, UrlScan creates one monolithic log. Since we don''t recommend UrlScan rejects
    unless troubleshooting, this setting is of meaningless.


    **RejectResponseUrl (string)** The default is empty, which actually sends /<Rejected-By-UrlScan>
    to clients and causes them to display an HTTP 404 "Object Not Found" page. You
    can set a custom rejected-response page using a URL in the form "path/file_name.ext".
    The URL needs to be located on the Local Web server. We like to leave this as
    the default (empty), which gives attackers very little information. If you want
    to create a custom URL, you can use some special server variables created by UrlScan
    to populate the page with information on why the request was rejected—the UrlScan
    documentation for more info. Also, remember that if you set RejectResponseUrl=/,
    UrlScan performs all of the configured scanning and logs the results, but will
    allow IIS to serve the page if it normally be rejected. This mode is useful if
    you would like to test UrlScan.ini settings without actually rejecting requests.


    **UseFastPath (0,1)** If set to 1, UrlScan ignores the RejectResponseUrl and returns
    a short 404 response to the client in cases where it rejects a request (Figure
    D-10 shows the short response). If this option is used, IIS cannot return a custom
    404 response or log many parts of the request into the IIS log (the UrlScan log
    files will contain complete information about rejected requests). We set this
    to 0.


    # AllowVerbs Section


    IfAllowVerbs is set to 1 in the Options section, UrlScan rejects any request containing
    an HTTP verb (or method) not explicitly listed in this section. The entries in
    this section are case sensitive. We advocate using AllowVerbs=1 and listing as
    few verbs as possible (if you can get away with only listing GET here, go for
    it!)


    # DenyVerbs Section


    IfAllowVerbs is set to 0 in the Options section, UrlScan rejects any request containing
    an HTTP verb (or method) that is listed in this section. The entries in this section
    are case insensitive. Again, we think using the AllowVerbs section wisely is better
    option, but if you can''t conclusively list all of the HTTP methods your application
    requires, you may need to use this option. We still think you should know what
    methods you support, though.'
  merge: -1
  img_proc: true
- pgno: 394
  md: '# Hacking Exposed Web Applications


    ![](img/2c61c2d28445b774d9266972920f432d_394_0.png)


    **Figure D-10.** IfUseFastPathReject is set to 1, this is what clients will see
    for rejected requests.


    # DenyHeaders Section


    Any request containing a header listed in this section will be rejected. The entries
    in this section are case insensitive.


    # AllowExtensions Section


    IfUseAllowExtensions is set to 1 in the Options section, any request containing
    a URL with an extension not explicitly listed here is rejected. The entries in
    this section are case insensitive. Note that you can specify extensionless requests
    (for example, requests for a default page or a directory listing) by placing a
    single dot (.) somewhere in this section, as shown in line 2 of the following
    example:


    ```

    [AllowExtensions]


    .htm

    .html

    etc.

    ```


    We think it''s easier to specify file extensions that you will allow, rather than
    using the DenyExtensions section to try and single out all the requests you won''t
    permit. This depends again on how well you know your own app.'
  merge: -1
  img_proc: true
- pgno: 395
  md: '# Appendix D: UrlScan Installation and Configuration


    # DenyExtensions Section


    The DenyExtensions section contains a list of file extensions. If UseAllowExtensions
    is set to 0 in the Options section, any request containing a URL with an extension
    listed here is rejected. The entries in this section are case insensitive. With
    AllowAllowExtensions, you can specify extension requests with a single dot (.)
    somewhere in this section. If you want to use this method, we suggest using the
    urlscan-static.ini template file that comes to block, the IISLockdown tool. It
    has a good DenyExtensions section.


    # SUMMARY


    By now it should be evident that UrlScan can be a powerful yet flexible ally for
    defenders of IIS-based Web applications. Even better, it''s free! But don''t let
    its simplicity fool you—firewalls, UrlScan is essentially blocking a technology,
    and if you don''t know what to block, you can easily shoot yourself in the foot.
    Ultimately, you''ll have to understand your Web app quite well in order to use
    it effectively.


    And don''t underestimate the idea of keeping UrlScan around even if it''s not
    loaded into memory at all—with a quick edit to UrlScan.ini and an IIS reset, you
    can instantly be protected against the IIS exploit-of-the-month, until Microsoft
    releases a reliable patch or workaround.


    Like most security technologies, UrlScan provides a line between strong security
    and poor usability. We hope this appendix will allow you to walk that line gracefully
    for years to come, as IIS continues to be targeted by devastating exploits.


