- pgno: 142
  md: "# Hacking Exposed Web Applications\n\nCollecting arguments is a complicated\
    \ task that is rarely the same between two applications. As you collect the variable\
    \ names and values, watch for certain trends:\n\n+   - User Identification Look\
    \ for values that represent the user. This could be a username, a number, the\
    \ user's social security number, or another value that appears to be tied to the\
    \ user. This information is used for impersonation attacks. Relevant strings are\
    \ userid, username, user, name, id, uid.\n/login?userid=24601\n\n+   - Session\
    \ Identification Look for values that remain constant for an entire session. Cookies\
    \ also perform session handling. Some applications may pass session information\
    \ on the URL. Relevant strings are sessionid, session, sid, s.\n/menu.asp?id=89CD9A347\n\
    \n+   - Database Queries Inspect for any values that may be passed into a database.\
    \ Common values are name, address, preferences, or other user input. These are\
    \ perfect candidates for input validation and SQL injection attacks. There are\
    \ no simple injections of a database value other than matching a URL's action\
    \ with the data handles.\n/submit.php?Title=Me&iPhone=8675309\n\n+   - Search\
    \ Queries An application search page always accepts a string for the user's query.\
    \ It may also hide fields or hard-coded values that handle how the search is performed,\
    \ how many matches it returns, or what collection of files to search. Look beyond\
    \ the query string and note every argument passed to the search function. Search\
    \ pages will be evident in an application.\n/search?q=*maxret=100&sort=true\n\n\
    +   - File Access Do the arguments appear to be filenames? Applications that use\
    \ templates or customizable pages pull the formatting information from somewhere.\
    \ One of our favorite hacks involves manipulating these types of URLs. The relevant\
    \ argument names are template, file, temp.\n/open.pl1?template=simple\n\nFinally,\
    \ a few arguments that the application programmers may have left by mistake. For\
    \ Boolean arguments (such as \"debug\"), setting their values to TRUE, T, or 1.\n\
    \n+   - debug\n dbg\n- admin\n source\n show"
