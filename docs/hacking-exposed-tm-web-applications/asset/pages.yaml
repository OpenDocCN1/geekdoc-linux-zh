- pgno: 228
  md: '# 202 Hacking Exposed Web Applications


    Input validation attacks attempt to submit data that the application does not
    receive. Normally, an application will perform some type of sanity check on user
    input. This check is to ensure that the data is useful. More important checks
    are necessary to prevent the data from crashing the server. Less stringent checks
    are required if the data is only limited to a specific length.


    The credit card field is for an application''s shopping cart. First of all, the
    credit card number will only consist of digits. Furthermore, most credit card
    numbers are only 16 digits long, but few will be less. So, the first validation
    routine will be a length check. Does the input contain 14 to 16 characters? The
    second check will be for content. Does the input contain anything that is not
    a number? We could add another check to the system determines whether the data
    represents a reasonable credit card number. The value "0000111222" is definitely
    not a credit number, but what about "44357861269388? A simple function can determine
    if a 16-character value passes the checksum of valid credit card numbers. Publishers
    available routines determine the validity and type of a 15-character credit card
    number that starts with a 3 and where the second digit is a 4 or a 7.


    Data validation can be complex. The application programmers have to exercise a
    little foresight to figure out all the possible values that a user might enter
    into a form field. We mentioned simple checks for credit card validation. These
    tests can be programmed in JavaScript, but what about over SSL?


    # EXPECTING THE UNEXPECTED


    One of the biggest failures in "secure" input validation is the routines in JavaScript
    and placing them in the browser. At first, it may seem desirable to use any client-side
    scripting language for the validation routine. They are simple and are widely
    supported between Web browsers (although are individual quirks). Most importantly,
    they move a lot of processing from the Web server to the end-user''s system. This
    is really a Pyrrhic victory for the application. The Web browser is an untrusted,
    uncontrollable environment. A user can modify any information from going and going
    to another Web server—including validation routines. It is much cheaper to buy
    the hardware for additional server-side processing than to wait for a malicious
    user to compromise the application with a simple "%0a".


    The types of input validation attacks usually fall into one of three categories:


    +   **Unexpected Input** This includes formatting characters, cross-site scripting
    attacks that collect users'' passwords, or any character that causes the application
    to generate informational errors.


    +   **Command Execution Characters** These may be specific to the operating system,
    such as inserting a semicolon to run arbitrary commands on a UNIX Web server.
    Or, they could attack the application by inserting SQL, JavaScript, or ASP code
    into arbitrary files.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# Chapter 8: Input Validation Attacks


    +   - **Buffer Overflows** Overflow attacks tend to be the simplest attacks to
    execute. It involves throwing as much as possible against a single variable or
    field and watching the result. The result may be an application crash or it could
    end up executing arbitrary commands.


    # INPUT VALIDATION ENDGAME


    The effect of an input validation attack ranges from innocuous to compromising
    the Web server. These attacks could also be categorized by their goals:


    +   - **Generating Informational Error** The application may provide information
    about SQL entries (table names, field names, home directories). An error reveal
    in page execution causes the application to dump source code.


    +   - **Obtaining Arbitrary Data Access** A user may be able to access data for
    a peer user, such as one customer able to view another customer''s billing information.
    A user may be able to access privileged data, such as an anonymous user being
    able to enumerate, create, or delete users.


    +   - **Obtaining Arbitrary Command Execution** The input contains commands that
    the server executes, such as grabbing passwords, listing directories, or copying
    files. Other commands are executed by the application, such as SQL injection attacks.


    +   - **Cross-Site or Embedded Scripting** These attacks are part of social engineering
    attack against others. Other attacks target the application itself, with the goal
    of executing system commands or reading arbitrary files.


    Input validation is an iterative process. You enter an invalid character into
    a field (or other attack vector) and examine the result. If the result is an error,
    what information does the error reveal? What component of the application caused
    the error? This process continues until all inputs have been checked.


    # WHERE TO FIND POTENTIAL TARGETS


    Every GET and POST request is fodder for input validation attacks. Altering arguments,
    whether they are generated from FORM data or by the application, is a trivial
    feat. The easiest points of attack are input fields. Commonly attacked fields
    are Login Name, Password, Address, Phone Number, Credit Card Number, and Search.
    Other fields that use drop-down menus should not be overlooked, The first step
    is to enumerate these fields and their input type.


    Don''t be misled that input validation attacks can only be performed against fields
    which the user must complete. Every variable in the GET or POST request can be
    attacked. The high-profile targets will be identified by an in-depth survey of
    the application that lists fields, parameters, and form fields.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# Hacking Exposed Web Applications


    # BYPASSING CLIENT-SIDE VALIDATION ROUTINES


    One word: JavaScript. If this word leads your application''s list of security
    measures, the application may not be as secure as you think. Client-side JavaScript—that
    is, JavaScript that is loaded in the Web browser to generate dynamic content or
    some type of validation—can always be bypassed. Some personal proxy, firewall,
    and cookie-management software thwart their ability to strip pop-up banners and
    other intrusive components of a Web site. Many computer professionals (paranoiac?)
    turn off JavaScript completely in order to avoid the latest e-mail virus. In short,
    there are many legitimate reasons and straightforward methods for Internet users
    to use JavaScript.


    Of disabling JavaScript tends to cripple most Web applications. Luckily, we have
    several tools that help surgically remove JavaScript or enable us to submit content
    after the JavaScript check has been performed. With a local proxy such as Achilles,
    we can pause a GET or POST request before it is sent to the server. In this manner,
    we can enter data in the browser that passes the validation requirements, or modify
    any value in the proxy. For example, any test in Figure 8-1 can be edited. The
    arguments to the POST request are highlighted.


    ![](img/2c61c2d28445b774d9266972920f432d_230_0.png)


    Figure 8-1. Using Achilles to bypass input validation routines'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# Chapter 8: Input Validation Attacks


    # 205


    # COMMON INPUT VALIDATION ATTACKS


    Let''s take a look at some common payloads for an input validation attack. Even
    though many of the tests merely dump garbage characters into the application,
    there are other tests that require specifically formatted strings. For the most
    part, we''ll just test for the presence of a vulnerability and leave actual exploitation
    to another chapter. For example, the fulcrum for SQL injection is input validation
    (especially applications that do not validate the query); however, a full discussion
    of SQL injection is covered in Chapter 9.


    # Buffer Overflow


    To execute a buffer overflow attack, you merely dump as much data as possible
    into an input field. This is the most brutal and ignorant of attacks, but useful
    when it returns an application error. Perl is well-suited for this task. One instruction
    will create whatever length necessary to launch the attack:


    ```

    $ perl -e ''print "a" x 500\naaaaa...repeated 500 times

    ```


    You can create a Perl script to make the HTTP requests, or dump the output through
    netcat. Instead of submitting the normal argument, wrap the Perl line in back
    ticks and replace the argument. Here is the normal request:


    ```

    $ echo "GET /login.php?user=faustus\nHTTP/1.0\n\n" | \

    c -vv www.victim.com 80

    ```


    And here is the buffer test, calling on Perl from the command line:


    ```

    $ echo "GET /login.php?user=\n> perl -e ''print "a" x 500\nHTTP/1.0\n\n" | \

    c -vv www.victim.com 80

    ```


    This sends a string of 500 a''s for the "user" value to the login file. This Perl
    trick can be used anywhere on the UNIX (or Cygwin) command line. For example,
    combining this technique with the curl program reduces the problem of dealing
    with SSL:


    ```

    $ curl https://www.victim.com/login.php?user=-perl -e ''print "a" x 500`

    ```


    Another tool, NTOMax, provides more features to automate buffer overflow tests.
    NTOMax is simple to use. Its real strength lies in its support of scripts. Here
    is the basic usage:


    ```

    C:\NTOMax.exe / ?

    ```


    Seek and Destroy - Information Warfare

    NTOMax v2.0 - Copyright(c) 1999, Foundation, Inc.

    Server stress tester for buffer overflow/DOS conditions'
