  md: 'late it manually. It is best to keep the same directory structure as the target
    application.

    For example:


    ```

    www.victim.com

    /admin/admin.html

    /main/index.html

    /menu/menu.asp

    ```


    # MANUALLY INSPECTING THE APPLICATION


    The best way to survey the application is to actually click on every link you
    can find, recording each page''s information in the attack matrix. Manual analysis
    is painstaking, but a serious security review requires interaction with the application.
    As you go through the application, be on the lookout for different types of information:


    +   - Statically and dynamically generated pages

    - Directory structure

    - Helper files

    - Java classes and applets

    - HTML comments and content

    - Forms

    - Query strings

    - Back-connectivity


    The first step is to access the application and determine what authentication
    methods, if any, are in use. We will talk about authentication more in Chapter
    5, but for now it is important to simply identify the method. Also, just because
    the /main/login.jsp page requires authentication, the /main/menu.jsp page may
    not. This is the step where misconfigurations start to become evident.


    # Statically and Dynamically Generated Pages


    Static pages are the .html files usually relegated to FAQs and contact information.
    They may lack functionality to attack with validation tests, but the HTML source
    may contain contents or information. At the very least, contact information reveals
    e-mail addresses and user names. Dynamically generated pages (.asp, .jsp, .php,
    and so) are more interesting. Read a short comment for interesting pages as administrator
    functions, user profile information, or cart view.


    Save the files to disk. Also, maintain the directory structure of the application.
    If www.victim.com has an /include/database.inc file, then create a top-level directory
    called "www.victim.com" and a subdirectory "include," and place the "database.inc"
    file in the include directory. The text-based browser, lynx, can accelerate this
    process:'
