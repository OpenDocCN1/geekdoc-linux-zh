- pgno: 322
  md: '# Hacking Exposed Web Applications


    machine simply by clicking a link within this page. The contents of cookies residing
    on the user''s machine are readable by this script and thus accessible to Web
    site operators.


    Other implementations of this attack used an inline frame (<iframe>) tag embedded
    in HTML on a web (or in HTML-formatted e-messages or newsgroup posts) to steal
    cookies. For example:


    ```

    <iframe src="http://www.peacefire.org/2security%2fiecookies%2fshowcookie.html%3fyahoo.com"></iframe>

    ```


    The patch for this is available at http://www.microsoft.com/tech/security/bullet/ms00-033.asp.
    Hopefully, this sample illustrates the importance of timely application of security
    patches for Web clients—and don''t forget to patch all Web clients, including
    e-mail readers, multimedia players, and so on that are all capable of rendering
    HTML.


    We''d prefer to disable cookies, although many of the sites we frequently require
    them to be enabled. For example, Microsoft''s popular Hotmail service requires
    cookies to be enabled to log in. Because Hotmail rotates between various authentication
    servers, it''s not easy to add Hotmail to the Trusted Zones under Internet Options
    (as we described in the preceding section on security zones). You could use a
    *hotmail.com notation to help out here.


    Cookies are an imperfect solution to inadequacies in HTTP, the alternatives are
    probably worse (for example, appending an identifier to URLs that may be stored
    on proxies). Until someone comes up with a better idea, monitoring cookies using
    the tools referred earlier is the only solution.


    Server-Side Countermeasures Our-side recommendations for avoiding cookie pitfalls
    begin with this: Don''t use them if you don''t need to! Especially be wary of
    setting persistent cookies if the integrity of the client system is all in doubt.


    Of course, recognize that cookies can benefit the security of any Web application
    by keeping track of state to prevent users from unauthorized viewing of authenticated
    pages, randomly browsing into sensitive directories, and so on. If your application
    uses cookies, set a random session key that is expired by the server, and might
    avoid reading security-related data from the cookie (such as ADMIN=TRUE) that
    can trivially be manipulated by users.


    The most robust implementation of cookies leverages an appropriate encryption
    model to prevent any client-side tampering with the cookie value. Encryption is
    a tool, not a solution, but well-implemented encryption can prevent many of the
    most blatant attacks we''ve described in this chapter.


    # SUMMARY


    We''ve come across a number of client-security hobgoblins in this chapter, and
    have recommended approaches for countering all of them. Here is a quick recap
    of their recommendations:'
