    ./analyze -h | more


    ```

    a_form.cgi

    admin-log.1999-09

    admin-log.2001-09

    admin.css

    admin.exec

    admindb.cfg

    admindb.cgi

    allstats.cgi

    ```


    The %0a character represents a newline character. The %0als%0a places the ls command
    on one line, but more importantly the command actually executes. At this point,
    we can execute any command under the Web server''s user privileges. The Web server,
    along with dozens of banks'' information, was compromised by two URLs.


    The success of this test relied on comprehensive input validation testing and
    a detailed survey of the application. Both the directory traversal and command
    execution attacks required extra characters (%00 and %0a) in order to be successful.'
