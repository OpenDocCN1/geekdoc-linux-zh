    \ sent 21, rcvd 27: NOTSOCK\n```\n\nUsing our getit.sh we made a request for the\
    \ /isapi/ directory; however,\nwe omitted an important piece. The trailing slash\
    \ was left off the directory name. This\ncauses an IIS server to redirect to a\
