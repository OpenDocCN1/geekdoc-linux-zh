- pgno: 139
  md: '# Chapter 4: Surveying the Application


    Now we have the name of the form—gs. We know that it uses GET instead of POST
    and it calls a script called "search" in the Web root directory. Going back to
    our search for helper files, the next few files we look for are search.inc, search.js,
    gs.js, and gs.js. A lucky guess never hurts. Remember to download the HTML source
    of the /search file, if possible.


    Next, find out what fields the form contains. Source-sifting is required at this
    stage, but we''ll compromise with grep to make things easy:


    ```

    [root@meddle]# getit.sh www.victim.com /index.html | \\

    > grep -i "input type"

    www.victim.com [192.168.23.26] 80 (http)

    <input type="text" name="name" size="10" maxlength="15">

    <input type="password" name="password" size="10" maxlength="15">

    <input type="hidden" name="vote" value="websites">

    <input type="submit" name="Submit" value="Login">

    ```


    This form shows three items: a login field, a password field, and the submit button
    with the text, "Login." Both the username and password must be 15 characters or
    less (or the application would like to believe). The HTML reveals a fourth field
    called "name." An application may use hidden fields for several purposes, most
    of which seriously inhibit the site''s security. Session handling, user identification,
    passwords, items costs, and other sensitive information tend to be in hidden fields.
    We know you''re chomping at it to actually try some input validation, but be patient.
    We have to finish gathering all we can about the site.


    If you''re trying to create a brute-force script to perform FORM logins, you''ll
    want to enumerate all of the password fields (you might have to use the \\" characters):


    ```

    [root@meddle]# getit.sh www.victim.com /index.html | \\

    > grep -i="password"

    www.victim.com [192.168.23.26] 80 (http)

    <input type="password" name="passwd" size="10" maxlength="15">

    ```


    Tricky programmers might not use the input type or have the words "pass-word"
    or "passwd" in the form. You can search for a different string, although its hit
    rate might be lower. New Web browsers use an autocomplete function that saves
    users from entering the same information every time they visit a site. For example,
    the browser might save the user''s address. Every time the browser detects an
    address field, that is, searches for "address", it will fill the user''s information
    automatically. However, the autocomplete function is usually set to "off" for
    password fields:


    ```

    [root@meddle]# getit.sh www.victim.com /login.html | \\

    > grep -i autocomplete

    www.victim.com [192.168.106.34] 80 (http)

    <input type="text" name="val2" size="12" autocomplete="off">

    ```


    ![](img/2c61c2d28445b774d9266972920f432d_139_0.png)'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Hacking Exposed Web Applications


    This might indicate that “val2” is a password field. At the very least, it appears
    to contain sensitive information that the programmers explicitly did not want
    the browser to store. So, when injecting a page’s fare, make notes about all of
    its aspects:


    +   - Method Does it use GET or POST to submit data? GET requests are easier to
    manipulate the URL.

    - Action What script the form call? What scripting language was used (.pl, .asp)?
    If you ever see a form call with a .sh extension (shell script), mark it. Scripts
    are notoriously insecure on Web servers.

    - Maxlength Are input restrictions applied to the input field? Length restrictions
    are trivial to bypass.

    - Hidden Was the field supposed to be hidden from the user? What is the value
    of the hidden field? These fields are trivial to modify.

    - Autocomplete Is the autocomplete tag applied why? Does it ask for sensitive
    information?

    - Password Is it a password field? What is the corresponding login field?


    # Query Strings


    Query strings are easy to collect. They are also the most important piece of information
    to collect because they represent functionality that may be insecure. You can
    manipulate arguments to attempt to impersonate other users, obtain data, run arbitrary
    system commands, or execute other actions not intended by the application developers.
    Variable names may also provide information about the internal workings of the
    application. They may represent database column names, obvious session IDs, or
    contain the usernames. The application may manage these strings, although it may
    not validate them properly.


    An example is the search function of an application. A normal query is usually
    formed:


    ```

    [root@meddle]# getit.sh www.victim.com /search?q=qweb-security

    www.victim.com [192.168.33.101] 80 (http) open

    -headers removed for brevity.

    <html>

    <head>META HTTP-EQUIV="content-type" CONTENT="text/html">

    <title>Site Search: web search </title>

    ```


    “q-websecurity” would be recorded and is an argument to guess. q stands for query
    and the value is set by the data entered by the user. Other arguments generated
    by the application have no use to input. Take a look at this URL. This first request
    omits the contents, second preserves them:


    ```

    [root@meddle]# getit.sh www.victim.com /tsr/main.asp

    www.victim.com [192.168.129.100] 80 (http) open

    ```'
