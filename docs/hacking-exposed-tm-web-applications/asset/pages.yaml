- pgno: 46
  md: '# THE METHODOLOGY OF WEB HACKING


    The central goal of this book is to set forth a Web application security review
    methodology that is comprehensive, approachable, and repeatable by readers who
    wish to apply the wisdom weve gained over years of performing them professionally.
    The basic steps in the methodology are


    +   * Profile the infrastructure

    * Attack Web servers

    * Survey the application

    * Attack the authentication mechanism

    * Attack the authorization schemes

    * Perform a functional analysis

    * Exploit the data connectivity

    * Attack the management interfaces

    * Attack the client

    * Launch a denial-of-service attack


    This book is structured around each of these steps—we dedicated a chapter to each
    step so that by the end of your read, you should have a clear idea of how to find
    and fix the most severe security vulnerabilities in your own site. The following
    sections will offer a brief preview of what is to come.


    # Profile the Infrastructure


    The first step in the methodology is to glean a high-level understanding of the
    target Web infrastructure. Each component of Figure 1-1 should be reviewed: Is
    there a special client necessary to connect to the application? What transports
    does it use? Over which ports? How many servers are there? Is there a load balancer?
    What is the make and model of the Web server(s)? External sites are relied on
    for some functionality? Chapter 2 will discuss the tools and techniques for answering
    these questions and more.


    # Attack Web Servers


    The sheer number of Web server vulnerabilities that have been published makes
    this one of the first and usually most fruitful areas of research for a Web hacker.
    If site administration is sloppy, you might hit the jackpot here—Chapter 3 will
    describe several attacks that yield remote superuser control over a Web server,
    all over TCP port 80.


    # Survey the Application


    If no serious vulnerabilities have been found, good for the application designers
    (or maybe they’re just lucky). Now attention turns to a more granular examination
    of the'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Chapter 1: Introduction to Web Applications Security


    components of the application itself—what sort of content runs on the server?
    Surveying a Web application attempts to discern what application technologies
    are deployed (ASP, ISAPI, Java, CGI, others?), the directory structure and file
    composition of the site, any authenticated content and the types of authentication
    used, external linkage (if any), and the nature of back-end datastore (if any).
    This is probably one of the most important steps in the methodology, as oversights
    here have significant effects on the overall accuracy and reliability of the entire
    application review. Surveying the application is covered in Chapter 4.


    # Attack the Authentication Mechanism


    If any authenticated content is discovered in the previous step, it should be
    thoroughly analyzed, as it likely protects sensitive areas of a site. Techniques
    for assessing the strength of authentication features include automated password
    guessing attacks, spoofing tokens within a cookie, and so on. Chapter 5 looks
    at Web authentication hijacking in greater detail.


    # Attack the Authorization Schemes


    Once you are authenticated, the next step is to access to files and other objects.
    This can be accomplished in various ways—through directory traversal techniques,
    changing the user principle (for example, by altering form or cookie values),
    requesting objects with useless names, attempting canonicalization attacks, escalating
    privileges, and tunneling privileged commands to the SQL server. This portion
    of the methodology is discussed in Chapter 6.


    We also discuss one of the most important aspects of authorization—maintaining
    state—in Chapter 7.


    # Perform a Functional Analysis


    Another critical step in the methodology is the actual analysis of each individual
    function of the application. The essence of functional analysis is identifying
    each function of of the application (for example, order input, confirmation, and
    order tracking) and attempting to inject faults into each input respectively.
    This process of failed injection is central to software security testing, and
    is sometimes referred to as input validation attacks, which is the title of Chapter
    8.


    # Explore the Data Connectivity


    Some of the most devastating attacks on Web applications actually relate to the
    back-end database. After all, that''s usually all of the juicy customer data stored
    away, right? Because of the myriad of ways available to connect Web applications
    with databases, Web developers tend to focus on the most efficient way to make
    this connection, rather than the most secure. We''ll cover some of the classic
    methods for extracting data—and even using SQL to take control of the operating
    system—in Chapter 9.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Attack the Management Interfaces


    Until now, we haven''t discussed one of the other essential services that typically
    runs on or around Web applications: remote management. Web sites run 24/7, which
    means that it''s not always for the Webmaster to be sitting in the data center
    when something needs updating or fixing. Combined with the natural property of
    Web folk for remote telework (no dress code required), it''s a good bet that given
    Web architecture has a port open somewhere to permit maintenance of servers, content,
    back-end databases, and so on.


    In addition, just about every networking product (hardware or software) that has
    been produced since the mid-''90s likely shipped with a Web-based management interface
    running on an embedded Web server. We''ll chat about some of these as well as
    plain ole''ve Web server management interfaces in Chapter 11.


    # Attack the Client


    In many years of professional Web application testing, we''ve seen darn few reviews
    appropriate time to consider attacks against the client side of the Web application
    architecture. This is a gross oversight in our estimation, there have been devastating
    attacks against the Web user community over the years, including cross-scriptinging,
    like those used for eBay, ETrade, and Citigroup''s Web sites, as well as Internet-born
    worms like Nimda that could be easily implemented within a rogue Web site and
    mailed out via URL to millions of people, or posted to a popular newsgroup, or
    forwarded via online chat. If you think this is bad, we''ve only scratched the
    surface of what we''ll cover in Chapter 12.


    # Launch a Denial-of-Service Attack


    Assuming that an attacker has gotten in this point in the methodology, the last
    refuge of a defeated mind is denial of service (DoS), as a sad but true component
    of today''s Internet. As its name suggests, DoS describes the act of denying Web
    application functionality to legitimate users. It is typically carried out by
    issuing a flood of traffic to a site, de-growing out legitimate requests. We''ll
    cover DoS against Web servers in Chapter 3, and against Web applications in Chapter
    8.


    # SUMMARY


    In this chapter, we''ve taken the 50,000-foot aerial view of a Web application
    architecture, its potential security weaknesses, and a methodology for finding
    and fixing those weaknesses. The rest of this book will zero in on the details
    of this methodology. Buckle your seatbelt, Dorothy, because Kansas is going bye-bye.'
  merge: -1
  img_proc: true
