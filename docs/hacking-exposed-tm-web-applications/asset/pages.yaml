- pgno: 185
  md: '# SUMMARY


    Authentication plays a critical role in the security of any Web site with sensitive
    or confidential information. Web sites have different requirements and no method
    is best for authentication. However, using basic security design principles can
    thwart many of the attacks described in this chapter. First and foremost, input
    validation goes a long way in preventing hacking on a Web site. SQL injection,
    script injection, and command execution can be prevented if input validation is
    performed. In addition, a strong password policy and account lockout policy render
    most attacks based on password guessing useless. Finally, if session identifiers
    are used, they have two properties: 1) they aren''t predictable, and 2) they have
    a big enough key space that can''t be guessed.


