- pgno: 38
  md: '# Hacking Exposed Web Applications


    # The Web Server


    The Web server is most simply described as an HTTP daemon (service) that receives
    requests for resources, performs some basic parsing on the request to ensure the
    resource exists (among other things), and then hands it off to the Web application
    logic (see Figure 1-1) for processing. When the logic returns a response, the
    HTTP daemon returns it to the client.


    There are many popular Web server softwares available today. In our consulting
    work, we see a large amount of Microsoft IIS, the Apache Software Foundation''s
    Apache HTTP Server (commonly called "Apache"), AOL/Netscape''s Enterprise Server,
    and Sun''s iPlanet. To get an idea of what the Web is running on its servers at
    any time, check out the Netcraft service at http://www.netcraft.com.


    Although an HTTP server seems like a simple thing, once again must point out that
    numerous vulnerabilities in Web servers have been uncovered over the years. So
    many, in fact, you could argue that Web vulnerabilities drove hacking and security
    to international prominence in the 1990s.


    # Web Servers vs. Web Applications


    Which brings up the off-blurred distinction between Web servers and Web applications.
    In fact, many people do''not distinguish between the Web server and the applications
    that run on it. This is a major oversight—we believe that vulnerabilities in either
    the server or elsewhere in the application are important, and we will continue
    to make this distinction throughout this book.


    While we''re at, let''s make sure everyone understands the distinction between
    two classes of vulnerabilities, network and system-level vulnerabilities. Network
    and system-level vulnerabilities operate below the Web server and Web application.
    They are problems with the operating system of the Web server, or insecure services
    running on a system sitting on the same network as the Web server. In each case,
    exploitation of vulnerabilities at the network or system level can also lead to
    compromise of a Web server and the Web service on. This is why firewalls were
    invented—to block access to everything but the Web service so that you don''t
    have to worry so much about intruders attacking these points.


    We bring these distinctions so that readers learn to approach security holistically.
    Wherever a vulnerability exists—be it in the network, system, Web server, or application—there
    is potential for compromise. Although this book deals primarily with Web applications
    and a little with Web servers, make sure you don''t forget the other holes as
    well. The other books in the Hacking Exposed series cover network and system vulnerabilities
    in great detail.


    Figure 1-2 diagrams the relationship between network, system, Web server, and
    application vulnerabilities to further clarify this point. Figure 1-2 is patterned
    roughly after the OSI networking model, and illustrates how each layer must be
    traversed in order to reach adjacent layers. For example, a typical attack must
    traverse the network, dealing with wire-level protocols such as Ethernet and TCP/IP,
    then pass the system layer'
  merge: -1
