    The main limitation to whose organizational queries against a typical server is
    that they limit the number of records that will be returned (note that this query
    was curtailed after 50 records). If the target organization has more than 50 domains,
    this is a severe limitation. Organizations wishing to receive unrestricted information
    can typically e-mail the appropriate registrar via the organizational administrative
