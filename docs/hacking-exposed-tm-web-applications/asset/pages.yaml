- pgno: 296
  md: '# WebDAV


    Apparently not satisfied with FrontPage, Microsoft has backed a set of extensions
    for HTTP designed to support Web content management called Web Distributed Authororing
    and Versioning (WebDAV, or just DAV). WebDAV is described in RFC 2518. It is supported
    by default in Microsoft''s IIS Web server version 5 and later, and there are WebDAV
    add-on modules for most other popular Web servers as well (even Apache has mod_dav).


    We''ve gone on the other edition of Hacking Exposed as WebDAV skeptics, mainly
    because it provides a way to write content to the Web server over HTTP, without
    much built-in security other than what is supplied by file system ACLs. This is
    a recipe for disaster in our minds, unless it is heavily restricted. The following
    list shows some of the more effective WebDAV methods:


    +   - MKCOL “Make Collection,” for creating a collection of resources on the server.


    +   - POST Used to post files to collections (this is a standard HTTP method that
    will likely see different use with WebDAV).


    +   - DELETE Need we say what effect this might have?


    +   - PUT Another standard HTTP method that is leveraged by WebDAV to upload content.


    +   - MOVE If unable to deface a Web server, hackers may just move the content
    around.


    +   - COPY Yes, it has an overwrite feature.


    Indeed, there have been a few vulnerabilities in WebDAV already, even though it''s
    not widely deployed yet. Most have been in IIS 5, and have been of medium severity
    (directory structure disclosure to denial of service). At this stage, hacking
    community seems to be concentrating on the low-hanging fruit, as many of the published
    adversaries concern.


    With the support of Microsoft, widespread deployment of WebDAV is probably very
    likely. The best suggestion we can give today is to disable WebDAV on production
    servers, or in a separate instance of the HTTP server with heavy ACL authentication.
    It is also possible to restrict the type of methods that are supported on the
    server, although if you''re using WebDAV, you''re probably going to want your
    authors to have the full run of methods available to them. Make sure you trust
    your authors!


    > See the “References and Further Reading” section at the end of this chapter
    for a link to “How to Disable WebDAV on IIS."'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# Chapter 11: Hacking Web Application Management


    # WEB-BASED NETWORK AND SYSTEM MANAGEMENT


    As the Internet has grown in popularity, HTTP servers have sprouted like weeds
    all over the technology landscape. Practically every networking product available
    today comes with a Web-based management interface. In this section, we will explore
    some of the more widely deployed Web server-based products that we have encountered
    frequently in our travels.


    # Compag Insight Manager Default Passwords


    | Popularity: | 9 |

    | Simplicity: | 9 |

    | Impact: | 9 |

    | Risk Rating: | 9 |


    Compaq Insight Manager (CIM) is a Web-based management interface that comes preinstalled
    with Windows NT/2000 on Compaq hardware. CIM has a lousy security reputation since
    the discovery of a directory traversal vulnerability in mid-1999 that allowed
    anonymous users to read any file on the same volume as the Web root. Thanks to
    a remote buffer overflow deconstruction in 2001 which we will discuss in the next
    section, thanks is not getting any better. With resources of Compaq can still
    fall vulnerable to Web-based flaws.


    CIM''s HTTP-based management agent lives on TCP 2301, and can be viewed with a
    Web browser set to http://victim.com:2301, as shown in Figure 11-2 (hostname and
    IP addresses have been obfuscated). Newer versions of CIM also support an SSL
    interface on TCP port 2381.


    By clicking the "anonymous" link next to "Login Account", the user is taken to
    an HTML form that allows the input for a name and password. By default, CIM is
    accessible using administrator:administrator, administrator:[NULL], and operator:operator.
    These username:password pairs give access to the full system configuration capabilities
    of the product.


    # CIM Default Password Countermeasures


    Probably the best advice for preventing attacks against CIM, in light of its past
    history, is to simply uninstall it. It installed by default on Compaq machines,
    if you''re at a Compaq shop, take note.


    If removing CIM is not an option, restrict access to management interfaces using
    the appropriate IP address-based mechanism (network or host-based firewall), and
    use strong passwords to authenticate access. Be sure to change the default administrative
    account counts and passwords! You can do this by simply browsing the CIM interface'
  merge: -1
  img_proc: true
