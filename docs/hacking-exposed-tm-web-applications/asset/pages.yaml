    We also note that you may be able to find out the actual name of the DISCO file(s)
    by parysing the HTML source of a Web service or related page. We saw how "hints"
    to the location of the DISCO file(s) can be implemented in HTML earlier in this
    chapter, in our discussion of DISCO.


    # DISCO and WSDL Countermeasures


    Assuming that you''re going to publish some information about your Web service,
    the best thing to do to prevent DISCO or WSDL disclosures from becoming serious
    issues is to prevent sensitive or private data from entering the XML. Authenticating
    access to the directory where the file exists is also a good idea. The way to
    ensure that DISCO or WSDL information doesn''t end up in the hands of intruders
    is to avoid creating the relevant .wsdl, .disacom, .disco, and .xsd files for
    the service. If these files are available, they deserve to be published!


    # BASICS OF WEB SERVICE SECURITY


    As we''ve seen, there are potential security vulnerabilities associated with various
    aspects of Web services technologies. Let''s summarize some of these points and
    introduce new ones as we take a look at Web services security from end to end.'
