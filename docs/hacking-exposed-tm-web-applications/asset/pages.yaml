    # FrontPage VSRAD Buffer Overflow


    | Popularity: | 7 |

    | Simplicity: | 9 |

    | Impact: | 10 |

    | Risk Rating: | 9 |


    The most severe of recent FP-related vulnerabilities was a buffer overflow discovered
    by the Chinese research group NSFocus in mid-2001. We say FPSE-related because
    NSFocus actually discovered a problem in a subcomponent of FPSE called Visual
    Studio RAD (Remote Application Deployment) Support. VSRAD allows users of Microsoft''s
    Visual InterDev development platform to administer components on a remote IIS
    server. It is not installed by default on Windows 2000, and actually pops up a
    warning when it is optionally added, mentioning the user that it is a development
    tool and should not be deployed in production.


    If you manage to disregard this warning, you''ll be rewarded by anyone who can
    connect to your Web server. NSFocus released a proof-of-concept tool called fpse2000ex.exe
    that exploits the buffer overflow and shovels a shell back to the attacker''s
    system. We used this tool against a dual-homed Web server at a large multinational
    client, as shown in the following code listing (IP addresses have been changed
    to protect the innocent). Note that you may have to hit ENTER after sending the
    exploit to pop the shell, and subsequent commands may require an additional ENTER
    to work. We compiled this using Cygwin on Win32.


    ```

    C:\>fpse2000ex.exe 192.168.1.254

    buff len = 2201

    ppayload sent!

    ```'
