- pgno: 288
  md: '# Hacking Exposed Web Applications


    For most of this book, we''ve beat on the front door of Web applications. There
    are other avenues of entry? Of course—most Web application servers provide a plethora
    of interfaces to support content management, server administration, configuration,
    and so on. Often, these interfaces will be accessible via the Internet, as this
    is one of the most convenient means of remote Web application. This chapter will
    examine some of the most common management platforms and vulnerabilities associated
    with Web application management. Our discussion is divided into three parts:


    +   - Server administration

    - Web content management

    - Web-based network and system management


    # WEB SERVER ADMINISTRATION


    Yes, Dorothy, people do occasionally manage their Web servers remotely over the
    Internet (grin). Depending on the choice of protocol, these management interfaces
    can present an attractive window to opportunistic attackers. We will briefly cover
    some of the most common mechanisms in this section.


    Before we begin, a brief point about Web management in general. We recommend running
    management services on a single system dedicated to the task, and then using that
    system to connect to individual Web servers—don''t deploy remote management capabilities
    on every server. This narrows the viable attack surface to that one, and also
    allows for management of multiple Web servers from a central location that can
    be heavily restricted and audited. Yeah, OK, if someone manages to compromise
    the remote management server, too, all of the servers it manages are compromised,
    too. We still prefer the “put all your eggs in one basket and watch that basket”
    approach when it comes to remote control.


    > CERT has published some general recommendations for secure remote administration
    of servers—see the "References and Further Reading" at the end of this chapter
    for a link.


    # Telnet


    We still use Telnet for remote management of Web servers today. As if it needs
    repeating, Telnet is a cleartext protocol, and as such is vulnerable to eavesdropping
    attacks by network intermediaries (translation: someone can sniff your Telnet
    password between you and the Web server). And don''t even bother bringing up that
    tired argument about how difficult it might be to sniff passwords on the Internet—it''s
    not the Internet that''s the problem, but rather the multitude of other networks
    that your Telnet traffic must traverse to get to the Internet (think about your
    corporate network, your ISP''s network, and so on). Furthermore, why even take
    the risk when protocols like SSH are available and offer much better security?'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# Chapter 11: Hacking Web Application Management


    If you''re interested in seeing if Web servers are using Telnet, scan for TCP
    port 23 with any decent port scanner.


    # SSH


    Secure Shell (SSH) has been the mainstay of secure remote management for years
    (more than Telnet, at least). It uses encryption to protect authentication and
    subsequent data transfers, preventing the sort of easy eavesdropping attacks that
    Telnet falls to. Be aware that some severe vulnerabilities have been discovered
    in certain implementations of the SSH version 1 (SSH) protocol, so just because
    it has "secure" in its name doesn''t mean you have license to forget best practices
    like keeping abreast of recent security advisories, and we recommend using SSH
    with v2.


    Interestingly, SSH also supports file transfers via the Secure Copy (scp) utility,
    making it even more attractive for those who want to simply manage Web server
    content. We discuss scp again in the upcoming section on content management. Because
    of its common usage as a management tool, we include SSH (TCP port 22) in our
    discovery and enumeration scans when performing Web application audits. SSH is
    still vulnerable to password guessing, and it never hurts to try some of the more
    obvious guesses when performing a Web audit (root:[NULL], root:root-admin, admin:[NULL]),
    and so on.


    # Proprietary Management Ports


    A lot of Web servers ship with their own proprietary management interfaces available
    by default. These interfaces are typically another instance of an HTTP server
    providing access to HTML or script files used to configure the server. They are
    typically authenticated with HTTP Basic. Table 11-1 lists some of the common ports
    used by popular web vendors (we noted these in Chapter 2, but find it important
    to reiterate them).


    As many of these ports are user-defined, they''re not easily identified unless
    you''re willing to perform 65,535-port scans of some subset of your network. Many
    are also protected by authentication mechanisms, typically HTTP Basic or forms-based
    login. The number of easily guessed passwords we''ve seen in our travels makes
    this a worthwhile area of investigation for Web auditors, however.


    # Other Administration Services


    Remote server administration is accomplished a number of ways, and the previous
    discussion certainly isn''t meant to suggest that these are the only services
    used to manage Web servers. We''ve seen a variety of remote control software for
    this purpose, with AT&T Labs'' VNC being most popular in our experience (see the
    most recent edition of Hacking Exposed: Secrets & Solutions) for a comprehensive
    discussion of remote administration tools. VNC listens on TCP port 5800 by default.
    Another very popular remote management tool is Miscorft'' Terminal Services, which
    listens on TCP 3389.'
