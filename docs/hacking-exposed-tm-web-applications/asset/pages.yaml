- pgno: 280
  md: '# Similarities to Web Application Security


    Web services are in many ways like a discrete Web application. They are comprised
    of scripts, executables, and configuration files that are housed in a virtual
    directory on a Web server. Thus, as you might expect, many of the vulnerabilities
    we''ve discussed throughout this book also apply to Web services.


    One of the first and most obvious security issues becomes readily apparent with
    a cursory glance at Figure 10-1: Web services must be accessible across organizational
    boundaries, and in particular, the firewall. Furthermore, they expose business
    contracts to a wide audience via protocols as WSDL, DISCO, and UDDL. So, like
    Web applications, traditional TCP/IP security leaves firewalls and screening routers
    little security for Web services.


    Another apparently apparent issue is the reliance on lower-layer services like
    HTTP servers to support the basic infrastructure of Web services. As we saw in
    Chapter 3, Web servers have a long and colorful record of security vulnerabilities,
    and Web applications that are built on overly configured or unpatched servers
    are merely moments away from being hacked. Like Web services—no matter what application-layer
    security is in place—


    With Web applications, some of the most serious exposures will come from inappropriate
    information disclosure or poor authorization within Web services. Web services
    are just as vulnerable to inappropriate information disclosure as Web applications
    are to revelation of their respective script and authorization configuration files.
    Path information disclosed in these attacks may also lead to the dreaded directory
    traversal attack, which is ultimately a problem with authorization across the
    service or application.


    Finally, our description of the language franca of Web services, SOAP, illustrates
    the applicability of Web application techniques to Web services hacking. For the
    most part, you can hack Web services in the same way you hack Web applications—following
    the methodology outlined in this book. One key difference when using SOAP is that
    communication is implemented using XML payloads in HTTP POST. But this is only
    a minor barrier—once you get the format down, attackers can change the input in
    the many ways we''ve illustrated throughout this book. Even—Web services are designed
    to publish information about each of their endpoints and data types they accept
    through WSDL. Talk about wearing a target on your back.


    # Web Services Security Measures


    Feeling a bit nervous about publishing your new Web service outside the company
    firewall? You should be. This section will discuss some steps you can take to
    protect your online assets when implementing Web services using basic security
    diligence and Web services-specific technologies.


    # Authentication


    If you implement a Web service over HTTP, the access to the service can be limited
    in exactly the same ways as Web applications, using standard HTTP authentication
    techniques'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# Chapter 10: Attacking Web Services


    cussed in Chapter 5, such as Basic, Digest, Windows Integrated, and SSL client-side
    certificates. Custom authentication mechanisms are also feasible, for example,
    by passing authentication credentials in SOAP header or body elements. Web services
    business logic to the periphery of the organization, authentication of all connections
    to the service is something that should be strongly considered. Most of the models
    for Web services contend business-to-business applications, not business-to-consumer,
    so it would be easier to restrict access to a well-defined constellation of at
    least mistrusted users. Even so, attacks against all of the basic HTTP authentication
    techniques are discussed in Chapter 5, so don''t get too overconfident.


    # XML Security


    Since Web services are built largely upon XML, many standards are being developed
    for providing basic security infrastructures to support its use. Here is a brief
    overview of these developing technologies—links to more information about each
    can be found in the “References and Further Reading” at the end of this chapter.


    +   * XML Signature A specification for describing digital signatures using XML,
    providing authentication, message integrity, and nonrepudiation for XML documents
    or portions thereof

    * XML Encryption A companion to XML Signature, it addresses the encryption and
    decryption of XML documents and portions of those documents.

    * XML Key Management Specification (XKMS) Defines measures and protocols for registering
    and distributing public keys, permitting secure key distribution to unknown transaction
    partners.

    * Security Assertion Markup Language (SAML) Format for sharing authentication
    and authorization information.

    * Extensible Access Control Markup Language (XACML) An XML format for information
    access policies.


    We are generally not impressed with buzzwords and acronyms, especially when they''reproven.
    Furthermore, we''ve never actually run implementations of these technologies in
    production environments, so have not had an opportunity to test them in the real
    world. Our mention of these building XML security standards is not meant to imply
    competence or reliability, but rather to raise awareness.


    # SSL


    Because of their reliance on XML, which is usually cleartext, Web services technologies
    like SOAP, WSDL, and UDDI are uniquely exposed to eavesdropping and tampering
    while in transit across the network. This is not a new problem and has been overcome
    Secure Sockets Layer (SSL), which is discussed in Chapter 1. We strongly recommend
    SSL be used in conjunction with Web services to protect against no-brainer eavesdropping
    and tampering attacks.'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# Hacking Exposed Web Applications


    # WS-Security


    On April 11, 2002, Microsoft Corp., IBM Corp., and VerSign Inc. announced the
    publication of a new Web services specification called the Web Services Security,
    or WS-Security (see links to the specification in the "References and Further
    Reading" section at the end of this chapter). WS-Security subsumes and expands
    upon the ideas expressed in similar specifications previously published by IBM
    and Microsoft (namely SOAP, WS-Security, and WS-License).


    In essence, WS-Security defines extensions to SOAP that can be used to implement
    authentication, integrity, and confidentiality in Web communications. More specifically,
    WS-Security defines a standard format for embedding digital signatures, data,
    and security tokens (including binary elements like X.509 certificates and Kerberos
    tokens) within Messages heavily leverages the previously mentioned XML specifications,
    XML Signature and XML Encryption, and is meant to be a building block for a slew
    of other specs that are related aspects of security, including WS-Policy, WS-Trust,
    WS-Privacy, WS-Conversation, WS-Federation, and WS-Authorization.


    The best way to understand WS-Security is via an example. The following SOAP message
    contains the WS-Security header and an encrypted payload (we have left the numbers
    to the left to ease identification of individual message functions):


    ```

    (001) <xml version="1.0" encoding="UTF-8">

    (002) <Envelope xmlns="http://www.w3.org/2001/12/soap-envelope"

    xmlns:ds="http://www.w3.org/2000/09/xmldig#"

    xmlns:wse="http://schemas.soap.org/ws/2002/04/seext#"

    xmlns:xenc="http://www.w3.org/2001/04/xmlenc#">

    (003) <Header>

    (004) <path xmlns="http://schemas.soap.org/rp/

    ```'
  merge: -1
