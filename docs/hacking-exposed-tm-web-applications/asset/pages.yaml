- pgno: 246
  md: '# Common Side Effects


    Input validation attacks do not have to lead to a compromise of the application.
    Many times they generate an information error message. This is not a specific
    type of attack, but will be the result of many of the aforementioned attacks.
    Informational error messages may contain complete path and filenames, variable
    names, SQL table descriptions, servlet errors (including which custom and base
    servlets are in use), database error (ADO errors), or information about the application.
    Keep an eye out for any information that the application or server reveals—a series
    of small clues can lead to a large exploit.


    # COMMON COUNTERMEASURES


    We have already covered several countermeasures during our discussion of input
    validation attacks. However, it''s important to reiterate several key points to
    stopping these attacks:


    +   - Server-Side Input Validation The client is under the full control of the
    user. All data to from the browser can be modified. Therefore, proper input validation
    must be done on the server, outside of the user''s control.


    +   - Character Encoding Characters used in HTML and SQL formatting should be
    encoded in a manner that will prevent the application from misinterpreting them.
    For example


    +   - Regular Expressions Use regular expressions to match data for unauthorized
    content.


    +   - Strong Data Typing Numeric values should be assigned to numeric data structures
    and string values should be assigned to string data structures. Length limitations
    should be assigned whenever possible.


    +   - Proper Error Handling Regardless of what language is used to write the application,
    error handling should follow Java''s concept of Try, Catch, Finally. Try an action,
    Catch specific actions that the action may take, Finally exit if all else fails.
    This also entails a generic, polite error page that does not contain any system
    information.


    +   - Require Authentication Configure the server to require proper authentication
    at the directory level for all files within that directory.


    +   - Use-Privilege Access Run the server and any supporting applications with
    an account with the least permissions possible. The risk to an application that
    is susceptible to arbitrary command execution cannot access the /sbin binary (where
    many UNIX administrator tools are stored) is lower than a similar application
    that can execute commands in the context of the root user.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# SUMMARY


    Input validation tests try to find all of the places in an application that do
    not parse data correctly. This may be because the application blindly accepts
    input from the user, the application tries to sanitize data with easily-bypassed
    client-side scripting, or the application does not expect data to be manipulated.
    Finding a part of the application that is susceptible to an input validation attack
    is often only part of the vulnerability. Properly formatted "invalid" input can
    be used to launch buffer overflows, escape the Web document root, social engineering
    attacks, run SQL injection attacks, or even execute operating system commands.
    Input validation is no small matter and should not be ignored. The top vectors
    for finding vulnerable input parsers are:


    +   - Each argument of a GET request

    - Each argument of a POST request

    - Forms (e-mail address, home address, name, comments)

    - Search fields

    - Cookie values

    - Browser environment values (User agent, IP address, Operating System, etc.)


    Additionally, the following lists lists common input validation characters and
    their URL encoding. These characters do not always lead to an exploit, nor are
    they always "invalid". However, a bit of patience and some creative concatenation
    can turn a few of these characters into an attack.


    | Character | URL Encoding | Comments |

    | --- | --- | --- |

    | '' | %27 | The mighty tick mark (apostrophe), absolutely necessary for SQL injection,
    produces informational errors |

    | ; | %3b | Command separator, line terminator for scripts |

    | [null] | %00 | String terminator for file access, command separator |

    | [return] | %0a | Command separator |

    | + | %2b | Represents [space] on the URL, good in SQL injection |

    | < | %3c | Opening HTML tag |

    | > | %3e | Closing HTML tag |

    | % | %25 | Useful for double-decode, search fields, signifies ASP, JSP tag |

    | ? | %3f | Signifies PHP tag |'
