    Although not technically a cross-site scripting exploit, we''d also highlight
    the following URL to illustrate another approach to tricking users into going
    into one site when they think they''re going to another:


    ```

    http://bigbank.com/script.asp&account=123@evilserver.com

    ```


    A quick glance at this URL may lead you to believe that points to bigbank.com,
    but if you note the @ character near the end, you''ll realize that everything
    to the left of the @ is ignored by the browser, which assumes that it''s a username
    when actually following this link (per the http://user:password@sitename syntax
    used by many browsers).


    Clearly, to exploit a cross-site scripting vulnerability, the end user must take
    some action, whether it be clicking on a malicious link or crossing a Web page
    that was injected by an earlier user. Nevertheless, even though the logic of cross-site
    scripting may seem convoluted, and the likelihood of successfully exploiting it
    may seem low, remember that high-profile Web sites like ebay and E*TRADE got caught
    with cross-site scripting vulnerabilities. At the very least, the PR fallout from
    exposures could be quite embarrassing for a large Web site.


    # Cross-Site Scripting Countermeasures


    Like previous countermeasure discussions in this chapter, we''ve divided our discussion
    into client- and server-side recommendations.'
