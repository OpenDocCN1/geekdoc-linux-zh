    # Ping


    The most basic approach to server discovery is to send ICMP Echo Requests (typically
    implemented via the ping utility) to potentially valid hostnames or IP addresses.
    Numbered tools for performing pings exist, and many are bundled into port scanning
    tools, which we will discuss. Since most Internet-connected networks block port
    scanning, it is rarely an effective server discovery tool.


    # Discovery Using Port Scanning


    One of the most effective mechanisms for discovering Web servers is to port scanning.
    A port scan attempts to connect to a specific set of TCP/or UDP ports and determine
    if a service exists. If a response is received, then it''s safe to assume that
    the responding IP address is a "live" address, which is advertising a live service
    on one or more ports.


    The trick to identifying servers using port scanning is having a comprehensive
    list of potential ports. Scanning anything more than a half of servers across
    all 2^16 (65,536) ports can be quite resource- and time-intensive. Assuming a
    good TCP port scanner averages around hundred ports per second, scanning 254 hosts
    (a Class C space) across all possible ports would take nearly 24-hour days. Depending
    on the amount of available time, it''s probably realistic to select a group of
    ports commonly used by Internet servers and scan for them. For ports like those
    we show in Table 2-2,


    Remember, Table 2-2 is to cover only a subset of the total possible ports that
    might be found on the Internet. By using such an abbreviated list, the amount
    of time required to perform scanning is drastically reduced relative to full 65,535-port
    scans. And yet, not much accuracy is lost, since these services are the likely
    to be found on Internet-accessible hosts, or allowed through corporate firewalls.


    Another way to reduce scan time is to use TCP SYN scans. Instead of completing
    a three-way TCP handshake, this scanning technique only waits for the SYN/ACK
    re-'
