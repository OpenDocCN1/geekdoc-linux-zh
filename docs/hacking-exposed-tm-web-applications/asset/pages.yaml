- pgno: 52
  md: '# 26 Hacking Exposed Web Applications


    Profiling identifies the most basic plumbing of a Web application:


    +   - Server IP addresses, including virtual IPs

    - Server ports and other services

    - Server type and version (possibly including OS type and version as well)


    We will refer to each of these activities as server discovery, service discovery,
    and service identification, respectively. This chapter is organized around a discussion
    of each. Many of the tools and techniques covered in this chapter are derived
    from standard security assessment/hacking methodologies like those covered in
    the other editions of the Hacking Exposed series. We have reiterated them for
    completeness, but have excluded some details that are not relevant to Web application
    security. We recommend readers interested in a more expansive consult those volumes.


    # SERVER DISCOVERY


    As we saw in Chapter 1, Web applications run on Web servers. Thus, the first step
    in our Web security assessment methodology is identification of the physical servers
    on which the application lies. There are a handful of traditional techniques for
    performing this task, which we will discuss in this section.


    # Intuition


    It''s hard finding Web servers on the Internet today. Simply append www. and .com
    (or .org or .edu or .gov) to just about any imaginable term, name, or phrase and
    you stand a very good chance of discovering a Web server. Attackers targeting
    your organization are probably going to use this approach first since it takes
    practically zero effort. They may even try to enumerate servers or other Web sites
    by guessing common hostnames, like www1.victim.com or shopping.victim.com. This
    is not a technique for producing comprehensive results; we will discuss more methodological
    approaches next.


    # Internet Footprinting


    The most recent edition of Hacking Exposed defines footprinting as creating a
    complete profile of a target''s information technology infrastructure. It takes
    into consideration several interfaces on that infrastructure: Internet, intranet,
    extranet, and remote access. With regards to Internet-facing Web applications,
    the most relevant of these is Internet footprinting.


    Internet footprinting is primarily carried out using the whois utility, a tool
    for querying Internet registration databases. whose functionality is typically
    included with'
  merge: -1
  img_proc: true
