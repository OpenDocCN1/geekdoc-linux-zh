- pgno: 238
  md: '# Hacking Exposed Web Applications


    surveying the application. These files are easier to find because they are a known
    quality.


    +   Find common directories. Look for temporary directories (/temp, /tmp, /var),
    program directories (/Program Files, /bin, /winnt, /usr/bin), and popular directories
    (/home, /etc, /downloads, /backup).


    +   Try to access directory names. If the application has read access to the directory,
    it will list the directory contents. Suddenly, your job becomes much easier!


    A web application tester''s notebook should contain recursive directory listings
    for common programs with Web servers. Having a reference to the directories and
    configuration files greatly improves the success of directory traversal attacks.
    The application list should include programs such as Lotus Domino, Microsoft Site
    Server, and Apache Tomcat.


    # Countermeasures


    The best defense against canonicalization attacks is to remove all dots (".")
    the parsing engine should also catch dots in Unicode and hexadecimal.


    Force all to happen from a specific directory. Then allow all path information
    preceding the filename. For example, "/path1/path2../path3/file" should be reduced
    to "/file".


    Secure file permissions also mitigate this attack. First, run the Web server as
    a least-privileged user. This equates to the "nobody" account on UNIX systems
    and the "Guest" account on Windows systems. Next, limit the server account so
    that it can only read files from directories specifically related to the web application.


    Move sensitive files such as files (*.*) out of the document root to a directory
    that the web server can still access. This mitigates directory attacks that are
    limited to viewing files within the document root. The server is still able to
    access the files, but the user cannot read them.


    # Script Attacks


    There are two prerequisites for this attack. First, the application must accept
    user input. This sounds obvious; however, the input does not come from form fields.
    We will list some methods that can be tested on the URL. Second, the application
    must display the user input. The attack occurs when an application renders the
    data, which become HTML tags that the Web browser interprets.'
  merge: -1
  img_proc: true
