    # Dealing with Virtual Servers


    One issue that can skew the outcome of server discovery is load balancing and
    virtual servers.


    We allied sites to load balancing in Chapter 1, and it is an architecture employed
    by large Web sites. If multiple servers scan the canonical name will not include
    data from every server in the farm, but rather only the one that is queued up
    to respond at the time of the scan. Subsequent scans may be directed to other
    servers.


    This is not necessarily an impediment to Web application security review, as we
    re only interested in the security of each individual server in the farm. However,
    a comprehensive review will take this factor into consideration. It only takes
    one bad apple to poison the whole barrel. One simple way to identify individual
    load-balanced servers is to first identify the IP address of the canonical name,
    and then scan a range of IPs around that. For example, you could ping the canonical
    name like:


    ```

    C:\ping victim.com [192.168.10.15] with 32 bytes of data:

