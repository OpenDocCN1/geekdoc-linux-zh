    # DISCO


    Discovery of Web Services (DISCO) is a Microsoft proprietary technology available
    within .NET operating system and other .NET-related products. To publish a deployed
    Web service using DISCO, you simply need to create a .disco file and place it
    in the Web service''s virtual root directory (vroot) along with the other service-related
    files (such as .asmx, .wsdl, and other file types). The disco document is an XML
    document that contains links to other resources to discover the Web service, which
    makes a WSDL fine interface contract. The following example shows a simple DISCO
    discovery:


    ```

    <disco:discovery

    xmlns="http://schemas.soap.org/disco/"

    xmlns:scl="http://schemas.soap.org/disco/scl/"

    <!-- reference to other DISCO document -->

    <disco:discovery

    ref="related-services/default.disco/>

    <!-- reference to WSDL and documentation -->

    <scl:contractRef ref="stocks.asmx?wsdl/>

    docRef="stocks.asmx"/>

    </disco:discovery>

    ```'
