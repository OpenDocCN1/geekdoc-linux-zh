- pgno: 126
  md: '# Hacking Exposed Web Applications


    The purpose of surveying the application is to generate a complete picture of
    the content, function, and flow of the Web site in order to gather clues where
    to find underlying vulnerabilities such as input validation or SQL injection.
    Automated vulnerability checkers typically search for known vulnerable URLs, the
    goal of an extensive application survey is to see how each of the pages fit together.
    In the end, a proper inspection reveals problems with aspects of the application
    beyond the presence or absence of certain files or objects.


    The discussion of Web application surveying in this chapter is organized around
    the following topics:


    +   - Documenting application structure

    - Manual inspection

    - Countermeasures


    # DOCUMENTING APPLICATION STRUCTURE


    The first thing we usually do before surveying the application is a simple click-through.
    Become familiar with the site. Look for all the menus, watch the directory names
    in the URL change as you navigate. Basically, get a feel for the site. That should
    purge any tendency to mindlessly click through the site in time to seriously examine
    the application. Web applications are complex. may contain a dozen files, or they
    may contain a dozen well-populated directories. Either way, documenting the application''s
    structure in a well-ordered manner helps you track insecure pages and provides
    a necessary reference for piecing together an effective attack.


    Opening a text editor is the first step, but a more elegant method is to use a
    matrix. Divide a sheet into columns (or open Excel). In this matrix you store
    information about every page in the application. Relevant information includes


    +   - Page Name Sounds-evident, but it''s necessary. Listing files in alphabetical
    order makes it easier to track down information about a specific page. These matrices
    can get lonely!

    - Full Path to the Page The directory structure leading up to the page. You can
    combine this with the page name. It''s a matter of preference.

    - Does the Page Require Authentication? Can the page be only accessed by valid
    users?

    - Does the Page Require SSL? The URL for a page may be HTTPS, but that does not
    necessarily mean that the page cannot be accessed over normal HTTP. Put the DELETE
    key to work and remove the S!

    - GET/POST Arguments Record the arguments that are passed to the page. Many applications
    are driven by a handful of pages that operate on a multitude of arguments.'
  merge: -1
  img_proc: true
