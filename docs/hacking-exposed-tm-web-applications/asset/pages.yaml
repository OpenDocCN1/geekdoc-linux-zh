    # Active Content Countermeasures


    Clearly, active technologies like JavaScript and ActiveX represent a double-edged
    sword—while they permit developers to create a more rich, and easily managed experience
    for Web users, the power inherent in their capabilities can easily be subverted
    for malice. We present some examples below that can be implemented on both the
    client and server (developer) sides to limit the security risks inherent in using
    active content.'
