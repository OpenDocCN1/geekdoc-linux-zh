    # ## Countermeasures for ISAPI DLL Security Flaws


    We recommend a multifaceted approach to identifying and preventing security issues
    with ISAPI DLLs, and discuss each aspect of our approach below.


    ### Remove Unused Extension Mapping The flaws at the root of the .printer buffer
    overflow and the .ht source include bug in ISAPI DLLs that should be disabled
    by removing the application mapping for the relevant DLLs to .printer and .ht
    files (and optionally deleting the DLLs themselves). This prevents the vulnerabilities
    from being exploited because the DLLs won''t be loaded into the IIS process when
    it starts up. Because of the many security issues associated with ISAPI DLL mappings,
    this is one of the most important countermeasures to implement when securing IIS.


    To unmap DLLs from file extensions, right-click the computer you want to administer,
    select Properties, and then the following items:


    +   * Master Properties

    * WWW Service

    * Edit

    * Properties of the Default Web Site

    * Home Directory

    * Application Settings

    * Configuration

    * App Mappings


    At this final screen, remove the mapping for .printer to msw3prt.dll, as shown
    in Figure 3-1.


    There are other ISAPI DLLs that have serious vulnerabilities associated with them
    in the path. Table 3-1 presents some other DLLs that should be unmapped and their
    associated vulnerabilities.'
