- pgno: 318
  md: '# Hacking Exposed Web Applications


    **Client-Side Countermeasures** As we''ve recommended already in this chapter,
    disable ActiveScripting in the browser. This prevents malicious Web site operators
    or crafty e-mails from easily harvesting information from unsuspecting users.


    Also be sure to disable rendering of <META REFRESH> and <IFRAME> HTML tags if
    your browser supports it. For example, IE allows users to specifically disable
    both <META REFRESH> and launching of programs and files in an <IFRAME> under the
    Security Settings for each Security Zone.


    And, as in the CERT advisory covering cross-site scripting (see "References and
    Further Reading") users should refrain from engaging in "promiscuous browsing."
    While the terminology seems a bit amiss to use, we certainly agree that any half-sentient
    user of the Internet should understand that clicking on hyperlinks, or browsing
    Web pages and HTML-formatted e-mails with ActiveScript enabled, can be a dangerous
    endeavor in today''s world.


    **Server-Side Countermeasures** Web app developers should always use validation
    routines to sanitize all input into their applications. This prevents malicious
    users from creating active content or posting information on your site that could
    trick trick users into sending sensitive or private information to rogets. At
    the very least, routines should strip < and > brackets, which set off the script
    tags used to embed active content in HTML.


    > Some Nestscape browser versions support scripts embedded in HTML using &] enclosures.
    For example, &alert(''document.cookie''); will display the Web site, and there
    are no <SCRIPT> tags.


    > CERT has a lengthy discussion of additional input that should be examined, as
    well as further discussion of additional steps to mitigate the risk of cross-site
    scripting, at http://www.cert.org/tech_tips/malicious_code_mitigation/.


    # COOKIE HIJACKING


    As discussed in chapter 1, HTTP does not have a facility for tracking things from
    one visit to another, an extension was rigged up to allow it to maintain "state"
    across HTTP requests and responses. The mechanism, described in RFC 2109, uses
    cookies, or special tokens contained within HTTP requests and responses allow
    Web sites to remember who you are from visit. Cookies can be per session, in which
    case they remain in volatile memory and expire when the browser is closed or according
    to a set expiration time. Or they can be persistent, residing as a text file on
    the user''s hard drive, usually in a folder "Cookies." (This is typically %windir%\Cookies
    under Win9x or %userprofile%\Cookies under NT/2000.) You might imagine, attackers
    who can lay their hands on your cookies be able to spoof your online identity
    or sensitive information cached within cookies. Read on to see how easy it can
    be.'
  merge: -1
  img_proc: true
