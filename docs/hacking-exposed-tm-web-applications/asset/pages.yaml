    you select doesn''t work the way the vendor promises, you''ll be cursed—not only
    will you still have to deal with the ongoing nightmare of managing patches, but
    you''ll be crippled by your choice of technology. And you''ll be out of the tool
    to boot!


    +   * Not all Hotfixes are directly downloadable from hfnetchik. The hfnetchik
    XML data file lists downloads for each Hotfix, but often the locations listed
    are Web pages, not direct links to installer executables. The automated tools
    discussed here can download only Hotfixes listed as EXEs in the XML file. For
    the others, you''ll need to visit the relevant page on Microsoft.com and follow
    the download instructions there.


