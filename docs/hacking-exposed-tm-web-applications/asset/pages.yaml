    # Java Classes and Applets


    Java-based applications pose a special case for source-sifting and surveying the
    site''s functionality. If you can download the Java classes or compiled servlets,
    you can actually pick an application from the inside. If an application used a
    custom encryption scheme written in a Java servlet. Now, imagine you can download
    that servlet and peek inside the code.'
