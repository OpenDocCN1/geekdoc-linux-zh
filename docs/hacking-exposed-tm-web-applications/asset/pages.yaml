- pgno: 372
  md: '# Hacking Exposed Web Applications


    This appendix presents a brief overview of how to install and configure Microsoft
    Information Server 5.0 (Windows 2000). It is adapted from the documentation that
    ships with the tool (UrlScan.doc, which is available in the IISLockdown distribution),
    several articles from Microsoft.com, Internet news group postings, and our own
    experiences working with the tool individually and as consultants to large organizations.
    With any technology, it is important to understand the advantages and drawbacks
    of using UrlScan, but on the whole, it provides strong defense to IIS if used
    properly. Thus, we have provided a dedicated discussion of it here.


    # OVERVIEW OF URLSCAN


    As noted in Chapter 3, UrlScan is a template-driven filter that intercepts requests
    to Microsoft’s IIS web server (versions 4 and 5.x) and rejects them if they meet
    certain user-defined criteria.


    The UrlScan filter allows the administrator to configure IIS to reject requests
    based on the following


    +   - The method (or verb, such as GET, POST, HEAD, and so on)

    - The file extension of the resource requested (such as .htr, printer, and so
    on)

    - Suspicious URL encoding (see the section “IIS Directory Traversal” in Chapter
    3 to understand why this may be important)

    - Presence of non-ASCII characters in the URL

    - Presence of specified character sequences in the URL

    - Presence of specified headers in the request


    Requests denied by UrlScan can be logged, and log entries typically include the
    reason for the denial, the complete URL requested, and source IP address of the
    requesting client. In denied requests, clients receive an HTTP 404 “Object not
    found” by default. This reduces the possibility of inadvertently disclosing any
    information about the nature of the server to a potential attacker. Also, UrlScan
    provides the administrator with the option of deleting or altering the “Server:”
    header in the response, which can be used to obscure the vendor and version of
    the Web server from simple HTTP requests.


    If you run IIS and you want to take advantage of the greatly increased security
    that UrlScan can offer your site, here are the broad steps you must take to deploy
    it:


    +   - Obtain the UrlScan filter, including updates.

    - Make that Windows family products are updated before installing UrlScan.'
  merge: -1
  img_proc: true
- pgno: 373
  md: '# Appendix D: UrlScan Installation and Configuration


    +   - Install the UrlScan filter, including updates.

    - Edit the UrlScan.ini configuration file according to your needs, necessary.

    - Restart IIS.


    (The last three steps can be performed automatically using the IISLockdown tool.)
    We will discuss each of these steps in detail in this appendix. We have divided
    our discussion into basic and advanced levels. For those who fire and security
    without bothering to understand what UrlScan is doing, read the section "Basic
    UrlScan Deployment" later in this chapter. If you are hands-on and want the technical
    details of how to manually deploy UrlScan and tune it to suit your needs, skip
    ahead to the section "Advanced UrlScan Deployment."


    # OBTAINING URLSCAN


    To obtain UrlScan, download the IISLockdown tool from the link listed in the "References
    and Further Reading" section in this appendix. The UrlScan files from the IISLockdown
    package are version 2.0 of this writing (UrlScan DLL build 6.0.3544.1). In order
    to update UrlScan to the latest version, you will have to obtain the latest installer
    as well.


    # Updating UrlScan


    In 2002, Microsoft published an updated tool called UrlScan.exe that updated installed
    UrlScan files to the most recent version (replaced UrlScan.dll and made a few
    entries to UrlScan.ini). As of this writing, the most recent version of UrlScan
    is 2.5 (build 6.0.3615.0).


    To confuse matters, there are actually two versions of the urlscan.exe updater:
    Baseline UrlScan and UrlScan-SRP. watch out! The main difference between Baseline
    and SRP lies in some minor configuration changes introduced into the IISini file
    (the UrlScan filter itself is exactly the same between Baseline and SRP). SRP''s
    configuration blocks so-called "chunked encoding" of HTTP transfers, which lie
    at the root of server vulnerabilities in IIS 5.x around of Microsoft in April.
    In addition, uploads to the server are restricted to 30MB in SRP configuration
    (it is 2GB in Baseline). Other than these configuration differences (which can
    be manually changed), Baseline and SRP are identical. We recommend using SRP unless
    you know you will have to service clients that rely on chunked encoding.


    A link to the 2.5 upgraders is provided in the "References and Further Reading"
    section later in this appendix. At this point, we will assume that the necessary
    files have been obtained, and will discuss UrlScan deployment. But before we do,
    let''s cover one important item not addressed by UrlScan: updating Windows.'
  merge: -1
  img_proc: true
- pgno: 374
  md: '# UPDATING WINDOWS FAMILY PRODUCTS


    Neither the IISdown tool nor UrlScan requires that the latest Windows family product
    Service Packs and Hotfixes are installed. You must make sure of this on your own!


    # hfnetchk


    The best way to check if your Windows systems have the most up-to-date patches
    is to use a tool such as the Network Hotfix Checker (hfnetchk), available free
    from Microsoft (see the "References and Further Reading" section in this chapter
    for links). hfnetchk currently verifies the most recent patches for the following
    Windows products are installed:


    +   - Windows NT4, Windows 2000, and XP


    +   - IIS


    +   - SQL


    +   - Internet Explorer (IE)


    To run hfnetchk, you must be initially connected to the Internet in order to obtain
    the list of current patches from Microsoft.com. Once the XML list is downloaded
    (it''s called mssecure), you can then use it to determine which machines on a
    given network have the latest patches installed. In order to scan a machine, you
    must have administrative privileges on that system. The output of hfnetchk looks
    like this:


