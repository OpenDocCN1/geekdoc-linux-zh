- pgno: 184
  md: '# Hacking Exposed Web Applications


    The order of OR 1 = 1 at the end of the SQL statement would always evaluate as
    true, and authentication can once be bypassed.


    Many Web authentication packages were found to be vulnerable to similar issues
    in mid-2001. The Apache mod_auth_mysql, oracle, postgres, and pg_sys built SQL
    queries did not check for single quotes (these vulnerabilities were described
    in a CERT advisory from University of Stuttgart, Germany; see “References and
    Further Reading” at the end of this chapter for a link).


    # Countermeasure


    The best way to prevent SQL injection is to perform input validation (see Chapter
    8). For authentication, input validation becomes a little tricky. Input validation
    on the username field is trivial; most usernames are well defined. They are alphanumeric
    and usually 6-10 characters in length. However, strong password policies encourage
    long passwords that contain special characters; this makes input validation much
    more difficult. A promise needs to be made with characters that are potentially
    dangerous that cannot be used in passwords, such as single quotes.


    We''ll also throw in the standard addition to ensure that all software packages
    used by your Web application are up to date. It''s one thing to have a bypass
    attack performed against your custom code, but something else when your free or
    commercial authentication package turns vulnerable to similar issues.


    # BYPASSING AUTHENTICATION


    Many times you find yourself banging against the wall when a door is open around
    the corner. This is often the case when attacking Web authentication. As we noted
    in the beginning of the chapter, many applications are aware of the important
    role that authentication plays in the security of the application. Directly attacking
    Web authentication may not be the easiest method of hacking the Web application.


    Attacking other components of the application, such as authorization to impersonate
    another user, or performing input validation to execute SQL commands (see Chapter
    9 for SQL back-end attacks) can both be used to bypass authentication. The important
    piece of the puzzle to remember is present proper authentication credentials to
    access the other pieces of the application. For example, if the application uses
    Microsoft Passport for authentication, you must send the correct authentication
    cookie to pass the authentication check. However, the Passport infrastructure
    does not perform any additional authorization checks to limit what you can do
    authenticated. In the case of session identifiers, be sure to include you do the
    session identifier cookie in each request. Authorization checks are the responsibility
    of the application and many applications fail to uphold this responsibility.'
