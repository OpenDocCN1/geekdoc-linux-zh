    presentation. Finally, the data layer provides nonvolatile storage of information
    that can be queried or updated by the logic layer, providing an abstraction so
    that data doesn''t need to be hard-coded in the logic layer, and can be easily
    updated (we''ll discuss the data layer by itself in an upcoming section).


    To understand how this all works together, let''s illustrate with an executable.
    Consider a simple web application where the local Web server hard drive for filenames
    containing text supplied by the user and displays the results. The presentation
    layer would consist of a form with a field to input the search string. The logic
    layer might be an executable program that takes the input string, ensures that
    it doesn''t contain any potentially malicious characters, and invokes the appropriate
    database connector to open a connection to the data layer, performing a query
    using the input string. The data layer might consist of a database that stores
    an index of all the filenames resident on the local machine, updated in real time.
    The database query returns a set of matching records, and spits them back to the
    logic layer executable. The logic layer parses out unnecessary data in the recordset,
    and returns the matching records to the presentation layer, which embeds them
    in HTML so that they are formatted prettily for the end user on their trip back
    through the Web server to the client''s browser.'
