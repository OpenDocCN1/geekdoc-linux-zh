  md: '# Hacking Exposed Web Applications


    user’s profile—by adding the “UUID” parameter. The matrix also helps identify
    where state information, and consequently authorization methods, are being handled.
    For the most part, Web applications seem to handle state in a particular manner
    throughout the site. For example, an application might rely solely on cookie values,
    in which the state might be populated with cookie names and values such as Role=manager,
    UID=12345, or IsAdmin=false. Other applications may place this in the URL, in
    which case the state shows same values as parameters.


    The matrix helps even more when the application does not use straightforward names.
    For example, the application could simply assign each a single letter, but doesn’t
    preclude you from modifying the parameter’s value in order to bypass authorization.
    Eventually, you will be able to put together attack scenarios—especially when
    the application contains many tiers of user types.


    # THE METHODOLOGY


    A lot of what you need to know to perform attacks will be obtained from previous
    chapters. The site duplication and analysis of the Web site will help in determining
    how to change the HTTP request to subvert the application. In general, you will
    want to modify input fields that relate to user, username, access group, cost,
    filenames, identifiers, and so on. Where these reside is application dependent.
    Within the HTTP protocol, there are only a few fields where values can be passed.
    These are cookies, the query string, and in a POST request, and hidden tags. We
    will discuss each of them individually. For each, we will describe the data format
    and, more importantly, how it can be changed to hack the app. While working under
    the premise that if it is some kind of input, you can change it—it’s just a matter
    of how, what tool to use, and what to change it.


    Authorization takes whenever the application pulls from the database or accesses
    a Web page. Can the user access the piece of information? How does the application
    identify the user (is it based on authentication, the URL, session management)?
    Some common areas to check within an application


    +   Profiles Is there an area where a user can view their profile information
    (name, address, and so on)? What parameters or cookie values do the profile rely
    on? Does the parameter have to represent a user, a user ID number, or a seemingly
    random number? Can the values be changed to view someone’s profile?


    +   Shopping Carts For ecommerce applications, is there an area to view the contents
    of the shopping cart? What values do the cart view rely on? Can the values be
    changed to view someone else’s cart?


    +   Shopping Checkout What does the “buy now” page in an electronic commerce application
    rely on? Can the values be changed to view someone else’s checkout page? Does
    that page contain that person’s home address and credit card number? Remember,
    a malicious user won’t try access someone'
