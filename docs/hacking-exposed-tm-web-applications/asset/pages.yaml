- pgno: 204
  md: '# Hacking Exposed Web Applications


    the HTTP protocol does not define how a user''s session should be managed tracked
    for Web applications. The protocol was designed for simple document retrieval
    and not for complex Web applications that are common today. For example, if you
    go to http://www.acme.com and want to buy the latest Acme Roadrunner Trap 2000
    and click the Buy button, the shopping cart and the order processing would be
    different from any other online store. The protocol itself does not specify how
    to do it.


    The most basic reason for tracking a user''s session is for applications that
    require users to authenticate. Once a user authenticates, the server has to be
    able to honor requests from that user, ignore requests from a user who has not
    authenticated. Another reason is for online shopping applications. The application
    has to be able to answer such questions:


    +   - What is the user browsing?

    - What did the user choose to purchase?

    - What did the user decide not to purchase?

    - Is the user ready to use this original?


    What does this mean for a hacker? If you leave it up to individual developers
    and Web sites to design their own solutions to perform session state management,
    they are likely to make mistakes that lead to security problems. In this chapter,
    we provide an overview of client-side and server-side session state management
    techniques and identify ways to attack them.


    Web site developers have designed a number of ways to perform session management
    techniques that work within the framework of the HTTP protocol. These techniques
    are quite clever; however, not all of them are secure. The major difference between
    the techniques from a security perspective is where the session is managed, on
    the client or the server.


    Before we dive into the details of session state management techniques, Table
    7-1 shows common information used in a session state by applications. Attacking
    session state mechanisms is a three-part process.


    +   - Find the State Carrier You have to identify where the information in Table
    7-1 is being tracked. Otherwise, there is nothing to test.

    - Replay the State Information The easiest attack is to take the state information—a
    SessionID value, for example—and resubmit it to the application. This is used
    to spoof other users, but requires capturing their information.

    - Modify the State Information Instead of replacing someone''s session information,
    change your own to gain elevated privileges. For example, you could decrement
    the UserID value to attempt to become another user. Although this attack spoofs
    another user, you do not need to capture any of their traffic.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# Chapter 7: Attacking Session State Management


    Decipher the State Information If the state information is stored in a nonobvious
    manner, then you will have to perform some type of analysis.


    Before we try to attack the session state mechanism, we first have to figure out
    where to find it. The next two sections describe common methods for handling state
    via the client and the server.


    # CLIENT-SIDE TECHNIQUES


    In the James Bond movies just about every villain explains his nefarious plot
    of world domination to 007, trusting that an elaborate trap or eccentric mercenary
    will silence Bond before he foils the plan. Web applications often share the villain''s
