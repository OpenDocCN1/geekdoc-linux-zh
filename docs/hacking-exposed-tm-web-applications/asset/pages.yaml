  md: '# Chapter 3: Hacking Web Servers


    However, IIS 5''s default configuration makes this approach difficult (another
    good reason to upgrade from NT 4!). To explain why, we first need to delve into
    a little background on IIS''s processing model. Bear with us; the result is worth
    it.

    The IIS process (inetinfo.exe) runs as LocalSystem and uses impersonation to revert
    requests. (Most commercial Web servers run as something other than the privileged
    user on the machine, according best practices. Components of IIS 6 can run as
    nonprivileged accounts.) IUSR is used for anonymous requests.

    The RevertToSelf API call made in an ISAPI DLL can cause commands to run as SYSTEM.
    In essence, RevertToSelf acts the current thread to "revert" from IUSR context
    to the context under which inetinfo runs-SYSTEM.

    Actually, it''s little more complicated than that. ISAPI extensions are wrapped
    in the Web Application Manager (WAM) object, which can run within the IIS process
    or not. Running "out-of-process" extracts a slight performance hit, but prevents
    unruly ISAPI applications from crashing IIS process and is, therefore, as a more
    robust way to run ISAPI applications. Although proved to boost performance, regarded
    as interesting implications for security arise from this:


    +   * If in-process, WAM runs within IIS process (inetinfo.exe) and RevertToSelf
    gets SYSTEM.

    * If out-of-process, WAM runs within a separate process (mts.exe) and RevertToSelf
    gets the IWAM user, which is only a guest.


    This setting is controlled within the IIS Admin tool by selecting the Properties
    of a Web Site, navigating to the Home Directory, and adjusting the Application
    Protection pull-down menu. IIS 5 sets this parameter to Medium out-of-the-box,
    which runs ISAPI DLLs out-of-process (Low would run them in-process).

    Thus, privilege escalation via RevertToSelf would seem impossible under IIS 5
    defaults—ISAPI applications run out-of-process, and RevertToSelf gets the IWAM
    user, which is only a guest.

    Things are not quite what they seem, however. In February 2001, security programmered
    Horowitz found an interesting mechanism for bypassing the Application Protection
    setting, not noting what was its configuration. While the IIS configuration database
    (called the Metabase), he noted the following key:


    ```

    LM/W3SVC/InProcessIsapiApps

    Attributes: Inh(erit)

    User: Server

    Data Type: MultiSZ


    Data:

    C:\WINNT\System32\idq.dll

    C:\WINNT\System32\inetsrv\httext

    ```'
