- pgno: 377
  md: '# Appendix D: UrlScan Installation and Configuration


    At the time of this writing, Shavlik Technologies offers a free demo of HFNetChkPro.
    You can obtain it by FTPing to ftp.shavlik.com, and entering the username "hfademofree"
    with password "hfademofree447" (no quotes).


    # BASIC URLSCAN DEPLOYMENT


    This section is for readers who want to spend as little brainpower as possible
    deploying UrlScan. Of course, it glosses over a number of important details about
    the tool, and may not result in the optimal results for your Web application or
    service. It also requires that you use Microsoft’s IISLockdown tool, which may
    make changes on your server. These steps will get you UrlScan up and running quickly,
    with minimal investment of gray matter. If you want to have greater control over
    the installation, skip to the section "Advanced UrlScan Deployment" in this chapter.


    The easiest way to deploy UrlScan is to simply run the IISLockdown wizard and
    follow the prompts. The first several options deal with configuration of local
    Internet services, and don''t pertain to UrlScan. However, we''ll walk you through
    these because you''ll need to understand them in order to get to the point where
    UrlScan can be installed.


    > If you are not sure IISLockdown settings are appropriate for you, don''t you
    rerun the wizard and it will give you the option to undo all changes (except services
    that are removed!). This will also disable (but not uninstall) UrlScan.


    The first prompt in the IISLockdown wizard is to select a server template. Templates
    are simply a way to allow you to tailor the security settings of the system to
    its role. Figure D-2 shows the most secure template available, "Static Web server",
    but it configures the server quite restrictively (for example, ASP scripts cannot
    be run by a server configured with this template). If you are only serving static
    HTML files, this is the way to go. Otherwise, you will need to select the template
    from the list that matches your server’s role. Since most of the templates are
    designed around Microsoft products,just pick the product you are using. However,
    be aware that these other options do not disable additional features that are
    shut off by the Static Web Server template, and may result in security exposures.
    This is the classic trade-off of security versus functionality.


    We recommend you select the "View templates" option on this screen, as shown in
    Figure D-2. This will present you with a list of services that will be enabled
    or disabled in the next screen in the IISLockdown wizard, which is shown in Figure
    D-3.'
  merge: -1
  img_proc: true
