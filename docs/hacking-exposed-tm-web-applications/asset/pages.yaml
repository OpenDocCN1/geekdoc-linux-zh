    other Web language. Even though we focus on Microsoft SQL Server quite a bit,
    the techniques carry across database types and all are equally vulnerable to insecure
    coding practices. SQL server is just more equal than others!


    We only need to round up a single suspect responsible for the majority of SQL
    injection problems: the single quote (''''), also known as the tick. A common
    SQL structure uses the tick to delimit variables within the query:


    ```

    strSQL = "select userid from users where password = '''' + password + "";

    ```


    Table 9-1 lists other characters and SQL formatting that we will use to test for
    vulnerabilities. We need to find a vulnerable application before we try to execute
    stored procedures or complicated SQL structures.


    # A Walk in the ODBC Waters


    Poor programming in a Microsoft SQL, IIS, or ASP platform is lethal to application
    security. The SQL injection begins with a tick in the parameter list. The path
    to exploiting the vulnerability might be quick, but it usually requires a series
    of input validation tests to determine the internal structure of the SQL query.
    You''ll need to understand at least part of this structure to figure out how to
    manipulate it properly. The first part of


    | SQL Formatting Characters | Description |

    |---|---|

    | '' | Terminates a statement. |

    | -- | Single line comment. Ignores the remainder of the statement. |

    | + | Space. Required to correctly format a statement. |

    | @variable | Appends variables. Helps identify stored procedures. |

    | ?Param1=foo&Param1=bar | Creates "Param=foo, bar". Helps identify stored procedures.
    |

    | @@variable | Calls an internal server variable. |

    | PRINT | Returns an ODBC error, but does not target data. |

    | SET | Assigns variables. Useful for multiline SQL statements. |

    | % | A wildcard that matches any string of zero or more characters. |


    **Table 9-1.** SQL Injection Tests'
