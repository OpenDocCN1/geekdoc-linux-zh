    exit;\nsub bin2c\n  return unpack(\"N\", pack(\"B\", substr(\"0\" x 32, shift,\
    \ -32)));\nsub dec2bin\n  return unpack(\"B32\", pack(\"N\", shift));\n```\n\n\
    For example,\n$ ./debigip.pl 2147526848\n192.168.0.128\n\nDecoding the port number\
    \ is even simpler. Simply reverse the number's two bytes. For example, 2048 is\
