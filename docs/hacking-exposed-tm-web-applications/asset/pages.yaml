  md: '# Appendix C: Using Libwhisker


    # crawl Function


    The crawl function is probably the most versatile portion of the libwhisker tool.
    It performs the same functionality as wget and other Web mirroring tools, but
    does so with a powerful Perl interface. Crawl does just what its name implies.
    It starts with a seed URL and scours the for additional links, following each
    new one until the function has found every part of the application. A copy of
    the site is useful for source durant the application discovery phase. We could
    use this function to enumerate email addresses, script tags, form variables, and
    any other information we would like.


    Before we dive into the crawl function, we should first take a look at its configuration.
    Libwhisker enables us to set several options that affect crawl performs. Table
    C-3 lists each configuration option.


    | Value | Description |

    | --- | --- |

    | callback | 0 Disable. \function Call "function" subroutine before requesting
    the URI. "Function" receives the current URI and the @ST array that contains the
    target information. If the callback function returns a TRUE (1) value, then crawl
    skips the URI. |

    | do_head | If set to 1, crawl uses a HEAD request first to determine if the current
    request should be ignored or not (based on its content-type, such as a jpg image).
    |

    | follow_moves | 0 Do not follow HTTP 301 redirects. 1 Follow HTTP 301 redirects.
    |

    | normalize_uri | If set to 1, crawl automatically inserts directory traversals
    to obtain the correct absolute URL. |

    | params_double_record | If set to 1, along with use_params, then crawl recruits
    an additional entry for a URI with and without its query parameters. For example,
    both /menu.jsp?d=45 and /menu.jsp are stored as unique. |

    | reuse_cookies | 0 Do not resubmit cookies. 1 When the application tries to set
    a cookie, accept the cookie and include it in all subsequent requests. Note that
    this isn''t the same as storing every cookie for later inspection |


    Table C-3. Libwhisker crawl Function Settings'
