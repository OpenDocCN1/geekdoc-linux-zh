  md: '# SUMMARY


    This chapter focused on the concepts and attack vectors for exploiting poor authorization
    schemes. In many cases, an authorization exploit results from one of several vulnerabilities.
    An input validation attack, for example, does not justify that the application
    needs better input parsing—it could also mean that the application’s role-based
    access can be bypassed as well. Authorization also includes how the application
    or server limits access to particular resources. Application data stored in a
    database are not the only target of an attack. Any file on the operating system
    will be targeted if poor authorization is in place.


