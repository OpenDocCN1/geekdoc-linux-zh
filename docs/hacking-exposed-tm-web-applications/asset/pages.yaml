- pgno: 131
  md: '# Chapter 4: Surveying the Application


    +   - You can search for pages related to a specific Web site. This returns more
    focused results than typing the name in quotation marks. Try "related:www.victim.com
    (without the quotation marks) to find pages that are more specifically related
    to victim.com.


    +   - Search results contain a link to the page within the target Web site, but
    the result also contains a link called "cached". This link pulls the Web page''s
    contents out of Google''s database. Thus, you can view a particular page on a
    site without leaving the comfort of www.google.com. It''s like a super proxy!


    +   - Search results also contain a link called "similar pages." This works like
    the "related" keyword noted above.


    +   - If you have time, you can go through Usenet to see if any relevant information
    has been posted about the site. This might include users complaining about login
    difficulties or administrators asking for help about software components.


    # # Directory Structure


    It is trivial to obtain the directory structure for the public portion of the
    site. After all, the application is designed to be served. However, don''t stop
    at the parts visible through the browser and the site menu menus. The Web server
    may have directories for administrators, of various sites, backup directories,
    data directories, or other directories that are not referenced in any HTML code.
    Try to guess the mindset of the administrators. If static content is in the /html
    directory and dynamic content is in the /jsp directory, then any cgi scripts will
    be in the /cgi directory.


    Other common directories to check (this is a partial list, as Wisker has an extensive
    list):


    +   - Directories that have supposedly been secured, either through SSL, authentication,
    or /admin/, /server/, /admin/


    +   - Directories that contain backup files or log files: /bak/, /backup/, /back/,
    /log/, /logs/, /archive/, /old/


    +   - Personal Archives include: /root/, ~home/, ~cthulhome/


    +   - Directories for internationalization: /de/, /en/, /js/, /global/, /local/


    +   - /1033/, /fr/


    This list is incomplete by design. An application''s entire directory structure
    may be offset by /en/ for its English-language portion. Consequently, checking
    for /include/ will return a 404 error, but checking for /en/include will be spot
    on. Refer to your list of known directories and pages. In what manner have the
    programmers or system administrators laid out the site? Did you find the /inc
