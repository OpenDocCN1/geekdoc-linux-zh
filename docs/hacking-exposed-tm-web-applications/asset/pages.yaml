- pgno: 35
  md: '# Chapter 1: Introduction to Web Applications and Security


    # SSL/TLS


    One of the most obvious exceptions is that many Web applications today tunnel
    HTTP over another protocol called Secure Socket Layer (SSL). SSL can provide for
    transport-layer encryption, that an intermediary between client and server can''t
    read cleartext HTTP right off the server. Other than "wrapping" HTTP in a protective
    shell, SSL does not extend or substantially alter the basic HTTP request-response
    mechanism. SSL does nothing for the overall security of a Web application other
    to make it more difficult to eavesdrop on the traffic between client and server.
    An optional feature of the SSL protocol called client-side certificates is implemented,
    the additional benefit of mutual authentication can be realized(the client''s
    certificate must be signed by an authority trusted the server). However, if any
    sites on the Internet do not today.

    The latest version of SSL is called Transport Layer Security (TLS). SSL/TLS typically
    operates via TCP port 443. That''s all we''re going to say about SSL/TLS for now,
    but it will come up in further discussions throughout this book.


    # State Management: Cookies


    We dvelte a bit on the fact that HTTP is stateless, but a number of mechanisms
    have been conceived to make it behave like a stateful protocol. The most used
    mechanism today uses data called cookies that can be exchanged as part of the
    HTTP request/response dialogue to the client and application they are actually
    connected via virtual circuit (this mechanism is described more fully in RFC 2965).
    Cookies are best thought of as tokens that servers hold to a client allowing the
    access to the Web site as they present the token for each request. They can be
    stored in memory or permanently written to disk. Cookies are not perfect (especially
    implemented poorly) and there are issues relating to security and privacy associated
    with them, but no other mechanism has become more widely accepted. That''s all
    we''re going to say about cookies for now, but it will definitely come up in further
    discussions throughout this book, especially in Chapter 7.


    # Authentication


    On the heels of stateless comes the concept of authentication. What''s the use
    of keeping track of state if you don''t even know who''s using your application?
    HTTP can embed several types of authentication protocols. They include


    +   - Basic Cleartext username/password, Base-64 encoded (trivially decoded).


    +   - Digest Like Basic, but passwords are scrambled so that the cleartext version
    cannot be derived.


    +   - Form-based Custom form is used to input username/password (or other credentials)
    and is processed using custom logic on the back end. Typically uses a cookie to
    maintain "logged on" state.


    +   - NTLM Microsoft''s proprietary authentication protocol, implemented within
    HTTP request/response headers.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Hacking Exposed Web Applications


    +   - Negotiate A new protocol from Microsoft that allows any type of authentication
    specified above to be dynamically agreed upon by client and server, and additionally
    adds Kerberos for clients using Microsoft’s Internet Explorer browser 5 or greater.


    +   - Client-side Certificates Although rarely used, SSL/TLS provides for an option
    that checks the authenticity of a digital certificate presented by the Web client,
    essentially making it an authentication token.


    +   - Microsoft Passport A single-sign-in (SSI) service run by Microsoft Corporation
    that allows Web sites (called "Passport Partners") to authenticate users based
    on their membership in the Passport service. The mechanism uses a key shared between
    Microsoft and the Partner site to create a cookie that identifies the user.


    These authentication protocols operate over HTTP (or SSL/TLS), with credentials
    embedded right in the request/response traffic. We will discuss them and their
    security failures in mind during Chapter 5.


    Clients authenticated with Microsoft’s IIS server using Basic authentication are
    impersonated as if they were accessed locally.


    # Other Protocols


    HTTP is deceptively simple—it’s amazing how much creative people have gotten out
    of its basic request/response mechanisms. However, it’s not always the best solution
    to problems of application development, and still more creative people have wrapped
    the basic in a diverse array of dynamic functionality.


    One simple example is to do with non-ASCII-based content requested by a client.
    How does a server fulfill a request, if it only knows how to speak ASCII over
    HTTP? The versatile Multipart Mail Extensions (MIME) is used to transfer binary
    files over HTTP. MIME is outlined in RFC 2046. This allows a client to request
    any kind of resource with near assurance that the server will understand what
    it wants and return the object to the client.


    Of course, applications can also call out to any of the other Internet protocols,
    such as e-mail (SMTP) and file transfer (FTP). Many Web applications rely on embedded
    link to communicate with clients.


    Finally, work is always afraid to add new protocols to the HTTP suite. One of
    the most significant new additions is Web Distributed Authoring and Versioning
    (WebDAV). WebDAV is defined in RFC 2518, which describes several mechanisms for
    authorizing and managing content on remote web servers. Personally, we don’t think
    this is a good idea, as protocol that involves writing data to a Web server is
    trouble in the making, we’ll see it time and again in this book.


    Nevertheless, WebDAV is backed by Microsoft and already exists in their widely
    deployed products, so a discussion of its security merits is probably moot at
    this point.'
