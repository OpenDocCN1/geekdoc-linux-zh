    # Netscape Enterprise Server


    Netscape Enterprise Server (NES) is a popular e-commerce and intranet Web platform
    with a handful of published vulnerabilities. In this section we''ll discuss the
    most severe of these vulnerabilities, including a known with NES used as a reverse
    proxy.


    The issues cited below pertain mostly to NES, although some may affect a product
    called iPlanet Web Server Edition. The relationship of Netscape and iPlanet is
    confusing, but there''s a little history to clear things up. Netscape was acquired
    by America Online (AOL) in March 1999. Following the acquisition, AOL continued
    to develop the Netscape products and brand them under a new division of the company
    called AOL-SBS (AOL Strategic Business Solutions). Also in 1999, AOL and Microsystems
    created a joint venture business called iPlanet with the goal of marketing the
    companies'' various Web software technologies. The iPlanet alliance was officially
    dissolved in March 2002, and AOL retained "Netscape" branded products and returned
    "iPlanet" branded products. Whatever their past history, NES and iPlanet Web are
    now marketed as entirely separate products by their respective owners.


    # Netscape Enterprise Buffer Overflows


