- pgno: 133
  md: '# Robots.txt


    There is one more file that, if present, significantly reduces the effort of enumerating
    all of the directories. The robots.txt file contains a list of directories that
    search engines like Google are supposed to index or ignore. The file might be
    on Google, or you can retrieve it from the:


    ```

    [root@meddle]# getit.sh www.victim.com /robots.txt

    User-agent: *

    Disallow:/Admin/

    Disallow:/admin/

    Disallow:/common/

    Disallow:/cgi-bin/

    Disallow:/scripts/

    Disallow:/Scripts/

    Disallow:/i/

    Disallow:/images/

    Disallow:/Search

    Disallow:/search

    Disallow:/links

    Disallow:/perl/

    Disallow:/ipch

    Disallow:/newhome

    Disallow:/privacyhome

    Disallow:/legalhome

    Disallow:/accounthome

    Disallow:/producthome

    Disallow:/solutionshome

    Disallow:/tmpgeos/

    ```


    A file like this is a gold mine! The "Disallow" tags instruct a cooperative spider
    to learn the directory. Tools and search engines rarely do. The point is, a robots.txt
    file provides an excellent snapshot of the directory structure.


    We really do love Google. Skeptical that sites no longer use the robots.txt file?
    Try this: "parent directory" robots.txt


    Use Whiser to automate the guesswork for common directories by adding a custom
    rule:


    ```

    array dirs = backup, bak, bkup, css, de, en, fr, inc, include, js,

    local, old, previous, style, xml, xsl

    scan () dirs >> ., dir.txt

    ```


    This will search any Web server for some common directories.'
