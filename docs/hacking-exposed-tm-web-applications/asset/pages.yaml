    misconfigurations, default or insecure files and scripts, and outdated software.
    It can perform checks over HTTP or HTTPS, and it also supports port scanning to
    determine if a Web server is running on any open ports. Best of all, vulnerability
    checks and plug-ins can be automatically updated from the main distribution server
    by using the Update option to Nikto (although the most recent vulnerabilities
    the update Web site was down as we wrote).


    Based on using consulting engagements against real-world Web sites, Nikto performs
    a comprehensive list of checks. In fact, it performs many and so fast that it
