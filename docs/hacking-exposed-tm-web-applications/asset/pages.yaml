- pgno: 136
  md: "# Hacking Exposed Web Applications\n\nJava is designed to be a write once,\
    \ run anywhere language. A significant byproduct of this is that you can actually\
    \ decompile a Java class back into the original source code. The best tool for\
    \ this is the Java Disassembler, or jad. Decompiling a Java class with jad is\
    \ simple:\n\n```\n[root@meddle#] jad SnoopServlet.class...\nParsing Servlet.class.\
    \ Generating SnoopServlet\n[root@meddle#] cat SnoopServlet.jar\n// Decompiled\
    \ by Jad v1.0.57. Copyright Pavel Kounetzsov.\n// Jad home page:\n// http://www.geitiesities.com/SiliconValley/Bridge/8617/jad.html\n\
    // Decompiler options: packimports (3)\n// Source Name:\n    SnoopServlet.java\n\
    \nimport java.io.IOException;\nimport java.io.PrintWriter;\nimport java.util.Enumeration;\n\
    import javax.servlet.*;\nimport javax.servlet.http.*;\n```\n\npublic class SnoopServlet\
    \ extends HttpServlet\n{\n...remainder of decompiled Java code...\n\nYou don't\
    \ have to be a full-fledged Java coder in order for this to be useful. Having\
    \ access to the internal functions of the site enables you to inspect database\
    \ calls, file formats, input validation (or lack thereof), and other capabilities\
    \ of the server. It can be difficult to obtain the actual Java class, but try\
    \ a few tricks such as:\n\n+   **Search for Servlets in Backup Directories** If\
    \ a servlet is in a directory that the servlet engine does not recognize as executable,\
    \ then you can retrieve the actual file instead of receiving its output.\n\n+\
    \   **Search for Common Test Servlets** SessionServlet, AdminServlet, SnoopServlet,\
    \ Test. Note that many servlet engines are case-sensitive so you will have to\
    \ type the name exactly.\n\n# HTML Comments and Content\n\nHTML comments are a\
    \ hit-miss prospect. They may be pervasive and uninformative, or they may be rare\
    \ and contain user passwords. The <-- characters mark all basic HTML comments.\
    \ It is possible that these comments contain descriptions of a database table\
    \ for a subsequent SQL query."
