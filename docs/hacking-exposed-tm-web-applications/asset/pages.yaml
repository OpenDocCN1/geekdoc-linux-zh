    \ of the server—when it's behind a\nfirewall or load balancer. Apache is just\
    \ as susceptible. It doesn't reveal the internal\nhostname or IP address of server,\
    \ but it will reveal virtual servers.\n\n```\n[root@meddle] # getit.sh www.victim.com\
    \ /\nwww.victim.com [192.168.130.20] 80 (http) open\nHTTP/1.1 301 Moved Permanently\n\
    Date: Wed, 30 Jan 2002 06:44:08 GMT\nServer: Apache/2.0.28 (Unix)\nLocation: http://dev.victim.com/mail/\n\
    Content-Length: 308\nConnection: close\nContent-Type: text/html; charset=iso-8859-1\n\
    ```\n\n```\n<!DOCTYPE HTML PUBLIC \"//DTD//HTML 2.0//EN\">\n<html>\n<title>301\
    \ Moved Permanently</title>\n</head>\n<body><h1>Moved Permanently</h1>\n<p>The\
