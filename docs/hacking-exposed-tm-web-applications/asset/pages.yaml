    At the very least, this shows us that the .html file is actually a link to the
    index.shtml. The .shtml extension implies that parts of the page were created
    with server-side includes. Induction plays an important role when serving the
    application, and why it''s important to be familiar with various types of Web
    technologies. Pop query: What type of program could be responsible for the information
    in the S1d showed above?


    Comments may seem innocuous, but even simple lines can be helpful. Multiple requests
    for the same page might return different comment fields. This is due to the fact
    that the servers reside behind load balancers. Given enough time, we might be
    able to figure out the size of the server farm! For example, two sets of comments
    might contain:


    ```

    <-- ServerInfo: MPSFEISIB093 2001.10.3.13.34 Livel --

    <-- Version: 2.1 Build 84 --


    <-- ServerInfo: MPSFEISA096 2001.10.3.14.30 Livel --

