- pgno: 398
  md: '# Hacking Exposed Web Applications


    What would a book be like without a companion Web site to keep readers updated
    on the dynamic and rapidly evolving field of Web security? With this in mind,
    the authors of Hacking Exposed Web Applications have created a Web site for the
    book at http://www.webhackingexposed.com. At this Web site, you''ll find the following
    information.


    **Authors** Biographies of all authors, with e-mail addresses for your comments.


    **Contents** The complete table of contents is published here, including chapters
    and sections.


    **Errata** No one is perfect and that goes double for us. In our rush to get you
    timely security information, we can miss a detail or two here and there. So, to
    better enable you to garner the most accurate information possible, we have posted
    the corrections to the current edition.


    **Links** All the links found in the book can also be found online here. We try
    to keep these updated, but if you find a busted one, let us know.


    **Reviews** Reviews of the book by respected members of the online community.


    **Tools and Scripts** All of the authors'' custom tools and scripts discussed
    in the book, available for download.'
  merge: -1
  img_proc: true
