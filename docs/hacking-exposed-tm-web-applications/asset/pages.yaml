    distinguishes between directories and files that exist and those that do not.
    Finally, we discovered a /data directory. This directory is within our mysterious
    path to the printables.asp.


    To summarize the steps for enumerating files:


    +   - Example codes. Determine if the application returns different errors for
    files that do not exist, directories that do not exist, files that do exist (but
    perhaps read access denied), and directories that do exist.


    +   - Find the root. Add directory traversal characters until you can determine
    where the drive letter or root directory sits.


    +   - Move down the Web document root. Files in the Web document root are easy
    to enumerate. You should already have listed most of them when we first started'
