- pgno: 208
  md: '# Hacking Exposed Web Applications


    # The URL


    Take another look at the FORM example from the previous section. There was another
    hidden "field" in the action element of the FORM:


    ```

    <FORM name=login_form action=

    https://login.victim.com/config/login?4fr0naidr6d method=post >

    ```


    Session variables do not have to be in SETs for the order to track the them. The
    server can set parameters or redirects customized to a specific user. Other examples
    might look like this:


    ```

    /redirect.html/103-673347-6580661/

    /ViewBase#sidrS5J5iOEEACi6r0E2ksQJnUEiakKFH/

    /index.php?session_id=E3DF0FC4C-E5F7-4844-8DD9-4808906D85

    ```


    In the latter case, the "sid" name gives the session ID. Carrying the session
    ID in the URL is not insecure, but there are many points to keep in mind.


    +   * HTTPS If the session ID can be decoded from another computer, a malicious
    user could cleartext HTTP connections in order to spoof other users.

    * Bookmarks A user might bookmark a URL that includes a session ID. If the application
    session IDs or removes them (if it has a small pool), then the bookmark will be
    invalid when the user returns.

    * Content This applies to any client-side session ID. If the content can be decoded
    or decrypted, then the session ID is insecure. Check out the "SessionID Analysis"
    section in this chapter for more information.


    # HTTP Headers and Cookies


    Cookie values may be the most common method for saving state information. Ephemeral
    (nonpersistent) cookies are used to track state for a single session. The IIS
    ASPSESSIONID values are a good example of these types of cookies. These cookie
    values are never stored on the user''s computer. You will need a tool like Achilles
    to see these values.


    Persistent cookies are stored on the user''s computer and last between sessions.
    A-persistent cookie has the:


    ```

    Set-Cookie: NAME=VALUE; expires=DATE; path=PATH;

    domain=DOMAIN_name; secure

    ```


    The cookie''s value carries the state information. Sites that "Remember me" function
    use these types of cookies. Unfortunately, they also tend to be insecure. Here''s
    an example:


    ```

    Set-Cookie: autolog=bWlrZpteXMzY3IdA%3D%3D; expires=Sat, 01-Jan-2023

    00:00:00 GMT; path=/; domain=victim.com

    ```'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# Chapter 7: Attacking Session State Management


    The autolog P appears to contain random letters, but that''s not the case. It
    is merely Base 64 encoding for “mike:mys3cr3”—looks like the username and password
    are stored on the system. To combat the issue, the "secret" keyword in the cookie
    is missing. This means that the browser will permit the cookie to be sent over
    HTTP.


    # Expire Times


    When you log out of an application that uses persistent cookies, the usual behavior
    is to set the cookie value to NULL with an expire time in the past. This erases
    the cookie. An application might also use the expire time to force users to reauthenticate
    every 20 minutes. The cookie would only have a valid period of 20 minutes from
    the user first authenticated. When the cookie has expired, the browser deletes
    it. The application disappears and asks the user for new credentials. This sounds
    like an effective method of timing out unused sessions, but only if it is done
    correctly. If the application sets a “password” that expires in 20 minutes:


    ```

    Set-Cookie: HasPwd=451jh28f;expires=Tue, 17-Apr-2002

    12:00 GMT; path=/; domain=victim.com

    ```


    then extend the expire time and see if the server honors the cookie:


    ```

    Set-Cookie: HasPwd=451jh28f;expires=Tue, 17-Apr-2003

    12:00 GMT; path=/; domain=victim.com

    ```


    This is how you can determine if there are any server-side controls on session
    times. If this new cookie, valid for 20 minutes plus one year, lasts for an hour,
    then you know that the 20-minute window is arbitrary—the server is enforcing a
    hard timeout of 60 minutes.


    # HTTP Referer


    We''ve seen sites use the HTTP Referer (yes, that''s spelling) header for session
    and authentication handling. This is similar to passing the state in the URL,
    but the data have to be captured with a tool like Achilles.


    # SERVER-SIDE TECHNIQUES


    Server-side session tracking techniques tend to be stronger than those that transmit
    information to the client. Of course, no server-side technique keeps all of the
    state information from the client. After all, it is necessary to identify the
    user. The difference with a server-side technique is that state information such
    as profile, privileges, and shopping cart information are all stored on the server.
    The client only passes a single session ID as identification.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# Server-Generated Session IDs


    Modern Web servers have the capability to generate their own, (hopefully) random
    session IDs. The IDs generated by these servers tend to be large (32 bit), random
    numbers. This precludes many types of attacks, although they are all vulnerable
    to session replay attacks. Table 7-3 lists some common servers and their corresponding
    session tracking variables.


    # Session Database


    Applications that rely heavily on databases have the option of tracking sessions
    almost fully on the server. A session database is an extremely effective technique
    of managing sessions across several Web servers in a secure manner. The server
    still generates a unique number and passes it to the client; however, no additional
    information leaves the server.


    When a user first logs in to the application, the application generates a temporary
    session ID. It stores the ID in a session table. All information is stored in
    the row as the session ID. Each time the user requests a new page, the application
    takes the session token and looks up the value in its session table. As long as
    the session ID is valid, the application grabs the current state from the row
    in the session table.


    The advantage of a session database is that only one value needs to be passed
    to the client. State information cannot be sniffed, spoofed, or modified. Another
    routine in the database can periodically poll the table and automatically expire
    session IDs that have been used for an extended period of time. Thus, the application
    can enforce time limits and nar-


    | Session Server | Session ID Variables |

    |---||

    | IIS | ASPSESSIONID |

    | Tomcat (Servlet/JSP engine) | JSID |

    | PHP | PHPSESSID |

    | Apache | SESSIONID |

    | ColdFusion | CFID CFTOK |

    | Miscellaneous | JServSessionID JWSESSIONID SESID SESSION SID session_id |


    Table 7-3. Common Session ID Variables'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# Chapter 7: Attacking Session State Management


    row the window of possible session ID guessing attacks. A session database can
    also track how many times a user has logged in to the site. For example, it might
    be a good idea to limit users to a single login. This would diminish the chance
    of success for a brute-force guessing attack against the session ID. A malicious
    user might guess a correct ID, but the application would not allow concurrent
    logins. This could also lock users out of the application for brief periods of
    time—be sure to expire the session ID in a reasonable time period.


    The drawback of a session database is that a single value is passed to the client.
    If this value is nonrandom or easily determined, a malicious user could guess
    valid session IDs. Additionally, this method should only be used over SSL in order
    to maintain the security of the session ID.


    # SESSIONID ANALYSIS


    Testing a session ID does not have to be an active attack. Depending on the state
    information is passed, encoded, or encrypted, you could gather a wealth of information
    about the application (internal parameters or variables), other users (profile
    information in the state values), or the server (IP address, state name). Any
    data gathered about the application provides more clues to the application''s
    internals or how to exploit a vulnerability.


    # Content Analysis


    The first thing is to determine what you''re up against. Is state information
    passed along several variables, or just one? Is it based on a numeric value, or
    a string? Can you predict what the next value is going to be? Is the string encrypted,
    or just encoded? Can you decode it? Can you decrypt it?


    There are a lot of questions we need to ask about the state information. This
    section will point you in the right direction for finding out what''s being passed
    by the application.


    # Deterministic Values


    State information could contain usernames, ID numbers, or several other items
    to the application. There are also other items that tend to make up session tokens.
    Since a session commonly ties one client to one server at a point in time, there
    are nonapplication data that you can find. A date stamp, for example, could be
    identified by values that continuously increase. We list several common items
    in Table 7-4. Keep these in mind when analyzing a session token. A timestamp might
    be included, for example, encoded in Base 64.


    > TIP Use the GNU "date +%s" command to view the current epoch time. To convert
    back to a human-readable format, use the Perl command: perl -e ''use Time::localtime;
    print ctime(<epoch>)'''
