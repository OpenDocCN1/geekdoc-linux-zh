    # SERVER IDENTIFICATION


    Server identification is more commonly known as banner grabbing. Banner grabbing
    is critical to the Web hacker, as it typically identifies the make and model of
    the Web server software. The HTTP 1.1 specification (RFC 2616) defines the server
    response header field to communicate information about the server handling a request.
    Although the RFC encourages implementers to make this field a configurable option
    for security reasons, most every current implementations populate this field with
    real data by default.

    Here is an example of banner grabbing using the netcat utility:


    ```

    D:\nc -nnv 192.168.234.34 80 ([]) open

    (UNKNOWN) [192.168.234.34] 80 (?)

    HEAD / HTTP/1.0

    [Two carriage returns]

    HTTP/1.1 200 OK

    Server: Microsoft-IIS/5.0

    Date: Fri, 04 Jan 2002 23:55:58 GMT

    [etc.]

    ```


    > Note the use of the HEAD method to retrieve the server banner. This is the most
    straightforward method for grabbing banners.


    Text file input can be input to netcat connections using the redirect character
    (<)—for example, nc -vv server 80 < file.txt.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Hacking Exposed Web Applications


    Banner grabbing can be performed in parallel with port scanning if the port scanner
    supports it. We typically use fscan with the -b switch to grab banners while port
    scanning. Here is the scan previously run for service discovery run with the -b
    switch (output has been edited for brevity):


    ```

    D:\>fscan -bgp 80,81,848,443, [rest of ports in Table 2-3]

    ,8888,9090,10000 192.168.234.1-254

    ```


    ```

    Fscan v1.12 -- Command port scanner.

    Copyright 2009 (c) by Foundstone, Inc.

    http://www.foundstone.com

    ```


    Scan started at Fri Feb 15 16:02:09 2002


    ```

    192.168.234.1 80/tcp

    192.168.234.34 80/tcp

    HTTP/1.1 400 Bad Request [OD][0A]Server: Microsoft-IIS/5.0[0D][0A]

    192.168.234.34 443/tcp

    192.168.234.34 8000/tcp

    192.168.234.148 80/tcp

    HTTP/1.1 400 Bad Request [OD][0A]Server: Microsoft-IIS/5.0[0D][0A]

    192.168.234.148 443/tcp

    192.168.234.148 8000/tcp

    [etc.]

    ```


    Fscan uses the HEAD method to grab banners from open ports, and it does not always
    retrieve HTTP 200 in response, as shown here. Note also that it does not retrieve
    banners from SSL services, an issue we will discuss next.


    # Dealing with SSL


    As we''ve noted, tools like netcat and fscan cannot connect to SSL services in
    order to grab banners. How do you grab banners from SSL services?


    One of the easiest ways is to use a local proxy to intercept communications and
    tunnel over SSL to the target server. Good tools for this exist, but one of our
    favors is sslproxy. The following command illustrates how to start sslproxy to
    listen locally on port 5000, and connect to a remote server on port 443. A certificate
    named dummycert.pem is used to negotiate the SSL connection (it comes with sslproxy).


    ```

    C:\sslproxy -l 5000 -R www.victim.com -r 443

    -c dummycert.pem -p ssl123

    ```


    SSL: No verify locations, trying default

    proxy ready, listening for connections


    Now we can open another command, connect to the local host on 5000 using netcat,
    and attempt to grab banner info:'
