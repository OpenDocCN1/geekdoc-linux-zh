    # UNION


    A UNION statement combines SELECT statements. It used to retrieve all rows from
    a table. The basic syntax is


    ```

    UNION ALL SELECT FROM TABLE WHERE condition

    ```


    You can easily deduce the field and table from variable names in the application,
    .inc files, or SQL errors. The condition is usually always true, such as 1=1 or
    "=" (nothing equals nothing).


    # INSERT


    The INSERT instruction does just, inserts a value into a table. This might not
    seem very useful; after all, we want to find out what''s in the database. It is
    useful for bypassing authentication. If we use SQL injection to insert a new user
    into the users with the name "neo" and password "trinity":


    ```

    INSERT INTO VALUES(''neo'', ''trinity'')

    ```


