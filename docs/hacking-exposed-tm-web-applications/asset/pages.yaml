- pgno: 134
  md: '# Helper Files


    Helper file is a catchall appellation for any file that supports the application,
    but usually does not appear in the URL. Common “helpers” are JavaScript files.
    They are often used to format HTML to fit the quirks of popular browsers or perform
    client-side input validation. files include


    +   - Cascading Style Sheets CSS files (.css files) instruct the browser how to
    format text. They rarely contain sensitive information, but enumerate them anyway.

    - XML Style Sheets Applications are used to XML for data presentation. Style sheets
    (.xsl) define the document structure for XML requests and format. They tend to
    be a wealth of information, listing database fields or referring to other helper
    files.

    - JavaScript Files Nearly every Web application uses JavaScript (.js). Much of
    it is embedded in the actual HTML file, but individual files also exist. Applications
    use JavaScript files for everything from browser customization to session handling.
    In addition to enumerating these files, it is important to note what types of
    functions the file contains.

    - Include Files On IIS systems, include files (.inc) often control database access
    or contain variables used internally by the application. Programmers love to place
    database connection strings in this file, password and all!

    - The “Others” References to ASP, PHP, Perl, text, and other files might be in
    the HTML source.


    URLs rarely refer to these files directly, so you must turn the HTML source in
    order to find them. Look for these files in server-side include directives and
    script tags. You can inspect the page manually, or turn to your handy command-line
    tools. Download the file and start your common file suffixes and directives:


    +   - asp

    - cfn

    - css

    - file

    - htc

    - htw

    - inc

    - #include

    - js

    - php'
