- pgno: 304
  md: '# Hacking Exposed Web Applications


    We have focused up to this point on identifying, exploiting, and patching common
    Web security holes, with an emphasis on server-side waves. But what about the
    client side?


    As we discussed in Chapter 1, Web applications rely on client architectures, and
    often, very short shift is given to the thin end of this equation. This is a mistake—at
    as many security vulnerabilities exist on the other end of the Internet telescope,
    and numerous other factors make them just as likely to be exploited.


    We will discuss these factors and related vulnerabilities in this chapter. We
    will begin with a brief overview of the challenges faced with client-side security,
    and we''ll tackle several of the most severe types of vulnerabilities that we''ve
    seen in the real.


    # THE PROBLEM OF CLIENT-SIDE SECURITY


    After perusing nearly dozens chapters of the many problems faced on the server
    side of Apps, you may be tempted to dismiss client-side security as uninteresting
    or worthy of attention. If you''re mistaken, the following events will hopefully
    illustrate:


    +   August 2000 Silicon Valley computer consultant Dan B불어 releases a program
    he calls Brown Orange to demonstrate how he discovered that allow a Java app to
    take privileged actions on a client system when browsing a malicious website.
    Although no exploits are observed in the world, B불어''s announcement caused a swirling
    media sensation focusing a great deal of negative PR on the Java platform.


    +   September 2000 San Francisco computer programmer Jeff Baker reports on the
    Bugtra security mailing list that customer accounts at the online brokerage ETRADE
    are vulnerable to cross-site scripting and cookie manipulation attacks.


    +   January 2002 security researcher Dave DeVry notifies readers of the Bugtraj
    mailing list that Citibank''s online cash-payment site, C2IT.com, has fixed a
    cross-site scripting security flaw that he claims privately normed the company
    about September. DeVry says that the vulnerability would enable an attacker to
    see "credit-card numbers, bank-account numbers, security codes, and other data
    without obfuscation."


    These are just a handful of cases that have suffered from client-side security
    disclosures in the recent past—others include such AOL, eBay, Microsoft, Yahoo,
    MSN, Elite, and Lycos. Clearly, some large organizations suffered a great deal
    of public relations damage from such disclosures, and have additionally suffered
    losses related to customer data exposure, system downtime to address the underlying
    technical issues, and potential legal costs. Even though these problems did not
    fall into the mold of a classic Internet hack, where a server is compromised over
    the Internet by a malicious intruder who steals data (or worse), the effect was
    nearly the same.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# Chapter 12: Web Client Hacking


    What lessons can we draw from these anecdotes? Lesson #1: Customers are probably
    just as likely to feel threatened by an attack against their Web browser as they
    are by an attack against their favorite e-commerce site, and maybe more. Lesson
    #2: Revenue losses related to client-side security issues can easily rival their
    server-side counterparts. Lesson #3: The client is a tightly integrated part of
    a Web application, and its security impacts the entire application.


    # Attack Methodologies


    We''ve spent an entire book detailing methodologies commonly employed for attacking
    Web application servers. Similar methodologies exist for Web clients? Sure! The
    field of client hacking can often seem chaotic, comprised of a dizzying array
    of tools and techniques that are evolving rapidly to track. However, we find that
    most of serious threats fall into the following categories:


    +   - Active content attacks

    - Cross-site scripting

    - Cookie manipulation


    If you are asked to audit the security of a Web application''s client interface,
    these are the areas that you should be checking. We will discuss what to look
    for each category in the upcoming sections of this chapter.


    # Attack Vectors


    How are the attack techniques delivered to clients? Of course, the Web browser
    supplies one of the most obvious routes. However, placing a malicious Web site
    on the Internet is probably one of the least efficient mechanisms for targeting
    victims—how could a hacker be sure that his targets would cross across his Web
    site? The most effective vector for client hacking is e-mail. Every modern e-mail
    client renders HTML, so they are practically the equivalent of the browser itself.
    Even better, e-mail provides a much more explicit targeting mechanism. Individuals
    can be attacked using highly customized payloads as long as their email address
    is known by the attacker.


    # ACTIVE CONTENT ATTACKS


    Somewhere during the brief evolution of Web communications, someone had the bright
    idea that the client shouldn''t be just a dumb viewer, capable of rendering HTML
    and presenting a static view of the Internet. Enter the era of active content,
    small executables or script code that could be rendered within a browser to provide
    dynamic, client-resident executable behavior that could offload a lot of server
    logic. Sure it blurred the boundaries of the “thin” Web client model, but some
    things were just too hard to using only HTML.'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# Hacking Exposed Web Applications


    Similar to server-side Web platforms, the two dominant client-side active content
    technologies in use today are from Microsoft (ActiveX) and one of their competitors
    (Sun''s Java). Let''s talk about each of these platforms and known security vulnerabilities
    associated with them.


    # Java and JavaScript


    One of the "mobile code" paradigms to provide developers a platform for client-side
    execution over the Web, Sun Microsystem''s Java remains one of the dominant development
    tools in use on the Internet today. One of the reasons for this is the security
    model Java offers. With its transparent memory and integrated security "sandbox"
    that controls the ability of executing code to perform abusive actions, Java is
    in theory a difficult execution environment to subvert. As we saw with the Brown
    Oracle, theory is often broken in practice. In the case of March 2002, Sun released
    a fix for their Java Runtime Environment (JRE) Bytecode Verifier that prevents
    untrusted Java applets from escaping the sandbox by performing an illegal cast,
    or an attacker could devise an arbitrary code outside of the sandbox and take
    any action associated with the privilege level of the user who executed it.


    Another fruitful for attackers to exploit JavaScript. JavaScript is a scripting
    language that can be used to automate tasks on both the client and server side
    of Web Applications. It was created by Netscape Communications Corp. and is not
    actually supported by the creators of the original Java language, Sun.


    Like other languages, JavaScript is used primarily to tie other components together
    or accept user input. It is an interpreted, high-level language that uses a syntax
    similar to C and Java. An interpreter (also known as an "engine") takes the plain-text
    JavaScript code and translates it on the fly into native instructions on the current
    machine. JavaScript interpreters have been built into most major Web browsers
    and the automation capabilities make it a ripe target for attack.


    # JavaScript Object Execution


    | Popularity | 7 |

    |---|---|

    | Simplicity | 7 |

    | Impact | 8 |

