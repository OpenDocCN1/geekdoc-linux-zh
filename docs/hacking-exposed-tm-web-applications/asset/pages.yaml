- pgno: 223
  md: '# Chapter 7: Attacking Session State Management


    First, the session ID had to be decoded. They were not in Base 64, as one might
    expect, but the scheme was nevertheless simple: Letters A through Z in the encoded
    string corre-spond to numbers 0 through 25, numbers 0 through 5 in the encoded
    string correspond to numbers 26 through 31. This makes for a total of 32 symbols
    (26 letters plus six numbers), which is equivalent to a 5-bit number (2^5=32).


    Here''s an example cookie and its decoded value represented in hexadecimal notation.
    The encoded cookie contains 115 bits (23 characters at 5 bits each). The decoded
    string contains 112 bits (14 bytes at 8 bits each). The final 3 bits are ignored.


    ```

    Encoded Session ID: FGAZOWAAAKRQFIAAAU45Q

    Decoded Session ID: 29 81 57 00 15 c8 00 a08 08 01 4f 7e

    ```


    After collecting some cookies, Netrack noticed some trends and deduced the cookie''s
    structure. Table 7-6 details these fields.


    Since we now know the scheme for creating session IDs, it would be possible to
    hijack or spoof another user''s session. The attack would follow three steps:
    Collect a cookie, change the session counter and increment the timestamp, submit
    the new cookie. If the session counter is still active on the server, then we
    should receive the state information tied to that session.


    | Cookie Field | Composition |

    |---|---|

    | Timestamp (0-3) | The first four bytes contained a timestamp of the request.
    In the example, the timestamp corresponds to Oct 12 12:34:06 2000 |

    | Session Count (4-7) | The next four bytes contain the session count. This field
    increments for each new session. In the example this number is 5576 |

    | IP Address (8-11) | These four bytes contain the IP address of the Web server
    that generated the session ID. The example has been sanitized to represent 192.168.0.1,
    but this value could identify IP addresses behind a firewall or NAT |

    | Random (12-13) | The last two bytes contained an apparently random number; however,
    the server did not seem to care about the content of this field. Most of the time
    they could be set to zero |


    **Table 7-6.** SDK 2.0 Session ID Format'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# Time Windows


    Once you''ve determined the content of the state information, you''ll also want
    to determine the time period during which the state information (such as the session
    ID) is valid. Sometimes, the only way to test for this is to obtain the session
    ID (by logging into the application, example), waiting a period of time, then
    trying to continue through the application. If the session ID has become ‘stale,’
    then the application should prompt you to reauthenticate. If, after six hours,
    the session ID is still valid, then the application may be highly susceptible
    to replay attacks.


    # Countermeasures


    The best countermeasure is to log the amount of sensitive data being passed in
    the state information. A guide for strong session management is shown in Table
    7-7.


    Another security measure that often gets overlooked is application logging. The
    Web application''s platform should already be generating logs for the operating
    system and Web server. Unfortunately, these logs are grossly inadequate for identifying
    malicious activity or re-creating a suspect event. Many events affect the user''s
    account and should be tracked, especially when dealing with financial applications:


    +   - Profile changes Record changes to significant personal information such
    as phone number, address, credit card information, and e-mail address.


    +   - Password changes Record any time the user''s password is changed.


    +   - Modify user Record any time an administrator changes someone''s profile
    or password information. This could also be triggered when other users, such as
    help desk employees, update another user''s information. Record the account that
    performed the change and the account that was changed.


    +   - Add/Delete user Record any time users are added to or removed from the system.


    The application should log as much detail as possible. Of course, there must be
    a balance between the amount of information and type. For example, basic items
    are the source IP address, username or other identification tokens, date, and
    time of the event. An additional piece of information would be the session ID
    to identify users impersonation attacks against the users.


    It might not be a good idea to log the actual values that were changed. Logs should
    already be treated with a high degree of security in order to maintain their integrity,
    if the logs start to contain Social Security numbers, credit card numbers, and
    other personal information, then they could be at risk of compromise from an internal
    employee or a single point from which a malicious user can gain the database''s
    most important information.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# Chapter 7: Attacking Session State Management


    | Method | Type of Protection |

    | --- | --- |

    | Strong session IDs | Generate session IDs from a large, random pool. A strong
    pseudorandom number generator that only selects values between 1 and 100,000 is
    still not secure. Take advantage of 32-bit (or more) values. Test the session
    ID generator to make sure the session IDs are not predictable. |

    | Strong hashes or encrypted content | Place dynamic data such as a timestamp
    or pseudorandom number at the beginning of the string. This makes brute-force
    attacks harder, but not impossible. |

    | Enforce session time limits | Invalidate state information and session IDs after
    a period of inactivity (10 minutes, for example) or a set period of time (perhaps
    30 minutes). The server should invalidate the ID or token information; it should
    not rely on the client to do so. This protects the application from session replay
    attacks. |

    | Enforce concurrent login limits | Disallow users from having multiple, concurrent
    authenticated sessions to the application. This could prevent malicious users
    from hijacking or guessing valid session IDs. |

    | Validate contents of state information | State information, when the application
    sets a UserID, is sent to the client. Therefore, it can be manipulated and used
    as a vector for an input validation or SQL injection attack. Always check the
    incoming data. |

    | Use checksums or message authentication techniques | Use checksums to verify
    that state information has not been modified. It does not have to be a complicated
    algorithm, but the checksum should not be reproducible by the user. For example,
    to generate a checksum for a username, you could take the last four bytes of the
    MD5 hash of username plus a secret known to the server. |

    | Use SSL | Any traffic that contains sensitive information should be encrypted
    to prevent sniffing attacks. |


    Table 7-7. Session Management Guidelines'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Hacking Exposed Web Applications


    # SUMMARY


    An application''s session management has implications for several security aspects:


    +   - **Authentication** Can a malicious user bypass the login page by guessing
    a valid session ID? What about changing the state information from "IsAuth-False"
    to "IsAuth-True"

    - **Authorization** Can a malicious user hijack another session? Can the session
    ID be changed to impersonate a user with greater privileges?

    - **Input Validation and SQL Injection** Are the session variables usually generated
    by the server, the client can arbitrarily modify the values.

    - **State Information** What information does the state information carry? Can
    it be decoded?


    Proper session management is required by any electronic commerce application or
    applications that need to identify and track users. Consequently, the majority
    of dynamic, interactive applications implement some form of session management.
    It is important that the security aspects of the session management be addressed.


