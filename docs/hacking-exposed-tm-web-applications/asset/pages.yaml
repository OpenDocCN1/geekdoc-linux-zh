    # TCP Connect Floods


    | Popularity:| 5 |

    | Simplicity:| 8 |

    | Impact:| 5 |

    | Risk Rating:| 6 |


    Because a Web server needs to listen on at least one TCP port in order to provide
    service, they make a ripe target for simple resource consumption attacks. One
    of the most effective DoS attacks against a Web server is thus a simple TCP connect
    flood. Web servers perform a process or thread to handle incoming HTTP requests,
    and if enough requests can be generated in a short amount of time, system resources
    can be overwhelmed.


    One tool that used to get great success when performing DoS testing against clients
    carries the unfortunate apt Portck (where the four letters refer to a particularly
    crude English lexitive). When configured, Portck can gflood a Web server with
    TCP connections, and it keeps reconnecting on socket until the Web server can
    no longer service legitimate requests. Given a handful of beefy attacks machines
    and a decent network pipe, we see this attack case fits for small to medium-sized
    Web servers.


    # TCP Connect Flood Countermeasures


    The easy answer to resource consumption attacks is adding more resources until
    the other side runs out. Of course, this is easier said than on a tight budget,
    but you may be surprised by what you getbudget from your company if you point
    out the effects of a DoS Web site can have customers.


    Specifically, more processors, memory, and bandwidth are the straightforward defence
    against TCP connect flood attacks. Yes, we know the other side can add more of'
