- pgno: 68
  md: '# Hacking Exposed Web Applications


    The most visible features of a Web application that note and immediately seek
    to exploit vulnerabilities in the Server software itself. No matter the simplicity
    or strength of the design, no application can stand for very long on a mortally
    vulnerable server platform.


    This chapter seeks to catalog some of the most devastating Web server vulnerabilities
    that have been published over the years. True to the Hacking Exposed tradition,
    we have hand-selected these examples from our recent experiences working as security
    consultants for large organizations, where we have identified, exploited, and
    recommended countermeasures for these vulnerabilities as we have presented here.
    Our discussion is divided into sections based on the current popular Web server
    platform: Microsoft Internet Information Services (IIS), and Netscape Enterprise.
    We also cover widely deployed platforms such as Lotus Domino, Novell GroupWise,
    Networks'' RealServer, and many others. Following our coverage of common server
    vulnerabilities, we examine the current crop of Web server vulnerability scanning,
    and finish with a brief discussion of denial-of-service (DoS) attacks and countermeasures
    for Web servers.


    And try to relax as you read—if your chosen Web server has vulnerabilities discussed
    in this chapter, it''s likely that you''ve already been victimized by roaming
    vandals that haunt the Internet. You can always clean the damage later, right?


    # COMMON VULNERABILITIES BY PLATFORM


    Let these highly visible examples serve as fair warning: from long years of experience
    in analyzing the security of Web server software, we think it''s a good assumption
    that your chosen Web platform will face a critical vulnerability at some point
    in its duty cycle. Learn from these examples, configure your servers conservatively,
    and keep up with vendor patches.


    # Apache


    Apache has a well-earned reputation for security and performance. There have not
    been any command execution exploits against the core Apache server for the entire
    1.3 era. While the Achilles heel of Microsoft''s IIS has always been add-functionality
    such as Web-based printing and Index Server that exposes the system to full compromise
    (see the section on IIS vulnerabilities later in this chapter), the vulnerability
    in Apache''s tough hide lies in its add-on components, called modules. E-commerce
    sites aim to create dynamic pages that will bring users to not only the latest,
    coolest widgets, but widgets in that user''s favorite color. Apache needs additional
    modules in order for it to be a server for dynamic pages. It is these modules
    that expose Apache to malicious Internet users. Let''s take a look at some recent
    examples of Apache exploits to demonstrate this point.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Long Slash Directory Listing


    | Popularity: 7 |

    | Simplicity: 8 |

    | Impact: 6 |

    | Risk Rating: 7 |


    Long URLs passing through the mod_negotiate, mod_dir, and mod_autoindex modules
    could cause Apache to list directory contents. This exploit first came to light
    when Martin Kraemer announced version 1.3.19 of Apache in March 2001. The concept
    is simple, but requires a few trial runs to perform against a server. A URL with
    a large number of trailing slashes, for example, /cgi-bin//////////////////////////////////////
    would produce a directory listing of the original directory. The actual number
    of slashes varies, but a simple Perl script can easily automate the attack. Note
    that most Apache servers cannot handle it at all a URL longer than 8,000 characters.


    # Long Slash Countermeasures


    The error is in Apache 1.3.19; however, the problem can also be addressed with
    a more thorough Apache configuration. The mod_dir and mod_autoindex modules are
    included in default builds of the server. These modules, which format directory
    listings in a user-friendly manner, should be removed at compile time. There is
    no reason to allow end-users to browse through the directory contents of your
    site. The configure script provides the simple solution:


    ```

    [apache]$ ./configure --disable-module=dir --disable-module=autoindex

    ```


    Note that disabling the mod_dir module will break redirects for requests that
    omit the trailing slash for a directory. However, this should not affect an application.


    # Multiview Directory Listing


    | Popularity: 7 |

    | Simplicity: 10 |

    | Impact: 6 |

    | Risk Rating: 7.6 |


    Apache will resist just any attempt to obtain directory listings without explicit
    permission from the server administrator. Unfortunately, one of Apache''s newer
    capabil-'
  merge: -1
