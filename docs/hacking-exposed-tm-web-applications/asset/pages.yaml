  md: '# Chapter 7: Attacking Session State Management


    we''ll point to some methods for determining how “random” a random session ID
    really is. Collecting session values is a necessary step. You''ll want to do this
    with a script, since collecting 10,000 values quickly becomes monotonous!


    Here are three examples to help you get started. You''ll need to customize each
    one to collect a particular variable.


    Gather.sh This script collects ASPSESSIONID values from an HTTP server using netcat:


    ```

    #!/bin/sh

    # gather.sh

    while [ 1 ]

    do

    echo -e "GET /HTTP/1.0\n\n" | \\

    cnc -vv $1 80 | \\

    grep JSESSIONID

    done

    ```


    Gather_ssl.sh This script collects JSESSIONID values from an HTTPS server using
    the openssl client:


    ```

    #!/bin/sh

    # gather_ssl.sh

    while [ 1 ]

    do

    echo -e "GET /HTTP/1.0\n\n" | \\

    opsl s_client -quiet -no_tls1 -connect $1:443 2>/dev/null | \\

    grep JSESSIONID

    done

    ```


    Gather_nudge.sh This script collects JSESSIONID values from an HTTPS server using
    the openssl client, but also POSTs a specific login request that the server requires
    before setting a cookie:


    ```

    #!/bin/sh

    # gather_nudge.sh

    while [ 1 ]

    do

    cat nudge \\

    openssl s_client -quiet -no_tls1 -connect $1:443 2>/dev/null | \\

    grep JSESSIONID

    done

    ```'
  merge: -1
