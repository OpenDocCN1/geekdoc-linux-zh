    the netcat tool. First, the client (in this case, netcat) connects to the server
    on TCP 80. Then, a simple request for the URI /test.html is made, followed by
    two carriage returns. The server responds with a code indicating the response
    was successfully retrieved, and forwards the server’s data to the client.


    ```

