    This is easier to identify because you should know your own IP address, whereas
    you have to make an educated guess about the server''s IP address. Changing this
    value might be necessary to successfully launch a replay attack or spoof another
    user. |

    | Salt | Random data that may change with each request, may change with each session,
    or remain static. Collecting several of these values could lead to guessing secret
    keys by the server to encrypt the application. |

    | Table 7-4. | Common Session Token Contents (continued) |


    # Numeric Boundaries


    When you have very obvious numeric values, it can be beneficial to identify the
    range in which these numbers are valid. For example, if the application gives
    you a session ID number 1234567, what can you determine about the pool of numbers
    that make a valid session ID? Table 7-5 lists several totals and what they can
    impact about the application.

    The benefit of testing for a boundary is that you can determine how difficult
    it is to launch a brute-force attack against that particular number. From an input
    validation or SQL injection point of view, it provides an extra bit of information
    about the underlying structure of the application.


    # Encrypted or Encoded?


    Encoded content is much easier to deal with than encrypted content. Encoding is
    a method of representing one set of symbols (letters, numbers, punctuation, carriage
    returns) with another set of symbols (letters and numbers). It is a reversible
    process that does not require any secret information to decode. In other words,
    the Base 64 encoding for “donjonland” is always “ZG9am9bGuFZA==. You do not need
    any other information, such as a password, to decode the string.'
  merge: -1
