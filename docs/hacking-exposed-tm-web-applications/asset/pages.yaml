    what we are briefly since is so central to the (in)security of the protocol. The
    discussion below is a very broad overview; we advise readers to consult the RFCs
    for more exacting detail.


    HTTP’s simplicity derives from its limited set of basic capabilities, request
    and response. HTTP defines a mechanism to request a resource, and the server returns
    that if it is able. Resources can range from static text pages to dynamic video
    content. Here is a simple example of an HTTP GET request and a server’s HTTP 200
    OK response, demonstrated using'
