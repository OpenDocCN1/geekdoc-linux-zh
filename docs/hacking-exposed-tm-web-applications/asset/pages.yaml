- pgno: 360
  md: '# 334 Hacking Exposed Web Applications


    the libwhisker library brings together many common Perl modules into a single
    resource for HTTP-based tools. We first mentioned whisker, its predecessor, in
    Chapter 3. Libwhisker grew out of the desire to build a library of the most useful
    functions with the ideas that others could combine scripts from the library for
    various purposes. Whisker 2.0 and Nikto (www.circ.net/code/nikto.html) are two
    vulnerability scanners based on libwhisker. The scanners perform the same sort
    of vulnerability checks against a Web server as the original whisker 1.4, but
    the code is easier to read, easier to maintain, and easier to modify because the
    core functions of making and parsing an HTTP request and response are in a single:
    libwhisker.


    # INSIDE LIBWHISKER


    Libwhisker''s documentation is limited to function definitions, albeit very helpful
    definitions. The code is also very readable for Perl hackers who want to dive
    into the source. Even so, we''d like to introduce some of the functionality of
    libwhisker and a script that performs automatic SQL injection tests—based on libwhisker.


    # http_do_request Function


    The heart of libwhisker is the http_do_request function. After all, this is what
    sends a URL request and receives the server''s response. Calling the function
    is simple. Note that before you call any function that uses the %hin hash as crawl,
    you must initialize the %hin hash with the http_init_request function:


    ```

    my $hin, $hout;

    http_init_request(\$hin);

    http_do_request(\$hin, \$hout);

    ```


    The request function operates on two hashes, hin and hout. Their naming convention
    in relation to set particular variables for the HTTP request. For example, this
    hash contains custom headers and URLs that are passed in the function. The hout
    contains the server''s response—for example, the HTTP error code and page contents.
    Table C-1 lists the most common values for the hin hash and a description of each.


    The http_do_request function can also override these values if you specify parameters.
    For example, the following code is an example of how to request an alternate URL.
    The $hin[''whisker'']->[''uri''] value is set to "/admin/menu/user.php":


    ```

    LW::http_do_request(\$hin, \$hout, {''uri''=>/admin/menu/user.php''});

    ```'
  merge: -1
  img_proc: true
