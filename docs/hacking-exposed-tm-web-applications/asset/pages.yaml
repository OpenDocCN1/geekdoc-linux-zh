  md: '# Chapter 3: Hacking Web Servers


    # Mod_rewrite File Access


    | Popularity | 5 |

    | Simplicity | 4 |

    | Impact | 9 |

    | Risk Rating | 6 |


    One of the best resources for an application''s security issues is the developer
    comments and change: Use, Luke. In September 2000, Apache developers, spearheaded
    by Tony Finch, released a fix for a vulnerability that would allow a user to access
    any file on the Web server, even those outside the document root. This module
    is widely used to return different pages based on a browser''s "User-agent" string,
    cookie information, or parts of a URL (among others).


    Unfortunately, it is not easy to identify when a server is using mod_rewrite,
    or if the configuration is vulnerable. A vulnerable server is a RewriteRule that
    maps a URL to a local page that is referenced by its complete pathname. A vulnerable
    rule:


    ```

    RewriteRule /more-icons/* /home/httpd/icons/$1

    ```


    A rule that is not vulnerable:


    ```

    RewriteRule /more-icons/.* /icons/$1

    ```


    # Mod_rewrite Countermeasures


    As you may have already guessed from the previous discussion, specify RewriteRules
    that use generic pathnames.


