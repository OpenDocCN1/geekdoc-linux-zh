    # WSDL


    Although not shown in Figure 10-1, WSDL is central to of Web services. Think of
    it as a core component of a Web service itself, the mechanism by which the service
    publishes or exports information about its interfaces and capabilities. WSDL is
    typically implemented via one or more pages that can be accessed on the server
    where the Web service resides (typically, these carry .wsdl and .xsd file extensions).


    The W3C specification for WSDL describes it as an XML grammar for describing web
    services collections of communication endpoints capable of exchanging messages.
    In essence, this means a WSDL document describes what functions (“operations”)
    a Web service exports and how to connect (“bind”). Continuing our example from
    our previous discussion of SOAP, here is a sample WSDL definition for a simple
    Web service that provides stock trading functionality. Note that our example contains
    the following keys of information about the service:


    +   - The <types> and <message> elements define the format of the messages that
    can be passed (via embedded XML schema definitions).

    - The <portType> element defines the semantics of the message passing (for example,
    request-only, request-response, response-only).

    - The <binding> element specifies various encodings over a specified transport
    such as HTTP, HTTPS, or SMTP.

    - The <service> element defines the endpoint for the service (a URL).'
