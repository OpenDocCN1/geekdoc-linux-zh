  md: '# 336 Hacking Exposed Web Applications


    The “whisker” values are used internally by libwhisker. You can specify other
    HTTP

    headers or change existing ones by adding them to the hash. For example, the following

    code would change the User-Agent and add a cookie value containing a session ID
    (no-

    t you do not include the colon in the header name). It also prepares an SSL request:


    ```

    $http(''User-Agent'') = "Commode 64";

    $http(''Cookie'') = "CFTOKEN-46508925";

    $http(''whisker'')->->(''port'') = 443;

    $http(''whisker'')->->(''ssl'') = 1;

    ```


    After calling the http_do request function, libwhisker sets the hout hash with
    the re-

    ults of the query.

    These values are accessed in the same manner as the hout values. For example,
    here is

    an example for parsing the HTML source into the $html variable and the server''s
    re-

    sponese code into the $resp variable:


    ```

    $html = $hout(''whisker'')->->(''data'')

    $resp = $hout(''whisker'')->->(''http_resp'')

    ```


    Technically, you can manually override any of these values, although the only

    y''ll probably be changing is the error:


    ```

    $hout(''whisker'')->->(''error'') = ''target server is not responding''

    ```


    | Value | Description |

    | --- | --- |

    | $hout(''whisker'')->->(''data'') | Contains the HTML output from the server.
    |

    | $hout(''whisker'')->->(''error'') | The result of any internal error within
    libwhisker. This is set on SSL errors, cannot connect to host, cannot resolve
    host, etc. |

    | $hout(''whisker'')->->(''http_ver'') | The HTTP protocol version used to request
    the page. |

    | $hout(''whisker'')->->(''http_resp'') | The HTTP response code, such as “200”.
    |

    | $hout(''whisker'')->->(''code'') | |

    | $hout(''whisker'')->->(''http_resp_message'') | The HTTP response message, such
    as “File not found”. |


