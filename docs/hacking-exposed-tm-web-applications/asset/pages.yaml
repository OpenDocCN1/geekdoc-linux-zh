    the application processes and may reveal weak points or inadequacies in the design.
    The flowchart can be a block diagram on a white board or a three-page diagram
    with color-coded blocks that identify static pages, dynamic pages, database access
    routines, and other macro functions. Figure 4-1 shows an example application flowchart.

    Near the end of the review you will probably also have a mirror of the application
    on your local hard drive. You can build this automatically with a tool, or you
    can popu


    ![](img/2c61c2d28445b774d9266972920f432d_127_0.png)


    **Figure 4-1.** A flowchart like this sample can be quite helpful in documenting
    Web application structure.'
