- pgno: 241
  md: '# Chapter 8: Input Validation Attacks


    A more viable test is to break table form structures. If an application creates
    custom tables based on user input, a spurious </table> tag might end the page
    prematurely. This could leave half of the page with normal HTML output and the
    other half with raw source code. This technique is useful for dynamically generated
    forms.


    # Cookies and Predefined Headers


    Web application testers always review the cookie contents. Cookies, after all,
    can be manipulated to impersonate other users or escalate privileges. The application
    must read the cookie; therefore an equally valid test for script attacks. In fact,
    many applications interpret additional information that is particular to your
    browser. HTTP 1.1 defines a "User Agent" header that identifies the Web browser.
    You usually see some of "Mozilla" in this string.


    Applications use the User Agent string to accommodate browser quirks (since no
    one likes to follow standards). The text-based browser, lynx, lets you specify
    a custom string:


    ```

    $ lynx -dump -useragent="<script>" \nn http://www.victim.com/page2a.html?tw=tests\nnoutput
    truncated.

    ```


    Netscape running on a Mac might seem like this:

    User Agent: Mozilla/4.5 (Macintosh; U PFC)

    And FYI, it appears that the browser you''re currently using to view this document
    sends this User Agent string:


    What''s this? The application can''t determine our custom User Agent string. If
    we view the source, then we see why this happens:


    And FYI, it appears that the browser you''re currently using to view this document
    sends this User Agent string:


    ```

    <BLOCKQUOTE>

    <PRE>

    <script>

    </PRE>

    </BLOCKQUOTE>

    ```


    So, our <script> tag was accepted after all. This is a prime example of a vulnerable
    application. The point is that input validation affects any input that the application
    receives.


    # Countermeasures


    The most significant defense against script attacks is to turn all brackets into
    their HTML-encoded equivalents. The left bracket, "<", is represented by "&lt;"
    and the right bracket, ">", is represented by "&gt;". This ensures the brackets
    are always stored and displayed in an innocuous manner. A Web browser will never
    execute a "&lt;script&gt;" tag.'
  merge: -1
