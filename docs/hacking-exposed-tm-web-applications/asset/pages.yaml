  md: '# Chapter 12: Web Client Hacking


    # 289


    ![](img/2c61c2d28445b774d9266972920f432d_315_0.png)


    # CROSS-SITE SCRIPTING


    Of equal impact to Web application clients are cross-site scripting vulnerabilities.
    The root of cross-site scripting vulnerabilities is improper input sanitation
    on the server side, which allows users to insert script commands that are interpreted
    by client-side browsers. The most immediate outcome of script injection is execution
    of commands on the client who injected the code. With a little tweaking, the exploit
    can be extended to do much more than self-hacking—it can actually harvest data
    from subsequent users of the Web site.


    The best way to explain cross-site scripting is by demonstrating how to find and
    exploit vulnerabilities. Cross-site scripting is feasible wherever input might
    be displayed to other users—for example, a guestbook-type application where users
    enter their names to be displayed to subsequent visitors (by the end of this discussion,
    you will hopefully be wary of such functionality). The simplest way to test an
    input for cross-site scripting is to type the following text into the input field:


    ```

    <SCRIPT Language="Javascript">alert("Hello")</SCRIPT>

    ```


    *'
