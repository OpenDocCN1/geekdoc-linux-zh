  md: '# Chapter 6: Authorization


    +   Vertical Privilege Escalation Access an elevated user’s information. For example,
    the application could have a vulnerability in the session management that allows
    you to enter the administrator portion. Or the administrator’s password could
    be to guess. This attack targets functionality and data not available to the user’s
    level.


    +   Arbitrary File Access Normally, include files with database credentials, or
    outside of the Web document root are restricted from application users. Different
    input validation attacks combined with a misconfiguration of the server can prevent
    a malicious user to access these files. Usually, these attacks target the Web
    server, but applications that use insecure templating methods create vulnerabilities
    within the application as well.


    Each type of privilege access shares the same test method. If authorization to
    another user’s profile information can be gained by changing a cookie value, then
    it may also be possible to gain administrator privileges from the same value.
    In case, the between horizontal and vertical privilege escalation would be blurred.
    On other occasions, the application’s role-base privilege control could block
    a vertical escalation. The details of the data to change in each request will
    differ from application to application, but the places to look are always the
    same.


    # Role Matrix


    A useful to aid the authorization audit process is a role matrix. A role matrix
    contains a list of all users (or user types) in an application and their corresponding
    actions. The idea of the matrix is not to place a check for each permitted action,
    but to record notes how the action is executed and what session tokens the action
    requires. Table 6-1 has an example matrix.


    The role matrix is similar to a functionality map. When we include the URIs that
    user accesses for a particular function, patterns might appear. The example in
    Table 6-1 might appear to be overly simplistic, but notice how an administrator
    views another


    | Role | User | Admin |

    |---|---|--|

    | View Own Profile | /profile/view.asp?UID=TB8992 | /profile/view.asp?UID=MS128
    |

    | Modify Own Profile | /profile/update.asp?UID=TB8992 | /profile/update.asp?UID=MS128
    |

    | View Other’s Profile | n/a | /profile/view.asp?UID=MS128&EUID=TB8992 |

    | Delete User | n/a | /admin/deluser.asp?UID=TB8992 |


    Table 6-1. Example Role Matrix'
