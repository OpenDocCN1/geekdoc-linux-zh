- pgno: 81
  md: '# Chapter 3: Hacking Web Servers


    NNNNNNNNNNNNNN%u9090%u6858%ucbd3%u7801%u9090%u6858%ucbd3%u7801%u9090

    u6858%ucbd3%u7801%u9090%u9090%u8190%u00c3%u8b00%u531b%u53ff

    u0078%u0000%u00a=


    Code Red and Nimda left behind numerous files on a compromised system. The presence
    of the directory%systemdrive%

    etwork is a telltale sign that a server has been compromised by Code Red. The
    existence of a renamed Windows command shell root.exe paid a visit. We’re aware
    of the manual effort involved in regularly monitoring the logs and file systems
    of ever sized Web server farm, but hopefully these tips can assist you once you
    have identified a server that has been compromised.


    Don''t Put Data in Source Code With the track record that IIS has in the source
    disclosure, it''s not a good idea to assume someone won''t be able to view your
    source code. Educate your development team not to commit to this classic error,
    and you won''t have to worry so much about the latest and greatest source disclosure
    making the rounds. Some of the most common failures include:


    +   - Cleartext SQL connect strings in ASP scripts—use SQL integrated security
    or do your SQL access or a binary COM object instead.

    - Cleartext passwords of any sort in global.asa

    - Using files with the .inc extension—rename them to .asp and change internal
    references in other scripts.

    - Comments within scripts that contain private information like e-mail addresses,
    directory structure information, passwords, and so on.


    Regular Scan Your Network for Vulnerable Servers Perhaps the best mechanism for
    preventing compromises is to regularly scan for the vulnerabilities that cause
    them. Table 3-2 lists expected responses when requesting some known vulnerable
    DLLs. Using these responses, customized for your environment, it would be quite
    easy to whip together a scanner that regularly combs your Internet for rogue servers
    that somehow escaped proper configuration scrutiny before going live.


    > These are anticipated responses based on a default install of IIS 5, and may
    only indicate the presence of the DLL. We recommend validating these responses
    against your servers before relying on them as definitive evidence that a given
    server is vulnerable or not.


    In large Web sites that we’ve consulted for (greater than 1,500 live hosts), we’ve
    seen rogue IIS servers pop up at a rate of 6–7 per week. Thus, it’s probably good
    to run scans for these common ISAPI DLLs at least twice per day.'
