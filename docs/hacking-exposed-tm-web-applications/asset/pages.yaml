    The main element of a DISCO file is contractRef, which has two attributes, ref
    and docRef, which point to the WSDL and documentation files for a given web service.
    Furthermore, the discoveryRef element can link the given DISCO document to other
    DISCO documents, creating a web of related DISCO documents spanning multiple machines
    and even multiple organizations. Thus, disco files often provide an interesting
    treasure trove for malicious hackers.


    In its .NET Framework SDK, Microsoft published a tool called disco.exe that connects
    to a given DISCO file, extracts information about the Web services discovered
    at the specified URL (writing output to a file called results.disco), and downloads
    all the .disco and .wsdl files that were discovered. It can also browse an entire
    site for DISCO files and save them to the specified output directory using the
    following syntax:


    ```

    C:\disco /output http://www.victim.com/service.asmx Microsoft (R) Web Services
    Discovery Utility Microsoft (R) .NET Framework, Version 1.0.37050] Copyright (C)
    Microsoft Corporation 1998-2001. All rights reserved.

    ```


    Disco found at the following URLs:

    http://www.victim.com/service.asmx?wsdl

    http://www.victim.com/service.asmx?disco


    The following files hold the content at the corresponding URLs:

    C:\output.wsdl <- http://www.victim.com/service.asmx?wsdl

    C:\output\disco <- http://www.victim.com/service.asmx?disco

    The file C:\output\discomap holds links to each of these files.


    In most prospective clients won''t know the exact address of the .disco file,
    so DISCO also makes it possible to provide hints in the root''s default page.
    If the root''s default page is an HTML document, the <LINK> tag can be used to
    redirect the client to the :disco file:


    ```

    <HTML>

    <HEAD>

    <link type=''text/xml'' rel=''alternate'' href=''math.disco''/>

    </HEAD>


    </HTML>

    ```


    If the root''s default page is an HTML document, you can use the xml-stylesheet
    processing to accomplish the same thing:


    ```

    <?xml-stylesheet type="text/xml" alternate="yes" href="math.disco"?>

    ```'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# Hacking Exposed Web Applications


    Although DISCO is probably going to be supplanted by the more widely accepted
    UDDI specification, no doubt developers will implement DISCO for its less complex,
    lighter-weight approach to publishing Web services. Combined with its ready availability
    in Microsoft''s widely deployed technologies, DISCO or something like it will
    probably provide a good target for malicious hackers seeking information about
    Web services.


    # SAMPLE WEB SERVICES HACKS


    OK, enough background. How do web services fare when under real-world attack?
    This section will discuss a recent example from our consulting work in which we
    encountered and assessed a preproduction Web service. It is a classic information-gathering
    attack that leads to larger compromise, and our goal in discussing it is to illustrate
    the possibilities that Web services may present to malicious hackers. One small
    step for hackerdoom...


    # DISCO and WSDL Disclosure


    | | |

    |---|-|

    | Popularity: | 5 |

    | Simplicity: | 10 |

    | Impact: | 3 |

    | Risk Rating: | 6 |


    Web services (.asmx) may cough up DISCO and/or WSDL information by appending special
    arguments to the request. For example, the following URL would connect to a Web
    service and render the service''s human-readable interface:


    ```

    http://www.victim.com/service.asmx

    ```


    DISCO or WSDL information can be displayed by appending ?disco or ?wsdl the URL
    as shown below:


    ```

    http://www.victim.com/service.asmx?disco

    ```


    or


    ```

    http://www.victim.com/service.asmx?wsdl

    ```


    Figure 1-4 shows the result of such an attack on a Web service. The data in this
    example is quite benign (as you might expect from a service that wants to publish
    information about itself), yet we''ve seen very bad things in such output—SQL
    Server credentials, paths to service files and directories, and all of the goodies
    that Web devs love to stuff into their config files. The WSDL info is much more
    extensive—as we''ve discussed, it lists all service endpoints and data types.
    What could a hacker ask for before beginning malicious input attacks?'
  merge: -1
  img_proc: true
