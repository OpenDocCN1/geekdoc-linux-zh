    so that when clients request a file with that extension, they can run the linked
    code. These code modules have traditionally been the source of many security vulnerabilities,
    so disabling script maps prevents attackers from simply requesting a file with
    a certain extension in order to exploit a vulnerability. We advise following the
    recommended script'
