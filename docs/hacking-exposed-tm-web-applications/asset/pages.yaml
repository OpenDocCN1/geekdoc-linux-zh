  md: '# Chapter 5: Authentication


    # Session ID Prediction and Brute Forcing


    Many e-commerce sites use a session identifier (session ID) in conjunction with
    Authentication. A typical implementation stores a session ID once a user has successfully
    authenticated that they do not need to retype credentials. Thus, if session identifiers
    are used in the authentication process, an alternative to attacking the passwords
    is to attack the session. Since the session ID can be used in lieu of a username
    and password combination, providing a valid session ID in a request would allow
    a hacker to perform session hijacking or replay attacks if the session ID is captured
    or guessed. The two techniques used to perform session hijacking are session ID
    prediction and brute forcing.


    A secure session ID should be randomly generated to prevent prediction. However,
    many implementations do not follow this principle. We have seen many Web sites
    fall by predictable, sometimes, session identifiers. Many mathematical techniques
    such as statistical forecasting can be used to predict session identifiers.


    The second technique for attacking session ID involves thousands of simultaneous
    requests using all possible session IDs. The number of requests that need to be
    depends on the key space of session ID. Thus, the probability of success of this
    type of attack can be calculated based on the size and key space of the session
    ID.


    > David Endler of iDefense has written a detailed exposition of many of the weaknesses
    in session ID implementations. Find a link to it in the "References and Further
    Reading" section at the end of this chapter.


    # Countermeasures to Session ID Attacks


    As long as you understand session identifiers and how they are attacked, the countermeasure
    is very straightforward. Design a session identifier that can''t be predicted
    and can''t be attacked using brute-force methods. Use a random number generator
    to generate session identifiers. In addition, to prevent brute-force attacks,
    use a session identifier with a large enough key space (roughly 128 bits with
    current technology) that it can''t be attacked using brute force. Keep in mind
    that there are subtleties with pseudorandom generators that you must consider
    when using them. For example, using four sequential numbers for a pseudorandom
    number generator that generates 32-bit samples and concatenating them to create
    one 128-bit session identifier is insecure. By providing four samples to prevent
    brute-force attacks, you actually make session ID prediction easier.


    # Subverting Cookies


    Cookies commonly contain sensitive data with authentication. If the cookie contains
    passwords or session identifiers, stealing the cookie can be a very successful
    attack against a Web site. There are several common techniques used to steal cookies,
    with the most popular being script injection and eavesdropping.'
