    which returned:


    Attempting to run: <code>./analyze -n ls -x /u/webs/logs/https-80-bank-64/access
    -c hnrfeuok -t s5m5h24 -l c+5h5 -p ctl 2>&1</code>


    No luck here, but we can be sure that the n option is assigned the server_name
