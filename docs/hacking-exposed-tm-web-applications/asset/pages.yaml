    # Countermeasures


    Each database has its own methods of secure installation and security lockdown.
    Yet there are steps you can defend against SQL injection attacks at the application
    level.


    # Robust Error Handling


    Never pass raw ODBC or other errors to the user. Use generic error pages and error
    handlers to inform a user of a problem, but not provide system information, variables,
    or other data. In Java, for example, the best way to accomplish this is through
    the "try, catch, finally"" method of exception handling.


    # Parameter Lists


    Place user-supplied data into specific variables. String concatenation is the
    bane of a secure SQL statement because it provides the easiest way for a user
    to manipulate the statement with tick marks.


    Input validation should be performed on the Web server and items in the database
    should be strongly typed. A field that uses numeric values should be a type INT,
    not VARCHAR.


    # Stored Procedures


    Although not a, user-defined stored procedures are more difficult to break with
    SQL injection. They require a specific number of parameters in specific places
    in a specific format. That’s a lot of ሲ to satisfy. Improved performance is often
    a byproduct of stored procedures—it’s not just for security!


    # Running with Least Privilege


    The database application should run in a least-privilege situation. Also, the
    user account that the Web server uses should have limited functionality. Sure,
    it must read and write to the database, but it doesn’t have to write to the Master
    database or perform backup duties.'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# Chapter 8: Attacking Web Datastores


    # Protecting the Schema


    This might sound like a thinly veiled attempt at security through obscurity, but
    table names, column names, and SQL structures should not appear in the HTML. We’ve
    seen instances where the developer placed the entire table definition between
    HTML comment tags. This might be a useful mnemonic; however, the comments would
    be better placed between ASP comment tags where the developers can see them, but
    the users cannot.


    # SUMMARY


    Successful SQL injection requires a simple methodology:


    +   - Generate a database error in the application through input validation techniques.

    - Manipulate the invalid input you can determine the structure of the underlying
    SQL statement or find a combination of characters that execute properly.

    - Gather information about the application’s database via SQL queries.

    - Gather information about the system via SQL queries.


    You will spend most of the time on steps 1 and 2. Once you’ve determined the correct
    format of the SQL injection, then you can execute SQL statements at will. The
    most important thing is to be able to get through step 2. It’s all about walking
    through ticks, semicolons, and dashes.


