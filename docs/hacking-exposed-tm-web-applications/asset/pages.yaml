    # SUMMARY


    This chapter noted a wide range of tools and services to implement Web server
    administration, content management, and numerous HTTP-based interfaces for network/system
    configuration. All of these interfaces can easily be identified by attackers using
    port scanning and related weaknesses exploited, they be known software bugs, weak
    (default) passwords, or inappropriate access controls. It behoves Web application
    architects to consider remote management, and ensure that it is done securely.
    The following general guidelines for securing Web server management measures were
    covered in this chapter:


    +   * Authenticate all remote administrative access.

    * Ensure that strong passwords are used. Use to reset vendor default passwords!

    * Restrict remote management to one or a small set of IP addresses.

    * Use a communications protocol that is secured against eavesdropping (SSL or
    SSH, for example).

    * Use a single server as a terminal for remote management of multiple servers
    rather than deploying management services to each individual server.


    And, as always, carefully restrict the type of services that Web servers can use
    to access internal networks; remember, a Web server is likely to experience a
    serious security compromise at some point in its duty cycle, and if Web server
    has a dozen drives mapped on internal staging file servers, then your network
    is compromised, too. Consider using snakernetf (i.e., physically moving content
    to a physically isolated DMZ distribution server on removable media) to update
    Web servers, keeping them isolated from the rest of the organization.


