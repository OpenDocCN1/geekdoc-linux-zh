    At this point, your server is configured according to the settings specified using
    IISLockdown, and UrlScan is installed and enabled using those same settings (there
    is some degree of redundancy, which makes for good security “defense-in-depth”).
    You could leave well enough alone at this point, but we think you should take
    two additional steps to ensure that your server is protected as well as it should
    be. First, you should specify an alternate Web server name in the UrlScan configuration
