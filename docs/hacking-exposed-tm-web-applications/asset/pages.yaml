  md: '# Hacking Exposed Web Applications


    Scanlist.lst file in the Stealth directory. For this reason, we always answer
    “No” whenever Stealth prompts to add the current server to the scan list. Regardless
    of whether you can scan a list of servers or just one, Stealth will perform analysis
    whether or not the specified port is available. This is probably one of its most
    annoying features, and really makes the tool too slow to scan large ranges of
    systems.


    Custom checks are exported, and those are contained within .exp files. Several
    .exp files with Stealth 1.0 in the program''s Db Files\Stealth\. Check out the
    doublecode.exe script that runs with the standard Stealth package—this script
    was written by Arjun Shunn, and is a good example of the comprehensiveness and
    flexibility that can be achieved with Stealth.


    You can write your own .exp files and store them as well to make them accessible
    to Stealth (the Database tab | Stealth''s Export to see the list of .exp files
    kept in the Db directory; if your custom .exp does not show up, hit the refresh
    button in the lower right). You can select .exp files you want to run, and then
    tell Stealth to use them during a scan by clicking the Scanner button, selecting
    the Hacking Techniques tab, and selecting the Include Stealth''s Techniques check
    box.


    Writing .exp files is fairly simple. There are two types of checks you can write:
    standard checks and buffer overflow tests. A standard sample check is:


    ```

    #GET /null.printer #500

    ```


    This is a simple check to see if an IIS 5 Web server is vulnerable to the Internet
    Printing Protocol vulnerability discussed in this chapter. You can see that the
    GET HTTP method to request /null.printer, and expect an HTTP 500 Internal Server
    Server Error in response, indicating that the server is probably vulnerable.


    Here''s how to code a simple buffer overflow test:


    ```

    bofgen=/sample.exe?%bofstr,"bytes=9","chars=a"

    ```


    The resulting check by Stealth to the target server is


    ```

    GET /sample.exeaaaaaaaaaaaa

    ```


    This is an interesting tool for experimenting with boundary conditions, with buffer
    overflow tests (as it does with standard checks), so it is of limited utility
    unless you''re running a debugger on the target server or otherwise monitoring
    the effects of the requests.


    Version 2.0 now includes an Expl Development tool that essentially puts a graphical
    end onto the .exp file development process. It allows you to specify request strings,
    expected responses, and options. Also included with 2.0 is an update utility that
    automatically goes out to a user-defined server and obtains and installs any updates.


    Stealth HTTP Scanner scans results to an easy-to-read HTML report. Figure 3-7
    shows the Stealth interface reviewing a scan of an IIS 5 system.'
