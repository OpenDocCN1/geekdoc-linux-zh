    # SUMMARY


    The first step in any methodology is often one of the most critical, and profiling
    is no exception. Identification of applications-related services, the services
    they are running, and associated service banners are the initial strokes on the
    large canvas that we will begin to paint the rest of this work unfolds.


    At this point, with knowledge of the make and model of Web server software in
    play, the first savvy intruder will seek to exploit a vulnerability in the Web
    server itself. We will use tools and techniques for Web server compromise in Chapter
    3. In addition, attackers will begin to explore the boundaries of the Web application
    itself in a process we call surveying, discussed in Chapter 4.


    We have not discussed the topic here, remember that many Web applications are
    compromised due to the availability of inappropriate services running on Web servers,
    or just plain inappropriate services being available adjacent to Web application
    machines on the DMZ. The procedures we have outlined in this chapter often turn
    up such weaknesses, a nice side benefit of a thorough, methodical profiling process.'
