    Looking at Figure 1-1 again, Web services are comparable to self-contained, modular
    Web applications. Web services are based on a set of much-used Internet standards-development.
    These standards include the Web Services Definition Language (WSDL), XML format
    for describing network services; the Universal Description, Discovery, and Integration
    (UDDI) specification, a set of XML protocols and an infrastructure for the description
    and discovery of Web services; and the Simple Object Access Protocol (SOAP), an
    XML-based protocol for messaging and RPC-style communication between Web services.
    (Is anyone not convinced XML will play an important role in the future of the
    Web?) Leveraging these three technologies, Web services can be mixed and matched
    to create innovative applications, processes, and value chains.


    A quick review of this chapter will tell you how Web services are being held out
    as the Holy Grail for Web developers. As shown in Table 1-1, there are several
    competing standards for information interchange between Web applications today.
    Thus, integrating'
