  md: '# Chapter 6: Authorization


    else''s information to buy them free gifts—the malicious user is looking for personal
    information such as credit card number. In the same vein, can modify the shipping
    address for someone else''s account? It would be possible for an attacker to buy
    products and ship them to a P.O. box or a neighbor''s house?


    +   - Change Password How does the application password changes? Do you need to
    know the old password? The password sent to an e-mail address? Can you change
    the destination e-mail address before the password reminder is sent?


    The possible scenarios for authorization attacks grow with the amount of functionality
    in the application. To successfully launch a privilege escalation attack, you
    need to identify the component of the application that tracks the users'' identity
    or roles. This might be as simple as looking for your username in one of the following
    locations, or the authorization scheme might be based on cryptic values set by
    the server. You need to know what you''re looking for in order to attack authorization.


    # Query String


    The query string is the extra data in the URI after the question mark (?) is used
    to pass variables. The query string is an ampersand-delimited list and can contain
    multiple values between the client and server. An example would be http://www.mail.com/mail.aspx?joe=joe&company=acme%20com.
    The query string is visible in the Location bar on the browser, and is easily
    changed without any special Web hacking tools. Things to try would be to change
    the URI to http://www.mail.com/mail.aspx?jane=jane&company=acme%20com attempt
    to view Jane''s mailbox while authenticated as Joe.


    # POST Data


    Since queries in browsers are so easily modifiable, many Web application programmers
    prefer to use the POST method rather than GET with queries. This typically involves
    the use of forms. Since the browser normally doesn''t display POST data, some
    programmers feel fooled into thinking that it is impossible or difficult to change
    the data. This is wrong! It is actually quite simple to change these values. There
    are several techniques to change these values. The most basic of techniques involves
    saving the HTML page, modifying the HTML source, and POSTing a fraudulent request.
    gets old due to repetitive tasks. Seasoned web hackers will use a proxy-based
    tool that would allow them to change this data on the fly, such as Achilles. Recently,
    more tools that hook into the IE API have emerged that do not require proxies.


    One important thing to note on a POST request is the Content-Length HTTP header.
    This length specifies the length of the POST data in number of characters. This
    field has to be modified to make the request valid if the length is changed; however,
    tools like curl'
