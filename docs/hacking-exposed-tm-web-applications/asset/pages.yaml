    # Apache httpd 2.0


    What does the future hold for Apache? The 2.0 series is well into testing and
    should receive the benefit of developers sooner. One of the biggest changes in
    version 2.0 is filtering, or the improved ability to chain multiple modules for
    URL parsing. With the problems that plague modules such as mod_rewrite along several
    months of development, it’s a good guess that insecure modules or bugs creep into
    the new hierarchy. Two DoS attacks were discovered—and fixed—late in the development
    series. DoS attacks are the rudest, most trivial attacks to execute, but web sites
    want to avoid them whenever possible.


    # Microsoft Information Server (IIS)


    As one of the most widely deployed web servers on the Internet, Microsoft’s flagship
    Web server has been a frequent target over the years. It has been plagued by such
    vulnerabilities as code revelation like :DATA, information exposures via sample
    scripts like show.asp, piggybacking privileged command execution on back-end database
    queries (MDAC/RDS), and straightforward buffer overflow exploits (ISHack). Although
    all of the issues have been patched in the most recent version of IIS (IIS 5 as
    of this writing), a new crop of exposures seems to arise with regularity. Most
    serious of the past and current crop of IIS security vulnerabilities can be grouped
    as:


    +   - Attacks against IIS components

    - Attacks against IIS itself


    We discuss attacks of each category in this section, as well as countermeasures
    in a closing discussion on hardening IISagainst similar attacks that may arise
    in the future. You will see, the vast majority of attacks past and present lie
    in the first category, and we’ll blow the surprise by noting out that anyone who
    can disable IIS component functionality will have taken a large step towards eliminating
    future security woes. Keep this concept in mind as you read on.


    # Attacks Against IIS Components


    IIS relies heavily on a collection of Dynamic Link Libraries (DLLs) that work
    together with the main server process, inetinfof.exe, to provide various capabilities
    (server-side'
  merge: -1
