- pgno: 151
  md: '# Chapter 4: Surveying the Application


    # COMMON COUNTERMEASURES


    As we have seen, much of the process of surveying a Web application exploits functionality
    that is intended by application designers—after all, they want to browse the site
    quickly and easily. However, we have also seen that many aspects of site content
    and functionality are inappropriately revealed to anonymous browsers due to some
    site design practices and misconfigurations. This section will recount steps that
    application designers can take to prevent leaks great and small.


    # A Cautionary Note


    After seeing what information is leaked by Web applications, you may be tempted
    to expose a great deal of content and functionality from your site. We recommend
    restraint or, put another way, "Careful with that, Eugene." The administrator’s
    goal is to secure the Web server as much as possible. Possible information leakage
    be stopped at the server level by strong configurations and least-privilege access
    policies. Other methods require actions on the part of the programmer. Keep in
    mind that Web applications are designed to provide information to users. Just
    because a user can download the application''s local.js file does not mean the
    application has a poor design; however; the local.js file contains the username
    and password to the application''s database; however the system is going to be
    broken.


    # Protecting Directories


    The ability to enumerate directories, view files within a directory, or determine
    the internal IP address from a Location header provides a nice foundation for
    anyone inspecting the application. Although we don''t want to appear to championing
    measures that rely on obscurity, we still believe that any steps to minimize information
    leakage can help the application''s security.


    # “Location:” Headers


    IIS cannot stop this, but you can limit the contents of the Location header in
    the redirect. By default, the server returns its IP address. To return it its
    Fully Qualified Domain Name instead, you need to modify the IIS database. The
    adsutil.vbs script is installed by default in the Innetpub\adminscripts directory
    on Windows 2000 systems.


    ```

    D:\Inetpub\adminscripts\adsutil.vbs set w3svc/UseHostName True

    D:\Inetpub\adminscripts\net start w3svc

    ```'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Hacking Exposed Web Applications


    Apache can stop the directory enumeration. Remove the mod_dir module during compilation.

    The change is simple:


    ```

    [root@middle apache_1.3.23]# # ./configure --disable-module=dir

    Configuring for Apache, Version 1.3.23

    ```


    ...


    # Good Security Practices


    A secure application starts with a strong build policy for the operating system,
    Web server, and other supporting software. Web servers in particular should implement
    these few steps to raise the bar for security.


    +   - Use separate document roots for user and administrator interfaces. This
    can mitigate the impact of source-disclosure attacks and directory traversal attacks
    against application functionality:

    /main maps to D:\Inet\pubroot

    /admin maps to E:\Inet\adroot-

    - With IIS, place the InetPub directory on a volume different from the system
    root, for example, D:\InetPub on a system with C:\WINNT. This prevents directory
    traversal attacks from reaching sensitive files like \WINNT\repair and \WINNT\System32\cmd.exe.

    - For Unix servers, place directories in a chroot environment. This can mitigate
    the impact of directory traversal attacks.

    - Don''t use robots.txt files. Search engines, spambots, and spidering tools rarely
    honor them.


    # Protecting Include Files


    The best protection for all types of include files is to ensure that they do not
    contain passwords. This might sound trivial, but anytime a password is placed
    in a file in cleartext, that expect path to be compromised. Commonly used for
    include files (.inc) to asp. You can change the file extension as this will cause
    them to be processed server-side and prevent source code from being displayed
    in browsers. By default, .inc files are rendered as text in browsers. Remember
    to change any references to other scripts or content to the renamed include files.


    # Miscellaneous Tips


    The following tips will help your Web application to resist the surveying techniques
    we''ve described in this chapter.


    +   - Consolidate all JavaScript files to a single directory. Ensure that the
    directory and any files within it do not have "execute" permissions (that is,
    they can only be read by the Web server, not executed as scripts).'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# Chapter 4: Surveying the Application


    +   - On IIS, .inc, js, xls, and other include files outside of the Web root wrapping
    them in a COM object.


    +   - Strip developer comments. A test environment should exist that is not Internet-facing
    where developer comments can remain in the code for debugging purposes.


    +   - If a must call any file on the Web server, then use pathnames relative to
    the Web root or the current directory. Do not use pathnames that include drive
    letters or directories outside of the Web document root. Additionally, the script
    itself should strip directory traversal characters (../


    +   - If a site requires authentication, ensure authentication is applied to the
    entire directory and its subdirectories. If anonymous users are not supposed to
    access ASP files, they should not be able to access XSL files either.


    # SUMMARY


    This chapter illustrated the process of surveying a Web application from the perspective
    of a malicious attacker. This process of cataloging site structure, content, and
    functionality lays the groundwork for all subsequent steps in the Web application
    security auditing methodology described in this book. It is crucial that the techniques
    described are carried out consistently and comprehensively in order to ensure
    that no aspect of the target application is left unintended. Many of the techniques
    we described require subtle alteration depending on the uniqueness of the target
    application, and as clever inductions on the part of the surveyor will lead to
    more complete results. Although much of the process of surveying an application
    involves making valid requests for exported resources, we did note several common
    practices and misconfigurations that can permit anonymous clients to gain more
    information than they should. Finally, we discussed countermeasures to some of
    these practices and misconfigurations that can help prevent attackers from gaining
    their first foothold in their climb towards complete compromise.


