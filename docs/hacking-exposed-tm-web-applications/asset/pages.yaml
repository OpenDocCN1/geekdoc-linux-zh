    Examining the output of this sample, you can see Whisker has identified several

    dangerous details on this IIS 5 system, as well as the presence of ISAPI filters
    that

    correspond to .ida and .idq files (the whisker and whisker.idq results are only

    dummy dummy that this server will respond to requests for such files). Again,
    this is

    t essence of the Whisker engine—it checks for the presence of files with known
    security

    issues, just like most CGI scanners.


    The power of Whisker comes from its easy-to-learn script database language, which
    is

    described in the whisker.txt file that the tool. Writing custom script databases

    is fairly straightforward using the language, which is built around two key concepts:

    arays and scans.


    An array is a list of directories to check for the presence of a file. An array
    called

    “roots,” is comprised of the directories (the Web root directory), scripts, cgi-bin,
    iisadmin,

    isadhelp, would be created like so:


    ```

    array roots = /,scripts, cgi-bin, iisadmin, iishelp

    ```


    Arrays can be referenced using the @array_name syntax in the script database

    and can be nested to specify a dizzying variety of directory structures using
    only a

    few lines of code.


    The scan instructs the Whisker engine to search the specified arrays to find a
    specific

    filename. Following the previous example, if you wanted to scan the “roots” array
    for

    ppresence of my.cy, you would use this syntax:


    ```

    scan ( ) @roots >> default.asp

    ```


    To limit the scan to systems that return the string "IIS/5.0" in the HTTP header,

    could add it to the scan syntax like so:


    ```

    scan (IIS/5.0) @roots >> default.asp

    ```'
