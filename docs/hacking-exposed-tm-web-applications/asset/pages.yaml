    |

    | Internet printing | .printer | Remote system buffer overflow, MS01-023 |

    | Index Server | .ida, .idq | Remote system buffer overflow, MS01-033 |

    | Hit highlighting | .htw | “Webhits” source disclosure, MS00-006 |

    | FrontPage Server Extensions RAD support | Uninstall FPSE RAD Support | Remote
    IUSR or System buffer overflow |

    | ISAPI Extension Mappings That Should Be Unmapped in a Secure IIS Configuration
    (continued) | |


    Keep up with Microsoft Service Packs and Hotfixes Removing potentially vulnerable
    ISAPI DLL problems, and of course, we also recommend the relevant software packages
    for issues directly from the vendor. The Microsoft Security Bulletins associated
    with the most recent ISAPI DLL vulnerabilities can be found in Table 3-1 (they
    are labeled like so: MS01-026 for the 26th bulletin of 2001). Links to appropriate
    patches can be found within each bulletin.


    To assist with keeping your IIS up to date with security patches, Microsoft also
    publishes the Hotfix Checker (hfnetchk.exe). Given administrative access to network
    sharing services (server Message Block, SMB, TCP 139 and/or 445) on a network
    of IIS machines, hfnetchk will scan and report back the Service Pack and Hotfix
    level for each system. After each scan, hfnetchk will output an updated XML datastore
    from Microsoft to ensure that it has the most recent information about available
    patches.


    Implement Aggressive Egress Filtering One of the first things an attacker will
    seek to do once they gain the ability to run arbitrary commands on a Web server
    is to “shovel” an outbound connection or upload more files to the victim. With
    appropriate egress filtering on the firewall of the Web server(s), these requests
    can be blocked, radically raising the bar for attackers. The simplest rule is
    to deny all outbound connections except those that are established, which can
    be implemented by blocking all packets except a TCP SYN flag. This will not block
    replies to legitimate incoming requests, allowing the server to remain accessible
    to outsiders (your ingress filters are tight, too, right?).'
