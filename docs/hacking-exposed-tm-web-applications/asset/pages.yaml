    One of the newer and initially impressive Web vulnerability scanners available
    today is Stealth HTTP Scanner by Felipe Monet. The latest commercial version as
    of this writing, N-Stealth 3.0, claims to scan for over 18,000 HTTP security issues,
    and custom checks can be added to it using an extraordinarily simple script language.
    The following information applies to Stealth 2.0 build 35, since we were not able
    to obtain N-Stealth in time for publication.


    Although a graphical tool, Stealth can be a bit tricky to use. For example, as
    soon as you fill in the "Host" field on the Scanner button, the option to scan
    IP address range disappears; the only way to get it back is to clear the Host
    field and check the IP Range box. In addition, clearing the Clean List on screen
    requires manually editing


