    Two recently announced buffer overflows in Netscape Enterprise Server reminded
    the world that Isn''t the only high-profile Web server platform to suffer from
    such problems. With any buffer overflow allows execution of arbitrary code as
    a privileged user, these are the most devastating types of attacks against a Web
    application.


