    # Whisker


    | | |

    | --- | --- |

    | Pro: | Flexible, Perl-based, can run as CGI, free |

    | Con: | Not updated frequently, no native SSL support |

    | Final Analysis: | Quick and dirty scans for new vulnerabilities a snap |


    Probably one of the oldest Web vulnerability scanners still around, Whisker is
    a robust tool, but it''s showing its age compared to more recent entrants into
    the field. Its author, Rain Forest Puppy, keeps promising to release the much-anticipated
    version 2.0, but it was still not available at the time of this writing.


    The essential function of Whisker is to scan for the presence of files on remote
    Web servers. It is age of the early days of the Web, where most vulnerabilities
    were associated with CGIs or scripts with known issues (the vulnerable php exploit)
    and this was all the functionality really required of a scanner. However, today''s
    more complex environment makes this single purpose somewhat limited. Let''s demonstrate
    this by explaining how Whisker works through a simple example.


    > The Whisker engine is a Perl script (whisker.pl), so if you''re going to use
    it, make sure you have an appropriate Perl environment available (like ActiveState
    Perl).


    The Whisker engine takes as its primary input a scan configuration file called
    a database (usually possessing the extension .db). The database file tells Whisker
    what files to look for, and in which directories, among other things, Whisker
    comes with a set of databases that are fairly robust—the scan.db file is still
    one of the more comprehensive databases of common Web server security checks around,
    although it is getting'
