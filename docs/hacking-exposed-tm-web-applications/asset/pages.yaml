- pgno: 206
  md: '# Hacking Exposed Web Applications


    exposition (there are probably a few sites with desires of world domination, as
    well). Client-side techniques rely on sending the "state information" to the client
    and trusting the client to return this information unchanged. In short, the client
    cannot be trusted. Any time information leaves the server, a cookie value, for
    example, the client can modify cookie to contain arbitrary information. If you
    run into a Web server that performs state management, it is a safe bet that state
    information is being passed to the client. It is also likely to be insecure.


    Client-side techniques are used regularly, they must have some advantages. The
    primary advantage of client-side techniques is that they work particularly well
    in a load-balanced architecture with a Web farm. Incoming requests can be distributed
    to the least busy server without worrying how the server is supposed to respond.
    The server inspects the state information, looks up in the database, checks the
    shopping cart, and returns the appropriate data. On the other hand, load balancers
    are becoming increasingly intelligent and can handle single sessions that touch
    multiple servers. Now, let''s take a look at some of the carriers for state information.


    # Hidden Fields


    Hidden forms are easy to identify, so we''ll start with this category. A hidden
    field does not imply poor security, but it can be an indicator. Let''s take a
    look at what a FORM created from an application''s login page


    ```

    <FORM name=login_form

    https://login.victim.com/config/login4rfr0naidr6d3 method=post

    <INPUT name=Tries type=hidden><INPUT value=us name=I8N type=hidden>

    <INPUT name=Bypass type=hidden><INPUT value=64mbvjoubdp06 name=hidden type=hidden><INPUT
    value=pVj3sXMRJKD8lggZTYDLWNY_name=Challenge type=hidden>

    User Name:<INPUT name=Login>

    Password:<INPUT type=password maxLength=32 value="" name=Passwd>

    ```


    When the user submits their username and password, she is actually submitting
    seven pieces of information to the server even though only two were visible on
    the Web page. Table 7-2 summarizes these values.


    From this, it appears that two hidden fields are tracking state information, "Tries"
    and "U". At this point it is not clear whether a vulnerability exists. Remember,
    we need to identify all of the state mechanisms first.


    > As we continue to look at session management techniques, we are sure to touch
    on other aspects of Web security. Session management is crucial to the manner
    in which applications handle authentication and authorization. Plus, data collected
    from the client are always subject to input validation and attacks. Security testing
    really requires a holistic view of the application.'
