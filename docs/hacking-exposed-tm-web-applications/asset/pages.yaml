    # Embedded Scripts


    Embedded script attack the popularity of cross-site scripting, but they are not
    necessarily rarer. A CSS attack targets other users of the application. An embedded
    script attack the application itself. In this case, the malicious code is not
    a pair of <script> tags, but formatting tags. This includes SSI directives, ASP
    brackets, PHP brackets, SQL query structures, or even HTML tags. The goal is to
    submit data, when displayed by the application, executes as a program instruction
    or mangles the HTML output. Program execution can enable the attacker to access
    server variables like passwords and files outside of the Web document root. Needless
    to say, it poses a major risk to the application. If the embedded script merges
    the output, then the attacker may be presented with source code that did not execute
    properly. This can expose sensitive application data.


    Execution tests fall into several categories. An application audit does not require
    complex or malicious code. If an embedded ASP date function returns the current
    date, then the application''s input validation routine is inadequate. ASP code
    is very dangerous because it can execute arbitrary commands or access arbitrary
    files:


    ```

    <= date() %


    <!----include virtual="global.asa" -->

    <!----include file="/etc/passwd" -->

    <!----exec cmd="/sbin/ifconfig -a" -->

    ```


    Embedded Java and JSP is equally dangerous:


    ```

    <% java.util.Date today = new java.util.Date(); out.println(today); %

    ```


    Finally, we want to forge PHP:


    If one of these actually works, then there is something seriously broken in the
    application. Language tags, such as "<?" or "<%", are usually processed before
    user input. This does not mean that an extra %%> won''t break a JSP file, but
    don''t be too disappointed if it fails.'
  merge: -1
