  md: '![](img/db18fe165e1f1a64ee0c5d815560917d_9_0.png)


    Before we move on to other commands, let''s look briefly at chaining switches
    together: ls -1h ~


    -1 gives you more information about the files and folders, and -h changes the
    units from bytes to kB, MB, or GB as appropriate. We''ll look at some of the extras
    the -ls listing you in more detail later, particularly in chapters two and three.


    # Time for change


    That''s enough looking: let''s start moving. cd is short for change directory,
    and move to wherever you want in the system: try cd /var/log and have a look ls(1).
    Files are logs, or messages on the state of your system that are saved for analysis.
    It''s not everything you''ll need to think about: Raspberry Pi is a version of
    an operating system that runs across data centres and supercomputers, where problem
    monitoring is very important. It is however, useful to know, particularly if you
    have a problem and someone on a forum you check your logs.


    cd ~ will take you where you expect it. Try it, then pwd to check. Now try cd
    - (that''s the hyphen), the ''-'' is a shortcut for ''wherever I was before I
    came here''. Now we''ve looked around, we can move on to beginning to do things
    to our files.


