- pgno: 51
  md: 'curl can be used in place of wget for simply downloading files, but its strengths
    lie elsewhere, in its extensive features - take these in everything from proxy
    support and user authentication, to FTP upload and cookies


    The tar command packs or unpacks archive of files and directories; it also handles
    uncompressing the first


    ```

    $ raspberrypi@raspberrypi:~# curl -O https://pypi.org/packages/RP/RPi.GPIO/RPi.GPIO-9.0.5.tar.gz

    $ raspberrypi@raspberrypi:~# tar -xvf RPi.GPIO-9.0.5.tar.gz

    $ raspberrypi@raspberrypi:~# cd RPi.GPIO-9.0.5

    $ raspberrypi@raspberrypi:~# ls -l

    total 64

    -rw-r--r-- 1 pi pi 2432 May 22 10:00 setup.py

    -rw-r--r-- 1 pi pi 4500 May 22 10:00 README.md

    -rw-r--r-- 1 pi pi 1500 May 22 10:00 LICENSE.txt

    -rw-r--r-- 1 pi pi 1200 May 22 10:00 setup.cfg

    -drwxr-xr-x 4 pi pi 4096 May 22 10:00 dist

    -drwxr-xr-x 4 pi pi 4096 May 22 10:00 build

    -drwxr-xr-x 4 pi pi 4096 May 22 10:00 docs

    -drwxr-xr-x 4 pi pi 4096 May 22 10:00 tests

    -drwxr-xr-x 4 pi pi 4096 May 22 10:00 examples

    -rw-r--r-- 1 pi pi 3000 May 22 10:00 MAN.rst

    -rw-r--r-- 1 pi pi 2000 May 22 10:00 CHANGELOG.md

    ```


    ```

    $ raspberrypi@raspberrypi:~# sudo apt-get update

    $ sudo apt-get install python3-gpio -y

    ```


    ![](img/db18fe165e1f1a64ee0c5d815560917d_51_0.png)


    unning an apt command (see chapter 3) allows access to a huge collection of software
    - several thousands of packages in the main Raspbian repository - but sometimes
    we need to add software outside the main repository.


    If we are lucky, we find that someone has packaged the software in the deb format
    used by Debian, or even created a whole repository to take care of the dependencies.
    We''ll look briefly at adding repositories, and dealing with other kinds of downloads,
    trying to reach the venerable editor along the way.


    Information about repositories is kept in the /etc/apt/sources.list file, which
    on a new install just contains the Raspbian repository. Rather than editing this
    file to add other repositories, you are advised to add them in a .list file to
    the /etc/apt/sources.list.d directory. To add a new repository, use sudo nano
    to create a .list file there and inside it, add a source in the following format:


    ```

    deb http://apt.pi-top.com/raspbian/ jessie main

    ```'
