- pgno: 14
  md: '# # CONQUER THE COMMAND LINE


    You can peek at the first or last few lines of a text file with head and tail
    commands. head fourinar.py will show you the first ten lines of the file. head
    -n 5 fourinar.py shows five lines, as tail -n 5 fourinar.py with the last five
    lines. On the Pi, head - 5 fourinar.py will also work.


    ![](img/db18fe165e1f1a64ee0c5d815560917d_14_0.png)


    # Remove with care


    nano file.txt does not already exist: try it, and see if it works when you exit
    the file before writing and saving anything. We''ve done a lot already (at least,
    nano makes it feel like a lot), but it''s never too early to learn how to clean
    up after ourselves. We''ll remove the files we''ve created with rm. The remove
    tool should always be used with care; it has some built-in safeguards, even these
    are easy to override (Fig 2). In particular, never let anyone persuade you to
    rm -rf / – this will delete the entire contents of your Pi, all the programs,
    everything, with little to no chance of recovery.


    We have a look at what we made: if you''re still in the tempfolder ls the Four-in-ARow
    files you copied here. Remove the program, the png files with careful use of the
    * wildcard.


    ![](img/db18fe165e1f1a64ee0c5d815560917d_14_1.png)


    > Fig 2 rm is a powerful removal tool: use with great care!


    ```

    rm fourinar.py

    rm 4row_*.png

    ```


    cd .. to get back to /home/pi and rm -r (recursive) option will remove the new
    empty folder. It is necessary for directories, and will also remove the contents
    if any remain.


    In the next chapter, we''ll delve into file permissions and updating your Pi''s
    software from the command line.


    ![](img/db18fe165e1f1a64ee0c5d815560917d_14_2.png)'
  merge: -1
