- pgno: 53
  md: '# The MagPi ESSENTIALS


    downloads. It dumps to stdout by default; to save as a file (instead of name as
    the resource in the URL, use the -0 switch. For instance:


    ```

    curl -OSL https://pypi.python.org/packages/source/R/RPi.GPIO/RPi.GPIO-0.6.5.tar.gz

    ```


    Here, the -5 switch will show any errors, while the -L switch will enable curl
    to reattempt to fetch the requested file if the server reports it has a different
    location.


    # Unzip


    The Python GPIO library downloaded above is compressed with gzip, which losslessly
    reduces the size of files, and can be decompressed with gunzip. There are here
    files rolled into a tar archive (.tar.gz, you''ll find similar archives ending
    .tgz), and the tar command can do decompressing and untarching in one:


    ```

    tar zvf RPi.GPIO-0.6.5.tar.gz

    ```


    ![](img/db18fe165e1f1a64ee0c5d815560917d_53_0.png)


    Note that the data is not needed for single letter options in tar. The first switch,
    z, calls gzip to decompress the archive, then x extracts the contents. v is verbose,
    informing you of the process as it happens, and f tells tar to work with the named
    file(s), rather than stdin. Miss the z and tar should automatically detect the
    necessary compression operation.


    The result in this is a folder containing, other things, a setup script to run
    the installation (read the INSTALL.txt file first):


    ```

    cd RPi.GPIO-0.6.5

    sudo python setup.py install

    ```


    While gzip is more efficient than zip (and even more efficient bzip2 is available),
    you''ll get a plain old zip file, in which case unzip is the command you want.


    ```

    unzip 2018-11-13-raspbian-stretch-lite.zip

    ```'
  merge: -1
