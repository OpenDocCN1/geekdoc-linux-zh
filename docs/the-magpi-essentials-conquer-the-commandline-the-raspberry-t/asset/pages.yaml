- pgno: 83
  md: '# The MagPi Essentials


    If you''ve ever had to fall back on the Pi as a desktop machine, you''ll know
    that capable as it is – particularly the four-core Pi 3 – you don''t want to have
    too many browser tabs open at once. Some websites are so dependent on JavaScript,
    though, for all the memory that they hog on the Pi, you can only access them via
    Chrome (or Firefox). For others, try the retro world of the command-line web browser.


    In the early 1990s, most people who had internet access browse with a command-line
    browser called Lynx. After a quarter of a century, it''s still in use! If not
    being able to see any pics makes the web pointless for you, consider the advantages.
    No tracking, distractions from reading the text, and quicker page loads. Reader
    users and the mobility impaired can benefit from simpler keyboard navigation,
    and pages can be dumped to stdout, you can pipe it through other command-line
    applications:


    ```

    lynx -dump https://duckduckgo.com/?q=gpi+-n 30

    ```


    Lynx isn''t the only choice in command-line browsing – Raspian offers links2 and
    wim, the latter is even usable from within the Emacs text editor. Install xterm
    (an alternative to Raspian''s default Terminal application) and wim-img, and you
    can view images when browsing from the terminal.


    # Commanding the web


    Telnet – short for teletype network – is the protocol developed in the early of
    the 1900s to provide two-way communication between computers. It dates from an
    era without security concerns, and was long ago replaced by SSH as a means of
    connecting directly to others over open networks, but the Telnet client remains
    useful for interactively querying services as mail or web for testing, by connecting
    to the appropriate port on the server, then issuing commands in the service''s
    protocol:


    ```

    telnet example.com 80

    GET /HTTP/1.1

    HOST: example.com

    ```


    ...which (pressing ENTER again) should dump a webpage to


    ![](img/db18fe165e1f1a64ee0c5d815560917d_83_0.png)'
