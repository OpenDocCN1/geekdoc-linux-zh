  md: '![](img/db18fe165e1f1a64ee0c5d815560917d_59_0.png)


    # # Linked In


    Systemd makes symbolic links files automatically, but there will be times you''ll
    want a file to appear in a local directory when it is elsewhere, with a handy
    little command we have not so far a chance to show you: 1n.


    In makes a link which allows a file to effectively exist in two places at once.
    In the following example:


    ```

    sudo 1n -s /usr/share/doc/python-numpy/THANKS.txt numpy-THANKS.txt

    ```


    ...a file will appear in your working directory. But 1s -1 and you''ll see that
    it''s a special type of file, a link pointing to the actual file. Edit numpy-THANKS.txt
    and you''ll find that THANKS.txt in the linked directory will be edited.


    Soft, or ''symbolic'' links, are created with the s - you don''t even need the
    file which you''re linking to actually exist, if you''re linking across a network,
    or to a removable drive.


    Systemd is a complex system, with many elements - systemd-unit - but they all
    have their own man, each''s worth reading through to get the overall concept.


    Backwards compatibility with initd scripts and even run levels - is maintained


    ![](img/db18fe165e1f1a64ee0c5d815560917d_59_1.png)


    ```

    # X-Stop-Before:

    is

    # X-Start:

    is

    # Default-Start:

    2 3 4 5

    # Default-Stop:

    0 6

    # X-Wanted-By:

    true

    # Short-Description: Example instances

    # Description:This file is used to construct scripts to be placed in /etc/init.d/


    ### END INIT INFOT

    ```


    More information on the format is available in inserv(8). This information is
    used to dynamically assign sequence numbers to the boot levels in parallel during
    the boot. See also /usr/share/doc/etc/init.d/README.


    ```

    pi@raspberry:/etc/systemd $ ls -l

    mountall.sh  rc ssh

    networking  dev-final

    avavami  mountdevfs.sh rc,local sudo

    bluetooth  faker-lock triggerhappy

    hostname.sh  README

    bootstrap.sh  mountdevfs.clean

    mntifs.sh  reboot umntfs

    checks.sh  kbd rmlogin umntfs

    checks.clean.sh rcbd umroot

    console-setup rpy rysync umroot

    ddbus  lightdm pythyl urandom

    cdrod  modd  procs sendsig xii-common

    pi@raspberry:/etc/systemd $ all-boot-clean.sh raspi-config skeleton

    ```


