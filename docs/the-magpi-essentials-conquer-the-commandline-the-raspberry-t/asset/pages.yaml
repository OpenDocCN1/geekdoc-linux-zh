    The UNIX family of operating systems, which includes other flavours of GNU/Linux
    and Apple''s macOS, deals with data commands as streams of text. This means that
    for now, we''ll focus on giving you a firm foundation to building your custom
    commands.


    # Getting out our feet wet


    When a command is called at the terminal, it is given three streams, known as
    standard input (stdin), standard output (stdout), and standard error (stderr).
    These streams are plain text, and treated by the Pi as specials. As noted in chapter
    3, ''everything is a file'': this is what the Pi and other UNIX systems have the
    ability to put together simple commands and programs to build complex but reliable
    systems.


    Normally, stdin is what you enter into the terminal, (command output) and stderr
    (any error messages) appear together. The reason the last two have a separate
    existence is that you may want to redirect one of them – error messages, for example
    – somewhere away from your regular output commands. We''ll look at separate error
    messages later, but first we need to know how to redirect and connect our output
    to commands or files.


    Connecting commands uses pipes, the ''|'' symbol found above the backslash on
    both GB and US keyboards (although two'
