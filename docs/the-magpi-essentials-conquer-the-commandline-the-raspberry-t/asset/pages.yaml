- pgno: 34
  md: '# # Editing with nano


    We touched briefly on nano in chapter 2. Looking in a little more depth, the first
    thing to be aware of is the dozen shortcuts across the bottom two lines of the
    terminal: is the CTRL key (represented by the caret ^) at the same time as a other
    key. For example, ^A for ReadFile (i.e. open), ^O for WriteOut (in other words,
    save), and ^X for Exit.


    While nano lacks the power of Emacs and Vim, its main-line code editor rivals,
    it has useful features as a powerful utility (^J), which will resemble a paragraph-break
    stretch text into an unbroken paragraph, or align breaks at a fixed character
    length. This is a legacy of its development for email composition. ^K cuts the
    line of the cursor is on, but it isn''t just a delete function: each cut is added
    to a clipboard. ^U is great for gathering useful snippets from a longer text.


    Hit ^O to save fast, and the shortcut listing changes, with now beginning M instead
    of ^ – this is short for Meta, which means the ALT key on your keyboard (once
    upon a time, some computers use modifier keys, such as Super and Hyper). One ‘hidden’
    shortcut after ^O is at that point, ^T opens a file manager for the file/directory
    where you want to save.


    After saving, exit with: sudo mount -a will mount the external drive at the desired
    mount point (Fig 2), regardless of what else is plugged in. If you have other
    entries in /etc/fstab, then sudo mount /media/usb1 (or whatever you put in fstab)
    will mount that chosen device if you don''t want to mount any of the others.


    Having inside connected devices, the next chapter will see us accessing all of
    the Pi, but remotely, from anywhere on the planet with an internet connection.


    ```

    sudo nano /etc/fstab

    # / / root ext4

    # /home root ext4

    # /var root ext4


    # Filesystem Mounted on

    323728 2780624 143792 95%

    303278 2780624 143792 95%

    219744 0 219744 0 %dev/

    5120 0 5120 0 /run/lock

    5120 0 5120 0 /run/user


    # Filesystem Mounted on

    323728 2780624 143792 95%

    303278 2780624 143792 95%

    219744 0 219744 0 %dev/

    5120 0 5120 0 /run/lock

    5120 0 5120 0 /run/user

    ```


    Fig a Once we''ve put our removable disk in the filesystem-table (/etc/fstab)
