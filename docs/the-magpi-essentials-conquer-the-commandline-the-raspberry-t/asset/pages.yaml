- pgno: 86
  md: 'and drama on Radio 4 Extra – can be downloaded for a few days after they have
    been broadcast, by the get-iplayer script; saves them in the AAC format for listening
    to later. To keep within reasonable fair use terms – or at least equivalent to
    the BBC’s own iPlayer service – the programmes should be deleted after 30 days.


    At the time of writing, the programme search function no longer seems to work
    properly. So, you''ll need to use the iPlayer website to find the PID (Programme
    Identifier) of the desired show and then use it to ‘record’ (i.e. download) it.
    For example:


    ```

    get_iplayer --pid=b0b95311

    ```


    You can also use a comma-separated list of PIDs to download more than one at a
    time.


    ```

    get_iplayer --pid=b0b95311,b0b94zn8,b0b950c9

    ```


    Calling with --stream sends the output to stdout, redirecting a pipe to an audio
    player (for radio shows). --stdout switch does this in addition to recording.


    # Communication


    We mentioned command-line mail – scripted directly – in the calendar example in
    chapter 11. smtp makes a fair choice for the mail command, to use in scripts that
    imply when your Pi does something. Nowadays, getting the Pi to post to a microblog
    is a far popular choice – at least if the microblog is Twitter, although other
    choices are available.


    There are instructions all over the web for using Python modules to tweet when
    your Pi detects various events on the GPIO pins. If Pi suits your project, then
    go ahead, but for the simplest setups all that''s needed is the easily scriptable
    twidge:


    ```

    sudo apt-get install twidge

    twidge setup

    ```


    Setup is easy: twidge will give you a URL to visit, where you can authorise twidge
    to access your Twitter account, it passes you an'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'authorisation code to use, after which twidge is ready to go. twidge l1commands
    will list the available commands. To post from the command line (or a script),
    try something like:


    +   [ EMAIL ]

    y you struggle to keep up with using email: challenge yourself to use Mutt for
    weeks: the command line may leave you your inbox.


    ```

    twidge update "Testing twidge - tweeting from the #RaspberryPi #commandline."

    ```


    The update will also be read from stdin. The helpful manual on your project''s
    GitHub page will get you started. For an interactive (and very colourful) Twitter
    client on the command line, install Rainbowstream, which you can do with:


    ```

    sudo pip3 install rainbowstream

    ```


    # More than just gimmicks


    Command-line apps are also available for older means of internet communication,
    from IRC to Jabber, and Mutt is a powerful enough email client to keep people
    (who otherwise don''t spend much time in the terminal) using it. Serious work
    gets done in a shell, but keeps churning out command-line apps that are just for
    fun, too. MapASCII is a Braille and ASCII map renderer for your console, using
    OpenBrailleMap data, written by Michael Straßburger (magpi.cc/znMzWa). To connect
    from a remote computer:


    ```

    telnet mapscii.me

    ```


    ASCII Star Wars appeared at the end of the last century, and is still available
    at asciomation.co.nz. Ironically, you''ll need a modern graphical browser to view
    it.

    Some sites are designed to look good in text-mode browsers.

    A favourite is wtr.in, the weather website. Enter your location, and open in any
    of the text-mode browsers that you''ve mentioned, for example:


    ```

    w3m wtr.in/Liverpool

    ```'
