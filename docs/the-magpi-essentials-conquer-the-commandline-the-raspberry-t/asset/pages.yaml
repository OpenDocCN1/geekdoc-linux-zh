    # # Wildcard


    The . (dot) at the end of the commands refers to ‘just here’, which is where we
    want the files copied. Also, 4row* is read by the Pi as ‘every file being 4row-*
    – the * is known as a wildcard, and this represents any number of characters (including
    none); there are other wildcards, using ?, means any single character.

    Try python fourinarow.py and you''ll see you can run the local copy of it. To
    change the name, we need an editor – sidestepping the UNIX debate about which
    one is best, we''ll use the Pi’s built-in editor: nano. Unless you''ve previously
    used the Pico


