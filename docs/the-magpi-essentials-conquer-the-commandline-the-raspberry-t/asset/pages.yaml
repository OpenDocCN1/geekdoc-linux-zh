- pgno: 44
  md: 'the signal, and first saving any data they need to save and releasing system
    resources before quitting.

    kill -2 sends SIGINT, which is equivalent to stopping a program from the terminal
    with CTRL+C: you can lose data. Most drastic is kill -9 to send SIGKILL, telling
    the kernel to kill the process with no warning. Save this one for when nothing
    else works.


    Mildest of all is the Hang Up (HUP) signal, called with kill -1, which many daemons
    are programmed to treat as a signal to re-read their configuration files and carry
    on. It is the safest signal to send to a critical process.


    # Staying on


    nohup will run a program which will continue after the terminal from which it
    started has closed, ignoring the SIGHUP (hangup) signal. As process is detached
    from the terminal, error messages and output are sent to the file nohup.out in
    whichever directory you were in when you started the process. You can redirect
    it – as we did in chapter 4 – with 1 for stdout and 2 for stderr; & is a special
    case for redirecting both stdout and stderr:


    ```

    nohup myprog &backgroundoutput.txt &

    ```


    One use of nohup is to be setting in motion from an SSH session, which will continue
    after an interruption. For example, restarting the network connection to which
    you are connected:


    ```

    sudo nohup sh -c "ifconfig wlan0 down && ifconfig wlan0 up"

    ```


    Note that the nohup.out log file created here will need sudo privileges to read
    – or reassign with:


    ```

    sudo chown pi:pi nohup.out

    ```


    ![](img/db18fe165e1f1a64ee0c5d815560917d_44_0.png)


    +   Fig 2 Everything running has a process (PID) that can be used to control your
    program; find them all with ps


    +   KEEP ON RUNNING

    nohup is useful for a program that will be running for some time in the background
    – perhaps a project you are working on – until you feel enough to add to Raspberry''s
    processes.'
  merge: -1
