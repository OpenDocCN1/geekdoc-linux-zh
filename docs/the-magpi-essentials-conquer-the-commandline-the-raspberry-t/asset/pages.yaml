    ## SSH: Secure Shell


    SSH (Secure Shell) is a cryptographic network protocol used for operating

    sely network services over an insecure network. It allows users to log in to a

    remote computer program securely. In this section, we will discuss how to use

    ssh to connect to remote servers and execute commands on them.


    ```

    ```bash

    $ ssh user@host

    ```

    ```


    ## Telnet: The Old Guard


    Telnet is a communications protocol used to provide a virtual terminal connection

    oriented communication service over a telecommunication network. While it has
    been

    serseded by SSH, it is still used for some purposes. In this section,

    we will look at the history of telnet and how to use it today.


