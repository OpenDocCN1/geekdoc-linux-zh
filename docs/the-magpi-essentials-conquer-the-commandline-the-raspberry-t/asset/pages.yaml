- pgno: 16
  md: '# CONQUER THE COMMAND LINE


    installing software should be easy, but behind every piece of software is an evolving
    set of dependencies that also need installing and updating. Keeping them separate
    reduces bloat and duplication, but also adds potential for bugs, missing files,
    and even totally unsolvable clashes.


    Fortately, Debian GNU/Linux cracked the problem back in the 1990s with the Debian
    Package Management system and the Advanced Package Tool (APT) – and Debian-based
    systems, like Ubuntu and the Pi’s Raspian, inherit all of the benefits. Here we’ll
    show you the basics you need to know to install new software and keep your system
    up to date from the command line, and then look at the entirely unrelated field
    of file ownership and permissions.


    Using the apt command to update your system''s list of install software should
    be as simple as commanding the line like: apt-get update. Try this in as user
    pi, though you will just get error messages. The reason for this is that changing
    software on a GNU/Linux (or any type of UNIX) is a system restricted to those
    with administrative privileges: the superuser, also known as


    SHARED RESPONSIBILITY


    If you share your Pi, read up on sudo and the visudo command to find how to give
    useful admin privileges to the others.


