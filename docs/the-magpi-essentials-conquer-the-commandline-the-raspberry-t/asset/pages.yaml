    # ## Look around


    If you''re looking at all files and folders in a file manager, try to clear your
    mind and concentrate on the names. Type **ls** and press **RETURN** (see ‘Press
    Return’ box). On a fresh Raspberry Stretch with Recommended Software install,
    you’ll see a few directories, including **MagPi**. Type **ls MagPi** (see ‘Lazy
    Completion’ box) and you’ll see list of what’s in it.


    Commands like **ls** are not cryptic (at least not unintentionally) but they are
    terse, dating back to time when the connection to the computer was over a 110
    baud serial line, from an ASR 33 teletype terminal. If you think it’s strange
    to be 50-year-old technology, remember that your QWERTY keyboard layout was reportedly
    designed to stop mechanical typewriter keys jamming, and to enable salespeople
    to quickly type ‘typewriter’ using the top row!


    # ## File path


    You can list files and folders anywhere in your system (or other connected systems)
    by providing the path as an argument to you


