    \ using a page to display text)\n\n![](img/db18fe165e1f1a64ee0c5d815560917d_13_0.png)\n\
    \n# # Cats, heads & tails\n\nIf editors are a UNIX tradition we can safely ignore,\
    \ there's no getting away from another tradition: bad puns. less is an improvement\
    \ over more, a simple pager: the respective man pages more is that has the relatively\
    \ primitive at the end of a file exits automatically, saving you reaching for\
    \ the Q button. Admittedly, this is not a huge advantage, and you can always use\
    \ cat.\n\nFortunately, cat is not a fine-based pulp, but simply for 'concatenate':\
    \ use it with more one file and it connects them together. Used with no argument\
    \ — type cat — it echoes what you type after each ENTER. Hit CTRL+C to get out\
