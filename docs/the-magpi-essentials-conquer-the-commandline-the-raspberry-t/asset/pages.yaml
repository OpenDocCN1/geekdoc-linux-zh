    # # Surfraw


    As we have seen earlier, with wget and curl, functions such as downloading can
    be removed from the web browser. Another case where specialist commands seem most
    appropriate is searching. Looking things up from the command line can be be done
    directly with a nifty little program called surfraw, which helps elvi to tackle
    difficult search tasks — see them all:


    ```

    surfraw -elvi


    As a good citizen of the command-line world, surfraw pays de regard to your time
    and your tendons, and can be called simply with sr.

    ```


    +   - sr google -results=2 raspberry pi clojure gpio

    - sr translate peloton

    - sr gutenberg dickens

    - sr wikipedia permacultureature

    - sr bbcnews tim peake

    - sr rhyme orange'
