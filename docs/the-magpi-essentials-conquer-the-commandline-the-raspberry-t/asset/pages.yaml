    # # The Beeb


    ```

    sudo apt-get install youtube-dl

    youtube-dl https://www.youtube.com/watch?v=ElB09DwxA6Q

    ```


    Each downloaded video is saved as an MP4 file, which thanks to MPlayer''s ability
    to output video through a choice of libraries, even be rendered in ASCII through
    the terminal, using the -vo caca option. It can also be output via an SSH session,
    although forwarding the sound is an exercise we leave the reader to research.
    ASCII rendering is far from high-resolution, if you run mplayer from one of the
    virtual consoles (which we visited back in chapter 1), will default to a framebuffer
    output, for regular-quality video overlaying the command line.

    You can also access BBC content from the command line. Although television programmes
    are only available from IP addresses located in the UK, radio shows – from Radio
    3 to classic comedy'
