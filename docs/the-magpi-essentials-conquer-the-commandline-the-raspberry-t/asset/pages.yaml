- pgno: 33
  md: '# Fig Raspberry wants to mount plugged-in-disks, and take care of the details
    for you - note that the GUI tells you it''s Windows software the command line
    has information for you to control when the job is done in a particular way, telling
    you it''s NTFS file system


    ![](img/db18fe165e1f1a64ee0c5d815560917d_33_0.png)


    Mount the disk using sudo mount -t vfat /dev/sda1 /media/usb, where fat (NTFS
    or ext2) is the file-system type.


    # File-system table


    Raspbian knows which disks to mount at boot time by reading the file-system table
    (/etc/fstab), and we could put our /dev/sda in, but if we start with two drives
    plugged in, the wrong one may be selected. Fortunately, disks (or rather, disk
    partitions) have unique labels known as UUIDs allocated when the partition is
    created. Find them with sudo blkid, which also helpfully tells you the label,
    if that often contains the name and model of external drives, or look in /dev/disk-by-uuid.


    For an NTFS-formatted drive, use sudo nano /etc/fstab and add the following line
    to the end of the:


    ```

    /dev/disk/by-uuid/E4EE32B4EE327EBC /media/usb

    tfs defaults 0 0

    ```


    This gives the device name (yours different, of course), mount point, file-system
    type, and two numeric fields: the first of these should be zero (it relates to
    the unused dump backup program), while the second is the order of check and repair
    at boot: 1 for the root file system, 2 for other permanently mounted disks for
    data, and o (no check) for all others. man mount will tell you about possible
    options.'
