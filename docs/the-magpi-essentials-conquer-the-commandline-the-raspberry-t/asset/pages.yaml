  md: '# [ CONQUER THE COMMAND LINE ]


    # [ READ THE MANUAL ]


    Help is included, with manual pages that can be overwhelming. Use them to check
    out some extras the switches like us. To read the is man.


    t''s not a throwback to the past, but a quick and powerful way of getting your
    Raspberry Pi to do what you want, without all RSI-inducing menu chasing and icon
    clicking. The command-line interface was a great step up from manually toggling
    in your instructions in octal (base-8), switches on the front of the machine!
    Graphical user interfaces (GUIs) brought friendly metaphor to the computer, losing
    some power and expressiveness. With the Raspberry Pi, you can get the best of
    both worlds by reading through this guide, you''ll soon be as comfortable at the
    command prompt as you are at your desktop.


    Unlike some earlier versions of Raspian, Stretch boots to a GUI, although you
    can change this behaviour in the settings. The command-line environment is still
    there: hold ALT+CTRL keys and press F1 (the first key on the keyboard), and you''ll
    arrive at a ''virtual console''. Press ALT+F2 to get back to F6 and you''ll find
    five further consoles waiting for you to log in.


    You can drop into these any time you like, but for now press ALT+F7 and you''ll
    be back in mouse and menu land. The command line is also available through a program
    called a terminal emulator (often referred to as a term or term). You''ll also
    find people referring to the shell, or Bash. Don''t worry about that for, just
    click the icon at top of the screen that looks like a television screen,


    ![](img/db18fe165e1f1a64ee0c5d815560917d_6_0.png)


    The command line is only a click away. It is called Terminal and you can find
    it under Accessories in the menu


    Commands are terse, but once learned, they''re a quick way of navigating and reading
    your files and folders


