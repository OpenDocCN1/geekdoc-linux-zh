- pgno: 54
  md: '# Disk image


    Having downloaded and unzipped microSD card for Raspbian, you cannot copy it across
    to a second microSD card (connected to the Pi via a USB card reader) with regular
    cp, which would simply put a copy of it as a file on the card. We need something
    to replace the SD card''s file system with the file system and contents that exist
    inside the Raspbian disk image, byte-for-byte, and for which we can use a little
    built-in utility dd.


    dd converts and copies files - any files, even special devices like /dev/zero
    or /dev/random (you can make a full file of zeroes or random noise) - precisely
    copying blocks of bytes. To copy our Raspbian image,


    > Be very careful that the destination matches the correct disk


    We will need to mount the secondary microSD card we''ve plugged in via a USB card
    reader. Use sudo fdisk -l both before and after plugging in the card (you can
    also use df to see what''s mounted) to see attached devices. If, say, a /dev/sdb
    appears, with the size equal to the SD card, thenmount /dev/sdb1. Now copy the
    disk image:


    ```

    sudo dd if=~/Downloads/2018-11-13-raspbian-stretch-lite.img=/dev/sdb bs=1M

    ```


    Development of Raspbian''s ancestor UNIX was started in 1969, so we''ve covered
    a few utilities with a long heritage in this book, but that if= in place of the
    usual dashes for command-line options stretching back to the early 1960s, and
    IBM''s Data Definition (DD) statement from the OS/360 Job Control Language (JCL).


    Be very careful that the destination matches the correct disk, or you will lose
    the contents of another storage device! The bs=1M is a block size default; 4M
    would be another option. Now put the card in another Pi and go have fun!'
  merge: -1
  img_proc: true
