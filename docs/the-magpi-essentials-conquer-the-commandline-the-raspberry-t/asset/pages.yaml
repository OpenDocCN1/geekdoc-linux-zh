    Using the value @reboot, we can easily run our scripts on startup, without missing
    about system startup scripts. There are times when a full system startup script
    will be more appropriate, but for quickly getting something tested, put the script
    into crontab.


    There are two things that may catch you out. First, you might be running scripts
    out of a directory that you have in $PATH, which defines where Bash looks for
    commands. As $PATH is only set once you log in and your personalised .bashrc file
    is read, scripts from


