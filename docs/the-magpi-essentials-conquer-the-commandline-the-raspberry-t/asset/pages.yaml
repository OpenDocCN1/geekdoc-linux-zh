    interface eth0

    static ip_address=192.168.0.2/24

    static routers=192.168.0.1

    static domain_name_servers=192.168.0.1 8.8.8.8


    interface wlan0

    static ip_address=192.168.0.2/24

    static routers=192.168.0.1

    static domain_name_servers=192.168.0.1 8.8.8.8


    Save the file with CTRL+O and then exit nano with CTRL+X.


    Your Raspberry Pi will now boot up with the IP address 192.168.0.2 every time,
    we didn''t use 192.168.0.1 as this is reserved for the router. You can course
    of use any address you like, but in the configuration above, the range must be
    between 192.168.0.2 and 192.168.0.255.

    Reboot with sudo shutdown -r now. Log in and type hostname -I. You should see
    the IP address you set in the eth0 or wlan0 entry (192.168.0.2).'
