  md: '# Appending


    If you want to add something to the end of a file without overwriting

    t contents, you need >>.


    ```

    echo "&e one more for luck!" ~/mylisting4.txt

    ```


    echo simply displays whatever is in the quote marks to stdout, the -e

    switch lets you use in special characters, \n e for newline (see below).

    You can look at the last few lines of a file with tail ~/mylisting4.txt.

    < will link a program''s input stream to the contents of a file or stream.

    An unordered list to work on, and sort it:


    ```

    echo -e "aardvarknplatypus\njellyfish\naaardvark \

    list1

    sort < list1

    ```


    You can also combine < and :


    ```

    head -n 2 < list1 < list2

    ```


    ...will read from list1, passing it to head to take the first two lines,

    then putting these in a file list2. And in a pipe:


    ```

    sort < list1 | uniq > list3

    ```


    Lastly, let''s say stderr stream: it has file descriptor 2 (don''t

    worry about much this, and 2> sends the error messages to any file

    you choose:


    ```

    cat list1 list2 list3

    list42 2>errors.txt

    ```


