  md: "# CONQUER THE COMMAND LINE\n\nRaspbian takes care of automatically connecting\
    \ in most situations, but sometimes you need to override automatic configurations\
    \ to ensure a consistent network setting for your Raspberry Pi project: Raspbian\
    \ has the tools, and we'll show you the essentials you need to stay connected.\n\
    \nPlug an Ethernet cable from your ADSL router / modem to your Raspberry Pi (or\
    \ connect via wireless LAN) and, automatically, Raspbian knows where it is on\
    \ the network, and can talk to the outside world.\n\nAll of this is thanks to\
    \ DHCP – Dynamic Host Configuration Protocol – provides network configuration\
    \ for every device connected into a network. Typically, this comes in the form\
    \ of an IPv4 (Internet Protocol version 4) address, a pair of four numbers separated\
    \ by a period. For example: 192.168.0.37\n\nThe first sets of numbers, 192.168,\
    \ mark the start of a private range. These are the numbers for all devices in\
    \ your house, ranging from 192.168.0.0 to 192.168.255.255.\n\nCheck your Raspberry\
    \ Pi's current connection with the ifconfig command. This should show, amongst\
    \ others, a line like inet 192.168.0.37 (with your own numbers). This will be\
    \ the effect\n\n![](img/db18fe165e1f1a64ee0c5d815560917d_36_0.png)\n\n```\npi@raspberrypi:~$\
    \ ifconfig\nlo:     LOOPBACK,UP,RUNNING,DEFAULT,mtu=65536\n       inet 127.0.0.1\
    \  netmask 255.255.255.0\n\neth0:     BROADCAST,MULTICAST,UP,LOWER,mtu=1500\n\
    \       inet 192.168.0.37  netmask 255.255.255.0\n       ether 00:25:2a:15:36:01\
    \  txlen=1500  ethernet\n       RX packets = 1024  dropped 0  errors 0  frame\
    \ 0\n       TX packets = 988  dropped 0  overruns 0  collisions 0\n```\n\nThe\
    \ ifconfig command tells you information about your Raspberry Pi's network address\n\
    \n```\npi@raspberrypi:~$ route\nIP routing table\nDestination     Gateway    \
    \     Gens   Flags  Metric    Ref Interface\n0.0.0.0         192.168.0.1     \
    \ 0  UG    100     0         eth0\n192.168.0.0     0.0.0.0          U     0  \
    \       0         eth0\n```\n\n[ Predictable Networking ] 37"
