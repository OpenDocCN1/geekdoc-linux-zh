- pgno: 52
  md: 'Here, jessie is a Debian (and Raspbian) release: all Debian has been named
    after characters in the Toy Story series of films since 1996 (former Debian project
    leader Bruce Perens) was involved in the early development of Debian while working
    at Pixar. Stretch followed Jessie in June 2017.


    Most software is in the main repository, which can be freely copied or mirrored
    anywhere. Other components, non-free, allow repositories to contain software that
    may not be free to pass on, keeping it separate from Raspbian''s FOSS repository.


    # wget & curl


    Having added our repository source in a file sources.list, we need to get the
    key for it and use apt-key to install it. Packages authenticated using keys apt-key
    will be considered trusted.


    ```

    wget -0 -q http://apt.pi-top.com/apt.pi-top.com. gpg.key | sudo apt-key add -

    ```


    Wget downloads from the URL given. The -0 switch directs the download to stdout,
    from where it pipes to apt-key to read its input from the stdin stream (the trailing
    dash tells apt-key to read its output from wget). After any change to the sources.list
    directory, you should run:


    ```

    sudo apt-get update

    ```


    This updates Raspbian''s knowledge of what''s available to install from pi-top''s
    packages - for a full list, enter:


    ```

    grep ^Package /var/lib/apt/apt.pi-top.com raspbian_dists_jessie_main_binary-armhf_Packages

    ```


    To install one, for example, sudo apt-get install 3d-slash.


    Wget is a simple but robust download tool, with a powerful recursive feature that
    helps fetch websites, but it does have many security risks, so be careful when
    to fetch scripts. An alternative is curl, a file transfer tool that works with
    many protocols and can be used for simple


    ![](img/db18fe165e1f1a64ee0c5d815560917d_52_0.png)


    > [ VI IMPROVED ]

    If you really want to get grips with vim, you''ll need to sudo apt-get install
    vim - the vim package already in Raspbian is very limited.


    [ CONQUER THE COMMAND LINE ]'
