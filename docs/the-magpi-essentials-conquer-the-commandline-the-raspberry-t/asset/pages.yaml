  md: 'It''s called a symbolic link because it works by linking to the name of the
    target file itself. Create a hard link:


    ```

    sudo ln /etc/bluetooth/main.conf mybluetooth.conf

    ```


    ...and you have two names (locations) for the same file – sounds like the same
    thing? Not exactly: if you delete the original file in the first example, you
    can replace it with a new file of the same name, but different contents, and the
    symbolic link will point to the new file. Remove the original file in the hard
    link case, and the link still points to the data.


    # Location, location


    The startup scripts – whether init.d or systemd – are generally daemons, processes
    you want running all the time, like web servers and databases. There are plenty
    of programs which do housekeeping that need to be run periodically – hourly, daily,
    weekly. For this purpose, the cron utility is ideal for scheduling the running
    of such programs and tasks. Cron searches its configuration directories and runs
    through its scripts it finds – have a look at the different folders in /etc with
    names beginning with `cron`.


    The easiest way to get where things like this is not installed on your system
    is to search locate – which is not installed by default on Rasp. Use sudo apt-get
    install locate, then locate cron – will find every file or directory with its
    name or as part of its name.


    The locate tool maintains a database of every file on the system, which is updated
    daily by cron. If you''ve made a lot of changes, or want to find out some software
    you''ve just installed has its config file, get cron to update its database with
    sudo updatedb.


    The built-in alternative is find, a powerful utility that enables you to search
    particular directories – or the file system – by name or fragment, size of file,
    how long they were modified, or whether they''re bigger than enough – to deserve
    a whole chapter of its own. Because it searches the file system, rather than a
    cached listing, which lasts longer than a date, but is always up to date, and
    has search options not found in locate (see the ‘RegExp’ box). To replicate locate
    cron command with the find tool:


    > The find can search by regular expressions, as well as (part) name. They''re
    a whole book in themselves, but worth investigating once you''ve got command-line
    basics under your belt, as regex can be used with many commands'
