    [ PROBLEMS ]

    Fine-grained permissions make for greater security can trip you up. Typing sudo
    in front of a command that doesn''t work is both a diagnosis and a quick workaround
    of a permissions problem.


    # Octal version


    Those numbers are an octal representation of user, group, and others'' permissions:
    in this case, each is represented by 4, by 2, and execute by 1, all added together.
    So we have 75 for read+execute for user, and 5 for read+execute for group and
    all other users. ls -1 and you''ll see back to -rwxr-xr-x.


    You can use chown to change who owns a file and chgrp which group it belongs to.
    Make a new file then sudo chown root myfile.txt – now trying it and you''ll find
    that while you can read the file, you can no longer write to it. You can also
    make a file that you can write to not read!


