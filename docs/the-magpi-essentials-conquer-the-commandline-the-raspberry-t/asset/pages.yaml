  md: '# The MagPi ESSENTIALS


    # [ CHAPTER NINE ] REMOTE PI


    Learn how to access the Raspberry Pi from remote PCs and devices with Secure Shell
    (SSH)'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# # CONQUER THE COMMAND LINE


    t''s great that the Raspberry Pi is so portable, but sometimes you may want to
    use it without taking it with you. Here, the Pi''s default Raspian OS is a real
    strength, as UNIX-like operating systems have been used this way for over 40 years.


    Over time, as the internet has given the opportunity for malicious users to connect
    to computers, old standards like Telnet and login have been replaced by Secure
    Shell (SSH), based on public-key cryptography. Once set up, secure connections
    are simple, and open to scripted, automatic connection for your projects. You''re
    advised to change your Pi''s login password with password – before using SSH.


    If the SSH is not enabled by default on your version of Raspian, sudo raspi-config
    and go to the advanced settings to enable SSH. Check the IP address assigned to
    the Pi with ifconfig (note the ''inet addr'' for the etho or wlan interface).
    Now you can try connecting from another computer on your network.


    # ## Connecting with SSH


    From a Mac or GNU/Linux computer, use ssh from a terminal to connect to the Pi.
    Assuming a default setup, ifconfig revealing an IP address of 192.168.0.2, connect
    with ssh@192.168.0.2 and enter your password. You can use the OpenSSH client on
    Windows PCs; for earlier PCs, install an SSH client like PuTTY (magpi.co/ulyfk),
    which also works with SCP, Telnet, and Rlogin, and connect to a serial port. Android
    users can try the ConnectBot client.


    ![](img/db18fe165e1f1a64ee0c5d815560917d_46_0.png)


    +   - You can test the Pi if SSH is running, and start the service from the command
    line – may service /etc/init.d/ and /etc/init.py if you''re curious about other
    services


    +   - The Raspberry Pi install shares its image keys, with everyone who has a
    copy. Generate your own, and keys for the user account, for secure access


    Remote Pi MagPi'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'You should now be at the command-line interface of your Pi. If you got any
    sort of error, check from the Pi that SSH is really up and running by entering
    ssh@localhost on the Pi itself. If that works, SSH is up and and running on the
    Pi, so a closer look at network settings at both ends.


    # Hello, World


    Now we can access the Pi on the local network, it''s time to share with the world.
    Step one, for security reasons, change the PermitRootLogin yes in /etc/ssh/sshd_config
    to read: PermitRootLogin no using sudo nano. After making changes to the SSH server''s
    configuration, you must restart the service for them to take effect, or at least
    reload the configuration file: sudo service ssh reload. There''s also a file in
    /etc/ssh/sshd_config, which is for the SSH server, the d in sshd_config is short
    for ''daemon'', the Unix term for a service which runs constantly in the background.


    You can also change port 22 to any unlikely number, but be sure to check it still
    works. You''ll need to begin ssh -p 12123 (or whatever you have chosen) to tell
    your Pi you''re not using the default port 22.


    To reach your Pi from anywhere on the internet, you will need an IP address, which
    will connect you to your board even though it''s behind an ADSL router. Of course,
    if your Pi is in a data centre, with its own public IP address, you don''t need
    anywhere.


    There are numerous services as DuckDNS providing free-of-charge DNS (DDNS), to
    provide a constant IP address to the change one allocated to your Pi. However,
    the largest of them, DynDNS has ended its service, which provides a useful reminder
    that you cannot assume a service will be free forever.


    There are several steps to configuring a DDNS setup, no matter which service and
    software you choose. Some are detailed at raspberrypi.org forums, for there are
    a good guide to ddclient at samhomebies.co


    Otherwise, if your broadband router can handle both port forwarding and dynamic
    DNS, you can set it to point to port 22 (or chosen alternate port) on the Pi.
    You may even find your ISP offers static IP addresses.


    # Bye bye FTP


    File Transfer Protocol (FTP) was not designed for security: data, and passwords,
    are transmitted unencrypted. The Secure Copy


    ![](img/db18fe165e1f1a64ee0c5d815560917d_47_0.png)'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'Program (SCP), which runs over SSH, is best for transferring files. The syntax
    of the command mimics the command-line cp program:


    ```

    scp pi@192.168.0.2:/home/pi/testfile1

    ```


    Here''re transferring a file from the Pi, across a local network, to the current
    location (the dot shortcut). Note that you can use wildcards for groups of similarly
    named files, and can recursively copy directories and their contents with the
    -r switch after scp.


    # A secure key


    If you''re trying this on something other than Raspian, you may not have the SSH
    server installed. It''s often found in a package openssh-server. With Raspian,
    you have a pair of keys (public and private) in /etc/ssh/. Unfortunately, they''ll
    be the same as those everyone uses with a copy of the Raspian image that you downloaded.
    First, removing the existing keys:


    ```

    sudo rm /etc/ssh/ssh_host_*

    ```


    Alternatively, you move them somewhere out of the way. Regenerate the system-wide
    keys with:


    ```

    sudo dpkg-reconfigure openssh-server

    ```


    For keys personal to you as a user, ssh-keygen -t rsa -c "comment", where "comment"
    is anything you want to identify the key with: name, email, or machine and project,
    for example. You''ll be asked for a passphrase to secure the key – if you press
    ENTER, no passphrase, which makes life easier when making scripted (automated)
    connections, but removes an extra layer of security. You can create keys from
    any computer with the SSH package, and move the public key to the Pi, but we''ll
    work on the assumption that the Pi is the only UNIX-like computer, and we''ll
    be generating the keys.


    If you accept the defaults, your personal keys will now be in ~/.ssh with the
    correct permissions. By default, ssh looks in ~/.ssh/authorized_keys for public
    keys, so we need to copy the'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# The MagPi ESSENTIALS


    contents of id_rsa.pub to there. The following command will work even if you already
    have an authorized_keys with contents (make sure you use >> symbols with no gap
    between them):


    ```

    cd ~/.ssh && cat id_rsa.pub >>

    authorized_keys

    ```


    Using SCP, copy the private key to ~/.ssh on your laptop, or wherever you will
    access the Pi from, if it''s as to the case of sticking with passwords, replace
    ''raspberry'' with something stronger.


    Once you connect SSH without passwords, edit /etc/ssh/sshd_config to include PassAuthentication
    no. If you are using your WORKGROUP name to the default settings


    # Shared drive


    You may be using a service like Dropbox to share files between machines. There
    is no need to do this on a local network, as the Samba networking protocol on
    the Pi lets Windows PC access it as a shared drive (Fig 1, page 48). Samba is
    already installed in recent versions of Raspberry, or you can install it using:


    ```

    sudo apt-get install samba-common-bin

    ```


    Edit /etc/samba/smb.conf with a WORKGROUP value (for Windows XP and earlier, try
    workgroup = WORKGROUP) and/or Home (For Windows 7 and above). Ensure that Samba
    knows pi is a network user:


    ```

    sudo smbpasswd -a pi

    ```


    Then restart with:


    ```

    sudo service samba restart

    ```


    The Pi should now show up in Windows Explorer under Network. You can fine-tune
    smb.conf for what''s shared (including printers), and permissions.


    > LOST KEYS?

    nThe private key of your key pair should be kept secret-but safe too. Keep a backup
    of the private key in a memory card in a safe-place.


