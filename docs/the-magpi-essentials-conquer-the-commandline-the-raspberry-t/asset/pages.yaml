- pgno: 58
  md: 'systemd resolves the dependencies until it reaches that target, avoiding any
    fixed startup sequence along the way.

    Files are found under /etc/systemd/system and there''s a lot to learn, but Raspian
    now starts far more quickly, at least as we''ve created extra time for all that
    learning. The one thing to remember for any user is systemd and its service manager
    are controlled with the systemctl command.


    ```

    sudo systemctl restart ssh

    ```


    ...will restart ssh – something you''ll need to do if you change the port it listens
    on, for example. For compatibility, as well as /etc/init.d scripts to start and
    stop services, the system of service commands that worked on older versions of
    Raspian, such as


    ```

    sudo service apache2 reload

    ```


    ...still works (here we ask a running Apache2 server to reread its configuration
    files).

    Under /etc/systemd/system/multi-user.target you will find files like cron.service
    which, when examined closely with ls -1, you''ll see links to files of the same
    name in /lib/systemd/system (other GNU/Linux distributions may place the files
    under /usr/lib).

    Don''t worry if what''s inside these files looks confusing; there''s a logic to
    them which their conditional dependencies, but you can safely forget them until
    you get some software working automatically on every system for your Pi project.
    Even then, we''ll show you another way with crontab – otherwise you''ll need to
    be aware of the following, as those links aren''t created manually:


    ```

    sudo systemctl enable postgresql.service

    ```


    ...will create the link, and means PostgreSQL will be enabled upon startup. To
    control the service before the next restart:


    ```

    sudo systemctl daemon-reload

    ```


    ...will make systemd aware of the changes.


    > WHD / WHERE /

    Although run levels are no longer particularly meaningful under system, you can
    still check which run level you are in with


    # [ CONQUER THE COMMAND LINE ]'
