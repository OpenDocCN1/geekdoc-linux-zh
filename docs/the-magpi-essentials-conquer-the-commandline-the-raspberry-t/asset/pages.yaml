- pgno: 66
  md: '# A safe home


    Often, using tar to back up /home/pi – with cd /home, then tar on the pi folder
    – will be all you need, but if you have data across directories, from /etc /var/www,,
    it''s simplest to back up the entire microSD card. We looked at copying a new
    Raspian image onto a card in chapter 10, backing up your disk is a image of that
    process, which you can do on the Pi, with a USB card reader – with one important
    caveat.


    You''ll be creating a file as big as the entire card – onto a Pi with a lot less
    space to spare. The solution is to compress the image file as it is created, which
    for a Pi with a modest amount of data on it, will result in an image of around
    2.5 GB. Look at chapter 10 for how to be sure the USB card reader – for a card
    plugged in /dev/sdb, and unmounted:


    ```

    dd bs=4M if=/dev/sdb | gzip > back-raspbian.img.gz

    ```


    Open another Terminal and monitor your disappearing disk space with the df – if
    you don''t think it will fit, the dd operation with the usual CTRL+C, then rm
    the image file that you have partially created, and go and perform the backup
    on a computer with more disk space – or with a drive mounted, which you copy the
    archive to directly. Turning the backup into a usable microSD for the Pi means
    piping the the other way, from gzip to:


    ```

