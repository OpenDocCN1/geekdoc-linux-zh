    Secondly, systemd''s parallel services also mean that some services, such as the
    network, as well as environment variables, may not be ready when you @reboot commands
    are called. If you have problems, try giving a short pause first. It''s ten seconds
    in this example crontab, but you could use the smallest time that consistently
    works on testing:


    > @reboot sleep 10; /usr/bin/python3 /home/pi/Documents/Python_Projects/hello_gpio.py


    One of the scripts that you''ll see called by cron, is to run anacron, designed
    to periodically run on machines that were not always switched on – so it is very
    useful for laptops, too – with tasks specified, to run after so many days have
    passed since they ran. You can also use the automation of crontab or anacron to
    run your own backup scripts, so we''ll discuss backup options in the next chapter.


