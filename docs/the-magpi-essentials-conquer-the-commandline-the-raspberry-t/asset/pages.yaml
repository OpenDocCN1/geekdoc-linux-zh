- pgno: 64
  md: '# CONQUER THE COMMAND LINE


    Perhaps you''ve got backups running automatically on your main computer, or perhaps
    you just back up what''s important now and then - it''s OK, we''re not here to
    judge. But we will say that anything you don''t backed up, you don''t have. Computers
    break. Hard disks and SSDs break. Accidents happen. The unexpected is somewhat
    inevitable.


    IT professionals prepare as if they could lose everything at one moment, at least
    the best do. That might sound like a tall order for a small single-board computer
    you bought at a disposable price to use in a hobby project, but your data is the
    most important thing on it, and good backups are a useful discipline to take elsewhere.
    Fortunately, the command line can actually make this easier, we''ll show you some
    of your best options for (relatively) painless backups.


    Simplest of all is to copy the data and move it elsewhere. It is labour-intensive,
    compared to automatic solutions, but for only-very-occasional backups it''s certainly
    better than nothing, so we will not ignore this.


    Whether you''re copying to disk, or moving the backup to another machine, it''s
    best to make it as small as practically possible. The zip compression format may
    not compress as much as some specialist UNIX choices, but it does mean that other
    users should be able to open the file(s) with their standard compression software.
    You could go with LZMA or bzip2 compression (from tar, -J or -j, respectively)
    – both more widely installed than they use for better compression to


    ![](img/db18fe165e1f1a64ee0c5d815560917d_64_0.png)


    ```

    bash

    $ radgeberry:~/bin bash

    $ File Edit Tabs Help

    $ radgeberry:~$ ls -l bier

    $ radgeberry:~$ ls -l bier/test.txt

    $ radgeberry:~$ ls -l ~/ test.txt

    $ radgeberry:~$ gzip -c ~/ test.txt

    $ radgeberry:~$ ls -al pi. 7777 02:59 test.txt


    export PATH="PATH:$HOME/bin"

    ```


    By putting commands in .sh file and making it executable, you create your own
    scripts


    Making a ~/bin folder and adding it to the PATH directory in ~/bashrc means you''ll
    be able to run your scripts by name


    Save it Now! | MagPI 65'
