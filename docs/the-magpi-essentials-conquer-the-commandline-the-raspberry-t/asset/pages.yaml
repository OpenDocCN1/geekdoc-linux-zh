- pgno: 56
  md: '# # CONQUER THE COMMAND LINE


    ver the last few years, every major GNU/Linux distribution – Raspian included
    – has changed the way that it starts up. This means that much of the older literature
    on bookshelves and websites, dealing with where to put files in rc.local to get
    them automatically at startup, is no longer correct – unless you''ve yet to upgrade
    from Raspian Wheeezy.


    One thing remains the same: although the first kernel starts is not /sbin/init,
    but /lib/systemd/systemd (still with a PID of 1), it is still the parent kernel
    of everything that happens in user space once the Linux kernel has finished initialising
    devices and drivers, and mounted the file system.


    init gets everything started, and usually ends with the prompt inviting you to
    log in to your Pi. Recent versions of Raspian hide the messages that this startup
    process generates, but you can see them by typing dmesg; they are also stored
    in /var/log/kern.log


    Startup – init – the start of user space; this is the place you can put your own
    programs to affect how the Raspian Pi runs, without having to modify the code
    of your Linux kernel! Traditionally, GNU/Linux distributions implemented a version
