    # # Ping!


    Ping is the most basic tool in the network testing armour, but one which is often
    called upon. It sends an ICMP (Internet Control Message Protocol) ECHO_REQUEST
    to a device on your network. ICMP is built into every connected device and used
    for diagnostics and error messages: a ping will produce a reply from the pinged
    machine, which tells you it is on, and connected, and that the network is working
    between you and. Information about packets lost, and time taken, also helps with
    fault diagnosis.


    A successful ping localhost for the Raspberry Pi tells you not just that the loopback
    interface is working, but that resolves to 127.0.0.1, the local lookup address.
    Name resolution is the cause of many complex problems – ''Domain Name Servers''
    box. Now the Pi from another machine on your local network ping 192.168.0.2 (Fig
    2) – you''ll need to use the static IPv4 address you set, rather than ours, of
    course. If you''re doing this from a Windows machine, ping defaults to five attempts;
    from another UNIX machine (another Pi, a Mac, or Ubuntu or other GNU/Linux), it
    will carry on until you stop it with CTRL+C, unless you set a number of ECHO_REQUEST
    sends like so:


    ```

    ping -c 5 raspberry.org

    ```


    # # IPv6


    The four-digit IP address we use (like 192.168.0.2) is IPv4. A newer standard,
    IPv6, is becoming more common. These are longer 128-bit addresses represented
    in hexadecimal (for example, fd531:42f8:ca5:dae2::1). Look at the example code
    in dhcpcd.conf for setting up a static address with IPv6.


    # # Free / public DNS


    As well as DNS providers, some of those listed at FreeDNS.com offer public DNS
    servers. For a wider listing of alternatives to Google''s DNS servers, have a
    search on Google.'
