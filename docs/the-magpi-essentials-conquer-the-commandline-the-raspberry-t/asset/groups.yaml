    如果你的 Raspberrybian 版本没有 `rsync`，只需一个 `apt-get` 即可安装。通常情况下，`rsync` 使用 SSH 进行传输，但你可以设置一个运行
    `rsync` 守护进程的服务器，并通过 TCP 直接连接 `rsync://`（默认端口为 873）。在这种情况下，设置 `RSYNC_PASSWORD`
    环境变量或使用 `--password-file` 选项。


    虽然 `rsync` 不是 Bash 内置命令，但我们在这里重点介绍它，它是用户在考虑是否简单地使用内置命令时，面临的一系列命令行工具选择之一。


    > [ 为什么要远程备份？ ]


    > 除了能够为多台机器集中备份外，远程备份还能保护你免受 Pi 所在地发生的意外灾难（如火灾或洪水）。相当好用吧？是的，但这并不能阻止你为房子投保。


    ## MagPi 基础知识


    我们脚本中的日期戳（datestamp）意味着我们在运行它时，不会产生一个同名的备份。


    ![](img/db18fe165e1f1a64ee0c5d815560917d_69_0.png)


    此外，还有可能使用版本控制系统（如 `git`）来同时进行备份和跟踪重要文件的更改。


    ## 自己编写脚本！


    但让我们回到更简单的命令。我们从早期就看到，通过链接几个命令，Bash 可以变得多么强大，另一种将命令组合的方法是将它们封装成一个脚本——一个简单压缩少量
    Bash 命令的短程序，被称为 shell 脚本（shell script）。看看这段代码——尝试在你最喜欢的文本编辑器中输入它，针对你网络备份服务器的 IP
    地址和备份文件夹位置进行调整（或者将 `scp` 行改为 `cp` 到插入的备份驱动器），并将其保存为 `test.sh`。


    ```

    #!/bin/sh

    cd /home/pi

    tar czf mydocsbackup.tgz Documents

    scp mydocsbackup.tgz pi@192.168.0.207:/home/pi/bak/

    ```


    ## 征服命令行


    然后通过以下方法让脚本可执行：


    ```

    chmod +x test.sh

    ```


    ...然后用 `./test.sh` 运行它——如果有任何问题，检查名称、网络地址，以及你是否执行了 `ssh-config` 步骤？


    现在我们有了一个保存文件夹并将其远程复制的脚本，你注意到任何潜在问题了吗？每次运行它，它都会覆盖本地和远程的之前的 `mydocsbackup.tgz`。


    我们需要一种在备份名称上加上时间戳的方法：


    ```bash

    #!/bin/sh

    TODAY=$(date +"%F")

    cd /home/pi

    tar czf mydocsbackup-$TODAY. Documents

    scp mydocsbackup-$TODAY.tgz pi@192.168.0.207:/home/pi/bak/

    ```


    > HASH BANG（井号）

    > shebang，或 hash bang - 脚本开头的 `!` 是一个指示程序立即运行的指令——在这种情况下是让运行 `/bin/sh` 的解释器——并将脚本作为参数传递。


    我们现在定义了变量 `-TODAY` - 现在它是现在的日期，格式为 YYYY-MM-DD，我们现在通过 `$TODAY` 访问它（记得，在第 5 章更改提示符时，shell
    的永久设置变量是这样的）。你可以运行 `date +F --help` 将为你显示其他选项。


    现在你可以通过将脚本放在 `/usr/bin` 等地方（并起个更好的名字 `test.sh`），并使用 `cron` 定期运行它来实现自动化。Shell 往往会增长，总有改进的空间。你可能想备份多个目录，或者使用
    `echo` 让用户知道每个阶段的状况。你甚至可以让它具有交互性，让用户选择备份哪些目录。网上有很多脚本教程和很棒的书（参见 MagPi 评测）让你更进一步，Raspbian
    本身包含许多很棒的脚本，你可以通过示例进行学习。要查看如何组织一个拥有数千行代码且可维护的脚本，请查看 `/usr/bin/raspi-config`。宏大或微小的野心，不要害怕尝试：逐步构建，并在每次测试你的代码。


    ![](img/db18fe165e1f1a64ee0c5d815560917d_70_0.png)


    ...将你的代码粘贴到 `shellcode.net` 将给你提供宝贵的反馈——例如，建议脚本应该是：


    免密码

    使用你的密钥登录是一种便利——不仅是为了你的备份服务器，还为了你所控制的任何需要登录的机器。


    ```bash

    cd /home/pi || exit

    ```


    如果失败了——这通常是一个好主意，尽管在这个特定情况下并不重要。现在我们有了备份选项的选择，还剩下一个任务：安全地从磁盘中清除数据。对于任何处理他人数据的人，或只是保护自己的隐私和安全的人来说，这都是一个关注的问题。


    ## 彻底删除数据


    在我们开始删除磁盘之前，记住木工格言：“多量少切”。如果你不留神，很容易误删错误的磁盘或分区。在 `shred` 执行之前，运行磁盘上的其他操作（`mount`,
    `df`, `du`, `umount`）可以作为一种检查，确保你处理的是正确的分区。


    现在谈谈那些块。你可以用 `dd` 覆盖每一个比特的信息，要么用全 1，要么用完全随机的数据。即使如此，对于磁性磁盘，理论上仍可能恢复数据，多次覆盖是必要的——在你担心编写脚本来完成这一点之前，让我们介绍
    `shred`，这是一个正是执行此操作的工具，它根据你指定的命令行切换次数进行覆盖（默认为三次）：


    ```

    shred -vf -n 5 /dev/sdb

    ```


    `shred` 会安全地覆盖（可选删除）文件——整个磁盘驱动器。


    ## 我在哪里？


    如果你在处处使用 SSH 密钥，并在不同的机器之间穿梭，请记得自定义你的 Bash 提示符，以便你总是确定自己正在哪台机器上删除文件。


    添加 `-z` 选项将把 `shred` 使用的随机数据用零覆盖，使磁盘看起来是新的。`-u` 在安全覆盖后删除文件。`shred` 还可以安全地覆盖/或删除单个文件。


    '
