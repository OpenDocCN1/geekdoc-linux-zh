    `fat`（应该是 NTFS 或 ext2）是文件系统类型。这给出了设备名称（当然，你的不同）、挂载点、文件系统类型以及两个数字字段：第一个字段应该是 0（它与未使用的
    `dump` 备份程序有关），第二个字段是启动时的检查和修复顺序：1 代表根文件系统，2 代表其他永久挂载的数据磁盘，`o`（不检查）代表所有其他磁盘。


    # 命令行征服


    Pi 想要挂载的磁盘（或 flash 驱动器）通常以 `/dev/` 开头。Raspbian 知道要挂载哪些磁盘，是通过读取文件系统表（/etc/fstab），并且我们可以把
    `/dev/sda` 放在其中，但如果我们插入了两个驱动器，可能会选择错误的。幸运的是，磁盘（或者说磁盘分区）具有唯一的标签，称为 UUID，这些是在分区创建时分配的。使用
    `sudo blkid` 可以找到它们，它还会告诉你插入到 USB 接口的磁盘（或 flash 驱动器）标签，通常包含名称和型号，或者查看 `/dev/disk-by-uuid`。


    # 磁盘空间


    `df` 命令显示挂载驱动器的空间，比 `ls -l` 更易读。


