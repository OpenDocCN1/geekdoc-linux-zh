  mdcn: "\n\n# [第八章]\n停止进程\n\n尽管 Raspbian 几近完美，但问题仍会发生。在本章中，我们将学习到不需要重启树莓派：直接杀掉（kill）进程即可！\n\
    \n![](img/db18fe165e1f1a64ee0c5d815560917d_40_0.png)\n\n# MagPi 基础\n\n![](img/db18fe165e1f1a64ee0c5d815560917d_41_0.png)\n\
    \n在终端运行的程序可以发送到后台睡眠——在那里它们可以通过 `fg` 轻松地恢复\n\n关注你的进程，你还能看到是什么在占用你的 CPU 和内存资源\n\n\
    丢失了程序的“关闭按钮”？有时候，你正在运行的某个软件似乎并不打算停止：要么你找不到如何退出，要么它出了问题，并且对你的 `Q`、`CTRL+C` 或任何命令都没有响应。\n\
    \n不需要慌慌，不需要重启：只需识别进程并安静地杀死它。我们将展示在进程知识之外还可以做什么。\n\n# 进程\n\n使用 `ps` 命令查找树莓派上运行的许多进程。通常\
    \ `a` 和 `x` 选项组合会列出所有进程，而不仅仅是属于某个用户或附加到 `tty` 的进程。输入 `ps aux` 查看，然后尝试带上 `w` 或其他组合，`ww`\
    \ 会加宽输出以防被截断。在没有横杠的情况下，特定的字母 `a` 和 `x` 可以追溯到 20 世纪 70 年代 Unix 的版本。\n\n# 征服命令行\n\
    \nUnix 家族的不同分支（如 BSD、System V 以及 GNU/Linux）扩展了新选项和新缩写，因此 `ps ax` 可能会看到 `-e`（或\
    \ `-ef`）以长格式显示。`ps ax` 有各种表头，包括拥有进程的用户（USER）、进程 ID（PID）或父进程 ID。从 `1` 开始的是树莓派启动时用户空间的内核进程。PID\
    \ 是杀死进程最简单的方法。例如，要杀死 PID 为 3012 的程序，只需输入 `kill 3012`，以便在 `ps` 列表中快速找到它。\n\n# 顶部运行\n\
    \n> KEEP ON TOP\n在使用虚拟控制台时，保持它运行是值得的，如果有任何问题，你可以使用 `CTRL-ALT-FN` 快速查看——即使 GUI\
    \ 冻结了也是如此。\n\n```\nps ax | grep -i\n```\n\n`-i` 选项（忽略大小写）通常不是必要的，但程序文件名可能包含大写字母。你也可以通过名称使用\
    \ `killall` 来杀死程序：\n\n# 管道命令\n\n自然地，你可以管道 `ps ax` 并直接选择 PID：\n\n```\nps ax | grep\
    \ '[f]firefox' | awk '{print $2}'\n```\n\n我们在这里使用 `awk` 处理 `ps` 的输出来深入查看第二个字段：`[f]firefox`\
    \ 这种技巧可以防止 `grep` 进程本身出现在结果中；上面的 `grep` 进程本身以及 `(anything)` 任何内容。`ps` 的输出还显示了内存和\
    \ CPU 使用的百分比等有用信息，但查看这些实时变化更有用。为此，使用 `top`，它显示总 CPU 和内存使用情况，在格式的最后几中。\n\n 改进的\
    \ top：\n\n```bash\nsudo apt-get install htop\n```\n\n`htop` 可以水平和垂直滚动，并允许你执行命令（如使用\
    \ `k` 杀死）高亮显示的进程。当你完成时，在 `htop` 中退出按 `Q`。htop 还显示处理器的独立核心。\n\n# 后台作业\n\n在 shell\
    \ 中命令后加上 `(&)` 将程序放入后台——第一个数字是 shell 分配的作业号，第二个是我们正在处理的 PID。你可以使用作业控制来处理 shell\
    \ 中的进程。如果你想在后台启动其他任务（通过追加 `&`），然后使用 `fg` 将第一个带回前台。你可以通过 `CTRL+Z` 将正在运行的挂起到后台，除非指定了数字，否则它将带回最近挂起或后台的作业。注意，这些作业仅在\
    \ shell 内生效。输入 `jobs` 查看后台进程，作业列表中包含进程（PID）。\n\n![](img/db18fe165e1f1a64ee0c5d815560917d_43_0.png)\n\
