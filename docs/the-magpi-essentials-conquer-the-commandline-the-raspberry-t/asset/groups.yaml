    # CONQUER THE COMMAND LINE


    command. The path is the folder hierarchy: on a Windows computer, in a graphical
    file browser, it starts with ''My Computer''; on your Pi starts at /, pronounced
    ''root'' when used on its own as the root of your file system. Trying ls / - again
    when we get terseness, and names like ''bin'', which is short for binary, and
    is the directory where many programs are kept (enter ls /bin to shows hardware
    devices in the Pi). Try ls /home - see ''pi''? That''s you you are logged in as
    user pi. If you have changed your login name, or if you have created extra users,
    they''ll be listed there too: every user gets their home directory, yours is the
    /home/pi folder in which we found ourselves in earlier. Before, with MagPi, we
    used the relative path (the absolute path would be /home/pi/MagPi) because we''re
    already home. If you need to check your location, type pwd (present working directory).


    # Commands are not cryptic (at least unintentionally), but they are terse


    # There''s no place like ~


    For logged-in user, their home directory is abbreviated as ~ (the tilde character).
    Try ls ~ and you''ll see. There''s a lot not hidden from your home directory yet,
    but Raspian keeps a lot hidden from the casual glance: files and folders with
    a dot, as ''dot files'', contain configuration information for your system and
    programs. You don''t need to see these files normally, but when you do, just ls
    to show all of them with a command switch. You can do this with either the full
    switch -all, or the abbreviation -a like so: ls -a - Traversing the pathways of
    the directory hierarchy can be easier than clicking and around a directory tree,
    particularly with the shortcuts. Your ls showed you . and .. as the first two
    directories, these shortcuts represent the current and the parent directory respectively.
    Try listing the parent directory from /home/pi, entering ls .../ will show you
    layers up. If you want to list the hidden files without the . .. appearing (after
    all, they''re present in every directory, so you don''t need to be told), then
    the switch to use is -A.


    > [ LAZY COMPLETION

    nYou need to type all of ls. MagPi (for example) - after ls M, hit the TAB key
    and it will auto-complete. If you''ve more than one file beginning with M, they
    will be listed and you can type more letters and hit TAB.


    Don''t | MagPi'
