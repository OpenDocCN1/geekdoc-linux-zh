    # # CONQUER THE COMMAND LINE


    system that you don''t need to worry about, the devices that concern us start
    with /dev/ and have names like /dev/mmblk01 for partitions of the Pi''s SD card,
    and /dev/sda1 for plugged-in USB drives.


    Plug in a USB drive (a flash drive should work, but some hard drives may require
    a separate power supply). Like most computer desktops, Raspian automatically mounts
    the disks, (unless you boot to a virtual console) you''ll need to mount will show
    an entry beginning something like /dev/sda1 on media/pi/UNTITLED... and you can
    mount with sudo unmount /dev/sda1 (yes, that is mount without an ''n''). An error
    will result if the device is in use, so change directory and/or close apps using
    from the device. We can now mount it way we want.


    [ DISK & SPACE ] The command shows space on mounted drives: just type df and you''ll
    also get a list of connected drives, now more readable than mount -l, though lacking
    file type. It''s also quicker to type!


    # ## Finding the disk


    The /dev/sda refers to the first, or only, partition (a section of the hard drive
    that is started from other segments) from /dev/sda. The next device plugged in
    will be /dev/sda1. You can see what''s being assigned by running tail -f /var/log/messages,
    then plugging in the USB device. On other Linux systems, if /var/log/messages
    draws a blank,


    > An error will result if the device is in use, so change directory and/or close
    apps


    try /var/log/syslog. Stop the tail with CTRL+C. Another way of seeing connected
    devices that aren''t necessarily mounted is fdisk, a low-level tool used to divide
    disks into partitions, before creating file systems on those disks (the ''Format''
    box on page 35). Called with the list option, sudo fdisk -1, it performs no partition,
    but simply lists partitions on those disks connected to your Pi. It also gives
    file-system information, which you need in order to mount the disk. Lastly, you
    need a mount point (somewhere to place the device on the file-system hierarchy)
    with appropriate permissions. Create one with:


    ```

    sudo mkdir /media/usb

    sudo chmod 775 /media/usb

    ```


    ![](img/db18fe165e1f1a64ee0c5d815560917d_32_0.png)'
  - '[PAGE 33]


    # Fig Raspberry wants to mount plugged-in-disks, and take care of the details
    for you - note that the GUI tells you it''s Windows software the command line
    has information for you to control when the job is done in a particular way, telling
    you it''s NTFS file system


    ![](img/db18fe165e1f1a64ee0c5d815560917d_33_0.png)


    Mount the disk using sudo mount -t vfat /dev/sda1 /media/usb, where fat (NTFS
    or ext2) is the file-system type.


    # File-system table


    Raspbian knows which disks to mount at boot time by reading the file-system table
    (/etc/fstab), and we could put our /dev/sda in, but if we start with two drives
    plugged in, the wrong one may be selected. Fortunately, disks (or rather, disk
    partitions) have unique labels known as UUIDs allocated when the partition is
    created. Find them with sudo blkid, which also helpfully tells you the label,
    if that often contains the name and model of external drives, or look in /dev/disk-by-uuid.


    For an NTFS-formatted drive, use sudo nano /etc/fstab and add the following line
    to the end of the:


    ```

    /dev/disk/by-uuid/E4EE32B4EE327EBC /media/usb

    tfs defaults 0 0

    ```


    This gives the device name (yours different, of course), mount point, file-system
    type, and two numeric fields: the first of these should be zero (it relates to
    the unused dump backup program), while the second is the order of check and repair
    at boot: 1 for the root file system, 2 for other permanently mounted disks for
    data, and o (no check) for all others. man mount will tell you about possible
    options.'
