  - '[PAGE 11]


    # The command line tools to get text from different parts of a file, like skipping
    to the conclusion


    Create and name files and directories with keystrokes, rather than mouse-clicks
    and keystrokes


    > MORE INFO

    Many utilities have info pages, giving far more information than their man page.
    If you''re feeling brave, try nano for a comprehensive guide to nano.


    ![](img/db18fe165e1f1a64ee0c5d815560917d_11_0.png)


    ow that we can navigate folders and list files, it''s time to learn how to create,
    and alter both files. Once more, it''s not that the task is difficult, rather
    that the forms of the commands (particularly when editing) are unfamiliar, from
    an era before Common User Access (CUA) standards were created to ease switching
    between applications and operating systems.


    Stick with it: with just the first two chapters of this book under your belt,
    you''ll be able to do plenty of work at the command line, and start getting comfortable.


    # Creating a directory


    We''re going to dive straight into working with files and folders by creating
    a new directory. (see ''Instant applications'' box), and you''re in your home
    directory (`pwd` `cd ~` to get back there if necessary), type `mkdir tempfolder`
    and have a look with `ls`.


    `mkdir`, as you''ve probably guessed, creates a new directory or folder. Let''s
    use it to experiment with altering one of the Python games. Don''t worry: we''re
    not going to be programming Python, just making a small change by using illustration.
    `cd tempfolder` (use tab completion: `cd t` then hit the `TAB` key). In the following
    example, we''ll be copying some files to this directory.'
  - '[PAGE 12]


    First, make sure Python Games is installed – if not, click the top-left Raspberry
    Pi icon on the desktop, select Preferences, then Recommended Software, tick the
    box next to Python Games in the list, and then Apply to install it.

    We''ll copy over the files from the python_games directory:


    ```

    cp /usr/share/python_games/fourinarow.py

    cp /usr/share/python_games/4row_*

    ```


    # # Wildcard


    The . (dot) at the end of the commands refers to ‘just here’, which is where we
    want the files copied. Also, 4row* is read by the Pi as ‘every file being 4row-*
    – the * is known as a wildcard, and this represents any number of characters (including
    none); there are other wildcards, using ?, means any single character.

