    # find / -name ''*cron*''


    If you were looking for cron or crontab, but not anachron, you could search for
    ''cron*'' instead. There will be more output than you want, so pipe it through
    a pager, or perhaps a grep. Back to using cron – the easiest way is via crontab,
    which maintains a table where each row specifies a command, and how often it is
    to run.


    You edit the crontab file not directly, but using crontab -e, which calls up the
    default editor to it. To take an example from Michael Stutz''s Linux Cookbook
    (No Starch Press), add an entry in the form:


    ```

    45 05 * * 1-5 calendar | mail -s ''Your calendar''@emailaddress.com

    ```


    * grabs the output from the venerable UNIX program and emails it to you every
    morning. The first five crontab fields cover minute, hour, day of month, day of
    the week, and can be replaced with a single special value, like @daily or @hourly.
    While man crontab tells you a little about crontab, man 5 crontab is far more
    useful as it covers the layout of the file, with examples. Run man man for more
    on the number sections available with commands.


    Note that traditional command-line mail is not installed by default on the Pi,
    so if you wanted to follow the example, you would need to install a simpler mail
    – recommend ssmtp, and the Raspberry Pi forums contain plenty of tips on command-line
    mail, as it is used in all sorts of projects.


    # A fresh startup


    Using the value @reboot, we can easily run our scripts on startup, without missing
    about system startup scripts. There are times when a full system startup script
    will be more appropriate, but for quickly getting something tested, put the script
    into crontab.


    There are two things that may catch you out. First, you might be running scripts
    out of a directory that you have in $PATH, which defines where Bash looks for
    commands. As $PATH is only set once you log in and your personalised .bashrc file
    is read, scripts from


