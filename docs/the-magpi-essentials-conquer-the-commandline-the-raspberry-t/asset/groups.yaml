    # 征服命令行


    命令。路径是文件夹层次结构：在 Windows 计算机上，在图形文件浏览器中，它从“我的电脑”开始；在你的 Pi 上它从 `/` 开始，当单独作为文件系统的根使用时，读作“root”。当我们追求简洁时，再次尝试
    `ls /`，像 ''bin'' 这样的名字，它是 binary 的缩写，是存放许多程序的目录（输入 `ls /bin` 可以显示 Pi 中的硬件设备）。尝试
    `ls /home` —— 看到 ''pi'' 了吗？那是因为你正以用户 pi 的身份登录。如果你更改了登录名称，或者创建了额外的用户，他们也会列在那里：每个用户都有自己的家目录，你的目录就是
    `/home/pi` 文件夹，我们之前就在那里那里。之前在处理 `MagPi` 时，我们使用的是相对路径（绝对路径应该是 `/home/pi/MagPi`），因为我们已经在家里了。如果你需要检查自己的位置，输入
    `pwd`（当前工作目录）。


    # 命令并不是晦涩的（至少不是无意的），但它们很简洁


    # 没有哪里比 ~ 更像家


    对于已登录的用户，他们的家目录缩写为 `~`（波浪字符）。尝试 `ls ~` 你就会看到。你的家目录下还有很多东西没有隐藏，但 Raspian 对随意的扫视隐藏了很多内容：以点为开头的文件和文件夹（称为“隐藏文件”），包含了系统和程序的配置信息。你通常不需要看到这些文件，但当你需要看时，只需使用
    `ls` 命令配合开关即可显示所有它们。你可以使用完整开关 `-all` 或缩写 `-a`，如下：`ls -a`。遍历目录层次结构的路径可能比在目录树上点来去要容易，特别是使用快捷方式时。你的
    `ls` 显示了 `.` 和 `..` 作为前两个目录，这些快捷方式分别代表当前目录和父目录。尝试从 `/home/pi` 列出父目录，输入 `ls ../`
    将向你显示上一层。如果你想列出隐藏文件而不显示 `.` 和 `..`（毕竟它们存在每个目录中，所以你不需要被提醒），那么要使用的开关是 `-A`。


    > 懒人补全

    > 你需要输入 `ls` 的完整内容。例如 `MagPi` —— 在输入 `ls M` 后，按下 TAB 键它就会自动补全。如果你有多个以 M 开头的文件，它们会被列出来，你可以输入更多字母并按
    TAB。


    ![](img/db18fe165e1f1a64ee0c5d815560917d_9_0.png)


    在继续其他命令之前，让我们简单看看如何组合开关：`ls -1h ~`


    `-1` 给你更多关于文件和文件夹的信息，而 `-h` 将单位从字节更改为合适的 kB、MB 或 GB。我们稍后会详细查看 `-ls` 列出的一些额外选项，特别是在第二章和第三章中。


    # 是时候改变了


    已经看够了：让我们开始移动吧。`cd` 是 change directory（更改目录）的缩写，可以移动到系统中你想去的任何地方：尝试 `cd /var/log`
    并查看一眼 `ls(1)`。文件是日志，或者说是系统状态的消息，被保存供分析。这并不是你需要考虑的所有内容：树莓派是一个运行在数据中心和超级计算机上的操作系统版本，那里问题监控非常重要。然而，了解这些是有用的，特别是当你遇到问题且论坛上的某人要检查你的日志时。


    `cd ~` 会带你回到预期的位置。尝试一下，然后用 `pwd` 检查。现在尝试 `cd -`（那是连字符），`''-''` 是“我来到这里之前所在地”的快捷方式。现在我们已经到处看了一圈，可以开始对我们的文件进行操作了。


    好了，既然你可以把一个包含 78 个文件的列表放进一个小窗口，谁还需要图标呢？彩色字体表示


