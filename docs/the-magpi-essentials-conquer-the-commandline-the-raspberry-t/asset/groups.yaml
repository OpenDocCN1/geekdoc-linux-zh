    # The MagPi ESSENTIALS


    # [ CHAPTER THIRTEEN ]


    # EASY COMPILATION


    Here we look at how to install software and build it from the source code


    ## CONQUER THE COMMAND LINE


    Just paste the URI ending .git after git clone to the Terminal and you will have
    the latest source code.


    Install alien and you''ll be able to swap packages between Raspberry, Fedora,
    and other systems'' packages


    ![](img/db18fe165e1f1a64ee0c5d815560917d_74_0.png)


    It''s so easy to install most software on Raspberry – enough to have been packaged
    as a deb archive. Often, there''s some great code available you''d love to try,
    but it asks you to compile it – sometimes after first cloning it from GitHub.
    While not so straightforward as running an apt-get install command, there''s little
    to fear in stepping through the decades-old virtual of compiling software – and
    when errors occur, it''s often quite easy to get back on track. We''ll also look
    at installed scripts and Python packages, but first let''s find out what to do
    if a package is in the wrong format.


    Raspian isn''t the only distribution of GNU/Linux based upon Debian – distrowatch.com
    lists more than a hundred – and the ones you''re most likely to have heard of
    Linux Mint and Ubuntu. Ubuntu – the name derived from an Nguni Bantu term meaning
    ‘humanity towards others’ – is so popular that many projects, including ones not
    in the Debian and Raspberry repositories, maintain deb packages for each version
    released.


    Ubuntu also introduced the idea of Personal Package Archives (PPA) to the Debian
    family – special software repositories for uploading source packages to be built
    and published as an APT repository by Ubuntu''s Launchpad software like the official
    Ubuntu repository, but for unofficial software from outside. You won''t need to
    find these with Pi software, but if you''ve been inspired to try one of Raspberry''s
    relatives on your main PC, you''ll find plenty of instructions on in the Ubuntu
    community documentation.


    Compilation can look complicated, but most projects provide a well-crafted file
    for the process - a custom even providing hints


    ![](img/db18fe165e1f1a64ee0c5d815560917d_75_0.png)


    When you run apt-get, or apt-cache search to look for a package, apt quizzizes
    its local record of what packages are available to. The record of where it gets
    these packages from - the address of the repositories - is kept in the file /etc/apt/sources.list
    and in files /etc/apt/sources.list.d/ to which you can also add repositories by
    hand should a project you are interested in maintaining one.


    You can also edit sources.list (not advised) - editing menus of whezy to jessie
    is an (unsupported) way of upgrading without overwriting your SD card when Raspian
    updated. Meanwhile, plain old .deb files can be downloaded, and then installed
    with the command:


    ```

    sudo dpkg -i example.deb

    ```


    And any missing dependencies resolved with an:


    ```

    apt-get install -f

    ```


    There is another popular family of GNU/Linux distributions, based upon Red Hat,
    and including Fedora and CentOS. Fedora is available as an alternative to Raspian
    (on the Pi 2 or 3), should you wish to try it out. What we''re concerned with
    here is situations where you may need to install packages for one distribution,
    onto a system of the other type. Your friend here is Raspian''s alien package,
    which will convert software between .debs and packages in .rpm (Red Hat Package
    Management) format.


    ```

    alien some-package.rpm

    ```


    ...will convert from .rpm to .deb. You''re more likely – on the Pi at least, where
    RPM-only packages are rarer – to need to convert the other way:


    ```

    alien -r mysoftware.deb

    ```


    ## Friendly triad


    Before package managers, it was normal to compile your own software, obtaining
    source code – usually in the C or C++ languages – running it through the GCC compiler,
    before linking libraries, and installing to the correct place on your disk drive.


    Many of the headaches involved in the process are long gone as configure and make
    scripts do all of the hard work, checking dependencies are installed, then running
    the correct compiler flags for the platform, and even installing the main in the
    correct place.


    Although most of the software you''ll want to run will be available as deb to
