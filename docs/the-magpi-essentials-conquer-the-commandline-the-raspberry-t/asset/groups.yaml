    \ sudo mount /media/usb1（或你在 fstab 中设置的内容）来挂载所选设备。\n\n在连接了内部设备后，下一章我们将看到访问所有的\
    \ Pi，但是从全球任何连接互联网的地点进行远程访问。\n\n```\nsudo nano /etc/fstab\n# / / root ext4\n# /home\
    \ root ext4\n# /var root ext4\n\n# Filesystem Mounted on\n323728 2780624 143792\
    \ 95%\n303278 2780624 143792 95%\n219744 0 219744 0 %dev/\n5120 0 5120 0 /run/lock\n\
    5120 0 5120 0 /run/user\n\n# Filesystem Mounted on\n323728 2780624 143792 95%\n\
    303278 2780624 143792 95%\n219744 0 219744 0 %dev/\n5120 0 5120 0 /run/lock\n\
    5120 0 5120 0 /run/user\n```\n\n图 a 一旦我们将可移动式磁盘放入文件系统表 (/etc/fstab) 中 – mount\
    \ 命令将从那里读取整个磁盘以挂载你的磁盘，从而让你省去记忆细节的麻烦。\n\n> [ 格式 ] 复制磁盘镜像包括格式化磁盘的需求。如果你需要格式化新分区或将磁盘转换为\
    \ ext4，请查阅手册：man-mkfs 可查看单个文件系统类型，例如 man mkfs.ext4\n\n## 第七章\n可预测的网络连接\n\n在本章中，我们将为树莓派分配一个它自己的永久网络地址\n\
    \n## 征服命令行\n\nRaspbian 在大多数情况下会自动处理连接，但有时你需要覆盖自动配置，以确保你的树莓派项目具有一致的网络设置：Raspbian\
    \ 拥有这些工具，我们将向你展示保持连接所需的要素。\n\n从你的 ADSL 路由器/调制调器连接一个以太网线到树莓派（或通过无线局域网连接），Raspbian\
    \ 会自动知道自己在网络中的位置，以及如何与外部世界通信。这一切都归于 DHCP – 动态主机配置协议 – 它为连接到网络的每个设备提供网络配置。通常以 IPv4（互联网协议版本\
    \ 4）地址的形式出现，由点分隔的四个数字组成。例如：192.168.0.37。前两个数字 192.168 标记私有范围的开始。这些数字是你家里从 192.168.0.0\
    \ 到 192.168.255.255 的所有设备。使用 ifconfig 命令检查你树莓派的连接。这应该会显示类似 inet 192.168.0.37（你自己的数字）的行。这就是产生的效果。\n\
    \n```\npi@raspberrypi~$ ifconfig\nlo: LOOPBACK,UP,RUNNING,mtu=65536\n       inet\
    \ 127.0.0.1  netmask 255.255.0.0\n\neth0: BROADCAST,MULTICAST,UP,mtu=1500\n  \
    \     inet 192.168.0.37  netmask 255.255.255.0\n       RX packets = 1024 dropped\
    \ 0\n       TX packets = 988 dropped 0 overruns 0\n```\n\nifconfig 命令可以告诉你树莓派的网络地址。\n\
    \n```\npi@raspberrypi~$ route\nDestination     Gateway         Flags  Metric \
    \   Interface\n0.0.0.0         192.168.0.1      UG        100     eth0\n192.168.0.0\
    \     0.0.0.0          U         eth0\n```\n\n## 可预测的网络连接\n\n如果你通过以太网连接，或者在连接到无线局域网时在\
    \ wlan 部分，获取 IP 地址的更快方法是在命令行中输入 hostname -I。\n\n### 如何为树莓派设置静态 IP 地址\n\n通常当你将树莓派连接到局域网\
    \ (LAN) 时，它会自动分配一个 IP 地址。通常这个地址每次连接时都会变化。然而，你可能希望你的 Pi 每次启动都使用相同的 IP 地址。如果你正在创建一个小型自包含网络，或构建一个像机器人这样的独立项目，这将非常有用。操作方法如下编辑\
    \ /etc/dhcpcd.conf 文件（图 1）：在命令提示符输入 sudo nano /etc/dhcpcd.conf。滚动到脚本末尾并添加：\n\n\
    ```\nstatic ip_address=192.168.0.2/24\nstatic routers=192.168.0.1\nstatic domain_name_servers=192.168.0.1\
    \ 8.8.8\n\ninterface eth0\nstatic ip_address=192.168.0.2/24\nstatic routers=192.168.0.1\n\
    static domain_name_servers=192.168.0.1 8.8.8\n\ninterface wlan0\nstatic ip_address=192.168.0.2/24\n\
    static routers=192.168.0.1\nstatic domain_name_servers=192.168.0.1 8.8.8\n```\n\
    \n使用 CTRL+O 保存文件，然后使用 CTRL+X 退出 nano。\n\n启动后，你的树莓派现在每次都会使用 IP 地址 192.168.0.2 启动；我们没有使用\
    \ 192.168.0.1 是因为那是留给路由器的。你可以使用喜欢的任何地址，但在上面的配置中，范围必须在 192.168.0.2 到 192.168.0.255\
    \ 之间。\n\n使用 sudo shutdown -r 现在重启。登录并输入 hostname -I。你应该看到你在 eth0 或 wlan0 条目中设置的\
    \ IP 地址 (192.168.0.2)。\n\n通常你不希望电脑被设置为静态 IP 地址。你可以再次使用 sudo nano /etc/dhcpcd.conf\
    \ 将网络配置改回来。删除上一步中添加的所有行，然后保存文件。\n\n## Ping！\n\nPing 是网络工具中最基础的工具，但也是经常被使用的工具。它向你网络上的设备发送\
    \ ICMP (互联网控制消息协议) ECHO_REQUEST。ICMP 内置于每个连接的设备中并用于诊断：ping 会产生被 ping 机器的回复，告诉它已在线且网络运行正常。关于数据包丢失和耗时的信息有助于故障诊断。\n\
    \n树莓派成功 ping localhost 不仅告诉你是回环接口工作正常，还说明它解析到了 127.0.0.1（本地查找地址）。名称解析是许多复杂问题的原因——“域名服务器”框。现在从你网络上的另一台机器\
    \ ping Pi 的 192.168.0.2（图 2）——当然，你需要使用你设置的静态 IPv4 地址，而不是我们的。如果你从 Windows 机器执行此操作，ping\
    \ 默认尝试五次；从另一个 UNIX 机器（另一台 Pi、Mac 或 Ubuntu 等其他 GNU/Linux），它会一直运行直到你用 CTRL+C 停止它，除非像这样设置\
    \ ECHO_SOCKET 的发送次数：\n\n```\nping -c 5 raspberry.org\n```\n\n## IPv6\n\n我们使用的四位\
    \ IP 地址（如 192.168.0.2）是 IPv4。一种新标准 IPv6 变得越来越常见。这些是用十六进制表示的更长的 128 位地址（例如 fd531:42f8:ca5:dae2::1）。查看\
    \ dhcpcd.conf 中的示例代码以设置 IPv6 的静态地址。\n\n## 免费 / 公 DNS\n\n除了 DNS 提供商之外，FreeDNS.com\
    \ 列出的某些也提供公共 DNS 服务器。对于 Google DNS 服务器更广泛的替代方案，可以在 Google 上进行搜索。\n\n"
