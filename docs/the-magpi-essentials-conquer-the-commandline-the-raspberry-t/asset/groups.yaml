    So far so good, but there are possibilities to automate your backup process later
    in the chapter, or the interactive element – having to give a password – would
    be better avoided. As long as you can maintain security in some other way, of
    course.


    # Key to logins


    Back in when we set up our SSH server, we generated keys with ssh-keygen – these
    keys can be used to provide passwordless login. You can copy them to other machines
    manually, as we did earlier, but a handy shortcut is to use the command ssh-copy-id.


    ```

    ssh-copy-id pi@192.168.0.207

    ```


    If you have more than one key pair, use -i to specify .pub file you''re copying.
    -p allows you to specify an alternate port number – always good thing in an internet-connected
    server, but not so necessary on a local network. Now we''re all set for remote
    backups – if you do them regularly, you''ll lose a lot of disk space disrupting
    unchanging data.


    rsync lets you copy data in the same way as scp, but uses a delta-transfer algorithm,
    to only transfer the difference between the copies of the source on your disk,
    and the remote, saved version. This saves bandwidth used, and avoids cluttering
    your backup disk with near-identical versions of a file. It''s also handy if you''re
    paying a cloud provider for storage and data transfer.


    If your version of Raspberrybian doesn''t have rsync, it''s just an apt-get away.
    Typically, rsync uses SSH for transport, but you can set up a server running rsync
    daemon, and directly connect the rsync:// over TCP (defaults to 873). In this
    case, set RSYNC_PASSWORD environment variable or use the --password-file switch.


    While rsync is not a built-in Bash command, we are highlighting it here as part
    of the array of command-line utility choices that users face when considering
    whether or not to simply employ


    > [ WHY REMOTE? ]


    > As well able to centralise backups for more than one machine, a remote backup
    protects you from unexpected disasters such as fire or flood where the Pi is.
    Fairly handy? Yes, but it doesn''t stop you insuring your house.'
