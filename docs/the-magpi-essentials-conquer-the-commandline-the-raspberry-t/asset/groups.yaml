    sudo python setup.py install

    ```


    虽然 `gzip` 比 `zip` 更高效（甚至更高效的 `bzip2`），但如果你得到的是 `zip` 文件，那么需要的命令就是 `unzip`。


    ```

    unzip 2018-11-13-raspbian-stretch-lite.zip

    ```


    ## 磁盘镜像


    下载并解压 Raspbian microSD 卡后，不能使用普通的 `cp` 将复制到第二个 microSD 卡（通过 USB 读器连接到 Pi），这仅仅会在卡上放置文件的副本。我们需要某种工具将
    SD 卡的文件系统替换为 Raspbian 磁盘镜像内部存在的文件系统和内容，逐字节地，我们可以使用内置的小型工具 `dd`。


    `dd` 转换并复制文件——任何文件，甚至是像 `/dev/zero` 或 `/dev/random` 的特殊设备（你可以创建一个全零或随机噪声文件）——精确复制字节块。为了复制我们的
    Raspbian 镜像，我们需要挂载通过 USB 读器插入的二级 microSD 卡。在插入卡前后都使用 `sudo fdisk -l`（你也可以使用 `df`
    查看挂载情况）来查看连接的设备。如果出现类似 `/dev/sdb` 的大小与 SD 卡相同，则挂载 `/dev/sdb`。现在复制磁盘镜像：


    ```

    sudo dd if=~/Downloads/2018-11-13-raspbian-stretch-lite.img of=/dev/sdb bs=1M

    ```


    Raspbian 的祖先 UNIX 的始于 1969 年，因此我们在书中涵盖了一些具有长期遗产的工具，但用 `if=` 代替命令行选项的常用横杠可以追溯到
    20 世纪 60 年代初，以及 IBM OS/360 作业控制语言 (JCL) 中的数据定义 (DD) 语句。


    务必小心目标磁盘匹配正确的磁盘，否则将丢失另一个存储设备的内容！`bs=1M` 是块大小默认值；`4M` 是另一个选项。现在将卡插入另一台 Pi 并尽情玩吧！


    ## MagPi 核心知识


    ## [ 第十一章 ] 随心启动停止


    在过去的几年里，每种主要的 GNU/Linux 发行版（包括 Raspbian）都改变了它们的启动方式。这意味着许多关于将脚本放在 `rc.local` 中自动运行的旧文献已不再正确。保持不变的是：虽然内核启动的不是
    `/sbin/init`，而是 `/lib/systemd/systemd`（PID 仍为 1），它仍然是 Linux 内核完成设备和驱动初始化并挂载文件系统后，用户空间发生的一切事的父进程。


    init 启动一切，通常以登录提示符结束。新版本的 Raspbian 隐藏了启动过程生成的信息，但你可以通过输入 `dmesg` 查看；它们也存储在 `/var/log/kern`。


    启动 – init – 用户空间的开始；这是你可以放置自己的程序以影响 Raspbian 运行的地方，而无需修改 Linux 内核代码。传统上，GNU/Linux
    发行版实现了一个 V init 版本，它具有定义良好的启动过程，运行级别可以指示系统处于启动、单用户模式（救援模式——丢失密码时很有用）、或控制台模式、GUI
    或关机状态。


    ## 征服命令行


    systemd-analyze blame --n=20

    systemd-networkd.service ................. 1.23s

    systemd-network-manager.service ........... 1.15s

    systemd-org-dbus.service ................. 0.88s

    systemd-logd.service ................................ 0.75s

    systemd-getd.service ................................. 0.62s

    systemd-resolved.service .................... 0.55s

    systemd-syslog-generator.service ................. 0.51s

    systemd-journald.service ............................. 0.48s

    systemd-seed.service ................................ 0.42s

    systemd-randomseed.service ............................... 0.35s

    ```将服务添加到 systemd 会作为过程的一部分创建一个指向其真实位置的符号链接 – 不要手动创建


