    # CONQUER THE COMMAND LINE


    Then make a way to put the script executable with:


    ```

    chmod +x test.sh

    ```


    ...and run it with ./test.sh - any problems, then check the names, network address,
    and did you perform the ssh-config step?

    Now we have a script that saves a folder, and copies it remotely, do you notice
    any potential problems? Each time you run it, it will overwrite the previous mydocsbackup.tgz,
    both locally and remotely.

    We need a way to put a timestamp on the backup name:


    ```

    # /bin/sh

    ```


    ```

    TODAY=$(date +"%F")

    cd /home/

    tar czf mydocsbackup-\$TODAY.tgz Documents

    scp mydocsbackup-\$TODAY.tgz pi@192.168.0.207:home/bak/

    ```


    > HASH BANG !

    The shebang, or hash bang - ! at the start of the script is an instruction to
    the program to run immediately - in this case an interpreter to run /bin/sh -
    pass the script as an argument to it.


    What have we defined set variable - TODAY - now the current date, in YYYY-MM-DD
    format, which we now access with $TODAY (remember, we permanently set variables
    for the shell named this, when changing the prompt in chapter 5). You can run
    date +F in the terminal - date --help will show you the other format options.

    Now you can automate it by putting the script somewhere like /usr/bin (and with
    a better name test.sh), and running it regularly with cron, as we in chapter 11.\Shell
    tends to grow, there is always room for improvement. You may want to back up more
    than one directory, for example, or use echo to let users know what the script
    is at each stage. You could even make it interactive, letting users choose which
    directories to back up.

    There are plenty of scripting tutorials online, and great books (see The MagPi
    book reviews) to take it further, Raspbian itself holds many great scripts, from
    which you can learn by example. To see how a script can be organised to be maintainable
    with a thousand lines of code, have a look at /usr/bin/raspi-config

    However grand or modest scripting ambitions, don''t be afraid to try things out:
    build up gradually, and test your code each time,


