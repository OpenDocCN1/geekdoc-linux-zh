    ```

    sudo apt-get install bsdgames

    ```


    ## Searchable list


    It is possible to find particular apps with apt-cache search: apt-cache search
    games. You can examine individual packages with apt-cache show bsdgames. APT is
    actually a front end to the lower-level dpkg, which you can call to say what you
    have installed on the system: dpkg -l. On a fresh system, that''s a large listing:
    we''ll show you how to get useful information from such listings another time.


    Downloaded packages hang around in /var/cache/apt and if you find yourself short
    on disk space issuing sudo apt-get clean will clear out the archive, without affecting
    the installed software.


    Now, remember the extra details that ls -lh showed us in chapter 1? Try ls -1lh
    /etc/fstab.


    -rw-r-- at the beginning of the listing: sources.list compiles file attributes,
    telling you who may use the file. Other entries in the listing have a d at the
    beginning, indicating they are directories. You''ll also see hardware devices
    have a c here, for character device ls -1 on /dev/input. On Linux, everything
    is a file, your dash (-) at the start tells you this is just a regular file; it
    the remaining nine characters covers permissions.


    Every file has an owner and a group membership. Files in your directory belong
    to you. If you''re logged in as user and ls -1, you''ll see pi pi in each listing,
    telling you the owner and the group. Note that we put the switch at the end of
    this time: that''s a bad habit under circumstances, but we''re just showing you
    what''s possible. Owner and group aren''t always the same, as ls -1 /dev will
    show you.


    ## File attributes


    The file attributes, after the file type, are group of three characters (rwx)
    telling you which users may read, write or execute the file or directory for,
    respectively, the user who owns the file, the group owner, and everyone else (''others'').


    [ CONQUER THE COMMAND LINE ]


    [ FREE TO USE ]


    Software in the Raspberry Pi repository is not just free to use; but free modifiable
    and redistributable. Free software, like Linux Debian, is built for education
    and for building community.


    [ Permission to Install ] MagPi


    ## The MagPi Essentials


    Execute permissions are needed to run a file if it''s a program – such as launcher.sh
    which runs the Python games in your usr/python_games folder, and thus it has the
    x – for directories, so that you can cd into.


    cd into usr/share/python_games and then enter the command sudo chmod a-x launcher.sh.
    a stands for all (user, group and others), use u, g, or o to change just one.
    Try opening Python Games from the main menu and it won''t work. We could restore
    normal running with sudo chmod 755 launcher.sh, instead we''ll use:


    [ PROBLEMS ]

    Fine-grained permissions make for greater security can trip you up. Typing sudo
    in front of a command that doesn''t work is both a diagnosis and a quick workaround
    of a permissions problem.


    ## Octal version


    Those numbers are an octal representation of user, group, and others'' permissions:
    in this case, each is represented by 4, by 2, and execute by 1, all added together.
    So we have 75 for read+execute for user, and 5 for read+execute for group and
    all other users. ls -1 and you''ll see back to -rwxr-xr-x.


    You can use chown to change who owns a file and chgrp which group it belongs to.
    Make a new file then sudo chown root myfile.txt – now trying it and you''ll find
    that while you can read the file, you can no longer write to it. You can also
    make a file that you can write to not read!


    In the next chapter, we''ll be doing useful things with the output of our commands,
    before moving on, why not try your hand at the bsdgames package we installed?


