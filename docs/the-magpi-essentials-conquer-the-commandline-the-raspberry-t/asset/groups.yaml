    # [ 第十三章 ]


    # 轻松编译


    在这里我们将介绍如何安装软件以及从源代码进行构建


    ## 征服命令行


    只需在 `git clone` 之后粘贴以 .git 结尾的 URI 到终端（Terminal），你就会获得最新的源代码。


    安装 `alien`，你就可以在 Raspberry Pi、Fedora 以及其他系统的软件包之间进行转换。


    ![](img/db18fe165e1f1a64ee0c5d815560917d_74_0.png)


    在 Raspberry Pi 上安装大多数软件非常简单——简单到可以打包成 `.deb` 归档包。通常，会有一些很棒的代码你想尝试，但它要求你对其进行编译——有时是在从
    GitHub 克隆之后之后。虽然这不像运行 `apt-get install` 命令那么直观，但尝试这个几十年历史的软件编译过程并不可怕——当发生错误时，通常很容易回到正轨。我们还将查看已安装的脚本和
    Python 软件包，但让我们先看看如果软件包格式错误该怎么办。


    Raspian 不是唯一基于 Debian 的 GNU/Linux 发行版——distrowatch.com 列出了一百多个——其中你最可能听说是 Linux
    Mint 和 Ubuntu。Ubuntu——这个名字源于一种恩古班图语术语，意为“对他人的仁”——它是非常流行，以许多项目（包括不在 Debian 和 Raspberry
    仓库中的项目）都会为发布的每个版本维护 `.deb` 软件包。


    Ubuntu 还将“个人软件包存档”（PPA）的概念引入了 Debian 家族——这是一种特殊的软件仓库，用于上传源码包，以便由 Ubuntu 的 Launchpad
    软件进行构建并发布为 APT 仓库，就像官方 Ubuntu 仓库一样，但它是用于来自外部的非官方软件。你不需要在 Pi 软件中寻找这些，但如果你被激发想在你的主电脑上尝试
    Raspberry 的亲戚版本，你会在 Ubuntu 社区文档中找到大量的说明。


    编译看起来可能复杂，但大多数项目都为该过程提供了一个编写良好的文件——甚至是自定义的并提供提示。


    ![](img/db18fe165e1f1a64ee0c5d815560917d_75_0.png)


    当你运行 `apt-get` 或使用 `apt-cache search` 查找软件包时，apt 会查询其本地关于可用软件包的记录。关于它从何处获取这些软件包的记录（仓库地址）存储在
    `/etc/apt/sources.list` 文件以及 `/etc/apt/sources.list.d/` 下的文件中，如果你感兴趣的项目维护了一个仓库，你也可以手动添加它。


    你也可以编辑 `sources.list`（不建议这样做）——从 whezy 修改到 jessie 的菜单是一种（不支持的）升级方法，可以让你进行升级，而不会在
    Raspian 更新时重写你的 SD 卡。同时，可以下载普通的旧版 `.deb` 文件，然后使用命令进行安装：


    ```bash

    sudo dpkg -i example.deb

    ```


    并使用以下命令解决任何缺失的依赖项：


    ```bash

    apt-get install -f

    ```


    还有另一类流行的 GNU/Linux 发行版是基于 Red Hat 的，并包括 Fedora 和 CentOS。Fedora 可以作为 Raspian 的替代方案（在
    Pi 2 或 3 上），如果你想尝试它的话。我们在这里关注的是你可能需要为一种发行版安装软件包到另一种类型的系统上的情况。你的朋友是 Raspian 的 `alien`
    软件包，它可以在软件的 `.deb` 和 `.rpm`（Red Hat 软件包管理）格式软件包之间转换。


    ```bash

    alien some-package.rpm

    ```


    ...将从 `.rpm` 转换为 `.deb`。你更有可能（至少在 Pi 上，因为那里仅限 RPM 的软件包较少）需要进行反向转换：


    ```bash

    alien -r mysoftware.deb

    ```


    ## 友好编译


    在编译之前，大多数项目都提供一个编写良好的文件来处理该过程——甚至是自定义的并提供提示。


    许多项目在（至少在 Pi 上，你可能需要转换），你运行的。


    你第一次遇到 GitHub 的存在可能是看到项目页面上的横幅邀请你“fork”，或者邀请“clone”。是的，我们处于一个项目中，通常包含一个名为 `README`
    或 `INSTALL` 的文件。通过以下命令解包归文件：


    ```bash

    tar xvf software.gz

    ```


    ...进入创建的目录。然后按照上述方法执行配置/make 指令。


    通常做法是：


    ```bash

    ./configure

    make

    sudo make install

    ```


    ## 不要绝望


    ![](img/db18fe165e1f1a64ee0c5d815560917d_78_0.png)


    有时，在编译的某个地方会发生错误，脚本终止并抱怨缺少某个软件包。如果运气好，你会用 `apt-cache search` 查找依赖项的名称，它就在那里，在
    Raspian 上安装非常简单。


    运气稍好，你可能需要花点时间寻找软件，或者正在请求的最新版本。可能需要去 GitHub 或 SourceForge.net。如果开发者的设置与你的太远，这是可以；额外的安装步骤可能会顺利进行。否则，不要绝望：是有帮助的。


    大多数项目都有一种或多种报告问题和寻求帮助的方法：邮件列表或 Google Group；项目 SourceForge 页面上的一个页面，首席开发者的电子邮件地址，甚至是他们的
    Twitter 账号。请尽可能详细地描述你的问题，并


