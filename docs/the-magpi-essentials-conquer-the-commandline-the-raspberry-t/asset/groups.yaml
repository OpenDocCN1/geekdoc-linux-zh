    The UNIX family of operating systems, which includes other flavours of GNU/Linux
    and Apple''s macOS, deals with data commands as streams of text. This means that
    for now, we''ll focus on giving you a firm foundation to building your custom
    commands.


    # Getting out our feet wet


    When a command is called at the terminal, it is given three streams, known as
    standard input (stdin), standard output (stdout), and standard error (stderr).
    These streams are plain text, and treated by the Pi as specials. As noted in chapter
    3, ''everything is a file'': this is what the Pi and other UNIX systems have the
    ability to put together simple commands and programs to build complex but reliable
    systems.


    Normally, stdin is what you enter into the terminal, (command output) and stderr
    (any error messages) appear together. The reason the last two have a separate
    existence is that you may want to redirect one of them – error messages, for example
    – somewhere away from your regular output commands. We''ll look at separate error
    messages later, but first we need to know how to redirect and connect our output
    to commands or files.


    Connecting commands uses pipes, the ''|'' symbol found above the backslash on
    both GB and US keyboards (although two'
  - '[PAGE 22]


    keyboards for English speakers place the \respectively to the left of Z, and at
    the far right of the home row). When you type a command such as ls -1, the output
    is sent by Raspian to the stdout stream, which by default is shown in your terminal.
    Adding a pipe connects to the output (stdin stream) of the next command you type.
    So...


    ```

    ls -1 /usr/bin | wc -1

    ```


    ...will pass the long listing of the /usr/bin directory to the wordcount (wc)
    program which, called with the -1 (line) option, will tell you how many lines
    of ls has. In other words, it''s a way of counting how many files and folders
    are in a particular directory.


    # Search with grep


    One of the most useful commands to pass output to grep (or ''regular expressions''),
    which searches for words which are powerful search patterns understood by a number
    of commands and languages), like so:


    ```

    grep /usr/share/python_games/catanimation.py

    ```


    This displays every line in the catanimation.py file containing the character
    sequence ''if'' (Fig 1, overlap) - in other words does not just find the word
    ''if'', but words like ''elif else if'', and words like ''gift'' if they were
    present. You can use regular expressions to find lines with ''if'', or lines beginning
    with ''if'', for example.

    Piping search results and listings using grep is the way we find in one of Pi''s
    haystacks. Remember dpkg from the last chapter, to see what was installed? Try...


    ```

    dpkg -1 | grep -i game

    ```


    ...to remind yourself which you''ve installed (or are already installed). The
    -i switch makes the search case insensitive, as the program may be ''Game'' or
    ''game'' in the description column. A simple dpkg -1 | more lets you see a output
    at a time. sort will, as the name suggests, sort listing into order, with various
    tweaks available as -f to bring upper and lower case together.'
  - '[PAGE 23]


    ![](img/db18fe165e1f1a64ee0c5d815560917d_23_0.png)


    ![](img/db18fe165e1f1a64ee0c5d815560917d_23_1.png)


    # # FILING HOMEWORK


    There are many more commands beyond grep, sort uniq that can be chained together.
    Take a look at cut if you''re feeling adventurous.


    Fig 1 No matter how the line, grep will dig out the lines you need. It''s also
    handy for finding the results from a multi-page output


    One way to collect unsorted data is to combine lists. sort will put the combined
    listing back in alphabetical order:


    ```

    ls ~ /usr/share/python_games | sort -f

    ```


    Suppose you copied one of the games to your home directory to modify: you know
    it''s there, but you don''t want to see the same name twice in the listings. uniq
    will omit the duplicated lines, or with the -d switch, show only those duplicates.


    ```

    ls ~ /usr/share/python_games | sort -f | uniq

    ```


    # File it away


    Pipes are not the only form of redirection. > (the ''greater than'' symbol) sends
    the output of a program into a text file, either creating that text file in the
    process, or writing over the contents of an existing one.


    ```

    ls /usr/bin > ~/mylisting4.txt

    ```


    Now look in mylisting4.txt you''ll see the output of ls /usr/bin. Note that each
    item is on a separate line (Fig 2). Your terminal displays multiple listings per
    line for space efficiency, however, for compatibility between commands, a listing
    per line is used. Most commands operate on lines of text; e.g, grep showed you
    in when it found ''if''. Some commands need a dash as a placeholder for the stdin
    being piped to them:


    ```

    echo "zzzz is not a real program here" | cat mylisting4.txt -

    ```


