    ![](img/db18fe165e1f1a64ee0c5d815560917d_37_0.png)


    if you are connected via Ethernet, or under the wlan0 section if you''re connected
    wire wireless LAN.

    A faster way to get your IP address is to enter hostname -I on the command line.


    # How to set up your Raspberry Pi to have a static IP address


    Usually when you connect a Raspberry Pi to a local area network (LAN), it is automatically
    assigned an IP address. Typically, this address will change each time you connect.


    > You might want your Pi to boot with the same IP address each time


    Sometimes, however, you might want your Pi to boot with the same IP address each
    time. This can be useful if you are making a small self-contained network, or
    building a standalone project such as a robot. Here''s how to do it.


    Edit the file /etc/dhcpcd.conf as follows (Fig 1):

    Type sudo nano /etc/dhcpcd.conf at the command prompt. Scroll to the bottom of
    the script, and add following:


    ![](img/db18fe165e1f1a64ee0c5d815560917d_37_1.png)


    ```

    File Edit Tab Help  File /etc/dhcpcd.conf

    pi Raspberry Pi 2

    static domain_name_servers=192.168.1.1

    static routers=192.168.1.1

    interface eth00

    static ip_address=192.168.1.100/24

    interface wlan0

    static domain_name_servers=192.168.1.1

    static routers=192.168.1.1

    static ip_address=192.168.1.101/24

    ```


    MagPi [ Chapter Seven ]'
  - '[PAGE 38]


    ![](img/db18fe165e1f1a64ee0c5d815560917d_38_0.png)


    interface eth0

    static ip_address=192.168.0.2/24

    static routers=192.168.0.1

    static domain_name_servers=192.168.0.1 8.8.8.8


    interface wlan0

    static ip_address=192.168.0.2/24

    static routers=192.168.0.1

    static domain_name_servers=192.168.0.1 8.8.8.8


    Save the file with CTRL+O and then exit nano with CTRL+X.


    Your Raspberry Pi will now boot up with the IP address 192.168.0.2 every time,
    we didn''t use 192.168.0.1 as this is reserved for the router. You can course
    of use any address you like, but in the configuration above, the range must be
    between 192.168.0.2 and 192.168.0.255.

    Reboot with sudo shutdown -r now. Log in and type hostname -I. You should see
    the IP address you set in the eth0 or wlan0 entry (192.168.0.2).'
  - '[PAGE 39]


    Normally you don''t want your computer set to use a static IP address. You can
    change the network configuration back by editing dhcpcd.conf again using sudo
    nano /etc/dhcpcd.conf. Remove all the lines added in the previous step, then save
    the file.


    # # Ping!


    Ping is the most basic tool in the network testing armour, but one which is often
    called upon. It sends an ICMP (Internet Control Message Protocol) ECHO_REQUEST
    to a device on your network. ICMP is built into every connected device and used
    for diagnostics and error messages: a ping will produce a reply from the pinged
    machine, which tells you it is on, and connected, and that the network is working
    between you and. Information about packets lost, and time taken, also helps with
    fault diagnosis.


    A successful ping localhost for the Raspberry Pi tells you not just that the loopback
    interface is working, but that resolves to 127.0.0.1, the local lookup address.
    Name resolution is the cause of many complex problems – ''Domain Name Servers''
    box. Now the Pi from another machine on your local network ping 192.168.0.2 (Fig
    2) – you''ll need to use the static IPv4 address you set, rather than ours, of
    course. If you''re doing this from a Windows machine, ping defaults to five attempts;
    from another UNIX machine (another Pi, a Mac, or Ubuntu or other GNU/Linux), it
    will carry on until you stop it with CTRL+C, unless you set a number of ECHO_REQUEST
    sends like so:


    ```

    ping -c 5 raspberry.org

    ```


    # # IPv6


    The four-digit IP address we use (like 192.168.0.2) is IPv4. A newer standard,
    IPv6, is becoming more common. These are longer 128-bit addresses represented
    in hexadecimal (for example, fd531:42f8:ca5:dae2::1). Look at the example code
    in dhcpcd.conf for setting up a static address with IPv6.


    # # Free / public DNS


    As well as DNS providers, some of those listed at FreeDNS.com offer public DNS
    servers. For a wider listing of alternatives to Google''s DNS servers, have a
    search on Google.'
