    # RICHARD SMEDLEY


    ![](img/db18fe165e1f1a64ee0c5d815560917d_4_0.png)


    Since soldering his first computer – a ZX61 kit – and gaining an amateur radio
    license as GW6PCB, Richard has fallen in and out of love with technology. Swapping
    the ZX61 for a guitar and having him for organic horticulture, he eventually returned
    to the command line, beginning with a computer of his own, and progressing to
    running all the computers of an international institution. He writes about Free
    Software and teaches edible landscaping.'
