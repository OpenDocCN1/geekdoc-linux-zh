    Taking a directory of files that needs collecting together, then compressing,
    it can be done with a single command:


    ```

    tar czvf mybackup.tgz myfolder

    ```


    the c switch tells tar to create the archive, diving into all subfolders found,
    f, the named file (here, mybackup.tgz), is necessary to direct the output away
    from the terminal, or historically – a tape device. with tape, tape for tar is
    short for ‘tape archive’, a telling sign of its longevity as frequent use without
    a dash in front of the command-line options. v, with many commands, asks for more
    verbose output, the program tells you what it is doing and (if anything) has gone
    wrong.

    Lastly, z invokes gzip compression – saving the extra step of creating a tar archive,
    then running it through gzip. To unpack the archive, substitute x for extract
    in place of c – you can omit the z, tar will recognise the compression type and
    automatically deal with it:


