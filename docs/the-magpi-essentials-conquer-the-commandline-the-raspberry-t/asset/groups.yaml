    10 MagPi | 第一章 |

    ## MagPi

    ## 基础

    ## 第二章

    ## 读/写文本


    在本章中，我们使用命令行工具从文件的不同部分获取文本，例如跳转到结论，通过按键创建和命名文件及目录，而不是点击和按键。


    > 信息

    > 许多实用都有 info 页面，提供的信息比 man 页面多。如果你觉得自己很勇敢，尝试 `nano` 查看其全面的指南。


    ![](img/db18fe165e1f1a64ee0c5d815560917d_11.png)


    现在我们可以导航文件夹并列出文件，是时候学习如何创建和修改文件了。再次强调，任务不容易，而是命令的形式（特别是在编辑时）不熟悉，那是来自通用用户访问（UA）标准建立之前的时代，为了方便在操作系统之间切换。坚持下去：掌握了这本书的前两章，你就能在命令行完成大量工作，并变得熟悉。


    # 创建目录


    我们将通过创建一个新目录来直接处理文件和文件夹（参见“即时应用”框），并且你处于家目录（如有必要用 `cd ~` 回那里），输入 `mkdir tempfolder`
    并用 `ls` 查看。


    `mkdir` 正如你可能猜到的，创建一个新的目录或文件夹。让我们用它来实验修改 Python。别担心：我们不是要编程，只是通过插图做一个小改变。`cd tempfolder`（使用补全：`cd
    t` 然后按 TAB 键）。在下面的示例中，我们将一些文件复制到这个目录。首先确保已安装 Python Games ——如果没有，点击桌面左上角的图标，选择
    Preferences，然后 Recommended Software，勾选 Python Games 旁的框，然后点击 Apply 安装。我们将文件从 `/usr/share/python_games/fourinrow.py`
    复制过来：


    # 通配符


    命令末尾的 `.` 指的是“就在这里”，也就是我们要复制文件的地方。此外 `*` 被 Pi 读取为配符，代表任意数量的字符（包括没有）；还有其他配符，`?`
    表示任意单个字符。尝试 `fourinrow.py` 你就会看到运行它的本地副本。要更改名称，我们需要编辑器 —— 我们使用 Pi 内置的编辑器：`nano`。


    # 编辑和分页


    `nano fourinrow.py` 将打开编辑器进行编辑，使用方向键向下移动移动到 BOARDHEIGHT 值为 6。将其改为 10（BACKSPACE
    和 DELETE 键在 nano 中都可以用）。屏幕最后两行显示了一些快捷方式，`^`（井符号）代表 CTRL 键：`CTRL+O` 后接 RETURN 将“写出”（保存）文件；然后使用
    `CTRL+X` 退出。现在，`fourinrow.py` 将打开一个大面板，给你更多时间击胜电脑，不过你确实需要。那里没有空间把标记拖到面板顶部：回去用
    `nano` 将 BOARDHEIGHT 值改为 9。如果你想在不进入 nano 环境的情况下查看 `fourinrow.py` 列表，可以使用 `cat`
    查看任何文件的完整文本：例如 `cat fourinrow.py`。遗憾的是，文件会迅速刷屏；要一次查看页，你需要一个“分页器”程序：`less fourinrow.py`
    将让你使用 PAGE UP 和 PAGE DOWN 键上下滚动文本。其他键执行同样的工作，但我们将留给你自己。退出 less，按下 Q（这在 man 和 info
    页面也同样有效，使用页面显示文本）。


    ![](img/db18fe165e1f1a64ee0c5d815560917d_13_0.png)


    # Cats, heads & tails


    如果编辑器是我们可以安全忽略的 UNIX 传统，那么无法逃避另一个传统：糟糕的谐音梗。less 是 more 的改进，一个简单的分页器：文件末尾相对原始的
    man 页面会自动退出，省去你去按 Q 按钮的时间。承认，这并不是一个巨大的优势，你始终可以使用 cat。


    幸运的是，cat 并不是基于文件的纸浆，而仅仅是为了“连接”（concatenate）：配合多个文件使用，它会将它们连接在一起。在带参数的情况下使用 ——
    输入 `cat` —— 它会在每次按下 ENTER 后回你输入的内容。当你对它说完傻话时，按下 CTRL+C 退出视图。以及 CTRL+C 快捷方式：它关闭大多数命令行程序，就像大多数孤儿程序一样。


