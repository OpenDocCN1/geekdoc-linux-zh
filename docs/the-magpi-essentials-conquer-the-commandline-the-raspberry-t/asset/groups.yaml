  - '[PAGE 40]


    # [CHAPTER EIGHT]

    STOPPING A PROCESS


    As close to perfect as Raspbian is, things can go wrong . In this chapter, we
    learn that there’s no need to turn the Raspberry Pi off and on again: just kill
    the process!


    ![](img/db18fe165e1f1a64ee0c5d815560917d_40_0.png)'
  - '[PAGE 41]


    # The MagPi ESSENTIALS


    ![](img/db18fe165e1f1a64ee0c5d815560917d_41_0.png)


    Programs running in the terminal can be sent to sleep in the background – where
    they can easily be brought back with fg


    Keep an eye on your processes, and you''ll also be able to see what''s hogging
    your CPU and memory resources


    lost the ''off switch'' for a program? Sometimes a piece of software you''re running
    seems to have no inclination to stop: either you cannot find how to quit, or it
    has a problem, and won''t respond to your Q, CTRL+C, or whatever command should
    close it down.


    There''s no need to panic, and certainly no need to reboot: just identify the
    process and quietly kill it. We''ll show you how, and look at what else can be
    done with knowledge of processes.


    # Processes


    Find the many processes running on Raspberry Pi with the ps command. As it''s
    usually called the a and x switches which together give you all processes, rather
    than just those belonging to a user, and attached to a tty – and to see processes
    by, w adds wider output, and ww will wrap over the line to display information
    without truncating.


    Type ps auxww to see, then try with just a or other combinations. You will notice
    that these options work without the dashing dash. The lack of dashes, and the
    particular letters, a and x, date back to the original UNIX ps of the early 1970s,
    maintained through various revisions by one of UNIX''s two family


    42 | MagPi [ Chapter Eight ]'
  - '[PAGE 42]


    # CONQUER THE COMMAND LINE


    branches, BSD, and baked into the few GNU/Linux ps. UNIX''s other branch, System
    V, had extended and changed ps with new options and new abbreviations for command
    switches, so for ps ax you may see elsewhere ps -e (or -ef) or -ely to show in
    long format.

    sp ax has various headers, including the USER which owns the process, the PID,
    or Process Identification number. This starts with 1 init, the parent process
    of everything that happens in userspace the Linux kernel starts up when you turn
    the Pi on.\ the PID makes it easy to kill a process, that should be the easiest
    way of shutting it down. For example, to kill a program with a PID of 3012, simply
    enter kill 3012, and to quickly find the process in the first place, use grep
    on the ps list. For example, locating vi processes:


    +   KEEP ON TOP

    When using a virtual console, it can be worth keeping it running so that if there
    are any problems, you can CTRL-ALT-FN for a quick look for any problems – even
    the GUI freezes.


    ```

    ps ax | grep -i vi

    ```


    The -i (ignore case) isn''t usually necessary, but occasionally a program may
    break convention and contain upper-case letters in its file name. You can also
    use killall to kill by program name: killall firefox


    # Piping commands


    Naturally, you can pipe ps''out to select the PID and free directly to the command:


    ```

    kill($ps ax | grep ''[f]firefox'' | awk ''{print $2}'')

    ```


    We don''t have space for an in-depth look at awk (we''re using here to print the
    second field of grep''s output: the PID), but the [f] trick at the beginning of
    Firefox (or whatever named process you want to kill) prevents the grep process
    itself being listed in the results; in the vi example, above grep the grep process
    itself as well as vi (and) anything with the letter in its name.


    The output of ps also shows you useful information like percentage of memory and
    CPU time used, but it''s more useful to see these changing in real time. For this,
    use top also shows total CPU and memory use in the header lines, the latter in
    the format that you can also find by issuing the command free. For an improved
    top:


    Stopping A Process | MagPi 43'
