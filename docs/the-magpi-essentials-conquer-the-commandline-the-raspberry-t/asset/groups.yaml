    ## 第十二章


    ## 立即保存！


    学习如何通过备份和磁盘擦除来保护你的数据


    ## 征服命令行


    也许你已经在主电脑上运行了自动备份，或者你只是偶尔备份一下重要的东西——这没关系，我们不是来评判的。但我们会说，任何你没有备份的东西，你就不拥有。电脑会故障。硬盘和
    SSD 会故障。意外总会发生。意外在某种程度上是不可避免的。


    IT 专业人员做准备时，就像他们随时可能丢失一切一样，至少最优秀的人是这样考虑的。对于你以廉价购买的、用于爱好项目的小型单板计算机来说，这听起来可能是一项艰的任务，但数据是上面最重要的东西，而良好的备份是一种可以应用到其他领域的良好习惯。幸运的是，命令行实际上可以让这一切变得简单，我们将为你展示一些进行（相对）无痛备份的最佳方案。


    最简单的方法是将数据复制并移动到其他地方。与自动解决方案相比，这是耗费人力的，但对于极少数的备份来说，它比没有要好得多，所以我们不会忽略这一点。


    无论你是复制到磁盘，还是将备份移动到另一台机器，最好尽可能地减小它的体积。zip 压缩格式的压缩率可能不如某些专业的 UNIX 选择，但它意味着其他用户可以使用其标准的压缩软件打开这些文件。你可以选择
    LZMA 或 bzip2 压缩（分别来自 tar 的 `-J` 或 `-j`）——它们都比为了获得更好压缩的 gzip 安装得更广泛。


