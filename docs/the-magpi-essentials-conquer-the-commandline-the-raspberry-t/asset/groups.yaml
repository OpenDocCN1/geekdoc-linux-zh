    \ 编辑器就有好几个！你最可能遇到的两个是 JavaScript 的 npm 和 Python 的 pip。在使用 apt 之后，命令格式将让你很熟悉，\n\
    \n```bash\nsudo pip3 install numpy\n```\n\n...记住这些内容也不算费力。在使用 apt 之后，命令格式将让你很熟悉。尽管你对命令行感到恐惧，但你也可以通过命令行使用\
    \ Python 库来测试 NumPy。如果无法看到图片对你来说网页没有意义，请考虑一下优点：没有追踪、阅读文本时的干扰，以及页面加载更快。\n\nimg/db18fe165e1f1a64ee0c5d815560917d_80.png\n\
    \n# [ 第十四章 ]\n\n# 命令行命令行\n\n# 征服命令行\n\n![](img/db18fe165e1f1a64ee0c5d815560917d_81.png)\n\
    \nLinux 命令行快速指南：如何精通命令行\nEd 发布于 2017 年 7 月 23 日星期日 · 贡献者编辑\n在本文中，我们将深入探讨命令行世界。许多人对命令行有负面看法，认为它是过时的工具。然而，一旦你掌握了它，你会发现它对于各种任务都是强大且高效的。\n\
    \n```bash\ncurl --version\n7.68.0\n```## Netcat 是什么以及如何使用\n\nNetcat 被称为网络界的“瑞士军刀”。它是一个通过网络连接进行读写的多功能实用。在本文中，我们将展示如何使用\
    \ netcat 进行端口扫描、文件传输，甚至是隧道传输。\n\n```bash\nnc -lvp1234\n```\n\n## SSH: 安全外壳\n\n\
    SSH（Secure Shell）是一种加密协议，允许用户安全地登录远程机器。在本文中，我们将讨论如何使用 ssh 连接到服务器并像坐在那里一样执行命令。\n\
    \n```bash\nssh user@host\n```\n\n## Telnet: 老卫兵\n\nTelnet —— 简称为打字机网络（teletype\
    \ network）——是 20 世纪早期开发的协议，用于计算机之间的双向通信。它于一个没有安全考虑的时代，早已被 SSH 取代作为开放网络上直接连接的方法，但\
    \ Telnet 客户端在交互式查询服务（如邮件或网页）时仍然很有用，通过连接到服务器相应的端口并发送服务的命令：\n\n```bash\ntelnet example.com\
    \ 80\nGET /HTTP/1.1\nHOST: example.com\n```\n\n"
