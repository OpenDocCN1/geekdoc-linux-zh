    Raspbian 知道要挂载哪些磁盘，是通过读取文件系统表（/etc/fstab），并且我们可以把 `/dev/sda` 放在其中，但如果我们插入了两个驱动器，可能会选择错误的。幸运的是，磁盘（或者说磁盘分区）具有唯一的标签，称为
    UUID，这些是在分区创建时分配的。使用 `sudo blkid` 可以找到它们，它还会告诉你插入到 USB 接口的磁盘（或 flash 驱动器）标签，通常包含名称和型号，或者查看
    `/dev/disk-by-uuid`。


