    lines. On the Pi, head - 5 fourinar.py will also work.


    ![](img/db18fe165e1f1a64ee0c5d815560917d_14_0.png)


    # Remove with care


    nano file.txt does not already exist: try it, and see if it works when you exit
    the file before writing and saving anything. We''ve done a lot already (at least,
    nano makes it feel like a lot), but it''s never too early to learn how to clean
    up after ourselves. We''ll remove the files we''ve created with rm. The remove
    tool should always be used with care; it has some built-in safeguards, even these
    are easy to override (Fig 2). In particular, never let anyone persuade you to
    rm -rf / – this will delete the entire contents of your Pi, all the programs,
    everything, with little to no chance of recovery.


    We have a look at what we made: if you''re still in the tempfolder ls the Four-in-ARow
