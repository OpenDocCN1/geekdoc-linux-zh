    # CONQUER THE COMMAND LINE


    ```

    pi@raspberrypi: ~ $ shred -v -n 5 top.secret

    shred: top.secret: pass 1/5 (random)...

    shred: top.secret: pass 2/5 (fflush)...

    shred: top.secret: pass 3/5 (random)...

    shred: top.secret: pass 4/5 (000000)...

    shred: top.secret: pass 5/5 (random)...

    pi@raspberrypi: $

    ```


    Shred will securely overwrite (then optionally erase) files of sensitive data
    – entire disk drives


    # Caution


    Before we start erasing disks, think of the carpentry maxim, ''measure twice,
    cut once''. It''s easy to mistakenly erase the wrong disk or partition if you''re
    not paying attention. Given enough opportunities, most of us do it, and it''s
    the lesson that teaches us to make proper backups! Running through other operations
    on the disk (mount, df, 1s, umount), before erasing works as a sanity check that
    you''re addressing the correct partition.


    Now to those blocks. You can overwrite every bit of information, either with 1
    digits, or with totally random data, use dd. Even then, with magnetic disks, it''s
    theoretically possible to recover the data, and multiple overwrites will be necessary
    – before you worry writing a script to do that, let us introduce shred, a utility
    that does just that, overwriting with as many passes as you select as command
    switch (or defaulting to three):


    ```

    shred -vf -n 5 /dev/sdb

    ```


    # WHERE AM I?


    If you follow us on SSH keys everywhere, and end ending up from machine to remember
    to customise your Bash prompt so that you''re always sure on which machine you''re
    about to erase a file.


    Adding a -z switch will overwrite the random data shred has used with zeros, leaving
    a new-looking disk. -u will delete the file after the secure overwrite. Shred
    can also safely overwrite/or remove individual files.


    * WeWind*


