  mdcn: "\n\n# 追加内容\n\n如果你想向文件末尾添加内容而不覆盖原有内容，你需要使用 `>>`。\n\n```bash\necho -e \"one\
    \ more for luck!\" ~/mylisting4.txt\n```\n\n`echo` 简单将引号内的任何内容显示到标准输出（stdout），`-e`\
    \ 选项允许你使用特殊字符，`\\n` 用于换行（见下文）。你可以通过 `tail ~/mylisting4.txt` 查看文件的最后几行。\n`<` 将程序的输入流链接到文件或流的内容。\n\
    有一个处理的无序列表并对其进行排序：\n\n```bash\necho -e \"aardvark\\nplatypus\\njellyfish\\naark\"\
    \ > list1\nsort < list1\n```\n\n你也可以结合 `<` 和 `>`：\n\n```bash\nhead -n 2 < list1\
    \ > list2\n```\n\n...这将从 `list1` 读取内容，传递给 `head` 获取前两行，然后将这些内容放入文件 `list2` 中。在管道中：\n\
    \n```bash\nsort < list1 | uniq > list3\n```\n\n最后，让我们来看看标准错误流（stderr）：它具有文件描述符\
    \ 2（不用太担心这个），`2>` 将错误消息发送到你选择的任何文件：\n\n```bash\ncat list1 list2 list3\nlist4 2>errors.txt\n\
    ```\n\n屏幕将显示你执行的 'list' 文件，而“No file or directory”错误信息将保存在 `errors.txt` 中 - `2>>`\
    \ 将消息写入文件而不覆盖之前的内容。\n\n![](img/db18fe165e1f1a64ee0c5d815560917d_24_0.png)\n\n\
    图 2 通过重定向，你可以将命令的所有输出直接保存到文本文件中。保存好你的错误消息，以便在论坛上向寻求帮助！\n\n# 第五章\n# 定义命令行\n\n通过让\
    \ Raspbian 的行为和外观完全符合我们的要求，让它变得更加个性化。\n\n# [ 征服命令行 ]\n\n![](img/db18fe165e1f1a64ee0c5d815560917d_26_0.png)\n\
    \n```\nFile Edit Tabs Help\n@raspberrypi ~# @raspberrypi ~~\n@raspberrypi $ sudo\
    \ adduser jo\nadding new group '1000'\nadding user to group '20'\nCreating home\
    \ directory '/home/jo'\ncopying files from '/home/sk'\nBAD PASSWORD: it does not\
    \ contain different characters\ntype new password:\nCreating user entry successfully.\n\
