  - '[PAGE 3]


    # WELCOME TO

    CONQUER THE

    COMMAND LINE


    Sometimes only words will do. Graphic user interfaces (GUIs) were a great advance,
    creating an easy route into computer use for many non-technical users. For complex
    tasks, though, the interface can become a limitation: blocking off choices, and
    leaving a circuitous route even for moderately complicated jobs.

    (Re)–Enter the command line: the blinking cursor that many thought had faded away
    in the 1990s. For getting instructions from user to computer – a clear, quick,
    and unambiguous form – the command line is often the best way. It never disappeared
    on UNIX systems, and now, thanks to Raspian on the Raspberry Pi, a new generation
    is discovering the power of the command line to simplify complex tasks, or instantly
    carry out simple ones.

    If you''re not comfortable faced with the $ prompt, don''t panic! In this fully
    updated book, we''ll quickly make you feel at home, and also find your way around
    the terminal on the Pi, or any other GNU/Linux computer: getting things done,
    and unlocking the power of the command line.


    FIND ONLINE raspberrypi.org/magpi GET IN TOUCH magpi@raspberrypi.org


    PUBLISHING

    Publishing Director: Russell Barnes

    Director of Communications: Liz Upton

    CEO: Eben Upton


    DESIGN

    Critical Media: criticalmedia.co.uk

    Head of Design: Lee Allen

    Designer: Mike Key


    EDITORIAL

    Editor: Phil King

    Writer: Richard Smedley

    Contributions: Lucy Hattersley,

    Simon Long


