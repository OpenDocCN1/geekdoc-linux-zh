  mdcn: '


    ## 征服命令行


    ![](img/db18fe165e1f1a64ee0c5d815560917d_84_0.png)


    终端是一个简单但实用的诊断工具，也用于我们在本章节稍后将介绍的一些功能性应用程序。


    ## Surfraw


    正如我们之前看到的，通过 `wget` 和 `curl`，下载等功能可以从网络浏览器中移除。另一个让专门命令看起来最合适的场景是搜索。你可以通过一个名为 `surfraw`
    的巧妙程序直接在命令行中查找，它可以帮助 elvi 处理困难的搜索任务——查看所有可用命令：


    ```

    surfraw -elvi

    ```


    作为命令行世界的一个良好公民，surfraw 尊重你的时间和手腱，可以简单地通过 `sr` 来调用。


    - sr google -results=2 raspberry pi clojure gpio

    - sr translate peloton

    - sr gutenberg dickens

    - sr wikipedia permaculture-tature

    - sr bbcnews tim peake

    - sr rhyme orange


    ## MagPi 核心要素


    ![](img/db18fe165e1f1a64ee0c5d815560917d_85_0.png)


    没有存储空间，打开 YouTube 链接？下载视频稍后观看。结果将显示在你的浏览器中，你可以在 `/etc/xdg/surfconf/conf` 中设置，非常易于操作。


    ```

    def SURFRAW_text_browser /usr/bin/lynx

    def defyn SURFRAW_graphical no

    ```


    ## BBC (The Beeb)


    ```

    sudo apt-get install youtube-dl

    youtube-dl https://www.youtube.com/watch?v=ElB09DwxA6Q

    ```


    每个下载的视频都保存为 MP4 文件，得益于 MPlayer 通过可选库输出视频的能力，甚至可以使用 `-vo caca` 选项在终端中通过 ASCII 渲染。它也可以通过
    SSH 会话输出，尽管音频转发是一项留给读者研究的任务。ASCII 渲染远非高分辨率；如果你从虚拟控制台之一（我们在第一章中访问过的）运行 `mplayer`，它将默认采用帧缓冲区输出，在命令行上覆盖普通质量的视频。


    你也可以从命令行访问 BBC 内容。虽然电视节目仅适用于位于英国的 IP 地址，但广播节目——从 Radio 3 到 Radio 4 Extra 上的经典喜剧和戏剧——可以通过
    `get-iplayer` 脚本在广播后几天内进行下载；它将其保存为 AAC 格式以便以后收听。为了符合合理的合理使用条款——或至少等同 BBC 自己的 iPlayer
    服务——节目应在 30 天后删除。


    在编写时，节目搜索功能似乎不再能正常工作了。因此，你需要使用 iPlayer 网站找到所需节目的 PID（节目标识符），然后使用它来“录制”（即下载）。例如：


    ```

    get_iplayer --pid=b0b95311

    ```


    你还可以使用逗号分隔的 PID 列表一次性下载多个。


    ```

    get_iplayer --pid=b0b95311,b0b94zn8,b0b950c9

    ```


    使用 `--stream` 调用会将输出发送到 stdout，重定向到音频播放器（用于广播节目）。`--stdout` 切换在录制的同时也会执行此操作。


    ## 通信


    我们在第 11 章的日历示例中提到了直接脚本化的命令行邮件。smtp 是 `mail` 命令的一个不错选择，可用于那些暗示你的树莓派执行某项操作的脚本。如今，让树莓派发布到微博是一个非常受欢迎的选择——至少如果微博是
    Twitter 的话，尽管也有其他选择。


    网上到处都是关于使用 Python 模块在树莓派检测到 GPIO 引脚上的各种事件时发布推文的说明。如果树莓派适合你的项目，那就尽管进行吧，但对于最简单的设置，只需要易于编写脚本的
    `twidge`：


    ```

    sudo apt-get install twidge

    twidge setup

    ```


    设置很简单：twidge 会给你一个要访问的 URL，你可以在那里授权 twidge 访问你的 Twitter 账户，它会给你一个供使用的授权代码，之后 twidge
    即可准备就绪。`twidge list` 将列出可用命令。从命令行（或脚本）发布，可以尝试如下内容：


    - [ EMAIL ]


    如果你在跟上电子邮件使用感到困难：挑战一下自己使用几周 Mutt：命令行可能会让你留回收件箱。


    ```

    twidge update "Testing twidge - tweeting from the #RaspberryPi #commandline."

    ```


    更新也将从 stdin 读取。你项目 GitHub 页面上的帮助手册将引导你入门。对于命令行上的交互式（且色彩非常丰富）Twitter 客户端，请安装 Rainbowstream，你可以这样操作：


    ```

    sudo pip3 install rainbowstream

    ```


    ## 不仅仅是噱头


    命令行应用程序也适用于旧的互联网通信方式，从 IRC 到 Jabber，而 Mutt 是一个足够强大的电子邮件客户端，足以让人们（那些不会在终端里花费太多时间的人）继续使用它。严肃的工作在
    shell 中完成，但它不断产出的命令行应用程序只是……


    '
