    ...in know where to look for any errors that you introduce. Help is at hand from
    the Raspberry Pi forums, and pasting your code into shellcheck.net will give you
    valuable feedback – for example, advising you the cd in our backup script should
    be:


    PASSWORD FREE

    Using your key to log in is a convenience you quickly get used – beyond just your
    backup server, it is any machine under your control that you have to log in.


    ```

    cd /home/pi || exit

    ```


    ...in the cd step fails – this is generally a good idea, although not important
    in this particular case. Now that we have a choice of backup options, one task
    remains: securely rid of data from disks. This is a concern for anyone handling
    other people''s data, or just protecting their own privacy and security.


    # Through the shredder


    Back in the 1960s, if you wished to cover your tracks, Mission Impossible told
    us it was done by the show opening''s taped mission finishing, “This message will
    self destruct in ten seconds,” and boom went the tape player.


    In these digital days, protecting privacy or security means understanding how
    a disk drive stores data, so that you don''t dispose of old disks under the mistaken
    impression that you''ve securely erased data, when you haven''t.


    Disk space is collected into blocks, sized typically at 4096B, that are indexed
    by the file system with inodes so that the disk controller knows where to read
    the head for retrieve information. SSDs and flash drives don''t have read heads,
    but still organise the data in a similar fashion. Most disk operations operate
    at the inode level – so moving a file between directories on the same disk partition
    is simply done by relabelling an inode. rm does not delete the data, just the
    reference to its blocks on the inode.


    Plug in a disk drive after someone has done a rm -rf on it and will look empty,
    but use a low-level utility and you''ll have access to all of the jigsaw pieces
    needed to put the data back again. So far, so NCIS, but can this be significant
    to the average Pi user? Given the range of projects out there, and the multifaceted
    data that they collect, to stay on the right side of new and future data protection
    laws it will be useful to know how to securely remove data from your disks.


    72 MagPi | Chapter Twelve |'
