    or Process Identification number. This starts with 1 init, the parent process
    of everything that happens in userspace the Linux kernel starts up when you turn
    the Pi on. the PID makes it easy to kill a process, that should be the easiest
    way of shutting it down. For example, to kill a program with a PID of 3012, simply
    enter kill 3012, and to quickly find the process in the first place, use grep
    on the ps list. For example, locating vi processes:


    > KEEP ON TOP

    > When using a virtual console, it can be worth keeping it running so that if
    there are any problems, you can CTRL-ALT-FN for a quick look for any problems
    – even the GUI freezes.


    ```

    ps ax | grep -i vi

    ```


    The -i (ignore case) isn''t usually necessary, but occasionally a program may
    break convention and contain upper-case letters in its file name. You can also
    use killall to kill by program name: killall firefox


    # Piping commands


    Naturally, you can pipe ps''out to select the PID and free directly to the command:


    ```

    kill($ps ax | grep ''[f]firefox'' | awk ''{print $2}'')

    ```


    We don''t have space for an in-depth look at awk (we''re using here to print the
    second field of grep''s output: the PID), but the [f] trick at the beginning of
    Firefox (or whatever named process you want to kill) prevents the grep process
    itself being listed in the results; in the vi example, above grep the grep process
    itself as well as vi (and) anything with the letter in its name.


    The output of ps also shows you useful information like percentage of memory and
    CPU time used, but it''s more useful to see these changing in real time. For this,
    use top also shows total CPU and memory use in the header lines, the latter in
    the format that you can also find by issuing the command free. For an improved
    top:


    # sudo apt-get install htop


    htop is scrollable, both horizontally and vertically, and allows you to issue
    commands (such as k for kill) to highlighted processes. When you have finished,
    htop exited with Q, although in htop you may practice to care by highlighting
    the process and killing it from there (see Fig 1). htop also shows separate cores
    of the processor.


    # Background job


    Placing (&) after a command in the shell places the program in the background
    – the first number is a job number assigned by the shell, and the second PID we
    were working with – top is now running in the background, and you can use job
    control to work with the process in the shell. Start others in the background
    if you wish (by appending &), then bring the first to the foreground with fg.
    Now you can see running again. You can place a running in the background by ''suspending''
    it with CTRL+Z. you will always bring back the recently suspended or backgrounded
    job unless a number is specified. Note that these jobs apply only within the shell
    where process started. Types to see background processes, jobs adds in process
    (PID) to the listing.


