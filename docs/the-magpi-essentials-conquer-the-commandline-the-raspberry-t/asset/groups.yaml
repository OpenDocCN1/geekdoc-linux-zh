    ## 可搜索列表


    你可以通过 `apt-cache search` 找到特定的应用程序：`apt-cache search games`。你可以检查单个软件包：`apt-cache
    search games`。


    在 Linux 中，文件权限分为三种：读取（r）、写入（w）和执行（x）。这些权限分为三组，即所有者（user）、组（group）和其他人（others）。你可以通过
    `ls -l` 命令查看这些权限。


    ```

    -rw-r--r--

    ```


    要查看一个文件的权限，你可以使用 `ls -l`。你可以使用 `chmod` 命令来更改文件的权限。例如，`chmod +x file.sh` 会为文件添加执行权限，而
    `chmod -x file.sh` 会移除执行权限。也可以使用 `chmod a-x file.sh` 来移除所有用户的执行权限。


    ```bash

    chmod 755 file.sh

    ```


    要查看目录的权限，你可以使用 `ls -l`。


    ## 文件属性


    文件类型由权限字符串的第一个字符表示：`-` 表示普通文件，`d` 表示目录，`l` 表示符号链接。


    ```

    drwxr-xr-x

    ```


    在这个例子中，`d` 表示这是一个目录，`rwx` 表示所有者具有读取、写入和执行权限，`r-x` 表示组和其他人具有读取和执行权限。


    你可以使用 `chown` 命令更改文件的所有者，使用 `chgrp` 命令更改文件所属的组。


    ```bash

    sudo chown root:root file.txt

    ```

