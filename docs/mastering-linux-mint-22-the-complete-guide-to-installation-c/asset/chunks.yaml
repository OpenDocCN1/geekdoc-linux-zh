- fmt: '

    The User Themes extension for the GNOME Desktop Environment on Linux Mint 22 enables
    users to customize the appearance of the GNOME Shell. By default, `GNOME Tweaks`
    cannot alter the GNOME Shell theme. Installing this extension overcomes that limitation,
    offering more personalization options directly within this environment.


    ArcMenu is a top GNOME Shell extension offering a traditional app menu experience
    with a variety of layouts, from simple to exotic. It features built-in `GNOME
    search`, quick system shortcuts access, and stylish updates like adjustable search
    box border radius. The latest version includes bug fixes and improvements like
    separate icon size settings for categories and applications, and a Windows 11-style
    power button submenu. Find more at [https://extensions.gnome.org/extension/1228/arcmenu/](https://extensions.gnome.org/extension/1228/arcmenu/).


    Dash to Panel is a versatile GNOME Shell extension that transforms the dash into
    a unified main panel, merging application launchers and the system tray for a
    streamlined experience akin to KDE Plasma and Windows 7+. It eliminates the need
    for a separate dock, granting effortless access to running and favorited apps.
    Highly customizable, it allows users to adjust the panel’s appearance, behavior,
    and functionality, including running indicators, window previews, and intellihide.
    Features like customizable running indicators, live previews on hover, keyboard
    shortcuts for launching apps, and multi-monitor support enhance usability, making
    your workspace feel personalized and efficient. Learn more at [https://extensions.gnome.org/extension/1160/dash-to-panel/](https://extensions.gnome.org/extension/1160/dash-to-panel/).


    Desktop Icons (NG) is an enhancement for GNOME Shell, acting as a revamped version
    of the official Desktop Icons extension. It introduces features like intuitive
    drag-and-drop across the desktop, applications, and Nautilus windows, plus a versatile
    "Open with..." option for multiple files. It ensures the full names of icons are
    visible upon hover or click, even if they''re too long, and maintains compositor
    stability under heavy desktop activity. More details are available at [https://extensions.gnome.org/extension/2087/desktop-icons-ng-ding/](https://extensions.gnome.org/extension/2087/desktop-icons-ng-ding/).


    Tray Icons: Reloaded is a GNOME Shell extension that revitalizes your desktop
    by returning Tray Icons to the top panel, enriched with new features. It introduces
    an overflow mode with a ''3 dots'' icon for excess items, customizable tray positioning,
    icon limits, and sizes. Users can fine-tune icon color saturation, contrast, and
    brightness, alongside adjustable tray, icon margins, and padding. Find more information
    at [https://extensions.gnome.org/extension/2890/tray-icons-reloaded/](https://extensions.gnome.org/extension/2890/tray-icons-reloaded/).


    # GNOME Shell Extension Manager


    Visit the official GNOME Shell Extension Manager website at [https://github.com/mjakeman/extension-manager](https://github.com/mjakeman/extension-manager)
    for all things GNOME Shell Extension Manager.


    ### Installing GNOME Shell Extension Manager via FLATPAK Package through Software
    Manager


    1. Open Software Manager and search for `GNOME Shell Extension Manager`.

    2. Click on `GNOME Shell Extension Manager`, then on the Source Selection Box.

    3. Choose `SYSTEM PACKAGE` or `FLATPAK` and click Install.


    ### Installing GNOME Shell Extension Manager via APT in the Terminal


    ```

    sudo apt update

    sudo apt install gnome-shell-extension-manager

    ```


    ### Installing GNOME Shell Extension Manager via FLATPAK in the Terminal


    ```bash

    flatpak install flathub com.mattjakeman.ExtensionManager

    ```


    # GNOME Shell Integration


    For all things GNOME Shell Integration visit the official GNOME Shell Integration
    websites at:


    - [https://chrome.google.com/webstore/detail/gnome-shell-integration/gphhapmejobijbbhgpjhcjognlahblep](https://chrome.google.com/webstore/detail/gnome-shell-integration/gphhapmejobijbbhgpjhcjognlahblep)

    - [https://addons.mozilla.org/en-GB/firefox/addon/gnome-shell-integration/](https://addons.mozilla.org/en-GB/firefox/addon/gnome-shell-integration/)


    ### Installing the GNOME Shell Integration Chrome Extension via GUI


    Navigate to the release page at:

    [https://chromewebstore.google.com/detail/gnome-shell-integration/gphhapmejobijbbhgpjhcjognlahblep](https://chromewebstore.google.com/detail/gnome-shell-integration/gphhapmejobijbbhgpjhcjognlahblep)


