    # Programming Languages


    Programming languages are systems for writing software, balancing form (syntax)
    and meaning (semantics) with features like types and error handling. Influenced
    by computer architecture, they have evolved from hardware-specific to more abstract
    forms, enhancing simplicity. Ranging from imperative to object-oriented types,
    they cater to various needs while balancing benefits and trade-offs, like simplicity
    versus performance. This evolution is reflected in the dynamic study and classification
    within computer science, making programming a vibrant field.


    Zig, created by Andrew Kelley, is a compact, statically typed compiled language
    aimed at system programming, positioning itself as a modern successor to C. Striving
    for simplicity and efficiency, Zig avoids macros and preprocessors, embracing
    flow control, easy function calls, and direct library imports. It borrows from
    newer languages through compile-time generics and a hint of reflection, enhancing
    flexibility. Zig prioritizes safety without demanding runtime checks, offering
    option types and a built-in testing framework to manage manual memory without
    garbage collection, distinguishing itself from peers like `Go`, `Rust`, and `Carbon`.


    `Go`, crafted by Robert Griesemer, Rob Pike, and Ken Thompson at Google, is a
    high-level, statically typed language similar to C but with added memory safety,
    garbage collection, and concurrency. It thrives on simplicity and security, making
    it ideal for scalable systems. Supported by Google, `Go` (or `Golang`) boasts
    a robust standard library, built-in concurrency, and a vibrant ecosystem. Its
    main implementations include the `gc` compiler for diverse platforms and WebAssembly,
    and `gccgo` or `gollvm` through `gofrontend`. `GopherJS` even brings `Go` to the
    web by compiling it to JavaScript.


    `Rust`, created by Graydon Hoare in 2006 and later backed by Mozilla, is a versatile
    programming language known for its emphasis on performance, type safety, and concurrency
    without needing a garbage collector. Its unique "borrow checker" helps manage
    memory and data races effectively. Adopted by tech giants like Amazon and Google,
    and even integrated into Linux kernel development, `Rust` stands out for its quick
    uptake and impact on systems programming, blending ideas from functional programming
    for robust, efficient software creation.


    `Lua` is a versatile programming language born in Brazil in 1993, known for its
    efficiency and lightness. Ideal for embedded use, it runs on a cross-platform
    interpreter and offers a simple `C API` for integration. It excels in scripting,
    configuration, and rapid prototyping thanks to its dynamic typing, automatic memory
    management, and support for multiple programming paradigms. `Lua`''s development
    by PUC-Rio emphasizes speed, portability, and ease of embedding. Its name, meaning
    "Moon" in Portuguese, underscores its unique identity. Free and open-source, `Lua`
    stands out for its performance, small footprint, and adaptability across platforms
    and devices.


    `OpenJDK` is a free, open-source version of the Java Platform, Standard Edition,
    initiated by Sun Microsystems in 2006 and licensed under `GPL-2.0` with a special
    exception for linking. It’s where enthusiasts and developers converge to advance
    Java SE and its related projects, offering the latest `OpenJDK JDK 21` binaries
    for various operating systems. Engage in the vibrant OpenJDK Community to explore,
    download, or contribute to projects like Amber, `Loom`, `Panama`, `Valhalla`,
    and the future of Java. For practical Java applications, `dev.java` is your go-to.
    Whether you’re learning, downloading, or contributing, `OpenJDK` embodies collaboration
    and innovation in Java''s evolution.


    ## Zig


    Visit the official Zig website at [https://ziglang.org/](https://ziglang.org/)
    for all things Zig.


    Installing Zig via SNAP in the Terminal:


    ```bash

    sudo snap install zig --beta --classic

    ```


    ## Go


    Visit the official Go website at [https://go.dev/](https://go.dev/) for all things
    Go.


    Installing Go via GUI & Command Line in the Terminal:


    Navigate to the release page at: [https://go.dev/dl/](https://go.dev/dl/)


    Click The Latest `go.linux-amd64.tar.gz` to Download Go.


    Run the following commands in the terminal:


    ```bash

    cd ~/Downloads

    tar -xvf go1.22.4.linux-amd64.tar.gz

    sudo chown -R root go

    sudo mv go /usr/local

    ```


    ## Rust


    Visit the official Rust website at [https://www.rust-lang.org/](https://www.rust-lang.org/)
    for all things Rust.


    Installing Rust via curl in the Terminal:


    ```bash

    curl --proto ''=https'' --tlsv1.2 -sSf https://sh.rustup.rs | sh

    source "$HOME/.cargo/env"

    ```


    ## Lua


    Visit the official Lua website at [https://www.lua.org/home.html](https://www.lua.org/home.html)
    for all things Lua.


    Installing Lua via APT in the Terminal:


    ```bash

    sudo apt update

    sudo apt install build-essential libreadline-dev wget cd

    mkdir lua_build

    cd lua_build

    wget https://www.lua.org/ftp/lua-5.4.6.tar.gz

    tar -xvf lua-5.4.6.tar.gz

    cd lua-5.4.6

    make linux test

    sudo make install

    ```


    ## OpenJava


    Visit the official OpenJava website at [https://openjdk.org/](https://openjdk.org/)
    for all things OpenJava.


    Installing OpenJava via APT in the Terminal:


    ```bash

    sudo apt update && sudo apt upgrade

    sudo apt install default-jre default-jdk

    ```


    # Imageboards


    Imageboards are online forums where images take precedence over text, originating
    from Japan. They allow users to engage in diverse discussions by posting pictures,
    functioning like bulletin boards but focusing more on temporary content. Users
    can post anonymously and often use tripcodes—hashed passwords—for identity without
    storing personal data. Unlike online galleries, content on imageboards primarily
    comes from external sources. Platforms like 4chan offer "secure" tripcodes to
    enhance anonymity, making these forums unique for their combination of visual
    content and anonymous interaction.

