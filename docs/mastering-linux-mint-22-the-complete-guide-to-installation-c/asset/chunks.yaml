    此设置确保您的 ClamAV 数据库定期更新，并且系统每天都会扫描威胁，从而增强您的安全措施。


    # ClamTk


    访问 ClamTk 官方网站 [`github.com/dave-theunsub/clamtk`](https://github.com/dave-theunsub/clamtk)
    获取更多信息。


    ### 通过 GNOME 软件通过 DEB/FLATPAK 软件包安装 ClamTk


    1. 打开 GNOME 软件并搜索 `ClamTk`。

    2. 点击 `ClamTk`，然后点击源选择框。

    3. 选择 `DEB` 或 `FLATPAK` 并点击“安装”。


    ### 在终端中通过 APT 安装 ClamTk


    要安装 `ClamTk`，输入以下命令：


    ```bash

    sudo apt update && sudo apt upgrade

    sudo apt install clamtk

    ```


    ### 在终端中通过 FLATPAK 安装 ClamTk


    要通过 `FLATPAK` 安装，输入此命令：


    ```bash

    flatpak install flathub com.gitlab.davem.ClamTk

    ```


    # Chkrootkit


    访问 chkrootkit 官方网站 [`www.chkrootkit.org/`](https://www.chkrootkit.org/) 获取更多信息。


    ### 在终端中通过 APT 安装 Chkrootkit


    要安装 `Chkrootkit`，输入以下命令：


    ```bash

    sudo apt update

    sudo apt install chkrootkit

    ```


    ### Chkrootkit 每日扫描


    要调度每日 `chkrootkit` 扫描，打开终端并运行：


    ```bash

    sudo crontab -e

    ```


    在 `crontab` 文件中，插入以下行：


    ```bash

    2 22 * * * /usr/sbin/chkrootkit -x -q -r / >> /var/log/chkrootkit.log 2>&1

    ```


    此命令配置了在每天晚上 10:02 进行每日扫描，并将结果静默地记录到 `/var/log/chkrootkit.log`。按 `CTRL + S` 保存更改，然后按
    `CTRL + X` 退出。


    # Rkhunter


    访问 Rkhunter 官方网站 [`sourceforge.net/projects/rkhunter/`](https://sourceforge.net/projects/rkhunter/)
    获取更多信息。


    ### 在终端中通过 APT 安装 Rkhunter


    要安装 `Rkhunter`，输入以下命令：


    ```bash

    sudo apt update

    sudo apt install rkhunter

    ```


    如果出现关于 `postfix` 的对话框，选择“No Configuration”（无配置）并继续。


    ### Rkhunter 每日更新与扫描


    要设置 `rkhunter` 的每日更新和扫描，请打开终端并输入：


    ```bash

    sudo crontab -e

    ```


    在 `crontab` 文件中，添加以下行：


    ```bash

    2 21 * * * /usr/local/bin/rkhunter --cronjob --update --quiet --remove

    ```


    这调度了 `rkhunter` 在每天晚上 9:02 进行更新并运行静默扫描，在不产生侵入性通知的情况下维护系统安全。按 `CTRL + S` 保存修改并使用
    `CTRL + X` 退出。


    # Firejail


    访问 Firejail 官方网站 [`firejail.wordpress.com/`](https://firejail.wordpress.com/)
    获取所有关于 Firejail 的信息。


    ### 在终端中通过 APT 安装 Firejail


    输入这些命令：


    ```bash

    sudo apt update

    sudo apt install firejail

    ```


    # Firetools


    访问 Firetools 官方网站 [`github.com/netblue30/firetools`](https://github.com/netblue30/firetools)
    获取更多关于 Firetools 的信息。


    ### 通过 GNOME 软件通过 DEB 软件包安装 Firetools


    1. 打开 GNOME 软件并搜索 `Firetools`。

    2. 点击 `Firetools`，然后点击源选择框。

    3. 选择 `System Package`（系统软件包）或 `FLATPAK` 并点击安装。


    ### 在终端中通过 APT 安装 Firetools


    输入这些命令：


    ```bash

    sudo apt update && sudo apt upgrade

    sudo apt install firejail firetools

    ```


    # OSSEC


    访问 OSSEC 官方网站 [`www.ossec.net/`](https://www.ossec.net/) 获取所有关于 OSSEC 的信息。


    ### 在终端中通过 APT 安装 OSSEC


    要安装 `OSSEC`，打开终端并执行以下命令来安装必要的依赖项：


    ```bash

    sudo apt-get install make gcc libc6-dev libssl-dev zlib1g-dev libpcre2-dev libevent-dev
    build-essential zlib1g-dev libpcre2-dev libsqlite3-dev libssl-dev libevent-dev
    libsystemd-dev curl wget git libxslt-dev python3-dev python3-babel python3-venv
    python3-pip

    ```


    接下来，使用您的 Node 版本管理器 (`NVM`) 安装版本 16 的 `Node.js` & `Npm`：


    ```bash

    nvm install 16

    ```


    接下来，将您的 Node 版本管理器 (`NVM`) 设置为版本 16：


    ```bash

    nvm use 16

    ```


    使用 `wget` 下载 3.7.0 版本的 `OSSEC`：


    ```bash

    wget https://github.com/ossec/ossec-hids/archive/refs/tags/3.7.0.tar.gz

    ```


    解压下载的压缩包：


    ```bash

    tar -xzvf 3.7.0.tar.gz

    ```


    进入 `OSSEC` 目录：


    ```bash

    cd ossec-hids-3.7.0

    ```


    启动安装脚本：


    ```bash

    sudo ./install.sh

    ```


    安装期间，请遵循以下说明：

    - 输入 `en` 并按 `Enter` 选择英语。

    - 输入 `local` 选择本地安装类型，并指定安装路径为 `/var/ossec`。

    - 第一个问题回答 `n`，后续问题回答 `y` 以接受默认设置，除了电子邮件和将额外的 IP 添加到白名单之外。如果您愿意的话，可以跳过电子邮件通知和额外的白名单
    IP 功能。

    - 最后按 `Enter` 确认您的选择。


    ### OSSEC Systemd 服务


    首先打开终端并输入以下命令来编辑 `OSSEC` 服务文件：


    ```bash

    sudo gedit /etc/systemd/system/ossec.service

    ```


    在 `ossec.service` 文件中，插入以下配置：


    ```ini

    [Unit]

    Description=OSSEC service

    After=network.target


    [Service]

    Type=simple

    ExecStart=/var/ossec/bin/ossec-control start

    ExecStop=/var/ossec/bin/ossec-control stop

    TimeoutStartSec=0

    Restart=on-failure

    StartLimitInterval=0


    [Install]

    WantedBy=multi-user.target

    ```


    保存更改并关闭编辑器。


    接下来，在终端执行这些命令以启用、启动并检查 `OSSEC` 服务的状态：


    ```bash

    sudo systemctl enable ossec.service

    sudo systemctl start ossec.service

    sudo systemctl status ossec.service

    ```


