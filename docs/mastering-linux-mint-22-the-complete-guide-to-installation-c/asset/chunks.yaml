  trans: '


    按下 `Super` 键打开应用程序菜单并启动“微调 (Tweaks)”。


    导航到“启动应用程序 (Startup Applications)”选项卡并点击 `+` 按钮。


    输入您想要自动启动的应用名称并选择“添加”。


    # 使用 GNOME Disks 自动挂载分区


    访问 GNOME Disks 官方网站 [`apps.gnome.org/en-GB/DiskUtility/`](https://apps.gnome.org/en-GB/DiskUtility/)
    了解有关 GNOME Disks 的所有信息。


    ## 通过 GUI 界面自动挂载分区：


    1. 从应用程序菜单启动“磁盘 (Disks)”。

    2. 选择包含您想要挂载卷的磁盘。

    3. 选择该磁盘上的特定卷并点击齿轮图标。

    4. 选择“编辑挂载选项 (Edit Mount Options)”。

    5. 将“用户会话默认 (User Session Defaults)”旁开关切换到左侧。

    6. 点击“确定”确认更改。


    # Cinnamon 截图快捷键


    ### 通过命令行和 GUI 更改闪光颜色属性：


    1. 打开“文件 (Files)”应用程序并按 `CTRL + L` 启用“位置输入”模式。

    2. 输入 `/usr/share/themes/` 并导航到 `Mint-Y-Dark-Red` 文件夹。

    3. 在文件夹内部进入 `cinnamon` 目录。

    4. 在空白处右键点击并选择“在终端打开”。

    5. 执行：

    ```bash

    sudo gedit cinnamon.css

    ```

    6. 搜索 `flashspot` 元素并将其值更改为 `"#00FFFFFF"`。

    7. 保存并退出。

    8. 按 `ALT + F2` 打开 cinnamon 运行命令框，输入 `r` 并回车重启 cinnamon。


    ### 通过 GUI 创建“截图 (Screenshots)”文件夹：


    1. 打开“文件 (Files)”应用程序并导航到 `~/Pictures` 目录。

    2. 在空白处右键点击并选择创建新文件夹选项。

    3. 将其重命名为“Screenshots”。


    ### 通过 GUI 拍摄活动窗口截图：


    1. 从应用程序菜单打开“设置 (Settings)”。

    2. 导航到“键盘 (Keyboard)”并选择“快捷键 (Shortcuts)”。点击“添加自定义快捷键”。

    3. 命名为“Focused Window Screenshot”并输入：

    ```bash

    bash -c "cd ~/Pictures/Screenshots && gnome-screenshot -w -f screenshot_$(date
    +%d-%m-%y-%H-%M-%S).png"

    ```

    4. 添加命令并为其分配键盘快捷键，例如 `F10`。


    ### 通过 GUI 拍摄全屏截图：


    1. 从应用程序菜单打开“设置 (Settings)”。导航到“键盘 (Keyboard)”并选择“快捷键”。

    2. 点击“添加自定义快捷键”。

    3. 命名为“Fullscreen Screenshot”并输入：

    ```bash

    bash -c "cd ~/Pictures/Screenshots && gnome-screenshot -f screenshot_$(date +%d-%m-%y-%H-%M-%S).png"

    ```

    4. 添加命令并为其分配键盘快捷键，例如 `F11`。


    # GNOME 概览与 Windows 键


    ### 通过 GUI 更改“显示概览 (Show the Overview)”快捷键：


    1. 打开应用程序菜单并选择“设置 (Settings)”。导航到“键盘 (Keyboard)”选项卡并选择“查看和自定义快捷键”。

    2. 搜索“Show the overview”。

    3. 按 `Super + TAB` 设置新的快捷键。


    ### 通过 GUI 更改“切换窗口 (Switch Windows)”快捷键：


    1. 打开应用程序菜单并选择“设置 (Settings)”。

    2. 导航到“键盘 (Keyboard)”选项卡并选择“查看和自定义快捷键”。

    3. 搜索“Switch windows”。按 `ALT + TAB` 设置新的快捷键。


    # GNOME 截图快捷键


    ### 通过 GUI 更改“截图 (Take a Screenshot)”快捷键：


    1. 打开应用程序菜单并选择“设置 (Settings)”。

    2. 导航到“键盘 (Keyboard)”选项卡并选择“查看和自定义快捷键”。

    3. 搜索“Take a screenshot”。

    4. 按 `F10` 设置新的快捷键。


    ### 通过 GUI 更改“窗口截图 (Take a Screenshot of a Window)”快捷键：


    1. 打开应用程序菜单并选择“设置 (Settings)”。

    2. 导航到“键盘 (Keyboard)”选项卡并选择“查看和自定义快捷键”。

    3. 搜索“Take a screenshot of a window”。

    4. 按 `F11` 设置新的快捷键。


    ### 通过 GUI 更改“交互式窗口截图 (Take a Screenshot of a Window Interactively)”快捷键：


    1. 打开应用程序菜单并选择“设置 (Settings)”。

    2. 导航到“键盘 (Keyboard)”选项卡并选择“查看和自定义快捷键”。

    3. 搜索“Take a screenshot of a window interactively”。

    4. 按 `F9` 设置新的快捷键。


    #  Systemd 超时


    访问 Systemd 官方网站 [`systemd.io/`](https://systemd.io/) 了解有关 Systemd 的所有信息。


    ### 通过命令行和 GUI 设置默认 Systemd 超时：


    ```bash

    sudo apt update

    cd /etc/systemd/

    sudo gedit system.conf

    ```


    更改：

    `#DefaultTimeoutStartSec=90s`

    为：

    `DefaultTimeoutStartSec=30s`


    点击“保存”或通过文件菜单保存进度。

    运行：

    ```bash

    sudo systemctl daemon-reload

    ```


    # 使文件和文件夹变为不可变


    访问不可变文件和文件夹官方网站 [`www.linux.org/docs/man1/chattr.html`](https://www.linux.org/docs/man1/chattr.html)
    了解有关不可变文件和文件夹的所有信息。


    ### 通过命令行使文件和文件夹变为不可变：


    ```bash

    sudo apt update

    cd ~/Downloads

    sudo chattr +i -RV CurseForge-1.251.0-17831.AppImage

    ```


    # ffmpegthumbnailer


    访问 ffmpegthumbnailer 官方网站 [`github.com/dirkvdb/ffmpegthumbnailer`](https://github.com/dirkvdb/ffmpegthumbnailer)
    了解有关 ffmpegthumbnailer 的所有信息。


    ### 在终端通过 APT 安装 ffmpegthumbnailer：


    ```bash

    sudo apt update

    sudo apt install ffmpeg ffmpegthumbnailer gstreamer1.0-libav

    rm -r ~/.cache/thumbnails/

    ```


    # 删除 .desktop 文件


    访问 .desktop 文件官方网站 [`specifications.freedesktop.org/desktop-entry-spec/desktop-entry-spec-latest.html`](https://specifications.freedesktop.org/desktop-entry-spec/desktop-entry-spec-latest.html)
    了解有关 .desktop 文件的所有信息。


    ### 通过终端删除 .desktop 文件：


    ```bash

    cd /usr/share/applications

    dir

    sudo cp uget-gtk.desktop uget-gtk1.desktop

    sudo rm -r uget-gtk.desktop

    sudo update-desktop-database

    ```


    # 电源设置


    ### 通过 GUI 调整电源设置：


    1. 从应用程序菜单打开“设置 (Settings)”。

    2. 导航到“电源 (Power)”部分。

    3. 将“屏幕屏 (Screen Blank)”设置为“5 分钟”。

    4. 通过选择“关闭”关闭“自动暂停 (Automatic Suspend)”。


    # GNOME 扩展


    GNOME Shell 扩展由第三方开发，通过允许窗口管理微调或应用启动修改等自定义功能来增强 GNOME 界面。您可以在专用网站上查找并管理这些扩展，它们带有唯一的标识符
    (UUID) 以确保安全安装。虽然它们提供了从细微到重大的界面变化的各种功能增强，但用户应保持谨慎。扩展与操作系统深度集成，可能会导致系统问题或安全风险。然而，它们在提供下载之前会经过严格的安全审查，以确保创新与安全之间的平衡。访问
    GNOME 官方网站 [`foundation.gnome.org/`](https://foundation.gnome.org/) 获取更多信息。


    GNOME Shell Extension Manager 简化了 GNOME 扩展的安装和管理。该工具允许用户直接从 `extensions.gnome.org`
    网站浏览、安装、删除、启用或禁用扩展，而无需网络浏览器。这在 Ubuntu 21.10 及更高版本中特别有用，因为默认的 Firefox 由于 Snap 格式无法安装扩展。由于从
    GNOME 43 起支持应用内更新以及管理已安装扩展（包括系统扩展）的能力，它提供了一种精简的体验。它可以通过 Flathub 以 Flatpak 形式获取，是增强
    GNOME 桌面环境的重要工具。访问官方网站 [`extensions.gnome.org/`](https://extensions.gnome.org/)
    了解更多详情。


    GNOME Shell Integration Chrome 扩展和 Firefox 加载程序有助于 GNOME 桌面环境与相应网络浏览器之间的无缝交互。它们允许用户直接从浏览器中安装、管理和应用
    GNOME Shell 扩展，而无需使用终端或其他工具。这种集成简化了 GNOME 桌面体验的自定义和增强，使得对于倾向于图形界面而非命令行操作的用户来说更易使用。更多信息可以在
    [`extensions.gnome.org/extension/19/user-themes/`](https://extensions.gnome.org/extension/19/user-themes/)
    找到。


