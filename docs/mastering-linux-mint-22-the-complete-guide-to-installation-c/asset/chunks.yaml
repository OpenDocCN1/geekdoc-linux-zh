    # Instant Messaging


    Instant messaging software allows users to communicate instantly through text
    over networks. Unlike emails, conversations happen in real-time, often with features
    like emojis, voice, video chat, and file sharing. It''s useful for quick exchanges
    but- relies on central servers, raising privacy concerns. Some services include
    chat rooms and mobile messaging, enhancing connectivity. However, users face potential
    service suspensions and privacy issues.


    Discord is a social platform for instant messaging, voice, and video calls. It
    supports communities through servers where users chat, share media, and hang out.
    With apps for major platforms, it’s popular among gamers and various interest
    groups. Discord offers private and group communication tools, low-latency technology
    for seamless interaction, and custom moderation features. It blends everyday conversation
    ease with the excitement of larger communities, making digital gatherings easy
    and inclusive. More info at [https://discord.com](https://discord.com/).


    Skype, from Microsoft, offers free video, voice calls, and messaging. It works
    on various devices and is free for basic features, with paid options for phone
    calls and SMS. Skype connects the business world, enhancing collaboration. It
    provides instant messaging, voice chat, and more, with unique IDs for users. Though
    it doesn’t support emergency calls, it offers features like background blur for
    video chats. Recently, Skype integrated the Bing AI chatbot. More info at [https://skype.com](https://skype.com/).


    Session is a privacy-focused messaging app by The Oxen Project. It’s available
    on macOS, Windows, Linux, iOS, and Android, using a blockchain network for secure
    communication without phone numbers or emails. Instead, users have a unique 66-digit
    ID. Despite lacking two-factor authentication and evolving protocols, its encryption
    is independently verified. Session offers a secure way to exchange messages, voice
    notes, and media. More info at [https://getsession.org](https://getsession.org/).


    Pidgin is a free, open-source messaging client supporting many protocols. It allows
    users to connect to various services through one interface. Known for robust encryption
    with the Off-the-Record Messaging plugin, it’s popular among privacy enthusiasts
    and included in Tails OS. Pidgin has a user-friendly GTK+ interface, works on
    multiple operating systems, and supports extensibility through plugins for added
    functionality. More info at [https://pidgin.im](https://pidgin.im/).


    Ferdium is a desktop app consolidating favorite services into one platform for
    easy access. It supports multiple accounts of the same service, offers workspaces
    to separate personal and professional life, and includes a Todo panel. Adding
    custom services is easy, ensuring flexibility. Ferdium prioritizes privacy, offers
    cloud sync across devices, and hibernates unused services to save resources. Originating
    from Franz, it enhances the experience with additional features and compatibility
    with Franz accounts. More info at [https://ferdium.org](https://ferdium.org/).


    Signal is a secure messaging app with state-of-the-art encryption. It offers free
    text, voice messages, photos, videos, and calls without fees, even long distances.
    Signal includes encrypted stickers and group chats, with no ads, trackers, or
    ties to major tech companies. As a nonprofit supported by donations, it stands
    for privacy and accessibility. More info at [https://signal.org](https://signal.org/).


    Telegram is a messaging app blending communication and social networking. Launched
    in 2013, it supports messaging, media sharing, and voice or video calls with end-to-end
    encryption. Users enjoy features like stories, large groups, and channels for
    broadcasts. Telegram’s open API allows custom bots and mini-apps, enriching user
    interaction. Available on major platforms, it stands out for security, user-friendly
    interface, and rich functionality. More info at [https://telegram.org](https://telegram.org/).


    # Discord


    Visit the official Discord website at [https://discord.com/](https://discord.com/)
    for all things Discord.


    # Installing Discord via FLATPAK Package through Software Manager


    1. Open Software Manager and search for `Discord`.

    2. Click on `Discord`, then on the Source Selection Box.

    3. Choose `FLATPAK` and click Install.


    # Installing Discord via FLATPAK in the Terminal


    ```bash

    flatpak install flathub com.discordapp.Discord

    ```


    # Installing Discord via SNAP in the Terminal


    ```bash

    sudo snap install discord

    ```


    # Skype


    Visit the official Skype website at [https://www.skype.com/en/](https://www.skype.com/en/)
    for all things Skype.


    # Installing Skype via FLATPAK Package through Software Manager


    1. Open Software Manager and search for `Skype`.

    2. Click on `Skype`, then on the Source Selection Box.

    3. Choose `FLATPAK` and click Install.


    # Installing Skype via APT in the Terminal


    ```bash

    sudo apt update

    sudo apt install software-properties-common apt-transport-https curl ca-certificates

    curl -fsSL https://repo.skype.com/data/SKYPE-GPG-KEY | sudo gpg --dearmor | sudo
    tee /usr/share/keyrings/skype.gpg > /dev/null

    echo deb [arch=amd64 signed-by=/usr/share/keyrings/skype.gpg] https://repo.skype.com/deb
    stable main | sudo tee /etc/apt/sources.list.d/skype.gpg

    ```


    # Installing Skype via FLATPAK (continued)


    ```bash

    sudo apt update

    sudo apt install skypeforlinux

    ```


    # Installing Skype via FLATPAK in the Terminal


    ```bash

    flatpak install flathub com.skype.Client

    ```


    # Installing Skype via SNAP in the Terminal


    ```bash

    sudo snap install skype

    ```


    # Installing Skype via .deb in the GUI


    Navigate to the release page at: [https://repo.skype.com/SYSTEM PACKAGE/pool/main/s/skypeforlinux/](https://repo.skype.com/rpm/pool/main/s/skypeforlinux/)


    Click the latest `skypeforlinux__amd64.deb` to download Skype.


    Go to your Downloads folder.


    Double-click `skypeforlinux__amd64.deb`.


    Click Install.


    # Session


    Visit the official Session website at [https://getsession.org/](https://getsession.org/)
    for all things Session.


    # Installing Session via FLATPAK in the Terminal


    ```bash

    flatpak install flathub network.loki.Session

    ```


    # Pidgin


    Visit the official Pidgin website at [https://www.pidgin.im/](https://www.pidgin.im/)
    for all things Pidgin.


    # Installing Pidgin via SYSTEM PACKAGE/FLATPAK Package through Software Manager


    1. Open Software Manager and search for `Pidgin`.

    2. Click on `Pidgin`, then on the Source Selection Box.

    3. Choose `SYSTEM PACKAGE` or `FLATPAK` and click Install.


    # Installing Pidgin via APT in the Terminal


    ```bash

    sudo apt install pidgin

    ```


    # Installing Pidgin via FLATPAK in the Terminal


    ```bash

    flatpak install flathub im.pidgin.Pidgin

    ```


    # Ferdium


    Visit the official Ferdium website at [https://ferdium.org/](https://ferdium.org/)
    for all things Ferdium.


    # Installing Ferdium via FLATPAK Package through Software Manager


    1. Open Software Manager and search for `Ferdium`.

    2. Click on `Ferdium`, then on the Source Selection Box.

    3. Choose `FLATPAK` and click Install.


    # Installing Ferdium via FLATPAK in the Terminal


    ```bash

    flatpak install flathub org.ferdium.Ferdium

    ```


    # Installing Ferdium via SNAP in the Terminal


    ```bash

    sudo snap install ferdium

    ```


    # Signal


    Visit the official Signal website at [https://signal.org/](https://signal.org/)
    for all things Signal.


    # Installing Signal via FLATPAK Package through Software Manager


    1. Open Software Manager and search for `Signal`.

    2. Click on `Signal`, then on the Source Selection Box.

    3. Choose `FLATPAK` and click Install.

