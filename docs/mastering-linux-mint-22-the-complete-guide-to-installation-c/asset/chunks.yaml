    Apache OpenOffice 是另一款开源套件，提供了文字处理、电子表格和演示文稿功能，支持 ODF 等格式。它由 OpenOffice.org 和
    IBM 的 Lotus Symphony 演变而来，基于 Apache-2.0 许可证适用于 Linux、macOS 和 Windows。尽管在维护贡献者和及时更新方面面临挑战，它在生产力软件领域仍然具有重要地位，展示了开源项目的活力。


    Calligra Suite 由 KDE 开发，是一套适用于桌面、平板电脑和智能手机的多功能办公和图形艺术套件。它包含了文字处理、电子表格、演示文稿、矢量图形和数据库编辑工具。Calligra
    Words 专注于具有直观设计的文档创建，而 Calligra Sheets 可以轻松处理电子表格。其他组件如 KEXI、Karbon、Plan 和 Stage
    增强了套件的功能，而 Gemini 则为二合一设备提供了灵活的界面。


    OnlyOffice（前身为 TeamLab）是一款免费的办公套件，拥有文本、电子表格、演示文稿、表单和 PDF 的在线编辑器。它支持 DOCX 和 XLSX
    等格式，确保与 Microsoft Office 兼容。它可以作为 SaaS 或私有网络版本使用，具有基于标签的编辑、广泛的样式工具、大量的电子表格函数、演示文稿增强以及全面的
    PDF 编辑功能。


    SoftMaker FreeOffice 是一款适用于 Windows、Mac 和 Linux 的免费办公套件，提供兼容 DOCX、XLSX 和 PPTX
    等 Microsoft Office 格式的文字处理、电子表格和演示工具。它兼顾商务和个人使用，具有自定义界面、触屏设备的触摸模式以及许多创建文档和演示的功能。它与
    Microsoft Office 的兼容性确保了文件的无缝共享。


    WPS Office 包括 WPS 文字、演示和表格，是 Linux 上流行的 Microsoft Office 替代方案，支持 DOCX、XLSX 和 PPTX
    等格式。它通过文本处理、数据分析和演示创建工具（包括一个多功能 PDF 工具包）提高了生产力。免费版提供广泛的功能，专业版可通过订阅获取。WPS Office
    拥有超过 4.94 亿月用户，自 2016 年由志愿者社区开发 Linux 版本以来有了显著提升。


    # LibreOffice


    访问 LibreOffice 官方网站 [`www.libreoffice.org/`](https://www.libreoffice.org/) 了解与
    LibreOffice 相关的所有信息。


    ## 通过软件管理器通过系统软件包/FLATPAK 软件包安装 LibreOffice：


    1. 打开 GNOME 软件并搜索 LibreOffice。

    2. 点击 LibreOffice，然后点击源选择框。

    3. 选择 `SYSTEM PACKAGE` 或 `FLATPAK` 并点击安装。


    ## 在终端通过 APT 安装 LibreOffice：


    ```bash

    sudo apt install libreoffice

    ```


    ## 在终端通过 FLATPAK 安装 LibreOffice：


    ```bash

    flatpak install flathub org.libreoffice.LibreOffice

    ```


    ## 在终端通过 SNAP 安装 LibreOffice：


    ```bash

    sudo snap install libreoffice

    ```


    # Apache OpenOffice


    访问 Apache OpenOffice 官方网站 [`www.openoffice.org/`](https://www.openoffice.org/)
    了解关于 Apache OpenOffice 的所有信息。


    ## 导航至发布页面：


    [`github.com/area-of-dev/OpenOffice.AppImage/releases`](https://github.com/area-of-dev/OpenOffice.AppImage/releases)


    1. 点击 "The Assets" 选项卡查看文件，并选择最新版本的 `OpenOffice.AppImage` 文件。

    2. 将文件下载到你的 `~/Downloads` 文件夹中。

    3. 在下载文件夹中找到 `OpenOffice.AppImage` 文件，右键点击它并选择“属性”（Properties）。

    4. 在属性菜单中，转到“权限”（Permissions）选项卡，并勾选“允许执行文件作为程序”。

    5. 双击 `OpenOffice.AppImage` 文件开始安装。


    ### Apache OpenOffice 桌面快捷方式


    打开终端并使用以下命令进入应用程序目录：


    ```bash

    cd /usr/share/applications

    ```


    运行以下命令打开一个新的 `.desktop` 文件进行编辑：


    ```bash

    sudo gedit openoffice1.desktop

    ```


    在 `openoffice1.desktop` 文件中输入：


    ```ini

    [Desktop Entry]

    Name=Apache OpenOffice

    Comment=Apache OpenOffice

    Exec=./Downloads/OpenOffice.AppImage

    Icon=application

    Terminal=false

    Type=Application

    Categories=Utility;Office;

    ```


    点击“保存”保存你的进度。保存后，关闭编辑器。


