- fmt: '

    Psensor is a GTK+ based software for monitoring hardware temperatures and CPU
    fan speeds in real-time. It can also monitor remote servers and display Linux
    CPU usage. Psensor automatically detects supported hardware, presenting data as
    text and detailed graphs. It includes configurable alarms and alerts for critical
    temperature and fan speed issues.


    Stacer is an open-source system optimizer and application monitor for Linux. It
    allows users to manage startup apps, clean unnecessary files, handle system services
    and processes, and uninstall applications. Stacer also offers real-time resource
    usage monitoring and an APT repository manager for easy package repository edits.


    BleachBit is a tool for freeing up disk space and protecting privacy on Linux
    and Windows. It cleans out unnecessary files and can shred files to prevent recovery.
    BleachBit supports a wide range of applications and includes advanced features
    like vacuuming Firefox to boost speed, making it essential for maintaining system
    performance and security.


    SoundConverter is an audio file converter for the GNOME Desktop, supporting formats
    like Ogg Vorbis, AAC, MP3, and FLAC. It offers fast, multithreaded conversion
    and can extract audio from video files. Users can easily rename files and organize
    folders based on tags, streamlining audio conversion tasks.


    Converseen is a versatile image processor for Windows, Linux, macOS, and FreeBSD.
    It supports over 100 formats, allowing for conversions, resizing, rotation, and
    flipping of images. Users can also transform PDF documents into images and rename
    files in bulk. Converseen is user-friendly and practical for any image processing
    need.


    GParted is a free application for managing disk partitions with GNU Parted. It
    simplifies tasks like creating, resizing, moving, and copying partitions, making
    it useful for setting up new operating systems and reorganizing disk space. GParted
    supports various file systems and storage devices, catering to both novice and
    advanced users.


    HardInfo2 is a system profiler and benchmark tool for Linux, providing detailed
    insights into hardware and software components. It offers extensive reports in
    HTML or plain text and allows benchmark comparisons. HardInfo2 organizes data
    in an accessible format, making it easy to diagnose and analyze system performance
    and hardware specifications.


    gpustat is a command-line utility for monitoring NVIDIA Graphics Devices. It offers
    real-time GPU status querying with features like a built-in watch mode, detailed
    GPU properties, running process names, and power usage. It''s a valuable tool
    for those needing detailed insights into their NVIDIA GPU''s performance.


    Czkawka, named after the Polish word for "hiccup," is a fast and free application
    designed to declutter your computer by removing unnecessary files. Built in Rust,
    it stands out for its speed, using advanced algorithms and multithreading to perform
    tasks efficiently. This open-source tool is ad-free and available on Linux, Windows,
    macOS, and FreeBSD. It offers both CLI and GUI frontends, with the GUI using GTK
    4 or Slint frameworks to suit de different user preferences. Czkawka ensures privacy
    by not accessing the internet or collecting data. It supports multiple languages
    and has various tools for finding duplicates, empty folders, large files, and
    more. It can also search for similar images, videos, and music, and identify invalid
    symbolic links, broken files, and mismatches between file content and extensions.


