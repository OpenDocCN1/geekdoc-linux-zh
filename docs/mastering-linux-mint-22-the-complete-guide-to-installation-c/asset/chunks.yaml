    ## Installing Buttercup via AppImage in the GUI:


    Navigate to the release page at:

    [https://buttercup.pw/](https://buttercup.pw/)


    Click "Linux (AppImage)" to download Buttercup.


    Download the file to your `~/Downloads` folder.


    Locate the `Buttercup-linux-x86_64.AppImage` file in your `Downloads` folder,
    right-click on it, and select "Properties."


    In the Properties menu, go to the "Permissions" tab and check the box to "Set
    as executable."


    Double-click the `Buttercup-linux-x86_64.AppImage` file to start the installation
    process.


    To create a Buttercup AppImage `.desktop` shortcut, follow these steps in your
    terminal:


    Navigate to the applications directory with the command:

    ```

    cd /usr/share/applications

    ```


    Open a new `.desktop` file for editing by running:

    ```

    sudo gedit buttercup1.desktop

    ```


    In the `buttercup1.desktop` file, enter the following details:

    ```

    [Desktop Entry]

    Name=Buttercup

    Comment=Buttercup

    Exec=./Applications/Buttercup.AppImage

    Icon=terminal

    Terminal=false

    Type=Application

    Categories=Utility;Game;

    ```


    To save your progress, click "Save." Alternatively, you can click "File," then
    "Save," or click the ☰ icon, select "Save As," and finally click "Save." After
    saving, close the editor.


    ## Media Players


    Media players, both software and hardware, play audio and video files from sources
    like storage devices, discs, or the internet. They may need codecs for some formats,
    can stream online content, and vary in DVD and Blu-ray support. The choice of
    player can impact media quality, and using multiple players for different formats
    is common. Unlike media servers that store and share files, players are not designed
    for editing but often support subtitles, updates, and skins. Open-source players
    offer extensive format support and customization. Playlists help organize media,
    and some players can convert file formats or stream internet radio. Lightweight
    players use minimal resources, ideal for less powerful systems.


    VLC is a versatile, free, and open-source media player for desktops and mobile
    devices like Android and iOS. Developed by the VideoLAN project, it plays various
    audio, video, and streaming formats, including DVDs. It streams media and transcodes
    files, with built-in codecs from the `libavcodec` library. VLC supports encrypted
    DVD playback on Linux and macOS through `libdvdcss` and is available on major
    app stores, though its legal status varies by region due to DVD decryption.


    Parole Media Player, designed for the Xfce desktop, uses the `GStreamer` framework
    to play various media types, including local files, DVDs, and streams. It’s lightweight,
    extensible with plugins, and efficient with minimal resource use. It supports
    drag-and-drop playlists and basic playback controls but lacks advanced configuration
    options and struggles with corrupted files and high-resolution displays, making
    it less versatile than players like `mpv` or `VLC`.


    SMPlayer, free and open-source for Windows and Linux, offers a seamless experience
    with built-in codecs for any video and audio format. It remembers playback settings
    per file, ensuring you resume with the same settings. As a GUI for `MPlayer`,
    it supports YouTube playback, subtitle downloads, and offers a range of skins
    and advanced features without needing external codecs. Available in over 30 languages,
    SMPlayer makes media playback easy and customizable across platforms.


    Haruna, an open-source video player for KDE Plasma, offers features like online
    video playback via `youtube-dl`, YouTube playlist support, auto-playlists, and
    customizable shortcuts. Its intuitive design and compatibility with various video
    formats make it a top choice for Linux users. With auto-skipping chapters and
    adjustable subtitle settings, Haruna enhances viewing experiences. Available on
    Flathub and Ubuntu repos, it’s a must-try for those seeking a comprehensive media
    player.


    Dragon Player, a multimedia player for the KDE desktop, focuses on simplicity,
    providing a straightforward experience without excessive features. Developed from
    `Codeine` for KDE 3 and now for KDE SC 4, it uses `Phonon` for multimedia framework
    support. Its features include a clean interface, video resumption, subtitle support,
    adjustable video display settings, and CD/DVD playback. Free and open-source,
    Dragon Player is ideal for those who value ease of use over complexity.


    ## VLC


    Visit the official VLC website at [https://www.videolan.org/](https://www.videolan.org/)
    for all things VLC.


    ### Installing VLC via SYSTEM PACKAGE/FLATPAK Package through Software Manager:


    1. Open Software Manager and search for VLC.

    2. Click on VLC, then on the Source Selection Box.

    3. Choose `SYSTEM PACKAGE` or `FLATPAK` and click Install.


    ### Installing VLC via APT in the Terminal:

    ```

    sudo apt install vlc

    ```


    ### Installing VLC via FLATPAK in the Terminal:

    ```

    flatpak install flathub org.videolan.VLC

    ```


    ### Installing VLC via SNAP in the Terminal:

    ```

    sudo snap install vlc

    ```


