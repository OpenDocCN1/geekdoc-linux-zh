    访问 Dash to Panel 官方网站 [`github.com/home-sweet-gnome/dash-to-panel`](https://github.com/home-sweet-gnome/dash-to-panel)
    了解关于 Dash to Panel 的所有信息。


    ### 通过 GUI 安装 Dash to Panel GNOME 扩展


