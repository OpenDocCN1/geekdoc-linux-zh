    Searx 是一个免费的开源元搜索引擎，它通过不共享 IP 地址或搜索历史来优先保护用户隐私。它阻止跟踪 Cookie 并使用 `HTTP POST` 进行查询以增强隐私。灵感源自
    Seeks，Searx 提供了网站的直接链接，并带有缓存或代理视图的选项。它支持跨多个领域的搜索，并允许用户运行私有实例或使用公共实例（包括 Tor 服务）。Searx
    从 80 多个引擎获取结果，自定义设置保存在 cookie 中。它还支持用于特殊搜索操作符进行定制化查询。


    OpenStego 是一个免费的基于 Java 的隐写工具，它可以在图像中隐藏数据并提供水印功能以保护版权，适用于多种平台。它支持加密以增加额外的安全性，使其成为在不改变数字文件外观的情况下隐藏信息或验证所有权的全面解决方案。


    Tor，全称为洋葱路由（The Onion Router），是一种免费软件，通过通过全球志愿者中继网络引导互联网流量来实现匿名通信。它最初是为美国情报部门的安全通信而开发的，现在为数百万用户服务，从监控中隐藏用户的位置和互联网使用情况。尽管初衷是为了隐私和自由，但
    Tor 的用途涵盖了合法活动到非法交易以及信息泄露，引发了关于隐私与安全之间影响的争议。


    i2pd 是一个用于访问 I2P 的 C++ 工具，I2P 是一种通过隐藏用户 IP 地址确保匿名通信的加密网络。与 Java I2P 不同，i2pd 专门专注于路由，不需要
    Java，并且具有更好的性能和更低资源。它支持从文件共享到消息的各种应用程序，同时保持在线的匿名性和安全性。


    # Searx


    访问 Searx 官方网站 [`github.com/searx/searx`](https://github.com/searx/searx) 获取有关
    Searx 的所有信息。


    ## 在终端通过 APT 安装 Searx


    首先，更新您的软件包列表：


    ```bash

    sudo apt update

    ```


    接下来，安装必要的包：


    ```bash

    sudo apt install git rsync make gcc libc6-dev libssl-dev zlib1g-dev libpcre2-dev
    libevent-dev build-essential zlib1g-dev libpcre2-dev libsqlite3-dev libssl-dev
    libevent-dev libsystemd-dev curl wget git libxslt-dev python3-dev python3-babel
    python3-venv python3-pip

    ```


    安装并使用 Node.js 版本 16 的 Node 版本管理器 (NVM)：


    ```bash

    nvm install 16

    nvm use 16

    ```


    准备 Searx 环境：


    ```bash

    cd ~/

    git clone https://github.com/searx/searx.git

    cd searx

    python3 -m venv venv source venv/bin/activate

    ```


    打开 `requirements.txt` 并将任何 `werkzeug` 条目替换为：


    ```text

    werkzeug==2.2.2

    ```


    然后保存更改。


    安装 Python 依赖项：


    ```bash

    pip install -r requirements.txt

    ```


    复制默认设置文件并自定义：


    ```bash

    cp searx/settings.yml searx/settings_custom.yml

    gedit searx/settings.yml

    ```


    根据您的喜好编辑 `settings.yml`，包括更改密钥。


    在 `preferences.py` 中通过将 `advanced_search` 设置为 `True` 来启用高级搜索：


    ```bash

    gedit searx/preferences.py

    ```


    找到 `settings[''ui''].get(''advanced_search'', False)` 并将 `False` 改为 `True`。保存所有更改并退出编辑器。


    激活虚拟环境：


    ```bash

    deactivate

    ```


    启动 Searx：


    ```bash

    sh -c ''/home/username/searx/venv/bin/python /home/username/searx/searx/webapp.py''

    ```


    将 `username` 替换为您的实际用户名。此指南确保 Searx 已安装并配置供个人使用，增强了对搜索数据的隐私保护和控制。


    要为 Searx 创建桌面快捷方式，打开终端并导航到应用程序目录：


    ```bash

    cd /usr/share/applications

    ```


    然后，使用您喜欢的文本编辑器打开名为 `searx1.desktop` 的新文件：


    ```bash

    sudo gedit searx1.desktop

    ```


    在 `searx1.desktop` 文件中输入以下内容，将 `username` 替换为实际系统用户名：


    ```ini

    [Desktop Entry]

    Type=Application

    Name=Searx

    Comment=Searx - 尊重隐私的开源元搜索引擎

    Exec=sh -c ''/home/username/searx/venv/bin/python /home/username/searx/searx/webapp.py''

    Icon=terminal

    Terminal=false

    Categories=Network;WebBrowser;

    ```


    输入细节后，保存进度。最后，退出编辑器。此设置提供了一个从桌面直接启动 Searx 的便捷快捷方式。


