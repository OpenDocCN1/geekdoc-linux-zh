    # 游戏


    在 Linux Mint 22 上玩游戏提供了从传统游戏平台的激动转变，充分利用了 Linux Mint 22 稳健且稳定的环境。通过利用 `Steam Proton`
    和 `Lutris` 等工具，你可以在一个传统上认为不适合游戏的平台上流畅地运行从独立独立游戏到 AAA 大作的各种游戏。这种演变凸显了社区的共同努力，使
    Linux 成为一个对游戏玩家友好的操作系统，展示了在性能和硬件支持方面的显著改进。虽然驱动程序兼容性等挑战仍然存在，但这种进步是不可否认的，为 Windows
    游戏提供了一个耳一新的替代方案，并专注于开源原则和用户控制。


    `Wine-Staging` 可于 [`www.winehq.org/`](https://www.winehq.org/)，它是 `Wine` 的一个测试场，包含了尚未进入开发分支的错误修复和功能。它加快了用户和开发者访问实验性功能。`Wine-Staging`
    作为 `Wine` 开发版本的补丁集，允许维护者选择性地包含补丁。一个专门团队从错误报告开始审查并维护这些补丁，以提高 `Wine` 的性能，特别是对于游戏和应用程序。区别包括用于测试的
    `winehq-staging`、用于稳定版本的 `winehq-stable`、用于开发头文件的 `winehq-devel` 以及用于额外调试工具的 `wine-development`。


    `Lutris` 是一个用于 Linux 的免费开源游戏管理器，它与 `Steam`、`GOG`、`Humble Bundle` 和 `Epic Games
    Store` 等平台集成。它简化了跨各种硬件和软件玩游戏体验，支持超过 20 多个模拟器和 `Wine` 的社区脚本，确保新旧游戏的流畅运行。`Lutris`
    由 Mathieu Comandon 和社区开发，促进了视频游戏的保护，允许用户使用他们的 PC 构建一个开源游戏机。它是一个由 `Linux` 和 `Vulkan`
    驱动的稳定平台，让你的游戏收藏保持活力并易于访问。


    `ProtonUp-Qt` 位于 [`github.com/DavidoTek/ProtonUp-Qt`](https://github.com/DavidoTek/ProtonUp-Qt)，是一个
    GUI 工具，用于简化 Linux 和 Steam Deck 上 `Steam`、`Heroic` 和 `Lutris` 游戏的安装和管理 `GE-Proton`、`Luxtorpeda`
    和 `Wine-GE`。它增强了兼容性，当 Valve 的 `Proton` 不或运行经典游戏升级版时提供解决方案。最新更新 `2.9.1` 包含了 `Steam
    快捷方式编辑器`，切换到 `Ph42oN’ssDxvk-Async` 并改进了 `Wine-GE` 的处理，以及 UI/UX 增强和配置改进，以获得更流畅的游戏设置。


    `Steam` 是领先的 PC 游戏数字平台，提供自动游戏更新、第三方标题分发、匹配机制和社交功能。它为开发者提供 `Steamworks`，支持 `macOS`、`Linux`
    和移动平台，并销售其他数字内容和如 `Valve Index` 等硬件。2013 年以 75% 的份额主导市场，到 2021 年，`Steam` 拥有超过
    34000 款游戏和 1.32 亿用户，引领了如 `Steam Deck` 等创新。


    `DXVK` 是一个基于 `Vulkan` 的层，通过 `Wine` 为 Linux 上的 3D 翻译 `Direct3D 9/10/11`，通过桥接 `DirectX`
    和 `Vulkan` 增强游戏体验，减少开销并提升性能。这一创新标志着 Linux 游戏的关键转折，提供了与 Windows 相当甚至优的体验，使 Linux
    成为游戏玩家更有竞争力的选择。


    `VKD3D` 设计用于在 `Vulkan` 上完全实现 `Direct3D 12` API，主要用于 `Proton''s-Direct3D 12` 支持。它优先考虑性能和游戏兼容性，利用现代的
    `Vulkan` 特，尽管这意味着旧系统可能不受支持。最新版本 `2.12` 引入了 `NVIDIA Reflex` 支持、如 `D3D12 render
    pass API` 等增强，以及针对特定游戏问题的各种修复和变通。它还包含了 `NVIDIA GPU` 上的性能改进以及用于开发者的调试工具，使其成为支持
    `Vulkan` 平台游戏的重要工具。


    # Wine-Staging


    访问 `Wine-Staging` 官方网站 [`wiki.winehq.org/Wine-Staging`](https://wiki.winehq.org/Wine-Staging)
    获取有关 `Wine-Staging` 的所有信息。


    更新包管理器元数据：


    ```bash

    sudo apt update

    ```


    启用 32 位架构支持：


    ```bash

    sudo dpkg --add-architecture i386

    sudo apt update

    ```


    下载并添加 `WineHQ` 仓库密钥：


    ```bash

    sudo mkdir -p /etc/apt/keyrings

    sudo wget -O /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key

    sudo wget -NP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources

    ```


    安装 `WineHQ-Staging`：


    ```bash

    sudo apt update

    sudo apt install winehq-staging gamemode winbind protobuf-compiler libprotobuf-dev
    libopusfile0 winetricks

    ```


