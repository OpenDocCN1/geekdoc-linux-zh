    # pip


    Visit the official `pip` website at [https://pypi.org/project/pip/](https://pypi.org/project/pip/)
    for more information.


    To install `pip`, run the following commands in the terminal:


    ```bash

    sudo apt update

    sudo apt install pip

    ```


    To check the installed `pip` version, run:


    ```bash

    pip3 --version

    ```


    # Node.js & npm


    Visit the official Node.js and npm websites at [https://nodejs.org/](https://nodejs.org/)
    and [https://www.npmjs.com/](https://www.npmjs.com/) for more information.


    To install Node.js and npm, run the following command in the terminal:


    ```bash

    sudo apt install nodejs npm

    ```


    # NVM


    Visit the official NVM website at [https://github.com/nvm-sh/nvm/](https://github.com/nvm-sh/nvm/)
    for more information.


    To install NVM, run the following commands in the terminal:


    ```bash

    sudo apt update

    sudo apt install curl wget

    ```


    To check the installed versions of `curl` and `wget` run:


    ```bash

    curl --version

    wget --version

    ```


    If using `curl`, run:


    ```bash

    curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash

    ```


    If using `wget`, run:


    ```bash

    wget -qO- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash

    ```


    To add NVM to the profile file, run:


    ```bash

    export NVM_DIR="$HOME/.nvm"

    [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" # This loads nvm

    [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"  # This loads
    nvm bash_completion

    ```


    ## NVM Usage Examples


    To install a specific version of Node.js and npm on a user level, run:


    ```bash

    nvm install 16

    ```


    To use a specific version of Node.js and npm on a user level, run:


    ```bash

    nvm use 16

    ```


