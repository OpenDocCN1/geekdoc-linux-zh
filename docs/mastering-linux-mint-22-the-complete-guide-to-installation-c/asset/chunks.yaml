    sudo tee /etc/apt/sources.list.d/librewolf.sources << EOF > /dev/null

    Types: deb

    URIs: https://deb.librewolf.net

    Suites: $distro

    Components: main

    Architectures: amd64

    Signed-By: /usr/share/keyrings/librewolf.gpg

    EOF

    sudo apt update && sudo apt install librewolf

    ```


