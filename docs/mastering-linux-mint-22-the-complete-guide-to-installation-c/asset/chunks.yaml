    ## Web 浏览器


    Web 浏览器是允许我们从网络或本地存储获取内容并显示在设备上以访问网站的工具。无论是在电脑还是手机上，当我们输入 URL 时，像 `Google Chrome`
    和 `Safari` 等浏览器会连接到网络服务器，允许我们通过 `HTTPS` 安全地浏览页面。它们与搜索引擎不同，其作用是渲染网页、存储用于个性化和追踪的
    cookie，并使用缓存加速重复访问。隐私功能有助于管理这些 cookie，确保获得更安全的浏览体验。


    Chromium 是 Google 推出的一个开源浏览器项目，旨在构建更安全、更快速的网络。与 `Chrome` 不同，它是完全开源的，缺少了自动更新和某些解码器等功能。它是许多浏览器（包括
    `Chrome` 和 `Edge`）的基础，通过其多进程架构和各大科技巨头的贡献来关注安全性。


    Ungoogled-Chromium 是 Chromium 的一个版本，经过修改消除了对 Google Web 服务的依赖，同时保持原始体验。它增强了隐私性和控制力，需要手动激活某些功能。它阻止了内部
    Google 请求，并借鉴了来自 `Inox` 和 `Bromite` 等项目的调整，以提供注重隐私的浏览体验。


    Google Chrome 于 2008 年发布，是 Google 的一款流行 浏览器。它基于 `Apple WebKit` 和 `Mozilla Firefox`
    的免费软件构建，适用于多个平台，包括 Windows、Linux、macOS、iOS 和 Android。它以性能强大著称，具有极简的界面和独特的工具，如用于
    URL 和搜索的 `omnibox`，以及用于扩展和主题的完善 `Chrome 应用商店`。


    Microsoft Edge 由微软于 2015 年发布，从其最初的 `EdgeHTML` 基础演变为 2020 年的 Chromium 基础。这一变化增强了跨设备的兼容性和性能。`Edge`
    具有 PDF 读取、`WebAssembly` 支持以及用于兼容的 `Internet Explorer` 模式。它与微软的服务无缝集成，提供语音控制、搜索功能和清爽的`阅读模式`。


    Thorium Browser 是 Chromium 的一个高性能变体，针对现代 CPU 进行了优化。它镜像了 Google Chrome 的功能，但引入了改进速度和隐私的增强和补丁。它排除了
    Google 的遥测数据，并默认集成了替代搜索引擎，迎合技术丰富的群体。


    Vivaldi 由 Vivaldi Technologies 于 2015 年发布，面向追求丰富功能和定制化的技术爱好者以及前 Opera 用户。它提供了独特的
    UI 定制、内置的广告和追踪器拦截、邮件支持以及创新的标签页管理，支持 `Chrome` 和 `Firefox` 扩展。


    Brave 是一款注重隐私的免费开源浏览器，默认阻止大多数广告和追踪器。它通过观看可选广告向用户发放`基础注意力代币 (BAT)`。Brave 包含内置 `VPN`、加密钱包和自己的搜索引擎，优先考虑用户知情和隐私。


    Firefox 由 Mozilla 开发，是一款免费开源 Web 浏览器，以速度、隐私功能和灵活性闻名。它支持多个平台，并使用 `Gecko` 引擎遵循网络标准。功能包括标签页浏览、隐私浏览和各种开发者工具。Firefox
    因其对用户隐私和网络标准的承诺而保持流行。


    Firefox ESR 专为不需要频繁更新的稳定 Web 部署组织设计。它专注于安全性和修复而非最新功能，提供无比拟的数据保护和灵活的部署，是企业和大学的理想选择。


    Waterfox 是 Firefox 的分支，专注于伦理、用户隐私和性能。它支持 Firefox 插件，并通过禁用遥测来强调隐私。Waterfox 确保在不牺牲速度或功能的情况下提供安全的浏览体验。


    LibreWolf 是一个独立的 Firefox 变体，专注于隐私、安全和自由。它增强了针对追踪和指纹识别的防护，排除了遥测，并预装了 `uBlock Origin`
    以实现无广告浏览。


    Pale Moon 是一款针对现代处理器优化的免费开源浏览器。它基于自己的 `Goanna` 引擎构建，专注于效率、定制和隐私，支持经典插件和广泛的定制。


    Mullvad Browser 与 Tor 项目共同开发，增强了在线隐私。它默认开启隐私浏览，不留下任何 cookie 或历史记录，并反指指纹。它针对隐私进行了微调，最大限度地减少追踪和指纹识别。


    Basilisk 基于 `Goanna` 引擎和 `UXP` 平台，提供稳定、抗更改的浏览体验。它支持现代网络标准和各种插件，提供熟悉的浏览体验。


