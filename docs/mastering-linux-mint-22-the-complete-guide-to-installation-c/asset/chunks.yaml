    \ universe multiverse`\n\nSave your changes by clicking “Save” or using the menu\
    \ options.\n\n## Setting Up Repositories via Command Line From The Terminal\n\n\
    Run the following commands in the terminal:\n\n```\nsudo apt update\nsudo apt\
    \ upgrade\nsudo add-apt-repository main universe restricted multiverse\nsudo apt\
    \ update\nsudo apt upgrade\n```\n\n## Updating Linux Mint 22\n\nUpdating Linux\
    \ Mint 22, known as ‘Wilma’, can be accomplished through two primary methods.\
    \ The first method is user-friendly, utilizing the graphical interface of the\
    \ Update Manager. Here, you can simply click a few buttons to initiate the update\
    \ process. Alternatively, for those comfortable with command-line operations,\
    \ a series of commands can be executed in the terminal to achieve the same result.\n\
    \nBeyond manual updates, Linux Mint offers the convenience of automatic updates\
    \ upon system shutdown. This feature is enabled by installing and configuring\
    \ the `unattended-upgrades` package. Once set up, this package ensures your system\
    \ remains up-to-date automatically, eliminating the need for manual intervention.\n\
    \nIf you find the frequency of update notifications intrusive, Linux Mint provides\
    \ a solution for this as well. You can partially disable these notifications by\
    \ adjusting the settings of the Update Manager in the Startup Applications. This\
    \ customization allows you to control the level and frequency of update notifications\
    \ according to your preference.\n\nFor users interested in more advanced customization,\
    \ such as changing or updating the Linux Mint kernel, guidance is available through\
    \ the official repositories provided by the Linux Mark Institute. These repositories\
    \ offer the necessary resources and instructions for safely updating and changing\
    \ the kernel, ensuring compatibility and stability for your system.\n\nIn summary,\
    \ Linux Mint 21.3 offers a flexible and user-friendly approach to system updates,\
    \ whether you prefer a graphical interface, command-line methods, automatic updates,\
    \ or custom kernel modifications. Each option is designed to cater to different\
    \ user needs and preferences, ensuring a smooth and secure operating experience.\n\
    \n## Updating Linux Mint Through Update Manager (GUI)\n\n1. **Launch Update Manager**:\
    \ Open the Update Manager from the application menu.\n2. **Continue Prompt**:\
    \ Click on \"Continue\" when prompted.\n3. **Local Mirror Option**: Next to \"\
    Do you want to switch to a local mirror,\" click on \"Yes.\"\n4. **Close Prompt**:\
    \ Close the prompt by clicking on the \"X\" button.\n5. **Refresh Package List**:\
    \ Click on \"Refresh\" to update the package list.\n6. **Select Update**: Choose\
    \ an update, such as `vim`.\n7. **Read Description**: Click on the \"Description\"\
    \ tab to read the software package's description.\n8. **Review Packages**: Switch\
    \ to the \"Packages\" tab to review the installed packages affected by the update\
    \ and the total update size in KB.\n9. **Check Changelog**: Go to the \"Changelog\"\
    \ tab to see the update's changes.\n10. **Select Update for Installation**: Tick\
    \ the box next to the update you want to carry out.\n11. **Install Updates**:\
    \ Click on \"Install Updates\" to begin the installation.\n12. **Wait for Application**:\
    \ Wait for the changes to be applied.\n13. **Refresh Again**: Click on \"Refresh\"\
    \ again.\n\n**Close Update Manager**: Close the Update Manager by clicking on\
    \ the \"X\" button.\n\n## Updating Linux Mint Through the Command Line\n\nTo update\
    \ your system using the terminal:\n\nRun the following commands:\n\n```\nsudo\
    \ apt update\nsudo apt upgrade\n```\n\nTo issue an upgrade command with pre-approved\
    \ confirmation, run:\n\n```\nsudo apt update && sudo apt upgrade -y\n```\n\n##\
    \ Automating Updates On Linux Mint 22\n\nTo set up unattended updates in Linux\
    \ Mint 22, follow these steps:\n\n1. Open the terminal and run:\n```\nsudo apt\
    \ update\nsudo apt install unattended-upgrades\nsudo nano /etc/apt/apt.conf.d/50unattended-upgrades\n\
    ```\n\n2. Edit the `50unattended-upgrades` file with the following contents:\n\
    ```\nUnattended-Upgrade::Origins-Pattern {\n\"origin=Debian,codename=${distro_codename},label=Debian\"\
    ;\n   \"origin=Debian,codename=${distro_codename},label=Debian-Security\";\n\"\
    origin=Debian,codename=${distro_codename}-security,label=Debian-Security\";\n\
    };\nUnattended-Upgrade::InstallOnShutdown \"true\";\nUnattended-Upgrade::Remove-Unused-Dependencies\
    \ \"true\";\nUnattended-Upgrade::OnlyOnACPower \"true\";\n```\n\n3. Save by pressing\
    \ `CTRL + S`, then exit by pressing `CTRL + X`.\n4. Run the following command:\n\
    ```\nsudo nano /etc/apt/apt.conf.d/10periodic\n```\n\n5. Edit the `10periodic`\
    \ file with the following contents:\n```\nAPT::Periodic::Update-Package-Lists\
    \ \"1\";\nAPT::Periodic::Download-Upgradeable-Packages \"1\";\nAPT::Periodic::AutocleanInterval\
    \ \"7\";\nAPT::Periodic::Unattended-Upgrade \"1\";\n```\n6. Save by pressing `CTRL\
    \ + S`, then exit by pressing `CTRL + X`.\n7. Run the following commands:\n```\n\
    cd /etc/systemd\nsudo nano logind.conf\n```\n\n8. Edit the `logind.conf` file\
    \ with the following content:\n```\nInhibitDelayMaxSec=1800\n```\n9. Save by pressing\
    \ `CTRL + S`, then exit by pressing `CTRL + X`.\n10. Finally, run these commands\
    \ to enable and start unattended upgrades:\n```\nsudo systemctl enable unattended-upgrades\n\
    sudo systemctl start unattended-upgrades\nsudo systemctl status unattended-upgrades\n\
    ```\nThese steps will install, configure, start, and check the status of automatic\
    \ updates on Linux Mint 22.\n\n## Disabling Update Notifications\n\n1. **Open\
    \ Startup Applications**: Access this from the application menu.\n2. **Disable\
    \ Update Manager**: Find \"Update Manager\" and turn off its switch.\n3. **Close\
    \ Window**: Click on the \"X\" button to close.\n\n## Updating Kernel In Linux\
    \ Mint 22\n\nFor more information about the Linux kernel in general consult the\
    \ official website at `https://www.kernel.org/`.\n\n### Updating Linux Mint Kernel\
    \ via GUI:\n\n1. **Access Update Manager**: Open it from the application menu.\n\
    2. **View Kernels**: Click on \"View\" and then select \"Kernels.\"\n3. **Select\
    \ Kernel**: Choose the highest kernel number available.\n4. **Install Kernel**:\
    \ Click on \"Install.\"\n\nComplete Installation: After installation, click on\
    \ \"Close.\"\n\n## Linux Mint 22 Software Sources\n\nLinux Mint 22 Software Sources\
    \ aim to provide users with access to a wide range of software without needing\
    \ virtualization tools. This ensures that users can install and run software easily,\
    \ without relying on applications that emulate filesystems from other Linux distributions\
    \ like Arch, Ubuntu, or openSUSE Tumbleweed, such as `distrobox` and `BoxBuddy`.\n\
    \nThe Linux Mint Software Manager lets you easily manage apps. It’s a user-friendly\
    \ GUI that comes pre-installed. With access to many open-source and proprietary\
    \ apps, you can install, update, and remove software quickly. Its clean, intuitive\
    \ interface is great for Linux newbies, and its powerful search feature makes\
    \ finding apps a breeze.\n\nAPT stands for Advanced Package Tool, a powerful utility\
    \ for managing software on Debian and its derivatives. It installs, updates, and\
    \ removes software packages. APT uses repositories, which are directories of software.\
    \ You can use APT with `sudo` to gain superuser privileges for more control.\n\
    \nSetting Software Install as the default for `.rpm` files allows you to easily\
    \ open and install them with a double-click, making it much more user-friendly\
    \ than using the command line.\n\nSetting GDebi as the default for `.deb` files\
    \ details how to set GDebi as the default application. Unlike Software Install,\
    \ GDebi automatically fetches the required packages, avoiding the need to run\
    \ `sudo dpkg -i` and `sudo apt install -f` commands.\n\nFlatpak covers the installation\
    \ of the Flatpak protocol on Linux Mint 22, including the addition of the Flatpak\
    \ plugin for GNOME Software. This makes browsing and installing Flatpak applications\
    \ easier without using a web browser. It also includes basic Flatpak command line\
    \ operations like adding, listing, and removing applications.\n"
