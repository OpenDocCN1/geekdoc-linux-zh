  raw: 'The default systemd timeout, typically set at 90 seconds, governs how long
    systemd waits for a service to start or stop before considering the operation
    failed. This timeout mechanism ensures system responsiveness by preventing indefinitely
    hanging services. However, for more flexibility, systemd allows adjusting this
    timeout according to specific needs, enabling services to have customized timeout
    settings that can deviate from the default.


    Immutable files and folders are digital assets that cannot be modified or deleted
    once created. This characteristic ensures data integrity and security, especially
    in environments where preserving historical accuracy and preventing unauthorized
    changes are crucial. While the concept seems rigid, it''s a safeguard against
    data tampering and loss, offering reliability and peace in knowing that critical
    information remains untouched.


    FFmpegthumbnailer is a lightweight tool designed to quickly generate video thumbnails,
    enhancing file management efficiency. Utilizing the powerful ffmpeg library, it
    decodes video frames, with its capabilities tied to ffmpeg''s configuration. Renowned
    for its speed and minimal resource usage, FFmpegthumbnailer is essential for file
    managers, streamlining the process of creating visually informative thumbnails
    for video files, aiding in quicker identification and access to video content.


    Linux .desktop files are simple text files that provide essential information
    to the desktop environment about software applications. They define how a program
    is launched, its name, and the icon it uses. These files make it easier for users
    to interact with applications through graphical interfaces by enabling the creation
    of shortcuts.


    In Linux Mint 22, power settings let users manage how their computer uses energy,
    crucial for extending battery life and efficiency. These settings include options
    for screen brightness, sleep mode, and the behavior when the laptop lid is closed.
    Users can easily customize these preferences via the system settings panel, ensuring
    their device operates optimally while conserving power.


    Night Light (GNOME)


    Visit the official Night Light (GNOME) website at [https://foundation.gnome.org/](https://foundation.gnome.org/)
    for all things Night Light (GNOME).


    Setting Up Night Light (GNOME) via the GUI:


    Open the application menu and select "Settings."


    Navigate to the "Displays" tab on the left sidebar, then click on "Night Light."


    Toggle the switch next to "Night Light" to enable it.


    In the "Schedule" row, click the dropdown box and choose "Manual Schedule."


    Set the active period from 21:00 to 06:00.


    Adjust the color temperature slider to a position just slightly below the midpoint
    between the third and fourth white lines.


    Night Light (Cinnamon & Redshift)


    Visit the official Night Light (Cinnamon & Redshift) websites at [https://github.com/linuxmint/cinnamon](https://github.com/linuxmint/cinnamon)
    and [https://github.com/jonls/redshift](https://github.com/jonls/redshift) for
    all things Night Light (Cinnamon & Redshift).


    Installing and Setting Up Night Light (Cinnamon & Redshift) via the Terminal and
    GUI:


    sudo apt install redshift redshift-gtk wayland*


    Navigate to your config directory with:


    cd ~/.config


    Edit the Redshift configuration by typing:


    nano redshift.conf


    Input the following settings:


    [redshift]


    temp-night=2250


    transition=1


    brightness=1.0


    gamma=1.0


    [location]


    adjustment-method=vidmode


    location-provider=manual


    Save changes with CTRL + S and exit with CTRL + X.


    PipeWire Sound Crackle & Popping Fixes


    Visit the official PipeWire website at [https://pipewire.org/](https://pipewire.org/)
    for all things PipeWire.


    To fix potential sound issues like crackling or popping with PipeWire via Command
    Line and GUI:


    Disable audio power saving:


    echo "options snd_hda_intel power_save=0" | sudo tee -a /etc/modprobe.d/audio_disable_powersave.conf


    echo "options snd_hda_intel power_save_controller=N" | sudo tee -a /etc/modprobe.d/audio_disable_powersave.conf


    Verify the changes:


    cat /sys/module/snd_hda_intel/parameters/power_save


    cat /sys/module/snd_hda_intel/parameters/power_save_controller


    Edit the PipeWire configuration to optimize performance:


    sudo gedit /usr/share/pipewire/pipewire.conf


    Adjust the quantum settings:


    Change #default.clock.quantum = 1024 to default.clock.quantum = 2048.


    Modify default.clock.min-quantum = 16 to default.clock.min-quantum = 2048.


    Update #default.clock.max-quantum = 2048 to default.clock.max-quantum = 4096.


    Save changes and restart PipeWire services:


    systemctl --user restart pipewire.service pipewire-pulse.service pipewire-media-session.service


    systemctl --user restart pipewire-multi.service


    Enhance audio priority by editing:


    sudo gedit /etc/security/limits.conf


    Add:


    @audio   -  nice     -20


    Save and exit.


    Remove potential conflicts by purging speech-dispatcher:


    sudo apt remove speech-dispatcher


    Ensure all changes are consistent across PipeWire configurations. Save and back
    up necessary files, then restart your computer.


    Linux Mint 22 System Variables


    Setting Up Linux Mint 22 System Variables via the Command Line and GUI:


    Edit the system-wide Bash configuration file:


    sudo gedit /etc/bash.bashrc


    Add the following settings:


    # Environment Variables


    #export STAGING_WRITECOPY=''1''


    #export DXVK_ENABLE_NVAPI=''1''


    #export WINEESYNC=''1''


    #export WINEDEBUG=''-all''


    #export __GL_SHADER_DISK_CACHE_SKIP_CLEANUP=''1''


    #export __GL_THREADED_OPTIMIZATION=''1''


    #export STAGING_SHARED_MEMORY=''1''


    #export WINE_SIMULATE_WRITECOPY=''1''


    #export DXVK_STATE_CACHE_PATH=''/home/username/.wine/drive_c/Program Files (x86)/Battle.net''


    #export __GL_SHADER_CACHE=''/home/username/.wine/drive_c/Program Files (x86)/Battle.net''


    #export VKD3D_SHADER_CACHE_PATH=''/home/username/.wine/drive_c/Program Files (x86)/Battle.net''


    #export VKD3D_CONFIG=''dxr''


    #export exclude_processes=''Agent.exe "Battle.net Helper.exe''


    Replace username with your actual username where applicable. Save changes by clicking
    "Save" or through the File menu.


    Setting Image As Background In Gnome & Cinnamon


    Visit the official Cinnamon website at [https://github.com/linuxmint/cinnamon](https://github.com/linuxmint/cinnamon)
    for all things Cinnamon.


    To set an image as the background:


    Right-click on the image file and select "Set as Background."


    mount_options.conf


    Visit the official udisks website at [https://www.freedesktop.org/wiki/Software/udisks/](https://www.freedesktop.org/wiki/Software/udisks/)
    for all things udisks.


    To set up mount_options.conf via Command Line and GUI:


    sudo apt update


    sudo gedit /etc/udisks2/mount_options.conf


    Add the following content:


    [defaults]


    ntfs_defaults=uid=$UID,gid=$GID


    ntfs_allow=uid=$UID,gid=$GID,nls,umask,dmask,fmask,nohidden,sys_immutable,discard,force,sparse,showmeta,prealloc,no_acs_rules,acl,noatime


    Save progress by clicking "Save," or through the File menu.


    Adding Startup Applications In Cinnamon


    To add startup applications via GUI in Linux Mint 22:


    Open the Application Menu using the Super key. Navigate to "Startup Applications,"
    click the + button, and select "Choose Application."


    Type the name of the application you want to load at startup, select it, and click
    "Add."


    For adding a custom command:


    Open "Startup Applications" from the Application Menu with the Super key.


    Click the + button and choose "Custom Command."


    Enter a name for the command, the command itself (e.g., "discord" to launch Discord),
    a detailed comment, and set a startup delay if needed.


    Click "Save."


    To add startup applications via Command Line:


    Open the terminal. Navigate to the directory containing application shortcuts
    with:


    cd /usr/share/applications


    List all files with:


    dir


    Identify the .desktop file for the application (e.g., firefox.desktop).


    Copy this file to the autostart folder with:


    sudo cp firefox.desktop /etc/xdg/autostart


    Adding Startup Applications In GNOME


    To add startup applications in GNOME via GUI:'
