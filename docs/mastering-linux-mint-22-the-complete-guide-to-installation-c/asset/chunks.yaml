    ```bash

    sudo apt update

    sudo apt install gdebi libglib2.0-0 libxcb-shape0 libxcb-shm0 libxcb-xfixes0 libxcb-randr0
    libxcb-image0 libfontconfig1 libgl1-mesa-glx libxi6 libsm6 libxrender1 libpulse0
    libxcomposite1 libxslt1.1 libsqlite3-0 libxcb-keysyms1 libxcb-xtest0 ibus libegl1-mesa
    libxcb-cursor0

    ```


    ## Navigate to the release page at:


    [https://zoom.us/download?os=linux](https://zoom.us/download?os=linux)


    1. Click the box in the same row as Linux Type.

    2. Select `Debian`.

    3. Click the box in the same row as OS Architecture.

    4. Select `64-bit`.

    5. Click `Download` to download Zoom.

    6. Go to your Downloads folder.

    7. Double-click `zoom_amd64.deb`.

    8. Click `Install`.


