    进入 BIOS 后，导航到启动菜单选项。在启动队列中找到 USB 驱动器并将其移动到列表末尾，以确保系统在尝试从 USB 驱动器启动之前会优先考虑其他启动选项。


    在 BIOS 设置中切换到高级模式（Advanced Mode）。在高级模式下，找到并选择 `Settings` 选项，然后从 `Settings` 菜单中找到并选择
    `Boot` 选项。


    在 `Boot` 菜单中，搜索 `UEFI Hard Disk Drive Priorities` 并选择第一项。使用方向键导航并高亮 `Ubuntu` 选项，然后按
    `ENTER` 键确认将 `Ubuntu` 设置为所需的启动项。


    保存 BIOS 设置中的更改并退出 BIOS，以便系统重启。


    # Linux Mint 22 首次登录


    首先选择安装阶段建立的用户名并输入相应的密码，然后点击“Let''s go!”按钮。


    接下来，找到日出和日落符号之间的开关，将开关向右移动开启深色模式。找到并取消勾选“启动时显示此对话框”旁框，然后点击 `✕` 符号关闭对话框。


    要关闭 `Update Manager`（更新管理器），访问任务栏，右键点击 `Update Manager` 图标并选择“退出”以结束进程。


    # 特殊特性概览


    ## 密码输入与确认


    使用需要特殊权限的命令（如 `su -`、`sudo apt update` 或 `sudo snap install`）时，必须输入密码。这是安装期间设置或在账户设置中更新的密码。这是一个简单的安全步骤！


    示例：


    ```bash

    example@example:~$ sudo apt update

    [sudo] password for example: ********

    ```


    ## 使用移动家庭宽带安装和更新软件包


    使用移动家庭宽带连接更新 Linux Mint 22 时，我经常无法一次性获取所有必要的包。这通常需要重新执行安装和更新步骤。此问题似乎是移动宽带特有的，在使用
    `ADSL`、`ADSL 2`、`FTTC` 或 `FTTP` 时不会发生。


    ## NVIDIA 显卡上的 Wayland GDM3 图异常


    使用 `MSI NVIDIA 1060 6GB` 和 `Gigabyte NVIDIA RTX 3060 12GB` 显卡时，我在 `gdm3` 登录界面遇到了图形问题。这是由于默认的
    `Wayland` 合成器与 NVIDIA 卡之间的兼容性限制。解决方法很简单：在登录前点击屏幕右角的齿轮图标并选择“GNOME on Xorg”。这确保了无故障的登录体验，因为
    `Xorg` 与 NVIDIA 显卡的兼容性更好。


    ## 解决 .deb 文件的缺失包


    要方便地安装 `.deb` 文件，请使用：


    ```bash

    sudo apt install ./example.deb

    ```


    这将查找并安装您的 `.deb` 文件所需的任何包。


    ## 将 Snap .desktop 快捷方式传输到系统级应用


    有时，通过 `Snap` 安装的应用程序的 `.desktop` 快捷方式可能无法通过菜单或 `/usr/share/applications` 文件夹访问。


    要使 snap 应用程序可用，请遵循以下步骤：


    ```bash

    cd /var/lib/snapd/desktop/applications

    sudo cp discord_discord.desktop /usr/share/applications

    ```


    这些命令导航到 snap `.desktop` 快捷方式的安装目录，并将它们复制到系统级应用文件夹，确保它们可以通过应用程序菜单访问。


    ## 通过 Wine-Staging 安装 Battle.net 时系统短暂卡顿


    通过相关的 `battle.net` 安装 `exe` 文件首次安装 `battle.net` 时，系统可能会卡顿一段时间（有时很长），然后恢复响应。另一方面，当我通过
    `Wine` 安装 `battle.net` 且发生卡死时，我只需等待片刻卡死结束，然后重启系统，重新开始安装过程即可正常运行。

