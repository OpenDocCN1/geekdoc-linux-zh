    # 虚拟化


    虚拟化软件称为虚拟机管理程序（hypervisor），允许一台计算机充当多台虚拟机，允许不同的操作系统在单台 PC 上同时运行。这项技术优化了资源利用，简化了备份，并允许各种操作系统和过时的应用程序无缝运行。它通过将潜在威胁与恶意软件和浏览器漏洞隔离来增强安全性。除了个人用途外，虚拟化还支持基础设施服务（IaaS），提高了企业的扩展性和效率，降低了成本并改进了灾难恢复和测试。它体现了灵活、高效的计算，以少胜多。


    Oracle VirtualBox 是一款多功能的虚拟化工具，适用于企业和个人使用，支持 Windows、Linux 和 macOS 等多种操作系统。它提供了丰富的功能来实现高性能，能够适应许多客操作系统，包括不同的
    Windows 版本和 Linux 发行版。作为 GPL v3 下的开源软件，VirtualBox 在保持专业质量的同时邀请社区贡献，并由 Oracle 支持。定期更新扩展了支持的系统和功能，并包含了开发人员所需的预构建虚拟机等资源。


    Virt-manager 主要由红帽开发，是一个通过 `libvirt` 管理虚拟机（VM）的桌面工具。它允许用户创建、编辑、启动和停止虚拟机，并查看其性能和控制台。自
    2014 年以来，它支持 KVM、Xen、QEMU、LXC 容器以及 FreeBSD 的 bhyve 虚拟机管理程序。该套件包含了用于轻松设置虚拟机的 `virt-install`、用于虚拟机显示交互的
    `virt-viewer`、用于克隆虚拟机的 `virt-clone`、用于编辑虚拟机配置的 `virt-xml` 以及为基于 libvirt 的容器设置根文件系统的
    `virt-bootstrap`。


    # Oracle VirtualBox


    访问 Oracle VirtualBox 官方网站 [`www.virtualbox.org/`](https://www.virtualbox.org/)
    了解有关 Oracle VirtualBox 的所有信息。


    ## 通过终端通过 APT 安装 Oracle VirtualBox：


    ```bash

    sudo apt update && sudo apt upgrade

    cd

    wget -q https://www.virtualbox.org/download/oracle_vbox_2016.asc -O- | rpm --import
    -

    sudo apt update

    sudo apt install virtualbox-7.0

    ```


    ## 通过 GUI 通过 DEB 安装 Oracle VirtualBox：


    1. 导航到发布页面：[`www.virtualbox.org/wiki/Linux_Downloads`](https://www.virtualbox.org/wiki/Linux_Downloads)

    2. 点击最新的 Ubuntu 24.04 软件包链接下载 Oracle VirtualBox。

    3. 进入您的下载文件夹：双击 `virtualbox-7.0_7.0.18-162988~Ubuntu~noble_amd64.deb`。

    4. 点击“安装”完成安装。


    ## 将用户添加到 vboxusers 组：


    切换到 root 用户：


    ```bash

    su -

    ```


    将您的用户名添加到 `vboxusers` 组（将 "username" 替换为实际用户名）：


    ```bash

    sudo usermod -aG vboxusers username

    ```


    退出 root 用户：


    ```bash

    exit

    ```


    重启系统以应用更改：


    ```bash

    sudo reboot

    ```


