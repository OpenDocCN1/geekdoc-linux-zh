    Cinnamon 插件通过提供实用工具来增强您的 Linux Mint 22 体验，例如“强制退出”插件，它允许您通过点击来关闭无响应的窗口。要创建一个插件，需要分配一个唯一的
    ID，创建一个包含 `metadata.json` 文件的文件夹用于存储插件信息，以及一个用于代码的 `applet.js` 文件。插件存储在本地或系统范围的
    Cinnamon 插件目录。通过简单的 API，插件可以适应各种面板方向和尺寸，确保在多个实例中的功能可用性。请访问 Cinnamon 官方网站 [`github.com/linuxmint/cinnamon`](https://github.com/linuxmint/cinnamon)
    获取更多详情。


    Cinnamon 中的分组窗口列表（Grouped Window List）插件在面板中按应用程序组织打开的窗口，与其他操作系统的任务栏功能。它通过将同一应用程序的多个实例归类到单个图标下，简化了它们之间的导航，提供悬停预览，并允许快速切换或管理窗口。该插件增强了效率和工作区的组织，使管理已打开的应用并保持桌面环境整洁变得更加容易。可以在
    [`cinnamon-spices.linuxmint.com/applets/view/27`](https://cinnamon-spices.linuxmint.com/applets/view/27)
    了解更多。


    Cinnamon Windows Alt-Tab 切换器提供多种样式，如图标、缩略图或组合，通过更大的图标和详细预览使导航更加容易。用户可以从系统设置调整图标大小和样式。Cinnamon-Alt-Tab-Enhanced
    项目增加了诸如支持多个工作区、更大的缩略图视图以及全面的键盘鼠标支持等功能，增强了用户体验。可以在 [`github.com/linuxmint/cinnamon-screensaver`](https://github.com/linuxmint/cinnamon-screensaver)
    找到更多信息。


    Cinnamon 菜单插件简化了访问系统上安装的应用程序。只要有相应的 `.desktop` 文件，用户就可以通过输入名称或别名轻松启动应用程序。该插件还将应用程序组织分类分类，使导航和发现更加直观。它弥补了用户便利与系统功能之间的鸿沟，确保查找和运行任何应用程序都是一个流畅且直接的过程。可以在
    [`github.com/linuxmint/Cinnamon`](https://github.com/linuxmint/Cinnamon) 找到更多详情。


    Cinnamon 桌面环境的日历插件提供了类似于 Windows XP 的时间显示，Windows XP 是微软广受好的操作系统。此功能允许用户模拟 Windows
    XP 的外观和氛围，同时避免其编程限制。此外，它还支持 12 小时制，与军事风格的 24 小时制形成对比，提供了一种友好的计时方法。访问 [`github.com/linuxmint/cinnamon-spices-applets`](https://github.com/linuxmint/cinnamon-spices-applets)
    获取更多信息。


    ## 分组窗口列表


    通过图形用户界面设置分组窗口列表，首先从应用程序菜单启动 `Firefox`。


    打开后，最小化该程序。


    右键点击面板上的 `Firefox` 图标并选择“配置”。


    导航到“面板”（Panel）选项卡。


    在“按钮标签”（Button label）选项中，点击框框并选择“窗口标题”（Window Title）。


    ## Cinnamon Windows Alt-Tab 切换器


    通过图形用户界面设置 Cinnamon Windows Alt-Tab 切换器，请遵循以下步骤。


    打开应用程序菜单并运行 `Windows` 命令。


    导航到 `Alt-Tab` 区域并找到“Alt-Tab 切换器样式”（Alt-Tab switcher style）选项。


    点击旁边的复选框并从下拉菜单选择“仅缩略图”（Thumbnails only）。


    ## Cinnamon 菜单插件


    通过图形用户界面设置 Cinnamon 菜单插件，右键点击菜单按钮并选择“配置”。


    导航到“面板”（Panel）选项卡。通过向右滑动开关启用“使用自定义图标和标签”（Use a custom icon and label）选项。


    在“文本”（Text）字段中，按 `CTRL` + `A` 选择所有文本，然后按 `DEL` 清空。


    输入“ Start”作为新标签。对于图标，点击同一行中的框框。


    在搜索框中，按 `CTRL` + `A` 选择所有文本，然后按 `DEL` 清空。


    在搜索中输入 `start-here`，当它出现时选择 `start-here` 图标，并点击“选择”完成选择。


    ## Cinnamon 日历插件


    要通过 GUI 在 Cinnamon 日历插件中设置自定义日期格式，右键点击通常位于屏幕右下角的 `Calendar` 插件。


    从插件中选择“配置”。


    ```

    %I:%M

    ```


