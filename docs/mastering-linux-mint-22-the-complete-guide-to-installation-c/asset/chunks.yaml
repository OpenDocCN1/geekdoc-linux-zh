    # 通过软件管理器通过 FLATPAK 软件包安装 Czkawka


    1. 打开软件管理器并搜索 `Czkawka`。

    2. 点击 `Czkawka`，然后点击源选择框。

    3. 选择 `SYSTEM PACKAGE` 并点击安装。


    # 在终端中通过 FLATPAK 安装 Czkawka


    ```bash

    flatpak install flathub com.github.qarmin.czkawka

    ```


    # 在终端中通过 SNAP 安装 Czkawka


    ```bash

    sudo snap install czkawka

    ```


    # 通讯


    即时通讯软件允许用户通过网络上的文本进行即时通信。与电子邮件不同，对话是实时发生的，并且通常带有表情符号、语音聊天、视频聊天和文件共享等功能。它对于快速交流非常有用，但依赖于中央服务器，这引发了隐私担忧。某些服务包括聊天室和移动消息，增强了连接性。然而，用户可能面临服务停用和隐私问题。


    Discord 是一个用于即时消息、语音和视频通话的社交平台。它通过服务器支持社区，用户可以在其中聊天、分享媒体和闲逛。由于拥有适用于各大平台的应用程序，它在玩家和各种兴趣小组中非常流行。Discord
    提供了私信和群聊工具、无缝交互的低延迟技术以及自定义审核功能。它将日常对话的便利性与大型社区的兴奋感相结合，使数字聚会变得简单且包容容。更多信息请访问 [`discord.com`](https://discord.com/)。


    来自微软的 Skype 提供免费的视频、语音通话和消息服务。它可以在各种设备上运行，且基础功能免费，电话通话和短信提供付费选项。Skype 连接了商业世界，增强了协作。它提供即时消息、语音聊天等功能，并为用户提供唯一
    ID。尽管它不支持紧急电话，但它提供了视频聊天背景模糊等功能。最近，Skype 集成了 Bing AI 聊天机器人。更多信息请访问 [`skype.com`](https://skype.com/)。


    Session 是由 Oxen Project 开发的一款注重隐私的聊天应用。它适用于 macOS、Windows、Linux、iOS 和 Android，使用区块链网络进行安全通信，无需手机号码或电子邮箱。相反，用户拥有一个唯一的
    66 位 ID。尽管缺乏双重身份验证且协议不断演进，但其加密经过独立验证。Session 提供了一种交换消息、语音备注和媒体的安全方式。更多信息请访问 [`getsession.org`](https://getsession.org/)。


    Pidgin 是一个免费的开源即时客户端，支持许多协议。它允许用户通过一个界面连接到各种服务。它以带有 Off-the-Record Messaging 插件的强加密而闻名，在隐私爱好者中非常流行，并包含在
    Tails OS 中。Pidgin 拥有友好的 GTK+ 界面，适用于多个操作系统，并支持通过插件扩展以增加额外功能。更多信息请访问 [`pidgin.im`](https://pidgin.im/)。


    Ferdium 是一款桌面应用程序，将你喜爱的服务整合到一个平台中以便于访问。它支持同一服务的多个账户，提供工作空间以区分个人和职业生活，并包含一个待办事项面板。添加自定义服务非常简单，确保了灵活性。Ferdium
    优先考虑隐私，提供跨设备云同步，并休眠未使用的服务以节省资源。它源自 Franz，通过额外的功能和对 Franz 账户的兼容增强了体验。更多信息请访问 [`ferdium.org`](https://ferdium.org/)。


    Signal 是一款采用顶尖加密的安全消息应用。它提供免费的文本、语音消息、照片、视频和通话，即使是长途也是免费的。Signal 包含加密贴纸和群聊，没有广告、追踪器或与大型科技公司的关联。作为一个由捐赠支持的非营利组织，它代表了隐私和可访问性。更多信息请访问
    [`signal.org`](https://signal.org/)。


    Telegram 是一款结合了通信和社交网络的讯工具应用。它于 2013 年发布，支持端到端加密的消息、媒体共享以及语音或视频通话。用户可以享受故事（Stories）、大型小组和用于广播的频道。Telegram
    的开放 API 允许自定义机器人和微应用，丰富了用户交互。它在各大平台上均可用，以其安全性、易于使用的界面和丰富的功能而脱颖而出。更多信息请访问 [`telegram.org`](https://telegram.org/)。


    # Discord


    访问 Discord 官方网站 [`discord.com/`](https://discord.com/) 获取关于 Discord 的所有信息。


    # 通过软件管理器通过 FLATPAK 软件包安装 Discord


    1. 打开软件管理器并搜索 `Discord`。

    2. 点击 `Discord`，然后点击源选择框。

    3. 选择 `FLATPAK` 并点击安装。


    # 在终端中通过 FLATPAK 安装 Discord


    ```bash

    flatpak install flathub com.discordapp.Discord

    ```


    # 在终端中通过 SNAP 安装 Discord


    ```bash

    sudo snap install discord

    ```


    # Skype


    访问 Skype 官方网站 [`www.skype.com/en/`](https://www.skype.com/en/) 获取关于 Skype 的所有信息。


    # 通过软件管理器通过 FLATPAK 软件包安装 Skype


    1. 打开软件管理器并搜索 `Skype`。

    2. 点击 `Skype`，然后点击源选择框。

    3. 选择 `FLATPAK` 并点击安装。


    # 在终端中通过 APT 安装 Skype


    ```bash

    sudo apt update

    sudo apt install software-properties-common apt-transport-https curl ca-certificates

    curl -fsSL https://repo.skype.com/data/SKYPE-GPG-KEY | sudo gpg --dearmor | sudo
    tee /usr/share/keyrings/skype.gpg > /dev/null

    echo deb [arch=amd64 signed-by=/usr/share/keyrings/skype.gpg] https://repo.skype.com/deb
    stable main | sudo tee /etc/apt/sources.list.d/skype.gpg

    ```


    # 通过 FLATPAK 安装 Skype（继续）


    ```bash

    sudo apt update

    sudo apt install skypeforlinux

    ```


    # 在终端中通过 FLATPAK 安装 Skype


    ```bash

    flatpak install flathub com.skype.Client

    ```


    # 在终端中通过 SNAP 安装 Skype


    ```bash

    sudo snap install skype

    ```


    # 在 GUI 中通过 .deb 安装 Skype


    导航至发布页面：[`repo.skype.com/SYSTEM PACKAGE/pool/main/s/skypeforlinux/`](https://repo.skype.com/rpm/pool/main/s/skypeforlinux/)


    点击最新的 `skypeforlinux__amd64.deb` 下载 Skype。


    进入“下载下载文件夹。


    双击 `skypeforlinux__amd64.deb`。


    点击安装。


    # Session


    访问 Session 官方网站 [`getsession.org/`](https://getsession.org/) 获取关于 Session 的所有信息。


    # 在终端中通过 FLATPAK 安装 Session


    ```bash

    flatpak install flathub network.loki.Session

    ```


    # Pidgin


    访问 Pidgin 官方网站 [`www.pidgin.im/`](https://www.pidgin.im/) 获取关于 Pidgin 的所有信息。


    # 通过软件管理器通过 SYSTEM PACKAGE/FLATPAK 软件包安装 Pidgin


    1. 打开软件管理器并搜索 `Pidgin`。

    2. 点击 `Pidgin`，然后点击源选择框。

    3. 选择 `SYSTEM PACKAGE` 或 `FLATPAK` 并点击安装。


    # 在终端中通过 APT 安装 Pidgin


    ```bash

    sudo apt install pidgin

    ```


    # 在终端中通过 FLATPAK 安装 Pidgin


    ```bash

    flatpak install flathub im.pidgin.Pidgin

    ```


    # Ferdium


    访问 Ferdium 官方网站 [`ferdium.org/`](https://ferdium.org/) 获取关于 Ferdium 的所有信息。


    # 通过软件管理器通过 FLATPAK 软件包安装 Ferdium


    1. 打开软件管理器并搜索 `Ferdium`。

    2. 点击 `Ferdium`，然后点击源选择框。

    3. 选择 `FLATPAK` 并点击安装。


    # 在终端中通过 FLATPAK 安装 Ferdium


    ```bash

    flatpak install flathub org.ferdium.Ferdium

    ```


    # 在终端中通过 SNAP 安装 Ferdium


    ```bash

    sudo snap install ferdium

    ```


