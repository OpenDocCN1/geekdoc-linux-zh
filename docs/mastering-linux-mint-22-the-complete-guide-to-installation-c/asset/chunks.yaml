  trans: "\n\n`deb-src http://archive.ubuntu.com/ubuntu/ noble-backports main restricted\
    \ universe multiverse`\n\n点击“保存”或使用菜单选项保存您的更改。\n\n## 通过终端命令行设置存储库\n\n在终端中运行以下命令：\n\
    \n```\nsudo apt update\nsudo apt upgrade\nsudo add-apt-repository main universe\
    \ restricted multiverse\nsudo apt update\nsudo apt upgrade\n```\n\n## 更新 Linux\
    \ Mint 22\n\n更新 Linux Mint 22（代名为“Wilma”）可以通过两种主要方法完成。第一种方法对用户友好，利用了更新管理器（Update\
    \ Manager）的图形界面。在这里，你只需点击几个按钮即可启动更新过程。或者，对于那些熟悉命令行操作的用户，可以在终端中执行一系列命令来实现相同的效果。\n\
    \n除了手动更新外，Linux Mint 还提供了系统关机时自动更新的便利功能。此功能通过安装和配置 `unattended-upgrades` 软件包来实现。一旦设置好，该软件包将确保您的系统自动保持最新，无需人工干预。\n\
    \n如果你觉得更新通知的频率过于干扰，Linux Mint 也提供了相应的解决方案。你可以通过在“启动应用程序”中调整更新管理器的设置来部分禁用这些通知。这种自定义允许你根据喜好控制更新通知的级别和频率。\n\
    \n对于对更高级自定义感兴趣的用户（例如更改或更新 Linux Mint 内核），可以通过 Linux Mint 协会提供的官方存储库获取指导。这些存储库提供了必要的资源和说明，用于安全地更新和更改内核，确保系统的兼容性和稳定性。\n\
    \n总而言之，Linux Mint 21.3 为系统更新提供了灵活且用户友好的方法，无论你偏好图形界面、命令行方法、自动更新还是自定义内核修改。每个选项都旨在满足不同的用户需求和偏好，确保流畅且安全的运行体验。\n\
    \n## 通过更新管理器 (GUI) 更新 Linux Mint\n\n1. **启动更新管理器**：从应用程序菜单打开更新管理器。\n2. **继续提示**：在出现提示时点击“继续”。\n\
    3. **本地镜像选项**：在“您想切换到本地镜像源吗？”旁边点击“是”。\n4. **关闭提示**：点击“X”按钮关闭提示框。\n5. **刷新软件包列表**：点击“刷新”以更新软件包列表。\n\
    6. **选择更新**：选择一个更新，例如 `vim`。\n7. **阅读描述**：点击“描述”选项卡以阅读软件包的描述。\n8. **查看软件包**：切换到“软件包”选项卡，查看受更新影响的已安装软件包以及更新大小（KB）。\n\
    9. **检查更新日志**：进入“更新日志”选项卡查看更新的更改。\n10. **选择更新进行安装**：勾选想要执行的更新旁边的复选框。\n11. **安装更新**：点击“安装更新”开始安装。\n\
    12. **等待应用**：等待更改生效。\n13. **再次刷新**：再次点击“刷新”。\n\n**关闭更新管理器**：点击“X”按钮关闭更新管理器。\n\n\
    ## 通过命令行更新 Linux Mint\n\n要使用终端更新系统：\n\n运行以下命令：\n\n```\nsudo apt update\nsudo apt\
    \ upgrade\n```\n\n要执行带有预先通过确认的升级命令，请运行：\n\n```\nsudo apt update && sudo apt upgrade\
    \ -y\n```\n\n## 在 Linux Mint 22 上实现自动更新\n\n要在 Linux Mint 22 中设置无人值更新，请遵循以下步骤：\n\
    \n1. 打开终端并运行：\n```\nsudo apt update\nsudo apt install unattended-upgrades\nsudo\
    \ nano /etc/apt/apt.conf.d/50unattended-upgrades\n```\n\n2. 使用以下内容编辑 `50unattended-upgrades`\
    \ 文件：\n```\nUnattended-Upgrade::Origins-Pattern {\n\"origin=Debian,codename=${distro_codename},label=Debian\"\
    ;\n   \"origin=Debian,codename=${distro_codename},label=Debian-Security\";\n\"\
    origin=Debian,codename=${distro_codename}-security,label=Debian-Security\";\n\
    };\nUnattended-Upgrade::InstallOnShutdown \"true\";\nUnattended-Upgrade::Remove-Unused-Dependencies\
    \ \"true\";\nUnattended-Upgrade::OnlyOnACPower \"true\";\n```\n\n3. 按 `CTRL +\
    \ S` 保存，然后按 `CTRL + X` 退出。\n4. 运行以下命令：\n```\nsudo nano /etc/apt/apt.conf.d/10periodic\n\
    ```\n\n5. 使用以下内容编辑 `10periodic` 文件：\n```\nAPT::Periodic::Update-Package-Lists\
    \ \"1\";\nAPT::Periodic::Download-Upgradeable-Packages \"1\";\nAPT::Periodic::AutocleanInterval\
    \ \"7\";\nAPT::Periodic::Unattended-Upgrade \"1\";\n```\n6. 按 `CTRL + S` 保存，然后按\
    \ `CTRL + X` 退出。\n7. 运行以下命令：\n```\ncd /etc/systemd\nsudo nano logind.conf\n```\n\
    \n8. 使用以下内容编辑 `logind.conf` 文件：\n```\nInhibitDelayMaxSec=1800\n```\n9. 按 `CTRL\
    \ + S` 保存，然后按 `CTRL + X` 退出。\n10. 最后，运行这些命令启用并启动无人值更新：\n```\nsudo systemctl enable\
    \ unattended-upgrades\nsudo systemctl start unattended-upgrades\nsudo systemctl\
    \ status unattended-upgrades\n```\n这些步骤将安装、配置、启动并检查 Linux Mint 22 上自动更新的状态。\n\n\
    ## 禁用更新通知\n\n1. **打开启动应用程序**：从应用程序菜单访问此项。\n2. **禁用更新管理器**：找到“更新管理器”并关闭其开关。\n3.\
    \ **关闭窗口**：点击“X”按钮关闭。\n\n## 在 Linux Mint 22 中更新内核\n\n有关 Linux 内核的更多信息，请咨询官方网站\
    \ `https://www.kernel.org/`。\n\n### 通过 GUI 更新 Linux Mint 内核：\n\n1. **访问更新管理器**：从应用程序菜单打开它。\n\
    2. **查看内核**：点击“查看”然后选择“内核”。\n3. **选择内核**：选择可用的最高版本内核。\n4. **安装内核**：点击“安装”。\n\n\
    完成安装：安装后，点击“关闭”。\n\n## Linux Mint 22 软件源\n\nLinux Mint 22 软件源旨在让用户能够访问各种软件，而无需虚拟化工具。这确保用户可以轻松安装和运行软件，而无需依赖于模拟其他\
    \ Linux 发行版（如 Arch、Ubuntu 或 openSUSE Tumbleweed）系统的应用程序，例如 `distrobox` 和 `BoxBuddy`。\n\
    \nLinux Mint 软件管理器让你能够轻松管理应用程序。这是一个预装的用户友好 GUI 界面。通过访问许多开源和专有应用程序，你可以快速安装、更新和删除软件。其简洁、直观的界面对\
    \ Linux 新手非常友好，而强大的搜索功能让查找应用程序变得轻而易举。\n\nAPT 代表高级软件包工具（Advanced Package Tool），是一种用于管理\
    \ Debian 及其衍生版软件的强大实用。它负责安装、更新和删除软件包。APT 使用存储库，即软件目录。你可以配合 `sudo` 使用 APT 来获取超级用户权限以进行更多控制。\n\
    \n将 `.rpm` 文件的默认安装设置为软件安装，可以让你通过双击轻松打开并安装它们，这比使用命令行要友好得多。\n\n将 `.deb` 文件的默认设置为\
    \ GDebi 详细说明了如何将 GDebi 设置为默认应用程序。与“软件安装”不同，GBDeb 会自动获取所需的软件包，避免了运行 `sudo dpkg\
    \ -i` 和 `sudo apt install -f` 命令的需求。\n\nFlatpak 涵盖了在 Linux Mint 22 上安装 Flatpak\
    \ 协议的内容，包括为 GNOME Software 添加 Flatpak 插件。这使得无需网络浏览器即可轻松浏览和安装 Flatpak 应用程序。它还包含了基本的\
    \ Flatpak 命令行操作，如添加、列出和删除应用程序。\n\n"
- fmt: "\nFlathub explains how to add the Flatpak Flathub repository to Linux Mint\
    \ 22, providing access to a vast repository of Flatpak applications. With the\
    \ Flatpak plugin for GNOME Software, users can easily browse and install these\
    \ applications.\n\nSnap demonstrates how to install the Snap protocol on Linux\
    \ Mint 22, providing command line access to Canonical’s Snapstore, which includes\
    \ thousands of applications like Discord, Steam, and Visual Studio Code. It also\
    \ details managing snaps, including installation, removal, `.desktop` shortcut\
    \ creation, and total removal from the system. Additionally, it shows how to install\
    \ the graphical Snap Store.\n\n.AppImages explains how to make `.AppImage` files\
    \ executable using the `Nautilus` file manager in GNOME 46 the default desktop\
    \ environment of Linux Mint 22. It also provides an example of creating a `.desktop`\
    \ shortcut for the Curseforge `.AppImage` and an overview of the fields in a `.desktop`\
    \ file.\n\nAppImageLauncher provides an in-depth look at obtaining and installing\
    \ the latest compatible `.rpm` file for AppImageLauncher.\n\n`pip` describes how\
    \ to install `pip`, the package manager that connects to the Python Packaging\
    \ Index (PyPI), allowing users to install software from PyPI through the command\
    \ line.\n\nNode.js & `npm` details installing `Node.js` (a JavaScript runtime)\
    \ and `npm` (Node Package Manager) using the `APT` command line.\n\n`NVM` shows\
    \ how to install the Node Version Manager (`NVM`), allowing users to install and\
    \ use different versions of `Node.js` and `npm` individually. It provides practical\
    \ examples of using specific versions through `NVM`.\n\n`pnpm` illustrates how\
    \ to install `pnpm` (Performant npm), a different package manager for Node.js.\
    \ It explains installing `pnpm` using `curl` and `sh` commands in the terminal\
    \ and emphasizes its role in centralizing packages in a global repository.\n\n\
    # Linux Mint 22 Software Manager\n\nTo install applications using the Software\
    \ Manager, follow these steps:\n\n1. Click on the desired application in the Software\
    \ Manager.\n2. Click the 'Install' button.\n\nAlternatively, you can use the search\
    \ bar to find a program by typing its name, for example, 'vlc,' and then clicking\
    \ on the application and 'Install.'\n\nYou can also choose different software\
    \ sources for an application by:\n\n1. Browsing through the front page or category\
    \ pages.\n2. Using the search bar to find the application, such as 'SMPlayer.'\n\
    3. Clicking on the application.\n4. Pressing the drop-down box below the 'Install'\
    \ button.\n\nAvailable options may include Linux Mint, Ubuntu, and Flatpak (Flathub).\
    \ Once you've selected your desired source from the options presented, click 'Install.'\n\
    \nTo remove installed applications using the Software Manager:\n\n1. Go to the\
    \ 'Installed' tab in the Software Manager.\n2. Locate the application you wish\
    \ to uninstall or remove.\n3. Click 'Uninstall' next to the application.\n\n#\
    \ APT\n\nVisit the official APT website at [https://wiki.debian.org/Apt](https://wiki.debian.org/Apt)\
    \ for more information.\n\n1. **Update Package Lists and Repositories**:\n   -\
    \ To update the `APT` package lists and repositories, run the following command:\n\
    \   ```bash\n   sudo apt update\n   ```\n\n2. **Upgrade APT Packages**:\n   -\
    \ Upgrade `APT` packages by running the following command:\n   ```bash\n   sudo\
    \ apt update && sudo apt upgrade -y\n   ```\n\n3. **Remove APT Packages**:\n \
    \  - To remove or uninstall `APT` packages, use the following command:\n   ```bash\n\
    \   sudo apt remove package-name\n   ```\n\n4. **Purge APT Packages**:\n   - Purge\
    \ `APT` packages entirely by running the following command:\n   ```bash\n   sudo\
    \ apt purge package-name\n   ```\n\n5. **Remove 3rd Party Repository .list Files**:\n\
    \   - To remove individual `.list` files from 3rd party repositories, navigate\
    \ to the directory containing these files:\n   ```bash\n   cd /etc/apt/sources.list.d\n\
    \   ```\n   - Then, remove the specific `.list` file (e.g., `xanmod.list`) and\
    \ update `APT` sources:\n   ```bash\n   sudo rm -r file-name && sudo apt update\n\
    \   ```\n\n6. **Remove Leftover Packages**:\n   - To remove leftover packages,\
    \ run the following command:\n   ```bash\n   sudo apt autoremove\n   ```\n\n#\
    \ Setting Software Install as .deb Default\n\n1. Open the Files application from\
    \ the application menu.\n2. Press `CTRL + L` to activate the location entry in\
    \ the file path entry box.\n3. Type `~/Downloads` and press Enter to navigate\
    \ to the Downloads directory.\n4. Select a `.rpm` file, for example, `google-chrome-stable_current_amd64.deb`.\n\
    5. Right-click on the `.deb` file and choose \"Open With\".\n6. Select \"Software\
    \ Install\".\n7. Move the switch next to \"Always use for this file type\" (rpm\
    \ package) to the right.\n8. Click \"Open\".\n\n# Setting GDebi as Default for\
    \ .deb\n\n1. Open the terminal and run:\n   ```bash\n   sudo apt install gdebi\n\
    \   ```\n2. Open the Files application from the application menu.\n3. Press `CTRL\
    \ + L` to activate the location entry in the file path entry box.\n4. Type `~/Downloads`\
    \ and press Enter to navigate to the Downloads directory.\n5. Select a `.deb`\
    \ file, for example, `openstego_0.8.6-1_all.deb`.\n6. Right-click on the `.deb`\
    \ file and choose \"Open With\".\n7. Select \"GDebi Package Installer\".\n8. Move\
    \ the switch next to \"Always use for this file type\" (Debian package) to the\
    \ right.\n9. Click \"Open\".\n\n# Flatpak\n\nVisit the official Flatpak website\
    \ at [https://www.flatpak.org/](https://www.flatpak.org/) for more information.\n\
    \n## Installing Flatpak via APT in the Terminal\n\n```bash\nsudo apt update\n\
    sudo apt install flatpak\nsudo apt install gnome-software-plugin-flatpak\n```\n\
    \n### Flatpak Command Line Examples\n\nTo install a Flatpak app, run:\n```bash\n\
    flatpak install flathub ch.tigerjython.TigerJython2\n```\n\nTo remove a Flatpak\
    \ app, run:\n```bash\nflatpak remove ch.tigerjython.TigerJython2\n```\n\nTo delete\
    \ Flatpak repositories, run:\n```bash\nflatpak remotes\nflatpak remote-delete\
    \ flathub\n```\n\nTo remove Flatpak from Linux Mint 22 ‘Wilma’, run:\n```bash\n\
    sudo apt purge flatpak gnome-software-plugin-flatpak\n```\n\n## Flathub\n\nVisit\
    \ the official Flathub website at [https://flathub.org/](https://flathub.org/)\
    \ for more information.\n\nTo add the Flathub repository, run the following command\
    \ in the terminal:\n```bash\nflatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo\n\
    ```\n\n# Snap\n\nVisit the official Snap website at [https://snapcraft.io/](https://snapcraft.io/)\
    \ for more information.\n\nTo install Snap, run the following commands in the\
    \ terminal:\n\n1. Move the existing `nosnap.pref` file to a backup location in\
    \ your 'Documents' directory with the following commands:\n   ```bash\n   sudo\
    \ mv /etc/apt/preferences.d/nosnap.pref ~/Documents/nosnap.backup\n   ```\n2.\
    \ Update your package list to ensure you have the latest:\n   ```bash\n   sudo\
    \ apt update\n   ```\n3. Install snapd by executing the following command:\n \
    \  ```bash\n   sudo apt install snapd\n   ```\n\nOnce Snap is installed, you can\
    \ work with Snap packages as follows:\n\n- To install Snap packages, you can use\
    \ the Snap Store graphical interface or the command line.\n  - For instance, to\
    \ install Discord, use the following command:\n    ```bash\n    sudo snap install\
    \ discord\n    ```\n- To uninstall Snap packages, you have the option to use the\
    \ Snap Store graphical interface or the command line.\n  - For example, to remove\
    \ Chromium, execute the following command:\n    ```bash\n    sudo snap remove\
    \ chromium\n    ```\n\n# Snap Store\n\nVisit the official Snap Store website at\
    \ [https://snapcraft.io/](https://snapcraft.io/) for more information.\n\nTo install\
    \ Snap, run the following commands in the terminal:\n```bash\nsudo snap install\
    \ core\nsudo snap install snap-store\n```\n\n# AppImages\n\nVisit the official\
    \ .AppImage website at [https://appimage.org/](https://appimage.org/) for more\
    \ information.\n\n## Set .AppImage as Executable in a GUI:\n\n1. Open the Files\
    \ application from the application menu.\n2. Press `CTRL + L` to activate the\
    \ location entry in the file path entry box.\n3. Enter `~/` to access the home\
    \ directory and press Enter.\n4. Right-click on an empty space and select \"New\
    \ Folder\".\n5. Type \"Applications\" and click Create.\n6. Drag and drop `Curseforge-1.0.0.x.x64.AppImage`\
    \ from the `~/Downloads` directory to the `~/Applications` directory.\n7. Navigate\
    \ to `~/Applications`.\n8. Right-click `Curseforge-1.0.0.x.x64.AppImage` and select\
    \ \"Properties\".\n"
