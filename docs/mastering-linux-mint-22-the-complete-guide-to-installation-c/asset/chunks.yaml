- fmt: '

    CDBurnerXP is a handy tool for burning CDs, DVDs, and Blu-rays, supporting many
    formats for robust data storage. It crafts audio CDs, bootable media, and spans
    data over discs. Features include instant burning, verifying data, and saving
    projects. It also erases, copies, and fetches disc info, creates ISOs, supports
    LightScribe, and updates in multiple languages.


    # Installing CDBurnerXP And Burning The Linux Mint 22 ISO


    ## Download and Install CDBurnerXP

    * Go to the `CDBurnerXP` website: [https://www.cdburnerxp.se/](https://www.cdburnerxp.se/)

    * Click on `CDBurnerXP` to find the software.

    * Download the file named `cdbxp_setup_4.5.8.7128_x64_minimal.exe`.

    * Open the downloaded file and follow the on-screen instructions.


    ## Burn the Linux Mint 22 ISO

    1. Insert a blank `DVD-R/RW` disc into your DVD writer.

    2. Open `CDBurnerXP` from the Start Menu.

    3. Choose `Burn ISO image` and click `Browse` to select your Linux Mint 22 ISO
    file.

    4. Tick options like `Verify data` and `Finalize disc`.

    5. Press `Burn disc` to begin.


    If you run into any problems, the `CDBurnerXP` site has resources and a support
    team to help. Enjoy your Linux Mint 22 experience!


    # Comparing USB and DVD Booting for Linux Mint 22 Installation with Ventoy


    To boot and install Linux Mint 22, you can use a `Ventoy` USB drive or a DVD disc.
    Each method has different steps:


    ### Using Ventoy USB Drive

    1. **Boot with Ventoy USB**: Start your PC and boot from the `Ventoy` USB. Select
    the USB as the boot device in the BIOS or boot menu.

    2. **Select Linux Mint 22 ISO**: `Ventoy` will display a list of ISOs on the USB.
    Use the arrow keys to pick the Linux Mint 22 ISO and press `ENTER`.

    3. **Choose Grub Mode**: After selecting Linux Mint 22 ISO, pick the `grub` mode
    and press `ENTER`.

    4. **Start Graphical Installer**: Choose the `Graphical Installer` and press `ENTER`
    to begin installing Linux Mint 22.


    ### Using a DVD Disc

    1. **Insert the DVD**: Put the Linux Mint 22 DVD in your drive and restart your
    PC.

    2. **Boot from DVD**: Your PC should boot from the DVD if it’s set as the primary
    boot device.

    3. **Start Installer**: `GRUB` Installer Select Screen appears, so choose the
    Linux Mint 22 option. The Linux Mint 22 installer starts immediately, without
    extra menus compared to `Ventoy`.


    These differences help you decide the best way to install Linux Mint 22, based
    on what you''re comfortable with.


    # Linux Mint 22 Install Guide


    Installing Linux Mint 21.3 with the `ubiquity`-based installer involves selecting
    your keyboard layout, deciding whether to include multimedia codecs, choosing
    the type of installation, configuring your timezone, creating a user account,
    and finally rebooting your computer after installation is complete.


    ## Keyboard Layout

    To start installing Linux Mint, double-click on the `Install Linux Mint` option.
    When asked to select a keyboard layout, choose the appropriate layout from the
    left side of the screen, such as `English (UK)`. Then, pick the corresponding
    keyboard sub-layout on the right side, also `English (UK)`. After selecting the
    correct keyboard layout and sub-layout, click on the `Continue` button to proceed
    with the installation.


    ## Multimedia Codecs

    To install multimedia codecs, select the checkbox labeled `Install multimedia
    codecs` and then click on the `Continue` button.


    ## Installation Options

    In the `ubiquity`-based Linux Mint 22 Installer, there are three installation
    options available:

    1. **"Install alongside existing operating system"**: allows you to install Linux
    Mint 22 alongside another operating system on the same disk without requiring
    any data removal or partition modification; this is quick and convenient.

    2. **"Erase disk and install Linux Mint"**: will completely remove all data on
    the disk and install Linux Mint 22 `Wilma` with predetermined partition sizes;
    this option is suitable for those who want a fresh installation without preserving
    any existing data.

    3. **"Something else"**: provides more advanced features for disk management;
    it allows you to create, resize, and modify partitions on the selected disk, giving
    you more control over the partitioning process, including the ability to specify
    volume sizes and types, and is recommended for users who have a deeper understanding
    of disk management and want to create a customized and functional system.


    ## Install Alongside & Erase Disk

    To complete the installation, click on the `Install Now` button, carefully review
    any changes to your disks during the installation, and once you have reviewed
    the changes, click on the `Continue` button to proceed.


    ## Something Else

    To set up specific partitions on a 1TB NVME SSD, create a new partition table
    and ensure the EFI partition is at least 512 MB, allocate 71680 MB for the `SWAP`
    partition, and use the remaining free space for the root filesystem partition
    formatted as an `Ext4` journaling file system and mounted at `/`; review the disk
    changes and proceed with the installation.


    ### New Partition Table

    To create a new partition table, click the `+` symbol to add a new partition,
    select the disk you wish to partition, and if the selected disk does not have
    a partition table, click `New Partition Table`, then `Continue` and choose `free
    space` on the disk.


    ### EFI Partition

    To set up the EFI partition, click `+` to create a new partition, enter `1024`
    MB in the `Size` field, toggle the switches for `Primary` and `Beginning of this
    space` to on, select `EFI` in the `Use as` field, and click `OK` to confirm.


    ### SWAP Partition

    To configure the `SWAP` partition, click `+` to add another partition, enter `71680`
    MB in the `Size` field, toggle the switches for `Primary` and `Beginning of this
    space` to on, select `swap area` in the `Use as` field, and click `OK` to confirm.


    ### Root (/) Filesystem Partition

    To create the Root Filesystem partition, click `+` to add a new partition, use
    the remainder of the free space for `Size`, toggle the switches for `Primary`
    and `Beginning of this space` to on, select `Ext4 journaling file system` in the
    `Use as` field, enter `/` in the `Mount point` field, and click `OK` to confirm.


    ### Finalizing Partition Changes

    To finalize the installation, click `Install Now`, review the disk changes to
    ensure they are correct, and then click `Continue` to proceed with the installation;
    by following these steps, you can effectively partition your 1TB NVME SSD for
    optimal performance and organization.


    ## Timezone

    To set the timezone, select the desired location on the map or enter the name
    of the city in the box below the world map, then click on the `Continue` button
    to proceed.


    ## Creating User Profile

    To create a user profile, enter your name in the box labeled `Your name`, and
    the box next to `Your computer''s name` will automatically fill in; enter a username
    in the box labeled `Pick a username`, select a secure and memorable password in
    the box labeled `Choose a password`, activate the switch next to `Require my password
    to log in`, and finally, click on the `Continue/Install` button to proceed.


    ## Completing Install Process

    Wait patiently until the installation is complete, then click on the `Restart
    Now` button, and after the restart, remove the USB drive before the motherboard
    BIOS logo becomes visible.


    # Setting Linux Mint 22 To Boot

    To select a boot entry on an MSI MAG B550 TOMAHAWK motherboard, remove the USB
    drive and press the designated key (`F10` or other) to access the motherboard
    BIOS. Press the key once, repeatedly, or steadily before the motherboard BIOS
    logo becomes visible to enter the BIOS.

