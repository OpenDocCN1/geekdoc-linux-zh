    # 直播软件


    直播软件允许你在线广播实时视频和音频，捕捉来自摄像头、麦克风或屏幕的内容。与将文件保存到设备的下载不同，流媒体在不进行本地存储的情况下实时播放媒体，使用数据包进行流畅播放。这节省了空间并提供了视频和音乐的即时访问，使其成为在线娱乐和直播分享的热门。


    OBS Studio 是一款 Windows 和 macOS 的免费开源直播和录屏软件。它支持多种视频编码方法，并与 YouTube 和 Twitch 等平台集成。用户可以混合音频、无缝切换场景并自定义过渡效果。其友好的界面包含多场景画布、音频混音器和简单的设置，以便于配置。OBS
    还支持插件和脚本以增强功能，迎了初学者和寻求专业级制作的高级用户。


    Owncast 是一个自托管、可自定义的直播和聊天平台，对内容和社区拥有完全控制权。它与流行的直播软件集成，并具有内置聊天功能用于观众互动、自定义表情和聊天机器人。它为寻求独立于大型平台的主播设计，提供了无跟踪的体验。兼容
    Linux 和 macOS 服务器，只需少量设置即可开始直播。Owncast 还可以连接到 Fediverse，扩大受众范围。对于那些想要没有主流服务限制的自定义无广告直播的人非常完美。


