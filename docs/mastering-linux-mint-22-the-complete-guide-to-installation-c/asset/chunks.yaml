    # 编程语言


    编程语言是编写软件的系统，通过类型和错误处理等特性平衡了形式（语法）和意义（语义）。受计算机架构的影响，它们已从特定硬件的形式演变为更抽象的形式，增强了简单性。从命令式到面向对象的类型，它们在满足各种需求的同时，平衡了优势与权衡（例如简单性与性能的平衡）。这种演变体现在计算机科学的动态研究和分类中，使编程成为充满活力的领域。


    Zig 由 Andrew Kelley 创建，是一种紧凑的静态类型编译语言，旨在系统编程，定位为 C 语言的现代继任者。Zig 追求简单高效，避免了宏和预处理器，拥抱流控制、易于函数调用和直接库导入。它通过编译时泛型和反射暗示借鉴了新语言，增强了灵活性。Zig
    优先考虑安全性但不要求运行时检查，提供可选类型和内置测试框架在没有垃圾回收的情况下管理手动内存，使其与 `Go`、`Rust` 和 `Carbon` 等对手区别开来。


    `Go` 由 Google 的 Robert Griesemer、Rob Pike 和 Ken Thompson 创建，是一种高级静态类型语言，与 C 类似但增加了内存安全、垃圾回收和并发特性。它在简单和安全上蓬勃发展，是可扩展系统的理想选择。在
    Google 的支持下，`Go`（或 `Golang`）拥有强大的标准库、内置并发和活跃的生态系统。其主要实现包括用于各种平台和 WebAssembly 的
    `gc` 编译器，以及通过 `gofrontend` 的 `gccgo` 或 `gollvm`。`GopherJS` 甚至通过将 `Go` 编译为 JavaScript
    引入网络。


    `Rust` 由 Graydon Hoare 于 2006 创建并由 Mozilla 支持，是一种多功能编程语言，以强调性能、类型安全和并发著称，不需要垃圾回收。它独特的“借用检查器”有助于管理内存和数据竞态。Amazon
    和 Google 等科技巨头采用了 Rust，甚至集成到 Linux 内核开发中，Rust 以其快速普及和对系统编程的影响脱颖而出，融合了函数式编程的思想来创建稳健、高效的软件。


    `Lua` 是一种 1993 年诞生于巴西的多功能编程语言，以高效和轻量级闻名。它是嵌入式使用的理想选择，运行在跨平台解释器上，并提供简单的 `C API`
    进行集成。得益于动态类型、自动内存管理和对多种编程范式的支持，在脚本、配置和快速原型开发方面表现出色。由 PUC-Rio 开发的 Lua 强调速度、可移植性和易嵌入性。它的名字在葡萄语中意为“月亮”，强调了它的独特身份。Lua
    免费开源，以其性能、小内存占用和跨平台、跨设备的适应性而脱颖而出。


    `OpenJDK` 是 Java 平台标准版的免费开源版本，由 Sun Microsystems 于 2006 年发起，根据 `GPL-2.0` 许可并带有链接的特殊例外。它是爱好者和开发者汇聚以推进
    Java SE 及其相关项目的地方，提供了各种操作系统的最新 `OpenJDK JDK 21` 二进制文件。参与活跃的 OpenJDK 社区以探索、下载或贡献于
    Amber、`Loom`、`Panama`、`Valhalla` 以及 Java 的未来。对于性的 Java 应用，`dev.java` 是你的首选。无论是学习、下载还是贡献，`OpenJDK`
    都体现了 Java 演进中的协作与创新。


    ## Zig


    访问 Zig 官方网站 [`ziglang.org/`](https://ziglang.org/) 了解关于 Zig 的所有信息。


    在终端中通过 SNAP 安装 Zig：


    ```bash

    sudo snap install zig --beta --classic

    ```


    ## Go


    访问 Go 官方网站 [`go.dev/`](https://go.dev/) 了解关于 Go 的所有信息。


    在终端中通过 GUI 和命令行安装 Go：


    导航到发布页面：[`go.dev/dl/`](https://go.dev/dl/)


    点击下载的 `go.linux-amd64.tar.gz` 下载 Go。


    在终端中运行以下命令：


    ```bash

    cd ~/Downloads

    tar -xvf go1.22.4.linux-amd64.tar.gz

    sudo chown -R root go

    sudo mv go /usr/local

    ```


    ## Rust


    访问 Rust 官方网站 [`www.rust-lang.org/`](https://www.rust-lang.org/) 了解关于 Rust 的所有信息。


    在终端中通过 curl 安装 Rust：


    ```bash

    curl --proto ''=https'' --tlsv1.2 -sSf https://sh.rustup.rs | sh

    source "$HOME/.cargo/env"

    ```


    ## Lua


    访问 Lua 官方网站 [`www.lua.org/home.html`](https://www.lua.org/home.html) 了解关于 Lua
    的所有信息。


    在终端中通过 APT 安装 Lua：


    ```bash

    sudo apt update

    sudo apt install build-essential libreadline-dev wget cd

    mkdir lua_build

    cd lua_build

    wget https://www.lua.org/ftp/lua-5.4.6.tar.gz

    tar -xvf lua-5.4.6.tar.gz

    cd lua-5.4.6

    make linux test

    sudo make install

    ```


    ## OpenJava


    访问 OpenJava 官方网站 [`openjdk.org/`](https://openjdk.org/) 了解关于 OpenJava 的所有信息。


    在终端中通过 APT 安装 OpenJava：


    ```bash

    sudo apt update && sudo apt upgrade

    sudo apt install default-jre default-jdk

    ```


    # Imageboards


    Imageboards（图片看板）是图片优先于文本的在线论坛，起源于日本。它们允许用户通过发布图片参与各种讨论，功能类似于公告板，但更关注临时内容。用户可以匿名发布，并通常使用口令（tripcodes，哈希密码）来识别身份而无需存储个人数据。与在线图库不同，图片看板上的内容主要来自外部来源。4chan
    等平台提供“安全”口令来增强匿名性，使其这些论坛在视觉内容和匿名交互的结合上脱颖而出。

