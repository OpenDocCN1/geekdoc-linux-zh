    # 图像编辑软件


    图像编辑软件允许您通过裁剪、修饰和色彩调整来处理数字照片。它包含了矢量、位图和 3D 建模工具，用于增强或从零创建图像。它主要用于 2D 编辑，支持缩放大小和应用过滤器以调整属性或添加效果等任务，还方便了格式转换。


    GIMP（GNU 图像处理程序）是一款用于照片编辑和图像合成的免费工具。它提供了绘画工具、图层支持以及具有全 Alpha 通道支持的高级处理功能。GIMP
    可以通过插件和脚本进行扩展，可在多种平台上运行并支持许多文件格式，适用于简单和复杂的编辑需求。


    Blender 是一款免费、开源的 3D 创作套件，用于建模、动画、特效和视频剪辑。它运行在 Linux、macOS 和 Windows 上，兼顾专业人士和爱好者的需求。凭借全面的工具，Blender
    支持从游戏资产到电影的各种媒体制作。其由 `OpenGL` 驱动的界面确保了跨设备的一致体验，而其活跃的社区提供了广泛的支持和学习资源。


    Pinta 是一款开源、跨平台的图像编辑器，类似于 Paint.NET，但功能更多。它为位图图像编辑提供了一个强大的工具箱，包括绘图工具、过滤器、色彩调整和用于复杂编辑的多个图层。它设计直观易用，包含无限次数的撤销历史、多语言支持和可自定义的工作区，成为一个既易于用又强大的编辑解决方案。


    Krita 是一款专为数字艺术家和动画师设计的多功能、免费开源图形编辑器。它在 Linux、Windows 和 macOS 上提供用于 2D 动画和艺术创作的工具。Krita
    具有 `OpenGL` 加速的画布、拥有 100 多种预载笔刷的高级笔刷引擎、非破坏性图层、矢量支持和可自定义界面。它还包含用于平滑笔触的笔刷稳定器、用于漫画的内置矢量工具以及用于共享或导入笔刷的管理器，是追求灵活性和精度的创者的强大工具。


    Inkscape 是一款免费开源的矢量图形编辑器，运行在包括 Windows、macOS 和 Unix 类系统在多种平台上。得益于其矢量方法，它擅长创建清晰、可缩放的插图（如卡通、标志和图表），且没有像素限制。Inkscape
    支持 `SVG` 作为主要格式，处理许多文件类型，并提供用于形状、文本、颜色和渐变的复杂设计工具，同时允许直接从位图源转换并编辑为矢量艺术。


    Darktable 是一款免费开源的摄影应用和 RAW 开发工具，专注于非破坏性后期处理。它优化了工作流，可在各种平台上高效处理大量图像。通过实时调整、`GPU`
    加速和对多种图像格式的支持等功能，Darktable 通过色彩校、效果和组织模块增强了图像编辑。它支持非破坏性编辑、`ICC` 配置和用于自定义的 `Lua`
    脚本，其 UI 包含轻型模式和暗房模式以便于导航和编辑，此外还有快照和地图视图，可进行全面的图像管理。


    Tux Paint 是一款专为 3 到 12 岁儿童设计的免费开源绘画软件。由 Bill Kendrick 于 2002 年创建，提供充满趣味特效和绘图工具的简单界面，以激发儿童的创造力。Tux
    Paint 支持 Windows、macOS 和 Android 等多个平台，在全球范围内可用。在吉祥物 Tux 的引导下，孩子们可以通过各种工具和效果探索艺术，而教师和家长可以使用额外内容自定义体验。Tux
    Paint 是培养计算机素养和艺术技能的理想选择，因其易用性和容性设计而闻名。


