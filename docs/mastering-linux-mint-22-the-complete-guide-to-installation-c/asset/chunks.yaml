    ## Google Chrome


    Visit the official Google Chrome website at [https://www.google.com/intl/en_uk/chrome/](https://www.google.com/intl/en_uk/chrome/)
    for all things Google Chrome.


    ### Installing Google Chrome via APT in the Terminal:


    ```bash

    sudo apt update && sudo apt upgrade

    wget -qO - https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor |
    sudo tee /etc/apt/keyrings/google-chrome.gpg

    sudo sh -c ''echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg]
    http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list''

    sudo apt update

    sudo apt install google-chrome-stable

    ```


    ### Installing Google Chrome via .deb in the GUI:


    1. Navigate to the release page at: [https://www.google.com/chrome/](https://www.google.com/chrome/)

    2. Click "Download Chrome."

    3. Click the circle next to "64 bit .deb (For Debian/Ubuntu)."

    4. Click "Accept and Install" to download Chrome.

    5. Go to your Downloads folder.

    6. Double-click `google-chrome-stable_current_amd64.deb`.

    7. Click "Install."


