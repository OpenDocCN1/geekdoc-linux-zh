  trans: '


    Psensor 是一个基于 GTK+ 的软件，用于实时监控硬件温度和 CPU 风扇转速。它还可以监控远程服务器并显示 Linux CPU 使用率。Psensor
    会自动检测支持的硬件，以文本和详细图表的形式呈现数据。它包含了针对关键温度和风扇问题的可配置报警和提醒。


    Stacer 是一个适用于 Linux 的开源系统优化器和应用程序监控器。它允许用户管理启动应用、清理不需要的文件、处理系统服务和进程，以及卸载应用程序。Stacer
    还提供了实时资源使用监控和 APT 仓库管理器，方便编辑软件包仓库。


    BleachBit 是一个用于在 Linux 和 Windows 上释放磁盘空间和保护隐私的工具。它可以清理不需要的文件，并可以对文件进行粉碎以防止恢复。BleachBit
    支持广泛的应用，并包含诸如清理 Firefox 以提高速度等高级功能，使其对于维护系统性能和安全性至关重要。


    SoundConverter 是适用于 GNOME 桌面面的音频文件转换器，支持 Ogg Vorbis、AAC、MP3 和 FLAC 等格式。它提供快速的多线程转换，并可以从视频文件中提取音频。用户可以根据标签轻松重命名文件并组织文件夹，从而简化音频转换任务。


    Converseen 是一款适用于 Windows、Linux、macOS 和 FreeBSD 的多功能图像处理器。它支持超过 100 种格式，允许对图像进行转换、调整大小、旋转和翻转。用户还可以将
    PDF 文转换为图像并批量重命名文件。Converseen 用户友好，适用于任何图像处理需求。


    GParted 是一个使用 GNU Parted 管理磁盘分免费应用程序。它简化了创建、调整大小、移动和复制分区等任务，对于设置新操作系统和重新组织磁盘空间非常有用。GParted
    支持各种文件系统和存储设备，满足新手和高级用户的需求。


    HardInfo 是 Linux 的系统分析和基准测试工具，提供了对硬件和软件组件的详细洞察。它提供 HTML 或纯文本格式的报告，并允许基准比较。HardInfo
    以易访问的格式组织数据，便于诊断和分析系统性能以及硬件规格。


    gpustat 是一个监控 NVIDIA 图形设备的命令行实用。它提供实时 GPU 状态查询，具有内置监听模式、详细的 GPU 属性、运行进程名称和功耗等功能。对于需要深入了解
    NVIDIA GPU 性能的人来说，这是一个非常有用的工具。


    Czkawka 以波兰语中的“打嗝”命名，是一款快速且免费的应用程序，旨在通过删除不需要的文件来清理电脑。它用 Rust 构建，因速度快而脱颖，使用高级算法和多线程高效地执行任务。这款开源工具无广告，可在
    Linux、Windows、macOS 和 FreeBSD 上使用。它提供 CLI 和 GUI 前端，其中 GUI 使用 GTK 4 或 Slint 框架以适应不同的用户偏好。Czkawka
    通过不访问互联网或收集数据来确保隐私。它支持多种语言，并有各种工具来查找重复文件、空文件夹、大文件等。它还可以搜索相似图像、视频和音乐，并识别无效的符号链接、损坏的文件以及文件内容与扩展之间的不匹配。


