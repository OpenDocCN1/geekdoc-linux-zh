    2.  Click "Download the Proton VPN DEB package" to download Proton VPN.

    3.  Open the directory Files and navigate to: `~/Downloads`.

    4.  Double-click `protonvpn-stable-release_1.0.3-3_all.deb`.

    5.  Click "Install".


