    对于存储，建议使用带有 `DRAM` 缓存（非 SLC）的 256GB SSD。选用 `Samsung 850 Evo` 或更高级的型号。某些 3D 应用在无缓存或
    SLC SSD 上加载纹理时会存在问题。此外，256GB 的空间足够安装 `Linux Mint 22` 操作系统和大型 3D 应用程序。


    # 推荐配置


    ### 处理器

    为了获得最佳性能，请选择至少第 10 代 Intel 六核或八核 CPU，或第 2 代 AMD Ryzen 六核或八核 CPU（64 位）。这些相比前代产品有显著的提升。


    ### 显卡

    至少 `RTX 2060` 是可行的，但我个人倾向于选择 `3060 RTX 12 GB`。第一代 `RTX` 提供光线追踪功能，这在 Linux 上的支持正越来越多。如果你在
    `/etc/bash.bashrc` 文件中设置了正确的环境变量，现在可以在《魔兽世界》中使用它，具体请参阅“系统设置”章节中“环境变量”节节说明。


    ### 内存

    对于内存，32GB RAM 是一个极佳的起点。它可以让你同时运行许多应用程序和浏览器标签页。你甚至可以在玩游戏的同时加载本地 `Stable Diffusion`
    AI 模型并生成图像。


    ### 存储

    基于我在 `Ubuntu 20.04` 上使用 `Samsung 850 EVO 250GB SSD` 运行《魔兽世界》的经验，使用两个带有 `DRAM`
    缓存的 256GB SSD 是理想配置。据此，我认为一个硬盘可以存放所有的 `Linux Mint 22` 数据，而另一个存储媒体文件、游戏和 3D 应用程序。这样，一个硬盘的读写操作就不会拖慢另一个。这种设置有助于避免在传输大文件、解压包含大量文件的文件夹或更新电脑时出现无响应的情况。


    # 系统要求说明


    我的最低和推荐系统要求都是基于我对各种基于 Linux 的操作系统（如 `Ubuntu 20.04 LTS`、`Linux Mint 22` 和 `Fedora
    37`）的使用经验。我也考虑了 `Linux Mint 22` 和《魔兽世界》的官方系统要求。你可以在以下链接找到更多信息：


    Linux Mint 22:

    [`blog.linuxmint.com/?p=4731`](https://blog.linuxmint.com/?p=4731)


    《魔兽世界系统要求：

    [`eu.battle.net/support/en/article/76459`](https://eu.battle.net/support/en/article/76459)


    # Linux Mint 22 安装前准备


    ## 下载 Linux Mint 22 ISO

    要下载 `Linux Mint 22` ISO 文件，请访问以下网页地址：

    [`www.linuxmint.com/download.php`](https://www.linuxmint.com/download.php)


    在“Cinnamon Edition”下，点击“New Features”旁边的下载按钮，然后点击一个镜像（Mirror）来下载最新版本的 `Linux Mint
    22` ISO（写作时版本为 `linuxmint-22.0-cinnamon-64bit.iso`）。


    ## 选择安装介质


    #### USB 盘：Type A 和 Type C

    Type A USB (3.0) 优盘速度较慢，但更便宜，且对新旧设备的兼容性更好。它们因为适配大多数接口而非常易用。另一方面，Type C USB 接口速度可达
    10Gbps（Type A 的两倍），出现在较新的电脑上。旧电脑需要额外的 Type C 适配器，这会增加成本。个人更喜欢 Type A USB (3.0)
    优盘。它们更便宜，对我来说也方便，因为我的 USB C 接口很难够到，而且缺少额外的 Type C 接口。


    #### Ventoy

    Ventoy 是一款免费开源工具，彻底改变了启动优盘！只需将 `.iso`、`.wim`、`.img`、`.vhd(x)` 或 `.efi` 文件直接拷贝到驱动器——无需格式化。Ventoy
    的之处在于它可以直接引导这些文件，无论是在优 盘、硬盘、SSD 还是 SD 卡上。它甚至支持多个 ISO 镜像，让你从方便的启动菜单中选择。Legacy BIOS、UEFI、MBR、GPT——Ventoy
    都能处理，甚至是超过 4GB 的巨型 ISO 文件。Windows、Linux、Unix、VMware——支持的操作系统列表非常详尽，使 Ventoy 成为终极多功能启动解决方案！


    ## 安装 Ventoy 并拷贝 Linux Mint 22 ISO


    ### 对于 Linux 系统

    1. 访问 Ventoy 的 GitHub 页面：[`github.com/ventoy/Ventoy/releases`](https://github.com/ventoy/Ventoy/releases)。

    2. 下载最新文件，如 `ventoy-1.0.98-linux.tar.gz`。

    3. 在文件管理器中找到并解压此文件。

    4. 打开名为 `ventoy-1.0.98` 的文件夹。

    5. 找到内部的 `VentoyGUI.x86_64` 文件。

    6. 启动终端。

    7. 使用 `cd ~/Downloads/ventoy-1.0.98` 进入该文件夹。

    8. 使用 `dir` 内容。

    9. 使用 `sudo ./VentoyGUI.x86_64` 启动 VentoyGUI。

    10. 在 Ventoy 中选择你的 USB 盘。

    11. 将任何重要的 USB 文件保存到其他处。

    12. 点击“Install（安装）”并确认操作。

    13. 在提示时更新 Ventoy。

    14. 将 `Linux Mint 22` ISO 移动到 Ventoy 分区（避免 EFI 分区）。


    记得备份你的数据。


    ### 对于 Windows 系统

    为 Linux Mint 22 设置 Ventoy，请遵循以下简单步骤：

    1. 访问 GitHub 上的 Ventoy 发布页面：[`github.com/ventoy/Ventoy/releases`](https://github.com/ventoy/Ventoy/releases)

    2. 下载 Windows 版本的 `ventoy-1.0.98-windows.zip`。

    3. 找到下载的 `ventoy-1.0.98-windows.zip` 文件。

    4. 打开压缩包并寻找 `ventoy-1.0.98` 文件夹。

    5. 在内部运行 `Ventoy2Disk` 程序。

    6. 点击 Ventoy2Disk 中的刷新图标。

    7. 从 `Device（设备）` 列表中选择你的 USB 盘。

    8. 在你的 USB 优盘上安装或更新 Ventoy。

    9. 将 `Linux Mint 22` ISO 文件移动到 Ventoy 分区，但不是 EFI 分区。


    大功！你的 USB 盘现在已准备在 Linux 或 Windows 上进行 Linux Mint 22 安装。


    ### DVD-R/RW 光盘

    DVD-R/RW 光盘带有怀旧魅力，且非常适合归档存储，因为它们不容易受到电磁干扰导致数据丢失。然而，它们很脆弱，与 USB 优盘相比存储容量有限。Type
    A 和 Type C USB 拥有更高的传输速度和更坚固的结构，是频繁使用和便携的理想选择。缺点是什么？它们可能更贵，并且更容易受到病毒或硬件故障的影响。本质上，DVD
    是你预算有限时长期存储的首选，而 USB 在日常任务的效率和耐用性胜胜。


    #### Brasero

    Brasero 是一款实用的 GNOME 应用，用于刻录 CD 和 DVD，提供了多种功能以便快速方便创建光盘。它支持编辑光盘内容、多会话和 Joliet
    扩展，并可以将镜像写入硬盘。对于音频 CD，它处理多种格式，并允许对音轨静隙进行详细编辑。此外，Brasero 还可以复制光盘、保存项目、擦除重写介质并预览多媒体文件。它的界面可以自定义并支持拖放操作，确保流畅的光盘刻录体验。


    ## 安装 Brasero 并刻录 Linux Mint 22 ISO

    要设置 Brasero 并刻录 Linux Mint 22 ISO，请遵循以下步骤：


    ### 对于 Debian 和 Ubuntu

    * 打开终端。

    * 输入 `sudo apt install brasero` 并按回车。


    ### 对于 Red Hat 和 Fedora

    * 打开终端。

    * 输入 `sudo dnf install brasero` 并按回车。


    ### 对于 Gentoo

    * 打开终端。

    * 输入 `sudo emerge brasero` 并按回车。


    ### 对于 CentOS 8 及旧版本

    * 打开终端。

    * 输入 `sudo yum install brasero` 并按回车。


    ### 对于 openSUSE

    * 打开终端。

    * 输入 `sudo zypper install brasero` 并按回车。


    ### 对于 Arch Linux

    * 打开终端。

    * 输入 `sudo pacman -S brasero` 并按回车。


    接下来，准备一张空白 DVD+R 光盘（4.7GB）并确保你的 DVD 刻录机兼容。从应用程序菜单或通过终端输入 `brasero` 启动 Brasero。在
    Brasero 中：

    * 选择 `Burn image（刻录镜像）`。

    * 找到并选择 `linuxmint-22.0-cinnamon-64bit.iso` 文件。

    * 将光盘放入驱动器。

    * 点击 `Burn（刻录）` 开始过程。


    CDBurnerXP


