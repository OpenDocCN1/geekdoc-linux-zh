    访问 Buttercup 官方网站 [`buttercup.pw/`](https://buttercup.pw/) 了解关于 Buttercup 的所有信息。


    ## 通过 GUI 使用 AppImage 安装 Buttercup：


    导航至发布页面：

    [`buttercup.pw/`](https://buttercup.pw/)


    点击 "Linux (AppImage)" 下载 Buttercup。


    将文件下载到你的 `~/Downloads` 文件夹。


    在 `Downloads` 文件夹中找到 `Buttercup-linux-x86_64.AppImage` 文件，右键点击它并选择“属性（Properties）”。


    在属性菜单中，切换到“权限（Permissions）”选项卡，并勾选“允许程序执行（Set as executable）”。


    双击 `Buttercup-linux-x86_64.AppImage` 文件开始安装过程。


    要创建一个 Buttercup AppImage `.desktop` 快捷方式，请在终端中执行以下步骤：


    使用命令导航到应用程序目录：

    ```

    cd /usr/share/applications

    ```


    运行以下命令打开一个新的 `.desktop` 文件进行编辑：

    ```

    sudo gedit buttercup1.desktop

    ```


    在 `buttercup1.desktop` 文件中输入以下细节：

    ```

    [Desktop Entry]

    Name=Buttercup

    Comment=Buttercup

    Exec=./Applications/Buttercup.AppImage

    Icon=terminal

    Terminal=false

    Type=Application

    Categories=Utility;Game;

    ```


    点击“保存（Save）”保存进度。或者，你可以点击“文件（File）”、“保存”，或点击 ☰ 图标选择“另存为（Save As）”，最后点击“保存”。保存后关闭编辑器。


    ## 媒体播放器


    媒体播放器无论是软件还是硬件，都能从存储设备、光盘或互联网等源播放音频视频文件。某些格式可能需要解码器，可以流播放在线内容，并且对 DVD 和蓝光支持的支持不相同。播放器的选择会影响媒体质量，为不同的格式使用多个播放器是常见做法。与存储和共享文件的媒体服务器不同，播放器并非为编辑设计，但通常支持字幕、更新和皮肤。开源播放器提供了广泛的格式支持和自定义。播放列表有助于组织媒体，某些播放器还可以转换文件格式或流播放网络电台。轻量级播放器占用资源极少，是配置较低的系统的理想选择。


    VLC 是一款功能强大、免费开源的媒体播放器，适用于桌面及 Android 和 iOS 等移动设备。它由 VideoLAN 项目开发，支持各种音频、视频和流格式，包括
    DVD。它可以流播放媒体并转码文件，内置了 `libavcodec` 库的解码器。VLC 在 Linux 和 macOS 上通过 `libdvdcss` 支持加密
    DVD 播放，并可在各大应用商店下载，但由于 DVD 解密，其法律状态在不同地区有所异。


    Parole 媒体播放器为 Xfce 桌面设计，使用 `GStreamer` 框架播放各种媒体类型，包括本地文件、DVD 和流。它非常轻量、通过插件可扩展，且资源利用率高。它支持拖放播放列表和基础播放控制，但缺少高级配置选项，并在处理损坏文件和高分辨率显示器时较为吃力，通用性不如
    `mpv` 或 `VLC` 等播放器。


    SMPlayer 是适用于 Windows 和 Linux 的免费开源播放器，通过内置适用于任何视频和音频格式的解码器提供无缝体验。它会记住每个文件的播放设置，确保你以相同的设置继续播放。作为
    `MPlayer` 的图形界面程序，它支持 YouTube 播放、字幕下载，并提供多种皮肤和高级功能，无需外部解码器。SMPlayer 支持超过 30 种语言，让跨平台的媒体播放变得简单且可定制。


    Haruna 是一款适用于 KDE Plasma 的开源视频播放器，提供了通过 `youtube-dl` 播放在线视频、YouTube 播放列表、自动播放列表和自定义快捷键等功能。它直观的设计和对各种视频格式的兼容性使其成为
    Linux 用户的首选。通过自动跳过章节和可调字幕设置，Haruna 增强了观看体验。可在 Flathub 和 Ubuntu 仓库获取，是寻求全面媒体播放器的人的必备尝试。


    Dragon Player 是 KDE 桌面的多媒体播放器，专注于简单性，提供没有过度功能的直接体验。它基于 `Codeine` 开发于 KDE 3，现在适用于
    KDE SC 4，使用 `Phonon` 进行多媒体框架支持。它的功能包括简洁的界面、视频续播、字幕支持、可调的视频显示设置以及 CD/DVD 播放。Dragon
    Player 免费开源，是那些看重易用性而非复杂性的人的理想选择。


