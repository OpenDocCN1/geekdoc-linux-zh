    Searx is a free, open-source metasearch engine that prioritizes user privacy by
    not sharing IP addresses or search histories. It blocks tracking cookies and uses
    `HTTP POST` for queries to enhance privacy. Inspired by Seeks, Searx offers direct
    links to sites with options for cached or proxied views. It supports searches
    across various domains and allows users to run private instances or use public
    ones, including Tor services. Searx fetches results from over 80 engines, with
    customizable settings saved in a cookie. It also supports special search operators
    for tailored queries.


    OpenStego is a free, Java-based steganography tool that hides data within images
    and offers watermarking to protect copyrights, working across various platforms.
    It supports encryption for extra security, making it a comprehensive solution
    for concealing messages or verifying ownership without altering the appearance
    of digital files.


    Tor, short for The Onion Router, is free software that enables anonymous communication
    by directing Internet traffic through a global network of volunteer relays. Initially
    developed for secure U.S. intelligence communication, Tor now serves millions,
    masking users'' locations and internet use from surveillance. Though intended
    for privacy and freedom, Tor''s use spans from lawful activities to illicit trade
    and information leaks, sparking debate over its implications on privacy versus
    security.


    i2pd is a C++ tool for accessing I2P, an encrypted network ensuring anonymous
    communication by hiding users'' IP addresses. Unlike Java I2P, i2pd focuses solely
    on routing, requires no Java, and offers better performance with lower resource
    use. It supports various applications, from file-sharing to messaging, all while
    maintaining anonymity and security online.


    # Searx


    Visit the official Searx website at [https://github.com/searx/searx](https://github.com/searx/searx)
    for all things Searx.


    ## Installing Searx via APT in the Terminal


    First, update your package lists:


    ```bash

    sudo apt update

    ```


    Next, install necessary packages:


    ```bash

    sudo apt install git rsync make gcc libc6-dev libssl-dev zlib1g-dev libpcre2-dev
    libevent-dev build-essential zlib1g-dev libpcre2-dev libsqlite3-dev libssl-dev
    libevent-dev libsystemd-dev curl wget git libxslt-dev python3-dev python3-babel
    python3-venv python3-pip

    ```


    Install and use Node Version Manager (NVM) with Node.js version 16:


    ```bash

    nvm install 16

    nvm use 16

    ```


    Prepare the Searx environment:


    ```bash

    cd ~/

    git clone https://github.com/searx/searx.git

    cd searx

    python3 -m venv venv source venv/bin/activate

    ```


    Open `requirements.txt` and replace any `werkzeug` entry with:


    ```text

    werkzeug==2.2.2

    ```


    Then save your changes.


    Install the Python requirements:


    ```bash

    pip install -r requirements.txt

    ```


    Copy the default settings file and customize:


    ```bash

    cp searx/settings.yml searx/settings_custom.yml

    gedit searx/settings.yml

    ```


    Edit `settings.yml` to your preference, including changing the secret key.


    Enable advanced search in `preferences.py` by setting `advanced_search` to `True`:


    ```bash

    gedit searx/preferences.py

    ```


    Find `settings[''ui''].get(''advanced_search'', False)` and change `False` to
    `True`. Save all changes and exit the editor.


    Deactivate the virtual environment:


    ```bash

    deactivate

    ```


    Start Searx with:


    ```bash

    sh -c ''/home/username/searx/venv/bin/python /home/username/searx/searx/webapp.py''

    ```


