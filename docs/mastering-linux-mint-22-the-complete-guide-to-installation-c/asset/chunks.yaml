    ## Web Browsers


    Web browsers are tools that let us visit websites by fetching content from the
    web or local storage to display on our devices. Whether on computers or mobile
    phones, browsers like `Google Chrome` and `Safari` connect to web servers when
    we enter a URL, allowing us to explore pages securely via `HTTPS`. They''re different
    from search engines, serving to render web pages, store cookies for personalization
    and tracking, and use caches to speed up revisits. Privacy features help manage
    these cookies, ensuring a safer browsing experience.


    Chromium, an open-source browser project by Google, aims for a safer, faster web.
    Unlike `Chrome`, it’s fully open-source, missing some features like automatic
    updates and certain codecs. It’s the foundation for many browsers, including `Chrome`
    and `Edge`, focusing on security through its multi-process architecture and contributions
    from various tech giants.


    Ungoogled-Chromium is a version of Chromium modified to eliminate Google web service
    dependencies while maintaining the original experience. It enhances privacy and
    control, requiring manual activation of certain features. It blocks internal Google
    requests and borrows tweaks from projects like `Inox` and `Bromite` for a privacy-focused
    browsing experience.


    Google Chrome, launched in 2008, is a popular web browser by Google. Built on
    free software from `Apple WebKit` and `Mozilla Firefox`, it’s available on multiple
    platforms, including Windows, Linux, macOS, iOS, and Android. Known for strong
    performance, it features a minimalistic interface and unique tools like the `omnibox`
    for URL and search, and a comprehensive `Chrome Web Store` for extensions and
    themes.


    Microsoft Edge, launched by Microsoft in 2015, evolved from its original `EdgeHTML`
    base to a Chromium foundation in 2020. This change enhanced compatibility and
    performance across devices. `Edge` features PDF reading, `WebAssembly` support,
    and an `Internet Explorer` mode for compatibility. It integrates seamlessly with
    Microsoft’s services, offering voice control, search functionality, and a clutter-free
    `Reading Mode`.


    Thorium Browser is a high-performance variant of Chromium, optimized for modern
    CPUs. It mirrors Google Chrome’s functionality but introduces enhancements and
    patches for improved speed and privacy. It excludes Google’s telemetry and integrates
    alternative search engines by default, catering to a more tech-savvy audience.


    Vivaldi, launched in 2015 by Vivaldi Technologies, targets tech enthusiasts and
    former Opera users seeking rich features and customization. It offers unique UI
    customization, built-in ad and tracker blockers, email support, and innovative
    tab management, supporting `Chrome` and `Firefox` extensions.


    Brave is a free, open-source browser focused on privacy, blocking most ads and
    trackers by default. It rewards users with `Basic Attention Tokens (BAT)` for
    viewing optional ads. Brave includes a built-in `VPN`, a crypto wallet, and its
    own search engine, prioritizing user consent and privacy.


    Firefox, developed by Mozilla, is a free, open-source web browser known for speed,
    privacy features, and flexibility. It supports multiple platforms and uses the
    `Gecko` engine for web standards compliance. Features include tabbed browsing,
    private browsing, and various developer tools. Firefox remains popular for its
    commitment to user privacy and web standards.


    Firefox ESR is designed for organizations needing stable web deployment without
    frequent updates. It focuses on security and stability fixes, not the latest features,
    offering unmatched data protection and flexible deployment, making it ideal for
    businesses and universities.


    Waterfox, a Firefox fork, focuses on ethics, user privacy, and performance. It
    supports Firefox add-ons and emphasizes privacy by disabling telemetry. Waterfox
    ensures a safe browsing experience without compromising speed or functionality.


    LibreWolf is an independent Firefox variant focused on privacy, security, and
    freedom. It enhances protection against tracking and fingerprinting, excludes
    telemetry, and includes pre-installed `uBlock Origin` for ad-free browsing.


    Pale Moon is a free, open-source browser optimized for modern processors. Built
    on its own `Goanna` engine, it focuses on efficiency, customization, and privacy,
    supporting classic plugins and extensive customization.


    Mullvad Browser, developed with the Tor Project, enhances online privacy. It defaults
    to private browsing, leaves no cookies or history behind, and combats fingerprinting.
    It’s fine-tuned for privacy, minimizing tracking and fingerprinting.


    Basilisk, based on the `Goanna` engine and `UXP` platform, offers a stable, change-resistant
    browsing experience. It supports modern web standards and various plugins, providing
    a familiar browsing experience.


