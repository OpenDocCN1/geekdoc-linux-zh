    ```

    sudo snap install haruna

    ```


    ## Dragon Player


    Visit the official Dragon Player website at [https://apps.kde.org/en-gb/dragonplayer/](https://apps.kde.org/en-gb/dragonplayer/)
    for all things Dragon Player.


    ### Installing Dragon Player via SYSTEM PACKAGE Package through Software Manager:


    1. Open Software Manager and search for Dragon Player.

    2. Click on Dragon Player, then on the Source Selection Box.

    3. Choose `SYSTEM PACKAGE` and click Install.


    ### Installing Dragon Player via APT in the Terminal:

    ```

    sudo apt install dragon

    ```


    ### Installing Dragon Player via SNAP in the Terminal:

    ```

    sudo snap install dragon

    ```


    ## System Utilities


    System utilities are software programs that help manage and optimize a computer’s
    system or application software. They work behind the scenes, performing tasks
    like backing up data, compressing disks, and managing files. These utilities can
    be part of the operating system or installed separately to enhance or replace
    default tools. They play a crucial role in ensuring security, optimizing performance,
    and keeping computers running smoothly. Some examples include anti-virus programs,
    disk defragmenters, debuggers, diagnostic programs, and network utilities. They
    are essential for both regular users and IT professionals, requiring different
    levels of user privileges based on their impact on the system.


    `QDirStat` is a graphical tool for managing disk space, offering a dual view of
    directories and files with a traditional tree and a colorful treemap. It introduces
    features like multi-selection, custom cleanup actions, and detailed error reporting.
    It''s user-friendly and versatile, making it easy to identify and manage files
    by their types.

