    YChanEx 是一款旨在从 4chan 和 8chan 等留言板下载帖子和图片的工具。它可以在带有 .NET 4.5 的 Windows 上运行，也可以通过
    WINE 在 Linux 上运行，具有独特的“ychanex:” 浏览器协议以方便下载。该软件仍在开发中，支持多种留言板，并包含代理支持、brotli 解压缩和帖子历史等功能。最近的更新改进了可靠性和用户界面，并计划了更多增强。YChanEx
    旨在简化留言板内容的存档，使其更容易保存这些论坛的讨论和图片。


    # YChanEx


    访问 YChanEx 官方网站 [`github.com/murrty/YChanEx`](https://github.com/murrty/YChanEx)
    了解有关 YChanEx 的所有信息。


    ## 通过终端或 GUI 中的 APT 安装 YChanEx：


    更新包管理器元数据：


    ```

    sudo apt update

    ```


    启用 32 位架构支持：


    ```bash

    sudo dpkg --add-architecture i386

    sudo apt update

    ```


    下载并添加 WineHQ 仓库密钥：


    ```bash

    sudo mkdir -p /etc/apt/keyrings

    sudo wget -O /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key

    sudo wget -NP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources

    ```


    安装 WineHQ：


    ```bash

    sudo apt update

    sudo apt install winehq-staging

    ```


    导航到发布页面：


    [`github.com/murrty/YChanEx/releases/tag/2.0`](https://github.com/murrty/YChanEx/releases/tag/2.0)


    下载最新的 `YChanEx.exe`。


    进入 `~/Downloads` 并双击 `YChanEx.exe` [如果此操作不起，请右键点击并将 `WINE` 设置为默认程序]。


    要为 YChanEx 创建 `.desktop` 快捷方式，请在终端中执行以下步骤：


    使用命令进入应用程序目录：


    ```bash

    cd /usr/share/applications

    ```


    运行以下命令打开并编辑一个新的 `.desktop` 文件：


    ```bash

    sudo gedit ychanex1.desktop

    ```


    在 `ychanex1.desktop` 文件中输入以下详情：


    ```ini

    [Desktop Entry]

    Name=YChanEx

    Comment=YChanEx

    Exec=/bin/bash -c "cd ~/Downloads && wine YChanEx.exe"

    Icon=terminal

    Terminal=false

    Type=Application

    Categories=Utility;Game;

    ```


    点击“保存”保存进度。或者，您也可以点击“文件”，然后“保存”，或者点击 ☰ 图标选择“另存为”，最后点击“保存”。保存后关闭编辑器。


    # 电子书阅读器


    电子书软件将您的设备转换为数字书籍，允许在计算机、平板电脑或手机上阅读。它支持 EPUB、PDF 和 Word 等多种格式，每个格式都有独特的功能和兼容性。了解这些格式有助于您根据阅读偏好选择合适的格式，确保在不同设备上获得流畅愉悦的体验。


    Calibre 是一款免费开源的电子书套件，允许用户跨多种格式组织、显示、编辑、创建和转换电子书。它支持与许多电子阅读器同步。您可以直接编辑 EPUB 和
    AZW3 格式，而其他格式需要转换。Calibre 提供了大量的插件，支持元数据管理，并允许导入电子书（包括无线同步）。尽管它不支持原生移除 DRM，但可以使用插件来启用此功能。从
    6.0 版本开始，全文搜索增强了其库功能，并通过基于 Python 的配方方便了内容转换。


    Bookworm 是一款适用于 Windows 的多功能免费电子书阅读器，支持 PDF、EPUB、MOBI 等格式。它为可访问性而设计，提供纯文本和完整格式视图。功能包括文本转语音、针对扫描文档的
    OCR 以及用于快速查找术语的维基百科集成。用户可以轻松地导航文档、做注释，甚至从网页中提取文章。无论是使用屏幕阅读器还是享受朗读功能，Bookworm 都增强了每个人的阅读体验。


