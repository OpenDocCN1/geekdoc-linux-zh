  trans: "\n\n## TCP 端口\n```bash\nsudo ufw allow 80/tcp\n```\n\n## UDP 端口\n```bash\n\
    sudo ufw allow 80/udp\n```\n\n## UFW - 多端口规则\n若要在 UFW 中允许多个端口，请在终端运行以下命令：\n\n\
    ### TCP 端口\n```bash\nsudo ufw allow 80,443/tcp\n```\n\n### UDP 端口\n```bash\nsudo\
    \ ufw allow 80,443/udp\n```\n\n## UFW - 端口范围规则\n若要在 UFW 中允许一个端口范围，请在终端运行以下命令：\n\
    \n### TCP 端口\n```bash\nsudo ufw allow 1119:1120/tcp\n```\n\n### UDP 端口\n```bash\n\
    sudo ufw allow 1119:1120/udp\n```\n\n## UFW - 多端口与端口范围规则\n若要在 UFW 中允许多个端口和端口范围，请在终端运行以下命令：\n\
    \n### TCP 端口\n```bash\nsudo ufw allow 80,443,1119:1120/tcp\n```\n\n### UDP 端口\n\
    ```bash\nsudo ufw allow 80,443,1119:1120/udp\n```\n\n## UFW 端口状态\n要检查 UFW 端口状态，请运行：\n\
    ```bash\nsudo ufw status\n```\n\n## 删除 UFW 端口规则\n要删除 UFW 端口规则，请在终端运行以下命令：\n\n\
    1. 按顺序列出所有当前 UFW 规则：\n   ```bash\n   sudo ufw status numbered\n   ```\n2. 通过数字删除特定的\
    \ UFW 规则（将 `33` 替换为你想删除的实际规则编号）：\n   ```bash\n   sudo ufw delete 33\n   ```\n\
    3. 再次列出所有 UFW 规则以验证规则已删除：\n   ```bash\n   sudo ufw status numbered\n   ```\n\n\
    ## GUFW\n访问 GUFW 官方网站 [`costales.github.io/projects/gufw/`](https://costales.github.io/projects/gufw/)\
    \ 获取更多信息。\n\n### 通过 GNOME 软件安装 GUFW\n1. 打开 GNOME 软件并搜索 GUFW。\n2. 点击“防火墙配置”（Firewall\
    \ Configuration）。\n3. 在源源选择框中，选择“系统软件包”（System Package）。\n4. 点击“安装”。\n\n### 在终端通过\
    \ APT 安装 GUFW\n要使用 APT 安装 GUFW，请运行以下命令：\n```bash\nsudo apt update && sudo apt\
    \ upgrade\nsudo apt install gufw\n```\n\n### GUFW 单端口规则\n若要在 GUFW 中设置单个端口规则，请按照以下步骤操作：\n\
    1. 从应用程序菜单打开 GUFW，标识为“防火墙配置”（Firewall Configuration）。\n2. 在“配置文件”（Profile）框中，选择“家庭”（Home）。\n\
    3. 通过向右切换“状态”（Status）开关来激活防火墙。\n4. 对于“入站”（Incoming）流量，从下拉框中选择“拒绝”（Deny）。\n5. 对于“出站”（Outgoing）流量，选择“允许”（Allow）。\n\
    6. 导航到“规则”（Rules）部分并点击 “+”按钮添加新规则。\n7. 进入“简单”（Simple）选项卡。\n8. 在“名称”（Name）框中，输入“HTTP”。\n\
    9. 从“策略”（Policy）下拉菜单中选择“允许”（Allow）。\n10. 在“方向”（Direction）下，为入站流量选择“入”（In）。\n11.\
    \ 对于协议，为 TCP 和 UDP 选择“两者”（Both），仅为 TCP 选择“TCP”，仅为 UDP 选择“UDP”。\n12. 在“端口”（Port）框中输入“80”。\n\
    13. 点击“添加”（Add）应用规则。\n此方法允许您在 GUFW 中高效地管理端口规则，确保防火墙设置根据您的需求正确配置。\n\n### GUFW 多端口规则\n\
    若要在 GUFW 中配置多个端口的规则，请按照以下步骤操作：\n1. 从应用程序菜单打开 GUFW，确保选择了“防火墙配置”（Firewall Configuration）。\n\
    2. 导航到“规则”（Rules）部分并点击 “+”按钮添加新规则。\n3. 在规则创建窗口中选择“简单”（Simple）选项卡。\n4. 在“名称”（Name）字段中，输入描述性名称，例如“HTTP/HTTPS”。\n\
    5. 从“策略”（Policy）下拉菜单中选择“允许”（Allow）以许可流量。\n6. 将“方向”（Direction）设置为入站规则的“入”（In）。\n\
    7. 对于“协议”（Protocol），根据您的需求，如果同时需要 TCP 和 UDP 则选择“两者”（Both），仅需 TCP 选择“TCP”，仅需 UDP\
    \ 选择“UDP”。\n8. 在“端口”（Port）字段中，输入您想要允许的端口，用逗号分隔，例如“80,443”。\n9. 点击“添加”（Add）完成并应用规则。\n\
    此方法允许您在 GUFW 中为多个端口设置防火墙规则，简化了系统网络流量的管理。\n\n### GUFW 端口范围规则\n若要在 GUFW 中实现端口范围规则，请按照以下步骤操作：\n\
    1. 从您的应用程序菜单打开 GUFW，选择“防火墙配置”（Firewall Configuration）。\n2. 导航到“规则”（Rules）部分并按下\
    \ “+”按钮创建新规则。\n3. 切换到规则创建窗口中的“简单”（Simple）选项卡。\n4. 在“名称”（Name）字段中为您的规则输入名称，例如“HTTP\
    \ Range”。\n5. 从“策略”（Policy）下拉菜单中选择“允许”（Allow）以许可流量。\n6. 从“方向”（Direction）下拉菜单中为入站流量选择“入”（In）。\n\
    7. 根据您的需求，设置 TCP 端口选择“TCP”，设置 UDP 端口选择“UDP”。\n8. 在“端口”（Port）字段中指定您想要打开的端口范围，例如“1112:1114”。\n\
    9. 点击“添加”（Add）应用并保存您的新范围端口规则。\n此方法允许您在 GUFW 中高效地管理端口范围，对您的网络流量权限进行精确控制。\n\n###\
    \ GUFW 多端口规则与端口范围规则\n若要在 GUFW 中配置多个端口和端口范围的规则，请按照以下步骤操作：\n1. 从您的应用程序菜单启动 GUFW，选择“防火墙配置”（Firewall\
    \ Configuration）。\n2. 导航到“规则”（Rules）部分并点击 “+”按钮添加新规则。\n3. 在规则创建窗口中选择“简单”（Simple）选项卡。\n\
    4. 在“名称”（Name）字段中输入描述性名称，如“HTTP”。\n5. 从“策略”（Policy）下拉菜单中选择“允许”（Allow）以启用流量。\n\
    6. 将“方向”（Direction）设置为入站规则的“入”（In）。\n7. 对于协议，根据您的需求为 TCP 端口选择“TCP”或为 UDP 端口选择“UDP”。\n\
    8. 在“端口”（Port）字段中输入需要打开的端口和范围，例如“80,443,1119:1120”。\n9. 点击“添加”（Add）应用规则。\n此方法允许您在\
    \ GUFW 中为多个端口和端口范围设置防火墙规则。\n\n### GUFW 添加规则\n若要在 GUFW 中添加防火墙规则，请按照以下步骤操作：\n1.\
    \ 从应用程序菜单启动 GUFW，选择“防火墙配置”（Firewall Configuration）。\n2. 导航到“规则”（Rules）部分并点击 “+”按钮添加新规则。\n\
    3. 选择规则创建窗口中的“简单”（Simple）选项卡。\n4. 在“名称”（Name）字段中输入描述性名称，如“HTTP”。\n5. 从“策略”（Policy）下拉菜单中选择“允许”（Allow）以启用流量。\n\
    6. 将“方向”（Direction）设置为入站规则的“入”（In）。\n7. 对于协议，根据您的需求为 TCP 端口选择“TCP”或为 UDP 端口选择“UDP”。\n\
    8. 在“端口”（Port）字段中输入需要打开的端口和范围，例如“80,443,1119:1120”。\n9. 点击“添加”（Add）应用规则。\n此方法允许您在\
    \ GUFW 中为多个端口和端口范围设置防火墙规则。\n\n### GUFW 禁用规则\n若要在 GUFW 中禁用规则，请按照以下步骤操作：\n1. 从应用程序菜单打开\
    \ GUFW，选择“防火墙配置”（Firewall Configuration）。\n2. 导航到“规则”（Rules）部分。\n3. 找到要禁用的规则。\n\
    4. 点击规则旁侧的开关将其禁用。\n5. 点击“保存”应用更改。\n6. 通过向右切换“状态”（Status）开关来禁用防火墙。\n此方法允许您在需要时临时禁用规则。\n\
    \n### GUFW 删除规则\n要删除 UFW 规则，请按照以下步骤操作：\n1. 按顺序列出所有当前 UFW 规则：\n   ```bash\n   sudo\
    \ ufw status numbered\n   ```\n2. 通过数字删除特定的 UFW 规则（将 `33` 替换为你想删除的实际规则编号）：\n \
    \  ```bash\n   sudo ufw delete 33\n   ```\n3. 再次列出所有 UFW 规则以验证规则已删除：\n   ```bash\n\
    \   sudo ufw status numbered\n   ```\n\n"
- fmt: 'This setup ensures your ClamAV database is regularly updated, and your system
    is scanned daily for any threats, enhancing your security measures.


    # ClamTk


    Visit the official ClamTk website at [https://github.com/dave-theunsub/clamtk](https://github.com/dave-theunsub/clamtk)
    for more information.


    ### Installing ClamTk via DEB/FLATPAK Package through GNOME Software


    1. Open GNOME Software and search for `ClamTk`.

    2. Click on `ClamTk`, then on the Source Selection Box.

    3. Choose `DEB` or `FLATPAK` and click `Install`.


    ### Installing ClamTk via APT in the Terminal


    To install `ClamTk`, type these commands:


    ```bash

    sudo apt update && sudo apt upgrade

    sudo apt install clamtk

    ```


    ### Installing ClamTk via FLATPAK in the Terminal


    To install via `FLATPAK`, type this command:


    ```bash

    flatpak install flathub com.gitlab.davem.ClamTk

    ```


    # Chkrootkit


    Visit the official chkrootkit website at [https://www.chkrootkit.org/](https://www.chkrootkit.org/)
    for more information.


    ### Installing Chkrootkit via APT in the Terminal


    To install `Chkrootkit`, type these commands:


    ```bash

    sudo apt update

    sudo apt install chkrootkit

    ```


    ### Chkrootkit Daily Scans


    To schedule daily `chkrootkit` scans, open your terminal and run:


    ```bash

    sudo crontab -e

    ```


    In the `crontab` file, insert the following line:


    ```bash

    2 22 * * * /usr/sbin/chkrootkit -x -q -r / >> /var/log/chkrootkit.log 2>&1

    ```


    This command configures a daily scan at 10:02 PM, quietly logging the results
    to `/var/log/chkrootkit.log`. Save your changes by pressing `CTRL + S`, then exit
    with `CTRL + X`.


    # Rkhunter


    Visit the official Rkhunter website at [https://sourceforge.net/projects/rkhunter/](https://sourceforge.net/projects/rkhunter/)
    for more information.


    ### Installing Rkhunter via APT in the Terminal


    To install `Rkhunter`, type these commands:


    ```bash

    sudo apt update

    sudo apt install rkhunter

    ```


    If a dialog box appears concerning `postfix`, choose the "No Configuration" option
    and proceed.


    ### Rkhunter Daily Update & Scans


    To set up daily updates and scans with `rkhunter`, open your terminal and type:


    ```bash

    sudo crontab -e

    ```


    In the `crontab` file, add the following line:


    ```bash

    2 21 * * * /usr/local/bin/rkhunter --cronjob --update --quiet --remove

    ```


    This schedules `rkhunter` to update and run a quiet scan daily at 9:02 PM, maintaining
    your system''s security without intrusive notifications. Save your modifications
    by pressing `CTRL + S` and exit using `CTRL + X`.


    # Firejail


    Visit the official Firejail website at [https://firejail.wordpress.com/](https://firejail.wordpress.com/)
    for all things Firejail.


    ### Installing Firejail via APT in the Terminal


    Type these commands:


    ```bash

    sudo apt update

    sudo apt install firejail

    ```


    # Firetools


    Visit the official Firetools website at [https://github.com/netblue30/firetools](https://github.com/netblue30/firetools)
    for more information about Firetools.


    ### Installing Firetools via DEB package through GNOME Software


    1. Open GNOME Software and search for `Firetools`.

    2. Click on `Firetools`, then on the Source Selection Box.

    3. Choose `System Package` or `FLATPAK` and hit `Install`.


    ### Installing Firetools via APT in the Terminal


    Type these commands:


    ```bash

    sudo apt update && sudo apt upgrade

    sudo apt install firejail firetools

    ```


    # OSSEC


    Visit the official OSSEC website at [https://www.ossec.net/](https://www.ossec.net/)
    for all things OSSEC.


    ### Installing OSSEC via APT in the Terminal


    To install `OSSEC`, open your terminal and execute the following command to install
    the necessary dependencies:


    ```bash

    sudo apt-get install make gcc libc6-dev libssl-dev zlib1g-dev libpcre2-dev libevent-dev
    build-essential zlib1g-dev libpcre2-dev libsqlite3-dev libssl-dev libevent-dev
    libsystemd-dev curl wget git libxslt-dev python3-dev python3-babel python3-venv
    python3-pip

    ```


    Next, install the version 16 of `Node.js` & `Npm` using your Node Version Manager
    (`NVM`):


    ```bash

    nvm install 16

    ```


    Next, set your Node Version Manager (`NVM`) to use version 16:


    ```bash

    nvm use 16

    ```


    Download `OSSEC` version 3.7.0 using `wget`:


    ```bash

    wget https://github.com/ossec/ossec-hids/archive/refs/tags/3.7.0.tar.gz

    ```


    Extract the downloaded archive:


    ```bash

    tar -xzvf 3.7.0.tar.gz

    ```


    Navigate into the `OSSEC` directory:


    ```bash

    cd ossec-hids-3.7.0

    ```


    Initiate the installation script:


    ```bash

    sudo ./install.sh

    ```


    During the installation, follow these instructions:

    - Select English by typing `en` and press `Enter`.

    - Choose the local installation type by typing `local` and specify the installation
    path as `/var/ossec`.

    - Respond with `n` for the first question and `y` for the subsequent ones to accept
    the defaults, apart from the email and adding additional IPs to the whitelist.
    You can skip the email notification and the additional whitelist IPs features
    if you prefer.

    - Confirm your choices by pressing `Enter` at the end.


    ### OSSEC Systemd Service


    Begin by opening your terminal and entering the following command to edit the
    `OSSEC` service file:


    ```bash

    sudo gedit /etc/systemd/system/ossec.service

    ```


    In the `ossec.service` file, insert the following configuration:


    ```ini

    [Unit]

    Description=OSSEC service

    After=network.target


    [Service]

    Type=simple

    ExecStart=/var/ossec/bin/ossec-control start

    ExecStop=/var/ossec/bin/ossec-control stop

    TimeoutStartSec=0

    Restart=on-failure

    StartLimitInterval=0


    [Install]

    WantedBy=multi-user.target

    ```


    Save your changes and close the editor.


    Next, execute these commands in the terminal to enable, start, and check the status
    of the `OSSEC` service:


    ```bash

    sudo systemctl enable ossec.service

    sudo systemctl start ossec.service

    sudo systemctl status ossec.service

    ```


    # Alternative DNS Services


    ### Google DNS


    `Google DNS` is available at: [https://developers.google.com/speed/public-dns](https://developers.google.com/speed/public-dns)

    - The IPv4 addresses are `8.8.8.8` and `8.8.4.4`.

    - The IPv6 addresses are `2001:4860:4860::8888` and `2001:4860:4860::8844`.


    ### Cloudflare DNS


    `Cloudflare DNS` can be accessed at: [https://www.cloudflare.com/en-gb/learning/dns/what-is-1.1.1.1/](https://www.cloudflare.com/en-gb/learning/dns/what-is-1.1.1.1/)

    - The IPv4 addresses are `1.1.1.1` and `1.0.0.1`.

    - The IPv6 addresses are `2606:4700:4700::1111` and `2606:4700:4700::1001`.


    ### Quad9 DNS


    `Quad9 DNS` is accessible at: [https://www.quad9.net/service/service-addresses-and-features](https://www.quad9.net/service/service-addresses-and-features)

    - The IPv4 addresses are `9.9.9.9` and `149.111.111.111`.

    - The IPv6 addresses are `2600:9700:4001::1011` and `2600:9700:4000::ff02`.


    ### Control D DNS


    `Control D DNS` is available at: [https://1.1.1.1](https://1.1.1.1)

    - The IPv4 addresses are `1.1.1.1` and `1.0.0.1`.

    - The IPv6 addresses are `2606:4700:4700::1111` and `2606:4700:4700::1001`.


    ### Ultimate Hosts Blacklist DNS


    `Ultimate Hosts Blacklist DNS` can be found at: [https://github.com/Ultimate-Hosts-Blacklist/Ultimate.Hosts.Blacklist?tab=readme-ov-file#raw-file-sources](https://github.com/Ultimate-Hosts-Blacklist/Ultimate.Hosts.Blacklist?tab=readme-ov-file#raw-file-sources)

    - The IPv4 addresses are `9.9.9` and `149.111.111.111`.

    - The IPv6 addresses are `2600:9700:4001::1011` and `2600:9700:4000::ff02`.


    ### DNS.WATCH DNS


    `DNS.WATCH` is accessible at: [https://dns.watch](https://dns.watch)

    - The IPv4 addresses are `84.200.69.80` and `84.200.70.40`.

    - The IPv6 addresses are `2001:1608:10:25::1c04:b12f` and `2001:1608:10:25::9249:d69b`.


    # Hosts


    To set up a custom hosts file using both command line and GUI methods, follow
    these steps:


    - Visit the website: [https://github.com/Ultimate-Hosts-Blacklist/Ultimate.Hosts.Blacklist?tab=readme-ov-file#raw-file-sources](https://github.com/Ultimate-Hosts-Blacklist/Ultimate.Hosts.Blacklist?tab=readme-ov-file#raw-file-sources)

    - Find the `hosts` row, right-click on `Download`, and select `Save link as.`
    Then, click `Save`.

    - Next, execute these commands in your terminal:

    - Navigate to the `etc` directory:

    ```bash

    cd /etc

    ```

    - Rename the existing `hosts` file for backup:

    ```bash

    sudo mv hosts hosts_backup

    ```

    - Move to your `Downloads` folder:

    ```bash

    cd ~/Downloads

    ```

    - Copy the downloaded `hosts` file to `/etc`:

    ```bash

    sudo cp hosts /etc

    ```

    - Return to the `etc` directory:

    ```bash

    cd /etc

    ```

    - Change the ownership of the `hosts` file to `root`:

    ```bash

    sudo chown -R root hosts

    ```

    - Set the correct permissions for the file:

    ```bash

    sudo chmod 755 hosts

    ```


