    # USB 键盘与鼠标


    [`www.amazon.co.uk/gp/product/B00CBU0IV8`](https://www.amazon.co.uk/gp/product/B00CBU0IV8)


    我更喜欢 USB 键盘和鼠标，而不是 `PS/2` 的。`PS/2` 设备在旧主板上存在连接和供电方面的问题。无线键盘是不安全的，因为黑客可以窃取你的数据。投影键盘很酷但很贵。我每天使用
    `steelseries APEX 3 TKL` 键盘和 `steelseries Rival 3` 鼠标。它们非常坚固且运行良好。


    你可以在 Amazon 上购买：


    [`www.amazon.co.uk/s?k=steelseries+keyboard+and+mouse`](https://www.amazon.co.uk/s?k=steelseries+keyboard+and+mouse)


    它们对于需要安全且可靠设备的人来说非常好。


    # 信鸽


    使用信鸽投递信息听起来可能很有趣，但它非常安全。与数字通信不同，这种方式发送的消息保持私密，不受政府监控和电子数据库的影响。信鸽的价格在 300 到 1,000
    美元之间，取决于品种、繁殖者、训练和健康状况。


    你可以在这里找到它们：


    [`www.pigeonfarms.com/`](https://www.pigeonfarms.com/)

    [`racinghomer.com/`](https://racinghomer.com/)


    对于美国成本太高的用户，`PigeonGram` 提供了一个聪明的解决方案。这项服务让你通过鸽子从一个鸽巢向另一个鸽巢发送信息，最终通过 `USPS` 送到收件人地址，并带有跟踪功能。


    了解更多信息请访问：


    [`www.pigeongram.com/`](https://www.pigeongram.com/)


    这种古代与现代方法的结合提供了一种独特、安全的通信方式。


    # 学习古代语言


    学习如`苏美尔语`、`卢维语`或`古汉语`等古代语言既能保护隐私又能促进成长。通过掌握这些被遗忘的语言，你与原始母者的遗产和文化建立联系，并获得了一种当今极少数人理解的独特交流方式。这对于寻求更私密表达形式的人来说很有吸引力。


    任何对这些语言感兴趣的人都有许多资源，通过以下网站：


    [`www.amazon.co.uk/s?k=sumerian+language`](https://www.amazon.co.uk/s?k=sumerian+language)

    [`www.amazon.co.uk/s?k=luwian+language`](https://www.amazon.co.uk/s?k=luwian+language)

    [`www.amazon.co.uk/s?k=old+chinese+language`](https://www.amazon.co.uk/s?k=old+chinese+language)


    提供了多种材料，价格从 20 美元到 200 多元不等。这种投资支持了古代语言的保护，用历史和文化丰富了学习者的生活。


    # 手动编译


    手动编译软件是重要的，但对于没有连接互联网的系统来说可能非常耗时。这意味着查看源代码并选择特定设置，以确保软件与你的硬件和设置良好运行。这允许你进行自定义，例如构建一个不带`Software
    & Updates GUI`等特定功能的`GNOME`桌面环境，并默认关闭更新通知。这样，你就不需要每次重新安装系统时反复使用命令行指令或编辑`Ubuntu`中的文件。


    有时软件具有官方版本中没有的特殊或实验功能。例如，当你从源码编译`Chromium`时，你可以启用通常未开启的`GPU-acceleration`功能。这可以让你的系统更安静、更稳定。自己编译软件允许你使其更符合你的需求，提高性能和用户体验。


    # 使用胶带遮住摄像头和麦克风


    使用胶带遮住摄像头和麦克风是保护隐私的一种简单有效的方法。即使是 Facebook 的马克·扎克伯格也使用这种方法，显示了它对人的实用性。胶带廉价且多功能，大约
    5 美元。这确保了隐私，并鼓励使用外部高清摄像头和麦克风以获得更好的质量。这些替代方案容易寻找且价格实惠，比笔记本电脑内置摄像头和麦克风有巨大改进。


    可选胶带种类请访问：


    [`www.amazon.co.uk/s?k=thick+duct+tape`](https://www.amazon.co.uk/s?k=thick+duct+tape)


    对于高清摄像头和麦克风，请查看：


    [`www.amazon.co.uk/s?k=hd+webcam+and+microphone`](https://www.amazon.co.uk/s?k=hd+webcam+and+microphone)


    # 虚拟专用网络


    虚拟专用网络（VPN）通过互联网安全地连接设备到网络。它允许远程访问私网络并连接不同的网络，包括分布在不同地点的办公室。与专用线路相比，VPN 提高了安全性，降低了成本增加了远程工作的灵活性。它们使用隧道协议创建安全的虚拟连接，同时满足个人远程访问和企业站点连接的需求。配置范围从连接单个计算机到整个网络或连接多个组织。VPN
    适应各种安全级别和网络拓扑结构，支持从云计算到分支机构连接的各种用途。


    总部位于瑞士的`Proton VPN`在多个平台上提供安全、私密的网浏览，且不记录用户活动。它提供免费和付费版本，确保在公共网络上进行高速加密连接以保证安全，并访问全球范围内受限的内容。它强调易用性、可靠性和无日志政策。`Proton
    VPN`支持多达 10 台设备，与`Tor`集成，并具有`Secure Core`和`Perfect Forward Secrecy`等独特的安全增强功能。它由`Proton
    Mail`的制作创建，旨在让互联网对所有人更安全、更容易访问。


    `NordVPN`提供全面的在线安全保护，无论你在哪里都能保护你的日常活动。除了 VPN 服务，它还包括用于阻止恶意软件和广告的`Threat Protection`、用于创建私网络的`Meshnet`、用于账户受警的`Dark
    Web Monitor`以及用于一致在线身份的`Dedicated IP`。


    `Private Internet Access (PIA)`自 2010 年以来一直是受信任的 VPN 供应商，以其拥有 10,000 台服务器的海庞网络和稳固的零日志政策闻名。`PIA`属于`Kape
    Technologies`，支持多种平台并提供无限连接，在注重隐私的用户中非常流行。主要功能包括强大的种子下载能力、用于脚本的命令行工具，以及经过独立审计和法院验证的强大隐私和安全信誉。


