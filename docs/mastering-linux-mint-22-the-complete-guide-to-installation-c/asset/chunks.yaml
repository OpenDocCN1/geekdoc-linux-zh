- fmt: "\nThe default systemd timeout, typically set at 90 seconds, governs how long\
    \ systemd waits for a service to start or stop before considering the operation\
    \ failed. This timeout mechanism ensures system responsiveness by preventing indefinitely\
    \ hanging services. However, for more flexibility, systemd allows adjusting this\
    \ timeout according to specific needs, enabling services to have customized timeout\
    \ settings that can deviate from the default.\n\nImmutable files and folders are\
    \ digital assets that cannot be modified or deleted once created. This characteristic\
    \ ensures data integrity and security, especially in environments where preserving\
    \ historical accuracy and preventing unauthorized changes are crucial. While the\
    \ concept seems rigid, it's a safeguard against data tampering and loss, offering\
    \ reliability and peace in knowing that critical information remains untouched.\n\
    \nFFmpegthumbnailer is a lightweight tool designed to quickly generate video thumbnails,\
    \ enhancing file management efficiency. Utilizing the powerful `ffmpeg` library,\
    \ it decodes video frames, with its capabilities tied to `ffmpeg`s configuration.\
    \ Renowned for its speed and minimal resource usage, FFmpegthumbnailer is essential\
    \ for file managers, streamlining the process of creating visually informative\
    \ thumbnails for video files, aiding in quicker identification and access to video\
    \ content.\n\nLinux `.desktop` files are simple text files that provide essential\
    \ information to the desktop environment about software applications. They define\
    \ how a program is launched, its name, and the icon it uses. These files make\
    \ it easier for users to interact with applications through graphical interfaces\
    \ by enabling the creation of shortcuts.\n\nIn Linux Mint 22, power settings let\
    \ users manage how their computer uses energy, crucial for extending battery life\
    \ and efficiency. These settings include options for screen brightness, sleep\
    \ mode, and the behavior when the laptop lid is closed. Users can easily customize\
    \ these preferences via the system settings panel, ensuring their device operates\
    \ optimally while conserving power.\n\n# Night Light (GNOME)\n\nVisit the official\
    \ Night Light (GNOME) website at [https://foundation.gnome.org/](https://foundation.gnome.org/)\
    \ for all things Night Light (GNOME).\n\n### Setting Up Night Light (GNOME) via\
    \ the GUI:\n\n1. Open the application menu and select \"Settings.\"\n2. Navigate\
    \ to the \"Displays\" tab on the left sidebar, then click on \"Night Light.\"\n\
    3. Toggle the switch next to \"Night Light\" to enable it.\n4. In the \"Schedule\"\
    \ row, click the dropdown box and choose \"Manual Schedule.\"\n5. Set the active\
    \ period from 21:00 to 06:00.\n6. Adjust the color temperature slider to a position\
    \ just slightly below the midpoint between the third and fourth white lines.\n\
    \n# Night Light (Cinnamon & Redshift)\n\nVisit the official Night Light (Cinnamon\
    \ & Redshift) websites at [https://github.com/linuxmint/cinnamon](https://github.com/linuxmint/cinnamon)\
    \ and [https://github.com/jonls/redshift](https://github.com/jonls/redshift) for\
    \ all things Night Light (Cinnamon & Redshift).\n\n### Installing and Setting\
    \ Up Night Light (Cinnamon & Redshift) via the Terminal and GUI:\n\n```bash\n\
    sudo apt install redshift redshift-gtk wayland*\n```\n\nNavigate to your config\
    \ directory with:\n\n```bash\ncd ~/.config\n```\n\nEdit the Redshift configuration\
    \ by typing:\n\n```bash\nnano redshift.conf\n```\n\nInput the following settings:\n\
    \n```ini\n[redshift]\ntemp-night=2250\ntransition=1\nbrightness=1.0\ngamma=1.0\n\
    \n[location]\nadjustment-method=vidmode\nlocation-provider=manual\n```\n\nSave\
    \ changes with `CTRL + S` and exit with `CTRL + X`.\n\n# PipeWire Sound Crackle\
    \ & Popping Fixes\n\nVisit the official PipeWire website at [https://pipewire.org/](https://pipewire.org/)\
    \ for all things PipeWire.\n\n### To fix potential sound issues like crackling\
    \ or popping with PipeWire via Command Line and GUI:\n\nDisable audio power saving:\n\
    \n```bash\necho \"options snd_hda_intel power_save=0\" | sudo tee -a /etc/modprobe.d/audio_disable_powersave.conf\n\
    echo \"options snd_hda_intel power_save_controller=N\" | sudo tee -a /etc/modprobe.d/audio_disable_powersave.conf\n\
    ```\n\nVerify the changes:\n\n```bash\ncat /sys/module/snd_hda_intel/parameters/power_save\n\
    cat /sys/module/snd_hda_intel/parameters/power_save_controller\n```\n\nEdit the\
    \ PipeWire configuration to optimize performance:\n\n```bash\nsudo gedit /usr/share/pipewire/pipewire.conf\n\
    ```\n\nAdjust the quantum settings:\n- Change `#default.clock.quantum = 1024`\
    \ to `default.clock.quantum = 2048`.\n- Modify `default.clock.min-quantum = 16`\
    \ to `default.clock.min-quantum = 2048`.\n- Update `#default.clock.max-quantum\
    \ = 2048` to `default.clock.max-quantum = 4096`.\n\nSave changes and restart PipeWire\
    \ services:\n\n```bash\nsystemctl --user restart pipewire.service pipewire-pulse.service\
    \ pipewire-media-session.service\nsystemctl --user restart pipewire-multi.service\n\
    ```\n\nEnhance audio priority by editing:\n\n```bash\nsudo gedit /etc/security/limits.conf\n\
    ```\n\nAdd:\n\n```text\n@audio   -  nice      -20\n```\n\nSave and exit.\n\nRemove\
    \ potential conflicts by purging speech-dispatcher:\n\n```bash\nsudo apt remove\
    \ speech-dispatcher\n```\n\nEnsure all changes are consistent across PipeWire\
    \ configurations. Save and back up necessary files, then restart your computer.\n\
    \n# Linux Mint 22 System Variables\n\n### Setting Up Linux Mint 22 System Variables\
    \ via the Command Line and GUI:\n\nEdit the system-wide Bash configuration file:\n\
    \n```bash\nsudo gedit /etc/bash.bashrc\n```\n\nAdd the following settings:\n\n\
    ```bash\n# Environment Variables\n#export STAGING_WRITECOPY='1'\n#export DXVK_ENABLE_NVAPI='1'\n\
    #export WINEESYNC='1'\n#export WINEDEBUG='-all'\n#export __GL_SHADER_DISK_CACHE_SKIP_CLEANUP='1'\n\
    #export __GL_THREADED_OPTIMIZATION='1'\n#export STAGING_SHARED_MEMORY='1'\n#export\
    \ WINE_SIMULATE_WRITECOPY='1'\n#export DXVK_STATE_CACHE_PATH='/home/username/.wine/drive_c/Program\
    \ Files (x86)/Battle.net'\n#export __GL_SHADER_CACHE='/home/username/.wine/drive_c/Program\
    \ Files (x86)/Battle.net'\n#export VKD3D_SHADER_CACHE_PATH='/home/username/.wine/drive_c/Program\
    \ Files (x86)/Battle.net'\n#export VKD3D_CONFIG='dxr'\n#export exclude_processes='Agent.exe\
    \ \"Battle.net Helper.exe\n```\n\nReplace `username` with your actual username\
    \ where applicable. Save changes by clicking \"Save\" or through the File menu.\n\
    \n# Setting Image As Background In Gnome & Cinnamon\n\nVisit the official Cinnamon\
    \ website at [https://github.com/linuxmint/cinnamon](https://github.com/linuxmint/cinnamon)\
    \ for all things Cinnamon.\n\n### To set an image as the background:\n\n1. Right-click\
    \ on the image file and select \"Set as Background.\"\n\n# mount_options.conf\n\
    \nVisit the official udisks website at [https://www.freedesktop.org/wiki/Software/udisks/](https://www.freedesktop.org/wiki/Software/udisks/)\
    \ for all things udisks.\n\n### To set up `mount_options.conf` via Command Line\
    \ and GUI:\n\n```bash\nsudo apt update\nsudo gedit /etc/udisks2/mount_options.conf\n\
    ```\n\nAdd the following content:\n\n```ini\n[defaults]\nntfs_defaults=uid=$UID,gid=$GID\n\
    ntfs_allow=uid=$UID,gid=$GID,nls,umask,dmask,fmask,nohidden,sys_immutable,discard,force,sparse,showmeta,prealloc,no_acs_rules,acl,noatime\n\
    ```\n\nSave progress by clicking \"Save,\" or through the File menu.\n\n# Adding\
    \ Startup Applications In Cinnamon\n\n### To add startup applications via GUI\
    \ in Linux Mint 22:\n\n1. Open the Application Menu using the Super key.\n2. Navigate\
    \ to \"Startup Applications,\" click the + button, and select \"Choose Application.\"\
