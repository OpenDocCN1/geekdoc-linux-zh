  trans: '

    要通过命令行和 GUI 界面配置自定义的 `hosts.deny` 文件，请遵循以下简单指令：


    导航到此 URL：


    [`github.com/Ultimate-Hosts-Blacklist/Ultimate.Hosts.Blacklist?tab=readme-ov-file#raw-file-sources`](https://github.com/Ultimate-Hosts-Blacklist/Ultimate.Hosts.Blacklist?tab=readme-ov-file#raw-file-sources)


    找到 `hosts.deny` 条目，右键点击“下载”（Download），选择“链接另存为”，然后点击“保存”。


    接下来，执行以下终端命令：


    切换目录到 `/etc`：

    ```bash

    cd /etc

    ```


    为了备份目的，重命名当前的 `hosts.deny`：

    ```bash

    sudo mv hosts.deny hosts_backup.deny

    ```


    移动到下载文件夹：

    ```bash

    cd ~/Downloads

    ```


    将下载的 `hosts.deny` 复制到 `/etc`：

    ```bash

    sudo cp hosts.deny /etc

    ```


    返回 `/etc` 目录：

    ```bash

    cd /etc

    ```


    将文件所有权更新为 root：

    ```bash

    sudo chown -R root hosts.deny

    ```


    设置适当的文件权限：

    ```bash

    sudo chmod 755 hosts.deny

    ```


    ## Superhosts.deny


    要通过命令行和图形用户界面设置自定义的 `superhosts.deny` 文件，只需按照以下步骤操作：


    首先，访问此网站：


    [`github.com/Ultimate-Hosts-Blacklist/Ultimate.Hosts.Blacklist?tab=readme-ov-file#raw-file-sources`](https://github.com/Ultimate-Hosts-Blacklist/Ultimate.Hosts.Blacklist?tab=readme-ov-file#raw-file-sources)


    寻找标记为 `superhosts.deny` 的条目，右键点击“下载”（Download），选择“链接另存为”，并点击“保存”确认。


    然后，在终端中执行以下命令：


    将当前目录切换到 `/etc`：

    ```bash

    cd /etc

    ```


    备份现有的 `superhosts.deny` 文件：

    ```bash

    sudo mv superhosts.deny superhosts_backup.deny

    ```


    前往你的下载文件夹：

    ```bash

    cd ~/Downloads

    ```


    将下载的 `superhosts.deny` 复制到 `/etc`：

    ```bash

    sudo cp superhosts.deny /etc

    ```


    返回 `/etc` 目录：

    ```bash

    cd /etc

    ```


    将文件所有权更新为 root：

    ```bash

    sudo chown -R root superhosts.deny

    ```


    应用适当的文件权限：

    ```bash

    sudo chmod 755 superhosts.deny

    ```


    遵循这些指令将帮助你成功更新 `superhosts.deny` 文件，通过更有效地控制访问来增强系统的安全性。始终记住保留备份并设置正确的权限，以维护系统的完整性。


    ## 物理隔离 (Air Gapping)


    物理隔离将安全网络与其他网络（如互联网）隔离开来，以防止未经授权的访问。尽管存在物理上的隔离，但创新的攻击手段如声学恶意软件 `AirHopper`、`BitWhisper`、`GSMem`
    和 `NFCdrip` 已经利用声音、热变化、FM 信号、蜂窝频率和 NFC 射波突破了这些间隙。像 `ProjectSauron` 这样的恶意软件还利用
    `USB` 设备从此类网络中窃取数据，证明即使是物理隔离的系统也可能受到创意网络威胁的影响。


    切断所有网络连接（无论是有线的 `Ethernet` 还是无线的 `Wi-Fi`、`Bluetooth`、蜂窝），会让设备对网络不可见，并安全地与潜在的网络威胁隔离开。这确保了它无法通过传统的网络手段被访问或破坏，为敏感信息提供了强有力的安全保障。


    将计算机与互联网和其他设备隔离开对于防止未经授权的数据访问至关重要。当连接 `USBs` 或 `PS/2` 外设时，系统可能会通过日志或注册表记录元数据，从而危及安全。移除不必要的
    `USB` 和 `PS/2` 设备可以减少跟踪和数据嗅探的风险，增强物理隔离保护敏感信息方面的有效性。


    通过移除内部网络适配器来增强计算机安全性，涉及一个类似于主板手术的精密过程。专业技术人员可能会移除或禁用网络组件以切断有线和无线连接，确保设备与外部网络隔离开。尽管这种方法有效，但它需要稀缺的技能，使其可能价格昂贵。或者，从
    `eBay` 等平台获取网络功能失效的笔记本电脑，可以为实现类似的安全水平提供廉价的解决方案。


    通过将数据存储在模拟介质（如磁带）上来隔离数据可以增强安全性。这种方法通过 `VHS` 和 盒带存储各种文件的创新用法而受到关注，利用了模拟信号的长效性和对数字威胁的韧性。利用通常在
    `eBay` 上找到的设备，这种方法增强了安全性。

    '
- fmt: '

    Manually compiling software allows for tailored optimization to one''s system
    by adjusting source codes and flags. This process not only enhances hardware-software
    synergy but also enables customization, like in `GNOME`, where one can omit certain
    dependencies for a streamlined setup. It also unlocks experimental features, such
    as `GPU acceleration` in `Chromium`, offering a quieter, efficient system. By
    compiling manually, users gain a bespoke version of software, finely tuned to
    their needs without the bloat of unused features.


    A practical way to safeguard privacy is to follow the example of Tech Giant Mark
    Zuckerberg, who uses duct tape to cover his webcam and microphone. This approach,
    costing as little as $5, is accessible and straightforward, endorsing the shift
    towards external HD webcams and mics for enhanced quality and security. It''s
    a practical step for anyone valuing privacy in the digital age.


    ## Unplugging Wired & Wireless Network Connections


    Disconnecting both wired and wireless network connections, such as `Wireless 6E`,
    `Ethernet`, and `Optical Fibre`, eliminates any direct link between your computer
    and the network. This is crucial to prevent hackers from accessing your system
    through these connections.


    To enhance your security and peace of mind, consider purchasing dummy network
    and USB plugs.


    These can be found on Amazon at the following links:

    - [https://www.amazon.co.uk/s?k=dummy+network+plugs](https://www.amazon.co.uk/s?k=dummy+network+plugs)

    - [https://www.amazon.co.uk/s?k=dummy+usb+plugs](https://www.amazon.co.uk/s?k=dummy+usb+plugs)


    These plugs not only occupy unused ports, protecting against dust and potentially
    prolonging the life of your computer''s components, but they also make it less
    appealing for anyone trying to tamper with your system.


    Regularly check what is connected to your computer. This simple habit ensures
    that no unauthorized devices have been attached to your system by someone with
    harmful intentions.


    ## Removing Unnecessary USB & PS/2 Devices


    Removing unnecessary `USB` and `PS/2` devices is a wise move. Keep only essential
    devices like the keyboard, mouse, webcam, headset, and microphone connected. Avoid
    using `USB hubs`, as they can damage the motherboard and case `USB` ports. High-quality
    `USB hubs` can also be quite expensive.


    After disconnecting non-essential devices, use dummy `USB` and `PS/2` plugs to
    fill the empty ports.


    These can be found on Amazon at the following links:

    - [https://www.amazon.co.uk/s?k=usb+dust+cap](https://www.amazon.co.uk/s?k=usb+dust+cap)

    - [https://www.amazon.co.uk/s?k=ps%2F2+port+dust+cap](https://www.amazon.co.uk/s?k=ps%2F2+port+dust+cap)


    These plugs provide an extra layer of security, protect your system from dust,
    and help extend the lifespan of its components.


    Additionally, it''s wise to check your `USB` and `PS/2` ports twice daily. This
    precaution ensures that no malicious devices have been connected while you were
    busy or away.


    ## Get a Technical Professional to Help Remove Internal Network Adapters


    To eliminate both wired and wireless connectivity from a computer, consult a skilled
    technician who can precisely modify the motherboard by removing or disabling networking
    components without affecting other functionalities. Given the expertise required,
    this approach might be costly.


    An economical alternative is to look for used laptops on eBay, specifically those
    listed as non-working due to faulty networking capabilities. This strategy offers
    a practical solution for achieving device isolation.


    Start your search at:

    - [https://www.ebay.co.uk/](https://www.ebay.co.uk/)


    ## Analog Media


    Using analog media like tapes for storing data offers a unique and enjoyable method
    that can preserve information for 5 to 10 years or more, depending on storage
    conditions and usage frequency. Recent YouTube videos using `Danmere` and `Datosonix`
    merchandise have highlighted creative storage solutions using `VHS` and cassette
    tapes to store photos, videos, and games.


    These older devices and media can often be found on eBay at:

    - [https://www.ebay.co.uk/](https://www.ebay.co.uk/)


    Additionally, more widely used `LTO tape drives` and their necessary media are
    available on Amazon at:

    - [https://www.amazon.co.uk/s?k=tape+drive](https://www.amazon.co.uk/s?k=tape+drive)


    These options showcase a blend of nostalgic and modern data storage methods, appealing
    to various interests and needs.


    ## Anti EMF Paint


    Using `Anti EMF Paint` is a practical step for those concerned about privacy,
    as it can significantly reduce the vulnerability of computer components to radio
    waves. Experts recommend applying at least three layers of this paint, including
    a primer, to block nearly 60 decibels of electromagnetic frequency (`EMF`) radiation.


    More information, backed by studies, can be found at:

    - [https://emfacademy.com/emf-paint/](https://emfacademy.com/emf-paint/)


    Privacy enthusiasts might find this especially relevant, recalling scenarios like
    the "Father Of The Bride" episode from "Last Of The Summer Wine," where `Seymour`
    remotely disrupts electronics without physical access. This illustrates a real-world
    concern: potent antennas could, in theory, interfere with or access your personal
    computer''s electronic components.


    The financial aspect is noteworthy. Applying three coats of `Anti EMF Paint` to
    a computer case can cost upwards of $300 for materials alone. If you decide to
    paint it yourself, the cost might be lower, but for a professional finish, hiring
    an experienced painter is advisable. Though more expensive, this ensures a quality
    application and leverages the painter''s expertise with such specialized materials.


    For those looking to purchase `Anti EMF Paint`, options abound online. Retailers
    like `Amazon` and `eBay` offer a broad selection, catering to various preferences
    and needs. `Amazon` provides the convenience of easy shopping and delivery, making
    it a preferred choice for many.


    You can explore the options here:

    - [https://www.amazon.co.uk/s?k=Anti+EMF+paint](https://www.amazon.co.uk/s?k=Anti+EMF+paint)


    In summary, while the initial investment in `Anti EMF Paint` and professional
    application may seem high, the privacy and protection benefits it offers make
    it a consideration worth exploring.


    ## EMF Shielding Fabric


    `EMF Shielding Fabric` can help protect a personal computer by wrapping its components
    in special fabric, preventing external radio waves from interfering with the system.
    It''s advisable to apply three coats of `Anti EMF Paint`, including a primer,
    before using the fabric. A fabric craftsman can cut the `EMF Shielding Fabric`
    to measure, and it can be attached either with `superglue` or using its self-adhesive
    properties.


    One of the advantages of `EMF Shielding Fabric` is its cost-effectiveness compared
    to `Anti EMF Paint`. Depending on the type, density, and length, it is generally
    cheaper, starting at about $50 for a good quality sheet on `Amazon`.


    You can find options here:

    - [https://www.amazon.co.uk/s?k=EMF+Shielding+Fabric](https://www.amazon.co.uk/s?k=EMF+Shielding+Fabric)


    ## 3.5 MM Speakers


    Using `3.5mm` speakers connected to a PC with a standard mains power cable and
    `jack` offers enhanced security compared to `USB` speakers. The `3.5mm` setup
    transmits only audio without data, reducing the risk of data breaches. For added
    protection, consider speakers with a detachable power cord that can be replaced
    with one that has superior electromagnetic shielding and possibly a layer of `Anti
    EMF Paint` to safeguard against power disruptions or surveillance.


    You can find ideal mains-powered PC speakers with a `3.5mm jack` here:

    - [https://www.amazon.co.uk/s?k=mains+powered+pc+speakers+3.5mm+jack](https://www.amazon.co.uk/s?k=mains+powered+pc+speakers+3.5mm+jack)


    Although it''s possible to power speakers solely through the `3.5mm` cable, this
    typically results in lower sound quality. However, the trade-off in power savings
    might be worthwhile.


    For a balance of sound quality and efficiency, consider these earphones I use
    regularly:

