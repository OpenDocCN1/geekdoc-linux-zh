    ## 系统工具


    系统工具是帮助管理和优化计算机系统或应用程序软件的软件程序。它们在后台运行，执行如数据备份、磁盘压缩和文件管理等任务。这些工具可以是操作系统的一部分，也可以单独安装以增强或替换默认工具。它们在确保安全、优化性能和保持计算机运行良好方面起着至关重要的作用。例如反病毒软件、磁盘碎片整理程序、调试器、诊断程序和网络工具。它们对于普通用户和
    IT 专业人员都是必重要的，根据其对系统的影响需要不同的用户权限。


    `QDirStat` 是一款用于管理磁盘空间的图形化工具，通过传统的树形结构和彩色树图提供目录和文件的双重视图。它引入了多选、自定义清理操作和详细错误报告等功能。它易于用且多功能，方便按类型识别和管理文件。


