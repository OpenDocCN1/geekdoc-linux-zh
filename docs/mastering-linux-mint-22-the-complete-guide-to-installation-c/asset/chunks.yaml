  trans: "\n\nFlathub 解释了如何在 Linux Mint 22 中添加 Flatpak Flathub 仓库，从而访问海量的 Flatpak\
    \ 应用程序库。通过 GNOME Software 的 Flatpak 插件，用户可以轻松浏览并安装这些应用程序。\n\nSnap 演示了如何在 Linux\
    \ Mint 22 上安装 Snap 协议，提供通过命令行访问 Canonical 的 Snapstore，其中包含了 Discord、Steam 和 Visual\
    \ Studio Code 在内的数千个应用程序。它还详细介绍了如何管理 snaps 包，包括安装、卸载、创建 `.desktop` 快捷方式以及从系统中彻底删除。此外，它还展示了如何安装图形界面的\
    \ Snap Store。\n\n.AppImages 解释了如何在 Linux Mint 22 的默认桌面环境 GNOME 46 中使用 `Nautilus`\
    \ 文件管理器将 `.AppImage` 文件设置为可执行文件。它还提供了一个为 Curseforge `.AppImage` 创建 `.desktop`\
    \ 快捷方式的示例，并概述了 `.desktop` 文件中的字段。\n\nAppImageLauncher 深入介绍了如何获取和安装适用于 AppImageLauncher\
    \ 的最新兼容 `.rpm` 文件。\n\n`pip` 描述了如何安装 `pip`，这是一个连接到 Python 包索引 (PyPI) 的包管理器，允许用户通过命令行从\
    \ PyPI 安装软件。\n\nNode.js & `npm` 详细介绍了如何使用 `APT` 命令行安装 `Node.js`（一个 JavaScript\
    \ 运行时）和 `npm`（Node 包管理器）。\n\n`NVM` 显示了如何安装 Node 版本管理器 (`NVM`)，允许用户单独安装和使用不同版本的\
    \ `Node.js` 和 `npm`。它提供了通过 `NVM` 使用特定版本的实用示例。\n\n`pnpm` 演示了如何安装 `pnpm` (Performant\
    \ npm)，这是另一个 Node.js 的包管理器。它解释了如何在终端中使用 `curl` 和 `sh` 命令安装 `pnpm`，并强调了它在全局仓库中集中化管理包的作用。\n\
    \n# Linux Mint 22 软件管理器\n\n要使用软件管理器安装应用程序，请遵循以下步骤：\n\n1. 在软件管理器中点击所需的应用程序。\n2.\
    \ 点击“安装”按钮。\n\n或者，您也可以使用搜索栏通过输入程序名称（例如 'vlc'）来查找程序，然后点击应用程序并选择“安装”。\n\n您还可以通过以下方式为应用程序选择不同的软件源：\n\
    \n1. 浏览首页或分类页面。\n2. 使用搜索栏查找应用程序，例如 'SMPlayer'。\n3. 点击该应用程序。\n4. 点击“安装”按钮下方的下拉框。\n\
    \n可用选项可能包括 Linux Mint、Ubuntu 和 Flatpak (Flathub)。一旦您从呈现的选项中选择了所需的源，请点击“安装”。\n\n\
    要使用软件管理器卸载已安装的应用程序：\n\n1. 进入软件管理器中的“已安装”选项卡。\n2. 找到您想要卸载或删除的应用程序。\n3. 点击应用程序旁边的“卸载”。\n\
    \n# APT\n\n访问 APT 官方网站 [`wiki.debian.org/Apt`](https://wiki.debian.org/Apt) 获取更多信息。\n\
    \n1. **更新包列表和仓库**：\n   - 要更新 `APT` 包列表和仓库，请运行以下命令：\n   ```bash\n   sudo apt update\n\
    \   ```\n\n2. **升级 APT 包**：\n   - 运行以下命令升级 `APT` 包：\n   ```bash\n   sudo apt update\
    \ && sudo apt upgrade -y\n   ```\n\n3. **移除 APT 包**：\n   - 要移除或卸载 `APT` 包，请使用以下命令：\n\
    \   ```bash\n   sudo apt remove package-name\n   ```\n\n4. **清除 APT 包**：\n   -\
    \ 运行以下命令完全清除 `APT` 包：\n   ```bash\n   sudo apt purge package-name\n   ```\n\n\
    5. **移除第三方仓库的 .list 文件**：\n   - 要移除第三方仓库中的单个 `.list` 文件，请进入包含这些文件的目录：\n   ```bash\n\
    \   cd /etc/apt/sources.list.d\n   ```\n   - 然后移除特定的 `.list` 文件（例如 `xanmod.list`）并更新\
    \ `APT` 源：\n   ```bash\n   sudo rm -r file-name && sudo apt update\n   ```\n\n\
    6. **移除残留包**：\n   - 要移除残留包，运行以下命令：\n   ```bash\n   sudo apt autoremove\n   ```\n\
    \n# 将软件安装设置为 .deb 默认程序\n\n1. 从应用程序菜单打开“文件”应用程序。\n2. 按 `CTRL + L` 激活文件路径输入框中的位置输入。\n\
    3. 输入 `~/Downloads` 并按回车键导航到下载目录。\n4. 选择一个 `.rpm` 文件，例如 `google-chrome-stable_current_amd64.deb`。\n\
    5. 右键点击 `.deb` 文件并选择“打开方式”。\n6. 选择“软件安装”。\n7. 将“始终用于此文件类型”（rpm 包）旁边的开关向右移动。\n\
    8. 点击“打开”。\n\n# 将 GDebi 设置为 .deb 的默认程序\n\n1. 打开终端并运行：\n   ```bash\n   sudo apt\
    \ install gdebi\n   ```\n2. 从应用程序菜单打开“文件”应用程序。\n3. 按 `CTRL + L` 激活文件路径输入框中的位置输入。\n\
    4. 输入 `~/Downloads` 并按回车键导航到下载目录。\n5. 选择一个 `.deb` 文件，例如 `openstego_0.8.6-1_all.deb`。\n\
    6. 右键点击 `.deb` 文件并选择“打开方式”。\n7. 选择“GDebi 包安装器”。\n8. 将“始终用于此文件类型”（Debian 包）旁边的开关向右移动。\n\
    9. 点击“打开”。\n\n# Flatpak\n\n访问 Flatpak 官方网站 [`www.flatpak.org/`](https://www.flatpak.org/)\
    \ 获取更多信息。\n\n## 在终端通过 APT 安装 Flatpak\n\n```bash\nsudo apt update\nsudo apt install\
    \ flatpak\nsudo apt install gnome-software-plugin-flatpak\n```\n\n### Flatpak\
    \ 命令行示例\n\n要安装 Flatpak 应用程序，运行：\n```bash\nflatpak install flathub ch.tigerjython.TigerJython2\n\
    ```\n\n要移除 Flatpak 应用程序，运行：\n```bash\nflatpak remove ch.tigerjython.TigerJython2\n\
    ```\n\n要删除 Flatpak 仓库，运行：\n```bash\nflatpak remotes\nflatpak remote-delete flathub\n\
    ```\n\n要从 Linux Mint 22 ‘Wilma’ 中移除 Flatpak，运行：\n```bash\nsudo apt purge flatpak\
    \ gnome-software-plugin-flatpak\n```\n\n## Flathub\n\n访问 Flathub 官方网站 [`flathub.org/`](https://flathub.org/)\
    \ 获取更多信息。\n\n要添加 Flathub 仓库，请在终端中运行以下命令：\n```bash\nflatpak remote-add --if-not-exists\
    \ flathub https://dl.flathub.org/repo/flathub.flatpakrepo\n```\n\n# Snap\n\n访问\
    \ Snap 官方网站 [`snapcraft.io/`](https://snapcraft.io/) 获取更多信息。\n\n要安装 Snap，请在终端中运行以下命令：\n\
    \n1. 使用以下命令将现有的 `nosnap.pref` 文件移动到您“文档”目录中的备份位置：\n   ```bash\n   sudo mv /etc/apt/preferences.d/nosnap.pref\
    \ ~/Documents/nosnap.backup\n   ```\n2. 更新包列表以确保您拥有最新版本：\n   ```bash\n   sudo\
    \ apt update\n   ```\n3. 执行以下命令安装 snapd：\n   ```bash\n   sudo apt install snapd\n\
    \   ```\n\n一旦安装了 Snap，可以通过如下方式操作 Snap 包：\n\n- 要安装 Snap 包，可以使用 Snap Store 图形界面或命令行。\n\
    \  - 例如，安装 Discord 请使用命令：\n    ```bash\n    sudo snap install discord\n    ```\n\
    - 要卸载 Snap 包，您可以选择 Snap Store 图形界面或命令行。\n  - 例如，移除 Chromium 请执行命令：\n    ```bash\n\
    \    sudo snap remove chromium\n    ```\n\n# Snap Store\n\n访问 Snap Store 官方网站\
    \ [`snapcraft.io/`](https://snapcraft.io/) 获取更多信息。\n\n要安装 Snap，运行以下命令：\n```bash\n\
    sudo snap install core\nsudo snap install snap-store\n```\n\n# AppImages\n\n访问\
    \ AppImage 官方网站 [`appimage.org/`](https://appimage.org/) 获取更多信息。\n\n## 在 GUI 中将\
    \ AppImage 设置为可执行文件：\n\n1. 从应用程序菜单打开“文件”应用程序。\n2. 按 `CTRL + L` 激活文件路径输入框中的位置输入。\n\
    3. 输入 `~/` 访问主目录并按回车键。\n4. 右键点击空白处选择“新建文件夹”。\n5. 输入“Applications”并点击创建。\n6. 将\
    \ `Curseforge-1.0.0.x.x64.AppImage` 从 `~/Downloads` 目录拖入 `~/Applications` 目录。\n\
    7. 导航到 `~/Applications`。\n8. 右键点击 `Curseforge-1.0.0.x.x64.AppImage` 并选择“属性”。\n\
    \n"
