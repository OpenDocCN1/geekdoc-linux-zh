    CDBurnerXP 是一款用于刻录 CD、DVD 和蓝光光盘的便捷工具，支持多种格式以实现稳健的数据存储。它可以制作音频 CD、启动介质并将数据跨越多张光盘。其功能包括即刻刻录、验证数据和保存项目。它还可以擦除、复制和获取光盘信息、创建
    ISO、支持 LightScribe，并提供多种语言更新。


    # 安装 CDBurnerXP 并刻录 Linux Mint 22 ISO


    ## 下载并安装 CDBurnerXP

    * 访问 `CDBurnerXP` 网站：[`www.cdburnerxp.se/`](https://www.cdburnerxp.se/)

    * 点击 `CDBurnerXP` 软件。

    * 下载名为 `cdbxp_setup_4.5.8.7128_x64_minimal.exe` 的文件。

    * 打开下载的文件并按照屏幕上的指示操作。


    ## 刻录 Linux Mint 22 ISO

    1. 向 DVD 刻录机插入一张空白的 `DVD-R/RW` 光盘。

    2. 从开始菜单打开 `CDBurnerXP`。

    3. 选择`刻录 镜像`并点击`浏览`选择你的 Linux Mint 22 ISO 文件。

    4. 勾选`验证数据`和`完成光盘`等选项。

    5. 按`刻录光盘`开始。


    如果你遇到任何问题，`CDBurnerXP` 网站提供了资源和支持团队来帮助。祝你的 Linux Mint 22 体验愉快！


    # 使用 Ventoy 比较 USB 和 DVD 启动进行 Linux Mint 22 安装


    要启动并安装 Linux Mint 22，你可以使用 `Ventoy` USB 盘或 DVD 光盘。每种方法的步骤都不同：


    ### 使用 Ventoy USB 盘

    1. **使用 Ventoy USB 启动**：启动你的电脑并从 `Ventoy` USB 盘启动。在 BIOS 或启动菜单中将该 USB 盘选择为启动设备。

    2. **选择 Linux Mint 22 ISO**：`Ventoy` 将显示 USB 盘上的 ISO 列表。使用方向键键选择 Linux Mint 22
    ISO 并按 `ENTER` 键。

    3. **选择 Grub 模式**：选择 Linux Mint 22 ISO 后，选择 `grub` 模式并按 `ENTER` 键。

    4. **启动图形安装程序**：选择`图形安装程序`并按 `ENTER` 键开始安装 Linux Mint 22。


    ### 使用 DVD 光盘

    1. **插入 DVD**：将 Linux Mint 22 DVD 放入驱动器并重启电脑。

    2. **从 DVD 启动**：如果将 DVD 设置为主启动设备，你的电脑将从 DVD 启动。

    3. **启动安装程序**：出现 `GRUB` 安装程序选择界面，选择 Linux Mint 22 选项。Linux Mint 22 安装程序会立即启动，与
    `Ventoy` 相比没有额外的菜单。


    这些差异帮助你根据自己的熟悉程度决定安装 Linux Mint 22 的最佳方式。


    # Linux Mint 22 安装指南


    使用基于 `ubiquity` 的安装程序安装 Linux Mint 21.3 涉及选择键盘布局、决定是否包含多媒体解码器、选择安装类型、配置时区、创建用户账户，最后在安装完成后重启电脑。


    ## 键盘布局

    要开始安装 Linux Mint，双击`安装 Linux Mint`选项。当要求选择键盘布局时，从屏幕左侧选择合适的布局，例如`English (UK)`。然后，在右侧选择相应的键盘子布局，也是`English
    (UK)`。选择好正确的键盘布局和子布局后，点击`继续`按钮继续安装。


    ## 多媒体解码器

    要安装多媒体解码器，勾选标记为`安装多媒体解码器`的复选框，然后点击`继续`按钮。


    ## 安装选项

    在基于 `ubiquity` 的 Linux Mint 22 安装程序中有三种可用安装选项：

    1. **“与现有操作系统并排安装”**：允许你在同一块磁盘上与另一个操作系统一起安装 Linux Mint 22，而无需删除任何数据或修改分区；这既快速又方便。

    2. **“擦除磁盘并安装 Linux Mint”**：将完全删除磁盘上的所有数据，并以预定的分区大小安装 Linux Mint 22 `Wilma`；此选项适用于想要全新安装且不保留任何现有数据的用户。

    3. **“其他”**：提供更高级的磁盘管理功能；允许你对所选磁盘进行创建、调整大小和修改分区，让你对分区过程有更多控制力，包括指定卷大小和类型的能力，建议对磁盘管理有更深理解并希望创建自定义功能系统的用户使用。


    ## 并排安装与擦除磁盘

    要完成安装，点击`现在安装`按钮，仔细检查安装期间对你磁盘的任何更改，一旦检查完更改，点击`继续`按钮继续。


    ## 其他

    要在 1TB NVME SSD 上设置特定分区，请创建一个新的分区表并确保 EFI 分区至少为 512 MB，分配 71680 MB 给 `SWAP` 分区，并使用剩余空空间作为根文件系统分区，格式化为
    `Ext4` 日志文件系统并挂载到 `/`；检查磁盘更改并继续安装。


    ### 新分区表

    要创建新的分区表，点击 `+` 符号添加新分区，选择你想要分区的磁盘，如果选磁盘没有分区表，点击`新建分区表`，然后点击`继续`并选择磁盘上的`空空间`。


    ### EFI 分区

    要设置 EFI 分区，点击 `+` 创建新分区，在`大小`字段中输入 `1024` MB，将`主`和`此空间起始`的开关打开，在`用作`字段中选择`EFI`，并点击`确定`进行确认。


    ### SWAP 分区

    要配置 `SWAP` 分区，点击 `+` 添加另一个分区，在`大小`字段中输入 `71680` MB，将`主`和`此空间起始`的开关打开，在`用作`字段中选择`交换区`，并点击`确定`进行确认。


    ### 根 (/) 文件系统分区

    要创建根文件系统分区，点击 `+` 添加新分区，使用剩余空间作为大小，将`主`和`此空间起始`的开关打开，在`用作`字段中选择`Ext4 日志文件系统`，在`挂载点`字段中输入
    `/`，并点击`确定`进行确认。


    ### 完成分区更改

    要完成安装，点击`现在安装`，仔细检查安装期间对磁盘的更改，确认无误后，点击`继续`继续安装；通过这些步骤，你可以有效地对你的 1TB NVME SSD 分区，以优化性能和结构。


    ## 时区

    要设置时区，在地图上选择所需位置或在地图下方的框中输入城市名称，然后点击`继续`按钮。


    ## 创建用户配置

    要创建用户配置，在`你的名称`框中输入你的名字，`你的计算机名称`框将自动填充；在`选择用户名`框中输入用户名，在`选择密码`框中选择安全且好记密码，激活`登录时需要密码`旁边的开关，最后点击`继续/安装`按钮。


    ## 完成安装过程

    耐心等待安装完成，然后点击`现在重启`按钮，重启后在主板 BIOS 标志出现之前移除 USB 盘。


    # 设置 Linux Mint 22 启动

    要在 MSI MAG B550 TOMAHAWK 主板上选择启动项，请移除 USB 盘并按指定键（`F10`或其他）进入主板 BIOS。在主板 BIOS 标志出现之前，按一次、多次或长按该键以进入
    BIOS。


