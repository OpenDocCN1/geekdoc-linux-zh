    # 邮件客户端


    邮件客户端是帮助管理邮件的软件，允许你高效地查看、发送和组织消息。它们可以离线工作，集成日历，并比 Web 服务提高了可用性。


    Mozilla Thunderbird 是一款免费的开源邮件客户端，同时也作为个人信息管理器。它提供日历、联系人簿、RSS 阅读器、聊天和新闻功能。它支持多种平台，由
    Mozilla 基金会的子公司 MZLA Technologies Corporation 管理。Thunderbird 是社区驱动的，将电子邮件、新闻组、新闻订阅和即时消息与个人信息管理整合在一起。它支持多种电子邮件协议，并提供
    OpenPGP 和 S/MIME 加密的高安全性，符合行业标准。值得注意的是，法国军因其安全特性使用了它。


    Betterbird 通过独有的功能、错误修复和早期更新增强了 Thunderbird。它引入了多行视图、垂直标签、账户颜色和改进的附件管理。凭借先进的搜索功能，Betterbird
    提供了更流畅的邮件体验。它可以与 Thunderbird 并行安装，解决了后者尚未处理的问题，提供了更可靠的邮件体验。


    Geary 是一款开源邮件客户端，为简单和高效而设计。它最初由 Yorba Foundation 开发，现在是 GNOME 的一部分，支持主要的邮件服务和
    IMAP 服务器。它按会话组织邮件，并包含 HTML 邮件编写器、桌面通知以及通过 GNOME Keyring 进行安全密码存储等功能。

