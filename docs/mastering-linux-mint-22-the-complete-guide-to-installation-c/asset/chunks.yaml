    # Cinnamon Applets


    '
- fmt: '

    Cinnamon applets enhance your Linux Mint 22 experience by offering useful tools
    like the "Force Quit" applet, which allows you to close unresponsive windows with
    a click. To create an applet, assign a unique ID, create a folder with a `metadata.json`
    file for applet information, and an `applet.js` file for the code. Applets reside
    in either your local or system-wide Cinnamon applets directory. With a straightforward
    API, applets can adapt to various panel orientations and sizes, ensuring functionality
    across multiple instances. Visit the official Cinnamon website at [https://github.com/linuxmint/cinnamon](https://github.com/linuxmint/cinnamon)
    for more details.


    The Grouped Window List applet in Cinnamon organizes open windows by application
    in the panel, similar to taskbar functionalities in other operating systems. It
    simplifies navigation between multiple instances of the same application by grouping
    them under a single icon, offering previews on hover, and allowing for quick switching
    or window management. This applet enhances efficiency and workspace organization,
    making it easier to manage open applications and maintain a clutter-free desktop
    environment. Learn more at [https://cinnamon-spices.linuxmint.com/applets/view/27](https://cinnamon-spices.linuxmint.com/applets/view/27).


    The Cinnamon Windows Alt-Tab Switcher offers various styles like icons, thumbnails,
    or a combination, making it easier to navigate with larger icons and detailed
    previews. Users can adjust icon sizes and styles from the system settings. The
    Cinnamon-Alt-Tab-Enhanced project adds features like support across multiple workspaces,
    larger thumbnail views, and comprehensive keyboard and mouse support, enhancing
    the user experience. Find more information at [https://github.com/linuxmint/cinnamon-screensaver](https://github.com/linuxmint/cinnamon-screensaver).


    The Cinnamon Menu Applet simplifies accessing installed applications on your system.
    Users can easily launch applications by typing their names or aliases, provided
    there''s a corresponding `.desktop` file. This applet also organizes applications
    into categories, making navigation and discovery more intuitive. It bridges the
    gap between user convenience and system functionality, ensuring that finding and
    running any application is a smooth and straightforward process. More details
    can be found at [https://github.com/linuxmint/Cinnamon](https://github.com/linuxmint/Cinnamon).


    The Calendar Applet for the Cinnamon Desktop Environment offers a time display
    similar to Windows XP, a highly regarded operating system by Microsoft. This feature
    allows users to mimic the appearance and ambiance of Windows XP, avoiding its
    programming limitations. Additionally, it supports the 12-hour format, contrasting
    with the military-style 24-hour format, providing a user-friendly approach to
    timekeeping. Visit [https://github.com/linuxmint/cinnamon-spices-applets](https://github.com/linuxmint/cinnamon-spices-applets)
    for more information.


    ## Grouped Window List


    To set up the Grouped Window List via the graphical user interface, start by launching
    `Firefox` from the application menu.


    Once open, minimize the program.


    Right-click on the `Firefox` icon on the panel and select "Configure."


    Navigate to the "Panel" tab.


    In the "Button label" option, click the box and choose "Window Title."


    ## Cinnamon Windows Alt-Tab Switcher


    To set up the Cinnamon Windows Alt-Tab Switcher with a graphical user interface,
    follow these steps.


    Open the application menu and run the `Windows` command.


    Navigate to the `Alt-Tab` section and find the "Alt-Tab switcher style" option.


    Click the checkbox next to it and select "Thumbnails only" from the dropdown menu.


    ## Cinnamon Menu Applet


    To set up the Cinnamon Menu Applet via the graphical user interface, right-click
    the menu button and select "Configure."


    Navigate to the "Panel" tab. Enable the "Use a custom icon and label" option by
    sliding the switch to the right.


    In the "Text" field, press `CTRL` + `A` to select all text, then press `DEL` to
    clear it.


    Enter " Start" as the new label. For the icon, click the box in the same row.


    In the search box, press `CTRL` + `A` to select all text, then press `DEL` to
    clear it.


    Type `start-here` into the search, select the `start-here` icon when it appears,
    and click "Select" to finalize your choice.


    ## Cinnamon Calendar Applet


    To set a custom date format in the Cinnamon Calendar Applet via the GUI, right-click
    the `Calendar` applet, typically found at the bottom right corner of your screen.


    Choose "Configure" from the applet.


    ```

