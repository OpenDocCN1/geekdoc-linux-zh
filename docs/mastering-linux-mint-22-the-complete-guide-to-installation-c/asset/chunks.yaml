    # 音频编辑软件


    音频编辑软件允许您编辑和创建音频、导入和导出文件、录制声音以及调整时间和音量。它还允许混合轨道、应用混响和均衡等效果，并在文件格式之间进行转换。数字音频工作站提供了具有用户友好界面的全面音乐制作软件，能够非线性编辑以及实时和离线处理以实现专业音质。


    Audacity 是一款适用于 Windows、macOS、Linux 和 Unix 类系统的免费开源音频编辑器和录音器。自 2015 年以来下载量超过 11.4
    亿次，因其对主流系统的兼容性、对各种音频格式的支持以及配合 `VST3` 等插件的能力而广受欢迎。Audacity 采用 `GPL-2.0-or-later`
    许可，还提供深度频率可视化工具，是音频编辑和录制的理想选择。


    Ardour 是一款用于在 Linux、macOS 和 Windows 上进行录音、编辑和母带数字音频工作站。由 Paul Davis 创建，根据硬件提供无限可能，包括延迟校正、各种监控选项和插件效果。Ardour
    支持无限轨道、总线和灵活的路由。其编辑功能包括高精度的拖放、裁剪、分割和时间拉伸。Ardour 在母带方面表现出色，与 `JACK` 集成用于高级处理，并支持导出音频
    CD 文件。


    Mixxx 是一款免费开源 DJ 软件，用于创造性地混合数字音乐文件，适用于所有水平的 DJ。它具有用于轨道匹配的 BPM 和键位检测功能，支持最多四首歌同步，支持各种
    DJ 控制器并允许自定义映射。使用音效增加趣味并进行链以发挥创意。使用时间码胶片获得经典感。Mixxx 由一个专注的社区开发，是对于渴望免费进行数字混合的
    DJ 来说完美选择。


