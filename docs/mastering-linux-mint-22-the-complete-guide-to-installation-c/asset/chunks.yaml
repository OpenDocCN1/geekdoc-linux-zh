    # Hosts


    要使用命令行和图形界面设置自定义 hosts 文件，请遵循以下步骤：


    - 访问网站：[`github.com/Ultimate-Hosts-Blacklist/Ultimate.Hosts.Blacklist?tab=readme-ov-file#raw-file-sources`](https://github.com/Ultimate-Hosts-Blacklist/Ultimate.Hosts.Blacklist?tab=readme-ov-file#raw-file-sources)

    - 找到 `hosts` 行，右键点击“下载”，并选择“另存为”。然后点击“保存”。

    - 接下来，在终端执行这些命令：

    - 进入 `etc` 目录：

    ```bash

    cd /etc

    ```

    - 重命名现有的 `hosts` 文件进行备份：

    ```bash

    sudo mv hosts hosts_backup

    ```

    - 进入您的下载下载文件夹：

    ```bash

    cd ~/Downloads

    ```

    - 将下载的 `hosts` 文件复制到 `/etc`：

    ```bash

    sudo cp hosts /etc

    ```

    - 回到 `etc` 目录：

    ```bash

    cd /etc

    ```

    - 将 `hosts` 文件的所有者改为 `root`：

    ```bash

    sudo chown -R root hosts

    ```

    - 为文件设置正确的权限：

    ```bash

    sudo chmod 755 hosts

    ```


    Hosts.deny


