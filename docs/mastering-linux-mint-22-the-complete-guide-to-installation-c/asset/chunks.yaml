    # Image Editing Software


    Image editing software allows you to manipulate digital photos through cropping,
    retouching, and color adjustments. It includes tools for vector, raster, and 3D
    modeling, enhancing or creating images from scratch. Mainly used for 2D edits,
    it supports tasks like resizing and applying filters to adjust attributes or add
    effects, and also facilitates format conversion.


    GIMP, the GNU Image Manipulation Program, is a free tool for photo editing and
    image composition. It offers features like painting tools, layer support, and
    advanced manipulation with full alpha channel support. Expandable with plugins
    and scripts, GIMP runs on various platforms and supports many file formats, making
    it suitable for both simple and complex editing needs.


    Blender is a free, open-source 3D creation suite for modeling, animation, VFX,
    and video editing. It runs on Linux, macOS, and Windows, catering to both professionals
    and hobbyists. With comprehensive tools, Blender supports a wide range of media
    productions, from game assets to films. Its interface, powered by `OpenGL`, ensures
    a uniform experience across devices, while its active community offers extensive
    support and learning resources.


    Pinta is an open-source, cross-platform image editor similar to Paint.NET but
    with more features. It provides a robust toolkit for bitmap image editing, including
    drawing tools, filters, color adjustments, and multiple layers for complex edits.
    Designed for ease of use, it includes unlimited undo history, multilingual support,
    and a customizable workspace, making it a user-friendly yet powerful editing solution.


    Krita is a versatile, free open-source graphics editor for digital artists and
    animators. It offers tools for 2D animation and art creation on Linux, Windows,
    and macOS. Krita features an `OpenGL`-accelerated canvas, advanced brush engines
    with over 100 preloaded brushes, non-destructive layers, vector support, and customizable
    interfaces. It includes brush stabilizers for smooth strokes, built-in vector
    tools for comics, and a resource manager for sharing or importing brushes, making
    it a powerful tool for creators seeking flexibility and precision.


    Inkscape is a free, open-source vector graphics editor that runs on various platforms
    including Windows, macOS, and Unix-like systems. It excels in creating sharp,
    scalable illustrations like cartoons, logos, and diagrams without pixel limits,
    thanks to its vector-based approach. Supporting `SVG` as its primary format, Inkscape
    handles many file types and offers tools for intricate designs with shapes, text,
    colors, and gradients, all while allowing for transforming and editing images
    directly from raster sources to vector art.


    Darktable is a free, open-source photography app and raw developer focused on
    non-destructive post-production. It optimizes workflows, handling many images
    efficiently across various platforms. With features like real-time adjustments,
    `GPU` acceleration, and support for numerous image formats, Darktable enhances
    image editing through modules for color correction, effects, and organization.
    It supports non-destructive editing, `ICC` profiles, and `Lua` scripting for customization,
    with a UI that includes lighttable and darkroom modes for easy navigation and
    editing, plus tethering and map views for comprehensive image management.


    Tux Paint is a free, open-source drawing software designed for children ages 3
    to 12. Created by Bill Kendrick in 2002, it offers a simple interface filled with
    fun effects and drawing tools to spark creativity in kids. Supporting multiple
    platforms like Windows, macOS, and Android, Tux Paint is accessible worldwide.
    With its mascot Tux guiding users, children can explore art through various tools
    and effects, while teachers and parents can customize the experience with additional
    content. Ideal for fostering computer literacy and artistic skills, Tux Paint
    is celebrated for its ease of use and inclusive design.


    # Gnu Image Manipulation Program (GIMP)


    Visit the official GIMP website at [https://www.gimp.org/](https://www.gimp.org/)
    for everything related to GIMP.


    ### Installing Gnu Image Manipulation Program (GIMP) via SYSTEM PACKAGE/FLATPAK
    Package through Software Manager:


    1. Open Software Manager and search for Gnu Image Manipulation Program (GIMP).

    2. Click on Gnu Image Manipulation Program (GIMP), then on the Source Selection
    Box.

    3. Choose `SYSTEM PACKAGE` or `FLATPAK` and click Install.


    ### Installing Gnu Image Manipulation Program (GIMP) via APT in the Terminal:

    ```bash

    sudo apt install gimp

    ```


    ### Installing Gnu Image Manipulation Program (GIMP) via FLATPAK in the Terminal:

    ```bash

    flatpak install flathub org.gimp.GIMP

    ```


    ### Installing Gnu Image Manipulation Program (GIMP) via SNAP in the Terminal:

    ```bash

    sudo snap install gimp

    ```


