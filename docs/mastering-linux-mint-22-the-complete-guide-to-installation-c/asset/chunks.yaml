    # 系统设置


    Linux Mint 22 上的系统设置提供了计算机硬件、软件和配置细节的完整概述。无论是在进行故障排除、升级，还是对内存、处理器速度或操作系统版本等细节感兴趣，通过终端命令或`System
    Monitor`和`系统设置`等图形界面访问这些设置都能获得价值的见解。这些工具允许性能调整、安全配置和驱动程序更新，增强你对系统能力的理解和优化。


    ### 夜间模式

    GNOME 桌面环境减少屏幕的蓝光发射，使眼睛在深夜更加舒适。此功能位于显示设置下，可以开启或关闭，并允许调整屏幕色温以减少眼劳。自动设置为从日落到日出激活，非常适合晚上工作或休息，并可以在看电影等活动期间临时禁用。此工具增强了用户晚上使用电脑的舒适度和健康。


    ### Redshift

    Cinnamon 桌面环境上的 Redshift 根据一天的时间调整屏幕色温，减少眼睛疲劳和潜在的失眠。该工具在晚上在暖色调（2000–4000 K）和白天的冷色调（5500–6500
    K）之间切换，以匹配自然光，帮助你的眼睛逐渐适应。Redshift 可配置为连续或固定设置，需要你的位置来准确跟踪太阳高度，支持 Linux 和 BSD 系统上的多显示器。此应用程序模拟你环境的周围光，以获得更舒适的屏幕体验。


    ### PipeWire

    PipeWire 旨在通过提供低延迟、基于图形的处理引擎来增强 Linux 对音频视频的处理。它支持以前由`PulseAudio`和`JACK` 管理的各种多媒体用例，并包含一个健壮的安全模型，以便像`Flatpak`这样的容器化应用程序与音视频设备交互。作为
    Linux 演进的应用开发生态系统的一部分，PipeWire 与`Wayland`和`Flatpak` 旨在成为基础组件，实现最小延迟的捕和播放、实时处理，以及跨`PulseAudio`、`JACK`、`ALSA`和`GStreamer`
    应用程序的无缝集成，并支持沙箱环境。


    ### 环境变量

    Linux Mint 22 系统变量或环境变量是用于存储信息并控制命令行应用程序和系统操作行为的动态命名值。这些变量由一个名称和一个值组成，格式为 `KEY=value`，`=`
    符号周围没有空格。包含空格的值必须括在引号中，可以使用冒号（`":"`）分隔符分配多个值。变量名区分大小写，通常使用大写字母。环境变量是全局可的并被子进程继承，而
    shell 变量仅局限于当前的 shell 实例。它们为自定义 Linux Mint 22 的系统和应用程序行为提供了一个多功能的工具。


    ### Cinnamon 背景

    在 Cinnamon 中将图像设置为背景可以让你通过选择任何图像或颜色来个性化你的桌面。右键点击桌面，选择“更改桌面背景”，并通过“桌面背景偏好”对话框添加新壁纸。你还可以调整其外观以适应或填充屏幕。对于纯色，选择“无壁纸”并选择颜色。更改是即时的，对于系统级设置，管理员可以使用`dconf`
    设置默认值、锁定配置并为所有用户添加额外的背景，确保设备之间统一的外观或品牌形象。


    ### Mount_options.conf

    `Mount_options.conf` 是系统管理员的 UDisks 功能，允许自定义各种文件系统的挂载选项以确保安全和数据一致性。它在 UDisks 2.9.0
    中引入，允许通过配置文件或`udev` 规则进行系统级覆盖，专门针对可移动介质等动态挂载点，优先考虑安全可靠的访问而不损害系统。它区分了文件系统类型和驱动程序，完善了对数据管理的控制，防止未经授权的访问和数据丢失，成为安全高效存储处理的关键工具。


    ### 启动应用程序

    在 Linux Mint 22 的 Cinnamon 桌面中，“启动应用程序”允许你管理启动时启动的程序。按下 Super 键进行搜索并调整你的启动过程以提高效率。禁用默认项时要小心，因为它们通常至关重要。轻松添加新应用或调整现有应用（包括启动延迟），确保在控制运行内容和时间的情况下实现更流畅的启动，而不会让系统负载过重。


    ### 自动挂载卷

    Linux Mint 22 启动时的自动挂载卷确保你的驱动器在系统启动时自动连接。使用许多 Linux 发行版中的`GNOME Disks` 工具，你可以轻松地设置此项。启动“磁盘”，选择你的驱动器，然后选择分区，并调整挂载选项以启用系统启动时挂载。此工具简化了向
    `/etc/fstab` 文件添加条目的过程，使分区无需手动编辑配置文件即可系统范围内可用。只需重启机器，你选择的分区将自动挂载，简化了你以便即时访问的设置。


    在 Linux Mint 22 中，快捷键和截图是捕捉屏幕内容的必要手段，对于分享见解、解决问题或保留记忆至关重要。它们确认了你的经历，归档了信息，并通过视觉上下文增强了文档。`Screenshot`等工具使得截图对于各种任务的高效通信和文档记录变得无足可贵。


