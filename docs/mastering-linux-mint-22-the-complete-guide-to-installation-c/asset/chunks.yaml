- fmt: '

    YChanEx is a tool designed to download threads and images from imageboards like
    4chan and 8chan. It works on Windows with .NET 4.5 and on Linux via WINE, featuring
    a unique "ychanex:" browser protocol for easy downloads. Still in development,
    it supports various imageboards and includes features like proxy support, brotli
    decompression, and thread history. Recent updates have improved reliability and
    the user interface, with more enhancements planned. YChanEx aims to simplify the
    archiving of imageboard content, making it easier to preserve discussions and
    images from these forums.


    # YChanEx


    Visit the official YChanEx website at [https://github.com/murrty/YChanEx](https://github.com/murrty/YChanEx)
    for all things YChanEx.


    ## Installing YChanEx via APT in the Terminal & GUI:


    Update the package manager metadata:


    ```

    sudo apt update

    ```


    Enable the 32-bit architecture support:


    ```bash

    sudo dpkg --add-architecture i386

    sudo apt update

    ```


    Download and add the WineHQ repository key:


    ```bash

    sudo mkdir -p /etc/apt/keyrings

    sudo wget -O /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key

    sudo wget -NP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources

    ```


    Install WineHQ:


    ```bash

    sudo apt update

    sudo apt install winehq-staging

    ```


    Navigate to the releases page:


    [https://github.com/murrty/YChanEx/releases/tag/2.0](https://github.com/murrty/YChanEx/releases/tag/2.0)


    Download the Latest `YChanEx.exe`.


    Go to `~/Downloads` and double-click `YChanEx.exe` [Right Click and set `WINE`
    as default if this does not work].


    To create a `.desktop` shortcut for YChanEx, follow these steps in your terminal:


    Navigate to the applications directory with the command:


    ```bash

    cd /usr/share/applications

    ```


    Open a new `.desktop` file for editing by running:


    ```bash

    sudo gedit ychanex1.desktop

    ```


    In the `ychanex1.desktop` file, enter the following details:


    ```ini

    [Desktop Entry]

    Name=YChanEx

    Comment=YChanEx

    Exec=/bin/bash -c "cd ~/Downloads && wine YChanEx.exe"

    Icon=terminal

    Terminal=false

    Type=Application

    Categories=Utility;Game;

    ```


    To save your progress, click "Save." Alternatively, you can click "File," then
    "Save," or click the ☰ icon, select "Save As," and finally click "Save." After
    saving, close the editor.


    # Ebook Readers


    Ebook software transforms your device into a digital book, allowing you to read
    on computers, tablets, or phones. It supports various formats like EPUB, PDF,
    and Word, each offering unique features and compatibility. Understanding these
    formats helps you choose the right one for your reading preferences, ensuring
    a smooth and enjoyable experience across different devices.


    Calibre is a free, open-source e-book suite that enables users to organize, display,
    edit, create, and convert e-books across multiple formats. It supports syncing
    with many e-readers. You can edit EPUB and AZW3 formats directly, while others
    require conversion. Calibre offers a wide range of plugins, supports metadata
    management, and allows e-book importing, including wireless sync. Although it
    doesn''t natively remove DRM, plugins are available to enable this functionality.
    From version 6.0, full-text search enhances its library capabilities, with content
    conversion facilitated by Python-based recipes.


    Bookworm is a versatile, free eBook reader for Windows that supports formats like
    PDF, EPUB, MOBI, and more. It''s designed for accessibility, offering plain text
    and fully formatted views. Features include text-to-speech, OCR for scanned documents,
    and Wikipedia integration for quick term lookups. Users can easily navigate documents,
    make annotations, and even extract articles from web pages. Whether using a screen
    reader or enjoying the read-aloud function, Bookworm enhances the reading experience
    for everyone.


    # Calibre


    Visit the official Calibre website at [https://calibre-ebook.com/](https://calibre-ebook.com/)
    for all things Calibre.


    ## Installing Calibre via SYSTEM PACKAGE/FLATPAK Package through Software Manager:


    1. Open Software Manager and search for `Calibre`.

    2. Click on `Calibre`, then on the Source Selection Box.

    3. Choose `SYSTEM PACKAGE` or `FLATPAK` and click Install.


    ## Installing Calibre via APT in the Terminal:


    ```bash

    sudo apt install calibre

    ```


    ## Installing Calibre via FLATPAK in the Terminal:


    ```bash

    flatpak install flathub com.calibre_ebook.calibre

    ```


    ## Installing Calibre via Binary install in the Terminal:


    ```bash

    sudo -v && wget -nv -O- https://download.calibre-ebook.com/linux-installer.sh
    | sudo sh /dev/stdin

    ```


    # Bookworm


    Visit the official Bookworm website at [https://getbookworm.com/](https://getbookworm.com/)
    for all things Bookworm.


    ## Installing Bookworm via SYSTEM PACKAGE/FLATPAK Package through Software Manager:


    1. Open Software Manager and search for `Bookworm`.

    2. Click on `Bookworm`, then on the Source Selection Box.

    3. Choose `SYSTEM PACKAGE` or `FLATPAK` and click Install.


    ## Installing Bookworm via APT in the Terminal:


    ```bash

    sudo apt install bookworm

    ```


    ## Installing Bookworm via FLATPAK in the Terminal:


    ```bash

    flatpak install flathub com.github.babluboy.bookworm

    ```


    # Virtualization


    Virtualization software, known as a hypervisor, enables one computer to function
    as multiple virtual machines, allowing different operating systems to run simultaneously
    on a single PC. This technology optimizes resource use, simplifies backups, and
    allows seamless operation of various OSs and outdated applications. It enhances
    security by isolating potential threats from malware and browser vulnerabilities.
    Beyond personal use, virtualization supports Infrastructure as a Service (IaaS),
    increasing scalability and efficiency for businesses, reducing costs, and improving
    disaster recovery and testing. It embodies flexible, efficient computing, making
    more possible with less.


    Oracle VirtualBox is a versatile virtualization tool suitable for both enterprise
    and personal use, supporting various operating systems like Windows, Linux, and
    macOS. It offers extensive features for high performance, accommodating numerous
    guest operating systems, including different Windows versions and Linux distributions.
    As open-source software under the GPL v3, VirtualBox invites community contributions
    while maintaining professional quality, backed by Oracle. Regular updates expand
    its supported systems and features, and it includes resources like pre-built VMs
    for developers.


    Virt-manager, primarily developed by Red Hat, is a desktop tool for managing virtual
    machines (VMs) via `libvirt`. It allows users to create, edit, start, and stop
    VMs, and view their performance and console. It supports KVM, Xen, QEMU, LXC containers,
    and FreeBSD''s bhyve hypervisor since 2014. The suite includes tools like `virt-install`
    for easy VM setup, `virt-viewer` for VM display interaction, `virt-clone` for
    cloning VMs, `virt-xml` for editing VM configurations, and `virt-bootstrap` for
    setting up root file systems for libvirt-based containers.


    # Oracle VirtualBox


    Visit the official Oracle VirtualBox website at [https://www.virtualbox.org/](https://www.virtualbox.org/)
    for all things Oracle VirtualBox.


    ## Installing Oracle VirtualBox via APT in the Terminal:


    ```bash

    sudo apt update && sudo apt upgrade

    cd

    wget -q https://www.virtualbox.org/download/oracle_vbox_2016.asc -O- | rpm --import
    -

    sudo apt update

    sudo apt install virtualbox-7.0

    ```


    ## Installing Oracle VirtualBox via DEB in the GUI:


    1. Navigate to the release page: [https://www.virtualbox.org/wiki/Linux_Downloads](https://www.virtualbox.org/wiki/Linux_Downloads)

    2. Click the link for the latest Ubuntu 24.04 package to download Oracle VirtualBox.

    3. Go to your Downloads folder: Double-click on `virtualbox-7.0_7.0.18-162988~Ubuntu~noble_amd64.deb`.

    4. Click "Install" to complete the installation.


    ## Adding User to the vboxusers Group:


    Switch to the root user:


    ```bash

    su -

    ```


    Add your username to the `vboxusers` group (replace "username" with the actual
    username):


    ```bash

    sudo usermod -aG vboxusers username

    ```


    Exit the root user:


    ```bash

    exit

    ```


    Reboot your system to apply the changes:


    ```bash

    sudo reboot

    ```


    Virt-manager

