    Mailspring 是一款适用于 Mac、Linux 和 Windows 的多功能邮件客户端。它支持包括 IMAP 和 Office 365 在内的多个账户，并具备触摸手势、高级快捷键和快速搜索等功能。它包含了撤销发送、统一邮箱箱、回执和链接跟踪。Mailspring
    的高级搜索、签名编辑器和多语言邮件翻译提高了工作效率。它还提供主题、布局和广泛的本地化支持，以实现高效且个性化的邮件管理。


    # Thunderbird


