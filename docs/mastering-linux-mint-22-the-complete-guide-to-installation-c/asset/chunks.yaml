  trans: "\n\n默认的 systemd 超时时间通常设置为 90 秒，它决定了 systemd 在认为操作失败之前等待服务启动或停止的持续时间。此超时机制通过防止服务无限挂起来确保系统的响应能力。然而，为了更具灵活性，systemd\
    \ 允许根据特定需求调整此超时时间，使服务能够偏离默认设置的自定义超时配置。\n\n不可变文件和文件夹是创建后就无法修改或删除的数字资产。这一特性确保了数据的完整性和安全性，特别是在保持历史准确性和防止未经授权的更改至关重要的环境中。虽然这个概念看起来很死板，但它是防止数据篡改和丢失的屏障，让你在关键信息保持未被触动时获得可靠性和安心。\n\
    \nFFmpegthumbnailer 是一款轻量级工具，旨在快速生成视频缩略图，提高文件管理效率。它利用强大的 `ffmpeg` 库来解码视频帧，其功能与\
    \ `ffmpeg` 的配置绑定。FFmpegthumbnailer 以其速度快和资源占用少而闻名，对于文件管理器至关重要，它简化了为视频文件创建视觉信息缩略图的过程，有助于更快地识别和访问视频内容。\n\
    \nLinux `.desktop` 文件是简单的文本文件，为桌面环境提供有关软件应用程序的基本信息。它们定义了程序如何启动、其名称以及使用的图标。这些文件通过允许创建快捷方式，使用户更容易通过图形界面与应用程序交互。\n\
    \n在 Linux Mint 22 中，电源设置允许用户管理计算机能量消耗，这对于延长电池寿命和效率至关重要。这些设置包括屏幕亮度、睡眠模式以及笔记本盖子关闭时的行为的选项。用户可以通过系统设置面板轻松地自定义这些偏好，确保设备在节电的同时保持最佳运行。\n\
    \n# 夜光模式 (GNOME)\n\n访问夜光模式 (GNOME) 官网 [`foundation.gnome.org/`](https://foundation.gnome.org/)\
    \ 获取有关夜光模式 (GNOME) 的所有信息。\n\n### 通过 GUI 设置夜光模式 (GNOME)：\n\n1. 打开应用程序菜单并选择“设置 (Settings)”。\n\
    2. 进入左侧边栏的“显示 (Displays)”选项卡，然后点击“夜光模式 (Night Light)”。\n3. 打开“夜光模式”旁边的开关将其启用。\n\
    4. 在“计划 (Schedule)”行中，点击下拉框并选择“手动计划 (Manual Schedule)”。\n5. 设置激活时间为 21:00 到 06:00。\n\
    6. 调整色温度滑块，使其处于第三条和第四条白线中间点略下方的位置。\n\n# 夜光模式 (Cinnamon & Redshift)\n\n访问夜光模式 (Cinnamon\
    \ & Redshift) 官网 [`github.com/linuxmint/cinnamon`](https://github.com/linuxmint/cinnamon)\
    \ 和 [`github.com/jonls/redshift`](https://github.com/jonls/redshift) 获取有关夜光模式\
    \ (Cinnamon & Redshift) 的所有信息。\n\n### 通过终端和 GUI 安装并设置夜光模式 (Cinnamon & Redshift)：\n\
    \n```bash\nsudo apt install redshift redshift-gtk wayland*\n```\n\n通过以下命令进入配置目录：\n\
    \n```bash\ncd ~/.config\n```\n\n通过输入编辑 Redshift 配置：\n\n```bash\nnano redshift.conf\n\
    ```\n\n输入以下设置：\n\n```ini\n[redshift]\ntemp-night=2250\ntransition=1\nbrightness=1.0\n\
    gamma=1.0\n\n[location]\nadjustment-method=vidmode\nlocation-provider=manual\n\
    ```\n\n使用 `CTRL + S` 保存更改并使用 `CTRL + X` 退出。\n\n# PipeWire 音频杂音与爆破声修复\n\n访问 PipeWire\
    \ 官网 [`pipewire.org/`](https://pipewire.org/) 获取有关 PipeWire 的所有信息。\n\n### 通过命令行和\
    \ GUI 修复 PipeWire 潜在的杂音或爆破声等音频问题：\n\n禁用音频节能功能：\n\n```bash\necho \"options snd_hda_intel\
    \ power_save=0\" | sudo tee -a /etc/modprobe.d/audio_disable_powersave.conf\n\
    echo \"options snd_hda_intel power_save_controller=N\" | sudo tee -a /etc/modprobe.d/audio_disable_powersave.conf\n\
    ```\n\n验证更改：\n\n```bash\ncat /sys/module/snd_hda_intel/parameters/power_save\n\
    cat /sys/module/snd_hda_intel/parameters/power_save_controller\n```\n\n编辑 PipeWire\
    \ 配置以优化性能：\n\n```bash\nsudo gedit /usr/share/pipewire/pipewire.conf\n```\n\n调整量子（quantum）设置：\n\
    - 将 `#default.clock.quantum = 1024` 修改为 `default.clock.quantum = 2048`。\n- 将 `default.clock.min-quantum\
    \ = 16` 修改为 `default.clock.min-quantum = 2048`。\n- 将 `#default.clock.max-quantum\
    \ = 2048` 更新为 `default.clock.max-quantum = 4096`。\n\n保存更改并重启 PipeWire 服务：\n\n\
    ```bash\nsystemctl --user restart pipewire.service pipewire-pulse.service pipewire-media-session.service\n\
    systemctl --user restart pipewire-multi.service\n```\n\n通过编辑增强音频优先级：\n\n```bash\n\
    sudo gedit /etc/security/limits.conf\n```\n\n添加：\n\n```text\n@audio   -  nice\
    \      -20\n```\n\n保存并退出。\n\n通过清除 speech-dispatcher 消除潜在冲突：\n\n```bash\nsudo apt\
    \ remove speech-dispatcher\n```\n\n确保所有 PipeWire 配置中的更改保持一致。保存并备份必要文件，然后重启电脑。\n\
    \n# Linux Mint 22 系统变量\n\n### 通过命令行和 GUI 设置 Linux Mint 22 系统变量：\n\n编辑系统级 Bash\
    \ 配置文件：\n\n```bash\nsudo gedit /etc/bash.bashrc\n```\n\n添加以下设置：\n\n```bash\n#\
    \ Environment Variables\n#export STAGING_WRITECOPY='1'\n#export DXVK_ENABLE_NVAPI='1'\n\
    #export WINEESYNC='1'\n#export WINEDEBUG='-all'\n#export __GL_SHADER_DISK_CACHE_SKIP_CLEANUP='1'\n\
    #export __GL_THREADED_OPTIMIZATION='1'\n#export STAGING_SHARED_MEMORY='1'\n#export\
    \ WINE_SIMULATE_WRITECOPY='1'\n#export DXVK_STATE_CACHE_PATH='/home/username/.wine/drive_c/Program\
    \ Files (x86)/Battle.net'\n#export __GL_SHADER_CACHE='/home/username/.wine/drive_c/Program\
    \ Files (x86)/Battle.net'\n#export VKD3D_SHADER_CACHE_PATH='/home/username/.wine/drive_c/Program\
    \ Files (x86)/Battle.net'\n#export VKD3D_CONFIG='dxr'\n#export exclude_processes='Agent.exe\
    \ \"Battle.net Helper.exe\n```\n\n在适用处将 `username` 替换为您的实际用户名。点击“保存”或通过文件菜单保存更改。\n\
    \n# 在 Gnome & Cinnamon 中设置图像背景\n\n访问 Cinnamon 官网 [`github.com/linuxmint/cinnamon`](https://github.com/linuxmint/cinnamon)\
    \ 获取有关 Cinnamon 的所有信息。\n\n### 将图像设置为背景：\n\n1. 右键点击图像文件并选择“设置为壁纸”。\n\n# mount_options.conf\n\
    \n访问 udisks 官网 [`www.freedesktop.org/wiki/Software/udisks/`](https://www.freedesktop.org/wiki/Software/udisks/)\
    \ 获取有关 udisks 的所有信息。\n\n### 通过命令行和 GUI 设置 `mount_options.conf`：\n\n```bash\nsudo\
    \ apt update\nsudo gedit /etc/udisks2/mount_options.conf\n```\n\n添加以下内容：\n\n```ini\n\
    [defaults]\nntfs_defaults=uid=$UID,gid=$GID\nntfs_allow=uid=$UID,gid=$GID,nls,umask,dmask,fmask,nohidden,sys_immutable,discard,force,sparse,showmeta,prealloc,no_acs_rules,acl,noatime\n\
    ```\n\n点击“保存”或通过文件菜单保存。\n\n# Cinnamon 中的启动项\n\n### 在 Cinnamon 中通过 GUI 添加启动项：\n\
    \n1. 使用 Super 键应用程序菜单。\n2. 导航到“启动项”，点击 + 号并选择“选择应用程序”。\n3. 输入要启动的应用程序名称，选择它并点击“添加”。\n\
    \n对于添加自定义命令：\n1. 使用 Super 键从菜单打开“启动项”。\n2. 点击 + 号并选择“自定义命令”。\n3. 输入命令名称、命令本身（例如\
    \ `discord` 以启动 Discord）、详细注释，并在需要设置启动延迟。\n4. 点击“保存”。\n\n### 通过命令行添加启动项：\n\n1.\
    \ 打开终端。\n2. 进入包含应用程序快捷的目录：\n   ```bash\n   cd /usr/share/applications\n   ```\n\
    3. 列出所有文件：\n   ```bash\n   dir\n   ```\n4. 识别应用程序的 `.desktop` 文件（例如 `firefox.desktop`）。\n\
    5. 将此文件复制到启动目录：\n   ```bash\n   sudo cp firefox.desktop /etc/xdg/autostart\n \
    \  ```\n\n# GNOME 中的启动项\n\n通过 GUI 在 GNOME 中添加启动项：\n\n"
- fmt: '

    Open the application menu with the `Super` key and launch "Tweaks."


    Navigate to the "Startup Applications" tab and click the `+` button.


    Type in the name of the application you want to start automatically and select
    "Add."


    # Auto Mount Partitions Using GNOME Disks


    Visit the official GNOME Disks website at [https://apps.gnome.org/en-GB/DiskUtility/](https://apps.gnome.org/en-GB/DiskUtility/)
    for all things GNOME Disks.


    ## Auto Mounting Partitions via the GUI:


    1. Launch `Disks` from the application menu.

    2. Select the disk holding the volumes you want to mount.

    3. Choose the specific volume on that disk, and click the cogwheel icon.

    4. Select "Edit Mount Options."

    5. Toggle the switch next to "User Session Defaults" to the left.

    6. Confirm your changes by clicking "OK."


    # Cinnamon Screenshot Keybindings


    ### Changing flashspot color attribute via the Command Line and GUI:


    1. Open the "Files" application and press `CTRL + L` to enable "Location Entry"
    mode.

    2. Type `/usr/share/themes/` and navigate to the `Mint-Y-Dark-Red` folder.

    3. Inside, go to the `cinnamon` directory.

    4. Right-click on an empty space and choose "open in terminal."

    5. Execute:

    ```bash

    sudo gedit cinnamon.css

    ```

    6. Search for the `flashspot` element and change its value to `"#00FFFFFF"`.

    7. Save changes and exit.

    8. Press `ALT + F2` to open the cinnamon run command box, type `r`, and hit enter
    to restart cinnamon.


    ### To create a "Screenshots" folder via GUI:


    1. Open the "Files" application and navigate to the `~/Pictures` directory.

    2. Right-click on an empty space and select the option to create a new folder.

    3. Rename it to "Screenshots."


    ### To take a focused window screenshot via GUI:


    1. Open "Settings" from the application menu.

    2. Navigate to "Keyboard" and select "Shortcuts." Click on "Add custom shortcut."

    3. Name it "Focused Window Screenshot" and input:

    ```bash

    bash -c "cd ~/Pictures/Screenshots && gnome-screenshot -w -f screenshot_$(date
    +%d-%m-%y-%H-%M-%S).png"

    ```

    4. Add the command and assign it a keyboard binding, such as `F10`.


    ### To take a fullscreen screenshot via GUI:


    1. Open "Settings" from the application menu. Navigate to "Keyboard" and select
    "Shortcuts."

    2. Click on "Add custom shortcut."

    3. Name it "Fullscreen Screenshot" and input:

    ```bash

    bash -c "cd ~/Pictures/Screenshots && gnome-screenshot -f screenshot_$(date +%d-%m-%y-%H-%M-%S).png"

    ```

    4. Add the command and assign it a keyboard binding, such as `F11`.


    # GNOME Overview & Windows Keybinds


    ### To change the "Show the Overview" keybind via GUI:


    1. Open the application menu and select "Settings." Navigate to the "Keyboard"
    tab and select "View and Customize Shortcuts."

    2. Search for "Show the overview."

    3. Press `Super + TAB` to set the new keybind.


    ### To change the "Switch Windows" keybind via GUI:


    1. Open the application menu and select "Settings."

    2. Navigate to the "Keyboard" tab and select "View and Customize Shortcuts."

    3. Search for "Switch windows." Press `ALT + TAB` to set the new keybind.


    # GNOME Screenshot Keybinds


    ### To change the "Take a Screenshot" keybind via GUI:


    1. Open the application menu and select "Settings."

    2. Navigate to the "Keyboard" tab and select "View and Customize Shortcuts."

    3. Search for "Take a screenshot."

    4. Press `F10` to set the new keybind.


    ### To change the "Take a Screenshot of a Window" keybind via GUI:


    1. Open the application menu and select "Settings."

    2. Navigate to the "Keyboard" tab and select "View and Customize Shortcuts."

    3. Search for "Take a screenshot of a window."

    4. Press `F11` to set the new keybind.


    ### To change the "Take a Screenshot of a Window Interactively" keybind via GUI:


    1. Open the application menu and select "Settings."

    2. Navigate to the "Keyboard" tab and select "View and Customize Shortcuts."

    3. Search for "Take a screenshot of a window interactively."

    4. Press `F9` to set the new keybind.


    # Default Systemd Timeout


    Visit the official Systemd website at [https://systemd.io/](https://systemd.io/)
    for all things Systemd.


    ### To set up the default Systemd timeout via Command Line and GUI:


    ```bash

    sudo apt update

    cd /etc/systemd/

    sudo gedit system.conf

    ```


    Change:

    `#DefaultTimeoutStartSec=90s`

    To:

    `DefaultTimeoutStartSec=30s`


    Save progress by clicking "Save," or through the File menu.

    Run:

    ```bash

    sudo systemctl daemon-reload

    ```


    # Making Files And Folders Immutable


    Visit the official Immutable Files and Folders website at [https://www.linux.org/docs/man1/chattr.html](https://www.linux.org/docs/man1/chattr.html)
    for all things Immutable Files and Folders.


    ### To make files and folders immutable via Command Line:


    ```bash

    sudo apt update

    cd ~/Downloads

    sudo chattr +i -RV CurseForge-1.251.0-17831.AppImage

    ```


    # ffmpegthumbnailer


    Visit the official ffmpegthumbnailer website at [https://github.com/dirkvdb/ffmpegthumbnailer](https://github.com/dirkvdb/ffmpegthumbnailer)
    for all things ffmpegthumbnailer.


    ### Installing ffmpegthumbnailer via APT in the Terminal:


    ```bash

    sudo apt update

    sudo apt install ffmpeg ffmpegthumbnailer gstreamer1.0-libav

    rm -r ~/.cache/thumbnails/

    ```


    # Removing .desktop files


    Visit the official .desktop files website at [https://specifications.freedesktop.org/desktop-entry-spec/desktop-entry-spec-latest.html](https://specifications.freedesktop.org/desktop-entry-spec/desktop-entry-spec-latest.html)
    for all things .desktop files.


    ### Removing .desktop files via the Terminal:


    ```bash

    cd /usr/share/applications

    dir

    sudo cp uget-gtk.desktop uget-gtk1.desktop

    sudo rm -r uget-gtk.desktop

    sudo update-desktop-database

    ```


    # Power Settings


    ### To adjust power settings via GUI:


    1. Open "Settings" from the application menu.

    2. Navigate to the "Power" section.

    3. Set "Screen Blank" to "5 Minutes."

    4. Turn off "Automatic Suspend" by selecting "Off."


    # GNOME Extensions


    GNOME Shell extensions, developed by third parties, enhance the GNOME interface
    by allowing customizations like window management tweaks or app launching modifications.
    You can find and manage these extensions on a dedicated website, and they come
    with unique identifiers (UUID) for secure installation. While they offer versatile
    enhancements, from minor to major interface changes, users should be cautious.
    Extensions integrate deeply with the OS, potentially leading to system issues
    or security risks. However, they undergo thorough reviews for safety before being
    available for download, ensuring a balance between innovation and security. Visit
    the official GNOME website at [https://foundation.gnome.org/](https://foundation.gnome.org/)
    for more information.


    The GNOME Shell Extension Manager simplifies the installation and management of
    GNOME extensions. This tool allows users to browse, install, remove, enable, or
    disable extensions directly from the `extensions.gnome.org` website, without needing
    a web browser. It''s particularly useful on Ubuntu 21.10 and later, where the
    default Firefox cannot install extensions due to its Snap format. With support
    for in-app updates from GNOME 43 onwards and the ability to manage installed extensions,
    including system ones, it offers a streamlined experience. Available via Flathub
    as a Flatpak, it stands as an essential tool for enhancing the GNOME desktop environment.
    Visit the official website at [https://extensions.gnome.org/](https://extensions.gnome.org/)
    for more details.


    The GNOME Shell Integration Chrome Extension and Firefox Addon facilitate seamless
    interaction between the GNOME desktop environment and the respective web browsers.
    They enable users to install, manage, and apply GNOME Shell extensions directly
    from their browser, without needing to use the terminal or other tools. This integration
    simplifies the customization and enhancement of the GNOME desktop experience,
    making it more accessible to users who prefer graphical interfaces over command-line
    operations. More information can be found at [https://extensions.gnome.org/extension/19/user-themes/](https://extensions.gnome.org/extension/19/user-themes/).

