    Once inside the BIOS, navigate to the boot menu options. Locate the USB drive
    within the boot queue and move it towards the end of the list to ensure the system
    prioritizes other boot options before attempting to boot from the USB drive.


    Switch to Advanced Mode within the BIOS settings. In Advanced Mode, find and select
    the `Settings` option, then locate and select the `Boot` option from the `Settings`
    menu.


    Within the `Boot` menu, search for the `UEFI Hard Disk Drive Priorities` and select
    the first entry. Use the arrow keys to navigate and highlight the `Ubuntu` option,
    then press the `ENTER` key to confirm the selection of `Ubuntu` as the desired
    boot entry.


    Save the changes made in the BIOS settings and exit the BIOS to allow the system
    to restart.


    # Linux Mint 22 First Login


    Begin by selecting the username established during the installation phase and
    enter the corresponding password, then click on the "Let''s go!" button.


    Next, locate the switch between the sunrise and sunset symbols to enable dark
    mode by moving the switch to the right. Find and untick the box next to "Show
    this dialogue at startup," then click on the `✕` symbol to close the dialogue.


    To shut down the `Update Manager`, navigate to the taskbar, right-click on the
    `Update Manager` icon, and select "Quit" to conclude the process.


    # Brief Idiosyncrasies Overview


    ## Password Entering & Confirmation


    When using commands that need special permissions, like `su -`, `sudo apt update`,
    or `sudo snap install`, you must enter your password. This is the password set
    during installation or updated in your account settings. It''s a simple step for
    security!


    Example:


    ```bash

    example@example:~$ sudo apt update

    [sudo] password for example: ********

    ```


    ## Installing and Updating Packages Using Mobile Home Broadband


    When updating Linux Mint 22 with a mobile home broadband connection, I often can''t
    get all necessary packages in one go. This usually requires redoing the installation
    and update steps. This issue seems specific to mobile broadband and doesn''t occur
    with `ADSL`, `ADSL 2`, `FTTC`, or `FTTP`.


    ## Wayland GDM3 Graphical Glitches on NVIDIA Graphics Cards


    Using `MSI NVIDIA 1060 6GB` and `Gigabyte NVIDIA RTX 3060 12GB` graphics cards,
    I encountered graphical issues at the `gdm3` login screen. This is due to limited
    compatibility between the default `Wayland` compositor and NVIDIA cards. The solution
    is simple: click the cog icon at the screen''s bottom right and select "GNOME
    on Xorg" before logging in. This ensures a glitch-free login experience, as `Xorg`
    is more compatible with NVIDIA graphics cards.


    ## Resolve Missing Packages for a .deb File


    To install `.deb` files easily, use:


    ```bash

    sudo apt install ./example.deb

    ```


    This finds and installs any necessary packages for your `.deb` file.


    ## Snap .desktop Shortcut Transfer to System-Wide Applications


    Sometimes, `.desktop` shortcuts for applications installed through `Snap` may
    not be accessible through the application menu or the `/usr/share/applications`
    folder.


    To make snap applications accessible, follow these steps:


    ```bash

    cd /var/lib/snapd/desktop/applications

    sudo cp discord_discord.desktop /usr/share/applications

    ```


    These commands navigate to the directory where the snap `.desktop` shortcuts are
    installed and copy them to the system-wide applications folder, ensuring they
    are accessible through the application menu.


    ## System Briefly Hangs When Install Battle.net Through Wine-Staging


    When installing `battle.net` for the first time through the relevant `battle.net`
    setup `exe` file, the system can hang for a while (sometimes quite a while) before
    returning to a responsive nature, on the other hand when I install `battle.net`
    through `Wine` and it hangs, I just wait a short while for the hang and then restart
    the system, before starting the installation process again and it works fine for
    me from then on.


    ## World of Warcraft Hangs Building Shaders


    On occasion `World of Warcraft` can briefly hang under Linux Mint 22 for the first
    few times running it (which has been my experience), with my belief being it is
    the shaders being built, `WoW` not being made to be run under `Wine` on Linux
    Mint 22 or some rumored error with the `MSAA` options, through I am unsure about
    the latter due to certain stuttering occurring in World of Warcraft in Windows
    11 despite `MSAA` being turned on or off.


    # First Time Logging In To Linux Mint 22


    ## Wayland Compositor NVIDIA Glitches


    If you have an NVIDIA graphics card and experience graphical glitches, there''s
    a simple fix. After entering your system login, click the cog icon at the bottom
    right. Choose "GNOME on Xorg" before logging in. Do this for the first login and
    for subsequent logins. This solution is detailed in the "Wayland GDM3 Graphical
    Glitches on NVIDIA Graphics Cards" section of the "Brief Idiosyncrasies Overview"
    chapter.


    ## For Other Graphics Cards


    For those using graphics cards other than NVIDIA, logging in is straightforward.
    Enter the password for the user account you created during setup. This simple
    step gets you into your system smoothly and quickly.


    ## Adding a User to the Sudoers File


    To add a user to the `sudoers` file, follow these steps:


    Open a terminal and switch to the root user:


    ```bash

    su -

    ```


    Add the user to the `sudo` group:


    ```bash

    sudo usermod -aG sudo username

    ```


    Replace `"username` with the desired username.


    Exit the root user session:


    ```bash

    exit

    ```


    Reboot the system:


    ```bash

    sudo reboot

    ```


    These steps will grant the user `sudo` privileges.


    ## Suspending Root Account in Linux Mint 22


    ### Modifying /usr/sbin/nologin:


    Open the terminal and execute:


    ```bash

    sudo apt install gedit

    sudo gedit /etc/passwd

    ```


    Locate the line starting with:

    `root:x:0:0:root:/root:/bin/bash`


    Modify this line to:

    `root:x:0:0:root:/root:/usr/sbin/nologin`


    Save the changes by clicking "Save" and then close the editor by clicking the
    `✕` button, or use `CTRL + S` and then close the editor.


    ### Modifying /etc/ssh/sshd_config:


    Open the terminal and run:


    ```bash

    sudo gedit /etc/ssh/sshd_config

    ```


    Scroll to the end of the `sshd_config` file.


    Add the line:

    `PermitRootLogin no`


    If the `PermitRootLogin` line is already present, change it from:

    `PermitRootLogin yes`


    to:

    `PermitRootLogin no`


    Save the changes by clicking "Save" and then close the editor by clicking the
    `✕` button, or use `CTRL + S` and then close the editor.


    ### Modifying /etc/shadow:


    Open the terminal and execute:


    ```bash

    sudo gedit /etc/shadow

    ```


    Locate the line starting with `root:.`.


    Add a `!` in front of `root:`, changing it to:

    `!root:`


    Save the changes by clicking "Save" and then close the editor by clicking the
    `✕` button, or use `CTRL + S` and then close the editor.


    # Linux Mint 22 Repositories


    In Linux Mint 22, you can manage software sources in two ways. First, use the
    `Software & Updates` tool to remove the CD-ROM source, which sometimes blocks
    updates. Then, you can add more sources to get new software. If you prefer the
    hands-on approach, open the terminal, edit the sources list with `gedit`, and
    disable the CD-ROM line. Add any extra lines you need for more software options.
    After editing, always refresh your sources to apply the changes.


    ## Enabling Linux Mint 22 Repositories


    Visit the official Linux Mint website at [https://linuxmint.com/](https://linuxmint.com/)
    for all things Linux Mint.


    ### Setting Up Repositories via Sources.list:


    Run the following commands in the terminal:


    ```bash

    sudo gedit /etc/apt/sources.list

    ```


    Amend with the following lines:


    ```text

    deb http://archive.ubuntu.com/ubuntu/ noble main restricted universe multiverse

    deb-src http://archive.ubuntu.com/ubuntu/ noble main restricted universe multiverse

    deb http://archive.ubuntu.com/ubuntu/ noble-updates main restricted universe multiverse

    deb-src http://archive.ubuntu.com/ubuntu/ noble-updates main restricted universe
    multiverse

    deb http://archive.ubuntu.com/ubuntu/ noble-security main restricted universe
    multiverse

    deb-src http://archive.ubuntu.com/ubuntu/ noble-security main restricted universe
    multiverse

    deb http://archive.ubuntu.com/ubuntu/ noble-backports main restricted universe
    multiverse

    ```

