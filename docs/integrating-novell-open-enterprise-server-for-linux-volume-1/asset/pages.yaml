  md: '# Backwards Compatibility


    Universal Password is designed to supply backwards compatibility to existing services.


    By default, passwords changed with this service will automatically be synchronized
    to the simple and NDS passwords on the User object (unless you specify otherwise
    using the Password Management plug-in).


    This way, NetWare 5.1 and 6 servers running Native File Access protocols for Windows
    and Apple workstations will continue to have their passwords function properly.


    Novell Client software prior to the Novell Client for Windows NT/2000/XP version
    4.9 or the Novell Client for Windows 95/98 version 3.4 will also have their passwords
    continue function properly.


    The exception to this is the use of international characters in passwords. Because
    the character translations are different for older clients, the actual values
    will not longer match.


    Customers who have deployed Web-based or LDAP services and use international passwords
    have already seen these problems and have been required to change passwords so
    they do not include international characters.


    You should upgrade your servers to NetWare 6.5 and all Novell Client software
    for full, system-wide international passwords to function properly.


    Novell''s NetWare Storage Management Services (SMS) infrastructure is used for
    Novell and third-party backup and restore applications. Additionally, the Novell
    Server Consolidation utility, Distributed File Services Volume Move, and Server
    Migration use SMS as their data management infrastructure.


    The system passwords used by these Novell and third-party products cannot contain
    extended characters if they are function in a mixed environment of NetWare 4,
    5, 6, and 6.5 servers.'
  merge: -1
  pgno: 428
- img_proc: true
  md: 'However, when all servers are upgraded to NetWare 6.5, extended character passwords
    can be used.


    Refer to Novell TID 10083884 for information on which applications and services
    are Universal Password-capable, as well as which applications and services are
    extended character-capable. Many applications and services use extended characters
    without Universal Password.


    For details on backwards compatibility and password change methods with older
