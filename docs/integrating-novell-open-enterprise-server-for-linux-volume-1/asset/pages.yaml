  md: '# Integrating Novell Enterprise Server for Linux


    At the bottom of the KDE menu, select the **Logout** entry. You can also right-click
    on the desktop background and select the same option from the popup menu.


    After selecting Logout, a confirmation dialog appears. If you select **Logout**
    again, you are logged out and the login screen re-appears, allowing you or another
    person to log in.


    # How to Shut Down and Reboot the Linux System


    If you are at the login screen, you can shut down or reboot your computer by opening
    the **Menu** and selecting one of the following options:


    +   - **Session Type.** You can choose a window manager other than KDE. In this
    course, we cover only KDE (the default window manager).


    +   - **Restart X Server.** You can restart the program that''s responsible for
    the graphical user interface. Remember, you can perform many administrative tasks
    without a graphical user interface.


    +   - **Shutdown.** If you select this option, you are asked if you want to shut
    down or restart your computer:


    Figure 2-5


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_121_0.png)


    For security reasons, you have to enter the root password because only root is
    allowed to restart or shut down the computer.'
