  md: "# The vi Editor\n\nText editors are still used for many system administration\
    \ tasks as well as for programming. In Linux, vi stands out as an editor that\
    \ offers comfortable editing functions and is more ergonomic than many editors\
    \ with mouse support.\n\nThe vi editor uses of three operating modes: insert mode,\
    \ command mode, and extended mode. Keyboard keys have different functions in vi,\
    \ depending on the current mode.\n\nOn startup, vi is normally set to the command\
    \ mode. The first thing to learn is how to switch between the modes:\n\n+   **Command\
    \ Mode to Insert Mode.** To switch from the command to insert mode, choose from\
    \ the following:\n  - Press **A** for append.\n  - Press **I** for insert.\n \
    \ - Press **O** for a new line under the current mode.\n\n+   **Insert Mode to\
    \ Command Mode.** To switch from insert to command mode press Esc. The vi editor\
    \ cannot be terminated in insert mode.\n\n+   **Command Mode to Extended Mode.**\
    \ To switch from command mode to extended mode, press the colon (:) key. The extended\
    \ or ex mode is similar to an independent line-oriented editor that can be used\
    \ for various simple and complex tasks.\n\n+   **Extended Mode to Command Mode.**\
    \ After executing a command in extended mode, the editor automatically returns\
    \ to command mode. If you decide not to execute any command in extended mode,\
    \ delete the colon. The editor returns to command mode.\n\nIt is not possible\
    \ to switch directly from insert mode to extended mode without first switching\
    \ to command mode.\n\nLike other editors, vi has its own procedure for terminating\
    \ the program. You **cannot** terminate vi while in insert mode. First, exit insert\
    \ mode by pressing Esc."
  merge: -1
  pgno: 148
- img_proc: true
  md: 'Subsequently, you have two options:


    +   1. **Exit without saving.** To terminate the editor without saving the changes,
    do the following:


    +   a. Press the colon (:) key.

    nThe colon (:) character appears at the bottom of the vi editor window. You are
    now in extended mode and any keys you press at this point will appear to the right
    of the colon.


    +   b. Enter the following:

    **q!**nEnter q indicates you want to quit the program. The exclamation mark (!)
    causes vi to ignore any changes to the file that is currently open.


    +   2. **Save and exit.** You have several options for saving your changes and
    terminating the editor.


    +   In command mode, enter the following:

    **zz**


    +   To exit the program and save all changes using the extended mode, enter the
    following:

    **:wq**


    Pressing the colon switches from command mode to extended mode. Once in extended
    mode, w stands for write and **q** for quit.


    # Bash Shell and OES NetWare


    Although Bash is available on OES NetWare, the following are some differences
    between Bash on OES Linux and Bash on OES NetWare:


    +   * **Limited functionality on DOS partitions.** Several Bash utilities rely
    on the existence of inode numbers for proper operation.'
  merge: -1
  pgno: 149
- img_proc: true
  md: 'Since files on the DOS partition on OES NetWare do not have inode numbers,
    these utilities might exhibit strange behavior when accessing files on DOS partitions.


    These errors might limit functionality on DOS partitions, but should not result
    in server abends or data loss.


    +   - Keyboard control (Ctrl) commands. The following are Ctrl commands that work
    differently (or not at all) on OES in OES NetWare Bash:


    | Table 2-3 | Ctrl Command | Difference |

    |---|---|---|

    | Ctrl+Z (Suspend Command) | Does not work and has no effect on processes |

    | Ctrl+C (Interrupt Command) | Works only for processes actively reading from
    the keyboard or writing to the screen |

    | Ctrl+\ (Quit Command) | Works only for processes actively reading from the keyboard
    or writing to the screen |

    | Ctrl+D (End of File Command) | Works only for processes actively reading from
    the keyboard or writing to the screen |


    # Common Bash File System Commands


    Common commands for managing the Linux file system include the following:


    +   - cp. This command copies files.


    +   - mv. This command can be used to move or rename a file.


    +   - rm. This command deletes a file.


    +   - cd. This command changes the current directory in the file system.'
  merge: -1
  pgno: 150
- img_proc: true
  md: '+   ls. This command lists the files and subdirectories within the current
    directory. To see ownership and permissions assigned to files and directories,
    use ls with the -l switch.


    +   dir. This command also lists the files and subdirectories within the current
    directory. To see ownership and permissions assigned to files and directories,
    use dir with the -o switch.


    +   pwd. This command prints the current directory.


    +   mkdir. This command makes a directory.


    +   rmdir. This command deletes a directory.


    +   more. This command can be used to pause screen display 1 at a time.


    +   less. This command is similar to more; however, it allows you to move either
    forward or backward through the display.


    +   grep. This command can be used to search for a specific string of text within
    a file. To do this, enter grep pattern filename.


    The grep utility provides many options as well as derivatives (such as grep or
    egrep). The most useful command line is -i which forces grep to ignore uppercase
    and lowercase letters in the pattern you specify.


    +   find. This command can be used to search for a file in the file system.


    +   locate. This command also searches for files in the file system, but uses
    a database and is much faster than find.


    To build or rebuild the database for locate, updatedb is added to cron.daily to
    be executed daily in the background.


    +   cat. This command prints the content of a file to the screen.


    +   tail. This command prints the last 10 lines of a file to the screen. With
    the -f -option, tail works in a forward mode scanning for additions to the specified
    file.


    For example, the tail -f /var/log/messages command is useful for monitoring log
    files (such as syslog) while troubleshooting a server problem.'
