  md: '# How to Assign File System Rights for NSS Volumes on OES Linux


    To understand system rights for NSS volumes on OES Linux, you need to understand
    the basics of how to do the following:


    +   - Assign Rights to Users

    - Assign Rights to Service Agents


    # Assign Rights to Users


    The rights utility for Linux is available for managing file system trustees for
    directories and files in NSS volumes on Linux. It is similar to the rights utility
    for NetWare.


    You can load rights from the command line of the server console.


    File system rights for directories and files in NSS volumes can only be managed
    using the rights utility at the OES command line or from the Novell Client at
    a client workstation.


    File system rights for directories and files in NSS volumes cannot be managed
    through Remote Manager, iManager, ConsoleOne, or by NW Admin. You must use the
    rights utility to manage file system rights.


    > eDirectory object rights to objects that represent NSS volume are managed through
    iManager, the same as for objects that represent NSS volumes on OES NetWare.


    You start the rights utility from the command line. You must be authenticated
    as root to use this utility, unless the root user modifies permissions to the
    rights executable file, which is in the /bin folder.


    For example, to give the admin user permission to execute the command, change
    the owner to admin by entering chown admin /bin/rights. You must be the root user
    to enter this command.'
  merge: -1
  pgno: 378
