  md: '# Exercise Conventions


    The exercises use conventions that indicate information you need to enter that
    is specific to your server.


    The following describes the most common conventions:


    +   - *italicized/bolded text*. This is a reference to your unique situation,
    such as the host name of your server.


    For example, if the host name of your server is DA3 and you see the following:


    ```

    hostname.da.com

    ```


    you would enter


    ```

    DA3.da.com

    ```


    +   - 10.200.200.x or DAx. This is the IP address or host name that is assigned
    to your OES NetWare server.


    For example, if your IP address is 10.200.200.3, and you see the following:


    ```

    10.200.200.x

    ```


    you would enter


    ```

    10.200.200.3

    ```


    +   - **Select**. The word *select* is used in exercise steps to indicate a variety
    of actions, including clicking a button on the interface and selecting a menu
    item.


    +   - **Enter and Type**. The words *enter* and *type* have distinct meanings.


    The word *enter* means to type text in a field or type text at a command line
    prompt and press the Enter key. The word *type* means to type text without pressing
    the Enter key.


    If you are directed to type a value, make sure you do not press the Enter key
    or you might activate a process that you are not ready to start.'
  merge: -1
  pgno: 33
