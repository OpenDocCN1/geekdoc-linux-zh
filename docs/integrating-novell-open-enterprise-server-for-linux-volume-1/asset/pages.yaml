  md: '# What NTP Is


    This objective is designed to teach you some of the basic concepts and programs
    included in the NTP distribution. It is not designed to teach you everything about
    NTP. For more information on NTP, visit www.ntp.org.


    NTP is an industry standard protocol that uses User Datagram Protocol (UDP) on
    port 123 to communicate between providers and time consumers.


    The UDP protocol suite is part of the TCP/IP protocol suite. Therefore, a computer
    using NTP needs the TCP/IP protocol suite loaded.


    An NTP time provider is a server that understands the NTP protocol and provides
    NTP time to other servers or workstations on the network. The NTP time provider
    gives time to operating systems that are NTP-compliant.


    An NTP time consumer is a server that understands the NTP protocol and seeks NTP
    time from an NTP time provider. A time consumer can, in turn, act as a time provider
    for other servers and client workstations on the network.


    The NTP time consumer can work with operating systems that are NTP-compliant.


    Any computers on your network with Internet access can get time from NTP servers
    on the Internet. NTP synchronizes clocks to the Universal Time Coordinated (UTC)
    standard, which is the international time standard.


    NTP not only corrects the time, but it keeps track of consistent time variations
    and automatically adjusts for time drift on the client. It allows for less network
    traffic and keeps the client clocks stable, even when the network is down.'
  merge: -1
  pgno: 326
- img_proc: true
  md: '# Stratum


    NTP introduces the concept of a stratum. Stratum x is used as a designation of
    the location of the servers in NTP tree hierarchy.


    Stratum-1 is the first (highest) level in the hierarchy. It denotes servers that
    adjust their time by means of some external reference time source (such as a GPS,
    an atomic clock, or radio).


    Servers that synchronize their time to stratum 1 servers are denoted as stratum
    2, and those that use stratum 2 servers to synchronize their time are denoted
    as stratum 3, and so on until you reach a stratum level of 15 (the maximum allowed).


    The higher the stratum number, the lower it is in the stratum hierarchy and the
    less preference it has in relation to other servers with a lower number.


    For example, a stratum 3 server (one that is using a stratum 2 server as a time
    provider) takes precedence over a stratum 10 server (such as one that is using
    its local clock default settings). The stratum 10 server is lower in the stratum
    hierarchy than the stratum 3 server.


    Differences between stratum-2 and stratum-1 servers are normally very small and,
    for the majority of users, unnoticeable.'
  merge: -1
  pgno: 327
- img_proc: true
  md: 'The following figure depicts the stratum hierarchy.


    Figure 5-1


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_328_0.png)


    Generally only one server in a network communicates with an external time provider.
    This reduces network traffic across geographical locations and minimizes traffic
    across routers and WANs.


    # ntpdate


    The NTP distribution includes the ntpdate program which can be used for a fast
    one-time synchronization between a time provider and a time consumer.


    To perform a one-time update of the client to the server, enter the following
    at the console prompt:


    ```

    ntpdate ip_address_of_time_provider

    ```'
  merge: -1
  pgno: 328
- img_proc: true
  md: 'Because the ntpdate synchronization only occurs once, the time consumer''s
    clock will eventually stray from time on the time provider''s clock. Therefore,
    ntpdate is not the best long-term solution for time synchronization.


    # xntpd


    The NTP distribution includes xntpd, the NTP daemon. This daemon is used by both
    the time provider (server) and the time consumer (client) to give and to obtain
    time respectively.


    The xntpd process is designed to adjust time continuously, making the time adjustments
    very small.


    xntpd can also limit the wander of the local clock based on historical data, even
    when a time provider is unavailable.


    The xntpd process requires little resource overhead. This allows NTP to be easily
    deployed on servers hosting other services, even if the servers are heavily loaded.


    # How xntpd Works


    Each time the NTP daemon is started, it reads the /etc/ntp.conf file on the host
    computer. This file is the NTP configuration file. It tells the NTP daemon which
    time providers to use.


    The default configuration uses the following two lines to declare itself a time
    provider with a stratum level of 10 and to use its own internal clock as its time
    source:


    ```

    server 127.127.1.0

    fudge 127.127.1.0 stratum 10

    ```


    To configure the daemon to use a time provider other than its own clock, add the
    following line to the ntp.conf file:


    ```

    server IP_address_of_time_provider

    ```'
  merge: -1
  pgno: 329
- img_proc: true
  md: 'Because of the algorithm that the NTP daemon uses, it is best to synchronize
    with multiple servers to help the client from an incorrect or downed server. In
    many environments, it is unlikely that an NTP server failure will be noticed quickly.


    To synchronize with multiple servers, simply add several lines the following to
    the ntp.conf file:


    ```

    server IP_address1

    ```


    ```

    server IP_address2

    ```


    ```

    server IP_address3

    ```


    You can leave the default lines that declare the server as a time provider with
    a stratum level of 10 alone. These lines provide you with a backup in case the
    servers you are using inaccessible.


    If any changes are made to the ntp.conf file, the daemon will need to be stopped
    and restarted in order to update the configuration without rebooting. The xtpd
    process can be started or restarted at any time.


    To start xntpd, when logged in as root, enter rcxntpd start.


    To stop xntpd, when logged in as root, enter rcxntpd stop.


    To restart xntpd, when logged in as root, enter rcxntpd restart.


    After the ntp.conf file has been read by xntpd, the client sends a request to
    the server and the server sends back a time stamped response, along with information
    such as its accuracy and stratum.


    Transactions between the client and the server occur about once per minute, decreasing
    gradually to once per 17 minutes under normal conditions. Poorly synchronized
    clients will tend to poll more often than well-synchronized clients.


    The client uses the information it gets from the server or servers to calibrate
    its clock. This consists of the client determining how far its clock is off and
    adjusting its time to match that of the server.'
  merge: -1
  pgno: 330
- img_proc: true
  md: '# Integrating Novell Enterprise Server for Linux


    To allow clocks to quickly achieve high accuracy, yet avoid overshooting the time
    with large time adjustments, NTP uses a system where large adjustments occur quickly
    and small adjustments occur over time.


    For small time differences (less than 128 milliseconds), NTP uses a gradual adjustment.
    This is called *slewing*. For larger time differences, the adjustment is immediate.
    This is called *stepping*.


    If the inaccuracy of a clock becomes too great (off by more than about 17 minutes),
    NTP aborts the NTP daemon, with the assumption something has gone wrong with either
    the client or the server. This is referred to as an *insane* time source.


    Because NTP averages the results of several time exchanges to reduce the effects
    of variable latency, it may take several minutes for NTP to reach consensus on
    what the average latency is.


    For these reasons, it often takes several adjustments (and several minutes) for
    NTP to reach synchronization.


    > In the long run, NTP tries to decrease the amount of polling by making the clock
    on each system become more accurate.


    For a complete list of the files and programs included in the NTP distribution,
    visit http://www.ntp.org.


    # ntptrace


    The NTP distribution also includes the ntptrace program. ntptrace is an informational
    tool that traces the source of time that a time consumer is receiving. It can
    be a useful debugging tool.'
  merge: -1
  pgno: 331
- img_proc: true
  md: 'The following is an example of nptrace output:


    ```

    localhost: stratum 3, offset 0.00723, synch distance

    1.18225

    tick.east.ca: stratum 2, offset 1.601143, synch

    distance 0.06713

    tock.usask.ca: stratum 1, offset 1.712003, synch

    distance 0.007233, refid ''TRUE''

    ```


    The nptrace output lists the client name, its stratum, its time offset

    from the host, the synchronization distance, and the ID of the

    reference clock attached to a server (if one exists).


    The synchronization distance is a measure of clock accuracy,

    assuming it has a correct time source.


    # Configure NTP on Your Network


    The following are ways to configure NTP on your network:


    +   * Use a Public NTP Time Server

    * Use a Reference Clock

    * Use a Server''s Local Clock

    * Use an NTP Time Source in Your Network


    # Use a Public NTP Time Server


    For most small organizations (ewer than 100 servers),

    synchronizing your servers to accurate public NTP servers is the

    most commonly used method for time synchronization.


    Because stratum-1 servers are generally closed to public access,

    stratum-2 servers should be used. Your network, however, should

    deesigned to minimize the number of servers that interact with the

    public NTP servers.


    A good strategy is to have one or two of your servers synchronize

    with NTP stratum-2 servers, and then have those

    provide time for the rest of your servers.'
  merge: -1
  pgno: 332
- img_proc: true
  md: 'For a list of publicly available NTP stratum-2 time servers, visit http://ntp.isc.org/bin/view/Servers/WebHome.


    To configure a server to obtain time from a particular NTP server, do the following:


    +   1. If NTP is not installed already, install it.

    NTP can be obtained from online sources or from the Linux Installation CD.

    2. Open the /etc/ntp.conf file using a Linux text editor.

    3. Add a line similar to the following for each NTP server that you want to use
    as a time provider:

    server IP_address_of_time_provider

    4. Save the file and exit the editor.

    5. Start the NTP daemon by entering rxntpd start

    The daemon will attempt to get an initial date and time from the NTP server you
    configured and return a "done" or a "failed" message.

    6. Configure the xntpd daemon to automatically start when the server boots by
    entering chkconfig xntpd 235 at a command prompt.


    # Use a Reference Clock


    You can use your own reference clock to provide time for your network. Reference
    clocks are devices that synchronize to the correct time using a variety of technologies,
    including long wave radio signals, GPS transmissions, or CDMA technology.


    True reference clocks can be expensive to obtain and maintain, several devices
    are cheaper and still provide time within a few milliseconds of UTC.'
  merge: -1
  pgno: 333
- img_proc: true
  md: 'Several factors need to be taken into account when choosing a reference clock.
    GPS receivers, for example, need to be mounted in a window or on the roof and
    some radio receivers may have problems operating in a shielded room.


    Also, to prepare for clock failure or to prevent an incorrect clock from affecting
    your time consumers, it is best to have at least three different reference clocks
    for fault tolerance.


    > You can find information on how to choose reference clocks at http://www.ntp.org.


    # Use a Server''s Local Clock


    You can use your server''s internal local clock as a time source. Because a local
    clock''s time can wander, this is generally not a preferred time synchronization
    solution.


    The ntp.conf file is preconfigured to use the server''s local clock as the time
    source, so it does not need to be edited. The NTP daemon, however, does need to
    be started.


    To configure a server to obtain time from its own local clock, do the following:


    +   If NTP is not installed already, install it.

    NTP can be obtained from online sources or from the Linux Installation CD.

    At the server console, start the NTP daemon by entering rcxntpd start.

    Configure the xntpd daemon to start automatically when the server boots by entering
    chkconfig xntpd 235 at a command prompt.'
  merge: -1
  pgno: 334
- img_proc: true
  md: '# Use an NTP Time Source in Your Network


    In this course, DA1 is already set up as an NTP time provider. To set up your
    SUSE Linux server to get time from DA1, you need to follow these general steps:


    +   1. Log in to your SUSE Linux server as root so you have rights to edit the
    ntp.conf file.


    +   2. From a terminal session, nptdate to do a one-time synchronization operation.
    This is shown in the following:


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_335_0.png)


    ```

    $ nptdate 10.200.200.2

    # Jul 4 03:30:18 nptdate[10521]: step time 10.200.200.2 offset 5.042241 sec

    $ nptdate 10.200.200.2

    # Jul 4 03:30:14 nptdate[10431]: adjust time server 10.200.200.2 offset -0.005370

    ```


    You might need to enter the command twice to get the offset down to about 0, as
    shown in Figure 5-2. (The offset is shown in milliseconds.)


    +   3. To configure the /etc/ntp.conf to use your designated server, you simply
    add the following command to the file:


    server IP address


    This is illustrated in the following below the "##server xx.xx.xx.xx" line:


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_335_1.png)


    ```

    ##

    server 127.127.1.0          # local clock (LCL)

    fudge 127.127.1.0 stratum 10 # LCL is unsynchronized


    ##

    # Outside source of synchronized time

    ##

    server 10.200.200.2        # IP address of server


    ##

    ## Miscellaneous staff


    driftfile /var/lib/ntp/drift/ntp.drift # path for drift file

    logfile /var/log/ntp                # alternate log file

    # logconfig =status + sysevents

    # logconfig=all

    ```'
  merge: -1
  pgno: 335
- img_proc: true
  md: '4. After the /etc/ntp.conf file is modified and saved, you start the service
    with following:


    rcxntpd start


    Or, if the NTP daemon is already running, you restart the service by entering
    the following:


    rcxntpd restart


    You can verify that your server''s time is synchronized with the time provider
    by entering


    ntpq -p


    The results of both of these commands are shown in the following:


    # Figure 5-4


    | ntpq -p | remote | refid | st t | poll reach | delay | offset | jitter |

    | --- | --- | --- | --- | --- | --- | --- |

    | LOCAL(0) | LOCAL(0) | 10 1 | 8 64 1 | 0.000 | 0.000 | 0.008 |

    | da2.da.com | LOCAL(0) | 4 u | 7 64 1 | 0.872 | 71.076 | 0.008 |


    The offset between this server and the NTP time provider (10.200.200.2) is shown
    in milliseconds and is well below the 2-second threshold that eDirectory allows.'
  merge: -1
