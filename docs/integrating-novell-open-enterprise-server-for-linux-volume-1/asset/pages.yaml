  md: 'Evaluate and Upgrade to Novell Open Enterprise Server


    For details on using Deployment Manager, see "Prepare the Deployment Manager"
    on page 18 of the Novell Open Enterprise Server Installation Guide for NetWare
    (install-nw.pdf).


    You can access the guide from http://www.novell.com/documentation/oes/from the
    OES_Docs directory on your 3077 Course CD.


    # Prepare the Computer


    To prepare your existing server for the OES NetWare operating system, complete
    the following tasks:


    +   - Back up the NetWare server files. Make at least one backup of your NetWare
    server files, including files on the DOS partition. Do not attempt an upgrade
    without a backup.

    - Log out users prior to upgrading. We recommend that you log all users off the
    server before upgrading it.

    - Prepare application files prior to upgrading. Some applications require that
    you perform certain actions prior to upgrading.


    For example, if the server is running ZENworks for Servers 2, you must install
    ZENworks for Servers 3 prior to upgrading the server to OES NetWare.


    Any applications, products, or services (such as virus scan software or backup
    software) running on the server to be upgraded should be shut down before beginning
    an upgrade.


    +   - Verify a valid DOS partition. Your NetWare server uses the DOS partition
    to start the computer and load NetWare.


