  md: '# Integrating Novell Open Enterprise Server for Linux


    **Traditional NetWare File System.** Although it is considered a legacy file system
    on NetWare servers, the NetWare traditional file system is still robust and powerful,
    and it supports the NetWare file service access model.


    **Novell Storage Services (NSS).** NSS lets you manage your shared file storage
    for any size organization.


    On NetWare, NSS features include:


    +   - Visibility

    - Trustee access control support

    - Multiple simultaneous namespace support

    - Native Unicode

    - User and directory quotas

    - Rich file attributes

    - Multiple data stream support

    - Event file lists

    - File salvage subsystem


    Many of these features are also supported on NSS in OES Linux.


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_353_0.png)


    For a comparison of NSS on NetWare and Linux, see “Comparison of NSS on NetWare
    and NSS on Linux” page 413 of the Novell Storage Services File System Administration
    Guide (nss_enu.pdf).


    You can access the guide from http://www.novell.com/documentation/oes from the
    OES_Docs directory on your **3077 Course CD.**


    # NetWare Core Protocol Support (Novell Client Support) on Linux


    Many organizations rely on NetWare Core Protocol™ (NCP) and the Novell Client™
    software for highly secure access to file storage services.'
  merge: -1
  pgno: 353
- img_proc: true
  md: 'The NCP server for OES Linux lets you attach to Linux using Novell Client software.


    # Storage Options


    To understand Novell OES storage options, you need to know about the following:


    +   - Direct-Attached Storage Options (NSS and Traditional)

    - Advanced Storage Options (NSS Only)


    # Direct-Attached Storage Options (NSS and Traditional)


    As shown in Figure 5-6, you can install traditional volumes and Novell Storage
    System (NSS) volumes on both Novell OES platforms.


    These devices can be installed within the server or attached directly to the server
    through an external SCSI bus.


    # Advanced Storage Options (NSS Only)


    NSS volumes support the following advanced storage solutions:


    +   - Network Attached Storage (NAS) solutions. A NAS is a dedicated data server
    or appliance that provides centralized access for users and application servers
    through the existing network infrastructure. It uses traditional LAN protocols
    such as Ethernet and TCP/IP.


    When Gigabit Ethernet is used, access speeds are similar to directly attached
    storage device speeds.


    The downside is that data requests and data compete for network bandwidth.


    +   - Storage Area Network (SAN) solutions. A SAN is a separate, dedicated network
    consisting of servers and storage media that are connected through high-speed
    interconnects.'
  merge: -1
  pgno: 354
- img_proc: true
  md: 'Novell iSCSI. You can create a SAN using Novell iSCSI, which uses Novell eDirectory
    to manage iSCSI resources, including granting trustee rights and user access.


    Fault tolerant and high-availability architectures. You can use one or more of
    the following technologies:


    +   - Multiple Path I/O. NSS helps prevent failure in the connection between the
    CPU and the storage device by automatically identifying multiple paths between
    each NetWare server and its storage devices.


    +   - Software RAIDs, NSS supports software RAIDS to improve storage availability
    and performance by enhancing data fault tolerance and I/O performance.


    +   - Server Clusters. You can configure OES NetWare Linux servers in a high-availability
    cluster that uses a shared storage device.


    In a cluster, resources and services are automatically configured to switch from
    one server to another if the hosting server fails.


    You can also manually switch services from one server to another to help you maintain
    and upgrade servers during production hours and eliminate scheduled downtime.


    # OES File Storage Planning


