  md: '# Objective 1


    # Configure DNS on a Novell OES Linux


    Before configuring DNS on your OES Linux server, you need to understand the following:


    +   - How DNS Is Implemented on OES Linux

    - How to Configure DNS on OES Linux with YaST

    - What the DNS Server Configuration Files Are

    - How to Test DNS on OES Linux


    # How DNS Is Implemented on OES Linux


    Domain Name Services (DNS) is the standard name resolution service in TCP/IP-based
    networks.


    DNS is based on the BIND (Berkeley Internet name domain) architecture developed
    for UNIX systems. It is often paired with Dynamic Host Configuration Protocol
    (DHCP) to provide host server configuration information to clients.


    Novell has developed a directory-enabled DNS/DHCP service for NetWare that complies
    with the BIND 9.2 standard. Novell DNS/DHCP Services leverage eDirectory to provide
    centralized configuration and management of the services.


    Administrators can manage Novell DNS/DHCP Services using the Web-based iManager
    utility or the standalone DNS/DHCP Management Console.


    OES Linux also uses a BIND-compliant DNS Server.


    Because the DNS/DHCP services for OES NetWare and OES Linux both adhere to the
    BIND standard, they can coexist on the same network. Clients can receive name
    resolution and host configuration information from any DNS/DHCP server that is
    available.'
  merge: -1
  pgno: 306
- img_proc: true
  md: 'Some DNS security mechanisms, such as DNS Security Transaction Signatures and
    DNS Security Extensions, are not supported in the OES NetWare DNS server.


    The OES Linux DNS server does not support the dynamic reconfiguration and SNMP
    Traps that are available with the OES NetWare DNS server. It is not integrated
    with iDirectory or the Novell DNS/DHCP Management Console.


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_307_0.png)


    For details on DNS on OES Linux, see “DNS - Domain Name Service” on page 310 of
    the *SUSE Linux Enterprise Server 9 Administration Guide* (sles_admin.pdf).


    You can access the guide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 Course CD.


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_307_1.png)


    For details on DNS on OES NetWare, see “Configure DNS” on page 71 of the Novell
    DNS/DHCP Services Administration Guide for NetWare (dhcp_enu.pdf).


    You can access the guide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 Course CD.


    # How to Configure DNS on OES Linux with YaST


    The process for configuring a DNS server on OES Linux is accomplished through
    the YaST utility.


    To begin the process, launch YaST and select **Network Services > DNS Server**.
    If the bind packages are not installed yet, you will be prompted to install them
    and to insert the CD that contains the installation files.


    The first time you access the DNS server through YaST, a DNS server installation
    process is performed. In this process you configure certain DNS server settings,
    which are written to the /etc/named.conf file.'
  merge: -1
