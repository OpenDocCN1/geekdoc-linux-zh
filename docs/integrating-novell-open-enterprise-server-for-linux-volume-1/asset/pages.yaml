  md: '# Objective 4


    # Purchase and License Novell OES


    As part of your plan to implement Novell OES, you need to understand the following
    about purchasing and licensing Novell OES:


    +   - How to Get OES Through Upgrade Protection

    - How to Purchase OES

    - Novell OES Licensing


    # How to Get OES Through Upgrade Protection


    If you have Novell Upgrade Protection, you can upgrade to OES and the latest support
    pack free of charge.


    For more information and to start the upgrade process, do the following:


    +   1. Using your Novell account information, log in to the Novell Web Site (http://www.novell.com/nps).

    2. Access the Customer Care page by selecting the Customer Care icon.

    3. Follow the instructions on the Customer Care page to obtain the upgrade to
    Open Enterprise Server and the latest support pack.


    # How to Purchase OES


    If you have decided to purchase OES, visit the Novell How to Buy OES page at http://www.novell.com/products/openenterpriseserver/howtobuy.html.


    With your OES purchase, you receive


    +   - An activation code for enabling your OES Linux servers to receive online
    updates, including the latest support pack.

    - A pair of license files for installing OES NetWare servers.'
  merge: -1
  pgno: 84
- img_proc: true
  md: 'After you purchase OES, OES NetWare support packs are available at no charge
    on the Novell Support Web site at http://support.novell.com/filefinder/


    As part of the purchase process, it is important that you understand the OES licensing
    model under “Novell OES Licensing” on 1-48.


    # Novell OES Licensing


    To understand OES licensing, you need to know the following:


    +   - OES Licensing Model

    - Licensing on OES NetWare

    - Licensing on OES Linux


    Contact your Novell account executive or partner, or visit www.novell.com/oes
    for detailed pricing information. Some restrictions and terms may apply.


    # OES Licensing Model


    All OES licenses are purchased on a user-connection basis. The number of servers
    you are authorized to install is different for each platform, as follows:


    +   - OES NetWare Servers. The only licensing restriction that applies is the
    number of user connections allowed on your network.


    You are authorized to install as many OES NetWare servers as you need to provide
    services to those users.


    For example, if your OES license is for 100 user connections, you can install
    as many OES NetWare servers as desired. Up to 100 users can then connect to and
    use the services provided by the OES NetWare servers.'
  merge: -1
  pgno: 85
- img_proc: true
  md: '+   OES Linux Servers. The same restriction applies to the number of user connections
    allowed on your network.


    However, in contrast to OES NetWare, the number of OES Linux servers you are authorized
    to install is also restricted, as follows:


    +   For the first 50 licensed user connections, you are authorized to install
    one OES Linux server for every 10 connections.


    +   After the first 50 user connections, you are authorized to install one OES
    Linux server for every 50 connections.


    For example, if your OES license is for 100 user connections, you are authorized
    to install up to six OES Linux servers (five for the first 50 connections and
    one for the remaining 50 connections).


    For more information on OES licensing, see the OES Licensing page on the Novell
    Web site at http://www.novell.com/licensing/oes_licensing.html.


    # Licensing on OES NetWare


    When you install or upgrade NetWare, the server installation automatically installs
    the Novell Licensing Services (NLS) software.


    During the installation of the first NetWare server in a tree, you are prompted
    for a license/key file pair (*nlf and *.nfk).


    After installing OES, you can use Novell iManager to install and manage license
    certificates in your eDirectory tree and monitor NetWare usage. You can also monitor
    usage of Novell Licensing Services-enabled products.'
  merge: -1
  pgno: 86
- img_proc: true
  md: 'For additional information, see “How Novell Licensing Services Works” on page
    13 in the OES Licensing Services Administration Guide for NetWare (nlsadmin.pdf).


    You can access the guide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 Course CD.


    # Licensing on OES Linux


    In contrast with installing OES on the NetWare platform, installing OES on the
    Linux platform doesn’t require a license/key file pair (*.nlf and *.nfk).


    However, you are required to accept an end user license agreement (EULA) to install
    OES on either platform. Your rights to use the OES product are limited to the
    rights set forth in the EULA.


    > Violators of Novell’s license agreements and intellectual property are prosecuted
