  md: '# Objective 1


    # Describe Novell Open Enterprise Server

    (OES)


    Novell Open Enterprise Server (OES) is a powerful combination of products and
    technologies that run on both the NetWare and SUSE Linux Enterprise Server (SLES)
    9 operating systems.


    Its series of services—application, file and storage, high-availability, management,
    networking and security—give you a choice of the platform to use (NetWare or Linux)
    to run all the available services:


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_40_0.png)


    You can deploy OES services on either an OES NetWare® server (NetWare 6.5 SP3
    or later) or a SUSE® Linux Enterprise Server 9 (SLES 9) server.


    You can choose to install OES on a new server or upgrade an existing NetWare 6.5
    or SLES 9 to run OES services.


    The OES install automatically upgrades NetWare 6.5 with Support Pack 4 and SLES
    9 with Support Pack 2 if the Support Packs were not previously installed.'
  merge: -1
