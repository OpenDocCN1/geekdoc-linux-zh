  md: 'While these roles and tasks are listed, some are not available to the Admin
    user until you run the iManager configuration wizard. After that, all listed roles
    and tasks are available only to the Admin user and other users or groups you specifically
    designate.


    To perform this initial configuration with the iManager configuration wizard,
    do the following:


    +   1. Start iManager and log in as a user with administrator rights (such as
    Admin).


    +   2. At the top of the iManager page, select the Configure icon.


    +   3. From the left pane, select Role Based Services > RBS Configuration.


    +   4. At the top of the RBS Configuration page, select Configure iManager.


    This starts the iManager configuration wizard.


    +   5. From the iManager Configuration welcome page, continue by selecting Next.


    +   6. Follow the prompts and dialogs to complete the initial configuration and
    update the modules.


    +   7. After the modules are updated, select Close.


    # How to Configure RBS Roles


    With RBS, tasks are preassigned to roles, but these tasks can be replaced, reassigned,
    or removed altogether.


    In addition, users are associated with roles in a specified scope, which is a
    container in the tree which the user has the requisite permissions to perform
    a task.


    An RBS Role object creates an association between users and tasks. An administrator
    grants user access to a task by making the user member of the role to which the
    task is assigned.'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# Integrating Novell Enterprise Server for Linux


    A user can be assigned to a role in the following ways:


    +   - Directly as a user

    - Through group and dynamic group assignments

    If a user is a member of a group or a dynamic group that is assigned to a role,
    then the user has access to the role.

    - Through organizational role assignments

    If a user is an occupant of a organizational role that is assigned a role, then
    the user has access to the role.

    - Through container assignment

    A user object has access to all of the roles that its parent container is assigned.
    This could also include other containers up to the root of the tree.


    A user can be associated with a role multiple times, each with a different scope.


    The RBS Configuration task provides complete control over RBS objects. It is a
    central place for managing and configuring RBS objects.


    When you select **Role Based Services > RBS Configuration**, the following page
    appears:


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_275_0.png)


    RBS Configuration


    Role Based Service (RBS) Configuration provides the collection owner the ability
    to manage the objects in their system. By having the status of the modules available
    for collection makes it easy for the owner to maintain their system. Select a
    collection to view the relationship of the RBS objects.


    | Type | Name | Installed | Out-Of-Date |

    |---|---|---|---||

    | | Role Based Service 2.DigitalAir | 28 | 28 | |


