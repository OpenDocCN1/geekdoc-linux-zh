  md: '# Monitor eDirectory Trees on OES with Novell iMonitor


    Novell iMonitor provides cross-platform monitoring and diagnostic capability to
    all servers in your eDirectory tree. This utility lets you monitor your servers
    from any location on your network where a web browser is available.


    iMonitor lets you look at the eDirectory environment in depth on a partition,
    replica, or server basis. You can also examine what tasks are taking place, when
    they are happening, what their results are, and how long they are taking.


    You can use iMonitor to monitor the following versions of Novell Directory Services
    (NDSs) and eDirectory:


    +   - All versions of NDS and eDirectory for NetWare 4.11 or later

    - All versions of NDS and eDirectory for Windows

    - All versions of NDS and eDirectory for Linux, Solaris, AIX, and HP-UX


    The information you view in iMonitor immediately shows what is happening on your
    server. And because iMonitor relies on eDirectory (instead of OS-specific features),
    the same options are available across all supported platforms (including Linux).


    In this objective, we assume that you already know how to use iMonitor for NetWare
    servers. However, you might need to review the following information specific
    to using iMonitor in a mixed eDirectory tree with servers such as OES NetWare
    and OES Linux:


    +   - Novell OES iMonitor Features

    - System Requirements

    - How to Access iMonitor

    - Novell Remote Manager Integration'
  merge: -1
  pgno: 260
- img_proc: true
  md: "Integrating Novell Enterprise Server for Linux\n\nFor complete information\
    \ on iMonitor 2.1, refer to “Novell iMonitor 2.1” on page 163 in the Novell eDirectory\
    \ 8.7,3 Administration Guide (edir873.pdf).\n\nYou can access this guide from\
    \ http://www.novell.com/documentation/oes or from the OES_Docs directory on your\
    \ 3077 Course CD.\n\n# Novell OES iMonitor Features\n\niMonitor's features are\
    \ primarily server focused, meaning that they focus on the health of individual\
    \ eDirectory agents (running instances of NDS for the replica on the local server)\
    \ rather than the entire eDirectory tree.\n\niMonitor 2.1 (included in Novell\
    \ OES) provides the following features:\n\n+   - eDirectory health summary:\n\
    \    - Synchronization information\n    - Known servers\n    - Agent configuration\n\
    - eDirectory health checks\n- Hyperlinked DTrace\n- Agent configuration\n- Agent\
    \ activity and verb statistics\n- Reports\n- Agent information\n- Error information\n\
    - Object/schema browser\n- DirXML® monitor\n- Search\n- Partition list"
  merge: -1
