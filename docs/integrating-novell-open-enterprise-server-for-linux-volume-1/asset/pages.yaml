  md: '# How to Monitor Server Health


    Novell Health Monitoring Services (HMS) is a component provided in Novell OES
    that lets you monitor the health of Linux or NetWare operating systems using Web-Based
    Enterprise Management (WBEM).


    For details on WBEM, see http://www.dmtf.org/standards/wbem.


    WBEM is a set of management and Internet standard technologies developed to unify
    the management of enterprise computing environments.


    The goal of WBEM is to provide customers with the ability to manage all systems,
    regardless of their instrumentation type, using a common standard.


    OpenWBEM is an implementation of the specifications provided by the Distributed
    Management Task Force (DMTF).


    For details on OpenWBEM, see the OpenWBEM Services Administration Guide for OES
    (cimom.pdf) or http://www.openwbem.org.


    You can access this guide from http://www.novell.com/documentation/oes or the
    OES_Docs directory on your 3077 Course CD.


    HMS includes a plug-in for iManager that provides an interface for monitoring
    the health of Linux or NetWare operating systems through OpenWBEM.


    The level of monitoring increases for hosts that are running OpenWBEM and the
    HMS providers.


    This is the first release of these services by Novell. When these services are
    complete, you can gather data, analyze it, set up system alerts, and perform any
    actions needed.'
  merge: -1
  pgno: 287
- img_proc: true
  md: 'In this release, these services only let you collect data and do some analysis.
    You can obtain definitions of the analysis and action recommendations in the online
    help.


    In future releases, you will be able to configure thresholds and system alerts.
    Analysis and action recommendations will be made by the system.


    To perform basic Health Monitoring Services tasks, you need to know the following:


    +   - Novell HMS Components

    - Types of Health Monitoring

    - Platform Compatibility

    - How to Access HMS

    - How to Configure Health Monitoring

    - How to Add a Server to a Group

    - How to View a Quick Summary of a Server’s Health Status

    - How to View Server Health Details

    - How to Compare Server Health Details


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_288_0.png)


    For complete information on Health Monitoring Services, see the Health Monitoring
    Services Administration Guide (server_health.pdf).


    You can access this guide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 Course CD.'
  merge: -1
  pgno: 288
- img_proc: true
  md: "# Novell HMS Components\n\nHealth Monitoring Services in Novell OES includes\
    \ several components. The most significant are described in the following:\n\n\
    | Table 3-17 | Component | Description |\n|---|---|---|\n| CIM | Common Information\
    \ Model (CIM) is a conceptual information model that enables management of heterogeneous\
    \ networks using standard methods.\nThere are two parts to CIM: The CIM specification\
    \ and the CIM schema. |\n| CIMOM | Common Information Model Object Manager (CIMOM)\
    \ is a CIM object manager, or more specifically, an application that manages objects\
    \ according to the WBEM standard. |\n| OES | OES contains the CIMOM from the OpenWBEM\
    \ project. |\n| Providers | Providers plug into the OpenWBEM to extend its functionality.\
    \ Each provider instruments one or more aspects of the CIM Schema.\nNovell LIFE\
    \ providers include some HMS providers and a base set of accompanying Novell schemas.\
    \ |. |\n| Monitor Servers link in iManager | Health Monitoring plug-in for iManager\
    \ an interface for monitoring server health. |\n\n# Types of Health Monitoring\n\
    \nHMS provides the following monitoring types:\n\n+   - Robust health monitoring.\
    \ Robust health monitoring provides statistics for a system in the following categories:\n\
    \  - Memory\n  - Operating System\n  - Processes/Threads\n  - Network"
  merge: -1
  pgno: 289
- img_proc: true
  md: 'To use this type of health monitoring, the owcimodmod must be running on the
    servers being monitored so the status can be obtained.


    You must also be authenticated to the server being monitored in order to view
    health status, edit, or change the type of monitoring that you want to view.


    Simple server status. This type monitors whether the server is up and running
    or down based on a connection attempt to at least one of the following standard
    ports:


    +   - 7 (Echo)

    - 13 (Time)

    - 20 (FTP)

    - 22 (SSH)

    - 23 (Telnet)

    - 80 (HTTP)

    - 135 (DCE endpoint resolution)

    - 443 (Secure HTTP)

    - 445 (Microsoft Directory Services)

    - 524 (NCPTM, eDirectory)


    In this release, the ports searched for are not configurable.


    If a firewall blocks all of these ports or if routing disables them, obtaining
    a Simple Server status is not possible.


    > HMS is not cluster-enabled; if the server you are monitoring from fails, must
    log in to Novell iManager again.'
  merge: -1
  pgno: 290
- img_proc: true
  md: "# Platform Compatibility\n\nThe following summarizes the compatibility of Health\
    \ Monitoring Services with various network operating systems:\n\n| Type | OS |\
    \ Compatible Versions | Notes |\n|---|---|---|---|\\| Simple | Any | N/A | At\
    \ least one of the specified ports must be open and not blocked by routing. |\n\
    \ Robust | NetWare | OES on NetWare 6.5 SP3 or later | If you are upgrading from\
    \ NetWare 6.5 SP2 to SP3 or later, you must have iManager 2.5 somewhere in your\
    \ network and you must install OpenWBEM manually. |\n Robust | Linux | SUSE LINUX\
    \ Enterprise Server 9 SP1 or later | None. |\n\n# How to Access HMS\n\nTo access\
    \ HMS, do the following:\n\n+   1. Open and log in to iManager.\n\nIf you log\
    \ in to iManager as the Admin user or as a user with rights equivalent to Admin,\
    \ you can perform all the available Health Monitoring Services tasks.\n\nIf you\
    \ log in to iManager as a user other than Admin, you must have sufficient rights\
    \ to monitor servers. The HMS object must already be created and you must have\
    \ the following rights to the HMS object:\n\n+   [All Attributes Rights] Compare/Read/Write"
  merge: -1
  pgno: 291
- img_proc: true
  md: "[Entry Rights] Browse/Create/Rename/Delete\n\n+   2. (Conditional) If it is\
    \ not already selected, select the Roles and Tasks view.\n\n+   3. From the left\
    \ frame, select Servers > Monitor Servers.\nFrom here you can configure and display\
    \ statistics for OES servers.\n\nHMS uses anonymous SSL for the communication\
    \ between iManager and the various OpenWBEM CIMOM agents are being monitored.\n\
    \nBecause of this, HMS should be used only within unique trusted networks (behind\
    \ a firewall) where there is a low risk for man-in-the-middle attacks.\n\n# How\
    \ to Configure Health Monitoring\n\nThe first you select Monitor Servers to use\
    \ Health Monitoring Services, no eDirectory objects for this service exist in\
    \ the eDirectory tree. The following appears:\n\n![](img/1dca8e8a8784dadffa032dcfe0460e55_292_0.png)\n\
    \n| Health Monitoring Configuration |\n|---|\n| Enter a container where all monitor\
    \ lists will be stored. CIM and HMS domain objects will be created in this container.\
    \ This configuration of Health Monitoring Services applies to all users of the\
    \ eDirectory tree managed by this Instance of iManager. |\n| Container: [ ] |\n\
    \nYou are asked to specify a location for your monitoring list to be stored in:\n\
    \nDo the following:\n\n+   1. In the Container field, one of the following:\n\
    \   Type the full distinguished name of the container object where you want to\
    \ maintain the list of servers or the name of the container where the CIM object\
    \ already exists."
