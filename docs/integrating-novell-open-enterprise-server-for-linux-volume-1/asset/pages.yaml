  md: '# The Default NCP Volume


    The NCP Server for Linux enables NCP access to NCP volumes defined on the OES
    Linux server.


    When you install the NCP server, the installation creates one NCP volume named
    SYS that maps to the /usr/novell/sys folder on the Linux server.


    This NCP volume contains LOGIN and PUBLIC directories that, in turn, contain a
    small subset of the files found on a NetWare directories with the same names.


    # How to Create Volume Pointers


    Initially, there are no NCP home directories or data volumes available to Novell
    Clients that attach to an OES Linux server.


    If you want users to have NCP home or data directories on the server, you must
    decide where you want these directories to appear in the server''s directory structure
    and create NCP volumes using the NCPCON utility at the Linux prompt.


    For example, if you want to create an NCP volume (pointer) named HOME, you would
    perform the following steps:


    +   1. Determine that you want to mount it at the /home mount point on the Linux
    server.


    +   Different from other mount points on a Linux system, you can mount an NCP
    volume at a populated directory. The files and directories below this mount point
    are simply being accessible to NCP clients.


    +   2. Create the volume pointer:


    +   a. At the terminal prompt, enter ncpcon.


    +   b. At the ncpcon prompt, enter create volume HOME /home.'
  merge: -1
  pgno: 361
- img_proc: true
  md: 'After the volume pointer is created, a Novell Client can attach to the OES
    Linux server and see the HOME volume along with the SYS volume created by the
    installation.


    NCP Volume pointers are always created with uppercase names (HOME, SYS, etc.)
    regardless of the case specified when the volume pointers are created.


    # How to Assign File Trustee Rights


    You use the Novell Client for creating file system trustees for NCP volumes on
    OES Linux servers the same way you do for NCP volumes on OES NetWare.


    However, Novell Remote Manager on OES Linux cannot be used for creating file system
    trustees or managing rights on an NCP volume.


    The trustee assignments for an NCP volume on OES Linux are stored in the .trustee_database.xml
    file for that volume. This XML file is stored in the folder that is used as the
    NCP volume point.


    The dot at the beginning of the file name indicates that this is a hidden file.


    For example, for the HOME volume mounted at /home, trustee assignments are kept
    in the /home/.trustee_database.xml file. An example of .trustee_database.xml file,
    with no trustee assignments is configured in the following:


    5-9


    ```

    <volume_trustees>

    <inherited_rights_mask path="/.trustee_work.dat">

    <rights>S</rights>

    </inherited_rights_mask>

    <inherited_rights_mask path="/.trustee_database.xml">

    <rights>S</rights>

    </inherited_rights_mask>

    </volume_trustees>

    ```'
  merge: -1
  pgno: 362
- img_proc: true
  md: "After a few trustee assignments have been made,\nt.trustee_database.xml file\
    \ looks similar to the following:\n\n# Figure 5-10\n\n```\n<volume_trustees>\n\
    <trustee path=\"RLajoie\">\n  <name>RLajoie.IS.SLC.Da</name>\n  <rights>RWNCEM</rights>\n\
    </trustee>\n<trustee path=\"Keeetch\">\n  <name>Keeetch.IS.LSC.Da</name>\n  <rights>RWNCEM</rights>\n\
    </trustee>\n<inherited_rights_mask path=\"/.trustee_work.dat\">\n  <inherited_rights_mask>\n\
    <inherited_rights_mask path=\"/.trustee_database.xml\">\n  <rights></rights>\n\
    </inherited_rights_mask>\n</volume_trustees>\n```\n\nThe trustee assignments are\
    \ defined within the <trustee> element,\nusing the <name> and <rights> elements.\
    \ The <trustee> element\nuses the path=\"/path_name\" parameter to specify the\
