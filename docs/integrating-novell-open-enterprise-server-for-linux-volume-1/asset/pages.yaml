- img_proc: true
  md: '# # Summary


    # Objective


    # Summary


    +   1. Configure Time Synchronization on Novell OES


    In this objective you learned to use Network Time Protocol (NTP) to maintain a
    common time for all the servers in your network.


    You learned to do the following:


    +   - Identify Network Time Protocol Basics

    - Configure NTP on Your Network


    +   2. Configure eDirectory with ndsnconfig


    In this course, you may an OES Linux server from its own eDirectory tree in to
    an existing eDirectory tree with a NetWare server.


    You can accomplish much of this by using the eDirectory YaST module. However,
