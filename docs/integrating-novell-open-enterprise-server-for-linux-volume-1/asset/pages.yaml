- img_proc: true
  md: 'For details on the Novell OES post-installation options, see “Installing OES
    Components on an Existing OES for Linux Server” on page 36 of the Novell Open
    Enterprise Server Installation Guide for Linux (install-linux.pdf).


    You can access the guide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 Course CD.


    # The Role of SuSEconfig


    YaST acts as a front end to programs such as RPM (RPM Package Manager) software
    management, and to the configuration files of services such as DNS, DHCP, mail,
    and web services.


    When necessary, YaST writes the configuration you change directly into the final
    configuration file.


    In many other cases there is an additional intermediate step, in which the information
    you enter in YaST is first written to a file in the directory /etc/sysconfig/
    and then written to its final destination.


    This is the program where SuSEconfig becomes important.


    SuSEconfig is a tool used in Linux OES to configure the system according to the
    variables that are set in the various files in /etc/sysconfig/ and its subdirectories.


    These files contain variables such as SYSLOG_PARAMS="" in /etc/sysconfig/syslog
    and SMTPD_LISTEN_REMOTE="no" in /etc/sysconfig/mail.


    Some of these variables are used directly (such as in some start scripts). For
    example, if SYSLOG_PARAMS is set to "-r,\” the daemon that logs system messages
    is directed to listen on port 514 for system messages from other hosts.


    Other variables are used to modify other files.'
  merge: -1
  pgno: 136
- img_proc: true
  md: 'For example, if SMTPD_LISTEN_REMOTE is set to “yes,” the variable INET_INTERFACES
    in /etc/postfix/main.c is set to “all” by the script /sbin/SuSeConfig and by the
    scripts in /sbin/conf.d.


    SuSeConfig acts as a back end for YaST and activates the configuration changes
    you make when using a YaST module.


    If you modify files in /etc/sysconfig/ using an editor, all you might need to
    is restart a service for the change to take place. However, you might also need
    to run SuSeConfig.


    For this reason, we recommend running SuSeConfig after manually editing files
    in /etc/sysconfig/


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_137_0.png)


    For details on SuSeConfig, see “SuSeConfig and /etc/sysconfig” on page 274 of
    the SLES 9 Administration and Installation Guide (sles_9_admin_guide.pdf).


    Access the guide from http://www.novell.com/documentation/oes or from the OES_Docs
    directory on your 3077 Course CD.'
  merge: -1
  pgno: 137
