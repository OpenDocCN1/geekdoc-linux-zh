  md: '# Objective 5 Upgrade to Novell OES NetWare


    With the introduction of Novell Open Enterprise Server (OES), you can now take
    advantage of running Novell services and management tools on SUSE LINUX Enterprise
    Server.


    However, many Novell customers continue to use NetWare as their preferred choice
    for file, print, and networking services until they are prepared to move to a
    Linux platform.


    For those who plan to continue using NetWare, upgrading to OES NetWare is an important
    step in migrating to Novell Open Enterprise Server.


    If your migration plans include an upgrade to OES NetWare, you need to do the
    following:


    +   - Review Upgrade Guidelines Options for OES NetWare

    - Check System Requirements

    - Determine the Services to Install

    - Verify Rights for Upgrading to OES NetWare

    - Prepare the Network with Deployment Manager

    - Prepare the Computer

    - Start an In-Place Server Upgrade

    - Complete the OES NetWare Server Upgrade

    - Complete Post-Installation Tasks


    For additional details on installing or upgrading to NetWare, see the Novell Open
    Enterprise Server Installation Guide for NetWare (install-nw.pdf).


    You can access the guide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 Course CD.


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_88_0.png)'
