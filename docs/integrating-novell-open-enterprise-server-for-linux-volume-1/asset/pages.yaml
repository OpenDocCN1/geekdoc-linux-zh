- img_proc: true
  md: '# Integrating Novell Enterprise Server for Linux


    A subcontainer administrator needs the following rights to install or upgrade
    a NetWare server in the tree:


    +   - Supervisor right to the container where the server will be installed

    - Read right to the Security container object for the eDirectory tree

    - Read right to the NDSPKI:Private Key Attribute on the Organizational CA object,
    which is located in the Security container

    - Supervisor right to the W0 object located inside the KAP object in the Security
    container


    These rights are typically granted by placing all administrative users in a group
    or role, and then assigning the above rights to the group or role.


    Some of the products that you can select to install with OES NetWare require schema
    extensions of their own.


    Currently, only an administrator with rights at [Root] can extend the schema of
    an eDirectory tree; a subcontainer administrator does not have sufficient rights.


    One way to work around this is to have a root administrator install OES NetWare
    server with all products selected. This takes care of extending the schema for
    every possible server configuration.


    Subcontainer administrators can then install or upgrade subsequent OES NetWare
    servers without worrying about schema extensions.


    However, an easier method for extending the schema for OES products and services
    is to run the Schema Update task in Deployment Manager. This task extends the
    schema for the OES products you select for both the NetWare and Linux platforms.


    By default, the first three servers installed in an eDirectory partition will
    automatically receive a replica of the partition.'
  merge: -1
