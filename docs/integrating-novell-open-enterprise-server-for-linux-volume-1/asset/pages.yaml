  md: "# (continued) Table 3-5 Option Description\n\n| Option | Description |\n| :---\
    \ | :--- |\n| -g | Allow remote hosts to connect to forwarded ports. |\n| -l username\
    \ | Log in using the specified user name. |\n| -L listen-port:host:port | Forward\
    \ local port to remote address. This causes ssh to listen for connections on a\
    \ port and forward them to the other side by connecting to host:port. |\n| -p\
    \ port | Connect to the specified port. The server must be on the same port. |\n\
    | -q | Do not display any warning messages. |\n| -R listenport:host:port | Forward\
    \ remote port to local address. Causes ssh to listen for connections on a port\
    \ and forward them to the other side by connecting to host:port. |\n| -x | Disable\
    \ X11 connection forwarding (default). |\n| -X | Enable X11 connection forwarding.\
    \ |\n\n# SSH Command Examples\n\nThe following are some examples of using the\
    \ SSH client commands from an OES Linux command prompt:\n\n+   - **root@DA2:->\
    \ ssh da4.da.com**\n  In this example, the user root logs in to the computer da4.da.com.\n\
    - **root@DA2:-> ssh -l admin da4.da.com**\n  or\n- **root@DA2:-> ssh admin@da4.da.com**"
  merge: -1
