- img_proc: true
  md: '# Describe the Purpose and Architecture of Universal Password


    When users access CIFS or Samba shares on OES servers (NetWare or Linux), they
    authenticate through eDirectory using Universal Password, not their eDirectory
    password.


    Before deploying CIFS or Samba as a file access solution on your network, you
    should the the following about Universal Password:


    +   - Why Universal Password

    - Universal Password Security

    - Universal Password Deployment Steps


    # Why Universal Password


    Novell Open Enterprise Server (OES) software is designed to allow you to integrate
    heterogeneous systems and allow for native systems to operate.


    The traditional Novell password has proven troublesome as an authentication solution
    in an integrated heterogeneous environment, so Novell introduced Universal Password.


    Universal Password is a way to simplify the integration and management of different
    password and authentication systems in a coherent network.


    In the past, administrators had to manage multiple passwords (simple password,
    NDS password, enhanced password) because of password limitations. Administrators
    also had to deal with keeping the passwords synchronized:


    +   - NDS Password. The older NDS password is stored in a hash form that is non-reversible
    in eDirectory. Only the NDS system can make use of this password, and it cannot
    be converted into any other form for use by any other system.'
  merge: -1
  pgno: 418
- img_proc: true
  md: 'Simple Password. The simple password was originally implemented to allow administrators
    to import users and passwords (clear text and hashed) from foreign LDAP directories
    such as Active Directory and iPlanet.


    The limitations of the simple password are that no password policy (minimum length,
    expiration, etc.) is enforced. Also, by default, users do not have rights to change
    their own simple passwords.


    Enhanced Password. The enhanced password offers some password policy, but its
    design is not consistent with other passwords. It provides a one-way synchronization
    and it replaces the simple or NDS password.


    To ensure that the password is secure, NMAS uses either a DES key or a triple
    DES key (depending upon the strength of the Secure Domain Key) to encrypt the
    data in the NMAS Secure and Configuration Store.


    Universal Password was created to address these password problems. It provides


    +   * One password for all access to eDirectory

    * Enables the use of extended characters in password

    * Enables advanced password policy enforcement

    * Allows synchronization of passwords from eDirectory to other systems


    Universal Password is managed by the Secure Password Manager (SPM), a component
    of the NMAS module (nmas.nlm in NetWare).


    SPM simplifies the management of password-based authentication schemes across
    a wide variety of Novell products as well as our partners’ products.


    The management tools only expose one password and do not expose all of the behind-the-scenes
    processing for backwards compatibility.'
  merge: -1
  pgno: 419
- img_proc: true
  md: 'Access Data on an OES Linux Server Using CIFS/Samba


    Secure Password Manager and the other components that manage or use of Universal
    Password are installed as part of the NetWare 6.5 or later and eDirectory 8.7.1
    installation. However, Universal Password is disabled by default.


    Because all APIs for authentication and setting passwords are moving to support
    Universal Password, all the existing management tools, when run on clients with
    these new libraries, automatically work with the Universal Password.


    The Novell Client supports the Universal Password. It will also continue to support
    the NDS password for older systems in the network. The Novell Client has the capability
    of automatically upgrading to the new Password from the NDS password.


    # Universal Password Security


    Because reversible encryption of Universal Password is required for convenient
    interoperation with other password systems, administrators have to evaluate the
    costs and benefits of the system.


    Using a single copy of the Universal Password stored in eDirectory may be more
    secure and/or convenient than attempting to manage several different passwords.
    Novell provides several levels of security to make sure Universal Password is
    protected while stored in eDirectory.


    A Universal Password is protected by three levels of security; tripleDES encryption
    of the password itself, eDirectory rights, and file system rights.


    The Universal Password is encrypted by a tripleDES, user-specific key. Both the
    Universal Password and the user key are flagged with a hidden attribute that only
    eDirectory can read.


    The user key (3DES) is stored encrypted with the tree key and the tree key is
    protected by a unique NICI key on each machine. Neither the tree key nor the NICI
    key is stored within eDirectory, and they are not stored with the data they.'
  merge: -1
  pgno: 420
- img_proc: true
  md: "# Integrating Novell Enterprise Server for Linux\n\nThe tree key is present\
    \ on each machine within a tree, but each tree has a different tree key. So, data\
    \ encrypted with the tree key can only be recovered on a machine within the same\
    \ tree.\n\nThus, while stored, the Universal Password is protected by three layers\
    \ of encryption.\n\nEach key is also secured via eDirectory rights. Only the administrators\
    \ with supervisor rights or the users themselves have the rights to change Universal\
    \ Passwords.\n\nFile system rights ensure that only users with the proper rights\
    \ access these files.\n\nIf Universal Password is deployed in an environment requiring\
    \ security, you can take the following precautions:\n\n+   1. Make sure that the\
    \ following directories and files are secure:\n    * On a NetWare server, secure\
    \ the following:\n      %system32%\\novell\\nici\n    * On a Windows server, secure\
    \ the following:\n      %system32%\\novell\\nici\n      %system32(where the NICI\
    \ DLL is installed)\n    * On a Linux/Unix server, secure the following:\n   \
    \   /var/novell/nici\n      etc/nici.cfg\n      /usr/local/lib/libcc2.so (and\
    \ the NICI shared libraries in the same directory)\n    * On LSB-compliant Linux/Unix\
    \ servers, secure the following:\n      /var/novell/nici\n      etc/nici.cfg\n\
    \      /usr/local/lib/libcc2.so (and the NICI shared libraries in the same directory)\n\
    \      /var/opt/novell/nici\n      etc/opt/novell\n      /opt/novell/lib"
  merge: -1
