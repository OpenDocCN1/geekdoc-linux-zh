  md: '# YaST and OES Linux Configuration


    Although you use YaST to install OES Linux, it has an equally important role as
    a system management and configuration tool.


    You can use YaST to configure various services, to install software, to configure
    hardware, to manage users, and to complete many administrative tasks.


    To perform basic administrative tasks with YaST, you need to know how to do the
    following:


    +   - Start YaST with a GUI interface. You can start YaST by selecting the YaST
    icon from the desktop and then entering the password (if you are not already logged
    in as root).


    After authenticating, the following appears:


    Figure 2-11


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_133_0.png)


    This is the main dialog of YaST, also known as the YaST Control Center.'
  merge: -1
