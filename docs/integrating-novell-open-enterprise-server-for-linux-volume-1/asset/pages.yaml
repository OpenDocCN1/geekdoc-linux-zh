  md: '# SSH Commands


    After downloading an SSH-compliant client to your workstation, you can use the
    following commands to accomplish basic tasks on an OES server running an OpenSSH
    server:


    | Table 3-4 | Command | Description |

    |---|---|---|

    | | ssh | Connect and log in to the specified server (hostname). You must provide
    your identity (such as ssh admin@10.0.0.1) to the remote machine. |

    | | sshd | Control how the daemon logs you. |

    | | sftp | Perform secure file transfers with FTP-like command that works over
    SSH1 and SSH2 protocols. |

    | | scp | Copy files between hosts on a network. It uses SSH1 for data transfer,
    and uses the same authentication and provides the same security as SSH1. |

    | | | Scp asks for passwords or passphrases if they are needed for authentication.
    |


    # SSH Command Options


    From an SSH client, you can use the following basic options with the ssh command:


    | Table 3-5 | Option | Description |

    |---|---|---|

    | | -b bind_address | Specify the local IP address to transmit from machines with
    multiple addresses or aliased addresses. |

    | | -C | Enable compression. |

    | | -D port | Enable dynamic application-level port forwarding. |

    | | -f | Fork into background after authentication. |'
