  md: 'With NCP volumes on OES NetWare, rights can be managed either through NRM or
    from the Novell Client.


    You use the Novell Client to manage file system rights by doing the following:


    +   1. Use the Novell Client to log in to the tree as a user with Supervisor rights
    to the NCP volume.


    +   2. Navigate to the NCP volume (using My Network Places, for example) and locate
    the folder you want to manage rights.


    +   3. Right-click the **folder** and select *Properties*; then select the **NetWare
    Rights** tab.


    +   4. Browse and select the **user** you want to give trustee rights; then select
    **Add.**.


    +   5. From the Trustee list at the top of the Properties window, select the *boxes*
    for the desired file system rights; then select **OK.**.


    # How to Install and Configure Linux NCP Server


