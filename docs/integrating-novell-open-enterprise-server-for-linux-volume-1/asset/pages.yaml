- img_proc: true
  md: '# Objective 3


    # Manage an OES Server from a Bash Shell


    Although managing an OES Linux server from the KDE desktop can be a useful and
    effective method, if you are more comfortable managing a server from a command
    prompt, the following can help you transition the skills you already have to managing
    OES Linux server from a command prompt:


    +   - Virtual Consoles on OES Linux


    +   - Bash Shell on OES Servers


    +   - Bash Shell and OES NetWare


    +   - Common Bash File System Commands


    +   - Bash Command Web References


    +   - NetWare Commands and Linux Equivalents


    # Virtual Consoles on OES Linux


    Because more than one person often uses the same PC, *virtual consoles (also called
    virtual terminals)*** were created in Linux. With virtual consoles, you can work
    in Linux as if you had several terminal screens available at the same time.


    You have up to six virtual consoles (F1–F6) running on your computer. By pressing
    **Ctrl+Alt+Fx**, you can switch between individual consoles. By pressing **Ctrl+Alt+F7**,
    you can switch back to your graphical user interface (such as the KDE desktop).


    The following lists the standard content of each virtual console:


    | Table 2-1 | Virtual Console | Contents |

    |---|---|---|

    | Ctrl+Alt+F1 | Installation dialog |

    | Ctrl+Alt+F2 | Shell prompt |

    | Ctrl+Alt+F3 | Install log (from installation program) |

    | Ctrl+Alt+F4 | System-related messages |'
  merge: -1
  pgno: 139
- img_proc: true
  md: '# Table 2-1 Virtual Console Contents


    | | | |

    | Ctrl+Alt+F5 | Shell prompt |

    | Ctrl+Alt+F6 | Shell prompt |

    | Ctrl+Alt+F7 | X graphical display |


    You can determine the terminal currently being used from the tty number (tty1–tty6).
    tty is an abbreviation for teletype, which is another word for terminal.


    When you switch to a virtual console, a login prompt appears:


    ```

    Welcome to SUSE LINUX Enterprise Server 9 (i586) - Kernel 2.6.4-27-default (tty1).

    dna5 login:

    ```


    From here you can enter your login name and password. A default shell is started
    (see “Bash Shell on OES Servers” on 2-26) with a command line prompt (called a
    shell prompt in Linux).


    To exit the shell and return to the login, enter exit.


    Besides using the virtual consoles, you can start a terminal emulation (called
    Konsole) from your KDE desktop Kicker by selecting the following icon:


    Figure 2-14


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_140_0.png)'
  merge: -1
  pgno: 140
- img_proc: true
  md: 'The terminal opens inside a window with a default shell and shell prompt:


    # Figure 2-15


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_141_0.png)


    You can select options from the menus to configure the terminal (such as font
    and background colors).


    When you finish using the terminal window, you can close the window (select the
    X button or select Session > Quit).


    # Bash Shell on OES Servers


    To communicate directly with the operating system, you need to use a program that
    serves as an interface between you and the operating system.


    In the UNIX family operating systems (including Linux), this program is called
    the shell.


    The shell accepts your entries, interprets them, converts to system calls, and
    delivers system messages back to you, making it a command interpreter.'
  merge: -1
  pgno: 141
- img_proc: true
  md: 'UNIX has a whole series of shells, most of which are provided by Linux in freely
    usable versions. The following are examples of some popular shells:


    +   - The Bourne shell (/bin/sh)

    - The Bourne again shell (/bin/bash)

    - The Korn-Shell (/bin/ksh)

    - The C Shell (/bin/tcsh)

    - The TC Shell (/bin/tcsh)


    The default shell provided in SUSE LINUX is Bash (Bourne shell). OES NetWare also
    provides Bash shell functionality.


    To use the Bash shell in Novell OES, you need to know the following:


    +   - How to Start and Exit a Bash Shell

    - Completion of Commands and Filenames

    - History Function

    - Switch to User root (Linux Only)

    - Pipe Commands

    - Man Pages

    - The vi Editor


    # How to Start and Exit a Bash Shell


    The Bash shell can be started by doing the following:


    +   - OES NetWare. In OES NetWare, Bash is an NLM file (bash.nlm). You can start
    Bash from a system console prompt by entering bash.'
  merge: -1
  pgno: 142
- img_proc: true
  md: '+   - OES Linux. In OES Linux, the Bash shell is started by default each time
    you switch to a virtual console (similar to a system console in OES NetWare) or
    open a terminal window (similar to a Command Prompt window in Windows) from the
    Linux desktop.


    From a virtual console or terminal window, you can switch to another shell by
    entering the appropriate command.


    For example, you can switch to the C shell by entering **csh** or **tcsh**; you
    can switch to the Bash shell by entering **sh** or **bash**.


    Unlike most other programs, the shell does not close on its own. You need to enter
    the command **exit** to return to the previous shell or console.


    # Completion of Commands and Filenames


    The Bash shell supports a function of completion commands and filenames. Just
    enter the first characters of a command (or a filename) and press the Tab key.
    The Bash shell completes the name of the command.


    If there is more than one possibility, the Bash shell shows all possibilities
    when you press the Tab key a second time. This feature makes entering long filenames
    very easy.


    # History Function


    Bash stores the commands you enter in a file so you have easy access to them.
    You can display the content of the file by entering the command **history**.


    You can display the commands stored in the history cache (one at a time) by using
    the arrow keys. The Up-arrow shows the previous command; the Down-arrow shows
    the next command. After finding the desired command, edit it as needed; then execute
    it by pressing **Enter**.'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'When browsing the entries of the history in Linux, you can also select specific
    commands. Typing one or several letters, PageUp or PageDown, displays the preceding
    or next command in the history cache beginning with this letter.


    If you enter part of the command (not necessarily the beginning of the command),
    pressing Ctrl+R searches the history list for matching commands and displays them.
    Searching starts with the last command executed.


    # # Switch to User root (Linux Only)


    If you are working with a shell in Linux, you can switch to root by entering the
    su - command and the root password.


    If you want to start a graphical application from the shell, you have to use the
    su - command instead.


    You can check to make sure you are root by entering **id** or **whoami**. To leave
    the root administrator shell, you enter the command **exit**.


    # # Pipe Commands


    The output of one command can be used as the input for another command by using
    the pipe symbol ( | ):


    ```

    command1 | command2

    ```


    For example, you can use the following cat command to output the contents of a
    file to the screen:


    ```

    cat hosts

    ```


    In this example, the content of the hosts file is displayed, and you are returned
    to the console prompt.'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'However, the content of some files is extensive and cannot be displayed all
    at once on the screen. In this case, you can use a pipe to redirect the output
    through another command that lets you control the displayed text.


    For example, the more command and the less command let you page and scroll through
    text as it is displayed on the screen:


    # cat httpd.conf | more


    When using the more or less commands, you can continue scrolling (using the Spacebar)
    until you reach the end of the file and are returned to the shell prompt.


    You can also quit the display at any time and return to the shell prompt by typing
    q.


    # Man Pages


    The most important command for getting online help from the Bash shell is man
    (an abbreviation of manual or man page).'
  merge: -1
  pgno: 145
- img_proc: true
