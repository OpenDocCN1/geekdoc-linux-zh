  md: '# The following describes the available options:


    ### Table 3-15

    | Option | Description |

    | :--- | :--- |

    | Name | Provide a descriptive name for the item. |

    | Monitoring Type | Select one of the following types from the drop-down list:


    * **Label.** Text information to use as a label on the group monitor display.
    Lets you identify each group specifically as needed.

    * **LDAP Directory Root Search.** Shows the response when trying to ping port
    389 of the specified LDAP server. Credentials are not used. This is useful to
    monitor the status of your LDAP servers in your network.

    * **NRM Group.** Shows the health status of a group of servers. Lets you access
    the specific health page for each server in the group.

    * **NRM Health Monitor.** Shows the health status of each server in the group.
    Lets you access the specific health page for each server in the group.

    * **ICMP Echo (Ping)** or **Ping ICMP.** Shows the response when sending ping
    requests to the specified DNS name or IP address.

    * **TCP/IP Service Query** or **TCP/IP Port Query.** Shows response activity of
    a designated TCP/IP service. This query attempts to make a TCP connection to the
    specified address and port.

    The only states that are returned are green (good), which means the connection
    was successful, and red (bad), which means the connection was not successful.|'
