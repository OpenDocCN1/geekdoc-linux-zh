  md: '# Introduction


    Once you have OES Linux installed, performing administrative tasks can be a little
    challenging as you become familiar with the Linux file system and administrative
    tools.


    Although many of the details might be new to you, the general administrative concepts
    are still the same as managing any other operating system.


    In this section, you are introduced to some of the basic tools and interfaces
    you can use to manage your OES Linux server from the KDE desktop.'
