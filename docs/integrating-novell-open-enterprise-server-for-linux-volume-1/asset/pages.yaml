    # # How to Configure the SSH Client


    You configure the SSH client by editing the file /etc/ssh/ssh_config. Users can
    edit their individual settings in the file ~/.ssh/config.


    If you want to ensure (in general) only previously entered servers are accepted,
    you need to set the option StrictHostKeyChecking in the client configuration file
    (~/.ssh/config) to Yes (on).


    This prevents the client from simply entering new keys from unknown servers without
    checking. This is only entered on the first connection.


    In SSH version 1.2.20 and later, three values are allowed for StrictHostKeyChecking:
    Yes, No, and Ask. The default setting is ask, which means that before a new key
    is entered, the user is asked for permission.


    For additional information on SSH server configuration options, enter man ssh.


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_209_0.png)'
