  md: 'If you select Turn off computer and select OK, Linux closes all the (system)
    programs currently running.


    Older computers that do not have power management and cannot switch themselves
    off can be switched off when the following message appears:


    | Master Resource Control: runlevel 0 has been reached |


    If you switch the machine off too soon, you could possibly lose data.


    You should always shut down your computer before you turn it off.


    # How to Identify KDE Desktop Components


    The KDE desktop environment includes the following components:


    +   - The Desktop

    - The KDE Control Panel (Kicker)

    - The KDE Menu

    - Virtual Desktops


    # The Desktop


    On the desktop you see only a few icons. You can start the applications associated
    with these icons by selecting them once with your left mouse button.


    You can move the icons by dragging them with the mouse.'
