  md: 'After making changes to this file, you have to stop and start the CIFS server
    before the changes will take effect. You do di this by entering the following
    commands:


    ```

    CIFSSTOP

    CIFSSTRT

    ```


    The CIFS server can now be accessed by users in the IS.SLC.DA context.'
