  md: '# Exercise 5-1 Migrate the DA1 Linux Server to the DA-CORP Tree


    Now that you have reviewed time synchronization and Linux user management, you
    are ready to begin Exercise 5-1.


    Currently, the DA2 NetWare and DA1 Linux servers are in separate trees: DA2 NetWare
    is in the DA-CORP tree and DA1 Linux is in the DA-SERVICES tree. Each server is
    using its own local clock as a time provider.


    The exercise begins with steps to configure the DA2 NetWare server to use the
    DA1 Linux server as a time provider so that the two servers will be time synchronized.


    Because the DA1 Linux server is currently hosting the DA-SERVICES eDirectory tree,
    you must remove the server from this tree before installing DA1 into the DA-CORP
    tree.


    Because the DA1 Linux server is also hosting a LUM configuration that works with
    the DA-SERVICES tree, part of the exercise involves removing the current LUM configuration
    and then reconfiguring LUM to work with the DA-CORP tree.


    Exercise 5-1 Migrate the DA1 Linux Server to the DA-CORP Tree is in your Integrating
    Novell Open Enterprise Server Workbook for Linux on page 5-2.'
  merge: -1
