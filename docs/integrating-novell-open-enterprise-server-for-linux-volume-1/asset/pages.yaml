  md: '# Manage Novell OES Servers


    +   - Agent process status

    - Background process schedule

    - DSRepair

    - Connection monitor


    The information you can view in iMonitor is based on the following factors:


    +   - **The identity you have established.** Your identity''s eDirectory rights
    are applied to every request you make in iMonitor.


    For example, you must log in as the administrator of the server or as a console
    operator on the server where you are trying to access the DSRepair page.


    +   - **The eDirectory agent version you are monitoring.** Newer versions of NDS
    and eDirectory have features and options that older versions do not.


    You can use iMonitor to monitor all versions of NDS and eDirectory for NetWare
    4.11 or later.


    # System Requirements


    To use iMonitor 2.1, you need the following:


    +   - Mozilla Firefox 1.0, Microsoft Internet Explorer 5.5 or later, Mozilla 1.7
    (SLES 9 and Linux Professional 9.2), or Netscape 7.02 or later

    - Novell eDirectory 8.7.1 or later


    iMonitor 2.1 runs on the following platforms:


    +   - NetWare 5.1 Support Pack 4 or later

    - Novell iMonitor is placed in autoexec.ncf.

    - Windows NT, 2000, and 2003 Server (No SSL)

    - Linux

    - Solaris


