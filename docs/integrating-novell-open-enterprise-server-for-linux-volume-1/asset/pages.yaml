- img_proc: true
  md: '# Install the Server Consolidation and Migration Toolkit


    The Novell Server Consolidation and Migration Toolkit is located on NetWare 6.5
    CD 1 (Operating System) or on Open Enterprise NetWare OS CD in the productsMigration\Utilities
    directory. The self-extracting file is named scmt.exe.


    You can also install the version on the CD through the Consolidate or Migrate
    Servers option in the Novell Deployment Manager utility.


    The latest version of the toolkit can be downloaded from the Novell Downloads
    page (http://www.novell.com/download). You should use the latest version whenever
    possible.


    To install the Server Consolidation and Migration Toolkit on the workstation,
    do the following:


    +   1. Obtain the self-extracting file from the NetWare operating system CD or
    from the Novell downloads site and copy it to your workstation.


    +   2. Double-click the scmt.exe file to launch the installer; then select Next
    to proceed.


    +   3. (Conditional) If you see a prompt indicating you don''t have the correct
    version of the Novell Client software installed, use the prompt''s link to download
    and install the Novell Client software and restart the toolkit installation.


    +   4. (Conditional) If you are prompted to remove an earlier version of either
    NetWare Migration Wizard or Server Consolidation Utility, answer Yes; then select
    Next > Uninstall > Done.


    +   5. Accept the license agreement; then select Next.


    +   6. Read the Readme file; then select Next.


    +   7. Specify where you want to install the toolkit; select Next.

    By default, the toolkit is installed in c:\program files\novell server consolidation
    and migration toolkit.


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_390_0.png)'
  merge: -1
  pgno: 390
- img_proc: true
  md: '# Integrating Novell Enterprise Server for Linux


    +   8. Specify whether you want to create desktop and quick launch icons; select
    Next.


    +   9. Verify your installation information; select Install.


    +   10. You must reboot the workstation to complete the installation. reboot when
    the installer exits, select Yes.


    # Launch the Server Consolidation Utility and Create a Project File


    The Server Consolidation Utility is a Windows program that is launched from the
    Server Consolidation and Migration Toolkit.


    +   1. If you have not already done so, start the Server Consolidation and Migration
    Toolkit.


    By default, the toolkit is installed in c:\program files\novell server consolidation
    and migration toolkit. You can access it by selecting the following:


    Start > Programs > Novell Server Consolidation and Migration Toolkit > Novell
    Server Consolidation and Migration Toolkit


    +   2. Read the Welcome page; then select Create or Open Project.


    +   3. Select NetWare or Open Enterprise Server (eDirectory); then select Next.


    +   4. Select Consolidate and Copy Data and Printing Between Servers; then select
    Next.


    +   5. Read the About screen; then select OK.


    +   6. Do one of the following:


    +   To start a new consolidation project, select Create a New Project > OK.


    +   Continue with Step 7.


    +   To open an existing project, select Open an Existing Project > OK, select
    the project you want to work on; select Open.'
  merge: -1
  pgno: 391
- img_proc: true
  md: 'Skip to “Model Your Consolidation Project” on 5-72.


    +   To open the last project you worked on, select **Open Last Project > OK.**


    Skip to “Model Your Consolidation Project” on 5-72.

    The Server Consolidation Utility uses a project (.mdb) file to record your intended
    actions. The actions are recorded so you can execute them now or save the project
    file and execute the actions later.


    +   7. Type a **project filename** in the field provided.


    The filename can be up to 64 characters long and can include any character except
    \ ? < > !. The project name also serves as the project''s folder name, so you
    might want to keep it short.


    The project folder stores the log files and other files associated with the project.


    +   8. (Conditional) If you want to store the project file in a location other
    than the default location, select **Browse** and navigate to the desired location;
    then select **OK.**


    +   9. Select **Next** to continue to the next screen and begin the next phase
    of the consolidation project to select a source and destination tree.


    # Select a Source and Destination Tree


    After you create a project file, you need to select your source and destination
    trees. To do this, you must be logged in to the trees that you will be working
    in.


    +   1. Select the source and destination eDirectory tree from the drop-down list
    or select **Login** to browse to a tree that is not in the drop-down list.


    Only trees that you are currently logged in are available on the drop-down list.


    Log in by doing the following:


    +   a. In the Novell Login dialog box, select **Trees.**'
  merge: -1
  pgno: 392
- img_proc: true
  md: '+   b. Browse to each desired tree and log in with the correct **username**
    and **password**.


    If you do not know the tree name, in the Server field of the Login dialog box,
    enter the **IP address or DNS name** of the server that you will be consolidating
    to or from.


    If you are performing a consolidation to an Nterprise Branch appliance, the Admin
    user''s context is always appusers.


    +   c. Select **OK.**


    +   2. **Select Next.**


    +   3. **Select Create** to finish creating the project file.


    The Project Window appears. From here you begin the next phase, which is modeling
    your consolidation project.


    # Model Your Consolidation Project


    The Project Window is where you select which volumes and directories to copy and
    Which Printer to move.


    > You use the Server Consolidation Utility to migrate printers from NetWare to
    Linux in Section 7 of this course.'
  merge: -1
  pgno: 393
- img_proc: true
  md: 'The Project Window is divided into two panes that show the trees that you are
    working in, in the following:


    Figure 5-14


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_394_0.png)


    From the Project Window you drag objects from the left pane and drop them into
    the right pane. You select volumes and directories to copy to different servers
    (and Printer Agents) to move different Print Managers.


    You can also create new eDirectory containers or system folders by right-clicking
    on an existing container or folder and selecting New Container or New Folder from
    the pop-up menu.


    Creating containers and folders by dragging and dropping objects in the Project
    Window does not immediately perform the action. It creates (models) a preview
    of where the files and objects will reside. The actions are completed only after
    the verification process is complete and the copy process begins.'
  merge: -1
  pgno: 394
- img_proc: true
  md: '# Volume Drop Options


    When you drag and drop volumes into the right pane of the Project Window, a Volume
    Drop Options dialog box displays. You must choose to either migrate the volume
    contents into the directory or volume that you selected or create a new directory
    with the name of the volume that is being moved.


    +   1. Select the radio button next to the option you want.

    2. Select OK.


    # Duplicate Folder Options


    If you drag and drop a folder onto a destination folder of the same name, a Duplicate
    Folder Options dialog box displays. You have several options:


    +   * **Don''t Copy the Directory.** The directory on the source server is not
    copied and the directory on the destination server is not replaced.

    * **Merge Directory Contents.** The contents of the source directory are merged
    into the destination directory with the same name.

    * **Rename.** The directory on the source server is copied to the destination
    server with a new name assigned to it. You must enter a new name in the field
    provided if you select this option.

    * **Merge All.** If you are dragging and dropping multiple directories at once,
    select this option if you want to merge the contents for all duplicate directories.


    Do the following:


    +   1. Select the radio button next to the option you want.

    2. Select OK.'
  merge: -1
  pgno: 395
- img_proc: true
  md: '# Other Project Window Options


    In addition to dragging and dropping objects, you can perform several other tasks
    from the Project Window menu:


    +   - Save project settings: Select File > Save As.


    +   - Move created and dropped objects around dragging them to the desired location.


    +   - Create a new container or folder: Select the parent container or existing
    folder in the right pane; then select Edit > New Folder.


    +   - Cancel a “dropped” action: Select the volume or directory in the right pane;
    then select Edit > Back Out.


    +   - Rename a newly created container or folder: Select the parent container
    or existing folder in the right pane; then select Edit > Rename.


    +   - Show where a folder or object went: Select the object in the left pane;
    then select Edit > Where Did It Go. The directory or volume that was moved is
    highlighted in its new location in the right pane.


    +   - Show where a folder or object came: Select the object in the right pane;
    then select Edit > Where Did It Come From. The directory or volume that it came
    is highlighted in the left pane.


    +   - Show all folders or objects selected for copying: Select a container in
    the left pane; then select Edit > Show Dropped Folders (or Show Dropped Printers).


    > The previous six tasks can also be performed by right-clicking the object to
    see the same menu options.


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_396_0.png)


    +   - View the available disk space before performing the verification by right-clicking
    the destination volume in the right pane of the Project Window and then selecting
    Properties.'
  merge: -1
  pgno: 396
- img_proc: true
  md: 'Right-clicking the source folder or volume in the left pane of the Project
    Window and then selecting Properties displays the size of the source object.


    After you have modeled your consolidation project, you are ready to move on and
    perform pre-copy verifications.


    # Perform Pre-Copy Verifications


    After you have completed the modeling tasks necessary for your consolidation project,
    proceed by selecting Project > Verify and Copy Data from the menu or by selecting
    Do the Consolidation from the button bar.


    The pre-copy verification phase includes the following:


    +   * Verification Initialization

    * Duplicate File Resolution

    * Synchronize Files and Folders

    * File Comparison

    * File Date Filters

    * Ex File Extensions

    * Check for Trustees and Ownership

    * Password Verification

    * Check for Sufficient Disk Space and Disable Login

    * Verification Wizard

    * (If necessary) Resolve Pre-Copy Verification Errors


    # Verification Initialization


    Do the following:


    +   1. When the Verification Wizard dialog box is displayed, select Next to begin
    the verification process.'
  merge: -1
  pgno: 397
- img_proc: true
  md: '+   2. The Dropped Folders dialog box appears, showing the source path and
    destination path for the dropped folders. Do one of the following:


    +   - If the source and destination paths are correct, select Next.


    +   - If the source or destination path is incorrect, select Cancel and make the
    appropriate changes in the Project window.


    +   3. (Conditional) If you created new folders in the right pane of the Project
    window as part of your consolidation project, the Created Folders dialog appears.


    Do one of the following:


    +   - If the destination path of the created folders is correct, select Next.


    +   - If the destination path is not correct, select Cancel and make the appropriate
    changes in the Project window.


    +   4. (Conditional) If you are moving NDPS printers as part of your consolidation
    project, the Dropped Printers dialog box appears.


    Do one of the following:


    +   - If the destination locations of the printers are correct, select Next.


    +   - If the destination locations are not correct, select Cancel and make the
    appropriate changes in the Project window.


    # Duplicate File Resolution


    If a file is found on the destination volume or directory that has the same name
    as a file copied from the source, you must decide what to do.


    You have the following options to choose from in the Duplicate File Resolution
    dialog box:


    +   - Don''t copy over existing files


    The file on the source server is not copied and the file on the destination server
    is not replaced.


    +   - Copy the source file if it is newer (Default)'
  merge: -1
  pgno: 398
- img_proc: true
  md: 'If the file on the source server is newer than the one on the destination server,
    the file on the destination server is replaced.


    +   - Always copy the source file


    The file on the source server always replaces the file with the same name on the
    destination server.


    +   1. Select the radio button next to the option you want.

    2. Select Next.


    # Synchronize Files and Folders


    In the Synchronize Files and Folders dialog box, you have the option to delete
    files and folders on the destination server that do not exist on the source server.
    Selecting Yes deletes all files and folders on the destination server that are
    not on the source server. No is the default selection.


    +   1. Select the radio button next to the option you want.

    2. Select Next.


    > Do not use this option in projects that involve consolidating data from separate
    volumes or folders on the source server into a single volume or folder on the
    destination server.


    When the synchronization check compares the copied data to what exists in the
    first volume or folder, it will delete everything that was copied from the second.


    The same process occurs when comparing the copied data for the second volume or
    folder, and you end up with no copied data remaining in the destination volume
    or folder.


    # File Comparison


    In the File Comparison dialog box, you have the option to compare files and folders
    between the source and destination servers after the copy process completes.'
  merge: -1
  pgno: 399
- img_proc: true
  md: 'Selecting Yes compares the following information between the source and destination
    files and folders:


    +   * Names

    * Dates

    * Sizes

    * Attributes

    * Trustees

    * Owners


    The File Comparison component of the Pre-Copy Verification phase includes the
    following steps:


    +   1. (Conditional) If you do not want to compare source and destination files
    after the copy process, select No; then select Next.

    Skip to the File Date Filters component of the Pre-Copy Verification phase.

    2. (Conditional) If you do not want to compare source and destination files after
    the copy process, select Yes.

    You can also choose to perform a binary (byte-by-byte) comparison of the files
    after the copy process finishes. This option gives the greatest assurance that
    two files are identical, but it takes longer to complete.

    To perform a binary comparison of the files that were copied, select Binary (byte-by-byte)
    comparison; then select Next.

    3. (Conditional) If errors are returned about files having different Rename (Ri)
    and Delete (Di) attributes after the comparison, you can disable the comparison
    of these attributes by deselect Compare Ri/Di attributes on read-only files.

    These errors arise because the Novell Client version 4.9x does not automatically
    set the Di or Ri attributes when copying Read-only files, but the Server Consolidation
    Utility.'
  merge: -1
  pgno: 400
- img_proc: true
  md: 'If you have copied Read-only files to the source server using the Novell Client,
    they are marked Read-only, but the Di and Ri attributes are not set by the Client.


    If you use the Server Consolidation Utility to copy these files to another server,
    the utility sets the Di and Ri attributes of all Read-only files on the destination
    server, as it should.


    # 4. Select Next.


    You should not enable file comparison when copying files from NetWare OES Linux
    servers. Many differences exist between the file and folder attributes supported
    on NetWare and those supported on Linux. Because of these differences, you see
    a large number of errors in a file comparison.


    # File Date Filters


    In the File Date Filters dialog box, you have the option to copy files based on
    dates and three separate attributes:


    +   - Accessed

    - Modified

    - Created


    If you select No, all files are copied. You can specify as many criteria as you
    need for the file copy, and only those files that meet all of the selected criteria
    are copied.


    Two dates can be set for each attribute:


    +   - The On or Before date. For example, if you select only On or Before and
    set the date for November 10, 2000, for the Accessed attribute, only those files
    accessed on or before November 10, 2000, are copied.'
  merge: -1
  pgno: 401
- img_proc: true
  md: '+   The On or After date. If, for example, after setting the On or Before date
    to November 10, 2000, you also specify an On or After date of October 1, 2000,
    only those files accessed on or after October 1, 2000, and on or before November
    10, 2000, copied.


    Do the following:


    +   (Conditional) If you do not want to filter files based on dates, select No.


    +   (Conditional) If you want to filter based on dates, select Yes; then select
    the desired combination of file types and dates to copied.


    To change the date from the default provided, check the box next to the desired
    date. Next, highlight with your mouse the portion of the date you want to change.
    Either type a new value using the keyboard number pad, or use the down-arrows
    provided to the immediate right of the date field.


    +   Select Next.


    # Excluded File Extensions


    In the Excluded File Extensions dialog box, you have the option to exclude specific
    file types or file names from the copy process. Wildcards are permitted.


    The two most commonly used wildcards


    +   The question mark (?). This wildcard is used to represent a single alphanumeric
    character in a search expression.


    For example, typing te?.txt would exclude tent.txt, test.txt, and text.txt from
    the copy process.


    +   The asterisk (*). This wildcard is used to specify zero or more alphanumeric
    characters in a search expression.


    For example, typing h*.txt would exclude house.txt, his.txt, and happiness.txt
    from the copy process.'
  merge: -1
  pgno: 402
- img_proc: true
  md: "Do the following:\n\n+   1. Type the file extension types or filenames in the\
    \ field provided. For multiple filenames or types, press Enter between each entry.\n\
    \nFor example, if you want to exclude a specific file name txt.txt from being\
    \ copied, test test.txt in the field provided. If you want to exclude all *.mp3\
    \ files from being copied, type *.mp3 in the field provided.\n\nType as many filenames\
    \ or file extension types as you want. Separate the filenames or file extensions\
    \ by pressing Enter between each entry. Do not use spaces or commas to separate\
    \ the entries. See the following examples:\n    * Entries correctly separated\
    \ by pressing Enter:\n        * *.mp3\n        test.txt\n        * *.wav\n   \
    \ * Entries incorrectly separated by spaces or commas:\n        * *.mp3 test.txt\
    \ *.wav\n        * *.mp3, test.txt, *.wav\n2. Select Next.\n\n# Check for Trustees\
    \ and Ownership\n\nIf you are performing a consolidation between servers in the\
    \ same eDirectory tree, files and folders are checked for trustees and ownership\
    \ by default the Check for Trustees and Ownership dialog box is not displayed.\n\
    \nSkip to the Verify Password component of the Pre-Copy Verification phase.\n\n\
    When you copy data from one tree to another, the Server Consolidation Utility\
    \ searches the destination tree for objects whose names match the source tree\
    \ object names.\n\nObjects that are potential matches are displayed and can be\
    \ matched up during Tree-to-Tree Object Match."
  merge: -1
  pgno: 403
- img_proc: true
  md: 'If the Check for Trustees and Ownerships option is enabled, the Server Consolidation
    Utility scans the dropped folders and subordinate folders for trustees and owners.
    This check must be performed the first time a consolidation is run.


    If a consolidation is run a second time, this scan does not need to be repeated,
    as long as trustees have not been added to the source server and new directories
    or folders have not been dropped onto the destination server; otherwise, another
    scan is necessary.


    Checking for trustees and ownerships slows down the verification process.


    If a file has already been copied to the destination server or tree, that file''s
    trustees are not updated during the consolidation unless the source file data
    is recopied.


    > See “Duplicate File Resolution” on 5-77 for information about when a source
    file might overwrite the destination file.


    Do the following:


    +   1. **Select Browse** to specify the destination container you want to search.


    +   2. **Select All Subordinate Containers** to search the specified container
    and all subordinate containers in the destination tree.


    If you don''t select this option, the utility searches only the selected destination
    container.


    For better performance, limit the search to the container that you believe the
    object resides in. Searching from [root] takes significantly longer, depending
    on the size of the destination tree.


    +   3. **Select Next.**'
  merge: -1
  pgno: 404
- img_proc: true
  md: 'If you are consolidating data to an Nterprise Branch Office appliance, you
    cannot specify the container you want to search. Select Yes or No; then select
    Next.


    # Password Verification


    The Server Consolidation Utility uses SMS as the backup and copy engine. SMS requires
    that the servers involved in the consolidation be authenticated to each other.


    Do the following:


    +   1. In the Password Verification dialog box, enter the passwords for the source
    and destination trees in the fields provided.


    +   2. Select Next.


    # Check for Sufficient Disk Space and Disable Login


    Before beginning the data consolidation, you can verify that the destination volumes
    have enough space to accommodate the data that will be moved. Verifying disk space
    can be a long process if you have many files to copy.


    You can also disable login on the source server before copying file data. Users
    already logged in to the source server are not logged out, but no new logins are
    allowed until the consolidation is completed.


    If you disable login and the workstation running crashes for any reason during
    the consolidation, you might have to manually re-enable login at the source console.


    Do the following:


    +   1. To verify the available space on the destination volumes, select Check
    for Sufficient Disk Space.


    +   2. To have the utility disable login on the source server prior to copying
    data, select Disable Login.


    +   3. Select Next.'
  merge: -1
  pgno: 405
- img_proc: true
  md: 'After you complete this component, the Verification Wizard screen appears.


    # Verification Wizard


    Do the following:


    +   1. When the Verification Wizard screen appears, select Next to begin the pre-copy
    verification.

    2. (Conditional) During the verification process, you might see a message informing
    you that an updated tafs.nlm or smdr.nlm must be copied for the consolidation
    to. Continue the project verification by selecting Yes. Select No to stop the
    verification.


    # Resolve Pre-Copy Verification Errors


    If errors are discovered in the verification attempt, they are shown in the Error
    Resolution dialog box. Errors could include name conflicts, insufficient rights,
    required spaces not loaded, and insufficient disk space. Errors found during the
    verification process are classified as follows:


    +   - Critical errors must be resolved before files can be copied.

    - Warnings should be resolved but might not affect the copy process.


    A description of the error and a possible resolution appears in the Information
    text box. If no resolution is provided, you can find more information in the Novell
    Error Code online documentation. (Search the system by error number.)


    In addition to critical errors and warnings, the Error Resolution dialog box may
    display informational text classified as follows:


    +   - Information about the decisions you made in the Project Window.


    After resolving any errors that exist, select Next.'
  merge: -1
  pgno: 406
- img_proc: true
  md: '# Integrating Open Enterprise Server for Linux


    If you are migrating NSS volumes from one tree to another, the Tree-to-Tree Object
    Match Up dialog box appears.


    If you are migrating data from NSS volumes on one server to NSS volumes on another
    server in the same tree, the Start Novell Server Consolidation Utility dialog
    box appears.


    # Additional Steps for Tree-to-Tree Consolidations


    If you are moving objects from one tree to another, the Tree-to-Tree Object Match
    Up dialog box appears. If you are not moving objects between trees, skip to “Run
    the Consolidation” on 5-86.


    In Exercise 5-3 “Migrate the DATA Volume from the DA2 NetWare Server to the DA1
    Linux Server” on 5-23, you do not perform a tree-to-tree migration. Instead, you
    migrate data from server within the same tree.


    For complete details on tree-to-tree migrations, see “Additional Steps for Tree-to-Tree
    Consolidations” on p. 50 of the Novell Server Consolidation and Migration Toolkit
    (scmtl.pdf).


    This guide is available at http://www.novell.com/documentation/oes or the OES_Docs
    directory on your 3077 Course CD.


    # Run the Consolidation


    After resolving pre-copy verification errors, the Start Novell Server Consolidation
    Utility dialog box appears. Copy your files by selecting Proceed.


    During the copy process, new folders and objects are created, files are copied,
    and Printer Agents are moved to their destination (as specified in the right pane
    of the Project Window).'
  merge: -1
  pgno: 407
- img_proc: true
  md: 'When the copy process is complete, a Process Finished screen appears. This
    screen lets you


    +   - View the error log.

    - View the success log.

    - Close the Process Finished screen.


    You can also view the error and success logs of any completed project from the
    Project Log by opening the project file and selecting **View > Error Log** or
    **View > Success Log**, or by selecting the corresponding button on the button
    bar.


    If you interrupt the copy process before it is completed, all objects, directories,
    and files already copied to the destination server will remain there unless you
