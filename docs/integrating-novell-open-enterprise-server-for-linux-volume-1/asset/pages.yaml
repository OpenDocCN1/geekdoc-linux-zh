- img_proc: true
  md: '# Integrating Novell Open Enterprise Server for Linux


    For example, in the following, root changes ownership of the file hello.txt from
    geeko to the user newbie:


    ```

    earth:/tmp # ls -la hello.txt

    -rw-r--r-- 1 geeko users 0 2004-04-06 12:43 hello.txt\earth:/tmp # chown newbie.users
    hello.txt

    earth:/tmp # ls -la hello.txt

    -rw-r--r-- 1 newbie users 0 2004-04-06 12:43 hello.txt\earth:/tmp #

    ```


    To change only the owner (and not the group), use the following:


    ```

    chown new_user_file

    ```


    To change the group (and not the user), use the following:


    ```

    chown new_group_file

    ```


    For example, the following command is used to limit access to the file list.txt
    to members of the group advanced:


    ```

    earth:/tmp # ls -la list.txt

    -rw-r--r-- 1 geeko users 0 2004-04-06 12:43 list.txt\earth:/tmp # chown .advanced
    list.txt\earth:/tmp # ls -la list.txt

    -rw-r--r-- 1 geeko advanced 0 2004-04-06 12:43 list.txt

    earth:/tmp #

    ```


    Although the group has changed, the owner permissions remain the same (the owner
    and root can still access the file).


    As user root, you can also change the group affiliation of a file with the command
    chgrp using the following syntax:


    ```

    chgrp new_group_file

    ```


    A normal user can only use the command chown to change his or file to a new group,
    as in the following:


    ```

    chown new_group_file

    ```


