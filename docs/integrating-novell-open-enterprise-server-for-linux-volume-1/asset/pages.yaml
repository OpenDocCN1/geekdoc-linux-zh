    # How to View the HTTP Logs


    The NRM Configuration Options page contains a link for all the HTTPSTK–related
    messages contained in the /var/log/messages file.


    This information is valuable for seeing information such as who logged in through
    NRM, when they logged in, the pages being viewed, and log failures.


    You can view the last 100 entries of the log or the entire log by doing the following:


    +   1. Select the Configure icon at the top of the NRM page.

    2. Under the HTTP Logs heading, select View Last 100 Log Entries or View Entire
    Log.


    The logging to this file is controlled by the Syslog options. To change these
    options from the default, edit the /etc/sysconfig/syslog file.


