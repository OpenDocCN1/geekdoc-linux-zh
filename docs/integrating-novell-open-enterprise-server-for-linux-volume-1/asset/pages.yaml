- img_proc: true
  md: '# Integrating Novell Enterprise Server for Linux


    You should have a current data and trustee backup of the source servers, even
    though the source data is not modified during a data consolidation project. The
    only time data is changed when you are consolidating printers.


    +   5. For NetWare/eDirectory consolidations, load the latest Storage Management
    Data Requestor (smdr.nlm) and Target Service Agent (tsafs.nlm) modules on your
    source and destination NetWare servers.


    To load the SMS modules provided with the NetWare operating system software, enter
    load smdr and load tsafs at the server command prompt.


    +   6. If you are consolidating data to OES Linux servers, load the modules on
    Linux by entering these commands at the shell prompt:


    ```

    /etc/init.d/novell-smdrd start

    /opt/novell/sms/bin/smsconfig -l tsafs

    ```


    +   7. Depending on how you have up service discovery on your network, you might
