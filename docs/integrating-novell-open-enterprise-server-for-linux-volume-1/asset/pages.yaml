    man(1) Manual pager utils man(1)


    NAME

    man an interface to the on-line reference manuals


    SYNOPSIS

    man [-c|-w][-tT device] [-adhu7V] [-m system[...]] [-L

    locale] [-p string] [-M path] [-P pager] [-r prompt] [-S

