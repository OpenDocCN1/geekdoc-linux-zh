  md: '# Evaluate User Restrictions and Linux User Management


    If you plan to use Linux User Management, you need to understand the security
    implications before you accept the default PAM-enabled service settings.


    Seasoned NetWare administrators are accustomed to being able to set various user
    access restrictions, including the following:


    +   - Account balance restrictions

    - Address restrictions

    - Intruder lockout

    - Login restrictions

    - Password restrictions

    - Time restrictions


    Many of the management interfaces that set these restrictions (iManager, for example),
    might seem to imply that these restrictions apply to users who are accessing an
    OES server using any protocol.


    This is generally true, with two important exceptions:


    +   - Maximum number of concurrent connections in login restrictions

    - Address restrictions


    These two specific restrictions are enforced only for users that are accessing
    the server using NCP.


    Connections through other access protocols (for example, HTTP or CIFS) have no
    concurrent connection or address restrictions imposed.


    For this reason, you will probably want to consider not enabling services as ssh
    and ftp for PAM access when setting up Linux User Management.


    For more information on Linux User Management, see “Configure eDirectory Users
    to Access an OES Linux Server” on page 5-20.'
  merge: -1
