    |8 System administration commands |


    For example, entering the following displays general information about the command
    more:


    man 1 more


    Entering the following displays information about the configuration file for the
    command cronab (which also has the name cronab):


    man 5 cronab


    If you enter the man command without a section number (such as man more), the
    section 1 manual pages are displayed by default.


    You can scroll through the pages using the Spacebar (one screen forward at a time)
