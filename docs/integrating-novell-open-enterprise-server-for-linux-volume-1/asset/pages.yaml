    # Verify Rights for Upgrading to OES NetWare


    To upgrade the first NetWare 6.0 or earlier server in an eDirectory tree to OES
    NetWare, you must have the Supervisor right at [Root] of the eDirectory tree (normally
    the Admin user).


    If you are upgrading the first NetWare server in an existing NDS/eDirectory tree
    to OES NetWare, be sure to run Deployment Manager first to prepare the tree so
    it is compatible with the version of eDirectory that comes with OES NetWare.


    This requires access to a server with a Read/Write replica of the Root partition.


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_96_1.png)


    If you already have NetWare 6.5 installed, you do not need to run Deployment Manager.


    For security reasons, you might want to create one or more subcontainer with sufficient
    rights to install or upgrade additional OES NetWare servers, without granting
    full rights to the entire tree.


