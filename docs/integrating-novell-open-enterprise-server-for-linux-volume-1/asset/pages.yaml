- img_proc: true
  md: '# Objective 1 Describe the Purpose of Novell Samba


    The following topics provide a brief introduction to the Novell Samba implementation:


    +   - Samba, SMB, and CIFS

    - Samba Roles for Novell OES Servers


    # Samba, SMB, and CIFS


    Samba in Novell OES is a file access service that lets you use the Server Message
    Block (SMB) networking protocol with Linux computers and other platforms.


    The first iteration of the SMB protocol was developed by IBM in the 1980s. An
    SMB implementation was developed for network file and print access in the UNIX
    operating system in the early 1990s.


    The SMB protocol was later adopted and deployed as the Common Internet File System
    (CIFS) by Microsoft for use in Windows 95 and NT. CIFS is currently the foundation
    of networked file and print access in the Windows operating system.


    Novell OES fully supports the Samba file access protocol. By default, NSS volumes
    hosted by an OES NetWare server can be accessed from a Samba client. OES Linux
    servers natively support both Samba server and Samba client functionality.


    # Samba Roles for Novell OES Servers


    Samba lets Novell OES servers function in the following roles:


    +   - OES Linux as a File Server for Windows Clients. Because Microsoft’s CIFS
    protocol and Samba are both based on SMB, they are highly compatible. A Samba
    share on a Linux server looks the same to a Windows client as a CIFS share on
    a Windows server.'
  merge: -1
  pgno: 416
- img_proc: true
  md: 'Any CIFS/-SMB-compatible client can attach to a Samba share on an OES Linux
    server.


    +   * **OES Linux as a Windows Client.** A Samba client on a Linux desktop attaches
    natively to Windows file and print services. No special configuration is necessary.


    The Samba client does not know whether the CIFS/-SMB-based services originate
    from a Windows server or a Linux server.


    +   * **OES NetWare as a File Server for CIFS/-SMB-clients.** NSS volumes on OES
    NetWare servers are configured as CIFS shares and support the SMB protocol by
    default.


    This means that eDirectory users with the correct file system rights can access
    an NSS volume from a Windows or a Linux desktop using any CIFS/-SMB-compatible
    client.


    For details on Novell Samba, see “Novell Samba” on page 214 of the Novell Open
    Enterprise Server: Planning and Implementation Guide (implgde.pdf).


    You can access the guide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 Course CD.


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_417_0.png)'
