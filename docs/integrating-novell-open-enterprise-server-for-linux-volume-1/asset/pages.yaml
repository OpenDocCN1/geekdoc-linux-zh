    The NetWare Install program detects the installed license during the upgrade and
    prompts you to either use the current license or install a new license.


    # Start an In-Place Server Upgrade


    While there are several methods of performing an upgrade to OES NetWare, in this
    course we introduce you to the in-place upgrade method.


    When you perform an in-place upgrade to OES NetWare, both the operating system
    and eDirectory are upgraded. In addition, only the NetWare products or components
    that are currently installed are upgraded.


    Other Novell products that you might have purchased or installed separately (for
    example, GroupWise® or ZENWorks) are not upgraded.


    Additionally, the Enterprise server is migrated to the Apache 2 Web server when
    you upgrade to OES NetWare. During the upgrade, the existence of the Enterprise
    server is verified and, if it exists, information in the Enterprise server''s
    config files is migrated to the Apache 2 server''s config files.


    After the Apache 2 Web server is installed, the Enterprise server is automatically
    removed.


    If you are performing an upgrade, several components are already selected. These
    are the components currently installed on the server.'
  merge: -1
  pgno: 102
