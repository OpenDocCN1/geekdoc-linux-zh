    ![](img/1dca8e8a8784dadffa032dcfe0460e55_80_0.png)


    For detailed installation instructions, see “Installing OES NetWare” on page 27
    in the *OES NetWare Installation Guide*(install_nw.pdf).


    # Use Predefined Server Types (Patterns) When Possible


    Both OES platforms include predefined server installation options that install
    only the components required to provide a specific set of network services.


    In the OES Linux install, these installation options are called *server types*;
    in the OES NetWare install, these installation options are called *patterns*.


    For example, if you want to install an OES server that supports a Web-based, user-configurable
    collaboration environment, you should select the Virtual Office server server
    type during the OES installation.


    You should always choose a predefined server type if one fits the intended purpose
    of your server. If not, you can choose to install a customized OES server with
    the service components you need.'
