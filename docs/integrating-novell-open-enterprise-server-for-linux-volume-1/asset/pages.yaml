  md: '# Objective 6 Configure Novell Storage Services


    Before you install and configure Novell Storage Service (NSS) on your OES Linux
    or OES NetWare server, make sure you are familiar with the following:


    +   * What NSS Is

    * NSS Benefits

    * NSS Pools and Volumes

    * Comparison of NSS on NetWare and NSS on Linux

    * NSS and EVMS on OES Linux

    * How to Install NSS on an OES Linux Server

    * How to Use the NSSMU Management Utility in OES Linux

    * How to Assign File System Rights for NSS Volumes on OES Linux


    # What NSS Is


    Novell OES provides Novell Storage Services™ (NSS) File Services for both Linux
    and NetWare® kernels. Its many features and capabilities include


    +   * Visibility

    * Trustee access control model

    * Multiple simultaneous name space support

    * Native Unicode

    * User and directory quotas

    * Rich file attributes

    * Multiple data stream support

    * Event file lists

    * A file salvage subsystem'
  merge: -1
  pgno: 365
- img_proc: true
  md: 'These features can help you effectively manage your shared file storage for
    any size organization, scaling management of the system for even organizations
    with hundreds of thousands of employees.


    NSS volumes are cross compatible between kernels. You can mount an NSS data volume
    on either kernel—Linux or NetWare—and move it between them.


    In a clustered SAN with Novell Cluster Services, volumes can fail over between
    kernels, allowing for full data and file system feature preservation when migrating
    data to Linux.


    You can manage all storage management functions in the Web-based Novell iManager
    utility. NSS also supports third-party tools on both kernels for advanced data
    protection and management, virus scanning, and traditional archive and backup
    solutions.


    # NSS Benefits


    Files are at the heart of every company, large or small. You cannot afford unreliable
    file service, especially when the files you manage are continuously growing and
    requiring more and more storage space.


    In addition, your business requirements today demand more space and faster easier
    access to data. To meet the demands, you need a file system that can scale to
    a growing business, is easily maintained, and is better protected against corruption.


    NSS provides the following benefits on Linux and NetWare for a robust and reliable
    file system solution:


    +   - A journaling file system that lets you create bigger volumes that activate
    (mount) quicker, store more data, and resist corruption better than non-journaling
    file systems

    - Encrypted volume support to meet the legal standard of making data inaccessible
    to software that circumvents normal access control, as if the media were stolen

    - An unlimited number of NSS volumes'
  merge: -1
  pgno: 366
- img_proc: true
  md: '+   - Software RAID 0 (striping), RAID 1 (mirroring), RAID 5 (striping), RAID
    10 (mirroring RAID 0 devices), and RAID 15 (mirroring RAID 5 devices)


    +   - Multiple server activation prevention (MSAP) to help protect pools from
    being concurrently activated by multiple servers that do not share a cluster relationship


    +   - An NSS volume in a pool of storage that spans multiple storage devices


    +   - Up to 4 billion (10E9) files in a single directory


    +   - Faster access to data, regardless of file size or volume size


    +   - Lower memory requirements: 1 MB of RAM can activate an NSS volume


    +   - Directory space restrictions


    +   - User space restrictions


    +   - Salvage support for deleted volumes and files


    NSS provides the following additional benefits on NetWare:


    +   - Multiple I/O path support


    +   - Pool snapshots that capture point-in-time versions of files in the pool


    +   - Transaction Tracking System™ (TTS™)


    +   - Mountable media and image files activated as NSS volumes


    +   - Novell Distributed File Services (NDFS) that let you move and split volumes
    to better manage storage growth


    +   - Novell Archive and Version Services that let you archive interval-based
    versions of user files and make them available to users for individual retrieval'
  merge: -1
  pgno: 367
- img_proc: true
  md: 'For details, see the Novell Archive and Version Services 2.0 for NetWare Administration
    Guide (arc_admin.pdf).


    You can access the guide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 Course CD.


    # NSS Pools and Volumes


    NSS is a 64-bit file system that can manage a virtually unlimited number of file
    objects. On each physical storage device, NSS abstracts up to four physical NetWare
    partitions to make them appear as contiguous free space.


    To understand how physical storage space is managed by NSS, you need to know about


    +   - NSS Storage Pools

    - NSS Volumes


    # NSS Storage Pools


    NSS recognizes physical and logical devices up to 2 TB in size. You can create
    any number of virtual storage resources, called *pools*, on these devices.


    You can choose space from at least four logical devices up to 2 TB to create a
    pool with a maximum pool size of 8 TB. A pool can contain any number of volumes,
    depending on the pool size where the minimum volume size is 10 MB.


    If the pool spans devices using space from them for the pool, the volumes automatically
    span the devices. A single volume can contain up to 8 trillion files and grow
    to 8 TB in size, depending on the size of the pool and space consumed by other
    volumes in the pool.'
  merge: -1
  pgno: 368
- img_proc: true
  md: 'You can create additional storage pools by assigning areas of free space obtained
    from one or more of a server''s storage devices. You can create one or more NSS
    volumes from the space in the storage pool.


    The following illustrates how NSS uses free space on multiple devices to create
    a storage pool:


    # Figure 5-11


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_369_0.png)


    During the NetWare installation, NSS automatically creates a system pool (sys)
    and an NSS volume (sys:) that can grow to the size of the pool.


    We recommend that you reserve the system pool and volume for operating system
    software and extensions. Create additional pools to effectively store applications,
    files, and databases.


    # NSS Volumes


    The logical volumes you create on NSS storage pools are called NSS volumes.


    You can specify a maximum storage quota for the volume, or allow the volume to
    grow dynamically to the size of its pool. You can add any number of volumes to
    a storage pool.'
  merge: -1
  pgno: 369
- img_proc: true
  md: 'Because there is no limit to the number of volumes you can create, it is possible
    that the combined administrative size of all the volumes taken together is larger
    than the physical size of the storage pool itself. NSS refers to this process
    as “overbooking.”


    If you overbook space in the pool, the individual administrative size of a volume
    cannot exceed the size of the storage pool.


    NSS allocates space from the pools to the volumes only as needed. Typically, user
    consumption of a volume''s available space ebbs and flows; it is unlikely that
    users concurrently consume volumes at 100% of their available capacity. Each volume
    consumes the space it needs as it needs it.


    By overbooking space, NSS provides a flexible and cost-effective way to accommodate
    expanding storage needs.


    For example, suppose you have a 300 GB storage pool. From this storage pool, you
    create two NSS volumes of 200 GB.


    You can define two 200 GB NSS volumes out of a pool of only 300 GB, if you feel
    comfortable that the NSS volumes will not both exceed 75 percent capacity (150
    GB) and, therefore, exceed the overall size of the storage pool.


    If one NSS volume does reach 150 GB, but the other volume stays under 100 GB,
    your overbooking plan worked.


    Suppose you expect that one of the volumes might exceed its share of the pool.
    You can overbook the pool by creating one NSS volume with a quota of 200 GB and
    a second NSS volume that can grow to the size of the pool.


    As the combined size nears the size of the pool, you can extend the size of the
    pool to allow more space for the larger, expanding volume.


    Your overbooking plan works because you built in the opportunity to expand the
    pool and volume, according to your business needs.'
  merge: -1
  pgno: 370
