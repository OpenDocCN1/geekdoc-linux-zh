  md: '# Which OES Platform Is Best for My Services?


    You have already seen that there are differences in the way OES provides services
    on SUSE Linux Enterprise Server (SLES) 9 and NetWare 6.5.


    To help you assess which OES platform can best meet your network service needs,
    you should consider the following:


    +   - Platform Strengths

    - Service Differences on the OES Platforms


    # Platform Strengths


    Although both OES platforms provide a full set of network services, there are
    differences in the NetWare and Linux platforms:


    | Table 1-2 | OES NetWare | OES Linux |

    |---|---|---|

    | Brief description | Novell''s network-optimized operating system | Novell''s
    application operating system |

    | Industry-recognized strengths | - Reliability

    - Scalability

