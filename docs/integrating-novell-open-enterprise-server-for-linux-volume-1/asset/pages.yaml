    +   * **ConsoleOne.** The NDS password tab in ConsoleOne run on a NetWare 6.5
    server, or on a Windows workstation with the Novell Client for Windows NT/2000/XP
    version 4.9 or the Novell Client for Windows 95/98 version 3.4 installed, automatically
