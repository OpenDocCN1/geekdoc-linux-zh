  md: '# Exercise 6-1 Access CIFS Shares on the DA2 NetWare Server


    You are now ready to test the CIFS protocol for creating and accessing CIFS shares
    on your DA2 NetWare server.


    In the first part of this exercise, you lay the groundwork for providing CIFS
    access by performing steps that serve two purposes.


    +   - The first purpose for performing the steps in the first few parts of this
    exercise is to configure Samba and Linux User Management so users can access Samba
    shares on an OES Linux server.

    - However, you do not access Samba shares on an OES Linux server in this exercise,
    but will do so in Exercise 6-2.

    - The second purpose for performing the steps in the first few parts of this exercise
    is to add a password to your tree that allows you to enable Universal Password
    for your users.


    The Samba Default Password Policy gets added to your tree when you install Novell
    Samba on an OES Linux tree.


    The Samba Default Password Policy contains a Universal Password configuration
    option that you use to allow your users to access CIFS shares on the OES NetWare
    server.


    > The Default Password Policy is not the only way to provide the Universal Password
    configuration option. You can create password policies through the Password Policy
    Wizard in iManager that enable all Universal Password.


    The last part of this exercise allows you to verify that your configuration is
    working properly by accessing CIFS shares from a Windows Workstation and from
    a SUSE Linux Enterprise Desktop (SLED) 10 workstation.


    Exercise 6-1 Access CIFS Shares on the DA2 NetWare Server is in your Integrating
    Novell Open Enterprise Server for Linux Workbook on page 6-2.


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_447_0.png)'
  merge: -1
  pgno: 447
- img_proc: true
  md: '# Access Samba Shares on the DA1 Linux Server


    In Exercise 6-1, you completed many of the steps required for providing your users
    with access to Samba shares on an OES Linux server, including the following:


    +   - Installing Novell Samba on you OES Linux server

    - Enabling your users for LUM and Samba

    - Configuring a password policy that enables Universal Password

    - Making sure your users have Universal Passwords set


    With these components in place, you are now ready to create Samba shares on your
    DA1 Linux server and access those shares from your Windows and SLED 10 workstations.


    Exercise 6-2 Access Samba Shares on the DA1 Linux Server is in your Integrating
    Novell Open Enterprise Server for Linux Workbook on page 6-12.'
