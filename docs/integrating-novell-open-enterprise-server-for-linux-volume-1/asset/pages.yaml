    Novell OES:


    +   - Plan for eDirectory

    - Prepare Your Existing eDirectory Tree for Each Server

    - Identify a Purpose for Each Server

    - Evaluate Server Requirements

    - Evaluate User Restrictions and Linux User Management

    - Consider Coexistence and Migration Before You Start

    - Review Your Installation Options Before Start

    - How to Get OES Through Upgrade Protection


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_66_0.png)


    For details on installing and upgrading to Novell OES, see “Installing OES” on
    page 55 “Upgrading to OES” on page 61 in the Novell OES SP2 Planning and Implementation
    Guide (implpgde.pdf).


