  md: 'The directory/file path name is based on the NSS volume''s mount point in the
    OES Linux file structure, not on the name of the NSS volume.


    For example, if you create an ifolderdata NSS volume and mount it at /var/nss/ifolder
    /var/nss/ifolder is the directory path you would use with rights commands'' -f
    option.


    The USERNAME variable represents the fully distinguished name of the user, group,
    or container that you want to assign as an NSS trustee.


    The right page also shows the convention you must use to indicate which rights
    you want to assign with the -r option. These are shown in the following:


    # Figure 5-13


    +   USERNAME

    The username is the name of an eDirectory object including the tree name

    nThe mask is a string of characters with each character representing a type of
    rights:

    ns Supervisor

    r Read

    w Write

    c Create

    ce Erase

    n Modify

    f File scan

    a Access control

    none No rights

    all All rights


    For example, if you have an ifolderdata NSS volume mounted at /var/nss/ifolder
    and you user KThorn to be a trustee with read, write, create, erase, modify, and
    file scan system rights to the root of the ifolderdata NSS volume, you would enter
    the following:


    ```

    rights -f /var/nss/ifolder -r rwcemf trustee kthorn.slc.da.da-tree

    ```'
