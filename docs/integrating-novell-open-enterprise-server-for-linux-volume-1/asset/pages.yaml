  md: "# Introduction\n\nThe Integrating Novell Open Enterprise for Linux course (3077)\
    \ helps you learn how to implement infrastructure services (such as DNS and DHCP)\
    \ and Novell Open Enterprise Server (OES) services (such as iPrint and iFolder)\
    \ on an OES Linux by migrating data and services from an existing Novell NetWare\
    \ 6.5 server, or by installing the services directly on the OES Linux server.\n\
    \nBefore starting the course, make sure you review the following:\n\n+   - Student\
    \ Kit Deliverables\n- Course Design\n    - Course Objectives\n    - Course Audience\n\
    \    - Prerequisite Knowledge\n    - Novell Open Enterprise Server Training Path\n\
    \    - Classroom Agenda\n    - Course Setup\n- Exercise Guidelines\n    - VMware\
    \ and the Exercises\n    - Exercise Conventions\n    - Self-Study Setup\n    -\
    \ Novell Open Enterprise Server Product Documentation\n    - Web Browser Tools\
    \ and Applications\n    - Scenario\n- Course Feedback"
  merge: -1
