- img_proc: true
  md: '# Objective 3


    # Configure eDirectory Users to Access an OES Linux Server


    Just as users and groups on NetWare servers are managed through eDirectory, users
    and groups on Linux servers are managed according to the POSIX (Portable Operating
    System Interface) standard.


    Because Novell OES provides services running on both Linux and NetWare, Novell
    has developed a technology that lets eDirectory users also function as POSIX users
    on Linux servers.


    This technology is called Linux User Management or LUM.


    To configure eDirectory users to access an OES server through LUM, you need to
    know the following:


    +   - LUM Fundamentals

    - How to Implement LUM

    - How to Enable eDirectory Users for Linux Access


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_341_0.png)


    For complete information on Linux User Management, see the Novell OES Linux User
    Management Technology Guide (lumadgd.pdf).

    nYou can access the guide from http://www.novell.com/documentation/oes from the
    OES_Docs directory on your 3077 Course CD.


    # LUM Fundamentals


    The following helps you understand when LUM is required so that your network services
    are accessible and work as expected:


    +   - LUM Overview

    - How LUM Services Control Access

    - Local or Remote Users

    - OES Linux Services that Require LUM-Enabled Access'
  merge: -1
  pgno: 341
- img_proc: true
  md: '+   - Services that Have Some LUM Requirements

    - LUM Access Is Not Global Access to OES Linux


    # LUM Overview


    Users in a Linux environment are defined and managed according to the POSIX (Portable
    Operating System Interface UnixX) standard.


    POSIX dictates that all users of a particular Linux server have standard attributes,
    such as user name, user ID (UID), primary group ID (GID), and password.


    Novell Linux User Management (LUM) lets you eDirectory centrally manage remote
    users for access to one or more OES Linux servers.


    In other words, LUM lets eDirectory users function as local (POSIX) users on an
    OES Linux server.


    Access is enabled by leveraging the Linux Pluggable Authentication Module (PAM)
    architecture. PAM makes it possible for eDirectory users to authenticate with
    the OES Linux server through LDAP.


    In OES, the terms LUM-enabling and Linux-enabling are both used to describe the
    process that adds standard Linux (POSIX) attributes and values to eDirectory users
    and groups, enabling them to function as POSIX users and groups on the server.'
  merge: -1
  pgno: 342
- img_proc: true
  md: '# How LUM Services Control Access


    The following illustrates how the LUM services in OES control access to the OES
    server:


    # ### Figure 5-5  Valid POSIX Users Authentication Services in OES control


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_343_0.png)


    The following describes the illustrated authentication process:


    +   **Valid POSIX users.** Some services on OES Linux servers may be accessed
    by POSIX users.


    eDirectory users can function as POSIX users if they are enabled for Linux access.


    +   **Authentication.** When the system receives an action request, it can authenticate
    both local POSIX users and users who have been enabled for Linux access.


    +   **Services.** Users can potentially access PAM-enabled services, Samba shares,
    and Novell Remote Manager as either local or eDirectory users.


    The passwd command is not enabled for eDirectory access because eDirectory passwords
    are maintained in eDirectory, not on the local server.'
  merge: -1
  pgno: 343
- img_proc: true
  md: 'Linux requires that all users be defined using standard POSIX attributes, such
    as user name, user ID (UID), primary group ID (GID), password, and other similar
    attributes.


    # Local or Remote Users


    Users that access a Linux server can be created


    +   **Locally (on the server).** Local users are managed at a shell prompt using
    commands such as useradd(8) man page) or YaST. These local users are stored in
    the /etc/passwd file (the passwd(5) man page).


    * **Remotely (off the server).** Remote users can be managed by other systems,
    such as LDAP-compliant directory services.


    Remote user access is enabled through the PAM architecture on Linux.


    Linux POSIX-compliant interfaces can authenticate both kinds of users, independent
    of where they are stored and how they are managed.


    # OES Linux Services that Require LUM-Enabled Access


    Some services on an OES Linux server require that eDirectory be enabled to access
    the services. These include the following:


    +   **Core Linux utilities enabled for LUM.** These are the core utilities and
    other shell commands that you have specified during the OES installation to be
    enabled for authentication through eDirectory LDAP.


    In Linux these are known as PAM-enabled utilities.'
  merge: -1
  pgno: 344
- img_proc: true
  md: "# The following lists the core utilities available for LUM enablement:\n\n\
    # Table 5-2\n\n| Command | Where Executed | Task |\n|---|---|---|\n| ftp | Another\
    \ host | Transfer files to and from the OES server which, in this case, is a remote\
    \ host. |\n| login | - OES server | Log to the OES server, either directly or\
    \ in an SSH session with the server.\n>- SSH session with OES server |\n passwd\
    \ | - OES server | Change the POSIX password.\n>- SSH session with OES server\
    \ |\n| rlogin | Another host | Log in to the OES server which, in this case, is\
    \ a remote host. |\n| rsh | Another host | Execute a command on the OES server\
    \ which, in this case, is a remote host. |\n| ssh | Another host | Establish a\
    \ secure encrypted connection with the OES server which, in this case, is a remote\
    \ host. |\n| su | - OES server | Temporarily become another user.\n>- SSH session\
    \ with OES server |\n\n**Novell Samba (SMB/CIFS) shares on the server.** Windows\
    \ workgroup users who need access to Samba shares defined on the server must be\
    \ Linux-enabled eDirectory users who are configured to access the server because\
    \ Samba requires POSIX identification for access."
  merge: -1
  pgno: 345
- img_proc: true
  md: 'By extension, NetStorage users who need access to SMB/CIFS Storage Location
    Objects that point to the server, must also be LUM-enabled eDirectory users with
    access to the server.


    +   - Novell Remote Manager (NRM) on Linux. You can access NRM as


    +   - The root user with rights to see everything on the Linux server


    +   - A local Linux user with access governed by POSIX rights.


    +   - A LUM-enabled eDirectory user, such as the Admin user created during the
    installation.


    # Services that Have Some LUM Requirements


    Services that do not require eDirectory users to be Linux enabled for service
    access but do some LUM requirements, include the following:


    +   - QuickFinder, Novell iFolder 2.1x, and other Web services. If only local
    users access these Web services, Linux enabling doesn''t apply because the users
    are not remote eDirectory users.


    +   - NCP server. The NCP server that has been ported to Linux remains tightly
    integrated with eDirectory and does not require eDirectory users to be Linux enabled.


    However, when NCP volumes are created that point to partitions other than NSS
    on the server, not all features are available if the user is not Linux enabled.


    For example, cross-protocol access is not possible if the user is not Linux enabled.


    +   - NSS. eDirectory users that access NSS volumes directly using NCP (the Novell
    Client) are not required to be Linux enabled.


    However, if any other file access protocol is used to access NSS through the virtual
    file system that makes NSS appear to be a POSIX-compliant file system, the users
    must be LUM enabled.'
  merge: -1
  pgno: 346
- img_proc: true
  md: '# Integrating Novell Enterprise Server for Linux


    Although the above services do not require Linux-enabled access, the services
    themselves run as POSIX-compliant system users who function on behalf of the end
    users that are accessing the service.


    If the services must access NSS volumes, the system users must be Linux enabled
    because only eDirectory users can access NSS volumes.


    # LUM Access Is Not Global Access to OES Linux


    As you plan to Linux-enable users for access to these services, in mind that each
    OES Linux server that Linux-enabled users need to access must be associated with
    a Linux-enabled group that the users belong to.


    In other words, it is not sufficient to Linux-enable users for access to a single
    OES Linux server if they need access to multiple servers.


    An association between the Linux-enabled group that the users belong to and the
    eDirectory UNIX Workstation object associated with the server must be configured
    using iManager for each server to which users need access.


