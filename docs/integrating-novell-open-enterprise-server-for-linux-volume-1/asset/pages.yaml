- img_proc: true
  md: '# Introduction


    As a network engineer, providing access to network file systems is one of your
    top priorities. With NetWare servers, access from Windows clients to NetWare servers
    is accomplished primarily through the Novell Client Protocol (NCP).


    With Novell OES and Linux servers and workstations, you have have other scenarios
    to consider in addition to the Windows client/NetWare server scenario.


    For example, you will probably have to consider a Windows client accessing files
    on an OES Linux server. You might also have to provide for file system access
    from Linux clients to either OES NetWare or OES Linux servers.


    Linux servers and workstations also provide file access protocols that you might
    not have worked with in the past. Or, if you have worked with them, Novell OES
    provides file access deployment options that you didn''t have before.


    In this section, you learn how to configure and deploy file access using CIFS/Samba.'
  merge: -1
