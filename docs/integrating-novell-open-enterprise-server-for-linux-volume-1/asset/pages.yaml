- img_proc: true
  md: '# Objective 1


    # Manage an OES Linux Server from the KDE Desktop


    One of the most used graphical desktop environments in Linux is KDE. This desktop
    environment is installed by default during the installation of OES Linux.


    To use the KDE desktop to manage Novell OES servers effectively in this course
    (and in a production environment), you need to know the following:


    +   - What the root User Is

    - How to Log In

    - How to Log Out

    - How to Shut Down and Reboot the Linux System

    - How to Identify KDE Desktop Components

    - How to Use the Konqueror File Manager


    # What the root User Is


    As you perform certain tasks in the KDE Desktop, and many system and network related
    tasks throughout this course, you are required to authenticate as *root*. This
    is the name of the superuser, the administrator of the system.


    Unlike regular users, which may or not have permission to do certain things on
    the system, root has unlimited power to do anything: change the system configuration,
    install programs, and set new hardware.


    If users forget their passwords or have other problems with the system, root can
    help. The root account should only be used for system administration, maintenance,
    and repair.


    Routinely logging in as root for tasks *not* related to system administration,
    maintenance, and repair is very risky: a single mistake can lead to irrerievable
    loss of many system files.'
  merge: -1
  pgno: 118
