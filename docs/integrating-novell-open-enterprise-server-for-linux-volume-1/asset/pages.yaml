    After opening the virtual machine, a tab (such as DA1-LINUX) appears in the VMware
    Workstation window. Make sure the tab is selected; then, under the Commands heading,
    select Start this virtual machine.


    +   - NetWare and VMware Player. When you use the down command in NetWare to shut
    down the NetWare operating system, you might be left at a DOS prompt with the
    VMware Player window still open.


    At this point, you need to select Player > Exit from the top of the VMware Player
    window to close the DA2-NETWARE virtual server window.


    The next time you start the DA2-NETWARE virtual server, VMware Player takes a
    moment to load the server, and you are returned to the DOS prompt to start the
    DA2-NETWARE server by entering server.


    +   - Server shutdown in VMware Player. When running a virtual machine from VMware
    Player, you can select Player > Exit at any time, and VMware will save the current
    state of the virtual machine in a special file.


    The next time you start the virtual machine, VMware restores the previous state
    of the server.


    For example, if you exit with a server desktop displayed, the next time you start
    the virtual machine, you are returned to the server desktop (without booting the
    server).


    While this feature has been used during our beta test of the exercises (with success),
    after starting the VMware virtual machine, you might need to wait a few minutes
    after the virtual machine is restored before all services are running.


