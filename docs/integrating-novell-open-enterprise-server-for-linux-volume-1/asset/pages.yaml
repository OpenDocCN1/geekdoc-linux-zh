  md: '# Objective 2 Configure a DHCP Server on Novell OES Linux


    Both a DHCP server and DHCP clients are available for OES Linux. The DHCP service
    is dhcpd (published by the Internet Software Consortium, the same source for named).


    The core of any DHCP system is the dynamic host configuration protocol daemon.
    This services leases addresses and watches how they are used, according to the
    settings defined in the configuration file /etc/dhcpcd.conf.


    By changing the parameters and values in this file, you can influence the program''s
    behavior in numerous ways.


    In OES Linux, you can configure the DHCP service in YaST or you can manually edit
    the necessary configuration files.


    To use DHCP on OES Linux, you need to know the following:


