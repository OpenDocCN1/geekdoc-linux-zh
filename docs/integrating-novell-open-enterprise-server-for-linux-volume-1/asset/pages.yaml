  md: '# File System Mount Points


    A directory must exist at the point where you intend to mount the file system.
    This directory is referred to as the mount point. The complete directory structure
    of the mounted file system can be found beneath this directory.


    For example, the / (root) directory is the mount point for the primary file system
    on a Linux server.


    Other file systems such as other hard drive partitions, directories from other
    computers via the network, or removable media (floppy disks, CD-ROMs, removable
    hard drives) can be mounted to the / (root) file system at any point.


    This accomplishes the same purpose as mapping drives on a Windows server or workstation.


    However, on a Linux server or workstation, you do not need to map drives to access
    other file systems. You simply mount the file system at a specified directory
    (the mount point).


    This makes it much easier to manage file systems from the same file system tree
    hierarchy.


    In most cases, only the user root can mount and unmount directories. Removable
    media, such as floppy disks and CDs, can be changed by a normal user.


    To understand the basics of mounting file systems, you need to know the following:


    +   - How to Mount a File System

    - Mount Points for Removable Media (/media/*)

    - Mount Point for Temporarily Mounted File Systems (/mnt/)

    - Configuration Files for Mounting'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# How to Mount a File System


    To mount a file system, you enter the command mount, specifying the device file
    and the directory to which the file system should be mounted.


    A file system can be removed again with the command unmount. The file /etc/mtab,
    which is updated by the command mount, shows which file systems are currently
    mounted.


    You can mount file systems in directories that are occupied. The existing contents
    of these directories, however, will no longer be accessible.


    After the file system is removed, this data becomes available again. This feature
    lets you share certain directories with many computers, and is often used for
    the home directories of users, which are located centrally on one machine and
    exported to other computers in the network.


    # Mount Points for Removable Media (/media/*)


    SUSE Linux creates directories such as the following in the directory /media/
    (depending on your hardware) for removable media:


    +   -media/cdrom/. Created for mounting CD-ROMs.

    - /media/cdrecorder/. Created for mounting CDs in a CD burner.

    - /media/dvd/. Created for mounting DVDs.

    - /media/floppy/. Created for mounting floppy disks.


    # Mount Point for Temporarily Mounted File Systems (/mnt/)


    The standard directory for integrating file systems is /mnt/. It should only be
    used for temporary purposes. For permanent mounts, you should create an appropriately
    named directory.'
  merge: -1
  pgno: 184
- img_proc: true
  md: 'In the following example, the hard drive partition /dev/hda7 is mounted at
    the position /mnt/ in the directory tree using the command mount:


    ```

    dla0:~ # mount /dev/hda7 /mnt

    ```


    All files on this partition can now be reached via the directory /mnt/. To remove
    this partition again, you use the command mount:


    ```

    dla0:~ # ummount /mnt

    ```


    If do not include any options with the command mount, the program tries out several
    file system formats. If you want to specify a specific file system, use the option
    -t.


    If the file system is not supported by the kernel, the command is aborted, and
    you receive an error message. In this case, you must compile a new kernel that
    supports the file system format.


    # Configuration Files for Mounting


    The file systems and their mount points in the directory tree are configured in
    the file /etc/fstab. This file contains 1 line with 6 fields for each mounted
    system.


    The lines look similar to the following:


    | Field 1 | Field 2 | Field 3 | Field 4 | Field 5 | Field 6 |

    |---|---|---|---|---|--|

    | /dev/hda2 / | reiserfs | acl,user_xattr | 1 | 1 |

    | /dev/hdal swap | swap | pri=42 | 0 | 0 |

    | devpts /dev/pts | devpts | mode=0620,gid=5 | 0 | 0 |

    | proc /proc | | defaults | 0 | 0 |

    | usbfs /proc/bus/usb | usbfs | noaut | | 0 | 0 |

    | sysfs /sys | sysfs | noaut | | 0 | 0 |

    | /dev/cdrom /media/cdrom | subfs | fs=cddfs,ro,procuid,nosid,nodev,exec, |

    | /dev/fd0 /media/floppy | subfs | fs=floppyfs,procuid,procuid,nodev,nosid,sync
    |'
  merge: -1
  pgno: 185
- img_proc: true
  md: "Each field provides the following information for mounting the file system:\n\
    \n+   - **Field 1.** The name of the device file.\n- **Field 2.** The mount point—the\
    \ directory to which the file system should be mounted. The directory specified\
    \ here must already exist.\n- **Field 3.** The file system type (such as ext2\
    \ or reersfs).\n- **Field 4.** The mount options. Multiple mount options are separated\
    \ by commas (such as fs=cdffs,producid,nousid).\n\nFor example, the options **ro**\
    \ and **nodev** for (/dev/cdrom) mean the drive is read only (**ro**) and that\
    \ device files on the CD are not interpreted as such by the file system (nodev).\n\
    \n+   - **Field 5.** Indicates whether the backup utility dump for the file system.\
    \ **0** means no backup.\n- **Field 6.** Indicates the sequence of the file system\
    \ checks (with the *fck* utility) when the system is booted:\n  - 0: file systems\
    \ that are not to be checked\n  - 1: the root directory\n  - 2: all other modifiable\
    \ file systems\n\nWhile /etc/fstab lists the file systems and their mount points\
    \ in the directory tree, the /etc/mtab file lists the file systems currently mounted\
    \ and their mount points.\n\nThe mount and ummount commands modify the /etc/mtab\
    \ file and affect the state of mounted file systems.\n\nThe kernel also keeps\
    \ information for /proc/mounts, which lists all currently mounted partitions.\n\
    \nFor troubleshooting purposes, if there is a conflict between /proc/mounts and\
    \ /etc/mtab information, the /proc/mount data is always more current and reliable\
    \ than /etc/mtab."
  merge: -1
  pgno: 186
- img_proc: true
  md: '# User Directories (/home/)


    Every user on a Linux system has his own area in which to create files and remove
    them. This area is called the home directory of the user. When a user logs in,
    he is in his own home directory.


    Individual configuration files can be found in the user''s home directory. These
    configuration files are hidden files, because they are normally not displayed
    by the command ls. All these files names begin with a dot.


    The following are the most important files in a user''s home directory:


    | File | Description |

    |---|---|

    | .profile | Private login script of the user |

    | .bash_history | Configuration file for Bash |

    | .bashrc | List of commands previously run in Bash |


    If there are no special settings, the home directories of all users are located
    beneath the directory /home/. The home directory of a user can also be addressed
    via the short cut ''~", so ~/bashrc refers to the file .bashrc in the user''s
    home directory.


    In many cases, the directory /home/ is located on a different partition or can
    even be located on a different computer (with central administration of home directories).


    # Filename Restrictions


    A filename in Linux can be up to 255 characters long. It can contain any number
    of special characters (for example, "_" or "%%").


    Certain special characters (the dollar sign "$\$, the semicolon ":", or the space,
    for example) have a specific meaning. If you want to use one of these characters
    without the associated special meaning, the character must be preceded by a "\"
    (backslash) so its meaning is masked (switched off).'
  merge: -1
  pgno: 187
- img_proc: true
  md: 'Umlauts, letters with diacritical marks, or other country-specific characters
    can be used. Using them, however, can lead to problems when exchanging data with
    people in other countries using other settings if these characters are not present
    on their keyboards.


    Linux differentiates between uppercase and lowercase letters. For example, Invoice,
    invoice, and INVOICE identify three different files.


    # Linux File System Permissions


    When using OES Linux servers for network file storage and file system access,
    the configuration of local permissions often comes into play.


    Before you configure and test file system access through the Novell OES Linux
    file access protocols provided by eDirectory, you must be familiar with the basics
    of how to manage traditional (POSIX) Linux file and directory permissions.


    To set permissions for files and directories, you need to know the following:


    +   - Permissions and Permission Values

    - How to Set Permissions from the Command Line

    - How to Set Permissions from a GUI Interface


    # Permissions and Permission Values


    You can assign the following three permissions to a file or directory:


    +   - **Read (r).** This permission allows the file to be read or the contents
    of a directory to be listed.

    - **Write (w).** This permission allows a file to be modified. It allows files
    to be created or deleted within a directory.

    - **Execute (x).** This permission allows a file to be executed. It allows access
    to a directory.'
  merge: -1
  pgno: 188
- img_proc: true
