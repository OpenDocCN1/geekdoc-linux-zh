  md: '# Why Upgrade to Novell OES


    When considering an upgrade to Novell OES, you might have questions such as the
    following:


    +   - How can we maintain the same level of service our NetWare services provide
    today?

    - How can we get more out of Linux if our internal Linux skills are lacking?

    - How can we move to Linux without disrupting our end users?

    - How can we move to Linux without overhauling your IT department?


    Keep in mind that you can


    +   - Add Linux to your environment in a non-disruptive way

    - Maximize hardware investments without replacing software

    - Reinvigorate your IT staff and attract new IT talent

    - Protect your NetWare investment by gaining access to new applications on Linux


    In addition, deploying Novell OES enables you to do the following:


    +   - Extend the Use of Novell Networking Services

    - Add Linux from a Trusted Vendor

    - Lower Management Costs via Coexistence

    - Reduce the Number of Supported Operating Systems


    For additional information, see the Upgrading Your Business to Novell Enterprise
    Server upgrade guide (upgrade_guide.pdf).


    You can access the guide from http://www.novell.com/collateral/4821012/4821012.pdf
    or from the OES_Docs directory on your 3077 Course CD.


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_42_0.png)'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# Extend the Use of Novell Networking Services


    Investing in NetWare has always meant more reliability with fewer support issues,
    support for open standards, more performance from less hardware, upgrades that
    can be added at your convenience, and fair licensing practices so you retain ownership
    of what you buy.


    Features like iFolder, iPrint, NSS, and clustering are only a few of the services
    that have convinced many to choose NetWare as their server platform.


    Novell OES extends the life of your NetWare installations and lets you get the
    most out of your investment. You can use OES to introduce Linux and new services
    into your networking without having to rip-and-replace.


    # Add Linux from a Trusted Vendor


    A benefit of Novell OES for NetWare customers is the opportunity to add an enterprise-class
    Linux operating system that provides value for any workload.


    The Linux platform is continuously being improved by an entire community of open
    source developers. Linux is secure, not prone to hacking and viruses, and runs
    efficiently on commodity hardware.


    Application and hardware support for Linux is always growing. Hardware vendors
    like Dell, Hewlett-Packard, and IBM have made commitments to support the growth
    of Linux in the enterprise.


    Application support allows Linux to moderate what has been viewed as a deficiency
    in NetWare. Leading commercial software vendors are now supporting Linux as a
    standard operating system.


    The Novell Linux operating system provides robust, uniform Linux that can be used
    for several enterprise workloads, including Web infrastructure, networking, high-performance
    computing, and application hosting.'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'And trusted services and support from Novell are available on Novell Linux
    to make sure your Novell OES investment is sound, profitable decision.


    Novell provides OES support for companies of all sizes. This support is provided
    through training and certification, consulting, continuing education, 24x7x365
    technical support, hardware and software partnerships, engineering expertise,
    and a worldwide channel of solution partners.


    # Lower Management Costs via Coexistence


    Novell OES helps you to manage a mixed environment support for multiple scripting
    languages.


    Most IT developers write shell or perl scripts to perform actions against a large
    number of heterogeneous platforms. Novell OES makes it possible to write BASH
    or Perl scripts that can be used on either the NetWare or Linux platforms.


    This reduces the number of scripts to be written and lets you see the mixed environment
    as a more homogeneous network.


    In addition, tools such as EDirectory, NSS, and iManager, managing Linux servers
    as easy and familiar as managing NetWare. You can run your existing services in
    parallel on both platforms without having to migrate abruptly.


    With Novell OES, you can introduce Linux and the services you already know on
    NetWare at your own pace and on your own terms.


    Novell OES also lets you leverage your existing NetWare skills and expand the
    capabilities of your IT staff by attracting professionals with UNIX and Linux
    expertise.'
  merge: -1
  pgno: 44
- img_proc: true
  md: '# Reduce the Number of Supported Operating Systems


    Many NetWare customers run a mix of platforms—including Microsoft Windows NT—in
    their environments. These customers are at a crossroads. As of 2005, Microsoft
    no longer offers non-security hot-fixes or technical support for Windows NT.


    If your organization still uses Windows NT today, IDC estimates that there are
    still more than 2 million installed NT 4 servers. IDC also estimates that 17 percent
    of all Windows servers in use at the end of 2004 are still NT 4.


    Moving to the newer Windows Server 2003 platform requires purchasing new hardware
    and new software licenses and making investments in expensive employee retraining.
    Gartner estimates that it costs an average of $279 per user to migrate from NT
    4 to Windows 2000.


    With Windows Vista on the horizon, cost-conscious IT executives must make a platform
    investment decision: commit to a long-term investment in Windows or benefit from
    the flexibility and cost savings of Linux and open source.


    Novell OES offers an alternative by extending the benefits of Linux to meet your
    most pressing IT infrastructure and application needs.


    Novell OES enables you to avoid Windows security problems.


    And Novell OES is highly interoperable with Windows servers and clients, making
    it easy to migrate from Windows NT to Linux, without the disruptive rip-and-replace
    approach.


    For example, Novell OES supports Windows clients using built-in protocols. It
    also integrates alongside existing Windows NT*/2000 Servers as well as Active
    Directory.


    Plus, with Novell OES, you can lower your overall staffing costs by consolidating
    IT skills across other areas of your business where Linux is deployed.'
  merge: -1
  pgno: 45
