  md: '# Objective 5


    # Provide File Access with NCP Server


    Novell Client for Windows is the long-standing software solution for providing
    NCP-based access to NetWare data from Windows workstations.


    The Novell Client extends the capabilities of Windows desktops to access the full
    range of Novell services, such as authentication to eDirectory, network browsing
    and service resolution, and secure file system access.


    It supports traditional Novell protocols as NCP, RSA, and NDAP, and it interoperates
    with open protocols such as LDAP.


    The Novell Client for Linux provides these same services for Linux workstations.
    Novell Client for Linux is expected to become available as a no-cost download
    after the release of OES.


    Because NCP is now available on OES Linux, Novell Client users can attach to OES
    Linux servers as easily as they have been able to attach to NetWare servers.


    The NCP Server for Linux enables support for login script, drive mapping to OES
    Linux servers, and other services commonly associated with Novell Client access.


    In this objective, you learn the following about the NCP services included in
    Novell OES:


    +   * Purpose of NCP

    * How to Install and Configure NetWare NCP Server

    * How to Install and Configure Linux NCP Server


    > Transaction Tracking and Opportunistic Locking are not supported in the initial
    release of Novell OES.'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# Purpose of NCP


    With Novell OES, the NetWare Core Protocol (NCP) supports many

    of the network services on OES NetWare and OES Linux servers.


    Windows users can use the Novell Client to access data, manage files and folders,
    and map drives on OES Linux servers the same way they do on NetWare servers.


    The following illustrates the basics of NCP file services:


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_359_0.png)


    # How to Install and Configure NetWare NCP Server


    After installing an OES NetWare server, eDirectory users on workstations with
    the Novell Client can access all the directories and files to which you have granted
