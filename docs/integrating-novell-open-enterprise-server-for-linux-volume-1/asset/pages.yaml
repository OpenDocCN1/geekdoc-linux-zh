- img_proc: true
  md: '# Evaluate and Upgrade to Novell Open Enterprise Server


    The minimum amount of available space is 200 MB, so a server with 1024 MB RAM
    has an optimal boot partition of 1224 MB (1024 MB + 200 MB = 1224 MB).


    This size lets you do a core dump to the disk drive if required.


    One way to determine how much free space is available on the server''s boot (DOS)
    partition is to mount the partition as an NSS volume. You can do this by loading
    the dosfat.nss module.


    After you load the dosfat.nss module, any DOS FAT partitions on the server''s
    hard drive are dynamically made available as NSS volumes. You can then use the
    nss space command to view how much space is used and available.


    The volume name displayed by the nss space or volumes command is dosfat_x, where
    x is the drive letter, for example dosfat_c.


    +   - 4 GB of available, unpartitioned disk space outside the boot partition for
    volume SYS


    +   - One or more network boards


    +   - A bootable CD drive that supports the El Torito specification


    +   - A USB or PS/2 mouse


