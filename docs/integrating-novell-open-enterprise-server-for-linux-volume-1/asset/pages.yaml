    file on the destination server, and vice versa.


    # Create and Run a Consolidation Project


    Before you create and run a consolidation project, you should be familiar with
    the following consolidation project phases:


    +   - Install the Server Consolidation and Migration Toolkit

    - Launch the Server Consolidation Utility and Create a Project File

    - Select a Source and Destination Tree

    - Model Your Consolidation Project

    - Perform Pre-Copy Verifications

    - Additional Steps for Tree-to-Tree Consolidations

    - Run the Consolidation'
