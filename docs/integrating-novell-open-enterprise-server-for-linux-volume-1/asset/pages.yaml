  md: '# Adding Novell OES Services to OES Linux


    You can add Novell OES services to an OES Linux server after installation using
    YaST. However, do not use the Add/Remove Software option in the YaST Control Center
    to add OES services.


    To install additional OES products, select the Network Services option from the
    YaST Control Center, and then select the option specific to the service you want
    to add.


    For example, if you want to add NetStorage as a service on an O Linux server,
    the option to use is in **Network Services > NetStorage**, as shown in the following:


    Figure 2-13


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_135_0.png)


    This option not only installs all required packages, but it also lets you configure
    the service.'
  merge: -1
