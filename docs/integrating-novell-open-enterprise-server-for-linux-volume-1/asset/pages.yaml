  md: '# Objective 7 Migrate NSS Volumes Using the Server Consolidation Utility


    Novell OES with Support Pack 2 provides an NSS volume migration tool in the Server
    Consolidation Utility. Before beginning an NSS volume migration, you should review
    the following:


    +   - Meet System and Software Requirements

    - Understand NetWare-to-Linux Data Migration Issues

    - Prepare the Source and Destination Servers

    - Create and Run a Consolidation Project


    # Meet System and Software Requirements


    Linux destination servers must be installed and running Open Enterprise Server
    with the following components enabled:


    +   - Novell eDirectory

    - Novell NCP Server for Linux

    - Novell Storage Services (NSS), if copying data from NetWare source servers

    - Novell Storage Management Services (SMS)

    - Novell Linux User Management (LUM)


    If you are copying data from NetWare source servers, one or more NSS volumes must
    be created and configured on the Linux destination server. These are the only
    volumes where you can drop folders in the Server Consolidation Utility project
    window.'
