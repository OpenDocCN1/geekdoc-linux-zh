  md: '# Understand NetWare-to-Linux Data Migration Issues


    Before using the Server Consolidation Utility to copy data from NetWare servers
    to OES Linux servers, you should be aware of the following issues:


    +   - Open Files Cannot Be Copied. The Server Consolidation Utility cannot copy
    files that are open and currently in use.


    There is one exception to this rule. NSS has a feature called Copy on Write. This
    permits a file that is being changed to be accessed in the same state as it was
    when it was last closed by all processes.


    This feature is enabled on an NSS volume either by using ConsoleOne or by entering
    the following at the source console:


    ```

    nss /filecopywrite=volname

    ```


    For example, nss /filecopywrite=vol1 would enable File Copy on Write for the vol1:
    volume. The effect is immediate, but it affects only files that are currently
    closed and opened later.


    +   - Cluster Failover Stops File Copy. If you run a server consolidation project
    involving a NetWare cluster and the cluster fails over during the consolidation,
    the file copy will stop. The consolidation project must be run again.


    +   - Use of SMS to Copy Data. The Server Consolidation Utility uses Storage Management
    Services (SMS) as its file copy engine to copy data from NetWare servers to OES
    Linux servers.


    Using SMS preserves as many of the NetWare trustee rights and file/directory attributes
    as possible.


    +   - New attrib Command for OES Linux. If you copy files from a NetWare source
    server that have the Delete attribute set, the files cannot be deleted from the
    destination NSS volume on an OES Linux server using the standard Linux or Windows
    utilities.'
  merge: -1
  pgno: 384
- img_proc: true
  md: 'Novell has provided a new attrib command for OES Linux that lets you remove
    the Delete Inhibit attribute, as well as set or modify other supported NetWare
    attributes on Linux. For more information, enter attrib -h to view the online
    help.


    +   - Creation Dates Change from NetWare to Linux. After copying files from a
    NetWare source server to an OES Linux destination server, the creation dates for
    those files change to today''s date rather than the date the files were originally
    created.


    Linux doesn''t provide a Creation Date field for file systems, but NCP server
    displays the current date.


    +   - Migrating Macintosh Files from NetWare to Linux. If the Server Consolidation
    Utility encounters files with Macintosh resource forks (supported in early versions
    of NCP), the resource forks are not copied to the Linux server.


    However, if you use Macintosh-based backup/restore tools that use AppleTalking
    Protocol (AFP) when migrating Macintosh files to a Linux server, you won''t lose
    any of the Macintosh-specific metadata.


    +   - NFS Space Required when Copying Data from a Traditional File System (TFS)
    on NetWare to Linux. You can transfer data from a traditional NetWare file system
    (non-NSS) volume on NetWare to an NSS volume on OES Linux.


    Transferring data from TFS requires that you first install NFS name space support
    on the traditional NetWare volume.


    Without the NFS name space loaded, the Server Consolidation Utility file copy
    fails and displays an error message indicating there is not enough disk space.


    +   - Disable Server Consolidation Utility File and Folder Comparison. Novell
    recommends that you do not enable the Compare Files and Folders verification when
    copying data from NetWare to Linux.'
  merge: -1
  pgno: 385
- img_proc: true
  md: 'If you do enable this check, you should expect to see many errors reported
    in the log file, because of the inherent differences in how Linux stores file
    system data.


    +   - Enable UTF-8 Encoding on NCP Client for the Server Consolidation Utility
    (SCU). You can use the Server Consolidation Utility to copy data from servers
    storing double-byte character set (Japanese, Korean, and other non-ASCII characters)
    or extended ASCII character data (multinational characters).


    To copy data with non-ASCII or extended ASCII characters, you must enable UTF-8
    support in the Novell Client 4.91 for Windows 2000/XP to prevent trustees and
    ownership from being lost.


    UTF-8 support is turned off by default.


    +   - Understanding the Need for Linux-Enabling Users. When you use the Server
    Consolidation Utility to copy data from NetWare servers to NSS volumes on OES
    Linux, it transfers the NetWare trustee rights and supported file and directory
    attributes along with the files.


    However, in order to preserve file ownership, the users must be Linux enabled
    (also known as LUM enabled because the process involves the Linux User Management
    service in OES).


    To become Linux or LUM enabled, an eDirectory User object must be associated with
    an eDirectory group. The Group object must be associated with an eDirectory Linux
    Workstation object that represents the physical Linux workstation/server.


    The Group object is necessary because NSS on uses Virtual File Services (VFS),
    which requires both a User ID and a Group ID to authorize access.'
  merge: -1
  pgno: 386
- img_proc: true
  md: '# Integrating Novell Enterprise Server for Linux


    For complete details on Linux (LUM) enabling users for OES Linux, see the Novell
    Linux User Management Technology Guide. (lumadgd.pdf).


    The guide is available at http://www.novell.com/documentation/oes or from the
    OES_Docs directory on your 3077 Course CD.


    +   **Maintaining File Ownership Information.** To maintain file ownership information
    when copying data from NetWare volumes to NSS volumes on OES Linux, Novell recommends
    that you Linux-enable your users with LUM before copying their data.


    If you Linux-enable users after their data has been copied to an OES Linux server,
    the file ownerships might not be re-established immediately on the destination
    NSS volume.


    If you use the nambukkadd command to Linux enable your users, the user IDs are
    updated immediately upon completion of the command.


    However, if you enable users individually with iManager, ConsoleOne, or the nuseradd
    command, it could take up to four hours before the user IDs are updated.


    You can have the update ID process occur immediately by running the refresh command
    after Linux-enabling


    For complete details on using the nambukkadd command, see “nambukkadd” on p. 37
    of the Novell Linux User Management Technology Guide. (lumadgd.pdf).


    The guide is available at http://www.novell.com/documentation/oes or from the
    OES_Docs directory on your 3077 Course CD.'
