  md: '# Integrating Novell Open Enterprise Server for Linux


    For details on the comparison of NSS on NetWare and Linux, see

    “Comparison of NSS on NetWare and NSS on Linux” on page 413 of the

    Novell Storage Services File System Administration Guide (nss_enu.pdf).


    You can access the guide from http://www.novell.com/documentation/oes

    from the OES_Docs directory on your 3077 Course CD.


    # NSS and EVMS on OES Linux


    The default volume manager in OES Linux is the Linux Volume

    Manager (LVM).


    However, to use NSS on the same drive that contains your boot

    volume and system volume, that drive must be managed by

    Enterprise Volume Management System (EVMS).


    Unless you make your Linux swap and system volumes manageable

    by EVMS, you cannot create NSS data volumes on that drive.


    The simplest solution is to put your swap and system volumes on

    one device, and then use different devices for your NSS volumes.


    In other words, you must install Linux with EVMS as the volume

    mager of the system hard drive in either of the following

    scenarios:


    +   * Your system has a single hard drive and you want to use its free

    space for NSS data volumes.


    +   * Your system has multiple hard drives and you want to use free

    space for NSS data volumes from any drive that contains the

    Linux boot, system, or swap volumes.


    For details on NSS and EVMS on OES Linux, see “Using EVMS to Manage

    Devices with NSS Volumes (Linux)” on page 409 of the Novell Storage

    Services File System Administration Guide (nss_enu.pdf).


    You can access the guide from http://www.novell.com/documentation/oes

    from the OES_Docs directory on your 3077 Course CD.


    5-52 Copying all or part of this manual, or distributing such copies, is strictly
    prohibited. To report suspected copying, please call 1-800-PIRATES. Version 1'
