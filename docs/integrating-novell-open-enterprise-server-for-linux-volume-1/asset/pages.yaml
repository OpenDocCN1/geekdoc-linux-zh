- img_proc: true
  md: '# /etc/named.conf


    The file that configures the basic behavior of your DNS server is /etc/named.conf.
    At its most basic, this file contains two sections:


    +   **Options.** The options section of named.conf contains the settings connected
    with the configuration choices shown in Figures 4-1 and 4-3.


    The options you can configure in this section do the following:


    +   - Indicate the directory where the zone configuration files are to be saved,
    as the default location; /var/lib/named/.


    +   - Apply to the behavior of the DNS service.


    +   - Allow you to enter global directives that apply to all the zones hosted
    by the server.


    +   **Zone Declarations.** The zone declarations portion of the named.conf file
    are used to create zones for the DNS server to host. These declarations contain
    the following:


    +   - Zone name.


    +   - Zone type.


    +   - File name where specific zone configuration data is kept. The location of
    this file is assumed to be the directory indicated in the options section.


    Installing the DNS service creates three zones by default:


    +   - **localhost.** A master zone that resolves 127.0.0.1.


    +   - **0.0.127-in-addr.arpa.** A master reverse-lookup zone for localhost.


    +   - **Hint zone.** A zone which is indicated with a period (“”).


    Any other zones you create in YaST are defined in the zone declarations portion
    of the named.conf file. You can also edit this file manually, if you are comfortable
    with the requirements and syntax.'
  merge: -1
  pgno: 312
- img_proc: true
  md: '# Integrating Novell Enterprise Server for Linux


    For details on /etc/named.conf, see “The Configuration File /etc/named.conf” on
    page 311 of the SUSE Enterprise Server Administration Guide (sles_admin.pdf).


    You can access the guide from http://www.novell.com/documentation/oes or for OES_Docs
    directory on your 3077 Course CD.


    If you edit this file manually, your changes do not take effect until the DNS
    service is restarted. To restart the service, enter the following:


    +   * /etc/init.d/named restart

    * or

    * rcnamed restart


    # /var/lib/named/


    By the DNS service on OES Linux is configured to place zone configuration files
    in /var/lib/named. This directory location is indicated in the options section
    of /etc/named.conf.


    The zone configuration files for the three default zones are found in this directory.
    They are named as follows:


    +   * localhost.zone

    * 127.0.0.zone

    * root.hint


    If you created a da.com zone in YaST, it would write the configuration information
    for da.com in /var/lib/named/da.zone.


    The information found in a .zone file includes a TTL (time to live) setting, SOA
    data, and any records (NS, MX, A, CNAME) you enter for the zone.'
  merge: -1
