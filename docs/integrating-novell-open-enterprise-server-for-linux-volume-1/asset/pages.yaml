  md: '# Integrating Open Novell Server for Linux


    +   - AIX

    - HP-UX


    For NetWare and Windows, iMonitor loads automatically when eDirectory runs.


    On Linux, Solaris, AIX, and HP-UX, you can load iMonitor using the **ndsimonitor
    -l** command.


    It can also be loaded automatically (as in OES Linux) by adding **ndsimonitor**
    in the /etc/ndsimon.conf file before you restart the eDirectory server.


    # How to Access iMonitor


    To access Novell iMonitor, do the following:


    +   1. Make sure that the iMonitor executable is running on the eDirectory server.

    If you installed eDirectory on your OES Linux server or installed OES Linux into
    an existing eDirectory tree, iMonitor is already running on the OES Linux server.

    2. Open a supported Web browser.

    3. In the address (URL) field, enter the following:

    `http://server_IP_address:httpstack_port/nds`


    The following ports are available for iMonitor:

    - OES NetWare: **8008** (non-secure) and **8009** (secure)

    - OES Linux: **8028** (non-secure) and **8030** (secure)


    For example, if the server IP address is 10.0.0.4 and the port number for httpstack
    is 8030 (the secure port on an OES Linux server), you would enter the following:

    `https://10.0.0.4:8030/nds`'
  merge: -1
  pgno: 263
- img_proc: true
  md: 'If you forget which ports (non-secure and SSL) are assigned to iMonitor, you
    can find and display the information from the ndsconfig file by entering ndsconfig
    get | grep at a shell prompt.


    You can also use DNS names anywhere a server''s IP or IPX address or distinguished
    name can be used.


    For example, with DNS configure,


    ```

    http://prv-gromit.provo.novell.com/nds?server=prv-igloo.provo.novell.com

    ```


    is equivalent to http://prv-gromit.provo.novell.com/nds?server=IP_or_IPX address


    or http://prv-gromit.provo.novell.com/nds?server=cn=prvigloo,ou=ds,ou=dev=novell,t=novell_inc


    If an eDirectory HTTPS stack is available, you can use iMonitor through HTTPS.


    +   From the login page, enter a username and password.

    To access all of the features, you need to log in as Admin or as an administrator
    equivalent.

    If you have more than one Admin user object in the tree with the same name, make
