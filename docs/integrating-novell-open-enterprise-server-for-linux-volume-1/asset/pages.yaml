    You can log in to NRM for NetWare by doing the following:


    +   1. Open a supported web browser from your workstation or another


    +   2. Point the browser to the URL of the server you want to manage by entering
    the following in the address (URL) field:


    ```

    http://server_IP_address:8008

    ```


    For example, if the server IP address is 10.200.200.4, you would enter the following:


    ```

    http://10.200.200.4:8008

    ```


    > The default alternate port number is 8008. If you have changed this value on
    the Configuration page in NRM, make sure you specify the same value for the port
    number.


    > If you have Domain Name Services (DNS) installed on your network for server
    name-to-IP address resolution, you can also enter the server''s DNS name instead
    of the IP address.


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_228_0.png)'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# Integrating Novell Enterprise Server for Linux


    If you want to access NRM from the outside of a firewall and the server''s private
    address is unreachable except through Network Address Translation (NAT) or by
    proxy, make sure that DNS is configured on your server, and then change the load
    line for loading the httpptk.nlm in the following autoexec.nf file:


    ```

    load httpptk.nlm/hosts:1 /SSL/keyfile:"SSL CertificateIP"

    ```


    +   3. Accept the SSL certificate.


    You must have SSL 2.0 and SSL 3.0 (where available) enabled in your browser; otherwise,
    the browser displays an error indicating that the page cannot be displayed.


    +   4. When the login dialog box appears, enter the username and password.


    To have access to all pages necessary to manage your server remotely, you need
    to log in as a user with the Supervisor right to the Server object. This is normally
    user Admin or a user with rights equivalent to user Context.


    > If the Set Bindery Context = line has been removed from the autoexec.nlm file
    or the defaultDirectory context has not been changed, enter the full context of
    the user you are logging in.


    If you log in as a user without the Supervisor right to the Server object, you
    will only see pages that display the volumes, directories, and files that you
    have access to.


    You can view files (where you have read access) and upload files into directories
    where you have write access.


    However, you cannot see or do any of the management functions with the exception
    of being able to set a Simple Password for NFAP on the NFAP Simple Management
    page (if this is set up on the server).'
  merge: -1
  pgno: 229
- img_proc: true
  md: 'You can access this page by selecting the User Tools icon in the header frame
    and then clicking the NFAP Security link in the navigation frame.


    # How to Log Out of NRM for NetWare


    To log out of NRM, select the Exit icon at the top of the NRM page, and then close
    all your browser windows at the workstation you logged in from.


    Your NRM session remains open until you close all your browser windows (including
    tabbed windows).


    # Restarting NRM or the HTTP Interface


    After you have made changes to the OES NetWare server that require portal.nlm
    or httpstk.nlm to be restarted, or after you have loaded a newer version of these
    NLM programs on the server, make sure you select the applicable Restart button
    to unload and reload the module.


    A message appears asking if you are want to restart the module (which temporarily
    disables the utility). If you choose to restart, a page appears stating that the
    reset is taking place.


    When the reset is complete, the page refreshes to the Configuration page with
    the changed settings—if you have not changed the port settings. If you have changed
    the port settings, remember to use the new numbers when accessing NRM.


    We recommend that you unload and reload portal.nlm and httpstk.nlm on the Configuration
    Options page of NRM (instead of the system console).


    The functionality provided from the Configuration Options page keeps track of
    the plug-in modules that have dependencies with these NLM programs and unloads
    and reloads all the required modules.'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# Integrating Novell Enterprise Server for Linux


    If you unload portal.nlm or httpstk.nlm at the server console, you might run into
    problems with module dependencies (such as timesync, libc, tcpstats, and nwusage)
    that have been established, and the NLM might not unload.


    If you successfully unload the modules, the dependent-in modules must be loaded
    manually after portal.nlm.


    # Accessing and Managing Other NetWare Servers


    To access other NetWare servers in your eDirectory tree that have NRM loaded,
    select Manage Server > Managed Server List. A list of servers is provided via
    SLP (Service Location Protocol).


    When the list of NetWare servers is first displayed, it might include servers
    outside the current tree, as reported by SLP.


    The question mark icon next to the server name indicates that the portal.nlm is
    checking its availability. The question mark icon changes to a server icon if
    it is in the current tree or is removed if the server is not in the current tree.


    Filtering the server list might take several minutes if the list is long.


    To refresh the list, reload the page by selecting the Manage Server List link
    again, then refresh the list using normal browser functionality.


    # NRM Limitations on OES NetWare


    The following issues are known limitations of NRM that might not be resolved in
    this release:


    +   - Characters not displaying. In this release, NRM for NetWare is dependent
    on the code page (language) of the server being monitored.


    Any character in a file or folder name that is not part of the server''s local
    or native character set cannot be displayed.'
  merge: -1
  pgno: 231
- img_proc: true
  md: 'For example, if the names contain characters outside the server''s code page/character
    set, you might see blank entries for the items in a file listing.


    Even though files and folders whose names contain these characters can be created
    or migrated to the server, they are not usable through the Novell Remote Manager
    utility on NetWare until this limitation is addressed (in a future release).


    +   **Use group operations.** Some of the Server Group reports and operations
    that are currently documented as available in the Novell Remote Manager for NetWare
    Administration Guide for OES are not available when you upgrade to NetWare 6.5
    SP3 or OES SP1.


    As the Server Group functionality of NRM continues to develop across both NetWare
    and Linux platforms, the Group Reporting and Group Operations functionality will
    be restored as it becomes available in a future support pack release. Fixes might
    also be available as downloadable modules from the Novell Support Web before the
    next release.


    The documentation has not been updated to remove the descriptions and instructions
    for these features because they will be restored.


    +   **Novell iManager link from NRM.** When you select the button in the header
    frame to access iManager, iManager takes over the current browser window rather
    than opening a new window on top of the NRM window.


    Use the browser''s back button to return to NRM, or open another browser window
    for NRM. The same functionality applies to the links for NDS iMonitor and DS Trace
    under the Manage eDirectory heading.


    +   **Available server health status.** The server health item for Available Memory
    is configured by default with threshold values calculated as a percentage of the
    total server memory.'
  merge: -1
  pgno: 232
- img_proc: true
  md: 'Starting with OES SP2, adjustments have been made to the server''s memory handling
    that allow for lower values for these thresholds, so the defaults for Suspect
    and Critical levels have been changed.


    These changes to the default threshold values are configured on a new server installation
    with OES SP2 (NW6.5 SP5), but the defaults are not automatically changed on a
    server that you upgrade to the latest Support Pack to avoid overwriting your custom
    values you may have already set for these thresholds.


    If you see the Available Memory server health item showing a status of Suspect
    (yellow) or Critical (red) after applying the Support Pack (which might or might
    not occur, depending on the server memory and existing settings), adjust the threshold
    values to the new defaults for Available Memory.


    To adjust the threshold values to the new defaults for the Available Memory health
    item, do the following:


    +   From Novell Remote Manager, select Diagnose Server > Health Monitor.


    +   Select Threshold Configuration > Available Memory > Restore Default Values
    > OK.


    # How to Get Started with NRM on OES Linux


    NRM for Linux is a browser-based utility that you can use to manage one or more
    OES Linux or OES NetWare servers from a remote location.


    You can use the OES Linux version of NRM to monitor your server''s health, change
    the configuration of your server, or perform diagnostic and debugging tasks.


    You need to be familiar with the following before you start using NRM on OES Linux:


    +   Administrative Tasks on OES Linux Servers


    +   System Requirements'
  merge: -1
