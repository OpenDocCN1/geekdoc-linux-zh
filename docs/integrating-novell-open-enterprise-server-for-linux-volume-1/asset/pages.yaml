    # Understand the DHCP Configuration File


    The file that controls and configures the way your DHCP service behaves is /etc/dhcpd.conf.
    Any DHCP configurations you create in YaST are written to this file. The following
    is an example of a basic dhcpcd.conf file:


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_318_0.png)


    ```

    default-lease-time 600;      # 10 minutes

    max-lease-time 7200;           # 2 hours


    option domain-name "kosmos.all";noption domain-servers 192.168.1.1, 192.168.1.2;

    option broadcast-address 192.168.1.255;

    option routers 192.168.1.254;

    option subnet-mask 255.255.255.0;


    subnet 192.168.1.0 netmask 255.255.255.0

    {

    range 192.168.1.10 192.168.1.20;

    range 192.168.1.100 192.168.1.200;

    }

    ```


    The entries in this file indicate time behavior, optional information that can
    be sent (such as a domain name and IP address and mask) to a host to configure
    its IP settings, and the subnet with its range of available addresses.


    If you configure this file manually, the changes will not take effect until you
    restart the DHCP daemon by entering one of the following:


    +   - /etc/init.d/dhcpd restart


    +   - rcdhpcd restart'
