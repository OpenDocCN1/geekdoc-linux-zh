  md: 'Integrating Open Novell Enterprise Server for Linux


    If a No Authentication icon is displayed for the server’s health status, you are
    prompted to log in to the server before a quick status is displayed.


    # How to View Server Health Details


    When you want to view the details of a server’s health, you must be authenticated
    to the server.


    +   1. Select the name link for the server you want to view.

    2. (Conditional) If prompted, log in to the server.


    If a No Authentication icon is displayed for the server’s health status, you are
    prompted to log in to the server.


    If the server is an OES Linux server in a network that has LUM installed and this
    service is enabled to use Linux User Management, you can log in as the Admin user
