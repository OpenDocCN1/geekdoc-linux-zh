  md: '# # Objective 2


    # # Perform Administrative Tasks with YaST


    YaST is a graphical Linux-based utility that greatly simplifies the installation
    and configuration of components on SUSE LINUX Enterprise Server 9 (SLES 9) servers.
    The name YaST stands for another Setup Tool.


    Novell has integrated the OES Linux installation with the SUSE YaST program.


    To understand how YaST works with OES Linux, you need to know about the following:


    +   - YaST and OES Linux Installation

    - YaST and OES Linux Configuration

    - Adding Novell OES Services to OES Linux

    - The Role of SuSeconfig


    # ## YaST and OES Linux Installation


    As you install OES Linux, the YaST utility launches at the second step in the
    process. YaST guides you step by step through the installation, much the same
    as the GUI part of the NetWare installation.


    The Novell OES installation uses YaST to let you install SLES 9 and OES services
    at the same time. Or can install the SLES 9 components, and then use YaST later
    to instal OES services.


