  md: '# How to Configure the SSH Server


    The configuration file for the OpenSSH server is

    /etc/ssh/sshd_config. Some of the more commonly used options in

    t configuration file include the following:


    | Table 3-2 | Option | Description |

    |--- |--- |--- |

    | | AllowUsers | Allows an SSH login for selected users |

    | | DenyUsers | Denies an SSH login for selected users |

    | | Protocol | Specifies the protocol versions supported. (Default: 2,1) |


    For additional information on SSH server configuration options, enter man sshd.


    # SSH Server Commands


    The following programs and commands are important to running an

    SSH server on OES Linux:


    | Table 3-3 | Program/Command | Description |

    |--- |--- |--- |

    | | /usr/sbin/sshd | This is the SSH daemon (controlled via the script /etc/init.d/sshd).
    |

    | | ssh-keyscan | In a standard OES Linux installation, the SSH daemon is started
    automatically in runlevels 3 and 5.

    This command collects public host keys from SSH servers. It finds the public host
    key of an SSH server and displays this on the standard output.

    This output can then be compared with the key in the file /etc/ssh/ssh_known_hosts
    and be included in the file. |'
