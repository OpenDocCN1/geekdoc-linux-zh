    When you finish making changes with a YaST module, YaST uses backend services
    as SuSEconfig to implement the changes in the system.


    +   - Start YaST with a text interface (ncurses). As root you can run YaST without
    a graphical user interface by entering yast. This starts the ncurses interface.


    If there is no X window server running, the command yast2 also launches the ncurses
