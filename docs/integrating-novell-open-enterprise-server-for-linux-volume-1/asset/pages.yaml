  md: '+   Do you plan to use Novell Nsure Identity Manager 2, powered by DirXML,
    with its enhanced password policy and password synchronization capabilities?


    +   Do you plan to use Nterprise Branch Office 2.0?


    Make sure your security container is available.


    NMAS relies on storage of policies that are global to the eDirectory tree. The
    eDirectory tree is effectively the security domain. The security policies must
    be available to all servers in the tree.


    NMAS places the authentication policies and login method configuration data in
    the Security container that is created off [root] in NetWare 5.1 or later eDirectory
    trees.


    This information must be readily accessible to all servers that are enabled for
    NMAS. The purpose of the Security container is to hold global policies that relate
    to security properties such as login, authentication, and key management.


    With NMAS, you should create the Security container as a separate partition, and
    make sure the container is widely replicated. This partition should be replicated
    as a Read/Write partition only on those servers in your tree that are highly trusted.


    > Because the Security container contains global policies, be careful about where
    you place writable replicas, because these servers can modify the overall security
    policies specified in the eDirectory tree.


    In order for users to log in with NMAS, replicas of the User objects must be on
    the NMAS server.


