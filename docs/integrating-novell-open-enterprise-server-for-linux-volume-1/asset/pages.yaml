  md: 'If you attempt to install OES Linux on a server that already has eDirectory
    8.7.3 installed, the eDirectory included in OES (eDirectory 8.7.3 IR 5) overwrites
    the previous eDirectory installation.


    You should install OES on a clean computer. Do not try to upgrade eDirectory.


    Installing OES Linux into a NetWare 6.5 SP2 tree causes the NetWare server to
    depend due to an issue in NetWare 6.5 SP2 that is fixed in NetWare 6.5 SP3.


    Before installing an OES Linux server into a NetWare 6.5 SP2 tree, upgrade any
    NetWare 6.5, NetWare 6.5 SP1, and NetWare 6.5 SP2 LDAP servers that will be pointed
    to by the OES installation to NetWare 6.5 SP3.


    # Creating a New eDirectory Tree


    If you are creating a new eDirectory tree on your network, you must do some additional
    planning before you install the first server into the tree.


    The first server is important for two reasons:


    +   - You create the basic eDirectory tree structure during the first installation


    +   - The first server permanently hosts the Certificate Authority for your organization


    To ensure that your eDirectory tree meets your needs, take time to plan the following:


    +   - Structure of the eDirectory tree. A well-designed tree provides containers
    for servers, users, printers, etc. It is also optimized for efficient data transfer
    between geographically dispersed locations.


    For more information, see “Designing Your Novell eDirectory Network” on page 67
    in the Novell eDirectory 8.7.3 Administration Guide (edir873.pdf).'
  merge: -1
  pgno: 69
- img_proc: true
  md: 'Time synchronization. eDirectory requires that all OES servers, both NetWare
    and Linux, be time synchronized.


    For more information, see “Configure Time Synchronization on Novell OES” on page
    5-4.


    Partitions and replicas. eDirectory allows the tree to be partitioned for scalability.
    Replicas (copies) of the partitions provide fault tolerance within the tree.


    The first 3 servers installed into an eDirectory tree automatically receive replicas
    of the tree’s root partition. You might want to create additional partitions and
    replicas.


    For more information, see “Managing Partitions and Replicas on page 113 in the
    Novell eDirectory 8.7.3 Administration Guide (edir873.pdf).


    # Prepare Your Existing eDirectory Tree for OES


    If you are installing OES into an existing tree, you must use Deployment Manager
    (located on the OES NetWare 6.5 SP5 CD 1) to see whether your tree requires any
    updates.


    # Identify a Purpose for Each Server


    Large networks usually have one or more servers dedicated to providing a single
    network service.


    For example, one or more servers might be designated to provide Novell iFolder
    file services to network users while other servers provide iPrint printing services
    for the same users.


    For smaller organizations, it is often not practical or cost effective to dedicate
    servers to providing a single service. For example, the same server might provide
    both file and print services to network users.


    Prior to installing a new server on your network, you should identify the service
    or services that it will provide.'
