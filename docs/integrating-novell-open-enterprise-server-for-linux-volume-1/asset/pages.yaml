  md: "+   - **[global]**. The following entries need to be configured in the [global]\
    \ section:\n- **Ld admin dn =**. Specifies the Distinguished Name (DN) that Samba\
    \ uses for contacting the eDirectory LDAP server to retrieve user account information\
    \ for users requesting access to Shares.\n  Example: Ldap admin dn = cn=admin,o=novell\n\
    - **ssl =**. Specifies that Samba should use SSL for communications with the LDAP\
    \ server (eDirectory)."
  merge: -1
  pgno: 444
- img_proc: true
  md: '# Secure LDAP requires that this be set to On.


    Default: ldap ssl = on


    +   - **ldap port =**. Specifies the port used for secure LDAP communications
    between Samba and the LDAP server (eDirectory).


    This value can be changed if your network uses a different port for secure LDAP
    communications.


    Default: ldap port = 636


    +   - **ldap server**. Specifies the LDAP server''s hostname. Either the full
    DNS name or the IP address can be used.


    Example: ldap server = OES.provo.novell.com


    Default: ldap server = i.i.i.i (where i.i.i.i = the IP address of the eDirectory
    server)


    +   - **security =**. This specifies the security mode. The value must be set
    to **user**. For more information, see www.samba.org.


    Default (required): security = user


    +   - **encrypt passwords =**. This specifies that passwords received from Windows
    clients will be encrypted. This value must be set to **yes**. For more information,
    see www.samba.org.


    Default (required): encrypt passwords = yes


    +   - **workgroup =**. This specifies the Windows workgroup that the Samba server
    will either join (if it exists) or effectively create (if the name is new).


    Example: workgroup = mygroup


    Default: workgroup = workgroup


    +   - **netbios name =**. This sets the netBIOS name by which a Samba server is
    known and advertised. If Samba is installed for the first time by OES, Novell
    appends -W to the host name for this entry.


    This is necessary to prevent a conflict with NCP on Linux, which uses the host
    name.


    Example: netbios name = myhost-W'
  merge: -1
  pgno: 445
- img_proc: true
  md: '+   [homes]. The following are entries that need to be configured in the [homes]
    section:


    +   - comment =. This specifies the name that appears after the Samba server name
    in Network Neighborhood on the Windows client.


    If this and the two entries are set as specified, there is no need to specify
    individual shares for users'' home directories.


    Default: comment = Home Directories


    +   - browseable = This specifies whether all the home directories appear in Network
    Neighborhood.


    Default: browseable = no


    +   - writable =. This specifies whether users can create and modify files.


    Default: writable = yes


    # ldap.conf


    ldap.conf file is found in the /etc/opt/novell/ldap directory on the OES Linux
    server.


    If you install the OES Linux server into an existing tree, you must specify a
    trusted root certificate during installation if you want to use SSL. The ldap.conf
    file on your OES Linux server will then have the following certificate-related
    entries:


    ```

    TLS_CACERT /etc/ssl/certificate.cert

    ```


    ```

    TLS_REQCERT demand

    ```


    If you are installing a new directory tree, the ldap.conf file will have the following
    entry:


    ```

    TLS_REQCERT allow

    ```


    For more information on the ldap.conf file, see the ldap.conf man page.


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_446_0.png)'
  merge: -1
