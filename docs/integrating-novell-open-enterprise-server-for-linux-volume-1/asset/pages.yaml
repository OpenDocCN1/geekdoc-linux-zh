    # VMware and the Exercises


    VMware Workstation software lets you create and run multiple x86 virtual computers
    on a single physical computer simultaneously. Each virtual machine can start and
    run its own operating system, such as NetWare, Windows, and Linux.


    VMware Player, free virtual-machine software, can run virtual machines made by
    other VMware products, but you cannot use it to create new virtual machines.


    This course provides several VMware virtual machines that you run on a Windows
    XP Professional physical computer.


    To complete the exercises in the course, you can use VMware Workstation or VMware
    Player. In a classroom setting, you might use one or the other.


    The following guidelines help you have a successful experience using VMware for
    the course exercises:


    +   - How to Move In and Out of VMware

    - How to Use the VMware Snapshot Feature

    - How to Use VMware Player'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# How to Move In and Out of VMware


    While using a VMware virtual machine, you can switch (release) mouse and keyboard
    control to the host computer desktop by pressing Ctrl+Shift+Alt.


    To return mouse and keyboard control to the VMware virtual machine, press Ctrl+G
    or select the VMware window.


    > Press Ctrl+Alt+Insert in a VMware virtual machine is the same as pressing Ctrl+Alt+Delete.


    # How to Use the VMware Snapshot Feature


    If you are using VMware Workstation 5.x to run the virtual machines on the Windows
    XP Professional host computer, you can use the Snapshot feature to capture the
    current state of a virtual machine hard drive as a file, and then return to that
    state by selecting the Snapshot file.


    > Because Snapshot only saves the difference between the last state of the hard
    drive and the current state, snapshot files are relatively small.


    The Snapshot feature is very useful when completing exercises. After successfully
    completing an exercise, you take a snapshot of the current state of the virtual
    machine. If you have problems in the next exercise, you can start over by reverting
    to the previous snapshot.


    To use the Snapshot feature in this course for exercises, you need to know how
    to do the following:


    +   - Capture an Exercise Snapshot

    - Return to a Previous Exercise Snapshot'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'If an exercise involves using more than one virtual machine (such as DA1-LINUX,
    DA2-NETWARE, and DA-WS1-SLED), make sure you take a snapshot of each at the end
    of the exercise.


    If you are in a classroom setting, the instructor might have already provided
    exercise snapshots on your DA-HOST Windows XP Professional workstation.


    # Capture an Exercise Snapshot


    To capture a snapshot of a virtual machine at the end of an exercise, do the following:


    +   1. Make sure that your mouse cursor is released from the virtual machine window
    (you normally press Ctrl+Shift+Alt) and that you have shut down the virtual machine.


    Shutting down the virtual machine before capturing saves space because VMware
    only captures the current state of the virtual hard drive (.vmdk file) instead
    of the hard drive and what is in memory.


    Shutting down the virtual machine before capturing also ensures a clean snapshot
    and can help you avoid problems with some systems that occur after the snapshot
    such as decreased processing speed.


    +   2. From the VMware Workstation menu, select VM > Snapshot > Take Snapshot.


    A Take Snapshot dialog appears.


    +   3. In the Name field, enter the snapshot name.


    We recommend the name of the next exercise.


    For example, if you have just finished Exercise 1-1 successfully, use an Ex. 1-2
    snapshot name.


    This makes it easier to find the snapshot you need to start the exercise.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Introduction


    +   4. In the Description field, enter a *description* of the virtual machine
    (such as *Use this virtual machine at the beginning of Exercise 1-2*).


    +   5. When you finish, select **OK.**


    The snapshot file is saved in the same directory where your VMware virtual machine
    files are stored.


    # Return to a Previous Exercise Snapshot


    To return the virtual machine back to a state at the end of a previous exercise,
    do the following:


    +   1. Make sure that the VMware virtual machine is running or that the VMware
    virtual machine tab page is displayed.


    +   2. Make sure that your mouse cursor is released from the virtual window (you
    normally press **Ctrl+Shift+Alt**).


    +   3. From the VMware Workstation menu bar, select **VM > Snapshot > Snapshot
    Manager.**'
  merge: -1
  pgno: 28
