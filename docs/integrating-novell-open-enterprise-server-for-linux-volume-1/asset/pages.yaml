  md: '# Assign Rights to Service Agents


    Novell services that can be hosted by either OES NetWare or OES Linux servers
    often use eDirectory user objects as agents for accessing the file system on whichever
    platform is hosting the service. These eDirectory user objects are called service
    agents.


    iFolder is a good example of a service that uses a service agent. When iFolder
    is hosted by an OES Linux server, the novlif user object is the agent that is
    used to access the Linux file system and manage iFolder data files.


    The novlifdr user belongs to the ifdrwww group. Both ifdrwww and novlifdr are
    LUM enabled.


    iFolder is designed to be able to use either native Linux file systems or NSS
    volumes to store data. If, during installation, you configure iFolder to store
    data in a native Linux directory, the iFolder installation program automatically
    assigns novlifdr and ifdrwww as owner and group to that directory.


    However, if you choose to store iFolder data on an NSS volume, you must manually
    assign novlifdr as a file system trustee of the NSS volume, and give novlifdr
    all file system rights.


    For example, assuming the NSS volume iFolder is configured to be mounted at /var/nss/iffolder,
    the command to make this trustee assignment is


    ```

    rights -f /var/nss/iffolder -r all trustee novlifdr.slc

    ```


    Because NSS file system rights and native Linux file system rights are not related,
    it doesn''t matter what owner or group is assigned to an NSS volume. The only
    file system rights that matter on NSS volumes are those assigned through the rights
    utility.'
  merge: -1
