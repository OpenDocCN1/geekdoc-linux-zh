    - How to Prepare Users to Access CIFS or Samba Shares on OES Servers


    # How to Install Samba


    The installation of Samba differs between OES NetWare and OES Linux servers. To
    understand the differences, you need to know the following:


    +   - How to Install and Configure Samba on OES NetWare

    - How to Install and Configure Samba on OES Linux


    # How to Install and Configure Samba on OES NetWare


    Technically speaking, the Samba service is not installed on OES NetWare servers.
    However, support for the CIFS protocol is part of the default configuration of
    NSS volumes. The CIFS.NLM is launched by default when the server boots.


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_431_0.png)


    The protocols (CIFS, AFP, NFS) that were part of the original Native File Access
    Pack (NFAP) on NetWare 6 are now configured and supported by default in OES NetWare.


    Any OES NetWare server hosting an NSS volume can be called a CIFS server. NSS
    volumes on CIFS servers are called CIFS sharepoints.


    The CIFS context configuration file (cifsctx.cfg) is configured by default to
    allow access to users in the same context as the Admin user.'
  merge: -1
  pgno: 431
- img_proc: true
  md: 'By default the CIFS server is named server_name-W and all NSS volumes mounted
    on the CIFS server are exported so they can be accessed by SMB-compatible clients.


    The default CIFS server behavior on OES NetWare can be changed by modifying the
    cifsctxs.cfg file. For example, you can modify the cifsctxs.cfg to add additional
    user contexts.


    The properties of the CIFS server and its sharepoints can be modified through
    the CIFS/AFP plug-in in iManager.


    You can view the current CIFS server settings at the server console by entering


    +   **CIFS INFO** (for CIFS server operational information)


    +   **CIFS SHARE** (to see a list of all the currently mounted CIFS sharepoints)


    +   **CIFS SHARE share_name** (to see the configuration of a specific sharepoint)


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_432_0.png)


    > For details on CIFS, see “Administrator Tasks for Native File Access for Windows
    Services” on page 21 of the Novell Open Enterprise Server: Native File Access
    Protocols Guide (native.pdf).


    You can access the guide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 Course CD.


    # How to Install and Configure Samba on OES Linux


    Samba is installed on an OES Linux server as part of the Novell OES installation
    pattern.


    If you customize your package selection during installation and Samba is not installed,
    you can use YaST to install the Samba packages later.


    Configuration of the Samba service on an OES Linux server is controlled by the
    /etc/smb.conf file. You can edit the /etc/smb.conf file directly in any text editor
    (which you will do in Exercise 6-2).'
  merge: -1
  pgno: 432
- img_proc: true
  md: 'After making changes directly to this file, you must manually restart the smb
    daemon for your changes to take effect. You restart the smb daemon from the command
    line by entering


    ```

    /etc/init.d/smb restart

    ```


    or


    rcsmb restart


    You can also edit the Samba configuration through YaST, using the Samba Client
    or Samba Server modules. (You will use the Samba Client module in Exercise 6-1.)


    When you are done making changes through these modules, YaST writes the changes
    to the Samba configuration file and restarts the smb daemon.


    # How to Prepare Users to Access CIFS or Samba Shares on OES Servers


    You must complete the following tasks before users can access a CIFS or Samba
    share on an OES server:


    +   - Samba-Enable Users

    - Assign a Universal Password

    - Assign eDirectory Object Rights

    - Assign File System Rights

    - Configure CIFS Contexts'
  merge: -1
  pgno: 433
- img_proc: true
  md: '# Samba-Enable Users


    The Samba service in Novell OES requires that users be Samba enabled, which provides
    the following authentication methods:


    +   - **On OES NetWare Servers.** Being Samba enables user objects access to the
    Samba Default Password Policy which contains a Universal Password configuration
    option that allows them to access CIFS shares.


    +   - **OES Linux Servers.** Being Samba enables user objects access to the Samba
    Default Password Policy and allows LUM-enabled users to authenticate through eDirectory
    and access Samba shares.


    Saying that users need to be Samba enabled implies that at least one OES Linux
    server is in the tree. The Samba service is not present in the tree unless OES
    Linux servers have been deployed, which places the Samba Default Policy in the
    tree.


    You can use iManager to enable users for LUM and Samba, but the server that you
    run iManager from must have the LinuxManagement and SambaManagement modules installed.


    These modules can only be installed for iManager running on an OES Linux server.
    To access these modules, you must launch iManager from an OES Linux server.


    Before you can enable users for Samba, they must already be enabled for Linux:


    +   - For users that are not enabled for Linux, run iManager from an OES Linux
    server to access the **Linux User Management > Enable Users for Linux** option.
    You must have a LUM-enabled group object ready to assign these users to.


    +   - For users already enabled for Linux, run iManager from an OES Linux server
    to access the **Samba Management > Enable Linux User for Samba** option.'
  merge: -1
  pgno: 434
- img_proc: true
  md: "# Assign a Universal Password\n\nYou assign Universal Passwords by doing the\
    \ following:\n\n+   1. Apply a Samba-qualified password policy to a user, group,\
    \ or container by doing the following:\n   a. From iManager, select Passwords\
    \ > Password Policies.\n      The Samba Default Password Policy is in the list.\n\
    \   b. From the Password Policies page, select Edit.\n   c. From the Password\
    \ Policy drop-down list, select Configuration Options.\n   d. Review the Configuration\
    \ Options to make sure that the Enable Universal Password and Allow admin to retrieve\
    \ passwords are selected.\n   e. From the drop-down menu, select Policy Assignment.\n\
    \   f. From the Policy Assignment page, assign users, groups, or containers to\
    \ this password policy; then select OK.\n      For example, in Exercise 6-1, you\
    \ assign the container slc.da and marketing,slc.da.\n\n+   2. Set a Universal\
    \ Password for the user.\n\nAfter applying a Samba-qualified password policy,\
    \ all the selected users, groups, or containers are now assigned to this policy.\n\
    \nWhen you Samba-enable users in the SLC.DA container, the iManager Samba plug-in\
    \ will discover this policy assignment.\n\nAfter finding the Samba-qualified password\
    \ policy assignment, the iManager Samba plug-in, looks for the user's Universal\
    \ Password.\n\nIf a Universal Password has been set, it then becomes this user's\
    \ Samba password. If a Universal Password has not been set, the iManager Samba\
    \ plug-in prompts you to set a Universal Password to be used as the Samba password."
  merge: -1
  pgno: 435
- img_proc: true
  md: 'You can enter a password for the user that you are Samba-enabling or you can
    select the Do not set Universal Password option (not recommended).


    If you select the Do not set Universal Password option, users must create their
    own Universal Passwords by logging in through the Novell Client (or by authenticating
    to iManager).


    The Novell Client supports Universal Passwords and will synchronize the user’s
    Directory password to the Universal Password. If a user attempts to use Samba
    access (to CIFS or Samba shares) without a Universal Password being set, the user’s
    Samba account will be disabled.


    You should be aware of the most likely scenarios for setting Universal Passwords
    in connection with Samba-enabling your users:


    +   Creating new users that you want to Samba enable

    Do the following:


    +   Assign user’s context. Prior to creating the user, assign the user’s context
    to a Samba-qualified password policy.


    +   Create the user. The user’s context is already assigned to a Samba-qualified
    password policy, so the user will be assigned to a Samba-qualified password policy.


    The password you enter when creating the user will be synchronized to the Universal
    Password because of the Samba-qualified password policy.


    Linux-enable the user.


    +   Samba-enable the user. The iManager Samba plug-in determines that the Universal
    Password is already set and does not prompt you to enter a separate password.


    +   Setting the Universal Password prior to Samba-enabling an existing user

    Do the following:


    +   Assign the user (or the user’s group or container) to the Samba-qualified
    password policy.'
  merge: -1
  pgno: 436
- img_proc: true
  md: '+   b. Have the user log in to the network with the Novell Client. The Novell
    Client finds the password policy assignment and discovers that Universal Password
    is enabled but not yet set.


    The Novell Client automatically sets the Universal Password for this user by synchronizing
    it with the user''s eDirectory password.


    +   c. Linux-enable the user.


    +   d. Samba-enable the user. The iManager Samba plug-in determines that the Universal
    Password is already set and does not prompt you to enter a separate password.


    # Setting the Universal Password after Samba-enabling an existing user


    Do the following:


    +   a. Assign the user (or the user''s group or container) to the Samba-qualified
    password policy.


    +   b. Linux-enable the user.'
  merge: -1
  pgno: 437
- img_proc: true
  md: 'c. Samba-enable the user. The iManager Samba plugin determines that the Universal
    Password is not set and prompts you to enter a separate password. You can choose
    from the following::


    Option A. Leave the password fields blank and select the Do not set Universal
    Password option. Afterward have the user log in to the network with the Novell
    Client, which will synchronize the Universal Password with the user''s eDirectory
    password.


    or


    Option B. Enter a Universal Password for this user. If you know the user''s eDirectory
    password, you should use the same password. If you do not know the user''s eDirectory
    password, you will have to enter something and let the user know what you entered.
    The user''s eDirectory and Universal Passwords will not be synchronized.


    # Assign eDirectory Object Rights


    When users are attempting to access a CIFS share, they first need to be able to
    browse the tree for the volume object that represents the share. (This is simply
    the NSS volume object, such as DA3_EDU.)


    By default, all users in the tree have the rights to access a volume object. Default
    rights are read, compare (All Attribute Rights), and browse (Entry Rights).


    When preparing Samba users to access a CIFS share, you should confirm that they
    have these default rights, and that the rights are not blocked by an IRF or an
    explicit trustee assignment somewhere in the tree.'
  merge: -1
  pgno: 438
- img_proc: true
  md: "# Assign File System Rights\n\nWith the necessary Directory object rights in\
    \ place, a Samba user will be able to see the CIFS share but will not be able\
    \ to access any of the directories or files on that share.\n\nBy default, users\
    \ (whether Samba enabled or not) have no rights to the file system on a given\
    \ volume. As network administrator, you must grant the file system rights you\
    \ want users to use.\n\nIn the initial release of Novell OES, file system rights\
    \ are managed using Novell Remote Manager (NRM). In future releases, file system\
    \ management functionality will be added to iManager.\n\nNWAdmin and ConsoleOne\
    \ are shipped with OES and can be used to manage file system rights, but Novell\
    \ no longer maintains these tools.\n\nYou can use NRM to assign users as trustees\
    \ and give them the rights they need to directories and files on the CIFS share.\n\
    \nTo access the trustee assignment functionality in Novell Remote Manager, do\
    \ the following:\n\n+   1. Authenticate to Novell Remote Manager as the Admin\
    \ user.\n   The first page you see is the Volume Management page.\n\n+   2. From\
    \ the Volumes list, select the volume you want to manage.\n   The next page shows\
    \ the entities that exist on the volume selected. These entities include the root\
    \ of the volume, and any directories and files that are stored on the volume."
  merge: -1
  pgno: 439
- img_proc: true
