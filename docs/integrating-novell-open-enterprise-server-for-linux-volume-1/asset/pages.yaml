- img_proc: true
  md: 'For details on zone files, “Structure of Zone Files” on page 314 of the SUSE
    Linux Enterprise Server 9 Administration Guide (sles_admin.pdf).


    You can access the guide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 Course CD.


    # # How to Test DNS on OES Linux


    After you start the name service daemon, named, you should verify that the name
    server is running and resolving DNS names and IP addresses correctly.


    You can use the following commands on an OES Linux server:


    +   - nslookup. The nslookup command works on OES Linux as it does on NetWare.
    The difference is that the nslookup command has been deprecated on Linux. nslookup
    is replaced by the **dig** command.


    +   - **dig**. The dig command functions in much the same way as nslookup. The
    basic syntax for dig is


    **dns_name***


    For example, to make sure that da1.da.com is being resolved to the correct IP
    address, enter the following:


    **dig da1.da.com**


    Unlike nslookup, dig cannot be used to verify reverse lookup resolution. Instead,
    the *host* command is available for that purpose.


    +   - **host**. The host command allows you to verify that the in-addr.arra zone
    on your name server is configured correctly. The basic syntax for host is


    **host IP_address***


    For example, to test that 10.200.200.1 is being resolved to the correct DNS name,
    enter the following:


    **host10.200.200.1**'
  merge: -1
