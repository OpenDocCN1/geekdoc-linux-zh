    After you have configured file system trustee assignments, the

    user will only have access to those directories and files that you

    specified.


    # Configure CIFS Contexts


    Only users from configured CIFS contexts can access a CIFS server.

    CIFS contexts are controlled by the SYS:\etc\cifsctxxs.cfg file. This

    is a text file that simply contains a list of contexts for you

    want to get access to the CIFS server.


    By default, cfscftxs.cfg contains an entry with the Admin user''s

    context. For example, cfscftxs.cfg file on the server you

    ugraded to OES NetWare in Exercise 1-1 contains the following:


    OU=SLC.O=DA


    To add another context, you insert a line below the existing line and

    enter the context, as in the following example:


    OU=SLC.O=DA

    OU=IS.OU=SLC.O=DA'
  merge: -1
  pgno: 442
