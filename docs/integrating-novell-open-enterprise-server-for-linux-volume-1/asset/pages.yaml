  md: '# Prepare the Source and Destination Servers


    Before you launch the Server Consolidation Utility from the Server Consolidation
    and Migration Toolkit, you must prepare the source and destination servers by
    completing these steps:


    +   1. Ensure that all source and destination servers are running supported versions
    of NetWare, Linux, or Windows server software.


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_388_0.png)


    For complete details on supported versions of NetWare, Linux, or Windows, see
    “Supported Source and Destination Server Versions” on p. 18 of Novell Server Consolidation
    and Migration Toolkit (scmt11.pdf).


    This guide is available at http://www.novell.com/documentation/oes or from the
    OES_Docs directory on your 3077 Course CD.


    +   2. If necessary, apply the latest NetWare or Open Enterprise NetWare or (OES)
    Support Packs on both source and destination NetWare or OES servers.


    +   3. If copying data from and to NetWare servers, set the same code page for
    both the source and destination servers.


    If both servers don''t have the same code page, data will be lost during the consolidation.


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_388_1.png)


    For complete details on changing your server''s code page, see “Changing the NetWare
    Server Code Page” on p. 11 of the Novell Server Consolidation and Migration Toolkit
    (scmt11.pdf).


    This guide is available at http://www.novell.com/documentation/oes or from the
    OES_Docs directory on your 3077 Course CD.


    +   4. As a precaution, you should have a current backup of all file system and
    eDirectory data on the destination servers.'
