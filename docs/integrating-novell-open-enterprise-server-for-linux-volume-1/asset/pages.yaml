- img_proc: true
  md: '# Introduction


    The process of migrating to Novell Open Enterprise Server (OES) involves more
    than just knowing how to upgrade existing software or how to install and use the
    services included in Novell OES.


    A migration to Novell OES gives you the opportunity to re-evaluate your current
    network services and servers, considering options as a move to an open-source
    platform (Linux), consolidating services, upgrading services, and integrating
    NetWare and Linux in the same environment.


    In this section, you have the opportunity to evaluate Novell OES and make some
    initial decisions about purchasing and integrating Novell OES into your network
    environment.


    You also learn how to upgrade an existing NetWare 6.5 server to an OES NetWare
    server.


    For complete details on planning a Novell OES migration, refer to the Novell OES
    SP2 Planning and Implementation Guide (implgde.pdf).


    You can access the guide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 Course CD.


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_39_0.png)'
  merge: -1
