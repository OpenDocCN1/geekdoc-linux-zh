  md: '# OpenSSH and OES NetWare


    OpenSSH on OES NetWare uses encryption provided by Novell International Cryptographic
    Infrastructure (NICI) technology, rather than SSL to implement 128-bit (and stronger)
    encryption and contains fewer software import liabilities.


    In NetWare 6.5, Novell has integrated OpenSSH version 3.7p1. Through this secure
    shell, users who are Admin equivalent can gain remote access to any server in
    the network for copying files and directories with SSH utilities.


    When using OpenSSH on OES NetWare, you also need to know the following:


    +   - OpenSSH Components on OES NetWare

    - OpenSSH Utilities on OES NetWare

    - Unique OES NetWare OpenSSH Features


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_210_0.png)


    For complete information on OpenSSH and OES NetWare, refer to the Novell OES OpenSSH
    Administration Guide for NetWare (openssh.psf).


    You can access the guide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 Course CD.


    # OpenSSH Components on OES NetWare


    After you set up OpenSSH on your OES NetWare server, it should contain the following
    components in the indicated locations:


    +   - sshd.nlm (sys:\etc\ssh)

    - sshd_config (sys:\etc\ssh)

    - ssh_host_key (sys:\etc\ssh)

    - ssh_host_rsa_key (sys:\etc\ssh)

    - ssh_host_dsa_key (sys:\etc\ssh)

    - sshjini.nlm (sys:\system)'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# OpenSSH Utilities on OES NetWare


    The OpenSSH suite integrated with NetWare 6.5 includes the following:


    +   - The ssh program that replaces login and telnet


    +   - scp (replaces rcp)


    +   - sftp (an alternative to ftp)


    +   - sshd (server side of the package)


    +   - Other basic utilities like ssh-keygen or sftp-server


    OpenSSH supports SSH protocol versions 1.3, 1.5, and 2.0.


    # Unique OES NetWare OpenSSH Features


    The following tools and features are unique to OES NetWare OpenSSH implementation:


    +   - **OpenSSH Manager.** Any user that belongs to the sshadmin-Administrators
    group is granted access to the OpenSSH Manager to modify the configuration of
    OpenSSH servers.


    The OpenSSH Manager can be accessed via web browser ssl connection to port 2200.
    This tool lets perform tasks as viewing ssh connections, changing the sshd_config
    file easily, and setting log preferences.


    +   - **SSH log daemon.** This agent generates the log files that contain all
    the logs and errors from all ssh-type NLM™ programs such as ssh, ssh, sftp, or
    scp.


    +   - **Authentication.** OpenSSH uses password authentication through LDAP. This
    authentication gathers all the user’s credentials from Novell eDirectory.


    +   - sshlogd.nlm (sys:\system)'
