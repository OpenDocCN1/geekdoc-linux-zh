    # # Course Design


    The following provides information about the design of the course to help you
    evaluate whether or not this course provides the type of Novell OES training you
    need (in a classroom environment or for self-study):


    +   - Course Objectives

    - Course Audience

    - Prerequisite Knowledge

    - Certification

    - Novell Open Enterprise Server Training Path

    - Classroom Agenda


    # # Course Objectives


    The overall objective of this course is to prepare you to install or migrate a
    Novell OES service in a limited, non-critical production environment with few
    changes to the default settings by teaching you how to do the following:


    +   - Evaluate the value of a Novell OES service to your customers and employees.

    - Evaluate the hardware and software requirements necessary to implement a Novell
    Open Enterprise service.

    - Use your current Novell networking skills and experience to perform Novell OES
    administrative tasks on an OES Linux server.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '+   Perform basic administrative tasks on an OES Linux server using tools such
    as the Bash shell and YaST that are native to SUSE Linux Enterprise Server.


    +   Use Novell OES tools as OpenSSH, iMonitor, iManager, and Novell Remote Manager
    to manage Novell OES servers in a mixed OES NetWare and OES Linux network environment.


    +   Implement DNS and DHCP on an OES Linux server.


    +   Configure time synchronization in a mixed OES NetWare and OES Linux network
    environment.


    +   Migrate Novell Storage Services (NSS) and NCP from a NetWare server to an
    OES Linux server with little or no impact on user access.


    +   Provide access to data on an OES Linux server from a Windows workstation using
    the CIFS/Samba protocol.


    +   Migrate iPrint services on a NetWare server to an OES Linux server with little
    or no impact on printer access.


    +   Install the latest version of iFolder (3.2) on an OES Linux server.


    +   Implement other Novell OES end user services such as eGuide and NetStorage.


    The Integrating Novell Open Enterprise for Linux course also helps prepare you
    for the available Advanced Technical Training (ATT) Novell OES courses. We recommend
    that you become familiar with the content of this course before attending a Novell
    OES ATT course.


    # Course Audience


    We expect the audience for this course to include


    +   Novell software system administrators, integrators, and engineers


    +   Networking consultants'
  merge: -1
  pgno: 19
- img_proc: true
  md: '+   - Reseller/partner technical support staff


    +   - New Novell OES customers


    The *primary target audience for the Integrating Novell Enterprise Server for
    Linux* course is established Novell Net administrators who need to evaluate Novell
    OES services running on an OES Linux server or who administer or implement OES
    services on an OES Linux server.


    If you fit this audience, we expect that you are already familiar with Novell
    eDirectory and related tools such as iManager. However, you might have little
    or no experience using Linux.


    If you have little or no Linux experience, the exercises in the workbook give
    explicit instructions for dealing with the OES Linux operating system.


    However, to adequately manage OES services running on an OES Linux platform in
    a production environment, you should have the minimum of a CLP (Certified Linux
    Professional) certification-equivalent knowledge of SUSE Linux Enterprise Server.


    A *secondary target audience for the Integrating Novell Enterprise Server for
    Linux* course is a new Novell customer who is assigned to evaluate, administer,
    or implement enterprise services on an OES Linux server.


    If you fit this audience description, you might be a Windows or Linux network
    administrator unfamiliar with eDirectory or OES services but with experience administering
    infrastructure services (such as DNS and DHCP) on a Windows or Linux server.


    If you have little or no eDirectory experience, an introduction to eDirectory
    is provided in an eDirectory Fundamentals appendix in the *Integrating Novell
    Open Enterprise Server for Linux* course manual.'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'However, the appendix and the course exercises do not give you adequate experience
    or training to perform eDirectory administrative tasks such as troubleshooting.


    # Prerequisite Knowledge


    Before you start this course, we recommend that you have an understanding of the
    following:


    +   - CompTIA A+ objectives

    - CompTIA Network+ objectives

    - Fundamentals of Novell eDirectory (Course 3017) objectives

    - or

    - Equivalent networking and eDirectory experience (on NetWare, Linux, or Windows)


    We also recommend (but do not require) the following:


    +   - Some experience with eDirectory 8.7.3 or later through training, testing,
    or on-the-job experience

    - Basic experience with any Linux desktop or server in a computing environment
    such as an enterprise or academic environment or through a training course (such
    as 3071 - SUSE Linux Enterprise Server 10 Fundamentals)


    You do not need to have an extensive knowledge of Linux to successfully complete
    the exercises in the course.


    However, you do need to remember that adequately administer Novell OES services
    on an OES Linux server in a production environment, you need to have a Certified
    Linux Professional (CLP) certification-equivalent knowledge of SUSE Linux Enterprise
    Server 9 or 10.'
  merge: -1
