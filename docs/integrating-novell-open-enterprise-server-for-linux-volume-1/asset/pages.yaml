- img_proc: true
  md: 'The RBS Configuration page lets you list and modify RBS objects by type, and
    gives you useful information about the RBS system, such as


    +   * The number of modules in a collection

    * How many modules are installed or not installed

    * How many modules are outdated


    For some operations you can configure multiple objects at the same time. For example,
    you can associate multiple members with a role at the same time.


    If RBS Services has not yet been configured on iManager, you can select the link
    on the RBS Configuration page and follow the displayed instructions.


    The following tabs appear on the RBS Configuration page:


    +   * **2.x Collection.** This is the current collection of RBS objects.

    * **1.x Collection.** This is the older collection of RBS objects that you can
    either delete or migrate to 2.x.


    If you select **Migrate**, a wizard steps you through the migration process.


    You see only the collections you own:


    +   * **Modules** indicates the number of modules on the Web server that you are
    logged in.

    * **Installed** lists the modules that are currently installed. Outdated modules
    are listed, as well as modules that are available but not installed.


    You can create a new iManager role or new eGuide role on this page, and explore
    the content. You can also delete roles.


    Under Actions, you can select a member association, define its scope, and set
    rights (Inherited) from that scope down to that subtree. If this option is not
    selected, then rights are limited to the container.


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_276_0.png)'
  merge: -1
