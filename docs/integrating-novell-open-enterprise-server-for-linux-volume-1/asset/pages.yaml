  md: '# Student Kit Deliverables


    Your kit for the Integrating Novell Open Enterprise Server for Linux course contains
    the following:


    +   - Integrating Novell Open Enterprise Server for Linux Authorized Courseware
    (Volumes 1 and 2). This is the printed course manual that contains instructional
    and reference content.


    +   - Integrating Novell Open Enterprise Server for Linux Workbook. This is the
    printed manual that contains exercises and instructions for setting up a self-study
    environment.


    +   - 3077 Course CD. This CD contains the course manual in PDF format, the workbook
    in PDF format, and a readme file.


    In addition, there are several folders with the following:


    +   - exercises. This folder contains files used for the course exercises.


    +   - OES_docs. This folder contains all of the Novell OES documentation referenced
    in the course manual.


    +   - setup. This folder contains all the files you need (except for the VMware
    virtual servers) to set up the environment.


    +   - 3077 VMware Servers DVD. This DVD contains the DA1 Linux server and the
    DA2 NetWare server used in the course exercises.


    +   - 3077 VMware SLED 10 Workstation DVD. This DVD contains the SUSE Linux Enterprise
    Desktop 10 workstation used in the course exercises.


    +   - Novell OES SP2 CDs. You use these CDs in the course exercises to upgrade
    to Novell Open Enterprise Server (OES) to install Novell OES services.


    They include the following:


    +   - Novell OES SP2 NetWare Installation CD 1


    +   - Novell OES SP2 NetWare Installation CD 2


    +   - Novell OES SP2 Linux Installation CD 1'
