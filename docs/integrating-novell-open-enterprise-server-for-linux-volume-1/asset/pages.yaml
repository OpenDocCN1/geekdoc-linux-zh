    This can be useful if you already have a VMware virtual machine, but do not own
    a copy of VMware Workstation.


    Although you can install VMware Player on your DA-HOST Windows Professional workstation
    to run the curve virtual machines, there are some issues you need to understand
    before using VMware Player to complete the exercises:


    +   **VMware Player and VMware Workstation Installations.**

    You cannot install VMware Player and VMware Workstation on the same computer.

    If you have VMware Workstation 5.x available, we recommend installing and using
    it on the DA-HOST Windows XP Professional workstation.

    Using VMware Workstation lets you open several VMware virtual machines in the
    same window, switching machines by selecting tabs. You can also snapshot at critical
    points while performing the course exercises.

    If you have an earlier version of VMware Workstation, you will need to install
    and use VMware Player because the virtual machines can only run under VMware Workstation
    5.x.


    +   **Tabs vs. Windows.** While you can run several virtual machines at a time
    using VMware Player, each machine needs to be opened in a different window.


    However, VMware Workstation lets you open several virtual machines in the VMware
    Workstation window, and then tab from machine to machine.


    Intro-16


