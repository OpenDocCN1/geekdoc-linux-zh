  md: '# Exercise 2-3 Manage OES Linux Servers from a Command Prompt


    For experienced network administrators and engineers (especially those managing
    NetWare servers), knowing how to manage a server from a command prompt or console
    is critical.


    In fact, much of your time on a NetWare server is probably entering commands in
    the system console screen.


    In the previous exercises in this section, we''ve introduced you to some basic
    management tasks on an OES Linux server that you can perform from the KDE desktop.


    However, as with a NetWare server, you might prefer working from a console prompt
    on an OES Linux server.


    This can create challenges because many of the commands or utilities you use on
    a NetWare server are not available or work differently from an OES Linux command
    prompt.


    Table 2-4 in the Integrating Novell Open Enterprise Server for Linux course manual
    compares NetWare commands to equivalent commands or functionality in OES Linux.


    In this exercise, we introduce you to using some basic commands in OES Linux,
    and then help you compare commands you currently use in NetWare to those you might
    want to use to accomplish the same task in OES Linux.


    You do the following:


    +   * Use the bash shell in OES Linux.

    * Perform NetWare tasks in OES Linux.

    * Explore additional OES Linux commands.


    Exercise 2-3 Manage OES Linux Servers from a Command Prompt is in your Integrating
    Novell Open Enterprise Server for Linux Workbook on page 2-43.'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# Objective 4


    # Manage the Linux File System


    The Linux file system (and, in general, any UNIX system) is considerably different
    from that of other operating systems.


    To successfully manage an OES Linux system, you need to understand the basics
    of the following topics:


    +   - Linux File System Types

    - The Hierarchical Structure of the File System

    - FHS (Filesystem Hierarchy Standard)

    - Root Directory (/)

    - Storage Devices

    - File System Mount Points

    - User Directories (/home/)

    - Filename Restrictions


    # Linux File System Types


    OES Linux supports a number of native Linux file systems. You choose a file system
    based on the criteria and features that are most important to your enterprise.


    No single file system will meet your needs perfectly, but you can determine which
    will do the best job overall on criteria such as proven reliability, performance,
    disk space utilization, and application compatibility.


    When managing OES Linux, you should have a basic understanding of the relative
    strengths of three commonly used Linux file systems:


    +   - Ext2

    - Ext3

    - ReiserFS'
  merge: -1
  pgno: 176
- img_proc: true
  md: '# Ext2


    Ext2 is the longest lived and most heavily tested of the three most commonly used
    file systems. Before journaling file systems, ext2 was popular due to its successfully
    handling system outages to prevent data loss.


    Ext2 is not a journaling file system. It uses the e2fsck (file system check) utility
    to analyze file system data, bringing metadata into a consistent state, and writing
    pending files and data blocks to the lost+found directory.


    In contrast to journaling file systems, e2fsck analyzes the entire file system
    and not just the recently modified bits of metadata. This takes significantly
    longer than checking the log data of a journaling file system.


    Depending on file system size, the file system check can take an hour or more,
    so it is not desirable to choose ext2 for any server that needs high availability.


    On the other hand, due to ext2 not maintaining a journal, it uses significantly
    less memory and can perform faster than journaling file systems.


    # Ext3


    Ext3 is based on ext2. An ext3 file system can easily be built on an ext2 file
    system. The most important difference is that ext3 supports journaling.


    Ext3 offers the following major advantages:


    +   * Upgrades easily from ext2. Ext3 is based on the ext2 code and shares its
    on-disk and metadata formats, so upgrades from ext2 are very simple.


    Upgrading from ext2 to ext3 takes only a matter of minutes. It is also very safe,
    since it does not require recreating an entire file system from scratch.'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# Customizable Reliability vs Performance. Other journaling file systems follow
    the “metadata-only” journaling approach. This means your metadata is always kept
    in a consistent state but the same cannot be automatically guaranteed for the
    file system data itself.


    Ext3 is designed to take care of both metadata and data. The degree of “care”
    can be customized.


    In=journal mode, Ext3 offers maximum reliability (i.e., data integrity) but slows
    performance because both metadata and data are journaled.


    In=ordered mode, ext3 ensures both data and metadata integrity, but uses journaling
    only for metadata. This is less secure than data-journal mode, but offers a degree
    of consistency for metadata and data without sacrificing performance.


    In=writeback mode, ext3 writes the main file system after its metadata has been
    committed to the journal. This option optimizes performance but can allow old
    data to reappear in files after crash and recovery while internal file system
    integrity is maintained.


    Unless otherwise specified, ext3 is configured in data=ordered mode by default.


    # ReiserFS


    ReiserFS, a journaling file system, was introduced as an alternative to the ext2.
    Its key assets, in comparison with ext2, are better disk space utilization, better
    disk access performance, and faster crash recovery.


    The drawback to ReiserFS is that (like ext3 in data-writeback mode) it optimizes
    performance by focusing on metadata but can allow the data itself to become unreliable.


    OES Linux formats volumes with the ReiserFS file system by default.'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# The Hierarchical Structure of the File System


    The Linux file system is based on a hierarchical file system that can be depicted
    in the form of a tree.


    This tree is not limited to a local partition. It can stretch over several partitions,
    which can be located on different computers in a network.


    It begins at the root (where the name for the system administrator comes from)
    and branches out like the branches of a tree.


    The following illustrates a typical Linux file system tree:


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_179_0.png)


    A file in this tree is uniquely defined by its path. A path refers to the directory
    names that lead to this file.


    The separation character between individual directory names is the slash ("/).
    The path can be specified in two ways:


    +   - As a relative path starting from the current directory


    +   - As an absolute path starting from the root of the entire system tree'
  merge: -1
  pgno: 179
- img_proc: true
  md: 'The absolute path always begins with a slash (/), the symbol for the root directory,
    as in the following:


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_180_0.png)


    Sometimes it is necessary to specify the absolute path because certain files can
    only be uniquely addressed in this way. The length of the path cannot exceed 4096
    characters, including the slashes.


    # FHS (Filesystem Hierarchy Standard)


    The structure of the Linux file system is described in the Filesystem Standard
    (FHS). The FHS specifies which directories must be located on the first level
    after the root directory and what they contain.


    The FHS does not specify all details. In some areas it allows leeway for your
    own definitions. The FHS defines a two-layer hierarchy:


    +   - The directories in the top layer (immediately below the root directory "f/").

    - As a second layer, the directories under /usr/ and /var.


    Some of the important default FHS Linux directories include the following:


    +   - /etc. This directory contains configuration files.'
  merge: -1
  pgno: 180
- img_proc: true
  md: '+   - /dev. This directory contains special link files that reference hardware
    in the system. For example, /dev/fd0 references floppy disk A. The first IDE hard
    disk is referenced by /dev/hda.


    +   - /usr. This directory contains program files.


    +   - /var. This directory contains data such as spool directories, log files,
    man pages, and other temporary files.


    +   - /tmp. This directory stores temporary files created by running applications.


    +   - /home. This directory contains user home directories.


    +   - /root. This is the root user''s home directory.


    +   - /bin. This directory contains essential command-line utilities such as vi,
    rpm, ls, mkdir, more, mv, grep, and tar.


    +   - /sbin. This directory contains essential system executables such as fsck,
    grub, mkfs, arp, fdisk, and ifconfig.


    +   - /mnt. This directory is used to mount devices or remote file systems using
    Samba or NFS. On some Linux distributions (such as Red Hat) it is also used to
    mount removable devices.


    +   - /media. This directory is used to mount removable devices on some Linux
    distributions (such as SUSE Linux).


    You can find information about FHS at http://www.pathname.com/fhs/.


    # Root Directory (/)


    The root directory refers to the highest layer of the file system tree. Normally
    only directories (not files) are located here. When the system is booted, the
    partition on which this directory is located is the first one mounted.'
  merge: -1
  pgno: 181
- img_proc: true
  md: 'Because the kernel cannot fulfill all the tasks of the operating system, all
    programs that are run at the system start must be available on this partition
    (they cannot be located on another partition).


    The following directories always have to be on the same partition as the root
    directory: /bin/, /dev/, /etc/, /lib/, and /sbin/.


    # Storage Devices


    The physical storage devices installed in your computer managed through device
    nodes that are stored in the device directory (/dev).


    Device nodes are named according to the following convention:


    +   - /dev/fd0. First floppy disk drive.

    - /dev/hda. First IDE hard drive.

    - /dev/hdb. Second IDE hard drive.

    - /dev/sda. First SCSI hard drive.

    - /dev/sdb. Second SCSI hard drive.


    The device directory contains a device node not only for every storage device
    but for every network interface and SCSI controller attached to your system.


    > For details on Linux devices, see “Dynamic Device Nodes with udev” on page 223
    of the SLES 9 Administration and Installation Guide (sles_admin.pdf).


