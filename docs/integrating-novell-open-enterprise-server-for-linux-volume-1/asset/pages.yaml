  md: "# How to Install NSS on an OES Linux Server\n\nNSS is not installed by default\
    \ with Novell OS. Instead it is recommended as a post-installation procedure.\
    \ However, NSS is a service that you must plan for before installing OES Linux.\n\
    \nIf your system has a single hard drive, you must create an EVMS partition during\
    \ the OES Linux installation (see “NSS and EVMS on 5-52”).\n\nIf your system has\
    \ more than a single hard drive, you must still have EVMS partitions before you\
    \ can create EVMS volumes on OES Linux server.\n\nHowever, with more than one\
    \ hard drive, you can create EVMS partitions after installation on the other hard\
    \ drives that do not contain the system volumes.\n\nGiven that you have EVMS partitions\
    \ to create NSS volumes, you install NSS on OES Linux using the YaST utility by\
    \ doing the following:\n\n+   1. From YaST, select System > Novell Storage Services\
    \ (NSS).\n   YaST displays a message indicating that NSS is not installed.\n2.\
    \ To install NSS, select Continue; then insert the requested CD.\n3. After YaST\
    \ installs and configures the NSS packages, you authenticate to the LDAP server\
    \ so the NSS Unique Admin object can be created in eDirectory.\n   YaST then returns\
    \ to the Control Center page.\n4. The NSS installation is complete and you can\
    \ close YaST.\n\nOnce the installation is complete, you no longer use YaST for\
    \ NSS tasks. You create and manage pools and volumes from iManager or by using\
    \ the nssmu command line utility."
