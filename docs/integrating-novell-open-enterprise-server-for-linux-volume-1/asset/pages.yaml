  md: '# How to Set Permissions from the Command Line


    You can modify a file or directory’s permissions and ownershipnfrom the command
    line by using the following:


    +   - chmod


    +   - chown and chgrp


    # chmod


    You can use this command to add, remove, or assign permissionsnassigned to a file
    or directory. Both the owner of a file and root

    use this command.


    The following are examples of using the command chmod:


    | Table 2-6 | chmod command | Description |

    | --- | --- | --- |

    | | chmod u+x | The owner is given permission to execute the file. The permissions
    r and w stay as they are. |

    | | chmod g=rw | All group members can read and write. If the members had the
    execution permission before, it is removed. |

    | | chmod u=rwx | The owner receives all permissions. |

    | | chmod u=rwx,g=rw,o=r | The owner has all permissions, the group has read and
    write permissions, and all others have read permission. |

    | | chmod +x | All users (owner, group, and others) receive executable permission,
    depending on umask. |'
  merge: -1
  pgno: 190
- img_proc: true
  md: 'For example, entering the following chmod command lets all users

    in the group users write to the file hello.txt.


    ```

    geeko@earth:~ > ls -al hello.txt

    -rw-r--r-- 1 geeko users 0 2004-04-06 12:40 hello.txt

    geeko@earth:~ > chmod g+w hello.txt

    geeko@earth:~ > ls -al hello.txt

    -rw-rw--r-- 1 geeko users 0 2004-04-06 12:40 hello.txt

    ```


    With the option -R (recursive) and a specified directory, you can

    change the access permissions of all files and subdirectories

    the directory.


    Besides using the letters rwx to indicate permissions, you can also

    use groups of numbers.


    Every file and directory in a Linux system has a numerical

    permission value assigned to it. This value has three digits.


    The first digit represents the permissions assigned to the file or

    directory owner. The second digit represents the permissions

    assigned to the group associated with the file or directory. The third

    digit represents the permissions assigned to others.


    Each digit is the sum of the following three values assigned to it:


    +   - Read: 4

    - Write: 2

    - Execute: 1


    For example, suppose a file named myfile.txt has 754 permissions

    assigned to it.


    This means the owner of the file has read, write, and execute

    permissions (4+2+1), the group associated with the file has read and

    execute permissions (4+1), and others have read permissions (4).'
  merge: -1
  pgno: 191
- img_proc: true
  md: 'This is illustrated in the following:


    # Figure 2-20


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_192_0.png)


    The following are examples of using numerical values with chmod:


    # Table 2-7


    | chmod command | Description |

    | chmod 754 hello.txt | The owner has all permissions, the group has read and
    execute permissions, and all others have the read permission. |

    | chmod 777 hello.txt | All users (user, group, and others) receive all permissions.
    |


    These commands change the owner or group assigned to a file or directory.


    As user root, you can use the command chown to change the user and group affiliation
    of a file using the following syntax:


    ```

    `chown new_user.new_group file`

    ```'
  merge: -1
