  md: '# Access Modes


    When you start iManager, you are granted an access mode based on the rights you''ve
    been assigned. The mode you are in is displayed in the upper left corner of the
    iManager interface:


    Figure 3-13


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_272_0.png)


    iManager provides the following access modes:


    +   **Unrestricted Access.** This is the default mode before RBS is configured.
    It displays all of the roles and tasks installed.


    Although all roles and tasks are visible, the authenticated user still needs the
    necessary rights to use the tasks.


    +   **Assigned Access.** Displays only the roles and tasks assigned to the authenticated
    user. This mode takes full advantage of the RBS technology.


    +   **Collection Owner Access.** Displays all of the roles and tasks installed
    in the collection.


    This mode lets you use all of the roles and tasks in the collection, even if specific
    rights have not been assigned. RBS must be installed in order to use this mode.


    The collection owner sees all roles and tasks, regardless of role membership.'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# How to Initially Configure RBS


    iManager gives you the ability to assign specific responsibilities to users and
    to present them with the tools (and their accompanying rights) necessary to perform
    only those sets of responsibilities.


    This functionality is called Role-Based Services (RBS) and is a set of extensions
    to the eDirectory schema.


    You can use RBS to create specific roles within your organization; the roles contain
    tasks that a user performs. You can assign a role to a user who performs the tasks
    within iManager, such as creating a new user or changing a password.


    When iManager is installed in connection with Novell OES, various roles and tasks
    are configured and listed in the navigation panel of iManager:


    Figure 3-14


    ![](img/1dca8e8a8784dadffa032dcfe0460e55_273_0.png)'
  merge: -1
