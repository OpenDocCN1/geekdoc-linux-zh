  md: '# Objective 1


    # Manage OES Servers Remotely with OpenSSH


    Many users of telnet, login, ftp, and other such programs might not realize that
    their passwords and data are transmitted across the Internet unencrypted.


    OpenSSH is an open source SSH (Secure SHHell) package that encrypts all traffic
    (including passwords) to effectively eliminate eavesdropping, connection hijacking,
    and other network-level attacks.


    Additionally, OpenSSH provides a variety of secure tunneling capabilities.


    Novell OES provides the package OpenSSH on both OES Linux and OES NetWare. To
    effectively use OpenSSH for remotely performing basic administrative tasks on
    OES servers, you need to know the following:


    +   - Benefits of OpenSSH

    - OpenSSH and OES Linux

    - OpenSSH and OES NetWare

    - How to Use SSH Commands


    # Benefits of OpenSSH


    The following is a brief list of some of the benefits of integrating OpenSSH with
    Novell OES:


    +   - You can securely access and copy files in their home directories on OES
    Linux or OES NetWare servers from remote locations without using a browser or
    proprietary client.

    - You can gain remote access to any server in your network and copy files and
    directories to and from other servers in their networks using ssh utilities.'
  merge: -1
  pgno: 206
- img_proc: true
  md: '+   You can put ssh utility commands in script files to automate many routine
    tasks.


    +   Because the SSH client protocols have been ported to NetWare, you can use
    the SSH commands from a remote client or from a remote server on the network running
    NetWare 6.5 to copy files from one server to another server.


    +   SSH protocols let you connect to the server and automatically send a command,
    so the server will run that command and then disconnect. This means you can use
    automated processes.


    +   SSH protocols provide security of your data transmissions and communications
    across the Internet whether you are outside or inside a firewall. You can be confident
    that hackers will not be able to access your data.


    # OpenSSH and OES Linux


    The package OpenSSH is installed by default on OES Linux (SLES 9). The programs
    ssh, scp, and sftp are then available as alternatives to telnet, rlogin, rsh,
    rcp, and ftp.


    The following OpenSSH information is specific to OES Linux:


    +   How to Configure the SSH Server


    +   SSH Server Commands


    +   How to Configure the SSH Client


    For complete information on OpenSSH and OES Linux, refer to “SSH — Secure Shell,
    the Safe Alternative” on page 444 of the SUSE LINUX Enterprise Server 9 Administration
    Guides (sles_admin.pdf).


    You can access this guide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 Course CD.'
