- img_proc: true
  md: 'In these examples, the user root on the computer DA4 logs in as

    t user admin on the computer da4.da.com.


    +   * root@DA2:~ scp /etc/hosts da4.da.com:/tmp


    In this example, the user root copies the local file /etc/hosts to

    t sys/tmp directory on the computer da4.da.com.


    +   * root@DA2:~ ssh -X da4.da.com


    In this example, the user root logs in to the host da4 from da2

    using SSH. The connection is established with a graphical X11

    tunnel, allowing X11 applications started on da4 to be

    displayed on da2.


    +   * root@DA2:~ ssh -L 4242:da2.da.com:1110

    admin@da4.da.com


    In this example, the user root forwards the connection coming

    in on port 4242 of the local host da2 to port 1110 (POP3) of the

    remote host da4 via an SSH tunnel (port forwarding).


    By using port forwarding through an SSH tunnel, you can set

    un an additional secure channel for connections between the

    local host and a remote host.


    Privileged ports (0–1024) can only be forwarded by root on Linux.


    In addition, you can forward port queries addressed to a port of

    a remote host to the port of the local host (reverse port

    forwarding) by entering a comand similar to the following:


    +   * root@DA2:~ ssh -R 4242:da2.da.com:1110

    admin@da4.da.com


    In this example, queries coming in on port 4242 of the remote

    host da2 are reverse-tunneled via SSH to port 110 of the local

    host da2.


    If the host you want to forward to cannot be reached directly

    through SSH (for example, because it is located behind a

    firewall), you can establish a tunnel to another host running

    SSH, as in the following:'
  merge: -1
  pgno: 215
- img_proc: true
  md: '+   root@DA2:~ > ssh -L 4242:da4.da.com:110 admin@da1.da.com


    In this example, the user root forwards incoming connections on port 4242 of the
    local host da2 to the remote host da1 by way of an SSH tunnel.


    This host then forwards the packets to port 110 (POP3) of the host da4 by using
    an unencrypted connection.'
