- img_proc: true
  md: '# Objective 2 Configure eDirectory with ndsconfig


    In this course, you move an OES Linux server from its own eDirectory tree to an
    existing eDirectory tree with a NetWare server.


    You can accomplish much of this by using the eDirectory YaST module. However,
    for consistent reliability, Novell recommends that you use the ndsconfig utility
    to either install the server into an existing tree.


    You must be logged in as root to use ndsconfig. When ndsconfig is used with arguments,
    it validates all arguments and prompts for the username and password of an eDirectory
    user with administrative rights to the tree.


    Using ndsconfig, you can


    +   * Create a Tree

    * Add a Server into an Existing Tree

    * Remove a Server from the Tree


    ndsconfig uses the following syntax:


    ```

    ndsconfig type [-m modulename] [-S servername] [-t tree_name] [-n context] [-d
    path_for_DIB] [-L ldap_port] [-l ssl_port] [-e] -a admin_name

    ```


    You can use the following parameters:


    | Table 5-1 | Parameter | Use |

    |---|---|---|

    | Type | * new | Creates a new eDirectory tree. |

    | | * def | Creates a new eDirectory tree. |

    | | * add | Adds a server into a tree. |

    | | * rm | Removes a server from the tree. |

    | -S | Specifies the server name. |'
  merge: -1
  pgno: 337
- img_proc: true
  md: '# Table 5-1 Parameter Use


    | Parameter | Use |

    |---|---|

    | -t | Specifies the tree name to which the server will be added. |

    | -n | Specifies the context into which the server object is added. |

    | -d | Specifies the directory path where the database files will be stored. |

    | -L | Specifies the TCP port number on the LDAP server. |

    | -l | Specifies the SSL port number on the LDAP server. |

    | -a | Specifies the distinguished name of the User object that has supervisor
    rights to the context in which the server object will be created. |

    | -e | Enables clear text password for LDAP objects. |

    | -p | Installs the eDirectory server into an existing tree by specifying the
    IP address of a server hosting the tree. If this option is used, SLP is not used
    for tree lookup. |

    | -m | Specifies the module name to install. While installing a new tree, you
    can install only the ds module. After installing the ds module, you can add the
    LDAP and SAS services using the add command. If the module name is not specified,
    all 3 modules are installed. |

    | -o | Specifies the HTTP clear port number. |

    | -O | Specifies the HTTP secure port number. |'
  merge: -1
  pgno: 338
- img_proc: true
  md: '# Integrating Novell Open Enterprise Server for Linux


    | (continued) Table 5-1 Parameter | Use |

    | set | Sets the value for the specified eDirectory configurable parameters. If
    the parameter list is not specified, ndsconfig lists all the eDirectory configurable
    parameters. |

    | get | Lets you view the current value of the eDirectory configurable parameters.
    |

    | get help | Lets you view the help strings for the eDirectory configurable parameters.
    |


    # Create a Tree


    To create a new tree and install the Linux server in it, use the following syntax:


    ```

    ndsconfig new [-m modulename] [-i] [-S servername] [-t tree_name] [-n context]
    [-d path_for_DIB] [-L ldap_port] [-l ssl_port] [-e] -a admin_name

    ```


    A new tree is installed with the specified tree name and context. If the parameters
    are not specified in the command line, ndsconfig prompts you to enter values for
    each of the missing parameters.


    For example, to create a new tree named DIGITALAIR-TREE, to install the server
    in the O=DigitalAir context, and to create Admin in the O=DigitalAir context,
    enter the following command:


    ```

    ndsconfig new - DIGITALAIR-TREE -n O=DigitalAir -a CN=admin.lin O=DigitalAir

    ```


    If SLP has not been configured or if the Linux server is having trouble contacting
    a server in the tree, use the -p parameter to specify the IP address of a server
    in the tree. Alternatively, you can use the /etc/hosts.nds file to specify the
    IP address of a server in the tree.'
  merge: -1
  pgno: 339
- img_proc: true
  md: 'The /etc/hosts.nds file is checked before the server attempts to use SLP to
    locate the tree. This file does not exist by default—it must be created manually.
    To learn more about using this file, enter the following at the console prompt:


    # man hosts.nds


    > If entering man hosts.nds does not give you a man page, check your /etc/manpath.config
    file to make sure that /usr/man is included in the MANDATORY_MANPATH.


    # Add a Server into an Existing Tree


    To use ndsconfig to install the Linux server into an eDirectory tree, use the
    following syntax:


    ```

    ndsconfig add [-m modulename] [-S servername] [-p IP_address] [-t tree_name] [-n
    context] [-d path_for_DIB] [-L ldap_port] [-l ssl_port] [-e] -a admin_name

    ```


    A server is added to an existing tree in the specified context. If the context
    does not exist, ndsconfig creates the context and adds the server.


    For example, to add a server into an existing tree named DIGITALAIR-TREE in the
    SLC.DigitalAir context, use the following command:


    ```

    ndsconfig add -t DIGITALAIR-TREE -n OU=SLC.O=DigitalAir -a CN=admin.O=DigitalAir

    ```


    # Remove a Server from the Tree


    You can also use ndsconfig to remove the server from the tree. To this, use the
    following syntax:


    ```

    ndsconfig rm -a admin_name

    ```'
  merge: -1
