    # AUDACITY


    Linux Mint 缺少的另一个应用是数字音频编辑器。这诚然是合理的，因为并不是有多少人需要经常编辑数字音频。然而，如果你确实需要编辑音频文件，Audacity
    应用程序非常出色。而且它也适用于 Linux Mint。


    要安装 Audacity，请打开终端窗口并输入以下命令：


    ```

    sudo apt-get install audacity

    ```


    这将从 Linux Mint 存储库下载并安装 Audacity 及其依赖项。完成后，你可以通过点击 mintmenu、搜索“audacity”并点击 Audacity
    图标来运行 Audacity。


    然而，默认的 Audacity 缺乏将项目导出为 MP3 文件的功能。为了获得该功能，你需要安装 `LAME` 库，它赋予 Audacity 编码 MP3
    文件的能力。请注意，MP3 专利的所有权仍存在争议，因此使用 `LAME` 可能会存在法律责任问题。但是，如果你没有法律风险，可以使用此终端命令安装 `LAME`
    库：


    ```

    sudo apt-get install libmp3lame0

    ```


    这将赋予 Audacity 将项目导出为 MP3 文件的能力。


    # DROPBOX


    Dropbox 是一个实用的文件共享和同步服务，允许你免费通过互联网在不同机器之间同步文件。它对于备份重要文档、图片、MP3 文件、视频文件和其他数据非常有用。Linux
    Mint 提供了与 Nautilus 文件管理器集成的 Dropbox 客户端，安装非常简单。以下是操作方法。


    首先，通过在 mintmenu 中搜索“Terminal”（终端）或通过同时按下 `CTRL+ALT+T` 键来启动一个新的终端窗口。终端启动后，在提示符处输入此命令：


    ```

    sudo apt-get install nautilus-dropbox

    ```


    输入此命令，然后输入密码进行身份验证。`apt-get` 工具将为你下载并安装 Dropbox 客户端。


    安装完成后，再次进入 mintmenu，搜索“Dropbox”并点击 Dropbox 图标。Dropbox 应用程序将启动，并要求你下载 Dropbox 的专用
    Linux 守护进程。你需要下载该守护进程才能使用 Dropbox，因此请允许安装。


    完成后，Dropbox 将启动。输入你的 Dropbox 凭据，即可开始在 Linux Mint 上使用 Dropbox。


    # FILEZILLA


    Linux Mint 同时带有内置的命令行 SFTP 和 FTP 客户端，但如果你发现自己经常需要处理文件上传工作，你可能更倾向于切换到图形化 FTP 客户端以方便使用。幸运的是，流行的
    FileZilla FTP 客户端适用于 Linux Mint，且安装非常简单。


    首先，通过在 mintmenu 中搜索“Terminal”（终端）或通过同时按下 `CTRL+ALT+T` 键来启动一个新的终端窗口。终端启动后，在提示符处输入此命令：


    ```

    sudo apt-get install filezilla

    ```


    输入此命令，然后输入密码进行身份验证。`apt-get` 工具将为你下载并安装 FileZilla FTP 客户端。


    安装完成后，再次进入 mintmenu，搜索“FileZilla”并点击 FileZilla 图标。应用程序启动后，你可以通过进入“文件”菜单、选择“站点管理器”（Site
    Manager）并输入你想要连接的站点信息来创建一个新连接。


    ***


    # 第 17 章 - 游戏


    到本书为止，我们讨论了大量的命令行、服务器应用和桌面生产力应用，但你也可以在电脑上享受乐趣。（当然，安装 Samba 本身也是一种特殊的乐趣！）Linux
    Mint 拥有丰富的电脑游戏软件，在本章中，我将讨论我最喜爱的几个。


    然而，我们必须首先做一个令人感到尴尬的坦白：Linux Mint 上的游戏体验通常不如微软 Windows 机器、iPad 或 iPhone 或 Kindle
    Fire 等移动设备，以及 XBox 或 Playstation 等专用游戏机的体验。这是因为虽然 Linux 在服务器领域占据主导地位，但其桌面端使用份额仅占极小比例，因此主要的游戏发行商倾向于仅为
    Windows 机器、移动设备和游戏机发布游戏。（事实上，当游戏发行商同时发布 Windows 和 Mac OS X 版本的游戏时，往往会引起不小的波动。）使用
    `Wine` 在 Linux Mint 上运行主要的 Windows 游戏是可能的，但这需要大量工作且并不总是可靠（我们将在下一章中详细讨论这一点）。


    话虽如此，在本书第一版出版后的六年里，情况已经发生了很大变化。最大的游戏平台 Steam 现在可以在 Linux Mint 上运行，许多游戏也已针对 Linux
    Mint 推出。另一个流行的游戏商店 GOG.com 通过 `DOSBox` 工具为 Linux Mint 提供了许多经典的 DOS 游戏，甚至还有几款像《永恒之柱石》（Pillars
    Of Eternity）或《光速迷航》（FTL）这样较新的游戏。


    由于过去几年的变化，Linux Mint 拥有的原生游戏已经变多。我们将讨论一些经典的。在 Linux 上玩现代 Windows 游戏是一项挑战，但玩老 DOS
    游戏则轻而易举，我们将教你如何操作。


    ## 象棋


    Mac OS X 和某些 Windows 版本带有一个象棋游戏，但 Linux Mint 没有。Linux Mint 带有通常的免费游戏——纸牌、方块游戏、益智游戏——但没有象棋。幸运的是，让
    Linux Mint 恢复与与 OS X 和 Windows 相同的象棋水平非常简单。有一个名为 GNOME Games 的软件包，其中包含了象棋。由于 `GNOME
    Games` 软件包是 Linux 原生的，因此在 Linux Mint 上安装非常简单。


    只需进入终端并输入此命令：


    ```

    sudo apt-get install gnome-games

    ```


    输入密码进行身份验证，apt 将下载并安装缺失的 GNOME Games。安装完成后，你可以点击 mintmenu 并搜索“Chess”找到象棋。你还通过
    GNOME Games 包获得了近十种免费游戏；我最喜欢的是 `Quadrapassel`，它是经典俄罗斯方块游戏的克隆版。


    ## 维诺斯之战


    在回合制策略游戏中，你收集资源、组建军队并带领你的部队与对手战斗。在幻想回合制策略游戏中，你不仅要做上述这一切，还可以使用魔法火球和闪电击败对手，并召唤巨龙、精灵等魔法生物充实你的军队。《维诺斯之战》（The
    Battle For Wesnoth）是一款免费的回合策略游戏，适用于 Windows、Mac 以及几乎所有的 Linux 平台。这是一个志愿者支持的项目，该游戏自
    2003 年起就存在。从 2006 年左右我就偶尔玩它，在过去段时间里，《维诺斯》取得了巨大的进步。目前的《维诺斯之战》版本流畅、精良且非常有趣。


    最棒的是，《维诺斯》在 Linux Mint 上安装既免费又简单。若要安装“维诺斯”，只需进入终端提示符并输入此命令：


    ```

    sudo apt-get install wesnoth

    ```

