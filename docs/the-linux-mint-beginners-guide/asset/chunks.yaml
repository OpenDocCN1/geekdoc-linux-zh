    Enter your password to authenticate, follow the default prompts, and apt will
    download and install the Apache web server for you.


    And that’s it! Apache should now be working. To test it from the web server itself,
    go to a web browser and visit the address http://127.0.0.1\. You’ll remember that
    this is the “local loopback” address, basically the address the computer uses
    to refer to itself. Alternatively, you could test it from another computer on
    the same subnet. For instance, if you installed Apache on a computer with an IP
    address of 192.168.1.100, you could test it by going to another computer on the
    same subnet and visiting http://192.168.100 from the web browser.


    Regardless, if Apache is working properly, you should see the default Apache/Linux
    Mint web page with the Linux Mint logo in the upper left-hand corner.


    Apache is now operational.


    The next step to install WordPress is to install the MySQL database server. Return
    to the Terminal and type this command:


    sudo apt-get install mysql-server-5.7


    (As of this writing, MySQL Server version 5.7 is the latest version available
    in the Linux Mint repositories, though future versions of Linux Mint may receive
    the newer versions of MySQL.)


    Enter your password to authenticate, and apt will download the MySQL files and
    install them for you. It’s a big set of files, so depending on the speed of your
    Internet connection, it might take a while to download. After the files are downloaded
    and are installing, the installer will ask you for a password for MySQL’s root
    user. Just as the root user in Linux has complete control over the system, the
    root user in MySQL has absolute control over all databases, tables, permissions,
    and users. For obvious security reasons, you’ll want to create an extremely strong
    password (a mixture of uppercase, lowercase, numbers, and punctuation, the longer
    the better) for your MySQL root user.


    (Note that in the password dialog box, if you can’t get the <OK> field selected,
    you can use the tab key to jump from the text input line to the <OK> field.)


    After you enter the root password, the installer will finish working with the
    MySQL files, and return you to the command line.


    Next, you’ll want to run the mysql_secure_installation script to tighten up security
    on your new MySQL server. Run this command from the prompt:


    sudo mysql_secure_installation


    First, the mysql_secure_installation script will ask you to enter the current
    password for the MySQL root user. After you do that, it will ask if you want to
    change the root password. Since you already set a root password, you can hit “n”
    (unless you want to change it again for some reason).


    Next, the script will ask you to setup the VALIDATE PASSWORD plugin, which checks
    passwords for appropriate strength. Hit Y to accept, and then set the password
    strength level by hitting 0 for Low, 1, for Medium, and 2 for Strong.


    Next, the script will ask if you want to remove the anonymous user. The anonymous
    user, like anonymous access in FTP, lets someone log into MySQL without having
    a proper user account. For security reasons, it’s always best to remove the anonymous
    user, so hit “y” to continue.


    After that, the script will ask if you want to prevent the MySQL root user from
    logging in remotely to the MySQL server. Always hit “y” to forbid root remote
    access, since if an attacker guesses your root password, he can destroy your databases
    or steal the information they contain.


    After this, the script will ask if you want to remove the test database. MySQL
    includes a test database that anyone can access. Again, this is a security hole,
    so you’ll want to hit “y” to remove the test database.


    The script will then ask to reload the privilege tables so the changes take effect.
    Hit “y”, and the **mysql_secure_installation** script will conclude and return
    you to the command line.


    MySQL server is now installed on your Linux Mint system.


    Now we’ll need to prepare MySQL for use with Moodle. Moodle requires a database
    and a database user, and full permission for its database user to access its database.
    To start the MySQL command-line client, use this command:


    mysql -u root -p


    Enter the password for the MySQL root user, and you’ll find yourself at the MySQL
    command prompt, which will look like this:


    mysql>


    Our next steps are to create a Moodle database, create a user to access that database,
    and grant our new user all rights to the Moodle database.


    (An important note before we continue, though. All commands made from the MySQL
    prompt must end with a semicolon to denote the end of the statement. Any commands
    that do not end with a semicolon will not work. With that in mind, let’s first
    create a database.)


    To create a database for Moodle, use this command at the mysql> prompt:


    CREATE DATABASE moodle;


    The MySQL client will respond with a message that should say “Query OK, 1 row
    affect (0.00 sec).” This means the command was successful, and a new database
    named “newdatabase” has been created.


    Next, you''ll create a user who will access that database and assign a password
    to that user. In this example, we''ll assign a password of "1234". However, in
    real life, just as with the root user, you''ll want to assign a strong password.
    (This database user won''t have full control over the MySQL user as the root user
    does, but we will give it full control over the database we just created, and
    a malicious user who guesses the password could cause all kinds of trouble.):


    **CREATE USER moodleuser IDENTIFIED BY ''1234'';**


    Again you should get the "Query OK" confirmation message. The final step is to
    assign all privileges on the “moodle” database to the “moodleuser” user. Use this
    command to assign the permissions:


    GRANT ALL PRIVILEGES ON moodle.* TO moodleuser IDENTIFIED BY ‘1234′;


    That isn’t a typo – those are single quote marks (‘) instead of the usual double
    quote marks (“) that were used in the command to set the password. MySQL’s internal
    syntax, alas, isn’t always consistent. Anyway, if you typed the command correctly,
    you should get the “Query OK” confirmation again.


    Once you are done, use this command to quit the MySQL command-line interface:


    exit


    The next step to installing Moodle is to install PHP version 5, along with the
    necessary PHP modules. First, install PHP 5 with this command:


    sudo apt-get install php


    Next, install the libapache2-mod-php7.0 library, which allows PHP to communicate
    properly with Apace:


    sudo apt-get install libapache2-mod-php7.0


    After this, you will need to install several different PHP extensions not included
    with the default PHP 5 implementation on Linux Mint. First, install the MySQL
    module for PHP:


    sudo apt-get install php-mysql


    You must also install the GD library for PHP:


    sudo apt-get install php-gd


    The JSON extension is also required:


    sudo apt-get install php-json


    The CURL extension:


    sudo apt-get install php-curl


    The XML extension:


    sudo-apt-get install php-xml


    The XMLRPC extension:


    sudo apt-get install php-xmlrpc


    The ZIP extension:


    sudo apt-get install php-zip


    The MBSTRING extension:


    sudo apt-get install php-mbstring


    The SOAP extension:


    sudo apt-get install php-soap


    And, finally, the INTL extension:


    sudo apt-get install php-intl


    After all the plugins have installed, restart Apache so it recognizes the plugins
    properly:


    sudo /etc/init.d/apache2 restart


    Finally, download the Moodle software to your Desktop. You can obtain it from
    this address:


    http://download.moodle.org


    Move the Moodle files over to the /var/www/html directory. (In this command, I’ll
    assume you unpacked the moodle files to your home directory; you will have to
    adjust the command if you unpacked them in a different directory.)


    sudo cp -r ~/moodle/* /var/www/html


    After that, rename the old index.html file in /var/www so Apache uses Moodle’s
    PHP files for the site, not the index.html file:


    sudo mv index.html index.html.old'
