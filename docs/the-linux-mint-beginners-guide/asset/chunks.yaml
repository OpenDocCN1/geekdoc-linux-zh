- fmt: '

    EPUB is the second dominant ebook format. Established in 2007, it evolved out
    of the old Open eBook standard. EPUB is an open standard, which means that anyone
    can use it without paying license fees. It is comparatively easy to work with,
    too, since it relies upon `CSS` and `XHTML` for the book layout. Barnes & Noble
    uses EPUB for their online store, along with Kobo, Google Play, and most of the
    other major ebook vendors.


    (To generalize, Amazon uses MOBI, while pretty much everyone else uses EPUB.)


    Because of this, there’s an annoying two-way split in the world of ebooks, much
    like the old fight over Betamax and VHS in the dawn of the VCR era. Many devices
    only read MOBI and not EPUB and vice-versa. Fortunately, a number of free tools
    exist to convert one format to another, which we shall discuss in the next section.


    ## CONVERT AND MANAGE EBOOKS WITH CALIBRE


    Because ebooks are often much cheaper than physical books, it is easy to quickly
    accumulate a large collection. Managing and organizing an ebook library can become
    something of a challenge. To make matters more complicated, the format war we
    discussed in the previous section means that some ebooks will work with one device,
    and others will not, and very few will work on both.


    Fortunately, a free application called Calibre can solve a number of these problems.
    Originally developed in 2006, Calibre is an ebook management program. It automatically
    sorts your ebooks by title and author, which makes locating any single title much
    easier. It also can convert most ebook formats, allowing you to smoothly move
    from EPUB to MOBI and back again (so long as the files are not encrypted – Calibre
    cannot read ebook files protected by digital rights management technologies –
    DRM). Calibre also contains a built-in ebook reader that can handle most ebook
    formats.


    Calibre is also very easy to install, and you can install it through the Linux
    Mint Software application. (We discussed how to use the Linux Mint Software application
    to install software in Chapter 4.) It is, of course, quicker and easier to install
    Calibre using this terminal command:


    ```bash

    sudo apt-get install calibre

    ```


    Enter your password to authenticate, follow the default prompts, and `apt` will
    install Calibre for you.


    After the installation is complete, you can launch Calibre via searching for it
    through the `mintmenu`. The first time Calibre runs, you’ll see a wizard asking
    for some configuration options: where to store your Calibre library, what eBook
    reader you use (if any), and what settings that eBook reader uses. Enter the appropriate
    information, and you can start using Calibre.


    Calibre''s `GUI` is reasonably easy to use, and the program includes a complete
    manual (in ebook form, of course).


    ## CREATE EBOOKS WITH SIGIL


    Reading ebooks is simple enough, but suppose you want to create an ebook? Where
    do you start?


    The free Sigil application is a WYSIWYG (“what you see is what you get”) editor
    that allows you to create EPUB files. Sigil is, as an application, fairly bare-bones,
    but with a bit of practice, you can create elaborate EPUB books with relative
    ease. (The EPUB version of this book was created with Sigil.) Sigil also lets
    you view the underlying `XHTML` code of an EPUB book, allowing you to make advanced
    changes to your book. Even better, it only takes a few terminal command to install
    Sigil on Linux Mint.


    Here’s how to do it.


    First, launch the Terminal by hitting the `CTRL+ALT+T` keys simultaneously, and
    then enter this command:


    ```bash

    sudo apt-get install sigil

    ```


    Enter your password to authenticate, and Linux Mint will download and install
    Sigil for you.


    Once the installation is complete, you can launch Sigil by going to the `mintmenu`,
    searching for "Sigil", and clicking on its icon.


    ***


    ## Chapter 20 - Converting Audio and Video


    Almost all modern computers are “multimedia” computers – that is, they can play
    sound and video. This was not always the case – early personal computers relied
    entirely upon text-based interfaces, and only gradually added support for images,
    sounds, and video playback. In Linux Mint, the text-based interface has not gone
    away (most of this book has discussed using the `command line`, after all), but
    a Linux Mint system is just as capable with multimedia as any `Windows` box or
    Macintosh laptop.


    In this chapter we’ll discuss how to convert different multimedia formats, but
    first we’ll take a look at those multimedia formats themselves.


    ### WHAT IS A FILE FORMAT?


    When we talk about a multimedia file format, or a “codec”, we refer to a way of
    storing audio and video data in digital form. A sound or video is an analog form
    of data (basically, a long wave). Computers, however, store data in digital format
    – in long strings of ones and zeroes. A “codec”, therefore, is a piece of software
    that converts those ones and zeroes into an analog wave that you can play over
    your computer speakers.


    As you might expect, there are many different standards for converting the ones
    and zeroes to analog waves and back again, and we’ll look at a few of those competing
    standards in the next section.


    ### AUDIO FILE FORMATS


    There are several competing formats for music and audio files. However, one of
    them is clearly dominant – the MP3 format. Developed in 1993 by the Moving Pictures
    Expert Group, MP3 is the most common format for digital music files. Almost all
    the major online retailers sell music files in MP3 format, and almost all operating
    systems either play MP3 files by default or can easily acquire the capacity to
    play them.


    Despite its ubiquity, MP3 is encumbered with a number of legal problems. Due a
    complicated series of lawsuits, no one is entirely certain who owns some of the
    patents connected with MP3, so anyone wanting to use the MP3 codec with their
    software or hardware needs to pay a licensing fee.


    Though MP3 is the major digital audio format, there are several other significant
    ones as well. Windows Media Audio, WMA, is the default media format for Microsoft
    `Windows`, and in the late 90s and early 2000s, Microsoft hoped it would replace
    MP3. However, the Apple iPod came to dominate the digital music market during
    the 2000s, and Apple obviously had no interest in using one of Microsoft’s formats.
    These days, WMA tends to only play on Windows machines and devices, and little
    else.


    AAC, Advanced Audio Coding, is another major audio format, as it is the default
    audio format for Apple’s iTunes software. AAC is designed to be the eventual replacement
    for the MP3 standard, and can compress more information into a smaller space than
    MP3.


    A final major audio format is OGG/Vorbis. Unlike the other major formats mentioned
    here, OGG/Vorbis is free and open source, which means that companies can use it
    without paying licensing fees. Therefore Linux Mint supports it without any additional
    packages. However, OGG/Vorbis remains in the minority, and only a very small amount
    of digital media is available in the format.


    ### VIDEO FILE FORMATS


    Unlike audio file formats, there is not yet a single dominant video format, but
    instead several major competing ones.


    The oldest of the common video formats is Audio Video Interleave, or AVI. Introduced
    by Microsoft in the 1990s, AVI is comparatively primitive. Its biggest flaw is
    that it supports no compression whatsoever, which means that AVI files can become
    absolutely enormous. However, AVI works with numerous different applications and
    devices, so it remains in use.


    WMV, Windows Media Video, is another major video format, the cousin to Microsoft’s
    Windows Media Audio format. WMV, unlike AVI, is compressed. Numerous digital camcorders
    make use of WMV by default, so it is quite common.


    Another major format is the MP4 format, and is perhaps the most widely used format
    of the ones we will discuss here. A variant version of MP4 is the default format
    of Apple’s QuickTime software (known as MOV files), and due to the Macintosh’s
    popularity with video editing, MP4 files are quite common.

