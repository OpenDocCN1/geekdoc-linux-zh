    Although every precaution has been taken in the preparation of this work, neither
    the author nor the publishers shall have any liability to any person or entity
    with respect to any loss or damage caused or alleged to be caused directly or
    indirectly by the information contained in this work.


    ## Introduction


    Welcome to the second edition of “The Linux Mint Beginner''s Guide”. If you are
    a new Linux Mint user, you''ve come to the right place. Linux Mint is a powerful
    and versatile modern operating system, and you can use its desktop edition to
    perform a wide variety of tasks, ranging from office work and Internet browsing
    to listening to music and playing games. In this book, we''ll introduce you to
    the basics of using Linux Mint and working with its interface.


    ### WHAT IS LINX MINT?


    What exactly is “Linux Mint”, though?


    “Linux” refers generally to a family of free operating systems based upon the
    `Linux` kernel (a `kernel` is the core component of any operating system). The
    history of Linux is long and complex, but we can provide a brief sketch here.
    In the late 1960s and 1970s, AT&T’s Bell Labs developed the `UNIX` operating system,
    which was soon used in university computer labs across the United States.


    However, AT&T retained the rights to the `UNIX` code, which meant that people
    could not freely alter or distribute it. In response to this, computer programmer
    Richard Stallman launched the `GNU` Project in 1983. (`GNU` stands for "GNU’s
    Not Unix.") Stallman’s goal with the `GNU` Project was to create a `UNIX`-like
    operating system that was nonetheless free to alter and distribute under the principle
    of “Free Software”, a philosophical position which argued that software should
    be free to distribute and alter without legal restrictions. The `GNU` Project
    and Stallman himself produced a large number of software tools and programs. Unfortunately,
    the `GNU` Project lacked a viable kernel, the necessary core of any operating
    system.


    This changed in 1991 when a Finnish university student named Linus Torvald became
    frustrated with the academic licensing for `Minix`, a `UNIX`-like operating system
    restricted to educational use. Torvalds wrote his own kernel, named it `Linux`,
    and released it under the `GNU` free license. Combined with the `GNU` project,
    the `Linux` kernel provided a freely available operating system – an operating
    system that people could modify and distribute however they saw fit.


    Linux had been born.


    (Many people insist that the proper name of Linux should in fact be `GNU/Linux`,
    in recognition of GNU’s vital role, and many `GNU` programs are used in Linux
    to this day.)


    Under the terms of `GNU`’s General Public License (`GPL`), anyone could modify
    and distribute Linux. Today, Linux and Linux variants run on every different computing
    platform, from smartphones to desktop computers to high-end server systems. (Even
    Amazon''s Kindle and Barnes & Noble''s Nook e-reader devices are powered by custom
    versions of `Android`, a version of Linux designed for smartphones and tablets.)
    These different flavors of Linux are called Linux “distributions.” Some distributions
    are commercially supported endeavors, like `Red Hat Linux` or `SuSE Linux`, while
    others are free and community-supported, like `Knoppix` or `Fedora`.


    One of the more venerable distributions is `Debian`, started in 1993 by a German
    programmer named Ian Murdock. Debian is well-known for its stability and its strong
    devotion to free software principles. Unfortunately, Debian also has a famously
    slow release cycle. Because of this, Debian is frequently “forked” – a “fork”
    is when the code of an open-source project (which is free to share and distribute)
    is used as the foundation for another open-source project.


    Linux Mint is derived from `Ubuntu`, one of these forks. Started by South African
    entrepreneur Mark Shuttleworth through his company `Canonical`, Ubuntu focused
    on providing a smooth experience for the end users, offering a version of Linux
    for people with little experience with Linux or even with computers in general.


    Linux Mint began as a fork of `Ubuntu` in 2006, founded by a developer named Clement
    Lefebvre. As Ubuntu made some controversial design decisions in 2011 and 2012,
    more and more users began migrating to Linux Mint. Currently, Linux Mint is one
    of the most popular Linux desktop distributions, and releases a new update twice
    a year.


    ### THE PURPOSE OF THIS BOOK


    The purpose of this book is to give the reader a basic introduction to using the
    Linux Mint operating system. This book is not intending as a comprehensive overview,
    but as an introduction to Linux Mint – enough information to get you started and
    to get you comfortable using Linux. In this book, we''ll focus first on using
    the graphical interface, and then the command line itself.


    If you have more interest in learning the command line itself, you can check out
    my other book – THE LINUX COMMAND LINE BEGINNER''S GUIDE.


    (As an aside, Linux Mint is closely based on Ubuntu, which means many of the command-line
    operations described in this book will also work on most versions of Ubuntu.)


    ### ERRATA


    I have done my best to make sure all the information in this book is accurate
    and timely, and tested every command and procedure described in the following
    chapters. However, I am only mortal, and undoubtedly I have made mistakes. If
    you notice any errors, you can email me at `jmcontact @ jonathanmoeller.com` to
    let me know. The advantage of ebooks over paper books is that ebooks are vastly
    easier to update and revise, and I can quickly introduce a revised and updated
    edition to correct any mistakes. (Another advantage of an ebook is that you can
    have it open on your computer screen as you work, rather than having to look down
    at a paper book on your desk.)


    A NOTE ON SCREENSHOTS


    Since Linux Mint is a graphical operating system, this book includes many screenshots
    to illustrate the descriptions of the graphical user interface. However, if you
    are using a grayscale eInk reader, the screenshots may not be easy to view. If
    you have difficulty viewing the screenshots, I suggest reading the book on a tablet
    device, or on a PC screen using an ebook reading application.


    NOTES ON THE SECOND EDITION


    After five years, I am pleased to issue the second edition of the Linux Mint Beginner''s
    Guide! Several chapters have been added, dealing with ebooks, media, and gaming,
    and all the existing chapters have been updated.


    ## Chapter 1 – Installing and Upgrading Linux Mint

