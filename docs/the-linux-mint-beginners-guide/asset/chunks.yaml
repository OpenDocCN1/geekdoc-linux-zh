  trans: '

    现在我们已经下载了软件，接下来需要对其进行配置。


    你需要为 Moodle 创建一个存储数据文件的位置。传统上，该位置位于 `/var/moodledata`。（在 Web 服务器目录内创建数据目录是一个极其糟糕的主意，因为这会导致安全漏洞。）使用此命令创建数据目录：


    ```

    sudo mkdir /var/moodledata

    ```


    使用此命令将目录的所有者更改为 Apache 系统用户。在 Linux Mint 中，Apache 系统用户通常命名为 `www-data`：


    ```

    sudo chown www-data /var/moodledata

    ```


    然后，使用此命令让 `/var/moodledata` 目录对 Moodle 可写：


    ```

    sudo chmod -R 744 /var/moodledata

    ```


    现在现在配置和设置已经完成，我们实际上准备好开始安装 Moodle 了！


    打开 浏览器并导航到 Moodle 所在地以启动基于 Web 的安装程序。如果你的服务器 IP 地址（例如）是 `192.168.1.100`，那么地址看起来如下：


    http://192.168.1.100


    这将带你进入 Moodle 设置页面。


    首先，为你的 Moodle 安装选择语言，然后点击“Next”（下一步）按钮。


    随后，安装程序会你 Moodle 目录的位置。默认设置是可以行的，特别是如果你已经按照上面所示创建了 `/var/moodledata` 目录。点击“Next”（下一步）按钮继续。


    Moodle 然后会询问使用什么种类型的数据库服务器。由于我们已经好了 MySQL 数据库，请选择“Improved MySQL”（改进的 MySQL），然后点击“Next”（下一步）按钮。


    随后安装程序需要输入我们之前创建的数据库和数据库用户信息。由于我们的 MySQL 服务器与 Moodle 位于同一台机器上，请在数据库主机（Database
    Host）字段中留留 `localhost`。数据库名称输入 `moodle`，数据库用户输入 `moodleuser`，数据库密码输入 `1234`。将其他字段留空，然后点击“Next”（下一步）。


    Moodle 然后将生成一个 `config.php` 文件。复制并粘贴 `config.php` 文件的数据，将其保存为 `config.php`，然后将其传输到你的服务器。确保将其放在包含
    Moodle 安装的目录中——在本例中，为 `/var/www`。一旦 `config.php` 就位，确保使用此命令将其标记为可执行，否则安装将停止：


    ```

    sudo chmod 744 /var/www/html/config.php

    ```


    保存 `config.php` 文件，然后回到浏览器并点击“Next”（下一步）按钮。


    Moodle 然后会询问你是否同意服务条款。如果你同意，点击“Continue”（继续）按钮。


    安装程序随后将运行系统检查，以确保你的服务器拥有所有支持 Moodle 的必要软件。如果没有（通常会忘记其中一个 PHP 扩展），安装将暂停以允许你安装缺失的软件。一旦完成，点击“Reload”（重载）。如果所有检查都通过，你可以点击“Continue”（继续）按钮继续。


    Moodle 安装程序将开始在之前之前创建的数据库中构建它所需的数据库表。Moodle 数据库庞大且复杂，构建数据库可能需要大量时间，请保持耐心。随着安装程序成功构建数据库表，它们将在浏览器窗口中滚动。一旦数据库构建完成，“Continue”（继续）按钮将出现在页面最底部。点击它继续。


    Moodle 然后将显示一个表单，让你为新站点设置管理员账户。输入合适的用户名和强密码，以及任何其他必填字段。完成后，点击页面底部的“Update Profile”（更新配置）按钮。


    安装随后会要求你为站点选择一个全站名称和一个短名称。选择合适的名称，然后点击“Save Changes”（保存更改）按钮。


    恭喜你！你的 Moodle 安装现在已完成，你可以开始添加课程和其他材料了。如需更多文档，Moodle 站点包含许多有用资源：


    http://docs.moodle.org/26/en/Main_page


    ***


    ## 第 16 章 -适用于新 Linux Mint 桌面安装的六个最佳应用程序


    我们一直在研究如何将 Linux Mint 设置为服务器平台，但在本章中，我们将转换方向，查看 Linux Mint 桌面可用的一些最佳应用程序。


    Linux Mint 优于 Microsoft Windows 的一大优势之一是，标准的 Linux Mint 软件安装中包含了大量的应用程序。使用 Microsoft
    Windows，你只会得到几个游戏、几个实用工具和一个 WordPad（后者甚至不包含拼写检查）。相比之下，Linux Mint 带有丰富的预装软件。它包含了
    LibreOffice，一个功能完备的免费软件件。它还带有各种游戏、音频和视频工具、实用工具、生产力应用等。事实上，许多用户不需要安装额外的软件，仅仅因为
    Linux Mint 包含的应用程序已经足够满足他们的需求。


    然而，有很多 Linux Mint 安装光盘中未包含的优秀应用程序。在本章中，我们将查看 Linux Mint 的六个最佳应用程序以及如何安装它们。


    ### VLC 媒体播放器


    VLC 媒体播放器是一个实用的程序，可以播放许多形式的视频，并运行在几乎任何操作系统上。它也运行在 Linux Mint 上，而且安装它非常简单。


    首先，打开终端窗口并输入此命令：


    ```

    sudo apt-get install vlc

    ```


    输入密码进行身份验证，apt 将为你下载并安装 VLC 及其各种依赖项。（你也可以通过 Synaptic 软件包管理器和 Linux Mint 软件中心安装它。）之后，你可以进入
    mintmenu，搜索“VLC”并点击 VLC 图标来启动 VLC。


    ### VIRTUALBOX OSE


    虚拟化是一个极其有用的软件概念。如果你熟悉这个术语，“虚拟机”是计算机上一个模拟独立的、运行中的计算机的软件进程。所以，假设你有一台运行 Linux Mint
    的计算机，并在上面安装了某种虚拟化软件。你就可以创建虚拟机——例如一个运行 Windows XP，另一个运行 Windows 7，可能还有第三个运行 Fedora
    Linux。


    我发现虚拟化在我的工作中极其有用。在过去，如果你想测试一个应用程序或程序，你必须将其安装在你的主机上，或者去翻找另一台旧机器来测试——这意味着你的桌子上又多了一个显示器、键盘以及所有随之而来的杂物。通过虚拟化，你可以让另一个操作系统作为一个窗口运行在你的主机上。


    Linux Mint 有许多可用的虚拟化产品，但在我看来，Virtualbox OSE 在易用性和功能之间提供了最好的平衡。要安装 Virtualbox，只需进入终端窗口并输入此命令：


    ```

    sudo apt-get install virtualbox

    ```


    就这样！apt 工具将下载 Virtualbox 及其依赖项，然后自动执行相当长的安装脚本。从安装的简易程度来看，这是无可比拟的。安装完成后，你可以进入 mintmenu，搜索“virtualbox”并点击
    Virtualbox OSE 图标来启动它。


    深入探讨虚拟化远超本书书的范围——关于虚拟化可以写（已经写了）整本书。但我建议你尝试它，因为它是学习额外技能的一种极佳且低成本的方法。


    ### GOOGLE CHROME


    Linux Mint 桌面版自带优秀的 Mozilla Firefox 浏览器。然而，Google 在 2008 年底发布的 Chrome 浏览器已经赢得了大量的追随者。Google
    为各种平台提供了 Chrome，Linux Mint 也不例外。


    要在 Linux Mint 上安装 Chrome，首先访问 Google Chrome 网站：


    http://www.google.com/chrome

    '
- fmt: '

    Click on the Download button, which will take you to the download page. Select
    the 64-bit version for Linux Mint. Hit the accept and install button, and the
    Chrome installer will download.


    Once the download is complete, you’ll have a `*.deb` installer package for Chrome
    in your Downloads folder. Double-click on it to launch the installer. You’ll be
    taken to the Linux Mint Software application. Click on the Install button to begin
    the installation of Chrome.


    You’ll need to enter your password to authenticate, and then follow the default
    prompts to install Chrome.


    After the installation is complete, you can launch Chrome by clicking on the mintmenu,
    searching for Chrome, and clicking on the Chrome icon.


    # AUDACITY


    Another application Linux Mint lacks is an editor for digital audio. Which admittedly
    makes sense, as not that many people need to edit digital audio on a regular basis.
    If you do need to edit audio files, however, the Audacity application is excellent.
    And it’s also available for Linux Mint.


    To install Audacity, make your way to the Terminal window and type this command:


    ```

    sudo apt-get install audacity

    ```


    This will download and install Audacity and its dependencies from the Linux Mint
    repositories. Once finished, you can run Audacity by going to the mintmenu, searching
    for "audacity", and clicking on the Audacity icon.


    However, the default install of Audacity lacks the ability to export its projects
    as an MP3 file. To gain that functionality, you’ll need to install the `LAME`
    library, which gives Audacity the ability to encode MP3 files. Note that the ownership
    of the MP3 patents remain in some dispute, so there may be liability issues in
    using `LAME`. However, if you’re in the legal clear, you can use this Terminal
    command to install the `LAME` library:


    ```

    sudo apt-get install libmp3lame0

    ```


    This will gave Audacity the ability to export projects as MP3 files.


    # DROPBOX


    Dropbox is a useful file-sharing and syncing service that lets you sync files
    between different machines over the Internet for free. It’s very useful for backing
    up your important documents, pictures, MP3 files, video files, and other data.
    A Dropbox client that integrates with the Nautilus file manager is available for
    Linux Mint, and it’s quite simple to install. Here’s how to do it.


    First, launch a new Terminal window by searching for Terminal in the mintmenu,
    or by hitting the `CTRL+ALT+T` keys simultaneously. Once the Terminal launches,
    type this command at the prompt:


    ```

    sudo apt-get install nautilus-dropbox

    ```


    Enter this command, and then enter your password to authenticate. The `apt-get`
    utility will then download and install the Dropbox client for you.


    Once the installation is complete, go to the mintmenu again, search for “Dropbox”,
    and click on the Dropbox icon. The Dropbox application will launch, and will ask
    you to download Dropbox’s proprietary Linux daemon. You will need to download
    the daemon to use Dropbox, so go ahead and allow the installation.


    Once it is finished, Dropbox will launch. Enter your Dropbox credentials, and
    you can start using Dropbox with Linux Mint.


    # FILEZILLA


    Linux Mint comes with both built-in command line SFTP and FTP clients, but if
    you find yourself working with file uploads a great deal, you might prefer to
    switch to a graphical FTP client for ease of use. Fortunately, the popular FileZilla
    FTP client is available for Linux Mint, and it''s easy to install.


    First, launch a new Terminal window by searching for Terminal in the mintmenu,
    or by hitting the `CTRL+ALT+T` keys simultaneously. Once the Terminal launches,
    type this command at the prompt:


    ```

    sudo apt-get install filezilla

    ```


    Enter this command, and then enter your password to authenticate. The `apt-get`
    utility will then download and install the FileZilla FTP client for you.


    Once the installation is complete, go to the mintmenu again, search for “FileZilla”,
    and click on the FileZilla icon. Once the application launches, you can create
    a new connection by going to the File menu, selecting Site Manager, and entering
    the information for the site to which you wish to connect.


    ***


    # Chapter 17 - Gaming


    So far in this book we’ve talked a lot about the command line, server applications,
    and desktop productivity applications, but you can also have fun with your computer.
    (Though installing Samba, of course, is its own special kind of fun!) There is
    a wealth of computer game software available for Linux Mint, and in this chapter
    I’ll discuss some of my favorites.


    However, we must first make an uncomfortable admission. The gaming experience
    on Linux Mint is generally not as good as the gaming experience on a Microsoft
    Windows machine, a mobile device like an iPad or iPhone or a Kindle Fire, and
    a dedicated game console like an XBox or a Playstation. This is because while
    Linux dominates in the server room, it retains only a tiny desktop usage share,
    and consequently major game publishers tend to release their games only for Windows
    machines, mobile devices, and game consoles. (In fact, it tends to cause something
    of a stir when a game publisher releases a title for both Windows and Mac OS X.)
    It is possible to get major Windows games to play on Linux Mint using `Wine`,
    but it’s a lot of work and not always reliable (we’ll discuss that more in the
    next chapter).


    That said, in the six years since the first edition of this book was published,
    the situation has changed quite a bit. The biggest platform for gaming, Steam,
    now works on Linux Mint, and many games have been made available for Linux Mint.
    Another popular game store, GOG.com, offers many classic DOS games for Linux Mint
    via the `DOSBox` utility, and even a few newer games like Pillars Of Eternity
    or FTL: Faster Than Light.


    Because of the changes over the last few years, there are quite few native games
    for Linux Mint. We’ll discuss a few of the classic ones. While playing modern
    Windows games on Linux is a challenge, playing old DOS game is a breeze, we’ll
    show you how to do that.


    ## CHESS


    Mac OS X and some editions of Windows 7 used to come with a chess game, but Linux
    Mint does not. Linux Mint does come with the usual assortment of free games –
    Solitaire, a tile game, some word puzzles – but no chess games. Fortunately, restoring
    Linux Mint to chess parity with Mac OS X and Windows 7 is quite easy. There is
    a package of free software called GNOME Games, and it includes a chess game. And
    as the `GNOME Games` package is native to Linux, it’s quite easy to install on
    Linux Mint.


    Simply go to the Terminal and type this command:


    ```

    sudo apt-get install gnome-games

    ```


    Enter your password to authenticate, and apt will download and install the missing
    GNOME Games. After the installation is complete, you can find Chess by clicking
    on the mintmenu and searching for "Chess." You also get close to a dozen other
    free games with the GNOME Games pack; my favorite is `Quadrapassel`, a clone of
    the venerable Tetris puzzle game.


    ## THE BATTLE FOR WESNOTH


    In turn-based strategy games, you assemble resources, build armies, and lead your
    troops in battle against your opponents. In fantasy-turn based games, you do all
    that, but you can also use magical fireballs and lightning bolts to smite your
    opponents, and also raise magical creatures like dragons and elves to fill the
    ranks of your armies. “The Battle For Wesnoth” is a free turn-based strategy game
    available for Windows, Mac, and almost all Linux platforms. A volunteer-supported
    project, the game has been around since 2003. I’ve played it from time to time
    since 2006 or so, and “Wesnoth” has improved immensely in that time. The current
    incarnation of “The Battle For Wesnoth” is smooth, polished, and quite enjoyable
    to play.


    And best of all, “Wesnoth” is both free and simple to install on Linux Mint. To
    install “Wesnoth”, simply go to a Terminal prompt and type this command:


    ```

    sudo apt-get install wesnoth

    ```

