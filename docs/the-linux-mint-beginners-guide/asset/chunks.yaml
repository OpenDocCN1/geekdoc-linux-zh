  trans: '

    这代表“本地回环地址”，它本质上是计算机用于识别自身及其 TCP/IP 软件套接字的 IP 地址。常见的故障排除步骤是检查你的计算机是否能与 `127.0.0.1`
    地址通信。如果不能，则说明你计算机的 TCP/IP 软件存在问题，或者网络硬件运行不正常。


    ## 子网掩码 (SUBNET MASKS)


    IP 地址也有“子网掩码”。子网掩码定义了 IP 地址中哪些部分代表网络，哪些部分代表网络中的单台计算机。假设上述 `192.168.1.1` IP 地址的子网掩码如下：


    `255.255.255.0`


    这意味着地址的 `192.168.1` 部分表示网络，而最后的 `1` 表示计算机。


    IP 地址通常包含一个“广播”地址。发送到广播地址的任何流量都会被定向到本地网络中的每台计算机。广播地址的最后数字是“255”，因此地址为 `192.168.1.1`
    的计算机其广播地址为 `192.168.1.255`。


    ## 默认网关 (DEFAULT GATEWAY)


    最后，IP 地址通常（但并非总是）带有“默认网关”。默认网关是你的计算机发送往本地网段之外任何地方流量的地址。例如，你用浏览器访问 Google。你的计算机识别出
    Google 不在 `192.168.1.*` 网络，因此将请求转发到默认网关，由网关将流量发送到 Google。（这是一种简化处理，但对于我们的目的已经足够。）


    ## MAC 地址 (MAC ADDRESS)


    每个网络适配器都有所谓的“介质访问控制”地址，或 MAC 地址。这是固化在物理硬件本身的地址，并且（理论上）对每个适配器都是唯一的。MAC 地址由一系列用冒号分隔的十六进制字符组成。例如，`09:00:27:6c:67:34`
    就是一个有效的 MAC 地址。MAC 地址通常用于网络过滤目的——例如，你可以配置无线路由器仅接受特定的 MAC 地址作为客户端。


    然而，这并不安全，因为伪造或虚造 MAC 地址非常容易。尽管如此，对于某些网络应用，你仍然需要知道你计算机的 MAC 地址。


    ## DNS


    基础网络中最后一个重要的组成部分是域名系统，或 DNS。


    正如我们上面提到的，互联网上的每个网站在理论上都有自己唯一的网页地址。记住所有这些 IP 地址可能是不切实际的。少数人记忆力足够强，能记住 `microsoft.com`
    的 IP 地址是 `206.46.232.182`（至少在写本文时如此），但我们大多数人做不到。


    DNS 提供了一种更简单的查找网站的方法。DNS 将每个地址映射到域名。当你输入一个网页地址（如 `microsoft.com` 或 `distrowatch.org`）时，你的请求会发送到
    DNS 服务器。DNS 服务器检查其域名映射数据库（称为“区域数据”），并返回返回分配给该域名的 IP 地址。然后你的计算机就可以联系该网站并开始下载数据。


    DNS 对于大多数计算机网络的顺畅运行至关重要。如果你的计算机遇到连接问题，DNS 是首要检查的项之一（当然，还要确保网线已插好）。


    ## IPv6 网络总结


    正如我们之前提到的，2011 年世界耗尽了可用的 IPv4 地址。由于 IPv4 地址只有约 46 亿个，而世界上联网设备数量远超 46 亿（想一下所有的计算机、智能手机、平板电脑、路由器、智能电视、打印机和其他设备），必须找到一种解决方案。互联网协议第
    6 版 IPv6 就是该解决方案。截至本文写作时，IPv6 仍处于边缘地位，但在几年后它将完全取代 IPv4。


    IPv4 使用 32 位地址方案，用四个 8 位组来识别计算机和网络。相比之下，IPv6 使用 128 位二进制数作为地址。IPv4 的最大值为 46 亿个可用地址。IPv6
    的理论限制是 `2¹²⁸` 个地址。用简单的数字表示，大约是 `340,282,366,920,938,463,463,374,607,431,768,211,456`
    个地址。


    鉴于这意味着理论上我们可以为地球上的每一个原子分配一个 IPv6 地址，然后还有足够的地址分配给另外一百个地球大小行星的原子，我们短期内不太可能耗尽 IPv6
    地址。


    一个典型的 IPv6 地址看起来像这样：


    `2001:0db8:85a3:0042:0000:8a2e:0370:7334`


    然而，你很少看到像这样写出完整的 IPv6 地址。有几种简写方式来显示 IPv6 地址。第一种方法是消除每个地址块中的任何导零：


    `2001:db8:85a3:42:0:8a2e:370:7334`


    此外，你还可以使用双冒号（`::`）表示一串零。因此，原始地址可以进一步缩写为：


    `2001:db8:85a3:42::8a2e:370:7334`

