    \ USERS TO GROUPS\n\nOnce you've created your group, you can add users to it.\
    \ Again, there are a couple of different ways to do so. The first way is with\
    \ the **useradd** command. To add the camalas account to the ghosts group:\n\n\
    sudo useradd camalas ghosts\n\nYou can also use the **usermod** command to add\
    \ a user to a group:\n\nsudo usermod -G ghosts -a camalas\n\nREMOVING USERS FROM\
    \ GROUPS\n\nTo remove an account from a group, use the **userdel** command:\n\n\
    sudo userdel camalas ghosts\n\nThis will remove camalas from the ghosts group.\n\
    \nDELETING GROUPS\n\nTo remove a group, use the **groupdel** command:\n\nsudo\
    \ groupdel ghosts\n\nThis will eliminate the ghosts group, even if it still has\
    \ members.\n\nNote that you cannot remove the primary group of any user without\
    \ first either removing that user account from the group, or deleting the user\
    \ account. (Remember that Linux Mint creates a group named after each of your\
    \ user accounts.)\n\n***\n\n## Chapter 4 - An introduction to the command line\n\
    \n**WHAT IS THE COMMAND LINE?** \n\nThe \"command line\" is shorthand way of saying\
    \ the \"command line interface\", also commonly known as the \"command prompt\"\
    \ or the \"terminal.\" The command line is a text-based interface. Most people\
    \ who have used a computer in the last twenty years are accustomed to a graphical\
    \ interface, whether the various incarnations of Microsoft Windows or Mac OS.\
    \ A graphical interface has windows, a mouse pointer, a scroll bar, icons, and\
    \ other graphical representations of files and computer functions. A text-based\
    \ interface, as the name suggests, has no graphics and relies entirely upon text.\
    \ You type your commands into the command prompt, which usually looks something\
    \ like this:\n\n**jon@linuxmintmachine:~$**\n\nLinux Mint then processes your\
    \ commands and then returns with the results or, if you made a typographical mistake,\
    \ an error message.\n\nWhy use the command line when Linux Mint comes with a highly\
    \ functional GUI? For one thing, if you want to run Linux Mint as a server, you’ll\
    \ need to know the command line, since a lot of server configuration can be done\
    \ only via the command line. For another reason, many tasks are vastly more efficient\
    \ from the command line.\n\nLet’s say, for example, that you want to copy some\
    \ JPEG files from your Pictures folder to an external hard drive called BACKUP.\
    \ More specifically, let’s say you want to copy only those JPEG files that have\
    \ the word “Jamie” in their name to the BACKUP drive. You could open up Pictures\
    \ folder and drag every “Jamie” JPEG to the BACKUP drive one by one. Or you could\
    \ open up a Terminal window and type this command:\n\n**cp ~/Pictures/*Jamie*.jpg\
    \ /media/BACKUP**\n\nHit Enter, and the command does all the work for you. No\
    \ muss, no fuss.\n\nCASE SENSITIVITY\n\nBefore we dig into the command line, we\
    \ need to stress an important point.\n\n*All commands and filenames in Linux are\
    \ case-sensitive!*"
