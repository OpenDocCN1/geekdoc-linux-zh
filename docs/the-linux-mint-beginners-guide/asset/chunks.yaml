    # 第 7 章 - 检查内存和磁盘空间使用


    在处理电脑（无论是 Linux Mint、Windows 还是 Mac OS X 系统）时，有一条不变的法则——内存或磁盘空间永远不够。诚然，情况已经比以前
    DOS 时代好多了，那时你只有 640 千字节的内存可用。个人电脑已经变得越来越强大，截至本书编写，你只需花费 500 美即可买一台拥有 4GB 内存和 320GB
    硬盘的笔记本电脑（如果是台式电脑甚至更便宜）。因此，对于普通用户来说，仔细管理个人电脑的内存和磁盘空间没有以前那么关键了。


    然而，你仍然需要关注内存和磁盘使用情况。如果你的 Linux Mint 系统运行变慢，你想知道原因，检查资源使用情况可以为你提供原因的线索。如果你的硬盘满了，你想找到哪些文件占用了最多的空间。如果你正在管理一个多个用户同时访问的
    Linux Mint 服务器系统，你绝对想要密切关注资源使用情况，以防某个用户导致服务器崩溃停止。


    在本章中，我们将介绍如何通过图形界面和命令行工具监控 Linux Mint 对系统资源的使用情况。


    ## 系统监控 (SYSTEM MONITOR)


    系统监控是一个提供有关系统状态大量实时信息的实用。通过系统监控，你可以看到系统剩余多少可用 RAM 和磁盘空间。你还可以查看绘制 CPU 使用率图表、系统上运行的各种进程占用的内存量，以及连接到电脑的任何附加磁盘（如闪存器或外部硬盘）的可用空间。


    要启动系统监控，请点击 Dash（栏）并在搜索框中搜索它。点击程序图标，系统管理器就会很快启动。


    系统监控有四个标签页，每个标签页显示不同的信息，我们将从左到右介绍。


    “系统 (System)”是第一个标签页，顾如其名，它展示了系统的基本信息。在顶部，你会看到系统主机名，接着是你的 Linux Mint 版本和 Linux
    内核版本。你还会看到系统安装的 RAM 总量，以及 CPU 的类型和速度。在下方，你会看到硬盘上的可用磁盘空间（如果你安装了多个硬盘，它将显示安装有 Linux
    Mint 的那个驱动器上的剩余空间）。


    “进程 (Processes)”是下一个标签页。“进程”是运行在系统上的任何程序的专业术语，无论是后台守护进程（提供服务的程序），还是你或其他任何用户启动的任何程序。进程标签页有若干列，提供了有用信息。第一列“进程名称
    (Process Name)”提供进程名称。“% CPU”标签显示该进程消耗的 CPU 处理时间百分比。“ID”列显示进程的 ID 数字，如果你需要从命令行强制结束它时，这个数字非常有用。“内存
    (Memory)”列显示进程占用的内存量。最后，进程标签页在右下角有一个“结束进程 (End Process)”按钮，你可以用它强制关闭无响应的进程。


    第三个标签页“资源 (Resources)”提供了三个实时图表。第一个图表“CPU 历史 (CPU History)”显示了消耗的 CPU 时间。如果你有多核处理器（现在的电脑都是如此），图表将用不同的颜色代表不同的
    CPU 核心。第二个图表“内存和交换历史 (Memory and Swap History)”显示了正在使用的 RAM 和交换文件空间（“交换文件”指的是虚拟内存，是硬盘上的一个分区，当实际
    RAM 满时，Linux Mint 将其作为临时 RAM）。最后一个图表“网络历史 (Network History)”显示了访问系统网络适配器的入出流量量。


    最后一个标签页“文件系统 (File Systems)”显示连接到你的 Linux Mint 系统的任何文件系统——即磁盘。这包括硬盘、光盘（如 CD 和
    DVD）、USB 外部硬盘和 USB 闪存器。列显示驱动器的实际设备名称（通常类似于 `/dev/sda1`）、挂载点（设备在文件系统中的挂载位置）、文件系统类型以及设备上的空间（包括总空间和可用空间）。


    系统监控在一个方便的地方提供了许多有用信息，但它是一个图形应用程序，这意味着它无法在命令行运行。要从命令行检查这些信息，你需要使用 `top` 命令，我们将在下一节讨论。


    ## TOP 命令


    `top` 命令已经存在了很久，几乎包含在每一个 Linux 变体中。Linux Mint 也不例外。`top` 命令显示了各种有统计数据，包括 CPU 时间的“顶部”用户（这也是该命令命名的由来）。要启动
    `top`，只需在命令行提示符处输入该命令：


    ```

    top

    ```


    一旦启动，`top` 将保持运行并实时显示统计数据。进程按进程 ID 数字列出，并带有启动该进程的命令名称。`top` 中列出了大量信息，让我们来看一下这些统计数据：


    - `PID`: 进程的进程 ID 数字。

    - `USER`: 进程所有者。由 `root` 拥有的通常是系统进程，除非它们引起问题，否则应该放过。

    - `PR`: 进程的优先级，决定了 CPU 对此进程与其他进程的关注程度。数字越小，优先级越高。

    - `NI`: 进程的 nice 值（额外值），影响其优先级。

    - `VIRT`: 进程使用的虚拟内存量。

    - `RES`: 进程使用的物理 RAM 量，以千字节为单位。

    - `SHR`: 进程使用的共享内存量。

    - `S`: 进程当前状态（僵尸、睡眠、运行、不中断睡眠或被跟踪）。

    - `%CPU`: 进程占用的处理器时间百分比。

    - `%MEM`: 进程占用的物理 RAM 百比。

    - `TIME+`: 进程已消耗的处理器时间。

    - `COMMAND`: 启动该进程的命令名称。


    当然，你可能想按照某个类别从小到大对顶部显示进行排序。当你想要找出哪个进程占用了最多的 CPU 时间或内存时，这特别有用。按下 `t` 键将按 CPU 时间对进程排序。按下
    `l` 将按平均负载排序，按下 `m` 按内存信息排序。


    和系统监控一样，你也可以使用 `top` 来杀死不配合的进程。要这样做，你需要记住想要杀掉的进程 ID。在 `top` 运行时按下 `k` 键，实用程序会要求你输入进程
    ID 数字。输入数字并按回车，然后在询问是否要杀死该进程时再次按回车（top 假设按回车就是“是”）。随后，top 程序将杀死该进程。


    完成操作后，按下 `q` 键退出返回命令行。


    ## 检查磁盘空间使用


    `top` 命令可以做很多事情，但有一件事是系统监控可以做而 `top` 不能做的——它可以显示已用磁盘空间。跟踪硬盘已用空间很重要。诚然，如今电脑配备了巨大的硬盘——台式机配备一
    TB 或两 TB 的容量已很常见。当然，热门文件的大小也越来越大（视频占据空间巨大），这使得填满硬盘变得更加容易。而填满硬盘会导致各种意料之外的问题，特别是在服务器系统上。

