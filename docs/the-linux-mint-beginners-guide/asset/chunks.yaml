    ## 第 12 章 - 使用 SSH 和 SFTP


    SSH 代表“安全外壳”（secure shell），是一种允许你安全地向远程机器发送命令的网络协议。我们在第 3 章中讨论过“壳”是一个在用户和操作系统之间提供接口的程序。SSH
    是一个“远程”外壳，允许你通过网络向机器发送命令。“安全”部分源于连接是加密的，这意味着攻击者无法监听连接，也不会在传输过程中拦截并用自己的命令替换掉你的命令。SSH
    相当可靠且安全，在 Linux 世界中被广泛使用。管理员经常用它远程管理机器——比起寒冷且嘈杂的服务器机房，从你的笔记本电脑上控制服务器通常要舒服快得多。


