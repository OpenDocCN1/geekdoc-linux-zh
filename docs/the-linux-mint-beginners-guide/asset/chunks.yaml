    [content]


    阅读[剑之面](http://www.jonathanmoeller.com/writer/?page_id=5429) (http://www.jonathanmoeller.com/writer/?page_id=5429)、[龙之面](http://www.jonathanmoeller.com/writer/?page_id=6511)
    (http://www.jonathanmoeller.com/writer/?page_id=6511)以及[法之面](http://www.jonathanmoeller.com/writer/?page_id=7196)
    (http://www.jonathanmoeller.com/writer/?page_id=7196)，以及短篇小说[赎金骑士](http://www.jonathanmoeller.com/writer/?page_id=5446)
    (http://www.jonathanmoeller.com/writer/?page_id=5446)、[青铜骑士](http://www.jonathanmoeller.com/writer/?page_id=6531)
    (http://www.jonathanmoeller.com/writer/?page_id=6531)、[蛇之骑士](http://www.jonathanmoeller.com/writer/?page_id=5856)
    (http://www.jonathanmoeller.com/writer/?page_id=5856)以及[符文骑士](http://www.jonathanmoeller.com/writer/?page_id=7183)
    (http://www.jonathanmoeller.com/writer/?page_id=7183)。


    # 无尽世界之塔


    托马斯·威克莱夫（THOMAS WYCLIFFE）只想静静地完成他的毕业论文。所以，当一个穿黑袍的男人出现在他的衣柜里，自称是最后一位术士师时，威克莱夫认为这是一个恶作作剧。


    但他很快意识到，最后一位术士师能赋予他超越想象的力量。


    而代价仅仅是他的灵魂。


    西蒙·韦斯特（SIMON WESTER）需要一份工作。极度需要。所以，当一位富有且强大的参议员向他提供工作时，他抓住了这个机会。当然，西蒙预期会发现一些腐败和阴暗的交易。


    但他没料到会发现黑魔法。


    利亚姆·马斯特里（LIAM MASTERE）是圣剑骑士，凡人种族的捍卫者。但剑真的能抵御子弹吗？当子弹和炸弹摧毁了他的王国，利亚姆必须冒险一切，去拯救他家园唯一的生存机会。


    通过直面无尽世界之塔的恐怖之旅……


    免费阅读[无尽世界之塔](http://www.jonathanmoeller.com/writer/?page_id=2073) (http://www.jonathanmoeller.com/writer/?page_id=2073)。之塔的传奇将延续于[圣剑骑士](http://www.jonathanmoeller.com/writer/?page_id=2076)
    (http://www.jonathanmoeller.com/writer/?page_id=2076)、[白议巫师](http://www.jonathanmoeller.com/writer/?page_id=2078)
    (http://www.jonathanmoeller.com/writer/?page_id=2078)以及[世界毁灭者](http://www.jonathanmoeller.com/writer/?page_id=2080)
    (http://www.jonathanmoeller.com/writer/?page_id=2080)。


    # 斗篷游戏


    2013 年，一扇通往另一个世界的门开启了，精灵利用魔法征服了地球，粉碎了面前所有的抵抗。


    征服三百年后，被流放的精灵高女王统治着一个有序但停滞的地球，人类被迫参加高女王对抗精灵家园叛徒的战争。


    纳迪亚·莫兰（Nadia Moran）对此不在乎这些。她不在乎高女王，也不在乎那些推翻她的反抗军。她唯一在乎的是让她弟弟获得从那种潜在致命疾病中康复所需的治疗……而那些治疗的极其昂贵。


    幸运的是，纳迪亚拥有自己的魔法，而且是一个非常、非常优秀的小偷。


    不幸的是，强大的精灵领主莫维林德（Morvilind）掌控着纳迪亚。如果他不听从命令，她弟弟就会死。


    当然，考虑到莫维林德的任务有多危险，纳迪亚可能还没活到看到弟弟去世的那一天……


    阅读[斗篷游戏：陷阱之盗](http://www.jonathanmoeller.com/writer/?page_id=5969) (http://www.jonathanmoeller.com/writer/?page_id=5969),[斗篷游戏：寒之热](http://www.jonathanmoeller.com/writer/?page_id=6072)
    (http://www.jonathanmoeller.com/writer/?page_id=6072),[斗篷游戏：反叛之拳](http://www.jonathanmoeller.com/writer/?page_id=6225)
    (http://www.jonathanmoeller.com/writer/?page_id=6225),[斗篷游戏：影之跃](http://www.jonathanmoeller.com/writer/?page_id=6713)
    (http://www.jonathanmoeller.com/writer/?page_id=6713),[斗篷游戏：碎石石](http://www.jonathanmoeller.com/writer/?page_id=7325)
    (http://www.jonathanmoeller.com/writer/?page_id=7325),[斗篷游戏：真之链](http://www.jonathanmoeller.com/writer/?page_id=7426)
    (http://www.jonathanmoeller.com/writer/?page_id=7426),[斗篷游戏：墓之吼](http://www.jonathanmoeller.com/writer/?page_id=7598)
    (http://www.jonathanmoeller.com/writer/?page_id=7598)以及[斗篷游戏：锤之击](http://www.jonathanmoeller.com/writer/?page_id=8121)
    (http://www.jonathanmoeller.com/writer/?page_id=8121)，还有短篇小说[幽之狼](http://www.jonathanmoeller.com/writer/?page_id=6735)
    (http://www.jonathanmoeller.com/writer/?page_id=6735),[龙之珠](http://www.jonathanmoeller.com/writer/?page_id=7473)
    (http://www.jonathanmoeller.com/writer/?page_id=7473)以及[铁之像](http://www.jonathanmoeller.com/writer/?page_id=8142)
    (http://www.jonathanmoeller.com/writer/?page_id=8142)。


    ## 关于作者


    身高超过六英尺，《今日美国》畅销作家乔纳森·莫勒（Jonathan Moeller）拥有康米亚亚人的深邃蓝色眼睛、西哥特战王般的铜色头发以及指挥官般的严严面容，这些对于他的电脑维修工作毫无用处，唉。


    他写了《魔魂》系列剑幻小说，并继续创作关于刺客和间谍凯伊娜·阿玛拉斯（Caina Amalas）的幽灵系列、《电脑入门指南》系列书籍以及许多其他作品。他的书销量超过百万册。


    访问他的网站：


    [`www.jonathanmoeller.com`](http://www.jonathanmoeller.com/)


    访问他的技术博客：


    [`www.computerbeginnersguides.com`](http://www.computerbeginnersguides.com/)


    联系他：


    jmcontact@jonathanmoeller.com


    你可以[在此订阅他的电子邮件通讯报](http://www.jonathanmoeller.com/writer/?page_id=1854) (http://www.jonathanmoeller.com/writer/?page_id=1854)，或者关注他的[Facebook
    页面](http://www.facebook.com/pages/Jonathan-Moeller/328773987230189) (http://www.facebook.com/pages/Jonathan-Moeller/328773987230189)或[Twitter
    动态](https://twitter.com/moellerjonathan) (https://twitter.com/moellerjonathan)。


