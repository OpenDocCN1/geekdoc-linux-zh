- fmt: '

    Now that we’ve got our software downloaded, we’ll need to configure it.


    You will need to create a location for Moodle to save data files. Traditionally,
    the location is in `/var/moodledata`. (Creating the data directory inside the
    web server directory is an extremely bad idea, due to the resultant security holes.)
    To create the data directory, use this command:


    ```

    sudo mkdir /var/moodledata

    ```


    Use this command to change the owner of the directory to the Apache system user.
    In Linux Mint, the Apache system user is usually named `www-data`:


    ```

    sudo chown www-data /var/moodledata

    ```


    Then use this command to make the `/var/moodledata` directory writable to Moodle:


    ```

    sudo chmod -R 744 /var/moodledata

    ```


    Now that configuration and setup is complete, we are actually read to begin installing
    Moodle!


    Fire up a web browser and navigate to the Moodle location to launch the web-based
    installer. If your server’s IP address (for example) is `192.168.1.100`, the address
    would look like this:


    http://192.168.1.100


    This will take you to the Moodle setup page.


    First, select the language for your Moodle installation, and then click the Next
    button.


    The installer will then ask for the locations of Moodle’s directories. The defaults
    will work, especially if you already created the `/var/moodledata` directory as
    indicated above. Click the Next button to continue.


    Moodle will then ask what kind of database server to use. Since we already set
    up our MySQL database, select “Improved MySQL” and then hit the Next button.


    Then installer will then need you to input the information for the database and
    database user we created above. Since our MySQL server is on the same machine
    as Moodle, leave `localhost` for the Database Host field. Enter `moodle` for Database
    Name, `moodleuser` for Database User, and then `1234` for Database Password. Leave
    the other fields blank, and then click Next.


    Moodle will then generate a `config.php` file. Copy and paste the data of the
    `config.php` file, save it as `config.php`, and then transfer it to your server.
    Make sure to put it in the directory containing the Moodle installation – in this
    example, `/var/www`. Once the `config.php` is in place, make sure to mark it as
    executable with this command, otherwise the installation will halt:


    ```

    sudo chmod 744 /var/www/html/config.php

    ```


    Save `config.php` file, and then go back to the web browser and click the Next
    button.


    Moodle will then ask if you agree to the terms of service. If you do, click the
    Continue button.


    The installer will then run a system check to make sure your server has all the
    necessary software to support Moodle. If not (it’s common to forget one of the
    PHP extensions), the installation will pause to allow you to install the missing
    software. Once you have, click Reload. If all the checks are passed, you can click
    the Continue button to continue.


    The Moodle installer will then start building the database tables it requires
    in the database we created earlier. The Moodle database is large and complex,
    and building the database may take a considerable amount of time, so be patient.
    As the installer successfully builds database tables, they will scroll down in
    the browser window. Once the database construction is complete, the Continue button
    will appear at the very bottom of the page. Click on it to continue.


    Moodle will then display a form for you to set up an administrator account for
    your new site. Enter an appropriate username and a strong password, along with
    any other required fields. Once you have finished, click on the Update Profile
    button at the bottom of the page.


    The install will then ask you to pick a full site name and a short name for the
    site. Select suitable names, and then click the Save Changes button.


    Congratulations! Your Moodle installation is now complete, and you can begin adding
    courses and other materials. For additional documentation, the Moodle site contains
    many useful resources:


    http://docs.moodle.org/26/en/Main_page


    ***


    ## Chapter 16 - The Six Best Applications for a New Linux Mint Desktop Installation


    We’ve been looking at how to set up Linux Mint as a server platform, but in this
    chapter we’re going to shift gears and look at some of the best applications available
    for the Linux Mint desktop.


    One of Linux Mint’s big advantages over Microsoft Windows is the large number
    of applications included with a standard Linux Mint software install. With Microsoft
    Windows, you get a few games, a few utilities, and WordPad, which doesn’t even
    include spell check. Linux Mint, on the other hand, comes with a wealth of preinstalled
    software. It includes LibreOffice, a full-featured free software suite. It comes
    with a variety of games, sound & video tools, utilities, productivity applications,
    and others. In fact, many users don’t need to install additional software, simply
    because the applications included with Linux Mint are adequate to their needs.


    However, there are a lot of excellent applications that are not included with
    the Linux Mint install disc. In this chapter, we’re going to look at six of the
    best applications for Linux Mint, and how to install them.


    ### VLC MEDIA PLAYER


    VLC Media Player is a handy program that can play numerous forms of video, and
    runs on just about any OS platform. It also runs on Linux Mint, and installing
    it is quite simple.


    First, open up a Terminal window and type this command:


    ```

    sudo apt-get install vlc

    ```


    Enter your password to authenticate, and apt will download and install VLC and
    its various dependencies for you. (You can also install it through Synaptic Package
    Manager and Linux Mint Software Center.) Afterwards you can launch VLC by going
    to the mintmenu, searching for "VLC", and clicking on the VLC icon.


    ### VIRTUALBOX OSE


    Virtualization is an extremely useful software concept. If you’re unfamiliar with
    the term, a “virtual machine” is a software process on a computer that mimics
    a separate, running computer. So, let’s say you have a computer with Linux Mint
    and install some sort of virtualization software on it. You can then create virtual
    machines – one running say, Windows XP, another running Windows 7, and perhaps
    still another running Fedora Linux.


    I have found virtualization to be incredibly useful in my work. In the old days,
    if you wanted to test an application or program, you had to install it on your
    primary machine, to dig up an old machine to test it – and that meant another
    monitor and keyboard and all the other attendant clutter on your desk. With virtualization,
    you can have a second OS running as a window your main machine.


    There are a number of virtualization products available for Linux Mint, but in
    my opinion, Virtualbox OSE offers the best balance between ease of use and features.
    To install Virtualbox, simply go to a Terminal window and type this command:


    ```

    sudo apt-get install virtualbox

    ```


    And that’s it! The apt utility will download Virtualbox and its dependencies,
    and then will automatically execute rather lengthy installation script. As ease
    of installation goes, you can’t beat that. After the installation is finished,
    you can start Virtualbox by going to the mintmenu, searching for "virtualbox",
    and clicking on the Virtualbox OSE icon.


    Covering virtualization in depth is way beyond the scope of this book – entire
    books can (and have) been written about virtualization. But I urge you to experiment
    with it, as it is a superb and low-cost way of teaching yourself additional skills.


    ### GOOGLE CHROME


    The desktop edition of Linux Mint comes with the excellent Mozilla Firefox browser.
    However, Google’s Chrome browser, released in late 2008, has gained a powerful
    following. Google makes Chrome available for a variety of platforms, and Linux
    Mint is no exception.


    To install Chrome on Linux Mint, first visit the Google Chrome website:


    http://www.google.com/chrome

