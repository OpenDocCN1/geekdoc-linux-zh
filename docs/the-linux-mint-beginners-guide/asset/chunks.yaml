  trans: '

    而莫罗伊卡（Moroica），传说与恐怖中的远古女巫，正在暗中等待，准备向神灵发动战争。她将让神灵为人类的苦难付出代价……即使为此必须毁灭世界。


    幽灵战士的凯娜·阿玛拉斯（Caina Amalas）反对这些强大的敌人，但付出的代价可能超出了她的承受。


    免费阅读[幽灵之子 (Child of the Ghosts)](http://www.jonathanmoeller.com/writer/?page_id=1057)
    (http://www.jonathanmoeller.com/writer/?page_id=1057)。凯娜的冒险将延续[火焰中的幽灵 (Ghost in
    the Flames)](http://www.jonathanmoeller.com/writer/?page_id=1265) (http://www.jonathanmoeller.com/writer/?page_id=1265)、[血中的幽灵
    (Ghost in the Blood)](http://www.jonathanmoeller.com/writer/?page_id=1383) (http://www.jonathanmoeller.com/writer/?page_id=1383)、[风暴中的幽灵
    (Ghost in the Storm)](http://www.jonathanmoeller.com/writer/?page_id=1931) (http://www.jonathanmoeller.com/writer/?page_id=1931)、[石中的幽灵
    (Ghost in the Stone)](http://www.jonathanmoeller.com/writer/?page_id=2520) (http://www.jonathanmoeller.com/writer/?page_id=2520)、[熔炉中的幽灵
    (Ghost in the Forge)](http://www.jonathanmoeller.com/writer/?page_id=3181) (http://www.jonathanmoeller.com/writer/?page_id=3181)、[灰烬中的幽灵
    (Ghost in the Ashes)](http://www.jonathanmoeller.com/writer/?page_id=3932) (http://www.jonathanmoeller.com/writer/?page_id=3932)、[面具中的幽灵
    (Ghost in the Mask)](http://www.jonathanmoeller.com/writer/?page_id=4231) (http://www.jonathanmoeller.com/writer/?page_id=4231)，以及[激流中的幽灵
    (Ghost in the Surge)](http://www.jonathanmoeller.com/writer/?page_id=4637) (http://www.jonathanmoeller.com/writer/?page_id=4637)，还有短篇故事[幽灵咏叹调
    (Ghost Aria)](http://www.jonathanmoeller.com/writer/?page_id=3243) (http://www.jonathanmoeller.com/writer/?page_id=3243)、[幽灵爪
    (Ghost Claws)](http://www.jonathanmoeller.com/writer/?page_id=3930) (http://www.jonathanmoeller.com/writer/?page_id=3930)、[幽灵预兆
    (Ghost Omens)](http://www.jonathanmoeller.com/writer/?page_id=4235) (http://www.jonathanmoeller.com/writer/?page_id=4235)、[凯拉斯之落
    (The Fall of Kyrace)](http://www.jonathanmoeller.com/writer/?page_id=4258) (http://www.jonathanmoeller.com/writer/?page_id=4258)、[幽灵之棘
    (Ghost Thorns)](http://www.jonathanmoeller.com/writer/?page_id=4639) (http://www.jonathanmoeller.com/writer/?page_id=4639)、[不灭幽灵
    (Ghost Undying)](http://www.jonathanmoeller.com/writer/?page_id=4662) (http://www.jonathanmoeller.com/writer/?page_id=4662)、[幽灵之光
    (Ghost Light)](http://www.jonathanmoeller.com/writer/?page_id=5653) (http://www.jonathanmoeller.com/writer/?page_id=5653)以及[幽灵匕首
    (Ghost Dagger)](http://www.jonathanmoeller.com/writer/?page_id=2371) (http://www.jonathanmoeller.com/writer/?page_id=2371)，以及前传小说[幽灵之刃
    (Blade of the Ghosts)](http://www.jonathanmoeller.com/writer/?page_id=6220) (http://www.jonathanmoeller.com/writer/?page_id=6220)和[幽灵冠军
    (Champion of the Ghosts)](http://www.jonathanmoeller.com/writer/?page_id=6304)
    (http://www.jonathanmoeller.com/writer/?page_id=6304)。在[幽灵合集一 (The Ghosts Omnibus
    One)](http://www.jonathanmoeller.com/writer/?page_id=4484) (http://www.jonathanmoeller.com/writer/?page_id=4484)中获取前三本书的套装。


    ## 幽灵流亡系列 (The Ghost Exile Series)


    凯娜·阿玛拉斯曾是“幽灵”的夜间战士，她是尼格玛（Nighmar）皇帝的间谍与刺客，通过她的勇敢与机智，拯救了帝国和世界免受魔法的毁灭。


    但胜利让她付出了了一切。


    现在，她被流逐，独自一人生活在伊斯林穆尔（Istarinmul）市，远离她的家园和朋友。然而，一种延续世纪的黑暗如今在伊斯林穆尔蠢动，渴望吞噬这座城市和世界本身。


    而凯娜是唯一挡它道路的人……


