    安装程序随后会要求你为电脑设置用户账户和主机名。首先，在 `Your name`（姓名）字段中输入你的全名。Linux Mint 在需要显示你的全名时会该它。


    在下方，为你的计算机输入一个名称。技术上讲，这被称为 `hostname`（主机名），是你的计算机在网络上标识身份使用的名称。最好选择一个容易记忆的主机名。如果你属于某个机构（例如你的工作场所），他们可能有标准的主机名命名规范。


    之后，在 `Pick a username`（选择用户名）字段中输入一个用户名。通常，你可以将名字的首字母与姓氏结合生成用户名——例如，一位名叫 Caina
    Amalas 的女性，用户名可以叫 `camalas`。


    接下来，为你的用户账户选择密码。你需要选择一个强密码，因为在 Linux Mint 安装期间创建的默认账户具有系统权限，这意味着它可以安装和卸载程序。强密码应包含大写字母、数字和标点符号的混合，且至少至少十个字符。


    密码字段下方有一个单选按钮，允许你的 Linux Mint 电脑在启动时自动登录。通常，这是一个坏主意——出于安全考虑，最好使用密码登录计算机。（尤其是考虑到安装期间创建的默认账户具有
    Linux Mint 系统的管理权限。）


    最后一个选项是加密你的家目录。“加密”文件意味着其内容被乱码，只能使用特殊的数学密钥进行读取。如果你加密了家目录，这意味着只有你的用户账户才能访问它。


    一旦完成密码和账户选项，点击 `Continue`（继续）按钮，安装将继续。


    ![](img/tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m59ea6d6c.jpg)


    到这一步，你就完成了。安装程序将在后台完成，你可以查看显示 Linux Mint 各种功能的幻灯片。


    ![](img/tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m68e5b9ff.jpg)


    安装完成后，点击 `Restart Now`（立即重启）按钮。在系统重启之前，它会提示你移除 CD 或 USB 驱动器。完成后，移除 CD 或 USB 驱动器并按下
    `ENTER` 键。你的系统将重启并带你进入登录屏幕：


    ![](img/tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m26f765c3.jpg)


    选择你新创建的账户并输入密码，即可进入新的 Linux Mint 桌面。


    # 更新 Linux Mint


    一旦安装了 Linux Mint，你就确保它包含了最新的软件补丁。软件补丁可以修复软件中潜在的安全漏洞，并通常提供新功能。事实上，在你安装 Linux Mint
    之后，`Update Manager`（更新管理器）应用程序将首次自动运行。


    要手动运行 `Update Manager`，请遵循以下步骤。


    首先点击 `mintMenu`，进入 `Administration`（管理），然后点击 `Update Manager`。


    `Update Manager` 将启动，并立即联系 Linux Mint 仓库（在 Linux 中，`repository` 是用于应用程序的在线存储空间）获取更新。


    `Update Manager` 将显示可用更新列表以及所有更新的总大小。（在新的 Linux Mint 安装上，这通常可以达到数百兆字节。）如果你点击某项更新，然后点击
    `Description of update`（更新描述）旁边的三角形，你可以看到关于该更新的更详细信息。点击 `Settings`（设置）按钮将允许你更改
    `Update Manager` 的设置。默认情况下，`Update Manager` 每天检查更新，并在有新更新可安装时通知你。


    当你准备好安装更新时，点击 `Install Updates`（安装更新）按钮继续：


    ![](img/tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_6bf812f5.jpg)


    `Update Manager` 随后会要求输入密码。这在 Linux Mint 上很常见——如果你想做一些更改系统的操作，例如安装新程序或更新，它会要求管理账户的密码。由于你在安装过程中创建的账户是管理账户，直接输入该密码，然后点击
    `Authenticate`（认证）按钮。


    `Update Manager` 将下载并安装可用更新。取决于你的互联网连接速度，这可能需要一些时间，请耐心等待。


    一旦 `Update Manager` 完成，你必须重启电脑。点击 `Restart`（重启）按钮重启系统，一旦 Linux Mint 重新启动，你的电脑将完全更新到最新状态。


    ## 第 2 章 - 使用 Linux Mint 桌面界面


    Linux Mint 被设计为一个图形化操作系统，这意味着你将花费大量时间使用桌面和各种图形界面选项。在本章中，我们将带你游览桌面，并向你介绍如何使用 `Nemo`
    文件管理器来执行常见任务。


    ### 桌面


    当你启动 Linux Mint 并首次登录时，你会看到桌面，如下所示：


    ![](img/tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_3b30d1.jpg)


    桌面的大部分部分位于底部，即 `Panel`（面板）。左下角的按钮 `Menu` 会带你进入 Linux Mint 的应用程序菜单。面板的中央区域将显示当前日期和时间。面板右侧是通知区域——任何具有通知功能的运行程序都会显示在这里。


    ### 桌面图标


    默认情况下，你的 Linux Mint 桌面上只会看到两个图标：`Computer` 图和家文件夹的快捷方式：


    ![](img/tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_49ddf1.jpg)


    双击家图标将启动 `Nemo`，它是 Linux 对 `Nautilus` 文件管理程序的修改版本。我们将在本章稍后讨论家文件夹。双击 `Computer`
    图将启动 `Nemo` 显示电脑的高级视图。你可以看到电脑上的所有硬盘以及可移动磁盘。你也可以在桌面上创建文档和文件夹。


    ### MintMenu


    点击桌面左下角的 `Menu` 按钮，将召唤 `mintMenu`，它看起来如下：


    ![](img/tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_3afa294.jpg)


    `mintMenu` 有三个主列。左列包含系统一些常用功能的快捷方式。你可以访问 `Firefox` 浏览器、`Software Manager`、`Terminal`、`Nemo`
    文件管理器，并对 `Cinnamon`（Linux Mint 的桌面环境）进行精细设置。你还可以锁定电脑、注销并重启电脑。


    中间列是安装在 Linux Mint 电脑上的应用程序分类列表。例如，点击 `Office` 类别，你将看到电脑上安装的所有办公应用程序（如 `LibreOffice`
    办公套件）。中间列还包含 `Recent Files`（最近文件），它列出了你最近访问的所有文件。


    最后，右列是上下文相关的，这意味着它会根据你在中间列中选择的内容而改变。正如我们上面提到的，点击中间列中的 `Office` 类别，右侧的视图将更改为显示
    Office 类别中的可用应用程序。


