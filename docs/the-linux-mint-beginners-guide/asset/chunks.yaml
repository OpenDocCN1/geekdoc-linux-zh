    即使是 `ps –elf` 也只是系统当前正在运行进程的静态快照。在 Linux 系统上，运行中的进程变化非常快，你可能希望实时监控它们。这正是 `top`
    命令大显用场的地方


    # TOP 命令


    `top` 命令已经存在很久了，并且包含在几乎每一个 Linux 变体中。Linux Mint 也不例外。`top` 命令显示各种各种统计数据，包括占用 CPU
    时间最多的“顶部”用户（这也是该命令名称的由来）、运行进程占用的内存量、它们使用的虚拟内存量、进程优先级、进程所属的用户以及许多其他有用信息。要启动 `top`，只需在命令行提示符处输入该命令即可：


    ```

    top

    ```


    一旦启动，`top` 将保持运行并实时显示统计数据。进程按照其进程 ID（PID）以及启动该进程的命令名称进行列出。


    `top` 中列出的信息非常多，让我们来看可用的统计数据：


    - **PID**: 进程的进程 ID 号。

    - **USER**: 进程的所有者。属于 `root` 的进程通常是系统进程，除非它们引起问题，否则不应该干涉它们。

    - **PR**: 进程的优先级，决定了 CPU 对此进程与其他进程相比给予多少关注。数字越小，优先级越高。

    - **NI**: 进程的 nice 值（谦值），它会影响优先级。

    - **VIRT**: 进程使用的虚拟内存量。

    - **RES**: 进程使用的物理 RAM 量，以千字节为单位。

    - **SHR**: 进程使用的共享内存量。

    - **S**: 进程的当前状态（僵死、睡眠、运行、不可中断睡眠或被追踪）。

    - **%CPU**: 进程占用处理器时间的百分比。

    - **%MEM**: 进程占用物理 RAM 的百分比。

    - **TIME+**: 进程已使用的处理器时间。

    - **COMMAND**: 启动该进程的命令名称。


    当然，你可能想按照某个类别从从到大对顶部显示进行排序。当你想要找出哪个进程占用了最多的 CPU 时间或内存时，这特别有用。按下 `t` 键按 CPU 时间对进程进行排序。按下
    `l` 按平均负载排序，按下 `m` 按内存信息排序。


    像 GNOME 系统监视器应用程序一样，你也可以使用 `top` 来杀掉不配合的进程。要做到这一点，你需要记住想要杀掉的进程 ID。在 `top` 运行时按下
    `k` 键，实用程序将要求你输入进程 ID 号。输入数字，按下 `Enter`，然后在当它询问你是否要杀掉该进程时再次按下 `Enter`（`top` 假设你按回车时意味着“是”）。随后
    `top` 实用程序将杀死该进程。


    当你完成 `top` 操作后，按下 `q` 键退出并返回命令行。


    大多数情况下，你会使用 `top` 和 `ps` 命令来追踪引起故障的进程。在下一节中，我们将讨论如何使用（名副其实的）`kill` 命令来终止麻烦的进程。


    # KILL 命令


    `kill` 命令 正如其名称所暗示的，可以让你杀掉运行中的进程。


    从技术上讲，`kill` 命令向运行中的进程发送信号。然而，此命令最常用于发送 kill 信号来终止冻结、拒绝正常退出或或其他运行异常的进程。使用 `kill`，你可以终止麻烦的进程。


    注意，要使用 `kill`，你需要知道想要终止的进程的 `PID`（进程标识符）。你可以通过 `ps` 或 `top` 命令找到 PID（详细信息在本书的其他地方介绍）。


    要使用 `kill`，只需输入带有目标进程 PID 的命令即可。例如，要终止 PID 为 2589 的进程：


    ```

    kill 2589

    ```


    与其他命令一样，`kill` 可以通过多个开关进行修改。记住，`kill` 是通过向指定进程发送信号来工作的。`kill` 命令使用 64 个单独信号，你可以通过
    `--l` 开关列出这些信号：


    ```

    kill –l

    ```


    在这些 64 个信号中，有 4 个是常用的。你通过使用信号编号作为开关来告诉 `kill` 要发送哪种信号——例如，`kill-9 2589`。


    15 是默认的 kill 信号。15 告诉目标进程立即停止，但在优雅关闭后才会。由于 15 是默认的 kill 信号，你通常不需要显式指定它，但如果你确实这样做，向
    PID 2589 发送 15 信号的命令看起来像这样：


    ```

    kill -15 2589

    ```


    信号数字 1 不那么剧烈。它只是告诉进程重启，同时保持相同的 PID。要使用信号数字 1：


    ```

    kill -1 2589

    ```


    信号数字 2 向进程发送 `CTRL+C` 组合键，通常用于跳出运行中的进程（例如 `ping` 命令）。向进程发送信号数字 2：


    ```

    kill -2 2589

    ```


    最后，最剧烈的信号是数字 9。信号数字 9 会立即杀死进程，不给它优雅关闭的机会。通常情况下，你应该只在使用信号 9，除非其他方法有效：


    ```

    kill -9 2589

    ```


    使用 `ps`、`top` 和 `kill`，你可以管理 Linux Mint 系统中的运行进程


    ***


    ## 第 22 章 从命令行处理文档


    在处理“文档”（如电子表格、演示文稿、PDF 文件、文本文档等）时，你大部分时间会在 Linux Mint 中因为大部分工具都在 GUI 中。如果你需要创建一个文档或复杂的电子表格，你需要使用程序。（你可以使用
    vi 文本编辑器，但可能不是一种愉快的体验。）


    话如此，有几个命令行工具允许你自动化文档任务。例如，假设你有四十个 PDF 文件需要合并成一个 PDF，或者有三百个 ODT 文档需要转换为 HTML 文件。如果你在
    GUI 中执行这些任务将需要大量重复、枯燥且耗时的鼠标点击。然而，通过精选的命令，你可以轻松地处理这些任务。


    ### 使用 PDFTK 管理 PDF 文件


    PDF 代表便携文档格式，已成为政府文档和公司文件的事实标准——想想你有多少次访问政府网站或雇主网站下载并填写 PDF 表单。这样做的好处是文档创建者可以安排
    PDF 看起来完全符合他的预期，因为 PDF 在不同的操作系统和设备上都是可读的。缺点是如果你在创建后需要更改 PDF，修改它既麻烦又困难。


    这就是 `pdftk` 实用程序的用用场。`pdftk` 实用程序（PDF Toolkit）允许你合并和分离 PDF 文件。它没有包含在 Linux Mint
    的默认安装中，但你可以从命令行快速解决这个问题。登录具有管理员权限的账户，打开终端窗口，输入以下命令：


    ```bash

    sudo apt-get install pdftk

    ```


    输入密码以验证身份，`apt` 将为你下载并安装 `pdftk`。安装完成后，你可以从命令行使用 `pdftk`。


    现在你已安装 `pdftk`，我们将展示如何使用它合并 PDF 文件。假设你有三个 PDF 文件：`Page1.pdf`、`Page2.pdf` 和 `Page3.pdf`。你需要将它们合并成名为
    `FinalDraft.pdf` 的单个 PDF 文档。你可以通过 LibreOffice 或其他文档编辑程序完成。也可以使用 `pdftk`：


    '
- fmt: '

    ```

    pdftk Page1.pdf Page2.pdf Page3.pdf output FinalDraft.pdf

    ```


    This command will take the three PDF files and combine them into a single PDF
    named `FinalDraft.pdf`. Note that `pdftk` will combine the files in the order
    they are listed. So if you wanted `Page3.pdf` to actually be the first page in
    `FinalDraft.pdf` instead of `Page1.pdf`, you would use this command:


    ```

    pdftk Page3.pdf Page2.pdf Page1.pdf output FinalDraft.pdf

    ```


    This will create the `FinalDraft.pdf` document with the `Page3.pdf` as its first
    page.


    You can also use `pdftk` to extract single pages from larger PDF documents. In
    this example, let’s say you have a 90-page PDF document named `Report.pdf`. You
    want to extract only page 9 from this document so you can email it to a coworker.
    To extract page 9 from `Report.pdf` and save it as its own PDF document named
    `Page9.pdf`, use `pdftk` with these options:


    ```

    pdftk A=Report.pdf cat A9 output Page9.pdf

    ```


    This will take the ninth page from `Report.pdf` and save it as its own PDF document
    named `Page9.pdf`.


    Likewise, you can also use `pdftk` to extract a range of pages from a PDF document
    and save them in their own file. To return to our previous example, if you wanted
    to extract pages 19 through 37 of `Report.pdf` in their own file named `Extract.pdf`,
    you would use `pdftk` with these options:


    ```

    pdftk A=Report.pdf cat A19-37 output Extract.pdf

    ```


    With `pdftk`, you can disassemble and reassemble PDF documents with ease.


    # CONVERT FILE TYPES WITH LIBREOFFICE


    LibreOffice, the free office suite included with Linux Mint, has a fairly useful
    feature that’s not very well known. Called “headless mode”, this allows you to
    run LibreOffice from the command line without launching any graphical interface
    components. Since LibreOffice is a full-featured office suite, this might seem
    like a waste of time. However, you can use LibreOffice’s headless mode to perform
    batch conversions of files. Using it to convert, say, one `*.doc` file to a PDF
    document might seem cumbersome. However, if you have 2,000 `*.doc` files you need
    to convert to PDFs (as part of, to cite a common example, government regulatory
    compliance), this can save a tremendous amount of time.


    In our first example, let’s say you have 1,000 `*.doc` files you need to convert
    to PDFs. The document files are located in a directory called `source` in your
    home directory, and you want to have the PDFs in a directory called `output` in
    your home directory. The command to convert the doc files to PDF files will look
    like this:


    ```

    libreoffice –headless –convert-to pdf:writer_pdf_Export -outdir ~/output ~/source/*.doc

    ```


    This will take every single `*.doc` file in the `~/source` directory and convert
    it to a corresponding PDF file in the `~/source` directory. Note that the original
    `*.doc` files are not altered in any way.


    You can also use this command to perform mass conversions of other file formats.
    For instance, let’s say you wanted to turn those 1,000 `*.doc` files into HTML
    files instead. The command would look like this:


    ```

    libreoffice –headless –convert-to html -outdir ~/output ~/source/*.doc

    ```


    This will convert the `*.doc` files in `~/output` to HTML files in `~/source`.
    Again, the original document files will not be altered.


    By changing the parameter after the `--convert-to` option, you can convert to
    and from any of the file types supported by LibreOffice. If you wanted to change
    your `*.doc` files in `~/source` to `*.odt` files (OpeDocument Format files),
    the command would look like this:


    ```

    libreoffice –headless –convert-to odt -outdir ~/output ~/source/*.doc

    ```


    Using LibreOffice’s command-line utility allows you to quickly and easily perform
    batch conversions of documents.


