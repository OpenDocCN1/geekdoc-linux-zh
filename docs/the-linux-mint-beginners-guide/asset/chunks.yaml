    to empty the Trash. You can empty the Trash by clicking Empty Trash from within
    the Trash folder:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_2d9efcfa.jpg)


    This will empty the Trash. Be careful using it – once you do, the files in the
    Trash will be gone forever.


    ***


    ## Chapter 3 - Creating Users and Groups


    During the installation of Linux Mint, the installer prompts you to create an
    administrative account. If you''re the only one to use your Linux Mint machine,
    that should be enough. But if you have more than one person using your Linux Mint
    system, you''ll quickly need additional user accounts to keep everyone''s files
    organized. Assigning permissions is well and good, but you need more than one
    user account to make permissions work properly. You may also find it necessary
    to organize those accounts into groups.


    In this chapter we''ll discuss how to create and delete users, and how to create
    and delete groups.


    ADDING USERS


    To start, let''s discuss adding users to your Linux Mint system. You can do this
    through the GUI, quite easily. Merely go to the mintmenu, click on the Administration
    icon, and click on the Users and Groups item. This will bring up the Users and
    Groups utility.


    From here, you can add and delete user accounts.


    However, we''ve been focusing on how to do things from the command line, and you
    can add and remove users and groups quite easily with a few commands. For our
    example, let''s say you want to add a user account for a woman named Caina Amalas
    to your Linux Mint system.


    (Shameless authorial plug: Caina Amalas is the name of the character I''ve written
    for a series of ninteen sword & sorcery novels.)


    To begin, it''s best to choose some kind of naming convention for your user accounts.
    A naming convention sounds fancy, but it just means that you just stick to a consistent
    way of naming the accounts. Usually, something like the first initial and the
    last name is best - like "camalas" for Caina Amalas.


    To actually create the new camalas user account, use the **useradd** command.
    You''ll need root-level permission to create an account, so you''ll have to use
    useradd with the sudo command:


    **sudo useradd camalas**'
