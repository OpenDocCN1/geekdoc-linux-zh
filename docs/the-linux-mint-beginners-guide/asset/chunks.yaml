    ```

    sudo mysql_secure_installation

    ```


    首先，`mysql_secure_installation` 脚本会要求你输入 `MySQL` root 用户的当前密码。输入后，它会询问你是否想要更改 root
    密码。由于你已经设置了 root 密码，你可以按“n”（除非你出于某种原因想再次更改）。


    接下来，脚本会要求你设置 `VALIDATE PASSWORD` 插件，该插件会检查密码的强度是否合适。按 Y 接受，然后通过按 `0`（低强度）、`1`（中强度）或
    `2`（高强度）来设置密码强度级别。


    接着，脚本会询问你是否想要删除匿名用户。匿名用户就像 FTP 中的匿名访问，允许人们在没有相应用户账户的情况下登录 `MySQL`。出于安全考虑，最好始终删除匿名用户，因此请按“y”继续。


    之后，脚本会询问你是否想防止 `MySQL` root 用户远程登录 `MySQL` 服务器。请始终按“y”来禁止 root 远程访问，因为如果攻击者猜中了你的
    root 密码，他就可以破坏你的数据库或盗取其中包含的信息。


    之后，脚本会询问你是否想要删除测试数据库。`MySQL` 包含一个任何人都可以访问的测试数据库。同样，这是一个安全漏洞，因此你想要按“y”删除测试数据库。


    脚本随后会询问是否重新加载权限表以便更改生效。按“y”，`mysql_secure_installation` 脚本将结束并让你返回命令行。


    MySQL 服务器现在已安装在你的 Linux Mint 系统上。


    安装 MediaWiki 的下一步是安装 PHP 第 7 版本：


    ```

    sudo apt-get install php

    ```


    然后安装 PHP 的 `MySQL` 模块：


    ```

    sudo apt-get install php-mysql

    ```


    然后安装 PHP 的 `MySQL` 模块：


    ```

    sudo apt-get install php-mysql

    ```


    然后安装 `mbstring` PHP 模块：


    ```

    sudo apt-get install php-mbstring

    ```


    然后安装 `xml` PHP 模块：


    ```

    sudo apt-get install php-xml

    ```


    接下来，使用此命令重启 Apache，以便其在启用所有 PHP 扩展的情况下重新加载：


    ```

    sudo /etc/init.d/apache2 restart

    ```


    最后，将 MediaWiki 软件下载到你的桌面。你可以从此地址获取：


    https://www.mediawiki.org/wiki/Download


    如果你完全在命令行中工作，可以使用此命令下载 MediaWiki 软件：


    ```

    wget https://releases.wikimedia.org/mediawiki/1.27/mediawiki-1.28.2.tar.gz

    ```


    （注意，版本号（以及文件名）将随着 MediaWiki 未来版本的发布而变化，因此在下载文件之前请双重检查。）


    使用此命令解压 MediaWiki 文件：


    ```

    tar -xzvf mediawiki-1.27.1.tar.gz

    ```


    最后，将 MediaWiki 文件移动到 `/var/www/html` 目录。（在此条命令中，我假设你将 MediaWiki 文件解压到了家目录；如果你在不同的目录中解压了它们，则需要调整命令。）


    ```

    sudo cp -r ~/mediawiki-1.27.1/* /var/www/html

    ```


    现在我们准备准备 MySQL 以供 MediaWiki 使用。MediaWiki 需要一个数据库和一个数据库用户，并授予该数据库用户访问其数据库的全权限。启动
    `MySQL` 命令行客户端，使用此命令：


    ```

    mysql -u root -p

    ```


    输入 `MySQL` root 用户的密码，你就会发现自己处于 `MySQL` 提示符下，它看起来如下：


    ```

    mysql>

    ```


    我们接下来的步骤是创建一个 MediaWiki 数据库，创建一个访问该数据库的用户，并授予我们的新用户对 MediaWiki 数据库的所有权限。


    （在我们继续之前，有一个重要的说明。从 `MySQL` 提示符执行的所有命令必须以分号结尾，以表示语句结束。任何不以分号结尾的命令都无法运行。考虑到这一点，让我们先创建一个数据库。）


    要在 `mysql>` 提示符下创建 MediaWiki 数据库 `fmedor`，请使用以下命令：


    ```sql

    CREATE DATABASE mediawiki;

    ```


    `MySQL` 客户端将返回一条消息，显示为 "Query OK, 1 row affect (0.00 sec)。”这意味着命令成功，并创建了一个名为 "newdatabase"
    的新数据库。


    接下来，你将创建一个访问该数据库的用户并为该用户分配密码。在示例中，我们将分配密码 "1234"。然而，在现实生活中，就像 root 用户一样，你会想要分配一个强密码。（此数据库用户不会像
    root 用户那样对 `MySQL` 用户拥有完全控制权，但我们将授予它对刚刚创建的数据库的完全控制权，而猜中密码的恶意用户可能会导致各种麻烦）：


    ```sql

    CREATE USER mediawikiuser IDENTIFIED BY ''1234'';

    ```


    同样，你应该会收到 "Query OK" 确认消息。最后一步是将 "mediawiki" 数据库上的所有权限授予 "mediawikiuser" 用户。使用此命令分配权限：


    ```sql

    GRANT ALL PRIVILEGES ON mediawiki.* TO mediawikiuser IDENTIFIED BY ‘1234'';

    ```


    这不是拼写错误——那些是单引号 ('''') 而不是在设置密码的命令中常用的双引号 (")。遗憾的是，`MySQL` 的内部语法并不总是一致的。无论如何，如果你正确输入了命令，你应该会再次获得
    "Query OK" 确认。


    完成后，使用此命令退出 MySQL 界面：


    ```

    exit

    ```


    完成后，将 Apache 的默认 index.html 重命名为 index.old。


    ```bash

    mv index.html index.old

    ```


    否则 Apache 将访问默认页面。在你的 Linux Mint 系统的浏览器中导航到此处以启动安装：


    http://127.0.0.1


    安装脚本只是一个你需要填写的 Web 表单。默认设置在大多数情况下都可以用。你需要为你的 wiki 选择一个名称，还需要输入数据库名称、数据库用户以及你为
    MySQL 创建的密码。一旦你有了适当的信息，完成脚本，MediaWiki 就会安装完成。


    然而，你还需要最后一件事来完成安装。脚本完成后，MediaWiki 将生成一个 `LocalSettings.php` 文件供你下载。确保下载该文件并传输到
    `/var/www/html` 以完成安装。（你可能需要使用 SSH 和 SFTP 执行此操作——参见如何设置它们。）


    Wiki 现在已安装在你的 Linux Mint 系统上。


    # 在 Linux Mint 上安装 Moodle


    Moodle 是全球数万所学校使用的虚拟学习环境。使用 Moodle，你可以创建一个完全在线的课程，或用它辅助传统的课堂课程。最重要的是，Moodle 是免费的，你可以在
    Linux Mint 上安装它。在 Linux Mint 上安装 Moodle 有些工作要做，但一旦完成，你将拥有一个强大的在线学习应用程序。


    你完全可以在运行桌面或服务器版本 Linux Mint 的机器上安装 Moodle。这提供了一个极好的测试和实验环境，因为你可以随心所欲地调整和实验，而不会影响生产网站。鉴于
    Moodle 是免费的，如果你有一点 Linux 知识，可以使用 Moodle 代替更昂贵的方案。


    让我们开始吧！


    首先，将 Linux Mint 安装到你的机器中。一旦 Linux Mint 安装并更新完毕，你需要安装五部分软件：Apache Web 服务器、MySQL
    数据库服务器 5.7、PHP 7 版本、PHP 的 MySQL 模块，最后是 WordPress 软件本身。


    首先，安装 Apache 服务器。要安装 Apache，进入终端窗口或命令提示符并输入此命令：


    ```bash

    sudo apt-get install apache2

    ```

