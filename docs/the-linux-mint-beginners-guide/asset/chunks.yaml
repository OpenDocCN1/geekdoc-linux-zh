    ## Other books by the author


    ## The Demonsouled Saga


    MAZAEL CRAVENLOCK is a wandering knight, fearless in battle and masterful with
    a sword.


    Yet he has a dark secret. He is Demonsouled, the son of the ancient and cruel
    Old Demon, and his tainted blood grants him superhuman strength and speed. Yet
    with the power comes terrible, inhuman rage, and Mazael must struggle to keep
    the fury from devouring him.


    But he dare not turn aside from the strength of his blood, for he will need it
    to face terrible foes.


    The priests of the San-keth plot and scheme in the shadows, pulling lords and
    kingdoms upon their strings. The serpent priests desire to overthrow the realms
    of men and enslave humanity. Unless Mazael stops them, they shall force all nations
    to bow before the serpent god.


    The Malrag hordes are coming, vast armies of terrible, inhuman beasts, filled
    with a lust for cruelty and torment. The Malrags care nothing for conquest or
    treasure, only slaughter. And the human realms are ripe for the harvest. Only
    a warrior of Mazael’s power can hope to defeat them.


    The Dominiar Order and the Justiciar Order were once noble and respected, dedicated
    to fighting the powers of dark magic. Now they are corrupt and cynical, and scheme
    only for power and glory. They will kill anyone who stands in their way.


    To defeat these foes, Mazael will need all the strength of his Demonsouled blood.


    Yet he faces a far more terrible foe.


    For centuries the Old Demon has manipulated kings and lords. Now he shall seize
    the power of the Demonsouled for himself, and become the a god of torment and
    tyranny.


    Unless Mazael can stop him.


    Read [Demonsouled](http://www.jonathanmoeller.com/writer/?page_id=880) (http://www.jonathanmoeller.com/writer/?page_id=880)
    for free. Mazael''s adventures continue in [Soul of Tyrants](http://www.jonathanmoeller.com/writer/?page_id=911)
    (http://www.jonathanmoeller.com/writer/?page_id=911), [Soul of Serpents](http://www.jonathanmoeller.com/writer/?page_id=1287)
    (http://www.jonathanmoeller.com/writer/?page_id=1287), [Soul of Dragons](http://www.jonathanmoeller.com/writer/?page_id=1727)
    (http://www.jonathanmoeller.com/writer/?page_id=1727), [Soul of Sorcery](http://www.jonathanmoeller.com/writer/?page_id=1845)
    (http://www.jonathanmoeller.com/writer/?page_id=1845), [Soul of Skulls](http://www.jonathanmoeller.com/writer/?page_id=2808)
    (http://www.jonathanmoeller.com/writer/?page_id=2808), [Soul of of](http://www.jonathanmoeller.com/writer/?page_id=3599)
    (http://www.jonathanmoeller.com/writer/?page_id=3599), along with the short stories
    [The Wandering Knight](http://www.jonathanmoeller.com/writer/?page_id=3073) (http://www.jonathanmoeller.com/writer/?page_id=3073),
    [The Tournament Knight](http://www.jonathanmoeller.com/writer/?page_id=3677) (http://www.jonathanmoeller.com/writer/?page_id=3677),
    and [The Dragon''s Shadow](http://www.jonathanmoeller.com/writer/?page_id=2635)
    (http://www.jonathanmoeller.com/writer/?page_id=2635). Get the first three books
    bundled together in [Demonsouled Omnibus One](http://www.jonathanmoeller.com/writer/?page_id=4442)
    (http://www.jonathanmoeller.com/writer/?page_id=4442).


    ## The Ghosts Series


    Once CAINA AMAL was the shy daughter of a minor nobleman, content to spend her
    days in her father’s library.


    Then sorcery and murder and her mother’s treachery tore her life apart.


    Now she is a nightfighter of the Ghosts, an elite agent of the spies and assassins
    of the Emperor. She is a master of disguise and infiltration, of stealth and the
    shadows.


    And she will need all those skills to defend the Empire and stay alive.


    Corrupt lords scheme and plot in the shadows, desiring to pull down the Emperor
    and rule the Empire for their own profit and glory. Slave traders lurk on the
    fringes of the Empire, ready to seize unwary commoners and sell them into servitude
    in distant lands. Yet both slave traders and cruel lords must beware the Ghosts.


    The Magisterium, the Imperial brotherhood of sorcerers, believe themselves the
    rightful masters of the Empire. With their arcane sciences, they plan to overthrow
    the Empire and enslave the commoners, ruling all of mankind for their own benefit.
    Only the Ghosts stand in the path of their sinister plans.

