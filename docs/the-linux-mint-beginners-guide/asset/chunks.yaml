    # 使用 SOUND CONVERTER 转换音频


    如果你有一个想要转换为 `MP3` 的 `WAV` 文件，在 Linux Mint 系统上可以非常容易且简单地实现这一点。你只需要一个软件包：`GNOME
    Sound Converter` 应用程序。Sound Converter 程序提供了一个图形界面（GUI），用于将音频文件从一种格式转换为另一种。


    要安装 Sound Converter 程序本身，请打开 `Terminal`（终端）并输入此命令：


    ```bash

    sudo apt-get install soundconverter

    ```


    在输入密码身份验证后，`apt-get` 将下载并安装 `SoundConverter` 及其必要的依赖项。安装完成后，你可以进入 mintmenu（系统菜单），搜索“soundconverter”，并点击
    Sound Converter 图标来启动它。


    程序启动后，进入 `Edit`（编辑）菜单，并选择 `Options`（选项）项。在那里，你可以设置程序想要生成的输出类型（`OGG` 文件、`MP3` 文件或
    `AAC` 文件），以及转换后文件的目标文件夹。选好偏好后，点击 `Close`（关闭）按钮，然后点击程序主工具栏上的 `Add Files`（添加文件）来选择你想要转换的文件。


    # 使用 FFMPEG 转换音频和视频


    你可能经常需要从视频文件中提取声音。幸运的是，使用 `ffmpeg` 程序，可以非常简单地从任何视频文件中提取声音并将其存储为单独的文件。`ffmpeg`
    工具可以在多种视频和音频格式之间进行来回转换。更棒的是，与本书的整体主题一致，`ffmpeg` 是一个命令行工具。


    使用此命令安装 `ffmpeg`：


    ```bash

    sudo apt-get install ffmpeg

    ```


    安装完成后，你可以使用 `ffmpeg` 从视频文件中提取音频。例如，假设你有一个名为 `test.avi` 的视频文件。要将音频提取到名为 `audio.mp3`
    的文件中，请使用以下选项和参数的 `ffmpeg`：


    ```bash

    ffmpeg -i test.avi audio.mp3

    ```


    这将创建一个名为 `audio.mp3` 的音频文件，其中包含视频文件的声音。但是，默认情况下，`ffmpeg` 创建的音频文件比特率为 `64 kbps`，这会导致音频质量很低。要强制
    `ffmpeg` 以 `256 kbps` 的比特率创建 `mp3` 文件，请在命令中添加 `-ab` 选项：


    ```bash

    ffmpeg -i test.avi -ab 256k audio.mp3

    ```


    这将创建一个更高质量的 `mp3` 文件，你可以使用此修改后的命令从任何兼容的视频文件中提取音频。


    `ffmpeg` 工具还可以进行许多其他转换——请务必使用此命令阅读 `ffmpeg` 的整个手册页：


    ```bash

    man ffmpeg

    ```


    # 使用 HANDBRAKE 转换视频


    流行的 `Handbrake` 应用程序旨在将 DVD 视频转换为便携媒体播放器可以使用的格式，也可以进行一些视频格式转换。最棒的是，安装只需要几条 `Terminal`
    命令。


    （注意，由于 `Handbrake` 在没有更新的情况下在新版本的 Linux Mint 上可能无法运行，这些说明可能会随着 Linux Mint 下一个版本的发布而过。）


    首先，你需要向系统添加 `Handbrake` 的 PPA（个人软件包存档）。进入 `Terminal` 窗口并输入此命令：


    ```bash

    sudo apt-get install handbrake

    ```


    安装完成后，你可以进入 mintmenu，搜索“Handbrake”，并点击程序图标来启动 `Handbrake`。


    # 使用 VLC 查看媒体


    （我们已经在第 14 章讨论过如何安装 `VLC Media Player`，但在这里重复这些信息也是合适的。）


    `VLC Media Player` 是一个实用的程序，可以播放许多形式的视频，并运行在几乎任何操作系统平台上。它也运行在 Linux Mint 上，安装它非常简单。


    首先，打开 `Terminal` 窗口并输入此命令：


    ```bash

    sudo apt-get install vlc

    ```


    输入密码身份验证，`apt` 将为你下载并安装 `VLC` 及其各种依赖项。（你也可以通过 `Synaptic Package Manager`（同步软件包管理器）和
    Linux Mint 软件中心 安装它。）之后，你可以进入 mintmenu，搜索“VLC”，并点击 `VLC` 图标来启动 `VLC`。


    当然，你观看的大多数媒体可以在互联网上找到，这意味着你需要 Firefox 的 `VLC` 插件。幸运的是，`VLC` Firefox 插件也很安装。返回
    `Terminal` 并输入此命令：


    ```bash

    sudo apt-get install vlc vlc-plugin-* mozilla-plugin-vlc

    ```


    一旦输入密码，`apt-get` 将安装 Firefox 的 `VLC` 插件。你可以通过进入 Firefox 的 `Tools`（工具）菜单并选择 `Add-ons`（扩展）来检查插件是否已安装。在
    `Add-ons` 对话框中，你可以点击 `Plugins`（插件）按钮查看所有插件。你应该能在那里列出 `VLC` 插件。


    ***


    ## 第 21 章 - 进程管理


    我们在前面的章节中已经讨论过进程管理。然而，监控进程——包括跟踪它们的资源使用情况以及需要时终止它们——是 Linux Mint 系统管理的重要部分。在本章中，我们将更详细地从命令行讨论进程管理。


    ## 什么是进程？


    从技术上讲，进程是计算机程序的实例。因此，你在 Linux 上运行的所有程序和应用程序都是进程。例如，如果你运行 `Firefox` 浏览器，然后执行 `top`
    命令，你将在列表中看到进程。当你退出程序时，它就会消失。（进程有时被称为“守护进程”（daemon），但这两个术语并不等同。守护进程实际上是在后台运行的进程。通常，守护进程的名字末尾带有“d”（例如
    SSH 守护进程名为“sshd”），以便与你或其他用户启动的进程区分来。）


    首先，我们将讨论如何使用 `ps` 命令查看运行进程。


    ## PS 命令


    无需说明，管理系统需要你密切关注运行的进程。有很多命令和工具可以监控进程，但最简单的是 `ps` 命令。要使用 `ps` 命令，只需在提示符处输入它：


    ```bash

    ps

    ```


    然而，没有任何选项的情况下，`ps` 并不非常有用。没有任何选项的默认输出如下：


    ![](img/tmp_38c9953b6c998474c8b2473c8ecdee_7hAbx_html_5442f77.jpg)


    在默认状态下，`ps` 只显示当前运行进程——本身和你正在使用的 shell。幸运的是，你可以通过 `-e` 选项让 `ps` 变得有用得多：


    ```bash

    ps -e

    ```


    `-e` 代表扩展（Extended），生成系统上运行的所有进程的列表。


    然而，与 `top` 命令相比，这仍然显示的信息有限。你可以通过 `-l` 选项告诉 `ps` 显示更多信息：


    ```bash

    ps -el

    ```


    `-l` 代表长列表（Long Listing），生成相当多的信息。具体来说，你可以看到启动进程的用户 `UID`（用户 ID）、子进程的父进程的 `PPID`（父进程
    PID）、进程的优先级和 `nice` 值，以及许多其他有用信息。为了获取更多信息，请配合 `-f` 选项使用 `ps`：


    ```bash

    ps -elf

    ```


    除了 `-l` 选项提供的信息外，添加 `-f` 选项还会导致 `ps` 命令显示进程启动的日期以及其执行文件在文件系统中的位置。


