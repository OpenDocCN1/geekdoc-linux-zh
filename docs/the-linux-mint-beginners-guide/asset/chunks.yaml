    ### IP 版本 4 地址 (IP VERSION 4 ADDRESSES)


    首先，我们应该讨论 IPv4。在 Windows 中配置网络之前，熟悉 IPv4 的基础是很有用的。


    IP 协议 TCP/IP（传输控制协议/互联网协议）套件的一部分，定义了计算机在局域网（LAN）中通信的规则。它就像街道地址一样，允许数据向你的系统发送和接收流量。一个
    IP 地址由四组数字组成，用点隔开：


    `192.168.1.1`


    这些数字实际上是 32 位的二进制形式。这些数字都不大于 255。IP 协议的主流版本是版本 4，通常被称为 IPv4。在 IPv4 下，只有 46 亿个
    IP 地址可用，且这些地址在 2011 年就耗尽了。（IPv6 拥有更多地址，最终将取代 IPv4，但目前 IPv4 仍占据主导。）显然，世界上计算机、手机、路由器和其他网络设备的数量远超
    46 亿，那么这些设备是如何获取 IP 地址的呢？


    答案是“私有 IP 地址”。某些 IP 地址区块被保留用于私人网络。这些区块通过名为网络地址转换（NAT）的技术被转换为公共 IP 地址。这已经延长了可用
    IPv4 地址空间的寿命。保留私有地址的范围是：


    `10.0.0.0` - `10.255.255.255`


    `172.16.0.0` - `172.31.255.255`


    `192.168.0.0` - `192.168.255.255`


    你的计算机可能处于这些范围内的 IP 地址（即使只是无线路由器生成的私人网络）。


    此外，你可能会看到像这样的 IP 地址：


    `169.254.1.10`


    以 169.254 开头的 IP 地址是自动私有 IP 地址，或称为 APIPA 地址。APIPA 是 Windows 系统的功能。当网络连接激活但未分配静态
    IP 地址且无法联系 DHCP 服务器（本章稍后会详细介绍这两者）时，Windows 会自动给自己分配一个 APIPA 地址。对于在小型网络上有计算机并希望与其他网络上的计算机通信的情况，这非常有用。然而，拥有
    APIPA 地址的计算机无法与互联网通信。


    你可能会遇到的另一个独特地址是：


    `127.0.0.1`

