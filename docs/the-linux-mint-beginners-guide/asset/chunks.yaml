    The `mintMenu` also has a search box at the top. Enter a term in the search box,
    and `mintMenu` will search your installed applications for it. For instance, if
    you wanted to launch LibreOffice Writer and you didn’t want to bother with looking
    with the categories, type “writer” in the search box, and `mintMenu` will find
    it for you:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m86ab1a1.jpg)


    ## THE PANEL


    The Panel is the bar running down the bottom of your Desktop. Like the `mintMenu`,
    it can be divided roughly into three areas. The left area contains the button
    to launch the `mintMenu` and pinned application shortcuts:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_40ee6da5.jpg)


    The green button directly to the right of the Menu button minimizes all running
    windows and takes you to the Desktop. Next to this button are three application
    shortcuts – one for the Firefox web browser, one for the Terminal, and one for
    Nemo File Manager.


    The middle area of the Panel displays any currently running applications:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_6e29adce.jpg)


    By clicking on the buttons for the running applications, you can switch between
    them as necessary. The buttons will also display additional information, depending
    upon the program. For example, LibreOffice Writer’s button will display the name
    of the current document, and Nemo File Manager will show the name of the directory
    it is currently browsing.


    The right area of the panel is the notification area:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m715cbf8e.jpg)


    The notification area displays the date and time, along with several other key
    pieces of information. If there are updates available for your Linux Mint system,
    they will show up here with a white shield icon. You can also see the status of
    your network connection, control the volume, and by clicking on the window icon
    on the far right-hand side, see all the applications currently running on your
    computer.


    The notification area also lets you make changes to the Panel settings itself.
    Click on the upward-pointing arrow icon, and move the slider switch for Panel
    Edit Mode from Off to On. (It’s set to Off by default to prevent you from accidentally
    altering the panel with an errant click.) Once Panel Edit Mode is enabled, you
    can add new launchers to the Panel and change the behavior of the notification
    area.


    ## LOCKING THE SCREEN


    Locking your screen when you are away from your computer is one of the easiest
    steps you can take to keep both your Linux Mint system and the data it contains
    secure. When you lock your screen, the display goes black. When you tap a key
    or click the mouse, you will see the prompt to enter the password of the currently
    logged-in user, like this:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_1ddac990.jpg)


    Once the screen is locked, only the currently logged-in user can unlock the computer
    by entering his or her password. Alternatively, another user can access the computer
    by clicking the Switch User button and entering his password, but only if that
    user has a valid user account on that computer.


    The security benefits of locking your screen when you''re away from your computer
    should be obvious. If you leave your screen unlocked, anyone could come along
    and access your files or alter your system''s settings. Even worse, sensitive
    data could fall into the wrong hands – consider the disaster that could result
    if you left your bank information open in Firefox and someone unscrupulous happened
    to see your information.


    By default, Linux Mint is configured to lock your screen whenever your computer
    is idle for ten minutes. However, if you need to get up and leave your computer,
    you probably don''t have the time to wait for your computer to lock itself. You
    can manually lock your screen by hitting the `CTRL+ALT+L` keys simultaneously.
    When you do, your screen will go black, and will remain black until you tap a
    key or move your mouse. After a key is tapped or the mouse is clicked, you''ll
    see the prompt to enter your password or switch users. Enter your password, and
    the screen will unlock.


    You can adjust the automatic lock settings by going to the `mintMenu`, to the
    Preferences category, and clicking on the Brightness and Lock icon in the top
    row. This will open up the Brightness and Lock settings:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m3217ddbd.jpg)


    From here you can adjust both the screen lock settings and how long your computer
    will be idle before shutting off the screen. The first drop-down menu, “Turn screen
    off when inactive”, governs how long Linux Mint will wait before shutting off
    the screen when your computer is idle.


    The Lock slider button governs whether or not your computer will lock or not.
    Below that is another drop-down menu that determines when the screen turns off.
    By default, the screen will lock when the monitor shuts off. You can, however,
    set the screen to lock automatically some time after the monitor powers off. For
    instance, you can set your monitor to shut off after 15 minutes, and the screen
    to lock after 30 minutes. (This would be useful if you spend a great deal of time
    in front of your computer while only using it intermittently – if you have to
    make numerous phone calls, for example.)


    The final checkbox at bottom controls whether or not your computer requires a
    password when waking up from suspend. It''s a good idea to keep this option checked
    – if you put your computer to sleep while logged into the system, this will keep
    an unauthorized user from gaining access to your data.


    Generally, it''s a good idea to set your computer to lock automatically, and to
    lock your computer when you leave it unattended for any reason. This will keep
    anyone else from messing with your computer or accessing your data.


    ## LOGGING OUT OF THE COMPUTER


    Logging out of a Linux Mint computer is quick and easy – in fact, it only takes
    three clicks of the mouse. To log out, first click on the `mintMenu`, and then
    click on the Log Out button in the left-hand column – it will look like a power
    button lying on its side:


    ![](tmp_38c39953b6c998474c8b2473c8ecdee_7h3Abx_html_6d1a0cd.jpg)


    You will then see a dialog box asking whether or not you want to log out of the
    computer. Click Cancel if you''ve changed your mind and want to continue using
    the computer. Click Log out if you want to log out of the computer:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m78303484.jpg)


    You will then log out, and the computer will return to the logon screen. Needless
    to say, it''s a good idea make sure you have all your saved first – some applications
    will warn you before you close with unsaved work, but not all will.


    ## RESTARTING THE COMPUTER


    Linux Mint is a remarkably stable operating system, and you can usually go for
    long periods of time without having to reboot your computer. Nevertheless, you
    may have to reboot from time to time. You will almost always have to restart after
    installing updates, and certain applications might require you to restart. Additionally,
    if you install drivers for hardware devices (like a wireless card or a printer),
    you might have to restart, and if an application crashes in an odd way, that too
    might force you to restart.


    To restart your Linux Mint system, go to the `mintMenu`, and click on the power
    button in the bottom of the left-hand column. You will then see a dialog box asking
    if you want to shut down or restart the computer. Click Cancel to if you''ve changed
    your mind and want to continue working. Click the Restart button if you want to
    restart your computer:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m1b094f9c.jpg)


    Your computer will then restart. Needless to say, it''s a good idea make sure
    you have all your saved first – some applications will warn you before you close
    with unsaved work, but not all will.


    ## SHUTTING DOWN THE COMPUTER

