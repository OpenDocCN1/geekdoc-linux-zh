    ![封面](img/cover.jpg)


    # Linux Mint 入学者指南 - 第二版


    Jonathan Moeller


    ## 图书简介


    《Linux Mint 入学者指南》将向你展示如何充分利用 Linux Mint，从使用 `Cinnamon` 桌面环境到高级命令行任务。在在本指南中，你将学习如何：


    - 安装 Linux Mint。

    - 使用桌面环境。

    - 管理文件和文件夹。

    - 管理用户、组和文件权限。

    - 在 Linux Mint 系统上安装软件，包括通过命令行图形图形界面（GUI）。

    - 配置网络设置。

    - 使用 `vi` 编辑器系统配置文件。

    - 安装并配置用于文件共享的 `Samba` 服务器。

    - 安装 `SSH` 以使用公钥/私钥加密进行远程系统控制。

    - 安装 `LAMP` 服务器。

    - 安装 `WordPress` 等 Web 应用程序。

    - 配置 `FTP` 服务器。

    - 管理电子书。

    - 转换数字媒体。

    - 以及许多其他主题。


    《Linux Mint 入学者指南》


    版权所有 2012，Jonathan Moeller

    第二版出版于 2017 年 8 月

    封面图片版权 andresr Imaging | istockphoto.com

    由 Azure Flame Media, LLC 出版

    保留所有权利。


    书中可能出现商标名称。本书并非在每个商标名称出现时都使用商标符号，而是仅以编辑方式使用这些名称并为了商标所有者的利益，无侵犯商标的意图。


    书中的信息按“原样”分发，不提供任何保证。尽管在准备本工作时已采取一切预防措施，但对于因书中包含的信息直接或间接引起或声称引起的任何损失或损害，作者或出版商不对任何个人或实体承担任何责任。


    ## 引言


    欢迎阅读《Linux Mint 入学者指南》第二版。如果你是一个新的 Linux Mint 用户，那么你来对地方了。Linux Mint 是一个强大且多用途的现代操作系统，你可以使用它的桌面版本来执行各种任务，从办公工作、上网浏览到听音乐和玩游戏。在书中，我们将向你介绍使用
    Linux Mint 的基础知识以及与其界面交互。


    ### 什么是 LINX MINT？


    不过，“Linux Mint”究竟是什么呢？


    “Linux”通常指的是基于 `Linux` 内核（`kernel` 是任何操作系统的核心组件）的一系列免费操作系统。Linux 的历史悠久而复杂，但我们在这里提供一个简要的概述。在
    20 世纪 60 年代末 70 年代，AT&T 贝尔实验室开发了 `UNIX` 操作系统，它很快被美国各大学计算机实验室使用。


    然而，AT&T 保留了 `UNIX` 代码的权利，这意味着人们不能自由修改或发行它。作为回应，程序员理查德·斯尔曼（Richard Stallman）于 1983
    年发起了 `GNU` 项目（`GNU` 代表“GNU 不是 Unix”）。斯尔曼发起 `GNU` 项目的目标是创建一个尽管类似于 `UNIX` 的操作系统，但根据“自由软件”原则，该系统是可以自由修改和分发的。这是一种哲学立场，认为软件应该在没有法律限制的情况下自由分发和修改。`GNU`
    项目和斯尔曼本人产生了大量的软件工具和程序。遗憾的是，`GNU` 项目缺乏一个可行的内核，而内核是任何操作系统必不可的核心。


    这种情况在 1991 年发生了变化，当时一位名叫林纳斯·托瓦兹（Linus Torvalds）的芬兰大学学生对 `Minix` 的学术许可感到沮丧，`Minix`
    是一种仅限于教育用途的类 `UNIX` 系统。托瓦兹编写了自己的内核，命名为 `Linux`，并在 `GNU` 自由许可下发布了它。结合 `GNU` 项目，`Linux`
    内核提供了一个免费的操作系统——一个人们可以根据意愿修改和分发的操作系统。


    Linux 就此诞生了。


    （许多人坚持认为 Linux 的正式名称应该是 `GNU/Linux`，以承认 GNU 的关键作用，而且至今许多 `GNU` 程序仍在使用 Linux 中。）


    根据 `GNU` 通用公共许可证（`GPL`）的条款，任何人都可以修改和发行 Linux。今天，Linux 和 Linux 变体运行在每一个不同的计算平台上，从智能手机到桌面电脑再到高端服务器系统。（甚至亚马逊的
    Kindle 和 Barnes & Noble 的 Nook 电子阅读器也由自定义版本的 `Android` 驱动，这是为手机和平板设计的 Linux 版本。）这些不同的
    Linux 版本被称为 Linux “发行版”（distributions）。某些发行版是商业支持的项目，如 `Red Hat Linux` 或 `SuSE
    Linux`，而其他则是免费且社区支持的，如 `Knoppix` 或 `Fedora`。


    较老牌发行版之一是 `Debian`，由德国程序员伊恩·默多奇（Ian Murdock）于 1993 年创立。Debian 以其稳定性和对自由软件原则的坚定坚持而闻名。遗憾的是，Debian
    的发布周期也是出了名的缓慢。因此，Debian 经常被“分支”（fork）——“分支”是将开源项目（可以自由共享和发行）的代码作为另一个开源项目的基础。


    Linux Mint 源自 `Ubuntu`，它是这些分支之一。Ubuntu 由南非企业家马克·舒特沃斯（Mark Shuttleworth）通过他的公司
    `Canonical` 创建，专注于为终端用户提供流畅的体验，为几乎没有 Linux 经验甚至没有电脑经验的人提供一个 Linux 版本。


    Linux Mint 于 2006 年作为 `Ubuntu` 的一个分支开始，由一位名叫克莱门·莱布尔（Clement Lefebvre）的开发者创立。由于
    Ubuntu 在 2011 年和 2012 年做了一些具有争议的设计决策，越来越多的用户开始转向 Linux Mint。目前，Linux Mint 是最流行的
    Linux 发行版之一，每年发布两次新版本。


    ### 本书的目的


    本书的目的是为读者提供 Linux Mint 操作系统的基础介绍。本书并非旨在全面概述，而是对 Linux Mint 的介绍——提供让你开始使用并熟悉它的足够信息。在书中，我们将首先介绍图形界面，然后是命令行本身。


    如果你对学习命令行本身更有兴趣，可以查看我的另一本书——《Linux 命令行入门指南》。


    （顺带提一下，Linux Mint 深度基于 Ubuntu，这意味着书中描述的命令行操作在大多数 Ubuntu 版本上都有效。）


    ### 勘误表


    我尽力确保书中的所有信息准确且及时，并测试了后续章节中描述的每个命令和步骤。然而，我只是凡人，无疑犯了错误。如果你发现任何错误，可以通过邮件 `jmcontact
    @ jonathanmoeller.com` 通知我。电子书相比纸质书的优势在于电子书更容易进行更新和修订，我可以迅速引入修订和更新版来纠正任何错误。


    ### 关于截图的说明


    由于 Linux Mint 是图形化操作系统，本书包含了许多截图来辅助对图形用户界描述。然而，如果你使用的是灰阶墨水阅读器，截图可能不容易查看。如果你查看截图有困难，我建议在平板设备或
    PC 屏幕上使用电子书阅读应用程序阅读本书。


