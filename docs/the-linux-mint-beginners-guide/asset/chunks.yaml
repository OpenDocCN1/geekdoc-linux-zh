    Even `ps –elf` is only a static snapshot of the processes currently running on
    the system. The running processes can change very quickly on a Linux system, and
    you might want to monitor them in real-time. That’s where the `top` command comes
    in.


    # THE TOP COMMAND


    The `top` command has been around forever, and is included in practically every
    variant of Linux. Linux Mint is no exception. The `top` command displays a variety
    of useful statistics, including the “top” users of CPU time (hence the command’s
    name), the amount of memory running processes are using, the amount of virtual
    memory they are using, the process’s priority, the process’s owning user, and
    numerous other useful pieces of information. To launch `top`, simply type the
    command at the command prompt:


    ```

    top

    ```


    Once launched, `top` stays running, displaying statistics in real time. Processes
    are listed by their process ID number, along the name of the command that started
    the process.


    There’s a lot of information listed in `top`, so let’s take a look at the available
    statistics:


    - **PID**: A process’s process ID number.

    - **USER**: The process’s owner. Processes owned by `root` are usually system
    processes, and should be left alone unless they cause problems.

    - **PR**: The process’s priority, which determines how much attention the CPU
    will give this process over other processes. The lower the number, the higher
    the priority.

    - **NI**: The nice value of the process, which affects its priority.

    - **VIRT**: How much virtual memory the process is using.

    - **RES**: How much physical RAM the process is using, measured in kilobytes.

    - **SHR**: How much shared memory the process is using.

    - **S**: The current status of the process (zombied, sleeping, running, uninterruptedly
    sleeping, or traced).

    - **%CPU**: The percentage of the processor time used by the process.

    - **%MEM**: The percentage of physical RAM used by the process.

    - **TIME+**: How much processor time the process has used.

    - **COMMAND**: The name of the command that started the process.


    Of course, you may want to sort the top display by a certain category from least
    to greatest. This is especially useful when you want to figure out what process
    is hogging the most CPU time or memory. Hitting the `t` key will sort the processes
    by CPU time. Hitting `l` will sort by load average, and `m` by memory info.


    Like the GNOME System Monitor application, you can also use `top` to kill uncooperative
    processes. To do this, you’ll need to make note of the process ID you want to
    kill. Hit the `k` key while `top` is running, and the utility will ask you to
    input a process ID number. Input the number, hit `Enter`, and then hit `Enter`
    again when it asks if you want to kill the process (`top` assumes you mean “yes”
    when you hit enter). The `top` utility will then kill the process.


    Once you’ve finished with `top`, hit the `q` key to exit and return to the command
    line.


    Most often, you’ll use the `top` and `ps` commands to track down process that’s
    causing trouble. In the next section, we’ll discuss how to terminate troublesome
    processes with the (appropriately named) `kill` command.


    # THE KILL COMMAND


    The `kill` command, as you might guess from the name, lets you kill running processes.


    Technically, the `kill` command sends signals to running processes. However, this
    command is most commonly used to send the kill a running process. In most cases,
    you will use this command to terminate a process that has frozen up, refuses to
    quit gracefully, or is otherwise misbehaving. Using `kill`, you can terminate
    troublesome processes.


    Note that to use `kill`, you need to know the `PID` (process identification number)
    of the process you wish to terminate. You can find out the PID using either the
    `ps` or the `top` commands (detailed elsewhere in this book).


    To use `kill`, simply type the command with the PID of the targeted process. For
    instance, to terminate a process with the PID of 2589:


    ```

    kill 2589

    ```


    Like other commands, `kill` can be modified with a number of switches. Remember
    that `kill` operates by sending signals to the designated process. The `kill`
    command uses 64 separate signals, which you can list with the `--l` switch:


    ```

    kill –l

    ```


    Of those 64 signals, four of them are commonly used. You tell `kill` which signal
    to send by using the signal’s number as a switch – for instance, `kill-9 2589`.


    15 is the default kill signal. 15 tells the targeted process to cease immediately,
    but only after shutting down gracefully. Since 15 is the default kill signal,
    you don’t usually have explicity specify it, but if you did, the command to send
    the 15 signal to PID 2589 would look like this:


    ```

    kill -15 2589

    ```


    Signal number 1 less drastic. It merely tells the process to restart, while keeping
    the same PID. To use signal number 1:


    ```

    kill -1 2589

    ```


    Signal number 2 sends the `CTRL+C` character combination to a process, which is
    commonly used to break out of a running process (the `ping` command, for instance).
    To send signal number 2 to a process:


    ```

    kill -2 2589

    ```


    Finally, the most drastic signal is number 9. Signal number 9 immediately kills
    a process, and does not give it the option to close gracefully or clean up after
    itself first. Generally, you should only use signal number 9 to terminate a process
    if nothing else has worked first:


    ```

    kill -9 2589

    ```


    Using `ps`, `top`, and `kill`, you can manage the running processes on your Linux
    Mint system from the command line, and quickly respond to any problems.


    ***


    ## Chapter 22 – Working With Documents From The Command Line


    When working with “documents” (such as spreadsheets, presentations, PDF files,
    text documents, and the like), you will spend most of your time in Linux Mint
    since most of the tools for documents are in the GUI. If you need to create an
    elaborate document or a complex spreadsheet, you will need to use a program. (You
    could use vi text editor, but it probably would not be a pleasant experience.)


    That said, there are several command line utilities that allow you to automate
    document management tasks. For example, let’s say you have forty PDF files you
    need to merge into a single PDF, or three hundred ODT documents you need to convert
    to HTML files. If you perform these tasks in the GUI, it will take a great deal
    of repetitive, tedious, and time-consuming pointing and clicking with the mouse.
    However, with a few well-chosen commands, you can easily handle these tasks.


    ### MANAGE PDF FILES WITH PDFTK


    PDF stands for Portable Document Format, and has become the de facto standard
    for official government documents and corporate documents – think of how many
    times you have had to visit a government website or your employer’s website to
    download and fill out an official form in PDF. The upside to this is that a document
    creator can arrange to have a PDF look exactly the way he wants it, since PDFs
    are readable on many different operating systems and devices. The downside is
    that if you need to change a PDF file after it has been created, changing it is
    both annoying and difficult.


    The is where the `pdftk` utility comes into play. The `pdftk` utility (it’s short
    for “PDF Toolkit”) allows you to combine and separate PDF files. It’s not included
    in the default installation of Linux Mint, but you can rectify that in short order
    from the command line. Log into an account with administrative rights, go to a
    Terminal window, and type this command:


    ```

    sudo apt-get install pdftk

    ```


    Enter your password to authenticate, and `apt` will download and install `pdftk`
    for you. After the installation is complete, you can use `pdftk` from the command
    line.


    Now that you have `pdftk` installed, we’ll show you how to use it combine PDF
    files. Let’s say, for example, that you have three PDF files: `Page1.pdf`, `Page2.pdf`,
    and `Page3.pdf`. You need to combine them into a single PDF document called `FinalDraft.pdf`.
    You could do this via LibreOffice or another document editing program. Or you
    could do it with `pdftk`:

