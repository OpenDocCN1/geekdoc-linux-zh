- fmt: '

    Linux Mint will then “paste” the file in the new location. Copy, Cut, and Paste
    in Nemo works exactly like copying and pasting in a word processor or a spreadsheet
    application. The source file is deleted, and a copy of the file is created in
    the destination directory.


    Additionally, you can also use what''s called “drag-and-drop” to move files around
    from directory to directory. To do so, left-click on the file or folder you want
    to move, and hold down the left mouse button. The file will be highlighted. While
    continuing to hold down the left mouse button, drag the icon of the file to the
    new location. Linux Mint will then move the file to the new location.


    (Note that if you drag-and-drop files from an external disk or to an external
    disk, Linux Mint only copies the files. For example, if you dragged-and-dropped
    a file from your USB flash drive to your Desktop, the file would be copied to
    your Desktop, but the original file would remain on the USB flash drive.)


    What if you want to copy more than one file or folder at once? Like if you wanted
    to copy a hundred pictures from your digital camera''s memory card to your Linux
    Mint system''s Pictures folder? You could drag-and-drop or Copy and Paste each
    individual file, but this would be a massive waste of time. You could drag-and-drop
    the folder containing the picture files, but what if there are pictures mixed
    in the folder that you don''t want to keep?


    This is where SHIFT-clicking and CTRL-clicking come into play. Using SHIFT-clicking
    and CTRL-clicking, you can select multiple files simultaneously, and then copy
    or move them all at once. We''ll look at SHIFT-clicking first.


    ### SHIFT-clicking


    SHIFT-clicking lets you select large quantities of files at once. To use it, first
    left-click on a single file:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m5a9ff76e.jpg)


    Then hold down the shift key, and click on another file. You will notice that
    Linux Mint will then select every file between the first one you clicked and then
    file you clicked while holding down the SHIFT key:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m767a4184.jpg)


    Using SHIFT-clicking, you can select a large mass of files or folders all at once.
    Then you can drag-and-drop them to a new destination, or right-click on them to
    Copy and Paste. But what if you only want to select six files scattered throughout
    a list of a hundred? SHIFT-clicking will move them all at once.


    ### CTRL-clicking


    This is where CTRL-clicking will come in handy. Like SHIFT-clicking, CTRL-clicking
    allows you select multiple files simultaneously. But while SHIFT-clicking selects
    dozens or even hundreds of files and folders at at once, with CTRL-clicking, you
    can select multiple files one by one, and then move, copy, or delete them.


    First, left-click on the first file you want to move:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m5a9ff76e.jpg)


    Then hold down the CTRL key and click on a second file:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_3d0aec48.jpg)


    You''ll notice that CTRL-clicking selects only the files you click on, and not
    all the files between them like SHIFT-clicking. CTRL-clicking lets you pick multiple
    files or folders and perform the same action on them simultaneously.


    In the next section, we''ll show you how to delete files.


    ## DELETING FILES


    In the old days of both Linux and Microsoft DOS, most personal computers did not
    have a graphical user interface, and so you had to delete files from the command
    line. And when you did, the files were gone forever – there was no easy way to
    get them back. Linux Mint, like many operating systems with a graphical user interface,
    makes things a little easier on the user with the Trash. The Trash is always in
    the left-hand navigation column of Nemo File Manager:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m501fc726.jpg)


    The Trash is sort of a “holding pen” for deleted items. When you delete an item,
    instead of disappearing, it goes into the Trash. That way, if you delete something
    by mistake, it will sit in the Trash until you remember that you actually need
    it.


    To move a file or a folder to the Trash, right-click on the file or folder in
    question. When the context menu appears, select Move to Trash from the menu:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_5c4eedc3.jpg)


    The file or folder in question will then move to the Trash. Note that if you move
    a folder to the Trash, any files or subfolders the folder contains are also moved
    to the Trash, so take care when deleting folders.


    What if you change your mind and want to bring it back? To restore a file or folder
    from the Trash, right-click on it in the Trash and select Restore Items from the
    menu. The interior of the Trash will look something like:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m14aa37.jpg)


    One of the main reasons to delete files is to free up space, and so long as the
    files sit in your Trash, they will continue to take up space. To permanently remove
    the files, you have to empty it. You can empty Trash from within the Trash:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_2d9efcfa.jpg)


    This will empty it. Be careful using it – once you do, the files will be gone.


    ***


    ## Chapter 3 - Creating Users and Groups


    During the installation of Linux Mint, the installer prompts you to create an
    administrative account. If you''re the only one to use your machine, that should
    be enough. But if you have more than one person using your Linux Mint, you''ll
    quickly need additional accounts to keep everyone''s files organized. Assigning
    permissions is well and good, but you need more than one user account to make
    permissions work properly. You may also find it necessary to organize those accounts
    into groups.


    ### ADDING USERS


    To start, let''s discuss adding users to system. You can do this through the GUI,
    quite easily. Merely go to the mintmenu, click on the Administration icon, and
    click on the Users and Groups item. From here, you can add and delete user accounts.


    However, we''ve been focusing on how to do things from the command line, and you
    can add and remove users and groups quite easily with a few commands. For our
    example, let''s say you want to add a user account for a woman named Caina Amalas.


    (Shameless authorial plug: Caina Amalas is the name of the character I''ve written
    for a series of ninteen sword & sorcery novels.)


    To begin, it''s best to choose some kind of naming convention for your user accounts.
    A naming convention sounds fancy, but it just means that you just stick to a consistent
    way of naming the accounts. Usually, something like the first initial and the
    last name is best - like "camalas" for Caina Amalas.


    To actually create the new camalas user account, use the `useradd` command. You''ll
    need root-level permission to create an account, so you''ll have to use `useradd`
    with the `sudo` command:


    ```

    sudo useradd camalas

    ```

