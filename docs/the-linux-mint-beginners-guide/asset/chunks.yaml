    a folder, double-click on it. The list of links in the left-hand column is useful,
    since they will take you to the most common locations you will visit – your Documents
    folder, for instance.


    You can use the left and right arrows to navigate forward and backward through
    folders you have visited. For instance, if you click on the Documents folder in
    your home folder, Nemo will take you to the Documents folder. To go back to your
    home folder, click on the back button (the arrow pointing to the left). Once you
    have returned to your home folder, Nemo can take you back to Documents by clicking
    on the Forward button (the arrow that points to the right). These two buttons
    work in much the same way as the Back and Forward buttons in a web browser.


    The Nemo File Manager also offers a useful feature called “breadcrumbs”, which
    allows you to quickly backtrack out of folders. For example, let''s say you are
    looking at a folder called MarchReports inside of another folder called Spreadsheets,
    which is in turn inside of your Documents folder. The breadcrumbs will then look
    like this:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_5e874772.jpg)


    You can return to any of the folders by clicking on its name in the row of breadcrumbs.
    Clicking on Documents would return you to your Documents folder, while clicking
    any of the other breadcrumbs would take you to the folder identified in the breadcrumb.


    Now that you know how to navigate through folders, we''ll show you how to create
    one.


    CREATING FOLDERS


    Creating folders in Linux Mint is a simple process, and takes all of two mouse
    clicks.


    To create a folder, first navigate to the location where you want to put the new
    folder. So if you want the new folder on your Desktop, you''d go to your Desktop.
    If you wanted to put the new folder in a different location, such as your Documents
    folder, go there instead.


    Once you are at the desired location, right-click at an empty spot in the folder,
    and the context menu will appear:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_40f6911f.jpg)


    From the context menu, select the Create New Folder option, which is at the top
    of the menu. You will then see a new folder, titled “untitled folder”, appear:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m7f3a9e5a.jpg)


    The name of the folder (currently “untitled folder”) is in green, which means
    you can start typing a new name for the folder. Type a new name and hit enter,
    and Linux Mint will assign that name to the folder.


    RENAMING FILES AND FOLDERS


    You may need to change the name of a file or a folder for a variety of reasons.
    To rename a file or folder, right-click on the file or folder, and select Rename
    from the context menu:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m2c50155f.jpg)


    The file or folder''s name will then be highlighted in green. Type a new name,
    and hit Enter. The file will then be renamed.


    COPYING AND MOVING FILES


    Linux Mint and Nemo File Manager make copying and moving files a fairly simple
    procedure. There are a number of ways to copy files, and we''ll go through them
    in this section.


    First, navigate to the folder or file you want to copy. Right click on the folder
    or file to bring up the context menu, and then select Copy from the menu:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m2c50155f.jpg)


    Next, navigate to the folder or drive where you want to copy the file or folder.
    Right click on a blank spot in the folder, and select Paste from the context menu:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_60476cd5.jpg)


    Linux Mint will then make a copy of the file in the new location.


    Suppose you want to move the file to a new location entirely, rather than copy
    it. You can do this as well, though it takes a few extra mouse clicks. First,
    right click on the file or folder, and select copy from the context menu:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m2c50155f.jpg)


    After you have selected Copy, right-click on the file or folder again and select
    Cut from the context menu:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m2c50155f.jpg)


    Then navigate in Nemo to the desired destination folder. Right-click on a blank
    spot in the folder, and click the Paste button:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_60476cd5.jpg)'
