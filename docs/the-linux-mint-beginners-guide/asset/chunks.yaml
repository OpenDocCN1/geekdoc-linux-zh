    You’ve probably heard the term “database” thrown around, but may or may not have
    a clear idea what it means. Put simply, a database is any system designed to create,
    store, retrieve, and manage a large amount of digital information. There are many
    different kinds of databases, but the most common kind is a “relational database”,
    a database that uses multiple tables (and each table has many rows and columns)
    to store the necessary data. Most modern databases are technically a RDBMS, a
    “relational database management system”, which is a way of describing a database
    (and any attendant software) that uses the relational model.


    The most popular and widely-used open-source RDBMS currently in use is a program
    called `MySQL`. Two computer programmers named Michael Widenius and David Axmark
    began developing `MySQL` in 1994, and the software was eventually acquired by
    Sun Corporation, and then by Oracle Corporation, when Oracle bought Sun in 2010.
    The name “MySQL” comes from two sources. The “My” part apparently comes from Michael
    Widenius’s daughter, named My. The “SQL” comes from “Structured Query Language”,
    which is a computer language designed to handle the tasks of inserting, retrieving,
    managing, and deleting data in an RDBMS.


    `MySQL` has been around for a long time, and it’s used in a lot of websites –
    Google, Facebook, and Wikipedia all use `MySQL`, and many of the more popular
    content management systems, like WordPress and Drupal, rely on `MySQL` to store
    data.


    `MySQL` installs quite easily on a Linux Mint system. In this chapter, we’ll show
    you how to install and configure `MySQL`, how to create databases and database
    users from the `MySQL` command line, and how to install phpMyAdmin for an easier,
    graphical-based means of configuring `MySQL`.


    ## INSTALL MYSQL SERVER


    To install MySQL Server on Linux Mint, make your way to a Terminal window or a
    command prompt, and type this command:


    ```

    sudo apt-get install mysql-server-5.7

    ```


    (As of this writing, `MySQL` Server version 5.7 is the latest version available
    in the Linux Mint repositories, though future versions of Linux Mint may receive
    the newer versions of `MySQL`.)


    Enter your password to authenticate, and `apt` will download the `MySQL` files
    and install them for you. It’s a big set of files, so depending on the speed of
    your Internet connection, it might take a while to download. After the files are
    downloaded and are installing, the installer will ask you for a password for `MySQL`s
    root user. Just as the root user in Linux has complete control over the system,
    the root user in `MySQL` has absolute control over all databases, tables, permissions,
    and users. For obvious security reasons, you’ll want to create an extremely strong
    password (a mixture of uppercase, lowercase, numbers, and punctuation, the longer
    the better) for your `MySQL` root user.


    (Note that in the password dialog box, if you can’t get the `<OK>` field selected,
    you can use the tab key to jump from the text input line to the `<OK>` field.)


    After you enter the root password, the installer will finish working with the
    `MySQL` files, and return you to the command line.


    Next, you’ll want to run the `mysql_secure_installation` script to tighten up
    security on your new `MySQL` server. Run this command from the prompt:


    ```

    sudo mysql_secure_installation

    ```


    First, the `mysql_secure_installation` script will ask you to enter the current
    password for the `MySQL` root user. After you do that, it will ask if you want
    to change the root password. Since you already set a root password, you can hit
    “n” (unless you want to change it again for some reason).


    Next, the script will ask you to setup the `VALIDATE PASSWORD` plugin, which checks
    passwords for appropriate strength. Hit Y to accept, and then set the password
    strength level by hitting 0 for Low, 1, for Medium, and 2 for Strong.


    Next, the script will ask if you want to remove the anonymous user. The anonymous
    user, like anonymous access in FTP, lets someone log into `MySQL` without having
    a proper user account. For security reasons, it’s always best to remove the anonymous
    user, so hit “y” to continue.


    After that, the script will ask if you want to prevent the `MySQL` root user from
    logging in remotely to the `MySQL` server. Always hit “y” to forbid root remote
    access, since if an attacker guesses your root password, he can destroy your databases
    or steal the information they contain.


    After this, the script will ask if you want to remove the test database. `MySQL`
    includes a test database that anyone can access. Again, this is a security hole,
    so you’ll want to hit “y” to remove the test database.


    The script will then ask to reload the privilege tables so the changes take effect.
    Hit “y”, and the `mysql_secure_installation` script will conclude and return you
    to the command line.


    `MySQL` server is now installed on your Linux Mint system. In the next section,
    we’ll discuss using the `MySQL` command-line client to create databases and users.


    ## USING THE MYSQL COMMAND-LINE CLIENT


    The most common use for `MySQL` on a Linux Mint system is to provide a backend
    for a dynamic website of some kind, usually content management systems like WordPress
    or MediaWiki. To host these websites on a Linux Mint machine, you’ll need to create
    a database and a database user for the website. `MySQL` Server can support many
    different databases, limited by the amount of hardware and disk space available
    on the machine. (Hosting multiple active databases at the same time places a high
    level of demand upon a hard drive.)


    Like Samba, `MySQL` has its own collection of user accounts, separate from the
    main system accounts, called "database users." A database user is simply a `MySQL`
    user that has access to a particular database, or specific tables within a database.
    In this section, we’ll show you how to create database and users with the command-line
    client.


    First, you''ll need to get to the MySQL client. The MySQL client, like the command-line
    clients for FTP and SFTP, has its own prompt. To access that prompt and start
    the client, use this command:


    ```

    mysql

    ```


    However, if you simply type the command, it will bounce back with an error message.
    To use the MySQL client, you need to add the `-u` and `-p` switches as well. The
    `-u` switch tells it what MySQL user you want to use to log into the client (similar
    to the `-l` switch with SSH). The `-p` switch tells it to ask for the password.
    So, to use the MySQL client as the MySQL root user, the command should look like
    this:


    ```

    mysql -u root -p

    ```


    Enter the password for the MySQL root user, and you''ll find yourself at the MySQL
    command prompt, which will look like this:


    ```

    mysql>

    ```


    Our next steps are to create a database, create a user to access that database,
    and grant our new user all rights to that database. Generally, when you''re installing
    a web application like WordPress, you''ll give the database user you create for
    the WordPress application all rights to the WordPress database so it can function
    properly. Not giving the application user all rights to the database can cause
    the application to act erratically or even fail entirely.


    An important note before we continue, though. All commands made from the MySQL
    prompt must end with a semicolon to denote the end of the statement. Any commands
    that do not end with a semicolon will not work. With that in mind, let''s first
    create a database.


    To create a database, use this command at the `mysql>` prompt:


    ```

    CREATE DATABASE newdatabase;

    ```


    The MySQL client will respond with a message that should say "Query OK, 1 row
    affect (0.00 sec)." This means the command was successful, and a new database
    named `newdatabase` has been created.


    Next, you''ll create a user who will access that database:


    ```

    CREATE USER newdatabaseruser;

    ```

