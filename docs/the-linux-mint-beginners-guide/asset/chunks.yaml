- fmt: '

    Generally, connecting to a Samba share on Linux Mint machine from a Windows client
    should be straightforward. However, there are a few pitfalls to beware.


    Let''s assume that you''ve stuck with the settings we''ve used already, and you
    now have a Linux Mint Samba server with an IP address of `192.168.1.2` (and a
    subnet mask of `255.255.255.0`). The server hosts a share called "test", and the
    user account `camalas` has access with a password of "ghost." You want to connect
    to this share from a Windows machine with an IP of `192.168.1.3` and a subnet
    mask of `255.255.255.0`.


    On the Windows machine, go to Start menu, and then to Run (or hit the Windows
    Key and R simultaneously), and type this into the Run box:


    ```

    \\192.168.1.2

    ```


    Alternately, you can also type this into the address bar in any Windows Explorer
    window. This is what''s called a UNC path - a "Universal Naming Convention" path.


    Unless you have a DNS server set up, it’s better to use the IP address instead
    of the hostname to access your Linux Mint machine from Windows. In fact, if you
    don’t have a DNS server set up, you’ll *have* to use the IP address to get to
    the Samba server from your Windows machine, since your Windows machine won’t be
    able to resolve the Linux Mint’s IP address. Giving your Linux Mint machine a
    static IP address, as we discussed in Chapter 7, would make this easier.


    Click OK if you typed the UNC into the Run box, or hit the Enter key if you typed
    it into Windows Explorer, and you should receive a username and password prompt
    for the share. Using the example above, enter your username and password in this
    format:


    ```

    camalas@192.168.1.2

    ghost

    ```


    It’s necessary to enter the username as `camalas@192.168.1.2` (or as `192.168.1.2\camalas`,
    alternately), because otherwise Windows tries to authenticate the Samba share
    against its own accounts. That, of course, will not work. Using the IP address
    in the account name forces Windows to authenticate against the Samba server.


    If that doesn’t work, first make sure you’ve typed the username, the password,
    and the IP address correctly. One mistake and it won’t work, and the password
    IS case sensitive. Next, check the `/etc/samba/smb.conf` file to make sure the
    share permissions are set correctly. Also check the filesystem permissions and
    ownership of the folder you are trying to access. Your user account will need
    to have permission to actually get at the share folder, regardless of the share
    permissions. If you created the share folder using `sudo`, for instance, the root
    user and the root group will have ownership of the folder, and you won’t be able
    to get at it using your Samba account.


    # Chapter 11 - FTP Client and Server


    FTP stands for "file transfer protocol", and it allows you to transfer files to
    a remote computer. FTP has been around forever, and it has a number of pros and
    cons. Since FTP is so old, it is supported on virtually every operating system,
    and most operating systems include an FTP client of some kind. The downside is
    that FTP is not terribly secure. It has a bad habit of rotating ports, which makes
    it hard to use across the Internet (firewalls really don''t like having ports
    change on them abruptly), and an FTP server that allows for anonymous login is
    tremendously insecure - anyone can upload or download material, which means that
    an FTP server that allows anonymous access can quickly find itself hosting illegal
    material. (These days, FTP servers that allow anonymous access are quite extremely
    rare.) I strongly prefer to use SFTP instead, which we will discuss in Chapter
    11.


    However, Linux Mint can act as an FTP server with a reasonable degree of security.
    In this chapter, we''ll show you how to set up Linux Mint as an FTP server, and
    how to use a command-line FTP client.


    ## INSTALL AND CONFIGURE AN FTP SERVER


    The most common FTP server software for Linux Mint is the `vsftpd` package, which
    stands for "very secure FTP daemon." It''s the default FTP package for Linux Mint,
    and most other Linux distributions as well. As an added bonus, `vsftpd` is pretty
    secure out of the box - to make it insecure, you have to go out of your way to
    mess up the configuration file.


    As an added bonus, `vsftpd` is simple to install and configure on a Linux Mint
    machine. To install the `vsftpd` package, make your way to a command prompt and
    type this command:


    ```bash

    sudo apt-get install vsftpd

    ```


    Enter your password to authenticate and `apt` will download and install `vsftpd`
    for you.


    Follow the default prompts, and the `vsftpd` server will be installed on your
    computer. Generally, the default configuration for `vsftpd` is pretty secure,
    and good enough for casual use. Anonymous users are blocked, and no one can write
    files to the server (or, in FTP terminology, no one can upload files to the server).
    Anyone with a system account will be able to connect to the FTP server and download,
    though not upload, files.


    If you want to change any settings, the configuration file for `vsftpd` is `/etc/vsftpd.conf`.
    Like any other configuration file, you can edit it with `vi`:


    ```bash

    sudo vi /etc/vsftpd.conf

    ```


    Like Samba, the `vsftpd.conf` file contains a large number of "directives" that
    govern how the server behaves and operates. If you want to change its configuration,
    you''ll need to change it.


    If you want users to be able to write files to the server, change this directive:


    ```

    #write_enable=YES

    ```


    To this:


    ```

    write_enable=YES

    ```


    With the `write_enable` directive set to `YES`, users will be able to upload files
    to the server. Note, however, they will only do so if they have proper permissions.


    Anonymous access is controlled with this directive:


    ```

    anonymous_enable=NO

    ```

    *Under no circumstances should you allow anonymous access to your server, especially
    if it is accessible from the Internet!* There are certain circumstances when you
    might find it useful, but you should only enable it if you know *exactly* what
    you are doing.


    If you make any changes to the file, save the changes, and then exit vi. Then
    restart the server so it reads its new directives:


    ```bash

    sudo service vsftpd restart

    ```


    You can then test your Linux Mint’s FTP service from the server''s command line:


    ```bash

    ftp 127.0.0.1

    ```


    The FTP client will then ask for your username. (Note that this will be your username
    and password on the FTP server, not your username and password on the computer
    with the FTP client.) Type it and hit enter. The client will ask for your password,
    which you should then enter. Once you do, you''ll be taken to the FTP prompt,
    which looks like this:


    ```

    ftp>

    ```


    If you see that, you know the server is working. You can return to the regular
    command line with this command:


    ```

    exit

    ```


    ## USING THE FTP CLIENT


    Just because you have an FTP server doesn''t mean you can access it straightaway
    - you first need a program called an "FTP client" that will let you communicate
    with the FTP server. Fortunately, Linux Mint comes with a built-in FTP client
    - you can access it from the command line by simply typing:


    ```bash

    ftp

    ```


    However, it''s far easier to use if you know the IP address of the FTP server
    you want to access. Let''s say you want to access a FTP server with an IP address
    of `192.168.1.100`. To do so, you would append the IP address to the ftp client
    command:


    ```bash

    ftp 192.168.1.100

    ```


    The FTP client will then ask for your username. (Note that this will be your username
    and password on the FTP server, not your username and password on the computer
    with the FTP client.) Type it and hit enter. The client will ask for your password,
    which you should then enter. Once you do, you''ll be taken to the FTP prompt,
    which looks like this:


    ```

    ftp>

    ```


    You can also specify a different username as part of the ftp command. If, for
    instance, you wanted to use our `camalas` account to connect to the FTP server
    at `192.168.1.100`, the command would look like this:


    ```bash

    ftp camalas@192.168.1.100

    ```

