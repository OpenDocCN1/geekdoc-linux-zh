- fmt: '

    (If you read straight through the next few sections, you’ll notice that I’ll repeat
    a lot of the directions we already discussed. There are two reasons for that.
    The first is that WordPress, `MediaWiki`, and `Moodle` all use a lot of the same
    software components. The second is that I wanted each web app to have its own
    complete set of instructions, so I don’t have to say “next, install Apache like
    we discussed in Chapter 11”, which means you don’t have to scroll back and forth.
    I personally hate it when technical writers do that, so I’m not going to do that
    here. Besides, this is an ebook, so it’s not as if repeating some directions will
    drive up the printing costs.)


    # INSTALL WORDPRESS ON Linux Mint


    WordPress, first developed in 2003, is a content management system that runs quite
    a variety of websites. In WordPress’s early days, it tended to run only personal
    blogs and smaller sites. However, the software improved considerably with every
    version, and it’s adaptable enough to be used for a variety of different sites.
    WordPress’s big break came in 2009 when popular blogging platform `Movable Type`
    made unpopular changes to its licensing terms. Enough Movable Type users were
    annoyed with the change to migrate to WordPress, and WordPress is the dominant
    open-source content management system on the Internet as of this writing.


    It’s quite possible to install WordPress on a machine running either the desktop
    or the server version of Linux Mint. This makes an excellent environment for testing
    and experimentation, since you can tweak and experiment to your heart’s desire
    without rendering your production blog inoperable. If you need to run an internal
    corporate blog of some kind, hosting WordPress on an Linux Mint box or virtual
    machine is a cheaper solution than more expensive blogging or collaboration software.
    Or, if you’re really ambitious (and you can afford the bandwidth), you can host
    an Internet-accessible WordPress blog out of your apartment.


    Let’s begin!


    (Note that the Linux Mint repositories now contain a fully automated WordPress
    installation. However, I believe that installing it by hand yourself has significant
    value – you’ll not only learn how to set up a LAMP server, but installing step-by-step
    gives you valuable troubleshooting knowledge later on in case something breaks.)


    First, install Linux Mint into your machine of choice. Once Linux Mint is installed
    and updated, you will need to install five pieces of software: the Apache web
    server, the MySQL database server version `5.7`, PHP version `7`, the MySQL module
    for PHP, and finally the WordPress software itself.


    ## Install the Apache web server


    First, install the Apache web server. To install Apache, go to a Terminal window
    or a command prompt and type this command:


    ```bash

    sudo apt-get install apache2

    ```


    (Technically, you’ll be installing Apache 2, the latest version.)


    Enter your password to authenticate, follow the default prompts, and `apt` will
    download and install the Apache web server for you.


    And that’s it! Apache should now be working. To test it from the web server itself,
    go to a web browser and visit the address `http://127.0.0.1`. You’ll remember
    that this is the “local loopback” address, basically the address the computer
    uses to refer to itself. Alternatively, you could test it from another computer
    on the same subnet. For instance, if you installed Apache on a computer with an
    IP address of `192.168.1.100`, you could test it by going to another computer
    on the same subnet and visiting `http://192.168.100` from the web browser.


    Regardless, if Apache is working properly, you should see the default Apache/Linux
    Mint web page with the Linux Mint logo in the upper left-hand corner.


    Apache is now operational.


    ## Install the MySQL database server


    The next step to install WordPress is to install the MySQL database server. Return
    to the Terminal and type this command:


    ```bash

    sudo apt-get install mysql-server-5.7

    ```


    (As of this writing, MySQL Server version `5.7` is the latest version available
    in the Linux Mint repositories, though future versions of Linux Mint may receive
    the newer versions of MySQL.)


    Enter your password to authenticate, and `apt` will download the MySQL files and
    install them for you. It’s a big set of files, so depending on the speed of your
    Internet connection, it might take a while to download. After the files are downloaded
    and are installing, the installer will ask you for a password for MySQL’s `root`
    user. Just as the `root` user in Linux has complete control over the system, the
    `root` user in MySQL has absolute control over all databases, tables, permissions,
    and users. For obvious security reasons, you’ll want to create an extremely strong
    password (a mixture of uppercase, lowercase, numbers, and punctuation, the longer
    the better) for your MySQL `root` user.


    (Note that in the password dialog box, if you can’t get the `<OK>` field selected,
    you can use the `tab` key to jump from the text input line to the `<OK>` field.)


    After you enter the root password, the installer will finish working with the
    MySQL files, and return you to the command line.


    Next, you’ll want to run the `mysql_secure_installation` script to tighten up
    security on your new MySQL server. Run this command from the prompt:


    ```bash

    sudo mysql_secure_installation

    ```


    First, the `mysql_secure_installation` script will ask you to enter the current
    password for the MySQL `root` user. After you do that, it will ask if you want
    to change the root password. Since you already set a root password, you can hit
    “n” (unless you want to change it again for some reason).


    Next, the script will ask you to setup the `VALIDATE PASSWORD` plugin, which checks
    passwords for appropriate strength. Hit Y to accept, and then set the password
    strength level by hitting `0` for Low, `1`, for Medium, and `2` for Strong.


    Next, the script will ask if you want to remove the anonymous user. The anonymous
    user, like anonymous access in FTP, lets someone log into MySQL without having
    a proper user account. For security reasons, it’s always best to remove the anonymous
    user, so hit “y” to continue.


    After that, the script will ask if you want to prevent the `root` user from logging
    in remotely to the MySQL server. Always hit “y” to forbid root remote access,
    since if an attacker guesses your root password, he can destroy your databases
    or steal the information they contain.


    After this, the script will ask if you want to remove the test database. MySQL
    includes a test database that anyone can access. Again, this is a security hole,
    so you’ll want to hit “y” to remove the test database.


    The script will then ask to reload the privilege tables so the changes take effect.
    Hit “y”, and the `mysql_secure_installation` script will conclude and return you
    to the command line.


    MySQL server is now installed on your Linux Mint system.


    ## Install PHP and WordPress


    The next step to installing WordPress is to install PHP `7`:


    ```bash

    sudo apt-get install php

    ```


    Next, install the `libapache2-mod-php7.0` library, which allows PHP to communicate
    properly with Apache:


    ```bash

    sudo apt-get install libapache2-mod-php7.0

    ```


    Then install the MySQL module for PHP:


    ```bash

    sudo apt-get install php-mysql

    ```


    You may also want to install the GD library for PHP, since many WordPress plugins
    rely on it for graphical manipulation (note that this is an optional step):


    ```bash

    sudo apt-get install php-gd

    ```


    Finally, download the WordPress software to your computer. You can obtain it from
    this address:


    `http://wordpress.org/latest.tar.gz`


    If you’re working exclusively from the command line, you can use this command
    to download the WordPress software:


    ```bash

    wget http://wordpress.org/latest.tar.gz

    ```


    Use this command to unpack the WordPress files:


    ```bash

    tar -xzvf latest.tar.gz

    ```


    Move the WordPress files over to the `/var/www/html` directory. (In this command,
    I’ll assume you unpacked the WordPress files to your home directory; you will
    have to adjust the command if you unpacked them in a different directory.)


    ```bash

    sudo cp -r ~/wordpress/* /var/www/html/

    ```

