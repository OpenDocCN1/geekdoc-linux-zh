    # CONVERTING AUDIO WITH SOUND CONVERTER


    If you have a `WAV` file that you want to convert to an `MP3`, it’s possible to
    do so quite easily and simply on a Linux Mint system. You just need one software
    package: the `GNOME Sound Converter` application. The Sound Converter program
    offers a GUI for converting sound files from one format to another.


    To install the Sound Converter program itself, go to a `Terminal` window and type
    this command:


    ```bash

    sudo apt-get install soundconverter

    ```


    After you enter your password to authenticate, `apt-get` will download and install
    `SoundConverter` and its necessary dependencies. After the installation is complete,
    you can launch Sound Convert by going to the mintmenu, searching for “soundconverter”,
    and clicking on the Sound Converter icon.


    Once the program has launched, go to the `Edit` menu, and to the `Options` item.
    From there you can set the kind of output you want the program to produce (`OGG`
    files, `MP3` files, or `AAC` files), as well as the destination folder for the
    converted files. Once you’ve selected your preferences, hit the `Close` button,
    and then `Add Files` on the program’s main toolbar to choose the files you want
    to convert.


    # CONVERT AUDIO AND VIDEO WITH FFMPEG


    From time to time you may need to extract the sound from a video file. Fortunately,
    using the `ffmpeg` program, it’s quite simple to take the sound from any video
    file and store it as a separate file. The `ffmpeg` utility can convert back and
    forth between multiple formats of both video and sound. Even better, in keeping
    with the overall theme of this book, `ffmpeg` is a command-line utility.


    Use this command to install `ffmpeg`:


    ```bash

    sudo apt-get install ffmpeg

    ```


    After the installation is complete, you can use `ffmpeg` to extract the audio
    from a video file. Say, for example, you have a video file named `test.avi`. To
    extract the audio to a file named `audio.mp3`, use `ffmpeg` with these options
    and arguments:


    ```bash

    ffmpeg -i test.avi audio.mp3

    ```


    This will create an audio file named `audio.mp3` containing the sound from the
    video file. However, by default `ffmpeg` creates audio files with a bitrate of
    `64 kbps`, which results in very low-quality audio. To force `ffmpeg` to create
    the `mp3` file at the `256 kbps` bitrate, add the `-ab` option to the command:


    ```bash

    ffmpeg -i test.avi -ab 256k audio.mp3

    ```


    This will create a higher-quality `mp3` file, and you can use this modified command
    to extract the audio from any compatible video file.


    The `ffmpeg` utility can do many other conversions as well – be sure to read the
    entire manual page for `ffmpeg` with this command:


    ```bash

    man ffmpeg

    ```


    # CONVERT VIDEO WITH HANDBRAKE


    The popular `Handbrake` application is designed to convert DVD video into a format
    that portable media players can use, and can also do some video format conversion
    as well. Best of all, the installation only takes a few `Terminal` commands.


    (Note that since `Handbrake` tends not to work on new versions of Linux Mint without
    an update, these directions may become out of date with the next version of Linux
    Mint.)


    First, you’ll need to add `Handbrake`’s PPA (personal package archive) to your
    system. Go to a `Terminal` window and type this command:


    ```bash

    sudo apt-get install handbrake

    ```


    After the installation is complete, you can launch `Handbrake` by going to the
    mintmenu, searching for “Handbrake”, and clicking on the program’s icon.


    # VIEW MEDIA WITH VLC


    (We already discussed installing `VLC Media Player` in Chapter 14, but it seems
    appropriate to repeat the information here.)


    `VLC Media Player` is a handy program that can play numerous forms of video, and
    runs on just about any OS platform. It also runs on Linux Mint, and installing
    it is quite simple.


    First, open up a `Terminal` window and type this command:


    ```bash

    sudo apt-get install vlc

    ```


    Enter your password to authenticate, and `apt` will download and install `VLC`
    and its various dependencies for you. (You can also install it through `Synaptic
    Package Manager` and `Linux Mint Software Center.) Afterwards you can launch `VLC`
    by going to the mintmenu, searching for "VLC", and clicking on the `VLC` icon.


    Of course, most of the media you watch will probably be found on the Internet,
    which means you’ll want the `VLC` plugins for Firefox. Fortunately, the `VLC`
    Firefox plug is also easy to install. Return to the `Terminal` and type this command:


    ```bash

    sudo apt-get install vlc vlc-plugin-* mozilla-plugin-vlc

    ```


    Once you enter your password, `apt-get` will install the Firefox `VLC` plugin.
    You can check that the plugin is installed by going to Firefox, to the `Tools`
    menu, and selecting `Add-ons`. Once in the `Add-ons` dialog box, you can view
    all your plugins by hitting the `Plugins` button. You should see the `VLC` plugins
    listed there.


    ***


    ## Chapter 21 - Managing Processes


    We’ve already discussed process management a bit in an earlier chapter. However,
    monitoring processes – both keeping track of their resource usage and terminating
    them when necessary – is an important part of Linux Mint system administration.
    In this chapter we will discuss process management from the command line in more
    detail.


    ## WHAT IS A PROCESS?


    Technically speaking, a process is active instance of a computer program. So all
    the programs and applications you run on your Linux Mint machine are processes.
    For instance, if you were to run the `Firefox` web browser, and then execute the
    `top` command, you’ll see the “firefox” process displayed in the list of running
    process. When you exit the program, that process will exit and disappear. (Unless
    something goes wrong, which will discuss more with the section on the `kill` command.)


    Processes are sometimes referred to as “daemons”, but the two terms aren’t identical.
    A daemon is in fact a process. However, the term “daemon” usually refers to a
    process running in the background. The SSH daemon is one such process – it waits
    until it hears as request over the network, regardless of what standard users
    are currently doing. Generally, daemons have a “d” at the end of their names (the
    SSH daemon is named “sshd”) to distinguish them from processes that you or other
    users might have launched the system.


    First, we’ll discuss how to view running processes with the `ps` command.


    ## THE PS COMMAND


    Needless to say, administering your system requires you to keep a close eye on
    running processes. There are any number of commands and utilities for monitoring
    your processes, but one of the simplest is the venerable `ps` command. To use
    the `ps` command, simply type it at the command prompt:


    ```bash

    ps

    ```


    However, without any switches, `ps` is not terribly useful. The default output
    without any switches looks like this:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_544a2f77.jpg)


    In its default state, `ps` only shows the currently running process – itself –
    and the shell you are currently using. Fortunately, you can make `ps` much more
    useful with the `-e` switch:


    ```bash

    ps -e

    ```


    The `-e` stands for Extended, and generates a listing of every process currently
    running on the system.


    However, this still only displays a limited amount of information, especially
    when compared to the `top` command. You can tell the `ps` command to display more
    information with the `-l` switch:


    ```bash

    ps -el

    ```


    The `-l` stands for Long Listing, and generates quite a bit more information.
    Specifically, you can see the `UID` (user ID) of the user who launched the process,
    the `PPID` (parent PID) of the parent process of a child process, the process’s
    priority and `nice`, and numerous other useful pieces of information. For even
    more information, use `ps` with the `-f` switch:


    ```bash

    ps -elf

    ```


    In addition to the information offered by the `-l` switch, the addition of the
    `-f` switch also causes the `ps` command to display the date the process was launched
    and the location of its executable on the file system.

