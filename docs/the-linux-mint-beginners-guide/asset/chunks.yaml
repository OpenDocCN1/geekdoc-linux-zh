    SSH 的安全功能来加密连接。这意味着 SFTP 比 FTP 安全得多。


    在本章中，我们将向你展示如何设置 SSH 服务器、如何使用 SSH 命令行客户端以及如何使用 SFTP。我们还会向你如何设置 SSH 使用基于密钥的认证，这比基于密码的认证安全得多。


    ### 安装并配置 SSH 服务器


    Linux 一直对 SSH 有强有支持，Linux Mint 也不例外。在本节中，我们将介绍 SSH 服务器的基本安装，以及一些基础的安全配置。Linux
    Mint 默认的 SSH 服务器软件包是 OpenSSH Server，我们将在此处使用它。


    首先，你需要安装 OpenSSH Server。要执行此操作，打开终端窗口并输入以下命令：


    ```bash

    sudo apt-get install openssh-server

    ```


    输入你的密码进行身份验证，`apt` 工具将为你下载并安装 OpenSSH Server。根据你的互联网连接速度和电脑性能，安装可能需要几分钟。


    安装完成后，返回终端窗口。我们需要对你的 `/etc/ssh/sshd_config` 文件进行一些更改以增加 SSH 的安全性。首先，如既往一样，我们要为你的
    `sshd_config` 文件创建一个备份副本，以防出现任何问题。在终端中输入此命令：


    ```bash

    sudo cp /etc/ssh/sshd_config ~

    ```


    这会在你的主目录下创建一个 `sshd_config` 文件的备份副本。


    接下来，我们需要编辑 `sshd_config` 文件本身。现在是时候再次运用你的 `vi` 技巧了：


    ```bash

    sudo vi /etc/ssh/sshd_config

    ```


    与几乎所有其他服务器软件包一样，SSH 由其配置文件中的许多指令控制。OpenSSH 服务器的默认安装是相当安全的。然而，你可能想对其进行一些更改，以进一步加固其安全性。


    `PermitRootLogin` 指令是你想要更改的之一。当你正在编辑 `/etc/ssh/sshd_config` 文件时，你希望如下所示更改该指令：


    ```

    PermitRootLogin no

    ```


    这将防止任何人尝试通过 SSH 以 root 身份登录你的服务器。通常情况下，不允许任何人以 root 身份登录你的 SSH 服务器是一个好主意。如果攻击者成功通过
    root 登录黑入你的 SSH 服务器，他将对你的机器拥有完全控制权，这绝对不是一件好事。


    另一个你可能想要更改的指令是 `AllowUsers`。当 `AllowUsers` 指令激活时，只有指令中明确指定的用户才能通过 SSH 访问系统。通过只允许特定用户通过
    SSH 连接，这为你的 SSH 服务器添加了额外的保护层。例如，如果你想将 SSH 访问限制仅限“camalas”用户账户，如下所示编辑 `AllowUsers`
    指令：


    ```bash

    AllowUsers camalas

    ```


    要向 `AllowUsers` 指令添加多个用户，只需逐个添加即可，无需使用逗号或分号。一个允许 `camalas` 用户账户和 `lmaraeus` 用户账户登录的
    `AllowUsers` 指令看起来如下：


    ```bash

    AllowUsers camalas lmaraeus

    ```


    你可能还想更改 `Port` 指令。默认情况下，SSH 运行在 TCP/IP 端口 22，这意味着任何扫描 22 端口的恶意软件都可能针对它。如果你想将 SSH
    设置为 599，请确保你的 `Port` 指令如下所示：


    ```

    Port 599

    ```


    注意，如果你更改了 SSH 服务器的默认端口，在使用 SSH 客户端时需要记住新端口，我们将在下一节中介绍。当你完成对 `/etc/ssh/sshd_config`
    的更改后，切换 `vi` 的命令模式并保存退出。使用此命令重启 SSH 服务：


    ```bash

    sudo /etc/init.d/ssh restart

    ```


    你现在应该可以从另一个系统通过 SSH 客户端登录到你的 Linux 机器。


    ### 配置 SSH 使用基于密钥的认证


    SSH 非常安全，但它有一个弱点——密码。如果有人破解了你的 SSH 密码，他们就可以控制你的 SSH 服务器。


    更安全的 SSH 登录方法是使用公私钥。通过公私钥，你创建了一对匹配的公私钥。你将私钥保存在个人机器上，而将公钥放在要连接的 SSH 服务器上。通过这种配置，SSH
    服务器将只允许具有匹配私钥的系统进行连接。


    在本节中，我们将向你展示如何为 SSH 设置基于密钥的认证。


    首先，在你的服务器上安装 OpenSSH Server。在后续步骤中，假设你已经在 IP 地址为 `192.168.1.100` 的机器上安装了 SSH 服务器，并且打算从
    IP 地址为 `192.168.1.200` 的客户端机器连接到该服务器。


    安装 SSH 服务器后，转到客户端机器 `192.168.1.200` 并输入以下命令：


    ```bash

    ssh-keygen -t dsa

    ```


    按回键，该命令将在 `~/.ssh` 目录下保存一对匹配的公私钥。具体来说，它创建了两个文件——`id_dsa`（你的私钥）和 `id_dsa.pub`（你的公钥）。它还会要求为密钥设置一个短语，这在账户被他人访问时提供了额外的安全保障。设置短语通常是一个好主意。


