    这里有很多信息，但大部分都是有用的。`eth0` 指的是你系统上的第一个以太网连接。`inet addr` 显示你系统的 IP 地址，而 `Mask` 显示子网掩码。`HWaddr`
    显示你以太网适配器的 MAC（媒体访问控制）地址，该地址（理论上）对于每个适配器来说都是唯一的。（某些无线网络要求你在允许系统连接之前提供你的 MAC 地址。）


    你可以通过管道将 `ifconfig` 命令的输出传递到 `grep`，以快速找到你想要的特定项目。假设你只想查找 IP 地址：


    ```

    ifconfig | grep inet

    ```


    这次，输出将看起来像这样，你可以快速从混合内容中选出你的 IP 地址：


    ![](img/tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_1df91bf7.jpg)


    同样，你可以使用 `ifconfig` 和 `grep` 快速找到你电脑的 MAC 地址：


    ```bash

    ifconfig | grep HWaddr

    ```


    你可以轻松地从输出中提取出你的 MAC 地址：


    ![](img/tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m368c6e.jpg)


    你如何找到系统的默认网关？你需要使用另一个命令：


    ```bash

    ip route

    ```


    `ip route` 命令将输出如下所示的内容：


    ![](img/tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m44ce4bfb.jpg)


    寻找以 "default via" 开头的那行。你系统的默认网关将是这两个词之后的 IP 地址。


    现在你已经知道如何查找 IP 地址了，让我们来谈谈如何为你的 Linux Mint 系统实际获取 IP 地址。


    ### 从 DHCP 获取 IP 地址


    在大多数情况下，你的电脑将从 DHCP 服务器接收 IP 地址。


    手动为每台电脑手动配置 IP 地址既耗时又容易出错；如果一台或多台电脑接收到相同的 IP 地址，它们将由于地址冲突而无法连接。DHCP 代表“动态主机配置协议”，它消除了这一过程中的猜测。当电脑插入以太网网络（或连接到无线网络）时，它会向
    DHCP 服务器发送请求。如果网络上有 DHCP 服务器，它会为电脑提供一个 IP 地址，并且 DHCP 服务器会确保没有两台电脑接收到相同的 IP 地址。


    在大多数情况下，当你接入新网络时，你会自动收到 DHCP 地址。但如果没有收到，请尝试此命令：


    ```bash

    sudo dhclient

    ```


    这将手动告诉你的系统搜索 DHCP 服务器并接受地址。如果该命令不起作用，说明你使用的网络没有运行正常的 DHCP 服务器，或者有某种东西阻止 DHCP 服务器与你的电脑通信。


    ### 释放 DHCP 地址


    DHCP 地址带有一个“租期”，这意味着你的电脑允许保留该地址的时间。通常，你的电脑会在租期过期前一半时间点联系 DHCP 服务器，并请求保留它，DHCP
    服务器几乎总是会授予许可。


    有时你想尽早释放已租的 IP 地址 - 例如，如果你网络的 DHCP 服务器发生了变化，或者你的电脑拒绝释放 IP 地址。你可以使用 `dhclient`
    命令和 `-r` 选项来实现：


    ```bash

    sudo dhclient -r

    ```


    这将释放你的 IP 地址，然后你可以使用 `sudo dhclient` 联系 DHCP 服务器以接收一个新的。


    ### 通过图形界面设置静态 IP


    DHCP 地址很方便，但它们有一个很大的弱点 - 它们会很快变化。如果租期足够短，你的 IP 地址在周一可能是 192.168.1.1，而在周二可能是 192.168.3.45，取决于
    DHCP 服务器恰好可用哪些地址。对于笔记本电脑和桌面电脑，这通常不是大问题。然而，服务器需要一致的 IP 地址，以便客户端能够找到它们。


    这就是“静态 IP”地址派用用场。静态 IP 是手动分配给电脑的地址，它将一直保持，直到你更改它。你需要确保它不会与你的 DHCP 服务器冲突，因此你需要重新配置
    DHCP 服务器以从地址池中排除该静态地址，或者要求你的系统管理员执行。


    以下是通过图形界面为系统的以太网适配器设置静态 IP 的方法：


    - 点击 `mintMenu`get 搜索字段中搜索“网络连接”（Network Connections）。

    - 当“网络连接”对话框打开时，点击“有线”（Wired）选项卡，然后点击标记为 `eth0` 的连接。点击“编辑”（Edit）按钮。

    - 当编辑 `eth0` 框打开时，点击“IPv4 设置”选项卡。

    - 在 `IPv4` 框中，将“方法”（Method）下拉框从“自动”（Automatic）更改为“手动”（Manual）。

    - 在“地址”（Addresses）标题下，点击“添加”（Add）按钮来添加静态 IP、子网掩码和默认网关。

    - 将你的 DNS 服务器添加到“DNS 服务器”（DNS Servers）行。


    DHCP 地址很方便，但它们有一个很大的弱点 - 它们会很快变化。如果租期足够短，你的 IP 地址在周一可能是 192.168.1.1，而在周二可能是 192.168.3.45，取决于
    DHCP 服务器恰好可用哪些地址。对于笔记本电脑和桌面电脑，这通常不是大问题。然而，服务器需要一致的 IP 地址，以便客户端能够找到它们。


    这就是“静态 IP”地址派用用场。静态 IP 是手动分配给电脑的地址，它将一直保持，直到你更改它。你需要确保它不会与你的 DHCP 服务器冲突，因此你需要重新配置
    DHCP 服务器以从地址池中排除该静态地址，或者要求你的系统管理员执行。


    以下是通过图形界面为系统的以太网适配器设置静态 IP 的方法：


    - 点击 `mintMenu` 并在搜索字段中搜索“网络连接”（Network Connections）。

    - 当“网络连接”对话框打开时，点击“有线”（Wired）选项卡，然后点击标记为 `eth0` 的连接。点击“编辑”（Edit）按钮。

    - 当编辑 `eth0` 框打开时，点击“IPv4 设置”选项卡。

    - 在 `IPv4` 框中，将“方法”（Method）下拉框从“自动”（Automatic）更改为“手动”（Manual）。

    - 在“地址”（Addresses）标题下，点击“添加”（Add）按钮来添加静态 IP、子网掩码和默认网关。

    - 将你的 DNS 服务器添加到“DNS 服务器”（DNS Servers）行。


    ###以下是通过图形界面为系统的以太网适配器设置静态 IP 的方法：


    - 点击 `mintMenu` 并在搜索字段中搜索“网络连接”（Network Connections）。

    - 当“网络连接”对话框打开时，点击“有线”（Wired）选项卡，然后点击标记为 `eth0` 的连接。点击“编辑”（Edit）按钮。

    - 当编辑 `eth0` 框打开时，点击“IPv4 设置”选项卡。

    - 在 `IPv4` 框中，将“方法”（Method）下拉框从“自动”（Automatic）更改为“手动”（Manual）。

    - 在“地址”（Addresses）标题下，点击“添加”（Add）按钮来添加静态 IP、子网掩码和默认网关。

    - 将你的 DNS 服务器添加到“DNS 服务器”（DNS Servers）行。


    ### 使用命令行设置静态 IP


    如果你想通过命令行设置静态 IP，你需要编辑 `/etc/network/interfaces` 文件。


    首先，为 interfaces 文件创建一个备份：


    ```bash

    sudo cp /etc/network/interfaces ~/interfaces.bak

    ```


    接下来，打开 interfaces 文件：


    ```bash

    sudo vi /etc/network/interfaces

    ```


    最初，文件只包含关于回环地址的信息（回环地址是 `127.0.0.1`，它用于测试 TCP/IP 栈是否正常工作）：


    ```

    auto lo

    iface lo inet loopback

    ```


    为了给你的系统设置静态 IP，你需要进行一些更改。假设你想为 `eth0` 网络连接分配 `192.168.1.2`（如你所记得，它是第一个适配器，额外的适配器将是
    `eth1`、`eth2` 等），子网掩码为 `255.255.255.0`，本地网关为 `192.168.1.1`：


    ```

    auto eth0

    iface eth0 inet static

    address 192.168.1.2

    netmask 255.255.255.0

    broadcast 192.168.1.255

    gateway 192.168.1.1

    ```


    添加完这些行后，进入 `vi` 的命令模式并保存退出（你可以使用 `qw` 或 `exit` 命令）。


    你需要让系统加载新的 IP 配置。你可以通过重启来实现，但如果太慢了，可以使用此命令强制 Linux Mint 重新读取配置文件：


    ```bash

    sudo ifup eth0

    ```


    你的系统现在将拥有静态 IP 地址。


    你还需要添加一个 DNS 服务器，你可以通过编辑 `/etc/resolv.conf` 文件来实现：


    ```bash

    sudo vi /etc/resolv.conf

    ```


    要设置地址为 `192.168.1.10` 的静态 DNS 服务器，切换 `vi` 到插入模式并在文件中添加此行：


    ```

    nameserver 192.168.1.10

    ```


    保存文件并退出文本编辑器。


    ### 使用 Samba 进行基础文件共享


    Linux Mint 机器（无论是服务器还是桌面）最常见的用途之一是跨网络共享文件。如果你不熟悉这个术语，“文件共享”意味着让你系统上的文件夹对网络上的客户端可用。从他们自己的电脑开始，用户可以访问你的共享文件夹，取决于你如何配置安全性，他们可以复制文件、修改文件、添加新文件，甚至删除文件。

