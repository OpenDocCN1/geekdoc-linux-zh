  raw: '![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m1fbb5afa.jpg)


    The installer will then ask you to set up a user account and a hostname for your
    computer. First, type your full name into the “Your name” field. Linux Mint will
    use this when it needs to display your full name.


    Below that, enter a name for your computer. Technically, this is called a “hostname”,
    which is the name your computer will use to identify itself on the network. It''s
    often best to pick a hostname that is easy to remember. If you''re part of an
    organization (such as your workplace), they might have a standard naming convention
    for hostnames.


    After that, put a username into the “Pick a username” field. Generally, you can
    combine your first initial with your last name to produce a username – for instance,
    a woman named Caina Amalas would make a username called camalas.


    Next, pick a password for your user account. You''ll want to pick a strong password,
    since the default account created during a Linux Mint installation has administrative
    rights to the system, which means it can install and uninstall programs. A strong
    password includes a mixture of capital letters, numbers, and punctuation marks,
    and it at least ten characters long.


    Below the password field is a radio button to let your Linux Mint computer log
    in automatically upon boot. Generally, this is a bad idea – it''s always best
    to use a password to log into your computer for reasons of security. (Especially
    since the default account created during installation has administrative rights
    to the Linux Mint system.)


    The final option is to encrypt your home folder. “Encrypting” a file means that
    the contents are scrambled and can only be read using a special mathematical key.
    If you encrypt your home folder, that means that only your user account will be
    able to access it.


    Once you have finished the password and account options, hit the Continue button,
    and the installation will proceed.


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m59ea6d6c.jpg)


    And at that point, you''re done. The installer will finish in the background,
    and you can watch a slideshow displaying Linux Mint''s various features.


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m68e5b9ff.jpg)


    Once the installation is finished, hit the Restart Now button. Before the system
    reboots, it will tell you to remove your CD or USB drive. Once you do, remove
    the CD or USB drive and hit the ENTER key. Your system will then reboot and take
    you to the logon screen:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m26f765c3.jpg)


    Select your newly made account and enter your password, and you will be taken
    to your new Linux Mint desktop.


    UPDATING Linux Mint


    Once you''ve installed Linux Mint, you will want to make sure that it is up to
    date with the latest software patches. Software patches close potential security
    holes in your software and often provide new features. In fact, after you''ve
    installed Linux Mint, the Update Manager application will run automatically for
    the first time.


    To run the Update Manager yourself, follow this steps.


    First click on the mintMenu, go to Administration, and click on Update Manager.


    Update Manager will then launch, and immediately contact the Linux Mint repositories
    (in Linux, a “repository” is an online storage space for applications) for updates.


    Update Manager will display a list of the available updates, and the combined
    size of all the updates. (On a new Linux Mint installation, this can often run
    in the hundreds of megabytes.) If you click on an individual update, and then
    click the triangle next to “Description of update”, you can see more detailed
    information about an individual update. Clicking on the Settings button will let
    you change Update Manager''s settings. By default, Update Manager checks for updates
    daily, and informs you when new updates are available to install.


    Once you are ready to install updates, click on the Install Updates button to
    continue:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_6bf812f5.jpg)


    Update Manager will then ask for your password. This is a common event on Linux
    Mint – if you want to do something that will change the system, like installing
    a new program or updates, it will ask for the password of an administrative account.
    Since the account you created during the installation process is an administrative
    account, go ahead and enter that password, and then hit the Authenticate button.


    Update Manager will download and install the available updates. Depending on the
    speed of your Internet connection, this might take some time, so be patient.


    Once Update Manager is finished, you will have to restart your computer. Click
    on the Restart button to reboot your system, and once Linux Mint comes back up,
    your computer will be fully up to date.


    ***


    ## Chapter 2 - Using the Linux Mint Desktop Interface


    Linux Mint is designed as a graphical operating system, which means you will spend
    a great deal of time using the desktop and the various graphical interface options.
    In this chapter we’ll give you a tour of the desktop, and show you how to use
    Nemo File Manager to perform common file tasks. Additionally, we’ll show you how
    to use mintMenu, Linux Mint’s system menu.


    THE DESKTOP


    When you boot up your Linux Mint machine and log in for the first time, you will
    see the Desktop, which will look something like this:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_3b330d1e.jpg)


    Most of the important parts of the Desktop are along the bottom, in the area called
    the Panel. The button in the lower left-hand corner, the Menu, takes you to the
    mintMenu, Linux Mint’s integrated application launcher and search function. Any
    running programs will show up in the central area of the Panel. On the right of
    the Panel, you’ll see the current date and time, along with the notification area
    – any running programs that have the capability to leave notifications will do
    so here.


    DESKTOP ICONS


    By default, you will only see two icons (at first) on your Linux Mint desktop,
    the Computer icon and a shortcut to your home folder:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_49d8df1.jpg)


    Double-clicking on the Home icon launches Nemo, Linux Mint’s modified version
    of the Nautilus file management program. We’ll discuss Home folders more later
    in this chapter. Double-clicking on the Computer icon launches Nemo with a high-level
    view of your computer. You can see all the installed hard drives on your computer,
    along with any removable disks. You can also create documents and folders for
    yourself on the Desktop.


    THE MINTMENU


    Click on the Menu button in the lower left-hand corner of your Desktop, and you
    will summon the mintMenu, which will look something like this:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_3afa29e4.jpg)


    The mintMenu has three main columns. The left column contains shortcuts to some
    of the most commonly used functions on your system. You can access the Firefox
    web browser, Software Manager, the Terminal, the Nemo File Manager, and fine-tune
    settings for Cinnamon, Linux Mint’s desktop environment. You can also lock your
    computer, log out, and reboot your computer.


    The central column is a listing of the categories of applications installed on
    your Linux Mint computer. Click on the Office category, for instance, and you
    will see a listing of all the office-related applications (such as the LibreOffice
    office suite) installed on your computer. The central column also contains Recent
    Files, which lists all the files you have accessed recently.


    Finally, the right-column is context-dependent, which means it changes based upon
    what you have selected in the central column. As we mentioned above, click on
    the Office category in the central column, and the view in the right-hand column
    will change to show the available applications in the Office category.'
