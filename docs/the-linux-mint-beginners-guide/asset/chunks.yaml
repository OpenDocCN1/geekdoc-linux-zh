  trans: "\n\n```\npdftk Page1.pdf Page2.pdf Page3.pdf output FinalDraft.pdf\n```\n\
    \n此命令将取三个 PDF 文件并将它们合并为一个名为 `FinalDraft.pdf` 的单一 文件。请注意，`pdftk` 将按照它们列出的顺序合并文件。因此，如果你想让\
    \ `Page3.pdf` 实际上成为 `FinalDraft.pdf` 的第一页而不是 `Page1.pdf`，你应该使用此命令：\n\n```\npdftk\
    \ Page3.pdf Page2.pdf Page1.pdf output FinalDraft.pdf\n```\n\n这将创建一个 `FinalDraft.pdf`\
    \ 文档，并将 `Page3.pdf` 作为其第一页。\n\n你还可以使用 `pdftk` 从较大的 PDF 文档中提取单页。在这个示例中，假设你有一个名为\
    \ `Report.pdf` 的 90 页 PDF 文档。你想从该文档中仅提取第 9 页，以便将其发送给同事。要从 `Report.pdf` 中提取第 9\
    \ 页并将其保存为名为 `Page9.pdf` 的独立 PDF 文档，请使用以下选项运行 `pdftk`：\n\n```\npdftk A=Report.pdf\
    \ cat A9 output Page9.pdf\n```\n\n这将提取 `Report.pdf` 的第九页并将其保存为名为 `Page9.pdf` 的独立\
    \ PDF 文档。\n\n同样，你也可以使用 `pdftk` 从 PDF 文档中提取一个范围的页面并将它们保存到单独的文件中。回到之前的示例，如果你想从 `Report.pdf.pdf`（注：此处原文应为\
    \ Report.pdf）中提取第 19 到第 37 页并将其保存到名为 `Extract.pdf` 的文件中，你将使用以下选项运行 `pdftk`：\n\n\
    ```\npdftk A=Report.pdf cat A19-37 output Extract.pdf\n```\n\n通过 `pdftk`，你可以轻松地拆解和重新组合\
    \ PDF 文档。\n\n# 使用 LIBREOFFICE 转换文件类型\n\nLibreOffice 是 Linux Mint 自带的免费办公套件，它有一个相当实用但并不为人知的功能。被称为“无界面模式”（headless\
    \ mode），它允许你从命令行运行 LibreOffice，而无需启动任何图形界面组件。由于 LibreOffice 是一个功能齐全的办公套件，这似乎像是在浪费时间。然而，你可以使用\
    \ LibreOffice 的无界面模式执行文件的批量转换。例如，用它将一个 `*.doc` 文件转换为 PDF 文档可能看起来很繁琐。但如果你有 2,000\
    \ 个 `*.doc` 文件需要转换为 PDF（引用一个常见的例子，作为政府监管合规性工作的一部分），这可以节省大量时间。\n\n在我们的第一个示例中，假设你有\
    \ 1,000 个 `*.doc` 文件需要转换为 PDF。文档文件位于你主目录下名为 `source` 的目录中，你想将 PDF 放在你主目录下名为 `output`\
    \ 的目录中。将 doc 文件转换为 PDF 文件的命令如下：\n\n```\nlibreoffice –headless –convert-to pdf:writer_pdf_Export\
    \ -outdir ~/output ~/source/*.doc\n```\n\n这将提取 `~/source` 目录中的每一个 `*.doc` 文件，并将其转换为\
    \ `~/source` 目录中对应的 PDF 文件。请注意，原始的 `*.doc` 文件不会发生任何更改。\n\n你还可以使用此命令执行其他文件格式的批量转换。例如，假设你想将那\
    \ 1,000 个 `*.doc` 文件转换为 HTML 文件。命令如下：\n\n```\nlibreoffice –headless –convert-to\
    \ html -outdir ~/output ~/source/*.doc\n```\n\n这将将 `~/output` 中的 `*.doc` 文件转换为\
    \ `~/source` 中的 HTML 文件。同样，原始文档文件不会被更改。\n\n通过更改 `--convert-to` 选项后的参数，你可以与 LibreOffice\
    \ 支持的任何文件类型进行转换。如果你想将 `~/source` 中的 `*.doc` 文件转换为 `*.odt` 文件（OpenDocument 格式），命令如下：\n\
    \n```\nlibreoffice –headless –convert-to odt -outdir ~/output ~/source/*.doc\n\
    ```\n\n使用 LibreOffice 的命令行工具可以让你快速、方便地执行文档的批量转换。\n\n***\n\n## 作者的其他著作\n\n## 魔魂传奇曲\
    \ (The Demonsouled Saga)\n\nMAZAEL CRAVENLOCK 是一位流浪骑士，战斗中无所畏惧，剑法精通。\n\n但他隐藏着黑暗的秘密。他是“魔魂者”（Demonsouled），古代而残酷的老魔之子，他那染染的血脉赋予了他超人类的力量和速度。然而，力量而来的是可怕的、非人性的愤怒，马泽尔必须挣扎着防止这股怒火吞噬他。\n\
    \n但他不敢离开血脉的力量，因为他需要这种力量来面对可怕的敌人。\n\n圣凯斯（San-keth）的祭司们在阴影中策划阴谋，操纵着领主和王国。蛇祭司们渴望推翻人类领域并奴役人类。除非马泽尔阻止他们，否则他们将强制所有国家向蛇神臣服。\n\
    \n马尔拉格（Malrag）大军正在来临，那是规模巨大的可怕人兽军队，充满了对残酷和折磨的渴望。马尔拉格不在乎征服或财宝，只想杀戮。而人类领域已成熟。。只有像马泽尔这样的战士才希望击败他们。\n\
    \n多米尼亚骑士（Dominiar Order）和正义骑士（Justiciar Order）曾是高尚且受尊敬的，致力于对抗黑暗魔法的力量。现在他们腐败且愤世嫉俗，只为权力和荣耀而谋划。他们会杀死任何挡路的人。\n\
    \n为了击败这些敌人，马泽尔需要他魔魂的力量。\n\n他面对着一个更加可怕的敌人。世纪以来，老魔一直在操纵君主和领主。现在他将夺取魔魂，成为折磨与暴政之神。\n\
    \n除非马泽尔阻止他。\n\n阅读[魔魂](https://wiki.example.org/demonsouled) \n\n马泽尔的冒险在[暴政之魂](https://wiki.example.org/soul-of-tyranny)中继续，还有[领主之魂](https://wiki.example.org/soul-of-lords)\
    \ ）、[蛇之魂](https://wiki.example.org/soul-of-serpents)）、[巨龙之魂](https://wiki.example.org/soul-of-dragons)\
    \ ）、[魔术之魂](https://wiki.example.org/soul-of-sorcery) 和[骷髅之魂](https://wiki.example.org/soul-of-skulls)。\n\
    \n在[魔魂合集一](https://wiki.example.org/demonsouled_omnibus_one) 中获取这三本书。\n\n## 幽灵系列\
    \ (The Ghosts Series)\n\n凯娜·阿玛（Caina Amal）曾是一位害羞的小贵族女儿，满足于在她父亲的图书馆度日。\n\n魔法、谋杀以及她母亲的背叛摧毁了她的生活。\n\
    \n现在，她是“幽灵”的一名夜行者，是皇帝间谍和刺客的精英特工。她是伪装、渗透、潜行和阴影的大师。\n\n她需要所有这些技能来守护帝国并生存下去。\n\n\
    腐败的领主在阴影中策划阴谋，渴望推翻皇帝并为了自己的利益和荣耀统治帝国。奴隶贩在帝国边缘徘，准备捕捉毫无防备的平民并将他们卖到远方。然而，奴隶贩和残酷的领主都必须提防幽灵。\n\
    \n魔法院（Magisterium）是帝国魔法师兄弟会，他们认为自己是帝国的主人。通过他们的奥术，他们计划推翻帝国并奴役平民，为了自己的利益统治全人类。只有幽灵挡在他们邪恶计划的道路上。\n\
    \n"
