    ***


    ## 第 19 章 - 在 Linux Mint 上管理和创建电子书


    电子书以多种格式出现，但幸运的是，你可以使用 Linux Mint 来管理和创建电子书。


    ### 什么是电子书？


    电子书，通常是指存储在数字文件中的长度书籍。电子书几乎从互联网开始就已经存在了——`Project Gutenberg` 拥有大量的公有领域电子书，成立于
    1971 年。出版者一直一直在尝试数字格式，但大多失败了，直到 90 年代后期万维网变得流行。然而，由于缺乏有效的电子阅读器阻碍了电子书的早期采用，只有极少数人喜欢在
    CRT 显示器或 PDA 的小屏幕上阅读整本书。


    这种情况随着 21 世纪第一个十年末墨水屏和 LED 平板设备的发展发生了改变。高质量的墨水屏阅读设备提供了与印刷页面几乎相同的体验，而不错的 LED 显示屏虽然在持续阅读方面不如墨水屏，但比旧显示器易读得多。随着互联网连接的日益普及和电子阅读器成本的下降，电子书革命正在进行。


    纸质书永远不会消失——广播被电视和后的互联网取代，但商业电台并不短缺——但电子书相比纸质书有许多优势。第一个优点是便携性——4GB 的闪存内存可以存储数千本电子书。等量的的纸质书将占据几个房间。第二个是积极的环境影响——电子书比纸质书对环境（特别是森林）友好得多，由于大多数现代出版商和书店采用过时的退货系统，每年有大量的纸质书被浪费。第三个优势是成本——电子书通常比实体书便宜，大量的公有领域书籍（包括西方经典）可以在
    `Project Gutenberg` 和其他网站免费获取。


    ### 电子书格式


    电子书有多种格式，但有两个主导格式——`MOBI` 格式和 `EPUB` 格式。


    `MOBI` 格式源于名为 `Mobipocket` 的公司，该公司开发了用于电子书的 `MOBI` 格式以及几种用于读取 `MOBI` 文件的不同应用程序。在线零售商亚马逊在
    2005 年购买了 `Mobipocket`，当 Kindle 在 2007 年发布时，亚马逊在其 Kindle 上使用了 `MOBI` 格式。从亚马逊网站购买的任何电子书都是
    `MOBI` 格式。

