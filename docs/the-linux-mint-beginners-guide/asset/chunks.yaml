- fmt: '

    To get around this, Linux Mint uses the `sudo` command, which allows a user to
    temporarily act as root. To use a command with `sudo`, simply preface it with
    the `sudo` command:


    ```

    sudo rm document.txt

    ```


    The command will ask for your password, and after you enter it, `rm` will run
    with root-level access.


    (Note that only administrative users on a Linux Mint system can use root. By default,
    the account you create during installation is an administrative user.)


    # BASIC CALCULATOR


    Linux Mint also comes with a handy little utility called the `bc` command – the
    “bc” stands for “basic calculator”. The `bc` command lets you perform quick, simple
    mathematical operations from the command line, which can be easier than reaching
    for your desktop calculator or firing up a graphical calculator (and if you’re
    using the server version of Linux Mint, no GUI calculator is available, obviously).


    To use `bc`, first type this command:


    ```bash

    bc

    ```


    This will take you to the `bc` prompt, and you can now perform mathematical operations.
    To add two numbers, for instance, type this, and then hit the Enter key:


    ```

    2 +2

    ```


    To subtract two numbers, use this syntax:


    ```

    2 -2

    ```


    To divide two numbers, use the `/` key:


    ```

    2 /2

    ```


    For multiplication, use the `*` key:


    ```

    2 * 2

    ```


    Use fractions instead of decimals:


    ```

    2.5 + 1

    ```


    Once you are finished with `bc`, type `quit` to return to the normal command prompt:


    ```bash

    quit

    ```


    # BASH SHELL TIPS


    For its command-line interface, Linux Mint uses a program called the `bash` shell.
    The term "shell" refers to a program that provides an interface between the user
    and the operating system. The `bash` shell is a descendant of the old Bourne `sh`
    shell - the name "bash" itself is a pun meaning "Bourne-again shell." There are
    a number of other shells available, but most people agree that `bash` is the best
    one available (opinions can, of course, differ). And `bash` has a number of useful
    features.


    The first is what''s called "command/filename completion." What that means is
    that you type a partial command or filename, and hit the `TAB` key, `bash` will
    take a good guess at completing the filename or command. Say you have a file named
    `ReallyReallyReallyLongLongLongFileName.txt`, and you want to delete it. But you
    don''t want to type out that entire filename. Instead you can just start to type
    it:


    ```bash

    rm ReallyR

    ```


    And then hit the tab key. The `bash` shell will finish out the file name for you:


    ```bash

    rm ReallyReallyReallyLongLongLongFileName.txt

    ```


    The `bash` shell also has a neat feature called command history. If you hit the
    `Up` arrow key on your keyboard, you can scroll back through the history of commands
    you have used. If you can''t remember a long command you just used, or you don''t
    want to retype, this can come in handy.


    The `bash` shell stores your command history in a file named `.bash_history` in
    your home folder. To view it, use this command:


    ```bash

    cat ~/.bash_history

    ```


    Note that this file only gets updated when you log out of the system.


    # GETTING HELP


    There''s no getting around it - Linux commands are complicated, and come with
    a vast array of options and options, and all of that is difficult to remember.
    Frankly, Linux Mint comes with a built-in help system - the `man` command. Short
    for "manual", `man` lets you view the basic usage and options for the command.
    To use it, simply type `man` and the name of the command whose manual page you
    want to read:


    ```bash

    man ls

    ```


    This will bring up the manual page for the `ls` command. You can use the page
    up and page down keys to navigate through the man page, and once you''re finished,
    pressing the "q" key will return you to the command prompt.


    ## Chapter 5 - Checking Memory and Disk Space Usage


    When it comes to dealing with computers (whether Linux Mint, Windows, or Mac OS
    X systems), there is one infallible rule - there''s never enough memory or disk
    space. Granted, the situation has gotten better than the old days of DOS, when
    you had only 640 kilobytes of memory to use. Personal computers have gotten more
    powerful, and as of this writing you can buy a laptop computer with four gigabytes
    of memory and a five hundred gigabyte hard drive for about $300 to $400 USD (even
    less if the computer is a desktop). So for the average user, carefully managing
    your personal computer''s memory and disk space isn''t quite as critical as it
    once was.


    However, you''ll still want to keep an eye on memory and disk usage. If your Linux
    Mint system slows down, you''ll want to know why, and examining resource usage
    can give you a clue as to the cause. If your hard drive fills up, you''ll want
    to find which files are taking the most room. And if you are managing a Linux
    Mint server system with multiple users accessing it simultaneously, you will definitely
    want to keep a close eye on resource usage, lest one user bring the server to
    a crashing halt.


    In this chapter we''ll look at how to monitor Linux Mint''s usage of system resources,
    both with graphical and command line tools.


    # SYSTEM MONITOR


    System Monitor is a utility that provides a wealth of real-time information about
    the status of your system. From System Monitor, you can see how much RAM and hard
    drive space your system has free. You can also view graphs charting CPU usage,
    the amount of memory used by the various processes running on your system, and
    the amount of free space on any additional disks (like flash drives or external
    hard drives) attached to your computer.


    To launch System Monitor, click on the mintmenu and search for it in the search
    field. Click on the program''s icon, and System Manager should launch in short
    order.


    System Monitor has three tabs, each presenting different information, that we’ll
    look at from left to right.


    “Processes” is the first tab. A “process” is the technical term for any program
    running on your system, whether a background daemon (a program that provides services),
    or any programs that you or any other users launch. The Processes tab has a number
    of columns that provide useful information. The first column, “Process Name”,
    provides the name of the process. The “% CPU” tab shows the amount of the CPU’s
    processing time the process is consuming. The “ID” column shows the process’s
    ID number, which comes in handy if you need to force it to end from the command
    line (which we will describe in Chapter 22). The “Memory” column shows the amount
    of memory the process is using. Finally, the Processes tab has an End Process
    button in the lower-right hand corner, which you can use to forcibly shut unresponsive
    processes.


    The second tab, “Resources”, provides three real-time graphs. The first graph,
    “CPU History”, shows the amount of CPU time being consumed. If you have a multi-core
    processor (as most computers do nowadays), the graph will represent the different
    CPU cores with different colors. The second graph, “Memory and Swap History”,
    shows the amount of RAM and swap file space being used. (“Swap file” refers to
    virtual memory, a partition on your hard drive that Linux Mint uses as temporary
    RAM if the real RAM fills up.) The final graph, “Network History”, shows the amount
    of incoming and outgoing traffic to your system’s network adapter.


    The final tab “File Systems” shows any file systems – that is, disks – attached
    to your Linux Mint system. This includes hard drives, optical disks (like CDs
    and DVDs), USB external hard drives, and USB flash drivers. The columns show the
    actual device names for the drives (usually something like `/dev/sda1`), the mount
    point (where the device is mounted in the filesystem), the type of filesystem,
    and the amount of space on the device, both total space and free space.


    System Monitor offers a lot of useful information in one convenient place, but
    it’s a graphical application, which means that it doesn’t work from the command
    line. To check this information from the command line, you’ll need to use the
    `top` command, which we’ll discuss in the next section.


    # THE TOP COMMAND

