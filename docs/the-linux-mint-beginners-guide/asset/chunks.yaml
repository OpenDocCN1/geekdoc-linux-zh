    在下一节中，我们将介绍如何在 Linux Mint 系统上安装和配置 Wine。我们还将简单谈论如何使用 Linux Mint 连接到 Windows Server
    终端服务 / 远程桌面服务系统。


    # 安装和配置 Wine


    配置 Wine 有时可能是一项挑战，但 Wine 的安装非常简单，并且在 Linux Mint 上运行良好。要安装 Wine，请在终端提示符下使用此命令：


    ```

    sudo apt-get install wine-stable

    ```


    输入密码进行身份验证，`apt` 将下载并安装 Wine。这些组合包包总大小略大于一百兆字节，因此取决于你的网络连接速度，安装可能需要一些时间。


    安装完成后，你可以使用命令行程序 `Wine` 安装 Windows 软件。


    不过，你可能首先需要将安装程序文件标记为可执行文件。根据应用程序的不同，如果安装程序文件没有可执行权限，`Wine` 可能无法对其进行安装（我们在第 2 章中讨论过文件权限）。例如，要将
    `Downloads` 文件夹中名为 `INSTALL.EXE` 的安装程序文件标记为可执行，请在终端提示符下使用此命令：


    ```

    chmod 755 ~/Downloads/INSTALL.EXE

    ```


    文件被标记为可执行后，你就可以通过命令行使用 `Wine` 安装 Windows 软件了。例如，要安装上面的示例，你需要使用此命令：


    ```

    wine ~/Downloads/INSTALL.EXE

    ```


    如果应用程序没有安装，你可能需要更改 `Wine` 设置。最好的办法可能是浏览 `Wine` 应用程序数据库，看看你是否能在那里找到正确的设置。该数据库包含了数千上万个
    Windows 应用程序的安装设置和技巧，你可以在此处找到它：


    http://appdb.winehq.org/


    通常情况下，`Wine` 的向后兼容性非常好——应用程序越老旧，`Wine` 支持它的可能性就越大。


    最后，你可以通过一个名为 `Winetricks` 的伴侣 GUI 应用程序来安装 Windows 应用程序。`Winetricks` 让安装应用程序变得顺畅易用——但仅在特定应用程序受支持的情况下。要安装
    `Winetricks`，请在终端中使用此命令：


    ```

    sudo apt-get install winetricks

    ```


    一旦安装了 `Winetricks`，你可以通过进入 `mintmenu`、搜索“winetricks”并点击应用程序图标来启动它。`Winetricks`
    为安装 Windows 应用程序提供了 GUI，你可以轻松地按照提示安装受支持的 Windows 应用程序。


    # 安装 REMMINA


    Microsoft Windows 服务器有一项名为 `Terminal Services` 技术，在 Windows Server 2008 R2 中重命名为
    `Remote Desktop Services`。这允许客户端远程连接到服务器，查看远程桌面并使用远程应用程序，就像它们安装在本地上一样。许多组织使用 `Terminal
    Services/ Remote Desktop Services` 来实现计算基础设施的集中化。这样，组织就可以拥有一个强大的中央服务器系统，并使用更廉价的客户端连接到
    `Terminal Services / Remote Desktop Services` 服务器。


    自 Windows XP 以来，每个版本的 Windows 都带有一个 `Remote Desktop` 客户端。然而，`Remote Desktop` 为你提供了一个在
    Windows 密集型环境中使用 Linux Mint 的机会。11.04 Natty Narwhal 之前的 Linux Mint 版本使用一个名为 `TSclient`
    的程序。每个版本的 Windows 都带有一个内置的 `Remote Desktop` 客户端。然而，`Remote Desktop` 为你提供了一个在 Windows
