    通常情况下，从 Windows 客户端连接到 Linux Mint 机器上的 Samba 共享应该是简单的。然而，有几个陷阱需要注意。


    假设你已经沿用了我们之前使用的设置，现在你有一个 IP 地址为 `192.168.1.2`（子网掩码为 `255.255.255.0`）的 Linux Mint
    Samba 服务器。该服务器托管了一个名为 "test" 的共享，用户账户 `camalas` 具有访问权限，密码为 "ghost."。你想从一台 IP 地址为
    `192.168.1.3` 且子网掩码为 `255.255.255.0` 的 Windows 机器连接到此共享。


    在 Windows 机器上，进入启动菜单，然后选择“运行”（或同时按下 Windows 键和 R），在运行对话框中输入以下内容：


    ```

    \\192.168.1.2

    ```


    或者，你也可以在任何 Windows 资源管理器窗口的地址栏中输入此内容。这被称为 UNC 路径 - 即“通用命名规范”路径。


    除非你设置了 DNS 服务器，否则最好使用 IP 地址而不是主机名从 Windows 访问你的 Linux Mint 机器。事实上，如果你没有设置 DNS
    服务器，你*必须*使用 IP 地址从 Windows 机器访问 Samba 服务器，因为你的 Windows 机器将无法解析 Linux Mint 的 IP
    地址。正如我们在第 7 章中讨论过的，为你的 Linux Mint 机器分配一个静态 IP 地址会让这变得更容易。


    如果你在运行框中输入了 UNC，请点击确定；如果你是在 Windows 资源管理器中输入的，请按回车键，然后你应该会收到该共享的用户名和密码提示。使用上面的示例，按以下格式输入你的用户名和密码：


    ```

    camalas@192.168.1.2

    ghost

    ```


    有必要将用户名输入 `camalas@192.168.1.2`（或者换用 `192.168.1.2\camalas`），否则 Windows 会尝试使用它自己的账户对
    Samba 共享进行验证。这显然行不通。在账户名中使用 IP 地址会强制 Windows 对 Samba 服务器进行验证。


    如果这不起作用，首先确保你输入的用户名、密码和 IP 地址是正确的。任何一个错误都会导致失败，而且密码是*区分大小写*。接下来，检查 `/etc/samba/smb.conf`
    文件以确保共享权限设置正确。还要检查你尝试访问的文件夹的文件系统权限和所有权。无论共享权限如何，你的用户账户都需要具有实际访问共享文件夹的权限。例如，如果你使用
    `sudo` 创建了共享文件夹，则 root 用户和 root 组将拥有该文件夹的所有，你将无法使用 Samba 账户访问它。


    # 第 11 章 - FTP 客户端与服务器


    FTP 代表“文件传输协议”（file transfer protocol），它允许你将文件传输到远程计算机。FTP 已经存在了很久，它有很多优缺点。由于
    FTP 如此老旧，它在几乎每个操作系统上都受到支持，而且大多数操作系统都包含了某种 FTP 客户端。缺点是 FTP 并不十分安全。它有一个旋转端口的坏习惯，这使得它在互联网上使用变得很困难（防火墙非常不喜欢端口突然变化），而一个允许匿名登录的
    FTP 服务器是极不安全的——任何人都可以上传或下载材料，这意味着允许匿名访问的 FTP 服务器可能会很快发现自己正在托管非法材料。（如今，允许匿名访问的
    FTP 服务器已经非常罕见了。）我强烈倾向于使用 SFTP，我们将在第 11 章中讨论。


    然而，Linux Mint 可以以相当程度的安全性作为 FTP 服务器。在本章中，我们将向你展示如何将 Linux Mint 设置为 FTP 服务器，以及如何使用命令行
    FTP 客户端。


    ## 安装并配置 FTP 服务器


    Linux Mint 最常用的 FTP 服务器软件是 `vsftpd` 软件包，它代表“非常安全的 FTP 守护进程”（very secure FTP daemon）。它是
    Linux Mint 默认的 FTP 软件包，大多数其他 Linux 发行版也是如此。作为一个额外奖励，`vsftpd` 开箱即用就很安全——如果你想让它变得不安全，必须特意去搞乱配置文件。


    额外地，`vsftpd` 在 Linux Mint 机器上的安装和配置非常简单。要安装 `vsftpd` 软件包，请进入命令行界面并输入此命令：


    ```bash

    sudo apt-get install vsftpd

    ```


    输入密码进行验证，`apt` 将为你下载并安装 `vsftpd`。


    按照默认提示操作，`vsftpd` 服务器将安装在你的计算机上。通常，`vsftpd` 的默认配置相当安全，足够日常使用。匿名用户被禁用，没有人可以向服务器写入文件（或者在
    FTP 术语中，没有人可以向服务器上传文件）。任何拥有系统账户的用户都可以连接到 FTP 服务器并下载文件，但不能上传。


    如果你想更改任何设置，`vsftpd` 的配置文件为 `/etc/vsftpd.conf`。像任何其他配置文件一样，你可以用 `vi` 编辑它：


    ```bash

    sudo vi /etc/vsftpd.conf

    ```


    像 Samba 一样，`vsftpd.conf` 文件包含许多控制服务器行为和运行的“指令”。如果你想让用户能够写入文件，你需要更改此指令：


    ```

    #write_enable=YES

    ```


    改为：


    ```

    write_enable=YES

    ```


    一旦 `write_enable` 设置为 `YES`，用户就可以向服务器上传文件。然而，匿名访问由此指令控制：


    ```

    anonymous_enable=NO

    ```


    *在任何情况下都不应该允许对你的服务器进行匿名访问，特别是它可以从互联网访问时！在某些情况下你可能会发现它有用，但只有在你*确定*自己在做什么时才启用它。如果你对文件进行了任何更改，保存并退出
    vi。然后重启服务器以读取新指令：


    ```bash

    sudo service vsftpd restart

    ```


    现在你可以从命令行测试服务器 的 FTP 服务：


    ```bash

    ftp 127.0.0.1

    ```


    ## 使用 FTP 客户端


    有 FTP 服务器并不意味着你可以立即访问它——你首先需要一个“FTP 客户端”的程序来与 FTP 服务器进行通信。幸运的是，Linux Mint 自带了
    FTP 客户端——你只需在命令行输入以下内容即可访问：


    ```bash

    ftp

    ```


    然而，如果你知道想要访问的 FTP 服务器的 IP 地址，使用起来会方便得多。假设你想访问 IP 地址为 `192.168.1.100` 的 FTP 服务器。为此，你可以将
    IP 地址附加到 ftp 客户端命令之后：


    ```bash

    ftp 192.168.1.100

    ```


    FTP 客户端随后会要求你输入用户名。（注意，这是 FTP 服务器上的用户名和密码，而不是你电脑上的用户名和密码。）输入它并按回车。客户端会要求输入密码，你应该随后输入密码。一旦输入，你就会进入
    FTP 提示符，如下所示：


    ```

    ftp>

    ```


    如果你看到这个，说明服务器工作正常。你可以通过此命令返回命令行：


    ```

    exit

    ```

    '
