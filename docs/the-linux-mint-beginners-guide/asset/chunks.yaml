  raw: 'In the next section, we’ll look at installing and configuring Wine on an Linux
    Mint system. We’ll also talk a bit about using Linux Mint to connect to Windows
    Server Terminal Services / Remote Desktop Services systems.


    INSTALLING AND CONFIGURING WINE


    Configuring Wine can occasionally be a challenge, but Wine installs quite easily
    and runs just fine on Linux Mint. To install Wine, use this command at the Terminal
    prompt:


    sudo apt-get install wine-stable


    Enter your password to authenticate, and apt will download and install Wine. The
    combined packages come to a little over a hundred megabytes, so it might take
    a while to install depending upon your connection speed.


    After the installation is finished, you can use the command line Wine program
    to install Windows software.


    However, you’ll probably first need to mark the installer file as executable.
    Depending on the application, Wine might not be able to install it if its installer
    file isn’t executable. (We discussed file permissions in Chapter 2.) For instance,
    to mark an installer file in your Downloads folder named INSTALL.EXE as executable,
    use this command at the Terminal prompt:


    chmod 755 ~/Downloads/INSTALL.EXE


    After the file has been marked as executable, you can then install Windows software
    with Wine through the command line. For instance, to install the example above,
    you would use this command:


    wine ~/Downloads/INSTALL.EXE


    If the application did not install, you’ll probably have to change the Wine settings.
    The best course is to probably browse the Wine application database and see if
    you can find the correct settings there. The database contains settings and tips
    for installing thousands of Windows applications, and you can find it here:


    http://appdb.winehq.org/


    Generally, Wine is very good at backwards compatibility - the older an application
    is, the more likely it is that Wine will support it.


    Finally, you can install a Windows application through a companion GUI application
    called Winetricks. Winetricks makes installing an application smooth and easy
    - but only if the specific application is supported. To install Winetricks, use
    this command at the Terminal:


    sudo apt-get install winetricks


    Once Winetricks is installed, you can launch it by going to the mintmenu, searching
    for "winetricks", and clicking on the icon for the application. Winetricks offers
    a GUI for installing Windows applications, and you can easily follow the prompts
    to install a supported Windows application.


    INSTALL REMMINA


    Microsoft Windows Servers have a technology called Terminal Services, renamed
    to Remote Desktop Services in Windows Server 2008 R2\. This allows client computers
    to remotely connect to the server, viewing the remote desktop and using the remote
    applications as if they were installed locally. Many organization use Terminal
    Services/ Remote Desktop Services to centralize their computing infrastructures.
    That way an organization can have a powerful central server system, and use cheaper
    client computers to connect to the Terminal Services / Remote Desktop Services
    server.


    Every version of Windows since Windows XP comes with an included Remote Desktop
    client. However, Remote Desktop provides an opportunity for you to use Linux Mint
    in a Windows-heavy environment. Versions of Linux Mint prior to 11.04 Natty Narwhal
    used a program called TSclient as a Remote Desktop client. It worked, but not
    very well.


    However, there’s a far superior option available now – Remmina. Linux Mint 11.04
    Natty Narwhal (and all later versions of Linux Mint) includes Remmina as the default
    Remote Desktop client. Remmina has many more advanced features, and the biggest
    one is that it works much better on a netbook screen, and gives you greater options
    for selection the resolution. It also includes scroll bars for a Terminal Services
    window larger than the current screen size – an invaluable feature that TSClient
    just didn’t have. If you have an older version of Linux Mint, you can install
    Remmina with this command at the Terminal windows:


    sudo apt-get install remmina


    Enter your password to authenticate, and apt-get will download and install Remmina
    for you. After the installation is complete, you can launch Remmina by going to
    the Applications menu, to Internet, and clicking on the Remmina icon. In Linux
    Mint 11.04 Natty Narwhal, you can also launch Remmina by clicking on the mintmenu
    and searching for it in the search field.


    ***


    ## Chapter 19 - Managing and Creating eBooks on Linux Mint


    This book only exists in ebook format, so if you’re reading it, you’re already
    familiar with ebooks as a concept. However, in the last few years (2007 to 2016,
    as of this writing), ebooks have taken the world by storm. Major online retailers
    report higher sales of ebooks than physical books, the sales of printed books
    and newspapers are collapsing, and bookstores are going out of business right
    and left. In my opinion, ebooks are as big a revolution as Gutenberg’s printing
    press or the invention of paper. And like the printing press, I think ebooks will
    result in a widespread increase in literacy, as an entire generation of men and
    women who have never purchased a physical book will nonetheless read on their
    computer screens or smartphones.


    Fortunately, you can use Linux Mint to both manage and create ebooks, using a
    variety of free software tools that we will discuss in this chapter.


    **WHAT IS AN EBOOK?**


    An ebook, generally, is a book-length document stored in a digital file. Ebooks
    have been around almost since the beginning of the Internet – Project Gutenberg,
    which hosts an enormous number of free public domain ebooks, was founded in 1971\.
    Publishers have been experimenting with digital formats, mostly unsuccessfully,
    ever since the World Wide Web became popular in the late 1990s. However, the lack
    of a viable ereaders hampered early adoption of ebooks. Only a very few people
    enjoyed reading a full-length book on a CRT monitor or on the tiny screen of a
    PDA device.


    This changed with the development of e-Ink and LED tablet devices towards the
    end of the first decade of the 21st century. A quality e-Ink reading device provides
    an experience almost as good as a printed page, and a decent LED display, while
    not as good as an e-Ink device for sustained reading, nonetheless is much easier
    to read than an old tube monitor. With the increasing ubiquity of Internet connections,
    and the decreasing cost of ereader devices, the ebook revolution is well underway.


    Paper books will never go away – radio was superseded by first television and
    then the Internet, but there are no shortages of commercial radio stations – but
    ebooks offer a number of useful advantages over paper books. The first is portability
    – four gigabytes of flash memory can hold thousands of ebooks. The equivalent
    amount of paper books would fill several rooms. The second is a positive environmental
    impact – ebooks are far easier on the environment (and the forests, specifically)
    than paper books, and due to the antiquated returns system employed by most modern
    publishers and bookstores, thousands of paper books are wasted every year. The
    third advantage is cost – ebooks are often cheaper than their physical counterparts,
    and vast numbers of public domain books, including the classics of Western civilization,
    are available for free from Project Gutenberg and other sites.


    **EBOOK FORMATS**


    Ebooks come in a variety of formats, but there are two dominant ones – the MOBI
    format, and the EPUB format.


    The MOBI format originated with a company called Mobipocket, which developed the
    MOBI format for ebooks and several different applications for reading MOBI files.
    Online retailer Amazon bought Mobipocket in 2005, and when the Kindle debuted
    in 2007, Amazon used the MOBI format for its Kindle books. Any ebook purchased
    off Amazon’s site will be in the MOBI format.'
