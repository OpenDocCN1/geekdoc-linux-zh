    leading zeroes in each of address blocks:


    2001:db8:85a3:42:0:8a2e:370:7334


    Additionally, you can also use a pair of colons (::) to represent a long string
    of zeroes. So our original address could be further shortened down to this:


    2001:db8:85a3:42::8a23:370:7334


    Granted, this is still a lot to type (or to read to a support technician over
    the phone), but still easier that typing out the entire address.


    IPv6 addresses do not have subnet masks the way that IPv4 addresses do. Instead
    an IPv6 address has a "subnet prefix", which identifies how much of the IPv6 address
    identifies the local network segment and how much identifies the individual computer.
    Usually, the first 64 bits of the IPv6 address (the first four blocks of four
    digits) identifies the network segment, and the second 64 bits identifies the
    individual computer (and this is usually derived from the computer''s MAC address).


    There are three main kinds of IPv6 addresses assigned to personal computers. The
    first is a Global IPv6 address, which is equivalent to a public IPv4 address.
    Global addresses are designed to be accessible from the Internet, and website
    or public network services will have a Global address. Global addresses always
    start with either a 2 or a 3.


    A Link-local address is the second major kind of address. A Link-local address
    basically works the same as an APIPA address, in that a computer assigns itself
    a Link-local address when it hasn''t been given a static address or is able to
    contact a DHCP server. A Link-local address always starts with fe8.


    Finally, the third major kind of IPv6 address given to personal computer is a
    Site-local address. A Site-local address is equivalent to the private IPv4 addresses
    we described above. Like IPv4 private addresses, Site-local IPv6 addresses are
    intended to be used in an organization''s private networks, and are usually not
    accessible from the Internet. Site-local IPv6 addresses always start with fec0\.
    Not many organizations are currently using Site-local addresses, but as IPv4 becomes
    increasingly obsolete, more organizations will switch to them.


    Like IPv4, IPv6 also offers a local loopback address. The local loopback address
    for IPv6 is this:


    0000:0000:0000:0000:0000:0000:0000:0001


    But remember that a string of zeroes can be shortened with a pair of colons. So
    the local loopback address for IPv6 is usually displayed like this:


    **::1**


    That is much easier to type!


    FIND YOUR IP ADDRESS


    It''s actually much easier to find your IP address from the command line in Linux
    Mint than from the graphical interface. Simply go to a command prompt and type
    this command:


    ifconfig


    The ifconfig command will generate an output that looks something like this:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_558379d3.jpg)'
