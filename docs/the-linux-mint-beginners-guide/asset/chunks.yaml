    输入您的密码进行验证，`apt` 将下载并安装 Wesnoth。合并后的文件大小约为 500 兆字节，因此可能需要一些时间。安装完成后，你可以进入 mintmenu（系统菜单），搜索“Wesnoth”，并点击
    Battle for Wesnoth 图标来启动“战斗”。


    # ANGBAND


    那些玩电脑游戏足够久的人可能还记得旧的 Rogue 风格电脑游戏。Rogue 游戏起源于 1980 年最初的 `Rogue` 游戏，设计用于在大学 `UNIX`
    计算机终端上运行。在 `Rogue` 中，玩家扮演一名冒险者的角色，不断向深处复杂的地下迷城，杀杀怪物，避开陷阱，并收集黄金和经验值（当然，这直到今天仍然是电脑游戏的核心内容）。“Roguelike”游戏源于最初的
    `Rogue` 游戏，在它的想法和执行上进行了改进，直到今天许多图形游戏仍基于 `Rogue` 的原始原理运行。


    Angband 是最著名的 Roguelike 游戏之一。它始于 1990 年，从那时一直在开发，并且仍然是一个经典的 Roguelike 游戏体验，尽管它通过现代化的改进平滑了
    `Rogue` 原始的一些粗糙之处。


    ## 安装 Angband


    安装 Angband 非常简单。进入 `Terminal`（终端）窗口并使用此命令：


    ```bash

    sudo apt-get install angband

    ```


    按照默认提示操作，Angband 将会被安装。一旦 Angband 安装完成，你可以使用此命令启动游戏：


    ```bash

    angband

    ```


    按照提示创建你的角色，很快你就可以开始游戏了。小心哥鬼！


    # DOSBOX


    确实是一个非常奇特的讽刺现象：在 Windows 10 上通常无法再运行旧的 DOS 游戏，但通过适当的软件，你可以在 Linux Mint 上运行同样的老旧游戏。你只需要
    `DOSBox`，这是一个允许你运行旧版 DOS 游戏的仿真环境。作为额外奖励，`DOSBox` 非常容易安装。只需进入 `Terminal` 窗口并输入此命令：


    ```bash

    sudo apt-get install dosbox

    ```


    按照默认提示操作，`DOSBox` 就会在你的 Linux Mint 系统上安装自身以及其他几个软件包。安装 `DOSBox` 后，你可以进入 mintmenu
    并在搜索框中搜索“DOSBox”来启动它。你也可以从命令行启动：


    ```bash

    dosbox

    ```


    现在，由于 `DOSBox` 依赖于旧的 DOS 驱动器号系统，而 Linux Mint 没有，你可能会疑惑如何挂载驱动器。幸运的是，这非常简单。假设你在主目录下创建了一个名为
    `dos` 的目录，作为 DOS 会话期间的 `C:` 盘。要挂载为 `C:` 盘，请在 `DOSBox` 中此命令：


    ```bash

    mount c ~/dos

    ```


    要将光驱挂载为 `D:` 盘，请使用此命令：


    ```bash

    mount d -t cdrom /media/cdrom

    ```


    使用这些命令，你应该能够在 Linux Mint 系统上玩许多旧 DOS 游戏。


    # STEAM


    Valve 为 Linux Mint 提供了流行的 `Steam` 平台。使用 `Steam` 客户端，你可以轻松地在 Linux Mint 系统上玩许多热门游戏（假设你的电脑硬件符合各种游戏的系统要求）。在
    Linux Mint 上安装 `Steam` 客户端是一个简单且流程化的过程，我们将向你展示如何操作。


    ## 安装 Steam


    首先，访问 Steam 网站下载客户端：


    `http://store.steampowered.com`


    点击页面顶部的 `Install Steam` 按钮，然后点击 `Install Steam Now` 按钮。这将把 `.deb` 安装文件下载到你的 `Downloads`（下载）文件夹。下载完成后，导航到
    `Downloads` 文件夹，双击安装程序启动它。


    片刻之后，安装程序将带你进入 Linux Mint Software 应用程序并向你显示关于 `Steam` 的信息。点击 `Install` 按钮，Linux
    Mint Software 将要求你输入密码。输入密码后，Linux Mint Software 将安装客户端。


    安装完成后，你可以进入 mintmenu 并搜索“Steam”来启动 `Steam` 客户端。当客户端首次启动时，它可能会下载数百兆字节的更新。


    一旦下载完成，你就可以登录客户端并浏览你的 `Steam` 游戏库了。


    # GOG.COM


    过去十年中 Linux 游戏领域最好的进展之一是 `GOG.com` 的崛起。该网站于 2008 年作为 `Good Old Games` 起家，致力于获取合法销售“被弃软件”（abandonware）游戏的权利，即由于各种原因被发行商放弃的旧
    DOS 游戏。


    `GOG.com` 在 2008 年最初名为 `Good Old Games`，于 2010 年改进为 `GOG.com`。`GOG.com` 目前提供许多重新封装的旧
    DOS 游戏，可以在 Linux Mint 上流畅运行。在这个示例中，我们将向你展示如何安装 `Darklands`，一款 1992 年经典的 Microprose
    RPG。`Darklands` 的安装非常典型，你可以此示例在 Linux Mint 上安装其他旧的 `GOG.com` 游戏。


    ## 安装 Darklands


    首先，登录你的 `GOG.com` 账户并下载你想玩的游戏的 Linux Mint 安装程序。安装程序将以脚本的形式下载，你需要先将其标记为可执行。要将 `Darklands`
    脚本标记为可执行，请同时按下 `CTRL+ALT+T` 键打开终端，然后输入命令：


    ```bash

    chmod +x ~/Downloads/gog_darklands_2.0.7.sh

    ```


    然后执行该脚本：


    ```bash

    ~/Downloads/gog_darklands_2.0.7.sh

    ```


    安装程序将带你进入 Linux Mint Software 应用程序并显示关于 `Darklands` 的信息。接受许可协议，然后选择安装目录（除非你有特定的安装理由，否则默认位置是可以的）。安装程序将询问你是否想要创建快捷方式和菜单项（这将允许你通过系统菜单找到游戏）。确保选择这两项，这将方便你在安装后启动游戏。


    一旦安装完成，你可以进入 mintmenu 并搜索“Darklands”，然后双击 `Darklands` 图标来启动。Linux Mint 将启动 `DOSBox`
    并加载预配置好的 `Darklands`。


    注意，游戏将全屏加载——你可以同时按下 `ALT` 和 `ENTER` 键切换到窗口模式。


    此过程将让你能够安装大多数 `GOG.com` 兼容 Linux 的经典游戏。


    `GOG.com` 还有许多可以在 Linux Mint 上原生运行的新游戏。务必检查系统要求，因为它们会列出运行游戏可能需要的任何软件包。


    # 第 18 章 使用 Wine 运行 Windows 软件


    我帮助过许多从 Windows 切换到 Linux Mint 的人，他们不可避免地问同一个问题：


    “嘿，Linux Mint 太棒了！但我能在它上安装我喜欢的 Windows 应用程序吗？”


    从表面上看，答案显然是否。Windows 软件是为 Windows 平台设计的，而 Linux Mint 软件是为 Linux 平台设计的，两者永远不会兼容。如果你想在
    Linux Mint 上使用你喜欢的 Windows 应用程序，你需要找到 Linux 版本，或者找到另一个执行相同任务的应用程序。


    然而，有一种绕过这个问题的方法。


    这种方法是一种名为 `Wine` 的软件应用程序，它的缩写原意为“Wine Is Not An Emulator”（Wine 不是模拟器）。它实际上是一个兼容层，理论上允许你在
    Linux 系统上运行 Windows 应用程序。并不是所有的应用程序都能工作，某些比其他的更好用，有些则需要大量的调整才能正常运行。但是，如果你愿意研究，你就可以让你的
    Windows 应用程序运行起来。

