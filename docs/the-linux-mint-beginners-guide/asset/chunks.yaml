    However, this command by itself, without any options, is not very useful. It creates
    the `camalas` user account, but doesn''t assign a display name for the account,
    nor does it create a home user for camalas. It also doesn''t set any variables
    - for instance, if Caina logs in using the `camalas` account, she''ll get the
    older sh shell for her command line, instead of the bash shell.


    We''ll need to add some options to the `useradd` command to make it more effective.
    To start, here''s how to create a home directory with the command:


    ```bash

    sudo useradd -m camalas

    ```


    The `-m` option causes `useradd` to create a home directory. Next, we''ll add
    another option, and tell `useradd` to set bash as camalas''s default shell:


    ```bash

    sudo useradd -m -s "/bin/bash" camalas

    ```


    The addition of the `-s` switch and `"/bin/bash"` tells `useradd` to set the bash
    shell for camalas''s default shell. Now we''ll want to make sure that camalas''s
    display name is properly set as Caina Amalas with the `-c` option:


    ```bash

    sudo useradd -c "Caina Amalas" -m -s "/bin/bash" camalas

    ```


    With these options, `useradd` creates a new account named camalas, sets the account''s
    display name as Caina Amalas, creates a home directory for the new account, and
    sets bash for camalas''s default shell. (Note that `useradd` has many options,
    and you can view them all in `useradd''s` man page.)


    There''s one final thing you need to do to allow Caina to log in using the camalas
    account - you need to set a password for the new account. You can do that using
    the `passwd` command:


    ```bash

    sudo passwd camalas

    ```


    You can then set a password for camalas. Note that you can also use the `passwd`
    command, without `sudo`, to reset the password for your own account.


    Linux Mint''s user accounts are stored in the `/etc/passwd` file. It''s a plain
    text file, so you can view it like any other text file:


    ```bash

    cat /etc/passwd

    ```


    You will see a lot of accounts in there, but most of them are for various system
    services and you needn''t concern yourself with them. For actual user accounts,
    in `/etc/passwd` you can view the account name, the user id (UID) number, the
    group id (GUID) of the account''s default group, the display name, the location
    of the home directory, and the default shell.


    You might be tempted to manually add user accounts by editing the `/etc/passwd`
    file. Do *not* do this! The passwords for user accounts are stored in a restricted
    file called `/etc/shadow`, and it needs to stay in sync with `/etc/passwd`. Manually
    editing `/etc/passwd` can mess up your system.


    # REMOVING USER ACCOUNTS


    From time to time, you''ll want to remove accounts from your Linux Mint system.
    It''s quick and easy to remove an account from the command line. In fact, it''s
    rather less cumbersome than doing it through the GUI.


    Before you delete a user account, you might first consider locking it with the
    `usermod` command. Locking an account disables its password, which means the account
    can no longer log into the system. For example, to lock the camalas account:


    ```bash

    sudo usermod -L camalas

    ```


    (Note that options, like commands and filenames, are case sensitive, and the `-L`
    option must be capitalized.)


    If you want to get rid of an account entirely, use the `userdel` command with
    `sudo`:


    ```bash

    sudo userdel camalas

    ```


    This command will delete the camalas user account from your system. However, it
    will not delete camalas''s home directory, which means that all her personal files
    and configuration settings will remain on your system in the `/home/camalas` folder.
    To delete both the camalas account and camalas''s home folder, use `userdel` with
    the `-r` option:


    ```bash

    sudo userdel -r camalas

    ```


    This will delete both the camalas account and camalas''s home folder.


    # ADDING GROUPS


    Like user accounts, you can create groups for your users from the Linux Mint command
    line. There are a couple of different ways to create groups in Linux Mint, and
    both ways are valid. First, you can use the `groupadd` command to add a group
    named ghosts:


    ```bash

    sudo groupadd ghosts

    ```


    Alternatively, you could use the `addgroup` command:


    ```bash

    sudo addgroup ghosts

    ```


    Both commands do the same thing, but have different potential options, if you
    wish to peruse their man pages.


    (Second shameless authorial plug: in the "Ghosts" novels, Caina belongs to the
    Ghosts, the spies of the Emperor of Nighmar.)


    Like user accounts, Linux Mint stores all its groups in a plain text file, `/etc/group`.
    To view this file:


    ```bash

    cat /etc/group

    ```


    Most of the groups in there are system groups and can be safely ignored. It will
    seem like all of your user accounts are simultaneously listed in the group file
    as well - these are actually the primary groups of your user accounts (Linux Mint
    creates a group for each of your user accounts, and assigns the user account that
    group as its primary group). Any groups that you create will appear on the bottom
    of the file.


    # ADDING USERS TO GROUPS


    Once you''ve created your group, you can add users to it. Again, there are a couple
    of different ways to do so. The first way is with the `useradd` command. To add
    the camalas account to the ghosts group:


    ```bash

    sudo useradd camalas ghosts

    ```


    You can also use the `usermod` command to add a user to a group:


    ```bash

    sudo usermod -G ghosts camalas

    ```


    # REMOVING USERS FROM GROUPS


    To remove an account from a group, use the `userdel` command:


    ```bash

    sudo userdel camalas ghosts

    ```


    This will remove camalas from the group.


    # DELETING GROUPS


    To remove a group, use the `groupdel` command:


    ```bash

    sudo groupdel ghosts

    ```


    This will eliminate the group, even if it still has members. Note that you cannot
    remove the primary group of any user without first removing that account from
    the group, or deleting the account. (Remember that Linux Mint creates a group
    after each of your user accounts.)

