    website without deep knowledge of HTML or PHP coding. In this chapter, we’ll discuss
    how to install three of the most popular content management systems on a Linux
    Mint web server – WordPress, MediaWiki, and Moodle.


    ## THE LAMP SERVER


    However, WordPress, MediaWiki, and Moodle are all powered by something called
    a LAMP server, which we’ll discuss in the next section.


    LAMP is simply an acronym for Linux, Apache, MySQL, and PHP (or Perl and Python).
    These four software components provide a powerful web server and the backend of
    content management systems. In a LAMP server, Linux is the operating system. Apache
    is the web server, and MySQL the database backend.


    We’ve discussed both Apache and MySQL, but we haven’t yet mentioned the “P” in
    “LAMP” - PHP. PHP is a “scripting language”, which is a kind of computer language
    written specifically to control a particular software or hardware component. In
