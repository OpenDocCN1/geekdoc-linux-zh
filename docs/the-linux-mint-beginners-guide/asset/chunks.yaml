    Fortunately, there are several commands you can use to track disk space usage
    from the command line in Linux Mint.


    The first command is `df`, which produces an output like this:


    ```

    /dev/sda1 31621016 3364900 26649820 12% /

    ```


    You''ll notice like the Filesystems tab in System Monitor, the `df` command lists
    all the filesystems on your computer. The first number is the total size of the
    drive. The second is the used space. The third is the available space, and the
    final number is the percentage of space used. However, the numbers are in 1 kilobyte
    blocks, which makes the difficult to read without mental mathematics. To make
    the output more readable, use `df` with the `-h` option:


    ```

    /dev/sda1 31G 3.3G 26G 12% /

    ```


    You''ll notice that the sizes are now in gigabytes (or megabytes, depending on
    the size of the filesystem), which is much more readable.


    You might also need to check the size of an individual folder, since the `ls`
    command, even with the `-l` option doesn''t bother to list the size of folders.
    (Technically, directories in Linux are also files, so the `ls -l` command only
    lists the size of the file representing the directory without any of the directory''s
    contents.) To find the size of a folder from the commmand line, use the `du` command
    with the `-s` and `-h` options:


    ```

    du -sh ~

    ```


    The command will list the size of the targeted folder in megabytes or gigabytes,
    as appropriate.


    # CHECK MEMORY US


    The `top` command does a pretty good job of seeing which processes are using the
    most memory. It does not, however, give an overview of your system''s entire memory.
    To do so, you need to use the `free` command, which generates an output like this:


    ```

    Mem: 1025700 340708 684992 0 38904 156368

    ```


    The first three numbers are the most important - they list the total amount of
    RAM, the amount used, and the amount currently free. The RAM is listed in bytes
    which, unless you''re really good at mental math, makes it rather hard to read.
    Fortunately, you can use the `-m` option with `free` to display the totals in
    megabytes instead of bytes, generating an output like this:


    ```

    Mem: 1001 501 500 0 64 277

    ```


    The numbers are roughly the same as before, but they''re expressed in megabytes
    now, not bytes, which usually makes for easier reading. You can also use the `-k`
    and `-g` switches to express the values in kilobytes and megabytes, if you prefer.


    ***


    ## Chapter 8 - Editing Text Files with vi


    We''ve spent the last few chapters covering the basics of Linux Mint - the command
    line, file permissions, users and groups, and managing system resources. We''re
    now ready to move on to more advanced topics, such as how to configure Linux Mint
    for a variety of server roles. Linux Mint can be configured to perform almost
    any server task, offering a powerful server platform at very low cost.


    First, however, we have to talk about configuration files, and how to edit them.


    Configuration files on the Microsoft Windows platform are almost always `*.ini`
    files, or hex files, or binary files that you cannot alter without special programs.
    In contrast, configuration files on Linux are usually simple text files that you
    can alter with any text editor program. Linux Mint comes with a graphical text
    editor, the `gedit` program, that lets you edit text while providing a full GUI
    menu with copy and paste and so forth.


    However, `gedit` doesn''t work from the command line, and it definitely doesn''t
    work in the Server Edition of Linux Mint, which does not include a GUI. Therefore
    it is vital to learn a command line editor if you want to configure Linux Mint
    as a server.


    There are a number of command line editors available for Linux Mint - `nano`,
    Richard Stallman''s `Emacs`, `vi`, and others. I think `vi` is the simplest to
    use, so this chapter will focus on using the `vi` editor. Granted, opinions can
    and do differ on the best editor to use - a flame war on the relative merits of
    Emacs and `vi` has been going for decades.


    # WHAT IS VI?


    The `vi` editor has been around for a long time. It grew out of a series of UNIX
    text editors in the 1960s and the 1970s, with the first version developed by programmer
    Bill Joy in the late 1970s. Later, `vi` was praised for its small memory footprint,
    which meant it could be used on systems with low amounts of available memory.


    The variant of `vi` included with Linux Mint is actually `vim`, which stands for
    "vi Improved." `vim` was developed by a programmer named Bram Moolenaar in the
    early 1990s. Today, `vim` is generally the most popular variant of `vi`, and is
    included with most Linux distributions.


    However, the `vi` command is still symbolically linked to `vim`, so typing `vi`
    into Linux Mint''s command line will launch `vim`.


    # LAUNCHING VI


    Launching `vi` is simply a matter of typing the command:


    ```

    vi

    ```


    This will take you to an empty file, and you can create text files from here.


    However, you''ll often use `vi` to view or edit an existing text file. If you
    wanted to use `vi` to open a file named `test.txt`:


    ```

    vi test.txt

    ```


    The `vi` editor will then launch with the `test.txt` file open.


    You can also use `vi` to create new files. For instance, if you wanted to use
    `vi` to create a file named `newfile.txt`:


    ```

    vi newfile.txt

    ```


    However, note that the file isn''t actually written to disk (and therefore doesn''t
    exist) until you write it to disk. We''ll discuss how to do that in the next section.


    # VI MODES


    Vi is not like a word processor, in that you can''t simply fire up, sit down,
    and start typing. Vi has different modes, each of which has a different function.
    If you think of vi as a Swiss army knife, then the modes are the different kinds
    of blades.


    Vi has four modes:


    - Normal mode. Vi starts in default mode, and you can delete text from normal
    mode.

    - Command mode. This lets you save your text.

    - Insert mode. This lets you type fresh text into your file.

    - Replace mode. This is similar to Insert mode, but you can overtype text, which
    you can''t do in Insert mode.


    Let''s take a closer look at each of the modes.


    ## NORMAL MODE


    Vi starts in Normal mode. Normal mode lets you navigate around the text file by
    moving the cursor with the up and arrow keys, along with the Page Up and Page
    Down keys. Pressing HOME key takes you to the beginning of the file, and pressing
    END moves you to the end. You can also use Normal mode to delete text within the
    file, from single characters all the way to entire lines. Normal mode also offers
    a search feature, allowing you to quickly locate specific terms within the file.


    First, let''s take a look at the commands to delete text within Normal mode.


    - Pressing `dw` deletes the word immediately after the cursor. This command also
    deletes the space following the word.

    - Pressing `de` also deletes the word immediately following the cursor. Unlike
    `dw`, however, it does not delete the space following the word. own- Pressing
    `d$` deletes from the cursor to the end of the current line.

    - Pressing `dd` deletes the entire current line.

    - Pressing `p` inserts the text from the last deletion after the current location
    of cursor. Essentially, in conjunction with the deletion commands, this lets you
    cut and paste within vi.

    - Pressing `u` undoes the last action. Trust me, if you''ve made a mistake while
    editing a text file with vi, this can definitely come in handy.

    - Pressing `CTRL-G` displays a status bar at the bottom of the screen. The status
    bar will display the name of the file, whether or not it has been modified since
    the last time it was saved, which line and column the cursor currently occupies,
    and how far into the file you are as a percentage.

    - Pressing `/` (forward slash) activates the search function. Type a search term
    and hit enter, and vi will take you to the first instance of the search term.
    You can then hit the N key to jump to the next instance of the term

