    Once at the FTP prompt, you can use some of the common terminal commands. To see
    a listing of the remote directory, you can use the `ls` command:


    ```

    ls

    ```


    This will display the contents of the remote directory.


    To find which remote directory you''re actually in, you can use the `pwd` command:


    ```bash

    pwd

    ```


    This command, as you might remember from Chapter 1, stands for "print working
    directory", and will display the current working directory.


    To download files from the FTP server, you will need to use the `get` command.
    For instance, to retrieve a file named "report.doc" from the current working directory:


    ```bash

    get report.doc

    ```


    This will download the file to your local home directory.


    To upload files to the FTP server (assuming that the server''s `write_enable`
    directive is set to YES), you''ll need to use the `put` command. To put a file
    named "data.doc" on the remote server:


    ```bash

    put data.doc

    ```


    This will upload the file to the remote directory on the FTP server.


    This is only a basic overview of the commands available with the FTP client -
    many more are available. Also, if you would prefer to use a graphical FTP client,
    I would recommend the excellent Filezilla client, which you can install with this
    command:


    ```bash

    sudo apt-get install filezilla

    ```


    ***


    ## Chapter 12 - Using SSH and SFTP


    SSH stands for "secure shell", and it is a network protocol that allows you to
    securely send commands to a remote machine. We discussed in Chapter 3 how a "shell"
    is a program that provides an interface between the user and the operating system.
    SSH is a "remote" shell that allows you to send commands to a machine over the
    network. The "secure" part comes from the fact that the connection is encrypted,
    which means that an attacker cannot eavesdrop on the connection, or intercept
    and replace your commands with his own midway through transit. SSH is pretty reliable
    and secure, and is commonly used in the Linux world. Administrators often use
    it to remotely manage machines – it’s usually more comfortable to control a server
    from your laptop than in the chilly and noisy server room.


    SSH also offers the SFTP protocol, which stands for "SSH File Transfer Protocol".
    Basically, SFTP is similar to the FTP protocol, but it uses SSH''s security functions
    to encrypt the connection. That means SFTP is much more secure than FTP.


    In this chapter, we''ll show you how to set up an SSH server, how to use the SSH
    command-line client, and how to use SFTP. We''ll also show you how to set up SSH
    to use key-based authentication, which is much more secure than password-based
    authentication.


    ### INSTALL AND CONFIGURE AN SSH SERVER


    Linux has always had strong support for SSH, and Linux Mint is no different. In
    this section, we’ll walk through a basic installation of an SSH server, and some
    basic security configuration as well. The default SSH server package for Linux
    Mint is OpenSSH Server, which we’ll use here.


    First, you’ll need to install OpenSSH Server. To do so, open up a Terminal window
    and type the following command:


    ```bash

    sudo apt-get install openssh-server

    ```


    Enter your password to authenticate, and the `apt` utility will download and install
    OpenSSH Server for you. Depending on the speed of your Internet connection and
    your computer, the installation may take several minutes.


    Once the installation has finished, return to the Terminal window. We’ll need
    to make a few changes to your `/etc/ssh/sshd_config` file in order to increase
    SSH’s security. First, as always, we’ll want to make a backup copy of your `sshd_config`
    file in case anything goes wrong. Type this command into the Terminal:


    ```bash

    sudo cp /etc/ssh/sshd_config ~

    ```


    This will make a backup copy of the `sshd_config` file in your home directory.


    Next, we’ll need to edit the `sshd_config` file itself. So it’s time to use your
    skills in `vi` again:


    ```bash

    sudo vi /etc/ssh/sshd_config

    ```


    Like almost every other server software package, SSH is controlled by a number
    of directives in its configuration file. The default installation of OpenSSH server
    is reasonably secure. However, you might want to make a few changes to tighten
    up its security to additional degree.


    The `PermitRootLogin` directive is one you’ll want to change. Once you’re editing
    the `/etc/ssh/sshd_config` file, you’ll want to change the following directive
    as follows:


    ```

    PermitRootLogin no

    ```


    This will keep anyone from attempting to log into your server via SSH as root.
    It’s generally a good idea not to allow any to log into your SSH server as root.
    If an attacker manages to hack into your SSH server with the root login, he will
    have complete control over your machine, and that is definitely not a good thing.


    Another directive you might want to change is the `AllowUsers`. When the `AllowUsers`
    directive is active, only users specifically specified in the directive can access
    the system through SSH. This adds an additional layer of protection to your SSH
    server by only allowing specific users to connect via SSH. For instance, if you
    wanted to limit SSH access to just the “camalas” user account, edit the `AllowUsers`
    directive like this:


    ```bash

    AllowUsers camalas

    ```


    To add multiple users to the `AllowUsers` directive, just add them one by one
    without commas or semicolons. An `AllowUsers` directive that permits the `camalas`
    user account and the `lmaraeus` user account to log in would look like this:


    ```bash

    AllowUsers camalas lmaraeus

    ```


    You may also want to consider changing the `Port` directive. By default SSH runs
    over TCP/IP port 22, which means that any malware bot autoscanning port 22 can
    target it. If you set up your user accounts with a weak password (always a bad
    idea), eventually an automated bot might break through and guess the password.
    Changing the `Port` directive to something different will blocking some of those
    automated attempts. To set SSH to run over 599 instead, make sure your `Port`
    directive looks like this:


    ```

    Port 599

    ```


    Note that if you change your SSH server’s default port, you’ll need to remember
    the new port when using an SSH client, which we’ll cover in the next section.
    After you’ve finished changing the directives in `/etc/ssh/sshd_config`, switch
    `vi` to command mode, and save and quit. After you return to the command line,
    restart the SSH daemon with this command:


    ```bash

    sudo /etc/init.d/ssh restart

    ```


    You should now be able to SSH into your Linux Mint machine from another system
    with an SSH client.


    ### CONFIGURE SSH TO USE KEY-BASED AUTHENTICATION


    SSH is pretty secure, but it does have one weak link – the password. If someone
    cracks your SSH password, they can gain control over your SSH server.


    A more secure method of SSH logons is to use a public/private key. With a public/private
    key, you create a matched pair of private and public keys. You keep the private
    key on your personal machine, while you put the public key on the SSH server to
    which you wish to connect. When configured in this manner, the SSH server will
    only allow connections from systems that have a matching private key for one of
    the public keys.


    In this section, we’ll show you how to set up key-based logons for SSH.


    First, install OpenSSH server on your server. For the rest of this walkthrough,
    we’ll assume that you installed the SSH server on a machine with the IP address
    of `192.168.1.100`, and that you intend to connect to that server from a client
    machine with the IP address of `192.168.1.200`.


    After SSH server has been installed, go to your client machine at `192.168.1.200`
    and enter this command:


    ```bash

    ssh-keygen -t dsa

    ```


    Press Enter, and the command will save a matched public/private key in the `~/.ssh`
    directory. Specifically, it creates two files – `id_dsa`, which is your private
    key, and `id_dsa.pub`, which is your public key. It will also ask you to set a
    passphrase for the use of the key, which is an additional layer of security in
    case someone gains access to your account. Setting a passphrase is usually a good
    idea.

