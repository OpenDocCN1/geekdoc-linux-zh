    你无法在不先安装 Linux Mint 的情况下直接使用它，在本章中，我们将向你展示如何在你选择的计算机上安装 Linux Mint。此外，我们还将向你展示如何在安装
    Linux Mint 后更新它。Linux Mint 及其包含的各种软件包都在不断更新和改进，通过更新可以确保你拥有最新、最强大且最安全的软件版本。


    # 系统要求


    在安装 Linux Mint 之前，请确保你的计算机符合系统要求。“系统要求”一词仅意味着 Linux Mint 需要具有特定速度和存储能力的计算机硬件才能良好运行。幸运的是，Linux
    Mint 的系统要求并不苛刻，而且绝对低于微软 Windows 的要求。


    Linux Mint 首先需要运行速度在 700 赫兹或以上的处理器（“处理器”是计算机中的主计算芯片，其速度指的是每秒可以执行多少次时钟周期计算）。自 2001
    年左右制造的大多数处理器运行速度都在 1 吉赫兹或以上，因此只有非常老旧处理器才无法运行 Linux Mint。


    Linux Mint 还需要 512 兆的内存和 5 字节的可用硬盘空间。“内存”指的是计算机在任何时刻可以加载到工作内存中的信息量（由于这种内存技术上被称为随机访问存储器，`RAM`
    是计算机工作内存的常用缩写）。然而，当计算机关闭时，内存中的信息将会丢失。为了防止数据丢失，需要长期存储的信息会被写入硬盘。由于硬盘的制造费用比 `RAM`
    芯片便宜得多，硬盘可以存储比 `RAM` 多得的信息。几乎每台现代计算机配备了超过 512 兆的 `RAM` 和 5 字节的硬盘存储空间；只有九年前的计算机存储容量会较小。


    Linux Mint 还需要一台带有视频适配器和能够显示 1024x768 像素分辨率的显示器的计算机。同样，大多数现代计算机都能做到。如果你的视频适配器与
    Linux Mint 不兼容，可能会遇到问题。幸运的是，你可以使用 `LiveCD` 模式进行测试，我们将在下一节中讨论。


    最后，你的计算机需要 CD-ROM 驱动器或 USB 端口来安装 Linux Mint。你可以使用 `CD-RW` 光盘或 USB 闪盘安装 Linux Mint，我们将讨论这两种方法。


    ## USB 还是 CD？


    要安装 Linux Mint，你首先需要下载 Linux Mint 的 `ISO` 文件，可以从 `http://www.Linux Mint.com/download/desktop`
    获取。（“ISO 文件”是磁盘镜像文件的术语。）一旦你拥有了 `ISO` 文件，就可以将其刻录到 CD 中，或者在 USB 闪盘上准备好进行安装。


    刻录到 CD 是常用的方法。一旦你将 Linux Mint `ISO` 刻录到 CD，就可以使用该光盘启动带有光驱的计算机，并运行 Linux Mint 的安装程序。这种方法的优点是大多数计算机都有光驱，因此可以从刻录好的
    Linux Mint `CD` 启动。缺点是光驱的噪音较大且速度较慢。此外，在较旧计算机上，我注意到光驱在尝试安装 Linux Mint 时经常这种令人困扰的故障习惯。


    创建一个可启动的 USB Linux Mint 驱动器需要多做一些工作（请从 `www.pendrivelinux.com` 下载安装程序），但它有许多优点。首先，USB
    闪盘通常比刻录的 `CD` 快且更可靠。其次，它比 CD 驱安静，如果你需要经常安装 Linux Mint，随身携带 USB 闪盘要方便得多。然而，并非所有计算机都支持从
    USB 闪盘启动，特别是旧计算机。对于这些系统，你可能需要使用 `CD`。


    ## 安装 Linux Mint


    一旦你决定使用 CD 还是 USB 闪盘，就可以准备好安装 Linux Mint 了。


    使用 CD 或闪盘启动你的计算机。对于某些计算机，你可能需要在屏幕上闪烁制造商 Logo 标志时按下某个特定键以访问启动菜单（例如，对于戴尔计算机，通常是
    `F12` 键，而在华硕计算机上通常是 `ESC` 键）。


    一旦你的计算机从 CD 或 USB 闪盘启动，你应该能看到这个屏幕：


    ![](img/tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_7af41301.jpg)


    此屏幕允许你选择语言，并允许你在“尝试使用 Linux Mint”和“安装 Linux Mint”之间进行选择。“尝试使用 Linux Mint”按钮将你带入完整的
    Linux Mint 环境，从 CD 或 USB 闪盘运行，并访问 Linux Mint 包含的所有软件。这对于故障排除（例如，如果你的计算机无法启动）非常有用，对于在安装
    Linux Mint 之前的测试也很有用。这让你确保图形适配器或无线网卡等硬件能够与 Linux Mint 正常工作。


    现在，我们将专注于安装 Linux Mint。点击“安装 Linux Mint”按钮开始安装过程。你随后会看到这个屏幕：


    ![](img/tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_2df451cf.jpg)


    此屏幕提醒你你需要 4.4 GB 字节的可用磁盘空间。它还提醒你将你的 Linux Mint 系统连接到互联网以进行安装。这并非绝对必要，但它允许安装程序在你安装
    Linux Mint 的同时下载最新更新，你可以通过勾选 `Download updates` 复选框来启用此项。第二个复选框`安装此第三方软件`允许 Linux
    Mint 安装各种解码器。一旦你做出了选择，点击继续。


    安装程序随后会询问你想要如何配置计算机的硬盘。你在这里看到的内容取决于你的计算机有多少块硬盘，以及你是否已经有了操作系统。通常，你可以在“抹除磁盘并安装 Linux
    Mint”与“在旧操作系统和新安装系统之间划分磁盘”之间进行选择（高级用户也可以在此处选择更复杂的选项）。现在，我们假设你想抹除硬盘并在空白磁盘上安装 Linux
    Mint，因此选择擦除磁盘并安装 Linux Mint 的选项（注意，这将擦除磁盘上的所有内容）。


    ![](img/tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m579de16.jpg)


    你将在安装程序继续之前确认你的选项——如果你改变了主意，可以随时点击返回。然而，一旦点击“现在安装”按钮，你的磁盘将被擦除并安装 Linux Mint。


    ![](img/tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_c7e977a.jpg)


    安装程序将在后台开始 Linux Mint，但在过程中仍向你提出一些额外问题。首先，你需要通过点击世界地图来选择你的时区。选择好合适的时区后点击继续。


    ![](img/tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_27b32d38.jpg)


    接下来，你需要选择你的键盘布局。本书大多数读者将使用英语（美国）键盘布局，这是默认设置，但 Linux Mint 支持数百种不同的语言和键盘布局。从列表中选择合适的选项，然后点击继续。


