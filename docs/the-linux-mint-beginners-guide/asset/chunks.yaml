- fmt: '

    After the `cmd` command is complete, you’ll need to transfer the newly created
    `id_dsa.pub` key file to your SSH server at `192.168.1.100`. Once you have moved
    it to your server, copy the file to your user account’s `~/.ssh` directory on
    the server. (If this directory does not already exist, create it with the `mkdir`
    command.) Next, change to the `~/.ssh` directory, and use this command:


    ```bash

    touch authorized_keys

    ```


    This will create a file to store authorized keys in the `~/.ssh` directory. Use
    this command to add your public key to the `authorized_keys` file:


    ```bash

    cat id_dsa.pub >> authorized_keys

    ```


    Finally, use the `chmod` command to make `authorized_keys` read-only to protect
    from accidental deletion:


    ```bash

    chmod 400 authorized_keys

    ```


    Finally, you’ll need to alter your SSH server’s configuration file to mandate
    key-based logins, otherwise the server will continue to allow password-based login.
    Use the `vi` editor to edit SSH’s main configuration file:


    ```bash

    sudo vi /etc/ssh/sshd_config

    ```


    Once editing the file, make sure the `PasswordAuthentication` directive is set
    to `no`. This will force your SSH server to only allow key-based login attempts.
    After you’ve finished editing the file, restart your SSH server with this command:


    ```bash

    sudo service ssh restart

    ```


    Your SSH server will not only permit key-based logons – users must have a private
    key that matches with a corresponding public key in their `~/.ssh/authorized_keys`
    file in their home folder on the SSH server.


    Make sure to back up your private key in a safe place – if you lose it, you will
    lose access to the SSH server.


    ### USING AN SSH CLIENT


    Almost all Linux distributions, including Linux Mint, come with a command-line
    SSH client. Once you successfully connect to an SSH server, it’s as if you were
    sitting front of that machine, using a command line session. You can issue commands,
    move and delete files, and run programs, limited only by your permissions on the
    SSH server.


    Let’s say you want to connect to an SSH server with the IP address of `192.168.1.100`.
    To do so, you would simply use the `ssh` command at the command line to launch
    the SSH client:


    ```bash

    ssh 192.168.1.100

    ```


    The first time you connect to a new SSH server, the client will display the server’s
    RSA fingerprint (`RSA` is a kind of encryption), and will ask if you want to continue
    connecting. Type out “yes” and hit enter (just hitting “y” won’t work). The SSH
    client will then ask for a username and password, and assuming you type those
    correctly, you’ll be in. You can then start using the remote machine as if you
    were sitting in front of it.


    However, you might want to skip a step. With the addition of the `-l` switch,
    you can specify a username with the `ssh` command. In this example, the SSH client
    will attempt to connect using the “camalas” username:


    ```bash

    ssh –l camalas 192.168.1.100

    ```


    You’ll only need to enter the password for camalas’s account to connect.


    By default, the SSH client attempts to connect using Port 22. However, if you
    used the `Port` directive in your SSH server’s `/etc/ssh/sshd_config` file to
    change the default port, your SSH client won’t be able to connect, and will come
    back with an error message. In our example above, we set the SSH server to listen
    on the 5699 port. To tell the SSH client to connect using that port, use the `-p`
    switch:


    ```bash

    ssh –p 5589 192.168.1.100

    ```


    You can also combine that with the `-l` switch as well:


    ```bash

    ssh –p 5589 –l camalas 192.168.1.100

    ```


    This will make the ssh client attempt to create an ssh connection to `192.168.1.100`
    using port 5589 and the camalas user account.


    ### USING SFTP


    SFTP, as mentioned above, is basically the File Transfer Protocol run over an
    SSH connection. Since it uses SSH’s encryption, it’s much more secure than traditional
    FTP. As an added bonus, there’s no need to set up a separate SFTP server – the
    OpenSSH Server package includes a built in SFTP server, which is also governed
    by the `/etc/ssh/sshd_config` file. Like with an FTP server, you need an SFTP
    client – but Linux Mint (and most Linux distributions) include one by default.


    You can access the SFTP client from the command line by simply typing:


    ```bash

    sftp

    ```


    However, it''s far easier to use if you know the IP address of the SSH server
    you want to access. Let''s say you want to access a SSH server with an IP address
    of `192.168.1.100`. To do so, you would append the IP address to the `sftp` client
    command:


    ```bash

    sftp 192.168.1.100

    ```


    The SSH client will then ask for your username. (Note that this will be your username
    and password on the SSH server, not the computer with the SFTP client.) Type it
    and hit enter. The client will ask for your password, which you should then enter.
    Once you do, you''ll be taken to the SFTP prompt, which looks like this:


    ```bash

    sftp>

    ```


    You can also specify a different username as part of the `sftp` command. If, for
    instance, you wanted to use our camalas account to connect to the SSH server at
    `192.168.1.100`, the command would look like this:


    ```bash

    sftp camalas@192.168.1.100

    ```


    If you set up the SSH server to listen on a different port than the default of
    port 22, you’ll need to tell the SFTP client to use a different port with the
    `-P` switch. Note that this is different than the SSH client, which uses the `-p`
    switch – remember that the Linux command line is case-sensitive. To make the SFTP
    client use the 5589 port, the command should look like this:


    ```bash

    sftp –P 5589 192.168.1.100

    ```


    Once at the sftp prompt, you can use some of the common terminal commands. To
    see a listing of the remote directory, you can use the `ls` command:


    ```bash

    ls

    ```


    This will display the contents of the remote directory.


    To find which remote directory you''re actually in, you can use the `pwd` command:


    ```bash

    pwd

    ```


    This command, as you might remember from Chapter 3, stands for "print working
    directory".

