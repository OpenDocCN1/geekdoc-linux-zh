    ## Chapter 7 - Checking Memory and Disk Space Usage


    When it comes to dealing with computers (whether Linux Mint, Windows, or Mac OS
    X systems), there is one infallible rule - there''s never enough memory or disk
    space. Granted, the situation has gotten better than the old days of DOS, when
    you had only 640 kilobytes of memory to use. Personal computers have gotten more
    powerful, and as of this writing you can buy a laptop computer with four gigabytes
    of memory and a three hundred and twenty gigabyte hard drive for about $500 (even
    less if the computer is a desktop). So for the average user, carefully managing
    your personal computer''s memory and disk space isn''t quite as critical as it
    once was.


    However, you''ll still want to keep an eye on memory and disk usage. If your Linux
    Mint system slows down, you''ll want to know why, and examining resource usage
    can give you a clue as to the cause. If your hard drive fills up, you''ll want
    to find which files are taking the most room. And if you are managing a Linux
    Mint Server system with multiple users accessing it simultaneously, you will definitely
    want to keep a close eye on resource usage, lest one user bring the server to
    a crashing halt.


    In this chapter we''ll look at how to monitor Linux Mint''s usage of system resources,
    both with graphical and command line tools.


    SYSTEM MONITOR


    System Monitor is a utility that provides a wealth of real-time information about
    the status of your system. From System Monitor, you can see how much RAM and hard
    drive space your system has free. You can also view graphs charting CPU usage,
    the amount of memory used by the various processes running on your system, and
    the amount of free space on any additional disks (like flash drives or external
    hard drives) attached to your computer.


    To launch System Monitor, click on the Dash and search for it in the search field.
    Click on the program''s icon, and System Manager should launch in short order.


    System Monitor has four tabs, each presenting different information, that we’ll
    look at from left to right.


    “System” is the first tab, and as the name suggests, it presents basic information
    about your system. At the top you’ll see your system’s hostname, followed your
    system’s version of Linux Mint and version of the Linux kernel. You’ll also see
    the total amount of RAM your system has installed, along with the type and speed
    of your CPU. Below that, you’ll see the available disk space on your hard drive
    (if you have multiple hard drives installed, it will show the free space on the
    drive that has your Linux Mint installation).


    “Processes” is the next tab. A “process” is the technical term for any program
    running on your system, whether a background daemon (a program that provides services),
    or any programs that you or any other users launch. The Processes tab has a number
    of columns that provide useful information. The first column, “Process Name”,
    provides the name of the process. The “% CPU” tab shows the amount of the CPU’s
    processing time the process is consuming. The “ID” column shows the process’s
    ID number, which comes in handy if you need to force it to end from the command
    line. The “Memory” column shows the amount of memory the process is using. Finally,
    the Processes tab has an End Process button in the lower-right hand corner, which
    you can use to forcibly shut down unresponsive processes.


    The third tab, “Resources”, provides three real-time graphs. The first graph,
    “CPU History”, shows the amount of CPU time being consumed. If you have a multi-core
    processor (as most computers do nowadays), the graph will represent the different
    CPU cores with different colors. The second graph, “Memory and Swap History”,
    shows the amount of RAM and swap file space being used. (“Swap file” refers to
    virtual memory, a partition on your hard drive that Linux Mint uses as temporary
    RAM if the real RAM fills up.) The final graph, “Network History”, shows the amount
    of incoming and outgoing traffic to your system’s network adapter.


    The final tab “File Systems” shows any file systems – that is, disks – attached
    to your Linux Mint system. This includes hard drives, optical disks (like CDs
    and DVDs), USB external hard drives, and USB flash drivers. The columns show the
    actual device names for the drives (usually something like /dev/sda1), the mount
    point (where the device is mounted in the filesystem), the type of filesystem,
    and the amount of space on the device, both total space and free space.


    System Monitor offers a lot of useful information in one convenient place, but
    it’s a graphical application, which means that it doesn’t work from the command
    line. To check this information from the command line, you’ll need to use the
    top command, which we’ll discuss in the next section.


    THE TOP COMMAND


    The top command has been around forever, and is included in practically every
    variant of Linux. Linux Mint is no exception. The top command displays a variety
    of useful statistics, including the “top” users of CPU time (hence the command’s
    name). To launch top, simply type the command at the command prompt:


    top


    Once launched, top stays running, displaying statistics in real time. Processes
    are listed by their process ID number, along the name of the command that started
    the process. There’s a lot of information listed in top, so let’s take a look
    at the available statistics:


    PID: A process’s process ID number.


    USER: The process’s owner. Processes owned by root are usually system processes,
    and should be left alone unless they cause problems.


    PR: The process’s priority, which determines how much attention the CPU will give
    this process over other processes. The lower the number, the higher the priority.


    NI: The nice value of the process, which affects its priority.


    VIRT: How much virtual memory the process is using.


    RES: How much physical RAM the process is using, measured in kilobytes.


    SHR: How much shared memory the process is using.


    S: The current status of the process (zombied, sleeping, running, uninterruptedly
    sleeping, or traced).


    %CPU: The percentage of the processor time used by the process.


    %MEM: The percentage of physical RAM used by the process.


    TIME+: How much processor time the process has used.


    COMMAND: The name of the command that started the process.


    Of course, you may want to sort the top display by a certain category from least
    to greatest. This is especially useful when you want to figure out what process
    is hogging the most CPU time or memory. Hitting the ‘t’ key will sort the processes
    by CPU time. Hitting ‘l‘ will sort by load average, and ‘m‘ by memory info.


    Like System Monitor, you can also use top to kill uncooperative processes. To
    do this, you’ll need to make note of the process ID you want to kill. Hit the
    “k” key while top is running, and the utility will ask you to input a process
    ID number. Input the number, hit Enter, and then hit Enter again when it asks
    if you want to kill the process (top assumes you mean “yes” when you hit enter).
    The top utility will then kill the process.


    Once you’ve finished with top, hit the q key to exit and return to the command
    line.


    CHECK DISK SPACE USAGE


    The top command can do quite a lot, but there’s one thing that System Monitor
    can do that top can’t – it can show the amount of used disk space. And keeping
    track of the used space on your hard drive is important. Granted, these days computers
    come with enormous hard drives - a capacity of one or even two terabytes in a
    desktop machine is quite common. Of course, the size of popular files has only
    gotten larger (video takes up an enormous amount of space), making it all the
    easier to fill up your hard drive. And filling up your hard drive can cause all
    sorts of unintended problems, especially on a server system.'
