    Now, to continue our previous example, let''s say that you followed all the walkthroughs
    in the previous chapter, which means you have a Linux Mint server running Samba
    with an IP address of 192.168.1.2, hosting a shared folder called "test". You
    created the camalas account, and let''s say you assigned that account a password
    of "ghost". You want to access that file share from a client computer.


    First, query the Samba server to see what shares are available with this command:


    sudo smbclient -L 192.168.1.2


    This will display a list of any shares available on the Samba server. You should
    see the test share available.


    Now let’s say you actually want to connect to the “test” share on 192.168.1.1\.
    First, you’ll need a “mount point”, a place in your client computer''s filesystem
    where it can mount the Samba share as a directory. If you don’t already have a
    mount point, you can make one with this command:


    mkdir ~/mount


    This will generate a directory called mount in your home folder. We’ll use it
    in the next command to mount the Samba share.


    To actually mount the Samba share, use this command:


    sudo mount //192.168.1.2/test ~/mount -o username=camalas,password=ghost


    This will mount the shared directory “test” on 192.168.1.1 in the “mount” folder
    we just created in the client’s home directory.


    To unmount the shared folder, simply use this command:


    sudo umount ~/mount


    This will dismount the file share from your client computer.


    Note that the command is in fact actually spelled “umount”, not “unmount” – accidentally
    typing "unmount" for the **umount** command is a common typographical mistake.


    ACCESSING SHARED FOLDERS FROM A WINDOWS CLIENT'
