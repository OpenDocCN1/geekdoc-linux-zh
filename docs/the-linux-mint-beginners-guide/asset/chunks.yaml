    # ANGBAND


    Those of you who have been playing computer games long enough might remember the
    old Rogue style computer games. The Rogue games originated in 1980 with the original
    Rogue game, written to be played on university `UNIX` computer terminals. In `Rogue`,
    the player took the role of an adventurer descending ever deeper into an elaborate
    dungeon, slaying monsters, avoiding traps, and collecting gold and experience
    (This, of course, remains a staple of computer gaming to this day.) The “Roguelike”
    games descended from the original `Rogue` game, improving on its ideas and execution,
    and many graphical games run off the original principles of `Rogue` to this day.


    Angband is one of the more prominent Roguelike games. Started in 1990, the game
    has been developed ever since then, and remains a classic Roguelike gaming experience,
    though with modern improvements to smooth over some of `Rogue`’s original rough
    edges.


    ## Installing Angband


    Installing Angband is pretty simple. Go to a `Terminal` window and use this command:


    ```bash

    sudo apt-get install angband

    ```


    Follow the default prompts and Angband will be installed. Once Angband is installed,
    you can start the game with this command:


    ```bash

    angband

    ```


    Follow the prompts to create your character and soon you’ll soon be playing. Watch
    out for the goblins!


    # DOSBOX


    It is indeed a remarkable irony that it’s often no longer possible to play old
    DOS games on Windows 10, but with proper software, you can play the same old games
    on Linux Mint. All you need is `DOSBox`, an emulation environment that lets you
    run old DOS games. As an added bonus, `DOSBox` is quite easy to install. Simply
    go to a `Terminal` window and type this command:


    ```bash

    sudo apt-get install dosbox

    ```


    Follow the default prompts, and `DOSBox` will install itself and a few other necessary
    packages on your Linux Mint system. After `DOSBox` is installed, you can launch
    it by going to the mintmenu and searching for "DOSBox" in the search field. Or
    you can launch it from the command line:


    ```bash

    dosbox

    ```


    Now, since `DOSBox` relies on the old DOS system of drive letters, and Linux Mint
    does not, you may be wondering how to mount your drives. Fortunately, this is
    quite simple. Let’s say you create a directory named `dos` in your home directory
    to serve as the `C:` drive during your DOS session. To mount as a `C:` drive,
    use this command while in `DOSBox`:


    ```bash

    mount c ~/dos

    ```


    To mount your optical drive as a `D:` drive, use this command:


    ```bash

    mount d -t cdrom /media/cdrom

    ```


    Using these commands, you should be able to play a good many old DOS games on
    your Linux Mint system.


    # STEAM


    Valve made its popular `Steam` platform available for Linux Mint. Using the `Steam`
    client, you can play a number of popular games quite easily on your Linux Mint
    system (assuming your computer’s hardware meets the system requirements for the
    various games). Installing the `Steam` client on Linux Mint is an easy and streamlined
    process, and we’ll show you how to do it.


    ## Installing Steam


    First, visit the Steam site and download the client:


    `http://store.steampowered.com`


    Click on the `Install Steam` button at the top of the page, and then the `Install
    Steam Now` button. This will download a `.deb` installer file to your `Downloads`
    folder. After the download has completed, navigate to your `Downloads` folder,
    and double-click on the installer to launch it.


    After a moment the install will take you to the Linux Mint Software application
    and show you some information about `Steam`. Click on the `Install` button, and
    the Linux Mint Software application will ask for your password. Enter your password,
    and Linux Mint Software will install the client.


    After the installation is complete, you can launch the `Steam` client by going
    to the mintmenu and searching for “Steam”. When the client launches for the first
    time, it will likely downloaded several hundred megabytes worth of updates.


    Once the download is finished, you can log into the client and peruse your library
    of `Steam` games.

    # GOG.COM


    One of the best developments for Linux gaming in the past ten years has been the
    rise of `GOG.com`. The site began as `Good Old Games` in 2008, devoted to acquiring
    the rights to legally sell "abandonware" games, old DOS games that had been abandoned
    by their publishers for whatever reason.


    `GOG.com` 2008, originally `Good Old Games`, improved to `GOG.com` in 2010. `GOG.com`
    currently offers numerous older DOS games now repackaged to run smoothly on Linux
    Mint. In this example, we will show you how to install `Darklands`, a classic
    Microprose RPG from 1992. The installation for `Darklands` is pretty typical,
    and you can use this example to install other older `GOG.com` games on Linux Mint.


    ## Installing Darklands


    First, log into your `GOG.com` account and download the Linux Mint installer for
    the game you wish to play. The installer will download as a shell script, which
    you will need to first mark as executable. To mark the shell script for `Darklands`
    as executable, launch the `Terminal` by hitting the `CTRL+ALT+T` keys simultaneously,
    and then enter this command:


    ```bash

    chmod +x ~/Downloads/gog_darklands_2.0.0.7.sh

    ```


    Then execute the shell script with this command:


    ```bash

    ~/Downloads/gog_darklands_2.0.0.7.sh

    ```


    This will launch the `GOG.com` installer for `Darklands`. Accept the EULA, and
    then select the destination folder for the installation. The default destinations
    are usually acceptable, unless you have a specific reason for installing the game
    elsewhere. The installer will then ask if you want to create a desktop shortcut
    and a menu item (this will allow you to find the game to launch it through the
    mintmenu). Make sure to select both, as it will make it easier to launch the game
    after the installer has finished.


    Once the installation as finished, you can launch the game by going to the mintmenu,
    searching for "Darklands", and then double-clicking on the icon for `Darklands`.
    Linux Mint will then launch `DOSBox` and load `Darklands` preconfigured for you.


    Note that the game will load full-screen – you can switch to the windowed mode
    by hitting the `ALT` and the `ENTER` keys simultaneously.


    This procedure will let you install most of `GOG.com`s Linux Mint-compatible classic
    games.


    `GOG.com` also has a number of newer games that run natively on Linux Mint. Be
    sure to check the system requirements, since they will display a list of any software
    packages you might need to run the game. You can usually install these packages
    from the `Terminal` with the `apt-get` command.


    # Chapter 18 - Run Windows Software with Wine


    I’ve helped many people try Linux Mint after switching from Windows, and they
    all inevitably have the same question.


    “Hey, Linux Mint is great! But how can I install my favorite Windows application
    on it?”


    On the surface, it seems like the obvious answer would be no. Windows software
    is written for the Windows platform, and Linux Mint software is written for the
    Linux platform, and never the two shall meet. If you want to use your favorite
    Windows application with Linux Mint, you need to either find a Linux version,
    or find another application that performs the task you want to do.


    However, there’s a way around that.


    That way is a software application called `Wine`, an acronym that means “Wine
    Is Not An Emulator.” It’s actually a compatibility layer that lets you, in theory,
    run Windows applications on a Linux system. Not all applications work, some work
    better than others, and some require considerable tweaking before they will work.
    However, if you’re willing to do the research, you can get your Windows application
    working on Linux Mint.

