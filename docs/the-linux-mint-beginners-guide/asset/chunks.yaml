    ## Chapter 15 - Installing Web Applications (WordPress, MediaWiki, Moodle)


    Hosting web applications is where Linux really shines. As we mentioned in Chapter
    11, Apache servers running on Linux or UNIX-like systems comprise around a third
    or so of the Internet. Linux Mint can run a variety of web applications, ranging
    from simple interactive sites to powerful content management systems. A “content
