- fmt: '

    You should get the "Query OK" message again. Once the new user is created, we''ll
    need to set a password for the user before we can assign any permissions. In this
    example, we''ll assign a password of "1234". However, in real life, just as with
    the root user, you''ll want to assign a strong password. (This database user won''t
    have full control over the MySQL server as the root user does, but we will give
    it full control over the database we just created, and a malicious user who guesses
    the password could cause all kinds of trouble.) To create the password, use this
    command:


    ```

    SET PASSWORD FOR newdatabaseuser= PASSWORD(“1234”);

    ```


    Again you should get the "Query OK" confirmation message. The final step is to
    assign all privileges on the "newdatabase" database to the "newdatabaseuser" user.
    Use this command to assign the permissions:


    ```

    GRANT ALL PRIVILEGES ON newdatabase.* TO newdatabaseuser IDENTIFIED BY ‘1234;

    ```


    That isn''t a typo - those are single quote marks ('''') instead of the usual
    double quote marks (") that were used in the command to set the password. MySQL''s
    internal syntax, alas, isn''t always consistent. Anyway, if you typed the command
    correctly, you should get the "Query OK" confirmation again.


    Once you are done, use this command to quit the MySQL command-line interface:


    ```

    exit

    ```


    You''ve now set up a database, created a database user, and given that user full
    control over that database.


    ## BACK UP AND RESTORE MYSQL DATABASES


    MySQL databases are often used to power web applications such as WordPress or
    Moodle, which means that those MySQL databases often wind up holding vital information.
    Therefore, it is important to back them up on a regular basis. A quick and easy
    way to backup a MySQL database is with the `mysqldump` command-line tool. This
    tool downloads the database into a single SQL file, which you can store as a backup
    or use to transfer the database to another MySQL server.


    To use `mysqldump`, you will need to know the root password of the MySQL server
    (or a user with permissions to the database you need to download).


    In this example, we will dump a database named `data` into a file named `data.sql`:


    ```

    mysqldump -u root -p data > data.sql

    ```


    Enter the root password, and `mysqldump` will dump the database information into
    the `data.sql` file.


    To transfer the database to a new server, first create a blank database on the
    server from the MySQL command prompt. In this example, this command will create
    a new database named `datanew`:


    ```

    CREATE DATABASE datanew;

    ```


    Then transfer the `data.sql` file to the new server and write it onto the new
    database with this command:


    ```

    mysql -u root -p datanew < data.sql

    ```


    The `datanew` database will receive all the tables and columns contained in the
    `data.sql` file. Note that this command completely overwrites the target database
    with the information in the SQL file, so make sure to select the correct database!


    ## INSTALLING PHPMYADMIN


    It is possible to administer MySQL Server entirely from its command line client.


    But if you read through the previous section, you probably noticed that the MySQL
    command-line client is a lot of work, and rather cumbersome to boot. Remembering
    the syntax is something of a challenge, and occasionally even veteran database
    administrators have a hard time working through complex SQL statements. I am a
    big believer in doing as much as possible from the command line, but sometimes
    the GUI is in fact quicker and easier. MySQL administration is often one of those
    cases.


    Fortunately, MySQL has a GUI available, a program called `phpMyAdmin`. It''s a
    web interface, which means that you connect to it via a web browser from another
    computer. It runs off the PHP scripting language (which we''ll discuss more in
    the next chapter), and lets you quickly and efficiently make changes to your MySQL
    Server. It even lets you enter command-line SQL statements, if you prefer.


    Obviously, you will need MySQL Server installed before you can install phpMyAdmin.
    Once you have MySQL installed, you’re ready to begin.


    To install phpMyAdmin, go to a Terminal window or command prompt and type this
    command:


    ```

    sudo apt-get install phpmyadmin

    ```


    This will download and install phpMyAdmin on your Linux Mint system. The phpMyAdmin
    package comes with quite a lot of dependencies, so the downloading and installation
    might take some time.


    Once the package starts installing, it will ask you whether or not you want to
    use Apache or lighttpd for phpMyAdmin’s web server. Generally, unless you have
    a good reason to do otherwise, I’d recommend that you use Apache. (You can use
    the tab key to move the cursor while within the dialog box, if you get stuck.)


    Next, the installer will ask if it can create and configure a database for phpMyAdmin
    using the `dbconfig-common` script. If you’re a first-time user, and don’t have
    advanced configuration needs, then use the tab key to select Yes and hit enter.
    The script will ask you for the password of your MySQL server’s root user. Enter
    the password, and the installer will continue.


    The installer will then ask for a password for phpMyAdmin’s database user. Select
    a password for the database user. Remember, as always, to set a strong password,
    with a mixture of uppercase letters, lowercase letters, numerals, and punctuation.
    You''ll then need to enter the password again.


    After that, the installer will wrap up and return you to the command line. If
    you installed it locally, you can then access your new phpMyAdmin installation
    by opening up a web browser on your Linux Mint system and navigating to this address:


    http://127.0.0.1/phpmyadmin


    Enter your MySQL root user and password, and you’ll have access to phpMyAdmin.


    You can also access phpMyAdmin from a remote computer. For instance, if you installed
    phpMyAdmin on the machine with the IP address of 192.168.1.100, you would access
    it with this address:


    http://192.168.1.100/phpmyadmin


