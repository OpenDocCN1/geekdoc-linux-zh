- fmt: '

    The `top` command has been around forever, and is included in practically every
    variant of Linux. Linux Mint is no exception. The `top` command displays a variety
    of useful statistics, including the “top” users of CPU time (hence the command’s
    name). To launch `top`, simply type the command at the command prompt:


    ```

    top

    ```


    Once launched, `top` stays running, displaying statistics in real time. Processes
    are listed by their process ID number, along the name of the command that started
    the process. There’s a lot of information listed in `top`, so let’s take a look
    at the available statistics:


    - `PID`: A process’s process ID number.

    - `USER`: The process’s owner. Processes owned by `root` are usually system processes,
    and should be left alone unless they cause problems.

    - `PR`: The process’s priority, which determines how much attention the CPU will
    give this process over other processes. The lower the number, the higher the priority.

    - `NI`: The nice value of the process, which affects its priority.

    - `VIRT`: How much virtual memory the process is using.

    - `RES`: How much physical RAM the process is using, measured in kilobytes.

    - `SHR`: How much shared memory the process is using.

    - `S`: The current status of the process (zombied, sleeping, running, uninterruptedly
    sleeping, or traced).

    - `%CPU`: The percentage of the processor time used by the process.

    - `%MEM`: The percentage of physical RAM used by the process.

    - `TIME+`: How much processor time the process has used.

    - `COMMAND`: The name of the command that started the process.


    Of course, you may want to sort the top display by a certain category from least
    to greatest. This is especially useful when you want to figure out what process
    is hogging the most CPU time or memory. Hitting the ‘t’ key will sort the processes
    by CPU time. Hitting ‘l‘ will sort by load average, and ‘m‘ by memory info.


    Like System Monitor, you can also use `top` to kill uncooperative processes. To
    do this, you’ll need to make note of the process ID you want to kill. Hit the
    “k” key while `top` is running, and the utility will ask you to input a process
    ID number. Input the number, hit Enter, and then hit Enter again when it asks
    if you want to kill the process (`top` assumes you mean “yes” when you hit enter).
    The `top` utility will then kill the process.


    Once you’ve finished with `top`, hit the q key to exit and return to the command
    line.


    ## CHECK DISK SPACE USAGE


    The `top` command can do quite a lot, but there’s one thing System Monitor can
    do that `top` can’t – it can show the amount of used disk space. And keeping track
    of the used space on your hard drive is important. Granted, these days computers
    come with enormous hard drives - a capacity of one or even two terabytes in a
    desktop machine is quite common. Of course, the size of popular files has only
    gotten larger (video takes up an enormous amount of space), making it all the
    easier to fill up your hard drive. And filling up your hard drive can cause all
    sorts of unintended problems, especially on a server system.


    Fortunately, there are several commands you can use to track disk space usage
    from the command line in Linux Mint.


    The first command is `df`, which produces an output like this:


    ```

    /dev/sda1 31621016 3364900 26649820 12% /

    ```


    You''ll notice like the Filesystems tab in System Monitor, the `df` command lists
    all the filesystems on your computer. The first number is the total size of the
    drive. The second is the used space. The third is the available space, and the
    final number is the percentage of space used. However, the numbers are in 1 kilobyte
    blocks, which makes the difficult to read without mental mathematics. To make
    the output more readable, use `df` with the `-h` option:


    ```

    /dev/sda1 31G 3.3G 26G 12% /

    ```


    You''ll notice that the sizes are now in gigabytes (or megabytes, depending on
    the size of the filesystem), which is much more readable.


    You might also need to check the size of an individual folder, since the `ls`
    command, even with the `-l` option doesn''t bother to list the size of folders.
    (Technically, directories in Linux are also files, so the `ls -l` command only
    lists the size of the file representing the directory without any of the directory''s
    contents.) To find the size of a folder from the command line, use the `du` command
    with the `-s` and `-h` options:


    ```

    du -sh ~

    ```


    The command will list the size of the targeted folder in megabytes or gigabytes,
    as appropriate.


    ## CHECK MEMORY USAGE


    The `top` command does a pretty good job of seeing which processes are using the
    most memory. It does not, however, give an overview of your system''s entire memory.
    To do so, you need to use the `free` command, which generates an output like this:


    ```

    Mem: 1025700 340708 684992 0 38904 156368

    ```


    The first three numbers are the most important - they list the total amount of
    RAM, the amount used, and the amount currently free. The RAM is listed in bytes
    which, unless you''re really good at mental math, makes it rather hard to read.
    Fortunately, you can use the `-m` option with `free` to display the totals in
    megabytes instead of bytes, generating an output like this:


    ```

    Mem: 1001 501 500 0 64 277

    ```


    The numbers are roughly the same as before, but they''re expressed in megabytes
    now, not bytes, which usually makes for easier reading. You can also use the `-k`
    and `-g` switches to express the values in kilobytes and megabytes, if you prefer.


    ***


    ## Chapter 6 - Installing Software


    For people used to the Microsoft Windows system, it can be to difficult to figure
    out how to install software on a Linux Mint system. Usually, on a Windows machine,
    you download the installer file from the website, double-click on it, and follow
    the steps suggested by the install wizard. Or you insert the CD or DVD into your
    optical drive and follow the AutoPlay prompt, or navigate to the DVD''s root menu
    through Windows Explorer and double-click on the `SETUP.EXE` file. One of the
    strengths of the Microsoft Windows is the relative ease of installing software
    on a Windows computer, and the enormous library of software available for Windows.
    (In fact, the ease of installing software on Windows can be a weakness - consider
    how easy it is to catch malware on a Windows box.) Unfortunately, this vast library
    of software (usually) will not work on Linux Mint. (Unless you have Wine, which
    we''ll discuss in Chapter 15.)

