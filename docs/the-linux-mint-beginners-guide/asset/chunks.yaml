    幸运的是，你有几个命令可以在 Linux Mint 命令行中跟踪磁盘空间使用情况。


    第一个命令是 `df`，它产生的输出如下所示：


    ```

    /dev/sda1 31621016 3364900 26649820 12% /

    ```


    你会发现，就像系统监器中的“文件系统”选项卡一样，`df` 命令列出了计算机上所有的文件系统。第一个数字是驱动器的总大小。第二个是已用空间。第三是可用空间，最后一个数字是空间使用百分比。然而，这些数字是以千字节（KB）块为单位的，这使得如果不进行心算就很难阅读。为了让输出更具读性，请使用带有
    `-h` 选项的 `df`：


    ```

    /dev/sda1 31G 3.3G 26G 12% /

    ```


    你会现在的尺寸是以吉字节（GB）或兆字节（MB，取决于文件系统的大小）为单位，这可读得多。


    你可能还需要检查单个文件夹的大小，因为 `ls` 命令即使带有 `-l` 选项，也不会去列出文件夹的大小。（从技术上讲，Linux 中的目录也是文件，因此
    `ls -l` 命令仅列出代表目录的文件的大小，而不包含目录的任何内容。）要从命令行查找文件夹的大小，请使用带有 `-s` 和 `-h` 选项的 `du`
    命令：


    ```

    du -sh ~

    ```


    该命令将根据情况以兆字节或吉字节列出目标文件夹的大小。


    # 检查内存使用


    `top` 命令在查看哪些进程占用最多内存方面做得相当不错。然而，它并没有提供系统整个内存的概览。要做到这一点，你需要使用 `free` 命令，它产生的输出如下：


    ```

    Mem: 1025700 340708 684992 0 38904 156368

    ```


    前三个数字是最重要的——它们列出了 RAM 的总量、已用量和当前空闲量。RAM 是以字节（bytes）列出的，除非你非常擅长心算，否则这很难阅读。幸运的是，你可以使用
    `free` 的 `-m` 选项以兆字节而不是字节显示总量，产生如下所示输出：


    ```

    Mem: 1001 501 500 0 64 277

    ```


    这些数字与之前大致相同，但现在是以兆字节而不是字节表示，这通常会让阅读更容易。如果你愿意，也可以使用 `-k` 和 `-g` 切换开关将值以千字节和吉字节表示。


    ***


    ## 第 8 章 - 使用 vi 编辑文本文件


    在过去的几个章节中，我们涵盖了 Linux Mint 的基础——命令行、文件权限、用户和组以及系统资源管理。现在我们准备好进入更高级的主题了，例如如何为各种服务器角色配置
    Linux Mint。Linux Mint 可以被配置为执行几乎任何服务器任务，提供一个极低成本的强大服务器平台。


    然而，首先，我们必须谈论配置文件以及如何编辑它们。


    Microsoft Windows 平台上的配置文件几乎总是 `*.ini` 文件、十六进制文件，或者你无法通过特殊程序进行更改的二进制文件。相比之下，Linux
    上的配置文件通常是简单的文本文件，你可以使用任何文本编辑器程序进行修改。Linux Mint 自带了一个图形化文本编辑器 `gedit` 程序，它可以让你在编辑文本的同时提供一个带有复制、粘贴等功能的完整
    GUI 菜单。


    然而，`gedit` 无法从命令行工作，而且它在不包含 GUI 的 Linux Mint 服务器版中绝对无法工作。因此，如果你想将 Linux Mint 配置为服务器，学习命令行编辑器是至关重要的。


    Linux Mint 有许多可用的命令行编辑器——`nano`、Richard Stallman 的 `Emacs`、`vi` 以及其他。我认为 `vi`
    是最容易使用的，因此本章将重点介绍如何使用 `vi` 编辑器。诚然，对于使用哪种最佳编辑器意见可以且确实存在——关于 Emacs 和 `vi` 相对优点的争论已经持续了数十年。


    # 什么是 VI？


    `vi` 编辑器已经存在很久了。它起源于 20 世纪 60、70 年代的系列 UNIX 文本编辑器，第一个版本由程序员 Bill Joy 在 20 世纪 70
    年代后期开发。之后，`vi` 因内存占用小而受到赞誉，这意味着它可以用于可用内存少的系统。


    Linux Mint 包含的 `vi` 变体实际上是 `vim`，它是 "vi Improved（改进版 vi）" 的缩写。`vim` 由一个名为 Bram
    Moolenaar 的程序员在 20 世纪 90 年代初开发。今天，`vim` 通常是最流行的 `vi` 变体，并包含在大多数 Linux 发行版中。


    然而，`vi` 命令仍然符号链接到 `vim`，因此在 Linux Mint 的命令行中输入 `vi` 将启动 `vim`。


    # 启动 VI


    启动 `vi` 只需要输入命令即可：


    这将带你进入一个空文件，你可以从这里创建文本文件。


    然而，你经常会使用 `vi` 来查看或编辑现有文本文件。如果你想使用 `vi` 打开并编辑名为 `test.txt` 的文件：


    ```

    vi test.txt

    ```


    `vi` 编辑器将打开打开 `test.txt` 文件。


    你也可以使用 `vi` 创建新文件。例如，如果你想使用 `vi` 创建名为 `newfile.txt` 的文件：


    ```

    vi newfile.txt

    ```


    然而，请注意，在写入磁盘之前该文件并不存在。我们将在下一节讨论如何写入磁盘。


    # VI 模式


    Vi 不像文字处理器，你不能直接坐下来就开始打字。Vi 有不同的模式，每种模式都有不同的功能。如果你把 vi 比作一把瑞士军刀，那么模式就是不同的刀刃。


    Vi 有四种模式：


    - 普通模式（Normal mode）。Vi 默认进入此模式，你可以在这里删除文本。

    - 命令模式（Command mode）。它可以让你保存文本。

    - 插入模式（Insert mode）。它可以让你在文件中输入文本。

    - 替换模式（Replace mode）。它与插入模式类似，但你可以覆盖文本，这在插入模式中是无法实现的。


    让我们仔细查看每个模式。


    ## 普通模式


    Vi 默认进入普通模式。普通模式允许通过方向键以及 Page Up 和 Page Down 键在文本文件中导航。按 HOME 键带你回到文件开头，按 END
    键回到文件末尾。你还可以使用普通模式删除文件中的文本，从单个字符到整行。普通模式还提供了搜索功能，允许你快速在文件中定位特定术语。


    首先让我们看看普通模式下删除文本的命令。


    - 按 `dw` 删除光标后的后的单词。该命令还会删除单词后的空格。

    - 按 `de` 也删除光标后的单词。与 `dw` 不同，它不会删除单词后的空格。

    - 按 `d$` 删除光标到当前行末尾的内容。

    - 按 `dd` 删除整行。

    - 按 `p` 在当前光标位置后插入上次删除的文本。基本上，结合删除命令，这让你可以在 vi 中进行剪切和粘贴。

    - 按 `u` 撤销上一次操作。相信我，如果你用 vi 编辑文本文件时犯了错误，这绝对非常用。

    - 按 `CTRL-G` 在屏幕底部显示状态栏。状态栏将显示文件名、自上次保存以来是否已修改、光标当前所在的行和列，以及你处于文件的百分比位置。

    - 按 `/`（正斜杠）激活搜索功能。输入搜索术语并按回车，vi 将带你进入搜索术语的第一个实例。你可以按 N 键跳转到该术语的下一个实例。

