    你可能听过“数据库”这个词，但可能并不清楚它的具体含义。简单来说，数据库是任何设计用于创建、存储、检索和管理大量数字信息的系统。有许多不同类型的数据库，但最常见的类型是“关系型数据库”，它使用多个数据表（每个表都有许多行和列）来存储必要的数据。大多数现代数据库在技术上都是
    RDBMS，即“关系型数据库管理系统”，这是对使用关系型模型的数据库（以及任何相关软件）的描述方式。


    目前最流行、使用最广泛的开源 RDBMS 是一个名为 `MySQL` 的程序。两位名为 Michael Widenius 和 David Axmark 的计算机程序员于
    1994 年开始开发 `MySQL`，该软件最终被 Sun 公司（Sun Corporation）收购，随后在 2010 年当 Oracle 公司（Oracle
    Corporation）收购 Sun 后被收购。“MySQL”这个名字来源于两个来源。“My”部分显然来自 Michael Widenius 的女儿，她的名叫
    My。“SQL”则来自“结构化查询语言”（Structured Query Language），这是一种用于处理 RDBMS 中插入、检索、管理和删除数据任务的计算机语言。


    `MySQL` 已经存在很长时间，它被许多网站使用——Google、Facebook 和 Wikipedia 都在使用 `MySQL`，许多流行的内容管理系统（如
    WordPress 和 Drupal）也依赖 `MySQL` 来存储数据。


    `MySQL` 在 Linux Mint 系统上的安装非常简单。在本章中，我们将向你如何安装和配置 `MySQL`，如何从 `MySQL` 命令行创建数据库和数据库用户，以及如何安装
    phpMyAdmin 以通过更简单的图形化界面配置 `MySQL`。


    ## 安装 MYSQL 服务器


    要在 Linux Mint 上安装 MySQL 服务器，请打开终端窗口或命令提示符，输入以下命令：


    ```

    sudo apt-get install mysql-server-5.7

    ```


    （截至本文，Linux Mint 仓库中提供的最新版本是 MySQL 服务器 5.7，但未来的 Linux Mint 版本可能会收到更高版本的 MySQL。）


    输入密码验证，`apt` 将下载并安装 MySQL 文件。这是一组非常大的文件，因此取决于你的互联网连接速度，下载可能需要一段时间。在文件下载并开始安装后，安装程序会要求你输入
    `MySQL` root 用户的密码。就像 Linux 中的 root 用户对系统具有完全控制权一样，`MySQL` 中的 root 用户对所有数据库、表、权限和用户具有绝对控制权。出于显而易见的考虑，你需要为
    `MySQL` root 用户创建一个极其强大的密码（大写字母、小写字母、数字和符号的混合体，越长越好）。


    （注意，在密码对话框中，如果你无法选中 `<OK>` 字段，可以使用 tab 键从文本输入行跳转到 `<OK>` 字段。）


    输入 root 密码后，安装程序将完成 MySQL 文件的处理并返回命令行。


    接下来，你希望运行 `mysql_secure_installation` 脚本来固化你新 `MySQL` 服务器的安全性。在提示符中运行此命令：


    ```

    sudo mysql_secure_installation

    ```


    首先，`mysql_secure_installation` 脚本会要求你输入 MySQL root 用户的密码。之后，它会问你是否更改 root 密码。由于你已经设置了
    root 密码，你可以按“n”（除非出于某些你想再次更改）。


    接下来，脚本会要求你设置 `VALIDATE PASSWORD` 插件，该插件会检查密码强度是否合适。按 Y 接受，然后按 0（低）、1（中）或 2（强）来设置密码强度级别。


    接下来，脚本会问你是否要删除匿名用户。匿名用户就像 FTP 中的匿名访问，允许某人在没有相应用户账户的情况下登录 `MySQL`。出于安全考虑，删除匿名用户总是最好的，因此按“y”继续。


    之后，脚本会问你是否要防止 MySQL root 用户远程登录 MySQL 服务器。请始终按“y”禁止 root 远程访问，因为如果攻击者猜中了你的 root
    密码，他就可以破坏你的数据库或窃取其中包含的信息。


    之后，脚本会问你是否要删除测试数据库。`MySQL` 包含一个任何人都可以访问的测试数据库。同样，这是一个安全漏洞，因此你应该按“y”删除测试数据库。


    脚本随后会要求重新加载权限表以使更改生效。按“y”，`mysql_secure_installation` 脚本将结束并返回命令行。


    `MySQL` 服务器现在已安装在你的 Linux Mint 系统上。在下一节中，我们将讨论使用 `MySQL` 命令行客户端创建数据库和用户。


    ## 使用 MYSQL 命令行客户端


    `MySQL` 在 Linux Mint 系统上最常见的用途是为某种类型的动态网站提供后端，通常是像 WordPress 或 MediaWiki 这样的内容管理系统。要在
    Linux Mint 机器上托管这些网站，你需要为网站创建一个数据库和一个数据库用户。`MySQL` 服务器可以支持许多不同的数据库，受限于机器上可用硬件和磁盘空间容量。（同时托管多个活动数据库对硬盘有很高要求。）


    与 Samba 一样，`MySQL` 拥有自己的一套账户，与主系统账户分离，称为“数据库用户”。数据库用户是指访问特定数据库或数据库中特定表的 MySQL
    用户。在本节中，我们将向你介绍如何通过命令行创建数据库和用户。


    首先，你需要进入 MySQL 客户端。MySQL 就像 FTP 和 SFTP 的命令行客户端一样有自己的提示符。要访问该提示符并启动客户端，请使用命令：


    ```

    mysql

    ```


    然而，如果你只输入该命令，它会返回错误信息。使用 MySQL 客户端你需要添加 `-u` 和 `-p` 参数。`-u` 参数告诉它你要使用哪个 MySQL
    用户（类似于 SSH 中的 `-l` 参数）。`-p` 参数告诉它提示密码。因此，要以 root 用户身份使用 MySQL 客户端，命令如下：


    ```

    mysql -u root -p

    ```


    输入 MySQL root 用户的密码，你将看到 MySQL 提示符，如下所示：


    ```

    mysql>

    ```


    我们接下来的步骤是创建数据库、创建访问该数据库的用户，并授予新用户该数据库的所有权限。通常，当你安装 WordPress 这样的 Web 应用时，你会为 WordPress
    创建的数据库用户授予 WordPress 数据库的所有权限，以便其正常运行。未授予应用程序用户数据库的所有权限会导致应用程序运行异常甚至完全失败。


    在继续之前有一个重要的说明。从 MySQL 提示符执行的所有命令都必须以分号结尾，表示语句的结束。任何不以分号结尾的命令都无法工作。在此基础上，让我们先创建一个数据库。


    在 `mysql>` 提示符输入以下命令创建数据库：


    ```

    CREATE DATABASE newdatabase;

    ```


    MySQL 客户端将返回一条消息：“Query OK, 1 row affect (0.00 sec)。”这意味着命令执行成功，已创建一个名为 `newdatabase`
    的新数据库。


    接下来，你创建一个访问该数据库的用户：


    ```

    CREATE USER newdatabaseruser;

    ```

