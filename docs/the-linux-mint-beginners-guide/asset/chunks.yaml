    \ command line. In fact, it's rather less cumbersome than doing it through the\
    \ GUI.\n\nBefore you delete a user account, you might first consider locking it\
    \ with the **usermod** command. Locking an account disables its password, which\
    \ means the account can no longer log into the system. For example, to lock the\
    \ camalas account:\n\nsudo usermod -L camalas\n\n(Note that options, like commands\
    \ and filenames, are case sensitive, and the -L option must be capitalized.)\n\
    \nIf you want to get rid of an account entirely, use the **userdel** command with\
