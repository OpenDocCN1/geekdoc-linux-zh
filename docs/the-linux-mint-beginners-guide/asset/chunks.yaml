    ***


    ## Chapter 6 - Installing Software


    For people used to the Microsoft Windows system, it can be to difficult to figure
    out how to install software on a Linux Mint system. Usually, on a Windows machine,
    you download the installer file from the website, double-click on it, and follow
    the steps suggested by the install wizard. Or you insert the CD or DVD into your
    optical drive and follow the AutoPlay prompt, or navigate to the DVD''s root menu
    through Windows Explorer and double-click on the SETUP.EXE file. One of the strengths
    of the Microsoft Windows is the relative ease of installing software on a Windows
    computer, and the enormous library of software available for Windows. (In fact,
    the ease of installing software on Windows can be a weakness - consider how easy
    it is to catch malware on a Windows box.) Unfortunately, this vast library of
    software (usually) will not work on Linux Mint. (Unless you have Wine, which we''ll
    discuss in Chapter 15.)


    Fortunately, Linux Mint is a Linux distribution. While it may not have access
    to the Windows software ecosystem, it nonetheless has access to the vast library
    of Linux applications and utilities. And as an added bonus, many of these applications
    are free - both free to use and free to alter and distribute without legal encumbrance.


    There are four basic ways to install software programs on your Linux Mint system:
    the Software Manager, Synaptic Package Manager, .deb installer files, and the
    command line. All of them are fairly easy to use. Server-level applications usually
    take some more work, but installing end-user applications is straightforward.
    Our focus in this book is on the command line, but we''ll also go through the
    graphical ways of installing applications.


    Note that you''ll need an admin account on your Linux Mint system to install software
    - the default account you create during installation counts as an admin account.


    REPOSITORIES


    However, before we start, you''ll need to understand the concept of a software
    repository. Basically, a software repository is a server on the Internet where
    the installer packages for software programs are stored. ("Packages" are software
    installers that are pre-compiled to work with a particular operating system, usually
    specific versions of Linux.) Client computers can then access those repositories,
    download the packages, and install the programs. This more efficient than, say,
    distributing software via CD or DVD, or by downloading the installer from a web
    server.'
