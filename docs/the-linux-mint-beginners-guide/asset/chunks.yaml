    （如果你直接读完接下来的几个章节，你会注意到我会重复很多我们已经讨论过的指令。这出于两个原因。首先是 WordPress、`MediaWiki` 和 `Moodle`
    都使用了许多相同的软件组件。其次，我希望每个 Web 应用程序都拥有一套完整的指令，这样我就不需要说“接下来，按照我们在第 11 章中讨论的那样安装 Apache”，这意味着你不需要来回反复地滚动页面查看。我个人非常讨厌技术写作人员这样做，所以我在这里不会那样做。此外，这是一本电子书，所以重复某些指令并不会因此推高打印成本。）


    # 在 Linux Mint 上安装 WordPress


    WordPress 最初开发于 2003 年，是一种可以运行各种类型网站的内容管理系统。在 WordPress 早期，它倾向于只运行个人博客和较小的网站。然而，该软件在每个版本的更新中都得到了显著的改进，它现在已经具有足够的适应性，可以用于各种不同的网站。WordPress
    的突破性进展出现在 2009 年，当时流行的博客平台 `Movable Type` 对其许可条款进行了不受欢迎的更改。有足够的 Movable Type 用户对这一更改感到不满并迁移到了
    WordPress，截至本文编写时，WordPress 已经是互联网上主流的开源内容管理系统。


    在运行桌面版或服务器版 Linux Mint 的机器上安装 WordPress 是完全可能的。这为测试和实验提供了极佳的环境，因为你可以随心所欲地调整和实验，而不会导致生产博客无法运行。如果你需要运行某种内部企业博客，在
    Linux Mint 机器或虚拟机上托管 WordPress 是比昂贵的博客或协作软件更廉价的解决方案。或者，如果你真的很有抱负（而且你负担得起带宽），你可以从自己的公寓托管一个可以通过互联网访问的
    WordPress 博客。


    让我们开始吧！


    （注意，Linux Mint 仓库现在包含了全自动的 WordPress 安装程序。然而，我相信自己手动安装它具有重要价值——你不仅将学习如何设置 LAMP
    服务器，而且一步步安装的过程会让你在以后某处出现故障时，获得宝贵的故障排除知识。）


    首先，将 Linux Mint 安装到你选择的机器上。一旦 Linux Mint 安装并更新，你将需要安装五件软件：Apache Web 服务器、MySQL
    数据库服务器 `5.7` 版本、PHP `7` 版本、PHP 的 MySQL 模块，最后是 WordPress 软件本身。


    ## 安装 Apache Web 服务器


    首先，安装 Apache Web 服务器。要安装 Apache，进入终端窗口或命令提示符并输入此命令：


    ```bash

    sudo apt-get install apache2

    ```


    （从技术上讲，你安装的是 Apache 2，即最新版本。）


    输入密码进行身份验证，按照默认提示，`apt` 将为你下载并安装 Apache Web 服务器。


    这就结束了！Apache 现在应该可以工作了。要从 Web 服务器本身进行测试，请打开 浏览器并访问地址 `http://127.0.0.1`。你会记得这是“本地回环”地址，基本上是计算机用于指代自身的地址。或者，你也可以从同一子网的另一台计算机上进行测试。例如，如果你将
    Apache 安装在 IP 地址为 `192.168.1.100` 的计算机上，你可以通过访问同一子网的另一台计算机并在 浏览器中输入 `http://192.168.100`
    来进行测试。


    无论如何，只要 Apache 工作正常，你就应该看到默认的 Apache/Linux Mint 网页，左上角带有 Linux Mint 的标志。


    Apache 现在已运行。


    ## 安装 MySQL 数据库服务器


    安装 WordPress 的下一步是安装 MySQL 数据库服务器。回到终端并输入此命令：


    ```bash

    sudo apt-get install mysql-server-5.7

    ```


    （截至本文编写，MySQL Server 版本 `5.7` 是 Linux Mint 仓库中提供的最新版本，尽管 Linux Mint 的未来版本可能会收到更新版本的
    MySQL。）


    输入密码进行身份验证，`apt` 将为你下载并安装 MySQL 文件。这是一个很大的文件集，因此取决于你互联网连接的速度，下载可能需要一段时间。在文件下载并开始安装后，安装程序会要求你为
    MySQL 的 `root` 用户密码。就像 Linux 中的 `root` 用户对系统具有完全控制权一样，MySQL 中的 `root` 用户对所有数据库、表、权限和用户具有绝对控制权。出于明显的安全考虑，你会为你的
    MySQL `root` 用户创建一个极其强大的密码（大写字母、小写字母、数字和标点符号的混合，越长越好）。


    （注意在密码对话框中，如果你无法选中 `<OK>` 字段，可以使用 `tab` 键从文本输入行跳转到 `<OK>` 字段。）


    输入 root 密码后，安装程序将完成 MySQL 文件的处理，并返回命令行。


    接下来，你想要运行 `mysql_secure_installation` 脚本来加固你新 MySQL 服务器的安全性。从提示符运行此命令：


    ```bash

    sudo mysql_secure_installation

    ```


    首先，`mysql_secure_installation` 脚本会要求你输入 MySQL `root` 用户的当前密码。输入后，它会询问你是否更改 root
    密码。由于你已经设置了 root 密码，你可以按“n”（除非出于某些原因你想再次更改它）。


    接下来，脚本会询问你是否启用密码验证插件，以检查密码的强度。输入 `0`（低）、`1`（中）或 `2`（强）。


    接下来，脚本会询问你是否移除匿名用户。匿名用户允许在没有用户账户的情况下登录 MySQL。出于安全考虑，最好移除匿名用户。


    之后，脚本会询问你是否允许 `root` 用户远程登录。始终按“y”禁止 root 访问，因为如果攻击者猜到了 root 密码，就可以破坏你的数据库。


    之后，脚本会询问你是否移除测试数据库。MySQL 包含一个任何人访问的测试数据库。再次，这是一个安全漏洞，所以你应该按“y”移除测试数据库。


    最后，脚本将询问是否刷新权限表以使更改生效。按“y”，`mysql_secure_installation` 脚本将结束并返回命令行。


    MySQL 服务器现在已安装在你的 Linux 上。


    ## 安装 PHP 和 WordPress


    安装 WordPress 的下一步是安装 PHP `7`：


    ```bash

    sudo apt-get install php

    ```


    接下来，安装 `libapache2-mod-php7` 库，允许 PHP 与 Apache 正常通信：


    ```bash

    sudo apt-get install libapache2-mod-php7

    ```


    然后安装 MySQL 模块：


    ```bash

    sudo apt-get install php-mysql

    ```


    你可能还需要安装 GD 库，因为许多 WordPress 插件依赖它进行图形处理（注意这是一个可选步骤）：


    ```bash

    sudo apt-get install php-gd

    ```


    最后，将 WordPress 软件下载到你的电脑。你可以从此地址获取：


    http://wordpress.org/latest.tar.gz


    如果你完全通过命令行操作，可以使用此命令下载 WordPress 软件：


    ```bash

    wget http://wordpress.org/latest.tar.gz

    ```


    使用此命令解压 WordPress 文件：


    ```bash

    tar -xzvf latest.tar.gz

    ```


    将 WordPress 文件移动到 `/var/www/html` 目录。（在此命令中，我假设你将 WordPress 文件解压到了家目录；如果你在不同的目录解压的，则需要调整命令。）


    ```bash

    sudo cp -r ~/wordpress/* /var/www/html/

    ```


