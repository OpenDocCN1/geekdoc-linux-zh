- fmt: '

    In the next section, we’ll look at installing and configuring Wine on an Linux
    Mint system. We’ll also talk a bit about using Linux Mint to connect to Windows
    Server Terminal Services / Remote Desktop Services systems.


    # INSTALLING AND CONFIGURING WINE


    Configuring Wine can occasionally be a challenge, but Wine installs quite easily
    and runs just fine on Linux Mint. To install Wine, use this command at the Terminal
    prompt:


    ```

    sudo apt-get install wine-stable

    ```


    Enter your password to authenticate, and `apt` will download and install Wine.
    The combined packages come to a little over a hundred megabytes, so it might take
    a while to install depending upon your connection speed.


    After the installation is finished, you can use the command line `Wine` program
    to install Windows software.


    However, you’ll probably first need to mark the installer file as executable.
    Depending on the application, `Wine` might not be able to install it if its installer
    file isn’t executable. (We discussed file permissions in Chapter 2.) For instance,
    to mark an installer file in your `Downloads` folder named `INSTALL.EXE` as executable,
    use this command at the Terminal prompt:


    ```

    chmod 755 ~/Downloads/INSTALL.EXE

    ```


    After the file has been marked as executable, you can then install Windows software
    with `Wine` through the command line. For instance, to install the example above,
    you would use this command:


    ```

    wine ~/Downloads/INSTALL.EXE

    ```


    If the application did not install, you’ll probably have to change the `Wine`
    settings. The best course is to probably browse the `Wine` application database
    and see if you can find the correct settings there. The database contains settings
    and tips for installing thousands of Windows applications, and you can find it
    here:


    http://appdb.winehq.org/


    Generally, `Wine` is very good at backwards compatibility - the older an application
    is, the more likely it is that `Wine` will support it.


    Finally, you can install a Windows application through a companion GUI application
    called `Winetricks`. `Winetricks` makes installing an application smooth and easy
    - but only if the specific application is supported. To install `Winetricks`,
    use this command at the Terminal:


    ```

    sudo apt-get install winetricks

    ```


    Once `Winetricks` is installed, you can launch it by going to the `mintmenu`,
    searching for "winetricks", and clicking on the icon for the application. `Winetricks`
    offers a GUI for installing Windows applications, and you can easily follow the
    prompts to install a supported Windows application.


    # INSTALL REMMINA


    Microsoft Windows Servers have a technology called `Terminal Services`, renamed
    to `Remote Desktop Services` in Windows Server 2008 R2. This allows client computers
    to remotely connect to the server, viewing the remote desktop and using the remote
    applications as if they were installed locally. Many organization use `Terminal
    Services/ Remote Desktop Services` to centralize their computing infrastructures.
    That way an organization can have a powerful central server system, and use cheaper
    client computers to connect to the `Terminal Services / Remote Desktop Services`
    server.


    Every version of Windows since Windows XP comes with an included `Remote Desktop`
    client. However, `Remote Desktop` provides an opportunity for you to use Linux
    Mint in a Windows-heavy environment. Versions of Linux Mint prior to 11.04 Natty
    Narwhal used a program called `TSclient` as a `Remote Desktop` client. It worked,
    but not very well.


    However, there’s a far superior option available now – `Remmina`. Linux Mint 11.04
    Natty Narwhal (and all later versions of Linux Mint) includes `Remmina` as the
    default `Remote Desktop` client. `Remmina` has many more advanced features, and
    the biggest one is that it works much better on a netbook screen, and gives you
    greater options for selection the resolution. It also includes scroll bars for
    a `Terminal Services` window larger than the current screen size – an invaluable
    feature that `TSClient` just didn’t have. If you have an older version of Linux
    Mint, you can install `Remmina` with this command at the Terminal windows:


    ```

    sudo apt-get install remmina

    ```


    Enter your password to authenticate, and `apt-get` will download and install `Remmina`
    for you. After the installation is complete, you can launch `Remmina` by going
    to the Applications menu, to Internet, and clicking on the `Remmina` icon. In
    Linux Mint 11.04 Natty Narwhal, you can also launch `Remmina` by clicking on the
    `mintmenu` and searching for it in the search field.


    ***


    ## Chapter 19 - Managing and Creating eBooks on Linux Mint


    This book only exists in ebook format, so if you’re reading it, you’re already
    familiar with ebooks as a concept. However, in the last few years (2007 to 2016,
    as of this writing), ebooks have taken the world by storm. Major online retailers
    report higher sales of ebooks than physical books, the sales of printed books
    and newspapers are collapsing, and bookstores are going out of business right
    and left. In my opinion, ebooks are as big a revolution as the printing press.
    Fortunately, you can use Linux Mint to both manage and create ebooks, using a
    variety of free software we will discuss.


    ### WHAT IS AN EBOOK?


    An ebook, generally, is a book-length document stored in a digital file. Ebooks
    have been around almost since the beginning of the Internet – `Project Gutenberg`,
    which hosts an enormous number of free domain ebooks, was founded in 1971. Publishers
    have been experimenting with digital formats, mostly unsuccessfully, ever since
