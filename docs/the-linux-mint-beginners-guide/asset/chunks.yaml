    ## Chapter 18 - Run Windows Software with Wine


    I’ve helped many people try Linux Mint after switching from Windows, and they
    all inevitably have the same question.


    “*Hey, Linux Mint is great! But how can I install my favorite Windows application
    on it?”*


    On the surface, it seems like the obvious answer would be no. Windows software
