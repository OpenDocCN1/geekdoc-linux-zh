    为了解决这个问题，Linux Mint 使用 `sudo` 命令，该命令允许用户临时以 root 身份操作。要使用 `sudo` 执行命令，只需在原有命令前加上
    `sudo` 即可：


    ```

    sudo rm document.txt

    ```


    该命令会要求你输入密码，在你输入密码后，`rm` 将以 root 级权限运行。


    （请注意，只有 Linux Mint 系统上的管理员用户才能使用 root。默认情况下，你在安装期间创建的账户就是管理员用户。）


    # 基础计算器


    Linux Mint 还自带了一个名为 `bc` 命令的实用小工具——“bc”代表“basic calculator”（基础计算器）。`bc` 命令允许你从命令行执行快速、简单的数学算运算，这可能比去寻找桌面计算器或启动图形化计算器要方便得多（而且，如果你使用的是
    Linux Mint 的服务器版本，显然没有 GUI 计算器可供）。


    要使用 `bc`，首先输入此命令：


    ```bash

    bc

    ```


    这将带你进入 `bc` 提示符，现在你可以进行数学运算了。例如，要将两个数字相加，输入以下内容然后按回车键：


    ```

    2 +2

    ```


    要将两个数字相减，使用以下语法：


    ```

    2 -2

    ```


    要两个数字相除，使用 `/` 键：


    ```

    2 /2

    ```


    要进行乘法，使用 `*` 键：


    ```

    2 * 2

    ```


    使用分数代替小数：


    ```

    2.5 + 1

    ```


    一旦你完成了 `bc` 的操作，输入 `quit` 返回到正常的命令行提示符：


    ```

    quit

    ```


    # BASH SHELL 技巧


    Linux Mint 使用名为 `bash` shell 的程序作为其命令行界面。“shell”（壳）一词指的是在用户和操作系统之间提供接口的程序。`bash`
    shell 是旧的 Bourne `sh` shell 的后代——“bash”这个名字本身就是一个双关语，意为“Bourne-again shell”（再次出生的
    Bourne shell）。还有许多其他 shell 可用，但大多数人认同 `bash` 是目前最好用的一个（当然，观点可能有所不同）。`bash` 具有许多实用的功能。


    第一个是“命令/文件名自动补全”。这意味着你输入部分命令或文件名并按下 `TAB` 键，`bash` 会尝试猜测补全文件名或命令。假设你有一个名为 `ReallyReallyReallyLongLongLongFileName.txt`
    的文件，你想删除它。但你不想输入整个文件名。相反，你只需要开始输入：


    ```bash

    rm ReallyR

    ```


    然后按下 tab 键。`bash` shell 就会为你完成文件名：


    ```bash

    rm ReallyReallyReallyLongLongLongFileName.txt

    ```


    `bash` shell 还有一个非常棒的功能叫做“命令历史”。如果你按下键盘上的 `Up`（上）箭头键，就可以回溯你使用过的命令历史。如果你不记得刚刚使用的一条长命令，或者不想重新输入，这个功能就会非常有用。


    `bash` shell 将你的命令历史存储在主目录中一个名为 `.bash_history` 的文件中。要查看它，使用此命令：


    ```bash

    cat ~/.bash_history

    ```


    请注意，该文件仅在你注销系统时才会更新。


    # 获取帮助


    这是不可避免的——Linux 命令非常复杂，并且带有大量的选项、选项和参数，所有这些都很难记忆。坦率说，Linux Mint 内置了帮助系统——`man`
    命令。`man` 是“manual”（手册）的缩写，它可以让你查看命令的基本用法和选项。要使用它，只需输入 `man` 加上你想阅读的手册页的命令名称：


    ```bash

    man ls

    ```


    这将显示 `ls` 命令的手册页。你可以使用 page up（向上页）和 page down（向下页）键在手册页中导航，一旦完成，按下“q”键将带你回到命令行提示符。


    ## 第 5 章 - 检查内存和磁盘空间占用


    在处理电脑问题时（无论是 Linux Mint、Windows 还是 Mac OS X 系统），有一条万无一失的规则——内存或磁盘空间永远不够用。诚然，情况已经比
    DOS 时代好多了，那时你只有 640 千字节的内存可用。个人电脑变得越来越强大，在编写本文时，你可以花费大约 300 到 400 美元购买一台拥有 4GB
    内存和 500GB 硬盘的笔记本电脑（如果是台式机价格甚至更低）。因此，对于普通用户来说，仔细管理个人电脑的内存和磁盘空间并不像以前那么关键了。


    然而，你仍然想要关注内存和磁盘使用情况。如果你的 Linux Mint 系统变慢了，你想知道为什么，检查资源使用情况可以为你提供线索。如果你的硬盘满了，你想找到哪些文件占用了大部分空间。如果你正在管理一个有多个用户同时访问的
    Linux Mint 服务器系统，你绝对想要密切关注资源使用情况，以免某个用户导致服务器崩溃停止。


    在本章中，我们将查看如何使用图形界面和命令行工具监控 Linux Mint 对系统资源的使用情况。


    # 系统监器


    系统监器（System Monitor）是一个实用程序，提供有关你系统状态的丰富实时信息。通过系统监器，你可以看到系统有多少 RAM 和硬盘空间。从系统监器中，你可以看到
    CPU 使用情况的图表、进程占用的内存以及以及连接到电脑的磁盘（如闪存驱动器）的空间。


    要启动系统监器，点击菜单并在搜索字段中搜索它。点击程序图标即可。


    系统监器有三个标签，每个标签显示不同的信息，我们从左到右查看。


    “进程”（Processes）是第一个标签。“进程”（process）是系统上运行的任何程序的术语，无论是后台守护进程（提供服务的程序），还是你或其他用户启动的程序。进程标签有许多列，提供有用信息。第一列“进程名称”（Process
    Name）提供进程名称。“% CPU”列显示进程消耗的 CPU 时间。“ID”列显示进程的标识符，如果你需要从命令行强制结束它时（我们将在第 22 章描述），这非常有用。“内存”（Memory）列显示进程使用的内存量。最后，进程标签在右下角有一个“结束进程”按钮，你可以用它关闭无响应的进程。


    第二个标签“资源”（Resources）提供了三个实时图表。第一个图表“CPU 历史”显示 CPU 时间的使用情况。如果你有多核处理器（现在的电脑大多如此），图表将用不同的颜色表示不同的
    CPU 核心。第二个图表“内存和交换空间历史”显示 RAM 和交换文件（swap file）空间的使用情况。（交换文件”指的是硬盘上的一个分区，当真实内存满时，Linux
    Mint 使用其作为临时内存。）最后一个图表“网络历史”显示系统网络适配器的入站流量。


    最后一个标签“文件系统”（File Systems）显示连接到 Linux Mint 系统的任何文件系统——即磁盘。这包括硬盘、光盘（如 CD 和 DVD）、USB
    外部硬盘和 USB 闪存。列显示磁盘的实际设备名称（通常类似于 `/dev/sda1`）、挂载点（设备在文件系统中挂载的位置）、文件系统类型以及磁盘上的空间，包括总空间和可用空间。

