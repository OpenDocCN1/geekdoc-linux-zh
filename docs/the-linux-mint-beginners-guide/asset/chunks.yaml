- fmt: "\nThis represents the \"local loopback address\", and is essentially the IP\
    \ address the computer uses to identify itself and its TCP/IP software socket.\
    \ A common troubleshooting step is to see if your computer can communicate with\
    \ its `127.0.0.1` address. If it can't, that means something is wrong with your\
    \ computer's TCP/IP software or that the network hardware isn't functioning properly.\n\
    \n## SUBNET MASKS\n\nIP address also have a \"subnet mask\". A subnet mask defines\
    \ which parts of the IP address designate the network, and which part designates\
    \ the individual computer on the network. Let's say the IP address of `192.168.1.1`\
    \ from above has a subnet mask like this:\n\n`255.255.255.0`\n\nThat means the\
    \ `192.168.1` part of the address indicates the network, while the final `1` indicates\
    \ the computer.\n\nIP addresses usually include a “broadcast” address. Any traffic\
    \ sent to the broadcast address is directed to every single computer in the local\
    \ network. A broadcast address has a “255” as its final number, so a computer\
    \ with a `192.168.1.1` address will have a broadcast address of `192.168.1.255`.\n\
    \n## DEFAULT GATEWAY\n\nLastly, IP addresses usually (but not always) come with\
    \ a \"default gateway\". The default gateway is the address your computer sends\
    \ traffic destined for anywhere outside the local network segment. For example,\
    \ you visit Google with your web browser. Your computer recognizes that Google\
    \ isn't on the `192.168.1.*` network, and so forwards the request to the default\
    \ gateway, which then sends the traffic on to Google. (This is a simplification,\
    \ but adequate for our purposes.)\n\n## MAC ADDRESS\n\nEvery network adapter also\
    \ has something called a “Media Access Control” address, or a MAC address. This\
    \ is an address burned into the physical hardware itself, and is (in theory) unique\
    \ to each adapter. A MAC address consists of a series of hexadecimal characters\
    \ separated by colons. For example, `09:00:27:6c:67:34` would be a valid MAC address.\
    \ MAC addresses are commonly used for network filtering purposes – for instance,\
    \ you can configure a wireless router to accept only specific MAC addresses as\
    \ client.\n\nHowever, this isn't terribly secure, since it's quite easy to spoof\
    \ or fake a MAC address. Nevertheless, for certain networking applications you\
    \ will need to know your computer's MAC address.\n\n## DNS\n\nThe final important\
    \ piece of basic networking is the Domain Name System, or DNS. \n\nAs we mentioned\
    \ above, every website on the Internet has, in theory, its own unique web address.\
    \ Remembering all of those IP addresses can prove impractical. A few people might\
    \ have keen enough memories to remember that `microsoft.com` has an IP address\
    \ of `206.46.232.182` (at least at the time of this writing), but most of us cannot.\n\
    \nDNS provides an easier way to find websites. DNS maps each address to a domain\
    \ name. When you type in a web address, such as `microsoft.com` or `distrowatch.org`,\
    \ your request goes to a DNS server. The DNS server checks its database of domain\
    \ name mappings (called “zone data”) and responds with the IP address assigned\
    \ to that domain name. Your computer is then able to contact the website and begin\
    \ downloading data.\n\nDNS is integral to the smooth functioning of most computer\
    \ networks. If your computer is suffering connection problems, DNS is one of the\
    \ first things to check (other than making sure the network cable is plugged in,\
    \ of course).\n\n## A SUMMARY OF IPV6 NETWORKING\n\nAs we mentioned earlier, in\
    \ 2011 the world ran out of available IPv4 address. Since there are only about\
    \ 4.6 billion IPv4 addresses, and there are far more networked devices in the\
    \ world than 4.6 billion (think of all those computers, smartphones, tablets,\
    \ routers, Internet TVs, printers, and other devices), a solution had to be found.\
    \ Version 6 of the Internet Protocol, IPv6, is that solution. As of this writing,\
    \ IPv6 is still on the fringes, but in a few years it will supersede IPv4 entirely.\n\
    \nIPv4 used a 32-bit addressing scheme, with four eight-bit groups to identify\
    \ the computer and the network. IPv6, by contrast, uses a 128-bit binary number\
    \ for the address. IPv4 maxed out at 4.6 billion available addresses. IPv6 has\
    \ a theoretical limit of `2^128` addresses. In simple numerals, that's about `340,282,366,920,938,463,463,374,607,431,768,211,456`\
    \ addresses.\n\nGiven that this means we could theoretically assign an IPv6 address\
    \ to every single atom on the earth, and then have enough addresses left over\
    \ to assign addresses to the atoms of another hundred Earth-sized planets, it\
    \ is unlikely that we shall run out of IPv6 addresses anytime soon.\n\nA typical\
    \ IPv6 address will look something like this:\n\n`2001:0db8:85a3:0042:0000:8a2e:0370:7334`\n\
    \nHowever, you will rarely see an entire IPv6 spelled out like this. There are\
    \ a number of shorthand ways to display an IPv6 address. The first to eliminate\
    \ any leading zeroes in each of address blocks:\n\n`2001:db8:85a3:42:0:8a2e:370:7334`\n\
    \nAdditionally, you can also use a pair of colons (`::`) to represent a string\
    \ of zeroes. So our original address could be further shortened to:\n\n`2001:db8:85a3:42::8a2e:370:7334`\n\
    \nGranted, this is still a lot to type (or read to a support technician over the\
    \ phone), but still easier that typing the entire address.\n\nIPv6 addresses do\
    \ not have subnet masks the way IPv4 addresses do. Instead IPv6 address has a\
    \ \"subnet prefix\", which identifies how much of the IPv6 address identifies\
    \ the local network and how much identifies the individual computer. Usually,\
    \ the first 64 bits of the IPv6 address (the first four blocks of digits) identifies\
    \ the network, and the second 64 bits identifies the individual computer (and\
    \ this is usually derived from the computer's MAC address).\n\nThere are three\
    \ main kinds of IPv6 addresses assigned to personal computers. The first is a\
    \ Global IPv6 address, which is equivalent to a IPv4 address. Global addresses\
    \ are designed to be accessible from the Internet, and website or public network\
    \ services will have a Global address. Global addresses always start with either\
    \ a `2` or a `3`.\n\nA Link-local address is the second major kind of address.\
    \ A Link-local address basically works the same as an APIPA address, in that a\
    \ computer assigns itself a Link-local address when it hasn't been given a static\
    \ address or is able to contact a DHCP server. A Link-local address always starts\
    \ with `fe8`.\n\nFinally, the third major kind of IPv6 address given to personal\
    \ computer is a Site-local address. A Site-local address is equivalent to the\
    \ private IPv4 addresses we described above. Like IPv4 private addresses, Site-local\
    \ IPv6 addresses are intended to be used in an organization's private networks,\
    \ and are usually not accessible from the Internet. Site-local IPv6 addresses\
    \ always start with `fec`. Not many organizations are currently using Site-local\
    \ addresses, but as IPv4 becomes increasingly obsolete, more organizations will\
    \ switch to them.\n\nLike IPv4, IPv6 also offers a local loopback address. The\
    \ local loopback address for IPv6 is this:\n\n`0000:0000:0000:0000:0000:0000:0000:0001`\n\
    \nBut remember that a string of zeroes can be shortened with a pair of colons.\
    \ So the local loopback address for IPv6 is usually displayed like this:\n\n`::1`\n\
    \nThat is much easier to type!\n\n## FIND YOUR IP ADDRESS\n\nIt's actually much\
    \ easier to find your IP address from the command line in Linux Mint than from\
    \ the graphical interface. Simply go to a command prompt and type this command:\n\
    \n```\nifconfig\n```\n\nThe `ifconfig` command will generate an output that looks\
    \ something like this:\n\n![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_558379d3.jpg)\n"
