    Now that we’ve got our software installed and downloaded, we’ll need to configure
    it. First, we’ll need to prepare MySQL for use with WordPress. WordPress requires
    a database and a database user, and full permission for its database user to access
    its database. To start the `mysql` command-line client, use this command:


    ```

    mysql -u root -p

    ```


    Enter the password for the `MySQL` root user, and you''ll find yourself at the
    `MySQL` command prompt, which will look like this:


    ```

    mysql>

    ```


    Our next steps are to create a WordPress database, create a user to access that
    database, and grant our new user all rights to the WordPress database.


    (An important note before we continue, though. All commands made from the `MySQL`
    prompt must end with a semicolon to denote the end of the statement. Any commands
    that do not end with a semicolon will not work. With that in mind, let''s first
    create a database.)


    To create a database for WordPress, use this command at the `mysql>` prompt:


    ```bash

    CREATE DATABASE wordpress;

    ```


    The `MySQL` client will respond with a message that should say "Query OK, 1 row
    affect (0.00 sec)." This means the command was successful, and a new database
    named `newdatabase` has been created.


    Next, you''ll create a user who will access that database and assign a password
    to that user. In this example, we''ll assign a password of "1234". However, in
    real life, just as with the root user, you''ll want to assign a strong password.
    (This database user won''t have full control over the `MySQL` user as the root
    user does, but we will give it full control over the database we just created,
    and a malicious user who guesses the password could cause all kinds of trouble.):


    ```bash

    CREATE USER wordpressuser IDENTIFIED BY ''1234'';

    ```


    You should get the "Query OK" message again. The final step is to assign all privileges
    on the "wordpress" database to the "wordpressuser" user. Use this command to assign
    the permissions:


    ```bash

    GRANT ALL PRIVILEGES ON wordpress.* TO wordpressuser IDENTIFIED BY ‘1234'';

    ```


    That isn''t a typo - those are single quote marks (`''`) instead of the usual
    double quote marks (`"`) that were used in the command to set the password. `MySQL`''s
    internal syntax, alas, isn''t always consistent. Anyway, if you typed the command
    correctly, you should get the "Query OK" confirmation again.


    Once you are done, use this command to quit the `MySQL` command-line interface:


    ```bash

    exit

    ```


    Now that we have `MySQL` prepared, we can now configure WordPress itself. Specifically,
    we’ll have to configure WordPress to talk to the database we just created. To
    do so, you must create a `wp-config.php` file in the WordPress directory. Fortunately,
    WordPress includes a handy `wp-config-sample.php` you can use as a template.


    Type this command to create a `wp-config` file (assuming you installed WordPress
    in the `/var/www/html` directory):


    ```bash

    sudo cp /var/www/html/wordpress/wp-config-sample.php /var/www/html/wp-config.php

    ```


    Next, use `vi` to edit the newly created `wp-config` file:


    ```bash

    sudo vi /var/www/html/wp-config.php

    ```


    You’ll see that the `wp-config.php` file contains a number of variables. Change
    the following three variables:


    - Change `putyourdbnamehere` to `wordpress`.

    - Change `usernamehere` to `wordpressuser`.

    - Change `yourpassword` here to `1234`.


    Once you have your changes made (after double-checking the spelling, of course),
    switch `vi` to Command mode, and save your changed file.


    Once this is done, rename Apache''s default `index.html` file to `index.html.old`.
    Otherwise Apache will access the default sample page instead of starting Wordpress:


    ```bash

    sudo mv index.html index.html.old

    ```


    Everything should now be ready. Open up a web browser, and navigate to `http://127.0.0.1/`.
    (If you want to access it from a different machine, of course, use the IP address
    of the WordPress server, for instance – `http://192.168.1.100.`) If you configured
    everything correctly, you should then be greeted by the WordPress configuration
    page. You’ll pick a username, and WordPress will assign you a password. Follow
    the prompts, and you will have a functional WordPress blog installed on a Linux
    Mint machine. Congratulations!


    One final note: if you configure your blog from a local browser, it will probably
    set your blog’s address as `http://127.0.0.1\.`. This is fine if you only want
    to view it from the host machine, but if you want to view it over the network,
    you’ll need to change it. Fortunately, you can do so quickly by going Options
    in the WordPress admin interface, and then to General, and changing the blog’s
    URL.


    # INSTALLING MEDIAWIKI ON Linux Mint


    Wikipedia, that encyclopedia of a thousand “citations needed”, runs on an open-source
    web application called `MediaWiki`. A wiki, if you haven’t heard the term before,
    is basically an online encyclopedia that relies on user contributions. Wikis can
    range from broad, general-topic encyclopedias like Wikipedia itself, or devoted
    to a single topic, like a television show or a computer game. You can quite easily
    install `MediaWiki` and host your own wiki off a Linux Mint system. Installing
    `MediaWiki` on Linux Mint takes three steps: first, you install the prerequisite
    software packages, second, you configure the prerequisites, and third, you install
    `MediaWiki` and run its configuration script.


    Let’s begin!


    First, install Linux Mint into your machine of choice. Once Linux Mint is installed
    and updated, you will need to install five pieces of software: the `Apache`, the
    `MySQL` database server, `PHP`, the `MySQL` module for `PHP`, and finally the
    `MediaWiki` software.


    First, install `Apache`. To install `Apache`, go to a Terminal and type this command:


    ```bash

    sudo apt-get install apache2

    ```


    (Technically, you’re installing Apache 2, the latest version.)


    Enter your password to authenticate, and apt will download and install Apache.


    And that’s it! `Apache` should now be working. To test it from the server itself,
    go to a web browser and visit the address `http://127.0.0.1/`. You’ll remember
    this is the “local loopback” address, basically the address the computer uses
    to refer to itself. Alternatively, you could test it from another computer on
    the same subnet. For instance, if you installed `Apache` on a computer with an
    IP address of `192.168.1.100`, you could test it by going to another computer
    on the same subnet and visiting `http://192.168.1.100`.


    Regardless, if `Apache` is working properly, you should see the default Apache/Linux
    Mint web page with the Linux Mint logo in the upper left-corner. `Apache` is now
    operational.


    The next step to install `MediaWiki` is to install the `MySQL` database server.
    Return to the Terminal and type this command:


    ```bash

    sudo apt-get install mysql-server-5.7

    ```


    (As of this writing, `MySQL` Server version 5.7 is the latest version available
    in the Linux Mint repositories.)


    Enter your password to authenticate, and apt will download the files and install
    them for you. It’s a big set of files, so depending on the speed of your Internet
    connection, it might take a while to download. After the files are downloaded
    and are installing, the installer will ask you for a password for `MySQL` root
    user. Just as the root user in Linux has complete control over the system, the
    root user in `MySQL` has absolute control over all databases, tables, permissions,
    and users. For obvious security reasons, you’ll want to create an extremely strong
    password (a mixture of uppercase, lowercase, numbers, and punctuation, the longer
    the better) for your `MySQL` root user.


    (Note that in the password dialog box, if you can’t get the `<OK>` field selected,
    you can use the tab key to jump from the text input line to the `<OK>` field.)


    After you enter the root password, the installer will finish working with the
    `MySQL` files, and return you to the command line.

