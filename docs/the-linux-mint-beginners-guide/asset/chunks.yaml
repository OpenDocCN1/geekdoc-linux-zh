    (http://www.jonathanmoeller.com/writer/?page_id=6531), [The Serpent Knight](http://www.jonathanmoeller.com/writer/?page_id=5856)
    (http://www.jonathanmoeller.com/writer/?page_id=5856), and [The Rune Knight](http://www.jonathanmoeller.com/writer/?page_id=7183)
    (http://www.jonathanmoeller.com/writer/?page_id=7183).


    # The Tower of Endless Worlds


    THOMAS WYCLIFFE just wants to finish his dissertation in peace and quiet. So when
    a man in a black robe appears in his closet, claiming to be the last of the Warlocks,
    Wycliffe figures it is a bad joke.


    But he soon realizes the last of the Warlocks can give him power beyond imagining.


    And all it will cost is his soul.


    SIMON WESTER needs a job. Badly. So when a rich and powerful Senator offers him
    employment, he jumps at the chance. Sure, Simon expects to find some corruption,
    some shady deals.


    He doesn''t expect to find black magic.


    LIAM MASTERE is a Knight of the Sacred Blade, defender of the mortal races. But
    can swords stand against guns? As bullets and bombs destroy his kingdom, Liam
    must risk everything to save his homeland''s one chance of salvation.


    By daring the horrors of the Tower of Endless Worlds…


    Read [The Tower of Endless Worlds](http://www.jonathanmoeller.com/writer/?page_id=2073)
    (http://www.jonathanmoeller.com/writer/?page_id=2073) for free. The saga of the
    Tower continues in [A Knight of the Sacred Blade](http://www.jonathanmoeller.com/writer/?page_id=2076)
    (http://www.jonathanmoeller.com/writer/?page_id=2076), [A Wizard of the White
    Council](http://www.jonathanmoeller.com/writer/?page_id=2078) (http://www.jonathanmoeller.com/writer/?page_id=2078),
    and [The Destroyer of Worlds](http://www.jonathanmoeller.com/writer/?page_id=2080)
    (http://www.jonathanmoeller.com/writer/?page_id=2080).


    # Cloak Games


    In 2013, a gate to another world opened, and Elves used their magic to conquer
    Earth, crushing all resistance before them.


    Three hundred years after the Conquest, the exiled Elven High Queen rules an orderly
    but stagnant Earth, with humanity forced to fight in the High Queen’s war against
    the traitors on the Elven homeworld.


    Nadia Moran doesn’t care about that. She doesn’t care about the High Queen, or
    the Rebels seeking to overthrow her. All she cares about is getting her baby brother
    the treatments he needs to recover from his potentially fatal disease…and those
    treatments have a steep price.


    Fortunately, Nadia has magic of her own, and she’s a very, very good thief.


    Unfortunately, the powerful Elven lord Morvilind has a hold on Nadia. If she doesn’t
    follow his commands, her brother is going to die.


    Of course, given how dangerous Morvilind’s missions are, Nadia might not live
    long enough to see her brother’s death…


    Read [Cloak Games: Thief Trap](http://www.jonathanmoeller.com/writer/?page_id=5969)
    (http://www.jonathanmoeller.com/writer/?page_id=5969), [Cloak Games: Frost Fever](http://www.jonathanmoeller.com/writer/?page_id=6072)
    (http://www.jonathanmoeller.com/writer/?page_id=6072), [Cloak Games: Rebel Fist](http://www.jonathanmoeller.com/writer/?page_id=6225)
    (http://www.jonathanmoeller.com/writer/?page_id=6225), [Cloak Games: Shadow Jump](http://www.jonathanmoeller.com/writer/?page_id=6713)
    (http://www.jonathanmoeller.com/writer/?page_id=6713), [Cloak Games: Shatter Stone](http://www.jonathanmoeller.com/writer/?page_id=7325)
    (http://www.jonathanmoeller.com/writer/?page_id=7325), [Cloak Games: Truth Chain](http://www.jonathanmoeller.com/writer/?page_id=7426)
    (http://www.jonathanmoeller.com/writer/?page_id=7426), [Cloak Games: Tomb Howl](http://www.jonathanmoeller.com/writer/?page_id=7598)
    (http://www.jonathanmoeller.com/writer/?page_id=7598), and [Cloak Games: Hammer
    Break](http://www.jonathanmoeller.com/writer/?page_id=8121) (http://www.jonathanmoeller.com/writer/?page_id=8121),
    along with the short stories [Wraith Wolf](http://www.jonathanmoeller.com/writer/?page_id=6735)
    (http://www.jonathanmoeller.com/writer/?page_id=6735), [Dragon Pearl](http://www.jonathanmoeller.com/writer/?page_id=7473)
    (http://www.jonathanmoeller.com/writer/?page_id=7473), and [Iron Image](http://www.jonathanmoeller.com/writer/?page_id=8142)
    (http://www.jonathanmoeller.com/writer/?page_id=8142).


    ## About the Author


    Standing over six feet tall, *USA Today* bestselling author Jonathan Moeller has
    the piercing blue eyes of Conan of Cimmeria, the bronze-colored hair of a Visigothic
    warrior-king, and the stern visage of a captain of men, none of which are useful
    in his career as a computer repairman, alas.


    He has written the DEMONSOULED series of sword-and-sorcery novels, and continues
    to write THE GHOSTS sequence about assassin and spy Caina Amalas, the COMPUTER
    BEGINNER''S GUIDE series of computer books, and numerous other works. His books
    have sold over three quarters of a million copies.


    Visit his website at:


    [http://www.jonathanmoeller.com](http://www.jonathanmoeller.com/)


    Visit his technology blog at:


    [http://www.computerbeginnersguides.com](http://www.computerbeginnersguides.com/)


    Contact him at:


    jmcontact@jonathanmoeller.com


    You can [sign up for his email newsletter here](http://www.jonathanmoeller.com/writer/?page_id=1854)
    (http://www.jonathanmoeller.com/writer/?page_id=1854), or watch for news on his
    [Facebook page](http://www.facebook.com/pages/Jonathan-Moeller/328773987230189)
    (http://www.facebook.com/pages/Jonathan-Moeller/328773987230189) or [Twitter feed](https://twitter.com/moellerjonathan)
    (https://twitter.com/moellerjonathan).

