    connecting. Type out “yes” and hit enter (just hitting “y” won’t work). The SSH
    client will then ask for a username and password, and assuming you type those
    correctly, you’ll be in. You can then start using the remote machine as if you
    were sitting in front of it.


    However, you might want to skip a step. With the addition of the –l switch, you
    can specify a username with the ssh command. In this example, the SSH client will
    attempt to connect using the “camalas” username:


    ssh –l camalas 192.168.1.100


    You’ll only need to enter the password for camalas’s account to connect.


    By default, the SSH client attempts to connect using Port 22. However, if you
    used the Port directive in your SSH server’s /etc/ssh/sshd_config file to change
    the default port, your SSH client won’t be able to connect, and will come back
    with an error message. In our example above, we set the SSH server to listen on
    the 5699 port. To tell the SSH client to connect using that port, use the –p switch:


    ssh –p 5589 192.168.1.100


    You can also combine that with the –l switch as well:


    ssh –p 5589 –l camalas 192.168.1.100


    This will make the ssh client attempt to create an ssh connection to 192.168.1.100
    using port 5589 and the camalas user account.


    USING SFTP


    SFTP, as mentioned above, is basically the File Transfer Protocol run over an
    SSH connection. Since it uses SSH’s encryption, it’s much more secure than traditional
    FTP. As an added bonus, there’s no need to set up a separate SFTP server – the
    OpenSSH Server package includes a built in SFTP server, which is also governed
    by the /etc/ssh/sshd_config file. Like with an FTP server, you need an SFTP client
    – but Linux Mint (and most Linux distributions) include one by default.


    You can access the SFTP client from the command line by simply typing:


    sftp


    However, it''s far easier to use if you know the IP address of the SSH server
    you want to access. Let''s say you want to access a SSH server with an IP address
    of 192.168.1.100\. To do so, you would append the IP address to the sftp client
    command:


    sftp 192.168.1.100


    The SSH client will then ask for your username. (Note that this will be your username
    and password on the SSH server, not the computer with the SFTP client.) Type it
    and hit enter. The client will ask for your password, which you should then enter.
    Once you do, you''ll be taken to the SFTP prompt, which looks like this:


    sftp>


    You can also specify a different username as part of the **sftp** command. If,
    for instance, you wanted to use our camalas account to connect to the SSH server
    at 192.168.1.100, the command would look like this:


    sftp camalas@192.168.1.100


    If you set up the SSH server to listen on a different port than the default of
    port 22, you’ll need to tell the SFTP client to use a different port with the
    “-P” switch. Note that this is different than the SSH client, which uses the “-p”
    switch – remember that the Linux command line is case-sensitive. To make the SFTP
    client use the 5589 port, the command should look like this:


    sftp –P 5589 192.168.1.100


    Once at the sftp prompt, you can use some of the common terminal commands. To
    see a listing of the remote directory, you can use the ls command:


    ls


    This will display the contents of the remote directory.


    To find which remote directory you''re actually in, you can use the pwd command:


    pwd


    This command, as you might remember from Chapter 3, stands for "print working
    directory", and will display the current working directory.


    To download files from the SSH server, you will need to use the **get** command.
    For instance, to retrieve a file named "report.doc" from the current working directory:


    get report.doc


    This will download the file to your local home directory.


    To upload files to the SSH server, you''ll need to use the **put** command. To
    put a file named "data.doc" on the remote server:


    put data.doc


    This will upload the file to the remote directory on the SSH server.


    THE SSH CLIENT ON WINDOWS AND MACINTOSH MACHINES


    Now that you have your Linux Mint machine set up as an SSH server, you might want
    to know if you can connect to it from a Windows or a Macintosh system.


    The answer is yes! The Mac, in particular, makes it easy. Mac OS X is a version
    of UNIX, and if you remember the introduction, Linux and UNIX are closely related.
    The Mac has both a built-in SSH client and an SFTP client which you can use from
    the Mac OS X Terminal utility. (Terminal is the Utilities folder in the Mac’s
    Applications folder.) Additionally, you can also set up a Mac machine as an SSH
    server. If you go to System Preferences, and then the Sharing control panel, you
    can check “Remote Login” to enable the Mac to act as an SSH server. From the Sharing
    control panel, you can also select the users allowed to SSH into the Mac.


    Windows comes with no-built in SSH capability. However, a number of SSH clients
    are available for the Windows platform. My favorite is the PuTTY client, which
    can act as both a Telnet and an SSH client. If you need an SFTP client for Windows,
    the redoubtable graphical program FileZilla (which we mentioned with Linux Mint’s
    FTP server) can act as an SFTP client, and it’s available for Windows.


