    免费阅读[测试者](http://www.jonathanmoeller.com/writer/?page_id=1538)。Rachelis 的试炼将会在[刺客客](http://www.jonathanmoeller.com/writer/?page_id=1540)、[血之萨满](http://www.jonathanmoeller.com/writer/?page_id=1542)、[高阶魔](http://www.jonathanmoeller.com/writer/?page_id=1544)、[燃烧之子](http://www.jonathanmoeller.com/writer/?page_id=2756)、[叛法法师](http://www.jonathanmoeller.com/writer/?page_id=3341)、[黑帕拉丁骑士](http://www.jonathanmoeller.com/writer/?page_id=3343)以及[巴利根特之墓](http://www.jonathanmoeller.com/writer/?page_id=3345)中继续。你可以在[第三灵魂合集一](http://www.jonathanmoeller.com/writer/?page_id=4021)和[第三灵魂合集二](http://www.jonathanmoeller.com/writer/?page_id=4061)中阅读整个系列。


    ## 霜族系列


    一千年前，亚瑟·潘德拉贡的最后一个孙子带领英国的幸存者通过一道魔法门来到一个新世界——一个充满魔法、高精灵、兽人、地底人以及更陌生、黑暗生物的世界。现在，这些流亡者的后裔在高王的统治下统治着一个强大、和平繁荣的王国。


    但一道阴影正威胁要吞噬这个王国。


    `RIDMARK ARBAN` 曾是一位持剑者，一位著名的骑士。现在他是一个被打上烙的放逐者，被剥夺了剑，并被视为叛徒。


    但只有他看到了即将到来的危险。霜族将会回归，除非被阻止，否则他们将让整个世界陷入冰封和无止境的冬季。


    `CALLIANDE` 在黑暗中醒来，记忆丧失，拥有恐怖力量的生物正在追捕她。


    只有她掌握着拯救世界……或彻底毁灭它的秘密。霜族的秘密。


    阅读[霜族：首次任务](http://www.jonathanmoeller.com/writer/?page_id=4439)，随后是[霜族：灰骑士](http://www.jonathanmoeller.com/writer/?page_id=4069)、[霜族：八刃刀](http://www.jonathanmoeller.com/writer/?page_id=4437)、[霜族：不朽巫师](http://www.jonathanmoeller.com/writer/?page_id=4776)、[霜族：大师盗贼](http://www.jonathanmoeller.com/writer/?page_id=5007)、[霜族：铁塔](http://www.jonathanmoeller.com/writer/?page_id=5183)、[霜族：黑暗守望者](http://www.jonathanmoeller.com/writer/?page_id=5330)、[霜族：戈耳之魂](http://www.jonathanmoeller.com/writer/?page_id=5330)、[霜族：破碎法师](http://www.jonathanmoeller.com/writer/?page_id=5860)、[霜族：世界之门](http://www.jonathanmoeller.com/writer/?page_id=6028)、[霜族：高领主](http://www.jonathanmoeller.com/writer/?page_id=6403)、[霜族：假王](http://www.jonathanmoeller.com/writer/?page_id=6865)、[霜族：矮人王子](http://www.jonathanmoeller.com/writer/?page_id=7270)、[霜族：封罗之剑](http://www.jonathanmoeller.com/writer/?page_id=7414)、[霜族：龙骑士](http://www.jonathanmoeller.com/writer/?page_id=7549)以及[霜族：暗影牢笼](http://www.jonathanmoeller.com/writer/?page_id=7803)，还有前传小说[霜族：任务](http://www.jonathanmoeller.com/writer/?page_id=6384)和[霜族：骨之任务](http://www.jonathanmoeller.com/writer/?page_id=8069)，以及短篇故事[兽人的故事](http://www.jonathanmoeller.com/writer/?page_id=5661)、[法师的故事](http://www.jonathanmoeller.com/writer/?page_id=4784)、[盗贼的故事](http://www.jonathanmoeller.com/writer/?page_id=5012)、[刺客的故事](http://www.jonathanmoeller.com/writer/?page_id=5186)、[帕拉丁骑士的故事](http://www.jonathanmoeller.com/writer/?page_id=5328)、[骑士的故事](http://www.jonathanmoeller.com/writer/?page_id=5865)、[士兵的故事](http://www.jonathanmoeller.com/writer/?page_id=6045)以及[士兵的故事](http://www.jonathanmoeller.com/writer/?page_id=6409)。你可以在[霜族合集一](http://www.jonathanmoeller.com/writer/?page_id=5671)中阅读前三本书。


    ## 七折剑


    里德马克·阿尔班是护盾骑士，安多姆海王国的守护者。在经历了一场长期而残酷的战争后，王国恢复了和平，但黑暗力量正威胁着其他土地。


    当一个疯狂的精灵师来到高王宫廷时，里德马克发现自己不仅要为了自己的生命战斗，还要为了家人的生命而战斗。因为七折剑的任务已经开始……


    阅读[七折剑：冠军](http://www.jonathanmoeller.com/writer/?page_id=7831)和[七折剑：持剑者](http://www.jonathanmoeller.com/writer/?page_id=8067)，以及前传中篇小说[护盾骑士：鬼兽人](http://www.jonathanmoeller.com/writer/?page_id=8269)。


    ## 魔魂三部曲


    马泽尔·克拉文洛克战胜了可怕的敌人，现在正严公正地统治着荒芜之地。然而，古老的邪恶在阴影中苏醒，被马泽尔亲手释放了出来。除非马泽尔全力战斗，否则世界将会毁灭。


    西格尔德拉是犹泰族的最后的守护者，她的人民最后的防御者。现在，黑暗来吞噬西格尔德拉家园和最后的最后的碎片。即使是西格尔德拉的勇气也不足以阻挡黑暗。


