    Canonical 运营着多个软件仓库，大致分为四个组。“main”（主）仓库存储由 Canonical 维护的开源软件。“universe”（宇宙）仓库包含来自其他组的开源软件。“restricted”（受限）仓库包含设备驱动程序所需的非免费软件（特别是显卡和无线网络适配器缺乏免费的
    Linux 驱动）。最后，“multiverse”（多重宇宙）仓库包含受版权或法律问题（或两者兼有）限制的非免费软件。


    你可以向系统添加额外的仓库 - 我们稍后会讨论如何操作。


    # 软件管理器


    要启动软件中心（Software Center），请进入 mintMenu，选择“管理”（Administration）类别，并点击“软件管理器”（Software
    Manager）图标。输入密码进行身份验证（请注意，你必须是管理员用户才能使用软件管理器），Mint 将会为你启动软件管理器。


    你可以通过窗口右上角的搜索框，在整个目录或特定类别中搜索要安装的应用程序。你可以通过特定的名称或描述中的术语来搜索应用程序。


    安装应用程序非常轻而易举：只需双击你想要的应用程序，然后点击“安装”（Install）按钮。在输入密码进行身份验证后，软件管理器将连接到仓库，下载并安装你请求的应用程序。


    软件管理器是 Linux Mint 上安装软件最简单的方法 - 但它无法通过命令行运行。


    # SYNAPTIC 软件包管理器


    通过 GUI 安装软件的第二种方法是使用 Synaptic 软件包管理器。Synaptic 本质上是 `apt`（高级软件包工具，Advanced Packaging
    Tool）的图形界面，`apt` 是一个处理 Debian Linux 及其派生发行版（如 Linux Mint）软件安装的实用程序。你可以通过点击 mintMenu，进入“管理”类别并点击
    Synaptic 图标来启动 Synaptic。Synaptic 运行需要 root 权限，因此你需要输入密码进行确认。完成后，Synaptic 就会打开。


    Synaptic 的图形界面没有软件管理器那么友好，使用起来可能会让人困惑。Synaptic 的巨大优势在于它列出了你配置供系统使用的任何软件仓库中提供的每一个软件包。更棒的是，该列表是可以搜索的
    - 如果不知道软件包的名称，可以通过名称或描述进行搜索。例如，如果你想安装 Virtualbox 但不知道该包的名称，可以搜索名称中包含“Virtualbox”的任何包，并很快找到你需要的内容。


    Synaptic 还可以让你一次性升级系统上所有已安装程序，前提是软件仓库中确实有可用的升级。“标记所有升级”（Mark All Upgrades）按钮会搜索任何升级，并标记可以升级的软件包。然后你可以点击“应用”（Apply）按钮来下载并安装升级包。


    # DEB 软件包


    Linux Mint 软件仓库存储了大量的软件，但它们并不包含 Linux Mint 的每一个可用应用程序。有时，由于各种原因，开发者倾向于不将软件放在仓库中，或者倾向于自己提供该应用程序。通常，此类程序的安装程序会以所谓的
    `deb` 文件形式分发。开发者会在其网站上提供 `deb` 文件下载。（截至编写本文时，Google 将其大部分应用程序 - Chrome、Picasa
    等 - 在 Google 网站的下载区域以 `deb` 文件形式提供。）


    要从 `deb` 文件安装应用程序，只需下载它并双击运行即可。（讽刺的是，尽管我们之前讨论了差异，但这几乎和为 Windows 安装软件一样相似。）取决于
    `deb` 文件的构建方式，你会被重定向到 Linux Mint 软件中心，或者看到 `dpkg` 工具的图形前端（用于安装 `deb` 软件包的程序 -
    我们将在下一节详细讨论）。无论哪情况下，你都会点击“安装”按钮，输入密码确认，应用程序就会安装到你的系统上。


    # 从命令行安装软件


    Synaptic 本身仅仅是高级软件包工具（或更通用的名称 `apt`）的图形界面。如上文所述，`apt` 工具通过从仓库下载包文件并安装它们，自动完成 Debian
    和 Debian 派生系统（如 Linux Mint）上的软件安装。你可以使用 `apt` 从命令行安装、升级和删除软件，`apt` 使这整个过程变得快速、简单且无痛苦。


    （注意，当 Synaptic 打开时，你**不能**使用 `apt`，因为 Synaptic 和 `apt` 在安装软件时都需要锁定 `/var/lib/dpkg/lock`
    目录。这是一个常见的错误 - 人会在 Synaptic 中查找软件包名称，然后去终端进行安装，却忘记了先关闭 Synaptic。）


    要使用 `apt`，你需要系统的管理员权限，以及想要安装的软件包的名称。假设你想在电脑上安装 AbiWord 处理器程序。AbiWord 安装包的名称简单地就是
    `abiword`，它位于 Linux Mint 仓库中。要安装它，你只需使用此命令：


    ```

    sudo apt-get install abiword

    ```


    （安装软件几乎必须以 root 身份执行。）


    输入密码进行身份验证，`apt-get` 将从仓库下载 AbiWord 并为你安装。如果你改变了主意，`apt` 也能轻松地删除软件：


    ```

    sudo apt-get remove abiword

    ```


    （再次，你需要 root 权限来删除软件，以及应用程序的名称。）


    像 Synaptic 一样，`apt` 也可以升级仓库中任何可用的系统软件包。首先，使用 `apt-get` 更新你的列表：


    ```bash

    sudo apt-get update

    ```


    然后，你可以升级任何可升级的包：


    ```

    sudo apt-get upgrade

    ```


    完成后，你系统上的软件将是最新的。


    最后，你也可以从命令行安装 deb 软件包，如果你想在 Linux Mint 服务器版上安装 deb 包，这是必要的。对于名为 `installer.deb`
    的 deb 文件：


    ```

    sudo dpkg -i installer.deb

    ```


    同样，`dpkg` 使用 `-r` 选项移除软件：


    ```

    sudo dpkg -r installer.deb

    ```


    # 从个人软件包存档安装软件


    有些开发者在将软件放入 Linux Mint 仓库和分发 deb 文件之间采取了折中方案。他们创建一个“个人软件包存档”（缩称为 PPA）来存放他们的应用程序安装程序。用户可以连接到该
    PPA 并使用 `apt` 下载并安装应用程序。这种情况通常发生在尚未纳入 Linux Mint 仓库的新应用程序上，或者尚处于 beta 甚至 alpha
    测试阶段的应用程序上。（在继续下去之前，我们应该强调，只有在开发者信誉良好的情况下才从 PPA 安装软件 - 不良的软件开发者可能会创建一个包含恶意软件安装程序的假
    PPA。）


    例如，假设你想安装名为“viewer”的应用程序。它不在 Linux Mint 仓库中，但开发者维护了一个名为 `viewer/viewer-releases`
    的 PPA。以下是将该 PPA 添加到你的 Linux Mint 系统的方法：


    ```

    sudo add-apt-repository ppa:viewer/viewer-releases

    ```


    然后更新你的系统列表，以强制其索引新的 PPA：


    ```

    sudo apt-get update

    ```

