- fmt: '

    Finally, you will have to shut down your Linux Mint system from time to time.
    Hibernating the computer saves power, but if you need to save on power bills,
    nothing cuts electrical costs like shutting down the system entirely. And if you
    need to move a desktop computer, obviously you will need to shut it down completely.


    Like logging out and restarting the computer, you can shut down your Linux Mint
    system through the system menu. Go to the `mintMenu`, and then click on the power
    button on the bottom of the left-hand column. You will then see a dialog box asking
    if you want to shut down or restart the computer. Click Cancel if you''ve changed
    your mind, but click the `Shut Down` button if you want to power off the computer:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m1b094f9c.jpg)


    Your Linux Mint system will then power off. Needless to say, it''s a good idea
    make sure you have all your work saved first – some applications will warn you
    before you close with unsaved work, but not all will.


    ## Understanding Home Folders


    A “home folder” (also called a “home directory”) is simply the place where Linux
    Mint stores the files for individual users. The point of multiple user accounts
    on a computer is to keep everyone''s documents separate, so it would defeat the
    point to let everyone store things in a big jumbled mess. You can actually see
    the home folders for all your accounts, if you go to the home folder in the top
    level of your computer''s hard drive:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_d8b9ac3.jpg)


    Within each home folder is a standardized set of folders:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m1f22e820.jpg)


    Every user account in Linux Mint will come with the same set of folders – Documents,
    Pictures, Music, and so forth. (The contents of your `Desktop` are actually stored
    in the `Desktop` folder in your home folder.) By default, the applications in
    your Linux Mint system will make use of these folders. Web browsers will download
    files to the `Download` files, image-based applications will save pictures to
    the `Pictures` folder, LibreOffice will save documents to the `Documents` folder,
    and so forth.


    However, if you produce a large number of documents and images, you''ll quickly
    find your folders become unmanageable. A single folder in Linux Mint can hold
    thousands of files, but having to scroll through those files will become cumbersome.
    (Even searching with the `Dash` can become tricky with thousands of files in a
    single folder.) Fortunately, a folder can contain additional folders within it,
    commonly called “subfolders” or “subdirectories.” For example, you could create
    subfolders within your `Documents` folder to sort your documents by type – one
    for spreadsheets, and another for presentations – or any other organizational
    scheme you would prefer.


    We''ll show you how to create folders later in this chapter. First, we''ll explain
    the application you actually use to navigate files and folders – the `Nemo File
    Manager`.


    ## Nemo File Manager


    `Nemo` is Linux Mint''s built-in file management application – a program that
    displays your folders and the files within them in graphical format. To launch
    `Nemo`, simply click on the icon of the folder in the left-hand column of the
    `mintMenu`, or double-click on the home folder icon on your desktop.


    The main window for `Nemo` usually looks like this:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m420b22d5.jpg)


    Files and folders are displayed in the center of the window. To open a file or
    a folder, double-click on it. The list of links in the left-hand column is useful,
    since they will take you to the most common locations you will visit – your `Documents`
    folder, for instance.


    You can use the left and right arrows to navigate forward and backward through
    folders you have visited. For instance, if you click on the `Documents` folder
    in your home folder, `Nemo` will take you to the `Documents` folder. To go back
    to your home folder, click on the back button (the arrow pointing to the left).
    Once you have returned to your home folder, `Nemo` can take you back to `Documents`
    by clicking on the Forward button (the arrow that points to the right). These
    two buttons work in much the same way as the Back and Forward buttons in a web
    browser.


    The `Nemo File Manager` also offers a useful feature called “breadcrumbs”, which
    allows you to quickly backtrack out of folders. For example, let''s say you are
    looking at a folder called `MarchReports` inside of another folder called `Spreadsheets`,
    which is in turn inside of your `Documents` folder. The breadcrumbs will then
    look like this:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_5e874772.jpg)


    You can return to any of the folders by clicking on its name in the row of breadcrumbs.
    Clicking on `Documents` would return you to your `Documents` folder, while clicking
    any of the other breadcrumbs would take you to the folder identified in the breadcrumb.


    Now that you know how to navigate through folders, we''ll show you how to create
    one.


    ## Creating Folders


    Creating folders in Linux Mint is a simple process, and takes all of two mouse
    clicks.


    To create a folder, first navigate to the location where you want to put the new
    folder. So if you want the new folder on your `Desktop`, you''d go to your `Desktop`.
    If you wanted to put the new folder in a different location, such as your `Documents`
    folder, go there instead.


    Once you are at the desired location, right-click at an empty spot in the folder,
    and the context menu will appear:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_40f6911f.jpg)


    From the context menu, select the `Create New Folder` option, which is at the
    top of the menu. You will then see a new folder, titled “untitled folder”, appear:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m7f3a9e5a.jpg)


    The name of the folder (currently “untitled folder”) is in green, which means
    you can start typing a new name for the folder. Type a new name and hit, and Linux
    Mint will assign that name to the folder.


    ## Renaming Files and Folders


    You may need to change the name of a file or a folder for a variety of reasons.
    To rename a file or folder, right-click on the file or folder, and select `Rename`
    from the context menu:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m2f5015f.jpg)


    The file or folder name will then be highlighted. Type a new name, and hit Enter.
    The file will then be renamed.


    ## Copying and Moving Files


    Linux Mint and `Nemo File Manager` make copying and moving files a fairly simple
    procedure. There are a number of ways to copy files, and we''ll go through them
    in this section.


    First, navigate to the folder or file you want to copy. Right click on the folder
    or file to bring up the context menu, and then select `Copy` from the menu:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m2f5015f.jpg)


    Next, navigate to the folder or drive where you want to copy the file or folder.
    Right click on a blank spot in the folder, and select `Paste` from the context
    menu:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_60476cd5.jpg)


    Linux Mint will then make a copy of the file in the new location.


    Suppose you want to move the file to a new location entirely, rather than copy
    it. You can do this as well, though it takes a few extra mouse clicks. First,
    right click on the file or folder, and select `Copy` from the context menu:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m2f5015f.jpg)


    After you have selected `Copy`, right-click on the file or folder again and select
    `Cut` from the context menu:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m2f5015f.jpg)


    Then navigate in Nemo to the desired destination folder. Right-click on a blank
    spot in the folder, and click the `Paste` button:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_60476cd5.jpg)

    '
