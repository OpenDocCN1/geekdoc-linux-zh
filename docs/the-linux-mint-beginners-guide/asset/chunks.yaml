- fmt: '

    In Linux, files are hidden by placing a “.” in front of their name. You can hide
    files yourself by using the `mv` command, which we’ll discuss in the next section.


    # MOVING AND RENAMING FILES


    To rename a file, you can use the `mv` command. Let’s say you wanted to rename
    the `Book.doc` file in the current working directory to `Roughdraft.doc`:


    ```

    mv Book.doc Roughdraft.doc

    ```


    The `mv` command will then rename the `Book.doc` file to `Roughdraft.doc`.


    The `mv` command can also (as the name suggests) move files from one location
    to another on your system. If you wanted to move `Book.doc` from your Documents
    folder to another folder called `Backup` in your home directory, you would use
    the `mv` command like this:


    ```

    mv ~/Documents/Book.doc ~/Backup

    ```


    The `mv` command also works with “wildcards”, which are characters that can represent
    file names. Think of them as variables – you can use them to tell the `mv` command
    to move “every file that ends with .doc in my Documents folder to the Backup folder.”
    It works like this:


    ```

    mv ~/Documents/*.doc ~/Backup

    ```


    This will move every single file with the .doc extension in your Documents folder
    to your Backup folder.


    # CREATING DIRECTORIES


    The `mkdir` command lets you create directories. To create a directory named `NewDirectory`
    in the current working directory:


    ```

    mkdir NewDirectory

    ```


    You can also create directories by absolute path. To create a directory named
    `NewDirectory` in your Documents folder:


    ```

    mkdir ~/Documents/NewDirectory

    ```


    # DELETING FILES AND FOLDERS


    Sooner or later, you''ll need to delete some files or folders, and the `rm` command
    will let you get rid of them. To get rid of a file named `Book.doc` in the current
    working directory:


    ```

    rm Book.doc

    ```


    You can also use `rm` to delete files by their absolute path:


    ```

    rm /home/jon/Documents/Book.doc

    ```


    Wildcards also work with `rm`. You can use `rm` to, say, delete every single .doc
    file on your Documents folder:


    ```

    rm /home/jon/Documents/*.doc

    ```


    Needless to say, you will want to be extremely careful when using wildcards with
    `rm`! If you make an error, you can unintentionally wipe out a large chunk of
    your files.


    You can also remove directories from the command line. To remove an empty directory,
    use the `rmdir` command:


    ```

    rmdir NewDirectory

    ```


    However, note that `rmdir` will only work if the target directory is empty. If
    it''s not, you''ll have to clean out any files in the directory before you can
    delete it with `rmdir`.


    Alternatively, you can use the `rm` command with the recursive `-r` option to
    delete a directory, all its files, and any subdirectories (along with their files):


    ```

    rm -r NewDirectory

    ```


    You''ll want to be especially careful when using the `rm` command with the -r
    option! You can easily wipe out entire branches of the filesystem, and can lose
    important data if you''re not careful.


    # COMPRESSING AND UNCOMPRESSING FILES


    Modern hard drives are enormous - as of this writing it''s common for laptops
    to have hard drives of three hundred and twenty gigabytes or more, while desktop
    machines can have hard drives upwards of a terabyte. So compressing files might
    not seem like such a big deal. However, compressing files is still useful for
    creating backups, and many files that you download off the Internet will come
    in compressed form. When working in the command line environment, you''ll need
    to know how to uncompress these files.


    Linux Mint uses the `tar` command to create file "archives", which are a large
    number of small files combined into one large file for easy storage and copying.
    The `tar` command dates back to the earliest days of UNIX, and is very efficient.
    For example, let''s say you wanted to create a file named `backup.tar` containing
    all the files and folders in your Documents folder. You would use the `tar` command
    with the `-c` option to create an archive, and the `-f` option to specify a name
    for the archive:


    ```

    tar -cf backup.tar ~/Documents

    ```


    In short order, `tar` will create the `backup.tar` file. Remember when using the
    `tar` command to always add the `*.tar` extension to any filenames, since `tar`
    will not do so automatically.


    However, this new archive isn''t compressed at all. It takes up the same amount
    of space as your `~/Documents` folder. To compress it, you''ll need to use `tar`
    with the `-z` switch, which compresses the archive with gzip compression:


    ```

    tar -czf backup.tar.gz ~/Documents

    ```


    You might also want to add the `-v` option to the command, as well:


    ```

    tar -czvf backup.tar.gz ~/Documents

    ```


    The `-v` command tells `tar` to produce verbose output, which means it tells you
    exactly what it is doing, and informs you if someting goes wrong.


    To unpack files from a `tar` archive, you likewise use the `tar` command, but
    with the `-x` switch to eXtract the files, rather than the `-c` switch to Compress
    them:


    ```

    tar -xvf backup.tar

    ```


    If a `tar` archive has been compressed with gzip style compression, make sure
    to add the `-z` command option to the mix:


    ```

    tar-xzvf backup.tar.gz

    ```


    The `tar` command is useful, but complicated. It''s somewhat easier to use the
    `zip` and `unzip` commands. To compress your Documents folder with `zip` into
    an compressed archive named `backup.zip`, use the `zip` command with these:


    ```

    zip -r backup.zip ~/Documents

    ```


    Uncompressing the archive merely takes the `unzip` command:


    ```

    unzip backup.zip

    ```


    # VIEWING FILES


    Moving files, compressing files, and deleting files is useful, sometimes you''ll
    need to view them as well. A great many files in Linux Mint, especially configuration
    files, are simply text files, and you can view them with the `cat` command. To
    view a file named `document.txt`:


    ```

    cat document.txt

    ```


    Very often a text document will be too long to fit on a single screen, and will
    scroll up before you can view the entire. You can pipe the output of the `cat`
    command to the `more` command, which will let you view the file one screen at
    a time:


    ```

    cat document.txt | more

    ```


    "Pipes" in Linux allow you to direct the output of one command to another command,
    which then acts upon that output.


    The `less` command essentially combines the `cat` and the `more` commands, letting
    you scroll through the text:


    ```

    less document.txt

    ```


    Sometimes you''ll just want to view the first few lines of a file. You can do
    so with the `head` command:


    ```

    head document.txt

    ```


    This will display the first five lines of the file. Alternately, you can use the
    `tail` command to view the final five lines of a file:


    ```

    tail document.txt

    ```


    Sometimes you''ll want to sort through a document for a particular term, which
    can take some time. The `grep` command, which searches output, can find a particular
    search string within the output. Pipe the output from the `cat` command to `grep`,
    and it will find any instances of that term:


    ```

    cat document.txt | grep term

    ```


    # USING ROOT POWERS


    As you do things on Linux Mint, you''ll quickly notice that a great many areas
    of the system are restricted. You cannot, for instance, go to the `/bin` directory
    and start deleting files at random. This is a good thing - it prevents you from
    accidentally doing damage to your system (or malicious users from doing damage
    on purpose).


    However, there are times when you''ll need to install a program, or edit a configuration
    file, or perform some other administrative task. To do that, you''ll need root-level
    permissions. The "root" account, also called the superuser account, is the most
    powerful user on a Linux system. The root account can delete any file and change
    any setting. For security reasons, the root account is disabled by default on
    Linux Mint systems, since it presents a tempting target to attackers.

