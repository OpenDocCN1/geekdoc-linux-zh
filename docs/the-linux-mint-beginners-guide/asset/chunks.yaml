    this chapter we''ll show you how to install Linux Mint on the computer of your
    choice. Additionally, we''ll also show you how to update Linux Mint after it has
    been installed. Both Linux Mint and the various software packages included with
    it are being continuously updated and improved, and updating makes certain you
    have the latest, greatest, and most secure versions of your software.


    SYSTEM REQUIREMENTS


    Before installing Linux Mint, make sure that your computer meets the system requirements.
    The term “system requirements” only means that Linux Mint requires computer hardware
    of a certain speed and storage capacity to run well. Fortunately, Linux Mint''s
    system requirements are not demanding, and definitely lower than those of Microsoft
    Windows.


    Linux Mint first requires a processor running at a speed of 700 megahertz or higher.
    (The “processor” is the main computing chip in a computer, and its speed refers
    to how many clock cycles of calculations it can perform per second.) Most processors
    manufactured since 2001 or so run at a speed of 1 gigahertz or higher, so only
    very old processors will not run Linux Mint.


    Linux Mint also requires 512 megabytes of memory and 5 gigabytes of free hard
    drive space. “Memory” refers to the amount of information the computer can load
    into its working memory at any one time. (Since this kind of memory is technically
    called Random Access Memory, RAM is a common shorthand for the computer''s working
    memory.) However, when the computer shuts down, the information in the memory
    is lost. To prevent this data loss, information that needs to be stored long-term
    is written upon the hard drive. Since hard drives are much cheaper to manufacture
    than RAM chips, hard drives can store much more information than RAM. Virtually
    every modern computer comes with more than 512 megabytes of RAM and 5 gigabytes
    of hard drive storage space; only computers older than nine or ten years will
    have smaller quantities of storage.


    Linux Mint also requires a computer with a video adapter and a monitor capable
    of displaying a screen resolution of 1024 by 768 pixels. Again, most modern computers
    are capable of that. You might run into problems if your video adapter is incompatible
    with Linux Mint. Fortunately, you can test this using the LiveCD mode, which will
    discuss in the next section.


    Finally, your computer needs either a CD-ROM drive or a USB port to install Linux
    Mint. You can install Linux Mint using either a CD-RW disc or a USB flash drive,
    and we''ll discuss both methods.


    USB OR CD?


    To install Linux Mint, you''ll first need to download the ISO file of Linux Mint,
    available at http://www.Linux Mint.com/download/desktop. (An “ISO file” is the
    term for an image file of a disk.) Once you have the ISO file, you can burn it
    to a CD, or prepare it on a USB flash drive for installation.


    Burning to a CD is the most common method. Once you burn the Linux Mint ISO to
    a CD, you can then use that disc to boot up a computer with an optical drive and
    run the installer for Linux Mint. The advantage of this approach is that most
    computers have optical drives, and can therefore boot off a burned Linux Mint
    CD. The downside is that optical drives are comparatively loud and slow. In addition,
    on older computers, I''ve noticed that optical drives have a disturbing habit
    of breaking down when attempting to install Linux Mint.


    Creating a bootable USB Linux Mint drive is a bit more work (to do so, download
    the installer from www.pendrivelinux.com), but it is has many advantages. First,
    a USB flash drive is usually faster and more reliable than a burned CD. Second,
    it''s quieter than a CD drive, and it''s far easier to carry a USB flash drive
    with you if you need to install Linux Mint on a regular basis. However, not all
    computers support booting from a USB flash drive, especially older computers.
    For those systems, you might have to use a CD.


    INSTALLING Linux Mint


    Once you have decided on a CD or a USB flash drive, you''re ready to install Linux
    Mint.


    Boot your computer using the CD or the flash drive. For some computers, you might
    have to hit a particular key when the manufacturer''s logo flashes on the screen
    to access the boot menu. (For Dell computers, for instance, it''s usually the
    F12 key, and on Asus computers it''s often the ESC key.)


    Once your computer has booted from the CD or the USB flash drive, you should see
    this screen:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_7af41301.jpg)


    This screen lets you select your language, and also allows you to select between
    trying Linux Mint and installing Linux Mint. The “Try Linux Mint” button boots
    you into the full Linux Mint environment, running off the CD or the USB flash
    drive, with access to all of Linux Mint''s included software. This is useful for
    troubleshooting (for instance, if you have a computer that will not boot), and
    it''s also useful for testing before you install Linux Mint. This allows you to
    make sure that hardware such as your graphics adapter or wireless network card
    will work properly with Linux Mint.


    For now, we''ll focus on installing Linux Mint. Click on the “Install Linux Mint”
    button to begin the installation process. You will then see this screen:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_2df451cf.jpg)


    This screen reminds you that you will need 4.4 gigabytes of free drive space (five
    is better) to install Linux Mint. It also reminds you to connect your Linux Mint
    system to the Internet for the installation. This isn''t strictly necessary, but
    it does allow the installer to download the latest updates in the background while
    you install Linux Mint, which you can enable by checking the “Download updates”
    checkbox.


    The second checkbox, the “Install this third-party software” one, allows Linux
    Mint to install various multimedia codecs. This will allow your Linux Mint system
    to play MP3 audio files. Once you have made your selection, click on the Next
    button to continue.


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m579d9e16.jpg)


    The installer will then ask you how you want to configure your computer''s hard
    drive for Linux Mint. What options you see here will depend upon how many hard
    drives your computer has, and whether or not you already have an operating system
    installed. Generally, you will have a choice between wiping your disk and installing
    Linux Mint, or splitting the disk between the previous operating system and your
    new installation of Linux Mint. (Advanced users can also select more complicated
    configuration options here.) For now, we''ll assume that you want to wipe out
    your hard drive and install Linux Mint on the blank disk, so select the option
    to erase the disk and install Linux Mint. (Note that this will wipe out anything
    already on the disk.)


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_c7e977a.jpg)


    You will then need to confirm your options before the installer continues – if
    you change your mind, you can always hit Back. However, after you hit the Install
    Now button, your disk will be erased and Linux Mint installed. Once you''re ready,
    and you''re sure you''ve made the right configuration choices, hit the Install
    Now button.


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_c7e977a.jpg)


    The installer will begin installing Linux Mint in the background, but will still
    ask you some additional questions as it works. First, you''ll need to select your
    time zone by clicking on the world map. Click Continue once you''ve selected the
    appropriate time zone.


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_27b32d38.jpg)


    Next, you''ll need to select your keyboard layout. Most of the readers of this
    book will use the English (US) keyboard layout, which is the default, but Linux
    Mint supports hundreds of different languages and keyboard layouts. Select the
    appropriate one from the list, and then hit Continue.'
