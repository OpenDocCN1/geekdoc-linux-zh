- fmt: '

    There are a number of different programs that offer file-sharing capabilities.
    Most Linux Mint systems use the `Samba` software, since it can easily share files
    with Windows-based computers. It’s common to find organizations that have a number
    of users with Windows systems storing their data on a Linux server running `Samba`.


    # WHAT IS SAMBA?


    Samba gets its name from the Server Message Block / Common Internet File System
    protocol, which is usually abbreviated to `SMB/CIFS`. A programmer named Andrew
    Tridgell first started developing what would become the Samba server in 1991 and
    1992\. Initially he called the project `smbserver`, but later he received a trademark
    notice from a company that owned the rights to that name. To find a different
    name, Tridgell searched the UNIX system dictionary for words containing the letters
    "s, m, b", and settled upon `Samba`.


    Samba quickly became popular because it allowed easy file sharing between UNIX-based,
    and later Linux-based, computers and Windows systems. Today, `Samba` is widely
    used, and Windows, Mac OS X, and Linux clients can all access files on a `Samba`
    share.


    We''ll show you how to set up a basic Samba server, and how to access those shares
    from client computers.


    # BASIC SAMBA SETUP


    Samba has a vast array of options and configuration settings, but here we''ll
    show you how to set up and configure a basic Samba server with one user.


    First, you’ll need to install `Samba`. Make your way to a command prompt and type
    this command:


    ```

    sudo apt-get install samba

    ```


    Enter your password to authenticate, and `apt` will download and install `Samba`
    and its attendant utilities for you.


    In Chapter 3 we talked about Linux Mint''s user accounts, noting that they''re
    stored in the `/etc/passwd` file. A key thing to understand about `Samba` is that
    it stores its own set of user accounts, separate from the main accounts, in the
    `/etc/samba/smbpasswd` file. That means you''ll need to create a separate Samba
    password for every user you want to access your file shares. You create this password
    using the `smbpasswd` command. Using the `camalas` account for Caina Amalas that
    we created in Chapter 5, here''s how the command should look:


    ```

    sudo smbpasswd -a camalas

    ```


    Be sure to give `camalas`''s Samba account an appropriately strong password (including
    uppercase, lowercase, punctuation, and numbers). Once `camalas`''s password is
    created, the next step is to create a directory for her to share. Begin by creating
    a folder named ''test'' in `camalas`''s folder, which we''ll use for our first
    shared folder:


    ```

    mkdir /home/camalas/test

    ```


    (NOTE: DO NOT use `sudo` to create the folder, because then the owning user and
    group will be set as ‘root’, which means you won’t be able to access the folder
    using your Samba username and password.)


    The next step is to edit the `/etc/samba/smb.conf` file, the main configuration
    file for `Samba`. As always, make a safe backup copy of the original `smb.conf`
    file to your home folder, in case you make an error:


    ```

    sudo cp /etc/samba/smb.conf ~

    ```


    Now use `vi` to edit the `/etc/samba/smb.conf` file:


    ```

    sudo vi /etc/samba/smb.conf

    ```


    The `smb.conf` file is long and rather complex, but for the purposes of this demonstration,
    you can ignore most of it. Key down to the very end of the file and insert this
    text:


    ```ini

    [test]

    path = /home/camalas/test

    available = yes

    valid users = camalas

    read only = no

    browseable = yes

    public = yes

    writable = yes

    ```


    (There should be no spaces between the lines, and note also that there should
    be a single space both before and after each of the equal signs.)


    Here''s what some of the more important configuration options mean:


    - The `[test]` gives the name of the file share.

    - The `path` option specifies the location of the folder to be shared.

    - The `available` option specifies that the file share is available to clients
    on the network.

    - The `valid users` option details the users that are allowed to access the file
    share. In this case, we''ve set it so that only the `camalas` account can access
    it. You can add additional accounts here, if you prefer.

    - The `read only` option specifies whether nor not clients will be allowed to
    write to the file share.

    - The `writable` option specifies that data can be written to the file share.


    The settings specified above will share the test folder we created earlier, and
    give the `camalas` username and the `camalas` username alone permission to read
    and write to the folder. Once you have input the changes, save `smb.conf`, exit
    `vi`, and restart Samba with this command:


    ```

    sudo /etc/init.d/samba restart

    ```


    (This will force Samba to restart, re-reading its configuration files and activating
    the share you just created.)


    Once Samba has restarted, use this command to check your `smb.conf` for any syntax
    errors:


    ```

    sudo testparm

    ```


    If you pass the `testparm` command, `Samba` should be working. Try accessing the
    share from another client on your LAN.


    We''ll explain how to do that before the end of the chapter.


    # ACCESSING SHARED FOLDERS FROM A Linux Mint CLIENT


    If you followed the directions in the previous section, you should have a working
    Samba server on your Linux Mint system.


    Accessing the file share from another Linux Mint system is simple enough, using
    the GUI. To access the share from a client Linux Mint system, go to the Go menu,
    and then select Connect to Server. When the Connect to Server dialog box opens,
    select Connect to Server. The dialog box will change with options. Put in your
    Samba server''s IP address, and hit connect. An icon for the server should then
    appear on the desktop. Double-click the icon.


    To access the file shares from a command-line client takes a little more work.


    First, you’ll need to install `cifs-utils` and `smbfs` on the client system. Go
    to a command prompt and type this command:


    ```

    sudo apt-get install cifs-utils

    ```


    Enter your password to authenticate, and `apt` will download and install those
    packages for you. Once the packages are installed, you can use them to connect
    to a Samba server.


    Now, to continue our previous example, let''s say that you followed all the walkthroughs
    in the previous chapter, which means you have a Linux Mint server running Samba
    with an IP address of `192.168.1.2`, hosting a shared folder called "test". You
    created the `camalas` account, and let''s say you assigned that account a password
    of "ghost". You want to access that file share from a client computer.


    First, query the Samba server to see what shares are available with this command:


    ```

    sudo smbclient -L 192.168.1.2

    ```


    This will display a list of any shares available on the Samba server. You should
    see the `test` share available.


    Now let’s say you actually want to connect to the `test` share on `192.168.1.1`.
    First, you’ll need a mount point, a place in your client computer''s filesystem
    where it can mount the Samba share as a directory. If you don’t already have a
    mount point, you can make one with this command:


    ```

    mkdir ~/mount

    ```


    This will generate a directory called `mount` in your home folder. We’ll use it
    in the next command to mount the Samba share.


    To actually mount the Samba share, use this command:


    ```

    sudo mount //192.168.1.2/test ~/mount -o username=camalas,password=ghost

    ```


    This will mount the shared directory `test` on `192.168.1.1` in the `mount` folder
    we just created.


    To unmount the shared folder, simply use this command:


    ```

    sudo umount ~/mount

    ```


    This will dismount the file share from your client computer.


    Note that the command is in fact actually spelled `umount`, not `unmount` – accidentally
    typing "unmount" for the `umount` command is a common typographical mistake.

    '
