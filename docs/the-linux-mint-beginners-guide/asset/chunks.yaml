    许多不同的程序提供文件共享功能。大多数 Linux Mint 系统使用 `Samba` 软件，因为它可以轻松地与 Windows 电脑共享文件。在组织中，经常会发现许多使用
    Windows 系统的用户将其数据存储在运行 `Samba` 的 Linux 服务器上。


    # 什么是 SAMBA？


    Samba 的名称来源于服务器消息块/通用互联网文件系统协议（Server Message Block / Common Internet File System），通常简写为
    `SMB/CIFS`。一位名为 Andrew Tridgell 的程序员在 1991 年和 1992 年开始开发后来成为 Samba 服务器的程序。最初他将该项目命名为
    `smbserver`，但后来他收到一个拥有该名称权利公司的商标通知。为了找到一个不同的名称，Tridgell 在 UNIX 系统字典中搜索包含字母 "s,
    m, b" 的单词，并最终选定了 `Samba`。


    Samba 迅速流行起来，因为它允许基于 UNIX（以及后来基于 Linux）的计算机与 Windows 系统之间进行方便的文件共享。今天，`Samba`
    被广泛使用，Windows、Mac OS X 和 Linux 客户端都可以访问 `Samba` 共享上的文件。


    我们将向你展示如何设置基础的 Samba 服务器，以及如何从客户端计算机访问这些共享。


    # 基础 SAMBA 设置


    Samba 拥有大量的选项和配置设置，但在这里，我们将向你展示如何设置和配置一个单用户的基础 Samba 服务器。


    首先，你需要安装 `Samba`。进入命令行提示符并输入此命令：


    ```

    sudo apt-get install samba

    ```


    输入你的密码进行身份验证，`apt` 将为你下载并安装 `Samba` 及其相关的实用程序。


    在第 3 章中，我们讨论了 Linux Mint 的用户账户，并它们存储在 `/etc/passwd` 文件中。关于 `Samba` 需要理解的一个关键点是，它存储自己的一套用户账户，与主账户分开，存储在
    `/etc/samba/smbpasswd` 文件中。这意味着你需要为每个想要访问你文件共享的用户创建一个单独的 Samba 密码。你使用 `smbpasswd`
    命令来创建此密码。使用我们在第 5 章中为 Caina Amalas 创建的 `camalas` 账户，命令看起来如下：


    ```

    sudo smbpasswd -a camalas

    ```


    确保为 `camalas` 的 Samba 账户提供一个足够强的密码（包括大写字母、小写字母、符号符号和数字）。一旦创建了 `camalas` 的密码，下一步是为她创建一个供的目录。首先在
    `camalas` 的文件夹中创建一个名为 ''test'' 的文件夹，我们将将其作为第一个共享文件夹：


    ```

    mkdir /home/camalas/test

    ```


    （注意：不要使用 `sudo` 来创建文件夹，否则所有者用户和组将被设置为‘root’，这意味着你将无法使用你的 Samba 用户名和密码访问该文件夹。）


    下一步是编辑 `/etc/samba/smb.conf` 文件，这是 Samba 的主配置文件。像既往一样，先将原始的 `smb.conf` 文件复制一个安全备份副本到你的主目录，以防你犯错：


    ```

    sudo cp /etc/samba/smb.conf ~

    ```


    现在使用 `vi` 编辑 `/etc/samba/smb.conf` 文件：


    ```

    sudo vi /etc/samba/smb.conf

    ```


    `smb.conf` 文件很长且相当复杂，但为了演示之目的，你可以忽略它的大部分内容。移动到文件末尾并插入此文本：


    ```ini

    [test]

    path = /home/camalas/test

    available = yes

    valid users = camalas

    read only = no

    browseable = yes

    public = yes

    writable = yes

    ```


    （行之间不应有空格，另外请注意每个等号的前后都应该有一个空格。）


    以下是一些较重要的配置选项的含义：


    - `[test]` 是文件共享的名称。

    - `path` 选项指定了要共享文件夹的位置。

    - `available` 选项指定该文件共享对网络上的客户端可用。

    - `valid users` 选项详细列出了允许访问文件共享的用户。在这种情况下，我们将其设置为只有 `camalas` 账户可以访问。如果你愿意，可以在这里添加额外的账户。

    - `read only` 选项指定了是否允许客户端向文件共享写入内容。

    - `writable` 选项指定可以向文件共享写入数据。


    上述设置将共享我们之前创建的 `test` 文件夹，并仅授予 `camalas` 用户名对该文件夹的读取和写权限。一旦你输入了更改，保存 `smb.conf`，退出
    `vi` 并使用此命令重启 Samba：


    ```

    sudo /etc/init.d/samba restart

    ```


    （这将强制 Samba 重启，重新读取其配置文件并激活你刚刚创建的共享。）


    一旦 Samba 重启，使用此命令检查你的 `smb.conf` 是否有语法错误：


    ```

    sudo testparm

    ```


    如果 `testparm` 命令通过了，则 `Samba` 应该可以正常工作。尝试从局域网上的另一个客户端访问该共享。


    我们将在章节结束前解释如何操作。


    # 从客户端访问共享文件夹


