    (http://www.jonathanmoeller.com/writer/?page_id=5937)、[幽灵守卫 (Ghost Vigil)](http://www.jonathanmoeller.com/writer/?page_id=6153)
    (http://www.jonathanmoeller.com/writer/?page_id=6153)、[幽灵拟态 (Ghost Mimic)](http://www.jonathanmoeller.com/writer/?page_id=6648)
    (http://www.jonathanmoeller.com/writer/?page_id=6648)以及[幽灵容器 (Ghost Vessel)](http://www.jonathanmoeller.com/writer/?page_id=7028)
    (http://www.jonathanmoeller.com/writer/?page_id=7028)，并在[幽灵的流亡 (Exile of the Ghosts)](http://www.jonathanmoeller.com/writer/?page_id=7936)
    (http://www.jonathanmoeller.com/writer/?page_id=7936)中阅读汇总短篇故事。


    ## 幽灵之夜 (The Ghost Night Series)


    凯娜·阿玛拉斯曾是一位致命的幽灵夜间战士，是尼格玛皇帝的间谍和特工。现在她只想和丈夫安静地生活。


    但内战席卷了帝国，凯娜的技能需要对抗邪恶的姆巴里教团（Umbarian Order）的残酷巫师。


    而且凯娜与姆巴里人有着危险的联系。


    因为凯娜的母亲拥有许多致命的秘密，这些秘密可能还会杀死凯娜自己……


    阅读[环中的幽灵 (Ghost in the Ring)](http://www.jonathanmoeller.com/writer/?page_id=7928)
    (http://www.jonathanmoeller.com/writer/?page_id=7928)。


    ## 第三个灵魂 (The Third Soul)


    瑞莉丝·莫兰（RACHAELIS MORULAN）是议会（The Conclave）的学徒，这是一个强大的强大法师组织。但要成为议会的一名正式大师，她必须首先通过测试。通过测试的人从不谈论他们经历的磨炼。


    未能通过测试的人再也没有出现过。


    现在，议会的法师们来带瑞莉丝去参加测试。在那里，她将面对对身体和理智的双重危险。


    以及渴望吞噬她灵魂的生物。


    如果瑞莉丝通过了测试，她将面对更危险的敌人。星界世界的恶魔监视着凡人世界，渴望统治它。


    而一些议会大师渴望帮助他们。


