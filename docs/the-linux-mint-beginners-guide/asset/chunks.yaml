    无论论好还是坏，互联网彻底改变了人们交流、购买商品和服务、阅读书籍、听音乐以及寻找朋友和潜在配偶的方式。这本书本身的存在就是互联网力量的证明——毕竟，你可能是从某个销售电子书的网站购买的这本书，而
    `Linux Mint` 的安装盘也是通过互联网下载的。事实上，这本书之所以存在，完全是因为互联网——几乎可以说没有纸质出版社会出一本关于 `Linux Mint`
    的简短介绍书籍（更不用说是一本由奇幻小说作家写的了！）。


    互联网革命的核心是一种被称为 Web 服务器的软件。Web 服务器的作用是托管名为网页的 HTML 文档，并通过万维网将这些文档发送给客户端浏览器。网页的范围从简单的静态
    HTML 页面到提供银行、商业和社交网络服务的复杂 Web 应用。


    Linux 的桌面市场份额可能不如 Microsoft Windows，但它主导了 Web 服务器市场。33% 到 40%（取决于统计者的标准）的 Web
    服务器是 Linux/UNIX/UNIX-like 机器，它们运行着一个名为 `Apache HTTP Server` 的程序，通常被简称为“Apache”。Apache
    自 1995 年左右问世以来，它的发展推动了万维网的增长。


    你可以在 `Linux Mint` 系统上轻松地安装 Apache。一台 `Linux Mint` 机器可以作为简单静态 HTML 页面的 Web 服务器，并能扩展到支持大型复杂的
    Web 应用。在本章中，我们将向你如何设置一个简单的 Apache 服务器。在随后的章节中，我们将在此安装的基础上运行一些更强大的 Web 应用，如 WordPress
    和 MediaWiki。


    ### 安装 Apache Web 服务器


    就安装而言，在 `Linux Mint` 上安装 Apache 非常轻而易举。（当然，配置它要困难得多。）要安装 Apache，请在终端窗口或命令提示符输入此命令：


    ```bash

    sudo apt-get install apache2

    ```


    （技术上，你安装的是 Apache 2，最新版本。）


    输入密码进行身份验证，按照默认提示操作，`apt` 将为你下载并安装 Apache Web 服务器。


    搞定！Apache 现在应该可以工作了。要从服务器本身进行测试，请打开浏览器并访问地址 `http://127.0.0.1`。你记得这是“本地回环”地址，基本上是本地计算机用于指代自身的
    IP 地址。或者，你也可以从同一子网的另一台计算机进行测试。例如，如果你在一台 IP 地址为 `192.168.1.100` 的计算机上安装了 Apache，你可以访问同一子网的另一台计算机并在浏览器中输入
    `http://192.168.100` 来测试。


    无论如何，如果 Apache 工作正常，你应该看到默认的 Apache/Linux Mint 网页，左上角带有 `Linux Mint` 的标志。


    Apache 现在已运行。在下一节中，我们将简单讨论一下配置 Apache。


    ### Apache 基础配置


    Apache 配置取决于取决于网站的规模变得极其复杂。Apache 配置的全概述远超本书的范围——事实上，关于这个主题已经写了数十本优秀著作。然而，在这里我们可以简要查看
    Apache 配置。


    Apache 的主配置文件是 `/etc/apache2/apache2.conf`。（在某些 Linux 发行版中，它是 `/etc/apache2/httpd.conf`，但
    Linux Mint 使用 `/etc/apache2/apache2.conf`）。你可以使用 `vi`、`cat` 或 `less` 浏览文件内容，但通常情况下，只有在知道自己在做什么时才进行修改。一如既常地，在更改配置文件之前，务必在你的家目录中创建一个备份副本，以防发生无法挽回的错误。


    `Linux Mint` 将你的实际 Web 文件（构成你网站的 HTML 文件）存储在 `/var/www/html` 目录下。安装 Apache 之后，该目录下只有一个文件——`index.html`
    文件，它包含了我们之前看到的“it works!”消息。否则，该目录是空的。你可以将自己的 HTML 文件放在这里。编写 HTML 代码超出了本书的范围，但请记住，一旦你构建了自己的网站，你就需要创建自己的
    `index.html` 文件。


    然而，将 HTML 文件加载到 `/var/www/html` 目录只会让你创建一个静态网站。如果你想要一个动态网站，一旦更新内容，你需要一个数据库后端——我们将在下一章讨论这一点。在本章的下一节中，我们将展示如何配置
    Apache 使用虚拟主机。


    ### 虚拟主机


    正如我们在上一节提到的，使用 Apache 设置简单的 Web 服务器很容易。但你可能需要一个更复杂的 Web 服务器，一个可以托管多个独立网站而不是大型网站内子目录的服务器。


    如何实现这一点？


    Apache 有一个名为“虚拟主机”的功能，允许你在同一台物理服务器上运行具有完全不同域名的独立网站。坦率地说，为 Apache 实现虚拟主机实际上非常简单。在示例中，我们将向你展示如何在
    Apache Web 服务器上设置一个名为“examplename.com”的新网站。


    首先，你需要为你的新网站文件设置一个位置。你可能记得，Apache 默认将 Web 文件存储在 `/var/www/html` 中。对于本示例，使用此命令为网站创建一个新文件夹：


    ```bash

    sudo mkdir /var/www/html/w2

    ```


    接下来，你需要在 `/etc/apache2/sites-available` 目录下为新网站创建一个配置文件。坦率地说，该目录包含一个默认文件，你可以使用此命令将其复制并作为模板使用：


    ```bash

    sudo cp /etc/apache2/sites-available/000-default.conf /etc/apache2/sites-available/examplename.conf

    ```

    （确保包含 .conf 扩展名。Linux Mint 14.04 Trusty Tahr 及更高版本运行 Apache 2.4，这需要该扩展。）


    下一步是使用 `vi` 编辑器用正确的设置编辑新的配置文件。你可以使用 `vi` 文本来实现：


    ```bash

    sudo vi /etc/apache2/sites-available/examplename.conf

    ```


    （我们在第 6 章讨论过如何使用 `vi`。）


    使用 `vi` 编辑文件后，你需要进行一些更改。


    将“Document Root”指令从 `/var/www/html` 修改为你新网站的正确位置，在本例中为 `/var/www/html/w2`。


    同样将“Directory”指令从 `/var/www/html` 修改为 `/var/www/html/w2`。


    最后，在以“ServerAdmin”开头的行下方为新网站的域名添加新行。对于我们名为“examplename.com”的网站，添加如下行：


    ```apache

    ServerName examplename.com

    ```


    保存文件更改，然后退出 `vi`。


    现在你需要修改 Apache 以向网络访客显示新域名。坦率地说，你可以通过 `a2ensite` 命令完成：


    ```bash

    sudo a2ensite examplename.conf

    ```


    （注意，“examplename”将取决于你为配置文件文件命名。）


    最后一步——重启 Apache 以强制其重新读取配置文件并开始服务新网站：


    ```bash

    sudo /etc/init.d apache2 restart

    ```


    确保在 `/var/www/html/w2` 中某种 `index.html` 文件，那么 `examplename.com` 网站现在应该可以工作了。


