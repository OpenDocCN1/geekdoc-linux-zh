    This can really confuse people coming over from a Windows/DOS background, since
    neither the old DOS operating system nor the Windows command line were case-sensitive.
    In other words, Windows would view the files `Book.doc`, `book.doc`, and `BOOK.doc`
    as the same file. Linux, however, will recognize those as three different files.


    In the same way, Linux commands are case sensitive. In Windows/DOS, typing `dir`,
    `Dir`, and `DIR` into the command prompt will trigger the same `dir` command,
    which gives a listening of files in the current directory. Linux commands are
    case-sensitive – `ls`, `Ls`, and `LS` are not the same thing.


    Bear this in mind while using the command line.


    ## Filenames with Spaces


    The command line does not handle spaces well - say you tried to use the following
    command to delete a file named "Bob''s Term Paper."


    ```

    rm Bob''s Term Paper

    ```


    This command would fail because the command line would interpret each word in
    the command as a separate file. To force the command line to view the file properly,
    enclose any filename with spaces within quotation marks:


    ```

    rm "Bob''s Term Paper"

    ```


    This time `rm` will delete the file.


    ## How to Access the Command Line


    If you’ve never used the command line in Linux Mint before, you might not know
    how to access it. Fortunately, it’s quite simple. There are two ways to launch
    the command line.


    The first way is to go to the `mintMenu`, and then to click on the Terminal icon
    in the left-hand column. This will launch the GNOME Terminal emulator application,
    which lets you launch commands from within the GUI.


    The second way is to hit the `CTRL-ALT-F1` keys on your keyboard. Do this, and
    the GUI will disappear, replaced by a black screen with a logon prompt in white
    text. Don’t be alarmed! This is a “virtual console”, which lets you shift the
    GUI to the background and log in again in a command-line only mode. Your logon
    session with the GUI will be unaffected – Linux Mint allows multiple logons from
    the same user at the same time.


    You can return to the GUI at any time by hitting `CTRL-ALT-F7`.


    Note that Linux Mint allows you to have seven virtual consoles, from `F1` to `F7`.
    `F7` is reserved for the GUI, and the remaining six allow you to log on using
    the command line.


    ## The Command Prompt Itself


    The command prompt itself, as we’ve mentioned, will probably look something like
    this:


    ```

    jon@linuxmintmachine:~$

    ```


    But what does that mean? Let’s break it down.


    - The `jon`, the part before the `@` symbol, is the name of the user currently
    logged into the system. If I am logged into my Linux Mint machine as `jon`, then
    that’s the username I’ll see before the `@` symbol.

    - The `linuxmintmachine`, the part after the `@` symbol, is the hostname, or the
    name of the computer. So if my Linux Mint machine is named `linuxmintmachine`,
    then that’s the hostname you’ll see in the command prompt.

    - The colon (`:`) marks the division between the part of the prompt that identifies
    the user and the machine - `jon@linuxmintmachine` - and the part of the prompt
    that displays the current working directory, which we''ll explain below.

    - The `~` mark refers to the current working directory – in other words, the folder
    you are currently occupying. (The terms "directory" and "folder" are used interchangeably,
    though "directory" is used more often in the context of the command line.) In
    Linux and UNIX, the tilde symbol `~` is shorthand for the user’s home directory.
    So, if I am logged into `linuxmintmachine` as `jon`, then the `~` is shorthand
    for the `/home/jon` directory.


    This means that if you change your working directory, the command prompt changes
    as well. Let us say that you change your working directory to `/`, which in Linux
    is the root directory. The command prompt will then look like this:


    ```

    jon@linuxmintmachine:/$

    ```


    Or if you change the working directory to `/etc/hp`, the prompt will look like
    this:


    ```

    jon@linuxmintmachine:/etc/hp

    ```


    ### Finding the Working Directory


    The “working directory” refers to the directory where the command prompt is currently
    focused. As we mention above, the working directory is shown in the command prompt.
    However, some Linux configurations do not include the working directory in the
    command prompt by default. To find the working directory, use this command:


    ```

    pwd

    ```


    If you’re in your Documents folder (a subfolder of your home directory), the output
    will look something like this:


    ```

    /home/jon/Documents

    ```


    Next, let’s discuss moving about the Linux Mint filesystem.


    ## Moving from Directory to Directory


    You can use the `cd` command to move from directory to directory from the command
    line. If you wanted to go to your home directory, for example:


    ```

    cd ~

    ```


    To change to the root directory:


    ```bash

    cd /

    ```


    To fully utilize the `cd` command (and some of the other commands discussed below)
    you’ll need to understand the concept of file paths in Linux Mint.


    A “file path” refers to a file’s location within the filesystem. Let’s say you
    have a document file named `Book.doc` stored in your Documents folder. So its
    absolute location, its exact place in the filesystem, would be this:


    ```

    /home/jon/Docments/Book.doc

    ```


    So if you wanted to move to `/home/jon/Documents` from anywhere in the filesystem,
    you would use this command:


    ```bash

    cd /home/jon/Documents

    ```


    However, you don’t need to type the full path for directories that are subdirectories
    of the current directory. Since Documents is a subdirectory of your home directory,
    simply type:


    ```bash

    cd Documents

    ```


    You can use a similar shortcut to return to the parent:


    ```bash

    cd ..

    ```


    The `cd` command followed by a space and two periods will move you to the next
    directory up, from Documents.


    ## Listing the Contents of Directories


    To view the contents of a directory, use the `ls` command:


    ```

    ls

    ```


    If you use `ls` in your home directory, the output will probably look something
    like this:


    ```

    /home/jon

    ```


    By default, `ls` lists the contents of the current working directory. If you want
    to view the contents of a different directory, you can either navigate there via
    the `cd` command, or type the absolute path with the `ls` command. For instance,
    to view the full contents of the `/etc` directory:


    ```bash

    ls /etc

    ```


    Pretty simple, right? But the `ls` command doesn''t offer very much information.
    This is a good place to bring up the idea of command options, also known as command
    switches.


    In the context of Linux commands, an “option” is a modifier to a command. It tells
    the command to perform a slightly different function, or to alter the output somewhat.
    Run the `ls -l` command in your home directory, and look at how the output changes:


    ```

    ls -l

    ```


    The `-l` option stands for “long listing”, and `ls` then shows much more information
    it does without the option, including the permissions and ownership of the file,
    along with the file’s size and. The `ls -l` command is even more useful when combined
    with the `-h` option:


    ```bash

    ls -lh

    ```


    You can see how the size of the files are now listened in kilobytes and megabytes,
    which is often easier to read than just bytes. You can also use the `ls` command
    with the `-a` switch to view hidden files:


    ```bash

    ls -a

    ```


    Note all the hidden files in your home directory (those starting with a dot).


    (Most of these hidden files are configuration settings for your account, and should
    be left alone unless you have a good reason to alter them.)

