    Once you''ve deleted items from your text file, you may want to save the changes.
    We''ll show you how to do that next in Command mode.


    # COMMAND MODE


    Normal mode lets you navigate around a text file and delete parts of it, but Command
    mode lets you save your file. Command mode also lets you quit `vi`, with or without
    saving your text file first.


    To access Command mode, you must first be in Normal mode. Press the colon key
    (the `:` key), and you’ll be moved to Command mode. You’ll know you’re in Command
    mode when you see a `:` prompt at the bottom of your screen.


    Let’s look at the commands you can use while in Command mode (note that you must
    hit the Enter key after typing these commands):


    - Pressing the `w` key writes the current text file to disk. This basically means
    that the file is saved. If you used `vi` to create a new file, it is written to
    disk. If you’re editing a file, any changes you made to the file are written to
    the disk. So only use the `w` command if you’re absolutely sure you want to save
    your changes.


    - Pressing the `q` key quits `vi` and returns you to the command prompt. Note
    that the `q` command will only work if you haven’t made any changes to the text
    file, or if you’ve made changes but haven’t yet saved them to disk.


    - Pressing the `q!` keys forces `vi` to quit, even if you haven’t yet written
    your current text file to disk. This generally gets used when you''ve made serious
    mistakes editing a text file and want to start over from scratch. Remember, any
    changes you made to the text file are discarded, so only use `q!` if you don’t
    want to save your changes.


    - Pressing `wq`, as you might expect, combines the `w` and `q` commands. This
    command writes your file to disk, and then exits `vi`.


    - Typing `exit` and then hitting the Enter key does the same thing as `wq`.


    # INSERT MODE


    Insert mode, as the name suggests, lets you insert text into the text file. Access
    Insert mode by pressing the `INSERT` key while in Normal mode. You can also enter
    Insert mode by pressing the `I` key or the `S` key while in Normal mode.


    Insert mode works much like most people expect a word processor to work – you
    type, and the text appears on the screen. You can also use the arrow keys and
    Page Up and Page Down to navigate around the file, even while in Insert mode.


    Text is inserted to the right of the cursor. Note that Insert mode doesn’t overwrite
    text when you type. Any text that already exists is pushed to the right as you
    add new text.


    To return to Normal mode from Insert mode, press the `ESC` key.


    Note that you can’t enter Command mode from within Insert mode, since Insert mode
    interprets the colon character `:` as simply another text character and adds it
    to the file.


    # REPLACE MODE


    The final mode of `vi`, Replace mode, works almost exactly like Insert mode, but
    with one key difference. Replace mode overwrites text as you replace it.


    To access Replace mode, press the `INSERT` key while you are in Insert mode. This
    will shift you to Replace mode. As you type, you’ll notice that preexisting text
    it overwritten, rather than moved to the right.


    Once you’ve finished working in Replace mode, you can return to Normal mode by
    hitting the `ESC` key.


    Note that you can’t enter Command mode from within Replace mode, since Replace
    mode interprets the colon character `:` as simply another text character and adds
    it to the file.


    # WHY LEARN VI?


    Compared to graphical editors like `gedit`, or even graphical word processors
    like LibreOffice or AbiWord, `vi` seems hideously complicated. Why learn it?


    Because, as we mentioned above, you’ll need it when working from the command line
    in an environment with no GUI. If you want to use Linux Mint as a server, you’ll
    need to learn `vi` (or another command line editor). Besides, `vi` is actually
    pretty easy to learn. After some practice, you’ll be editing text files with ease.


    ## Chapter 9 - Network Settings and Assigning a Static IP


    The day of the stand-alone personal computer is long past. These days, practically
    every personal computer, whether a desktop or laptop, will spend most of its life
    connected to the Internet. Linux Mint is no different. If you want to browse the
    Internet and check email from a desktop or laptop with Linux Mint, you''ll need
    to connect it to the Internet. And if you have a server running Linux Mint, you''ll
    need to connect it to either the Internet or a local-area network (LAN). Very
    often you''ll need to give a Linux Mint server system a static IP address, as
    well, so client systems can consistently find it.


    In this chapter we''ll discuss how to work with IP addresses in Linux Mint, and
    how to assign a static IP address to your system. Additionally, we''ll explain
    the differences between IP Version 4 and IP Version 6. IP Version 6 is still dominant,
    but since the available public IPv4 addresses ran out in 2011, IPv6 will becoming
    increasingly common in the next few years.


    ### IP VERSION 4 ADDRESSES


    First, we should discuss IPv4 addresses. Before we explain how to configure networks
    in Windows 8, it’s a good idea to have a firm grasp of the basics of IP addressing.


    The Internet Protocol is part of the TCP/IP (Transmission Control Protocol/Internet
    Protocol) suite, a group of related protocols that lay down the rules for how
    computers communicate over networks, both over LANs (Local Area Networks) and
    the larger Internet. An IP address, therefore, is a (theoretically) unique 32-bit
    address assigned to a computer. It''s a bit like a street address - it lets other
    computers send traffic to and receive traffic from your system. An IP address
    consists of four groups of numbers separated by dots:


    `192.168.1.1`


    These numbers are actually the numerical form of a 32-bit binary number. None
    of these numbers can be higher than 255. The dominant version of the IP protocol
    is Version 4, commonly referred to as IPv4. Under IPv4, there are only 4.6 billion
    IP addresses available, and the available IP addresses ran out in 2011. (IPv6,
    which has many more available addresses, will eventually replace IPv4, but for
    now, IPv4 remains dominant.) There are obviously far more computers, phones, routers,
    switches, and other networked devices in the world than 4.6 billion, so how do
    all these devices receive IP addresses?


    The answer is a "private IP address." Certain blocks of IP addresses have been
    reserved for use in private networks. These blocks, using a technology called
    Network Address Translation (NAT), are then "translated" to public IP addresses.
    This has extended the lifetime of the available IPv4 address space for decades.
    The ranges of the reserved private addresses are:


    `10.0.0.0` - `10.255.255.255`


    `172.16.0.0` - `172.31.255.255`


    `192.168.0.0` - `192.168.255.255`


    Odds are, your computer has an IP address in one of those ranges as part of a
    private network (even if it''s just a private network generated by your wireless
    router).


    Additionally, you might see an IP address that looks like this:


    `169.254.1.10`


    An IP address that starts with 169.254 is an Automated Private IP Address, or
    an APIPA address. APIPA is a feature of Windows systems. When a network connection
    is active, but has not been assigned a static IP address and cannot contact a
    DHCP server (more on both of those later in this chapter), Windows automatically
    assigns itself an APIPA address. This is useful if you have computer on a small
    network and wish it to communicate with other computers on that network without
    undue hassle. However, a computer with an APIPA address cannot communicate with
    the Internet.


    One other unique address you might encounter is this:


    `127.0.0.1`

