    `top` 命令已经存在很久了，并且几乎包含在每一个 Linux 变体中。Linux Mint 也不例外。`top` 命令显示各种实用的统计数据，包括 CPU
    时间占用“前茅”的用户（这也是该命令名的由来）。要启动 `top`，只需在命令行提示符处输入该命令：


    ```

    top

    ```


    一旦启动，`top` 将保持运行并实时显示统计数据。进程按照其进程 ID（PID）编号列出，以及启动该进程的命令名称。`top` 列出的信息很多，让我们来看看可用的统计数据：


    - `PID`: 进程的进程 ID 数字。

    - `USER`: 进程的所有者。由 `root` 拥进程通常是系统进程，除非它们引起问题，否则应该忽略它们。

    - `PR`: 进程的优先级，决定了 CPU 对此进程与其他进程相比的程度。数字越小，优先级越高。

    - `NI`: 进程的 nice 值，该值会影响其优先级。

    - `VIRT`: 进程使用的虚拟内存量。

    - `RES`: 进程使用的物理内存量，以千字节（KB）为单位。

    - `SHR`: 进程使用的共享内存量。

    - `S`: 进程当前的状态（僵尸、睡眠、运行、不可中断的睡眠或被追踪）。

    - `%CPU`: 进程占用处理器时间的百分比。

    - `%MEM`: 进程占用物理内存的百分比。

    - `TIME+`: 进程使用的处理器时间。

    - `COMMAND`: 启动该进程的命令名称。


    当然，你可能想按某个类别从到到大对显示进行排序。当你想要找出哪个进程占用了最多的 CPU 时间或内存时，这特别有用。按下‘t’键将按 CPU 时间对进程排序。按下‘l’键将按平均负载排序，按下‘m’键按内存信息排序。


    像系统监器（System Monitor）一样，你也可以使用 `top` 来杀死不配合的进程。要这样做，你需要记住你想要杀掉的进程 ID。在 `top` 运行时按下“k”键，实用程序将要求你输入进程
    ID 编号。输入数字，按回车键，然后当它询问你是否要杀死该进程时再次按回车键（`top` 假设你按回车键时意味着“是”）。`top` 实用程序将杀死该进程。


    一旦你完成了 `top` 操作，按下 q 键退出并返回命令行。


    ## 检查磁盘空间使用


    `top` 命令可以做很多事情，但有一点是系统监器可以做而 `top` 不能做的——它可以显示已用磁盘空间量。跟踪硬盘上的可用空间是非常重要的。诚然，如今的计算机配备了巨大的硬盘——在台式机上，容量为一
    TB 甚至两个 TB 的硬盘是非常常见的。当然，流行文件的大小变得越来越大（视频占用大量的空间），这使得填满硬盘变得更容易。而填满硬盘会导致各种意外问题，特别是在服务器系统上。


    幸运的是，有几个命令可以从 Linux Mint 的命令行跟踪磁盘空间使用情况。


    第一个命令是 `df`，它产生如下所示输出：


    ```

    /dev/sda1 31621016 3364900 26649820 12% /

    ```


    你会发现，就像系统监器中的“文件系统”标签页一样，`df` 命令列出了电脑上所有的文件系统。第一个数字是驱动器的总大小。第二个是已用空间。第三个是可用空间，最后一个数字是空间使用百分比。然而，这些数字是以
    1 千字节（KB）块为单位的，这使得如果不心算就很难阅读。为了让输出更具可读性，请使用带有 `-h` 选项的 `df`：


    ```

    /dev/sda1 31G 3.3G 26G 12% /

    ```


    你会发现大小现在是千字节（GB）或兆字节（MB，取决于文件系统的大小），这要易读得多。


    你可能还需要检查单个文件夹的大小，因为 `ls` 命令即使带有 `-l` 选项，也不会去列出文件夹的大小。（从技术上讲，Linux 中的目录也是文件，因此
    `ls -l` 命令只列出代表目录的文件的大小，而不包含目录的任何内容。）要从命令行查找文件夹的大小，请使用带有 `-s` 和 `-h` 选项的 `du`
    命令：


    ```

    du -sh ~

    ```


    该命令将根据情况以兆字节或千字节列出目标文件夹的大小。


    ## 检查内存使用


    `top` 命令在查看哪些进程使用最多内存方面做得很好。然而，它没有提供整个系统内存的概览。为此，你需要使用 `free` 命令，它产生如下所示的输出：


    ```

    Mem: 1025700 340708 684992 0 38904 156368

    ```


    前三个数字是最重要的——它们列出了 RAM 的总量、已用量和当前空量。RAM 以字节列出，除非你非常擅长心算，否则这很难阅读。幸运的是，你可以使用 `free`
    的 `-m` 选项以兆字节而不是字节显示总量，产生如下输出：


    ```

    Mem: 1001 501 500 0 64 277

    ```


    数字与之前大致相同，但现在是以兆字节表示的，而不是字节，这通常更容易阅读。你也可以使用 `-k` 和 `-g` 切换器以千字节和千字节表示值，如果你愿意的话。


    ***


    ## 第 6 章 安装软件


    对于习惯了 Microsoft Windows 系统的人来说，了解如何在 Linux Mint 系统上安装软件可能会很困难。通常在 Windows 机器上，你从网站下载安装文件，双击它，并按照安装向导建议的步骤操作。或者你将
    CD 或 DVD 插入光驱并按照自动播放提示操作，或者通过 Windows 资源管理器导航到 DVD 根目录并双击 `SETUP.EXE` 文件。Microsoft
    Windows 的优点之一是在 Windows 计算机上安装软件相对简单，以及适用于 Windows 的海量软件库。（事实上，在 Windows 上安装软件的便利性可能是缺点——考虑一下在
    Windows 盒子上有多容易感染病毒。）不幸的是，这个庞大的软件库（通常）无法在 Linux Mint 上运行。（除非你有 Wine，我们将在第 15 章讨论它。）


    '
- fmt: '

    Canonical operates a number of software repositories, divided into roughly four
    groups. The "main" repository holds open source software maintained by Canonical.
    The "universe" repository contains open source software from other groups. The
    "restricted" repository holds non-free software necessary for device drivers (there
    is a lack of free Linux drivers for video cards and wireless network adapters,
    in particular). Finally, the "multiverse" repository contains non-free software
    restricted by either copyright or legal issues, or both.


    It''s possible to add additional repositories to your system - we''ll discuss
    how to do that shortly.


    # SOFTWARE MANAGER


    To launch Software Center, go to the mintMenu, to the Administration category,
    and click on the icon for Software Manager. Enter your password to authenticate
    (note that you must be an administrative user to use Software Manager), and Mint
    will launch Software Manager for you.


    You can search for applications to install, both through the entire catalog and
    within specific categories, by using the search box in the upper right-hand corner
    of the window. You can search for applications either by specific name, or by
    terms in their descriptions.


    Installing applications is a breeze; merely double-click the application you want,
    and click the Install button. After you enter your password to authenticate, Software
    Manager will link up with the repositories, and download and install the application
    you want.


    Software Manager is far and away the easiest way to install software on Linux
    Mint - but it doesn''t work from the command line.


    # SYNAPTIC PACKAGE MANAGER


    The second way to install software through the GUI is using the Synaptic Package
    Manager. Synaptic is essentially a graphical interface to `apt`, the Advanced
    Packaging Tool, which is a utility that handles the installation of software on
    Debian Linux and Debian-derived distributions (such as Linux Mint). You can launch
    Synaptic by clicking on the mintMenu, going to the Administration category, and
    clicking on the icon for Synaptic. Synaptic needs root powers to run, so you''ll
    need to enter your password to confirm. After you do, Synaptic will open.


    Synaptic''s graphical interface isn''t quite as friendly as Software Manager''s,
    and can be confusing to use. Synaptic''s big advantage is that it lists every
    single package available in any software repositories you have configured your
    system to use. Even better, the list is searchable - if you don''t know the name
    of a package, you can search for it by name or description. For example, if you
    wanted to install Virtualbox, but didn''t know the name of the package, you could
    search for any packages with "Virtualbox" in their name, and find what you need
    in short order.


    Synaptic will also let you upgrade all the installed programs on your system at
    once, assuming that upgrades are in fact available in the software repositories.
    The "Mark All Upgrades" button will search out any upgrades, and mark the packages
    that can be upgraded. You can then hit the Apply button to download and install
    the upgrade packages.


    # DEB PACKAGES


    The Linux Mint software repositories store a vast selection of software, but they
    do not contain every last available application for Linux Mint. Sometimes developers
    prefer not to keep their software in the repositories for a variety of reasons,
    or prefer to make the application available themselves. Very often the installer
    for such a program will be distributed in what''s called a `deb` file. The developer
    will make the `deb` file available for download on their website. (As of this
    writing, Google keeps most of its applications - Chrome, Picasa, and the like
    - available as `deb` files on the download section of the Google site.)


    To install an application from a `deb` file, simply download it and double-click
    it to run. (Ironically, despite the differences we discussed earlier, this is
    almost like installing software for Windows.) Depending on how the `deb` file
    is put together, you''ll either be redirected to the Linux Mint Software Center,
    or presented with a the graphical front end for the `dpkg` tool (the application
    that installs `deb` packages - we''ll discuss it more in the next section). In
    either case, you''ll hit the Install button, enter your password to confirm, and
    the application will install itself on your system.


    # INSTALLING SOFTWARE FROM THE COMMAND LINE


    Synaptic itself is only a graphical interface for the Advanced Packaging Tool,
    or `apt`, as it is more commonly known. The `apt` tool, as we mentioned above,
    automates the installation of software on Debian and Debian-derived systems (like
    Linux Mint) by downloading the package files from the repository and installing
    them. You can use `apt` to install, upgrade, and remove software from the command
    line, and `apt` makes the process quick, easy, and painless.


    (Note that you CANNOT use `apt` while Synaptic is also open, since both Synaptic
    and `apt` need to lock the `/var/lib/dpkg/lock` directory while installing software.
    This is a common mistake - people will look up a package''s name in Synaptic,
    and then go to the Terminal to install it, forgetting to close Synaptic first.)


    To use `apt`, you need admin rights to your system, as well as the name of the
    package you want to install. Let''s say that you want to install the AbiWord processor
    application on your computer. The name of AbiWord''s installer package is simply
    `abiword`, and it''s in the Linux Mint repositories. To install it, you''d simply
    use this command:


    ```

    sudo apt-get install abiword

    ```


    (Installing software almost always must be done as root.)


    Enter your password to authenticate, and `apt-get` will download AbiWord from
    the repositories and install it for you. If you change your mind, `apt` also makes
    it easy to remove software:


    ```

    sudo apt-get remove abiword

    ```


    (Again, you need root permissions to remove software, along with the name of the
    application.)


    Like Synaptic, `apt` can also upgrade any packages on your system that have upgrades
    available in the repositories. First, use `apt-get` to update your system''s listing:


    ```bash

    sudo apt-get update

    ```


    Then, you can then upgrade any packages with upgrades available:


    ```

    sudo apt-get upgrade

    ```


    After it''s done, the software on your system will be up to date.


    Finally, you can also install deb packages from the command line, which is a necessity
    if you want to install a deb package in the Server edition of Linux Mint. To install
    a deb file called `installer.deb`:


    ```

    sudo dpkg -i installer.deb

    ```


    Likewise, `dpkg` can also remove software with the `-r` option:


    ```

    sudo dpkg -r installer.deb

    ```


    # INSTALL SOFTWARE FROM A PERSONAL PACKAGE ARCHIVE


    Some developers take a halfway point between putting their application in the
    Linux Mint repositories or distributing as deb file. They instead create a "personal
    package archive", commonly abbreviated as a PPA, to house their application''s
    installer. Users can then connect to the PPA and use `apt` to download and install
    the application. Very often this happens with new applications that haven''t yet
    been included in the Linux Mint repositories, or applications that are still in
    beta or even the alpha testing stages.


    (Before going any further, we should emphasize that you should install software
    from a PPA only if the developer is reputable - an unscrupulous software developer
    could create a fake PPA with installers for malicious software.)


    For example, say you want to install an application called "viewer". It''s not
    available in the Linux Mint repositories, but the developer maintains a PPA called
    `viewer/viewer-releases`. Here''s how you would add the PPA to your Linux Mint
    system:


    ```

    sudo add-apt-repository ppa:viewer/viewer-releases

    ```


    Then update your system''s listing of the repositories, to force it to index the
    new PPA:


    ```

    sudo apt-get update

    ```

