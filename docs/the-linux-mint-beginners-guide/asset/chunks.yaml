    The Frostborn Series


    A thousand years ago, the last grandson of Arthur Pendragon led the survivors
    of Britain through a magical gate to a new world, a world of magic and high elves,
    of orcs and kobolds and stranger, darker creatures. Now the descendants of the
    exiles rule a mighty kingdom, peaceful and prosperous under the rule of the High
