    \ command to add a group named ghosts:\n\nsudo groupadd ghosts\n\nAlternatively,\
    \ you could use the **addgroup** command:\n\n**sudo addgroup ghosts**\n\nBoth\
    \ commands do the same thing, but have different potential options, if you wish\
    \ to peruse their man pages.\n\n(Second shameless authorial plug: in the \"Ghosts\"\
    \ novels, Caina belongs to the Ghosts, the spies of the Emperor of Nighmar.)\n\
    \nLike user accounts, Linux Mint stores all its groups in a plain text file, /etc/group.\
    \ To view this file:\n\ncat /etc/group\n\nMost of the groups in there are system\
    \ groups and can be safely ignored. It will seem like all of your user accounts\
