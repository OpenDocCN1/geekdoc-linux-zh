    ## The Ghost Exile Series


    Caina Amalas was a nightfighter of the Ghosts, the spies and assassins of the
    Emperor of Nighmar, and through her boldness and cunning saved the Empire and
    the world from sorcerous annihilation.


    But the victory cost her everything.


    Now she is exiled and alone in the city of Istarinmul, far from her home and friends.
    Yet a centuries-old darkness now stirs in Istarinmul, eager to devour the city
    and the world itself.


    And Caina is the only one that stands in its way...


    Read [Ghost in the Cowl](http://www.jonathanmoeller.com/writer/?page_id=4903)
    (http://www.jonathanmoeller.com/writer/?page_id=4903), [Ghost in the Maze](http://www.jonathanmoeller.com/writer/?page_id=5090)
    (http://www.jonathanmoeller.com/writer/?page_id=5090), [Ghost in the Hunt](http://www.jonathanmoeller.com/writer/?page_id=5244)
    (http://www.jonathanmoeller.com/writer/?page_id=5244), [Ghost in the Razor](http://www.jonathanmoeller.com/writer/?page_id=5553)
    (http://www.jonathanmoeller.com/writer/?page_id=5553), [Ghost in the Inferno](http://www.jonathanmoeller.com/writer/?page_id=5759)
    (http://www.jonathanmoeller.com/writer/?page_id=5759), [Ghost in the Seal](http://www.jonathanmoeller.com/writer/?page_id=5924)
    (http://www.jonathanmoeller.com/writer/?page_id=5924), [Ghost in the Throne](http://www.jonathanmoeller.com/writer/?page_id=6145)
    (http://www.jonathanmoeller.com/writer/?page_id=6145), [Ghost in the Pact](http://www.jonathanmoeller.com/writer/?page_id=6629)
    (http://www.jonathanmoeller.com/writer/?page_id=6629), and [Ghost in the Winds](http://www.jonathanmoeller.com/writer/?page_id=6694)
    (http://www.jonathanmoeller.com/writer/?page_id=6694) along with the short stories
    [Ghost Sword](http://www.jonathanmoeller.com/writer/?page_id=4911) (http://www.jonathanmoeller.com/writer/?page_id=4911),
    [Ghost Price](http://www.jonathanmoeller.com/writer/?page_id=5105) (http://www.jonathanmoeller.com/writer/?page_id=5105),
    [Ghost Relics](http://www.jonathanmoeller.com/writer/?page_id=5265) (http://www.jonathanmoeller.com/writer/?page_id=5265),
    [Ghost Keeper](http://www.jonathanmoeller.com/writer/?page_id=5481) (http://www.jonathanmoeller.com/writer/?page_id=5481),
    [Ghost Nails](http://www.jonathanmoeller.com/writer/?page_id=5504) (http://www.jonathanmoeller.com/writer/?page_id=5504),
    [Ghost Lock](http://www.jonathanmoeller.com/writer/?page_id=5776) (http://www.jonathanmoeller.com/writer/?page_id=5776),
    [Ghost Arts](http://www.jonathanmoeller.com/writer/?page_id=5937) (http://www.jonathanmoeller.com/writer/?page_id=5937),
    [Ghost Vigil](http://www.jonathanmoeller.com/writer/?page_id=6153) (http://www.jonathanmoeller.com/writer/?page_id=6153),
    [Ghost Mimic](http://www.jonathanmoeller.com/writer/?page_id=6648) (http://www.jonathanmoeller.com/writer/?page_id=6648),
    and [Ghost Vessel](http://www.jonathanmoeller.com/writer/?page_id=7028) (http://www.jonathanmoeller.com/writer/?page_id=7028),
    and read the combined short stories in [Exile of the Ghosts](http://www.jonathanmoeller.com/writer/?page_id=7936)
    (http://www.jonathanmoeller.com/writer/?page_id=7936).


    ## The Ghost Night Series


    Caina Amalas was once a deadly Ghost nightfighter, a spy and agent of the Emperor
    of Nighmar. Now she only wishes to live quietly with her husband.


    But civil war grips the Empire, and Caina''s skills are needed against the cruel
    sorcerers of the malevolent Umbarian Order.


    And Caina has a dangerous connection to the Umbarians.


    For Caina''s mother had many deadly secrets, secrets that might yet kill Caina
    herself...


    Read [Ghost in the Ring](http://www.jonathanmoeller.com/writer/?page_id=7928)
    (http://www.jonathanmoeller.com/writer/?page_id=7928).


    ## The Third Soul


    RACHAELIS MORULAN is an Initiate of the Conclave, the powerful order of mighty
    mages. But to become a full Adept of the Conclave, she must first survive the
    Testing. Those who survive the Testing never speak of the trials they endured.


    Those who fail the Testing are never seen again.


    And now the Magisters of the Conclave have come to take Rachaelis to undertake
    the Testing. And there she shall face perils to both her body and her sanity.


    And creatures that yearn to devour her soul.


    If Rachaelis survives the Testing, she will face even more dangerous foes. The
    demons of the astral world watch the world of mortal men, desiring to rule it
    for themselves.


    And some Adepts of the Conclave are eager to help them.

    '
