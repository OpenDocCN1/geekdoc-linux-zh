  trans: '


    EPUB 是第二流行的电子书格式。它成立于 2007 年，由旧的开放电子书（Open eBook）标准演变而来。EPUB 是一种开放标准，这意味着任何人都可以使用而无需支付许可费用。它也相对易用，因为它依赖
    `CSS` 和 `XHTML` 进行书籍排版。Barnes & Noble 在其在线商店中使用 EPUB，此外，Kobo、Google Play 以及大多数其他主要的电子书供应商也使用它。


    （通而言之，Amazon 使用 MOBI，而几乎所有其他人都使用 EPUB。）


    正因如此，电子书世界存在着令人恼恼的双向对分，就像 VCR 时代初期围绕 Betamax 和 VHS 的争斗一样。许多设备只能读取 MOBI 而不能读取 EPUB，反之亦然。幸运的是，存在许多免费工具可以将一种格式转换为另一种格式，我们将在下一节中讨论它们。


    ## 使用 CALIBRE 转换和管理电子书


    由于电子书通常比实体书便宜得多，因此很容易快速积累大量的收藏。管理和组织电子书库可能会变成一项挑战。让事情变得复杂的是，我们在上一节中讨论的格式之战意味着某些电子书可以在一个设备上运行，而另一些则不行，极少数可以在两个设备上运行。


    幸运的是，一个名为 Calibre 的免费应用程序可以解决许多问题。Calibre 最初开发于 2006 年，是一款电子书管理程序。它会自动根据标题和作者对你的电子书进行排序，这使得查找任何标题变得简单得多。它还可以转换大多数电子书格式，允许你流畅地在
    EPUB 和 MOBI 之间切换（只要文件没有被加密——Calibre 无法读取受数字版权管理技术 DRM 保护的电子书文件）。Calibre 还包含一个内置的电子书阅读器，可以处理大多数电子书格式。


    Calibre 非常容易安装，你可以通过 Linux Mint 软件应用程序进行安装。（我们在第 4 章中讨论过如何使用 Linux Mint 软件应用程序安装软件）。当然，使用此终端命令安装
    Calibre 会更快、更方便：


    ```bash

    sudo apt-get install calibre

    ```


    输入密码进行身份验证，按照默认提示，`apt` 将会为你安装 Calibre。


    安装完成后，你可以通过在 `mintmenu` 中搜索来启动 Calibre。Calibre 第一次运行时，你会看到一个向导询问一些配置选项：将 Calibre
    库存储在哪里、使用哪种电子书阅读器（如果有），以及该阅读器使用哪些设置。输入适当的信息，就可以开始使用 Calibre。


    Calibre 的 `GUI` 相当易用，该程序包含一份完整的手册（当然是电子书格式）。


    ## 使用 SIGIL 创建电子书


    阅读电子书足够简单，但假设你想创建一个电子书呢？从哪里开始呢？


    免费的 Sigil 应用程序是一个 WYSIWYG（所见即所得）编辑器，允许你创建 EPUB 文件。作为一个应用程序，Sigil 相当精简，但只要经过一点练习，你相对容易地创建复杂的
    EPUB 书籍。（这本书的 EPUB 版本就是用 Sigil 创建的）。Sigil 还允许你查看 EPUB 书籍的底层 `XHTML` 代码，允许你对书籍进行高级更改。更棒的是，在
    Linux Mint 上安装 Sigil 仅需几条终端命令。


    以下是操作方法。


    首先，同时按下 `CTRL+ALT+T` 键启动终端，然后输入此命令：


    ```bash

    sudo apt-get install sigil

    ```


    输入密码进行身份验证，Linux Mint 将为你下载并安装 Sigil。


    安装完成后，你可以进入 `mintmenu`，搜索 "Sigil" 并点击其图标启动 Sigil。


    ***


    ## 第 20 章 - 转换音频和视频


    几乎所有现代计算机都是“多媒体”计算机——也就是说，它们可以播放声音和视频。并非一直如此——早期的个人电脑完全依赖基于文本的界面，逐渐增加了对图像、声音和视频播放的支持。在
    Linux Mint 中，基于文本的界面并没有消失（毕竟本书的大部分都在讨论使用 `command line`），但 Linux Mint 系统的多媒体能力与任何
    `Windows` 电脑或 Mac 笔记本电脑一样。


    在本章中，我们将讨论如何转换不同的多媒体格式，但首先来看这些多媒体格式本身。


    ### 什么是文件格式？


    当我们讨论多媒体文件格式或“解码器”（codec）时，指的是以数字形式存储音频和视频数据的方法。声音或视频是数据的模拟形式（基本上是一条长波）。然而，计算机以数字格式存储数据——即一长串的
    1 和 0。因此，“解码器”是一种将这些 1 和 0 转换为你可以通过电脑扬声器播放的模拟波的软件。


    正如你所预期的，将 1 和 0 转换为模拟波反反之有很多不同的标准，我们将在下一节中查看其中一些竞争标准。


    ### 音频文件格式


    音乐和音频文件有几种相互竞争的格式。然而，其中一种明显占据主导地位——MP3 格式。MP3 由活动图像专家组（Moving Pictures Expert
    Group）于 1993 开发，是数字音乐文件最常用的格式。几乎所有主要的在线零售商都出售 MP3 格式的音乐文件，几乎所有的操作系统默认播放 MP3 文件，或者可以轻松获得播放它们的能力。


    尽管 MP3 无处不在，但它也面临着许多法律问题。由于一系列复杂的诉讼，没有人能完全确定谁拥有与 MP3 相关的某些专利，因此任何想在自己的软件或硬件中使用
    MP3 解码器的人都需要支付许可费用。


    尽管 MP3 是主要的数字音频格式，但还有其他几个重要的格式。Windows Media Audio (WMA) 是微软 `Windows` 的默认媒体格式，在
    20 世纪 90 年代后期和 21 世纪初，微软希望它能取代 MP3。然而，Apple iPod 在 2000 年代统治了数字音乐市场，Apple 显然对使用微软的格式之一感兴趣。如今，WMA
    往往只在 Windows 机器和设备上播放，几乎不再如此。


    AAC（高级音频编码）是另一个主要的音频格式，它是 Apple iTunes 软件的默认音频格式。AAC 设计用于作为 MP3 标准的最终替代品，并且比 MP3
    在更小的空间内压缩更多信息。


    最后一个主要的音频格式是 OGG/Vorbis。与这里提到的其他主要格式不同，OGG/Vorbis 是免费且开源的，这意味着公司可以使用它而无需支付许可费用。因此，Linux
    Mint 无需任何额外软件包即可支持它。然而，OGG/Vorbis 仍然处于少数，以该格式提供的数字媒体非常少。


    ### 视频文件格式


    与音频文件格式不同，目前还没有单一的主导视频格式，而是有几个主要的竞争格式。


    常见视频格式中最老的是音频视频交织（AVI）。AVI 由微软在 20 世纪 90 年代推出，相对原始。它最大的缺陷是完全不支持任何压缩，这意味着 AVI 文件可能会变得极其巨大。然而，AVI
    与许多不同的应用程序和设备兼容，因此它仍然在使用。


    WMV（Windows Media Video）是另一个主要的视频格式，是微软 Windows Audio 格式的近亲。与 AVI 不同，WMV 是经过压缩的。许多数字摄像机默认使用
    WMV，因此它非常常见。


    另一个主要格式是 MP4 格式，它可能是我们讨论的格式中应用最广泛的。MP4 的变体版本是 Apple QuickTime 软件的默认格式（称为 MOV 文件），由于
    Mac 在视频编辑领域很受欢迎，MP4 文件非常常见。


