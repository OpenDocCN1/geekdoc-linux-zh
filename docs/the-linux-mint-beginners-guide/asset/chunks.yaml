    现在我们已经安装并下载了软件，并将对它进行配置。首先，我们需要为 WordPress 的使用 MySQL 做好准备工作。WordPress 需要一个数据库和一个数据库用户，并要求该数据库用户拥有访问其数据库的完全权限。要启动
    `mysql` 命令行客户端，请使用此命令：


    ```

    mysql -u root -p

    ```


    输入 `MySQL` root 用户的密码，你将进入 `MySQL` 命令行提示符，它看起来像这样：


    ```

    mysql>

    ```


    我们接下来的步骤是创建一个 WordPress 数据库，创建一个访问该数据库的用户，并为我们的新用户授予对 WordPress 数据库的所有权限。


    （在继续之前，有一个重要的注意事项：从 `MySQL` 提示符执行的所有命令都必须以分号结尾，以表示语句的结束。任何不以分号结尾的命令都无法运行。考虑到这一点，让我们先创建一个数据库。）


    要为 WordPress 创建数据库，请在 `mysql>` 提示符下使用此命令：


    ```bash

    CREATE DATABASE wordpress;

    ```


    `MySQL` 客户端将返回一条消息，内容应为“Query OK, 1 row affected (0.00 sec)。”这意味着命令执行成功，已创建一个名为
    `newdatabase` 的新数据库。


    接下来，你将创建一个访问该数据库的用户，并为该用户分配一个密码。在示例中，我们将分配“1234”作为密码。然而，在现实生活中，就和 root 用户一样，你将希望分配一个强密码。（此数据库用户不会像
    root 用户那样对 `MySQL` 用户拥有完全控制权，但我们将赋予它对我们刚刚创建的数据库的完全控制权，而一个猜中密码的恶意用户可能会引发各种麻烦）：


    ```bash

    CREATE USER wordpressuser IDENTIFIED BY ''1234'';

    ```


    你应该再次获得 "Query OK" 消息。最后一步是将 "wordpress" 数据库上的所有权限授予 "wordpressuser" 用户。使用此命令分配权限：


    ```bash

    GRANT ALL PRIVILEGES ON wordpress.* TO wordpressuser IDENTIFIED BY ‘1234'';

    ```


    这不是拼写错误——这些是单引号（`''`），而不是在设置密码的命令中使用的普通双引号（`"`）。遗憾的是，`MySQL` 的内部语法并不总是一致的。无论如何，如果你正确输入了命令，应该会再次获得
    "Query OK"的确认。


    完成后，使用此命令退出 `MySQL` 命令行界面：


    ```bash

    exit

    ```


    现在由于我们已经准备好了 `MySQL`，我们可以配置 WordPress 本身了。具体来说，我们必须配置 WordPress 以与我们刚刚创建的数据库进行通信。为了做到，你必须在
    WordPress 目录中创建一个 `wp-config.php` 文件。幸运的是，WordPress 包含一个实用的 `wp-config-sample.php`
    可以作为模板使用。


    输入此命令创建 `wp-config` 文件（假设你将 WordPress 安装在 `/var/www/html` 目录下）：


    ```bash

    sudo cp /var/www/html/wordpress/wp-config-sample.php /var/www/html/wp-config.php

    ```


    接下来，使用 `vi` 编辑新创建的 `wp-config` 文件：


    ```bash

    sudo vi /var/www/html/wp-config.php

    ```


    你会发现 `wp-config.php` 文件包含许多变量。更改以下三个变量：


    - 将 `putyourdbnamehere` 更改为 `wordpress`。

    - 将 `usernamehere` 更改为 `wordpressuser`。

    - 将 `yourpassword` 更改为 `1234`。


    一旦完成更改（当然，在此之前要双检查拼写），将 `vi` 切换到命令模式并保存修改后的文件。


    完成后，将 Apache 的默认 `index.html` 文件重命名为 `index.html.old`。否则，Apache 将访问默认示例页面而不是启动
    Wordpress：


    ```bash

    sudo mv index.html index.html.old

    ```


    现在一切都都应该准备就绪了。打开浏览器，并导航到 `http://127.0.0.1/`。（当然，如果你想从不同的机器访问它，请使用 WordPress 服务器的
    IP 地址，例如——`http://192.168.1.100.`。）如果你配置得正确，你将看到 WordPress 配置页面。你将选择一个用户名，WordPress
    将为你分配一个密码。按照提示操作，你将在 Linux Mint 机器上安装好了一个功能完整的 WordPress 博客。恭喜你！


    最后一点说明：如果你从本地浏览器配置博客，它可能会将你的博客地址设置为 `http://127.0.0.1\.`。如果你只想从主机查看它，这是没问题的，但如果你想通过网络查看，则需要更改它。幸运的是，你可以通过
    WordPress 管理界面中的“选项”（Options），然后进入“常规”（General），并更改博客的 URL 来快速完成。


    # 在 Linux Mint 上安装 MediaWiki


    Wikipedia，这个拥有数千处“需要引用”的百科全书运行在一个名为 `MediaWiki` 的开源 Web 应用程序。如果你没听过这个词，Wiki 基本上是一个依赖用户贡献的在线百科全书。Wiki
    的范围从像 Wikipedia 这样广泛的通用主题百科全书，到专注于单一主题（如电视节目或电脑游戏）。你可以非常轻松地在 Linux Mint 系统上安装
    `MediaWiki` 并托管自己的 wiki。在 Linux Mint 上安装 `MediaWiki` 需要三个步骤：首先是安装软件包，其次是配置先决，最后是运行脚本。

    '
- fmt: '

    Next, you’ll want to run the `mysql_secure_installation` script to tighten up
    security on your new MySQL server. Run this command from the prompt:


    ```

    sudo mysql_secure_installation

    ```


    First, the `mysql_secure_installation` script will ask you to enter the current
    password for the `MySQL` root user. After you do that, it will ask if you want
    to change the root password. Since you already set a root password, you can hit
    “n” (unless you want to change it again for some reason).


    Next, the script will ask you to setup the `VALIDATE PASSWORD` plugin, which checks
    passwords for appropriate strength. Hit Y to accept, and then set the password
    strength level by hitting `0` for Low, `1`, for Medium, and `2` for Strong.


    Next, the script will ask if you want to remove the anonymous user. The anonymous
    user, like anonymous access in FTP, lets someone log into `MySQL` without having
    a proper user account. For security reasons, it’s always best to remove the anonymous
    user, so hit “y” to continue.


    After that, the script will ask if you want to prevent the `MySQL` root user from
    logging in remotely to the `MySQL` server. Always hit “y” to forbid root remote
    access, since if an attacker guesses your root password, he can destroy your databases
    or steal the information they contain.


    After this, the script will ask if you want to remove the test database. `MySQL`
    includes a test database that anyone can access. Again, this is a security hole,
    so you’ll want to hit “y” to remove the test database.


    The script will then ask to reload the privilege tables so the changes take effect.
    Hit “y”, and the `mysql_secure_installation` script will conclude and return you
    to the command line.


    MySQL server is now installed on your Linux Mint system.


    The next step to installing MediaWiki is to install PHP version 7:


    ```

    sudo apt-get install php

    ```


    Then install the `MySQL` module for PHP:


    ```

    sudo apt-get install php-mysql

    ```


    Then install the `MySQL` module for PHP:


    ```

    sudo apt-get install php-mysql

    ```


    Then install the `mbstring` PHP module:


    ```

    sudo apt-get install php-mbstring

    ```


    Then install the `xml` PHP module:


    ```

    sudo apt-get install php-xml

    ```


    Next, restart Apache with this command so that it reloads with all the PHP extensions
    enabled:


    ```

    sudo /etc/init.d/apache2 restart

    ```


    Finally, download the MediaWiki software to your Desktop. You can obtain it from
    this address:


    https://www.mediawiki.org/wiki/Download


    If you’re working exclusively from the command line, you can use this command
    to download the MediaWiki software:


    ```

    wget https://releases.wikimedia.org/mediawiki/1.27/mediawiki-1.28.2.tar.gz

    ```


    (Note that the version number, and hence the file name, WILL change with future
    versions of MediaWiki, so double-check before downloading the file.)


    Use this command to unpack the MediaWiki files:


    ```

    tar -xzvf mediawiki-1.27.1.tar.gz

    ```


    Finally, move the MediaWiki files over to the `/var/www/html` directory. (In this
    command, I’ll assume you unpacked the MediaWiki files to your home directory;
    you will have to adjust the command if you unpacked them in a different directory.)


    ```

    sudo cp -r ~/mediawiki-1.27.1/* /var/www/html

    ```


    Now we’ll need to prepare MySQL for use with MediaWiki. MediaWiki requires a database
    and a database user, and full permission for its database user to access its database.
    To start the `MySQL` command-line client, use this command:


    ```

    mysql -u root -p

    ```


    Enter the password for the `MySQL` root user, and you''ll find yourself at the
    `MySQL` command prompt, which will look like this:


    ```

    mysql>

    ```


    Our next steps are to create a MediaWiki database, create a user to access that
    database, and grant our new user all rights to the MediaWiki database.


    (An important note before we continue, though. All commands made from the `MySQL`
    prompt must end with a semicolon to denote the end of the statement. Any commands
    that do not end with a semicolon will not work. With that in mind, let''s first
    create a database.)


    To create a database `fmedor` MediaWiki, use this command at the `mysql>` prompt:


    ```sql

    CREATE DATABASE mediawiki;

    ```


    The `MySQL` client will respond with a message that should say "Query OK, 1 row
    affect (0.00 sec)." This means the command was successful, and a new database
    named "newdatabase" has been created.


    Next, you''ll create a user who will access that database and assign a password
    to that user. In this example, we''ll assign a password of "1234". However, in
    real life, just as with the root user, you''ll want to assign a strong password.
    (This database user won''t have full control over the `MySQL` user as the root
    user does, but we will give it full control over the database we just created,
    and a malicious user who guesses the password could cause all kinds of trouble.):


    ```sql

    CREATE USER mediawikiuser IDENTIFIED BY ''1234'';

    ```


    Again you should get the "Query OK" confirmation message. The final step is to
    assign all privileges on the "mediawiki" database to the "mediawikiuser" user.
    Use this command to assign the permissions:


    ```sql

    GRANT ALL PRIVILEGES ON mediawiki.* TO mediawikiuser IDENTIFIED BY ‘1234'';

    ```


    That isn''t a typo - those are single quote marks ('''') instead of the usual
    double quote marks (") that were used in the command to set the password. `MySQL`''s
    internal syntax, alas, isn''t always consistent. Anyway, if you typed the command
    correctly, you should get the "Query OK" confirmation again.


    Once you are done, use this command to quit the MySQL interface:


    ```

    exit

    ```


    Once is done, rename Apache''s default index.html to index.old.


    ```bash

    mv index.html index.old

    ```


    Otherwise Apache will access the default page instead. Launch the installation
    by navigating here in your Linux Mint system’s web browser:


    http://127.0.0.1


    The installation script is simply a web form you’ll need to fill out. The default
    settings will work for the most part. You’ll need to pick a name for your wiki,
    and you’ll also need to enter the database name, the database user, and the password
    you created for MySQL. Once you have appropriate information, complete the script,
    and MediaWiki will be installed.


    However, you’ll need to do one more thing to finish the installation. After you
    complete the script, MediaWiki will generate a `LocalSettings.php` file and offer
    it to you for download. Make sure to download the file and transfer it to `/var/www/html`
    in order to complete the installation. (You may need to use SSH and SFTP to do
    this - see Chapter 10 on how to set them up.)


    MediaWiki should now be functioning on your Linux Mint system.


    # INSTALLING MOODLE ON Linux Mint


    Moodle is a virtual learning environment used by tens of thousands of schools
    across the world. Using Moodle, you can create a fully online course, or use it
    to supplement a traditionally-taught classroom course. Best of all, Moodle is
    free, and you can install it on Linux Mint. Installing Moodle on Linux Mint is
    a bit of work, but once it is finished, you’ll have a robust e-learning application.


    It’s quite possible to install Moodle on a machine running either the desktop
    or the server version of Linux Mint. This makes an excellent environment for testing
    and experimentation, since you can tweak and experiment to your heart’s desire
    without rendering your production site inoperable. Given that Moodle is free,
    if you have a bit of Linux knowledge, you can use Moodle in lieu of far more expensive
    alternatives.


    Let’s begin!


    First, install Linux Mint into your machine of choice. Once Linux Mint is installed
    and updated, you will need to install five pieces of software: the Apache web
    server, the MySQL database server version 5.7, PHP version 7, the MySQL module
    for PHP, and finally the WordPress software itself.


    First, install the Apache web server. To install Apache, go to a Terminal window
    or a command prompt and type this command:


    ```bash

    sudo apt-get install apache2

    ```

