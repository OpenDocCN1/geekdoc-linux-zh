    Caina 使用 `camalas` 账户登录，她将使用旧的 sh shell 作为她的命令行界面，而不是 bash shell。


    我们需要为 `useradd` 命令添加一些选项来使其变得更有效。首先，这里是使用该命令创建家目录的方法：


    ```bash

    sudo useradd -m camalas

    ```


    `-m` 选项导致 `useradd` 创建家目录。接下来，我们将添加另一个选项，并告诉 `useradd` 将 bash 设置为 camalas 的默认
    shell：


    ```bash

    sudo useradd -m -s "/bin/bash" camalas

    ```


    添加 `-s` 开关和 `"/bin/bash"` 告诉 `useradd` 将 bash shell 设置为 camalas 的默认 shell。现在，我们想通过
    `-c` 选项确保 camalas 的显示名称被正确设置为 Caina Amalas：


    ```bash

    sudo useradd -c "Caina Amalas" -m -s "/bin/bash" camalas

    ```


    通过这些选项，`useradd` 创建了一个名为 camalas 的新账户，将账户的显示名称设置为 Caina Amalas，为新账户创建了家目录，并将 bash
    设置为 camalas 的默认 shell。（注意，`useradd` 有许多选项，你可以在 `useradd` 的 man 页面中查看所有选项。）


    为了允许 Caina 使用 camalas 账户登录，你还需要做最后的一件事——你需要为新账户设置密码。你可以使用 `passwd` 命令执行此操作：


    ```bash

    sudo passwd camalas

    ```


    然后你可以为 camalas 设置密码。注意，你也可以在不带 `sudo` 的情况下使用 `passwd` 命令来重置你自己的账户密码。


    Linux Mint 的用户账户存储在 `/etc/passwd` 文件中。这是一个文本文件，所以你可以像查看其他文本文件一样查看它：


    ```bash

    cat /etc/passwd

    ```


    你会在那里看到很多账户，但它们大多数是用于各种系统服务的，你不需要担心它们。对于实际的用户账户，在 `/etc/passwd` 中你可以查看账户名、用户 ID
    (UID) 编号、账户默认组的组 ID (GID)、显示名称、家目录的位置以及默认 shell。


    你可能会想通过编辑 `/etc/passwd` 文件来手动添加用户账户。**千万不要**这样做！用户账户的密码存储在一个名为 `/etc/shadow` 的受限文件中，它需要与
    `/etc/passwd` 保持同步。手动编辑 `/etc/passwd` 可能会搞乱你的系统。


    # 删除用户账户


    你可能经常想要从你的 Linux Mint 系统删除账户。从命令行删除账户既快速又方便。事实上，这比通过图形界面操作要简便得多。


    在删除用户账户之前，你可能先考虑使用 `usermod` 命令将其锁定。锁定账户会禁用其密码，这意味着该账户无法再次登录系统。例如，锁定 camalas 账户：


    ```bash

    sudo usermod -L camalas

    ```


    （注意，选项、命令和文件名对大小写敏感，且 `-L` 选项必须大写。）


    如果你想完全删除一个账户，请使用带 `sudo` 的 `userdel` 命令：


    ```bash

    sudo userdel camalas

    ```


    此命令将从你的系统里删除 camalas 用户账户。然而，它不会删除 camalas 的家目录，这意味着她所有的个人文件和配置设置将留在系统的 `/home/camalas`
    文件夹中。要同时删除 camalas 账户和 camalas 的家目录，请使用带有 `-r` 选项的 `userdel`：


    ```bash

    sudo userdel -r camalas

    ```


    这将删除 camalas 账户和 camalas 的家目录。


    # 添加组


    和用户账户一样，你可以从 Linux Mint 命令行为用户创建组。在 Linux Mint 中创建组有几种不同的方法，这两种方法都是有效的。首先，你可以使用
    `groupadd` 命令添加一个名为 ghosts 的组：


    ```bash

    sudo groupadd ghosts

    ```


    或者，你可以使用 `addgroup` 命令：


    ```bash

    sudo addgroup ghosts

    ```


    这两个命令的作用相同，但如果你想查阅它们的 man 页面，它们拥有不同的潜在选项。


    （第二个不要脸的作者推销：在《Ghosts》系列小说中，Caina 属于 Ghosts，他们是 Nighmar 皇帝的间谍。）


    就像用户账户一样，Linux Mint 将所有的组都存储在一个文本文件 `/etc/group` 中。查看此文件：


    ```bash

    cat /etc/group

    ```


    那里的大多数组都是系统组，可以安全地忽略。你会发现所有的用户账户也同时列在组文件中——这些实际上是你用户账户的主组（Linux Mint 会为你的每个用户账户创建一个组，并将该用户账户分配为该组的主组）。你创建的任何组都会出现在文件的底部。


    # 将用户添加到组


    一旦你创建了组，就可以将用户添加到组。同样，有几种不同的方法可以实现。第一种方法是使用 `useradd` 命令。将 camalas 账户添加到 ghosts
    组：


    ```bash

    sudo useradd camalas ghosts

    ```


    你也可以使用 `usermod` 命令将用户添加到组：


    ```bash

    sudo usermod -G ghosts camalas

    ```


    # 从组中移除用户


    要从组中移除账户，请使用 `userdel` 命令：


    ```bash

    sudo userdel camalas ghosts

    ```


    这将从该组中移除 camalas。


    # 删除组


    要删除一个组，请使用 `groupdel` 命令：


    ```bash

    sudo groupdel ghosts

    ```


    这将消除该组，即使它仍然有成员。注意，在不先将账户从组中移除或删除账户之前，你无法移除任何用户的主组。（记住 Linux Mint 会为你的每个用户账户创建一个组。）


