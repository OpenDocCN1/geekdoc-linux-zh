- fmt: '

    There''s quite a bit of information here, but most of it is useful. The `eth0`
    refers to the first Ethernet connection on your system. The `indet addr` displays
    your system''s IP address, while `Mask` shows the subnet mask. `HWaddr` shows
    your Ethernet adapter''s MAC (Media Access Control) address, which is (theoretically)
    unique to each adapter. (Some wireless networks require you to supply your MAC
    address before allowing your system to connect.)


    You can pipe the output from the `ifconfig` command to `grep` to quickly find
    the specific item you want. Let''s say you just want to find the IP address:


    ```

    ifconfig | grep inet

    ```


    This time, the output will look like this, and you can quickly pick your IP address
    from the mix:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_1df91bf7.jpg)


    Likewise, you can quickly find your computer''s MAC address with `ifconfig` and
    `grep`:


    ```bash

    ifconfig | grep HWaddr

    ```


    You can easily pick out your MAC address from the output:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m368c6e.jpg)


    How do you find your system''s default gateway? You need to use another command
    for that:


    ```bash

    ip route

    ```


    The `ip route` command will spit out an output like this:


    ![](tmp_38c39953b6c998474c8b24733c8ecdee_7h3Abx_html_m44ce4bfb.jpg)


    Look for the line that begins "default via.`. Your system''s default gateway will
    be the IP address after those two words.


    Now that you know how to find your IP address, let''s talk about how to actually
    obtain an IP address for your Linux Mint system.


    ### GETTING AN IP ADDRESS FROM DHCP


    Most of the time, your computer will receive an IP address from a DHCP server.


    Configuring each individual computer with an IP address by hand is time-consuming
    and error prone; if one or more computers receive the same IP address, they won''t
    be able to connect due to the address conflict. DHCP, which stands for "Dynamic
    Host Configuration Protocol", takes the guesswork out of the process. When a computer
    plugs into a Ethernet network (or connects to a wireless network), it sends out
    a request for a DHCP server. If there''s a DHCP server on the network, it supplies
    the computer with an IP address, and the DHCP server ensures that no two computers
    receive the same IP address.


    Most of the time, when you plug into a new network, you''ll receive a DHCP address
    automatically. If you don''t, however, try this command:


    ```bash

    sudo dhclient

    ```


    This will manually tell your system to search for a DHCP server and accept an
    address. If this command doesn''t work, that means either the network you''re
    using doesn''t have a functioning DHCP server, or that something is blocking the
    DHCP server from communicating with your computer.


    ### RELEASING A DHCP ADDRESS


    DHCP addresses come with a "lease", which means the amount of time your computer
    is allowed to keep the address. Usually, your computer will contact the DHCP server
    at the halfway point before the lease expires, and ask for permission to keep
    it, which the DHCP server almost always grants.


    Sometimes you want to release a leased IP address early - like if your network''s
    DHCP server changes, or if your computer refuses to release its IP address. You
    can do this with the `dhclient` command and the `-r` option:


    ```bash

    sudo dhclient -r

    ```


    This releases your IP address, and you can then use `sudo dhclient` to contact
    a DHCP server to receive a new one.


    ### SET A STATIC IP FROM THE GUI


    DHCP address are convenient, but they have one big weakness - they can change
    quickly. If the lease length is short enough, your IP address could be 192.168.1.1
    on Monday and 192.168.3.45 on Tuesday, depending on which addresses the DHCP server
    happens to have available. For laptop and desktop computers this normally isn''t
    a big deal. Servers, however, need to have consistent IP addresses so client computers
    can locate them.


    This is where a "static IP" address comes in. A static IP is one that you manually
    assign to a computer, one that it keeps forever or until you change it. You''ll
    need to make sure that it doesn''t conflict with your DHCP server, so you''ll
    need to either reconfigure your DHCP server to exclude the static address from
    its address pool, or ask your system administrator to do it.


    Here''s how to set a static IP for your system''s Ethernet adapter from the GUI:


    - Launch Network Connections by clicking on the `mintMenu` and searching for it
    in the search field.

    - When the Network Connections dialog box opens up, click on the `Wired` tab,
    and then on the connection labeled `eth0`. Click on the `Edit` button.

    - When the Editing `eth0` box opens up, click on the tab for `IPv4 Settings`.

    - In the `IPv4` box, change the `Method` drop-down box from `Automatic` to `Manual`.

    - Under the `Addresses` heading, click the `Add` button to add a static IP, subnet
    mask, and default gateway.

    - Add your DNS server to the `DNS Servers` line.

    - Click `OK`.


    This is kind of an involved procedure - I think it''s easier to set a static address
    from the command line, which we''ll cover in the next section.


    ### SET A STATIC IP


    To set a static IP address from the command line, you''ll need to edit a pair
    of text files.


    To set a static IP address from the command line in Linux Mint, you''ll need to
    edit a pair of text files - specifically `/etc/network/interfaces` and `/etc/resolv.conf`.
    Only root has permission to edit the files, so you''ll need to use `sudo` in conjunction
    with `vi`.


    First, make a backup copy of the interfaces file:


    ```bash

    sudo cp /etc/network/interfaces ~/interfaces.bak

    ```


    This will make a backup copy in your home directory. That way, if something goes
    wrong, or you make a mistake, you can quickly restore the backup copy.


    Next, open the interfaces file:


    ```bash

    sudo vi /etc/network/interfaces

    ```


    Initially, the file only contains information about your loopback address. (The
    loopback address is `127.0.0.1`. It doesn''t go anywhere, and it''s used to test
    if your TCP/IP stack is working properly):


    ```

    auto lo

    iface lo inet loopback

    ```


    To give your system a static IP, you''ll need to make some changes. Let’s say
    you want to assign a static IP of `192.168.1.2` to your `eth0` network connection
    (which, as you''ll recall, is the first adapter - additional adapters will be
    `eth1`, `eth2`, and so on), with a subnet mask of `255.255.255.0` and a local
    gateway of `192.168.1.1`:


    ```

    auto eth0

    iface eth0 inet static

    address 192.168.1.2

    netmask 255.255.255.0

    broadcast 192.168.1.255

    gateway 192.168.1.1

    ```


    Once you’ve added these lines, enter Command mode in `vi`, and save and quit (you
    can do this with the `qw` or the `exit` commands). You''ve added your static IP,
    subnet mask, and default gateway, but you''ll still need to add a DNS server,
    and you can do that by editing the `/etc/resolv.conf` file:


    ```bash

    sudo vi /etc/resolv.conf

    ```


    To set a static DNS server with the address of `192.168.1.10`, switch `vi` to
    Insert mode add this line to the file:


    ```

    nameserver 192.168.1.10

    ```


    Save the file, and exit your text editor.


    You’ll then to have your system load the new IP configuration. You can do that
    by rebooting, but if that takes too long, you can use this command to force Linux
    Mint to re-read the configuration files:


    ```bash

    sudo ifup eth0

    ```


    Your system will then have a static IP address.


    ## Chapter 10 - Basic File Sharing with Samba


    One of the most common uses of a Linux Mint machine – whether a server or a desktop
    – is to share files across the network. If you’re not familiar with the term,
    “file sharing” means to make a folder on your system available to clients on the
    network. From their own machines, users are able to access your shared folder
    from their computers, and depending upon how you’ve configured the security, they
    can copy the files for themselves, alter the files, add new files, or even delete
    files.

    '
