  raw: 'There are a number of home video game console emulators available freely available
    for Linux, such as PCSX2, ePSXe, Dolphin, FCEUX, and more.  FCEUX is a free and
    open source Nintendo Entertainment System emulator.  It is also capable of emulating
    the Japanese’s Family Computer Disk System.  FCEUX was resurrected from the abandoned
    FCE and FCE Ultra by Anthony Giorgio and Mark Doliner.  FCEUX includes features
    such as debugging, gameplay video recording, and ROM hacking tools.  The emulator,
    ePSXe, is a Sony Playstation emulator.  It stands for “enhanced PSX emulator”. 
    The first release of ePSXe was on October the 14th 2000.  The emulator was later
    released for the Android mobile operating system on August the 30th 2012.  When
    ePSXe 1.6.0 was released rumors were soon started that the development for the
    emulator has stopped.  These rumors claimed that the development had stopped due
    to a loss of the original source code due to a hard disk failure.  On April 5th
    of 2008, the developers of the emulator ePSXe made a public statement revealing
    that development would continue.  On May 24th 2008, ePSXe version 1.7.0 was released. 
    What makes ePSXe unique is the ability to control and replace the plugins that
    it uses.  The graphical processing unit plugins can rung with OpenGL or the Glide
    API.  The sound processing unit plugin emulates the sounds and music of the games. 
    There is a CD-ROM plugin as well as an Input plugin.  Retro Gamer stated that
    ePSXe is “the best free PlayStation emulator”.


    PCSX2 Is a Sony PlayStation 2 emulator.  It is free and open source software under
    the GNU General Public License.  Like ePSXe, PCSX2s architecture supports plugins. 
    Development for this emulator began in the year of 2001, led by programmers known
    as Linuzappz and Shadow.  It is reported to be compatible with 94.9% of the 2,586
    tested Sony PlayStation 2 video games.  Performance is usually bottle necked by
    the central processing unit of the system that is running off of, as emulating
    hardware as complicated as a PlayStation 2 is extremely CPU intensive.  The emulator
    has been described by Matthew Humphries of Geek.com as “an impressive piece of
    work".


    Dolphin is a free and open source Nintendo GameCube and Nintendo Wii emulator. 
    Dolphin was released in September of the year 2003 by the programmer Henrik Rydgård
    and the programmer know as F|RES.  The Dolphin emulator was officially discontinued
    in the year of 2004, but was revived by the developers in the year of 2005.  Dolphin
    became a free and open source project on the date of July the 13th of the year
    2008.  The source code was released publicly on an SVN repository on Google Code
    under the GPLv2 licenses.  By the month of April of the year 2009, most of the
    commercial GameCube games and commercial Wii games could be fully played with
    minimal problems.  The Dolphin emulator has been very well received, for example,
    many prefer the look of The Legend of Zelda: The Windwaker being ran by the Dolphin
    emulator over the Nintendo Wii U version of the game.


    DeSmuME is a free and open source Nintendo DS emulator.  The original emulator
    was in French, but was later translated into English and other languages. 


    Gaming is wide and varied on Linux thanks to emulators like those mentioned above. 
    Taking the time to set them up correctly is difficult, though, so be sure to read
    up online on the correct way to play older console games on Linux.  With emulators,
    ROMs, Steam, and other proprietary games released on Linux, the computer users
    never need to be bored.  Previously only Windows had good video game support,
    but now Linux is joining the ranks of gamers.


    Advanced Concepts in Linux


    The File Structure


                  In Linux-based operating systems there are two kinds of major partitions:
    the data partition, and the swap partition.  The data partition includes the normal
    Linux system data and personal user data as well.  The swap partition is an expansion
    of the computer systems physical memory (RAM).  Most Linux operating systems require
    both partitions to run efficiently. 


    Swap is an extension of RAM.  When programs need extra space, the swap partition
    dedicates some of its data to the program.  The Windows equivalent of this is
    the pagefile. 


    The default filesystem in Linux is ext4, and drives formatted in Linux will usually
    use it.  This is not beneficial when sharing data back to a Windows system, because
    Windows cannot normally read ext4.


    Below are the folders found on the root of a drive in Linux.  An important feature
    of Linux distros is that every object on the computer is a file.  This means that
    every peripheral, piece of data, hardware component, and terminal command is represented
    as a file in Linux.  Accordingly, everything has to be stored somewhere, and the
    folders below contain the entirety of the computer.


    | Linux File System |


    | Bin | This is where shared programs are located.  |


    | Boot | Where boot files, such as the kernel and boot loader are stored.  |


    | Dev | Has files that point to CPU hardware.  The files in here can be referenced
    when you are working with the CPU |


    | Etc | Config files and settings. |


    | Home | User’s data is stored in home.  When a user creates a file in their documents,
    desktop, or downloads, it can be found within this folder.  The Windows equivalent
    is “C:/Users” |


    | Initrd | Not on all distros.  Used for booting. |


    | Lib | Library files, which give functionality to applications are in here. |


    | Lost+found | Ext4 is a journaling file system.  In short, this means that any
    files that become corrupt can potentially be saved and moved to this folder. |


    | Misc | When removable storage are plugged in the devices can be accessed here.
    |


    | Mnt | Mnt stands for mount, and this directory is how you interact with mounted
    hardware. |


    | Net | This is where network folders are typically mounted. |


    | Proc | A resource accessed by programs relating to the file system. |


    | Sbin | The place where system terminal commands are located.  |


    | Tmp | A temporary directory. |


    | Usr | Where user programs are installed |


    | var | For log files |


      For beginner users the home directory is the most important.  Each user created
    gets a folder in home, and within that folder is where the familiar documents,
    downloads, music, videos, and desktop folders are created.  If you are trying
    to find your files, there is a good chance they are located there.  The rest of
    the root folders are usually only used by applications and Linux professionals,
    but it is still good practice to know what is on your device.


    WINE


                  An astute user might have noticed that Linux does not run exe files. 
    For Linux users that refuse to give up certain Windows programs, WINE can help. 
    WINE is a ”compatibility layer” capable of running Microsoft Windows files in
    order to “emulate” applications as if they were running in Windows.  For Linux
    users this means that you can run Linux without fully giving up Windows.  WINE
    is not a replacement for running Windows programs, though.  To install WINE, the
    following commands must be run:


    sudo apt-get-repository ppa:ubuntu-wine/ppa


    sudo apt-get update


    sudo apt-get install –y wine1.7


    And to run an exe it must be downloaded.  Using a terminal navigate to the download
    location and type wine programname.exe.  There is certainly a large number of
    configuration options (winecfg) to sort through, and configuring a particular
    program to run perfectly in WINE is a long process.  The huge difficulty and confusing
    nature of WINE makes it a tough program to use, but it is a great way to use parts
    of Windows that Linux just doesn’t provide.  For those wishing to fully immerse
    themselves in Linux, though, WINE is not recommended at all.  Try installing a
    FOSS alternative to the program you are trying to run instead.


