    如果安装成功且你选择了双系统，那么每次启动电脑时你都会看到 `GRUB`，即通用统一引导加载程序。`GRUB` 会询问你想启动哪个操作系统，因此每次在计算时，你都可以在
    Linux 和 Windows 之间进行选择。


    ## 使用 Ubuntu


    对于那些只用过 Windows 类型界面的用户来说，Ubuntu 并不完全陌生。它仍然有“桌面”和“开始菜单”，但物品的布局略有不同。你可以像通常一样启动应用程序：点击启动栏上的图标或在点击开始按钮后进行搜索。如果你在桌面上，通常已经连接了网络，但如果你使用的是笔记本电脑，可能需要通过右上角连接
    Wi-Fi。总的来说，Ubuntu 的易用性很高，你应该能够很快上手。浏览网页并尝试默认应用程序，以直观地感受 Linux 操作系统的工作和运行。


    ## 终端


    Linux 与 Windows 的区别在于它提供了一个类似于旧 DOS 计算机的额外文本界面。通过终端，可以运行对 PC 执行操作的。启动终端在每个发行版中有所不同，但
    `ctrl+alt+T` 是一个常用的快捷键。进入终端后，你可以浏览文件系统，并通常以与图形用户界面相同的控制级别使用计算机。用户首先输入命令并按回车执行。以下是几个基本命令。在阅读本书时，任何*斜体*文本均指它是一个终端命令。


    | 命令 | 别名 | 用途 | 示例 |

    | :--- | :--- | :--- | :--- |

    | `cd` | 切换目录 | 输入更改当前文件夹 | `cd desktop` |

    | `pwd` | 显示工作目录 | 显示当前文件夹名称 | `pwd` |

    | `shutdown` | 关机 | 关闭当前系统 | `shutdown –h now` |

    | `ls` | 列 | 列出当前文件夹下的所有文件 | `ls` |

    | `cp` | 复制 | 复制指定的文件并可选指定新名称 | `cp picture.png dog.png` |

    | `mkdir` | 创建目录 | 创建一个指定名称的新文件夹 | `mkdir Documents` |

    | `rm` | 删除 | 删除指定的文件 | `rm dog.png` |

    | `rmdir` | 删除目录 | 删除指定的文件夹 | `rmdir Documents` |

    | `apt-get` | 高级软件包工具 - 获取 | 在 Ubuntu 类型系统中运行的安装新软件的命令 | `apt-get install minecraft`
    |

    | `.` | 运行 | 点用于运行文件，例如脚本。 | `./a.out` |


    如果你用过 DOS，上述内容可能看起来很熟悉。这里有一个旨在掌握终端的练习。


    1. 启动终端。使用 `ctrl+shift+T` 或在程序菜单中找到它。

    2. 输入 `pwd` 找到我们现在所在的位置。

    3. 输入 `cd Desktop` 进入桌面文件夹。

    4. 输入 `mkdir Notes` 创建一个名为 `Notes` 的新文件夹。

    5. 输入 `cd Notes` 进入该文件夹。

    6. 使用 `nano secretfile.txt`，我们将在内置文本编辑器 `Nano` 中开始编辑一个新文件。

    7. 输入一些秘密！按 `ctrl+x` 保存并退出程序。

    8. 输入 `ls` 列出当前目录的内容。你应该能在那里看到 `secretfile.txt`。

    9. 使用 `cp secretfile.txt totallynormalfile.txt`，我们复制该文件并创建一个新文件。


    此时，你应该最小化终端，并在桌面上看到你刚刚创建的文件夹和文件。遵循上面的指令可能比你平时创建文件夹和文件要花费更长的时间，但通过练习，你可以通过终端以快速速度操作
    Linux 系统。此外，掌握终端是非常困难的，但它对你的发行版提供了 GUI 可能无法提供的深层控制。总的来说，绝对建议 Linux 用户学会会如何熟练地使用终端。


    ## Linux 软件


    你可能会惊讶地发现，当你“转投”到 Linux 时，可能不需要改变你的软件储备。技术偏向型用户可能已经熟悉 Linux 上可用的某些软件，例如 Mozilla
    Firefox、`Google Chrome`、`Opera`、`Adobe Reader`、`Mozilla Thunderbird` 和 `VLC`。


    如果机器上没有安装某个软件，获取它将轻而易举。Ubuntu 包含了“Ubuntu 软件中心”应用程序，它充当 Linux 程序的的“应用商店”。通过友好的界面，你可以搜索并一键下载许多程序——其中许多列在下方。不过，较冷门的程序可能不会列在软件中心中，因此你必须通过终端安装它们。在终端窗口中输入以下内容：


    ```bash

    sudo apt-get install vlc

    ```


    `sudo` 是一个终端前缀，指示系统以可能的最高权限运行。运行 `sudo` 时需要密码。`Apt-get` 是 Ubuntu 应用程序；通过指定 `install`，我们表达了意图。`Vlc`
    是我们想要的程序名称（`VLC` 播放器）。因此，通过终端中的这一行，我们就下载并安装了整个应用程序。将 `vlc` 替换为任何应用程序名称，Ubuntu
    就会下载它。以下是每个类别中最流行的应用程序。


    | 浏览器


    | Mozilla Firefox |

    | :--- |

    | 熟悉、高度可定制且是开源软件 (FOSS)。`Firefox` 在 Windows 上广泛使用。 |


    | Google Chrome |

    | :--- |

    | 快速、稳定且兼容。`Google Chrome` 在 Windows 上广泛使用。 |


    | Opera |

    | :--- |

    | 轻量且基于 Chrome 运行。`Opera` 在 Windows 上广泛使用。 |


    | Midori |

    | :--- |

    | 简单。`Midori` 是 Elementary OS 的默认浏览器。 |


    | Dillo |

    | :--- |

    | 小、稳定且快速。 |


    | Lynx |

    | :--- |

    | 文本浏览器。`Lynx` 是一个文本浏览器。 |


    | W3M |

    | :--- |

    | 另一个文本浏览器。 |


    ### 媒体播放器


    | VLC |

    | :--- |

    | 在 Windows 上同样可用。一个非常兼容且实用的媒体播放器，可以处理音乐、视频、播客或直播频道的任何内容。 |


    | Miro |

    | :--- |

    | 独特之处在于它能够从 Crackle、Hulu 和 Yahoo Screen 等源连接并下载视频。 |


    | mplayer |

    | :--- |

    | 支持广泛的解码器和文件格式。非常小且可定制。Linux 老兵的首选媒体播放器。 |


    ### 纯音频播放器


    | DeaBeef |

    | :--- |

    | 极简主义且可定制。这款音频播放器最引起 Windows `Foobar2000`粉丝的共鸣。你可以更改 `DeaBeef` 的布局和设置来实现自己的音频播放器。
    |


    | Clementine |

    | :--- |

    | 跨平台、免费开源。支持大型音乐库。Android 和 iPhone 用户可以高兴了，因为 `clementine` 支持向移动库添加音乐。`iTunes`
    的绝佳替代品。 |


    | Cmus |

    | :--- |

    | 最轻级的音乐播放器，因为它运行在终端界面上。 |


    | Aqualung |

    | :--- |

    | 出色的无缝播放。Jethro Tull 粉丝的最佳选择。 |


    ### 图像编辑器


    | GIMP |

    | :--- |

    | 开源图像编辑的首选和最佳选择。Windows 同样可用，`GIMP` 免费提供了 `Photoshop` 的许多功能。高级编辑器通常在各种发行版中预装，但对于任何进行图像编辑的人来说，它都是必备的。
    |


    | Pinta |

    | :--- |

    | `Pinta` 是 Linux 版 `MS-Paint`。对于简单的图像编辑，选择 `Pinta` 不会出错。 |


    ### 文件管理器（Windows 资源器的 Linux 版本）


    | GNOME Commander |

    | :--- |

    | 一个优雅但运行缓慢的文件管理器，是 Gnome 桌面环境的默认管理器。这个管理器非常适合动画和图标，你可以通过这个应用程序创建一个精美的桌面。 |


    | PCManFM |

    | :--- |

    | `LXDE` 的默认文件管理器。非常适合轻量且简单的图形用户界面。 |


