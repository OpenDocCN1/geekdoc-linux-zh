  trans: '


    Xfce 是一个快速、低资源占用且美观的桌面环境。它经常与 LXDE 竞争成为最轻量级的桌面环境（DE），但 LXDE 更加关注速度，而 Xfce 则兼顾了功能性和速度，创造了一个全能的轻量级
    DE。Xfce 的布局对用户友好且响应迅速，并且具有可定制性。


    KDE 是一个为高性能电脑设计的桌面环境。默认包含 KDE 的发行版以功能丰富和可定制而闻名，尽管运行起来有些缓慢和卡顿。KDE 的组件会引起任何喜欢 Windows
    Vista 用户的共鸣，而华丽的过渡效果对于喜欢享受计算体验的人来说充满了乐趣。它的定制化程度之高，以至于两个用户同时运行 KDE 时，彼此甚至不知道对方也在运行同一个
    DE。


    总而言之，每个发行版都会预装一个桌面环境。DE 控制着桌面屏幕的外观和交互，它们与窗口系统和窗口管理器（下文将解释）共同工作，提供您的体验。


    # 窗口系统


    基于 Linux 的操作系统使用某些技术为用户提供设备界面。图形用户界面（GUI）通常遵循一种被称为窗口系统的方案。窗口系统是 GUI 的一种类型，它以一种现代用户非常熟悉的方式实现了窗口、图标、菜单和指针。基于
    Linux 的操作系统主要提供两种窗口系统——X 窗口系统（X Window System）和 Wayland。了解这些系统如何工作是至关重要的，因为它们通常是我们与
    Linux 计算机交互的方式。


    X 窗口系统为图形用户界面环境提供了基础框架，并通过允许用户与鼠标和键盘交互，控制应用程序窗口的绘制和移动。X 窗口系统并不强制规定图形用户界面，因此应用程序可以拥有任意数量的视觉样式。应用程序的外观和感受由应用程序本身处理，X
    窗口系统仅负责将其绘制到屏幕上。


    Wayland 是 X 的一种替代方案，作为自由开源软件存在。Wayland 旨在用更现代、更简单的屏幕绘制方式取代 X 窗口系统。与 X 窗口系统一样，Wayland
    在 MIT 许可证下发布（另一种受自由开源软件启发的许可证）。Wayland 背后的团体还为 Wayland 开发了一个名为 `Weston` 的显示合成器（合合成器是另一组用于方便将窗口绘制到屏幕上的复杂工具）。在
    Wayland 的常见问题解答中，有人问过“X 有什么问题吗？”，Wayland 项目的回答通常很直接：X 存在功能膨胀问题，并包含了早已过时的功能的遗迹。由于代码仍然留在
    X 中，为了万一有人在系统中使用它们，这些功能在 X 的所有发布版本中必须都支持。Wayland 自豪于将这些过时且废弃的代码变为完全可选，同时保持必要的“核心”脚本处于良好状态。


    基本上，Wayland 想要在推进 X 背后的技术的同时，抛弃陈旧的设计和功能。一个很好的对比是微软的 Internet Explorer 和它们较新的 Edge
    浏览器。Edge 的创建是为了改进 IE 的概念，但抛弃旧的设计和遗留兼容性问题。不过，除非你从零构建 Linux 操作系统，否则大多数发行版都已安装了窗口系统。


    # Init


    在 Linux 中，`init` 是初始化（initialization）的缩写，它是计算机系统启动过程中启动的进程。`init` 是一个守护进程，系统将一直运行它直到关机时刻。`init`
    由内核使用静态文件名启动——如果内核无法启动 `init`，系统将发生“内核恐”（kernel panic），导致致命的系统错误。自 2015 年 3 月以来，大多数基于
    Linux 内核的操作系统已采用 `systemd` 作为默认 init，尽管由于其单体性质引起了巨大争议。`systemd` 的使用争议之大导致 Debian
    项目的成员退出并分支创建了名为 Devaun 的自己的操作系统。`systemd` 和 init 非常重要且备受讨论，因为它们可以控制内核、应用程序和用户如何交互。像
    `systemd` 这样一个全能且编写糟糕的 init 破坏了 Linux 提倡的自由和开放的哲学原则。


    # 更多终端


    最终，终端将为你的 Linux 计算机提供最多的功能。在学习了 Linux 基础知识后，你可以真正开始通过文本界面与 PC 交互。例如，Linux 优于 Windows
    的地方在于软件更新简单。在普通的 Windows 安装中，每次更新你都必须卸载程序并安装最新版本，而 Linux 允许你通过简单的命令同时更新系统上的所有程序。在终端（在我们的
    Ubuntu 系统上）输入以下命令：


    ```

    sudo apt-get update

    ```


    观察丰富的用户会记得 `apt-get` 也是我们安装新程序的方法。然而，对于安装，我们输入 `apt-get install`；对于更新，我们输入 `apt-get
    update`。


    你可能尝试过通过终端安装程序，却被告知该应用程序不存在。这句话的意思是程序在已安装的仓库中不存在。仓库是包含应用程序链接的数据仓库。默认情况下，Ubuntu
    只有几个仓库，但 Linux 用户可以自由安装更多。方法如下：


    ```

    sudo add-apt-repository "repository here"

    ```


    仓库开启了许多新软件可供尝试，因此请务必在网上找到最佳仓库列表并进行尝试。从终端启动程序是另一项易任务，只需输入程序名称即可。例如，要启动 GIMP 软件只需输入
    `gimp`。你还可以在命令中指定参数，例如要打开哪个文件。通过 `gimp dog.png`，我们可以仅用一个命令打开 gimp 和 dog.png。


    解释每一个终端命令及其用法几乎需要永远的时间，因此下面是一个包含常用中间命令的图表。


    | 命令 | 别名 | 用途 | 示例 |

    | :--- | :--- | :--- | :--- |

    | `ifconfig` | IF/IP 配置 | 显示各种网络信息。 | `ifconfig` |

    | `df` | 磁盘空间 | 提供计算机中磁盘驱动器及其剩余可用空间的信息。 | `df` |

    | `uname` | Unix 名称 | 提供有关你所用计算机的信息。 | `uname -a` |

    | `passwd` | 密码 | 仅输入命令即可允许更改用户密码。在没有密码的新系统上务必这样做。 | `passwd` |

    | `chmod` | 修改文件模式位 | Linux 文件具有权限以确保安全。文件对于读取、写入和执行可以有不同的访问级别。`chmod` 修改所有权限的级别。
    | `chmod 777 dog.png` |

    | `wget` | 网络下载 | 通过终端从指定的网站下载文件。这对于在不打开整个浏览器的情况下下载东西非常有用。 | `wget http://crouton.net/crouton.png`
    |


