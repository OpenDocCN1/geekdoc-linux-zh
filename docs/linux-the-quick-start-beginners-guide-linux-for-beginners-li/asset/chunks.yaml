    # Linux: The Quick Start Beginner’s Guide


    (Linux for Beginners, Linux Command Line, Linux Operating System, Learn Linux)


    ## Table of Contents:

    - [Introduction](#part0000_split_002.html_Introduction)

    - [Linux vs. Windows](#part0000_split_003.html_Linux_vs_win)

    - [Background](#part0000_split_004.html_Background)

    - [Choosing a Distribution of Linux](#part0000_split_005.html_Many_distros)

    - [Installing Linux](#part0000_split_006.html_Installing_Linux)

    - [How Linux Works](#part0000_split_007.html_How_Linux_works)

    - [Having Fun with Linux](#part0000_split_008.html_Fun_with_Linux)

    - [Advanced Concepts in Linux](#part0000_split_009.html_Advanced_Concepts)

    - [Conclusion](#part0000_split_010.html_Conclusion)


    ## Introduction


    ### What is Linux?

    Linux is a free and open-source OS kernel used around the world for many purposes.
    The kernel facilitates full-fledged operating systems that are free and open source
    by giving software a way to interact with the hardware in our devices. Linux is
    both widespread and prevalent in the computing world- there is a good chance that
    if you reach in your pocket you’ll find a Linux machine right now (smartphones!).
    Operating systems using Linux can be found running most of the world’s super computers,
    and Linux is even used by many government agencies. It is found everywhere from
    the New York Stock Exchange to the Sony PlayStation.


    Does this mean that Linux is only for big-wigs and expensive supercomputers? Absolutely
    not, because Linux can easily be used to write papers, browse the internet, watch
    YouTube, or check email. Linux operating systems are free, so they are a fantastic
    alternative to the expensive Windows and Apple operating systems. There are many
    different distributions of Linux, often referred to as “distros” that are specialized
    to suit differing needs. This book will go through some history, various distributions,
    and a few uses of Linux-based operating systems. Overall it is highly recommended
    that everyone learn at least a little bit about Linux, because it is used in so
    many places.


    ## Linux vs. Windows

    An operating system (OS) is the backbone of a computer, and without one a computer
    is nearly useless. Normally a computer will run an OS such as Windows, but computer
    users are free to install any OS that can run on their hardware. While we are
    all familiar with how Windows computers work, taking the plunge and installing
    Linux offers many benefits. Besides being free, Linux is more secure, more reliable,
    and more open.


    Windows machines are plagued with viruses. Antivirus applications are expensive
    and can slow down even the strongest Windows PCs. Linux is such a secure OS, and
    it extremely difficult to contract a virus. Fortune 500 companies choose to run
    their computers with Linux because of the enhanced security and unparalleled reliability.
    Anybody suffering from virus and malware problems should surely consider giving
    Linux a try.


    Linux is fast, even on the oldest computers. An old device running Windows XP
    might be useless currently, but installing Linux breathes a new breath of life
    into dying technology. Some distributions are made specifically to be lightweight
    and responsive, which can extend the useful life of a computer by many years.


    The kernel and software that comes with Linux operating systems are free and open
    source, and FOSS applications offer nearly identical functionality compared to
    their expensive counterparts. For example, Adobe Photoshop costs upwards of $500,
    but Linux’s free alternative “GIMP” is free. Even Microsoft Windows 10 costs about
    $120, but the most popular Linux distro, Ubuntu, costs absolutely nothing. For
    every paid component of a Windows PC there is a free Linux equivalent. Even the
    method of downloading new programs is improved in Linux. On a Windows PC a user
    must navigate a website and potentially download Trojan horse viruses to retrieve
    new software, but on Linux there are secure and safe repositories that download
    software with ease.


    Compatibility remains high with Linux systems, for you can install Linux on a
    wide range of devices. Whether it is a brand new computer, an old dinosaur, or
    a laptop and tablet, Linux is compatible. Compare that to Apple’s OSX, which can
    only run on iMacs, or Windows 10, which can only run on newer computers. Some
    tech geeks have even managed to install Linux in cars and internet-enabled coffee
    pots! What this means is that you will never have to worry if your device is compatible,
    or if you need to buy a new computer. So long as the device still turns on there
    is a large chance that Linux will run on it.


    Many people choose Android over iOS for deep customization. The same holds for
    choosing Linux over Windows, because Linux offers entire software freedom- many
    distros are made for the tinkerer and customizer. In Windows you can change your
    wallpaper and color scheme, but the personalization ends there. In addition to
    colors and placement, Linux allows the user to add and remove components at will,
    creating a unique environment. When it comes down to it, Linux prevails over Windows
    in almost every category. Linux is free, secure, open, customizable, and stable.
    Although not every computer user is used to Linux-based operating systems, they
    will definitely benefit by switching away from Windows. Bricked devices, slow
    and antiquated computers, and virus infested machines can all be saved by installing
    Linux. If the possibility of a brand-new computing experience piques interest,
    continue reading to find out all how Linux works and how to get a copy installed
    on your computer.


    ## Background

    There is a lot of information surrounding Linux, its creation, and the contributing
    parties. Additionally there are a few parts of Linux that are interesting and
    unique. This chapter will discuss the roots of Linux and how it became the de
    facto operating system.


    ### Some History on Linux

    On August 25th, 1991 in Finland, Helsinki, Linux was conceived. The then twenty
    year old Finnish Student Linus Benedict Torvalds publicly announced the creation
    of the Linux kernel in a Usenet post to the newsgroup `comp.os.minix`. Minix was
    a currently existing kernel that Linux became based off of, and the pedigree of
    both can be traced to an older operating system known as UNIX. The post referred
    to Torvalds’s project as a hobby and small scale endeavor that would not carry
    much weight in the computing world and might not even be compatible with all computers.


    The humble and relatively quiet beginnings were a precursor to the industry giant
    that Linux would become. The kernel grew from a hobby project into a usable product
    in a short amount of time and in 1993 a large team of 100 volunteers contributed
    to the project. Later, Linux was fused with Richard Stallman’s GNU core libraries
    to create the full kernel version 1.0. Linux Torvalds initially intended for his
    project to be named `Freax`, but one of Torvalds’ coworkers at Helsinki University
    actually changed the name to Linux secretly and Linus later agreed to it. It is
    with version 1.0 that Linux became usable as an operating system. 3rd parties
    then added software suites and additional functionality on top of the Linux kernel
    to create “distributions”, the oldest being Slackware and Debian.

