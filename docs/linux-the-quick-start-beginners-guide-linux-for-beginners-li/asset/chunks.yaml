    \ you do your experimenting on.  It was initially developed to teach school children\
    \ how to program, but the Pi quickly turned into a popular tool for hobby projects. \
    \ Since it runs Linux, do-it-yourselfers can take their weekend projects to the\
    \ next level with a Pi and some Linux knowledge. \n\nProgramming on Linux\n\n\
    \ Linux, OSX, and other UNIX-based operating systems use the terminal for many\
    \ functions, just as they have historically before GUIs became common.  The first\
    \ programmers would use the terminal as their “toolchain” to create, code, compile,\
    \ and run their software.  Coding functionality was never dropped from the terminal,\
    \ so serious programmers still prefer the ease of use received from Linux’s coding\
    \ workflow. Applications can be written in a terminal editor such as nano, then\
    \ be compiled with the built-in gcc GNU compiler, and finally run all without\
    \ leaving the default programs in almost all Linux distros.  Any programmer interested\
    \ in coding but disheartened in the large, complex IDEs available for Windows\
    \ should switch to an OS where programming and tinkering is encouraged.  Here\
    \ is a small example of the workflow for programming “hello world” in C.\n\nIn\
    \ terminal, type nano to access a small text editor.  Type:\n\n#include <stdio.h>\n\
    \nint main(){\n\n              printf(“Hello World!\\n”);\n\n              return\
    \ 0;\n\n}\n\nPress ctrl+x to quit, and “y” when it asks to save the file.  Pick\
    \ “hello.c” as the name.  Now the program needs to be compiled.  In terminal type\
    \ gcc hello.c.  So long as the program was copied exactly, it will compile without\
    \ error, creating an executable file named a.out in the current directory.  To\
    \ launch it type ./a.out, and you should see “Hello World!”.  Without downloading\
    \ any extra programs, Linux has proven that it is a heaven for programmers.  Learning\
    \ to program will increase your Linux knowledge as well, and you can even create\
    \ your own applications.\n\nLinux and Embedded Applications\n\n Because of the\
    \ portable and open-source nature of Linux-based operating systems, they often\
    \ find their way onto embedded computers such as cars, smart televisions, and\
    \ internet-of-things devices.  Learning how to use Linux translates into learning\
    \ how to configure and customize embedded applications as well.  As devices become\
    \ smaller and more household appliances become “smart enabled”, it is apparent\
    \ that being able to understand how these devices operate will become a lucrative\
    \ skill.  The Raspberry Pi computers mentioned above can actually be used to turn\
    \ any device “smart” with enough Linux skill and programming knowledge.\n\nBuilding\
    \ a Beowulf Cluster\n\n Linux is versatile enough to be used in personal computers\
    \ and large supercomputers as well.  A Beowulf cluster is a cluster of computers\
    \ that synchronize hardware resources to become a makeshift supercomputer powerhouse. \
    \ With a minimum of two computers and Linux installed you can network them together\
    \ and have them share resources (Raspberry Pi computers make exceptional cluster\
    \ nodes!).  The process won’t be explained here, but steps can be found online. \
    \ The entire idea proves just how flexible and useful Linux can be.\n\nWindows\
    \ 10 and Linux\n\n With Windows 10’s anniversary update, Microsoft added a little\
    \ bit of Linux into Windows.  Bash, the terminal “language” used in Linux is fully\
    \ implemented into Windows 10’s command prompt.  In short, this means that any\
    \ Linux program can easily be ported into the Windows environment (kind of like\
    \ reverse WINE).  Windows user can even type sudo apt-get update to update their\
    \ Windows systems now!  An interesting update, the whole situation shows how the\
    \ “year of the Linux desktop” is fast approaching, and Linux will play an even\
    \ larger part in the future of computing.\n\nConclusion\n\n              Hopefully\
    \ now you are well informed about Linux and its related software, how to use Linux,\
    \ the components of a Linux-based operating system, and some basic Linux distributions. \
    \ You can now begin your own Linux adventures.  Whether you wish to customize\
    \ your desktop, or if you want to take control full control of your computer,\
    \ Linux is a fantastic operating system tool.  Only through exploration and discovery\
    \ can you truly learn how Linux works, because it is too complex to explain in\
    \ this book alone.  If you’d like to continue learning, then experiment with more\
    \ Linux distros.  Install a bunch of them, figure out what you like.  Try building\
    \ one from scratch, or do a DIY project involving Linux.  Your knowledge will\
    \ increase in time through regular use and self-study. \n\n              Although\
    \ the demonstrations and applications discussed may have seemed overly complicated\
    \ and unnecessary, they exist to explain how advanced and varied a Linux-based\
    \ operating system can be.  From creating a supercomputer to making a cow say\
    \ funny things, Linux facilitates computing. \n\n              Instead of paying\
    \ to use hardware you already own, and instead of being under the control of Microsoft\
    \ or Apple, Linux gives the freedom to do whatever you want with your devices. \
    \ And although the learning curve is steep, by just installing a distro and playing\
    \ around you are gaining useful computer knowledge that sets you apart from everyone\
    \ else.\n\n              Linux isn’t just for computer geeks.  It isn’t just for\
    \ corporate environments.  Linux is for anyone that wants to use their computer\
    \ to its full potential.  After reading this book you should have the beginner’s\
    \ knowledge necessary to navigate and interact with your Linux machine.  Thank\
    \ you for downloading and reading this short beginner’s guide to Linux. Continue\
    \ experimenting and tinkering and soon you will amaze with your computer-savvy."
