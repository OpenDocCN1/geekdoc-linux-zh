- fmt: "\nXfce is a fast, resource uninventive, and aesthetically pleasing desktop\
    \ environment. It often competes with LXDE for most lightweight DE, but while\
    \ LXDE focuses more on speed, Xfce retains both functionality and speed to create\
    \ a well-rounded lightweight DE. The layout of Xfce is user friendly and responsive,\
    \ in addition to being customizable.\n\nKDE is a DE for beefy computers. Distributions\
    \ that include KDE by default are known for being feature-rich and customizable,\
    \ albeit a little slow and laggy. KDE’s widgets will inspire anybody that enjoyed\
    \ Windows Vista, and the flashy transitions are loads of fun for people that like\
    \ to enjoy their computing experience. It is so customizable that often two users\
    \ can be running KDE side-by-side, yet neither would know the other is running\
    \ the same DE.\n\nConclusively, each distro will come with a desktop environment\
    \ preinstalled. The DE controls the looks are interactions with the desktop screen,\
    \ and they work together with the windowing system and window manager (explained\
    \ below) to provide your experience. \n\n# The Windowing System\n\nLinux-based\
    \ operating systems use certain techniques to provide users with interfaces for\
    \ their devices. The graphical user interface (GUI), often follows a scheme known\
    \ as the windowing system. A windowing system or window system is a type of GUI\
    \ that implements windows, icon, menus, and pointers in such a way that is very\
    \ familiar to modern users. There are two main windowing systems available for\
    \ Linux based operating systems-the X Window System and Wayland. It is important\
    \ to understand how these systems work, as they are often how we interact with\
    \ our Linux computers.\n\nThe X Window System provides the basic framework for\
    \ a graphical user interface environment and controls the drawing and moving of\
    \ application windows by allowing the user to interact with a mouse and a keyboard.\
    \ The X Window System does not mandate the graphical user interface, thus applications\
    \ can have any number of visual styles. The way an application looks and feels\
    \ is handled by the application itself, the X Window System just facilitates the\
    \ drawing of it onto the screen.\n\nWayland is an alternative to X existing as\
    \ free and open source software. Wayland aims to replace the X Window System with\
    \ a more modern and simple way of drawing onto the screen. Like the X Window System,\
    \ Wayland is available under the MIT License (another FOSS-inspired license).\
    \ The group behind Wayland also develops a display compositor for Wayland called\
    \ `Weston` (compositors are another complicated set of tools that facilitate drawing\
    \ windows to the screen). In the Wayland Frequently asked questions the question\
    \ is asked “What is wrong with X?” and the answer from the Wayland project is\
    \ generally straightforward. X has feature-creep and contains remnants of features\
    \ long gone. Because the code remains in X, the functionality must be supported\
    \ in all released of X in the off-chance that somebody is using it in their system.\
    \ Wayland takes pride in taking the outdated and depreciated code and making it\
    \ entirely optional while keeping the required “core” scripts in top shape.\n\n\
    Basically, Wayland wants to advance the technology behind X while leaving the\
    \ antiquated design and functionality behind. A good comparison for this is Microsoft’s\
    \ Internet Explorer and their newer Edge browser. Edge was created to improve\
    \ upon IE’s concepts but leave the old design and legacy compatibility issues\
    \ behind. Unless you are building your Linux OS from scratch, though, most every\
    \ distribution has a windowing system already installed.\n\n# The Init\n\nIn Linux\
    \ the `init`, with is short for initialization, is the very first process that\
    \ is started during the boot sequence of the computer system. The `init` is a\
    \ daemon process that the system will continue to run until the moment that it\
    \ powered off. `init` is started by the kernel using a static filename- and if\
    \ the kernel is not able to start the `init`, the system will experience a “kernel\
    \ panic” resulting in a fatal system error. Ever since March of 2015, most Linux\
    \ kernel based operating systems have adopted `systemd` as the default init, though\
    \ this has led to a great deal of controversy due to its monolithic nature. The\
    \ use of `systemd` was so controversial that members of the Debian Project quit\
    \ and forked to create their own operating system called Devaun. `systemd` and\
    \ inits are important and discussed because they can control how the kernel, applications,\
    \ and users interact. An all-powerful and poorly written init such as `systemd`\
    \ undermines the philosophical principals of freedom and openness that Linux promotes.\n\
    \n# More with the Terminal\n\nUltimately the terminal will provide the most amount\
    \ of functionality to your Linux computer. After learning the basics of Linux,\
    \ you can truly begin to interact with your PC through the text interface. As\
    \ an example, Linux excels over Windows due to the ease of updating software.\
    \ While in a normal Windows installation you would have to uninstall a program\
    \ and install the newest version every time there is an update, Linux allows you\
    \ to update every program on the system at the same time with a simple command.\
    \ Within the terminal (on our Ubuntu system) type the following command:\n\n```\n\
    sudo apt-get update\n```\n\nObservational users will remember that `apt-get` is\
    \ also the method through which we install new programs. However, for this we\
    \ type `apt-get install`; for updating we type `apt-get update`.\n\nYou might\
    \ have tried to install a program through terminal only to be told that the application\
    \ does not exist. What that statement means is the program does not exist within\
    \ the installed repositories. Repositories are data store-houses that contain\
    \ link to applications. By default Ubuntu only has a few repositories, but the\
    \ Linux user is free to install more. Here’s how:\n\n```\nsudo add-apt-repository\
    \ \"repository here\"\n```\n\nRepositories open up lots of new software to try\
    \ out, so be sure to find a list online of the best repositories and have experimenting.\
    \ Starting programs from the terminal is another easy task, just type the name\
    \ of the program. For instance to launch the GIMP software just type `gimp`. You\
    \ can specify parameters in the command as well, such as which file to open. With\
    \ `gimp dog.png` we can open gimp and dog.png directly and with only one command.\n\
    \nIt would take nearly forever to explain every terminal command and how they\
    \ are used, so below is a chart containing the most used intermediate commands.\n\
    \n| Command | AKA | Use | Example |\n| :--- | :--- | :--- | :--- |\n| `ifconfig`\
    \ | IF/IP configuration | To display a variety of network information. | `ifconfig`\
    \ |\n| `df` | Disk Free | Gives information about the disk drives in the computer\
    \ and how much free space they have left. | `df` |\n| `uname` | Unix Name | Give\
    \ information about the computer that you are on. | `uname -a` |\n| `passwd` |\
    \ Password | Typing just the command allows you to change your user password.\
    \ Definitely do this on new systems that don’t have a password. | `passwd` |\n\
    | `chmod` | Change File Mode Bits | Linux files have permissions that keep them\
    \ secure. Files can have separate access levels for reading, writing, and executing.\
    \ `chmod` changes the level of permissions for all. | `chmod 777 dog.png` |\n\
    | `wget` | Web Get | Download files from the entered website through the terminal.\
    \ This is great for downloading something without having to open up an entire\
    \ web browser. | `wget http://crouton.net/crouton.png` |\n"
  raw: '              Xfce is a fast, resource uninventive, and aesthetically pleasing
    desktop environment. It often competes with LXDE for most lightweight DE, but
    while LXDE focuses more on speed, Xfce retains both functionality and speed to
    create a well-rounded lightweight DE.  The layout of Xfce is user friendly and
    responsive, in addition to being customizable. 


                  KDE is a DE for beefy computers.  Distributions that include KDE
    by default are known for being feature-rich and customizable, albeit a little
    slow and laggy.  KDE’s widgets will inspire anybody that enjoyed Windows Vista,
    and the flashy transitions are loads of fun for people that like to enjoy their
    computing experience.  It is so customizable that often two users can be running
    KDE side-by-side, yet neither would know the other is running the same DE. 


                  Conclusively, each distro will come with a desktop environment preinstalled. 
    The DE controls the looks are interactions with the desktop screen, and they work
    together with the windowing system and window manager (explained below) to provide
    your experience. 


    The Windowing System


    Linux-based operating systems use certain techniques to provide users with interfaces
    for their devices.  The graphical user interface (GUI), often follows a scheme
    known as the windowing system. A windowing system or window system is a type of
    GUI that implements windows, icon, menus, and pointers in such a way that is very
    familiar to modern users.  There are two main windowing systems available for
    Linux based operating systems-the X Window System and Wayland.  It is important
    to understand how these systems work, as they are often how we interact with our
    Linux computers.


    The X Window System provides the basic framework for a graphical user interface
    environment and controls the drawing and moving of application windows by allowing
    the user to interact with a mouse and a keyboard.  The X Window System does not
    mandate the graphical user interface, thus applications can have any number of
    visual styles.  The way an application looks and feels is handled by the application
    itself, the X Window System just facilitates the drawing of it onto the screen.


    Wayland is an alternative to X existing as free and open source software.  Wayland
    aims to replace the X Window System with a more modern and simple way of drawing
    onto the screen.  Like the X Window System, Wayland is available under the MIT
    License (another FOSS-inspired license).  The group behind Wayland also develops
    a display compositor for Wayland called Weston (compositors are another complicated
    set of tools that facilitate drawing windows to the screen).  In the Wayland Frequently
    asked questions the question is asked “What is wrong with X?” and the answer from
    the Wayland project is generally straightforward.  X has feature-creep and contains
    remnants of features long gone.  Because the code remains in X, the functionality
    must be supported in all released of X in the off-chance that somebody is using
    it in their system.  Wayland takes pride in taking the outdated and depreciated
    code and making it entirely optional while keeping the required “core” scripts
    in top shape.


    Basically, Wayland wants to advance the technology behind X while leaving the
    antiquated design and functionality behind.  A good comparison for this is Microsoft’s
    Internet Explorer and their newer Edge browser.  Edge was created to improve upon
    IE’s concepts but leave the old design and legacy compatibility issues behind. 
    Unless you are building your Linux OS from scratch, though, most every distribution
    has a windowing system already installed.


    The Init


                  In Linux the init, with is short for initialization, is the very
    first process that is started during the boot sequence of the computer system. 
    The init is a daemon process that the system will continue to run until the moment
    that it powered off. Init is started by the kernel using a static filename- and
    if the kernel is not able to start the init, the system will experience a “kernel
    panic” resulting in a fatal system error.  Ever since March of 2015, most Linux
    kernel based operating systems have adopted systemd as the default init, though
    this has led to a great deal of controversy due to its monolithic nature.  The
    use of systemd was so controversial that members of the Debian Project quit and
    forked to create their own operating system called Devaun.  Systemd and inits
    are important and discussed because they can control how the kernel, applications,
    and users interact.  An all-powerful and poorly written init such as systemd undermines
    the philosophical principals of freedom and openness that Linux promotes.


    More with the Terminal


                  Ultimately the terminal will provide the most amount of functionality
    to your Linux computer.  After learning the basics of Linux, you can truly begin
    to interact with your PC through the text interface. As an example, Linux excels
    over Windows due to the ease of updating software.  While in a normal Windows
    installation you would have to uninstall a program and install the newest version
    every time there is an update, Linux allows you to update every program on the
    system at the same time with a simple command.  Within the terminal (on our Ubuntu
    system) type the following command:


    sudo apt-get update


    Observational users will remember that apt-get is also the method through which
    we install new programs.  However, for this we type apt-get install; for updating
    we type apt-get update.By executing the command Ubuntu will search through its
    repositories and retrieve update files for every application that is out of date. 
    Very handy and extremely fast, apt-get update doesn’t even require the computer
    be restarted when program are updated. 


    You might have tried to install a program through terminal only to be told that
    the application does not exist.  What that statement means is that the program
    does not exist within the installed repositories.  Repositories are data store-houses
    that contain link to applications.  By default Ubuntu only has a few repositories
    installed, but the Linux user is free to install more. Here’s how:


    sudo add-apt-repository “repository http here”


                  Repositories open up lots of new software to try out, so be sure
    to find a list online of the best repositories and have fun experimenting. 


    Starting programs from the terminal is another easy task, just type the name of
    the program.  For instance to launch the GIMP software just type gimp.  You can
    specify parameters in the command as well, such as which file to open.  With gimp
    dog.png we can open gimp and dog.png directly and with only one command.


    It would take nearly forever to explain every terminal command and how they are
    used, so below is a chart containing the most used intermediate commands.


    | Command | AKA | Use | Example |


    | ifconfig | IF/IP configuration | To display a variety of network information.
    | ifconfig |


    | df | Disk Free | Gives information about the disk drives in the computer and
    how much free space they have left. | df |


    | uname | Unix Name | Give information about the computer that you are on. | uname
    -a |


    | passwd | Password | Typing just the command allows you to change your user password. 
    Definitely do this on new systems that don’t have a password. | passwd |


    | chmod | Change File Mode Bits | Linux files have permissions that keep them
    secure.  Files can have separate access levels for reading, writing, and executing. 
    Chmod changes the level of permissions for all. | chmod 777 dog.png |


    | wget | Web Get | Download files from the entered website through the terminal. 
    This is great for downloading something without having to open up an entire web
    browser. | wget http://crouton.net/crouton.png |'
