    有很多免费供 Linux 使用的家用游戏主机模拟器，例如 `PCSX2`、`ePSXe`、`Dolphin`、`FCEUX` 等。`FCEUX` 是免费开源的任天堂娱乐系统（NES）模拟器。它还能模拟日本的红白机光（Family
    Computer Disk System）。`FCEUX` 由 Anthony Giorgio 和 Mark Doliner 从废弃的 `FCE` 和 `FCE
    Ultra` 中复兴的。`FCEUX` 包含了调试、游戏视频录制和 ROM 破解工具等功能。模拟器 `ePSXe` 是一个 Sony Playstation
    模拟器。它的意思是“增强型 PSX 模拟器”。`ePSXe` 第一版本发布于 2000 年 10 月 14 日。该模拟器后来于 2012 年 8 月 30
    日发布了 Android 移动操作系统。当 `ePSXe` `1.6.0` 发布时，很快就出现了关于该模拟器开发已停止的传言。这些传言声称由于硬盘故障导致原始源代码丢失，开发已经停止。2008
    年 4 月 5 日，模拟器 `ePSXe` 的开发者发布了公共声明，透露开发将继续。2008 年 5 月 24 日，`ePSXe` `1.7.0` 版本发布。`ePSXe`
    的独特之处在于能够控制和替换它使用的插件。图形处理单元插件可以与 `OpenGL` 或 `Glide API` 运行。音频处理单元插件模拟游戏的音和音乐。它还有一个
    CD-ROM 插件和一个输入插件。*Retro Gamer* 称 `ePSXe` 是“最佳的免费 PlayStation 模拟器”。


    `PCSX2` 是一个 Sony PlayStation 2 模拟器。它是基于 GNU 通用公共许可证许可的免费开源软件。与 `ePSXe` 类似，`PCSX2`
    的架构支持插件。该模拟器的开发始于 2001 年，由名为 `Linuzappz` 和 `Shadow` 的程序员领导。据报道，它兼容 2586 款经过测试的
    Sony PlayStation 2 视频游戏中的 94.9%。由于模拟像 PlayStation 2 这样复杂的硬件极其消耗 CPU，性能通常受限于运行该系统的中央处理器。Geek.com
    的 Matthew Humphries 将该模拟器描述为“令人印象深刻的作品”。


    `Dolphin` 是免费开源的任天堂 GameCube 和任天堂 Wii 模拟器。`Dolphin` 由程序员 `Henrik Rydgård` 和名为
    `F|RES` 的程序员于 2003 年 9 月发布。`Dolphin` 模拟器于 2004 年正式停止支持，但在 2005 年被开发者重新复活。`Dolphin`
    于 2008 年 7 月 13 日成为一个免费开源项目。源代码已根据 `GPLv2` 许可证在 Google Code 的 SVN 仓库中公开发布。到 2009
    年 4 月，大多数商业 GameCube 游戏和商业 Wii 游戏已经可以以极少的问题完全运行。`Dolphin` 模拟器广受欢迎，例如，许多人更喜欢由 `Dolphin`
    模拟器运行的《塞尔达传说：风之杖》的效果，而不是游戏的任天堂 Wii U 版本。


    `DeSmuME` 是免费开源的任天堂 DS 模拟器。原始模拟器是法语的，后来被翻译成英语和其他语言。


    得益于上述等模拟器，Linux 上的游戏非常丰富多样。尽管如此，花时间正确设置它们是很的，因此请务必在网上查阅在 Linux 上玩旧主机机游戏的正确方法。有了模拟器、ROM、Steam
    以及在 Linux 上发布的其他专有游戏，计算机用户永远不需要无聊。以前只有 Windows 有良好的视频游戏支持，但现在 Linux 正在加入玩家的行列。


    # Linux 高级概念


    ## 文件结构


    在基于 Linux 的操作系统中有两种主要分区：数据分区和交换分区（swap）。数据分区包含了标准的 Linux 系统数据以及用户数据。交换分区是计算机系统物理内存（`RAM`）的扩展。大多数
    Linux 操作系统都需要这两个分区才能高效运行。


    Swap 是 `RAM` 的扩展。当程序需要额外空间时，交换分区会将部分数据分配给程序。Windows 的对应物是 `pagefile`。


    Linux 的默认文件系统是 `ext4`，在 Linux 中格式化的驱动器通常会使用它。当将数据共享回 Windows 系统时，这不利，因为 Windows
    通常无法读取 `ext4`。


    以下是 Linux 驱动器根目录下的文件夹。Linux 发行版的一个重要特性是计算机上的每个对象都是文件。这意味着每个外设、数据数据、硬件组件和终端命令在
    Linux 中都以文件的形式表示。因此，一切都必须存储在某个地方，下面的文件夹包含了计算机的全部。


    | Linux 文件系统 | 描述 |

    | :--- | :--- |

    | `Bin` | 共享程序所在的位置。 |

    | `Boot` | 存储启动文件（如内核和启动加载程序）的地方。 |

    | `Dev` | 包含指向 CPU 硬件的文件。处理 CPU 时可以引用这里的文件。 |

    | `Etc` | 配置文件和设置。 |

    | `Home` | 用户数据存储在这里。 |

    | `Initrd` | 用于引导。 |

    | `Lib` | 库文件，为应用程序提供功能。 |

    | `Lost+found` | `ext4` 是日志文件系统。任何损坏的文件可能被保存在这里。 |

    | `Misc` | 当插入可移动存储设备时，可以在这里访问。 |

    | `Mnt` | Mnt 代表挂载（mount），这是你与挂载硬件交互的方式。 |

    | `Net` | 通常挂载网络文件夹的地方。 |

    | `Proc` | 程序访问的资源。 |

    | `Sbin` | 系统命令所在的位置。 |

    | `Tmp` | 临时目录。 |

    | `Usr` | 用户程序安装的地方。 |

    | `var` | 用于日志文件。 |


    ## WINE


    敏锐的用户可能已经注意到 Linux 不运行 exe 文件。对于拒绝放弃某些 Windows 程序的 Linux 用户，`WINE` 可以提供帮助。`WINE`
    是一个“兼容层”，能够运行微软 Windows 文件，以模拟在 Windows 中运行应用程序。对于 Linux 用户来说，这意味着你可以在不完全放弃 Windows
    的情况下运行 Linux。不过，WINE 并不是运行 Windows 程序的替代品。要安装 `WINE`，必须运行以下命令：


    ```

    sudo apt-get-repository ppa:ubuntu-wine/ppa

    sudo apt-get update

    sudo apt-get install -y wine1.7

    ```


    要运行 exe 必须先下载。使用终端导航到下载位置并输入 `wine programname.exe`。


