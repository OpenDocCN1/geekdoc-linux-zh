    It has limited (or virtually no) preinstalled programs, but it can serve as an
    installation of Linux for the oldest and slowest computers.  The entire operating
    system is between eleven and sixteen megabytes, so installing it on a thumb drive
    or SD card is very possible.  This OS is best installed by intermediate Linux
    users that wish to create the most lightweight operating system possible from
    scratch. 


                  Chrome OS is an operating system developed by Google, and- like
    Android- , it is based on the Linux kernel.  The project was announced by Google
    in July of the year 2009.  It is designed for both user data and applications
    to run in “the cloud” rather than from the computer’s RAM.  The very first Chrome
    OS laptop, called Chromebook, was released in May of the year 2011.  Chrome OS
    is designed to be connected to the internet for running only simple applications
    and web browsing.  Although features such as an integrated media player and integrated
    file manager exist, most of the applications are actually just websites owned
    by Google. This allows computers with lower specifications to be made very cheaply
    for Chrome OS, making it suitable for low-spec devices.  Chrome OS is popular
    among college students, the non-tech savvy buyer, and budget computers, and it
    is a very popular operating system.  You may not actually be able to install Chrome
    OS on a computer, but you can certainly install the open-source equivalent – Chromium
    OS.  Chromium is recommended for low-spec laptops whose only purpose is web browsing
    and other common internet tasks. '
