- fmt: '

    If the installation is successful and you chose dual boot, then every time the
    computer turns on you will see `GRUB`, the GRand Unified Bootload. `GRUB` will
    as which OS you want to begin, so you have a choice between Linux and Windows
    every time you compute.


    ## Using Ubuntu


    For those that have only used a Windows-type interface, Ubuntu will not look completely
    foreign. There is still a “desktop” and a “start menu”, but the placement of things
    is slightly different. You start applications in the usual way, by either clicking
    them on the start bar or searching for them after clicking the start button. If
    you are on a desktop than you are most already connected to the internet, but
    if you are on a laptop you might need to connect to Wi-Fi through the upper right
    corner. Overall the usability of Ubuntu is high, and you should be able to understand
    it fairly quickly. Browse the web and try out the default applications to get
    an interactive feel for how Linux operating systems work and act.


    ## The Terminal


    Linux differentiates itself from Windows by offering an additional text-based
    interface reminiscent of old DOS computers. Through the terminal, commands can
    be run that perform actions on the PC. Starting the terminal differs on each distro,
    but `ctrl+alt+T` is a common hotkey. Once in the terminal, you can browse the
    filesystem and generally use the computer with the same level of control as a
    graphical user interface. The user first enters a command and presses enter to
    execute it. Here are a few essential commands. While reading this book, any text
    that is italicized refers to the fact that it is a terminal command.


    | Command | AKA | Use | Example |

    | :--- | :--- | :--- | :--- |

    | `cd` | Change Directory | Type to change current folder | `cd desktop` |

    | `pwd` | Print Working Directory | Displays the current folder’s name | `pwd`
    |

    | `shutdown` | Shut down | Powers off the current system | `shutdown –h now` |

    | `ls` | List | Lists all files in the current folder | `ls` |

    | `cp` | Copy | Copies the specified file with an optional new name | `cp picture.png
    dog.png` |

    | `mkdir` | Make Directory | Creates a new folder with specified name | `mkdir
    Documents` |

    | `rm` | Remove | Remove the specified file | `rm dog.png` |

    | `rmdir` | Remove Directory | Remove the specified folder | `rmdir Documents`
    |

    | `apt-get` | Advanced Packaging Tool - Get | A command that works in Ubuntu-type
    systems that installs new software | `apt-get install minecraft` |

    | `.` | Run | The period is used to run a file, such as a script. | `./a.out`
    |


    If you have every used DOS the above may seem familiar. Here is an exercise to
    master the terminal.


    1. Start terminal. Either `ctrl+shift+T` or find it in a programs menu.

    2. Type `pwd` to find out where we are.

    3. `cd Desktop` to travel to the desktop folder.

    4. `mkdir Notes` to create a new folder called `Notes`.

    5. `cd Notes` to travel there.

    6. Using `nano secretfile.txt`, we will start editing a new file in the built-in
    text editor `Nano`.

    7. Type something secret! Press `ctrl+x` to save and exit the program.

    8. Type `ls` to list the current directory’s contents. You should see `secretfile.txt`
    there.

    9. With `cp secretfile.txt totallynormalfile.txt`, we copy the file and make a
    new one.


    At this point you should minimize the terminal and see the folder and files you
    just created on your desktop. Following the directions above might have taken
    much longer than usual for you to create a folder and files, but with practice
    you can manipulate a Linux system at a speedy pace through terminal. Additionally,
    mastering the terminal is very difficult, but it provides a deep level of control
    over your distribution that GUIs might not be able to give. Overall, it is definitely
    recommended that a Linux user know how to use a terminal proficiently.


    ## Software for Linux


    You might be surprised to learn that you may not have to change your software
    repertoire when you “jump ship” to Linux. Tech-inclined users may already be familiar
    with some of the software available for Linux, such as Mozilla Firefox, `Google
    Chrome`, `Opera`, `Adobe Reader`, `Mozilla Thunderbird`, and `VLC`.


    If a certain software is not already installed on the machine than getting it
    is a breeze. Ubuntu contains the application “Ubuntu Software Center” that acts
    as an “app store” for Linux programs. Through the friendly interface you can search
    for and 1-click-download plenty of programs- many of which are listed below. The
    more obscure programs may not be listed in the software center, though, so you’ll
    have to install them through the terminal. Inside a terminal window, type the
    following:


    ```bash

    sudo apt-get install vlc

    ```


    `sudo` is a terminal prefix that instructs the system to run with highest privileges
    possible. A password will need to be entered when `sudo` is run. `Apt-get` is
    the Ubuntu application program; by specifying `install` we are signifying our
    intentions. `Vlc` is the name of the program we want (`VLC` Media player). So
    with this one line in a terminal we have downloaded and installed an entire application.
    Replace `vlc` with any application name and Ubuntu will download it. Below are
    the most popular applications for each category.


    ### Web Browsing


    | Mozilla Firefox |

    | :--- |

    | Familiar, highly customizable, and FOSS. `Firefox` is highly used on Windows.
    |


    | Google Chrome |

    | :--- |

    | Fast, stable, and compatible. `Google Chrome` is highly used on Windows. |


    | Opera |

    | :--- |

    | Lightweight and runs of Chrome. `Opera` is highly used on Windows. |


    | Midori |

    | :--- |

    | Simple. `Midori` is the default browser of `Elementary OS`. |


    | Dillo |

    | :--- |

    | Small, stable, and fast. |


    | Lynx |

    | :--- |

    | A text-based browser. `Lynx` is a text-based browser. |


    | W3M |

    | :--- |

    | Another text browser. |


    ### Media Players


    | VLC |

    | :--- |

    | Also available on Windows. A very compatible and useful media player that can
    handle anything from music, videos, podcasts, or live channels. |


    | Miro |

    | :--- |

    | Unique its ability to connect and download videos from sources such as Crackle,
    Hulu, and Yahoo Screen. |


    | mplayer |

    | :--- |

    | Supports a wide range of codecs and file formats. Very small and customizable.
    The media player of choice for Linux veterans. |


    ### Audio-only Players


    | DeaBeef |

    | :--- |

    | Minimalist, yet customizable. This audio player will resonate most with fans
    of Windows’s `Foobar2000` application. You can change the layout and settings
    of `DeaBeef` to be your own audio player. |


    | Clementine |

    | :--- |

    | Cross platform, free and open source. Supports a large music library. Users
    of Android and iPhones can rejoice knowing that `clementine` supports adding music
    to mobile libraries. A great alternative to `iTunes`. |


    | Cmus |

    | :--- |

    | The most lightweight music player around, as it runs from a terminal screen.
    |


    | Aqualung |

    | :--- |

    | Great gapless playback. Best choice for Jethro Tull fans. |


    ### Image Editors


    | GIMP |

    | :--- |

    | First and best choice for FOSS image editing. Also available for Windows, `GIMP`
    provides many of the features of `Photoshop` for free. The advanced editor is
    commonly preinstalled on various distrobutions, but it remains a must-have for
    anybody doing image editing. |


    | Pinta |

    | :--- |

    | `Pinta` is the Linux equivalent of `MS-Paint`. For simple image editing, you
    cannot go wrong with `Pinta`. |


    ### File Manager (Linux equivalent of Microsoft’s File Explorer)


    | GNOME Commander |

    | :--- |

    | An elegant, but slow, file manager that is the default in the Gnome desktop
    environment. This file manager is great for animations and icons and you can create
    a beautiful desktop with this application. |


    | PCManFM |

    | :--- |

    | Default FM in `LXDE`. Great for lightweight and simple graphical user interfaces.
    |

