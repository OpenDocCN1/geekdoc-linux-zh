    Arch Linux 是一种基于 `IA-32` 和 `x86/64` 架构的 Linux 内核计算机操作系统。它主要由自由和开源软件组成，Arch 以其能够提供的极大的定制性而闻名。Arch
    Linux 社区的支持，这使其相对容易获得支持。Arch Linux 的设计遵循 KISS 原则，即 `Keep It Simple Stupid`（保持简单愚蠢）。虽然其代码设计本质上是简单的，但实际上使用该操作系统相当困难。Arch
    不带任何图形化用户界面，也没有任何特定的应用程序。用户需要按照自己的喜好逐步“构建”整个系统。通过学习安装什么以及如何安装，用户最终会对发行版和 Linux
    本身有深入的理解，这就是为什么 Arch 推荐给想要学习更多 Linux 的用户。虽然不建议将其作为第一个发行版，但每个对 Linux 感兴趣的人都应该在某个时候构建自己独特的
    Arch 版本，以加深知识。


    CrunchBang (#!) Linux 是一种基于 Debian 的 Linux 内核计算机操作系统。开发者 Phillip Newborough 设计
    CrunchBang Linux 是使用比 Debian 少得多的系统资源，使其更加轻量和灵活。CrunchBang Linux 有有自己的软件仓库，但其大部分软件包来自
    Debian 仓库。2013 年，Jim Lynch（一位著名的评论员）描述 CrunchBang 功能完备、高效，并且能够在旧硬件和新机器上有效运行。事实是，CrunchBang
    通过优先考虑可用性和速度避免了卡顿体验，这使其成为追求不务实的干练感的中级 Linux 用户极具吸引力的发行版选择。


    Damn Small Linux (DSL) 是一种以极极简主义设计理念开发的 Linux 内核计算机操作系统。Damn Small Linux 是免费开源的，遵循
    `GNU GPL` 许可。DSL 最初由开发者 John Andrews 构思并维护，旨在确定 50mb 空间内能装下多少内容。实际上，DSL 开箱即用且非常实用，最适合需要快速访问
    Linux 工具的用户。正因为如此，DSL 最好放在可以从任何电脑启动的 USB 驱动器上。


    红星（Red Star OS）是 Linux 世界中一个有趣的案例。它是该共产国家居民使用的操作系统。红星操作系统的开发于 1998 年在韩国计算机中心开始。在红星出现之前，朝鲜的电脑通常运行
    Ubuntu。由于朝鲜希望保持对互联网资源和公民访问的控制，只有极少数政府官员和重要游客被允许访问互联网。这些人将使用红星操作系统，政府对操作系统的控制赋予了他们对公民的额外控制。该操作系统实际上是闭源且专有的，这违背了最基本的
    Linux 和 FOSS（自由开源软件）哲学。Linux 爱好者喜欢研究并惊叹红星，因为其具有极其小众的用户群和功能。显然，不建议阅读此书的大多数人安装它，但它作为一种新颖的概念和有趣的读物而存在。


    ## 安装 Linux


    在阅读了这么多关于 Linux 发行版后，你一定已经准备好尝试一个，你可以通过多种方法安装 Linux 操作系统。通常，尝试 Linux 发行版的过程涉及获取操作系统的
    `.iso` 副本并将其刻录到可移动介质（CD、USB 等）上，最后让你的 PC 从该介质启动。在我们本书的扩展示例中，我们将下载并安装 Ubuntu。当然，你可以在示例中替换任何其他
    Linux 发行版，但此处的细节仍将引用 Canonical 的这款易于使用的新手操作系统。


    基于 Linux 的操作系统可以从 USB 闪盘、CD 或 DVD 甚至软磁盘进行安装和启动。安装 Linux 的第一步是获取一个可以容纳操作系统的可写介质。一个
    4GB 的闪盘通常足够（我们将继续使用它进行演示），但对于较大的镜像，你可能需要一个 8GB 的。


    其次，我们需要获取操作系统的副本。通过网站 `http://www.ubuntu.com/`，你可以导航到“桌面版”页面，然后点击“下载 Ubuntu”。默认情况下，该页面将显示
    Ubuntu 的最新版本以及几项系统要求。留点时间确保你的电脑可以胜任。此外，打印本指南的接下来几页也是个好主意，因为一旦你开始使用 Linux，可能就没有机会翻回这本书。点击“下载”按钮继续。Ubuntu
    是免费的；为了避免向 Canonical 捐款，请在所有框中输入 `$0` 并点击底部的“下载”按钮。镜像将开始下载。


    第三，我们需要一个应用程序将操作系统“写入”到介质中。写入镜像最流行的工具是 `UNetbootin` (`https://unetbootin.github.io/`)，但免费工具
    `Rufus` (`https://rufus.akeo.ie/`) 使用起来要简单得多。获取一份 `Rufus` 副本并等待所有下载完成。


    第四，将可移动介质插入 USB 端口并启动 `Rufus`。你的 USB 驱动器应该出现在顶部的下拉列表中。通过向驱动器写入 Ubuntu 镜像，你将删除其所有内容，因此如果需要，请现在备份。`Rufus`
    的默认设置可以满足我们的需求，但我们需要确保勾选了“使用创建启动盘（Create a bootable disk using）”，并且下拉菜单显示“ISO
    Image”。更改该设置并点击旁边的光盘按钮打开文件管理器。导航到我们下载的 Ubuntu 镜像并双击它。我们现在可以按“开始”按钮开始将 Ubuntu 写入驱动器。执行此操作。过程完成后关闭电脑。


    第五，启动 PC 在 Windows 加载之前进入 BIOS。执行此操作的键取决于主板制造商，但通常是键盘最顶部的 `F` 键之一。每个主板制造商都有自己的
    BIOS 布局，因此此处的解释是通用且模糊的。找到“启动（boot）”标签或类似的选项，你可以在那里查看 PC 的“启动顺序”。启动顺序告诉电脑去哪里寻找操作系统镜像，通常
    BIOS 会首先查找内部硬盘。更改顺序，将 USB 或外部硬盘置于首位。保存并退出 BIOS。


    最后一次启动电脑将开始我们的最后一步：BIOS 将首先搜索外部 USB 并找到 Ubuntu 镜像。如果加载 Windows 而不是 Ubuntu，请重复第
    5 步，否则你将进入你的第一个 Linux 系统。恭喜你！


    出现的操作系统是完全可操作且可用的，但仍然有一个小问题——它仍在从 USB 驱动器运行，因此尚未完成自安装。Ubuntu 变体在桌面上有一个应用程序，你可以双击它来为你启动安装过程。如果你已经测试完
    Linux 并准备好删除 Windows，请点击此选项。提问你，如果你选择了某些选项，你将擦除整个电脑，因此请仔细阅读说明。你可以选择与当前操作系统进行“双启动”，也可以选择完全清空电脑并从头开始。建议起初选择双启动，以防你由于某些应用程序或功能需要返回
    Windows。不过，作为应急措施，在尝试任何安装之前，务必完整备份你的电脑。


