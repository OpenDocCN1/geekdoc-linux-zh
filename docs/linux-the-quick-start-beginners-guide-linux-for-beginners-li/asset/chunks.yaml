  raw: "Throughout 1995 the kernel was expanded and ported to a multitude of platforms,\
    \ increasing the outreach of Linus and his kernel.  1996 saw additional improvements\
    \ such as multiprocessing, which strengthened Linux’s use in corporate and university\
    \ environments.    The early 2000s were marked by rapid improvement of Linux and\
    \ a huge increase in the number of distros available.  Major companies such as\
    \ Dell and HP partnered with distributions and offered consumers a choice of operating\
    \ system upon purchase.  Linux became an industry powerhouse in this time period\
    \ by offering an alternative OS for servers and clients that focused on performance\
    \ and stability rather than features and aesthetics.  Today Linux is known for\
    \ its widespread use in smartphones, desktops, and servers, and it was only able\
    \ to reach this point through the dedicated work of Linus Torvalds and the numerous\
    \ volunteers that contributed to the project.\n\nFree and Open Source Software\n\
    \n              Linux is a shining example of open source and free software. \
    \ Also called FOSS, free and open source software are programs that exhibit certain\
    \ characteristics and philosophies of ethical development.  Free software certainly\
    \ means monetarily free, but in this case it also means that the programs have\
    \ “freedom”.  “Free” programs are applications that can be run, distributed, changed,\
    \ and copied freely and without consequence.  Opposed to this are paid programs\
    \ such as Photoshop; there is a serious penalty for copying Photoshop and giving\
    \ it to a friend.  Open source software refers to the transparency of a program’s\
    \ code.  If the source code can be viewed then that program is open source. Source\
    \ code that is hidden and inaccessible is closed source.  Open source code promotes\
    \ truthfulness and trust while closed source code is an analogy for hidden and\
    \ shady practices.  FOSS combines the ideals of both free software and open source\
    \ coding to supply applications that are truly free and developed transparently. \
    \ Even the text of this document, “Liberation Serif”, is a free font commonly\
    \ available in FOSS Linux applications.\n\nLinux remains a particularly excellent\
    \ example of FOSS because of the community-driven nature of Linux development. \
    \ Absolutely anybody at any time can view the source code of Linux and propose\
    \ changes.  Multiple varied distributions of the OS exist because any individual\
    \ can use the Linux code as a core for their own operating system.  Certainly\
    \ the omnipresence of the free and open source philosophy has helped Linux throughout\
    \ its development.\n\nGNU\n\n              GNU is the name of both an operating\
    \ system and its extensive collection of FOSS.  GNU funnily enough stands for\
    \ “GNU is not UNIX”, explaining that GNU is a UNIX-Like operating system containing\
    \ no UNIX code.  Computer guru Richard Stallman created GNU in the mid 1980’s\
    \ well before Linux was ever conceived as a “free” alternative to UNIX. GNU remained\
    \ a niche product until Linus Torvalds fused core utilities of GNU into the Linux\
    \ kernel.  Honestly a large part of Linux-based operating systems is actually\
    \ GNU code, but Richard Stallman rarely receives his credit for contribution. \
    \ It is because of this that the kernel is sometimes written as GNU/Linux instead\
    \ of just Linux.  Torvalds recognizes the large part that GNU plays in his kernel\
    \ but also believes that without a kernel GNU is useless.  The clashing personalities\
    \ of the two industry giants Torvalds and Stallman has led to a few heated arguments,\
    \ but ultimately both men created separate products that work well together to\
    \ facilitate computer operating systems.  Whether the name is pronounced Linux\
    \ of GNU/Linux is up to the user, but each individual OS is usually called by\
    \ the distribution name anyways!\n\nTux the Penguin\n\n              Tux is the\
    \ mascot of the Linux kernel.  His name is synonymous with Linux and the two ideas\
    \ are often seen together.  Created by Larry Ewing in 1996, Tux was created to\
    \ win a place as Linux’s logo.  The penguin did not win, however; rather he was\
    \ liked enough that he never really went away, so instead of a logo Tux became\
    \ the mascot. FOSS has a part in Tux, as he was drawn using the popular FOSS image\
    \ software GIMP. \n\n              Linus speaks of the origins of the penguin\
    \ character as coming from a trip he took to Australia that was uniquely marked\
    \ by penguins.  A joke obviously, Larry Ewing spun the story into an inside joke\
    \ that caught on very well.\n\nTux has had cameo appearances in other mediums\
    \ as well, but the mascot can mostly be seen destroying Windows computers or poking\
    \ fun at closed source and proprietary software. \n\nWho uses Linux?\n\n So after\
    \ reading all about where Linux came from and where it is headed one might wonder\
    \ what the typical Linux user looks like.  A wide variety of individuals enjoy\
    \ Linux-based operating systems, and each has their own reason for choosing it. \
    \ Whether you are a tinkerer that enjoys customization, a business owner wishing\
    \ to save on computer costs, or a system administrator looking for a new server\
    \ OS, Linux is a flexible and malleable operating system.  The kernel itself is\
    \ simple and stable, and the huge amount of distributions guarantee there is a\
    \ special experience for every need.  Read on to the next chapter to learn about\
    \ distributions and how they can suit your needs.\n\nChoosing a Distribution of\
    \ Linux\n\nDistros are operating systems that take the Linux Kernel and provide\
    \ preinstalled applications and services for an all-inclusive computing environment. \
    \ The vast amount of distributions is mind-boggling, but each can provide a unique\
    \ and custom experience for the user.  Finding a distro that fits your needs might\
    \ nudge you to install one yourself and try it out on your computer. Here are\
    \ the most notable.\n\n              Ubuntu is probably the most famous Linux-based\
    \ OS.  Based on Debian, Ubuntu is described as “Linux for Humans”. The popularity\
    \ of Ubuntu came about through ease-of-use, as it is much more intuitive than\
    \ Debian.  The name Ubuntu, literally meaning “humanness”, comes from a South\
    \ African philosophy of the same name.  Ubuntu is developed by Canonical Ltd,\
    \ a company in the United Kingdom owned by Mark Shuttleworth.  Canonical supports\
    \ itself financially by selling technical support for Ubuntu and technical support\
    \ for other projects as well.  Ubuntu remains free and open-source, despite being\
    \ developed by a proprietary company.  Beginning from the first release in 2004,\
    \ Ubuntu is updated every six months. Every two years there is an Ubuntu LTS (long\
    \ term support), which is an update that offers long-term support by Canonical. \
    \ Ubuntu by default contains software such as LibreOffice, Firefox, and Transmission. \
    \ New software can be installed with Ubuntu Software Center, a program specifically\
    \ built for installing additional software on Ubuntu.  This is very advantageous\
    \ for user new to Linux, because it is so easy to use.  Like Debian, Ubuntu and\
    \ its software are released using the FOSS-friendly GNU license, so all of its\
    \ default software is free and open-source.  Debian and Ubuntu also share the\
    \ deb package format and thus can use the same software.  Ultimately, Ubuntu is\
    \ the perfect OS for beginners to Linux, so starting off with Ubuntu is a great\
    \ choice. "
