    Arch Linux is a Linux kernel based computer operating system based on the `IA-32`
    and `x86/64` architectures. It is composed mainly of free and open source software,
    and Arch is mostly known for the huge amount of customization that it can provide.
    Arch Linux is supported by community involvement, which makes it relatively easy
    to obtain support for. Arch Linux is designed with the KISS principle meaning
    `Keep It Simple Stupid`. While the code design is simple in nature, actually using
    the OS is fairly difficult. Arch comes with no graphical user interface, or any
    specific applications at all.  The user is expected to “build” the entire system
    piece by piece to their own liking. Through learning what to install and how,
    the user eventually gains a deep understanding of distributions and Linux in general,
    which is why Arch is recommended for users wishing to learn more about Linux.
    While it is not recommended as a first distribution, every person interested in
    Linux should build their own unique version of Arch at some point to further their
    knowledge.


    CrunchBang (#!) Linux is a Linux kernel based computer operating system based
    off of Debian. The developer Phillip Newborough designed CrunchBang Linux to use
    far less system resources than Debian, making it much more lightweight and flexible.
    CrunchBang Linux has its own repository of software, but got the majority of its
    packages from the Debian repositories. In 2013 Jim Lynch (a popular reviewer)
    described CrunchBang as being functional, efficient, and capable of running effectively
    on both older hardware and newer machines. It is true that CrunchBang avoids a
    bogged-down experience by giving preference to usibility and speed, which makes
    it an attractive distro choice for the intermediate Linux user wishing for a no-nonsense
    sophistication.


    Damn Small Linux (DSL) is a Linux kernel based computer operating system developed
    with an extreme minimalism design philosophy in mind. Damn Small Linux is free
    and open source, available under the `GNU GPL`. DSL was originally conceived and
    maintained by the developer John Andrews as a project to determine just how much
    could fit onto 50mb. DSL is actually very usable straight out of the box, and
    it is best suited to users that need quick access to Linux tools. It is because
    of this that DSL is best kept on a USB drive that can be booted form any computer.


    Red Star OS is an interesting case in the Linux world. It is a North Korean operating
    system used by residents of the communist country. Development on Red Star began
    in the year 1998 at the Korea Computer Center. Before Red Star, computers in North
    Korea typically ran Ubuntu. Since North Korea wishes to maintain control over
    internet resources and citizen’s access, only a tiny amount of state government
    officials and important tourists are allowed access to the Internet. These people
    would be using Red Star OS, and the government’s control of the OS gives them
    extra control over the citizens. The OS is actually closed-source and proprietary,
    which goes against the most basic Linux and FOSS philosophies. Linux enthusiasts
    like to study and marvel at Red Star due to its extremely niche user base and
    function. Obviously it is not recommended to be installed for almost anyone reading
    this book, but it exists as a novel concept and interesting read.


    ## Installing Linux


    After reading so much about Linux distributions, you must be very ready to give
    one a try, and you can install a Linux OS though various methods. Generally, the
    process of trying out a Linux distro involves obtaining an `.iso` copy of the
    OS and burning it onto a removable media (CD, USB, etc…) and finally making your
    PC boot from that media. In our extended example for this book we will download
    and install Ubuntu. Certainly you can substitute any other Linux distro in our
    examples, but the specifics here will still refer to Canonical’s easy-to-use beginner
    OS.


    Linux-based operating systems can be installed and booted either from a USB flash
    drive, a CD or DVD, or even a floppy disk. The first step to installing Linux
    involves obtaining a writable media that can hold your OS. A 4GB flash drive is
    usually sufficient (and that is what we will continue the demonstration with),
    but you may need an 8GB one for larger images.


    Secondly, we need to obtain a copy of the OS. Through the website `http://www.ubuntu.com/`
    you can navigate to the “Desktop” page and then “Download Ubuntu”. By default,
    Ubuntu’s latest version will be displayed on this page with a few system requirements.
    Take this time to make sure that your computer can cope. Also, printing out the
    next few pages of this guide is a decent idea as well, because once you start
    Linux you may not have a chance to pull this book back up. Click the “Download”
    button to proceed. Ubuntu is monetarily free; to avoid donating to Canonical enter
    `$0` in all of the boxes and click the “Download” button at the bottom. The image
    will begin downloading.


    Third, we will need an application with which to “write” the OS to the media.
    The most popular tool for writing images is `UNetbootin` (`https://unetbootin.github.io/`),
    but the free tool `Rufus` (`https://rufus.akeo.ie/`) is much easier to use. Snag
    a copy of `Rufus` and wait for all downloads to finish.


    Fourth, insert the removable media into a USB port and start `Rufus`. Your USB
    drive should be listed in the top drop-down box. By writing the Ubuntu image onto
    the drive you will be erasing all of its contents, so back it up now if you need
    too. The default `Rufus` settings will suffice for our needs, but we will need
    to make sure that “Create a bootable disk using” is checked, and that the dropdown
    says “ISO Image”. Change that and click the disc button beside it to open up a
    file explorer. Navigate to our downloaded Ubuntu image and double click it. We
    can now press the “Start” button to begin writing Ubuntu onto the drive. Do so.
    After the process is complete shut down the computer.


    Fifth, start up the PC and enter the BIOS before Windows loads. The key to do
    so varies as per motherboard manufacturer, but it is usually one of the `F` keys
    at the very top of the keyboard. Every motherboard manufacturer also has their
    own BIOS layout so the explanation here is general and vague. Find a “boot” tab
    or something similar where you can view the “boot order” of your PC. The boot
    order tells the computer where to look for operating system images, and typically
    BIOS will look in the internal hard drive first. Change the order to place USB
    or external hard drives first. Save and quit the BIOS.


    Starting up the computer one last time will start our last step BIOS will search
    in the external USB first and find the Ubuntu image. If Windows loads instead
    of Ubuntu than repeat Step 5, but otherwise you will boot into your first Linux
    system. Congratulations!


    The OS that appears is fully intractable and usable, but there still is a slight
    problem- it is still running from the USB drive and has thusly not installed itself.
    Ubuntu variants contain an application on the desktop that you can double click
    that will start the install process for you. If you are done testing Linux and
    are ready to erase Windows, then click this option. Be warned that if you choose
    certain options you will erase your entire computer, so read the directions carefully.
    You can choose to “dual boot” with your current OS, or you can choose to completely
    wipe the computer and start from scratch. It is recommended that you dual boot
    at first, just in case you need to get back to Windows for a certain application
    or feature. As a failsafe, though, definitely fully backup your computer before
    attempting any installation.

    '
