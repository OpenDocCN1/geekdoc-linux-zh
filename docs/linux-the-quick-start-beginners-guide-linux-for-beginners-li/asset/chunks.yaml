- fmt: "\n| Command | Description | Example |\n| :--- | :--- | :--- |\n| `lpr/lpq`\
    \ | Linux Printing / Linux Print Queue | `lpr` will print the specified file to\
    \ the default printer, while `lpq` will display the print queue and the status\
    \ of print jobs. | `lpr test.txt` |\n| `grep` | Globally Search a Regular Expression\
    \ and Print | Search the specified file for a specific text. | `grep test.txt\
    \ Linux` |\n| `\\|` | Pipe | The straight line character `|` is not actually a\
    \ command by itself, but it links two terminal commands together. The output of\
    \ the first command is “piped” into the input of the next command. | `hostname\
    \ -i | awk '{print $3}'` |\n\nFinally, learning the terminal can prove to be laborious-\
    \ sometimes it seems as though Linux only wants you to memorize all of the commands.\
    \  Fear not, for no command needs to be internalized save for one- man. Man is\
    \ short for manual, and through the single command `man` you can learn about any\
    \ other command on the system. `man cp` would pull up the manual page for copy,\
    \ and `man grep` would remind you what that command is for.  The pages are long\
    \ and detailed, full of examples, and sure to help you out next time you forget\
    \ how `tar` even works.\n\n# Staying Safe on Linux\n\nComputer viruses are a plague\
    \ that mostly effect Windows machines. This comes about because of the large market\
    \ share that Windows has. It makes sense that if Windows is installed on 80% of\
    \ computers than 80% of viruses and malware are going to be made for Windows.\
    \ The fact holds true, which is why Apple and Linux computers rarely have to worry\
    \ about viruses.  However, risks still exist within Linux. Viruses are possible,\
    \ so use the following tips to stay safe.\n\n*   Do not download just any program.\
    \ The default repositories are obviously safe, but if you are following an internet\
    \ tutorial on how to install a program they could be leading you down a dangerous\
    \ path.  Only install from trusted sources.\n*   There are plenty of “jokes” in\
    \ Linux that can wreck your system. Because Linux offers full control to users,\
    \ it often gives them opportunities to ruin their computers. The running joke\
    \ in Windows is to “delete system32” (obviously do NOT try this!) and the Linux\
    \ equivalent is to `sudo rm –rf /`. The command deletes EVERY file on the system,\
    \ so never run it, even if told.\n*   Network security still exists, so just because\
    \ you are running Linux doesn’t mean that your online passwords and accounts are\
    \ any more protected.\n*   Update your system often. Updating applications and\
    \ the entire distribution can eliminate vulnerabilities and bugs that give hackers\
    \ an entry point into your PC.\n*   Backup your data often too. Linux has the\
    \ most secure and reliable operating systems, but there is still the possibility\
    \ that Linux could fail or its files could become corrupted. Regular backups mitigate\
    \ risks.\n*   Use `sudo` sparingly. Linux remains so secure because every serious\
    \ command requires root access to actually do damage, and malicious programs will\
    \ never actually get the opportunity provided you do not give it to them. Windows\
    \ remains vulnerable because most home users utilize the admin profile as their\
    \ daily account. Malware and viruses can take advantage of the admin’s enhanced\
    \ permissions to wreak havoc, but since you are never admin in Linux that risk\
    \ is much smaller.\n\nIn conclusion, the average Linux user is already much safer\
    \ than the average Windows user.  Despite this, there are still a few best practices\
    \ that every computer user should follow, regardless of operating system.\n\n\
    # Fun with Linux\n\nThere are a number of free games and other oddities you can\
    \ play around with on your Linux machine, even if you are running just a Command\
    \ Line Interface. Most of these will need to be installed through the terminal\
    \ (remember to `sudo apt-get install programname`). BSD Games is an example of\
    \ a package that has numerous games you can run from the command line, such as:\
    \ `tetris-bsd` (a clone of the game Tetris), `worm` (similar to the old Nokia\
    \ game “Snake”), `atc` (an air traffic control game), and many more.\n\nLiquid\
    \ War is perhaps one of the most unique games available for Linux. In this game,\
    \ you control a cursor followed by a cluster of pixelated liquid and try to assimilate\
    \ other players liquid. The player with the most amount of liquid when the timer\
    \ is up, or if the player assimilates all the other player’s liquid, wins. Liquid\
    \ War won the Most Original Linux Game award from The Linux Game Tome in 2002,\
    \ and was nominated for the Les Trophées du Libre in 2003.\n\n`Cowsay` is perhaps\
    \ the pinnacle of killing time with your Linux machine. With this program you\
    \ can make an ASCII art cow say a line of text with a speech bubble. For example,\
    \ typing `cowsay hello world` into a terminal emulator or Command Line Interface\
    \ will yield you the following.\n\n```\n_____________\n< hello world >\n-------------\n\
    \         \\  ^__^\n         \\  (oo)\\_______\n              (__)\\      )\\\
    /\\\n               ||----w |\n               ||      ||\n```\n\nYou can get more\
    \ creative with this by “pipeing” another command into this called `Figlet`. Figlet\
    \ is a program that can generate “fancy” text. You can achieve this by typing\
    \ `figlet hello world | cowsay -n` into your terminal emulator.\n\n```\n_____________________________________________________\n\
    /  _           _ _                           _     _  \\\n| | |__   ___| | | ___\
    \  __      _____  _ __| | __| | |\n| | | '_ \\ / _ \\ | |/ _ \\  \\ \\ /\\ / _\
    \ \\ \\| | | __ | | |\n| | | '_ \\ / _ \\ | |/ _ \\  \\ \\ \\ / / \\ \\ | | |\
    \ _` | | |\n| | | |    | | | | | |  | | | | | | | | | | | | | | |\n| |_| |\\___|_|_|\\\
    ___/           \\_/\\_/ \\___|_| \\____|||||/\n-------------------------------------\n\
    \         \\  ^__^\n         \\  (oo)\\_______\n              (__)\\      )\\\
    /\\\n               ||----w |\n               ||      ||\n```\n\nThe above ascii\
    \ art is hopefully rendered correctly through your reading medium. If not, sorry\
    \ for the scrambled lines!\n\nThere are many other fun things you can do with\
    \ `Cowsay`, such as piping the `Fortune` or `Date` into it to make the cow tell\
    \ you a bit of wisdom or give you the time.\n\nHistorically, these simple open-source\
    \ games have been the highlight of gaming on Linux systems, but in the future,\
    \ it seems that will change.  Some commercial games are available for Linux now\
    \ as well, and in the future that number is set to increase. `Minecraft` is one\
    \ extremely popular proprietary game available for Linux systems, due to the fact\
    \ that the game is written in the programming language `Java` and is thus cross\
    \ platform.  The digital distribution platform, `Steam`, is even available for\
    \ Linux today.  Gabe Newell, the man in charge of the company, `Valve`, that is\
    \ responsible for `Steam`, described Microsoft’s Windows 8 as “a catastrophe for\
    \ everyone in the PC space”, and thus is making Linux much more of an accessible\
    \ platform for the future of PC gaming.\n\n`Half Life 2`, `Portal`, `Dota 2`,\
    \ `Limbo`, `Psychonauts`, `Saints Row IV`, `Tomb Raider`, and `Danganrompa 2:\
    \ Goodbye Despair` are some examples of mainstream games available for Linux through\
    \ `Steam`.\n"
