    that is synced across computers, even if they run alternative operating systems.
    Sharing a file is as easy as dragging and dropping the file into the folder. A
    must for anyone with multiple computers and multiple operating systems. |


    # How Linux Works


    Linux is able to work through a complicated system of interactions that allows
    the kernel and various pieces of software to control the hardware on your computer.
    Mainly, Linux still contains the basic files, folders, and programs that we have
    grown accustomed too. Differences arise, however, from discussing the customizable
    parts that are not changeable in Windows. The most important bits are discussed
    below in technical detail.


    # The Desktop Environment


    A desktop environment is what you see on the monitor when actually using a graphical
    operating system. It is typically easier for a user to start and run software
    by manipulating and clicking on the desktop environment than it is for them to
    type commands into a text-only interface. The desktop environment usually consists
    of icons, windows, folders, a wallpaper, widgets, and drag and drop functionality.
    These familiar functions are standard in almost all operating systems. Just as
    Windows has folders, windows, icons, and a mouse pointer, so does Linux through
    desktop environments (DEs). There are many desktop environments available for
    use such as `Cinnamon`, `Enlightenment`, `GNOME`, `MATE`, `Xfce`, `LXDE`, and
    more. Each different distro has a preferred DE that is usually preinstalled and
    gives those operating systems unique colors and looks. As you read about the different
    DEs, consider the fact that you can install any DE onto any distro. Some DE might
    appeal to you more because its functions, and do be afraid to switch.


    ## GNOME

    `GNOME` is a graphical desktop environment described as an “easy and elegant way
    to use your computer”. In its 3rd iteration, `GNOME` is default on `Ubuntu`. The
    format is designed to be simple and stylish as well- `GNOME`’s only downside is
    the moderately high system requirements and the lag it can cause on older computers.
    If you are coming straight from Windows, `GNOME` is a good stepping stone to other
    desktop environments.


    ## Cinnamon

    `Cinnamon` is a popular desktop environment that utilizes many of the applications
    that `GNOME` does- just in a more responsive and less flashy way. If you tried
    `GNOME` but it was a little “heavy” and large, then `Cinnamon` may rectify your
    situation. You will still need moderately high system requirements though, as
    it takes a good amount of computing power to run `Cinnamon`.


    ## Mate

    `Mate` is the lighter `Cinnamon`. The important features of `GNOME` and `Cinnamon`
    are present, but the extras are thrown out to create a DE that can run on slower
    computers. Basically if you like the way `GNOME`-like desktops work, you can choose
    between the 3 tiers of resource intensiveness with `Mate` being at the bottom.


    ## LXDE

    `LXDE` is an abbreviation for “Lightweight X11 Desktop Environment”. It has low
    resource requirements, making it a good desktop environment for low-end and older
    computers. 1GB PCs can run Linux with `LXDE` fairly easy, making it great for
    reviving old computers. The interface is simple and light as well. `Lubuntu` is
    a `Ubuntu` variant running `LXDE`, so if you are looking for a quick and speedy
    OS that has the ease of use of Windows, `LXDE` can facilitate it.

