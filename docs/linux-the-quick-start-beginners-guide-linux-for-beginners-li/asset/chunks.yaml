    有多种 Ubuntu “变体”，它们保留了 Ubuntu 的核心软件和功能，但添加了独特的特化功能，使其变得非常实用。例如，Lubuntu 是“轻量级 Ubuntu”，它保留了
    Ubuntu 对初友的软件，但去除了额外的视觉效果，以便在较慢的硬件上运行。Xubuntu 是另一个“轻量级 Ubuntu”，但 X 更关注实用功能，而不是将速度作为唯一首要任务。Ubuntu
    Studio 是为内容创作者设计的变体，因为该系统预装了音频和视频编辑工具。Ubuntu 旨在成为一种为教育设计的变变体。Kubuntu 采用了流行的 KDE
    界面，创造出友好且高度可定制的体验。Mythbuntu 是为媒体流和电视直播构建的。互联网上有大量的 Ubuntu 变体，它们对于 Linux 新手来说是尝试“第二
    Linux 系统”极极选择，因为它们结合了 Linux 的定制与实验性以及 Ubuntu 的相对“安全”和“熟悉”。


    Slackware 是由 Patrick Vokerding 在 1993 年基于 Softlanding Linux System 创建的 Linux 发行版。Slackware
    的目标是设计成稳定、简单且最“类 Unix”的 Linux 发行版。Slackware 没有图形化安装方法，也没有软件包的自动依赖关系。它不带有图形化用户界面，而是启动到纯文本的命令行界面——正因如此，Slackware
    最适合经验丰富的 Linux 用户。正如其名称暗示的那样，Slackware 最初作为一个没有严肃承诺的私人侧项目启动的。然而，在该操作系统流行后，该名称被保留了下来。该操作系统是
    Linux 老兵以及那些想要体验 Linux 根源的人的好选择。


    Fedora 是一个由红帽企业赞助、基于 Linux 内核的社区开发操作系统。Linux 社区此前还开发并维护过 Fedora 项目。Linus Torvalds
    经常使用 Fedora，主要是因为它的“尖端”特性以及它非常良好的可开发性。Fedora 项目的目标是让 Fedora 成为最尖端的操作系统，所以除非你想要为
    Linux 开发或喜欢接受挑战，否则不要尝试安装它。


    Debian 是一个完全由自由开源软件（FOSS）组成的发行版，大部分遵循 GNU 通用公共许可证。1993 年，其创始人 Ian Murdock 发布了第一个版本的
    Debian。Debian 由志愿者网络团体 Debian 项目负责维护和分发。它是以与 GNU 项目相同的精神开发的，并在 1994 年 11 月至 1995
    年 11 月期间获得了自由软件基金的支持。在自由软件基金会赞助结束后，Debian 项目创建了名为“公共利益软件”的非营利组织，帮助其他机构分发和创建自由开源硬件软件。Debian
    的闻名在于稳定性，因为它已经存在了很长时间，可以提供几乎没有错误和崩溃的计算体验。该操作系统曾作为其他操作系统（如 Ubuntu 和 Knoppix）的基础和起点。Debian
    有三个版本：Testing（测试版）、Unstable（不稳定）和 Stable（稳定）。Debian Testing 和 Debian Unstable
    是滚动更新，意味着它们持续更新。新软件包被加载到 Debian Unstable，并在 Debian Testing 中进行测试。当这些软件包足够稳定时，Debian
    Testing 就会变成新的 Debian Stable。Debian 软件仓库包含超过 50,000 个软件包。官方仓库仅包含自由和开源软件，也可以下载非自由软件。自由软件基金会创始人
    Richard Stallman 曾批评 Debian 项目也使用非自由仓库，但在 2004 年，Debian 项目通过多数投票决定继续托管非自由仓库。由于视频和音频编码器的专有性质，Debian
    项目的自由开源精神为多媒体支持带来了挑战。总的来说，Debian 提供了典型的 Linux 体验——稳定、快速、开源且可靠。如果你感兴趣，可以考虑尝试 Debian。


    一个拥有忠实支持者的非常流行的发行版被称为 Gentoo。与二进制软件包发行系统不同，Gentoo 的软件必须针对用户的设备进行特定的编译。编译软件是一个漫长而困难的过程，但针对设备的特定编译为高级用户带来了
    Gentoo 无与伦比的速度和稳定性。操作系统速度的显著提升是指 Gentoo 企鹅——已知游泳最快的企鹅。Gentoo Linux 对那些想要完全控制所运行软件并获得定制体验的
    Linux 用户非常有力，因此在选择想要尝试的操作系统时请考虑这一点。使用 Gentoo 陡峭的学习曲线往往会阻挡学者，留下了最聪明的 Linux 用户。


    Android 是 Google 为便携设备开发的移动操作系统。这个流行的手机操作系统最初由一个独立团队开发，但在 2005 年被 Google 收购。Android
    在手机市场上拥有巨大的市场份额，因为现在大多数人口袋里要么有 Android 要有 iPhone。Android 具有极好的 ARM（一种处理器）支持，并可以运行来自“Play
    Store”的数百万应用程序。虽然你可能不会在桌面电脑上安装 Android，但它在资源有限的小型计算机和旧设备上有许多用途。


    Tiny Core Linux 是一个基于极简 Linux 内核的操作系统。它有有限（或几乎没有）预装程序，但可以作为最旧、最慢电脑的 Linux 安装系统。整个操作系统在十一到十六兆字节之间，因此在优
    盘或 SD 卡上安装它是完全可能的。该操作系统最适合希望从零开始创建一个轻量化系统的中级 Linux 用户。


    Chrome OS 是 Google 开发的操作系统，与 Android 类似，基于 Linux 内核。该项目由 Google 于 2009 年 7 月宣布。它旨在让用户数据和应用程序在“云端”而不是计算机内存中运行。第一台
    Chrome OS 笔记本电脑被称为 Chromebook，于 2011 年 5 月发布。Chrome OS 设计用于连接网络以仅运行简单的应用程序和网页浏览。尽管存在集成媒体播放器和集成文件管理器等功能，但大多数应用程序实际上只是
    Google 的网站。这使得低配置计算机可以非常廉价地制造用于 Chrome OS，使其适用于低规格设备。Chrome OS 在大学生、非技术型买家和预算计算机之间非常流行，是一个非常流行的操作系统。你可能实际上无法在计算机上安装
    Chrome OS，但你完全可以安装开源等效物 – Chromium OS。Chromium OS 推荐用于仅用于网页浏览和其他常见互联网任务的低配置笔记本电脑。

