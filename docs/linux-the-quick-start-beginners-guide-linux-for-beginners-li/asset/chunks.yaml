  trans: '

    在 1995 年全年里，内核得到了扩展并移植到许多平台，扩大了 Linus 及其内核的影响力。1996 年引入了额外的改进，例如多处理器支持，这加强了 Linux
    在企业和大学环境中的应用。21 世纪初的标志是 Linux 的快速改进以及可用发行版数量的剧增。戴尔（Dell）和惠普（HP）等大公司与发行版合作，为消费者在购买电脑时提供操作系统的选择。在此期间，Linux
    通过为服务器和客户端提供一种替代操作系统，并关注性能和稳定性而非功能和美学，成为了一项行业支柱。如今，Linux 以其在智能手机、桌面电脑和服务器中的广泛应用而闻名，而这一点的实现得益于
    Linus Torvalds 以及为项目做出贡献的无数志愿者的投入工作。


    ## 自由开源软件


    Linux 是开源和自由软件的优秀典范。它也被称为 `FOSS`，自由开源软件是指表现出某些伦理开发特征和哲学的程序。自由软件确实意味着金钱上的免费，在这种情况下，它也意味着程序拥有“自由”。“自由”程序是指可以自由运行、分发、更改和复制且不产生后果的应用。与之相反的是如
    `Photoshop` 类的付费程序；复制 `Photoshop` 并送给朋友会有严重的后果。开源软件指的是程序代码的透明度。如果源代码可以查看，那么该程序就是开源的。隐藏且不可访问的源代码是闭源的。开源代码促进诚实和信任，而闭源代码则是隐藏和阴暗做法的类比。`FOSS`
    结合了自由软件和开源编码的理念，以提供真正自由且透明化开发的应用程序。即使是本文档的文本“Liberation Serif”，也是 `FOSS` Linux
    应用中常用的免费字体。


    由于 Linux 开发的社区驱动的本质，Linux 仍然是一个特别出色的 `FOSS` 范例。任何时候的任何人都可以查看 Linux 的源代码并提出更改。存在多种不同的操作系统发行版，是因为任何个人都可以将
    Linux 代码作为他们自己操作系统的核心。这种哲学在其整个开发过程中都提供了帮助。


    ## GNU


    `GNU` 既是一个操作系统的名称，也是其大量 `FOSS` 集合的名称。有趣的是，“GNU” 的意思是“GNU 不是 UNIX”，这解释了 `GNU` 是一个不包含
    UNIX 代码的类 UNIX 操作系统。计算机大师 Richard Stallman 在 20 世纪 80 年代中期创建了 `GNU`，远在 Linux 被构想为
    UNIX 的“自由”替代方案之前。在 Linus Torvalds 将 `GNU` 的核心工具融合到 Linux 内核之前，`GNU` 一直是一个小众产品。老地说，基于
    Linux 的操作系统大部分实际上是 `GNU` 代码，但 Richard Stallman 很少获得对其贡献的认可。正因如此，内核有时被写成 `GNU/Linux`
    而不仅仅是 `Linux`。Torvalds 承认 `GNU` 在他的内核中扮演了巨大角色，但也认为如果没有内核，`GNU` 将毫无用。这两位行业巨头 Torvalds
    和 Stallman 冲突的性格导致了几次激烈的争论，但最终他们都创建了相互协作运行的产品，以促进计算机操作系统的发展。读作 `Linux` 还是 `GNU/Linux`
    取决于用户，但每个操作系统通常按发行版的名称命名！


    ## 企鹅 Tux


    `Tux` 是 Linux 内核的吉祥物。他的名字与 `Linux` 同义，这两个概念经常一起出现。`Tux` 由 Larry Ewing 在 1996 年创建，旨在赢得
    Linux 标志的位置。然而，这只企鹅并没有获胜；相反，它受欢迎，以至于从未真正离开过，因此 `Tux` 从标志变成了吉祥物。`FOSS` 在 `Tux`
    中也占有一席，因为他是使用流行的 `FOSS` 图像软件 `GIMP` 绘制的。


    Linus 提到企鹅角色的起源于他去澳大利亚的一次旅行，那次旅行以企鹅为独特标记。这显然是一个笑话，Larry Ewing 将这个故事编成了一个广受欢迎的内部梗。


    `Tux` 也曾在其他媒介中客串过，但吉祥物大部分时候被看到破坏 Windows 电脑或嘲讽闭源和专有软件。


    ## 谁在使用 Linux？


    因此，在读了关于 Linux 从何而来以及它将走向何方之后，人们可能会好奇典型的 Linux 用户是什么样的。各种类型的人都喜欢基于 Linux 的操作系统，每个人都有选择它的自己的理由。无论你是一个喜欢自定义的极客、一个希望节省计算机成本的板主，还是一个寻找新服务器操作系统的系统管理员，Linux
    都是一个灵活且易塑的操作系统。内核本身简单且稳定，海量的发行版保证了每种需求都有特殊的体验。请阅读下一章，了解发行版以及它们如何满足你的需求。


    ## 选择 Linux 发行版


    发行版是采用 Linux 内核并提供预装应用程序和服务的以构建全方位计算环境的操作系统。发行版的数量之大令人震惊，但每个发行版都能提供独特且定制的体验。找到一个适合你需求的发行版可能会促使你安装并在你的电脑上尝试。以下是最著名的。


    `Ubuntu` 可能是最著名的基于 Linux 的操作系统。基于 `Debian`，`Ubuntu` 被描述为“面向人类的 Linux”。`Ubuntu`
    的流行源于易用性，因为它比 `Debian` 直观得多。`Ubuntu` 这个词字面意思是“人性”，源于一种同名的南非哲学。`Ubuntu` 由 `Canonical`
    开发，这是一家由 Mark Shuttleworth 拥有的英国公司。Canonical 通过通过销售 `Ubuntu` 以及其他项目的技术支持来维持财务状况。尽管由一家专有公司开发，`Ubuntu`
    仍然是自由且开源的。从 2004 年首次发布开始，`Ubuntu` 每六个月更新一次。每两年有一个 `Ubuntu LTS`（长期支持版），这是由 `Canonical`
    提供的长期支持的更新。`Ubuntu` 默认包含 `LibreOffice`、`Firefox` 和 `Transmission` 等软件。新软件可以通过
    `Ubuntu Software Center` 安装，这是一个专门为在 `Ubuntu` 上安装额外软件而设计的程序。这对于 Linux 新手非常有利，因为它非常简单。像
    `Debian` 一样，`Ubuntu` 及其软件使用符合 FOSS 的 GNU 许可证发布，因此它的默认软件都是自由开源的。`Debian` 和 `Ubuntu`
    还共享 `deb` 软件包格式，因此可以使用相同的软件。最终，`Ubuntu` 是 Linux 初学者的完美操作系统，因此从 `Ubuntu` 开始是一个明智的选择。


    '
- fmt: '

    There are various Ubuntu “flavors” which retain the core software and functionality
    behind Ubuntu but add a unique specialization that makes them useful. For example,
    Lubuntu is “lightweight Ubuntu”, an OS that keeps the beginner-friendly software
    of Ubuntu but strips the extra effects so it can run on slower hardware. Xubuntu
    is another “lightweight Ubuntu”, but Xu is more focused on useful functionality
    rather than having speed as the only priority. Ubuntu Studio is a flavor for content
    creators, as the OS comes with audio and visual editing tools preinstalled. Ubuntu
    aims to be an Ubuntu variant designed for educational purposes. Kubuntu takes
    the popular KDE interface to create an experience that is friendly and highly
    customizable. Mythbuntu is built for media streaming and live television watching.
    There are numerous Ubuntu variants available on the internet, and they are great
    for Linux newbies to experiment with as their “2nd Linux OS” because they combine
    Linux customization and experimentation with the relative “safety” and “familiarity”
    of Ubuntu.


    Slackware is a Linux distro created in 1993 by Patrick Vokerding based off of
    the Softlanding Linux System. Slackware’s goal is to be designed to be stable,
    simplistic, and the most “UNIX-like” Linux distro. Slackware has no graphical
    installation method and no automatic dependency of software packages. It also
    does not come with a graphical user interface and boots to a text-only command
    line interface instead - Slackware is most suited for experienced Linux users
    because of this. Slackware was started as a private side project with no serious
    commitment, as the name implies. After the operating system became popular, however,
    the name was still kept. The OS is a good choice for Linux veterans and those
    that want to experience the roots of Linux.


    Fedora is a community developed operating system sponsored by Red Hat enterprises
    and based on the Linux kernel. Linux has previously developed and maintained the
    Fedora Project as well. Linus Torvalds regularly uses Fedora, mostly because of
    the “bleeding edge” nature of it and how well it can developed upon. The goal
    of the Fedora Project is to make Fedora the most cutting edge operating system,
    so don’t try installing it unless you wish to develop for Linux or like a challenge.


    Debian is a distro composed entirely of FOSS, mostly under the GNU General Public
    License. 1993 saw the first release of Debian by its creator Ian Murdock. Debian
    is maintained and packaged by the volunteer Internet group, the Debian Project.
    It was developed in the same spirit of the GNU Project and gained the support
    of the Free Software Foundation from November of 1994 to November of 1995. After
    the end of the Free Software Foundations sponsorship, the Debian Project created
    the non-profit organization called “Software in the Public Interest” to help other
    organizations distribute and create free and open-source hardware and software.
    Debian’s claim to fame is stability, as it has been around for quite some time
    and can offer a computing experience mostly free of bugs and crashing. The OS
    has been used as a base and starting point for other operating systems, such as
    Ubuntu and Knoppix. There are three versions of Debian: Testing, Unstable, and
    Stable. Debian Testing and Debian Unstable are rolling release, meaning they are
    continuously updated. New packages are loaded to Debian Unstable, and are tested
    in Debian Testing. When these software packages are stable enough, the Debian
    Testing becomes the New Debian Stable. The Debian software repositories contain
    over 50,000 software packages. The official repositories contain only free and
    open-source software, but non-free software can be downloaded as well. Richard
    Stallman, founder of the Free Software Foundation criticized the Debian Project
    for also using a non-free repository, but in 2004 the Debian Project decided to
    continue hosting the non-free repository by a majority vote. The free and open-source
    spirit of the Debian Project has posed a challenge for multimedia support, because
    of the proprietary nature of video and audio codecs. Overall, Debian offers the
    stereotypical Linux experience – stable, fast, FOSS, and reliable. Consider trying
    out Debian if you are interested.


    A very popular distro with a cult following is called Gentoo. Unlike a binary
    software package distribution system, Gentoo’s software must be compiled specifically
    for the user’s device. Compiling software is a long and difficult process, but
    compiling specific to the device gives Gentoo unmatched speed and stability for
    advanced users. The significant increase in speed in the OS is a reference to
    the Gentoo penguin- the fastest known swimming penguin. Gentoo Linux is appealing
    to Linux users who want full and entire control of the software they run with
    a customized experience, so reflect on this when choosing which OS you want to
    try out. The large difficulty curve in using Gentoo often wards off beginners
    and leaves the cleverest Linux users.


    Android is a mobile OS developed by Google for portable devices. The popular cell-phone
    operating system was initially developed by an independent team but it was bought
    by Google in 2005. Android has a huge market share on mobile phones, as most have
    either an Android or an iPhone in their pocket right now. Android has great ARM
    (a type of processor) support and can run millions of apps from “Play Store”.
    While you might not typically install Android on a desktop machine, it has plenty
    of uses on smaller computers and older devices with limited resources.


    Tiny Core Linux is a minimal Linux kernel based operating system. It has limited
    (or virtually no) preinstalled programs, but it can serve as an installation of
    Linux for the oldest and slowest computers. The entire operating system is between
    eleven and sixteen megabytes, so installing it on a thumb drive or SD card is
    very possible. This OS is best installed by intermediate Linux users that wish
    to create the most lightweight operating system possible from scratch.


    Chrome OS is an operating system developed by Google, and- like Android-, it is
    based on the Linux kernel. The project was announced by Google in July of the
    year 2009. It is designed for both user data and applications to run in “the cloud”
    rather than from the computer’s RAM. The very first Chrome OS laptop, called Chromebook,
    was released in May of the year 2011. Chrome OS is designed to be connected to
    the internet for running only simple applications and web browsing. Although features
    such as an integrated media player and integrated file manager exist, most of
    the applications are actually just websites owned by Google. This allows computers
    with lower specifications to be made very cheaply for Chrome OS, making it suitable
    for low-spec devices. Chrome OS is popular among college students, the non-tech
    savvy buyer, and budget computers, and it is a very popular operating system.
    You may not actually be able to install Chrome OS on a computer, but you can certainly
    install the open-source equivalent – Chromium OS. Chromium OS is recommended for
    low-spec laptops whose only purpose is web browsing and other common internet
    tasks.

    '
