  trans: "\n\n# LFS，也称为从零构建 Linux（Linux from Scratch），这是一本解释如何创建你自己的发行版的书籍和资源。对于体验过\
    \ Linux 并确切知道自己喜欢哪些组件的用户，可以通过遵循这份实用的指南将定制推到极致。这是学习 Linux 系统每个部分如何协同工作以提供计算体验的绝佳方式。此外，创建者可以完全自定义，包含或排除他们喜欢的任何系统部分。拥有一个以自己命名的发行版不是很棒吗？\n\
    \n## 树莓派 (Raspberry Pi)\n\n实验 Linux 最最小且最廉价的方法之一是使用一种信用卡大小的电脑，即 `Raspberry Pi`。`Pi`\
    \ 仅需 25 美元起，是一个没有移动部件的单芯片系统，可用于 Linux 开发和学习。对于那些不希望完全安装 Linux 来替换桌面操作系统的人来说，`Raspberry\
    \ Pi` 可以作为你进行实验的设备。它最初是为了教学生儿童如何编程而开发的，但 `Pi` 迅速变成了爱好者项目的流行工具。由于它运行 Linux，DIY\
    \ 爱好者可以通过 `Pi` 和一些 Linux 知识将他们的周末项目提升到新的高度。\n\n## 在 Linux 上编程\n\nLinux、OSX 和其他基于\
    \ UNIX 的操作系统使用终端来实现许多功能，就像在 GUI 变得常见之前的历史一样。第一批程序员会使用终端作为他们的“工具链”来创建、编码、编译和运行他们的软件。编码功能从未从终端中被弃，因此严肃程序员仍然倾向于\
    \ Linux 编码工作流带来的易用性。应用程序可以在 `nano` 等终端编辑器中编写，然后用内置的 `gcc` GNU 编译器进行编译，最后在完全不离开几乎所有\
    \ Linux 发行版默认程序的情况下运行所有操作。任何对编程感兴趣但对 Windows 上提供的大型、复杂的 IDE 感到沮丧的程序员，都应该切换到一个鼓励编程和折腾的操作系统。这里有一个用\
    \ C 语言编写“hello world”工作流的小型示例。\n\n在终端中，输入 `nano` 进入一个小型文本编辑器。输入：\n\n```c\n#include\
    \ <stdio.h>\n\nint main(){\n    printf(\"Hello World!\\n\");\n    return 0;\n\
    }\n```\n\n按 `ctrl+x` 退出，并在询问是否保存文件时按“y”。选择“hello.c”作为文件名。现在需要编译程序了。在终端中输入 `gcc\
    \ hello.c`。只要程序被完全复制，它就会无错误编译，并在当前目录下创建一个名为 `a.out` 的可执行文件。输入 `./a.out` 启动它，你应该看到“Hello\
    \ World!”。在不下载任何额外程序的情况下，Linux 证明了它是程序员的天堂。学习编程也将增加你的 Linux 知识，你甚至可以创建自己的应用程序。\n\
    \n## Linux 与嵌入式应用\n\n由于基于 Linux 操作系统的可携性和开源特性，它们经常出现在嵌入式计算机上，如汽车、智能电视和物联网。学习如何使用\
    \ Linux 也意味着学习如何配置和定制嵌入式应用。随着设备变得越来越小，越来越多的家用电器变得“智能化”，显而易见，能够理解这些设备如何运行将成为一项利润丰厚的技能。上述提及的\
    \ `Raspberry Pi` 电脑实际上可以利用足够的 Linux 技能和编程知识，将任何设备变得“智能化”。\n\n## 构建 Beowulf 集群\
    \ (Beowulf Cluster)\n\nLinux 非常通用，既可以用于个人电脑也可以用于大型超级计算机。Beowulf 集群是一组计算机，通过同步硬件资源来变成一个临时的超级计算机中心。至少两台安装了\
    \ Linux 的电脑，你就可以将它们连接到网络并共享资源（`Raspberry Pi` 电脑是极的集群节点！）。这里不会解释该过程，但可以在网上找到相关步骤。整个理念证明了\
    \ Linux 可以多么灵活和有用。\n\n## Windows 10 与 Linux\n\n随着 Windows 10 的周年更新，微软在 Windows\
    \ 中加入了一点 Linux 内容。`Bash`（Linux 中使用的终端“语言”）已完全实现在 Windows 10 的命令提示符中。简而言之，这意味着任何\
    \ Linux 程序都可以轻松地移植到 Windows 环境（有点类似于反向的 WINE）。Windows 用户现在甚至输入 `sudo apt-get update`\
    \ 来更新他们的 Windows 系统了！这是一个有趣的更新，整个情况显示了“Linux 桌面年”正快速临近，Linux 在未来的计算中将发挥更更大的作用。\n\
    \n## 结论\n\n希望现在你已经充分了解了 Linux 及其相关软件、如何使用 Linux、基于 Linux 的操作系统的组件以及一些基础 Linux\
    \ 发行版。你现在可以开始自己的 Linux 冒险了。无论你是想自定义桌面，还是想获得对计算机的完全控制权，Linux 都是一个极佳的操作系统工具。只有通过探索和发现，你才能真正学会\
    \ Linux 是如何工作的，因为仅凭这本书无法解释它的复杂性。如果你想继续学习，请尝试更多的 Linux 发行版。安装许多个，找出你喜的。尝试从零开始构建一个，或者做一个涉及\
    \ Linux 的 DIY 项目。你的知识将随着时间的经常使用和自学而增加。\n\n尽管讨论的演示和应用可能看起来过于复杂且没有必要，但它们的存在是为了解释基于\
    \ Linux 的操作系统可以多么先进和多样。从创建超级计算机到让牛说出幽默的话，Linux 促进了计算。\n\n与其花钱使用你已经拥有的硬件，与其受制微软或苹果的控制，Linux\
    \ 给了你对你的设备做任何你想做事情的自由。尽管学习曲线很陡，但只需安装一个发行版并玩玩，你就能获得与他人区分开来的有用计算机知识。\n\nLinux 不仅仅是为电脑极客准备的。它也不仅仅适用于企业环境。Linux\
    \ 适用于任何想要充分发挥计算机潜能的人。读完这本书后，你应该具备导航和与你的 Linux 机器交互所需的入门知识。感谢下载并阅读这本简短的 Linux 初学者指南。继续实验和折腾，很快你就会用你的计算机技术令大家惊讶。\n\
    \n"
