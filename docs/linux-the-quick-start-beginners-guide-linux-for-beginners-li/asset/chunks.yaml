    |


    # Linux 如何工作


    Linux 能够通过一套复杂的交互系统运行，允许内核和各种软件部分控制你电脑上的硬件。主要，Linux 仍然包含了我们已经习惯的基础文件、文件夹和程序。然而，差异出现在讨论
    Windows 中无法更改的自定义部分。最重要的部分将在下面进行详细的技术讨论。


    # 桌面环境


    桌面环境是你实际使用图形化操作系统时在显示器上看到的内容。对于用户来说，通过操作和点击桌面环境来启动和运行软件，通常比在纯文本界面中输入命令要容易。桌面环境通常由图标、窗口、文件夹、壁纸、小部件和拖放功能组成。这些熟悉的功能在几乎所有的操作系统中都是标准配置。就像
    Windows 有文件夹、窗口、图标和鼠标指针一样，Linux 也通过桌面环境 (DE) 拥有这些功能。有许多可用的桌面环境，如 `Cinnamon`、`Enlightenment`、`GNOME`、`MATE`、`Xfce`、`LXDE`
    等。每个不同的发行版都有一个偏好的 DE，这些 DE 通常是预装的，并赋予这些操作系统独特的颜色和外观。当你阅读关于不同 DE 时，请考虑你可以在任何发行版上安装任何
    DE。某些 DE 可能会因为其功能而更吸引你，不要害怕切换。


    ## GNOME

    `GNOME` 是一种图形化桌面环境，被描述为“使用电脑的简单且优雅的方式”。在第三代迭代中，`GNOME` 是 `Ubuntu` 的默认选择。它的格式设计得既简单又时尚——`GNOME`
    唯一的缺点是系统要求中等，以及在旧电脑上可能会导致卡顿。如果你直接从 Windows 转过来，`GNOME` 是通其他桌面环境的好跳板。


    ## Cinnamon

    `Cinnamon` 是一种流行的桌面环境，它利用了许多 `GNOME` 使用的应用程序——只是了一种更有响应且不那么花哨的方式。如果你尝试过 `GNOME`
    但觉得它太“重”且太大，那么 `Cinnamon` 可能会解决你的问题。不过，你仍然需要中等的系统要求，因为运行 `Cinnamon` 需要相当计算能力。


    ## Mate

    `Mate` 是轻量版的 `Cinnamon`。`GNOME` 和 `Cinnamon` 的重要功能都存在，但去除了额外功能以创建一个可以在较慢电脑上运行的
    DE。基本上，如果你喜欢 `GNOME` 风格桌面的工作方式，你可以在三个资源密集等级之间选择，`Mate` 处于最低级。


    ## LXDE

    `LXDE` 是“轻量 X11 桌面环境”的缩写。它对资源的要求很低，使其成为低端和旧电脑的良好桌面环境。1GB 内存的电脑运行带有 `LXDE` 的 Linux
    非常容易，非常适合复活旧电脑。它的界面同样简单轻量。`Lubuntu` 是一个运行 `LXDE` 的 `Ubuntu` 变体，如果你正在寻找一种具有 Windows
    易用性的快速操作系统，`LXDE` 可以实现这一点。


