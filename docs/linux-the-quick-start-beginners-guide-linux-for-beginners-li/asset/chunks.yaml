    ![](img/00001.jpeg)


    # Linux：新手快速入门指南


    (Linux 学者、Linux 命令行、Linux 操作系统、学习 Linux)


    ## 目录：

    - 介绍

    - Linux vs Windows

    - 背景

    - 选择 Linux 发行版

    - 安装 Linux

    - Linux 如何工作

    - 玩转 Linux

    - Linux 高级概念

    - 结论


    ## 介绍


    ### 什么是 Linux？

    Linux 是一个免费且开源的操作系统内核，在全球范围内用于许多用途。内核通过为软件提供一种与设备硬件交互的方式，促进了完整的免费开源操作系统的产生。Linux
    在计算世界既广泛又盛行——很有可能你现在摸摸口袋，就会发现自己正拿着一台运行 Linux 的设备（智能手机！）。使用 Linux 的操作系统运行在世界上大多数超级计算机上，而且
    Linux 甚至被许多政府机构使用。从纽约证券交易所到索尼 PlayStation，Linux 无处不在。


    这是否意味着 Linux 仅供大人物和昂贵的超级计算机使用？绝对不是，因为 Linux 可以轻松地用于编写论文、浏览互联网、观看 YouTube 或检查电子邮件。Linux
    操作系统是免费的，因此它们是昂贵的 Windows 和 Apple 操作系统的极佳替代方案。Linux 有许多不同的发行版本，通常被称为“distros”（发行版），它们为了满足不同的需求而设计。本书将介绍
    Linux 的部分历史、各种发行版以及基于 Linux 的操作系统的用途。总的来说，强烈建议每个人至少学习一点 Linux，因为它被应用于许多领域。


    ## Linux vs. Windows

    操作系统（OS）是计算机的骨干，没有它，计算机几乎毫无用处。通常，计算机会运行如 Windows 等操作系统，但计算机用户可以自由安装任何可以在其硬件上运行的操作系统。虽然我们都熟悉
    Windows 计算机是如何运作的，但尝试安装 Linux 具有许多益处。除了免费之外，Linux 更安全、更可靠、更开放。


    Windows 机器深受病毒的困扰。杀毒软件价格昂贵，而且会减慢即使是最强大的 Windows 电脑。Linux 是一个非常安全的操作系统，感染病毒极其困难。财富
    500 强企业选择运行 Linux 计算机是因为其增强的安全性和无与伦比的可靠性。任何遭受病毒和恶意软件困扰的人都应该考虑尝试 Linux。


    Linux 运行很快，即使在最旧的计算机上也是如此。运行 Windows XP 的旧设备现在可能已经没用了，但安装 Linux 可以为这些即将死亡的技术注入新的生命。某些发行版专门设计为轻量化和快速响应而设计，这可以将计算机的使用寿命延长多年。


    Linux 操作系统自带的内核和软件是免费开源的，FOSS（自由开源软件）应用程序提供的功能与其昂贵的对应品几乎相同。例如，Adobe Photoshop
    的费用超过 500 美元，而 Linux 的免费替代品“GIMP”是免费的。即使 Microsoft Windows 10 大约花费 120 美元，但最流行的
    Linux 发行版 Ubuntu 完全不需要费用。Windows PC 的每一个付费组件都有一个免费的 Linux 等效品。甚至下载新程序的方法在 Linux
    中也得到了改进。在 Windows PC 上，用户必须浏览网站并可能通过下载木马病毒来获取新软件，但在 Linux 上，有安全的存储库可以轻松地下载软件。


    Linux 系统的兼容性仍然很高，因为你可以在各种设备上安装 Linux。无论是全新的电脑、旧古董，还是笔记本电脑和平板，Linux 都是兼容的。相比之下，Apple
    的 OSX 只能在 iMac 上运行，而 Windows 10 只能在较新的电脑上运行。一些极客甚至成功在汽车和联网咖啡壶上安装了 Linux！这意味着你永远不需要担心你的设备是否兼容，或者是否需要购买新电脑。只要设备还能启动，Linux
    就很大可能在其上面运行。


    许多人为了深度定制选择 Android 而不是 iOS。选择 Linux 而不是 Windows 也是如此，因为 Linux 提供了完全的软件自由——许多发行版是为折腾者和定制者设计的。在
    Windows 中，你可以更改壁纸和配色方案，但个性化仅此此。除了颜色和位置，Linux 还允许用户随心地添加和删除组件，创建一个独特的环境。根结底，Linux
    在几乎每一个类别上都优于 Windows。Linux 是免费、安全、开放、可定制且稳定的。虽然不是每个计算机用户都习惯基于 Linux 的操作系统，但他们从离开
    Windows 的切换中一定会受益。砖掉的设备、缓慢且过时的计算机以及被病毒入侵的机器都可以通过安装 Linux 来挽救。如果全新计算体验的可能性激发了你的兴趣，请继续阅读以了解
    Linux 的工作原理以及如何在你的计算机上安装副本。


    ## 背景

    关于 Linux、它的创建以及贡献者，有大量信息。此外，Linux 还有一些部分非常有趣且独特。本章将讨论 Linux 的根源以及它如何成为事实上的操作系统。


    ### Linux 的历史

    1991 年 8 月 25 日，在芬兰的赫尔辛基，Linux 诞生了。当时 20 岁的芬兰学生林纳斯·本尼迪克·托瓦尔斯（Linus Benedict Torvalds）在
    Usenet 新组 `comp.os.minix` 上公开宣布了 Linux 内核的创建。Minix 是 Linux 所基于的当时存在的内核，两者的血缘都可以追溯到一种名为
    UNIX 的旧操作系统。该帖子将托瓦尔斯的项目描述为一种爱好和小型规模的尝试，在计算世界中不会很有分量，而且可能不兼容所有的计算机。


    这种谦逊且相对安静的开端是 Linux 成为行业巨头的先驱。内核在短时间内从一个爱好项目变成了可用产品，1993 年一个由 100 名志愿者组成的团队对项目做出了贡献。后来，Linux
    与理查德·斯托曼（Richard Stallman）的 GNU 核心库融合，创建了完整的内核 1.0 版本。Linus Torvalds 最初本想将他的项目命名为
    `Freax`，但他在赫尔辛基大学的一位同事偷偷将名字改成了 Linux，林纳斯后来同意了这一点。从 1.0 版本开始，Linux 变得作为操作系统可以使用。

    '
- fmt: '

    Throughout 1995 the kernel was expanded and ported to a multitude of platforms,
    increasing the outreach of Linus and his kernel. 1996 saw additional improvements
    such as multiprocessing, which strengthened Linux’s use in corporate and university
    environments. The early 2000s were marked by rapid improvement of Linux and a
    huge increase in the number of distros available. Major companies such as Dell
    and HP partnered with distributions and offered consumers a choice of operating
    system upon purchase. Linux became an industry powerhouse in this time period
    by offering an alternative OS for servers and clients that focused on performance
    and stability rather than features and aesthetics. Today Linux is known for its
    widespread use in smartphones, desktops, and servers, and it was only able to
    reach this point through the dedicated work of Linus Torvalds and the numerous
    volunteers that contributed to the project.


    ## Free and Open Source Software


    Linux is a shining example of open source and free software. Also called `FOSS`,
    free and open source software are programs that exhibit certain characteristics
    and philosophies of ethical development. Free software certainly means monetarily
    free, but in this case it also means that the programs have “freedom”. “Free”
    programs are applications that can be run, distributed, changed, and copied freely
    and without consequence. Opposed to this are paid programs such as `Photoshop`;
    there is a serious penalty for copying `Photoshop` and giving it to a friend.
    Open source software refers to the transparency of a program’s code. If the source
    code can be viewed then that program is open source. Source code that is hidden
    and inaccessible is closed source. Open source code promotes truthfulness and
    trust while closed source code is an analogy for hidden and shady practices. `FOSS`
    combines the ideals of both free software and open source coding to supply applications
    that are truly free and developed transparently. Even the text of this document,
    “Liberation Serif”, is a free font commonly available in `FOSS` Linux applications.


    Linux remains a particularly excellent example of `FOSS` because of the community-driven
    nature of Linux development. Absolutely anybody at any time can view the source
    code of Linux and propose changes. Multiple varied distributions of the OS exist
    because any individual can use the Linux code as a core for their own operating
    system. The philosophy has helped Linux throughout its development.


    ## GNU


    `GNU` is the name of both an operating system and its extensive collection of
    `FOSS`. `GNU` funnily enough stands for “GNU is not UNIX”, explaining that `GNU`
    is a UNIX-Like operating system containing no UNIX code. Computer guru Richard
    Stallman created `GNU` in the mid 1980’s well before Linux was ever conceived
    as a “free” alternative to UNIX. `GNU` remained a niche product until Linus Torvalds
    fused core utilities of `GNU` into the Linux kernel. Honestly a large part of
    Linux-based operating systems is actually `GNU` code, but Richard Stallman rarely
    receives his credit for contribution. It is because of this that the kernel is
    sometimes written as `GNU/Linux` instead of just `Linux`. Torvalds recognizes
    the large part that `GNU` plays in his kernel but also believes that without a
    kernel `GNU` is useless. The clashing personalities of the two industry giants
    Torvalds and Stallman has led to a few heated arguments, but ultimately both men
    created separate products that work well together to facilitate computer operating
    systems. Whether the name is pronounced `Linux` of `GNU/Linux` is up to the user,
    but each individual OS is usually called by the distribution name anyways!


    ## Tux the Penguin


    `Tux` is the mascot of the Linux kernel. His name is synonymous with `Linux` and
    the two ideas are often seen together. Created by Larry Ewing in 1996, `Tux` was
    created to win a place as Linux’s logo. The penguin did not win, however; rather
    he was liked enough that he never really went away, so instead of a logo `Tux`
    became the mascot. `FOSS` has a part in `Tux`, as he was drawn using the popular
    `FOSS` image software `GIMP`.


    Linus speaks of the origins of the penguin character as coming from a trip he
    took to Australia that was uniquely marked by penguins. A joke obviously, Larry
    Ewing spun the story into an inside joke that caught on very well.


    `Tux` has had cameo appearances in other mediums as well, but the mascot can mostly
    be seen destroying Windows computers or poking fun at closed source and proprietary
    software.


    ## Who uses Linux?


    So after reading all about where Linux came from and where it is headed one might
    wonder what the typical Linux user looks like. A wide variety of individuals enjoy
    Linux-based operating systems, and each has their own reason for choosing it.
    Whether you are a tinkerer that enjoys customization, a business owner wishing
    to save on computer costs, or a system administrator looking for a new server
    OS, Linux is a flexible and malleable operating system. The kernel itself is simple
    and stable, and the huge amount of distributions guarantee there is a special
    experience for every need. Read on to the next chapter to learn about distributions
    and how they can suit your needs.


    ## Choosing a Distribution of Linux


    Distros are operating systems that take the Linux Kernel and provide preinstalled
    applications and services for an all-inclusive computing environment. The vast
    amount of distributions is mind-boggling, but each can provide a unique and custom
    experience. Finding a distro that fits your needs might nudge you to install one
    and try it on your computer. Here are the most notable.


    `Ubuntu` is probably the most famous Linux-based OS. Based on `Debian`, `Ubuntu`
    is described as “Linux for Humans”. The popularity of `Ubuntu` came about through
    ease-of-use, as it is much more intuitive than `Debian`. The name `Ubuntu`, literally
    meaning “humanness”, comes from a South African philosophy of the same name. `Ubuntu`
    is developed by `Canonical`, a company in the United Kingdom owned by Mark Shuttleworth.
    `Canonical` supports itself financially by selling technical support for `Ubuntu`
    and technical support for other projects as well. `Ubuntu` remains free and open-source,
    despite being developed by a proprietary company. Beginning from the first release
    in 2004, `Ubuntu` is updated every six months. Every two years there is an `Ubuntu
    LTS` (long term support), which is an update that offers long-term support by
    `Canonical`. `Ubuntu` by default contains software such as `LibreOffice`, `Firefox`,
    and `Transmission`. New software can be installed with `Ubuntu Software Center`,
    a program specifically built for installing additional software on `Ubuntu`. This
    is very advantageous for user new to Linux because it is so easy to use. Like
    `Debian`, `Ubuntu` and its software are released using the FOSS-friendly GNU license,
    so all of its default software is free and open-source. `Debian` and `Ubuntu`
    also share the `deb` package format and thus can use the same software. Ultimately,
    `Ubuntu` is the perfect OS for beginners to Linux, so starting off with `Ubuntu`
    is a great choice.

