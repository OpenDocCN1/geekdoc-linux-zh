  trans: "\n\n| 命令 | 说明 | 示例 |\n| :--- | :--- | :--- |\n| `lpr/lpq` | Linux 打印 / Linux\
    \ 打印队列 | `lpr` 将指定文件打印到默认打印机，而 `lpq` 将显示打印队列和作业状态。 | `lpr test.txt` |\n| `grep`\
    \ | 全局搜索正则表达式并打印 | 在指定文件中搜索特定文本。 | `grep test.txt Linux` |\n| `\\|` | 管道 | 直线字符\
    \ `|` 本身并不是一个命令，但它将两个终端命令连接在一起。第一个命令的输出被“管道”到下一个命令的输入中。 | `hostname -i | awk '{print\
    \ $3}'` |\n\n最后，学习终端可能会证明是费力的——有时 Linux 似乎只想让你记住所有的命令。不要害怕，除了 `man` 命令之外，没有哪个命令需要内化的。`man`\
    \ 是 manual（手册）的缩写，通过这条命令 `man`，你可以学习系统上的任何其他命令。`man cp` 会调出复制命令的手册页，而 `man grep`\
    \ 会提醒你该命令的用途。这些页面很长且详细，充满了示例，一定能在你下次忘记 `tar` 到底如何工作时为你提供帮助。\n\n# 在 Linux 上保持安全\n\
    \n计算机病毒主要是影响 Windows 机器的瘟疫。这是由于 Windows 拥有巨大的市场份额。如果 Windows 安装在 80% 的电脑上，那么 80%\
    \ 的病毒和恶意软件就会为 Windows 制作，这是合理的。事实确实如此，这就是为什么 Apple 和 Linux 电脑很少需要担心病毒。然而，Linux\
    \ 内部仍然存在风险。病毒是有可能的，请使用以下技巧来保持安全。\n\n*   不要随意下载任何程序。默认仓库显然是安全的，但如果你正在遵循互联网上的教程来安装程序，它们可能会引导你走向危险的道路。仅从受信任的源安装。\n\
    *   Linux 中有很多可以毁坏你系统的“笑话”。因为 Linux 为用户提供了完全控制权，它经常给他们破坏电脑的机会。Windows 中盛行的笑话是“删除\
    \ system32”（显然千万不要尝试！），而 Linux 对应的操作是执行 `sudo rm –rf /`。该命令会删除系统上的**每一个**文件，所以永远不要运行它，即使被要求这么做也不行。\n\
    *   网络安全仍然存在，所以仅仅因为你在运行 Linux，并不意味着你的在线密码和账户就更受保护。\n*   经常更新你的系统。更新应用程序和整个发行版可以消除让黑客进入你\
    \ PC 的漏洞和错误。\n*   也要经常备份你的数据。Linux 拥有最安全、最可靠的操作系统，但仍然存在 Linux 故障或其文件损坏的可能性。定期备份可以降低风险。\n\
    *   谨慎使用 `sudo`。Linux 之所以保持如此安全，是因为每一条严重的命令都需要 root 权限才能造成实际伤害，只要你不给它机会，恶意程序永远无法获得机会。Windows\
    \ 仍然很脆弱，是因为大多数家庭用户使用管理员配置作为他们的日常账户。恶意软件和病毒可以利用管理员增强的权限来大作可为，但由于你在 Linux 中永远不是管理员，这种风险要小得多。\n\
    \n结论，普通的 Linux 用户已经比普通的 Windows 用户安全得多了。尽管如此，无论使用什么操作系统，仍然有每位电脑用户应该遵循的一些最佳实践。\n\
    \n# 玩转 Linux\n\n在你的 Linux 机器上，你可以玩许多免费游戏和其他奇玩意，即使你运行的仅仅是命令行界面。其中大部分内容需要通过终端安装（记住使用\
    \ `sudo apt-get install programname`）。BSD Games 是一个示例包，包含许多你可以从命令行运行的游戏，例如：`tetris-bsd`（俄罗斯俄罗斯克隆版）、`worm`（类似于老诺基亚游戏“吃蛇”）、`atc`（一种航空交通控制游戏）等等。\n\
    \nLiquid War 可能是 Linux 上可用的最独特的游戏之一。在游戏中，你控制一个跟随像素化液体簇的光标，并试图同化其他玩家的液体。计时器结束或玩家同化所有其他玩家的液体时，液体最多的玩家获胜。Liquid\
    \ War 在 2002 年获得了 Linux Game Tome 出的“最原创 Linux 游戏奖”，并在 2003 年入选了 Les Trophées\
    \ du Libre。\n\n`Cowsay` 也许利用 Linux 机器消磨时间的巅峰。通过这个程序，你可以让一只 ASCII 艺术牛通过气泡说出一行文本。例如，在终端模拟器或命令行界面中输入\
    \ `cowsay hello world` 将得到以下结果。\n\n```\n_____________\n< hello world >\n-------------\n\
    \         \\  ^__^\n         \\  (oo)\\_______\n              (__)\\      )\\\
    /\\\n               ||----w |\n               ||      ||\n```\n\n你可以通过将另一个名为 `Figlet`\
    \ 的命令“管道”到这里来让它更具创意。Figlet 是一个可以生成“花哨”文本的程序。你可以通过在终端模拟器中输入 `figlet hello world\
    \ | cowsay -n` 来实现。\n\n```\n_____________________________________________________\n\
    /  _           _ _                           _     _  \\\n| | |__   ___| | | ___\
    \  __      _____  _ __| | __| | |\n| | | '_ \\ / _ \\ | |/ _ \\  \\ \\ /\\ / _\
    \ \\ \\| | | __ | | |\n| | | '_ \\ / _ \\ | |/ _ \\  \\ \\ \\ / / \\ \\ | | |\
    \ _` | | |\n| | | | |    | | | | | |  | | | | | | | | | | | | | | |\n| |_| |\\\
    ___|_|_|\\___/           \\_/\\_/ \\___|_| \\____|||||/\n-------------------------------------\n\
    \         \\  ^__^\n         \\  (oo)\\_______\n              (__)\\      )\\\
    /\\\n               ||----w |\n               ||      ||\n```\n\n希望上面的 ascii 艺术通过你的阅读媒介正确渲染。如果没有，很抱歉显示错乱的行了！\n\
    \n你还可以做很多关于 `Cowsay` 的其他趣事，例如将 `Fortune` 或 `Date` 传给它，让牛给你讲一些智慧或告诉你时间。\n\n从历史角度来看，这些简单的开源游戏一直是\
    \ Linux 系统上游戏的亮点，但在未来，这似乎会发生变化。现在 Linux 也有一些商业游戏可用，未来这个数量还将增加。`Minecraft` 是 Linux\
    \ 系统上一个极其流行的专有游戏，因为该游戏是用 `Java` 语言编写的，因此是跨平台的。数字分发平台 `Steam` 今天也已适用于 Linux。负责\
    \ `Steam` 的公司 `Valve` 的负责人 Gabe Newell 将微软的 Windows 8 描述为“PC 领域所有人的灾难”，因此正在让 Linux\
    \ 成为未来 PC 游戏一个更易获取的平台。\n\n`Half Life 2`、`Portal`、`Dota 2`、`Limbo`、`Psychonauts`、`Saints\
    \ Row IV`、`Tomb Raider` 和 `Danganrompa 2: Goodbye Despair` 是通过 `Steam` 在 Linux\
    \ 上提供的的一些主流游戏示例。\n\n"
- fmt: '

    There are a number of home video game console emulators available freely available
    for Linux, such as `PCSX2`, `ePSXe`, `Dolphin`, `FCEUX`, and more. `FCEUX` is
    a free and open source Nintendo Entertainment System emulator. It is also capable
    of emulating the Japanese’s Family Computer Disk System. `FCEUX` was resurrected
    from the abandoned `FCE` and `FCE Ultra` by Anthony Giorgio and Mark Doliner.
    `FCEUX` includes features such as debugging, gameplay video recording, and ROM
    hacking tools. The emulator, `ePSXe`, is a Sony Playstation emulator. It stands
    for “enhanced PSX emulator”. The first release of `ePSXe` was on October the 14th
    2000. The emulator was later released for the Android mobile operating system
    on August the 30th 2012. When `ePSXe` `1.6.0` was released rumors were soon started
    that the development for the emulator has stopped. These rumors claimed that the
    development had stopped due to a loss of the original source code due to a hard
    disk failure. On April 5th of 2008, the developers of the emulator `ePSXe` made
    a public statement revealing that development would continue. On May 24th 2008,
    `ePSXe` version `1.7.0` was released. What makes `ePSXe` unique is the ability
    to control and replace the plugins that it uses. The graphical processing unit
    plugins can rung with `OpenGL` or the `Glide API`. The sound processing unit plugin
    emulates the sounds and music of the games. There is a CD-ROM plugin as well as
    an Input plugin. Retro Gamer stated that `ePSXe` is “the best free PlayStation
    emulator”.


    `PCSX2` Is a Sony PlayStation 2 emulator. It is free and open source software
    under the GNU General Public License. Like `ePSXe`, `PCSX2`s architecture supports
    plugins. Development for this emulator began in the year of 2001, led by programmers
    known as `Linuzappz` and `Shadow`. It is reported to be compatible with 94.9%
    of the 2,586 tested Sony PlayStation 2 video games. Performance is usually bottle
    necked by the central processing unit of the system that is running off of, as
    emulating hardware as complicated as a PlayStation 2 is extremely CPU intensive.
    The emulator has been described by Matthew Humphries of Geek.com as “an impressive
    piece of work".


    `Dolphin` is a free and open source Nintendo GameCube and Nintendo Wii emulator.
    `Dolphin` was released in September of the year 2003 by the programmer `Henrik
    Rydgård` and the programmer know as `F|RES`. The `Dolphin` emulator was officially
    discontinued in the year of 2004, but was revived by the developers in the year
    of 2005. `Dolphin` became a free and open source project on the date of July the
    13th of the year 2008. The source code was released publicly on an SVN repository
    on Google Code under the `GPLv2` licenses. By the month of April of the year 2009,
    most of the commercial GameCube games and commercial Wii games could be fully
    played with minimal problems. The `Dolphin` emulator has been very well received,
    for example, many prefer the look of The Legend of Zelda: The Windwaker being
    ran by the `Dolphin` emulator over the Nintendo Wii U version of the game.


    `DeSmuME` is a free and open source Nintendo DS emulator. The original emulator
    was in French, but was later translated into English and other languages.


    Gaming is wide and varied on Linux thanks to emulators like those mentioned above.
    Taking the time to set them up correctly is difficult, though, so be sure to read
    up online on the correct way to play older console games on Linux. With emulators,
    ROMs, Steam, and other proprietary games released on Linux, the computer users
    never need to be bored. Previously only Windows had good video game support, but
    now Linux is joining the ranks of gamers.


    # Advanced Concepts in Linux


    ## The File Structure


    In Linux-based operating systems there are two kinds of major partitions: the
    data partition, and the swap partition. The data partition includes the normal
    Linux system data and personal user data as well. The swap partition is an expansion
    of the computer systems physical memory (`RAM`). Most Linux operating systems
    require both partitions to run efficiently.


    Swap is an extension of `RAM`. When programs need extra space, the swap partition
    dedicates some of its data to the program. The Windows equivalent of this is the
    `pagefile`.


    The default filesystem in Linux is `ext4`, and drives formatted in Linux will
    usually use it. This is not beneficial when sharing data back to a Windows system,
    because Windows cannot normally read `ext4`.


    Below are the folders found on the root of a drive in Linux. An important feature
    of Linux distros is that every object on the computer is a file. This means that
    every peripheral, piece of data, hardware component, and terminal command is represented
    as a file in Linux. Accordingly, everything has to be stored somewhere, and the
    folders below contain the entirety of the computer.


    | Linux File System | Description |

    | :--- | :--- |

    | `Bin` | This is where shared programs are located. |

    | `Boot` | Where boot files, such as the kernel and boot loader are stored. |

    | `Dev` | Has files that point to CPU hardware. The files in here can be referenced
    when you are working with the CPU |

    | `Etc` | Config files and settings. |

    | `Home` | User’s data is stored here. |

    | `Initrd` | Used for booting. |

    | `Lib` | Library files, which give functionality to applications are in. |

    | `Lost+found` | `ext4` is a journaling file system. Any files that become corrupt
    can potentially be saved here. |

    | `Misc` | When removable storage are plugged in devices can be accessed here.
    |

    | `Mnt` | Mnt stands for mount, and this directory is how you interact with mounted
    hardware. |

    | `Net` | Where network folders are typically mounted. |

    | `Proc` | Resource accessed by programs |

    | `Sbin` | Where system commands are located. |

    | `Tmp` | A temporary directory. |

    | `Usr` | Where user programs are installed |

    | `var` | For log files |


    ## WINE


    An astute user might have noticed that Linux does not run exe files. For Linux
    users that refuse to give up certain Windows programs, `WINE` can help. `WINE`
    is a ”compatibility layer” capable of running Microsoft Windows files in order
    to “emulate” applications as if they were running in Windows. For Linux users
    this means that you can run Linux without fully giving up Windows. `WINE` is not
    a replacement for running Windows programs, though. To install `WINE`, the following
    commands must be run:


    ```

    sudo apt-get-repository ppa:ubuntu-wine/ppa

    sudo apt-get update

    sudo apt-get install -y wine1.7

    ```


    And to run an exe it must be downloaded. Using a terminal navigate to the download
    location and type `wine programname.exe`.

