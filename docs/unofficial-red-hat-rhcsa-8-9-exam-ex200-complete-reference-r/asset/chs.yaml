  \ ls -lZ /root\n```\n\n**重要提示**\n●  要访问根目录，必须具备 root 用户权限。\n\n## 方法 #3：使用 `ps` 命令\n\
  \n使用 `ps` 命令列出 RHEL（红帽企业版 Linux）系统中所有文件和进程的 SELinux 安全增强型 Linux 上下文。操作如下：\n\n```bash\n\
  sudo ps axZ\n```\n\n**重要提示**\n●  此命令需要以 root （超级管理员）身份执行才能生效。\n\n## Method #4: Using\
