  \ 挂载到容器目录 `/mnt` 并启动交互式 bash shell，请使用以下命令：\n\n```bash\npodman run -it -v /var/lib/containers/backup:/mnt\
  \ registry.redhat.io/ubi8/ubi /bin/bash --privileged\n```\n\n注意：\n\n- `-it` 选项用于访问\
