  ```\n\n或者\n\n```bash\n$ sudo nmcli con up id \"static-ip\"\n```\n\n# 如何在 RHEL 上配置\
  \ IPv6 网络？\n\nIPv6 的设计是为了克服 IPv4 的局限性。它旨在通过利用广泛的网络地址空间来解决 IPv4 地址耗尽的问题。IPv6 地址是一个\
  \ 128 位的字母数字值，用于标识 IPv6 网络中的终端设备，由 8 组由冒号分隔的每组 4 个十六进制数字组成。\n\nIPv6 地址的示例：\n\n`2001:0db8:85a3:0000:0000:8a2e:0370:7334`\n\
  \n注意：\n● `IPv6` 在 RHEL 8 & 9 上通常默认启用。\n\n要检查您的系统是否启用了 IPv6，可以使用以下两种方法之一：\n\n###\
  \ 第一种\n\n```bash\n$ sudo sysctl -a | grep ipv6.*disable\n```\n\n或者\n\n```bash\n\
  $ cat /sys/module/ipv6/parameters/disable\n```\n\n值 `0` 表示 `IPv6` 在您的节点上是激活状态。值\
  \ `1` 表示 `IPv6` 已禁用。\n\n### 第二方法\n\n#### 在 RHEL 8 上\n通过查看 `/etc/network-scripts/`\
  \ 目录下的网络接口。例如，查看接口 `enps02` 的网络配置：\n\n```bash\n$ cat /etc/sysconfig/network-scripts/ifcfg-enps02\n\
  ```\n\n然后查找以下 IPv6 选项：\n- `IPV6INIT=yes` - 在此接口上启用 IPv6。\n- `IPV6_AUTOCONF=yes`\
  \ - 启用接口的 IPv6 自动配置。\n- `IPV6_DEFROUTE=yes` - 该接口是 IPv6 流量的默认路由。\n- `IPV6_FAILURE_FATAL=no`\
  \ - 如果配置失败，不会禁用此接口。\n\n#### 在 RHEL 9 上\n通过查看 `/etc/NetworkManager/system-connections/`\
  \ 目录下的网络接口。例如，查看接口 `enps02` 的网络配置：\n\n```bash\n$ cat /etc/NetworkManager/system-connections/enps02.nmconnection\n\
  ```\n\n然后查找以下 IPv6 选项：\n```ini\n[ipv6]\nmethod=auto OR manual\n```\n\n# 临时启用或禁用\
  \ IPv6 地址\n\n要临时启用 IPv6，请使用：\n\n```bash\n$ sudo sysctl -w net.ipv6.conf.all.disable_ipv6=0\n\
  ```\n\n重启 NetworkManager 以应用更改：\n\n```bash\n$ sudo systemctl restart NetworkManager\n\
  ```\n\n验证：\n\n```bash\n$ ip -6 a\n```\n\n要临时禁用 IPv6，请使用：\n\n```bash\n$ sudo sysctl\
  \ -w net.ipv6.conf.all.disable_ipv6=1\n```\n\n重启 NetworkManager 以应用更改：\n\n```bash\n\
  $ sudo systemctl restart NetworkManager\n```\n\n验证：\n\n```bash\n$ ip -6 a\n```\n\
  \n# 永久启用或禁用 IPv6 地址\n\n要永久禁用 IPv6，您可以使用以下一种方法：\n\n### 第一种方法\n1. 以编辑模式打开 GRUB 文件\
  \ `/etc/default/grub`：\n```bash\n$ sudo vim /etc/default/grub\n```\n2. 在 `GRUB_CMDLINE_LINUX`\
  \ 行末尾添加参数 `ipv6.disable=1`。\n3. 重启系统以应用更改：\n```bash\n$ sudo reboot\n```\n\n### 第二种方法\n\
  使用 `nmtui` 工具：\n1. 安装 NetworkManager-tui：\n```bash\n# yum install NetworkManager-tui\n\
  ```\n2. 启动 `nmtui` 工具：\n```bash\n$ nmtui\n```\n3. 导航时，使用方向键或按 `Tab` 向前、按 `Shift+Tab`\
  \ 向后切换选项。按 `Enter` 选择一个选项。按 `Space` 键切换复选框状态。\n\n注意：\n● 对已激活的连接进行修改后，需要重新激活连接才能生效。\n\
  \n### 第三种方法\n使用 `nmcli` 工具：\n\n#### 使用 nmcli 禁用连接上的 IPv6 \n1. 显示网络连接列表，使用：\n```bash\n\
  # nmcli connection show\n```\n2. 将连接 \"test\" 的 `ipv6.method` 参数设置为禁用，使用：\n```bash\n\
  # nmcli connection modify test ipv6.method \"disabled\"\n```\n3. 重启网络连接，使用：\n```bash\n\
  # nmcli connection up test\n```\n4. 验证：\n```bash\n# ip address show device\n```\n\
  或者\n```bash\n# cat /proc/sys/net/ipv6/conf/test/disable_ipv6\n```\n此处输出应为 `1`，表示该设备已禁用\
  \ IPv6。\n\n#### 使用 nmcli 启用连接上的 IPv6 \n1. 显示网络连接列表，，使用：\n```bash\n# nmcli connection\
  \ show\n```\n2. 将连接 \"test\" 的 `ipv6.method` 参数设置为启用，使用：\n```bash\n# nmcli connection\
  \ modify test ipv6.method \"auto\"\n```\n3. 重启网络连接，使用：\n```bash\n# nmcli connection\
  \ up test\n```\n4. 验证：\n```bash\n# ip address show device\n```\n或者\n```bash\n# cat\
  \ /proc/sys/net/ipv6/conf/test/disable_ipv6\n```\n此处输出应为 `0`，表示该设备已启用 IPv6。\n\n\n\
  \n\n\n作为系统管理员，你可以使用 `firewalld` 服务来控制允许或限制对某些服务或 IP 地址的网络访问。\n\n注意\n\n● `firewalld`\
  \ 服务使用 `firewall-cmd` 工具来配置防火墙。\n\n## 启用并启动 firewalld 服务\n\n要启用 `firewalld` 服务，请使用：\n\
  \n```bash\nsudo systemctl enable firewalld\n```\n\n要启动 `firewalld` 服务，请使用：\n\n```bash\n\
  sudo systemctl start firewalld\n```\n\n或者，你可以使用一条命令启用并启动 `firewalld` 服务：\n\n```bash\n\
  sudo systemctl enable firewalld --now\n```\n\n要验证 `firewalld` 服务的状态，请使用：\n\n```bash\n\
  sudo systemctl status firewalld\n```\n\n## 使用 Firewalld 配置规则\n\n### 添加 TCP/UDP 端口\n\
  \n要添加 TCP 端口 (22)，请使用：\n\n```bash\nsudo firewall-cmd --add-port=22/tcp --permanent\n\
  ```\n\n要添加 UDP 端口 (23)，请使用：\n\n```bash\nsudo firewall-cmd --add-port=23/udp --permanent\n\
  ```\n\n要验证：\n\n```bash\nsudo firewall-cmd --list-all\n```\n\n注意\n\n● 你必须在端口号之后指定协议类型（TCP\
  \ 或 UDP）。\n● 我们使用 `--permanent` 标记来确保规则在重启后依然有效。\n\n### 阻塞 TCP/UDP 端口\n\n要阻塞 TCP\
  \ 端口 (22)，请使用：\n\n```bash\nsudo firewall-cmd --remove-port=22/tcp --permanent\n\
  ```\n\n要阻塞 UDP 端口 (23)，请使用：\n\n```bash\nsudo firewall-cmd --remove-port=23/udp --permanent\n\
  ```\n\n要验证：\n\n```bash\nsudo firewall-cmd --list-all\n```\n\n### 允许服务\n\n要允许一个服务（例如\
  \ ssh），请使用：\n\n```bash\nsudo firewall-cmd --add-service=ssh\n```\n\n要验证：\n\n```bash\n\
  sudo firewall-cmd --list-all\n```\n\n### 阻塞服务\n\n要阻塞一个服务（例如 http），请使用：\n\n```bash\n\
  sudo firewall-cmd --remove-service=http\n```\n\n要验证：\n\n```bash\nsudo firewall-cmd\
  \ --list-all\n\n### 将 IP 地址加入白名单\n\n要通过防火墙允许单个 IP 地址，请使用：\n\n```bash\nsudo firewall-cmd\
  \ --add-source=192.168.1.15 --permanent\n```\n\n要允许整个子网段，请使用：\n\n```bash\nsudo firewall-cmd\
  \ --add-source=192.168.1.0/24 --permanent\n```\n\n### 移除白名单 IP 地址\n\n要移除白名单 IP，请使用：\n\
  \n```bash\nsudo firewall-cmd --remove-source=192.168.1.15 --permanent\n```\n\n要移除整个子网段，请使用：\n\
  \n```bash\nsudo firewall-cmd --remove-source=192.168.1.0/24 --permanent\n```\n\n\
  ### 阻塞 IP 地址\n\n要阻塞一个 IP 地址，请使用：\n\n```bash\nsudo firewall-cmd --add-rich-rule=\"\
  rule family='ipv4' source address='192.168.1.15' reject\" --permanent\n```\n\n要阻塞整个子网段，请使用：\n\
  \n```bash\nsudo firewall-cmd --add-rich-rule=\"rule family='ipv4' source address='192.168.1.0/24'\
  \ reject\" --permanent\n```\n\n## 应用新的防火墙规则\n\n要让新的防火墙规则立即生效，请使用：\n\n```bash\nsudo\
  \ firewall-cmd --reload\n```\n\n## 查看防火墙规则\n\n要查看所有 firewalld 规则，请使用：\n\n```bash\n\
  sudo firewall-cmd --list-all\n```\n\n重要\n\n● 始终确保重载防火墙使新规则生效。\n\n◆◆◆\n\n# 第九章：用户组\n\
  \n## 第九章目录\n\n● IX.I 创建、删除和修改本地用户账户\n● IX.II 修改本地用户密码并调整密码有效期\n● IX.III 创建、删除和修改本地组及组组成\n\
  ● IX.IV 配置超级用户访问\n\n◆◆◆\n\n## IX.I 创建、删除和修改本地用户账户\n\n### 什么是多用户系统？\n\nLinux 是一个多用户系统。如果一个操作系统允许多人使用计算机，且不影响彼此的“项目”（如文件和偏好设置），则认为其是“多用户”系统。\n\
  \n要显示当前登录用户的信息，请运行：\n\n```bash\nid\n```\n\n要显示指定用户的信息，可以使用以下语法：\n\n```bash\nid username\n\
  ```\n\n要查看与文件或目录关联的用户，请使用：\n\n```bash\nls -l\n```\n\n默认情况下，系统使用 `/etc/passwd` 文件存储本地用户信息。\n\
  \n要显示 `/etc/passwd` 文件的内容，请使用：\n\n```bash\ncat /etc/passwd\n```\n\n`/etc/passwd`\
  \ 的格式如下（七个冒号分隔的字段）：\n\n1. `Username`：`UID` 与名称的映射。\n2. `Password`：以前加密格式存储密码的地方。现在它们存储在\
  \ `/etc/shadow` 文件中。\n3. `UID`：用户 ID。\n4. `GID`：用户的主组 ID 数字。\n5. `GECOS`：通常用于记录账户或用户的通用信息，如用户名。\n\
  6. `home`：用户的家目录路径。\n7. `Shell`：使用的 shell。\n\n### 用户账户管理\n\n#### 多用户系统？\n\nLinux\
  \ 是一个多用户系统。如果一个操作系统允许多人使用计算机，且不影响彼此的“项目”（如文件和偏好设置），则认为其是“多用户”系统。\n\n要显示当前登录用户的信息，请运行：\n\
  \n```bash\nid\n```\n\n要显示指定用户的信息，可以使用以下语法：\n\n```bash\nid username\n```\n\n要查看与文件或目录关联的用户，请使用：\n\
  \n```bash\nls -l\n```\n\n默认情况下，系统使用 `/etc/passwd` 文件存储本地用户信息。\n\n要显示 `/etc/passwd`\
  \ 文件的内容，请使用：\n\n```bash\ncat /etc/passwd\n```\n\n`/etc/passwd` 的格式如下（七个冒号分隔的字段）：\n\
  \n1. `Username`：`UID` 与名称的映射。\n2. `Password`：以前加密格式存储密码的地方。现在它们存储在 `/etc/shadow`\
  \ 文件中。\n3. `UID`：用户 ID。\n4. `GID`：用户的主组 ID 数字。\n5. `GECOS`：通常用于记录账户或用户的通用信息，如用户名。\n\
  6. `home`：用户的家目录路径。\n7. `Shell`：使用的 shell。\n\n#### 通过命令行管理用户\n\n#### 创建用户账户\n\n\
  #### 修改现有用户\n\n#### /logindefs 文件\n\n#### 步骤\n\n#### 1. 创建标准用户\n\n#### 2. 解锁账户以使其可访问\n\
  \n#### 3. 查看 /etc/shadow\n\n### 注意\n\n#### 低于 1000 的 UID 留给系统账户。\n\n#### 常见的 `useradd`\
  \ 命令选项\n\n#### -c 参数\n\n#### -d 参数\n\n#### -M 参数\n\n#### -m 和 -k 参数\n\n#### -e 参数\n\
  \n#### -s 参数\n\n#### -u 和 -g 参数\n\n#### -G 参数\n\n\n\n\n你可以使用 `-G` 选项通过以下语法创建一个带有次要组的本地用户账户：\n\
  \n```\nuseradd -G secondary_group_name user_name\n```\n\n# 修改本地用户账户\n\n## usermod\
  \ 命令\n你可以通过命令行使用 `usermod` 命令修改已创建用户账户的任何属性。\n\n注意：\n● 仅允许超级用户（`root`）执行 `usermod`\
  \ 命令。\n● 若要显示可用于 `usermod` 命令修改现有账户属性的备用选项，请使用：`$ usermod --help`\n\n一些常用的 `usermod`\
  \ 命令选项包括：\n\n#### -l 选项\n你可以使用 `-l` 选项通过以下语法更改本地用户账户名称：\n\n```\nusermod -l new_username\
  \ old_username\n```\n\n#### -G 选项\n你可以使用 `-G` 选项通过以下语法将用户添加到补充组：\n\n```\nusermod\
  \ -G supplementary_group username\n```\n\n#### -a 选项\n你可以将 `-a` 选项与 `-G` 选项结合使用，通过以下语法将用户添加到指定的补充组，而不将其从其他组中删除：\n\
  \n```\nusermod -aG supplementary_group username\n```\n\n#### -e 选项\n你可以使用 `-e` 选项通过以下语法设置用户账户过期日期：\n\
  \n```\nusermod -e YYYY-MM-DD username\n```\n\n要确认新的过期日期，使用以下语法：\n\n```\nchage -l\
  \ username\n```\n\n#### -L 选项\n你可以使用 `-L` 选项通过以下语法锁定账户：\n\n```\nusermod -L username\
  \ \n```\n\n# 删除本地用户账户\n\n## userdel 命令\n你可以通过以下语法使用 `userdel` 命令删除系统上的用户账户：\n\n\
  ```\nuserdel username\n```\n\n一些常用的 `userdel` 命令选项包括：\n\n#### -r 选项\n你可以使用 `-r`\
  \ 选项通过以下语法删除本地用户账户并移除其家目录和用户的邮件池：\n\n```\nuserdel -r username\n```\n\n注意：\n● 关联的组会被自动删除。\n\
  \n#### -f 选项\n你可以使用 `-f` 选项通过以下语法强制删除账户：\n\n```\nuserdel -f username\n```\n\n重要的用户和组账户配置文件包括：\n\
  ● `/etc/default/useradd`：指定 `useradd` 命令的默认设置。\n● `/etc/logins.defs`：影子密码套配置。\n\
  ● `/etc/skel`：本地用户家目录的骨架。\n● `/etc/passwd`：用户账户信息。\n● `/etc/shadow`：安全账户信息。\n● `/etc/group`：组账户信息。\n\
  ● `/etc/gshadow`：安全组账户信息。\n\n◆◆◆\n\n# IX.II 修改本地用户账户的密码并调整密码老化\n\n## 使用 chage 命令强制\
  \ Linux 系统更改密码\n\n### chage 命令\n由于密码老化要求用户定期更改密码，你可以使用 `chage` 命令更改用户的密码过期信息。语法为：\n\
  \n```\nchage [options] username\n```\n\n一些常用的 `chage` 命令选项包括：\n\n#### -d 选项\n你可以使用\
  \ `-d` 选项通过以下语法在下次登录时强制更新密码：\n\n```\nchage -d 0 username\n```\n\n#### -l 选项\n你可以使用\
  \ `-l` 选项通过以下语法列出用户名的当前设置：\n\n```\nchage -l username\n```\n\n#### -E 选项\n你可以使用 `-E`\
  \ 选项通过以下语法指定账户过期日期：\n\n```\nchage -E YYYY-MM-DD \n```\n\n#### -m 选项\n你可以使用 `-m`\
  \ 选项通过以下语法指定密码更改之间的最小天数：\n\n```\nchage -m min_number_of_days username\n```\n\n要验证，使用：\n\
  \n```\nchage -l username\n```\n\n#### -M 选项\n你可以使用 `-M` 选项通过以下语法指定密码更改之间的最大天数：\n\
  \n```\nchage -M max_number_of_days username\n```\n\n要验证，使用：\n\n```\nchage -l username\n\
  ```\n\n此外，你也可以通过以下语法在一行中设置最小最大天数：\n\n```\nchage -m min_number_of_days -M max_number_of_days\
  \ username\n```\n\n要验证，使用：\n\n```\nchage -l username\n```\n\n### /etc/shadow 文件格式\n\
  密码过期信息存储在 `/etc/shadow` 文件中。`/etc/shadow`文件的格式如下（九个冒号分隔的字段）：\n\n```\n$ less /etc/shadow\n\
  ```\n\n1. `Name`：登录名，且必须是系统上有效的账户名。\n2. `Password`：加密后的密码。以感叹号开头的密码字段意味着密码已锁定。\n\
  3. `Lastchange`：上次更改密码的日期，表示为自 1970.01.01 以来来的天数。\n4. `Minage`：更改密码前允许最小天数，0 表示“无最小年龄要求”。\n\
  5. `Maxage`：必须更改密码前的最大天数。\n6. `Warning`：密码即将过期的警告天数，0 表示“无警告”。\n7. `Inactive`：密码过期后账户保持激活的天数。\n\
  8. `Expire`：账户过期日期，表示为自 1970 年 1 月 1 日以来的天数。\n9. `Blank`：该字段留留备将来使用。\n\n### /etc/logins.defs\
  \ 文件\n`/etc/logins.defs` 文件提供了默认设置，包括：\n● 邮件箱的位置。\n● 密码老化控制（`PASS_MAX_DAYS`，`PASS_MIN_DAYS`，`PASS_WARN`）。\n\
  ● 自动 UID 选择（`UID_MIN`，`UID_MAX`）。\n● 自动 GID 选择（`GID_MIN`，`GID_MAX`）。\n● 用户创建选项。\n\
  ● Umask 值。\n● 用于加密密码的方法。\n\n要查看 `/etc/logins.defs` 文件，使用：\n\n```bash\ncat /etc/logins.defs\n\
  ```\n\n在 RHEL 9 中，你可以通过以下步骤设置密码长度：\n1. 以编辑模式打开 `/etc/security/pwquality.conf` 文件：\n\
  ```bash\nvim /etc/security/pwquality.conf\n```\n2. 设置 `minlen` 为所需的长度。\n3. 保存并退出。\n\
  \n注意：\n● `PASS_MIN_LEN`、`PASS_MAX_LEN`、`CHANGE_TRIES`、`ALWAYS_WARN` 不支持。\n● 在 RHEL\
  \ 9 中，你可以使用 `/etc/security/pwquality.conf` 文件中的 `minlen` 变量设置密码长度。\n● `/etc/security/pwquality.conf`\
  \ 文件为系统提供了默认密码质量配置方法。此文件由 `libpwquality` 库以及使用它的工具读取。\n\n### 限制访问\n你可以使用 `usermod`\
  \ 命令通过 `-L` 选项锁定账户。`/shadow`\n\n使用单个 `usermod` 命令锁定并过期账户。日期必须以自 1970 年 1 月 1 日以来的天数给出：\n\
  \n```\nusermod -L -e number_of_days username\n```\n\n或者，你可以设置过期日期：\n\n```\nusermod\
  \ -L -e YYYY-MM-DD username\n```\n\n◆◆◆\n\n# IX.III 创建、删除和修改本地组及组关系\n\n## 什么是 Linux\
  \ 组？\n组是管理计算机系统用户的一种机制。和用户一样，组有名称和一个数字（GID）。本地组定义在 `/etc/group` 文件中。\n\n要显示系统上的组，使用：\n\
  \n```bash\ncat /etc/group\n```\n\n#### 用户的主组\n每个用户都有一个主组。对于本地用户，主组是一个与用户同名的新组，其\
  \ GID 数字与 UID 相同，且该用户是该用户私有组（UPG）的唯一成员。通常，用户创建的文件由其主组所有。\n\n#### 补充组\n用户可能属于任何补充组，也可能是一个或多个补充组的成员。补充组关系用于帮助确保用户拥有对文件和其他资源的访问权限。\n\
  \n注意：\n● 本地组补充成员的用户列在 `/etc/group` 文件中组条目的最后一个字段。\n\n# 管理本地组账户\n\n## 管理补充组\n在将用户添加到该组之前，该组必须已经存在。\n\
  \n\n\n\n\n# `groupadd` 命令\n\n在不使用选项的情况下，通过 `groupadd groupname` 命令会从 `/etc/login.defs`\
  \ 文件中指定的范围内分配下一个可用的 GID：\n\n```\n# groupadd groupname\n```\n\n## `-r` 选项\n\n你可以使用\
  \ `-r`  选项创建系统用户，该操作将从此处列出的特定或有效数字中选取 UID；这需要 root 权限用于后续可能需要的认证流程——不过目前我们仅关注于*创建组*这一环节。\n\
  \n\n\n\n\n# 在 RHEL 9 上重置 root 密码\n\n 步骤\n\n你可以使用以下方法之一：\n\n### 方法一\n\n1. 重启系统。\n\
  2. 在 GRUB 2 启动界面，使用键盘上的下方向键选择 `rescue mode`（救援模式）。\n3. 按 `E` 键中断启动过程。\n4. 按 `Ctrl+E`\
  \ 跳到以 `linux` 开头的行末尾。\n5. 在以 `linux` 开头的行末尾添加 `rd.break`。\n6. 按 `Ctrl+X` 使用更改后的参数启动系统。\n\
  7. 按 `Enter` 键进入维护模式，将出现 `sh-5.1#` 提示符。\n8. 要将文件系统重新挂载为可写，使用：\n```bash\nmount -o\
  \ remount,rw /sysroot\n```\n9. 要进入 chroot 环境，使用：\n```bash\nchroot /sysroot\n```\n\
  10. 要重置 root 密码，使用：\n```bash\npasswd\n```\n11. 要在下次系统启动时启用 SELinux 重新标记标签过程，使用：\n\
  ```bash\ntouch /.autorelabel\n```\n12. 按两次 `Ctrl+D` 退出 chroot 环境并退出维护模式。\n\n###\
  \ 方法二\n\n1. 重启系统\n2. 在 GRUB 2 启动界面，使用键盘上的下方向键选择 `rescue mode`（救援模式）。\n3. 按 `E` 键中断启动过程。\n\
  4. 按 `Ctrl+E` 跳到以 `linux` 开头的行末尾。\n5. 在以 `linux` 开头的行末尾添加 `init=/bin/bash`，并将 `ro`\
  \ 改为 `rw`。\n6. 按 `Ctrl+X` 使用更改后的参数启动系统。\n7. 要重置 root 密码，使用：\n```bash\npasswd\n```\n\
  8. 要在下次系统启动时启用 SELinux 重新标记标签过程，使用：\n```bash\ntouch /.autorelabel\n```\n9. 要执行 `/sbin/init`\
  \ 程序以协调其余的启动过程并配置环境，使用：\n```bash\nexec /sbin/init\n```\n\n# 允许 root 访问\n\n作为管理员，你有不同的方法可以选择来禁止\
  \ root 登录。让我们来看其中一些方法。\n\n### 1. 修改 root shell\n作为系统管理员，你可以通过将 `/etc/passwd` 文件中的\
  \ root 账户的 shell 设置为 `/sbin/nologin` 来防止用户直接以 root 登录。\n\n**警告**\n● 不需要 shell 的程序不会被阻止访问\
  \ root 账户（例如 `sudo`、`FTP 客户端`、`邮件客户端`）。\n\n### 2. 使用任何控制台设备（tty）禁用 root 访问\n作为管理员，你可以通过编辑\
  \ `/etc/securetty` 文件禁用控制台 root 登录。该文件列出了 root 用户允许登录的所有设备。如果文件完全不存在，root 用户可以通过系统上的任何通信设备登录。这是危险的，因为用户可以使用\
  \ `Telnet` 通过明文传输密码来登录机器。\n\n要防止 root 用户登录，请以 root 身份使用以下命令删除该文件的内容：\n```bash\n\
  echo > /etc/securetty\n```\n**警告**\n● 空的 `/etc/securetty` 文件不会阻止以下程序访问 root 账户：`[su`、`sudo`、`ssh`、`scp`、`sftp]`。\n\
  \n### 3. 禁止 root SSH 登录\n要防止通过 SSH 登录 root，请使用以下步骤：\n\n1. 以编辑模式打开 `/etc/ssh/sshd_config`\
  \ 文件：\n```bash\nvim /etc/ssh/sshd_config\n```\n2. 将以下行：\n```bash\nPermitRootLogin\
  \ yes\n```\n更改为：\n```bash\nPermitRootLogin no\n```\n3. 保存并退出。\n4. 重启 `sshd` 服务：\n\
  ```bash\nsystemctl restart sshd\n```\n**警告**\n● 使用 OpenSSH 工具套阻止 root 访问不会阻止以下程序访问\
  \ root 账户：`[ssh`、`scp`、`sftp]`。\n\n◆◆◆\n\n# 第 X 章：安全管理\n\n第 X 章目录\n● X.I 使用 `firewall-cmd/firewalld`\
  \ 配置防火墙设置\n● X.II 创建和使用文件访问访问控制列表\n● X.III 为 SSH 配置基于密钥的身份认证\n● X.IV 为 SELinux 设置强制（enforcing）和许可（permissive）模式\n\
  ● X.V 列出并识别 SELinux 文件和进程上下文\n● X.VI 恢复默认文件上下文\n● X.VII 使用布尔设置修改系统 SELinux 设置\n\
  ● X.VIII 诊断并处理常规 SELinux 策略违规\n\n◆◆◆\n\n# X.I 使用 `firewall-cmd/firewalld` 配置防火墙设置\n\
  \n### 什么是防火墙？\n防火墙可以定义为网络安全系统，在网络流量进出基于 Linux 的环境时控制、调节、保护、过滤或拦截。\n\n### 什么是 firewalld？\n\
  `firewalld` 守护是 Linux 系统的防火墙管理工具。\n\n### 什么是 firewall-cmd？\n`firewall-cmd` 是 `firewalld`\
  \ 守护的命令行客户端。它提供了一个管理运行时和永久配置的接口。\n\n### 如何在 RHEL 上启动、停止、重启 firewalld 服务？\nRHEL 默认安装了\
  \ `firewalld` 包。如果没有安装，可以使用以下命令进行安装：\n```bash\nyum install firewalld\n```\n要启动并启用\
  \ firewalld，使用：\n```bash\nsystemctl start firewalld\nsystemctl enable firewalld\n\
  ```\n要停止并禁用 firewalld，使用：\n```bash\nsystemctl stop firewalld\nsystemctl disable\
  \ firewalld\n```\n要重启 firewalld，使用：\n```bash\nsystemctl restart firewalld\n```\n\
  要检查 firewalld 状态，使用：\n```bash\nsystemctl status firewalld\n```\n要重新加载 firewalld\
  \ 配置，使用：\n```bash\nfirewall-cmd --reload\n```\n\nfirewalld 的主要组件包括：\n● 服务\n● 区域\n\
  ● 端口\n\n要查看防火墙的所有配置，使用：\n```bash\nfirewall-cmd --list-all\n```\n显示支持的服务：\n```bash\n\
  firewall-cmd --get-services\n```\n显示所有区域：\n```bash\nfirewall-cmd --get-zones\n```\n\
  \n### 设置默认区域\n要将默认区域设置为 `internal`，使用：\n```bash\nfirewall-cmd --set-default-zone=internal\n\
  ```\n使用此命令验证默认区域：\n```bash\nfirewall-cmd --get-default-zone\n```\n注意：当你为 NetworkManager\
  \ 添加新接口时，它将附加到默认区域。\n\n### 配置防火墙\n\n#### 运行时 firewalld\n运行时 `firewalld` 配置是临时的，在重启系统后会消失。例如，临时向\
  \ `public` 区域添加 `http` 服务，使用：\n```bash\nsudo firewall-cmd --zone=public --add-service=http\n\
  ```\n验证：\n```bash\nsudo firewall-cmd --list-services\n```\n\n#### 永久规则集\n要永久添加规则，需要添加\
  \ `--permanent` 选项。例如，永久地向 `public` 区域添加 `http` 服务，使用：\n```bash\nsudo firewall-cmd\
  \ --zone=public --add-service=http --permanent\n```\n验证：\n```bash\nsudo firewall-cmd\
  \ --list-services\n或者\nsudo firewall-cmd --list-services --permanent\n```\n\n####\
  \ 从区域删除服务\n从 `public` 区域删除 `http` 服务，使用：\n```bash\nsudo firewall-cmd --zone=public\
  \ --remove-service=http --permanent\n```\n\n#### 添加端口/协议\n在 `public` 区域添加 `tcp`\
  \ 端口 `443`，使用：\n```bash\nsudo firewall-cmd --zone=public --add-port=443/tcp --permanent\n\
  ```\n验证，使用：\n```bash\nsudo firewall-cmd --zone=public --list-ports\n```\n\n####\
  \ 拒绝端口/协议\n从 `public` 区域删除 `udp` 端口 `53`，使用：\n```bash\nsudo firewall-cmd --zone=public\
  \ --remove-port=53/udp --permanent\n```\n\n#### 端口转发 firewalld 规则\n在同一台服务器上将 TCP\
  \ 端口 `443` 转发到 `8080`，使用：\n```bash\nsudo firewall-cmd --zone=public --add-forward-port=port=443:proto=tcp:toport=8080\
  \ --permanent\n```\n\n\n\n\n要删除上述端口转发，请使用：\n\n```bash\nsudo firewall-cmd --zone=public\
  \ --remove-forward-port=port=443:proto=tcp:toport=8080\n```\n\n## firewalld 的富规则\
  \ (rich rules)\n\n富规则是 firewalld 的一项额外功能，它允许管理员创建基础 firewalld 无法涵盖的复杂防火墙规则。\n\n\
  ### 添加 firewalld 富规则\n\n例如，如果你只想允许来自 IP 地址 192.169.0.5 访问 SSH 端口 22，请使用：\n\n```bash\n\
  sudo firewall-cmd --permanent --zone=public --add-rich-rule 'rule family=\"ipv4\"\
  \ source address=\"192.169.0.5\" port port=22 protocol=tcp accept'\n```\n\n重加载 firewalld\
  \ 配置，请使用：\n\n```bash\nsudo firewall-cmd --reload\n```\n\n验证，使用：\n\n```bash\nsudo\
  \ firewall-cmd --list-rich-rules --permanent\n```\n\n### 删除 firewalld 富规则\n\n要删除富规则，请使用：\n\
  \n```bash\nsudo firewall-cmd --remove-rich-rule 'rule family=\"ipv4\" source address=\"\
  192.169.0.5\" port port=22 protocol=tcp accept' --permanent\n```\n\n重加载 firewalld\
  \ 配置，请使用：\n\n```bash\nsudo firewall-cmd --reload\n```\n\n验证，使用：\n\n```bash\nsudo\
  \ firewall-cmd --list-rich-rules --permanent\n```\n\n◆◆◆\n\n## X.II 创建和使用文件访问控制列表\
  \ (ACLs)\n\n### 什么是 ACL？\n\nACL 指的是一组特定的规则，你可以使用这些规则对文件或目录应用更具体的权限集，而无需（不一定）更改底层的所有权和权限。它们对于更精粒度地控制\
  \ Linux 文件系统权限具有极高的价值。\n\n### 复习基础知识\n\nLinux 文件系统有三种权限：\n\n- 用户（user，或所有者）。\n-\
  \ 组（group，或所有者组）。\n- 其他（other，即所有人）。\n\n通过这些权限，我们可以授予三种访问类型：\n\n- 读取 (read)\n- 写入\
  \ (write)\n- 执行 (execute)\n\n### 查看当前 ACL\n\n要查看当前 ACL，请使用：\n\n```bash\ngetfacl\
  \ file/directory\n```\n\n### 设置 ACL\n\n设置 ACL 的语法为：\n\n```bash\nsetfacl [option]\
  \ [action/specification] file/directory\n```\n\n注意：\n\n- `action`：你可以使用 `setfacl`\
  \ 设置和删除 ACL，分别使用 `-m` 或 `-x` 选项。\n- `specification`：这可以是用户或组，后跟你想要设置的权限。\n- `option`：你可以使用\
  \ `-d`（默认）选项为文件/目录设置默认 ACL。\n\n#### 设置 ACL 的命令列表：\n\n1) 为用户添加权限，使用语法：\n\n```bash\n\
  setfacl -m \"u:user:permissions\" /path/to/file\n```\n\n例如：\n按照如下方式为示例目录设置 ACL：\n\
  让用户 `sam` 拥有 `sample` 目录的读取、写入和执行权限，使用：\n\n```bash\nsetfacl -m u:sam:rwx sample\n\
  ```\n\n2) 为组添加权限，使用语法：\n\n```bash\nsetfacl -m \"g:group:permissions\" /path/to/file\n\
  ```\n\n例如：\n按照如下方式为示例目录设置 ACL：\n让组 `admin` 拥有 `sample` 目录的读取、写入和执行权限，使用：\n\n```bash\n\
  setfacl -m g:admin:rwx sample\n```\n\n3) 允许所有文件或目录继承所在目录的 ACL 条目，使用语法：\n\n```bash\n\
  setfacl -dm \"entry\" /path/to/dir\n```\n\n或者\n\n```bash\nsetfacl -d -m \"entry\"\
  \ /path/to/dir\n```\n\n例如：\n按照如下方式为示例目录设置默认 ACL：\n让组 `admin` 拥有 `sample` 目录的读取、写入和执行权限，使用：\n\
  \n```bash\nsetfacl -dm g:admin:rwx sample\n```\n\n4) 移除特定条目，使用语法：\n\n```bash\nsetfacl\
  \ -x \"entry\" /path/to/file\n```\n\n5) 移除所有条目，使用语法：\n\n```bash\nsetfacl -b path/to/file\n\
  ```\n\n查看文件或目录上的 ACL，使用语法：\n\n```bash\ngetfacl file/directory\n```\n\n例如，查看 `sample`\
  \ 目录的默认 ACL 信息：\n\n```bash\ngetfacl sample\n```\n\n注意：\n\n- 当你为目录设置默认 ACL 时，除非被覆盖，其内容将继承该\
  \ ACL。\n\n◆◆◆\n\n## X.III 为 SSH 配置基于密钥的认证\n\n### 什么是安全外壳 (SSH)?\n\nSecure Shell\
  \ (SSH) 是一种安全的网络协议，它可以加密两个端点之间的流量。它是世界上最常用的远程访问协议。它安全地允许用户通过网络进行连接、传输文件和管理远程设备。\n\
  \n### SSH 验证方法\n\nSSH 使用两种身份验证方法。\n\n#### 第一种方法：SSH 密码认证\n\n这是传统方法，每当你需要访问系统时，都需要提供要登录账户的用户名和密码。\n\
  \n#### 第二种方法： SSH 公钥认证\n\n如果你需要经常连接到多个系统，最好使用这种方法。在此方法中，你生成一个公钥和一个匹配的私钥。\n\n###\
  \ 配置基于密钥的 SSH 认证\n\n如果你需要经常连接到多个系统，最好使用这种方法。在 RHEL 上：\n\n#### 过程\n\n##### 第一步：生成密钥对\n\
  \n在 RHEL 上生成密钥对\n\n```bash\nssh-keygen -t rsa\n```\n\n系统会提示输入密码。\n\n##### 第二步：将公钥复制到远程服务器\n\
  \n使用以下命令将公钥复制到目标机器\n\n```bash\nssh-copy-id -i ~/.ssh/id_rsa.pub user@destination\n\
  ```\n\n这将提示输入密码。\n\n##### 第三步：验证密钥认证\n\n要验证 SSH 公钥认证，使用：\n\n```bash\nssh user@destination\n\
  ```\n\n验证 `authorized_keys` 文件是否存在，使用：\n\n```bash\nls -l ~/.ssh\n```\n\n\n\n\n#\
  \ 检查当前 SELinux 模式\n\n要检查当前的 SELinux 模式，可以使用 `getenforce`或`sestatus`命令。\n\n## 显示当前状态和策略\n\
  \n运行以下命令以显示当前的 SELinux 状态及其使用的策略：\n\n```\n$ sestatus\n```\n\n获取当前的 SELinux 模式：\n\
  \n```\n$ getenforce\n```\n\n请注意：\n-   当系统在**宽容**模式下运行 SELinux 时，用户和进程可能会错误地标记文件系统对象。\n\
  -   SElinux 被禁用时所创建的文件系统对象未被标记。\n-   未标记或错误标记的文件系统对象会导致问题。当切换至强制模式时会引发麻烦，因为 SELinu\
  \ 依赖于正确的标签。\n\n**重要**\n\n为避免从 SElinux 禁用状态切换到许可（permissive）或者强制执行(enforcing)后因不准确以及无标号文件名造成的问题\
  \ ，可以通过如下两种方法之一解决:\n\n### **第一种方式:**\n1.  启用 SeLinux 的 Permissive （宽松): \n2 .直接以\
  \ root 身份建立 /.autorelabel \n\n```bash  \n# touch /.autorelabel   \n3 、重新引导操作系统 (Reboot)\n\
  ```bash  \n　 # reboot　　　　                    \n ###第二种方案：  \n\n      １．首先将 SeLinux\
  \ 置于 Permissi、 e<div>     。    \n          之后自动通过下列指令生成”/. autore labe “档∶     \
  \   。\n          ``` bash         \n                ＃ fixfiles -F onboot       \
