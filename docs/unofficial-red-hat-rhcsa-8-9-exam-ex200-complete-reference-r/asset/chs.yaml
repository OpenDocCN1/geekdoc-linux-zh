  \n[content]\n### 设置默认 umask 的步骤\n\n你可以在 `/etc/bashrc` 或 `/etc/profile` 文件中为所有用户设置\
  \ `umask` 值。为当前用户设置 `umask` 值，可以编辑 `~/.bashrc`。\n\n在 `~/.bashrc` 中通过符号方法设置 `umask`\
  \ 值，运行：\n```bash\n$ umask -S\n```\n*(注：原文后半部分存在大量重复的无效字符，此处翻译仅基于核心意图)*\n\n\n\n*\
  \ 如果 `echo $0` 命令的输出返回 `-bash`，说明你正在登录 shell 中执行该命令。登录 shell 的默认 `umask` 设置在 `/etc/login.defs`\
  \ 配置文件中。\n* 要显示非登录 shell 的默认 bash `umask`，请运行：`grep umask /etc/bashrc`\n* 要显示登录\
  \ shell 的默认 bash `umask`，请运行：`grep \"UMASK\" /etc/login.defs`\n\n要更改文件或目录的权限，使用以下语法：\n\
  \n```bash\nchmod <level><operation><permission> filename\n```\n\n将`<level>` 替换为想要设置权限的所有级（`u`、`g`、`o`、`a`）。将`<operation>`\
  \ 替换为符号之一（`+`、`-`、`=`）。将`<permission>` 替换为你想要分配的权限（`r`、`w`、`x`）。将 `filename` 替换为文件名或目录名。\n\
  \n例如，要赋予所有人 `sample` 文件读取、写和执行（`rwx`）权限，请运行：\n\n```bash\nchmod a=rwx sample\n```\n\
  \n验证：\n\n```bash\nls -l sample\n```\n\n注意：\n* 要查看特定目录的权限，请运行：\n\n```bash\nls -dl\
  \ directory-name\n```\n* 要从组所有（`g`）和其他人（`o`）中移除示例文件的读取、写和执行（`rwx`）权限，请运行：\n\n```bash\n\
  chmod go= sample\nOR\nchmod go-rwx sample\n```\n\n## 使用八进制值更改文件权限\n\n你可以使用八进制（数字）`chmod`\
  \ 工具更改文件或目录的权限。\n\n要更改现有文件或目录的文件权限，使用以下语法：\n\n```bash\nchmod octal_value filename\n\
  ```\n\n注意：\n* `namei` 命令非常有用，它可以显示路径下文件的所有权限。你必须以具有权限的用户身份运行它以获得所需的输出。\n\n例如：\n\n\
  ```bash\nnamei -ol /tmp/\n```\n\n`-o` 选项用于显示每个文件的所有者组名。\n`-l` 选项用于显示详细列表格式。\n\n\
  * 要更改文件或目录的所有者和组所有者，使用以下语法：\n\n```bash\nchown Username:Groupname Filename\n```\n\
  * 要更改文件或目录的组所有者，使用以下语法：\n\n```bash\nchgrp Groupname Filename\n```\n\n## 特殊权限\n\n\
  ![特殊权限](img/image_rsrcZV9.jpg)\n\n### 设置特殊权限\n\n#### 1. 使用符号法\n\n要在 `sample` 目录上设置\
  \ SGID，请运行：\n\n```bash\nchmod g+s sample\n```\n\n验证：\n\n```bash\nls -ld sample/\n\
  ```\n\n要在文件 `test` 上设置 SUID 位，请运行：\n\n```bash\nchmod u+s test\n```\n\n验证：\n\n```bash\n\
  ls -l test\n```\n\n要在 `sample` 目录上设置粘滞位（Sticky Bit），请运行：\n\n```bash\nchmod +t sample/\n\
  ```\n\n验证：\n\n```bash\nls -ld sample/\n```\n\n#### 2. 使用数值法\n\n使用的数字计算方法与标准权限数字类似：\n\
  * SUID = 4\n* SGID = 2\n* Sticky = 1\n\n语法为：\n\n```bash\nchmod X### file | directory\n\
  ```\n\n其中 `X` 是特殊权限数字。\n\n要在文件 `test` 上设置 SUID 位，请运行：\n\n```bash\nchmod 4770 test\n\
  ```\n\n验证：\n\n```bash\nls -l test\n```\n\n要在文件 `test` 上设置 SGID 位，请运行：\n\n```bash\n\
  chmod 2700 test\n```\n\n验证：\n\n```bash\nls -ld test\n```\n\n要在 `sample` 目录上设置粘滞位，请运行：\n\
  \n```bash\nchmod 1770 sample/\n```\n\n验证：\n\n```bash\nls -ld sample/\n```\n\n##\
  \ 管理访问控制列表 (ACL)\n\nACL 包含规则，允许我们在不更改底层所有权和权限的情况下，对文件或目录应用更特定的权限集。\n\n`ACL` 有两种类型：\n\
  1. **访问 ACL (Access ACLs)**：访问 ACL 用于设置任何文件或目录的权限。\n2. **默认 ACL (Default ACLs)**：默认\
  \ ACL 用于在特定目录设置访问控制列表。\n\n注意：\n* ACL 应用于现有文件，不会应用于新创建的文件。\n* 如果你想让它也应用于新文件，则可以在目录上使用默认\
  \ ACL。\n\n### 显示当前访问控制列表\n\n要显示特定文件或目录的当前 ACL，使用以下语法：\n\n```bash\ngetfacl file-name\
  \ | dir-name\n```\n\n### 设置访问控制列表\n\n要为文件或目录设置 ACL，请以 root 身份使用以下语法：\n\n```bash\n\
  setfacl -m u:username:symbolic_value file-name|dir-name\n```\n\n或者\n\n```bash\n\
  setfacl -m g:groupname:symbolic_value file-name|dir-name\n```\n\n### 设置默认 ACL\n\n\
  为特定目录设置默认 ACL，请以 root 身份使用以下语法：\n\n```bash\nsetfacl -m d:u:username:symbolic_value\
  \ dir-name\n```\n\n或者\n\n```bash\nsetfacl -m d:g:groupname:symbolic_value dir-name\n\
  ```\n\n不需要 `-R` 选项，因为这将应用于新创建的文件。\n\n注意：\n* `-R` 选项用于递归应用于所有文件和目录。\n* `-m` 选项用于修改\
  \ ACL。\n* `u` 选项用于添加用户。\n* `g` 选项用于添加组。\n* `d` 选项用于设置默认。\n\n### 移除 ACL\n\n* 移除用户：\n\
  \n```bash\nsetfacl -x u:username file-name\n```\n* 移除组：\n\n```bash\nsetfacl -x g:groupname\
  \ file-name\n```\n* 移除所有 ACL：\n\n```bash\nsetfacl -b file-name\n```\n\n\n\n\n# At\
  \ 任务的准备工作\n\n要开始使用 `at` 工具，你首先需要执行以下操作：\n\n1. 安装 `at` 软件包，请运行：\n```\ndnf install\
  \ at\n```\n\n2. 启用并启动 `atd` 服务，运行：\n```\nsystemctl enable atd.service --now\n```\n\
  \n3. 验证 `atd` 服务是否已启动并启用，运行：\n```\nsystemctl status atd.service\n```\n\n# 调度 At\
  \ 任务\n\n调度 at 任务的步骤：\n\n1. 以目标用户身份登录并运行：\n```\nat time\n```\n例如，若想在 14:00 执行任务，请运行：\n\
  ```\nat 14:00\n```\n\n2. 在显示的 `at>` 提示符处，输入要执行的命令，然后按 `Enter`（回车）键：\n例如：\n```\n\
  at> sh /usr/local/bin/backup.sh\n```\n\n3. 在空行上按 `Ctrl+D` 完成任务指定。\n\n注意：\n- 如果指定的时间已过，任务将在次日的同一时间执行。\n\
  \n# 查看待处理任务\n\n要查看待处理任务列表，运行：\n```\natq\n```\n\n# 删除已调度的任务\n\n删除已调度任务的步骤：\n\n1.\
  \ 列出待处理任务：\n```\natq\n```\n\n2. 指定你想要删除的任务编号，例如 \"25\"。\n\n3. 运行命令删除已调度的任务：\n```\n\
  atrm 25\n```\n\n◆◆◆\n\n# VII.II 启动和停止服务以及配置服务在启动时自动启动\n\n## 目标\n\n在本节中，你学习如何启用、禁用、启动、停止、重启和显示服务的状态。\n\
  \n## 什么是 systemd?\n\n`systemd` 是 Linux 操作系统的系统和服务守护管理器，它引入了 `systemd` 单元的概念。\n\n\
  ## 使用 systemd 管理服务\n\n### 准备工作\n\n你必须拥有系统的 root 权限。\n\n### 步骤\n\n要在系统启动时启用服务，请使用：\n\
  ```\nsystemctl enable service_name\n```\n例如，启用 `httpd` 服务（应先安装它）：\n```\nsystemctl\
  \ enable httpd\n```\n\n要启动服务，请使用：\n```\nsystemctl start service_name\n```\n例如，启动\
  \ `httpd` 服务（应先安装它）：\n```\nsystemctl start httpd\n```\n\n要用一条命令启用并启动服务，请使用：\n```\n\
  systemctl enable --now service_name\n```\n例如，用一条命令启用并启动 `httpd` 服务（应先安装它）：\n```\n\
  systemctl enable --now httpd\n```\n\n要禁用服务，请使用：\n```\nsystemctl disable service_name\n\
  ```\n例如，禁用 `httpd` 服务：\n```\nsystemctl disable httpd\n```\n\n要停止服务，请使用：\n```\nsystemctl\
  \ stop service_name\n```\n例如，停止 `httpd` 服务：\n```\nsystemctl stop httpd\n```\n\n\
  要重启服务，请使用：\n```\nsystemctl restart service_name\n```\n例如，重启 `httpd` 服务：\n```\nsystemctl\
  \ restart httpd\n```\n\n要显示服务的状态，请使用：\n```\nsystemctl status service_name\n```\n\
  例如，显示 `httpd` 服务的状态：\n```\nsystemctl status httpd\n```\n\n注意：\n- 你无法启用之前被掩蔽（masked）的服务。你必须先使用命令：`systemctl\
  \ unmask service_name` 对其取消掩蔽。\n\n# 列出服务\n\n列出所有 `systemd` 单元（`.service`, `.target`,\
  \ `.device`, `.mount`, `....`），请使用：\n```\nsystemctl list-unit-files\n```\n\n要显示所有服务的状态，请使用：\n\
  ```\nsystemctl list-units --type service --all\n```\n注意：\n- 你可以移除 `--all` 选项仅显示激活的单元。\n\
  \n列出所有已启用的服务，使用：\n```\nsystemctl list-unit-files --state=enabled\n```\n\n列出所有已禁用的服务，使用：\n\
  ```\nsystemctl list-unit-files --state=disabled\n```\n\n# 服务屏蔽与取消掩蔽（Masking and\
  \ UnMasking）\n\n你可以屏蔽任何服务单元以防止其被手动或通过另一个服务启动。\n\n### 准备工作\n\n- 你必须拥有系统的 root 权限。\n\
  \n要屏蔽服务，请使用：\n```\nsystemctl mask name.service\n```\n\n要取消掩蔽服务，请使用：\n```\nsystemctl\
  \ unmask name.service\n```\n注意：\n- 屏蔽服务会将 `/etc/systemd/system/name.service` 文件替换为指向\
  \ `/dev/null` 的符号链接。\n\n◆◆◆\n\n# VII.III 配置系统自动启动到特定目标\n\n## 操作 systemd Target\n\
  \n`systemd` 目标由 target 单元表示，以 `.target` 文件扩展名结尾。`systemd` 目标用于通过依赖链组合其他 `systemd`\
  \ 单元。\n\n要列出当前加载的 target 单元，运行：\n```\nsystemctl list-units --type target\n```\n\n\
  更改当前目标，运行：\n```\nsystemctl isolate name.target\n```\n\n查看默认 target 单元，运行：\n```\n\
  systemctl get-default\n```\n\n列出无论状态如何的所有已加载单元：\n```\nsystemctl list-units --type\
  \ target --all\n```\n\n列出所有当前加载的 target 单元：\n```\nsystemctl list-units --type target\n\
  ```\n\n# 配置系统启动到特定的目标\n\n要配置系统启动到不同的目标：\n```\nsystemctl set-default name.target\n\
  ```\n\n查看默认目标：\n```\nsystemctl get-default\n```\n\n切换当前目标：\n```\nsystemctl isolate\
  \ name.target\n```\n\n列出当前加载的 target 单元：\n```\nsystemctl list-units --type target\n\
  ```\n\n列出所有已加载的 target 单元：\n```\nsystemctl list-units --type target --all\n```\n\
  \n# VII.IV 配置时间服务\n\n## 在 RHEL 中配置 chrony\n\n网络时间协议 (NTP) 是一种用于同步计算机钟的跨平台协议。\n\n\
  `chrony` 既作为服务器也作为客户端工作。\n\n在 RHEL 中安装 chrony：\n\n1. 安装 chrony 软件包，运行：\n```\ndnf\
  \ install chrony\n```\n注意：\n- `chrony` 软件包由 `chronyd` 和 `chronyc` 提供。\n- `chronyc`\
  \ 是一个命令行程序，可以在运行时更改参数。\n\n2. 启动并启用 `chronyd` 服务运行：\n```\nsystemctl start chronyd\n\
  systemctl enable chronyd\n```\n或者\n```\nsystemctl enable chronyd --now\n```\n\n\
  3. 验证 `chronyd` 服务的状态，运行：\n```\nsystemctl status chronyd\n```\n\n# 在 RHEL 中配置 NTP\
  \ 服务器\n\n将 chrony 设置为主 NTP 服务器的步骤：\n\n1. 使用文本编辑器打开 `/etc/chrony.conf` 文件：\n```bash\n\
  vim /etc/chrony.conf\n```\n\n2. ，找到 `allow` 配置指令，取消它的注释并将其值设置为允许客户端连接的网络或子网地址：\n\
  ```bash\nallow 192.168.69.0/24\n```\n\n3. 在 vim 命令模式下输入 `:wq` 保存并退出。\n\n4. 重启 `chronyd`\
  \ 服务以应用最近更改：\n```\nsystemctl restart chronyd\n```\n\n5. 在 `firewalld` 配置中开放 `NTP`\
  \ 服务的访问，以允许来自客户端的请求：\n```bash\nfirewall-cmd --permanent --add-service=ntp\nfirewall-cmd\
  \ --reload\n```\n\n# 在 RHEL 中配置 NTP 客户端\n\n在你的 RHEL 服务器上将 chrony 设置为直接 NTP 客户端的步骤：\n\
  \n1. 安装 `chrony` 软件包，运行：\n```\ndnf install chrony\n```\n\n2. 启动并启用 `chronyd` 服务以便系统启动时自动运行：\n\
  ```\nsystemctl start chronyd\nsystemctl enable chronyd\n```\n或者\n```\nsystemctl\
  \ enable chronyd --now\n```\n\n3. 验证 `chronyd` 服务的运行状态，运行：\n```\nsystemctl status\
  \ chronyd\n```\n\n4. 将你的系统配置为 NTP 服务器的直接客户端。使用文本编辑器打开 `/etc/chrony.conf` 文件：\n```bash\n\
  vim /etc/chrony.conf\n```\n\n5. 找到 `server` 指令，取消注释并设置为 NTP 服务器地址：\n```bash\nserver\
  \ 192.168.69.10 iburst\n```\n\n6. 保存并退出。\n\n7. 重启 `chronyd` 服务以应用更改：\n```\nsystemctl\
  \ restart chronyd\n```\n\n8. 查看同步状态：\n```\nchronyc sources\n```\n\n\n\n\n\n5. 注释掉默认的\
  \ NTP 服务器。\n\n6. 指定客户端-服务器应询问当前时间的 NTP 服务器。你可以使用 `server`（服务端）或 `pool`（池）指令来指定这些服务器：\n\
  \n```\nserver 192.168.69.10\n```\n\n注意：\n*   你可以添加 `iburst`（快速初始同步）选项，允许 **chronyd**\
  \ （定时守护进程 ）更快的进行第一次时钟更新。例如： ``` server  192 .168 .69 。10 iburst ```\n*   ``` server\
  \ ``` (服务端)指令允许你将单个 NTP​​服务**器指****定**为时间源。\n*     `` pool``(**\n\n\n\n\n\n`/etc/yum.conf`\
