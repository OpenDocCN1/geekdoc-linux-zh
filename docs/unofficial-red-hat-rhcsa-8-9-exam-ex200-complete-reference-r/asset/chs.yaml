  ```\n\n4. 要确认主机上是否创建文件，请退出容器：\n\n```bash\nexit\n```\n\n5. 然后运行以下命令：\n\n```bash\n\
  cat /var/lib/containers/backup/sample.txt\n```\n\n# 第 XX 章：总结\n\n## XX.I 总结\n\n\
  《非官方红帽 RHCSA 8 & 9 完整参考》是准备红帽认证系统管理员 (RHCSA) 考试的全面指南。本书涵盖了 Linux 系统管理所需的所有核心主题和技能，包括用户和组管理、文件和目录权限、包管理、网络配置、存储管理以及系统日志。此外，书书中还详细介绍了\
  \ Shell 脚本编写以及高级 Linux 管理主题，如 SELinux、防火墙、网络服务、DNS、Web 服务和容器。\n\n书中包含了大量的练习题，模拟了\
  \ RHCSA 考试环境，帮助读者评估自己的知识和技能。作者还为参加 RHCSA 考试提供了技巧、策略和最佳实践建议。\n\n无论你是初学者还是经验丰富的 Linux\
