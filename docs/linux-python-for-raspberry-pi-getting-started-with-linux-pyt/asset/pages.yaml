  md: '# Web Architecture


    ![](img/da7333aa1bca2c3a48277910fdbdf1f5_213_0.png)


    # Client/Server Timeline


    | Client | Server |

    |--- | --- |

    | (C1) get IP address & port | (S1) create new socket (socket) |

    | (C2) create new socket (socket) | (S2) bind socket to port 80 (bind) |

    | (C3) connect to server IP port (connect) | (S3) permit socket connections (listen)
    |

    | | (S4) wait for connection (accept) |

    | (C4) connection successful | (S5) application notified of connection |

    | (C5) send HTTP request (write) | (S6) start reading request (read) |

    | (C6) wait for HTTP response (read) | (S7) process HTTP request message |

    | (C7) process HTTP response | (S8) send back HTTP response (write) |

    | (C8) close connection (close) | (S9) close connection (close) |'
