  md: "# Direct Register Access gpio_register.c<2/4>\n\n```\n// GPIO setup\n#define\
    \ GPIO_IN(g) (*gpio+((g)/10)) &= ~(7<<(((g)%10)*3)))\n#define GPIO_OUT(g) (*gpio+((g)/10)))\
    \ |= (1<<(((g)%10)*3)))\n\n#define GPIO_SET(g) (*gpio+7) = 1<<g\n#define GPIO_CLR(g)\
    \ (*gpio+10) = 1<<g\n\n#define GPIO_GET(g) (*gpio+13)&(1<<g))\n#define GPIO_PULL\
    \ (*gpio+37) // Pull up/pull down\n#define GPIO_PCLK0 (*gpio+38) // Pull up/pull\
    \ down clock\n```\n\n# Direct Register Access gpio_register.c<3/4>\n\n```\nint\
    \ main(int argc, char **argv){\n    int pin = 18, i=0;\n\nif ((mem_fd = open(MMAP_DEV,\
    \ O_RDWR|O_SYNC) ) < 0) {\n    printf(\"can't open %s\\n\", MMAP_DEV);\n    exit(-1);\n\
    }\n\ngpio_map = mmap(\n    NULL,               //Anyddress in our space will do\n\
    \    GPIO_SIZE,             //Map length\n    PROT_READ|PROT_WRITE,//Enable reading\
    \ & writting to mapped memory\n    MAP_SHARED,         //Shared with other processes\n\
    \    mem_fd,             //File to map\n    GPIO_BASE             //Offset to\
    \ GPIO peripheral\n);\nif (gpio_map == MAP_FAILED) {\n    printf(\"mmap error\
    \ %d\\n\", (int)gpio_map);//errno also set!\n    exit(-1);\n}\n```"
