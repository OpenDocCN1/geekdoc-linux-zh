    - Speed = Distance / Time\n- 34321 = distance / time\n  - 34321 = distance / (time/2)\n\
    \  - 왕복 시간\n  - 17160 = distance / time\n  - 17160 * time = distance\n\n![](img/da7333aa1bca2c3a48277910fdbdf1f5_297_0.png)\n\
    \n# Ultra Sonic Sensor\n\n+   - Python Rpi.GPIO module – ultra_sonic.py\n\n```\n\
    import RPI.GPIO as GPIO\nimport time\n\ntrig_pin = 18\necho_pin = 23\ndistance\
    \ = 0\nstart_time = 0\nend_time = 0\n\nGPIO.setmode(GPIO.BCM)\nGPIO.setup(trig_pin,\
    \ GPIO.OUT)\nGPIO.setup(echo_pin, GPIO.IN)\n```\n\n```\nwhile True:\n    GPIO.output(trig_pin,\
    \ False)\n    time.sleep(0.2) #Wait for being ready\n    GPIO.output(trig_pin,\
    \ True)\n    time.sleep(0.00001) #set HIGH for 10us\n    GPIO.output(trig_pin,\
    \ False)\n    while GPIO.input(echo_pin) == 0:\n        start_time = time.time()\n\
    \    while GPIO.input(echo_pin) == 1:\n        end_time = time.time()\n    travel_time\
    \ = end_time - start_time;\n    distance = travel_time * 17160 #34321/2\n    distance\
    \ = round(distance, 2)\n    print('Distance:%dcm' %distance)\n```\n\n```\nfinally:\n\
