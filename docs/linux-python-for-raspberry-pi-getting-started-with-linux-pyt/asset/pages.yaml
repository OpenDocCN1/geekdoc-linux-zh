    \ = \"./big_buck.avi\"\ncap = cv2.VideoCapture(video_file)\nfps = cap.get(cv2.CAP_PROP_FPS)\n\
    delay = int(1000/fps)\nwhile cap.isOpen():\n    ret, img = cap.read()\n    if\
