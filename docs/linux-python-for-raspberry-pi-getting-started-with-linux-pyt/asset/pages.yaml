    Raspberry Pi is a low-cost embedded board running Debian-based GNU/Linux. This
    page provides a complete toolchain for building and debugging Raspberry Pi applications.


    The toolchain includes the following components:


    +   - The GCC compiler for C and C++ languages

    - The GDB debugger

    - Includes files and libraries from Raspberry Pi image

    - WinFlashTool - a tool for writing disk images to SD card

    - SmartTTY - a portable SSH client with support for copying files to remote machine


    The following releases are available:


