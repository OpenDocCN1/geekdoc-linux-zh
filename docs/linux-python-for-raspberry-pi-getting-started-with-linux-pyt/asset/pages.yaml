    # # Pull-Up, Pull-Down Resistor


    +   - Floating Condition


    +   - Condition unknown while switch is open

    - Weak on noise like surrounding pin voltage, electric statics

    - Solve by connecting 0V(GND) or Vcc (5V) while switch is open


    +   - When Vcc and GND is directly connected overflowing electric current short-circuit


    +   - Generally, use 10K resistor to solve the issue

    - Pull up when resistor is connected to Vcc and pull down when resistor is connected
    to GND


