  md: "# ## Architecture of Sketch (Source Code)\n\n+   * C/C++ Language\n* Use its\
    \ own Pre-processor\n  * Not standard C/C++\n  * Able to call before function\
    \ decl.\n  * Binary Notation (0b or 0B)\n\n```\nvoid setup() {\n}\nvoid loop()\
    \ {\nn\n```\n\n+   * Setup()\n  * Initial one call, initialization\n\n+   * loop()\n\
    \  * Function running while power on\n  * Infinite repetition\n\n```\n#include\
    \ <arduino.h>\n\nint main(void) {\n  init();\n  setup();\n\n  for(;;){\n    loop();\n\
    \  }\n  return 0;\n}\n```\n\n+   * Build Process\n  * Create middle file with\
    \ main function\n    * #include \"arduino.h\"\n  * hardware/arduino/cores/arduino/\n\
    \  * avr-gcc Compile\n  * hardware/tools/avr/bin/\n  * .o File link & Upload\n\
    \n# ## Data Types\n\n| Type | Bytes | Range |\n|---|---|---|nn| boolean | 1 |\
    \ false(0), true(1) |\n| byte | 1 | 0 ~ 255 |\n| char | 1 | -128 ~ 127 |\n| int\
    \ | 2 | -32768~32767 |\n| unsigned int | 2 | 0 ~ 65535 |\n| long | 4 | -2147483648\
    \ ~ 2147483647 |\n| unsigned long | 4 | 0 ~ 4294967295 |\n| float | 4 | 3.4028235+38\
    \ ~ -3.4028235+38 |\n| double | 4 | Same as float |\n| String | String Class |\
    \ |"
