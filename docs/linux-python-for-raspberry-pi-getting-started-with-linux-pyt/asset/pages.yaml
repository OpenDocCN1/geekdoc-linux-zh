  md: "# ## In/Output Basic Function\n\n+   - pinMode(pin, mode)\n  - Set designated\
    \ pin to in/output\n  - pin: # of pin to set\n  - mode : INPUT, OUTPUT, INPUT_PULLUP\n\
    \n+   - delay(ms)\n  - Halt program for certain amount of time\n  - ms: Time to\
    \ halt, milliseconds, unsigned long\n\n+   - digitalWrite(pin, value)\n  - Print\
    \ HIGH (5V) or Low (0V) to designated pin\n  - pin: # of Pin to output\n  - value:\
    \ HIGH or LOW\n\n+   - digitalRead(pin)\n  - Input HIGH or LOW to given pin value\
    \ (to read in)\n  - pin: # of Pin to input\n\n# ## LED Blink\n\n+   - Arduino's\
    \ HelloWorld\n- LED Blink\n\n+   - Part\n  - LED(Light Emitting Diode)\n    -\
    \ Short Leg: Cathode, Negative(- )\n    - Long Leg: Anode, Positive(+ +)\n   \
    \ - Cathode head is cut.\n\n+   - Register\n  - Interf electric flow\n  - Decrease\
    \ Voltage or electric current\n  - No Electrode\n  - Unit: Ω(ohm)\n\n+   - Connect\
    \ Circuit\n  - LED Long Leg: 13 Port + Resistor\n  - LED Short Leg: GND\n\n![](img/da7333aa1bca2c3a48277910fdbdf1f5_401_0.png)"
