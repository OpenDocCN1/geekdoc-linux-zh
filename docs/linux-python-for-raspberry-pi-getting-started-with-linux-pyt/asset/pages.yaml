  md: "# ❖ Standard I/O\n\n| Name | Abbr | Device | File Descriptor |\n| --- | ---\
    \ | --- | --- |\n| Standard Input | stddin | Keyboard | 0 |\n| Standard Output\
    \ | stdout | Terminal(Monitor) | 1 |\n| Standard Error | stderr | Terminal(Monitor)\
    \ | 2 |\n\n![](img/da7333aa1bca2c3a48277910fdbdf1f5_78_0.png)\n\n# ❖ Redirection\n\
    \n+   * Input from file instead of stdin\n  * < file_name\n  * output to file\
    \ instead of stdout\n  * > file_name : overwrite\n  * >> file_name : append\n\
    * output to file instead of stderr\n\n```\n$ echo hello world > hello.txt\n$ cat\
    \ > helloworld.txt\nHello world\n$ cat < helloworld.txt\nHello world\n$ ls > list.txt\n\
    $ ls hello.txt xyz.txt\nls: cannot access 'xyz.txt': No such file or directory\n\
    hello.txt\n$ ls hello.txt xyz.txt > list.log 2>err.log\n$ cat list.log\nhello.txt\n\
    $ cat err.log\nls: cannot access 'xyz.txt': No such file or directory\n```"
  merge: -1
  pgno: 78
- img_proc: true
  md: "# Redirection\n\n+   - /dev/null\n  - Null Device\n  - Special File to discard\
    \ useless data\n  - command 2> /dev/null\n    - discarding useless error messages\n\
    \n+   - file_name 2>&1\n  - Redirecting stdout, stderr > /dev/null\n\n```\n$ find\
    \ -name hosts 2 > /dev/null\n/etc/avahi/hosts\n/etc/hosts\n\n$ ls hello.txt abc.txt\
    \ > ls.log 2>&1\n$ cat ls.log\nls: cannot access 'abc.txt': No such file or directory\n\
    hello.txt\n```\n\n# Pipe (|)\n\n+   - Connect stdout of process(A) to stdin of\
    \ another process(B)\n- A|B\n\n```\npi@raspberrypi:~/test $ echo hello world |\
    \ cat\nhello world\n\npi@raspberrypi:~/test $ ls -l | wc -l\n13\n\npi@raspberrypi:~/test\
    \ $ ps -ef | grep bash\npi 472 362 0 Feb19 tty1 00:00:00 -bash\npi 947 944 0 Feb19\
    \ pts/0 00:00:04 -bash\npi 1495 947 0 01:14 pts/0 00:00:00 grep\n--color=auto\
    \ bash\n```"
  merge: -1
  pgno: 79
