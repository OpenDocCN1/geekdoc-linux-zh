  md: "# GCC Cross Compiler for RaspberryPi\n\n+   * Check Installation\n* C:\\SysGCC\\\
    Raspberry\\bin\\arm-linux-gnueabhf-gcc --version\n\n```\nc:\\SysGCC\\Raspberry\\\
    bin\\arm-linux-gnueabhf-gcc --version\narm-linux-gnueabhf-gcc (GCC) 4.9.2\nCopyright\
    \ (C) 2014 Free Software Foundation, Inc.\nThis is free software; see the source\
    \ for copying conditions. There is NO\nwarranty; not even for MERCHANTABILITY\
    \ OR FITNESS FOR A PARTICULAR PURPOSE.\n```\n\n+   * Source Code \"hello_world.c\"\
    \n    * make file named hello_world\n\n```\n#include <stdio.h>\nint main() {\n\
    \    printf(\"Hello World\\n\");\n}\n```\n\n# GCC Cross Compiler for RaspberryPi\n\
    \n+   * Compile\n    * arm-linux-gnueabhf-gcc -o hello_world hello_world.c\n \
    \   * Check the output file named \"hello_world\"\n\n+   * Upload to RaspberryPi\
    \ using WinSCP\n    * /home/pi/hello_world\n\n+   * Check and change permission\
    \ the file on RaspberryPi\n    * ~$ file hello_world\n    * $ chmod 777 hello_world\n\
    \n+   * execution the file\n    * ~$hello_world\n\n```\npi@raspberry:~$ ls -l\
    \ hello_world\n-rw-r--r-- 1 pi pi 5796 Jan 27 17:08 hello_world\npi@raspberry:~$\
    \ file hello_world\nELF 32-bit LSB executable, ARM, EABI5 version 1 (SYSV), dynamically\n\
    linked, fully linked, interpreter /lib/ld-linux-armhf.so.3, for GNU/Linux 2.6.32,\
    \ BuildID[1]=78182f3d98259af872a506d9b9de3c24d, not stripped\npi@raspberry:~$\
    \ chmod 777 hello_world\npi@raspberry:~$ ./hello_world\nHello World\n```"
