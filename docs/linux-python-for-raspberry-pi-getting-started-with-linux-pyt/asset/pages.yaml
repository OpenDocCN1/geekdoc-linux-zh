    \ Scan halt\n- sudo hiconfig hci0 leadv3\n  - None Connectable -i hci0 cmd LE\
    \ Advertising, leadv0 : Connectable\n- sudo hcitool -i hci0 cmd 0x0008 1E 02 01\
    \ 1A 1A FF 4C 00 02 15 E2 EA 09 F34 73 F5 4B C4 1A 2F 17 D1 07 A9 61 00 01 00\
    \ 02 C8 00\n  - Advertising send command\n  - 0x08: OGF, Bluetooth command group\n\
    \  - 0x0008: OCF, send Bluetooth command\n  - 1E 02 01 : AD Flag(3Byte), 길이 30byte,\
    \ General Discoverable\n  - 1A 1A : AD Headers(2Bytes), Remainder AD Type\n  -\
    \ FF 4C 00 02 : Vendor spec. data, Apple ID(4C 00), Typeid(02:Beacon)\n  - 15\
    \ : Remainder length: 21\n  - E2 0A 39 F4 73 F5 4B C4 A1 2F 17 D1 07 A9 61 : UUID\n\
    \  - 00 01 : Major Number\n  - 00 02 : Minor Number\n  - C8 : Tx Power\n  - 00\
    \ : Null EOF\n- sudo hiconfig hci0 noleadvv\n  - Advertising send command\n\n\
