    \        data = socket.recv(1024)\n        print(\"recv :\", data)\n        socket.close()\n\
    \        break\n```\n\n## Raspberry Pi Communication\n\n1. Serial Communication\n\
    2. UART\n3. I2C\n4. SPI\n5. Bluetooth\n6. BLE – Beacon\n\n## BLE\n\n- Bluetooth\
    \ Low Energy\n  - Bluetooth 4.0 Standard\n  - Bluetooth SMART (BLE Device, Sensor)\n\
    \  - Bluetooth SMART Ready (Laptop, Smart Phone)\n\n- Profile\n  - Conceptual\
    \ standard difference for Bluetooth\n  - motion & control\n  - GAP, Generic Access\
