    \ | 5V 600mA | 5V 800mA | 5V 160mA | 5V 1.34A (2.1A) | 5V 350mA |\n\n# 树莓派 3\n\
    \n- ARMv8 CPU 1.2GHz 64位四核\n- 802.11n 无局域网\n- 蓝牙 4.1 低功耗蓝牙(BLE)\n- 1GB 内存\n- 4\
