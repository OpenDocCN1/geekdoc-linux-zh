- md: "\n## Sysfs\n\n- Linux Kernel 2.6+\n- Special File System\n- Includes drivers\
    \ for GPIO control\n- C Programming using System calls\n- Independent of board\
    \ type, Available on any Linux OS\n- Console command\n\n```\n$ echo \"18\" > /sys/class/gpio/export\n\
    $ ls /sys/class/gpio/\n$ echo \"out\" > /sys/class/gpio/gpio18/direction\n$ echo\
    \ \"1\" > /sys/class/gpio/gpio18/value\n$ echo \"0\" > /sys/class/gpio/gpio18/value\n\
    $ echo \"18\" > /sys/class/gpio/unexport\n$ ls /sys/class/gpio/\n```\n\n## Sysfs\
    \ C Program – gpio_sysfs.c <1/2>\n\n```c\n#include <stdio.h>\n#include <fcntl.h>\n\
    #include <unistd.h>\n#include <string.h>\nint main(int argc, char **argv) {\n\
    \    int gpio_pin = 18;\n    int fd;\n    char buff[BUFSIZ];\n    fd = open(\"\
    /sys/class/gpio/export\", O_WRONLY);\n    if (fd == -1) {\n        perror(\"fail\
    \ to open export.\");\n        return 1;\n    }\n    printf(\"%d\" , gpio_pin);\n\
    \    if (write(fd, buff, sizeof(buff)) == -1) {\n        perror(\"fail to export\
    \ GPIO\");\n        return 1;\n    }\n    close(fd);\n}\n```\n\n```c\nsprintf(buff,\
    \ \"/sys/class/gpio%d/direction\", gpio_pin);\n    fd = open(buff, O_WRONLY);\n\
    \    if (fd == -1) {\n        perror(\"fail to open GPIO Direction File\");\n\
    \        return 1;\n    }\n    if (write(fd, \"out\", 4) == -1) {\n        perror(\"\
    fail to set direction\\n\");\n        return 1;\n    }\n    close(fd);\n```\n\n\
    ## Sysfs C Program - gpio_sysfs.c <2/>\n\n```c\nsprintf(buff, \"/sys/class/gpio/gpio%d/value\"\
    , gpio_pin);\nfd = open(buff, O_WRONLY);\nint i=0;\nfor(i=0; i<10; i++) {\n  \
    \  if (write(fd, \"1\", sizeof(\"1\")) == -1) {\n        perror(\"fail to set\
    \ value:1\");\n        return 1;\n    }\n    printf(\"set gpio %d value as HIGH\\\
    n\", gpio_pin);\n    sleep(1);\n    if (write(fd, \"0\", sizeof(\"0\")) == -1)\
    \ {\n        perror(\"fail to set value:0\");\n        return 1;\n    }\n    printf(\"\
    set gpio %d value as LOW\\n\", gpio_pin);\n    sleep(1);\n}\nclose(fd);\n```\n\
    \n```c\nfd = open(\"/sys/class/gpio/export\", O_WRONLY);\nsprintf(buff, \"%d\"\
    , gpio_pin);\nwrite(fd, buff, strlen(buff));\nclose(fd);\n\nreturn 0;\n```\n\n\
    ```\n$ gcc -o gpioled gpioled.c\n$ sudo ./gpioled\n```\n\n## Sysfs Python Program\
    \ – gpio_sysfs.py <1/2>\n\n## Sysfs Python Program - gpio_sysfs.py <2/2>\n\n```python\n\
    f = open('/sys/class/gpio/export', 'w')\nf.write('%d' % gpio_pin)\nf.close()\n\
    print('export done.')\n```\n\n```\n$ sudo python3 gpio_sysfs.py\n```\n\n## Java\
