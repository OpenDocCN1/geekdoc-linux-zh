- md: "\n# Raspberry Pi Multimedia\n\n1. Buzzer\n2. Audio\n3. Camera\n4. CCTV\n5.\
    \ OpenCV Video Handling\n\n# Audio Print\n\n- * sudo raspi-config\n  - Advanced\
    \ Option --> Audio\n- Audio Enable\n  - /boot/config.txt\n  - Dparam=audio=on\n\
    - Audio Print Modules\n  - Python\n    - pyaudio, pygame\n  - NodeJs\n  - play-sound\n\
    \n# ALSA\n\n- * Advanced Linux Sound Architecture\n- Linux Kernel Version 2.6\
    \ Basic Sound System\n- Replace OSS (Open Sound System)\n- Main utils\n  - amixer\n\
    \    - Sound system check and rest\n  - alsamixer\n    - Sound volume control\n\
    \  - alsactl\n    - Sound driver advance setting\n\n- aplay\n- Recorder and Player\n\
    - aplay ~/sample.wav\n- speaker-test\n- Print white noise\n\n## PyAudio\n\n- https://people.csail.mit.edu/hubert/pyaudio/\n\
    - Installation\n- sudo apt-get install python-pyaudio\n- Function\n  - Recording\n\
    \  - Wav Print, mp3 not supported\n  - Main Function\n  - p = pyaudio.PyAudio().stream\
    \ = p.open\n  - stream.read(chunk)\n  - stream.stop_stream()\n  - stream.close()\n\
    \  - p.terminate()\n\n## PyAudio Wave File Play Block\n\n```python\nimport pyaudio,\
    \ wave\nchunk = 1200\nwf = wave.open('sample.wav', 'rb')\np = pyaudio.PyAudio()\n\
    stream = p.open(format=p.get_format_from_width(wf.getsampwidth()),\n         \
    \       channels=wf.getnchannels(),\n                rate=wf.getframerate(),\n\
    \                output=True)\ndata = wf.readframes(chunk)\nwhile len(data) >\
    \ 0:\n    stream.write(data)\n    data = wf.readframes(chunk)\nstream.stop_stream()\n\
    stream.close()\np.terminate()\n```\n\n## PyAudio Wave File Play Playback\n\n```python\n\
    import pyaudio, wave, time\ndef callback(in_data, readframes, frame_count, time_info,\
    \ status):\n    data = wf.readframes(frame_count)\n    return (data, pyaudio.paContinue)\n\
    f = wave.open('/home/pi/sample.wav', 'rb')\np = pyaudio.PyAudio()\nstream = p.open(format=p.get_format_from_width(wf.getsampwidth()),\n\
    \                channels=wf.getnchannels(),\n                rate=wf.getframerate(),\n\
    \                output=True,\n                stream_callback=callback)\nstream.start_stream()\n\
    while stream.is_active():\n    time.sleep(0.5)\nstream.stop_stream()\nstream.close()\n\
    f.close()\np.terminate()\n```\n\n## Pygame mixer Module\n\n- * http://www.pygame.org/docs/ref/music.html\n\
    - Installation\n  - sudo apt-get install python-pygame\n  - Installed by default\n\
    - Basic APIs\n  - import pygame\n  - pygame.init()\n  - pygame.mixer.music.load('sample.mp3')\n\
    \  - pygame.mixer.music.play()\n  - pygame.mixer.music.pause()\n  - pygame.mixer.music.unpause()\n\
    \  - pygame.mixer.music.stop()\n\n## Pygame mixer code\n\n- mp3.py\n\n```python\n\
    import pygame\nimport time\n\npygame.init()\n\npygame.mixer.music.load(\"sample.wav\"\
    )\npygame.mixer.music.load(\"sample.mp3\")\nwhile True:\n    cmd = raw_input(\"\
    cmd:p, pause:pp, unpause:up, stop:s: \")\n    if cmd == \"p\":\n        pygame.mixer.music.play()\n\
    \    elif cmd == \"pp\":\n        pygame.mixer.music.pause()\n    elif cmd ==\
    \ \"up\":\n        pygame.mixer.music.unpause()\n    elif cmd == \"s\":\n    \
    \    pygame.mixer.music.stop()\n    # exit(0)\n    else:\n        print \"incorrect\
    \ cmd. try again.\"\n```\n\n# Raspberry Pi Multimedia\n\n1. Buzzer\n2. Audio\n\
    3. Camera\n4. CCTV\n5. OpenCV Video Handling\n\n## Raspi-Camera\n\n- https://www.raspberrypi.org/documentation/usage/camera/python/README.md\n\
    - Connect to camera Interface\n- Activate Raspberry camera\n  - sudo raspi-config\n\
    \  - 6. Enable Camera\n\n## Raspi-Camera\n\n- Take Photo\n  - raspistill -o capture1.jpg\n\
    \    - Take still photo after 5 seconds\n  - raspistill -o capture2.jpg -w 1280\
    \ -h 720\n    - Resolution 1280 x 720\n- Take Video\n  - raspivid -o video.h264\
    \ -t 5000\n    - Shoot video for five seconds\n  - Check video\n  - omxplayer\
    \ path/video.h264\n- Notice\n  - Preview not shown in VNC Viewer\n  - Need to\
    \ connect Display device\n\n## PiCamera Module\n\n- PiCamera Installation\n  -\
    \ https://github.com/wavehare/picamera\n  - sudo apt-get install python-picamera\n\
