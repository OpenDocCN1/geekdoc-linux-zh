    - 201x-xx-raspbian-jessie.zip\n- Raspbian\n- Jessie with PIXEL：完整版\n- Jessie Lite：精简版\n\
    \n![](img/da7333aa1bca2c3a48277910fdbdf1f5_9_0.png)\n\n# 将镜像烧录 SD 卡\n\n- ETCHER\n\
