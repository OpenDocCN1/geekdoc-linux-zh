    #... 略去 ...\nsu - pi -c '~/.myd.sh' &\nexit 0\n```\n\n- 重启并检查进程\n  - $ sudo reboot\n\
    \  - $ tail -f date.log\n  - on Feb 26 11:10:07 KST 2018\n  - Mon Feb 26 11:10:07\
