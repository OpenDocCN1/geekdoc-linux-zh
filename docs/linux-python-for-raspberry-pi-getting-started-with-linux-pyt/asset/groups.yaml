    \n![](img/da7333aa1bca2c3a48277910fdbdf1f5_238_0.png)\n\n# gpio_register.c\n\n\
    ```c\n#define BCMIO_BASE 0x3F000000 // Raspberry Pi\n#define BCM_BASE 0x200000\
