    \ programming\n- 5. Process & System\n  5.1 Process\n  5.2 System Initialization\n\
    \  5.3 User\n  5.4 Utilities & APT\n- 6. Python Basic\n  6.1 Introduction\n  6.2\
    \ Syntax\n  6.3 Data Structure\n  6.4 Function\n  6.5 Module\n  6.6 Class\n  6.7\
    \ Exception\n  6.8 File I/O\n  6.9 Thread\n  6.10 Networking\n- 7. Python Web\
    \ Programming\n  7.1 Introduction\n  7.2 HTTP\n  7.3 Flask\n  7.4 WebSocket\n\n\
    ## Chapter 2: Raspberry-Pi for Prototyping\n\n- 1. Raspberry-Pi & GPIO\n  1.1\
    \ GPIO\n  1.2 Digital Output\n  1.3 Digital Input\n  1.4 Analog Output – PWM\n\
    \  1.5 Analog Input – RC Circuit\n  1.6 High Level Sensor Modules\n- 2. Raspberry-Pi\
    \ Communication\n  2.1 Serial Communication\n  2.2 UART\n  2.3 I²C\n  2.4 SPI\n\
    \  2.5 Bluetooth\n  2.6 BLE - Beacon\n- 3. Raspberry-Pi Multimedia\n  3.1 Buzzer\n\
    \  3.2 Audio\n  3.3 Camera\n  3.4 CCTV\n  3.5 OpenCV Computer Vision\n- 8. Raspberry-Pi\
    \ Web IoT\n  8.1 Introduction\n  8.2 Web with GPIO\n  8.3 Camera Web Streaming\n\
    - 9. Appendix\n  9.1 Arduino\n\n# Raspberry Pi Installation\n\n- 1. Introduction\n\
    - 2. OS(Rasbian) Installation\n- 3. Development Environment\n\n# Raspberry-Pi\n\
    \n- https://en.wikipedia.org/wiki/Raspberry_Pi\n- Eben Upton, UK Raspberry Pi\
    \ Foundation Founder\n- For teaching computer science in developing countries\n\
    - 2011, Alpha board\n- 2012, First sales\n- Broadcom BCM2835 SoC\n- Designed as\
    \ a PC, Not a development board\n\n![](img/da7333aa1bca2c3a48277910fdbdf1f5_5_0.png)\n\
    ![](img/da7333aa1bca2c3a48277910fdbdf1f5_5_1.png)\n\n# Raspberry Pi Boards Series\n\
    \n- https://www.raspberrypi.org/products/\n\n![](img/da7333aa1bca2c3a48277910fdbdf1f5_5_2.png)\n\
    ![](img/da7333aa1bca2c3a48277910fdbdf1f5_5_3.png)\n![](img/da7333aa1bca2c3a48277910fdbdf1f5_5_4.png)\n\
    ![](img/da7333aa1bca2c3a48277910fdbdf1f5_5_5.png)\n![](img/da7333aa1bca2c3a48277910fdbdf1f5_5_6.png)\n\
    ![](img/da7333aa1bca2c3a48277910fdbdf1f5_5_7.png)\n![](img/da7333aa1bca2c3a48277910fdbdf1f5_5_8.png)\n\
    ![](img/da7333aa1bca2c3a48277910fdbdf1f5_5_9.png)\n\n# Raspberry Pi Boards Series\n\
    \n| Name | 1 Model A+ | 1 Model B+ | 2 Model B | Zero | 3 Model B | Zero W |\n\
    |---|---|---|---|---|---|---|\n| Date | Nov, 2014 | Jul, 2014 | Feb, 2015 | Nov,\
    \ 2015 | Feb, 2016 | Feb, 2017 |\n| Price | #20 | $35 | $35 | $5 | $35 | $10 |\n\
    | CPU | ARM11 700MHz Single Core | ARM11 700MHz Single Core | Cortex A7 900MHz\
    \ Quad Core | ARM 11 1GHz Single | Cortex-A53 1.2GHz Quad | ARM 11 1GHz Single\
    \ Core |\n| SoC | BCM2835 | BCM2835 | BCM2836 | BCM2835 | BCM2837 | BCM2835 |\n\
    | RAM | 256MB | 512MB | 1GB | 512MB | 1GB | 512MB |\n| Network | N/A | Ethernet\
    \ 10/100 | Ethernet 10/100 | N/A | Ethernet 10/100 W-Lan 2.4GHz Bluetooth 4.1\
    \ 802.11n | W-Lan 2.4GHz 802.11n Bluetooth 4.1 BLE |\n| USB | USB 2.0 x1 | USB\
    \ 2.0 x4 | USB 2.0 x4 | Micro USB x1 | USB 2.0 x4 | Micro USB x1 |\n| Power |\
    \ 5V 200mA | 5V 600mA | 5V 800mA | 5V 160mA | 5V 1.34A (2.1A) | 5V 350mA |\n\n\
    # Raspberry Pi 3\n\n- ARMv8 CPU 1.2GHz 64bit quad-core\n- 802.11n Wireless LAN\n\
    - Bluetooth 4.1\n- Bluetooth Low Energy(BLE)\n- 1GB RAM\n- 4 USB ports\n- 40 GPIO\
    \ Pins\n- Full HDMI port\n- Ethernet port\n- 3.5mm audio\n- Camera interface(CSI)\n\
    - Display interface(DSI)\n- Micro SD card slot\n- VideoCore IV 3D graphics\n\n\
    ![](img/da7333aa1bca2c3a48277910fdbdf1f5_7_0.png)\n\n# Raspberry Pi 3\n\n![](img/da7333aa1bca2c3a48277910fdbdf1f5_7_1.png)\n\
    \n# Raspberry Pi Installation\n\n- 1. Introduction\n- 2. OS(Rasbian) Installation\n\
    - 3. Development Environment\n\n# OS image file download\n\n- https://www.raspberrypi.org/downloads/raspbian/\n\
    - 201x-xx-xx-raspbian-jessie.zip\n- Raspbian\n- Jessie with PIXEL : Full Image\n\
    - Jessie Lite : Minimal Image\n\n![](img/da7333aa1bca2c3a48277910fdbdf1f5_9_0.png)\n\
    \n# Burn Image to SD Card\n\n- ETCHER\n- https://etcher.io/\n- Windows, macOS\n\
    - Win32DiskIm\n- Windows Only\n\n![](img/da7333aa1bca2c3a48277910fdbdf1f5_9_1.png)\n\
    ![](img/da7333aa1bca2c3a48277910fdbdf1f5_9_2.png)\n\n# setup\n\n- Connect Monitor,\
    \ Keyboard, Mouse and Internet\n- Serial Console TTY\n- USB-Serial Converter to\
    \ UART(Pi)\n- Direct Ethernet(PC)\n- Easiest way to setup but inconvenient\n-\
    \ Connecting Monitor using HDMI\n- Mouse/Keyboard using USB\n- Insert SD Card\n\
    \n![](img/da7333aa1bca2c3a48277910fdbdf1f5_10_0.png)\n![](img/da7333aa1bca2c3a48277910fdbdf1f5_10_1.png)\n\
    \n# PC\n\n- open editor as sudo\n- Run leafpad\n\n- static IP setup\n- Open /etc/dhcpcd.conf\n\
    \ninterface eth0\nstatic ip_address=192.168.0.1/24\nstatic routers=192.168.0.254\n\
    static domain_name_servers=8.8.8.8\n\n![](img/da7333aa1bca2c3a48277910fdbdf1f5_11_0.png)\n\
    \n| Name | Size | Modified |\n|---|---|---|\n| debian_version | 4 bytes | 30/11\
    \ |\n| user.conf | 64 bytes | 16/05 |\n| dhcpcd.conf | 1.2 kB | 17/10 |\n| dhcpcd.duid\
    \ | 42 bytes | 15/15 |\n| phys-swap | 1 kB | 11/16 |\n| environment | 0 bytes\
    \ | 24/03 |\n| fake-hwclock.data | 5 bytes | 14/ |\n| fb.modes | 20 bytes | 13/14\
    \ |\n\n| Edit | Search | Help |\n|---|---|---|\n| New | Ctrl+N | |\n| Open | Ctrl+O\
    \ | |\n| Save | Ctrl+S | |\n| Save As | Shift+S | |\n| Print | Shift+P | |\n|\
    \ Quit | Ctrl+Q | |\n\n# Console TTY Enable\n\n- Connect to PC and Check 'boot'\
    \ and files in it\n- cmdline.txt\n- config.txt\n\n```\ndwc_otg.param_enable=0\n\
    console=serial0,115200tty1=/dev/mmc0p2\nroottype=ext4\nrepair=yes\n```\n\n- add\
    \ \"enable_uart=1\" at the end of the file\n- no spaces in the line\n- Uncomment\
    \ if you get picture on HDMI...\n- enable_uart=1\n\n- Eject SD card from PC, Insert\
    \ into Pi slot\n- No Power to Raspberry Pi yet.\n\n![](img/da7333aa1bca2c3a48277910fdbdf1f5_12_0.png)\n\
    \n# Static IP setup\n\n- sudo vi /etc/dhcpcd.conf (Back-up)\n\n```\ninterface\
    \ eth0\nstatic ip_address=192.168.0.1/24\nstatic routers=192.168.0.254\nstatic\
    \ domain_name_servers=8.8.8.8 8.8.4.4\n```\n\n- sudo reboot\n- ifconfig eth0\n\
    - Check IP Address\n\n```\n@raspberry:~ ifconfig eth0\neth0      Link:Ethernet\
    \ HWaddr b8:27:eb:be:b2:66\n          inet 192.168.0.255 Broadcast:192.168.0.255\
    \ Mask:255.255.255.0\ninet6     fe80::ba27:ebff:febe:b266/64 Scope:Link\nUP BROADCAST\
    \ RUNNING MULTICAST  MTU:1500 Metric:1\n         RX packets:95 errors:0 overruns:0\
    \ frame:0\n         TX packets:90 errors:0 overruns:0 carrier:0\n    collisions:0\
    \ txqueuelen:1000\n         RX bytes:16747 (16.3 KiB) TX bytes:15880 (15.5 KiB)\n\
    ```\n\n# Network Check\n\n- ip\n- ifconfig\n- ip address\n- Router\n- route\n\
    - ip route\n- DNS\n- cat /etc/resolv.conf\n\n```\n$ route\nKernel IP routing table\n\
    Destination Gateway Genmask Flags Metric Use Iface\ndefault 192.168.0.254 0.0.0.0\
    \ UG 303 0 eth0\n192.168.0.254 0.0.0.0 255.255.255.0 U 303 0 eth0\n```\n\n```\n\
    $ cat /etc/resolv.conf\n# Generated by resolvconf\nnameserver 8.8.8.8\nnameserver\
    \ 8.8.4.4\n```\n\n# Wifi setup\n\n- sudo iwlist wlan0 scan\n- sudo vi /etc/wpa_supplicant/wpa_supplicant.conf\n\
    \n```\nnetwork={\n  ssid=\"my_ap\"\n  psk=\"my_password\"\n}\n```\n\n```\nnetwork={\n\
    \  ssid=\"my_ap\"\n  key_mgmt=NONE\n}\n```\n\n- sudo ifdown wlan0\n- sudo ifup\
    \ wlan0\n- ifconfig wlan0\n- Check IP address\n\n![](img/da7333aa1bca2c3a48277910fdbdf1f5_14_0.png)\n"
