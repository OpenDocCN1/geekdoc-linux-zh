    \ HelloWorld\n\n- Compose Circuit\n  - LED\n    - Short leg to GND\n    - Long\
    \ leg to 13\n- Sketch\n  - File > Example > 01.Basics > Blink\n  - Compile, Upload\n\
    - Experiment Result\n  - LED Blink next to 13 port\n\n![](img/da7333aa1bca2c3a48277910fdbdf1f5_398_0.png)\n\
    \n```cpp\n/*\n * Blink\n * This sketch blinks an LED on and off for one second.\n\
    \ * The LED is connected to digital pin 13 on most\n * Arduino boards, using the\
    \ built-in LED.\n */\n\nvoid setup() {\n  pinMode(13, OUTPUT);\n}\n\nvoid loop()\
    \ {\n  digitalWrite(13, HIGH); // turn the LED on\n  delay(1000);\n  digitalWrite(13,\
    \ LOW); // turn the LED off\n  delay(1000);\n}\n```\n\n# Arduino\n\n1. Introduction\n\
    2. Developing Environment\n3. Digital I/O\n4. Analog I/O\n5. External Library\n\
    \n## Architecture of Sketch (Source Code)\n\n- C/C++ Language\n- Use its own Pre-processor\n\
    \  - Not standard C/C++\n  - Able to call before function decl.\n  - Binary Notation\
    \ (0b or 0B)\n\n```cpp\nvoid setup() {\n}\nvoid loop() {\n\n}\n```\n\n- Setup()\n\
    \  - Initial one call, initialization\n\n- loop()\n  - Function running while\
    \ power on\n\n```cpp\n#include <arduino.h>\n\nint main(void) {\n  init();\n  setup();\n\
    \n  for(;;){\n    loop();\n  }\n  return 0;\n}\n```\n\n- Build Process\n  - Create\
    \ middle file with main function\n    * #include \"arduino.h\"\n  * hardware/cores/arduino/\n\
    \  * avr-gcc Compile\n  * hardware/tools/avr/bin/\n  * .o File & Upload\n\n##\
    \ Data Types\n\n| Type | Bytes | Range |\n|---|---|---|\n| boolean | 1 | false(0),\
    \ true(1) |\n| byte | 1 | 0 ~ 255 |\n| char | 1 | -128 ~ 127 |\n| int | 2 | -32768\
    \ ~ 32767 |\n| unsigned int | 2 | 0 ~ 65535 |\n| long | 4 | -2147483648 ~ 2147483647\
    \ |\n| unsigned long | 4 | 0 ~ 4294967295 |\n| float | 4 | 3.402823e+38 ~ -3.402823e+38\
    \ |\n| double | 4 | Same as float |\n| String | String Class | |\n\n## In/Output\
    \ Basic Function\n\n- pinMode(pin, mode)\n  - Set designated pin to in/output\n\
    \  - pin: # of pin to set\n  - mode : INPUT, OUTPUT, INPUT_PULLUP\n\n- delay(ms)\n\
    \  - Halt program for certain amount of time\n  - ms: Time to halt, milliseconds,\
    \ unsigned long\n\n- digitalWrite(pin, value)\n  - Print HIGH (5V) or Low (0V)\
    \ to designated pin\n  - pin: # of Pin to output\n  - value: HIGH or LOW\n\n-\
    \ digitalRead(pin)\n  - Input HIGH or LOW to given pin value (to read in)\n  -\
    \ pin: # of Pin to input\n\n## LED Blink\n\n- Arduino's HelloWorld\n- LED Blink\n\
    \n- Part\n  - LED(Light Emitting Diode)\n    - Short Leg: Cathode, Negative(-\
    \ )\n    - Long Leg: Anode, Positive(+ +\n    - Cathode head is cut.\n\n- Register\n\
    \  - Interf electric flow\n  - Decrease Voltage or electric current\n  - No Electrode\n\
    \  - Unit: Ω(ohm)\n\n- Connect Circuit\n  - LED Long Leg: 13 Port + Resistor\n\
    \  - LED Short Leg: GND\n"
