    | POST | Report information included in Body to be saved to designated URL |

    | PUT | Deliver information to be saved to designated URL |

    | DELETE | Delete designated resources. |

    | HEAD | Request response header. It is same as GET except it is without Response
    Body |

    | OPTIONS | Request HTTP methods supported by designated URL |

    | TRACE | Echoes back Re-send received message |

    | CONNECT | Reserved to Proxy use |


