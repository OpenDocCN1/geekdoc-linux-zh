    \ clean\n  - sudo make DESTDIR=/usr\n- Run\n  - mjpg-streamer -i \"input_uvc.so\
    \ -d /dev/video0 -n -f 30 -r 1280x720\" -o \"output_http.so -n -w /usr/www\"\n\
