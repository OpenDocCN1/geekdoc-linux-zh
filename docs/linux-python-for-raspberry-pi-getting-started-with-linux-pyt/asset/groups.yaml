    %d HIGH\\n\", LED);\n    delay(1000);\n    digitalWrite(LED, LOW);\n    printf(\"\
    %d LOW\\n\", LED);\n    delay(1000);\n  }\n\n  return EXIT_SUCCESS;\n}\n```\n\n\
