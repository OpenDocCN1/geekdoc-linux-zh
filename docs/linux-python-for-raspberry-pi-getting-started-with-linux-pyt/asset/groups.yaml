    \ Little Star\n\n+   - Python – buzzer_littlestar.py\n\n```\nimport wiringpi\n\
    from time import sleep\npin = 18\nfrequencies = {'c':262, 'd':294, 'e':330, 'f':349,\
    \ 'g':392, 'a':440, 'b':494}\nnotes = 'ccggaag ffeedec ggfeeed ccggaag ffeededc'\n\
    wiringpi.wiringPiSetupGpio()\ntry:\n    wiringpi.softToneCreate(pin)\n    for\
