    \n# 启动服务\n\n- 添加服务：myd.service\n  - 创建文件 /lib/systemd/system/myd.service\n\n```\n\
    [Unit]\nDescription=My daemon service test\n\n[Service]\nUser=pi\nExecStart=/home/pi/myd.sh\n\
    ExecStop=pkill myd.sh\n\n[Install]\nWantedBy=multi-user.target\nAlias=myd.service\n\
    ```\n\n# 启动服务\n\n- 添加服务：mys.service\n\n- 启用并启动\n\n```bash\npi@raspberry:~ $ sudo\
