    ```bash\npi@raspberry:~ $ sudo systemctl stop mys.service\npi@raspberry:~ $ sudo\
    \ systemctl disable mys.service\n```\n\n# 进程与系统管理\n\n- 1. 进程\n- 2. 系统初始化\n- 3.\
    \ 用户\n- 4. 工具\n\n# 获取用户信息\n\n- 确定当前用户或指定用户\n  - id [ID]\n  - who am i\n- 获取所有登录的用户\n\
