    \ |= (1<<((g)%10))\n#define GPIO_SET(g) (*gpio+7) = 1<<g\n#define GPIO_CLR(g)\
    \ (*gpio+10) = 1<<g\n#define GPIO_GET(g) (*gpio+13)&(1<<g)\n#define GPIO_PULL(g)\
    \ (*gpio+37) // Pull up/down\n#define GPIO_PCLK0 (*gpio+38) // Pull up/down clock\n\
    ```\n\n```c\nint main(int argc, char **argv){\n    int pin = 18, i=0;\n\n    if\
    \ ((mem_fd = open(MMAP_DEV, O_RDWR|O_SYNC) ) < 0) {\n    printf(\"can't open %s\\\
