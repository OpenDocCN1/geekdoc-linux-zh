    # # Beacon


    +   - Advertising Specific Devices


    +   - iBeacon


    +   - Apple registered mark for indoor positioning system


    +   - Maxi 31byte payload within PDU


    Over the 47 Bytes are transmitted


    | Preamble | Access Addr | Packet Data Unit (PDU) | CRC |

    | --- | --- | --- | --- |

    | 1B | 4B | (2 ... 39B) | 3B |

    | Payload (-37B) | | | |

    | Header | MAC Addr | Advertising Data | |

    | 2B | 6B | 0 ... 31B | |


    ![](img/da7333aa1bca2c3a48277910fdbdf1f5_339_0.png)


    After the BLE stack eats a bunch of overhead we are left with 31B of advertising
    data


    | AD Struct | AD Struct | ... | AD Struct |

    | --- | --- | --- | --- |

    | Length | Type | Data | Service can define 31B data |

    | 1B | 1B | Length - 1 | |


    That 31B can be broken up into any number of advertising structures, each with
    2B of overhead. The total size of all structures cannot exceed 31B.


    # # iBeacon Data Frame


    +   - Advertising Data


    +   - Max 31 Byte payload within PDU


    +   - Major/Minor Number


    +   - Recognize Beacon device


    +   - Tx Power


    +   - Signal strength measured within 1m of device


    +   - Use to calculate distance'
