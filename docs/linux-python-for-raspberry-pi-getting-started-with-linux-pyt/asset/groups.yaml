    \  - Wrapping way of Register Access\n  - GPIO and Software PWM only\n  - H/W\
    \ PWM, SPI, I2C, UART not support\n\n## Rpi.GPIO basic API\n\n- import RPi.GPIO\
    \ as GPIO\n- GPIO.setmode(BCM or BOARD)\n  - GPIO.BCM : Pin Number Broadcom defined\n\
    \  - GPIO.BOARD : Raspberry Pi board number\n- GPIO.setup(channel, direction)\n\
    \  - channel : Pin number\n  - direction : GPIO.IN, GPIO.OUT\n  - state : GPIO.HIGH,\
    \ GPIO.LOW\n  - GPIO.setup(channel, pull_up_down=GPIO.PULL_UP)\n  - GPIO.PULL_UP,\
    \ GPIO.PULL_DOWN\n- GPIO.input(channel)\n- GPIO.output(channel, state)\n- GPIO.cleanup()\n\
    \  - Release Resource before exiting\n\nhttps://sourceforge.net/raspberry-gpio-python/wiki/Examples/\n\
    \n## Rpi.GPIO - gpio_python.py\n\n```python\nimport RPi.GPIO as GPIO\nimport time\n\
    \nled_pin = 18\n\ntry:\n    GPIO.setmode(GPIO.BCM)\n    GPIO.setup(led_pin, GPIO.OUT)\n\
    \n    while True:\n        GPIO.output(led_pin, True)\n        time.sleep(0.5)\n\
    \        GPIO.output(led_pin, False)\n        time.sleep(0.5)\nfinally:\n    print('cleaning\
    \ up')\n    GPIO.cleanup()\n```\n\n![](img/da7333aa1bca2c3a48277910fdbdf1f5_248_0.png)\n\
    \n## Python GPIO Modules\n\n- WiringPi-Python\n  - https://github.com/WiringPi/WiringPi-Python\n\
    \  - wrapper of WiringPi written in C\n  - Arduino style Code\n  - Support all\
    \ H/W functions as GPIO, Serial, SPI, I2C, Hardware PWM\n  - WiringPi dependency\n\
    \  - WiringPi build/install required\n  - Installation\n    - sudo pip3 install\
    \ wiringpi\n    - cd ~\n    - git clone --recursive https://github.com/WiringPi/WiringPi-Python.git\n\
    \    - sudo apt-get install python-dev python-setuptools swig\n    - cd WiringPi-Python\n\
    \    - ./build.sh\n\n## Python WiringPi-Python – gpio_wiringpi.py\n\n```python\n\
    import wiringpi\nimport time\n\npin = 18\nwiringpi.wiringPiGpio()\nwiringpi.pinMode(pin,\
    \ wiringpi.OUTPUT)\n\nfor i in range(0, 5):\n    wiringpi.digitalWrite(pin, True)\n\
    \    print('pin %s ON'%pin)\n    time.sleep(1)\n    wiringpi.digitalWrite(pin,\
    \ False)\n    print('pin %s Off'%pin)\n    time.sleep(1)\n```\n\n```\n$ sudo python\
    \ gpio_wiringpi.py\n```\n\n## NodeJS GPIO Modules\n\n### Finding Good module\n\
    - https://www.npmjs.com/\n- http://node-modules.com/\n- http://nodejsmodules.org/\n\
    - http://npmsearch.com/\n\n### Major Modules\n- onoff\n- Johnny-Five\n- WiringPi-Node\n\
    \n### Minor or No more maintained\n- gpio\n- rpi-gpio\n- pigpio\n- rpio\n- mmm-gpio\n\
    - pi-gpio\n\n## NodeJS GPIO Modules\n\n- onoff\n- https://github.com/fivdi/onoff\n\
    - most popular\n- Synchronous, Asynchronous function\n- Linux Sysfs is used internally\n\
    - epoll is used to interrupt mode, callback\n\n![](img/da7333aa1bca2c3a48277910fdbdf1f5_250_0.png)\n\
    \n- Install\n- npm install onoff\n\n- Basic API\n- var Gpio = require('onoff').Gpio\n\
    - Gpio(gpio, direction)\n- read(callback), readSync()\n- write(value, callback),\
    \ writeSync(value)\n- watch(callback), unwatch(callback), unwatchAll()\n- direction(),\
    \ getDirection(direction)\n- unexport()\n\n## NodeJs onoff module - gpio_onoff.js\n\
    \n```javascript\nvar onoff = require('onoff');\nvar led = new onoff.Gpio(18, 'out');\n\
    \nvar sw = 1;\nvar cnt = 0;\nvar timer = setInterval(function(){\n  led.writeSync(Number(sw));\n\
    \  console.log(sw?'on':'off');\n  sw = !sw;\n  if(cnt++ > 10){\n    clearInterval(timer);\n\
    \  }\n}, 500);\n\nprocess.on('SIGINT', function () {\n  led.unexport();\n  console.log('cleaned\
    \ up.');\n});\n```\n\n```\n$ node gpio_onoff.js\n```\n\n## NodeJS GPIO Modules\n\
    \n- Johnny-Five\n  - [http://johnny-five.io/](http://johnny-five.io/)\n  - JavaScript\
