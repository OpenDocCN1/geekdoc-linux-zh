    \ | BCM2835 | BCM2837 | BCM2835 |\n| 内存 | 256MB | 512MB | 1GB | 512MB | 1GB |\
    \ 512MB |\n| 网络 | 无/A | 以太网 10/100 | 以太网 10/100 | 无/A | 以太网 10/100 无局网 2.4GHz\
