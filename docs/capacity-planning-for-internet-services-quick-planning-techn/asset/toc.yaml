  - 术语表 (Glossary)
- - '##'
  - CMIP 一种基于 OSI 的可扩展网络协议，用于简单网络管理 (SNMP) 功能不足的场景。
- - '##'
  - 通用信息模型
- - '##'
  - CoS 参见服务类别 (classes of service)。
- - '##'
  - 跨系统耦合设施 (XCF) 一种负载管理器 (WLM) 组件，用于 Sysplex 节点之间通信策略、指标和数据。
- - '##'
  - 客户控制系统
- - '##'
  - DDI_ATTACH 由动态重构或 DR（from dr_driver）使用的函数，它提供了附加特定驱动程序的能力，而不影响服务单独设备的实例。
- - '##'
  - DDI_DETACH 由动态重构或 DR（from dr_driver）使用的函数，它提供了分离特定驱动程序的能力，而不影响服务单独设备的实例。
- - '##'
  - DDI/DKI 设备驱动程序/内核接口。这些是驱动程序应该实现的函数入口点，以完全支持动态重构 (DR)。DDI/DKI 在驱动程序开发者站点 1.0 AnswerBook
    (http://docs.sun.com/) 的“编写设备驱动程序”章节中列出。
- - '##'
  - DDI_RESUME 由动态重构或 DR（from dr_driver）使用的函数，它提供了分离内核笼 (OpenBoot PROM)、内核和不可分页内存的板卡的能力。只有在整个系统域的所有驱动程序或
    DSD（而不正在卸载的板卡）都静默后，才能移动内核笼，以保证内核迁移的数据完整性。DDI_RESUME 在静默期后恢复驱动程序。
- - '##'
  - DDI_SUSPEND 由动态重构或 DR（from dr_driver）使用的函数，它提供了分离内核笼 (OpenBoot PROM)、内核和不可分页内存的板卡的能力。只有在整个动态系统域的所有驱动程序或
    DSD（而不正在卸载的板卡）都静默后，才能保证内核缓存的数据完整性。DDI_SUSPEND 挂起数据以开始静默期。
- - '##'
  - DR detach 通过动态重构 (DR) 机制将系统板从 Solaris 操作系统 (OE) 控制移除的过程。
- - '##'
  - Gigaplane-XB Starfire 上的互连通过对点数据路由器提供内存访问，该路由器隔离了系统板之间的流量，并在禁用交织时最小化了任何性能下降。
- - '##'
  - FlowAnalyzer (NetFlow) 一个使用 FlowCollector 输出的应用程序。它提供详细的处理、图表绘制和报告
- - '##'
  - FlowCollector (NetFlow) 一个或多个 NetFlow 设备的 NetFlow 数据报消费者。这些设备仅指向运行 FlowCollector
    的主机和端口号。FlowCollector 聚合这些数据。
