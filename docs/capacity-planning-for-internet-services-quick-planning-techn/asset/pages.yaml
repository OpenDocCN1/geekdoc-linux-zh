    to perform basic monitoring operations that are useful for operations management.
    The screenshots in these examples are taken from SunMC 2.1.1, which is a minor
    update to Sun Enterprise Symon 2.0 software with a new name and more features.


    # # The SunMC Health Monitor


    SunMC includes a system health monitoring module that can be used by operations
    to simply see if a system has enough resources to run comfortably. For example,
    if CPU state is reported as *red*, then either work or more CPU power may be needed
    on that system. Similarly, if a memory rule reports *red*, then the system may
    need more memory.


    The SunMC health monitor is based on a set of complex rule objects. The health
    monitor is not enabled by default when SunMC is first installed because only the
    basic modules are loaded into those implemented by Adrian Cockcock in the SE Toolkit
    script *virtual_adrian.se* and described by him in *Sun Performance and Tuning:
    Java and the Internet*.


    A simple rule can be placed on any single SunMC metric to monitor its value. Additional
    rule objects implement more complex rules that refer to several metrics or perform
    advanced processing on the data.'
