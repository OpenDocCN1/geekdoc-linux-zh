  md: '# Phases of Performance Management


    Performance management can be applied in an iterative, cyclic, four-phase approach
    (see FIGURE 2-1).


    ![](img/7613e130542edcd7529aeccf7bedcadc_27_0.png)


    **FIGURE 2-1** Four-Phase Approach to Performance Management


    The output of each phase is used as input to the following phase. Each phase must
    reach a steady state in which the results can be published and transferred to
    the following phase. Once the four phases are locked in place and all results
    have been verified, those results are fed into the next generation of phases.
    The next section discuss each phase in detail.


    A relatively simple change and configuration management process integrated into
    the performance management deliverables can greatly improve the efficiency and
    accuracy of performance management. This change management can be as simple as
    generating and maintaining revision numbers for the documentation and reports
    that are produced.


    Historical revisions should be retained for future examination and change analysis.
    These revisions also provide a history of changes to the data analyzed and the
    resulting conclusions. This compilation of historic data and conclusions can help
    reduce repetition of effort and acts as a guide that displays the impacts (both
    positive and negative) of past load planning and capacity planning.'
  merge: -1
