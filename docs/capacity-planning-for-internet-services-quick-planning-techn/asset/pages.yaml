  md: '# The SunReady™ Approach


    The FCAPS framework was originally generated from the ITIL. The Sun Professional
    Services (SunPS) team has developed a project methodology for applying the FCAPS
    framework. This methodology creates a unified extended framework for ITIL operations.
    Using the ITIL as a guideline for best practices in mission-critical environments,
    the SunPS team created sets of big rules for implementation. These rules weigh
    the criticality of each task required to deliver the service levels promised by
    the customer IT department to the end-users of the specified services.


    By creating this multilevel approach to each IT service, the SunPS team can establish
    a scoring model to predict the ability of the current IT infrastructure to satisfy
    the requirements of the end-user service level objectives. This IT capability
    analysis can then be used to develop a high-level architecture for the IT infrastructure.
    This new, well-planned architecture can supplement the current established IT
    operations before the end-user service is placed into production. Hence, the high-level
    architecture is optimally created before the pilot phase of the application development
    life cycle.


    The implementation of supplemental service capabilities shadows the application
    development life cycle from the architecture phase to the pilot, development,
    integration, deployment, and sustaining phases. The IT service capabilities can
    then be tested and assessed simultaneously with the application/function, stress,
    crash, and disaster recovery test cycles. In addition, the IT service capabilities
    can then be promoted into the live production environment in parallel with the
    new end-user application environment.


    Attaching the IT infrastructure development life cycle to the application development
    life cycle identifies the dependencies between organizations and resources. In
    addition, this process documents the information flow necessary to establish unified
    timelines for tasks and deliverables for project management. This ensures that
    the underlying IT services required by the end-user service level objectives are
    in place before end-users are introduced to the production environment.


    # Monitoring and Management


    Service level management is the key to maintaining the production environment.
    By establishing the rules of engagement, the capabilities necessary to support
    the service level objectives, and the implementations of tools in the production
    environment, the entire production infrastructure can be monitored and measured.
    Violations of the scope defined in the SLAs and measured exceptions to the agreed-upon
    performance and management criteria can be addressed and resolved quickly, minimizing
    the impact on the business.


    Monitoring and Management 21'
