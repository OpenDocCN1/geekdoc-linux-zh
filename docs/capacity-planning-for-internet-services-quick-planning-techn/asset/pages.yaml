    ![](img/7613e130542edcd7529aeccf7bedcadc_77_0.png)


    **FIGURE 4-5** Daily Workload Variations Example


    The important data is the prime time daily peak level. If the prime time is plotted
    after day, then a pattern like the factors shown in TABLE 4-1 will emerge.


    From the detailed information shown in FIGURE 4-5, all you really need the typical
    daily peak level. The peak is most important, because guaranteed good performance
