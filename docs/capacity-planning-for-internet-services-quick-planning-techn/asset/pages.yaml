  md: '# Operations Viewpoint Implementations Summary


    Operations monitoring concentrates on real-time, alert-based problem diagnosis.
    It can be implemented with a variety of tools and displays along the lines described
    above. Its requirements are quite different from those of capacity planners and
    management reports, although it feeds information to both of them.


    # Management Viewpoint Implementation


    In this section, we describe a weekly report for management. It is constrained
    to a single sheet of paper and provides “at a glance” status information for future
    scenarios, as well as an overview of the previous week. The report must be customized
    to your own situation, so we describe the construction and reasoning behind the
    report in detail.


    For this discussion, managers are assumed to have the following characteristics:


    +   - They assign resources that can affect project schedules.


    +   - They approve capital equipment purchases.


    +   - They have a short attention span for technical issues, but need to be able
    to summarize any externally visible problems to analysts and investors.


    +   - They like to be informed about what is happening, but it is more important
    to tell them when they need to take action on and what options they have.


    +   - They are seemingly incapable of turning over a piece of paper or scrolling
    down a Web page to look through a whole report.


    +   - They are quite likely to glance at a single sheet of colorful paper, especially
    if it has lots of red on it.'
  merge: -1
  pgno: 156
- img_proc: true
  md: 'The example report shown in FIGURE 6-15 is customized for use by a large Internet
    e-commerce site where the primary bottleneck is a large back-end database server.
    For many consumer-oriented sites, Monday has the highest load of the week, so
    the report is designed to be delivered each Tuesday. It covers from Monday of
    the previous week to the Monday before the report and predicts whether there is
    enough site capacity to survive the load expected for the following Monday. The
    report is in four sections:


    +   1. A short text summary of issues and noteworthy events


    +   2. A colored table showing the status of future scenarios


    +   3. A colored table showing the daily status over the last week and a chart
    showing the level of activity over the last week


    +   4. An excerpt from an external site testing service, such as Keynote, that
    measures site availability and performance'
