    retail markets are being challenged by the new access model that includes direct
    interaction between the corporate IT systems and the customer, with competition
    just a click away.


    The dot-com startup Internet business has a related challenge. While their business
    relies on exponential growth for survival in the highly competitive Internet business
    environment, they often lack the datacenter policies, procedures, and experience
    to manage a datacenter production environment through the growth that some successful
    Internet businesses have displayed in recent years. By learning from the cumulative
    experience of their more radical traditional predecessors, the dot-com companies
    can implement best practices for the production environment architecture, while
    retaining the flexibility necessary to thrive in the expanding market.


