  md: '# Applying ITIL


    The Central Computing and Telecommunication Agency (CCTA) of the UK began publishing
    volumes of their established best practices for IT operations in 1978. The 24
    volumes, titled Information Technology Infrastructure Library (ITIL), describe
    the CCTA''s operational procedures and discuss their application and logistics
    in a production datacenter environment.


    The ITIL has evolved over the years, being studied, adopted, and adapted by many
    IT organizations and vendors of management tools. The Examination Institute of
    the Netherlands (EXIN) has established certification programs granting foundation,
    practitioner, and master levels of expertise to the categories of service support,
    service delivery, and IT management.


    One key benefit of ITIL is that it has helped identify the interdependencies inherent
    in IT management organizations. The following is an example of the interdependencies
    within a backup process:


    +   1. Backups must first be scheduled through the batch job scheduling system.

    2. The status and any errors of the backup must be reported through the enterprise
    monitoring and management system.

    3. The monitoring and management system must transfer the status and any errors
    of the backup to the service desk.

    4. The service desk must notify the technology owner or system administrator of
    the status and any errors.


    With a properly organized IT framework and extended framework, these interdependencies
    and process flows can be documented. In addition, the procedures for implementation
    and operation can be integrated into the documentation describing the service.


    The ITIL establishes policies, not implementations. It remains independent of
    operating system, hardware platform, and application, but can be used as a guideline
    for creating the “big rules” to be used in the ITHF. The ITEF can be implemented
    according to service levels, operating system, hardware, and application capabilities.


    Use the following resources to provide the knowledge necessary for implementation
    of the established policies in the ITEF:


    +   * Sun Blueprints program

    * Collective experience of the IT staff

    * Technical publications and conferences

    * Sun Education Services

    * Sun Professional Services'
