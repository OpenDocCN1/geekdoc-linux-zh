  md: 'Two years of example data are shown in FIGURE 4-7, starting with January. The
    pattern depends on external events as well as the nature of the business. It must
    be determined and calibrated against business metrics, but other factors first
    be taken into account. This is shown in the next few charts, which together form
    a month-by-month predicted load level.


    # Geometric Exponential Growth


    The growth of the Internet combined with a growth in awareness of your site may
    cause a geometric exponential growth in load levels. This can be easily expressed
    in two numbers as a growth factor over time period. For example, growth might
    be expressed as 50% per quarter, or doubling in a year.


    Note - The type of growth described here is mathematically referred to as geometric
    growth. However, because it is usually (somewhat incorrectly) referred to as exponential
    growth, it is referred to as geometric exponential growth here to avoid confusion.


    A spreadsheet computes the growth factor and monthly factors for the months with
    a growth rate and duration provided by a user. The computation is based on the
    following formula:


    ```

    $L_t = L_0(G + 1)^{t-t_0}$

    ```


    In this case, $t$ is the time (in whatever units you are using); $L_t$ is the
    load at time $t$; $L_0$ is the baseline load value at time $t_0$ and $G$ is the
    growth per time unit. If capacity planners have measured the growth over a given
    period (and can safely assume the growth is geometric), they can extrapolate the
    growth rate ($G$) at a given time.


    For instance, TABLE 4-3 shows a month-by-month growth that extrapolates from a
    growth of 1.5 times in 3 months. Using the known growth of 1.5 times in 3 months,
    the $G$ can be solved for and substituted into the original formula. Since the
    values of $G$ and $L_0$ are known and can be substituted into the load at a given
    time ($L_t$) is computed based only on the time ($t - t_0$). The value $t_0$ is
    zero if $t$ is measured in relation to it. In the following table, the values
    used are $G = .22$ and $L_0 = 1$, which makes the following formula:


    ```

    $L_t = 1^t$

    ```


    This formula is provided in a capacity planning spreadsheet to generate the values
    presented in the following sections. This spreadsheet is available at http://www.sun.com/blueprints/tools
    and has all of the appropriate formulas in place—you only have to enter the growth
    over a given period.'
