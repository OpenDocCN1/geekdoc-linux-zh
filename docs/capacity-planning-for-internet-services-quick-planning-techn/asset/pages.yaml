  md: '# Glossary


    access control list (ACL) A file that specifies which users can access a particular
    resource, such as a file system.


    accounting Keeping track of resource usage on a machine. The Solaris Resource
    Manager (SRM) software provides accounting features.


    ACL See access control list.


    administration tool A graphical user interface (GUI) tool for configuring the
    Solaris Bandwidth Manager (SBM) software


    administrative domain A collection of network elements under the same administrative
    control and grouped together for administrative purposes.


    ADOP See automatic degree of parallelism.


    alarm The means by which notification is sent when an exception occurs.


    alternate pathing (AP) A software mechanism that works in conjunction with dynamic
    reconfiguration (DR) to provide redundant disk and network controllers to sustain
    their respective physical links. The main purpose of AP is to sustain continuous
    network and disk I/O when system boards are detached from a machine or dynamic
    system domain, or DSD (in the case of the Starfire) that is running a live copy
    of the Solaris operating environment (OE).


    AP See alternate pathing.


    application resource measurement (ARM) A means of measuring the end-to-end response
    time of a system.


    ARM See application resource measurement.


    ASE Sybase Adaptive Server Enterprise.


    attaching See DR (dynamic reconfiguration) attach.'
  merge: -1
  pgno: 216
- img_proc: true
  md: 'automatic degree of parallelism


    (ADOP) A feature of the Oracle Database Resource Manager optimize system utilization
    by automatically adjusting the degree of parallelism for parallel query operations.


    backfilling


    The execution of a job that is short enough to fit into the time slot during which
    the processors are reserved, allowing for more efficient use of the available
    resources. Short jobs are said to backfill processors reserved for large


    BBSRAM


    Boot bus random access memory.


    blacklist


    A file that enables you to specify components, such as system boards, that should
    not be configured into the system. The blacklist file is read and processed at
    startup.


    BMC Best/1


    BMC Software''s Best/1 products provide tools to address performance management
    requirements across OS/390, Parallel Sysplex, SAP R/3, Windows NT, VM, and AS/400
    environments.


    CBQ


    See class based queuing.


    CCMS


    A tool that provides information to SAP R/3, allowing it to measure the performance
    of key user transactions and the response time of the back-end database for applications.


    CICS


    See customer information control system.


    CIM


    See common information model.


    class-based queuing


    (CBQ) The underlying queuing technology used in the Solaris Bandwidth Manager
    (SBM) software.


    classes of service


    (CoS) A feature supported by the Solaris Bandwidth Manager (SBM) software that
    allows network traffic to be organized so that urgent traffic gets priority over
    less important traffic.


    classifier


    A component of the Solaris Bandwidth Manager (SBM) software that allocates packets
    to a class queue. When a packet arrives, the classifier analyzes the packet protocol,
    its type of service (ToS) value, URL information, and destination information
    and allocates the packet to a class queue where it waits to be processed.


    CLI


    command-line interface, as opposed to graphical user interface (GUI).


    cluster


    A collection of computers interconnected via a high-speed interface that allows
    the environment to behave as a single unified computing resource.


    clustered cache


    A method of caching Web pages where multiple servers use the intercache protocol
    (ICP) to talk among themselves and form an explicit hierarchy of siblings and
    parents. If the load would overwhelm a single server or high


    196 Capacity Planning for Internet Services'
