    # Sun Configuration & Service Tracker


    Configuration & Service Tracker (CST) is an online tracking utility that continuously
    tracks configuration changes of the system on which it is running. CST can be
    obtained for free from http://access.sun.com/Products/solaris/cst/. The tracked
    information is presented in a user-friendly format through a browser-enabled Java
    applet.


    CST fills an important hole in the overall strategy of proactive system management
    at a customer site. It provides a macroscopic view of the system configuration
    changes by failures or upgrades and service patterns over extended periods. CST
    performs these beneficial tasks:


    +   * Reviews configuration consistency at shipping installation and at other
    times

    * Detects incompatible upgrades

    * Gets replaceable unit (FRU) information from a remote environment

    * Computes and tracks system availability statistics


    CST adopts a three-tier paradigm that includes middleware, a presentation client,
    and an agent that resides on each system being tracked. The data collected by
    the agent is managed by the middleware server, which enables clients to access
    it with a Web browser. The client is implemented as a Java applet.


    The agent automatically detects events that potentially involve configuration
    changes. Examples of such events are:


    +   * Boot/reboot, system down, panic

    * Install/uninstall/unattach software packages/patches (not available in CST1.0.)

    * Dynamic attack/unattach

    * Environmental changes detected through system interfaces (not available in CST1.0)


    The agent also provides a facility for maintaining an electronic log of service
    events. For each event, the agent creates a snapshot of the system configuration
    and determines the changes since the previous snapshot. It then catalogs the event
    and changes in a change log file. It also maintains the current snapshot configuration
    of the system in a configuration file. Both these files—the change log file and
    configuration file—are maintained in a specific format to permit postprocess extraction
    of information. CST also notifies the user of each event it detects.'
  merge: -1
  pgno: 171
- img_proc: true
  md: 'In an enterprise environment, a middleware server daemon receives updates from
    the various CST agents in the enterprise. It stores them in a central repository.
    This facilitates manipulation and viewing of data, even if the host is temporarily
    inaccessible. The server supports an API (application programming interface) that
    enables users to invoke a Java applet on Web browser so they can view the configuration
    report and change log for any host on the network. The user interface also permits
    users to enter service comments to complement each service event. In addition
    to viewing the configuration or system changes, CST also permits users to print
    the data or send it by email.


    # BMC Patrol and Best/1


    BMC sold the Patrol application management framework for many years and recently
    bought BGS and the Best/1 product line.


    # BMC Best/1


    BGS was a well-established company that built only performance tools. It pioneered
    the use of performance modelling, starting off on mainframes over 20 years ago,
    and launching a UNIX-based product in 1993. There are two sides to the Best/1
    product: a real-time performance monitor that covers the same ground as many other
    products, and a performance analysis and prediction tool that is the market leader
    at the high end. The Best/1 is rapidly adding functionality to a range of tools
    for the mainframe, minicomputer (VAX and AS/400), UNIX (most vendors), and PC
    (NT and OS/2) platforms. BMC''s breadth of coverage puts their products into a
    market category where large corporations standardize on a vendor and install tools
    right across the enterprise. The downside of this functionality is that the entry-level
    cost is at the high end of the scale, both financially and in the time and training
    required to use a modelling effectively.


    This tool can be used in a production environment to monitor systems, but it also
    can be used to set up and automate the entire process of generating regular reports
    that include the modelling of alternative future scenarios.


    Best/1 has a function-based GUI that works well, but is not easy to use. The initial
    configuration of the tool can be daunting. BMC is working to simplify the configuration;
    in large installations, training and consultancy support alleviate this problem.
    Best/1 for UNIX exports data into a PC-based Visualizer database. This database
    also pulls data from all other types of systems for which BMC has tools. For UNIX-oriented
    users, it is annoying to have to switch between systems to view all the data.
    Visualizer can automatically generate reports that are viewable from a Web browser.'
  merge: -1
  pgno: 172
- img_proc: true
  md: 'Visualizer is one of the few tools that can analyze trend data in terms of
    cyclic fluctuations. It implements multivariate adaptive statistical filtering
    (MASF) which is a sophisticated and automated approach to the problems discussed
    in Chapter 4, "Scenario Planning."


    In summary, if you have experience in the way capacity planning is done in the
    mainframe world and want to merge this knowledge with UNIX-based systems and database
    performance monitoring, this tool does the job. If you are coming from a typical
    UNIX system administrator background or are looking for low-priced monitoring
    tools, you may not be able to justify the investment needed to fully utilize this
    product.


    # BMC Patrol


    Patrol is a distributed application management system. Performance management
    is only part of the problem to be solved; keeping applications up and running
    collecting application-specific measurements are also important roles for Patrol.
    The product has a good underlying architecture that scales well in large, distributed
    installations with multiple data storage points and management consoles.


    Like SunMC and Best/1, BMC monitors by evaluating rules in a local agent on each
    node. Patrol''s rules are more complex, and its predefined knowledge modules understand
    how to manage everything from an Oracle finances database to a Netscape Web server.


    Patrol has been criticized for imposing a larger load on the system being managed
    by other tools. Their original data collection strategy was to run a standard
    system utility, such as vmsat, and parse the output—a strategy that is less efficient
    than reading the kernel directly. More recently, Patrol and Best/1 have been merged
    to use the same highly efficient data collector. Patrol data can be viewed with
    a Web browser, and Patrol integrates closely with many network and system management
    tools. Patrol does not include trending and prediction tools; however, future
    releases of Patrol and Best/1 will become more integrated to provide the best
    of both products.


    BMC is at www.bmc.com.


    # Foglight Software (RAPS)


    Foglight Software was initially known as Resolute Software and more recently has
    become a division of Quest Software. It competes in the application management
    space with BMC Patrol. RAPS uses very efficient data collectors and has an advanced
    distributed storage architecture and a good GUI Rich Pett, who built the first
    SE toolkit while he was at Sun, is now the Chief Performance Architect for RAPS.
    The rule set that RAPS uses is based on a superset of the


    152 Chapter 7 Tools Overview and Evaluations'
