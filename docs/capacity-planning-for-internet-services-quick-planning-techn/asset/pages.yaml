- img_proc: true
  md: 'In the old days, if the device driver sent a request to the disk, the disk
    would do nothing until it completed the request. The time it took was the service
    time, and the average service time was a property of the device itself. Disks
    that spin faster seek faster lower (better) service times. With today''s systems,
    the device driver issues a request, that is queued internally by the RAID controller
    and the disk drive and several more requests can be sent before the first one
    comes back. The service time, as measured by the device driver, varies according
    to the load and queue length, is not directly comparable to the old-style service
    time of a simple disk drive. The response time is defined as the total waiting
    time in the queue plus the service time. Unfortunately, i reports response time
    but svc_t. We''ll see later how to calculate the actual service time for a simple
    disk.


    Consider the utilization of the device. As soon as the device has one request
    in its internal queue, it becomes busy, and the proportion of the time that it
    is busy is its utilization. If there is always a request waiting, the device is
    busy. Since a single disk only completes one I/O request at a time, it saturates
    at 100% busy. If the device has a large number of requests and is intelligent
    enough to reorder them, it may reduce the average service time and increase the
    throughput as more load is applied, even though it is already at 100% utilization.'
