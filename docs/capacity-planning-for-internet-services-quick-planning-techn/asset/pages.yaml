- img_proc: true
  md: 'For a sustained level of 12,000 catalog lookup queries per hour, CPU utilization
    was measured as 62% busy and disk utilization was measured as 22% busy.


    Fortunately, common system reporting utilities report percent utilization, but
    it is still useful to understand the underlying computations.


    # SCPM Measurement


    In the SCPM process, a unit of work is called quanta (Q). Systems that contain
    potential for doing work are represented by (M), which is a multiple of a quanta.
    The amount of work being done on a machine is the quanta consumed (QC), or measured
    system utilization multiplied by (M). FIGURE 5-6 is an example of the SCPM process.


    ```

    heisenberg sar -s 08:00 -e 16:00 -i 3600 -f /var/adm/sa/sa27

    SunOS heisenberg 5.8 sun4u          03/27/00

    08:00:00  usr  %sys  %wio  idle

    09:00:00   24     9       0      66

    10:00:00   34     13       0      53

    11:00:00   34     12       0      54

    12:00:00   21      9       0      70

    13:00:00   52     21       0      27

    14:00:00   61     27       0      12

    15:00:00   58     24       0      18

    16:00:00   54     23       0      23

    Average    42     17       0      41

    ```


    FIGURE 5-6 Sample SCPM Process


    This description of the SCPM process has been simplified for this exercise. There
    are many other considerations in performance baselining with the SCPM process,
    but the basic concept behind the process is easy to understand. By measuring workloads
    and their relative disk I/O, CPU, memory, and network consumption, you can predict
    the effective resource consumption of that workload. You can also project resource
    consumption into other SCPM-rated platforms or modify the volumes of work being
    performed within the model.'
  merge: -1
  pgno: 108
- img_proc: true
  md: 'In this example, hourly samples of CPU utilization were extracted from the
    system sar data to represent a shift. The start time is 8:00 a.m., and the end
    time is 5:00 p.m., or 16:00 the hour of the sample. The sample interval is 1600
