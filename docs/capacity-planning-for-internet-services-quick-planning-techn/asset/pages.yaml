    # Cache Performance Impact Factors


    The effect of cache on throughput is hard to model because there is no instrumentation
    to indicate the occurrence of clustering and write cancellation improvements.
    There is also a small overhead of copying data to and from the cache on its way
    to the disk. You should make the pessimistic assumption that throughput is unchanged
    by the cache.


    The primary benefit of cache is fast response time. The benefit can be summarized
    by two cache efficiency factors: $E$ and $H$.


    $E$ is defined as the service speed-up due to cache for reads and writes. $E=1.0$
    is the same as uncached. $E = S_{disk} + S_{cache}$, and we can also assume that
    $E_{read} = E_{write}$ is a close enough approximation to prevent the need to
    calculate reads and writes separately.


    $H$ is defined as the cache hit rate. $H=0.0$ for uncached requests, and $H=1.0$
    (i.e., 100%) for fully cached requests. H$ varies greatly with workload mix and
    intensity changes. It must be calculated separately for reads and writes, since
    $H_{read}$ and $H_{write}$ have very different values.


    # Service Time and Cache Hit Rate


    You can infer the cache hit rate from knowing disk and cache service times.


    The measured service time calculated from iostat data is $S_{measured} = S_{disk}(1-H)
    + H \times S_{disk} + E$;$ that is, the slow proportion of cache misses plus the
    fast proportion of cache hits. We can turn this calculation around, using measurements
    or estimates of the values of $E$ and $S_{disk}$ to get an estimate of the cache
    hit rate:


    $H_{estimated} = (1 - S_{measured}/S_{disk}) + (1 - 1/E)$


    This calculation is sensitive to errors and variations in the values of $S_{disk}$
    and $E$. If the results of the estimate are outside the permissible range of $H$
    (0.0 to 1.0), then you need to make sure that $S_{disk}$ is in particular big
    enough.


    $S_{disk}$ must be the worst-possible-case disk service time.


    $S_{disk} + E$ must be the worst-possible-case cache hit service time.'
