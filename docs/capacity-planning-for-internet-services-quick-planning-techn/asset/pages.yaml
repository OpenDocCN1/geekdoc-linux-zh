  md: '# SunMC Hardware Diagnostic Suite 1.0


    SunMC Hardware Diagnostic Suite 1.0 is a comprehensive, network-aware diagnostics
    tool that enhances overall availability by detecting hardware faults before systems
    are affected and by reducing routine system maintenance through scheduled testing.
    http://www.sun.com/software/managementcenter/hwds/ and is an add-on for SunMC.


    SunMC Hardware Diagnostic Suite enhances system availability by:


    +   - Finding hardware faults before the system is affected

    - Reducing (or eliminating) routine system maintenance time


    SunMC Hardware Diagnostic Suite achieves this goal through three key features:


    +   - Online testing to detect hardware faults

    - Test scheduling to enable latent fault detection

    - Integration with SunMC for unified system management


    # Conduct Online Testing While Applications Are Running


    With online testing, system administrators can quickly diagnose, detect, and isolate
    failing components, reducing downtime caused by hardware failure.


    The SunMC Hardware Diagnostic Suite enables you to run comprehensive, data-safe,
    and non-resource-intensive hardware diagnostics testing in enterprise environments
    while applications are still running. The testing does not corrupt data on the
    system and uses minimal system resources. Types of online testing include:


    +   - Functional diagnostic testing - Covers device functional testing for processors,
    memory, network interfaces, disk drives, communication ports (serial and parallel),
    SPARCstorage Array enclosures, CD-ROM drives, and tape drives.

    - Quick check testing - Provides a quick test to see if devices are currently
    connected to the system.

    - Test scheduling for routine system validation or for immediate hardware health
    checks - Schedules to run periodically in the background. Prepackaged test configurations
    are provided for scheduling to provide convenient system coverage. Scheduled routine
    hardware validation can replace other maintenance that requires system downtime.


    # SunMC Integration


    SunMC modules tie into the SunMC alarm framework so users can execute corrective
    action scripts or programs that eliminate faults.'
  merge: -1
