- img_proc: true
  md: "parameterizes the expected increase in load. The parameters should be expressed\
    \ in a form similar to the justification for the campaign generated by the marketing\
    \ people. These parameters include the duration of the campaign (L); a scale factor\
    \ related to the impact or reach (S); a residual level which is the long-term\
    \ increase in use resulting from this campaign (r); and a delay that sets the\
    \ starting point for the campaign in the model (d).\n\nThe spreadsheet available\
    \ at http://www.sun.com/blueprints/tools uses a formula that estimates the marketing\
    \ reach of a campaign. This formula is appropriate in some circumstances; however,\
    \ other formulas may better represent a marketing impact depending on your environment.\
    \ Most formulas can be easily implemented in a spreadsheet to work with the rest\
    \ of this procedure. The following example provides a brief description of the\
    \ formula the spreadsheet uses for a marketing campaign.\n\n> Because it may be\
    \ difficult to understand the mathematics implemented by the spreadsheet, the\
    \ following formula may be helpful in understanding how the spreadsheet was derived.\
    \ However, it is not necessary to understand this formula to use the spreadsheet\
    \ model.\n\nThe load change ($L_t$) caused by the marketing effects at time t\
    \ is:\n\n```\n$L_t = L_0S^{\\left(\\frac{e^{-L_t t-d}}{(t-d)!}\right)} + r$\n\
    ```"
