  md: 'One important trade-off that must be made is deciding the priority of three
    conflicting ideals: fast, cheap, or safe. Make the decision with care to establish
    a balance. Parameterize each component separately and combine them into an availability
    hierarchy. Rate each component as %fast %+cheap %+safe = 100 to get relative proportions.
    Combine the components into a hierarchy so that high-level views are automatically
    given the combined priority. Combining reliability and availability metrics is
    well understood, but it is also important to at least estimate the relative cost
    and performance implications of the choices made.


    # # Conclusion


    Production environment engineering and performance management may appear to obscure
    forms of art. By studying the collective experiences of the traditional datacenter
    community and applying proven best practices through an organized and well-defined
    methodology of service coverage, the art can be converted into a well-understood
    science, with a predictable quality of results. Creating reusable templates, documents,
    and processes for design, implementation, and integration of datacenter services
    in production environments can result in higher quality of services, lower service
    delivery costs, and less replication of effort. Defining the framework, extended
    framework, reference models, and timelines within them within IT production environments
    can help deliver end-user services with repeatable quality of service. Defining
    these frameworks, models, and timelines determines what actions are necessary
    to keep the modern open-system datacenter as well-organized and well-managed as
    the best of the traditional mainframe predecessors.


    The next chapter provides a methodology for service level management and looks
    at some problems of capacity estimation across multiple platforms.'
