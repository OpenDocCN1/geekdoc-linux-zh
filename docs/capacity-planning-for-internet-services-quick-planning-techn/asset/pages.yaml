    # # Concatenated and Fat Stripe Disks


    FIGURE 5-20 illustrates concatenated and fat stripe disks.


    ![](img/7613e130542edcd7529aeccf7bedcadc_129_0.png)


    **FIGURE 5-20** Concatenated and Fat Stripe Disks Schematic


    When disks are concatenated or the request size is less than the interlace, individu
    requests will only go to one disk. If the workload consists of single-threaded
    requests, then you will only have the same capacity as a single disk, regardless
    of how many disks there are in the stripe. Single-threaded accesses are typical
    for log disks.


    Multithreaded requests can make good use of this disk configuration, as long as
    requests are evenly distributed over concatenated disks or the stripe size is
    not too large. This is a common situation for database tables where small requests
    of 2 to kilobytes are used and it is impractical to attempt to make a stripe interlace
    this


    This configuration has the same service time as one disk, since any one request
    always hits a single disk. It has the throughput of N disks if more than N threads
    a evenly distributed.


    # # Striped Disk Accesses


    FIGURE 5-21 illustrates striped disk accesses.'
