  md: '# Tweaking the Model


    The example spreadsheet used previously has been carefully tweaked to give a capability
    that tracks the load level reasonably well. When you enter your own data and estimates
    into the spreadsheet, you will probably find that you have a very poor fit right
    after the first few months. You will need to spend some time tweaking the parameters
    in the model, trying alternative what-if scenarios until you are happy that your
    assumptions make sense. When manipulating the data, bear in mind that the analysis
    is based on peak loads, not average loads. If you take measurements at intervals
    of a few minutes, they can be averaged; but as soon as you zoom out to considering
    intervals of an hour or more, you want to know the peak level during that hour
    and the peak hour during the day.


    # Predicting Tomorrow


    With all this data and some idea of the typical daily profile, you can predict
    the next few days in detail, then monitor the real load level to see how close
    you get. You can simply combine the weekly and monthly predictions to get an estimate
    of the load over the next week. The monthly data is based on the peak for the
    month, and it could occur at any time during the month; so, you could simply assume
    that the monthly peak could occur on any of the days that coincide with the weekly
    peak. For example, if the weekly peak is a Monday, then the monthly peak could
    occur on any Monday in the month. This gives you a slightly conservative estimate.


    # Fitting the Model to the Data by Tweaking


    For a large Internet site, the daily Web traffic was analyzed to pick out the
    cgi-bin transactions that caused the back-end database to be invoked. These counts
    were further reduced to obtain the busiest day in each month for an 18-month period.
    This set of numbers was then fitted into the spreadsheet-based model, taking into
    account geometric exponential growth, seasonality, and marketing-related variations.


    +   1. Add the measured data to the planning spreadsheet.


    The first step is to make a new graph that shows the measured data and the predicted
    data, including a table showing the proportional difference (the error in the
    fit) between the two.'
  merge: -1
  pgno: 95
- img_proc: true
  md: '2. Tweak the geometric exponential growth.


    Set the workload parameters shown in TABLE 4-3 to get a first approximation of
    the overall long-term growth rate.


    3. Tweak the seasonality.


    Look at the difference factors calculated in the first step. Where two months
    a year apart are out by a similar factor, add that factor to the seasonal load
    variation estimates in TABLE 4-2.


    4. Carry on tweaking.


    Go back and vary the exponential growth factor to try and get the difference to
    match better after year after year, and tweak the seasonality factors until as
    many as possible have a good match. Go around this loop several times.


    5. Set up marketing factors.


    Anything that is not explained by growth and does not repeat from year to year
    is taken care of if it is due to marketing awareness bias. The marketing factors
    can be set up to zero out the difference factors.


    6. Keep tinkering.


    Make sure you don''t have marketing factors that repeat year after year; these
    values should be moved to seasonal.


    7. Predict the next few months.


    Come up with estimates for the next few months, compare the estimates with reality
    as they occur, and refine the model to take new data into account.


    # Summary


    Spreadsheet-based models are a good starting point, but are extremely limited
    and can be clumsy to use and extend. As soon as you want to model more than one
    system or a mixture of several kinds of workloads, the mathematics become too
    complex for a spreadsheet. There are several tools that can handle multiclass
    and multisystem models.


    It is easier to model CPU utilization than disk capacity and performance, but
    large disk subsystems are expensive and may be the primary bottleneck of your
    application. In the next chapter, we introduce a simplified model of disk performance
    that can cope with complex disk subsystems.'
