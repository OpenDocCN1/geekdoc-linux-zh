    # shared resources


    A resource that is not tied to a specific host, but is associated with the entire
    cluster, or a particular subset of hosts within the cluster. Examples of shared
    resources include: floating licenses for software packages, disk space on a file
    server which is mounted by several machines, and the physical network connecting
    hosts.


    # SHR Scheduler


    A component of the Solaris Resource Manager (SRM) that controls CPU resources.
    Users are dynamically allocated CPU time in proportion to the number of shares
    they possess (analogous to shares in a company), and in inverse proportion to
    their recent use. The important feature of the SHR Scheduler is that while it
    manages the scheduling of individual threads, it limits CPU resources between
    users.


    # Simple Network Management Protocol


    (SNMP) An open network protocol used by network management systems that are based
    on TCP/IP.


    # SLA


    See service level agreement.


    # SNIA


    Storage Network Industry Association.'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# SNMP See Simple Network Management Protocol.


    # Solaris Bandwidth Manager


    (SBM) A product from Sun provides the means to manage your network resources to
    provide quality of service (QoS) to network users. It allows network traffic to
    be allocated to separate classes of service (Cos) so that urgent traffic gets
    higher priority than less important traffic. Different Cos can be guaranteed a
    portion of the network bandwidth, leading to more predictable network loads and
    overall system behavior. Service level agreements (SLAs) can be defined and translated
    into SMB software control policies. Tools and application programming interfaces
    (APIs) provide interface for monitoring, billing, and accounting options.


    # Solaris Management Console


    (SMC) An application that provides a generic framework for gathering operating
    system administration tools and interfacing to industry-standard initiatives such
    as the Web-based management initiative (WebM) and the common information model
    (CIM).


    # Solaris Resource Manager


    (SRM) A software tool for enabling resource availability for users, groups, applications.
    The SRM software provides the ability to allocate and control major system resources
    such as CPU, virtual memory, and number of processes. The SRM software is the
    key enabler for server consolidation and increased system resource utilization.


    # Solstice SunNet Manager


    Computer-oriented local and wide area networks are normally managed using Simple
    Network Management Protocol (SNMP), with SunNet Manager or HP OpenView products
    collecting and displaying the data. Both products provide some visibility into
    what is happening in the computer systems, but they are focused on network topology.
    Resource management is done on a per-network basis, by controlling the priority
    of data flows through intelligent routers and switches.


    # SPARCCluster


    A highly integrated product line that is focused on improved availability in commercial
    environments. Its management tools will eventually become an extension to the
    Sun Enterprise SYMON2.0 software. For High-Performance Computing (HPC), Sun servers
    use the platform load sharing facility (LSF) to perform load balancing on larger
    and more loosely coupled clusters.


    SRM See Solaris Resource Manager.


    SRM(IBM) This is this System Resource Manager of the Workload Manager (WLM). The
    term SRM(IBM) is used in this book to differentiate it from Solaris Resource Manager.
    SRM(IBM) provides the algorithms for managing resources and caters to dynamic
    switching between compatibility and modes.


    # Capacity Planning for Internet Services'
  merge: -1
  pgno: 231
- img_proc: true
  md: 'SSP System service processor; Starfire''s system administrator and system monitoring
    interface. The SSP configures the Starfire hardware through a private Ethernet
    link to create domains. The SSP collects hardware logs, provides boot functions,
    and produces consoles for each domain.


    Starfire See Sun Enterprise 10000.


    static resources Host information that does not change over time, such as the
    maximum random access memory (RAM) available to processes running on the host.


    Storage area network (SAN) A complex managed storage system, where networked storage
    Fibre Channel makes up an interconnection between multiple servers or clusters
    and multiple storage subsystems. A SAN can contain switches and routers just like
    local or wide area networks, but the protocol in common use is SCSI over Fibre
    rather than IP over Ethernet. A SAN may also span multiple sites—example, where
    remote mirroring is used for disaster recovery.


    StoreX A technology developed by Sun enables management of any resource in a heterogeneous
    distributed environment, from storage hardware devices and switches, to storage
    software backup solutions and volume managers. For more information about StoreX,
    go to: http://www.sun.com/storage/storex/


    submission host In a typical load sharing facility (LSF) workflow configuration,
    the submission host is the node where the user or operator submits the task to
    be performed.


    Sun Enterprise 10000 A highly scalable 64-processor (UltraSparc II) SMP server
    with up to 64 GB of memory and over 20 TB of disk space.


    un Enterprise SyMON A product developed by Sun to act as a user interface to hardware
    features. It is a powerful and extensible system and network monitoring platform
    that is used to manage other products. Sun Enterprise SyMON 2.0 is a Java-based
    monitor with multiple user consoles that can monitor multiple systems using the
    secure extensions to Simple Network Management Protocol version 2 (SNMPv2) to
    communicate over the network.


    Sun Management Center (SunMC) A product developed by Sun to act as a user interface
    to hardware features (an upgrade from Sun Enterprise SyMON 2.0). It is a powerful
    and extensible system and network monitoring platform that can be used to manage
    other products. SunMC is a Java-based monitor with multiple user consoles that
    can monitor multiple systems using the secure extensions to Simple Network Management
    Protocol 2 (SNMPv2) to communicate over the network.


    SyMC See Sun Management Center.


    SunNet Manager See Solstice SunNet Manager.


    SyMON See Sun Enterprise SyMON 2.0.


    Glossary 211'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# SyMON Health Monitor


    A SyMON module that can be used in a resource management scenario to determine
    if a system has enough resources to run comfortably. For example the CPU state
    is reported as "red," then either less work or more CPU may be needed on that
    system. Similarly, if the memory rule reports "red," then the system may need
    more memory.


    **system level measurements**

    A type of measurement. System level measurements show the basic activity and utilization
    of the memory system and CPUs. Some network measurements such as TCP/IP throughput
    are also available on a per-system level. Per-process activity can be aggregated
    at a per-system level, then combined with network measurements to measure distributed
    applications.


    **Teamquest**nA workload analysis process. For more information, go to www.teamquest.com.


    **time constant**nIn control, the rate at which a system responds to changes.


    **TNF** See trace normal form.


    **ToS**nSee type of service.


    **trace normal form**n(TNF) A format used to implement tracing (which makes it
    possible to trace the execution steps of user and kernel processes). Trace normal,
    which is supported by the Solaris Operating Environment (Solaris OE), provides
    a trace output format. TNF allows data structures to be embedded in the trace
    file without the need for an external definition of their types and contents.


    **type of service**n(ToS) A header field in IP packets. Its purpose is to convey
    information about how the packet should be routed. The Solaris Bandwidth Manager
    (SRM) software can use this information when classifying a packet and can also
    change the information, to influence how the packet is routed.


    **UDB**nDB2 Universal Database.


    **usage decay**nA form of decay used by Solaris Resource Manager (SRM) software.
    The user scheduler is the most important and visible portion of the SRM software
    and implements usage decays which control long-term CPU allocation responsiveness.


    **virtual memory**nA type of memory that is allocated from a central resource
    pool and is consumed by an application when it requests memory from the operating
    system. Virtual memory is not directly related to physical memory usage, because
    virtual memory is not always associated with physical memory. For example, if
    an application requests 16 MB from the operating system, the operating system
    will create 16 MB of memory within that application''s address space, but will
    not allocate physical memory to it until that memory is read from or written to.'
  merge: -1
  pgno: 233
- img_proc: true
  md: 'virtual Web hosting A Web server configuration where a single server is configured
    to respond to hundreds or thousands of Internet addresses. Virtual Web hosting
    is often used in situations where Web sites receive little or no activity most
    of the time. In these situations, it is usually too expensive to dedicate a single
    computer system to each Web site.


    +   WAN See wide area network.


    +   WebM Web-based management initiative.


    +   wide area network (WAN) A network that provides connectivity across a large
    geographical area.


    +   WLM See IBM Workload Manager.


    +   Workload Manager See IBM Workload Manager.


    +   XCF See cross-system coupling facility.'
