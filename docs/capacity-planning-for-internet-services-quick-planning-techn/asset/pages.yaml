- img_proc: true
  md: '# Capacity Planning


    Capacity planning applies the results of the load planning analysis to the system
    baseline and performance reports from the baselining phase. The capacity planning
    phase produces a new system and service configuration architecture to meet the
    requirements established in the load planning phase. The accuracy of the data
    collected in the baselining and load planning phases is directly related to the
    accuracy of the capacity planning model.


    System capacity and resource consumption are modelled, calibrated, and validated
    against the current baseline data. The model compares the relative resource consumptions
    (measured in the performance reports of the baselining phase) to the relative
    performance characteristics of the system architecture (established during the
    configuration inventory of the baselining process). The relationship between resource
    consumption and system architecture capabilities creates the workload characterization
    used to model and predict the effect of changes (deltas) to the measured environment.


    System performance characteristics are established and projected into a model
    of scenarios that include projected workload growth, system architecture and hardware
    changes, and workload resource assignment.


    Once the model has been established as accurate and representative of the measured
    workload characteristics, the model is used to predict the impact of the changes
    introduced in the load planning phase. The operating environment can be adjusted
    as necessary to meet the established performance requirements defined in the SLA
    and KPI.


    Application disk layouts, disk architecture models, CPU speeds, cache sizes, memory
    sizing, and workload mixes can be adjusted and projected in the system model.
    The new workload is projected into the new system environment in an iterative
    process until the system business requirements and performance objectives is found.
    This iterative process produces utilization, latency, and throughput projections
    for the new workload, as well as a system architecture and operating environment
    that meet the planned changes and growth while maintaining a predictable level
    of service to the end-user community.


    # Resource Management


    Resource management defines the controls, shares, quotas, and priorities necessary
    to manage the workload within the implemented production environment. Shares and
    quotas are enforced and monitored for accounting where necessary. In addition,
    system resource accounting provides input for creating the new baseline of performance.
    System resource planning also provides additional calibration'
  merge: -1
