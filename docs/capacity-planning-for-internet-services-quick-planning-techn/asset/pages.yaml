  md: 'FIGURE 5-12 shows how busy disk can operate more efficiently than a lightly
    loaded disk. The difference is that the service time is lower for the busy disk,
    but the response time is longer. This difference is because all the requests are
    present in the queue at the start, so the response time for the last request includes
    waiting for every other request to complete. In the lightly loaded case, each
    request is serviced as it comes, so there is no waiting and response time is the
    same as the service time. When you hear your disk rattling on a desktop system
    as you start an application, it is because the disk is seeking back and forth,
    as shown in the first example of disk activity not taking advantage of I/O queuing.
    Unfortunately, starting an application tends to generate a single thread of page-in
    disk reads and until one is completed, the next one is not issued; so, you end
    up with a fairly busy disk with only one request in the queue and it cannot be
    optimized. If the disk is on a busy server instead, lots of accesses are coming
    in parallel from different transactions and different users, so you will get a
