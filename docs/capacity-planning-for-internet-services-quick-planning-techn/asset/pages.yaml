- img_proc: true
  md: '# Summary


    This chapter highlighted the significance of establishing effective service level
    management and also demonstrated the importance of defining and maintaining service
    level agreement between service providers and users. In addition, best practices
    were offered for inventorying the enterprise and establishing a baseline for business
    services. Finally, this chapter suggested processes for quantifying capacity and
    consolidating workloads and described the impact of capacity estimation using
    industry benchmarks across multiple platforms.


    The next chapter provides a recipe for successful scenario planning and presents
    a methodology for modelling capacity and load.'
