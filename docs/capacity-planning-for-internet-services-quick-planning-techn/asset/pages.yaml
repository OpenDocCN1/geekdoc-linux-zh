  md: '+   - False alarms


    +   - False warnings


    +   - Alarm rule modifications, for example, to prevent false alarms


    +   - Root cause identifications


    +   - Root cause fixed notifications


    +   - No trouble found notifications


    Summarize the problem and analysis counts and types into a daily management report.


    # Implementing with Sun Management Center


    SunMC is used in this example because it is becoming increasingly important as
    a primary platform for the management and monitoring of Sun systems. Many third-party
    tools could be used in this role. The primary advantage of these third-party tools
    is also their primary disadvantage. They are not specific and can manage many
    kinds of systems from several vendors. But because they are not Sun specific they
    do not provide anything comparable to the detailed, platform-specific, active
    management and diagnosis capabilities of SunMC. The following list summarizes
    the options and capabilities of SunMC:


    +   - SunMC has third-party vendor support for managing Windows NT-based systems,
    and relational databases for performing generic system administration functions.
    Functions Contact Halcyon Inc. (www.halcyon.com) for more details.


    +   - Interoperation with CA Unicenter, BMC Patrol, and HP IT Operations (among
    others) allows SunMC to integrate into existing multivivendor environments.


    +   - The recent addition of a software development kit (SDK) allows anyone to
    develop extended agent modules and user interface components.


    +   - SunMC is secure, using public key authentication by default, and allows
    a remote administrator to modify the Sun configuration safely. Administrative
    role definitions and access control lists provide flexible security control.


    +   - Full system configuration information is available through SunMC. This capability
    is not at all to implement, but no other tool could provide anything comparable.
    Both logical and physical views using pictures of components are available. A
    recent addition is support for display and management of the Sun Enterprise 10000
    systems System Service Processor (SSP) and Dynamic System Domains.


    +   - Hardware products and software for the hardware are developed in parallel
    at Sun; many new hardware and software products will use SunMC as their primary
    management console or be launched from SunMC.'
  merge: -1
  pgno: 141
- img_proc: true
  md: '+   - Diagnostic tools such Sun’s Configuration Service Tracker (CST) use SunMC
