- img_proc: true
  md: '# Capacity Estimation


    The four key components of any system can be grouped into CPU, memory, disks,
    and networks. Each of these need to be examined to determine the capacity available
    and the utilization of that capacity. By identifying the primary bottleneck, the
    examination shows where the system can be expected to run out of headroom first.


    Earlier in this book, we assumed that capacity and utilization were easy to obtain
    for bottleneck estimation. In practice, getting those values may actually be more
    complex, so this chapter examines the problems in more detail.


    # Overview


    CPU capacity is quite easy to estimate from numbers obtained with vmstat and sar.
    Sum the user and system time to calculate CPU utilization, leaving the idle and
    wait for I/O time as the remaining headroom. The underlying data is inaccurate
    at low utilization levels. As long as the utilization is above 10% busy, the reported
    utilization is good enough for the purposes of capacity estimation. The Sun Blueprints
    book Resource Management discusses sources of error in more detail in the Measurements
    and Workload Analysis chapters.


    You measure network capacity by using the byte level throughput counters and applying
    some configuration knowledge of what bit rate the interface is running at. These
    counters are not printed by standard system utilities because they are devicedependent.
    The SE toolkit nx. se formats them nicely, or the command netstat -k displays
    the raw data for the hme, qfe, and ge interfaces. The Solaris 8 OE adds the kstat
    command, which obtains and processes these counters more conveniently.


    Memory capacity is difficult to estimate in older Solaris OE releases. The priority_paging
    option improves memory usage characteristics and has been backported to the Solaris
    2.5.1 and 2.6 OE. The priority_paging option is available in the appropriate kernel
    update patch. Solaris 7 OE includes this code as


    +   1. The latest SE toolkit is available at http://www.settoolkit.com.'
  merge: -1
  pgno: 98
- img_proc: true
  md: 'standard, but it must be enabled in /etc/system. Solaris 8 OE all add a new
    option to vmstat to break down the reasons for paging. If executable code is being
    paged out and freed, you have no problem memory; however, if just cache is being
    paged out and freed, Solaris 8 OE changes the memory management subsystem in several
    ways to make paging much simpler to understand. There is no priority paging in
    Solaris 8 OE because a more sophisticated scheme is used by default. You should
    see no page reclaiming, a more free memory value reported by vmstat. Solaris 8
    OE, the free value in vmstat can be used reliably as a measure of how much memory
    is free for new applications to use on a system, so it solves the capacity estimation
    problem.


    Disk capacity estimation has become very complex because of so many different
    types of CPUs with varying scalability characteristics. Consequently, the varying
    characteristics create complicated disk subsystems. The following sections give
    examples of system resource modelling and look at the problem of capacity planning
    for CPU and disk subsystems in detail.


    # System Measurement Frames


    The time period measured for the utilization of system resources is key to accurately
    system resource modelling. By choosing a representative period that accurately
    reflects system usage, you can use the model to project system utilization and
    load planning impacts through the applied system changes.


    A system can be modelled as a whole or broken down into individual services to
    build separate models for different functions. One primary example is an online
    transaction processing (OLTP) order processing system that runs backups nightly
    and has an integrated database report generation system. Separate SLAs might exist
    for system performance during system maintenance tasks, system performance during
    business hours, and the length of time allowed for system maintenance tasks and
    database batch report runs. In this scenario, models should be created showing
    interactive performance inside and outside the allowed maintenance window, as
    well as the "batch load" performance of the backup system and reporting system.


    Resource management schemes, such as processor sets and SRM software, are used
    to control the backup and reporting systems to reduce impact on OLTP. In addition,
    these schemes can be used to reduce the impact of transaction processing to assure
    that backups and reports can be completed in the assigned processing windows.
    At this point in the capacity and performance management cycle, intimate knowledge
    of the business system being modelled is required to prioritize the workload that
    might be competing for system resources. In this simplified example'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'of system utilization (FIGURE 5-1), basic "consumer shift" of customer interaction
    between 8:00 a.m. and 6:00 p.m. and a maintenance task shift between 1:00 a.m.
    and 4:00 a.m. are easily recognized.


    ![](img/7613e130542edcd7529aeccf7bedcadc_100_0.png)


    FIGURE 5-1 Graph of CPU Utilization Over a 24-Hour Sample


    The first step in building a model is to choose an appropriate sample period.
    For consumer shift processing, SLAs are most likely defined for transactional
    volumes and system response time. The sample period should reflect the maximum
    period of time for which degraded system performance is to be tolerated, with
    a critical threshold of maximum degradation to be allowed. In an online processing
    system that has direct interaction with the paying customer of the business, the
    sample period could be as low as one. These samples are used for analysis and
    are averaged over longer time frames for summarized reporting.


    In a batch processing environment such as scheduled report generation and system
    backups, the high system utilization and resulting system OLTP degradation are
    not exposed to the end-user and are actually expected and planned for. System
    batch processing that occurs outside the consumer-exposed processing window would
    fully utilize system resources to shorten the runtime of the batch processes.
    For this reason, SLA-defined thresholds for system utilization and transactional
    processing are not in effect for batch processing windows.


    Overlapping batch processing windows and transactional processing should be avoided
    where possible. Batch reports, database record purging, system backups, and other
    batch system maintenance should be scheduled into time windows'
  merge: -1
  pgno: 100
- img_proc: true
  md: 'isolated from periods of customer interaction. In systems where customer interaction
    is necessary 24 hours a day, 7 days a week, and balanced system resource management
    is required.


    For systems where transaction processing overlaps the maintenance window, more
    complex modelling is required. Capacity management suites such as TeamQuest and
    BMC''s Best/1 are capable of accurately separating the workload processing and
    modelling resource conflicts of multiple workloads competing for resources. By
    basic scripting, simple models using them can be used in conjunction with processor
    sets to monitor shared workload environments to collect and present system resource
    data. In this example (FIGURE 5-2), the batch report generation system is operating
    around the clock, the OLTP system is operating on a peak shift of 8:00 a.m. to
    6:00 p.m., and system maintenance tasks are competing for system resources during
    the system maintenance window of 1:00 a.m. to 4:00 a.m.


    ![](img/7613e130542edcd7529aeccf7bedcadc_101_0.png)


    FIGURE 5-2 Graph of CPU Utilization by Workload


    One immediate change to workload scheduling can be derived from this graph. There
    appear to be batch reports running during the system maintenance window. By moving
    these batch reports outside the defined maintenance window and creating a defined
    shift for reporting tasks (see FIGURE 5-3), we can enforce resource management
    through a published scheduling policy. System utilization is then controlled through
    policy, rather than system enforcement. This simple approach is often the most
    cost-effective (free) at the onset, but can result in underutilized system resources
    when workloads could coexist without contention or with contention minimized through
    the proper use of resource management tools.'
  merge: -1
  pgno: 101
- img_proc: true
  md: 'To illustrate this case, midday reports are allowed between 12:00 p.m. and
    1:00 p.m. for hourly summary tracking of morning transactions; all other report
    generation is assigned to the 6:00 p.m. to 0:00 a.m. window.


    ![](img/7613e130542edcd7529aeccf7bedcadc_102_0.png)


    **Figure 5-3** Graph of CPU Utilization After Load Balancing


    Isolating the different system processing tasks greatly simplifies the implementation
    of monitoring tools and system resource data collection.


    # # Sun Constant Performance Metric (SCPM) Value Capacity Planning


    At Sun, we have been using our own capacity estimation method (developed by Brian
    Wong), which is based on historical mainframe capacity planning methods and has
    been refined through many years of internal and customer engagements. Brian''s
    method is commonly referred to as the "M-value process," after the traditional
    mainframe performance metric. By creating a series of generic terms to define
    work on a computer and creating metrics for a volume of work, it is possible to
    quantify several statistics. These statistics describe the capacity of the machine
    platform, as well as the performance characteristics of a given workload on a
    machine.'
  merge: -1
  pgno: 102
- img_proc: true
  md: 'The basis of this method is a performance metric describing the quantity of
    work that a particular system configuration is capable of processing. This, called
    the Sun constant performance metric (SCPM), represents the relative performance
    of a given server. The metric by which SCPM is scaled is called the quantum (Q).
    SCPMs are adjusted based on measured performance values using predictable benchmarks.
    In addition, SCPMs are a real-world estimation of Amdahls Law applied to system
    architectures and operating systems for cases of regular, predictable, and normal
    workloads. Occasionally, significant patches may influence the scalability of
    an operating system; in case, SCPM values must be adjusted for the relevant platforms.
    The trends in SCPM values across the operating system and patch versions can be
    examined and used when upgrading. Examining these trends can provide guidance
    for predicting the impact that modifications might have on system performance.
    See Appendix A, "Constant Performance Metrics," for a complete list of system
    capacity estimations for Solaris OS versions 2.5, 2.5.1, 2.6, 7, and 8.


    Any metric that relates to your particular application''s performance characteristics
    on a given hardware platform can be used. Examples of possible alternatives include
    Spec, SPCInt, TPC benchmark numbers, and benchmarks from software vendors such
    as SAP, Baan, and Peoplesoft. This method has proven valid, with accuracy dependent
    on the applicability of the chosen comparative metric to your particular workload.


    Rather than using the supplied, somewhat conservative estimations of multiprocessor
    scalability, you can measure the workload projected for parallelization with the
    SCPM values, providing relative performance metrics for CPU and architecture changes.
    Measuring the potential parallelization of your particular workload provides a
    more accurate model of the performance characteristics of your workload, which
    results in more accurate projections of system resource utilization.


    # Amdahl''s Law


    Amdahl''s Law provides the calculations for predicting the benefit of running
    a workload on a scalable multiprocessor environment. We can apply a simplified
    set of calculations based on Amdahl''s Law to project the scalability of our workload.


    The first result of interest is the speed-up factor of your measured workload.
    The speed-up factor is a calculated variable for your workload; it describes the
    capability of your application to work in parallel while taking advantage of additional
    processors. The parallelization is limited by finite resource contention and "serial
    operations" that cannot take advantage of additional processors and could degrade
    workload throughput. Application of Amdahl''s Law measures CPU architectures and
    presumes that there are no bottlenecks in the disk or network subsystems and that
    memory is adequate to process the workload without starvation.'
  merge: -1
  pgno: 103
- img_proc: true
  md: 'The speed-up of a workload is calculated from measurements taken with a chosen
    workload running on one CPU and that same workload running on several CPUs. It
    is best to use a series of measurements of speed-up, using a logical progression
    of CPU counts reflecting the likely upgrade path to your system architecture (1,
    2, 4, 8, 12, 16, ...). Speed-up is calculated using the time taken to accomplish
    a defined set (T) to do the same transactions. The following formula is used for
    a measured time with one CPU and n CPUs:


    ```

    $$Speed-up_{(n)} = \frac{T(1)}{T(n)}$$

    ```


    By applying some simple algebra to this formula and using a fixed time frame for
    measurement, we can calculate speed-up through the throughput of transactions
    with varying quantities of CPUs. The following formula is used for throughput
    in number of transactions (N) of a given workload run over a fixed period of time
    on one CPU and n CPUs:


    ```

    $$Speed-up_{(n)} = \frac{N(n)}{N(1)}$$

    ```


    # Geometric Scalability


    The speed-up factor that is calculated with a single CPU and two CPUs can be used
    to calculate the scalability factor (S) of a given workload. The scalability factor
    is a constant (associated with the measured workload), describing how well the
    workload will operate on a machine containing more of the same type of CPU. The
    following formula demonstrates that the scalability factor represents the percentage
    of the workload that is parallelized, and not the finite resource constrained:


    ```

    $$S = Speed-up_{(2)} - 1$

    ```'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'The scalability of a given machine for a given workload could predicted with
    the scalability factor, and by compounding the scalability for a given number
    of CPUs. The scalability factor may be reduced if there is resource contention.
    Adding CPUs will increase the contention, thereby reducing the percentage gains.
    The following formula is used for a machine with $n$ CPUs, a scalability factor
    of $S$, and measured throughput of $T_{(1)}$ with a single CPU:


    ```

    $T(n) = T(1) + (S \times T(1)) + (S^2 \times T(1)) + \dots + (S^{n-1} \times T(1))$

    ```


    The graph in FIGURE 5-4 shows scalability factors of 100% (linear scalability),
    99.5%, 98%, and 70% for an eight-CPU architecture; in addition, the graph shows
    the relative performance increase of adding CPUs. Lower scalability architecture
    decisions towards wider server architectures, with smaller servers combined to
    provide the end-user service. Higher scalability factors can help influence architecture
    decisions to deeper server architectures, with fewer machines providing the service.


    ![](img/7613e130542edcd7529aeccf7bedcadc_105_0.png)


    FIGURE 5-4 Eight-CPU Geometric Scalability'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'Deeper architectures are generally easier to manage and lower infrastructure
    and support costs. With deeper architectures, a direct relationship is established
    between the scalability of an application architecture and the potential total
    cost of ownership (TCO). With lower scalability factors, the progressively lower
    increase in performance benefit of adding additional CPUs (see FIGURE 5-5) can
    outweigh the potential savings in TCO of managing fewer systems. Larger system
    architectures generally provide more reliability and serviceability features.
    For example, the "N+1" power and cooling subsystems supply enough power and cooling
    capabilities to survive a single component failure, as well as other redundant
    components, redundant data paths, and redundant peripheral adapters. Consequently,
    the N+1 power and cooling subsystems increase the potential system availability.


    ![](img/7613e130542edcd7529aeccf7bedcadc_106_0.png)


    **FIGURE 5-5** 64-CPU Geometric Scalability


    The scalability of any particular software on a particular server might display
    nongemetric scalability characteristics. For most normal workloads that we have
    measured, the variances from the geometric scalability curves are minimal. Factors
    that might cause a significant variance include:


    +   * CPU cache/code efficiency – If the whole of, or a significant portion of,
    the server application’s execution can occur from within the CPU cache without
    preemption or flushing of the CPU cache, the scalability of that application will
    “bump up” when the most frequently accessed pieces of an application can fit within
    the combined CPU caches and across a number of CPUs.'
  merge: -1
  pgno: 106
- img_proc: true
  md: '+   - Limits to application software threading – If the application software
    is incapable of running as multiple instances, or has some static limit to the
    number of server threads utilized to provide the service, additional CPUs will
    not generally add significant increases in throughput or improved response times.

    - Finite resource consumption – If the software consumes a finite set of one or
    more resources, at some point, the contention for resources could actually degrade
    the overall throughput and increase response times. The reason is that many threads
    or instances of a server application could be competing with each other. Examples
    of resource contention areas include locking mechanisms for exclusive access to
    resources, single pipelines for data I/O, and even hardware device and device
    drivers limitations.


    # # Measuring Utilization


    The SCPM capacity planning process applies the basis of the Utilization Law to
    measure how much of a server’s resources are consumed during a sample period.
    The Utilization Law¹ is defined as:


    During a period of time (T), tasks are submitted to the server. The server processes
    the tasks, and the tasks have a finite conclusion. Component resources (CPU time,
    disk I/Os per second) within the server have a finite capacity. Processing consumes
    measurable resources in the server platform. An observer of the server during
    the observed time frame can identify:


    +   - Amount of time during the observed time frame that the server component
    is busy processing tasks (B)

    - Number of tasks completed during the time frame (C)


    These measurements result in the following calculations:


    +   - Output rate or throughput of the server measured in tasks per unit of time

    Throughput = C + T

    - Average service time to complete a computing task:

    Service Time = B + C


    +   - Percentage of the observation period that the server resource component
    in processing tasks, called the utilization of the server:


    Percent Utilization = B + T


    From this application of the Utilization Law, we can state empirical metrics to
    characterize the measured workload as:


    +   1. "Queueing in Networks of Computers," American Scientist 79, 3 (May–June
    1991).'
  merge: -1
