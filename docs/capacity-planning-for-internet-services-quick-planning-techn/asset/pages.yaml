  md: The default statistics for each network interface include only packet and error
    counters and a collision rate. Since most modern networks are switched, collisions
    rarely occur. Additionally, interfaces such as the Sun 100 Mb Ethernet and qfe
    and the Gigabit Ethernet collect many detailed metrics that are not reported by
    the netstat utility. It is important to obtain byte count throughput metrics for
    capacity planning; in addition, there are overflow counters that show when packets
    are being dropped because of an overrun.
  merge: -1
  pgno: 163
- img_proc: true
  md: '+   Volume manager information


    This information should show the throughput for each volume. The Sun Solstice
    DiskSuite product provides these volumes with the normal iostat and kstat mechanisms,
    but some tools do not understand or report the metadiew (md) entries correctly.
    The VxVM requires the vxstat command to be run separately for each disk group
    that is configured on the system.


    +   Web server access logs


    These logs provide a useful source of performance information. Sometimes the log
    can be configured to measure connection times so that response time is measured
    directly. Operation counts for the HTTP protocol and counts of the number of times
    particular cgi-bin scripts are run canfully characterize the workload mix for
    a site.


    +   Detailed CPU activity metrics


    These metrics are only reported by the per-CPU mpstat tool. Particularly, interrupt
    counts (intr), cross-calls (xcal), and mutex stalls (smtx) should be collected.


    The overhead of collecting data from the system utilities such as sar, iostat,
    netstat, mpstat, and vxstat is low as long as the collection interval is set to
    a reasonable level, such as 30 seconds, and data is logged directly to disk files.
    The best organization on disk is to build a collection script that maintains a
    daily directory that contains data files for each tool each hour, for example:


    ```

    /var/adm/data/16-04-2000/10:00_iostat

    ```


    It is easy for data to write to many megabytes per day, so make sure there is
    enough space, and archive at regular intervals.


    # SE Orcollator Logs


    One approach to data collection is to use the SE toolkit to build a custom data
    collector that includes whatever data you like and stores it in any format that
    you find convenient. The best starting point is the orcollator.se script, which
    is in many Sun based Internet sites. This script was developed by Adrian Cockroft''s
    original orcollator script by Blair Zajac while he was working at the GeoCities
    Web site. Blair also developed the Orca Web-based data plotting tool. The disadvantage
    of using the SE toolkit is that it is unsupported free code. You must devote some
    engineering resources to maintaining the SE scripts yourself since you probably
    already have shell scripts that collect performance data, some additional scripts
    may not be a problem.'
  merge: -1
  pgno: 164
- img_proc: true
  md: '# SAS Data Import and Analysis


    SAS (www.sas.com) is a general-purpose statistics package that is widely used
    to analyze and report computer performance data in the mainframe world. It is
    particularly useful as a central place to consolidate data from many other tools.
    Two main add-on packages customize SAS for use as a capacity planning tool: the
    SAS Service Vision (SAS/ITSV) package, which was originally called SAS/CPE; and
    MXG (www.mxg.com) by Barry Merrill. SAS/ITSV has very good graphical and data
    analysis capabilities, but it is tricky to write the data import utilities needed
    to get arbitrary data into the system. If you purchase SAS, it is a good idea
    to purchase some SAS consultancy to build data import scripts for all the data
    to get them into SAS/ITSV format. MXG primarily focuses on mainframe-oriented
    data import and analysis; however, discussions have taken place between Adrian
    Cockcroft and Barry Merrill, and some Sun/Solaris OE data can be imported from
    orchestrator data files to MXG for analysis.


    # Summary


    This chapter concentrated on the requirements for information collection and presentation
    to three different audiences. Some tools were mentioned in passing; the next chapter
    presents a more in-depth survey of useful tools for capacity planning.'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# Tools Overview and Evaluations


    Sun''s own tools are currently focused on system management monitoring and availability.
    Third-party tools include performance databases and trending and modelling capabilities.
    Over time, more of these functions are likely to be integrated into Sun''s product
    line.


    This chapter describes several useful Sun and third-party tools for capacity planning.
    It also offers several ways to balance peak load both within and across systems
    to eliminate underutilization and maximize IT computing resources.


    # Tools and Products for Performance Management


    By combining service definition monitoring and the ongoing task of performance
    monitoring, an IT department can easily begin identifying utilization trends and
    resource restrictions within its networks and servers. Analysis of this information
    may reveal that many systems are underutilized or seriously strained during peak
    loads. Fortunately, there are a number of ways to smoothly balance the load both
    within and across systems to maximize IT computing resources.


    # Server Consolidation


    Server consolidation has become a popular endeavor for IT departments to decrease
    the datacenter space, simplify management, increase reliability, and decrease
    costs. By analyzing the resource requirements of multiple applications on distinct
    servers, you may be able to consolidate those services on fewer machines. By analyzing
    the services that are currently running in the datacenter, you may be able to
    identify the services that would be prime candidates for consolidation.'
  merge: -1
  pgno: 166
- img_proc: true
  md: 'Remember to analyze the service requirements carefully and ensure that the
    system can handle the load of the combined services during the peak hours. Also,
    be on the lookout for batch jobs and reports to make sure that the system can
    handle the requests from multiple competing services. If a defined approval process
    or schedule for starting batch jobs and recording their duration and resource
    usage is not in place, institute one so that service levels can be managed for
    batch and online activity.


    # Domains Dynamic Reconfiguration


    There are occasions when server consolidation is desired, but because of resource
    or application constraints, it may not be desirable to run multiple services on
    a single instance of Solaris OE. More than one version of Solaris OE will need
    to be supported as applications transition to newer releases.


    In these cases, a Sun Enterprise 10000 server domains and DR may be the ideal
    solution. By creating discrete domains within the Sun Enterprise 10000 server,
    each with its own version of Solaris OE, you may be able to consolidate many different
    services into the server. The added benefit of DR enables you to move a system
    board containing memory and CPUs from one domain to another. This feature is ideal
    when one domain needs additional computing power, say, for a large report, and
    another domain has an idle time period and does not need the extra resources.


    # Solaris Resource Manager


    DR in the Sun Enterprise 10000 server provides discrete “hard” partitioning of
    domains, whereas SRM software provides a way to distribute CPU and virtual memory
    to specific applications or users within a single image of Solaris OE. These resource
    allocations act as a form of “soft” partitioning; that is, they carve out resources
    in a single instance of Solaris, whether it is on a single server or a Sun 10000
    server domain.


    This tool can be extremely useful when you combine workload applications on a
    single server. To illustrate how this works, let''s look at the following examples:


    Assume a server is running a database that serves both interactive users and batch
    processing of reports. During the day, 300 users are online and the system is
    at 70% utilization. At night, the department manager runs daily reports and trending
    reports that consume about 85% of the machine’s resources. For reasons unknown,
    the manager decides to run the reports in the middle of the day. The result is
    invariably very poor for the interactive users.'
  merge: -1
  pgno: 167
- img_proc: true
  md: 'At the end of the year, the manager also needs to run the annual reports. Unfortunately,
    business was so good this year that the batch job does not finish during the night;
    so when the users come into work the next morning, the response time is, again,
    very poor. At this point, there are really only two possibilities for the administrator:
    1) suspend the report, or 2) have the users suffer.


    The SRM software enables the administrator to establish resource usage policies
    for the CPU and virtual memory resources, so priorities can be established to
    prevent these problems. By the interactive users being allotted an 80% share of
    the resources during working hours, the users will have a normal day. When they
    all go to lunch or the machine has idle moment, the batch process is allowed to
    use those idle resources, since the CPU constrains the system only when it is
    oversubscribed. When the users come back, the batch job instantly relinquishes
    the CPU for their use. At night, a different rule gives the batch process the
    lion''s share of the resources and constrains the interactive users, giving the
    batch process priority in case users leave some CPU-intensive tasks of their running
    overnight.


    Note that even though a database was used in this example, any application can
    be controlled by the SRM software. This capability is particularly useful when
    user population is "out of control" and can be used to constrain CPU-related denial-of-service
    problems on Web sites. In addition, it can be used to ensure that fee-paying subscribers
    get better service levels than casual or guest users. When multiple sites are
    hosted on a single server, a common problem is that poorly written cgi-bin scripts
    and searches from saturate the server and affect the performance of all the other
    sites. The SRM software be used to give each site its own share, so that no one
    site can dominate the system.


    # Solaris Bandwidth Manager


    In many ways, the Solaris Bandwidth Manager (SBM) software provides the same capability
    for network bandwidth that the SRM software provides for CPUs and virtual memory.
    It allows the administrator to establish controls for the amount of bandwidth
    that applications, users, and departments are allowed to use. The SBM software
    provides the framework for quality of service (QoS) guarantees and SLAs for critical
    networked applications.


    One example of using the SBM software to guarantee compliance with a QoS or SLA
    could be a corporate intranet that provides both Web and fpt data. In instance,
    in the middle of the day, a user decides to ftp every file found on the server.
    The Web users will start experiencing greater latency as the fpt server starts
    sending files. By establishing rules in the SBM software, the administrator can
    guarantee enough bandwidth by throttling the fpt traffic. It is also possible
    to manage according to the destination of the traffic. A server can be dedicated
    to give the best service to a certain class of users that have a specified network
    address. This can be'
  merge: -1
  pgno: 168
- img_proc: true
  md: 'useful in corporate intranets and also to constrain denial-of-service attacks
    on the network without shutting off completely. For example, if a hacker uses
    a large ISP (Internet service provider) to attack your site by flooding with packets,
    you could deny all access from that site fairly easily, but this would upset legitimate
    users. With the SBM software, you can limit the incoming bandwidth from a certain
    ISP to a data rate that you can handle, and work to filter out very specific types
    of packets that are coming from the hacker.


    # # Load Sharing Facility and Codeine


    The load sharing facility (LSF) from Platform Computing Corporation is a tool
    that takes advantage of idle CPU cycles on a network to assist with batch processes.
    This tool is most useful in environments that have intensive technical batch applications,
    like simulations. LSF may be the right way to allow IT departments to meet batch
    requirements in SLA.


    LSF uses a cluster model for implementation. There are three roles to which hosts
    can be assigned within a cluster, and hosts can have more than one role:


    +   - Master host - Maintains information about all other hosts in the cluster
    and the batch queues.

    - Submission host - Accepts requests from users for a batch process.

    - Execution host - Processes the request (or a piece of the request)


    LSF enables users to submit batch jobs and gives the administrator the capability
    to set up rules to prioritize the requests.


    Codeine is a similar product developed by Gridware. In mid-2000, Sun acquired
    Gridware and is integrating Codeine into the Sun product line.


    # # Sun Management Center (SunMC)


    This product is described in more detail in “Implementing with Sun Management
    Center” on page 120. Earlier versions of the product were known as Sun Enterprise
    SyMon software. To obtain more information and to download a version that works
    on a single system, go to http://www.sun.com/software/sunmanagementcenter. An
    additional license is required to manage multiple systems, and SunMC can be used
    to manage hundreds of systems running Solaris 2.5.1, 2, 6, 7, and 8 OEs from a
    single console.'
  merge: -1
