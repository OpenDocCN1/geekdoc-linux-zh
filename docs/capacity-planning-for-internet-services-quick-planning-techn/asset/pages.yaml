  md: '# Creating the Model


    From the recorded baseline and system inventory, we can create a model of system
    performance, as shown in FIGURE 7-1. The workloads defined during the basining
    process can be refined and assigned attributes of batch, interactive, or transactional
    loads. The transaction rates and response times can be adjusted to represent actual
    application measurements if they are known, or can be estimated with relative
    counts adjusted by the resource consumption of the workloads.


    ![](img/7613e130542edcd7529aeccf7bedcadc_176_0.png)


    The throughput adjustment active resource can be any active resource queue name.


    **FIGURE 7-1** TeamQuest Model


    The system being modelled is a database server, with the database instance and
    two middleware applications running on the same system. The “admin” workload contains
    administrative functions, including availability, performance, and application
    measurement and reporting tools. The “OTHER” workload includes all other work
    that is being measured, but is not assigned to a specific workload category.'
  merge: -1
  pgno: 176
- img_proc: true
  md: 'The model can now be adjusted and solved, as shown in FIGURE 7-2, with the
    various system active and passive resources assigned to the workloads for each
    sample period.


    ![](img/7613e130542edcd7529aeccf7bedcadc_177_0.png)


    FIGURE 7-2 TeamQuest Model: Adjust and Solve


    We will solve the model as accurately as possible and extract the results in reports
    window, as shown in FIGURE 7-3. The standard reports produced include several
    interesting statistics for further analysis. The Principal Results report includes
    throughput, response time, population, stretch factor, and passive resource (memory
    or maximum multiprogramming level) resources statistics.


    The Stretch Factor represents the time spent waiting for a resource compared to
    the total time spent processing a transaction or unit of work. A higher stretch
    factor indicates a higher relative quantity of resource wait time. A stretch factor
    of 1.0 indicates that the workload spent not waiting for resources and was running
    at the maximum possible efficiency. Stretch factors greater than 2.0 should be
    analyzed—they indicate a significant resource shortage with processing time equal
    to wait time.'
  merge: -1
