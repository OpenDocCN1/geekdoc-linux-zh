  md: '# Suggested Processes


    In medicine, prevention is almost always more efficient than cure, and it is a
    good idea to optimize your outlay on preventive medicine to help reduce the frequency
    and severity of illness. In the enterprise computing environment, you can accomplish
    a similar purpose by establishing, monitoring, and enforcing ongoing practices
    and processes.


    Wherever possible, automate health monitoring and reporting for your systems.
    Automating the collection of data for the qualitative and quantitative properties
    of a measured service allows you to create baseline and trending information that
    is valuable to the capacity planning and load planning processes.


    Development practices make a considerable difference, so we recommend that you
    include performance when internal application development guidelines. Measuring
    and reporting key performance criteria in an application development environment
    can help release time expectations for performance and capacity. These practices
    also help you recognize and identify changes of performance implications of the
    application being developed. To establish the best internal application guidelines,
    it is important to:


    +   - Define techniques and tools


    +   - Use a common instrumentation and availability architecture


    +   - Test and size applications before they reach production


    These tools, their usage specifications, and the actions required at measured
    thresholds should be well-documented and placed in a system runbook. This runbook
    should provide the guidelines and standard process flows for reporting and acting
    on system events of many types. The system runbook should contain enough detail
    to reconstruct the procedures and operating environment in the production environment
    in the event of a disaster. This runbook should also be designed to enable an
    IT employee who is unfamiliar with the specific local environment to successfully
    implement the described procedures and threshold activities.


    Create some breathing room for planning by defining a multilevel escalation path.
    Use a strict change control process, and schedule batches of changes to manage
    risk. Arrange for the appropriate staff to be on site during change periods, to
    concentrate'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'on fire-fighting efforts. In a fast-changing business environment, the amount
    of change will keep increasing and this acceleration must be managed and controlled
    without impeding change.


    This chapter highlights the importance of documenting service level agreements
    between service providers and users. Additionally, this chapter offers best practices
    for capacity estimation and consolidating workloads.


    # # Service Level Management


    Many client/server environments measure their service performance by CPU utilization,
    uptime/downtime, paging rates, I/O utilization, cache hit ratios, and the like.
    Though all of this is important, still more information is needed to understand
    the end-user''s perspective. Users are more interested in the end-to-end availability
    of a service and the perceived notion of slow and fast. Unfortunately, these perceptions
    are difficult to quantify. The synthesis of traditional datacenter monitoring
    and the end-to-end availability of the service is required. Synthesis is known
    as service level management (SLM).


    When IT departments first attempt to implement SLM, the tools are not always available.
    In such instances, it is appropriate to measure what can be measured. The goal
    is to eventually be able to measure from the end-user''s service perspective.
    Once the new perspective of monitoring a service becomes more familiar to the
    IT department, the service level objectives (SLOs) can be expanded to include
    additional metrics from the end-user''s perspective.


    # # Service Level Agreements (SLAs)


    Service level agreements are negotiated between consumers and providers of IT
    services. There could be multiple SLAs between a single business unit and multiple
    service providers, such as network, IT infrastructure, database, and desktop workstation
    support groups. Some providers can also have SLAs with other providers, including
    vendors and internal provider organizations whose services they consume. These
    multilevel SLA structures can help pass business requirements, refining the requirements
    of the IT infrastructure. They can also pass capabilities down to the end-user
    level, providing technical capabilities in a business context.


    Most SLAs follow the same basic framework:


    +   - A background is established for the service; it generally consists of what
    has been provided historically, the proposed service, and what the proposed service
    will provide:'
  merge: -1
  pgno: 47
- img_proc: true
  md: '+   - All parties are identified.

    - The service is identified.

    - Expected transaction load is projected.

    - Metrics are established.

    - Escalation procedures are clearly documented.

    - Arbitration, costs, consequences, and terms are all clearly defined.


    Keep in mind that one of the keys to a successful SLA is clear communication and
    realistic, measurable goals that are stated in terms of the consumer''s needs.


    The SLA should not be mired in legalese; rather; it should be easily understood
    by anyone who is familiar with the service and the specified area of business.
    The SLA should be implemented as part of the system runbook and maintained in
    an area accessible to both the business unit using the service and the IT staff
    maintaining the service.


    The following lists the sections most commonly found in an SLA and describes what
    each should include:


    +   - Background – Provide an overview of the SLA and historic information about
    the service that was previously provided. Additionally, general information about
    the SLA, the business processes and objectives, and the impact of the new SLA
    on the business processes should be included. This section should target readers
    who are unfamiliar with the service.


    +   - Parties – Identify key contacts from all groups and the responsibilities
    of each. Clearly define the parties affected by this service. Who is the service
    provider and who is the consumer? Are there other affected groups, and whose expertise
    is needed?


    +   - Service definition – Define the service being covered, location of the service
    (both the servers and the end-users), number of users, transaction volume expected,
    and service capacity. Determine coverage and schedules for the service, including
    service availability hours and maintenance windows. Be sure to include measurable
    goals for the service.


    +   - Key business indicators (KBIs) – List in the detail of concurrent users,
    transactions per unit of time (hours/minutes), transaction types, user distribution
    (LAN and WAN links and latency), resource contention with other applications,
    and workload intensities. This item should be very explicit.


    +   - Measurement of service – Define the method by which the KBIs are measured,
    and track compliance with the service definition.


    +   - Problem reporting and escalation – Establish the problem reporting process
    and escalation procedure.


    +   - Review and reporting – Establish regular service reports and review meetings.


    +   - Costs, chargebacks, and consequences – Establish costs and chargeback processes.
    Define rewards or penalties for compliance/noncompliance.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '+   - Resolution of disputes and arbitration – Define the arbitrators who will
    resolve

    disputes.


    +   - Reassessment and update of SLAs – Establish a regular review cycle. Given
    the

    dynamic nature of IT environments (new applications, greater demand, or

    additional users), regular reviews are necessary to revise and update the SLAs.


    +   - Term – Define valid dates of the SLA.


    +   - Approvals – Acquire sniff of the SLA by heads of each party.


    +   - Definition of terms – Provide a glossary of terms used in the SLA.


    Each SLA should be unique, based on the service being provided and the needs of

    t users. However, this does not mean that once the first SLA has been completed
    it

    be necessary to start again from scratch. There will be nuances for each service

    that being placed in an SLA.


    # Identifying a Service


    Given the user-centric focus of an SLA, the process of defining these agreements

    requires sales and marketing skills, tact and diplomacy, and the traditional IT

    abilities of managing and measuring IT resources.


    When identifying for the initial implementation of an SLA, check that the

    existing service fits two criteria:


    +   - Existing tools can monitor the service and the existing baseline data exists,

    including service availability and historic performance metrics.


    +   - The dependencies for the service can be clearly defined and those groups
    that are

    required to provide components of the service are available (network, printing,

    help desk, etc.).


    The implementation of an-SLA is beneficial to both parties, providing resource

    consumption and service sizing information. An SLA can assist the IT department
    in

    projecting load planning information for system sizing, the business unit in

    estimating the cost of proposed changes to the service, and the accounting

    department in assigning real cost estimates for business services.


    # The Service Definition


    Once a service has been defined, the technical components of that service need
    to be

    identified. Include the servers, networks, number of end-users, and their physical

    locations. Detail the projected transaction volume and service capacity for the

    systems, as well as the acceptable threshold. The goal is to include the lowest'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'acceptable and desired average per transaction latency and maximum supported
    transaction rate for the service. List the core system availability hours and
    planned maintenance windows.


    The service definition should be:


    +   - Meaningful

    - Measurable

    - Understandable

    - Cost-effective

    - Attainable


    Metrics for the service will be derived from meetings with the end-users, benchmarking,
    and historical data that includes uptime/downtime, outage times, and performance.
    All of these metrics should be mutually agreed upon by both the IT department
    and the users, and should require explicit numbers with measurable goals. The
    SLA should be cost-effective for both the end-users and the IT department, while
    still meeting the demands of the business. Lastly, the goals should be attainable,
    based on testing and historic performance.


    # Example Service Definition:


    The order processing group has 300 employees, all centrally located in the Kansas
    City facility. They are currently connecting to a database on a Sun Enterprise™
    6500 server, also located in the Kansas City facility, over the local area network
    (LAN). The order processing group must run monthly reports on the first week of
    every month (for the previous month), quarterly reports on the first week of every
    quarter (for the previous quarter), and annual reports on the first week of the
    new fiscal year (for the previous year).


    # Example Server Specification:


    The server architecture for this environment consists of the following:


    Sun Enterprise 6500 server


    16 CPUs, 4 Gigabytes of memory


    700-Gigabyte A3500


    2 FDDI network adapters connected to the server LAN


    Note that desktops, network infrastructure, help desk, backup, restore, and printer
    support are covered under a separate contract.'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'After characterizing the service and defining the infrastructure, establish
    the service time frames and windows of maintenance. Service specifications should
    be based on the needs of the users and the performance data acquired from previous
    years (if available).


    # Example Service Schedule Specification:


    Business hours are defined as 0600 EST to 2000 EST, Monday through Sunday.

    The maintenance windows are defined as 2030 EST until 0030 EST, Monday through
    Sunday. During these maintenance windows, no transactions are permitted.


    If transactions are required during any of the maintenance windows, then prior
    approvals from the IT manager and the end-user manager are required. Approval
    must be secured and the request submitted to the help desk at least 7 days prior
    to the request. At no time will transaction processing needs be allowed to compromise
    data or backup integrity.


    In the event of an emergency, a planned outage may need to be scheduled outside
    the normal maintenance windows. In such a case, the IT department will seek the
    users'' approval for the arrangement and timing of the outages. They will also
    make a reasonable attempt to limit the impact of the planned service outage to
    the end-users when possible.


    In the event of a "disaster" requiring the recovery of data or the restoration
    of significant portions of the system, the help desk will notify the users of
    the service event and regular updates will be provided every 30 minutes until
    the service is restored. These events defined as "disaster" will not be counted
    in the service availability calculations, but will be documented in the monthly
    service review.


    Current estimates of disaster-level service restoration are two hours for system
    level restoration, four hours for application data recovery, and two hours for
    database system recovery. No system service event, including disaster events,
    will exceed twelve hours.


    # Example Availability Specification:


    Outages are periods during defined business hours that fall outside emergency
    maintenance windows and during which the system is unavailable for transactions.
    Planned or scheduled emergency maintenance is not included in outage calculations.
    Outage onset is the time that the outage is detected rather than the actual time
    of occurrence. Outage termination is the time that service is available after
    an outage.


    The system shall maintain functional availability of 99.8% of business hours.
    System availability is determined by the following equation:'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'Coverage = Total minutes in month defined as "business hours"

    14 hours per day × 60 minutes × 30 days = 25200 minutes

    Outage = minutes of monthly outage (33 minutes)

    Availability = (Coverage – Outage)/Coverage × 100

    (25200 mins)-(33 mins) × 100 / (840 mins × 30 days) = 99.8%


    During peak hour, 95% of queries will be completed in less than 2 seconds (on
    average) with up to 300 users online. No queries will exceed 5 seconds.


    During peak hour, 95% of all order transactions will be completed in less than
    5 seconds (on average) with up to 300 users online. No queries will exceed 9 seconds.


    The order processing system will sustain a transaction of 30,000 transactions
    per hour during business hours.


    Because historical batch-related performance data is lacking, no guarantees of
    performance for batch processing can be made at this time.


    # Key Performance Indicators (KPIs)


    KPI documents have long been the yardstick we have used to measure our server’s
    performance. While SLAs are specified in business service terms, KPIs are defined
    in language familiar to the system administrator. They often measure available
    CPU, memory, and I/O throughput, as well as more granular aspects such as mutex
    counts, interrupts, and context switches. KPIs are not to be interpreted as pass/fail
    conditions, but are meant to report on the overall performance health of the server
    and to indicate when a service might not have adequate resources to meet the goals
    of the SLA.


    After the service definition has been created, system performance goals are established
    to measure resource utilization against resource capacity. The KPI document establishes
    resource thresholds and identifies warning and critical levels of resource consumption.


    When the capabilities of a service are being measured, a number of tests are performed
    on the server. Benchmarking of the application should be performed to identify
    the limits of the server’s capabilities and to identify a baseline of the resources
    that the business service consumes at different thresholds of use.'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'TABLE 3-1 lists the kind of thresholds found in a KPI document.


    # TABLE 3-1 Key Performance Indicator Examples


    | Resource | Warning Threshold | Critical Threshold |

    | --- | --- | --- |

    | CPU | >70% utilization for any measured shift | >90% utilization for any measured
    shift |

    | Disk | >30%"busy" for any measured shift | >50%"busy" for any measured shift
    |

    | Memory Scan Rate | >1000 pages per second, sustained for 5 minutes | >4000 pages
    per second, sustained for 5 minutes |


    The system architecture, both hardware and software, corresponds to the capacity
    and impact on the service. As the hardware architecture and software are changed
    by upgrades or patches, the KPI document should be revisited to determine new
    thresholds where necessary.


    Most IT departments choose not to include KPIs in the actual SLA, because the
    details contained in the KPI document are intended for the IT department directly
    involved in the management of the server system. These KPI measurements can be
    useful in budgeting, planning, and justifying upgrades and additional resources.
    They can also be used as the baseline to compare performance measurements against
    made after modifications to the service applications, database, and desktop systems.


    # KPI Measurement


    After identifying the KPIs, make sure that the measurement criteria and tools
    that monitor them are outlined in the KPI document.


    A number of tools are available to help monitor system performance. Some of the
    tools including sar, iostat, vmstat, mpstat, and netstat are integrated into the
    Solaris OS to assist with KPI measurement. Free tools like Sun™ Management Center
    (SunMC) and the SE-Toolkit provide graphical tools to monitor single systems.
    Commercial monitoring tools like SunMC, BMC Patrol, BMC Best/1, and TeamQuest
    can be configured to measure, monitor, and report on performance status and thresholds
    for a large number of systems. Most then be integrated into enterprise management
    tools like Solstice Enterprise Manager™ software and HP''s OpenView.


    It may be necessary to create some of your tools to monitor a service from the
    end-user''s perspective. Although it is easy to monitor services from the back
    room, a regular snapshot of the user''s response time is needed. Thus, network
    latency should be taken into account when possible. These custom tools not be
    overly complex. In fact, a simple script that queries the server from the end-user''s
    subnet and sends SNMP traps back to the network operation center (NOC) with response
    times may be sufficient.'
  merge: -1
  pgno: 53
- img_proc: true
  md: 'TABLE 3-2 lists example tool definitions that correspond to the sample thresholds
    in TABLETABLE 3-1.


    # TABLE 3-2 Tool Definitions for Key Performance Indicators


    | Resource | Tool | Sample Time |

    |---|---|--|

    | CPU | sar - utilization is determined by the sum of "%%sys%%" and "%%user%%"
    | 20 mins |

    | Disk | sar - utilization is determined by "%%busy%%" | 20 mins |

    | Memory (to Solaris 7 OE) | vmstat - scan rate as reported in the "sr" column
    | 5 mins |

    | Memory (from Solaris 8 OE) | vmstat - free memory as reported in the "free"
    column | 5 mins |


    The example in TABLE 3-2 also illustrates a problem: Some metrics are vendor-release-dependent,
    so multiple definitions need to be maintained.


    When summarizing KPI data, keep in mind that there are different consumers of
    this data. First, there are the system administrators, who are usually adept at
    analyzing raw performance data. Next are the IT managers and financial planners,
    who may be interested in summaries of the data for budgeting. Last are the end-users,
    who may be interested in the system''s health and performance. These last two
    groups may be best served by a Web page that provides graphical representations
    of system load and performance. Charts and graphs can represent better system
    health for less technical users. Chapter 6, "Observability," discusses audiences
    for performance information in more detail.


    A KPI document can also include actions for immediate relief or resolution of
    performance events. These actions might include stopping, rescheduling, or reprioritizing
    running batch jobs, stopping other business functions that are deemed not to be
    business-critical, or running utilities for analyzing the current application
    load.


    # Problem Reporting and Escalation


    To minimize impact and confusion for the users, use the existing problem-reporting
    process that is currently in place for that service (if the process exists and
    can be modified appropriately). This process should list the severity levels,
    the primary contacts at the help desk, and an escalation matrix for unresolved
    problems. Problem-reporting and escalation procedures should be well-documented
    in the system runbook. The procedures should be tested and updated as necessary
    to reflect changes to the IT environment.'
  merge: -1
  pgno: 54
- img_proc: true
  md: 'Severity of problems can range anywhere from a single user having slow response
    to a global outage. To allocate resources appropriately, severity levels should
    be defined, as should be the priority in which those levels are organized.


    TABLE 3-3 lists a sample definition of severity levels.


    | Level | Possible Impact |

    |---|---|

    | 1 – Critical | Potential loss of customers; Key business functions unavailable
    for one or more locations; Major network outage; More than 50% of workforce affected;
    Possible revenue loss of >$100,000/hour; Possible cumulative revenue loss of >$250,000/hour
    |

    | 2 – High | Key business functions not working properly and is severely impacting
    one or more locations; More than 25% of workforce affected; Possible revenue loss
    of $50,000 – $100,000/hour; Possible cumulative revenue loss of $50,000 – $250,000/hour
    |

    | 3 – Medium | A key business function experiencing problems and limiting the
    efficiency of a single group or location; Loss of productivity for at least 25
    people; Possible revenue loss of $20,000 – $50,000/hour |

    | 4 – Low | Fewer than 25 people affected; Loss of productivity; Possible revenue
    loss of <$20,000; Cumulative revenue loss of <$20,000 |

    | 5 – Minor | Workforce experiencing a problem that is not affecting efficiency;
    Workforce experiencing only minor loss of productivity; No revenue or cost impact;
    Customer request for information |


    A simple call sheet may suffice for the contact information. All calls, regardless
    of severity, should be placed through the main help desk for tracking and escalations.


    During Critical- and High-level problems, the help desk should contact the next
    tier on the escalation list immediately in addition to the appropriate IT personnel
    responsible for resolution. The contact information for different components of
    the production environment should be documented in the system runbook, including
    how to contact the help desk itself, owners of different categories of problems,
    and vendors responsible for different components of the environment.'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'Delays in the resolution of a problem can also result in an escalation in severity
    level. Whether an automatic notification to the next support tier is made depends
    on the IT department''s escalation method. The escalation path and events causing
    the escalation should be well-documented in the system runbook.

    The following example is a guideline from a sample problem report sheet.


    # Sample Problem Report Sheet:


    Problems should be reported to the IT help desk by phone to (606) 555-5300, by
    email to help@helpdesk, or by fax to (606) 555-5301. Faxed or emailed trouble
    reports will receive a call from a help desk engineer within 30 minutes of the
    receipt of the report during specified core business hours and within 2 hours
    outside of the specified core business hours.


    +   Please provide the following information:

    - Name

    - Department

    - Location

    - Phone

    - Email

    - Problem Description (including your desktop environment and application which
    you are experiencing problems)

    - Number of users affected


    The help desk will assign a severity level based on the problem description (and
    impact) and will contact the appropriate IT personnel.


    If your problem is Level 1 (Critical) or Level 2 (High), the help desk will immediately
    notify the IT manager for that service and the appropriate IT engineers. The IT
    manager for the service will be notified of the problem every 60 minutes, until
    the problem is resolved.


    Level 3 problems will be upgraded to Level 2 if not resolved in 3 business days.

    Level 4 problems will be escalated to Level 3 if not resolved in 5 business days.


    # Trouble-Reporting Metrics


    The service description should also include metrics relating to trouble reporting.
    These metrics should include the availability of the help desk, as measured by
    how long the customer should wait from the first ring when calling, and the effectiveness
    of the help desk, as defined by the percentage of calls answered while the customer
    is on the phone.'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# Reporting and Review


    Regular reports should be made available to the end-users, business unit management,
    and IT management to indicate how well the IT department is doing with meeting
    the service description. Usually, these reports are weekly, monthly, quarterly,
    and annual summaries. Reporting times will depend on the needs of the customer.
    The monthly, quarterly, and annual reports should also provide running averages
    of months or quarters.


    Regular reviews of the KPI documents and SLA should be performed. These reviews
    should be between the IT managers of the organization supporting the service and
    the end-user managers. The SLA is a tool for maintaining availability, so the
    importance of these meetings is paramount. In relatively static environments,
    quarterly meetings may be fine (with more frequent reports). However, within dynamic
    environments, as growing e-commerce environments and service providers, these
    meetings should be performed monthly or weekly to determine any changes that need
    to be made to the service definition or the system and application infrastructure.
    In some extreme cases where changes to the planned load and service definition
    occur on a less predictable or predictable schedule, a weekly service review may
    be complemented with impromptu meetings to provide maximum advance notice of change
    to the parties providing the service.


    At these meetings, discuss the performance of the IT department in meeting the
    service description goals, the new requirements, and growth expectations of the
    end user. Identify problems that arose during the previous week and possible recommendations
    for ways to improve these problems. This is also a good time to clarify any questions
    about the agreement. It is much better to resolve questions early on in the life
    of the SLA, rather than later through arbitration.


    A sample weekly report is described in “Management Viewpoint Implementation” on
    page 135.


    # Costs, Chargebacks, and Consequences


    One of the key benefits of creating SLAs is that they enable organizations to
    predict the resources required to support a service. Though it is always a painful
    process to comb through historical performance and trouble ticket data, the reward
    is the ability to predict the actual costs incurred to support a service more
    accurately.


    Future service requirements exposed as a result of these meetings may affect personnel
    resources and computing resources, justifying additional personnel or hardware.'
  merge: -1
  pgno: 57
- img_proc: true
  md: 'In the original example, it was determined that the resources listed in TABLE
    3-4 needed to support the order processing group for the first year.


    # TABLE 3-4 Example Support Costs


    | Staff Headcount | Fractional Headcount Required | Salary* | Total* |

    |---|---|---|--|

    | Help Desk Staff 1 | 1.00 | $45,000 | $45,000 |

    | Help Desk Staff 2 | 0.50 | $45,000 | $22,500 |

    | UNIX Admin | 0.45 | $80,000 | $36,000 |

    | DBA | 0.25 | $80,000 | $20,000 |

    | Operator | 0.50 | $50,000 | $25,000 |

    | Network Admin | 0.25 | $80,000 | $20,000 |

    | Manager | 0.25 | $100,000 | $25,000 |

    | TOTAL | | $480,000 | $193,500 |


    *Note that these numbers do not include taxes, benefits, additional training,
    etc.


    For the end-user department to hire the talent needed, the department would need
    to spend approximately $480,000 a year. Moreover, these resources would be dedicated
    to that department, have no support structure (other IT department mentors), and
    considerable idle time (unless there were lots of problems with the service).


    By maintaining support for the service in a centralized IT department, the end-user
    business unit can attain coverage by the IT department at nearly 40% of the original
    costs ($193,500 + 480,000) × 100). This savings is enhanced by the following benefits:


    +   IT staff are not necessarily dedicated to a single service; their time is
    often shared among multiple services.


    +   Mentoring from other IT department engineers provides cross-training and skill
    enhancement throughout the support staff.


    +   The datacenter environment, rather than the standalone environment, provides
    higher quality, sharable, standardized resources for backup, restoration, monitoring,
    management, and reporting.


    +   The IT department can provide career paths and training, so key talent won''t
    be as to leave.


    +   The engineers can standardize on datacenter disciplines, resulting in a move
    from reactive to more proactive management practices.


    By identifying the projects on which engineers are spending the most time, the
    IT manager can identify recurring problems, find ways to rectify these problems,
    and lower the time spent by engineers. This increases the ability of the IT staff
    to address problem resolution. It also increases the leverage that the support
    organizations can wield over vendors, while lowering direct costs such as tool
    licensing and support contract costs.'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'Finally, there are the consequences of meeting or failing the service definitions.
    In some IT departments, the IT department staff''s bonuses are directly tied to
    meeting or exceeding stated service level goals. In other environments, failure
    to meet stated service goals resulted in discounted or free services to the end-users.
    The consequences or rewards depend on your corporate support and culture.


    An example of free service due to outage is as follows:


    eBay:¹


    "For any hard outage lasting two or more hours, eBay will automatically extend
    listings for 24 hours and automatically credit all fees for affected listings.
    The following listings will be eligible for extension and credit:


    "Any listing scheduled to end during the hard outage


    "Any listing scheduled to end in the hour after the end of the hard outage"


    # Arbitration and Conflict Resolution


    Even with regular meetings and clear lines of communication, problems can arise.
    These issues can be the result of misinterpretation of the service definitions,
    failure to meet proposed definitions, or just a breakdown in communication between
    the IT department and the end-users. During these times, it may be necessary to
    seek arbitration for a resolution.


    Arbitration need not be an outside organization, though very well can be. It can
    be a person or a panel that can review the problems and reach a final, binding
    solution. Since the point of arbitration is resolution, the decision of the arbitration
    panel is final.


    Quite often, the arbitration panel will consist of the vice president of the IT
    department, the vice president of the end-user department, and one other person
    outside of the two organizations (maybe a CFO, HR director, or another vice president).


    When creating the SLA, identify the members of the arbitration panel and gain
    their commitment from the onset. Once this approval is granted, the panel should
    be clearly identified in the SLA and its decisions adhered to by all involved.


    > From eBay, Inc.''s "Outage Policy," http://pages.ebay.com/help/community/png-extn.html;
    February 26, 2000.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# Reassessment and Updating


    The managers and representatives of the service for both THE IT department and
    the end-users should meet regularly to review the existing SLA and propose changes
    to the agreement. Either party may propose changes, but both parties must approve
    the changes.


    Generally, changes are requested when there are significant deviations from the
    original service objectives, actual or expected changes to the IT environment,
    or new business requirements.


    Regularly scheduled inspections of the agreement should also be held, and plans
    for end-user or IT department growth should be discussed at this time (if they
    have not already been addressed and resolved in previous meetings). Since SLAs
    are expected to be ongoing and of indefinite duration, these meetings provide
    a good time to review the previous period''s performance and to suggest changes
    for the upcoming period. The time periods and review schedules should be documented
    in the system runbook. The system runbook should also contain the point of contact
    in one of the involved organizations responsible for scheduling the meeting and
    contacting the necessary parties for attendance.


    # Inventorying the Enterprise


    Before you can project system requirements or specify hardware platforms, you
    must first know what the enterprise actually contains. A baseline must be created,
    containing the current processing capacity and computing resources consumed. In
    addition, this baseline must include overall hardware infrastructure and the total
    costs incurred by the enterprise in supporting computing needs.


    Tools such as Gartner Group''s TCO tool can provide estimate and true cost analysis
    of a computing infrastructure. Total costs must include:


    +   - Real estate

    - Server and infrastructure assets

    - Depreciation

    - Lease and rental fees

    - Support

    - Maintenance

    - Professional services

    - Education

    - Training

    - Software costs'
  merge: -1
  pgno: 60
- img_proc: true
  md: 'A complete TCO analysis is a long and involved process, but can be very enlightening;
    such an analysis can reveal hidden and forgotten costs in the IT budget.


    The computing needs for the business function must also be quantified in some
    manner. This quantification can resolve individual business functions such as
    payroll and marketing data or can be further subdivided into more specific metrics
    such as paychecks processed or show leads generated.


    Once the computing needs for the business function have been identified, the computing
    resources dedicated to those business functions should be inventoried. Databases,
    server software, server platforms, application software, and client-side desktops
    should be categorized and summarized by business function and computing category.
    In some cases, especially in the case of desktop computer platforms, resources
    will be shared among several unrelated business functions. These shared resources
    should be inventoried and characterized for an estimated percentage of use in
    each identified business function for which they are used.


    Some business functions are not so easily identified and are often overlooked.
    These commonly include system and network management resources, as well as development,
    test, and prototyping environments, which may be very dynamic in configuration
    and structure.


    All of these factors can be tallied against each other to define the current cost
    and performance characteristics of the business and computing environment. Results
    such as server, maintenance, and support costs of the payroll system can be generated
    from the collected data for comparisons and projections against the business growth
    potential and relative cost analysis of changes to the server platform or architecture.


    # # Baseline Business Services


    Baselining the performance of business services is the second step in understanding
    exactly what is happening in the datacenter. Performance baselines should measure
    each business function in terms of transaction type, transactional volume, and
    where possible, average response times for the driving server systems, in both
    average and peak transactional periods.


    As an example of a performance baseline summary statement, an analysis of an online
    sales and distribution system might state that:


    Shift average transactional volumes for the sale period of 10/1/99 through 12/31/99
    were measured as 12,000 catalog system lookups per hour. For shift hours measured
    at 11,500 to 12,500 transactions per hour, catalog system lookup response time
    averaged 3.2 seconds, with a worst-case query response time of 5.1 seconds.'
  merge: -1
  pgno: 61
- img_proc: true
  md: 'A peak hourly rate of 22,000 catalog system lookups was measured for the hour
    of 19:00 PST on 12/23/99. During this peak-measured hour, catalog system lookup
    response time averaged 4.4 seconds, with a worst-query response time of 11.4 seconds.


    By measuring current business functions over a representative period of business
    traffic, we can establish quantitative as well as qualitative metrics. We can
    then use the collected metrics to project future requirements and system capabilities,
    and to set user and management expectations for service qualities relative to
    service volumes.


    By creating a scalar representation of the performance characteristics of a particular
    business service, we accomplish two goals:


    +   - Being able to predict application impacts of service load to help application
    developers and database administrators identify bottlenecks and inefficiencies
    in the same server and application software


    +   - Plotting the linear scalability (or lack thereof) of a particular service
    to help predict the future resource needs for business function growth¹


    # Capacity Estimation and Consolidation Processes


    This section describes these processes in general, and Chapter 5, "Capacity Estimation,\"
    presents a detailed example of the implementation of these processes."


    # Quantifying Capacity


    One of the most difficult tasks in workload performance analysis and characterization
    is predicting the quantity of work that disparate server platforms can support.
    This challenge is slightly easier when the servers being compared are of the same
    base architecture (UltraSPARC™) or, at the very least, from the same vendor (Sun
    Microsystems).


    If there is an industry-standard benchmark that closely imitates your workload
    characteristics, then use that benchmark as a guideline for platform comparisons.
    Unfortunately, very few business implementations come all close to the popular
    industry-standard benchmarks; or more appropriately stated, very few industry
    benchmark standards have any real meaning in actual business application computing.


    1. The prediction is accomplished through the application of Amdahl''s Law for
    parallel scalability of software systems.'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'Several relative commercial packages for performance monitoring and capacity
    planning include relative performance metrics for a variety of operating system
    environments. Two examples that we can use as samples of market offerings BMC
    (formerly BGS) Best/1 and TeamQuest. The Best/1 and TeamQuest performance monitoring
    capabilities implement slightly different methods for capacity metrics, but both
    packages supply the same basic function.


    Best/1 Performance Console for UNIX has an internal database of hardware and operating
    capabilities and assigns relative metrics to the processing and I/O capabilities
    of a given platform. Performance of a given system is quantified and can be used
    as input into the BEST/1 modeller for system sizing.


    TeamQuest uses an external table to assign system capacity metrics. System performance
    can be recorded and applied against a chosen platform''s capacity. This manual
    process can be a bit cumbersome in a large enterprise datacenter, but it allows
    the user to create or expand the default capabilities datasets in the product.


    # # Consolidating Workloads


    The actual process of consolidating workloads is fairly straightforward, once
    the workload baseline has been established. To combine workloads in a single-server
    platform, the workload baseline metrics are summed and the supporting hardware
    is sized to meet the projected computing needs. Target system peak shift and peak
    hours are chosen for sizing, and target system utilization is established for
    those time periods. Without strict resource management implementations, the rule
    of thumb for target utilization is 70%. With resource management software and
    policies implemented, target utilizations of 90% or more can be safely projected.


    If the measured workloads exhibit unpredictable behavior (such as intermittent
    spikes in resource utilization or noncyclic resource trends), the target utilization
    point might be lowered to accommodate the *worst-case* periods of consumption.
    The analysis of workload performance metrics, combined with a formal SLA, describe
    the transactional and service level expectations for the computing function.


    Directly relating business and service goals to server sizing and management considerations
    is a key byproduct benefit of a server consolidation project. Business projections
    for growth and service level expectations can be associated with system platform
    hardware, software, and licensing requirements for budgeting and IT resource planning
    of the project life cycle.'
  merge: -1
  pgno: 63
- img_proc: true
  md: '# Resource Management


    When multiple business functions are run within a single-server platform, resource
    conflicts almost always surface. Some applications will parallelize very well,
    running their workload more efficiently at the expense of the other workloads
    on the shared platform. To reduce the impact of these resource conflicts, formal
    resource management policies must be established and enforced according to SLA
    guidelines.


    The Enterprise 10000 platform supports dynamic system domains (DSDs), allowing
    a single-server platform to act as several distinct servers, with independent
    instances of the operating system and independent application environments. System
    resources can be migrated manually between system domains, allowing administrators
    to reallocate idle resources from an underused domain to a domain starving for
    resources. Resources can only be migrated at a system board level; in addition,
    no automated or performance policy-based dynamic reconfiguration (DR) is supported
    at this time.


    Solaris OS processor sets allow the administrator to bind applications to a set
    of defined processors. Processor sets create hard walls of CPU resource allotment
    for each designated domain. Idle CPU resources within a processor set cannot be
    used by other workloads outside that processor set; in addition, idle CPU resources
    outside a processor set cannot be used by it can be dynamically adjusted; however,
    no automated process exists for policy-based CPU resource management.


    Solaris Resource Manager (SRM) provides a policy-based resource framework for
    server resources that overcomes some of the limitations of processor sets and
    system domains. SRM is a fair share resource-scheduling system, capable of managing
    resource categories such as CPU, virtual memory, time, logons, and disk quotas.


    Resources are defined as either static or renewable, depending on their particular
    characteristics. A CPU is one example of a renewable resource because CPU resources
    are dynamic for any given point in time. There is no finite limit of CPU power;
    as a machine runs, new processing power is always available. Static resources
    include items like number of simultaneous logons permitted and connect time per
    session.


    With SRM, renewable resources that a workload does not consume within its share
    are free for use by other workloads. Resource consumption is governed by the relative
    shares allocated to the cohabiting workloads. Workloads can consume any idle renewable
    resources on demand. When renewable resources are not available, SRM will enforce
    any process currently consuming more than its defined relative shares.'
  merge: -1
  pgno: 64
- img_proc: true
  md: 'Resource management can include combinations of SRM, processor sets, and dynamic
    system domains. These tools can complement each other, and offer excellent provisions
    for resource management architecture. In addition, these tools can safely control
    resource utilization within the guidelines of the SLA and KPI documents. Refer
    to the Sun BluePrints book Resource Management for more detailed information on
    SRM.


    # # The Never-Ending Cycle


    Like system and network management, performance and workload management define
    a never-ending cycle. System platforms, operating systems, application software,
    and the business functions that use them in a continuous evolutionary progression.
    To properly consolidate server functions and satisfy business requirements, a
    complete understanding of the enterprise is necessary. This understanding must
    range from the business view of a service to the hardware impact of a running
    application.


    When a successful implementation of a business-computing process is complete,
    however, the celebration is short-lived because the close of one system implementation
    signifies the start of ongoing management of the underlying architecture. A well-monitored
    and managed computing environment will directly influence the modelling and prediction
    of the next incarnation of the architecture evolution. In addition, this environment
    will ensure that the computing resources provided for the business application
    will meet the requirements necessary to honor the contracted service levels.


    When service levels exceed the limits defined or key performance indicators exceed
    defined limits, the platform must be reviewed and possibly upgraded to meet the
    defined business goals. In addition, the platform may need to have workloads balanced
    in the computing enterprise to allocate more resources to the underperforming
    workload.


    Even the hardware and software procurement process is circular. Business groups
    contract service levels with capacity planners. Capacity planners define a workload
    metric for the service levels contracted. Systems engineers specify a hardware
    platform that can satisfy the workload metric and place a procurement request
    for the business group to budget.'
  merge: -1
