- img_proc: true
  md: '# Requests 1000/sec


    # Responses 8000/sec


    ![](img/7613e130542edcd7529aeccf7bedcadc_72_0.png)


    Figure 4-4 Dataflow Architecture With Latencies and Intensities


    # 4. Determine operational modes.


    Performance modelling assumes that the workload is essentially constant. Therefore,
    if the system has periodic changes in behavior, it is best to pick out the main
    modes and measure and model them separately. One of the main modes occurs when
    backups are taking place. In many cases, backups must take place online during
    quiet periods, because when you are supporting Internet-based users around the
    world, there is no convenient time for offline backups. Modelling backup behavior
    is useful, as fast-growing environments find that the amount of data to back up
    increases rapidly. As a result, the backup duration increases and often overflows
    from the quiet period, affecting performance. The disk subsystem will probably
    be at its busiest during backup.


    In the example shown in the figures, there is a periodic search update, and the
    load is different while the update is occurring. It is useful to model behavior
    in the normal state and also during an update. It seems possible that the back-end
    server’s network interface would be a bottleneck during the update. The utilization
    levels are different in each mode, so they need to be recorded separately.'
  merge: -1
  pgno: 72
- img_proc: true
  md: '# 5. Choose one bottleneck.


    It is quite simple to model a single function on a single system, and extremely
    complicated to model an entire network of systems. However, the performance of
    a network of systems is limited by its bottleneck, so you get useful results simply
    and quickly by focusing on one bottleneck and assuming that bottlenecks elsewhere
    in the system can be removed easily.


    One of looking at this issue is that the biggest and most expensive system you
    have should run at the highest utilization, so that you are not wasting an expensive
    resource by leaving it idle. This system then tends to be the bottleneck while
    upgrading systems that they are no longer bottlenecks.


    In the example, the back-end database server is a single system (or perhaps a
    highly available pair of systems); it is common for this system to be both the
    expensive resource and also the primary bottleneck. It is much easier to replicate
    smaller systems to take care of front-end services than to decompose a single
    database instance into multiple.


    # 6. Choose service and utilization indicators.


    The initial model should be a crude and oversimplified base for planning future
    scenarios. The hardest thing is to learn for successful modelling is to let go
    of the details. You can build a very useful model with incomplete and inaccurate
    data as long as you are smart in what you include and what you leave out. For
    the back-end server, a mixture of transactions is taken from the application servers.
    However, as long as that remains fairly constant, you can average all transactions
    into a generic transaction rate. If the back-end server load level fluctuates
    a lot because of several competing applications, you need to perform a workload
    breakdown to obtain the CPU and disk utilization that is involved in servicing
    the incoming transactions. If this is the primary load on the system, then you
    can probably get away with the overall CPU utilization. Assume that there is a
    direct relationship between the total number of transactions processed and the
    CPU utilization. The average CPU time per transaction may change when the system
    configuration or application changes. However, the characteristics of the system
    remain constant between changes and provide a useful basis for a simple growth
    model.


    # 7. Pick a large time scale.


    For scenario planning, we are interested in what will happen over the coming days,
    months, and years, and not the next few seconds—this is why we can ignore so much
    fine detail. Also, to quote the mainframe capacity-planning guru Pat Pat:


    > To predict the future, you must know the past.


    You need to collect historical data that spans a time similar to the period you
    are trying to predict. So, a week''s collected data gives you a good prediction
    of next week. To predict the next year, you need collected data for the whole
    of the previous year. If you want to separate time-based or seasonal variations
    from one-off events,'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'you need to see the same season twice. Lack of data is no excuse; however,
    you should start to plan immediately and as time goes by, the extra historical
    data will improve the quality of your predictions.


    +   8. Work through the planning process.


    The rest of the scenario modelling and planning process is illustrated with a
    simple parameterized spreadsheet in the next section.


    +   9. Compare the prediction with reality.


    Once you have predicted the transaction rate and system utilization for the coming
    months, you need to measure and compare with reality. This way, you learn estimates
    in the model were optimistic or pessimistic and how to build better models.


    +   10. Recalculate the predictions regularly.


    After each time you predict (e.g., monthly), you have a new baseline of real data
    and you must recalculate the model needs.


    In the next section, a simple spreadsheet-based scenario planning model is explained.
    It should be quick and easy to implement, and if nothing else, it should help
    you think more clearly about the assumptions you are making over the coming months
    and years.


    # Modelling Capacity and Load


    This section explains how a spreadsheet can be used to quickly generate estimates
    of capacity and load. By combining projected effects of various influences on
    load at any given time (such as growth of the user base and seasonal variation),
    you can generate a model that projects the total future load on the system. A
    model that considers the current capacity a baseline and then estimates performance
    improvements from various effects can be used in conjunction with the load model
    to determine if the system will have the capacity to support the required load
    in the future.


    # Modelling Load


    Several influences on load are introduced in the subsequent sections. For each
    influence, a mathematical model appropriate for predicting future behavior is
    presented. These models will be appropriate in a wide variety of circumstances,
    but for each they can also be easily modified to better model a specific environment.
    For each of the influences presented, the formulas presented in the descriptions
    can be used to'
  merge: -1
  pgno: 74
- img_proc: true
  md: 'create a spreadsheet that estimates the "growth factor" from a baseline. If
    additional influences have an impact on the load, they can be computed in a manner
    similar to the influences described below and can be combined with the other influences
    to get a total load. Additionally, different models can be used for the influences
    described below if the models aren''t sufficient.


    The basic idea of the spreadsheet presented here is that the effect of any influence
    at a given time can be represented as an independent growth factor that represents
    how influence affects the load. The growth factor is simply the factor that the
    original (baseline) load must be multiplied to get the estimated load supported
    at the time in question. If the baseline load was measured in January and the
    estimated growth factor for June is 2.0, this means that the load can be expected
    to increase two-fold from January to June.


    Because the growth factors are represented as multipliers, the units are immaterial.
    Load is posted, but all the values are normalized. This means that they are divided
    by a normalization value. For repetitive influences like daily, weekly, or seasonal
    variation, the normalization value is the highest value present. For absolute
    (nonrepetitive) influences, the normalization value is the original (baseline)
    load. In either case, all the values are divided by the normalization factor to
    obtain the growth factors. When this occurs, the units of measurement cancel each
    other out. However, to obtain meaningful results, the same units should be used
    for each measurement for instance: transactions per second, network throughput,
    or CPU usage. In the example below, the measurements are of CPU load, because
    the CPU is the bottleneck. Determining the appropriate bottleneck is described
    in "A Recipe for Successful Scenario Planning" on page 47. The spreadsheet method
    outlined here is designed for systems with only one significant bottleneck. Systems
    with multiple bottlenecks need to use more complex methods.


    Once all influences are computed in a spreadsheet, you can combine them by multiplying
    the growth factors for each influence together. An example of this is shown in
    TABLE 4-1 and in FIGURE 4-5.


    It is also important to do a sanity check of the models. For instance, if capacity
    planning shows a growth rate of 2 times month over for several months while data
    is being gathered, projecting the trend may not be appropriate. This trend would
    lead to an estimate of load at the end of the year being 4096 times the baseline.
    Because many unmeasurable factors affect growth, this approach may not be appropriate.
    However, the spreadsheet model is flexible enough to allow for tailoring the models.
    More complex formulas can be used, or different formulas can be used for different
    time spans. For instance, the assumption could be made that the geometric exponential
    growth rate tapers off a few months as a higher percentage of the target population
    becomes. This could be implemented in the spreadsheet using a growth factor for
    the first 4 months,'
  merge: -1
  pgno: 75
- img_proc: true
  md: 'followed by 1.5 for the subsequent months. Modifying the spreadsheet so that
    it better estimates the load and capacity of the systems in question is discussed
    in “Tweaking the Model” on page 74.


    A final important consideration is that the time scales of each spreadsheet must
    coincide. For instance, if one spreadsheet measures growth as the result of a
    marketing campaign on a day-by-day basis and another spreadsheet measures growth
    as a result of seasonal effects on a monthly basis, they cannot be combined. The
    number of data points (spreadsheet cells) should also be the same for each influence.
    Additionally, it is important that the seasonal variations begin with the baseline
    in the correct season. For instance, if the baseline was taken in April, it is
    important that the seasonal cycle in the spreadsheet starts in April.


    # Daily and Weekly Variations


    **Note** – Although daily and weekly variations are discussed below, they are
    not actually used in the example because other influences in the example are measured
    month-by-month.'
  merge: -1
  pgno: 76
- img_proc: true
  md: 'The chart in FIGURE 4-5 shows most of a week from Tuesday to Sunday on a busy
    back-end server system in terms of transactions per second. Each transaction query
    updates the database and is a good indicator of the business activity level for
    this system. You can see that the system never sleeps, but there is a predictable
