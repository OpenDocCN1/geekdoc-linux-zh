  md: '# SOLARIS


    # ADRIAN COCKRAFT BILL WALKER


    # Sun


    ![](img/7613e130542edcd7529aeccf7bedcadc_261_0.png)


    http://www.sun.com/blueprints


    Capacity planning is a well known discipline, particularly for sites that have
    a mainframe oriented background. The explosive growth of Internet sites and E-commerce
    has presented new challenges in managing performance and capacity. In many cases,
    time constraints and business demands can prevent normal capacity planning techniques
    from being applied. Classic datacenter capacity planning methods can be adjusted
    and successfully applied to this new Internet-centric environment.


    This BluePrint charts a course through the available techniques and tools, examines
    timescales and return on investment for different methodologies and provides a
    framework for decomposing big problems into solvable subproblems.


    # ABOUT THE AUTHORS


    ADRIAN COCKRAFT is a Distinguished Systems Engineer at Microsystems, working in
    the Performance Applications Engineering organization. He has had broad experience
    of both hardware and software and works to make sure many diverse products come
    together to form complete and consistent systems. He is the primary author of
    Sun Performance and Tuning: Java and the Internet, and contributed to the Sun
    Print on Resource Management. An Englishman, he holds a degree in Applied Physics
    and Electronics from the City University, London.


    BILL WALKER is an IT Architect in Sun Professional Services, working in the IT
    Consulting and Operations Services (ITCOPS) practice. With an extensive background
    in IT management, he is currently focused on services including performance analysis,
    capacity planning, performance management, and server consolidation. He is a co-author
    and instructor of the Sun Educational Services Technology Seminar, "Solaris Performance
    and Tuning Secrets," and has taught several courses on Unix System Administration
    for local colleges. He attended Millerville University, studying Electrical Engineering,
    and Management of Information Systems.


    # Capacity Planning


    # for Internet Se


