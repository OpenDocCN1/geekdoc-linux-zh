  md: '# Service level management


    (SLM) The process by which information technology (IT) infrastructure is planned,
    designed, and implemented to provide the levels of functionality, performance,
    and availability to meet business or organizational demands.


    # service provider


    In a network policy, the service provider controls the network infrastructure
    and may be responsible for the charging and accounting of services.


    # service time


    The time it takes for an I/O device to service a request This can be complex to
    measure. For example, with today''s disk storage systems, the device driver issues
    a request which is queued internally by the RAID controller and the disk drive,
    and several requests may be sent before the first one comes back. The service
    time, as measured by the device driver, varies according to the load level and
    queue length and is not comparable to the old-style service time of a simple disk
    drive.


    # SE Toolkit


    A toolkit that can be used to develop customized process monitors. The Solaris
    software can provide a great deal of per-process information that is not collected
    and displayed by the ps command or Sun Enterprise SyMon 2.0 software. The data
    can be viewed and processed by a custom process monitor. You can write one from
    scratch or use the experimental scripts provided as part of the SE Toolkit. The
    SE Toolkit is a freely available unsupported product for Solaris systems. It can
    be downloaded from http://www.sun.com/sun-on-net/performance/se3.


    # SEVM


    Sun Enterprise Volume Manager; technically equivalent to the Veritas Volume Manager
    (VxVM).


    # ShareII


    A resource management product from Softway. The Solaris Resource Manager (SRM)
