  md: '# Cached Stripe


    FIGURE 5-25 illustrates cached stripe.


    ![](img/7613e130542edcd7529aeccf7bedcadc_133_0.png)


    FIGURE 5-25 Cached Stripe Schematic


    Write-caching for stripes provides greatly reduced service time. It is worthwhile
    for small transfers, but large transfers should not be cached.


    For the A3500, some tests confirm that 128 K is the crossover point at which the
    same performance is obtained with and without the cache. For consistently larger
    transfers, better performance is obtained without a write cache. For smaller transfers,
    much better performance is obtained with the write cache.


    Write caches also perform a few useful optimizations. Rewriting the same block
    and over again cancels in the cache so that only one write needs to be made. Small
    sequential writes also coalesce to form fewer larger writes.


    # Capacity Model Measurements


