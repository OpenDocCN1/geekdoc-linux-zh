- img_proc: true
  md: '![](img/7613e130542edcd7529aeccf7bedcadc_130_0.png)


    FIGURE 5-21 Striped Disk Accesses Schematic


    When the request size is more than the interlace size, it will be split over N
    disks for both single- and multithreaded requests. N is set by the request size
    divided by the interlace. The throughput of N disks is obtained.


    The reduced size of the request on each underlying stripe reduces service time
    for large transfers, but you need to wait for all disks to complete, and the slowest
    dominates. This kind of operation works efficiently when one-megabyte requests
    are split into a 128 K interlace. As the request size and interlace are reduced,
    the overall efficiency also reduces.


    # RAID5 for Small Requests


    FIGURE 5-22 illustrates RAID5 for small requests.


    ![](img/7613e130542edcd7529aeccf7bedcadc_130_1.png)


    FIGURE 5-22 RAID5 for Small Requests Schematic'
  merge: -1
