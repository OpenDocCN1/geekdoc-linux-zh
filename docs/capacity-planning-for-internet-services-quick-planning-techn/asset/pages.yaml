    # # Modelling Capacity


    As load, the factors that affect capacity can be separately computed in a spreadsheet
    and then combined to get a combined capacity estimation. Many capacity measurements
    can be modelled. The two influences on capacity shown below are efficiency variations
    and capacity increases.


    +   - Efficiency variations cover all factors that increase effective capacity.
    This includes application and system tuning, as well as the removal of load from
    the bottleneck by parallelizing or offloading functionality. Keep in mind that
    any load-reducing effects reflected in the total load should not be reflected
    by the efficiency variations.


    +   - Capacity increases anything that allows increased capacity because of upgrades
    to the bottleneck. Since the bottleneck in this example is the CPU, anything that
    affects the total CPU power of the machine is considered a capacity increase.
    These include processor upgrades, as well as OS upgrades and database upgrades
    (which may use the existing processor power more or less effectively).


    Modelling Capacity and Load 67'
  merge: -1
  pgno: 88
- img_proc: true
  md: '# Efficiency Variations


    The model for load is based on a relatively constant resource usage per the resource
    causing the bottleneck. In the example above, CPU usage is the bottleneck, and
    the load model is based on average CPU usage per transaction. Large changes in
    the application or transaction mix need to be accounted for in the scenario plan.
    Ideally, performance tuning the application or offloading some functionality to
    other systems will reduce the amount of bottlenecked resource used per transaction
    every few months, so that schedule for expected (or desired) changes in the application
    efficiency can be laid out as part of the model recorded in the spreadsheet.


    TABLE 4-6 shows the effects of heavy application tuning on the CPU usage per transaction
    in the above example. Although these results may be representative of what can
    be achieved in many situations, it is sometimes possible to achieve a four or
    five-fold performance improvement (like the one shown here) by tuning customers
    applications or databases. When planning for future capacity, it is important
    to talk to the programmers, consultants, or DBAs tuning the system to get an accurate
    expectation of the amount of tuning that can be achieved.


