  md: 'The Sun BluePrints book Resource Management shows how to separate and monitor
    multiple workloads with SunMC. Use this capability to track application processes
    and define alarms that tell you when something goes wrong—example, when a process
    goes away or a workload starts to use too much CPU.


    # Key Performance Indicator Plots


    Operations must have access to displays that show daily data for the main components
    of key systems. These are a great help with problem diagnosis. A simple approach
    is to log data to a table, import it into a spreadsheet, and plot the key indicators.
    It is also possible to automatically generate plots on a Web page using free tools
    like MRTG (Multi Router Traffic Graph, www.mrtg.org) and Orca (www.orca.net).
    The disadvantage of these methods is that they do not operate in real time and
    need to be refreshed manually. Almost all commercial performance tools supply
    data in real time for display in ways that are suitable for operation monitoring.


    An example of a useful display is a spreadsheet that reads data logged to a file
    using the SE toolkit. This spreadsheet is available for download at http://www.sun.com/blueprints/tools.
    In this spreadsheet, plots cover the main components of a single system, such
    as CPU, disk, network, and memory. The following plots are displayed in the next
    figures:


    +   - FIGURE 6-8 and FIGURE 6-9 show CPU utilization, the balance of user CPU
    time to system CPU time, and the load average (number of runnable jobs) relative
    to the number of CPUs configured and online.

    - 6-10 shows disk utilization for the busiest disk in the system and the average
    utilization over all the disks in the system. This graph shows how skewed the
    disk is, and highlights the most likely disk bottleneck. And write throughput
    in KB/s shows the data transfer characteristics.

    - 6-11 displays network throughput in KB/s. This number can be obtained either
    by monitoring the TCP stack or by monitoring the network interfaces. Monitors
    report byte-level counters these days, but many just read packet information,
    which is far less useful, given the wide range of possible.

    - 6-12 displays memory and swap space; they can be plotted together, but need
    to be interpreted differently. Swap space must always be available so that processes
    can start and grow, because if a process runs out, the system will have problems.
    Main memory is managed by reclaiming itself once it reaches a low threshold, it
    will tend to hover around that threshold. The page residence time is another useful
    measure, as explained here.'
