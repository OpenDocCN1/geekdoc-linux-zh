  md: '# # Estimating Capacity for Complex Disk Subsystems


    This section provides an overview of performance factors and capacity planning
    models for complex disk subsystems. It includes RAID5 and cached stripe examples.


    # ## Single Disks


    The capacity model for a single disk is simple and has already been described.
    The schematic in FIGURE 5-18 shows a single disk with incoming and outgoing requests.
    In the following sections, we extend the schematic to show more complex disk configurations.


    ![](img/7613e130542edcd7529aeccf7bedcadc_128_0.png)


    FIGURE 5-18 Single Disk Schematic


    # ## Mirrored Disks


    FIGURE 5-19 is an example of mirrored disks.


    ![](img/7613e130542edcd7529aeccf7bedcadc_128_1.png)


    FIGURE 5-19 Mirrored Disks Schematic


    All writes go to both disks when they are mirrored. However, there are several
    read policy alternatives, such as:


    +   - All reads from one side (referred to as "preferred")'
