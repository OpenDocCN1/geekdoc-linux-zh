- img_proc: true
  md: 'After recalculating the steps by using the new hardware configuration, we can
    use the MVAP (Mean Value Approximation Package) Solver to predict the system resource
    utilization, response times, and queue delays in the new system model by running
    the same workload steps. Examining the Stretch Factor graph (see FIGURE 7-10)
    for the new system configuration shows the relative queue queue delay time for
    active resources in the new system model.


    ![](img/7613e130542edcd7529aeccf7bedcadc_185_0.png)


    **FIGURE 7-10** TeamQuest Model: Upgraded System Stretch Factor Graph


    The Stretch Factor graph now shows stretch factors under 2.0 in all steps, for
    all workloads modelled. In addition, the “Database_App2” workload displays an
    incremental increase in delay time per unit of work being done. We can delve into
    the characteristics of the “Database_App2” workload on the new server system by
    examining the Resource Component Response Time graph.'
