    # Overview


    Traditional “glass house” datacenter managers are generally familiar with the
    concepts of production environment standards for operational policies and procedures,
    but are unprepared for the exponential growth experienced by the fast-paced dot-com
    consumer markets. These glass house managers must learn to:


    +   - Adapt to the fast-paced Internet economy


    +   - Be prepared to quickly accommodate the new model of instantaneous and direct
