    # Cached Disk Subsystem Optimizations


    When a cache is introduced, a certain proportion of the accesses will hit the
    cache, but it is not often possible to obtain a measurement of this proportion.
    The cache also allows many optimizations that combine small accesses into fewer
    larger accesses to take place. Some of the common optimizations are:


    +   - Read prefetch clustering - A small read triggers a larger read into cache,
    then subsequent nearby reads and writes are satisfied by the cache. Modified cache
    blocks are written back asynchronously. The service time of the first read will
    be increased somewhat, and the service time of subsequent read and write hits
    will be very quick. A write-back may cause a delay to slow down subsequent accesses.


    +   - Asynchronous write caching - If the cache is nonvolatile, it is safe to
    acknowledge the write immediately and write the data to disk later on. The service
    time of the write will be as fast as a cache block is available. Write-backs can
    become a bottleneck and cause block allocation delays that slow down write services.


    +   - Write cancellation - Multiple writes to the same block often occur when
    file system metadata is updating. When the block is cached, subsequent writes
    cancel out the first one and many updates can occur for each write-back to disk.


    +   - Write coalescing - Multiple writes to adjacent data are coalesced into a
    single larger writer. If the larger writer exceeds the underlying disk block size,
    then there is no need to read a large block because it modifies it by incorporating
    the small write and writes the large block back.


    All of these optimizations can be happening at the same time, and there is no
    standard way for the disk subsystem to report what is going on in its cache. In
    most cases, the disk and cache do not collect this kind of information at all.
    In the next section, to make sense of the data reported by iostat, we need some
    configuration information, a simplified model of the cached disk subsystem, and
    some assumptions about the workload mix.


    # Cached Disk Subsystems


    There is a lot of read caching being done by the file system in main memory, but
    the file system cannot do writing safely for logs, metadata, or database transactions,
    and this is where performance bottlenecks often occur.'
  merge: -1
  pgno: 126
- img_proc: true
  md: 'The disk cache can be inserted into the disk subsystem in two places: in the
    computer or in the disk array. The Sun Presterve and Sun StoreEdge™ Fast Write
    Cache add nonvolatile memory to the computer host and use as a write cache. A
    very small amount of read-back from the cache may occur, but usually the source
    data is still available to be read from main memory longer than is stored in cache.
    To simplify the method, we can assume all reads goes to the disks and writes goes
    to the write cache first. The capacity mode for reads is the same as that of a
    simple striped disk setup; read optimizations are done by the file system layer
    in both cases, for raw disk, there is no prefetch or read cache in either case.


    The model for writes is that writes are extremely fast until the write cache is
    overwhelmed. This overwhelming occurs when the underlying disks cannot keep up
    with the rate at which data is flushed from the cache. The CPU overhead from copying
    the data can be estimated from the maximum access rate of NVRAM. The worst-case
    performance for writes is limited by the write-back rate and is also the same
    as for an uncached system. There is a choice of policies for the cache: it might
    cache only synchronous writes, or it could cache all writes. It is best to cache
    all writes to start with; also, if the write-backs saturate, drop back to calling
    synchronous writes.


    # Host-Based Write Cache Model Interconnect Parameters


    UltraSCSI runs at close to 40 MB/s for large transfers, but reads and writes compete
    on the same bus. This interconnect is used for simple disk packs and the Sun D1000
    and A1000. The A3500 uses dual-balanced UltraSCSI buses for a total of 80 MB/s.
    The transfer latency for small transfers over UltraSCSI is around 0.6 ms.


    Fibre Channel has the advantage that reads and writes use separate paths. The
    Channel Arbitrated Loop (FC-AL) standard can suffer from arbitration delays when
    very long loops are used, but small configurations are much faster than UltraSCSI.
    The older SPARStorage™ Array (SSA) runs at 25 MB/s in each direction, and at about
    1.0 ms minimum transfer latency. The current FC-AL standard runs up to 100 MB/s
    each way, with latency of about 0.4 ms.


    Dual FC-AL loops have been measured at up to 180 MB/s, again with a latency of
    about 0.4 ms. If both loops run over the same SBus interface, the SBus itself
    may become a bottleneck.'
