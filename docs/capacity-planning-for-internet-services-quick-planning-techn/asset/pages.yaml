- img_proc: true
  md: 'There are three ways to obtain the weekday variation coefficients. The first
    way is to simply guess at something that “looks about right.” Guesses are better
    if they are made by consensus with a group of people. The second way is to take
    measured data for several weeks, average all the data in a spreadsheet, and measure
    the daily peaks. The third way is to use statistical analysis, specifically analysis
    of variance (usually known as ANOVA), to fit a model to the data. This technique
    is described in a paper by Joe Hellerstein et al., published in the 1998 Computer
    Measurement Group conference. The paper uses several months'' worth of Web hit
    rate data collected in 1996 on www.sun.com by Adrian Cockroft as its raw, and
    fits an increasingly sophisticated model to the daily, weekly, and monthly variations.


    # Seasonal Effects


    In addition to the variations from day to day, there are seasonal effects from
    month to month throughout the year. In the rest of this scenario planning exercise,
    data is the basis of the plan. Within each month there will be daily variations,
    but the time scale over which changes and upgrades are made to a production system
    is measured in months. Therefore, the peak load needs to be sustainable in given
    months.


    If you have at least a years'' worth of data, you can use it to generate estimates
    for the monthly variations. Keep in mind that if you have limited historical data,
    it is likely that the perceived seasonal effects will be a combination of the
    actual seasonal effect and other (potentially large) influences such as geometric
    exponential growth. “Tweaking the Model” on page 74 offers guidelines on how to
    make the model fit the data by use of a simple iterative tweaking method.'
  merge: -1
