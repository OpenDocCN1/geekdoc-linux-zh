  md: '![](img/7613e130542edcd7529aeccf7bedcadc_125_0.png)


    FIGURE 5-17 Complex I/O Device Queue Model


    As long as a single I/O is being serviced at all times, the utilization is reported
    by iostat at 100%, which makes sense because the pool of devices is always doing
    something. However, there is enough capacity for additional I/Os to be serviced
    in parallel. Compared to a simple device, the service time for each I/O is the
    same, but the queue is drained more quickly, so the average queue length and response
