- img_proc: true
  md: '# Baselining


    Baselining creates a snapshot of a system as it currently exists and generates
    reports that describe the system performance and the characterization of the workload
    being measured. To baseline a system, we first describe the goals of system performance
    in throughput, latency, and utilization within each level of the service architecture.


    The business requirements of the service being provided by the established workload
    must first be defined. These end-user service level requirements can include:


    +   - Transaction rates


    +   - Transactional volumes


    +   - Hours of operation


    +   - Critical time frames for processing batch loads


    +   - Concurrent user session requirements


    These are the same business requirements defined in the SLA, which is explained
    in detail in Chapter 3, "Suggested Processes."


    A configuration inventory establishes a record of the current state of the five
    layers of the service architecture and provides a reference for modifying that
    architecture. An accurate representation including hardware, software, and operating
    system versions is critical to creating an accurate inventory. This configuration
    inventory is considered "locked down" for the life span of the baselining process.
    This causes all changes to the operating environment to be considered a tuning
    event that expires the current system state and triggers a new baselining cycle.


    At this point, service performance is monitored and measured against the goals
    defined in the SLA. In addition, system performance is monitored and measured
    against the desired resource consumption thresholds defined in the key performance
    indicator (KPI), as addressed in Chapter 3.


    If any tuning opportunities are identified in any of the five layers of system
    performance, the identified changes to the system or architecture are implemented
    and remeasured against the previous snapshot. This helps to determine the positive
    or negative effects of those changes on system performance. The old snapshot is
    retained as a historical record of configuration and resulting performance metrics,
    and the new snapshot becomes the working baseline.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Load Planning


    Load planning accounts for changes or new demands on the system. Any available
    data describing the changes and new demands is collected and analyzed. Possible
    measurements are taken by baselining similar workloads or workloads in the development
    phase. The new workloads or changes to the existing workloads are profiled, providing
    input to the capacity planning phase (see FIGURE 2-2).

    noad data gathering, and profiling. Each of these activities may need to be repeated
    multiple times before valid assumptions can be made about the data collected.


    ![](img/7613e130542edcd7529aeccf7bedcadc_29_0.png)


    Figure 2-2 Load Planning


    Load Assessment identifies how the new demand can be quantified. In the case of
    a new pool of end-users migrating to an application, load assessment would determine
    where the users would be located, how they would be accessing the environment,
    what they would be doing in the environment, and the frequency with which they
    would do it. This information could then drive the creation of benchmarks to test
    the effects of this new demand on the existing environment.


    Load Data Gathering collects raw statistics on the transactions within a benchmark.
    This collection can be accomplished in many ways depending on the layer that is
    focused on. These statistics tend to be much more detailed and over shorter intervals
    than those measured during baselining activities. These measurements usually take
    place in an isolated development environment or test environment.


    Load Profiling creates a model based on the load-gathering data. This model will
    represent the typical load that is applied to a system for that particular planning
    cycle.'
  merge: -1
