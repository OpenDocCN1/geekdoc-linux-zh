    Foglight Software is at www.foglight.com.


    # SAS IT Service Vision (CPE)


    SAS has a wide range of statistical analysis products. SAS/CPE has been used to
    process computer performance data for many years in both mainframe and UNIX environments.
    It has a much more sophisticated performance database than do other products,
    with a very wide range of analysis, reporting, and modelling functions. It is
    often used in conjunction with performance monitoring products from other vendors
    to provide capacity planning, performance prediction, and reporting capability.
    The MXG Toolset is a notable alternative to the SAS/CPE functions that also runs
    on the basic SAS platform.


    More information can be found at www.sas.com and www.mxg.com.


    # Hyperformix/SES Workbench and Strategizer


    SES Workbench is a well-established performance simulation tool. The company has
    recently changed its name to Hyperformix and has focused on adding a professional
    services capability to assist in capacity planning simulation development. The
    simulation used is very different from the analytical performance modelling done
    by BGS Predict and TeamQuest Model (which work by solving a set of equations).
    With a simulator, you create a model of the components in your system, then drive
    it with load levels and wait for the simulation to stabilize over time. Running
    a simulation is far more resource-intensive than analytical modelling in both
    setup time and CPU. If you have a well-constructed simulation, you get much more
    information than is available from an analytical model. SES Workbench runs on
    UNIX systems and NT.


    To make it easier to construct models of computer systems and networks, SES Strategizer
    is preconfigured with high-level components that match common system types in
    some detail. You still need a lot of experience to make good use of the tool,
    but it is a lot quicker to construct a model. SES Strategizer runs only on Windows
    NT.


    SES is at www.ses.com and www.hyperformix.com.'
