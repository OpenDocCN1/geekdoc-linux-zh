  md: '# Aurora Software SarCheck


    SarCheck is a relatively inexpensive tool that can be very useful to help diagnosis
    in an operations environment. It runs on many platforms, but on Solaris OE it
    reads data from sar and ps, writes a detailed explanation of what it sees almost
    like an essay. SarCheck uses rules that are based on those in Adrian Cockcroft''s
    virtual_adrian.se tool. The output is punctuated with cross references to specific
    pages in Adrian''s Sun Performance and Tuning book for further explanation.


    Aurora Software Inc. is at http://www.sarcheck.com.


    # Capacity Planning with TeamQuest Model


    To show the capabilities of this class of tools, we have constructed an example
    a product from TeamQuest Corporation (www.teamquest.com). This product has been
    effectively used by Sun Professional Services to provide a capacity planning study
    over a time scale of a month or so.


    The TeamQuest suite of performance tools includes many useful tools for simplifying
    the performance management process. Performance data is monitored and recorded
    in real time, with both reporting and alert features. The data can be viewed live,
    showing system and workload performance measures, while the data is being recorded
    in the TeamQuest database. The performance data for a previously recorded period
    can also be viewed in context, with drill-down capabilities for debugging performance
    problems.


    The TeamQuest alert tool can provide performance condition alarms to a central
    management console system, which alerts performance analysts, system administrators,
    or capacity planners to retrieve the recorded performance data for the critical
    period or analyze the real-time condition of the systems with the TeamQuest view.


    The TeamQuest on the Web tool moves performance data from servers being monitored
    to a central server host, where the performance data can be viewed by a standard
    Web browser with Java technology support.


    The TeamQuest Model tool can take recorded performance data, categorized by a
    set of defined application sets, called workloads, and provide input for load
    and capacity planning.'
