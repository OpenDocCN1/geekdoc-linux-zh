  md: '# Introduction


    Almost every business, from a corner shop to a multinational corporation, is faced
    with competitive pressure to “go online” and provide services via an Internet
    site. In addition, a large number of new online businesses are being implemented
    in a mad dash to capture the attention and wallets of a huge and fast-growing
    number of Internet users. Success is measured by growth in the number of pages
    viewed, registered users, and in some cases, the amount of business transacted.


    Success comes at a cost. Rapid growth can overwhelm the ability of the site to
    provide services with acceptable performance. There have been many reports of
    Web sites that have suddenly attracted too many users and collapsed under the
    strain.


    Startup dot-com spend most of their investors’ funds on advertising as they attempt
    to establish their name in the collective consciousness of consumers and the media.
    Established companies are concerned about maintaining their preexisting advantage
    while gaining credibility as they add Internet services to their traditional businesses.
    Therefore, it is important to provide enough capacity to cope with sudden increases
    in load.


    Traditional computer installations have a relatively static number of users, and
    a detailed understanding of their workload patterns can be obtained. Growth rates
    in this environment are relatively low, and costs can be optimized by careful
    capacity planning. Internet services are available to millions of potential users
    of the service. The load on the service depends upon the whim of the users. If
    a high-profile advertisement or news item reaches a large number of people, there
    is a great opportunity to expand the user base as long as the site can cope with
    the load. Growth rates for successful sites in this environment are very high,
    and very hard to plan for. It is normal to lunch from one crisis to the next and
    to throw hardware quick fixes at the problem regardless of cost.


    Capacity planning is an optimization process. Service level requirements can be
    predicted and balanced against their costs. Even if there are few cost constraints,
    it is important to have good estimates of how much spare capacity the site has
    and whether it can survive the next load peak.


    Capacity planning is a well-known discipline, particularly for sites that have
    a mainframe-oriented background. When very high growth rates occur, time constraints
    prevent normal techniques from being applied. This Sun BluePrints book'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'charts a course through the available techniques and tools; examines time scales
    as return on investment for different methodologies; provides a framework for
    decomposing big problems into solvable subproblems; and gives simple, practical
    examples that provide results in hours thanks to spreadsheet-based techniques.
    If you wait until you have chosen and purchased an expensive tool, you will need
    weeks or months to learn how to use it. These tools are useful and powerful, and
    their use is also described in detail.


    The topics covered in this book can be divided into the following sections:


    +   - Principles and processes

    - Scenario planning techniques

    - The effective use of tools


    Compared to conventional capacity planning techniques, the Internet service capacity
    planning techniques described in this book must cope with high rates of change,
    work with limited system administrator experience, and steer a path through confusing
    choices and a lack of tools.


    Because there are also increased availability requirements, it is important to
    give priority to simple, common-sense principles that can be followed consistently.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Theoretical Principles


    With the exponential growth of the Internet and consumer electronic commerce on
    the Internet, service quality has become a key component of success. Electronic
    commerce and commercial portals on the Internet expose the business front office
    and the related business back office systems to scrutinize by the direct consumer,
    as well as by the news media.


    Sun servers the traditional datacenter environment where system availability,
    manageability, and service availability are key components in providing a solution
    to business requirements. With an established and encompassing "production environment"
    life-cycle plan, robust solutions can be safely and reliably placed into production
    and evolved to meet the changing and growing needs of the business.


    This chapter presents methods for managing performance and establishing service
    level agreements (SLAs). It also examines the IT frameworks designed to provide
    solutions for production environment business requirements. Additional IT frameworks
    from ISO FCAPS (fault, configuration, application, performance, and security)
    models are presented, and tips are offered for implementation.


    # Performance Management


    Performance management is the measurement, analysis, and optimization of computer
    resources to provide an agreed-upon level of service to the end-user. By defining
    performance management and identifying the key components required to safely and
    accurately implement performance management in the datacenter, you can minimize
    the risks associated with high growth rates. These risks include:


    +   - System downtime due to unexpected overload


    +   - Negative customer feedback


    +   - Loss of potential business due to poor response times


    +   - Loss of customer loyalty due to perceived lack of service quality'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'The key components that we will concentrate on to define our scope of performance
    management will include:


    +   - Throughput

    - Latency

    - Utilization


    Throughput is defined as the number of defined actions performed in a given period
    of time. Latency is defined as the time that it takes to complete a well-defined
    action.


    Throughput and latency can be applied at a high level while measuring transactions
    at the end-user level. They can also be examined for discrete events such as network
    packets, disk activity, or system centerplane bandwidth consumption. Each of these
    levels of system performance, provided that you understand the events being monitored
    and analyzed for impact on overall system capabilities of the resources involved
    in providing those actions.


    Utilization is usually expressed as the percentage of the overall capability of
    a resource consumed during a defined action or quantity of actions. Resource utilization
    and resource utilization planning are the cornerstones of capacity planning. Utilization
    is a measure of system resource impact, throughput defines the quantity of services,
    and latency defines the quality of the services being provided'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Layers of Service Architecture


    Several layers of resources and resource consumption can be defined, tuned, measured,
    and reported within the service architecture. Categorizing these layers (see TABLE
    2-1) and defining the expectations for each level provides the guidelines for
    the design and implementation of a system.


    TABLE 2-1 Layers of Service Architecture


    | Layer | Components |

    | --- | --- |

    | Business | Number of users

    Batch job definitions

    Report schedules

    Business: hours |

    | Application | N-tiered architecture

    Database layout

    Software architecture

    Access methods |

    | Operating System | Kernel tuning

    OS revisions

    Disk volume layouts |

    | Hardware | CPU

    Disk

    Memory |

    | Infrastructure | Network architecture

    Enterprise management

    Backup strategies |


    Each of these layers of the overall service architecture affords opportunities
    for tuning, measurement, reportings, and management. Each layer will have its
    own particular scale of benefit and investment to introduce change.


    The Business layer often provides the most significant opportunities for “tuning”
    and has the most significant contribution to the overall architecture. The Application
    layer and Hardware layer can also provide a significant and obvious impact on
    the overall performance of the architecture. The Operating System and Infrastructure
    layers are often where administrators look for some magic cure, but these layers
    often provide the least opportunity for impacting the performance of a system.'
