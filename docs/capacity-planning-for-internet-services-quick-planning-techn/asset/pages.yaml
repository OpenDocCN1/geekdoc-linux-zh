  md: '# Summary


    This chapter presented a detailed survey of useful tools for capacity planning
    and this discussed the benefits of using both Sun and third-party tools. In addition,
    this chapter offered several ways to balance peak load both within and across
    systems to eliminate system strain and underutilization.


    Appendix A consists of several tables containing SCPM measurements that indicate
    the processing potential of system configurations using Solaris OE versions 2.5,
    2.5.1, 2.6, 7, and 8.'
