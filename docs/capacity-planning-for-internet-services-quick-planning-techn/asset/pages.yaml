- img_proc: true
  md: '# Observability


    Observability is the first requirement for performance management and capacity
    planning. The performance characteristics need to be presented in a way that makes
    sense to those who are looking at them, so they can observe the behavior of the
    systems and understand what is happening. Three different viewpoints need to be
    provided for different audiences:


    +   - Operations

    - Management

    - Engineering


    Each audience requires significantly different output. This information can be
    obtained from disparate the same performance database or with completely separate
    tools. This chapter looks in detail at gathering, organizing, and presenting performance
    data to these three audiences.


    # Operations Viewpoint


    The operations room works in the immediate time frame, using a real-time display,
    updated every few seconds. Alert-based monitoring should be combined with automatic
    high-level problem diagnosis if possible. However, this level of sophistication
    is rare. Simple high-level graphs and views of current data will be needed.


    # Management Viewpoint


    Management will never have time to read a voluminous report. A single-page daily
    summary of status and problems is more appropriate. The summary should contain:


    +   - Business-oriented metrics

    - Future scenario planning

    - Concise report with dashboard-style status indicators'
  merge: -1
  pgno: 138
- img_proc: true
  md: 'Marketing and management input is needed to define the scenarios. These form
    grid, with things that change the load down the side and things that change the
    capacity across the top. It is then easy to see which tuning and upgrade projects
    must be implemented to cope with the increased load of the next marketing campaign.


    # Engineering Viewpoint


    Engineers need to see large volumes of detailed data at several different time
    scales. The data is used as input to tuning, reconfiguring, and developing future
    products and aids in low-level problem diagnosis.


    You only need to generate and store large volumes of raw data on systems that
    are being tuned. Detailed reports with drill-down and correlation analysis are
    needed, and many tools implement this kind of functionality very well. Engineers
    know how to build tools, and they tend to build the tools that they need themselves,
    so good engineering-oriented features are common.


    # Example Scenarios


    In the following sections, techniques and examples for implementing these viewpoints
    are presented. The operations viewpoint is demonstrated with the Sun Management
    Center (SunMC, a.k.a. Sun Enterprise SyMONT 2.1). The engineering viewpoint is
    implemented with SunMC and the SE toolkit to collect additional data. The management
    viewpoint is implemented as a spreadsheet.


    # Operations Viewpoint Implementation


    This section describes an implementation of operations management that is generic
    in the techniques being used, but specific in the tools used to implement it in
    a primarily Sun based environment.


    The steps covered in this section illustrate how to use a system monitor to automate
    the process of tracking multiple systems for unusual or problematic conditions.


    +   1. Enable rules.

    Many monitoring tools are shipped with their monitoring capability unconfigured
    or partially enabled, so the first step is to enable all relevant rules. If you
    have BMC Patrol (www.bmc.com), load Knowledge Modules. With SunMC, basic rules
    are enabled, and you can load additional health monitoring tools.'
  merge: -1
  pgno: 139
- img_proc: true
  md: '# 2. Set up rule thresholds.


    The default rules may be set up for a small system, in which case, they can generate
    false alarms on a larger server. They may also be set too high, so a problem could
    occur without firing alarm. For all the rules that you have, you should make a
    list of each rule, listing its threshold values and the typical and maximum metrics
    used in normal operation. If you can identify the values for these metrics during
    problem situations, you can set alerts correctly indicate transitions from normal
    (green) to high (yellow) to problematic (red) levels. If you have never seen a
    problem with a particular metric, then set its threshold a little higher than
    the highest value you have ever seen. This way, you "surround" the systems being
    monitored with a multidimensional behavior envelope. If the behavior goes beyond
    envelope in any dimension, an alarm tells you that something abnormal is happening.
    Document and save the customized rules and thresholds so they can be replicated
    on similar systems and are not lost during system upgrades.


    # 3. Monitor and reset alerts.


    When an alarm condition occurs, the alarm is useless if no notices or responds.
    Usually, the monitoring software will signal that a problem state has occurred,
    and you can acknowledge the alarm and investigate the source of the problem. Alarms
    that do not appear to be useful can be disabled, and new alarms can be created
    to watch metrics that are more relevant to your workload. The alarm log should
    be archived. The number of alarms that occur at each of the problematic levels
    (e.g., yellow and red) should be collected daily so it can be reported to management
    and plotted as a trend over time.


    # 4. Classify problems.


    Classify downtime, alarms, and problems that do not cause an alarm in one of the
    following categories, and report the number of occurrences per day:


    +   - Problem with corresponding alarm

    - Planned downtime

    - Planned downtime overrun

    - System failure downtime

    - Alarm

    - Warning

    - Persistent known problem carried over from previous day


    # 5. Perform root cause analysis.


    For each problem that was counted in Step 4, try to track down the cause and record
    what you find. If the number of problems analyzed each matches the number of problems
    reported, then you are keeping on top of the situation very well. Try to find
    time to modify the alarm rules to reduce the number of false alarms, warnings,
    and problems that did not cause a corresponding alarm, as as:'
  merge: -1
  pgno: 140
