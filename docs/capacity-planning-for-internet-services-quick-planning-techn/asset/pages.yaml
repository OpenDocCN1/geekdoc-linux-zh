    # Capacity Measurements for Single Disks


    Single disks are quite simple to plan for, and their performance characteristics
    can usually be obtained from the disk vendor''s Web site. The essential characteristics
    for each disk is its average seek time (which may be different for reads and writes),
    its average formatted transfer rate, and its spindle speed in RPM. For example,
    the end server 18.2 GB FC-AL drive is the Seagate ST318203FC, with 5.2 ms read
    seek, 6.0 ms write seek, 24.5 MB/s transfer rate, and 10,000 RPM.


    The most important measurement to take on each disk is the average transfer size.
    This may be very stable or fluctuate depending on the workload. In some cases,
    you may need to break down the day into shifts or modes (e.g., online mode, backup
    mode) and analyze capacity for each mode separately.


    # Measurements on a Single Disk


    The device driver maintains a queue of waiting requests, which are serviced one
    at a time by the disk. The terms utilization, service time, wait time, throughput,
    and wait queue length have well-defined meanings in this scenario, and for a single
    disk, this setup (FIGURE 5-11) is so simple that a very basic queuing model fits
    well.


    ![](img/7613e130542edcd7529aeccf7bedcadc_118_0.png)


    **FIGURE 5-11** Simple Disk Model


    Over time, disk technology has moved on. On these days, a standard disk is SCSI-based
    and has an embedded controller. The disk drive contains a small microprocessor
    and about 1 MB of RAM. It can typically handle up to 64 outstanding requests via
    SCSI tagged-command queuing. The system uses a SCSI host bus adapter (HBA) to
    talk to the disk. Large systems have another level of intelligence and buffering
    in a hardware RAID controller. The simple model of a disk used by iostat and its
    terminology may become confused. In addition, the same reporting mechanism is
    used for client-side NFS mount points and complex disk volumes set up by Solstice
    DiskSuite™ or Veritas Volume Manager (VxVM).'
