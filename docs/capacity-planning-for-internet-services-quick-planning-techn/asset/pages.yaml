    4-8


    ![](img/7613e130542edcd7529aeccf7bedcadc_83_0.png)


    FIGURE 4-8 Chart of Geometric Exponential Growth Rate


    There is an underlying growth factor involved in the size of the total Internet
    marketplace. At one point this was doubling every 100 days, but recent growth
    rates suggest a doubling period of a year or more. The average activity level
    of Internet users also changes over time, increasing with the roll-out of broadband
    DSL and cable connections. Several large Internet sites are seeing growth at a
    rate of about 50% every three months, or a doubling period of just six months.
    This translates into the geometric exponential growth shown in FIGURE 4-8. After
    two years, the monthly load level is about higher. The growth rate will vary and
    may not continue at this rate for long, but some kind of growth model needs to
    be estimated and then calibrated against experience over time. For systems in
    which growth is not a geometric exponential, other formulas can be used to describe
    growth more closely.


    Note that you should tune the growth rate as you get more data. Computing the
    growth rate over several different time ranges (for instance, January to March,
    March to May, and May to July) and averaging the results may yield a much better
    estimate of the growth. Also, continually estimating the growth rate will tell
    you if the geometric exponential growth rate is speeding up or slowing down, either
    of which could limit the effectiveness of the model.


    # Marketing Events


    There have been many examples of companies that run a marketing campaign that
    is too successful in getting new users and thus overloads their systems. To add
    this effect into the future growth plan, we developed a spreadsheet-based model
    that'
  merge: -1
