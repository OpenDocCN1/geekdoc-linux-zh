- img_proc: true
  md: 'Users have remote access to diagnostic tests through the Java™ technology-based
    SunMC console, which operates on the Solaris OE and Windows platforms. SunMC 3.0
    is the current release and it has a different license model. The base functionality
    works across many systems as you like, but extra functions such as monitoring
