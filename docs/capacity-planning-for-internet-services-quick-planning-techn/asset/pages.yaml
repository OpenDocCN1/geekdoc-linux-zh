- img_proc: true
  md: 'The operation of RAID5 is described in detail in Configuration and Capacity
    Planning for Sun Servers by Brian Wong. In essence, a parity disk is maintained
    alongside stripe to provide storage that is protected against failure, without
    the full duplication overhead of mirroring. Writes must calculate parity that
    is rotated through the disks. A write must do the following:


    +   1. Read the parity and old data blocks.

    2. Insert the small write into the block.

    3. Calculate new parity data.

    4. Write to a separate log that ensures consistent data integrity.

    5. Write data and parity back to the disk.


    The problem is that this sequence takes approximately triple the service time
    of a normal write and one-third the throughput of a single disk. This situation
    may be encountered with software RAID5 implementations of DiskSuite and VxVM when
    the workload consists of many small writes.


    Reading the RAID5 combination performs like a normal stripe, with a throughput
    of N-1 disks and service time of one.


    If a disk has failed, the read must reconstruct the missing data by performing
    extra reads; overall, it is best to assume that degraded throughput is about the
    same as.


    # RAID5 for Large Requests


    FIGURE 5-23 illustrates RAID5 for large requests.


    ![](img/7613e130542edcd7529aeccf7bedcadc_131_0.png)


    FIGURE 5-23 RAID5 for Large Requests Schematic'
  merge: -1
  pgno: 131
- img_proc: true
  md: 'When a write is large enough to include the full stripe width, there is no
    need to read any of the data, so all the writes and the parity can be written
    immediately. Capacity is similar to a stripe; it has similar read and write performance
    and the throughput of N-1 disks. The service time for the transfer is reduced
    as the size of each write is reduced by the factor N-1.


    Overall, there is less load on the disk interconnect than it takes to keep a mirror
    synchronized.


    If a disk fails in degraded mode, throughput and service are similar since the
    entire stripe is read and written as a unit. Extra CPU time is used to regenerate
    the missing data.


    # Cached RAID5


    FIGURE 5-24 illustrates cached RAID5.


    ![](img/7613e130542edcd7529aeccf7bedcadc_132_0.png)


    When a nonvolatile RAM cache is added to a RAID5 setup, it works much more efficiently.
    There is no need for a recovery log disk, since the log that keeps track of partially
    complete operations can be kept in nonvolatile memory.


    The cache provides fast service time for all writes. Interconnect transfer time
    is the only component. The cache optimizes RAID5 operations because it allows
    all writes, whether large or small, to be converted to the optimal full-stripe
    operations.


    The RAM cache is not normally large enough (in comparison to the size of the disks)
    to provide any benefit to read performance.'
