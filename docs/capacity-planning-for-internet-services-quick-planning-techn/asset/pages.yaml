  md: '# # Weekly Summary


    Summarize the week''s activity into four or five lines of text (see FIGURE 6-16).


    # ## Weekly Status Report: April 18, 2000


    The site ran smoothly the past week. A new record bandwidth of 253.8 Mbit/s was
    seen on Monday night. User-visible problems caused by nightly backup overrunning
    daytime operation on 14, and 18th. Currently, no configuration changes may go
    into the site without first being approved by the team working on this issue.
    The schedule for hardware upgrade on 12-May is at risk due to component delivery
    longterm.


    FIGURE 6-16 Management Report: Weekly Summary Section


    This summary indicates that user-visible problems over the past week were caused
    by the nightly backup taking too long and spilling over into the high-load daytime
    period, where it adversely affected user response times. It also notes a possible
    schedule slip for the next site upgrade, so that senior managers can expect to
    be involved in contingency planning and supplier meetings to firm up the schedule.


    # # Scenario Planning


    The entire capacity planning process is described in more detail in Chapter 4,
    “Scenario Planning.\ The output from the scenario planning process includes a
    schedule of upgrade events that increase site capacity and a schedule of expected
    increases in load. The important messages to convey to management are whether
    there will be enough capacity to handle the load in the future, and how they should
    manage resources and schedules to keep the site running.


    The weekly report is delivered on Tuesday so that there is time to make all changes
    needed to cope with the expected peak on the following Monday. The entire capacity
    plan is recalculated once a week, based on updated information about schedules
    and expected performance improvements. Taking new current data as a baseline,
    the recalculation also updates the first column with the projected future dates.


    The capacity plan is based on a simple primary bottleneck scenario. The utilization
    shown as a percentage for each scenario. Scenarios that are at risk due to slips
    are colored yellow; scenarios that will have enough capacity are colored green
    and scenarios that are over 90% busy are colored red. The load increases with
    time and takes into account seasonality effects and a marketing campaign which
    is labelled “Mktg Push.\ The load starts at 71%, and actually decreases slightly
    to 65% over the following week due to a seasonal lull. In five weeks on 29-May,
    the load upgrade is scheduled for 12-May and the effect of this upgrade is shown
    in the second column.


