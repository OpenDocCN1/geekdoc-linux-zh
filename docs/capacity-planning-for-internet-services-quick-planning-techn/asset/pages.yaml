- img_proc: true
  md: '# APPENDIX A


    # Sun Constant Performance Metrics


    # Comparative System Capacity Estimations


    The Sun constant performance metric (SCPM) is designed for capacity planning purposes.
    It indicates the processing potential of a combination of hardware and operating
    system. The specific intent of the metric is to enable the comparison of dissimilar
    systems to provide an IT department with an indication of how to plan capacity
    in a consistent and methodical fashion. In addition to comparing systems, the
    metric provides a convenient way of expressing the amount of work being done by
    a system.


    The metric that SCPM is scaled in is called a quanta (Q). The SCPM is adjusted
    according to measured performance values obtained with predictable benchmarks.


    The trends in SCPM values across the operating system should be examined before
    upgrades are made. Examining these trends provides guidance for predicting the
    impact an upgrade may have on system performance. The following measurement tables
    provide a complete list of comparative system capacity estimations for Solaris
    versions 2.5, 2.5.1, 2.6, 7, and 8. In the tables, NCPU stands for the number
    of CPUs.'
  merge: -1
  pgno: 190
