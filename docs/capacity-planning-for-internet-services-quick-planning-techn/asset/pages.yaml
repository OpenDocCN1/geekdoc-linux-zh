    # Service Level Agreements


    With the increasing performance and RAS (reliability, availability, serviceability)
    of Sun servers and software, Solaris™ Operating Environment, or Solaris OE-based
    servers have been encroaching on what has traditionally been the mainframe work
    of mission-critical applications. This relatively new positioning of Sun servers
    in the enterprise has resulted in the necessity for IT departments to apply mainframe
    disciplines to UNIX servers. One of the staples in the mainframe environment that
    still relatively new to the Solaris OE is the service level agreement (SLA). These
    agreements outline the level of availability of mission-critical services between
    the department and end-users.


    This section describes the principles of an SLA; the section "Service Level Management"
    on page 26 outlines the steps that IT departments should take in the analysis
    of the end-users'' computing resource requirements, capabilities of the IT architecture,
    and formulation of the agreement.


    The SLA is just a list of expectations for a given service. Moreover, it is a
    tool for maintaining service availability. It defines the transactional capabilities,
    network latency projections, availability requirements, maintenance windows, escalation
    procedures, and the review process for those services.


    When service levels are not explicitly defined, users will be left on their own
    to formulate their own idea of service levels. All too often, the service levels
    that the users create on their own will not correspond to those of the IT department.
    The unfortunate impacts of not establishing service levels are miscommunication
    and chaos. If proper communication does not take place between the provider and
    consumer, the SLA may be seen as a weapon to use between the two parties, thereby
    negating proper communications and negotiations.


    When used properly, the SLA becomes a bridge of understanding between the IT department
    and the service consumers. These agreements should be used as a base for understanding
    between all parties involved and should define key roles, responsibilities, and
    expectations that have been discussed and agreed upon by all parties. Furthermore,
    the SLA should be reviewed and modified regularly and considered a living document.
    Any proposed modifications should be discussed and agreed to by all parties, before
    inclusion in the SLA.'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'In most established computing environments such as more traditional datacenters,
    SLAs have long been a staple of life. However, in the client/server world, the
    introduction of SLAs usually poses a significant cultural change. Usually, in
    this situation, the traditional technologically focused management needs to give
    way to management based on user satisfaction.


    The SLA should answer five critical questions:


    +   * What expectations do the users have for the service?

    * What expectations do the providers have for the service?

    * What do the users expect from the service provider (IT department)?

    * What does the service provider expect from the users?

    * How can the SLA improve the business process, affect the bottom line, and improve
    availability?


    The answers to these questions may seem deceptively simple, but in reality, they
    may take months of negotiation to work out.


    Nonexistent or poorly defined SLAs can result in unpleasantries, not the least
    of which are:


    +   * The perception of poor service because the IT department fails to meet the
    undocumented expectations of end-users

    * Antagonistic work relationships between end-users and IT staff

    * IT staff providing unprompted support, most likely at a price that the end-user
    is unwilling to pay (downside of this perception is that the IT department may
    be “looking for work” and thus become a target for new budget constraints)

    * Inconsistent support and the possible impression of favoritism between the IT
    staff and end-users


    # Caveats and Problems with Service Level Agreements


    SLAs are not widely used for a number of reasons. Some of the most common are
    derived from the lack of end-user communication and the culture changes for IT
    departments. However, the many long-term benefits of SLAs include increased end-user
    satisfaction, more accurate resource accounting, and more efficient prioritization.
    The following issues are the most common downturns of SLAs:


    +   * IT department and end-user management did not commit substantial time and
    personnel.


    +   * Lines of communication between IT department and end-user community were
    not established.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '+   IT managers could not concisely define, qualify, and quantify IT services
    and costs.


    +   IT managers lacked the marketing skills to identify, price, and sell IT services,
    both internally and externally.


    +   End-users did not know exactly what they wanted or when they wanted it.


    +   IT department failed to set baselines and run benchmarks on existing services
    and caused inaccurate predictions about future services.


    +   SLAs were not realistic and caused tested numbers to fail.


    However, with the right IT skills, either from the internal IT department or external
    consulting organizations, all of these hurdles can be overcome.


    The creation of the first SLA can be a challenging task for any IT department.
    It requires a new look at the service, which is largely from the end-user''s perspective
    and can be a difficult cultural change.


    However, the payoff of establishing and maintaining a SLA is worth the effort
    for several reasons. A well-conveyed SLA can help develop service availability,
    greater end-user satisfaction, and more efficient use of computing resources.
    In, preferable control over IT budgets and long-term budgeting can also be direct
    benefits of SLAs.


    Further, the framework created by the SLA, based on input from the users and IT
    department, provides a number of benefits to IT management. With the SLA, IT manager
    can assign personnel to resources more effectively. Through personnel restrictions,
    whether due to staffing or skill limitations, can be addressed through hiring
    or training. This framework also provides insight into the coordination required
    to optimize enterprise IT spending, reinvestment, and priorities. This insight
    consequently reveals the link between IT service delivery and costs incurred for
    that service.


