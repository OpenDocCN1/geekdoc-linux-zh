    # Performance Factor P


    To simplify the comparison of different disk configurations for a specific workload,
    a workload-specific performance factor can be calculated. The number of underlying
    disks that contribute to performance varies from 1 to stripe width M, depending
    upon configuration and workload.


    The performance factor P can vary for read and write, but it does not include
    cache effects. Here is an example of calculating the performance factor P.


    For small IOPS K ≤ I, that is, request (K) is less than interlace (I).


    If we assume requests are aligned with the stripe interlace, then for any request
    smaller than the interlace, the request will hit only a single disk.


