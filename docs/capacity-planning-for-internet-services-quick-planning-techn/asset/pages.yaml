    # # Measurement Principles


    Assume that anything that is not measured is out of control.


    +   - Measure the business as well as the computer systems and people.

    - Measure and record trends in performance, cost, and availability.

    - Measure things that you have no intention of tuning or controlling.


    Although it may not be obvious, the mere act of measuring something is beneficial.
    There is a natural human instinct to observe measurements, and when a measure
    starts to behave in an odd way, it becomes noticeable and therefore can be corrected
    at an early stage.


    You should not specify all the measurements in advance; however, it is beneficial
    to encourage end-to-end measurement as a culture among the staff. There are some
    stable and important measurement definitions imposed by management; but in addition,
    lightweight, evolving, ad hoc, and experimental measurements are extremely useful.


    If the entire IT staff establishes how to measure everything that they do and
    decorate their walls with plots of those measurements, a large amount of corrective
    feedback will automatically blanket the systems and processes that run the business.


    A system should be built to help the IT staff log arbitrary data into performance
    databases, both automatically and by hand. These databases should have summaries
    and graph plotting that anyone can use and should be as simple and lightweight
    as possible.'
