- img_proc: true
  md: 'To solve this performance trend, we have several choices: we can upgrade the
    server with more CPUs, faster CPUs, or we could move some of the work from the
    machine to another server. This modelled system was a Sun Enterprise 10000 server
    with 250 MHz UltraSPARC CPUs with 4 MB of E-cache. The chosen solution in this
    case is to perform a one-to-one upgrade of the CPUs in the system to 400 MHz UltraSPARC
    CPUs with 8 MB of E-cache using the "Change CPU Name" function of TeamQuest Model,
    shown in FIGURE 7-9. With this solution, we can return to the TeamQuest Model
    window, create alternatives based on the current model, called "what if frames",
    and modify the system resources to predict the performance of the growing workload
    into the new system configuration.


