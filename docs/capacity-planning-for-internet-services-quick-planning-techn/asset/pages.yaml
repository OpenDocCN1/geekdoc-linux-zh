- img_proc: true
  md: 'We can also examine the total system CPU utilization by looking at the spreadsheet
    table data or by viewing the Active Resource Utilization graph (see FIGURE 7-12).
    The CPU and disk active resources are graphed over the current, measured workload,
    as well as over the five steps of compound growth in the new server platform model.


    ![](img/7613e130542edcd7529aeccf7bedcadc_187_0.png)


    **FIGURE 7-12** TeamQuest Model: Upgraded System Active Resource Utilization


    The modelled performance in the new server platform shows that CPU utilization
    approaching 70% at the end of Step 5, five months into our compound growth model.
    By projecting this growth and using the previous model with degrading performance
    in the measured workloads appearing at the 70% CPU utilization threshold, we can
    plan on another upgrade to the system in approximately five months. We could project
    the model out even further with additional growth steps and use other hardware
    upgrade scenarios. To maximize the accuracy of the model and account for possible
    software changes in the workloads, we will continue to monitor and report on the
    performance of the system. In addition we will build a new model at some time
    in the future, before degradation sets in.


    The Active Resource Utilization graph shows that disks are becoming busy throughout
    the model and disk resource queue delays are starting to appear in the "Database_Server,"
    "Database_App1," and "Database_App2" workloads. We could return to the model and
    upgrade the disk subsystems to provide more resource capabilities or make more
    workload resources between them.


