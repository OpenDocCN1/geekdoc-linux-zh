    # Complex Resource Utilization Characteristics


    One important characteristic of complex I/O subsystems is that the utilization
    measurement can be confusing. When a simple system reaches 100% busy, it has reached
    its maximum throughput because only one thing is being processed at a time in
    the I/O device. When the device being monitored is an NFS server, hardware RAID
    disk subsystem, or striped volume, the utilization is clearly much more complex.
    All of these can process many requests in parallel. A simple view of this complexity
    that approximates the results reported by iostat for Solstice DiskSuite MetaDisk
    stripe is shown in Figure 5-17. The VxVM acts the same, but does not report any
    data via iostat.¹'
