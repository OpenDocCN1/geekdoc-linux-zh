  md: '# FIGURE 6-12 Network Throughput Over a Day


    The network plot shows a few spikes of high throughput because of file transfers
    taking place on a local fast network, but its overall shape follows the load average
    fairly closely in this case. The characteristics of these plots show that this
    system is active all the time, and it has a load shape that is typical of many
    Internet sites. The system is quiet overnight, gets busy and plateaus during the
    day, then peaks in the early evening. The CPU and disk plots also show that there
    is extra CPU time during the night and a higher disk data rate associated with
    an online backup taking place. The axis scales have been removed from some of
    these plots, partly to obscure the source of the data and because the absolute
    values are less important than the changes in shape from day to day.


    The memory plots below show a regular batch job creating and deleting a large
    file, and memory and swap space being regularly consumed and free (see FIGURE
    6-13). There are few times when the residence time drops to a low level during
    the backup period. This value is calculated by dividing the page scan rate into
    a system parameter called the headspinlock pages. Since the scan rate can be zero,
    a divide by zero is caught, and the residence time is clamped (see FIGURE 6-14).


    Sustained residence times of 30 seconds or less can be a problem with older Solaris
    OES results. An optional setting for Solaris 7 OE which is also included in the
    kernel patch for Solaris 2.6 and 2.5.1 OEs turns on priority paging. When enabled,
    much higher page scan rates can be sustained without problems because the file
    cache pages are reclaimed before executable code, stack, and heap pages. The rule
    should be modified to have five seconds as the problem level for residence time


    ![](img/7613e130542edcd7529aeccf7bedcadc_154_0.png)'
  merge: -1
  pgno: 154
- img_proc: true
  md: 'when "priority paging = 1" is set in the kernel. Solaris 8 OE uses a complete
    different algorithm, which allows the file cache to be included in the free memory
    value, and the absolute value of free memory to be used directly to see how much
    memory capacity is available for use. In Solaris 8 OE, scanning only occurs when
    the system is extremely short of memory.


    ![](img/7613e130542edcd7529aeccf7bedcadc_155_0.png)


    FIGURE 6-13 Memory and Swap Usage


