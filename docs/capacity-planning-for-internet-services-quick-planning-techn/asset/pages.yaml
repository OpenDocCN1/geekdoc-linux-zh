- img_proc: true
  md: '# Scenario Planning


    Using management inputs and modelling alternative scenarios, you can predict the
    effects of workload mix changes, marketing-driven load changes, performance tuning,
    and hardware upgrades. Start by determining trends of recent history, then add
    forward prediction using business inputs to predict what the future workload should
    look like.


    Trending techniques use a mixture of step functions that track changes in your
    configuration and a technique sometimes as multivariate adaptive statistical filtering
    (MASF). This process extracts cyclic variations from your data so that you can
    see the underlying trends. With this technique, you use analytical models to predict
    the behavior of complex workloads that consist of several classes of user and
    transaction types.


    You should not attempt to build a detailed model of every part of your system.
    Such models are too complex, too hard to calibrate, and would never be finished
    in time to be useful. Model the primary workloads; make sure you include the ones
    like order entry, which make money for your business.


    This chapter provides a guide to successful scenario planning and provides best
    practices for using spreadsheets to create a model for capacity and load. In addition,
    this chapter presents methods for tweaking the model to enhance accuracy.


    # A Recipe for Successful Scenario Planning


    Successful planning must be based on firm foundations. It is quite common for
    planning to be attempted and then abandoned as a technique because the effort
    put in was misdirected and the return on investment (i.e., useful planning results
    obtained) was too low. This recipe provides a step-by-step guide to the process
    and gives examples of the kind of information that needs to be recorded in each
    step.'
  merge: -1
  pgno: 68
- img_proc: true
  md: '# 1. Sketch a simplified system architecture.


    You probably have an overall system architecture diagram showing every machine,
    every network, and all kinds of other details. You need to reduce the complexity
    by looking for the primaries through the system. These are usually the flows that
    either are subject to SLAs or are money-makers for the business. The initial sketch
    should be based on the physical systems in place, since that is the simplest place
    to start. When multiple systems are employed to do the same job, show them as
    a simple repeated set, even if they are not exactly the same. Be ruthless aboutparing
    down the complexity to a minimum to start with. It is better to go too far in
    this direction and add systems back in later than to start off with a too-complex
    architecture and get bogged down trying to model it. FIGURE 4-1 shows an example
    of a physical architecture sketch.


    ![](img/7613e130542edcd7529aeccf7bedcadc_69_0.png)


    FIGURE 4-1 Example Physical Architecture Sketch


    The physical sketch usually needs to be supplemented by a dataflow sketch (FIGURE
    4-2) that shows the way the main classes of users and applications are connected.'
  merge: -1
  pgno: 69
- img_proc: true
  md: '# FIGURE 4-2 Example Dataflow Architecture Sketch


    These sketches provide a framework to which information can be attached. Later
    steps in this recipe refer to the systems and flows.


    # 2. Determine primary bottlenecks.


    The model should concentrate on the primary interfaces. It may be sufficient to
    look at just the CPU load on a central database server, or you may also need to
    watch network capacity or a wider range of systems, depending on your situation.
    The bottlenecks will change over time, so they must be listed explicitly each
    time a scenario is modelled.


    For each of the systems and network interfaces that are identified in the physical
    sketch, record an average utilization during the peak usage period. Record the
    utilization of each network interface as a percentage. For shared network components,
    measure the combined utilization of the network backbone or switch. For each system,
    you need to know the overall CPU utilization and the utilization of the busiest
    disk on that system. The highest utilizations you find are the components most
    likely to be the primary bottlenecks. FIGURE 4-3 shows an example of a physical
    architecture sketch with utilizations.'
  merge: -1
  pgno: 70
- img_proc: true
  md: '![](img/7613e130542edcd7529aeccf7bedcadc_71_0.png)


    FIGURE 4-3 Example Physical Architecture Sketch With Utilizations


    The example shown in FIGURE 4-3 illustrates a system where the primary bottlenecks
    appear to be the CPU and disk on the back-end database and the CPU on the search
    engines. Disk utilizations were found to be very low on the other systems, which
    operate mainly from memory caches.


    # 3. Measure service levels and workload intensities.


    If you have an SLA or some estimates for response times and throughput, then annotate
    the data flow architecture sketch with both the latencies and frequency of transactions
    wherever this can be determined or estimated (see FIGURE 4-4).'
  merge: -1
