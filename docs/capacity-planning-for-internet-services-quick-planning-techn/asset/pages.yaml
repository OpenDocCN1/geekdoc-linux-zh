    actually below 100%. The true utilization must be divided across the number of
    devices, M The average utilization of the underlying drives is much lower than
    iostat reports. The combined throughput and service time is normally called the
    service intensity rho, and it is like a utilization that can be over 100%.


    An alternative approach to this issue argues that if several requests can be serviced
    at once, when a queuing model is used, the model works as if the service time
    was reduced by the same factor, and utilization is still only up to 100%


