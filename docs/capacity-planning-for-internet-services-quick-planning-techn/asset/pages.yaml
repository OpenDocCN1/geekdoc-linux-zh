  md: '# # References


    # # Sun BluePrints OnLine Articles


    The following Sun BluePrints OnLine articles are available at:

    http://www.sun.com/software/solutions/blueprints/browsesubject.html


    # # System Management


    An Overview of Methodology (4/99) by Adrian Cockcroft

    Presents an in-depth overview of service level definitions and interactions and
    the resource management control loop.


    Dynamic Reconfiguration (4/99) by Enrique Vargas

    Provides the fundamentals of DR.


    Managing NFST™ Workloads (4/99) by Richard McDougall, Adrian Cockcroft, and Evert
    Hoogendoorm

    Demonstrates the use and management of NFS.


    Solaris Resource Manager™ (4/99) by Richard McDougall

    Presents an overview and examples of SRM software functions.


    Solaris Resource Manager™ – Decay Factors and Parameters (4/99) by Richard McDougall

    Discusses SRM software, with emphasis on decay factors and parameters.'
  merge: -1
  pgno: 210
- img_proc: true
  md: 'Solaris Resource Manager™ – Decay and Scheduler Parameters (4/99) by Richard
    McDougall


    Continues with the topic of the SRM software decay factor.


    Solaris™ Bandwidth Manager (6/99) by Evert HoogendoornnExplains the benefits of
    the SBM software.


    Load Sharing Facility (6/99) by Tom Bialski

    Describes how a LSF can be used as a resource management tool for running technical
    batch applications such as simulations.


    Dynamic Reconfiguration Requirements for I/O Device Drivers (6/99) by Enrique
    Vargas

    Covers the driver functions that are required to fully support the DR framework.


    Starfire™ Server DR-Detach and DR-Attach Requirements (8/99) by Enrique Vargas

    Provides a complete list of Starfire server prerequisites for enabling attach
    and detach operations on any system board.


    Modelling the Behavior of SRM Software (8/99) by Dr. Neil Gunther, Richard McDougal
    and Adrian Cockcroft.

    Discusses how the SRM software achieves dynamic resource consumption by using
    fair-share CPU scheduling algorithm.


    SRM: Resource Assignment (8/99) by Richard McDougal

    Explains how users are assigned resource nodes and under what circumstances they
    change to ensure that resource limits are allocated correctly.


    Policy-Based Networks (10/99) by Jean-Christophe Martin

    Discusses the network policy concept in greater depth, and shows how it is implemented
    in the SBM software.


    Processing Accounting Data into Workloads (10/99) by Adrian Cockcroft

    Provides information about Solaris OE system accounting and includes code examples
    that extract the data in a usable format and pattern-match it into workloads.


    Observability (12/99) by Adrian Cockcroft

    Discusses capacity planning and performance management techniques.'
  merge: -1
  pgno: 211
- img_proc: true
  md: 'Scenario Planning - Part 1 (02/00) by Adrian Cockcroft


    Discusses scenario planning techniques to help predict future demands. Part 1
    explains how to simplify your model to a single bottleneck.


    Scenario Planning - Part 2 (03/00) by Adrian Cockcroft


    Presents Part 2 of the Scenario Planning article and explains how to follow up
    a simple planning method based on a spreadsheet that is used to break down a problem
    and experiment with alternative scenarios.


    # Sun BluePrints Series


    Other relevant Sun BluePrints books include:


    +   * Resource Management by Richard McDougall, Adrian Cockcroft, Evert Hoogendoorn,
    Enrique Vargas, Tom Bialaski, Sun Press/Prentice Hall, 1999, ISBN 0-13-025855-5


    Demonstrates how to manage system resources to meet system and performance service
    levels. The theory of resource management is introduced, and a detailed analysis
    of what is required to implement resource management in the Solaris OE is explored.
    In addition, Resource Management includes examples of typical system workloads
    and describes how the SRM facilities and products can be used with these workloads.
    These workloads include databases, file services, Web servers, batch tasks, and
    ISP configurations.


    +   * Solaris™ Guide for Windows NT Administrators by Tom Bialaski, Sun Press/Prentice
    Hall, 1999, ISBN 0-13-025854-7


    Describes a method by which experienced Windows NT administrators can leverage
    their networking expertise to quickly get up-to-speed on Solaris OE administration.
    The book covers all important aspects of Windows NT and Solaris OE integration,
    including file, print, email, and Web services.


    +   * Solaris™ PC NetLink: Performance Sizing and Deployment by Don DeVitt, Sun
    Press/Prentice Hall, 2000, ISBN 0-13-026686-8


    Provides information that enables system planners and administrators to install,
    tune, and use their Solaris PC NetLink server to its maximum functionality and
    performance. This book includes information to help system planners scale their
    Solaris PC NetLink server to their own PC environment.


    +   * Backup and Restore Practices For Sun Enterprise™ Servers by Stan Springfellow
    and Miroslav Kivansky by Michael Barto, Sun Press/Prentice Hall, 2000, ISBN 0-13-089401-X'
  merge: -1
  pgno: 212
- img_proc: true
  md: 'Discusses backup and restore best practices is a practical guide for IT organizations
    that are tasked with implementing or revamping a backup/restore architecture.
    The book includes case studies, a methodology, and example runbooks. It addresses
    issues such as scalability and the performance of the restore architecture, criteria
    for selecting tools and technologies, and trade-offs that must be considered.
    The book provides technical guidelines for planning architecture to meet service
    levels, as well as general advice and guidance.


    # SunPS Information and Web Sites


    +   - Sun Professional Services: http://www.sun.com/service/sunps/

    - SunWorld Online: http://www.sunworld.com/


    # Web Sites for Performance Tools


    +   - BMC Corporation for Best/1 and Patrol: http://www.bmc.com

    - SES simulation software: http://www.ses.com

    - TeamQuest Corporation: http://www.teamquest.com

    - The SAS Institute: http://www.sas.com


    # Other Related Books


    +   - Capacity Planning for Web Performance by D. A. Menasco and B. Almeida, Prentice
    Hall, 1998, ISBN: 0136938221

    - Configuration and Capacity Planning for Solaris Servers by Brian Wong, Sun Press
    Prentice Hall, 1997, ISBN: 0133499529

    - The Practical Performance Analyst by Dr. Neil Gunther, iUniverse, 1997, ISBN:
    05912674X

    - Performance Analysis of Transaction Systems by W. H. Highman, Prentice Hall
    1989, ISBN: 0136570089

    Recommended if you are looking for more detailed analytical methods to analyze
    database systems.'
  merge: -1
  pgno: 213
- img_proc: true
  md: '+   Performance Engineering of Software Systems by Connie U. Smith, Addison-Wesley,
    1991; also: http://www.perfeng.com, ASIN: 0201537699

    This book should be required reading for managers of software development organizations.
    It describes a detailed method for engineering performance into applications from
    the beginning, rather than trying to fix them afterwards. A performance engineering
    tool called SPE.ED and training classes are also available.


    +   Practical Queueing Analysis by M. Tanner, Prentice Hall, 1994, ISBN: 0079121098


    +   Sun Performance and Tuning – Java and the Internet (2nd Edition) by Adrian
    Cockcroft and Richard Pettit, Sun Press/Prentice Hall, 1998, ISBN: 0130952494


    +   The Art of Computer System Performance Analysis by Raj Jain, 1991, ISBN: 0471503363

    This is one of the best in-depth books on performance analysis and capacity planning
    techniques.


    +   Web Performance Tuning by Patrick Killelea, O''Reilly, 1998, ISBN: 1565923790'
