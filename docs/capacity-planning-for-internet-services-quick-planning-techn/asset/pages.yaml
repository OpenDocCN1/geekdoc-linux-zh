    +   - File system read cache, that is, access to a data file already in memory,
    no device involved, $E = 5000$


    Main memory provides the best cache for reads, and NVRAM provides the best cache
    for writes. The only disadvantage of the NVRAM cache is that it is clustered,
    highly available disk subsystems, it cannot be used because it is internal to
    each system.


    # # Caveats


    This discussion has concentrated on first-order effects. Many simplifying assumptions
    have been made, so do not depend on this model for fine accuracy. You should use
    this model to get into the right "ballpark," so you can configure your disk subsystem
    appropriately for your workload.


    # # Summary


    This chapter focused on CPU, memory, disk capacity estimation, and the varying
    scalability characteristics that create complicated disk subsystems. In addition,
    this chapter gave examples of system resource modelling and also looked at some
    of the problems of capacity planning for CPU and disk subsystems.


    The next chapter concentrates on the importance of observability requirements
    for information collection and presentation to three different audiences.'
  merge: -1
