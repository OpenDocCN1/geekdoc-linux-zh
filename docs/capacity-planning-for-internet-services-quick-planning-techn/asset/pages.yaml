  md: '# Measuring Disk Storage Capacity


    Capacity planning with SCPM provides a simple method for measuring, reporting,
    and predicting consumption of CPU resources. This same method can be modified
    slightly and applied to disk subsystems. By measuring the transactions and utilization
    of the disk subsystems and projecting against the capabilities of the subsystem
    being consumed, we can create a model for storage capacity planning.


    The first measurable metric used in this method is the total number of I/O activities
    per unit (generally averaged over one second and referred to as I/Os per second,
    or IOPS) generated by the measured workload. This metric can be measured and reported
    with istat, SunMC, or other system monitoring tools. It is critical to the validity
    and accuracy of these metrics that the measurements be taken during a steady state,
    or a time frame when the flow of transactions is relatively constant and indicative
    of normal activity.


    The activity being measured is only related to disk activity, data generated by
    tools that report tape drive, Network File System (NFS), or CD-ROM activity must
    be "cleaned" before being used for capacity planning. The number of disk activities
    is measured and reported for total disk activity, including reads and writes (S),
    as well as individual measurements for disk read activities (Sr) and write activities
    (Sw).


    For the measured period shown in TABLE 5-1, the total number of disk activities
    (S) was 182, which is the sum of the r+w/s column, excluding the nfs1 and st11
    devices (NFS and tape drive utilization).


