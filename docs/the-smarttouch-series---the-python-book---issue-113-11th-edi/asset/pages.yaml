    \ as 110, which is equal to 6 and `r--` is equal to 4. Similarly, `rwx-r-x` can\
    \ be represented as 755.\n\nThere are various types of UNIX file permissions,\
    \ including files that can't be modified or accessed by the current user as they\
    \ belong to another user. If you have the right file permissions then you can\
    \ change the current permissions of a file using the `chmod` command."
  merge: -1
