    # 03 Test your environment


    Let''s ensure that your local environment is set up for scanning Python projects
    by running the following command:


    ```

    srcclr test --pip

    ```


    > To demonstrate how SourceClear works, we''ll start by analysing a public Python
    project called Mezzanine


    This command will display assorted system information that is used by the SourceClear
    CLI, and perform a scan of a test project that uses the specified package manager
    (pip in this case). The package manager information listed is only required if
    you wish to scan a project that uses libraries from the specific package manager.
    After running this command, you should now see output looking similar to the screenshot
    seen below.


    ![](img/e016e192a91ffc1a9e474690a590742f_90_1.png)


    # 04 Scan your Python project


    To demonstrate how SourceClear works, we''ll start by analysing a public Python
    project called Mezzanine (https://github.com/stephenmcd/mezzanine), which is a
    popular content management system built on Django.


    We can scan projects like this by using their GitHub URL:


    ```

    srcclr scan --url https://github.com/stephenmcd/mezzanine

    ```


    Specifying the GitHub URL will perform a shallow clone of the project, scan it,
    and then remove the project once finished. To scan projects you have locally,
    just use the path; for example:


    ```

    srcclr scan /path/to/mezzanine

    ```


    # 05 View the scan report from standard output


    After scanning the project, the output provides an overview of vulnerability and
    GPL licensing information. For this particular scan, the Django 1.8, requests
    2.2.1, and Pillow 2.3.0 Python libraries are associated with 30 different vulnerabilities.
    In addition, the code in this particular project is actually using the vulnerable
    method associated with a Django 1.8 vulnerability.


    # 06 Review the full scan results


    The standard output from the SourceClear agent is helpful, but let''s take a look
    at the full report online. Copy the Full Report Details URL at the bottom of the
    output and paste it into your browser. Once you''ve logged in, you can see the
    full details of this scan, including detailed vulnerability information, license
    information, and a searchable list of the open source libraries that are being
    used. All of the data can be filtered based on attributes of the library, license,
    or vulnerability (i.e. only high risk vulnerabilities, out of date libraries,
    and so on).


    ![](img/e016e192a91ffc1a9e474690a590742f_90_2.png)


    # 07 Fix a security issue


    SourceClear integrates with JIRA and GitHub issues to help you track and fix vulnerabilities.
    In our report, we''ve identified a security issue that is not just part of this
    project, but one where the Mezzanine code directly calls the methods that are
    vulnerable. This is crucial to fix. We''re going to create a GitHub issue for
    this vulnerable method by clicking the


    # Security automation made easy


    Scanning projects from your laptop is a great way to get started, but automating
    the process helps the whole team. Adding security to your workflow can be made
    easy when you add SourceClear scanning inside your Continuous Integration environment.
    Just set up your activity token and add a post-built task. You can get environment-specific
    instructions over at https://www.sourceclear.com/doc/'
