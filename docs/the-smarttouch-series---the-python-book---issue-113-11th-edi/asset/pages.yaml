  md: "# # Web development\n\n# ## Autowiring the\n\n## admin interface\n\nAdmin sections\
    \ can be\nproblematic in their own right. Django provides an extensible admin\
    \ interface for you\n\n![](img/e016e192a91ffc1a9e474690a590742f_136_0.png)\n\n\
    # ### **01** Create Admin User\n\nDjango makes content administration incredibly\
    \ easy and has an admin section available in a default project as standard at\
    \ http://127.0.0.1:8000/admin/. To log in you need to create a superuser account.\
    \ Run the associated command and specify user details as required to then proceed\
    \ and log in.\n\n```\n```python\npython manage.py createsuperuser\n```\n\n```\n\
    \n![](img/e016e192a91ffc1a9e474690a590742f_136_1.png)\n\n# ### **02** Switch on\
    \ blog management\n\nHaving logged in to the administration interface you will\
    \ be greeted with features to manage users and group roles and privileges, which\
    \ alone are very powerful and provided for you by Django. There is not yet, however,\
    \ any access to manage our blog posts so let's turn that on.\n\n# ## Using the\
    \ dev server\n\nDjango ships with a very helpful built-in development server,\
    \ which will help you out by autocompiling and reloading after you have completed\
    \ all of your file changes. All you have to do to start the server is to run the\
    \ 'python manage.py runserver' command from your terminal window within the project\
    \ directory.\n\n# ### **03** Enable Admin Management\n\nTo enable our module and\
    \ associated models to be managed through the admin interface, we need to register\
    \ them with the admin module. Open blog/admin.py and then go on to import and\
    \ register the models in turn (we only have one of these currently though). Save\
    \ the file and refresh the admin site to see the posts that are now available\
    \ to manage.\n\n```\n```python\nfrom django.contrib import admin\n\n# Register\
    \ your models here.\n```\n\n```\n\n# ### **04** Create a View\n\nWith the admin\
    \ interface accepting new submissions for our post class we'll create a view page\
    \ to display them. Open blog/views.py and import the Post class from the models.\
    \ Create a method to obtain all posts from the database and output them as a string.\n\
    \n```\n```python\nfrom django.http import HttpResponse\nfrom blog.models import\
    \ Post\ndef index(request):\n    post_list = Post.objects.order_by('-id')[:5]\n\
    \    output = '<br />'.join([p.title for p in post_list])\nreturn HttpResponse(output)\n\
    ```\n\n```\n\n# ### **05** Manage the URLs\n\nCreate 'blog/urls.py' and add the\
    \ code to import the views that were just made in the module and the accompanying\
    \ URL patterns. Open myblog/urls.py and add the URL function call to implement\
    \ a new URL for the app to display the view. Visit http://127.0.0.1:5000/ blog\
    \ in your browser to render the new view.\n\n```\n```python\n# blog/urls.py\n\
    from django.conf.urls import patterns,url\nfrom blog import views\nurlpatterns\
    \ = patterns('',\n    url(r'^$', views.index, name=\"index\"),\n\n# myblog/urls.py\n\
    urlpatterns + patterns('',\n    url(r'^blog/', include('blog.urls')),\n    url(r'^admin/',\
    \ include(admin.site.urls)),\n```\n\n```\n\n# # Hosting Python apps\n\n![](img/e016e192a91ffc1a9e474690a590742f_136_2.png)\n\
    \n# ## Heroku\n\n### heroku.com\n\nThis app is perhaps one of the most well-known\
    \ cloud hosting providers. Their stack server environments support a number of\
    \ core web app languages including Python as standard. Their unique Toolbelt command-line\
    \ features and integration with Git repositories, as well as being incredibly\
