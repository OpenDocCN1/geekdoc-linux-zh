- pgno: 19
  md: '# ## 50 Python commands


    # ### 26 Ranges


    You may need a list of numbers, maybe in a *for* loop. The command ''range()''
    can create an iterable list of integers. With one parameter, it goes from 0 to
    the given number. You can provide an optional start number, as well as a step
    size. Negative numbers count down.


    # ### 27 Xranges


    One problem with ranges is that all of the elements need to be calculated up front
    and stored in memory. The command ''xrange()'' takes the same parameters and provides
    the same result, but only calculates the next element as it is needed.


    # ### 28 Iterators


    Iteration is a very Pythonic way of doing things. For objects which are not intrinsically
    iterable, you can use the command ''iter(object_name)'' to essentially wrap your
    object and provide an iterable interface for use with other functions and operators.


    # ### 29 Sorted lists


    You can use the command ''sorted(list)'' to sort the elements of a list. You can
    give it a custom comparison function, and for more complex elements can include
    a key function that pulls out a ranking property from each element for comparison.


    ![](img/e016e192a91ffc1a9e474690a590742f_19_0.png)


    # ### 30 Summing items


    Above, we saw the general reduction function reduce. A specific type of reduction
    operation, summation, is common enough to warrant the inclusion of a special case,
    the command ''sum(iterable, object)''. You can include a second parameter here
    that will provide a starting value.


    ![](img/e016e192a91ffc1a9e474690a590742f_19_1.png)


    # ### 31 With modules


    The ''with'' command provides the ability to wrap a code block with methods defined
    by a context manager. This can help clean up code and make it easier to read when
    a given piece of code is supposed to be doing months later. A classic example
    of using ''with'' is when dealing with files. You could use something like ''with
    open("myfile.txt", "r")'' as f''. This will open the file and prepare it for reading.
    You can then read the file in the code block with ''data=f.read()''. The best
    part of doing this is that the file will automatically be closed when the code
    block is exited, regardless of the reason. So, even if the code block throws an
    exception, you don''t need to worry about closing the file as part of your exception
    handler. If you have a more complicated ''with'', for example, you can create
    a context manager class to help out.


    # ### 32 Printing


    The most direct way of getting output to the user is with the print command. This
    will send text out to the console window. If you are using version 2.X of Python,
    there are a couple of ways you can use the print command. The most common way
    had been simply call it as ''print "Some text"''. You can also use print with
    the same syntax that you would use for any other function. So, the above example
    would look like ''print("Some text")''. This is the only form available in version
    3.X. If you use the function syntax, you can add extra parameters that give you
    finer control over this output. For example, you can give the parameter ''file=myfile.txt''
    and get the output from the print command being dumped into the given text file.
    It also will accept any object that has some string representation available.


    > “A classic example of using ''with'' is when dealing with files. The best part
    of doing this is that the file will automatically be closed when the code block
    is exited, regardless of the reason”


    ![](img/e016e192a91ffc1a9e474690a590742f_19_2.png)


    # ### 33 Memoryview


    Sometimes, you need to access the raw data of some object, usually as a buffer
    of bytes. You can copy this data and put it into a bytearray, for example. But
    this means that you will be using extra memory, and this might not be an option
    for large objects. The command ''memoryview(object_name)'' wraps the object handed
    in to the command and provides an interface to the raw bytes. It gives access
    to these bytes an element at a time. In many cases, elements are the size of one
    byte. But, depending on the object details, you could end up with elements that
    are larger than that. You can find out the size of an element in bytes with the
    property ''itemsize''. Once you have your memory view created, you can access
    the individual elements as you would get elements from a list (item_view[1], for
    example).'
