- pgno: 167
  md: 'Use Python with Pi


    # Hack a toy with the Raspberry Pi: Part 1


    Learn how to master four simple hacks and embed them into a toy


    # Resources


    +   * An old/new toy

    * Resistors

    * Small disc motor

    * LED

    * A radio

    * Small webcam

    * Female-to-female jumper jerky wire


    Combining an old toy and a Raspberry Pi, you can embed a selection of components
    to create your own augmented toy that responds to user input. For example, take
    a £3 R2-D2 sweet dispenser, light it up, play music and stream a live web feed
    to your mobile device. Part one of this two-part tutorial covers setting up four
    basic features: an LED for the eye, a haptic motor to simulate an electric shock,
    a webcam stream from a hidden camera and the Star Wars theme tune broadcast to
    a radio. You may choose to combine these with your own hacks or use them as standalone
    features in other projects.


    Don''t feel limited to just using a Star Wars toy either – we used the R2D2 figure
    because it was cheap, available and popular, but there''s no limit to the toys
    that you can experiment with. Action figures (provided that they can be disassembled
    and/or have a stand or cavity that can be used to hold the electronics) and plushy
    or cuddly toys both lend themselves well to this kind of maker project, especially
    if they accompany a movie or TV show that has recognisable music or sound effects
    that you can make them broadcast. Part two covers how to set up the toy and set
    up triggers to start features.


    ![](img/e016e192a91ffc1a9e474690a590742f_167_0.png)


    R2D2 is © LucasFilm'
  merge: -1
  img_proc: true
- pgno: 168
  md: "# ## 01 Set up an LED\n\nLEDs are really easy to set up and control. They make\
    \ a nice addition to your toy and can be used as eyes, flashing buttons or, in\
    \ this example, R2-D2's radar eye. Take your LED and hold the longest leg; this\
    \ is the positive arm and connects to the input. Wrap the resistor around the\
    \ leg and attach to a female jumper jerky wire. Now take the negative arm and\
    \ attach this to another jumper wire.\n\n# ## 02 Attach the LED\n\nTake the positive\
    \ wire, the one with the resistor, to GPIO 17, which is physical pin number 11\
    \ (look at the far-left top pin and count down six pins). This pin will provide\
    \ the current that powers the LED. Connect the other wire to any of the ground\
    \ pins, (GND) 6, 9, 14, 20, 39; you may need to move this around (later as you\
    \ add more wires for the other components.\n\n# ## 03 Light up the LED\n\nTo turn\
    \ the LED on and off, use the gpiozero library, which was developed to simplify\
    \ the interaction between code and a physical computer. Open the LX Terminal and\
    \ type\n\n```\nsudo apt-get install python3-gpiozero\n```\n\nto install the library\
    \ (Remove the ‘3’ if you want to use it with Python 2). Once installation is completed,\
    \ open a new Python window and import the LED module (line 2 of the following\
    \ code). Assign the pin number of the LED (line 3) and finally turn it on and\
    \ off (lines 6 and 8). Save your code and run it to make the LED flash. Import\
    \ the timings to suit your own project.\n\n```\nimport time\nfrom gpiozero import\
    \ LED\nled = LED(17)\nled.off()\n\nwhile True:\n    led.on()\n    time.sleep(0.5)\n\
    \    led.off()\n    time.sleep(0.5)\n```\n\n# ## 04 Add a vibration\n\nYou may\
    \ want the toy to vibrate or shake when it is touched. R2-D2 is known for giving\
    \ out electric shocks and a safe way to emulsate this is to add haptic feedback,\
    \ similar to that when you press a key on the screen of your mobile. Pimoroni\
    \ stocks a suitable disc motor (bit.ly/29HiEla), which will deliver a short vibration.\
    \ Take each of the wires and connect them each to a female-to-female jumper wire.\n\
    \n![](img/e016e192a91ffc1a9e474690a590742f_168_0.png)\n\n# ## 05 Wire up the disc\
    \ motor\n\nTake the positive wire from the motor (usually coloured red) and attach\
    \ it to GPIO pin 9; this is physical pin number 21. The black wire connects to\
    \ a ground pin - the nearest is physical pin 25; from pin 21, drop down two pins\
    \ on the left and this is number 25. Start a new program or add the code to your\
    \ existing program. Import the RPi.GPIO library (line 1) and set the board to\
    \ the BCM setting. This ensures that the GPIO numbering system is used.\n\n```\n\
    import RPi.GPIO as GPIO\nGPIO.setmode(GPIO.BCM)\nimport time\n```\n\n# ## 06 Turn\
    \ the motor on\n\nTo enable the motor, first set the output pin, number 9. This\
    \ tells the program that GPIO pin 9 is an output. Next, set the GPIO pin to ‘HIGH’\
    \ (line 2), this is the same as turning it on. Current flows through and your\
    \ motor will turn on. Add a short pause (line 3) before setting the output to\
    \ LOW, which turns the motor off. Play around with the timings to find the perfect\
    \ pause for your needs\n\n```\nsudo apt-get install python3-gpiozero\nGPIO.output(9,\
    \ GPIO.HIGH)\ntime.sleep(5)\nGPIO.output(9, GPIO.LOW)\n```\n\n# ## 07 Hack a web\
    \ camera\n\nA small web camera can be hidden within the toy as an eye or more\
    \ discreetly within the body of the toy. This can be used to take photos or stream\
    \ a live feed to a laptop or mobile device. Take your webcam and carefully strip\
    \ away the plastic shell so you are left with the board and lens. Depending on\
    \ the size of your toy, adjust the casing so that it fits and can be hidden.\n\
    \n![](img/e016e192a91ffc1a9e474690a590742f_168_1.png)\n\n# ## R2-D2 in action\n\
    \nCheck out the video of the completed R2-D2 toy hack and see the features in\
    \ action. This may give you some ideas for your own toy hack.\nyoutu.be/VnJAs5JSY"
  merge: -1
  img_proc: true
- pgno: 169
  md: "# Use Python with Pi\n\nSet up a static IP address\nEach time you connect to\
    \ the internet, your Pi will be given a new IP address, this is called a dynamic\
    \ IP address. This can cause issues, as when it changes, other devices will no\
    \ longer be able to locate your Pi. To create one that stays the same (a static\
    \ IP address), load the LX Terminal, type ifconfig and make a note of the inet\
    \ addr, the Broadcast and the Mask numbers. Then type route -n and note down the\
    \ Gateway address. Now type sudo nano /etc/network/interfaces, find the line iface\
    \ wlan0 inet dhcp and change it to:\n\n```\n```iface wlan0 inet static\n    address\
    \ 192.168.1.5\n    netmask 255.255.255.0\n    gateway 192.168.1.1\n    network\
    \ 192.168.1.0\n    broadcast 192.168.1.255```\n```\n\nReplace the numbers with\
    \ yours (which you noted down). Press CTRL+X together to save and exit the nano\
    \ text editor. When you reboot your Pi, it will now have a static IP address which\
    \ will not change when you reboot or reconnect.\n\n![](img/e016e192a91ffc1a9e474690a590742f_169_0.png)\n\
    \nInstall the web server\nTo set up the web server, open the LX Terminal and update\
    \ your Raspberry Pi by typing sudo apt-get update. sudo apt-get upgrade. Next,\
    \ install the Motion software that will control the webcam: type sudo apt-get\
    \ install motion. Once it is finished, attach your USB webcam and type lsusb and\
    \ you will see that your webcam is recognised.\n\n![](img/e016e192a91ffc1a9e474690a590742f_169_1.png)\n\
    \nConfigure the software – part 1\nThere are now several configurations to change\
    \ in order to get the most suitable output from the camera. You can experiment\
    \ with these to see which produces the best results. In the LX Terminal, type:\n\
    \n```\n`sudo nano /etc/motion/motion.conf`\n```\n\n...to load the configuration\
    \ file. Locate the daemon line (you can find the lines by pressing CTRL+H, which\
    \ loads a keyword search) and ensure that it is set to ON; this will start Motion\
    \ as a service when you boot your Pi. Next, find the webcam_localhost and set\
    \ this to OFF so that you can access motion from other computers and devices.\n\
    \n![](img/e016e192a91ffc1a9e474690a590742f_169_2.png)\n\nConfigure the software\
    \ – part 2\nNext, find the stream_ port, which is set to 8080. This is the port\
    \ for the video and you can change it if you are having issues viewing the feed;\
    \ 8081 provides a stable feed. Then, find the control_localhost line and set it\
    \ to OFF. The port that you will access the web config interface is if you have\
    \ the control_ port line and the default is 8080; again, you can change it if\
    \ you have any streaming issues. The frame rate is the number of frames per second\
    \ that are captured by the webcam. The higher the frame rate, the better the quality,\
    \ but setting it higher than 6fps will slow the Pi's performance and produce lag.\
    \ Finally, set the post _capture and specify the number of frames to be captured\
    \ after motion has been detected.\n\nRunning Motion as a daemon\nA daemon is a\
    \ program that runs in the background providing a service; in this project you\
    \ want to run Motion. You do not want to manually have to start it every time\
    \ you load the Pi; it is better that it automatically starts at bootup. In the\
    \ LX Terminal, type sudo nano /etc/default/ motion to edit the file. To get Motion\
    \ to run as a service from bootup, you need to change the start_ in the LX Terminal,\
    \ type sudo nano /etc/default/motion to edit the file. To get Motion to run as\
    \ a service from bootup, you need to change the start_ motion_daemon line to:\
    \ yes\n\n```\n`start_motion_daemon=yes`\n```\n\nSave and exit the file using CTRL+X\
    \ and restart your Pi.\n\n![](img/e016e192a91ffc1a9e474690a590742f_169_3.png)\n\
    \nStarting the web feed\nBefore viewing the feed, make a note of your IP address.\
    \ In the LX Terminal, type sudo ifconfig, although you will have set this in step\
    \ 8. Then start Motion by typing sudo service motion start. Wait for few seconds\
    \ for it to initiate, then open a browser window on your device. Enter the IP\
    \ address of your Pi, including the port number that you set in step 11. If you\
    \ are using VLC player, go to File/Open Network and enter the IP address of your\
    \ Pi followed by the stream_ port – for example, 192.168.1.50:8080. The port number\
    \ in this example is 8080, but you set this in step 11 to 8081 or another value\
    \ of your choice.\n\nInstall the Pi radio software\nP4FFM is a neat little library\
    \ which enables your Raspberry Pi to broadcast to a radio. Note that this is only\
    \ for experimentation and should you want to make a public broadcast you must\
    \ obtain a suitable licence. Getting set up is simple: load the LX Terminal and\
    \ make a new directory to"
