- pgno: 132
  md: '# Web development


    ![](img/e016e192a91ffc1a9e474690a590742f_132_0.png)


    # Why?


    First released in 1991, companies like Google and NASA have been using Python
    for years


    Thanks to the introduction of the Web Server Gateway Interface (WSGI) in 2003,
    developing Python web apps for general web servers became a viable solution as
    opposed to restricting them to custom solutions.


    Python executables and installers are widely available from the official Python
    site at **www.python.org**.


    Mac OS X users can also benefit greatly from using Homebrew to install and manage
    their Python versions. Whilst OS X comes bundled with a version of Python, it
    has some potential drawbacks. Updating your OS may clear out any downloaded packages,
    and


    Apple’s implementation of the library differs greatly from the official release.
    Installing using Homebrew helps you to keep up to date and also means you get
    the Python package manager pip included.


    Once Python is installed the first package to download should be venv using ‘pip
    install venv’, which enables you to create project-specific shell environments.
    You can run projects on separate versions of Python with separate project-specific
    packages installed.


    Check out the detailed Hitchhiker’s Guide to Python for more information: docs.python-guide.org/en/latest.


    # Frameworks


    Let’s take a look at some of the frameworks available when developing Python web
    applications


    # Django djangoproject.com


    GOOD FOR: Large database-driven web apps with multi-user support and sites that
    need to have highly customisable admin interfaces


    Django contains a lot of impressive features, all in the name of interfaces and
    modules. These include auto-creating admin interfaces and database migration management
    tools by default for all of your projects and applications. Django will help to
    enable rapid application development for enterprise-level projects, whilst also
    enabling a clear modular reusable approach to code using sub-applications.


    # Tornado tornado.web.org


    GOOD FOR: Web socket interaction and long polling due to its ability to scale
    to manage vast numbers of connections


    Tornado is a networking library that works as a non-blocking web server and web
    application framework. It’s known for its high performance and scalability and
    was initially developed for Friendfeed, which was a real-time chat system that
    aggregated several social media sites. It closed down in April 2015 as its user
    numbers had declined steadily, but Tornado remains as active and useful as ever.


    # Flask flask.pocoo.org


    GOOD FOR: Creating full-featured RESTful APIs. Its ability to manage multiple
    routes and methods is very impressive


    Flask’s aim is to provide a set of commonly used components such as URL routing
    and templates. Flask will also work on controlling the request and response objects,
    all-in-all this means it is lightweight but is still a powerful microframework.


    # Pyramid pylonsproject.org


    GOOD FOR: Highly extensible and adaptable to any project requirement. Not a lightweight
    system either


    Heavily focused on documentation, Pyramid brings all the much needed basic support
    for most regular tasks. Pyramid is open source and also provides a great deal
    of extensibility – it comes with the powerful Werkzeug debugger too.


    # Werkzeug werkzeug.pocoo.org


    GOOD FOR: API creation, interacting with databases and following strict URL routes
    whilst managing HTTP utility


    Werkzeug is the underlying framework for Flask and other Python frameworks. It
    provides a unique set of tools that will enable you to perform URL routing, processes
    as well as request and response objects, and it also includes a powerful debugger.


    ![](img/e016e192a91ffc1a9e474690a590742f_132_1.png)


    +   - overview // docs // community // snippets // extensions // search


    *Flask is a microframework for Python based on Werkzeug, Jinja 2 and good intentions.
    And before you ask: It’s BSD licensed!*


    Flask is Fun Latest Version: 0.10.1


    ```

    ```python

    from flask import Flask

    app = Flask(__name__)

    ```


    ```'
