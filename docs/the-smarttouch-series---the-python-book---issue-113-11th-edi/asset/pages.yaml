    \ functions, and because we’re using Python 2, we need to call it with **global**\
    \ from here to make sure the game can be reset properly.\n\n**19 Dice rolls**\n\
    The roll function has been removed from the **gui** function as so not to create\
    \ any code errors with some of its variables. It can be easily called within the\
    \ nested functions. It hasn’t changed at all from the original code.\n\n**20 Hand\
    \ of dice**\nLike roll, nothing has changed for the **hand** function. It’s simply\
    \ now placed outside the **gui** function for the exact same reasons. It also\
    \ means that you can easily import this function into another script if you wish.\n\
    \n**21 GUI start**\nAs we’ve mentioned last month and in the Hangman code, we\
    \ put all the GUI code into a function so that we can call on it when we want\
    \ to. In this case, pressing the Poker Dice button on the main interface activates\
    \ **pokerdice.gui**, which is this function.\n\n**22 First roll**\nAs the window\
    \ opens, we immediately make the first roll. This is then sorted, each number\
    \ is attributed to a card, and then the result is created to be displayed in the\
    \ main window. This is similar to how it worked before, but instead it’s now entered\
    \ into the StringVars for the interface towards the end of the script\n\n**23\
    \ Start game**\nWhen we activate the button that starts **game**, it immediately\
    \ sends us to the rest of the code. This would also work if you had the button\
    \ go to the **throws** function instead; however, you can add more functions to\
    \ this part if you wish.\n\n**24 Dice selection**\nThe first thing we do is find\
    \ out what checkboxes have been ticked by the player. We then put these in a list\
    \ so we can change out the correct dice numbers. We’ve also brought in **dice**\
    \ so we can check against what the current dice rolls are.\n\n```\n#!/usr/bin/env\
    \ python2\nfrom Tkinter import *\nfrom ttk import *\nimport random\nfrom itertools\
    \ import groupby\ndice = 0\n```\n\n```\ndef roll(roll_number):\n    numbers =\
    \ range(1,7)\n    dice = range(roll_number)\n    iterations = 0\n    while iterations\
    \ < roll_number:\n        iterations = iterations + 1\n        dice[iterations-1]\
    \ = random.choice(numbers)\n    return dice\n```\n\n```\ndef hand(dice):\n   \
    \ dice_hand = [len(list(group)) for key, group in groupby(dice)]\n    dice_hand.sort(reverse=True)\n\
    \    straight1 = [1,2,3,4,5]\n    straight2 = [2,3,4,5,6]\n    if dice == straight1\
