- pgno: 11
  md: "# # Get started with Python\n\nRemember that tuples are immutable, although\
    \ we can access the elements of them like so\n\n```\n```\nprint(str(hello_tuple[0]))\n\
    # We can't change the value of those elements like we just did with the list\n\
    # Notice the use of the str function above to explicitly convert the integer #\
    \ value inside the tuple to a string before printing it.\n```\n\n```\n\nLet's\
    \ create a sentence using the data in our hello_dict\n\n```\n```\nprint(hello_dict[\"\
    first_name\"] + \"'\" + hello_dict[\"last_name\"] + \" has \" + hello_dict[\"\
    eye_colour\"] + \" eyes.\")\n```\n\n```\n\nA tidier way of doing this would be\
    \ to use Python's string formatter\n\n```\n```\nprint(\"{} has {} eyes.\".format(hello_dict[\"\
    first_name\"], hello_dict[\"last_name\"], hello_dict[\"eye_colour\"]))\n```\n\n\
    ```\n\n# ## Control structures\n\nIn programming, a control structure is any kind\
    \ of statement that can change the path that the code execution takes. For example,\
    \ a control structure that decided to end the program if a number was less than\
    \ 5 would look something like this:\n\n```\n```\n#!/usr/bin/env python2\n\nimport\
    \ sys # Used for the sys.exit function\n\nint_condition = 5\n\nif int_condition\
    \ < 6:\n    sys.exit(\"int_condition must be >= 6\")\nelse:\n    print(\"int_condition\
    \ was >= 6 – continuing\")\n```\n\n```\n\nThe path that the code takes will depend\
    \ on the value of the integer int_condition. The code in the 'if' block will only\
    \ be executed if the condition is true. The import statement is used to load the\
    \ Python system library; the latter provides the exit function, allowing you to\
    \ exit the program, printing an error message. Notice that indentation (in this\
    \ case four spaces per indent) is used to indicate which statement a block of\
    \ code belongs to.\n\n'If' statements are probably the most commonly used control\
    \ structures. Other control structures include:\n\n+   - **'For'** statements,\
    \ which allow you to iterate over items in collections, or to repeat a piece of\
    \ code a certain number of times,\n- **'While'** statements, a loop that continues\
    \ while the condition is true.\n\nWe're going to write a program that accepts\
    \ user input from the user to demonstrate how control structures work. We're calling\
    \ it **construct.py**.\n\nThe 'for' loop is using a local copy of the current\
    \ value, which means any changes inside the loop won't make any changes affecting\
    \ the list. On the other hand however, the 'while' loop is directly accessing\
    \ elements in the list, so you could change the list there should you want to\
    \ do so. We will talk about variable scope in some more detail later on. The output\
    \ from the above program is as follows:\n\n```\n```\n[liam@liams-laptop Python]$\
    \ ./construct.py\nHow many integers? 3\nPlease enter integer 1: 1\nYou must enter\
    \ an integer\nPlease enter integer 1: 5\nPlease enter integer 2: 2\nPlease enter\
    \ integer 3: 6\nUsing a for loop\n5\n2\n6\nUsing a while loop\n5\n2\n6\n```\n\n\
    ```\n\n# ## Indentation in detail\n\nAs previously mentioned, the level of indentation\
    \ dictates which statement a block of code belongs to. Indentation is mandatory\
    \ in Python, whereas in other languages, sets of braces are used to organise code\
    \ blocks. For this reason, it is essential that you use a consistent indentation\
    \ style. Four spaces are typically used to represent a single level of indentation\
    \ in Python. You can use tabs, but tabs are not well defined, especially if you\
    \ happen to open a file in more than one editor.\n\n> > “The 'for' loop uses a\
    \ local copy, so changes in the loop won't affect the list”\n\n# ## More about\
    \ a Python list\n\nA Python list is similar to an array in other languages. A\
    \ list or tuple in Python can contain data of multiple types, which is not usually\
    \ the case with arrays in other languages. For this reason, we recommend that\
    \ you only store data of the same type in a list. This should almost always be\
    \ the case anyway due to the nature of the way data in a list would be processed."
  merge: -1
  img_proc: true
- pgno: 12
  md: "The number of integers we want in the list\n\n```\n#!/usr/bin/env python2\n\
    \n# We're going to write a program that will ask the user to input an arbitrary\n\
    # number of integers, store them in a collection, and then demonstrate how the\n\
    # collection would be used with various control structures.\nimport sys # Used\
    \ for the sys.exit function\ntarget_int = raw_input(\"How many integers?\")\n\n\
    # By now, the variable target_int contains a string representation of\n# whatever\
    \ the user typed. We need to try and convert that to an integer but\n# be ready\
    \ to # deal with the error if it's not. Otherwise the program will\n# crash.\n\
    try:\n    target_int = int(target_int)\nexcept ValueError:\n    sys.exit(\"You\
    \ must enter an integer\")\n\n```\n\nA list to store the integers\n\n```\nints\
    \ = list()\n\n```\n\nThese are used to keep track of how many integers we currently\
    \ have\n\n```\ncount = 0\n\n# Keep asking for an integer until we have the required\
    \ number\nwhile count < target_int:\n    new_int = raw_input(\"Please enter integer\
    \ {0}:\".format(count + 1))\n    isint = False\n    try:\n\n```\n\nIf the above\
    \ succeeds then isint will be set to true: isint =True\n\n```\n        new_int\
    \ = int(new_int)\n\n    except:\n        print(\"You must enter an integer\")\n\
    \n# Only carry on if we have an integer. If not, we'll loop again\n# Notice below\
    \ I use ==, which is different from =. The single equals is an\n# assignment operator\
    \ whereas the double equals is a comparison operator.\nif isint == True:\n   \
    \ # Add the integer to the collection\n    ints.append(new_int)\n    # Increment\
    \ the count by 1\n    count += 1\n\n```\n\nBy now, the user has given up or we\
    \ have a list filled with integers. We can loop through these in a couple of ways.\
    \ The first is with a for loop\n\n```\nprint(\"Using a for loop\")\nfor value\
    \ in ints:\n    print(str(value))\n\n```"
