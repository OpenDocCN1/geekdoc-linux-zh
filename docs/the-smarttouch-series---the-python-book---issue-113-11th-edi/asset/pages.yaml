- pgno: 144
  md: "![](img/e016e192a91ffc1a9e474690a590742f_144_0.png)\n\n![](img/e016e192a91ffc1a9e474690a590742f_144_1.png)\n\
    \n# Django is an incredibly powerful and simple-to-use language\n\n# 15 Setup\
    \ the admin page\n\nThe admin page has a generic, usable template, but you need\
    \ to configure it to view, edit, create and delete posts. First, create a new\
    \ file admin.py in the blog directory, **and enter:**\n\n```\nfrom blog.models\
    \ import Post\nfrom django.contrib import admin\n\nadmin.site.register(Post)\n\
    ```\n\nTo have the posts display nicely on the site, edit models.py **and add:**\n\
    \n```\nclass Post(models.Model):\n  ...\n  def __unicode__(self):\n    return\
    \ self.title\n```\n\n**Save, and run:**\npython manage.py syncdb\n\nThe admin\
    \ page is now usable! You should be able to see the other posts. And it's now\
    \ a lot easier to add more.\n\n# 16 Activate the front-end\n\nOpen up urls.py\
    \ from the myblog directory in your editor **and add the following to the urls\
    \ patterns section:**\n\n```\nurl(r\"^myblog/\", 'blog.urls.index'),\n```\n\n\
    One of the examples in the file can be uncommented and edited to this as well.\
    \ It points to a model we will now create.\n\n# 17 Create another urls file\n\n\
    You need to create another urls file in the app directory. In our case blog/urls.py.\
    \ Create it **and add the following:**\n\n```\nfrom django.template import Context,\
    \ loader\n\nfrom blog.models import Post\nfrom django.http import HttpResponse\n\
    def index(request):\n  poll_list = Post.objects.all()\n  t = loader.get_template('blog/index.html')\n\
    \  c = Context({\n    'post_list': poll_list,\n  })\n  return HttpResponse(t.render(c))\n\
    ```\n\n# 18 Start the template\n\nThe code we've just written looks for a template\
    \ that currently doesn't exist. We first need to tell Django where templates are\
    \ to be looked for in settings.py:\n\n```\nTEMPLATE_DIRS = (\n  '/home/user/projects/templates',\n\
    )\n```\n\nYou can put the template directory wherever you want, as long as it's\
    \ referenced here.\n\n# 19 Write a template\n\nNow to write the site template.\
    \ In our example, we're using index.html:\n\n```\n{% for post in post_list %}\n\
    \  {{ post.title }}\n  {{ post.author }}\n  {{ post.pub_date }}\n  {{ post.post\
    \ }}\n{% endfor %}\n```\n\nThis needs to be located in a folder with the same\
    \ name as your app within the template directory.\n\n![](img/e016e192a91ffc1a9e474690a590742f_144_2.png)\n\
    \n# 20 View your handiwork\n\nLet's make sure this worked. Start the developer\
    \ **server with:**\npython manage.py runserver\n\nNow navigate to 127.0.1.0:8000/myblog/\n\
    \nIt's not pretty, but you should have successfully called upon your stored data.\
    \ We'll spend the next steps tidying it up a bit.\n\n# 21 Format the front page\n\
    \nGo back into the template file, index.html, **and add the following html tags:**\n\
    \n```\n{% for post in post_list %}\n  <h2>{{ post.title }}</h2>\n  {{ post.author\
    \ }} on ({{ post.pub_date }})\n  <p>{{ post.post }}</p>\n{% endfor %}\n```\n\n\
    This is just an example – the post can be in any order with any tags.\n\n# 22\
    \ Spruce up the admin list\n\nWe'll do this in the admin.py file in our blog directory;\
    \ open it in your editor and make the **following changes:**\n\n```\nfrom blog.models\
    \ import Post\nfrom django.contrib import admin\nclass Admin(admin.ModelAdmin):\n\
    \  list_display = ['title', 'author',\n    'pub_date']\nadmin.site.register(Post,\
    \ Admin)\n```\n\nIn this case 'list_display' is a fixed variable name.\n\n# 23\
    \ A logical post page\n\nThe new post page on the site might not be in an order\
    \ you comfortable with. We'll change that now in admin.py with the **following\
    \ additions:**\n\n```\nclass Admin(admin.ModelAdmin):\n  list_display = ['title',\
    \ 'author',\n    'pub_date']\n  fields = ['title', 'pub_date',\n    'author',\
    \ 'post']\nadmin.site.register(Post, Admin)\nRemember to save!\n```\n\n# 24 A\
    \ functional blog\n\nSo there you have it! Navigating to 127.0.1.0:8000/admin/\
    \ or 127.0.1.0:8000/myblog/ will show off the fine work you've created. Django\
    \ is dead easy to use once you know how, and there are plenty of tweaks you should\
    \ be able to make after this tutorial.\n\n![](img/e016e192a91ffc1a9e474690a590742f_144_3.png)"
