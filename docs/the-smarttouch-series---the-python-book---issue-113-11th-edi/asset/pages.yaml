  md: "# Create with Python\n\nWe now have a working game environment and moveable\
    \ paddles. The only thing missing is the ball. As with the paddle, we'll stick\
    \ to an OOP approach. Create a new file called **ball.py**.\n\n```\nimport pygame\n\
    from random import randint\nBLACK = (0, 0, 0)\nclass Ball(pygame.sprite.Sprite):\n\
    \    def __init__(self, color, width, height):\n        super().__init__()\n \
    \       self.image = pygame.Surface([width, height])\n        self.image.fill(BLACK)\n\
    \        self.image.set_colorkey(BLACK)\n        pygame.draw.rect(self.image,\
    \ color, [0, 0, width, height])\n        self.velocity = [randint(4,8), randint(-8,8)]\n\
    \        self.rect = self.image.get_rect()\n    def update(self):\n        self.rect.x\
    \ += self.velocity[0]\n        self.rect.y += self.velocity[1]\n    def bounce(self):\n\
    \        self.velocity[0] = -self.velocity[0]\n        self.velocity[1] = randint(-8,\
    \ 8)\n```\n\nWithout delving too deep into the maths of it, we're implementing\
    \ some basic collision detection by checking to see when a ball hits another surface\
    \ and then bouncing it off in the opposite direction, at a 90 degree angle.\n\n\
    Back in our **pong.py** file we'll need to import the new module with `from ball\
    \ import Ball` at the top of our code. We'll then need to add the ball settings\
    \ below those of the paddle:\n\n```\nball = Ball([WHITE],[0,10])\nball.rect.x\
    \ = 345\nball.rect.y = 195\n```\n\nWe made a list of sprites earlier, with an\
    \ entry for paddleA and paddleB. We'll need to add a line for the ball, too: `all_sprites.list.add(ball)`\
    \ .\n\nFinally, after we've updated all the sprites we'll need to keep checking\
    \ if our ball is bouncing off the walls. Add the following code to our **carryOn**\
    \ loop:\n\n```\nif ball.rect.x>=690:\n    ball.velocity[0] = -ball.velocity[0]\n\
    if ball.rect.x<=0:\n    ball.velocity[0] = -ball.velocity[0]\nif ball.rect.y>=490:\n\
    \    ball.velocity[1] = -ball.velocity[1]\nif ball.rect.y<=0:\n    ball.velocity[1]\
    \ = -ball.velocity[1]\n```\n\nThat's the lot. Essentially, we now have a working\
    \ game. Our paddles are controllable by two players and we have a moving ball\
    \ that can bounce around the game environment. The only thing left to do is introduce\
    \ a scoring system. After all, a game can't be properly called a game until there's\
    \ a way for someone to win or lose!\n\nEach player needs to bounce the ball past\
    \ the opponent's paddle to score a point. Let's start off by declaring a variable\
    \ for each player and initialising them at zero. Placing `scoreA = 0` and `scoreB\
    \ = 0` with the rest of the variables\n\n![](img/e016e192a91ffc1a9e474690a590742f_110_0.png)\n\
    \nAbove Fully functioning retro Pong, developed with Python.\n\nTo add points\
    \ to these new variables we'll need to make a slight alteration to the ball bouncing\
    \ code in our **carryOn** loop. Immediately after `if ball.rect.x>=690:` insert\
    \ `scoreA+=1` and after `if ball.rect.x<=0:` place `scoreB+=1`, leaving the rest\
    \ as it is. That ought to do the trick.\n\n# Scores on the doors\n\nNow that we've\
    \ created scores and added them up, we need to display them on the screen. Right\
    \ before `pygame.display.flip()` , insert the following:\n\n```\nfont = pygame.font.Font(None,\
    \ 74)\ntext = font.render(str(scoreA), 1, WHITE)\nscreen.blit(text, (250,10))\n\
    text = font.render(str(scoreB), 1, WHITE)\nscreen.blit(text, (420,10))\n```\n\n\
    Fire it up and give it a go. If all goes to plan, we should now have a working\
    \ game of Pong.\n\nWe've included a full version of the game code on the Archive\
    \ pages on the Linux Format website.\n\nOur game is a two-player experience, much\
