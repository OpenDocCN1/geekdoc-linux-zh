  md: "# Python essentials\n\n**17** The next section of game calls upon a `play_again`\
    \ function. Like the move function, we have human input, asking the player if\
    \ they would like to play again via a text message with `raw_input`, with the\
    \ simple `y/n` suggestion in an attempt to elicit an expected response.\n\n**18**\
    \ Giving users an option of y/n like we have should expect a response in kind.\
    \ The `if` statement checks to see if any of our defined positive responses have\
    \ been entered. As Python doesn't differentiate between upper or lower case, we've\
    \ made sure that it accepts both y and Y. If this is the case, it returns a positive\
    \ response to game, which will start it again.\n\n**19** If we don't get an expected\
    \ response, we will assume the player does not want to play again. We'll print\
    \ a goodbye message, and that will end this function. This will also cause the\
    \ game function to move onto the next section and not restart.\n\n```\n17 def\
    \ play_again() :\n18     answer = raw_input (\"Would you like to play again? y/n:\
    \ \")\n19     if answer in (\"y\", \"Y\", \"yes\", \"Yes\", \"Of course!\"):\n\
    \            return answer\n    else:\n            print \"Thank you very much\
    \ for playing our game. See you next time!\"\n\n20 def scores():\n    global player_score,\
    \ computer_score\n    print \"HIGH SCORES\"\n    print \"Player: \", player_score\n\
    \    print \"Computer: \", computer_score\n\n21 if _name_ == '_main_':\n    start()\n\
    ```\n\n```\nPython Shell\nPython 2.7.3 (default, Sep 26 2012, 21:51:14)\n[GCC\
    \ 4.7.2] on linux2\nType \"copyright\", \"credits\" or \"license()\" for more\
    \ information.\n>>> ========================= RESTART =========================\n\
    \nLet's play a game of Rock, Paper, Scissors.\nRock = 1\nPaper = 2\nScissors =\
    \ 3\nMake a move: 5\nOops! I didn't understand that. Please enter 1, 2 or 3.\n\
    \nRock = 1\nPaper = 2\nScissors = 3\nMake a move: 1\n1...\n2..\n3!\n\nComputer\
    \ threw Rock!\nTie game.\nWould you like to play again? y/n: n\nThank you very\
    \ much for playing our game. See you next time!\nHIGH SCORES\nPlayer: 0\nComputer:\
    \ 0\n>>>\n\nThe code in action\n```\n\n> **ELIF**\n'\nIfAlso has the ELIF(else\
    \ if) operator, which can be used in place of the second IF statement we employed.\
    \ It's usually used to keep code clean, but performs the same function.\n\n**20**\
    \ Going back to the start function, after game finishes we move on to the results.\
    \ This section calls the scores, which are integers, and then prints them individually\
    \ after the names of the players. This is the end of the script, as far as the\
    \ player is concerned. Currently, the code won't permanently save the scores,\
    \ but you can have Python write it to a file to keep it if you wish.\n\n**21**\
    \ The final part allows for the script to be used in two ways. Firstly, we can\
    \ execute it in the command line and it will work fine. Secondly, we can import\
    \ this into another Python script, perhaps if you wanted to add it as a game to\
    \ a collection. This way, it won't execute the code when being imported."
