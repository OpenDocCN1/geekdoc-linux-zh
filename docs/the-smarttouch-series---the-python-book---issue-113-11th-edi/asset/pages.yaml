    # Instant messaging with Python


    How to program both the client – complete with a GUI –

    and server of a simple instant messenger in Python


    # Resources


    +   * **A computer** – running your favourite Linux distribution

    * **Internet connection** – to access documentation

    * **Python 2.x, PyGTK and GObject** – packages installed


    Here we’ll also be using threading, which allows a program to do multiple things
    at once.


    We’ll cover the basics of writing a simple graphical user interface with GTK,
    as well as how to interact with that from a different thread.


    Finally, we’ll be touching on the use of regular expressions to easily analyse
    and extract data from strings.


    Before getting started, you’ll need to have a Python2.x interpreter installed,
    as well as the PyGTK bindings and the Python2 GObject bindings. The chances are
    that if you have a system with a fair amount of software on it, you will already
    have these packages, so it may be easier to wait and see if you’re missing any
    libraries when you attempt to import them. All of the above packages are commonly
    used, so you should be able to install them using your distro’s package manager.


    Here we’ll also be implementing an **instant messenger in Python with a client-server
    architecture**. This means each client connects to the server, which relays any
    message that one client sends to all other clients. The server will also notify
    the other clients when someone joins or leaves the server. The instant messenger
    can work anywhere a ‘TCP’ socket can: on the same computer with the loopback interface,
    across various computers on a LAN, or even over the internet if you were to configure
    your router correctly. However, our messages aren’t encrypted, so we wouldn’t
    recommend that. Writing an instant messenger is an interesting technical problem
    that covers a bunch of areas that you may not have come across while programming
    before.'
