    ```\n\nIn the code listed to the left here, we are opening the URL, then - based\
    \ on regular expression matches - we are discovering the location title, description,\
    \ date, ups, downs and rating. We are also locating video thumbnails and then\
    \ passing them on to XBMС.\n\nLater in the code, we also try to match the URL\
    \ to a video provider. With our plug-in we are supporting YouTube, Vimeo and DailyMotion.\
    \ If this is detected successfully, we call the helper functions to locate the\
    \ XBMС plug-in based playback URL. During this whole parsing process, if any exception\
    \ is raised, the whole loop is ignored and the next JSON item is parsed.\n\n#\
    \ 15 Installing & running the add-on\n\nYou can install the add-on using one of\
    \ the following two methods:\n\n+   - You can copy the plug-in directory to .xbmc/addons.\n\
    - You can install the plug-in from the zip file. To do so, compress the add-on-folder\
    \ into a zip file using the command:\n\n```\n`$ zip -r plugin.video.ludent.zip\
