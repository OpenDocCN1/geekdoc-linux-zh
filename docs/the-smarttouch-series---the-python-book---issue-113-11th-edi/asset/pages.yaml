  md: "![](img/e016e192a91ffc1a9e474690a590742f_122_0.png)\n\nLeft Once finished,\
    \ our mini-game uses the chat console to report your score\n\n# **13 Game over**\n\
    The 13th step is to handle the game over condition.\n\nIf you do stand on the\
    \ mine, the game is over. Use the post to chat code to display a \"Game Over\"\
    \ message in the MinecraftWorld.\n\n```\n```\nmc.postToChat(\"G A M E   O V E\
    \ R\")\n```\n```\n\n# **14 Final score**\nThis is where the final score is displayed.\n\
    \nThe last part of the game is to give a score. This uses the score variable that\
    \ you created in Step 8 and then uses the mc.postToChat code. Convert the score\
    \ to a string first so that it can be printed on the screen. Since your turn has\
    \ ended, add a break statement to end the loop and stop the code from running.\n\
    \n# **15 Safe block**\nThis handles the case where the player is safe.\n\nBut\
    \ what if you missed the mine? The game continues and you'll need to know where\
    \ you have previously been on the board. Use the code mc.setBlock(x1, y1-1, z1,\
    \ 41) to change the block you are standing on into gold or another material of\
    \ your choice. In the code, the Y position is Y – 1, which selects the block beneath\
    \ the player's feet.\n\n# **16 Increment the score**\nThis increases the score\
    \ for each safe move.\n\nAs well as living to play another turn, you also gain\
    \ a point. This is achieved by incrementing the score variable by one each time\
    \ you turn the block gold and return to the beginning of the loop to check the\
    \ status of the next block you stop on. The postToChat is to tell you that you\
    \ have survived another move!\n\n```\n```\nscore = score + 1\nmc.postToChat(\"\
    You were safe!\")\n```\n```\n\n# **17 Run the game**\nThis is the final step to\
    \ run the full game logic.\n\nThis completes the code for the program. Save it\
    \ and then start a Minecraft game. Once the world has been created, run the Python\
    \ program. Move back to the Minecraft window and you will see the board created\
    \ in front of you.\n\n# Full code listing\n\n```\n```\nimport random\nimport time\n\
    from mcpi import minecraft\nmc = minecraft.Minecraft.create()\n\n###Creates the\
    \ board###\nmc.postToChat(\"Welcome to Minecraft MineSweeper\")\nx, y, z = mc.player.getPos()\n\
    mc.setBlocks(x, y-1, z, x+20, y-1, z+20, 58)\n\nglobal mine\nmine = random.randrange(0,\
    \ 11, 1)\n\n###Places the mine###\nmine_x = int(x+mine)\nmine_y = int(y-1)\nmine_z\
    \ = int(z+mine)\nmc.setBlock(mine_x, mine_y, mine_z, 58)\nscore = 0\nmc.postToChat(\"\
    Score is \"+str(score))\n\ntime.sleep(5)\nwhile True:  ###Test if you are standing\
    \ on the mine\n    x1, y1, z1 = mc.player.getTilePos()\n    #print x1, y1, z1\
    \ ##test\n    time.sleep(0.1)\n    score = score + 1\n\n    if (x1, y1-1, z1)\
    \ == (mine_x, mine_y, mine_z):\n        mc.setBlocks(x-5, y-1, z-5, x+5, y+5,\
    \ z+5, 10)\n        mc.postToChat(\"G A M E   O V E R\")\n        mc.postToChat(\"\
    Score is \"+str(score))\n        break\n    else:\n        mc.setBlock(x1, y1-1,\
    \ z1, 41)\n        mc.postToChat(\"GAME  OVER\")\n```\n```"
