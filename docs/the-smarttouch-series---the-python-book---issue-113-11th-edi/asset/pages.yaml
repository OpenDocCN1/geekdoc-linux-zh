    "SHLVL:" 1, "SSH_TTY:" /dev/pts/2, "PWD" " /home/kunal", "LESSOPEN" " /usr/bin''

    lesstpipe

    ... }

    >>> os.name

    ''posix''

    >>> os.linesep

    ''\n''

    ```'
