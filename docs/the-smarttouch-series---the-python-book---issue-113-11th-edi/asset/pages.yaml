  md: '# 50 Python tips


    ![](img/e016e192a91ffc1a9e474690a590742f_25_0.png)


    # Basics


    Python is a programming language that lets you work more quickly and integrate
    your systems more effectively. Today, Python is one of the most popular programming
    languages in the open source space. Look around and you will find it running everywhere,
    from various configuration tools to XML parsing. Here is the collection of 50
    gems to make your Python experience worthwhile...


    # 01  Running Python scripts


    On most of the UNIX systems, you can run Python scripts from the command line.


    ```

    $ python myprogram.py

    ```


    # 02  Running Python programs from Python interpreter


    The Python interactive interpreter makes it easy to try your first steps in programming
    and using all Python commands. You just issue each command at the command prompt
    (>>>), one by one, and the answer is immediate.


    **Python interpreter can be started by issuing the command:**


    ```

    $ python


    kunal@ubuntu:~$ python

    Python 2.6.2 (release26\maint, Apr 19 2009, 01:56:41)

    [GCC 4.3.3] on linux2

    Type "help", "copyright", "credits" or "license" for more information.

    >>> <type commands here>

    ```


    **In this article, all the code starting at the >>> symbol is meant to be given
    at the Python prompt.** It is also important to remember that Python takes tabs
    very seriously – so if you are receiving any error that mentions tabs, correct
    the tab spacing.


    # 03  Dynamic typing


    In Java, C++, and other statically typed languages, you must specify the data
    type of the function return value and each function argument. Python is a dynamically
    typed language; you never have to explicitly specify the data type of anything.
    Based on what value you assign, Python will keep track of the data type internally.'
  merge: -1
  img_proc: true
- pgno: 26
  md: "# 04 Python statements\n\nPython uses carriage returns to separate statements,\
    \ and a colon and indentation to separate code blocks. Most of the compiled programming\
    \ languages, such as C and C++, use semicolons to separate statements and curly\
    \ brackets to separate code blocks.\n\n# 05 == and = operators\n\nPython uses\
    \ '==' for comparison and '=' for assignment. Python does not support inline assignment,\
    \ so there's no chance of accidentally assigning the value when you actually want\
    \ to compare it.\n\n# 06 Concatenating strings\n\nYou can use '+' to concatenate\
    \ strings.\n\n```\n>>> print 'kun'+'al'\nkunal\n```\n\n# 07 The __init__ method\n\
    \nThe __init__ method is run as soon as an object of a class is instantiated.\
    \ The method is useful for any initialization you want to do with your object.\
    \ The __init__ method is analogous to a constructor in C++, C# or Java.\n\n**Example:**\n\
    \n```\nclass Person:\n    def __init__(self, name):\n        self.name = name\n\
    \    def sayhi(self):\n        print 'Hello, my name is', self.\nname = Person('Kunal')\n\
    p.sayhi()\nOutput:\n[$~$src/python $:] python inithethod.py\nHello, my name is\
    \ Kunal\n```\n\n# 08 Modules\n\nTo keep your programs manageable as they grow\
    \ in size, you may want to break them up into several files. Python allows you\
    \ to put multiple function definitions into a file and use them as a module that\
    \ can be imported into other scripts and programs. These files must have a .py\
    \ extension.\n\n**Example:**\n\n```\n# file my_function.py\ndef mimax(a, b):\n\
    \    if a <= b:\n        min, max = a, b\n    else:\n        min, max = b, a\n\
    \    return min, max\nModule Usage\nimport my_function\n```\n\n```\nx, y = my_function.mimmax(25,\
    \ 6.3)\n```\n\n# 09 Module defined names\n\n**Example:**\n\nThe built-in function\
    \ 'dir()' can be used to find out which names a module defines. It returns a sorted\
    \ list of strings.\n\n```\n>>> import time\n>>> dir(time)\n['_doc__', '_file__',\
    \ '__name__',\n'__package__', 'accept2dyear',\n'altzone', 'asctime', 'clock',\n\
    'ctime', 'daylight', 'gmtime',\n'localtime', 'mktimes', 'sleep',\n'strftime',\
    \ 'srptime', 'struct_',\n'time', 'time', 'timezone', 'tzname',\n'tzset']\n```\n\
    \n# 10 Module internal documentation\n\nYou can see the internal documentation\
    \ (if available) of a module name by looking at __doc__.\n\n**Example:**\n\n```\n\
    >>> import time\n>>> print time.clock.__doc__\nclock() -> floating point number\n\
    ```\n\nThis example returns the CPU time or real time since the start of the process\
    \ or since the first call to clock(). This has as much precision as the system\
    \ records.\n\n# 11 Passing arguments to a Python script\n\nPython lets you pass\
    \ whatever you have passed to a script while calling it. The 'command line' content\
    \ is stored in the sys.argv list.\n\n```\nimport sys\nprint sys.argv\n```\n\n\
    # 12 Loading modules or commands at startup\n\nYou can load predefined modules\
    \ or commands at the startup of any Python script by using the environment variable\
    \ $PYTHONSTARTUP. You can set environment variable $PYTHONSTARTUP to a file which\
    \ contains the instructions to load necessary modules or commands.\n\n# 13 Converting\
    \ a string to a date object\n\nYou can use the function 'DateTime' to convert\
    \ a string to a date object.\n\n**Example:**\n\n```\nfrom DateTime import DateTime\n\
    ```\n\n```\ndateobj = DateTime(string)\n```\n\n# 14 Converting a list to a string\
    \ for display\n\nYou can convert a list to a string in either of the following\
    \ ways.\n\n**1st method:**\n\n```\n>>> mylist = ['spam', 'ham', 'eggs']\n>>> print\
    \ ', '.join(mylist)\nspam, ham, eggs\n```\n\n**2nd method:**\n\n```\n>>> print\
    \ '\\n'.join(mylist)\nspam\nham\negees\n```\n\n# 15 Tab completion in Python interpreter\n\
    \nYou can achieve auto completion inside Python interpreter by adding these lines\
    \ to your Python file (or your file for Python to read on startup):\n\n```\nimport\
    \ rlcompleter, readline\nreadline.parse_and_bind('tab: complete')\n```\n\nThis\
    \ will make Python complete partially typed function, method and variable names\
    \ when you press the Tab key.\n\n# 16 Python documentation tool\n\nYou can pop\
    \ up a graphical interface for searching the Python documentation using the command:\n\
    \n```\n$ pydoc -g\n```\n\nYou will need python-tk package for this to work.\n\n\
    # 17 Python documentation server\n\nYou can start an HTTP server on the given\
    \ port on the local machine. This will give you a nice-looking access to all Python\
    \ documentation, including third-party module documentation.\n\n```\n$ pydoc -p\
    \ <portNumber>\n```\n\n# 18 Python development software\n\nThere are plenty of\
    \ tools to help work with Python development. Here are a few important ones:\n\
    \n+   *   **IDLE:** The Python built-in IDE, with autocomplete, function signature\
    \ popup help, and file editing.\n*   **IPython:** Another enhanced Python shell\
    \ with tab-completion and other features.\n*   **Eric5:** A GUI Python IDE with\
    \ autocomplete, class browser, built-in shell and debugger.\n*   **WingIDE:**\
    \ Commercial Python IDE with free license available to open-source developers\
    \ everywhere."
