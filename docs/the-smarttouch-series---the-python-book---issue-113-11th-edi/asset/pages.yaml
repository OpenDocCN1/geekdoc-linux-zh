    \ play a game of Rock, Paper, Scissors.\")\n    while game():\n        pass\n\
    \    scores()\n\ndef game():\n    player = move()\n    computer = random.randint(1,\
    \ 3)\n    result(player, computer)\n    return play_again()\n\ndef move():\n \
    \   while True:\n        print (\n        player = raw_input (\"Rock = 1\\nPaper\
    \ = 2\\nScissors = 3\\nMake a move: \")\n        try:\n            player = int(player)\n\
    \            if player in (1,2,3):\n                return player\n          \
    \  except ValueError:\n                pass\n                print (\"Oops! I\
