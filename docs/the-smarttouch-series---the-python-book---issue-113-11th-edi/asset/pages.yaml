  md: "# # Built-in modules\n\n# ## 19 Executing functions at the time of Python interpreter\
    \ termination\n\nYou can use `atexit` module to execute functions at the time\
    \ of Python interpreter termination.\n\n```\n**Example:**\n```\ndef sum1():\n\
    \    print(4+5)\ndef message():\n    print(\"Executing Now\")\nimport atexit\n\
    atexit.register(sum)\natexit.register(message)\n```\n\n**Output:**\n```\nExecuting\
    \ Now\n9\n```\n```\n\n# ## 20 Converting from integer to binary, hexadecimal and\
    \ octal\n\nUse `bin()`, `hex()` and `oct()` to convert from integer to binary,\
    \ decimal and octal format respectively.\n\n```\n**Example:**\n```\n>>> bin(24)\n\
    '0b11000'\n>>> hex(24)\n'0x18'\n>>> oct(24)\n'030'\n```\n```\n\n# ## 21 Converting\
    \ any charset to UTF-8\n\nYou can use the following function to convert any charset\
    \ to UTF-8.\n\n```\n```\ndata.decode(\"input_charset_here\").encode(\"utf-8\"\
    )\n```\n```\n\n# ## 22 Removing duplicates from lists\n\nIf you want to remove\
    \ duplicates from a list, just put every element into a dict as a key (for example\
    \ with 'none' as value) and then check dict.keys().\n\n```\n```python\nfrom operator\
    \ import itemgetter\ndef distinct(l):\n    d = {}\n    map(itemgetter(d,)*len(l),\
    \ l, [])\n    return d.keys()\n```\n```\n\n# ## 23 Do-while loops\n\nSince Python\
    \ has no do-while or do-until loop constructs (yet), you can use the following\
    \ method to achieve similar results:\n\n```\n```python\nwhile True:\n    do_something()\n\
    \    if condition():\n        break\n```\n```\n\n# ## 24 Detecting system platform\n\
    \nTo execute platform-specific functions, it is very useful to detect the platform\
    \ on which the Python interpreter is running. You can use `sys.platform` to find\
    \ out the current platform.\n\n```\n**Example:**\n\n**On Ubuntu Linux**\n```\n\
    >>> import sys\n>>> sys.platform\n'linux2'\n```\n\n**On Mac OS X Snow Leopard**\n\
    ```\n>>> import sys\n>>> sys.platform\n'darwin'\n```\n```\n\n# ## 25 Disabling\
    \ and enabling garbage collection\n\nSometimes you may want to enable or disable\
    \ the garbage collector at runtime. You can use the `gc` module to enable or disable\
    \ the garbage collection.\n\n```\n**Example:**\n```\n>>> import gc\n>>> gc.enable()\n\
    <builtin-function enable>\n>>> gc.disable()\n<builtin-function disable>\n```\n\
    ```\n\n# ## 26 Using C-based modules for better performance\n\nMany Python modules\
    \ ship with counterpart C modules. Using these C modules will give a significant\
    \ performance boost in complex applications.\n\n```\n**Example:**\n\nCPickle instead\
    \ of Pickle, cStringIO instead of StringIO.\n```\n\n# ## 27 Calculating maximum,\
    \ minimum and sum out of any list or iterable\n\nYou can use the following built-in\
    \ functions.\n\n+   * **max**: Returns the largest element in the list.\n* **min**:\
    \ Returns the smallest element in the list.\n* **sum**: This function returns\
    \ the sum of all elements in the list. It accepts an optional second argument:\
    \ the value to start with when summing (defaults to 0).\n\n# ## 28 Representing\
    \ fractional numbers\n\nFraction instance can be created using the following constructor:\n\
    \n```\n```python\nFraction([numerator [, [denominator]]])\n```\n```\n\n# ## 29\
    \ Performing math operations\n\nThese work on integer and float numbers, except\
    \ complex numbers. For complex numbers, a separate module is used, called `math`.\n\
    \n```\n**For example:**\n```\nmath.acos(x): Return arc cosine of x.\nmath.cos(x):\
    \ Return cosine of x.\nmath.factorial(x) : Returns x factorial.\n```\n```\n\n\
    # ## 30 Working with arrays\n\nThe `array` module provides an efficient way to\
    \ use arrays in your programs. The `array` module defines the following type:\n\
    \n```\n```python\narray(typecode [, initializer])\n```\n```\n\nOnce you have created\
    \ an array object, say `myarray`, you can apply a bunch of methods to it. Here\
