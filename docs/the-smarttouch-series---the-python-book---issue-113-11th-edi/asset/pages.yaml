  md: "# 50 Python commands\n\n![](img/e016e192a91ffc1a9e474690a590742f_18_0.png)\n\
    \n**13**  \n# How true is a list?\n\nIn some cases, you may have collected a number\
    \ of elements within a list that can be evaluated to `True` or `False`. For example,\
    \ maybe you ran a number of possibilities through your computation and have created\
    \ a list of which ones passed. You can use the command `any(list)` to check to\
    \ see whether any of the elements within your list are true. If you need to check\
    \ whether *all* of the elements are True, you can use the command `all(list)`.\
    \ Both of these commands return a `True` if the relevant condition is satisfied,\
    \ and a `False` if not. They do behave differently if the iterable object is empty,\
    \ however. The command `all` returns a `True` if the iterable is empty, whereas\
    \ the command `any` returns a `False` when given an empty iterable.\n\n![](img/e016e192a91ffc1a9e474690a590742f_18_1.png)\n\
    \n**14**  \n# Enumerating\n\nSometimes, we need to label the elements that reside\
    \ within an iterable object with their indices so that they can be processed at\
    \ some later point. You could do this by explicitly looping through each of the\
    \ elements and building an enumerated list. The `enumerate` command does this\
    \ in one line. It takes an iterable object and creates a list of tuples as the\
    \ result. Each tuple has the 0-based index of the element, along with the element\
    \ itself. You can optionally start the indexing from some other value by including\
    \ an optional second parameter. As an example, you could enumerate a list of names\
    \ with the command `list(enumerate(names, start=10))`. In this example, we decided\
    \ to start the indexing at 1 instead of 0.\n\n**15**  \n# Casting\n\nVariables\
    \ in Python don't have any type information, and so can be used to store any type\
    \ of object. The actual data, however, is of one type or another. Many operators,\
    \ like addition, assume that the input values are of the same type. Very often,\
    \ the operator you are using is smart enough to make the type of conversion that\
    \ is needed. If you have the need to explicitly convert your data from one type\
    \ to another, there are a class of functions that can be used to do this conversion\
    \ process. The ones you are most likely to use is `abs`, `bin`, `bool`, `chr`,\
    \ `complex`, `float`, `hex`, `int`, `long`, `oct`, and `str`. For the number-based\
    \ conversion functions, there is an order of preference where some types are a\
    \ subset of others. For example, integers are `lower` than floats. When converting\
    \ up, no changes in the ultimate value should happen. When converting down, usually\
    \ some amount of information is lost. For example, when converting from float\
    \ to integer, Python truncates the number towards zero.\n\n**16**  \n# What is\
    \ this?\n\nEverything in Python is an object. You can check to see what class\
    \ this object is an instance of with the command `isinstance(object, class)`.\
    \ This command returns a Boolean value.\n\n**17**  \n# Is it a subclass?\n\nThe\
    \ command `issubclass(class1, class2)` checks to see if `class1` is a subclass\
    \ of `class2`. If `class1` and `class2` are the same, this is returned as `True`.\n\
    \n**18**  \n# Global objects\n\nYou can get a dictionary of the global symbol\
    \ table for the current module with the command `globals()`.\n\n**19**  \n# Local\
    \ objects\n\nYou can access an updated dictionary of the current local symbol\
    \ table by using the command `locals()`.\n\n**20**  \n# Variables\n\nThe function\
    \ `vars(dict)` returns writable elements for an object. If you use `vars()`, it\
    \ behaves like `locals()`.\n\n**21**  \n# Making a global\n\nA list of names can\
    \ be interpreted as global for the entire code block with the command `globals(names)`.\n\
    \n**22**  \n# Nonlocals\n\nIn Python 3.x, you can access names from the nearest\
    \ enclosing scope with the command `nonlocal names` and bind it to the local scope.\n\
    \n![](img/e016e192a91ffc1a9e474690a590742f_18_2.png)\n\n**23**  \n# Raising an\
    \ exception\n\nWhen you identify an error condition, you can use the `raise` command\
    \ to throw up an exception. You can include an exception type and a value.\n\n\
    **24**  \n# Dealing with an exception\n\nExceptions can be caught in a try-except\
    \ construction. If the code in the try block raises an exception, the code in\
    \ the except block gets run.\n\n**25**  \n# Static methods\n\nYou can create a\
    \ static method, similar to that in Java or C++, with the command `staticmethod(function_name)`."
