  md: "Similarly for Vimeo:\n\n```\n```python\ndef getVimeoUrl(id):\n    url = \"\
    plugin://plugin.video.vimeo/path=/root/video&action=play_video&vid=\" + id\n \
    \   return url\n```\n```\n\nAnd for Dailymotion:\n\n```\n```python\ndef getDailymotionUrl(id):\n\
    \    url = \"plugin://plugin.video.dailymotion_com/?url=\" + id + \"&mode=playVideo\"\
    \n    return url\n```\n```\n\nOnce we have the video URL resolved into the respective\
    \ plug-in, playing it is very simple:\n\n```\n```python\ndef playVideo(url):\n\
    \    listItem = xbmcgui.ListItem(path=url)\n    xbmcplugin.setResolvedUrl(pluginhandle,\
    \ True, listItem)\n```\n```\n\n# ## 13 Populating plug-in content listing\n\n\
    **xbmcgui** contains various routines for handling the content listing inside\
    \ the plug-ins UI. The first step is to create directory entries which can be\
    \ selected from the XBMC UI. For this we will use a function called **xbmcplugin.addDirectoryItem**.\n\
    \nFor our convenience we will be abstracting addDirectoryItem to suit our purpose,\
    \ so that we can set name, url, mode, icon image and type easily.\n\n```\n```python\n\
    def addDir(name, url, mode, iconImage, type=\"\"):\n    u = sys.argv[0] + \"?url=\"\
    \ + urllib.quote_plus(url) + \"&mode=\" + str(mode) + \"&type=\" + str(type)\n\
    \    ok = True\n    listItem = xbmcgui.ListItem(name, iconImage=\"DefaultFolder.png\"\
    , thumbnailImage=iconImage)\n    listItem.setInfo(type=\"Video\", infoLabels={\"\
    Title\": name, ...})\n    xbmcplugin.addDirectoryItem(handle=int(sys.argv[1]),\
    \ url=u, listItem=listItem)\n    return ok\n```\n```\n\nOn the same line, we can\
    \ build a function to place links as well...\n\n```\n```python\ndef addLink(name,\
    \ url, mode, iconImage, description, date):\n    u = sys.argv[0] + \"?url=\" +\
    \ urllib.quote_plus(url) + \"&mode=\" + str(mode)\n    ok = True\n    listItem\
    \ = xbmcgui.ListItem(name, ...)\n    return ok\n```\n```\n\nBased on the abstractions\
    \ we have just created, we can create the base functions which will populate the\
    \ content. But before we do that, let's first understand how Reddit works. Most\
    \ of the Reddit content filters are provided through something called **Subreddits**.\
    \ This allows you to view discussions related to a particular topic; in our plug-in\
    \ we are interested in showing videos; we also want to show trailers, documentaries\
    \ etc. We access these using Subreddits. For example, for trailers it would be\
    \ **reddit.com/r/trailers**. For domains we can use **/domain**, for example,\
    \ to get all the YouTube videos posted on Reddit, we will call **reddit.com/domain/youtube.com**.\
    \ Now you may ask what is the guarantee that this Subreddit will only list videos?\
    \ The answer is that it may not. For that reason we scrape the site ourselves\
    \ to find videos. More on this in the next step.\n\nThe first base function will\
    \ define is **index()**. This is called when the user starts the plug-in.\n\n\
    ```\n```python\ndef index():\n    defaultItems = [\"videos\", \"trailers\", \"\
    documentaries\", \"music\"]\n    entries = defaultEntries[:]\n    if os.path.exists(subredditFile):\n\
    \        fh = open(subredditFile, \"r\")\n        content = fh.read()\n      \
    \  fh.close()\n        spl = content.split('\\n')\n        for i in range(0, len(spl),\
    \ 1):\n```\n```\n\n```\n```python\nif spl[i]:\n    subreddit = spl[i]\nentries.append(subreddit)\n\
    entries.sort()\nfor entry in entries:\n    if entry in defaultEntries:\n     \
    \   addDir(entry.title(), ...)\n    else:\n        addDir(entry.title(), ...)\n\
    # ... and more logic for domains and translation ...\nxbmcplugin.endOfDirectory(pluginhandle)\n\
    ```\n```\n\nHere, the **populateItems** takes a call to addSubreddit. ListSorting\
    \ takes care of sorting out the data based on criteria such as Hot, New etc. It\
    \ also calls in Reddit's JSON function, which returns cases easy-to-parse JSON\
    \ data. We have created a setting entry for all the sorting criteria. Based on\
    \ what is set, we go ahead and build out the sorted list.\n\n```\n```python\n\
    def listSubreddit(subreddit):\n    cat_hot:\n        addDir(translation(30002),\
    \ urlMain + \"+subreddit=\" + \"hot/\", json?limit=100\", \"listVideos\", \"\"\
    )\n    if cat_new:\n        addDir(translation(30003), urlMain + \"+subreddit=\"\
    \ + \"new/\", json?limit=100\", \"listVideos\", \"\")\n    # ... and more logic\
    \ for top and translation ...\n    xbmcplugin.endOfDirectory(pluginhandle)\n```\n\
    ```"
