- pgno: 134
  md: "```\n@app.teardown_request\ndef teardown_request(exception):\n    db = getattr(g,\
    \ '_db', None)\n    if db is not None:\n        db.close()\n```\n\n# 09 Display\
    \ Posts\n\nCreate your first route so that we can return and display all available\
    \ posts. To query the database we execute a SQL statement against the stored db\
    \ connection. The results are then mapped to values using Python's dict method\
    \ and saved as the posts variable.\n\nTo render a template we then call render_template()\
    \ and pass in the file name and the variable to display as the second argument.\n\
    \nMultiple variables can be passed through as a comma-separated list.\n\n```\n\
    @app.get('/posts/')\ndef get_posts():\n    cur = g.db.execute('select title, text\
    \ from posts order by id desc')\n    posts = [dict(title=row[0], text=row[1])\n\
    \             for row in cur.fetchall()]\n    return render_template('show_posts.html',\
    \ posts=posts)\n```\n\n# 10 Template Output\n\nFlask expects templates to be available\
    \ within the templates directory in the root of the project, so make sure that\
    \ you create that directory now. Next, add a new file called 'show_posts.html'.\
    \ The dynamic values are managed using Jinja2 template syntax, the default template\
    \ engine for Flask applications. Save this file in the templates directory.\n\n\
    ```\n<ul class=posts>\n{% for post in posts %}\n<li><h2>{{ post.title }}</h2>{{\
    \ post.text|safe }}\n{% else %}\n<li>Sorry, no posts matches your request.\n{%\
    \ endfor %}\n</ul>\n```\n\n# 11 Make an API Response\n\nTo create an API response\
    \ we can define a new route with a specific API endpoint. Once again, we query\
    \ the database for all posts. The data is then returned as JSON, using the JSONify\
    \ method to do so. We can add specific values such as post count and a custom\
    \ message if you wish, as well as the actual posts variable, formatted as JSON.\n\
    \n```\n@app.route('/api/v1/posts/',\n           methods=['GET'])\ndef show_entries():\n\
    \    cur = g.db.execute('select title, text from posts order by id desc')\n  \
    \  posts = [dict(title=row[0], text=row[1])\n             for row in ur.fetchall()]\n\
    \    return jsonify({\"count\": len(posts), 'posts': posts})\n```\n\n```\n@app.route('/api/v1/posts/<int:post_id>',\n\
    \           methods=['GET', 'DELETE'])\ndef single_post(post_id):\n    method\
    \ = request.method\n    if method == 'GET':\n        cur = g.db.execute('select\
    \ title, text from posts where id=?', [post_id])\n        posts = [dict(title=row[0],\
    \ text=row[1]) for row in cur.fetchall()]\n        return jsonify({\"count\":\
    \ len(posts), 'posts': posts})\n    elif method == 'DELETE':\n        g.db.execute('delete\
    \ from posts where id = ?', [post_id])\n        return jsonify({\"status\": 'Post\
    \ deleted'})\n```\n\n# 12 Get a specific Post\n\nTo obtain a specific post from\
    \ the API we need to create a new route, which will accept a dynamic value as\
    \ part of the URL. We can also choose to use this route for multiple request methods,\
    \ which are in this case GET and DELETE. We can determine the method by checking\
    \ the request.method value and run it against a conditional if/else statement.\n\
    \n# 13 Run the application\n\nTo run your Flask application, navigate the active\
    \ Terminal window into the root of the project. Ensuring you are in an active\
    \ virtual environment Python shell, enter the command to run the main index file.\
    \ The built-in server will start and the site will be accessible in the browser\
    \ on default port local address http://127.0.0.1:5000.\n\n```\npython index.py\n\
    ```\n\n![](img/e016e192a91ffc1a9e474690a590742f_134_0.png)\n\n# 14 API JSON Output\n\
    \nThe root of the application will render the template we previously created.\
    \ Multiple routes can be generated to create a rich web application. Visiting\
    \ an API-specific URL in the browser will return the requested data as cleanly\
    \ formatted JSON. The ability to define custom routes like a versioned RESTful\
    \ endpoint is incredibly powerful.\n\n# Python in the wild\n\nInterested in Python\
    \ development? You'd be in good company with big names currently using it\n\n\
    D Disqus, the popular social interaction comment service provider, has been implementing\
    \ their production applications in Python for a very long time. Python's benefit\
    \ for the development team was its ability to scale effectively and cater for\
    \ a large number of consumers whilst also providing an effective underlying API\
    \ for internal and external use. The company are now starting to run some production\
    \ apps in Go, but the majority of code still runs on Python.\n\nWorld-renowned\
    \ image sharing service Instagram and social pin board Pinterest have also implemented\
    \ Python as part of their web stack, opting for Django to assist with the functionality\
    \ and ability to cater for the many thousands of content views and requests made\
    \ to their services.\n\nMozilla, Atlassian's Bitbucket repository service, and\
    \ popular satire site The Onion have all been noted as using Django for their\
    \ products.\n\n![](img/e016e192a91ffc1a9e474690a590742f_134_1.png)"
