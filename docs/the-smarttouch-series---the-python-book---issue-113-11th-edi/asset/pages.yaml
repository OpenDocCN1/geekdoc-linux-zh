  md: "# # Django application development\n\nDjango is a full Python web-app framework\
    \ with impressive command-line tools\n\n# ## Installing Django\n\nThe installation\
    \ of Django is relatively easy once you have python installed. See for yourself\
    \ as we build a simple app here\n\n![](img/e016e192a91ffc1a9e474690a590742f_135_0.png)\n\
    \n**01** **Create Virtual Environment**\n\nCreate a new directory for your project\
    \ and navigate inside it using a new Terminal window. Create a new virtual environment\
    \ for this project, opting to use the latest Python 3. Your Python 3 location\
    \ may vary, so be sure to set the correct path for the binary package.\n\n```\n\
    ```bash\nvirtualenv -p /usr/local/bin/python3 venv\n```\n\n```\n\n**02** **Activate\
    \ and Install**\n\nUsing your Terminal window, activate the virtual environment\
    \ to start the project-specific shell. VirtualEnv has a local version of the Python\
    \ package manager pip installed, so it's fairly straight forward to run the command\
    \ to install Django.\n\n```\n```bash\nvenv/bin/activate\npip install Django\n\
    ```\n```\n\n![](img/e016e192a91ffc1a9e474690a590742f_135_1.png)\n\n**03** **Create\
    \ Core Project**\n\nThe Django install contains some incredibly useful command-line\
    \ tools, which will help you to run a number of repetitive and difficult tasks.\
    \ Let's use one of them to create a fresh project structure for us. Run the django-admin.py\
    \ script with the name of the project that you want created.\n\n```\n```bash\n\
    django-admin.py startproject myblog\n```\n```\n\n![](img/e016e192a91ffc1a9e474690a590742f_135_2.png)\n\
    \n**04** **Initial Migration**\n\nNavigate into the project directory via the\
    \ Terminal window. Some of the installed apps included in the project generation\
    \ require database tables.\n\nUsing the helper, run a migration command in order\
    \ to create all of these automatically. The Terminal window will keep you informed\
    \ of all of your progress and what has been applied from the migration.\n\n```\n\
    ```bash\ncd myblog\npython manage.py migrate\n```\n```\n\n**05** **Create App**\n\
    \nEach Django project is made up of at least one application or module. Run the\
    \ startapp command to create a new blog app module, which will generate the required\
    \ code adjacent to the main project structure.\n\n```\n```bash\npython manage.py\
    \ startapp blog\n```\n```\n\n# ## Database models & migration\n\nDjango's ability\
    \ to manage the migration and maintenance of database schema and project models\
    \ is very impressive\n\n**01** **Generate the model**\n\nOpen blog/models.py and\
    \ create the first model class, providing the property names and types for each.\
    \ You can dig deeper into field types via the docs here: bit.ly/Yfn1Kn.\n\nOnce\
    \ complete, open myblog/settings.py and add the blog app to the list of allowed\
    \ installed applications so that the project will load it.\n\n```\n```python\n\
    class Post(models.Model):\n    title = models.CharField(max_length=200)\n    text\
    \ = models.TextField()\n```\n```python\nINSTALLED_APPS = (\n    'django.contrib.admin',\n\
    \    ..., 'django.contrib.staticfiles', 'blog'\n)\n```\n```\n\n![](img/e016e192a91ffc1a9e474690a590742f_135_3.png)\n\
    \n**02** **Data Migration**\n\nAny creation of models or changes to data need\
    \ to be migrated. To do so we need to make migration files from the model data,\
    \ which generate sequentially numbered files.\n\nThen we run a specific migration\
    \ to generate the required SQL and the final execution command performs the database\
    \ migration.\n\n```\n```bash\npython manage.py makemigrations blog\npython manage.py\
    \ migrate blog 0001\npython manage.py migrate__\nmyblog\n```\n```"
