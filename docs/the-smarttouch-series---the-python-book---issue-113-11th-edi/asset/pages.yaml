  md: "# Get started with Python\n\n```\n[liam@liam-laptop Python]$ ./functions_and_scope.py\n\
    This is a test string\nThis is a test string that has been modified.\n```\n\n\
    Scope is an important thing to get the hang of, otherwise it can get you into\
    \ some bad habits. Let’s write a quick program to demonstrate this. It’s going\
    \ to have a Boolean variable called cont, which will decide if a number will be\
    \ assigned to a variable in an ‘if’ statement. However, the variable hasn’t been\
    \ defined anywhere apart from in the scope of the ‘if’ statement.\nWe’ll finish\
    \ off by trying to print the variable.\n\n```\n#!/usr/bin/env python2\ncont =\
    \ False\nif cont:\n  var = 1234\nprint(var)\n```\n\nIn the section of code above,\
    \ Python will convert the integer to a string before printing it. However, it’s\
    \ always a good idea to explicitly convert things to strings – especially when\
    \ it comes to concatenating strings together. If you try to use the + operator\
    \ on a string and an integer, there will be an error because it’s not explicitly\
    \ clear what needs to happen. The + operator would usually add two integers together.\
    \ Having said that, Python’s string formatter that we demonstrated earlier is\
    \ a cleaner way of doing that. Can you see the problem? Var has only been defined\
    \ in the scope of the ‘if’ statement. This means that we get a very nasty error\
    \ when we try to access var.\n\n```\n[liam@liam-laptop Python]$ ./scope.py\nTraceback\
    \ (most recent call last):\n  File \"./scope.py\", line 8, in <module>\n  print\
    \ var\nNameError: name 'var' is not defined\n```\n\nIf cont is set to True, then\
    \ the variable will be created and we can access it just fine. However, this is\
    \ a bad way to do things. The correct way is to initialise the variable outside\
    \ of the scope of the ‘if’ statement.\n\n```\n#!/usr/bin/env python2\n\ncont =\
    \ False\n\nvar = 0\nif cont:\n  var = 1234\n\nif var != 0:\n  print(var)\n```\n\
    \nThe variable var is defined in a wider scope than the ‘if’ statement, and can\
    \ still be accessed by the ‘if’ statement. Any changes made to var inside the\
    \ ‘if’ statement are changing the variable defined in the larger scope. This example\
    \ doesn’t really do anything useful apart from illustrate the potential problem,\
    \ but the worst-case scenario has gone from the program crashing to printing a\
    \ zero. Even that doesn’t happen because we’ve added an extra construct to test\
    \ the value of var before printing it.\n\n# Coding style\n\nIt’s worth taking\
    \ a little time to talk about coding style. It’s simple to write tidy code. The\
    \ key is consistency. For example, you should always name your variables in the\
    \ same manner. It doesn’t matter if you want to use camelCase or use underscores\
    \ as we have. One crucial thing is to use self-documenting identifiers for variables.\
    \ You shouldn’t have to guess what a variable does. The other thing that goes\
    \ with this is to always comment your code. This will help anyone else who reads\
    \ your code, and yourself in the future. It’s also useful to put a brief summary\
    \ at the top of a code file describing what the application does, or a part of\
    \ the application if it’s made up of multiple files.\n\n# Comparison operators\n\
    \nThe common comparison operators available in Python include:\n\n| | |\n| :-\
    \ | :- |\n| < | strictly less than |\n| <= | less than or equal |\n| > | strictly\
    \ greater than |\n| >= | greater than or equal |\n| == | equal |\n| != | not equal\
    \ |\n\nwhat a variable does. The other thing that goes with this is to always\
    \ comment your code. This will help anyone else who reads your code, and yourself\
    \ in the future. It’s also useful to put a brief summary at the top of a code\
    \ file describing what the application does, or a part of the application if it’s\
    \ made up of multiple files.\n\n# Summary\n\nThis article should have introduced\
    \ you to the basics of programming in Python. Hopefully you are getting used to\
    \ the syntax, indentation and general look and feel of a Python program. The next\
    \ step is to learn how to come up with a problem that you want to solve, and break\
    \ it down into small enough steps that you can implement in a programming language.\n\
    \nGoogle, or any other search engine, is very helpful. If you are stuck with anything,\
    \ or have an error message you can’t work out how to fix, stick it into Google\
    \ and you should be a lot closer to solving your problem. For example, if we Google\
    \ ‘play mp3 file with python’, the first link takes us to a Stack Overflow thread\
    \ with a bunch of useful replies. Don’t be afraid to get stuck in – the real fun\
    \ of programming is solving problems one manageable chunk at a time.\n\nHappy\
    \ programming!"
