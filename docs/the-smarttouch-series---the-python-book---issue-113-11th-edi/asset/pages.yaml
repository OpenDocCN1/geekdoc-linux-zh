- pgno: 117
  md: '# Create with Python


    # 02 Downloading pivaders


    Git is a supero version control solution that helps programmers safely store their
    code and associated files. Not only does it help you retain a full history of
    changes, it means you can ''clone'' entire projects to use and work on from places
    like github.com. To clone the version of the project we created for this tutorial,
    go to your home folder from the command line (cd ~) and type:


    ```

    git pull https://github.com/russ88/pivaders.git

    ```


    This will create a folder called **pivaders** — go inside (cd pivaders) and take
    a look around.


    # 03 Navigating the project


    The project is laid out quite simply across a few subfolders. Within **pivaders**
    sits a licence, readme and a **seconds** subfolder. This contains the main game
    file, **pivotare.py**, which launches the application. Within the **data** folder
    you''ll find subfolders for both graphics and sound assets, as well as the font
    we used for the title screen and scores. To take pivaders for a test-drive, simply
    enter the pivaders subdirectory (cd pivaders/pivaders) and type:


    ```

    python pivaders.py

    ```


    Use the arrow keys to steer left and right and the space bar to shoot. You can
    quit to the main screen with the Esc key and press it again to exit the game completely.


    # 04 Animation & sound


    Compared with the game from last month''s tutorial, you see it''s now a much more
    dynamic project. The protagonist ship now leans into the turns as you change direction
    and corrects itself when you either press the opposite direction or lift your
    finger off the button. When you shoot an alien ship, it explodes


    with several frames of animation and should you take fire, a smaller explosion
    occurs on your ship. Music, lasers and explosion sound effects also accompany
    the animations as they happen.


    # 05 Finding images to animate


    Before we can program anything, it''s wise to set up assets in a way we can use
    them. As mentioned, we''ve opted to use sprite sheets; these can be found online
    or created with GIMP with a little practice. Essentially they''re a mosaic made
    up of individual frames of equally sized and spaced images representing each frame.
    Find ready-made examples at open gameart.org, as used here.


    # 06 Tweaking assets


    While many of the assets on sites like open gameart.org can be used as is, you
    may want to import them into an image-editing application like GIMP to configure
    them to suit your needs — as we did with our ship sheet asset to help us keep
    the code simple. We started with the central ship frame and centred it into a
    new window. We set the size and width of the frame and then copy-pasted the other
    frames either side of it. We ended up with 11 frames of exactly the same size
    and width in a single document. Pixel-perfect precision on size and width is key,
    so we can just multiply it to find the next frame.


    # 07 Loading the sprite sheet


    Since we''re inheriting from the **Sprite** class to create our **Player** class,
    we can easily see how the player looks on screen by changing **Player**.image.
    First, we need to load our ship sprite sheet with **pygame.image.load()**. Since
    we made our sheet with a transparent background, we can append **convert_alpha()**
    to the end of the line so the ship frames render correctly (without any background).
    We then use **subsurface** to set the initial **Player**.image to the middle ship
    sprite on the sheet. This is set by **self.ani_pos**, which has an initial value
    of 5. Changing this value will alter the ship image drawn to the screen: ''0''
    would draw it leaning fully left, ''11'' fully to the right.


    # 08 Animation flags


    Down the list in the initialising code for the **Game** class, we set two flags
    for player animation: **self.animate_left** and **self.animate_right**. In the
    **Control** method of our **Game** class, we use these to ''flag'' when we want
    animations to work using Boolean values. It allows us to ''automatically'' animate
    the player sprite back to its resting state (otherwise the ship will continue
    to look as if it''s flying left when it has stopped).


    # 09 The animation method


    These flags pop up again in the core animation code for the player: **animate_player()**
    within the **Game** class. Here we use nested if statements to control the animation
    and physically set the player image accordingly. Essentially it states that if
    the **animate_right** flag is True and if the current animation position is different
    to what we want, we incrementally increase the **ani_pos** variable and set the
    player''s image accordingly. The **Else** statement then animates the ship sprite
    back to its resting state and the same logic is then applied in the opposite direction.


    # 10 Animating explosions


    The **player_explosion()** and **alien_explosion()** methods that come after the
    player animation block in the **Game** class are similar but simpler executions
    of essentially the same thing. As we only need to run through the same predefined
    set of frames (this time vertically), we only need to see if the **self.explode**
    and **self.ani_explose** flags are True before we increment the variables that
    change the image displayed. As the sprite sheet is vertical, the variables **alien_explose_pos**
    and **explosion_image** are set to a different part of **subsurface** than before.


    # 11 Adding music to your project


    Pygame makes it easy to add a musical score to a project. Just obtain a suitable
    piece of music in your preferred format (we found ours via freesound.org) and
    load it using the **Mixer** Pygame class. As it''s already been initialised via
    **pygame.init()**, we can go ahead and load the music with this code:


    ```

    pygame.mixer.music.load(''data/sound/10_bar_nauts.ogg'')

    pygame.mixer.music.play(-1)

    pygame.mixer.music.set_volume(0.7)

    ```


    The music. **play(-1)** requests that the music should start with the app and
    continue to loop until it quits. If we replaced -1 with 5, the music would loop
    five times before ending. Learn more about the Mixer class via www.pygame.org/
    docs/ ref/ mixer.html.


    # 12 Using sound effects


    Loading and using sounds is similar to how we do so for images in Pygame. First
    we load the sound effect using a simple assignment. For the laser beam, the initialisation
    looks like this:


    ```

    self.bullet_fx = pygame.mixer.Sound(''data/sound/medetix_pc-bitcrushed-lazer-beam.ogg'')

    ```


    Then we simply trigger the sound effect at the appropriate time. In the case of
    the laser, we want to play whenever we press the space bar to shoot, so we place
    it in the **Game** class''s **Control** method, straight after we release the
    **shoot_bullet** flag. If you''re struggling to find free and open sound effects,
    we recommend www.freesound.org.


    ![](img/e016e192a91ffc1a9e474690a590742f_117_0.png)'
  merge: -1
  img_proc: true
