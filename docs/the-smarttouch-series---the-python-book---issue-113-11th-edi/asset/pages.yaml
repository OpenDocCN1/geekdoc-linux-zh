- pgno: 100
  md: '# Threads or processes?


    What if you need to actually have truly parallel code, that has the ability to
    run on multiple cores? Because Python has the GIL, you need to move away from
    using threads and go to using separate processes to handle the different tasks.
    Luckily, Python includes a multiprocessing module that provides the process equivalent
    to the threading module. As with the threading module, you create a new process
    object and hand in a target function to be run. You then need to call the start()
    method to get it running. With threads, sharing data is trivial because memory
    is global and everything can see everything.


    However, different processes are in different memory scopes. In order to share
    data, we need to explicitly set up some form of communications. You can create
    a queue object where you can transfer objects. Processes can use the put() method
    to dump objects on the queue, and other processes can use the get() method to
    pull objects off. If you want a bit more control over who is talking to who, you
    can use pipes to create a two-way communication channel between two processes.
    When you use pipes and queues, you actually need to hand them in as arguments
    to your target function.


    The other way you can share information is by creating a section of shared memory.
    You can create a single variable shared with the Value object. If you have a number
    of variables you need to pass, you can put them in an Array object. As with pipes
    and queues, you will also need to pass them in as parameters to your target function.
    When you need to wait for the results from a process, you can use the join() method
    to get the main process to block until the sub-process finally finishes.


    The processing module also includes the idea of a process pool that is different
    from the threading module. With a pool, you can pre-create a number of processes
    that can be used in a map function. This kind of constrait is extremely useful
    if you are then going to be applying the same function to a number of different
    input values. For people who have actually using the concepts of mapping or applying
    functions from R, or Hadoop, this might turn out to be a bit more of an intuitive
    and beneficial model to use in your Python code.


    ```

    ```python

    lock.acquire()

    sum_var += curr_val

    lock.release()

    ```

    ```


    This can lead to another common issue in parallel programs: deadlocks. These issues
    occur when you have multiple locks that are associated with different global variables.
    Say you have the variables A and B, and the associated locks lockA and lockB.
    If thread 1 tries to get lockA then lockB, while thread 2 tries to get lockB then
    lockA, you could have the situation where they each get their first requested
    lock, and then wait forever for the second requested lock.


    The best way to avoid this type of bug is to code your program very carefully.
    Unfortunately, people are only human and messy code can creep in. You can try
    and catch this kind of bad behaviour by including the optional timeout parameter
    when you call the acquire() method. This tells the lock to only try and get the
    lock for some number of seconds. If the timeout is reached, the acquire method
    returns. You can tell whether or not it was successful by checking the returned
    value. If this was successful, acquire will return True. Otherwise, it will return
    False.


    The second way you can deal with data access is by moving any variables that you
    can be within the local scope of the individual threads. The essential idea is
    that each thread would have its own local version of any required variables that
    nobody else can see. This is done by creating a local object. You can then add
    attributes to this local object and use them as local variables. Within the function
    being run


    by your thread, you would then have code that looks like:


    ```

    ```python

    my_local = threading.local()

    my_local.x = 42

    ```

    ```


    The last topic we will look at is synchronising your threads so that they can
    work together effectively. Bear in mind there will be certain times when a number
    of threads will need to talk to each other after working on their separate parts
    of a particular problem. The only way they can share their results is if they
    have all finished calculating their individual results. You can solve this problem
    by using a barrier, which each thread will stop at until all of the other threads
    have reached it. In Python 3, there is a barrier object that can be created for
    some number of threads. It will provide a point where threads will pause when
    they call the barrier’s wait() method.


    Because you actually need to explicitly tell the barrier object how many threads
    will be taking part in the barrier, this is another area where it is possible
    that you could actually be faced with the problem of having a bug. If you create
    five threads but create a barrier for ten threads, it will never actually be able
    to reach the point where all of the expected threads have reached the barrier.
    The other synchronisation tool is the timer object. A timer is a subclass of the
    Thread class, and so takes a function to run after some amount of time has passed.
    As with a thread, you will need to call the timer’s start() method in order to
    start the countdown to when the function gets executed.


    A new method, cancel(), will actually allow you to stop the countdown of the timer
    if it hasn’t reached zero yet.


    After following all of these steps you should now be able to have your code running
    even more efficiently by simply forming out any time intensive parts to other
    threads of execution.


    By following these steps in this way, the end result is that the main part of
    your program can remain as efficient and reactive as possible to interaction with
    the end user and you can also keep all parts of your Raspberry Pi as busy as possible.


