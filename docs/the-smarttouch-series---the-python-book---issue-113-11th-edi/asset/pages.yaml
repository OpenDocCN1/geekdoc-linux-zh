  md: "# Get started with Python\n\nThe following line creates an integer variable\
    \ called hello_int with the # value of 21. Notice how it doesn't need to go in\
    \ quotation marks\n\nThe same principal is true of Boolean values\n\nWe create\
    \ a tuple in the following way\n\nAnd a list in this way\n\nYou could also create\
    \ the same list in the following way\n\nWe might as well create a dictionary while\
    \ we're at it. Notice how we've aligned the colons below to make the code tidy\n\
    \nNotice that there will now be two exclamation marks when we print the element\n\
    \nAt this point, it's worth explaining that any text in a Python file that follows\
    \ a # character will be ignored by the interpreter. This is so you can write comments\
    \ in your code.\n\n```\n#!/usr/bin/env python2\n\n# We create a variable by writing\
    \ the name of the variable we want followed\n# by an equals sign, which is followed\
    \ by the value we want to store in the\n# variable. For example, the following\
    \ line creates a variable called\n# hello_str, containing the string 'Hello World'.\n\
    hello_str = \"Hello World\"\n\nhello_int = 21\n\nhello_bool = True\n\nhello_tuple\
    \ = (21, 32)\n\nhello_list = [\"Hello\", \"this\", \"is\", \"a\", \"list\"]\n\n\
    # This list now contains 5 strings. Notice that there are no spaces\n# between\
    \ these strings so if you were to join them up to make a sentence\n# you'd have\
    \ to add a space between each element.\n\nhello_list = list()\nhello_list.append(\"\
    Hello\")\nhello_list.append(\"this\")\nhello_list.append(\"is\")\nhello_list.append(\"\
    a\")\nhello_list.append(\"list\")\n\n# The first line creates an empty list and\
    \ the following lines use the append\n# function of the list type to add elements\
    \ to the list. This way of using a\n# list isn't really very useful when working\
    \ with strings you know of in\n# advance, but it can be useful when working with\
    \ dynamic data such as user\n# input. This list will overwrite the first list\
    \ without any warning as we\n# are using the same variable name as the previous\
    \ list.\n\nhello_dict = {\"first_name\": \"Liam\",\n              \"last_name\"\
    : \"Fraser\",\n              \"eye_colour\": \"Blue\"}\n\n# Let's access some\
    \ elements inside our collections\n# We'll start by changing the value of the\
    \ last string in our hello_list and\n# add an exclamation mark to the end. The\
    \ \"list\" string is the 5th element\n# in the list. However, indexes in Python\
    \ are zero-based, which means the\n# first element has an index of 0.\n\nprint(hello_list[4])\n\
    hello_list[4] += \"!\"\n# The above line is the same as\nhello_list[4] = hello_list[4]\
    \ + \"!\"\nprint(hello_list[4])\n```\n\n> “Any text in a Python file that follows\
    \ a # character will be ignored”\n\n![](img/e016e192a91ffc1a9e474690a590742f_10_0.png)"
