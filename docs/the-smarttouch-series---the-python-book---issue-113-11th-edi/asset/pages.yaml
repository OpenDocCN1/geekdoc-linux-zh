- pgno: 66
  md: '# # System administration


    Get the most out of Python in handling all of the day-to-day upkeep that keeps
    your system healthy


    System administration tasks are some of the most **annoying things that you need
    to deal with when you have to maintain your own system**. Because of this, system
    administrators have constantly been trying to find ways to automate these types
    of tasks to maximise their time. They started with basic shell scripts, and then
    moved on to various scripting languages. For a long time, Perl had been the language
    of choice for developing these types of maintenance tools. However, Python is
    now growing in popularity as the language to use. It has reached the point where
    most Linux distributions have a Python interpreter included in order to run system
    scripts, so you shouldn''t have any excuse for not writing your own scripts. Because
    you will be doing a lot system level work, you will have most need of a couple
    of key Python modules. The first module is `os`. This module provides the bulk
    of the interfaces to interacting with the underlying system. The usual first step
    is to look at the environment your script is running in to see what information
    might exist there to help guide your script. The following code gives you a mapping
    object where you can interact with the environment variables active right now:


    ```

    ```python

    import os

    os.environ

    ```

    ```


    You can get a list of the available environment variables with the function `os.environ.keys()`,
    and then access individual variables with `os.environ[key]`. These environment
    variables are used when you spawn a subprocess, as well. So you will want to change
    values, like the PATH or the current working directory, in order for you to run
    these subprocesses correctly. While there is a "putenv" function that edits these
    values for you, it unfortunately does not exist on all systems. So the better
    way to do this is to edit the values directly within the environs mapping.


    Another category of tasks you may want to automate is when working with files.
    For example, you can get the current working directory with code like


    ```

    ```python

    cwd = os.getcwd()

    ```

    ```


    You can then get a list of the files in this directory with


    ```

    ```python

    os.listdir(cwd)

    ```

    ```


    You can move around the file system with the function `os.chdir(new_path)`. Once
    you found the file you are interested in, you can open it with `os.open()` and
    open it for reading, writing and/or appending. You can then read or write to it
    with the functions `os.read()` and `os.write()`. Once done, you can close the
    file with `os.close()`.


    ![](img/e016e192a91ffc1a9e474690a590742f_66_0.png)


    # ## Running subprocesses from Python


    The underlying philosophy of Unix is to build small, specialised programs that
    do one job extremely well. You then chain these together to build more complex
    behaviours. There is no reason why you shouldn''t use the same philosophy within
    your Python scripts. There are several utility programs available to use with
    very little work on your part. The older way of handling this was through using
    functions like `popen()` and `spawn()!` from the os module, but a better way of
    running other programs is by using the subprocess module instead. You can then
    launch a program, like ls, by using:


    ```

    ```python

    import subprocess

    subprocess.run("ls", "-l")

    ```

    ```


    This provides you with a long file listing for the current directory. The function
    `"run()"` was introduced in Python 3.5 and is the suggested way of handling this.
    If you have an older version, or if you require more control than that, then you
    can employ the underlying `"popen()"` function that we mentioned earlier instead.
    If you want to get the output, you can use the following:


    ```

    ```python

    cmd_output = subprocess.run(["ls", "-l"],

    stdout=subprocess.PIPE)

    ```

    ```


    The variable "cmd_output" is a CompletedProcess object that contains the return
    code and a string holding the stdout output.


    # ## Scheduling with cron


    Once you have your script all written up, you may want to schedule them to run
    automatically without your intervention. On Unix systems, you can cron run your
    script on whatever schedule is necessary. The utility `"crontab -e"` lists the
    current contents of your cron file, and `"crontab -e"` lets you edit the scheduled
    jobs that you want cron to run.'
  merge: -1
