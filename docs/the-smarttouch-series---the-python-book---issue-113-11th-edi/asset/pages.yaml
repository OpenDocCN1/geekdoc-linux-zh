    \ == 5:\n        return \"five of a kind!\"\n    elif dice_hand[0] == 4:\n   \
    \     return \"four of a kind!\"\n    elif dice_hand[0] == 3:\n        if dice_hand[1]\
    \ == 2:\n            return \"a full house!\"\n        else:\n            return\
    \ \"three of a kind.\"\n    elif dice_hand[0] == 2:\n        if dice_hand[1] ==\
    \ 2:\n            return \"two pair.\"\n        else:\n            return \"one\
    \ pair.\"\n    else:\n        return \"a high card.\"\n```\n\n```\ndef gui():\n\
    \    global dice\n    dice = roll(5)\n    dice.sort()\n    nine = 1\n    ten =\
    \ 2\n    jack = 3\n    queen = 4\n    king = 5\n    ace = 6\n    names = { nine:\
    \ \"9\", ten: \"10\", jack: \"J\", queen: \"Q\", king: \"K\", ace: \"A\"}\n  \
    \  result = (\"You have \" + hand(dice))\n```\n\n```\ndef game():\n    throws()\n\
    ```\n\n```\ndef throws():\n    global dice\n    dice1_check = dice1.get()\n  \
