- pgno: 120
  md: "# Create with Python\n\nRight the safe blocks have been turned into gold —\
    \ the rest are potential mines!\n\n![](img/e016e192a91ffc1a9e474690a590742f_120_0.png)\n\
    \n# 02 Importing the modules\n\nLoad up your preferred Python editor and start\
    \ a new window. You need to import the following modules: import random to calculate\
    \ and create the random location of the mine, and import time to add pauses and\
    \ delays to the program. Next, add a further two lines of code: from mcpi import\
    \ minecraft and mc = minecraft.Minecraft.create(). These create the program link\
    \ between Minecraft and Python. The mc variable enables you to write “mc” instead\
    \ of “minecraft.Minecraft.create()\".\n\n```\nimport random\nimport time\nfrom\
    \ mcpi import minecraft\nmc = minecraft.Minecraft.create()\n```\n\n# 03 Grow some\
    \ flowers\n\nUsing Python to manipulate Minecraft is easy: create the program\
    \ below to test it is working. Each block has its own ID number, and flowers are\
    \ 38. The x, y, z = mc.player.getPos() line gets the player’s current position\
    \ in the world and returns it as a set of coordinates: x, y, z. Now you know where\
    \ you are standing in the world, blocks can be placed using mc.setBlock(x, y,\
    \ z, flower). Save your program, open MC and create a new world.\n\n```\nflower\
    \ = 38\nwhile True:\n  x, y, z = mc.player.getPos()\n  mc.setBlock(x, y, z, flower)\n\
    \  time.sleep(1)\n```\n\n# 04 Running the code\n\nReducing the size of the MC\
    \ window will make it easier for you to see both the code and the program running;\
    \ switching between too can be frustrating. The Tab key will release the keyboard\
    \ and mouse from the MC window. Run the Python program and wait for it to load\
    \ — as you walk around, you’ll drop flowers! Change the ID number in line 1 to\
    \ change the block type, so instead of flowers, try planting gold, water or even\
    \ melons.\n\n# 05 Posting a message to the Minecraft world\n\nIt is also possible\
    \ to post messages to the Minecraft world. This is used later in the game to keep\
    \ the player informed that the game has started and also of their current score.\
    \ In your previous program add the following line of code under the flower = 38\
    \ line, making this line 2: mc.postToChat(\"I grew some flowers with code\").\
    \ Now save and run the program by pressing F5 – you will see the message pop up.\
    \ You can try changing your message, or move to the next step to start the game.\n\
    \n# 06 Create the board\n\nThe game takes place on a board created where the player\
    \ is currently standing, so it is advisable to fly into the air or find a space\
    \ with flat terrain before running your final program. To create the board you\
    \ need to find the player’s current location in the world using the code x, y,\
    \ z = mc.player.getPos(). Then use the mc.setBlocks code in order to place the\
    \ blocks which make up the board:\n\n```\nmc.setBlocks(x, y-1, z, x+20, y-1, z+20,\
    \ 58).\n```\n\nThe number 58 is the ID of the block that is a crafting table.\
    \ You can increase or decrease the size of the board by changing the +20. In the\
    \ code example above, the board size is 20 x 20 blocks, which gives you a 400-block\
    \ arena to play within.\n\n# Switching to the shell\n\nSwitching between the Python\
    \ Shell and Minecraft window can be frustrating, especially as MC overflies the\
    \ Python window. The best solution is to half the windows across the screen. (Don’t\
    \ run MC full-screen as the mouse coordinates are off). Use the Tab key to release\
    \ the keyboard and mouse from the MC window."
