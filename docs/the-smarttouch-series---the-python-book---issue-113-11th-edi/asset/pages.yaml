    Once these migrations have been created, you need to apply them to the database
    by using the command:


    ```

    python manage.py migrate

    ```


    Any time you make changes to your model, you will need to run the makemigrations
    and migrate steps again. Once you have your application finished, you can make
    the move to the final hosting server. Don''t forget to check the available code
    within the Django framework before putting too much work into developing your
    own code.


    # Terminal development environments


    When you are in the middle of developing your application, you may need to have
    several different terminal windows open in order to have a code editor open, a
    monitor on the server, and potentially testing output. If you are doing this on
    your own machine, this isn''t an issue. But, if you are working remotely, you
    should look into using Term. It can provide a much more robust terminal environment
    for you.


    # Other Python frameworks


    While Django is one of the most popular frameworks around for doing web development,
    it is by no means the only one around. There are several others available that
    may prove to be a better fit for particular problem domains. For example, if you
    are looking for a really self-contained framework, you could look at web2py. Everything
    you need to be able to have a complete system, from databases to web servers to
    a ticketing system, are included as part of the framework. It is so self-contained
    that it can even run from a USB drive. If you need even less of a framework, there
    are several mini-frameworks that are available. For example, CherryPy is a purely
    Pythonic multi-threaded web server that you can embed within your own application.
    This is actually the server included with TurboGears and web2py. A really popular
    microframework is a project called flask. It includes integrated unit testing
    support, Jinja2 templating and RESTful request dispatching. One of the oldest
    frameworks around is zope. Now up to version 3, this latest version was renamed
    Blue-Bream. Zope is fairly low-level, however. You may be more interested in looking
    at some of the other frameworks that are built on top of what is provided by zope.
    For example, pyramid is a very fast, easy to use framework that focuses on the
    most essential functions required by most web applications. To this end, it provides
    templating, the serving of static content, mapping of URLs to code, among other
    functions. It handles this while providing tools for application security. If
    you are looking for some ideas, there are several open source projects that have
    been built using these frameworks, from blogs, to forums to ticketing systems.
    These projects can provide some best practices when you go to construct your own
    application.'
