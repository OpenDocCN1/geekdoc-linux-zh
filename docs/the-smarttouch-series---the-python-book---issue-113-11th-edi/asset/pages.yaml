- pgno: 133
  md: "# Create an API\n\nLet us explore the Flask microframework and build a simple\
    \ yet powerful RESTful API with minimal code\n\n![](img/e016e192a91ffc1a9e474690a590742f_133_0.png)\n\
    \n# 01 Install Flask\n\nCreate a new directory inside of which your project will\
    \ live. Open a Terminal window and navigate to be inside your new directory. Create\
    \ a new virtual environment for this project, placed inside a new directory called\
    \ 'venv', and activate it. Once inside the new virtual shell, proceed to installing\
    \ Flask using the 'pip install Flask' command.\n\n```\n```\nvirtualenv venv\n\
    . venv/bin/activate\npip install Flask\n```\n```\n\n# 02 Create Index\n\nCreate\
    \ a new file in the root of the project location called 'index.py'. The sample\
    \ API will use a SQLite database, so we need to import that module for use in\
    \ the application. We’ll also import some core components from the Flask module\
    \ to handle request management and response formatting as well as some other functions.\
    \ The minimum import for a Flask application is Flask itself.\n\n```\n```\nimport\
    \ sqlite3\nfrom Flask import Flask, request, g, redirect, url_for, render_template,\
    \ abort, jsonify\n```\n```\n\n# 03 Declare Config\n\nFor a small application we\
    \ can declare configuration options as upper-case name value pairs inside the\
    \ main module, which we’ll do now. Here we can define the path and name of the\
    \ SQLite database and also set the Flask debug output to True for development\
    \ work. Initialise the Flask application to a namespace and then import the config\
    \ values set directly above it. We then run the application. All routes must be\
    \ placed above these last two lines.\n\n```\n```\n# Config\nDATABASE = '/tmp/api.db'\n\
    DEBUG = True\napp = Flask(__name__)\napp.config.from_object(__name__)\n# Add modules\
    \ and routes here\nif __name__ == '__main__':\n    app.run()\n```\n```\n\n# 04\
    \ Connect to Database\n\nWith the database path defined, we need a way to create\
    \ connection to the database for the application to obtain data. Create a new\
    \ method called 'connect_db()' to manage this for us. As a method we can call\
    \ it when we set up a prerequest hook shortly. This will return a new open connection\
    \ using the database details set in the configuration object.\n\n```\n```\ndef\
    \ connect_db():\n    return sqlite3.connect(app.config['DATABASE'])\n```\n```\n\
    \n# 05 Database Schema\n\nOur SQLite database will only contain one table. Create\
    \ a new file called 'schema.sql' in the root of the project directory. This file\
    \ will contain the SQL commands required to create the table and populate it with\
    \ some sample bootstrapped data.\n\n```\n```sql\ndrop table if exists posts;\n\
    create table posts (\n    id integer primary key autoincrement,\n    title text\
    \ not null,\n    text text not null\n);\n\ninsert into posts (title, text) values\
    \ ('First Entry', 'This is some text');\ninsert into posts (title, text) values\
    \ ('Second Entry', 'This is some more text');\n\ninsert into posts (title, text)\
    \ values ('Third Entry', 'This is some more text (again)');\n```\n```\n\n# 06\
    \ Instantiate the Database\n\nTo populate the database with the new table and\
    \ any associated data, we will need to import and apply the schema to the database.\
    \ Add a new module import at the top of the project file to obtain the 'contextlib.closing()'\
    \ method. What we will do next is create a method that will initialise the database\
    \ by reading the contents of schema.sql and executing it against the open database.\n\
    \n```\n```python\nfrom contextlib import closing\ndef init_db():\n    with closing(connect_db())\
    \ as db:\n        with app.open_resource('schema.sql', mode='r') as f:\n     \
    \       db.cursor().executescript(f.read())\n    db.commit()\n```\n```\n\n![](img/e016e192a91ffc1a9e474690a590742f_133_1.png)\n\
    \n# 07 Populate the Database\n\nTo populate the database you can now run the init_db()\
    \ inside an active python shell. Do so by entering a shell by typing 'python'\
    \ inside your environment, and then running the command below. Alternatively,\
    \ you can use the sqlite3 command and pipe the schema.sql file into the database.\n\
    \n```\n```bash\n# Importing the database using the init_db method\npython\n>>>\
    \ from index import init_db\n# Piping the schema using SQLite3\nsqlite3 /tmp/api.db\
    \ < schema.sql\n```\n```\n\n# 08 Request DB Connection\n\nWith the database created\
    \ and populated we need to be able to ensure we have an open connection and close\
    \ it accordingly when finished. Flask has some decorator methods to help us achieve\
    \ this. The before_request() method will establish the connection and store it\
    \ in the g object for use throughout the request cycle. We can then close the\
    \ connection after the cycle using the teardown_request() method.\n\n```\n```python\n\
    @app.before_request\ndef before_request():\n    g.db = connect_db()\n```\n```\n\
    \n> “World-renowned image-sharing service Instagram and social pinboard Pinterest\
    \ have implemented Python as part of their web stack, opting for Django”"
