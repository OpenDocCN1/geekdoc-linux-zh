    \ error\n\narticles = []\n\nwith open('entries.json') as f:\n    entries = json.load(f)\n\
    \nfor entry in entries:\n    print(entry['title'])\n```\n\nNews is everywhere.\
    \ We are constantly bombarded with news stories via mobile devices, tablets, laptops,\
    \ TVs and radios. You probably also overhear people discussing news stories. Traditionally\
    \ the type of newspaper that you read was used to indicate what type of person\
    \ you were - a kind of litmus test of your income, political views, social status\
    \ and where your ethics and morals were aligned. For example, an article by IBT\
    \ in 2013 found that 40 per cent of readers of the New Yorker were making more\
    \ than $75,000 (approximately £59,000) a year.\n\nNowadays, the news core for\
    \ every taste with variations such as gossip, detailed, statistical analysis,\
    \ photographic and so many more. Then there is 'fake news', which is by no means\
    \ a modern concept - its roots go back to the Second World War.\n\nWhatever your\
    \ news preference, this tutorial will walk you through customising and building\
    \ your own bespoke, automated 'News Machine'. Select your favourite news source\
    \ and use feedparser to pull down five, ten, 15 or more news stories. Then use\
    \ python-pptx to write your news data into a presentation and save it to your\
    \ folder. Open the file, and you have your own customised news article that includes\
    \ up to the minute news headlines and a hyperlink to each of the stories. Don't\
    \ like what you're reading? Simply change your source and run the program again.\n\
    \n![](img/e016e192a91ffc1a9e474690a590742f_155_0.png)\n\nAbove: Harvest stories\
    \ from news sites to create your own feed\n\n# Resources\n\n+   - **feedparser:**\n\
    \  - github.com/kurttmceee/feedparser\n- **Python-pptx**\n  - github.com/scanny/python-pptx"
