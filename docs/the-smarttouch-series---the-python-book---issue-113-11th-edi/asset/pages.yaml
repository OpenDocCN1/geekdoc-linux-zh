  md: "# ## 01 Preparing the directory structure\n\nAs we have mentioned previously,\
    \ each XBMC extension type follows a certain directory naming convention. In this\
    \ case we are building a video plug-in, so the plug-in directory name would be\
    \ **plugin.video.luddent**. But that's just the root directory name – we will\
    \ need several other folders and files as well.\n\n+   The following describes\
    \ the directory structure of LUDD Linux Entertainer:\nplugin.video.luddent – Root\
    \ Plugin directory\n├── addon.xml\n├── changelog.txt\n├── default.py\n├── icon.png\n\
    ├── LICENSE.txt\n├── README\n├── resources\n├── lib\n└── settings.xml\n\n# ##\
    \ 02 Creating addon.xml\n\nAn addon.xml file needs to be created in the root of\
    \ the extension directory. The addon.xml file contains the primary metadata from\
    \ a XBMC extension. It contains overview, credits, version information and dependencies\
    \ information about the extension.\n\nThe root element of addon.xml is the **\\\
    <addon\\>** element. It is defined as:\n\n```\n<addon id=\"plugin.video.luddent\"\
    \ name=\"LUD HSW Viwer\" version=\"0.0.1\" provider: name=\"LUDD\">rest of the\
    \ content is placed here</addon>\n```\n\nHere, **id** is the identifier for the\
    \ plug-in, so it should be unique among all the XBMC extensions, and it is also\
    \ used for the directory name; **version** tells XBMC the extension version number,\
    \ which helps in its ability to deliver automatic updates – XBMC follows the Major.Minor.Patch\
    \ versioning convention; **name** is the English title of the plug-in.\n\n**Note:**\
    \ Steps 3 to 5 cover entries that need to be added within the **addon.xml** file.\n\
    \n# ## 03 Adding dependency information\n\nDependency inside an extension is managed\
    \ using the **\\<requires\\>** element.\n\n```\n<requires><import addon=\"xbmc.python\"\
    \ version=\"2.1.0\"/><import addon=\"plugin.video.youtube\" version=\"3.0.0\"\
    /><import addon=\"plugin.video.version=\"2.3.0\"/><import addon=\"plugin.video.dailymotion.com\"\
    \ version=\"1.0.0\"/></requires>\n```\n\nIn the above code we have added a dependency\
    \ to a library called **xbmc.python** version 2.1. Currently it is added as a\
    \ mandatory dependency. To make the dependency optional you will need to add **optional=\"\
    true\"**, eg. `<import addon=\"kunal.special\" version=\"0.1.0\" optional=\"true\"\
    />`\n\nIn the above example we have added core dependency xbmc.python to 2.1.0\
    \ because it's the version shipped with XBMC version Frodo 12.0 and 12.1. If you\
    \ were to add xbmc.python to 2.0 then it would only work in XBMC Eden 11.0 and\
    \ not in the latest version.\n\nFor the current version of XBMC 12.1, the following\
    \ versions of core XBMC components are shipped: xmbc.python 2.1.0, xbmc.gui 4.0.0,\
    \ xbmc.json 6.0.0, xmbc.python 2.1.0, xbmc.metadata 12.0.0\n\nIn addition to xbmc.python\
    \ we are also adding some third-party plug-ins as dependencies, such as plugin.video.youtube.\
    \ These plug-ins will be installed automatically when we install plugin. video.luddent.\n\
    \n# ## 04 Setting up the provider and entry point\n\nOur extension is supposed\
    \ to provide the video content for XBMC. In order to convey that, we have to set\
    \ up the following element:\n\n```\n<extension point=\"xbmc.python.pluginsource\"\
    \ library=\"default.py\"><provides>videos</provides></extension>\n```\n\nHere,\
    \ the **library** attribute sets up the plug-in entry point. In this example default.py\
    \ will be executed when the user activates the plug-in. The **\\<provides\\>**\
    \ elements sets up the media type it provides. This also gets reflected in the\
    \ placement of the plug-in. Since ours is a video plug-in, it will show up in\
    \ the Videos section of XBMC.\n\n# ## 05 Setting up plug-in metadata\n\nMetadata\
    \ about the plug-in is provided in extension point\"xbmc.addon.metadata\". The\
    \ following are the important elements...\n\n+   * **\\<platform\\>**: Most of\
    \ the time, XBMC extensions are cross-platform compatible. However, if you depend\
    \ on the native platform library that is only available on certain platforms then\
    \ you will need to set the supported platforms here. Accepted values for the platform\
    \ are: all, linux, osx, osx32, osx64, ios (Apple iOS), win32 (Windows Directx),\
    \ wingl (Windows OpenGL) and android.\n* **\\<summary\\>**: This gives a brief\
    \ description of the plug-in. Our example sets the language attribute to English,\
    \ but you can use other languages too.\n* **\\<description\\>**: A detailed description\
    \ of the plug-in.\n* **\\<website\\>**: Webpage where the plug-in is hosted.\n\
    * **\\<source\\>**: Source code repository URL. If you are hosting your plug-in\
    \ on GitHub, you can mention the repository URL here.\n* **\\<forum\\>**: Discussion\
    \ forum URL for your plug-in.\n* **\\<email\\>**: Author email. You can directly\
    \ type email or use a bot-friendly email address like max at domain dot com.\n\
    \n# ## 06 Setting changelog, icon, fanart and licence\n\nWe need a few additional\
    \ files in the plug-in directory...:\n\n+   * **changelog.txt**: You should list\
    \ the changes made to your plug-in between releases. The changelog is visible\
    \ from the XBMC UI.\n\nAn example changelog:\n    0.0.1 – Initial Release\n  \
    \  0.0.2 – Fixed Video Buffering Issue\n* **icon.png**: This will represent the\
    \ plug-in in the XBMC UI. It needs to be a non-transparent PNG file of size 256x256.\n\
    * **fanart.jpg (optional)**: The fanart.jpg is rendered in the background if a\
    \ user selects the plug-in in XBMC. The art needs to be rendered in HDTV formats,\
    \ so its size can range from 1280x720 (720p) up to the maximum 1920x1080 (1080p)."
  merge: -1
