  md: '# # Get started

    with

    Python


    > Always wanted to have a go at programming? No more excuses, because Python is
    the perfect way to get started!


    Python is a great programming language for both beginners and experts. It is designed
    with code readability in mind, making it an excellent choice for beginners who
    are still getting used to various programming concepts.


    +   - The language is popular and has plenty of libraries available, allowing
    programmers to get a lot done with relatively little code.

    - You can make all kinds of applications in Python: you could use the Pygame framework
    to write simple 2D games, you could use the GTK libraries to create a windowed
    application, or you could try something a little more ambitious like an app such
    as creating one using Python’s Bluetooth and Input libraries to capture the input
    from a USB keyboard and relay the input events to an Android phone.


    For this guide we''re going to be using Python 2.x since that is the version that
    is most likely to be installed on your Linux distribution.


    In the following tutorials, you''ll learn how to create popular games using Python
    programming. We''ll also show you how to add sound and AI to these games.'
