  md: "# Create with Python\n\n# Quick tip\n\nCould we take things to the next level\
    \ and create a four-player version of Pong, with a paddle on every side? It would\
    \ be utter madness, but it sounds fun!\n\n```\nimport pygame\nBLACK = (0,0,0)\n\
    class Paddle(pygame.sprite.Sprite):\n    def __init__(self, color, width, height):\n\
    \        super().__init__()\n        self.image = pygame.Surface([width, height])\n\
    \        self.image.fill(BLACK)\n        self.image.set_colorkey(BLACK)\n    \
    \    pygame.draw.rect(self.image, color, [0, 0, width, height])\n        self.rect\
    \ = self.image.get_rect()\n```\n\nIn our first class we’re setting the basic parameters\
    \ of height, width and colour, as well as the shape. There’s not much to it, because\
    \ we’re inheriting pygame.sprite class and building upon that. We don’t, therefore,\
    \ have to specify what a rectangle is or how to draw one.\n\nTo control the movement\
    \ of our paddles, we’ll need a couple of methods: one for the x-axis and another\
    \ for the y-axis. Keeping in mind a pixel check to ensure they never go off the\
    \ screen:\n\n```\ndef moveUp(self, pixels):\n    self.rect.y -= pixels\n    if\
    \ self.rect.y < 0:\n        self.rect.y = 0\n```\n\n# Taking Pong to the next\
    \ level\n\nWith Pong having been around for over 40 years, we’ve seen many iterations\
    \ of what is essentially a basic game. Once our PyGame version of the game is\
    \ fully functional, perhaps we could consider what steps we might take to improve\
    \ our game? On the easier end of the spectrum we could change the colour scheme\
    \ from black and white to something more contemporary. When Pong was first released,\
    \ black and white were the only options available. By the time the Atari came\
    \ out there were 128 colours in the PAL format. Eight-bit consoles introduced\
    \ 256 colours, and we’re now literally in the billions. Our game is designed with\
    \ a VGA resolution, so if we were sticking to those retro/vintage aesthetics we’d\
    \ only have 75 colours available to us. Try changing your Pong game to blue and\
    \ yellow, for example. What effect would changing the frame rate have on the game?\
    \ Does increasing or decreasing it affect gameplay? Could we implement a momentary\
    \ speedup when the ball hits a wall surface, and a temporary slowdown when the\
    \ ball bounces off a paddle? That might provide a dramatic special effect. Likewise,\
    \ we could change the speed of the ball itself.\n\nTo make the game difficult,\
    \ if we were to introduce ‘levels’ we might want to set the paddles to a smaller\
    \ size. There’s to make things go completely wrong so we could change the angles\
    \ that balls bounce off walls, or even introduce more balls by spawning more objects\
    \ from the ball class.\n\n![](img/e016e192a91ffc1a9e474690a590742f_109_0.png)\n\
    \n![](img/e016e192a91ffc1a9e474690a590742f_109_1.png)\n\nAbove Pong with working\
    \ paddles and bouncing ball.\n\n```\ndef moveDown(self, pixels):\n    self.rect.y\
    \ += pixels\n    if self.rect.y > 400:\n        self.rect.y = 400\n```\n\nTo implement\
    \ our new class into our game, switch back to pong.py and import it as we would\
    \ any other module, by adding from paddle import Paddle to the top of the code.\n\
    \nCreating instances of the paddle class is as simple as creating objects. By\
    \ inserting the code shown below somewhere after defining our window, we’re able\
    \ to create two paddles: one for player A and the other for player B.\n\n```\n\
    paddleA = Paddle(WHITE, 10, 100)\npaddleA.rect.x = 20\npaddleA.rect.y = 200\n\n\
    paddleB = Paddle(WHITE, 10, 100)\npaddleB.rect.x = 670\npaddleB.rect.y = 200\n\
    ```\n\nImmediately after that we’ll want to create a list of all the sprites we’re\
    \ using, including these two paddles:\n\n```\nall_sprites_list = pygame.sprite.Group()\n\
