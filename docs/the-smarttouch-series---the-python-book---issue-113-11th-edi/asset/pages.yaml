  md: '# # Embed Python in C


    Here, we will learn how to use Python code within your usual C program to get
    the best of both worlds


    There are times, within a C program, when you may want to execute some piece of
    Python code. Maybe you want to be able to run user code within your program, for
    example. This means you can enable users to use plug-ins to extend your program''s
    functionality. The way we can do this is by embedding Python within the C program.


    We will look at how to embed, how to run your Python code, and how to interact
    with the Python interpreter you''ve set up. This is functionality built into Python
    itself, so you don''t need to install anything extra on your Raspberry Pi, aside
    from the development package for Python and GCC. You will need to install them
    with the command:


    ```

    sudo apt-get install python-dev gcc

    ```


    You should now have all of the tools you need to compile your code.


    The first step is to start the interpreter. To access the functions you need,
    you''ll have to add the following line to the head of your C source code file:


    ```

    #include <Python.h>

    ```


    You can now start to embed Python. The first function you need is void Py_Initialize().
    The only other functions that can be called, before you initialise the interpreter,
    are Py_SetProgramName(), Py_SetPythonHome(), PyEval_InitThreads(), PyEval_ReleaseLock()
    and PyEval_AcquireLock(). Once this function finishes, you can start to interact
    with this interpreter. This starts up the interpreter, and loads the core modules
    `__builtin__`, `__main__` and sys. But what about other modules? You can set the
    search path, where the interpreter will look to find modules, by using the function
    void Py\_SetPythonHome(char *home). If you need the information, you can find
    the current module path with the function char\* Py_GetPythonHome().


    It does not set sys.startup, however, you need to use the function void Py\_Sys\_SetArgv(int
    argc, char \*\*argv, int updateargv). This way you can access any command line
    arguments that your Python code needs. You can check to see whether the interpreter
    is properly initialised by using the function int Py_IsInitialized(). It returns
    an integer for either true (nonzero) or false (zero).


    The simplest way to use your new interpreter is to use the function int PyRun\_SimpleString(const
    char \*command). This function takes a string that contains some arbitrary bit
    of code. If you have multiple lines of code that you want to run, you can use
    newline characters to separate the lines. For example, you can print out the sine
    of an angle with:


    ```

    PyRun_SimpleString("import math\na = math.sin(45)\nprint(''The sine of 45 is ''
    + a'')")

    ```


    This function is a simplified version of int PyRun\_SimpleStringFlags(const char
    \*command, PyObject\*flags \*flags). This not only takes the command string, but
    also takes a struct of compiler flags for the Python compiler. You will need to
    check the development documentation online to see the details for these compiler
    flags. Let''s say that you have a more complicated bit of code to execute. There
    are equivalent functions to work with Python script files. The simplified version
    is int PyRun\_SimpleFile(FILE \*fp, const char \*filename). You actually hand
    in two references to your script. The first is a file handle that you get from
    the C function fopen() to open your script file, and the second is the name of
    the script you just opened.


    You need to open your script file with the read permission. You also now need
    to worry about whether your program will have the correct file permissions on
    the file system to open this script. Proper coding means you should check this
    call to fopen() to verify that it completed and gave you a valid file handle.
    This simplified version doesn''t use any compiler flags, and closes the file handle
    after the function returns. The full version of the function is int PyRun\_SimpleStringFlags(FILE
    \*fp, const char \*filename, int closeit, Py\_CompilerFlags \*flags). If closeit
    is true, then the file handle is closed. If the script is something you will want
    to run several times, set closeit to false so the file handle remains open. You
    can set any flags for the Python interpreter in the flags struct, similar to the
    PyRun\_SimpleStringFlags() function call.


    If this simple way of running code isn''t powerful enough, there are ways of interacting
    with the interpreter in a more direct fashion. The first step is learning how
    to send data back and forth between the Python interpreter and the main body of
    your C program. The basic workflow is to convert your C variables to their Python
    equivalents, then call the Python functions you wish to use, and convert the Python
    results back into their equivalents within C. Python is an object-oriented language,
    so the core of communicating with the interpreter happens with the Py\_Object
    construct. This provides the base for all the other types of objects you can use
    to communicate with Python. For example, create a Python string object with:


    ```

    PyObject *pName;

    pName = PyString_FromString("print(''Hello World'')");

    ```


    You can then use this Python object when using Python functions. You can also
    get access to Python functions from your C code. You store a reference to the
    function in a PyObject, just as with data objects. The first step is to get the
    dictionary of the function names for the module in question with:


    ```

    my_module = PyImport_ImportModule("__main__");

    my_dict = PyModule_GetDict(my_module);

    ```


    Once you have the dictionary, you can get a reference to specific function with:


    ```

    my_func = PyDict_GetItemString(my_dict, func_name);

    ```


    After doing this you will find that where func\_name is a string containing the
    function you want access to, you can then run the function with a command like:'
