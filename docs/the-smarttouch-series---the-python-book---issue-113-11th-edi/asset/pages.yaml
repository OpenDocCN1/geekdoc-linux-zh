- pgno: 125
  md: "# Create with Python\n\nRight. The bat and ball come first – they’re the cornerstones\
    \ of Pong and Breakout\n\n![](img/e016e192a91ffc1a9e474690a590742f_125_0.png)\n\
    \n# Program objects\n\nDavid Ames, who uses P\\&O to teach younger children to\
    \ code at events across the UK, told us: “One thing to avoid when it comes to\
    \ teaching kids is Object Orientation,” OOP (object-oriented programming) is partly\
    \ abstracted away by P\\&O, but it can’t be ignored.\\n\\nPerhaps the best approach\
    \ is using P\\&O and some simple code to start, then dropping in a piece of OOP\
    \ when it’s needed to solve a particular problem.\\n\\nWith the Code Club age\
    \ group – about eight to eleven – feeding information to solve practical problems\
    \ works well. It can work with adults, too, but there’s always someone who’s read\
    \ ahead and has a few tricky questions.\n\n# 06 Sprite\n\nThe intro example from\
    \ the P\\&O docs loads on that with the Actor class, which will automatically\
    \ load the named sprite (P\\&O will hunt around for a .jpg or .png in a subdirectory\
    \ called images).\n\n```\nalien = Actor('alien')\nalien.pos = 100, 56\nWIDTH =\
    \ 500\nHEIGHT = alien.height + 20\ndef draw():\n    screen.clear()\n    alien.draw()\n\
    ```\n\nYou can download the alien from the P\\&O documentation (bit.ly/1SmEiM7)\
    \ and try out the animation shown there, but we’re taking a different approach\
    \ in our game.\n\n# 07 Breakout via Pong\n\nWhile the Pi is something of a tribute\
    \ to 1980s 8-bit computers, Breakout comes from the 1970s and is a direct descendant\
    \ of the early arcade classic Pong. We’ll follow the route from Pong to Breakout\
    \ (which historically involved Apple founders Steve Wozniak and Steve Jobs) in\
    \ the steps to creating our code, leaving you with the option of developing the\
    \ Pong elements into a proper game, as well as refining the finished Breakout.clone.\n\
    \n# 08 Batty\n\nYou can think of Breakout as essentially being a moving bat –\
    \ that is, you’re hitting a moving ball in order to knock out blocks. The bat\
    \ is a rectangle, and Pygame’s Rect objects store and manipulate rectangular areas\
    \ – we use Rect(left, top, width, height), before which we define the bat colour\
    \ and then call upon the draw function to put the bat on the screen, using the\
    \ screen function.\n\n```\nW = 800\nH = 600\nRED = 200, 0, 0\nbat = Rect((W//2,\
    \ 0.96 * H), (150, 15))\ndef draw():\n    screen.clear()\n    screen.draw.filled_rect(bat,\
    \ RED)\n```\n\n![](img/e016e192a91ffc1a9e474690a590742f_125_1.png)\n\n# 09 Mouse\
    \ move\n\nWe want to move the bat, and the mouse is closer to an arcade paddle\
    \ than the arrow keys. Add the following:\n\n```\ndef on_mouse_move(pos):\n  \
    \  x, y = pos\n    bat.center = (x, bat.center[1])\n```\n\nUse pgzrun to test\
    \ that you have a screen, bat and movement."
  merge: -1
  img_proc: true
- pgno: 126
  md: '# 10 Square ball


    In properly retro graphics-style, we define a square ball too – another rectangle,
    essentially with the (30, 30) size marking that subset of rectangles that we call
    a square.


    We’re doing this because Rect is another built-in in Pg10. If we wanted a circular
    ball, we’d have to define a class and then use Pygame’s draw.filled_circle(pos,
    radius, (r, g, b)) – but Rect we can call directly. Simply add:


    ```

    WHITE = 200,200,200

    ball = Rect((W/2, H/2), (30, 30))

    ```


    ...to the initial variable assignments, and:


    ```

    screen.draw.filled_rect(ball, WHITE)

    ```


    ...to the def draw() block.


    ![](img/e016e192a91ffc1a9e474690a590742f_126_0.png)


    # 11 Action!


    Now let’s make the ball move. Download the tutorial resources in FileSilo.co.uk
    and then add the code inside the “move.py” file to assign movement and velocity.
    Change the 5 in ball_dir = Direction(5, -5) if you want the ball slower or faster,
    as your processor (and dexterity) demands – but it’s hard to tell now because
    the ball goes straight off the screen! Pg0 will call the update() function you
    define once per frame, giving the illusion of smooth(ish) scrolling if you’re
    not running much else.


    # 12 def move(ball)


    To get the ball to move within the screen we need to define move(ball) for each
    case where the ball meets a wall. For this we use if statements to reverse the
    ball’s direction at each of the boundaries.


    Note the hardcoded value of 781 for the width of screen, minus the width of ball
    – it’s okay to hardcode values in early versions of code, but it’s the kind of
    thing that will need changing if your project expands. For example, a resizable
    screen would need a value of W - 30.


    # 13 Absolute values


    You might expect multiplying y by minus one to work for reversing the direction
    of the ball when it hits the bat:


    ```

    ball_dir = Direction(ball_dir.x, -1 * ball_dir.y)

    ```


    ...but you actually need to use abs, which removes any minus signs, then minus:


    ```

    ball_dir = Direction(ball_dir.x, - abs(ball_dir.y))

    ```


    Try it without the finished code and see if you get some strange behaviour. Your
    homework is to work out why.


    > To get the ball to move we need to define move(ball) for each case where the
    ball meets a wall


