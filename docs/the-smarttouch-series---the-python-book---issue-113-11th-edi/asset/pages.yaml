  md: 'original Pac-Man game was released between the two, Lunar Lander being 1979
    and the first side-scroller being 1981. Python is perfect for our retro gaming
    projects. So let’s begin.


    We will, of course, need Python installed. We’ll use Python 3 for this tutorial.
    If you’re on a Debian-based distro you can get set up with `sudo apt-get update`,
    followed by `sudo apt-get install python3`. We’ll also be taking advantage of
    a vector graphics module linuxformat.py which can be found at the source code
    link on our Archives page at www.linuxformat.com/code. Once downloaded or copied,
    ensure linuxformat.py is saved in the same directory as the Python project we’re
    about to develop.


    Start a new Python file. Using your favourite text editor create an empty file
    and save it in the same folder as linuxformat.py, which we’ll be using as a reference
    module for vector graphics. When it comes to programming, there’s no point reinventing
    the wheel every time. Start your new document off with a new modular imports:


