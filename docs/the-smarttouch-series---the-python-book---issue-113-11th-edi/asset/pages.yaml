  md: '# 18 Category definition


    Finish the definition by using the parent\_id to filter the correct Posts. Then
    re-render the response. category\_posts = Post.objects.filter(category=category.id)
    return render\_to\_response(''blog/categories.html'', dict(category\_posts=category\_posts,
    categories=categories))


    Again we''re calling a new template that we''ll construct shortly.


    ![](img/e016e192a91ffc1a9e474690a590742f_152_0.png)


    ![](img/e016e192a91ffc1a9e474690a590742f_152_1.png)


    # 19 Category URLs


    We''ll create the URL in urls.py as for the post page. only it''ll give the slug
    of the category instead of an ID in the link. url(r"\^myblog/category/(?P<category\_id>d+)/?$",
    ''blog.urls.blog\_categories''),


    ![](img/e016e192a91ffc1a9e474690a590742f_152_2.png)


    ![](img/e016e192a91ffc1a9e474690a590742f_152_3.png)


    ![](img/e016e192a91ffc1a9e474690a590742f_152_4.png)


    # 20 Category template


    We''ll use something similar to the Index and Post template to create a category
    page template: `<% for post in category\_posts %>` `<h2><a href="/myblog/{{ post.pk
    }}/>{{ post.title }}</a></h2> {{ post.author }} on {{ post.date }} % {{ post.excerpt
    }} <p> {{ post.excerpt }}</p> ({{ post.excerpt }} <truncatedwords:3 else % > <p>
    {{ post.post}}<truncatedwords:3 /> </p> `<% end for %>` `<Category: {{ post.category
    }} />` `<% endfor %>`


    # 21 Category clickthrough


    Finally, let''s make the categories click through to the relevant page by changing
    the


    category display to be: `<p<Category: <a href="/myblog/category/{{ categories.pk
    }}>{{ post.category }}></a></p>` This can go on the categories, post and index
    template.


    ![](img/e016e192a91ffc1a9e474690a590742f_152_5.png)


    # 22 RSS


    Django has a built-in RSS framework. In blog/urls.py add from django.contrib.syndication.views
    import Feed class BlogFeed(Feed): title = "Blog Feed" link = "/" def items(self):
    return Post.objects.order\_by("\-pub\_date") def item\_title(self, post): return
    post.title


    # 23 RSS links


    We need to define item\_link for the feed so that the feed items can link to the
    right page. We have to give the complete URL and the post ID for it to work: def
    item\_link(self, post): link = "http://127.0.0.1:8000/myblog/"+str(post.pk) return
    link


    ![](img/e016e192a91ffc1a9e474690a590742f_152_6.png)


    ![](img/e016e192a91ffc1a9e474690a590742f_152_7.png)


    # 24 RSS URLs


    The final step is adding the feed URL to urls.py. url(r"\^myblog/feed/$", BlogFeed()),
    And now your blog is now fully functional. With a bit more tweaking and theming,
    you can get it online and blog away!




    > “ Finally, let''s make the categories click through to the relevant page ”'
