- pgno: 147
  md: '# ## 09

    **Wrong page**


    Let’s add a quick bit of code to return somebody to the previous page if they
    get the URL wrong:


    ```

    ```python

    from django.core.paginator import Paginator, EmptyPage, InvalidPage

    try:

    post_list = paginator.page(list_page)

    except (EmptyPage, InvalidPage):

    post_list = paginator.page(paginator.num_pages)

    ```

    ```


    The last part replaces `post_list = paginator.page(list_page)`


    ![](img/e016e192a91ffc1a9e474690a590742f_147_0.png)


    # ## 10

    **Have your say**


    Everyone has their opinion on the internet. You can give your readers the ability
    to comment, and we’ll start by editing models.py.


    ```

    ```python

    class Comment(models.Model):

    author = models.CharField(max_length=50)

    text = models.TextField()

    post = models.ForeignKey(Post)

    def __unicode__(self):

    return (self.post, self.text)

    ```

    ```


    We’ve made it so they can put their name with a comment.


    ![](img/e016e192a91ffc1a9e474690a590742f_147_1.png)


    # ## 11

    **Back to the comment**


    We now need to add a small line to the urls.py file in myblog so the comment can
    be posted then sent back to the original page:


    ```

    `url(r‘myblog/add_comment/(?P<id>$’, ‘blog.urls.add_comment’,)`

    ```


    This URL pattern calls the ID of the page that you’re on.


    # “We need to be able to process the data and metadata in the forms”


    # ## 12

    **Form a comment**


    We need to be able to process the data and metadata in the forms, so let’s add
    a class to urls.py in the blog folder with the following additions:


    ```

    ```python

    from django.forms import ModelForm

    from blog.models import Post, Comment

    class CommentForm(ModelForm):

    class Meta:

    model = Comment

    exclude = [‘post’]

    ```

    ```


    ![](img/e016e192a91ffc1a9e474690a590742f_147_2.png)


    # ## 13

    **In the post**


    We need to attribute the comments to the post they’re being made on, so update
    the post_page definition:


    ```

    ```python

    from django.core.context_processors import csrf

    def post_page(request, post_id):

    post_page = Post.objects.get(pk=post_id)

    comments = Comment.objects.filter(post=post_page)

    d = dict(post_page=post_page, comments=comments, form=CommentForm())

    d.update(csrf(request))

    return render_to_response(‘blog/post.html’, d)

    ```

    ```


    The CSRF tag is to prevent cross-site request forgery.


    ![](img/e016e192a91ffc1a9e474690a590742f_147_3.png)


    # ## 14

    **Comment template**


    Let’s get the post page ready for comments by adding this to post.html:


    ```

    ```

    &lt;p&gt;Comments:&lt;/p&gt;

    {% for comments in comments %}

    {{ comments.author }}

    &lt;p&gt;{{ comment.text }}&lt;/p&gt;

    {% endfor %}

    &lt;strong&gt;Add comment&lt;/strong&gt;

    &lt;form action="{% url blog.urls. add_comment post_page.id %}

    method="POST"{% csrf_token %}

    Name {{ form.author }}

    &lt;p&gt;{{ form.text }}&lt;/p&gt;

    &lt;input type="submit"

    value="Submit"&gt;

    &lt;/form&gt;

    ```

    ```


    # ## 15

    **Define your comments**


    The final step is defining the comments in blog/urls.py, and it’s a big one:


    ```

    ```python

    def add_comment(request, comment_id):

    p = request.POST

    if p.has_key(‘text’) and p[‘text’]:

    author = ‘Anonymous’

    if p[‘author’]: author = p[‘author’]

    comment = Comment(post=Post.objects.get(pk=comment_id))

    cf = CommentForm(p,

    instance=comment)

    cf.fields[‘author’].required = False

    comment =

    cf.save(commit=False)

    comment.author = author

    comment.save()

    return HttpResponseRedirect(reverse(‘blog.urls.post_page’, args=[comment.id]))

    ```

    ```


    This ensures text has been entered, and if no specified author is ‘Anonymous’.
    Before testing, run syncdb so comment tables can be created.'
