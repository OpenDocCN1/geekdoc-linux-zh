    you can call it anything you like, as long as you''re consistent with it. We''ve
    also named it using the title command from Tkinter and a string of text.


    +   **05 Main frame** The first line has us set the variable mainframe as a Frame
    in the interface. We''ve attached it to root, the main window, and given


    it a minimum height and width in pixels. We use pack_propagate to create the window,
    and then make sure it''s the size that we''ve defined. We''ve then used pack to
    pad the borders, allowing the contents of the window to not touch the sides of
