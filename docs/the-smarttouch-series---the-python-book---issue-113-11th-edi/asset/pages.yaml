- pgno: 121
  md: "![](img/e016e192a91ffc1a9e474690a590742f_121_0.png)\n\n![](img/e016e192a91ffc1a9e474690a590742f_121_1.png)\n\
    \nRight. Nothing says “game over” quite like a huge eruption of lava\n\n# 07 Creating\
    \ the mine\n\nIn the previous step you found the player’s location on the board.\
    \ This x, y, z data can be reused to place the mine on the board. The code mine\
    \ = random.randrange(0, 11, 1) generates a random number between 1 and 10. Combine\
    \ this with the player’s current x axis position and add the random number to\
    \ the position – this creates a random mine block on the board.\n\n```\n```\n\
    \ mine_x = int(x+mine)\n mine_y = int(y-1)\n mine_z = int(z+mine)\n```\n```\n\n\
    Use setBlock to place the mine: mc.setBlock(mine_x, mine_y, mine_z,58). Using\
    \ y-1 ensures that the block is placed on the same level as the board and is therefore\
    \ hidden. The number 58 is the block ID, which you can change if you wish to see\
    \ where the mine is; this is useful for testing that the rest of the code is working\
    \ correctly. Remember to change it back before you play!\n\n# 08 Create a score\
    \ variable\n\nEach second that you remain alive within the game, a point is added\
    \ to your score. Create a variable to store the current score, setting it to a\
    \ value of zero at the beginning of the game. Use the postToChat code to announce\
    \ the score at the beginning of the game. Note that MC cannot print a value to\
    \ chat, so the score is first converted into a string before it is displayed.\n\
    \n```\n```\n score = 0\n mc.postToChat(\"Score is \"+str(score))\n time.sleep(10)\n\
    ```\n```\n\n# 09 Check the player’s position on the board\n\nNext, you need to\
    \ check the player’s position on the board and see if they are standing on the\
    \ mine. This uses a while loop to continually check that your player’s position\
    \ is safe, no mine, else game over. Since the player’s coordinate position is\
    \ used to build the original board and place the mine, you have to find the player’s\
    \ position again and store it as a new variable – x1, y1 and z1\n\nfind the player’s\
    \ position again and store it as a new variable – x1, y1 and z1\n\n```\n```\n\
    \ while True:\n x1, y1, z1 = mc.player.getTilePos()\n```\n```\n\n# 10 One point,\
    \ please\n\nNow that the player has moved one square they are awarded a point.\
    \ This is a simple action of adding the value one to the existing score value.\
    \ This is achieved using score = score + 1. Since it sits inside a loop, it will\
    \ add one point each time the player moves.\n\n```\n```\n time.sleep(.1)\n score\
    \ = score + 1\n```\n```\n\n# 11 The tension increases...\n\nOnce you have been\
    \ awarded a point, the next stage of the game is to check whether the block you\
    \ are standing on is a safe block or if it is the mine. This uses a conditional\
    \ to compare the coordinates of the block beneath you – x1, y1-1, z1 – with the\
    \ mine_x, mine_y, mine_z position of the mine. If they are equal then you are\
    \ standing on the mine. In the next step you will code the explosion:\n\n```\n\
    ```\n if (x1, y1-1, z1) == (mine_x, mine_y, mine_z):\n```\n```\n\n# 12 Setting\
    \ the mine off\n\nIn the previous step a conditional checks whether you are standing\
    \ on the mine or a safe block. If it is the mine then it will explode. To create\
    \ this, use lava blocks, which will flow and engulf the player. You can use the\
    \ mc.setBlocks code to set blocks between two points. Lava blocks are affected\
    \ by gravity, so setting them higher than the player means that the lava flows\
    \ down over the player.\n\n```\n```\n mc.setBlocks(x-5, y+1, z-5, x+5, y+2, z+5,\
    \ 10)\n```\n```\n\n# Other Minecraft hacks\n\nIf you enjoy programming and manipulating\
    \ Minecraft then there are more great Raspberry Pi-based projects for you to check\
    \ out. Our expert has a bunch of them at teacead.co.uk/minecraft. htm. The folks\
    \ behind Adventures in Minecraft have some great guides over at stuttacodoc.com/pyminecraft.\
    \ html, as well."
