  md: '# # Revisit the arcade classic

    ## Pong in Python


    Calvin Robinson takes us through creating a contemporary homage to Pong – considered
    by many to be the very first arcade game.


    This series of building retro games in Python has so far seen us coding a lunar
    landing space module (LXF262), a side-scrolling platformer (LXF263), the famous
    pellet-munching, ghost-chasing Pac-Man (page 104), and in this tutorial we’re
    going to develop our own version of Pong! To many, Pong is the original arcade
    game. It’s certainly the first video game to become a commercial success. Released
    for arcades in 1972 and for the home in 1975, Pong has gained popularity worldwide
    and is now permanently memorialised in the Smithsonian Institute in Washington,
    DC. Developed and self-published by Atari, Pong is a 2D table tennis simulation
    with arguably the most simplistic game design imaginable, while managing to achieve
    an incredibly addictive gaming experience.


    # ## What gameplay?


    Gameplay mechanics in Pong are quite simple. It’s essentially ping-pong seen from
    a basic bird’s-eye view. The game makes use of vector graphics to display a rectangular
    shape for the players’ pads and a square (or rough circle, depending on the processing
    power) for the ball.


    In single-player mode, the player moves one paddle and the computer acts as a
    non-player character, controlling the second. The idea is to get the ball to pass
    the opponent’s paddle on their side of the screen. You earn a point for each time
    the opponent misses a rally. Atari’s Home Pong console was set up for two-player
    mode, with a paddle for each player. That’s the version we’re going to create
    today. Since we don’t have hardware and we’re programming this entirely in Python,
    we’ll give each player two keys on either side of the keyboard: one for up, one
    for down.


    ![](img/e016e192a91ffc1a9e474690a590742f_107_0.png)


    Python offers us an accessible programming language with straightforward syntax.
    It’s the perfect language for playing around with vector-based video games. Let’s
    go!


    # ## Ping-pong Python


    Without getting into any debates between version 2 versus version 3, we’ll be
    using Python 3 for this tutorial. If you’re running a Debian based Linux distro
    you can install Python in Terminal with the command `sudo apt-get install python3`
    after a quick update with `sudo apt-get update`, of course. We’ll also be taking
    advantage of a vector graphics module `linuxformat.py` from last issue. This can
    be found on the disc, or via the source code link on our Archives page at `www.linuxformat.com/archives`.
    Once downloaded or copied, ensure `linuxformat.py` is saved in the same directory
    as the rest of the files we create in this tutorial.


    Now that Python 3 is installed we can create a new Python file. Using your favourite
    text editor create an empty file and save it in the same folder as your `linuxformat.py`,
    which we’ll be using as a reference module for vector graphics. To create the
    file you can use `touch pong.py` followed by `nano pong.py`, or open it directly
    through the Python IDE.


    We’re going to take advantage of the PyGame toolset for this project. PyGame is
    a useful module designed to assist with, as the name would suggest, the development
    of games in Python. PyGame includes a sprite class with shapes such as the rectangle,
    which we’ll certainly make use of. To install PyGame use `pip` in command line:
    `pip3 install pygame` should cover it. Remember to use `pip3` to install modules
    for Python 3, rather than just `pip`, which can get messy with multiple installations
    of Python on a single machine.


    When it comes to programming, there’s no point re-inventing the wheel every time.
    Start off by importing the pygame module and initialising the game engine:


    ```

    ```

    import pygame

    pygame.init()

    ```

    ```


    Let’s declare those constant ‘variables’ and define the'
