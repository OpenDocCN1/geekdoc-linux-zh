- pgno: 13
  md: "# Get started with Python\n\n```\nTIP\nYou can define defaults for variables\
    \ if you want to be able to call the function without passing any variables through\
    \ at all. You do this by putting an equals sign after the variable name. For example\n\
    ```\n\n```\n# Or with a while loop:\nprint(\"Using a while loop\")\n# We already\
    \ have the total above, but knowing the len function is very useful.\ntotal =\
    \ len(ints)\ncount = 0\nwhile count < to tal:\n    print(str(ints[count]))\n \
    \   count += 1\n```\n\n# Functions and variable scope\n\nFunctions are used in\
    \ programming to break processes down into smaller chunks. This often makes code\
    \ much easier to read. Functions can also be reusable if designed in a certain\
    \ way. Functions can have variables passed to them. Variables in Python are always\
    \ passed by value, which means that a copy of the variable is passed to the function\
    \ that is only valid in the scope of the function. Any changes made to the original\
    \ variable inside the function will be discarded. However, functions can also\
    \ return values, so this isn't an issue. Functions are defined with the keyword\
    \ def, followed by the name of the function. Any variables that can be passed\
    \ through are put in brackets following the function's name. Multiple variables\
    \ are separated by commas. The names given to the variables in these brackets\
    \ are the ones that they will have in the scope of the function, regardless of\
    \ what the variable that's passed to the function is called. Let's see this in\
    \ action.\n\nThe output from the program opposite is as follows:\n\n> “Functions\
    \ are used in programming to break processes down in”\n\nWe are now outside of\
    \ the scope of the modify_string function, as we have reduced the level of indentation\n\
    \nThe test string won't be changed in this code\n\nHowever, we can call the function\
    \ like this\n\n```\n#!/usr/bin/env python2\n\n# Below is a function called modify_string,\
    \ which accepts a variable # that will be called original in the scope of the\
    \ function. Anything\n# indented with 4 spaces under the function definition is\
    \ in the # scope.\n\ndef modify_string(original):\n    original += \" that has\
    \ been modified.\"\n    # At the moment, only the local copy of this string has\
    \ been modified\n\ndef modify_string_return(original):\n    original += \" that\
    \ has been modified.\"\n    # However, we can return our local copy to the caller.\
    \ The function # ends as soon as the return statement is used, regardless of where\
    \ it\n    # is in the function.\n    return original\n\ntest_string = \"This is\
    \ a test string\"\nmodify_string(test_string)\nprint(test_string)\n\ntest_string\
    \ = modify_string_return(test_string)\nprint(test_string)\n# The function's return\
    \ value is stored in the variable test_string, # overwriting the original and\
    \ therefore changing the value that is\n# printed.\n```"
  merge: -1
