    ```\ndef run(self):\n    # The thread's loop to receive and process messages\n\
    \    while self.listening:\n        data = \"\"\n        try:\n            data\
    \ = self.socket.recv(1024)\n        except socket.error:\n            \"Unable\
    \ to recieve data\"\n\n        self.handle_msg(data)\n        time.sleep(0.1)\n\
    \n# The while loop has ended\nprint \"Ending client thread for {}\".format(self.address)\n\
    ```\n\n# 05 The echo function\n\nWe need a function that can be called from a\
    \ client's thread to echo a message to each client. This function is pretty simple.\
    \ The most important part is that sending data to sockets is in a **try** block,\
    \ which means that we can handle the exception if the operation fails, rather\
    \ than having the program crash.\n\n```\ndef echo(self, data):\n    # Send a message\
    \ to each socket in client_sockets\n    print \"echoing: {}\".format(data)\n \
    \   for socket in self.client_sockets:\n        # Try and echo to all clients\n\
    \        try:\n            socket.sendall(data)\n        except socket.error:\n\
    \            print \"Unable to send message\"\n```\n\n# 07 The client thread\n\
    \nThe class that is used to deal with each client inherits the `Thread` class.\
    \ This means that the class can be created, then started with `client_thread.start()`.\
    \ At this point, the code in the `run` function of the class will be run in the\
    \ background and the main loop of the `Server` class will continue to accept new\
    \ connections.\n\nWe have to start by initialising the Thread base class, using\
    \ the `super` keyword. You may have noticed that when we created a new instance\
    \ of the `ClientListener` class in the server's main loop, we passed through the\
    \ server's `self` variable. We do this because it's better for each instance of\
    \ the ClientListener class to have its own reference to the server, rather than\
    \ using the global one that will create later to actually start the application.\n\
    \n```\nclass ClientListener(threading.Thread):\n    def __init__(self, server,\
    \ socket, address):\n        # Initialise the Thread base class\n        super(ClientListener,\
    \ self).__init__()\n        # Store the values that have been passed to the constructor\n\
    \        self.server = server\n        self.address = address\n        self.socket\
    \ = socket\n        self.listening = True\n        self.username = \"No Username\"\
    \n```\n\n# 09 Tidying up\n\nWe need to have a function to tidy up the thread.\
    \ We'll call this either when the client sends us a blank string (indicating that\
    \ it's stopped listening on the socket) or sends us the string \"QUIT\". When\
    \ this happens, we'll echo to every client that the user has quit.\n\n```\ndef\
    \ quit(self):\n    # Tidy up and end the thread\n    self.listening = False\n\
    \    self.socket.close()\n    self.server.remove_socket(self.socket)\n    self.server.echo(\"\
    {} has quit.\".format(self.username))\n```\n\n# 06 Finishing the Server class\n\
    \nThe remainder of the `Server` class is taken up with a couple of simple functions:\
    \ one to remove a socket from the collection of sockets, which doesn't need an\
    \ explanation, and the `signal_handler` function that we talked about in the `initialiser`\
    \ of the class. This function stops listening for new connections, and unbinds\
    \ the socket from the port it was listening on. Finally, we send a message to\
    \ each client to let them know that we are exiting. The signal will continue to\
    \ close the program as expected once the signal_handler function has ended.\n\n\
    ```\ndef remove_socket(self, socket):\n```\n\n# 08 The clientthread's loop\n\n\
    The loop that runs in the client thread is pretty similar to one in the server.\
    \ It keeps listening for data while `self.listening` is true, and passes any data\
    \ it gets to a `handle_msg` function that we will write shortly. The value passed\
    \ to the `socket.recv` function is the size of the buffer to use while receiving\
    \ data.\n\n# 10 Handling messages\n\nThere are three possible messages our clients\
    \ can send:\n\n+   * QUIT\n* USERNAME user\n* Arbitrary string to be echoed to\
    \ all clients\n\nThe client will also send a bunch of empty messages if the socket\
    \ has been closed, so we will end their thread if that happens. The code should\
    \ be pretty self-explanatory apart from the regular expression part. If someone\
    \ sends the USERNAME message, then the server tells every client that a new user\
    \ has joined. This is tested with a regular expression. `^` indicates the start\
    \ of a string, `\\w` indicates the end, and the brackets containing `(.+)` extract\
    \ whatever comes after \"USERNAME\"."
