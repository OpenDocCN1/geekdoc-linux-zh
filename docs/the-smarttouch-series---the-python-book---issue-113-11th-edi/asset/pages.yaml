- pgno: 119
  md: "![](img/e016e192a91ffc1a9e474690a590742f_119_0.png)\n\n# # Create a Minecraft\
    \ Minesweeper game\n\nUse your Raspberry Pi and Python knowledge to code a simple\
    \ mini-game in Minecraft\n\n# ## Resources\n\n+   - **Jessie or Raspbian:**  \n\
    raspberrypi.org/downloads\n- **Python:**  \nwww.python.org/\n\nYou may remember\
    \ or have even played the classic Minesweeper PC game that originally dates back\
    \ to the 60s. Over the years it has been bundled with most operating systems,\
    \ appeared on mobile phones, and even featured as a mini-game variation on Super\
    \ Mario Bros.\n\nThis project will walk you through how to create a simple version\
    \ in Minecraft: it's Minecraft Minesweeper! You will code a program that sets\
    \ out an arena of blocks and turns one of these blocks into a mine. To play the\
    \ game, guide your player around the board. Each time you stand on a block you\
    \ turn it to gold and collect points, but watch out for the mine as it will end\
    \ the game and cover you in lava!\n\n# ## 01 Update and install\n\nTo update your\
    \ Raspberry Pi, open the terminal and type:\n\n```\n```bash\nsudo apt-get upgrade\n\
    sudo apt-get update\n```\n```\n\nThe new Raspberry Pi OS image already has Minecraft\
    \ and Python installed. The Minecraft API which enables you to interact with Minecraft\
    \ using Python is also pre-installed. If you are using an old OS version, we would\
    \ highly recommend you downloading and then updating your version to either the\
    \ most recent Jessie or Raspbian image."
