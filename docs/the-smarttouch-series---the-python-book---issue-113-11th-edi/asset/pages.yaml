- pgno: 115
  md: '# Create with Python


    ![](img/e016e192a91ffc1a9e474690a590742f_115_0.png)


    # Part two: Add animation and sound to Pivaders


    After writing a Space Invaders clone in just 300 lines of Python, now we expand
    it to include animation and sound


    # Resources


    +   * **Raspbian:** www.raspberrypi.org/downloads

    * **Python:** www.python.org/doc

    * **Pygame:** www.pygame.org/docs

    * **Art assets:** opengameart.org


    We had great fun creating our basic Space Invaders clone. Pivaders, for the previous
    tutorial. One of the key challenges with the project was keeping it to a manageable
    size — just 300 lines of Python. Without the use of Pygame’s strong set of features,
    that goal would likely have been overshot at least twofold. Pygame’s ability to
    group, manage and detect collisions thanks to the Sprite class really made a great
    difference to our project, not just in terms of length but in simplicity. If you
    missed the first part of the project, you can find the v0.1 code listing on GitHub
    via git.io/cBVtBG, while you can find version v0.2, including all the images,
    music and sound effects we used, over at git.io/BQsk-w.


    Even working within the clearly defined framework Pygame offers, there are still
    a thousand ways we could have approached adding animation and sound. We could
    have created any one of a dozen classes to create and manage containers of individual
    images, or read in a sprite sheet (a single image full of smaller, separate images)
    which we could then draw (or blit) to the screen.


    For the sake of simplicity and performance, we integrated a few animation methods
    into our Game class and opted to use a sprite sheet. Not only does it make it
    easy to draw to the screen, but it also keeps the asset count under control and
    keeps performance levels up, which is important for the Raspberry Pi.


    # 01 Setting up dependencies


    As we recommended with the last tutorial, you’ll get much more from the exercise
    if you download the code we’ve made available online (git.io/BQsk-w) and use it
    for reference as you download your own animations and sound for your various Pygame
    projects. Regardless of whether you just want to simply preview and play or walk-through
    the code to get a better understanding of basic game creation, you’re still going
    to need to satisfy some basic dependencies. The two key requirements here are
    Pygame and Git, both of which are installed by default on up-to-date Raspbian
    installations. If you’re unsure if you have them, type the following at the command
    line:


    ```

    ```

    sudo apt-get install python-pygame

    git

    ```

    ```'
