    \ program\n          not a module!`\n          program not a module!`\nLooking\
    \ at both `pycp.py` and `processOptions.py` makes you understand their similarities\
    \ but also shows their key differences -- `pycp.py` is using two functions and\
    \ the `_name_` variable in its implementation.\n\nWhen developing system tools,\
