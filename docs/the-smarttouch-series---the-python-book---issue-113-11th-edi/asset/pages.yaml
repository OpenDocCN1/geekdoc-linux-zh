- pgno: 71
  md: '# Robotics and electronics


    Robotics is the most direct interface between your code and the real world around
    you


    Robotics is the most direct way that your code can interact with the world around
    you. It can read actual sensor information and move real actuators and get real
    work done.


    The first thing your robot needs is the ability to sense the world around it.
    The one sense that we as humans feel is most useful is sight. With web cameras
    being so cheap and easy to connect to hardware, vision is easy to give to your
    robot. The real problem is how to interpret this data. Luckily, you can use the
    OpenCV project to do just that. It is a vision package that can provide simple
    image gathering and processing, to extremely complex functions like face recognition
    and extraction of 3D objects. You can identify and track objects moving through
    your field of view. You can also use OpenCV to give your robot some reasoning
    capabilities, too. OpenCV includes a set of functions


    ![](img/e016e192a91ffc1a9e474690a590742f_71_0.png)


    for machine learning, where you can do statistical classification or data clustering,
    and use it to feed decision trees or even neural networks.


    Another important sense that you may want to use is sound. The Jasper project
    is one that is developing a complete voice control system. This project would
    give you the structure you need to give your robot the ability to listen for and
    respond to your verbal commands. The project has gotten to the point where you
    can give it a command and the voice recognition software can translate this into
    text. You then need to build a mapping of what pieces of text correspond to what
    commands to execute.


    There are lots of other sensors you could have, but this begins to leave the realm
    of store-bought hardware. Most other sensors, like temperature, pressure, orientation
    or location, need specialised hardware that needs to be interfaced to the computer
    brain for your robot. This


    ![](img/e016e192a91ffc1a9e474690a590742f_71_1.png)


    # Arduino


    > In contrast to the Raspberry Pi, which runs a full OS from its SD card, the
    Arduino board are microcontrollers rather than complete computers. Instead of
    running an OS, the Arduino platform executes code that is interpreted by its firmware.
    It is mainly used to interface with hardware such as motors and servos, sensors,
    and devices such as LEDs, and is incredibly capable in this regard. Arduinos are
    widely used in robotics projects and can be a powerful complement to the Pi.


    # Raspberry Pi


    > While we haven''t discussed what kind of computer to use for your robotics project,
    you should consider the famous Raspberry Pi. This tiny computer should be small
    enough to fit into almost any robot structure that you might be building. Since
    it is already running Linux and Python, you should be able to simply copy your
    code development work to the Pi. It also includes its own I/O bus so that you
    can have it read it''s own sensors.


    # ROS – Robot Operating System


    While you could simply write some code that runs on a standard computer and a
    standard Linux distribution, this is usually not optimal when trying to handle
    all of the data processing that a robot needs when dealing with events in real
    time. When you reach this point, you may need to look at a dedicated operating
    system – the Robot Operating System (ROS). ROS is designed to provide the same
    type of interface between running code the computer hardware it is running on,
    with the lowest possible overhead. One of the really powerful features of ROS
    is that it is designed to facilitate communication between different processes
    running on the computer, or potentially over multiple computers connected over
    some type of network. Instead of each process being a silo that is protected from
    all other processes, ROS is more of a graph of processes with messages being passed
    between them all.


    Because ROS is a complete operating system, rather than a library, it is wrong
    to think that you can use it in your Python code. It is better to think that you
    can write Python code that can be used in ROS. The fundamental design is to be
    as agnostic as possible. This means that interfaces to your code should be clean
    and not particularly care where they run or who is talking to them. Then, it can
    be used within the graph of processes running within ROS. There are standard libraries
    available that allow you to do coordinate transformations, useful for figuring
    out where sensors or limbs are in space. There is a library available for creating
    preemtable tasks for data processing, and another for creating and managing the
    types of messages that can be handed around the various processes. For extremely
    time-sensitive tasks, there is a plugin library that allows you to write a C++
    plugin that can be loaded within ROS packages.'
