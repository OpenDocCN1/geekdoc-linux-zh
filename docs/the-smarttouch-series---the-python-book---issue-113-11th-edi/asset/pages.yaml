- pgno: 146
  md: '# 01 New blog order


    We left off last time with the blog displaying posts in chronological order, which
    isn''t very helpful to readers. To correct this, open up urls.py in the blog folder
    and edit the **following line**:


    ```

    post_list = Post.objects.all().order_by("-pub_date")

    ```


    This makes sure that posts are displayed in reverse order (newest first).


    # 02 A view to a page


    You''ll want to be able to link specific pages, of course, and to do that we first
    have to define what goes into these pages in the urls.py file in the **blog folder**:


    ```

    def post_page(request, post_id):\npost_page = Post.objects.get(pk=post_id)\nreturn
    render_to_response(''blog/post.html'', {''post_page'': post_page})

    ```


    # 03 Clean up your code


    You may notice that we used a different return command to the index definition
    – this is a shortcut that makes writing the code a bit easier. To get it **working,
    add**:


    ```

    from django.shortcuts import render_to_response

    ```


    We recommend that you edit the index code to match post_page.


    # 04 Edit URLs


    In urls.py in myblog we need to make some additions and modifications for the
    website to direct to the **post correctly**:


    ```

    url(r''^myblog/$'', ''blog.urls.index''),\nurl(r''^myblog/(?P<post_id>\d+)/$'',\n''blog.urls.post_page''),

    ```


    The post_id is the number of the post, which is auto-generated. The ''$'' is important
    to make the redirection work.


    # 05 A post template


    We told the post_page to point towards a template we now need to create. In the
    same location as index.html, create post.html with the following formatting to
    resemble the **front page**:


    ```

    <h2>{{ post_page.title }}</h2>\n{{ post_page.author }} on {{ post_page.pub_date
    }}\n<p>{{ post_page.post }}</p>

    ```


    # 06 Link to the page


    Let''s get these links working from the main page. Open up the index.html file
    and make the **following changes**:


    ```

    <h2><a href=''/myblog/{{ post.pk }}/''>{{ post.title }}</a></h2>

    ```


    This is a very simple addition using an absolute link, and requires no fiddling
    with the views or model.


    # 07 Pagination


    To get blog posts split up over pages, we need to make some additions to urls.py
    in the **blog folder**:


    ```

    post_list = Post.objects.all().order_by("-pub_date")\npaginator = Paginator(post_list,
    3)\ntry: list_page = request.GET.get(''list_page'', ''1'')\nexcept ValueError:
    list_page = 1\npost_list = paginator.page(list_page)\nreturn render_to_response(''blog/index.html'',
    {''post_list'': post_list})

    ```


    # 08 Please turn over


    Now we need to add the navigation links to the blog, so open the index template
    **for editing**:


    ```

    {% if post_list.has_previous %}\n<a href=''?list_page={{ post_list.\nprevious_page_number
    }}''>Newer </a>\n{% endif %}\n{% if post_list.has_next %}\n<a href=''?list_page={{
    post_list.next_page_number }}''> Older</a>\n{% endif %}

    ```


    ![](img/e016e192a91ffc1a9e474690a590742f_146_0.png)


    ![](img/e016e192a91ffc1a9e474690a590742f_146_1.png)


    ![](img/e016e192a91ffc1a9e474690a590742f_146_2.png)


    ![](img/e016e192a91ffc1a9e474690a590742f_146_3.png)


    ![](img/e016e192a91ffc1a9e474690a590742f_146_4.png)


    ![](img/e016e192a91ffc1a9e474690a590742f_146_5.png)'
