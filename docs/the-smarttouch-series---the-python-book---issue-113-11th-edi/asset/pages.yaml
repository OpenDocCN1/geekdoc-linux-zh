  md: '# ## Work with Python


    # ### For low-level work, check out Arduinos


    ![](img/e016e192a91ffc1a9e474690a590742f_72_0.png)


    means it is time to get your soldering iron out. As for reading the data in, this
    is most often done over a basic serial connection. You can then use the pySerial
    module to connect to the serial port and read data off the connection.

    You can use:


    ```

    ```python

    import serial

    ```

    ```


    to load the module and start communicating with your sensor. The problem is that
    this is a very low-level way to communicate. As the programmer, are responsible
    for all of the details. This includes communication speed, byte size, flow control,
    basically everything. So this will definitely be an area of your code where you
    should plan on spending some debugging time.

    Now that you have all of this data coming in, what will you do with it? You need
    to be able to move actuators out in the world and have real effects. This could
    be motors for wheels or tracks, levers to shift objects, or potentially complete
    limbs, like arms or legs. While you could try and drive these types of electronic
    devices directly from the output ports of your computer, there usually isn''t
    enough current available to provide the necessary power. So, you will need to
    have some off-board brains capable of handling the supplying of power to these
    devices. One of the most popular candidates for this task is the Arduino.


    Luckily, the Arduino is designed to connect to the serial port of your computer,
    so you can simply use pySerial to talk to it. You can send commands to code that
    you have written and uploaded to the Arduino to handle the actual manipulations
    of the various actuators. The Arduino can talk back, however. This means that
    you can read feedback data to see what effect your movements have had. Did you
    end up turning your wheels as far as you wanted to? This means that you could
    also use the Arduino as an interface between your sensors and the computer, thus
    simplifying your Python code even more. There are loads of add-on modules available,
    too, that might be able to provide the sensing capabilities that you require straight
    out of the box. There are also several models of Arduino, so you may be able to
    find a specialised model that best fits your needs.

    Now that you have all of this data coming in and the ability to act out in the
    real world, the last step is giving your robot some brains. This is where the
    state of the art unfortunately does not live up to the fantasy of R2-D2 or C-3PO.
    Most of your actual innovative coding work will likely take place in this section
    of the robot. The general term for this is artificial intelligence. There are
    several projects currently underway that you could use as a starting point to
    giving your robot some real reasoning capability, like SimpleAI or PyBrain.


    # **Bypassing**

    **the GIL**


    For robotics work, you may need to run some code truly in parallel, on multiple
    CPUs. Python currently has the GIL, which means that there is a fundamental bottleneck
    built into the interpreter. One way around this is to actually run multiple Python
    interpreters, one for each thread of execution. The other option is to move from
    Python to either Jython or IronPython, as neither has a GIL.'
  merge: -1
  img_proc: true
