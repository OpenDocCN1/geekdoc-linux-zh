  md: '![](img/e016e192a91ffc1a9e474690a590742f_145_0.png)


    With Django we can make simple sidebars that list archives by month


    Django has built-in code to deal with pagination very cleanly and effectively


    Allow your readers to give you feedback, and moderate them in the admin panel


    With minimal extra code, our template can display the month archive from the sidebar


    # # Deliver content to your blog


    We continue building an awesome blog using the powerful Django framework, and
    this tutorial is all about the front-end content delivery


    # ## Resources


    **Python base:** http://www.python.org/download/


    **Django source:** https://www.djangoproject.com/download/


    In the last tutorial we began to build the most basic of blogs, and learned how
    to use a bit of Django in the process. We can now set up a new project, create
    a database and write basic code to read and write to the database. All simple
    stuff, but of course it''s core to building websites where Django might be called
    upon.


    Here we will give the front end of the site an overhaul, making it more of the
    standard you would expect from a modern blog. This will include a sidebar, pages,
    post pages and the ability to add and moderate comments. In the process we will
    learn some more of the benefits that come with using Django to develop websites.


    You should keep using Django 1.3 for this tutorial, as we did before.'
