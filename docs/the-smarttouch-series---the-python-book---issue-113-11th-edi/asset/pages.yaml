  md: "# # Web development\n\nOpen `index.html`. All code executed in a Flask template\
    \ is contained within `{{% %}}`. As this is our homepage, we want to direct users\
    \ accordingly. So let's check if we've got an access token (**Fig 01**). Between\
    \ the `ifs` and `else` of the template is standard HTML. If we want to include\
    \ some data – for example, the access token – we can just add `{{ session[\"oauth_token\"\
    ] }}` in the HTML and it will be rendered in the page. Previously, in our / authorised\
    \ endpoint, we would display the OAuth token that we received from Twitter; however,\
    \ now that we have a template, we can redirect our users back our root URL and\
    \ have a page rendered for us that explains the progress we've made.\n\n# ## 06\
    \ Getting lost (and then found again)\n\nWith every server, some things get misplaced\
    \ or people get lost. So how do we handle this? Rather than defining a route,\
    \ we can define a handler that deals with getting lost.\n\n```\n```\n@app.errorhandler(404)\n\
    def fourOhfour(error):\n    return render_template('fourOhfour.html')\n```\n```\n\
    \nIf a page or endpoint is requested and triggers a 404, then the fourOhfour function\
    \ will be fired. In this case, we'll generate a template that tells the user,\
    \ but we could also redirect to another page or dump the error message.\n\n# ##\
    \ 07 Static files\n\nPretty much every webpage uses JavaScript, CSS and images,\
    \ but where do we keep them? With Flask we can define a folder for use with static\
    \ content. For Flask, we create a `static` folder in the root of our project and\
    \ access files by calling `/static/css/styles.css` or `/static/js/core.js`. The\
    \ tutorial resources include a CSS file for styling this project.\n\n# ## 08 Let's\
    \ get some tweets\n\nSo now we know how to build templates, let's grab some tweets\
    \ to display. In `server.py` define a new route, `get_tweets`, like so:\n\n```\n\
    ```\n@app.route('/get_tweets/')\n@app.route('/get_tweets/<int:count>')\ndef getTweets(count=0):\n\
    ```\n```\n\nYou'll notice that unlike our other authentication endpoints, we've\
    \ made two declarations. The first is a standard route definition; it will intercept\
    \ and handle the path `get_tweets`. The second lets us define a parameter that\
    \ we can use as a value in our `getTweets` function. By including `count=0` in\
    \ our function declaration, we ensure that there will always be a default value\
    \ when the function is executed; this way we don't have to check the value is\
    \ present before we access it. If a value is included in the URL, it will override\
    \ the value in the function. The string inside the `variable name` determines\
    \ the name of the variable. If you want the variable passed to the function to\
    \ have a specific type, you can include a converter with the variable name. For\
    \ example, if we wanted to make sure that `count` was always an integer instead\
    \ of a float or string, we'd define our route like so:\n\n```\n```\n@app.route('/get_tweets/<int:count>')\n\
    ```\n```\n\n# ## 09 Checking our session and building our request\n\nBefore we\
    \ start grabbing tweets, we need to run a quick check to make sure we have the\
    \ necessary credentials and if not, redirect the user back the authorisation flow.\
    \ We can do this by having Flask respond to the request with a redirection header,\
    \ like so:\n\n```\n```\nif session[\"oauth_token\"] == \"\" or \\\n    session[\"\
    oauth_secret\"] == \"\":\n    return redirect(rootURL)\n```\n```\n\nAssuming we\
    \ have all we need, we can start to build the parameters for our request (**Fig\
    \ 02**). You'll notice that the nonce value is different from that in our previous\
    \ requests. Where the nonce value in our authenticated and authorise requests\
    \ can be any random arrangement of characters that uniquely identify the request,\
    \ for all subsequent requests the nonce needs to be a 32-character hexadecimal\
    \ string using only the characters a-f. If we add the following function to our\
    \ `helpers.py` file, we can quickly build one for each request.\n\n```\n```\n\
    def nonce(size=32, chars=\"abcdef\" + \"0123456789\"):\n    return \"\".join(random.choice(chars)\
    \ \n        for x in range(size))\n```\n```\n\n# # \"Now we know how to build\
    \ templates, let's grab some tweets to display\"\n\n# ## 10 Signing and sending\
    \ our request\n\nWe've built our parameters, so let's sign our request and then\
    \ add the signature to the parameters (**Fig 03**).\n\nBefore we create the authorisation\
    \ headers, we need to remove the `count` and `user_id` values from the `tweetRequestParams`\
    \ dictionary, otherwise the signature we just created won't be valid for the request.\
    \ We can achieve this with the `del` keyword. Unlike our token requests, this\
    \ request is a GET request, so instead of including the parameters in the request\
    \ body, we define them as query parameters.\n\n```\n```\n?count=tweetRequestParams[\"\
    count\"] \n&user_id=tweetRequestParams[\"user_id\"]\n```\n```\n\n# ## 11 Handling\
    \ Twitter's response\n\nNow we're ready to fire off the request and we should\
    \ get a JSON response back from Twitter. This is where we'll use the `json` module\
    \ we imported earlier. By using the `json.loads` function, we can parse the JSON\
    \ into a dictionary that we can access and we'll pass data to our `tweets.html`\
    \ template.\n\n```\n```\ntweetResponse = json.loads(tweetResponse.read())\nreturn\
    \ render_template('tweets.html', \n    data=tweetResponse)\n```\n```\n\nWhereas\
    \ before, we accessed the session to get data into our template, this time we're\
    \ explicitly passing a value through to our template.\n\n# ## 12 Displaying our\
    \ tweets\n\nLet's create our template now, exactly the same as `index.html`, but\
    \ this time, instead of using a conditional, we're going to create a loop to generate\
    \ a list of tweets we've received.\n\nFirst, we check that we actually received\
    \ some data from our request to Twitter. If we've got something in `render`, we're\
    \ ready to work through it, otherwise we'll just print that we didn't get anything.\n\
    \nOnce again, any template logic that we want to use to generate our page is included"
  merge: -1
