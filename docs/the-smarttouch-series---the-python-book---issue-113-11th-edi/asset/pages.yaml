- pgno: 142
  md: '# # Web development


    ![](img/e016e192a91ffc1a9e474690a590742f_142_0.png)


    # ## 01 Install Python


    Django is based on Python, and requires it to be installed to develop on. Python
    2.7 is the recommended version, and this is installed with the python package.
    If you want to check your version, start the Python shell by typing `python` into
    the terminal.


    ![](img/e016e192a91ffc1a9e474690a590742f_142_1.png)


    # ## 02 Install Django


    Most operable systems will have a Django package available in the repository,
    like python-django in Debian. The Django website has a list if you have trouble
    finding it, or you could build it from source. Make sure you install version 1.3.


    ![](img/e016e192a91ffc1a9e474690a590742f_142_2.png)


    # ## 03 Verify your Django


    To make sure Django installed properly, and that you have the right version, enter
    the Python shell by typing `python` and `enter` the following:


    ```

    ```python

    import django

    print django.get_version()

    ```

    ```


    It will return a version number if it has installed correctly, which should be
    1.3.


    ![](img/e016e192a91ffc1a9e474690a590742f_142_3.png)


    # ## 04 Start a new project


    In the terminal, cd to the folder you want to develop the blog in, and then run
    the **next command**:


    ```

    ```

    django-admin startproject myblog

    ```

    ```


    Here, ''myblog'' can be replaced by whatever you wish to name the project, but
    we''ll use it for the upcoming examples.


    ![](img/e016e192a91ffc1a9e474690a590742f_142_4.png)


    # ## 05 Start the development server


    Django comes with a lightweight development server to test out work locally. We
    can also use it to check our work, so cd to the myblog folder and **then user**


    ```

    ```

    python manage.py runserver

    ```

    ```


    If all goes well, it should return zero errors. Use Ctrl+C to exit the server.


    ![](img/e016e192a91ffc1a9e474690a590742f_142_5.png)


    # ## 06 Configure the database


    The database settings are kept in the settings.py file. Open it up with your favourite
    editor and go to the Databases section. **Change** ENGINE to:


    ```

    ```python

    ''ENGINE'': ''django.db.backends.sqlite3'',

    ```

    ```


    And in NAME, put the absolute path – for example:


    ```

    ```python

    ''NAME'': ''/home/user/projects/myblog/

    sqlite3.db''

    ```

    ```


    Save and exit.


    # ## 07 Create the database


    The database file will be generated by using the **command**:


    ```

    ```

    python manage.py syncdb

    ```

    ```


    During the creation, it will ask you to set up a superuser, which you can do now.
    The SQLite database file will be created in your myblog folder.'
  merge: -1
  img_proc: true
- pgno: 143
  md: "# Web development\n\n“You don’t have full control from start to finish with\
    \ a prefabricated blog – but you will with Django”\n\n![](img/e016e192a91ffc1a9e474690a590742f_143_0.png)\n\
    \n# 08 Create your blog\n\nNow it’s time to create a blog app in your project.\
    \ `Type:`\n\n`python manage.py startapp blog`\n\nThis creates the models file\
    \ which is where all your data lives. You can change 'blog' to another name, but\
    \ we'll use it in our examples.\n\n# 09 Start your blog model\n\nWe can now make\
    \ the first steps in creating our blog model. Open models.py and change it so\
    \ it looks the following:\n\n```\n```python\nfrom django.db import models\n\n\
    class Post(models.Model):\n    post = models.TextField()\n```\n```\n\nThis creates\
    \ the Post class, which has a subclass that contains your blog text.\n\n# 10 Customise\
    \ your blog\n\nLet's now expand the blog model a bit so it resembles a more classic\
    \ blog:\n\n```\n```python\nclass Post(models.Model):\n    post = models.TextField()\n\
    \    title = models.CharField()\n    author = models.CharField(max_length=50)\n\
    \    pub_date = models.DateTimeField()\n```\n```\n\nA CharField needs to have\
    \ a character limit defined, and DateTimeField holds the time values.\n\n# 11\
    \ Install your app\n\nYour app needs to be installed to your project, which is\
    \ very simple. Open the settings.py file again, go to the INSTALLED_APPS section\
    \ and add:\n\n```\n```python\n'blog',\n```\n```\n\nThen run the following to create\
    \ the database tables:\n\n```\n```bash\npython manage.py sql blog\n```\n```\n\n\
    And finally:\n\n```\n```bash\npython manage.py syncdb\n```\n```\n\n# 12 Set up\
    \ to post\n\nNow we can create a post and test out our code. First though, enter\
    \ the Python shell:\n\n```\n```bash\npython manage.py shell\n```\n```\n\nThen\
    \ execute these commands to add all the necessary fields and data:\n\n```\n```python\n\
    from blog.models import Post\nimport datetime\n```\n```\n\n# 13 Let's blog\n\n\
    Create the post. For this example, we will call it test_post:\n\n```\n```python\n\
    test_post = Post()\n```\n```\n\nNow let's add the blog content:\n\n```\n```python\n\
    test_post.post = 'Hello World!'\ntest_post.title = 'First Post'\ntest_post.author\
    \ = 'Me'\ntest_post.pub_date = datetime.datetime.now()\n```\n```\n\nAnd then save\
    \ it with:\n\n```\n```python\ntest_post.save()\n```\n```\n\n# 14 Start the site\
    \ back-end\n\nTo create the admin site, edit urls.py from the myblog directory,\
    \ and uncomment or add the following lines:\n\n```\n```python\nfrom django.contrib\
    \ import admin\nadmin.autodiscover()\nurl(r'^admin/', include(admin.site.urls))\n\
    ```\n```\n\nSave and exit, then edit settings.py and uncomment this line from\
    \ INSTALLED_APPS:\n\n```\n```python\n'django.contrib.admin'\n```\n```\n\nThe admin\
    \ site is now at 127.0.0.1:8000/admin/.\n\n144 The Python Book"
