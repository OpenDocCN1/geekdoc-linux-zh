    \ Then we print out the final cards that the dice correspond to, before again\
    \ passing it onto the hand function so that we can fully determine the hand that\
    \ the player has. We print out this result and that ends the function, sending\
    \ the whole thing back to the game function so if you want to play again.\n\n\
    # ### 16 Dice rolling\n\nThe roll function is used twice in the code for both\
    \ times that we roll the dice. Being able to use the same code multiple times\
    \ means we can cut down on bloat in the rest of the script, allowing it to run\
    \ a little faster, as we explained. It also means in this case that we can use\
    \ it again if you want to change the game to three rounds, or modify it for real\
    \ poker.\n\n# ### 17 Number of rolls\n\nWe begin the whole thing by bringing over\
    \ the roll_number variable into the function – this is because while in the original\
    \ roll it will always be five, the second roll could between one and the full\
    \ five. We create a list with the number of entries we need for each roll, and\
    \ again set an iterations variable for the upcoming while loop.\n\n# ### 18 Remember\n\
    \nMuch like the while loops in the rest of the code so far, we’re keeping it going\
    \ until iterations is the same as roll_number. Each entry in the dice list is\
    \ replaced with a random number using the random.choice function and keeping it\
    \ in the range of the numbers variable, which is one to six for each side of the\
    \ dice. After this is done, we return the dice variable to the throw function\
    \ that makes up the majority of a game.\n\n# ### 19 Hand analysis\n\nWhile not\
    \ technically a hand of cards, the poker terminology still applies. We start in\
    \ this function by setting up a few things. The first part uses the groupby function\
    \ we imported – this is used in this case to count the numbers that make up the\
    \ dice variable. If there are three twos, a four and a six, it will return [3,\
    \ 1, 1], using this to ascertain what kind of hand the player has. As the output\
    \ of this groupby won’t be in any specific order, we use the sort function again\
    \ to sort it; however, this time we use the reverse=True argument to make the\
    \ analysis easier again.\n\n# ### 20 Straights\n\nStraights and high cards are\
    \ odd ones out in poker dice, as they are not rely on being able to count any\
    \ repetitions in the cards. There are, however, only two hands that create a straight\
    \ in poker dice, so we have created two lists here that contain them. We can then\
    \ check first to see if the dice make these hands, and then if all other checks\
    \ fail, it has to be a high card.\n\n# ### 21 Your hand\n\nWhile seemingly lengthy,\
    \ this a fairly simple if statement. As we stated before, we check to see if it’s\
    \ one of the two straight hands, as there are no flushes or royal straight flushes\
    \ in poker dice, we don’t have to worry about those. We then check to see if the\
    \ first item in the list is five, which can only result in five of a kind; similarly,\
    \ if the first item is four then the hand must be four of a kind. If the first\
    \ number is three, then it can be either a full house or three of a kind.\n\n\
