    \nThe strength of Python is its ability to be extended through modules. The first\
    \ step in many programs is to import those modules that you need. The simplest\
    \ import statement is to just call 'import modulename'. In this case, those functions\
    \ and objects provided are not in the general namespace. You need to call them\
    \ using the complete name (modulename.methodname). You can shorten the 'modulename'.\
    \ part with the command 'import modulename as mn'. You can skip this issue completely\
    \ with the command 'from modulename import *' to import everything from the given\
    \ module. Then you can call those provided capabilities directly. If you only\
    \ need a few of the provided items, you can import them selectively by replacing\
    \ the '*' with the method or object names.\n\n# 02\nReloading modules\n\nWhen\
    \ a module is first imported, any initialisation functions are run at that time.\
    \ This may involve creating data objects, or starting connections. But, this is\
    \ only done the first time within a given session. Importing the same module again\
    \ won't re-execute any of the initialisation code. If you want to have this code\
    \ re-run, you need to use the reload command. The format is 'reload(modulename)'.\
    \ Something to keep in mind is that the dictionary from the previous import isn't\
    \ dumped, but only written over. This means that any definitions that have changed\
    \ between the import and the reload are updated correctly. But if you delete a\
    \ definition, the old one will stick around and still be accessible. There may\
    \ be other side effects, so always use with caution.\n\n# 03\nInstalling new modules\n\
    \nWhile most of the commands we are looking at are Python commands that are to\
    \ be executed within a Python session, there are a few essential commands that\
    \ need to be executed outside of Python. The first of these is pip. Installing\
    \ a module involves downloading the source code, and compiling any included external\
    \ code. Luckily, there is a repository of hundreds of Python modules available\
    \ at http://pypi.python.org. Instead of doing everything manually, you can install\
    \ a new module by using the command 'pip install modulename'. This command will\
    \ also do a dependency check and install any missing modules before installing\
    \ the one you requested. You may need administrator rights if you want this new\
    \ module installed in the global library for your computer. On a Linux machine,\
    \ you would simply run the pip command with sudo. Otherwise, you can install it\
    \ to your personal library directory by adding the command line option '--user'.\n\
    \n> “Every programming language out there has a core set of functionality that\
    \ everyone should know in order to get useful work done. Python is no different”\n\
    \n# 04\nExecuting a script\n\nImporting a module does run the code within the\
    \ module file, but does it through the module maintenance code within the Python\
    \ engine. This maintenance code also deals with running initialising code. If\
    \ you only wish to take a Python script and execute the raw code within the current\
    \ session, you can use the 'execfile(filename.py)' command, where the main option\
    \ is a string containing the Python file to load and execute. By default, any\
    \ definitions are loaded into the locals and globals of the current session. You\
    \ can optionally include two extra parameters the execfile command. These two\
    \ options are both dictionaries, one for a different set of locals and a different\
    \ set of globals. If you only hand in one dictionary, it is assumed to be a globals\
    \ dictionary. The return value of this command is None.\n\n# 05\nAn enhanced shell\n\
    \nThe default interactive shell is provided through the command 'python', but\
    \ is rather limited. An enhanced shell is provided by the command 'ipython'. It\
    \ provides a lot of extra functionality to the code developer. A thorough history\
    \ system is available, giving you access to not only commands from the current\
    \ session, but also from previous sessions. There are also magic commands that\
    \ provide enhanced ways of interacting with the current Python session. For more\
    \ complex interactions, you can create and use macros. You can also easily peek\
    \ into the memory of the Python session and decompile Python code. You can even\
    \ create profiles that allow you to handle initialisation steps that you may need\
    \ to do every time you use Python.\n\n# 06\nEvaluating code\n\nSometimes, you\
