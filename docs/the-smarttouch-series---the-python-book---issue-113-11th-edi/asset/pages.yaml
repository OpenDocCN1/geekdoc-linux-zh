    \n    Rock = 1\n    Paper = 2\n    Scissors = 3\nMake a move: 5\nOops! I didn't\
    \ understand that. Please enter 1, 2 or 3.\n\n    Rock = 1\n    Paper = 2\n  \
    \  Scissors = 3\nMake a move: 1\n1...\n2...\n3!\nComputer threw Rock!\nTie game.\n\
    \n**The code in action**\n```"
