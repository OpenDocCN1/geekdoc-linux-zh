    \ execution\nelif nSwitch == 1:\n    sys.exit(0)\nelse:\n    print('Copying',\
    \ source, 'to', destination)\n```\n```\n\nTo simplify the code, the source file\
    \ must always come first and the destination file or directory must be second\
    \ - this is explained in the usage message shown by the script.\n\nNext, you should\
    \ include any options you want. Executing processOptions.py generates the following\
