  md: '# Web development


    ![](img/e016e192a91ffc1a9e474690a590742f_151_0.png)


    # 10 Category model


    We can add a model for blog categories:


    ```

    ```python

    class Categories(models.Model): name = models.CharField(unique=True, max_length=200)
    slug = models. SlugField(unique=True, max_length=100) parent = models.ForeignKey(
    ''self'', blank=True, null=True, related_ name=''child'') def __unicode__(self):
    return (self.name)

    ```

    ```


    This allows for parent and child categories.


    ![](img/e016e192a91ffc1a9e474690a590742f_151_1.png)


    # 11 Administrate categories


    We can add it to the admin site by creating a Categories section in admin.py:


    ```

    ```python

    class CategoriesAdmin(admin. ModelAdmin): list_display = [''name'', ''slug'',
    ''parent''] admin.site.register (Categories, CategoriesAdmin)

    ```

    ```


    Before we can make categories, though, we need to create the database table:


    ```

    `$ python manage.py syncdb`

    ```


    ![](img/e016e192a91ffc1a9e474690a590742f_151_2.png)


    # 12 Categorise the posts


    Similarly to what we did with the comments, we want to add a ForeignKey to the
    Post model so we can attribute a post to a category. Add this line: category =
    models. ForeignKey (Categories)


    And move Categories to the top of models.py.


    ![](img/e016e192a91ffc1a9e474690a590742f_151_3.png)


    # 13 Database category


    Like before, we''ll find out the SQL needed to alter the table: `$ python manage.py
    sqlal ter blog` Which for our example returns a somewhat different code than before:
    “category_id” integer NOT NULL REFERENCES “blog_ categories” (“id”) It’s an ID
    we’re getting, not text, from the categories table.


    ![](img/e016e192a91ffc1a9e474690a590742f_151_4.png)


    # 14 Alter table – part 2


    Again let’s enter the database shell: `$ python manage.py dbshell` Well! continue
    much like before, but with the new code: ALTER TABLE “blog_post” ADD “category_id”
    integer REFERENCES “blog_categories” (“id”); And finally, to save: COMMIT;


    ![](img/e016e192a91ffc1a9e474690a590742f_151_5.png)


    # 15 Administrate categories – part 2


    Now we can go back to admin.py and add the new category fields to the PostAdmin
    model: list_display = [''title'', ''author'', ''pub_date'', ''category''] We need
    to change our previous blog posts with no category have disappeared! To fix this,
    go back to models.py and make this change to the Post model: category = models.ForeignKey
    (Categories, blank=True, null=True) So we can now create categories separately,
    assign them to posts, and view posts without a category.


    > > We can now create categories separately


    ![](img/e016e192a91ffc1a9e474690a590742f_151_6.png)


    # 16 Category display


    As our urls.py in the blog directory gets all the post fields, to the index template
    we just add: `{{post_category}}` and to the post template: `{{ category }}`


    ![](img/e016e192a91ffc1a9e474690a590742f_151_7.png)


    # 17 Category page


    First we need to define our category in blog/urls.py. Import Categories and then
    add: `def blog_category(request, category_ id): categories = Categories.objects.
    get(pk=category_id) We need the category_id to call the corresponding posts.`'
