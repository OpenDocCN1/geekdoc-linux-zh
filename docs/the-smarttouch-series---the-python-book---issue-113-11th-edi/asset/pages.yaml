    create a couple of Turtles which we’ll use later: one for drawing the game world
    (Path) and the other for writing the score (Writer).


    > **Quick tip**

    Speed up Pac-Man by increasing or decreasing the ‘onkey’ values, at the bottom
    of our code (x,y). Remember that positive numbers move right or up, and negatives
    move left or down.


    # Multiplayer Pac-Man and more!


    We might want to make some improvements to take our Pac-Man game to the next level.
    Consider how we might change the level layout. Perhaps when the player has picked
    up all the dots, we could load in a second level. We could even make the levels
    automatically generated, therefore creating an unlimited amount of gameplay.


    Some other alterations that might bring fun challenges to the game include: change
    where the player starts, by altering Pac-Man’s spawn location; increase or decrease
    the number of ghosts in the game for different levels; and make the ghosts faster
    or slower as the player progresses through the levels.


    If we really wanted to take things to the next level, we could introduce multiplayer.
    In the past, Pac-Man games have experimented with different forms of multiplayer.
    We might want to start out by introducing turn-based multiplayer, by developing
    a leader board. This would simply mean saving a player’s score at the end of each
    game, and asking for their name once they’ve died. That’s how classic arcade machines
    handled multiplayer. However, you might want to get really fancy and code another
    player character that is controlled by WASD instead of the arrow keys. Then you
    could have two Pac-Men active in the game at once, competing for dots and ghosts!'
