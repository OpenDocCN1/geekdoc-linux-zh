  md: '# # Work with Python


    # # Computational science


    Python is fast becoming the go-to language for computational science


    **Python has become one of the key languages used in science.** There is a huge
    number of packages available to handle almost any task that you may have and,
    importantly, Python knows what it isn''t good at. To deal with this, Python has
    been designed to easily incorporate code from C or FORTRAN. This way, you can
    offload any heavy computations to more efficient code.


    The core package of most of the scientific code available is numpy. One of the
    problems in Python is that the object oriented nature of the language is the source
    of its inefficiencies. With no strict types, Python always needs to check parameters
    on every operation. Numpy provides a new datatype, the array, which helps solve
    some of these issues. Arrays can only hold one type of object, and because Python
    knows this it can use some optimisations to speed things up to almost what you
    can get from writing your code directly in C or FORTRAN. The classic example of
    the difference is for the loop. Lets say you wanted to scale a vector by some
    value, something like a*b. In regular Python, this would look like


    ```

    for elem in b:

    c.append(a * elem)

    In numpy, this would look like:

    a*b

    ```


    So, not only is it faster, it is also written in a shorter, clearer form. Along
    with the new datatype, numpy provides overloaded forms of all of the operators
    that are of most use, like multiplication or division. It also provides optimised
    versions of several functions, like the trig functions, to take advantage of this
    new datatype.


    The largest package available, that is built on top of numpy, is scipy. Scipy
    provides sub-sections in several areas of science. Each of these sub-sections
    need to be imported individually after importing the main scipy package. For example,
    if you are doing work with differential equations, you can use the "integrate"
    section


    ![](img/e016e192a91ffc1a9e474690a590742f_69_0.png)


    Left The numpy package makes it simple to visualise your data


    # ## Parallel Python


    **One of the really powerful parts of Ipython (or ipyuter) is that it is built
    with a client/ server model.** This means that it is relatively easy to setup
    multiple machines to act as a server pool. You can then form out multiple tasks
    to these other machines to get even more work done. While this doesn''t run any
    particular function in parallel, it does let you run longer functions in the background
    while you work on something else.


    # ## Spyder, the IDE for scientists


    ![](img/e016e192a91ffc1a9e474690a590742f_69_1.png)


    **THE EDITOR PANE**

    This pane is where you can open and edit your source files. Above this pane are
    buttons to allow you to simply run the code, or run it under a debugger. Under
    the debugger, you can set breakpoints and step through each time it code individually.


    **VARIABLE EXPLORER**

    The variable explorer pane lets you access all of the data structures within your
    current Python interpreter. You need to actually run the code for a trying to
    show up here


    **IPYTHON CONSOLE**

    The console window lets you interact directly with the underlying interpreter
    that will be used when you try and run your code'
