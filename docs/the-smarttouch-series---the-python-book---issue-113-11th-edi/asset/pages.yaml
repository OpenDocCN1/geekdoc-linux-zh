- pgno: 159
  md: '![](img/e016e192a91ffc1a9e474690a590742f_159_0.png)


    # ## Control a Robotic Arm with just your fingertips


    Build, hack and move a robotic arm with flicks, finger movements and gestures


    +   **Resources**

    *   Maplin Robotic Arm

    *   Pimoroni Skywriter

    *   Raspberry Pi 2 or 3


    This tutorial combines the Maplin Robotic Arm and Pimoroni’s Skywriter HAT to
    enable you to take control of the robot with just the touch of your fingertips.
    The arm can move through three points of articulation and ends in a clamp to give
    you maximum flexibility with movement. The arm also moves through 120 degrees
    in the wrist, 300 degrees at the elbow, 180 degrees at the base in the vertical
    and 270 degrees in the horizontal. It is easy to assemble and is a great beginners’
    robot. In this tutorial you will first install the Python modules to enable your
    Raspberry Pi to interact with the USB port, and then learn how to use Python code
    to send commands to and receive them from the arm. Next we’ll write a simple program
    to control the arm; this is actually great fun and you can start to practice picking
    up objects and then trying to move them


    to another location. The Skywriter is an electrical near-field 3D-sensing board
    that recognises a number of gestures including taps and flicks. These gestures
    can be made at a specific location on the board (north, south, east, west or in
    the centre) then programmed to respond in a particular way.

    The second half of the tutorial shows you how to install and set up the Skywriter
    and code some of the gestures. Finally, both the arm and the Skywriter code are
    combined to create a program where you assign a particular arm movement to a particular
    gesture, creating the controls for your fingertips. For example, a tap on the
    north of the board could move the arm up, a tap at the bottom (the south position)
    could move it downwards. Watch this video to see the project in action: https://www.youtube.com/watch?v=SVDXbcSOl8I'
