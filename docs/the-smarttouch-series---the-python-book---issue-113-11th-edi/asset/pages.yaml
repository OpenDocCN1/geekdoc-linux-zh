- pgno: 123
  md: '![](img/e016e192a91ffc1a9e474690a590742f_123_0.png)


    # Pygame Zero


    Pygame Zero cuts out the boilerplate to turn your ideas into games instantly,
    and we''ll show you how


    # Resources


    +   - **Pygame Zero:**

    pygame-zero.readthedocs.org

    - **Pygame:**

    pygame.org/download.shtml

    - **Pip**

    pip-installer.org

    - **Python 3.2 or later**

    www.python.org/

    - **Code from FileSilo (optional)**


    Games are a great way of understanding a language: you have a goal to work towards,
    and each feature you add brings more fun. However, games need libraries and modules
    for graphics and other essential games features. While the Pygame library made
    it relatively easy to make games in Python, it still brings in boilerplate code
    that you need before you get started – barriers to you or your kids getting started
    in coding.

    Pygame Zero deals with all of this boilerplate code for you, aiming to get you
    coding games instantly. Pg0 (as we''ll abbreviate it) makes sensible assumptions
    about what you''ll need for a game – from the size of the window to importing
    the game library – so that you can get straight down to coding your ideas.


    Pg0''s creator, Daniel Pope, told us that the library "grew out of talking to
    teachers at Pycon UK''s education track, and trying to understand that they need
    to get immediate results and break lessons into bite-size fragments, in order
    to keep a whole class up to speed."

    To give you an idea of what''s involved here, we''ll build up a simple game from
    a *Pong*-type bat and ball through to smashing blocks *Breakout*-style. The project
    will illustrate what can be done with very little effort. Pg0 is in early development
    but still offers a great start – and is now included on the Pi in the Raspbian
    Jessie image.

    We''ll look at installation on other platforms, but first let''s see what magic
    it can perform.'
  merge: -1
  img_proc: true
- pgno: 124
  md: "Right, Breakout is a classic arcade game that can be reimagined in Pygame Zero\n\
    \n![](img/e016e192a91ffc1a9e474690a590742f_124_0.png)\n\n# Create with Python\n\
    \n![](img/e016e192a91ffc1a9e474690a590742f_124_1.png)\n\n![](img/e016e192a91ffc1a9e474690a590742f_124_2.png)\n\
    \n# 04 No Pi?\n\nYou don't even need a Raspberry Pi to install Pygame Zero – just\
    \ install the Pygame library, then use pip to install Pygame Zero. Instructions\
    \ vary by distro, but a good place to start is the documentation: bit.ly/1GYZnUB.\n\
    \n# Young and old\n\nIn situations where Pygame is used boilerplate and all with\
    \ young people, great results can also be achieved (see Bryson Payne’s book),\
    \ but Pygame and Pg0, despite their use as powerful educational tools, are also\
    \ good for creating games no coders no matter what stage of learning they are\
    \ at.\n\n# 01 Zero effort\n\nAlthough game writing is not easy, getting started\
    \ certainly is. If you’ve got Raspbian Jessie installed on your Pi, you’re ready\
    \ to go. Open a terminal and type:\n\n```\ntouch example.py\npgzrun example.py\n\
    ```\n\nAnd you’ll see an empty game window open (Ctrl+Q will close the window).\
    \ Yes, it’s that easy to get started!\n\nGreat games are all about the gameplay,\
    \ driven by powerful imaginations generating images, animations, sounds and journeys\
    \ through game worlds. Good frameworks open up this creative activity to people\
    \ who are not traditional learners of programming, which is an area where Python\
    \ has long excelled.\n\n# 02 Python 3\n\nIf you haven’t got Raspbian Jessie, chances\
    \ are you’ll have neither Pg0 nor Pygame installed. The Python3 pip package installer\
    \ will take care of grabbing Pg0 for you, but the preceding steps vary by distro.\
    \ One thing you will need is Python 3.2 (or newer). If you’ve been sticking with\
    \ Python 2.x in your coding (perhaps because it’s used in a tutorial you’re following),\
    \ make Pg0 your chance for a gentle upgrade to Python 3.\n\n![](img/e016e192a91ffc1a9e474690a590742f_124_3.png)\n\
    \n# 03 Older Raspbian\n\nIf you’re still running Raspbian Wheezy, you’ll need\
    \ to run the following steps to install Pygame Zero:\n\n```\nsudo apt-get update\n\
    sudo apt-get install python3-setuptools python3-pip\nsudo pip-3.2 install pgzero\n\
    ```\n\n# 05 Intro.py\n\nThat default black square of 800 by 600 pixels we saw\
    \ in Step 1 can now be overridden manually. For example, we can use the following\
    \ code to replace it with an oversized gold brick, in a sly nod to Breakout:\n\
    \n```\nWIDTH = 1000\nHEIGHT = 100\ndef draw():\n    screen.fill((255, 138, 0))\n\
    ```\n\nThat colour tuple takes RGB values, so you can quickly get colours of a\
    \ cheaterfest; screen is built into Pg0 for the window display, with methods available\
    \ for all sorts of different sprites..."
