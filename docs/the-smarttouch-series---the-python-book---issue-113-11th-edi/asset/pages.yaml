  md: '![](img/e016e192a91ffc1a9e474690a590742f_70_0.png)


    > Above The ability to generate complex plots is essential


    # Work with Python


    # Interactive science with jupyter


    For a lot of scientific problems, you need to play with your data in an interactive
    way. The original way you would do this was to use the r Python web notebook.
    This project has since been renamed Jupyter. For those who have used a program
    like Mathematica or Maple, the interface should seem very familiar. Jupyter starts
    a server process. By default on port 8888, and then will open a web browser where
    you can open a worksheet. Like most other programs of this type, the entire run
    in chronological order, not in the order that they happen on the worksheet. This
    can be a bit confusing at first, but it means that if you go to edit an earlier
    entry, all of the following entries need to be re-executed manually in order to
    propagate that change through the rest of the computations.


    Jupyter has support for pretty printing math within the produced web page. You
    can also mix documentation blocks and code blocks within the same page. This means
    that you can produce very powerful educational material, where students can read
    about some technique, and then actually run it and see it in action. By default,
    Jupyter will also embed matplotlib plots within the same worksheet as a results
    section, so you can see a graph of some data along with the code that generated
    it. This is huge in the growing need for reproducible science. You can always
    go back and see how many analysis was done and be able to reproduce any result
    at all.


    ![](img/e016e192a91ffc1a9e474690a590742f_70_1.png)


    > Above Jupyter Notebook is a web application that is used for creating and sharing
    documents that contain live code and equations


    # The need for speed


    Sometimes you need as much speed as your are capable of pushing on your hardware.
    In these cases, you always have the option of using Cython. This lets you take
    C code from some other project, which has probably already been optimised, and
    use it within your own Python program. In scientific programming, you are likely
    to have access to code that has been worked on for decades and is highly specialised.
    There is no need to redo the development effort that has gone into it.


    to solve them with code that looks like


    ```

    import scipy

    import scipy.integrate

    result = scipy.integrate.quad(lambda x: sin(x), 0, 4.5)

    ```


    Differential equations crop up in almost every scientific field. You can do statistical
    analysis with the "stats" section. If you want to do some signal processing, you
    can use the "signal" section and the "fft.pack" section. This package is definitely
    the first stop for anyone wanting to do any scientific processing.


    Once you have collected your data, you usually need to graph it, in order to get
    a visual impression of patterns within it. The primary package you can use for
    this is matplotlib. If you have ever used the graphics package in R before, the
    core design of matplotlib has borrowed quite a few ideas. There are two categories
    of functions for graphing, low-level and high-level. High-level functions try
    to take care of as many of the menial tasks, like creating a plot window, drawing
    axes, selecting a coordinate system, as possible. The low-level functions give
    you control over almost every part of a plot, from drawing individual pixels to
    controlling every aspect of the plot window. It also borrowed the idea of drawing
    graphs in a memory based window. This means that it can draw graphs while running
    on a cluster.


    If you need to do symbolic math, you may be more used to using something like
    Mathematica or Maple. Luckily, you have sympy that can be used to do many of the
    same things. You can use Python to do symbolic calculus, or to solve algebraic
    equations. The one weird part of sympy is that you need to use the "syms()" function
    to tell sympy what variables are valid to be considered in your equations.


    You can then start doing manipulations using these registered variables.


    You may have large amounts of data that you need to work with and analyse. If
    so, you can use the pandas package to help deal with that. Pandas has support
    for several different file formats, like CSV files, Excel spreadsheets or HDF5.
    You can merge and join datasets, or do slicing or subsetting. In order to get
    the best performance out of the code, the header lifting is done by Cython code
    that incorporates functions written in C. Quite a few ideas on how to manipulate
    your data was borrowed from how things are done in R.


    You now have no reason not to start using Python for your scientific work. You
    should be able to use it for almost any problem that comes up!'
