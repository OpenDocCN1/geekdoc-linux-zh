    \ dialog of the plug-in by right-clicking the LUD Reddit Viewer, then selecting\
    \ \"Add-on settings\".\n\nSo, you have seen how robust and powerful XBMС's extension\
    \ system is. In this example, we were able to leverage the full power of Python\
    \ (including those magical regular expression matches) from within XBMС. XBMС\
    \ itself also offers a robust UI framework, which provides a very professional\
    \ look for our add-on.\n\nAs powerful as it may seem, we have only built a simple\
    \ plug-in. XBMС's extension system also provides a framework for building fully\
    \ fledged programs (called Programs). We will cover this in a later issue.\n\n\
    # 14 Populating the episode view (listing videos)\n\nAt this point we have the\
