  md: "# Python essentials\n\n# Extend your Python\n\nFind out how to digitally sign\
    \ a release APK and upload it to an app store of your choice\n\nWith the Python\
    \ interpreter, you aren't just limited to what is already available; you can extend\
    \ the available functionality by defining your own Python objects, with their\
    \ own methods and data, within your C code. These newly-created objects can then\
    \ be called from within the Python interpreter. They are defined as static objects,\
    \ with code like:\n\n```\n```c\nstatic PyObject* my_func(PyObject *self,  PyObject\
    \ *args) {\n...\n}\n```\n```\n\nThe new PyObject contains the executable code\
    \ for the method to be used for your new object. You also need to create a method\
    \ definition to be able to register the details with the Python interpreter. You\
    \ do this by creating a PyMethodDef array:\n\n```\n```c\nstatic PyMethodDef my_methods[]\
    \ = {\n  {\"my_method\", my_func, METH_VARARGS,\n  \"This is my method\"},\n \
    \ (NULL, NULL, 0, NULL)\n};\n```\n```\n\nOnce you have finished these two parts,\
    \ you are almost ready to start using your new module code. You need to initialise\
    \ it with the function:\n\n```\n```c\nPyObject_CallObject(my_func, NULL);\n```\n\
    ```\n\nWith this access, you should be able to do just about anything you wish\
    \ in Python.\n\nUp to now, we have been specifically looking at code interacting\
    \ with the Python interpreter. But there are occasions where you want to allow\
    \ the end user to have access to the interpreter. In these cases, you probably\
    \ want to give your user access to a full Python console. You can do just such\
    \ a thing with the function call Py\\_Main(argc, argv), where you hand in the\
    \ argc and argv that you have from the C side of your program. This is fine for\
    \ a console-based program, but for a GUI program, you need to create some kind\
    \ of terminal window to allow the user to interact with the Python interpreter.\
    \ This console will automatically continue to run until the user explicitly quits\
    \ from Python. The\n\n```\n```c\nPy\\_InitModule(\"my_module\", my\\_methods);\n\
    ```\n```\n\nNow, you can import this new module in your Python code, just like\
    \ any other module installed on your system. Within your Python code, you can\
    \ write:\n\n```\n```python\nimport my\\_module\nmy\\_module.my\\_method()\n```\n\
    ```\n\nOne thing to be aware of is that this level of control also gives you a\
    \ huge level of responsibility. For example, you will need to start worrying about\
    \ things like reference counts for objects. The garbage collector for the interpreter\
    \ needs to know when an object is okay to delete, you need to increment the reference\
    \ count each time something points to your newly created object. Every time a\
    \ reference is removed, you need to decrement the counter.\n\nYou can also create\
    \ multiple sub-interpreters within a single program. You can create a new sub-interpreter\
    \ with the function Py\\_NewInterpreter(). This way, you can have multiple Python\
    \ threads running concurrently, and mostly independently. When you are done, you\
    \ can shut them down with the function Py\\_EndInterpreter(). There is no limit\
    \ to what you can do with all of this power.\n\nlast thing you need to do is to\
    \ clean up after the interpreter. You can do this with the function void Py\\\
    _Finalize(). The major issue with this function is that it destroys objects in\
    \ a random order. If they depend on other objects, they may not be able to get\
    \ cleaned up correctly. If you then try and re-initialise the interpreter again,\
    \ it may fail due to an unclean finalisation step.\n\nNow that you have your program\
    \ written, you need to compile it. You need to include flags to tell the compiler\
    \ where to find everything. Luckily, you can get these from Python itself. The\
    \ flags needed for compiling are available with the command python-config --cflags.\
    \ You also need to know where to find the libraries to link in, which are available\
    \ with python-config --ldflags. After completing all of this you will have access\
    \ to Python anywhere, even within another program.\n\n# Code listing\n\n```\n\
    ```c\n# A simple way to run Python code\n#include <Python.h>\n\nint main(int argc,\
    \ char *argv[]\n)\n{\nPy\\_SetProgramName(argv[0]);\n# Initialize the Python\n\
    interpreter\nPy\\_Initialize();\n# Run your SimpleString \"from time\nimport time,time\\\
    \"\"\\n\"\nPyRun\\_SimpleString(\"from time\nimport time,time\\\"\\\"\\n\"\n\"\
    'print 'Today is ',ctime(time())\\\"\\n\");\n# Don't forget to clean up\nPy\\\
    _Finalize();\nreturn 0;\n}\n```\n```\n\n```\n```c\n# You can create an interactive\n\
    Python console\n#include <Python.h>\nint main(int argc, char *argv[]\n)\n{\nPy\\\
    _Initialize();\nPy\\_Main(argc, argv);\nPy\\_Finalize();\n}\n```\n```\n\n```\n\
    ```c\n# You can even run a script file\n#include <Python.h>\nint main(int argc,\
    \ char *argv[]\n)\n{\nFILE *fp;\nPy\\_Initialize();\nfp = fopen(\"my\\_script.py\"\
    , \"r\");\nPyRun\\_SimpleFile(fp, \"my\\_script.py\");\nPy\\_Finalize();\nfclose(fp);\n\
    }\n```\n```\n\n# WHY PYTHON\n\nIt's the official language of the Raspberry Pi.\
    \ Read the docs at python.org/doc"
