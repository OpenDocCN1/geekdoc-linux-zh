  md: "colours of our game world using RGB (red green blue) colour coding. It may\
    \ seem counter-intuitive, but all zeros are black and the full 255 is white. It\
    \ helps to think of it as the amount of light in that colour range, 255 being\
    \ the maximum and 0 being none.\n\n```\nBLACK = (0,0,0)\nWHITE = (255, 255, 255)\n\
    ```\n\nWe’ll want to set the dimensions of our game environment window. We’re\
    \ using a typical VGA resolution of 800x600, but you may want to go lower res\
    \ for a truly retro vibe. VGA for example, is 640x480.\n\n```\nsize = (800, 6500)\n\
    screen = pygame.display.set_mode(size)\npygame.display.set_caption(\"Pong\")\n\
    ```\n\nWe’ve also set the window title to Pong, but you may want to get more creative\
    \ here.\n\nNow that we have a display window with a resolution set and a coloured\
    \ background and foreground set up, we can focus on the main loop of the program.\
    \ Before we do, let’s set the criteria for said loop:\n\n```\ncarryOn = True\n\
    clock = pygame.time.Clock()\n```\n\nHere we’ve told the program that our Boolean\
    \ carryOn is set to True. In a moment we’ll design our loop to continue until\
    \ we’ve changed the status of this Boolean to False . The clock controls the speed\
    \ of our updates. We’ll need to continuously observe user inputs and react to\
    \ them in real time – for example, when the mouse or keyboard is pressed. When\
    \ we monitor a change, we’ll have to implement the appropriate game logic, such\
    \ as moving the paddle or ball. After each change, we’ll need to refresh the screen\
    \ to ensure that the shapes and sprites are redrawn, and this is where the game\
    \ clock will come in handy. We can set how often this screen refresh takes place\
    \ – that’s called the ‘frame rate’. In our code below we’ve set the frame rate\
    \ at 60 frames per second, which is standard for most video games. The higher\
    \ the frame rate, the smoother the game’s movement will appear on screen, but\
    \ also the more computing resources are required to run it because the central\
    \ processor has got more events to calculate and process in a shorter amount of\
    \ time.\n\n```\nwhile carryOn:\n  for event in pygame.event.get():\n    if event.type\
    \ == pygame.QUIT:\n      carryOn = False\n\n  screen.fill(BLACK)\n  pygame.draw.line(screen,\
    \ WHITE, [349, 0], [349, 500], 5)\n  pygame.display.flip()\n  clock.tick(60)\n\
    ```\n\nSo while our carryOn bool is True we’re checking if the user did anything\
    \ ( pygame.event.get() ), and if what they did was click close ( if event.type\
    \ == pygame.QUIT ) we’ll switch the carryOn bool to False.\n\nWe haven’t yet added\
    \ the game logic – that’ll all go in the middle here after the while loop. For\
    \ now, we’ve done our drawing. The screen has been filled in black and we’ve drawn\
    \ a white net across the screen. Then we’ve updated the screen with pygame.display.flip()\
    \ and set the fps rate.\n\n# Quitters!\n\nAs always, we’ll need a way to safely\
    \ quit our program. After the main program loop it’s best to include a pygame.quit()\
    \ command.\n\nFor our paddles, we’re going to create a new class. That way, we\
    \ can spawn multiple objects of that class and they’ll both carry the same properties.\
    \ We’ll need a paddle for each player, but they’ll both have the same height,\
    \ width, colour and so on. So it’s pragmatic to use an Object Oriented approach\
    \ here, rather than programming two separate entities. To implement Object Oriented\
    \ Programming properly, we’ll need to save our paddle class in its own file. Create\
    \ a new Python file called paddle.py.\n\n# Quick tip\n\nTry introducing a score\
    \ limit to the game. With the addition of selection, an IF statement could be\
    \ used to end the game once a player reaches a particular score count.\n\n![](img/e016e192a91ffc1a9e474690a590742f_108_0.png)"
