  md: "# Hack a toy with the Raspberry Pi: Part 2\n\nEmbed your hacks into your toy\
    \ and create the code to bring it to life\n\n+   * Resources\n* An old/new toy\n\
    * Resistors\n* Small disc motor\n* LED\n* A radio\n* Small webcam\n* Female-to-female\
    \ jumper jerky wire\n* Tactile button\n\nIn part one of this ‘hack a toy’ tutorial\
    \ you created four hacks that were originally used to augment a £3 R2D2 sweet\
    \ dispenser making it light up, vibrate, play music and stream a live web feed\
    \ to a mobile device. You may have been working on your own features to use and\
    \ customise your toy. Part two of this tutorial begins by showing two different\
    \ ways to set up and use a button to trigger your hacks. One method is to add\
    \ and code your own button, the second method is to utilise the toy’s own built-in\
    \ button. The next part walks you through how to wire up, code and test each of\
    \ the individual features before combining them into a single program which will\
    \ bring your toy to life.\n\n# 01 Prepare a button\n\nA button is a simple and\
    \ effective way of triggering the hacks that you created in part one of this tutorial.\
    \ Take a 4 x 6mm tactile button or similar and solder / attach a wire to each\
    \ of its sides. Take each wire and connect it to one end of a female-to-female\
    \ jumper wire. You can solder these into place or remove the plastic coating and\
    \ wrap them around each metal contact.\n\n![](img/e016e192a91ffc1a9e474690a590742f_171_0.png)\n\
    \n![](img/e016e192a91ffc1a9e474690a590742f_171_1.png)\n\n# 02 Set up the button\n\
    \nNext set up and test the button to ensure that it is working correctly. Take\
    \ one of the wires and slot it onto GPIO pin 17, this is physical pin number 11\
    \ on the board. The second wire connects to a ground pin, indicated by a minus\
    \ sign or the letters GND. The pin directly above GPIO pin 17 is a ground pin,\
    \ physical pin number nine. This will complete the circuit and make the button\
    \ functional.\n\n# 03 Test the button\n\nOpen your Python editor and start a new\
    \ file. Use the test program below to check that the button is functioning correctly.\
    \ To ensure the buttons are responsive, use a pull-up resistor code GPIO.PUD_UP\
    \ line 4. This removes multiple touches and means that only one ‘press’ is registered\
    \ each time the button is pressed. Save and run the program. If it is working\
    \ correctly it will return the message “Button works”.\n\n```\nimport RPi.GPIO\
    \ as GPIO\nGPIO.setmode(GPIO.BCM)\nGPIO.cleanup()\nGPIO.setup(17, GPIO.IN, GPIO.PUD_UP)\n\
    while True:\n    if GPIO.input(17) == 0:\n        print(\"Button works\")\n```\n\
    \n# 04 Use the button on the toy\n\nInstead of adding your own button you can\
    \ utilise an existing button on the toy to trigger the events. On the R2D2 example\
    \ this is the button at the front which releases the sweets and plays the classic\
    \ R2D2 beep sound. Using a screwdriver or suitable tool, open the casing of your\
    \ toy and then locate the electronics of the button. Locate the negative wire\
    \ and cut this in two. Now attach a jumper wire to each of the ends. You can test\
    \ that the connection is still working by joining the two jumper wires together\
    \ and pressing the button.\n\n# 05 Wire up your button\n\nIf your toy has a button\
    \ to trigger a sound or movement then it will use batteries. These will sit in\
    \ a case; we can bypass the battery circuit you added in Step 4 creates a secondary\
    \ circuit. When you press the button you join the two contacts and in turn complete\
    \ the circuit, this sends a small current around the circuit which can be detected\
    \ by the GPIO pin on the Raspberry Pi. Take one of the wires and attach it to\
    \ GPIO pin 1, the 3.3 volts which will provide the current."
  merge: -1
  img_proc: true
- pgno: 172
  md: "Attach the other wire to GPIO pin 15, physical pin number 10. Pin 15 checks\
    \ for a change in current.\n\nWhen the button is in its normal state, i.e. it\
    \ has not been pressed, no current flows from the 3.3v pin as the circuit is broken.\
    \ When you press the button it joins the contacts, the circuit completes and the\
    \ current flows. Pin 15 registers a change in state which is used to trigger an\
    \ event.\n\n# 06\nTest the button\n\nOpen a new Python file and enter the test\
    \ code below. On line four a Pull Down is used to check for the change in state.\
    \ The toy’s button completes the circuit and GPIO pin 15 receives a little current.\
    \ Its state becomes True or 1, line six, and then it triggers the display of a\
    \ confirmation message. The final line prints out a confirmation message each\
    \ time the button is pressed.\n\n![](img/e016e192a91ffc1a9e474690a590742f_172_0.png)\n\
    \n```\n```python\nimport time\nimport RPi.GPIO as GPIO\nGPIO.setmode(GPIO.BCM)\n\
    GPIO.setup(15, GPIO.IN, GPIO.PUD_DOWN) #checks for\na change on pin 7\nwhile True:\n\
    \    if GPIO.input(15) == 1:\n        print (\"You touched R2D2!\")\n```\n```\n\
    \n# 07\nWire up the LED\n\nNow to connect the individual hacks to your toy. These\
    \ examples are based on Part One of the tutorial but can be replaced with your\
    \ own. Shut your Pi down and unplug the power. Assuming that the LED is connected\
    \ to the jumper jerry wires, take the positive wire of the LED, the one with the\
    \ resistor, and attach it to GPIO pin 21. This is physical pin number 40, the\
    \ one at the very bottom-right of the pins. The black wire connects to a ground\
    \ pin. The nearest one is physical pin 39 just to the left of pin 40; attach it\
    \ there.\n\n# 08\nWire up the motor\n\nNext take the positive wire from the motor,\
    \ usually coloured red, and attach it to GPIO 09, which is physical pin number\
    \ 21. You will then need to connect the other wire to any of the ground pins,\
    \ (GND) 6, 9, 14, 20, 39. You may find that you need to relocate this wire later\
    \ on as you add more wires for the other components.\n\n# 09\nAdd the PiFM aerial\n\
    \nThe Raspberry Pi can broadcast to your radio directly from physical pin 7 without\
    \ the need to alter anything. However, you will probably want to extend the range\
    \ of the broadcast by adding a wire to GPIO 04, physical pin number 7. Unbelievably\
    \ this can extend the range of the broadcast up to 100 metres. You must use physical\
    \ pin number 7 to broadcast\n\n![](img/e016e192a91ffc1a9e474690a590742f_172_1.png)\n\
    \n![](img/e016e192a91ffc1a9e474690a590742f_172_2.png)\n\nso move around any other\
    \ wires that may be attached from your own hacks.\n\n# 10\nAdd the web camera\n\
    \nThe web camera is the simplest component to connect as it uses one of the USB\
    \ ports. Once you have plugged it in use\n\n# gpiozero\n\nThis is a smart Python\
    \ library that makes interaction with the GPIO pins really simple, for example\
    \ you can control an LED with the code led.on(). It covers a massive range of\
    \ components, hardware and add on boards. You can find out more here https://gpiozero.readthedocs.io/en/v1.2.0/#"
  merge: -1
  img_proc: true
- pgno: 173
  md: "# # Use Pi with Pi\n\nthe command sudo 1sub to list the connections to the\
    \ port. If it displays the name of your web camera, then it has been successfully\
    \ recognised and is ready to go. Consider stripping away the plastic shell so\
    \ you are left with just the board and lens. Adjust the casing so that it fits\
    \ neatly and can be hidden within your toy.\n\n# ## 11 Set up the program\n\n\
    Assuming that you have installed all the required software modules and libraries\
    \ for your hacks, you are now ready to create the program to control your toy’s\
    \ extra features. Open a file in your Python editor and import os, this will control\
    \ the PiFM and web camera, line 1. Next import the PiFM library; the webcam runs\
    \ automatically when you boot up your Pi, see Part One in issue 168. Step 12.\
    \ Set the GPIO pins to BCM on line 6 and then define the PUD for the button set\
    \ up you are using. The first option, line 7, is for a button that is already\
    \ connected to your toy, the second is to be used if you have added your own button.\n\
    \n```\n```\nimport os\nimport sys\nimport time\nimport RPi.GPIO as GPIO\nimport\
    \ PiFM\nGPIO.setmode(GPIO.BCM)\n\n\nGPIO.setup(15, GPIO.IN, GPIO.PUD_DOWN)  #checks\
    \ for a change on pin 7\nGPIO.setup(17, GPIO.IN, GPIO.PUD_UP)\n```\n```\n\n# ##\
    \ 12 Set up the other outputs\n\nNext prepare the two other GPIO outputs, in this\
    \ example the LED and the motor. Set these as OUTPUTS using the code GPIO.setup(9,\
    \ GPIO. OUT), line 1 and then turn the LED off using the code GPIO.output(21,\
    \ GPIO.LOW). This ensures that when you start your program running the\n\nLED\
    \ and the motor do not run until the trigger button is pressed.\n\n```\n```\n\
    GPIO.setup(9, GPIO.OUT)\nGPIO.output(9, GPIO.HIGH)\n\n\nGPIO.setup(21, GPIO.OUT)\n\
    GPIO.output(21, GPIO.LOW)\n```\n```\n\n# ## 13 Set up the LED\n\nCreate a function\
    \ to store the code that will control the LED, making it turn on for five seconds\
    \ and then turn off again, lines 2, 3 and 4. Then set up a simple message to display\
    \ at the start of the program to let you know that the toy is ready and the pins\
    \ are prepared. This is useful for debugging your program.\n\n```\n```\ndef LED_Eye():\n\
    \    GPIO.output(21, GPIO.HIGH)\n    time.sleep(5)\n    GPIO.output(21, GPIO.LOW)\n\
    ```\nprint (\"Welcome to R2D2\")\n```\n\n# ## 14 Trigger the events\n\nSet up\
    \ a while loop to continually check if the button has been pressed, line 1. Use\
    \ an If statement to check when the button has been pressed and that the input\
    \ is HIGH. This uses the line GPIO.input(15) == 1: In this case the 1 refers to\
    \ an equivalent value of True or On; this relates to the circuit being completed\
    \ and a current flowing through as discussed in Step 6. Then trigger the motor\
    \ to turn on using GPIO. output(9, GPIO.LOW) line 5, and call the function LED_Eye()\
    \ to execute, lighting up the LED, line 6.\n\n```\n```\nwhile True:\n    if GPIO.input(15)\
    \ == 1:\n        print (\"You touched R2D2!\")\n        \"\"Enable LED and Motor\"\
