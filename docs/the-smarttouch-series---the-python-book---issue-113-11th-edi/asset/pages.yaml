  md: "# ## Use Python with Pi\n\n```\n```\nlogin as: pi\npi@192.168.1.219's password:\n\
    \nThe programs included with the Debian GNU/Linux system are free software;\n\
    the exact distribution terms for each program are described in the\nindividual\
    \ files in /usr/share/doc/*/copyright.\n\nDebian GNU/Linux comes with ABSOLUTELY\
    \ NO WARRANTY, to the extent\npermitted by applicable law.\nLast login: Sun Sep\
    \ 18 07:27:00 2016 from dan-pc.default\npi@raspberrypi:~$ sudo curl -sS get-pimoroni.com/skywriter\
    \ | bash\n\nThis script will install everything needed to use\nthe Pimoroni Skywriter\n\
    \n=== Warning ===\n\nAlways be careful when running scripts and commands\ncopied\
    \ from the internet. Ensure they are from a\ntrusted source.\n\nIf you want to\
    \ see what this script does before\nrunning it, you should run:\ncurl -sS https://get-pimoroni.com/skywriter\n\
    \nNote: Skywriter requires I2C communication\n\nDo you wish to continue? [y/N]\n\
    ```\n```\n\n# New Skywriter board\n\nPimoroni has developed a larger Skywriter\
    \ gesture board which works in three dimensions. It can sense your gestures from\
    \ up to 15cm away, which means that you can embed it underneath non-conductive\
    \ materials. This makes it suitable for wearables and projects where you want\
    \ to conceal the board. All the common gestures are recognised such as taps, flicks\
    \ and double taps, but these can be made from further away. You can even use it\
    \ as a mouse or keyboard. Find out more details here: http://bit.ly/2dJF0sw\n\n\
    +   **20**\nDouble tap\n\nIn this program you can double tap a part of the Skywriter\
    \ board and it will tell you the location of the tap.\nThis makes use of a variable\
    \ called position, line 3, which stores your tap location as either north, east,\
    \ south, west or centre, depending on where you tap it. Line 4 prints out the\
    \ position that you double tapped at. For example, if you double tap at the top\
    \ of the board it will print: Double tap! North. All signals are cleared after\
    \ the tap to ensure that each tap is clearly identified, line 5. Save and run\
    \ the program; tap, tap.\n\n```\n```\nimport skywriter\n\n@skywriter.tap()\ndef\
    \ tap2(position):\n    print('Tap!', position)\n    if position == 'north':\n\
    \        print( 'North')\n    elif position == 'south':\n        print( \"South\"\
    )\n```\n```\n\n+   **21**\nA single tap\n\nWhen making any of the gestures such\
    \ as tap, double-tap, touch, flick and so on, you can identify the location of\
    \ the gesture on the Skywriter board and respond with a particular action. For\
    \ example, you can touch the board at the top; this is the North tap. The right\
    \ is East, South is the bottom and West is on the left. A conditional can be used\
    \ to check the physical position where you touched the Skywriter and then return\
    \ one of five responses.\n\n```\n```\nimport signal\nimport skywriter\n\ndef doubletap(position):\n\
    \    print('Double tap!', position)\n\nsignal.pause()\n```\n```\n\n+   **23**\n\
    Slow down the responsiveness\n\nThe double tap is when you press the Skywriter\
    \ twice in quick succession, a tap is a single press, but, if you press it once\
    \ and then again, it will be interpreted as a double tap. You may wonder how,\
    \ a tap is distinguished from a double tap. To resolve this issue, add a reparate\
    \ rate to the tap code. This means that the action, the tap, is only repeated\
    \ once. Increase the repeat rate value if you still find the two gestures are\
    \ not distinct enough.\n\n```\n```\n@skywriter.tap(repeat_rate=1)\n```\n```\n\n\
    +   **24**\nSense a flick\n\nAnother useful gesture that you can be detected is\
    \ a flick. Simply set up the Skywriter to wait for flicks, line 1. Then create\
    \ a function that recognises the flick and records the direction of the flick,\
    \ for example, south to north or east to west, line 2. Then print out confirmation\
    \ that a flick was registered including the start and finish positions of the\
    \ flick direction, line 3.\n\n```\n```\n@skywriter.flick()\n\ndef flick(start,finish):\n\
    \    print('Got a flick!', start, finish\n```\n```\n\n+   **22**\nSensing position\n\
    \nCreate a new function that senses when the user taps the board, line 3, then\
    \ wait for the tap and record the location on the board where the user touched\
    \ it. This is stored in a variable called position, line 4. Add an if statement,\
    \ line 6, to check and compare the position. If it is tapped at the top of the\
    \ board, the north position, then print 'north'. Use an elif statement, line 8,\
    \ to check for a tap at the bottom of the board, the south position. Save the\
    \ program and run it.\n\n```\n```\nimport signal\n```\n```"
