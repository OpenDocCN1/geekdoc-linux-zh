  md: '# Use Python with Pi


    extract the files into:


    ```

    ```

    start_motion_daemon=yes

    mkdir PiFM

    cd PiFM

    ```

    ```


    Then download the required Python files:


    ```

    ```

    sudo apt-get update,

    sudo apt-get upgrade,

    wget http://www.omattos.com/pifm.tar.gz

    ```

    ```


    Finally, extract the files using the code:


    ```

    ```

    sudo tar -xvzf pifm.tar.gz

    ```

    ```


    # 15  Add a simple aerial and then broadcast


    Setting up the hardware is really easy. In fact, there is no need to attach anything
    as the Pi can transmit directly from physical pin 7 without the need to alter
    anything. However, you will probably want to extend the range of the broadcast
    by adding a wire to GPIO 4 (pin number 7). Unbelievably, this can extend the range
    of the broadcast to up to 100 metres! Ensure that you are in the PiFM folder and
    then broadcast the WAV file with the code line:


    ```

    ```

    sudo ./pifm name_of_wav_file.wav 100.0

    ```

    ```


    In this example, the Star Wars theme will play, but you can create and add your
    own sound files. The ‘100.0’ refers to the FM frequency of the broadcast; this
    can be changed between a range of 88 and 108MHz. Turn on your radio and adjust
    to the appropriate frequency and you will hear your message being played.


    # 16  Stop the broadcast


    If you wish to end the broadcast before the song or voice has finished, then you
    will need to kill the transmission. In a new terminal window, type top. This will
    list all the running programs. Look for PiFM somewhere near the beginning of the
    list and note the ID number. Return to the LX Terminal and type sudo kill 2345,
    replacing the 2345 with the appropriate process ID number. This will ensure that
    each broadcast is new and the Pi is only trying to transmit one WAV file at a
    time.


    ![](img/e016e192a91ffc1a9e474690a590742f_170_0.png)


    # 17  Next time...


    You now have four mini hacks which you have prepared and can adapt and combine.
    You may want to try embedding some of your own hacks that you have created. Over
    the page we will cover how to wire up and deploy them!


    ![](img/e016e192a91ffc1a9e474690a590742f_170_1.png)


    # BCM number


    GPIO pins are a physical interface between the Pi and the outside world. At the
    simplest level, you can think of them as switches that you can turn on or off.
    You can also program your Raspberry Pi to turn them on or off (output). The GPIO.BCM
    option means that you are referring to the pins by the ‘Broadcom SoC channel’
    number. The GPIO.BOARD option specifies that you are referring to the pins by
    their physical location on the header.


    ![](img/e016e192a91ffc1a9e474690a590742f_170_2.png)'
