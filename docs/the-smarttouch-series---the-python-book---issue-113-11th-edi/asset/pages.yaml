  md: "# # Win, lose or draw?\n\nWe'll probably need to consider adding a win and\
    \ lose state to our game, so that our player experiences some closure by either\
    \ winning or losing the game.\n\nWe already implemented collision detection in\
    \ our Move() function, so the game freezes when Pac-Man collides with a ghost.\
    \ However, nothing is currently communicated to the player. Look for the following\
    \ code and insert a message. You'll see in this example we've printed “Game over”:\n\
    \n```\n```python\nfor point, course in ghosts:\n    if abs(pacman - point) < 20:\n\
    ```\n```\n\n```\n```python\n        print(\"Game Over!\")\n        return\n```\n\
    ```\n\n```\n```python\nif state[\"score\"] == 160:\n    print(\"You Win!\")\n\
    ```\n```\n\nWe'll also need a way for players to win the game. For that, we'll\
    \ need to implement a win state. Perhaps code the writer turtle to print You Won!\
    \ when Pac-Man has collected all the dots, using a conditional statement, checking\
    \ for the score to hit 160, which is the maximum number of dots in this level.\
    \ One way would be to add the following code toward the bottom of the Move() function:\n\
    \n![](img/e016e192a91ffc1a9e474690a590742f_106_0.png)\n\n![](img/e016e192a91ffc1a9e474690a590742f_106_1.png)\n\
    \nAbove *Type* in the final few lines of code, before launching the game.\n\n\
    In this function we're drawing the scores first, then we're checking if a movement\
    \ is valid before allowing it. The second **if** statement is what controls the\
    \ eating of dots. If we wanted to take things a step further and introduce an\
    \ animation, sound effect or other things we would introduce it after **square(x,y)**.\
    \ Try adding **print(\"much\")** as an example.\n\n```\n```python\ndef change(x,\
    \ y):\n    if valid(pacman + vector(x, y)):\n        aim.x = x\n        aim.y\
    \ = y\n```\n```\n\nMovement is all well and good, but we'll need to be able to\
    \ change the direction our Pac-Man is aiming in. We'll start to seeing if that\
    \ direction is valid, thanks to our previous function, then we'll go ahead and\
    \ switch the x and y accordingly:\n\nOur last aim is for the floor calculation,\
    \ which takes into consideration the offset we made earlier:\n\n```\n```python\n\
    def floor(value, size, offset=200):\n    return float(((value + offset) // size)\
    \ * size - offset)\n```\n```\n\nWith this we can work out the floor value given\
    \ its size and offset. To explain the floor function we can use a number line\
    \ diagram:\n\n```\n-220      0    100   200\n<-===|=====|===|=y--|-z-->\n```\n\
    \nThe number line shown has offset 200 denoted by the left-hand tick mark at -200\
    \ and size 100 denoted by the tick marks at -100, 0, 100, and 200. The floor of\
    \ a value is the left-hand tick mark of the range where it lies. So for the points\
    \ show above: floor(x) is -200, floor(y) is 0 and floor(z) is 100. Some examples\
    \ would be **floor(10, 100) = 0.0** , **floor(120, 100) = 100.0** , **floor(-10,\
    \ 100) = -100.0** , **floor(-150, 100) = -200.0** , **floor(50, 167) = -33.0**\
    \ .\n\nAnd finally, we can get our game going, we'll need to set a resolution,\
    \ hide the Turtles, write the score, listen for keyboard presses (we're using\
    \ lambdas for this) and monitor the up, down, left, and right keys for our aim\
    \ changes. We'll then draw the world, start the move function and we're done!\n\
    \n```\n```python\nsetup(420, 420, 370, 0)\nhideturtle()\ntracer(False)\nwriter.goto(160,\
    \ 160)\nwriter.color('white')\nwriter.write(state['score'])\nlisten()\nonkey(lambda:\
    \ change(5, 0), \"Right\")\nonkey(lambda: change(-5, 0), \"Left\")\nonkey(lambda:\
    \ change(0, 5), \"Up\")\nonkey(lambda: change(0, -5), \"Down\")\nworld()\nmove()\n\
    done()\n```\n```\n\nOur version of Pac-Man is pretty basic, utilising 2D vector\
    \ graphics and Python's turtle graphics to draw shapes and dots on our screen.\
    \ This art style is very much in-line with the look and feel of the original incarnation\
    \ of the game in the 1980. This simplistic artistic direction also meant we were\
    \ able to code an entire game in a magazine article.\n\nHowever, programming techniques\
    \ and computers have moved on incredibly since the time of the first Pac-Man release\
    \ and if we wanted to take things a step further we could introduce graphical\
    \ sprites into our game. For instance, we might want a more accurate representation\
    \ of our ghost antagonists in full colour, with features such as eyes.\n\nRepil\
    \ user Anurag Gouda has developed a relatively simple solution to take our Python\
    \ game to the next level, by introducing real sprites. A sample of his code can\
    \ be found at https://repl.it/tak/share/Pacman/12194 which is fully forkable.\
    \ Replit is an online IDE (Integrated Development Environment) that enables you\
    \ to code Python on even the most basic of machines, using cloud resources instead\
    \ of your local hardware. All you need is an Internet connection. Using a fork\
    \ of Anurag's code on Replit, you can code a visual Pac-Man in the cloud – fancy!\n\
    \n> > **Quick tip**\n> Credit to Grant Jenks of Free Python Games for the code\
    \ reference. We wouldn't have been able to create a vector graphics based Pac-Man\
