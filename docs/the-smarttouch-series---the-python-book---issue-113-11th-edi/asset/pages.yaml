  md: '![](img/e016e192a91ffc1a9e474690a590742f_150_0.png)


    # 04 Excerpt or summary


    You can replace the post content in the index template with the excerpt, but we
    can keep it as a backup if the excerpt is empty:

    ``` {% if post.excerpt %} <p>{{ post.excerpt }}</p> {% else %} <p>{{ post.post|truncatewords:3
    }} </p> {% endif %}```


    # 05 Database error


    If you’ve decided to test the changes, you’ll have noticed our web server has
    stopped working. This is because there is no excerpt column in our database. Therefore
    we need to add the excerpt column. To find out how, run:  $ python manage.py sqlall
    blog


    # 06 Database query


    The output will show you what the SQL code is to add the models to the database.
    We want to add the excerpt field specifically, which should look something like
    this:

    ``` "excerpt" text NOT NULL ```

    Make a note of it.


    # 07 Alter table


    To get into the database shell and add the field, run $ python manage.py dbshell.
    Then we need to use an ALTER TABLE query:

    ``` ALTER TABLE “blog_post”; ```

    And then enter the code we noted down like so: ``` ADD “excerpt” text; ```


    # 08 Save the changes


    We’ve removed NOT NULL as we already have entries that won’t have an excerpt,
    and want to make it so an auto summary can be made. Save the changes with COMMIT;
    and then exit the shell with: ``` ;quit ```


    # 09 Test it out


    Now we can test out the excerpt code – create a new post or edit an existing one
    to have an excerpt. If you’ve followed our steps correctly it should work; if
    not, you may need to do a bit of bug fixing.'
