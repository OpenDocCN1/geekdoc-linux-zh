- pgno: 163
  md: "# Gesture control\n\n![](img/e016e192a91ffc1a9e474690a590742f_163_0.png)\n\n\
    # 17 Skywriter movements\n\nThe Pimoroni Skywriter HAT is an electrical near-field\
    \ 3D gesture-sensing board that uses a 4-layer PCB for the best sensing performance,\
    \ up to 5cm away! It has the capability to collect full 3D position data and gesture\
    \ information (swipes, taps, double taps, flicks and swirls) and then respond\
    \ to them with an action that you set. It also comes fully assembled.\n\n# 18\
    \ Install the software\n\nPimoroni has made it extremely easy to install the software\
    \ for your Skywriter HAT. Load the LX Terminal and type:\n\n```\n```bash\nsudo\
    \ curl -S$ GET.pimoroni.com/skywriter | bash\n```\n```\n\nFollow the instructions\
    \ that are displayed on the screen; these involve giving permission to install\
    \ the software and agreeing to the changes that the library requires. This will\
    \ now download the required libraries and a selection of Skywriter examples and\
    \ programs for you to try out. When installation has completed, reboot your Raspberry\
    \ Pi, and then you can get started with the next part of the process.\n\n# 19\
    \ Your first Skywriter program\n\nOpen a new Python file, (remember to use the\
    \ LX terminal method as used in Step 6, as administrative privileges are required)\
    \ and add the code below. First import the libraries to talk to the Skywriter,\
    \ lines 1 and\n\n2. Next create a function called move that will sense the position\
    \ of your finger on the Skywriter, line 3. Next read the x, y and z co-ordinates,\
    \ line 4, and finally print these to the Python window. Save the program and run\
    \ it. Move your finger over the Skywriter. Note that because it has touch-capacitive\
    \ capabilities you do not need to actually touch the board, just hover above it.\n\
    \n```\n```python\nimport signal\nimport skywriter\n```\n```\n\n```\n```python\n\
    @skywriter.move()\ndef move(x, y, z):\n    print( x, y, z )\n```\n```\n\n![](img/e016e192a91ffc1a9e474690a590742f_163_1.png)"
