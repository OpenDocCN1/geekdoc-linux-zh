  md: "# Quick tip\n\nHave a play around with the colours in the World() function\
    \ to create some funky-looking versions of Pac-Man.\n\nFinally, we’re creating\
    \ the game world. Every 1 is a collectable dot or floor space, and a 0 is a black\
    \ wall.\nOur game world is 20x20, so it may be easier to organise the above Python\
    \ list by creating a new line every 20th value. We haven’t done so here to save\
    \ space in print, but it’ll look a lot better in Python if you do – well, more\
    \ recognisable to the human eye, anyway.\n\n# Turtle good\n\nTime to put those\
    \ Turtles to good use. Let’s make a function to draw squares, which will be used\
    \ to create squares (and rectangles) in our game, for the walls:\n\n```\n```python\n\
    def square(x, y):\n    path.up()\n    path.goto(x, y)\n    path.down()\n    path.begin_fill()\n\
    \    for count in range(4):\n        path.forward(20)\n        path.left(90)\n\
    \    path.end_fill()\n```\n```\n\nWe’ll also need a couple of functions to work\
    \ out the maths.\nEven though Pac-Man is a relatively simple game, there’s still\
    \ an element of physics involved, mainly in collision detection and ensuring our\
    \ Pac-Man doesn’t walk through the walls and out of the game world.\n\n```\n```python\n\
    def offset(point):\n    x = (floor(point.x, 20) + 200) / 20\n    y = (180 - floor(point.y,\
    \ 20)) / 20\n    index = int(x + y * 20)\n    return index\n```\n```\n\nThis will\
    \ return the offset. We’ll also need to check if moves are valid:\n\n```\n```python\n\
    def valid(point):\n    index = offset(point)\n    if tiles[index] == 0:\n    \
    \    return False\n    index = offset(point + 10)\n    if tiles[index] == 0:\n\
    \        return False\n    return point.x % 20 == 0 or point.y % 20 == 0\n```\n\
    ```\n\n![](img/e016e192a91ffc1a9e474690a590742f_105_0.png)\n\nLet’s use that Turtle\
    \ again to draw our game world:\n\n```\n```python\ndef world():\n    bgcolor('black')\n\
    \    path.color('blue')\n    for index in range(len(tiles)):\n        tile = tiles[index]\n\
    \        if tile > 0:\n            x = (index % 20) * 20 - 200\n            y\
    \ = 180 - (index // 20) * 20\n            square(x, y)\n        if tile == 1:\n\
    \            path.up()\n            path.goto(x + 10, y + 10)\n            path.dot(2,\
    \ 'white')\n```\n```\n\nOf course we can change the colours to suit, but to start\
    \ with we’re using the traditional black and blue environment of the 1980 version\
    \ of Pac-Man. That final colour (path.dot) is assigned to our dots on the path.\
    \ You’ll notice we’re taking advantage of the square function we set up previously.\n\
    Our one major function, move, will be used to move both our Pac-Man and our ghosts\
    \ around the game.\n\n```\n```python\ndef move():\n    writer.undo()\n    writer.write(state['score'])\n\
    \    clear()\n    if valid(pacman + aim):\n        pacman.move(aim)\n        index\
    \ = offset(pacman)\n        if tiles[index] == 1:\n            tiles[index] =\
    \ 2\n            state['score'] += 1\n            x = (index % 20) * 20 - 200\n\
    \            y = 180 - (index // 20) * 20\n            square(x, y)\n    up()\n\
    \    goto(pacman.x + 10, pacman.y + 10)\n    dot(20, 'yellow')\n    for point,\
    \ course in ghosts:\n        if valid(point + course):\n            point.move(course)\n\
    \        else:\n            options = [\n                vector(5, 0),\n     \
    \           vector(-5, 0),\n                vector(0, 5),\n                vector(0,\
    \ -5),\n            ]\n            plan = choice(options)\n            course.x\
    \ = plan.x\n            course.y = plan.y\n    up()\n    goto(point.x + 10, point.y\
    \ + 10)\n    dot(20, 'red')\n    update()\n    for point, course in ghosts:\n\
    \        if abs(pacman - point) < 20:\n            return\n    ontimer(move, 100)\n\
    ```\n```"
