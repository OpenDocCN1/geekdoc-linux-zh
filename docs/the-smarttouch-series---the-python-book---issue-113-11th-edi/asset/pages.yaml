  md: "# Work with Python\n\n**Quick tip**\n\nA C System Call is just a C function.\
    \ What makes a System Call different from an ordinary C function is the fact that\
    \ system calls implement functionality that is usually low level and connects\
    \ the UNIX kernel with the rest of the world. At the end of the day, Python 3\
    \ commands related to file operations are translated into C system calls.\n\n\
    # Processing options\n\nThe single most important thing to consider in the implementation\
    \ of mycp.py is what you are going to do when the destination file already exists.\
    \ Put simply, are you going to delete it or are you going to stop the copy process?\
    \ The default behaviour of the cp utility is to delete the destination file unless\
    \ you use the -n switch. Additionally, if you use the -i option, cp will ask you\
    \ whether you want to delete the destination file or not. However, if you use\
    \ both -n and -i, then -n will take precedence and -i will be ignored. The second\
    \ task is to be able to tell whether the destination file is a directory because\
    \ in this case you're going to put the new file inside that directory.\n\nHere\
    \ we process command line arguments and options related to file copying using\
    \ the Python 3 code of processOptions.py for example:\n\n```\n`#!/usr/bin/env\
    \ python3`\n\n```python\nimport os\n\niSwitch = 0;\nnSwitch = 0;\n\nif len(sys.argv)\
    \ == 3:\n    source = str(sys.argv[1])\n    destination = str(sys.argv[2])\nelif\
    \ len(sys.argv) == 4:\n    source = str(sys.argv[1])\n    destination = str(sys.argv[2])\n\
    \    option1 = str(sys.argv[3])\n    if option1 == \"-i\":\n        iSwitch =\
    \ 1;\n    if option1 == \"-n\":\n        nSwitch = 1;\nelif len(sys.argv) >= 5:\n\
    \    source = str(sys.argv[1])\n    destination = str(sys.argv[2])\n    option1\
    \ = str(sys.argv[3])\n    option2 = str(sys.argv[4])\n    if (option1 == \"-i\"\
    \ or option2 == \"-i\"):\n        iSwitch = 1;\n    if (option1 == \"-n\" or option2\
    \ == \"-n\"):\n        nSwitch = 1;\n    else:\n```\n```\n\n```\n```python\nprint('Usage:\
    \ ', sys.argv[0], 'source destination [-in]')\nsys.exit(0)\n\n# If the source\
    \ is not a file\nif os.path.isfile(source) == False:\n    print(source, 'is not\
    \ a file. Exiting...')\nsys.exit(0)\n\n# If the destination is a directory\nif\
    \ os.path.isdir(destination):\n    destination = destination + '/' + source\n\
    \    print('Copying to', destination)\n\n# If the destination already exists\n\
    if os.path.isfile(destination):\n    print(destination, 'already exists!')\n#\
    \ If -n switch is OFF, check the -i switch\nif nSwitch == 0:\n    if iSwitch ==\
    \ 1:\n        answer = input('y\\n')\n        if answer == 'y' or answer == 'Y':\n\
    \            print('Copying', source, 'to', destination)\n    else:\n        print('Cannot\
