  md: "**16 The client’s Networking class**\nMuch of the client's **Networking** class\
    \ is similar to that of the server’s. One difference is that the class doesn't\
    \ inherit the **Thread** class – we just start one of its functions as a thread.\n\
    \n```\n```\nclass Networking():\n    def __init__(self, window, username, server,\
    \ port):\n        # Set up the networking class\n        self.window = window\n\
    \        self.socket = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\n   \
    \     self.socket.connect((server, port))\n        self.listening = True\n   \
    \     # Tell the server that a new user has joined\n        self.send(\"USERNAME\
    \ {0}\".format(username))\n\n    def listener(self):\n        # A function run\
    \ as a thread that listens for new messages\n        while self.listening:\n \
    \           data = \"\"\n            try:\n                data = self.socket.recv(1024)\n\
    \            except socket.error:\n                \"Unable to receive data\"\n\
    \            self.handle_msg(data)\n        # Don't need the while loop to be\
    \ ridiculously fast\n        time.sleep(0.1)\n```\n```\n\n**17 Running a function\
    \ as a thread**\nThe listener function above will be run as a thread. This is\
    \ trivial to do. Enabling the **daemon** option on the thread means that it will\
    \ die if the main thread unexpectedly ends.\n\n```\n```\ndef listener(self):\n\
    \    # Start the listening thread\n    self.listen_thread = threading.Thread(target=self.\
    \ listener)\n    # Stop the child thread from keeping the application open\n \
    \   self.listen_thread.daemon = True\n    self.listen_thread.start()\n```\n```\n\
    \n**18 Finishing the Networking class**\nAgain, most of this code is similar to\
    \ the code in the server's Networking class. One difference is that we want to\
    \ add some things to the text view of our window. We do this by using the **idle_add**\
    \ function of GObject. This allows us to call a function that will update the\
    \ window running in the main thread when it is not busy.\n\n```\n```\ndef send(self,\
    \ message):\n    # Send a message to the server\n    print \"Sending: {0}\".format(message)\n\
    \    try:\n        self.socket.sendall(message)\n    except socket.error:\n  \
    \      print \"Unable to send message\"\n\n    def tidy_up(self):\n        # We'll\
    \ be tidying up if either we are quitting or the server is quitting\n        self.listening\
    \ = False\n        self.socket.close()\n        # We won't see this if it's us\
    \ that's quitting as the window will be gone shortly\n        gobject.idle_add(self.window.add_text,\
    \ \"Server has quit.\\n\")\n\ndef handle_msg(self, data):\n    if data == \"QUIT\"\
    :\n        # Server is quitting\n        self.tidy_up()\n        elif data ==\
    \ \"\":\n        # Server has probably closed unexpectedly\n        self.tidy_up()\n\
    \    else:\n        # Tell the GTK thread to add some text when it's ready\n \
    \       gobject.idle_add(self.window.add_text, data)\n```\n```\n\n**19 Starting\
    \ the client**\nThe main window is started by initialising an instance of the\
    \ class. Notice that we don't need to store anything that is returned. We then\
    \ start the GTK thread by calling **gtk.main()**.\n\n```\n```\nif __name__ ==\
    \ \"__main__\":\n    # Create an instance of the main window and start the gtk\
    \ main loop\n    MainWindow()\n    gtk.main()\n```\n```\n\n**20 Tryying it out**\n\
    You'll want a few terminals: one to start the server, and some to run clients.\
    \ Once you've started the server, open an instance of the client and enter **127.0.0.1**:port,\
    \ where 'port' is the port you decided to use. The server will print the port\
    \ it's listening on to make this easy. Then enter a username and click OK. Here\
    \ is an example output from the server with two clients. You can use the client\
    \ over a network by replacing 127.0.0.1 with the IP address of the server. You\
    \ may have to let the port through your computer's firewall if it is not working.\n\
    \n```\n```\n[liam@liam-laptop19 Python]$ .\\IM-Server.py\nListening on port 59891\n\
    Listening for more clients\nStarting client thread for ('127.0.0.1', 38726)\n\
    sent: USERNAME client1\nechoing: client1 has joined.\nListening for more clients\n\
    Starting client thread for ('127.0.0.1', 38739)\nsent: USERNAME client2\nechoing:\
    \ client2 has joined.\nListening for more clients\nStarting client thread for\
    \ ('127.0.0.1', 38739)\nsent: Hi\nechoing: client1 says: Hi\nechoing: client2\
    \ says: client1 says: Hi\nechoing: client1 says: Quit\nechoing: client1 has quit.\n\
    Ending client thread for ('127.0.0.1', 38726)\n^C\nechoing: QUIT\nCould not accept\
    \ any more connections\nending client thread for ('127.0.0.1', 38739)\nsent: echoing:\
    \ client2 has quit.\n```\n```\n\n**21 That's it!**\nSo... it's not perfect and\
    \ could be a little more robust in terms of error handling, but we have a working\
    \ instant messenger server that can accept multiple clients and relay messages\
    \ between them. More importantly, we have learned a bunch of new concepts and\
    \ methods of working."
