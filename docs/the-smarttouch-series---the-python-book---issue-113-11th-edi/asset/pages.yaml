    \ the function from **Step 5**. This places the headline into the title placeholder\
    \ on the slide, then places the hyperlink into the subtitle placeholder. As hyperlink\
    \ addresses are not always user friendly and could be any length, we should assign\
    \ the hyperlink to the text label **Click for full story**, which we do in line\
    \ three.\n\n![](img/e016e192a91ffc1a9e474690a590742f_158_0.png)\n\naddress the\
    \ text label **Click for full story**, which we do in line three.\n\n```\n```python\n\
    prs = Presentation()\nfor key, value in News_Dict.items():\n    this_slide = create_my_default_slide(\"\
    %s\" % key, \"Click for full story: \")\nadd_hyper_link(this_slide.shapes[1],\
    \ value, value)\nprint(len(prs.slides))\n```\n```\n\n# 14  Create the presentation,\
    \ part 2\n\nFor the next step, we need to write the hyperlinks to each slide.\
    \ In **Step 8** and **9**, the function converts the text string into an operational\
    \ hyperlink. Line one uses the **add** method to write each unique hyperlink to\
    \ the text label on each slide. The label is selected using the code **this_slide.shapes[1]**,\
    \ where **[1]** refers to the second textbox on the slide. The final line of code\
    \ is actually optional, and prints out the total number of slides in the presentation.\
    \ This is useful for checking that the program is working accurately – ten news\
    \ stories should always create ten slides.\n\n# 15  Create the presentation, part\
    \ 3\n\nThe final line of the program, **prs.save()**, builds and saves the presentation.\
    \ The presentation file is saved to the same folder where the Python program is\
    \ stored and executed from. You can alter the file location and the name of the\
    \ file if you need to do so.\n\n```\n```python\nprs.save('Whats_News.pptx')\n\
    ```\n```\n\n# 16  Run the program\n\nSave your code and then run it by pressing\
    \ **F5**. The program will connect to the news website and download stories. You\
    \ can adjust the number that you require by editing the value in **step 10**.\n\
    \nThe program then bundles the slides together and exports them as a file with\
    \ the **.pptx** extension (Microsoft PowerPoint’s default format). You can view\
    \ the presentation directly on the Raspberry Pi using Libre Office, or transfer\
    \ the file to another device and use most standard presentation software to open\
    \ it. Feel free, of course, to improve the program further – perhaps by adding\
    \ some error-checking code in case the downloading of data fails for some reason.\n\
    \n# Make the What's News? app\n\nWhy not create an automated news machine, and\
    \ add email functionality and a button to trigger up-to-the-minute news feeds?\
    \ Simply press the big red button and the program runs, pulls down the news, creates\
    \ the presentation and then emails it to a preselected account. It’s great for\
    \ educational environments, see http://www.tecoco.co.uk/whats-news-app.html.\n\
    \n![](img/e016e192a91ffc1a9e474690a590742f_158_1.png)\n\nTutorial files available:\
    \ fileisilo.co.uk"
