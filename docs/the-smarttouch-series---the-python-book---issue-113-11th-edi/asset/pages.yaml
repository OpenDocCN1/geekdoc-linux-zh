    \n**15 Result function**\nThe result function still takes the same two variables\
    \ as before, which we set in the game interface. While technically we can use\
    \ the variables set up for the interface, these are not pure integers and can\
    \ cause an error if not handled correctly. With that in mind, we created an empty\
    \ new_score variable that we can use to effectively clean the interface value\
    \ before adding it back into it.\n\n**16 Tie**\nThe logic for determining the\
    \ result is the same as before. We first do the easy check—whether or not the\
    \ numeric value for the player and computer variable is the same. What changes\
    \ this time is that, instead of printing the text, we send the “Tie game” message\
    \ to our result variable using the set function from Tkinter.\n\n**17 Win**\n\
    If the if statement continues by seeing if the player has won. Like before, we\
    \ use the rules we set to make the comparison for the code to\n\nmake. We set\
    \ the result_set like we did in the tie game, with a different message to the\
    \ user. Finally, we set the new_score variable to be the current player score,\
    \ using the get function to obtain it, plus one to the score, and then use set\
    \ again to put it back into the player_score variable. We can’t use += with the\
    \ player_score variable, as it is not a standard variable.\n\n**18 Lose**\nThis\
    \ part of the overall if statement works in the same way as before, by assuming\
    \ that if it isn’t a tie or a win, it’s a loss. Like the new version of the win\
    \ code, it then uses set to change the message that will be displayed to the player,\
    \ and calls upon and changes the computer score by putting it through the new_score\
    \ variable.\n\n**19 New window**\nAs the original window is part of the mainloop,\
    \ we cannot have the window be created using Tk() like in the main interface code.\
    \ As this window is coming off it, though, we instead create it using Toplevel().\
    \ This allows the window to run separately and on top of the main window. We’ve\
    \ also given\n\nit a name, which will not change the main window’s name in the\
    \ process.\n\n**20 Interface variables**\nHere is the reason we had to call and\
    \ change the variables in a different manner. For Tinter, we need to let the interface\
