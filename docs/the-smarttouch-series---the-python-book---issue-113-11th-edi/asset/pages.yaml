- pgno: 97
  md: "# ## Check your mail\n\nWith Python, you can have your Raspberry Pi act as\
    \ mail checker, giving you a running list on incoming email\n\nSince the Raspberry\
    \ Pi is such a small computer, it gets used in a lot of projects where you want\
    \ to monitor a source of data. One such monitor you might want to create is a\
    \ mail-checker that can display your current unread emails. This issue, we'll\
    \ look at how to use Python to create your own mail-checking monitor to run on\
    \ your Pi. We will focus mainly on the communications between the Pi and the mail\
    \ server and not worry too much about how it might be displayed. That will be\
    \ left as a further exercise.\n\nTo start with, most email servers use one of\
    \ two different communication protocols. The older, simpler one was called POP\
    \ (Post Office Protocol), and the newer one is called IMAP (Internet Message Access\
    \ Protocol). We will cover both protocols to cover all of the situations that\
    \ you might run into. We'll start with the older POP communications protocol.\
    \ Luckily, there is support for this protocol as part of the standard library.\
    \ In order to start using it, you will first need to import the poplib module,\
    \ and then create a new POP3 object. For example, the following will create a\
    \ connection to the POP server that is available through Gmail.\n\n```\n```\n\
    import poplib\nmy_pop = poplib.POP3_SSL(host='pop.gmail.com')\n```\n\n```\n\n\
    You need to use the POP3_SSL class when connecting to Gmail because Google uses\
    \ SSL for its connections. If connecting to a different email server, you can\
    \ use POP3 to make an unencrypted connection. The POP communication protocol involves\
    \ the client sending a series of commands to the server to interact with it. For\
    \ example, you can get the welcome message from the server with the getwelcome()\
    \ method:\n\n```\n`my_pop.getwelcome()`\n\n```\n\nThe first things that you will\
    \ want to communicate to the server are the username and password for the email\
    \ account that you are interested in. Having the username in your code is not\
    \ too much of a security issue, but the password is another matter. Unless you\
    \ have a good reason to have it written out in your code, you should probably\
    \ ask the end-user for it. Included within the standard library is the getpass\
    \ module, which you can use to ask the end-user for their password in a safer\
    \ fashion. You could use the following code, for example.\n\n```\n```\nimport\
    \ getpass\nmy_pop.user('m_y_name@gmail.com')\nmy_pop.pass_(getpass.getpass())\n\
    ```\n\n```\n\nYou should now be fully logged in to your email account. Under POP\
    \ your account will be locked until you execute the quit() method of the connection.\
    \ If you need a quick summary of what is on the server then you can execute the\
    \ stat() method:\n\n```\n`my_pop.stat()`\n\n```\n\nThis method returns a tuple\
    \ consisting of the message count and the mailbox size. You can get an explicit\
    \ list of messages with the list() method. You have two options for looking at\
    \ the actual contents of these emails, depending on whether you want to leave\
    \ the messages untouched or not. If you want to simply look at the first chunk\
    \ of the messages, you can use the top() method. The following code will grab\
    \ the headers and the first five lines of the first message in the list.\n\n```\n\
    `email_top = my_pop.top(1, 5)`\n\n```\n\nThis method will return a tuple consisting\
    \ of the response text from the email server, a list of the headers and the number\
    \ of requested lines, and the octet count for the message. The one problem with\
    \ the top() method is that it is not always well implemented on every email server.\
    \ In some cases, you can use the retr() method. It will return the entire requested\
    \ message in the same form as that returned from top(). Once you have your message\
    \ contents, you need to decide what you actually want to display. As an example,\
    \ you might want to simply print out the subject lines for each message. You could\
    \ do that with the following code.\n\n```\n```\nfor line in email_top[1]:\n  \
    \  if 'Subject' in l:\n        print(l)\n```\n\n```\n\nYou need to explicitly\
    \ do the search because the number of lines included in the headers varies from\
    \ message to message. Once you are done, don't forget to execute the quit() method\
    \ to close down your connection to the email server. One last thing to keep in\
    \ mind is how long your email server will keep the connection alive. While running\
    \ test code for this article, it would frequently time out. If you need to, you\
    \ can use the noop() method as a keep-alive for the connection.\n\nAs mentioned\
    \ previously, the second, newer, protocol for talking to email servers is IMAP.\
    \ Luckily, there is a module included in the standard library that you can use,\
    \ similar to the poplib module we looked at above, called imaplib. Also, as above,\
    \ it contains two main classes to encapsulate the connection details. If you need\
    \ an SSL connection, you can use IMAP4_SSL. Otherwise, you can use IMAP4 for\n\
    \n> Most email servers use one of two communication protocols"
  merge: -1
  img_proc: true
- pgno: 98
  md: "unencrypted connections. Using Gmail as an example, you can create an SSL connection\
    \ with the following code.\n\n```\nimport imaplib\nimport getpass\nmy_imap = imaplib.IMAP4_SSL('imap.gmail.com')\n\
    ```\n\nAs opposed to poplib, imaplib has a single method to handle authentication.\
    \ You can use the getpass module to ask for the password.\n\n```\nmy_imap.login('my_username@gmail.com',\n\
    getpass.getpass())\n```\n\nIMAP contains the concept of a tree of mailboxes where\
    \ all of your emails are organised. Before you can start to look at the emails,\
    \ you need to select which mailbox you want to work with. If you don't give a\
    \ mailbox name, the default is the inbox. This is fine since we only want to display\
    \ the newest emails which have come in. Most of the interaction methods return\
    \ a tuple that contains a status flag (either 'OK' or 'NO') and a list containing\
    \ the actual data. The first thing that we need to do after selecting the inbox\
    \ is to search for all of the messages available, as shown in the following example.\n\
    \n```\nmy_imap.select()\ntyp, email_list = my_imap.search(None,\n'ALL')\n```\n\
    \nThe email_list variable contains a list of binary strings that you can use to\
    \ fetch individual messages. You should check the value stored in the variable\
    \ typ to be sure that it contains 'OK'. To loop through the list and select a\
    \ particular email you can use the following code:\n\n```\nfor num in email_list[0].split():\n\
    \    typ, email_raw = my_imap.fetch(num, '(RFC822')\n```\n\nThe variable email_raw\
    \ contains the entire email body as a single escaped string. While you could parse\
    \ it to pull out the pieces that you want to display in your email monitor, that\
    \ kind of defeats the power of Python. Again, available in the standard library\
    \ is a module called email that can handle all of those parsing issues. You will\
    \ need to import the module in order to use it, as in the example here.\n\n```\n\
    import email\nemail_msg = email.message_from_bytes(email_raw[0][1])\n```\n\nAll\
    \ of the sections of your email are now broken down into sections that you can\
    \ pull out much more easily. Again, to pull out the subject line for a quick display,\
    \ you can use the code:\n\n```\nsubject_line = email_msg.\nget('Subject')\n```\n\
    \nThere are many different potential items that you can select out. To get the\
    \ full list of available header items, you can use the keys method, as below:\n\
    \n```\nemail_msg.keys()\n```\n\nMany times, the emails you get will come as multi-part\
    \ messages. In these cases, you'll need to use the get_payload() method to extract\
    \ any attached parts. It will come back as a list of further email objects. You\
    \ then need to use the get_payload() method on these returned email objects to\
    \ get the main body. The code might look like:\n\n```\npayload1 = email_msg.get_payload()[0]\n\
    body1 = payload1.get_payload()\n```\n\nAs with POP email connections, you may\
    \ need to do something to keep the connection from timing out. If you do, you\
    \ can use the noop() method of the IMAP connection object. This method acts as\
    \ a keep-alive function. When you are all done, you need to be sure to clean up\
    \ after yourself before shutting down. The correct way to do this is to close\
    \ the mailbox you have been using first, and then log out of the server. An example\
    \ is given here:\n\n```\nmy_imap.logout()\nmy_imap.close()\n```\n\nYou now should\
    \ have enough information to be able to connect to an email server, get a list\
    \ of messages, and then pull out the sections that you might want to display as\
    \ part of your email monitor. For example, if you are displaying the information\
    \ on an LCD, you might just want to use the subject lines scrolling past. If you\
    \ are using a larger screen display, you might want to grab a section of the body,\
    \ or the date and time, to include as part of the information.\n\n# ## What about\
    \ sending emails?\n\nIn the main article, we have only looked at how to connect\
    \ to an email server and how to read from it. But, what if you'd like to be able\
    \ to also send emails using code? Similar to poplib and imaplib, the Python standard\
    \ library includes a module called smtplib. Again, similar to poplib and imaplib,\
    \ you need to create an SMTP object for the connection, and then log in to the\
    \ server. If you're using the Gmail SMTP server, you could use the code:\n\n```\n\
    import smtplib\nimport getpass\nmy_smtp = smtplib.SMTP_SSL('smtp.gmail.com')\n\
    my_smtp.login('my_email@gmail.com', getpass.getpass())\n```\n\nThis code asks\
    \ the end user for their password, but if you aren't concerned about security,\
    \ you could have it hard-coded into the code. Also, you only need to use the login()\
    \ method for those servers that require it. If you're running your own SMTP server,\
    \ you may have it set up to accept unauthenticated connections. Once you're connected\
    \ and authenticated, you can now send emails out. The main method to do this is\
    \ called sendmail(). As an example, the following code sends 'Hello World' email\
    \ to a couple of people:\n\n```\nmy_smtp.sendmail('my_email@gmail.com', ['friend1@email.com',\n\
    'friend2@email.com'],\n'This email\\r\\nSans\\r\\nHello World')\n```\n\nThe first\
    \ parameter is the 'from' email address. The second parameter is a list of 'to'\
    \ email addresses. If you only have one 'to' address, you can still use a single\
    \ string rather than a list. The last parameter is a string containing the body\
    \ of the email. One thing to be aware of is that you will only get an exception\
    \ if the email can't be sent to any of the 'to' email addresses. As long as the\
    \ message can be sent to at least one of the addresses, it will return as completed.\
    \ Once you have finished sending your emails, you can clean up with the code:\n\
    \n```\nmy_smtp.quit()\n```\n\nThis cleans everything up and shuts down all active\
    \ connections. So now your project can reply to incoming emails, too."
  merge: -1
  img_proc: true
- pgno: 99
  md: "# Multitask with your Pi\n\nLearn how to add multitasking to your own Python\
    \ code – perfect for those with multiple projects on the go\n\nThe majority of\
    \ programmers will learn single-threaded programming as their first computational\
    \ model. The basic idea is that instructions for the computer are processed sequentially,\
    \ one after the other. This works well enough in most situations, but you will\
    \ reach a point where you need to start multitasking. The classical situation\
    \ for writing multi-threaded applications is to have them run on a multi-processor\
    \ machine of some persuasion. In these cases, you would have some heavy, compute-bound\
    \ process running on each processor. Since your Raspberry Pi is not a huge 16-core\
    \ desktop machine, you might be under the assumption that you can't take advantage\
    \ of using multiple threads of execution. This isn't true, though.\n\nThere are\
    \ lots of problems that map naturally to the multiple thread model. You may also\
    \ have IO operations that take a relatively large amount of time to complete.\
    \ In these cases, it is well worth your programming effort to break your problem\
    \ down into a multi-threaded model. Since Python is the language of choice for\
    \ the Raspberry Pi, we will look at how you can add threads to your own Python\
    \ code. For those of you who have looked into multi-threaded programming in Python,\
    \ you may have run into the GIL (Global Interpreter Lock) before. This lock means\
    \ that only one thread can actually be running at a time, so you don't get true\
    \ parallel processing. But on the Raspberry Pi, this is actually okay.\n\nThe\
    \ first bit of code we need is to import the correct module. For this article,\
    \ we will be using the threading module. Once it is imported, you have access\
    \ to all of the functions and objects that you would need to write your code.\
    \ The first step is to create a new thread object with the constructor:\n\n```\n\
    t = threading.Thread(target=my_func)\n```\n\nThe thread object takes some function\
    \ that you have created, my_func in the above example, as the target code that\
    \ needs to be run. When the\n\nthread object has finished its initialisation,\
    \ it is alive but not running. You need to explicitly call the new thread's start()\
    \ method. This will begin running the code within the function handed to the thread.\n\
    \nYou can check to verify that this thread is alive and active by calling its\
    \ is_alive() method. Normally, this new thread will run until the function exits\
    \ normally. The other way a thread can exit is if an unhandled exception is raised.\
    \ Depending on your experience of parallel programs, you may already have some\
    \ ideas on what types of code you want to write. For example, in MPI programs,\
    \ you typically use the same overall code running in multiple threads of execution.\
    \ You use the thread's ID and a series of if or case statements to have each thread\
    \ execute a different section of the code. To do something similar, you can use\
    \ something like:\n\n```\ndef my_func():\n    id = threading.get_ident()\n   \
    \ if (id == 1):\n        do_something()\nthread1 = threading.Thread(target=my_func)\
    \ thread1.start()\n```\n\nThis code works in Python 3, but the get_ident() function\
    \ doesn't exist in Python 2. Threading is one of those modules that is a moving\
    \ target when moving from one version of Python to another, so always check the\
    \ documentation for the version of Python you are coding for.\n\nAnother common\
    \ task in parallel programming is to farm out time-intensive IO to separate threads.\
    \ This way, your main program can continue on with the core work and all of the\
    \ computing resources are kept as busy as possible. But how do you figure out\
    \ if the child thread is done yet or not? You can use the is_alive() function\
    \ mentioned above, but what if you can't continue without the results from the\
    \ child thread? In these cases, you can use the join() method of the thread object\
    \ you\n\nare waiting on. This method blocks until the thread in question returns.\
    \ You can include an optional parameter to have the method time-out after some\
    \ number of seconds. This allows you to not get trapped into a thread that will\
    \ never return due to some error or code bug.\n\nNow that we have more than one\
    \ thread of execution happening at the same time, we have a new set of issues\
    \ to start worrying about. The first is accessing global data elements. What might\
    \ happen if we had two different threads that want to read, or even worse write,\
    \ to the same variable in global memory? You can have situations where changes\
    \ to the value of variables can get out of sync with what you were expecting them\
    \ to be.\n\nThese types of issues are called race conditions, because the different\
    \ threads are racing with each other to see in what order their updates to variables\
    \ will happen. There are two solutions to this type of problem. The first is to\
    \ control access to these global variables and only allow one thread at a time\
    \ to be able to work with them. The generic term describing this control is to\
    \ use a mutex to control this access. A mutex is an object that a thread needs\
    \ to lock before working with the associated variables. In the Python threading\
    \ module, this object is called a lock. The first step is to create a new Lock\
    \ object with:\n\n```\nlock = threading.Lock()\n```\n\nThis new lock is created\
    \ in an unlocked state, ready to be used. The thread interested in using it must\
    \ call the acquire() method for the lock. If the lock is currently available then\
    \ it changes state to the locked state and your thread can run the code that is\
    \ meant to be protected. If the lock is currently in a locked state, then your\
    \ thread will sit in a blocked state, waiting for the lock to become free. Once\
    \ you are done with the protected code, you need to call the release() method\
    \ to free the lock and make it available for the next thread. You could control\
    \ a variable containing the sum of a series of results with:"
