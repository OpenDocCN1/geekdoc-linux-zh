    \ defining the start of each round. The end of each play session comes back through\
    \ here, whether we want to play again or not\n\n04  The game is actually contained\
    \ all in here, asking for the player input, getting the computer input and passing\
    \ these on to get the results. At the end of that, it then asks if you'd like\
    \ to play again\n\n05  Player input is done here. We give the player information\
    \ on how to play this particular version of the game and then allow their choice\
    \ to be used in the next step. We also have something in place in case they enter\
    \ an invalid option\n\n06  There are a few things going on when we show the results.\
    \ First, we're putting in a delay to add some tension, appending a variable to\
    \ some printed text, and then comparing what the player and computer did. Through\
    \ an if statement, we choose what outcome to print, and how to update the scores\n\
    \n07  We now ask for text input on whether or not someone wants to play again.\
    \ Depending on their response, we go back to the start, or end the game and display\
    \ the results\n\n```\n```python\n#!/usr/bin/env python2\n# Linux User & Developer\
    \ presents: Rock, Paper, Scissors: The Video Game\nimport random\nimport time\n\
    rock = 1\npaper = 2\nscissors = 3\nnames = { rock: \"Rock\", paper: \"Paper\"\
    , scissors: \"Scissors\" }\nrules = { rock: scissors, paper: rock, scissors: paper\
