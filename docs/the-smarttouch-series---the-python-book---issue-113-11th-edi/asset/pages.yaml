  md: '![](img/e016e192a91ffc1a9e474690a590742f_141_0.png)


    # Web development


    Django comes with a lightweight development server so you can test all your work
    locally


    Django is of course able to read and write to SQL databases, but it needs very
    little prior knowledge to succeed in doing so


    Using HTML and CSS in conjunction with Django is clear and straightforward; it’s
    much easier to bug-fix than PHP


    Django comes with a generic back-end site that is set up in seconds, and easily
    customisable after that


    # Resources


    Python Source Code

    [www.python.org/download/releases/2.7.2](www.python.org/download/releases/2.7.2)


    Django Source Code

    [www.djangoproject.com/download](www.djangoproject.com/download)


    # Build your own blog with Django


    Learn how to use this extremely powerful Python-based web framework to create
    a complete blog from scratch in record time


    Creating your own blog always feels like a great accomplishment. Sure, you could
    use the fantastic WordPress if you need a complete blog with every feature you’d
    ever need right now. And Tumblr exists for people who just want to write something,
    or post pictures of corgis in space. You don’t have full control from start to
    finish with a prefabricated blog, though, and neither of these is written in the
    fantastic Django. Django is of course based on Python, the object-oriented programming
    language designed to have clearly readable syntax. Due to its Python basis, it’s
    an incredibly powerful and simple-to-use language for web development with a vast
    array of applications.


    So let’s use it to make a blog. In this first section of the process we will explore
    how to set up Django, writing and reading to a database, creating a front- and
    back-end, and some interactions with HTML.'
