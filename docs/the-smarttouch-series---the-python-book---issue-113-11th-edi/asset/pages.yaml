- pgno: 160
  md: '# 01 Build your Robot Arm


    The Robotic Arm comes in kit form with a detailed set of instructions covering
    how to build the parts and combine them into the final arm. This will take you
    around three or so hours which is perfect for a rainy day. The arm kit includes
    all the required parts except for the batteries. The trickiest part is to ensure
    that the wiring is the correct way round. This will not damage the arm but it
    will result in the arm moving in the opposite direction to the programmed direction.


    # 02 Update your Pi


    After building the arm, plug in your Raspberry Pi and boot it up. At this point
    do not plug in the arm. First update the software and OS. Ensure that your Pi
    is connected to the Internet, open the LX terminal window and type:


    ```

    ```

    sudo apt-get update

    sudo apt-get upgrade

    ```

    ```


    Wait for the software to download and install, then reboot, typing `sudo reboot`.


    # 03 Install the USB software


    To use the Python programming language to interact with your robot arm, first
    install the PyUSB module. It provides a connection with Python and easy access
    to your Raspberry Pi''s Universal Serial Bus (USB) where the arm is plugged in.


    In the terminal window, type:


    ```

    ```

    sudo git clone https://github.com/wallac/pyusb.git

    ```

    ```


    Once installed move to the pyusb folder, type `cd pyusb`, then type the code `sudo
    python setup.py install`. This will install the required module. Finally, reboot
    your Raspberry Pi with `sudo reboot`.


    ![](img/e016e192a91ffc1a9e474690a590742f_160_0.png)


    # 04 Attach the robotic arm to the Pi


    Now that you have installed the required software to program the arm, plug it
    in. To do this simply take the USB lead from the arm and slot it into one of the
    available USB sockets on your Raspberry Pi. Turn the arm on using the power switch
    located on the base of the arm. You can test that the connection is live and the
    arm is recognised by opening the LX Terminal and typing `sudo lsusb`. This will
    return a list of the hardware connected to the USB ports.


    ![](img/e016e192a91ffc1a9e474690a590742f_160_1.png)


    # 05 Take control of the arm


    The arm is controlled by sending a line of code via the USB to the arm. This code
    includes the duration time of each movement as well as the coordinates to identify
    which motors to turn and on or off and in which directions to turn them. The actual
    codes to move the arm are fairly verbose, however Python simplifies them into
    manageable single lines of code.


    ![](img/e016e192a91ffc1a9e474690a590742f_160_2.png)


    # 06 Open Python


    From the menu of the taskbar select and open the LX Terminal, double click the
    logo. Administrative privileges are required to access the arm via Python, so
    open Python as a sudo user. In the LX Terminal, type `sudo idle` and press Return.
    When IDLE has loaded, open a new window, click File and then select New Window.


    # 07 Import the required libraries


    At the top of the window, create your program. Import the time, core usb and usb
    utility libraries, line 1. These enable you to send commands to the USB port and
    control the arm. USB is a complex protocol, but PyUSB has good defaults for most
    common configurations, minimising the need for verbose amounts of code. The time
    library permits you to add short delays between each movement of the Arm. Add
    the line of code as below.


    ```

    ```

    import usb.core, usb.util, time

    ```

    ```


    ![](img/e016e192a91ffc1a9e474690a590742f_160_3.png)


    # Experiment with the gestures to find ones that suit you


    The Skywriter boasts a number of gestures that you can experiment with and use
    in your own program. For example, the board can be used to detect you making a
    circular gesture, referred to as an air wheel. The Skywriter is also perfect for
    controlling additional projects, like changing the volume on your music player,
    or using the gestures to create music or play samples. Check out the full code
    for these examples and more at `https://github.com/pimoroni/ skywriter-hat/tree/master/examples`'
