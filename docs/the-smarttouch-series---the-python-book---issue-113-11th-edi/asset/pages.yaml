- pgno: 148
  md: "![](img/e016e192a91ffc1a9e474690a590742f_148_0.png)\n\n# 16 Administrate\n\n\
    Like the posts, we can get the Admin page to see comments. Start editing blogs/admin.py\
    \ to get this **feature added**:\n\n```\n```python\nfrom blog.models import Post,\
    \ Comment\nfrom django.contrib import admin\n\nclass PostAdmin(admin.ModelAdmin):\n\
    \    list_display = ['title', 'author', 'pub_date']\n    fields = ['title', 'pub_date',\
    \ 'author', 'post']\n    admin.site.register(Post, PostAdmin)\n```\n```\n\n![](img/e016e192a91ffc1a9e474690a590742f_148_1.png)\n\
    \n# 17 Comment-specific admin features\n\nNow we can add the comment-specific\
    \ admin features without causing any clashes:\n\n```\n```python\nclass CommentAdmin(admin.ModelAdmin):\n\
    \    list_display = ['text', 'author', 'post']\n    admin.site.register(Comment,\
    \ CommentAdmin)\n```\n```\n\nThis will show the comments on the admin site, and\
    \ you can see the comment, the author and the post it's connected to.\n\n# 18\
    \ Sidebar beginnings\n\nDjango makes it pretty easy to order posts by years and\
    \ months, but first we need to import some new models into blog/urls.py:\n\n```\n\
    ```python\nimport time\n\nfrom calendar import month_name\n```\n```\n\nWe are\
    \ going to define two new functions, month_timeline and month, in order to make\
    \ the sidebar.\n\n![](img/e016e192a91ffc1a9e474690a590742f_148_2.png)\n\n# 19\
    \ Start to define month_timeline\n\nFirst we need to get all the information from\
    \ the posts:\n\n```\n```python\ndef month_timeline():\n    year, month = time.localtime()[:2]\n\
    \    begin = Post.objects.order_by('pub_date')[0]\n    month_begin = begin.pub_date.month\n\
    \    year_begin = begin.pub_date.year\n    month_list = []\n```\n```\n\nThe `[0]`\
    \ makes sure we only get the time information we need.\n\n![](img/e016e192a91ffc1a9e474690a590742f_148_3.png)\n\
    \n# 20 Finish your definition\n\nNow we will order the posts by month and year\
    \ starting from our first month.\n\n```\n```python\n    for y in range(year, year_begin-1,\
    \ -1):\n        start, end = 12, 0\n        if y == year: start = month\n    \
    \    if y == year_begin: end = month_begin-1\n        for m in range(start, end,\
    \ -1):\n            month_list.append((y, m, month_name[m]))\n    return month_list\n\
    ```\n```\n\n# 21 Return to reader\n\nWith the list organised, we can now define\
    \ month so we can display it on the blog:\n\n```\n```python\ndef month(request,\
    \ year, month):\n    post_list = Post.objects.filter(pub_date__year=year, pub_date__month=month)\n\
    \    return render_to_response('blog/index.html', dict(sidebar_list=post_list,\
    \ month_list=timeline()))\n```\n```\n\nNow we need to link it up to the index\
    \ template.\n\n# 22 Finalise your sidebar definition\n\nEdit the return command\
    \ on the index function to include the sidebar information:\n\n```\n```python\n\
    return render_to_response('blog/index.html', dict(post_list=post_list, sidebar_list=post.object_list,\
    \ month_list=month.timeline()))\n```\n```\n\nThen add this line to urls.py in\
    \ myblog so a month page can be rendered: `url(r'^myblog/month/(?\\d+)/(\\d+)/$',\
    \ 'blog.urls.month')`.\n\nAll we need to do now is display the information on\
    \ the web.\n\n# 23 Sidebar on the web\n\nGo to the index template. First of all,\
    \ change the first line of the post loop to `for`:\n\n```\n```html\n{% for post\
    \ in sidebar_list %}\nSimple enough. Now we need to add the sidebar information:\n\
    {% for month in month_list %}\n    <p><a href=\"{{% url blog.urls.month month.0\
