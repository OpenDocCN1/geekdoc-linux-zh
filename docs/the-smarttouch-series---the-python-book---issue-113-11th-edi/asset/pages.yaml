- pgno: 161
  md: "![](img/e016e192a91ffc1a9e474690a590742f_161_0.png)\n\n# Robot arm movements\n\
    \nUse the list below to reference the various movements of the robot. The text\
    \ after each # is a comment and used to identify the command.\n\n+   - MoveArm(1,0,1,0,1)\
    \  #rotate base anti-clockwise\n- MoveArm(1,0,2,0,1)  #rotate base clockwise\n\
    - MoveArm(1,0,4,0,0)  #shoulder up\n- MoveArm(1,0,8,0,0)  #shoulder down\n- MoveArm(1,0,16,0,0)\
    \  #elbow up\n- MoveArm(1,0,32,0,0)  #elbow down\n- MoveArm(1,0,4,0,0)  #wrist\
    \ up\n- MoveArm(1,0,8,0,0)  #wrist down\n- MoveArm(1,0,2,0,0)  #grip open\n- MoveArm(1,0,1,0,0)\
    \  #grip closed\n- MoveArm(1,0,0,1,1)  #light on\n- MoveArm(1,0,0,0,1)  #light\
    \ off\n\n# 08 Name the USB device\n\nNow use Python to find the USB arm. On the\
    \ next line down, create a variable called RoboArm to store the information about\
    \ the location of the robotic arm – this is basically which USB port it is plugged\
    \ into. Now name the device that is plugged into the Raspberry Pi USB port. To\
    \ do this, enter the ID Vendor number and the product ID details to search for\
    \ the arm. If you are using a different arm or model number, you will need to\
    \ locate these two details and replace them in the line of code.\n\n```\nRoboArm=usb.core.find(idVendor=0x1267,idProduct=0x0000)\n\
    ```\n\n# 09 Find the robotic arm\n\nThe next step is to search for the robotic\
    \ arm to ensure that it is plugged into the USB port and also turned on. This\
    \ uses a simple conditional, an if statement, to make this check. If the arm is\
    \ not found, then an error message is returned to the Python window to let you\
    \ know to plug it in, turn it on, or both! Note the second line of the code is\
    \ indented.\n\n```\nif RoboArm is None:\n    raise ValueError(\"Arm not found\"\
    )\n```\n\n![](img/e016e192a91ffc1a9e474690a590742f_161_1.png)\n\n# 10 Create a\
    \ function, part 1\n\nYou need a small delay between each movement of the arm.\
    \ Create a new variable called Duration and assign a value of 1, 1. On the next\
    \ line down, create a function that includes the duration value you just created,\
    \ and also a code to stop the arm moving. On line 3, add the code to transfer\
    \ the movement commands to the USB port and relay them to the robotic arm. Note\
    \ again that this line is indented.\n\n```\nDuration = 1\ndef MoveArm(Duration,\
    \ ArmCmd):\n    #start the movement\n    RoboArm.ctrl_transfer(0x40,6,0x100,0,ArmCmd,1000)\n\
    ```\n\n# 11 Create a function, part 2\n\nOn the next line down, add a small duration\
    \ time to set a limit for the duration of the action. In this example the duration\
    \ is set to 1, meaning that each movement or action will happen once. You can\
    \ experiment with the duration time by changing the value you set in Step 10.\
    \ After each of the movements occur they need to stop. Use the code ArmCmd=(0,0,0)\
    \ line two, to prepare a code to stop the motors turning and end the movement.\n\
    \n```\n#stop the movement after specified duration\ntime.sleep(Duration)\nArmCmd=(0,0,0)\n\
    ```\n\n![](img/e016e192a91ffc1a9e474690a590742f_161_2.png)"
