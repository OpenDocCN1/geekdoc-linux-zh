    # Creating Windows Short Cuts in the Start Menu


    There are two variables that control the short cuts that are created in the Windows
    Start menu by NSIS. The variables contain lists of pairs, and must have an even
    number of elements to work correctly. The first is CPACK_PACKAGE_EXECUTABLES,
    it should contain the name of the executable followed by the name of the short
    cut. For example in the case of CMake, the executable is called cmake-gui, but
    the shortcut is named “CMake”. CMake does the following to create that short cut:


    ```

    set (CPACK_PACKAGE_EXECUTABLES "cmake-gui" "CMake" )

    ```


    The second is CPACK_NSIS_MENU_LINKS. This variable contains arbitrary links into
    the install tree, or to external web pages. The first of the pair is the existing
    source file or location, and the second is the name that will show up in the Start
    menu. To add a link to the help file for cmake-gui and a link to the CMake web
    page add the following following:


    ```

    set "doc/cmake-${VERSION_MAJOR}.${VERSION_MINOR}/cmake-gui.html" "cmake-gui Help"
    "http://www.cmake.org" "CMake Web Site" )

    ```


    # Advanced NSIS CPack Options


    In addition to the variables already discussed, CPack provides a few variables
    that are directly configured into the NSIS script file. These can be used to add
    NSIS script fragments to the final NSIS script used to create the installer. They
    are as follows:


    +   * CPACK_NSIS_EXTRA_INSTALL_COMMANDS

    Extra commands used during install.


    +   * CPACK_NSIS_EXTRA_UNINSTALL_COMMANDS

    Extra commands used during uninstall.


    +   * CPACK_NSIS_CREATE_ICONS_EXTRA

    Extra NSIS commands in the icon section of the script.


    +   * CPACK_NSIS_DELETE_ICONS_EXTRA

    Extra NSIS commands in the delete icons section of the script.'
