    # Importing Targets


    Imported targets are used to convert files outside of the project on disk into
    logical targets inside a CMake project. They are created using the IMPORTED option
    to the add_executable and add_library commands. No build files are generated for
    imported targets. They are used simply for convenient, flexible reference to outside
    executables and libraries. Consider the following example which creates and uses
    an IMPORTED executable target:


    ```

    add_executable (generator IMPORTED) # 1

    set_property (TARGET generator PROPERTY

    IMPORTED_LOCATION "/path/to/some_generator") # 2


    add_custom_command (OUTPUT generated.c

    COMMAND generator generated.c) # 3


    add_executable (myexe src1.c src2.c generated.c)

    ```


    Line #1 creates a new CMake target called generator. Line #2 tells CMake the location
    of the target to import. Line #3 refers the target in a custom command. Once CMake
    is run the build system will contain a line such as


    ```

    /path/to/some_generator /project/binary/dir/generated.c

    ```'
