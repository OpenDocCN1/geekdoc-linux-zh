    basic syntax of a CMakeLists.txt file and key concepts of CMake have already been
    discussed in chapters 2 and 3. This chapter will expand on those concepts and
    introduce a few ones.


    # 4.1 CMake Syntax


    CMakeLists files follow a simple syntax consisting of comments, commands, and
    white space. A comment is indicated using the # character and runs until the end
    of the line. A command consists of the command name, opening parenthesis, space
    separated arguments and a closing parenthesis. All white space (space, line feeds,
    tabs) are ignored except for arguments. Anything within set of double quotes is
    treated as one argument as is typical for most languages. The backslash can used
    to escape characters preventing the normal interpretation of them. The subsequent
    examples in this chapter will help to clear some of these syntactic issues. You
    might wonder why CMake decided to have its own language instead of using one such
    as Python, Java, or Tcl. The main reason is that we did not want to make CMake
    require an additional tool to run. By requiring one of the other languages all
    users of CMake would be required to have that language installed, and potentially
    a specific version of that language. This is on top of the'
