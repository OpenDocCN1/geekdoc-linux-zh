  md: '# Cross Compiling with CMake


    Cross compiling a piece of software means that the software is built on one system
    but intended to run on a different system. The system which is used to build the
    software will be called the build host, the system for which the software is built
    will be called the target system or target platform. The target system usually
    runs a different operating system (or none at all) and/or runs on different hardware.
    A typical use case is software development for embedded devices like network switches,
    mobile phones or engine control units. In these cases the target platform doesn''t
    have is not able to run the required software development environment.


    Starting with CMake 2.6.0 cross compiling is fully supported by CMake, ranging
    from cross compiling from Linux to Windows, cross compiling for supercomputers
    through to cross compiling for small embedded devices without an operating system
    (OS).


    Cross compiling has several consequences for CMake;


    +   * CMake cannot automatically detect the target platform

    * CMake cannot find libraries and headers in the default system directories

    * executables built during cross compiling cannot be executed


    Cross compiling support doesn''t mean that all CMake-projects can be magically
    compiled out-of-the-box (some are), but that CMake separates between information
    about the build platform and target platform and gives the user mechanisms to
    solve cross compiling issues without additional requirements such as running virtual
    machines, etc.'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# 126 Cross Compiling with CMake


    To support cross compiling for a specific software project, CMake must be told
    about the target platform via a so called toolchain file. The CMakeLists.txt may
    have to be adjusted so are aware that the build platform may have different properties
    to the target platform, and it has to deal with the cases where a compiled executable
    tries to execute on the build host.


    # 8.1 Toolchain Files


    In order to use CMake for cross compiling, a CMake file that describes the target
    platform has to be created, called the "toolchain file". This file tells CMake
    everything it needs to know about the target platform. Here is an example that
    uses the MinGW cross compiler for Windows under Linux, the contents will be explained
    by line by afterwards:


    ```

    # the name of the target operating system

    set (CMAKE_SYSTEM_NAME Windows)


    # which compilers to use for C and C++

    set (CMAKE_C_COMPILER i586-mingww32msvc-gcc)

    set (CMAKE_CXX_COMPILER i586-mingww32msvc-g++)


    # where is the target environment located

    set (CMAKE_FIND_ROOT_PATH /usr/i586-mingww32msvc

    /home/alex/mingw-install)


    # adjust the default behavior of the FIND_XXX() commands

    # search programs in the host environment

    set (CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)


    # search headers and libraries in the target environment

    set (CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)

    set (CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)

    ```


    Assuming that this file is saved with the name TC-mingw.cmake in your home directory,
    instruct CMake to use this file by setting the CMAKE_TOOLCHAIN_FILE variable:


    ```

    ~/src cd build

    ~/src/build$ cmake -DCMAKE_TOOLCHAIN_FILE=~/TC-mingw.cmake

    ...

    ```


    CMAKE_TOOLCHAIN_FILE has to be specified only on the initial CMake run, after
    that the results are reused from the CMake cache. You don''t need to write a separate
    toolchain file for every piece of software you want to build. The toolchain files
    are per target platform, if we'
