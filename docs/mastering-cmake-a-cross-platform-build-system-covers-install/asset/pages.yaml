    CTest is run from your build tree. It will run all the tests found in the current
    directory as well as any subdirectories listed in the CTestfile.cmake. For each
    test that is run CTest will report if it passed and how long it took to run the
    test.


    The CTest executable includes some handy command line options to make testing
    a little easier. We will start by looking at the options you would typically use
    from the command line.


    ```

    -R <regex> Run tests matching regular expression

    -E <regex> Exclude tests matching regular expression

    -L <regex> Run tests with labels matching the regex

    -LE <regex> Run tests with labels not matching regexp

    -C <config> Choose the configuration to test

    -V,--verbose Enable verbose output from tests.

    -N,--show-only Disable actual execution of tests.

    -I [Start,End,Stride,test,#] [Test file] Run specific tests by range and number.

    -H Display a help message

    ```


    The -R option is probably the most commonly used. It allows you to specify a regular
    expression, only tests with names matching the regular expression will run. Using
    the -R option with the name (or part of the name) of a test is a quick way to
    run a single test. The -E option is similar except that it excludes all tests
    matching the regular expression. The -L and -LE options are similar to -R and
    -E except that they apply to labels that were set using the set_property command
    described in section 10.3. The -C option is mainly for IDE builds where you might
    have multiple configurations, such as Release and Debug in the same tree. The
    argument following the -C determines which configuration will be tested. The -V
    argument is useful when you are trying to determine why a test is failing,-V CTest
    will print the command line used to run the test as well as any output from that
    test. The -V option can be used with any invocation of CTest to provide more verbose
    output. The -N option is useful if you want to see what tests CTest would run
    without actually running them.


    Running the tests and making sure they pass before committing any changes to the
    software is a sure way to improve your software quality and development process.
    Unfortunately, for large projects the tests and time required to run them may
    be prohibitive. In these situations the -I option of CTest can be used. The -I
