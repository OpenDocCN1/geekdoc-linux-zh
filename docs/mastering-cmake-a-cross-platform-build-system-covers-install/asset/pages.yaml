  md: '# Tutorials


    This chapter provides a step by step tutorial that covers common build system
    issues CMake helps address. Many of these topics have been introduced in prior
    chapters as separate issues but seeing how they all work together in an example
    project can be very helpful. This tutorial can be found in the Tests/Tutorial
    directory of the CMake source tree. Each step has its own subdirector containing
    a complete copy of the tutorial for that step.


    # 12.1 A Basic Starting Point (Step 1)


    The most basic project is an executable built from source code files. For simple
    projects two line CMakeLists file is all that is required. This will be the starting
    point for our tutorial. The CMakeLists file looks like:


    ```

    cmake_minimum_required (2.6)

    project (Tutorial)

    add_executable(Tutorial tutorial.cxx)

    ```


    Note that this example uses lower case commands in the CMakeLists file. Upper,
    lower, and mixed case commands are supported by CMake. The source code for tutorial.cxx
    will compute the square root of a number and the first version of it is very simple,
    as follows:'
