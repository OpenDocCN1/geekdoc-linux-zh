    # Dependency Analysis


    CMake has powerful built-in dependency analysis capabilities for C and C++ source
    code files. CMake has limited support for Fortran and Java dependencies. Since
    Integrated Development Environments (IDEs) support and maintain dependency information,
    CMake skips this step for those build systems. However, Makefiles with a make
    program do know how to automatically compute and keep dependency information up-to-date.
    For these builds, CMake automatically computes dependency information for C, C++
    and Fortran files. By the generation and maintenance of these dependencies are
    automatically done by CMake. Once a project is initially configured by CMake,
    users only need to run make, and CMake does the rest of the work. CMake''s dependencies
    fully support parallel builds for multiprocessor systems.


    Although users do not need to know how CMake does this, it may be useful to look
    at the dependency information files for a project. This information for target
    is stored in four files depend.make, flags.make, build.make, and DependInfo.cmake.
    depend.make stores the dependency for all the object files in the directory. flags.make
    compiles the flags for the source files of this target. If they change then the
    files will be recompiled. DependInfo.cmake is used to keep the dependency'
