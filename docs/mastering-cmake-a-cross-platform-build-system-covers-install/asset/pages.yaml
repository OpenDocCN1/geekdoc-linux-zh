  md: "# Running Executables Built in the Project\n\nto the appropriate values for\
    \ the target system. This file can then be used to preload the CMake cache by\
    \ using the -O option in cmake:\n\n```\nsrc/build/ $ cmake -C ~/TryRunResults-MyProject-eldk-ppc.cmake\
    \ .\n```\n\nYou do not have to use the other CMake options again, they are now\
    \ in the cache. This you can use MyProjectTryRunResults-eldk-ppc.cmake in multiple\
    \ build trees, and it could be distributed with your project so that it is easier\
    \ for other users to cross compile.\n\n# 8.3 Running Executables Built in the\
    \ Project\n\nIn cases it is necessary that during a build an executable is invoked\
    \ that was built earlier in the same build, this is usually the case for code\
    \ generators and similar tools. This does not work when compiling, as the executables\
    \ are built for the target platform and cannot run on the build host (without\
    \ the use of virtual machines, compatibility layers, emulators, etc.). With CMake\
    \ these programs are created using add_executable, and executed with add_custom_command\
    \ or add_custom_target. The following three options can be used to support these\
    \ executables with CMake. The old version of the CMake code could look something\
    \ like this:\n\n```\nadd_executable (mygen gen.c)\nget_target_property (mygenLocation\
    \ mygen LOCATION)\nadd_custom_command (\n    OUTPUT \"${CMAKE_CURRENT_BINARY_DIR}/generated.h\"\
    \n    COMMAND $${mygenLocation}/${mygenLocation}\n    -o \"${CMAKE_CURRENT_BINARY_DIR}/generated.h\"\
    \n )\n```\n\nNow we will show how this file can be modified so that it works when\
    \ cross compiling. The basic idea is that the executable is built only when making\
    \ a native build for the build host and then exported as an executable to a CMake\
    \ script. This file is then included when cross compiling, and the executable\
    \ for the executable mygen will be loaded. Imported target with the same name\
    \ as the original target will be created. Since CMake 2.6 add_custom_command recognizes\
    \ target names as executables, so for the command in add_custom_command simply\
    \ the target name can be used, it is not necessary to use the LOCATION property\
    \ to obtain the path of the executable:\n\n```\nif (CMAKE_CROSSCOMPILING)\n  \
    \  find_package (MyGen)\nendif\n\nif (NOT CMAKE_CROSSCOMPILING)\n```"
