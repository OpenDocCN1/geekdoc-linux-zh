    divided into five main components. Near the top you will find a set of links that
    allow you to see previous dashboards as well as links to project pages as the
    bug tracker, documentation etc.


    Below that you will find groups of results. Typically that you will find Nightly,
    Experimental, Continuous, Coverage, and Dynamic Analysis (see Figure 31). The
