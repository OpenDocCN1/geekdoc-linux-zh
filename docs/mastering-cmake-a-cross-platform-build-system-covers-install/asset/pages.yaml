    # 9.5 CPack for Cygwin Setup


    Cygwin (http://www.cygwin.com/) is a Linux-like environment for Windows that consists
    of a run time DLL and a collection of tools. To add tools to the official cygwin
    setup program is used. The setup tool has very specific layouts for the source
    and binary trees that are to be included. CPack can create the source and binary
    files completely bzipped that are uploaded to the cygwin mirror sites. You must
    of course have your package accepted by the cygwin community before that is done.
    Since the layout of the package is more restrictive than other packaging tools,
    you may have to change some of the install options for your project.


    The cygwin setup program requires that all files be installed into /usr/bin, /usr/share/project-version,
    /usr/share/man and /usr/share/doc/package-version. The Cygwin CPack generator
    will automatically add the /usr to the install directory for the project. The
    project must install everything into /share and /bin, and CPack will add the /usr
    prefix automatically.


    Cygwin also requires that you provide a shell script that can be used to create
    the package from the sources. Any Cygwin specific patches that are required for
    the package must also be provided in a diff file. CMake''s configure_file command
    can be used to create both of these files for a project. Since CMake is a package
    generator, the CMake code used to configure CMake for the Cygwin CPack generators
    is as follows:'
