  md: 'CMake keeps policy settings on a stack, so changes made by cmake_policy command
    affect only the top of the stack. A new entry on the policy stack is managed automatically
    for each subdirectory to protect its parents and siblings. CMake also manages
    a new entry for scripts loaded by include() and find_package() commands when invoked
    with the NO_POLICY_SCOPE option (see also policy CMP0011). The cmake_policy command
    provides an interface to manage custom entries on the policy stack:


    ```

    cmake_policy(PUSH)

    cmake_policy(POP)

    ```


    Each PUSH must have a matching POP to erase any changes. This is useful to make
    temporary changes to policy settings.


    Functions and macros record policy settings when they are created and used if
    the function or macro implementation sets policies, the changes automatically
    propagate up through callers until they reach the closest policy stack entry.


