  md: '# 10.9 Setting up Automated Dashboard Clients


    CTest has a built-in scripting mode to help make the process of setting up dashboard
    clients even easier. CTest scripts will handle most of the common tasks and options
    that CTest -D Night does not. The dashboard script is written using CMake syntax
    and mainly involves setting different variables or options, or creating an elaborate
    procedure, depending on the complexity of testing. Once you have written the script
    you can run the nightly dashboard on Windows, Mac OS X or UNIX systems as follows:


    ```

    ctest -S MyScript.cmake

    ```


    First we will consider the most basic script you can use, and then we will cover
    the different options you can make use of. There are four variables that you must
    always set in your scripts. The first two variables are the names of the source
    and binary directories on disk, CTEST_SOURCE_DIRECTORY and CTEST_BINARY_DIRECTORY.
    These should be fully specified paths. The next variable, CTEST_COMMAND, specifies
    which CTest command to use for running the dashboard. This may seem a bit confusing
    at first; the actual running of task. The -S option of CTest is provided to do
    all the setup and customization for a dashboard, but it invokes another invocation
    of CTest -D. Basically the CTest script does what it needs to setup the dashboard,
    it invokes CTest -D to generate the results. You can adjust the value of CTEST_COMMAND
    to control what type of dashboard to generate (Nightly, Experimental, Continuous)
    as well as to pass other options to the internal CTest process such as -l , to
    run every 7th task. To refer to the task that is running the script, use the variable:
    CTEST_EXECUTABLE_NAME. The last required variable is CTEST_CMAKE_COMMAND which
    specifies the full path to the cmake executable that will be used to configure
    the dashboard. To refer to the CMake that corresponds to the CTest command running
    the script, use the variable: CMAKE_EXECUTABLE_NAME. The CTest script does an
    initial configuration with CMake in order to generate theCTestConfig.cmake file
    that CTest will use for the dashboard. The following example demonstrates the
    use of these four variables and is an example of the simplest script you can have.


    ```

    # these are the source and binary directories on disk

    set (CTEST_SOURCE_DIRECTORY C:/martink/test/CMake)

    set (CTEST_BINARY_DIRECTORY C:/martink/test/CMakeBin)


    # which CTest command to use for running the dashboard

    set (CTEST_COMMAND

    "\${CTEST_EXECUTABLE_NAME}" -D Nightly")


    # what cmake command to use for configuring this dashboard

    set (CTEST_CMAKE_COMMAND

    ```'
