  md: "# FeatureSummary\n\nIf no PREFIX, EP_PREFIX, or EP_BASE is specified then the\
    \ default is to set PREFIX to \\<name>-prefix. Relative paths are interpreted\
    \ with respect the build directory corresponding to the source directory in which\
    \ ExternalProject_Add is invoked.\n\nIf SOURCE_DIR is explicitly set to an existing\
    \ directory the project will be built from it. Otherwise a download step must\
    \ be specified using one of the DOWNLOAD_COMMAND, CVS *, SVN *, or URL options.\
    \ The URL option may refer locally to a directory or source tarball, or refer\
    \ to a remote tarball (e.g. http://...src.tgz).\n\nThe 'ExternalProject_Add_Step'\
    \ function adds a custom step to an external project:\n\n```\nExternalProject_Add_Step(\n\
    \  <name> <step>             # Names of project and custom step\n  [COMMAND cmd..]\
    \           # Command line invoked by this step\n  [COMMENT \"text...\"]     \
    \ # Text printed when step executes\n  [DEPENDENCIES steps...]     # Steps on\
    \ which this step depends\n  [DEPENDERS steps...]      # Steps that depend on\
    \ this step\n  [DEPENDS files...]        # Files on which this step depends\n\
    \  [ALWAYS 1]                 # No stamp file, step always runs\n  [WORKING_DIRECTORY\
    \ dir] # Working directory for command\n)\n```\n\nThe command line, comment, and\
    \ working directory of every standard and custom step is processed to replace\
    \ <SOURCE_DIR>, <BINARY_DIR>, <INSTALL_DIR>, and <TMP_DIR> with corresponding\
    \ property values.\n\nThe 'ExternalProject_Get_Property' function retrieves external\
    \ project properties:\n\n```\nExternalProject_Get_Property(<name> [propl [prop2\
    \ [...]])\n```\n\nIt stores property values in variables of the same name. Property\
    \ names correspond to the keyword argument names 'ExternalProject_Add'.\n\n**FeatureSummary**:\
    \ Macros for generating a summary of enabled/disabled features\n\nPRINT_ENABLED_FEATURES()\
    \ - Print a summary of all enabled features. By default successful FIND_PACKAGE\
    \ calls will appear here, except the ones which used the QUIET keyword. Additional\
    \ features can be added by appending an entry to the global ENABLED_FEATURES property.\
    \ If SET_FEATURE_INFO() is used for that feature, the output will be much more\
    \ informative."
