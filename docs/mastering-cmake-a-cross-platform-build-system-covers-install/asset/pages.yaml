    # Logging


    CDash supports internal logging mechanism using the error_log() function from
    PHP. Most of the critical SQL queries are logged. By default the CDash log file
    is located in the backup directory under the name cdash.log. The location of the
    log file can be modified by changing the variable in the config.local.php configuration
    file.


    ```

    $CDASH_BACKUP_DIRECTORY=''/var/temp/cdashbackup/log'';

    ```


    The log file can be accessed directly from CDash if the log file is in the standard
    location:


    +   1. Log into CDash as administrator.

    2. Click on [CDash logs] in the administration section.

    3. Click on cdash.log to see the log file.


    Note that CDash does not perform any log rotation.


    # Test Timing


    CDash supports checks on the duration of tests. CDash keeps the current weighted
    average of the mean and standard deviation for the time each test to run in the
    database. In order to keep the computation as efficient as possible, the following
    formula is used, which only involves the previous build.


    ```

    newMean = (1-alpha)*oldMean + alpha*currentTime


    newSD = sqrt ((1-alpha)*SD*SD + alpha*(currentTime-newMean)* (currentTime-newMean))

    ```


    A test is defined as failing based on the following logic:


    ```

    if previousSD < thresholdSD then previousSD = thresholdSD

    if currentTime > previousMean+multiplier*previousSD then fail

    ```


    It should be noted that alpha defines the current “window” for the computation.
    By default alpha is set to 0.3.'
