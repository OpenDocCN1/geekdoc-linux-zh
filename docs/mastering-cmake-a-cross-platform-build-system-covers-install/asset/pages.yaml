    \ environment,\n# search for programs in the host environment\nset (CMAKE_FIND_ROOT_PATH_MODE_NEVER)\n\
    set (CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)\nset (CMAKE_FIND_ROOT_PATH_MODE_INCLUDE\
    \ ONLY)\n```\n\nThe toolchain files can be located anywhere, but it is a good\
    \ idea to put them in a central place so they can be reused in multiple projects.\
    \ We will save this file as ~/Toolchains/Toolchain-eldk-mips4K.cmake. The variables\
    \ mentioned above are set here: CMAKE_SYSTEM_NAME, the C/C++ compilers, CMAKE_FIND_ROOT_PATH\
    \ to specify where libraries and headers for the target environment are located.\
    \ The find modes are also set so that libraries and headers are searched for in\
    \ the target environment, whereas programs are searched for the host environment\
    \ only. Now we will compile the hello world project from Chapter 2:\n\n```\nproject\
    \ (Hello)\nadd_executable (Hello Hello.c)\n```\n\nRun CMake, this time telling\
    \ to use the toolchain file from above:\n\n```\nmkdir Hello-eldk-mips\ncd Hello-eldk-mips\n\
    cmake -DCMAKE_TOOLCHAIN_FILE=~/Toolchains/Toolchain-eldk-\nmips4K.cmake ..\nmake\
    \ VERBOSE=1\n```\n\nThis should give you an executable that can run on the target\
