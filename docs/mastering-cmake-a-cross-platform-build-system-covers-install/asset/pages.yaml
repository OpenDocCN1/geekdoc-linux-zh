    add_executable (myexe src.c)

    target_link_libraries (myexe foo)

    ```


    and the executable will be linked to the library foo exported and installed by
    the original project.


    Any number of target installations may be associated with the same export name.
    The export names are considered global so any directory may contribute a target
    installation. Only one call to the install (EXPORT) command is needed to install
    an import file that references all targets. Both of the examples above may be
    combined into a single export file, even if they are in different subdirectories
    of the project as shown in the code below.


    ```

    # CMakeLists.txt

    add_executable (generator generator.c)

    install (TARGETS generator DESTINATION lib/myproj/generators

    EXPORT myproj-targets)


    # CMakeLists.txt

    add_library (foo STATIC fool.c)

    install (TARGETS foo DESTINATION lib EXPORTS myproj-targets)


    # Top CMakeLists.txt

    add_subdirectory (A)

    add_subdirectory (B)

    install (EXPORT myproj-targets DESTINATION lib/myproj)

    ```


    Typically projects are built and installed before being used by an outside project.
    However in some cases it is desirable to export targets directly from a build
    tree. The targets may be used by an outside project that references the build
    tree with no installation involved. The export command is used to generate a file
    exporting targets from a project build tree. For example, the code


    ```

    add_executable (generator generator.c)

    export (TARGETS generator FILE myproj-exports.cmake)

    ```


    will create a file in the project build tree myproj-exports.cmake that contains
    the required code to import the target. This file may be loaded by an outside
    project that is aware of the project build tree in order to use the executable
    to generate a source file. An example application of this feature is for building
    a generator executable on a host platform when compiling. The project containing
    the generator executable may be built on the host platform and then the project
    that is cross-compiled for another platform may load.'
