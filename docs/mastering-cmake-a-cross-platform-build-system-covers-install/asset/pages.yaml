    # CTest Command Line Options


    ```

    ctest [options]

    ```


    The "cest" executable is the CMake test driver program. CMake-generated build
    trees created for projects that use the ENABLE_TESTING and ADD_TEST commands have
    testing support. This program will run the tests and report results.


    -C <cfg>, --build-config <cfg>: Choose configuration to test.


    Some CMake-generated build trees can have multiple build configurations in the
    same tree. This option can be used to specify which one should be tested. Example
    configurations are "Debug" and "Release".


    -V, --verbose: Enable verbose output from tests.


    Test output is normally suppressed and only summary information is displayed.
    This option will show all test output.


    -VV, --extra-verbose: Enable more verbose output from tests.


    Test output is normally suppressed and only summary information is displayed.
    This option will show even more test output.


    --debug: Displaying more verbose internals of CTest.


    This feature will result in large number of output that is mostly useful for debugging
    dashboard problems.


    --output-on-failure: Output anything outputted by the test program if the test
    should fail. This option can also be enabled by setting the environment variable
    CTEST_OUTPUT_ON_FAILURE'
  merge: -1
  pgno: 292
- img_proc: true
  md: '# CTest Command Line Options


    -F: Enable failover.


    This option allows ctest to resume a test set execution that was previously interrupted.
    If no interruption occurred, the -F option will have no effect.


    -Q,--quiet: Make ctest quiet.


    This option will suppress all the output. The output log file will still be generated
    if the --output-log is specified. Options such as --verbose, --extra-verbose,
    and --debug are ignored if --quiet is specified.


    -O <file>, --output-log <file>: Output to log file


    This option tells ctest to write all its output to a log file.


    -N,--show-only: Disable actual execution of tests.


    This option tells ctest to list the tests that would be run but not actually run
    them. Useful in conjunction with the -R and -E options.


    -L <regex>, --label-regex <regex>: Run tests with labels matching regular expression.


    This option tells ctest to run only the tests whose labels match the given regular
    expression.


    -R <regex>, --tests-regex <regex>: Run tests matching regular expression.


    This option tells ctest to run only the tests whose names match the given regular
    expression.


    -E <regex>, --exclude-regex <regex>: Exclude tests matching regular expression.


    This option tells ctest to NOT run the tests whose names match the given regular
    expression.


    -LE <regex>, --label-exclude <regex>: Exclude tests with labels matching regular
    expression.


    This option tells ctest to NOT run the tests whose labels match the regular expression.


    -D <dashboard>, --dashboard <dashboard>: Execute dashboard test


    This option tells ctest to perform act as a Dart client and perform a dashboard
    test. All tests are <Mode><Test>, where Mode can be Experimental, Nightly, and
    Continuous, and Test can be Start, Update, Configure, Build, Test, Coverage, and
    Submit.


    -M <model>, --test-model <model>: Sets the model for a dashboard


    This option tells ctest to act as a Dart client where the TestModel can be Experimental,
    Nightly, and Continuous. Combining -M and -T is simpel to -D'
  merge: -1
  pgno: 293
- img_proc: true
  md: '# -T <action>, --test-action <action>: Sets the dashboard action to perform


    This option tells cest to act as a Dart client and perform some action such as
    start, build, test cest. Combining -M and -T is similar to -D


    --track <track>: Specify the track to submit dashboard to default one. By default,
    the dashboard is submitted to Nightly, Experimental, or Continuous track, but
    by specifying this option, the track can be arbitrary.


    -S <script>, --script <script>: Execute a dashboard for a configuration

    This option tells cest to load in a configuration script which sets a number of
    parameters as the binary and source directories. Then cest will do what is required
    to create and run a dashboard. This option basically sets up a dashboard and then
    runs cest -D with the appropriate options.


    -SP <script>, --script-new-process <script>: Execute a dashboard for a configuration

    This option does the same operations as -S but it will do them in a seperate process.
    This is primarily useful in cases where the script may modify the environment
    and you do not want the modified environment to impact other -Scripts.


    -I [Start,End,Stride,test#,test#|Test file], --tests-information: Run a specific
    number of tests by number.

    This option causes cest to run tests starting at Start number, ending at End,
    and incrementing by Stride. Any additional numbers after Stride are considered
    individual numbers. Start, End,or stride can be empty. Optionally a file can be
    given that contains the same syntax as the command line.


    -U, --union: Take the Union of -I and -R

    When both -R and -I are specified by default the intersection of tests are run.
    By specifying -U the union of tests is run instead.


    --max-width <width>: Set the max width for a test name to show in the output

    Set the maximum width for each test name to show in the output. This allows the
    user to widen the output to avoid clipping the test name which can be very annoying.'
