  md: "# CPACK_INSTALL_COMMANDS\n\nExtra commands to install components.\n\n# CPACK_INSTALL_DIRECTORIES\n\
    \nExtra directories to install.\n\nComponent-specific installation allows users\
    \ to select specific sets of components to install during the install process.\
    \ Installation components are identified by the COMPONENT argument of CMake's\
    \ INSTALL commands, and should be further described by the following CPack commands:\n\
    \n```\n```cpack_add_component - Describes a CPack installation component named\
    \ by the COMPONENT argument to a CMake INSTALL command.\n\ncpack_add_component(compname)\n\
    \  [DISPLAY_NAME name]\n  [DESCRIPTION description]\n  [HIDDEN | REQUIRED | DISABLED]\n\
    \  [GROUP group]\n  [DEPENDS comp1 comp2 ...]\n  [INSTALL TYPES type1 type2 ...]\n\
    \  [DOWNLOADED]\n  [ARCHIVE FILE filename])\\```\n```\n\nThe cmake_add_component\
    \ command describes an installation component, which the user can opt to install\
    \ or remove as part of the graphical installation process. compname is the name\
    \ of the component, as provided to the COMPONENT argument of one or more CMake\
    \ INSTALL commands.\n\nDISPLAY_NAME is the displayed name of the component, used\
    \ in graphical installers to display the component name. This value can be any\
    \ string.\n\nDESCRIPTION is an extended description of the component, used in\
    \ graphical installers to give the user additional information about the component.\
    \ Descriptions can span multiple lines using \"\\n\" as the line separator. Typically,\
    \ these descriptions should be no more than a few lines long.\n\nHIDDEN indicates\
    \ that this component will be hidden in the graphical installer, so that the user\
    \ cannot directly change whether it is installed or not.\n\nREQUIRED indicates\
    \ that this component is required, and therefore will always be installed. It\
    \ will be visible in the graphical installer, but it cannot be unselected. (Typically,\
    \ required components are shown greyed out)."
  merge: -1
