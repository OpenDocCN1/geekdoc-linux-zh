- img_proc: true
  md: '# 442


    # Appendix F


    This policy determines whether the list command will ignore empty elements in
    the list. CMake 2.4 and below list commands ignored all empty elements in the
    list. For example, a;b;c would have length 3 and not 4. The OLD behavior for this
    policy is to ignore empty elements in a list. The NEW behavior for this policy
    is to correctly count empty elements in a list.


    This policy was introduced in CMake version 2.6.0. CMake version 2.8.0-rc2 warns
    when the policy is not set and uses OLD behavior. Use the cmake_policy command
    to set it to OLD or NEW explicitly.


    CMP0008: Libraries linked by full-path must have a valid library file name.


    In CMake 2.4 and below it is possible to write code like


    ```

    target_link_libraries(myexe /full/path/to/somolib)

    ```


    "somolib" is supposed to be a valid library file name such as "libsomolib.a" or
    "somolib.lib". For Makefile generators produces an error at time because the dependency
    on the path cannot be found. For VS IDE and Xcode generators this to work by accident
    because CMake would always split off the library directory and the linker to search
    for the library name (-lsomolib or somolib.lib). Despite the failure with Makefiles,
    some projects have code that build with VS and/or Xcode. This version of CMake
    prefers to pass the path directly to the native build tool, which will fail in
    this case because it does not name a valid library file.


    This policy determines what to do with full paths that do not appear to a valid
    library file. The OLD behavior for this policy is to split the library name from
    the path and ask the linker to search for it. The NEW behavior for this policy
    is to trust the given path and pass it directly to the native build tool unchanged.


    This policy was introduced in CMake version 2.6.1. CMake version 2.8.0-rc2 warns
    when the policy is not set and uses OLD behavior. Use the cmake_policy command
    to set it to OLD or NEW explicitly.


    CMP0009: FILE GLOB_RECURSE calls should not follow symlinks by default.


    In CMake 2.6.1 and below, FILE GLOB_RECURSE calls would follow through symlinks,
    sometimes coming up with unexpectedly large result sets because of symlinks to
    top level directories that contain hundreds of thousands of files.


    This policy determines whether or not to follow symlinks encountered during a
    FILE GLOB_RECURSE call. The OLD behavior for this policy is to follow the symlinks.
    The NEW behavior for this policy is to follow the symlinks, but only if FOLLOW_SYMLINKS
    is given as an additional argument to the FILE command.'
  merge: -1
  pgno: 436
- img_proc: true
  md: '# CMP0010 commands variable 2.6.2. Explicit


    This policy was introduced in CMake version 2.6.2. CMake version 2.8.0-rc2 warns
    when the policy is not set and uses OLD behavior. Use the cmake_policy command
    to set it to OLD or NEW explicitly.


    # CMP0010: Bad variable reference syntax is an error


    In CMake 2.6.2 and below, incorrect variable reference syntax such as a missing
    close-brace("$FOO") was reported but did not stop processing of CMake code. This
    policy determines whether a valid variable reference is an error. The OLD behavior
    for this policy is to warn about the error, leave the string untouched, and continue.
    The NEW behavior for this policy is to report an error.


    This policy was introduced in CMake version 2.6.3. CMake version 2.8.0-rc2 warns
    when the policy is not set and uses OLD behavior. Use the cmake_policy command
    to set it to OLD or NEW explicitly.


    # CMP0011: Included scripts do automatic cmake_policy PUSH and POP.


    In CMake 2.6.2 and below, CMake Policy settings in scripts loaded by the include()
    and find_package() commands would affect the includer. Explicit invocations of
    cmake_policy(PUSH) and cmake_policy(POP) were required to isolate policy changes
    and protect the includer. While some scripts intend to affect the policies of
    their includer, do not. In CMake 2.6.3 and above, include() and find_package()
    by default PUSH and POP an entry on the policy stack after an included script,
    but provide a NO_POLICY_SCOPE option to disable it. This policy determines whether
    or not imply NO_POLICY_SCOPE for compatibility. The OLD behavior for this policy
    is to imply NO_POLICY_SCOPE for include() and find_package() commands. The NEW
    behavior for this policy is to allow the commands to do their default cmake_policy
    PUSH and POP.


    This policy was introduced in CMake version 2.6.3. CMake version 2.8.0-rc2 warns
    when the policy is not set and uses OLD behavior. Use the cmake_policy command
    to set it to OLD or NEW explicitly.


    # CMP0012: The if() command can recognize boolean constants.


    In CMake versions prior to 2.6 the only boolean constants were 0 and 1. Other
    boolean constants such as true, false, yes, no, off, y, n, notfound, ignore (all
    case insensitive) were recognized in some cases but not all. In later versions
    of CMake these values are treated as boolean constants more consistently and should
    be used as variable names. The OLD behavior for this policy is to allow variables
    to have names such as true and dereference them. The NEW behavior for this policy
    is to treat strings like a boolean constant.


    This policy was introduced in CMake version 2.6.5. CMake version 2.8.0-rc2 warns
    when the policy is not set and uses OLD behavior. Use the cmake_policy command
    to set it to OLD or NEW explicitly.'
  merge: -1
  pgno: 437
- img_proc: true
  md: '# CMP0013: Duplicate binary directories are not allowed.


    CMake 2.6.3 and below silently permitted add_subdirectory() calls to create the
    same binary directory multiple times. During build generation files would be written
    and overwritten in the build tree and could lead to strange behavior. CMake 2.6.4
    and above explicitly detect duplicate binary directories. CMake 2.6.4 always considers
    this an error. CMake 2.6.5 and above this policy determines whether or not the
    case is an error. The OLD behavior for this policy is to allow duplicate binary
    directories. The NEW behavior for this policy is to disallow duplicate binary
    directories with an error.


    This policy was introduced in CMake version 2.6.5. CMake version 2.8.0-rc2 warns
    when the policy is not set and uses OLD behavior. Use the cmake_policy command
    to set it to OLD or NEW explicitly.


    # CMP0014: Input directories must have CMakeLists.txt.


    CMake versions before 2.8 silently ignored missing CMakeLists.txt files in directories
    referenced by add_subdirectory() or subdirs(), treating them as if present but
    empty. CMake 2.8.0 and above this policy determines whether or not the case is
    an error. The OLD behavior for this policy is to silently ignore the problem.
    The NEW behavior for this policy is to report an error.


    This policy was introduced in CMake version 2.8.0. CMake version 2.8.0-rc2 warns
    when the policy is not set and uses OLD behavior. Use the cmake_policy command
    to set it to OLD or NEW explicitly.


    # CMP0015: The (set) CACHE mode and option() command make the cache value visible.


    In CMake 2.6 and below the CACHE mode of the set() and the option() command did
    not expose the value from the named cache entry if it was already set in the cache
    and as a local variable. This led to subtle differences between first and later
    configurations because a conflicting local variable would be overwritten only
    when the cache value was first created. For example, the code


    ```

    set(x 1)

    set(before ${x})

    set(x 2 CACHE STRING "X")

    set(after ${x})

    message(STATUS "${before},${after}")

    ```


    would print "1,2" on the first run and "1,1" on future runs.


    CMake 2.8.0 and above prefer to expose the cache value in all cases by removing
    the local variable, but this changes behavior in subtle cases when the local variable
    has a different value than that exposed from the cache. The example above will
    always print'
  merge: -1
