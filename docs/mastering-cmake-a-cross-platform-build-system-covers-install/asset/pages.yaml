  md: '# CPack Installer Commands


    install rules of a project. CPack can work with CMake''s install scripts or with
    external install commands.


    # CPack and CMake install commands


    In most CMake projects, using the cmake install rules will be sufficient to create
    the desired package. By default CPack will run the install rule for the current
    project. However, if you have a more complicated project, you can specify sub-projects
    and install directories with the variable CPACK_INSTALL_CMAKE_PROJECTS. This variable
    should quadruplets of install directory, install project name, install component,
    and install subdirectory. For example, if you had a project with a sub project
    MySub that was compiled into a directory called SubProject, and you wanted to
    install all of its components, you would have this:


    ```

    SET(CPACK_INSTALL_CMAKE_PROJECTS "SubProject;MySub;ALL;/")

    ```


    # CPack and DESTDIR


    By default CPack does not use the DESTDIR option during the installation phase.
    Instead it uses the CMAKE_INSTALL_PREFIX to the full path of the temporary directory
    being used by CPack to stage the installation package. This can be changed by
    setting CPACK_SET_DESTDIR to. If the DESTDIR option is on, CPack will use the
    project''s cache value for CPACK_INSTALL_PREFIX, and set DESTDIR to the temporary
    staging area. This allows absolute paths to be installed under the temporary directory.
    Relative paths are installed into DESTDIR/${project''s CMAKE_INSTALL_PREFIX} where
    DESTDIR is set to the temporary staging area.


    When doing a non-DESTDIR install for packaging, which is the default, any absolute
    paths are installed into absolute directories, and not into the package. Therefore,
    projects that do not use the DESTDIR option, must not use any absolute paths in
    install rules. Conversely, projects that use absolute paths, must use the DESDIR
    option.


    One variable can be used to control the root path into which projects are installed
    into, the CPACK_PACKAGING_INSTALL_PREFIX. By default many of the generators install
    into the directory/usr. That variable can be used to change to any directory,
    including just /.


    # CPack and other installed directories


    It is possible to run other install rules if the project is not CMake based. This
    can be done by using the variables CPACK_INSTALL_COMMANDS, and CPACK_INSTALLED_DIRECTORIES.
    CPACK_INSTALL_COMMANDS are commands that will be run during the installation phase
    of packaging. CPACK_INSTALLED_DIRECTORIES should contain paths of directory and
    subdirectory. The subdirectory can be ''./'' to be installed in the top-level
    directory of the installation. The files in each directory will be copied to the
    corresponding subdirectory of the CPack staging directory and packaged with the
    rest of the files.'
  merge: -1
