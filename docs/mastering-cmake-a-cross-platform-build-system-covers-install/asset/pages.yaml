    \ the appropriate commands to MathFunctions() CMakeLists.file to build the MakeTable\
    \ executable, and then run it as part of the build process. A few commands are\
    \ needed to accomplish this, as shown below.\n\n```\n# first add the executable\
    \ that generates the table\nadd_executable(MakeTable MakeTable.cxx)\n\n# add the\
