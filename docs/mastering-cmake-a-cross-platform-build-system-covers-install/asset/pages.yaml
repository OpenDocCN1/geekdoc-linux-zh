  md: '# 146 Cross Compiling with CMake


    Toolkit. It uses several try_run tests and creates several code generators. When
    running CMake on the project, every try_run command will produce an error message
    and at the end will be a TryRunResults.cmake file in the build directory. You
    need to go through all of the entries of this file and fill in the appropriate
    values. If you are uncertain about the correct result, you can also try to execute
    the test binaries on the real target platform, they are saved in the binary directory.


    VTK contains several code generators, one of which is ProcessShader. These code
    generators are added using add_executable and get_target_property (LOCATION) is
    used to get the locations of the resulting binaries, which are then used in add_custom_command
    or add_custom_target commands. Since the compiled executables cannot be executed
    during the build, the add_executable calls are surrounded by if (NOT CMAKE_COMPILING)
    commands and the executable targets are imported into the project using the add_executable
    command with the IMPORTED option. These import statements are in the file VTKCompileToolsConfig.cmake,
    which does not have to be created manually, but it is created by a native build
    of VTK.


    So in order to cross compile VTK you need


    +   - install a toolchain and create a toolchain for CMake

    - build VTK natively for the build host

    - run CMake for the target platform

    - complete TryRunResults.cmake

    - use the VTKCompileToolsConfig.cmake file from the native build

    - finally build


    So first, build a native VTK for the build host using the standard procedure.


    ```

    cvs -d :server:anonymous@public.kitware.com:/cvsroot/VTK co VT

    cd VTK

    mkdir build-native; cd build-native

    ccmake ..

    make

    ```


    Ensure that all required options are enabled using cmake, e.g. if you need Python
    wrapping for the target platform you must enable Python wrapping in build-native/.
    Once this build has finished, there will be a VTKCompileToolsConfig.cmake file
    in build-native/. If this succeeded, we can continue to cross compiling the project,
    in this example for an IBM BlueGene supercomputer.'
