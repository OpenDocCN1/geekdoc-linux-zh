    # 4.6 Using Modules


    Code reuse is a valuable technique in software development and CMake has been
    designed to support it. Allowing CMakeLists files to make use of reusable modules
    enables the entire CMake community to share reusable sections of code. For these
    sections of code are called modules and can be found in the Modules subdirectory
    of your CMake installation. Modules are simply sections of CMake commands put
    into a file. They can then be included into other CMakeLists files using the include
    command. For example, the commands will include the FindTCL module from CMake
    and then add the Tcl library to the target FOO.


    ```

    include (FindTCL)


    target_link_libraries (FOO ${TCL_LIBRARY})

    ```


    A module''s location can be specified using the full path to the module file,
    or by letting CMake find the module by itself. CMake will look for modules in
    the directories specified by CMAKE_MODULE_PATH and if it cannot find it there,
    it will look in the Modules subdirectory of CMake. This way projects can override
    modules that CMake provides, to customize them for their needs. Modules can be
    broken into a few main categories:


    # Find Modules


    +   These modules determine the location of software elements such as header files
    or libraries.


    # System Introspection Modules


    These modules test the system for properties such as the size of a float, support
    for ANSI C++ streams, etc.


    # Utility Modules


    These modules provide added functionality such as support for situations where
    one CMake project depends on another and other convenience routines.


