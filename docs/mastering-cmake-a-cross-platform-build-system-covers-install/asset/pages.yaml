    # Submission backup


    CDash backups all the incoming XML submissions and places them in the backup directory
    by default. The default timeframe is 48 hours. The timeframe can be changed in
    the config.local.php as follows:


    ```

    $CDASH_BACKUP_TIMFRAME=72;

    ```


    If projects are private it is recommended to set the backup directory outside
    of the apache root directory to make sure that nobody can access the XML files,
    or to add the following lines to the .htaccess in the backup directory:


    ```

    <Files *

    order allow,deny

    deny from all

    </files>

    ```


    Note that the backup directory is emptied only when a new submission arrives.
    If necessary, CDash can also import builds from the backup directory:


