  md: '# 10.4 Testing CTest


    When you run the tests from your build environment what really happens is the
    build environment runs CTest. CTest is an executable that comes with CMake, it
    handling the tests for the project. While CTest works well with CMake, you do
    not have to use CMake in order to use CTest. The main input file for CTest is
    called CTestfile.cmake this file will be created in each directory that was processed
    by CMake (typically every directory with a CMakeLists.txt). The syntax of CTestfile.cmake
    is like the regular CMake syntax, with a subset of the commands available. If
    CMake is used to generate testing files, it will list subdirectories that need
    to be processed as well as add_test calls. The subdirectories are those that were
    added by subdirs or add_subdirectory commands. CTest can then parse these files
    to determine what tests to run. An example of such a file is shown below:


    ```

    # CMake generated Testfile for

    # Source directory: C:/CMake

    # Build directory: C:/CMake

    #

    # This file includes the relevent testing commands required

    # for testing this directory and lists subdirectories to

    # be tested as well.


    ADD_TEST (SystemInformationNew ...)


    SUBDIRS (Source/kwsys)

    SUBDIRS (Utilities/cmzlib)

    ...

    ```


    When CTest parses the CTestfile.cmake files it will extract the list of tests
    from them. These tests will be run, and for each CTest will display the name of
    the test and its status. Consider the following sample output:


    ```

    $ ctest

    Test project C:/CMake-build26

    Start 1: SystemInformationNew

    1/21 Test #1: SystemInformation ...... Passed 5.78 sec

    Start 2: kwsys.testEncode

    2/21 Test #2: kwsys.testEncode ........ Passed 0.02 sec

    Start 3: kwsys.testTerminal

    3/21 Test #3: kwsys.testTerminal ........ Passed 0.00 sec

    Start 4: kwsys.testAutoPtr

    4/21 Test #4: kwsys.testAutoPtr Passed 0.02 sec

    Start 5: kwsys.testHashSTl

    ```'
