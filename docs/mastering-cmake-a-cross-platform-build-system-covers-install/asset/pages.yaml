  md: '# 11.4 Adding a New Language


    In addition to porting CMake to new platforms a user may want to add a new language.
    This can be done either through the use of custom commands, or by defining a new
    language for CMake. Once a new language is defined, the standard add_library and
    add_executable commands can be used to create libraries and executables for the
    new language. To add a new language, you need to create four files. The name LANG
    has to match exactly the case used in the PROJECT command to enable the language.
    For example Fortran has the file CMakeFortranCompiler.cmake, and it is enabled
    with a call like this project(f Fortran). The four files are as follows:


    # CMakeDetermine(LANG)Compiler.cmake


    This file will find the path to the compiler for LANG and then configure CMake(LANG)Compiler.cmake.


    # CMake(LANG)Compiler.in


    This file should be used as input to a configure call in the CMakeDetermine(LANG)Compiler.cmake
    file. It is used to store compiler information and is copied down tri-compile
    directories so that compilers do not need to re-determine and test the LANG.


    # CMakeTest(LANG)Compiler.cmake


    This should use a try command to make sure the compiler and tools are working.
    If the tools are working, the following variable should be set in this way:


    ```

    set (CMAKE_(LANG)_COMPILER_WORKS 1 CACHE INTERNAL """)

    ```


    # CMake(LANG)Information.cmake


    Set values for the following rule variables for LANG:


    ```

    CMAKE_(LANG)_CREATE_SHARED_LIBRARY

    CMAKE_(LANG)_CREATE_SHARED_MODULE

    CMAKE_(LANG)_CREATE_STATIC_LIBRARY

    CMAKE_(LANG)_COMPILE_OBJECT

    CMAKE_(LANG) LINK EXECUTABLE

    ```'
