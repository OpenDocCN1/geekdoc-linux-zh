  md: '# Custom Commands and Targets


    # chdir dir command args


    Changes the current directory to dir and then execute the command with the provided
    arguments.


    # copy file destination


    Copies a file from one directory or filename to another.


    # copy_if_different in-file out-file


    copy_if_different first checks to see if the files are different before copying
    them. copy_if_different is critical in many rules since the build process is based
    on modification times. If the copied file is used as the input to another build
    rule then copy_if_different can eliminate unnecessary recompilations.


    # copy_directory source destination


    This option copies the source directory including any subdirectories to the destination
    directory.


    # remove file1 file2 ...


    Removes the listed files from the disk.


    # echo string


    Echos a string to the console. This is useful for providing output during the
    build process.


    # time command args


    Runs the command and times its execution.


    These options provide a platform independent way to perform a few common tasks.
    cmake executable can be referenced by using the CMAKE_COMMAND variable in your
    CMakeLists files as later examples will show.


