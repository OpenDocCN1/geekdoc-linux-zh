    The simple example we will be working with is as follows, it has a library and
    an executable. CPack commands that have already been covered are used.


    ```

    cmake_minimum_required(VERSION 2.6.0 FATAL_ERROR)

    project(MyLib)

    nadd_library(mylib mylib.cpp)

    add_executable(mylibapp mylibapp.cpp)

    target_link_libraries(mylibapp mylib)


    install(TARGETS mylib ARCHIVE DESTINATION lib)

