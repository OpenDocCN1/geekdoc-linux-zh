  md: '# # Appendix E - Properties


    This is the documentation for the properties supported by CMake. Properties can
    have different scopes. They can be assigned to a source file, a directory, a target,
    test, etc. By modifying the values of properties the behaviour of the build system
    can be customized.


    # ## Properties of Global Scope


    **ALLOW_DUPLICATE_CUSTOM_TARGETS**: Allow duplicate custom targets to be created.


    Normally CMake requires that all targets built in a project have globally unique
    logical names (see policy CMP0002). This is necessary to generate meaningful project
    file names in Xcode and VS IDE generators. It also allows the target names to
    be referenced unambiguously.


    Makefile generators are capable of supporting duplicate custom names. For projects
    that care only about Makefile generators and do not wish to support Xcode or VS
    IDE generators, one may set this property to true to allow duplicate custom-target
    command calls in different directories to specify the target name. However, setting
    this property will cause non-Makefile generators to produce an error and refuse
    to generate the project.


    **DEBUG_CONFIGURATIONS**: Specify which configurations are for debugging.'
