  md: '# 10.8 Customizing Dashboards for the Project


    CTest has a few options that can be used to control how it processes a project.
    If, CTest runs a dashboard, it finds CTestCustom.ctest files in the binary tree,
    it will load these files and use the settings from them to control its behavior.
    The syntax of a CCustom custom is the same as regular Cmake syntax. That said,
    only commands are normally used in this file. These commands specify properties
    that CTest will consider when performing the testing.


