  md: "# 9.4 CPack for Windows Installer NSIS\n\nTo create Windows style wizard self\
    \ extracting executables, CPack uses NSIS (NullScriptable Install System). More\
    \ information about NSIS is found at the NSIS home page: http://nsis.sourceforge.net/\
    \ NSIS is a powerful tool with a scripting language to create professional Windows\
    \ installers. With CPack, you will need NSIS installed on your machine.\n\nCPack\
    \ uses configured template files to control NSIS. There are two files configured\
    \ by CPack during the creation of a NSIS installer. Both files are found in the\
    \ CMake Modules directory. Modules/NSIS.template.in is the template for the NSIS\
    \ script, and Modules/NSIS.InstallOptions.ini is the template for the modern user\
    \ interface or MUI used by NSIS. The install options file contains information\
    \ about the pages used in the install wizard. This section will describe how to\
    \ configure CPack to create an NSIS installer.\n\n# CPack Variables Used by CMake\
    \ for NSIS\n\nThis section contains screen captures from the CMake NSIS install\
    \ wizard. For each part of the installer that can be changed or controlled from\
    \ CPack, the variables and values used are given.\n\nThe first thing that a user\
    \ will use of the installer in Windows is the icon for the installer executable\
    \ itself. By default the installer will have the Null Soft Installer icon, as\
    \ seen in Figure 7 for the 20071023 cmake installer. This icon can be changed\
    \ by setting the variable CPACK_NSIS_MUI_ICON. The installer for 20071025 in the\
    \ same figure shows the CMake icon being used for the installer.\n\n| cmake-2.5.20071023-win32-x86.exe\
    \ | 6,290 KB | Application |\n| cmake-2.5.20071025-win32-x86.exe | 6,324 KB |\
    \ Application |\n\nFigure 7 Icon for installer in Windows Explorer\n\nThe last\
    \ thing a user will use of the installer in Windows is the icon for the install\
    \ executable, as seen in Figure 8. This option can be set with the CPACK_NSIS_MUI_ICON\
    \ variable. Both the install and uninstall icons must be the same size and format,\
    \ a valid windows .ico file used by Windows Explorer. The icons are set like this:\n\
    \n```\n# set the install/uninstall icon used for the installer itself\nset (CPACK_NSIS_MUI_ICON)\n\
    \  \"$\\{CMAKE_SOURCE_DIR}/Utilities/Release\\\\CMakeLogo.ico\"\nset (CPACK_NSIS_MUI_UNICON)\n\
    \  \"$\\{CMAKE_SOURCE_DIR}/Release\\\\CMakeLogo.ico\")\n```"
