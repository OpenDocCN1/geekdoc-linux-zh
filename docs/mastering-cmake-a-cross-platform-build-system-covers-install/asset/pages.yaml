  md: "# Adding a Generated File and Generator (Step 5)\n\nIn this section we will\
    \ show how you can add a generated source file into the build process of an application.\
    \ For this example we will create a table of precomputed square roots as part\
    \ of the build process, and then compile table into our application. To accomplish\
    \ this we first need a program that will generate the table. In the MathFunctions\
    \ subdirectory a new source file MakeTable.cxx will just just that.\n\n```\n//\
    \ A simple program that builds a sqrt table\n#include <stdio.h>\n#include <math.h>\n\
    \nint main(int argc, char *argv[])\n{\n    int i;\n    double result;\n\n// make\
    \ sure we have enough arguments\nif (argc < 2)\n{\n    return 1;\n}\n\n// open\
    \ the output file\nFILE *fout = fopen(argv[1],\"w\");\nif (!fout)\n{\n    return\
    \ 1;\n}\n\n// create a source file with a table of square roots\nprintf(fout,\"\
    double sqrtTable[] = {\\n\",);\nfor (int i = 0; i < 10; ++i)\n{\n    result =\
    \ sqrt(static_cast<double>(i));\n    printf(fout,\"%g,\\n\",result);\n}\n\n//\
    \ close the table with a zero\nprintf(fout,\"0};\\n\");\nfclose(fout);\nreturn\
    \ 0;\n}\n\n```"
