  md: '# System Properties


    The next command used is find_path. This is a general purpose command, that in
    this example, is used to locate a header file from the library. Header files and
    libraries are often installed in different locations, and both locations are required
    to compile and link programs that use them. find_path is similar to find_library,
    although it only supports one name. It supports a list of search paths.


    The next part of CMakeLists use the variables created by the find* commands. The
    variables can be used without checking for valid values as CMake will print an
    error message notifying the user if any of the required variables have not been
    set. The user can then set the cache values and reconfigure until the message
    goes away. Optionally, a CMakeLists could use the if command to use alternative
    libraries or builds the project without the library if it cannot be found.


    From the above example you should be able to see how using the find* commands
    can help your software to compile on a wide variety of systems. It is worth noting
    that the find* commands search for a match starting with the first argument and
    first path. When listing paths and library names you should list your preferred
    paths and names first. If there are multiple versions of a library, and you would
    prefer over iff2, make sure you list them in that order.


    # 5.2 System Properties


    Although it is a common practice in C and C++ code to add platform-specific code
    inside preprocessor if directives, for maximum portability this should be avoided.
    Software should not be tuned to specific platforms with ifdefs, but rather to
    a canonical system consisting of a set of features. Coding to specific systems
    makes the software less portable, because systems and the features they support
    change with time, and even from system to system. A feature that may not have
    worked on a platform in the past may be a required feature for the platform in
    the future. The following code fragments illustrate the difference between coding
    to a canonical system and a specific:


    ```

    // coding to a feature

    #ifdef HAS_FOOBAR_CALL

    foobar();

    #else

    myfoobar();

    #endif


    // coding to specific platforms

    #if defined (SUN) && defined(HPUX) && defined(GNUC)

    foobar();

    #else

    myfoobar();

    ```'
