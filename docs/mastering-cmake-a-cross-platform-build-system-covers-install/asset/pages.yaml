    # 6.6 When There Isn’t One Rule For One Output


    There are a couple of unusual cases that can arise when using custom commands
    that warrant further explanation. The first is a case where one command (or executable)
    can create multiple outputs, and the second is the case where multiple commands
    can be used to create a single output.


    # A Single Command Producing Multiple Outputs


    In CMake a custom command can produce multiple outputs simply by listing multiple
    outputs after the OUTPUT keyword. CMake will generate the correct rules for your
    build system so no matter what output is required for a target the rules will
    be run. If the executable happens to produce a few outputs, but the build process
    is only using one of them, then you can ignore the other outputs when creating
    your custom command. Say that the executable produces a source file that is used
    in the build process and also an execution log that is not used. The custom command
    should specify the source file as the output and ignore the fact that a log file
    is also generated.


    Another case of having one command with multiple outputs is the case where the
    command is the same but the arguments to change it. This is effectively the same
    as having a different command and each command should have its own custom command.
    An example of this was the documentation example on page 111, where a custom command
    was added for each .tex file. The command is the same but the arguments are passed
    to change it each time.


    # Having One Output That Can Be Generated By Different Commands


    In cases you may find that you have more than one command that you can use to
    generate an output. Most build systems such as make and Visual Studio do not support
    this and likewise CMake does not. There are two common approaches that can be
    used to resolve this. If you truly have two commands that produce the same output,
    and no other significant outputs, then you can simply pick one of them and create
    a custom command for that one.'
