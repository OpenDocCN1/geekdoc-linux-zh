  md: 'Evaluates the given expression. If the result is true, the commands in the
    THEN section are invoked. Otherwise, the commands in the else section are invoked.
    The elseif and else sections are optional. You may have multiple elseif clauses.
    Note that the expression in the else and endif clause is optional. Long expressions
    can be used and there is a traditional order of precedence. Parenthetical expressions
    are evaluated first by unary operators such as EXISTS, COMMAND, and DEFINED. Then
    any EQUAL, LESS, GREATER, STRLESS, STREQUAL, MATCHES will be evaluated. Then NOT
    operators and finally AND, OR operators will be evaluated. Possible expressions
    are:


    ```

    if(variable)

    ```


    True if the variable''s value is not empty, 0, N, NO, OFF, FALSE, NOTFOUND, or
    <variable>-NOTFOUND.


