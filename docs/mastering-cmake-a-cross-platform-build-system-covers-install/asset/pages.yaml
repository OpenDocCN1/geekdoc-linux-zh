  md: 'with CMake naming conventions. The Error and ClientData members are used internally
    by CMake, you should not directly access them. Instead you can use the CAPI functions
    to manipulate them.


    Now let us consider some of the common CAPI functions you will use from within
    a loaded command. First we will consider some utility functions that are provided
    specifically for loaded commands. Since loaded commands use a C interface they
    will receive arguments as (int argc, char *argv()), for convenience you can call
    GetTotalArgumentSize(argc, argv) which will return the total length of all the
    arguments. Likewise some CAPI methods will return an (argc, argv) pair that will
    be responsible for freeing. The FreeArguments(argc, argv) function can be used
    to free such return values. If your loaded command has a FinalPass() to the FinalPass()
    invocation. This can be accomplished using the SetClientData(void *info, void
    *data) and *GetClientData(void *info) functions. Since the client data is passed
    as a void argument any client data larger than a pointer must be allocated and
    finally freed in your Destructor() function. Be aware that CMake will create multiple
    instances of your loaded command if you encounter an error in executing your loaded
    command, you can call SetError(void *info, const char *errorString) to pass an
    error message to the user.


    Another group of CAPI functions worth noting are the cmSource functions. cmSourceFile
    is a C++ object that represents information about a single file including its
    full path, file extension, special compiler flags, etc. Some loaded commands will
    need to create or access cmSourceFile instances. This can be done using the *CreateSourceFile()
    and void GetSource (void *mf, const char *sourceName) functions. Both of these
    functions return a pointer to a cmSourceFile as a void * return value. This pointer
    can then be passed into other functions that manipulate cmSourceFiles such as
    SourceFileGetProperty() or SourceFileSetProperty().'
