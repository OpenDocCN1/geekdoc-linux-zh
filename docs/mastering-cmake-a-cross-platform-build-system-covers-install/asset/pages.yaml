  md: "# To Pass Parameters to a Compilation?\n\nModules can be included in a project\
    \ either with the include command or the find_package command.\n\n```\nfind_package(OpenGL)\n\
    ```\n\nis equivalent to\n\n```\ninclude($(CMAKE_ROOT)/Modules/FindOpenGL.cmake)\n\
    ```\n\nand\n\n```\ninclude(FindOpenGL)\n```\n\nIf the project converts over to\
    \ CMake for its build system, then the find_package will still work if the package\
    \ provides a <XX>Config.cmake file. How to create a CMake package is described\
    \ in section 5.7.\n\n# 5.5 How to Pass Parameters to a Compilation?\n\nOnce you\
    \ have determined all features of the system in which you are interested, it is\
    \ time to configure the software based on what has been found. There are two common\
    \ ways to pass this information to the compiler: on the compile line, and using\
    \ a preconfigured header. The first way is to pass definitions on the compile\
    \ line. A preprocessor definition can be passed to the compiler from a CMakeLists\
    \ file with the add_definitions command. For example, a common practice in C code\
    \ is to have the ability to selectively compile in/out debug statements.\n\n```\n\
    #ifdef DEBUG_BUILD\nprintf(\"the value of v is %d\", v);\n#endif\n```\n\nA CMake\
    \ variable could be used to turn on or off debug builds using the OPTION command:\n\
    \n```\noption (DEBUG_BUILD)\n  \"Build with extra debug print messages.\"\n\n\
    if (DEBUG_BUILD)\n  add_definitions (-DDEBUG_BUILD)\nendif (DEBUG_BUILD)\n```"
