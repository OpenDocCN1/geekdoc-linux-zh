    Database maintenance: we recommend that you perform database optimization (reindexing,
    purging, etc.) regularly to maintain a stable database. MySQL has a utility called
    mysqlcheck, and PostgreSQL has several utilities such as vacuumdb.


    Deleting builds with incorrect dates: some builds might be submitted to CDash
    with the wrong date, either because the date in the XML file is incorrect or the
    timezone was not recognized by CDash (mainly by PHP). These builds will not show
    up in any dashboard because the start time is bogus. In order to remove these
    builds:


    +   1. Login to CDash as administrator.


    +   2. Click on [CDash maintenance] in the administration section.


    +   3. Click on ''Delete builds with wrong start date''


    Recompute test timing: if you have upgraded CDash you might notice that the current
    submissions are showing a high number of failing test due to time defects. This
    is because CDash does not have enough sample points to compute the mean and standard
    deviation for each test, in particular the standard deviation might be very small
    (probably zero for the first few samples). You should turn the "enable testing"
    off for a week, or until you get enough build submissions and CDash has calculated
    an approximate mean and standard deviation for each test.


    The other option is to force CDash to compute the mean and standard deviation
    for each test for the past few days. Be warned that this process may take a long
    time, depending on the number of test and projects involved. In order to recompute
    the test timing:


    +   1. Login to CDash as administrator.


    +   2. Click on [CDash maintenance] in the administration section.


    +   3. Specify the number of days (default is 4) to recompute the test timings.


    +   4. Click on "Compute testing". When the process is done the new mean, standard
    deviation and status should be updated for the tests submitted during this period.


