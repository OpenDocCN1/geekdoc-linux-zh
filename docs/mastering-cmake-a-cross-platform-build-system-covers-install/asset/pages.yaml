    # cmake_policy: Manage CMake Policy settings.


    As CMake evolves it is sometimes necessary to change existing behavior in order
    to fix bugs or improve implementations of existing features. The CMake Policy
    mechanism is designed to help keep projects building as new versions of CMake
    introduces changes in behavior. Each new policy (behavioral change) is given an
    identifier of the form "CMP<NNNN>" or <NNNN> is an integer index. Documentation
    associated with each policy describes the OLD and NEW behavior and the reason
    the policy was introduced. Projects may set each policy to select the desired
    behavior. When CMake needs to know which behavior to use it for a setting by the
    project. If no setting is available the OLD behavior is assumed and a warning
    is produced requesting the policy be set.


    The cmake_policy command is used to set policies to OLD or NEW behavior. While
    setting policies individually is supported, we encourage projects to set policies
    based on CMake versions.


    ```

    cmake_policy(VERSION major.minor[.patch])

    ```


    Specify that the current CMake list is written for the given version of CMake.
    All policies introduced in the specified version or earlier will be set to use
    NEW behavior. All policies introduced after the specified version will be unset.
    This effectively requests behavior preferred as a given CMake version and tells
    newer versions to warn about their new policies. The policy version specified
    must be at least 2.4 or the command will report an error. In order to get compatibility
    features supporting versions earlier than 2.4 see documentation of policy CMP0001.


    ```

    cmake_policy(SET CMP<NNNN> NEW)

    cmake_policy(SET CMP<NNNN> OLD)

    ```


    Tell CMake to use the OLD or NEW behavior for a given policy. Projects depending
    on the old behavior of a given policy may silence a policy warning by setting
    the policy state to OLD. Alternatively one may fix the project to work with the
    new behavior and set the policy state to NEW.


    ```

    cmake_policy(GET CMP<NNNN> <variable>)

    ```


    Check whether a policy is set to OLD or NEW behavior. The output variable will
    be "OLD" or "NEW" if the policy is set, and empty otherwise.'
