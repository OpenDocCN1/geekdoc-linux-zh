    CMAKE_SYSTEM_LIBRARY_PATH: Path used for searching by FIND_LIBRARY().


    Specifies a path which will be used by FIND_LIBRARY(). FIND_LIBRARY() will check
    each of the contained directories for the existence of the library which is currently
    searched. By default it contains the standard directories for the current system.
    It is NOT intended to be modified by the project, use CMake_SYSTEM_PREFIX_PATH
    for this. See also CMAKE_SYSTEM_PREFIX_PATH.


    CMAKE_SYSTEM_PREFIX_PATH: Path used for searching by FIND_XXX(), with appropriate
    suffixes added.


    Specifies a path which will be used by FIND_XXX commands. It contains the "base"
    directories, the FIND_XXX() commands append appropriate subdirectories to the
    base directories. So FIND_PROGRAM() appends /bin to each of the directories in
    the path, FIND_LIBRARY() appends /lib to each of the directories, and FIND_PATH()
    and FIND_FILE() append /include . By default this contains the standard directories
    for the current system. It IS NOT intended to be modified by the project, use
    CMake_PREFIX_PATH, CMAKE_SYSTEM_LIBRARY_PATH, CMAKE_SYSTEM_PROGRAM_PATH.


    CMAKE_SYSTEM_PROGRAM_PATH: Path used for searching by FIND_PROGRAM().


    Specifies a path which will be used by FIND_PROGRAM(). FIND_PROGRAM() will check
    each of the contained directories for the existence of the program which is currently
    searched. By default it contains the standard directories for the current system.
    It is NOT intended to be modified by the project, use CMake_PROGRAM_PATH for this.
    See also CMAKE_SYSTEM_PREFIX_PATH.


