    # Silence a Warning Without Updating the Code


    One may suppress all instances of a warning CMP<NNNN> by adding


    ```

    cmake_policy (SET CMP<NNNN> OLD)

    ```


    at the top of the project. However, we encourage project authors to update their
    code to work with the new behavior for all policies. This is especially important
    because versions of CMake in the (distant) future may remove support for the old
    behavior and produce an error for projects requesting it (which tells the user
    to get an older CMake to build the project).


    # Silence a Warning by Updating Code


    When a project does not work correctly with the NEW behavior for a policy its
    needs to be updated. In order to deal with a warning for some policy CMP<NNNN>
    one may add


    ```

    cmake_policy (SET CMP<NNNN> NEW)

    ```


    at the top of the project and then fix the code to work with the NEW behavior.

    If many instances of the warning occur fixing all of them simultaneously may be
    too difficult. Instead a developer may fix one at a time. This may be done using
    the PUSH/POP signatures of the cmake_policy command:


    ```

    cmake_policy (PUSH)

    cmake_policy (SET CMP<NNNN> NEW)

    # ... code updated for new policy behavior ...ncmake_policy (POP)

    ```


    This will request the new behavior for a small region of code that has been fixed.
    Other instances of the policy warning may still appear and must be fixed separately.


    # Updating the Project Policy Version


    After addressing all policy warnings and getting the project to build cleanly
    with the new CMake version one step remains. The policy version set at the top
    of the project should be updated to match the new CMake version, just as in the
    one-shot approach above.'
