  md: '# How to Run CMake?


    # Running CMake from the Command Line


    From the command line, CMake can be run as an interactive question answer session
    or as a non-interactive program. To run in interactive mode, just pass the "-i"
    option to CMake. This will cause CMake to ask you for a value for each entry in
    the cache file for the project. CMake will provide reasonable defaults, like it
    does in the GUI and curves based on user interfaces. The process stops when there
    are no longer any more questions to ask. An example of using the interactive mode
    of CMake is provided below.


    ```

    $ cmake -i -G "Name Makefiles" ../

    Would you like to see advanced options? [No]:

    Please wait while cmake processes CMakeLists.txt files...


    Variable Name: BUILD_TESTING

    Description: Build the testing tree.

    Current Value: ON

    New Value (Enter to keep current value):


    Variable Name: CMake INSTALL PREFIX

    Description: Install path prefix, prepended onto

    directories.

    Current Value: C:/Program Files/CMake

    New Value (Enter to keep current value):


    P wait while cmake processes CMakeLists.txt files...


    CMake complete, run make to build project.

    ```


    Using CMake to build a project in non-interactive mode is a simple process if
    the project has few or no options. For larger projects like VTK, using cmake,
    cmake -i, or cmake-gui is recommended. To build a project with a non-interactive
    CMake, first change directory to where you want the binaries to be placed. In
    an in-source build you then run cmake and pass in any options using the -D flag.
    For out-of-source builds the process is the same except you run cmake and also
    provide the path to the source code as its argument. Then type make and your project
    should compile. Some projects will have install targets as well, you can type
    make install to install them.


