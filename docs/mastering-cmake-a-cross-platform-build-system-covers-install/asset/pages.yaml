    # Installing Microsoft Run Time Libraries


    Although not strictly an NSIS CPack command, if you are creating applications
    on Windows with the Microsoft compiler, you will most likely want to distribute
    the run time libraries alongside your project. In CMake, all you need to do is
    the following:


    ```

    include (InstallRequiredSystemLibraries)

    ```


    This will aid the compiler run time libraries as install files that will go into
    the bin directory of your application. If you do not want the libraries to go
    into the bin directory, you would do this:


    ```

    set C_INSTALL_SYSTEM_RUNTIME_LIBS_SKIP TRUE

    include InstallRequiredSystemLibraries

    install PROGRAMS $ (CMAKE_INSTALL_SYSTEM_RUNTIME_LIBS)

    DESTINATION mydir

    ```


    It is important to note that the run time libraries must be right next to the
    executables of your package in order for Windows to find them. As Visual Studio
    2005, side by side manifest files are also required to be installed with your
    application when distributing the run time libraries. If you want to package a
    debug version of your software you will need to set CMAKE_INSTALL_DEBUG_LIBRARIES
    ON prior to the include.


    # CPack Component Install Support


    By default, CPack''s installers consider all of the files installed by a project
    as a single, monolithic unit: either the whole set of files is installed, or none
    of the files are installed. However, with many projects it makes sense for the
    installation to be subdivided into distinct, user-selectable components: some
    users may want to install only the command-line tools for a project, while others
    might want the GUI or the header files.


    This section describes how to configure CPack to generate component-based installers
    that allow users to select the set of project components they wish to install.
    As an example a simple installer will be created for a library that has three
    components: a library binary, a sample application, and a C++ header file. When
    finished the resulting installers for Windows and Mac OS look like the one in
    Figure 14.'
