  md: '# Key Concepts


    # 3.1 Main Structures


    This chapter provides an introduction to CMake''s key concepts. As you start working
    with CMake you will run into a variety of concepts such as targets, generators,
    and commands. In CMake these concepts are implemented as C++ classes and are referenced
    in many of CMake''s commands. Understanding these concepts will provide you with
    the working knowledge you need to create effective CMake files.


    Before going into detail about CMake''s classes it is worth understanding their
    basic relationships. At the lowest level there are source files. These correspond
    to typical C or C++ source code files. Source files are combined into targets.
    A target is typically an executable or library. A directory represents a directory
    in the source tree and typically has a CMakeLists file and one or more targets
    associated with it. Every directory has a local generator that is responsible
    for generating the Makefiles or project files for that directory. All of the local
    generators share a common global generator that oversees the build process. Finally,
    the global generator is created and driven by the cmake class itself.


    Figure 4 shows the basic class structure of CMake. We will now consider CMake''s
    concepts in a bit more detail. CMake''s execution begins by creating an instance
    of the cmake class and This manages the overall configuration process and handles
    information that is global to the build process such as the cache values. One
    of the first things the cmake class does is to create the correct global generator
    based on the user''s selection of what generator to use (such as Visual Studio
    10, Borland Makefiles, or UNIX Makefiles). At this point the cmake class passes
    control to the global generator by invoking the configure and generate methods.'
