    and CMake will know how to expand the name into the library when needed. Libraries
    can be declared of a particular type as STATIC, SHARED, MODULE, or undeclared.
    STATIC indicates that the library must be a static library. Likewise SHARED indicates
    it must be built as a shared library. MODULE indicates that the library must be
    created so that it can be dynamically loaded into an executable. On many operating
    systems as Mac OS X it is different. If none of these options are specified this
    indicates that the library can be built as either static or shared. In case CMake
    uses the setting of the variable BUILD_SHARED_LIBS to determine if the library
    should be SHARED or STATIC. If it is not set, then CMake defaults to building
    static libraries.


