  md: '# Toolchain Files


    The find_program command is usually used to find a program which will be executed
    during the build, so this should still search in the host file system, not in
    the environment of the target platform. find_library is normally used to find
    a library which is then used for linking purposes, so this command should only
    search in the target environment. find_path and find_file it is not obvious, in
    many cases they are used to search for headers, and by default they should only
    search in the target environment. The following CMake variables can be set to
    adjust the behavior of the find commands for cross compiling.


    # CMAKE_FIND_ROOT_PATH


    This is a list of the directories that contain the target environment. Each of
    the directories listed here will be prepended to each of the search directories
    of every find command. Assuming your target environment is installed under /opt/eldk/ppc_74xx
    and your installation for that target platform goes to ~install-eldk-ppc74xx,
    set CMAKE_FIND_ROOT_PATH to these two directories. find_library (JPEG_LIB jpeg)
    will search in /opt/eldk/ppc_74xx/lib, /opt/eldk/ppc_74xx/usr/lib, ~install-eldk-ppc_74xx/lib,
    and should result in /opt/eldk/ppc_74xx/usr/lib/libjpeg.so.


    By default CMAKE_FIND_ROOT_PATH is empty. If set, the directories prefixed with
    the path in CMAKE_FIND_ROOT_PATH will be searched, and after the unprefixed versions
    of the same directories will be searched.


    By setting this variable you are basically adding a new set of search prefixes
    to all of the find commands in CMake, but for some find commands you may not want
    to search the target or host directories. You can control how each command invocation
    works by passing in one of the three following options NO_CMAKE_FIND_ROOT_PATH,
    ONLY_CMAKE_FIND_ROOT_PATH or CMAKE_FIND_ROOT_PATH BOTH when you call it. You can
    also control how the find commands work using the following three variables.


    # CMAKE_FIND_ROOT_PATH_MODE_PROGRAM


    This sets the default behavior for the find_program command. It can be set to
    NEVER, ONLY or BOTH. The default setting is BOTH. When set to NEVER, CMAKE_FIND_ROOT_PATH
    will not be used for find_program calls except where it is explicitly enabled.
    If set to ONLY, only the search directories with the prefixes coming from CMAKE_FIND_ROOT_PATH
    will be used by find_program. The default is BOTH, which means that first the
    prefixed directories, and then the unprefixed directories, will be searched.


    In most cases find_program is used to search for an executable which will then
    be executed, e.g. using execute_process or add_custom_command. In most cases an
    executable from the build host is required, so setting CMAKE_FIND_ROOT_PATH_MODE_PROGRAM
    to NEVER is normally preferred.'
