  md: "# Flow Control\n\n# 4.3 Flow Control\n\nIn many ways writing a CMakeLists file\
    \ is like writing a program in a simple language. Like most languages CMake provide\
    \ flow structures to help you along your way. CMake provides three flow control\
    \ structures;\n\n+   - conditional statements (e.g. if)\n- looping constructs\
    \ (e.g. foreach and while)\n- procedure definitions (e.g. macro and function)\n\
    \nFirst we will consider the if command. In many ways the if command in CMake\
    \ is just like the if command in any other language. It evaluates its expression\
    \ and based on that either executes the code in its body or optionally the code\
    \ in the else clause. For example:\n\n```\nif (FOO)\n  # do something here\nelse\
    \ (FOO)\n  # do something else\nendif (FOO)\n```\n\nOne difference you might notice\
    \ is that the conditional of the if statement is repeated in the else and endif\
    \ clauses. This is optional and in this book you will see examples of both styles.\
    \ You could just as well choose to write:\n\n```\nif (FOO)\n  # do something here\n\
    else ()\n  # do something else\nendif ()\n```\n\nWhen you include conditionals\
    \ in the else and endif clause they are used to provide additional error checking.\
    \ As they must exactly match the original conditional of the if statement. The\
    \ following code would not work:\n\n```\nset (FOO 1)\n\nif (${FOO})\n  # do something\n\
    endif (1)\n  # ERROR, it doesn't match the original conditional\n```"
