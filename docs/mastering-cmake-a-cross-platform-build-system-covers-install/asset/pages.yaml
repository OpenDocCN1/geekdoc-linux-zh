  md: "# CMAKE_FIND_PATH_MODE_LIBRARY\n\nThis is the same as above, but for the find_library\
    \ command. In most cases this is used for a library which will be used for linking,\
    \ so a library for a target is required. So in the common case it should be set\
    \ to ONLY.\n\n# CMAKE_FIND_PATH_MODE_INCLUDE\n\nThis is the same as above for\
    \ both find_path and find_file. In most cases this is used for finding include\
    \ directories, so the target environment should be searched. In the common case\
    \ it should be set to ONLY. If you also need to find files in the file system\
    \ of the build host, e.g. some data files that will be processed during the build.\
    \ You may need to adjust the behavior for those find_path or find_file using the\
    \ NO_CMAKE_FIND_ROOT_PATH, ONLY_CMAKE_FIND_ROOT_PATH AND CMAKE_FIND_ROOT_PATH_BOTH\
    \ options.\n\nWith a toolchain file set up as, CMake now knows how to handle the\
    \ platform and the cross compiler. We should now be able to build software for\
    \ the target platform. For complex projects there are more issues that must be\
    \ taken care of.\n\n# 8.2 System Inspection\n\nMost portable software projects\
    \ have a set of system inspection tests for determining the properties of the\
    \ (target) system. The simplest way to check for a system feature with CMake is\
    \ by testing variables. UNIX, WIN32 and APPLE. For this purpose CMake provides\
    \ the variables. When compiling, these variables apply to the target platform,\
    \ for testing the build host platform there are corresponding variables CMAKE_HOST_UNIX,\
    \ CMAKE_HOST_WINDOWS and CMAKE_HOST_APPLE.\n\nIf this granularity is too coarse,\
    \ the variables CMAKE_SYSTEM_NAME, CMAKE_SYSTEM_VERSION and CMAKE_SYSTEM_PROCESSOR\
    \ can be tested, along with their counterparts CMAKE_HOST_SYSTEM_NAME, CMAKE_HOST_SYSTEM,\
    \ CMAKE_HOST_SYSTEM_VERSION and CMAKE_HOST_SYSTEM_PROCESSOR, which contain the\
    \ same information, but for the build host and not for the target system.\n\n\
    ```\nif (CMAKE_MATCHES Windows)\n    message (STATUS \"Target system is Windows\"\
    )\nendif ()\nif (CMAKE_HOST_SYSTEM MATCHES Linux)\n    message (STATUS \"Build\
    \ host runs Linux\")\nendif ()\n```"
