  md: "```\nadd_executable (mygen gen.c)\nexport (TARGETS mygen FILE\n  \"${CMAKE_BINARY_DIR}/MyGenConfig.cmake\"\
    )\nendif\n\nadd_custom_command (\n  OUTPUT \"${CMAKE_CURRENT_BINARY_DIR}/generated.h\"\
    \n  COMMAND mygen -o \"${CMAKE_CURRENT_BINARY_DIR}/generated.h\" )\n```\n\nThe\
    \ CMakeLists.txt modified like this the project can be cross compiled. First,\
    \ a native build has to be done in order to create the necessary mygen executable.\
    \ After that the cross compiling build can begin. The build directory of the native\
    \ build has to be given to the cross compiling build as the location of the MyGen\
    \ package, so that find_package(MyGen) can find it:\n\n```\nmkdir build-native;\
    \ cd build-native\ncmake\nmake ..\ncd\nmkdir build-cross; cd build-cross\ncmake\
    \ -DCMAKE_TOOLCHAIN_FILE=MyToolchain.cmake \\\n  -DMyGen_DIR=~/src/build-native/\n\
    make\n```\n\nThis code works, but CMake versions prior to 2.6 will not be able\
    \ to process it, as they do not know the export command and do not recognize the\
    \ target mygen in add_custom_command. A compatible version that works with CMake\
    \ 2.4 looks like this:\n\n```\nif (CMAKE_CROSSCOMPILING)\nfind_package (MyGen)\n\
    endif (CMAKE_CROSSCOMPILING)\n\nif (NOT CMAKE_CROSSCOMPILING)\nadd_executable\
    \ (mygen gen.c)\n  if (COMMAND EXPORT)\n    export (TARGETS mygen FILE\n     \
    \ \"${CMAKE_BINARY_DIR}/MyGenConfig.cmake\")\nendif (COMMAND EXPORT)\nendif (NOT\
    \ CMAKE_CROSSCOMPILING)\n```\n\nget_target_property (mygenLocation mygen LOCATION)"
