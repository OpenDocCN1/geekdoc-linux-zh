    \ The documentation string is used by the GUI to provide online help.\n\nThe other\
    \ purpose of the cache is to store key variables that are expensive to determine.\
    \ These variables may not be visible or adjustable by the user. Typically these\
    \ are system dependent variables such as C_WORDS_BIGENDIAN, which require CMake\
    \ to compile and run a program to determine their value. Once these values have\
    \ been determined, they are stored in the cache to avoid having recompute every\
    \ time CMake runs. Generally tries to limit these variables to properties that\
    \ do not change (such as the order of the machine you are on). If you significantly\
