  md: '# # Packaging with CPPack


    CPPack is a powerful, easy to use, cross-platform software packaging tool distributed
    with CMake since version 2.4.2. It uses the generators concept from CMake to abstract
    package generation on specific platforms. It can be used with or without CMake,
    but it may depend on some software being installed on the system. Using a simple
    configuration file, or using a CMake module, the author of a project can package
    a complex project into a simple installer. This chapter will describe how to apply
    CPPack to a CMake project.


    # ## 9.1 CPPack Basics


    Users of your software may not always want to, or be able to, build the software
    in order to install it. The software maybe beside closed source, or may take a
    long time to compile, or in the case of an end user the users may have no interest
    in building the application. For these cases, what is needed is a way to build
    the software on one machine, and then move the install tree to a different machine.
    The most basic way to do this is to use the DESTDIR environment variable to install
    the software into a temporary location, or to tar or zip that directory and move
    it to the other machine. Another more powerful approach is to use the CPPack tool
    included in CMake.


    CPPack is a tool included with CMake, and it can be used to create installers
    and packages for projects. CPPack can create two basic types of packages, source
    and binary. CPPack works in the same way as CMake does for building software.
    It does not aim to replace native packaging tools, but rather provides a single
    interface to a variety of tools. Currently CPack supports the creation of Windows
    installers using Nullsoft installer NSIS, Mac OS X Drag and Drop, OS X11 Drag,
    and Cygwin Setup packages.'
  merge: -1
  pgno: 148
- img_proc: true
  md: 'Debian packages, RPMs, .tar.sh (self extracting .tar.gz files), .zip files.
    The implementation of CPack works in a similar way to CMake. For each type of
    tooling supported, there is a CPack generator in C++ that is used to run the native
    tool and create the package. For simple tar based packages, CPack includes a library
    version of tar and does not require tar to be installed on the system. For many
    of the other installers, native tools must be present for CPack to function.


    With source packages, CPack makes a copy of the source tree and creates a tar
    file. For binary packages, the use of CPack is tied to the install commands working
    correctly for a project. When setting up install commands, the first step is to
    make sure the files go into the correct directory structure with the correct permissions.
    The next step is to make sure the software is relocatable and can run in an installed
    tool. This may require changing the software itself, and there are many techniques
    to do that for different environments that go beyond the scope of this book. Basically,
    executables should be able to find data or other files using relative paths to
    the location of where it is installed. CPack installs the software into a temporary
    directory, and copies the install tree into the format of the native packaging
    tool. Once the install commands have been added to a project, enabling CPack in
    the simplest case is by including the CPack.cmake file into project.


    # Simple Example


    The most basic CPack project would look like this:


    ```

    project(CoolStuff)

    add_executable(coolstuff coolstuff.cxx)

    install(TARGETS coolstuff RUNTIME DESTINATION bin)

    include(CPack)

    ```


    In the CoolStuff project, an executable is created and installed into the directory
    bin. Then the CPack file is included by the project. At this point project CoolStuff
    will have CPack enabled. To run CPack for a CoolStuff, you would first build the
    project as you would any other CMake project. CPack adds several targets to the
    generated project. These targets in Makefiles are package and package_source,
    and PACKAGE in Visual Studio and Xcode. For example, to build a source and binary
    package for CoolStuff using a Makefile generator you would run the following commands:


    ```

    mkdir build

    cd build

    cmake ../CoolStuff

    make

    make package

    make package_source

    ```'
