  md: '# Automation & Testing with CMake


    # 10.1 Testing with CMake, CTest, and CDash


    Testing is a key tool for producing and maintaining robust, valid software. This
    chapter will examine the tools that are part of CMake to support software testing.
    We will begin with a brief discussion of testing approaches and then discuss how
    to add tests to your software project using CMake. Finally we will look at additional
    tools that support creating centralized software status dashboards.


    The tests for a software package may take a number of forms. At the most basic
    level there are smoke tests, such as one that simply verifies that the software
    compiles. While this may seem like a simple test, with the wide variety of platforms
    and configurations available, smoke tests catch more problems than any other type
    of test. Another form of smoke test is to verify that a test runs without crashing.
    This can be handy for situations where the developer does not want to spend the
    time creating more complex tests, but is willing to run some simple tests. Most
    of these simple tests can be small programs. Running them verifies not only the
    build was successful, but that any required shared libraries can be loaded (for
    projects that use them) and at least some of the code can be executed without
    crashing.


    Moving beyond smoke tests leads to more specific tests such as regression, black,
    and white box testing. Each of these has its strengths. Regression testing verifies
    that the results of a test do not change over time, or platform. This is very
    useful when performed frequently, as it provides a quick check that the behavior
    and results of the software have not changed. When a regression test fails a quick
    look at recent code changes can easily identify the culprit. Unfortunately, regression
    tests typically require more effort to create than other tests.'
  merge: -1
  pgno: 183
- img_proc: true
  md: 'White and black box testing refer to tests written to execute units of code
    (at various levels of integration) with and without knowledge of how those units
    are implemented. White box testing is designed to stress failure points in the
    code knowing how code was written, and hence its weaknesses. As with regression
    testing this can take a substantial amount of effort to create good tests. Black
    box testing typically knows little or nothing about the implementation of the
    software other than its public API. Black box testing can provide a lot of code
    coverage without too much effort in developing the tests. It is especially true
    for libraries of object oriented software where the APIs are well defined. A black
    box test can be written to go through and invoke a number of typical methods on
    all the classes in the software.


    The final type of testing we will discuss is software standard compliance testing.
    While the other types of testing we have discussed are focused on determining
    if the code works properly, compliance testing tries to determine if the code
    adheres to the coding standards of the software project. This could be a check
    to verify that all classes have implemented some method, or that all functions
    have a common prefix. The options for this type of test are limitless and there
    are a number of ways to perform such testing. There are software analysis tools
    that can be used, or specialized test programs (maybe python scripts etc) could
    be written. The key point to realize is that the tests do not necessarily involve
    running some part of the software. The tests might run some other tool on the
    source itself.


    There are a number of reasons why it helps to have testing support integrated
    into the build process. First, complex software projects may have a number of
    configuration or platform-dependent options. The build system knows what options
    can be enabled and then enable the appropriate tests for those options. For example,
    the Visualization Toolkit (VTK) has support for a parallel processing library
    MPI. If VTK is built with MPI support then additional tests are enabled that make
    use of MPI and verify that the MPI-specific code in VTK works as expected. Secondly,
    the build system knows where the executables will be placed and it has for finding
    other required executables (as per, python etc). The third reason is that UNIX
    Makefiles is common to have a test target in the Makefile that developers can
    make type test and have the test(s) run. In order for this to work, the build
    system must have some knowledge of the testing process.


    # 10.2 How Does CMake Facilitate Testing?


    CMake facilitates testing your software through special testing commands and the
    CTest executable. First we will discuss the key commands in CMake. To add testing
    to a CMake-based project is fairly simple using the add_test command. The add_test
    has a simple syntax as follows:


    ```

    add_test (TestName ExecutableToRun arg1 arg2 arg3 ...)

    ```'
  merge: -1
  pgno: 184
- img_proc: true
  md: "The first argument is simply a string name for the test. This is the name that\
    \ will be displayed by testing programs. The second argument is the executable\
    \ to run. The executable can be built as part of the project or it can be a standalone\
    \ executable such as python, perl, etc. The remaining arguments will be passed\
    \ to the running executable. A typical example of testing using the `add_test`\
    \ command would look like this:\n\n```\nadd_executable(TestInstantiator TestInstantiator.cxx)\n\
    target_link_libraries(TestInstantiator vtkCommon)\n_test(TestInstantiator\n  ${EXECUTABLE_OUTPUT_PATH}/TestInstantiator)\n\
    ```\n\nThe `add_test` command is typically placed in the CMakeLists file for the\
    \ directory that the test is in. For large projects there may be multiple CMakeLists\
    \ files with `add_test` commands in. Once the `add_test` commands are present\
    \ in the project, the user can run the tests by invoking the “test” target of\
    \ Makefile, or the RUNTESTS target of Visual Studio or Xcode. An example of running\
    \ tests on the CMake tests using the Makefile generator on Linux would be:\n\n\
    ```\n$ make test\nRunning tests...\nTest project\nStart 2: kwsys.testEncode\n\
    1/20 Test #2: kwsys.testEncode ......... Passed 0.02 sec\nStart 3: kwsys.testTerminal\n\
    2/20 Test #3: kwsys.testTerminal ......... Passed 0.02 sec\nStart 4: kwsys.testAutoPtr\n\
    3/20 Test #4: kwsys.testAutoPtr ......... Passed 0.02 sec\n```\n\n# 10.3 Additional\
    \ Test Properties\n\nBy default a test passes if all of the following conditions\
