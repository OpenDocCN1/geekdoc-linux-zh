  md: "# Extending CMake\n\nIn the above example you would simply replace HELLO_WORLD\
    \ with the name of your command and replace ${PROJECT_SOURCE_DIR}/CMake with the\
    \ actual name of the subdirectories where you placed your loaded command. Now\
    \ let us look at creating loaded commands in more detail. We will start by looking\
    \ at the cmLoadedCommandInfo structure.\n\n```\ntypedef const char* (*CM_DOC_FUNCTION)();\n\
    \ntyp int (*CM_INITIAL_PASS_FUNCTION)(\n    void *info, void *mf, int argc, char\
    \ []);\nntypedef void (*CM_FINAL_PASS_FUNCTION)(\n    void *info, void *mf);\n\
    typedef void (*CM_DESTRUCTOR_FUNCTION)(void *info);\n\ntypedef struct {\n    unsigned\
    \ long resdevel1;\n    unsigned long resdevel2;\n    cmAPI *CAPI_Inherited;\n\
    \    int m_Inherited;\n    CM_INITIAL_PASS_FUNCTION InitialPass;\n    CM_FINAL_PASS_FUNCTION\
    \ FinalPass;\n    CM_DESTRUCTOR_FUNCTION Destructor;\n    CM_DOC_FUNCTION GetTextMessage;\n\
    \    CM_DOC_FUNCTION GetFullDocumentation;\n    const char *Name;\n    char *Error;\n\
    \    void *ClientData;\n} cmLoadedCommandInfo;\n```\n\nThe first two entries of\
    \ the structure are reserved for future use. The next entry, CAPI, is a pointer\
    \ to a structure containing pointers to all the CMake functions you can invoke\
    \ from a plugin. The m_Inherited member only applies to CMake versions 2.0 and\
    \ earlier. It can be set to indicate if this command should be inherited by subdirectories\
    \ or. If you are creating a command that will work with CMake prior to 2.2 you\
    \ probably want to set this to zero. The next five members are pointers to functions\
    \ that your plugin may provide. The InitialPass function must be provided and\
    \ it is invoked when your loaded command is invoked from a CMakeLists file. The\
    \ FinalPass function is optional and the Destructor function is optional and will\
    \ be invoked when your command is destroyed by CMake (typically on exit). It can\
    \ be used to clean up any memory that have allocated in the InitialPass or FinalPass.\
    \ The next two functions are optional and are provide documentation for your command.\
    \ The Name member is used to store the name of your command. This will be compared\
    \ when parsing a CMakeLists file, it should be in all caps keeping"
