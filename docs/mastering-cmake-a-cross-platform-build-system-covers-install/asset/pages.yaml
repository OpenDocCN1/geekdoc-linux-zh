  md: '# Setting up Automated Dashboard Clients


    The final general purpose option we will discuss is CTest''s support for restoring
    a bad dashboard. In some cases you might want to make sure that you always have
    a working build of the software. Or you might use the resulting executables or
    libraries from one dashboard in the build process of another dashboard. In these
    cases if the first dashboard fails it is best to drop back to the last previously
    working dashboard. You can do this in CTest by setting GTEST_BACKUP_AND_RESTORE
    to true. When this is set to true CTest will first backup the source and binary
    directories, it will then check out a new source directory and create a new binary
    directory. After that it will run a full dashboard. If the dashboard fails the
    backup directories are removed, if for some reason the new dashboard fails the
    directories will be removed and the old directories restored. To make this work
    you must also set the CTEST_CVS_CHECKOUT variable. This should be set to the command
    required to check your source tree. This doesn''t actually have to be cvs but
    it must result in a source tree in the correct location. Consider the following
    example:


    ```

    # do a backup and the build fail restore,

    # if this is true you must set the CTEST_CVS_CHECKOUT

    # variable below.

    set (CTEST_BACKUP_AND_RESTORE TRUE)


    # this is the full cvs command to check out the source dir

    # this will be run from the directory above the source dir

    set (CTEST_CVS_CHECKOUT

    "/usr/bin/cvs -d /cvroot/FOO co -d FOO FOO")

    ```


    Note that whatever checkout command you specify will be run from the directory
    above the source directory. A typical nightly dashboard client script will look
    like this:


    ```

    set (CTEST_SOURCE_NAME CMake)

    set (CTEST_BINARY_NAME CMake-gcc)

    set (CTEST_DASHBOARD_ROOT "\${HOME}/Dashboards/My Tests")


    set (CTEST_SOURCE_DIRECTORY)

    "\${CTEST_DASHBOARD_ROOT}/${CTEST_SOURCE_NAME}"

    set (CTEST_BINARY_DIRECTORY)

    "\${CTEST_DASHBOARD_ROOT}/${CTEST_BINARY_NAME}")


    # which ctest command to use for running the dashboard

    set (CTEST_COMMAND)

    "\${CTEST_EXECUTABLE_NAME}"

    -D Nightly

    -A "\${CTEST_SCRIPT_DIRECTORY}/${CTEST_SCRIPT_NAME}""

    ```'
