    between two targets. CMake automatically creates dependencies between targets
    when it can


    The include_regular_expression command also relates to dependencies. The command
    controls the regular expression that is used for tracing source code dependencies.
    By default CMake will trace all the dependencies for a source file including system
    include files as stdio.h. If you specify a regular expression with the include_regular_expression
    command that regular expression will be used to limit what files are processed.
    For example; if your software project''s include all files started with the prefix
    foo (e.g. fooMain.c fooStruct.h etc) then you could specify a regular expression
    ^foo.* to limit the dependency checking to just the files of your project.


    Occasionally you might want to get a listing of all the source files that another
    source depends on. This is useful when you have a program that uses pieces of
    a large library but you are not sure what pieces it is using. The output_required_files
    command will take a source file and produce a list of all the other source files
    it depends on. You could use this list to produce a reduced version of the library
    that only contains the necessary files for your program.


