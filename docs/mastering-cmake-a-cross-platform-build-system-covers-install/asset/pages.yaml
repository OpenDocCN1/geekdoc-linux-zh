    It is important to keep in mind that CPack is run after CMake on the project.
    CPack uses the same parser as CMake, but will not have the same variable values
    as the CMake project. It will only have the variables that start with CPACK_,
    and these variables will be configured into a configuration file by CMake. This
    can cause some errors and confusion if the values of the variables use escape
    characters. Since they are getting parsed twice by the CMake language, they will
    need double the level of escaping. For example, if you had the following in your
    CMake project:


    ```

    set(CPACK_PACKAGE_NAME \"Stuff\"")

