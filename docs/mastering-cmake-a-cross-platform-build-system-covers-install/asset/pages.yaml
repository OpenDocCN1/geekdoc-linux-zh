  md: '# Packaging with CPack


    ![](img/e9100b0b4f9826635471985a71bc8154_167_0.png)


    # Interdependencies


    With most projects, the various components are not completely independent. For
    example, an application component may depend on the shared libraries in another
    component to execute properly, such as installing the application component without
    the corresponding shared libraries would result in an unusable installation. CPack
    allows you to express the dependencies between components, so that a component
    will only be installed if all of the other components it depends on are also installed.


    To illustrate component dependencies, we will place a simple restriction on our
    component-based installer. Since we do not provide source code in our installer,
    the C++ header files we distribute can actually be used if the user also installs
    the library binary to link their program against. Thus, the "headers" component
    depends on the availability of the "libraries" component. We can express this
    by setting the DEPENDS property for the HEADERS component as:


    ```

    pack_add_component(headers DISPLAY_NAME "C++ Headers"

    DESCRIPTION

    "C/C++ header files for use with MyLib"

    DEPENDS libraries

    )

    ```


    The DEPENDS property for a component is actually a list, such as a component can
    depend on several other components. By expressing all the dependencies in this
    manner, you can ensure that users will not be able to select an incomplete set
    of components at installation time.


    # Grouping Components


    When the number of components in your project grows large, you may need to provide
    additional organization for the list of components. To help with this organization,
    CPack with'
  merge: -1
  pgno: 167
- img_proc: true
  md: 'includes the notion of component groups. A component group is, simply, a way
    to provide a name for a group of related components. Within the user interface,
    a component group has its own name, and underneath that are the names of all the
    components in that group. Users will have the option to (de-)select the installation
    of all components in the group with a single click, or expand the group to select
    individual components.


    We will expand our example by categorizing its three components, "applications",
    "libraries", and "headers", into "Runtime" and "Development" groups. We can place
    a component into a group by using the GROUP option to the cpack_add_component
    function as follows:


    ```

    cpack_add_component(applications)

    DISPLAY_NAME "MyLib Application"

    DESCRIPTION

    "An extremely useful application that makes use of MyLib"

    GROUP Runtime

    cpack_add_component(libraries)

    DISPLAY_NAME "Libraries"

    DESCRIPTION

    "Static libraries used to build programs with MyLib"

    GROUP Development

    cpack_add_component(headers)

    DISPLAY_NAME "C++ Headers"

    DESCRIPTION

