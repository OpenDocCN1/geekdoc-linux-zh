    )\n```\n\n# 11.7 Extending CMake\n\nOccasionally you will come across a situation\
    \ where you want to do something that CMake cannot seem to handle. Examples of\
    \ this include creating wrappers for C++ classes to make them available to other\
    \ languages, or creating bindings for C++ classes to support runtime introspection.\
    \ In these cases you may want to extend CMake by adding your own commands. CMake\
    \ supports this capability through its C plugin API. Using this API project can\
    \ extend CMake to add specialized commands to handle specific tasks.\n\nA loaded\
    \ command in CMake is an essential C plugin that is compiled into a shared library\
    \ (a.k.a. DLL). This shared library can be loaded into the running CMake to provide\
    \ the functionality of the loaded command. You must first write the C code and\
    \ CMakeLists for the command, and place it in your source tree. Next you must\
    \ modify your CMakeLists file to compile the loaded command and load it. We will\
    \ start by looking at first if you can accomplish what you want with a macro.\
    \ With the commands in CMake macro/function has almost the same level of flexibility\
    \ as a loaded command, but does not require compilation or as much complexity.\
    \ You can always choose, and use a macro/function instead of a loaded command.\n\
    \n# Creating a Loaded Command\n\nWhile CMake itself is written in C++ we suggest\
    \ that you write your plugins using only C code. This avoids a number of portability\
    \ and compiler issues that can plague C++ plugins being loaded into CMake executables.\
    \ The API for a plugin is defined in the header file cmPluginAPI.h. This file\
    \ defines all of the CMake functions that you can invoke from your plugin. It\
    \ also defines the cmLoadedCommandInfo structure that is passed to a plugin. Before\
    \ going into detail about these functions, consider the following simple plugin:\n\
    \n```\n#include \"cmPluginAPI.h\"\n\nstatic int InitialPass(void *inf, void *mf,\n\
    \    int argc, char *argv[])\n```"
