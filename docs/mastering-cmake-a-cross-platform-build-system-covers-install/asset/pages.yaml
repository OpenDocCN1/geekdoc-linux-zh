    # Naming Components


    At this point, you may have noted that the names of the actual components in the
    installer are not very descriptive: they say "applications", "libraries", or "headers",
    as specified in the component names. These names can be improved by using the
    DISPLAY_NAME option in the cpack_add_component function:


    ```

    cpack_add_component(applications DISPLAY_NAME

    "MyLib Application")

    cpack_add_component(libraries DISPLAY_NAME "Libraries")

    cpack_add_component(headers DISPLAY_NAME "C++ Headers")

    ```


    Any macro prefixed with CPACK_COMPONENT_${COMPNAME}, where ${COMPNAME} is the
    uppercase name of a component, is used to set a particular property of that component
    in the installer. Here, we set the DISPLAY_NAME property of each our components,
    so that we get human-readable names. These names will be listed in the selection
    box rather than the internal component names "applications", "libraries", "headers".'
  merge: -1
