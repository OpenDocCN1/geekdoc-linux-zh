    \ denote a comment line. All characters from the # to the end of the line are\
    \ considered part of the comment.\n\n# 2.5 How to Run CMake?\n\nOnce CMake has\
    \ been installed on your system, it is easy to build a project is easy. There\
    \ are two main directories CMake uses when building a project: the source directory\
    \ and the binary directory. The source directory is where the source code for\
    \ your project is located. This is also where the CMakeLists file will be found.\
    \ The binary directory is where you want CMake to put the resulting object files,\
