  md: "# Creating CMake Package Configuration Files\n\nAn application that uses the\
    \ Gromit package might create a CMake file that looks like this:\n\n```\ncmake_minimum_required\
    \ (VERSION 2.6.3)\nproject (MyProject C)\n\nfind_package (gromit 1.0 REQUIRED)\n\
    include_directories (${gromit_INCLUDE_DIRS})\n# run imported executable\nadd_custom_command(\n\
    \  COMMAND gromit-gen generated.c)\n\nadd_executable (myexe generated.c)\ntarget_link_libraries\
    \ (myexe gromit) # link to imported library\n```\n\nThe call to find_package locates\
    \ an installation of Gromit or terminates with an error message if none can be\
    \ found (to REQUIRED). After the command succeeds, the Gromit package configuration\
    \ file gromit-config.cmake has been loaded, so Gromit targets have been imported\
    \ and variables like gromit_INCLUDE_DIRS have been defined.\n\nThe example creates\
    \ a package configuration file and places it in the install tree. One may also\
    \ create a package configuration file in the build tree to allow applications\
    \ to use the project without installation. In order to do this, one extends Gromit’s\
    \ CMake file with the code:\n\n```\n# Make project useable from build tree.\n\
    export (TARGETS gromit gromit-gen FILE gromit-targets.cmake)\nconfigure_file (${Gromit_SOURCE_DIR}/gromit-config.cmake.in\n\
    \  ${Gromit_BINARY_DIR}/gromit-config.cmake @ONLY)\n```\n\nThis configure_file\
    \ uses a different input file, gromit-config.cmake.in, containing\n\n```\n# Import\
    \ the targets.\ninclude(\"@Gromit_BINARY_DIR/gromit-targets.cmake\")\n\n# Report\
    \ other information.\nset(gromit_INCLUDE_DIRS \"@Gromit_SOURCE_DIR@\")\n```\n\n\
    The package configuration file gromit-config.cmake placed in the build tree provides\
    \ the same information to an outside project as in the install tree, but refers\
    \ to files in the source and build trees. It shares an identical package version\
    \ file gromit-version.cmake with that placed in the install tree."
