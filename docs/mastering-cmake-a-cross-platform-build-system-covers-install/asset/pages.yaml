    # 8.8 Some Tips and Tricks


    Dealing with try_run tests


    In order to make compiling your project easier, try to avoid try_run tests and
    use other methods to test something instead. For examples of how this can be consider
    the tests for endianness in CMake/Modules/TestBigEndian.cmake, and the test for
    the compiler id using the source file Cmake/Modules/CMakeCompilerId.c. In both
    try_compile is used to compile the source file into an executable, where the desired
    information is encoded into a text string. Using the COPY_FILE option of try_compile
    this executable is copied to a temporary location and then all strings are extracted
    from it using file (STRINGS). The test result is obtained using regular expressions
    to get the information from the string.


    If you cannot avoid try_run tests, try to just extract the code from the run,
    not the output of the process. That way will not be necessary to set both the
    code and the stdout and stderr variables for the try_run test when compiling.
    This allows the OUTPUT_VARIABLE or the RUN_OUTPUT_VARIABLE options for try_run
    to be omitted.


    If you have done that, created and completed a correct TryRunResults.cmake file
    for the target platform, you might consider adding this file to the sources of
    the project, so that it can be reused by others. These are per-target-toolchain.'
