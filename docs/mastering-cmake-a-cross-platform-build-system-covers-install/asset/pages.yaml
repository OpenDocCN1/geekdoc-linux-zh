    +   * Matches preceding pattern one or more times.


    +   * Matches preceding pattern zero or once.


    +   * Saves a matched expression and uses it in a later replacement.


    +   * Matches either the left or right side of the bar.


    Note that more than one of these meta-characters can be used in a single regular
    expression in order to create complex search patterns. For example, the pattern
    [^ab1-9] indicates to match any character sequence that does not begin with the
    characters "a" or "b" or numbers in the series one through nine. The following
    examples may help clarify regular expression usage:


    +   * The regular expression "^hello matches a "hello" at the beginning of a search
    string. It would match "hello there" but not "hi,nhello there".


    +   * The regular expression "long$" matches a "long" at the end of a search string.
    It would match "so long", but not "long ago".


    +   * The regular expression "t..t..g" will match anything that has a "t", then
    any two characters, another "t", any two characters, and then a "g". It would
    match "testing" or "test again", but not match "toasting".


    +   * The regular expression "[1-9ab]" matches any number one through nine, and
    the characters "a" and "b". It would match "hello 1" or "begin", but would not
    match "no-match".


    +   * The regular expression "[^1-9ab]" matches any character that is not a number
    one through nine, or an "a" or "b". It would NOT match "lab2" or "b2345a", but
    would match "no-match".


    +   * The regular expression "br* " matches something that begins with a "b",
    is followed by zero or more "r"s, and ends in a space. It would match "brrrr "
    and "b \ but not match "brh".


    +   * The regular expression "br+ " matches something that begins with a "b",
    is followed by one or more "r"s, and ends in a space. It would match "brrrr "
    and "br ", but not match "b " or "brh".


    +   * The regular expression "br? " matches something that begins with a "b",
