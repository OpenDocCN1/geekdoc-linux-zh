    likewise if you write


    ```

    if (fubar AND sol)

    ```


    CMake will conveniently treat it as


    ```

    if ("${fubar}" AND "${sol}")

    ```


    The later is really the correct way to write it, but the former will work as well.
    Only some operations in the if statement have this special handling of arguments.
    The specific details follow:


    +   1) The left hand argument to MATCHES is first checked to see if it is a defined
    variable, if so the variable''s value is used, otherwise the original value is
    used.


    +   2) If the left hand argument to MATCHES is missing it returns false without
    error


    +   3) Both left and right hand arguments to LESS GREATER EQUAL are independently
    tested to see if they are defined variables, if so their defined values are used
    otherwise the original value is used.


    +   4) Both left and right hand arguments to STRLESS STQUAL STRGRE are independently
    tested to see if they are defined variables, if so their defined values are used
    otherwise the original value is used.


    +   5) Both left and right hand arguments argumemnts to VERSION_LESS VERSION_EQUAL
    VERSION_GREATER are independently tested to see if they are defined variables,
    if so their defined values are used otherwise the original value is used.


    +   6) The right hand argument to NOT is tested to see if it is a boolean constant,
    if so the value is used, otherwise it is assumed to be a variable and it dereferenced.


    +   7) The left and right hand arguments to AND OR are independently tested to
    see if they are boolean constants, if so they are used as such, otherwise they
    are assumed to be variables and are dereferenced.


