    must fail with an informative message.


    All policies in CMake are assigned a name of the form CMPNNNN where NNN is an
    integer value. Policies typically support both an old behavior that preserves
    compatibility with earlier versions of CMake, and a new behavior that is considered
    correct and preferred for use by new projects. Every policy has documentation
    detailing the motivation for the change, and the old and new behaviors


    # Setting Policies


    Projects may configure the setting of each policy to request old or new behavior.
    When CMake encounters user code that may be affected by a particular policy it
    checks whether the project has the policy. If the policy has been set (to OLD
    or NEW) CMake follows the behavior specified. If the policy has not been set then
    the old behavior is used, but a warning is issued telling the project author to
    set the policy.


    There are a couple ways to set the behavior of a policy. The quickest way is to
    set all policies to a version corresponding to the release version of CMake for
    which the project was written. Setting the policy version requests the new behavior
    for all policies introduced in the corresponding version of CMake or earlier.
    Policies introduced in later versions are marked as not set in order to produce
    proper warning messages. The policy version is set using the `cmake_policy` VERSION
    signature. For example, the code


    ```

    cmake_policy (VERSION 2.6)

    ```


    will request the new behavior for all policies introduced in CMake 2.6 or earlier.
    The `cmake_minimum_required` command will also set the policy version, which is
    convenient for the use at top of projects. A project should typically begin with
