    \ be defined for running a test. If set to a list of environment variables and\
    \ values of the form MYVAR=value those environment variables will be defined while\
    \ the test is running. The environment is restored to its previous state after\
    \ the test is done.\n\n# LABELS\n\nSpecify a list of test labels associated with\
    \ a test. These labels can be used to group tests together based on what they\
    \ test. For example you could add a label of MPI to all tests that execute MPI\
    \ code.\n\n# WILL_FAIL\n\nIf this option is set to true, then the test will pass\
    \ if the return code is not 0 and fail if it is. This reverses the third condition\
    \ of the pass requirements.\n\n# PASS_REGULAR_EXPRESSION\n\nIf this option is\
    \ specified, then the output of the test is checked against the regular expression\
    \ provided (a list of regular expressions may be passed in as well). If none of\
    \ the regular expressions match, then the test will fail. If at least one of them\
    \ matches, then the test will pass.\n\n# FAIL_REGULAR_EXPRESSION\n\nIf this option\
    \ is specified, then the output of the test is checked against the regular expression\
    \ provided (a list of regular expressions may be passed in as well). If none of\
    \ the regular expressions match, then the test will pass. If at least one of them\
    \ matches, then the test will fail.\n\nIf both PASS_REGULAR_EXPRESSION and FAIL_REGULAR_EXPRESSION\
    \ are specified, the FAIL_REGULAR_EXPRESSION takes precedence. The following example\
    \ illustrates using the PASS_REGULAR_EXPRESSION and FAIL_REGULAR_EXPRESSION:\n\
    \n```\nadd_test (outputTest ${EXECUTABLE_OUTPUT_PATH}/outputTest)\nset (passRegex\
    \ \"^Test passed\" \"^All ok\")nset (failRegex \"Error\" \"Fail\")nset_property\
    \ (outputTest)\n  PROPERTY PASS_REGULAR_EXPRESSION \"${passRegex}\"\nset_property\
