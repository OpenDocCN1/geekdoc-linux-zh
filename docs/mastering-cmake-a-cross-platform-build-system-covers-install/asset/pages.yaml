    The same idea can be used with a batch file on Windows. The second way is to create
    a file to be loaded using CMake''s -c option. In this case instead of setting
    up the cache with -D options it is done though a file that is parsed by CMake.
    The syntax for this file is standard CMakeLists syntax and it is typically just
    a series of set commands as:


    ```

    # Build the vtkHybrid kit

    set (VTK_USE_HYBRID ON CACHE BOOL "doc string")

    ```


    In some cases there might be an existing cache and you want to force the cache
    values to be a certain way. For example you want to turn Hybrid on even if the
    user has previously run CMake and turned it off. Then you can do:


    ```

    # Build the vtkHybrid kit always.

    set (VTK_USE_HYBRID ON CACHE BOOL "doc" FORCE)

    ```


    Another option is that you want to set and hide options so the user will not be
    tempted to adjust them later on. This can be done using the following commands:


    ```

    # Build the vtkHybrid kit always and don''t distract

    # the user by showing the option.

    set (VTK_USE_HYBRID ON CACHE INTERNAL "doc" FORCE)

    mark_as_advanced (VTK_USE_HYBRID)

    ```


    You might be tempted to edit the cache file directly, or to "initialize" a project
    by giving it an initial cache file. This may not work and cause additional problems
    in the future. First, the syntax of the CMake is subject to change. Second, cache
    files have full paths in them that make them unsuitable for moving between binary
    trees. So if you want to initialize a cache file use one of the two standard methods
    described above.'
