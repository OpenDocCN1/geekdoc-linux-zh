    Overall the layout of the rest of this script is similar to the traditional one.
    There are several settings that CTest will use to perform its tasks. unlike with
    traditional CMake, there are the actual tasks that CTest will perform. Instead
    of providing information in the project''s CMake cache, in this scripting mode,
    all the information is provided to CTest. For compatibility reasons we may choose
    to write the information to the cache, but that is up to the dashboard maintainer.
    The first block contains the variables about the submission.


    ```

    set (CTEST_SITE) "andoria.kitware"

    set (CTEST_BUILD_NAME) "Linux-g++"

    set (CTEST_NOTES_FILES) "${CTEST_SCRIPT_DIRECTORY}/${CTEST_SCRIPT_NAME}"

    ```


    These variables serve the same role as the SITE and BUILD_NAME variables. We use
    them to identify the system once it submits the results to the dashboard. CTEST_NOTES_FILES
    is a list of files that should be submitted as the notes of the dashboard submission.
    This variable corresponds to the -A flag of CTest.


    The second block describes the information that CTest handlers will use to perform
    the tasks:


