- img_proc: true
  md: 'Each Find<XX>.cmake module defines a set of variables that will allow a project
    to use the software package once it is found. Variables all start with the name
    of the software being found <XX>. With CMake we have tried to establish a convention
    for naming these variables, but you should read the comments at the top of the
    module for a more definitive answer. The following variables are used by convention
    when needed:


    <XX>INCLUDE_DIRS

    Where find the package''s header files, typically <XX>.h, etc.


    <XX>LIBRARIES

    The libraries to link against use as <XX>. These include full paths.


    <XX>DEFINITIONS

    Preprocessor definitions to use when compiling code that uses <XX>.


    <XX>EXECUTABLE

    Where to find the <XX> tool that is part of the package.


    <XX>_<YY>EXECUTABLE

    Where to find the <YY> tool that comes with <XX>.


    <XX>ROOT_DIR

    Where to find the base directory of the installation of <XX>. This is useful for
    large packages where you want to reference many files relative to a common base
    (or root) directory.


    <XX>VERSION_<YY>

    Version <YY> of the package was found if true. Authors of find modules should
    make sure at most one of these is true. For example TCL_VERSION_84


    <XX>_<YY>FOUND

    If false, then the optional <YY> part of <XX> package is not available.


    <XX>FOUND

    Set to false, or undefined, if we haven''t found or don''t want to use <XX>.


    Not all of the variables are present in each of the FindXX.cmake files. However,
    <XX>FOUND should exist under most circumstances. If <XX> is a library, then <XX>LIBRARIES
    should also be defined, and <XX>INCLUDE_DIR should usually be defined.'
