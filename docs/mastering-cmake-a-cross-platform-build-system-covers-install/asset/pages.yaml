    Command2 produces widget.h and bar.h

    ```


    There are a few approaches that can be used in this case. In some cases you might
    just combine both commands and all three outputs into a single custom command,
    so that whenever one output is required all three are built at the same time.
    You could also create three custom commands, one for each unique output. The custom
    command for foo.h would invoke Command1 while the one for widget.h would invoke
