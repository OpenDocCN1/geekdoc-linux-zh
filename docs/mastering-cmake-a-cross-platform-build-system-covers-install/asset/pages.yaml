  md: '# Advanced CTest Scripting


    # Limitations of Traditional CTest Scripting


    Let us start with the limitations of traditional CTest scripting. The first limitation
    is that the dashboard will always fail if the Configure step fails. The reason
    for that is that the input files for CTest are actually generated by the Configure
    step. To make things worse, the update step will not happen and the dashboard
    will be stuck. To prevent this, an additional update is necessary. This can be
    achieved by adding CTEST_EXTRA_UPDATES_1 variable with `-D yesterday" or similar
    flag. This will update the repository for doing a dashboard. Since it will update
    to yesterday''s time stamp, the actual update of CTest will find the files that
    were modified since the previous day.


    The second limitation of traditional CTest scripting is that it is not only scripting.
    We have control over what happens before the actual CTest run, but not what happens
    during or after. For example, if we want to run the testing and then the binaries
    somewhere, or if we want to build the project, do some extra tasks and run tests
    or something similar, we need to perform several complicated tasks, such as run
    CMake with -P option as a part of TEST_COMMAND.


    # Extended CTest Scripting


    To overcome the limitations of traditional CTest scripting, CTest provides an
    extended scripting mode. In this mode, the dashboard maintainer has access to
    individual CTest handlers. By running these handlers individually, she can develop
    relatively elaborate testing schemes. An example of an extended CTest script would
    be something like this:


    ```

    cmake_minimum_required (VERSION 2.2)


    set (CTEST_SITE "andoria.kitware")

    set (CTEST_BUILD_NAME "Linux-g++")

    set (CTEST_NOTES_FILES "${CTEST_SCRIPT_NAME}")


    set (CTEST_DASHBOARD_ROOT "${ENV{HOME}/Dashboards/My Tests")

    set (CTEST_SOURCE_DIRECTORY "${CTEST_DASHBOARD_ROOT}/CMake")

    set (CTEST_BINARY_DIRECTORY "${CTEST_DASHBOARD_ROOT}/CMake-gcc")


    set (CTEST_UPDATE_COMMAND "/usr/bin/cvs")

    set (CTEST_CONFIGURE_COMMAND "\${CTEST_SOURCE_DIRECTORY}/bootstrap\")

    set (CTEST_BUILD_COMMAND "/usr/bin/make -j 2")


    ctest_empty_binary_directory (${CTEST_BINARY_DIRECTORY})

    ```'
  merge: -1
  pgno: 211
- img_proc: true
  md: '```

    ctest_start (Nightly)

    ctest_update (SOURCE "${CTEST_SOURCE_DIRECTORY}")

    ctest_configure (BUILD "${CTEST_BINARY_DIRECTORY}")

    ctest_build (BUILD "${CTEST_BINARY_DIRECTORY}")

    ctest_test (BUILD "${CTEST_BINARY_DIRECTORY}")

    ctest_submit ()

    ```


    The first line is to make sure an appropriate version of CTest is used, the advanced
    scripting was introduced in CTest 2.2. The CMake parser is used, and so all scriptable
    commands from CMake are available. This includes the `cmake_minimum_required`
    command:


    ```

    cmake_minimum_required (VERSION 2.2)

