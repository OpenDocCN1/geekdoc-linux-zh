    # Installing Prerequisite Shared Libraries


    Executables are frequently built using shared libraries as building blocks. When
    you such an executable, you must also install its prerequisite "prerequisites"
    because the executable requires its presence in order to load and run properly.
    The three main sources for shared libraries are the operating system itself, the
    built products of your own project and third party libraries belonging to an external
    project. The ones from the operating system may be relied upon to be present without
    installing anything: they are on the base platform on which your executable runs.
    The builds in your own project presumably add library build rules in the CMakeLists
    files, and so it should be straightforward to create install rules for them. It
    is the third party libraries that frequently become a high maintenance item when
    there are more than a handful of or when the set fluctuates from version to version
    of the third party project. Libraries may be added, code may be reorganized, and
    the third party libraries themselves may actually have additional prerequisites
    that are not obvious at glance.


    CMake provides two modules to make it easier to deal with required shared libraries.
    The first module, GetPrerequisites.cmake, provides the get_prerequisites function
    to analyze and classify the prerequisite shared libraries upon which an executable
    depends. Given an executable as input, it will produce a list of the shared libraries
    required to run that executable, including any prerequisites of the discovered
    shared libraries. It uses native tools on the various underlying platforms to
    perform this analysis: dumpbin (Windows), otool (Mac) and ldd (Linux). The second
    module, BundleUtilities.cmake, provides the fixup_bundle function to fix prerequisite
    shared libraries using well-defined locations to the executable. For Mac applications,
    it embeds the libraries inside the bundle, fixing them up with install_name_tool
