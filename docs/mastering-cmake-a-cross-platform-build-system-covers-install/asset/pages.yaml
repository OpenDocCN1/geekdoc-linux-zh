    # Sites


    CDash refers to a site as an individual machine submitting at least one build
    to a given project. A site might submit multiple builds (e.g. nightly and continuous)
    to multiple projects stored in CDash.


    In order to see the site description, click on the name of the site from the main
    dashboard page for a project. The description of a site includes information regarding
    the processor type and speed as well as the amount of memory available on the
    given machine. The description of a site is automatically sent by CTest, however
    in some cases it might be required to manually edit it. Moreover, if the machine
    is upgraded, the memory is upgraded; CDash keeps track of the history of the description,
    allowing users to compare performance before and after the upgrade.


    Sites usually belong to one maintainer, responsible for the submissions to CDash.
    It is important for site maintainers to be warned when a site is not submitting
    as it could be related to a configuration issue. In order to claim a site, a maintainer
    should


    +   Log into CDash


    +   Click on a dashboard containing at least one build for the site


    +   Click on the site name to open the description of the site


    +   Click on [claim this site]


    Once a site is claimed, its maintainer will receive emails if the client machine
    does not submit for an unknown reason, assuming that the site is expected to submit
    nightly. Furthermore, the site will appear in the "My Sites" section of the maintainer''s
    profile, facilitating a quick check of the site''s status.


    Another feature of the site page is the pie chart showing the load of the machine.
    Assuming that a site submits to multiple projects, it is usually useful to know
    if the machine has room for other submissions to CDash. The pie chart gives an
    overview of the machine submission time for each project.'
