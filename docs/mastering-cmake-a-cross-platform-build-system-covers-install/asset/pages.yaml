  md: '# Porting CMake to New Platforms and Languages


    In order to generate build files for a particular system, CMake needs to determine
    what system is running on, and what compiler tools to use for enabled languages.
    To do this CMake loads a series of files containing CMake code from the Modules
    directory. This all has to happen before the first try-compile or try-run is executed.
    To avoid having to re-compute all of this information for each try-compile and
    for subsequent runs of CMake, the discovered values are stored in several configured
    files that are read each time CMake is run. These files are also copied into the
    try-compile and try-run directories. This will describe how this process of system
    and tool discovery works. An understanding of the process is necessary to extend
    CMake to run on new platforms, and to add support for new languages.


    # 11.1 The Determine System Process


    The first thing CMake needs to do is to determine what platform it is running
    on and what the target platform is. Except for when you cross compiling the host
    platform and the target platform are identical. The host platform is determined
    by loading the CMakeDetermineSystem.cmake file. On POSIX systems,uname" is used
    to get the name of the system. CMake_HOST_SYSTEM_NAME is set to the result of
    uname -s, and CMake_HOST_SYSTEM_VERSION is set to the result of uname -r. On Windows
    systems, CMake_HOST_SYSTEM_NAME is set to Windows and CMake_HOST_SYSTEM_VERSION
    is set to the value returned by the system function GetVersionEx. The variable
    CMake_HOST_SYSTEM is set to a combination of CMake_HOST_SYSTEM_NAME and CMake_HOST_SYSTEM_VERSION
    as follows:'
  merge: -1
  pgno: 239
- img_proc: true
  md: '```

    $ (CMAKE_HOST_SYSTEM_NAME)-$(CMAKE_HOST_SYSTEM_VERSION)

    ```


    Once the CMAKE_SYSTEM information has been determined, CMakeSystem.cmake.in is
    configured into $(CMAKE_BINARY_DIR)/CMakeFiles/CMakeSystem.cmake. CMake variables
    prior to 2.6.0 did not support cross compiling, and only the CMAKE_SYSTEM_* set
    of variables was available.


    # 11.2 The Enable Language Process


    After the language has been determined, the next step is to enable all languages
    specified in the project command. For each language specified CMake CMakeDetermine
    (LANG) Compiler.cmake where LANG is the name of the language specified in the
    project command. For example with project (Fortran) the file is called CMakeDetermineFortranCompiler.cmake.
    This file discovers the compilers and tools that will be used to compile files
    for the particular language. Starting with version 2.6.0 CMake tries to identify
    the compiler for C, C++ and Fortran not only by its filename, but by compiling
    some source code, which is named (LANG) CompilerId.(LANGSUFFIX). If this succeeds,
    it will return a unique id for every compiler supported by CMake. Once the compiler
    has been determined for a language, CMake configures the file CMake (LANG) Compiler.cmake
    into CMake (LANG) Compiler.cmake.


    After the platform and compiler tools have been determined, CMake loads CMakeSystemSpecificInformation.cmake
    which in turn will load $(CMAKE_HOST_SYSTEM_NAME).cmake from the platform subdirectories
    of modules if it exists for the platform. An example with SunOS. This file contains
    OS information about compiler flags, creation of executables, libraries, and object


    Next, CMake loads CMake (Information).cmake for each LANG that was enabled. This
    file performs in two loads; $(CMAKE_SYSTEM_NAME)-$(COMPILER_ID)-LANG'
