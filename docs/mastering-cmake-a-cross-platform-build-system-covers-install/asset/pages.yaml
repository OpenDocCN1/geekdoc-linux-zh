    # CMake Command Line Options


    ```

    cmake [options] <path-to-source>

    cmake [options] <path-to-existing-build>

    ```


    The "cmake" executable is the CMake command-line interface. It may be used to
    configure projects in scripts. Project configuration settings may be specified
    on the command line with the -D option. The -i option will cause cmake to interactively
    prompt for such settings.


    -C <initial-cache>: Pre-load a script to populate the cache.


    When cmake is first run in an empty build tree, it creates a CMakeCache.txt file
    and populates it with customizable settings for the project. This option may be
    used to specify a file from which to load cache entries before the first pass
    through the project''s CMakefiles. The loaded entries should be a CMake script
    that use the SET CACHE option, not a cache-format file.


    -D <var>:<type>=<value>: Create a cmake cache entry.


    When cmake is first run in an empty build tree, it creates a CMakeCache.txt file
    and populates it with customizable settings for the project. This option may be
    used to specify a setting that takes priority over the project''s default value.
    The option may be repeated for as many cmake entries as desired.


    -U <globbing_expr>: Remove matching entries from CMake cache.'
