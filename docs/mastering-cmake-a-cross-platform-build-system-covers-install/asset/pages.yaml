    # ## 4.11 Installing Files


    Software is typically installed into a directory separate from the source and
    build trees. It allows it to be distributed in a clean form and isolates users
    from the details of the build process. CMake provides the `install` command to
    specify how a project is to be installed. This command is invoked by a project
    in the CMakeLists file and tells CMake how to generate installation scripts. The
    scripts are executed at install time to perform the actual installation of files.
    For Makefile generators (UNIX, NMake, Borland, MinGW, etc.), the user simply runs
    `make install` (or `cmake install`) and the make tool will invoke CMake''s installation
    module. With GUI based systems (Visual Studio, Xcode, etc.) the user simply builds
    the target called `INSTALL`.


    Each call to the `install` command defines some installation rules. Within one
    CMakeLists file (source directory) these rules will be evaluated in the order
    in which the corresponding commands are invoked. The order across multiple directories
    is not specified.


    The `install` command has several signatures designed for common installation
    use cases. A particular invocation of command specifies the signature as the first
    argument. The signatures are `TARGETS, FILES, PROGRAMS, DIRECTORY, SCRIPT,` and
    `CODE`.


    install (TARGETS ...)


    Install the binary files corresponding to targets built inside the project.


    install (FILES ...)


    General-purpose file installation. It is typically used for installation of header
    files, documentation, and data files required by your software.


    install (PROGRAMS ...)


    Installs executable files not built by the project, such as shell scripts. It
    is identical to `install (FILES)` except that the default permissions of the installed
    file include the executable bit.'
