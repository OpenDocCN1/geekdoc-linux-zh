    # Installation Types (NSIS Only)


    When a project contains a large number of components, it is common for a Windows
    installer to provide pre-selected sets of components based on specific user needs.
    For example, a user wanting to develop software against a library will want one
    set of components, while an end user might use an entirely different set. CPack
    supports this notion of pre-selected component sets via installation types. An
    installation type is, simply, a set of components. When the user selects an installation
    type, exactly that set of components is selected—then the user is permitted to
    further customize their installation as desired. Currently this is only supported
    by the Windows NSIS generator.


    For our simple example, we will create two installation types: a "Full" installation
    type that contains all of the components, and a "Developer" installation type
    that includes only the libraries and headers. To do this, we use the function
    cpack_add_install_type to add the types.


    ```

    cpack_add_install_type (Full DISPLAY_NAME "Everything"

    cpack_add_install_type (Developer)

    ```


    Next, we set the INSTALL_TYPES property of each component to state which installation
    types will include that component. This is done with the INSTALL_TYPES option
    to the cpack_add_component function.


    ```

    cpack_add_component(libraries DISPLAY_NAME "Libraries"

    DESCRIPTION

    "Static libraries used to build programs with MyLib"

    GROUP Development

    INSTALL_TYPES Developer Full

    cpack_add_component(applications)

    ```'
