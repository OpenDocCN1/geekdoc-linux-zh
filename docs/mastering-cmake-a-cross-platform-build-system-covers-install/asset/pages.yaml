    \nif( DEFINED current_time )\n  message(STATUS \"The time is now: ${curret_time}\"\
    )\nendif()\n```\n\nNote that in this example _time is used to pass the name of\
    \ the return variable. The set command is invoked with the value of _time, which\
    \ in this example will be current_time. Finally the set command uses the PARENT_SCOPE\
    \ option to set that variable in the parent's scope instead of the local scope.\n\
    \nMacros are defined and called in the same manner as functions. The main differences\
    \ are that a macro does not push and pop a new variable scope, and the arguments\
    \ to a macro are not treated as variables but are string replaced prior to execution.\
    \ This is very like the differences between a macro and a function in C or C++.\
    \ The first argument is the name of the macro to create. All additional arguments\
    \ are formal parameters to the macrof."
