    A few final points should be made concerning variables and their interaction with
    the cache. If a variable is in the cache, it can be set overridden in a CMakeLists.txt
    file using the set command. Cache values are checked only if the variable is not
    found in the current cmMakefile instance before CMakeLists processing begins.
    The set command will set the variable for processing the current CMakeLists file
    (and subdirectories as usual) without changing the value in the cache.


    ```

    # assume that FOO is set to ON in the cache


    set (FOO OFF)

    # set foo to OFF for processing this CMakeLists file

    # and subdirectories; the value in the cache stays ON

    ```


    Once a variable is in the cache, its "cache" value cannot normally be modified
    by a CMakeLists file. The reasoning behind this is that once CMake put the variable
    into the cache with its initial value, the user may then modify that value from
    the GUI. If the next invocation of CMake would overwrite their change back to
    the set value, the user would never be able to make a change that CMake couldn''t
    overwrite. A set (FOO ON CACHE "doc") will typically only do something when the
    cache doesn''t have the variable in it. Once the variable is in the cache, that
    command will have no effect.'
