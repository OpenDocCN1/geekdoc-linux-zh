    project from using an older build system to use CMake. In many cases this can
    be a fairly easy process, but there are a few issues to consider. This section
    will address those issues and provide some suggestions for effectively converting
    a project over to CMake. The first issue to consider when converting to CMake
    is the project''s directory structure.


    # 7.1 Source Code Directory Structures


