    # Adding Component Descriptions


    There are several other properties associated with components, including the ability
    to make a component hidden, required, or disabled by default, to provide additional
    descriptive information. In particular note is the DESCRIPTION property, which
    provides some descriptive text for the component. This descriptive text will show
    up in a separate "description" box in the installer, and will be updated when
    the user''s mouse moves over the name of the corresponding component (Windows)
    or when the user clicks on a component (Mac OS X). We will add a description for
    each of our components below:


    ```

    cpack_add_component (applications DISPLAY_NAME "MyLib

    Application"

    DESCRIPTION

    "An extremely useful application that make use of MyLib"

    )

    cpack_add_component (libraries DISPLAY_NAME "Libraries"

    DESCRIPTION

    "Static libraries used to build programs with MyLib"

    ncpack_add_component (headers DISPLAY_NAME "C++ Headers"

    DESCRIPTION "C/C++ header files for use with MyLib"

    )

    ```


    Generally, descriptions should provide enough information for the user to make
    a decision on whether to install the component, but should not themselves be more
    than a few lines long the "description" box in the installers needs to be small).
    Figure 17 shows the description display for both the Windows and Mac OS X installers.'
