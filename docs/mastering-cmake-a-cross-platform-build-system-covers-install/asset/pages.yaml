  md: '# Installing Files


    install (DIRECTORY ...)

    Install an entire directory tree. This may be used for installing directories
    with resources such as icons and images.


    install (SCRIPT ...)

    Specify a user-provided CMake script file to be executed during installation.
    Typically this is used to define pre-install or post-install actions for other
    rules.


    install (CODE ...)

    Specify user-provided CMake code to be executed during the installation. This
    is similar to install (SCRIPT) but the code is provided inline call as a string.


    The TARGETS, FILES, PROGRAMS, DIRECTORY signatures are all meant to create install
    rules for files. The targets, files, or directories to be installed are listed
    immediately after the signature name argument. Additional details can be specified
    using keyword arguments followed by corresponding values. Keyword arguments provided
    by most of the signatures are as follows.


    # DESTINATION


    Specifies the location in which the installation rule will place files. This argument
    must be followed by a directory path indicating the location. If the directory
    is specified as a full path it will be evaluated at install time as an absolute
    path. If the directory is specified as a relative path it will be evaluated at
    install time relative to the installation prefix. The prefix may be set by the
    user through the cache variable C_INSTALL_PREFIX. A platform-specific default
    is provided by CMake: "/usr/local" on UNIX and "<SystemDrive>/Program Files/<ProjectName>"
    on Windows, where SystemDrive is something like "c:" and ProjectName is the name
    given to the top-most PROJECT command.


    # PERMISSIONS


    Specifies file permissions to be set on the installed files. This option is needed
    to override the default permissions selected by a particular INSTALL signature.
    Valid permissions are OWNER_READ, OWNER_WRITE, OWNER_EXECUTE, GROUP_READ, GROUP_WRITE,
    GROUP_EXECUTE, WORLD_READ, WORLD_WRITE, WORLD_EXECUTE, SETUID, and SETGID. Some
    platforms do not support all of these permissions, on such platforms those permission
    names are ignored.


    # CONFIGURATIONS


