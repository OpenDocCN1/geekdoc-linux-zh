    CPack: Build binary and source package installers


    The CPack module generates binary and source installers in a variety of formats
    using the Cpack program. Inclusion of the CPack module adds two new targets to
    the resulting Makefiles, package and package_source, which build the binary and
    source installers, respectively. The generated binary installers contain everything
    installed via CMake''s INSTALL command (and the deprecated INSTALL_FILES, INSTALL_PROGRAMS,
    and INSTALL_TARGETS commands).


    For certain kinds of binary installers (including the graphical installers on
    Mac OS and Windows), CPack generates installers that allow users to select individual
    application components to install. The contents of each of the components are
    identified by the COMPONENT argument of CMake''s INSTALL command. These components
    can be annotated with user-friendly names and descriptions, inter-component dependencies,
    etc., and grouped in various ways to customize the resulting installer. See the
    cpack_add* commands, described below, for more information about component-specific
    installations.


    Before including the CPack module, there is a variety of variables that can be
    set to customize the resulting installers. The most commonly-used variables are:


    CPACK_PACKAGE_NAME


    The name of the package (or application). If not specified, defaults to the project
    name.


    CPACK_PACKAGE_VENDOR


    The name of the package vendor (e.g. "Kitware").


    CPACK_PACKAGE_VERSION_MAJOR


    Package major Version


    CPACK_PACKAGE_VERSION_MINOR


    Package minor Version'
