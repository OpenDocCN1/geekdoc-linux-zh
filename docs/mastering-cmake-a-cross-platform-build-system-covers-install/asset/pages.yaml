    # 12.4 Adding System Introspection (Step 4)


    Next us consider adding some code to our project that depends on features the
    target platform may not have. For this example we will add some code that depends
    on whether or not the target platform has the log and exp functions. Of course
    almost every platform has these functions but for this tutorial assume that they
    are less common. If the platform has log then we will use it to compute the square
    root in the mysql function. We first test for the availability of these functions
    using the CheckFunctionExists.cmake macro in the top level CMakeLists files as
    follows:


    ```

    # does this system provide the log and exp functions?

    include (CheckFunctionExists.cmake)

    check_function_exists (log HAVE_LOG)

    check_function_exists (exp HAVE_EXP)

    ```


