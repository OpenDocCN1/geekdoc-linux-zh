  md: "```\nif (Boost_FOUND)\n    include_directories(${Boost_INCLUDE_DIRS})\n   \
    \ add_executable(foo.cc)\n    target_link_libraries(foo $(Boost_LIBRARIES))\n\
    endif\n```\n\nThe components list needs to contain actual names of boost libraries\
    \ only, such as \"date_time\" for \"libboost_date_time\". If you're using parts\
    \ of Boost that contain header files only (e.g. foreach) you do not need to specify\
    \ COMPONENTS.\n\nYou should provide a minimum version number that should be used.\
    \ If you provide this version number and specify the REQUIRED attribute, this\
    \ module will fail if it can't find the specified or a later version. If you specify\
    \ a version number this is automatically put into the considered list of version\
    \ numbers doesn't need to be specified in the Boost_ADDITIONAL_VERSIONS variable\
    \ (see below).\n\nNOTE for Visual Studio Users: Automatic linking is used on MSVC\
    \ & Borland compilers by default when including things in Boost. It's important\
    \ to note that setting Boost_USE_STATIC_LIBS to OFF is NOT enough to get dynamic\
    \ linking, you need this feature. Automatic linking typically uses static libraries\
    \ with a few exceptions (Boost.Python is one).\n\nPlease see the section below\
    \ near Boost_LIB_DIAGNOSTIC_DEFINITIONS for more details. Adding a TARGET_LINK_LIBRARIES()\
    \ as shown in the example above appears to cause VS to link dynamically if Boost_USE_STATIC_LIBS\
    \ gets set to OFF. It is suggested to avoid automatic linking since it will make\
    \ your application less portable.\n\n# Boost_ADDITIONAL_VERSIONS\n\nOK, so the\
    \ Boost_ADDITIONAL_VERSIONS variable can be used to specify a list of boost version\
    \ numbers that should be taken into account when searching for Boost. Unfortunately\
    \ Boost puts the version number into the actual filename for the libraries, this\
    \ variable will certainly be needed in the future when new Boost versions are\
    \ released.\n\nCurrently this module searches for the following version numbers:\
    \ 1.33, 1.33.0, 1.33.1, 1.34.0, 1.34.1, 1.35, 1.35.0, 1.35.1, 1.36, 1.36.0, 1.36.1,\
    \ 1.37, 1.37.0, 1.38, 1.38.0, 1.39.0, 1.40, 1.40.0\n\nNOTE: If you add a new major\
