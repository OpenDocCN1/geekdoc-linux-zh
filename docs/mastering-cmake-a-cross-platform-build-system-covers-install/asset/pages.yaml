  md: '# CMP0005


    The OLD behavior for this policy is to silently remove leading and trailing whitespace.

    The NEW behavior for this policy is to diagnose the existence of such whitespace
    as an error.

    The setting for this policy used when checking the library names is in effect
    when the target is created by an add_executable or add_library command.


    This policy was introduced in CMake version 2.6.0. CMake version 2.8.0-rc2 warns
    when the policy is not set and uses OLD behavior. Use the cmake_policy command
    to set it to OLD or NEW explicitly.


    # CMP0005: Preprocessor definition values are not escaped automatically.


    This policy determines whether or not CMake should generate escaped preprocessor
    definition values added via add_definitions. CMake versions 2.4 and below assumed
    that only trivial values would be given for macros in add_definitions calls. It
    did not attempt to escape non-trivial values such as string literals in generated
    build rules. CMake versions 2.6 and above support escaping of most values, but
    cannot assume the user has used escapes already in an attempt to work around limitations
    in earlier versions.


    The OLD behavior for this policy is to place definition values given to add_definitions
    directly in the generated build rules without attempting to escape anything. The
    NEW behavior for this policy is to generate correct escapes for all native build
    tools automatically. See documentation of the COMPILE_DEFINITIONS target property
    for limitations of the escaping implementation.


    This policy was introduced in CMake version 2.6.0. CMake version 2.8.0-rc2 warns
    when the policy is not set and uses OLD behavior. Use the cmake_policy command
    to set it to OLD or NEW explicitly.


    # CMP0006: Installing MACOSX_BUNDLE targets requires a BUNDLE DESTINATION.


    This policy determines whether the install(TARGETS) command must be given a BUNDLE
    DESTINATION when asked to install a target with the MACOSX_BUNDLE property. CMake
    2.4 and below did not distinguish application bundles from normal executables
    when installing targets. CMake 2.6 provides a BUNDLE option to the install(TARGETS)
    command that specifies rules specific to application bundles on the Mac. Projects
    should use this option when installing a target with the MACOSX_BUNDLE property.


    The OLD behavior for this policy is to fall back to the RUNTIME DESTINATION if
    a BUNDLE DESTINATION is not given. The NEW behavior for this policy is to produce
    an error if a bundle target is installed without a BUNDLE DESTINATION.


    This policy was introduced in CMake version 2.6.0. CMake version 2.8.0-rc2 warns
    when the policy is not set and uses OLD behavior. Use the cmake_policy command
    to set it to OLD or NEW explicitly.


    # CMP0007: list command no longer ignores empty elements.'
  merge: -1
