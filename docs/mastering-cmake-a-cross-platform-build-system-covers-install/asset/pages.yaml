  md: '# Writing CMakeLists Files


    means that shared libraries can link to other shared libraries when they are created
    in the same way as an executable. Unlike a static library where the atomic unit
    is the object file, for shared libraries, the entire library is the atomic unit.
    This can cause some unexpected linker errors when converting from static to shared
    libraries. If an object file is part of a static library, the executable linking
    to it does not use any of the symbols in object file, the file is excluded from
    the final linked executable. With shared libraries, all the object files that
    make up the library and all of the dependencies they require come as one. For
    example, suppose you used a library with object defining the DisplayOnWindow()
    which required the X11 library. If you linked an executable to that, but did not
    call the DisplayOnWindow() function, the static library version would not require
    X11, but the shared library version would require the X11 library. This is because
    a shared library has to be taken as one unit, and a static library is only an
    archive of object files from which linkers can choose which objects are needed.
    That static linked executables can be smaller, as they only contain the object
    code actually used.


    Another difference between shared and static libraries is order. With static libraries
    the order on the link line can make a difference. This is because most linkers
    use the symbols that are needed in a single pass over all the libraries. So, the
    order should go from the library that uses the most others to the library that
    uses none. CMake will preserve and remember the order of libraries and library
    dependencies of a project. This means that each library in a project should use
    the target_link_libraries command to specify all of the libraries that it depends
    on. The libraries will be linked with each other for shared builds, but not static
    builds. However, the link information is used in static builds when executables
    are linked. An executable that only links libA will link libA libB and libC as
    libA''s dependency on libB and libC was properly specified using target_link_libraries
    (libA libB libC).


    At this point, one might wonder why shared libraries would be preferred over static
    libraries. There are several reasons. First, shared libraries can decrease the
    compile/link/run cycle time. This is because the linker does not have to do much
    work when linking to shared libraries because there are fewer decisions to be
    made about object files to keep. Often, the executable does not even need to be
    re-linked after the shared library is rebuilt. So, developers can work on a library
    compiling and linking only the small part of the program that is currently being
    developed, and re-run the executable after each build of the shared library. Also,
    if a library is used by many different executables on a system, then there needs
    to be one copy of the library on disk, and often in memory too.


    In addition to the concept of a software library, shared libraries can also be
    used on many systems as run time loadable modules. This means that a program can
    run, load, and execute object code that was not part of the original software.
    This allows developers to create software that is both open and closed. (For more
    information see Object Oriented Software Construction by Bertrand Meyer.) Closed
    software is software that cannot be modified. It has been tested through a testing
    cycle and can be certified to perform tasks with regression'
