    created by an add_executable or add_library command. For the example described
    above,

    the code


    ```

    cmake_policy(SET CMP0003 OLD) # or cmake_policy (VERSION 2.4)

    add_executable(myexe myexe.c)

    target_link_libraries(myexe /path/to/libA.so B)

    ```


    will work and suppress the warning for this policy. It may also be updated to
    work with the

    corrected linking approach:


    ```

    cmake_policy(SET CMP0003 NEW) # or cmake_policy (VERSION 2.6)

    link_directories(/path/to) # needed to find library B

    add_executable(myexe myexe.c)

    target_link_libraries(myexe /path/to/libA.so B)

    ```


    Even better, library B may be specified with a full path:


    ```

    add_executable(myexe myexe.c)

    target_link_libraries(myexe /path/to/libA.so /path/to/libB.so)

    ```


    When all items on the link line have known paths CMake does not check this policy
    so it has

    no effect.


    Note that the warning for this policy will be issued for at most one target. This
    avoids

    flooding users with messages for every target when setting the policy once will
    probably fix

    ell targets.


    This policy was introduced in CMake version 2.6.0. CMake version 2.8.0-rc2 warns
    when the

    policy is not set and uses OLD behavior. Use the cmake_policy command to set it
    to OLD OR

    NEW explicitly.


    CMP0004: Libraries linked may not have leading or trailing whitespace.


    CMake versions 2.4 and below silently removed leading and trailing whitespace
    from libraries

    linked with code like


    ```

    target_link_libraries(myexe " A ")

    ```


    This could lead to subtle errors in user projects.'
