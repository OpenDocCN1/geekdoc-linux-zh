    Variables in CMake have a scope that is little different from most languages.
    When you set a variable it is visible to the current CMakeLists file or as well
    as any subdirectory’s CMakeLists files, any functions or macros that are invoked,
    and any files that are included using the INCLUDE command. When a new subdirectory
    is processed (or a function called) a new scope is created and initialized with
    the current value of all variables in the calling scope. Any new variables created
    in the child scope, or changes to existing variables, will not impact the parent
    scope. Consider the following example:


    ```

