  md: '# Setting Automated Dashboard Clients


    continuous dashboard then every continuous there has been a change in the source
    code will result in a complete build from scratch. For larger projects this can
    significantly limit the number of continuous dashboards that can be generated
    in a day, while not using it can result in build errors or omissions because it
    is not a clean build. Fortunately there is a compromise, if you set CEST_START_WITH_EMPTY_BINARY_DIRECTORY_ONCE
    to true CTest will with a clean binary directory for the first continuous build
    but not subsequent ones. Based on your settings for the duration this is easy
    to start with a clean build every morning, but use builds for the rest of the
    day.


    Another useful feature to use with a continuous dashboard is the -I option. A
    large project may have so many tests that running all tests limits how frequently
    a continuous dashboard can be generated. By adding -I ,7 (or -I ,5 etc) to the
    CEST_COMMAND value the continuous dashboard will only run every seventh test significantly
    reducing the time required between continuous dashboards. For example:


    ```

    # which ctest command to use for running the dashboard

    set (CEST_COMMAND "\${CTest_EXECUTABLE_NAME}" -D Continuous -I ,,7")

    ```


    As you can imagine there is a compromise to be made between the coverage of the
    continuous and the frequency of its updates. Depending on the size of your project
    and the compute resources at your disposal these variables can be used to tune
    a continuous dashboard to your needs. An example of a CTest script for a continuous
