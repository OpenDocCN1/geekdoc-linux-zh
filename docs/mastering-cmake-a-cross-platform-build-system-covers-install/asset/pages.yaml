  md: "as described in Section 0. Finally, Gromit must provide a package configuration\
    \ file in its installation tree so that outside projects can locate it with `find_package:`\n\
    \n```\n# Create and install package configuration and version files.\nconfigure_file\
    \ (\n  ${Gromit_SOURCE_DIR}/pkg/gromit-config.cmake.in\n  ${Gromit_BINARY_DIR}/pkg/gromit-config.cmake\
    \ @ONLY\n)\nconfigure_file (\n  ${Gromit_SOURCE_DIR}/gromit-config-version.cmake\n\
    \  ${Gromit_BINARY_DIR}/gromit-config-version.cmake @ONLY\n)\n```\n\n```\ninstall\
    \ (FILES ${Gromit_BINARY_DIR}/pkg/gromit-config.cmake\n  ${Gromit_BINARY_DIR}/gromit-config-version.cmake\n\
    \  DESTINATION lib/gromit-${version})\n```\n\nThis code configures and installs\
    \ the package configuration file and a corresponding package version file. The\
    \ package configuration input file `gromit-config.cmake` has the code:\n\n```\n\
    # Compute installation prefix relative to this file.\nget_filename_component (_\
    \ dir \"${CMAKE_CURRENT_LIST_FILE}\" PATH)\nget_filename_component (_prefix \"\
    ${dir}/../\" ABSOLUTE)\n\n# Import the targets.\ninclude (\"${_prefix}/lib/gromit-${version@}/gromit-targets.cmake\"\
