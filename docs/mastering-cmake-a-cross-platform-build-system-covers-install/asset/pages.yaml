  md: '# The Enable Language Process


    $${CMAKE_SYSTEM_PROCESSOR}-${COMPILER_ID}-LANG.cmake. if it exists, and after
    that ${CMAKE_SYSTEM_NAME}-${COMPILER_ID}-LANG.cmake. In these files COMPILER_ID
    references the compiler identification determined as described above. CMake(LANG)Information.cmake
    contains default rules for creating executables, libraries, and object files on
    UNIX systems. The defaults can be overridden by setting values in either ${CMAKE_SYSTEM_NAME}.cmake
    or ${CMAKE_SYSTEM_NAME}-${COMPILER_ID}-LANG.cmake.


    $${CMAKE_SYSTEM_NAME}-${COMPILER_ID}-LANG-${CMAKE_SYSTEM_PROCESSOR}.cmake is intended
    to be used only for cross compiling, it is loaded before ${CMAKE_SYSTEM_NAME}-${COMPILER_ID}-LANG.cmake,
    so variables can be set up which can then be used in the rule variables.


    In addition to the files with the COMPILER_ID in their name, CMake also supports
    these files using the COMPILER_BASE_NAME, COMPILER_BASE_NAME is the name of the
    compiler with no path information. For example c1 would be the COMPILER_BASE_NAME
    for the Microsoft Windows compiler, and Windows-cl.cmake would be loaded. If a
    COMPILER_ID exists, it will be preferred over the COMPILER_BASE_NAME, since on
    one side the same compiler can have different names, but there can be different
    compilers all with the same name. This means,


    ```

    $${CMAKE_SYSTEM_NAME}-${COMPILER_ID}-LANG-${CMAKE_SYSTEM_PROCESSOR}.cmake

    ```


    was not found, CMake tries


    ```

    $${CMAKE_SYSTEM_NAME}-${COMPILER_BASE_NAME}.cmake

    ```


    and if


    ```

    $${CMAKE_SYSTEM_NAME}-${COMPILER_ID}-LANG.cmake

    ```


    was not found, CMake tries


    ```

    $${CMAKE_SYSTEM_NAME}-${COMPILER_BASE_NAME}.cmake.

    ```


    CMake(LANG)Information.cmake and associated Platform files define special CMake
    variables, called rule variables. A rule variable consists of a list of commands
