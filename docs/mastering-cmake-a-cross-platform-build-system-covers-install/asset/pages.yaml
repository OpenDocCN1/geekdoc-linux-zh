  md: '# CMake with SWIG


    One example of how modules are used is to look at wrapping your C/C++ code in
    another language using SWIG (Simplified Wrapper and Interface Generator). swig.org
    is a tool that reads annotated C/C++ header files, and creates wrapper code (glue)
    in order to make the corresponding C/C++ libraries available to other programming
    languages such as Perl, Python, or Java. CMake supports SWIG with the find_package
    command. Although SWIG can be used from CMake using custom commands, the SWIG
    package provides several macros that make building SWIG projects with CMake simpler.
    To use the SWIG macros, you must first call the find_package command with the
    name SWIG. Then you need to include the file referenced by variable SWIG_USE_FILE.
    This will define several macros and set up CMake to easily build SWIG based projects.


    Two very useful macros are SWIG_ADD_MODULE and SWIG_LINK_LIBRARIES. SWIG_ADD_MODULE
    works like the add_library command in CMake. The command invoked like this:


    ```

    SWIG_ADD_MODULE (module_name language source2 ... sourceN)

    ```


    The first argument is the name of the module to create. The next argument is the
    target language SWIG is producing a wrapper for. The rest of the arguments consist
    of a list of source files used to create the shared module. The big difference
    is that SWIG .i interface files can be used directly as sources. The macro will
    create the custom commands to run SWIG, and generate the C or C++ wrapper code
    from the SWIG interface files. The sources can be regular C or C++ files that
    need to be compiled with the wrappers.


    The SWIG_LINK_LIBRARIES macro is used to link support libraries to the module.
    This macro is used depending on the language being wrapped by SWIG, the name of
    the module may be different. The actual name of the module is stored in a variable
    SWIG_MODULE_${name}_REAL_NAME where ${name} is the name passed into the SWIG_ADD_MODULE
    macro. For example, SWIG_ADD_MODULE(foo tcl foo.i) would create a variable called
    SWIG_MODULE_foo_REAL_NAME which would contain the name of the actual module created.


    Now consider the following example that uses the SWIG example found in SWIG under
    Examples/python/class.


    ```

    # Find SWIG and include the use swig file

    find_package (SWIG REQUIRED)

    include (${SWIG_USE_FILE})


    # Find Python library and add include path for python headers

    find_package (PythonLibs)

    include_directories(${PYTHON_INCLUDE_PATH})

    ```'
