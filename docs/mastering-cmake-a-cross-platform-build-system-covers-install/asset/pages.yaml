  md: '# The History of CMake


    # 1.1 The History of CMake


    CMake development began in 1999 as part of the Insight Toolkit (ITK, www.itk.org)
    funded by the US National Library of Medicine. ITK is a large software project
    that works on many platforms and can interact with many other packages. To make
    this powerful, easy to use, build tool was required. Having worked with build
    systems for projects in the past, the developers designed CMake to address these
    needs. Since then CMake has continuously grown in popularity, with many projects
    and developers adopting it for its ease of use and flexibility. Since 1999 CMake
    has been under active development and has matured to the point where it is a proven
    solution for a wide range of build issues. The most telling example of this is
    the successful adoption of CMake as the build system of the K Desktop Environment
    (KDE), arguably the largest open source software project in existence.


    One of the recent additions to CMake is the inclusion of software testing in the
    form of CTest. Part of the process of testing software involves building the software,
    installing it, and determining what parts of the software are appropriate for
    the current system. This makes CTest a logical extension of CMake as it already
    has most of this information. In a similar vein, a new CMake feature is CPack,
    which is designed to support cross platform distribution of software. It provides
    a cross approach to creating native installations for your software, making use
    of existing popular packages such as NSIS, RPM, Cygwin, and PackageMaker.


    Other recent additions to CMake include support for Apple’s Xcode IDE and support
    for Microsoft’s Visual Studio 10. With CMake, you write your input files you get
    support for new compilers and build systems for free because the support for them
    is built into new releases of CMake, not tied to your software distribution. Another
    recent addition to CMake is support for cross compiling to other operating systems
    or embedded devices. Many commands in CMake now properly handle the differences
    between the host system and the target platform when cross compiling.


    # 1.2 Why Not Use Autoconf?


    Before developing CMake its authors had experience with the existing set of available
    tools. Autoconf combined with automake provides some of the same functionality
    as CMake, but to use these tools on a Windows platform requires the installation
    of many additional tools not found natively on a Windows box. In addition to requiring
    a host of tools, autoconf can be difficult to use or extend and possible for some
    tasks that are easy in CMake. Even if you get autoconf and its required environment
    running on your system, it generates Makefiles that will force users to the command
    line. CMake on the other hand provides a choice, allowing developers to generate
    project files that can be used directly from the IDE to which Windows and Xcode
    developers are accustomed.'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'While autconf supports user specified options, it does not support dependent
    options where one option depends on some other property or selection. For example,
    in CMake you could have a user to enable multithreading be dependent on first
    determining the user’s system has multithreading support. CMake provides an interactive
    user interface, making it easy for the user to see what options are available
    and how to set them.


    For UNIX users, CMake also provides automated dependency generation that is not
    directly by autoconf. CMake’s simple input format is also easier to read and maintain
    than a combination of Makefile.in and configure.in files. The ability of CMake
    to remember and chain library information has no equivalent in autoconf/automake.


    # 1.3 Why Not Use JAM, qmake, SCons, or ANT?


    Other tools such as ANT, qmake, SCons, and JAM have taken different approaches
    to solving these problems and they have helped us shape CMake. Of the four, qmake,
    is the most similar to CMake although it lacks much of the system interrogation
    that CMake provides. CMake’s input format is more closely related to a traditional
    Makefile. ANT, JAM and SCons are also cross-platform although they do not support
    generating native projects. They break away from the traditional Makefile oriented
    input with ANT using XML, JAM using its own language, and SCons using Python.
    A number of these tools run the compiler directly, as opposed to letting the system’s
    build perform that task. Many of these tools require other tools such as Python
    or Java to be installed before they will work.


    # 1.4 Why Not Script It Yourself?


    Some projects use scripting languages such as Perl or Python to configure build
    processes. Although similar functionality can be achieved with systems like this,
    over-use of tools can make the build process of an Easter egg hunt than a simple-to-use
    build system. When building your software package users are forced to find and
    install 4.3.2 of this, and 3.2.4 of that, before they can even start the build
    process. To avoid that problem, it was decided that CMake would require no more
    tools than the software it was being used to build would require. At a minimum
    using CMake requires a C compiler, that compiler’s native build tools, and a CMake
    executable. CMake was written in C++, requires only a C++ compiler to build and
    precompiled binaries are available for most systems. Scripting it yourself also
    means you will not be generating native Xcode or Visual Studio workspaces, making
    Mac and Windows builds limited.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# 1.5 On What Platforms Does CMake Run?


    CMake runs on a wide variety of platforms including Microsoft Windows, Apple Mac
    OS X, and most UNIX or UNIX-like platforms. At the time of the writing of this
    book CMake was tested nightly on the following platforms: Windows 98/2000/XP/Vista/7,
    AIX, HPUX, IRIX, Linux, Mac OS X, Solaris, OSF, QNX, CYGWIN, MinGW, and FreeBSD.
    You can check www.cmake.org for a current list of tested platforms.


    Likewise, CMake supports most common compilers. It supports the GNU compiler on
    all CMake supported platforms. Other tested compilers include Visual Studio 6
    through 10, Intel C, SGI CC Mips Pro, Borland, Sun CC and HP aCC. CMake should
    work for most UNIX-style compilers out of the box. If the compiler takes arguments
    in a strange way, then see the section *Porting CMake to New Platform* on page
    241 for information on how to customize CMake for a new compiler.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Getting Started


    # 2.1 Getting and Installing CMake on Your Computer


    Before using CMake you will need to install or build the CMake binaries on your
    system. On many systems you may find that CMake is already installed, or is available
    for install with the standard package manager tool for the system. Cygwin, Debian,
    FreeBSD, Mac OS X Fink, and many others all have CMake distributions. If your
    system does not have a CMake package, you can find CMake precompiled for most
    common architectures at www.cmake.org. If you do not find binaries for your system
    precompiled, then you can build CMake from source. To build CMake you will need
    a modern C++ compiler.


    # UNIX and Mac Binary Installations


    If your system provides CMake as one of its standard packages, follow your system''s
    package installation instructions. If your system does not have CMake, or has
    an out of date version of CMake, you can download precompiled binaries from www.cmake.org.
    The binaries from www.cmake.org come in the form of a compressed tar file. The
    tar file contains a README and an enclosed tar file. The README file contains
    a manifest of the files contained in the enclosed tar file, and some instructions.
    To install, simply extract the tar file into a destination directory (typically
    `/usr/local`). However, it can be any directory, and does not require root privileges
    for installation.


    # Windows Binary Installation


    For Windows CMake has a NullSoft install file available for download from www.cmake.org.
    To install this, simply run the executable on the windows machine where you want
    to install CMake. You will be able to run CMake from the Start Menu after it is
    installed.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Building CMake Yourself


    If binaries are not available for your system, or binaries are not available for
    the version of CMake you wish to use, you can build CMake from the source code.
    You can obtain the CMake source code by following the instructions at www.cmake.org.
    Once you have the source code it can be built in two different ways. If you have
    a version of CMake on your system you can use it to build other versions of CMake.
    Generally the current development version of CMake can always be built from the
    previous release of CMake. This is how new versions of CMake are built on most
    Windows systems.


    The second way to build CMake is by running its bootstrap build script. To do
    this you change your directory into your CMake source directory and type


    ```

    ./bootstrap

    make

    make install

    ```


    The make step is optional since CMake can run directly from the build directory
    if desired. On UNIX, if you are not using the GNU C++ compiler, you need to tell
    the bootstrap script which compiler you want to use. This is done by setting the
    environment variable CXX. If you need to use any special flags with your compiler,
    set the CXXFLAGS environment variable. For example, on the SGI with the 7.3X compiler,
    you would build CMake like this:


    ```

    cd CMake

    (setenv CXX CC; setenv CXXFLAGS "-LANG:std"; ./bootstrap)

    make

    make install

    ```


    # Basic CMake Usage and Syntax


    Using CMake is simple. The build process is controlled by creating one or more
    CMakeLists files (actually CMakeLists.txt but this guide will leave off the extension
    in most cases) of the directories that make up a project. The CMakeLists files
    should contain the project description in CMake''s simple language. The language
    is expressed as a series of commands. Each command is evaluated in the order that
    it appears in the CMakeLists file. The commands have the


    ```

    command (args...)

    ```'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Hello World for CMake


    where command is the name of the command, args is a white-space separated list
    of arguments. (Arguments with embedded white-space should be double quoted.) CMake
    is insensitive to command names as of version 2.2. So where you see you use COMMAND
    or Command instead. Older versions of CMake only accepted uppercase commands


    CMake supports simple variables that can be either strings or lists of strings.
    Variables are referenced using a ${VAR} syntax. Multiple arguments can be grouped
    together into a list using the set command. All other commands expand the list
    as if they had been passed into the command with white-space separation. For example,
    set(Foo a b c) will result in setting the variable Foo to a b c, and if Foo is
    passed into another command command(a b c). If you want to pass a list of arguments
    to a command as if it were a single argument simply double quote it. For example
    arguments("${Foo}") would be invoked passing one argument equivalent to command("a
    b c").


    System environment variables and Windows registry values can be accessed directly
    in CMake. To access system environment variables the syntax $ENV{VAR} is used.
    CMake can also reference registry entries in many commands using a syntax of the
    form [HKEY_CURRENT_USER\\Software\\path1\\path2;key], where the paths are built
    from the registry tree and key.


    # 2.4 Hello World for CMake


    For starters let us consider the simplest possible CMakeLists file. To compile
    an executable from one source file the CMakeLists file would contain two lines:


    ```

    project (Hello)

    add_executable (Hello Hello.c)

    ```


    To build the Hello executable you follow the process described in Running CMake
    (section 2.5) to generate the Makefiles or Microsoft project files. The project
    command indicates what name of the resulting workspace should be and the add_executable
    command adds an executable target to the build process. That''s all there is to
    it for this simple example. If your project requires a few files it is also quite
    easy, just modify the add_executable line as shown below.


    ```

    add_executable (Hello Hello.c File2.c File3.c File4.c)

    ```


    add_executable is just one of many commands available in CMake. Consider the more
    complicated example below.'
  merge: -1
  pgno: 13
- img_proc: true
  md: "```\ncmake_minimum_required (2.6)\nproject (HELLO)\n```\n\n```\nset (HELLO_SRCS\
    \ Hello.c File2.c File3.c)\n```\n\n```\nif (WIN32)\n  set(HELLO_SRCS ${HELLO_SRCS}\
    \ WinSupport.c)\nelse\n  set(HELLO_SRCS ${HELLO_SRCS} UnixSupport.c)\nendif ()\n\
    ```\n\n```\nadd_executable (Hello ${HELLO_SRCS})\n```\n\n```\n# look for the Tcl\
    \ library\nfind_library (TCL_LIBRARY\n  NAMES tcl84 tcl83 tcl82 tcl80\n  PATHS\
    \ /usr/lib /usr/local/lib)\n```\n\n```\nif (TCL_LIBRARY)\n  target_link_library\
    \ (Hello ${TCL_LIBRARY})\nendif ()\n```\n\nIn this example the set command is\
    \ used to group together source files into the list. The if command is used to\
    \ add either WinSupport.c or UnixSupport.c to this list based on whether or not\
    \ CMake is running on Windows. Finally, the add_executable command is used to\
