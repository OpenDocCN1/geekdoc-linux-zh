    command will return from a function or listfile where has reached its end.


    # 4.4 Regular Expressions


    A few CMake commands, such as if and string, make use of regular expressions,
    or can take a regular expression as an argument. In its simplest form, a regular-expression
    is a sequence of characters used to search for exact character matches. However,
    many times the sequence to be found is not known, or only a match at the beginning
    or end of a string is desired. Since there are several different conventions for
    specifying regular expressions CMake''s standard is described below. The description
    is based on the open source regular expression class from Texas Instruments, which
    is used by CMake for parsing regular expressions.


    Regular expressions can be specified by using combinations of standard alphanumeric
    characters and the following regular expression meta-characters:


    +   - Matches at beginning of a line or string.

    - Matches at end of a line or string.

    - Matches any single character other than a newline.

    - [] Matches any character(s) inside the brackets.

    - [^ Matches any character(s) not inside the brackets.

    - [-] Matches any character in range on either side of a dash.

    - * Matches preceding pattern zero or more times.'
