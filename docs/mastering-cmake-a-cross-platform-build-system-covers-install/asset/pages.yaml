  md: "# Creating CMake Package Configuration Files\n\nIt is important to configure\
    \ files into the binary tree, not the source tree. A single source tree may be\
    \ shared by multiple build trees or platforms. By configuring files into the binary\
    \ tree the differences between builds or platforms will be kept isolated in the\
    \ build tree, where it will not corrupt other builds. This means that you will\
    \ need to include the directory of the build tree where you configured the header\
    \ file into the project's list of include directories using the include_directories\
    \ command.\n\n# 5.7 Creating CMake Package Configuration Files\n\nProjects must\
    \ provide package configuration files so that outside applications can find them.\
    \ Consider a simple project \"Gromit\" providing an executable to generate source\
    \ code and a library against which the generated code must link. The CMakeLists.txt\
    \ file start with:\n\n```\ncmake_minimum_required (VERSION 2.6.3)\nproject (Gromit)\n\
    set (version 1.0)\n\n# Create library and executable.\nadd_library (gromit STATIC\
    \ gromit.c gromit.h)\nadd_executable (gromit-gen gromit-gen.c)\n```\n\nIn order\
    \ to install Gromit and export its targets for use outside projects, one adds\
    \ the code\n\n```\n# Install and export the targets.\ninstall (FILES gromit.h\
    \ DESTINATION include/gromit-${version})\ninstall (TARGETS gromit gromit-gen\n\
    \  DESTINATION lib/gromit-${version}\n  EXPORT gromit-targets)\ninstall (EXPORT\
    \ gromit-targets\n  DESTINATION lib/gromit-${version})\n```"
  merge: -1
