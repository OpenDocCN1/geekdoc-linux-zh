    may be in a non-standard place. In these cases you will need to specify CMake
    where your desired compiler is located. There are three ways to specify this;
    the generator can specify the compiler, an environment variable can be set, or
    a cache entry can be set. Some generators are tied to a specific compiler, for
    the example Visual Studio 6 always generates you'
