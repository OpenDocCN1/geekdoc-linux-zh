  md: '# Target platform and toolchain issues


    If your toolchain is not able to build a simple program without special arguments,
    like e.g. a linker script file or a memory layout, the tests CMake does initially
    fail. To make it work away, there is a CMake module, CMakeForceCompiler, that
    offers the following macros:


    ```

    CMAKE_FORCE_SYSTEM (name version processor),

    CMAKE_FORCE_C_COMPILER (compiler compiler_id sizeof_void_p)

    CMAKE_FORCE_CXX_COMPILER (compiler compiler_id).

    ```


    These macros can be used in a toolchain file so that the required variables will
    be preset and the CMake tests avoided.


    # RPATH handling under UNIX


    For native CMake builds executables and libraries by default with RPATH. In the
    build tree the RPATH is set so that the executables can be run from the build
    tree, i.e. the RPATH points into the build tree. When installing the project,
    CMake links the executables again, this time with the RPATH for the install tree,
    which is empty by default.


    When cross compiling you probably want to set up RPATH handling differently, as
    the executable cannot run on the build host it makes more sense to build with
    the install RPATH right from the start. There are several CMake variables and
    target properties for adjusting RPATH handling.


    ```

    set (CMAKE_BUILD_WITH_INSTALL_RPATH TRUE)

    set (CMAKE_INSTALL_RPATH "whatever you need")

    ```


    With these two settings the targets will be built with the install RPATH instead
    of the build RPATH, this avoids the need to link them again when installing. If
    you don''t need RPATH support in your project, you don''t need to set CMAKE_INSTALL_RPATH,
    which is empty by default.


    Setting CMAKE_INSTALL_RPATH_USE_LINK_PATH to TRUE is useful for native builds,
    since it automatically collects the RPATH from all libraries against which targets
    links. For cross compiling it should be left at the default setting, which is
    FALSE, because on the target automatically generated RPATH will be wrong in most
    cases, it will probably have a different file system layout to the build host.'
