    # Specifying Optimized or Debug Libraries with a Target


    On Windows it is often required to link debug libraries with debug libraries,
    and optimized libraries with optimized libraries. CMake satisfies this requirement
    with the target_link_libraries command, which accepts an optional flag that is
    debug or optimized. So, if a library is preceded by either debug or optimized,
    then that library will only be linked in the link configuration type. For example:


    ```

    add_executable (foo foo.c)

    target_link_libraries (foo debug libdebug optimized libopt)

    ```


    In this case will be linked against libdebug if a debug build was selected, or
    against an optimized build was selected.


    # 4.9 Shared Libraries and Loadable Modules


    Shared libraries and loadable modules are very powerful tools for software developers.
    They can be used to create extension modules or plugins for off-the-shelf software,
    and can be used to decrease the compile/link/run cycles for C and C++ programs.
    Despite years of use, the cross platform creation of shared libraries and modules
    remains a black art understood by only a few developers. CMake has the ability
    to aid developers in the creation of shared libraries and modules. CMake knows
    the correct tools and flags to use in order to produce shared libraries for most
    modern operating systems that support them. Unfortunately, CMake cannot do all
    the work, and developers must sometimes alter code and understand the basic concepts
    and common pitfalls associated with shared libraries before they can be used effectively.
    This section will describe many of the issues required to take advantage of shared
    libraries and loadable modules.


    A shared library should be thought of more like an executable than a static library,
    and on most systems actually requires executable permissions to be set on the
    shared library file.'
