    ctest "${CTEST_BINARY_DIRECTORY}" RETURN_VALUE res

    ctest_submit (RETURN_VALUE res)

    ```


    The ctest_empty_binary_directory command empties the directory and all subdirectories.
    Please note that this command has a safety measure built in, which is that it
    will only remove the directory if there a CMakeCache.txt file in the top level
    directory. This is to prevent CMake from mistakenly removing a directory.


    The rest of the block contains the calls to the actual CTest handlers. Each of
    them corresponds to a CTest -D option. For example, instead of:


    ```

    ctest -D ExperimentalBuild

    ```


    The script would contain:


    ```

    ctest_start (Experimental)

    ctest_build (BUILD "${CTEST_BINARY_DIRECTORY}" RETURN_VALUE res)

    ```


    Each step can return a return value, which can be used to determine if the step
    was successful. For example the return value of the Update stage can be used in
    a continuous dashboard to determine if the rest of the dashboard should run.


    To demonstrate some advantages of using extended CTest scripting, let us examine
    a more advanced CTest script. This script drives testing of an application called
    Slicer. Slicer uses CMake internally, but it drives the build process through
    a series of Tcl scripts. One of the problems of this approach is that it does
    not support out-of-source builds. Also, on Windows, certain modules are pre-built,
    so they have to be copied to the build directory. To test a project like that,
    we would use a script like this:


    ```

    cmake_required (VERSION 2.2)


    # set the dashboard specific variables -- name and notes

    set (CTEST_SITE) "dash11.kitware"

    set (CTEST_BUILD_NAME) "Win32-VS71"

    set (CTEST_NOTES_FILES) "${CTEST_SCRIPT_DIRECTORY}/${CTEST_SCRIPT_NAME}"


    # do not let the test run for more than 1500 seconds

    set (CTEST_TIMEOUT "1500")


    # set the source and binary directories

    ```'
