  md: '# CMAKE_C_COMPILER


    This specifies the C compiler executable as either a path or just the filename.
    If it is specified with full path, then this path will be preferred when searching
    for C++ compiler and the other tools (binutils, linker, etc.). If the compiler
    is a GNU cross compiler with a prefixed name (e.g. "arm-elf-gcc") CMake will detect
    this and automatically find the corresponding C++ compiler (i.e. "arm-elf-g++\
    The compiler can also be set via the CC environment variable. Setting CMAKE_C_COMPILER
    directly in a toolchain file has the advantage that the information about the
    target system is completely contained in this file, and it does not depend on
    environment variables.


    # CMAKE_CXX_COMPILER


    This specifies the C++ compiler executable as either a path or just the filename.
    It is handled the same way as CMAKE_C_COMPILER. If the toolchain is a GNU toolchain,
    it should suffice to set only CMAKE_C_COMPILER, CMake should find the corresponding
    C++ compiler automatically. For CMAKE_C_COMPILER, also for C++ the compiler can
    be set via the CXX environment variable.


    Once the system and the compiler are determined by CMake, it will load the corresponding
    files in the order described in section 11.2, The Enable Language Process.


    # External Libraries, Programs and Other Files


    Most non-trivial projects make use of external libraries or tools. CMake offers
    the find_program, find_library, find_file, find_path, and find_package commands
    for this purpose. They search the file system in common places for these files
    and return the results. find_package is a bit different in it does not actually
    search itself, but executes Find<>.cmake modules, which turn usually call the
    find_program, find_library, find_file and find_path commands.


    When compiling these commands become more complicated. For example, when compiling
    to Windows on a Linux system, /usr/lib/libjpeg.so as the result of the command
    find_package (JPEG) would be useless, since this would be the JPEG library for
    the host system and not the target system. In some cases you want to find files
    that are mean for the target platform, in other cases you will need to find files
    for the build host. The following variables are designed to give you the flexibility
    to change how the typical commands in CMake work, so that you can find both host
    and target files as necessary.


    The toolchain will with its own set of libraries and headers for the target platform,
    which are usually installed under a common prefix. It is also a good idea to set
    up a directory where all the software that is built for the target platform will
    be installed, so that the software packages do not get up with the libraries that
    come with the toolchain.'
