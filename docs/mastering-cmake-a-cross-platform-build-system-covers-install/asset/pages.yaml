  md: "```\nadd_custom_command (\n  TARGET target\n  PRE_BUILD | PRE_LINK | POST_BUILD\n\
    \  COMMAND command [ARGS arg1 arg2 arg3 ...]\n  [COMMAND command [ARGS arg1 arg2\
    \ arg3 ...] ...]\n  [COMMENT comment]\n)\n```\n\nThe target is the name of a CMake\
    \ target (executable, library, or custom) to which you want to add the custom\
    \ command. There is a choice of when the custom command should be executed. PRE_BUILD\
    \ indicates that the command should be executed before any other dependencies\
    \ for the target are built. PRE_LINK indicates that the command should be executed\
    \ after the dependencies are built, but before the actual link command. POST_BUILD\
    \ indicates that the custom command should be executed after the target has been\
    \ built. The COMMAND argument is the command (executable) to run and ARGS provides\
    \ an optional list of arguments to the command. Finally the COMMENT argument can\
    \ be used to provide a quoted string to be used as output when this custom command\
    \ is run. This is useful if you want to provide some feedback or documentation\
    \ on what is happening during the build. You can specify as many commands as you\
    \ want for a custom command. They will be executed in the order specified.\n\n\
    # How to Copy an Executable Once it is Built?\n\nNow let us consider a simple\
    \ custom command for copying an executable once it has been built.\n\n```\n# first\
    \ define the executable target as usual\nadd_executable(Foo bar.c)\n\n# get where\
    \ the executable will be located\nget_target_property(EXE_LOC Foo LOCATION)\n\n\
    # then add the custom command to copy it\nadd_custom_command (\n  TARGET Foo\n\
    \  POST_BUILD\n  COMMAND ${CMAKE_COMMAND}\n  ARGS -E copy ${EXE_LOC} /testing_department/files\n\
    )\n```\n\nThe first command in this example is the standard command for creating\
    \ an executable from a list of source files. In this case an executable named\
    \ Foo is created from the source file bar.c. The next command is get_target_property\
