  md: '# Automation & Testing with CMake


    CDash will automatically add subprojects and dependencies according to the Project.xml
    file. CDash will also remove any subprojects or dependencies not defined in the
    Project.xml file. Additionally, if the Project.xml is submitted multiple times,
    the second and subsequent submissions will have no observable effect: the first
    adds/modifies the data, the second and later submissions send the same data, so
    no changes are necessary. CDash tracks the subproject definitions over time to
    allow for projects to evolve. If you view dashboards from a past date, CDash will
    present the project/subproject views according to the subproject definitions in
    effect on that date.


    # ctest_submit with PARTS AND FILES


    In ctest version 2.8 and later, the ctest_submit command supports new PARTS and
    FILES arguments. With PARTS, you can send any subset of the xml files with each
    ctest_submit call. Typically, the script would wait until all dashboard stages
    were complete and then call ctest_submit once to send the results of all stages
    at the end of the day. Now, a script may call ctest_submit with PARTS to do partial
    submissions of subsets of the results. For example, you can configure using ctest_configure,
    build results after ctest_build and test results after ctest_test. This allows
    for information to be posted as the progress.


    With FILES, you can send arbitrary XML files to CDash. In addition to the standard
    build XML files that CTest sends, CDash also handles the new Project.xml file
    that describes subprojects and dependencies, as described previously. Prior to
    the addition of the ctest_submit PARTS handling, a typical dashboard script would
    contain a single ctest_submit() on its last line:


    ```

    ctest_start (Experimental)

    ctest_update (SOURCE "${CTEST_SOURCE_DIRECTORY}")

    ctest_configure (BUILD "${CTEST_BINARY_DIRECTORY}")

    ctest_build (BUILD "${CTEST_BINARY_DIRECTORY}")

    ctest_test (BUILD "${CTEST_BINARY_DIRECTORY}")

    ctest_submit ()

    ```


    Now, submissions can occur incrementally, with each part of the submission sent
    piecewise as it becomes available:


    ```

    ctest_start (Experimental)

    ctest_update (SOURCE "${CTEST_SOURCE_DIRECTORY}")

    ctest_configure (BUILD "${CTEST_BINARY_DIRECTORY}")

    ctest_submit (PARTS Update Configure Notes)


    ctest_build (BUILD "${CTEST_BINARY_DIRECTORY}") APPEND

    ctest_submit (PARTS Build)

    ```'
