  md: '# Advanced CTest Scripting


    The CTEST_SOURCE_DIRECTORY and CTEST_BINARY_DIRECTORY serve the same purpose as
    the traditional CTest script. The only difference is that we will be able to overwrite
    these variables later when calling the CTest handlers. The CTEST_UPDATE_COMMAND
    is the path to the command used to update the source directory from repository.
    Currently CTest supports Concurrent Versions System (CVS), Subversion, Git, Mercurial
    and Bazaar.


    Both the configure and build handlers support two modes. One mode is to provide
    the full command that will be invoked during that stage, this is designed to support
    projects that do not use CMake as their configuration or build tool. In this case
    you specify the full command lines to configure and build your project by setting
    the CTEST_CONFIGURE_COMMAND and CTEST_BUILD_COMMAND variables respectively. This
    is similar to specifying CTEST_CMAKE_COMMAND in the traditional CTest scripting.


    For projects that use CMake for their configuration and build steps you do not
    need to specify the command lines for configuring and building your project. Instead
    you will specify the CMake generator by setting the CTEST_CMAKE_GENERATOR variable.
    This way CMake will be run with the appropriate generator. One example of this
    is:


    ```

    set (CTEST_CMAKE_GENERATOR "Visual Studio 8 2005")

    ```


    For the build step you should also set the variables CTEST_PROJECT_NAME and CTEST_BUILD_CONFIGURATION
    to specify how to build the project. In this case CTEST_PROJECT_NAME will match
    the top level CMakeLists file''s PROJECT command. The CTEST_BUILD_CONFIGURATION
    should be one of Release, Debug, MinSizeRel, or RelWithDebInfo. Additionally CTEST_BUILD_FLAGS
    can be provided as a hint to the build command. An example of testing a CMake-based
    project would be:


    ```

    set (CTEST_CMAKE_GENERATOR "Visual Studio 8 2005")nset (CTEST_PROJECT_NAME "Grommit")nset
    (CTEST_BUILD_CONFIGURATION "Debug")

    ```


    The final block performs the actual testing and submission:


    ```

    ctest_empty_binary_directory (${CTEST_BINARY_DIRECTORY})

    ctest_start (Nightly)

    ctest_update (SOURCE "${CTEST_SOURCE_DIRECTORY}" RETURN_VALUE res)

    ctest_configure (BUILD "${CTEST_BINARY_DIRECTORY}" RETURN_VALUE res)

    ctest_build (BUILD "${CTEST_BINARY_DIRECTORY}" RETURN_VALUE res)

    ```'
