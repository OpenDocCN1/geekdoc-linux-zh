  md: '# Cross Compiling Hello World


    Now let''s actually start with the cross compiling. The first step is to install
    a cross compiling toolchain. If this is already installed, you can skip the next
    paragraph.


    There are many different approaches and projects that deal with cross compiling
    for Linux, ranging from free software projects working on Linux PDAs to commercial
    embedded Linux vendors. Most of these projects come with their own way to build
    and use the respective toolchain. Any of these toolchains can be used with CMake,
    the only requirement is that it works in the normal file system and does not expect
    a "sandboxed" environment, like for example the Scratchbox project.


    An easy to use toolchain with a relatively complete target environment is the
    Embedded Linux Development Toolkit (http://www.denx.de/wiki/DULG/ELDK). It supports
    ARM, PowerPC and MIPS as target platforms. ELDK can be downloaded from ftp://ftp.sunet.se/pub/Linux/distributions/eldk/.
    The easiest way is to download the ISOs, mount them and then install:


    ```

    mkdir mount-iso/

    sudo mount -t iso9660 mips-2007-07-21.iso mount-iso/ -o loop

    cd mount-iso/

    ./install -d /home/alex/eldk-mips/

    ...

    Preparing...

    ################################################# [100%]

    1:appWeb-mips_4Kcle

    ################################################ [100%]

    Done

    ls /opt/eldk-mips/

    bin eldk_init etc mips_4KC mips_4Kcle usr var version

    ```


    ELDK (and other toolchains) can be installed anywhere, either in the home directory
    or system if there are more users working with them. In this example the toolchain
    will now be located in /home/alex/eldk-mips/usr/bin/ and the target environment
    is in /home/alex/eldk-mips/mips_4KC.


    Now that a cross compiling toolchain is installed, CMake has to be set up to it.
    As already described, this is done by creating a toolchain file for CMake. In
    this example the toolchain file looks like this:


    ```

    # the name of the target operating system

    set (CMAKE_SYSTEM_NAME Linux)

    ```'
