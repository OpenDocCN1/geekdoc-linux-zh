    349


    match any portion of the full path but it may use ''/'' and ''$'' to simulate
    the behavior. By default all files and directories are installed whether or not
    they are matched. The FILES_MATCHING option may be given before the first match
    to they disable installation of files (but not directories) not matched by any
    expression. For example, the code


    ```

    install(DIRECTORY src/ DESTINATION include/myproj

    FILES_MATCHING PATTERN "*.h")

    ```


    will extract and install header files from a source tree.


    Some options may follow a PATTERN or REGEX expression and are applied only to
    files or directories matching them. The EXCLUDE option will skip the matched file
    or directory. The PERMISSIONS option overrides the permissions setting for the
    matched file or directory. For example the code


    ```

    install(DIRECTORY icons scripts/ DESTINATION share/myproj

    PATTERN "CVS" EXCLUDE

    PATTERN "scripts/*"

    PERMISSIONS OWNER_EXECUTE OWNER_WRITE OWNER_READ

    GROUP_EXECUTE GROUP_READ)

    ```


    will install the icons directory to share/myproj/icons and the scripts directory
    to share/myproj. The icons will get default file permissions, the scripts will
    be given specific permissions, and any CVS CVS directories will be excluded.


