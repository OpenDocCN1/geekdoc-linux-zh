    installer called CoolStuff-0.1.1-win32.exe, and a binary zip file CoolStuff-0.1.1-win32.zip.
    The same thing could be done using the CPack command line.


    ```

    cd build

    cpack -C CPackConfig.cmake

    cpack -C CPackSourceConfig.cmake

    ```


    # What Happens When CPack.cmake Is Included?


    When the include(CPack) command is executed, the CPack.cmake file is included
    into the project. By this default we use the configure_file command to create
    CPackConfig.cmake and CPackSourceConfig.cmake in the binary tree of the project.
    These files contain a series of commands that set variables for use when CPack
    is running during the packaging step. The names of the files that are configured
    by the CPack.cmake file can be customized with these two variables; CPACK_OUTPUT_CONFIG_FILE
    which defaults to CPackConfig.cmake and CPACK_SOURCE_OUTPUT_CONFIG_FILE which
    defaults to CPackSourceConfig.cmake.


    The source for these files can be found in the Templates/CPackConfig.cmake.in.
    This file contains some comments, and a single variable that is set by CPack.cmake.
    The file contains this line of CMake code:


    ```

    @CPACK_OTHER_VARIABLES_

    ```


    If the project contains the file CPackConfig.cmake.in in the top level of the
    source tree, that file will be used instead of the file in the Templates directory.
    If the project contains the file CPackSourceConfig.cmake.in, then that file will
    be used for the creation of CPackSourceConfig.cmake.


    The configuration files created by CPack.cmake will contain all variables that
    begin with "CPACK_" in the current project. This is done using the command:


    ```

    get_cmake_property(res VARIABLES)

    ```


    The above command gets all variables defined for the current CMake project. Some
    CMake code then looks for all variables starting with "CPACK_'', and each variable
    found is configured into the two configuration files as CMake code. For example,
    if you had a variable set like this in your CPack project:


    ```

    set(CPACK_PACKAGE_NAME "CoolStuff")

    ```'
