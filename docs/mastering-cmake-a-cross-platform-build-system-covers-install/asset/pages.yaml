    [DOWNLOAD_DIR dir] # Directory to store downloaded files\n[DOWNLOAD_COMMAND cmd...]\
    \ # Command to download source tree\n[CVS_REPOSITORY cvroot] # CVSOOT of CVS repository\n\
    [CVS_MODULE mod] # Module to checkout from CVS repo\n[CVS_TAG tag] # Tag to checkout\
    \ from CVS repo\n[SVN_REPOSITORY url] # URL of Subversion repo\n[SVN_REVISION\
    \ rev] # Revision to checkout from SVN repo\n[URL/.../src.tgz] # Full path or\
    \ URL of source\n\n--Update/Patch step----\n[UPDATE_COMMAND cmd...] # Source work-tree\
    \ update command\n[PATCH_COMMAND cmd...] # Command to patch downloaded source\n\
    \n--Configure-step----\n[SOURCE_DIR dir] # Source dir to be used for build\n```"
