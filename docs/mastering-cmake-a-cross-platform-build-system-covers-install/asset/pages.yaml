    # Appendix D


    containing the contents of that component, which should be uploaded to the given
    site. When the user selects that component for installation, the installer will
    download and extract the component in place. This feature is useful for creating
    small installers that only download the requested components, save bandwidth.
    Additionally, the installers are small enough that they will be installed as part
    of the normal installation process, and the "Change" button in Windows Add/Remove
    Programs control panel will allow one to add or remove parts of the application
    after the original installation. On Windows, the downloaded-components functionality
    requires the ZipDLL plug-in for NSIS, at available at:


    ```

    http://nsis.sourceforge.net/ZipDLL_plug-in

    ```


    On Mac OS X, installers that download components on-the-fly can only be built
    and installed using Mac OS X 10.5 or later.


    The site argument is a URL where the archives for downloadable components will
    reside, e.g., using `http://www.cmake.org/files/2.6.1/installer/`. All of the
    archives produced by CPack will be uploaded to that location.


    UPLOAD_DIRECTORY is the local directory where CPack will create the various archives
    for each of the components. The contents of this directory should be uploaded
    to a location accessible by the URL given in the site argument. If omitted, CPack
    will use the directory CPackUploads inside the CMake binary to store the generated
    archives.


    The ALL indicates that all components are downloaded. Otherwise, only those components
    explicitly marked as DOWNLOADED or have a specified ARCHIVE_FILE will be downloaded.
    Additionally, the ALL option implies ADD_REMOVE (unless NO_ADD_REMOVE is specified).


    ADD_REMOVE indicates that CPack should install a copy of the installer that can
    be called from Windows'' Add/Remove Programs dialog (via the "Modify" button)
    to change the set of installed components. NO_ADD_REMOVE turns off this behavior.
    This option is ignored on Mac OS X.


