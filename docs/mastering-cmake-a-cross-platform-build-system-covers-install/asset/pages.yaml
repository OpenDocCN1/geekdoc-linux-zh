  md: "# Specifying Components\n\nThe first step in building a component-based installation\
    \ is to identify the set of installable components. In this example, three components\
    \ will be created: the library binary, the application, and the header file. This\
    \ decision is arbitrary and project-specific, but be sure to identify the components\
    \ that correspond to units of functionality to your user, rather than basing the\
    \ components on the internal structure of your program.\n\nFor each of these components,\
    \ we need to identify which component each of the installed files belong in. For\
    \ each INSTALL command in CMakeLists.txt, add an appropriate COMPONENT argument\
    \ stating which component the installed files will be associated with:\n\n```\n\
    install(TARGETS mylib\n  ARCHIVE\n  DESTINATION lib\n  COMPONENT libraries)\n\
    install(TARGETS mylibapp\n  RUNTIME\n  DESTINATION bin\n  COMPONENT applications)\n\
    install(FILES mylib.h\n  DESTINATION include\n  COMPONENT headers)\n```\n\nNote\
    \ that the COMPONENT argument to the INSTALL command is not new; it has been a\
    \ part of CMake's INSTALL command to allow installation of only part of a project.\
    \ If you are using any of the older installation commands (INSTALL_TARGETS, INSTALL_FILES,\
    \ etc.), you will need to convert them to INSTALL commands in order to use components.\n\
    \nThe next step is to notify CPack of the names of all of the components in your\
    \ project by calling the cpack_add_component function for each component of the\
    \ package:\n\n```\ncpack_add_component(applications)\ncpack_add_component(libraries)\n\
    cpack_add_component(headers)\n```\n\nAt this point, you can build a component-based\
    \ installer with CPack that will allow one to independently install the applications,\
    \ libraries, and headers of MyLib. The Windows and Mac OS X installers will look\
    \ like the ones shown in Figure 15."
  merge: -1
  pgno: 164
