    source files that are then used to build other executables or libraries. This
    might sound like an odd case, but it occurs quite frequently. For example the
    build process for the TIFF library, which creates an executable that is then run
    to generate a source file that has system specific information in it. This file
    is then used as a source file in building the main TIFF library. Another example
    is the Visualization Toolkit that builds an executable called vtk'
