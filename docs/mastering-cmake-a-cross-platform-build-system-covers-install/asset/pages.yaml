    ```

    --Build step-

    [BINARY_DIR dir] # Specify build dir location

    [BUILD_COMMAND cmd...] # Command to drive the native build

    [BUILD_IN_SOURCE 1] # Use source dir for build dir

    ```


    ```

    --Install step-

    [INSTALL_DIR dir] # Installation prefix

    [INSTALL_COMMAND cmd...] # Command to drive install after build

    ```


    ```

    --Test step-

    [TEST_BEFORE_INSTALL 1] # Add test step before install step

    [TEST_AFTER_INSTALL 1] # Add test step after install step

    [TEST_COMMAND cmd...] # Command to drive test

    ```


    The DIR option specifies directories for the project, with default directories
    computed as follows. If the PREFIX option is given to ExternalProject_Add() or
    the EP_PREFIX directory property is set, then an external project is built and
    installed under the specified prefix:


    ```

    TMP_DIR = <prefix>/tmp

    STAMP_DIR = <prefix>/src/<name>-stamp

    DOWNLOAD_DIR = <prefix>/src

    SOURCE_DIR = <prefix>/src/<name>

    BINARY_DIR = <prefix>/src/<name>-build

    INSTALL_DIR = <prefix>

    ```


    Otherwise, if the EP_BASE directory property is set then components of an external
    project are stored under the specified base:


    ```

    TMP_DIR = <base>/tmp/<name>

    STAMP_DIR = <base>/Stamp/<name>

    DOWNLOAD_DIR = <base>/Download/<name>

    SOURCE_DIR = <base>/Source/<name>

    BINARY_DIR = <base>/Build/<name>

    INSTALL_DIR = <base>/Install/<name>

    ```'
