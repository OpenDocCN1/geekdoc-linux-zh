    The script above is not different to running CTest -D from the command line yourself.
    All it adds is that it verifies the binary directory exists and creates it if
    it does not. CTest scripting really shines in the optional features it supports.
    We will consider these options one by one, starting with one of the most commonly
    used options CTEST_START_WITH_EMPTY_BINARY_DIRECTORY. When this variable is set
    to true it will delete the binary directory and then recreate it as an empty directory
    prior to running the dashboard. This guarantees that you are testing a clean build
    every time the dashboard is run. To use this option simply set it in your script.
    In the example above we would simply add the following lines:


    ```

    # should CTest wipe the binary tree before running

    set (CTEST_START_WITH_EMPTY_BINARY_DIRECTORY TRUE)

    ```


    Another commonly used option is the CTEST_INITIAL_CACHE variable. Whatever value
    you set to this will be written into the CMakeCache file prior to running the
    dashboard. This is an effective and simple way to initialize a cache with preset
    values. The syntax is the same as what is in the cache with the exception that
    you must escape any quotes. Consider the following example:


    ```

    # this is the initial cache to use for the binary tree, be

    # careful to escape any quotes inside this string

    set (CTEST_INITIAL_CACHE "")


    //Command to build entire project from the command line.

    MAKECOMMAND:STRING="C:/PROGRA-1/MICROS-1.NET/Common7/IDE/deenv.com" CMake.sln
    /build Debug /project ALL_BUILD


    //make program

    CMAKE_MAKE_PROGRAM:FILEPATH=C:/PROGRA-1/MICROS-1.NET/Common7/IDE/deenv.com


    //Name of generator.

    CMAKE_GENERATOR:INTERNAL=Visual Studio 7 .NET 2003


    //Path to a program.

    CVSCOMMAND:FILEPATH=c:/cywin/bin/cvs.exe


    //Name of the build

    BUILDNAME:STRING=Win32-vs71

    ```'
