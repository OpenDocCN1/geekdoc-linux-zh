  md: '# CMP0003


    # 439


    CMake 2.4 and below implemented linking to libraries whose full paths are known
    by splitting them on the link line into separate components consisting of the
    linker search path and the library name. The example code might have produced
    something like


    ```

    ... -L/path/to -lA ...

    ```


    in order to link to library A. An analysis was performed to order multiple link
    directories that the linker would find library A in the desired location, but
    there are cases in which this does not work. CMake versions 2.6 and above use
    the more reliable approach of passing the full path to libraries directly to the
    linker in most cases. The example code now produces something like


    ```

    ... /path/to/libA.so ...

    ```


    Unfortunately this change can break code like


    ```

    target_link_libraries(myexe /path/to/libA.so B)

    ```


    where "B" is meant to find "/path/to/libB.so". This code is wrong because the
    user is asking the linker to find library B but has not provided a linker search
    path (which may be added with the link_directories command). However, with the
    old linking implementation the code would work accidentally because the linker
    search path added for library A allowed library B to be found.


    In order to support projects depending on linker search paths added by linking
    to libraries with known full paths, the OLD behavior for this policy will add
    the linker search paths even though they are not needed for their own libraries.
    When this policy is set to OLD, CMake will produce a link line such as


    ```

    ... -L/path/to /path/to/libA.so -lB ...

    ```


    which will allow library B to be found as it was previously. When this policy
    is set to NEW, CMake will produce a link line such as


    ```

    ... /path/to/libA.so -lB ...

    ```


    which more accurately matches what the project specified.'
