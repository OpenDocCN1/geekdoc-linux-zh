    # 2.6 Editing CMakeLists Files


    CMakeLists files can be edited in almost any text editor. Some editors, such as
    Notepad++, come with CMake syntax highlighting and indentation support built in.
    For editors such as Emacs or Vim CMake includes indentation and syntax highlighting
    modes. These can be found in the Docs of the source distribution, or downloaded
    from the CMake web site. The file cmake-mode.el is the Emacs mode, and cmake-indent.vim
    and cmake-syntax.vim are used by Vim. Within Visual Studio the CMakeLists files
    are listed as part of the project and you can edit them by double clicking on.
    Within any of the generated generators (Makefiles, Visual Studio, etc) if you
    edit a CMakeLists file and rebuild, there are rules that will automatically invoke
    CMake to update the generated files (e.g. Makefiles or project files) as required.
    This helps to ensure that your generated files are always in sync with your CMakeLists
    files.


    Since CMake computes and maintains dependency information, the CMake executables
    must always be available (though they don''t have to be in your PATH) when make
    or an IDE is running on CMake generated files. This means that if a CMake input
    file changes on disk, your build system will automatically re-run CMake and produce
    up-to-date build files. For this reason you generally should not generate Makefiles
    or projects with CMake and move them to another machine that does not have CMake
    installed.


    # 2.7 Setting Initial Values for CMake


    While CMake works in an interactive mode, sometimes you will need to cache entries
    without using a GUI. This is common when setting up nightly dashboards or if you
    will be creating many build trees with the same cache values. In these cases the
    CMake cache can be initialized in two ways. The first way is to pass the cache
    values on the CMake command line using -DCACHE_VAR:TYPE=VALUE arguments. For example,
    consider the following nightly dashboard script for a UNIX machine:


    ```

    #!/bin/tcsh

