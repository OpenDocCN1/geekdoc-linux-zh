  md: '# Built-in Find Modules


    The command operates in two modes: Module mode and Config mode. In Module mode
    the command searches for a find-module: a file named "Find<Package>.cmake". It
    looks first in C_MODULE_PATH and then in the CMake installation. If a find-module
    is found, it is loaded to search for individual components of the package. Find-modules
    contain package-specific knowledge of the libraries and other files they expect,
    and internally use commands like library to locate them. CMake provides find-modules
    for many common packages; see Appendix D – Selected Modules. Find-modules are
    tedious and difficult to write and maintain because they need very specific knowledge
    of every version of the package to be found.


    The Config mode of find_package provides a powerful alternative through cooperation
    with the package to be found. It enters this mode after failing to locate a find-module
    or when explicitly requested by the caller. In Config mode the command searches
    for a package configuration file: a file named "<Package>Config.cmake" or "<package>-config.cmake"
    that is provided by the package to be found. Given the name of a package, the
    find_package command knows how to search inside installation prefixes for locations


    ```

    <prefix>/lib/<package>/<package>-config.cmake

    ```


    (see documentation of find_package in Appendix C – Listfile Commands for a complete
    list of locations.) CMake creates a cache entry called "<Package>DIR" to store
    the location or allow the user to set it. Since a package configuration file comes
    with an installation of its package, it knows exactly where to find everything
    provided by the installation. The find_package command locates the file it provides
    the locations of package components without any additional searching.


    The “[version]" option asks find_package to locate a particular version of the
    package. In Module mode, the command passes the request to the find-module. In
    Config mode the command looks next to each candidate configuration file for a
    package version file: a file named "<Package>ConfigVersion.cmake" or "<package>-configversion.cmake".
    The version file is loaded to test whether the package version is an acceptable
    match for the version requested (see documentation of find_package for the version
    file API specification). If the version file claims compatibility the configuration
    file is accepted, otherwise it is ignored. This approach allows each project to
    define its own rules for version compatibility.


    # 5.4 Built-in Find Modules


    CMake has many predefined modules that can be found in the Modules subdirectory
    of CMake. The modules can find many common software packages. See Appendix D –
    Selected Modules for a detailed list.'
