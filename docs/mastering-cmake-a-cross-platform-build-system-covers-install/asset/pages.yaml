  md: "# Extending CMake\n\n```\n{\ncmLoadedCommandInfo *info = (cmLoadedCommandInfo\
    \ *)inf;\ninfo->C->AddDefinition(mf, \"FOO\", \"BAR\");\n\nreturn 1;\n}\nvoid\
    \ CM_PLUGIN_EXPORT\nHELLO_WORLDInit(cmLoadedCommandInfo *info)\n{\n  info->InitialPass\
    \ = InitialPass;\n  info->Name = \"HELLO_WORLD\";\n}\n```\n\nFirst plugin includes\
    \ the cmPluginAPI.h file to get the definitions and structures required for a\
    \ plugin. It then defines a static function called InitialPass that will be called\
    \ whenever this loaded command is invoked. This function is passed four parameters:\
    \ the cmLoadedCommandInfo structure, the Makefile, the number of arguments, and\
    \ the list of arguments. In this function we cast the inf to its actual type and\
    \ use it to invoke the C API (CAPI) AddDefinition function. This function will\
    \ set the variable FOO to the value of BAR in the command cm instance.\n\nThe\
    \ second function is called HELLO_WORLDInit and it will be called when the plugin\
    \ is loaded. The name of this function must exactly match the name of the loaded\
    \ command with Init. In this example the name of the command is HELLO_WORLD so\
    \ the function is named HELLO_WORLDInit. This function will be called as soon\
    \ as your command is loaded. It is responsible for initializing the elements of\
    \ the cmLoadedCommandInfo structure. In the InitialPass function it sets the InitialPass\
    \ member to the address of the InitialPass function defined above. It will then\
    \ set the name of the command by setting the Name member to \"HELLO_WORLD\".\n\
    \n# Using a Loaded Command\n\nNow let consider how to use this new HELLO_WORLD\
    \ command in a project. The basic process is that CMake will compile the plugin\
    \ into a shared library and then dynamically load it. To do this first create\
    \ a subdirectory in your source tree called CMake or CMakeCommands (any name you\
    \ can use). Place the source code to your plugin in that directory. We recommend\
    \ naming the file with cm and the name of the command. For example, cmHELLO_WORLD.c.\
    \ Then you must create a simple CMakeLists.txt file for this directory that includes\
    \ instructions to build the shared library. Typically this will be the following:\n\
    \n```\nproject (HELLO_WORLD)\n\nset (CMAKE_CXX_FLAGS \"$(CMAKE_CXX_FLAGS)\")\n\
    ```"
