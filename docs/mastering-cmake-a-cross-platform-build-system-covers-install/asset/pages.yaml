    # Linking to System Libraries


    System libraries on UNIX-like systems are typically provided in /usr/lib or /lib.
    These directories are considered implicit linker search paths by linkers automatically
    search these locations, even without a flag -L/usr/lib. Consider the code


    ```

    find_library (M_LIB m)

    target_link_libraries (myexe ${M_LIB})

    ```


    Typically the find_library command would find the math library /usr/lib/lib.so,
    but some platforms provide multiple versions of libraries correesponding to different
    architectures. For example, on an IRIX machine one might find the libraries


    ```

    /usr/lib/libm.so          (ELF o32)

    /usr/lib32/libm.so      (ELF n32)

    /usr/lib64/libm.so      (ELF 64)

    ```


    On a Solaris machine one might find


    ```

    /usr/lib/libm.so          (sparcv8 architecture)

    /usr/lib/sparc9/libm.so  (sparcv9 architecture)

    ```


    Unfortunately, find_library may not know about all of the architecture-specific
    system search paths used by the linker. In fact, when it finds /usr/lib/libm.so,
    it may be finding a library with the incorrect architecture. If the link computation
    were to produce the line


    ```

    ... /usr/lib/libm.so ...

    ```


    the linker might complain if /usr/lib/libm.so does not match the architecture
    it wants. One solution to this problem is for the link computation to recognize
    that the library is in a system directory and ask the linker to search for the
    library. It could produce the link line


    ```

    ... -lm ...

    ```'
