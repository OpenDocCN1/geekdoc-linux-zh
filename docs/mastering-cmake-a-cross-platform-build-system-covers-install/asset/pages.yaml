  md: '# Shared Libraries and Loadable Modules


    tests. However, a seemingly opposite goal is sought by developers of object oriented
    software. This is the concept of Open software that can be extended by future
    developers. This can be done via inheritance and polymorphism with object systems.
    Shared libraries that can be loaded at run time, allow for these seemingly opposing
    goals to be achieved in the same software package. Many common applications support
    the idea of plugins. Internet Explorer uses plugins to support video over the
    web and 3D visualization. In addition to plugins, loadable factories can be used
    to replace C++ objects at run time, as is done in VTK.


    Once it is decided that shared libraries or loadable modules are the right choice
    for a particular project, there are a few issues that developers need to be aware
    of. The first question that must be answered is which symbols are exported by
    the shared library? This may sound like a simple question, but the answer is different
    from platform to platform. Many, but not all UNIX systems, the default behavior
    is to export all symbols like a static library. However, on Windows systems, developers
    must explicitly tell the linker and compiler which symbols are to be exported
    import from shared libraries. This is often a big problem for UNIX developers
    moving to Windows. There are two ways to tell the compiler/linker which symbols
    to export/import on Windows. The most common approach is to decorate the code
    with a Microsoft C/C++ language extension. An alternative is to create an extra
    file called .def file. This is a simple ASCII file containing the names of all
    the symbols to be exported from library.


    The Microsoft™ extension uses the __declspec directive. If a symbol has __declspec(dllport)
    in front of it, it will be exported, and if it has __declspec(dllimport) it will
    be imported. Since the same file be shared during the creation and use of a library,
    it must be exported and imported in the same source file. This can only be done
    with the preprocessor. The developer can create a macro called LIBRARY_EXPORT
    that is defined to dllport when building the library and dllimport when using
    the library. CMake makes this process by automatically defining $(LIBRARY)_EXPORTS
    when building a DLL (dynamic link library, a.k.a. a shared library) on Windows.


