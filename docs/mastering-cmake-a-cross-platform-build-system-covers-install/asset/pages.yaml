    basename_LIBRARY, basename_LIBRARY_DEBUG and basename_LIBRARY_RELEASE will take
    the value.


    If the generator supports configuration types, then basename_LIBRARY and basename_LIBRARIES
    will be set with debug and optimized flags specifying the library to be used for
    the given configuration. If no build type has been set or the generator does not
    support configuration types, then basename_LIBRARY and basename_LIBRARIES will
    take only the release values.


