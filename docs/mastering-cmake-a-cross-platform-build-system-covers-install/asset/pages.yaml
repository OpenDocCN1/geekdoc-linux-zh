    \ knows the locations of other installed files relative to itself. The corresponding\
    \ package version file is configured from its input file `gromit-config-version.cmake`\
    \ which contains code such as:\n\n```\nset (PACKAGE_VERSION \"@version@\")\nif\
    \ (NOT \"${PACKAGE_FIND_VERSION}\" VERSION_GREATER \"@version@\")\n  set (PACKAGE_VERSION_COMPATIBLE\
    \ 1) # compatible with older\n  if (\"${PACKAGE_FIND_VERSION}\" VERSION_EQUAL\
