    the system on which the software is being built. This is a critical factor in
    creating cross-platform applications or libraries. It also covers how to find
    and use header files and libraries. It also covers some of the more advanced features
    of CMake including the `try_compile` and `try_run` commands. These commands are
    extremely powerful tools for determining the capabilities of the system and compiler
    that is hosting your software. This chapter also describes how to generate configured
    files and how to compile with CMake. Finally, the steps required to enable a project
    for the `find_package` command are covered, explaining how to create a `<Package>Config.cmake`
    file and other required files.


    # 5.1 Using Header Files and Libraries


    Many C and C++ programs depend on external libraries. However, when it comes to
    the practical aspects of compiling and linking a project, taking advantage of
    existing libraries can be difficult for both developers and users. Problems usually
    show up as soon as the software is built on a system other than that on which
    it was developed. Assumptions regarding libraries and header files are located
    become obvious when they are not installed in the same place on the new computer
    and the build system is unable to find them. CMake has many features to aid developers
    in the integration of external libraries into a project.


    The CMake commands that are most relevant to this type of integration are the
    `find_file`, `find_library`, `find_path`, `find_program`, and `find_package` commands.
    For most C and C++ libraries, a combination of `find_library` and `find_path`
    will be enough to compile and link with an installed library. `find_library` can
    be used to locate, allow a'
