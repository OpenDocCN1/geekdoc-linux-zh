  md: "# 40 Writing CMakeLists Files\n\n```\nendwhile ()\n```\n\nThe foreach and while\
    \ commands allow you to handle repetitive tasks that occur in sequence, whereas\
    \ the macro and function commands support repetitive tasks that may be scattered\
    \ throughout your CMakeLists files. Once a macro or function is defined it can\
    \ be used by any CMakeLists files processed after its definition.\n\nA function\
    \ in CMake is very much like a function in C or C++. You can pass arguments into\
    \ it, and the arguments passed become variables within the function. Likewise\
    \ with some standard variables as ARGC, ARGV, ARGN, and ARGV0, ARGV1 etc defined.\
    \ Within a function you are in a new variable scope, like when you drop into a\
    \ subdirectory using the add_subdirectory command you are in a new variable scope.\
    \ All the variables defined when the function are still defined, but any changes\
    \ to variables or new variables only exist within the function. When the function\
    \ returns those variables will go away. Put more simply, when you invoke a function\
    \ a new variable scope is pushed and when it returns that scope is popped.\n\n\
    The first argument is the name of the function to define. All additional arguments\
    \ are formal parameters to the function.\n\n```\nfunction(DetermineTime _time)\n\
    # pass the result up to whatever invoked it\nset(${_time} \"1:23:45\" PARENT_SCOPE)\n\
