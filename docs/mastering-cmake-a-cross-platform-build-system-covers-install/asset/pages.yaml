    on the platform as follows:


    ```

    // does the platform provide exp and log functions?

    #cmakefine HAVE_LOG

    #cmakefine HAVE_EXP

    ```


    It is important that the tests for log and exp are done before the configure_file
    command for TutorialConfig.h. The configure_file command immediately configures
    the file using the current settings in CMake. Finally in the mysql function we
    can provide an alternate implementation based on log and exp if they are available
    on the system using the following code:


    ```

    // if we have both log and exp then use them

    #if defined (HAVE_LOG) && defined (HAVE_EXP)

    result = exp(log(x)*0.5);

    #else // otherwise use an iterative approach

