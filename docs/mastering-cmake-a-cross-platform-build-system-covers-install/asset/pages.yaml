    # 4.7 Policies\n\nFor various reasons, sometimes a new feature or change is made\
    \ to CMake that is not fully backwards with older versions of CMake. This can\
    \ create problems when someone tries to use an old CMakeLists.file with a new\
    \ version of CMake. To help both end users and developers through such issues,\
    \ we have introduced policies. Policies are a mechanism in CMake to help improve\
    \ backwards compatibility and track compatibility issues between different versions\
    \ of CMake.\n\n# Design Goals\n\nThere were four main design goals for the CMake\
    \ policy mechanism:\n\n+   1. Existing projects should be build with versions\
    \ of CMake newer than that used by the project authors.\n   - Users should not\
    \ need to edit code to get the projects to build.\n   - Warnings may be issued\
