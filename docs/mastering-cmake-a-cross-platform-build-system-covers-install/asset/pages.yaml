  md: "# Using Compile Checks\n\nIn CMake there are macros such as CHECK_INCLUDE_FILES\
    \ and CHECK_C_SOURCE_RUNS that are used to test the properties of the platform.\
    \ Most of these internally use either the try_compile or the try_run commands.\
    \ The try_compile command works as expected when cross compiling, it tries to\
    \ compile the piece of code with the cross toolchain, which will give the expected\
    \ result.\n\nAll tests using try_run will not work since the created executables\
    \ normally run on the build host. In some cases this might be possible, e.g. using\
    \ virtual machines, emulation layers like Wine or interfaces to the actual target,\
    \ CMake does not depend on such mechanisms. Depending on emulators during the\
    \ build process would introduce a new set of potential problems, they may have\
    \ a different view on the file system, or other line ends, require special hardware\
    \ or software.\n\nIf try_run is invoked when cross compiling, it will first try\
    \ to compile the software, which will work the same way as when not cross compiling.\
    \ If it succeeds, it will check the variable C_CROSSCOMPILING to determine whether\
    \ the resulting executable can be executed or not. If it cannot, it will create\
    \ two cache variables, which then have to be set by the user or via the CMake\
    \ cache. Assume the command looks like this:\n\n```\ntry_run (SHARED_LIBRARY_PATH_TYPE\n\
    \       SHARED_LIBRARY_PATH_INFO_COMPILED\n       $${PROJECT_SOURCE_DIR}/CMakeTmp/SharedLibraryPathInfo.cxx\n\
    \       OUTPUT_VARIABLE OUTPUT\n       ARGS LDPATH\")\n```\n\nIn this example\
    \ the source file SharedLibraryPathInfo.xx will be compiled and if that succeeds,\
    \ the resulting executable should be executed. The variable SHARED_LIBRARY_PATH_INFO_COMPILED\
    \ will be set to the result of the build, i.e. TRUE or FALSE. CMake will create\
    \ a cache variable SHARED_LIBRARY_PATH_TYPE and preset it to PLEASE_FILL_OUT-FAILED_TO_RUN.\
    \ This variable must be set to what exit code of the executable would have been\
    \ if it had been executed on the target. Additionally, CMake will create a cache\
    \ variable SHARED_LIBRARY_PATH_TYPE_TRYRUN_OUTPUT and preset it to the output\
    \ that the executable prints to stdout and stderr if it were executed on the target.\
    \ This variable is only created if the try_run command was used with the OUTPUT_VARIABLE\
    \ or the OUTPUT_VARIABLE argument. To help you with CMake tries best to use your\
    \ useful information. To accomplish this CMake creates a file ${CMAKE_BINARY_DIR}/TryRunResults.cmake,that\
    \ you can see an example of:"
