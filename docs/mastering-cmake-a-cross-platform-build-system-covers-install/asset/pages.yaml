    # 10.5 Using CTest to Drive Complex Tests


    Sometimes properly test a project you need to actually compile code during the
    testing

    phase. There are several reasons for this. First, if test programs are compiled
    as part of

    t main project, they can end up taking a significant amount of the build time.
    Also, if a test

    fails to build, the main build should not fail as well. Finally, IDE projects
    can quickly become

    to large to load and work with. The CTest command support a group of command line

    options that allows it to be used as the executable as run. When used as the executable,

    CTest can run CMake, run the compile step, and finally run a compiled test. We
    will now

    look at the command line options to CTest that support building and running tests.


    | --build-and-test src_directory build_directory |

    | Run cmake on the given source directory using the specified build directory.
    |

    | --test-command Name of the program to run. |

    | --build-target Specify a specific target to build. |

    | --build-nocmake Run the build without running cmake first. |

    | --build-run-dir Specify directory to run programs from. |

    | --build-two-config Run CMake twice before the build. |

    | --build-exe-dir Specify the directory for the executable. |

    | --build-generator Specify the generator to use. |

    | --build-project Specify the name of the project to build. |

    | --build-makeprogram Specify the make program to use. |

    | --build-noclean Skip the clean step. |

    | --build-options Add extra options to the build step. |'
