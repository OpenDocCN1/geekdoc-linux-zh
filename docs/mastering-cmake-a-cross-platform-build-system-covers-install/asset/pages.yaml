  md: '# To Run CMake?


    CMake supports both in-source and out-of-source builds on all operating systems.
    This means that you can configure your build to be completely outside of the source
    tree which makes it very easy to remove all of the files generated by a build.
    Having the build tree differ from the source tree also makes it easy to support
    multiple builds of a single source tree. This is useful when you want to have
    multiple builds with different options but just one copy of the source code. Now
    let us consider the specifics of running CMake using its Qt GUI and command line
    interfaces.


    # Running CMake’s Qt Interface


    CMake includes a Qt based user interface developed by Clinton Stimpson that can
    be used on most platforms, including UNIX, Mac OS X, and Windows. This interface
    is included in the CMake source code, but you will need an installation of Qt
    on your system to build it.


    ![](img/e9100b0b4f9826635471985a71bc8154_15_0.png)


    Figure 1 – Qt based CMake GUI


    On Windows the executable is named cmake-gui.exe and should be in your Start menu
    under Program Files. There may also be a shortcut on your desktop, or if you built
    CMake from source, it will be in the build directory. For UNIX and Mac users the
    executable is'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'named cmake-gui and it can be found where you installed CMake executables.
    A GUI will appear similar to what is shown in Figure 1. The top two entries are
    the source code and binary directories. They allow you to specify where the source
    code is for what you want to compile and where the resulting binaries will be
    placed. You should set these two values first. If the binary directory you specify
    does not exist, it will be created for you. If the binary directory has been configured
