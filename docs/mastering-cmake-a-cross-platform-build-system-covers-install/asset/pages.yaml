    # 3.2 Targets


    Now that we have discussed the overall process of CMake, let us consider some
    of the key items stored in the cmfile instance. Probably the most important item
    is targets. Targets represent executables, libraries, and utilities built by CMake.
    Every add_library, add_executable, and add_custom_target command creates a target.
    For example, the following will create a target named foo that is a static library,
    with fool.c as source files.


