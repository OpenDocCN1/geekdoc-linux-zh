  md: '# 4.8 Linking Libraries


    CMake 2.6 and later a new approach to generating link lines for targets has been
    implemented. Consider these libraries:


    ```

    /path/to/libfoo.a

    /path/to/libfoo.so

    ```


    Previously if someone wrote


    ```

    target_link_libraries (myexe /path/to/libfoo.a)

    ```


    CMake would generate this to link it:


    ```

    ... -L/path/to -W1,-Bstatic -lfoo -W1,-Bdynamic ...

    ```


    This worked most of the time, but some platforms (such as Mac OS X) do not support
    the BStatic or equivalent flag. This made it impossible to link to the static
    version of a library without creating a symlink in another directory and using
    that one instead. Now CMake will generate this code:


    ```

    ... /path/to/libfoo.a ...

    ```


    This guarantees that the correct library is chosen. However there are some caveats
    to keep in mind. In the past a project could create this (incorrect) code, and
    it would work by accident:


    ```

    add_executable (myexe myexe.c)

    target_link_libraries (myexe /path/to/libA.so B)

    ```


    where "B" is meant to link /path/to/libB.so. This code is incorrect because it
    asks CMake to link to B but does not provide the proper linker search path for
    it. It used to work by accident the -L/path/to would get added as part of the
    implementation of linking to A. The correct code would be either


    ```

    link_directories (/path/to)

    add_executable (myexe myexe.c)

    target_link_libraries (myexe /path/to/libA.so B)

    ```'
