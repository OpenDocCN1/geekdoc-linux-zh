  md: '# Appendix A - Variables


    # Variables That Change Behavior


    **BUILD_SHARED_LIBS**: Global flag to add_library to create shared libraries if
    on.

    If present and true, this will cause all libraries to be built shared unless the
    library was explicitly added as a static library. This variable is often added
    to projects as an OPTION that each user of a project can decide if they want to
    build the project using shared or static libraries.


    **CMAKE_BACKWARDS_COMPATIBILITY**: Version of cmake required to build project

    From the point of view of backwards compatibility, this specifies what version
    of CMake should be supported. By default this value is the version number of CMake
    that you are running. You can set this to an older version of CMake to support
    deprecated commands of CMake in projects that were written to use older versions
    of CMake. This can be set by the user or set at the beginning of a CMakeLists
    file.


    **CMAKE_BUILD_TYPE**: Specifies the build type for make generators.

    This specifies what build type will be built in this. Possible values are empty,
    Debug, Release, RelWithDebInfo and MinSizeRel. This variable is only supported
    for make generators. If this value is supported, CMake will also provide initial
    values for the variables with the name CMAKE_C_FLAGS [Debug|Release|RelWithDebInfo|MinSizeRel].
    For example, if CMAKE_BUILD_TYPE is Debug, then CMAKE_C_DEBUG will be added to
    the CMAKE_C_FLAGS.


    **CMAKE_COLOR_MAKEFILE**: Enables color output when using the Makefile generator.'
