  md: 'The warnings the project development tree should be updated to take the new
    policies into account. There are two approaches to updating a tree: one-shot and
    incremental. Which one is easier on the size of the project and what new policies
    produce warnings.


    # The One-Shot Approach


    The simplest approach to updating a project for a new version of CMake is simply
    to change the policy version set at the top of the project, try building with
    the new CMake version, and fix problems. For example, to update a project to build
    with CMake 2.8 one write


    ```

    cmake_minimum_required (VERSION 2.8)

    ```


    at the beginning of the top-level CMakeLists file. This tells CMake to use the
    new behavior introduced in CMake 2.8 and below. When building this project with
    CMake 2.8 no warnings will be produced about policies because it knows of policies
    introduced in later versions. However, if the project was depending on the old
    behavior of a policy it may not be built since CMake uses the new behavior without
    warning. It is up to the project author who added the policy version to fix these
    issues.


    # The Incremental Approach


    Another approach to updating a project for a new version of CMake is to deal with
    each one-by-one. One advantage of this approach is that the project will continue
    to build throughout the process, so the changes can be made incrementally.


    When CMake encounters a situation where it needs to know whether to use the old
    or new behavior for a policy, it checks whether the project has set the policy.
    If the policy is set, CMake silently uses the corresponding behavior. If the policy
    is not set, CMake uses the old behavior but warns that the policy is not set.


    In many cases the warning message will point at the exact line of code in the
    CMakeLists files that caused the warning. In some cases the situation cannot be
    diagnosed until CMake is generating the native build system rules for the project,
    so the warning will not include explicit context information. In cases CMake will
    try to provide some information about where code might need to be changed. The
    documentation for these "generation-time" policies should indicate the point in
    the project code at which the policy should be set to take effect.


    In order to incrementally update a project one warning should be addressed at
