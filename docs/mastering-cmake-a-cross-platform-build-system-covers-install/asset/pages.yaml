  md: "# Writing CMakeLists.Files\n\n```\nset (fooba 0)\n\nif (NOT DEFINED foobar)\n\
    \    message(\"foobar is not defined\")\nendif (NOT DEFINED foobar)\n\nif (NOT\
    \ DEFINED fooba)\n    message(\"fooba not defined\")\nendif (NOT DEFINED fooba)\n\
    ```\n\nIn if statements there is an order of precedence that specifies the order\
    \ that the operations are evaluated. For example, in the statement below, the\
    \ NOT will be evaluated first then the AND, not the other way around. Thus the\
    \ statement will be false and the message never printed. Had the AND evaluated\
    \ the first statement to be true.\n\n```\nif (NOT 0 AND 0)\n    message(\"This\
    \ line is never executed\")\nendif (NOT 0 AND 0)\n```\n\nCMake defines the order\
    \ of operations that parenthetical groups are evaluated first, then EXISTS, COMMAND,\
    \ DEFINED and similar prefix operators are evaluated, then any EQUAL, LESS, GREATER,\
    \ STQUAL, STRESS, STRGEATER, and MATCHES operators. The NOT operators are evaluated\
    \ next, and the final AND and OR expressions will be evaluated. With operations\
    \ that have the same level of precedence, such as AND and OR, they will be evaluated\
    \ from left to right. Once all of the expressions have been evaluated the final\
    \ result will be tested if it is true or false. CMake considers any of the following\
    \ values to be true: ON, 1, YES, Y. 0, FALSE, N, NOTFOUND, *-NOTFOUND, IGNORE.\
    \ This is case insensitive so true, True, and TRUE are treated the same.\n\nNow\
    \ let consider the other flow control commands. The foreach, while, macro, and\
    \ function commands are the best way to reduce the size of your CMake files and\
    \ keep them maintainable. The foreach command enables you to execute a group of\
    \ CMake commands repeatedly on the members of a list. Consider the following example\
    \ adapted from VTK:\n\n```\nforeach (tfile)\n    TestAnisotropicDiffusion2D\n\
    \    TestButterworthLowPass\n    TestButterworthHighPass\n    TestCityBlockDistance\n\
    ```"
