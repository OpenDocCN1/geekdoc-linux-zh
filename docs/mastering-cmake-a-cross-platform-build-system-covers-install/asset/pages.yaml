  md: '# Custom Commands and Targets


    Frequently, the build process for a software project goes beyond simply compiling
    libraries and executables. In many cases additional tasks may be required during
    or after the build process. Common examples include: compiling documentation using
    a documentation package, generating source files by running another executable,
    generating files using tools for which CMake doesn''t have rules (such as lex,
    and yacc), moving the resulting executables, post processing the executable, etc.
    CMake supports these additional tasks using custom commands and custom targets.
    This chapter will describe how to use custom commands and targets to perform complex
    tasks that CMake does not inherently support.


    # 6.1 Portable Custom Commands


    Before going into detail on how to use custom commands, we will discuss how to
    deal with some of their portability issues. Custom commands typically involve
    running programs with files as inputs or outputs. Even a simple command such as
    copying a file can be tricky to do in a cross-platform way. For example, copying
    a file on UNIX is done with the cp command, while on windows it is done with the
    copy command. To matters worse, frequently the names of the files will change
    on different platforms. Executables on Windows end with .exe while UNIX they do
    not. Even between UNIX implementations there are differences in what extensions
    are used for shared libraries; .so, .sl, .dylib, etc.


    CMake provides two main tools for handling these differences. The -E option (short
    for execute) to `cmake`. When the `cmake` executable is passed the -E option it
    acts as a general purpose cross-platform utility command. The arguments following
    the -E option indicate what `cmake` should do. Some of the options include:'
  merge: -1
