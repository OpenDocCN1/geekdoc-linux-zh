    CMake cannot guess the target operating system or hardware, you have to set the
    following CMake variables:


    # CMAKE_SYSTEM_NAME


    This variable is mandatory; it sets the name of the target system, i.e. to the
    same value as CMAKE_SYSTEM_NAME would have if CMake were run on the target system.
    Typical examples are "Linux" and "Windows". It is used for constructing the file
    names of the platform files like Linux.cmake or Windows-gcc.cmake. If your target
    is an embedded system without an OS then CMAKE_SYSTEM_NAME name to "Generic".
    Presetting CMAKE_SYSTEM_NAME this way instead of being detected causes CMake to
    consider the build cross compiling and the CMake variable CMAKE_CROSSCOMPILING
    will be set to TRUE. CMAKE_CROSSCOMPILING is the variable which should be tested
    in CMake files to determine whether the current build is a cross compiled or not.


    # CMAKE_SYSTEM_VERSION


    This variable is optional, it sets the version of your target system. CMake does
    not currently use CMAKE_SYSTEM_VERSION.


    # CMAKE_SYSTEM_PROCESSOR


    This variable is optional, it sets the processor or hardware name of the target
    system. It is used in CMake for one purpose, load the


