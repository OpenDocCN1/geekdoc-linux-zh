  md: '# Converting Windows Based Workspaces


    # 7.6 Converting Windows Based Workspaces


    To convert a Visual Studio workspace (or solution for Visual Studio .Net) to CMake
    makes a few steps. First you will need to create a CMakeLists file at the top
    of your source code directory. This file should start with a project command that
    defines the name of the project. This will become the name of the resulting workspace
    (or solution for Visual Studio .Net). Next you will need to add all of your source
    files into CMake variables. For large projects that have multiple directories
    you can create a CMake files in each directory as described previously in the
    section on source directory structures (page 115). You will then add your libraries
    and executables using add_library and add_executable. By default add_executable
    assumes that your executable is a console application. Adding the WIN32 argument
    to add_executable indicates that it is a Windows application (using WinMain instead
    of main).


    There are a few nice features that Visual Studio supports that CMake can take
    advantage of. One is support for class browsing. Typically in CMake only source
    files are added to a target, not header files. If you add header files to a target,
    they will show up in the workspace and then you will be able to browse them as
    usual. Visual Studio also supports the notion of groups of files. By default CMake
    creates groups for source files and header files. Using the source_group command
    you can create your own groups and assign files to them. If you have any custom
    build steps in your workspace, these can be added to your CMakeLists files using
    the add_custom_command command. Custom targets (Utility Targets) in Visual Studio
    can be added with the add_custom_target command.'
