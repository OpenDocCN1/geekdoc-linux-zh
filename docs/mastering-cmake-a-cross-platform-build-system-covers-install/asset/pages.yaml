  md: "DISABLED indicates that this component should be disabled (unselected) by default.\
    \ The user is free to select this component for installation, unless it is also\
    \ HIDDEN.\n\nDEPENDS lists the components on which this component depends. If\
    \ this component is selected, then each of the components listed must also be\
    \ selected. The dependency information is encoded within the installer itself,\
    \ so that users cannot install inconsistent sets of components.\n\nGROUP names\
    \ the component group of which this component is a part. If not provided, the\
    \ component will be a standalone component, not part of any component group. Component\
    \ groups are described with the cpack_add_component_group command, detailed below.\n\
    \nINSTALL_TYPES lists the installation types of which this component is a part.\
    \ When one of these installations types is selected, this component will automatically\
    \ be selected. Installation types are described with the cpack_add_install_type\
    \ command, detailed below.\n\nDOWNLOAD indicates that this component should be\
    \ downloaded-on-the-fly by the installer, rather than packed with the installer\
