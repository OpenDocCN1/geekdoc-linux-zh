    2. Correctness of new interfaces or bugs fixes in old interfaces should not be
    inhibited by compatibility requirements. Any reduction in correctness of the latest
    interface is not fair on new projects.


    3. Every change made to CMake that may require changes to a project’s CMakeLists
    files should be documented.


    +   - Each change should also have a unique identifier that can be referenced
    by warning and error messages.

    - The new behavior is enabled only when the project has somehow indicated it is
    supported.


    4. We must be able to eventually remove code that implements compatibility with
    ancient CMake versions.


    +   - Such refactoring is necessary to keep the code clean and to allow for internal
    refactoring.

