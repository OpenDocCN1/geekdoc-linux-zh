    # Splitting Your Project into Multiple Subprojects


    One ctest_test invocation builds everything followed by one ctest_test invocation
    that tests everything is sufficient for a project that has no subprojects. But
    if you want to submit results on a per-subproject basis to CDashboard, you will
    have to make changes to your project and test scripts. For your project you need
    to identify which targets are part of what subprojects. If you organize CMake
    files that you have a target to build for each subproject, and you can derive
    (or look up) the name of that target based on the subproject name, then revising
    your script to separate it into multiple smaller configure/build/test chunks should
    be relatively painless. To do this you can modify your CMake files in various
    ways depending on your needs. The most common changes are listed.


    # CMakeLists.txt modifications


    +   - Name targets the same as subprojects, or base target names on subproject
    names, or provide a look mechanism to map from subproject name to target name.

    - Possibly add custom targets to aggregate existing targets into subprojects,
    using add_dependencies to say which existing targets the custom target depends
    on.

    - Add the LABELS property to targets with a value of the subproject name.

    - Add the LABELS test property to tests with a value of the subproject name.


    Next you need to modify your CTest scripts that run your dashboards. To split
    your monolithic build into smaller subproject builds you can use a foreach loop
    in your CTest driver script. To help you iterate over your subprojects, CDashboard
    provides a variable named CTEST_PROJECT_SUBPROJECTS in CTestConfig.cmake. Given
    the above example, CDashboard produces a variable like this:


    ```

    set (CTEST_PROJECT_SUBPROJECTS Libs Exes)

    ```


    CMake orders the elements in this list that the independent subprojects (that
    do not depend on any other subprojects) are first, followed by subprojects that
    depend only on the independent subprojects. After subprojects that depend on those.
    The same logic continues until all subprojects are listed exactly once in this
    list in an order that makes sense for building them sequentially, one after the
    other.'
