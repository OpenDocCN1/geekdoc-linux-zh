    There are some special variables whose prefix depends on the count of given modules.
    When there is only one module, <PREFIX> stays unchanged. When there are multiple
    modules, the prefix will be changed to <PREFIX>_<MODNAME>:


    <XPREFIX> VERSION ... version of the module

    <XPREFIX>_PREFIX ... prefix-directory of the module

    <XPREFIX>_INCLUDEDIR ... include-dir of the module

    <XPREFIX>_LIBDIR ... lib-dir of the module


    <XPREFIX> = <PREFIX> when |MODULES| == 1, else

    <XPREFIX> = <PREFIX>_<MODNAME>


    A <MODULE> parameter can have the following formats:


    {MODNAME} ... matches any version

    {MODNAME}>={VERSION} ... at least version <VERSION> is required

    {MODNAME}={VERSION} ... exactly version <VERSION> is required

    {MODNAME}<{VERSION} ... modules must not be newer than

