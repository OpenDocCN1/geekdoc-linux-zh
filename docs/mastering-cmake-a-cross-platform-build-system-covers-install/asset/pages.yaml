  md: '# Variables and Cache Entries


    A full list of properties supported in CMake can be obtained by running cmake
    with the help-property-list option. The generators and directories are automatically
    created for you as CMake processes your source tree.


    # 3.5 Variables and Cache Entries


    CMakeLists files use variables much like any programming language. Variables are
    used to store values for later use, and can be a single value such as "ON" or
    "OFF", or they can represent a list such as (/usr/include /home/foo/usr/local/include).
    A number of useful variables are automatically defined by CMake and are discussed
    in Appendix A - Variables.


    Variables in CMake are referenced using a ${VARIABLE} notation, and they are defined
    in the order of execution of the set commands. Consider the following example:


    ```

    # FOO is undefined


    set (FOO 1)

    # FOO is now set to 1


    set (FOO 0)

    # FOO is now set to 0

    ```


    This may seem straightforward, but consider the following example:


    ```

    set (FOO 1)


    if (${FOO} LESS 2)

    set (FOO 2)

    else (${FOO} LESS 2)

    set (FOO 3)

    endif (${FOO} LESS 2)

    ```


    Clearly the if statement is true, which means that the body of the if statement
    will be executed. That will set the variable FOO to 2, and so when the else statement
    is encountered FOO will have a value of 2. Normally in CMake the new value of
    FOO would be used, but the else statement is a rare exception to the rule and
    always refers back to the value of the variable when the if statement was executed.
