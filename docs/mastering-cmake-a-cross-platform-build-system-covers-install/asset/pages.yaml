    CMAKE_REQUIRED_LIBRARIES = list of libraries to link\n```\n\n# ExternalProject:\
    \ Create custom targets to build projects in external trees\n\nThe 'ExternalProject_Add'\
    \ function creates a custom target to download, update/patch, configure, build,\
    \ and test tests of an external project:\n\n```\nExternalProject_Add(<name> #\
    \ Name for custom target\n[DEPENDS projects...] # Targets on which the project\
    \ depends\n[PREFIX dir] # Root dir for entire project\n[LIST_SEPARATOR sep] #\
    \ Sep to be replaced by ; in cmd lines\n[TMP DIR dir] # Directory to store temporary\
