    or in a directory named src or source. Even if all of the source code is in a
    subdirectory we recommend creating a CMakeLists file for the top level directory.
    There are two reasons for this. First it can be confusing to some people that
    they run CMake on the subdirectory of the project instead of the main directory.
    Second, you may want to install documentation or other support files from the
    other directories. By having a CMakeLists file at the top of the project you can
    use the add_subdirectory command to step down into the documentation directory
    where its CMakeLists file can install the documentation (you can have a CMakeLists
    file for a documentation directory with no targets or source code).


    For projects that have source code in multiple directories there are a few options.
    One option that many Makefile based projects use is to have a single Makefile
    at the top level directory that lists all the source files to compile in their
    subdirectories. For example:'
