  md: "# Cross Compiling with CMake\n\n```\n# SHARED_LIBRARY_PATH TYPE\n# indicates\
    \ whether the executable would have been able to run\n# on its target platform.\
    \ If so, set SHARED_LIBRARY_PATH_TYPE\n# to the exit code (in many cases 0 for\
    \ success), otherwise\n# enter \"FAILED_TO_RUN\".\n# SHARED_LIBRARY_PATH_TYPE\
    \ TRYRUN_OUTPUT\n# contains the text the executable would have printed on\n# stdout\
    \ and stderr. If the executable would not have been\n# able to run, set SHARED_LIBRARY_PATH_TYPE\
    \ TRYRUN_OUTPUT\n# empty. Otherwise check if the output is evaluated by the\n\
    # calling CMake. If so, check what the source file would\n# have printed when\
    \ called with the arguments.\n# The SHARED_LIBRARY_PATH_INFO_COMPILED variables\
    \ hold the build\n# result for this TRYRUN().\n\n# Source file: -~/src/SharedLibraryPathInfo.cxx\n\
    # Executable : ~/build/cmTryCompileExec-SHARED_LIBRARY_PATH_TYPE\n# Run arguments:\
    \ LDPATH\n# Called from: [1] ~/src/CMakeLists.cmake\n```\n\n```\nset (SHARED_LIBRARY_PATH_TYPE\n\
    \    \"0\"\n    CACHE STRING \"Result from TRYRUN\" FORCE)\n```\n\n```\nset (SHARED_LIBRARY_PATH_TYPE\
    \ TRYRUN_OUTPUT)\n    \"\"\n    CACHE STRING \"Output from TRY_RUN\" FORCE)\n\
    ```\n\nYou can find all of the variables that CMake could not determine, from\
    \ which they were called, the source file, the arguments for the executable and\
    \ the path to the executable. CMake will also compile the executables to the build\
    \ directory, which have the names cmTryCompileExec-<name of the variable>, e.g.\
    \ in this case cmTryCompileExec-SHARED_LIBRARY_PATH_TYPE. You can then try to\
    \ run this executable manually on the actual target platform and check the results.\n\
    \nOnce you have these results, they need to be put into the CMake cache. This\
    \ can be done using cmake/cmake-gui=\"make edit_cache\" and editing the variables\
    \ directly in the cache. It is not possible to reuse these changes in another\
    \ build directory or if CMake.txt is removed.\n\nThe recommended approach is to\
    \ use the RunResults.cmake created by CMake. You should copy it to a safe location\
    \ (i.e. where it will not be removed if the build directory is deleted), and give\
    \ it a useful name, e.g. RunResults-MyProject-eldx-ppc.cmake. The contents of\
    \ this file need to be edited so that the set commands set the required variables"
