    FortranInterface: Fortran/C Interface Detection


    This module automatically detects the API by which C and Fortran languages interact.
    Variables indicate if the mangling is found:


    ```

    FortranInterface_GLOBAL_FOUND

    = Global subroutines and functions

    FortranInterface_MODULE_FOUND

    = Module subroutines and functions

    (declared by "MODULE PROCEDURE")

    ```


    A function is provided to generate a C header file containing macros to mangle
    symbol names:


    ```

    FortranInterface_HEADER (<file>

    [MACRO_NAMESPACE <macro-ns>]

    [SYMBOL <module-ns>]

    [SYMBOLS <<module>]:<function> ...])

    ```'
  merge: -1
  pgno: 401
- img_proc: true
  md: 'It generates in <file> definitions of the following macros:


    ```

    #define FortranCInterface_GLOBAL (name,NAME) ...

    #define FortranCInterface_GLOBAL (name,NAME) ...

    #define FortranCInterface_MODULE (mod, name, MOD, NAME) ...

    #define FortranCInterface_MODULE (mod, name, MOD, NAME) ...

    ```


    These macros mangle four categories of Fortran symbols, respectively:


    +   - Global symbols without ''_'': call mysub()

    - Global symbols with ''_'' : call my_mysub()

    - Module symbols without ''_'' : use mymod; call mysub()

    - Module symbols with ''_'' : use mymod; call my_mysub()


    If mangling for a category is not known, its name is left undefined. All macros
    require names in both lower case and upper case. The MACRO_NAMESPACE option replaces
    the default "FortranCInterface_ prefix with a given namespace "<macro-ns>". The
    SYMBOLS option lists symbols manually with C preprocessor definitions:


    ```

    <function> == #define <ns><function> ...

    <module> == #define <ns><module>_<function> ...

    ```


    If for some symbol is not known then no preprocessor definition is created, and
    a warning is displayed. The SYMBOL_NAMESPACE option prefixes all preprocessor
    definitions generated by the SYMBOLS option with a given namespace "<ns>". Example
    usage:


    ```

    include(FortranCInterface)

    FortranCInterface_HEADER (FC.h MACRO_NAMESPACE "FC")

    ```


    This creates a "FC.h" header that defines mangling macros FC_GLOBAL(), FC_GLOBAL_(),
    FC_MODULE(), and FC_MODULE().). Another example:


    ```

    include(FortranCInterface)

    FortranCInterface_HEADER (FCmangle.h)

    MACRO_NAMESPACE "FC"

    SYMBOL_NAMESPACE "FC"

    SYMBOLS mysub mymod:my_mysub

    ```'
  merge: -1
  pgno: 402
