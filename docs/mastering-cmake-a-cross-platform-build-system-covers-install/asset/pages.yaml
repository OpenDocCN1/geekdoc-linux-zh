  md: 'There are several predefined try-run and try-compile macros in the CMake/Modules
    directory, some of which are listed below. These macros allow some common checks
    to be performed without creating a source file for each one. For detailed documentation
    or to see how these macros look at the implementation files for them in the CMake/Modules
    directory of your CMake installation. Many of these macros will look at the current
    value of the CMake_REQUIRED_FLAGS and CMake_REQUIRED_LIBRARIES variables to add
    additional compile flags or link libraries to the


    # CheckFunctionExists.cmake


    Checks to see if a C function is on a system. This macro takes two arguments,
    the first is the name of the function to check for. The second is the variable
    to store the result into. This macro does use CMake_REQUIRED_FLAGS and CMake_REQUIRED_LIBRARIES
    if they are set.


    # CheckIncludeFile.cmake


    Checks for an include file on a system. This macro takes two arguments. The first
    is the file to look for and the second is the variable to store the result. Additional
    Cflags can be passed in as a third argument or by setting CMake_REQUIRED_FLAGS.


    # CheckIncludeFileCXX.cmake


    Check for an include file in a C++ program. This macro takes two arguments. The
    first is the include file to look for and the second is the variable to store
    the result into. Additional Cflags can be passed in as a third argument.


    # CheckIncludeFiles.cmake


    Check for a group of include files. This macro takes two arguments. The first
    is the include files to look for and the second is the variable to store the result
    into. This macro does use CMake_REQUIRED_FLAGS if it is set. This macro is useful
    when a header file you are interested in checking for is dependent on including
    another header file.


    # CheckLibraryExists.cmake


    Check if a library exists. This macro takes four arguments; the first is the name
    of the library to check for. The second is the name of a function that should
    be in that library. The third argument is the location where the library should
    be found. The fourth argument is a variable to store the result into. This macro
    uses CMake_REQUIRED_FLAGS and CMake_REQUIRED_LIBRARIES if they are set.


    # CheckSymbolExists.cmake


    Check to see if a symbol is defined in a header file. This macro takes three arguments.
    The first argument is the symbol to look for. The second argument is the variable
    to store the result. A list of header files to try including. The third argument
