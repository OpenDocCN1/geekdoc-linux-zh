  md: 'copy of the project''s code. With an experimental dashboard the source code
    is not guaranteed to be up to date. In contrast a Nightly dashboard entry is one
    where CTest tries to update the source code to a specific date and time. The expected
    result is that all nightly dashboard entries for a given day should be based on
    the same source code.


    A continuous dashboard entry is one that is designed to run every time new files
    are checked in. Depending on how frequently new files are checked a single day''s
    dashboard could have many continuous entries. Continuous dashboards are particularly
    helpful for cross platform projects where a problem may only show up on some platforms.
    In those cases a developer can commit a change that works for them on their platform
    and then another platform running a continuous build could catch the error, allowing
    the developer to correct the problem promptly.


    Dynamic Analysis and Coverage dashboards are designed to test the memory safety
    and coverage of a project. A Dynamic Analysis dashboard entry is one where all
    the tests are run with a memory access/leak checking program enabled. Any resulting
    errors or warnings are parsed, summarized and displayed. This is important to
    verify that your software is not leaking, reading from un-initialized memory,
    etc. Coverage dashboard entries are similar in that all the tests are run, but
    as the tests run the lines of code executed are tracked. When all the tests have
    been run, a listing of how many times each line of code was executed is produced
    and displayed on the dashboard.


