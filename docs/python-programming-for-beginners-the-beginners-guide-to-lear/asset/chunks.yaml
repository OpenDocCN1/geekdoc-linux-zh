    [content]

    # 初学者 Python 编程

    学习 Python 基础入门指南。James Herron 编写，通过实用示例快速掌握编程的技巧与方法。


    ## 目录

    - 介绍

    - 详尽背景

    - 版本 1

    - 版本 2

    - 版本 3

    - 如何下载和安装 Python

    - 在 Mac OS X 上安装并运行 Python

    - 在 Unix 和 Linux 上安装并运行 Python

    - 在 Windows 上安装并运行 Python

    - 注意的 Python 环境变量

    - 在 Mac OS X 上打开控制台

    - 在 Linux 上打开控制台

    - 在 Windows 上打开控制台

    - 与 Python 交互

    - 启动并与 Python 交互

    - 变量

    - 基础运算符

    - 循环

    - Python Native 数据类型

    - 数字

    - 字符串

    - 列表

    - 元组

    - 字典

    - 布尔逻辑与条件

    - 在 Python 中构建 "While" 循环

    - [在 Python 中构建 "For 循环"]](#constructing-for-loops-loops-in-python)

    - 结论


    ## 介绍

    `Python` 径认为是广泛使用的编程语言中最容易学习、最好用的语言。Python 代码清晰，易于阅读和易于编写，且简洁而不晦涩。Python 是一门非常强大的语言，这意味着我们通常编写的
    Python 代码行数远少于用 `C++` 或 `Java` 等编写同等应用程序所需的代码。


    Python 是一门跨平台语言：因此同一个 Python 程序可以在 Windows 和类 Unix 系统（如 Linux、BSD 或 Mac OS X）上运行，只需将组成程序的一个或多个文件拷贝到目标机器，无需任何“构建”或编译。构建应用特定平台功能的
    Python 程序是可能的，但这通常并不重要，因为几乎所有的 Python 标准库以及大多数顶级的第三方库都是完全且透明的跨平台的。


    Python 的卓越优势之一是它带有一个非常完整的标准库，这使得我们仅需一行或几行代码就能完成从互联网下载文件、解压压缩包或构建 Web 服务器等任务。在扩展标准库方面，数以千计的第三方库是免费的，有些提供了比标准库更强大、更复杂的工具，例如
    `Twisted` 网络库和 `NumPy` 数值库；而另一些提供了功能强大到无法包含在标准库中的功能，例如 `SimPy` 仿真包。大多数第三方库都可以从
    Python 包索引 `pypi.python.org/pypi` 获取。


    `Python` 可用于过程式、面向对象以及在某种程度上函数式的风格编程，尽管 Python 本质上是一门面向对象的语言。本书解释了如何编写过程化和面向对象的程序，并展示了
    Python 的函数式编程特性。


    本书的目标是向你展示如何用良好的惯用 Python 3 风格编写程序，并在首次阅读后成为 Python 3 语言的有帮助参考书。


    本书的设计适用于不同的受众，包括自学者、业爱好者程序员、学生、科学家、工程师以及其他工作需要编程的人员。为了让如此广泛的人群受益而不让有意识的人感到无聊或让经验少的人迷失，本书假设读者至少有一定的编程经验。本书的结构旨在让你尽可能快地提高生产力。


    ## 详尽背景

    编程语言 `Python` 诞生于 20 世纪 80 年代后期。它由 Guido van Rossum 于 1989 年 12 月在荷兰的 CWI 开始实现，它是
    ABC 语言的继承者，能够处理异常，并与 Amoeba 操作系统进行交互。Van Rossum 是 Python 的主要作者，他在选择 Python 方向上持续的核心作用体现在
    Python 社区授予他的许可中——终身独裁（Benevolent Dictator for Life）（然而，van Rossum 在 2018 年 7
    月 12 日辞去了领导职务）。`Python` 曾被提名参加 BBC 节目《Monty Python 的飞行马戏》。


    `Python 2.0` 于 2000 年 10 月 16 日发布，带有几个重大的新功能，包括用于内存管理的循环检测垃圾回收器以及对 Unicode 的支持。然而，最大的变化是开发方法本身，转向了更加透明且由社区支持的过程。`Python
    3.0` 是一个重要的、向后兼容的版本，于 2008 年 12 月 3 日发布，经过了长期的测试。它的许多重要功能已回移植到虽然向后兼容但目前已不支持的 `Python
    2.6` 和 `2.7` 中。


    ### 早期历史

    1991 年 2 月，Van Rossum 编写了代码（标记为 `0.9.0` 版本）并发布在 `alt`。在开发的这一阶段，他开发了具有继承的类、异常处理、函数，以及
    `list`、`str` 等核心数据类型。最初的公告中还借用了来自 Modula-3 的模块系统；`Python` 的异常模型也遵循 `Modula-3`，并增加了
    `else` 子句。1994 年，Python 的主要讨论组 `comp.lang.python` 成立，标志着 Python 用户群增长的里程碑。


    ### 版本 1

    `Version 1` 于 1994 年 1 月到来。该公告中包含的主要新功能包括函数式编程工具 `lambda`、`map` 和 `reduce`。Van
    Rossum 声称 `Python` 获得了 `lambda`、`reduce()` 和 `map()`，这归功于一位想念这些功能并提供了可用补丁的 Lisp
    黑客。Rossum 留在 CWI 期间发布的最后一个版本是 `Python 1.2`。1995 年，Rossum 恢复了其工作。


    *(注：由于原文文本从 Version 1 之后开始大量重复，此处译文已根据原文物理结构进行翻译)*

