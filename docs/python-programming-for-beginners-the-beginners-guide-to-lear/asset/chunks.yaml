  trans: "\n真值表是逻辑学中的基础数学表格，在 `python` 编程中构建算法（指令）时，记忆或记住真值表非常有帮助。\n\n## 使用布尔运算符进行流控制\n\
    \n要以流控制语句的形式控制程序的执行流和结果，请使用一个条件后跟一个子句。条件会被评估为 `True` 或 `False` 的布尔值，这显示了程序中做出决策的点。也就是说，条件会告诉你某个项的评估结果是\
    \ `True` 还是 `False`。\n\n子句是紧跟在条件后面的代码块，决定了程序的输出。也就是说，它负责执行构造中“如果 x 为真，则执行此操作”的部分。\n\
    \n下面的代码展示了比较运算符与条件语句协同工作以控制 `Python` 程序流的案例：\n\n```python\nif grade >= 65:   \
    \           # Condition\n    print(\"Passing grade\")   # Clause\nelse:\n    print(\"\
    Failing grade\")\n```\n\n此程序将估算每个学生的成绩是及格还是不及格。对于成绩为 `83` 的学生，第一个语句将评估为 `True`，并触发\
    \ `Passing grade` 的打印语句。对于成绩为 `59` 的学生，第一个语句将评估为 `False`，因此程序将继续执行与 `else` 表达式绑定的打印语句：`Failing\
    \ grade`。\n\n由于 `Python` 中的每个单独对象都可以评估为 `True` 或 `False`，`PEP 8` 风格指南不建议将值与 `True`\
    \ 或 `False` 关联，因为这样可读性较低，并且会不断返回意外之外的布尔值。也就是说，你不应该在程序中使用类似 `if sammy == True :`。相反，应将\
    \ `sammy` 关联到另一个返回布尔值的非布尔值。布尔运算符提供的条件可以通过流控制语句来决定程序的最终结果。\n\n## 在 Python 中构建 \"\
    While\" 循环\n\n`while` 循环根据给定的布尔条件实现代码的重复执行。只要 `while` 语句评估为 `True`，`while` 块中的代码就会完成执行。\n\
    \n你可以将 `while` 循环想象成复制的条件语句。在 `if` 语句之后，程序继续向下执行代码，但在 `while` 循环中，程序会跳回 `while`\
    \ 语句的开头，直到条件为 `False`。与执行固定次数的 `for` 循环不同，`while` 循环基于条件，因此你不需要知道代码要重复多少次。\n\n\
    ### While Loop\n\n在 `Python` 中，`while` 循环的构建如下：\n\n```python\nwhile [a condition\
    \ is True]:\n    [do something]\n```\n\n正在执行的 `something` 将持续执行，直到所评估的条件不再为真。让我们构建一个执行\
    \ `while` 循环程序。在这个程序中，我们将要求用户输入密码。在结束此循环之前有两种可能的结果：\n\n- 如果程序密码正确，`while` 循环将退出。\n\
    - 如果程序密码错误，`while` 循环将继续执行。\n\n"
- fmt: "\nWe’ll create a file named `password.py` in our text editor of choice, and\
    \ start by initializing the variable `password` as an empty string:\n```python\n\
    password = ''\n```\nThe empty string will be applied to take input from the user\
    \ within the `while` loop. Now, we’ll construct the `while` statement with its\
    \ condition:\n```python\npassword = ''\nwhile password != 'password':\n```\nHere,\
    \ the `while` is accompanied by the variable `password`. We are looking to see\
    \ if the variable `password` is set to the string `password`, but you can take\
    \ whichever string you’d like. This proposes that if the user inputs the string\
    \ `password`, then the loop will stop and the application will continue to execute\
    \ any code outside of the loop. However, if the string that the user inputs are\
    \ not equal to the string `password`, the loop will continue.\n\nNext, we’ll add\
    \ the block of code that produces something within the `while` loop:\n```python\n\
    password = ''\nwhile password != 'password':\n    print('What is the password?')\n\
    \    password = input()\n```\nInside of the `while` loop, the application runs\
    \ a `print` statement that helps for the password. Then the variable `password`\
    \ is fixed to the user’s input with the `input()` function. The application will\
    \ check to see if the variable `password` is allocated to the string `password`,\
    \ and if it is, the `while` loop will end. Let’s give the program added line of\
    \ code for when that happens:\n```python\npassword = ''\nwhile password != 'password':\n\
    \    print('What is the password?')\n    password = input()\nprint=('Yes, the\
    \ password is ' + password + '. You may enter.')`\n```\nThe last `print()` statement\
    \ is outward of the `while` loop, so when the user enters the password as the\
    \ `password`, they will see the final `print` statement outside of the loop. However,\
