    LoopsNormally, statements are executed consecutively − The first statement in
    a function is executed first, followed by the second, and so on. There may be
    a circumstance when it is needed to execute a block of code numerous numbers of
    times.Programming languages produce different control structures that permit more
    complex execution paths.A loop statement permits us to execute a statement or
    group of statements several times. The given diagram shows a loop statement –![](Image00002.jpg)The
    describing types of loops are provided by  Python programming language for handling
    looping requirements.


    | # | Loop Type & Description |


    | 1 | while loopWhen a given condition is TRUE, it repeats a statement or group
    of statements. It checks the condition before executing the loop body. |


    | 2 | for loopPerforms a sequence of statements numerous times then abbreviates
    the code that runs the loop variable. |


    | 3 | nested loopsOne or more loop can be used inside any another while, or for
    loop. |


    Loop Control StatementsThe execution from its usual sequence is changed by  the
    Loop control statements. All objects are created automatically in scope are destroyed
    while the execution leaves a scope.These control statements are supported by Python
    Language.


    | # | Control Statement & Description |


    | 1 | break statementThe loop statement is terminated by the break statement and
    in the following loop execution is transferred to the statement immediately. |


    | 2 | continue statementCauses the loop to leap the remainder of its body and
    instantly recheck its condition earlier to replicating. |


    | 3 | pass statementThe pass statement is used in Python editor when a statement
    is needed correctly but you do not want any command or code to execute. |


