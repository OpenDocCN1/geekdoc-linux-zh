- fmt: "\n# Python Programming For Beginners\nThe Beginner’s Guide to Learning the\
    \ Basics of Python. Tips and Tricks to Master Programming Quickly with Practical\
    \ Examples by James Herron\n\n## Table Of Contents\n- [Introduction](#introduction)\n\
    - [A Comprehensive Background](#a-comprehensive-background)\n- [Version 1](#version-1)\n\
    - [Version 2](#version-2)\n- [Version 3](#version-3)\n- [How to Download and Install\
    \ Python](#how-to-download-and-install-python)\n- [Install And Run Python In Mac\
    \ OS X](#install-and-run-python-in-mac-os-x)\n- [Install And Run Python In Unix\
    \ And Linux](#install-and-run-python-in-unix-and-linux)\n- [Install And Run Python\
    \ In Windows](#install-and-run-python-in-windows)\n- [The Python Environmental\
    \ Variables To Note](#the-python-environmental-variables-to-note)\n- [Opening\
    \ A Console On Mac OS X](#opening-a-console-on-mac-os-x)\n- [Opening A Console\
    \ On Linux](#opening-a-console-on-linux)\n- [Opening A Console On Windows](#opening-a-console-on-windows)\n\
    - [Interacting With Python](#interacting-with-python)\n- [Starting and Interacting\
    \ with Python](#starting-and-interacting-with-python)\n- [Variable](#variable)\n\
    - [Basic Operators](#basic-operators)\n- [Loops](#loops)\n- [Native Python Datatypes](#native-python-datatypes)\n\
    - [Numbers](#numbers)\n- [Strings](#strings)\n- [Lists](#lists)\n- [Tuples](#tuples)\n\
    - [Dictionary](#dictionary)\n- [Boolean Logic And Conditional](#boolean-logic-and-conditional)\n\
    - [Constructing \"While\" Loops In Python](#constructing-while-loops-in-python)\n\
    - [Constructing \"For Loops\" Loops In Python](#constructing-for-loops-loops-in-python)\n\
    - [Conclusion](#conclusion)\n\n## Introduction\nPython` is presumably the easiest-to-learn\
    \ and nicest-to-use programming language in widespread use. Python code is clear\
    \ to read and write, and it is short without being cryptic. Python is a very powerful\
    \ language, which means that we can normally write far fewer lines of Python code\
    \ than would be needed for an equivalent application written in, say, `C++` or\
    \ `Java`.\n\nPython is a cross-platform language: so the same Python program can\
    \ be run on Windows and Unix-like systems such as Linux, BSD or Mac OS X, just\
    \ copy the file or files that make up the program to the target machine, with\
    \ no “building” or compiling required. It is possible to build Python programs\
    \ that apply platform-specific functionality, but this is unusually important\
    \ since almost all of Python’s standard library and most maximum third-party libraries\
    \ are completely and transparently cross-platform.\n\nOne of Python’s exceptional\
    \ strengths is that it comes with a very full standard library, this provides\
    \ us to do such tasks as download a file from the Internet, unpack a compressed\
    \ archive file or build a web server, just one or a few lines of code. And in\
    \ expanding to the standard library, thousands of third-party libraries are free,\
    \ some providing more strong and sophisticated tools than the standard library\
    \ just like the `Twisted` networking library and the `NumPy` numeric library while\
    \ others give functionality that is too functional to be included in the standard\
    \ library-for instance, the `SimPy` simulation package. Most maximum of the third-party\
    \ libraries is accessible from the Python Package Index, `pypi.python.org/pypi`.\n\
    \n`Python` can be used to program in procedural, object-oriented, and to a minor\
    \ extent, in a functional style, although at heart Python is an object-oriented\
    \ language. This book explains how to write both procedural and object-oriented\
    \ programs, and also shows Python’s functional programming features.\n\nThe goal\
    \ of this book is to show you how to write Python programs in good idiomatic Python\
    \ 3 style, and to be a helpful reference for the Python 3 language after the initial\
    \ reading.\n\nThe book is designed to be useful to various different audiences,\
    \ including self-taught and hobbyist programmers, students, scientists, engineers,\
    \ and others who necessitate programming as part of their work. To be of use to\
    \ such a wide range of people without boring the conscious or losing the less-experienced,\
    \ this book assumes at least some programming experience. This book is structured\
    \ in such a way as to make you as productive as possible as quickly as possible.\n\
    \n## A Comprehensive Background\nThe programming language `Python` was invented\
    \ in the late 1980s. Its implementation was begun in December 1989 by Guido van\
    \ Rossum at CWI in the Netherlands as a follower to ABC able of complaint handling\
    \ and interfacing with the Amoeba operating system. Van Rossum is Python's main\
    \ author, and his continuing central role in choosing the direction of Python\
    \ is reflected in the license given to him by the Python community, Benevolent\
    \ Dictator for Life. (However, van Rossum walked down as leader on July 12, 2018)\
    \ `Python` was nominated for the BBC TV show `Monty Python's Flying Circus`. \n\
    \n`Python 2.0` was issued on October 16, 2000, with several major new features,\
    \ including a cycle-detecting garbage collector for memory management and assistance\
    \ for Unicode. However, the most major change was to the development method itself,\
    \ with a shift to a more transparent and community-backed process. `Python 3.0`,\
    \ an important, backward-compatible release, was released on December 3, 2008,\
    \ after a large period of testing. Many of its important features have been backported\
    \ to the backward-compatible, while by now unsupported, `Python 2.6` and `2.7`.\n\
    \n### Early history\nIn February 1991, Van Rossum wrote the code (labeled version\
    \ `0.9.0`) to `alt`. Then present at this stage in development was he develop\
    \ classes with inheritance, exception handling, functions, the core datatypes\
    \ of `list`, `str`. Also in this initial announcement was a module system borrowed\
    \ from Modula-3; `Python`'s exception model also follows `Modula-3`'s, with the\
    \ addition of `else` clause. In 1994 `comp.lang.python`, the prime discussion\
    \ for Python, was formed, signaling a milestone in the growth of Python's userbase.\n\
    \n### Version 1\n`Version 1` arrived in January 1994. The main new features included\
    \ in this announcement were the functional programming tools `lambda`, `map`,\
    \ and `reduce`. Van Rossum asserted that `Python` acquired `lambda`, `reduce()`\
    \ and `map()`, courtesy of Lisp hacker who missed them and offered working patches.\
    \ The last version published while Rossum was at CWI was `Python 1.2`. In 1995,\
    \ Rossum resumed his work on Python at the Corporation for National Initiatives\
    \ in Reston, Virginia, where he issued several versions. By version `1.4`, Python\
    \ had procured several new features. Important among these are the Modula-3 inspired\
    \ keyword arguments (which are also related to Common Lisp's keyword arguments)\
    \ and built-in support for complex numbers. Also included is a primary form of\
    \ data hiding by name mangling, though this is simply bypassed During Rossum's\
    \ stay at CNRI, he began the Computer Programming for Everybody (CP4E) initiative,\
    \ intending to make programming more available to more people, with a basic \"\
    literacy\" in programming languages, related to the primary English and skills\
    \ needed by most employers. Python served a central role in this: because of its\
    \ center on clean syntax, it was already fitting, and CP4E's goals bore connections\
    \ to its predecessor, ABC. The project was supported by DARPA. As of 2007, the\
    \ CP4E project is inactive. While Python attempts to be simply learnable and not\
    \ too arcane in its syntax and semantics moving out to non-programmers is not\
    \ an existing concern.\n\n### Version 2\n`Python 2.0`, released in October 2000,\
    \ introduced list comprehensions, a feature borrowed from the functional programming\
    \ languages SETL and Haskell. Python's syntax for this construct is very related\
    \ to Haskell's, apart from Haskell's liking for punctuation characters and Python's\
    \ preference for alphabetic keywords. Python 2.0 also started a garbage collection\
    \ system fitted of collecting reference cycles. `Python 2.1` was restricted to\
    \ `1.6.1`, as well as `2.0`. Its permit was renamed Python Software Foundation\
    \ License. All code, documentation, and specifications added from the time of\
    \ `Python 2.1`'s alpha release, is granted by the Python Software Foundation,\
    \ a non-profit organization formed in 2001, modeled after the Apache Software\
    \ Foundation. The release included a modification to the language to help nested\
    \ scopes, like other statically scoped languages. `Python 2.2` was released in\
    \ December 2001; a major innovation was the unification of Python's types (types\
    \ written in C) and classes (types written in Python) into one hierarchy. This\
    \ single unification made Python's object model purely and consistently object-oriented.\
    \ Also added were generators that were inspired by Icon. `Python 2.5` was released\
    \ in September 2006 and introduced them with the `with` statement, which encloses\
    \ a code block within a context manager, allowing Resource Acquisition Initialization\
    \ (RAII)-like behavior and replacing a common `try/finally` idiom. `Python 2.6`\
    \ was issued to correspond with `Python 3.0` and added some points from that release,\
    \ as well as a \"warnings\" mode that highlighted the performance of features\
    \ that were removed in `Python 3.0`. Likewise, `Python 2.7` concurred with and\
    \ added points from `Python 3.1`, which was released on June 26, 2009. Parallel\
    \ `2.x` and `3.x` delivery then ceased, and `Python 2.7` was the eventual release\
    \ in the `2.x` series. In November 2014, it was declared that `Python 2.7` would\
    \ be maintained until 2020, but users were inspired to move to `Python 3` as soon\
    \ as possible. `Python 2.7` support ended on `2020-01-01`, but a final release\
    \ of the code as it appeared on `2020-01-01`, `2.7.18` occurred on `2020-04-20`.\
    \ This marks the end-of-life of `Python 2`.\n\n### Version 3\n`Python 3.0` was\
    \ released on December 3, 2008. It was designed to rectify fundamental design\
    \ flaws in the language-the changes required could not be implemented while retaining\
    \ full backward compatibility with the `2.x` series, which necessitated a new\
    \ major version number. The guiding policy of `Python 3` was: \"reduce specialty\
    \ duplication by eliminating old ways of doing things\". `Python 3.0` was developed\
    \ with identical philosophy as in previous versions. However, Python had gained\
    \ new and redundant ways to program. The identical task, `Python 3.0` had an emphasis\
    \ on eliminating duplicative constructs and modules. But, `Python 3.0` continued\
    \ a multi-paradigm language. Coders could still attend object-oriented, structured,\
    \ and functional programming paradigms, among others.\n"
