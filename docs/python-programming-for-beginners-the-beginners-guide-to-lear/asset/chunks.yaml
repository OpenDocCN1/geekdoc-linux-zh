    \ | `replace(old, new [, max])` | 将字符串中所有的 `old` 替换为 `new`；如果提供了 `max`，则最多替换 `max`\
    \ 次。 |\n| 27 | `rfind(str, beg = 0, end = len(string))` | 与 `find()` 相同，但在 `string`\
    \ 中反向搜索。 |\n| 28 | `rindex(str, beg = 0, end = len(string))` | 与 `index()` 相同，但在\
    \ `string` 中反向搜索。 |\n| 29 | `rjust(width,[, fillchar])` | 返回一个用空格填充的字符串，使主字符串右对齐，总宽度为\
    \ `width` 列。 |\n| 30 | `rstrip()` | 移除 `string` 末尾所有的空白字符。 |\n| 31 | `split(str=\"\
    \", num=string.count(str))` | 根据分隔符 `str`（若提供则使用空格）分割字符串并返回子字符串列表；如果提供了 `num`，则分为最多\
    \ `num` 个子字符串。 |\n| 32 | `splitlines(num=string.count('\\n'))` | 在所有（或 `num` 个）`NEWLINE`\
    \ 处分割字符串，并传递一个去除了 `NEWLINE` 的行列表。 |\n| 33 | `startswith(str, beg=0,end=len(string))`\
    \ | 判断字符串或子字符串（如果提供了起始索引 `beg` 和结束索引 `end`）是否以子字符串 `str` 开头；如果是返回 true，否则返回 false。\
    \ |\n| 34 | `strip([chars])` | 对 `string` 同时执行 `lstrip()` 和 `rstrip()` |\n| 35\
    \ | `swapcase()` | 反转 `string` 中所有字母的大小写状态。 |\n| 36 | `title()` | 返回字符串的“标题格式”（titlecased）版本，即所有单词的首字母大写，其余小写。\
    \ |\n| 37 | `translate(table, deletechars=\"\")` | 根据解释表 `str` (256 个字符) 翻译字符串，排除\
    \ `del` 字符串中的字符。 |\n| 38 | `upper()` | 将 `string` 中的小写字母转换为大写。 |\n| 39 | `zfill(width)`\
    \ | 返回原始字符串，左侧填充零直到总长度为 `width`；为数字设计，`zfill()` 会保留任何提供的符号（少去一个零）。 |\n| 40 | `isdecimal()`\
    \ | 如果 Unicode 字符串仅包含数字字符则返回 true，否则返回 false。 |\n\n## 列表\n序列是 Python 中最基本的数据结构。序列的每个部分都分配有一个数字——即其位置或索引。在序列中，第一个索引为\
    \ 0，第二个索引为 1，依此类推。Python 中有六种内置序列类型，但在本书中，我们将看到最流行的类型是列表 `lists` 和元组 `tuples`。你可以对所有序列类型执行多种操作。这些方法包括索引、切片、合并、乘法和成员性检查。在书中，Python\
    \ 有内置函数用于获取序列的长度以及获取其最大和最小元素。\n\n### Python 列表\n列表是 Python 3 中常用的通用多用途数据类型，可以被列为方括号内用逗号分隔的值（项）的列表。列表中的项不需要类型相同，这是列表的一个重要特点。\n\
    \n就像在方括号之间放置不同的逗号分隔值一样，创建列表非常简单。例如——`List` 索引从 0 开始，且列表可以像字符串索引一样切片和拼接。\n\n###\
    \ 访问列表中的值\n要在列表中输入值，请使用方括号进行切片并结合索引或多个索引来获取该索引处的值。例如——\n\n```python\nlist1 = ['Banana',\
    \ 'Watermelon', 1990, 2000]\nlist2 = [1, 2, 3, 4, 5 ]\nlist3 = [\"a\", \"b\",\
    \ \"c\", \"d\"]\n```\n\n**输出：**\n```text\nlist1[0]: Banana\nlist2[1:5]: [2, 3,\
    \ 4, 5]\n```\n\n执行上述代码时会产生以下**输出**：\n\n### 更新列表\n通过在赋值运算符左侧提供切片，你可以更新列表的单个或多个元素，还可以使用\
    \ `append()` 方法向列表元素添加元素。例如——\n\n```python\n#!/usr/bin/python3\nlist = ['Banana',\
    \ 'Watermelon', 1990, 2000]\n```\n\n执行上述代码时会产生以下**输出**：\n\n```python\nlist[0]\
    \ = 'Apple'\nlist[1:3] = [2021, 2022]\nlist.append('Cherry')\nprint(list)\n```\n\
    \n**输出：**\n```text\n['Apple', 2021, 2022, 2000, 'Cherry']\n```\n\n### 删除列表\n可以使用\
    \ `del` 或 `remove()` 来删除元素。例如——\n\n```python\n#!/usr/bin/python3\nlist = ['Banana',\
    \ 'Watermelon', 1990, 2000]\ndel list[1]\nprint(list)\nlist.remove('Watermelon')\n\
    print(list)\n```\n\n**输出：**\n```text\n['Banana', 1990, 2000]\n['Banana', 1990,\
    \ 2000] # 注意：此处会报错因为 Watermelon 已被删除\n```\n\n### 列表基本操作\n列表对 `+` 和 `*` 运算符有响应。这意味着：\n\
    \n```python\nlist1 = ['Banana', 'Watermelon']\nlist2 = ['Apple', 'Orange']\nlist3\
    \ = list1 + list2\nprint(list3)\n\nlist4 = list1 * 2\nprint(list4)\n```\n\n**输出：**\n\
    ```text\n['Banana', 'Watermelon', 'Apple', 'Orange']\n['Banana', 'Watermelon',\
    \ 'Banana', 'Watermelon']\n```\n\n#### 成员性\n```python\nlist1 = ['Banana', 'Watermelon']\n\
    print('Banana' in list1)\nprint('Orange' in list1)\n```\n\n**输出：**\n```text\n\
    True\nFalse\n```\n\n#### 迭代\n```python\nlist1 = ['Banana', 'Watermelon']\nfor\
    \ x in list1:\n    print(x)\n```\n\n**输出：**\n```text\nBanana\nWatermelon\n```\n\
    \n#### 索引、切片和矩阵\n索引和切片的方法与字符串相同，因为列表是序列。如下所示：\n\n```python\nL = ['C++', 'Java',\
    \ 'Python']\nprint(L[0])\nprint(L[-1])\nprint(L[1:])\n```\n\n**输出：**\n```text\n\
    C++\nPython\n['Java', 'Python']\n```\n\n### 内置列表函数\nPython 提供了近似的列表函数：\n\n| 序号\
    \ | 函数 | 说明 |\n| :--- | :--- | :--- |\n| 1 | `cmp(list1, list2)` | 在 Python 3\
    \ 中不再可用。 |\n| 2 | `len(list)` | 给列表的总长度。 |\n| 3 | `max(list)` | 返回列表中最大的元素。 |\n\
    | 4 | `min(list)` | 返回列表中最小的元素。 |\n| 5 | `list(seq)` | 将序列转换为列表。 |\n\nPython 提供了以下列表方法：\n\
    \n| 序号 | 方法 | 说明 |\n| :--- | :--- | :--- |\n| 1 | `list.append(obj)` | 将对象 obj\
    \ 添加到列表。 |\n| 2 | `list.count(obj)` | 返回 obj 在列表中出现的次数。 |\n| 3 | `list.extend(seq)`\
    \ | 将 `seq` 的内容添加到列表。 |\n| 4 | `list.index(obj)` | 返回列表中包含 `obj` 的最小索引。 |\n| 5\
    \ | `list.insert(index, obj)` | 在指定的索引偏移处插入对象 `obj`。 |\n| 6 | `list.pop(obj =\
    \ list[-1])` | 从列表中移除并返回最后一个对象或 `obj`。 |\n| 7 | `list.remove(obj)` | 从列表中移除对象\
    \ `obj`。 |\n| 8 | `list.reverse()` | 原地反转列表对象。 |\n\n"
- fmt: "\n# Tuples\n\nTuples are a sequence of immutable Python objects. Just like\
    \ lists, Tuples are sequences. Tuples are sequences, unlike lists; this is the\
    \ main difference between tuples and lists. Lists use square brackets but Tuples\
    \ use parentheses. \n\nAs like putting different comma-separated values, creating\
    \ a tuple is simple. Optionally, you can set those comma-separated values within\
    \ parentheses also. As example:\n\n```python\ntup1 = ('Banana', 'Watermelon',\
    \ 1990, 2000)\ntup2 = (1, 2, 3, 4, 5 )\ntup3 = \"a\", \"b\", \"c\", \"d\"\n```\n\
    \nThe blank tuple is written as two parentheses containing nothing: `tup1 = ()`.\
    \ \n\nInclude a comma to write a tuple containing a single value even there there\
    \ is only one value: `tup1 = (50,)`.\n\nTuple indices start at 0, just like string\
    \ indices. They can be sliced, concatenated, and so on.\n\n## Accessing Values\
    \ in Tuples\n\nTo enter values in a tuple, use the square brackets for slicing\
    \ along with the index or indices to get the value obtainable at that index. As\
    \ example:\n\n```python\n#!/usr/bin/python3\ntup1 = ('Banana', 'Watermelon', 1990,\
    \ 2000)\ntup2 = (1, 2, 3, 4, 5, 6)\nprint (\"tup1[0]: \", tup1[0])\nprint (\"\
    tup2[1:5]: \", tup2[1:5])\n```\n\n| Output: |\n| tup1[0]: Banana |\n| tup2[1:5]:\
    \ (2, 3, 4, 5) |\n\nYou cannot update or change the values of tuple elements because\
    \ Tuples are permanent. You are able to take parts of the existing tuples to create\
    \ new tuples as the following example describes:\n\n```python\n#!/usr/bin/python3\n\
    tup1 = (10, 20,30)\ntup2 = ('abc', 'xyz')\n# Following action is not valid for\
    \ tuples\n# tup1[0] = 100;\ntup3 = tup1 + tup2\nprint (tup3)\n```\n\n| Output:\
    \ |\n| (10, 20, 30, 'abc', 'xyz') |\n\n## Delete Tuple Elements\n\nIt is not possible\
    \ to remove individual tuple elements but nothing wrong with putting together\
    \ another tuple with the undesired elements discarded. Just use the `del` statement\
    \ to explicitly remove an entire tuple. As example:\n\n```python\n#!/usr/bin/python3\n\
    tup = ('Banana', 'Watermelon', 1990, 2000)\nprint (tup)\ndel tup;\nprint =(After\
    \ deleting tup : )\nprint (tup)\n```\n\n| Output: |\n| ('Banana', 'Watermelon',\
    \ 1990, 2000) |\n| After deleting tup :Traceback (most recent call last):\nFile\
