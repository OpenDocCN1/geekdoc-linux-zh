  trans: "\n我们将在选定的文本编辑器中创建一个名为 `password.py` 的文件，并首先将变量 `password` 初始化为一个空字符串：\n\
    ```python\npassword = ''\n```\n该空字符串将用于在 `while` 循环中获取用户的输入。现在，我们将构建带有条件的 `while`\
    \ 语句：\n```python\npassword = ''\nwhile password != 'password':\n```\n在这里，`while`\
    \ 伴随着变量 `password`。我们正在检查变量 `password` 是否被设置为字符串 `'password'`，但你可以使用任何你喜欢的字符串。这意味着如果用户输入字符串\
    \ `'password'`，循环将停止，应用程序将继续执行循环之外的任何代码。然而，如果用户输入的字符串不等于 `'password'`，则循环将继续。\n\
    \n接下来，我们将在 `while` 循环中添加一段产生内容的代码块：\n```python\npassword = ''\nwhile password\
    \ != 'password':\n    print('What is the password?')\n    password = input()\n\
    ```\n在 `while` 循环内部，应用程序运行一个 `print` 语句来提示密码。然后，使用 `input()` 函数将变量 `password`\
    \ 固定为用户的输入。应用程序将检查变量 `password` 是否分配给了字符串 `'password'`，如果是，`while` 循环将结束。让我们为这种情况给程序添加一行代码：\n\
    ```python\npassword = ''\nwhile password != 'password':\n    print('What is the\
    \ password?')\n    password = input()\nprint=('Yes, the password is ' + password\
    \ + '. You may enter.')`\n```\n最后一个 `print()` 语句在 `while` 循环之外，因此当用户输入的密码为 `'password'`\
    \ 时，他们将看到循环之外的最终 `print` 语句。然而，如果用户从未输入过单词 `'password'`，他们将永远无法到达最后一个 `print()`\
    \ 语句，并陷入死循环。死循环是指程序不断在一个循环内执行而永不退出。要在命令行中退出死循环，请按 `CTRL + C`。\n\n```bash\npython\
    \ password.py\n```\n你将收到密码提示提示，然后可以使用各种可能的输入对其进行检查。以下是程序的示例输出：\n\nOutput\n```\n\
    What is the password?\nhello\nWhat is the password?\nsammy\nWhat is the password?\n\
    PASSWORD\nWhat is the password?\npassword\nYes, the password is password. You\
    \ may enter.\n```\n\n## Python 中的 for 循环\n\n`for` 循环根据循环计数器或循环变量实现代码的执行。这意味着 `for`\
    \ 循环通常用于在进入循环之前已确定迭代次数的情况，这与基于条件的 `while` 循环不同。\n\n### For 循环\n在 Python 中，`for`\
    \ 循环的构建如下：\n```python\nfor [iterating variable] in [sequence]:\n    [do something]\n\
    ```\n被执行的内容将一直运行直到序列结束。让我们来看一个遍历值范围的 `for` 循环：\n```python\nfor i in range(0,5):\n\
    \    print(i)\n```\n当我们运行此程序时，输出如下：\n\nOutput\n```\n0\n1\n2\n3\n4\n```\n这个 `for`\
    \ 循环将 `i` 固定为其迭代变量，链存在于 0 到 5 的 `range` 中。。在循环内部，每次迭代打印一个整数。请记住，编程中倾向于从索引 0 开始，所以虽然打印了\
    \ 5 个数字，但它们的范围是 0-4。当程序需要重复执行一段代码块时，你通常会看到并应用 `for` 循环。\n\n### 使用 `range()` 的\
    \ for 循环\nPython 的内置永久序列类型之一是 `range()`。在循环中，`range()` 用于控制循环重复的次数。在使用 `range()`\
    \ 时，你可以在传递它的 1 到 3 个整数参数之间切换：\n- `start`：指定序列开始的整数值，如果没有涉及，则 `start` 从 0 开始。\n\
    - `stop`：是强制要求的，是计数到此但不包含的整数。\n- `step`：设置下一次迭代的增量，如果省略，则 `step` 默认为 1。\n\n我们将查看一些向\
    \ `range()` 传递不同参数的示例。首先，我们只传递 `stop` 参数，使我们的序列设为 `range(stop)`：\n```python\n\
    for i in range(6):\n    print(i)\n```\n在之前的程序中，`stop` 参数为 6，因此代码将从 0 迭代到 6（不包含\
    \ 6）：\n\nOutput\n```\n0\n1\n2\n3\n4\n5\n```\n接下来，我们将看到 `range(start, stop)`，传递了迭代何时开始何时结束的值：\n\
    ```python\nfor i in range(20,25):\n    print(i)\n```\n现在，`range` 从 20（包含）到 25（不包含），所以输出为：\n\
    \nOutput\n```\n20\n21\n22\n23\n24\n```\n`range()` 的 `step` 参数与切片字符串时定义步长有关，因为它可以用于跳过序列中的值。在所有三个参数都存在的情况下，`step`\
    \ 位于最后一个位置：`range(start, stop, step)`。首先，让我们应用一个正值的步长：\n```python\nfor i in range(0,15,3):\n\
    \    print(i)\n```\n在这个示例中，`for` 循环被设定为打印从 0 到 15 的数字，但步长为 3，因此每隔三个数字打印一个，如下所示：\n\
    \nOutput\n```\n0\n3\n6\n9\n12\n```\n我们还可以为 `step` 参数应用负值来反向迭代，但我们必须相应地调整起始和停止参数：\n\
    ```python\nfor i in range(100,0,-10):\n    print(i)\n```\n在这里，100 是起始值，0 是停止值，-10\
    \ 是范围，所以循环从 100 开始到 0，每次迭代减少 10。我们可以在输出中看到这种情况：\n\nOutput\n```\n100\n90\n80\n\
    70\n60\n50\n40\n30\n20\n10\n```\n在 Python 中，`for` 循环通常获取 `range()` 序列类型作为迭代参数。\n\
    \n### 使用序列类型的 for 循环\n列表和其他数据序列类型也可以作为 `for` 循环的重复参数。与其遍历 `range()`，不如分配一个列表并遍历该列表：\n\
    ```python\nsharks = ['hammerhead', 'great white', 'dogfish', 'frilled', 'bullhead']\n\
    for shark in sharks:\n    print(shark)\n```\n在这个示例中，我们正在打印列表中的每一项。虽然我们使用了变量 `shark`，但我们可以使用任何其他有效的变量名，并得到相同的输出：\n\
    \nOutput\n```\nhammerhead\ngreat white\ndogfish\nfrilled\nbullhead\n```\n\n##\
    \ 嵌套循环\n在 Python 中，可以嵌套循环。嵌套循环是发生在另一个循环中的循环，结构上与嵌套 if 语句相关。它们的创建如下：\n```python\n\
    for [first iterating variable] in [outer loop]:\n    [do something] # 可选\n   \
    \ for [second iterating variable] in [nested loop]:\n        [do something]\n\
    ```\n程序首先遇到外部循环，执行其最早迭代。这次迭代触发了内部嵌套循环。\n\n"
