    在某些情况下，Python 涉及三种原生数值类型：整数（`int`）、实数（`float`）和复数（`complex`）。


    ```python

    type(2)<class ''int''>

    type(1.5)<class ''float''>

    type(1+1j)<class ''complex''>

    ```


    `float` 的名称出现在 Python 中表示实数的方式中：一种“浮点”表示法。虽然数字表示的具体细节不是本文要讨论的问题，但了解 `int` 和 `float`
    对象之间的一些高层区别是必要的。不恰的是，`int` 对象只能表示整数，但它们是精确表示的，没有任何近似值。另一方面，`float` 对象可以表示宽范围的分数，但并非所有的有理数都是可以表示的。尽管如此，`float`
    对象通常用于近似表示实数和有理数，直到某些有效数字。


    Python 有许多原生数据类型。以下是重要的类型：


    1. 布尔值是 `True` 或 `False`。

    2. 数字可以是整数（`1` 和 `2`）、浮点数（`1.1` 和 `1.2`）、分数（`1/2` 和 `2/3`），甚至是复数。

    3. 字符串是 Unicode 字符的序列，例如一个 `Html` 文档。

    4. 字节和字节数组，例如 `jpeg` 图像文件。

    5. 列表是值的有序序列。

    6. 元组是有序的、不可变的值序列。

    7. 集合是无序的值包。

    8. 字典是无序的键值对包。


    当然，类型比这些多。Python 中的一切皆都是对象，因此有像 `module`、`function`、`class`、`method`、`file` 甚至编辑过的代码这样的类型。


    ## 数字


    数值由 `Number` 数据类型存储。它们是不可变数据类型。这意味着，更改数字数据类型的值将输出一个新分配的对象。在赋值值时，会创建 `Number` 对象。例如——


    ```python

    var1 =10

    var2 =20

    ```


    通过使用 `del` 语句，也可以删除对数字对象的引用。`del` 语句的语法是——`del var1[,var2[,var3[....,varN]]]]`。使用
    `del` 语句可以删除单个对象或多个对象。例如——


    ```python

    del var

    del var_a, var_b

    ```


    Python 支持不同的数值−


    * `int`（有符号整数）——通常直接被称为整数或 `ints`。它们是没有小数点的正负总数。在 Python 3 中，整数是无限大小的。Python 2
    持有两种整数类型 - `int` 和 `long`。Python 3 中不再有“长型整数”了。

    * `float`（浮点实值）——它也被称为 `floats`。实数由它们表示，并用小数点划分整数部分和小数部分。在科学计数法中，浮点数也可以用 `E` 或
    `e` 表示 10 的幂次（`2.5e2 = 2.5 x 102 = 250`）。

    * `complex`（复数）——形式为 `a + bJ`，其中 `a` 和 `b` 是 `floats``J`（或 `j`）表示 -1 的平方根（这是一个虚数）。数的实部是
    `a`，虚部是 `b`。在 Python 编程中，复数并不算常用。


    可能会以十六进制或八进制形式表示整数。


    ```python

    number = 0xA0F # 十六进制

    number2575

    number = 0o37 # 八进制

    number31

    ```


    ## 示例


    这里给出了一些数字的示例。


    | int |

    | :--- |

    | 10 |

    | 200 |

    | -245 |

    | 078 |

    | -0360 |

    | -0x290 |

    | 0x39 |


    复数由一个有序的实浮点数对组成，表示为 `a + bj`，其中 `a` 是复数的实部，`b` 是虚部。


    ## 数字类型转换


    Python 在包含混合类型的插图中，会从内部将数字转换为通用类型以进行调整。有时，你需要显式地将数字从一种类型转换为另一种类型，以满足运算符或函数参数的条件。


    * 使用类型 `int(x)` 将 `x` 转换为普通整数。

    * 使用类型 `long(x)` 将 `x` 转换为长型整数。

    * 使用类型 `float(x)` 将 `x` 转换为浮点数。

    * 使用类型 `complex(x)` 将 `x` 转换为实部为 `x`、虚部为 0 的复数。

    * 使用类型 `complex(x, y)` 将 `x` 和 `y` 转换为实部为 `x`、虚部为 `y` 的复数。`x` 和 `y` 是数值表达式。


    ## 数学函数


