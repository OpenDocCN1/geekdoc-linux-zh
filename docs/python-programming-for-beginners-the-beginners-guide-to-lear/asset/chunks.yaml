    # 布尔逻辑与条件


    布尔数据类型可以是两个值之一：`True` 或 `False`。在编程中使用布尔值可以执行比较并控制应用程序的流。布尔值表示了与数学逻辑分支相关的真值，这些值指导了计算机科学中的算法。该词以数学家乔治·布尔（George
    Boole）命名，`Boolean` 一词的首字母始终大写 `B`。`True` 和 `False` 的值也通常分别大写 `T` 和 `F`，因为它们是 Python
    中的特殊值。


    在本章中，我们将回顾理解布尔值工作所需的基础知识，包括布尔比较、逻辑运算符以及真值表。


    ## 比较运算符


    在编程中，比较运算符用于比较值并求值为单个的（`True` 或 `False`）的布尔值。下表显示了布尔比较运算符。


    | 运算符 | 含义 |

    | :--- | :--- |

    | `==` | 等于 |

    | `!=` | 不等于 |

    | `<` | 小于 |

    | `>` | 大于 |

    | `<=` | 小于等于 |

    | `>=` | 大于等于 |


    为了理解这些运算符的工作原理，让我们为程序中的两个变量分配两个整数：

    ```python

    x = 5

    y = 8

    ```

    我们知道在这个示例中，由于 `x` 的值为 5，因此它小于值为 8 的 `y`。应用这两个变量及其相关的值，让我们遍历上表中的运算符。在程序中，我们将让 Python
    输出每个比较运算符的求值是 `True` 还是 `False`。


    ```python

    x = 5

    y = 8

    print("x == y:", x == y)

    print("x != y:", x != y)

    print("x < y:", x < y)

    print("x > y:", x > y)

    print("x <= y:", x <= y)

    print("x >= y:", x >= y)

    ```


    为了帮助更好地理解理解输出，我们将让 Python 同时打印一个字符串显示它正在评估的内容。

    输出：

    ```

    x == y: False

    x != y: True

    x < y: True

    x > y: False

    x <= y: True

    x >= y: False

    ```


    遵循数学逻辑，在之前的每个表达式中，Python 都评估了：

    - 5 (`x`) 等于 8 (`y`) 吗？False

    - 5 不等于 8 吗？True

    - 5 小于 8 吗？True

    - 5 大于 8 吗？False

    - 5 小于等于 8 吗？True

    - 5 不等于？False


    虽然这里使用了整数，但我们可以将其替换为浮点值。字符串也可以用于布尔运算符。除非使用额外的字符串方法，否则字符串对大小写敏感。我们可以查看实践中是如何比较字符串的：


    ```python

    Sammy = "Sammy"

    sammy = "sammy"

    print("Sammy == sammy: ", Sammy == sammy)

    ```

    输出：

    ```

    Sammy == sammy:  False

    ```

    之前的字符串 `"Sammy "` 不等于字符串 `"sammy "`，因为它们并不完全相同；一个以大写 S 开头，另一个以小写 s 开头。但如果你添加一个赋值为
    `"Sammy "` 的额外变量，那么它们的求值结果将相等：


    ```python

    Sammy = "Sammy"

    sammy = "sammy"

    also_Sammy = "Sammy"

    print("Sammy == sammy: ", Sammy == sammy)

    print("Sammy == also_Sammy", Sammy == also_Sammy)

    ```

    输出：

    ```

    Sammy == sammy:  False

    Sammy == also_Sammy:  True

    ```

    你也可以将其他比较运算符（包括 `>` 和 `<`）应用于比较两个字符串。Python 将使用字符的 ASCII 值对这些字符串进行字典序分析。我们也可以用比较运算符估算布尔值：


    ```python

    t = True

    f = False

    print("t != f: ", t != f)

    ```

    输出：

    ```

    t != f:  True

    ```

    上述输出显示 `True` 不等于 `False`。


    ## 逻辑运算符


    有三个逻辑运算符用于比较值。它们将表达式求值为布尔值，返回 `True` 或 `False`。这些运算符是 `and`、`or` 和 `not`，下表所示。


    | 运算符 | 含义 | 形式 |

    | :--- | :--- | :--- |

    | And | 如果两者都为真则为真 | `x and y` |

    | Or | 如果至少有一个为真则为真 | `x or y` |

    | not | 仅当为假时为真 | `not x` |


    逻辑运算符通常用于评估两个或多个表达式是否为真。例如，它们可以用于判断成绩是否通过以及学生是否选了课程，如果这两种情况都成立，则学生将被允许通过。


    为了理解逻辑运算符如何工作，让我们评估三个表达式：


    ```python

    print((9 > 7) and (2 < 4))  # 两个表达式都为真

    print((8 == 8) or (6 != 6)) # 其中一个表达式为真

    print(not(3 <= 1))         # 表达式为假

    ```

    输出：

    ```

    True

    True

    True

    ```


    ## 真值表


    数学逻辑分支有很多，但我们可以选择性学习以促进编程时的算法思维。下面是比较运算符 `==` 以及每个逻辑运算符 `and`、`or` 和 `not` 的真值表。虽然你能够推导出它们，但也有必要努力记忆它们，这可以使你的编程决策过程更快。


    ### == 真值表


    | x | == |

    | :--- | :--- |

    | True | True |

    | True | False |

    | False | True |

    | False | False |


    ### AND 真值表


    | x | and |

    | :--- | :--- |

    | True | True |

    | True | False |

    | False | True |

    | False | False |


    ### OR 真值表


    | x | or |

    | :--- | :--- |

    | True | True |

    | True | False |

    | False | True |

    | False | False |


    ### NOT 真值表


    | not |

    | :--- | :--- |

    | True | False |

    | False | True |


    '
- fmt: "\nTruth tables are basic mathematical tables used in logic and are useful\
    \ to memorize or keep in mind when constructing algorithms (instructions) in `python`\
    \ programming.\n\n## Using Boolean Operators for Flow Control\n\nTo control the\
    \ stream and outcomes of a program in the form of flow control statements, use\
    \ a condition followed by a clause. A condition evaluates down to a Boolean value\
    \ of `True` or `False`, displaying a point where a decision is made in the program.\
    \ That is, a condition would show you if something evaluates to `True` or `False`.\n\
    \nThe clause is the block of code that follows the condition and dictates the\
    \ outcome of the program. That is, it is the perform this part of the construction\
    \ “If x is true, then do this.”\n\nThe code below shows a case of comparison operators\
    \ working in tandem with conditional statements to control the flow of a `Python`\
    \ program:\n\n```python\nif grade >= 65:              # Condition\n    print(\"\
    Passing grade\")   # Clause\nelse:\n    print(\"Failing grade\")\n```\n\nThis\
    \ program will estimate whether each student’s grade is passing or failing. In\
    \ the case of a student with a grade of `83`, the first statement will estimate\
    \ to `True`, and the print statement of `Passing grade` will be triggered. In\
    \ the case of a student with a grade of `59`, the first statement will estimate\
    \ to `False`, so the program will move on to perform the print statement tied\
    \ to the `else` expression: `Failing grade`.\n\nBecause every individual object\
    \ in `Python` can be evaluated to `True` or `False`, the `PEP 8` Style Guide recommends\
    \ against associating a value to `True` or `False` because it is less readable\
    \ and will constantly return an unexpected Boolean. That is, you should bypass\
    \ using `if sammy == True :` in programs. Instead, associate `sammy` to another\
    \ non-Boolean value that will return a Boolean. Boolean operators present conditions\
    \ that can be applied to decide the eventual outcome of a program through flow\
    \ control statements.\n\n## Constructing \"While\" Loops In Python\n\nA `while`\
    \ loop implements the reproduced execution of code based on a given Boolean condition.\
    \ The code that is in a `while` block will complete as long as the `while` statement\
    \ evaluates to `True`.\n\nYou can think of the `while` loop as a copying conditional\
    \ statement. After an `if` statement, the program remains to execute code, but\
    \ in a `while` loop, the program bounces back to the start of the `while` statement\
    \ until the condition is `False`. As exposed to `for` loops that execute a certain\
    \ number of times, `while` loops are conditionally based, so you don’t need to\
    \ know how many times to repeat the code going in.\n\n### While Loop\n\nIn `Python`,\
    \ `while` loops are constructed like so:\n\n```python\nwhile [a condition is True]:\n\
    \    [do something]\n```\n\nThe `something` that is being done will continue to\
    \ be executed until the condition that is being assessed is no longer true. Let’s\
    \ build a small program that executes a `while` loop. In this program, we’ll ask\
    \ the user to input a password. While going ended this loop, there are two possible\
    \ outcomes:\n\n- If the program password is correct, the `while` loop will exit.\n\
    - If the program password is not correct, the `while` loop will continue to execute.\n"
