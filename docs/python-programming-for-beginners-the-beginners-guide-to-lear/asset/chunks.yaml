    \ is not already in `dict` |\n| 9 | `dict.update(dict2)` Adds dictionary `dict2`'s\
    \ key-values pairs to `dict` |\n\n# Boolean Logic And Conditional\n\nThe Boolean\
    \ data type can be 1 of two values, either `True` or `False`. Use Booleans in\
    \ programming to perform comparisons and to control the flow of the application.\
    \ Booleans express the true values that are associated with the logic branch of\
    \ mathematics, which informs algorithms in computer science. Named for the mathematician\
    \ George Boole, the word `Boolean` constantly begins with a capitalized `B`. The\
    \ values `True` and `False` will also regularly be with a capital `T` and `F`\
    \ respectively, as they are special values in Python.\n\nIn this chapter, we’ll\
    \ go over the basics you’ll need to understand how Booleans work, including Boolean\
    \ comparison and logical operators, and truth tables.\n\n## Comparison Operators\n\
    \nIn programming, comparison operators are used to comparing values and evaluate\
    \ down to a single Boolean value of either `True` or `False`. The table below\
    \ shows the Boolean comparison operators.\n\n| Operator | What it means |\n| :---\
    \ | :--- |\n| `==` | Equal to |\n| `!=` | Not equal to |\n| `<` | Less than |\n\
    | `>` | Greater than |\n| `<=` | Less than or equal to |\n| `>=` | Greater than\
    \ or equal to |\n\nTo understand how these operators work, let’s assign two integers\
    \ to two variables in a program:\n```python\nx = 5\ny = 8\n```\nWe know that in\
    \ this example since `x` has a value of 5, it is less than `y` which has a value\
    \ of 8. Applying those two variables and their associated values, let’s go through\
    \ the operators from the table above. In this program, we’ll charge Python to\
    \ print out whether each comparison operator evaluates to either `True` or `False`.\n\
    \n```python\nx = 5\ny = 8\nprint(\"x == y:\", x == y)\nprint(\"x != y:\", x !=\
    \ y)\nprint(\"x < y:\", x < y)\nprint(\"x > y:\", x > y)\nprint(\"x <= y:\", x\
    \ <= y)\nprint(\"x >= y:\", x >= y)\n```\n\nTo help us better understand this\
    \ output, we’ll have Python also print a string to show us what it’s evaluating.\n\
    Output:\n```\nx == y: False\nx != y: True\nx < y: True\nx > y: False\nx <= y:\
    \ True\nx >= y: False\n```\n\nFollowing mathematical logic, in each of the expressions\
    \ before, Python has evaluated:\n- Is 5 (`x`) equal to 8 (`y`)? False\n- Is 5\
    \ not equal to 8? True\n- Is 5 less than 8? True\n- Is 5 greater than 8? False\n\
    - Is 5 less than or equal to 8? True\n- Is 5 not lesss than or equal to 8? False\n\
    \nAlthough used integers here, we could replace them with float values. Strings\
    \ can also be used with Boolean operators. They are case-sensitive unless employing\
    \ an additional string method. We can look at how strings are compared in practice:\n\
    \n```python\nSammy = \"Sammy\"\nsammy = \"sammy\"\nprint(\"Sammy == sammy: \"\
    , Sammy == sammy)\n```\nOutput:\n```\nSammy == sammy:  False\n```\nThe string\
    \ `\"Sammy \"` earlier is not equal to the string `\"sammy \"`, because they are\
    \ not precisely the same; one starts with an upper-case S and the opposite with\
    \ a lower-case s. But, if you add an extra variable that is assigned the value\
    \ of `\"Sammy \"`, then they will evaluate to equal:\n\n```python\nSammy = \"\
    Sammy\"\nsammy = \"sammy\"\nalso_Sammy = \"Sammy\"\nprint(\"Sammy == sammy: \"\
    , Sammy == sammy)\nprint(\"Sammy == also_Sammy\", Sammy == also_Sammy)\n```\n\
    Output:\n```\nSammy == sammy:  False\nSammy == also_Sammy:  True\n```\nYou can\
    \ too apply the other comparison operators including `>` and `<` to compare two\
    \ strings. Python will analyze these strings lexicographically using the ASCII\
    \ values of the characters. We can also estimate Boolean values with comparison\
    \ operators:\n\n```python\nt = True\nf = False\nprint(\"t != f: \", t != f)\n\
    ```\nOutput:\n```\nt != f:  True\n```\nThe above Output that `True` is not equal\
    \ to `False`.\n\n## Logical Operators\n\nThere are three logical operators that\
    \ are applied to compare values. They assess expressions down to Boolean values,\
    \ returning either `True` or `False`. These operators are `and`, `or`, and `not`\
    \ and are described in the table below.\n\n| Operator | What it means | What it\
    \ looks like |\n| :--- | :--- | :--- |\n| And | True if they both are true | `x\
    \ and y` |\n| Or | True if at least 1 is true | `x or y` |\n| not | True only\
    \ if it false | `not x` |\n\nLogical operators are typically applied to evaluate\
    \ whether two or more expressions are true or not true. For instance, they can\
    \ be applied to determine if the grade is passing and that the student is enrolled\
    \ in the course, and if both cases are true then the student will be allowed a\
    \ grade in the system. Another example would be to decide whether a user is a\
    \ valid active customer of an online shop based on whether they have shop credit\
    \ or have made an investment in the past 6 months. \n\nTo understand how logical\
    \ operators work, let’s estimate three expressions:\n\n```python\nprint((9 > 7)\
    \ and (2 < 4))  # Both original expressions are True\nprint((8 == 8) or (6 !=\
    \ 6)) # One original expression is True\nprint(not(3 <= 1))         # The original\
    \ expression is False\n```\nOutput:\n```\nTrue\nTrue\nTrue\n```\n\n## Truth Tables\n\
    \nThere is a lot to study about the logic branch of mathematics, but we can selectively\
    \ learn some of it to promote our algorithmic thinking when programming. Below\
    \ are truth tables for the comparison operator `==`, and every of the logic operators\
    \ `and`, `or`, and `not`. While you may be capable to reason them out, it and\
    \ can also be necessary to work to memorize them as that can make your programming\
    \ decision-making process quicker.\n\n### == Truth Table\n\n| x | == |\n| :---\
    \ | :--- |\n| True | True |\n| True | False |\n| False | True |\n| False | False\
    \ |\n\n### AND Truth Table\n\n| x | and |\n| :--- | :--- |\n| True | True |\n\
