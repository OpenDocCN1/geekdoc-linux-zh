    \ defined |\n\n**Note** — an exception is raised. After `del tup`, tuple does\
    \ not exist anymore.\n\n## Basic Tuples Operations\n\nAs like strings, Tuples\
    \ respond to the `+` and `*` operators. They involve concatenation and repetition\
    \ here too, except that the result is a new tuple, not a string. As a matter of\
    \ fact, tuples react to all the general sequence operations we did on strings\
    \ in the earlier chapter.\n\n| Python Expression | Results |\n| :--- | :--- |\n\
    | `len((5,6,7))` | 3 |\n| `(5,6,7) + (8,9,10)` | `(5,6,7,8,9,10)` |\n| `('Hi!',)\
    \ * 4` | `('Hi!', 'Hi!', 'Hi!', 'Hi!')` |\n| `3 in (5,6,7)` | True |\n| `for x\
    \ in (6,7) : print (x, end = ' ')` | 6 7 |\n\n## Indexing, Slicing, and Matrixes\n\
    \nIndexing and slicing work the same way for tuples as they do for strings because\
    \ tuples are sequences. Assuming the following input: `T=('C++', 'Java', 'Python')`\n\
    \n| Python Expression |\n| :--- |\n| `T[2]` |\n| `T[-2]` |\n| `T[1:]` |\n\n##\
    \ No Enclosing Delimiters\n\nNo enclosing delimiters is either set of various\
    \ objects, comma-marked, written without identifying symbols as explained in these\
    \ short examples.\n\n## Built-in Tuple Functions\n\nPython involves the subsequent\
