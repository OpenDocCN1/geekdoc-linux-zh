    | 1 | `abs(x)` 绝对值 |

    | 2 | `ceil(x)` 向上取整 |

    | 3 | `floor(x)` 向下取整 |

    | 4 | `pow(x, y)` 幂 |

    | 5 | `exp(x)` 指数函数 |

    | 6 | `fabs(x)` 绝对值 |

    | 7 | `log(x)` 自然对数 |

    | 8 | `log10(x)` 以 10 为底的对数 |

    | 9 | `max(x, y)` 最大值 |

    | 10 | `min(x, y)` 最小值 |

    | 11 | `modf(x)`  |

    | 12 | `round(x[,n])` 保留 `n` 位 |

    | 13 | `sqrt(x)` 平方 |


    ## 随机数函数


    在游戏、模拟中会使用随机数。Python 引入了以下函数。


