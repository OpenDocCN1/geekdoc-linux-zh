- fmt: "\nAs we have seen, numbers are native; numeric literals evaluate to numbers,\
    \ and mathematical operators manage number objects.>>> `12 + 30000000000000000000000003000000000000000000000012`\n\
    \nIn case, Python involves three native numeric types: integers (`int`), real\
    \ numbers (`float`), and complex numbers (`complex`). \n\n```python\ntype(2)<class\
