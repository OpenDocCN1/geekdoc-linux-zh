    ## Python Dictionary

    Python''s dictionaries are sort of hash-table type. They act like associative
    arrays or hashes found in Perl and consist of key-value pairs. A dictionary key
    can be about any Python type but are usually numbers or strings. Values, on the
    other hand, can be any unrestricted Python object. Dictionaries are surrounded
    by curly braces `{ }` and values can be assigned and entered using square braces
    `[ ]`. As example –


    ```python

    #!//usr/bin/python3

    dict = {}

    dict[''one''] = "This is one"

    dict[2]     = "This is two"

    tinydict = {''name'': ''steve'',''code'':1005, ''dept'': ''marketing''}

    print (dict[''one''])           # Prints value for ''one'' key

    print (dict[2])               # Prints value for 2 key

    print (tinydict)              # Prints complete dictionary

    print (tinydict.keys())       # Prints all the keys

    print (tinydict.values())     # Prints all the values

    ```


    **Output:**

    `This is one`

    `This is two`

    `{''name'': ''steve'', ''code'': 1005, ''dept'': ''marketing''}`

    `dict_keys([''name'', ''code'', ''dept''])`

    `dict_values([''steve'', 1005, ''marketing''])`


    Dictionaries have no idea of command within the elements. It is wrong to say that
    the elements are "out of order"; they are totally unordered.


    ## Data Type Conversion

    Occasionally, it may be needed to perform conversions within the built-in types.
    To convert within types, use the type-names as a function, simply. There are various
    built-in functions to complete the conversion from one data type to another. These
    functions return a new object expressing the converted value.


    | Sr.No. | Function & Description |

    | :--- | :--- |

    | 1 | `int(x [,base])` - Converts `x` to an integer. The base defines the base
    if `x` is a string. |

    | 2 | `float(x)` - Converts `x` to a floating-point number. |

    | 3 | `complex(real [,imag])` - Creates a complex number. |

    | 4 | `str(x)` - Converts object `x` to a string representation. |

    | 5 | `repr(x)` - Converts object `x` to an expression string. |

    | 6 | `eval(str)` - Evaluates a string and returns an object. |

    | 7 | `tuple(s)` - Converts `s` to a tuple. |

    | 8 | `list(s)` - Converts `s` to a list. |

    | 9 | `set(s)` - Converts `s` to a set. |

    | 10 | `dict(d)` - Makes a dictionary. `d` must be a sequence of (key,value) tuples.
    |

    | 11 | `frozenset(s)` - Converts `s` to a frozen set. |

    | 12 | `chr(x)` - Converts an integer to a character. |

    | 13 | `unichr(x)` - Converts an integer to a Unicode character. |

    | 14 | `ord(x)` - Converts a single character to its integer value. |

    | 15 | `hex(x)` - Converts an integer to a hexadecimal string. |

    | 16 | `oct(x)` - Converts an integer to an octal string. |


    ## Basic Operators

    The constructs which can manipulate the value of operands are called operators.
    Suppose the expression `5 + 3 = 8`. Here, `5` and `3` are called operands and
    `+` is called operator.


    ### Types of Operator

    The following types of operators are supported in Python language.


    * Arithmetic Operators

    * Comparison (Relational) Operators

    * Assignment Operators

    * Logical Operators

    * Bitwise Operators

    * Membership Operators

    * Identity Operators


    ### Arithmetic Operators

    Let us have a glance on all operators one by one. Consider variable `x` contains
    10 and variable `y` contains 20, then –


    | Operator | Description | Example |

    | :--- | :--- | :--- |

    | `+` | Addition | Values are added on each sides of the operator. | `x + y =
    30` |

    | `-` | Subtraction | Subtracts right-hand operand from the left-hand operand.
    | `x – y = -10` |

    | `*` | Multiplication | Multiplies values on both sides of the operator. | `x
    * y = 200` |

    | `/` | Division | Divides left-hand operand by right-hand operand | `x / y =
    0.5` |

    | `%` | Modulus | The left-hand operand is shared by the right-hand operand and
    returns the remainder | `y % x= 0` |

    | `**` | Exponent | Works exponential (power) calculation on operators | `x**y
    = 10 to the power 20` |

    | `//` | Floor Division | The division of operands wherever the result''s the
    quotient during which the digits when the decimal point is removed. But if one
    of the operands is negative, the outcome is floored, i.e., rounded away. | |


    ### Comparison Operators

    Relational operators are the operators who compare the values on both sides. Consider
    variable `a` holds 10 and `b` holds 20, then –


    | Operator | Description | Example |

    | :--- | :--- | :--- |

    | `==` | The condition will be true when the values are equal. | |

    | `!=` | The condition will be true when the values are not equal. | |

    | `>` | The condition will be true when the value of the operand is greater than.
    | |

    | `<` | The condition will be true when the value of the operand is less than.
    | |

    | `>=` | The condition will be true when the value of the operand is greater than
    or equal. | |

    | `<=` | The condition will be true when the value of the operand is less than
    or equal. | |


    ### Assignment Operators

    The assignment operators assign the result to the left operand. Consider variable
    `a` holds 10 and `b` holds 20, then –


    | Operator | Description | Example |

    | :--- | :--- | :--- |

    | `=` | Values are Assigned from right side to left operand. | `c = a + b` |

    | `+=` | Add AND: It adds right operand to the left operand then assigns the result
    to left operand. | `c += a` |

    | `-=` | Subtract AND: The right operand is subtracted from the left operand then
    assigns the result to left operand. | `c -= a` |

    | `*=` | Multiply AND: The right operand is multiplied by the left operand and
    assigns the result to left operand. | `c *= a` |

    | `/=` | Divide AND: The right operand is divided by the left operand and assigns
    the result to left operand. | `c /= a` |

    | `%=` | Modulus AND: It takes modulus of operands and allows the result to left
    operand. | `c %= a` |

    | `**=` | Exponent AND: The result is assigned to the left operand from exponential
    calculation on operators. | `c **= a` |

    | `//=` | Floor AND: The value from the floor division on operators is assigned
    to the left operand. | `c //= a` |


    **Example:**

    ```python

    #!/usr/bin/python3

    a =10

    b =20

    c =0

    c = a + b

    print=(Line 1 - Value of c is , c)

    c += a

    print=(Line 2 - Value of c is , c)

    c *= a

    print=(Line 3 - Value of c is , c )

    c /= a

    print=(Line 4 - Value of c is , c )

    c %=2

    print=(Line 5 - Value of c is , c)

    c **= a

    print=(Line 6 - Value of c is , c)

    c //= a

    print=(Line 7 - Value of c is , c)

    ```

    **Output:**

    `Line 1 - Value of c is 30`

    `Line 2 - Value of c is 40`

    `Line 3 - Value of c is 400`

    `Line 4 - Value of c is 40.0`

    `Line 5 - Value of c is 2`

    `Line 6 - Value of c is 1024`

    `Line 7 - Value of c is 102`


    ## Bitwise Operators

    Bitwise operator acts on bits and performs the bit-by-bit operation. Consider
    if `a = 30;` and `b = 15;` Now in the binary format they will be as follows —Python''s
    built-in function `bin()` can be used to obtain the binary representation of an
    integer number.


    `a = 0001 1110`

    `b = 0000 1111`

    `----------------`

    `a &b = 0000 1110`

    `a | b = 0001 1111`

    `a ^ b = 0001 0001`

    `~a = 1110 0001`


