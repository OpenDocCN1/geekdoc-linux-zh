    If you can''t set up the environment properly, then your system admin can help
    you. You will assure that the Python environment is properly set up and working
    perfectly fine.


    ### Opening A Console On Mac OS

    OS X’s standard console is a program named `Terminal`. Open `Terminal` by navigating
    to `Applications`, then `Utilities`, then double-click the `Terminal` application.
    You can also simply search for it in the system search tool in the top right.
    A command-line `Terminal` is a tool for interacting with your computer. A window
    will start with a command-line prompt message, something like this:


    ```

    mycomputer:~ myusername$

    ```


    ### Opening A Console On Linux

    Several Linux distributions (e.g Ubuntu, Fedora, Mint) may have different console
    programs, normally referred to as a terminal. The exact terminal of your startup,
    and how, can depend on your distribution. On Ubuntu, you will possibly want to
    open `Gnome Terminal`. It should show a prompt like this:


    ```

    myusername@mycomputer:~$

    ```


    ### Opening A Console On Windows

    Window’s console is named the Command Prompt, named `cmd`. A simple way to get
    to it is by using the key combination `Windows+R` (Windows meaning the Windows
    logo button), which should start a Run dialog. Then typewrite `cmd` and hit Enter
    or click Ok. You can also hunt for it from the start menu. It should look like:


    ```

    C:\Users\myusername>

    ```


    Window’s Command Prompt is not really as strong as its counterparts on Linux and
    OS X, you might like to begin the Python Interpreter (see just below) straight
    using the IDLE program that Python comes with. You can find these in the Start
    menu.


    ### Using Python

    The python application that you have installed will by default act as something
    named an interpreter. An interpreter uses text commands and runs them as you enter
    them -very helpful for trying things out. Simply type `python` at your console
    hit Enter, and you should enter Python’s Interpreter.


    ### Interacting With Python

    After Python opens, it will show you some contextual data similar to this:


    ```

    Python 3.5.0 (default, Sep 20 2015, 11:28:25)[GCC 5.2.0] on linux

    Type "help", "copyright", "credits" for more data.

    >>>

    ```


    **Note**

    The prompt `>>>` on the last line shows that you are now in an interactive Python
    interpreter session, also named the “Python shell”. This is strange from the normal
    terminal command prompt!


    You can now start some code for python to run. Try:

    `print("Hello world")`

    Press Enter and notice what happens. After displaying the results, Python will
    return you back to the interactive prompt, where you could enter the different
    command:


    ```python

    >>> print("Hello world")

    Hello world

    >>> (1 + 4) * 2

    10

    ```


    An extremely helpful command helps `()`, which enters a help functionality to
    search all the stuff python lets you do, right from the interpreter. Press `q`
    to close the guidance window and return to the Python prompt.


    To leave the interactive shell and go behind to the console (the system shell),
    press `Ctrl-Z` and then Enter on Windows, or `Ctrl-D` on OS X or Linux. Alternatively,
    you could additionally run the `python` command `exit()` !


    ### Starting and Interacting with Python


    #### Variable

    A named location it''s called variable and it used to store data in the memory.
    It''s helpful to think of variables as a container that holds data which can be
    changed later throughout programming. Depend on the data type of a variable, the
    interpreter allocates memory and decides what can be stored in the reserved memory.
    Consequently, by assigning various data types to the variables, you can store
    integers, decimals or characters in these variables.


    #### Assigning Values to Variables

    There is no need an exact declaration in Python variables to store memory space.
    When a value is assigned to a variable the declaration occurs automatically. The
    equal sign `''=''` is applied to assign values to variables. The operand to the
    left of the `=` operator is the sign of the variable and the operand to the right
    of the `=` operator is the value stored in the variable. As example–


    ```python

    #!/usr/bin/python3

    number = 10           # An integer assignment

    price  = 100.05      # A floating point

    name   = "Steve"      # A string

    print(number)

    print(price)

    print(name)

    ```


    | Here, 10, 100.05 and "Steve" are the values assigned to `number`, `price`, and
    `name` variables, sequentially. |

    | Output: | 10100.05Steve |


    #### Multiple Assignment

    Python permits you to assign a single value to different variables concurrently.
    As example –`a = b = c = 10`

    Here, an integer object is created with the value 10, and all the three variables
    are assigned to the same memory location. If you want, you can also assign multiple
    objects to multiple variables. For example –`a, b, c = 10, 20, "steve"`

    Here, two integer objects with values 10 and 20 are assigned to the variables
    `a` and `b` sequentially, and one single string object with the value "steve"
    is assigned to the variable `c`.


    #### Standard Data Types

    Many types of data can be stored in memory. As an example, somebody''s age is
    stored as a numeric value and his or her residence is stored as alphanumeric characters.
    Python has many standard data types that are used to define the operations pleasant
    on them and the storage system for each of them.

    There are five standard data types in Python Language−

    - Numbers

    - String

    - List

    - Tuple

    - Dictionary


    #### Python Numbers

    Number data types store numeric values. when a value is assigned to a number data
    types then number objects are created. As example–`var1 = 10`, `var2 = 20` Using
    the del statement the reference to a number object can be deleted. The syntax
    of the del statement is –`var1[var2[var3]` Using the del statement a single object
    or multiple objects can be deleted. As example–Three numerical types are supported
    by Python−

    - int (signed integers)

    - float (floating point real values)

    - complex (complex numbers)


    In Python3 all the integers have denoted long integers. Therefore, there is no
    separate number type. Examples of numbers are given below−


    | Int |

    | 10 |

    | 200 |

    | -245 |

    | 078 |

    | -0360 |

    | -0x290 |

    | 0x39 |


    A complex number build up an ordered pair of real floating-point numbers indicated
    by `x + yj`, where `x` and `y` are real numbers and `j` is the imaginary unit.


    #### Python Strings

    Strings in Python are identified as an adjacent set of characters described in
    the quotation marks. Python supports either pair of single or double quotes. Subsets
    of strings can be taken using the slice operator `[]` and `[:]` with indexes starting
    at 0 at the starting of the string and operating their way from -1 to the end.
    The plus `+` sign means the string concatenation operator and the asterisk `*`
    means the repetition operator. For example–


    ```python

    #!/usr/bin/python3

    str = ''Hello Python!''

    print(str) # Prints complete string

    print(str[0]) # Prints first character

    print(str[2:5]) # Prints characters 3 rd 5 th

    print(str[2:]) # Prints string 3 rd character

    print(str * 2) # Prints string two times

    print(str + "Test") # Prints concatenated string

    ```


    | Output: | Hello Python!Hllollo Python!Hello Python!Hello Python!Hello Python!Test
    |


    #### Python Lists

    In Python''s compound data types, lists are the most varied. A list holds items
    divided by commas and surrounded within square brackets `[]`. To some space, lists
    are related to arrays in C. One of the variations within them is that all the
    items referring to a list can be of the different data type. The values stored
    in a list can be obtained using the slice operator `[]` and `[:]` with indexes
    starting at 0 at the beginning of the list and working their way to end -1\. The
    plus `+` sign means the list concatenation operator, and the asterisk `*` means
    the repetition operator. As example–

