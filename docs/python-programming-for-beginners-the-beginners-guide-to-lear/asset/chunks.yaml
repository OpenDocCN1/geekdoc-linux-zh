    如果你无法正确设置环境，你的系统管理员可以帮助你。你应当确保 Python 环境已正确设置并运行良好。


    ### 在 Mac OS 上打开控制台

    OS X 的标准控制台是一个名为 `Terminal` 的程序。通过导航到 `Applications`（应用程序），进入 `Utilities`（工具），最后双击
    `Terminal` 应用程序打开它。你也可以直接在右上角的系统搜索工具中搜索它。命令行 `Terminal` 是一个与你的计算机交互的工具。窗口将启动并显示一个命令行提示符消息，如下所示：


    ```

    mycomputer:~ myusername$

    ```


    ### 在 Linux 上打开控制台

    多个 Linux 发行版（例如 Ubuntu、Fedora、Mint）可能有不同的控制台程序，通常被称为终端（terminal）。你启动的精确终端以及启动方式取决于你的发行版。在
    Ubuntu 上，你可能想要打开 `Gnome Terminal`。它应该显示类似这样的提示符：


    ```

    myusername@mycomputer:~$

    ```


    ### 在 Windows 上打开控制台

    Windows 的控制台名为命令提示符，即 `cmd`。访问它的简单方法是使用组合键 `Windows+R`（Windows 指 Windows 徽标按钮），这会启动运行对话框。然后输入
    `cmd` 并按回车或点击确定。你也可以从开始菜单中查找。它看起来应该是这样的：


    ```

    C:\Users\myusername>

    ```


    Windows 的命令提示符并不像 Linux 和 OS X 的对应工具那样强大，你可能可以使用 Python 自带的 IDLE 程序启动 Python 解释器（见下文）。你可以在开始菜单中找到它们。


    ### 使用 Python

    你安装的 Python 程序默认将作为一个名为解释器（interpreter）的角色。解释器使用文本命令并在你输入时运行它们——这对于尝试尝试非常有用。只需在控制台中输入
    `python` 并按回车，你就应该进入了 Python 解释器。


    ### 与 Python 交互

    Python 打开后，它会向你显示类似下面的上下文数据：


    ```

    Python 3.5.0 (default, Sep 20 2015, 11:28:25)[GCC 5.2.0] on linux

    Type "help", "copyright", "credits" for more data.

    >>>

    ```


    **注意**

    最后一行行的提示符 `>>>` 显示你现在处于交互式 Python 解释器会话中，也称为“Python shell”（壳）。这与普通的终端命令行提示符不同！


    你现在可以开始运行一些 Python 代码了。尝试：

    `print("Hello world")`

    按回车并观察发生了什么。显示结果后，Python 将返回交互式提示符，你可以在那里输入不同的命令：


    ```python

    >>> print("Hello world")

    Hello world

    >>> (1 + 4) * 2

    10

    ```


    一个非常有用的命令是 `()`，它会进入帮助功能，直接从解释器搜索 Python 允许你执行的所有操作。按 `q` 关闭引导窗口并返回 Python 提示符。


    要退出交互式 shell 并返回控制台（系统 shell），在 Windows 上按 `Ctrl-Z` 然后按回车，在 OS X 或 Linux 上按 `Ctrl-D`。或者，你也可以额外运行
    `python` 命令 `exit()`！


    ### 启动和与 Python 交互


    #### 变量

    一个命名的位置被称为变量，用于在内存中存储数据。将变量视为一个存储数据的容器很有帮助，这些数据在整个编程过程中可以被更改。根据变量的数据类型，解释器分配内存并决定在预留内存中可以存储什么。因此，通过给变量分配不同的数据类型，你可以在这些变量中存储整数、小数或字符。


    #### 给变量赋值

    Python 变量不需要精确的声明来存储内存空间。当一个值被分配给变量时，声明会自动发生。使用等号 `''=''` 来给变量赋值。`=` 运算符左侧的操作数是变量名，`=`
    运算符右侧的操作数是存储在变量中的值。例如——


    ```python

    #!/usr/bin/python3

    number = 10           # 整数赋值

    price  = 100.05      # 浮点数

    name   = "Steve"      # 字符串

    print(number)

    print(price)

    print(name)

    ```


    | 在这里，10、100.05 和 "Steve" 分别赋值给 `number`、`price` 和 `name` 变量。 |

    | 输出: | 10100.05Steve |


    #### 多变量赋值

    Python 允许你同时为不同的变量分配同一个值。例如——`a = b = c = 10`

    在这里，创建了一个值为 10 的整数对象，并将三个变量都分配到同一个内存位置。如果你需要，你也可以将多个对象分配给多个变量。例如——`a, b, c = 10,
    20, "steve"`

    在这里，两个值为 10 和 20 的整数对象被顺序赋值给变量 `a` 和 `b`，一个值为 "steve" 的单个字符串对象被赋值给变量 `c`。


    #### 标准数据类型

    内存中可以存储许多类型的数据。例如，某人的年龄存储为数值，而他的居住地存储为字母数字字符。Python 有许多标准数据类型，用于定义在这些类型上执行良好的的操作以及每种类型的存储系统。

    Python 中有五种标准数据类型：

    - 数字

    - 字符串

    - 列表

    - 元组

    - 字典


    #### 数字

    数字数据类型存储数值。当分配一个值给数字数据类型时，会创建数字对象。例如——`var1 = 10`、`var2 = 20` 使用 `del` 语句可以删除数字对象的引用。Python
    支持三种数字类型：

    - int（有符号整数）

    - float（浮点实值）

    - complex（复数）


    在 Python3 中所有的整数都是长整数。因此，没有单独的整数类型。数字示例如下：


    | Int |

    | 10 |

    | 200 |

    | -245 |

    | 078 |

    | -060 |

    | -0290 |

    | 039 |


    复数由 `x + yj` 的有序对组成，其中 `x` 和 `y` 是实数，`j` 是虚数。


    #### 字符串

    Python 中的字符串被识别为在引号内的相邻字符。Python 支持单引号或双引号。可以使用切片运算符 `[]` 和 `[:]` 获取字符串子集，索引从字符串开始的
    0 开始，直到结束 -1。`+` 符号意味着字符串拼接运算符，`*` 意味着重复运算符。例如——


    ```python

    #!/usr/bin/python3

    str = ''Hello Python!''

    print(str) # 打印完整字符串

    print(str[0]) # 打印第一个字符

    print(str[2:5]) # 打印第 3 到第 5 个字符

    print(str[2:]) # 打印从第 3 个字符开始的字符串

    print(str * 2) # 打印两次字符串

    print(str + "Test") # 打印拼接后的字符串

    ```


    | 输出: | Hello Python!Hllollo Python!Hello Python!Hello Python!Test |


    #### 列表

    在 Python 的复合数据类型中，列表是最变化的。列表包含逗号分隔的项目并封装在方括号 `[]` 中。在某些空间，列表与 C 语言中的数组有关。它们的变化之一是列表中的所有项目可以是不同的数据类型。可以使用切片运算符
    `[]` 和 `[:]` 获取列表中存储的值，索引从列表开始的 0 开始，直到结束 -1。`+` 符号意味着列表拼接运算符，`*` 意味着重复运算符。例如——


