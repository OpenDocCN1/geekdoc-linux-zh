    \ installation was successful”（安装成功）消息时，Python 将被成功安装。\n3. 建议在开始之前下载一个良好的文本编辑器。如果你是初学者，我推荐你下载\
    \ `Sublime` [`www.sublimetext.com/2`](https://www.sublimetext.com/2) Text。它是免费的。\n\
    4. 安装方法非常直观。运行你下载的 `Sublime Text` 磁盘映像并按照指导操作。\n5. 打开 `Sublime Text` 并进入 `File\
    \ > New File`（快捷键：`Cmd+N`）。之后，通过点击 (`Cmd+S` 或 `File > Save`) 将 Python 扩展名设置为 `.py`\
    \ 保存文件，命名为 `hello.py` 或 `my-first-program.py`。\n6. 代码并再次保存。对于初学者，你可以复制以下代码：\n\n\
    ```python\nprint(\"Hello, World!\")\n```\n此程序输出：Hello Word\n7. 转到 `Tool > Build`（快捷键：`Cmd\
    \ + B`）。你会在 `Sublime Text` 底部看到 `Output:`。恭喜你，已成功运行了你的第一个 Python 程序。\n\n# 在 Unix\
    \ 和 Linux 上安装并运行 Python\n\n在 Unix/Linux 机器上安装 Python 有一些简单的步骤。\n\n1. 打开网页浏览器并访问\
    \ [`www.python.org/downloads/`](https://www.python.org/downloads/)。\n2. 顺着链接下载适用于\
    \ Unix/Linux 的压缩包源码。\n3. 下载并解压文件。\n4. 如果你想自定义某些选项，请编辑 `Modules/Setup` 文件。\n5.\
    \ 运行 `./configure` 脚本\n6. `make`\n7. `make install`\n\n通过这种方式，Python 将安装在常规位置\
    \ `/usr/local/bin`，其库将位于 `/usr/local/lib/pythonXX`。这里的 Python 版本是 `XX`。\n\n# 在\
    \ Windows 上安装并运行 Python\n\n* 前往 [`www.python.org/downloads/`](https://www.python.org/downloads/)\
    \ python 官方网站，并点击 `Download Python`（你可能会看到不同的版本名称，请选择适合你的版本）。\n* 下载完成后，双击文件并按照指南安装。在安装\
    \ Python 的同时，还会安装一个名为 `IDLE` 的程序。它提供了一个用于处理 Python 的图形化用户界面。\n* 现在打开 `IDLE` 程序，然后复制以下代码并按回车。\n\
    \n```python\nprint(\"Hello, World!\")\n```\n* 要在 `IDLE` 中生成文件，进入 `File > New Window`（快捷键：`Ctrl+N`）。\n\
    * 之后编写 Python 代码，然后通过点击 (`Cmd+S` 或 `File > Save`) 将 Python 扩展名设置为 `.py` 保存文件，命名为\
    \ `hello.py` 或 `my-first-program.py`。\n* 遵循 `Run > Run module`（在这里可以使用快捷键 `F5`），你可以看到\
    \ `Output:.`。恭喜，你已成功运行了你的第一个 Python 程序。\n\n# 需要注意的 Python 环境变量\n\n 设置 PATH\n许多目录可能包含不同的可执行文件和程序，操作系统通过搜索路径来实现，并由目录注册以执行操作系统的搜索。路径保存在环境变量中，它是由操作系统保留的命名字符串。该变量包含了命令行\
    \ shell 和程序可用的数据。路径变量在 Unix 中定义为 `PATH`，在 Windows 中定义为 `Path`（Unix 区分大小写；Windows\
    \ 不区分）。路径细节由 Mac OS 中的安装程序处理。要从任何适当目录调用 Python 解释器，你需要将 Python 目录添加到路径中。\n\n###\
    \ 在 Unix/Linux 上设置路径\n按照以下规则为 Unix 中的特定会话将 python 目录添加到路径：\n\n* 在 `csh` shell\
    \ 中输入 `setenv PATH` 为 `\"$PATH:/usr/local/bin/python\"` 并按回车键。\n* 在 Linux 的 `bash`\
    \ shell 中输入 `export PATH` 为 `\"$PATH:/usr/local/bin/python\"` 并按回车键。\n* 在 Linux\
    \ 的 `sh` 或 `ksh` shell 中输入 `PATH` 为 `\"$PATH:/usr/local/bin/python\"` 并按回车键。\n\
    * 注意—— `/usr/local/bin/python` 是 Python 目录的路径。\n\n### 在 Windows 上设置路径\n按照以下规则为\
    \ Windows 中的特定会话将 python 目录添加到路径：在命令行提示符处输入路径 `\"%path%;C:\\Python\"` 然后按回车键。需要注意的是，Python\
    \ 目录的路径是 `\"C:\\Python\"`。\n\n# 运行 Python\n启动 Python 有三种独立的方式——\n\n### 命令行脚本\n\
    通过调用你应用程序上的解释器，可以在命令行执行 Python 脚本，如下例所示所示：\n\n```bash\n$python script.py     \
    \ # Unix/Linux\npython% script.py      # Unix/Linux\nC:>python script.py    #\
    \ Windows/DOS\n```\n\n### 交互式解释器\n在 Unix、DOS 或提供命令行编辑器或 窗口的技术上启动 Python 是很好的。在命令行输入\
    \ python。请直接在交互式解释器中编码。这里提供了所有现有的命令行选项：\n\n| # | 选项与描述 |\n| :--- | :--- |\n| 1\
    \ | -d 提供调试输出 |\n| 2 | -O 产生增强字节码（生成 .pyo 文件） |\n| 3 | -S 如果在启动时查找 Python 路径，你不应导入\
    \ site |\n| 4 | -v 详细输出（导入语句的完整跟踪） |\n| 5 | -X 这仅使用字符串或损坏基于类的内置异常，它是从 1.6 版本开始的\
    \ |\n| 6 | -c 运行作为命令行字符串发送的 Python 脚本 |\n| 7 | File 从给定文件解运行 Python 脚本 |\n\n 集成开发环境\n\
    Python 可以在图形用户界面 (GUI) 基于环境中运行。它在你的系统具有 GUI 应用程序时帮助 Python。\n\n* Unix —— `IDLE`\
    \ 是第一个 Unix Python IDE。\n* Macintosh ——   Python 以及 `IDLE` IDE 可从主网站获取，可以 MacBinary\
    \ 或 BinHex 文件格式下载。\n* Windows —— `PythonWin` 是第一个 Windows Python 界面，是一个带有 GUI\
    \ 的 IDE。\n\n"
