    \ are not a question for this text, some high-level differences between `int`\
    \ and `float` objects are necessary to know. Inappropriate, `int` objects can\
    \ only represent integers, but they represent them exactly, without any approximation.\
    \ On the other hand, `float` objects can express a wide range of fractional numbers,\
    \ without not all rational numbers are representable. Nonetheless, `float` objects\
    \ are often applied to express real and rational numbers approximately, up to\
    \ some number of significant figures.\n\nPython has many native datatypes. Here\
    \ are the important ones:\n\n1. Booleans are either `True` or `False`.\n2. Numbers\
    \ will be integers (`1` and `2`), `floats` (`1.1` and `1.2`), fractions (`1/2`\
    \ and `2/3`), or even complex numbers.\n3. Strings are sequences of Unicode characters,\
    \ e.g. an `Html` document.\n4. Bytes and byte arrays, e.g. a `jpeg` image file.\n\
    5. Lists are ordered sequences of values.\n6. Tuples are ordered, immutable sequences\
    \ of values.\n7. Sets are unordered bags of values.\n8. Dictionaries are unordered\
    \ bags of key-value pairs.\n\nOf course, there are more types than these. Everything\
    \ is an object in Python, so there are types like `module`, `function`, `class`,\
    \ `method`, `file`, and even edited code.\n\n## Numbers\n\nNumeric values are\
    \ stored by `Number` data types. They are immutable data types. This means, alternating\
    \ the value of a number of data type Output:s a newly allocated object. At the\
    \ time of assigning a value, the `Number` objects are created. As example –\n\n\
    ```python\nvar1 =10\nvar2 =20\n```\n\nBy using the `del` statement, the reference\
    \ to a number object also can be deleted. The `del` statement syntax is –`del\
    \ var1[,var2[,var3[....,varN]]]]`. Using the `del` statement can delete a single\
    \ object or multiple objects. As example –\n\n```python\ndel var\ndel var_a, var_b\n\
    ```\n\nDifferent types of numerical are supported by Python−\n\n* `int` (signed\
    \ integers) — Normally it is called just integers or `ints`. They are positive\
    \ or negative total numbers with no decimal point. In Python 3, Integers are of\
    \ infinite size. Python 2 holds two integer types - `int` and `long`. there's\
    \ no 'long integer' in Python 3 anymore.\n* `float` (floating point real values)\
    \ — It is also called `floats`. Real numbers are represented by them and written\
    \ with a decimal point dividing the integer and the fractional parts. In scientific\
    \ notation, floats can also be represented with `E` or `e` indicating the power\
    \ of 10 (`2.5e2 = 2.5 x 102 = 250`).\n* `complex` (complex numbers) — are of the\
    \ form `a + bJ`, where `a` and `b` are `floats` and `J` (or `j`) denotes the square\
    \ root of -1 (which is an unreal number). The real part of the number is `a`,\
    \ and the unreal part is `b`. In Python programming, Complex numbers are not applied\
    \ so much.\n\nIt is probable to denote an integer in hexadecimal or octal form.\n\
    \n```python\nnumber = 0xA0F #Hexa-decimal\nnumber2575\nnumber = 0o37 #Octal\n\
    number31\n```\n\n## Examples\n\nSome examples of numbers are given here.\n\n|\
    \ int |\n| :--- |\n| 10 |\n| 200 |\n| -245 |\n| 078 |\n| -0360 |\n| -0x290 |\n\
    | 0x39 |\n\nA complex number consists of an ordered pair of real floating-point\
    \ numbers indicated by `a + bj`, where `a` is the real part and `b` is the unreal\
    \ part of the complex number.\n\n## Number Type Conversion\n\nPython transforms\
    \ numbers inwardly in an illustration including mixed types to a common type for\
    \ amends. Sometimes, you need to control a number apparently from one type to\
    \ another to meet the conditions of an operator or function parameter.\n\n* Type\
    \ `int(x)` to convert `x` to a plain integer.\n* Type `long(x)` to convert `x`\
    \ to a long integer.\n* Type `float(x)` to convert `x` to a floating-point number.\n\
    * Type `complex(x)` to convert `x` to a complex number with real part `x` and\
    \ unreal part zero.\n* Type `complex(x, y)` to convert `x` and `y` to a complex\
    \ number with real part `x` and unreal part `y`. `x` and `y` are numeric expressions.\n\
    \n## Mathematical Functions\n\nPython introduces the following functions that\
    \ produce mathematical calculations.\n\n| # | Function & Returns ( Description\
    \ ) |\n| :--- | :--- |\n| 1 | `abs(x)`The absolute value of `x`: the (positive)\
    \ range from zero to `x`. |\n| 2 | `ceil(x)`The ceiling of `x`: the least integer\
    \ not less than `x`. |\n| 3 | `cmp(x, y)`-1 if `y>x`, 0 if `x == y`, or 1 if `y<x`.\
    \ It's Deprecated in Python 3. Instead use`return (x>y)-(x<y)`. |\n| 4 | `exp(x)`The\
    \ exponential of `x` |\n| 5 | `fabs(x)`The absolute value of `x`. |\n| 6 | `floor(x)`The\
    \ integer not less than `x`. |\n| 7 | `log(x)`natural logarithm of `x`. |\n| 8\
    \ | `log10(x)`base10 logarithm of `x`. |\n| 9 | `max(x, y)`The largest of arguments.\
    \ |\n| 10 | `min(x, y)`The smallest of arguments. |\n| 11 | `modf(x)`The fractional\
    \ part of `x`. |\n| 12 | `pow(x, y)`The value of `x**y`. |\n| 13 | `round(x [,n])`rounded\
    \ to `n` digits. |\n| 14 | `sqrt(x)`The squared root of `x`. |\n\n*(Note: `cmp(x,\
    \ y)` is deprecated)*\n\n## Random Number Functions\n\nIn games, simulations,\
    \ testing, random numbers are used. Python introduces the following functions.\n\
    \n| # | Function & Description |\n| :--- | :--- |\n| 1 | `choice(seq)`A item from\
    \ a list, tuple, or string. |\n| 2 | `randrange(start, stop [,step])`A selected\
    \ element from `range(start, stop, step)`. |\n| 3 | `random()`A float `r`, such\
    \ that 0 is less than or equal to `r`. |\n| 4 | `seed([x])`Sets the integer value\
    \ applied before calling any random function. |\n| 5 | `shuffle(lst)`Randomizes\
    \ the items of a list in place. |\n| 6 | `uniform(x, y)`A random float `r`, like\
    \ `x < r`, or `y`. |\n\n## Trigonometric Functions\n\nFollowing functions are\
    \ introduced in Python language that performs trigonometric calculations.\n\n\
    | # | Function & Description |\n| :--- | :--- |\n| 1 | `acos(x)`Return the arc\
    \ cosine of `x`, in radians. |\n| 2 | `asin(x)`Return the arc sine of `x`, in\
    \ radians. |\n| 3 | `atan(x)`Return the arc tangent of `x`, in radians. |\n| 4\
    \ | `atan2(y, x)`Return `atan(y / x)`, in radians. |\n| 5 | `cos(x)`Return the\
    \ cosine of `x` radians. |\n| 6 | `hypot(x, y)`Return the Euclidean norm, `sqrt(x*x\
    \ + y*y)`. |\n| 7 | `sin(x)`Return the sine of `x` radians. |\n| 8 | `tan(x)`Return\
    \ the tangent of `x` radians. |\n| 9 | `degrees(x)`Converts angle `x` from radians\
    \ to degrees. |\n| 10 | `radians(x)`Converts angle `x` from degrees to radians.\
    \ |\n\n## Mathematical Constants\n\nThe module also represents two mathematical\
    \ constants –\n\n| # | Constants & Description |\n| :--- | :--- |\n| 1 | `pi`The\
    \ mathematical constant `pi`. |\n| 2 | `e`The mathematical constant `e`. |\n\n\
    ## Strings\n\nThe most popular data type in Python is Strings. A string can create\
    \ simply by embedding characters in quotes. Single quotes in Python is treated\
    \ as double quotes. It is very simple to create a string as assigning a value\
    \ to a variable. As example –\n\n```python\nvar1 ='Hello World!'\nvar2 =\"Python\
    \ Programming\"\n```\n\n## Accessing Values in Strings\n\nThe character type is\
    \ not supported by Python; these are treated as strings of length one, thus also\
    \ granted a substring. F or getting access to substrings, you can use the square\
    \ brackets for splitting along with the index or contents to obtain your substring.\
    \ As example –\n\n```python\nprint (\"var1[0]: \", var1[0])\nprint (\"var2[0:6]:\
    \ \", var2[0:6])\n```\n"
