    no human interaction, and thus Item 1 should be eliminated from the experiment.
    This can be achieved by programmatically invoking the next steps for a fixed workload,
    or by starting the data collection after the user has submitted a query. The first
    controllable external variable, the human, has been mitigated.


    Now consider the next two steps, which retrieve the remote resources. Each of
    these steps requires interaction with networked computers, exposing the experiment
    to variance from the network. For instance, one run of the experiment might occur
    while the network is suffering from heavy congestion, elongating measured time.
    Or perhaps after the first fetch, the resources will be cached, making their subsequent
    retrievals faster, and reducing measured time. Depending on what aspects of this
    are being measured, there are a couple different ways to avoid introducing variance.


    One potential method for shielding our experiment from these disparities is to
    create a closed network for testing. This allows for significant control over
    network bandwidth, congestion, and other variables. In many complex situations,
    such as heavy congestion, can be simulated on a network. However for our specific
    example, our measurements aren''t depend on exact network interactions, therefore
    this type of setup is overkill.


    Another method for avoiding the network variance is to start data collection after
    all the network resources have been downloaded. Unfortunately for our example,
    parsing the HTML file can trigger other resources. As a result, the solution is
    to bypass the network and serve all the content locally from the disk. The second
    controllable external variable, the network, has been mitigated.


    While the variability of disk performance is significantly less than the variability
    introduced by the network, it can still have a large impact on results. One reason
    for this is the amount of buffering and caching utilized at both the software
    and hardware layers. Assuming the dataset is small enough, the disk can be removed
    from our measurements by serving them from memory.


    There are two primary techniques for accomplishing this: copying the files into
    a RAM-based filesystem, using `tmpfs`, or by leveraging the `mmap(2)` system call.


