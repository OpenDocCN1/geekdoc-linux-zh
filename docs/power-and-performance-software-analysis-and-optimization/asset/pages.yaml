  md: "# 12.4 Coding style 229\n\nThe C specification compiler writers with rules,\
    \ called strict aliasing rules, with regards to when the language allows pointers\
    \ to alias, allowing compiler writers to optimize the cases where pointers are\
    \ not allowed to alias. These rules are incredibly important for programmers to\
    \ understand, violating the rules can lead to the compiler generating incorrect\
    \ code.\nSection 6.5 paragraph 7 of the C specification states:\n\n\"An object\
    \ should have its stored value accessed only by an lvalue expression that has\
    \ one of the following types:\n\n+   - a type compatible with the effective type\
    \ of the object,\n- a qualified version of a type compatible with the effective\
    \ type of the object,\n- a type that is the signed or unsigned type corresponding\
    \ to the effective type of the object,\n- a type that is the signed or unsigned\
    \ type corresponding to the qualified version of the effective type of the object,\n\
    - an aggregate or union that includes one of the aforementioned types among its\
    \ members (including, recursively, a member of a subaggregate or contained union,\n\
    - a character type\n\nThe first four rules establish that a pointer may alias\
    \ another pointer of the same type, regardless of whether the types differ in\
    \ signedness, signed and unsigned, or qualification, const and volatile. For instance,\
    \ a pointer of type unsigned int *, and a pointer of type signed int *const, in\
    \ the same scope could alias. The fifth rule extends this concept to structures\
    \ and unions. For convenience, the sixth rule allows any pointer to be aliased\
    \ by a char.\n\nSo going back to the code in Listing 12.8, assume that the programmer\
    \ knows that y will never alias x, and the compiler to optimize the code accordingly,\
    \ by hoisting the load of y out of loop.\n\nThe C99 specification introduced the\
    \ restrict qualifier, that informs the compiler that the restricted pointer is\
    \ the sole pointer that accesses the object it points to. Listing 12.10 adds the\
    \ restrict qualifier to the pointers x and y.\n\n```\n#include <stddef.h>\nvoid\
    \ foo(double *restrict x, double *restrict y, size_t len)\n{\n    size_t i;\n\
    \    for (i = 0; i < len; i++)\n    x[i] = *y * 2.0;\n}\n```\n\n# LISTING 12.10\n\
    \nPointer Aliasing With restrict."
