- pgno: 194
  md: '# 9.2 Kernel shark 177


    interface. The second, kernelshark, is a graphical interface that wraps the trace-cmd
    tool.


    The kernelshark tool provides a very intuitive interface for configuring trace
    recording. Data collection is configured by selecting the Capture item in the
    menubar, and selecting the Record menu item. This will open a dialog that lists
    all of the events in a hierarchical tree, that, in the same format as file system
    exposes them. In this dialog, the tracer is referred to as the execute plugin,
    and there is a box widget for choosing one of the available tracers. Actual data
    collection begins and ends by selecting the Run and Stop buttons on this dialog
    box. After clicking the button, the report will be displayed.


    The advantage of using a graphical interface like kernelshark is the reporting.
    Figure 9.1 illustrates an example report. Once the trace has been collected, a
    timeline shows the events, partitioned by logical CPUs, using the trace''s timestamps.
    The bottom half of the screen is dedicated to displaying the raw trace data. It
    is possible to zoom out of an outline, by left-clicking and then dragging. Dragging
    to the right causes the timeline to zoom in on the selected region between the
    start and end points. On the other hand, dragging the left allows the timeline
    to zoom out.


    ![](img/33fad1fa149d4f0cdd55ff2565970ab2_194_0.png)


    FIGURE 9.1


    The graphical interface for kernelshark.'
