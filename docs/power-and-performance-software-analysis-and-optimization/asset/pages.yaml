    # 1.2 INTEL® 8087


    Unlike the 8086, shown in Figure 1.3, wasn''t a standalone processor,

    but a coprocessor, similar to the 8089. Unlike the 8089, which accelerated I/O

    operations, the 8087 was developed to accelerate mathematical operations. Notice

    that in the instructions of the previous section, all mathematical operations

    operate only on integers. As result, all computations involving real numbers

    to be manually implemented in software. Unfortunately, this resulted in a suboptimal

    situation where the quality, accuracy, and functionality of available software
    math

    libraries varied greatly, thus impeding the ability of software to aid in tasks

    real numbers.


    To remedy this situation, the 8087 was designed to consolidate as much of the

    common and error-prone computations into hardware as possible, freeing software

    engineers to focus on their application''s calculations, rather than on implementing

    low level math routines. These features include floating point operations, numeric

    conversions, and common functions, such as the trigonometric and square root

    functions.


    # 1.2.1 IEEE 754 FLOATING POINT


    Intel recognized, as they were beginning development of the 8087, that a standardized

    floating point format, to be used from then on all future architecture generations,

    was required. By standardizing the format, developers would be able to perform

    numerical analysis of their algorithms once, rather than repeatedly for each hardware

    generation. Also, once adoption of the new standard had taken hold, developers
    would

    be freed from writing custom code for each vendor''s floating point solution,
    such

    increasing software portability.


    ![](img/33fad1fa149d4f0cdd55ff2565970ab2_33_0.png)


    FIGURE 1.3


    Intel® 8087 (Israel, 2009).'
