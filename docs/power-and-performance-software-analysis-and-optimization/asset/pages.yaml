- pgno: 110
  md: '# 5.4 Phoronix Test Suite 93


    Second, the pre-test script, pre.sh, will be run, as it is present in the test
    profile. This allows the benchmark to set up the initial system state prior to
    execution. For example, this might involve starting a daemon or altering the system
    configuration.


    Third, the test executable will be invoked repeatedly. The exact number of benchmark
    runs depends on few factors, such as whether DynamicRunCount is enabled in user-config.xml,
    the value of StandardDeviationThreshold in user-config.xml, and also the value
    of the TOTAL_LOOP_TIME environmental variable. In each execution of the benchmark''s
    executable, the interim test script, interim.sh, will run, assuming it exists
    in the test profile directory. This script allows the benchmark to clean up any
    state left after each test, providing a clean slate for run.


    Fourth, the post-test script, post.sh, will be run, as it is present in the test
    profile. This allows the benchmark to clean up any state initialized during the
    benchmark run. In general, any changes made to the system by the pre-test script
    should be reversed.


    Finally, the results, with the system logs, will be saved into the ResultsDirectory,
    with the directory named after the test name. Typically this will be $HOME/phoronix-test-suite/test-results.


    Inside each test directory is a number of files that represent the system state
    during the test run, the results of the test, and the resources generated for
    summarizing the test results.


    The system-logs directory contains a copy of various system logs from the time
    of execution. This includes files such as the full dmesg, the compiler version
    and configuration, the environment variables, CPU information, and so on. Essentially
    a snapshot of relevant files in /proc and /var/log, this information allows for
    performance data in future tests to be debugged. Additionally, leveraging the
    Phoronix Test Suite as part of a larger infrastructure comprised of multiple machines,
    these files can be parsed to determine what configuration results corresponds
    to:


    The results-graph directory contains a copy of the generated graphs for the test,
    each stored in Scalable Vector Graphics (SVG) format. Using a vector-based format,
    allows for the images to be scaled to various sizes, without losing image quality.
    For each test profile in the result, two images will be generated. A bar graph
    of the test results are seen in Figure 5.1. The names of these pieces correspond
    with the test name. So if the test was the xt run, the plot will be called xt_table.svg.


    Apart from the two images generated per test profile, two summary images are also
    created. An overview table, overview.svg, contains an entry for each test profile,
    summarizing the results. As also shown in Figure 5.3, a table is created, systems.svg,
    that lists the system''s hardware information. If different pieces of hardware
    are compared, the differences in configuration are highlighted.'
