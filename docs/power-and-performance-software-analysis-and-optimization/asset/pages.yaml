- pgno: 199
  md: 'In many ways, programming the GPU is very similar to programming the CPU, although
    the instruction set and data state are different. The graphics hardware executes
    instructions stored in a ring buffer. Since there is only one ring buffer for
    the GPU, accessing elements within this buffer requires locking, making direct
    access from user space too expensive. Aside from entries that directly contain
    instructions, the ring buffer also contains pointer entries. These pointer entries
    reference a chunk of memory, known as a batchbuffer, that is comprised of GPU
    instructions. Upon encountering one of these pointer entries in the ring buffer,
    the GPU loads all the instructions contained within the batchbuffer, and then
    continues with the next entry in the ring buffer. In many ways, this flow mimics
    a function call, where the execution flow temporarily changes, and returns to
    its original context after execution. Unlike directly updating the ring buffer,
    a batchbuffer can be generated by the CPU without interrupting it. Batchbuffers
    are generated by user space applications and are then passed to the kernel''s
    DRM infrastructure, which handles inserting them into the GPU buffer.


    In order to facilitate this interaction between the graphics memory and processor
    memory, a new API for managing memory objects was created. API, known as the Graphics
    Execution Manager (GEM), provides an interface for synchronizing and destroying
    resources, including batchbuffers, as well as texture and vertex data. Similar
    to the DRM interface, the GEM API is exposed through a series of ioctl(2) calls
    performed on the relevant DRM device file (Packard, 2008).


    Originally, the X server also required to set the display mode, which is the screen''s
    resolution, color depth, and so on. As a result, the resolution at boot time and
    for virtual terminals was typically not the native screen resolution. This was
    remedied with Kernel Mode Setting (KMS) support, which moves the functionality
    for setting the display mode from the X server to the kernel. This is accomplished
    by reading the EDID information from the attached monitors and setting the display''s
    resolution accurately.


    # 10.1.3 HIGHER LEVEL SOFTWARE INFRASTRUCTURE


    The higher level graphics stack is partitioned into a series of libraries and
    applications, such as the actual X server. Each of these provide a different set
    of functionalities, such as pixel management or the OpenGL implementation.


    # 3D: Mesa


    The OpenGL and EGL implementations are provided by the Mesa library. This library
    exposes the OpenGL API to user applications, and then translates those function
    calls into the appropriate GPU batchbuffers. Using libdrm, Mesa submits these
    instructions into the kernel for execution by the GPU. As a result, supported
    graphics hardware must provide a driver within Mesa. This driver is responsible
    for implementing a compiler that targets the GPU instruction'
