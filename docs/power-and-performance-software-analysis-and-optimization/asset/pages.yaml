- pgno: 270
  md: '# 14.1 Processor cache organization 253


    The highest tier is the Level 1 (L1) cache. Originally, this cache was introduced
    in the 80486 as a unified cache, meaning that it stored instructions and data.
    Starting with the P6 microarchitecture, there are two separate L1 caches, one
    dedicated to storing instructions and one dedicated to data. A cache that only
    stores instructions is referred to as an icache. Conversely, a cache that only
    stores data is referred to as a dache. The P6 microarchitecture also added a Level
    2 (L2) cache. Both L1 and the L2 caches are duplicated per-core, and shared between
    the core''s Hyper-Threads. On the other hand, the unified Level 3 (L3) cache is
    an unresource, i.e., it is shared by all of the processor''s cores.


    When the execution unit needs a load of memory, the L1 cache is searched. In the
    case where the needed memory is found, it is simply copied from the cache. On
    the other hand, in case of a L1 cache miss, the L2 is searched next, and so on.
    This process repeats until data is found in one of the caches, or a cache miss
    in the LLC forces the memory request to access physical memory. In the case where
    the data request miss was satisfied from a different cache level, the data is
    loaded into the L1 first, and is provided to the processor.


    At this point, the reader may be wondering how such large caches are searched
    so quickly. An exhaustive iterative search wouldn''t be capable of meeting the
    performance requirements needed from the cache. In order to answer this question,
    the internal organization of cache must be explained.


    Architecture uses a-way associative cache. A set is a block of memory, comprised
    of a fixed size memory chunks, each referred to as a cache line, form the basic
    building block of the cache. The number of ways indicates how many cache lines
    are in each set (Gerber et al., 2006).


    To reduce the number of entries that must be searched for a given address, each
    set is designated to hold entries from a range of addresses. Therefore, when searching
    for a specific entry, only the appropriate set must be checked, reducing the number
    of possible entries that require searching to the number of ways. Each set is
    encoded to a range of physical addresses.


    # 14.1.1 CACHE LINES


    Fundament, the concept of a cache line represents a paradigm shift in memory organization.
    Previously, memory could be considered occurring on demand, and in the size requested.
    For example, if the processor loaded a word, the corresponding address would be
    translated into a physical address, which would then be fetched as a word. As
    a result, if the address of the word was unaligned, it would require the processor
    to perform two loads and then splice the results together, making the memory access
    more expensive. With the introduction of cache lines, the execution unit no longer
    fetches data from memory directly, instead all data memory requests, except for
    two exceptions, are satisfied from the L1 cache. As a result, all requests to
    physical memory occur in the'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'granularity of the cache line size. Consider how this affects the previous
    example of loading an unaligned word. Rather than just loading the needed 16 bits,
    the full cache line containing the word is loaded. Therefore, the unaligned property
    of the address only significantly impacts performance if the unaligned word crosses
    two cache lines.


    As mentioned above, there are two exceptions to all data passing through the L1
    cache. The first exception is data loads from regions of memory which are marked
    as not cacheable. The ability to disable caching for memory regions is required
    for memory mapped I/O, as the values at those addresses are actually the contents
    of device registers, which may be updated by the Page Attribute Attribute (PAT)
    entry in the page tables or via the Memory Type Range Registers (MTRR) MSRs. For
    most situations, the Linux kernel should handle these properly, so this shouldn''t
    be an issue for user space.


    The second exception is the nontemporal instructions, which are used to stream
    chunks of data in and out of memory, bypassing the cache. This is useful for loading
    or storing data that the programmer doesn''t want to be cached because it is unlikely
    to be accessed soon and adding it to the cache may evict temporal data.


    All data that is accessed with nontemporal hints is evicted from every level of
    the cache. This can reduce performance if used Incorrectly. When measuring the
    performance of algorithms containing nontemporal instructions, it is important
    to account for the cost of future accesses to that data.


    For example, the memcpy(3) function. For functions like these, that operate on
    large chunks of memory, it is typically best to access each element in the largest
    width possible. As a result, the memcpy(3) implementation in gl is optimized with
    SIMD instructions, in order to take advantage of the larger vector registers.
    Substituting this temporal load and store instructions with their nontemporal
    versions may appear to make the memcpy(3) operation faster; however, unlike the
    current implementation, which keeps the data cache warm, the nontemporal implementation
    will evict all of that from the cache. In other words, the memcpy(3) operation
    may complete faster, but overall performance decrease.


    # 14.2 QUERYING CACHE TOPOLOGY


    The configuration of the cache, including the number of cache levels, size of
    each level, number of sets, number of ways, and cache line size, can change. Some
    of these aspects, like the cache line, lock fluidity, while other aspects, such
    as the size of each cache level, change per processor model. Because of this,
    when writing software that optimizes based on these factors, it makes sense to
    automatically detect these values at runtime rather than hard-coding them.


    This section demonstrates a few different methods for retrieving data, leaving
    the reader to determine which approach best suits its needs.'
