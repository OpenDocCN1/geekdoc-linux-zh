    \ 183\n10.2 bugLE ................................................................................................................................\
    \ 184\n10.3 Apitrace ............................................................................................................................\
    \ 187\nReferences ................................................................................................................................\
    \ 189\n\nWhile author personally believes that command-line interfaces are more\
    \ flexible and efficient than graphical interfaces, he is in the minority. The\
    \ majority of users depend on responsive user interfaces for interacting with\
    \ their systems. As result of this direct interaction between the user and graphical\
    \ interface, performance problems within graphical stacks tend to be painfully\
    \ noticeable, even to the most casual of users. In, a significant portion of users\
    \ evaluate the performance of devices based almost solely on the responsiveness\
    \ of their interfaces. For example, if a user notices the graphical interface\
    \ struggling to render fluidity, he is likely to judge the entire device to be\
    \ of low quality.\n\nConsider an analogy of a car's performance. The only contact\
    \ that a car makes with the road is through tires. Regardless of how much horsepower\
    \ a car's engine is capable of producing, the car's actual performance will be\
    \ evaluated based on the amount of horsepower that it makes to the wheels, and\
    \ therefore to the road. In other words, a highly optimized algorithm naught if\
    \ the user interface is sluggish and unresponsive.\n\nThe first section of this\
    \ chapter explores the traditional Linux graphics stack. Architecting a graphics\
    \ stack is incredibly challenging. This is because computer graphics is an area\
    \ where technology, and therefore user demands, are constantly evolving. This\
    \ challenge is further compounded because any discrepancies between the hardware\
    \ and software architectures lead to inefficiencies."
