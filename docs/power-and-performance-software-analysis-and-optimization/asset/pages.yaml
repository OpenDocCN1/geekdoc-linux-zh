- pgno: 40
  md: '# 1.4 Intel® 80386 and 80387 23


    The action of switching the processor from one process to running a different
    process is referred to as a context switch. In order to perform a context switch,
    the operating system must keep track of the full execution state of the process,
    including the contents of the registers, and for each executing task. In a context
    switch, the process which was running and the contents of the execution state
    are saved into storage, while the execution state of the new process to run is
    loaded from storage into the processor.


    The process of determining which process should be run and for how long is referred
    to as process scheduling. Process scheduling is a well researched problem in computer
    science that attempts to address many concerns, such as fairness in scheduling
    or balancing time with throughput, for many different types of situations involving
    different numbers of processes with different performance requirements. As such,
    process scheduling is a fairly large field, which will be discussed in detail
    within this book. At the time of this writing, the process scheduling for Linux
    revolves around scheduling tasks to complement power-saving techniques. For a
    good introduction to the fundamental concepts and algorithms, the author recommends
    Modern Operating Systems by Andrew Tanenbaum.


    The 80286 introduced a new feature that allowed for context switches to be handled
    automatically in hardware. This was facilitated by a special, task task segment.
    Within the task segment, all of the execution state of a process is preserved.
    By issuing a JMP, CALL instruction, or returning from an interrupt, the destination
    is the TSS'' descriptor, a context switch automatically occurs. The execution
    state of the currently executing process is automatically copied into the relevant
    section of the TSS. Once this is complete, the new execution, of the process switched
    to, is automatically loaded into the processor, and the execution of the new process
    can continue from where it had been previously paused.


    Despite full support for context switches in hardware, Linux performs all of its
    context switches manually with software. This has been done for performance reasons,
    because the hardware context loads and validates all of the execution state, whereas
    Linux has historically performed some of the loads lazily and optimized some loads
    based on what actually needs to be restored.


