    \ has a natural alignment of 4 bytes, whereas a long integer would have a natural\
    \ alignment of 4 bytes on x86, and 8 bytes on x86_64.\n\n# Calling conventions\n\
    \nCalling conventions describe the transfer of data between a function callee\
    \ and caller. Additionally, the conventions describe which function, callee or\
    \ caller, is responsible for cleaning up the stack after the function call. Without\
    \ standardized calling conventions, it would be very difficult to combine multiple\
    \ object files or libraries, as functions might lack the ability to properly invoke\
    \ others.\n\nThe calling convention for x86 is known as cdecl. Functions written\
    \ to this specification expect their arguments on the stack, pushed right to left.\
    \ Since the CALL instruction pushes the return address, that is, the address of\
    \ the next instruction after the function call returns, off the stack, the elements\
    \ can be accessed at offset 4 of the stack pointer.\n\nThe calling convention\
    \ for x86_64 is similar, but is designed to take advantage of the extra registers\
    \ available when the processor is in 64-bit mode. Rather than passing all arguments\
    \ on the stack, arguments are passed in registers, with the stack used to handle\
    \ any extras. The first integer argument is passed in the RDI register, the second\
    \ in the RSI register, the third in the RDX register, the fourth in the RCX register,\
    \ the fifth in the R8 and the sixth in the R9. Floating point arguments are passed\
    \ in the XMM registers, starting at XMM0 and ending at XMM7.\n\nTypically, immediately\
    \ on being invoked, a function sets up a frame pointer, that is a special reserved\
    \ register that contains the base address for the current stack frame. Saving\
    \ the base of the stack for each function is useful for unwinding the stack for\
    \ debugging purposes, such as recording the stack trace. On both x86 and x86_64,"
