  md: "# 14.2 Querying cache topology 255\n\n# CPUID\n\nAs essentially any relevant\
    \ processor information, the cache details on Intel Architecture are exposed via\
    \ the CPUID instruction. In fact, multiple CPUID leaves report information about\
    \ the cache.\n\nThe Basic CPUID Information leaf, EAX = 2, reports the type and\
    \ size of each cache, TLB, and hardware prefetcher. Each of the registers is listed\
    \ with a descriptor corresponding to an exact description of one of the resources.\
    \ Multiple CPUID invocations may be necessary in order to retrieve all of the\
    \ information. In order to encode such information in few bytes, each descriptor\
    \ is merely a number, referencing a table in the Intel® Software Developer Manual\
    \ (SDM) that describes the full configuration. By this, in order to properly interpret\
    \ entries dynamically, a copy of the data in that table from the SDM must be included\
    \ in the code.\n\nThe Deterministic Cache Parameters Leaf, EAX = 4, reports the\
    \ properties of a specific cache. Each cache is identified by an index number,\
    \ which is selected by the value of the ECX register upon invocation of CPUID.\
    \ This index can be continuously incremented until a special NULL type is returned,\
    \ indicating that all caches have been iterated. Unlike the Basic CPUID Information\
    \ leaf, this leaf enters the information, such as the cache line size, number\
    \ of ways, and number of sets, in bitfields returned in the registers. Because\
    \ it doesn't require a pre-populated table, this approach yields itself better\
    \ than the other leaf. Listing 14.1 provides an example of how to iterate the\
    \ caches using this leaf, and how the report should be interpreted.\n\n```\n#include\
    \ <stdio.h>\n#include <assert.h>\n#ifdef _PIC_\nstatic inline void cpuid(unsigned\
    \ *restrict const a, unsigned *restrict const b, unsigned *restrict const c, unsigned\
    \ *restrict const d) {\n\tasm __volatile (\n\tchg %%ebx, %%l\\n\"\n\tcpuid\\n\"\
    \n\tchg %%1, %%ebx\\n\"\n\t\"+a\" (*a),\n\t\"+b\" (*b),\n\t\"+c\" (*c),\n\t\"\
    +d\" (*d)\n\t);\n#else /* Non PIC *\\nstatic inline void cpuid(unsigned *restrict\
    \ const a, unsigned *restrict const b).\n```"
