    \ 176\n  References ............................................................................................................\
    \ 178\n\nFtrace is a debugging infrastructure within the Linux kernel that exposes\
    \ the kernel's internal behavior. This data allows for the analyst to gain insights\
    \ into what code paths are being executed, as well as helping to isolate which\
    \ kernel conditions are contributing to performance issues. Ftrace is an abbreviation\
    \ of “function tracer”, yet it is capable of monitoring more than just function\
    \ calls. Ftrace can also monitor static and dynamic tracepoints within the kernel,\
    \ referred to as events. Static tracepoints are predefined events, created by\
    \ the various subsystems, monitoring the occurrence of interesting events. By\
    \ tracing these events, developers can better understand how their code interacts\
    \ with the kernel, and subsequently the hardware.\n\nFor example, at the time\
    \ of this writing, the Intel® i915 graphics drivers expose thirty static tracers.\
    \ Most focus on recording the operations on the i915 GEM memory objects, such\
    \ as i915_gem_object_create, i915_gem_object_evict, and i915_gem_object_destroy.\
    \ The other i915 tracers focus on recording when the driver updates registers,\
    \ i915_reg_rw, or important rendering events, such as i915_flip_request and i915_flip_complete.\n\
    \nAside from these static tracepoints, ftrace also supports dynamic tracepoints.\
    \ Dynamic tracepoints allow for custom tracepoints to be inserted almost anywhere\
    \ at runtime. In order to accomplish this, tracepoints are not defined as high\
    \ level events, but instead as memory offsets from exported kernel symbols. Additionally,\
    \ the state at each dynamic tracepoint can be recorded by specifying"
  merge: -1
