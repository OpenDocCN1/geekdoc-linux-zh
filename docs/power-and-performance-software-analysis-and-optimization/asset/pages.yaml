- pgno: 213
  md: '# CHAPTER 11 Other Helpful Tools


    Regardless of the interactive or noninteractive is, the reported information is
    identical. Due to the nature of the hardware and system data PowerTOP must collect,
    the tool requires root privileges. The following sections describe the information
    reported and how it should be interpreted.


    # 11.3.1 OVERVIEW


    In "Performance Is Power Efficiency" section of Introduction, the concept of "race
    to idle" was used as a technique for improving power consumption. This concept,
    bursting to complete work quickly, is only applicable if the work can be completed
    quickly. Longer running tasks, such as daemons, should be written to the processor
    to take advantage of these deep sleep states.


    As described in "C states" section of Chapter 3, for the processor to enter deep
    sleep, it must be halted, and therefore not executing instances. Each C state
    has an entry and exit latency, it is the job of the intel_idle driver in the Linux
    kernel to request the deepest C state that meets the latency requirements again.
    When the kernel is kicked, only waking up when needed, it is crucial that user
    space applications are carefully aware about how they wake the system from slumber.
    PowerTOP reports these occurrences in order to allow the user to identify misbehaving
    applications that are impacting power consumption.


    Figure 11.1 shows the default window in PowerTOP, running on an idle system. After
    the backlight, which was on maximum, was consuming the most power. Additionally,
    the network devices, the wireless card and Ethernet card, are consuming a lot
