  md: '# 5.2 Dealing with external variables 77


    state suddenly changes. Migrations can be avoided by pinning the process to an
    individual CPU. This can be done either with the taskset command or programmatically
    via the sched_setaffinity system call.


    Variance can also be introduced by running the benchmark on a system running other
    processes that are consuming significant amounts of resources. This type of system
    is often referred to as a noisy system. These other processes can lead to issues
    such as increased CPU migrations or thermal issues. One way to mitigate this issue
    is to boot the Linux kernel in user mode, by adding “single” to the kernel command-line,
    or by adding init=/path/to/shell to the kernel command-line. Once the system has
    booted to this minimal configuration, the benchmark can be without interference
    from other processes. If the benchmark requires other processes to run, such as
    a graphical application requiring an instance of Xorg running, those will need
    to be started manually.


    # 5.2.2 UNCONTROLLABLE EXTERNAL VARIABLES


    As mentioned in Section 4.4, it is important, in benchmarking, to expose external
    variables that can affect performance. However, when designing experiments, it
    is also necessary to recognize that many external factors are outside of our immediate
    control.


    Since these factors cannot be mitigated, they must be accounted for in the design
    of the experiment. To accomplish this, the benchmark should be run multiple times,
    and then multiple data points should be analyzed to quantify the effects of the
    external variables on the scales.


    The number of data points required to be collected, in order to provide an accurate
    measurement, depends on how significantly the benchmark is affected by the uncontrollable
    variables. As a general rule of thumb, measurements at a smaller level of granularity
    require more runs than at a higher granularity. When in doubt, the author errs
    on the side of collecting too many data points, which wastes time but provides
    a more accurate measurement, rather than too few, which saves time but provides
    a potentially misleading measurement.


    As in statistics, the distinction is between calculations involving the population
    and involving samples. The population represents the entire set of elements, whereas
    samples involve a subset of the population. To calculate the population mean of
    a benchmark would require averaging the result of every single run ever, an infinite
    set. Due to the impossible nature of this task, a sampling of the population is
    used. Statistics are calculated from the sample set in order to reason about the
    properties of the population. The law of large numbers dictates that as the number
    of data points within the sample increases, the sample’s behavior approaches the
    behavior of the total population (Renze and Weisstein, 2014).


    The most common statistic for summarizing performance samples is the mean. The
    population mean is denoted μ, whereas the sample mean is denoted as x. While most
    readers will be familiar with the algorithm for calculating the mean, in Equation
    5.1 for completeness.'
