- pgno: 39
  md: '# 22 CHAPTER 1 Early Intel® Architecture


    To accommodate this, the segment register format and behavior in protected mode
    is completely different from the segment register format and behavior in real
    mode.


    Remember that originally the segment registers simply contained a base address
    that was shifted and the offset to produce a larger address size. In this new
    model, the segment registers needed more room for the accounting required to support
    these new features. Therefore, in protected mode, only now didn''t reference the
    base address of the segment, but instead pointed to a descriptor entry in a table
    of segment descriptors. Each 8-byte entry in this table describes the 24-bit base
    address, 16-bit size, and 8 bits for the privilege and access information, which
    is used for marking segments as read only, executable, and so on. The remaining
    16 bits store the segment selector, when loaded into the 16-bit segment register
    effectively load the descriptor. To improve performance, by avoiding the need
    to touch each time a segment operation must be checked, the other 48 bits of the
    segment descriptor are cached in a hidden register when the segment selector is
    loaded.


    In make segmentation useful for both the operating system and user applications
    while enforcing memory protections, the segment descriptor table (GDT) is a table
    of segment descriptors that the operating system, privilege level 0, controls,
    while the local descriptor (LDT) is controlled by the user application. Registers,
    the GDT and LDT, exist for storing the base address of these tables. The global
    and local descriptors are loaded and stored with the LGDT and SGDT, and LDT and
    SLDT instructions. Each segment selector has a special bit indicating whether
    the descriptor is located in the local or global table.


    Each segment descriptor also had a present bit, indicating whether the corresponding
    segment was currently loaded into memory. If the segment descriptor was not set,
    the bit in the descriptor was, the user program would be paused and an exception
    would be raised, giving the operating system a chance to load the relevant segment
    from memory from disk. Once the segment had loaded, the user program would be
    resumed. All of this occurred transparently to the user program, and thus provided
    an early form of hardware supported virtual swapping. With swapping, more virtual
    memory could be allocated by the operating system than was physically allocated
    on the computer.


    # 1.3.3 TASK CONTROL


    Since the processor is only capable of running one application at a time, the
    job of a multitasking operating system is to provide the illusion that the processor
    can run multiple tasks at once. Whereas in a single-tasking operating system each
    job runs from start to completion before next job, a multitasking operating system
    divides the processor time across each of the required jobs. This switching has
    to occur quickly and smoothly enough that it is transparent to the user applications,
    and appears that the processor is running all of the tasks concurrently.'
