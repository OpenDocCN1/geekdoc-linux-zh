    # 15.1 SIMD


    Single Instruction Multiple Data (SIMD) instructions were introduced into the
    x86 architecture with the MMX™ technology, and continue to be incredibly significant
    on modern x86 with the SSE and Intel® Advanced Vector Set Extensions (Intel® AVX)
    instruction sets. As the names, a single SIMD instruction performs the operation,
    not one on data element, but on many simultaneously. Its purpose is to provide
    the general processor with some of the benefits and capabilities of a vector processor.


    Whereas processors are typically more parallel, that is, they can operate on larger
    data sets, providing SIMD functionality directly in the processor architecture
    provides some unique advantages. When GPU kernels, special care must be taken
    to reduce the number of data copies, since PCIe bandwidth is a significantly bottleneck.
    GPGPU can be impractical for cases that require to bounce back and forth between
    the CPU and GPU. On the other hand, SSE and Intel AVX resources are located close
    to the processor''s execution resources, and can benefit from processor caches.
    As a result, parallelization with SIMD has much lower setup costs, which makes
    it more practical for situations where other forms of parallelism, such as threading,
    are expensive.


    The SIMD functionality of the processor depends on which instruction extensions
    are supported. It is always a good practice to check for support for all features
    used, since these extensions compound upon each other, Intel® processors typically
    don''t support one extension without supporting all prior extensions. For instance,
    if a processor supports SSE3, it will typically support SSE2, SSE, and so on.


    Originally, the MMX extensions added instructions to perform integer operations;
    however, unlike the later extensions, the MMX registers aliased to the x87 stack.
    This simplified operating system support, since no new state needs to be saved
    on a context switch, but the simultaneous use of MMC and x87 operations. In general,
    MMX isn''t frequently used anymore.


    The Intel® Pentium III introduced the Streaming SIMD Extensions (SSE). This extension
    added new registers, which aren''t part of the x87 stack, and instructions for
    both integer and floating point values. Over time, the functionality of SSE has
    been steadily augmented through a number of extensions, which each add new instructions.
    These extensions include SSE2, SSE3, SSE4.1, and SSE4.2. The extension io SSE3
    stands for Supplemental, that is, Supplemental SIMD Extensions 3.


    The Intel® Advanced Vector Extensions (Intel® AVX) were introduced with the Second
    Generation Intel® Core™ processor family. Once again this increased the register
    width, with a new set of registers and instructions. The Intel AVX instructions'
  merge: -1
