  md: '# 3.2 Second generation intel® core™ processor family 49


    # 3.2.1 INTEL® HD GRAPHICS


    Prior to the Second Generation Intel Core processor family, Intel® integrated
    graphics were not part of the processor, but were instead located on the motherboard.
    These graphics solutions were designated Intel® Graphics Accelerators (Intel GMA)
    and were essentially designed to accommodate users whose graphical needs weren''t
    intensive enough to justify the expense of dedicated graphics hardware. These
    types of tasks such as surfing the Internet or editing documents and spreadsheets.
    As a result, Intel GMA hardware has long been considered inadequate for graphically
    intensive tasks, such as gaming or computed-aided design.


    Starting with the Second Generation Intel Core processor family, integrated graphics
    are now part of the processor, meaning that the GPU is now an incor resource.
    While the term "integrated graphics" has a negative connotation for performance,
    it actually has many advantages over discrete graphics hardware. For example,
    the GPU can now share the Last Level Cache (LLC) with the processor''s cores.
    Obviously, this has a drastic impact on tasks where the GPU and CPU need to collaborate
    on data processing.


    In many ways, the GPU acts like another core with regards to power management.
    For example, starting with the Second Generation Intel Core processor family,
    the GPU has a sleep state, RC6. Additional GPU sleep states, such as RC6P, were
    added in the Third and Fourth Generation Intel Core processors. This also means
    that for the processor to enter a package C state, must not only all the CPU cores
    enter deep sleep, but also the GPU. Additionally, the GPU is now part of the processor''s
    package TDP, meaning that the cores can utilize the power budget of the GPU. In
    other words, the GPU affects a lot of the CPU''s power management.


    # 3.2.2 INTEL® FLEX MEMORY TECHNOLOGY


    Unfortunately, while processor technology has been advancing rapidly, memory speeds
    have not kept pace. One technique for improving memory throughput has been the
    addition of parallel channels. Since these channels are independent, the memory
    controller can operate in an interleaved mode, where addresses can alternate between
    the channels. This technique effectively multiplies the potential memory bandwidth
    by the number of available channels. At the time of this writing, dual-channel
    memory is the most prevalent, although triple-channel and quadruple-channel systems
    are available.


    In order to utilize interleaved memory, three prerequisites need to be met. First,
    the amount of memory in each channel must be equal. Second, the size of the memory
    modules installed in each of the paired memory slots must be identical. Finally,
    the memory modules need to be installed in the correct channel slots on the motherboard,
    which are typically color-coded so that alternating pairs share the same color.
    Failure to meet any of these requirements would result in the memory controller
    falling back'
  merge: -1
  img_proc: true
