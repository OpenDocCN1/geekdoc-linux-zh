  md: "# GPU Profiling Tools\n\n# 10\n\n+   CHAPTER CONTENTS\n10.1 Traditional Graphics\
    \ Stack .....................................................................\
    \ 180\n  10.1.1 X11 ...................................................................................................................................\
    \ 180\n  10.1.2 Hardware and Low-Level Infrastructure: DRI ................................................\
    \ 181\n  10.1.3 Higher Level Software Infrastructure ................................................................\
