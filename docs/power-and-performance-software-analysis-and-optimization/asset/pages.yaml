- pgno: 276
  md: '# 14.4 Improving locality 259


    without an immediate need for the data, the load can be more flexible with regards
    to memory bandwidth. This allows for prefetches to be completed during lulls in
    memory accesses, when there is more available bandwidth, and translates to more
    available bandwidth later, since the prefetched memory loads are already in the
    cache, and don''t require a memory access.


    Prefetching occurs in one of two ways, either through the hardware prefetcher
    or through the software prefetching instructions. For the most part, the hardware
    prefetcher operates transparently to the programmer. It leverages the principle
    of spatial locality to cache lines spatially collocated with the cache lines currently
    accessed. On modern Intel platforms, the hardware prefetcher is very effective
    at determining which cache lines should be loaded, and loading them before they
    are needed. Despite this, tailoring data organization and access patterns to improve
    data locality can make the hardware prefetcher even more effective.


    It''s important to note that software prefetching instructions only provide a
    hint, not a guarantee. This hint may be disregarded or handled differently depending
    on the processor generation. In the author''s personal experience, the hardware
    prefetcher is often effective enough to make software prefetching unnecessary.
    Focus on improving data locality and reducing the working set. By being said,
    there are some unusual memory access patterns where software prefetching can benefit.


    # 14.4 IMPROVING LOCALITY


    Since the concept of caching relies heavily on the principles of temporal and
    spatial data locality, efficient cache cache usage requires optimizing for data
    locality. Therefore, when organizing a data structure''s memory layout, it is
    typically beneficial to group variables used together in the same cache line.
    The exception to this rule is if the variables are being modified concurrently
    by two threads. This situation is discussed in more detail in Chapter 15.


    The pahole tool is capable of displaying the layout of data structures, partitioned
    by cache line. This is accomplished by providing an ELF file, including executable
    and object files, as an argument to pahole. For instance, the command pahole foo.o'
