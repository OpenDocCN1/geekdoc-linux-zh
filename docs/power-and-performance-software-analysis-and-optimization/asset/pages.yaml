  md: '# 1.1 Intel® 8086


    for simplifying and explaining important concepts of the modern x86 architecture.
    This has the dual benefit of gradually introducing the concepts of the modern
    x86 architecture in a natural and logical progression, while also providing the
    context necessary to understand the reasoning behind the technical decisions made
    through the years.


    This chapter examines some of the earliest members of the x86 family. The majority
    of these processors are 16-bit. The chapter ends with the first 32-bit x86 processor,
    and the first processor to run Linux, the Intel® 80386.


    # 1.1 INTEL® 8086


    8086, introduced in 1978 and shown in Figure 1.1, was not the first processor
    developed by Intel, however it was the first processor to implement what be known
    as the x86 architecture. In fact, the two digits in the name x86 correspond to
    the fact that the first x86 processor designations all ended with 86, such as
    8086, 80186, 80286, 80386, and so on. This trend was continued until Intel the
    Pentium® family. Despite being introduced in 1978, the 8086 was continually produced
    throughout the 1980s and 1990s. Famously, NASA had been the 8086 processor in
    its shuttles until 2011.


    In contrast to the thousands of pages in the Intel® Software Developer Manual
    (SDM), the 8086 user manual, including a full reference on the system behavior,
    programming tools, hardware pinout, instructions and opcodes, and so on, fits
    within about two hundred pages. This simplified nature makes the x86 architecture
    an excellent introduction to the fundamental concepts of the x86 architecture.
    The rest of this book will build further on the concepts introduced here.


    In the architecture of the 8086, there are three fundamental design principles
    Intel Corporation, 1979). The first principle is the usage of specialized components
    to isolate and distribute functionality. In other words, rather than one monolithic
    system architecture, building an 8086 system provided flexibility in the peripherals
    selected. This allowed system builders to customize the system to best accommodate
    the needs of the given situation. The second principle is the inherent for


    ![](img/33fad1fa149d4f0cdd55ff2565970ab2_22_0.png)


    FIGURE 1.1


    Intel® 8086 (Lanzet, 2009).'
