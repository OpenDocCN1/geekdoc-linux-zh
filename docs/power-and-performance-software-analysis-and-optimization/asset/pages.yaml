    of a jiffy is equal to ... seconds, the number of jiffies can be used as a clock


    Nowadays users who can better power consumption configure the Linux kernel to
    be tickless, that is a tickless kernel, interrupts occur only when needed, opposed
    to a fixed interval. This prevents the ticks from waking up of deeper sleep states
    as frequently, and thus saves power.


    The available clock sources for the system can be queried through sysfs by reading
    available_clocksource and current_clocksource in /sys/bus/clocksource/ devices/clocksource0/.
    For instance:


    ```

    $ /sys/bus/clocksource/devices/clocksource0/available_clocksource tsc acpipm

    $ /sys/bus/clocksource/devices/clocksource0/current_clocksource

    ```


    The default clock in the Linux kernel is now the TSC register described in Section
    5.3.1. The kernel uses a scale factor to convert cycles into nanoseconds (cycles_ns()
    function in $(KERNEL_SRC)/arch/x86/kernel/tsc.c). In the case where the TSC is
    not invariant, or determines that it is not reliable, the High Precision Timer
    (HPET) is used.


    The clock is exposed to user space through a series of time calls, including time(2),
    and clock_gettime(2).


    The system(2) returns UNIX time, that is, an integer representing the number of
    seconds since the UNIX Epoch, midnight, January 1, 1970. Because UNIX time is
    a single integer, it is easy to work with it. Unfortunately, it counts seconds,
    and therefore has a resolution of 1 second, making it impractical for exact measurements.


    The clock_gettime(2) system provides access to a number of different clocks, each
    with a slightly different behavior with regards to what they measure. The resolution
    of each available clock can be measured with clock_getres(2). The following clocks
    are:


    +   CLOCK_REALTIME Measures time. Affected by changes to the system clock.

    CLOCK_REALTIME_COARSE Similar to CLOCK_REALTIME, but trades precision for better
    performance.

    CLOCK_MONOTONIC Measures the uptime of the system. Unaffected by manual changes
    to the clock, but is affected by updates via adjtime(3) and NTP. Does not include
    time in sleep state.

    CLOCK_MONOTONIC_COARSE Similar to CLOCK_MONOTONIC, but trades precision for better
    performance.'
