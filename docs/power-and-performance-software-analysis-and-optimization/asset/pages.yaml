  md: '# 94 CHAPTER 5 Designing Experiments


    The raw results for each test profile are stored in an XML file. Similar to the
    test image, the name of the file depends on the test number. For test number x,
    the results are stored in test-x.xml. Parsing this file allows for the raw results
