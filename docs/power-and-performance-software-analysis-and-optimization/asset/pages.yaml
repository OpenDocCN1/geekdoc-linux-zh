    sampling period to receive the requested rate.


    # 8.1.4 ENABLING, DISABLING, AND RESETTING COUNTERS


    Event counts can be controlled by performing ioctl(2) on the associated file descriptor.
    Modifications can be per event or per group. To modify an individual descriptor,
    the ioctl(2) is invoked on the event''s file descriptor and uses 0 as the last
    argument. On the other hand, the full event count can be modified by invoking
    the ioctl(2) on the group leader''s file descriptor and using PERF_IOC_FLAG_GROUP
    as the last argument.


    The PER_EVENT_IOC_ENABLE and PER_EVENT_IOC_DISABLE ioctls enable and disable the
    counters, respectively. This does not change the counter values.


    The PER_EVENT_IOC_RESET ioctl resets the counter to 0. However, any other data
    associated with the event counter, as the time_enabled or time_running values,
    are not reset.'
