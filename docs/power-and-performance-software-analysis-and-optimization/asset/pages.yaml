  md: '# 7.2 Data collection and reporting 125


    On the other hand, the command-line interface does not use the project files created
    by the GUI, nor does it create its own. Instead, each configuration option must
    be specified as a command-line argument. The author assumes this is because the
    command-line interface yields itself well to scripting, so any functionality provided
    by a project file can be replicated, with less effort, through the creation of
    a shell script.


    The comprehensive list of available configuration options and their meanings can
    be found in the VTune documentation, the pages for each command, or through the
    help command built into the command-line tool. For example, executing amplxe-cl
    will list the available actions, executing amplxe-cl-help will list all of the
    possible configuration options for that specific action.


    At the time of this writing, there are eight actions available in the command
    line interface. For profiling situations, knowledge of only two of these is necessary.
    These include the collect action, which performs the actual data collection, and
    the report action, which summarizes the data collected during the collect action
    in a human readable format.


    # 7.2.1 COLLECT ACTION


    The data is determined by the specified analysis type. To simplify data collection,
    VTune combines the building blocks of data collection into a high-level structure
    known as an analysis type. An analysis type is comprised of one or more data points,
    PMU events although other metrics are supported, with "knobs" for controlling
    the behavior of the data collection. Through the use of analysis types, VTune
    simplifies the process of creating, running, and sharing complicated performance
    analyses.


    VTune provides a predefined of analysis types designed by Intel engineers to cover
    the most common profiling situations. Additionally, the user is free to create
    their own analysis types. Each analysis type is defined in an XML file. The predefined
    types are located at $VTUNE_INSTALL/config/analysis_type, while the user''s custom
    types are defined in $HOME/intel/amplxe/analysis_type. Each analysis is categorized
    as either algorithmic analysis or a microarchitectural analysis. In general, the
    algorithmic analyses are available for most x86 processors, while the microarchitectural
    analyses depend on features present in some PMUs. As a result, the microarchitectural
    analyses are further divided into Intel SKUs within a hardware generation support
    all of the PMU features required for every analysis within that generation''s
    category. When performing microarchitectural analysis, the general-exploration
    analysis type is a good starting point, since it is designed to automatically
    perform the Top-Down profiling methodology described in Section 6.2.


    The analysis type is a required argument for the command-line interface and should
    immediately follow the -collect argument. The last argument provided'
