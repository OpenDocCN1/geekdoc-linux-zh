  md: '# 4.5 Step 4: Check upstream


    modes of communication utilized by many projects. These typically are mailing
    lists, bug trackers, and IRC channels. The links to these, or the desired communication
    method, along with any guidelines for their usage, can typically be found on the
    project''s website.


    Here are some tips for getting results:


    +   1. Check the project''s mailing list archives and bug tracker to see whether
    the issue reported is already known. If so, use this information to determine
    what further steps should be taken.


    +   2. Since each community is unique, the author finds it helpful to examine
    prior communications, such as the mailing list archive, in order to gain a better
    understanding of the community and how it operates. If archived communications
    are not available, or if achieved communicating via a real-time format, such as
    IRC, the same effect can be achieved by lurking on the channel asking your question.
    Taking the time to understand the community''s dynamic will typically yield helpful
    insights on how to tailor your communication for getting results.


    +   3. If communicating with mail, ensure that your email produces emails that
    adhere to your project requirements. When doubt, a safe configuration is the one
    described in the Linux kernel documentation, under |LINUX_SRC/Documentation/email-clients.txt.


    +   4. Avoid HTML emails at all.. mailing lists will reject HTML emails, and many
    developers, including the author, maintain `procmail` rules classifying all HTML
    as spam.


    +   5. Avoid Top-Posting. Type your responses inline. This simplifies code reviews
    and makes it much easier to follow the conversation.


    +   6. When possible, use `git send-mail` for emailing patches. It doesn''t have
    to be perfect, but at least make an effort. Spelling and grammar reflect back
    on the writer''s education and level of maturity.


    +   7. Avoid attempting to communicate in a language other than the project''s
    default. Some projects have special mailing lists or channels for different languages.


    +   8. Verify your communications were received. If the mailing list is available,
    after sending an email, check to ensure that your email appears in the archive.
    If not immediately received, Sometimes emails require moderation before appearing,
    or perhaps the archives take a while to update. At the same time, mailing lists
    occasionally will drop.


    +   9. Be polite. Remember, while many open source contributors are paid, many
    do so this as an enjoyable hobby. Keep in mind that no project or developer owes
    you anything,


    +   10. Understand the terms of popular open source licenses, such as the GPL,
    LGPL, and BSD license. When in doubt, seek professional legal counsel.


    +   11. Always unset or experimental code. The author typically prefers these
    communications with “RFC,” that is, Request For Comments.'
