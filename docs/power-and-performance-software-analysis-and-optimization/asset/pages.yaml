    **Test Suite** Command operates on every test profile contained within the group.

    OpenBenchmarking.org ID** Command operates on the same test profile or suite associated
    with the given ID on OpenBenchmarking.org.

    Test Result** Command operates on the same test profile or suite associated with
    the given name.


    Additionally, test profiles and suites can be referenced by their file system
    path, relative to the Phoronix directories. This allows for the grouping of related
