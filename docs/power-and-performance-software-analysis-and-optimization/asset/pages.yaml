- pgno: 144
  md: '# 7.2 Data collection and reporting 127


    # Configuration


    Between the -collect argument and the final argument, the application to profile,
    are the configuration options that control how the analysis occurs and is interpreted.
    In the graphical interface, all of these configuration items are set within the
    project properties.


    Typically, the user wants to correlate data samples from addresses to lines of
    source code. In order for this to work properly, the user needs to specify where
    the source and binary files are located. The -source-search-dir= argument adds
    -search-dir argument to the binary search path. Both of these arguments may be
    duplicated as many times as necessary.


    As discussed in Chapter 6, the PMU can only monitor a limited number of events
    simultaneously. As a result, there are a number of techniques for handling the
    situation where more events are specified than collected can be enabled simultaneously.
    In this situation, the set of events is partitioned into subsets capable of being
    programmed together. If the program can execute only once, as is the case with
    the default VTune collection, these subsets take being enabled on the PMU. The
    -multiple-runs argument allows for the data collection to run multiple times,
    each time with a different subset of the events active. As a result, this option
    minimizes the error of multiplexing the events. Obviously for this to work correctly,
    the executable must be capable of executing repeatedly without user interaction
    between runs.


    When profiling with sampling, it is necessary to determine an appropriate sampling
    frequency, that how frequently the PMU events should be collected. Some analysis
    types support a configuration option, referred to as a knob, that controls the
    sampling interval. This knob, sampling-interval, specifies the number of milliseconds
    between collections, ranging from 1 to 1000 ms. The default interval is 10 ms.
    Not all analysis types support the analysis type, which can be configured via
    a -knob interval=value command-line argument. For example, in order to increase
    the interval to 100 ms for an advanced-hotspots analysis type, the command would
    look like ample -c collect advanced-hotspots -knob sampling-interval=100.


    In order to simplify the collection of the sampling interval, VTune also exposes
    a -target-type=category command-line argument. This argument is supported for
    all analysis types, whether they support the sampling interval. Rather than specifying
    an exact interval, the user categorizes the estimated duration of the application''s
    execution. Based on this, VTune automatically configures the collection intervals.
    There are four duration categories. The first category, veryhort, specifies that
    the program execution is shorter than 1 ms. The second category, short, specifies
    that the program execution is longer than 1 min, but shorter than 15 min. The
    third category, medium, specifies that the program execution is longer than 15
    min, but shorter than 3 h. The fourth category, long, specifies that the program
    execution'
