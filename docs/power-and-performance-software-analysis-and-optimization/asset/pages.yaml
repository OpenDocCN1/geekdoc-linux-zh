    REP prefixes and their subsequent meanings.


    # 1.1.4 MACHINE CODE FORMAT


    One of the complex aspects of x86 is the encoding of instructions into machine

    codes, where the binary format is expected by the processor for instructions.
    Typically,

    develop write assembly using instruction mnemonics, and let the assembler

    select the proper instruction format; however, that isn''t always feasible. An
    engineer

    might want to bypass the assembler and manually encode the desired instructions,
    in

    or to utilize a new instruction on an older assembler, which doesn''t support
    that

    instruction, or precisely control the encoding, in order to control code size.


    8086 instructions, and their operands, are encoded into a variable length, ranging

    from 1 to 6 bytes. To accommodate this, the decoding unit parses the earlier bits

    in to determine what bits to expect in the future, and how to interpret them.

    Utilizing a variable length encoding format trades an increase in decoder complexity

    for improved code density. This is because very common instructions can be given

    short sequences, while less common and more complex instructions can be given

    longer sequences.


    The first byte of the machine code represents the instruction''s opcode. An opcode

    is simply a fixed number corresponding to a specific form of an instruction. Different

    forms of an instruction, such as one that operates on a register operand and

    one that operates on an immediate operand, may have different opcodes.

    opcode forms the initial decoding stage that determines the decoder''s next actions.

    The opcode for a given instruction format can be found in Volume 2, the Instruction

    Set Reference, of the Intel SDM.'
