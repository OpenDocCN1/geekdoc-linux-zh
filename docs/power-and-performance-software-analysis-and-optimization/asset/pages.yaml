    # 8.1.6 READING SAMPLING EVENTS


    While counting events provides an estimate of how well a given snippet is performing,
    sampling events provides the ability to estimate which instructions are responsible
    for the generated events. Continuing the trivial microbenchmark example shown
    in Listing 8.2, consider if the measuring code were rewritten to determine which
    branches were mispredicted. Listing 8.3 is written to leverage the Intel® Last
    Branch Record (LBR), which stores information about the sampled branches.


    On line 93, the perf_attr.sample_type field specifies what should be recorded
    for each event. In this situation, there are two items specified. The first, the
    instruction pointer, identifies which branch was mispredicted. The second, the
    LBR branch stack, lists the recently encountered branches and whether they were
    correctly predicted. Notice that in the function signature on line 29, the result
    structure corresponds to this field.


    On line 105, the resulting event file descriptor is mapped into the virtual address
    space of the process. As events occur, the kernel writes the collected samples
    into these pages. Starting on line 45, the actual memory data is parsed. The first
    memory mapped page contains a header, which specifies information about the following
    event data. This data is defined by the perf_event_header structure. The following
    data, starting at the second memory mapped page, is a ring buffer. There are two
    fields in the header that contain the read and write offsets into it. The valid
    unread buffer starts at the data_tail field and the end of the valid buffer is
    defined by the data_head field. If the pages were writable, the new entries are
    marked as read, by the user space process, writing the new value to the data_tail
    field.


    After accessing the data_tail, a memory barrier is utilized to ensure that the
    data written by the kernel to the memory mapped pages is visible to the user space
    process. This memory barrier is implemented on line 19, and utilizes the LFENCE
    instruction, that is, a load fence.'
