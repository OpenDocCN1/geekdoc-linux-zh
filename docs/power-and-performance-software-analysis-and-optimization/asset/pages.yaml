  md: '# CHAPTER 13 Branching


    branch predictor choose the correct path, or on organizing branch targets to follow
    static prediction rules. While these techniques will improve branch prediction
    for older platforms, and they won''t hurt branch prediction for newer platforms,
    they won''t be producing performance gains on modern platforms.


    Instead, since the branch predictor excels at finding patterns, branch optimizations
    should focus on reorganizing branches, such that they follow some predictable
    pattern.


    Branch hint prefixes have been mentioned as an ineffective optimization technique
    for modern x86 architectures. The two prefixes, 0x2E, which hinted the branch
    wouldn''t be taken, and 0x3E, which hinted that the branch would be taken, modified
    the static prediction rules used by the branch predictor. The static prediction
    rules are no longer used, so neither are the prefixes.


    # 13.2.1 PROFILE GUIDED OPTIMIZATION


    Unlike the other techniques in this chapter, profile guided optimization is a
    technique for optimizing branch prediction that doesn''t involve any changes to
    the source code. Instead, it compiles a series of steps that are designed to provide
    the compiler with feedback about their application''s behavior. This feedback
    is then used by the compiler to provide further optimizations. While all of the
    compiler''s optimizations benefit from this additional information, in the author''s
    personal experience, profile guided optimization is capable of impressive performance
    gains when branch prediction is the bottleneck.


    In order to comply this, the software must be built once, but twice. The first
    build is not designed to be used regularly. Instead, it instruments the code with
    special functions that monitor and record the software''s behavior at runtime.
    This instrumented binary will then be run on a workload designed to replicate
    the representative workloads, the trace of the application''s behavior is saved
    to the filesystem, and will be used later by the compiler. It''s worth noting
    that profile guided optimization can be performed on any binary that is, on executable
    applications and libraries. In a shared library, the binary executable, that will
    also need to be compiled with the instrumenting compiler flags, as will the library
    itself.


    At this point, the software is ready to be built again. At compile time, the compiler
    parses the traces generated by the first build during execution, and then uses
    those results to make informed decisions about the optimizations and layout of
    the code. The resulting binary, with its tailored optimizations, hopefully result
    in a performance increase. The key to successful profile guided optimization is
    the availability of an accurate workload.


    At the time of this writing, all three of the major compiler toolchains, GCC,
    LLVM, and the Intel® C and C++ compilers (ICC), all support profile guided optimization,
    although LLVM requires a newer release, as support was available until early 2014.'
