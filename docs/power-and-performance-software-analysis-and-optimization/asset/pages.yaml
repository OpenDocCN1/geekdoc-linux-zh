    # 3.1 INTEL® PENTIUM® M


    The Intel® Pentium® M processor family was introduced in 2003. This family consists
    of mobile processors, the “M,” and exemplifies many of the fundamental power management
    techniques available for Intel Architecture.


    # 3.1.1 ACPI


    The first revision of the Advanced Configuration and Power Interface (ACPI) specification
    was released in 1996. While ACPI is most commonly associated with power management,
    the majority of the ACPI specification actually deals with device enumeration
    and configuration. At boot, UEFI or the legacy BIOS is responsible for creating
    a series of tables that describe the devices available in the system and supported
    configurations.


    Additionally, these ACPI tables, expose functions, written in the ACPI Machine
    Language (AML). The Linux kernel interpreter can parse and execute these functions.
    This allows for device code to be abstracted behind a standardized device interface,
    and for the kernel to control certain devices without requiring a specialized
    driver.


    ACPI also defines a series of processor, device, and system states. The most-visible
    of these states are the S and G states, which include that most laptop users know
    as sleep and hibernation. There are three important ACPI processor states to understand.


    The first thermal states, which are often referred to as T states, are responsible
    for automatically throttling the processor in the case of a thermal trip. In other
    words, these states are built into the processor to automatically prevent damage
    caused by overheating. Since a misconfiguration of the T states could result in
    physical damage,'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# 3.1 Intel® Pentium® M 45


    these states are completely independent of software. Obviously, tripping these
    states should be avoided by ensuring that the processor is cooled by a solution
    capable of handling its TDP. It is also important to be aware of the fact that
    thermal throttling will drastically reduce performance until temperatures have
    returned to safe levels. As a result, this is something to be cautious of when
    running long benchmarks or tests.


    The rest of this section focuses on the other two processor states.


    # P states and Intel SpeedStep® Technology


    The ACPI specification defines the concept of Device and Processor performance
    states. Performance states, or simply P states, are designed to improve energy
    efficiency by allowing the processor to reduce performance, and therefore power
    consumption, when performance is not required. As of the latest ACPI specification,
    the performance states are defined as:


    +   - **P0** While a device or processor is in this state, it uses its maximum
    performance capability and can consume maximum power (Unified EFI, Inc, 2014)

    - **P1** In this performance state, the performance capability of a device or
    processor is limited below its maximum and consumes less than maximum power (Unified
    EFI, Inc, 2014)

    - **Pn** In this state, the performance capability of a device or processor is
    at its minimum level and consumes minimal power while remaining in an active state.
    State ni is a maximum number and processor or device dependent. Resources and
    devices may define support for an arbitrary number of performance states not to
    exceed 16 (Unified EFI, Inc, 2014).


    Notice that lower P states correspond to higher power consumption, while the higher
    P states correspond to lower power consumption. The specification uses P states
    provides each hardware with the flexibility of defining up to sixteen additional
    performance states. As a result, the number of supported P states for a given
    system varies depending on the exact processor configuration, and must be detected
    at runtime through the ACPI tables.


    On Intel Architecture, these states are implemented via Enhanced Intel SpeedStep®
    Technology (EIST). EIST provides an interface for controlling the processor''s
    operating frequency and voltage (Intel Corporation, 2004). This interface consists
    of various model registers for requesting a state transition, IA32_PERF_CTL_REGISTER,
    and for obtaining hardware feedback regarding the state, IA32_MPERF and IA32_APERF.


    It is important to note that these states are requested, as opposed to being set
    by software. Many complex factors contribute to the actual P state processor is
    put into, as the requested by the other cores, the system''s thermal state, and
    so on. Additionally, these MSRs are duplicated by Hyper-Thread, yet prior to the
    Fourth Generation Intel® Core™ processor family, P states were governed at the
    granularity of the processor package.'
