  md: '# 4.5 Step 4: Check upstream


    At this point, Git expects the user to define the bounds for the search. This
    occurs by marking the first good commit, and the first bad commit, via the git
    bisect good and git bisect bad commands. These commands take a list of Git refs
    as arguments. If both endpoints are marked, Git will return to HEAD, the current
    commit.


    Once both endpoints are marked, Git will continue to out a commit to test, that
    is, the current node in the binary search. The user must then perform the required
    testing to determine whether or not the current node suffers from the same regression.
    If so, mark the commit as bad, using git bisect bad, or if not, mark the commit
    as good, using git bisect good. It is also possible to skip testing the current
    commit, via git bisect skip, or by manually removing the commit from the current
    tree, via git reset --hard HEAD-. Be aware that normal reset --hard HEAD will
    delete a commit from the branch. During bisection, once the bounds have been established
    and Git begins committing, Git checks out individual commits and deletes it from
    the original.


    This cycle will continue until the first commit is found. Git will print the SHA1
    of this commit, with the commit information. Examining this commit should provide
    insight into what caused the regression. The bisection session can be terminated
    via git bisect reset, which will remove any bisection state, and return the tree
