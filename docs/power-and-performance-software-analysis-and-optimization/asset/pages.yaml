- pgno: 225
  md: '# CHAPTER 12 Toolchain Primer


    A toolchain is a set of tools for building, inspecting, and modifying software.
    All of the optimization techniques explained in this book, in one way or another,
    rely on support from the toolchain. As such, despite the fact that the majority
    of developers are intimately familiar with the toolchains they frequently use,
    the author feels compelled to ensure all readers are on the same page. The major
    components of a toolchain include, but aren''t limited to, a compiler, assembler,
    and a linker.


    The compiler is responsible for parsing source files written in a high-level programming
    language, such as C. The files are first translated into an intermediate language,
    used internally to the compiler. This intermediate language allows for the compiler
    to analyze program flow and optimize accordingly. After the optimization phase,
    the compiler outputs assembly code, which is passed directly to the assembler.


    The assembler is responsible for translating instruction mnemonics, into human-readable
    assembly, into binary opcodes expected by the processor. Unlike the compiler,
    the assembler''s output typically has a one-to-one relationship with the assembly
    source, except in the case of pseudo-instructions, which may translate to multiple,
    or zero, instructions. The output produced by the assembler is a binary file.


    Finally, the linker is responsible for combining the sections from each binary
    object file, resolving symbol references, and producing the final output, whether
    an executable or library. The exact layout of the output can be controlled by
    a linker script, which, for each section, defines the ordering, offsets, and virtual
    memory addresses.


    While these tools are used every time source code is built into an executable
    or library, there are many other pieces of the toolchain. Some tools for inspection
    of object files, such as nm and objdump, which display the information encoded
    in the object file in a human-readable form. Other tools allow for the modification
    of object files, such as strip and objcopy.


    In Linux, there are three major toolchains: the GNU compiler toolchain (GCC),
    the Low Level Virtual Machine toolchain (LLVM), and the Intel® C and C++ Toolchains
    (ICC).


    GCC is the most common toolchain, without a doubt, consisting of projects including
    creating and modifying binary objects, the GNU compiler collection, which provides
    the compiler and frontends for multiple programming languages, the GNU debugger
    , as well as other build tools, such as GCC autotools, and GNU Make. In fact,
    many open source projects, such as the Linux kernel, rely on many GCC-specific
    behaviors and extensions, that most of the other toolchains strive to maintain
    at least some level of compatibility with GCC.


    Another common toolchain present on Linux is LLVM. While a younger project than
    GCC, LLVM has been progressing rapidly and has attracted attention for its modular
    design and static analysis capabilities.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# 12.1 Compiler flags 209


    The last of the major toolchains is the Intel® compiler, designed specifically
    for producing heavily optimized code for Intel® processors. The Intel compiler
    is available free for noncommercial use on Linux. More information is available
    at https://software.intel.com/en-us/c-compilers.


    This chapter focuses on the GNU toolchain, due to its ubiquitous nature and the
    fact that many of its extensions are supported by other toolchains for compatibility.
    The author will do his best to point out areas where the different idiosyncrasies
    of the toolchains can be problematic.


    # 12.1 COMPILER FLAGS


    The first step in leveraging the compiler to produce better code is to learn how
    to control the compiler''s optimization stages and instruction generation. These
    are selected through the use of command arguments to the compiler, often called
    compiler flags or CFLAG.


    Looking at the list of individual optimizations available in GCC is daunting,
    partially due to the large number of options available. To remedy this problem,
    GCC exposes predefined optimization levels that automatically toggle the appropriate
    optimizations. These levels are selected by the -0 compiler flag, a capital letter
    O.


    The levels, and this is fairly standard between compilers, are described in Table
    12.1. The exact optimizations enabled at each level can be manually queried with


    | Level | CFLAG | Description |

    | --- | --- | --- |

    | 0 | -0 | No optimizations enabled. |

    | 1 | -01 | Optimizations are enabled that reduce code and execution time, but
    don''t significantly increase compilation time. |

    | 2 | -02 | All optimizations are enabled that reduce code and execution, excluding
    those that involve a tradeoff between code size and speed. |

    | 3 | -03 | Enables all optimizations at Level 2, plus those that drastically
    increase code size and those that may not improve performance. |

    | s | -Os | Optimizes for Level 2, except without optimizations that could increase
    code size, plus additional optimizations to reduce code size. |

    | fast | -Oast | Optimization Level 3, plus additional optimizations that may
    violate the language standards. |

    | g | -Og | Enables any optimizations that do not interfere with the debugger
    or significantly increase the compilation time. |'
  merge: -1
