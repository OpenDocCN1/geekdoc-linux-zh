  md: '# 1.4 Intel® 80386 and 80387


    page table entry (PTE), maps a 4-KB page. The page directory table and each of
    the page tables are the size of a 4-KB page, meaning that each consists of 1024
    entries of 4-B pointers. Therefore, only one page directory table is required
    to cover the whole 4-GB linear address space, since 1024 × 4-MB = 4GB. The physical
    address of this page directory table is stored in the CR3 register. Additionally,
    the 1024 entries in each page table cover the 4-MB region that would otherwise
    be mapped by the corresponding PDE, since 1024 × 4096 = 4-MB.


    When a PDE or PTE maps a page, it points to the beginning of either a 4-MB or
    4-KB page, so the entry is guaranteed to be at least aligned. The page directory
    and page tables are also required to be page aligned. As a result, the bottom
    12 bits of the PDE and PTE are guaranteed to be zero, by definition. Rather than
    wasting these bits, they are used to encode the page''s protection information,
    whether the page is present in memory, and whether the pointer maps a page or
    references another table. Within these 12 bits are four important bits: the present
    bit, read/write bit, supervisor/user bit, and the dirty bit. As mentioned previously,
    the present bit indicates whether the current page is in memory. Attempting to
    access a page whose present bit is not set will generate a page fault, giving
    the operating system a chance to load the desired page into memory before continuing.
    The read/write bit controls whether the page is read-only, or if it is writable.
    The supervisor/user bit controls whether the page is owned by the operating system
    or a user. Attempts to access a page belonging to the supervisor space from a
    user application will result in a fault. The dirty bit indicates whether a page
    has been modified. So, when the page is swapped out of memory, it will need to
    be written back to the disk. If not, it can be simply discarded, which is much
    less expensive.


    A linear address in this two-level system, is comprised of three components: a
    directory offset and an offset. Translation begins by reading the physical address
    of the page directory table from the CR3 register. The offset component of the
    linear address is added to this address in order to obtain the PDE. If the page
    size bit, seven, in the PDE is set, then the PDE maps a 4-MB page. In this situation,
    the PDE points to the physical address of a 4-MB page and the rest of the linear
    address is treated as an offset from the beginning of that page. This page address
    and offset are added to produce the final physical address that completes the
    translation. If the page size bit is not set, the PDE references a page table.
    In this situation, the PDE points to the physical address of the corresponding
    page table. The page offset component of the linear address is added to this address
    in order to obtain the PTE. The PTE points to the physical address of a 4-KB PTE.
    Finally, the address offset component of the linear address is added to this address
    to produce the final physical address that completes the translation.


    At this point, the reader might be wondering about all of the memory accesses
    required to translate a linear address into a physical address. At the very least,
    the page directory will need to be accessed for every address translation. In
    the common case, both the page directory and a page table will need to be accessed.
