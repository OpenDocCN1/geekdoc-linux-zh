  md: '# CHAPTER 5 Designing Experiments


    It is also important to determine whether the timer measures wall time or process
    time. The wall time measures the total time that has elapsed during measurement
    period. On the other hand, the process time only measures time accounted to the
    process being measured. For instance, if the execution of one process takes a
    total of 30 seconds, with 10 seconds of time spent with the core executing a different
    process, the wall time would be 30 seconds, and the per-process time would be
    20 seconds.


    # 5.3.1 CPU CYCLES


    At the processor level, the CPU keeps track of time by counting the number of
    clock cycles. A cycle represents one iteration of the CPU core''s loop for fetching,
    decoding, executing, and retiring instructions. Because the CPU is a pipeline,
    each of these phases occur concurrently. During one cycle, 16 words of instructions
    are fetched, instructions from the previous cycle''s fetch are decoded, or continue
    decoding, instructions decoded from an earlier cycle are executed, or continue
    executing, and instructions from an even earlier cycle are retired. The frequency
    of a processor estimates the number of cycles that can occur at a frequency of
    1.0 GHz, which is Hertz. For example, a processor that operates at a frequency
    of would perform one billion cycles second.


    The cycle count can be accessed either through the time-stamp counter via PMU
    events. This section focuses on the time-stamp counter. For more information on
    the PMU events, see Chapter 6.


    The time-stamp (TSC) counter is a MSR, IA32_TIME_STAMP_COUNT_MSR, which holds
    the 64-bit number of clock cycles since the processor was booted. Originally,
    the TSC incremented at the actual CPU frequency, however on modern Intel processors
    the TSC is invariant. Unlike the other methods for accessing the cycle count,
    the TSC does increment while the processor is halted. The TSC is monotonically
    increasing, except in the case of 64-bit overflow.


    Access to the TSC is provided via RDTSC and RDCP. Since the behavior for these
    instructions is for both 32 and 64-bit, the top 32 bits of the 64-bit counter
    are stored in the EDX, while the lower 32 bits are stored in the EAX register.
    The RDTSC instruction returns the contents of the current hardware thread''s 32-bit
    IA32_TSC_AUX_MSR in the ECX register. Linux sets this MSR to the hardware logical
    id number, allowing for the code to detect CPU migrations.


    Due to the out-of-order execution of modern CPU pipelines, it is necessary to
    verify that the TSC only counts the instructions that are being benchmarked. In
    order to accomplish this, it is necessary to add two serialization points into
    the pipeline. A serialization point, in the form of a serialization instruction,
    will that all previous instructions have finished executing, and that all future
    instructions have not started execution.


    The RDTSC instruction performs no serialization, while the RDTSC instruction verifies
    that all prior instructions have finished executing, but makes no guarantee'
