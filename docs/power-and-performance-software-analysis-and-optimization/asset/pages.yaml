- pgno: 129
  md: '# CHAPTER 6 Introduction to Profiling


    # 6.2.1 FRONT END BOUND


    As mentioned, the Front End of the CPU pipeline is responsible for fetching instructions,
    decoding these instructions into one or more µops, and finally delivering these
    µops to the Back End for execution. The general rule of thumb is to only focus
    on the Front End boundary where the percentage is above 30% (Intel Corporation,
    2014).


    Instructions are fetched and decoded via the Legacy Decoder Pipeline, often referred
    to as the MITE. The MITE is responsible for fetching instructions from memory
    and decoding them into µops. These instruction fetches occur in 16-byte chunks.
    A dedicated cache, the ICache, and TLB, the ITLB, are used to reduce the overhead
    of memory accesses. In older processor generations, modern Intel processors now
    provide separate L1 caches for instructions and data;


    Once the instructions have been fetched, they are now decoded. This is handled
    by a series of decoding units. Each decoding unit is capable of generating a certain
    number of µops each cycle. In the case an instruction generates more µops than
    the decoding unit can handle, the instruction will require multiple cycles to
    decode. Once the instructions have been decoded into the appropriate µops, those
    µops are output to the µop queue to execute away. Starting with the Second Generation
    Intel Core microarchitecture, the µops will also be added to the Decoded ICache.


    The Decoded ICache, often referred to as the DSB, caches the results of the Legacy
    Decoder Pipeline. This caching occurs in 32 byte chunks of instructions, which
    are indexed by the instruction pointer. There are various architectural restrictions
    on what instruction sequences can be cached. For example, on the Second Generation
    Intel Core microarchitecture, only two branches are allowed per entry and a maximum
    of 19 µops.


    Before the MITE is invoked, the DSB is searched for the given instruction chunk,
    based on the address to fetch. If found within the cache, the fetch and decode
    phases are skipped, and the µops are delivered into the µop queue directly from
    the DSB cache. If not found, the MITE performs the decode, and then attempts to
    add all to the cache.


    In the formula for Front End Bound, shown in Equation 6.2(a), the IDQ_OPS_NOT_DELIVERED_CORE
    is compared against the theoretical maximum of µops. IDQ stands for the Instruction
    Decoder Queue, from where µops are allocated. In other words, this measures the
    number of times where µops was not delivered from the IDQ for allocation. As a
    result, the P_FE metric is the percentage of pipeline stalls caused by issues
    during the fetching or decoding of instructions.


    Once the Front Bound category has been identified as having significant impact
    on pipeline efficiency, it is time to explore additional metrics, which increase
    the level of detail with regards to the Front End. There metrics can be found
    in Figure 6.3.'
  merge: -1
  img_proc: true
