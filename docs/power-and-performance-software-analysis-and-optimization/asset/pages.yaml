  md: '# Table 1.1 Forms for the ADD Instruction on the Intel® 8086


    | Operand Form | Example | Note |

    | --- | --- | --- |

    | register, register | add %ax, %dx | dx = ax + dx |

    | register, memory | add %ax, (%dx) | *(short) %dx = *(short) %dx + |

    | memory, register | add (%dx), %ax | ax = ax + *(short) %dx; |

    | immediate, register | add $10, %ax | ax = ax + 10; |

    | immediate, memory | add $10, (%dx) | *(short) %bx = *(short) %bx + 10; |

    | immediate | add $10 | ax = ax + 10; |


    of operands includes a specific register, memory address, or an immediate, that
    is, a constant value at the time of assembly. As mentioned earlier, operands can
    be either explicit or implicit.


    To illustrate this, consider the ADD instruction, which at the time of 8086, had
    six unique forms. These forms are listed in Table 1.1. Note how the first five
    are explicit, whereas the last has an implicit operand, AX.


    The 8086 has instructions comprising of about one hundred unique instructions,
    not accounting for different forms. These instructions can be divided into five
    logical groupings. For a full reference of the available instructions, along with
    their meanings and operands, see the Intel SDM.


    # Data movement


    The first group contains instructions that move data from one operand to another.
    This includes instructions like MOV, which can move data from one operand to another,
    PUSH and POP, which pushes an operand onto the stack or pops the top of the stack
    into the operand, and XCHG, which atomically swaps the contents of two operands.


    # Integer arithmetic


    The second group contains instructions that perform integer arithmetic. This includes
    instructions that perform the standard familiar arithmetic operations, such as
    ADD, SUB, MUL, and DIV.


    Additionally, x86 supports instructions for performing these operations with "carry"
    or "borrow." This is used for implementing these operations over an arbitrarily
    large number of bytes. In the case of a carry, the bit in EFLAGS is flagged for
    the next instruction to interpret. For example, add ADC with carry, instruction
    uses this bit to determine whether the result should be incremented by one, to
    borrow the bit carried from the previous ADC operation.


    Typically each of these instructions sets the relevant status bits in the EFLAGS
    register. This often obviates the need to use an explicit comparison instruction
    for some checks, like checks for zero, or less than zero. Instead, the flag can
    simply be reused from the arithmetic operation.'
