    # 4.2 STEP 1: DETERMINE THE SOURCE OF THE PROBLEM


    Now that we have clearly defined an unambiguous problem statement, we must isolate
    the source of the problem. This code will overutilizes some expensive or scarce
    resource, limiting performance. We refer to this limiting resource as a bottleneck.
    Bottlenecks can take many different forms, such as network bandwidth, CPU execution
    units, or disk time.


    As mentioned previously, modern systems are far too complex for guesswork bottlenecks.
    Inside, monitors are used to capture data hardware and software state during execution.
    This data is then analyzed and interpreted to determine the bottleneck. This process
    is referred to as profiling. Part 2 of this book focuses on how to profile with
    some of the more common software monitors available for Linux.


    When profiling, it is important to analyze the data objectively. There can be
    a temptation, before conducting profiling, to prematurely conclude what the bottleneck
    must be. This temptation is especially dangerous, it can bias the profiling outcome.
    Regardless of the validity of the premature conclusion, it is usually possible
    to continue to a situation and where the conclusion can be as true. Keep in mind
    what Mark Twain once said, "Facts are stubborn. Statistics are more pliable."


    Aside from objectivity, thoroughness is required when profiling, because subtle
    details can have a large impact on results, and their subsequent meaning. Notice
    that the definition of profiling involves both data collection and analysis. A
    very common mistake is to collect an insurmountable amount of data and perform
    little analysis, a situation the author refers to as flailing. Flailing occurs
    due to nothing immediately standing out to the analyst, because either the wrong
    data is being collected, or an unmanageable amount of data is being collected.
    If this kind of situation arises, where a lot of data is collected, but the data
    doesn''t seem to be leading anywhere, slow down and relatively concentrate on
    what the existing data means.


    Working at Intel, the author has the privilege of working with some of the best
    performance analysts, and one of the first things the author noticed was how thoroughly
    they interrogate each data point.'
