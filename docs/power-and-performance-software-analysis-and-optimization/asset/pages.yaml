    # Batch mode


    Running the Phorix Test Suite in batch mode allows for operations, such as installing
    and running tests, to occur in a manner that requires no human interaction. This
    is especially useful if integrating into an automated performance infrastructure.
    Before benchmarks can be run, the batch mode options must be configured. As shown
    in Table 5.2, the batch mode options are part of PhorixTest-Options.BatchMode
    schema. If PhorixTestSuite.Options.BatchMode.Configured is set to false, batch
    mode operations will fail with an error message that batch mode must first be
    configured. Because batch mode is not interactive, these configuration options
    dictate how benchmarks are run. Once configured, tests can be installed and run
    with:


    ```

    $ phorix-test-suite batch-install <test reference>

    $ phorix-test-suite batch-run <test reference>

    ```


    # 5.4.2 WORKING WITH RESULTS


    Typically, using the Phorix Test Suite, the interesting data is not one specific
    test result, but a comparison of multiple test results, highlighting the performance
    delta between one or more changes. To accommodate this, Phorix has commands for
    splicing and extracting data from one result into another result. Any of the test
    results posted to OpenBenchmarking.org can be downloaded


    ```

    $ phorix-test-suite clone-result <Test Id>

    ```


    This downloads the full result, including the system-logs folder, which allows
    for researching the exact system configuration, composite.xml file containing
    all of the test results, and the graphs. These files are downloaded into the default
    test-results directory, with the directory named after the test id. Multiple results,
    such as a local result and a result cloned from OpenBenchmark-org, can be combined
    with:


    ```

    $ phorix-test-suite merge-results <result> <result> ...

    ```


    If there is overlap, that is, the same test was run in both, those results will
    be merged into the same graph. The test results being merged aren''t modified'
