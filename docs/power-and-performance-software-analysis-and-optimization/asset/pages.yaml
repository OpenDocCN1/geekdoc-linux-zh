- pgno: 228
  md: '# 12.2 ELF and the x86/x86_64 ABIs 211


    Thus, the instruction set enabled for the compiler to automatically generate at
    compile time must be the lowest common denominator of the hardware software is
    designed to support. Section 12.3 will explain how to resolve this problem.


    # 12.2 ELF AND THE x86/x86_64 ABIs


    In Linux, the execve() system call is used to load and execute a stored program
    in the current process. To accommodate this, the stored program must convey information
    to the kernel regarding how the associated code should be organized in memory,
    among other bits of information. This information is communicated through the
    various pieces of the executable file, which the kernel must parse and handle
    accordingly.


    Linux supports parsing and executing multiple file formats. Internally, Linux
    handles the implementations for each of these file handlers via the linux_binfmt
    struct. Each handler is responsible for parsing the associated file creating the
    next state, and starting the execution. For example, the reason that it''s impossible
    to invoke execve() on shell scripts beginning with the line "#!<program> <arguments>"
    is because there is an explicit handler, binfmt_script, dedicated to parsing files
    with prefix, executing the program, and then passing the script to that program.


    These Linux_binfmt implementations, along with the common execve() code, can be
    found in $LINUX_SRC/fs/binfmt.c and $LINUX_SRC/fs/exec.c.


    While Linux supports multiple executable files, the most commonly used format
    on Linux is the Executable and Linkable Format (ELF). The ELF standard was published
    by the UNIX System Laboratories, and was intended to provide a single executable
    format that would "extend across multiple operating environments" (UN System Laboratories,
    2001).


    ELF defines three object types: relocable files, executable files, and shared
    object files. Relocatable files are designed to be combined with other object
    files by the linker to produce executable or shared object files. Executable files
    are designed to be invoked via execve(). Shared object files are designed to be
    linked, either by the linker at build time, or at load time by the dynamic linker.
    Shared object files allow code to be referenced via shared libraries.


    The ELF format is comprised of two complementary views.


    The first view, the linking view, is comprised of the program sections. Sections
    group aspects such as code and data into contiguous regions within the ELF file.
    The linker is responsible for concatenating duplicate sections when linking multiple
    object files. For example, if object file foo.o defines a function foo() and a
    variable x, and object file bar.o defines a function bar() and a variable y, the
    linker would produce an object file whose code section contained the functions
    foo() bar() and whose data section defines variables x and y.


    The ELF specification defines special sections that are allocated for specific
    tasks, such as holding code or read-only data. These special sections can be identified'
