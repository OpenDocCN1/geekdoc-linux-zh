- pgno: 21
  md: '# CHAPTER 1 Early Intel® Architecture


    including the general purpose, control and status registers, to their documented
    initial values.


    This first “breath” leaves the processor in an execution state significantly different
    from the one which most developers are familiar. The processor begins execution
    in 16-bit Real-Address mode. This journey between 16-bit Real-Address mode and
    64-bit, or 32-bit, Protected Virtual-Address mode occurs every time the processor
    is powered on. In doing so, this process mirrors the historical evolution of the
    Intel® Architecture, from the 16-bit 8086 of 1978 to the 64-bit Intel® Core™ processor
    family of the twenty-first century. As the computer is booted, more than 40 years
    of advancements in processor technology unfold in the blink of an eye.


    The author imagines some readers are wondering what benefit could possibly come
    from the retention of all these relics of computing antiquity in modern processor
    design. Backwards compatibility, by definition involves older designs, directly
    benefit the reader. As readers, hopefully, continue through this book, they will
    find references to many architectural features. Education on usage of these features
    is an investment of the reader’s time. By strictly maintaining backward compatibility,
    Intel ensures that the investments made by the reader today continue to pay dividends
    for the foreseeable future. Consider that original bytecode compiled in the late
    1970s will still run unmodified on a modern Intel® processor fabricated in 2014.


    Other detractors argue that Intel Architecture is inelegant. Since elegance is
    in the eyes of the holder, this claim is hard to refute. The author is not a hardware
    engineer; as a software engineer, the author sees an interesting parallel between
    hardware and software in this claim. Many software projects are architected to
    be elegant to a well-defined problem. The elegance erodes over time as new features,
    which were unimaginable during the design phase, are requested and bug fixes and
    workarounds are introduced. After enduring these unavoidable harsh realities of
    the software lifecycle, a software’s worth comes from elegance, but from whether
    software works, is still reliable, and can still be extended to future needs.
    The author submits that x86 still works, is still reliable, and can still be extended.


    Covering every aspect of Intel Architecture would require an entire book, so couple
    of the next three chapters is to introduce the fundamentals of the architecture,
    in order to provide enough knowledge to enable the reader to understand the later
    content in this book, as well as begin to reason effectively about power consumption
    and performance.


    Because Intel Architecture has been in a constant state of evolution for the last
    40 years, and has been steadily increasing in complexity, the author has divided
    the introduction to Intel Architecture into three separate chronologically ordered
    chapters, sampling the general timeline of Intel processors. Despite following
    the timeline, history is only being used as a convenient tool. Not all processors
    or architectural details will be covered in the sections that follow. Also, unless
    explicitly stated, not all technologies are discussed in the section corresponding
    to the processor that introduced them. Instead, each section will utilize the
    given processor as a vehicle'
