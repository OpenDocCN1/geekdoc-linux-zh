  img_proc: true
- pgno: 125
  md: '# 108 CHAPTER 6 Introduction to Profiling


    Aside from these fields, there are a number of bits that control the behavior
    of the event. All these fields are combined according to the format for IA32_PERFEVTSEL
    MSR, where x represents an integer specifying which counter to modify. Figure
    6.1 illustrates this MSR format.


    The user mode, and operating system mode, OS, bits control whether collection
    occurs while the hardware is operating in rings one through three, and ring zero,
    respectively. In Linux, the kernel runs in ring zero, while user space runs in
    ring three. Rings one and two aren''t currently used. In other words, these bits
    control whether data includes kernel space, only user space, or both kernel and
    user space.


    The edge detect bit, E, modifies the collection of the logic unit in order to
    collect data relative to the boundary conditions of the event. Events that support
    this, along with its meaning for that event, are documented in the comment section
    of the relevant SDM documentation. For instance, the Fourth Generation Intel Core
    processor fully supports the count of unchanged cycles while the hardware is operating
    in ring zero. The edge detect bit for this event changes the collection to count
    the number of transitions into ring zero.


    The enabled bit, EN, controls whether the current performance counter is enabled
    or disabled. If set, the counter is enabled. If not set, the counter is disabled.


    The APIC interrupt bit, INT, controls whether an interrupt is generated through
    the local APIC to signal counter overflows. This enables the counter overflow
    interrupt handler receives the requested information about the execution state
    that caused the last event. In order to set the sampling frequency, that is, how
    many events occur before an interrupt is generated, the counter is initialized
    so that adding the number of events will overflow the counter. One consideration
    when selecting the sampling frequency is the tradeoff between generating too few
    interrupts, leading to an insufficient sampling, and generating too many interrupts,
    causing excessive overhead.


    Because of the overhead for processing an interrupt, the instruction in which
    the interrupt may have already finished executing, thus the wrong instruction
    is responsible for the event. This phenomenon is referred to as skid. A general
    rule of thumb, events that are counted to retirement have smaller sizes than events
    that are counted earlier in the CPU pipeline.


    To reduce, modern Intel Architectures support Precise Event Sampling (PEBS). With
    PEBS, the software provides a memory buffer for storing extra event information.
    When events are generated, a PEBS record is created with the precise accounting
    data, reducing skid. Not all performances support PEBS.


    | 24 | 23 | 22 | 21 | 20 | 19 | 18 | 17 | 16 | | 8 | 0 |

    |---|---|---|---|---|---|---|---|---|---|---||

    | Omask | Inv | En | Int | PC | R | OS USB | Event Num. |


