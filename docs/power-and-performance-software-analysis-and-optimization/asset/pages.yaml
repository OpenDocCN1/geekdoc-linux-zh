  md: 'maintaining a separate out-of-tree code branch will require keeping up with
    rapid development model, and will require a significant investment in frequently
    rebasing the code, handling conflicts that are introduced by other patches, and
    performing separate testing. The consequences of not fulfilling this investment
    is bit rot, leading to code abandonment.


    On the other hand, patches integrated upstream benefit from all the testing of
    the developers and other users, as well as any further improvements made by the
    community. Any future patches that introduce conflicts with the upstream code
    would be a regression, and the burden of resolving them would lie with the author
    of the offending patch, rather than with the reader''s. While upstreaming may
    seem to be more work, it''s an up-front cost that definitely saves time and effort
    the rest of the long run.


    While every open source project runs differently, with its own preferences, the
    rest of some projects provides some hints for getting results.


    # 4.5.1 WHO


    Consider the analogy of open source project releases to a river: The "source"
    of the river, that is, its original project. This includes the project''s developers,
    who write the actual code, and produce releases. These releases "flow" down the
    river, being consumed and modified by each interested party before making their
    way to the "mouth" of the river, the end user. At any point in the river, upstream
    refers to any point closer to the "source", while downstream refers to any point
    closer to the "mouth".


    The majority of open source code consumed by the end user doesn''t come from the
    original project, but rather is the version packaged, in formats like RPM and
    ebuild, by their Linux distribution. Linux consumes projects from upstream and
    integrate them together to produce a cohesive deliverable, which flows downstream.


    As a result of these modifications, the same version of a project on two distributions
    might be drastically different. Things become even more complicated, because some
    distributions, notably enterprise distributions, backport features and bugfixes
    in older stable releases, making release numbers potentially misleading.


    Due to all, it is important, when attempting to reach out to a project, to determine
    the proper community to contact. Typically, the first step is to determine whether
    the project is reproducible with the original project release, that is, checking
    at the "source" of the river. If so, the project would be the correct path to
    contact. If not, further investigation is required into where the offending was
    introduced. This process is simply a matter of working downstream until finding
    the first codebase reproduces the problem.


    # 4.5.2 WHERE AND HOW


    So now that problem has been isolated to a specific release, it''s time to determine
    where to contact the owner. While each project has a unique setup, there are common'
