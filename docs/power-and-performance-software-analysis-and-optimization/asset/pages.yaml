    Aside from CRC32 and POPCNT, the SSE4.2 instruction set adds functionality for
    performing common string operations with SIMD instructions. This new functionality
    revolves around comparing, searching, and validating strings with five new instructions.


    Four of the new instructions vary slightly in behavior and follow the general
    format of PCMPXSTR, where x and y are variables that control the string length
    and result format, respectively. These are two possible values for x, the character
    “E,” for explicit length, and the character “L,” for implicit length. Implicit
    strings are terminated with a sentinel character, which is standard C strings
    terminated with a NULL character. On the other hand, explicit strings require
    the length of the strings to be loaded into general purpose registers. As a result,
    the implicit length forms, PCMPISTRY, are designed for working on text strings
    and will automatically stop when a NULL character is encountered. On the other
    hand, the explicit length forms, PCMPESTRY, are designed for working on binary
    strings, where a NULL character isn''t used as a sentinel.


    For the explicit length forms, the string length of the second operand, in AT&T
    syntax, is stored in the RDX and EDX register, depending on the processor mode,
    while the length of the third operand is stored in the RAX or EAX register. Since
    the length'
