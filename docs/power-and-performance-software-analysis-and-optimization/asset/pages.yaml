- pgno: 185
  md: 'a list of register names, memory labels, and stack offsets for the relevant
    data at the tracepoint location. Because of this, utilizing dynamic tracepoints
    requires at least some basic knowledge about the code path which is being traced.


    Whereas the performance tools discussed in Chapters 7 and 8, Intel® VTune Amplifier
    and perf utilize statistical sampling in order to attribute events to their relevant
    hotspots, trace instruments log the pertinent information when an event occurs.
    The Linux kernel trace infrastructure is optimized such that tracepoints, even
    though compiled into the kernel, have very low overhead, typically just a branch,
    in the case where they are disabled at runtime. This contributes greatly to the
    usefulness of glace, because this low overhead encourages Linux tracing to enable
    tracepoints within their default kernel configurations. Otherwise, significant
    tracepoint overhead, with the tracepoint disabled, would deregate them to use
    only debug kernels.


    At the time of this writing, common Linux distributions, such as Android, Fedora,
    and Red Hat Enterprise Linux, enable tracing infrastructure in their default kernel
    configurations. The main kernel configuration required for it is CONFIG_TRACE.
    Other configuration options provide fine-grained control over what tracing functionality
    is available. Options include CONFIG_FUNCTION_TRACER, CONFIG_FUNCTION_GRAPH_TRACER,
    CONFIG_IROFF_TRACER, CONFIG_FTRACE_SYSCALLS, and so on. For example, checking
    the default kernel configuration for x86_64 on Fedora 20:


    ```

    $ grep CONFIG_TRACE /boot/config-uname -r''

    CONFIG_TRACE=y

    CONFIG_FTRACE_SYSCALLS=y

    CONFIG_FTRACE_COUNT_RECORD=y

    # CONFIG_FTRACE_STARTUP_TEST is not set

    $ grep CONFIG_FUNCTION /boot/config-uname -r''

    CONFIG_FUNCTION_TRACER=y

    CONFIG_FUNCTION_GRAPH_TRACER=y

    CONFIG_FUNCTION_PROFILER=y

    ```


    # 9.1 DEBUGFS


    The ftrace API is exposed through the debugfs memory-backed file system. As a
    result, unlike the other performance tools discussed in this book, all of the
    functionality of ftrace can be accessed without any dedicated tools. Instead,
    all operations, such as selecting which data to report, starting and stopping
    data collection, and viewing results, can be accomplished with the basic utilities,
    such as cat(1) and echo(1).


    This combined, with the fact that many distributions enable ftrace in their default
    kernel configurations, means that ftrace is a tool that can be used almost anywhere.
    This scales up from tiny embedded systems, where busybox has all the tools needed,
    mobile platforms, such as Android, to large enterprise distributions.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# 9.1 DebugFS 169


    The first step in utilizing the API is to mount the debugfs file system. Traditionally,
    Linux distributions automatically mount debugfs under sysfs, at /sys/kernel/debug.
    Checking whether debugfs is already mounted is simple as querying the list of
    mounted file systems, either with the mount(1) command, or by looking at /proc/mounts
    or /etc/mtab. For example:


    ```

    $ mount | grep debug

    debugs on /sys/kernel/debug type debugfs (rw,relative)

    $ grep debugfs /proc/mounts

    $ debugfs /sys/kernel/debug debugfs rw.relative 0 0

    $ grep debugfs /etc/mtab

    $ debugfs /sys/kernel/debug debugfs rw.relative 0 0

    ```


    Additionally, the file system can be manually mounted with:

    $ mount -t debugfs nodev /mnt/location


    Once the file system is mounted, a tracing/ subdirectory is available. The directory
    holds all of the files for controlling trace. Some files are read-only, designed
    for extracting information from the API about the current configuration or results.
    Other files allow both reading and writing, where a read queries an option''s
    current value, whereas a write modifies that value. Note: that debugfs provides
    visibility into the kernel, accessing this directory, and by utilizing the tool,
    requires root.


    ```

    $pwd

    $ /sys/kernel/debug/tracing

    $ ls

    available_events max_graph_depth stack_trace

    available_filter_functions options/ stack_trace_filter

    available_tracers per/cpu/ trace

    buffer_size_kb print_formats trace_clock

    buffer_total_size_kb README saved_cdlines trace_marker

    current_trace set_options

    dynf_trace_total_info set trace_pipe

    enabled_functions set_trace_filter trace/

    events/ set_trace_notrace tracing_cpumask

    free_buffer set_gid tracing_max_latency

    function_enabled set_graph_function tracing on

    instances/ set_graph_notrace tracing_thresh

    kprobe_events snapshot uprobe_events

    kprobe_profile stack_max_size uprobe_profile

    ```


    # 9.1 TRACERS


    A tracer determines what information is collected when tracing is enabled. The
    list of tracers enabled in the kernel configuration can be obtained by reading
    the contents of the available_tracers file, a read-only file. If the desired tracer
    is missing from this list, it wasn''t compiled into the kernel. In this case,
    rebuild the kernel after adding the relevant configuration option.'
  merge: -1
