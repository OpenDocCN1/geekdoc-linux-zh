    # CPUID


    CPUID, the CPU identification, allows the processor to query, at runtime, the
    processor''s supported features. Due to the large amount of information available,
    information is cataloged into topical “leaves.” A leaf is selected by loading
    the corresponding leaf number into the EAX register before invoking CPUID. The
    basic leaf numbers start at 0, whereas the extended leaf numbers start at 0x80000000.


    Since CPUID has been updated with new features since its introduction, when using
    a potentially unsupported leaf, it’s necessary to first verify that the leaf is
    supported. This is achieved by querying the first leaf, either zero for the basic
    information leaf or 0x80000000, and checking the value of the EAX register, which
    is set to the maximum supported leaf.


