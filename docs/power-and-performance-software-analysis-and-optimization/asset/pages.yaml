  md: '# 1.1 Intel® 8086


    for maintaining and manipulating the internal processor state, including the CPU
    registers and arithmetic/logic unit (ALU). The EU, however, is unable to access
    the system''s memory, which requires usage of the system bus. The BIU is solely
    responsible for interfacing with the system bus. This separation allows for the
    two units to operate in parallel, with the BIU fetching data over the bus while
    the EU is executing instructions.


    To accommodate this asynchronous nature, the two units interface with an instruction
    queue, therefore allowing the BIU to fetch instructions before they are required.
    When the BIU detects that there is an available slot in the queue, it begins to
    fetch an instruction to fill that slot. When the EU detects there is a valid entry
    in the queue, it removes it and begins executing it. If the EU requires the evaluation
    of a memory operation, it passes the effective address to the BIU, which suspends
    prefetching and retrieves the desired system information.


    Beginning to understand the x86 architecture starts with the realization that
    a processor is simply a state machine with states, described by the contents of
    memory and the registers, and inputs transition between different states, the
    instruction set.


    # 1.1.1 SYSTEM STATE


    For the general case, there are three members of the 8086 hierarchy: the processor''s
    registers, the system memory, which is RAM, and persistent storage, that is the
    disk drive. The registers provide volatile storage very close to the processor
    on the device. Since this memory is very fast, it is also very expensive, and
    very scarce. On the other hand, the volatile memory is significantly cheaper than
    the registers, and therefore more prevalent than the registers, but also orders
    of magnitude slower. Similarly, the persistent storage is significantly cheaper
    than the external memory, and therefore available in greater quantities, but also
    orders of magnitude slower than external memory. To quantify the inverse relationship
    between storage density and speed, consider that the 8086 might be paired with
    a 10 MB hard drive, which was capable of addressing 1 MB of external RAM, and
    had 16-bit registers.


    # Address space


    The 8086 is comprised of two different address spaces, the memory address space,
    capable of addressing 1 MB, and the I/O address space, capable of addressing 64
    KB. External peripherals can be mapped into the I/O address space or memory-mapped.
    Device registers in the I/O address space are manipulated with the IN and OUT
    instructions, while memory-mapped device registers can be manipulated with general
    purpose instructions, like like memory.


    In order to address 1 MB of memory with a 16-bit processor, which would normally
    be limited to 2¹⁶ bytes of memory, the 8086 utilizes a technique referred to as
    segmentation. Segmentation divides the memory space into 64 KB segments. The definition
    of the segments is completely up to the programmer to control. There'
