    # 12.5.1 STANDONE ASSEMBLY


    As the names imply, standalone assembly involves writing routines and data structures
    that are separate from the C source files. Instead of being compiled by the C
    compiler, these source files are assembled, using the assembler, into an object
    file, which can be used like any other ELF object file. Compliance with the ABI
    ensures interoperability between C and assembly. Following GNU Makefile rules,
    assembly files typically end with .a or .s suffix. By default, files ending with
    .s are passed to the assembler, files ending with .s run through the C preprocessor
    to process a .s file, and then are assembled. Use of the C preprocessor for the
    sharing of C header files between C and assembly code. Another common suffix is
    .asm.


    Many assemblers exist for Linux, but the most common are the GNU assembler, the
    Netwide assembler, nasm and YASM. The GNU assembler and YASM support the AT&T
    and Intel instruction syntaxes. Due to their ubiquitous nature, the author tends
    to use AT&T syntax and target the GNU assembler, which tends to be the most commonly
    available; the decision on which assembler to use or format usually depends on
    personal preference.


    Symbols, which can mark data or text regions, are exported, for linking, via the
    .global pseudo-op. Local symbols, are symbols that are not named in the object
    file, being with the prefix "L". For situations where only a temporary symbol
    is desired, can be created by using a positive integer for the symbol name. The
    label can then be referred to the number, suffixed by "f" or "b". The "f" suffix
    indicates that the numbered label occurs after the current instruction, while
    the "b" suffix indicates that the numbered label occurs before the current instance.


