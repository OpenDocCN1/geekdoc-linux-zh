    # Data alignment


    The data load instructions typically come in two distinct versions, one with the
    suffix containing the “A”, and one with the suffix containing the letter “U.”
    Sometimes this letter is the last letter in the suffix, such as in the case of
    MOVDQU and MOVDQA, and sometimes it is not, such as in the case of MOAPS and MOUPS.
    This letter designates instructions that only operate on aligned data, corresponding
    to the letter “A” for aligned, and instructions that operate on both unaligned
    and aligned data, corresponding to the letter “U”.


    Each register size has a alignment requirement, the natural alignment. In other
    words, the 128-bit SSE registers have an alignment requirement of 16 bytes, 128
    bits, the 256-bit AVX registers have an alignment requirement of 32 bytes, 256
    bits, and the 512-bit AVX-512 registers have an alignment requirement of 64 bytes,
    that is. Attempting to perform an aligned load, or store, on a memory operand
    that does not meet this alignment requirement will result in a fault occurring,
    causing the process to receive a SIGBUS, or sometimes a SIGGV, signal. The default
    signal handler in both cases is to generate a core dump and terminate the process


    The reason for providing instructions that only operate on aligned operands is
    that aligned loads and stores are significantly faster than their unaligned counterparts.


    Using an unaligned load or store would result in the more expensive unaligned
    load or store, regardless of whether the operand was aligned or not. Starting
    with the Second Generation Intel Core™ processor, there is extra logic in the
    unaligned load and store instructions that check for an aligned memory operand,
    and if so, performs the aligned operation instead. This optimization in hardware
    improves performance in the situations where the alignment isn''t explicitly known
    and where software is always to perform unaligned load or store, to avoid the
    possibility of generating a fault. Unfortunately, this optimization also resulted
    in some confusion about the performance impact of data alignment.


    The reason for this confusion stems from the fact that an unaligned load instruction
    no longer guarantees an unaligned data load, making it very easy to create misrepresentative
    benchmarks possibly disposing the performance of alignment. On the contrary, data
    alignment make a significant impact on performance. This is especially true for
    Intel Atom Atom processors.


    This confusion is further compounded by the fact that, excluding the streaming
    instructions, loads and stores are satisfied by the cache, as opposed to directly
    accessing RAM. Therefore, an unaligned load that is contained within one cache'
