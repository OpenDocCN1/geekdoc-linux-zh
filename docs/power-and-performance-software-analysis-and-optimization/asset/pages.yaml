- pgno: 54
  md: '# 2.2 Intel® Pentium® Pro 37


    point μops, and one for handling memory μops. Therefore, up to five μops can execute
    in parallel. An instruction, divided into one or more μops, is not execute until
    all of its corresponding μops have finished. Obviously, μops from the same instruction
    have dependencies upon one another so they cannot all execute simultaneously.
    Therefore, μops from multiple instructions are dispatched to the execution units.


    Taking advantage of the fine granularity of μops, out-of-order execution significantly
    improves utilization of the execution units. Up until the Pentium Pro, Intel processors
    executed in-order, meaning that instructions were executed in the same sequence
    as they were organized in memory. With out-of-order execution, μops are scheduled
    based on the available resources, as opposed to ordering. As instructions are
    fetched and decoded, the resulting μops are stored in the Reorder Buffer. As execution
    units and other resources become available, the Reservation Station dispatches
    the corresponding μop to one of the execution units. Once the uop has finished
    executing, the result is stored back into the Reorder Buffer. Once all of the
    μops associated with an instruction have completed, and μops retire, they are
    removed from the Reorder Buffer and any results or side-effects are made visible
    to the rest of the system. While instructions can execute in any order, instructions
    retire in-order, ensuring that the programmer does not need to worry about handling
    out-of-order execution.


    To illustrate the problem with in-order execution and the benefit of out-of-order
    execution, consider the following hypothetical situation. Assume that a processor
    has two execution units capable of handling integer μops and one capable of handling
    floating point μops. With in-ordering, the most efficient usage of this processor
    would be to intermix integer and floating point instructions following the two-to-one
    ratio. This would involve carefully scheduling instructions based on their instruction
    latencies, along with the latencies for fetching any memory resources, to ensure
    that when an execution unit becomes available, the next uop in the queue would
    be executed with that unit.


    For example, consider four instructions executed in this example: three integer
    instructions followed by a floating point instruction. Assume that each corresponds
    to one uop, that these instructions have no interdependencies, and that all three
    execution units are currently available. The first two integer instructions would
    be dispatched to the two available integer execution units, but the floating point
    instruction was not dispatched, even though the floating point execution unit
    was available. This is because the third integer instruction, waiting for one
    of the two execution units to become available, must be issued first. This underutilizes
    the processor''s resources. With out-of-order execution, the first two integer
    instructions and the floating point instruction would be dispatched together.


    In other words, out-of-order execution improves the utilization of the processor''s
    resources. Additionally, because μops are scheduled based on available resources,
    some instruction latencies, such as an expensive load from memory, may be partially
    or completely masked if other work can be scheduled instead.'
