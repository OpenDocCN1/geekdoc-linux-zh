    # 2.2 INTEL® PENTIUM® PRO


    After the Pentium, the Pentium Pro, shown in Figure 2.2, was introduced in 1995.
    The Pentium Pro was the first processor to utilize the new P6 architecture, that
    is, the i686. The P6 architecture introduced a significant number of improvements
    to the first Pentium, and therefore remained a staple of the Pentium lineup, until
    the introduction of the NewBurst architecture with the Pentium 4.


    Whereas the 80486 and first Pentium only contained one memory cache on-die, the
    Pentium Pro added a second, larger but slower, cache which is known as the second
    level cache or L2 cache. Additionally, the introduction of the Physical Address
    Extensions (PAE) increased the amount of usable physical memory from 4-GB to 64-GB.
    The Pentium Pro also brought improvements to the execution pipeline and $\mu ops$,
    and by extending the processor''s width to out-of-order execution and 3-wide superscalar.


