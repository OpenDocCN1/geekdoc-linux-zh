- pgno: 42
  md: '# 1.4 Intel® 80386 and 80387


    The extended general purpose registers are prefixed with a letter E. For instance,
    the 16-bit AX register extends the 32-bit EAX register. The previous register
    names operate on a subset of the corresponding extended registers. For instance,
    the AX register references the least significant word of EAX, and the AH and AL
    registers the two least significant bytes of EAX.


    In Real-Address mode everything continues operating exactly as it had before.
    All instructions in Real-Address mode default to their 16-bit versions. Within
    protected mode, a new bit was added to the segment registers, known as the default
    bit, or D-bit. When this bit is clear, instructions within the code segment default
    to 16-bit mode. When this bit is set, instructions within the code segment default
    to 32-bit mode.


    While this controls the default for a given segment, the mode of an individual
    instruction can override the default size with a special instruction prefix. 0x66,
    known as the Operand-size override prefix. By using this prefix, it is possible
    to execute 16-bit instructions in 32-bit Protected Virtual-Address mode, and to
    execute 32-bit instructions in 16-bit Real-Address mode.


    Aside from adding this instruction prefix, the 80386 also extends the machine
    code format. These additions include support for 32-bit immediates, 32- displacements,
    and a new addressing format. Mentioned in Section 1.1.4, there were previously
    restrictions on how memory operands could addressed. These restrictions limited
