- pgno: 37
  md: '# 20 CHAPTER 1 Early Intel® Architecture


    A stack was chosen for the registers as it is intuitive for mathematical operations,
    like RPN, and accommodates one operand instructions. Using the FXCH instruction,
    two stack registers can be swapped, and thus the stack registers could be utilized
    in a fashion that flats registers (Kahan, 1990).


    Aside from the registers, the 8087 had a 16-bit status register, a 16-bit tag
    register. The status register for the FPU is similar to the EFLAGS register for
    the CPU. The first 6 bits correspond to the IEEE 754 exceptions that can be raised
    during a computation, plus an additional bit to indicate a denormalized operand.
    Additional entries include 3 bits dedicated to the index of the current register
    at the top of the stack, 4 bits for expressing condition codes, and similar to
    the flags in EFLAGS that are used for comparisons and branches, and a bit representing
    an interrupt request. The tag register, with 2 bits per register, stores the status
    of the stack register. Each register can be marked as either having a valid entry,
    an entry of zero, a special reserved number, or being empty. The control register
    allows for masking and unmasking of exception interrupts, as well as control of
    the rounding mode and precision mode.


    Similar to the parallel architecture of the 8086, the 8087 is also divided into
    two components. The first component, the control unit (CU), is responsible for
    handling instructions and memory operations, and synchronizes with the main processor,
    and thus mirrors the BIU of the 8086. The second component, the numeric execution
    unit (NEU), is responsible for performing actual computations, and thus mirrors
    the EU of the 8086. While the floating point unit (FPU), the 8087, was executing
    a floating point instruction, the CPU was free to execute general purpose instructions,
    providing parallelism to improve performance.


    The 8087 and subsequent coprocessors remained separate chips until the 8048 processor,
    which features MMX technology, SSE, and Vector Extensions (Intel® AVX), which
    are also capable of floating point operations, the x87 FPU is still heavily utilized
    in areas where additional precision is needed.


