    \ should focus, and also for the comparison of multiple implementations.\n\nAs\
    \ mentioned in Section 5.2.2, each counter value represents one member of a sample\
    \ that estimates the infinite population. As the number of samples increases,\
    \ the more accurate the sample becomes. To accommodate this, perf stat supports\
    \ a -repeat command line argument, which causes the measurement to be performed\
    \ N times, with the average and standard deviation reported.\n\nIf no events are\
    \ specified, the default events, including the \"task-clock,\" \"wall-clock,\"\
    \ and the number of \"context-switches,\" \"migrations,\" \"page-faults,\" \"\
    cycles,\" \"stalled-cycles-frontend,\" \"stalled-cycles-backend,\" \"instructions,\"\
    \ \"branches,\" and \"branch-misses,\" are chosen.\n\nFor instance, to calculate\
    \ the CPI, instructions for compressing a Linux tarball with gzip, at the default\
    \ compression ratio:\n\n```\n$ perf stat -repeat 20 -e \"cycles,instructions:u\"\
    \ gzip -c \\\n /dev/shm/linux-3.15.tar /dev/null\n```\n\nPerformance counter stats\
