  md: "# CHAPTER 4 Performance Workflow\n\nWhile it may be tempting to display a lot\
    \ of extra data, this can often lead to confusion when others need to interpret\
    \ the results. If the extra data is really useful, consider only printing it in\
    \ a “verbose mode; and keeping the default output clean, simple, and straightforward.\
    \ Remember, these experiments may be run by others, even when you're available\
    \ for clarifications, and decisions might be influenced by the misinterpreted\
    \ results, so always aim to keep things simple and straightforward.\n\nSecond,\
    \ the experiment should be designed to allow others to easily reproduce the problem\
    \ and validate progress. Ideally, this involves stripping out code and dependencies\
    \ that are not relevant to the problem. For instance, if optimizing a client's\
    \ search functionality, there is no point keeping the code to handle the IMAP\
    \ protocol as part of the experiment. Pull out just the necessary search code\
    \ and write a separate program to benchmark that algorithm on a fixed workload.\n\
    \nThird, the experiment should aim to reduce unnecessary variables that could\
    \ affect performance or variance. Chapter 5 covers how to reduce common variables\
    \ such as disk and network I/O costs, and other variables, have the potential\
    \ to increase variance and therefore lead to misleading results. Remember, the\
    \ goal is to clearly show the performance in a reproducible way. By reducing variables,\
    \ time is saved that would otherwise be spent debugging disparities between different\
    \ hardware and software configurations.\n\nThe author imagines that some readers\
    \ are wondering how these variables can be removed; after all, aren't they part\
    \ of the code's performance characteristics? The answer to this question lies\
    \ in what aspect of the system is being measured and optimized.\n\nFor example,\
    \ a comparison of the throughput of two algorithms $A_\\alpha$ and $A_\beta$ for\
    \ a given CPU. Assuming that fetching data from memory, algorithm $A_\\alpha$\
    \ achieves a throughput of 2500 MB/s, while algorithm $A_\beta$ achieves a throughput\
    \ of 3500 MB/s. Now consider if both algorithms are required to fetch data from\
    \ a hard drive that can provide data at least 150 MB/s.\n\nFor a comparison of\
    \ algorithm was capable of the higher throughput, the presence of the disk in\
    \ the experiment would provide misleading results, as both algorithms would have\
    \ a throughput of about 150 MB/s, and thus the I/O bottleneck would mask the performance\
    \ difference. On the other hand, for a comparison of algorithm made the best usage\
    \ of the limited throughput, the disk would be a needed part of the experiment.\n\
    \nFor every test, each component under test needs to be placed in a reproducible\
    \ state, or as close as possible. This needs to be a careful decision, one with\
    \ planning on what reproducible state is, how to enter it, and an understanding\
    \ of the potential impact on measuring the result of the tests.\n\nFourth, the\
    \ experiment must accurately represent the actual performance characteristics.\
    \ This is something to be especially critical when writing microbenchmarks, because\
    \ subtle differences in cache state, branch prediction history, and so on, can\
