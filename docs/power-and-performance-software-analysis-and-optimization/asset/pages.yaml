- pgno: 123
  md: '# CHAPTER 6 Introduction to Profiling


    and performing profiling serve to slowly reveal this form via observation. Just
    like collecting samples, profiling may require correlating multiple data points
    in order to obtain an accurate picture.


    These data points are collected through monitors. A monitor is a tool that measures
    transitions between system states. Monitors can vary significantly in level of
    complexity. For instance, a simple monitor might instrument an application with
    counter variables in order to determine the number of times a function is called.
    On the other hand, a complex monitor might statistically sample events occurring
    in multiple processes running on model tracers.


    In order to empower monitors with deep visibility into processor behavior, Intel®
    processors support dedicated hardware for monitoring performance events. This
    hardware is known as the Performance Monitoring Unit (PMU). The next section focuses
    on the fundamentals of leveraging the PMU. This provides the necessary basics
    for using and interpreting the performance metrics that leverage the PMU, such
    as Intel® VTune™ Amplifier XE, Chapter 7, and, Chapter 8. Finally, the last section
    explains how the PMU can be used for isolating performance problems.


    # 6.1 PMU


    As mentioned earlier, modern hardware platforms are far too complex for developers
    to accurately estimate how their code will execute. Performance counters serve
    to eliminate guesswork, providing engineers with a method for querying low-level
    processor metrics in order to identify performance issues.


    To expose this functionality, each core has its own dedicated PMU, for collecting
    data local to that core. Additionally, an uncore PMU, for collecting data resources
    shared between the cores, may be available.


    The low-level processors exposed through the PMU are referred to as events. Events
    can be categorized as either architectural or nonarchitectural. Architectural
    events maintain consistent behavior between processor generations. On the other
    hand, nonarchitectural events are specific to a microarchitecture, and therefore
    their behavior can change between processor generations. A full list of events,
    both architectural and nonarchitectural, can be found in Volume 3, Chapter 19
    of the Intel® Software Developer Manual (SDM). When looking up nonarchitectural
    events, make sure to only use events listed in the tables corresponding to the
    correct processor generation.


    Some events are suffixed with .CORE or .THREAD. The distinction between these
    suffixes is that events ending with .THREAD count at the hardware granularity,
    that is, by logical core. On the other hand, events ending with .CORE count at
    the physical core granularity, including one or more hardware threads.


    While architectural events are guaranteed to have consistent behavior between
    microarchitectures, that does not mean that all processors will support all of
    the predefined events supported by the current processor can be enumerated with
    CPUID, specifically the Architectural Performance Monitoring'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# 6.1 PMU 107


    Leaf, EAX = 0x0A. In this leaf, each bit in the EBX register corresponds to a
    specific architectural event. If that bit is set, the respective architectural
    event is not supported. Bits 24 through 31 of the EAX register contains the number
    of nonreserved bits in EBX, that is, that are valid to check.


    The collection methodology for both event types can be categorized as either counting
    or sampling. The first method, counting, simply measures how many times the event
    occurs. As shown in Section 6.1.2, this is especially useful for calculating ratios
    and metrics help identify what events are responsible for performance degradation.
    The second method, sampling, only measures some of the total events, that is,
    a sample, but focuses on correlating events with other information that helps
    identify what instructions are responsible for generating them.


    # 6.1.1 EVENT COUNTERS


    In Linux, most of performance counters will not directly program the event counters.
    Instead, must use the kernel''s performance event counter interface or the Intel
    VTune interface. However, as performance counters are uncomfortable by nature,
    the design of these interfaces must be flexible enough to allow for advanced microarchitecture-specific
    usages. As result of this tightly coupled nature between the interface and hardware,
    an understanding of the formats and techniques for utilizing the PMU will aid
    in advanced profiling. As an example, the format used for configuring the event
    counters is the same format expected by the perf counter''s interface for handling
    raw events.


    There are two types of event counters, fixed-function and programmable. Both of
    these types are controlled via a series of MSRs, although their formats are slightly
    different.


    Each fixed-function counter is reserved for a specific architectural event. The
    number of counters per core can be enumerated with CPUID, specifically the Architectural
    Performance Monitoring Leaf. The bits 0 through 4 of the EDX register in this
    leaf contains the number of fixed-function counters. The bits 5 through 12 contain
    the width of the counter.


    At the time of this writing, there are three fixed-function counters. The first
    counter, IA32_FIXED_CTR0, records the number of instructions retired. The second
    counter, IA32_FIXED_CTR1, records the number of unhalted core cycles. The third
    counter, IA32_FIXED_CTR2, records the number of unhalted reference cycles.


    Unlike the fixed-function counters, which only measure one event each, programmable
    counters can select from a large number of different events. Events are identified
    through an event number and unit mask (um). The event number chooses the logic
    unit that performs the actual counting. The unit mask configures the conditions
    that are counted. For instance, an event number of 0x3C selects the logic unit
    to count core cycles, whereas specifying an umask of 1 instructs the logic unit
    to count reference cycles.'
