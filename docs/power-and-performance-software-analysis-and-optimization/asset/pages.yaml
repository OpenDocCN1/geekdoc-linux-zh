  md: '# CHAPTER 5 Designing Experiments


    # 5.1 CHOOSING A METRIC


    In Chapter 4, the importance of measurement was highlighted throughout the workflow.
    In the early stages, measures such as defining the problem, the focus rests on
    choosing the proper measure of performance. These measures are referred to as
    metrics.


    Many different metrics exist, but there are two popular categories for performance
    metrics, either metrics that measure the cost of performing an operation or metrics
    that measure how often that operation occur during a given interval. In the first
    category, when measuring time, are often referred to as measuring latency. In
    the second category they are often referred to as measuring throughput.


    To illustrate this point, consider two metrics for graphics rendering performance,
    time and frame rate. Since the time metric measures the cost, in time, of performing
    one operation, rendering a frame, it would fall into the first category. Since
    the frame rate, measured in frames per second, how many operations, frame renders,
    can occur for a given interval, one second, it would fall into the second.


    When selecting a metric, it is important to choose a metric at an appropriate
    level of detail, which is dictated by the component being measured. For example,
    when comparing the performance of two algorithms for a CPU pipeline, clock cycles
    is an appropriate level of detail. The other hand, when comparing graphics rendering
    performance, clock cycles would probably be too low-level of a detail.


    All metrics fall into one of three categories in terms of their interpretation,
    higher is better (HIB), lower is better (LIB), or nominal is better (NIB). As
    the reader might expect, when comparing two measurements for an HIB metric, the
    higher value is the better performing. HIB and LIB metrics are far more common
    than NIB metrics, which neither too high of a value nor low of a value is ideal.


    # 5.2 DEALING WITH EXTERNAL VARIABLES


    As mentioned in Section 4.4, it is important when benchmarking to reduce exposure
    to external variables that can impact performance. When designing an experiment,
    there are two types of external variables to consider, the controllable and the
    uncontrollable.


    # 5.2.1 CONTROLLABLE EXTERNAL VARIABLES


    Controllable external variables are simply variables whose effects can be completely
    mitigated, and thus won''t affect performance measurements. The effects of some
    variables can be discarded by controlling data collection begins and ends. Other
    effects require engineering small controlled scenarios, referred to as microbenchmarks.


    For example, consider how to accurately measure the time required for a web browser
    to render an HTML page. First, let''s define our operation, “rendering an HTML
    page,” to include parsing an HTML file into the necessary internal data'
