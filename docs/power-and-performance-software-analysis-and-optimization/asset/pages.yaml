  md: '# 8.2 Perf tool 159


    The events described in Section 8.2.1, excluding PERF_TYPE_RAW, fall into the
    category of "cooked" events. A full list of these events, and how they should
    be expressed on the command line, can be obtained with perf list.


    Events not contained in that list, that is, "raw" events, can be used with the
    format "r<config number>". Where the config number is the hexadecimal representation
    of the MSR register described in Section 6.1. For most cases, this will simply
    be "r<umask value><event value>". For instance, given that the architectural event
    for Unhalted Core Cycles is, the "cooked" cycles has an Event Number of 0x3C and
    a Umask value of 0:00:


    ```

    $ perf stat -e cycles -e r03c ls > /dev/null

    ```


    Performance counter stats for ''ls'':


    | 3,165,711 cycles | 0.000 GHz |

    | 3,165,705 r03c | |


    0.002415953 times elapsed


    Those are the only required fields most of the time because event modifiers have
    a special syntax. These are expressed by appending a colon to the end of the event
    they modify, and then a list of modifiers. Table 8.7 lists the available modifiers.
    Modifiers can be applied to either "cooked" or "raw" events. Consider:


    ```

    $ perf stat -e cycles:u -e cycles:k -e r03c:uk ls > /dev/null

    ```


    Performance counter stats for ''ls'':


    | 555,892 cycles:u | 0.000 GHz |

    | 2,611,126 cycles:k | 0.000 GHz |

    | 3,165,403 r03c:uk | |


    0.002384599 times elapsed


    When sampling, the "p" and "pp" modifiers help leverage PEBS to reduce skid.


    # Table 8.7 Perf Event Modifiers

    (Zijstra et al., 2014)


    | Value | Meaning |

    | u | Restrict events to userspace |

    | k | Restrict events to kernelspace |

    | h | Restrict events to hypervisor |

    | G | Restrict events to Guest |

    | H | Restrict events to Host |

    | p | Constant skid for SAMPLE_IP |

    | pp | Request 0 skid for SAMPLE_IP |

    | D | Events pinned to PMU |'
