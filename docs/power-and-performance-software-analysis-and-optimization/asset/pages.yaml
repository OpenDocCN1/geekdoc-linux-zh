- pgno: 63
  md: '# CHAPTER 3 Intel® Core™ Processors


    User space applications do not need to worry about explicitly controlling the
    P state unless specifically wanted to. Within the Linux kernel, the CPU frequency
    scaling driver, CONFIG_CPU_FREQ, has traditionally been responsible for controlling
    the system''s P state transitions. This driver supports multiple governors for
    controlling the desired management policy. At the time of this writing, there
    are five governors:


    +   1. Performance (CONFIG_CPU_FREQ_GOV_PERFORMANCE)

    2. Powersave (CONFIG_CPU_FREQ_GOV_POWERSAVE)

    3. Userspace (CONFIG_CPU_FREQ_GOV_USERSPACE)

    4. Ondemand (CONFIG_CPU_FREQ_GOV_ONDEMAND)

    5. Conservative (CONFIG_CPU_FREQ_GOV_CONSERVATIVE)


    The performance governor maintains the highest processor available. The powersave
    governor defers the policy to user space, allowing for an application or daemon
    to manually set the frequency. The ondemand governor monitors the processor utilization
    and adjusts the frequency accordingly. Finally, the conservative governor is similar
    to the ondemand governor but additionally attempts to avoid frequent state changes.
    Due to the concept of race-to-idle, as introduced in the Introduction chapter,
    the ondemand governor has typically provided the best power savings on Intel Architectures.


    One of the challenges with this driver has been tuning the algorithm for specific
    hardware generations. In order to remedy this, a new and more efficient P state
    driver, the Intel® P state driver, was written by Dirk Brandewe. Unlike the previous
    driver, this one checks the processor generation and tunes accordingly.


    The current frequency driver can be determined by checking the /sys/devices/system/cpu/
    directory. If the cpufreq driver is active, a cpufreq directory will be present,
    whereas if the Intel P state driver is active, an intel_pstate directory will
    be present. Within these sysfs directories are the tunables exposed to user space
    by these drivers.


    # C states


    While the core''s frequency reduces power consumption, dropping the frequency
    to zero provides greater savings. C states are the results of the observation
    that the processor cores in client systems idle most of the time. Therefore, running
    the core at its lowest possible frequency is better than running it at its highest,
    it''s even better to simply turn it off.


    The ACPI specification also defines the concept of processor power states. As
    of the latest ACPI specification, the states are defined as:


    +   C0 "While the processor is in this state, it executes instructions" (Unified
    EFI, Inc., 2014).

    C1 "This processor power state has the lowest latency. The hardware latency in
    this state must be low enough that the operating software does not consider'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# 3.1 Intel® Pentium® M 47


    latency aspect of the state when deciding whether to use it. Aside from putting
    the processor in a non-executing power state, this state has no other software-visible
    effects” (Unified EFI, Inc., 2014).


    C2 “The C2 state offsets improved power savings over the c1 state. The worst-case
    latency for this state is provided via the ACPI system firmware and the operating
    software can use this information to determine when the c1 state should be used
    instead of the c2 state. Aside from putting the processor in a non-executing power
    state, this state has no other software-visible effects” (Unified EFI, Inc., 2014).


    C3 “The C3 state offsets improved power savings over the c1 and c2 states. The
    worst-case hardware latency for this state is provided via the ACPI system firmware
    and the operating system can use this information to determine when the c2 state
    should be used instead of the c3 state. While in the c3 state, the processor’s
    caches maintain but ignore any snoops. The operating system is responsible for
    ensuring that the caches maintain coherency” (Unified EFI, Inc., 2014).


    Notice that to P states, a lower C number corresponds to higher power consumption,
    while a higher C state corresponds to lower power consumption. While only four
    C states are defined in the specification, processors are capable of supporting
    deep sleep states, such as C6 and C7. Also notice that each sleep state has an
    entrance and exit latency, which is provided to the operating system through an
    ACPI table.


    With each P state, the core is constantly executing instructions. On the other
    hand, with C states, once the core exits c0, it is halted, that is, it completely
    stops executing instructions. As a result, a core’s P state is only valid when
    the core is in c0. Otherwise, the frequency is almost zero.


    When all of the processor’s cores are in the same, or deeper, sleep states, additional
    resources can also be powered off, providing even greater savings. The processor-wide
    states are referred to as package C states, since they are a C state for the entire
    processor package.


    Similar to P states, user space applications do not need to worry about C states,
    as this is handled by the kernel. The Linux kernel has a generic ACPI driver and
    also a native Intel® Idle driver, CONFIG_IDLE, specifically designed and tuned
    for Intel® processors. One of the advantages of the Intel driver is that it includes
    the entrance and exit latencies for each C state for each supported hardware generation.
    This is especially beneficial for users whose firmware provides an incorrect or
    incomplete ACPI table for C states, since the driver will default to using the
    correct values.


    As deep sleep states are entered, additional resources are powered down when the
    core enters the C state and must be powered up when the core exits the C state.
    In other words, the lower C states provide smaller power savings, but are quicker
    to enter and exit, while the deeper C states provide more power savings, but are
    slower to enter and exit. As a result, when selecting a C state, the kernel considers'
