    A segmented address, referred to as a logical address, is comprised of two

    components, a segment selector and an offset. The segment selector takes the form
    of

    a segment register. The offset is a 16-bit pointer, which represents the displacement

    of address from the segment''s base address. Since the 16-bit offset is unsigned,
    an

    overflow or underflow results in a wrap around effect within the segment. Therefore,

    t offset can be considered modulo the segment.


    For the 8086, there are four segments: (0) the code segment, described by the

    CS segment selector register, (1) the stack segment, described by the SS segment

    register, (2) the data segment, described by the DS segment register, and (3)
    the extra

    data segment, described by the ES segment register. Some instructions imply the
    usage

    of a specific segment. For instance, instructions that manipulate the stack imply
    the

    stack segment and instruction fetches imply the code segment. In other cases,
    the

    segment register will need to be explicitly provided, or the default segment register

    will be overridden.


    The EU only handles logical addresses, with address translation from logical

    to physical being handled by the BIU. In order to translate a logical address
    into a 20-

    physical address, the segment register is shifted left by 4 bits, which is

    equivalent to multiplying by 16, and then added to the offset.


    # 1.1.2 REGISTERS


    Aside from the four segment registers introduced in the previous section, the
    8086

    has seven general purpose registers, and two status registers.


    The general purpose registers are divided into two categories. Four registers,
    AX,

    BX, CX, and DX, are classified as data registers. These data registers are accessible

    as either the full 16-bit register, represented with the X suffix, the low byte
    of

    the 16-bit register, designated with an L suffix, or the high byte of the 16-bit

    register, delineated with an H suffix. For For, AX would access the full 16

    register, whereas AL and AH would access the register''s low and high bytes,

    respectively.


    The second classification of registers is the pointer/index registers. This includes

    the following registers: SP, BP, SI, and DI. The SP register, the stack pointer,

    is reserved for usage as a pointer to the top of the stack. The SI and DI registers

    are typically used implicitly as the source and destination pointers, respectively.

    Unlike the data registers, the pointer/index registers are only accessible as
    full 16-bit

    registers.


    As this categorization may indicate, the general purpose registers come with

    some guidance for their intended usage. This guidance is reflected in the instruction

    forms with implicit operands. Instructions with implicit operands, it operands

    are assumed to be at a certain register and therefore don''t require that operand

    to be encoded, allow shorter encodings for common uses. For convenience,

    instructions with implicit forms typically also have explicit forms, which require
    more

