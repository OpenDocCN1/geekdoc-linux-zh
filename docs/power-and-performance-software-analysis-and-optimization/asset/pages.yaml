    It may be enlightening to decompose the $\mu_{op}$ delivery by its source. Use
    Equations 6.3(a)-6.3(c) to determine the percentage of $\mu_{ops}$ delivered from
    the DSB, MITE, and Microcode Sequencer, respectively. The Microcode Sequencer
    is used to handle special instructions and situations, which the MITE is unable
    to handle, that is, it is a software fallback for functionality that isn''t implemented
    in hardware. As a result, the Microcode Sequencer is capable of generating a large
    number of $\mu_{ops}$.


    When interpreting these metrics, a low percentage of delivery from the Microcode
    Sequencer and a high percentage of delivery from the Decoded Iache is desirable.
    The Microcode Sequencer is required for delivering certain instructions, so what
    instructions is responsible, and to avoid them. Each microarchitecture has a series
    of hardware limitations for the Decoded Icache, so a low percentage of DSB delivery
    may indicate less than optimal code organization that is triggering one or more
    of these limitations.


    Another metric to consider is the percentage of Icache misses, as shown in Equation
    6.3(d). Even a small percentage of Icache misses can have serious repercussions
    for performance. Typically, Icache misses are the result of bloated code size
    or branch mispredictions. Common culprits for bloated code size include exclusive
    loop unrolling, function inlining, and other optimizations that attempt to trade
    code size for speed.'
