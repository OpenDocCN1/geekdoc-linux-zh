  md: '# CHAPTER 15 Exploiting Parallelism


    line causes no extra penalty; however, by definition, there is no guarantee that
    an unaligned address does not stride cache lines. In this situation, where two
    lines are needed to satisfy the load or store, the processor needs to internally
    perform two aligned loads and then splice the result together, resulting in the
    extra penalty. This can lead to misleading microbenchmarks.


    As a result, any data is being loaded or stored from a SIMD register, the resulting
    memory should be explicitly aligned, either through the C11 `alignas()` macro,
    the POSIX `posix_memalign()` function, the compiler attribute, or manually. When
    aligning both the source and destination are not possible, favor alignment. For
    more information about specifying data alignment, Section 12.4.3 in Chapter 12.


    On newer microarchitectures, once the data is aligned, the selection of an aligned
    or unaligned instruction doesn''t matter. As a result, the author tends to prefer
    using the unaligned instructions, since they provide identical performance as
    the aligned instructions, i.e., also provide safety in the case of an unaligned
    operand, the program won''t crash. The reader may be wondering how an unaligned
    operand could occur if the data was explicitly aligned; however, this does occasionally
    happen with compiler variable attributes. The author has experience with compilers
    completely ignoring a variable''s attribute, resulting in a fault (Cryil, 2012).


    # Handling unknown alignment


    In many situations, the programmer will be unable to guarantee the alignment of
    an unaligned address at complete time. Since the additional overhead of performing
    unaligned loads can be significant enough to negate any performance benefits from
    vectorization, it may be beneficial to use a hybrid approach consisting of both
    vectorized and nonvectorized implementations. In this approach, the nonvectorized
    implementation of the algorithm is used to "single-step" until an aligned address
    is found. For an alignment of $n$, any address is either a multiple of $n$ and
    meets the requirement, or is anywhere from 1 to $n-1$ bytes away from the next
    aligned address. This technique relies on the nonvectorized code incrementing
    the address in a manner that is aligned. Once the aligned address is reached,
    the vectorized code can be utilized.


    Assuming that the desired alignment is a power of two, which is a safe assumption
    for Intel processors, checking for alignment can be performed quickly with a logical
    instruction. This takes advantage of the property of an integer''s binary representation,
    where a power of two is represented by a single bit, and a power of two minus
    one is represented as every bit prior to the power of two''s bit set. For example,
    16 is represented as $10000_2$ and 15 is represented as $01111_2$. Using this
    knowledge, checking whether a number is a multiple of a power of two is as simple
    as checking whether any of the bits below the power of two''s corresponding bit
    set.


    Consider the following example, where this hybrid approach is used to combine
    byte-by-byte nonvectorized and SSE vectorized implementation.'
