  md: '# CHAPTER 16 Special Instructions


    Before the introduction of these dedicated AES instructions, the standard technique
    for AES performance was via a lookup table. This approach has been shown to be
    susceptible in practice, not just in theory, side-channel attacks. Rather than
    exploiting a weakness in the cryptographic algorithm, side-channel attacks instead
    focus on accidental data leakage as a result of the implementation. In the case
    of AES lookup table implementation, the side-channel attack performs cache-timing
    to sample what cache lines are accessed by the AES implementation. Eventually
    enough samples are collected to reveal the key used in the encryption or decryption
    process. As a result, not only the AES-NI instructions improve performance, but
    they also provide additional security against these types of attacks.


    # 1.6.1 FURTHER READING


    +   1. http://www.intel.com/content/www/us/en/architecture-and-technology/advanced-encryption-standard--aes/data-protection-aes-general-technology.html


