    # 16.2 PCLMUL-PACKED CARRY-LESS MULTIPLICATION


    Introduced in the AES-NI extensions first available in the Intel® Westmere generation,
    the PCLMUL instruction performs carry-less multiplication of two 64-bit integers
    stored in SIMD registers, storing their product as a 128-bit integer. The name
    implies carry-less multiplication but ignores any carry that would normally propagate
    to the next place. Carry-less multiplication is one of the steps for performing
    multiplication in the Galois Field. PCLMUL instruction was added with the AES-NI
    extension in order to accelerate the Galois Counter Mode (GCM) of AES. Another
    common use of PCLMUL is to accelerate the CRC calculation for arbitrary polynomials.


    Since each 128-bit SSE register is capable of holding two 64-bit values, the first
    operand, in AT&T syntax, is an 8-bit immediate that encodes which of the two packed
    quad words should be used in the second and third operands. The first bit of the
    lower nibble of this immediate represents the location in the third operand, which
    will be used as both a multiplier source and as the final destination for the
    product. The first bit of the higher nibble is, the fifth bit of the byte, represents
    the second operand. A value of zero in either of these bits encodes the low packed
    quad word, while a value of one encodes the high packed quad word. Aside from
