- pgno: 34
  md: '# 1.2 Intel® 8087 17


    In order to accomplish this, Intel worked closely with the IEEE committee responsible
    for developing a standardized format for binary floating point arithmetic, the
    IEEE 754 standard. This standard, along with the international IEEE 559:1989 standard,
    which is identical in content, defines the floating point format and arithmetic
    behavior, as well as the minimum precision and environment required for a compliant
    implementation. The original IEEE 754 format was finalized in 1985 and remained
    unchanged for twenty-three years, until the standard extended in 2008. The 2008
    revision to the standard remained most of the 1985 standard, and thus its content,
    along with the design of the 8087, still govern the format and behavior of floating
    point computations today, as of 2014. It is important to note that, despite the
    fact that the standard did much to improve the situation of floating point portability
    and consistency, the standard does not guarantee that different systems produce
    identical results.


    Because the full 754 standard wasn''t finalized until 1985, and the 8087 was released
    in 1980, the 8087 didnt technically implement the full standard. Despite this,
    the 8087 implemented the current draft at the time of its release and both the
    hardware and Intel played an important role in the development of that. Notably,
    William Kahn, who was on the IEEE committee and is an expert in numerical analysis,
    was contracted by Intel to help design 8087. The author recommends the reader
    visit Dr. Kahn''s faculty at Berkeley, located at http://www.eeks.berkeley.edu/~wkahan/,
    and read some of his publications on the rationale and history behind the standard,
    and on accuracy and analysis in floating point computations.


    Unlike an unsigned 16-bit integer, which only allows for the representation of
    whole numbers between $[0,2^{16})$ or $[-2^{15},2^{15}-1]$ respectively, floating
    point allows for representation of large and small numbers beyond the integer
    limits. As the name implies, floating point utilizes scientific notation, which
    decomposes a number into a significand and a signed exponent. For example, the
    number 0.0005 would be represented as $5.0 \times 10^{-4}$.


    However, scientific notation introduces a problem, where the same number can be
    represented in multiple ways. $5000.0 \times 10^3$, $500.0 \times 10^4$ are all
    the same number. Obviously, this could be problematic when comparing two floating
    point numbers. In order to remedy this, floating point requires that the scientific
    format is normalized. A normalized scientific notation has only one single non-zero
    digit before the decimal point. In the previous example, $5.0 \times 10^{-3}$
    would be the normalized format.


    Up to this point, all of the previous examples of scientific notation have been
    in base 10, hence the $\times10$ component, however, all floating point numbers
    assume a base of 2. In order to encode a fraction in the significand in binary,
    each bit,$n$ represents $2^{-n}$. Because of the normalized binary format, it
    is unnecessary to physically represent the leading bit of the significand. Therefore,
    this bit is implied and an extra bit of precision is gained. The exception to
    this case, 0, is handled with a reserved exponent of 0.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# CHAPTER 1 Early Intel® Architecture


    Formats, precision, and environment


    The IEEE 754 standard defines four floating point types: basic single, basic double,
    extended single, and extended double. Compliance to the standard requires at least
    one bit. The single type, corresponding to the float C type, is 32 bits, reserving
    24 bits, 23 physical bits plus the implied leading bit, for the sign and 8 bits
    for the exponent. The double type, corresponding to the double C type, is 64 bits,
    providing 53 bits, 52 physical bits plus the implied leading bit, for the significand
    and 11 bits for the format. The MSB of each format is the sign bit for the significand.


    For the extended types, the standard provides only the minimum length requirements.
    The extended single type is required to be at least 43 bits, with at least 32
    bits for the significand and 11 bits for the exponent. The extended double type,
    corresponding to the long double C type, is required to be at 79 bits, with at
    least 64 bits for the significand and 15 bits for the exponent. The encoding for
    the extended types is designed to be implementation-dependent.


    One of the goals of the IEEE 754 format was to enable fast floating point sorting
    that could be performed by the regular integer ALU. One challenge to achieve this
    goal was how to handle the exponent component, since with a two''s complement
    encoding logic would be needed to compare numbers on their sign. In order to remedy
    this, a bias was introduced to the exponent component. A bias is simply an offset,
    and the exponent ensures that the smallest possible value is expressed as zeros,
    while the largest exponent is expressed as all ones. Because the bias is directly
    related to the number of elements that can be encoded, and therefore the number
    of bits in the representation, the bias varies with regards to the type. The standard
    defines the bias of a single basic type to be 127 and a double basic type to be
    1023. Typically, the notation used for differentiating between biased and unbiased
    exponents is e, respectively.


    The largest and smallest exponents, all ones and all zeros, are reserved for encoding
    special numbers. The largest exponent, e = 255 for floats and e = 2047 for doubles,
    is reserved for the encoding of infinity, both positive and negative according
    to the sign bit, and NaN, which is Not A Number. Infinity is represented by a
    nonzero significand while NaN is represented by a zero significand. NaN represent
    invalid operations and are designed to allow for errors to propagate, which may
    be acceptable in some situations, as opposed to early termination of the computation
    with an exception. To accommodate both cases, there are two types of NaNs: signaling
    and quiet, with the difference being that NaN generates an exception.


    The smallest exponent, e = 0, is reserved for representing values for which the
    implicit bit in the significand does not apply. The obvious case for this is represented
    by a zero exponent and a zero significand. As mentioned previously, floating point
    numbers are normalized; however, a special case exists for numbers too small for
    the standard format. These types of numbers are known as denormals, and are represented
    with e = 0, and the significand set to the relevant fraction.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# 1.2 Intel® 8087 19


    In order to promote consistency in computations, the IEEE 754 standard also specifies
    four user-selectable rounding modes:


    +   **Round to Nearest** The default rounding mode. As the name suggests, rounds
    to the closest representable number in the destination''s format.

    **Round to Zero** Always round toward zero.

    **Round to Negative Infinity** Always round down toward negative infinity.

    **Round to Positive Infinity** Always round up toward positive infinity.


    In the case of certain conditions, floating point exceptions can be signaled through
    the setting of a status flag or with the generation of a status that invokes a
    trap handler. There are five defined exceptions:


    +   **Invalid Operation** Raised when the requested computation cannot be performed.
    If no trap handler is specified, the result is a NaN.

    **Division by Zero** If no trap handler is specified, the result is infinity.

    **Overflow** If no trap handler is specified, the result is rounded based on the
    current rounding mode.

    **Underflow** Same behavior as overflow

    **Inexact** Raised when the rounding of a result is unable to be precisely represented
    in an overflow.


    # C99 support


    Extended support for the functionality described in this section is available
    in the C programming language, as of the C99 language revision. For a full reference,
    see *Annex F* of the C99 specification, along with section 5.2.4.2.2, which describes
    the characteristics of the format, and section 7.6, which describes access to
    the floating point environment. Another useful reference is the contents and pages
    of the `fenv.h`, `float.h`, and `math.h` header files.


    # 1.2.2 X87 FLOATING POINT


    Unlike the 8086, the 8087 exposes its registers as a stack, instead of flat registers.
    Each of these eight registers is 80 bits in length, and each value is internally
    stored and computed in a double extended format. Values from memory, or the 8086''s
    registers, are converted from integers, floats, and doubles into this 80-bit format
    when they pushed onto the stack. Computations are then performed with values from
    the stack or memory locations. Unlike a traditional stack, each register is also
    directly addressable by a register relative to the top of the stack. The top of
    the stack is designated as the *ST* or ST(0). Subsequent registers are designated
    with an offset from the top, such as `ST(1)`, `ST(2)`, and so on.


    Usage of a stack makes the FPU operate much like a Reverse Polish Notation calculator.
    For example, in order to add two numbers, both could be pushed onto the stack
    before executing a `FADD` instruction. This instruction will pop numbers off the
    stack, perform the addition operation and push the result onto the stack.'
