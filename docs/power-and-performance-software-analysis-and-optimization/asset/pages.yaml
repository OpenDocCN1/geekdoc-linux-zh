    # 2.3.2 MULTI-CORE


    Until this point, the main granularity of hardware parallelism was the processor
    die. For better parallel performance, multiple processors are installed into special
    motherboards that contain multiple processor sockets. With this configuration,
    all of the processors can either share the same memory, or each processor socket
    can be configured to have its own set of memory DIMM slots. In the case where
    each processor has a separate set of DIMMs installed, for a given processor, memory
    installed in that socket''s corresponding DIMM slots are known as *local memory*.
    On the other hand, all of the memory is known as *nonlocal memory* or *remote
    memory*. Memory that is local to a specific processor provides the fastest accesses,
    while remote memory provides slower accesses, due to the distance between the
    processor and remote memory. Because of this disparity between the performance
    of local and remote memory, this is referred to as a Non-Uniform Memory Access
    (NUMA) configuration.


    In order to utilize these expensive hardware resources, the operating system needs
    to be aware of the system topology. For example, without this knowledge, the kernel
    might inadvertently allocate memory on the remote memory while the fast local
    memory is still available. In Linux, the kernel is configured for NUMA configurations
    by grouping memory resources into zones. These zones control which regions of
    memory are given priority, and for customization of different memory policies.


    While multiprocessor configurations provide the best performance, and are still
    popular in the server and workstation segments, these configurations tend to be
    expensive and require extensive tuning.


    In order to provide better parallel performance than a single processor, without
    requiring an expensive multiprocessor configuration, as of the Pentium 4 models
    duplicated the execution resources into multiple processor cores. Each core operates
    as a separate logical processor contained within the package.


    Within a multi-core processor''s die, resources are divided into two categories:
    core and uncore resources. Core resources are duplicated for each logical processor.
    On the other hand, *uncore* resources are shared between all of the cores on that
    processor die. As one would expect, there are tradeoffs in performance between
    parallel and serial workloads for designing resources to be either core or uncore.'
