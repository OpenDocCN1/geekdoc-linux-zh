- pgno: 229
  md: '# 212 CHAPTER 12 Toolchain Primer


    the leading dot in their name. Developers are free to define their own custom
    sections.

    A sampling of some common sections and their usage is described below:


    +   -text Holds executable instructions.

    -.bss Holds uninitialized, i.e., initialized to zero, data. Since all of the variables
    in the .bss section have a value of zero, the actual zeros aren''t physically
    stored in the file. When the file is loaded, the corresponding memory region is
    zeroed.

    -.data Holds read-only data.

    -.strtab A string containing a NULL-terminated string of any symbol or section
    name. The first and last entries are NULL bytes.

    -.symtab A table containing entries for locating symbols. Includes the symbol
    name, as an index into the .strtab section, the symbol type, the symbol size,
    etc.


    In GAS, the GNU assembler, the current section is selected via the .section pseudo-op.
    Some popular sections can also be selected through their corresponding pseudo-ops,
    e.g., .data, or .text, which switches to the .data or .text sections.

    The second view, the execution view, is comprised of segments. Unlike sections,
    which represent the file layout, segments represent the virtual memory segments
    during execution. These segments are described in the Program Header table, which
    this table consists of the Load Memory Address (LMA) and Virtual Memory Address
    (VMA) for each memory segment, along with other information, such as the alignment
    requirements and size in memory. To accommodate on-demand loading of virtual memory
    segments, the ELF format stipulates that a segment''s virtual address and file
    offset must be congruent modulo the page size.


    # 12.2.1 RELATIONS AND PIC


    One important aspect of building and loading an executable object is the handling
    of external symbols, i.e., symbols exposed in other ELF objects. There are two
    different techniques for dealing with external symbols. The first technique, static
    linking, occurs completely at link time while the second, dynamic linking, occurs
    partially at link time and partially at load time.

    Statically linking an executable resolves all external symbols at link time. To
    accomplish this, the external dependencies are copied from their ELF objects into
    the executable. In other words, the executable includes all of the user space
    code needed for it to run. While this alleviates the need for resolving symbols
    at load time, it comes at the cost of increased executable size, memory usage,
    and update effort.

    The increased executable size is caused by the inclusion of the program''s dependencies.
    For instance, if an executable relies on functions from the C runtime, as'
