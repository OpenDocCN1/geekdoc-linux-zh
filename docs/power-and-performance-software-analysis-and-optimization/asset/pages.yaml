    # 11.1 GNU Profiler


    The GNU profiler, gprof, provides basic algorithmic analysis capabilities. Unlike
    most of the other monitors in this book, gprof depends on the compiler to instrument
    the executable to be profiled. This extra code, added automatically by the compiler,
    performs the actual data collection and outputs it to a file. The gprof(1) tool
    is then used to translate the collected data in this file into a text-based report.


    Since grep depends on the compiler to insert the necessary profiling code, this
    profiling method relies on compiler support. At the time of this writing, all
    major toolchains support this feature. To use gprof with GCC or LLVM, the code
    must be compiled and linked with the -pg compiler flag. To use gprof with ICC,
    the code must be compiled and linked with the -p compiler flag.


    Once the instrumented executable has been built, run the test workload. When its
    execution completes, the profiling data will be saved into a binary file named
    gmon.out. Multiple runs of the instrumented binary will overwrite this file, each
    time resulting in loss of data from the previous run. In order to combine the
    results of multiple runs without data loss, the data from each run must be summarized
    into a


    191'
