  md: '# 28 CHAPTER 1 Early Intel® Architecture


    translation, known as walking the page tables, occurred for every memory access,
    which would introduce a significant amount of overhead. To prevent this, a cache,
    known as the Translation Lookaside Buffer (TLB), was introduced. Once an address
    translation is completed, the result is stored in the TLB, including the page
    accounting bits. From that point forward, until TLB entry is evicted or invalidated,
    all address translations the relevant page will be satisfied from the TLB, avoiding
    the page table walk. Leveraging locality of data, recent translations are added
    to the TL while translations, the least recently used, are evicted to make room
    for the new entries. When the page table mappings are modified, the corresponding
    TLB entries must be explicitly invalidated to ensure that the new mappings are
    visible.


    Unlike segmentation, which is always enabled, paging must be explicitly enabled
    by software. To activate paging, the PG bit is set in the CR0 control register,
    and the physical address of the top level page table, the directory, is set in
    the CR3 register.


    The Linux kernel splits the linear address space for each process into two address
    ranges, one for the kernel, kernel space, and one for the user process, user space.
    For 32-bit Linux, this split is controlled through the CONFIG_VMSPLIT option,
    which set CONFIG_PAGE_OFFSET to the beginning of kernel space. Therefore, any
    linear address above or equal to CONFIG_PAGE_OFFSET is a kernel address and any
    address below CONFIG_PAGE_OFFSET is a user address. By default, the 4-GB linear
    address space is divided into a 1-GB kernel space and a 3-GB user space range,
    that is, page offset of 0xc0000000. In other words, regardless of how much physical
    memory is used, an application can map 3-GB worth of pages simultaneously.


    While segmentation can''t be disabled, it can be bypassed if it isn''t desired.
    This is achieved by creating and loading flat memory descriptors, where each segment
    begins at the beginning of the address space and is the size of the full address
    space. This means the linear to address translation is a one-to-one mapping, and
    therefore a nop. By default, Linux maintains two groups of segments, one encompasses
    all of kernel space and one encompasses all of user space.


