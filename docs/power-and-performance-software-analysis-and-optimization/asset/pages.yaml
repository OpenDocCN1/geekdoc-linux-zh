  md: 'in one’s methodologies. This chapter outlines a general workflow for performance
    optimizations, designed to help avoid common pitfalls. A flowchart describing
    the progression between steps can be found in Figure 4.1.


    # 4.1 STEP O: DEFINING THE PROBLEM


    As Einstein so eloquently stated, "the mere formulation of a problem is far more
    essential than its solution." While creating an explicit problem statement might
    seem like busy work, it actually has tangible benefits, including helping to keep
    the project scope limited, ensuring that expectations for the work are set appropriately,
    and providing a reminder that the larger picture, that is, the real purpose, of
    the work. In the author’s personal experience, it is very hard for a project to
    succeed without an unambiguous goal and measure of success.


    When defining the goal, for something that is clearly desirable and meaningful.
    Instead of focusing on the technical details or implementation, focus on the impact
    to the end. The benefits of this are twofold. First, the goal can be easily explained
    and justified to a nontechnical individual through the high-level impact. Secondly,
    it helps the project avoid becoming engrossed in the implementation, that the
    bigger picture is lost.


    For example, consider the following goal:


    > To reduce latency in the input stack."


    While this is a worthwhile technical goal, it lacks the relevant motivation as
    to why this task is important. This example could be fixed by expanding on the
    impact:


    > To improve user experience by reducing latency within the input stack in order
    to provide smooth scrolling of the graphical interface."


    Another important aspect of a goal is the definition of success, including how
    it should be measured, on what metric, for what platform. The author considers
    it prudent to specify multiple levels of success, such as an ideal target, an
    acceptable target, and a minimum target. This provides an easy method to grade
    the task’s current progress, provides slack in case of unforeseen difficulties,
    and also prevents the project from dragging for too long.


    For instance, if an engineer is currently working on two projects, one that has
    already reached its acceptable target, and one that has not, its probably safe
    for that engineer to prioritize the project that has not reached its acceptable
    target. This is especially important as performance projects do not always have
    clear stopping points.


    Continuing our earlier example, we might improve the goal to:


    > To improve user experience by reducing latency within the input stack in order
    to provide smooth scrolling of the graphical interface. The latency is noticeable'
