- pgno: 126
  md: '# 6.1 PMU 109


    Note that on modern Intel platforms, there are three fixed-function counters and
    eight programmable event counters; however, these eight programmable counters
    are per-core, and must be shared between hardware threads. In other words, when
    Intel® Hyper-Threading is disabled, and when Hyper-Threading is enabled, each
    hardware thread has access to four of the eight counters. Therefore, most of the
    time seven events can be monitored at any given time, assuming all three fixed-function
    events are desired. This needs to be accounted for when determining which events
    to collect. Due to the limited number of event counters, larger numbers of events
    can only be collected by rotating the enabled counters, and then scaling the results
    to estimate the total counts.


    # 6.1.2 USING EVENT COUNTERS


    As seen in the previous sections, the PMU provides access to a significant number
    of performance events. However, in order to successfully conduct performance analysis,
    these events must be wisely counted. To do so requires focus on key aspects, collecting
    the correct data and interpreting that data. Failure to do either will lead to
    wasted time and effort.


    The first step of microarchitectural performance analysis, assuming that the CPU
    is bound, is to determine what inefficiency or still is impacting performance.
    In order to accomplish this, the Top-Down Hierarchical approach is used to categorize
    productive and unproductive clock cycles. This approach supplies metrics to quantify
    the impact of the architectural features. These metrics are derived from the performance
    counters described above. Since this first step focuses on determining what bottleneck
    is limiting performance, and is less concerned with what code is responsible for
    the bottleneck, this is the time for counting events, rather than sampling.


    Note that these metrics are typically ratios of multiple events. Single event
    counts typically have little meaning in a standalone context. Instead, their usefulness
    comes from their relation to the other collected metrics. For instance, stating
    the number of branches executed during a code sequence does not provide insight.
    On the other hand, stating the number of branches executed in relation to the
    number of correctly predicted branches, or in relation to the total number of
    instructions executed, provides insight. As such, it is important that all of
    elements used to calculate these metrics are collected together and are not stitched
    together from multiple profiling sessions.


    Once the bottleneck has been discovered, the next step is to correlate bottleneck
    to specific code. This code becomes the target for the optimization efforts, with
    the exact optimizations attempted dependent upon the type of bottleneck. For this
    stage, events are sampled rather than counted. Each sample attributes the event
    to a specific instruction, although this instruction may not be the exact instruction
    responsible to due. As samples are collected, the number of times an instruction
    is counts how responsible the given instruction is for the total number of events.
    Logically, the optimizations should then focus on the code that was the most responsible.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# CHAPTER 6 Introduction to Profiling


    # 6.2 TOP-DOWN HIERARCHICAL ANALYSIS


    Top-Down Hierarchical analysis is a technique, developed by Intel, for using PMU
    events to decompose the flow of μops, in order to identify what pipeline stalls
    are affecting the overall pipeline efficiency. Each level within this hierarchy
    partitions the execution pipeline into a group of categories. Each category has
    zero or more subcategories, which increase the level of detail for further investigating
    the parent category. It is important to note that when the level of detail increases,
    moving to lower levels within the hierarchy, the level of error alsoにつき increases.
    Intel provides a set of formulas that use the PMU events to calculate the percentage
    of μops attributed to each category. These formulas can be found in Figures 6.2–6.7.


    This approach scales across multiple levels of granularity. For instance, this
    technique can be used over an entire application, by function, and so on.

    Starting at the first level, that is, the top of the hierarchy, μops are divided
    into four distinct categories. These categories partition the execution pipeline
    based on the uop flow through a pipeline. A pipeline slot is an abstraction of
    the various resources, which again by microarchitecture, required for a uop to
    pass through the execution pipeline. The number of slots, also known as the width
    of the pipeline, controls the number of μops that can allocate and the number
    of μops that can retire in one clock cycle. At the time of writing, a width for


    The Front End of the execution pipeline is responsible for fetching and decoding
    instructions from the instruction cache or memory. The act of delivering a uop
    from the Front End to the Back End, in order to begin execution, is referred to
    as allocation. Allocation marks the pipeline slots. As the uop in the Back End
    completes, its removal from the pipeline slot is referred to as retirement. Since
    one instruction can be comprised of multiple μops, an instruction isn''t retired
    until all its μops have retired.


    The four categories, at the very top of the Top-Down hierarchy, are organized
    based on whether a uop was allocated. If a uop was not allocated, there are two
    possible categories, which determine whether the Front End or Back End were responsible
    for the stall. The first category, Front Bound, corresponds to stalls during the
    instruction fetch and decode phases. In others, the Front End couldn''t keep up
    with the Back End. The second category, Back Bound, corresponds to stalls where
    the fetch and decode occurred without incident, but the Back End was unable to
    accept the new uop. In other words, the Back End couldn''t keep up with the incoming
    μops from the Front End.


    On the other hand, if a uop was successfully allocated, the next question is whether
    uop retired, leading to two additional categories. The first category, Speculation,
    corresponds to the situation where a uop was successfully allocated but associated
    with a branch mispredict. As a result, a uop was removed from the pipeline without
    retiring. The second category, Retiring, corresponds to the ideal situation, where
    the uop is successfully allocated and then successfully retired.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# 6.2 Top-Down Hierarchical analysis 111


    Notice that three of the four categories, Bad Speculation, Front End Bound, and
    Back End Bound, sound fairly deomin. Each of these categories represents stalls
    within the CPU pipeline, that is, unproductive cycles. Therefore, the percentage
    attributed to these categories are a less-is-better metric. On the other hand,
    the fourth category, Retiring, represents forward in the CPU pipeline, which is
    productive cycles. The percentage attributed to the Retiring is a higher-is-better
    metric.


    The formulas for calculating the percentages attributed to each category are shown
    in Figure 6.2. The variables at the top of this figure, excluding W, are the PMU
    events required for the analysis. The IDQ_UOPS_NOT_DELIVERED is nonarchitectural
    event introduced in the Second Generation Intel® Core™ processor family. As a
    result, this analysis requires a processor based on the Second Generation Intel
    microarchitecture or newer.


    Since the width represents the number of μops that can be allocated per cycle,
    the denominator in each of these equations, the pipeline times the total number
    of cycles, represents the theoretical maximum of μops that could be allocated.
    Ideally, as shown in Equation 6.2(c), the number of retired μops would equal this
    theoretical maximum.


    Once these metrics have been calculated, the next steps depend on which category
    dominates the results. Obviously, it is beneficial to first focus on the three
    categories that represent unproductive cycles. While a high retiring percentage
    indicates efficient pipeline utilization, it doesn''t necessarily mean further
    performance can be obtained.


    ```

    D = IDQ_UOPS_NOT_DELIVERED.CORE

    M = INT_MISC_RECOVERY_CYCLES

    N = CPU_CLK_UNHALTED_THREAD

    R = UOPS_RETIRED_RETIRE_SLOTS

    U = UOPS_ISSUED.ANY

    W = pipeline width

    ```


    | P_FE = % Front End Bound | (D/N) * 100 | (6.2a) |

    | P_BS = % Bad Speculation | ((U - R + (W * M))/N) * 100 | (6.2b) |

    | P_R = % Retiring | (R/N) * 100 | (6.2c) |

    | P_BE = % Back End Bound | 100 - (P_BS + P_FE + P_R) | (6.2d) |


    Figure 6.2


    Equations for decomposing μops (Intel Corporation, 2014).'
