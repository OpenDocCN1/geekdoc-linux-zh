- pgno: 227
  md: '# CHAPTER 12 Toolchain Primer


    the -Q option. An explanation of each of these optimizations is typically available
    in the GCC map file. For instance, to determine the optimizations enabled at -O2:


    ```

    $ gcc -Q -O2 --help=optimizers

    ```


    Aside from what optimizations the compiler can perform on the program flow, there
    are two other important considerations, the first being which instructions the
    compiler can generate and the second being which instructions are tuned for.


    Like the optimizers, the compiler''s use of each instruction set extension is
    controlled through compiler flags. These take the form of -m<feature> and -mno-<feature>.
    For example, GCC accepts -msse3 and -mno-sse3 to enable and disable SSE instructions,
    respectively. Multiple instruction sets can be enabled simultaneously.


    Rather than specifying the individual instruction sets, a specific processor profile
    can be specified in the -march<arch> compiler flag. This will enable all of the
    instruction sets that are listed within GCC''s profile for that architecture.
    If compiling for the local system, a specific profile exists native, which automatically
    detects and enables all of the instruction sets supported by the underlying processor.
    Table 12.2 highlights some of the most recent architecture profiles, along with
    the features they enable.


    In order to select a specific processor type for the compiler to optimize, use
    the -mtune<type> flags. The architectural profiles used for -march are valid values
    for -mtune.


    While selecting which instruction sets the compiler can generate is a fairly straightforward
    process, determining whether the compiler should generate them is slightly more
    involved. When making this decision, it''s important to realize that the compiler
    can generate these instructions throughout the entire program without runtime
    checks as to whether the underlying processor supports those instructions. If
    the executable or library attempts to execute one of these instructions on a processor
    that does not support that instruction set, the processor will raise a #UDefined
    exception. This exception will be trapped by the Linux kernel, which will send
    a SIGILL, the POSIX instruction signal, to the offending process. While this signal
    can be caught, the default signal handler will terminate the process and produce
    a core dump.


    # Table 12.2 Modern GCC -march Profiles and Their Supported Features


    | Profile | SSE | SSE2 | SSE3 | SSE3 | SSE4.1 | SSE4.2 | Intel® | AVX | Intel®
    | AVX2 |

