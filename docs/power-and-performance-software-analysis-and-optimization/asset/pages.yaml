- pgno: 131
  md: '# CHAPTER 6 Introduction to Profiling


    # 6.2.2 BACK END BOUND


    After allocation of $\muop$ by the Front End, the Back End is responsible for
    executing the $\muop$ until it retires. The Back End metric represents the situations
    where the Front End was able to allocate the maximum number of $\muops$, but the
    Back End was unable to execute one or more. This is caused by stalls within the
    Back End that consume resources that would otherwise be needed for the $\muop$
    to begin execution.


    These types of stalls can be further divided into two categories. The first category,
    memory stalls, occur when the execution is waiting for a memory resource to become
    available. The second category, execution stalls, occurs due to issues within
    the execution pipeline.


    The equations in Figure 6.4 provide the percentage of Back End stalls caused by
    each of these categories.


    One of the longstanding challenges in quantifying the impact of memory accesses
    is accounting for out-of-order execution. This is because the execution pipeline
    may be able to mask memory latencies by scheduling $\muops$ until those memory
    resources are available. The CYCLE_ACTIVITY,STALLS_LDM_PENDING PMU event is designed
    to only count memory accesses whose latencies cannot be masked. This event was
    added in the Third Generation Core™ microarchitecture, so these newer, processors
    are capable of a more accurate memory analysis than the Second Generation Intel
    Core processor family.


    Once these metrics identified what issues are contributing to the Back Bound category,
    another increase in detail is possible.


    # Memory Bound


    As the names imply, the Memory Bound category quantifies the percentage of cycles
    the execution pipeline is stalled waiting data loads. As a result of this stall,
    the maximum number of $\muops$ was able to be allocated. When the Back Bound


