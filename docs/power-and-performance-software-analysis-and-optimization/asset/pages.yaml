- pgno: 197
  md: '# CHAPTER 10 GPU Profiling Tools


    inefficiencies, abstractions designed to bridge the gap between the two conflicting
    architectures, typically manifest as highly visible performance problems. For
    example, whereas older graphics hardware consisted of a rigid fixed-function pipeline,
    modern graphics hardware is designed for programmability. As a result, the OpenGL
    specification had to be revamped, leading to a duality in the API between the
    old paradigm, of fixed rendering pipeline, and the new paradigm, of programmable
    shaders. The last few sections of this chapter explore some useful monitors for
    pinpoint the cause of graphical issues.


    Intel pulshes a significant amount of documentation for its graphics hardware.
    This documentation is enlightening, especially with regards to how the graphics
    APIs actually work, and why they are structured the way they are. Additionally,
    the Intel\u0ae Linux graphics drivers are completely open source, so their code
    can be studied. More information on the documentation and drivers can be found
    at: https://01.org/linuxgraphics/


    # 10.1 TRADITIONAL GRAPHICS STACK


    Technically, the term "traditional," in reference to the Linux graphics stack,
    is somewhat of a misnomer, the stack has been rapidly evolving to meet the needs
    of modern graphics applications. Additionally, due to the decentralized nature
    of open source software and the fragmentation of hundreds of different active
    distributions, each with which it''s hard to judge one piece of software as more
    "traditional" than another. Instead, this section focuses on the most common configuration
    at the time of this writing, which revolves around X11. The term "traditional"
    is used to differentiate this stack from the completely different software stack
    found on Android.


    Android exhausts the X server and almost all of the user space libraries used
    in the Linux graphics stack. Instead, Android reimplements the stack to accommodate
    its Java API.


    # 10.1.1 X11


    Historically, the Linux graphics stack has revolved around the X Window System
    protocol. The X protocol defines the interface for interacting with a client and
    the rendering server, which can be either to the client system or remote. This
    interaction allows for graphics hardware to be divided, by multiple, local and
    remote, and provides methods for handling input, such from a mouse, font management,
    and drawing routines.


    In order to use this protocol to interact with the X server, clients leverage
    the Xlib or XCB libraries. Note that here the term clients refers to each individual
    application, not complete systems, although those applications can be distributed
    across multiple systems. Xlib is the original library implementation for the client
    side of the X protocol; however, it abstracts the X protocol from the programmer.'
