  md: "# 12.3 CPU dispatch 223\n\nsupported features, executes CPUID at boot and caches\
    \ the result. Within the kernel, these results can be queried by the relevant\
    \ macros as boot_cpu_hash() or cpu_has(). Outside of the kernel, in user space,\
    \ the results are exposed through the cpuinfo file in the proc filesystem.\n\n\
    Profs is a memory-backed filesystem that exposes kernel data structures through\
    \ a hierarchical directory and file interface. Unlike a standard filesystem, the\
    \ files within proc and sysfs do not physically exist. The VFS file operations,\
    \ such as opening the file, hook into special functions that generate and the\
    \ desired content on demand. For profs, the kernel must be compiled with CONFIG_PROC_FS,\
    \ which is enabled on practically every Linux kernel. The standard convention\
    \ is that profs is mounted at /proc, although this isn't a technical requirement.\n\
    \nThe cpuinfo file is located at the top-level proc directory and contains all\
    \ of the relevant processor information, such as model, family, frequency, and\
    \ a list of supported features. The file contains one entry for each logical processor.\n\
    \nThe flags field contains a space-delimited list of CPU features for which the\
    \ kernel has detected support.\nCommon issue with the flags field is knowing which\
    \ strings map to which features. For example, the answer is obvious, such as the\
    \ SSE extensions mapping to the string \"sse2\". For others, the answer is less\
    \ obvious, such as the SSE3 extensions mapping to the string \"pi\", an acronym\
    \ for Prescott Instructions.\n\nUnderstanding which string requires a remedial\
    \ understanding of how the cpuinfo file is generated. All of the x86 processor\
