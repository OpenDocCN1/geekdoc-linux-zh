- pgno: 50
  md: '# 2.1 Intel® Pentium® 33


    # 2.1.1 SUPERSCALAR


    Prior to the 80486, the predecessor to the Pentium, each instruction was executed
    serially. In other words, each instruction began and finished execution before
    the execution of the next instruction could begin. This resulted in inefficient
    utilization of the processor’s resources, as instruction execution did not require
    all of those resources simultaneously.


    The 80486 introduced the concept of instruction pipelining. Instruction pipelining
    the execution process into multiple independent steps of occurring in parallel.
    Instructions traverse these paths one stage at a time. Once an instruction progresses
    to the next stage, the next instruction can take its place in the pipeline, and
    so on. As a result, the pipeline can simultaneously execute multiple instructions.
    This leads to better utilization of the processor’s resources, as each instruction
    only consumes a subset of the total resources. In other words, instruction pipelining
    provides a finer level of granularity for the allocation of resources.


    The execution pipeline of the 80486 is partitioned into five stages, making the
    pipeline, effective utilization on each stage making forward progress to the next
    stage, with the oldest instruction entering the pipeline and a new instruction
    entering the pipeline. A situation where forward progress cannot be made is referred
    to as a hazard. There are three types of pipeline hazards:


    Structural Hazards Two instructions require both the hardware resource. Data Hazard
    Two instructions share a data dependency. For example, one instruction might depend
    on the result of another instruction.


    Control Hazard Instructions within pipeline were speculatively executed but the
    branch was predicted incorrectly.


    When a hazard occurs, the pipeline stalls in order to allow the hazard to pass.
    This stall is referred to as a bubble in the pipeline, since there is an empty
    gap introduced.


    The Pentium processor increased the ILP of the 80486’s instruction pipeline even
    further. Whereas the 80486 had one pipeline capable of executing five instructions
    simultaneously, the i586 architecture had two pipelines each of executing five
    instructions simultaneously. This is referred to as multiple issue, because multiple
    instructions are ideally entering and exiting the pipeline at each stage. In order
    to accommodate this, the Pentium processor adds duplicate execution units to support
    the second pipeline.


    The number of instructions the processor can issue each cycle is referred to as
    the processor’s width, so the Pentium processor is described as 2-wide. It is
    important to understand that the two pipelines are not identical. As a result,
    there are restrictions on which instructions can be issued together. If any of
    these restrictions are violated, then only one instruction can be issued. This
    decision, whether to issue one or two instructions, is performed automatically
    in hardware during execution.'
  merge: -1
  img_proc: true
