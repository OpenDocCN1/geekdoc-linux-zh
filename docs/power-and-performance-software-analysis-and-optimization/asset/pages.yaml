    # Nop


    nop tracer is the default. As the name implies, this tracer doesn''t trace anything;
    however, it can be used to collect tracepoint events.


    Each static event can be searched, enabled, or disabled via the tracing/events
    directory. Within this directory are additional directories representing kernel
    subsystem that exposes events. Within each of these subdirectories, each representing
    a specific event. At each of these levels, there are entries enable, which are
    available to enable or disable all events within the subdirectories.


    ```

    # pwd

    /sys/kernel/debug/tracing

    # cat set_event

    # echo "*1915:*" > set_event

    # cat set_event | head -n 5

    1915:1915_pipe_update_start

    1915:1915_pipe_update_vblank_evaded

    1915:1915_pipe_update_end

    1915:1915_gem_object_create

    1915:1915_vma_bind

    # echo "*\!1915:*" > set_event

    # cat set_event

    ```


    By monitoring these events, it is possible to correlate the behavior of user space
    applications to kernel behavior.


    # 9.2 KERNEL SHARK


    While the DebugFS interface to Ftrace is very flexible, requires no special tools,
    and can be easily integrated into an application, there are two other interfaces
    available. The, trace-cmd, is a command-line tool that wraps the DebugFS'
