    The Linux kernel''s event infrastructure is designed to expose hardware and software
    performance counters. In theory, this interface provides an abstraction of performance
    events to user space. In reality, hardware performance counters are too processor-specific
    to fully abstract. Instead, the performance infrastructure focuses on providing
    a flexible interface to accommodate architecture-specific usages. As a result,
    an understanding of PMU fundamentals, discussed in Chapter 6, is required.


    The most common method for utilizing this infrastructure is the perf tool. This
    application multiplexes a series of tools designed to complement profiling'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'Additionally, the kernel infrastructure is also available for direct use. This
    allows developers to write highly customized monitors and embed the use of performance
    counters into their applications.


    This chapter begins with an introduction to the kernel''s performance infrastructure
    API, and also provides the necessary information and examples to utilize from
    user space. Then, Section 8.2 explores the perf tool and its usage.


    # 8.1 EVENT INFRASTRUCTURE


    The first step is to determine whether the kernel supports the event infrastructure
    and whether the system is configured appropriately for data collection. In for
    the events to be available, the kernel must have been compiled with the appropriate
    Kconfig options: CONFIG_HAVE_PERF_EVENTS, CONFIG_HAVE_PERF_EVENTS_NMI, CONFIG_HAVE_PERF_REGS,
    and CONFIG_HAVE_PERF_USER_STACK_DUMP. At the time of this writing, most Linux
    distributions have enabled these by default.


    Similar to VTune Amplifier data collection with the performance infrastructure
    requires the kernel''s NMI watchdog and kernel pointer hiding disabled. A discussion
    on these features, which interfere with data collection, and instructions on how
    to disable them can be found in Section 7.12.


    Additionally, the visibility of the data collection can be controlled with the
    /proc/sys/kernel/perf_event_paranoid file. If this file does not exist, either
    the kernel was compiled without support for performance events or profs not mounted.
    If the file exists, it contains a string of integer. This integer specifies the
    access restrictions enforced by the kernel for measurements. Table 8.1 lists the
    possible values and their subsequent meanings.


    # 8.1.1 perf_event_open(2)


    The actual functionality of the performance infrastructure is exposed by the kernel
    through one system call, perf_event_open(2). Prior to invoking this system call,


    Table 8.1 Values for *perf_event_paranoid* (Molnar et al., 2014)


    | Value | Measurements Allowed |

    |---|---|

    | 2 | User-Space |

    | 1 | User-Space and Kernel-Space |

    | 0 | CPU Events But Not Kernel Tracepoints |

    | -1 | No Restrictions |'
  merge: -1
  img_proc: true
- pgno: 156
  md: "# 8.1 Event infrastructure 139\n\na struct, perf_event_attr, is populated.\
    \ This struct describes the event to be collected, how the measurements should\
    \ occur, and how the results should be reported. The system call returns a file\
    \ descriptor that is utilized for accessing the data collected. In other words,\
    \ this system call is invoked for each event to be monitored.\n\nAt the time of\
    \ this writing, no wrapper exists for this system call in glibc, and manually,\
    \ for instance, with the `SYSCALL` instruction. The function prototype can be\
    \ found in Listing 8.1.\n\n```\nint perf_event_open(struct perf_event_attr *attr,\
    \ pid_t pid,\n               int group_fd, unsigned long flags);\n```\n\nLISTING\
    \ 8.1\n\nperf_event_open(2) function prototype.\n\nAs mentioned above, the attr\
    \ argument is responsible for communicating the event configuration.\n\nThe pid\
    \ specifies the process to monitor. A pid of 0 measures all processes on the system,\
    \ and a positive pid measures the process with the given pid.\n\nThe cpu argument\
    \ specifies the logical processor to monitor. A cpu value of -1 monitors all logical\
    \ processors, with a positive or zero value limits collection to the specified\
    \ processor.\n\nThe group_fd argument is the file descriptor of the group leader.\
    \ This allows for multiple events to be grouped together. An event group is only\
    \ scheduled to be collected when all members are available to be measured. Thus,\
    \ all events that will be calculated or compared should be members of the same\
    \ group, ensuring that each metric is computed based on simple code execution.\
    \ The first event, the leader, is created with a group_fd of -1. The file descriptor\
    \ returned for the leader is then passed as the value for group_fd during the\
    \ creation of all other events in the group.\n\nFinally, the flags argument allows\
    \ for specifying any behavioral modifiers. Currently, the only flag the author\
    \ sees of value is PER_FLAG_PID_CGROUP, which allows for system-wide monitoring\
    \ to a cgroup.\n\nThe perf_event_open(2) function follows the standard conventions\
    \ for a function that opens a file descriptor, that is, returning the new file\
    \ descriptor or -1 and setting errno.\n\n# 8.1.2 SELECTING AN EVENT\n\nEvents\
    \ are selected by populating the perf_event_attr structure and then passing it\
    \ to the kernel. This data structure, as expected by the kernel ABI, is defined\
    \ in /usr/include/linux/perf_event.h. This header file also includes the enumerations\
    \ for the various events, as well as any other ABI definitions."
  merge: -1
  img_proc: true
- pgno: 157
  md: 'Due to the flexibility of the interface, the event attribute structure is fairly
    complex. Determining which fields to populate in this structure depends on the
    desired information.


    The first step is to select the event and event type, corresponding to the perf_event_attr.config
    and perf_event_attr.type fields, respectively. At the time of this writing, the
    following predefined event types are listed in the perf_event.h header file:


    ```

    PERF_TYPE_HARDWARE Hardware Event

    PERF_TYPE_SOFTWARE Software Event

    PERF_TYPE_TRACEPOINT Tracing Event

    PERF_TYPE_HW_CACHE Hardware Cache Event

    PERF_TYPE_RAW Hardware Event

    PERF_TYPE_BREAKPOINT Hardware Breakpoint

    ```


    Additionally, the supported events and event types can be enumerated by sysfs.
    The event types can be iterated via the event_source base in sysfs. Each directory
    in /sys/bus/event_source/devices/ represents an event type. To select that event,
    use the perf_event_attr.type field to find the value in that corresponding directory''s
    type file. Notice that the values exported by sysfs corresponds with the predefined
    values. For instance:


    ```

    $ ls /sys/bus/event_source/devices/

    breakpoint@ cpu@ power@ software@ tracepoint

    $ cat /sys/bus/event_source/devices/software/type

    1

    $ grep PERF_TYPE_SOFTWARE /usr/include/linux/perf_event.h

    ```


    ```

    PERF_TYPE_SOFTWARE = 1.

    $ cat /sys/bus/event_source/devices/power/type

    6

    ```


    Each of these events has a corresponding directory in /sys/devices. Within some
    of these directories are an events subdirectory. Within this events directory
    is a file for each predefined event. These predefined event files contain the
    necessary information to program the event. For example:


    ```

    $ ls /sys/devices/cpu/events

    Branch-instructions cache-misses instructions

    Ref-cycles branch-misses cache-references

    Mem-loads stalled-backend bus-cycles

    cpu-cycles mem-stores stalled-cycles-frontend

    $ cat /sys/devices/cpu/events/cpu-cycles

    event=0x3c

    $ cat /sys/devices/cpu/events/ref-cycles

    event=0x03

    $ ls /sys/devices/power/events

    ```'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# 8.1 Event infrastructure 141


    energy-cores energy-gpu energy-pkg

    energy-cores.scale energy-gpu.scale energy-pkg.scale

    energy-cores.unit energy-gpu.unit energy-pkg.unit


    Notice in the above example, an event type named “power” was available; however,
    this event type was not present in the list of ABI event types. This is because,
    at the time of this writing, the ABI header doesn''t have a corresponding entry
    in the perf_type_id for this type. The “power” event type, introduced less than
    a year ago, adds events that utilize the RAPL interface, described in Section
    3.2.4, to provide power consumption information. This illustrates how the infrastructure
    is evolving. Andi Kleen has written a library, libevents, to parse the events
    listed in it. It is available at https://github.com/andikleen/pmu-tools/tree/master/events


    # PERF_TYPE_HARDWARE


    When perf_type_attr is set to PERF_TYPE_HARDWARE, the contents of perf_event_attr
    are interpreted as one of the predefined processor events. Some of these events
    and their meanings are listed in Table 8.2. The exact PMU counter representing
    each of these events can be determined by searching for the event name in the
    $LINUX_SRC/arch/x86/kernel/ directory. This information can be cross-referenced
    with Volume 3, Chapter 19 of the Intel® Software Developer Manual to determine
    the precise mechanism.


    As mentioned in the introduction, abstract PMU events is challenging. The majority
    of events are nonarchitectural, their behavior can vary from one processor architecture
    to the next. As a result, defining events for every available event would clutter
    the API with thousands of events that are only useful on a specific platform.
    Thus, most PMU events are only accessible with the PERF_TYPE_RAW event type.


    Another challenge with the predefined events is that there is no guarantee that
    these events will continue measuring the same counts in future kernel versions.
    In summary, the predefined events of type PERF_TYPE_HARDWARE are convenient for
    basic PMU usage. For more serious performance work, it is better to use the PERF_TYPE_RAW
    events and specify the counts directly.


    # PERF_TYPE_RAW


    The interpretation of perf_event_attr config when perf_event_attr is set to PERF_TYPE_RAW
    depends on the architecture. For Intel® platforms, the format of the programmable
    PMU MSR, shown in Figure 6.1. Of these bits, only the ones that identify the event
    are required. The kernel automatically sets the other bits based on the other
    attributes in the perf_event_attr struct. For example, the OS and US fields are
    set on depends on the values of perf_event_attr.exclude_kernel and perf_event_attr.exclude_user.
    In other words, only the umask and event number need to be set for most events.
    Some events may also require setting the cmask, inverse, or edge detect fields.
