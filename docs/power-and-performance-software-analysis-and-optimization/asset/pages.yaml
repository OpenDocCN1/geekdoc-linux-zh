  md: '# 5.4 Phoronix Test Suite 85


    #  5.4 PHORONIX TEST SUITE


    Aside from running one of the most popular websites dedicated to Linux performance
    news, http://www.phoronix.com, Phoronix Media also produces a framework designed
    specifically for benchmarking. This framework, known as the Phoronix Test Suite,
    provides a flexible architecture that is easily extensible through custom modules
    and benchmarks. While Phoronix typically focuses on Linux performance, the Phoronix
    Test Suite is cross-platform.


    Leveraging the Phoronix Test Suite provides a significant number of advantages
    over writing a custom benchmark manager: One of these advantages is the presence
    of advanced benchmarking features, such as the ability to automatically rerun
    tests with a high variance or the ability to leverage Git bisection in order to
    pinpoint the source of performance regressions.


    Another one of these advantages is the ability to generate publication-ready graphs
    for plotting results and displaying system information. These graphs are of considerable
    quality, highlighting not only the results, but also the relevant test and system
    configurations, as well as clearly labeling the metrics. The attention paid to
    producing high quality graphs for summarizing the benchmarking data highlights
    the fact that the Phoronix Test Suite is used for generating content for Phoronix
    news


