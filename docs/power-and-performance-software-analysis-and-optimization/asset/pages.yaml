    Compiler intrinsics are built-in functions provided by the compiler that share
    a one-to-one, or many-to-one, relationship with specific instructions. This allows
    the specific instructions to be written using high-level programming constructs
    and frees the developer from worrying about calling conventions, register allocation,
    and'
