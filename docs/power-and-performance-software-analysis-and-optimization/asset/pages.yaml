- pgno: 230
  md: '# 12.2 ELF and the x86/x86_64 ABIs 213


    printf, the full printf implementation from libc must be copied into the executable.

    The exact size increase depends, since modern linkers only copy the needed bits,
    ensuring that the code size only pays for what the software uses.


    The increased memory usage is caused by the redundant copies of functions between
    executables. For instance in the previous example, each statically linked executable
    that uses printf must have its own copy of the printf implementation, whereas
    all of the executables can share one implementation. The author imagine that readers
    might argue that static linking actually reduces memory usage, since unused objects
    from libraries are not loaded into the process image. While it is true that with
    dynamic linking the full library, unused objects, will be mapped into the virtual
    address space of the process, that doesn''t necessarily translate to that full
    library loaded into physical memory. Each page of the library will be loaded from
    disk into memory once it has accessed, and once these pages have been loaded they
    can be shared between multiple executables.


    The increased update effort is caused by the fact that the only way to update
    the external dependencies used by an executable is to recompile that executable.
    This also makes it more difficult to determine what version of a library specific
    executable is using. This could be a serious issue when determining whether an
    executable is susceptible to a published security vulnerability in one of its
    dependencies. With dynamic linking, the shared library needs to be recompiled.


    Unlike static linking, dynamic linking doesn''t fully resolve the location of
    external dependencies until run time. At link time, the linker creates special
    sections, describing the external dependencies that need to be resolved at run
    time. When the object is loaded, this information is used by the dynamic linker
    to finish resolving the external symbols enumerated within the object. This process
    is referred to as symbol binding. This is all complete, transferred to the executable.


    The linker creates a PT_INTER entry into the object''s Program Header. The entry
    contains a NULL-terminated filesystem path to the dynamic linker, normally ld.so
    or ld-linux.so. This is the dynamic linker that will be invoked to load the necessary
    symbols.


    The linker also creates a dynamic section that includes a dentry-terminated array
    of dynamic properties. Each of these entries is composed of a type and value.
    A full list of the supported types and their subsequent meanings can be found
    within the ELF section. A few of the important types are described below.


    DT_NEEDED Array elements represent the type names of shared libraries required
    for external symbol resolution. The SONAME or the filesystem path, relative or
    absolute. The value associated with this type is offset into the file''s string
    table. A list of values of this type can be obtained by either reading the section,
    with a command like readelf -d, or at execution time by setting the LD_TRACE_LOADED_OBJECTS
    variable. For convenience, ldd is a utility that will set the environment variable
    and execute the program.'
