  md: '# 12.4 Coding style 231


    # Const


    The const qualifier informs the compiler that the type modified by the qualifier
    will not change. This actually serves two purposes, as it can enable additional
    optimizations as well as causing compiler errors if an attempt is made to modify
    a constant variable.


    An important aspect of the const qualifier is that it can modify either a value
    or pointer. For instance, the const int type represents a signed integer value
    while the const char *const represents a constant pointer. On the other hand,
    a pointer that never changes, points to a character whose value never changes.


    Marking strings as const can cause strings to move from the ELF.data section to
    the .rodata section. This also enables string merging, where two constant strings
    that overlap can be merged into one string. For instance, the strings const *str0="testing123"
    and const *str1="123". The second string, only requires changes: "2","3", and
    "0" the NULL sentinel. These four characters can be found as the last four characters
    in the first string, str0, and therefore only the first string needs to be stored,
    with second simply pointing at the last 4 bytes of the first. This size optimization
    can only occur when both strings are marked as const.


    # Volatile


    The volatile qualifier informs the compiler that the modified variable may be
    updated in ways the compiler doesn''t have visibility into. The canonical example
    of this is a pointer to a memory mapped device, where the value may not be the
    same value read from that address. Without this qualifier, the compiler would
    incorrectly optimize away memory accesses due to its limited understanding of
    the situation.


    The problem with the volatile qualifier is that it forces the compiler to disable
    every memory optimization. Fetched memory accesses can''t be reused or cached,
    resulting in a significant degradation in performance. Only use this qualifier
    if it is absolutely necessary.


    # 12.4.3 ALIGNMENT


    On Intel Architecture, unaligned memory accesses are less significant than they
    used to be. Since memory accesses are satisfied by fetching cache lines, the only
    big penalty for an unaligned access is if it splits a cache line, resulting in
    two cache lines needing to be loaded, and then the relevant values fetched. For
    the most part, the majority of important alignments will be automatically by the
    compiler.


    Some instruction extensions, especially SIMD, are sensitive to memory alignment,
    with special instructions for accessing unaligned and aligned data. Also, data
    structure layouts can benefit from strategic alignment. For example, false sharing'
