  md: '# 11.4 LatencyTOP 201


    The status of runtime power management is typically listed for each device. This
    controls whether the device is able to enter low power states, such as whether
    a PCI device can enter D3hot. At the time of this writing, runtime power management
    is disabled for USB devices, due to problems with some devices not functioning.
    Figure 11.5 illustrates an example Tunables window.


    # 11.4 LatencyTOP


    Similar to PowerTOP, LatencyTOP is a monitor, also written by Arjan van de Ven,
    for measuring the duration that user space applications spend in a blocked state,
    along with the underlying reason.


    In order instrument the kernel scheduler to obtain this data, the kernel must
    be built with LatencyTOP support. This is controlled via two Kconfig options,
    CONFIG_FIG_HAVE_LATENCYTOP and CONFIG_LATENCYTOP. Most Linux distributions only
    enable these options for their debug kernels.


    ```

    $ grep LatencyTOP /boot/config-$(uname -r)

    CONFIG_HAVE_LATENCYTOP_SUPPORT=y

    ```


    LatencyTOP communicates with user space through proc filesystem. Accessing this
    information requires root privileges. Data collection is enabled or disabled by
    writing "1" or "0" into /proc/sys/kernel/latency. Once data collection is enabled,
    latency statistics for the entire system are accessed through /proc/latency_stats.
    Additionally, the latency statistics for each process can be accessed via the
    latency file within processes'' directory, for example, /proc/2145/latency.


    The first line of each files is a header, which identifies the LatencyTOP version.
    This header is then followed by zero or more data entries. Each of these entries
    take the form of three integers followed by a string. This string contains the
    function call stack, starting from the right, each function call separated by
    a space. This call only tracks kernel functions, so the function on the right
    is always a system call invocation. The first integer represents the number of
    times this function call has occurred. The second integer represents the total
    microseconds of latency caused by this call stack. The third integer represents
    the largest latency in microseconds of one invocation of this call stack (van
    de Ven, 2008).


    For example:


    ```

    # cat /proc/630/latency

    Latency Top version : v0.1

    1 881 poll_schedule_timeout do_sys_poll Sys_poll system_call_

    fastpath

    1 9 futex_wait_queue_me futex_wait_futex Sys_futex system_call_

    fastpath

    ```


    In this example, the process has two system calls, poll(2) and futex(2). Each
    of these calls occurred once, with the invocation of poll(2) blocking for 881
    µs, and the invocation of futex(2) blocking for 9 µs.


    ![](img/33fad1fa149d4f0cdd55ff2565970ab2_218_0.png)'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# CHAPTER 11 Other Helpful Tools


    Aside from manually reading these files or disabling data collection, there is
    a GTK+ graphical interface and a ncurses-based command-line interface. The data
    displayed within these interfaces is the same, although they provide a few conveniences,
    such as automatically starting and stopping data collection, and printing the
    process name next to the pid.


    # 11.5 SYSPROF


    Sysprof is a monitor that measures how time is spent in each function call. Time
    per function is reported with two different metrics, cumulative time and self
    time. Cumulative time measures the time spent within a function, including all
    function calls invoked from that function. Self time measures the time spent within
    a function, excluding all function calls invoked from that function, i.e., the
    cost of the function itself. This level of detail makes Sysprof very useful for
    algorithmic analysis.


    # 11.5.1 COLLECTION


    Originally, Sysprof had its own kernel module, which is called sysprof-module,
    for collecting data. Starting around 2009, Sysprof began leveraging the kernel''s
    perf counter interface, thus obviating the need for a separate module. At the
