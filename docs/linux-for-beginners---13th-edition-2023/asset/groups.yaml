  mdcn: '


    # 有用的帮助/信息命令


    以下命令在你试图了解正在使用的 Linux 系统或程序时非常有用。你每天可能不需要用到它们，但当需要时，它们会非常宝贵。


    **free** 命令显示系统中物理内存和交换内存的总空闲量和已用量。例如，`free -m` 会以兆字节为单位提供信息。


    **sed** 命令打开一个流编辑器。流编辑器用于在输入流（文件或管道输入）上执行文本转换。


    **df** 命令显示所有分区的文件系统磁盘空间使用情况。命令 `df -h` 可能最有用（-h 表示人类可读格式）。


    **adduser** 命令向系统添加一个新用户。类似地，addgroup 命令向系统添加一个新组。


    **top** 程序提供运行中系统的动态实时视图。它可以显示系统摘要信息，以及进程列表。


    **deluser** 命令从系统中删除一个用户。要删除该用户的文件和主目录，你需要添加 `--remove-home` 选项。


    **uname** 命令配合 `-a` 选项会打印所有系统信息，包括机器名称、内核名称、版本以及一些其他细节。


    **delgroup** 命令从系统中删除一个组。你无法删除任何用户的主组。


    **ps** 命令允许你查看机器上正在运行的所有进程。每个操作系统的 ps 版本略有不同，但它们都执行相同的功能。


    **man man** 命令显示 man 命令的手册条目，这是使用它的一个很好的起点。


    **grep** 命令允许你在多个文件中搜索特定的搜索模式，然后打印匹配的行。一个例子是：`grep blah file`。


    **man intro** 命令特别有用。它显示用户命令介绍，这是一篇写得很好且相当简明的 Linux 命令行介绍。


    # Linux 命令 A-Z


    Linux 命令有成千上万条，因此虽然这不是一个完整的 A-Z 列表，但它包含了你最可能需要使用的许多命令。你可能会发现自己反复使用较少的命令集合，但拥有整体知识仍然非常有价值。


    ### A

    - **adduser**：添加新用户

    - **arch**：打印机器架构

    - **awk**：在文件内查找和替换文本


    ### B

    - **bc**：任意精度计算器语言


    ### C

    - **cat**：连接文件并打印到标准输出

    - **cd|ir**：改变工作目录

    - **chgrp**：更改文件的组所有权

    - **chroot**：更改根目录

    - **cksun**：打印 CRC 校验和字节计数

    - **cmp**：比较两个文件

    - **comm**：逐行比较两个已排序的文件

    - **cp**：将一个或多个文件复制到另一个位置

    - **crontab**：计划稍后运行命令

    - **csplit**：将文件分成由上下文确定的片段

    - **cut**：将文件分成几个部分


    ### D

    - **date**：显示或更改日期和时间

    - **dc**：桌面计算器

    - **dd**：数据转储，转换并复制文件

    - **diff**：显示两个文件之间的差异

    - **dirname**：将完整路径名转换为仅路径

    - **du**：估算文件空间使用量


    ### E

    - **echo**：在屏幕上显示消息

    - **ed**：面向行的文本编辑器（edlin）

    - **egrep**：在文件中搜索匹配扩展表达式的行

    - **env**：显示、设置或删除环境变量

    - **expand**：将制表符转换为空格

    - **expr**：计算表达式


    ### F

    - **factor**：打印质因数

    - **fdisk**：Linux 分区表操作器

    - **fgrep**：在文件中搜索匹配固定字符串的行

    - **find**：搜索满足特定标准的文件

    - **fmt**：重新格式化段落文本

    - **fold**：换行文本以适应指定宽度

    - **format**：格式化磁盘或磁带

    - **fsck**：文件系统一致性检查和修复


    ### G

    - **gawk**：在文件内查找和替换文本

    - **grep**：在文件中搜索匹配给定模式的行

    - **groups**：打印用户所在的组名

    - **gzip**：压缩或解压指定文件


    ### H

    - **head**：输出文件的前一部分

    - **hostname**：打印或设置系统名称


    ### I

    - **id**：打印用户和组 ID

    - **info**：帮助信息

    - **install**：复制文件并设置属性


    ### J

    - **join**：在公共字段上连接行


    ### K

    - **kill**：停止进程运行


    ### L

    - **less**：每次显示一屏输出

    - **ln**：在文件之间创建链接

    - **locate**：查找文件


    # 使用终端


    **你知道吗...**  NASA 最先进的超级计算集群 Pleiades 是由 Linux 驱动的？Pleiades 由 160 个机架（11,440 个节点）、245,536
    个 CPU 核心、总计 935TB 的内存、184,320 个 NVIDIA CUDA 核心以及超过六英里的光纤电缆组成。


    其核心是一个复杂的 SUSE Linux Enterprise Server 设置，以及许多定制开发软件包和其他 NASA 项目独有的软件。NASA 高级计算部门使用
    Pleiades 进行的项目包括：开普勒任务——搜寻太阳系外的类地行星；CFD（计算流体力学）建模，帮助创建更高效的空间发射系统；暗物质研究和模拟；以及地球洋流的可视化，为
    ECCO（估计海洋环流和气候）项目构建数据。


    # 足以胜任 **NASA**


    由 Linux 驱动的 NASA 超级计算机 Pleiades，目前排名全球第 11 强大。


