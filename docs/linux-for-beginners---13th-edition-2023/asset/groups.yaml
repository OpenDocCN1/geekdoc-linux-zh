    \ If you want to delete a user from Mint, you can either enter: `sudo deluser\
    \ <username>` in the Terminal or click the Delete button in Users and Groups.\n\
    \n![](img/7801ba6bee6a3a08f7f02897cdbcd867_38_4.png)\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_38_5.png)\n\
    \n## Customising the Desktop\n\nCustomising the operating system desktop is one\
    \ way to make it your own: a personalised workspace that is there to help you\
    \ work, inspire you or feature the company logo. Whatever your reasons for having\
    \ your own desktop, here’s how it’s done.\n\n### YOUR DESKTOP\n\nLinux is probably\
    \ one of the customisable operating systems there is. With just a few tweaks,\
    \ one or two extras installed and some imagination, you can create something incredible.\n\
    \n- **STEP 1**\n  The first aspect of desktop customisation is to change the wallpaper.\
    \ Right-click the desktop and choose Change Desktop Background. This opens the\
    \ Backgrounds app in Linux Mint; remember, other distros may present their background,\
    \ wallpaper selection tools differently.\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_39_0.png)\n\
    \n- **STEP 2**\n  More recent versions of Linux Mint display available backgrounds\
    \ depending on the version the user is running. You normally get three categories\
    \ followed by a fourth, Pictures, which is separated from the others. The Pictures\
    \ option is different because it reads the image content from the Pictures folder\
    \ in your Home area.\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_39_2.png)\n\n\
    - **STEP 3**\n  You just need to click the available images, from any of the locations\
    \ provided to have them install as the desktop wallpaper. Incidentally, if you\
    \ have images stored in another location on your system or network, you can add\
    \ them by clicking on the Plus symbol at the bottom of the Backgrounds console,\
    \ using the file manager to locate them.\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_39_1.png)\n\
    \n- **STEP 4**\n  By clicking on the Settings tab you can, instead, play numerous\
    \ images as a slideshow or change the aspect of the wallpapers to a variety of\
    \ choices.\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_39_3.png)\n\n- **STEP 5**\n\
    \  If none of the available wallpapers take your fancy, open a browser and search\
    \ for the type of background image you prefer. When you've found the image you\
    \ want as the desktop wallpaper, right-click it and choose **Set As Desktop Background**\
    \ from the list of options. When the Set Desktop Background console opens, click\
    \ the Set Desktop Background button.\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_40_0.png)\n\
    \n- **STEP 6**\n  Click the Menu button and search for 'desktop' and click the\
    \ Desktop Settings result. The Desktop console allows you to pick the layout,\
    \ desktop icons and options for multi-monitor support you want. You can experiment\
    \ with the options for the best setup, according to your personal tastes.\n\n\
    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_40_1.png)\n\n- **STEP 7**\n  In addition\
    \ to changing the desktop wallpaper, and how the icons are displayed, you can\
    \ also alter the overall theme for Linux Mint. From the Mint Menu, search for\
    \ 'themes' and click the Themes app as it appears in the search results.\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_40_2.png)\n\
    \n- **STEP 8**\n  Themes allows you to change the way certain aspects of the Mint\
    \ desktop look: Window Borders, Icons, Controls, Mouse Pointer and Desktop. In\
    \ the Settings tab you can extend the options with a few on/off slider buttons,\
    \ too.\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_40_3.png)\n\n- **STEP 9**\n\
    \  If you click on the Add/remove button in the centre of the three available\
    \ options, you can choose the default view from a number of preinstalled themes.\
    \ Click the theme you want, then click the Install (downward-pointing arrow) button\
    \ to enable it.\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_40_4.png)\n\n- **STEP\
    \ 10**\n  Click back on Themes, then Desktop and you can locate the newly installed\
    \ theme and apply it to your desktop. Any installed Themes can also be uninstalled\
    \ via the Add/Remove button. It's worth spending some time personalising your\
    \ desktop how you want it and there are some incredible themes available too.\n\
    \n![](img/7801ba6bee6a3a08f7f02897cdbcd867_40_5.png)\n\n## Becoming Anonymous\
    \ Online\n\nThe digital age has led to many great advances in communications;\
    \ however, it has also brought on a new age of spying and snooping. Most of us\
    \ are no strangers to the frequent news stories of governments, secret organisations\
    \ and underground hackers breaking our privacy, but how can you combat this?\n\
    \n### ANONYMITY WITH MINT\n\nWhile it’s virtually impossible to become totally\
    \ anonymous online, you can take measures to ensure your privacy is at its best.\n\
    \n- **STEP 1**\n  Starting with the basics, use HTTPS instead of the standard\
    \ HTTP when browsing. This means that anything that’s transmitted over HTTPS is\
    \ secure (hence the S part at the end) and encrypted.\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_41_0.png)\n\
    \n- **STEP 2**\n  When you’re browsing, consider using the Incognito or Private\
    \ browsing modes available in a browser. This disables your web history and web\
    \ cache, allowing you to browse without the details being stored for later scrutiny\
    \ by someone else. However, it doesn’t stop any data or search tracking.\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_41_2.png)\n\
    \n- **STEP 3**\n  Although using Google may seem like the obvious choice for a\
    \ modern Internet search, the company does track all searches made by an individual.\
    \ Instead, consider an alternative search engine, such as DuckDuckGo, a search\
    \ engine that doesn’t store personal data or track you.\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_41_1.png)\n\
    \n- **STEP 4**\n  If you’re regularly on the Internet then consider installing\
    \ some of the browser plug-ins that enhance your privacy. For example, for Firefox,\
    \ use Ghostery, NoScript and Adblock Plus to block trackers, adverts and other\
    \ data mining techniques.\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_41_3.png)\n\
    \n### VPNS AND TOR\n\nThe previous steps can aid your online privacy but to really\
    \ become anonymous you need a Virtual Private Network and Tor.\n\n- **STEP 1**\n\
    \  A VPN is a remote server, or cluster of servers, that establishes a connection\
    \ with your computer. The end result is that your computer's identity on the Internet\
    \ is hidden behind the VPN remote server; so you could live in the UK but have\
    \ an IP address (the computer online identity) belonging to Iceland.\n\n- **STEP\
    \ 2**\n  Most good VPNs charge a monthly or annual fee but it's worth the expense.\
    \ We use CyberGhost, www.cyberghostvpn.com, which offers VPN connections for Windows,\
    \ Mac, Mint (as well as other Linux distros), Android and iOS devices. Details\
    \ for each OS can be found at www.support.cyberghostvpn.com/hc/en-us/articles/213190329-Read-me-first.\n\
    \n- **STEP 3**\n  Another option is to use Tor. Tor is an open network that you\
    \ can attach to that hides your IP address behind countless nodes around the world.\
    \ It's available for Windows, Mac and Linux computers and is very easy to install\
    \ and use. Start by navigating to www.torproject.org/download/download-easy.html\
    \ and clicking on the Download Linux 64-bit button.\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_42_0.png)\n\
    \n![](img/7801ba6bee6a3a08f7f02897cdbcd867_42_1.png)\n\n- **STEP 4**\n  When the\
    \ download has finished, drop into the Terminal and enter the Downloads folder,\
    \ `cd Downloads/`. Enter `ls` to check the tar.xz Tor file is present, then enter\
    \ `tar -xf tor-browser-1tlux64-8.0.4_en-US.tar.xz` (Tor is updated regularly,\
    \ so if your version is different press Tab to autocomplete the tor-browser= filename).\
    \ When the files are unpacked, use `cd tor-browser-en-US/` to enter the new folder.\n\
    \n- **STEP 5**\n  A quick `ls` reveals a couple of entries; a folder called Browser\
    \ and a file called 'start-tor-browser.desktop'. To start the Tor setup, type\
    \ `./start-tor-browser.desktop`. This command launches the Tor setup, where you\
    \ are offered two options: Connect or Configure. For most users, the Connect option\
    \ will suffice. Click Connect when you are ready.\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_42_2.png)\n\
    \n![](img/7801ba6bee6a3a08f7f02897cdbcd867_42_3.png)\n\n- **STEP 6**\n  After\
    \ the connection is established, the Tor Browser launches. This is a customised\
    \ version of Firefox and from here you can securely browse the Internet without\
    \ fear of being viewed or tracked. Mixing both a VPN and Tor makes for an extremely\
    \ secure and private connection to the online world.\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_42_4.png)\n\
    \n![](img/7801ba6bee6a3a08f7f02897cdbcd867_42_5.png)\n"
  mdcn: "\n## 创建用户\n\n**步骤 5** 现在你可以为新用户输入密码，或者点击“新密码”文本框末尾的弯曲箭头以生成并显示一个密码。当然，尽可能设置一个强密码是个好主意。完成后，点击“更改”按钮。\n\
    \n![](img/7801ba6bee6a3a08f7f02897cdbcd867_38_0.png)\n\n**步骤 6** 由于新用户已创建，你现在可以关闭“用户和组”控制台窗口。如果你点击\
    \ Mint 菜单，然后选择注销，系统会显示 Mint 登录管理器。新用户现在出现在当前可用用户列表中。点击该用户以登录。\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_38_1.png)\n\
    \n**步骤 7** 登录后，新用户需要设置自己的桌面壁纸、图标、面板、菜单等。根据你为他们设置的账户类型（标准或管理员），他们将无法安装任何新应用。此截图来自标准用户账户类型。\n\
    \n![](img/7801ba6bee6a3a08f7f02897cdbcd867_38_2.png)\n\n**步骤 8** 你可以创建尽可能多的用户账户，并在需要时切换它们。最好只保留一个能够安装新软件的账户，这样可以追踪系统上的内容。\n\
    \n![](img/7801ba6bee6a3a08f7f02897cdbcd867_38_3.png)\n\n## 命令行账户\n\n正如你预期的那样，你也可以在命令行中创建新用户。在主（你自己的）管理员账户下打开一个终端会话。\n\
    \n**步骤 1** 从命令行添加新用户的流程相对简单。首先，输入：`sudo adduser <username>`，其中 `<username>` 是新用户的登录名。然后你会被要求为用户创建新密码，以及他们的全名和其他详细信息。点击\
    \ Y 以确认详细信息并创建用户账户。\n\n**步骤 2** 你可以在“用户和组”控制台中检查新用户的详细信息和账户类型。如果你想要从 Mint 中删除一个用户，你可以输入：`sudo\
    \ deluser <username>` 在终端中，或者在“用户和组”中点击删除按钮。\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_38_4.png)\n\
    \n![](img/7801ba6bee6a3a08f7f02897cdbcd867_38_5.png)\n\n## 自定义桌面\n\n自定义操作系统桌面是使其具有个性化的方式之一：一个个性化的工作空间，旨在帮助你工作、激励你或展示公司标志。无论你拥有自己桌面的理由是什么，以下是操作方法。\n\
    \n### 你的桌面\n\nLinux 可能是最可定制的操作系统之一。只需几个调整，安装一两个额外组件以及一些想象力，你就可以创造惊人的东西。\n\n- **步骤\
    \ 1**\n  桌面自定义的第一个方面是更改壁纸。右键点击桌面并选择“更改桌面背景”。这在 Linux Mint 中打开了背景应用；请记住，其他发行版可能会以不同的方式呈现其背景、壁纸选择工具。\n\
    \n![](img/7801ba6bee6a3a08f7f02897cdbcd867_39_0.png)\n\n- **步骤 2**\n  较新版本的 Linux\
    \ Mint 会根据用户运行的版本显示可用的背景。通常你会得到三个类别，随后是一个由其他类别分隔的第四个类别“图片”。“图片”选项不同，因为它从你主区域的图片文件夹中读取图像内容。\n\
    \n![](img/7801ba6bee6a3a08f7f02897cdbcd867_39_2.png)\n\n- **步骤 3**\n  你只需点击任何提供的位置的可用图像，即可将其安装为桌面壁纸。顺便说一句，如果你在其他位置（系统或网络上）存储了图像，你可以通过点击背景控制台底部的加号符号，使用文件管理器来定位它们，从而添加它们。\n\
    \n![](img/7801ba6bee6a3a08f7f02897cdbcd867_39_1.png)\n\n- **步骤 4**\n  通过点击设置标签，你可以选择播放多张图像作为幻灯片，或更改壁纸的各种选项。\n\
    \n![](img/7801ba6bee6a3a08f7f02897cdbcd867_39_3.png)\n\n- **步骤 5**\n  如果没有任何可用的壁纸让你满意，打开浏览器并搜索你喜欢的背景图像类型。当你找到想要的作为桌面壁纸的图像时，右键点击它并从选项列表中选择**设置为桌面背景**。当设置桌面背景控制台打开时，点击设置桌面背景按钮。\n\
    \n![](img/7801ba6bee6a3a08f7f02897cdbcd867_40_0.png)\n\n- **步骤 6**\n  点击菜单按钮，搜索“desktop”并点击桌面设置结果。桌面控制台允许你选择你想要的布局、桌面图标和多显示器支持选项。你可以根据个人口味实验选项以找到最佳设置。\n\
    \n![](img/7801ba6bee6a3a08f7f02897cdbcd867_40_1.png)\n\n- **步骤 7**\n  除了更改桌面壁纸和图标显示方式外，你还可以更改\
    \ Linux Mint 的整体主题。从 Mint 菜单中，搜索“themes”并点击出现在搜索结果中的主题应用。\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_40_2.png)\n\
    \n- **步骤 8**\n  主题允许你更改 Mint 桌面某些方面的外观：窗口边框、图标、控件、鼠标指针和桌面。在设置标签中，你可以通过一些开关滑块按钮来扩展选项。\n\
    \n![](img/7801ba6bee6a3a08f7f02897cdbcd867_40_3.png)\n\n- **步骤 9**\n  如果你点击三个可用选项中间的添加/删除按钮，你可以从多个预安装主题中选择默认视图。点击你想要的主题，然后点击安装（向下指的箭头）按钮以启用它。\n\
    \n![](img/7801ba6bee6a3a08f7f02897cdbcd867_40_4.png)\n\n- **步骤 10**\n  点击回到主题，然后桌面，你可以找到新安装的主题并将其应用于你的桌面。任何已安装的主题也可以通过添加/删除按钮卸载。值得花一些时间按你想要的方式个性化你的桌面，也有一些令人难以置信的主题可供选择。\n\
    \n![](img/7801ba6bee6a3a08f7f02897cdbcd867_40_5.png)\n\n## 在线匿名\n\n数字时代带来了许多通信上的重大进步；然而，它也带来了新的监视和窥探时代。我们大多数人都对政府、秘密组织和地下黑客不断侵犯我们隐私的频繁新闻报道并不陌生，但你如何应对这种情况？\n\
    \n### 使用 MINT 获得匿名性\n\n虽然在线完全匿名几乎是不可能的，但你可以通过采取措施确保你的隐私达到最佳状态。\n\n- **步骤 1**\n\
    \  从基础开始，在浏览时使用 HTTPS 代替标准的 HTTP。这意味着通过 HTTPS 传输的任何内容都是安全的（因此末尾有 S）且经过加密。\n\n\
    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_41_0.png)\n\n- **步骤 2**\n  浏览时，考虑使用浏览器中可用的隐身或私人浏览模式。这会禁用你的网络历史和网页缓存，允许你浏览而不保存详细信息供他人稍后审查。然而，它不会阻止任何数据或搜索跟踪。\n\
    \n![](img/7801ba6bee6a3a08f7f02897cdbcd867_41_2.png)\n\n- **步骤 3**\n  虽然使用谷歌似乎是现代互联网搜索的明显选择，但该公司确实会跟踪个人进行的所有搜索。相反，考虑使用替代搜索引擎，如\
    \ DuckDuckGo，它是一款不存储个人数据或跟踪你的搜索引擎。\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_41_1.png)\n\
    \n- **步骤 4**\n  如果你经常上网，考虑安装一些增强隐私的浏览器插件。例如，对于 Firefox，使用 Ghostery、NoScript 和\
    \ Adblock Plus 来阻止跟踪器、广告和其他数据挖掘技术。\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_41_3.png)\n\
    \n### VPN 和 TOR\n\n前面的步骤有助于你的在线隐私，但要想真正匿名，你需要虚拟专用网络（VPN）和 Tor。\n\n- **步骤 1**\n\
    \  VPN 是远程服务器或服务器集群，它与你的电脑建立连接。最终结果是，你的电脑在互联网上的身份隐藏在 VPN 远程服务器后面；因此，你可以住英国，但拥有属于冰岛的\
    \ IP 地址（在线计算机身份）。\n\n- **步骤 2**\n  大多数优质 VPN 都收取月费或年费，但这项开支是值得的。我们使用 CyberGhost（www.cyberghostvpn.com），它为\
    \ Windows、Mac、Mint（以及其他 Linux 发行版）、Android 和 iOS 设备提供 VPN 连接。每个操作系统的详细信息可在 www.support.cyberghostvpn.com/hc/en-us/articles/213190329-Read-me-first\
    \ 找到。\n\n- **步骤 3**\n  另一种选择是使用 Tor。Tor 是一个开放网络，你可以连接该网络，它将你的 IP 地址隐藏在全球无数的节点后面。它适用于\
    \ Windows、Mac 和 Linux 计算机，安装和使用都非常简单。从访问 www.torproject.org/download/download-easy.html\
    \ 并点击下载 Linux 64 位按钮开始。\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_42_0.png)\n\
    \n![](img/7801ba6bee6a3a08f7f02897cdbcd867_42_1.png)\n\n- **步骤 4**\n  下载完成后，进入终端并进入下载文件夹，`cd\
    \ Downloads/`。输入 `ls` 检查 tar.xz Tor 文件是否存在，然后输入 `tar -xf tor-browser-1tlux64-8.0.4_en-US.tar.xz`（Tor\
    \ 定期更新，因此如果你的版本不同，请按 Tab 键自动补全 tor-browser= 文件名）。文件解包后，使用 `cd tor-browser-en-US/`\
    \ 进入新文件夹。\n\n- **步骤 5**\n  快速输入 `ls` 会显示几个条目；一个名为 Browser 的文件夹和一个名为 'start-tor-browser.desktop'\
    \ 的文件。要开始 Tor 设置，输入 `./start-tor-browser.desktop`。此命令启动 Tor 设置，提供两个选项：连接或配置。对于大多数用户，连接选项就足够了。准备好后点击连接。\n\
    \n![](img/7801ba6bee6a3a08f7f02897cdbcd867_42_2.png)\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_42_3.png)\n\
    \n- **步骤 6**\n  连接建立后，Tor 浏览器启动。这是 Firefox 的定制版本，从这里你可以安全地浏览互联网，而不用担心被查看或跟踪。同时使用\
    \ VPN 和 Tor 可提供极其安全和私密的在线世界连接。\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_42_4.png)\n\
    \n![](img/7801ba6bee6a3a08f7f02897cdbcd867_42_5.png)\n"
