  mdcn: '


    ## 最佳 Linux 发行版


    市面上有许多版本的 Linux，被称为发行版。每个发行版都有不同的理念和方案。以下是五个值得尝试的出色发行版以及获取它们的途径。


    ### 转向 Linux


    大多数发行版的安装过程都类似。你从网站下载磁盘映像，并将其刻录到光盘或制作 U 盘启动盘。请注意，务必获取适合你硬件的发行版，并仔细阅读说明。


    #### LINUX MINT


    目前最受欢迎的 Linux 发行版（distribution）无疑是 Linux Mint。Mint 诞生于 2006 年，最初是作为当时最流行的发行版 Ubuntu
    的替代品。尽管基于 Ubuntu 的长期支持（LTS）版本构建，但 Linux Mint 采取了不同的发展方向，为用户提供更出色的整体体验。


    随着核心操作系统新版本的发布，Linux Mint 提供三种主要的桌面版本。这听起来可能有些令人困惑，但其实很简单。目前，Linux Mint 使用 Cinnamon
    桌面环境作为其旗舰模式；同时也可选择 MATE 和 Xfce 模式。


    Cinnamon 是一个图形功能丰富的桌面环境，MATE 使用的图形特效较少，且在更广泛的桌面系统上更加稳定，而 Xfce 则是一个极其精简的桌面环境，专为速度和极致稳定性而设计。


    在本书中，我们将使用 Cinnamon 版本；不过，你可以尝试任何其他桌面环境，按你的意愿行事。事实上，建议你花一些时间尝试不同的环境，甚至不同的发行版，看看哪个最适合你和你的计算机。


    www.linuxmint.com


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_9_0.png)


    #### UBUNTU


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_9_1.png)


    第二款最受欢迎的发行版是 Ubuntu，这是一个古老的非洲词汇，意为“对他人的仁爱”。Ubuntu 在其十四年的历史中，受欢迎程度起伏不定。曾有一段时间，它是世界上最常用的基于
    Linux 的操作系统，但关于其界面呈现的一些错误选择，以及涉及隐私的一些不利且具争议的元素，遗憾地导致它从第一的位置跌落。


    话虽如此，Ubuntu 后来进行了弥补，正缓慢地重新攀登 Linux 排行榜。该操作系统的最新版本使用 GNOME 3 桌面环境，这是一个令人印象深刻的桌面环境，尽管对于前
    Windows 用户来说可能略显困惑，且对系统资源占用稍重，尤其是如果你计划将其安装在较旧的电脑上。


    尽管有诸多不足，Ubuntu 仍是一个适合开始尝试的好的 Linux 发行版。它拥有简洁的界面，易于使用和安装，并为用户提供完整的 Linux 体验。


    www.ubuntu.com


    #### ARCH


    Arch 是历史最悠久的 Linux 发行版之一，也是许多其他 Linux 版本的基础。为什么安装了 Arch 就不用安装 Mint 或 Ubuntu 了呢？许多用户确实是这样做的，但这并不适合初学者。Ubuntu
    和 Mint 都提供了更简单的安装路径，并附带软件包以帮助你起步。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_10_0.png)


    Arch 是当你拥有更多 Linux 经验时的选择。你从只有命令行的状态开始，然后必须手动分区硬盘、设置安装文件的位置、创建用户、设置操作系统区域设置，最后安装桌面环境以及你需要的应用。


    相比之下，Arch 更偏向“极简主义”。Arch 致力于自由软件，其软件库包含超过 50,000 个可安装的应用，包括多种不同的桌面环境，你可以像使用其他发行版一样使用它们。


    然而，这些努力的优势在于，你拥有一个自己创建的发行版。这意味着你的 Arch 发行版不会包含其他人预安装的所有不必要的文件和应用；它是由你为你量身定做的。


    www.archlinux.org


    #### RASPBERRY PI DESKTOP


    你无疑听说过树莓派（Raspberry Pi）。这并不奇怪，因为这款惊人且小巧的计算机在过去六年的技术世界中引起了轰动。


    树莓派有几个方面使其成为计算世界中备受追捧的产品之一。首先，它很便宜，本质上是一台功能完整的计算机，成本仅约 25 英镑。它很小，尺寸比信用卡大不了多少。你可以使用其完全可编程接口进行电子制作；它附带
    Raspbian，这是其自制的、基于 Debian 的操作系统，包含办公套件以及多种编程语言和教育资源。


    Raspbian 专为树莓派硬件设计，因为树莓派使用 ARM 处理器进行驱动。然而，树莓派基金会后来发布了 Raspbian 的 PC 版本：Raspberry
    Pi Desktop。


    与树莓派版本一样，Raspberry Pi Desktop 附带所有你所需的编码、教育及其他应用。它快速、稳定且表现出色。如果你对扩展你的 Linux 经验感兴趣，这绝对是值得考虑的顶级发行版之一。


    www.raspberrypi.org/downloads/raspberry-pi-desktop


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_10_1.png)


    #### OPENSUSE


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_10_2.png)


    大多数 Linux 发行版分为两类。一类是拥有最新功能和技术，如 Ubuntu 和 Mint；另一类则是新特性较少但极其可靠，如 Debian。


    与此同时，openSUSE 试图兼顾两者。OpenSUSE Leap 是那个极其稳定的系统。它由社区和 SUSE 员工共同公开开发，SUSE 开发企业级操作系统
    SUSE；该系统为伦敦证券交易所等机构提供支持。它专为关键任务环境设计，在这些环境中不允许任何不稳定性。如果你觉得这一切太保守了，openSUSE Tumbleweed
    是一个滚动发布版本，拥有所有最新功能，偶尔也会出现崩溃。


    openSUSE 是一个备受尊敬的 Linux 发行版，其许多核心贡献者都在 Linux 内核、LibreOffice、Gnome 和其他关键 Linux
    领域工作。简而言之，openSUSE 是专业人士聚集的地方。


    www.openSUSE.org


    ## 向 Linux 问好


    ### 你需要的设备


    在 PC 上成功安装 Linux Mint 的系统要求出乎意料地低，因此即使是几年前的电脑也能愉快地运行此发行版。不过，在继续之前，值得检查你是否已具备所有条件。


    #### MINT 原料


    在我们开始探索这本书之前，以下是安装和运行 Linux Mint 所需的东西。你有几种选择，所以请花点时间看看哪种最适合你。


    #### 系统要求


    Linux Mint 的最低系统要求如下：


    - CPU – 700MHz

    - RAM/内存 – 512MB

    - 硬盘空间 – 9GB（建议 20GB）

    - 显示 – 1024 x 768 分辨率


    显然，你的系统越好，体验就越出色，速度也越快。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_11_0.png)


    #### USB 安装


    你可以通过 USB 或 DVD 将 Linux Mint 安装到电脑上。我们在稍后会详细探讨这两种方式，但如果你已经熟悉该过程，或者正在考虑使用 USB 并只需收集所需的硬件，那么你需要一个至少
    4GB 的 USB 闪存盘来存储 Linux Mint ISO。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_11_1.png)


    #### DVD 安装


    通过 DVD 安装 Linux Mint 只需一张空白 DVD-R 光盘。当然，在将 ISO 映像传输或刻录到光盘之前，你还需要一个光驱（DVD 刻录机）。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_11_2.png)


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_12_0.png)


    #### 虚拟环境


    在虚拟环境中安装是测试和使用 Linux 发行版的流行方法。Linux Mint 在虚拟环境中运行得非常好，稍后我们会更多讨论这一点。有许多不同的虚拟环境应用可用；然而，来自
    Oracle 的 VirtualBox 是最易于使用的一款。你可以在 www.virtualbox.org 找到最新版本。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_12_1.png)


    #### 互联网连接


    不言而喻，互联网连接对于确保 Linux Mint 保持最新更新和补丁，以及安装更多软件至关重要。虽然使用 Linux Mint 不需要互联网连接，但你将错过该发行版提供的海量免费软件。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_12_2.png)


    #### MAC 硬件


    虽然可以将 Linux Mint 安装到 Mac 上，但有一派观点建议 Mac 用户使用虚拟环境，如 VirtualBox 或 Parallels；为什么不呢，macOS
    本身已经是一个出色的操作系统。如果你想为旧 Mac 注入新活力，请确保它是 Intel CPU 型号，而不是 Power PC 型号。不过请注意，在 Mac
    上安装并不像在 PC 上安装那样轻松。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_12_3.png)


