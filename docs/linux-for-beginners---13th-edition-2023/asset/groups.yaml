    ## 开始使用 Linux


    > “在真正的开源世界中，你拥有掌控自己命运的权利。”

    >

    > – 林纳斯·托瓦兹

    > *（Linux 内核的开发者）*


    谈论 Linux 有多好固然不错，但如何将它安装到你的电脑上呢？安装 Linux 非常简单，但你有多种选择。本节将探讨如何下载 Linux ISO 镜像、将其作为主操作系统安装在
    PC 上，甚至如何安装虚拟环境。


    借助虚拟环境，你可以在继续使用主操作系统（无论是 Windows 还是 macOS）的同时运行 Linux。感兴趣吗？请继续阅读，了解更多详情。


    ### 在 Windows 上创建 Linux 安装介质


    在安装 Linux 到电脑之前，你需要将下载好的 Linux ISO 文件传输到 DVD 光盘或 USB 闪存盘中。这将是一个实时环境（Live Environment），允许你在安装前测试操作系统，但首先你需要创建可启动的介质。


    #### DVD 可启动介质


    我们使用一台 Windows 10 电脑将 ISO 文件传输到 DVD 上。如果你使用的是 Windows 7 或更高版本，这个过程极其简单。


    - **步骤 1** 首先找到你已经下载的 Linux ISO 镜像文件。通常你可以在 Windows 7、8.1 和 10 电脑的“下载”文件夹中找到它，除非你在保存时指定了其他位置。


    - **步骤 2** 接下来，将一张可刻录 DVD 光盘插入电脑的光驱。几秒钟后，当光盘被读取时，Windows 会弹出一个消息框，询问你对新插入的光盘要做什么。请忽略此提示，因为我们将使用内置的镜像刻录功能。


    - **步骤 3** 右键点击 Linux ISO 文件，从菜单中选择“刻录磁盘映像”。根据电脑的速度，可能需要几秒钟才能有任何反应。不要担心太多，除非它超过一分钟仍未响应，如果是这种情况，重启电脑并再次尝试可能值得一试。幸运的是，Windows
    磁盘映像刻录程序应该会自动启动。


    - **步骤 4** 在“Windows 磁盘映像刻录”对话框打开后，勾选“刻录后验证磁盘”复选框，然后点击“刻录”按钮。根据电脑光驱的速度，这个过程可能需要几分钟。完成后，系统将进入验证阶段，验证结束后，光驱应该会自动弹出光盘。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_19_0.png)


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_19_1.png)


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_19_2.png)


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_19_3.png)


    #### USB 可启动介质


    USB 介质比 DVD 更快，而且通常更方便，因为大多数现代电脑都没有安装光驱。传输映像的过程很简单，但你首先需要第三方应用程序以及一个 4GB 或更大容量的
    USB 闪存盘。


    - **步骤 1** 首先打开网页浏览器，访问 [www.rufus.akeo.ie](http://www.rufus.akeo.ie/)。向下滚动页面一点，你会看到“下载”标题，下面就是最新版本的
    Rufus。左键点击该链接开始下载。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_20_0.png)


    - **步骤 2** 双击下载好的 Rufus 可执行文件，对 Windows 安全询问选择“是”，对检查更新也选择“是”。Rufus 启动后应该已经识别出你插入的
    USB 闪存盘；如果没有，只需将其拔出再重新插入即可。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_20_2.png)


    - **步骤 3** 乍一看，Rufus 的界面可能有点令人困惑，但别担心，它其实相当简单。首先，点击“磁盘或 ISO 映像（请选择）”下拉菜单旁边的“选择”按钮。这将打开一个
    Windows 资源管理器窗口，你可以在其中找到并选择 Linux ISO 文件。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_20_4.png)


    - **步骤 4** 准备就绪后，点击 Rufus 应用底部的“开始”按钮。这可能会打开另一个对话框，询问你是否要下载并使用新版本的 SysLinux。SysLinux
    是一组引导加载程序，用于允许现代电脑通过 USB 闪存盘访问和启动。这是必要的，因此如果系统询问，请点击“是”继续。


    > 此映像使用 syslinux 6.03/20151222，但此应用程序仅包含 SysLinux 6.03/2014-10-06 的安装文件。

    >

    > 由于新版本的 SysLinux 彼此不兼容，且 Rufus 无法包含所有版本，因此必须从互联网下载两个额外的文件（''ldlinux.sys'' 和 ''ldlinux.bss''）：

    > - 选择“是”以连接到互联网并下载这些文件

    > - 选择“否”以取消操作

    >

    > 注意：这些文件将下载到当前应用程序目录，如果文件已存在，系统将自动重用它们。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_20_1.png)


    - **步骤 5** 下一步询问你希望将 Linux ISO 以何种映像模式写入 USB 闪存盘。两种方法适用于不同的情况，但通常，推荐的 ISO 映像模式更为流行。确保已预选此模式，点击“确定”继续，然后再次点击“确定”以确认操作。


    > 检测到 ISO\hybrid 映像

    >

    > 你选择的映像是一个“ISO\hybrid”映像。这意味着它可以以 ISO 映像（文件复制）模式或 DD 映像（磁盘映像）模式写入。Rufus 建议使用
    ISO 映像模式，这样你在写入后始终可以完全访问该驱动器。

    >

    > 然而，如果你在启动过程中遇到问题，可以再次尝试以 DD 映像模式写入此映像。

    >

    > 请选择你要用于写入此映像的模式：

    > - 以 ISO 映像模式写入（推荐）

    > - 以 DD 映像模式写入


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_20_3.png)


    - **步骤 6** Linux ISO 现在已传输到 USB 闪存盘。根据 USB 设备和电脑的速度，这个过程不会花太长时间。你可能会发现 Rufus 在过程中自动在
    Windows 资源管理器中打开了 Linux 驱动器；别担心，如果你想的话可以将其最小化或关闭。当过程完成后，点击“关闭”按钮。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_20_5.png)


    ### 在 PC 上安装 Linux


    大多数 Linux 发行版都提供实时环境（Live Environment）。这意味着你可以直接从刚才创建的 DVD 或 USB 启动进入一个实际、完全可运行的发行版。让我们看看它是如何工作的，以及如何从那里安装
    Linux。


    #### UEFI BIOS


    统一可扩展固件接口（UEFI）用于识别硬件并在 PC 启动过程中对其进行保护。它取代了传统的 BIOS，但在安装 Linux 时可能会引起一些问题。


    - **步骤 1** 将你的 DVD 或 USB 闪存盘插入电脑，如果你还没有这样做的话，请关闭 Windows。在本例中，我们使用的是 USB 启动介质，但过程几乎完全相同。启动电脑，当被提示时，按相应的键进入
    BIOS 或 SETUP，例如：F2、Del 甚至 F12。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_21_0.png)


    - **步骤 2** 由于 UEFI BIOS 有不同的版本，因此涵盖所有版本是不可能的。你需要寻找的是详细说明启动顺序（Boot Sequence）或启动模式（Boot
    Mode）的部分。在这里，你可以选择关闭 UEFI 并选择传统模式（Legacy），或者禁用安全启动（Secure Booting）。大多数发行版都可以与
    UEFI 配合工作，但启用它进行启动可能是一个棘手的过程。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_21_2.png)


    - **步骤 3** 将 UEFI 设置为传统模式后，现在有两种方式可以进入实时环境。第一种是通过你当前所在的 BIOS。找到启动顺序，将第一个启动设备从其原始设置（通常是内部
    HDD 或类似项）更改为：对于 USB 介质选项，选择“USB 存储设备”；对于 DVD 介质选项，选择“DVD 驱动器”。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_21_1.png)


    - **步骤 4** 或者，使用启动选项菜单。通过此选项，你可以按 F12（或类似按键）来显示启动介质选项列表；然后，你可以从中选择合适的启动介质。无论如何，你都可以导航到“保存并退出”选项，并选择“保存更改并退出”来保存并退出
    BIOS。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_21_3.png)


    '
