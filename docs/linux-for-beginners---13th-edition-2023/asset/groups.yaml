    ## Linux 技巧与窍门


    如您所见，Linux 终端是一个相当非凡的环境。安装几个额外的应用程序，并掌握一点点命令知识，就能完成令人惊叹、有时甚至颇为奇特的事情。


    ### 掌握命令


    市面上有无数 Linux 技巧、秘密、漏洞和窍门。有些非常古老，源于 Linux 的 Unix 传承；而有些则是 Linux  lore 的最新补充。以下是我们最喜欢的十个技巧与窍门。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_63_0.png)


    ```bash

    sudo apt-get install emacs25

    emacs -batch -l dunnet

    ```


    Dunnet 是 Ron Schnell 于 1982 年编写的文字冒险游戏，自 1994 年起便隐藏在 Emacs 之中。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_63_1.png)


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_63_2.png)


    ```bash

    sudo apt-get install elinks

    elinks

    ```


    输入您想要访问的网站。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_63_3.png)


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_63_4.png)


    ```bash

    sudo apt-get install moon-buggy

    moon-buggy

    ```


    然后：


    享受吧。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_63_5.png)


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_63_6.png)


    ```bash

    wget https://gist.githubusercontent.com/sontek/1505483/raw/7d042716ea57e69fb52632fee09f42753361c4a2/snowjob.sh

    chmod +x snowjob.sh

    ./snowjob.sh

    ```


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_63_7.png)


    ### 内存占用大户


    如果您需要查看哪些应用程序在 Linux 上消耗了最多的内存，只需输入：


    ```bash

    ps aux | sort -rnk 4

    ```


    这将按系统内存使用情况对输出进行排序。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_64_0.png)


    ### 粉碎器


    当您删除一个文件时，拥有合适软件的人有可能将其恢复。然而，若要安全且永久地删除文件，请使用 Shred：


    ```bash

    shred -zvu NAMEOFFILE.txt

    ```


    将 **NAMEOFFILE** 替换为要删除的文件名。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_64_1.png)


    ### ASCII 艺术


    应用于某些图像时，ASCII 艺术可以非常引人注目。然而，往往很难把握得恰到好处。您可以使用 img2txt 从现有的图像创建出色的 ASCII 艺术：


    ```bash

    img2txt NAMEOFIMAGEFILE.png

    ```


    将 **NAMEOFIMAGEFILE** 替换为您系统上图像文件的实际名称。如果未安装 img2txt，请使用：


    ```bash

    sudo apt-get install caca-utils

    ```


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_64_2.png)


    ### BBS


    回到拨号上网时代，在线世界由公告板系统（Bulletin Board Systems）构成。这些远程服务器提供了用户聊天、交换代码、玩游戏等的场所。在 Linux
    中使用 telnet，我们仍可以连接到一些活跃的 BBS：


    ```bash

    telnet battles.tarbbs.dyndns.org

    ```


    有大量仍在运行的 BBS，请查阅 **https://www.telnetbbsguide.com/bbs/list/detail/** 以获取更多信息。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_64_3.png)


    ### 目录树


    如果您想用一条命令创建整个目录（或文件夹）树，可以使用：


    ```bash

    mkdir -p New-Dir/{subfolder1, subfolder2, subfolder3, subfolder4}

    ```


    这将创建一个名为 New-Dir 的目录，其中包含四个子文件夹。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_64_4.png)


    ### 遗忘的命令


    记住所有可用的 Linux 命令并不容易。幸好，我们可以使用 apropos 来帮忙。只需将其与命令的描述一起使用：


    ```bash

    apropos "copy files"

    apropos "rename files"

    ```


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_64_5.png)


    ## Linux 与大爆炸


    Linux 正在碰撞粒子，因此我们可以理解宇宙是如何运作的。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_65_0.png)


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_66_0.png)


    ### 你知道吗……


    Linux 位于大型强子对撞机（LHC）背后科学技术的核心。选用红帽 Linux 和 CentOS（基于红帽核心构建的超稳定发行版）的组合作为首选基础发行版，科学家、开发者和工程师创建了
    SL – 科学 Linux。


