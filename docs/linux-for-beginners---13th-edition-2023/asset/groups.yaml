    # Creating a File Using the Terminal


    Using the Terminal, you’re able to create folders, files and even execute Linux
    Mint apps. In truth, if you didn’t have the GUI at hand, you could still accomplish
    the same from the Terminal.


    # MORE TERMINAL WORK


    Creating content using the Terminal isn’t quite as strenuous as it may first appear.
    Yes, the Terminal can look a daunting place for the newcomer, but once mastered
    it’s really quite intuitive.


    **STEP 1** Open up the Terminal, and make sure you’re in the Home folder. If not
    use the **cd ~** command to return you to the Home folder from wherever you’re
    currently located.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_55_0.png)


    **STEP 3** Your command line should change to the Test folder and if you enter
    **ls** (List folder contents) there’ll be nothing within the folder; as you’ve
    just created it. The **mkdir** command is fairly self explanatory: Make Directory
    followed by the name of your choosing.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_55_1.png)


    **STEP 2** Let’s start by creating a new folder within Home, and call it **Test**.
    The command you’ll need is **mkdir Test**. Press **Enter** to create the folder
    when you’ve typed in the command, then **cd Test** and press **Enter**. This will
    Change Directory (hence **CD**) to the newly created Test folder.


    **STEP 4** To create an empty text file, called **Test.txt**, enter in the Terminal:
    **touch Test.txt**. You can then use **ls** to view the new file in the folder.
    Touch is a standard Linux command that allows the creation of files without the
    need to open a text editor, save the file, then close the editor.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_55_2.png)


