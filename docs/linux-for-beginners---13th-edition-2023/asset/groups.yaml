    ## 安装 LINUX


    当 Live 环境启动后，你将看到将发行版安装到计算机的选项。先四处看看，当你准备好后，在桌面上寻找“安装”选项。


    ### 步骤 1


    确保你已连接互联网（如果没有，请现在连接），并且你处于 Live 环境中。通过双击桌面上的 **Install Linux Mint** 图标开始安装过程。当然，其他发行版会显示它们自己的名称，但过程是一样的。准备好后，点击
    **Continue**（继续）。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_22_0.png)


    ### 步骤 2


    尽管大多数 Linux 发行版的安装过程非常相似，但有些发行版在安装过程中会提出不同的问题。通常，这些问题并不难，没有什么非常技术性的内容，但像“安装第三方软件……？”这样的问题可能会让人困惑。在这种情况下，你可以点击
    **Continue**（继续），但如果你不确定，请准备一台连接互联网的设备以咨询相关问题。


    ### 步骤 3


    在安装新的操作系统时，建议清除旧的系统并用新系统替换它。当你到达安装过程的这个阶段时，确保选中“**Erase disk and install Linux...**”（擦除磁盘并安装
    Linux……）选项。注意：这会完全清除计算机中的 Windows 10，因此请确保已备份所有个人文件和数据。


    ### 步骤 4


    在安装过程开始之前，系统会询问你关于硬盘擦除的选择是否正确。这是你最后反悔的机会。如果你确定不介意清除一切并使用 Linux Mint 重新开始，请点击 **Continue**（继续）。如果你需要备份文件，请移除
    Linux Mint 光盘/USB 驱动器，重启计算机，备份文件并重新开始。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_22_1.png)


    ### 步骤 5


    最终，系统会要求你设置 Linux 用户名和密码。首先输入你的姓名，然后是计算机名称，即其在网络中识别的名称。接下来选择一个用户名，然后设置一个好的密码。你可以勾选“**Login
    Automatically**”（自动登录）选项，但暂时保留“**Encrypt Home Folder**”（加密主文件夹）选项。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_22_2.png)


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_22_3.png)


    ### 步骤 6


    安装过程可能很快，可能会有更多问题需要回答，或者它可能直接根据你之前的回答开始安装 Linux。无论哪种情况，最终你都会被要求选择**继续测试 Live 环境**或**重启**以使用新安装的操作系统。如果你准备好使用
    Linux，请点击 **Restart Now**（立即重启）。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_22_4.png)


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_22_5.png)


    ## 安装虚拟环境


    虚拟环境是一个模拟的计算机系统。使用虚拟机，你可以模拟标准 PC 并在其中安装完整的操作系统，而不会影响安装在你的计算机上的系统。这是一种测试和使用 Linux
    的好方法，同时仍保留 Windows 10 作为主要操作系统。


    ### 进入虚拟化


    使用虚拟机（VM）会消耗计算机的资源：内存、硬盘空间、处理器使用率等。在开始之前，请确保你拥有足够的资源。


    ### 步骤 1


    在这种情况下，我们使用 VirtualBox，因为它是入门最简单的虚拟环境之一。进入 www.virtualbox.org 并点击“**Download VirtualBox**”（下载
    VirtualBox）。这将带你前往主下载页面。找到适合你系统的正确主机：Windows 或 Mac，主机即当前安装的操作系统，点击链接开始下载。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_23_0.png)


    ### 步骤 2


    接下来，仍在 VirtualBox 下载页面，找到 VirtualBox 扩展包链接。扩展包支持 USB 设备以及许多其他有助于使虚拟机环境更准确地模拟“真实”计算机的附加功能。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_23_2.png)


    ### 步骤 3


    在下载正确的软件包后，在安装任何内容之前，你需要确保你使用的计算机能够托管虚拟机。为此，重启计算机并进入 BIOS。当计算机启动时，按 Del、F2 或任何必要的键进入设置。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_23_1.png)


    ### 步骤 4


    每个 BIOS 的布局都不同，很难评估在每个个人示例中该看哪里。然而，作为一般规则，你要寻找 Intel 虚拟化技术（或简称虚拟化），通常位于 BIOS 的高级部分。找到后，启用它，保存设置，退出
    BIOS 并重启计算机。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_23_3.png)


    ### 步骤 5


    当计算机重新启动并运行后，找到已下载的主要 VirtualBox 应用程序并双击开始安装过程。准备好后，点击 **Next**（下一步）继续。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_24_0.png)


    ### 步骤 6


    VirtualBox 的默认安装位置应能满足大多数用户，但如果你有特殊的安装位置需求，点击“**Browse**”（浏览）按钮并更改安装文件夹。然后，确保
    VirtualBox 功能树中的所有图标都被选中，即它们旁边没有红色 X。点击 **Next**（下一步）继续。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_24_1.png)


    ### 步骤 7


    如果你愿意，此部分可以保留默认设置，它只是让处理虚拟机更容易，特别是处理下载的虚拟机时，你未来可能会遇到这种情况。同样，点击 **Next**（下一步）进入下一阶段。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_24_2.png)


    ### 步骤 8


    在安装 VirtualBox 时，你的网络连接会在非常短的时间内被禁用。这是由于 VirtualBox 正在创建联动的虚拟网络连接，以便任何已安装的虚拟机都能通过计算机已建立的网络连接访问互联网和家庭网络资源。点击
    **Yes**（是），然后点击 **Install**（安装）开始安装。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_24_3.png)


    ### 步骤 9


    Windows 可能会要求你接受安全通知。对此点击 **Yes**（是），你可能会遇到一个对话框要求你信任来自 Oracle 的安装；同样，点击 **Yes**（是）并接受
    VirtualBox 应用程序的安装。完成后，点击 **Finish**（完成）以启动 VirtualBox。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_24_4.png)


    ### 步骤 10


    当 VirtualBox 启动并运行后，你现在可以安装 VirtualBox 扩展包。找到已下载的附加组件并双击。在 VirtualBox 分析软件包时可能会有一小段暂停，但你最终会收到安装提示；显然点击
    **Install**（安装）开始过程，滚动到下一个屏幕同意协议并点击 **I Agree**（我同意）。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_24_5.png)


    ## 在虚拟环境中安装 Linux


    随着 Oracle VirtualBox 启动并运行，下一个任务是创建你将要安装 Linux 的虚拟机（VM）环境。此过程不会影响你当前安装的操作系统，这就是为什么虚拟机是一个很好的选择。


    ### 创建虚拟机


    在创建虚拟机时有很多选项可供选择。不过，目前我们将设置一个足以运行优秀的 Linux Mint 并且性能良好的虚拟机。


    **步骤 1** 打开 VirtualBox，点击应用程序右侧面板顶部的“**New**”（新建）图标。这将打开新建虚拟机向导。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_25_0.png)


    **步骤 2** 在“**Name**”（名称）框中键入 Linux Mint，VirtualBox 应该会自动选择 Linux 作为类型，Ubuntu (64-bit)
    作为版本；如果没有，请使用下拉框选择正确的设置（请记住，Mint 主流版本基于 Ubuntu）。准备好继续时，点击 **Next**（下一步）。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_25_1.png)


    **步骤 3** 下一部分将定义分配给虚拟机的系统内存（或 RAM）数量。记住，这部分内存将从你计算机中安装的可用内存中扣除，所以不要给虚拟机分配太多。例如，我们安装了
    8GB 内存，我们将 2GB (2048MB) 分配给虚拟机。准备好后，点击 **Next**（下一步）继续。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_25_2.png)


    **步骤 4** 在此部分，你将开始创建虚拟机用于安装 Mint 的虚拟硬盘。默认选项“**Create a virtual hard disk now**”（现在创建虚拟硬盘）是我们正在使用的选项。点击
    **Create**（创建）继续。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_25_3.png)


