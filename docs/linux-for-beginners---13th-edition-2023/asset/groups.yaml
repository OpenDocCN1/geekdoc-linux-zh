    # Why Linux?


    For many of its users, Linux means freedom. Freedom from the walled garden approach
    of other operating systems, freedom to change and use the OS as you please and
    freedom from any form of licensing or payment. There’s a lot more to Linux than
    you may think though.


    # FREE AND OPEN


    Linux is a fantastic fit for those who want something different. **The efficiency
    of the system, the availability of applications and stability are just a few good
    reasons.**


    The first thing you need to know is that there is no such operating system called
    Linux. Linux is in fact the operating system kernel, the core component of an
    OS. When talking about Linux what we, and others, are referring to are one of
    the many distributions, or distros, that use the Linux kernel. No doubt you''ve
    heard of at least one of the current popular distros: Ubuntu, Linux Mint, Fedora,
    openSUSE, Debian, Raspbian, the list goes on. Each one of these distros offer
    something a little different for the user. While each has the Linux kernel at
    its core, they provide the user with a different looking desktop environment,
    different preloaded applications, different ways in which to update the system
    and get more apps installed and a slightly different look and feel throughout
    the entire system. However, at the centre lies Linux, which is why we say Linux.


    Linux works considerably differently to Windows or macOS. It''s free for a start:
    free to download, free to install on as many computers as you like, free to use
    for an unlimited amount of time and free to upgrade and extend with, equally,
    free programs and applications. This free to use element is one of the biggest
    draws for the developer. While a Windows license can cost up to £100, and a Mac
    considerably more, a user, be they a developer, gamer or someone who wants to
    put an older computer to use, can quickly download a distro and get to work in
    a matter of minutes.


    Alongside the free to use aspect comes a level of freedom to customise and mould
    the system to your own uses. Each of the available distros available on the Internet
    have a certain ‘spin’,


    Linux is a great operating system on which to start coding.


