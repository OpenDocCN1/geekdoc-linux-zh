    ## 创建 Bash 脚本 – 第 2 部分


    此前我们探讨了如何创建你的第一个 Bash 脚本（Hello World）以及添加系统变量。现在你可以在此基础上进行扩展，看看当开始创建自己独特的变量时能实现哪些功能。


    ### 变量


    与其他所有编程语言一样，Bash 脚本可以从系统中存储和调用某些变量，这些变量可以是通用的，也可以是由用户创建的。


    - **步骤 1** 让我们先创建一个名为 `hello.sh` 的新脚本；执行 `xed hello.sh`。在其中输入：`#!/bin/bash`，然后是
    `echo Hello $1`。保存文件并退出 Xed。回到终端，使用以下命令使脚本可执行：`chmod +x hello.sh`。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_69_0.png)


    - **步骤 2** 由于脚本现在已可执行，请使用 `./hello.sh` 运行它。现在，正如你预期的那样，终端中显示了一个简单的“Hello”。然而，如果你随后带上一个变量发出该命令，事情就开始变得有趣了。例如，尝试运行
    `./hello.sh David`。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_69_2.png)


    - **步骤 3** 现在的输出将是 Hello David。这是因为 Bash 自动为用户分配变量，然后这些变量会被保留并传递给脚本。因此，变量 ‘$1’
    现在持有了 ‘David’。你可以通过输入不同的内容来更改变量：`./hello.sh Mint`。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_69_1.png)


    - **步骤 4** 你甚至可以重命名变量。使用以下内容修改 hello.sh 脚本：`firstname=$1, surname=$2`，`echo Hello
    $firstname $surname`。将每个语句放在新的一行上。保存脚本并退出回到终端。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_69_3.png)


    - **步骤 5** 现在运行脚本时，你可以使用两个自定义变量：`./hello.sh David Hayward`。自然地，你可以用你自己的名字替换这两个变量；除非你也叫
    David Hayward。目前我们只是在打印内容，所以让我们稍微扩展一下双变量的用法。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_69_4.png)


    - **步骤 6** 创建一个名为 **addition.sh** 的新脚本，使用与 hello.sh 脚本相同的格式，但更改变量名。这里我们添加了 **firstnumber**
    和 **secondnumber**，并使用 echo 命令通过放置整数表达式来输出一些简单的算术运算，echo **The sum is $((firstnumber+$secondnumber))**。保存脚本，并使其可执行
