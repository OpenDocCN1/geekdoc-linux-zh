    # Pi x Linux = The Perfect Combination


    # WHICH PI?


    There are several Raspberry Pi models available, with each offering something
    slightly different from the others. The most recent Pi released is the Raspberry
    Pi 4 Model B, and while this model is slightly more expensive than some of the
    other examples, it is the most powerful and feature-rich Pi available. Overall,
    it''s probably best to start experimenting with the Pi using the Pi 4 Model B,
    then moving on to one of the other models as you develop your skills and focus
    on a particular project, such as the need to use one of the Pi Zero models, with
    a smaller footprint and WIFI enabled connectivity.


    +   - The Pi 3 Model A+ was released in November 2018 and greatly improves over
    the previous Model A.

    +   - The Raspberry Pi 3 Model B+ is one of the best Pi models available.

    +   - The Raspberry Pi Zero W, with built-in Wi-Fi and Bluetooth, is a great project
    Pi.

    +   - Of the Pi models available, we''d recommend the Pi 4 Model B, Pi 3 Model
    B+ and Pi Zero W.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_78_0.png)


    # BEYOND THE RASPBERRY PI OS


    The flexibility of the Raspberry Pi''s ARM processor means that it''s capable
    of running other operating systems beyond it''s default Raspberry Pi OS. Still
    keeping with Linux, you can instead install Ubuntu MATE, PIDora (a Fedora-based
    distribution), Lakka, PIPlay (a retro emulation distribution) and Arch Linux ARM.
    There are also systems based loosely on the Linux kernel, such as Android, Symbian,
    and Chromium OS. There''s Windows 10 IoT Core, FreeBSD, RISC OS Pi, Plan 9 and,
    remarkably, AROS - an Amiga OS clone. Needless to say, that once you''ve finished
    experimenting with one version of Linux, just as you would with a desktop version
    of Linux, you can hop to another on the Raspberry Pi and see how that one works,
    and whether it will work for you.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_78_1.png)


    # PI, LINUX AND CODING


    As previously mentioned, the Raspberry Pi is an excellent code base, and with
    Linux as the backbone you''re able to start learning how to code in a multitude
    of different programming languages. Bash scripting works perfectly, since Raspbian
    is Linux, and Debian-based, and you can easily expand your scripts to encompass
    much of the Pi''s functionality. Aside from creating backup scripts, you can also
    create scripts that access the GPIO pins on the Pi and in so be able to control
    LEDS, and even more complex HATS.


    Python is by far the most popular choice for beginners, and Raspbian comes pre-installed
    with everything you will need to get the most from your Python experience. There
    are countless pre-loaded modules, as well as the most recent stable release of
    the language.


    C++ is one of the most powerful programming languages to learn. It''s used for
    games, apps, and even entire operating systems. The Raspberry Pi comes with a
    great C++ editor, that''s easy to use and can help you develop amazing content.
    Whichever way you decide to take your coding and Linux adventure, the Raspberry
    Pi is an excellent platform from which to begin on.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_78_2.png)'
