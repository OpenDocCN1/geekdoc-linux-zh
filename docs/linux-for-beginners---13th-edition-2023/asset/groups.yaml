    \ `look4.sh` 的新脚本，输入以下截图中的内容。\n\n## 创建 Bash 脚本 – 第 5 部分\n\n### 步骤 5\n\n执行该脚本时，它会等待用户输入，在这种情况下是文件扩展名，例如\
