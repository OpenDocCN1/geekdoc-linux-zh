    # 在虚拟环境中安装 Linux


    ## 步骤 5


    点击“创建”后出现的弹出窗口会询问您希望创建哪种类型的虚拟硬盘。在本例中，我们将使用默认的 VDI（VirtualBox 磁盘映像），因为其他类型通常用于将虚拟机从一个虚拟机应用程序迁移到另一个应用程序。请确保选中
    VDI，然后点击“下一步”。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_26_0.png)


    ## 步骤 6


    关于选择动态分配还是固定大小虚拟硬盘的问题，对于初学者来说可能略显困惑。基本上，动态分配的虚拟硬盘是一种更灵活的存储管理选项。起初，它也不会占用物理硬盘上太多的空间。请确保选中“动态分配”，然后点击“下一步”。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_26_2.png)


    ## 步骤 7


    虚拟硬盘将是一个单独的文件夹，大小上限即为您在此部分指定的数值。请确保您的计算机上虚拟硬盘所在的存储位置有足够的可用空间。例如，我们在 D:\ 驱动器上使用了一个较大的存储选项，将其命名为
    Linux Mint，并为虚拟硬盘分配了 25.50GB 的空间。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_26_4.png)


    ## 步骤 8


    点击“创建”后，虚拟机的初始设置即告完成；您现在应该能在 VirtualBox 应用程序中看到新创建的虚拟机。不过，在开始之前，请右键面板顶部的“设置”按钮，然后在“常规”部分点击“高级”选项卡。使用下拉菜单，将共享剪贴板和拖放都设置为“双向”。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_26_1.png)


    ## 步骤 9


    接着点击“系统”部分，然后点击“处理器”选项卡。根据您的 CPU 配置，在不妨碍宿主系统性能的前提下分配尽可能多的核心；我们选择了两个 CPU。现在点击“显示”部分，将视频内存滑到最大值，并勾选“启用
    3D 加速”。点击“确定”以保存新的设置。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_26_3.png)


    ## 步骤 10


    点击“启动”按钮，并在“选择启动磁盘”窗口中使用资源管理器按钮（资源管理器按钮是一个带有绿色箭头的文件夹）。在新弹出的窗口中点击“添加”，以定位已下载的 Mint
    ISO 文件；然后点击“打开”以选择该 ISO。现在点击“启动”按钮，使用 Linux Mint 实时环境启动虚拟机。现在，您可以按照标准 PC 安装要求安装
    Linux 了。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_26_5.png)


    > “任何人都可以制造出快速的处理器。关键在于制造出快速的系统。”

    >

    > – Seymour Cray（电气工程师，Cray 超级计算机的设计者/创始人）


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_27_0.png)


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_28_0.png)


    # 认识 Linux


    我们在此使用 Linux Mint 作为参考，因为它是一个易于使用的发行版，非常适合前 Windows 用户。它也是开发最完善、文档最齐全的 Linux 发行版之一，并且拥有一些出色的配置选项。


    在本节中，我们将介绍 Linux Mint 的 Cinnamon 菜单和桌面环境，它的工作原理以及如何对其进行自定义。想要创建另一个用户，或者甚至了解如何在网上保持匿名？请继续阅读。


    # Cinnamon 菜单简介


    既然您已经安装好了 Linux，是时候好好了解一下了。不过，如果您使用的是 Virtualbox，您将看到一个关于软件渲染的通知；以下是修复方法。


    ## Cinnamon Virtualbox 修复


    您已经查看了一些列表功能，例如 .insert、.remove 和 .pop，但也有适用于字符串的功能。


    在开始之前，我们假设您正在 Virtualbox 中遇到此问题。软件渲染消息出现在桌面的右上角。要修复此问题，请单击 Virtualbox 窗口中的“设备”，然后选择“插入客户机添加件光盘映像”。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_29_0.png)


    客户机添加件光盘包含 Virtualbox 的驱动程序，包括虚拟视频硬件。加载后，您会看到一个“需要运行软件”的通知框，其中有两个选项：取消和运行。点击“运行”按钮并输入您的
    Linux 用户密码。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_29_1.png)


    一两分钟后，您会自动进入一个名为 Linux 终端的命令提示界面。这将显示新 VirtualBox 驱动程序的安装过程，删除检测到的旧驱动程序，并安装最新版本。这不会花费很长时间，完成后会要求您按
    Return 键退出终端。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_29_2.png)


    Virtualbox 添加件光盘图标位于桌面上，因此请右键点击它，然后在菜单中向下滚动并点击“弹出”。现在您可以通过点击菜单（左侧条带底部的图标），然后点击“重启”按钮来重启
    Linux Mint。这将重启 Mint，问题也随之解决。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_29_3.png)


    # Cinnamon 菜单简介


    ## 菜单中的 Cinnamon


    现在，Virtualbox 用户的软件渲染问题已经解决，让我们来看看 Mint 菜单及其工作原理。请记住，这仅适用于 Mint Cinnamon，其他发行版的外观和行为可能不同。


    **步骤 1** 首先，您可能已经注意到登录 Linux Mint 时会弹出欢迎屏幕。花一点时间浏览这些选项，阅读“入门指南”等选项。完成后，点击窗口右上角的
    X 关闭它。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_30_0.png)


    **步骤 2** 您之前已经使用过 Mint 菜单来重启系统，并首次使用了实时环境。这次，点击“菜单”按钮，并将鼠标悬停在中间列的“办公”条目上。这更改了右列中显示的图标，详细列出了该部分下安装的哪些应用程序。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_30_2.png)


    **步骤 3** 从菜单中启动任何应用程序都很简单，只需找到并点击它即可。例如，在“办公”部分下，点击 LibreOffice Writer。Writer
    是 Linux Mint 预装的文字处理器。它可以打开和保存为 Microsoft Word 文档，并且功能几乎相同。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_30_4.png)


    **步骤 4** 再次打开菜单，但这次将鼠标指针悬停在“图形”上，然后点击 GNU 图像处理程序。GIMP 是一款强大的图像处理应用程序，其效果可能媲美 Adobe
    的 Photoshop，但要想获得理想效果可能需要更多的操作。不过，花点时间掌握它绝对是值得的。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_30_1.png)


    **步骤 5** 如果您正在寻找特定的功能或应用程序（例如设置打印机），请点击菜单框顶部的搜索框。开始输入您想要的应用程序或功能，例如打印机，Mint 菜单将在下方显示相关选项。无论哪个发行版，这在大多数现代
    Linux 菜单中都能正常工作。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_30_3.png)


    **步骤 6** 将鼠标悬停在右列列出的任何应用程序上，并右键点击，将显示一个选项列表：添加到面板、添加到桌面、添加到收藏夹以及卸载。这些选项中的大多数用法都很明显。不过，“添加到收藏夹”会将该应用程序放在左侧的快速访问列中。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_30_5.png)


    # 导航 Cinnamon 桌面


    每个桌面环境的行为都各不相同。一些桌面环境（DE）提供可自定义并放置在桌面上的小部件，而另一些则倾向于干净利落的视觉效果，以尽可能快地运行所有程序。让我们看看
    Cinnamon 桌面提供了什么。


    ## 一点风味


    Cinnamon 桌面环境是风格与性能的优秀结合。它有很多值得喜欢的地方，这就是它如此流行的原因。


    **步骤 1**

    双击“计算机”图标开始探索 Cinnamon 桌面。这会打开 Nemo，即 Cinnamon 使用的文件管理器。“计算机”图标打开根级文件系统，允许访问和查看光驱（如果已安装）、硬盘和核心
    Linux 文件系统。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_31_0.png)


    **步骤 2**

    对于前 Windows 用户来说，Linux 文件系统可能看起来令人困惑，因此直到您对它的运作方式有更多了解之前，我们建议您专注于桌面上的“主目录”图标。这里包含与您的用户账户相关的所有内容：您存储图片、视频、音乐、文档、下载项等的位置。


    **步骤 3**

    Nemo 拥有许多不同的功能、视图和方法，以便您可以查看和操作文件和文件夹。例如，如果您的“图片”文件夹中有任何图像，您可以使用 Nemo 右下角标记为“调整缩放级别”的滑块来选择图像的图标缩放级别。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_31_1.png)


    **步骤 4**

    就像任何优秀的文件管理器一样，如果您右键点击其中的任何文件或文件夹，都会得到丰富的选项。就 Cinnamon 而言，默认设置允许您根据文件类型播放或查看文件，以及复制、剪切、删除、压缩、重命名、通过电子邮件发送和查看其属性。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_31_2.png)


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_31_3.png)


