    ## 桌面环境


    Linux Mint 提供多种不同的版本，也称为风味（flavours）：Cinnamon、MATE 和 Xfce；这些版本还有 32 位和 64 位之分。这一切到底意味着什么？你应该为你的安装选择哪个版本？


    ## 选哪个 MINT？


    桌面环境是你用来与核心 Linux 系统进行交互的图形用户界面。正如 Windows 10 的图形桌面也被称为 Fluent Design（流畅设计）一样。


    Linux Mint 为用户提供该发行版的版本选择：Cinnamon、MATE 和 Xfce。虽然这对新手来说可能听起来有些令人困惑，但本质上，每个可用版本都包含相同的底层
    Linux 结构和内核。内核是操作系统的核心，负责处理软件和硬件之间的所有指令。


    那么为什么要选择不同的桌面环境呢？简单地说，这取决于个人口味。一些用户更喜欢 MATE，因为 MATE 是经典 GNOME 2 环境的分支，菜单中心主义稍强，并且在旧电脑上运行表现良好。其他人更喜欢
    Cinnamon，这是一个更现代的环境，在较新的硬件上运行更好，并拥有一些尖端的桌面代码。另一方面，Xfce 是一个轻量级的桌面环境，由于它对可用系统资源的占用极低，因此在旧硬件上运行良好。


    每个版本只是不同的桌面环境，即你用来与操作系统交互的图形用户界面（GUI）。每个桌面环境使用不同的应用程序来访问或使用系统，例如使用文件管理器浏览操作系统的文件结构，或者启动其他应用的方式。不过，核心可用的生产力、视频和图形套件是相同的，功能方式也相同。


    简而言之，Cinnamon 是 Linux Mint 的主力桌面环境。MATE 与更广泛的硬件种类兼容性更好。例如，Windows 只提供一种桌面环境供用户操作，而
    Linux 则提供了多种。因此，Linux Mint 选择为用户提供丰富的选择。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_13_0.png)


    ## 一点 Cinnamon 风味


    Cinnamon 除了外观和感觉之外还有很多优点，虽然这些也是重要因素。这里，我们概述几个功能，帮助你决定它是否是你所需的桌面环境。


    ### 极佳功能 1


    它在较现代的系统上表现卓越，比过去稳定得多，也不再像以前那样占用大量资源。因此，如果你使用旧电脑安装和测试 Linux Mint，不要因此放弃 Cinnamon。


    ### 极佳功能 2


    Cinnamon 具有可配置的“热角”（Hot Corners）功能，你可以点击桌面的每个角落来执行特定任务，例如显示工作区、显示所有窗口或运行命令。热角是切换不同视图的绝佳方式，有助于使桌面成为更高效的环境。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_14_0.png)


    ## 最佳 MATE


    MATE 是一个简单易用且直观的桌面环境，速度快且稳定。与 Cinnamon 相比，它看起来可能略显陈旧，但那只是表面现象。MATE 有很多值得喜欢的地方。


    ### 极佳功能 1


    MATE 是旧电脑的绝佳桌面环境。它比 Cinnamon 通常支持更多的硬件组件，但同样能够打造美观的桌面以及进行高级自定义。


    ### 极佳功能 2


    由于其高度可配置性，MATE 可以进行精细的自定义。对于要求桌面环境具备更多功能的高级用户，有大量选项可用，包括 Compiz 设置，在那里你可以配置各种桌面特效，甚至是
    3D 桌面立方体。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_14_1.png)


    ## 无胆固醇桌面


    Xfce 始于 1996 年的通用桌面环境（CDE）。自那以来，它改名了几次，现在 simply 就是 Xfce，昵称是“无胆固醇桌面环境”（Cholesterol
    Free Desktop Environment）。


    ### 极佳功能 1


    Xfce 确实是一个快速的桌面，展现了 Linux 作为快速操作系统的最优秀一面。事实上，我们已经到了页面顶部才开始将其安装到新电脑上；写了几个百字，我们已经开始使用这个全新的操作系统了。不错。


    ### 极佳功能 2


    仅仅因为它快速且轻量，并不意味着 Linux Mint Xfce 不是一个完整的桌面操作系统。像其他提供的环境一样，你也能获得最新的 Firefox、LibreOffice、VLC、Gimp、聊天应用，甚至是一个
    BitTorrent 客户端。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_14_2.png)


    ## 哪个发行版？


    到目前为止，我们主要讨论的是 Linux Mint，但还有其他 Linux 发行版可以尝试。实际上，有数千种 Linux 发行版可供下载和安装，那么你应该决定使用哪几种呢？


    ## 发行版跳转（Distro Hopping）


    “发行版跳转”是社区用来形容那些从不固定使用单一发行版的人的术语。相反，他们在不同的发行版之间来回跳跃，测试每一个，使用它们，然后转向另一个或新发布的发行版。


    例如，Linux Mint 是理想的起点。它是一个易于安装和使用的发行版，预先安装了日常使用的所有软件，并温和地引导你进入 Linux 独特的世界，了解它是如何工作和运行的。


    发行版跳转没有任何问题，因为这是熟悉当前可用内容并发现不同发行版中可能吸引或不符合你口味的元素的好方法。当然，问题是你总体上使用哪一个？


    Ubuntu 提供了非常相似但略有不同的体验。通常，Ubuntu 预装的内容比 Linux Mint 少，因此你需要手动安装它们。另一个值得考虑的一点是，在使用
    Linux 时，专门针对 Ubuntu 用户的内容和帮助页面数量巨大。如果你遇到困难，解决方案通常触手可及。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_15_0.png)


    继续前进，随着你对 Linux 的信心增强，你可能会测试 openSUSE、Fedora 或 Debian 等发行版。这些都是优秀的发行版，每个都为用户提供了关于系统运行方式的不同视角。有些发行版在
    Linux 技能方面要求比其他发行版更高，但本质上，每个发行版都有一些值得用户学习的宝贵经验。


    虽然发行版跳转是件好事，但它并不是享受 Linux 并获得最大收益的稳定方式。我们并不是说你应该坚持使用一个发行版而从不看其他发行版，因为那样你会错过很多优秀的内容，而是建议你找到几个发行版，并根据你日益增长的
    Linux 技能慢慢深入探索它们。


    你可能会发现自己转向某个发行版，因为它提供了与常规截然不同的东西。例如，Tails Linux 是一个专为在线匿名设计的发行版。它包含复杂的军用级加密工具，以及设计用于帮助你在不被检测、跟踪或监控的情况下浏览网页的工具和浏览器。Kali
    Linux 专为安全专业人员设计，包含许多种类的道德黑客


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_15_1.png)


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_16_0.png)


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_16_1.png)


    预装工具，用户可以运行这些工具对其网络进行渗透测试。曾经甚至有一个 Hannah Montana Linux 发行版，但我们最好不要多谈它。重点是，总有一个发行版适合你。


    不言而喻，一旦你相对高程度地掌握了 Linux，可能达到高级用户的水平，你就会想扩展你的技能，并开始基于 Arch、Debian 或许多其他可用发行版之一构建你自己的
    Linux 发行版。这样做涉及大量的命令行知识，以及对 Linux 系统如何工作并与计算机硬件交互的了解。你需要自己分区硬盘，安装桌面环境，并最终安装你想要的应用程序和程序。这需要时间，而且你需要学习许多技能。


    最终，你可以认为自己是一名技术型 Linux 用户，但永远不要认为自己是专家。毕竟，我们总是在学习新东西。你可以从头构建自己的发行版，帮助其他 Linux
    用户解决问题，也许甚至在发行版的测试或构建阶段为其改进做出贡献。下一步是什么呢？


    奇怪的是，大多数高端技术用户最终都回到了起点，使用像 Linux Mint 这样的发行版。主要原因通常是，它是一个简单的选择，并且是一个稳定的环境。仅因为你深知系统内部和外部的运作，并不意味着你总是想要修复潜在问题。我们中的大多数人更喜欢轻松的生活，尤其是在涉及技术时，因此合乎逻辑的选择是选择一个简单但功能足够强大、能完成你想要它完成的所有事情的发行版，因此是
    Linux Mint。


    然而，归根结底，这纯粹是一个选择，你个人的选择。你可能会发现在阅读完本教材中的教程后，你不喜欢 Linux Mint 或 Cinnamon 桌面。没关系，你可能更喜欢
    Ubuntu、Debian 或 openSUSE；这就是 Linux 的魅力所在：改变你想要的东西的自由，在不同发行版之间跳转而不会因成本或缺乏访问权限而受到惩罚。


    对于“哪个发行版最好”这个问题的答案是：任何你喜欢的！它可以是你需要的那样复杂或简单，只要它能完成你想要它完成的工作，那就是完美的。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_16_2.png)


