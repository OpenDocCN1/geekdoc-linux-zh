    # 通过终端安装应用程序 – 第 1 部分


    在 Linux 上安装应用程序和软件有多种方法。你可以选择图形化途径，使用软件管理器，也可以使用终端。通常，终端能提供更精细的控制权限来管理软件安装，有时你甚至别无选择。


    ## 命令行安装


    使用终端安装应用程序可能需要一些熟练的键盘操作，但你能更清楚地了解正在安装什么以及安装到哪里。


    **步骤 1**


    从终端安装应用程序通常相对简单。不过，首先你需要确保系统是最新的。为此，打开终端并输入：`sudo apt-get update && sudo apt-get
    upgrade`。输入你的密码并接受任何必要的更新。


    **步骤 2**


    正如你之前看到的，`sudo apt-get update/upgrade` 等命令旨在升级系统中已安装的软件。那么，如何安装更多应用程序呢？事实证明，这异常简单。首先你需要一个要安装的应用程序，所以让我们再次使用
    Stella。输入：`sudo apt-get install stella`。


    **步骤 3**


    你需要输入 y 以确认安装，这将占用系统约 5.5MB 的存储空间。Stella 安装完成后，你会再次看到 Mint 自动在菜单中创建了“游戏”类别以及应用程序快捷方式。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_49_0.png)

    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_49_1.png)


    **步骤 4**


    有时，安装软件时，你需要添加应用程序的软件源（Repository）。软件源（或简称 repo）简单地说是存放软件及其所有依赖项（如运行所需的关键库等）的远程服务器位置。首先输入以下命令：`sudo
    add-repository ppa:peterlev1/ppa`。在被要求时按 Enter 键添加 PPA（个人软件包存档）。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_49_2.png)

    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_49_3.png)


    **步骤 5**


    这将为 Variety 壁纸更换器应用程序添加软件源。这是一个基于 Ubuntu 的应用程序，适用于 Mint 并自动更换壁纸。既然已添加软件源，请输入：`sudo
    apt-get update`，以更新新信息并将软件源的内容添加到软件包数据库中。


    **步骤 6**


    现在要安装 Variety，请输入：`sudo apt-get install variety`。按 y 确认并接受安装，继续执行安装。安装完成后，你可以在终端中输入
    `variety` 来运行该应用程序。


    ## 移除应用程序


    除了安装应用程序，`apt` 命令也可用于移除应用程序，有助于保持系统整洁并释放资源。


    **步骤 1**


    要卸载或移除 Variety 应用程序，请输入以下命令：`sudo apt-get remove variety`。输入 y 继续卸载应用程序；注意，移除应用程序后，你还会收到关于释放了多少硬盘空间的信息。


    **步骤 2**


    虽然 ''apt-get remove'' 命令卸载应用程序，但它不会清除随应用程序而来的额外杂乱文件，例如配置和库文件。要彻底清除这些杂乱文件，请输入：`sudo
    apt-get purge variety`。


    **步骤 3**


    当你从系统中移除应用程序时，你会被告知某些自动安装的软件包已不再需要。你在之前的教程中已经看到，你可以使用以下命令来整理系统：`sudo apt-get autoremove`，然后按
    y 接受该过程。


    **步骤 4**


    最后，为了整理系统中所有未使用的软件包，并移除 autoremove 命令未清除的元素，你可以输入：`sudo apt-get autoclean`。这些最后几步对于保持
    Linux Mint 系统的良好运行状态以及修剪由安装和升级造成的不必要冗余至关重要。


    # 通过终端安装应用程序 – 第 2 部分


    大多数时候，你可以使用标准的 `apt-get` 命令从终端安装应用程序。然而，有时应用程序需要额外的操作。这意味着从源代码安装应用程序，这听起来可能有点吓人，但实际上并没有那么可怕。


    ## 从源代码


    在这里你需要熟悉几个命令：Configure（配置）、Make（编译）和 Install（安装）。你会发现许多应用程序都使用从源代码安装的方式，因此这绝对是一项值得投入时间学习的技能。


    **步骤 1**


    Linux 的源代码文件通常以 .TAR.GZ 或 .TAR.BZ2 的形式出现。两者都是压缩文件，包含“构建”应用程序所需的所有核心文件。通过在主目录（Home）中创建一个新文件夹来开始本教程：`mkdir
    vim`


    **步骤 2**


    顺便说一下，Vim 是一个高级文本编辑器，我们将用它作为安装示例。进入新文件夹，`cd vim`，然后从新的 Vim 文件夹内，在终端中输入以下命令：`wget
    ftp://ftp.vim.org/pub/vim/unix/vim-7.4.tar.bz2.`


    **步骤 3**


    `wget` 命令从互联网获取内容，在此情况下是 Vim 的 BZ2 文件。要检查文件是否成功下载，请输入：`ls.`。根据 Mint 的文件系统颜色规则，压缩文件应以红色显示。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_51_0.png)

    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_51_1.png)


    **步骤 4**


    我们现在需要解压文件内容，因此在终端中输入：`tar -xf vim-7.4.tar.bz2`。注意：你可以输入 `tar -xf` 并按 `Tab` 键自动填充剩余的文件名。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_51_2.png)

    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_51_3.png)


    **步骤 5**


    如果你再次输入 `ls`，你会注意到创建了一个新文件夹：`vim74`；在 Mint 中用浅蓝色文本表示文件夹。为主应用程序创建根文件夹总是很有用的，这样当你通过此方法升级应用程序时，每个版本都会有自己的文件夹。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_52_0.png)


    **步骤 6**


    输入 `cd vim74` 进入文件夹，再次输入 `ls` 查看其内容。可能会存在相当数量的文件；大多数是应用程序的核心文件，而其他文件可能被标记为 `README`
    或 `INSTALL`。先阅读这些文件总是明智的，因为它们提供了有关安装的重要信息。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_52_1.png)


    **步骤 7**


    安装的第一部分需要你输入 `./configure`。`./configure` 命令将检查系统中是否存在与应用程序相关的缺失依赖项。如果你收到关于 C 编译器的错误，则输入：`sudo
    apt-get install build-essential`。记录显示缺失了第三方应用程序 Ncurses。因此我们需要使用 `sudo apt-get
    install libncurses5-dev libncursesw5-dev` 安装它。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_52_2.png)


    **步骤 8**


    根据应用程序的不同，你可能需要持续安装新的依赖项。每安装一个新的依赖项后，重新运行 `./configure`，当它不再报告错误时，你可以继续安装的下一阶段。注意：你可能需要在线搜索一些错误信息。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_52_3.png)


    **步骤 9**


    成功运行 `./configure` 后，系统将创建一个 `Makefile`。需要在终端中输入 `make` 来“编译”它。根据应用程序的大小，这可能需要一段时间。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_52_4.png)


    **步骤 10**


    最后，你需要在终端中输入：`sudo make install`。这将安装应用程序，并使其在系统中准备好使用。完成后，你可以运行该应用程序，在此情况下，通过在终端中输入
    `vim` 或通过 Dash 搜索它来运行。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_52_5.png)


