  - '[PAGE 61]


    # More Fun Things to do in the Terminal


    If the previous list of fun, and quite bizarre, things to do in the Terminal has
    you wanting more, you''re in luck. We''ve put together another batch of some useful,
    and some not so useful, commands for you to try out.


    # MORE FUN, YAY


    Since the Terminal session is already open, and your keyboard digits are nicely
    warmed up, here are another two pages of Terminal nonsense.


    +   **STEP 1**

    +   Remember the old ZX Spectrum days of computing, when you could type in 10
    print "Hello", 20 goto 10 and Hello would list down the screen? Well, in Linux
    Mint you can do the same. Simply enter **yes** followed by some text, i.e. **yes
    Linux is ace**. It''ll keep going until you press **Ctrl+C**.


    +   **STEP 3**

    +   Having a little white cat chase your mouse pointer around the desktop may
    sound like a terrible waste of time. Oddly though, it isn''t. Enter: **sudo apt-get
    install oneko**, then type **oneko** to have the cat appear. Move your ''mouse''
    cursor around the screen and the cat will chase it. Use **Ctrl+C** to exit the
    action.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_61_0.png)


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_61_1.png)


    +   **STEP 2**

    +   The Matrix was one of the most graphically copied films ever released; there''s
    even a version of the Matrix code available for Linux Mint. Install it with: **sudo
    apt-get install cmatrix**. When it''s done enter: **cmatrix** and follow the white
    rabbit, Neo. Unlike the real Matrix though, you can press **Ctrl+C** to exit.


    +   **STEP 4**

    +   This entry is a little more serious than the previous. It''s called the **Fork
    Bomb** and what it does, basically, is continually replicate itself until it has
    used up all the available system resources, thus causing your computer to crash.
    You don''t have to try it but it''s interesting nonetheless. Simply enter: **:(){
    :|:& };:** and be prepared to reboot.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_61_2.png)


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_61_3.png)'
  - '[PAGE 62]


    # More Fun Things to do in the Terminal


    +   **STEP 5** Stringing several commands and piping them through other commands
    is what makes scripting such a powerful element to an OS. Using the while command,
    for example, together with toilet, can yield some impressive results. Enter: `while
    true; do echo "$date ''+%D %T'' | toilet -f term -f border --metal);"; sleep 1;
    done.`


    +   **STEP 8** Used as a music demo from the old Amiga and DOS days, the **bb**
    command reminds us of getting hold of three and a half floppies crammed with all
    manner of demoscene goodies. We''ve already installed bb from the previous step,
    so just enter `bb`. Follow the on-screen instructions, and turn up your volume.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_62_0.png)


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_62_1.png)


    +   **STEP 6** Talking computers were the craze of the 80s, enter: `speak "Hello,
    this is Linux Mint"` to have the computer repeat the text inside the quotes to
    you. Make sure your volume is turned up, and try the following: `ls > folders.txt
    && speak -f folders.txt`. This will have Mint read back the contents of the ls
    command.


    +   **STEP 9** This entry is in two parts. First you need to get hold of the necessary
    packages: `sudo apt-get install liburses-perl`. When that''s done enter: `cd Downloads/
    && wget http://search.cpan.org/CPAN/authors/id/K/KB/KBAUCOM/Term-Animation-2.4.tar.gz
    && tar -xf Term-Animation-2.4.tar.gz && cd Term-Animation-2.4/`. Then: `perl Makefile.PL
    && make && make test && sudo make install`.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_62_2.png)


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_62_3.png)


    +   **STEP 7** A roaring ASCII fire isn''t the most useful command to have at
    your disposal, but it''s fun. Install it with: `sudo apt-get install libaa-bin`,
    then when installed use: `aafire`. It''s not exactly warming but you get the idea.
    To expand the above, enter: `sudo apt-get install bb caca-utils,` then, `cacfire`.


    +   **STEP 10** With that little lot done, onto the next. Enter: `cd .. && wget
    http://www.robo bunny.com/projects/asciiquarium/asciiquarium.tar.gz && tar -xf
    asciiquarium.tar.gz && cd asciiquarium_1.1/ && chmod +x asciiquarium`. Providing
    all went well, enter `./asciiquarium` and enjoy your very own ASCII-based aquarium.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_62_4.png)


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_62_5.png)'
