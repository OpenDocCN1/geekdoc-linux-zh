    If only an owner (a user name or numeric user ID) is given, that user is made
    the owner of each given file, and the files'' group is not changed.


    **cp**

    The cp command is used to make copies of files and directories. For example, cp
    file sub makes an exact copy of the file whose name you entered and names the
    copy sub but the first file will still exist with its original name.


    **chmod**

    The chmod command changes the permissions on the files listed. Permissions are
    based on a fairly simple model: You can set permissions for user, group and world
    and you can set whether each can read, write and or execute the file.


    **pwd**

    The pwd command prints the full pathname of the current working directory (pwd
    stands for ''print working directory''). Note that the GNOME terminal also displays
    this information in the title bar of its window.


    **rm**

    The rm command removes (deletes) files or directories. The removal process unlinks
    a filename in a filesystem from data on the storage device and marks that space
    as usable by future writes. In other words, removing files increases the amount
    of available space on your disk.


    **clear**

    The clear command clears your screen if this is possible. It looks in the environment
