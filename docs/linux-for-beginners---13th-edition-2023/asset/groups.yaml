    # Using the Terminal


    # Pi x Linux =

    The Perfect Combination


    The Raspberry Pi is a remarkable piece of hardware, and to help drive its potential
    it needs a remarkable operating system. Thankfully, Linux is the default and recommended
    OS of choice for the Pi, and together they make a winning team.


    When the Raspberry Pi was in its developmental stages its designers needed to
    ensure that they were creating a piece of hardware that could offer much more
    than simply being a cheap, but small, computer.


    The Pi needed to be flexible with what it could do, it needed to have room to
    grow into more ambitious project concepts and ideas, and it needed to do so in
    as easy to use fashion as possible. The goal was to create a universal learning
    platform, that students of any age could expand on and tinker with, while learning
    new concepts such as programming, electronics, and computing. Naturally, once
    the hardware was developed, the only real choice of operating system was of course,
    Linux.


    The versatility of Linux is legendary. This incredible core OS is so malleable
    that it can be steered toward near any aspect of computing, from supercomputing
    to robotics, the space industry to more terrestrial engineering; education and
    science, manufacturing and the Internet. Think of an industry, and you will likely
    find a Linux installation somewhere in the background keeping it all together.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_77_0.png)


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_77_1.png)


    Raspbian is the recommended operating system for the Raspberry Pi, a customised
    Debian-based distribution that comes packed with a collection of useful tools
    that cater for coding, electronics, and general desktop computing duties. Alongside
    the apps are pre-loaded modules to help get the most from each of the programming
    languages you decide to learn and use, as well as software to hardware modules
    that will enable you to power and use the hardware specific items unique to the
    Pi. For example, there are Python modules that interact with the Raspberry Pi’s
    40-pin GPIO, allowing you to create content for any of the Hardware Attached on
    Top devices.


    This combination is what makes the Raspberry Pi an excellent base of operations
    to learn not only coding on, but also Linux in general. Raspbian, being Debian-based,
    will be able to run any of the Terminal commands listed in this book, as Linux
    Mint and even Ibtuntu are also Debian-based. And since the Raspberry is so small,
    and costs very little setup, you’re able to have both your regular, Windows or
    macOS computers, and have a Raspberry Pi as a headless (a powered device that
    doesn’t need a keyboard, mouse or monitor attached, as you connect to it remotely)
    computer from which you can connect to and learn how to use Linux and how to code.'
