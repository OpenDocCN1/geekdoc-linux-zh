    ## 使用终端


    ### 终端中的趣味活动


    尽管操作系统通常显得严肃，但 Linux 社区 certainly 不陌生于一点乐趣。多年来，开发人员向终端中创建并嵌入了各种有趣且古怪的元素。


    #### 终端趣味


    在接下来的两个章节中，你将在终端中 exclusively 工作，所以开始活动你的手指吧。毕竟，只工作不玩耍... 正如那句俗话说。


    - **步骤 1**

    我们将使用的第一个命令是 `sl`，它默认没有安装，所以请输入：`sudo apt-get install sl`。该命令可以通过 `sl` 运行，执行后会在屏幕上显示一列蒸汽机车穿越而过（因此命名为
    ''sl''）。输入 `SL`，注意是大写字母，同样有效。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_59_1.png)


    - **步骤 2**

    即使是《星球大战》的粉丝在终端也能过足瘾。通过 `telnet` 命令连接到远程服务器，你可以观看《第四集：新希望》，虽然是 ASCII 形式。要查看这一壮观景象，请输入：`telnet
    towel.blinkenlights.nl`。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_59_3.png)


    - **步骤 3**

    如果你曾经想过让电脑随机为你朗读一段运势，那么你很幸运。大多数发行版要求你安装 `fortune` 应用，然而 Linux Mint 略有不同，它已经预装了该应用。你只需在终端中输入命令
    `fortune`，然后享受即可。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_59_2.png)


    - **步骤 4**

    `rev` 命令确实很有趣，起初看起来像是操作系统中毫无用处的添加。然而，它可以用于创建一些看似无法破解的密码。输入：`rev`，现在输入一些文本，当你接下来按下
    Enter 键时，你输入的所有内容都会被反转。按 `Ctrl+C` 退出。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_59_4.png)


    - **步骤 5**

    如果你卡住了，试图找出某个特定数字的所有可能因子，只需输入 `factor` 后跟该数字。例如，`factor 7` 输出的内容不多，而 `factor 60`
    显示的内容更多。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_60_0.png)


    - **步骤 6**

    在相当酷和真的很奇怪之间有一条细细的分界线。让一头 ASCII 奶牛向你重复文本，可能属于后者。输入 `cowsay` 后跟任意你想要的文本，例如：`cowsay
    Linux Mint is ace!.` 实际上，你甚至可以通过输入 `ls | cowsay.` 让奶牛输出 `ls` 命令的结果。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_60_2.png)


    - **步骤 7**

    为了进一步丰富奶牛元素；甚至还有一种图形的，即非终端的奶牛。使用以下命令安装它：`sudo apt-get install xcowsay,`，安装完成后，输入类似
    `cowsay` 的内容，例如：`xcowsay BDM Publications.`。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_60_4.png)


    - **步骤 8**

    如果你真的想扩展整个奶牛主题，出于任何原因，请通过管道将 `fortune` 命令传给它，输入：`fortune | cowsay;` 以及图形奶牛的等价命令：`fortune
    | xcowsay.` 此外，还有 `cowthink`。试试：`cowthink ... This book is awesome.`。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_60_1.png)


    - **步骤 9**

    `toilet` 命令不会给人多少信心，我们承认。然而，它并没有听起来那么糟糕。首先通过以下命令安装它：`sudo apt-get install toilet.`
    然后安装完成后，输入类似以下内容：`toilet David.` 或者，你甚至可以通过管道列出当前文件夹的内容，输入：`ls | toilet.`。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_60_3.png)


    - **步骤 10**

    扩展 `toilet` 命令，你实际上可以通过它生成一些看起来不错的图形。例如，试试这个：`toilet -f mono12 -F metal David.`
    你可以输入 `toilet --help,` 获取命令行参数列表以进一步扩展。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_60_5.png)


    ## 终端中的更多趣味活动


    如果之前列出的那些有趣且相当古怪的终端活动让你想要更多，那么你很幸运。我们为你整理了一批另一些有用且一些不太有用的命令供你尝试。


    ### 更多乐趣，耶！


    既然终端会话已经打开，且你的键盘手指已经充分热身，这里还有两页终端胡言乱语。


    - **步骤 1**

    还记得老式的 ZX Spectrum 计算时代吗？当时你可以输入 `10 print "Hello", 20 goto 10` 并且 Hello 会列表显示在屏幕上？嗯，在
    Linux Mint 中你也可以做到同样的事情。只需输入 `yes` 后跟一些文本，即 `yes Linux is ace`。它会一直运行，直到你按下 `Ctrl+C`。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_61_0.png)


    - **步骤 2**

    《黑客帝国》是图形风格被复制最多的电影之一；Linux Mint 也有一个可用的《黑客帝国》代码版本。使用以下命令安装它：`sudo apt-get install
    cmatrix`。完成后输入：`cmatrix` 跟随白兔，Neo。不过与真正的《黑客帝国》不同，你可以按 `Ctrl+C` 退出。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_61_2.png)


    - **步骤 3**

    让一只小白猫在桌面上追逐你的鼠标指针听起来像是浪费时间的愚蠢行为。奇怪的是，它并不是。输入：`sudo apt-get install oneko`，然后输入
    `oneko` 让猫出现。移动你的“鼠标”光标在屏幕上，猫会追逐它。使用 `Ctrl+C` 退出操作。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_61_1.png)


    - **步骤 4**

    这一条目比前面的稍微严肃一点。它被称为**分叉炸弹**，它基本上做的是不断复制自己，直到耗尽所有可用的系统资源，从而导致你的电脑崩溃。你不必尝试它，但它仍然很有趣。只需输入：`:(){
    :|:& };:` 并做好重启的准备。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_61_3.png)


    - **步骤 5**

    将几个命令串联并通过其他命令管道传输，这是使脚本成为操作系统强大元素的原因。例如，使用 `while` 命令，加上 `toilet`，可以产生一些令人印象深刻的结果。输入：`while
    true; do echo "$date ''+%D %T'' | toilet -f term -f border --metal);"; sleep 1;
    done.`。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_62_0.png)


    - **步骤 6**

    会说话的电脑是 80 年代的流行趋势，输入：`speak "Hello, this is Linux Mint"` 让电脑向你重复引号内的文本。确保你的音量已调大，并尝试以下内容：`ls
    > folders.txt && speak -f folders.txt`。这将让 Mint 朗读 `ls` 命令的内容。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_62_2.png)


    - **步骤 7**

    咆哮的 ASCII 火焰并不是你有用的最方便的命令，但它很有趣。使用以下命令安装它：`sudo apt-get install libaa-bin`，安装完成后使用：`aafire`。它并不完全温暖，但你能明白意思。要扩展上述内容，输入：`sudo
    apt-get install bb caca-utils,` 然后，`cacfire`。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_62_4.png)


    - **步骤 8**

    作为老式 Amiga 和 DOS 时代的音乐演示，`bb` 命令让我们想起了获取三个半张塞满各种演示场景好物软盘的日子。我们在上一步已经安装了 `bb`，所以只需输入
    `bb`。跟随屏幕上的说明，并调大音量。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_62_1.png)


    - **步骤 9**

    这一条目分为两部分。首先你需要获取必要的软件包：`sudo apt-get install liburses-perl`。完成后输入：`cd Downloads/
    && wget http://search.cpan.org/CPAN/authors/id/K/KB/KBAUCOM/Term-Animation-2.4.tar.gz
    && tar -xf Term-Animation-2.4.tar.gz && cd Term-Animation-2.4/`。然后：`perl Makefile.PL
    && make && make test && sudo make install`。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_62_3.png)


    - **步骤 10**

    完成这组操作后，进入下一步。输入：`cd .. && wget http://www.robo bunny.com/projects/asciiquarium/asciiquarium.tar.gz
    && tar -xf asciiquarium.tar.gz && cd asciiquarium_1.1/ && chmod +x asciiquarium`。如果一切都顺利，输入
    `./asciiquarium` 并享受你自己的基于 ASCII 的水族箱。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_62_5.png)


    '
