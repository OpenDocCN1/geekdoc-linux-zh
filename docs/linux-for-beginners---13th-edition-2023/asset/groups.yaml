    From that desktop right-click, context menu, select Customize, followed by the
    Desktop Settings link at the bottom of the newly opened window. This opens a new
    window where you''re able to edit which desktop icons are present. If you''re
    using a setup with multiple monitors attached, you can also choose which monitor
    displays which icons.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_32_3.png)


