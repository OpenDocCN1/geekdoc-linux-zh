  md: "\n# Creating Bash Scripts – Part 4\n\nYou've encountered user interaction with\
    \ your scripts, asking what the user's name is and so on. You've also looked at\
    \ creating loops within the script to either count or simply do something several\
    \ times. Let's combine and expand some more.\n\n## CHOICES AND LOOPS\n\nLet's\
    \ bring in another command, `CHOICE`, along with some nested `IF` and `ELSE` statements.\
    \ Start by creating a new script called `mychoice.sh`.\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_73_0.png)\n\
    \nThe `mychoice.sh` script is beginning to look a lot more complex. What we have\
    \ here is a list of four choices, with three possible options. The options: `Mint`,\
    \ `ls` and `Awesome` will be displayed if the user presses the correct option\
    \ key. If not, then the menu will reappear, the fourth choice.\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_73_1.png)\n\
    \n![](img/7801ba6bee6a3a08f7f02897cdbcd867_73_2.png)\n\nIf you follow the script\
    \ through you soon get the hang of what's going on, based on what we've already\
    \ covered. `WHILE`, `IF`, and `ELSE`, with the `FI` closing loop statement will\
    \ run through the options and bring you back to the start if you pick the wrong\
    \ option.\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_73_3.png)\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_73_4.png)\n\
    \nYou can, of course, increase the number of choices but you need to make sure\
    \ that you match the number of choices to the number of `IF` statements. The script\
    \ can quickly become a very busy screen to look at. This lengthy script is another\
    \ way of displaying a menu, this time with a fancy colour scheme too.\n\n```bash\n\
    #!/bin/bash\n\n# Define the colours we're going to use\nBLUE='\\e[0;34m'\nGREEN='\\\
    e[0;32m'\nCLEAR='\\e[0m'\n\nwhile [ \"0\" ]\ndo\n    # Clear the entire screen\n\
    \    CLEAR\n\n    # This is the prompt we display\n    echo \"\\e[0;33m\"\n  \
    \  read \"Choice\"\n\n    # This is where we check the users input\n    if [ \"\
    $Choice\" = \"1\" ]\n    then\n        # This is what will happen\n        echo\
    \ \"Mint\"\n        read \"Enter\"    # Wait for user to press Enter\n    elif\
    \ [ \"$Choice\" = \"2\" ]\n    then\n        # ...\n    fi\ndone\n```\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_73_5.png)\n\
    \nYou can use the arrow keys and Enter in the menu setup in the script. Each choice\
