    CERN 版，也称为 CERN6。据报道，有超过 36,000 个系统运行 SL，超过 15,000 个系统运行 SLC。


    ## 使用终端


    ### 创建 Bash 脚本 – 第一部分


    最终，随着您在 Linux Mint 上的进阶，您将希望开始创建自己的自动化任务和程序。这些本质上是脚本，准确地说是 Bash Shell 脚本，它们的工作方式与
    DOS 批处理文件或其他编程语言相同。


    #### 开始编写脚本


    Bash 脚本只是一系列 Mint 将执行以完成特定任务的命令。它们可以很简单，也可以非常复杂，这完全取决于具体情况。


    - **第 1 步** 在接下来的几页中，您将在终端和一个文本编辑器中进行操作。除了文本编辑器外还有其他选择，我们稍后会介绍，但为了简便起见，我们将在 Xed
    中进行示例操作。然而，在开始之前，请先运行常规的更新检查：`sudo apt-get update && sudo apt-get upgrade`。


    - **第 3 步** 首先，在开始编写任何脚本之前，您需要创建一个文件夹来存放所有脚本。从 `mkdir scripts/` 开始，然后进入该文件夹 `cd
    scripts/`。这将是我们的工作文件夹，您可以在此处为您创建的每个脚本创建子文件夹（如果需要）。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_67_0.png)


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_67_1.png)


    - **第 2 步** 我们可以使用几种文本编辑器来创建 Bash 脚本：Xed、Vi、Nano、Vim、GNU Emacs 等等。归根结底，这取决于个人喜好。我们使用
    Xed 纯粹是为了让下方截图中阅读脚本更加容易。


    - **第 4 步** Windows 用户应该知道，为了使批处理文件能够工作（即被执行并遵循其中的编程逻辑），它需要一个 .BAT 文件扩展名。Linux
    是一个无扩展名的操作系统，但惯例是给脚本添加 .sh 扩展名。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_67_2.png)


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_67_3.png)


    **第 5 步** 让我们从一个简单的脚本开始，向终端输出内容。输入 `xed` `helloworld.sh`。这将启动 Xed 并创建一个名为 helloworld.sh
    的文件。在 Xed 中，输入以下内容：`#!/bin/bash`，然后在新的一行中：`echo` `Hello World!`。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_68_0.png)


    **第 6 步** `#!/bin/bash` 行告诉系统您将使用哪个 Shell，在此案例中是 Bash。井号 (#) 表示注释行，会被系统忽略；感叹号
    (!) 意味着该注释会被绕过，并强制将脚本中的该行作为命令执行。这也被称为 Hash-Bang。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_68_1.png)


    **第 7 步** 您可以保存此文件，点击 文件 > 保存，然后退出回到终端。输入 `ls`，将显示该文件夹中的脚本。为了使任何脚本可执行并能够运行，您需要修改其权限。使用
    `chmod +x helloworld.sh` 来做到这一点。您需要对您创建的每个脚本都这样做。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_68_2.png)


    **第 8 步** 当您再次输入 `ls` 时，您可以看到 helloworld.sh 脚本已从白色变为绿色，这意味着它现在是一个可执行文件。要运行脚本，即让它执行您输入的内容，请输入：`./helloworld.sh`。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_68_3.png)


    **第 9 步** 虽然这并不太令人兴奋，但单词 “Hello World!” 现在应该在终端中显示出来。`echo` 命令负责在终端中输出其后的单词；随着我们的进度，您可以使
    `echo` 命令输出到其他来源。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_68_4.png)


    **第 10 步** 将 `echo` 想象成旧 BASIC 中的 Print 命令。它显示文本、数字或存储系统中的任何变量，例如当前系统日期。尝试这个例子：`echo`
    `Hello World!` `Today` `is` `$(date +%A)`。`$(date +%A)` 是调用存储当前星期几的系统变量。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_68_5.png)


