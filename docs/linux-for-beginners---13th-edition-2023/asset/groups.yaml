    you probably expected a simple ‘Hello’ is displayed in the Terminal. However,
    if you then issue the command with a variable, it begins to get interesting. For
    example, try `./hello.sh David`.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_69_2.png)


    - **STEP 3** The output now will be Hello David. This is because Bash automatically
    assigns variables for the user, which are then held and passed to the script.
    So the variable ‘$1’ now holds ‘David’. You can change the variable by entering
    something different: `./hello.sh Mint`.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_69_1.png)


    - **STEP 4** You can even rename variables. Modify the hello.sh script with the
