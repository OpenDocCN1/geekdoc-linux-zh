    # ## INSTALLING LINUX


    Once the Live Environment has booted, you see the option to install the distro
    to your computer. Have a look around and when you''re ready, look for the Install
    option on the desktop.


    # **STEP 1**


    Providing you''re connected to the internet (if not, then do so now) and you''re
    in the Live Environment, start the installation process by double-clicking on
    the Install Linux Mint icon on the desktop. Other distros display their own name,
    of course, but the process is the same. Click Continue when you''re ready.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_22_0.png)


    # **STEP 4**


    Before the installation process begins, you''re asked if the choice you made regarding
    the erasure of the hard drive is correct. This is your last chance to back out.
    If you''re certain you don''t mind wiping everything and starting again with Linux
    Mint, click Continue. If you need to backup your files remove the Linux Mint disc/USB,
    reboot, backup and start again.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_22_1.png)


    # **STEP 2**


    While the installation process is very similar across most Linux distros, some
    offer different questions during the installation. Generally, the questions aren''t
    too difficult, nothing very technical, but some such as ''Installing third-party
    software...?'' can be confusing. In this case you can click Continue but if you''re
    unsure, have an Internet-connected device available to ask any questions.


    # **STEP 5**


    Eventually you are asked to set up your Linux username and password. Enter your
    Name to begin with, then the Computer Name, which is the name it is identified
    on the network as. Next choose a Username, followed by a good Password. You can
    tick the Login Automatically option but leave the Encrypt Home Folder option for
    now.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_22_2.png)


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_22_3.png)


    # **STEP 3**


    When installing a new operating system it''s recommended that you wipe the old
    OS, replacing it with the new. When you reach this stage of the installation process,
    ensure the ''Erase disk and install Linux...'' option is selected. NOTE: This
    completely wipes Windows 10 from your computer, so make sure you have backups
    of all your personal files and data.


    # **STEP 6**


    The installation process can be quick, and there may be more questions to answer,
    or it may simply start installing Linux based on your previous answers. Either
    way, you end up being asked to Continue Testing the Live Environment or Restarting
    to use the newly installed OS. If you''re ready to use Linux, then click Restart
    Now.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_22_4.png)


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_22_5.png)'
  - '[PAGE 23]


    # Installing a Virtual Environment


    A Virtual Environment is a simulated computer system. Using a Virtual Machine,
    you can mimic a standard PC and install an entire operating system to it without
    affecting the one installed on your computer. It’s a great way to test and use
    Linux, while still having Windows 10 as your main OS.


    # GOING VIRTUAL


    Using a Virtual Machine (VM) takes resources from your computer: memory, hard
    drive space, processor usage and so on. Make sure you have enough of each before
    commencing.


    # STEP 1


    We’re using VirtualBox in this instance, as it’s one of the easiest virtual environments
    to get to grips with. Enter www.virtualbox.org and click on ‘Download VirtualBox’.
    This takes you to the main download page. Locate the correct host for your system:
    Windows or Mac, the Host being the current installed operating system, and click
    the link to begin the download.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_23_0.png)


    # STEP 3


    With the correct packages downloaded, and before you install anything, you need
    to make sure that the computer you’re using is able to host a VM. To do this,
    reboot the computer and enter the BIOS. When the computer starts up, press the
    Del, F2 or whichever key is necessary to Enter Setup.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_23_1.png)


    # STEP 2


    Next, while still at the VirtualBox download page, locate the VirtualBox Extension
    Pack link. The Extension Pack supports USB devices as well as numerous other extras
    that can help make the VM environment a more accurate emulation of a ‘real’ computer.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_23_2.png)


    # STEP 4


    Each BIOS is laid out differently and it’s very difficult to assess where to look
    in each personal example. However, as a general rule of thumb, you’re looking
    for Intel Virtualisation Technology, or simply Virtualisation, found usually within
    the Advanced section of the BIOS. When you’ve located it, Enable it, save the
    settings, exit the BIOS and reboot the computer.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_23_3.png)'
  - '[PAGE 24]


    # Installing a Virtual Environment


    +   STEP 5 With the computer back up and running, locate the downloaded main VirtualBox
    application and double-click to begin the installation process. Click Next to
    continue, when you''re ready.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_24_0.png)


    +   STEP 6 The default installation location of VirtualBox should satisfy most
    users but if you have any special location requirements click on the ''Browse''
    button and change the install folder. Then, make sure that all the icons in the
    VirtualBox feature tree are selected, i.e. none of them have a red X next to them.
    Click Next to move on.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_24_1.png)


    +   STEP 7 This section can be left alone to the defaults, should you wish, it
    simply makes life a little easier when dealing with VMs, especially when dealing
    with downloaded VMs, which you may encounter in the future. Again, clicking Next
    moves you on to the next stage.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_24_2.png)


    +   STEP 8 When installing VirtualBox your network connection is disabled for
    a very brief period. This is due to VirtualBox creating a linked, virtual network
