  - '[PAGE 44]


    # Using the Terminal


    The Linux command line, the Terminal, is an incredibly powerful environment. From
    it, you can bring the OS to its knees, or update it to something spectacular.
    You can hack into remote computers, look at an animated ASCII camp Fire, install
    new apps and programs, watch Star Wars played out from a server in the Netherlands,
    and code intricate automated scripts.


    In this section you will explore the intricacies of the Terminal, and how it works
    with Linux. You will learn how to manipulate the Linux file system from the Terminal,
    and you will discover some odd, but fun things you can do in the Terminal.


    The Terminal rules supreme in the world of Linux. Learn how it works, and you
    can access all that power.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_44_0.png)'
  - '[PAGE 45]


    # Basics of the Terminal


    Most operating systems use two kinds of interface, the GUI, which is the desktop
    that Windows, macOS and Linux Mint boot into and the command line. While modern
    operating systems shy away from the command line, Mint uses the Terminal to give
    the user greater control of the system.


    # TAKING COMMAND


    The command line, or Terminal, is an extremely powerful interface. Everything
    you can do on the desktop can be done within the Terminal. Let’s start by seeing
    how it works.


    # STEP 1


    The Terminal can be accessed by either clicking on the Terminal icon on the Panel,
    located between the Firefox and files icons or launched by opening the Menu and
    selecting it from the left-hand quick launch strip.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_45_0.png)


    # STEP 3


    What you currently see in the Terminal is your login name followed by the name
    of the computer; as you named it during setup when you first installed Mint. The
    line then ends with the current folder name; at first this is just a tilde ~,
    which means your Home folder.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_45_1.png)


    # STEP 2


    The Terminal gives you access to the Linux Mint Shell, called Bash, which gives
    you access to the underlying operating system. Everything in Mint, including the
    desktop and GUI, is a module running from the command line.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_45_2.png)


    # STEP 4


    The flashing cursor at the very end of the line is where your text-based commands
    are entered. You can begin to experiment with a simple command, Print Working
    Directory (pwd), which outputs the current folder you’re in to the screen. Type
    pwd and press Enter.


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_45_3.png)'
  - '[PAGE 46]


    # STEP 5


    All the commands you enter work in the same manner: you enter the command, include
