    - **步骤 7**：基本上，就是这样了，你的系统现在根据 apt-get update 命令可用的软件包列表已经更新到最新。你可以再运行一遍这个过程，以检查一切是否顺利。总结一下，输入：`sudo\
    \ apt-get update`，按下 **Enter**，然后输入：`sudo apt-get upgrade` 并按下 **Enter**。\n\n\
    ```\nReading package lists... Done\nBuilding dependency tree\nReading state information...\
    \ Done\nCalculating upgrade... Done\nThe following packages will be automatically\
    \ installed and are no longer required:\n  libcopylxml-3.8 libcrypto-1.0.0-ssl\
    \ libgcc-4.8-dev\n  libmysqlclient18 libncurses5 libncurses5-dev libperl5.22 libpthread-stubs0-dev\
    \ libssl1.0.0 libstdc++-4.8-dev libtcl8.6-0 libyaml-0.2-2\nE: Unable to locate\
    \ package libyaml-perl\ndavid@david-mint:~$ sudo apt-get update && sudo apt-get\
    \ upgrade\nReading package lists... Done\nBuilding dependency tree\nReading state\
    \ information... Done\n```\n\n- **步骤 8**：有趣的是，Linux Mint 以及其他一些发行版允许你将多个命令链接在一起。因此，在这个例子中，我们可以使用\
    \ `sudo apt-get update && sudo apt-get upgrade`。双与符号（&&）用于组合命令，只要前一个命令顺利执行，它就完美运作。建议在任何会话开始时使用更新和升级组合。\n\
    \n```\nReading package lists... Done\nBuilding dependency tree\nReading state\
    \ information... Done\nCalculating upgrade... Done\nThe following packages will\
    \ be automatically installed and are no longer required:\n  libcopylxml-3.8 libcrypto-1.0.0-ssl\
    \ libgcc-4.8-dev\n  libmysqlclient18 libncurses5 libncurses5-dev libperl5.22 libpthread-stubs0-dev\
    \ libssl1.0.0 libstdc++-4.8-dev libtcl8.6-0 libyaml-0.2-2\nE: Unable to locate\
    \ package libyaml-perl\ndavid@david-mint:~$ sudo apt-get update && sudo apt-get\
    \ upgrade\nReading package lists... Done\nBuilding dependency tree\nReading state\
    \ information... Done\n```\n\n### 终端 vs 更新管理器？\n\n无论使用哪种发行版，为什么使用终端而不是更新管理器来进行更新和升级？一些用户强烈倾向于使用终端来更新他们的\
    \ Linux 系统及附带的应用程序，认为这样更好。然而，事实往往并非如此。\n\n使用终端的 `apt-get` update 并不处理软件包版本之间依赖关系的变更，因此，如果一个软件包从一个版本到另一个版本的依赖字段发生了变更，那么更新可能会被搁置。\n\
    \n更新管理器，或软件管理器（取决于发行版），通常会分阶段进行更新，并标记那些依赖关系发生变化的软件包以进行更新。然而，这就是 Linux 常常令人困惑的地方，有时它并不这样做。\n\
    \n归根结底，这取决于正在更新的软件包的开发人员，以及该发行版仓库中软件包的存放方式，还有该更新是否被分类为稳定版。从本质上说，从用户的角度来看，如果你定期使用终端和更新管理器两者进行更新和升级，那么你将保持尽可能最新的状态，并获得软件包和核心软件的基本且必要的稳定版本。如果你在寻找前沿的软件包更新，最好选择滚动发布（rolling\
    \ release）发行版。\n\n"
