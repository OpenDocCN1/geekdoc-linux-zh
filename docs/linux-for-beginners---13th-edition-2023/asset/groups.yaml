    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_32_1.png)


    ### 步骤 7

    如果在 Cinnamon 桌面的任何位置右键单击，您会看到一组选项，允许您进一步添加、编辑或以不同方式查看桌面内容。这与 Windows 非常相似，这也是
    Mint 是前 Windows 用户良好选择的原因。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_32_2.png)


    ### 步骤 8

    从该桌面右键上下文菜单中，选择“自定义”，然后依次点击新打开窗口底部的“桌面设置”链接。这将打开一个新窗口，您可以在其中编辑哪些桌面图标存在。如果您使用的是连接了多个显示器的设置，您还可以选择哪个显示器显示哪些图标。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_32_3.png)


    ### 步骤 9

    点击菜单并输入“system settings”（系统设置），然后打开相应的图标。这将带您进入系统设置选项。从这里，您可以控制和编辑 Linux Mint
    Cinnamon 的外观和工作方式，以及添加新用户、管理防火墙和启用辅助功能选项。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_32_4.png)


    ### 步骤 10

    简而言之，Linux Mint Cinnamon 可以被配置得非常出色。有许多例子展示了它能达到的良好程度以及可以实现的效果。您可以根据需要尽可能复杂或尽可能简单，添加不同的组件和动画，或者保持简洁易读。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_32_5.png)


    ## 安装 Linux Mint 后应做的 10 件事


    Linux Mint 开箱即用的系统非常完善，但就像大多数 Linux 发行版一样，有一些调整可以改善其工作方式。虽然这些是 Mint 特有的调整，但大多数也可以应用于其他发行版。


    ### LINUX 调整


    其中一些安装后操作是高度推荐的，而另一些只是便捷的附加功能，用于调整系统或添加自定义设置。


    -   **步骤 1** 首先，也是最重要的安装后操作是更新系统。点击面板上位于桌面右下角（时间和日期旁边）的盾牌图标。这将启动更新管理器。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_33_0.png)


    -   **步骤 2** Linux Mint 提供用户三种级别的更新策略：不要搞坏我的电脑、优化稳定性和安全性、始终更新所有内容。推荐的选项是“优化稳定性和安全性”，它仅更新不会触及核心操作系统关键元素的、安全的、必要的补丁。请阅读说明，但选择中间（也是推荐）的选项。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_33_1.png)


    -   **步骤 3** 点击“确定”按钮，您将看到有几个更新等待安装。不过在更新之前，点击蓝色条上的“确定”按钮以切换到本地镜像。这将打开软件源选项。在镜像部分，点击“主要”和“基础”下拉菜单，并选择离您当前位置最近的服务器。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_33_2.png)


    -   **步骤 4** 点击“更新缓存”按钮并关闭软件源窗口。回到更新管理器，点击“安装更新”图标并输入您的密码。更新会自动应用并重新启动更新管理器，这次会有更多的更新。再次点击“安装更新”，确认任何消息，并等待完成。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_33_3.png)


    -   **步骤 5** 更新按级别分级，1 为低级别更新，5 为危险级别。我们的建议是坚持使用级别 3 的更新；对于关于覆盖配置文件的任何消息，点击**替换**。关于软件渲染问题以及非
    VirtualBox 用户缺少驱动的问题，点击**菜单**并在搜索框中输入“driver”（驱动）。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_34_0.png)


    -   **步骤 6** 点击搜索结果中出现的**驱动管理器**应用程序并输入您的密码。Mint 需要一点时间来分析可用的选项，并基于检测到的硬件向您提供潜在驱动程序的选择。有图形问题（如软件渲染）的用户应选择使用最新的、推荐的图形驱动。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_34_1.png)


    -   **步骤 7** 此时您可能需要重新启动 Linux Mint，所以现在执行此操作。重启后，再次点击菜单按钮，然后依次点击**终端**。终端图标位于左侧列中，在文件图标上方。打开终端后，输入：`sudo
    apt-get install libdvd-pkg`，按 Enter 键并输入密码。这将启用加密 DVD 播放功能。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_34_2.png)


    -   **步骤 8** 当询问是否接受更改时，输入 **Y**，同样在询问配置 libdvd 时。确保 **OK** 被高亮显示并按 **Enter**
    键，然后对任何进一步的问题回答“是”。接下来，仍在终端中，输入：`cat /proc/sys/vm/swappiness`；结果应为 **60**。如果您的电脑内存（RAM）少于
    **4GB**，则输入：`gksudo xed /etc/sysctl.conf`。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_34_3.png)


    -   **步骤 9** 此调整有助于加速内存少于 **4GB RAM/内存**的系统。滚动到您刚打开的文件底部并添加以下新行：


    ```

    # Decrease swap usage to a more reasonable level

    vm.swappiness=10

    ```


    点击 文件 > 保存，然后 文件 > 退出。重启 Linux Mint，您应该会注意到性能略有提升。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_34_4.png)


    -   **步骤 10** 在当今数字时代，安全始终是一个关切点。虽然 Linux Mint 是一个安全的系统，但建议始终尝试改进它。点击菜单按钮并搜索 **Firewall**（防火墙）；点击**防火墙配置**图标并输入您的密码。在防火墙窗口中，点击**状态**滑块将其打开。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_34_5.png)


    ## 阿波罗 11 号


    **你知道吗……**


    1969 年 7 月 20 日被视为人类历史的转折点，人类首次踏上月球。帮助机组人员完成这一关键旅程的软件当时甚至不存在，必须从头开发。MIT 仪器实验室的工程师使用了一种名为“Rope
    Memory”（绳索内存）的新程序存储方法，将内存填充了汇编语言的特殊版本。


    令人难以置信的是，这些代码可以免费在 GitHub 上查看。该代码由一位研究员于 2003 年上传，您可以通过访问 www.github.com/chrisiggaly/Apollo-11/
    查看代码。留意代码片段，特别是 `Burn_Baby_Burn`，尤其是第 925 行带有注释 “Goodbye. Come again soon.”（再见。期待再次光临。）


    花点时间浏览一下，看看还能找到什么。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_35_0.png)


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_35_1.png)


    > 程序员并非没有幽默感。看看里面还有什么。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_36_0.png)


    > 人类的一大步，编程亦如此。


    图片来源：阿波罗 11 号/美国宇航局（NASA）


    ## 创建用户


    当您首次安装 Linux Mint 时，它被配置为供单个用户使用。虽然与家人共享一个用户账户也没问题，但总有一天您可能需要创建具有自己独特主文件夹的独立用户。


    ### 新用户


    拥有不同的用户意味着每个用户都可以访问系统在系统中属于他自己的区域。文档、图片、视频等是独立的，正如其他操作系统中多个用户的情况一样。


    **步骤 1** 点击 Linux Mint 菜单并输入 “users” 开始搜索相关的控制台。从搜索结果中，选择“用户和组”并输入您的密码。用户和组控制台外观相当基础，但谢天谢地使用也很简单。起初，您只能看到安装
    Linux Mint 时的用户名。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_37_0.png)


    **步骤 2** 要添加新用户，点击控制台底部的“添加”按钮。您可以创建两种类型的用户：标准用户和管理员。除非新用户需要安装新应用程序或访问主文件夹之外的文件系统部分，否则请选择标准账户类型。否则，使用管理员账户类型。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_37_2.png)


    **步骤 3** 输入新用户的**全名**，接着输入他们登录 Linux Mint 时需要的**用户名**。确保用户名全部为小写，仅包含 a-z 和 0-9
    字符。如果您愿意，可以使用句点、下划线或连字符。准备好继续时，点击“添加”按钮。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_37_1.png)


    **步骤 4** 新用户将出现在当前 Linux Mint 用户列表中，按字母顺序排列。目前，没有设置密码，因此点击当前用户列表中的该用户，然后点击用户名下的“未设置密码”选项。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_37_3.png)


