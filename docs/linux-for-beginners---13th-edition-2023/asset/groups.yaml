    \ package libyaml-perl\ndavid@david-mint:~$ sudo apt-get update && sudo apt-get\
    \ upgrade\nReading package lists... Done\nBuilding dependency tree\nReading state\
    \ information... Done\nYou have pending software to apply to Mint, and you're\
    \ okaying the action.\n```\n\nSTEP 8   Interestingly, Linux Mint, among other\
    \ distros, offers you the ability to chain several commands together. In this\
    \ example, therefore, we can use `sudo apt-get update && sudo apt-get upgrade`.\
    \ The double ampersand is what combines the commands and works perfectly, providing\
    \ the preceding command went without a hitch. It's recommended to start any session\
    \ with the update and upgrade combo.\n\n```\nReading package lists... Done\nBuilding\
    \ dependency tree\nReading state information... Done\nCalculating upgrade... Done\n\
    The following packages will be automatically installed and are no longer required:\n\
    \  libcopylxml-3.8 libcrypto-1.0.0-ssl libgcc-4.8-dev\n  libmysqlclient18 libncurses5\
    \ libncurses5-dev libperl5.22 libpthread-stubs0-dev libssl1.0.0 libstdc++-4.8-dev\
    \ libtcl8.6-0 libyaml-0.2-2\nE: Unable to locate package libyaml-perl\ndavid@david-mint:~$\
    \ sudo apt-get update && sudo apt-get upgrade\nReading package lists... Done\n\
    Building dependency tree\nReading state information... Done\nYou have pending\
    \ software to apply to Mint, and you're okaying the action.\n```\n\n# TERMINAL\
    \ VS UPDATE MANAGER?\n\nWhy use the Terminal to update and upgrade over the Update\
    \ Manager, regardless of the distro you're using? Some users greatly prefer using\
    \ the Terminal to update their Linux systems and accompanying apps, in the belief\
    \ that it's better. However, that's not often the case.\n\nUsing the Terminal,\
    \ `apt-get` update, doesn't handle changing dependencies between versions of packages,\
    \ so if a package has its dependent fields changed from one version to another,\
    \ then the update is held back.\n\nThe Update Manager, or Software Manager (depending\
    \ on the distro), often phases its update and marks those packages with changed\
    \ dependencies for updating. However, and this is where Linux can often get confusing,\
    \ sometimes it doesn't.\n\nIt all boils down to the developer of the package being\
    \ updated and the way the package is held in the distro's repositories and whether\
    \ the update is classified as stable or not. In essence, from the point of view\
    \ of the user, if you update and upgrade using both the Terminal and the Update\
    \ Manager regularly, then you'll be as up to date as possible, and get the essential\
    \ and necessary stable versions of the packages and core software. If you're looking\
    \ for cutting edge package updates, then it's best to opt for a rolling release\
    \ distro instead."
  md: "\n> “Linux: the operating system with a CLUE... Command Line User Environment.”\n\
    – Anonymous (Posted on comp.software.testing)\n\n## Using the Terminal\n\nThe\
    \ Linux command line, the Terminal, is an incredibly powerful environment. From\
    \ it, you can bring the OS to its knees, or update it to something spectacular.\
    \ You can hack into remote computers, look at an animated ASCII camp fire, install\
    \ new apps and programs, watch Star Wars played out from a server in the Netherlands,\
    \ and code intricate automated scripts.\n\nIn this section you will explore the\
    \ intricacies of the Terminal, and how it works with Linux. You will learn how\
    \ to manipulate the Linux file system from the Terminal, and you will discover\
    \ some odd, but fun things you can do in the Terminal.\n\nThe Terminal rules supreme\
    \ in the world of Linux. Learn how it works, and you can access all that power.\n\
    \n![](img/7801ba6bee6a3a08f7f02897cdbcd867_44_0.png)\n\n## Basics of the Terminal\n\
    \nMost operating systems use two kinds of interface, the GUI, which is the desktop\
    \ that Windows, macOS and Linux Mint boot into and the command line. While modern\
    \ operating systems shy away from the command line, Mint uses the Terminal to\
    \ give the user greater control of the system.\n\n### Taking Command\n\nThe command\
    \ line, or Terminal, is an extremely powerful interface. Everything you can do\
    \ on the desktop can be done within the Terminal. Let’s start by seeing how it\
    \ works.\n\n- **Step 1**: The Terminal can be accessed by either clicking on the\
    \ Terminal icon on the Panel, located between the Firefox and files icons or launched\
    \ by opening the Menu and selecting it from the left-hand quick launch strip.\n\
    \n![](img/7801ba6bee6a3a08f7f02897cdbcd867_45_0.png)\n\n- **Step 2**: The Terminal\
    \ gives you access to the Linux Mint Shell, called Bash, which gives you access\
    \ to the underlying operating system. Everything in Mint, including the desktop\
    \ and GUI, is a module running from the command line.\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_45_2.png)\n\
    \n- **Step 3**: What you currently see in the Terminal is your login name followed\
    \ by the name of the computer; as you named it during setup when you first installed\
    \ Mint. The line then ends with the current folder name; at first this is just\
    \ a tilde ~, which means your Home folder.\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_45_1.png)\n\
    \n- **Step 4**: The flashing cursor at the very end of the line is where your\
    \ text-based commands are entered. You can begin to experiment with a simple command,\
