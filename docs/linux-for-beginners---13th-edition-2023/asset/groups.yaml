  mdcn: "\n# 创建 Bash 脚本 – 第 4 部分\n\n你已经在脚本中遇到了用户交互，例如询问用户的姓名等。你还查看了在脚本中创建循环，用于计数或简单地执行多次某项操作。让我们结合并进一步扩展这些内容。\n\
    \n## 选择与循环\n\n让我们引入另一个命令 `CHOICE`，以及一些嵌套的 `IF` 和 `ELSE` 语句。首先，创建一个名为 `mychoice.sh`\
    \ 的新脚本。\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_73_0.png)\n\n`mychoice.sh`\
    \ 脚本开始看起来复杂得多。这里有一个包含四个选项的列表，其中有三种可能的选择。如果用户按下了正确的选项键，选项：`Mint`、`ls` 和 `Awesome`\
    \ 将会显示。如果没有，菜单将再次出现，即第四个选项。\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_73_1.png)\n\
    \n![](img/7801ba6bee6a3a08f7f02897cdbcd867_73_2.png)\n\n如果你跟随脚本执行，很快你就会理解其中的运作方式，这基于我们之前涵盖的内容。`WHILE`、`IF`\
    \ 和 `ELSE`，配合用于关闭循环的 `FI` 语句，会遍历选项，如果你选择了错误的选项，就会带你回到起点。\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_73_3.png)\n\
    \n![](img/7801ba6bee6a3a08f7f02897cdbcd867_73_4.png)\n\n当然，你可以增加选项的数量，但你需要确保选项的数量与\
    \ `IF` 语句的数量相匹配。脚本可能会迅速变成一个大而杂乱的屏幕。这个冗长的脚本是显示菜单的另一种方式，这次还带有炫丽的配色方案。\n\n```bash\n\
    #!/bin/bash\n\n# Define the colours we're going to use\nBLUE='\\e[0;34m'\nGREEN='\\\
    e[0;32m'\nCLEAR='\\e[0m'\n\nwhile [ \"0\" ]\ndo\n    # Clear the entire screen\n\
    \    CLEAR\n\n    # This is the prompt we display\n    echo \"\\e[0;33m\"\n  \
    \  read \"Choice\"\n\n    # This is where we check the users input\n    if [ \"\
    $Choice\" = \"1\" ]\n    then\n        # This is what will happen\n        echo\
    \ \"Mint\"\n        read \"Enter\"    # Wait for user to press Enter\n    elif\
    \ [ \"$Choice\" = \"2\" ]\n    then\n        # ...\n    fi\ndone\n```\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_73_5.png)\n\
    \n你可以使用菜单设置中的方向键和 Enter 键。每个选项都是一个外部命令，它会反馈各种信息。玩玩这些命令和选项，看看你能想出什么。这略微超出了我们之前查看的范围，但它很好地展示了可以实现什么。\n\
    \n![](img/7801ba6bee6a3a08f7f02897cdbcd867_73_6.png)\n\n## 创建备份任务脚本\n\nBash 脚本应用最广泛的例子之一是创建备份例程，该例程不仅自动化任务，还会添加一些自定义内容。\n\
    \n### 步骤 1\n\n一个非常基本的备份脚本看起来大致如下：`#!/bin/bash`，然后，`tar cvfz ~/backups/my-backup.tgz\
    \ ~/Documents/`。这将创建 `~/Documents` 文件夹（及其所有内容）的压缩文件备份，并将其放在名为 `/backups` 的文件夹中，命名为\
    \ my-backup.tgz。\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_74_0.png)\n\n###\
    \ 步骤 2\n\n虽然这样完全没问题，但我们可以让这个简单脚本更具交互性。让我们从定义一些变量开始。将截图中的文本输入到一个新的 `backup.sh`\
    \ 脚本中。注意，我们将‘source’拼错为‘saucé’，这是因为已经有一个名为‘source’的内置命令，因此我们使用了不同的拼写。\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_74_1.png)\n\
    \n### 步骤 3\n\n之前的脚本条目允许你创建一个时间戳，以便你知道备份是什么时候进行的。你还创建了一个‘dest’变量，这是备份文件将创建的文件夹（~/backups）。现在你可以添加一段代码，首先检查\
    \ `~/backups` 文件夹是否存在，如果不存在，则创建一个。\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_74_2.png)\n\
    \n### 步骤 4\n\n一旦创建了 `~/backups` 文件夹，我们现在可以基于开头设置的时间戳变量在其内部创建一个新的子文件夹。添加 `mkdir\
    \ -p $dest/\"${day} ${month} ${year}\"`。就在这里放入与该日/月/年相关的备份文件。\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_74_3.png)\n\
    \n### 步骤 5\n\n所有设置就绪后，你现在可以输入实际的备份例程，基于步骤 1 中的 Tar 命令。结合变量，你得到：`tar cvfz $dest/\"\
    ${day} ${month} ${year}\"/DocumentsBackup.tgz $source.`。在截图中，我们添加了一个方便的 \"Now\
    \ backing up...\" echo 命令。\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_74_4.png)\n\
    \n### 步骤 6\n\n最后，你可以添加一条友好的消息：`echo \"Backup complete. All done...\"`。完成的脚本并不过于复杂，并且可以轻松自定义，以包含主目录区域中的任何文件夹，以及整个主目录区域本身。\n\
    \n![](img/7801ba6bee6a3a08f7f02897cdbcd867_74_5.png)\n\n我们之前查看的备份脚本可以进一步修改，以纳入选择、关于备份文件复制到哪里等方面的用户交互等。自动化任务是\
    \ Bash 脚本的主要优势之一，一个简单的脚本可以在许多方面帮助到你。\n\n## 轻松的自动化和实用的脚本\n\n逐行输入命令以检索系统信息、查找文件或批量重命名文件？脚本是更好的答案。\n\
    \n### 步骤 1\n\n让我们从创建一个帮助显示 Mint 系统信息的脚本开始；这总是很有用的工具。创建一个名为 `sysinfo.sh` 的新脚本，并将以下内容输入到\
    \ Xed 或你选择的文本编辑器中。\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_75_0.png)\n\n###\
    \ 步骤 2\n\n我们在该脚本中包含了一些额外的命令。第一个是 `echo` 的 `-e` 扩展，这意味着它将启用对换行符以及其他特殊字符的额外解释。随后的\
    \ ‘31;43m’ 元素启用前景色和背景色。\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_75_1.png)\n\
