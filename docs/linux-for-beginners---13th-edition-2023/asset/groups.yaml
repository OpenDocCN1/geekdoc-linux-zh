    ## 创建 Bash 脚本 – 第 3 部分


    在之前的页面中，我们看了一些非常基础的 Bash 脚本编写，涉及将文本输出到屏幕、获取用户输入、存储并将其输出到屏幕；以及使用 Date 命令包含一个系统变量。现在让我们结合你目前所掌握的内容，并引入循环（Loops）。


    ### IF, THEN, ELSE


    在大多数编程结构中，迟早会需要循环执行你输入的命令以创建更好的功能，并最终打造一个更好的程序。


    - **步骤 1** 让我们现在看看 If、Then 和 Else 语句，当正确执行时，它们会比较一组指令，并简单地计算出：IF 某物存在，THEN 做某事，ELSE
    做其他不同的事。创建一个名为 **greeting2.sh** 的新脚本，并将下方截图中的文本输入到其中。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_71_0.png)


    - **步骤 2** **Greeting2.sh** 是 greeting.sh 的副本，但略有不同。在这里，我们添加了一个从 if 语句开始的循环。这意味着，IF
    输入的变量等于 David 的下一行，THEN，是对其发生的反应，在这种情况下，它会在屏幕上输出“Awesome name,”，随后是变量（即 **David**）。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_71_2.png)


    - **步骤 3** 下一行，**ELSE**，是当变量不等于‘David’时发生的情况。在这种情况下，它只是将现在熟悉的“Hello…”输出到屏幕上。最后一行，**FI**
    语句，是结束循环的命令。如果你有一个 if 命令而没有 FI 命令，那么你会得到一个错误。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_71_1.png)


    - **步骤 4** 你当然可以对脚本稍作调整，改变触发响应的名称变量；或者甚至发出一个响应，其中名和姓的变量匹配某个特定变量。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_71_3.png)


    ### 更多循环


    你可以使用 FOR、WHILE 和 UNTIL 语句对数据进行循环。如果你需要批量命名、复制或运行需要计数器的脚本，这些语句会很有用。


    - **步骤 1** 创建一个名为 **count.sh** 的新脚本。输入下方截图中的文本，保存并使其可执行。这创建了变量 ''count''，在脚本开始时它等于零。然后启动
    WHILE 循环，只要 count 小于（**LT** 部分）100，就会在 echo 命令中打印 count 的当前值。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_72_0.png)


    - **步骤 2** 执行 count.sh 脚本的结果是，数字 0 到 99 会在终端屏幕上列出；当它达到 100 时，脚本将结束。使用 FOR 语句修改脚本，其工作方式大致相同。要在我们的脚本中使用它，请将截图中的文本输入到
    count.sh 脚本中。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_72_1.png)


    - **步骤 3** 这里我们添加的是：**for count in {0..100}; do**。其含义为：对于变量 ''count'' 在 0 到 100
    的数字中，然后启动 FOR 语句，使其以大致相同的方式工作。要在我们的脚本中使用它，请将截图中的文本输入到 count.sh 脚本中。脚本的其余部分相同。运行此脚本，终端中应出现相同的输出。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_72_2.png)


    - **步骤 4** UNTIL 循环的工作方式与 WHILE 循环大致相同，只是通常情况是相反的。因此，我们使用 **UNTIL** 计数到一百，将是：**until
    [ $count -gt 100 ]; do**。区别在于，只要 count 大于（**gt** 部分）一百，就继续循环。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_72_3.png)


    - **步骤 5** 你并不局限于 0 到 100 的数字。在循环内部，你可以有任何一组你想要的命令，并按你想让循环运行多少次来执行它们。例如，重命名一百万个文件、创建五十个文件夹等。例如，此脚本将使用
    FOR 循环创建十个名为 folder1 到 folder10 的文件夹。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_72_4.png)


    - **步骤 6** 再次使用 FOR 语句，我们可以通过操纵 (0..100) 部分来执行计数序列。这段代码实际上意味着 (START..END..INCREMENT)，如果没有增量，则只是单个数字直到
    END。例如，我们可以让循环以 2 为增量计数到 1000：**for count in {0..1000..2}; do**。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_72_5.png)

