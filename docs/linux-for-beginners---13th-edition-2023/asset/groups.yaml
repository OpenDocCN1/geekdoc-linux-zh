    \ 中。使其可执行，然后运行它。你应该会看到几个对话框出现，最后是一条消息。\n\n![](img/7801ba6bee6a3a08f7f02897cdbcd867_76_4.png)\n\
    \n### 步骤 10\n\n虽然在游戏中使用 Bash 脚本并不常见，但这是完全可能的，尽管稍微基础一些。基于移动的游戏很难，有时还有 bug，但是一个好的文字冒险游戏，或者\
