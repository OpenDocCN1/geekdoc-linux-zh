    # USEFUL HELP/INFO COMMANDS


    The following commands are useful for when you are trying to learn more about
    the system or program you are working with in Linux. You might not need them every
    day, but when you do, they will be invaluable.


    The **free** command displays the total amount of free and used physical and swap
    memory in the system. For example, `free -m` gives the information using megabytes.


    The **sed** command opens a stream editor. A stream editor is used to perform
    text transformations on an input stream: a file or input from a pipeline.


    The **df** command displays filesystem disk space usage for all partitions. The
    command `df -h` is probably the most useful (the -h means human-readable).


    The **adduser** command adds a new user to the system. Similarly, the addgroup
    command adds a new group to the system.


    The **top** program provides a dynamic real-time view of a running system. It
    can display system summary information, as well as a list of processes.


    The **deluser** command removes a user from the system. To remove the user''s
    files and home directory, you need to add the `--remove-home` option.


    The **uname** command with the `-a` option prints all system information, including
    machine name, kernel name, version and a few other details.


    The **delgroup** command removes a group from the system. You cannot remove a
    group that is the primary group of any users.


    The **ps** command allows you to view all the processes running on the machine.
    Every operating system''s version of ps is slightly different but all do the same
    thing.


    The **man man** command brings up the manual entry for the man command, which
    is a great place to start when using it.


    The **grep** command allows you to search inside a number of files for a particular
    search pattern and then print matching lines. An example would be: `grep blah
    file`.


    The **man intro** command is especially useful. It displays the Introduction to
    User Commands, which is a well written, fairly brief introduction to the Linux
    command line.


    # A-Z of Linux Commands


    There are literally thousands of Linux commands, so while this is not a complete
    A-Z, it does contain many of the commands you will most likely need. You will
    probably find that you end up using a smaller set of commands over and over again
    but having an overall knowledge is still very useful.


    ### A

    - **adduser**: Add a new user

    - **arch**: Print machine architecture

    - **awk**: Find and replace text within file(s)


    ### B

    - **bc**: An arbitrary precision calculator language


    ### C

    - **cat**: Concatenate files and print on the standard output

    - **cd|ir**: Change working directory

    - **chgrp**: Change the group ownership of files

    - **chroot**: Change root directory

    - **cksun**: Print CRC checksum and byte counts

    - **cmp**: Compare two files

    - **comm**: Compare two sorted files line by line

    - **cp**: Copy one or more files to another location

    - **crontab**: Schedule a command to run at a later time

    - **csplit**: Split a file into context-determined pieces

    - **cut**: Divide a file into several parts


    ### D

    - **date**: Display or change the date & time

    - **dc**: Desk calculator

    - **dd**: Data Dump, convert and copy a file

    - **diff**: Display the differences between two files

    - **dirname**: Convert a full path name to just a path

    - **du**: Estimate file space usage


    ### E

    - **echo**: Display message on screen

    - **ed**: A line oriented text editor (edlin)

    - **egrep**: Search file(s) for lines that match an extended expression

    - **env**: Display, set or remove environment variables

    - **expand**: Convert tabs to spaces

    - **expr**: Evaluate expressions


    ### F

    - **factor**: Print prime factors

    - **fdisk**: Partition table manipulator for Linux

    - **fgrep**: Search file(s) for lines that match a fixed string

    - **find**: Search for files that meet a desired criteria

    - **fmt**: Reformat paragraph text

    - **fold**: Wrap text to fit a specified width

    - **format**: Format disks or tapes

    - **fsck**: Filesystem consistency check and repair


    ### G

    - **gawk**: Find and Replace text within file(s)

    - **grep**: Search file(s) for lines that match a given pattern

    - **groups**: Print group names a user is in

    - **gzip**: Compress or decompress named file(s)


    ### H

    - **head**: Output the first part of file(s)

    - **hostname**: Print or set system name


    ### I

    - **id**: Print user and group ids

    - **info**: Help info

    - **install**: Copy files and set attributes


    ### J

    - **join**: Join lines on a common field


    ### K

    - **kill**: Stop a process from running


    ### L

    - **less**: Display output one screen at a time

    - **ln**: Make links between files

    - **locate**: Find files


    # Using the Terminal


    **DID YOU KNOW...** that NASA’s state-of-the-art supercomputing cluster, Pleiades,
    is powered by Linux? Pleiades consists of 160 racks (11,440 nodes), 245,536 CPU
    cores, a total memory count of 935TB, 184,320 NVIDIA CUDA cores, and over six
    miles of fibre optic cabling.


    At the heart of it lies a complex setup of SUSE Linux Enterprise Server, along
    with many custom development packages and other software unique to NASA''s projects.
    The projects NASA''s Advanced Supercomputing Division uses Pleiades for are: The
    Kepler Mission – searching for extra-solar Earth-like planets; CFD (Computational
    Fluid Dynamics) modelling to help create more efficient space launch systems;
    Dark Matter research and simulation; and visualisation of Earth''s ocean currents,
    building data for the ECCO (Estimating the Circulation and Climate of the Ocean)
    Project.


