    ## 使用终端


    ### 树莓派 x Linux = 完美组合


    树莓派是一款出色的硬件，为了充分发挥其潜力，它需要一个出色的操作系统。幸运的是，Linux 是树莓派默认且推荐的操作系统，两者结合可谓天作之合。


    在树莓派处于开发阶段时，设计者需要确保他们正在创建的这款硬件不仅仅是一台廉价但体积小巧的计算机，还能提供更多功能。


    树莓派需要具备高度的灵活性，需要为其未来向更具雄心的项目概念和想法发展预留空间，并且需要尽可能易用。其目标是创建一个通用的学习平台，让不同年龄段的学生都能在此基础上进行拓展和探索，同时学习编程、电子学和计算等新概念。自然而然地，一旦硬件开发完成，操作系统唯一真正的选择当然是
    Linux。


    Linux 的多功能性可谓传奇。这个不可思议的核心操作系统具有极强的可塑性，它可以被引导应用于计算的几乎所有领域，从超级计算到机器人技术，从航天工业到地面工程；从教育科学到制造和网络。只要你想到一个行业，你很可能会发现某个后台正在运行
    Linux，将它们维系在一起。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_77_0.png)


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_77_1.png)


    Raspbian 是树莓派的推荐操作系统，它是一个定制化的基于 Debian 的发行版，内置了一系列满足编码、电子学及常规桌面计算需求的实用工具。除了应用程序外，还预装了模块，帮助你最大限度地利用你决定学习和使用的每种编程语言，以及用于硬件模块的软件，使你能够驱动和使用树莓派特有的硬件特定设备。例如，有与树莓派
    40 针 GPIO 交互的 Python 模块，允许你为任何 Hardware Attached on Top (HAT) 设备创建内容。


    这种组合使得树莓派成为学习编码以及一般性 Linux 知识的绝佳操作基础。Raspbian 基于 Debian，能够运行本书中列出的任何终端命令，因为 Linux
    Mint 甚至 Ubuntu 也是基于 Debian 的。而且由于树莓派体积小巧，设置成本极低，你可以同时拥有常规的 Windows 或 macOS 计算机，以及一台树莓派作为无头计算机（即不需要连接键盘、鼠标或显示器即可通电工作的设备，你通过远程方式连接它），从而学习如何使用
    Linux 以及如何编码。


    ### 哪款树莓派？


    市面上有多种树莓派型号，每种与其他型号都略有不同。最新发布的树莓派是 Raspberry Pi 4 Model B，虽然与其他型号相比价格稍贵，但它是目前性能最强、功能最丰富的树莓派。总体而言，最好先使用
    Pi 4 Model B 开始实验，待你提升技能并专注于特定项目（例如需要更小体积且具备 Wi-Fi 连接的 Pi Zero 型号）时，再转向其他型号。


    - Pi 3 Model A+ 于 2018 年 11 月发布，比之前的 Model A 有了巨大的改进。

    - Raspberry Pi 3 Model B+ 是目前可用的最佳树莓派型号之一。

    - 具备内置 Wi-Fi 和蓝牙的 Raspberry Pi Zero W，是一款极佳的项目型树莓派。

    - 在可用的树莓派型号中，我们推荐 Pi 4 Model B、Pi 3 Model B+ 和 Pi Zero W。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_78_0.png)


    ### 超越树莓派 OS


    树莓派 ARM 处理器的灵活性意味着它能够运行默认树莓派 OS 以外的其他操作系统。继续坚持使用 Linux，你可以安装 Ubuntu MATE、PIDora（基于
    Fedora 的发行版）、Lakka、PIPlay（复古仿真发行版）以及 Arch Linux ARM。还有一些基于 Linux 内核的系统，如 Android、Symbian
    和 Chromium OS。还有 Windows 10 IoT Core、FreeBSD、RISC OS Pi、Plan 9，以及令人惊讶的 AROS -
    一个 Amiga OS 克隆版。不用说，一旦你完成了一个版本 Linux 的实验，就像在桌面版 Linux 上那样，你可以切换到树莓派上的另一个版本，看看它的运作方式，以及是否适合你。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_78_1.png)


    ### 树莓派、Linux 与编码


    如前所述，树莓派是一个极佳的代码基础，以 Linux 为支柱，你可以开始学习多种不同的编程语言。Bash 脚本运行完美无缺，因为 Raspbian 是 Linux
    且基于 Debian，你可以轻松地扩展你的脚本以涵盖树莓派的大部分功能。除了创建备份脚本，你还可以创建访问树莓派 GPIO 引脚的脚本，从而控制 LED 甚至更复杂的
    HAT。


    Python 是初学者最流行的选择，Raspbian 预装了你充分利用 Python 体验所需的一切。有 countless 预加载模块，以及该语言最新稳定版本。


    C++ 是最具实力的编程语言之一。它用于游戏、应用程序，甚至整个操作系统。树莓派自带一个出色的 C++ 编辑器，易于使用，可以帮助你开发惊人的内容。无论你决定如何展开你的编码和
    Linux 之旅，树莓派都是一个极佳的起始平台。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_78_2.png)


    ## 命令行快速参考


    当你开始全职使用 Linux 时，你会很快意识到 Ubuntu、Mint 等的图形界面在许多任务中表现出色，但并非对所有任务都出色。理解如何使用命令行不仅能增强你对
    Linux 的理解，还能提高你关于编码和编程的总体知识。我们的命令行快速参考指南旨在帮助你更快地掌握 Linux。


    ### 十大命令


    这些可能不是每个人最常用的命令，但它们对于许多 Linux 和命令行用户来说肯定会出现得相当频繁。


    **cd**

    cd 命令是你在 Linux 命令行中会最多使用的命令之一。它允许你更改工作目录。你使用它在文件系统的层级结构中进行导航。你也可以使用 chdir。


    **mv**

    mv 命令将文件移动到新位置或重命名文件。例如 `mv file sub` 将原始文件重命名为 `sub`。`mv sub ~/Desktop` 将文件 ''sub''
    移动到桌面目录，但不会重命名它。你必须指定一个新文件名来重命名文件。


    **ls**

    ls 命令显示当前目录中的文件。使用特定选项时，它让你查看文件大小、文件创建时间和文件权限。例如，`ls -` 显示主目录中的文件。


    **chown**

    chown 命令更改每个给定文件的用户和/或组所有权。如果仅指定所有者（用户名或数字用户 ID），则该用户成为每个给定文件的所有者，且文件的组不变。


    **cp**

    cp 命令用于创建文件和目录的副本。例如，`cp file sub` 创建你输入名称的文件的精确副本，并将副本命名为 sub，但原始文件仍以其原始名称存在。


    **chmod**

    chmod 命令更改所列文件上的权限。权限基于一个相当简单的模型：你可以为用户、组和世界设置权限，并且你可以设置每个人是否可读取、写入或执行文件。


    **pwd**

    pwd 命令打印当前工作目录的完整路径名（pwd 代表 ''print working directory''）。注意，GNOME 终端也在其窗口标题栏中显示此信息。


    **rm**

    rm 命令删除（移除）文件或目录。删除过程将文件系统中的一个文件名与存储设备上的数据解链，并标记该空间为可供未来写入使用。换句话说，删除文件增加了磁盘上可用的空间量。


    **clear**

    clear 命令在可能的情况下清除屏幕。它查找环境中的终端类型，然后在 term.info 数据库中确定如何清除屏幕。这与在使用 bash shell 时输入
    Control-L 等效。


    **mkdir**

    "make directory" 的简称，mkdir 用于在文件系统上创建目录。如果指定的目录尚不存在。例如，`mkdir work` 创建一个 work
    目录。调用 mkdir 时可以指定多个目录。


    '
