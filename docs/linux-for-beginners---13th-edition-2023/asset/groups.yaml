    > “我不确定，这是我接触的第一台。”


    – 格拉维斯·霍珀海军上将（先锋程序员）在接受大卫·莱特曼采访时所说


    # 向 Linux 问好


    为什么是 Linux？它是什么？我在哪里获取它？为什么有这么多不同的版本？大多数初学者在开始时都会问这些问题，还有许多其他问题。确实，Linux 是一个极其多功能且强大的操作系统，但你从哪里开始呢？幸好，你可以在本节找到答案。


    使用 Linux 可以做的事情非常多，但你需要知道从哪里开始；我们在这里帮助你。在本节中，你可以了解什么是 Linux，什么是发行版，什么是桌面环境。你还可以开始探索
    Linux 的工作原理以及它如何为你所用。


    ### 为什么选择 Linux？


    对于许多用户来说，Linux 意味着自由。摆脱其他操作系统封闭花园模式的自由，自由地更改和使用操作系统的自由，以及摆脱任何形式的授权或付款的自由。然而，Linux
    远不止你想象的那样简单。


    #### 免费且开放


    Linux 非常适合那些想要与众不同的人。**系统的效率、应用程序的可用性以及稳定性都是它的一些良好理由。**


    你需要知道的第一件事是，并不存在一个名为 Linux 的操作系统。Linux 实际上是操作系统内核，是操作系统的核心组件。当我们谈论 Linux 时，我们和其他人指的是使用
    Linux 内核的众多发行版之一。毫无疑问，你至少听说过当前流行发行版中的一个：Ubuntu、Linux Mint、Fedora、openSUSE、Debian、Raspbian，名单还在继续。这些发行版中的每一个都为用户提供了略有不同的东西。虽然每个发行版的核心都是
    Linux 内核，但它们为用户提供了一个外观不同的桌面环境、不同的预装应用程序、不同的系统更新方式以及安装更多应用程序的方式，以及整个系统稍有不同的外观和感觉。然而，核心是
    Linux，这就是我们称之为 Linux 的原因。


    Linux 的工作方式与 Windows 或 macOS 大不相同。首先它是免费的：免费下载，免费安装在任何数量的电脑上，无限期免费使用，并可以使用同样免费的程序和应用程序进行升级和扩展。这种免费使用的特性是吸引开发者的最大因素之一。虽然
    Windows 授权费可能高达 100 英镑，而 Mac 的费用要高得多，但用户，无论是开发者、游戏玩家还是想要利用旧电脑的人，都可以在几分钟内快速下载一个发行版并开始工作。


    除了免费使用的方面，还有定制和塑造系统以适应自身用途的自由。互联网上可用的每个发行版都有一定的“倾向”，


    Linux 是一个很好的开始编码的操作系统。


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_7_0.png)


    ![](img/7801ba6bee6a3a08f7f02897cdbcd867_8_0.png)


    # Linux 下有数千个免费包可供程序员使用。


    有些发行版提供增强的安全性、华丽的桌面、特定的游戏倾向，或面向学生的特性。这种可扩展性使 Linux 成为更令人向往的使用平台，因为你可以将系统快速塑造成开发基础，包括针对
    Python、Web 开发、C++、Java 等的各种 IDE；或者创建一个用于在线匿名的基础，例如作为 Minecraft 服务器、媒体中心等。


    对于想要学习如何编码的人来说，另一个显著优势是 Linux 内置了大多数流行的编码环境。Python 和 C++ 在可获得的 Linux 发行版中以高比例预装，这意味着你几乎可以在安装系统并首次启动后就开始编程。


    一般来说，Linux 占用的系统资源比 Windows 或 macOS 少；这里的系统资源指的是内存、硬盘空间和 CPU 负载。Linux 代码经过精简，没有占用系统资源的第三方“臃肿软件”。更高效的系统当然意味着为编码和测试环境以及你最终创建的程序提供更多可用资源。较少的资源使用还意味着你可以在通常运行最新版本的
    Windows 或 macOS 时会吃力甚至无法运行的旧硬件上使用 Linux；因此，而不是扔掉旧电脑，可以使用 Linux 发行版重新利用它。不过，这并不全关于
    C++、Python 或其他更流行的编程语言。使用 Linux 的命令行，也称为终端，你可以创建 Shell 脚本，这是设计为从命令行运行的程序，由脚本语言组成。它们主要用于自动化任务或为特定操作提供某种形式的输入和输出。最后，尽管我们可以列出更多优势，但有数千个免费的程序和应用程序可用，涵盖了计算的几乎所有方面。被称为软件包，目前（撰写时）仅
    Linux Mint 就有超过 8,700 个特定的编程应用程序，以及总共令人难以置信的 62,000+ 个软件包，满足从业余无线电到 WWW 工具的一切需求。因此，Linux
    是一个伟大的编程资源和环境。它非常适合开发人员，并不断改善和演变。如果你认真考虑进入编码领域，或者只是想尝试一些新事物，不妨试试 Linux，看看它是否适合你。


    # Linux 编程环境可以像你需要的那样简单或复杂。


    '
