- fmt: "\nWhile many programs use the generalized form of command options argument,\
    \ not all commands insist on this. Some programs will allow a user to mix options\
    \ and arguments arbitrarily and simply behave as if all options came immediately\
    \ after the command. With commands, though, options are only acted upon by the\
    \ program if they are encountered while the command line is processed in sequence\
    \ from left to right. To avoid problems, I recommend that you stick with the command\
    \ options argument format, unless there is a good reason to deviate from it. \n\
    \nNow, just like in the English language, if you don’t use proper syntax, then\
    \ your recipient (the system) won’t have a good understanding of what to do. Some\
    \ programs will simply stop and do nothing. Others may stop and provide an error.\
    \ Still others may attempt to process the command, but severe problems can arise\
    \ if the incorrect options or arguments were used.\n\n## Shell Scripting\nSince\
    \ there are thousands of commands available for the command line, it can be a\
    \ monumental task for a user to remember all of them. In addition to that, having\
    \ to sit behind the keyboard and type out each command can become time consuming\
    \ as well. But, the real power of computing comes with the ability to simplify\
    \ repetitive and time-consuming tasks for the user. To get it to do that, we can\
    \ harness the shell’s power to automate things by writing shell scripts that contain\
    \ all the exact commands we want to run.\n\nIn the simplest terms, a shell script\
    \ is a file containing a series of commands. The shell reads this file and carries\
    \ out the commands as if entered directly on the command line. For example, I\
    \ have a script that I use to collect evidence from a victimized computer during\
    \ an incident response. Instead of having to type out all 10-15 commands myself,\
    \ I simply run the script and it performs each of those commands listed in my\
    \ script one at a time until they are all completed. Scripts, though, can be much\
    \ more complex. For example, you can add logic to them by using basic programming\
    \ so that they can detect changes to the system based on events or even the time\
    \ of day.\n\n## Variables\nAnother essential feature of using the command line\
    \ interface is the ability to use a name or label to refer to some other quantity,\
    \ such as a value or a command. This is commonly referred to as a variable.\n\n\
    At the very least, variables make your scripts and programming more readable for\
    \ an end user. However, we can also use variables in more advanced programming\
    \ when a user is in a situation in which the actual values aren't known before\
    \ the program executes. Essentially, a variable serves as a placeholder that is\
    \ resolved at the actual execution of the script.\n\nA variable is an area of\
    \ memory that can be used to store information and is then referred to by a name.\
    \ Whenever the shell sees a word that begins with a `$`, it treats it as a variable\
    \ and attempts to determine what was assigned to it in order to substitute the\
    \ real value in its place.\n\nTo create a variable, a user should enter the name\
    \ of the variable followed immediately by an equal sign (`=`) within the script.\
    \ Please note, spaces cannot be used when entering the name of a variable. After\
    \ the equal sign, we write the information that needs to be stored. This value\
    \ is then assigned to the variable whenever that line is executed within the script.\n\
    \nFor example, `$month=May` would assign a value of “May” to the variable `$month`.\
    \ Whenever the variable name (`$month`) is written in the script after this point,\
    \ it will be substituted at the time of execution with the word “May”. When assigning\
    \ a name to a variable, there are three rules that must be followed:\n\n- Variable\
    \ names must start with a letter\n- Variable names must not contain embedded spaces\n\
    - Punctuation marks are not allowed\n\nTo ease readability, most programmers will\
    \ use the underscore character (`_`) in place of a space within variable names,\
    \ since spaces are prohibited. For example, if I wanted a variable to store information\
    \ about which day of the week it was, I might name the variable as `$day_of_week`.\n\
    \nWhen a user starts a shell session, there are already some variables declared\
    \ and configured by a startup script runs while loading the operating system.\
    \ To see all the variables that are in the user’s environment, users can enter\
    \ the `printenv` command. A script will always include the name of the machine\
    \ being used. Consider the following example of the output of the `printenv` command:\n\
    \n```\n| DionTraining:Documents jason$ printenv\nTERM_PROGRAM=konsole\nSHELL=/bin/bash\n\
    TERM=xterm-256color\nPATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin\nPWD=/home/jason/Documents\n\
    LANG=en_US.UTF-8\nXPC_FLAGS=0x0\nXPC_SERVICE_NAME=0\nSHLVL=1\nHOME=/home/jason\n\
    LOGNAME=konsole_\nUSER=/usr/bin/printenv\nOLDPWD=/home/jason\nDionTraining:Documents\
    \ Jason$ |\n```\n\nAs you review the output above, notice that all environment\
    \ variable names are uppercase by standard convention.\n\n## Quoting\nAs previously\
    \ stated, the shell reads input from the user; parses that input into commands,\
    \ options, and arguments; and then executes those commands. As each command executes,\
    \ its command line options and arguments execute. Unfortunately, the shell treats\
    \ certain characters in a special way when it encounters them in the command line.\
    \ These special characters are called shell metacharacters. There are several\
    \ shell metacharacters, including the space, dollar sign, star, semi-colon, greater\
    \ than symbol, question mark, ampersand, and pipe (` `, `$`, `*`, `;`, `>`, `?`,\
    \ `&`, `|`).\n\nUp to this point, you have already seen a few of these shell metacharacters.\
    \ For example, the most common shell metacharacter is the space character that\
    \ the shell uses to separate the command, options, and arguments. Because of the\
    \ space character’s special status, the shell will not pass any spaces to the\
    \ command. Instead, the shell uses this metacharacter to separate and identify\
    \ individual arguments. As far as the shell is concerned, a single space or 100\
    \ spaces mean the same thing: “I am about to find the next argument”.\n\nSo, how\
    \ can we pass a file or directory name as an argument that has a space? For example,\
    \ we used `Essentials` as the directory name in the `ls` command example, but\
    \ what would we do if the directory was called `Linux Essentials`? To pass a metacharacter\
    \ to the shell and have it treated as a normal character instead, we use quoting.\
    \ Quoting prevents the shell from acting on and expanding the metacharacters.\
    \ It causes the shell to ignore the special meaning of the character, so that\
    \ the character gets passed unchanged to a command as part of an argument. Quoting\
    \ uses either double quotes (`\"\"`), single quotes (`''`), or backslash (`\\\
    `) characters.\n\nWhen we use quoting, the shell will ignore any special meaning\
    \ that a metacharacter has and treat it simply as plaintext. For example, a quoted\
    \ space character will not separate arguments while an unquoted space character\
    \ will. Normally, we use a semicolon to enter two commands on a single command\
    \ line, but a quoted semicolon (`\";\"`, `';'`, or `\\;`) will not perform this\
    \ function. While technically quoting is only applied to the individual shell\
    \ metacharacters protected from the shell and not to the whole command line argument,\
    \ you can also surround the whole argument with matching quote characters (for\
    \ example, `ls -la \"Linux Essentials\"` instead of `ls -la Linux \"Essentials\"\
    `). We may also use backslashes to quote or turn off the special meaning of each\
    \ immediately following character (for example, `ls -la Linux\\ Essentials`).\
    \ The shell will execute all three of these examples the same way and provide\
    \ the exact same results.\n\n```\n| DionTraining:Documents jason$ ls -la \"Linux\
    \ Essentials\"\nDionTraining:Documents jason$ ls -la Linux \"Essentials\"\nDionTraining:Documents\
    \ jason$ ls -la Linux\\ Essentials |\n```\n"
