    # Take and pass the LPI Linux Essentials certification exam


    Congratulations! You’ve made it to the end of this book, but there is still more
    to do. I know that we have covered a lot of material in this book, from getting
    started with Linux, to installing your own Linux distribution, to working in the
    command line, and even setting configuring permissions and ownership of files
    and directories.


    I know that you are probably excited to move on and take the certification exam,
    but first we want to make sure that you are fully ready. I recommend that you
    take practice exams so that you are sure that you are good to go before the big
    exam. I have included one practice exam in this book, but feel free to take as
    many as you want—you can find others on the internet, throughout other texts,
    and other resources. If you have taken the time to register this book, you can
    find many additional practice exams included in our companion course.


    If you take my practice exam and score at least 85%, you are probably ready to
    take (and pass) the LPI Linux Essentials certification exam. Nonetheless, take
    a couple of practice exams so that you feel comfortable before test day, I promise
    it will help. Practicing will ease your nerves, give you the confidence needed
    to succeed, and make sure that everything is sticking properly in your head, so
    that you can pass the test the first time.


    Your journey to becoming a certified Linux user and system administrator starts
    now. Good luck!


