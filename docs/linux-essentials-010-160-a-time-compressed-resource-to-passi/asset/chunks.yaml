    大多数在 Ubuntu 上预装或稍后安装的桌面应用程序都是更流行的商业软件的免费开源替代方案。然而，这并不意味着它们缺乏性能。事实上，这些程序中的大多数现在已成为主流，有时甚至比商业软件更受青睐。许多免费开源应用程序的功能与它们的商业对应品相似，仅有细微的差别。


    ## 办公套件

    `LibreOffice` 是一个免费开源的办公套件，在包括 Ubuntu 在多数 Linux 发行版中均预安装。它类似于 `Microsoft Office`。LibreOffice
    套件包含 `Writer`，这是一个类似于 `MS Word` 的文字处理程序。它允许我们编写笔记和文档，并根据喜好进行格式化处理。该办公套件还包含 `Calc`，这是一个类似于
    `MS Excel` 或 macOS 上 `Numbers` 的电子表格程序。对于创建类似于 `MS PowerPoint` 或 `Keynote` 的演示文稿，`Impress`
    是对应的程序。


    ## 媒体与图形编辑

    `VLC` 媒体播放器是一款适用于 Ubuntu 的免费开源、便携、跨平台媒体播放器软件和流媒体服务器。该程序的优点是它是跨平台的，这意味着它可以运行在其他操作系统上，如
    Windows、macOS 甚至手机。它与其他媒体播放器相比的主要优势是能够播放几乎任何音频和视频格式，并支持广泛的解码器。


    Ubuntu 上类似于 `Adobe Photoshop` 的图像处理程序是 `GIMP`。`GIMP` 是 `GNU Image Manipulation
    Program` 的缩写，是一个免费开源的位图图形编辑器，用于图像修饰和编辑、自由绘制、不同图像格式之间的转换以及更专业的成像任务。


    对于寻找类似于 `Adobe Premier` 或 `Final Cut Pro` 的视频编辑程序的人来说，`Kdenlive` 是一个免费开源的替代方案。对于音频文件，使用的程序是
    `Audacity`：这是一个强大的、跨平台的开源数字音频编辑和录制应用程序。


    ## 浏览与生产力

    Ubuntu 预装的浏览器浏览器是 `Firefox`，尽管用户也可以添加其他浏览器，如 `Google Chrome`、`Opera` 等。


    ## 服务器与网络管理

    对于服务器和网络管理员来说，拥有扩展 Ubuntu 桌面之外能力的应用程序也非常重要。这些服务器应用程序之一是 `Wireshark`。它是一个免费开源的数据包分析器。管理员使用它进行网络故障排除、分析以及软件和通信协议开发。


    `GParted` 是一个用于管理磁盘分区的图形用户界面。它可以创建、格式化和调整分区大小，而无需记忆执行这些功能所需的输入代码。


    管理服务器和网络的重要方面是备份数据的能力，以便在系统崩溃或故障时从中检索或恢复数据。一个名为 `Timeshift` 的应用程序可以对系统进行计划快照，当发生意外删除或更改导致当前系统不稳定时，能够将系统恢复到先前的快照。


    为了快速创建用于编码或系统脚本的文本而非办公文档，`Atom` 是一个很好的应用程序。它类似于 Windows  `Notepad`。系统和网络管理员的另一个有用工具是
    `PuTTY`。`PuTTY` 是一个免费开源的终端模拟器、串口控制台和网络文件传输应用程序。它支持多种网络协议，包括 `SCP`、`SSH`、`Telnet`、`rlogin`
    和原始套连接。


