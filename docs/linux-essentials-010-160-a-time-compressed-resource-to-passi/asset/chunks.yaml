  trans: '

    网络是现代计算的关键局组成部分。这就是为什么大多数 Linux 发行版都能在用户首次启动 Linux 系统时自动创建网络连接。遗憾的是，在某些少数情况下，这种自动化过程无法正常工作。当这种情况发生时，用户可能需要对连接进行唯一化配置或调试特定问题。


    # 基础网络功能


    在学习如何配置、测试或保护网络连接之前，理解一些最基础的网络功能和术语很重要。这包含了常用的网络组件，如互联网、`ethernet`、`Wi-Fi`、`TCP/IP`、`DHCP`、`IP
    address`、`network mask`、`router` 和 `DNS`。


    由于用户每天都在使用，大多数人对互联网已经熟悉。事实上，当你在线上购买这本书时，你正在使用互联网。互联网简单指的是遍布全球的互连计算机网络，它们使用标准的
    Internet 协议套件（`TCP/IP`）进行通信。


    为了连接互联网，大多数用户会使用有线或无线网络。有线网络通常根据该网络使用的硬件设备被称为 `ethernet`。从技术上讲，`ethernet` 是将数据拆分为信息帧并通过介质（如电线或射频波）传输这些帧的一种方式，但大多数人将有线网络称为“以太网网络”。这种
    `ethernet` 标准定义在 `IEEE 802.3` 文档标准中。


    然而，如果你使用的是无线网络，它在 `IEEE 802.11` 标准中定义并被称为 `Wi-Fi`。虽然存在其他无线网络标准（如蜂窝网络和 `Wi-Max`），但桌面电脑、笔记本和其他支持
    Linux 的设备最常用的是 `Wi-Fi`。


    无论你的设备使用的是有线还是无线连接，它们都一定在使用 `TCP/IP` 将数据从你的系统传输到另一个系统。传输控制协议/网协议（`TCP/IP`）是软件层面底层大多数现代网络通信的一套标准。如今每个连接到网络的设备都支持
    `TCP/IP` 协议进行通信。30 多年来，它一直是事实标准，并可用于有线和无线连接。


    为了让你的设备在运行 `TCP/IP` 的网络上通信，该设备必须有一种让其他设备能够唯一标识它的方法。这可以通过其 `hostname` 或 `IP address`
    实现。`hostname` 是计算机为了让人类容易识别而使用的字母数字名称。这些主机名由计算机部分和网络部分组成。例如，如果你提到到 `www.diontraining.com`
    的 `hostname`，你实际上是指网络上作为我们公司 Web 服务器的计算机（名为 `www`），其位于某个网络（名为 `diontraining.com`）。


    遗憾的是，计算机并不理解这些字母数字主机名，因为计算机是逻辑和数学的实体。因此，每台计算机都必须有一个唯一的 Internet 协议（`IP`）地址，用于在给定网络上标识自己。`IP
    address` 用于计算机之间方便地相互通信。


    `IP address` 格式有两种类型，被称为 `IPv4` 和 `IPv6`。`IPv4` 是旧格式，采用由由点分隔的四个十进制数字组成的 32 位地址，每个数字都应在
    0 到 255 之间，例如 `10.4.62.178`。`IPv4` 地址的问题在于它只有 42 亿个唯一地址。虽然这听起来很多（而且以前确实如此），但在互联网等现代网络中已经迅速耗尽了这些
    `IP` 地址。


    为了取代 `IPv4`，引入了名为 `IPv6` 的新变体。`IPv6` 使用 128 位地址，由分号分隔的十六进制数字组成。由于地址位宽大得多，有超过 3.4
    x 10³⁸ 个 `IPv6` 地址供使用。


    对于 LPI Linux Essentials 考试，记住 `IPv4` 和 `IPv6` 地址的数量并不重要，但你应该能够根据视觉观察识别这些地址。例如，如果你看到
    `192.168.1.1`，你应该将其识别为 `IPv4` 地址；而如果你看到像 `fe80::afdc:48ff:fe00:5577` 这样的地址，你应该将其识别为
    `IPv6` 地址。


    那么，如果计算机偏好数字，而人们又偏于更容易阅读和记忆的主机名，我们如何将 `hostname` 和 `IP address` 关联起来？为了实现这一功能，创建了一个名为域名系统（`DNS`）的系统。`DNS`
    是一个全球服务器网络，可为我们的系统自动转换主机名和 `IP addresses`。要使用 `DNS`，你的 Linux 系统只需要将 `DNS` 系统的
    `IP address` 作为网络配置的一部分。然后，每当用户在应用程序中输入 `hostname` 或域名时（例如在 Google Chrome 浏览器中输入
    `www.diontraining.com`），应用程序将要求 `DNS` 将该名称（`www.diontraining.com`）转换为分配的 `IP address`，然后浏览器就可以使用其
    `IP address` 连接到远程服务器。


    要正确配置你的 Linux 系统使用网络，它需要四项信息：它自己的 `IP address`、它的 `network mask`、网关的 `IP address`
    以及有效 `DNS` 服务器的 `IP address`。在 `IPv4` 中，当分配 `IP address` 时，还必须提供一个 `network mask`
    来标识主机所在的网络。通过使用 `network mask`，系统确定 `IP address` 的哪个部分代表主机，哪个部分代表网络。子网划分的概念广泛使用这些约定，但这出了
    LPI Linux Essentials 考试的范围。如果你想学习更多关于子网划分的知识，建议考虑 CompTIA Network+ 课程。网络配置的最后一个组件是系统的
    `gateway` `IP address`。`gateway` 是连接两个或多个网络的一个设备。大多数家庭和小型企业仅使用 `router` 设备来连接互联网并执行路由、`DNS`
    和其他有用服务。


    # 配置连接


    大多数情况下，网络连接会自动配置，`DHCP` 会分配关键的网络信息。但有时，这些细节必须手动配置，或者必须启用网络接口才能工作。如前所述，计算机至少需要两项信息来连接本地网络：`IP
    address` 和 `network mask`。如果你希望计算机还能执行名称解析并访问外部网络，则还必须配置 `DNS` 和 `gateway`。在大型网络上为每台计算机配置这些信息是非常耗时的。此外，这种手动配置可能会导致人为错误，例如在输入
    `IP address` 和其他关键信息时出错。出于此原因，大多数企业网络提供 `DHCP` 服务器在计算机首次连接时分配所有这些关键信息。


    根据服务器的配置，`DHCP` 可以使用固定或动态配置为每台计算机交付 `IP addresses`。固定配置确保 `DHCP` 服务器在每台计算机启动并连接网络时提供相同的
    `IP address`。而动态配置则让 `DHCP` 服务器在每台计算机启动时提供 `IP addresses`，但此地址不需要保持不变。每台计算机可以使用无线或有线网络连接。无线连接在笔记本电脑、平板电脑、智能手机和物联网设备上很常见，因为它们由于尺寸或配置通常缺少物理网线。但某些桌面电脑除了有线连接外还有
    Wi-Fi 能力。为了轻松配置 `Wi-Fi` 连接，最好使用图形界面。每个发行版连接 `Wi-Fi` 的方法和设置都不同，你应该咨询发行版的在线手册或论坛获取如何操作的细节。对于大多数发行版，通过图形界面连接
    `Wi-Fi` 的工作类似于 Windows 或 Mac，依赖于点击界面。


    如果有人需要微调无线连接，可以使用各种工具扫描可用的无线网络并管理连接到给定系统的 `Wi-Fi` 链接。为此，用户可以利用 `iwlist` 和 `iwconfig`
    工具。`iwlist` 命令可以通过扫描 `2.4 Ghz` 和 `5.0 Ghz` 的 `Wi-Fi` 频段来识别附近的 `Wi-Fi` 网络，这取决于用户系统中安装的无线适配器类型。扫描附近的网络列表，只需输入：


    ```

    iwlist scan

    ```

    或以 root 用户身份或使用 `sudo` 命令运行 `iwlist scanning` 获取完整的网络列表。一旦找到网络，用户可以使用 `iwconfig`
    工具手动连接或断开指定网络的连接。`iwconfig` 命令有许多选项和标志，因此请确保正确使用它。要配置有线连接，用户可以像在 Windows 或 Mac
    中一样简单地使用图形界面。如果用户需要对配置有更高的保真度和控制力，我们就可以使用命令行工具。正如 `iwconfig` 配置无线网络一样，`ifconfig`
    命令用于配置有线网络。


    DHCP 是一种大多数计算机用于从服务器获取网络配置的自动化机制。这非常有用，特别是在需要为成千上万计算机进行配置的大规模企业网络中。通过依靠 `DHCP`，系统在网络上发送广播消息以发现是否有可用的
    `DHCP` 服务器。此时，请求者已拥有自动配置自身网络连接所需的所有信息，DHCP 过程被称为 DORA：发现（Discover）、提供（Offer）、请求（Request）和确认（Acknowledge）。对于
    LPI Linux Essentials 考试，虽然你不需要深入理解这四个步的过程，但你应该记住 `DHCP` 会自动配置网络连接。


    # 测试网络


    在大多数情况下，网络连接在 Linux 系统启动时就是正常的。但有时，用户可能需要诊断网络问题，因为原本正常的连接停止工作了。有几种方法可以测试连通性。第一个测试是使用
    `route` 命令检查路由表，确保默认路由设置正确并检查路由。在大多数情况下，在终端输入 `route` 将会显示路由表，这通常是简单且自动配置的，但这出了
    LPI Linux Essentials 考试的范围。下一个最基础测试使用的是 `ping` 工具。`ping` 命令通过 `IP address` 或 `hostname`
    向系统发送简单的数据包并等待回复。在 Linux 系统中，`ping` 持续发送包，直到按下 `Ctrl+C` 键中断。在使用 `ping` 命令诊断网络问题时，必须考虑三种情况：首先，如果你可以连接内部网络但无法连接外部网络，那么问题可能出在路由器或路由设置上；其次，如果你可以通过
    `IP address` 连接系统但无法通过名称连接，那么问题最可能在 `DNS` 服务器或你的系统 `DNS` 配置上；第三，如果你无法 `ping` 任何系统，那么你的系统上可能存在基础问题，这可能是由损坏的网络栈甚至硬件故障引起的。虽然
    `ping` 在测试整个连接时非常有用，但当你尝试确定系统到远程系统之间中断的具体位置时，有一个更有用的工具 `traceroute`。`traceroute`
    命令向计算机和指定的远程系统发送系列测试包。当 `traceroute` 执行每个测试时，它会在屏幕上显示结果，告知用户哪些系统是正常的，这有助于确定网络连通性问题。


    # 保护网络


    如今，最重要的问题之一是安全。为了实现这一点，Linux 机器必须安装 `DHCP` 客户端。最常见的客户端被称为 `dhclient` 或 `dhcpcd`。如前所述，问题可能由域名系统（`DNS`）的问题引起。要使这些更改永久生效，必须存储在名为
    `/etc/resolv.conf` 的文件中。该文件包含了最多三个 `DNS` 服务器的 `IP addresses` 以及计算机名称。如果你需要修改给定系统使用的条目，可以在
    `/etc/resolv.conf` 中完成。


    为了自动化这一过程，许多发行版创建网络脚本来帮助此类启动和配置。每个发行版为此目的都使用自己的方法和脚本，这些被称为发行版特定的网络脚本。为了保护网络，你应该始终关闭任何未使用的服务或守护进程。防火墙是一个软件程序或系统设置，它检查每次事务，并根据预设标准允许或拒绝。大多数发行版默认启用嵌入式软件防火墙。

