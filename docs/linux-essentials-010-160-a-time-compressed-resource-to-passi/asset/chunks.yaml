    * Understand how to use a basic text editor

    * Be able to create a basic shell script

    * Be able to create scripts with conditions and loops


    As you have already seen, the command line environment is an extremely powerful
    tool, but it becomes infinitely more powerful when you can automate numerous functions
    at once using a script. In this chapter, you will be introduced to the concepts
    of creating your own scripts using the `bash` scripting language. To create a
    script, though, you must first learn how to create a file using a text editor
    to enter all the script’s commands and functions.


    ## Text Editors


    There are a lot of files in a computer system, but the most basic and flexible
    of them all is the simple text file. In fact, configuration files and shell scripts
    are typically just text files. Linux users will often modify configuration files
    and create shell scripts. Therefore, it is necessary to understand exactly how
    to edit text files from within the shell. To edit text files, the user must be
    able to start the editor and either create a new text file or edit an existing
    file.


    A text editor is a program that simply lets you view and edit documents stored
    in a plain-text format. Text files can include simple ASCII text; therefore, they
    cannot contain any graphics, fonts, emphasis on words (such as bold, italics,
    or underline), or any other advanced word processing features that you may be
    familiar with from a GUI-based program like Microsoft Word, LibreOffice, or even
    Google Docs. Text files contain multiple lines of text that can vary in length
    from 0 characters to multiple pages. These text files can hold many different
    data types as well, but most commonly they contain human readable ASCII text.
    If a user is viewing or editing their own files, they can do this as the standard
    user. If the user is attempting to view or edit system configuration files, though,
    then they must act as the `root` user by either using the `su` or `sudo` commands.
    Text files generally contain five different types of data within the files, including
    human readable language (such as English, Spanish, French, etc.), programming
    language (`bash`, `C`, `Python`, etc.), formatted text, program or system configuration
    files, and log files.


    There are a multitude of text editors that can be run within the Linux shell,
    but the four most popular are `vi`, `emacs`, `pico`, and `nano`.


    ### vi

    One of the oldest and most popular text editors is `vi`, which is short for “visual”.
    The `vi` program is a text-based editor originally created for the Unix operating
    system in 1976. It is quite popular with Linux administrators who often edit configuration
    files, but it is a bit more difficult to use than some of the other more modern
    text editors.


    ### emacs

    Emacsacs is an extensible, customizable, self-documenting, and real-time display
    editor that can be used both from the shell and the GUI. `Emacs` is a much larger
    and more complex program than `vi`, so it is often not installed in lightweight
    Linux distributions by default. `Emacs`, like `vi`, was also first created for
    Unix back in 1976, and it still remains popular with Linux administrators.


    ### pico

    `Pico` was designed to work similarly to `emacs` but removed many of the advanced
    features from within `emacs` to create a smaller program and file size. This made
    `pico` more popular with lightweight Linux distributions, but it’s not nearly
    as full featured.


    ### nano

    Some users found that `emacs` had too many features (and, therefore, was overly
    large), while `pico` didn’t have enough features. `Nano` was developed to fill
    in this gap in the market between `emacs` and `pico`. `Nano` has more features
    than `pico`, but it doesn’t have as many as `emacs`. This also gives `nano` a
    smaller file size than `emacs` and allows it to be small and lightweight, while
    still maintaining the most needed features from `emacs`.


    Each of the mentioned text editors has its own conventions for displaying information
    on the screen, manipulating text, and so on. Most text-mode text editors are similar
    up to a point; for instance, one or more lines at the top or bottom of the display
    typically show summary information or brief command prompts. Refer to the `man`
    pages of these text editors or launch them and explore their menus to know more
    about their behavior.


    After launching a text editor and making changes to the file, do not forget to
    save the file or make a back-up copy. It is worth taking note that since these
    programs do not feature autosave functions, it is best to regularly save changes
    to prevent data loss due to interruptions. Additionally, you should launch each
    of these programs, create a sample file, and get familiar with the usage of each
    of these programs to determine which text editor is your favorite—personally,
    I have always been a bigger fan of `pico` over `vi`.


    | Using Vi and Nano | Scan QR code to watch a video for this topic | ![A close
    up of a sign Description automatically generated](Image00020.jpg) |

