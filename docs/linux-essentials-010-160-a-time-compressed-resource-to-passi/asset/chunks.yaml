    cat command will shows the user''s UserID and Group number, information entered
    while creating the user account, home directory, and default shell. But on a system
    that may have thousands of users, there is a better way than manually searching.
    Typing "grep ''^username'' /etc/passwd", replacing username for the user being
    searched, will generate the lines in the etc/passwd file that contain the username.
    To find out which user number the user is, type "grep ''^username'' -nu /etc/passwd".More
    information about the adduser command can be found in its man pages.Another utility
    for creating user accounts is useradd. This is, however, more tedious than adduser
    and requires a longer string of commands. To add a user using useradd, type "sudo
    useradd -s default-shell -d home-directory -m  -G group-name username". You will
    be replacing ''default-shell'' with whichever default shell you want this user
    to use (usually, /bin/bash). Also, replace ''home-directory'' with the default
    home directory for the user, ''group-name'' for the group the user will be added
    to, and ''username'' with the actual username for the user account. One difference
    with useradd and adduser is that useradd creates the account but does not automatically
    ask for password assignment. To delegate a password to a user account created
    through useradd, type "sudo passwd username". This command is also for changing
    the password of other user accounts.


    | Modifying and Deleting AccountsScan QR code to watch a video for this topic
    | ![A close up of a sign Description automatically generated](Image00013.jpg)
    |


    Other than creating user accounts, system administrators will also need to manage
    these accounts, and a couple of the things that they need to do are modify and
    delete accounts. When modifying accounts, a common task is resetting passwords.
    To do that, type "sudo passwd username", replacing username with the user account
    whose password needs to be reset. Notice that there is no need to know the old
    password, as some of today''s system require. This is because the root user has
    complete power to modify a Linux system.The passwd command also has a lot of other
    features aside from setting a user''s password. To get information about a user
    account in terms of password security, type "sudo passwd -S username", replacing
    username with the account''s username. A line will show starting with the username
    and either a P, NP, or L. P after the username means that a password is good for
    this user; NP stands for no password; and L means that the user has been locked
    out of his account because he may have forgotten it and entered an incorrect password
    too many times. The next information on the line is the date of the last password
    change. The next number indicates the minimum password expiry age and is usually
    set to 0, indicating that the user change it as many times as they want and as
    frequently as they want. The next set of numbers is the maximum age of the password
    in days, usually 99999\. Then, the password expiry warning in days, usually 7\.
    This means that 7 days before expiry, the user will be notified to change passwords.
    The last number is for the inactivity period of the password.A better version
    of the "passwd -S" command and option is the chage command. Type "sudo chage -l
    username" to list information in a more readable format compared to the line listed
    by the passwd command above. Refer to the man page of chage for more information
    about the other options that allow changing password attributes such as the expiry
    age.Aside from modifying passwords, the username may need to be modified either
    due to a misspelling or a user change altogether. Properly renaming a user requires
    a couple of commands: id and usermod/groupmod. To identify a user, type "id username".
    This will show the user id, group id, and the groups the user is a member of.
    The id command can verify the correct username and group assignment. To change
    the username, type "sudo usermod -l newusername oldusername", replacing newusername
    with the new username, while the old username replaces oldusername. After successfully
    changing the username, use the id command to check if the new username exists
    and that the previous group assignments remain. Take note, however, that usermod
    only changes the username. It does not change the group name nor the home directory.
    To change the group name, type "sudo groupmod -n newgroupname oldgroupname", replacing
    newgroupname with the new name of the group and oldgroupname with the group''s
    old name. There are more options for modifying user and group attributes, which
    can be found in the man pages of usermod and groupmod.There will also be certain
    instances we have to delete a user from the system, such as when an employee is
    no longer connected with a company. To delete a user, simply type "sudo deluser
    --remove-home username", replacing username with the user to be deleted. The ''--remove-home''
    option removes the user''s home directory, thereby deleting the files in it. Take
    note that, since this is done in superuser mode, changes may be irreversible,
    so be cautious when deleting users and deleting user accounts and their files.
    Another way to accomplish user deletion is by typing "sudo userdel -r username".
    Once again refer to the man pages of deluser and userdel for more information
    about these commands.The nice thing about Linux systems is that they keep a log
    of users created and deleted. The log could vary but for Ubuntu, it is located
    in /var/log/auth.log. This is the authentication log. The cat and grep commands
    can look for information in the auth.log file. For a recent event, such as a recently
    deleted user or group, type "tail -15 /var/log/auth.log" to see the last 15 lines
    of the log file, as that should be where the latest events are logged. For user
    deletion events, type "grep -E ''userdel'' /var/log/auth.log" to check for the
    instances of the userdel command.


