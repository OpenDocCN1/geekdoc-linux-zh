- fmt: '

    From its inception, Linux was designed as a multiuser operating system. This means
    that any number of users can simultaneously work on a single machine. These users
    can connect to the system via different terminals or network connections while
    maintaining a separate storage area for personal information and individual desktop
    configurations.


    Among the users working on a machine, Linux also distinguishes between different
    kinds of user roles. A user can log into a Linux machine as a normal user or as
    the root user, a superuser with privileges that authorize them to access all portions
    of the system and to execute any necessary administrative tasks.


    All users, including the superuser, have their own home directories where all
    the user’s private data (like documents, bookmarks, and emails) are stored. While
    a user can modify anything in their own home directory, only the superuser can
    modify the system directories that hold all the centralized configuration files
    and executable files on the system. To modify these files and folders, a user
    can choose to use a GUI-based file manager within the desktop environment or through
    a shell in the command line environment. The traditional method on Linux and Unix
    systems was to use the command line environment, but the GUI-based method is easier
    for most end users. While using the command line is often faster, it does require
    some deeper knowledge of the commands and their syntax to list, create, delete,
    or edit files and their properties.


    ### File System Structure


    Within a Linux system, all files and directories are in a tree-like structure.
    The topmost directory is the root of the file system, which is notated as a single
    forward slash (`/`). Note that the root of the file system is not to be confused
    with the root user or the root user’s home directory (`/home/root`). In a Windows
    system, the root of the file system is designated as a backslash (`\`) and usually
    denoted by the drive letter `C` (usually written as `C:\`).


    All the other directories in Linux can be accessed from the root directory and
    are arranged in a hierarchical structure using parent-child relationships. Unlike
    Windows, Linux does not use backslashes to separate the components of a pathname,
    but instead relies on forward slashes. Therefore, the private data of a user in
    Windows might be stored in `C:\users\diontraining\documents`, but in Linux it
    might instead be stored under `/home/diontraining/documents`. Additionally, Linux,
    unlike Windows, does not use drive letters. Instead, a user can detect which directory,
    drive, device, or network they are accessing from the appearance of the pathname
    itself. For example, you might access the storage directory on the secondary hard
    disk drive by using `/dev/disk1/storage/`.


    ### Key File System Features


    Another crucial difference to understand between Windows and Linux is the concept
    of mounting and unmounting partitions, drives, and directories. When Windows detects
    partitions and drives during the boot process, it assigns a drive letter to them.
    However, Linux partitions or devices are usually not visible in the directory
    tree unless they are mounted. Mounting a device means that it will become integrated
    into the file system at a specific location within the directory tree. If a device
    isn’t mounted, a normal user cannot access any data on the device or its partitions.


    Luckily, most modern Linux distributions automatically mount partitions and devices
    for their end users. During the installation, users can define partitions to automatically
    mount when the system is started. Removable devices are usually also detected
    and mounted automatically by the system when they are connected. Desktop environments
    such as `KDE` or `Gnome` will notify the end user when a new device is mounted
    and becomes accessible. If you are using an older version of Linux and need to
    mount the device yourself, you will use the `mount` and `umount` commands. To
    learn about the exact usage of these commands, please use the `man` pages for
    them on your Linux system.


    Unlike Windows, Linux distinguishes between uppercase and lowercase letters within
    the file system. Therefore, if you change the file `test.txt` to `TeST.txt` or
    `Test.txt`, Linux considers all three different files. This case sensitivity holds
    true for both files and directories within the file system. So, if you have `Letters`
    and `letters` as directories, Linux would treat them as two different directories.


    Another major difference between Linux and Windows is the use of file extensions
    to define what a file is used for. For example, in Windows a file will end in
    `.txt` if it is a text file. In Linux, files may have a file extension, such as
    `.txt`, but it is not required. Instead, the operating system looks at the contents
    of the file to determine which application can read it instead of simply relying
    on the three-letter extension. Many users still add the three letter extensions,
    though, since it makes it easier for users to identify a file’s type and use.


    Like Windows, Linux does distinguish between normal files and hidden files. In
    general, the system uses hidden files to hold configuration details. Hidden files
    are indicated by a dot in front of the file name, such as `.hiddenfile`. In order
    to access a hidden file, you can switch the properties or options for the view
    in the file managers or use certain command syntax options in the shell.


    As stated earlier, Linux is a multiuser system and, therefore, every file must
    belong to a specific user and a group. Only the owner of a file or directory (or
    the root user) can grant other users the permission to access them. Linux distinguishes
    between three different types of access permissions: write permissions, read permissions,
    and execute permissions. Users can only access a file or a folder if they have
    at least a read permission to it. There are several ways to change the access
    permissions of files and folders: either via the shell or with the help of the
    desktop''s file manager.


    Although each Linux distro has its own way of doing certain things, all Linux
    developers recognize the need for some standardization in the layout of their
    directory structures. To address this need, the Filesystem Hierarchy Standard
    (FHS) was created. The FHS makes an important distinction between shareable and
    unshareable files. Shareable files may be reasonably shared between computers,
    such as user data files and program binary files. Unshareable files contain system-specific
    information, such as configuration files. The FHS makes a second important distinction
    between static files and variable files. Static files do not usually change except
    through direct intervention by the system administrator. For example, executable
    files are considered static files. On the other hand, users, automated scripts,
    servers, or other devices can change variable files.


    ### Navigating Files and Directories


    Now that we have an overview of the file system, it is time to learn how to navigate
    around it. But before you can manipulate files and directories, it is important
    to understand which files are in which directories. The `ls` command, short for
    list, provides this information. If no command line options are used with `ls`,
    the output will simply display the files in the current directory. However, additional
    options can be provided to display more detailed information. For example, using
    the `-a` option displays all files including hidden files. If you instead use
    the `-l` option, it displays detailed output which includes permission, ownership,
    file sizes, and creation dates in addition to the filenames.


    Another useful option is the `-d` option, which is used when working with directories.
    When working in a directory that holds many subdirectories, using `ls` with a
    wildcard may get an unexpected result: the output will show the files in the matched
    subdirectories rather than the directories themselves. To get information on the
    directories themselves you can instead include the `-d` option.


    The `cd` command, short for change directory, changes the current directory to
    another provided by the user. Although the current directory doesn’t matter for
    many commands, it will matter when referring to certain file manipulation. When
    working with `cd`, do not forget that Linux uses a forward slash (`/`) as a directory
    separator, as opposed to backslash (`\`) used in Windows. The forward slash and
    backslash are not interchangeable, so it is up to the user to use the proper one
    for the operating system they are using. Typing `cd` followed by the directory
    name or path will make the shell switch to that directory. To know the complete
    path of the current location, we can always enter the `pwd` command (present working
    directory) at the prompt.


    Remember that Linux uses a unified directory tree. This means that all the files
    on the system are located relative to a single root directory (`/`), which is
    represented by using the single forward slash. Files and directories can be referenced
    in three ways: absolute references, home directory references, or relative references.


    - **Absolute reference**: allows a file to be referenced relative to the root
    directory, such as in `/home/user1/file.txt`, which refers to the `file.txt` file
    in `user1`’s home directory. Absolute references always begin with a forward slash
    since they start at the root of the file system.

    - **Home directory reference**: uses the tilde (`~`) to refer to the user’s home
    directory. If a filename begins with that character, it is as if the path to the
    user’s home directory has been substituted for the tilde. For user1, `~/file.txt`
    is equivalent to the absolute reference of `/home/user1/file.txt`.

    - **Relative reference**: refers to a file reference that is made relative to
    the current directory. Every Linux directory includes two special hidden subdirectories
    known as dot (`.`) and dot dot (`..`). `.` refers to the current directory. This
    is also known as the present working directory. Personally, I always refer to
    it as "here". Therefore, if you want to create a relative path, you can use the
    single dot as your starting point within a command or file’s paths. `..` refers
    to the parent directory. This is the directory one level above the current directory.
    Again, this is used heavily when creating relative paths to different files and
    directories across the filesystem. For example, if `user2` is working in the directory
    `/home/user2/`, `user2` can refer to `user1`’s home directory by using `../user1`.
    This references the directory above `/home/user2` (`/home`) and then the subdirectory
    `user1` within that directory.


    ### Manipulating Files


    We can manipulate files by using many different commands. Files can be created,
    copied from one location or folder to another, moved, renamed, or even deleted
    from the filesystem using different commands within the shell. Normally, files
    are created by programs or commands that manipulate them. For example, a graphics
    program like `GIMP` might create a new graphics file. The exact process to create
    a file differs depending on the program, but most GUI programs typically use a
    menu option called "Save" or "Save As" to create and save a file. Text-based programs
    within the command line often provide a similar functionality, but the details
    of how it is done vary greatly from one program to another.


    The most basic file creation program is `touch`. The `touch` command is a command
    line program that creates a new, empty file at the location provided as a parameter
    when the command first runs. To create a new file, simply type `touch` followed
    by the name of a file; for example, type `touch newfile.txt` to create an empty
    file called `newfile.txt` within your present working directory. Normally, it
    is not necessary to create a file of a particular type, since a program will automatically
    create the matching file type needed for its file format.


    Another command that is useful in working with files is `cp`. This command, short
    for copy, is used to copy files from one directory to another. It can be used
    in three different ways: to paste a source filename, a destination filename, or
    both. The `cp` command also provides many options that modify its behavior. To
    learn all the details about the `cp` command, please type `man cp`.


    If you want to move or rename a file, we use the same command, `mv`, which stands
    for move. The `mv` command uses syntax and usage like `cp`, except that if the
    source and destination are the same, `mv` overwrites the original file instead
    of duplicating it. Also, when the source and target are on the same filesystem,
    `mv` copies the file to the new disk without physically moving it. To learn more
    about the `mv` command, type `man mv`.


    Sometimes, files are no longer needed, and we can delete them using `rm`, which
    stands for remove. One important thing to realize about `rm` is that it does not
    implement any kind of recycle bin. Once a file is deleted, it is gone and cannot
    be recovered. To delete an entire directory, use the `-r` (recursive) option.
    There are several other options for the `rm` command, and the `-i` (interactive)
    switch allows `rm` to prompt before deleting each individual file, which is a
    safety measure. To learn more about the `rm` command, please type `man rm`.


    ### Hard and Symbolic Links


    In Linux, sometimes it is handy to refer to a single file using multiple names
    rather than creating copies of the file. To do this, a user can create multiple
    links to a file. In Linux, there are two types of links supported by the operating
    system: hard links and symbolic links. We can create both types using the `ln`
    command.


    - **Hard link**: a duplicate directory entry where both entries point to the same
    file. Because the actual directory entry and the link both connect to the file
    data structures, hard links can exist within a single filesystem. When using a
    hard link, neither filename holds priority over the other; both are tied directly
    to the data. To create a hard link, type `ln filename linkname`.

    - **Symbolic link**: also known as a soft link, a file that refers to another
    file by name. This means that the symbolic link is a file that holds another file’s
    name and, when you tell a program to read or write from a symbolic link, Linux
    redirects the access to the original file. Because symbolic links work by filename
    references, they can cross filesystem boundaries. To create a symbolic link, type
    `ln -s filename linkname`.


    This symbolic link is similar to the idea of what most end users are familiar
    with, as it works like a shortcut within the filesystem.


    ### Wildcards


    When working with files and directories within the command line, a user may want
    to refer to multiple items simultaneously. To do this, utilize a wildcard. A wildcard
    is a symbol or set of symbols that stands for other characters. Wildcards can
    refer to files and is also sometimes called globbing. Linux utilizes three different
    types of wildcards when referencing items in the filesystem: the question mark,
    the asterisk, and bracketed values. To better explain the use of these three types
    of wildcards, pretend you have a directory containing five different files all
    starting with the letter: `ball`, `bell`, `bowl`, `bull`, `bale`.


    - **Question mark (`?`)**: can replace a single character. For example, if I enter
    the command `ls b??l`, each file that starts with the letter b, has two other
    letters, and then ends with the letter l will be returned. In this case, the words
    `ball`, `bell`, `bowl`, and `bull` would all be returned since they meet the criteria,
    but the word `bale` would not.

    - **Asterisk (`*`)**: can replace any single or multiple characters. For example,
    if I enter the command `ls b*`, any file that starts with a b will be returned
    since the `*` can replace all the letters after the b. In this case, the words
    `ball`, `bell`, `bowl`, `bull`, and `bale` would all be returned.

    - **Bracketed values (`[]`)**: can replace any character from within the brackets
    into the search term. For example, if I enter the command `ls b[aou][lw]l`, any
    files that match the letters from within the brackets would be returned. In this
    case, the words `ball`, `bowl`, and `bull` would be returned.


    Wildcards are implemented by the shell and are passed to the command. For example,
    when the user enters `ls b??l`, the shell matches `b??l` with the files `ball`,
    `bell`, `bowl`, and `bull`, and outputs the results. Please take note, however,
    that you need to be extremely careful when using wildcards. If you are careless,
    wildcards can lead to undesired consequences, for example, copying files to another
    directory but forgetting to specify the destination directory.


    ### Manipulating Directories


    Most users are familiar with folders within a filesystem since most file managers
    represent directories by icons. In the Linux filesystem, folders are technically
    called directories. Linux naturally provides both GUI-based and command line tools
    to manipulate directories. These include directory-specific commands that allow
    users to create, delete, rename, and move.


    The `mkdir` command, short for make directory, is used to create a directory.
    To create a new directory named `newfolder` in the current directory, simply type
    `mkdir newfolder`. For more options with `mkdir`, please refer to the `mkdir`
    man page.


    The `rmdir` command, short for remove directory, destroys or deletes a directory.
    To delete a directory named `newfolder` in the current directory, simply type
    `rmdir newfolder`. When using `rmdir`, remember that file and directory names
    are case sensitive in the Linux filesystem, so it is important to specify the
    correct case to avoid deleting the wrong directory. The `rmdir` command can only
    delete empty directories, though; if a directory contains any files or directories,
    the `rmdir` command will fail. The `-p` option, however, can delete a set of nested
    directories if none of them hold any non-directory files. To delete directories
    containing files anywhere within the directory tree, you can instead use the `rm`
    command with the recursive (`-r`) option. Because it can delete directories that
    are non-empty, `rm` with the `-r` option becomes potentially dangerous since it
    can delete files not intended to be deleted. Therefore, it is considered a best
    practice to first execute `ls -r` to display the directory and its contents before
    attempting to run `rm -r`.


    As stated before, the filesystem considers directories a special file type. These
    special files simply hold the user’s other files. Because of this, most the file
    manipulation tools covered previously can manipulate directories, too. There are
    some caveats to this general rule, though. First, the `touch` command cannot create
    a directory. Instead, the command `mkdir` makes a new directory. If the `touch`
    command is executed on a directory, it will refresh and update the directory’s
    timestamp instead. The `cp` command can copy a directory, but only if the user
    specifies the `-r` or `-a` options to copy the directory and all its contents.
    Similarly, the `mv` command can move or rename a directory if the right syntax
    and options are utilized. When creating links in the Linux filesystem, the user
    can only create symbolic links to a directory using the `ln -s` command. This
    is because the Linux filesystem does not support or allow hard links to a directory.


    ### Archiving Files


    A file-archiving tool collects a group of files into a single package file. This
    allows us to easily move the single file around on a single filesystem; back up
    the file to a recordable DVD, USB flash drive, or other removable media; or transfer
    the file across a network. Linux supports several archiving commands to perform
    this function, but the prominent ones are `tar` and `zip`.


    The `tar` program’s name stands for tape archiver. Even though it was originally
    designed for backing up files to backup tapes, `tar` can back up or archive data
    to the filesystem, a hard drive, or removable media. The `tar` program is a popular
    tool for archiving various data files into a single file, called an archive file,
    while the original files remain safely stored on the disk. Because the resulting
    archive file can become quite large, it is often compressed via the `tar` program
    into what is known as a tarball. In fact, tarballs are often used for transferring
    files between computers and are considered the universal method for distributing
    source code. The `tar` program is a complex command with numerous options, but
    the most common options are all that is needed for most users.


    When running the `tar` command, the user must use only one command with at least
    one qualifier. To create a tar archive, enter the command `tar -c tarfile.tar
    file1.txt file2.txt`. This command will create a new `tarfile.tar`, which contains
    the two text files: `file1.txt` and `file2.txt`. To create a tarball, a compressed
    tar file, enter the command `tar -czf tarfile.tar.gz file1.txt file2.txt`. This
    command will perform the same functions as the previous one but will also compress
    the file using `gzip` to reduce the file size. To learn about all the functions
    of the `tar` command, please consult its man page.

