    a) printer

    b) ping

    c) `printenv`

    d) processvar


    11. 什么可以提供一组解释系统中可用特定命令电子页面？

    a) Man pages（手册页）

    b) Help pages（帮助页）

    c) Master pages（主页）

    d) Informational pages（信息页）


    12. 以下哪项**不是** man page 的章节？

    a) Name（名称）

    b) Mistakes（错误）

    c) Configuration（配置）

    d) Return Value（返回值）


    13. 如何在当前目录及其子目录下搜索名为 `MyFile.xml` 的文件？

    a) `find . -name MyFile.xml`

    b) `grep MyFile.xml | find`

    c) `grep -r MyFile.xml`

    d) `find –P MyFile.xml | grep`


    14. `cd` 命令是 ____________ 的缩写。

    a) Check Directory（检查目录）

    b) Change Directory（切换目录）

    c) Change Disk（切换磁盘）

    d) Check Disk（检查磁盘）


    15. 使用哪个命令将文件从一个目录复制到另一个目录？

    a) `mv`

    b) copy

    c) `cp`

    d) `rm`


    16. Linux 中的 `rm -rf` 命令的作用是什么？

    a) 删除目录及其子目录下的所有文件

    b) 删除目录下的所有文件

    c) 重命名目录及其子目录下的所有文件

    d) 重命名目录下的所有文件


    17. 以下哪个命令会创建一个名为 `backup.tar` 的归档文件，包含 `/home` 目录下的所有文件？

    a) `tar -cf backup.tar /home`

    b) `tar -cf /home backup.tar`

    c) `tar -xf /home backup.tar`

    d) `tar -xf backup.tar /home`


    18. 以下哪个命令会从 `./work/` 目录的内容创建一个归档文件 `work.tar`？

    a) `tar --new work.tar ./work/`

    b) `tar --cf work.tar ./work/`

    c) `tar --create work.tgz --content ./work/`

    d) `tar work.tar < ./work/`


    19. 如何在丢弃错误输出的同时将命令的普通输出写入文件？

    a) `command < output > /dev/null`

    b) `command > discard-error > file`

    c) `command > /dev/null 2&> output`

    d) `command >file 2>/dev/null`


    20. 哪个命令会显示文件 `document.txt` 的最后一行？

    a) `head -n 1 document.txt`

    b) `tail -n 1 document.txt`

    c) `tail document.txt`

    d) `last -n 1 document.txt`


    21. 为什么执行 `sort data.txt > data.txt` 后 `data.txt` 文件是空的？

    a) 因为 sort 不能对文本文件排序，只能对二进制文件

    b) 因为 sort 检测到两个文件是同一个

    c) 因为文件在 sort 执行之前就被截断了

    d) 因为文件在 sort 截断之前被执行了


    22. 以下命令的输出是什么？

    ```

    for token in a b c; doecho -n ${token};done

    ```

    a) anbncn

    b) abc

    c) $token$token$token

    d) {a}{b}{c}


    23. 以下哪种语句可以访问脚本的第二个命令行参数？

    a) `$arg2`

    b) `$2`

    c) `$1`

    d) `$var2`


    24. 应该使用哪个关键词来填充给定 shell 脚本段中的空白？

    ```bash

    for i in *; _____cat $idone

    ```

    a) do

    b) then

    c) when

    d) fi


    25. 如何判断一个可执行文件是否为 Bash 读取的 shell 脚本？

    a) 文件必须以 `.sh` 结尾

    b) 第一行以 `#!/bin/bash` 开头

    c) `/bin/bash` 必须调试模式运行

    d) 只有当你以 root 登录时


    26. 关于 Linux 发行版生命周期，以下哪项是**错误**的？

    a) Linux 发行版总是短期发布

    b) 大多数发布计划提前几个月或几年公开公布

    c) 一些开发者为版本起响亮的名字

    d) 最终发布版本被认为是稳定版本


    27. HCL 代表什么？

    a) Hindustan Computer Limited

    b) Hardware Compatibility List（硬件兼容性列表）

    c) Hardware Computer

    d) House Computer Linux


    28. 以下哪项正确识别了 PC 系统上第二个硬盘、第一个 IDE 控制器上的第三个分区？

    a) `/dev/hdb3`

    b) `/dev/hd1`

    c) `/dev/hdc`

    d) `/dev/hdc1`


    29. 安装新包后，你可能在哪个目录下找到它的配置文件？

    a) `/lib`

    b) `/etc`

    c) `/conf`

    d) `/usr`


    30. 以下哪个目录经常用于存储日志文件？

    a) `/var`

    b) `/temp`

    c) `/dev/hdc`

    d) `/usr`


    31. 显示系统启动消息的命令是什么？

    a) `echo`

    b) `lsp`

    c) `dmesg`

    d) display boot


    32. 哪个网络接口始终存在于 Linux 系统中？

    a) `lo`

    b) `eth0`

    c) `wlan0`

    d) `vlan0`


    33. 以下哪项显示传输控制协议的网络连接、路由表以及许多网络接口和网络协议统计数据？

    a) `net`

    b) `ping`

    c) `netstat`

    d) `traceroute`


    34. 以下哪个命令可以确定用户的最后登录时间？

    a) `showlog`

    b) `recent`

    c) `last`

    d) `history`


    35. 哪个命令显示谁登录了系统以及他们正在做什么？

    a) `who`

    b) `wc`

    c) `whoami`

    d) `id`


    36. 以下哪个文件包含本地账户的定义？

    a) `c/users`

    b) `/etc/passwd`

    c) `c/id`

    d) `c/home`


    37. 哪个命令添加新用户 `tux` 并创建带有默认配置文件的用户目录？

    a) `usercreate tux`

    b) `useradd -o default tux`

    c) `useradd -m tux`

    d) `passwd -a tux`


    38. 以下哪个命令将显示当前目录下所有文件，包括可能隐藏的文件？

    a) `ls -a`

    b) `ls -h`

    c) `ls -al`

    d) `ls-hidden`


    39. `drwxrwxrwt` 结尾的字母 `t` 在以下目录权限中表示什么？

    `drwxrwxrwt 14 root root 36864 2012-03-02 11:17 /tmp`

    a) `t` 用于显示该目录全局可写，但只有所有者可以删除目录内的自己的文件

    b) 该目录所有人开放

    c) 该目录包含系统需要空间时可以删除的临时文件

    d) 该目录的文件只有 root 用户可以访问


    40. 使用哪个命令在 Linux 中创建符号链接？

    a) `ln -d`

    b) `ln -s`

    c) `link -d`

    d) `link -s`


