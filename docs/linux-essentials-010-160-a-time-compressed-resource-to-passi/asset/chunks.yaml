    | $ dmesg | less |


    或者，如果信息与某个字符串相关，你可以使用 `grep` 来搜索它。例如，要查找关于第一个硬盘 `/dev/sda` 的内核环形缓冲区消息，请输入：


    | $ dmesg | grep sda |




    内核环形缓冲区的消息可能特别难以理解，但在诊断硬件和驱动程序问题时，它们也具有极高的价值，因为内核的工作就是与硬件接口。如果硬件设备运行异常，就应该搜索并检查内核环形缓冲区。即使难以理解，也可以将此日志中的消息输入到搜索引擎中，或者转给更有经验的同事以寻求专家建议和进一步的故障排除。


    某些发行版会在系统首次启动时将内核环形缓冲区的一个副本放在 `/var/log/dmesg` 或类似的文件中。如果计算机运行了很长时间，其早期的条目已经从内存缓冲区副本中丢失，则可以检查该文件。如果你想在你的发行版中创建这样的文件，而它尚未被默认创建，那么请编辑
    `/etc/rc.d/rc.local` 文件，并在脚本末尾添加以下行：


    ```

    $ dmesg > /var/log/dmesg

