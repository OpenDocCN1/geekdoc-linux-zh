    be returned. In this case, the words ball, bell, bowl, and bull would all be returned
    since they meet the criteria, but the word bale would not.An asterisk can replace
    any single character or multiple characters. For example, if I enter the command
    “ls b*” then any file that starts with a b will be returned since the * can replace
    all the letters after the b. In this case, the words ball, bell, bowl, bull, and
    bale would all be returned.Bracketed values can replace any character from within
    the brackets into the search term. For example, if I enter the command “ls b[aou][lw]l”
    any files that match the letters from within the brackets would be returned. In
    this case, the words ball, bowl, bull would be returned since they can be made
    by replacing the second and third characters with characters from within the brackets.Wildcards
    are implemented by the shell and are then passed to the command. For example,
    when the user enters the command “ls b??l”, the shell matches b??l with the three
    files bowl, ball, and bull outputs the results of the command as if the user entered
    “ls ball bell bowl bull”.Please take note, however, that you need to be extremely
    careful when using wildcards. If you are careless, wildcards can lead to unexpected
    and sometimes undesired consequences. For example, copying two files using wildcards
    to another directory but forgetting to give the destination directory may result
