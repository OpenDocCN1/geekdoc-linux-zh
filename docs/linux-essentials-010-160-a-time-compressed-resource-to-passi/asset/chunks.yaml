- fmt: '

    One of the great things about Linux is that it has embedded support for different
    programming languages. Here are some of those languages and the tools that we
    can use to write, read, and execute them.


    ### Programming Languages


    JavaScript is simply a text file with `.js` as its extension. We can embed this
    within HTML, or it can be its own file. It can be as simple as a script to show
    "Hello World" when opened in a browser, or it can have more complex functions,
    such as creating a list.


    Python is a great scripting and interpreted language. There are two ways to write
    `python` code: in an interpreted environment or from inside a text file. For the
    interpreted environment, open a terminal and type `python3` (3, since it is the
    latest version of `Python`). This will bring up a prompt that will take direct
    commands. Inputting `print("Hello, World")` will return the text Hello, World
    right below that command line. We can achieve this by creating a text file, typing
    in the exact same command, and saving that file with `.py` extension. Back at
    the terminal, type `python3`, insert a space, and append the filename of the saved
    text file; it will show the same results.


    PHP originally stood for Personal Home Page but now stands for the recursive initialism,
    `PHP: Hypertext Preprocessor`. As we servers heavily use it, so does Linux, as
    it is an operating system primarily used for web servers. It is just like JavaScript,
    as it works with HTML files. As such, a `PHP` file indicated by `.php`, can run
    directly in a browser.


    Another programming language, Java, is a great language because it also works
    on a lot of different operating systems, including Windows and Linux. This should
    not come as a surprise for most smartphone users running the Android OS, as all
    the applications on their phone are written in Java. Java is a compiled language.
    Looking at a `.java` file, the objects in it are just text that the computer will
    not understand unless it is converted into an executable binary. So, the terminal
    first compiles the `.java` file by executing the `javac` command followed by the
    filename with `.java` extension. Once it is compiled, run the object by typing
    `java` and whatever is the object''s name is in the `.java` file. Java is a bit
    more complicated than JavaScript, `Python`, or `PHP`, but is extremely powerful
    because we can write full-fledged programs using this language alone.


    CSS, also called "style sheets", is used with HTML pages; they describe the content
    and how things should be displayed within the page. A typical `.css` file contains
    page attributes, such as how the body of the page should look, what color the
    background should be, the type and size of font, page margins, etc. Modifying
    the style sheet easily changes the look and feel of a webpage and is easier than
    going back and modifying the whole HTML document.


    C++ is a compiled language like Java and is a low-level programming language.
    It a little bit more complicated, needing to compile the binary before executing
    it; but it is very powerful, as most of the big-name software like Adobe applications,
    Google applications, and even MS Office and older versions of Windows were all
    written in C++.




    A newer object-oriented programming language is Go. Like Java and `C++`, it also
    needs to be compiled. Go is designed specifically as a systems programming language
    for large, distributed systems and highly scalable network servers. Since Go is
    faster to compile than `C++` and is much easier to maintain than Java, it replaced
    them in Google''s software stack.


    C is a low-level programming language from which `C++` evolved. In fact, the "hello,
    world" example, originally written in C, has become the model for writing introductory
    programs in most programming textbooks. The program prints "hello, world" to the
    standard output, which is usually a terminal or screen display.


    In addition to C and `C++`, another member of the family is C#. It is a general-purpose,
    multi-paradigm programming language. It is used from within a development environment
    such as `MonoDevelop`.


    Ruby is a popular web development programming language. Ruby files are indicated
    by a `.rb` filename extension. Ruby is like Python, as it can run in an interpreted
    environment or from inside a text file.


    There are many more development languages and programming tools available to Linux
    users. The ones mentioned here are just the more popular ones. Selecting which
    to use depends on the user’s knowledge of the language as well as the language’s
    fit for purpose.


    ### Package Management and Repositories


    There are many ways to install software on a computer powered by Linux. The most
    common method is to use a package manager and software repository. Since there
    are a wide variety of Linux distros, there are also a wide variety of package
    managers. Each Linux distribution compiles its own software with its desired library
    versions and compilation options. Linux applications generally don’t run on every
    distribution, but instead need to be compiled for a particular distro. Even if
    there was a universal Linux binary, its installation would be hindered by the
    various competing package formats and their availability within a distro.


    Therefore, if you locate the website of a Linux application, you will likely see
    a variety of download links for different package formats based on the distribution
    you are using. If the author of the application you want to install doesn’t already
    have a package created for your distribution, then you may have to download the
    source code for the application and manually compile the binary for the application
    yourself.


    Unlike a Windows user, most Linux users don’t normally download and install applications
    from the applications’ websites because of the challenges described above. Instead,
    each Linux distribution usually hosts its own software repositories. These repositories
    contain software packages compiled for a specific Linux distro and version. For
    example, if you’re using Ubuntu 18.04, the repositories you will use contain packages
    specially compiled for Ubuntu 18.04 and not for another version like 16.10 or
    19.04.


    These package managers automatically download the appropriate package from its
    configured software repositories, install it, and automatically set it up for
    the end user. This contrasts to installing software in Windows or macOS, where
    you must click through wizards or locate executable files on websites. When an
    update releases, the package manager notices its availability, downloads the appropriate
    update, and installs it for you.


    On Windows and macOS, each application has its own software update program to
    receive an automatic update, but in Linux the package manager handles updates
    for every piece of software installed from the software repositories.


    If you are a Windows user, you are probably used to seeing an `.exe` or `.msi`
    file as the installer files for applications. If you are a macOS user, then you
    probably are used to downloading a `.dmg` or `.app` file as the installer. Linux,
    though, uses several package formats for its installers.


    Packages are essentially archives containing a list of files. The package manager
    opens the archive and installs the files to the location specified within the
    package. The package manager is responsible for maintaining a record of which
    files belong to which packages. The package manager also must remain aware of
    their version and their latest status. These package files can also contain scripts
    that run when the package is installed and removed.


    The three most popular package file formats are `.deb`, `.rpm`, and `.tar` files.


    - `.deb` is used in Debian Linux and Debian-based distros like Ubuntu, Kali Linux,
    and Tails.

    - `.rpm` is used by the Red Hat Package Manager and RPM-based distros like Fedora,
    openSUSE, and CentOS.

    - `.tar` (also `.tgz` or `.tar.gz`) is used a universal package format and is
    used in distros like ArchLinux and Slackware; `.tar` is an uncompressed archive
    and `.tar.gz` is a compressed archive.

    '
