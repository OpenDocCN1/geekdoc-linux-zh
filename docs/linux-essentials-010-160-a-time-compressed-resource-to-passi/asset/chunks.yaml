    此示例显示 `gedit` 的 `PID` 值为 `27946`。这通常是使用 `ps` 时最重要的信息，因为 `PID` 值可用于更改进程的优先级或将其终止。如果你需要终止一个进程，可以使用
    `kill` 命令来实现。尽管 `ps` 可以返回进程优先级和 CPU 使用率信息，但程序的输出通常是按 `PID` 编号排序的。此外，重要的是记住，`ps`
    命令只提供某一个特定时刻的信息，就像快照一样。因此，如果你现在运行 `ps` 命令，然后在 3 分钟后再次运行它，你将得到不同的结果。为了快速定位 CPU
    或内存密集型进程，或者如果需要研究资源使用如何随时间变化，`top` 实用程序是一个更合适的工具。该实用程序本质上是 `ps` 实用程序的交互式版本。默认情况下，`top`
    按 CPU 使用率对条条目进行排序，并每隔几秒更新一次显示。为了确定应用程序在系统上的运行情况是否正常，熟悉系统上运行程序的用途和正常习惯是非常重要的。这允许你对给定系统上正常功能的外貌建立一个心理基准。因为每个程序在处理和内存使用方面有不同的合法需求，无法给出一个简单的规则来判断进程何时消耗了过多的资源，但如果你有一个良好的基准来开始比较，这就会变得容易得多。`top`
    提供的信息之一是负载平均值（load average），它是应用程序对 CPU 时间需求的衡量标准。负载平均值对于检测失控或恶意进程非常有用。例如，如果一个系统的正常负载平均值为
    0.5，但突然卡在 2.5 的负载平均值上，可能是由于几个占用大量 CPU 的进程挂起或变得无响应了。挂起的进程有时会无谓地消耗大量 CPU 时间。因此，你应该使用
    `top` 来定位这些进程，并在必要时停止（或 `kill`）它们。


    ### 测量内存使用情况

    进程会消耗重要的系统资源，如处理器运行时间和系统内存。使用 `top` 实用程序允许用户默认按 CPU 时间对进程进行排序，以便快速识别出消耗最多处理资源的进程。当
    `top` 运行时，可以输入几个单字母命令，其中一些命令会提示额外信息。例如，如果用户在 `top` 中按下 `M` 键，进程将按内存使用情况排序。要了解更多关于
    `top` 实用程序及其所有单字母命令的信息，请参考 `top` 实用程序的 man 页。如果 `top` 实用程序当前按内存使用排序，很容易识别出消耗最多内存的进程。与
    CPU 时间一样，我们不能仅仅因为进程位于列表顶端就判定它消耗了过多的内存，因为某些程序确实会消耗大量内存。例如，一个像 `gedit` 这样简单的文本编辑器消耗的内存应该比像
    `gimp` 这样的照片编辑程序少，因为 `gedit` 处理的文件要小得多。但如果同一个程序通常只需要几兆字节的内存，而今天它使用了 1GB 的内存，那么这就是我们应该进一步调查的异常活动，并可能是失控进程的迹象。有时程序会消耗过多的内存，要么是因为代码效率低下，要么是因为内存泄漏。内存泄漏是一种软件漏洞，程序向内核请求内存，在使用完该内存后未能将其归还。内存泄漏的程序会消耗越来越多的内存，有时甚至到干扰其他程序的程度。作为一种短期解决方案，用户可以终止程序并重新启动它，这将重置程序的内存消耗。问题可能会再次发生，但如果内存泄漏足够小，那么至少还可以完成有效的工作。为了研究计算机的整体内存使用情况，`free`
    命令是一个非常有用的工具。该程序生成一份关于计算机总内存状态的报告。在命令输出中，最重要的两行是 `Mem:` 行和 `Swap:` 行。

    `Mem:` 行显示总 RAM 统计信息。这包括计算机的总内存减去主板和内核占用的内存、已用内存以及空闲内存量。计算机内存的大部分占用是正常状态，因为 Linux
    会将未使用的内存用作缓冲区和缓存，以帮助提高从硬盘访问信息的速度。因此，`Mem:` 行本身并不是最有用的，而是需要与 `-/+ buffers/cache:`
    行结合考虑，后者显示了计算机上所有程序占用的总内存。

    `Swap:` 行显示了 Linux 正在使用多少交换空间（swap space）。交换空间是预留作为物理内存替代方案的磁盘空间。每当 Linux 耗尽 RAM
    或当它认为 RAM 用于缓冲区或缓存比持有当前非活动程序更好时，它将使用包含在硬盘文件中的交换空间来替代物理 RAM 的。交换空间的使用率通常很低，如果增长过高，就会出现性能问题。从长远来看，对于持续内存不足的
    Linux 系统，增加计算机物理内存（RAM）通常是解决方案，但如果需要，较大的交换空间也可以成为一个合适的临时权宜之计。由于过度使用交换而遭受性能问题时，终止某些占用内存的程序可以提高系统速度。此外，内存泄漏可能导致此类问题，终止泄漏的程序可以恢复系统性能到正常。


    ### 日志文件

    许多程序仅在后台运行，对用户不可见。这些程序通常为网络运行服务，例如提供 DHCP、运行 Web 服务器或运行邮件服务器。这些后台服务被称为守护进程（daemons）。

    由于这些程序在后台运行，它们持续需要系统资源...


    '
- fmt: '

    | $ dmesg | less |


    Alternatively, if the necessary information is associated with a string, you can
    use `grep` to search for it. For example, to find kernel ring buffer messages
    about the first hard disk, `/dev/sda`, type the following:


    | $ dmesg | grep sda |


    The kernel ring buffer’s messages can be particularly difficult to understand,
    but they can also be invaluable in diagnosing hardware and driver problems since
    it is the kernel’s job to interface with hardware. The kernel ring buffer should
    be searched and reviewed if a hardware device is behaving strangely. Even if it
    is difficult to understand, a message from this log can be entered in a search
    engine or passed on to a more knowledgeable colleague for expert advice and further
    troubleshooting.


    Some distributions place a copy of the kernel ring buffer when the system first
    boots in `/var/log/dmesg` or a similar file. This file can be reviewed if the
    computer has been running for a long time and its earliest entries are already
    lost from the copy within the memory’s buffer. If you want to create such a within
    within your distribution and it isn’t already created by default, then edit the
    `/etc/rc.d/rc.local` file and add the following line to the end of the script:


    ```

    $ dmesg > /var/log/dmesg

    ```


