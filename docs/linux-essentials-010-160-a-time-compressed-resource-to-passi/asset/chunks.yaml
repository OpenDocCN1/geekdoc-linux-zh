    除了上述显示的名称 (`myfunction`) 之外，脚本编写者还可以选择性添加关键字 `function`（例如 `function myfunction`），以将脚本的该部分标识为函数，但这是完全可选的。一旦在脚本中创建了函数，就可以脚本的任何地方引用它，就像使用普通的内部或外部命令一样。函数对于创建模块化脚本非常有用，并且提高脚本的可读性和效率。例如，如果脚本在整个过程中需要执行十次相同的计算，可以将该计算放在一个函数中，需要时只需直接调用即可。请注意，函数不能在脚本之外运行，因为它不是真正的程序或命令。此外，函数并不是按照它们在脚本中出现的顺序运行，而是当它们的名字在脚本正文中出现时随时运行。


    ## 退出值 (Exit Value)

    每一个脚本就像每一个好故事，都有开头、中间（或正文）和结尾。然而，这个结尾可以在脚本内容完全结束之前就出现，正如我们在本章之前的 `if-then-else`
    示例所示的那样。无论脚本何时结束，它都会向 shell 返回一个退出值，以表示它已完成执行。


    脚本的默认返回退出值是脚本执行的最后一个命令的退出值。这在 shell 中通过变量 `$?` 表示。不过，退出值是可以控制的，可以通过 `exit` 命令在脚本的任何一点退出。在不带任何选项的情况下使用
    `exit` 会导致脚本立即终止，并带有默认退出值 `$?`。这在错误处理或在需要时中止正在进行的操作时非常有用。如果脚本检测到错误，或者用户选择了终止选项，脚本可以包含一个
    `exit` 调用，在脚本崩溃之前退出。


    如果脚本向 `exit` 命令发送一个 0 到 255 之间的数值，那么脚本将终止并返回指定的值作为脚本的退出值返回。这是一个非常有用的功能，如果脚本被另一个脚本或程序调用，它可以借此信号某个特定的错误。例如，脚本可以以值
    `1` 退出，表示向脚本提供了无效输入；或者以值 `2` 退出，表示输出文件不存在。这些选项是无限的，完全取决于脚本编写者如何决定这些值及其含义。


    例如，脚本的设计者可能会创建一个变量（`$termcause`）来存储脚本终止期间返回的值。当程序首次执行时，`$termcause` 的值将设置为 `0`，然后，如果脚本检测到会导致终止的问题，它将把
    `$termcause` 重置为非零值。由于此类代码默认没有设定含义，因此这里可以使用任何数值代码。每当脚本达到应该退出的条件时，它将只需使用 `exit
    $termcause` 退出，并将 `$termcause` 变量的值作为退出值返回给 shell。


    | 创建脚本 | 扫描二维码观看此主题的视频 | ![一个告示的特写 自动生成的描述](img/Image00021.jpg) |


    现在是时候将之前讨论过的脚本组件组合成一个完整的基础脚本了。创建一个简单的脚本，我们将使用 `nano` 命令，并在终端提示符处输入 `nano logic.sh`
    来创建一个名为 `logic.sh` 的脚本。首先，使用井号或 pound 符号（`#`）对前几行进行注释。在这种情况下，内容为 `#!/bin/bash`
    和 `Simple logic test display`。


    ```bash

    #!/bin/bash

    # Simple logic test and display

    ```


    从使用 `if` 命令开始。如果第一个参数等于 1（`$1 = ''1''`），系统将通过 `echo "The argument entered was
    1"` 显示下一个语句（`then`）。随后放置一个退出，`fi` 命令结束循环。脚本中的第二个 `if` 命令显示，如果下一个参数等于 2（`$1 = ''2''`），系统将通过
    `echo "the argument entered was 2"` 显示下一个语句（`then`），并放置一个退出。接下来是 `else` 命令，用于处理除上述两个参数以外的情况（输入的数字既不是
    1 也不是 2），通过 `echo "the argument entered was not 2"` 进行显示。它同样会退出，并由 `fi` 结束循环。


    ```bash

    if [ $1 = ‘1’ ]

    then

    echo The argument entered was 1

    exit

    fi

    if [ $1 = ‘2’ ]

    then

    echo The argument entered was 2

    exit

    else

    echo The argument entered was not 2

    exit

    fi

    ```


    确保通过按 `^O` 保存脚本，然后按 `^X` 退出终端提示符。更改文件的权限以确保它可以运行。输入 `chmod 755 logic.sh` 使文件设为可执行。输入
    `./logic.sh 1` 应该满足第一个 `if` 语句并显示 "The argument entered was 1"，此类推。然而，这个简单的脚本假设输入了参数且只有一个参数。否则，在没有参数时（例如输入
    `./logic.sh`），它会抛出错误。它将返回一个错误：


    ```bash

    diontraining@work: ~/Documents/scripts$ chmod 755 logic.sh

    diontraining@work: ~/Documents/scripts$ ./logic.sh 1

    The argument entered was 1

    diontraining@work: ~/Documents/scripts$ ./logic.sh 2

    The argument entered was 2

    diontraining@work: ~/Documents/scripts$ ./logic.sh 3

    The argument entered was not 2

    diontraining@work: ~/Documents/scripts$ ./logic.sh 0

    The argument entered was not 2

    diontraining@work: ~/Documents/scripts$ ./logic.sh

    ./logic.sh: line 4: [:: unary expected

    ./logic.sh: line 10: [:: unary expected

    The argument entered was not 2

    diontraining@work: ~/Documents/scripts$

    ```


    首先的是对参数数量进行检查。如果不等于 1（`$# != 1`），则它将通过 `echo` 显示用法说明。这也会退出，`fi` 命令结束循环。脚本的这部分检查了有多少个参数。现在，无论提供多少或什么参数，脚本都可以运行。


    ```bash

    #!/bin/bash

    # Simple logic test and display

    if [ $# != 1 ]

    then

    echo “Usage – This script requires one argument that is a number.”

    exit

    fi

    if [ $1 = ‘1’ ]

    then

    echo The argument entered was 1

    exit

    fi

    if [ $1 = ‘2’ ]

    then

    echo The argument entered was 2

    exit

    else

    echo The argument entered was not 2

    exit

    fi

    ```

    '
- fmt: '

    Linux itself is just the operating system, but most users focus on the programs
    they use to get their work done. When a user has a new type of work to do, they
    often will install a new program to handle that function. Most users do not compile
    the program directly from source code themselves, but instead install and upgrade
    their software using a special program called a package management system or a
    package manager. Once a program is installed and executed, it starts up multiple
    smaller functions known as processes. Each of these processes perform different
    functions, such as accessing the internet, writing files to a disk, and various
    other tasks. Each of these processes take up some memory on the system, and the
    operating system carefully monitors and logs each action.


    # An Overview of Package Management


    Package management is an area of Linux that varies between distros, but there
    are a few principles in common amongst all flavors. First, every package is created
    as a single file. Linux package files, unlike Windows installers, are not programs.
    Each of these individual packages rely on other programs to do the work of installing
    the software into a Linux system. These installation programs are commonly referred
    to as package management systems or package managers.


    Each package also contains dependency information. This information indicates
    to the packaging software what other packages or individual files must be installed
    for the package to properly install and to ensure that the resulting program will
    operate correctly. To help with this installation process, each package also contains
    version information so that the package manager can determine which version of
    each package is the most up to date.


    Unlike some operating systems, we can install Linux on multiple different types
    of architectures that have different processor instruction sets, which converts
    software into processes for the hardware to execute. Due to this, each package
    must contain the architecture information to identify which CPU type the package
    is intended to be installed on. This is normally either `i386` (for Intel processors)
    or `AMD` (for AMD processors), but other variants like `RISC` and `ARM` can also
    be found in some cases. Each piece of software being installed is compiled into
    a binary package (or executable package) using one of those specific processor
    instruction sets, and, therefore, they cannot be installed on a system with a
    different processor.


    The package management system maintains a database of information about all the
    installed packages on a given system. This information includes the names and
    version numbers of all the installed packages, as well as the locations of all
    the files installed from each package. This information enables the package software
    to uninstall software quickly, establish whether a new package’s dependencies
    have been met, and determine whether a package that a user is trying to install
    has already been installed and, if so, whether the installed version is older
    than the one being installed.


    # Package Management Systems


    There are two most common package management systems in use in Linux today are
    `RPM` and `Debian`. These systems differ in various technical details, in the
    commands used to manage their packages, and in the format of the package files
    they use. An `RPM` package cannot be installed on a `Debian`-based system, and
    vice versa. In fact, installing a package intended for one distro on another is
    a bit risky even when they use the same package type because a non-native package
    may have dependencies that conflict with the needs of native packages within a
    given system.


    When package managers were first created, all package management systems worked
    locally on a given system. To install a package, a user would have to first download
    a package file from the package creator’s site or from some other internet-based
    resource. After it’s downloaded, we could install the package with a local command.
    This approach is tedious when a package has numerous dependencies.


    If we attempted an installation and then found unmet dependencies, the user would
    have to search out and download several more packages. Then, after finding that
    one or more of those packages also has unmet dependencies, the cycle goes on and
    on. By the time all these dependency packages have been tracked down and installed,
    a user may have had to install a few dozen additional packages just to install
    the one program they wanted to use.


    Thankfully for us, most modern distributions provide network-enabled tools to
    help automate this laborious process. These package management tools rely on what
    is known as software repositories. These repositories provide a central collection
    point from which the package managers can automatically download packages and
    their dependencies. In practice, managing software in Linux now simply requires
    using text-mode or GUI tools to interface with a centralized software repository
    for any distribution.


    In modern Linux systems, there are five basic steps to installing a new piece
    of software:

    1. First, we issue a command to install a program.

    2. Second, the package management software locates all the program’s dependencies
    and notified the user of any additional software that they must install.

    3. Third, the user issues an approval for the package manager to download and
    install all the dependencies on their behalf.

    4. Fourth, the software downloads all the necessary dependencies and installs
    them. own5. Finally, the package manager installs the program and returns control
    of the system back to the user.


    Upgrading software works in a similar way, although upgrades are less likely to
    require downloading a lot of dependencies. Many distributions will automatically
    check with their repositories from time to time and notify system users when updates
    are available. By doing so, the system is kept up to date by simply clicking a
    few buttons when the user is prompted to do so.


    Removing software, unlike installing or upgrading, can be done entirely locally
    by the package management software. This is because the package management software
    continually keeps track of all installed packages and their dependencies, so they
    can be removed when requested by the user.


    The user should run the package management software as a root user or by using
    the `sudo` command. This is because the software needs root access to fully install
    all the dependencies and modify system configuration files, as needed. When updating
    the system, the package management will automatically prompt the user to enter
    the root password when the system software requires it.


    | Using RPM and DEB Packages | Scan QR code to watch a video for this topic |
    ![A close up of a sign Description automatically generated](Image00013.jpg) |

