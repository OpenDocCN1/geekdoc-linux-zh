- fmt: "\nThere are many text-based editors within Linux, and these are helpful when\
    \ we need to edit a configuration file or just quickly access a file to make some\
    \ changes.\n\n### Vi\nTo run `vi`, type `vi` and the filename to be created. For\
    \ instance, to create the file `test1`, type `vi test1`. This file starts blank\
    \ unless it is an existing file. After typing the command and pressing enter,\
    \ the left portion of the screen will be lined up with tildes (`~`). This signifies\
    \ that those lines have nothing on them. This open file is also in edit mode.\n\
    \nTo start typing, press the `i` key on the keyboard to go into insert mode and\
    \ start typing characters. Pressing enter moves the cursor to the next line. However,\
    \ to go back to the previous line or any other character in the file, the arrow\
    \ keys do not work; pressing the escape (`ESC`) key brings back edit mode, allowing\
    \ for movement using the up and down arrows. Pressing the `x` key deletes characters\
    \ and pressing the `i` key again allows us to insert or typing characters.\n\n\
    There are a couple of useful shortcuts to more easily manipulate `vi` in edit\
    \ mode:\n- The caret (`^`) brings the cursor to the beginning of the line.\n-\
    \ Typing a number and `w`, for example `3w`, brings the cursor three words forward\
    \ while a number and `b`, for example `2b`, brings the cursor two words back.\n\
    - To skip lines, enter a number and capital `G`; for example, `50G` brings the\
    \ cursor to the 50th line in the file.\n- Pressing the `:` key then typing `set\
    \ nu` replaces the tildes with line numbers to more easily identify lines.\n-\
    \ To undo a previous action, typing `u` will undo it.\n- To save the file, press\
    \ `:` then type `w` to save the information to the file or `wq` to save and quit.\n\
    - Typing `q!` at that prompt discards any edits and quits `vi`. \n\n`vi`’s man\
    \ pages will show more commands on how to properly use it.\n\n### Nano\nRunning\
    \ `nano` is just the same as `vi`; typing `nano` and the filename brings up the\
    \ editor and opens the file. Once `nano` shows up, it looks more like a command\
    \ program. It shows more information than `vi`. For example, the program’s name\
    \ and the version is at the top left. The file’s name is at the top center. The\
    \ file’s contents is also shown, if not blank. At the bottom are some commands.\n\
    \nCommands that start with a caret (`^`), such as `^G`, are entered by pressing\
    \ the `CTRL` key and then hitting the `G`, and this brings up Help, which is like\
    \ a man file. Compared to `vi`, `nano` is already in edit mode. The arrow keys\
    \ work, and you can insert and delete characters just like in a word processor.\
    \ And, similarly, text can be copied and pasted. It also has a spell checker and\
    \ has undo and redo. Changes on the file are saved by pressing `^O`, and `^X`\
    \ exits the program. With these features, `nano` has more functions and is more\
    \ convenient than `vi`, and we can use it for those quick file edits and configuration\
    \ changes.\n\n### Shell Scripting\nA program written in an interpreted language,\
    \ typically associated with a shell or a compiled program, is known as a script.\
    \ In Linux, many scripts are created as shell scripts since they are associated\
    \ with `bash` or another shell. Shell scripts are written by users to help automate\
    \ tedious, repetitive tasks or to perform new and complex tasks. Most distributions\
    \ use built-in scripts to perform many of the startup functions in a Linux system.\
    \ Mastering scripting is important for administrators because it will help in\
    \ managing the startup process of a system.\n\nShell scripts are plain-text files\
    \ that are created in text editors such as `vi`, `emacs`, `nano`, or `pico`. A\
    \ shell script begins with a line that identifies the shell that should be used\
    \ to run it. Consider the following simple script:\n\n```bash\n#!/bin/bash\necho\
    \ \"Hello World!\"\n```\n\nThe first line begins with two characters (`#!`). These\
    \ two characters are a special code that tells the Linux kernel that this is a\
    \ script and that the rest of the line should be treated as a pathname to the\
    \ program that will interpret this script. In this script, it is the path `/bin/bash`,\
    \ which is the path to the `bash` shell program.\n\nWithin a shell script, the\
    \ pound symbol or hash mark (`#`) is considered a comment character. This causes\
    \ the script utility to ignore this line, but the kernel still reads it. On most\
    \ Linux systems, `/bin/sh` is a symbolic link that points to `/bin/bash`, but\
    \ it can also point to another shell. If a user specifies the script as using\
    \ `/bin/sh` instead of `/bin/bash`, this almost certainly guarantees that any\
    \ Linux system will be able to execute the script since they all have a shell\
    \ program to run the script. If it is a simple `bash` script, the script can be\
    \ run in most other shells. Unfortunately, if the script is more complex, then\
    \ it will need a specific shell or else it could fail.\n\nAfter writing the shell\
    \ script, we must modify the text file to ensure it is now an executable file\
    \ within the operating system by using the `chmod` command. The use of `chmod`\
    \ will be covered in Chapter 12 (Ownership and Permissions).\n\nAs you begin to\
    \ create shell scripts that are lengthier and more complex, you will want to have\
    \ a good text editor program. If using a graphical desktop, `KWrite` and gnome’s\
    \ `gedit` editors are excellent for creating text shell scripts. However, if working\
    \ from a command line, then `vi`, `emacs`, `pico`, or `nano` can be used instead.\n\
    \n### Using Commands in Scripts\nThe simplest use of a script is to run a series\
    \ of commands without user intervention. Commands built into the shell and external\
    \ commands can both be used in scripts. This means that other programs can also\
    \ be run from within a script.\n\nMost of the commands that a user enters in the\
    \ shell prompt are external commands. All these programs are located in `/bin`,\
    \ `/usr/bin`, and other directories within the filesystem. These programs, as\
    \ well as internal commands, can be run by simply using their names within the\
    \ script. If needed, we can also specify parameters for each of these programs\
    \ in a script. For instance, consider the following script for copying a file\
    \ from Downloads to Documents, launching an xterm window, and then starting up\
    \ the KMail mail reader program inside the GUI:\n\n```bash\n#!/bin/bash\ncp ~/Downloads/file.txt\
    \ ~/Documents/file.txt\n/usr/bin/xterm &\n/usr/bin/kmail &\n```\n"
