- fmt: '

    Linux is a multiuser operating system, which means that a single Linux computer
    can support many users, each with their own unique account. In this section of
    the book, we will discuss important account principles and the commands for working
    with these accounts. We will also cover the root user account, with its special
    privileges for performing most system administration tasks. Additionally, we will
    discuss groups, which are logical collections of user accounts that can be given
    special permissions within a Linux system.


    ## Understanding User Accounts

    By utilizing user accounts, multiple users can share a single physical computer
    while maintaining a logical separation for their programs and data files. Since
    each person is assigned a unique user account, system administrators can track
    who is using system resources and who is taking which actions within a Linux system.


    Account features for each user’s account are defined in the `/etc/passwd` file.
    This file contains colon-delimited lines where each line contains a single record
    that defines an individual user’s account. The information contained in the fields
    of these records includes the username, password, `UID`, `GID`, comment field,
    home directory, and the default shell for that user.


    The first field contained within the colon-delimited line is the account’s username.
    This is the most relevant feature, since it uniquely identifies the user to which
    all the other attributes will be applied against. Linux account usernames consist
    of alphanumeric characters, but by convention most usernames are simply created
    using lowercase letters. Underscores, periods, and dashes are also valid characters
    in some Linux distributions. If including the dollar sign special character, it
    must appear at the end of the username.


    The next field is the password. Each user account is typically protected by a
    password, which is required to log into the computer. When a user enters their
    username and password, this creates a successful authentication and approves access.
    Originally in Linux, the password was stored in this field, but due to security
    issues the password field is now replaced with a single `x` instead. The `x` character
    indicates to the system that the actual password for the user will be stored in
    the `/etc/shadow` instead of the `/etc/passwd` file, as the `/etc/shadow` file
    is more secure since only the root user can access that file. When storing the
    password in the `/etc/shadow` file, it is first hashed using a one-way algorithm
    and then salted to ensure that no one can read the user’s password from the `/etc/shadow`
    file.


    The username provided for each account is just a human readable label that the
    computer uses to identify each user account on the system. In reality, the computer
    tracks these users using a numeric identification number known as the user identification
    (`UID`) number. `UID` numbers always start at 0 and continue upward based on the
    number of accounts created on the system. The root user is always `UID 0`. In
    most distributions, the user accounts will begin with `UID` number 1000. So, if
    a user created two accounts on a brand-new Linux installation as `jason` and `diontraining`,
    these accounts would be `UID 1000` and `10001`, respectively. `UID` numbers below
    1000 are reserved for system and service account.


    After the `UID` field, the group identification (`GID`) number is displayed. This
    `GID` is associated with one or more groups, and each group can contain one or
    more users. Just as directories and folders hold numerous files, a group collects
    numerous users who all have the same function or require the same permissions
    in a system. One of the best practices in system administration is to always assign
    permissions to a resource by assigning it to a group and not to an individual
    user. This allows a system administrator to quickly provide resource access to
    various users based on the intended function.


    The next field is the comment field. This field normally contains the user’s full
    name, but a system administrator can really store any type of information they
    desire within this comment field.


    The location of the home directory is the next field contained in the colon-delimited
    line. Every user account has an assigned home directory, which is an area where
    the user can store all their files, sub-directories, and individual configuration
    files. Just like how each user on a Windows system has a folder located at `c:\Users\<username>`,
    a Linux system maintains a similar area for the user’s files. By default, this
    is in `/home/<username>`, but some distributions place this in a different location,
    such as `/Users/<username>`. A system administrator can set the location of a
    user’s home directory to any location on the system, as well.


    The final field is the location of the default shell assigned to the user account.
    Normally, this shell will be set to the `bash` shell located at `/bin/bash`. The
    user can configure the default shell for the account to whichever shell they prefer,
    including the Bourne Again Shell (`bash`), Korn shell (`ksh`), the TENEX C Shell
    (`tcsh`), and the Z shell (`zsh`).


    ## Account Security

    To secure a user’s account, we should assign a long, strong password should. In
    earlier version of Linux, the password information was actually within the `/etc/passwd`
    file, but this practice was quickly modified since the `/etc/passwd` file is readable
    by all users. Therefore, storing a user’s password in plain text in the `/etc/passwd`
    file would be extremely risky and a poor security practice.


    Today, passwords are instead stored in the `/etc/shadow` file. This file cannot
    be read by ordinary users and is only accessible to the root user or by the system
    itself. Every user password is stored as a salted hash digest. A salted hash uses
    a one-way mathematical algorithm with additional randomized input (known as the
    salt) to produce a secure method to store the password. When a user attempts to
    login into the system, the password they enter is salted and hashed, and then
    this result is compared against what is stored within the `/etc/shadow` file.
    If the input and the stored value match, the user can access the system.


    Like the `/etc/passwd` file, the `/etc/shadow` file contains records for each
    user on the system, with each record containing one line of data with colon-delimited
    fields.


    The first field is the username. Unlike the `/etc/passwd` file, the `/etc/shadow`
    file does not rely on `UID` to identify users. Instead, the username is identified
    using a unique alphanumeric field, such as `jason` or `diontraining`.


    The second field contains the password, stored as a slated hash. Because it is
    a salted hash, the password doesn’t bear any resemblance to the real password.
    If an asterisk (`*`) or exclamation mark (`!`) is in the password, this indicates
    that the account is locked. Most often, a locked account is a system account and
    is not directly logged into by an end user.


    After the password field, the next field is the “Last Password Change”. This field
    contains the date that the password was last changed, and other operating systems
    often refer to it as the password. The date is stored as a whole number, which
    is based on the number of days since January 1, 1970, not as a Julian calendar
    date.


    The fourth field contains the “Days Until a Change Is Allowed”. This value is
    stored as a whole number, and security professionals often use it to prevent a
    user from changing the password multiple times on the system.


    The “Days Before a Change Is Required” is the next field. This field dictates
    when the password must be changed again using a whole number that represents the
    number of days. For example, if the value is set to `7`, then the password must
    be reset in one week (7 days).


    The next field is the “Days of Warning Before Expiration”. If this field is set,
    then the system is configured to provide a warning to the user that their password
    will need to be changed within the number of days.


    The “Days Between Expiration and deactivation” is the next field. In a Linux system,
    the system administrator can also configure the system to a specific period of
    time between an account’s expiration and actual deactivation. This field is the
    `/etc/shadow` file. When an account expires, the user’s password is erased from
    the file and this requires a system administrator to manually reactivate the account.


    To determine when an account will expire, see the “Expiration Date” field. This
    field shows the date on which the account will expire, and it is expressed as
    a whole number of the number of days since January 1, 1970. It is a security practice
    to require every account to be used at least once every 60 days. If an account
    isn’t used within 60 days, it should be set as expired and then deactivated after
    that time.


    The final field is the “Special Flag” field. This field is reserved for future
    use and is normally not used on Linux systems. If it is used, it generally contains
    a meaningless value that is unimportant to the user or system. Because of the
    password and security information contained within the `/etc/shadow` file, this
    file’s permissions are set to be highly restrictive and the ownership is set to
    the root user. This keeps non-root users from accessing, reading, or modifying
    the file and obtaining the salted passwords.


    It is important to understand that a user account is not a singular thing, though.
    An account is made up of lots of different pieces of information that are scattered
    across several files, such as `/etc/passwd`, `/etc/shadow`, `/etc/group`, and
    other files that refer to each user account.


    ## Understanding Groups

    A group is a collection of user accounts that are defined within the `/etc/group`
    file. Each record contains the information for one group listed as a colon-delimited
    line of four fields.


    The first field, known as Group Name, contains the name of the group displayed
    in its alphanumeric form. Most commands use this field when identifying, accessing,
    or manipulating data about a group.


    The second field is known as the password field and contains the password for
    the group if one exists. If a value of `x` is displayed, this indicates that there
    is a password, but it is stored elsewhere for increased security.


    The third field is the group identification (`GID`) number. Linux uses this identification
    to internally reference and identify each group. Just like with user identification
    numbers, group identification numbers are translated back to names for the benefit
    of users and system administrators who prefer a human readable name, opposed to
    a number.


    The fourth and final field is the User List. This field specifies which users
    belong to the group. This field can contain one or more users. If multiple users
    are listed, each username should be separated by a comma within this field. In
    order to identify a user as part of a group, the system can either identify the
    `GID` within the user’s individual entry in the `/etc/passwd` file, or the system
    can specify the usernames in the User List field of a group’s record in the `/etc/group`
    file.


    Unfortunately, there is a limitation when identifying a group within a user’s
    individual record in the `/etc/passwd` file. This method only allows us to assign
    a user to a single group within the `GID` field. If a group is associated with
    the user using this method, that group is the user’s primary group. Since a user
    can be a member of multiple groups, it is better to instead list the username
    within the `/etc/group` file under each group’s record that they will be part
    of. Each group that the user is added to using this method is a secondary group
    for the user.


    Groups are an important part of assigning permissions to different files. Each
    time a new file is created, the file will be automatically associated with the
    user’s current group. When a user logs into a system, the user’s current group
    is always set to their primary group by default. For a user to change their current
    group to one of their secondary groups, the user issues the `newgrp` command.
    To use this command, simply enter `newgrp <group>`, where `<group>` is the name
    of the secondary group the user wants to use as their current group. After entering
    this command, any files created by the user will be associated with their new
    current group.


    ## Account Management

    There are numerous commands and utilities for manipulating user accounts and groups
    on a Linux system. For example, if a user needs to determine which user they are
    currently logged in as, the `whoami` command can be utilized. By typing `whoami`
    at the prompt, the system will display the username. This is helpful when a user
    maintains multiple accounts on a system, such as a regular user and an administrator
    account, and needs to recall which account they are currently using.


    If the user needs additional details or information, they should use the `id`
    command. By typing `id` at the prompt, the system will display the current `UID`,
    username, `GID`, and the user’s group memberships to the terminal. The `id` command
    is extremely useful since it presents both the numeric `UID` and `GID` values,
    as well as their associated alphanumeric display names.


    Because Linux is a multiuser operating system, not only does it support multiple
    users accounts, but multi users can also be simultaneously logged on to the computer.
    For example, my web server, `diontraining.com`, currently has thousands of active
    users who log in to our learning management system to take their online video
    courses at any given time. In our case, this is done via a web-enabled front end,
    but most Linux users and administrators instead log into a remote server using
    a remote access tool like Secure Shell (`SSH`).


    Since multiple users cannot access the Linux system directly from the same keyboard,
    mouse, and monitor, Linux supports a feature known as a virtual terminal (`VT`).
    As a system administrator, it is important to know if there are other users who
    are currently logged on when you are performing system maintenance to prevent
    critical data from being lost.

    '
