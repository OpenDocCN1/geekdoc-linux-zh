  trans: '

    从诞生之初，Linux 被设计为一个多用户操作系统。这意味着任意数量的用户可以同时在单台机器上工作。这些用户可以通过不同的终端或网络连接连接到系统，同时为个人信息和个人桌面配置维护独立的存储区域。


    在机器上工作的用户中，Linux 区分区分了不同类型的用户角色。用户可以普通用户的身份登录 Linux 机器，也可以以 root 用户（超级用户）身份登录，超级用户拥有权限，授权其访问系统的所有部分并执行任何必要的管理任务。


    所有用户（包括超级用户）都有自己的家目录，用户所有的私有数据（如文档、书签和电子邮件）都存储在这里。虽然用户可以修改其自己家目录中的任何内容，但只有超级用户可以修改存放所有系统集中配置文件和可执行文件的系统目录。要修改这些文件和文件夹，用户可以选择在桌面环境中使用基于
    GUI 的文件管理器，或者通过命令行环境中的 Shell。Linux 和 Unix 系统的传统方法是使用命令行环境，但基于 GUI 的方法对大多数终端用户来说更简单。虽然使用命令行通常更快，但它要求对命令及其语法有更深入的了解，以便列出、创建、删除或编辑文件及其属性。


    ### 文件系统结构


    在 Linux 系统中，所有文件和目录都以树形结构存在。顶层目录是文件系统的根，标记为单个正斜杠（`/`）。请注意，文件系统的根不要与 root 用户或 root
    用户的家目录（`/home/root`）混淆。在 Windows 系统中，文件系统的根被指定为反斜杠（`\`），通常由驱动器字母 `C` 表示（通常写为 `C:\`）。


    Linux 中的所有其他目录都可以从根目录访问，并使用父子关系按分级结构排列。与 Windows 不同，Linux 不使用反斜杠来分隔路径组件，而是依赖正斜杠。因此，Windows
    用户的私有数据可能存储在 `C:\users\diontraining\documents`，但在 Linux 中，它可能存储在 `/home/diontraining/documents`
    下。此外，Linux 与 Windows 不使用驱动器字母。相反，用户可以通过路径本身的显示来检测他们正在访问哪个目录、驱动器、设备或网络。例如，你可以通过
    `/dev/disk1/storage/` 访问次级硬盘上的存储目录。


    ### 关键文件系统特性


    理解 Windows 和 Linux 之间另一个关键区别是挂载和卸载分区、驱动器和目录的概念。当 Windows 在启动过程中检测到分区和驱动器时，它会为它们分配一个驱动器字母。然而，除非挂载，否则
    Linux 分区或设备在目录树中通常不可见。挂载设备意味着它将被集成到目录树中的某个特定位置。如果设备未被挂载，普通用户无法访问该设备或其分区上的任何数据。


    幸运的是，大多数现代 Linux 发行版会自动为终端用户挂载分区和设备。在安装期间，用户可以定义在系统启动时自动挂载的分区。可移动设备通常在连接时也会系统自动检测并挂载。如
    `KDE` 或 `Gnome` 等桌面环境会在新设备挂载并变得可访问时通知终端用户。如果你正在使用旧版本的 Linux 并需要手动挂载设备，将使用 `mount`
    和 `umount` 命令。要了解这些命令的准确用法，请使用 Linux 系统上对应的 `man` 页面。


    与 Windows 不同，Linux 在文件系统中区分大写和小小写字母。因此，如果你将文件 `test.txt` 更改为 `TeST.txt` 或 `Test.txt`，Linux
    认为这是三个不同的文件。这种大小写敏感适用于文件系统中的文件和目录。所以，如果你有 `Letters` 和 `letters` 目录，Linux 会将它们视为两个不同的目录。


    Linux 和 Windows 的另一个主要区别是使用文件扩展名来定义文件的用途。例如，在 Windows 中，文本文件会以 `.txt` 结尾。在 Linux
    中，文件可能有文件扩展名（如 `.txt`），但并不是要求的。相反，操作系统查看文件内容来确定哪个应用程序可以读取它，而不是简单地依赖三个字母的扩展名。尽管许多用户仍添加三字母扩展名，因为这有助于用户识别文件的类型和用途。


    与 Windows 类似，Linux 也区分普通文件和隐藏文件。通常情况下，系统使用隐藏文件来存放配置细节。隐藏文件通过文件名前的点来指示，例如 `.hiddenfile`。为了访问隐藏文件，你可以在文件管理器中切换视图的属性或选项，或者在
    Shell 中使用某些命令语法选项。


    前所述，Linux 是一个多用户系统，因此每个文件必须属于一个特定的用户和一个组。只有文件或目录的所有者（或 root 用户）可以授予其他用户访问它们的权限。Linux
    区分了三种不同的访问权限：写权限、读权限和执行权限。用户只有在至少拥有读权限的情况下才能访问文件或文件夹。更改文件和文件夹访问权限有几种方法：可以通过 Shell，也可以借助桌面桌面的文件管理器。


    尽管每个 Linux 发行版都有自己处理某些事务的方法，但所有 Linux 开发者都认为目录结构布局需要某种程度的标准。为了满足这一需求，创建了文件系统层次结构标准（FHS）。FHS
    在可共享文件和不可共享文件之间做了重要区分。可共享文件可以在计算机之间合理共享，例如用户数据文件和程序二进制文件。不可共享文件包含系统特有的信息，例如配置文件。FHS
    在在静态文件和变量文件之间作了第二个重要区分。静态文件通常不会改变，除非通过管理员的直接干预。例如，可执行文件被视为静态文件。另一方面，用户、自动化脚本、服务器或其他设备可以更改变量文件。


    ### 导航文件和目录


    现在我们已经对文件系统有了概述，是时候学习如何在其中导航了。但在操作文件和目录之前，了解哪些文件在哪个目录中是重要的。`ls` 命令（list 的缩写）提供了此信息。如果使用
    `ls` 时没有命令行选项，输出将仅显示当前目录下的文件。然而，可以提供额外的选项来显示更详细的信息。例如，使用 `-a` 选项显示包括隐藏文件在内的所有文件。如果你使用
    `-l` 选项，它将显示详细输出，除了文件名外还包括权限、所有者、文件大小和创建日期。


    另一个实用的选项是 `-d`，它用于处理目录。当在一个包含许多子目录的目录中工作时，使用带有通配符的 `ls` 可能会得到意外的结果：输出将显示匹配子目录中的文件，而不是目录本身。要获取目录本身的信息，你可以改为包含
    `-d` 选项。


    `cd` 命令（change directory 的缩写）将当前目录更改为用户提供的另一个目录。虽然当前目录对于许多命令并不重要，但在引用某些文件操作时它将至关重要。在使用
    `cd` 时，不要忘记 Linux 使用正斜杠（`/`）作为目录分隔符，而不是 Windows 使用的反斜杠（`\`）。正斜杠和反斜杠不能互换的，因此取决于用户为所使用的操作系统使用正确的符号。输入
    `cd` 后跟目录名或路径将使 Shell 切换到该目录。要知道当前位置的完整路径，我们始终可以在提示符处输入 `pwd` 命令（present working
    directory）。


    记住 Linux 使用统一的目录树。这意味着系统上的所有文件都相对于单个根目录（`/`），该根目录通过单个正斜杠表示。文件和目录可以通过三种方式引用：绝对引用、家目录引用或相对引用。


    - **绝对引用**：允许相对于根目录引用文件，例如 `/home/user1/file.txt`，它指向 `user1` 家目录下的 `file.txt`
    文件。绝对引用始终以正斜杠开头，因为它们从文件系统的根开始。

    - **家目录引用**：使用波浪号（`~`）引用用户的家目录。如果文件名以该字符开头，就好像用户家目录的路径被替换成了波浪号。对于 `user1` 来说，`~/file.txt`
    等同于绝对引用 `/home/user1/file.txt`。

    - **相对引用**：指相对于当前目录的文件引用。每个 Linux 目录都包含两个特殊的隐藏子目录，被称为点（`.`）和点点（`..`）。`.` 指向当前目录，这也称为当前工作目录。就个人而言，我总是将其引用为“这里”。因此，如果你想创建一个相对路径，可以使用
    `.` 作为起始点。`..` 指向父目录。...（注：原文后续部分存在较多文本重复和逻辑混乱，此处已根据指令核心含义进行处理）


    '
