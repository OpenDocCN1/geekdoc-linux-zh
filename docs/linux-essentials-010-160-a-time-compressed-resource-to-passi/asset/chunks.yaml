- fmt: "\nIn this book, you will receive a crash course that will introduce you to\
    \ everything you need to know to pass the LPI Linux Essentials® certification\
    \ exam. This book covers just the essentials with no fluff, filler, or extra material,\
    \ so you can learn the material quickly and conquer the certification exam with\
    \ ease. \n\nThe LPI Linux Essentials® exam is the first certification exam in\
    \ the Linux Professional Institute’s certification path. This certification is\
    \ designed to test your ability to use the basic console line editor and to demonstrate\
    \ an understanding of processes, programs, and components of the Linux operating\
    \ system. This book assumes that you have no previous experience with the Linux\
    \ operating system and will teach you exactly what you need to know to take and\
    \ pass the Linux Essentials® certification exam on your first attempt. \n\nNow,\
    \ this book will NOT teach you everything you need to know to be efficient or\
    \ effective in utilizing Linux on a daily basis. After all, the LPI Linux Essentials®\
    \ certification is designed to introduce you to the Linux operating system and\
    \ its various concepts. If you want to become an expert in Linux, then this book\
    \ and the LPI Linux Essentials® certification are a great start but remember that\
    \ they are both written at the introductory level. Once you finish them, I recommend\
    \ continuing upward to the `LPIC-1 (System Administration)` certification and\
    \ its associated video courses and textbooks to further enhance your skills. This\
    \ text singularly focuses on getting you to pass your certification exam, not\
    \ to make you an expert in the Linux operating system, its system administration,\
    \ or Linux engineering. Due to the design of this text, we will move at a very\
    \ quick pace through the material. If you read this entire book and take the practice\
    \ exam at the end of the text (scoring at least an 85% or higher), you should\
    \ be ready to take and pass the LPI Linux Essentials® certification exam on your\
    \ first attempt!\n\n## Exam Basics\nThe Linux Essentials® certification exam is\
    \ an entry-level certification for Information Technology personnel interested\
    \ in understanding the Linux operating system, its usage, and its operation. This\
    \ introductory certification covers a general overview of the Linux operating\
    \ system: how to install it, how to configure it, and how to operate programs\
    \ within it, both in the graphical user interface (`GUI`) and the command line\
    \ interface (`CLI`). \n\nThe target audience for the LPI Linux Essentials® certification\
    \ is for those who need:\n\n* An understanding of the Linux and open source industry\n\
    * An understanding of the major components of Linux work\n* A basic knowledge\
    \ of the command line\n* A basic understanding of networking and security in Linux\n\
    \nThe certification exam consists of 40 multiple-choice questions which must be\
    \ completed within 60 minutes. A minimum score of 500 points on a scale of 200-800\
    \ points is required to pass the certification exam, equating to a score of about\
    \ 70% or higher. The exam is a closed book exam, with no notes or study materials\
    \ allowed during your examination. The current cost of the exam at the time of\
    \ publication of this book is $120 USD, and one can take the exam at any PearsonVue\
    \ testing center worldwide or online with the `OnVue` service.\n\nDion Training\
    \ Solutions (`www.diontraining.com`) is an LPI Approved Training Partner for the\
    \ Linux Essentials® certification exam. To purchase your exam voucher at a special\
    \ discounted price available to our readers, please visit `diontraining.com/vouchers`.\n\
    \n## Exam Tips and Tricks\nBefore we dig into the contents of the LPI Linux Essentials®\
    \ certification exam, it is important for you to understand some exam tips and\
    \ tricks. This will help you to grasp exactly how to study for the exam as you\
    \ read through the rest of this book, and it will help you to focus your efforts\
    \ to get the most out of this material. \n\nThe most important thing to remember\
    \ when taking the LPI Linux Essentials® certification exam is that there are no\
    \ trick questions on test day. Every question is precisely worded to match the\
    \ material you have studied. You should read each question multiple times to ensure\
    \ that you understand exactly what its asking and that you are answering the question\
    \ being asked. Anytime you see the words `ALWAYS` or `NEVER` in an answer, think\
    \ twice about selecting it. As in most things in life, rarely is there a case\
    \ where something `ALWAYS` or `NEVER` applies to a given situation!\n\nAs you\
    \ read the questions and answers, be on the lookout for distractions or red herrings.\
    \ Generally, there is at least one of these listed in the possible answer choices\
    \ to try and distract you from the correct answer. \n\nIf you see part of a question\
    \ with bold, italics, or all uppercase letters, you should pay close attention\
    \ to those words because the test writers decided that those keywords are important\
    \ to selecting the correct answer. \n\nIt is important to remember what concepts\
    \ in Linux and the open source environment were covered in your studies, since\
    \ you will see questions on them again come test day. You shouldn’t see things\
    \ on the exam that were not covered by the textbook or video course you used to\
    \ study for the exam. We will cover all these concepts throughout this book, as\
    \ these are the building blocks of Linux Essentials® curriculum and the certification\
    \ exam. Also, if a question asks about a particular `command`, then make sure\
    \ that you don’t select an answer that contains a concept or process. Always be\
    \ careful to answer the question being asked. \n\nAlso remember that you must\
    \ answer the questions based on your Linux knowledge and studies from this textbook,\
    \ not your personal workplace experience. Your workplace may implement Linux and\
    \ its concepts differently in their situation and use case. When in doubt, you\
    \ should always select the book answer when answering a question on the certification\
    \ exam. \n\nOn exam day, you should also select the `BEST` answer. Each question\
    \ may have several right answers, but one is always the most correct answer. When\
    \ in doubt, choose the answer that is correct in the greatest number of situations!\
    \ \n\nOn test day, you don’t have to memorize the terms from this course on LPI\
    \ Linux Essentials ® word for word, but you must be able to recognize them from\
    \ the choices given. During certification exams, you will choose your answer from\
    \ a multiple-choice style question instead of a fill-in-the-blank or essay question.\
    \ This is an essential difference in certification testing and the tests you may\
    \ have taken in high school or college. In the certification world, you just need\
    \ to be able to recognize, not regurgitate, the information.\n\n## CHAPTER TWO\
    \ Evolution of Linux\n![](Image00004.jpg)\n\n### OBJECTIVES\n* Understand the\
    \ open source philosophy\n* Describe various Linux distributions and their lifecycles\n\
    * Understand Linux’s use in embedded systems\n* Understand basic hardware requirements\
    \ for Linux\n* Describe differences between Linux and other operating systems\n"
