    \ with this additional information.\n\n```\n| DionTraining:Documents jason$ ls\
    \ -l LinuxEssentialsstotal 16-rw-r--r--@ 1 jason staff 4 Sep 8 10:07 Questions.txt-rw-r--r--@\
    \ 1 jason staff 4 Sep 8 10:07 StudyGuide.txtDionTraining:Documents Jason$\n```\n\
