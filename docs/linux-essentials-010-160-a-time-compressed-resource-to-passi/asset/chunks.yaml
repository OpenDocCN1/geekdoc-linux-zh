    引号和反斜线仅仅是告诉 shell 将输入中的哪些部分视为普通（非特殊）字符。引号的作用仅在于界定或识别一组字符。shell 会移除实际的引号引用机制（双引号、单引号或反斜线），而不会将其视为传递给命令的字符串的一部分。


    | 正确的命令用法 | 扫描二维码观看此主题的视频 | ![带有白色文字的黑色背景标识 自动生成的描述](img/Image00016.jpg) |


    ---


    访问 Linux shell 有几种方法。一种方法是在桌面上点击鼠标右键，并在菜单中选择 `Open Terminal`（打开终端）。另一种方法是点击任务栏上的应用程序菜单并搜索
    `Terminal`。系统中可能存在多个终端，因此最简单的方法是使用右键选项。


    在 Ubuntu 等发行版中，在桌面上点击鼠标右键并在菜单中选择 `Open Terminal` 会打开默认终端。在 shell 内部，你就可以开始输入命令。但这需要使用正确的语法。


    例如，`ls`（list）命令类似于目录列表或 Windows 中的 `dir` 命令。在提示符处输入 `ls` 将显示当前目录下的文件夹和文件。通常情况下，打开默认终端时，主目录由
    `$` 符号前的 `~` 表示。要切换到当前目录内的文件夹，我们使用 `cd` 命令（即切换目录，change directory）。有时 shell 用户可能会迷失方向，因为某些发行版不会显示当前正在访问哪个目录。在
    Ubuntu 中，shell 用户可以通过查看 `$` 符号之前的目录结构来跟踪当前访问的文件夹。但对于其他没有此项的发行版，只需输入 `pwd` 命令（显示当前工作目录），即可显示从根目录到当前文件夹的完整路径。


    要快速在文件夹内创建文件，`touch` 命令会根据给定的任何文件名创建一个空文件。如果回到命令部分，请记住有命令、选项和参数。命令告诉系统做什么，选项说明如何执行这些命令，而参数则告诉系统对什么执行命令或对它进行什么操作。使用
    `touch` 命令时，不需要输入选项。只需输入 `touch test1.txt` 就会在当前目录下创建一个名为 `test1.txt` 的空文件。


    回到 `ls` 命令，我们可以使用多个选项来实现比列出当前目录文件和文件夹之外的功能。你可能想查看 `ls` 列出的文件和文件夹的更多细节和额外信息。使用
    `-la` 选项或带有所有属性的详细视图 `ls -la`，会列出带有权限、所有者和文件大小等额外细节的文件和文件夹。


    之前讨论了变量和变量名，重点提到了用于打印环境变量的 `printenv` 命令。该命令输出的最后一行显示了 `OLDPWD`，它是进入当前目录之前最后访问的目录。


    引号在命令语法中同样重要，因为如果使用不当将无法实现预期的输出。例如，分号（`;`）通常同时运行两个命令。例如，通过输入 `echo Hello; ls`，我们首先打印
    `Hello`，然后列出当前目录下的文件和文件夹。要更改命令行中分号（`;`）的功能，可以将应包含分号（`;`）作为字符的文本放在引号内，或者在分号前使用反斜线（`\`）让
    shell 将分号视为普通文本。


    ### man 和 info


    Linux shell 是强大且实用的。然而，由于有一千多个单独命令以及更多的语法选项和参数，几乎不可能记住其中的每一个细目项。幸运的是，有两个易于使用的资源可以在你使用命令行环境时为你提供大量信息。这些资源就是
    `man` 和 `info` 命令。


    `man` 命令包含了系统上每个可用命令的手册（man 页面）。这包括关于该命令的功能、执行该命令的特定细节，以及它们接受的命令行参数或语法的详细信息。可以通过运行终端并输入命令
    `man` 后跟想要获取信息的命令名称来调用 man 页面。例如，如果你想获取 `ls` 命令的信息，只需输入 `man ls` 并按回车即可进入列表命令的
    man 页面。


    在阅读 man 页面时，也可以对你想查找的特定信息进行关键词搜索。如果你知道想用命令实现什么，但记不起确切的命令或语法，使用此搜索功能非常有用。若要在系统的每个
    man 页面中进行关键词搜索，只需输入 `man -k` 并指定搜索词。请注意，在命令、选项和搜索词之间必须使用正确的空格。如果你正在搜索一个包含多个单词的复杂短语，不要忘记在搜索词周围加上引号，以消除空格通元字符的特殊含义。


    如果你已经知道想要使用的命令，也可以在单个 man 页面中进行搜索。要做到这一点，按下正斜杠（`/`）后输入要搜索的术语并按回车。如果该术语出现多次，可以通过每次按
    ''n'' 键在条目之间循环切换。

