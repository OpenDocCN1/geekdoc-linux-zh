  trans: "\n\n除了第一行标识其为脚本外，该脚本看起来与用户在 shell 中手动输入以完成这三个任务的命令完全相同。唯一的区别是，该脚本列出了每个程序的完整路径。这通常不是严格必须的（如带有\
    \ `cp` 命令的行行所示），但列出完整路径可以确保即使 `PATH` 环境变量发生变化，脚本也能找到这些程序。如果脚本运行时产生错误（例如“命令 'xxx'：没有此类文件或目录”），你可以通过运行\
    \ `which` 命令来定位路径，从而帮助找到程序。例如，如果你需要找到 `xterm` 程序的路径，在 shell 提示符处输入 `which xterm`\
    \ 应该返回 `/usr/bin` 作为其路径。\n\n在提供的基础脚本中，注意示例脚本中的每一行都以安符（`&`）结尾。这个字符指示 shell 继续执行下一行，而无需等待第一个命令执行完毕。如果没有提供安符，第一个\
    \ `xterm` 将打开，但在 `xterm` 程序关闭之前，`KMail` 程序将不会打开。\n\n虽然从一个脚本启动多个程序可以节省系统或程序启动时的时间，但在某些情况下，用户希望在开始脚本的下一行之前等待当前行完成。这在运行系列通过某种方式处理上一个命令产生的数据程序时很常见。这些脚本通常不包含命令末尾的安符，因为命令必须一个接一个地运行，甚至可能依赖于第一个命令的输出。\n\
    \n虽然脚本可以在其中使用任何命令或程序，但管理员通常会在脚本中使用某些特定命令来执行某些功能。\n\n`echo` 命令可能是脚本中最常用的命令。`echo`\
    \ 命令在终端屏幕上向用户显示消息。例如，脚本开头可能会有一条给用户的消息，内容为“请稍候，脚本正在运行……”。这种类型的消息是使用 `echo` 命令显示的。\n\
    \n当需要自动执行重复的文件维护任务时，我们使用 `ls`（列出）、`mv`（移动）、`cp`（复制）和 `rm`（删除）命令。\n\n当需要从文件的特定字段中提取文本时，我们大量使用\
    \ `cut` 命令。这在处理预定义格式的文本文件（如逗号分隔值文件，CSV 文件）时特别有用。\n\n`find` 命令根据文件名、所有者或其他特征查找特定文件。如果管理员需要在文件内容中定位特定模式的信息，他们会使用\
    \ `grep` 命令。`grep` 命令还可以显示提供文件内部匹配搜索字符串的行。\n\n### 变量\n\n扩展脚本实用性的另一种方法是使用变量。变量是脚本执行时待确定的值的占位符。变量的值可以作为参数传递给脚本、在脚本内部生成，或从脚本的环境中提取。环境是一组变量，包括程序可以访问的当前目录或运行运行的搜索路径等项目。\n\
    \n传递给脚本的变量被称为参数或参数。它们在脚本中用美元符号（`$`）后跟一个数字来表示。这些数字从 `$0` 开始（代表脚本名称），然后是 `$1`（第一个参数），然后是\
    \ `$2`（第二个参数），依此类推。\n\n考虑以下脚本并尝试确定正在执行哪些函数。如果你不某个命令，请使用 `man` 命令学习更多关于它的信息。当你认为自己理解了脚本时，请继续阅读以检查是否理解得正确。\n\
    \n```bash\n#!/bin/bash\nuseradd -m $1\npasswd $1\nmkdir -p /shared/$1\nchown $1.users\
    \ /shared/$1\nchmod 755 /shared/$1\nln -s /shared/$1 /home/$1/shared\nchown $1.users\
    \ /home/$1/shared |\n```\n\n脚本首先使用给脚本的第一个参数作为用户名创建一个账户。脚本更改账户密码，并在 `/shared` 目录下创建一个与账户名对应的目录，该名称同样是从运行脚本的用户处接收的第一个参数。然后将此新创建目录的所有权交给新用户账户，并修改其权限以赋予用户读、写、执行权限。接下来，脚本从新用户的主目录设置到该目录的符号链接，并提供新用户账户对主目录中此文件夹的所有权。\n\
    \n如果你现在还没有理解此脚本中的所有内容，那是完全正常的，因为这些命令和程序对你现在来说是新的。但在本书结束时，你应该能够熟练地阅读这样的脚本，甚至自己编写一个。\n\
    \n要使用此脚本，用户只需输入脚本名称、新用户名并输入两次所需的密码，如下文节录所示：\n\n```\nDionTraining:Documents jason$\
    \ ./user_script.sh jasondion\nChanging password for jasondion\nNew password:\n\
    Retype password:Password for jasondion changed by jason\nDionTraining:Documents\
    \ jason$\n```\n\n当脚本运行时，屏幕上唯一显示的内容是命令通常会显示的内容，例如输入新密码的提示符。所有其他命令都在后台运行，没有任何用户交互或感知。这被称为静默操作。由于由于原因，许多脚本编写者会使用\
    \ `echo` 命令在脚本中添加显示注释，以便操作期间向用户传递信息。实际上，此脚本用一个脚本替换了七条单独命令。对于每个命令，第一个参数（`jasondion`）被用作变量，防止用户每次重新输入用户名。\n\
    \n### 条件表达式\n\n默认情况下，脚本将执行从第一行到最后一行列出的所有命令，但有时根据情况跳过某些会有帮助。为了实现这一点，我们使用条件表达式。\n\
    \n条件表达式允许脚本根据满足的条件或变量的值执行若干操作之一。`if` 命令允许脚本评估放在 `if` 关键字后括号内的给定条件表达式，然后根据特定条件为真还是假来执行两种不同操作之一。\n\
    \n例如，文件存在条件（`-f`）在文件存在且为普通文件时为真。文件存在且为空条件（`-s`）在文件存在且大小大于 0 时为真。`string1 == string2`\
    \ 条件在两个字符串具有完全相同的值时为真。\n\n这些条件语句还可以与逻辑与（`&&`）或逻辑或（`||`）运算符结合。当条件与逻辑与结合时，只有当运算符的两侧都为真时，整个条件才被视为真。当我们使用逻辑或时，如果运算符的任一侧为真，则整个条件也被视为真。\n\
    \n考虑以下展示了 `if` 命令和条件表达式的脚本片段：\n\n```bash\nif [-f /tmp/tempfile.txt]\nthen\n  echo\
    \ \"/tmp/tempfile.txt 已找到；正在终止脚本。\"\n  exit\nfi\n```\n\n"
- fmt: "\nThis basic conditional evaluates whether the file (`tempfile.txt`) exists\
    \ within the `/tmp` directory. If the file exists, then the condition is true,\
    \ and the “then” branch will execute to display the message using the `echo` command,\
    \ and the script will exit. If the conditional instead found that the file does\
    \ not exist, then the `echo` and `exist` commands are skipped, and the `if` condition\
    \ ends when the `fi` command is reached. The `fi` command simply shows the end\
    \ of an `if` command statement block, as shown above.\n\nA conditional, such as\
    \ the one above, may be useful if your script creates a file when it runs. If\
    \ you check if the file already exists at the beginning of the script and it tests\
    \ true, then this indicates that the script was already or is still running. The\
    \ `if` command also supports using the keyword `test` instead of the brackets,\
    \ if desired. The following variant would also work:\n\n```\nif test -f /tmp/tempfile.txt\n\
    then\necho “/tmp/tempfile.txt was found; aborting script.”\nexit\nfi\n```\n\n\
    Another useful test condition is to use the output of a command as the test case,\
    \ such as the following pseudocode:\n\n```\nif [command]\nthen\n[additional commands]\n\
    fi\n```\n\nIn the pseudocode above, the additional commands will only run if the\
    \ command in the test condition executes successfully. If the command returns\
    \ any error codes, then the additional commands simply would be skipped during\
    \ the script’s execution. The `if` command also supports the ability to define\
    \ what commands should run if the condition is not met. This is often read as\
    \ “if, then, else”. For example, you may hear programmers and script writers say,\
    \ “If the condition is true, then do this, else (otherwise) do that.”\n\n```\n\
    if [command]\nthen\n[do this command]\nelse\n[do that command]\nfi\n```\n\nThis\
    \ type of coding will cause only one of the two branches to execute: either the\
    \ `then` or the `else`. This is useful when a programmer needs to allow the program\
    \ to make a choice in which commands to run or what files to operate on based\
    \ on a certain condition. It is important to note that in the pseudocode above,\
    \ multiple commands or lines can be added into each branch of the `then-else`,\
    \ as needed.\n\nWhile the `if-then-else` works well for conditions and choices\
    \ with two outcomes, this is sometimes limiting. For example, if you create a\
    \ script that displays four choices to the screen as part of a menu option to\
    \ the user running the script, the user then enters a number, 1, 2, 3, or 4, and\
    \ the script runs a certain command based on that number. Using the `if-then-else`\
    \ command would require a fairly messy decision tree, as shown in this pseudocode:\n\
    \n```\nif [$userchoice == 1]\nthen\n[do command #1]\nelseif [$userchoice == 2]\n\
    then\n[do command #2]\nelseif [$userchoice == 3]\nthen\n[do command #3]\nelseif\
    \ [$userchoice == 4]\nthen\n[do command #4]\nelse\necho “Error – User didn’t enter\
    \ 1, 2, 3, or 4.”\nfi\n```\n\nWhile this pseudocode is functional, these nested\
    \ `if-then-else` statements are rather clumsy and confusing to understand. Luckily,\
    \ shell scripting provides us with a suitable alternative, known as a `case` statement,\
    \ for scenarios where there are multiple possible outcomes. Consider the following\
    \ pseudocode using a `case` statement that performs the same function as the nested\
    \ `if-then-else` above:\n\n```\ncase $userchoice in\n1)      [do command #1];;\n\
    2)      [do command #2];;\n3)      [do command #3];;\n4)      [do command #4];;\n\
    esac\n```\n\nGenerally, a `case` statement uses a variable, and each pattern shown\
    \ before the right parenthesis is a possible value of that variable. In the example\
    \ above, we expect the user to input a value of 1, 2, 3, or 4. Each set of commands\
    \ ends with a double semicolon to signify the end of the actions for that specific\
    \ case. This allows multiple commands to be run from within each matching case\
    \ to the value entered by the user in `$userchoice`. At the end of the `case`,\
    \ we use the keyword `esac`, which is `case` spelled backwards, just like `fi`\
    \ was used for `if`.\n\nWhen using a `case` statement, the variable (`$userchoice`\
    \ in the example above) simple finds the matching case (for example, 3) and executes\
    \ that single line until it reaches the double semicolon. Once the double semicolon\
    \ is reached, the script jumps to the line after the `esac` keyword. If no matching\
    \ case value is found, then none of the statements will execute, and the script\
    \ resumes operation after the `esac` keyword.\n\n### Loops\n\nSo far, all the\
    \ scripting components covered will only execute a single time. For example, if\
    \ an `if-then-else` or `case` is considered and the test case doesn’t match it\
    \ currently, it will be skipped and never executed. Unfortunately, sometimes it\
    \ is important to do things multiple times or to test a condition multiple times\
    \ to see if the condition has changed. To do this, we use a special structure\
    \ known as a loop. A loop allows a script to perform the same task repeatedly\
    \ until a particular condition is met or until a certain condition is no longer\
    \ true. Consider the following loop and try to determine what it will cause when\
    \ the user executes this script.\n\n```bash\n#!/bin/bash\nfor x in ‘ls *.txt’;\
    \ do\ncat $x\ndone\n```\n\nIn this example, the loop will execute once for every\
    \ item returned by the command `ls *.txt`. Therefore, let’s assume there are 3\
    \ files in the current directory: `foo1.txt`, `foo2.txt`, `foo3.txt`. When this\
    \ script is executed, the loop will first run `ls *.txt` and receive a list of\
    \ 3 files. Since there are three files, this loop will execute 3 times. The first\
    \ time through the loop, the `cat foo1.txt` is run. This will cause the contents\
    \ of `foo1.txt` to display. The second time through the loop, the command `cat\
    \ foo2.txt` will run, and the contents of `foo2.txt` will display. Then, the loop\
    \ will run a third time, and this time the contents of `foo3.txt` will display.\
    \ Since there are no more `.txt` files in the directory, the loop will end.\n\n\
    Instead of using a command like `ls` to set the number of times the loop will\
    \ run, the programmer can also use the `seq` command. The `seq` command generates\
    \ a list of numbers, starting from the first argument and continuing up to the\
    \ last argument. If three arguments are given to `seq`, then it will treat them\
    \ as the starting value, the increment value, and the ending value. Considering\
    \ the following output:\n\n```bash\n#!/bin/bash\nfor x in $(seq 1 3 10); do\n\
    echo $x\ndone\n```\n\nThis output shows the contents of the script. This is a\
    \ bash script, as shown by the first line (`#!/bin/bash`). The loop uses the `seq\
    \ 1 3 10` command to create the number of times to execute the loop. Each time\
    \ the loop executes, the number (`x`) is displayed to the screen and then a new\
    \ line is created. The example above shows the output, with 1, 4, 7, and 10 displayed.\n\
    \nIn addition to the `for` loop, there is also another type of loop called a `while`\
    \ loop. A `while` loop executes the commands within the loop repeatedly as long\
    \ as the condition being tested remains true.\n\n```bash\n#!/bin/bash\nwhile [test\
    \ condition]\ndo\n[commands to execute]\ndone\n```\n\nThere is another loop called\
    \ an `until` loop. The `until` loop works like the `while` loop, except the `until`\
    \ loop executes continually as long as the condition remains false.\n\n### Functions\n\
    \nScripts also support the creation of functions within them. These functions\
    \ perform a specific subtask and can be called by name from within other portions\
    \ of the script. Functions are created by placing parentheses after the function\
    \ name, then enclosing the commands that will run as part of the function within\
    \ curly brackets, as shown in the pseudocode below:\n\n```bash\n#!/bin/bash\n\
    myfunction() {\n    [commands to execute]\n}\n```\n"
  raw: 'This basic conditional evaluates whether the file (tempfile.txt) exists within
    the /tmp directory. If the file exists, then the condition is true, and the “then”
    branch will execute to display the message using the echo command, and the script
    will exit. If the conditional instead found that the file does not exist, then
    the echo and exist commands are skipped, and the if condition ends when the fi
    command is reached. The fi command simply shows the end of an if command statement
    block, as shown above.A conditional, such as the one above, may be useful if your
    script creates a file when it runs. If you check if the file already exists at
    the beginning of the script and it tests true, then this indicates that the script
    was already or is still running.The if command also supports using the keyword
    test instead of the brackets, if desired. The following variant would also work:


    | if test -f /tmp/tempfile.txtthenecho “/tmp/tempfile.txt was found; aborting
    script.”exitfi |


    Another useful test condition is to use the output of a command as the test case,
    such as the following pseudocode:


    | if [command]then[additional commands]fi |


    ​ In the pseudocode above, the additional commands will only run if the command
    in the test condition executes successfully. If the command returns any error
    codes, then the additional commands simply would be skipped during the script’s
    execution.​ The if command also supports the ability to define what commands should
    run if the condition is not met. This is often read as “if, then, else”. For example,
    you may hear programmers and script writers say, “If the condition is true, then
    do this, else (otherwise) do that.”


    | if [command]then[do this command]else[do that command]fi |


    ​ This type of coding will cause only one of the two branches to execute: either
    the then or the else. This is useful when a programmer needs to allow the program
    to make a choice in which commands to run or what files to operate on based on
    a certain condition.​ It is important to note that in the pseudocode above, multiple
    commands or lines can be added into each branch of the then-else, as needed.While
    the if-then-else works well for conditions and choices with two outcomes, this
    is sometimes limiting. For example, if you create a script that displays four
    choices to the screen as part of a menu option to the user running the script,
    the user then enters a number, 1, 2, 3, or 4, and the script runs a certain command
    based on that number. Using the if-then-else command would require a fairly messy
    decision tree, as shown in this pseudocode:


    | if [$userchoice == 1]then[do command #1]elseif [$userchoice == 2]then[do command
    #2]elseif [$userchoice == 3]then[do command #3]elseif [$userchoice == 4]then[do
    command #4]elseecho “Error – User didn’t enter 1, 2, 3, or 4.”fi |


    While this pseudocode is functional, these nested if-then-else statements are
    rather clumsy and confusing to understand.  Luckily, shell scripting provides
    us with a suitable alternative, known as a case statement, for scenarios where
    there are multiple possible outcomes. Consider the following pseudocode using
    a case statement that performs the same function as the nested if-then-else above:


    | case $userchoice in1)        [do command #1];;2)        [do command #2];;3)
           [do command #3];;4)        [do command #4];;esac |


    Generally, a case statement uses a variable, and each pattern shown before the
    right parenthesis is a possible value of that variable. In the example above,
    we expect the user to input a value of 1, 2, 3, or 4. Each set of commands ends
    with a double semicolon to signify the end of the actions for that specific case.
    This allows multiple commands to be run from within each matching case to the
    value entered by the user in $userchoice. At the end of the case, we use the keyword
    esac, which is case spelled backwards, just like fi was used for if.When using
    a case statement, the variable ($userchoice in the example above) simple finds
    the matching case (for example, 3) and executes that single line until it reaches
    the double semicolon. Once the double semicolon is reached, the script jumps to
    the line after the esac keyword. If no matching case value is found, then none
    of the statements will execute, and the script resumes operation after the esac
    keyword.LoopsSo far, all the scripting components covered will only execute a
    single time. For example, if an if-then-else or case is considered and the test
    case doesn’t match it currently, it will be skipped and never executed. Unfortunately,
    sometimes it is important to do things multiple times or to test a condition multiple
    times to see if the condition has changed. To do this, we use a special structure
    known as a loop.​ A loop allows a script to perform the same task repeatedly until
    a particular condition is met or until a certain condition is no longer true.
    Consider the following loop and try to determine what it will cause when the user
    executes this script.


    | #!/bin/bashfor x in ‘ls *.txt’; docat $xdone |


    ​ In this example, the loop will execute once for every item returned by the command
    ‘ls *.txt’. Therefore, let’s assume there are 3 files in the current directory:
    foo1.txt, foo2.txt, and foo3.txt.​ When this script is executed, the for loop
    will first run ‘ls *.txt’ and receive a list of 3 files that contain the file
    extension of .txt. Since there are three files, this loop will execute 3 times.
    The first time through the loop, the command ‘cat foo1.txt’ is run. This will
    cause the contents of the foo1.txt file to display on the screen. The second time
    through the loop, the command ‘foo2.txt’ will run, and the contents of foo2.txt
    will display on the screen. Then, the loop will run a third time, and this time
    the contents of foo3.txt will display to the screen. Since there are no more .txt
    files in the current directory, the loop will end.​ Instead of using a command
    like ls to set the number of times the loop will run, the programmer can also
    use the seq command. The seq command generates a list of numbers, starting from
    the first argument and continuing up to the last argument. If three arguments
    are given to seq, then it will treat them as the starting value, the increment
    value, and the ending value. Considering the following output:


    | DionTraining:Documents jason$ cat loop.sh#!/bin/bashfor x in ‘seq 1 3 10’; doecho
    $xdoneDionTraining:Documents jason$ ./loop.sh14710DionTraining:Documents jason$
    |


    This output shows the contents of the loop.sh script . This is a bash script,
    as shown by the first line (#!/bin/bash). The loop uses the seq command to create
    the number of times to execute the loop. Each time the loop executes, the number
    (x) is displayed to the screen and then a new line is created. Since the seq command
    has three inputs, the counting will begin at 1, add 3 each time through the loop,
    and end at 10.  The example above shows the output, with 1, 4, 7, and 10 displayed
    to the user’s screen.In addition to the for loop, there is also another type of
    loop called a while loop. A while loop executes the commands within the loop repeatedly
    as long as the condition being tested remains true.


    | #!/bin/bashwhile [test condition]do[commands to execute]Done |


    There is another loop called an until loop. The until loop works like the while
    loop, except the until loop executes continually as long as the condition remains
    false.FunctionsScripts also support the creation of functions within them. These
    functions perform a specific subtask and can be called by name from within other
    portions of the script.Functions are created by placing parentheses after the
    function name, then enclosing the commands that will run as part of the function
    within curly brackets, as shown in the pseudocode below:


    | #!/bin/bashmyfunction() {[commands to execute]} |'
