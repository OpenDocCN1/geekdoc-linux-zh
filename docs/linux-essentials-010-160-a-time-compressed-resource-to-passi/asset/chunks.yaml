    ### 节省费用

    我们的考试券与您在 LPI.com 或 PearsonVue.com 购买的券唯一区别在于价格。由于我们每年购买数千张考试券，因此获得了折扣价格，并将节省的费用让给您。


    ### 快速交付

    我们的考试券会在您购买后 15 分钟内直接发送到您的电子邮箱，而其他公司可能需要 24-48 小时才能交付考试券。


    ### 安排您的考试

    我们的考试券自购买之日起有效期为 9 个月。您可以在全天任何时间段、每周 7 天、每天 24 小时、全年 365 天，在当地的 PearsonVue 测试中心或使用他们的在线远程监考考试（OnVUE）安排您的考试。


    ## 关于作者

    Jason Dion 是 Dion Training Solutions 的首席讲师，曾任马里兰大学大学学院、利伯蒂大学和安妮阿伦尔尔社区学院的大学教授。他拥有许多信息技术专业认证，包括注册信息系统安全专家
    (CISSP)、CompTIA PenTest+、CompTIA 安全分析师+ (CySA+)、网络安全第一响应者 (CFR)、认证伦理黑客 (CEH)、认证网络防御架构师
    (CNDA)、数字法鉴定员 (DFE)、数字媒体采集员 (DMC)、CompTIA Security+、CompTIA Network+、CompTIA A+、ITIL
    ® 管理专业人士、PRINCE2®  Practitioner 以及 PRINCE2 ® 敏捷实践者。Jason 的信息技术和网络经验可追溯到 1992 年，曾担任
    IT 总监、网络运营中心副总监、网络工程师等多个职位。他拥有信息技术科学硕士学位（主修信息）、牧养咨询宗教文学硕士学位以及人力资源管理理学士学位。


