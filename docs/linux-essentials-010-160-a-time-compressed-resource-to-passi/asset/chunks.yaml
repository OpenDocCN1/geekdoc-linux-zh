    will be redirected to standard input. This will allow you to enter new information
    and redirect it to the same command, one line at a time.<> specifies that a file
    will be used for both the standard input and standard output.Now, while some of
    these, like the <> option, may seem like something you would never use, remember
    that Linux treats every device as a file that is mounted somewhere within its
    filesystem. So, an option like <> may be useful when reading or writing to an
    external hard disk, sending or receiving data to/from a sound card, or other such
    cases.As a normal user, you likely won’t use <> very often, but if you go on to
    become a Linux developer then it may become more useful to you at that time.Let’s
    put these concepts into practice using the grep command. For example, if a system
    administrator on the root account wanted to search for data about a particular
    user (Jason) within every configuration file in the /etc directory, they may do
    so quite simply by typing “grep Jason /etc/*”. Running the command without redirection,
    though, the output of the grep search would simply be displayed to the screen
    and not stored for future reference. Also, since our system administrator was
    executing the command as the root user, grep is likely to return a long series
    of outputs to the screen, making it long and difficult to read.Therefore, the
    system administrator should instead employ redirection. To accomplish this, the
    system administrator should use a redirection operator and specify the filename
    where the data will be redirected into and stored. For example, entering “grep
    Jason /etc/* > Jason.txt” would send the output of the grep search to the Jason.txt
    file in the present working directory.Another reason for using redirection is
    to change where the standard error is sent. For example, if the system administrator
    entered “grep Jason /etc/*” as a normal user instead of as a root user, the files
    that contain the username will appear on the screen, but so will a lot of error
    messages. This is because a normal user lacks the permission to read many of the
    files within the /etc directory. By default, the standard errors are also routed
    to the standard output (the screen).To remove all the errors so the system administrator
    won’t have to see them cluttering up the screen, they can be redirected to a special
    device that exists on every Linux system, known as /dev/null. This null device
    is essentially an area where we can send garbage for the operating system to delete.So,
    if the system administrator enters the command “grep Jason /etc/* 2> /dev/null”,
    then the grep command will search for the name Jason in every configuration file
    in the /etc folder, and redirect all of the errors messages to /dev/null so they
    are never displayed on the screen and are simply discarded.Regular ExpressionsWhile
    entering a search term like a username is useful, the real power of grep comes
    from combining it with regular expressions, also known as REGEX. Regular expressions
    are a way to describe patterns that a user might want to look for within a given
    data file or files. Many Linux programs allow for regular expressions and this
    provides the user with the tools for expressing patterns within text. Similar
    in principle to wildcards, regular expressions can specify multiple filenames
    or other text-based content.There are two forms of regular expressions: basic
    and extended. Which regular expression form is assumed will depend upon the program
    that is being executed. Some programs accept just one expression form, while others
    can use both types.The simplest type of regular expression is an alphabetic or
    alphanumeric string, such as HWaddr or Linux. These regular expressions match
    any string of the same size or longer that contains the regular expression. For
    instance, the HWaddr regular expression matches the following three phrases that
    might appear within a file being searched: “HWaddr”, “This is the HWaddr”, and
    “The HWaddr is unknown”. But the true power of regular expressions comes when
    a user inserts special characters that can denote patterns.Bracket expressions
    are commonly used when conducting searches in grep using regular expressions.
    A bracket expression uses the square bracket characters ([ ]) to constitute a
    wildcard search that selects any one of the characters within the bracket. For
    example, the regular expression of b[aeiou]g represents five words: bag, beg,
    big, bog, and bug.A range expression also uses the square brackets, but, instead
    of listing every character within the brackets, it relies on using the starting
    and ending points of the range separated by a dash (-). Generally, using a range
    expression is easier than a normal bracket expression when searching for larger
    sets of data. Ranges can also be applied to alphabetic characters, like [g-t]
    which would represent all the letters g, h, i, j, k, l, m, n, o, p, q, r, s, and
    t. Remember that since Linux is case sensitive, the ranges [a-z] and [A-Z] are
    considered two different sets of ranges.The single dot (.) is a wildcard that
    represents any single character except for the newline character, which is used
    when the return or enter key is pressed on a keyboard. For example, if the user
    entered b.g, that would represent bAg, bag, bBg, bbG, b2g, and so on, where any
    letter, number, or character could be inserted between the b and g since the single
    dot can represent any character.Often when searching for data in a log file or
    configuration file, the user will need to search for where the line starts or
    ends. To denote the line’s start, use the caret (^). To denote the end, us the
    dollar sign ($). For example, if a system administrator wants to find any file
    that contains the phrase and so it begins at the end of a line, they would enter
    “and so it begins$” as the regular expression.Another specification for regular
    expressions is to denote whether to make a full or partial regular expression
    match. If an asterisk (*) is used, it will denote zero or matches. If the asterisk
    is used with a dot (.*), then a substring match is instead made using the regular
    expression.Finally, users must remember to use a backslash to escape any special
    characters in their regular expression search criteria. For example, the dot (.)
    is a special character that normally denotes a single wildcard character. But
    how would a user search for an IP address within the configuration files, since
    IP addresses must contain the dot character? For example, the user cannot simply
    enter 192.168.1.1 as the regular expression, because those dots would be replaced
    with any other single character by the operating system. To overcome this issue,
    we use a process known as escaping. Escaping a special character will bypass its
    normal special function and instead treat it just as its regular text-based equivalent.
    For example, to search for the IP address of 192.168.1.1, you would simply escape
    each dot by placing a backslash in front of it. For example, to search for all
    the IP addresses starting with 192.168.1 and ending in 1, 2, or 3, the user can
    use the regular expression 192\.168\.1\.[1-3] in their search.CHAPTER EIGHTScripting
    Basics![](Image00019.jpg)OBJECTIVES'
