    * 理解如何使用基础文本编辑器

    * 能够创建基础的 shell 脚本

    * 能够创建带有条件和循环的脚本


    正如你所看到的，命令行环境是一个极其强大的工具，但当你能够使用脚本同时自动化许多功能时，它会变得愈发强大。在本章中，你将学习到使用 `bash` 脚本语言创建你自己的脚本的概念。然而，要创建一个脚本，你必须首先学习如何使用文本编辑器创建一个文件，并输入所有的脚本命令和函数。


    ## 文本编辑器


    计算机系统中有很多文件，但最基础且最灵活的是简单的文本文件。事实上，配置文件和 shell 脚本通常只是文本文件。Linux 用户经常会修改配置文件并创建
    shell 脚本。因此，准确了解如何从 shell 内部编辑文本文件是非常必要的。要编辑文本文件，用户必须能够启动编辑器并创建一个新的文本文件或编辑现有文件。


    文本编辑器是一种简单的程序，允许你查看和编辑以纯文本格式存储的文档。文本文件可以包含简单的 ASCII 文本；因此，它们不能包含任何图形、字体、文字强调（如**粗体**、*斜体*或下划线），或其他你可能在像
    Microsoft Word、LibreOffice 甚至 Google Docs 等基于 GUI 的程序中熟悉的高级文字处理功能。文本文件包含多行文本，长度从
    0 个字符到几页不等。这些文本文件还可以存储许多不同的数据类型，但最常见的是包含人类可读的 ASCII 文本。如果用户在查看或编辑自己的文件，可以以标准用户的身份进行。然而，如果用户试图查看或编辑系统配置文件，则必须通过使用
    `su` 或 `sudo` 命令以 `root` 用户身份操作。文本文件中通常包含五种类型的数据，包括人类可读的语言（如英语、西班牙语、法语等）、编程语言（`bash`、`C`、`Python`
    等）、格式化文本、程序或系统配置文件以及日志文件。


    Linux shell 中运行的文本编辑器有很多，但最流行的四个是 `vi`、`emacs`、`pico` 和 `nano`。


    ### vi

    最老且最流行的文本编辑器之一是 `vi`，它是“visual”的缩写`vi` 程序最初是 1976 年为 Unix 操作系统设计的文本编辑器。它在 Linux
    管理员中非常受欢迎，因为他们经常需要编辑配置文件，但它比其他一些现代的文本编辑器稍微难用。


    ### emacs

    Emacs 是一个可扩展、可自定义、自文档且实时显示的编辑器，既可以在 shell 中使用，也可以在 GUI 中使用。`Emacs` 比 `vi` 大且复杂得多，因此在轻量级
    Linux 发行版中默认不会安装。`Emacs` 和 `vi` 一样，也是在 1976 年为 Unix 创建的，它在 Linux 管理员中仍然很受欢迎。


    ### pico

    `Pico` 的设计与 `emacs` 类似，但移除了 `emacs` 中的许多高级功能以创建一个更小的程序和文件。这使得 `pico` 在轻量级 Linux
    发行版中更受欢迎，但它的功能没有那么全。


    ### nano

    有些用户发现 `emacs` 的功能太多（因此体积过大），而 `pico` 的功能不够。`Nano` 的开发是为了填补 `emacs` 和 `pico` 之间的市场空白。`Nano`
    的功能比 `pico` 多，但没有 `emacs` 那么多。这使得 `nano` 的文件大小比 `emacs` 小，并允许它保持小巧轻便，同时保留了 `emacs`
    中最需要的功能。


    提到的每种文本编辑器在屏幕上显示信息、操纵文本等方面都有自己的规范。大多数文本模式编辑器在某些方面是相似的；例如，显示顶部或底部的一或多行通常显示摘要信息或简短的命令提示。参考这些文本编辑器的
    `man` 页面或启动它们并探索菜单以了解更多关于它们的行为。


    启动文本编辑器并对文件进行更改后，不要忘记保存文件或制作备份副本。值得注意的是，由于这些程序没有自动保存功能，最好定期保存更改，以防止因中断导致数据丢失。此外，你应该启动这些程序的每一个，创建一个示例文件，并熟悉每个程序的用法，以确定哪种文本编辑器是你的最爱——个人而言，我一直是
    `pico` 而不是 `vi` 的粉丝。


    | 使用 Vi 和 Nano | 扫描二维码观看此主题的视频 | ![A close up of a sign Description automatically
    generated](img/Image00020.jpg) |


