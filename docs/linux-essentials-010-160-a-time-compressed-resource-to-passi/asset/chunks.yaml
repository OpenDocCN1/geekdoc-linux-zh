    | Connecting to a NetworkScan QR code to watch a video for this topic | ![A close
    up of a sign Description automatically generated](Image00013.jpg) |


    There are two ways to connect to a network in Linux: by using the GUI or by using
    the command line. The easiest way is through the GUI. In Ubuntu Unity, the network
    icon, showing wired and wireless connections if available, is at the top right
    corner of the taskbar. Everything from there will be fairly straightforward. Clicking
    on the network icon will bring up menus that show options to configure both wired
    and wireless connectivity. This figure shows that this machine is


    | connected to both a wired (Wired connection 1) and wireless (aleksz-wfifi) network.There
    are options to disable the wired connection (by clicking on Enable Networking)
    or disable the wireless connection (by clicking on Enable Wireless). Connecting
    to a wireless connection may need the passphrase of the selected SSID. To use
    the command line, open a terminal and issue `ip` commands. Typing `ip address
    show` shows the current `ip` address of the system. There will be several adapters
    that will show up but the first one will always be the localhost or loopback address
    - `127.0.0.1` for ipv4 or `::1` for ipv6. | ![A black and silver text on a screen
    Description automatically generated](Image00025.jpg) |


    The next adapters may show the wired or wireless connection, whichever is present.
    Each adapter section will show information such as the name of the adapter, its
    MAC address, the `ip` address assigned to it, etc. When troubleshooting a local
    network issue, `ip` addresses wouldn''t be of much concern. All you would need
    to see are the links in layer 2, the MAC addresses. To do that, type `ip link
    show`. The `ip link` specifically focuses on layer 2, switching, as opposed to
    `ip address`, which shows layer 3, routing. To turn off an adapter (just like
    when disabling Networking from the network icon on the desktop), type `sudo ip
    link set adapter-name down`. Replace `adapter-name` with the adapter name to be
    switched off from the `ip address show` command. Typing `ip address show` again
    after turning the adapter off will show its state as `DOWN` and that there are
    no layer 3 routing information or `ip` addresses assigned to it. To turn it back
    on, simply type `sudo ip link adapter up`. To manually assign an `ip` address
    to a network adapter, type `sudo ip addr add ip-address dev adapter-name`. Replace
    `ip-address` with the `ip` address and subnet mask to be assigned to the adapter
    and replace `adapter-name` with the name of the adapter. Conversely, to remove
    that assigned `ip`, type `sudo ip addr delete ip-address dev adapter-name`. More
    information about the `ip` command can be found in its man pages.


