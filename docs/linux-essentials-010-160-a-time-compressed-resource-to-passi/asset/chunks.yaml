    `kernel` 将来自高层软件（如应用程序）的命令翻译成硬件可以理解并执行的内容。`kernel` 负责为各种软件和工具对硬件资源进行智能管理，包括内存管理。


    `kernel` 并不是需要图形界面的软件，而是在后台运行的。这种特殊软件消耗的资源最少，我们可以通过嵌入工具直接通过命令行访问它。为了在命令行上执行某些任务，用户需要熟悉基于文本的命令、这些命令的功能，以及运行这些命令所需的语法或规则。


    事实上，通过使用命令行环境，你可以在系统上执行几乎任何你想的操作，包括浏览网页、检查电子邮件、播放音乐、在硬盘目录间移动等。遗憾的是，大多数用户发现命令行并不很好用，因此操作系统演变成了更符合用户习惯的图形用户界面（`GUI`）环境。在
    Windows 和 macOS 中，例如，你可能永远不会直接访问命令行或 `kernel`，而是使用 `GUI` 来执行你想要的操作。这个 `GUI` 将你的一系列鼠标点击和键盘输入翻译成你相应的命令行操作。基本上，在
    Windows 和 macOS 中，只有系统管理员、程序员和开发者需要访问命令行。


    而在 Linux 中，使用命令行执行操作通常要更快、更方便。由于这个原因，我们将花费整个章节来学习如何正确地使用命令行。在本章中，我们将重点关注 Linux
    的各种图形用户界面。


    ## 桌面环境


    桌面环境是大多数用户操作发生的地方。图形用户界面（`GUI`）包含文件管理器、所有可用应用程序的快捷方式、执行常用任务的各种菜单，并作为进入操作系统及其功能的窗口。你的桌面环境作为你的工作台，所有的工具都触手可及。


    虽然 Windows 和 Mac 各自拥有不可分割的桌面环境，但 Linux 使用了模块化的桌面环境方法。事实上，Linux 官方支持十多种不同的桌面环境。这些环境可以根据用户的喜好或发行版本身进行混合和匹配。


    许多 Linux 发行版带有几种不同的桌面环境。如前所述，`Ubuntu` 有八个不同的版本，其中包含了多种桌面环境。默认情况下，`Ubuntu` 带有 `Unity
    Desktop`，它具有吸引直观的工作流。除了这个默认选项，`Ubuntu` 还有其他“口味”（不同版本），每个都配有独特的桌面环境。`kubuntu` 版本依赖于于
    KDE Plasma` 桌面环境，它流畅且高度可定制。`Xubuntu` 版本则使用轻量级的 `Xfce` 桌面环境，它非常强大，可以在只有 1 GB 内存和
    700 MHz 处理器的旧电脑上运行。


    ## 程序和软件


    在安装了 Linux 变和桌面环境后，用户就可以运行各种程序和软件来提高生产力。就像 Windows 和 macOS 一样，有许多可用的程序。由于 Linux
    是开源的，许多 Linux 的软件也是开源的，因此免费下载和使用。


    如果你是 Windows 或 macOS 用户，可能熟悉用于办公的 Microsoft Office 套件，它包括文字处理（`Word`）、表格（`Excel`）、演示（`PowerPoint`）和数据库（`Access`）工具。由于
    Linux 上没有 Microsoft Office，大多数 Linux 用户依赖 LibreOffice 来完成这些功能。`LibreOffice` 是一个功能丰富的工具集，包含了文字处理（`Writer`）、表格（`Calc`）、演示（`Impress`）、数据库（`Base`）以及许多其他。`LibreOffice`
    套件完全兼容 Microsoft，允许它可以读取和写入 `.doc`、`.docx`、`.xls`、`.xlsx`、`.ppt`、`.pptx` 等常用办公格式。此外，LibreOffice
    还支持自己的原生格式 Open Document Format（`ODF`）。`LibreOffice` 也是跨平台的，适用于 Linux、Windows
    和 macOS。要了解更多关于 `LibreOffice` 的信息或尝试它，请访问 https://www.libreoffice.org。


    如果你想在 Linux 工作站上观看视频或播放音乐，可以通过下载 VLC 来安装最好的媒体播放器之一。VLC 媒体播放器可以播放你丢给它的任何媒体文件，包括损坏的、不完整的或甚至是未完成的文件。VLC
    是一种真正的多媒体解决方案，适用于每个主流操作系统，包括 Linux、Windows、Android 和 iOS。在过去的 15 年里，我一直将 VLC 作为我电脑上的媒体播放器，它从未让我失望。如果你在寻找
    Windows Media Player 或 QuickTime 播放器的优秀替代品，应该前往 https://www.videolan.org。


    如果你想浏览互联网，你需要一个浏览器。虽然 Linux 不支持像微软 `Edge` 或苹果 `Safari` 这样的专有浏览器，但它支持几种跨平台浏览器，包括
    `Mozilla Firefox`、`Google Chrome` 和 `Opera` 浏览器。虽然这些都是免费使用的，Linux 也适合编辑照片、视频或音频。如果你需要修饰、编辑、绘制、在图像格式间转换或执行特殊任务，GIMP（GNU
    Image Manipulation Program）是一个很好的选择。无论你是图形设计师、摄影师还是插画师，GIMP 都为你提供完成工作的复杂工具。GIMP
    是一个开源的位图编辑器，运行起来像 Adobe Photoshop，但没有昂贵的标签。虽然 Adobe Photoshop 仅适用于 Windows 和 macOS，但
    GIMP 是适用于 Linux、Windows 和 macOS 的跨平台软件。GIMP 自 1995 年以来一直在改进。要了解更多关于 GIMP 的信息或尝试它，请访问
    https://www.gimp.org。


    如果你喜欢编辑视频，Linux 有一种名为 Shotcut 的优秀非线性视频编辑软件。该程序使用多轨道时间线进行视频编辑，类似于 Adobe Premiere
    或苹果的 Final Cut。事实上，Shotcut 非常强大，甚至可以支持 4K 视频。和大多数 Linux 软件一样，Shotcut 是一个开源应用程序。Shotcut
    还是跨平台工具，可以安装在 Linux、FreeBSD、Windows 和 macOS 上。你可以在 https://www.shotcut.org 了解更多关于
    Shotcut 的信息。


    如果你梦想有一天成为摇滚明星，你可能会发现需要为你的 CD 编辑一些音频。开玩笑之，Linux 也有相应的工具。Audacity 是一个开源的数字音频编辑器，适用于
    Linux、Windows 和 macOS。该程序允许用户从多个源录制音频并对所有类型的音频格式进行后处理。无论你是想混音整张专辑还是想开始做播客，Audacity
    都能处理。Audacity 可以比拟 Adobe Audition 或许多录音行业专业人士使用的苹果 Logic Pro 软件。你可以在 https://www.audacity.com
    找到更多关于 Audacity 的信息。


    ## 软件包管理


    当我们安装 Linux 发行版时，它通常会带有许多预装应用程序，以便用户可以立即工作。这可能包括办公生产力套件、媒体播放器和网络浏览器。除了这些预装应用程序，Linux
    发行版还可以访问包含大量易安装应用程序的软件包仓库。这些被称为软件包（packages）。


    软件包是一个压缩文件归包，包含了特定应用程序的所有文件。软件包中的文件通常根据发行版内的相对路径进行存储。大多数软件包还包含特定于发行版的安装指令，以及任何作为安装前提的其他软件包列表。在
    Linux 术语中，这些前提被称为依赖项（dependencies）。简单来说，依赖项是一个广义的软件工程术语，指的是另一个软件在安装时所依赖的一部分软件。例如，VLC
    媒体播放器有许多我们需要先安装的依赖项，例如各种视频解码器，以允许在媒体播放器中播放。


    Linux 软件包利用三种常见文件类型：`.deb`、`.rpm` 和 `.tgz`。软件包的文件扩展名通常指示该软件是为哪种 Linux 发行版编译的。例如，`.deb`
    软件包包含了为 Debian 及其他 Debian 派生版编译并打包的软件，如 Ubuntu、Kali Linux 和 Tails。`.rpm` 软件包格式最初为
    Red Hat 开发，但也用于其他发行版，如 Fedora 和 openSUSE。tarball 或 `.tgz` 软件包格式有时被称为通用格式。这是因为
    tarball 只是将多个文件和目录并使用 gzip 压缩软件进行压缩，为用户下载和安装时节省带宽。

