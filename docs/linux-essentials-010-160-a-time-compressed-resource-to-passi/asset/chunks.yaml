- fmt: '

    The command line environment is an extremely powerful tool. As previously discussed,
    wildcards can substitute for a single character, multiple characters from a provided
    subset, or any character for part of a file name. This same concept can also search
    for data within a file or files, as.


    In this chapter, you will learn how to search for and extract data within various
    files and commands using redirection and wildcards. But first, it is imperative
    that you understand how to link multiple commands together using the concepts
    of command redirect and input/output redirection.


    ## Command Redirection

    Command redirection allows a user to reroute the standard input to a second program
    or command. This is performed using a pipeline or command line pipe. A pipe is
    created by using a vertical bar (`|`) between the two commands. This key is usually
    found above the Enter key on the keyboard and accessed by pressing the Shift key
    down while pressing the backslash key.


    Pipelines can be useful when applied in various ways. For example, the lengthy
    output of the `cat` command (which displays the contents of a file to the screen)
    can be piped together with the `less` command to show only one page of content
    at a time. This avoids jumping to the last page of the file and not seeing the
    content in the rest of the file. The `more` command can also display one page
    of content at a time when combined with `cat`, but it operates a bit differently
    than the `less` command. To learn more about `cat`, `less`, and `more` commands,
    please consult their dedicated man pages.


    By using pipes, a user can perform two or more commands in sequence and run them
    consecutively. This allows for quick execution of commands and complex tasks,
    resulting in less pauses in execution as well, since the system won’t have to
    wait for the user to input the next command.


    The `grep` command is commonly used in pipelines to search for keywords within
    the output of a given command. This command searches for files that contain a
    specified string and returns the name of the file and, if it is a text file, the
    line containing that string. The `grep` command can also search within a specified
    file for a specific string. To use `grep`, a user simply types the command’s name,
    `grep`, an optional set of switches and parameters, a regular expression, and
    an optional filename if desired.


    If you are planning to enter the world of system administration or cybersecurity,
    you will need to get comfortable using the `grep` command. This command is a security
    operation center analyst’s best friend for finding information from across different
    log files contained in a Security Information and Event Management server. In-depth
    usage of the `grep` tool is beyond the scope of this book, but to learn more about
    the command please consult its detailed man pages for the complete list of options
    it supports.


    ## Input/Output Redirection

    In addition to redirecting the output of one command into another by using the
    pipe, a user can also redirect the input/output of a command to other locations.
    For example, if you need to save a program’s output for future reference, you
    can redirect that output to a file. Similarly, the input to a command can be redirected
    from a file, instead of requiring the user to enter it by using the keyboard.


    Although input redirection may sound strange, some programs rely on this feature
    to enable them to process data. For instance, raw text files fed through a program
    search the text for specified patterns. In addition to redirecting output to files
    or input from files, a program’s output can be passed to another program as an
    input through the process of piping, as covered earlier in this chapter. In addition
    to all of this, there is a related technique that involves the `xargs` command,
    which enables a user to generate command line options from files or another programs’
    output.


    A Linux system has two type of output that are supported by default: standard
    output and standard error. The standard output is used for normal program messages.
    For example, when you run the `ls` command, the output is sent to the standard
    output and, therefore, displayed on your screen. The standard error, on the other
    hand, outputs error messages. By default, this also displays on the screen, but
    users can redirect these messages if desired.


    There are several redirection operators available to more fully control where
    information is output to, displayed to, and/or saved to:


    - `>` creates a new file containing the standard output. If the specified file
    already exists, it will be overwritten. For example, if the command `ls > contents.txt`
    is executed, the output of the `ls` command will be saved to the `contents.txt`
    file and nothing would be displayed to the screen.

    - `>>` appends the standard output to an existing file. Just like the command
    above, we could redirect the output of the `ls` command to the file `contents.txt`,
    but instead of overwriting the file, we would simply add our output to the end
    of the current file.

    - `2>` creates a new file that will have the standard error redirected to the
    file. If the file already exits, its contents will be overwritten.

    - `2>>` appends the standard error to an existing file. If the file doesn’t already
    exist, a new one is created. If it does exist, the standard error output will
    simply be added to the end of the file.

    - `&>` creates a new file that contains both the standard output and standard
    error output. If the file already exists, its contents will be overwritten.


    There are also several redirection operators available to more fully control where
    information is input from in the shell:


    - `<` sends the contents of the specified file to the command in place of the
    standard input. For example, if I had a text file called `input.txt` that contained
    a single line of text that said `b??l` and entered the command `ls < input.txt`,
    the output would be equivalent to entering `ls b??l` at the command prompt.

    - `<<` enters a sort of interactive mode, where the following lines entered will
    be redirected to standard input. This will allow you to enter new information
    and redirect it to the same command, one line at a time.

    - `<>` specifies that a file will be used for both the standard input and standard
    output.


    Now, while some of these, like the `<>` option, may seem like something you would
    never use, remember that Linux treats every device as a file that is mounted somewhere
    within its filesystem. So, an option like `<>` may be useful when reading or writing
    to an external hard disk, sending or receiving data to/from a sound card, or other
    such cases.


    As a normal user, you likely won’t use `<>` very often, but if you go on to become
    a Linux developer then it may become more useful to you at that time. Let’s put
    these concepts into practice using the `grep` command. For example, if a system
    administrator on the root account wanted to search for data about a particular
    user (Jason) within every configuration file in the `/etc` directory, they may
    do so quite simply by typing `grep Jason /etc/*`. Running the command without
    redirection, though, the output of the `grep` search would simply be displayed
    to the screen and not stored for future reference. Also, since our system administrator
    was executing the command as the root user, `grep` is likely to return a long
    series of outputs to the screen, making it long and difficult to read.


    Therefore, the system administrator should instead employ redirection. To accomplish
    this, the system administrator should use a redirection operator and specify the
    filename where the output should be saved. For example, `grep Jason /etc/* > results.txt`.
    (Note: The text provided ends abruptly at "the filename where", but the logic
    follows standard redirection).

    '
