  trans: '


    Linux 的伟大之处之一是它内置了对不同编程语言的支持。以下是其中一些语言以及我们用来编写、读取和执行它们的工具。


    ### 编程语言


    JavaScript 仅仅是一个以 `.js` 为扩展名的文本文件。我们可以将其嵌入 HTML 中，也可以它可以作为一个独立的文件。它可以简单到只是在浏览器中打开时显示“Hello
    World”的脚本，也可以具有更复杂的功能，例如创建一个列表。


    Python 是一种非常出色的脚本和解释型语言。编写 `python` 代码有两种方式：在解释环境中，或者从文本文件内部编写。对于解释环境，打开终端并输入
    `python3`（这里的 3 是因为它是 `Python` 的最新版本）。这将弹出一个可以接受直接命令的提示符。输入 `print("Hello, World")`
    将在命令行行下方直接返回文本 Hello, World。我们可以通过创建一个文本文件，输入完全相同的命令，并将该文件保存为 `.py` 扩展名来实现。回到终端，输入
    `python3`，加一个空格，然后追加已保存的文本文件的文件名；它将显示相同的结果。


    PHP 最初代表 Personal Home Page（个人主页），但现在代表递归缩写 `PHP: Hypertext Preprocessor`（超文本预处理器）。由于服务器大量使用它，Linux
    也是如此，因为它是一个主要用于网络服务器的操作系统。它与 JavaScript 一样，与 HTML 文件配合。因此，由 `.php` 标识的 `PHP` 文件可以直接在浏览器中运行。


    另一种编程语言 Java 是一种非常棒的语言，因为它也适用于许多不同的操作系统，包括 Windows 和 Linux。对于大多数运行 Android 系统的智能手机用户来说，这并不令人意外，因为他们手机上所有的应用程序都是用
    Java 编写的。Java 是一种编译语言。查看 `.java` 文件，其中的对象只是文本，除非将其转换为可执行的二进制文件，否则计算机将无法理解。因此，终端首先通过执行
    `javac` 命令后跟带有 `.java` 扩展的文件名来编译 `.java` 文件。一旦编译完成，通过输入 `java` 以及 `.java` 文件中的对象名称来运行该对象。Java
    比 JavaScript、`Python` 或 `PHP` 稍微复杂一点，但它非常强大，因为我们仅使用这种语言就可以编写完整的程序。


    CSS 也称为“样式表”，用于 HTML 页面；它们描述了内容以及内容在页面内的显示方式。一个典型的 `.css` 文件包含页面属性，例如页面主体应该像什么样、背景应该是什么颜色、字体的类型和大小、页边距等。修改样式表可以轻松地改变网页的外观和感受，这比返回并修改整个
    HTML 文档要简单。


    C++ 是一种像 Java 一样的编译语言，一种低级编程语言。它稍微复杂一点，需要在执行之前将其编译成二进制文件；但它非常强大，因为大多数知名软件如 Adobe
    应用、Google 应用，甚至 MS Office 和旧版本的 Windows 都是用 C++ 编写的。


    一种新的面向对象编程语言是 Go。像 Java 和 `C++` 一样，它也需要编译。Go 专门设计为用于大型分布式系统和高扩展网络服务器的系统编程语言。由于
    Go 的编译速度比 `C++` 快，且比 Java 更容易维护，它在 Google 的软件栈中取代了它们。


    C 是一种从 `C++` 演变而来的低级编程语言。事实上，最初用 C 编写的“hello, world”示例已成为大多数编程教科书中编写入门程序的模型。该程序将“hello,
    world”打印到标准输出（通常是终端或屏幕显示）。


    除了 C 和 `C++`，该家族的另一个成员是 C#。它是一种通用的多范式编程语言。它被用于如 `MonoDevelop` 等开发环境内部。


    Ruby 是一种流行的网页开发编程语言。Ruby 文件以 `.rb` 文件名扩展名标识。Ruby 类似于 Python，因为它可以在解释环境中运行，也可以从文本文件内部运行。


    Linux 用户可以使用许多其他开发语言和编程工具。这里提到的只是比较流行的。选择使用哪种取决于用户对该语言的了解以及该语言与用途的匹配程度。


    ### 软件包管理与仓库


    在 Linux 驱动的计算机上安装软件有很多方法。最常见的方法是使用包管理器和软件仓库。由于 Linux 发行版非常多，因此也有许多包管理器。每个 Linux
    发行版都会根据其所需的库版本和编译选项编译自己的软件。Linux 通常不会在每个发行版上运行，而是需要针对特定的发行版进行编译。即使有通用的 Linux 二进制文件，其安装也会受到各种竞争性的包格式及其在发行版中可用性的的阻碍。


    因此，如果你找到了某个 Linux 应用的网站，你可能会看到根据你正在使用的发行版提供的各种不同包格式的下载链接。如果你想要安装的应用程序作者尚未为你的发行版创建包，那么你可能需要下载该应用程序的源代码并手动为该应用程序编译二进制文件。


    与 Windows 用户不同，由于上述挑战，大多数 Linux 用户通常不会从应用程序网站下载并安装程序。相反，每个 Linux 发行版通常都会托管自己的软件仓库。这些仓库包含了为特定
    Linux 发行版和版本编译的软件包。例如，如果你在使用 Ubuntu 18.04，你将使用的仓库将包含专门为 Ubuntu 18.04 编译的包，而不是
    16.10 或 19.04 等其他版本。


    这些包管理器会自动从配置的软件仓库下载相应的软件包，安装它并自动为终端用户设置。这与在 Windows 或 macOS 中安装软件不同，在后者中你必须点击向导或在网站上查找可执行文件。当更新发布时，包管理器会注意到它的可用性，下载相应的更新并为你安装。


    在 Windows 和 macOS 上，每个应用程序都有自己的软件更新程序来接收自动更新，但在 Linux 中，包管理器处理从软件仓库安装的每个软件的更新。


    如果你是 Windows 用户，你可能习惯于看到 `.exe` 或 `.msi` 文件作为应用程序的安装文件。如果你是 macOS 用户，你可能习惯于下载
    `.dmg` 或 `.app` 文件作为安装程序。但 Linux 使用几种包格式作为其安装程序。


    软件包本质上是包含文件列表的归包。包管理器打开归包并将文件安装到包内指定的指定。包管理器负责维护哪些文件属于哪些包的记录。包管理器还必须感知它们的版本及其最新状态。这些包文件还可以包含在安装和删除包时运行的脚本。


    三种流行的包文件格式是 `.deb`、`.rpm` 和 `.tar` 文件。


    - `.deb` 用于 Debian Linux 和基于 Debian 的发行版，如 Ubuntu、Kali Linux 和 Tails。

    - `.rpm` 用于红 Hat 软件包管理器和基于 RPM 的发行版，如 Fedora、openSUSE 和 CentOS。

    - `.tar`（也称为 `.tgz` 或 `.tar.gz`）被用作一种通用包格式，用于 ArchLinux 和 Slackware 等发行版；`.tar`
    是未压缩的归包，而 `.tar.gz` 是压缩的归包。


    '
- fmt: '

    While Linux distributions ship with their own repositories pre-configured, you
    can also add other repositories to the system. You can then install software packages
    from that repository and receive any additional updates for them automatically.


    For example, Ubuntu and some other Debian-based distributions offer a wide variety
    of personal package archives (PPAs), which contain software compiled by individuals
    and teams. These PPA repositories often get updates and beta versions of software
