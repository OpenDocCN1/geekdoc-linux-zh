  trans: '


    在本书中，你将获得一门速成课程，它将介绍你通过 LPI Linux Essentials® 认证考试所需的所有知识。本书仅涵盖核心要点，没有任何废话、填充内容或额外材料，因此你可以快速学习这些材料并轻松攻克认证考试。


    LPI Linux Essentials® 考试是 Linux 专业协会（Linux Professional Institute）认证路径中的首个认证考试。该认证旨在测试你使用基础命令行编辑器的能力，并证明对
    Linux 操作系统进程、程序和组件的理解。本书假设你之前没有过 Linux 操作系统的经验，并将教你为了在第一次尝试时参加并通过 Linux Essentials®
    认证考试所需的确切知识。


    现在，这本书**并不会**教你日常工作中高效或有效利用 Linux 所需的所有知识。毕竟，LPI Linux Essentials® 认证的设计旨在向你介绍
    Linux 操作系统及其各种概念。如果你想成为 Linux 专家，那么这本书和 LPI Linux Essentials® 认证是一个很好的起点，但请记住，它们都是为入门水平编写的。一旦你完成了学习，我建议继续进阶到
    `LPIC-1 (System Administration)` 认证及其相关的视频课程和教材，以进一步提升你的技能。本文的唯一关注点是让你通过认证考试，而不是让你成为
    Linux 操作系统、其系统管理或 Linux 工程方面的专家。由于本教材的设计性，我们将以非常快的速度学习材料。如果你读完整本书，并完成了文末的模拟考试（得分至少达到
    85% 或更高），你就准备好在第一次尝试时参加并通过 LPI Linux Essentials® 认证考试了！


    ## 考试基础

    Linux Essentials® 认证考试是针对希望了解 Linux 操作系统、其用法和运行的信息技术人员的入门级认证。这项入门认证涵盖了 Linux 操作系统的总体概览：如何安装它、如何配置它，以及如何在图形用户界面
    (`GUI`) 和命令行界面 (`CLI`) 中运行其中的程序。


    LPI Linux Essentials® 认证的目标受众是需要以下内容的人员：


    * 理解 Linux 和开源行业

    * 理解 Linux 工作的主要组件

    * 具备命令行的基本知识

    * 对 Linux 中的网络和安全有基本了解


    考试由 40 道单选题组成，必须在 60 分钟内完成。在 200-800 分的分值范围内，至少需要获得 500 分才能通过认证考试，这相当于约 70% 或更高的分数。考试是闭卷考试，考试期间不允许携带任何笔记或学习材料。在本书出版时，目前的考试费用为
    120 美元，你可以在全球任何一个 PearsonVue 考试中心或通过 `OnVue` 服务在线参加考试。


    Dion Training Solutions (`www.diontraining.com`) 是 Linux Essentials® 认证考试的 LPI
    认可培训伙伴。如需以我们读者提供的特惠折扣价购买考试券，请访问 `diontraining.com/vouchers`。


    ## 考试技巧与窍门

    在我们深入 LPI Linux Essentials® 认证考试的内容之前，让你了解一些考试技巧和窍门是非常重要的。这有助于帮助你在阅读本书其余部分时，准确掌握如何为考试做准备，并帮助你集中精力从这些材料中获得最大的收益。


    参加 LPI Linux Essentials® 认证考试时最重要的一点是，考试当天没有陷阱题。每道题的措辞经过精确设计，与你所学的材料。你应该多次阅读每道题，以确保你完全理解它的要求，并确保你回答的是所提的问题。每当你在答案中看到
    `ALWAYS`（始终）或 `NEVER`（从不）这类词时，请仔细考虑是否选择。在生活的大多数情况下，很少有某种情况对特定情况`始终`或`从不`适用！


    在阅读问题和答案时，要留意干扰项或红�鱼。通常，在可能的答案选项中至少会有一个这类选项，试图分散你对正确答案的注意力。


    如果你看到问题的某部分使用了粗体、斜体或全大写字母，你应该密切关注这些单词，因为命题者认为这些关键词对于选择正确答案至关重要。


    记住学习中涵盖了 Linux 和开源环境中的哪些概念非常重要，因为你在考试当天会再次看到这些问题。你不应该在考试中看到你学习考试时使用的教材或视频课程未涵盖的内容。我们将在整书中涵盖所有这些概念，因为它们是
    Linux Essentials® 课程和认证考试的基石。此外，如果问题问及某个特定的 `command`（命令），请确保你不要选择包含概念或过程的答案。务必小心回答所问的问题。


    还要记住，你必须根据你的 Linux 知识和本教材的学习内容回答问题，而不是根据你个人的工作场所经验。你的工作场所可能会根据其情况和用例以不同的方式实施 Linux
    及其概念。如果有疑问，在回答认证考试问题时应始终选择书上的答案。


    在考试当天，你应该选择 `BEST`（最佳）答案。每道题可能有多个正确答案，但总有一个是最正确的答案。如果有疑问，选择那个在尽可能情况下都是正确的答案！


    在考试当天，你不需要逐字背诵本课程中的 LPI Linux Essentials ® 术语，但你必须能够从给出的选项中识别它们。在认证考试期间，你将从选题中选择答案，而不是填空或问答题。这是认证测试与你可能在高中或大学参加过的测试之间的本质区别。在认证领域，你只需要能够识别信息，而不是背诵信息。


    ## 第二章 Linux 的演变

    ![](img/Image00004.jpg)


    ### 目标

    * 理解开源哲学

    * 描述各种 Linux 发行版及其生命周期

    * 理解 Linux 在嵌入式系统中的应用

    * 理解 Linux 的基本硬件要求

    * 描述 Linux 与与其他操作系统的差异


