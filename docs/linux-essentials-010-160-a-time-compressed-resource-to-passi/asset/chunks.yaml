    当在计算机上使用 Linux 时，它可能由设备制造商预装好，或者你可能需要手动安装。要手动安装 Linux 发行版，安装程序是必不可少的。它通常可以在发行版的网站上下载。例如，要安装
    Ubuntu，请打开网络浏览器并访问 `ubuntu.com`。安装程序位于下载区域下。可能会存在多个不同版本的安装程序，下载哪一个取决于系统要求和用户需求。例如，将会有取决于硬件能力的
    32 位和 64 位版本，可能还会有长期支持（LTS）版本和非长期支持版本。文件大小也将取决于安装程序的版本。


    安装程序通常为 `ISO` 文件格式。它是 CD 或 DVD 的磁盘映像。有几种方法可以管理这种格式的文件，传统方法是将磁盘映像“刻录”到 CD 或 DVD
    上。对于 Ubuntu `ISO` 文件，Windows 7、8 和 10 用户只需要下载好的 Ubuntu `ISO` 文件、一张空白 DVD 以及一台带有
    DVD 刻录机的电脑。右键点击 `ISO` 文件将显示右键菜单选项，其中包含“刻录光盘映像（Burn disc image）”。点击它会弹出 Windows
    光盘映像刻录对话框，我们可以在其中选择刻录机、插入空白 DVD、点击刻录按钮并开始过程。较旧版本的 Windows（如 Windows XP 和 Vista）可能需要第三方软件（如
    `Infra Recorder`）来管理 `ISO` 磁盘映像文件的刻录。Mac 用户也会经历类似的过程，Ubuntu 网站提供了针对 Windows 和
    Mac 映像刻录的教程。


    对于可以从 USB 闪存启动的较新系统，管理 `ISO` 文件的另一种方法是创建一个可启动 USB 闪盘。光驱正逐渐成为过去，因为它们容易受到物理损坏。可启动
    USB 安装程序现在是安装 Windows 和 Linux 等操作系统的首选方法。创建 Ubuntu 可启动 USB 盘也有优势；例如，它允许我们在不接触主机计算机配置的情况下测试
    Ubuntu。我们还可以随身携带此 USB 盘，并它在其他电脑（如朋友的电脑或网吧）上启动 Ubuntu。


    创建 Ubuntu 可启动 USB 盘仍然需要 `ISO` 文件，但不需要经过磁盘刻录过程，我们需要第三方软件，例如 `Rufus`（这是一款用于创建可启动
    USB 盘的开源软件）。一个性能足够的 USB 闪存也是必须的。对于较新版本的 Ubuntu，我们需要一个 4GB 或更大的 USB 盘或闪存器。它应该是空的，因为它可能需要重新格式化，这会破坏现有文件。过程非常简单，并且有易于遵循的提示。它还会下载额外的文件，因此我们需要网络连接。会出现一个询问写入模式的提示，此时建议选择
    `ISO 模式`。过程完成可能需要一些时间，一旦完成，USB 盘现在就是可启动的了，我们可以使用它在能够通过 USB 启动的机器上安装 Ubuntu。


    在通过接管整个系统或与现有操作系统并排启动来实际实际安装之前，我们可以在虚拟机上测试 Ubuntu，虚拟机就像运行在你的电脑内部的另一台电脑。一种流行的虚拟机软件是
    `VirtualBox`。就像从 Ubuntu 网站下载 Ubuntu `ISO` 文件一样，我们可以从其网站 `virtualbox.org` 下载 `VirtualBox`。下载与安装
    `VirtualBox` 的操作系统相匹配的版本。运行 `VirtualBox` 安装程序应该是很直接的，因为它推荐了默认安装设置。通过设置名称、设置虚拟内存（`RAM`）值以及创建虚拟硬盘（`HDD`）来创建一个新的虚拟机。然后我们可以将下载的
    Ubuntu `ISO` 映像加载为虚拟光驱，虚拟机可以从中启动。启动这台虚拟机就像开启物理电脑一样，它将从加载的 Ubuntu `ISO` 文件启动，就像插入了
    DVD 驱动器的 DVD 一样。


    Ubuntu 安装程序从语言选择开始，并提供两个选项：尝试（try）或安装（install）。选择“尝试”将 Ubuntu 作为现场操作系统加载，临时运行且就像已安装好的一样，但它不会保留在系统中，特别是当电脑关闭或重启时。选择“安装”选项将把
    Ubuntu 安装到系统中，无论是在物理机还是虚拟机上。安装过程中的下一个提示是键盘布局选择。之后，安装程序会提供普通安装或最小化安装的选项。普通安装包含所有预装软件，而最小化安装包含的较少。还有在安装
    Ubuntu 时下载更新的选项，我们可以选择是否也下载某些第三方软件（其中一些是专有软件）。下一步提供了选项，要么允许系统专门用于 Ubuntu，要么设置
    `HDD` 分区，以便我们能够与其他操作系统并排启动 Ubuntu。后后一种选项也称为多系统启动系统。安装多系统启动系统更为复杂，网上有大量的资源，特别是来自
    Ubuntu 网站和在线社区的资源。过程中的下一个主要步骤是提供用户凭据：用户的、计算机的、用户名和密码。在提供用户凭据并选择用户是否自动登录后，系统安装开始了。


    Ubuntu 的首次启动屏幕显示“Ubuntu 的新特性（What''s new in Ubuntu）”对话框，这就像是对操作系统某些功能的导览。首次启动的下一个部分显示
    `Livepatch`，我们可以在此处创建 Ubuntu 单点登录账户。下一个部分询问用户是否想向 Ubuntu 发送信息，以更好地帮助他们开发操作系统。在完成首次启动屏幕的章节后，如果检测到系统软件或应用程序有更新，`软件更新器`可能会运行。


    ### 操作系统的差异


    目前有数百种操作系统。这些从常用的到针对特定系统开发的都有。大多数读者熟悉世界上最流行的操作系统：Windows 和 macOS。


