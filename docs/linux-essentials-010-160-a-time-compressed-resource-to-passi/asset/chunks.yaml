  trans: '


    Linux 中有很多基于文本的编辑器，当我们需要编辑配置文件或只是快速访问文件进行某些更改时，这些编辑器非常有帮助。


    ### Vi

    要运行 `vi`，请输入 `vi` 加上要创建的文件名。例如，要创建文件 `test1`，请输入 `vi test1`。除非该文件已存在，否则该文件将为空白。输入命令并按回车键后，屏幕左侧将排列波浪号（`~`）。这表示这些行没有任何内容。此打开的文件也处于编辑模式。


    要开始输入，按下键盘上的 `i` 键进入插入模式并开始输入字符。按回车键会将光标移动到下一行。然而，要返回上一行或文件中的任何其他字符，箭头键不起作用；按下退出键（`ESC`）可以返回编辑模式，允许使用上下方向键进行移动。按下
    `x` 键可以删除字符，再次按下 `i` 键允许我们插入或输入字符。


    有一些实用的快捷键可以更方便地在编辑模式下操作 `vi`：

    - 插入符号 `^` 将光标带到行首。

    - 输入数字和 `w`，例如 `3w`，会将光标向前移动三个单词；输入数字和 `b`，例如 `2b`，会将光标向后移动两个单词。

    - 要跳过行，输入数字和大写字母 `G`；例如，`50G` 将光标带到文件的第 50 行。

    - 按下 `:` 键然后输入 `set nu` 将波浪号替换为行号，以便更容易识别行。

    - 若要撤销上一个操作，输入 `u` 即可撤销。

    - 要保存文件，按下 `:` 然后输入 `w` 将信息保存到文件中，或输入 `wq` 保存并退出。

    - 在该提示符下输入 `q!` 将丢弃任何编辑并退出 `vi`。


    `vi` 的帮助页面（man pages）将显示更多如何正确使用它的命令。


    ### Nano

    运行 `nano` 与 `vi` 相同；输入 `nano` 和文件名将调出编辑器并打开文件。一旦 `nano` 出现，它看起来更像一个命令行程序。它显示的信息比
    `vi` 多。例如，程序名称和版本位于左上角。文件名位于顶部正中央。如果文件不是空白，还会显示文件内容。底部是一些命令。


    以插入符号（`^`）开头的命令，例如 `^G`，通过按下 `CTRL` 键然后点击 `G` 来输入，这会调出帮助文档，类似于 man 文件。与 `vi` 相比，`nano`
    默认已处于编辑模式。箭头键有效，你可以像使用文字处理器一样插入和删除字符。同样，文本可以复制和粘贴。它还有拼写检查器以及撤销和重做功能。通过按下 `^O`
    保存文件更改，`^X` 退出程序。凭借这些功能，`nano` 具有更多功能且比 `vi` 更方便，我们可以用它进行快速的文件编辑和配置更改。


    ### Shell 脚本

    用解释型语言编写的程序通常与 shell 或编译程序相关，被称为脚本。在 Linux 中，许多脚本是以 shell 脚本的形式创建的因为因为与 `bash`
    或其他 shell 关联。Shell 脚本由用户编写，用于帮助自动化枯燥、重复的任务，或执行新的、复杂的任务。大多数发行版使用内置脚本来执行 Linux 系统中的许多启动函数。掌握脚本编写对于管理员来说非常重要，因为它将有助于管理系统的启动过程。


    Shell 脚本是纯文本文件，在 `vi`、`emacs`、`nano` 或 `pico` 等文本编辑器中创建。Shell 脚本以第一行识别应该用来运行它的
    shell 开头。考虑以下简单脚本：


    ```bash

    #!/bin/bash

    echo "Hello World!"

    ```


    第一行以两个字符（`#!`）开头。这两个字符是特殊代码，告诉 Linux 内核这是一个脚本，并且该行的其余部分应被视为解释此脚本的程序的路径。在脚本中，路径是
    `/bin/bash`，它是 `bash` shell 程序的路径。


    在 shell 脚本内部，井号符号或哈希标记（`#`）被视为注释字符。这会导致脚本实用程序忽略此行，但内核仍然会读取它。在大多数 Linux 系统上，`/bin/sh`
    是指向 `/bin/bash` 的符号链接，但它也可以指向另一个 shell。如果用户指定脚本使用 `/bin/sh` 而不是 `/bin/bash`，这几乎可以保证任何
    Linux 系统都能执行该脚本，因为它们都有一个运行脚本的 shell 程序。如果是一个简单的 `bash` 脚本，该脚本可以在大多数其他 shell 中运行。遗憾的是，如果脚本更复杂，它将需要一个特定的
    shell，否则可能会失败。


    编写 shell 脚本后，我们必须使用 `chmod` 命令修改文本文件，以确保它是操作系统中的一个可执行文件。`chmod` 的用法将在第 12 章（所有权与权限）中介绍。


    当你开始创建更长更复杂的 shell 脚本时，你会希望有一个良好的文本编辑器程序。如果使用图形桌面，`KWrite` 和 gnome 的 `gedit` 编辑器是创建文本脚本的极佳选择。然而，如果在命令行操作，可以使用
    `vi`、`emacs`、`pico` 或 `nano`。


    ### 在脚本中使用命令

    脚本简单的用法是在无需用户干预的情况下运行一系列命令。shell 内置的命令和外部命令都可以在脚本中使用。这意味着可以从脚本运行其他程序。


    用户在 shell 提示符输入的大多数命令都是外部命令。所有这些程序位于 `/bin`、`/usr/bin` 以及文件系统中的其他目录。这些程序以及内部命令可以直接在脚本中使用它们的名称来运行。如果需要，我们还可以在脚本中为这些程序指定参数。例如，考虑以下脚本，用于从
    Downloads 拷贝文件到 Documents，启动一个 xterm 窗口，然后在 GUI 中启动 KMail 邮件阅读器：


    ```bash

    #!/bin/bash

    cp ~/Downloads/file.txt ~/Documents/file.txt

    /usr/bin/xterm &

    /usr/bin/kmail &

    ```


    '
- fmt: "\nAside from the first line identifying it as a script, the script looks just\
    \ like the commands that a user would type into the shell to accomplish these\
    \ three tasks manually. The only exception is that this script lists the complete\
    \ paths to each program. This is usually not strictly necessary (as shown by the\
    \ line with the `cp` command), but listing the complete path ensures that the\
    \ script will find the programs even if the `PATH` environment variable changes.\
    \ If the script produces an error when run (such as “No such file or directory\
    \ error for a command”), you can help locate the program by running the `which`\
    \ command to locate the path. For example, if you needed to find the path to the\
    \ `xterm` program, entering `which xterm` at the shell prompt should return `/usr/bin`\
    \ as its path.\n\nIn the basic script provided, notice that each line in the example\
    \ script ends in an ampersand (`&`). This character instructs the shell to go\
    \ on to the next line without waiting for the first command to finish executing.\
    \ If the ampersand was not provided, the first `xterm` will open, but the `KMail`\
    \ program will not open until the `xterm` program is closed.\n\nAlthough launching\
    \ several programs from one script can save time during the startup of a system\
    \ or program, there are some situations where the user will want to wait for one\
    \ line of the script to finish before starting the next line. This is common when\
    \ running a series of programs that manipulate data from the previous command\
    \ in some way. These scripts typically do not include the ampersands at the ends\
    \ of the commands because one command must run after another or may even rely\
    \ on the output from the first command.\n\nWhile a script can use any command\
    \ or program within it, there are certain commands that administrators commonly\
    \ use within a script to conduct certain functions.\n\nThe `echo` command is probably\
    \ the most used command in a script. The `echo` command displays a message to\
    \ the user on the screen within the terminal. For example, the script may start\
    \ with a message to the user that says, “Please wait, the script is running…”.\
    \ This type of message is displayed using the `echo` command.\n\nWhen repetitive\
    \ file maintenance tasks need to be automated, we use the `ls` (list), `mv` (move),\
    \ `cp` (copy), and `rm` (remove) commands.\n\nWhen text needs to be extracted\
    \ from a specific field within a file, we heavily use the `cut` command. This\
    \ is especially useful when working with a preformatted text file, like a command\
    \ separated value (CSV) file.\n\nThe `find` command finds a particular file based\
    \ on its filename, ownership, or other characteristics. If an administrator needs\
    \ to locate a certain pattern of information within the contents of our files,\
    \ they use the `grep` command instead. The `grep` command can also display the\
    \ lines from within a provided file that match the search string.\n\n### Variables\n\
    \nAnother way to expand the usefulness of your scripts is to use variables. A\
    \ variable is a placeholder for a value to be determined at the script’s execution\
    \ time. The value of a variable can be passed as parameters to a script, generated\
    \ internally within a script, or extracted from the script’s environment. An environment\
    \ is a set of variables, including items like the current directory or search\
    \ path for running programs that a program can access.\n\nVariables that are passed\
    \ to the script are known as parameters or arguments. They are represented in\
    \ the script by a dollar sign (`$`) followed by a number. These numbers begin\
    \ with `$0` (representing the name of the script), then go to `$1` (the first\
    \ parameter), then to `$2` (the second parameter), and so on.\n\nConsider the\
    \ following script and try to determine what functions are being performed. If\
    \ you do not understand a command, use the `man` command to learn more about it.\
    \ When you think you understand the script, keep reading to see if you understood\
    \ it properly.\n\n```bash\n#!/bin/bash\nuseradd -m $1\npasswd $1\nmkdir -p /shared/$1\n\
    chown $1.users /shared/$1\nchmod 755 /shared/$1\nln -s /shared/$1 /home/$1/shared\n\
    chown $1.users /home/$1/shared |\n```\n\nThe script first creates an account using\
    \ the first argument given to the script as the username. The script then changes\
    \ the account’s password and creates a directory in the `/shared` directory corresponding\
    \ to the account name, which again is received as the first parameter from the\
    \ user running the script. The ownership of this newly created directory is then\
    \ given to this new user account, and its permissions modified to give the user\
    \ read, write, and execute permissions. Next, the script sets a symbolic link\
    \ to that directory from the new user’s home directory and provides the new user\
    \ account ownership over this folder in the home directory.\n\nIf you didn’t understand\
    \ everything in this script right now, that is perfect normal since some of these\
    \ commands and programs are new to you at this point. By the end of this book,\
    \ though, you should feel comfortable reading a script like this, or even writing\
    \ one yourself.\n\nTo use this script, a user would simply type the name of the\
    \ script, the new username, and enter the desired password twice, as shown in\
    \ this excerpt below:\n\n```\nDionTraining:Documents jason$ ./user_script.sh jasondion\n\
    Changing password for jasondion\nNew password:\nRetype password:Password for jasondion\
    \ changed by jason\nDionTraining:Documents jason$\n```\n\nWhen the script runs,\
    \ the only thing displayed to the screen is whatever the commands normally would\
    \ display, such as the prompt for the new password to be entered. All the other\
    \ commands are run in the background with no user interaction or knowledge. This\
    \ is referred to as silent operation. For this reason, many script writers will\
    \ add display notes into their scripts using the `echo` command so that information\
    \ can pass back to the user during the operation. In effect, this script simply\
    \ replaced seven individual commands with a single script. For each command, the\
    \ first parameter (`jasondion`) was used as a variable to prevent the user from\
    \ needing to reenter the new username each time.\n\n### Conditional Expressions\n\
    \nBy default, a script will execute all the commands listed from the first line\
    \ to the last line, but sometimes it is helpful to skip lines based on certain\
    \ circumstances. To achieve this, we use conditional expressions.\n\nConditional\
    \ expressions enable a script to perform one of several actions depending on what\
    \ conditions have been met or the value of a variable. The `if` command allows\
    \ the script to evaluate a given conditional expression that is placed within\
    \ brackets after the `if` keyword, and it then perform one of two different actions,\
    \ depending on whether a certain condition is true or false.\n\nFor example, the\
    \ file exists condition (`-f`) is true if file exists and is a regular file. The\
    \ file exists and isn’t empty condition (`-s`) is true if the file exists and\
    \ has a size greater than 0. The `string1 == string2` condition is true if the\
    \ two strings have the exact same values.\n\nThese conditional statements may\
    \ also be combined with the logical AND (`&&`) or the logical OR (`||`) operators.\
    \ When conditionals combine with the logical AND, then both sides of the operator\
    \ must be true for the condition as a whole to be considered true. When we use\
    \ the logical OR, if either side of the operator is true, then the condition as\
    \ a whole is also considered true.\n\nConsider the following script fragment that\
    \ demonstrates the `if` command and conditional expression:\n\n```bash\nif [-f\
    \ /tmp/tempfile.txt]\nthen\n  echo \"/tmp/tempfile.txt was found; aborting script.\"\
    \n  exit\nfi\n```\n"
  raw: 'Aside from the first line identifying it as a script, the script looks just
    like the commands that a user would type into the shell to accomplish these three
