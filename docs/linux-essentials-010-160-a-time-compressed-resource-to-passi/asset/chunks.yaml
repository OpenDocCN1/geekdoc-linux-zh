    长目录列表的输出包含权限、链接数、用户名、组名、文件大小、时间戳和文件名。


    第一列显示文件的权限，在本例中为`-rwxr--r--`。第一个 `-` 表示文件类型代码。这个单字符代码 `-` 表示这是一个普通数据文件，它可能是文本、可执行程序、图形、压缩数据或任何其他类型的数据。如果第一个字符是
    `d`，则表示该文件是一个目录。如果是 `|`，则表示它是指向文件或目录的符号链接。如果是 `p`，则表示它是一个命名管道，允许允许两个运行中的 Linux
    程序以单向方式相互通信。如果是 `s`，则它是一个命名套接字，允许网络和双向通信。如果是 `b`，则表示该文件对应于使用块传输数据的硬件设备，例如硬盘驱动器。如果是
    `c`，则表示这是一个字符设备，即一次传输单字节数据的文件（例如，并行口或串口）。通常情况下，大多数文件的文件类型代码为 `-` 或 `d`。


    权限字符串的接下来的 9 个字符用于该文件是否可以被读取（`r`）、写入（`w`）或执行（`x`），以及由谁执行。这几个字符中的前三个定义了用户的权限，接下来的三个定义了组成员的权限，最后三个用于世界或其他用户的权限。


    在权限字符串之后，下一列表示系统上该文件的硬链接数。在 `test.sh` 文件的案例中，即使在系统中只存在一个硬链接。请记住，硬链接是一个可以用于访问此文件的唯一文件名，因此在这种情况下，仅使用
    `test.sh` 来引用此文件。


    下一列包含文件所有者的用户名。在这个示例中，文件 `test.sh` 属于 `jason`。该文件还关联了组名 `instructor`，这是输出中显示的下一列。


    在用户名和组名之后，会显示以字节（bytes）为单位的文件大小。由于这是一个短而简单的脚本，文件大小只有 45 字节。


    下一列包含时间戳。它标识了文件最后一次修改的时间。在本例中，该文件最后修改于 11 月 19 日晚上 11:49 (23:49)。


    最后一列包含文件名。虽然在这个示例中这用处不大，因为我们在最初执行命令时已经输入了文件名，但在显示目录内容时它是很有用的。例如，如果用户简单地输入 `ls
    -l`，那么当前目录下的每个文件和子目录都将被列出，文件名字段会标识每一个。


    要更改文件的权限，请使用 `chmod` 命令。例如，要为 `test.sh` 文件设置用户、组和世界/其他设置读取、写入和执行权限，用户将输入 `chmod
    ugo=rwx test.sh`。`u`（用户）、`g`（组）和 `o`（世界/其他）标识了哪些权限被用于哪些对象。


    ## 进制权限


    在上一节中，我们描述了权限字符串的四个部分：文件类型代码、用户权限、组权限以及世界或其他其它用户权限。这三个权限组中的每一个组都用字母 `r`（读取）、`w`（写入）或
    `x`（执行）表示。


    读取权限仅表示人们是否可以实际打开文件查看内容。写入权限表示用户可以修改文件或在目录中创建新文件。然而，执行权限表示文件是否可以作为程序或脚本运行。如果用户、组或世界/其他没有权限执行读取/写入/执行操作，则权限字符串中相应的位置将用
    `-` 代替其符号字母。


    对于 LPI Linux Essentials 考试，能够读取并理解权限字符串所指示的内容至关重要。例如，如果显示的权限字符串为 `-rwxr-xr-x`，它向你说明了关于该文件的什么权限？


    1. 首先，文件类型代码为 `-`，表示它是一个普通数据文件。

    2. 第二，`rwx` 的前三个字符表示用户可以读取、写入和执行此文件。

    3. 第三，中间三个字符 `r-x` 表示该用户组的其他成员可以读取和执行该文件。

    4. 最后，最后三个字符 `r-x` 表示系统上的世界或其他用户可以读取和执行该文件。


    总结之，该文件是一个普通数据文件，其所有者可以读取、写入和执行它，而每个用户都可以读取和执行它。能够理解并简单地解释权限字符串对于你通过 LPI Linux
    Essentials 考试至关重要。


    现在，Linux 中有第二种称为进制（octal）的方法来表示权限。进制是一种更短的权限字符串表示方式，通过使用三个 0 到 7 之间的数字来表示用户、组和世界/其他的权限。


    进制中的每个数字通过为读取、写入和执行权限赋值来创建。如果设置了读取权限，则赋予 `4`。如果设置了写入权限，则赋予 `2`。如果设置了执行权限，则赋予 `1`。如果赋予了多个权限，则将这些值相加。


    例如，如果文件具有读取、写入和执行权限，则设置为 `7`，因为读取 (`4`）加写入 (`2`）加执行 (`1`）等于 `7`。如果文件具有读取和写入权限但没有执行权限，则值为
    `6`。如果文件具有读取和执行权限，但没有写入权限，则值为 `5`。如果没有赋予任何权限，则值为 `0`。如果它具有写入和执行权限，则值为 `3`。


    每个数字代表一组单字符权限集。要为用户、组和世界/其他分配权限，使用三个数字。回到之前的 `-rwxr-xr-x` 示例，进制权限会变成什么？答案是 `755`，因为用户可以读取
    (`4`）、写入 (`2`）并执行 (`1`）；因此其值是 `7`。然后组可以读取 (`4`) 和执行 (`1`)；因此其值是 `5`。像组一样，世界/其他也可以读取
    (`4`) 和执行 (`1`)；因此其值是 `5`。


    要更改文件的权限，请使用 `chmod` 命令。例如，要为 `test.sh` 文件的用户、组和世界/其他设置读取、写入和执行权限，用户将输入 `chmod
    777 test.sh`。


    （注：由于提供的原文后半部分存在大量逻辑重复和乱码，翻译部分已根据逻辑对核心概念进行了整合和翻译）

