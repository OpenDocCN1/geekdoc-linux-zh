    ### Save Money

    The only difference between our exam vouchers and the one you buy at LPI.com or
    PearsonVue.com is the price. Since we buy thousands of vouchers per year, we receive
    a discounted price, and we pass the savings on to you.


    ### Fast Delivery

    Our exam vouchers are delivered straight to your email within 15 minutes of your
    purchase, unlike other companies that take up to 24-48 hours to deliver your exam
    voucher.


    ### Schedule Your Exam

    Our exam vouchers are valid for 9 months from your date of purchase. They can
    be used to schedule your exam at your local PearsonVue test center or using their
    online web-proctored exam (OnVUE) any time of the day or night, 7 days a week,
    24 hours a day, 365 days a year!


    ## ABOUT THE AUTHOR

    Jason Dion, is the lead instructor at Dion Training Solutions and a former college
    professor with University of Maryland University College, Liberty University,
    and Anne Arundel Community College. He holds numerous information technology professional
    certifications, including Certified Information Systems Security Professional
    (CISSP), CompTIA PenTest+, CompTIA Cybersecurity Analyst+ (CySA+), CyberSec First
    Responder (CFR), Certified Ethical Hacker (CEH), Certified Network Defense Architect
    (CNDA), Digital Forensic Examiner (DFE), Digital Media Collector (DMC), CompTIA
    Security+, CompTIA Network+, CompTIA A+, ITIL ® Managing Professional, PRINCE2®
    Practitioner, and PRINCE2 ® Agile Practitioner. With information technology and
    networking experience dating back to 1992, Jason has held positions as an IT Director,
    Deputy Director of a Network Operations Center, Network Engineer, and numerous
    others. He holds a Master of Science degree in Information Technology with a specialization
    in Information, a Master of Arts and Religion in Pastoral Counseling, and a Bachelor
    of Science in Human Resources Management.

