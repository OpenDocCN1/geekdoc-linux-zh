- fmt: '

    As previously mentioned, `RPM` and Debian package management systems are two of
    the most commonly utilized package management systems in some Linux distributions.
    Ubuntu is a Debian-based distribution, so it uses the Debian-based package manager
    called `apt` or Advanced Packaging Tool. CentOS, Fedora, and other distributions
    under the RedHat family use the `RPM` package manager. In CentOS, this is called
    `YUM` (Yellowdog Updater, Modified) while, in Fedora, it is called `DNF` or `Dandified
    YUM`: a fork and improvement of `YUM`.


    ### DNF

    To work with the package manager `DNF`, first we must update the package list.
    Typing `dnf check-update` on a Fedora terminal tells `DNF` to check the repository
    and get a list of the latest version of all the programs that can be installed.
    It will then produce the list of the latest available versions. Then, `sudo dnf
    upgrade` checks if there are any programs in the system that need updates. The
    command is run as root since there might be system-installed programs that can
    only be updated with root privileges. As `DNF` finds new versions of the programs
    to install, it will ask the user if the programs will indeed be updated.


    To search for a program to be installed in the system, typing `dnf search keyword`,
    and replacing ‘keyword’ with the keyword for the program, searches the repository
    for programs that contain that word. For example, typing `dnf search virtualbox`
    will search the package list for programs that have the word `virtualbox` in them.
    All the packages with the searched keyword will be listed on screen. The files
    listed on the screen come in `.rpm` file package format. To look into the details
    of a package, type `dnf info filename`, replacing filename with the package’s
    name. To install a package, type `sudo dnf install package`, replacing package
    with the package name. We use `sudo` since there may be dependencies and additional
    software that need to be installed needing root privileges. To remove software,
    type `sudo dnf erase package-name`, replacing ‘package-name’ with the package
    name. In this uninstallation, we again use `sudo` since there may be dependencies
    and software to be removed that needs root access.


    ### APT

    Ubuntu, being Debian-based, uses the `.deb` file package format. To update the
    package list, type `sudo apt update`. If there are new versions of the software
    installed in Ubuntu, typing `sudo apt upgrade` will update programs to the latest
    version available in the repositories. Sometimes, when doing an upgrade, `apt`
    will advise on programs that may be too old, just sitting in the system and not
    being used as a dependency by any other program, or aren''t used at all. To save
    space and keep the system secure, these can be uninstalled by typing `sudo apt
    autoremove`. To search for a package in `apt`, type `apt search [package keyword]`
    replacing the words in the bracket with a keyword relating to the program to be
    installed. To view the details of a package, type `apt show [file name]`. Information
    that will be shown include the package name, version, priority, section, origin,
    maintainer, URL to the bug reports and resolution, etc. To install a package,
    type `sudo apt install package-name`, replacing ‘package-name with the package
    name. To uninstall that package or any other package, type `sudo apt remove package-name`.


    The good thing about package managers like `DNF` and `apt` is that they automatically
    install other software, called dependencies, that are needed by the package currently
    being installed. They keep track of packages in the distribution''s repository,
    as well as packages currently installed in the system, allowing for easy updates
    to newer versions and uninstallation. These package managers can also be easily
    accessed from the terminal especially for systems, such as servers, that may not
    have a GUI.


    ### Process Hierarchy

    Previously, we discussed that the Linux kernel is at the core of a Linux installation.
    The kernel manages memory, provides software with a way to access the hard disk,
    assigns CPU time to portions of a piece of software, and performs other critical
    low-level tasks. The boot process loads the kernel early on, and it is the kernel
    that is responsible for managing every other piece of software code that is running
    on a Linux computer. One of the many ways that the kernel imposes order on the
    potentially chaotic set of running software is to create a hierarchy.


    When it boots, the kernel runs just one program, normally `/sbin/init`. The `init`
    process is then responsible for starting all the other basic programs that Linux
    must run, such as the programs that manage logins and always-on servers and services.
    These programs, if launched directly by `init`, are known as its children. `init`’s
    children can in turn launch their own children. For example, when you log into
    a Linux system, a child process is launched to support that function. Therefore,
    anytime a process is launched, it is considered a child. The process which launched
    a given process is then called its parent. This parent-child relationship creates
    a natural hierarchy for all the running processes on a given system.


    This results in a tree-like hierarchy of processes that, when illustrated, is
    often depicted like an upside-down tree. As shown in the figure below, there are
    a small subset of the many processes that run on a typical Linux installation.
    This image only displays a few processes associated with a text-mode login, including
    the login tool that manages logins, a couple of daemons, and a few user programs.
    A working Linux system will likely have dozens or hundreds of running processes,
    as shown here:


    | ![](Image00023.jpg) |


    ### Identifying Running Processes

    Every process has a process ID or `PID` number associated with it. These numbers
    begin with 1, so the `PID` for the `init` process is normally 1. Each process
    also has a parent process ID or `PPID` number, which points to its parent. Many
    of the tools for managing processes rely on these numbers, and particularly on
    the `PID` number to identify the running process.


    Before managing processes, it is important to identify them. To do so, we use
    the `ps` and `top` command line utilities. With both tools, we can search for
    processes in various ways, such as by their name or by the resource that they
    utilize. One of the most common reasons for identifying a process is to know how
    memory it is consuming, which can be done with the `free` command. The simplest
    tool for identifying processes is `ps`, which produces a process listing. Given
    the large number of `ps` options, most users have their own favorite way of using
    the program. For example, typing `ps ax` is my favorite since it usually produces
    the information I need, such as the `PID` values, command names, and the command-line
    options for all processes on the computer. If you slightly alter the command by
    adding a `u`, as in `ps aux`, this will add usernames, CPU loads, and a few other
    details to the output produced by the `ps` command. The sheer scope of the information
    produced, however, can be overwhelming.


    One way to narrow this scope is to pipe the outputted results through the `grep`
    command, which eliminates lines that don’t include specified search criterion.
    For example, if you wanted to only determine the PID number for the `gedit` process,
    you might run the command like this:


    ```

    $ ps ax | grep gedit

    27946 pts/8 S1 0:00 gedit

    27950 pts/8 S+ 0:00 grep--color=auto gedit

    ```

    '
