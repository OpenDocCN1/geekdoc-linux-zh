    命令行环境是一个极其强大的工具。正如之前讨论过的，通配符可以代表单个字符、提供子集中的多个字符，或者文件名部分的任何字符。同样的概念也可以用于在文件或多个文件中搜索数据，如。在本章中，你将学习如何使用重定向和通配符在各种文件和命令中搜索并提取数据。在此之前，你必须理解如何使用命令重定向和输入/输出重定向的概念将多个命令连接起来。


    ## 命令重定向

    命令重定向允许用户将标准输入重定向到第二个程序或命令。这是通过管道（pipeline）或命令行管道实现的。管道通过在两个命令之间使用竖线（`|`）创建。该按键通常位于键盘上回车键上方，通过按住
    Shift 键同时按下反斜键来访问。


    管道在各种方式应用时非常有用。例如，`cat` 命令（在屏幕上显示文件内容）的长输出输出可以与 `less` 命令管道连接，从而一次只显示一页内容。这避免了直接跳到文件的最后一页而看不到文件的其余内容。`more`
    命令与 `cat` 结合时也可以一次显示一页内容，但它的运行机制与 `less` 命令略有不同。要了解更多 `cat`、`less` 和 `more` 命令，请参考它们专门的手页（man
    pages）。


    通过使用管道，用户可以顺序连续执行两个或多个命令。这允许快速执行命令和复杂任务，同时也减少了执行中的等待，因为系统不需要等待用户输入下一个命令。


    `grep` 命令通常用于管道，在给定命令的输出中搜索关键词。该命令搜索包含指定字符串的文件并返回文件名；如果是文本文件，还会返回包含该字符串的行。`grep`
    命令也可以在指定文件中搜索特定字符串。要使用 `grep`，用户只需输入命令名称 `grep`、一组可选的开关和参数、正则表达式，以及如果需要的一个可选的文件名。


    如果你计划进入系统管理或网络安全领域，你将需要熟练使用 `grep` 命令。对于安全运营中心（SOC）分析师来说，该命令是查找安全信息事件管理（SIEM）服务器中不同日志文件中信息的最佳朋友。`grep`
    工具的深度用法超出了本书的范围，但要了解更多关于该命令的信息，请参考其详细的手页获取其支持的完整选项列表。


    ## 输入/输出重定向

    除了使用管道将一个命令的输出重定向到另一个命令之外，用户还可以将命令的输入输出重定向到其他位置。例如，如果你需要保存程序的输出以备后用，可以将该输出重定向到文件。同样，命令的输入可以从文件重定向，而不需要用户通过键盘输入。


    虽然输入重定向听起来很奇怪，但某些程序依赖此功能来处理数据。例如，馈给程序的原始文本文件会搜索文本中的指定模式。除了将输出重定向到文件或从文件输入外，程序的输出输出还可以像在本章前面提到的那样，通过管道过程作为输入传递给另一个程序。除了所有这些，还有一种涉及
    `xargs` 命令的相关技术，它允许用户从文件或其他程序的输出中生成命令行选项。


    Linux 系统默认支持两种类型的输出：标准输出（stdout）和标准错误（stderr）。标准输出用于正常的程序消息。例如，当你运行 `ls` 命令时，输出被发送到标准输出并显示在你的屏幕上。相反，标准错误输出错误消息。默认情况下，这些也会显示在屏幕上，但用户可以根据需要重定向这些消息。


    有几种重定向操作符可以更完全地控制信息的输出位置显示位置和/或保存位置：


    - `>` 创建一个包含标准输出的新文件。如果指定的文件已存在，它将被覆盖。例如，如果执行命令 `ls > contents.txt`，`ls` 命令的输出将保存到
    `contents.txt` 文件中，屏幕上不会显示任何内容。

    - `>>` 将标准输出追加到现有文件。与上面的命令一样，我们可以将 `ls` 命令的输出重定向到文件 `contents.txt`，但不是覆盖文件，而是将我们的输出添加到当前文件的末尾。

    - `2>` 创建一个新文件，将标准错误重定向到文件中。如果文件已存在，其内容将被覆盖。

    - `2>>` 将标准错误追加到现有文件。如果文件不存在，则创建一个新文件。如果它已存在，标准错误输出将简单地添加到文件末尾。

    - `&>` 创建一个包含标准输出和标准错误输出的新文件。如果文件已存在，其内容将被覆盖。


    还有几种重定向操作符可以更完全地控制信息从 Shell 的哪里输入：


    - `<` 将指定文件的内容发送给命令以代替标准输入。例如，如果我有一个名为 `input.txt` 的文本文件，其中包含一行文本 `b??l`，并输入命令
    `ls < input.txt`，其输出等同于在命令行提示符处输入 `ls b??l`。

    - `<<` 进入一种交互模式，输入的后续行将重定向到标准输入。这允许你逐行输入新信息并将其重定向到同一个命令。

    - `<>` 指定一个文件将同时用于标准输入和标准输出。


    现在，虽然这些选项（例如 `<>` 选项）看起来可能是你永远不会使用的东西，但请记住 Linux 将每个设备视为挂载在其文件系统某处的文件。因此，像 `<>`
    这样的选项在读写外部硬盘、向声卡发送或接收数据或其他类似情况下可能是很有用的。


    作为一个普通用户，你可能不会经常使用 `<>`，但如果你成为一名 Linux 开发者，那时对你来说可能会更有用。让我们使用 `grep` 命令将这些概念付实践。例如，如果
    root 账户系统管理员想要在 `/etc` 目录每个配置文件搜索关于特定用户（Jason）的数据，他们只需输入 `grep Jason /etc/*` 即可实现。然而，如果不使用重定向运行命令，`grep`
    搜索的输出将只显示在屏幕上，而不会保存备用。此外，由于我们的系统管理员是以 root 用户执行命令的，`grep` 可能会向屏幕返回大量输出，使其变得很长且难以阅读。


    因此，系统管理员应该采用重定向。为了实现这一点，系统管理员应该使用重定向操作符并指定保存输出的文件名。例如，`grep Jason /etc/* > results.txt`。（注：提供的文本在
    "the filename where" 处突然中断，但逻辑遵循标准重定向）。


