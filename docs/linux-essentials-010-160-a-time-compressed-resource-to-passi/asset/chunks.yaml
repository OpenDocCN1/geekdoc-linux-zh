- fmt: '

    Most desktop applications that come pre-installed or that can be later installed
    on Ubuntu are free and open source alternatives to more popular commercial software.
    However, it does not mean that they lack performance. In fact, most of these programs
    are now mainstream, and they are sometimes even preferred over commercial software.
    Many of these free and open source applications function similarly to their commercial
    counterparts with slightly subtle differences.


    ## Office Suites

    `LibreOffice` is a free and open source office suite, found pre-installed in most
    Linux distributions like Ubuntu. It is like `Microsoft Office`. Included in the
    LibreOffice suite is `Writer`, a word processing program like `MS Word`. It allows
    us to write notes and documents that we can also format according to preferences
    and use. Also included in this office suite is `Calc`, a spreadsheet program similar
    to `MS Excel` or macOS’s `Numbers`. For creating presentations such as those on
    `MS PowerPoint` or `Keynote`, `Impress` is the program.


    ## Media and Graphics Editing

    `VLC` media player is a free and open source, portable, cross-platform media player
    software and streaming media server available in Ubuntu. The good thing about
    this program is that it is cross-platform, which means that it can run on other
    operating systems, such as Windows, macOS, and even on mobile phones. Its main
    advantage over other media players is its ability to play almost any audio and
    video format, and it supports a wide range of codecs.


    A program to manipulate images on Ubuntu that’s like `Adobe Photoshop` is `GIMP`.
    An acronym for `GNU Image Manipulation Program`, `GIMP` is a free and open-source
    raster graphics editor for image retouching and editing, free-form drawing, converting
    between different image formats, and more specialized imaging tasks.


    For those looking for video editing programs like `Adobe Premier` or `Final Cut
    Pro`, `Kdenlive` is a free and open source alternative. For working on audio files,
    the program to use is `Audacity`: a powerful, cross-platform, and open source
    digital audio editing and recording application software.


    ## Browsing and Productivity

    The internet browser that comes pre-installed in Ubuntu is `Firefox`, although
    users can always add others such as `Google Chrome`, `Opera`, or many others.


    ## Server and Network Administration

    For server and network administrators, it is also important to have applications
    that extend Ubuntu''s capabilities beyond desktop tasks. One of these server applications
    is `Wireshark`. It is a free and open source packet analyzer. Admins use it for
    network troubleshooting, analysis, and software and communications protocol development.


    `GParted` is a graphical user interface for managing disk partitions. It can create,
    format, and resize partitions without needing to memorize the code entered to
    do those functions.


    An important aspect of managing servers and networks is the ability to backup
    data to retrieve or restore from it in the event of system crashes or failure.
    An application called `Timeshift` can take scheduled snapshots of the system to
    give the ability to restore the system to a previous snapshot when there are accidental
    deletions or changes render the current system unstable.


    To quickly create text for coding or system scripts rather than office documents,
    `Atom` is a good application. It is like `Notepad` on Windows. Another helpful
    tool for system and network administrators is `PuTTY`. `PuTTY` is a free and open
    source terminal emulator, serial console and network file transfer application.
    It supports several network protocols, including `SCP`, `SSH`, `Telnet`, `rlogin`,
    and raw socket connection.


