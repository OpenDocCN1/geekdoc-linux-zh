    * Understand the concepts of open source software

    * Explain the costs of open source software

    * List basic desktop and server applications

    * List different programming languages and their tools

    * Explain how package installation and repositories work


    ## Open Source Software


    Open source software is software released under a license in which the copyright
    holder grants users the rights to study, change, and distribute the software to
    anyone and for any purpose. As such, the source code (the human readable core
    of the software) is available for inspection, modification, and enhancement. Open
    source software is usually developed in a collaborative public manner and is an
    example of how open collaboration can create some exceptional products and services.


    In the early days of computing, programmers and developers shared software in
    order to learn from each other and to evolve the computing field. Eventually,
    the open source notion moved to the wayside, as many developers opted to commercialize
    their software in the 1970s and 1980s. Still, many academics and some developers
    still create software collaboratively, even to this day.


    Because of this collaboration, software developers may want to publish their software
    with an open source license, such as the `GNU General Public License (GPL)`, so
    that anybody may also develop the same software or understand its internal functioning.
    With open source software, anyone can modify it, port it to new operating systems
    and instruction set architectures, share it with others, or even market it in
    some cases. According to some scholars, there are several policy-based reasons
    for the adoption of open source, including the heightened value proposition created
    by the open source movement. For example, many open source software products have
    greater security, affordability, transparency, interoperability, scalability,
    and localization support than commercial variants.


    The `Open Source Initiative` is a public benefit corporation that promotes the
    usage of open source software. They published the `Open Source Definition (OSD)`,
    a document that determines whether a software license can be labeled with the
    open source certification mark. This mark serves as a distinctive label to show
    that a software’s attributes meet the requirements of the `OSD`.


    ## Cost of Open Source Software


    Open source software is generally freely available for download, so the cost to
    acquire a copy is very low. But like any software project, whether open source
    or proprietary, costs can start to pile up when it comes to technical support,
    training, and administration or maintenance.


    In the early days of computing, almost all software was produced by academics’
    and corporate researchers’ collaboration. They often shared software as public-domain.
    This meant that there was absolutely no ownership, such as copyright, trademark,
    or patent. As such, they generally distributed software under the principles of
    openness and cooperation. It was simply not seen as a commodity that could be
    sold for profit. Such communal behavior later became a central element of the
    so-called hacking culture, which is a term with a positive connotation among open
    source programmers.


    During this early period, the source code was generally distributed with the software
    machine code. This allowed users to modify the software themselves if they needed
    to, since the code would often not run on a different hardware setup or operating
    system without modification. This also allowed any user to fix bugs or to add
    new features, if they so desired.


    Long after the invention of computers, industries began widespread adoption of
    computing power and its advancing technologies. With this widespread adoption,
    a need arose for new hardware and software to be developed to meet this increased
    demand. During this time, hardware manufacturers would create most software as
    well, and this dramatically drove up the software’s cost. To compete with the
    hardware manufacturers who bundled software with hardware, a brand-new software
    industry began to grow. To increase revenues and keep up with rising costs in
    software development, a general trend began of no longer openly distributing source
    code, but instead making it proprietary and maintaining a legal copyright on the
    programs created. Now, to legally run the software, an individual or a company
    would need to acquire a license, resulting in profit for the software developers.


    However, a resurgence in research and alternatives to lower the cost of using
    and maintaining computer systems once again resurrected the idea of free open
    source software in the late 20th century. Open source software developers now
    had to look for ways to continue developing software while allowing people to
    use it for free. Some of the developers resorted to private funding, crowdfunding,
    and even accepting donations from users to keep their projects alive. Since donations
    are voluntary, this still allows other nondonating users to use the software for
    free.


    Others moved to a freemium model, often striking partnerships with other companies
    to show advertisements or install other software from within their software. This
    allows their software development to be funded while still allowing end users
    to use their software freely.


    Still others chose to adopt a freely distributed, open source model that relies
    on support agreements put into place by the end user. This means you can use the
    software for free. but if you want support from the developer when you have a
    problem, then you must pay a service fee. This model was popularized by `Red Hat
    Enterprise Linux`, which is completely free to use, but charges for official support,
    training, and certifications.


    ## Desktop and Server Applications


