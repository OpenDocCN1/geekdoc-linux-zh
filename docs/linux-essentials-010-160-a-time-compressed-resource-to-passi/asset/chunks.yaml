    range from commonly used ones to those that are specifically developed for unique
    systems. Most readers are familiar with the two most popular operating systems
    in the world: Windows and macOS.Microsoft Windows dominates the world as the operating
    system of choice, with nearly 90% of all desktop and laptop computers running
    some version. Many home users and companies prefer Windows for their everyday
    use, productivity needs, and gaming. This is also driven by the fact that most
    software developers release their products on the Windows platform due to its
    widespread popularity, creating a self-perpetuating feedback cycle that continually
    increases Windows popularity.The second largest operating system is Apple’s macOS.
    With the increased popularity of the iMac and MacBook computer lines in recent
    years, macOS now makes up about 9% of all desktop and laptop operating systems.
    While slowly gaining market share, macOS still cannot take away large portions
    of Windows’s dominance since macOS only runs on Apple’s own computer hardware.In
    third place, the Linux operating system is found on less than 2% of all desktops
    and laptops. While this is a small amount, remember this doesn’t mean Linux isn’t
    important. These numbers are for home and business desktop users. When it comes
    to servers, Linux dominates Windows and other operating systems with over 75%
    of the market share.For home users, the overall user experience of Windows and
    macOS made them both very popular. Linux, on the other hand, is known as the desktop
    OS for computer experts or hackers. People perceive Linux as difficult to use,
    but that simply isn’t true, as you will see for yourself throughout this book.Windows
    is also the most prone to malware attacks because of its larger user base. This
    makes it susceptible to attackers who circumvent security measures to steal data
    for their own financial gain. After all, if you were a criminal and spent the
    time to create a piece of malware, wouldn’t you create it for the operating system
    that nearly 90% of the world uses? Of course, you would—and so would they!Unlike
    for Windows, malware is very unlikely to affect Linux since the source code is
    openly available, and the community of users can always modify it when they detect
    bugs or vulnerabilities. Like Linux, macOS has its roots in a Unix-like operating
    system, and therefore also enjoys lesser exposure to vulnerabilities than Windows.
    With that said, macOS is still more susceptible to malware than Linux due to its
    larger user base.Windows is a closed source, proprietary software product. Using
    Windows requires a valid license, which can be purchased for a nominal fee of
    several hundred dollars. Linux, on the other hand, is open source and, therefore,
    free to download and use. The third option, macOS, is sort of a hybrid of these
    two models. The software is licensed under a free to use model (like Linux), but
    it is proprietary software (like Windows). Also, macOS can only run on systems
    built by Apple, as per their licensing agreement. This means that to use the macOS,
    you must purchase the hardware from the tech giant with higher prices.Unlike Windows
    or macOS, though, you can run Linux as an operating system from only the command
    line. This is especially helpful when you need an OS to run on systems with limited
    resources, such as old computers or for specific purposes, such as servers and
    embedded systems. We will further discuss how to use the Linux command line later
    in this book, spending a good bit of time covering the different commands in detail
    to help you become proficient at it.Windows and macOS run entirely on graphical
    user interfaces or GUI. Though Microsoft did develop a command line only operating
    system called MS-DOS in the early 1980’s, with the steady development of GUI-based
    OS starting from the mid 80’s, MS-DOS slowly faded into merely a command prompt
    inside Windows, and it is not a complete operating system into itself. For the
    macOS system, there is a command line environment known as the terminal, but most
    users never use it and instead rely solely on the graphical user interface.Overall,
    each operating system has its own pros and cons. I will leave it up to you to
    decide which operating system you prefer for your own desktop environment. However,
    since this is a Linux course, we will focus the rest of this book on its operations
    and usage. We will, however, compare the various Linux concepts to Windows from
    time to time in order to help you better relate these new concepts to things you
    might already know.CHAPTER THREEOpen Source Software![](Image00011.jpg)OBJECTIVES'
