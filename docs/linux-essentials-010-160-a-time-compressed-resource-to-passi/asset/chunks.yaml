  trans: '

    之前，我们讨论了如何在 shell 中创建用户。现在是时候讨论管理组了。管理组包括创建组、向组中添加人员以及重命名组。在 Ubuntu 中，默认情况下，每当我们创建一个用户而不指定用户组时，系统会自动创建一个同名的组。因此，输入
    `sudo useradd tim` 会创建用户 `tim` 和名为 `tim` 的组，且用户 `tim` 是该组的成员。


    要创建一个新组，请使用 `groupadd` 命令。输入 `sudo groupadd students` 创建名为 `students` 的组。要将之前创建的用户
    `tim` 添加到 `students` 组，输入 `sudo usermod -a -G students tim`。`-a` 选项表示添加（append），而
    `-G` 选项表示指定组。要查看哪些用户在哪个组中，`/etc` 文件夹内有一个名为 `group` 的文件，我们可以配合 `grep` 命令使用它。在终端输入
    `grep students /etc/group` 将显示 `/etc/group` 文件中包含 `students` 单词的行。某些情况下，你作为系统管理员可能需要查看系统中所有组的列表。输入
    `cat /etc/group |more` 将逐页显示系统中的所有组。按键盘上的空格键可以进入下一页。


    要重命名组，输入 `sudo groupmod -n oldstudents students`。`-n` 选项表示选项后的单词将成为组的新名称，而下一个单词是要更改的目标组名。关于这些命令的更多信息，请参考
    `groupadd` 和 `groupmod` 的帮助页面（man pages）。


    ## 与 Root 用户交互


    在每台 Linux 计算机上，都有用户拥有管理整个系统所需的特殊权限。这个用户被称为 `root` 用户，也称为超级用户（super user）或管理员。


    当大多数人使用计算机完成日常普通任务（简单称为用户任务）时，他们不需要任何特殊权限。例如，如果用户想在自己的家目录下创建一个新的文本文档，这是一项用户任务，其用户账户拥有创建该文件的所有权限。


    另一方面，`root` 用户账户的存在是为了执行管理任务，例如安装新软件、准备新磁盘以及管理系统上的所有其他普通用户账户。这些管理任务需要访问许多不同的系统和配置文件，而普通用户无法访问或修改这些文件。


    访问 `root` 用户权限的方法有三种。第一种方法直接是从 shell 中通过文本模式或使用如 `SSH` 等远程登录工具直接登录为 `root` 用户。然而，由于某些发行版的安全限制，这种方法可能未启用。


    第二种方法是使用 `su` 命令。`su`（切换用户或替换用户）命令允许用户在当前 shell 中更改用户身份。通过在终端输入 `su`，用户实际上变成了
    `root` 用户并获得了其所有权限。为了使之生效，用户必须输入 `root` 用户的密码，证明他们有权限使用该账户。一旦通过这种方式获得 `root` 权限，随后在
    shell 中输入的任何命令都将以 `root` 用户的提升权限运行。要返回普通用户状态，只需在终端输入 `exit` 即可放弃超级用户状态。


    第三种方法是使用 `sudo` 命令。`sudo`（超级用户执行）命令类似于 `su` 命令，但它只为单个命令提供 root 权限。例如，为了编辑 `/etc/shadow`
    文件，用户可以输入 `sudo nano /etc/shadow` 以 root 权限运行 `nano /etc/shadow` 命令。在执行 `root`
    用户权限操作时，使用 `sudo` 命令被认为是最佳实践，因为它一次仅适用于单个命令。


    在以 `root` 用户身份操作时，我们应该采取额外的预防措施。正如《蜘蛛侠》中的本叔曾说过的：“能力越大，责任越大。”在以 `root` 用户身份操作时，没有比这句话更切了。


    由于 `root` 用户权限访问、修改和删除硬盘上的每一个文件，作为 `root` 时，一个输入错误的命令就可能意外删除关键应用程序文件，并导致 Linux
    服务器数小时的停机。相反，如果入侵者获取了 Linux 系统的 root 权限，该入侵者现在可以对计算机系统文件进行非预意的更改或破坏，更改普通用户文件的所有权或权限，或者安装后门（backdoors）和
    rootkit（rootkits），以便他们持续保持对该系统所有内容的远程访问。因此，用户每当考虑使用 `root` 用户权限和访问时，务必始终采取以下七项预防措施：


    1. **首先**，用户应该询问自己是否真的需要 root 权限。很多时候，有更好或更安全的方法可以实现相同的目标，而无需登录超级用户。

    2. **其次**，如果用户正在以 `root` 用户身份操作，在按下回车键之前务必始终双检命令。每当我以 `root` 身份操作时，我会输入命令，把手从键盘上移开，检查命令，并在确认其完全无误后再按下回车。以
    `root` 身份操作时，一个简单的拼写错误或错误都可能是灾难性的。例如，假设用户位于 `/home/jason/documents` 目录并想要删除该目录下的所有文件。用户想输入命令
    `rm -rf *.*`，这将删除目录内的每个文件。但用户将命令误输为 `rm -rf /*.*`，这反而会删除文件系统根目录下的每个文件。仅仅增加一个 `/`
    就剧烈改变了该命令的含义，并可能导致操作系统完全无法使用且无法启动。

    3. **第三**，以 `root` 身份操作时，绝不要运行可疑程序。从互联网下载的任何程序都可能被旨在破坏你的系统安全。如果你以 `root` 身份运行该程序，程序就可以获得访问整个系统的完全权限，而不仅仅是用户账户。

    4. **第四**，每当使用 root 权限操作时，尽可能缩短使用这些权限的时间。再次，建议利用 `sudo` 命令而不是使用 `su` 或直接登录为 `root`
    用户。这将把用户以 `root` 身份操作的时间限制在单个命令内。

    5. **第五**，绝不要让以 `root` 用户身份运行的 shell 被他人访问。在执行需要 `root` 用户权限的维护任务时，离开系统前务必在 root
    shell 中输入 `exit`。

    6. **第六**，始终为 root 账户使用长密码。root 账户的密码必须受到保护，且该密码绝不能在任何其他用户账户上重复使用。

    7. **第七也是最后一项预防措施**是绝与其他用户共享 root 密码。如果在公共区域工作，请保持小心，确保在输入 root 密码时没有人在从背后窥视。


    `root` 用户及其权限为任何 Linux 系统上的用户或系统管理员提供了终极权力。因此，始终确保该账户受到保护并对其使用情况进行严密监控至关重要。


    # 第十二章

    ## 所有权与权限![](img/Image00027.jpg)


    ### 学习目标


    * 能够设置文件和目录的所有者

    * 理解并计算文件和目录的权限

    * 解释粘滞位（sticky bits）和特殊执行权限

    * 能够配置文件和目录的权限

    '
- fmt: '

    Due to its status as a multiuser operating system, Linux provides tools to enable
    users and system administrators to secure files and directories against unwanted
    access. To secure files and directories on a system, Linux assigns ownership and
    permissions to each and every one. Ownership and permission are intertwined, since
    each file is associated with the owner of the file and the group of which the
    owner is a member. Permissions are then set based on what the owner of the file
    can do to the file, what other members of the owner’s group can do to the file,
    and what other users on the system can do to the file. Linux uses different tools
    for manipulating ownership and manipulating permissions of a file or directory.
    Let’s consider the concept of ownership in more detail and the commands used to
    manipulate ownership.


    ### Ownership

    Linux’s security model assumes the presence of multiple users and provides the
    means to associate files with users. Each file or directory within Linux is assigned
    a user and group. By default, when we create a file, it is assigned to the currently
    logged in user and their group. Since every file has an owner, each file becomes
    associated with a user account’s `UID`. Additionally, every file is also associated
    with a group through its `GID`. This allows the system to control access to each
    file using permissions that can be set independently for the file’s owner, the
    group, and all other users.


    To fully control the ownership of a file or directory, utilize the root user.
    The root user can change the ownership of any file or directory by using the `chown`
    command within a terminal. Execute `chown` (change owner) by typing `chown <username>
    <file or directory>`. To learn more about the `chown` command, please type `man
    chown`.


    The owner can change the group associated with any of the files or directories
    that they own, but they can only change it to other groups to which the user is
    a member. If the file or directory needs to be changed to a group that the owner
    is not a member of, then the root user account must make this change. To change
    the group associated with the ownership of a file or directory, use the `chgrp`
    command by typing `chgrp <username> <file or directory>`. To learn more about
    `chgrp`, please type `man chgrp`.


    ### Permissions

    File ownership is meaningless without providing a way to control what can actually
    be done with each file or directory. Permissions are set in three groups known
    as owner permissions, group permissions, and world or other permissions. Owner
    permissions dictate what the owner of a file or directory may do with that file.
    Group permissions dictate the actions that members of the owner’s group can perform.
    The final category of permission, known as world or other, indicate what actions
    can be performed by any other user on the system who is not the owner or a member
    of the owner’s group.


    To determine a file’s permissions, a user can create a long directory listing
    that will display the permissions for the file using the command `ls -l <file>`.
    Consider the following example which lists the permission for the file known as
    `test.sh`:


    ```

    $ ls -l test.sh

    -rwxr--r-- 1 jason instructors 45 Nov 19 23:49 test.sh

    ```

    '
