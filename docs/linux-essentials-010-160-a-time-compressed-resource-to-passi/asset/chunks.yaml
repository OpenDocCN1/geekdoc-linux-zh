    随着互联网和新技术的出现，`Linux` 已经变得非常普及，甚至成为了家喻户晓。`Linux` 是一系列开源的、类 Unix 的操作系统，通常被打包成一个发行版。由于其稳健性和极低的获取成本，它是许多教育和商业机构的首选操作系统。Linux
    发行版包括 `Linux kernel` 以及支持性的系统软件和库，用以提供供用户交互的功能。你可能听过流行的 Linux 发行版，如 `Ubuntu`、`Debian`
    和 `Fedora`，但目前有成百上千甚至上万个发行版正在开发中。`Linux` 的受欢迎主要是因为它是开源软件，这允许任何人自由地下载、修改甚至重新分发它。`Linux`
    的开源起源是其广泛采用和成功的主要原因之一。


    大多数 Linux 发行版都包含一个窗口系统和桌面环境，为用户提供图形用户界面（`GUI`），类似于 `Microsoft Windows`。我们将在本书中涵盖这个精彩操作系统的所有主要特性和功能。许多
    Linux 发行版是专门为服务器设计的，这些发行版通常完全省略了图形桌面。这意味着对你来说，熟悉命令行界面（`CLI`）或终端同样重要。不过，这种命令行壳需要正确的语法才能使用，并且被认为比单独使用
    `GUI` 更难用。


    正因如此，学习图形界面和命令行界面对于你精通 `Linux` 至关重要。如果你想成为一名成功的终端用户或 `Linux` 系统管理员，花时间学会充分使用这两个环境是值得的。


    但是，你为什么要学习如何使用 `Linux` 呢？嗯，如果你快速浏览一下，你会发现 `Linux` 无处不在。事实上，超过 96% 的网络服务器运行在运行某种众多
    Linux 发行版的服务器上。由于其在扩展性和开源等方面优于其他操作系统的优势，`Linux` 被许多行业视为首选的操作系统。


    ## 开源哲学

    你在浏览互联网或参与某些在线论坛时，可能遇到过“开源”这个词。`Linux` 受开源哲学的影响很大。这种心态对 `Linux` 操作系统及其众多发行版的发展产生了极远的影响。开源指的是计算机软件或程序，其源代码可供公开使用或从其原始设计基础上进行修改。它鼓励该程序或软件社区中的程序员和普通用户之间共同努力，以改进其设计和用途。


    开源软件有哪些例子呢？嗯，如果你只看一个简单的 Web 服务器，你会发现很多开源软件。例如，如果你正在运行 `Apache` Web 服务器，那么你正在运行开源软件。`WordPress`
    呢？嗯，`WordPress` 运行着互联网上 30% 以上的网站，猜怎么着？它也是开源的。


    由于 `WordPress` 是开源的，这意味着你可以去 `WordPress.org` 下载 `WordPress` 内容管理系统的整个代码库，并随心所欲地对其修改、编辑或更改。这就是开源软件的伟大之处。你拥有完全访问运行这些程序的所有代码，并可以对其进行修改以满足你的精确需求。软件或程序的原始设计者随后根据软件许可证的条款发布源代码。软件许可证将规定用户可以在原始发行包中修改哪些内容，以及他们如何将这些修改（称为版本或分支）重新分发给社区和普通公众。


    开源社区使用了许多不同的软件许可证。这些包括 `GNU General Public License`、`Apache License`、`MIT License`
    甚至 `Unlicense`。这些许可证代表了开源许可证的整个光谱，从高度保护到无条件开放。根据你对开源项目的具体需求，你可以选择这些开源许可证中最适合你用途的一个。


    ## Linux 发行版

    我们已经讨论过 `Linux` 被打包成几个发行版（简称为 distros）。每个发行版都包含一个 `Linux kernel`、支持性软件和库以及配置文件。通过组合所有组件，`Linux`
    变成了一个完整的操作系统，就像 `Microsoft Windows` 或 `Macintosh OS X` 一样。Linux 发行版之间的不同之处取决于开发者是谁以及他们希望他们的发行版实现什么。就像一家全新的公司一样，每个发行版都有自己的目标和使命。基于此，某些发行版比其他的更受欢迎，并服务更大或更小的受众。


    任何 Linux 发行版的核心都是 `Linux kernel`。`kernel` 是一种底层计算机程序，充当用户与计算机资源之间的桥梁。它的功能包括内存管理以及输入输出设备管理。本质上，`Linux
    kernel` 是对系统中一切具有完全控制权的核心计算机程序。由于 `Linux kernel` 在不断进化，两个发行版可能会使用略不同的内核，因为开发者会进行细微更改来修复漏洞，或为自己的发行版内核添加特性和功能。


    除了 `kernel` 之外，某些发行版还配备了不同的软件和工具，例如 `X Window System`（称为 `X11` 或 `X`），以及对于系统正常运行至关重要的磁盘管理实用程序。`X
    Windows System` 是为图形用户界面（`GUI`）环境提供基础框架的软件示例。这允许 Linux 用户在显示器上绘制和移动窗口，并与鼠标和键盘交互，类似于你使用
    `Windows` 或 `Mac` 时的习惯。


    由于 Linux 发行版是一个完整的操作系统，额外的软件如服务器守护进程、网络程序、桌面环境和生产力工具也作为完整系统的一部分进行发布。这些补充软件有助于某些发行版提供特定类型的品牌。这在桌面环境和易于管理方面尤为如此。例如，特定的发行版可能预装了常用的生产力软件，如文字处理、电子表格或演示文稿程序。

    '
- fmt: '

    # Comparing Distributions


    A few examples of different Linux distributions are `Ubuntu`, `OpenSUSE`, `Debian`,
    and `Gentoo`. While they are all Linux, they look and act differently.


    ## Ubuntu

    `Ubuntu` comes with the `Unity` desktop by default. `Unity` is a well laid-out
    and graphically pleasing environment. Clicking on the dots at the bottom left
    corner of the screen brings up a selection of all the programs installed in `Ubuntu`.
    On the left portion of the screen, there is a column of icons, one of which is
    `Files`. `Files` brings up `Ubuntu`''s graphical desktop file system, which is
    very similar to `Windows Explorer`. Pre-installed on `Ubuntu` is the web-browser
    `Firefox`, which allows the user to visit any website on the internet. `Ubuntu`
    also has an app store called `Ubuntu Software`, which allows a user to search
    for software such as audio and video, games, productivity and so much more. To
    install software, simply click on the icon of that software and follow the onscreen
    instructions.


    ## OpenSUSE

    `OpenSUSE` with the `KDE` desktop environment looks like the traditional Windows
    desktop, with the start menu on the bottom left corner of the screen. Clicking
    on that button shows items like the power button, your computer, and the applications.
    Just like in `Windows`, right-clicking on the desktop gives the option to change
    the background. `OpenSUSE` also comes with the `LibreOffice` office suite, which
    works just like `Microsoft Office`. `LibreOffice` allows us to create documents,
    spreadsheets or presentations.


    ## Debian

    The `Gnome` desktop running on `Debian` looks and behaves differently from `Unity`
    or `KDE`. `Debian` is known as a "flat" operating system because it is not graphically
    pleasing. To access the applications, the user can click on `Activity` at the
    upper left corner of the `Gnome` desktop to open a menu that shows some applications
    like `Firefox`, `LibreOffice`, or its own application installer. The point is
    that all of these are accessed differently from the two previous distributions.


    ## Gentoo

    `Gentoo` comes with `XFCE`. This desktop environment has a low system requirement
    and a low intensity desktop. It looks "flatter" than the other three desktops
    environments. Resembling a `Macintosh` system, it has an application launch bar
    along the bottom middle portion of the screen. Since `Gentoo` is a lower requirement
    distribution, it can run on older computers that had slower specs than the computers
    on today’s market. In the `XFCE` desktop environment, there are several ways to
    access and run applications. Right-clicking on the desktop will show applications
    as the last option on that menu and expands to show the list of applications.
    The second way of launching applications on the desktop environment is by clicking
    the `Applications` button at the upper left corner of the screen. The magnifying
    lens located on the launcher at the bar at the bottom of the screen also allows
    us to search for the application we need to run.

    '
