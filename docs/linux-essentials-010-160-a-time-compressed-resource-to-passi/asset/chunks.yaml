    the program first executes, the value of $termcause will be set to equal 0, and
    then, if the script detects a problem that will cause termination, it will reset
    $termcause to a non-zero value. Any numeric codes may be used here since there
    is no set meaning for such codes by default. Whenever the script reaches a condition
    where it should exist, it will simply use “exist $termcause” to exit and return
    the value of the $termcause variable back to the shell as the exit value.


    | Creating a ScriptScan QR code to watch a video for this topic | ![A close up
    of a sign Description automatically generated](Image00021.jpg) |


    It is time to put together previously discussed script components into a complete
    basic script. To create a simple script, we will use the nano command and create
    a script named logic.sh by typing "nano logic.sh" at the terminal prompt. Start
    by commenting the first few lines using hashtags or the pound (#) sign. In this
    case, !/bin/bash and Simple logic test display.


    | #!/bin/bash# Simple logic test and display |


    Start by using an if command. If the first argument is going to equal 1 ($1 =
    ''1''), the system will display the next statement (then) by using echo "The argument
    entered was 1". An exit is placed, and the fi command ends the loop. The second
    if command in the script shows that if the next argument is going to equal 2 ($1
    = ''2''), the system will display the next statement (then) by using echo "the
    argument entered was 2", and an exit is placed. Next comes an else command to
    be used for cases other than the previous two arguments (the number entered is
    neither 1 nor 2) to display by using echo "the argument entered was not 2".  It
    is also exited, and an fi ends the loop.


    | if [ $1 = ‘1’ ]thenecho The argument entered was 1exitfiif [ $1 = ‘2’ ]thenecho
    The argument entered was 2exitelseecho The argument entered was not 2exitfi |


    Make sure to save the script by pressing ^O, and then press ^X to exit to the
    terminal prompt. Change the permissions of the file to make sure it can run. Type
    "chmod 755 logic.sh" to make the file executable. Typing "./logic.sh 1" should
    satisfy the first if statement and should display "The argument entered was 1"
    and so on. However, this simple script assumes that there is an argument entered
    and that there is only one argument. Otherwise it will throw errors when no argument
    is made, such as typing "./logic.sh". It will return an error:


    | diontraining@work: ~/Documents/scripts$ chmod 755 logic.shdiontraining@work:
    ~/Documents/scripts$ ./logic.sh 1The argument entered was 1diontraining@work:
    ~/Documents/scripts$ ./logic.sh 2The argument entered was 2diontraining@work:
    ~/Documents/scripts$ ./logic.sh 3The argument entered was not 2diontraining@work:
    ~/Documents/scripts$ ./logic.sh 0The argument entered was not 2diontraining@work:
    ~/Documents/scripts$ ./logic.sh./logic.sh: line 4: [: =: unary operator expected./logic.sh:
    line 10: [: =: unary operator expectedThe argument entered was not 2diontraining@work:
    ~/Documents/scripts$ |


    The first thing to do is to create a check for the number of arguments. If it
    doesn''t equal 1 (S# != 1), then it will display the usage instructions by using
    echo. This also exits, and the loop ends with the fi command. This portion of
    the script checks how many arguments there are. If you don''t have exactly one
    argument, the system quits the script. Now the script should run without throwing
    any errors, no matter how many or what argument is supplied.


    | #!/bin/bash# Simple logic test and displayif [ $# != 1 ]then echo “Usage – This
    script requires one argument that is a number.”existif [ $1 = ‘1’ ]thenecho The
    argument entered was 1exitfiif [ $1 = ‘2’ ]thenecho The argument entered was 2exitelseecho
    The argument entered was not 2exitfi |


    There is a bunch of things that we can do with scripts, as scripts can be as simple
    as the one mentioned here, or they can carry out complex logic flows. By adding
    in these logic steps when creating a script, we can test conditions by using if,
    then, and else to find out what is going on and to let the computer do the work.CHAPTER
    NINEPackages and Processes![](Image00022.jpg)OBJECTIVES


    *   Understand how package management systems function


    *   Be able to install, update, or remove a program


    *   Be able to identify running processes


    *   Understand memory usage, logging, and kernel execution'
