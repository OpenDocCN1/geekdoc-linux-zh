    \ \n\nTo perform an operation, you must enter a command. A command is essentially\
    \ a sequence of characters in a line which ends by pressing the enter key and\
    \ is then evaluated by the shell. Many commands are inspired by the English language\
    \ and form part of a dedicated command syntax language. Commands must follow certain\
    \ rules known as syntax for the shell to be able to interpret them properly. Just\
    \ as our English language has proper grammar rules so that everyone understands\
    \ what we are trying to say, so does the command language. For example, I wouldn’t\
    \ tell a server at a bar, “Some water I want,” because it would confuse them.\
    \ Instead, I would say “I want some water” because this is the natural order,\
    \ or syntax, used in the English language.\n\nTo interpret a command line, the\
    \ shell first tries to divide the line into individual words. Just like in the\
    \ English language, words are separated by spaces. The first word on a command\
    \ line is usually the command itself, while all other words on the line are parameters\
    \ that explain what the command should do in more detail.\n\n### Command Parameters\n\
    \nThere are two main types of command parameters: options and arguments.\n\n####\
    \ Options\nOptions are parameters that start with a dash or tack symbol (`-`).\
    \ These are usually referred to as switches. Each switch allows certain aspects\
    \ of the command to be turned on or off. These options can be passed separately\
    \ to the command by using a space and a dash to separate them, or you can combine\
    \ several options behind a single dash. For example, the switches `-l` `-a` would\
    \ also be equivalently written as `-la`.\n\nSome programs have more options than\
    \ can be conveniently mapped to single characters, since there are only 36 characters\
    \ available (a-z, 0-9). To allow for more options, these programs will often support\
    \ what is known as long options. Long options often start with two dashes and\
    \ allow for better readability. For example, it is clearer that `--all` indicates\
    \ the command does something to all the files than if the switch `-a` was instead\
    \ used. You cannot combine multiple long options; for example, `--all` and `--more`\
    \ cannot be combined into `--allmore`.\n\n#### Arguments\nArguments are the second\
    \ type of parameters used with commands. Arguments are any words that are not\
    \ proceeded by a leading dash. Most often, parameters are used to input the names\
    \ of files or directories against which a command should perform its intended\
