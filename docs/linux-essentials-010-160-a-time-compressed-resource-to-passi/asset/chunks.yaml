    # 创建账户


    要从 shell 创建新用户账户，请打开终端并输入 `sudo adduser username`。将 `username` 替换为目标用户名。按下回车后，系统将要求为
    `username` 设置密码。选择一个强密码。为了让系统接受，你需要重新输入一遍。之后，你可能会被要求输入新账户的用户信息，如全名、房间号、工作电话等。请注意，系统还会创建一个新组并将该用户添加到该组，同时创建用户的家目录。


    要验证该用户是否已列在系统用户列表中，请输入 `cat /etc/passwd`。这将列出系统中的所有用户。由于该用户是刚刚添加的，它应该显示在列表的底部。尽管这是一个
    `passwd` 文件，它也不会显示实际密码，密码存储在另一个文件中。`cat` 命令显示的信息将包含用户的 `UserID` 和组 ID、创建用户账户时输入的信息、家目录以及默认
    shell。


    但在一个可能拥有成千上万用户的系统中，比手动搜索有种更好的方法。输入 `grep ''^username'' /etc/passwd`（将 `username`
    替换为要搜索的用户），将生成 `etc/passwd` 文件中包含该用户名的行。要查找该用户的用户数字，请输入 `grep ''^username'' -nu
    /etc/passwd`。关于 `adduser` 命令的更多信息可以在其帮助手册（man pages）中找到。


    另一个创建用户账户的工具是 `useradd`。然而，它比 `adduser` 更麻烦，需要更长的命令字符串。要使用 `useradd` 添加用户，输入 `sudo
    useradd -s default-shell -d home-directory -m -G group-name username`。你需要将 `default-shell`
    替换为你希望该用户使用的默认 shell（通常是 `/bin/bash`）。此外，将 `home-directory` 替换为用户的默认家目录，将 `group-name`
    替换为用户将加入的组，并将 `username` 替换为实际的用户名。`useradd` 和 `adduser` 的区别在于，`useradd` 创建账户后不会自动要求分配密码。要为通过
    `useradd` 创建的用户账户分配密码，输入 `sudo passwd username`。该命令也用于更改其他用户账户的密码。


    # 修改和删除账户


    除了创建用户账户外，系统管理员还需要管理这些账户，他们需要做的操作之一包括修改和删除账户。在修改账户时，一项常见任务是重置密码。为此，输入 `sudo passwd
    username`，将 `username`


    替换为需要重置密码的用户账户。注意，这不需要像当今某些系统那样知道旧密码。这是因为 root 用户拥有修改 Linux 系统的完全控制权限。


    `passwd` 命令除了设置用户密码外，还有许多其他功能。要获取密码安全方面的用户账户信息，输入 `sudo passwd -S username`，将
    `username` 替换为账户的用户名。显示的一行将以用户名开头，后面跟着 `P`、`NP` 或 `L`。用户名后的 `P` 表示该用户设置了良好的密码；`NP`
    表示无密码；`L` 表示该用户已被锁定账户，因为他可能忘记了密码并多次输入错误密码。该行的后续信息是最后一次更改密码的日期。下一个数字表示密码的最小有效期，通常设置为
    `0`，表示用户可以根据自己的意愿和频率随时更改密码。下一组数字是密码的最大有效期（天数），通常为 `99999`。然后是密码过期预警天数，通常为 `7`。这意味着在过期前
    7 天，用户将被通知更改密码。最后一个数字是密码的空闲期。


    `passwd -S` 命令及其选项的优版本是 `chage` 命令。输入 `sudo chage -l username` 与上述 `passwd` 命令显示的行相比，以更易读的格式列出信息。参考
    `chage` 的帮助手册获取更多关于允许更改密码属性（如有效期）的其他选项的信息。


    除了修改密码，可能因为拼写错误或用户完全变更而需要修改用户名。正确重命名用户需要几个命令：`id` 和 `usermod`/`groupmod`。要识别用户，输入
    `id username`。这将显示用户 ID、组 ID 以及用户所属的组。`id` 命令可以验证正确的用户名和组分配。要更改用户名，输入 `sudo usermod
    -l newusername oldusername`，将 `newusername` 替换为新用户名，将 `oldusername` 替换为旧用户名。在成功更改用户名后，使用
    `id` 命令检查新用户名是否存在以及之前的组分配是否仍然保留。请注意，`usermod` 仅更改用户名，它不会更改组名或家目录。要更改组名，输入 `sudo
    groupmod -n newgroupname oldgroupname`，将 `newgroupname` 替换为组的新名称，将 `oldgroupname`
    替换为组的旧名称。修改用户和组属性的其他选项可以在 `usermod` 和 `groupmod` 的帮助手册中找到。


    在某些情况下我们必须从系统中删除用户，例如当员工不再与公司关联时。要删除用户，只需输入 `sudo deluser --remove-home username`，将
    `username` 替换为要删除的用户。`--remove-home` 会删除用户的家目录，从而删除其中的文件。请注意，由于是在超级用户模式下执行，更改可能是不可逆的，因此在删除用户、账户及其文件时要小心。完成用户删除另一种方法是输入
    `sudo userdel -r username`。再次参考 `deluser` 和 `userdel` 的帮助手册获取更多关于这些命令的信息。


    Linux 系统的好之处在于它们会保留创建和删除用户的日志。日志可能有所不同，但对于 Ubuntu，它位于 `/var/log/auth.log`。这是认证日志。`cat`
    和 `grep` 命令可以可以在 `auth.log` 文件中查找信息。对于最近的事件（例如最近删除的用户或组），输入 `tail -15 /var/log/auth.log`
    查看日志文件的最后 15 行，因为那里应该是记录最新事件的地方。对于用户删除事件，输入 `grep -E ''userdel'' /var/log/auth.log`
    来检查 `userdel` 命令的出现情况。


    # 管理组


    '
- fmt: '

    Previously, we talked about creating a user in the shell. Now it''s time to discuss
    managing groups. Managing groups includes creating a group, adding people to groups,
    and renaming a group. By default, in Ubuntu, whenever we create a user without
    indicating a group, it automatically creates a matching group. So, typing `sudo
    useradd tim` creates the user `tim` and the group `tim`, of which the user, `tim`,
    is a member.


    To create a new group, use the `groupadd` command. Type `sudo groupadd students`
    to create a group called `students`. To add the user `tim` which was created previously
    to the `student` group, type `sudo usermod -a -G students tim`. The `-a` option
    means add this feature, while `-G` option means add this group. To know which
    user is in which group, there is a file inside the `/etc` folder called `group`
    that we can use with the `grep` command. Typing `grep students /etc/group` would
    show lines in the `/etc/group` file that contain the word `students`. There will
    also be instances that you, as the system administrator, need to see the entire
    list of groups in the system. Typing `cat /etc/group |more` will show all the
    groups in the system, one page at a time. Hitting space on the keyboard brings
    the view to the next page.


    To rename a group, type `sudo groupmod -n oldstudents students`. The `-n` option
    indicates that the word after the option becomes the new name of the group, while
    the next word is the name of the target group to be changed. Refer to the man
    pages of `groupadd` and `groupmod` for more information on these commands.


    ## Working with the Root User


    On every Linux computer, there is one user that has the extraordinary power needed
    to manage the whole system. This user is known as the `root` user, also known
    as the super user or administrator.


    When most people use computers to do ordinary day-to-day computer tasks (known
    simply as user tasks), they don’t require any special privileges. For example,
    if a user wants to create a new text document within their home directory, this
    is a user task and their user account has all the permission necessary to create
    the file.


    The `root` user account, on the other hand, exists to perform administrative tasks
    such as installing new software, preparing a new disk, and managing all the other
    ordinary user accounts on the system. These administrative tasks require access
    to many different system and configuration files that ordinary users simply cannot
    access or modify.


    There are three different ways to access the powers of the `root` user. The first
    method is to simply login directly as the `root` user from the shell using the
    text-mode or by using a remote login tool such as `SSH`. Due to security restrictions
    within some distributions, though, this method may not be enabled.


    The second method is to use the `su` command. The `su` (switch user or substitute
    user) command enables a user to change their user identity within the current
    shell. By typing `su` at the terminal, the user effectively becomes the `root`
    user and gains all their permissions. For this to work, the user must then enter
    the password for the `root` user, thereby proving that they have permission to
    use that account. Once the `root` privileges are acquired in this way, any subsequent
    commands typed into the shell will run as with the elevated privileges of the
    `root` user. To return to the status of a normal user, simply type `exit` at the
    terminal to relinquish superuser status.


    The third method is to use the `sudo` command. The `sudo` (super user do) command
    is similar to the `su` command, but it only provides root privileges for a single
    command. For example, to edit the `/etc/shadow` file, a user may type `sudo nano
    /etc/shadow` to run the `nano /etc/shadow` command with root privileges. Using
    the `sudo` command is considered the best practice when operating using the root
    user’s permissions, since it only applies to a single command at a time.


    When operating as the `root` user, we should take additional precautions. As Uncle
    Ben from Spiderman once said, “With great power comes great responsibility.” Nowhere
    is this truer than when operating as the `root` user.


    Since a `root` user has permission to access, modify, and delete every file on
    the hard drive, one mistyped command as root could accidently wipe out critical
    application files and cause hours of downtime on a Linux server. Conversely, if
    an intruder gains root access to a Linux system, that intruder can now make unintended
    changes or cause damage to the computer’s system files, change ownership or permissions
    on ordinary user files, or install backdoors and rootkits that allow them to continually
    maintain remote access to everything on that system. Therefore, it is imperative
    that users always take the following seven precautions whenever they consider
    using the root user’s permissions and access.


    1. **First**, the user should ask if they really need root access. Many times,
    there is a better or more secure method of accomplishing the same goal without
    having to log in as the superuser.

    2. **Second**, if a user is operating as the root user, it is imperative that
    they always double check the command before pressing the enter key. Whenever I
    am operating as root, I type the command, remove my hands from the keyboard, review
    the command, and verify it is completely accurate before pressing Enter. When
    operating as root, a simple typo or error can be completely catastrophic. For
    example, let’s assume that the user is in the `/home/jason/documents` directory
    and wants to delete all the files within the directory. The user wanted to enter
    the command `rm -rf *.*`, which would remove every file within the directory.
    But, the user mistyped the command as `rm -rf /*.*`, which would remove every
    file within the root of the file system instead. The simple addition of the `/`
    drastically changes the meaning of this command, and it could render the operating
    system completely unusable and unable to boot up.

    3. **Third**, when operating as root, never run a suspicious program. Any program
    downloaded from the internet could be designed to compromise the security of your
    system. If you run the program as root, the program could then have full access
    to the entire system and not just the user’s own account.

    4. **Fourth**, whenever operating using root privileges, use those permissions
    for as short of a time as possible. Again, it is recommended to utilize the `sudo`
    command instead of using `su` or logging in directly as the root user. This will
    limit the length of time that the user is operating as root to a single command
    only.

    5. **Fifth**, never leave a shell that is operating as the root user accessible
    to others. When performing maintenance tasks that require the root user’s permissions,
    always enter `exit` in the root shell prior to walking away from the system.

    6. **Sixth**, always use a long, strong password for the root account. The root
    account’s password must be well-protected, and the password should never be reused
    on any other user account.

    7. **The seventh and final precaution** is to never share the root password with
    other users. If working in a public area, be cautious and ensure that no one is
    looking over their shoulder when entering the root password.


    The root user and its permissions provide the ultimate power for a user or system
    administrator on any Linux system. For this reason, it is important to always
    ensure the account remains protected and its utilization carefully monitored.


    # CHAPTER TWELVE

    ## Ownership and Permissions![](Image00027.jpg)


    ### OBJECTIVES


    * Be able to set the ownership of a files and directories

    * Understand and calculate permissions for files and directories

    * Explain sticky bits and special execute permissions

    * Be able to configure permissions for files and directories

    '
