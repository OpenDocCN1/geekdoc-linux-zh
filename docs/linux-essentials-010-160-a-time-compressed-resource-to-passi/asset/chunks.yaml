    service or daemons.The first step in diagnosing a problem with a daemon is to
    locate its log file. In Linux, most log files are stored in the /var/log directory.
    For the LPI Linux Essentials certification exam, it is important to remember where
    log files are commonly store. While the following log files and directories within
    the /var/log directory are not an exhaustive list, they do makeup some of the
    most important log files on any Linux system: boot.log, messages or syslog, secure,
    cups, gdm, secure, and Xorg.0.log.The boot.log file is used to summarize the services
    or daemons that start late in the boot process via SysV startup scripts. If your
    Linux system is having issues during the boot up process, you should review the
    boot.log file to see if an error message was recorded in the log file.There are
    also general-purpose log files that contains messages from many different daemons
    on a given Linux system. These are known as messages or syslog. There log files
    store messages from various daemons when they do not have their own dedicated
    log files.If your system is having an issue regarding security, such a log of
    which users attempted to use su, sudo, and other root privilege mechanisms, then
    you should check the log file known as secure. This file is located at /var/log/secure
    and is used for all security-related messages within the system.The /var/log/cups
    directory is used to hold log files related to the Linux printing system. CUPS
    is an acronym for the Common UNIX Printing System, and it is a modular printing
    system for Unix and Linux systems which allows the computer to act as a print
    server. If you are experiencing an issue with printing from your Linux machine,
    you should review the logs within the cups directory.The /var/log/gdm directory
    holds log files related to the GNOME Display Manager (GDM), which handles GUI
    logins on many systems. GNOME is a commonly used desktop GUI on many Linux distributions,
    so if you have an issue with the graphical user interface, then reviewing the
    logs within the gdm directory is a good place to start your troubleshooting efforts.There
