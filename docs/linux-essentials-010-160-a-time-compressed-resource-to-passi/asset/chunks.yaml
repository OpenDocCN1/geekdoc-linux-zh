    Linux 是一个多用户操作系统，这意味着单台 Linux 计算机可以支持许多用户，每个用户都有自己唯一的账户。在本书的这一章节中，我们将讨论重要的账户原则以及用于操作这些账户的命令。我们还将介绍
    root 用户账户，它拥有执行大多数系统管理任务的特殊权限。此外，我们还会讨论组（groups），组是用户账户的逻辑集合，组可以在 Linux 系统中被赋予特殊权限。


    ## 理解用户账户

    通过利用用户账户，多个用户可以共享同一台物理计算机，同时为他们的程序和数据文件保持逻辑上的隔离。由于每个人都被分配了一个唯一的用户账户，系统管理员可以跟踪谁正在使用系统资源，以及谁在
    Linux 系统中执行了哪些操作。


    每个用户账户的特征定义在 `/etc/passwd` 文件中。该文件包含由冒号分隔的行，每行包含一条定义单个用户账户的记录。这些记录的各个字段中包含的信息包括用户名、密码、`UID`、`GID`、注释字段、家目录以及该用户的默认
    shell（外壳程序）。


    位于冒号分隔行中的第一个字段是账户的用户名。这是最相关的特征，因为它唯一标识了所有其他属性将要应用的用户。Linux 账户用户名由字母和数字组成，但按照习惯，大多数用户名仅使用小写字母创建。在某些
    Linux 发行版中，下划线、句号和连字符也是有效字符。如果包含特殊字符美元符号$`，它必须出现在用户名的末尾。


    下一个字段是密码。每个用户账户通常由密码保护，登录计算机时需要密码。当用户输入用户名和密码时，将创建一个成功的的身份验证并允许访问。最初在 Linux 中，密码存储在该字段中，但由于安全问题，密码字段现在被单独的
    `x` 取代。`x` 字符告诉系统，该用户的实际密码将存储在 `/etc/shadow` 文件中，而不是 `/etc/passwd` 文件，因为 `/etc/shadow`
    文件更安全，只有 root 用户可以访问该文件。在 `/etc/shadow` 文件中存储密码时，首先会使用单向算法对其进行哈希（hash）处理，然后进行加盐（salted）处理，以确保没人能从
    `/etc/shadow` 文件读取用户的密码。


    每个账户提供的用户名只是一个人类可读的标签，计算机通过它来识别系统上的每个用户账户。实际上，计算机使用称为用户标识（`UID`）的数字标识码来跟踪这些用户。`UID`
    始终从 0 开始，并根据系统中创建的账户数量向上递增。root 用户始终是 `UID 0`。在大多数发行版中，用户账户将从 `UID` 数字 1000 开始。因此，如果用户在全新的
    Linux 安装系统上创建了两个名为 `jason` 和 `diontraining` 的账户，这些账户将别为 `UID 1000` 和 `10001`。1000
    以下的 `UID` 数字留给系统账户和服务账户。


    在 `UID` 字段之后，显示的是组标识（`GID`）数字。此 `GID` 与一个或多个组关联，每个组可以包含一个或多个用户。就像目录和文件夹存放许多文件一样，组收集了许多在系统中具有相同功能或需要相同权限的用户。系统管理中的最佳实践之一是，始终通过将资源分配给组而不是单个用户来为该资源分配权限。这允许系统管理员根据预期的功能快速地为各种用户提供资源访问。


    下一个字段是注释字段。该字段通常包含用户的全名，但系统管理员确实可以在此注释字段中存储他们想要的任何类型的信息。


    家目录的位置是冒号分隔行中的下一个字段。每个用户账户都有一个分配的家目录，该区域是用户可以存储其所有文件、子目录和个人配置文件的地方。就像 Windows
    系统上的每个用户都有位于 `c:\Users\<username>` 的文件夹一样，Linux 系统也为用户文件维护了一个类似的区域。默认情况下，它位于 `/home/<username>`，但某些发行版将其放置在不同的位置，例如
    `/Users/<username>`。系统管理员也可以将用户的家目录位置设置为为系统上的任何位置。


    最后一个字段是分配给该用户账户的默认 shell 位置。通常，此 shell 将设置为位于 `/bin/bash` 的 `bash` shell。用户可以根据自己的喜好将账户的默认
    shell 配置为任何喜欢的 shell，包括 Bourne Again Shell (`bash`)、Korn shell (`ksh`)、TENEX C
    Shell (`tcsh`) 和 Z shell (`zsh`)。


    ## 账户安全

    为了确保用户账户的安全，我们应该分配一个长且强密码。在 Linux 的早期版本中，密码信息实际上位于 `/etc/passwd` 文件中，但这种做法很快被修改了，因为
    `/etc/passwd` 文件对所有用户都是可读。因此，在 `/etc/passwd` 文件中明文存储用户密码是极其危险的，而且是一种糟糕的安全实践。


    今天，密码存储在 `/etc/shadow` 文件中。该文件普通用户无法读取，只有 root 用户或系统本身可以访问。每个用户密码都以加盐哈希摘要（salted
    hash digest）的形式存储。加盐哈希使用单向数学算法结合额外的随机输入（称为“盐”）来产生一种安全的密码存储方法。当用户尝试登录系统时，他们输入的密码经过加盐和哈希处理，然后将此结果与
    `/etc/shadow` 文件中存储的内容进行比较。如果输入和存储值匹配，用户即可访问系统。


    与 `/etc/passwd` 文件一样，`/etc/shadow` 文件包含系统上每个用户的记录，每条记录包含一行带有冒号分隔字段的数据。


    第一个字段是用户名。与 `/etc/passwd` 文件不同，`/etc/shadow` 文件不依赖 `UID` 来识别用户。相反，使用唯一的字母数字字段来标识用户名，例如
    `jason` 或 `diontraining`。


    第二个字段包含密码，以加盐哈希的形式存储。由于是加盐哈希，密码与真实密码没有任何相似之处。如果密码中包含星号（`*`）或感叹号（`!`），则表示账户已锁定。大多数情况下，锁定的账户是系统账户，终端用户不会直接登录。


    密码字段之后，下一个字段是“上次更改密码日期”。该字段包含密码上次更改的日期，其他操作系统通常将其称为密码有效期。该日期以整数形式存储，基础是自 1970
    年 1 月 1 日以来的天数，而不是儒略历日期。


    第四个字段包含“允许更改的天数”。此值以整数形式存储，安全专业人员经常使用它来防止用户在系统上多次更改密码。


    “强制更改前的天数”是下一个字段。该字段使用代表天数的整数规定了何时必须再次更改密码。例如，如果该值设置为 `7`，则密码必须在一周（7 天天）后重置。


    下一个字段是“过期前的警告天数”。如果设置了此字段，系统将配置为向用户提供警告，告知其密码需要在指定的天数内更改。


    “过期与停用之间的天数”是下一个字段。在 Linux 系统中，系统管理员还可以配置系统在账户过期和实际停用之间的一个特定时间。该字段位于 `/etc/shadow`
    文件中。当账户过期时，用户的密码将从文件中删除，这需要系统管理员手动重新激活账户。


    要确定账户何时过期，请参阅“过期日期”字段。该字段显示账户将过期的日期，它用为自 1970 年 1 月 1 日以来的天数的整数形式表示。要求每个账户每 60
    天至少使用一次是一种安全实践。如果账户在 60 天内未被使用，则应被标记为过期，并在该时间之后被停用。


    最后一个字段是“特殊标志位”字段。该字段留供以后使用，通常在 Linux 系统上不被使用。如果被使用，它通常包含一个对用户或系统无意义的无效值。由于 `/etc/shadow`
    文件中包含了密码和安全信息，该文件的权限被设置为高度限制，且所有者被设置为 root 用户。这防止了非 root 用户访问、读取或修改该文件并获取加盐后的密码。


    重要的是，要理解用户账户并不是一个单一的东西。账户由许多不同的信息组成，分散在多个文件中，例如 `/etc/passwd`、`/etc/shadow`、`/etc/group`。

