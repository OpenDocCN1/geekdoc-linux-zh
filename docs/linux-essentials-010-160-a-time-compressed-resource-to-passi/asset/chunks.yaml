    a non-Linux filesystem from some removable media, a non-Linux partition on a dual-boot
    computer, or using a network filesystem, it is highly likely that case-insensitive
    rules will apply.For example, if you are accessing a FAT or NTFS formatted volume
    (which is commonly used in Windows), then case insensitivity will apply, and the
    Linux operating system can understand and use that case insensitivity without
    any issues.But, to further complicate things, some shells (like bash) and programs
    always assume case sensitivity, even if they are accessing a case-insensitive
    filesystem. Due to this, it is a best practice to always treat your files with
    case sensitivity regardless of the operating system or filesystem format you are
    using if you are working with Linux and other operating systems.Manipulating DirectoriesMost
