- fmt: "\nNetworking is a critical part of modern computing. That’s why most Linux\
    \ distributions are capable of automatically creating a network connection when\
    \ a user first boots up a Linux system. Unfortunately, there are some rare occasions\
    \ when this automated process does not work properly. When this occurs, the user\
    \ may need to uniquely configure the connection or debug a given problem.\n\n\
    # Basic Network Features\n\nBefore you can understand how to configure, test,\
    \ or protect a network connection, it is important to understand some of the most\
    \ basic network features and terms. This includes commonly used network components\
    \ like the internet, `ethernet`, `Wi-Fi`, `TCP/IP`, `DHCP`, an `IP address`, the\
    \ `network mask`, the `router`, and `DNS`.\n\nMost users are already familiar\
    \ with the internet since they use it every day. In fact, when you bought this\
    \ book online, you were using the internet. The internet simply refers to the\
    \ globe-spanning network of interconnected computers that use the standard Internet\
    \ protocol suite (`TCP/IP`) to communicate.\n\nTo connect to the internet, most\
    \ uses will use a wired or wireless network. A wired network is often referred\
    \ to by the hardware that network uses called `ethernet`. Technically, `ethernet`\
    \ is a specific way of breaking the data down into frames of information and then\
    \ transmitting those frames over a media (such as a wire or radiofrequency wave),\
    \ but most people refer to wired networks as “ethernet networks”. This `ethernet`\
    \ standard is defined within the `IEEE 802.3` documentation standards.\n\nIf you\
    \ are using a wireless network, though, this is defined in the `IEEE 802.11` standard\
    \ and referred to as `Wi-Fi`. While there are other wireless networking standards\
    \ that exist, such as cellular and `Wi-Max`, the most common for desktops, laptops,\
    \ and other Linux-enabled devices is `Wi-Fi`.\n\nRegardless of whether your devices\
    \ uses a wired or wireless connection, it is most certainly using `TCP/IP` to\
    \ transmit the data from your system to another. The Transmission Control Protocol/Internet\
    \ Protocol (`TCP/IP`) is a set of standards that underlie most modern network\
    \ communications at the software level. Every network connected device these days\
    \ supports the `TCP/IP` protocol to communicate. For over 30 years, this has been\
    \ the de facto standard, and it can be used with both wired and wireless connections.\n\
    \nIn order for your device to communicate on a network using `TCP/IP`, that device\
    \ must have a way for other devices to uniquely identify it. This can be done\
    \ using its `hostname` or an `IP address`. A `hostname` is an alphanumeric name\
    \ that a computer uses in order to be easily identified by humans. These hostnames\
    \ consist of a computer portion and a network portion. For example, if you refer\
    \ to the `hostname` of `www.diontraining.com`, you are really referring to the\
    \ computer serving as our company’s web server (known as `www`) on the network\
    \ (known as `diontraining.com`).\n\nUnfortunately, though, computers don’t understand\
    \ these alphanumeric hostnames since computers are logical, mathematical creatures.\
    \ Therefore, each computer much have a unique Internet Protocol (`IP`) address\
    \ that can be used to identify itself on a given network. An `IP address` is used\
    \ by computer to communicate with each other easily. \n\nThere are two types of\
    \ `IP address` formats, known as `IPv4` and `IPv6`. `IPv4` is the older format\
    \ and utilizes a 32-bit address in the form of four decimal numbers separated\
    \ by dots and each of those numbers should be between 0 and 255, such as `10.4.62.178`.\
    \ The issue with `IPv4` addresses is that there are only 4.2 billion unique addresses.\
    \ While that sounds like a lot (and it used to be), in modern networks like the\
    \ internet have quickly depleted this amount of `IP` addresses.\n\nTo replace\
    \ `IPv4`, a newer variant known as `IPv6` was introduced. `IPv6` uses a 128-bit\
    \ address that consists of hexadecimal digits separated by semi-colons. Due to\
    \ the much large bit size of the address, there are over 3.4 x 1038 `IPv6` addresses\
    \ available for use. \n\nFor the LPI Linux Essentials exam, it is not important\
    \ to remember the number of `IPv4` and `IPv6` addresses, but you should be able\
    \ to identify these addresses based on sight. For example, if you see `192.168.1.1`,\
    \ you should identify it as an `IPv4` address, whereas if you see an address like\
    \ `fe80::afdc:48ff:fe00:5577`, you should identify it as a `IPv6` address.\n\n\
    So, if computers prefer numbers, but people prefer easier to read and remember\
    \ hostnames, how can we associate both the `hostname` and the `IP address` together?\
    \ To perform this function, a system known as the Domain Name System (`DNS`) was\
    \ created. `DNS` is a global network of servers that automatically translates\
    \ between hostnames and `IP addresses` for our systems. To use `DNS`, your Linux\
    \ system simply needs to have the `IP address` of the `DNS` system added as part\
    \ of the network configuration. Then, whenever the user types a `hostname` or\
    \ domain name into an application, such as entering `www.diontraining.com` in\
    \ a Google Chrome web browser, the application will ask `DNS` to convert the name\
    \ (`www.diontraining.com`) into its assigned `IP address`, and then the browser\
    \ can connect to the remote server using its `IP address`.\n\nTo properly configure\
    \ your Linux system to use the network, it needs four pieces of information: its\
    \ own `IP address`, its `network mask`, the `IP address` of its gateway, and the\
    \ `IP address` of a valid `DNS` server. \n\nIn `IPv4`, when an `IP address` is\
    \ assigned, it must also be provided with a `network mask` that identifies what\
    \ network the host is contained within. By using a `network mask` (`netmask`),\
    \ the system determines which portion of the `IP address` represents the host\
    \ and which portion represents the network. For example, if a user’s system is\
    \ assigned the `IP address` of `192.168.1.56` with a `netmask` of `255.255.255.0`,\
    \ this signifies that this host is `56` and is part of the `192.168.1.0` network.\
    \ The concept of subnetting heavily uses these conventions, but that is beyond\
    \ the scope of this book and LPI Linux Essentials exam. If you want to learn more\
    \ about subnetting and `netmasks`, I highly recommend considering the CompTIA\
    \ Network+ certification courses.\n\nThe final component of the network configuration\
    \ is the `IP address` of the system’s `gateway`. Every system can communicate\
    \ within its own network by default, such as `192.168.1.0` network `netmask` `255.255.255.0`\
    \ example above. But if the user wanted to communicate with another system in\
    \ a different network (such as `172.16.0.65` or `www.diontraining.com`), then\
    \ the traffic must be routed through a `gateway`. A `gateway` is a device that\
    \ connects two or more networks together. When a user connects to the internet,\
    \ they are actually connecting through a gateway, most commonly their network’s\
    \ `router`. This `router` links to another network, which in turn links to another,\
    \ until it reaches the final destination. Most home and small businesses simply\
    \ use `router` combination device to connect to the Internet and perform routing,\
    \ `DNS`, and other useful services.\n\n# Configuring a Network Connection\n\n\
    Most often, the network connection will be configured automatically, and `DHCP`\
    \ assigns the vital network information. Sometimes, though, those details will\
    \ have to be configured manually or the network interface must be enabled for\
    \ it to function. As stated earlier, a computer requires (at a minimum) two pieces\
    \ of information to connect to a local network: an `IP address` and a `netmask`.\
    \ If you want the computer to also be able to perform name resolution and gain\
    \ access to an external network, then `DNS` and the `gateway` must also be configured.\
    \ Configuring every computer on a large network with all this information is time-consuming.\
    \ Additionally, this manual configuration can lead to problems caused by human\
    \ errors, such as mistakes created when entering the `IP address` and other critical\
    \ information. For this reason, most enterprise networks provide a `DHCP` server\
    \ that assigns all this critical information to the other computers within the\
    \ network when they first connect.\n\nDepending on the configuration of the server,\
    \ `DHCP` can deliver `IP addresses` using either fixed or dynamic configurations.\
    \ A fixed configuration ensures that the `DHCP` server provides each computer\
    \ with the same `IP address` every time it boots up and connects to the network.\
    \ A dynamic configuration instead has the `DHCP` server provide each computer\
    \ with an `IP addresses` each time it boots up, but this `IP` doesn’t have to\
    \ remain the same each time.\n\nEach computer can use either a wireless or wired\
    \ network connection. Wireless connections are common on laptops, tablets, smartphones,\
    \ and internet of things devices since they often lack a physical network cable\
    \ due to their size or configuration. Some desktops, though, have `Wi-Fi` capabilities\
    \ in addition to their wired connections.\n\nTo easily configure the `Wi-Fi` connection,\
    \ it is best to use the graphical user interface. Each distribution uses a different\
    \ method and setup for connecting to `Wi-Fi`, so you should consult your distribution’s\
    \ online manual or forums for details of how to do this. For most distributions,\
    \ connecting to the `Wi-Fi` through the graphical interface works similarly to\
    \ a Windows or Mac computer and relies on a point and click interface.\n\nIf someone\
    \ needs to fine-tune the wireless connection, they can use various tools to scan\
    \ for available wireless networks and manage the existing `Wi-Fi` links connected\
    \ to a given system. To do this, the user can utilize the `iwlist` and `iwconfig`\
    \ utilities. The `iwlist` command can identify nearby `Wi-Fi` networks by scanning\
    \ the airwaves within the `Wi-Fi` frequency bands of `2.4 Ghz` and `5.0 Ghz`,\
    \ depending on the type of wireless adapter installed within the user’s system.\
    \ To scan for a list of nearby networks, simply type:\n\n```\niwlist scan\n```\n\
    or `iwlist scanning` as either the root user or using the `sudo` command to obtain\
    \ a complete list of the networks. Once a network is found, a user can manually\
    \ connect or disconnect from a specified network using the `iwconfig` utility.\
    \ There are numerous options and flags that can be used with `iwconfig` command,\
    \ so ensure you are using it properly. To configure a wired connection, a user\
    \ may simply use the graphical interface like they would within Windows or Mac.\
    \ If the user requires more fidelity and control over the configuration, then\
    \ we may use command line tools instead. Just as `iwconfig` configures a wireless\
    \ network, the `ifconfig` command configures a wired network.\n\nDHCP is an automated\
    \ mechanism that most computers use to obtain their network configuration from\
    \ a server. This is extremely useful, especially in large scale corporate networks\
    \ with thousands of computers that need to be configured. By relying on `DHCP`,\
    \ a system sends out a broadcast message on the network to discover if a `DHCP`\
    \ server is available. At this point, the requester now has all the information\
    \ needed to automatically configure its own network connection and the DHCP process\
    \ is known as DORA: Discover, Offer, Request, and Acknowledge. For the LPI Linux\
    \ Essentials exam, though you are not required to understand this four step process\
    \ in-depth, you should remember that `DHCP` automatically configures a network\
    \ connection within a Linux system.\n\n# Testing the Network\n\nIn most cases,\
    \ the network connection will work fine from the moment the Linux system boots\
    \ up. However, there are times when a user may need to diagnose a problem with\
    \ the network because a formerly working connection has stopped working. There\
    \ are several ways to test for network connectivity. The first network test checks\
    \ the routing table using the `route` command to ensure the default route is properly\
    \ set and to check that the routing is sensible. In most cases, typing `route`\
    \ by itself at the terminal will display the routing table of a typical workstation\
    \ or server which is generally simple and can be automatically configured. If\
    \ the Linux system is functioning as a network router, though, these often require\
    \ complex routing tables which are beyond the scope of LPI Linux Essentials exam.\n\
    \nThe next most basic connectivity test uses the `ping` utility. The `ping` command\
    \ sends a simple network packet to the system via `IP address` or `hostname`,\
    \ and waits for a reply. In Linux systems, `ping` continually sends packets once\
    \ every second until the command is interrupted with the `Ctrl+C` keystroke combination.\
    \ To diagnose where a network problem resides when using the `ping` command, you\
    \ must consider three scenarios:\n\nFirst, if you can `ping` a system on the internal\
    \ network but not a system on an external network, the problem is probably in\
    \ your router or in an improper router specification. Stated another way, if you\
    \ can `ping` another workstation within your network but cannot `ping` a website\
    \ like Google or Facebook, then the issue must exist with the router or the external\
    \ network connection.\n\nSecond, if you can `ping` a system by its `IP address`\
    \ but not by its name, then the problem is most likely with the `DNS` server or\
    \ your system’s `DNS` configuration settings. So, if you can successfully run\
    \ `ping 8.8.8.8`, but you get an error when running `ping diontraining.com` then\
    \ the issue is likely caused by a `DNS` issue.\n\nThird, if you cannot `ping`\
    \ any systems at all, then you probably have a fundamental configuration problem\
    \ on your system. This could be caused by a corrupted network software stack or\
    \ even faulty hardware on your Linux system. In any case, the problem exists within\
    \ your machine, and not with the larger network or remote systems.\n\nWhile `ping`\
    \ is very useful in testing the entire connection from your system to the remote\
    \ system, there is a more useful tool that can be used when you are trying to\
    \ determine where exactly the connection is broken between your system and the\
    \ remote system. To determine where the break in connectivity is occurring, a\
    \ command known as `traceroute` is utilized. The `traceroute` command sends a\
    \ series of three test packets to each system between your computer and a specified\
    \ remote system. As `traceroute` conducts each set of tests, it displays the results\
    \ on the screen to inform the user of which systems are reported as functional\
    \ and which may be the cause of the break in connectivity. This is helpful for\
    \ determining whether a problem in network connectivity exists within a network\
    \ which you are responsible for or if it is problem with an external connection\
    \ and, therefore, a problem for your internet service provider to solve.\n\nAs\
    \ stated earlier, the problem may be caused by an issue with the domain name system\
    \ (`DNS`). `DNS` is the internet's equivalent of a phone book; it maintains a\
    \ directory of domain names and translates them to Internet Protocol (`IP`) addresses.\
    \ This is necessary because, although domain names are easy for people to remember,\
    \ computers or machines need to access websites based on `IP addresses`. `DNS`\
    \ problems can cause networks to fail almost as badly as a physically cut cable.\
    \ Because both people and many network tools rely on hostnames, if `DNS` resolution\
    \ doesn’t work, the network connection becomes unusable. To automate this process,\
    \ many distributions create network scripts to help with this boot up and configuration.\
    \ Each distribution uses its own methods and scripts for this purpose, and these\
    \ are referred to as distribution-specific network scripts.\n\nThe final component\
    \ of the network configuration is the `IP address` of the system’s `gateway`.\
    \ A `gateway` is a device that connects two or more networks together. When a\
    \ user connects to the internet, they are actually connecting through a gateway,\
    \ most commonly their network’s `router`. This `router` links to another network,\
    \ which in turn links to another, until it reaches the final destination. Most\
    \ home and small businesses simply use `router` device to connect to the Internet\
    \ and perform routing, `DNS`, and other useful services.\n\nProtecting the Network\n\
    \nThese days, one of the most important issues is security. To enable this, though,\
    \ the Linux machine must have `DHCP` client installed. The most common clients\
    \ are known as `dhclient` or `dhcpcd`. As stated earlier, the problem may be caused\
    \ by an issue with the domain name system (`DNS`). To make these changes permanent,\
    \ the settings must be stored within a configuration file called `/etc/resolv.conf`.\
    \ This file contains the `IP addresses` up to three `DNS` servers as well as the\
    \ name of the computer. If you need to modify the entries used by a given system,\
    \ this can be done within `/etc/resolv.conf`.\n\nTo automate this process, many\
    \ distributions create network scripts to help with this boot up and configuration.\
    \ Each distribution uses its own methods and scripts for this purpose, and these\
    \ are referred to as distribution-specific network scripts. To protect the network,\
    \ you should always shut down any unused services or daemons. A firewall is a\
    \ software program or system setting that inspects each transactions and then\
    \ allows or disallows based on programmed criteria. Most distributions enable\
    \ embedded software firewalls by default.\n\nAs stated earlier, the problem may\
    \ be caused by an issue with the domain name system (`DNS`). `DNS` is the internet's\
    \ equivalent of a phone book; it maintains a directory of domain names and translates\
    \ them to Internet Protocol (`IP`) addresses. This is necessary because, although\
    \ domain names are easy for people to remember, computers or machines need to\
    \ access websites based on `IP addresses`. `DNS` problems can cause networks to\
    \ fail almost as badly as a physically cut cable. Because both people and many\
    \ network tools rely on hostnames, if `DNS` resolution doesn’t work, the network\
    \ connection becomes unusable.\n\nTo protect the network, you should always shut\
    \ down any unused services or daemons. A firewall is a software program or system\
    \ setting that inspects each transactions and then allows or disallows based on\
    \ programmed criteria. Most distributions enable embedded software firewalls by\
    \ default.\n\n(Wait, the provided text had significant repetitions at the end.\
    \ I will consolidate the unique protection content based on the final paragraphs\
    \ provided.)\n\nThese days, one of the most important issues is security. To enable\
