  trans: "\n此基础条件判断会评估文件（`tempfile.txt`）是否存在于 `/tmp` 目录。如果文件存在，则条件为真，并将执行“then”分支以使用\
    \ `echo` 命令显示消息，然后脚本将退出。如果条件判断发现文件不存在，则将跳过 `echo` 和 `exist` 命令，并在遇到 `fi` 命令时结束\
    \ `if` 条件。`fi` 命令仅用于显示 `if` 语句块的结束，如上所示。\n\n如果你的脚本在运行运行时会创建一个文件，那么像上面那样的条件判断可能会很有用。如果你在脚本开始时检查该文件是否已经存在，并且测试结果为真，那么这表明脚本已经在运行或正在运行。如果需要，`if`\
    \ 命令也支持使用关键字 `test` 而不是方括号。以下变体同样有效：\n\n```\nif test -f /tmp/tempfile.txt\nthen\n\
    echo “/tmp/tempfile.txt was found; aborting script.”\nexit\nfi\n```\n\n另一个有用的测试条件是使用命令的输出作为测试用例，例如下面的伪代码：\n\
    \n```\nif [command]\nthen\n[additional commands]\nfi\n```\n\n在上面的伪代码中，只有当测试条件中的命令执行成功时，额外的命令才会运行。如果命令返回任何错误代码，则额外的命令在脚本执行期间将简单地跳过。`if`\
    \ 命令还支持定义当条件不满足时应该运行哪些命令的功能。这通常被读作“如果……那么……否则……”。例如，你可能会听到程序员和脚本编写者说：“如果条件为真，就执行这个，否则（其他情况下）执行那个。”\n\
    \n```\nif [command]\nthen\n[do this command]\nelse\n[do that command]\nfi\n```\n\
    \n这种类型的编码将导致执行两个分支中的一个：要么是 `then`，要么是 `else`。当程序员允许程序根据特定条件对运行哪些命令或对哪些文件进行操作做出选择时，这种方法非常有用。需要注意的是，在上面的伪代码中，根据需要可以在\
    \ `then-else` 的每个分支中添加多个命令或行代码。\n\n虽然 `if-then-else` 对于具有两种结果的条件和选择效果良好，但有时这具有局限性。例如，如果你创建一个脚本，作为运行脚本的用户的菜单选项的一部分，在屏幕上显示四个选择，然后用户输入数字\
    \ 1、2、3 或 4，脚本根据该数字运行特定的命令。使用 `if-then-else` 命令将需要一个相当杂乱的决策树，如下伪代码所示：\n\n```\n\
    if [$userchoice == 1]\nthen\n[do command #1]\nelseif [$userchoice == 2]\nthen\n\
    [do command #2]\nelseif [$userchoice == 3]\nthen\n[do command #3]\nelseif [$userchoice\
    \ == 4]\nthen\n[do command #4]\nelse\necho “Error – User didn’t enter 1, 2, 3,\
    \ or 4.”\nfi\n```\n\n虽然这段伪代码具有功能性，但这些嵌套的 `if-then-else` 语句相当笨拙且难以理解。幸运的是，shell\
    \ 脚本为我们提供了一个合适的替代方案，即 `case` 语句，用于多可能结果的情况。考虑以下使用 `case` 语句的伪代码，它的功能与上述嵌套的 `if-then-else`\
    \ 相同：\n\n```\ncase $userchoice in\n1)      [do command #1];;\n2)      [do command\
    \ #2];;\n3)      [do command #3];;\n4)      [do command #4];;\nesac\n```\n\n通常，`case`\
    \ 语句使用一个变量，右括号之前显示的每个模式都是该变量的一个可能值。在上面的示例中，我们期望用户输入值 1、2、3 或 4。每组命令都以双分号结束，以表示该特定\
    \ case 动作的结束。这允许从每个与用户在 `$userchoice` 中输入的值匹配的 `case` 中运行多个命令。在 `case` 结束处，我们使用关键字\
    \ `esac`，它是 `case` 的反拼写法，就像 `fi` 用于 `if` 一样。\n\n使用 `case` 语句时，变量（上述示例中的 `$userchoice`）会简单地找到匹配的\
    \ case（例如 3），并执行该单行内容直到遇到双分号。一旦遇到双分号，脚本将跳转到 `esac` 关键字之后的行。如果没有找到匹配的 case 值，则没有任何语句将执行，脚本将在\
    \ `esac` 关键字后恢复操作。\n\n### 循环\n\n到目前为止，涵盖的所有脚本组件都只会执行一次。例如，如果考虑 `if-then-else`\
    \ 或 `case` 且测试用例目前不匹配它，它将被跳过且永远不会执行。遗憾的是，有时多次执行某些操作或多次测试条件以查看条件是否发生变化是很重要的。为了做到，我们使用一种称为循环的特殊结构。循环允许脚本重复执行相同任务，直到满足特定条件或直到某个条件不再成立。考虑以下循环，并尝试确定当用户执行此脚本时它会导致什么。\n\
    \n```bash\n#!/bin/bash\nfor x in ‘ls *.txt’; do\ncat $x\ndone\n```\n\n在这个示例中，循环将为\
    \ `ls *.txt` 返回的每个项目执行一次。因此，假设当前目录下有 3 个文件：`foo1.txt`、`foo2.txt`、`foo3.txt`。执行此脚本时，循环首先运行\
    \ `ls *.txt` 并获得一个列表。由于有三个文件，此循环将执行 3 次。第一次循环时，运行 `cat foo1.txt`。这将显示 `foo1.txt`\
    \ 的内容。第二次循环时，运行 `cat foo2.txt`，这将显示 `foo2.txt` 的内容。然后，循环将第三次运行，此时（第三次）将显示 `foo3.txt`\
    \ 的内容。由于没有更多的 `.txt` 文件，循环结束。\n\n与其使用像 `ls` 这样的命令来设置循环运行的次数，程序员也可以使用 `seq` 命令。`seq`\
    \ 命令生成数字列表，从第一个参数一直到最后一个参数。如果给 `seq` 传递三个参数，它将把它们视为起始值、增量值和结束值。考虑以下输出：\n\n```bash\n\
    #!/bin/bash\nfor x in $(seq 1 3 10); do\necho $x\ndone\n```\n\n此输出显示了脚本的内容。这是一个\
    \ bash 脚本，如第一行（`#!/bin/bash`）所示。循环使用 `seq 1 3 10` 命令创建执行循环的次数。每次循环执行时，数字（`x`）都会显示在屏幕上，然后创建一个新行。上面的示例显示了输出\
    \ 1、4、7 和 10。\n\n除了 `for` 循环外，还有另一种称为 `while` 循环的循环类型。当测试的条件保持为真时，`while` 循环重复执行循环内的命令。\n\
    \n```bash\n#!/bin/bash\nwhile [test condition]\ndo\n[commands to execute]\ndone\n\
    ```\n\n还有一种名为 `until` 的循环。`until` 循环的工作与 `while` 循环类似，但 `until` 循环在条件保持为假时持续执行。\n\
    \n### 函数\n\n脚本还支持在其内部创建函数。这些函数执行特定的子任务，并可以在脚本的其他部分通过名称调用。创建函数的方法是在函数名后放置括号，然后将作为函数一部分运行的命令封装在花括号内，如下伪代码所示：\n\
    \n```bash\n#!/bin/bash\nmyfunction() {\n    [commands to execute]\n}\n```\n"
- fmt: '

    In addition to the name (`myfunction`) shown above, the script’s writer can optionally
    add the keyword `function` (as in, `function myfunction`) to identify that section
    of the script as a function, but this is completely optional. Once the function
    is created in the script, it can be referenced from anywhere else in the script
    as if it was an ordinary internal or external command. Functions are useful for
    creating modular scripts and can increase the readability and efficiency of a
    script. For example, if the script needs to perform the same computation ten different
    times throughout it, the computation can be placed in a function, which can then
    simply be called directly when needed. Please note, a function cannot run outside
    of the script since it isn’t a true program or command. Also, functions do not
    run in the order they appear in the script, but instead they run anytime their
    name appears within the script’s main body.


    ## The Exit Value

    Every script, like every good story, has a beginning, a middle (or body), and
    an end. That end, though, can come before the script reaches the very end of the
    script’s content, as demonstrated in our `if-then-else` example earlier in this
    chapter. Regardless of when the script ends, it will return an exit value back
    to the shell to indicate it finished its execution.


    A script’s default return exit value is the exit value of the last command the
    script executed. This is represented in the shell by the variable `$?`. The exit
    value can be controlled, though, and it is possible to exit from the script at
    any point by using the `exit` command. Used without any options, `exit` causes
    immediate termination of the script, with the default exit value of `$?`. This
    can be useful in error handling or in aborting an ongoing operation when needed.
    If the script detects an error or if the user selects an option to terminate,
    the script can include an `exit` call to quit prior to the script crashing.


    If the script instead sends a numeric value between 0 and 255 to the `exit` command,
    then the script terminates and returns the specified value as the script’s exit
    value. This is a useful feature that can signal a particular error if the script
    is being called by another script or program. For example, the script may exit
    with a value of `1` to signify that an invalid input was provided to the script,
    or a value of `2` to signify that an output file doesn’t exist. The options are
    limitless and simply left up to the script’s writer to decide the values and their
    meaning.


    For example, the script’s designer might create a variable (`$termcause`) to hold
    the value returned during the script’s termination. When the program first executes,
    the value of `$termcause` will be set to equal `0`, and then, if the script detects
    a problem that will cause termination, it will reset `$termcause` to a non-zero
    value. Any numeric codes may be used here since there is no set meaning for such
    codes by default. Whenever the script reaches a condition where it should exist,
    it will simply use `exit $termcause` to exit and return the value of the `$termcause`
    variable back to the shell as the exit value.


    | Creating a Script |Scan QR code to watch a video for this topic | ![A close
    up of a sign Description automatically generated](Image00021.jpg) |


    It is time to put together previously discussed script components into a complete
    basic script. To create a simple script, we will use the `nano` command and create
    a script named `logic.sh` by typing `nano logic.sh` at the terminal prompt. Start
    by commenting the first few lines using hashtags or the pound (`#`) sign. In this
    case, `#!/bin/bash` and `Simple logic test display`.


    ```bash

    #!/bin/bash

    # Simple logic test and display

    ```


    Start by using an `if` command. If the first argument is going to equal 1 (`$1
    = ''1''`), the system will display the next statement (`then`) by using `echo
    "The argument entered was 1"`. An exit is placed, and the `fi` command ends the
    loop. The second `if` command in the script shows that if the next argument is
    going to equal 2 (`$1 = ''2''`), the system will display the next statement (`then`)
    by using `echo "the argument entered was 2"`, and an exit is placed. Next comes
    an `else` command to be used for cases other than the previous two arguments (the
    number entered is neither 1 nor 2) to display by using `echo "the argument entered
    was not 2"`. It is also exited, and an `fi` ends the loop.


    ```bash

    if [ $1 = ‘1’ ]

    then

    echo The argument entered was 1

    exit

    fi

    if [ $1 = ‘2’ ]

    then

    echo The argument entered was 2

    exit

    else

    echo The argument entered was not 2

    exit

    fi

    ```


    Make sure to save the script by pressing `^O`, and then press `^X` to exit to
    the terminal prompt. Change the permissions of the file to make sure it can run.
    Type `chmod 755 logic.sh` to make the file executable. Typing `./logic.sh 1` should
    satisfy the first `if` statement and should display "The argument entered was
    1" and so on. However, this simple script assumes that there is an argument entered
    and that there is only one argument. Otherwise it will throw errors when no argument
    is made, such as typing `./logic.sh`. It will return an error:


    ```bash

    diontraining@work: ~/Documents/scripts$ chmod 755 logic.sh

    diontraining@work: ~/Documents/scripts$ ./logic.sh 1

    The argument entered was 1

    diontraining@work: ~/Documents/scripts$ ./logic.sh 2

    The argument entered was 2

    diontraining@work: ~/Documents/scripts$ ./logic.sh 3

    The argument entered was not 2

    diontraining@work: ~/Documents/scripts$ ./logic.sh 0

    The argument entered was not 2

    diontraining@work: ~/Documents/scripts$ ./logic.sh

    ./logic.sh: line 4: [: =: unary expected

    ./logic.sh: line 10: [: =: unary expected

    The argument entered was not 2

    diontraining@work: ~/Documents/scripts$

    ```


    The first thing to do is to create a check for the number of arguments. If it
    doesn''t equal 1 (`$# != 1`), then it will display the usage instructions by using
    `echo`. This also exits, and the loop ends with the `fi` command. This portion
    of the script checks how many arguments there are. Now the script should run without
    throwing any errors, no matter how many or what argument is supplied.


    ```bash

    #!/bin/bash

    # Simple logic test and display

    if [ $# != 1 ]

    then

    echo “Usage – This script requires one argument that is a number.”

    exit

    fi

    if [ $1 = ‘1’ ]

    then

    echo The argument entered was 1

    exit

    fi

    if [ $1 = ‘2’ ]

    then

    echo The argument entered was 2

    exit

    else

    echo The argument entered was not 2

    exit

    fi

    ```


    There is a bunch of things that we can do with scripts, as scripts can be as simple
    as the one mentioned here, or they can carry out complex logic flows. By adding
    in these logic steps when creating a script, we can test conditions by using `if`,
    `then`, and `else` to find out what is going on and to let the computer do the
    work.


    # CHAPTER NINE Packages and Processes![](Image00022.jpg)


    ## OBJECT


    *   Understand how package management systems function

    *   Be able to install, update, or remove a program

    *   Be able to identify running processes

    *   Understand memory usage, logging, and kernel execution

