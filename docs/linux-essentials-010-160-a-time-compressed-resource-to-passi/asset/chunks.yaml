    比较这四种发行版仅说明使用 Linux 并不不可怕。对于那些想要尝试一下或考虑从 Windows 或 Mac 切换的用户来说，这尤为如此，因为它的运行方式与这两个操作系统相似，因此是他们已经熟悉的领域。用户只需要决定哪种发行版和桌面环境适合他们的需求和偏好即可。


    ## 嵌入式系统


    到为止，我们只把 Linux 作为一个功能全且完整的操作系统来讨论，但 Linux 的用途远不止于计算机。事实上，Linux 是你每天使用的许多设备的核心，因为它是许多嵌入式系统的核心。


    嵌入式系统是大型机械或电气系统中具有专用功能的控制器。它作为完整设备的一部分被嵌入其中，通常包括硬件和机械部分。事实上，无论你是否意识到，嵌入式系统都控制着你每天使用的许多设备。这些设备包括但不限于工业自动化、导航设备、医疗设备等等。


    近年来，由于其成本低廉和易于定制的特点，Linux 已被应用于许多消费设备中，如可穿戴技术、家电器、汽车，甚至恒温器。如果你家里有智能恒温器，比如 `Nest®`
    或 `ecobee®`，那么你家里已经安装了 Linux！


    某些嵌入式系统，如 `Arduino` 和 `Raspberry Pi`，是信用卡大小的嵌入式系统，我们可以用它们创建其他完整系统。这些包括机器人和超便携计算机系统等。`Arduino`
    和 `Raspberry Pi` 以自装或 DIY 套件的形式在市场上销售。嵌入在这些套件中的基于 Linux 的操作系统占用空间小，运行所需的内存和处理能力较少，并且具有高度的可定制性。


    大多数智能手机和平板电脑也运行基于 Linux 内核的操作系统，被称为 `Android`。谷歌于 2005 年 7 月收购了 `Android` 并对其进行了扩展，结果
    `Android` 成为一个极具竞争力的移动操作系统，现在占据了全球 75% 以上的智能手机和平板用户市场。`Android` 具有高度的可扩展性、用户友好、开源，且允许制造商在设备中免费使用。


    正因如此，`Android` 还被移植用于媒体播放器、电视和汽车娱乐系统。`Android` 具有高度的可定制性，是一个以 Linux 为核心的真正完整的操作系统。我们还可以向
    Android 环境中添加应用程序以进一步增强功能。有用于照片、视频和社交媒体等媒体内容的应用程序，也有用于生产力和游戏的应用程序。


    事实上，由于许多较新的电视内部安装了 `Android` 作为嵌入式系统，这些设备现在变成了完整的多媒体中心，我们可以用它们进行视频流媒体、浏览和视频游戏。


    ## 硬件要求


    在安装 Linux 之前，你需要知道哪些硬件组件可以高效地运行和使用它。这些先决条件被称为系统要求，通常被视为指南而非绝对规则。


    任何 Linux 发行版定义的的最常见的系统要求是物理计算机硬件。硬件要求列表通常会附带硬件兼容性列表（`HCL`）。`HCL` 列出了针对特定发行版经过测试、兼容的以及有时不兼容的硬件设备。大多数发行版都定义了两个组系统要求：最低要求和推荐要求。随着时间的推移，由于每个发行版的新版本对更高处理能力资源的需求，这些系统要求往往会增加。


    通常，开发者会在其网站的下载页面发布特定版本的系统要求。这些列表通常列出了所需的处理器速度、内存大小、可用硬盘空间、光驱或可移动介质、显示器规格以及所需的其他设备。


    最低系统要求是你的计算机成功启动 Linux 并使用基本功能所需的最低硬件。例如，本文撰写时 `Ubuntu` 的当前版本 `Disco Dingo` 要求计算机至少有一个运行在
    `2GHz` 的 `Dual Core` 处理器、`2GB` 的 `RAM` 和 `20GB` 的硬盘空间。大多数现代桌面电脑和笔记本电脑都能很轻松地满足这些要求。


    但最低要求在不同发行版之间也可能很大。例如，考虑 `AntiX` 发行版。该发行版仅要求一台至少带有 `Pentium III` 处理器、`256Mb` `RAM`
    和 `2.7GB` 硬盘空间的计算机。考虑到 `Pentium III` 处理器是 1999 年首次制造的，这些要求极其轻量。像 `AntiX` 这样的现代操作系统仍然运行在超过
    20 年历史的系统上，这非常令人惊讶！所以，如果你地下室里有一台积灰的旧 Windows 电脑，你可以使用 `AntiX` 这样的轻量级发行版将其作为 Linux
    机器焕发新机。


    另一种类型的系统要求是推荐要求。推荐系统要求列出了为了最大限度发挥系统潜力你应该具备的硬件。这允许你使用视频编辑软件等应用程序或玩 3D 游戏，这些游戏需要更高的帧率来实现流畅的游戏。当你查看推荐要求时，你会发现大多数发行版现在都会推荐视频显卡以及比最低要求高得处理器和内存。然而，你仍然需要小心不要使用不兼容的硬件，因为它们可能比最低要求更强大，但如果你安装了不支持的显卡或其他设备，可能会导致整个系统不稳定或无法使用。


