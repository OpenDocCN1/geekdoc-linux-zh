- fmt: '

    When it comes to using Linux on a computer, it may already come pre-installed
    by the device manufacturer or you may need to manually install it. To manually
    install a Linux distribution, the installer is essential. It is usually a download
    on the distribution’s website. For example, to install Ubuntu, open a web browser
    and go to `ubuntu.com`. The installer is under the download section. Several different
    versions of the installer may be present and choosing which to download will depend
    on system requirements and user needs. For example, there will be 32-bit and 64-bit
    versions that depend on hardware capability, and there might also be long-term
    support and non-long-term versions. The file size will also depend on the installer’s
    version.


    The installer is usually in the `ISO` file format. It is a disk image for a CD
    or DVD. There are several ways of managing this type of file format, and the traditional
    way is to burn the disk image onto a CD or DVD. For the Ubuntu `ISO` file, Windows
    7, 8, and 10 users will simply need the downloaded Ubuntu `ISO` file, a blank
    DVD, and access to a computer with a DVD burner. Right-clicking on the `ISO` file
    will show the context menu options, which includes "Burn disc image." Clicking
    it brings up the Windows Disc Image Burner dialogue, where we can select the disc
    burner, insert the blank DVD, click the burn button, and start the process. Older
    Windows versions, such as Windows XP and Vista, may need third party software,
    such as `Infra Recorder`, to manage burning `ISO` disc image files. Mac users
    will also go through something similar, and tutorials for both Windows and Mac
    image burning are on the Ubuntu website.


    Another way to manage `ISO` files for newer systems, which can boot off USB thumb
    drives, is to create a bootable USB stick. Optical drives are becoming a thing
    of the past, as they are prone to physical damage. Bootable USB installers are
    now the preferred method for installing operating systems like Windows and Linux.
    There are also advantages to creating a Ubuntu bootable USB stick; for instance,
    it allows us to test out Ubuntu without touching the host computer''s configuration.
    We can also carry this USB stick around and use it to boot Ubuntu on other computers,
    such as a friend''s or at an internet cafe.


    Creating a Ubuntu bootable USB still requires the `ISO` file, but, instead of
    going through the disc burning process, we need a third-party software such as
    `Rufus`, an open source software for creating bootable USBs. A sufficiently capable
    USB thumb drive is also necessary. For newer versions of Ubuntu, we need a 4GB
    or larger USB stick or flash drive. It should be empty, as it may require reformatting,
    which destroys existing files. The process is straightforward, and there are easy
    to follow prompts. It will also download additional files, so we need internet
    connectivity. A prompt asking for the write mode will appear and selecting `ISO
    mode` at this point is recommended. It may take some time for the process to finish,
    and, once it is done, the USB drive is now bootable, and we can use it to install
    Ubuntu on a machine capable of booting though USB.


    Before going through an actual install by taking over an entire system or booting
    alongside an existing operating system, we can test Ubuntu on a virtual machine,
    which is like another computer running inside your computer. A popular virtual
    machine software is `VirtualBox`. Just like downloading the Ubuntu `ISO` file
    from the Ubuntu website, we can download the `VirtualBox` from its website, `virtualbox.org`.
    Download the version that matches the operating system that `VirtualBox` will
    be installed on. Going through the `VirtualBox` installer should be straightforward,
    as it recommends installation defaults. Create a new virtual machine by naming
    it, setting a virtual memory (`RAM`) value, and creating a virtual hard drive
    disk (`HDD`). We can then load the downloaded Ubuntu `ISO` image as a virtual
    optical drive from which the virtual machine can boot. Starting this virtual machine
    is like turning on a physical computer, and it will boot from the loaded Ubuntu
    `ISO` file as if it were a DVD inserted in a DVD drive.


    The Ubuntu installer starts with a language selection and presents two options:
    try or install. Selecting try loads Ubuntu as a live operating system, running
    temporarily as if it were installed, but it is not retained in the system, especially
    when the computer shuts down or restarts. Selecting the install option installs
    Ubuntu onto the system, whether it is an actual or virtual machine. The next prompt
    in the installation is the keyboard layout selection. After that, the installation
    presents options for a normal or minimal install. A normal install has all the
    preloaded software, while the minimal install has less. There will also be options
    to download updates while installing Ubuntu, and we can choose whether to also
    download some third-party software, some of which is proprietary. The next step
    presents options to either allow the system to be used exclusively for Ubuntu
    or to set `HDD` partitions so that we can boot Ubuntu side-by-side with other
    operating systems. The latter option is also called a multi-boot system. Installing
    a multi-boot system is more complicated, and there are a ton of resources online,
    especially from Ubuntu''s website and online community. The next major step in
    the process is supplying user credentials: the user’s, computer''s name, username,
    and password. After supplying user credentials and selecting whether the user
    is logged in automatically or not, the system installation starts.


    The first boot screen of Ubuntu shows the "What''s new in Ubuntu" dialogue, which
    is like a walkthrough of some of the operating system’s features. The next section
    of the first boot shows `Livepatch` and is where we can create a Ubuntu single
    sign-on account. The next section asks whether the user wants to send information
    to Ubuntu to better help them in the OS’s development. After going through the
    first boot screen sections, the `Software Updater` may run if it detects updates
    on some of the system software or applications. Always keep them up to date.


    ### Operating System Differences


    There are hundreds of operating systems in use today. These range from commonly
    used ones to those that are specifically developed for unique systems. Most readers
    are familiar with the two most popular operating systems in the world: Windows
    and macOS.


    `Microsoft Windows` dominates the world as the operating system of choice, with
    nearly 90% of all desktop and laptop computers running some version. Many home
    users and companies prefer Windows for their everyday use, productivity needs,
    and gaming. This is also driven by the fact that most software developers release
    their products on the Windows platform due to its widespread popularity, creating
    a self-perpetuating feedback cycle that continually increases Windows popularity.


    The second largest operating system is Apple’s `macOS`. With the increased popularity
    of the `iMac` and `MacBook` computer lines in recent years, `macOS` now makes
    up about 9% of all desktop and laptop operating systems. While slowly gaining
    market share, `macOS` still cannot take away large portions of Windows’s dominance
    since `macOS` only runs on Apple’s own computer hardware.


    In third place, the `Linux` operating system is found on less than 2% of all desktops
    and laptops. While this is a small amount, remember this doesn’t mean `Linux`
    isn’t important. These numbers are for home and business desktop users. When it
    comes to servers, `Linux` dominates Windows and other operating systems.

