  trans: '


    如前所述，`RPM` 和 Debian 包管理系统是某些 Linux 发行版中最常用的两种软件包管理系统。Ubuntu 是基于 Debian 的发行版，因此它使用名为
    `apt`（Advanced Packaging Tool）的 Debian 包管理器。CentOS、Fedora 以及 RedHat 家族的其他发行版使用
    `RPM` 软件包管理器。在 CentOS 中，它被称为 `YUM`（Yellowdog Updater, Modified），而在 Fedora 中，它被称为
    `DNF` 或 `Dandified YUM`：它是 `YUM` 的分支和改进版本。


    ### DNF

    要使用软件包管理器 `DNF`，首先我们必须更新软件包列表。在 Fedora 终端中输入 `dnf check-update` 会告诉 `DNF` 检查仓库并获取所有可安装程序的最新版本列表。随后它将生成可用最新版本的列表。然后，`sudo
    dnf upgrade` 会检查系统中是否有任何需要更新的程序。该命令以 root 身份运行，因为可能存在只有通过 root 权限才能更新的系统程序。当 `DNF`
    找到要安装的新版本程序时，它会询问用户是否确实要更新这些程序。


    要在系统中搜索要安装的程序，输入 `dnf search keyword` 并将“keyword”替换为程序的关键字，将在仓库中搜索包含该词的程序。例如，输入
    `dnf search virtualbox` 将在包列表中搜索包含 `virtualbox` 词的程序。所有带有搜索关键词的包将列在屏幕上。屏幕上列出的文件采用
    `.rpm` 包格式。要查看详情，输入 `dnf info filename`，将 filename 替换为包名。要安装包，输入 `sudo dnf install
    package`，将 package 替换为包名。我们使用 `sudo` 是因为可能需要 root 权限来安装依赖和额外软件。要删除软件，输入 `sudo
    dnf erase package-name`，将“package-name”替换为包名。在卸载时，我们再次使用 `sudo`，因为可能存在需要 root
    访问权限才能删除依赖项和软件。


    ### APT

    Ubuntu 基于 Debian，使用 `.deb` 文件包格式。要更新软件包列表，输入 `sudo apt update`。如果 Ubuntu 中安装了新版本的软件，输入
    `sudo apt upgrade` 将程序更新到仓库中可用的最新版本。有时在进行升级时，`apt` 会对可能过旧、仅留在系统中未被任何其他程序作为依赖使用、或完全未使用的程序给出建议。为了节省空间并保持系统安全，可以通过输入
    `sudo apt autoremove` 卸载这些内容。在 `apt` 中搜索包，输入 `apt search [package keyword]`，将括号中的词替换为与要安装程序相关的关键字。要查看包的详情，输入
    `apt show [file name]`。显示的信息包括包名、版本、优先级、区域、来源、维护者、错误报告和解决方案的 URL 等。要安装包，输入 `sudo
    apt install package-name`，将“package-name”替换为包名。要卸载该包或任何其他包，输入 `sudo apt remove
    package-name`。


    像 `DNF` 和 `apt` 这类软件包管理器的优点在于，它们会自动安装当前正在安装的包所需的其他软件（称为依赖项）。它们会跟踪发行版仓库中的包以及系统当前安装的包，从而允许轻松更新到新版本并进行卸载。这些软件包管理器也可以从终端轻松访问，特别是对于可能没有图形界面（GUI）的系统（如服务器）。


    ### 进程层次结构

    之前我们讨论过 Linux 内核是 Linux 安装的核心。内核管理内存，为软件提供访问硬盘的方法，为软件的各个分配 CPU 时间，并执行其他关键的低层任务。引导过程在早期加载内核，而内核负责管理在
    Linux 计算机上运行的每一个其他软件代码。内核对可能混乱的运行软件集实施排序的许多方法之一就是创建层次结构。


    当内核启动时，它只运行一个程序，通常是 `/sbin/init`。随后，`init` 进程负责启动 Linux 必须运行的所有其他基础程序，例如管理登录以及始终运行的服务器和服务的程序。这些程序如果由
    `init` 直接启动，则被称为其子进程。`init` 的子进程可以反过来启动自己的子进程。例如，当您登录 Linux 系统时，会启动一个子进程来支持该功能。因此，每当进程启动时，它都被视为子进程。启动特定进程的进程则被称为其父进程。这种父子关系为给定系统上的所有运行进程创建了自然的层次结构。


    这导致了进程的树形层次结构，在图示时，通常被描绘成一棵倒置的树。如下所示，在典型的 Linux 安装中运行的众多进程中只有一小部分示例。此图像仅显示了与文本模式登录相关的几个进程，包括管理登录的登录工具、几个守护进程和几个用户程序。一个运行中的
    Linux 系统可能有几十或数百个正在运行的进程，所示：


    | ![](img/Image00023.jpg) |


    ### 识别运行中的进程

    每个进程都有一个与其相关的进程 ID 或 `PID` 数字。这些数字从 1 开始，因此 `init` 进程的 `PID` 通常为 1。每个进程还有一个父进程
    ID 或 `PPID` 数字，指向其父进程。许多管理进程的工具依赖于这些数字，特别是 `PID` 数字来识别运行中的进程。


    在管理进程之前，识别它们是非常重要的。为了做到这一点，我们使用 `ps` 和 `top` 命令行实用。通过这两个工具，我们可以以各种方式搜索进程，例如通过名称或它们利用的资源。识别进程的最常见原因之一是知道它消耗了多少内存，这可以通过
    `free` 命令完成。识别进程的最简单工具是 `ps`，它产生进程列表。由于 `ps` 选项很多，大多数用户都有自己喜欢的用法程序的方法。例如，输入 `ps
    ax` 是我最喜欢的，因为它通常产生我需要的信息，例如 `PID` 值、命令名称以及计算机上所有进程的命令行选项。如果你通过稍微修改命令添加一个 `u`，如
    `ps aux`，这将为 `ps` 命令产生的输出添加用户名、CPU 负载以及其他几个细节。然而，产生的信息的巨大范围可能会让人目不从心。


    缩小这种范围的一种方法是将输出结果通过管道传递给 `grep` 命令，排除不包含指定搜索标准的行。例如，如果你只想确定 `gedit` 进程的 PID 数字，你可能会这样运行命令：


    ```

    $ ps ax | grep gedit

    27946 pts/8 S1 0:00 gedit

    27950 pts/8 S+ 0:00 grep--color=auto gedit

    ```


    '
- fmt: '

    This example reveals that `gedit` has a `PID` value of `27946`. This is usually
    the most important information when using `ps`, since the `PID` value can be used
    to change a process’s priority or terminate it. If you need to terminate a process,
    you can do so using the `kill` command. Although `ps` can return process priority
    and CPU use information, the program’s output is usually sorted by the `PID` number.
    Also, it is important to remember that the `ps` command only provides information
    at only a single moment in time, much like a snapshot. So, if you run the `ps`
    command right now and then run it again in 3 minutes, you will get different results.
    To locate CPU or memory intensive processes quickly, or if there is a need to
    study how resource use varies over time, the `top` utility is a more appropriate
    tool. This utility is essentially an interactive version of the `ps` utility.By
    default, `top` sorts its entries by CPU use, and it updates the display every
    few seconds. In order to determine if an application is behaving properly on a
    system, it is important to become familiar with the purposes and normal habits
    of the programs running on the system. This allows you to create a mental baseline
    of what normal function looks like on a given system. Because each program has
    different legitimate needs in terms of processing and memory usage, it is impossible
    to give a simple rule for judging when a process is consuming too many resources,
    but if you have a good baseline from which to begin your comparison, this can
    become much easier.One of the pieces of information provided by `top` is the load
    average, which is a measure of the demand for CPU time by applications. The load
    average can be useful fpr detecting runaway or malicious processes. For instance,
    if a system normally has a load average of 0.5 but suddenly gets stuck at a load
    average of 2.5, it is possible that a few CPU-hogging processes may have hung
    or become unresponsive. Hung processes sometimes needlessly consume a lot of CPU
    time. Therefore, you should use `top` to locate these processes and, if necessary,
    stop (or `kill`) them.


    ### Measuring Memory Usage

    Processes consume important system resources like processor time and system memory.
    Using the `top` utility allows the user to sort the processes by CPU time by default
    to quickly identify the processes that are consuming the most processing resources.
    When `top` is running, there are several single-letter commands can be entered,
    some of which prompt for additional information. For example, if the user presses
    the `M` key within `top` sorts processes by memory use. To learn more about the
    `top` utility and all these single-letter commands, please consult the man page
    for the `top` utility.If the `top` utility is currently being sorted by memory
    usage, it is quite easy to identify the processes that are consuming the most
    memory. As with CPU time, we cannot determine that a process is consuming too
    much memory simply because it is at the top of the list as some programs legitimately
    consume a great deal of memory.For example, a simple text editor like `gedit`
    should consumed much less memory than a photo editing program like `gimp` since
    `gedit` manipulates much smaller files. But, if the same program usually requires
    only a few megabytes of memory, and today it is using a gigabyte of memory, this
    is something that we should further investigate investigated as abnormal activity
    and a possible indication of a runaway process.Sometimes a program consumes too
    much memory, either because of inefficient coding or because of a memory leak.
    A memory leak is a type of software bug in which the program requests memory from
    the kernel and then fails to return it when it is done using the memory. A program
    with a memory leak consumes increasing amounts of memory, sometimes to the point
    where it interferes with other programs. As a short-term solution, the user can
    terminate the program and launch it again, which will reset the program’s memory
    consumption. The problem will likely reoccur, but if the memory leak is small
    enough, then at least useful work can still be done.To study the computer’s overall
    memory use, the `free` command is a useful utility. This program generates a report
    on the computer’s total memory status. The two most important lines within the
    resulting display of the command are the `Mem:` and the `Swap:` lines.The Mem:
    line reveals the total RAM statistics. This includes the computer’s total memory
    minus whatever is used by the motherboard and kernel, the amount of memory used,
    and the amount of free memory. Most of the computer’s memory being used is a normal
    state since Linux puts otherwise unused memory to use as buffers and caches to
    help increase the speed for accessing information from the hard disk. Therefore,
    the `Mem:` line isn’t the most useful by itself, but instead needs to be considered
    along with the `-/+ buffers/cache:` line that shows the total memory used by all
    the computer’s programs.The Swap: line reveals how much swap space Linux is using.
    Swap space is disk space that is set aside as a substitute for physical memory.
    Whenever Linux runs out of RAM or when it determines that RAM is better used for
    buffers or caches than to hold currently inactive programs, it will replace the
    use of physical RAM with a swap space contained as a file on the hard disk. Swap
    space use is generally quite low, and if it rises too much then performance problems
    can occur. In the long run, increasing the computer’s physical memory(RAM) is
    generally the best solution for a Linux system that is continually running out
    of memory, but a larger swap space can become a suitable temporary workaround,
    if needed. When suffering from performance problems because of excessive swap
    use, terminating some memory-hogging programs can help speed up your system. Also,
    memory leaks can lead to such problems and terminating the leaking program can
    restore system performance to normal.


    ### Log Files

    Many programs only run in the background and are not visible to the end user.
    These programs generally to run services for the network, such as providing DHCP,
    running a web server, or running an email server. These background services are
    known as daemons.Since these programs run in the background, they continually
    require system resources...

