- fmt: '

    While the desktop environment is fully based on a graphical user interface, the
    Linux shell is based on a text-based, command line environment. At this point
    in your Linux journey, it is important for you to understand at least the basics
    of the shell since it performs all the commands in the background on behalf of
    the desktop environment. Simply put, the Linux shell is the program that takes
    commands from the keyboard and presents them to the kernel for execution. In the
    old days, most operating systems were only available as a text-based, command
    line interface. These days, however, the desktop environment or GUI sits on top
    of the command line interface (CLI) and makes the execution of commands and task
    much easier for the end user.


    When the user clicks on a shortcut located on their desktop, that shortcut may
    contain a predefined command bundled together with the correct syntax to execute
    a program. For example, if you click on the shortcut for Google Chrome on your
    desktop, it may be configured to open the web browser and load your homepage.
    For this to occur, you simply double clicked the shortcut, which caused the GUI
    to translate that action into a series of commands within a hidden `CLI`.


    The Linux command line, or shell as it is more properly called, can be launched
    or started in a GUI window known as a `terminal` program. Some Linux distributions,
    such as ones designed for server use, will eliminate the desktop environment altogether
    to save on processing and memory resource. This allows a user to directly log
    into the system locally via a text-mode console or to connect to a shell when
    they remotely log into a server using a text-mode login protocol, such as `Telnet`
    or `SSH`.


    ## Types of Shells

    Most Linux distributions systems have the option of using several different shells,
    though. These include the Bourne Again Shell (`bash`), Korn shell (`ksh`), the
    TENEX C Shell (`tcsh`), and the Z shell (`zsh`).


    The most common shell is known as `bash`. It is based on an older shell called
    the Bourne Shell. `bash` is a program that operates within the command line interface
    to read and execute commands from the command line or from a file known as a `shell
    script`.


    The Korn shell is named after its creator, David Korn, and served as the basis
    of the POSIX.2 operating system. `tcsh` is a shell that improved upon an earlier
    shell known as `csh` (C shell) by adding command line completion, command line
    editing, and some other additional features. The `csh` is the default shell in
    BSD-based operating systems like FreeBSD. `zsh` is an interactive login shell
    and command line interpreter that was selected as the default shell within macOS
    Catalina (10.15) and newer macOS versions as a replacement to `bash`.


    For any demonstrations within this book, we will rely on `bash` since it is the
    default used by Ubuntu and is commonly used across the Linux community. Most of
    the other shells listed above are also compatible with `bash` and provide a similar
    functionality, albeit with some subtle differences.


    Each Linux user account specifies its own default shell, so individual users can
    change their shells if they like. This can be done with account management tools,
    such as `usermod`, which we will describe in detail in a later chapter.


    If you are using a desktop environment, then you can access the shell by running
    a program known as a `terminal emulator` (often simply called the `terminal`).
    The `terminal` opens a window and allows the user to interact with the shell from
    within the desktop environment. Typically, a desktop environment has its own `terminal`,
    so the `terminal` program you will use may depend on the desktop environments
    you have installed. Many terminal programs include the word `terminal` in their
    names, such as `gnome-terminal`. Others, like the K Desktop Environment’s (KDE)
    `Konsole` and the generic `XTerm` do not specify which desktop environment they
    must be used with. Again, Linux provides users with numerous terminal emulators
    to choose from, including `rxvt`, `kvt`, `nxterm`, and `eterm`.


    While there are many different terminal emulators, they all do basically the same
    thing. They provide an end user with direct access to an interactive shell session
    in which they can issue commands to the operating system.


    The exact method of launching a `terminal` differs from one desktop environment
    to another. Normally, an entry for the `terminal` can be found in the desktop
    environment’s menus. Many desktop environments also provide a search function
    where you can find a full list of all the different terminals installed within
    that system. For example, in Ubuntu’s Unity desktop, clicking the Dash icon (the
    Ubuntu symbol) located at the top of the application launcher will show a search
    bar. If you begin to type the word “terminal,” it will show the available terminal
    applications within its search results.


    A quicker way to launch the `terminal` is to use the keyboard shortcut by simply
    pressing `CTRL+ALT+T`.


    Most terminal programs support tabs, which are like the tabs you use within a
    web browser. It can be helpful to have multiple tabs open because it enables a
    user to run multiple programs simultaneously, work easily in multiple directories,
    or run programs both as a normal user and as root. On a Linux system, the root
    user servers as a super user or administrator.


    ## Basic Commands

    To utilize the shell, you need to be able to use some basic commands. The first
    ten commands any Linux user should learn in the shell are `ls`, `cd`, `mv`, `mkdir`,
    `touch`, `rmdir`, `rm`, `locate`, `clear`, and `man`.


    - The `ls` (list) command is used to display the files, folders, and directory
    information within the shell. This is the equivalent of looking at the list of
    files/folders within a folder in a desktop environment.

    - The `cd` (change directory) command allows a user to switch between two directories.
    This is the equivalent of double clicking a folder within a desktop environment.

    - The `mv` (move) command allows a user to move a file/folder to another folder/directory
    using the shell. This is the equivalent of a user dragging a file/folder into
    another folder within a desktop environment.

    - The `mkdir` (make directory) command is used to make a new empty directory within
    the file system. This would be the equivalent of a user right-clicking and selecting
    “New Folder” within a desktop environment.

    - The `touch` command is used to create or make a new, blank file using the command
    line. This would be the equivalent of a user right-clicking and selecting “New
    Text Document” within a desktop environment.

    - The `rmdir` (remove directory) command is used to delete an empty directory
    within the file system. This would be the equivalent of a user dragging a folder
    to the recycle bin or trash can within a desktop environment.

    - The `rm` (remove) command is use to delete a file or directory within the file
    system. Since the `rmdir` command will only delete an empty directory, the `rm`
    command will remove both files and non-empty directories. This would be the equivalent
    of a user dragging a file/folder to the recycle bin or trash can within a desktop
    environment.

    - The `locate` command finds a file within the file system. If you don''t remember
    where a certain file was saved and stored in your file system, the `locate` command
    can really be useful. This would be the equivalent of using the search or spotlight
    feature in other desktop environments.

    - The `clear` (clear the screen) command erases the contents of the terminal display.
    This is useful when there is a lot of information and previous commands remaining
    on the screen are cluttering the terminal with extraneous information. With the
    `clear` command, the user will be brought to the top of the terminal’s display
    and returned to the shell prompt and the current directory. This would be the
    equivalent of closing out numerous windows in your desktop environment.

    - The `man` (manual) command shows all the information about a given command.
    When a user is unsure of how to perform an action or how to properly input the
    syntax to a command, the `man` command is essential. This is the equivalent of
    a user opening the help file or a document containing all the details about how
    a command works.


    ## Command Line Syntax

    When a computer is attempting to an operation (no matter which operating system
    it is running on), it can be summarized in just four steps:

    1. The computer waits for user input

    2. The user chooses a command to use

    3. The user enters it via the keyboard or mouse

    4. The computer executes the command


    In a Linux, the shell displays a prompt where commands can be entered. This prompt
    usually consists of a user and host (computer/server) name, the current directory,
    and a final character. If you are using `bash`, that final character is the dollar
    sign. For example, a terminal using `bash` is displayed below:


    ```

    user@host:~$

    ```

    '
