    command prompt. When using rmdir, remember that file and directory names are case
    sensitive in the Linux filesystem, so it is important to specify the correct case
    to avoid accidentally deleting the wrong directory.The rmdir command can only
    delete empty directories, though. If a directory contains any files or directories,
    the rmdir command will fail. The -p option, however, can delete a set of nested
    directories, if none of them hold any non-directory files.To delete directories
    containing files anywhere within the directory tree, you can instead use the rm
    command with the recursive (-r) option. Because it can delete directories that
    are non-empty, rm with the -r option becomes potentially dangerous since it can
    delete files not intended to be deleted. Therefore, it is considered a best practice
    to first execute the ls -r command to display the directory and its contents before
    attempting to run rm -r to ensure that you are fully aware of the files and directories
    you are about to delete.As stated before, the filesystem considers directories
    a special file type. These special files simply hold the user’s other files. Because
    of this, most of the file manipulation tools covered previously can manipulate
    directories, too. There are some caveats to this general rule, though.First, the
    touch command cannot create a directory. Instead, the command mkdir makes a new
    directory. If the touch command is executed on a directory, it will refresh and
    update the directory’s time stamp instead.The cp command can copy a directory,
    but only if the user specifies the -r or -a options to copy the directory and
    all its contents. Similarly, the mv command can move or rename a directory if
    the right syntax and options are utilized.When creating links in the Linux filesystem,
    the user can only create symbolic links to a directory using the ln -s command.
    This is because the Linux filesystem does not support or allow hard links to a
    directory.Archiving FilesA file-archiving tool collects a group of files into
    a single package file. This allows us to easily move the single file around on
    a single filesystem; back up the file to a recordable DVD, USB flash drive, or
    other removable media; or transfer the file across a network. Linux supports several
    archiving commands to perform this function, but the most prominent ones are tar
    and zip.The tar program’s name stands for tape archiver. Even though it was originally
    designed for backing up files to backup tapes, tar can back up or archive data
    to the filesystem, a hard drive, or removable media. The tar program is a popular
    tool for archiving various data files into a single file, called an archive file,
    while the original files remain safely stored on the disk. Because the resulting
    archive file can become quite large, it is often compressed via the tar program
    into what is known as a tarball. In fact, tarballs are often used for transferring
    multiple files between computers and are considered the universal method for distributing
    source code within Linux. The tar program is a complex command with numerous options,
    but the most common options are all that is needed for most users.When running
    the tar command, the user must use only one command with at least one qualifier
    or option. To create a tar archive, enter the command “tar -c tarfile.tar file1.txt
    file2.txt”. This command will create a new tarfile called tarfile.tar, which contains
    the two text files: file1.txt and file2.txt. To create a tarball, a compressed
    tar file, enter the command “tar -czf tarfile.tar.gz file1.txt file2.txt”. This
    command will perform the same functions as the previous one but will also compress
    the file using gzip to reduce the file size. To learn about all the functions
    of the tar command, please consult its man page.Three other common programs can
    compress individual files, rather than creating compressed directories like tar
    creates. These programs are gzip, bzip2, and xz. They take the original file,
    compress it, and create a new file with the same name but add a file extension
    to indicate the type of compression format.Unfortunately, most programs cannot
    read a compressed file, so the file must first be uncompressed using the proper
    program prior to other programs using the file.If a file was compressed by gunzip,
    it will have a .gz extension in its filename. To uncompress a .gz file, simply
    use gunzip.If a file was compressed with bunzip2, it will have a .bz2 extension
    in its filename. To uncompress a .bz2 file, simply use bzip2.If a file was compressed
    with xz, it will have a .xz extension in its filename. To uncompress a .xz file,
    you must use unxz.CHAPTER SEVENSearching and Extracting Data![](Image00018.jpg)OBJECTIVES'
