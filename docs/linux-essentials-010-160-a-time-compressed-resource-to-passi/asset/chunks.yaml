- fmt: '

    One of the more distinct advantages of Linux over Windows and macOS is its ability
    to let users have complete freedom of choice. Unfortunately, this is also one
    of the most confusing things about Linux, as that choice can become quite overwhelming.
    For example, let’s pretend that you choose `Ubuntu` from among the hundreds of
    Linux distributions in the marketplace. Ubuntu is quite popular, and it is a good
    choice since it has a large user community and excellent lifecycle support. Even
    though you chose `Ubuntu`, you still have some decisions to make before you can
    download and install it. This is because there are eight official versions that
    all look and behave differently, even though they are all considered Ubuntu. One
    of the major differences in these eight divergent versions of Ubuntu is the desktop
    environments.


    To better understand what a desktop environment is, start with the core of any
    operating system, the `kernel`. Linux, Windows, and macOS all have a `kernel`,
    a specialized piece of software that directly controls the hardware. This `kernel`
    translates the commands from a piece of higher-level software (like an application)
    into something the hardware can understand and act upon. The `kernel` is responsible
    for the intelligent management of hardware resources, including memory management,
    for various software and utilities.


    The `kernel` is not a piece of software that requires a graphical interface, but
    instead it operates behind the scenes. This specialized software consumes the
    least amount of resources possible, and we can access it directly via the command
    line using embedded tools. To do certain tasks on the command line, a user needs
    to be familiar with text-based commands, what these commands do, and the syntax
    or rules needed to run these commands.


    In fact, by using just the command line environment, you can perform nearly any
    action you wish on a system, including browsing the web, checking email, playing
    music, moving around the directories on the hard drive, and much more. Unfortunately,
    most users find the command line not very easy to use, so operating systems evolved
    into a more user friendly, graphical user interface (`GUI`) environment. In Windows
    and macOS, for example, you may never even access the command line or the `kernel`
    directly, but instead you would use the `GUI` for your desired actions. This `GUI`
    then translates your series of mouse clicks and keyboard inputs into the appropriate
    command line actions on your behalf. Basically, in Windows and macOS, only system
    administrators, programmers, and developers ever need to access the command line.


    In Linux, on the other hand, it is often much quicker and easier to perform an
    action using the command line. For this reason, we will spend an entire chapter
    on properly using the command line. In this chapter, though, we will focus instead
    on Linux’s various graphical user interfaces.


    ## Desktop Environments


    A desktop environment is the place where most user actions occur. This graphical
    user interface (`GUI`) contains a file system manager, shortcuts to all available
    applications, various menus to easily perform common tasks, and serves as your
    window into the operating system and its functions. Your desktop environment serves
    as your desk, where all your work and tools are easily within reach.


    While Windows and Mac each have an embedded and inseparable desktop environment
    as part of their operating system, Linux uses a more modular approach to desktop
    environments. In fact, there are more than a dozen different desktop environments
    that are officially supported in Linux. These environments can be mixed and matched
    according to the user’s preferences or based on the specific purpose of the distribution
    itself.


    Many Linux distributions come with variants featuring several different desktop
    environments. As previously stated, `Ubuntu` has eight different available versions
    and numerous different desktop environments represented among them. By default,
    `Ubuntu` comes with the `Unity Desktop Environment`, which has an attractive look
    and intuitive workflow. In addition to this default option, `Ubuntu` also has
    other “flavors” (different versions) that are each shipped with a unique desktop
    environment. The `Kubuntu` variant relies on the `KDE Plasma` desktop environment,
    which is slick, flashy, and highly customizable. The `Xubuntu` variant, on the
    other hand, uses the lightweight `Xfce` desktop environment, which is robust and
    can run on older computers with as little as 1 GB of memory and a 700 MHz processor.


    ## Programs and Software


    After installing a Linux variant and a desktop environment, a user can then run
    various programs and software to increase their productivity. Just like Windows
    and macOS, there are millions of available programs available. These programs
    cover a wide variety of functions. Because Linux is open source, much of the software
    available for Linux is also open source and, therefore, free to download and use.


    If you are a Windows or macOS user, you probably are familiar with the Microsoft
    Office suite of products for workplace productivity. This includes word processing
    (`Word`), spreadsheet (`Excel`), presentation (`PowerPoint`), and database (`Access`)
    tools. Since Microsoft Office isn’t available on a Linux machine, most Linux users
    rely on `LibreOffice` (formerly `OpenOffice`) to fulfill these workplace functions.
    `LibreOffice` is a feature-rich toolset that includes word processing (`Writer`),
    spreadsheet (`Calc`), presentation (`Impress`), database (`Base`) tools, and many
    others. The `LibreOffice` suite is fully compatible with Microsoft Office, as
    well, allowing it to read and write to common workplace file formats like `.doc`,
    `.docx`, `.xls`, `.xlsx`, `.ppt`, `.pptx`, and more. Additionally, `LibreOffice`
    supports its own native format known as the `Open Document Format` (`ODF`), which
    is a modern and open standard for office productivity files. `LibreOffice` is
    also cross-platform compatible, with versions of the software available for Linux,
    Windows, and macOS. To learn more about `LibreOffice`, or to try it yourself,
    visit `https://www.libreoffice.org`.


    If you want to watch videos or play music on your Linux workstation, you can install
    one of the best media players available by downloading `VLC`. The `VLC` media
    player can play just about any media file you might throw at it, including damaged,
    incomplete, or even unfinished files. `VLC` is a truly free multimedia solution
    that works on every major operating system, including Linux, Windows, macOS, Android,
    and iOS. I have personally used `VLC` as my media player of choice on every computer
    I have ever owned for over 15 years, and hasn’t let me down. If you are looking
    for a great alternative to the `Windows Media Player` or `QuickTime` player, you
    should head over to `https://www.videolan.org`.


    If you want to browse the internet, you will need a web browser. Although Linux
    doesn’t support proprietary browsers like Microsoft’s `Edge` or Apple’s `Safari`,
    it supports several cross-platform browsers. This includes `Mozilla Firefox`,
    `Google Chrome`, and the `Opera` browser. While all of these are free to use,
    only `Mozilla Firefox`’s source code is freely distributed. Linux is also well-suited
    for editing photos, videos, or audio. If you need to retouch, and edit, draw,
    convert between image formats, or perform specialized tasks, the `GIMP` (GNU Image
    Manipulation Program) is an excellent option. Whether you are a graphic designer,
    photographer, or illustrator, `GIMP` provides you with sophisticated tools to
    get your job done. `GIMP` is a free open source raster editor that operates like
    `Adobe Photoshop`, without the heavy price tag. While `Adobe Photoshop` is only
    available for Windows and macOS, `GIMP` is a cross-platform software for Linux,
    Windows, and macOS. `GIMP` has been around since 1995, and has kept improving.
    To learn more about `GIMP`, or to try it yourself, visit `https://www.gimp.org`.


    If you like to edit video, Linux has an excellent non-linear video editing software
    called `Shotcut`. This program supports video editing using a timeline of multiple
    tracks, like `Adobe Premiere` or Apple’s `Final Cut`. In fact, `Shotcut` is so
    powerful that it can even support 4K video. Like most Linux software, `Shotcut`
    is a free open source application. `Shotcut` is also a cross-platform tool that
    can be installed on Linux, FreeBSD, Windows, and macOS. You can find out more
    about `Shotcut` at `https://www.shotcut.org`.


    If you are thinking of becoming a rock star one day, you may find that you need
    to edit some audio for your demo CD. All jokes aside, though, Linux has tools
    for too. `Audacity` is a free open source digital audio editor that is available
    for Linux, Windows, and macOS. This program allows a user to record audio from
    multiple sources and conduct post-processing for all types of audio formats. Whether
    you want to mix an entire album or you are thinking of starting a podcast, `Audacity`
    can handle it all. `Audacity` is comparable to `Adobe Audition` or Apple’s `Logic
    Pro` software used by many professionals in the recording industry. You can find
    out more about `Audacity` at `https://www.audacity.com`.


    ## Managing Software Packages


    When we install a Linux distribution, it normally comes with many pre-installed
    applications so that a user can work right away. This may include programs such
    as office productivity suites, media players, and web browsers. In addition to
    these pre-installed applications, Linux distributions can also access package
    repositories that contain a vast collection of easily installable applications.
    These are called packages.


    A `package` is a compressed file archive containing all the files that come with
    a particular application. The files within the `package` are usually stored according
    to the relative paths within a distribution. Most packages also contain distribution-specific
    installation instructions and a list of any other packages that are prerequisites
    for installation. In Linux terminology, these prerequisites are called dependencies.
    Simply put, a `dependency` is a broad software engineering term that refers to
    a piece of software that another software relies on for installation. For example,
    the `VLC media player` has a large list of dependencies that we first need to
    install, such as various video codecs to allow playback within the media player.


    Linux packages utilize three common file types: `.deb`, `.rpm`, and `.tgz`. The
    filename extension of the package usually indicates which Linux distribution the
    software was compiled to work with. For example, a `.deb` package contains software
    compiled and packaged for Debian and other Debian-derived dist like `Ubuntu`,
    `Kali Linux`, and `Tails`. The `.rpm` package format was originally developed
    for Red Hat Linux, but it is also used in other distributions like `Fedora` and
    `openSUSE`. The `tarball` or `.tgz` package format is sometimes referred to as
    the universal package format. This is because a `tarball` just takes multiple
    files and sub-directories and compresses them using the `gzip` compression software
    to save bandwidth for users trying to download and install them. If the `tarball`
    is uncompressed, it usually ends with `.tar` in its filename.


    Since Linux packages do not usually contain the dependencies necessary to install
    them, many Linux distributions use package managers that automatically read dependencies
    files and download the necessary packages before proceeding with the installation.
    Some common package managers are `APT`, `YUM`, and `Pacman`. While the various
    Linux distributions offer roughly the same types of applications, there are still
    many different package management systems in use today.


    For instance, Debian and Debian-based distributions use the `dpkg`, `apt-get`,
    and `apt` tools to install software packages using the `.deb` package format.
    `Dpkg` is the software at the base of the Debian package system and is a low-level
    package manager. Being a low-level package manager, `dpkg` can only install a
    package if all the dependencies are already installed. `APT`, the Advanced Package
    Tool, is a higher-level package management tool. `Ubuntu` created `APT` to include
    the `apt-get` and other tools. Since `APT` is a higher-level package management
    tool, it can find, install, upgrade, and remove packages and their dependencies
    for you.


    If you are using a distro like Red Hat, Fedora, or CentOS, then you will download
    and use packages in the `.rpm` format. These distros use the `RPM`, `YUM`, and
    `DNF` commands instead of `dpkg` and `APT`. `RPM` is both a package format and
    a low-level package management tool. `YUM` is a higher-level package manager,
    and `DNF` is a newer replacement for `YUM`. In fact, `DNF` stands for “dandified
    yum”.

