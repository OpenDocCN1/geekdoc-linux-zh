    \ Jason$\n```\n\nUnfortunately, since we only used the `-a` option, we no longer\
    \ have all the additional details from the long format displayed. But, if we combine\
    \ the `-l` and `-a` options into a single option of `-la`, as shown:\n\n```\n\
    | DionTraining:Documents jason$ ls -la LinuxEssentialsstotal 16drwxr-xr-x 4 jason\
    \ staff 128 Sep 8 10:08 .drwx------+ 22 jason staff 704 Sep 8 10:06 ..-rw-r--r--@\
    \ 1 jason staff 4 Sep 8 10:07 Questions.txt-rw-r--r--@ 1 jason staff 4 Sep 8 10:07\
    \ StudyGuide.txtDionTraining:Documents Jason$\n```\n\nThe above examples are not\
    \ designed to make you an expert in the `ls` command, but instead you should now\
    \ see the concept of how we can put together the proper syntax to pass different\
    \ options and arguments to a command. Notice that in all these examples, we passed\
    \ the name of the directory whose contents we wanted to list (`LinuxEssentials`),\
    \ as well.\n\nWe can summarize this generalized command structure as “command\
    \ option arguments.” Each of these three portions answers a different question\
    \ for the program’s execution:\n\n| Command | What to do? |\n| :--- | :--- |\n\
    | Options | How to do it? |\n| Arguments | What to do it to or with? |\n"
