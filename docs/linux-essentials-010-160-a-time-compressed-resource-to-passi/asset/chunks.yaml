    # 发行版对比


    几个不同的 Linux 发行版示例包括 `Ubuntu`、`OpenSUSE`、`Debian` 和 `Gentoo`。虽然它们都是 Linux，但外观和操作方式有所不同。


    ## Ubuntu

    `Ubuntu` 默认带有 `Unity` 桌面。`Unity` 是一个布局良好且视觉舒适的环境。点击屏幕左下角的点，会列出 `Ubuntu` 中安装的所有程序。在屏幕左侧有一列图标，其中之一是
    `Files`。`Files` 会打开 `Ubuntu` 的图形化桌面文件系统，它与 `Windows Explorer` 非常相似。`Ubuntu` 预装了网页浏览器
    `Firefox`，允许用户访问互联网上的任何网站。`Ubuntu` 还有一个名为 `Ubuntu Software` 的应用商店，允许用户搜索音频视频、游戏、生产力工具等软件。要安装软件，只需点击该软件的图标并按照屏幕指令操作即可。


    ## OpenSUSE

    带有 `KDE` 桌面环境的 `OpenSUSE` 看起来像传统的 Windows 桌面，屏幕左下角有开始菜单。点击该按钮显示电源按钮、我的电脑和应用程序等项目。就像在
    `Windows` 中一样，右键点击桌面可以更改背景的选项。`OpenSUSE` 还自带 `LibreOffice` 办公套件，它的工作方式与 `Microsoft
    Office` 一样。`LibreOffice` 允许我们创建文档、电子表格或演示文稿。


    ## Debian

    运行在 `Debian` 上的 `Gnome` 桌面看起来和运行与 `Unity` 或 `KDE` 不同。`Debian` 被称为“平面操作系统”，因为它的界面并不美观。要访问应用程序，用户可以点击
    `Gnome` 桌面左上角的 `Activity` 打开菜单，显示如 `Firefox`、`LibreOffice` 或其自身的应用程序安装程序等程序。关键在于，这些程序的访问方式与前两个发行版不同。


    ## Gentoo

    `Gentoo` 带有 `XFCE`。这个桌面环境对系统的要求较低，桌面强度较低。它看起来比其他三个桌面环境更“平”。它类似于 `Macintosh` 系统，在屏幕底部中部有一个应用程序启动栏。由于
    `Gentoo` 是一个低要求的发行版，它可以在配置低于当今市场电脑的旧电脑上运行。在 `XFCE` 桌面环境中，有几种方法访问和运行应用程序。右键点击桌面会将应用程序作为菜单的最后一选项显示，并展开显示应用程序列表。在桌面环境中启动应用程序的第二种方法是点击屏幕左上角的
    `Applications` 按钮。屏幕底栏启动器上的放大镜也允许我们搜索需要运行的应用程序。


