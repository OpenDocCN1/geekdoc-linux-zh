- fmt: "\nWith the emergence of the internet and new technologies, `Linux` has become\
    \ so common that it is a household name. `Linux` is a family of open source, Unix-like\
    \ operating systems, typically packaged into a distribution. It is the operating\
    \ system of choice for many educational and commercial institutions due its robustness\
    \ and extremely low cost of acquisition. Linux distributions include the `Linux\
    \ kernel` and supporting system software and libraries to provide features that\
    \ users interact with.YouYou may have heard of popular Linux distributions such\
    \ as `Ubuntu`, `Debian`, and `Fedora`, but there are hundreds, if not thousands,\
    \ currently in active development. `Linux`’s popularity is mainly because it is\
    \ open source software, which allows anyone to freely download, modify, and even\
    \ redistribute it. The open source origin of `Linux` is one of the main reasons\
    \ for its widespread adoption and success.Most Linux distributions include a windowing\
    \ system and a desktop environment that provides the user with a graphical user\
    \ interface (`GUI`), much like `Microsoft Windows`. We will cover all the major\
    \ features and functions of this wonderful operating system throughout this book.\
    \ There are many Linux distributions that are solely for servers. These distributions\
    \ often omit the graphical desktop altogether. This means that it is important\
    \ for you to also become familiar with the Command Line Interface (`CLI`) or terminal.\
    \ This command shell requires proper syntax to utilize, though, and is considered\
    \ harder to use than the `GUI` alone.For this reason, it is important for you\
    \ to learn both the graphical interface and the command line interface to become\
    \ proficient in `Linux`. If you want to become a successful end user or `Linux`\
    \ system administrator, it is worth your time to learn to use both environments\
    \ adequately.But why should you want to learn how to use `Linux` anyway? Well,\
    \ if you take a quick look at the internet, you will find that `Linux` is everywhere.\
    \ In fact, over 96% of all web servers operate on servers running one of the numerous\
    \ Linux distributions. `Linux` is considered the go-to operating system in many\
    \ industries due to its advantages, like scalability and open source, over other\
    \ operating systems.\n\n## Open Source Philosophy\nYou may have encountered the\
    \ term open source while browsing the internet or participating in some online\
    \ forums. `Linux` is heavily influence by the open source philosophy. This mindset\
    \ has had an extreme impact on development of the `Linux` operating system and\
    \ its numerous distributions. Open source refers to computer software or programs\
    \ in which the source code is readily available for public use or modification\
    \ from its original design. It encourages a collaborative effort among programmers\
    \ and general users in that program or software's community to improve on its\
    \ design and purpose.\n\nWhat are some examples of open source software? Well,\
    \ if you just look at a simple web server, you will find a lot of open source\
    \ software. For example, if you are running an `Apache` web server, then you are\
    \ running open-source software. How about `WordPress`? Well, `WordPress` runs\
    \ over 30% of the internet’s websites these days, and guess what? It is also open\
    \ source.\n\nSince `WordPress` is open source, this means that you can go to `WordPress.org`,\
    \ download the entire code base for the `WordPress` content management system,\
    \ and you can modify, edit, or change it as much you like. This is the great thing\
    \ about open source software. You have full access to all the code that runs these\
    \ programs, and you can modify it to meet your exact needs. The software or program's\
    \ original designers then release the source code under the terms of a software\
    \ license. The software license will dictate what users can modify in the original\
    \ package distribution and how they can redistribute the modifications (called\
    \ versions or forks) to the community and general public. \n\nThere are many different\
    \ types of software licenses used in the open-source community. These include\
    \ the `GNU General Public License`, the `Apache License`, the `MIT License`, and\
    \ even the `Unlicense`. These licenses represent the entire spectrum of open source\
    \ licenses, from highly protective to unconditional. Depending on your specific\
    \ needs for your open-source project, you can choose which of these open-source\
    \ licenses work best for your use.\n\n## Linux Distributions\nWe already discussed\
    \ that `Linux` is packaged into several distributions (distros for short). Each\
    \ distro contains a `Linux kernel`, supporting software and libraries, as well\
    \ as configuration files. By combining all these components, `Linux` becomes a\
    \ complete operating system, just like `Microsoft Windows` or `Macintosh OS X`.Linux\
    \ distributions differ from one another depending on who the developers are and\
    \ what they want their distribution to achieve. Almost like a brand-new company,\
    \ each distribution has its own goals and mission. Based on this, some distributions\
    \ are more popular than others and can server larger or smaller audiences.\n\n\
    At the core of any Linux distribution is a `Linux kernel`. A `kernel` is a low-level\
    \ computer program functioning as the bridge between the user and the computer’s\
    \ resources. Some of its functions include memory management and managing input\
    \ and output devices. Essentially, the `Linux kernel` is the core computer program\
    \ that has complete control over everything in the system. As the `Linux kernel`\
    \ is constantly evolving, two distributions are likely to use slightly different\
    \ kernels, as the developers make small changes to fix bugs or to add features\
    \ and functions to their own distro’s kernel.\n\nIn addition to the `kernel`,\
    \ some distributions also come packaged with different software and tools such\
    \ as the `X Window System` (called `X11` or `X`), as well as utilities to manage\
    \ disks that are critical to the system’s normal functioning. The `X Windows System`\
    \ is an example of software providing the basic framework for the graphical user\
    \ interface (`GUI`) environment. This allows Linux users to draw and move windows\
    \ on the monitor and to interact with a mouse and keyboard, similar to what you\
    \ are used to when you use a `Windows` or `Mac` computer.\n\nSince a Linux distribution\
    \ is a complete operating system, additional software such as server daemons,\
    \ networking programs, desktop environments, and productivity tools are also shipped\
    \ as part of the complete system. This supplemental software helps to provide\
    \ specific types of branding for some distributions. This is especially true when\
    \ it comes to the desktop environment and the ability to easily manage the system.\
    \ For example, a specific distribution may come with the commonly used productivity\
    \ software like word processing, spreadsheet, or presentation programs already\
    \ installed.\n\nOne unique feature of `Linux` is the way... (Note: The provided\
    \ text contains many repetitive/fragmented sentences at the end; I have formatted\
    \ the core content provided).\n"
