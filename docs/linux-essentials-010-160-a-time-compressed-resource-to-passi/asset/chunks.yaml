    due to their size or configuration. Some desktops, though, have Wi-Fi capabilities
    in addition to their wired connections.To easily configure the Wi-Fi connection,
    it is best to use the graphical user interface. Each distribution uses a different
    method and setup for connecting to Wi-Fi, so you should consult your distribution’s
    online manual or forums for details of how to do this. For most distributions,
    connecting to the Wi-Fi through the graphical interface works similarly to a Windows
    or Mac computer and relies on a point and click interface.If someone needs to
    fine-tune the wireless connection, they can use various tools to scan for available
    wireless networks and manage the existing Wi-Fi links connected to a given system.
    To do this, the user can utilize the iwlist and iwconfig utilities. The iwlist
    command can identify nearby Wi-Fi networks by scanning the airwaves within the
    Wi-Fi frequency bands of 2.4 Ghz and 5.0 Ghz, depending on the type of wireless
    adapter installed within the user’s system. To scan for a list of nearby networks,
    simply type iwlist scan or iwlist scanning as either the root user or using the
    sudo command to obtain a complete list of the networks within range of the system.Once
    a network is found, a user can manually connect or disconnect from a specified
    network using the iwconfig utility. There are numerous options and flags that
    can be used with the iwconfig command, so I recommend consulting the man pages
    for this utility to ensure you are using it properly.To configure a wired connection,
    a user may simply use the graphical user interface like they would within Windows
    or Mac. If the user requires more fidelity and control over the configuration,
    then we may use command line tools instead. Just as iwconfig configures a wireless
    network, the command ifconfig configures a wired network. The ifconfig utility
    allows a network connection to be started up or shut down, allows for the allocation
    of an IP address and network mask to a specific piece of hardware, and allows
    the defining of other configuration details within a connection. The ifconfig
    command is primarily for wired connections, but it can configure a wireless connection
    once the wireless connection has been established using iwconfig.There are many
    other flexible text-based tools for both wired and wireless connections. These
    tools include route, /etc/resolve.conf, DHCP utilities, and distribution-specific
    network scripts.The route utility allows the user to adjust the computer’s routing
    table to determine the path through which the network device will send specific
    network packets. By using the route command, a Linux system can effectively become
    a network router for the other machines on the network as well.The /etc/resolv.conf
    file contains the IP addresses of up to three DNS servers as well as the name
    of the computer’s Internet domain and of other domains that should be searched
    when the user omits a domain name from a hostname. If you need to modify the DNS
    entries used by a given Linux system, this can be done within the /etc/resolv.conf
    file.As stated earlier, DHCP is the easiest method for configuring the network
    connection on a Linux machine since it automatically configures the system. To
    enable this, though, the Linux machine must have a DHCP client installed. The
    most common DHCP client programs are known as dhclient or dhcpcd.The ifconfig,
    route, and DHCP client programs only produce a temporary change to the computer’s
    network configuration. To make these changes permanent, the settings must be stored
    within a configuration file that is loaded when the system is booted up. To help
    automate this process, many distributions create network scripts to help with
    this boot up and configuration process. Each distribution uses its own methods
    and scripts for this purpose, and these are referred to as distribution-specific
    network scripts.Testing the NetworkIn most cases, the network connection will
    work fine from the moment the Linux system first boots up. However, there are
    time when a user may be a need to diagnose a problem with the network because
    a formerly working connection has stopped working or it does not work from the
    start. There are several ways to test for network connectivity.The first network
    connectivity test checks the routing table using the route command to ensure that
    the default route is properly set and to check that the routing is sensible. In
    most cases, typing route by itself at the terminal will display the routing table
    to the display. The routing table of a typical workstation or server is generally
    quite simple and can be automatically configured. If the Linux system is functioning
    as a network router, though, these often require complex routing tables which
    are beyond the scope of the LPI Linux Essentials certification exam.The next most
    basic network connectivity test uses the ping utility. The ping command sends
    a simple network packet to the system you name, via IP address or hostname, and
    waits for a reply. In Linux systems, ping continually sends packets once every
    second until the command is interrupted with the Ctrl+C keystroke combination.To
    diagnose where a network problem resides when using the ping command, you must
    consider three scenarios. First, if you can ping a system on the internal network
    but not a system on an external network, the problem is probably in your router
    or in an improper router specification. Stated another way, if you can ping another
    workstation within your network but you cannot ping a website like Google or Facebook,
    then the issue must exist with the router or the external network connection.Second,
    if you can ping a system by its IP address but not by its name, then the problem
    is most likely with the DNS server or your system’s DNS configuration settings.
    So, if you can successfully run ping 8.8.8.8, but you get an error when running
    ping diontraining.com then the issue is likely caused by a DNS issue.Third, if
    you cannot ping any systems at all, then you probably have a fundamental configuration
    problem on your system. This could be caused by a corrupted network software stack
    or even faulty hardware on your Linux system. In any case, the problem exists
    within your machine, and not with the larger network or remote systems.While ping
    is very useful in testing the entire connection from your system to the remote
    system, there is a more useful tool that can be used when you are trying to determine
    where exactly the connection is broken between your system and the remote system.
    To determine where the break in connectivity is occurring, a command known as
    traceroute is utilized. The traceroute command sends a series of three test packets
    to each system between your computer and a specified remote system. As traceroute
    conducts each set of tests, it displays the results on the screen to inform the
    user of which systems are reported as functional and which may be the cause of
    the break in connectivity. This is helpful for determining whether a problem in
    network connectivity exists within a network which you are responsible for or
    if it is problem with an external connection and, therefore, a problem for your
    internet service provider to solve.As stated earlier, the problem may be caused
    by an issue with the domain name system (DNS). DNS is the internet''s equivalent
    of a phone book; it maintains a directory of domain names and translates them
    to Internet Protocol (IP) addresses. This is necessary because, although domain
    names are easy for people to remember, computers or machines need to access websites
    based on IP addresses.  DNS problems can cause networks to fail almost as badly
    as a physically cut cable. Because both people and many network tools rely on
    hostnames, if DNS resolution doesn’t work then the network becomes nearly useless.
    A user can test their network’s DNS server by using several tools, such as host,
    dig, and nslookup.The final diagnostic tool to consider is known as netstat. This
    utility is sometime referred to as the Swiss Army knife of network troubleshooting
    tools because it can be used in place of several other tools depending on the
    parameters passed to it. For example, the --all or -a option displays information
    about the ports that a server has open and is currently listening for network
    connections on, as well as any already-open connections. To learn all about netstat,
    please enter man netstat from within your terminal window.Protecting the NetworkThese
    days, one of the most important issues involving technology revolves around system
    security and data protection. In this section, you will find a few basic tips
    to prevent your Linux system from becoming compromised by a malicious attacker.
    While many people claim that Linux is more secure than Windows, without proper
    precautions a Linux system can be just as vulnerable as its Windows counterpart.
    Luckily for us, Linux doesn’t have nearly as many viruses or worms designed to
    run on its system, but by following these five simple rules you can increase your
    chances of keeping your system safe from attackers.First, you should always shut
    down any unused services or daemons on your Linux system. In Linux, the majority
    of risks center on an outsider’s ability to break into a system by abusing a server
    program that is running on your machine. Therefore, it’s important not to run
    any servers, services, or daemons unnecessarily. Many distributions automatically
    install and run numerous servers, such as the Secure Shell (SSH), the Apache web
    server, a Sendmail server, or a Postfix email server. To thoroughly remove a server
    from a system, you should uninstall it by using the appropriate package management
    system by using the uninstall command.Second, you should always enable a firewall
    on your Linux system. A firewall is a software program or system setting that
    inspects each network transactions and then allows or disallow them based on programmed
    criteria within an access control list (ACL). Most Linux distributions enable
    an embedded software firewalls by default, but there may be a need to adjust their
    settings for your specific needs. When configuring a firewall, it is best to use
    a “deny by default” security posture, and only allow network connectivity in and
    out of the system as needed for your operational use.Third, you should always
    use good passwords for your accounts on your system. If your system runs a login
    server of any type, then setting a long, strong, and complex password can minimize
    the risk of an outsider breaking in by simply guessing one of your user’s passwords.
    Passwords should be at least 14 characters long, include uppercase and lowercase
    letter, numbers, and special symbols. Also, your everyday user account and your
    root user account should never use the same password.Fourth, always be ssuspicious
    when using a network connected system. You must always remain suspicious of any
    untrusted sources of data, such as emails, websites, and other internet sources.
    Phishing is a common occurrence; this is an attempt to extract sensitive data
    from users by posing as a trusted individual or organization via email or other
    means. Phishing and similar attacks can trick users into providing their passwords,
    financial data, and other critical data. While malware (malicious software) is
    rare on Linux system, a determined attacker could create malware to target your
    organization. Therefore, it is best to stick to official software sources and
    always remember that emails, websites, and other types of communication can be
    easily faked to trick you.Fifth and finally, always keep your software up to date.
    Whenever a hacker finds a way to exploit a software bug for their advantage, the
    creators of the software fight back by releasing a security update to the software
    program. But, if you don’t update the software on your system, then you are still
    using the older software with the bug and are vulnerable to attack. Therefore,
    it is critical to always keep your software patched and up to date using the package
    management tools described previously in this book. It is best to check regularly
    for software updates and most distributions will have an automated mechanism to
    check for updates daily or weekly.'
