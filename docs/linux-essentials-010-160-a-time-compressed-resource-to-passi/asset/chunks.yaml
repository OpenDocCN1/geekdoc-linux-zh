  trans: '

    虽然桌面环境完全基于图形用户界面，但 Linux shell（外壳）是基于文本的命令行环境。在你的 Linux 之旅途中，了解 shell 的一些基础知识是非常重要的，因为它会代表桌面环境在后台执行所有命令。简单来说，Linux
    shell 是一个从键盘接收命令并将其提交给内核执行的程序。过去，大多数操作系统仅以文本命令行界面的形式存在。然而，如今，桌面环境或 GUI 运行在命令行界面（CLI）之上，使得终端用户执行命令和处理任务变得简单得多。


    当用户点击位于桌面上的快捷方式时时，该快捷方式可能包含一个预定义的命令，该命令与执行程序所需的正确语法法封装在一起。例如，如果你点击了桌面上的 Google
    Chrome 快捷方式，它可能被配置为打开网络浏览器并加载你的主页。要实现这一操作，你只需双击该快捷方式，GUI 就会将该动作翻译为隐藏 `CLI` 内的一系列命令。


    Linux 命令行，或者更准确地称为 shell，可以在一个名为 `terminal`（终端）程序的 GUI 窗口中启动或运行。某些 Linux 发行版（例如为服务器设计的版本）会完全消除桌面环境，以节省处理器和内存资源。这允许用户通过文本模式控制台直接本地登录系统，或者在用文本模式登录协议（如
    `Telnet` 或 `SSH`）远程登录服务器时连接到 shell。


    ## Shell 的类型

    尽管如此，大多数 Linux 发行版都提供了使用几种不同 shell 的选项。这些包括 Bourne Again Shell (`bash`)、Korn shell
    (`ksh`)、TENEX C Shell (`tcsh`) 和 Z shell (`zsh`)。


    最常用的 shell 被称为 `bash`。它基于一个名为 Bourne Shell 的旧版 shell。`bash` 是一个运行在命令行界面内的程序，用于从命令行或从名为
    `shell script`（shell 脚本）的文件中读取并执行命令。


    Korn shell 以其创建者 David Korn 命名，并作为 POSIX.2 操作系统的基础。`tcsh` 是一种 shell，它在早期的 `csh`（C
    shell） 的基础上进行了改进，添加了命令行补全、命令行编辑以及一些其他额外功能。`csh` 是基于 BSD 的操作系统（如 FreeBSD）的默认 shell。`zsh`
    是一种交互式登录 shell 和命令行解释器，它被选为 macOS Catalina (10.15) 及更高版本 macOS 的默认 shell，以替代 `bash`。


    对于书中的任何演示，我们将依赖 `bash`，因为它是 Ubuntu 默认使用的，并在 Linux 社区中广泛使用。上述列出的大多数其他 shell 也与
    `bash` 兼容并提供类似的功能，尽管存在一些细微的。


    每个 Linux 用户账户都指定了自己的默认 shell，因此个人用户可以根据喜好更改 shell。这可以通过账户管理工具完成，例如 `usermod`，我们将在后面的章节中详细介绍它。


    如果你正在使用桌面环境，可以通过运行名为 `terminal emulator`（终端模拟器，通常简称为 `terminal`）的程序来访问 shell。`terminal`
    打开一个窗口，并允许用户在桌面环境中与 shell 交互。通常，桌面环境有自己的 `terminal`，因此你将使用的 `terminal` 程序可能取决于你安装的桌面环境。许多终端程序的名称中都包含
    `terminal` 字样，例如 `gnome-terminal`。其他程序如 K 桌面环境（KDE）的 `Konsole` 和通用的 `XTerm` 则没有指定必须与哪种桌面环境配合。再次，Linux
    为用户提供了许多可选的终端模拟器，包括 `rxvt`、`kvt`、`nxterm` 和 `eterm`。


    虽然有很多不同的终端模拟器，但它们本质上做的是相同的事情。它们为终端用户提供了直接访问交互 shell 会话的权限，用户可以在会话中向操作系统发布命令。


    启动 `terminal` 的具体方法因桌面环境而异。通常，可以在桌面环境的菜单中找到 `terminal` 条目。许多桌面环境还提供搜索功能，你可以在其中找到该系统中安装的所有不同终端的完整列表。例如，在
    Ubuntu 的 Unity 桌面，点击应用程序启动器顶部的 Dash 图标（Ubuntu 符号）将显示搜索栏。如果你开始输入“terminal”一词，它将在搜索结果中显示可用的终端应用程序。


    启动 `terminal` 更快的方法是使用键盘快捷键，只需按下 `CTRL+ALT+T`。


    大多数终端程序支持标签（tabs），就像你在浏览器浏览器使用的标签一样。打开多个标签可能很有帮助，因为这允许用户同时运行多个程序、在多个目录中轻松工作，或者同时以普通用户和
    root 用户身份运行程序。在 Linux 系统上，root 用户作为超级用户或管理员。


    ## 基础命令

    要使用 shell，你需要学会一些基础命令。任何 Linux 用户在 shell 中应该学习的前十个命令是 `ls`、`cd`、`mv`、`mkdir`、`touch`、`rmdir`、`rm`、`locate`、`clear`
    和 `man`。


    - `ls` (list) 命令用于显示 shell 内的文件、文件夹和目录信息。这相当于在桌面环境中查看文件夹内的文件/文件夹列表。

    - `cd` (change directory) 命令允许用户在两个目录之间切换。这相当于在桌面环境中双击文件夹。

    - `mv` (move) 命令允许用户移动文件/文件夹。这相当于在桌面环境中使用 shell。

    - `mkdir` (make directory) 命令用于创建一个新目录。这相当于在桌面环境中右键点击并“新建文件夹”。

    - `touch` 命令用于在命令行创建一个新的空白文件。这相当于在桌面环境中右键点击并“新建文档”。

    - `rmdir` (remove directory) 命令用于删除空目录。这相当于在桌面环境中将文件夹拖入回收站。

    - `rm` (remove) 命令用于删除文件或目录。由于 `rmdir` 命令只能删除空目录，`rm` 命令可以删除文件和非空目录。这相当于在桌面环境中将文件夹拖入回收站。

    - `locate` 命令在文件系统中查找文件。如果你不记得某个文件保存在文件系统的哪里，`locate` 命令非常有用。这相当于在其他桌面环境中使用搜索或
    Spotlight 功能。

    - `clear` (clear the screen) 命令清除终端显示的内容。当屏幕上有大量信息且之前的命令留在屏幕上干扰终端时，这非常有用。使用 `clear`
    命令会将用户带回终端顶部并返回 shell 提示符和当前目录。这相当于在桌面环境中关闭大量窗口。

    - `man` (manual) 命令显示给定命令的所有信息。当用户不确定如何执行操作或如何正确输入命令语法时，`man` 命令是必不可少的。这相当于用户打开包含命令如何工作细节的帮助文件或文档。


    ## 命令行语法

    当计算机尝试操作时（无论它运行在什么操作系统上），可以简化为四个步骤：

    1. 计算机等待用户输入

    2. 用户选择要使用的命令

    3. 用户通过键盘或鼠标输入

    4. 计算机执行命令


    在 Linux 中，shell 显示一个输入命令的提示符。该提示符通常由用户和主机（计算机/服务器）名称、当前目录和一个最后一个字符组成。如果你使用的是 `bash`，那个最后一个字符就是美元符号。例如，使用
    `bash` 的终端所示：


    ```

    user@host:~$

    ```

