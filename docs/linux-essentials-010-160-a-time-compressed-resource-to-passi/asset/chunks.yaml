    # 第十一章：用户账户与组


    ![](img/Image00026.jpg)


    ## 目标


    - 理解 Linux 中用户账户的工作原理

    - 描述基础账户安全

    - 理解 Linux 中的组管理

    - 描述 root 用户与其他用户之间的区别


