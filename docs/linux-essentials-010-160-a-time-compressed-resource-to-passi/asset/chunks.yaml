  trans: '

    由于 Linux 是一个多用户操作系统，它提供了相关工具使用户和系统管理员保护文件和目录免受未经授权的访问。为了保护系统上的文件和目录，Linux 为每一个文件和目录分配了所有权和权限。所有权和权限是交织在一起的，因为每个文件都与其所有者以及该所有者所属的组相关联。权限是根据文件所有者对文件可以的操作、所有者所属组的其他成员对文件可以的操作，以及系统上其他用户对文件可以的操作来设置的。Linux
    使用不同的工具来操作文件或目录的所有权和权限。让我们详细考虑一下所有权的概念以及用于操作所有权的命令。


    ### 所有权

    Linux 的安全模型假设存在多个用户，并提供了将文件与用户相关联的手段。Linux 内部的每个文件或目录都被分配了一个用户和一个组。默认情况下，当我们创建一个文件时，它会被分配给当前登录的用户及其所属组。由于每个文件都有所有者，因此每个文件都会与用户账户的
    `UID` 关联。此外，每个文件还通过其 `GID` 与一个组关联。这允许系统通过为文件所有者、组以及所有其他用户独立设置的权限来控制对每个文件的访问。


    要完全控制文件或目录的所有权，请利用 root 用户。root 用户可以在终端中使用 `chown` 命令更改任何文件或目录的所有权。通过输入 `chown
    <username> <file or directory>` 来执行 `chown`（更改所有者）。要了解更多关于 `chown` 命令的信息，请输入 `man
    chown`。


    所有者可以更改其拥有的任何文件或目录的关联组，但他们只能将其更改为用户所属的其他组。如果需要将文件或目录更改为所有者不所属的组，则必须由 root 用户账户进行此更改。要更改与文件或目录所有权关联的组，请通过输入
    `chgrp <username> <file or directory>` 使用 `chgrp` 命令。要了解更多关于 `chgrp` 的信息，请输入 `man
    chgrp`。


    ### 权限

    如果没有一种控制对每个文件或目录实际可以执行的操作的方法，那么文件所有权毫无意义。权限被设置为三组，即所有者权限、组权限和公共（或其他）权限。所有者权限规定了文件或目录的所有者对该文件可以的操作。组权限规定了所有者组的成员可以执行的操作。最后一类权限被称为公共或其他权限，表示系统上任何不是所有者也不是所有者组成员的其它用户可以执行的操作。


    要确定文件的权限，用户可以使用 `ls -l <file>` 命令创建长目录列表，以显示该文件的权限。考虑以下示例，它列出了名为 `test.sh` 的文件的权限：


    ```

    $ ls -l test.sh

    -rwxr--r-- 1 jason instructors 45 Nov 19 23:49 test.sh

    ```

    '
- fmt: '

    The output of the long directory listing includes the permission, the number of
    links, the username, the group name, the file size, the time stamp, and the filename.


    The first column displays the permissions for the file, in this case-`-rwxr--r--`.
    The first `-` indicates the file type code. This single character code of `-`
    indicates this is a normal data file that may be text, an executable program,
    graphics, compressed data, or any other type of data. If this first character
    is a `d`, this indicates the file is a directory. If it is a `|`, it indicates
    it is a symbolic link to a file or directory. If it is a `p`, it indicates a named
    pipe that enables two running Linux programs to communicate with each other in
    one-way manner. If it is a `s`, it is a named socket that permits network and
    bidirectional communication. If it is a `b`, it indicates the file corresponds
    to a hardware device which uses blocks to transfer data, such as a hard disk drive.
    If it is a `c`, it indicates a character device, which is a file that allows a
    single byte of data to be transferred at a time (for example, a parallel or serial
    port). In general, most files will have either a `-` or a `d` as their file type
    code.


    The next 9 characters of the permission string is used to represent whether this
    file can be read (`r`), written to (`w`), or executed (`x`), and by whom. The
    first three of these characters define the permission for the user, the next three
    for the group members, and the final three are for the world or other permissions.


    After the permission string, the next column represents the number of hardlinks
    on the system for this file. In that case of the `test.sh` file, only a single
    hardlink exists on even system. Remember, a hardlink is a unique filename that
    may be used to access this file, therefore in this case only `test.sh` is used
    to reference this file.


    The next column contains the file owner’s username. In this example, the file
    `test.sh` is owned by `jason`. This file is also associated with the group name
    of `instructor`, which is the next column displayed in the output.


    After the username and group name, the size of the file in bytes is displayed.
    Since this is a short and simple script, the file size is only 45 bytes.


    The next column contains a time stamp. This identifies the time that the file
    was last modified. In this case, the file was modified last on Nov 19th at 11:49
    pm (23:49).


    The final column contains the filename. While this isn’t as useful in this example
    since we entered the filename when we initially executed the command, it is useful
    if the contents of a directory are being displayed instead. For example, if the
    user simply typed `ls -l`, then every file and sub-directory within the current
    directory would be listed and the filename field identifies each one.


    To change the permissions on a file, use the `chmod` command. For example, to
    set the read, write, and execute permissions for users, groups, and world/other
    for the `test.sh` file, the user will enter `chmod ugo=rwx test.sh`. The `u` (user),
    `g` (group), and `o` (world/other) identify which permissions are used for which.


    ## Octal Permissions


    In the previous section, we described the four parts of the permission string:
    file type code, user permissions, group permissions, and world or other permissions.
    Each of these three permission groups were represented with the letters `r` (read),
    `w` (write), or `x` (execute).


    Read permissions simply indicate whether one can actually open up the file to
    see the contents. Write permissions indicate that the user can modify the file
    or create new files within the directory. The execute permission, though, indicates
    if a file may be run as a program or script. If the user, group, or world/other
    does not have permission to take the read/write/execute action, its corresponding
    location in the permission string is replaced with a `-` instead of its symbolic
    letter.


    For the LPI Linux Essentials exam, it is important that you can read and understand
    what a permissions string indicates. For example, if the permission string of
    `-rwxr-xr-x` was displayed, what does it indicate to you about the file’s permissions?


    1. First, the file type code is a `-`, which indicates it is a normal data file.

    2. Second, the first three characters of `rwx` indicates that the user can read,
    write, and execute this file.

    3. Third, the second three characters of `r-x` indicates that other members of
    the user’s group can read and execute the file.

    4. Finally, the third three characters or `r-x` indicates that the world or other
    users on the system can read and execute the file.


    In summary, this file is a normal data file that the user who owns it can read,
    write, and execute, and every user can read and execute it. Being able to understand
    and simply explain the permission strings is crucial to your success on the LPI
    Linux Essentials exam.


    Now, there is a second way, known as octal, to indicate permissions within Linux.
    An octal is a shorter way of writing the permission strings by using three numbers
    from 0 to 7 to indicate the permission for the user, group, and world/other permissions.


    Each number in the octal is created by assigning a value to the read, write, and
    execute permissions. If read permissions are set, then a `4` is given. If write
    permissions are set, then a `2` is given. If an execute permissions are set, then
    a `1` is given. If multiple permissions are given, then the values are added together.


    For example, if the file has read, write, and execute permissions, this is set
    to `7`, because read (`4`) plus write (`2`) plus execute (`1`) equals `7`. If
    a file has read and write permissions but no execute permissions, then the value
    is `6`. If a file has read and execute permission, but no write permissions, then
    the value is `5`. If no permissions are given, then the value is `0`. If it has
    write and execute permission, then the value is `3`.


    Each number represents a single-character permission set. To assign permissions
    for the user, group, and world/other, use three digits. Returning to the earlier
    example of `-rwxr-xr-x`, what would the octal permission become? The answer is
    `755` because the user can read (`4`), write (`2`), and execute (`1`); therefore,
    its value is `7`. Then the group can read (`4`) and execute (`1`); therefore,
    its value is `5`. Like the group, the world/other can also read (`4`) and execute
    (`1`); therefore, its value is `5`.


    To change the permissions on a file, use the `chmod` command. For example, to
    set the read, write, and execute permissions for users, groups, and world/other
    for the `test.sh` file, the user will enter `chmod 777 test.sh`.


    ## Special Cases with Permissions


    There are a few special cases with permissions of which a user should be aware.
    The most important is the fact that most permission rules simply don’t apply to
    the root user. Remember, a superuser can read or write any file on the system,
    including ones that have permission set to `000`.


    While the Linux filesystem treats files and directories fairly, it is important
    to note that permissions mean slightly differing things when used on a file and
    a directory. If a file is granted execute permission, it indicates that the file
    can be run as a program or script. If a directory is granted execute permission,
    though, it indicates that the directory may be searched. If a file is granted
    write permission, this indicates that the file may be modified or overwritten.
    Since directories are simply files interpreted in a special way, a directory with
    the write permission allows users to create, delete, or rename files.


    This may seem like a bug — after all, if a user can’t write to a file, then it
    would seem logical to think they shouldn’t be able to delete that file. However,
    it is important to remember that directories are just a special type of file that
    holds other files’ names and pointers to lower-level data structures. So, while
    modifying a file requires write access to the file, creating or deleting a file
    only requires write access to the directory in which it resides. Therefore, this
    is not a bug in Linux; it is just a counterintuitive feature of the Linux filesystem
    and its permissions.


    Finally, symbolic links are a special case in terms of permissions. This is because
    symbolic links always have permission set to `777` and have read, write, and execute
    permissions enabled for all users on the system. This permission only applies
    to the symbolic link itself and not to the file that is linked to. That linked
    file retains whatever permissions have already been set for it.


    ## Setting the User Mask


    The user mask is used to determine the default permissions that will be assigned
    to all newly created files. The `umask` command adjusts the user mask for the
    system. By default, new files have the user mask set to `666` (`-rw-rw-rw-`) and
    new directories have the user mask set to `777` (`-rwxrwxrwx`).


    The `umask` command is usually used within a system script or configuration file.
    To learn more about `umask`, please enter `man umask` within the terminal.


    ## Sticky Bits


    Although Linux filesystems were designed to work as described above, this behavior
    is not always desirable. In order to create a more intuitive result, we use sticky
    bits. A sticky bit is a special filesystem flag that alters behavior. When we
    set the sticky bit on a directory, Linux permits a user to delete a file only
    if the user owns either the file or the containing directory. Simply put, when
    using a sticky bit, the user cannot delete a file simply by having write permissions
    to the containing directory.


    To set the sticky bit, use the `chmod` command with a special octal code or a
    symbolic character code. To use an octal code with `chmod` to set the sticky bit,
    the three-digit octal code must be prefixed with a `1` (to enable the sticky bit)
    or a `0` (to remove the sticky bit). For example, if we enter the command `chmod
    1777 test.sh`, this will set the file `test.sh` to read, write, and execute for
    every user on the system and enable the sticky bit.


    The second method is to set the sticky bit using a symbolic character code. This
    adds the symbolic code of `t` to the permission string using `chmod`. For example,
    if we enter the command `chmod ugo=rwx+t test.sh`, this will set the file `test.sh`
    to read, write, and execute for every user on the system and enable the sticky
    bit. To remove the sticky bit, simply use `-t` within the command instead of `+t`.


    ## Special Execute Permissions


    As previously discussed, the execute permission bit enables a user to identify
    which files are considered programs and scripts. When this execute bit is included
    in the permissions for a file, it indicates to the Linux system that the file
    is an executable file and should be considered a program file (providing it the
    same capabilities as a Windows’ file with the extension of `.exe`).


    By default, files execute using the credentials of its owner. This allows Linux
    to associate specific users with different processes. Occasionally, a program
    will need to run with elevated permissions, such as the superuser or root. For
    example, the `sudo` command sets user passwords on the system. This program must
    be run as the root user to write to the configuration files, such as `/etc/shadow`.


    As pointed out earlier, the root password should not be given to other users on
    the system due to security concerns. Luckily, Linux provides us with two special
    bits that can help solve this challenge. The first is known as `SUID` (Set User
    ID). SUID indicates to the Linux system that the file is to run with the permissions
    of whoever owns the file. To identify SUID on your system, look for the `s` in
    the owner’s execute position within the permission string, for example `-rws-xr-x`.


    The second special execute bit is `SGID` (Set Group ID). SGID is similar to the
    SUID option, but it operates as the group’s user instead. SGID is indicated by
    an `s` in the group execute position, such as `-rw-sr-x`.


    To set the SUID or SGID, use the `chmod` command with either an octal code or
    a symbolic code. To set the SUID using an octal code, set the first digit to `4`.
    To set the SGID using an octal code, set the first digit to `2`. To set both the
    SUID and SGID, set the first digit to `6`. For example, if we issue the command
    `chmod 4755 test.sh`, then the file `test.sh` will have the SUID bit set and permissions
    of `-rwsr-x`. To set the SUID or SGID bit using a symbolic code, use the letter
    `s`. For example, if we enter the command `chmod u+s test.sh`, this will enable
    the SUID bit for the file `test.sh`. For example, if we enter the command `chmod
    g+s test.sh`, this will enable the SGID bit for the file `test.sh`. To remove
    the SUID or SGID bits, use `-s` within the command instead of `+s`.


    In general, most users will never have to set or remove the SUID or SGID bits
    themselves, since most package management programs will set or remove these bits
    during installation, upgrading, or removal of a program.


    ## Hiding Files


    Windows users may be familiar with the concept of a hidden bit, which hides files
    from view in the graphical user interface managers and from the `dir` command.
    While Linux doesn’t have this as a dedicated filesystem feature, there is a special
    file-naming convention to hide files from view: a single dot (`.`) prefix. By
    adding this prefix, most tools will simply hide the files and directories from
    view anytime their name begin with a single dot. Be aware, though, that renaming
    a file with a single dot prefix will hide it, this action will make the file inaccessible
    to any program that uses the original filename.


    For example, if there are two files in the current directory called `myfile.txt`
    and `.myfile.txt`, and a user executes the `ls` command, then only the file `myfile.txt`
    will be displayed while the `.myfile.txt` remains hidden from view. Most file
    managers and dialog boxes that deal with files also hide these-called dot files,
    but this practice is not universal across every Linux program.


    Due to this simple convention, many user programs will hide their configuration
    files from cluttering up the display by simply adding a dot to the front of the
    filename. Depending on the program in question, there are various ways to view
    these hidden files. In some GUI tools, there is a check box that can be set in
    their preferences or configuration options to force the program to display all
    files, including the hidden ones.


    Within the command line, adding the `-a` option to the `ls` command will display
    the hidden files. For example, most system administrators commonly use `ls -la`,
    since it will show all the hidden files and directories, as well as their permissions.


    When the command `ls -a` is executed, the user will notice two hidden directories
    contained within every directory on a Linux system. These are known as dot (`.`)
    and dot dot (`..`). Dot (`.`) refers to the current directory. This is also known
    as the present working directory. Personally, I always refer to it as “here”.
    Therefore, if you want to create a relative path, you can use the single dot as
    your starting point within a command or file’s paths. The dot dot (`..`) refers
    to the parent directory. This is the directory one level above the current directory.
    Again, this is used heavily when creating relative paths to different files and
    directories across the filesystem.

