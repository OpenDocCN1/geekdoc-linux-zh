- fmt: '

    Comparing these four distributions just shows that using Linux is nothing to fear.
    This should hold true especially for users who may want to give it a try or are
    thinking of switching over from Windows or Mac because it operates similar to
    those two operating systems and, therefore, is something that they are already
    used to. Users will just have to decide which distribution and desktop environment
    suits their needs and preferences.


    ## Embedded Systems


    Up to this point, we have only spoken about Linux as a full-featured and complete
    operating system, but Linux is used for so much more than just computers. In fact,
    Linux is at the core of many of the devices that you use every day because it
    serves as the core of many embedded systems.


    An embedded system is a controller with a dedicated function within a larger mechanical
    or electrical system. It is embedded as part of a complete device, often including
    hardware and mechanical parts. As a matter of fact, embedded systems control many
    of the devices you use every single day, whether you realized it or not. These
    devices include, but are not limited to, industrial automation, navigation equipment,
    medical devices, and many others.


    In recent years, due to its low cost and ease of customization, Linux has been
    shipped in many consumer devices such as wearable technology, home appliances,
    automobiles, and even thermostats. If you have a smart thermostat in your home,
    like a `Nest®` or an `ecobee®`, you already have Linux installed in your home!


    Some embedded systems, like the `Arduino` and `Raspberry Pi`, are small credit
    card sized embedded systems that we can use to create other complete systems.
    These include things like robots and ultraportable computer systems. The `Arduino`
    and `Raspberry Pi` are available in the market as do-it-yourself or DIY kits.
    The Linux-based operating system embedded in these kits has a small footprint,
    requires little memory and processing power to run, and is highly customizable.


    Most smartphones and tablets also run on a Linux kernel-based operating system
    known as `Android`. Google acquired `Android` in July 2005, extended it, and as
    a result Android is a highly competitive mobile operating system that now has
    a market share consisting of over 75% of all smartphone and tablet users worldwide.
    `Android` is highly scalable, user friendly, open source, and free for manufacturers
    to use within their devices.


    Because of this, `Android` has even been ported for use in media players, televisions,
    and automobile entertainment systems, too. `Android` is highly customizable and
    is a truly complete operating system with Linux at its core. We can also add applications
    into the Android environment to further enhance features. There are applications
    for media content such as photos, videos, and social media, as well as productivity
    and gaming.


    In fact, since many newer televisions have `Android` installed within them as
    an embedded system, these devices are now be complete multimedia centers, and
    we can use them for internet video streaming, browsing, and video games.


    ## Hardware Requirements


    Before you can install Linux, you need to know which hardware components you need
    to run and use it efficiently. These prerequisites are known as system requirements
    and are often a guide as opposed to an absolute rule.


    The most common set of system requirements defined by any Linux distribution is
    the physical computer hardware. A hardware requirements list is often accompanied
    by a hardware compatibility list (`HCL`). An `HCL` lists tested, compatible, and
    sometimes incompatible hardware devices for a particular distribution. Most distros
    define two sets of system requirements, the minimum requirements and recommended
    requirements. These system requirements also tend to increase over time with a
    demand for higher processing power and resources in newer versions of each distribution.


    Usually, developers will publish system requirements for a specific version of
    their distro on the download page of their website. These lists typically state
    required processor speed, memory size, available hard disk drive space, optical
    or removable media, display specifications, and other peripheral devices needed.


    The minimum system requirements are the lowest possible hardware that your computer
    needs to boot Linux successfully and use it with basic functionality. As an example,
    `Disco Dingo`, the current version of `Ubuntu` as of this writing, requires a
    computer with at least a `Dual Core` processor running at `2GHz`, `2GB` of `RAM`,
    and `20GB` of hard disk space. Most modern desktops and laptops meet these requirements
    without too much difficulty.


    But minimum requirements can also vary greatly from one distribution to another.
    For example, consider the `AntiX` distribution. This distro only requires a computer
    with at least a `Pentium III` processor, `256Mb` `RAM`, and `2.7GB` of hard disk
    space. These requirements are extremely lightweight, considering that the `Pentium
    III` processor was first manufactured in 1999. It is pretty amazing that a modern
    operating system like `AntiX` can still run on a system that is over 20 years
    old! So, if you have an old Windows computer sitting in your basement collecting
    dust, you could breathe new life into it as a Linux machine using a lightweight
    distro like `AntiX`.


    The other type of system requirements is recommended requirements. Recommended
    system requirements list the hardware that you should have to maximize the system’s
    potential. This allows you to use applications such as video editing software
    or play 3D games, which require higher frame rates for smooth gameplay. When you
    look at the recommended requirements, you will notice that most distributions
    will now recommend a video graphics card and much higher processing and memory
    than the minimum requirements. However, you still need to be careful that you
    do not use incompatible hardware because it may be more powerful than the minimum
    requirements but may render the whole system unstable or unusable if you install
    an unsupported graphics card or other device.


