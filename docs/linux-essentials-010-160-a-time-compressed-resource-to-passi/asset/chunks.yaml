    # 参加并通过 LPI Linux Essentials 认证


    恭喜你！你已经读到了这本书的最后，但还有更多工作要做。我知道我们在书中涵盖了大量内容，从 Linux 入门、安装你自己的 Linux 发行版，到在命令行中操作，甚至是配置文件和目录的权限与所有权。


    我知道你可能已经迫不及待要去参加认证考试了，但首先我们想确保你已经完全准备就绪。我建议你参加模拟考试，以确保在正式考试之前你已经万事俱备。我在书中包含了一份模拟题，但你可以根据自己的需要参加尽可能多的考试——你可以在互联网、其他书籍和其他资源中找到更多题目。如果你花时间注册了这本书，可以在我们的配套课程中找到许多额外的模拟题。


    如果你参加了我的模拟考试并得分至少达到 85%，那么你可能已经准备好参加（并通过）LPI Linux Essentials 认证考试了。尽管如此，还是再做几次模拟考试，让你在考试当天感到从容，我保证这会有帮助。练习会缓解你的紧张情绪，带给你成功所需的信心，并确保所有知识点都牢固地留在你的脑海中，从而让你第一次考试就能通过。


    你通往认证 Linux 用户和系统管理员的旅程现在已经开始了。祝你好运！


