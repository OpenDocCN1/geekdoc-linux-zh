  trans: "\n虽然许多程序使用命令选项参数的通用格式，但并非所有命令都强制要求这样做。某些程序允许用户任意混合选项和参数，其行为表现就像所有选项都紧跟在命令之后一样。然而，对于命令来说，只有当命令行从左到右顺序处理时遇到选项，程序才会对它们采取操作。为了避免问题，我建议你坚持使用“命令选项参数”格式，除非你有充分的理由偏离它。\n\
    \n现在，就像在英语中一样，如果你不使用正确的语法，接收者（系统）将无法很好地理解做什么。某些程序会直接停止并什么都不做。另一些程序可能会停止并提供错误。还有一些程序可能会尝试处理命令，但如果使用了错误的选项或参数，可能会引发严重问题。\n\
    \n## Shell 脚本\n由于命令行有成千上万命令可用，对用户来说要记住所有的命令可能是一项艰巨的任务。此外，坐在键盘前输入每个命令也可能非常耗时。但是，计算真正的威力在于能够为用户简化重复且耗时的任务。为了实现这一目标，我们可以利用\
    \ shell 的功能，通过编写包含想要执行的所有精确命令的 shell 脚本来实现自动化。\n\n简单来说，shell 脚本是一个包含一系列命令的文件。shell\
    \ 读取此文件并像直接在命令行上输入那样执行这些命令。例如，在事件响应期间，我有一个脚本用于从受害计算机中收集证据。与其手动输入 15 条命令，我只需运行脚本，它就会执行执行列出的每个命令，直到全部完成。然而，脚本可以变得非常复杂。例如，你可以通过基础编程向它们添加逻辑，以便根据事件甚至一天来检测变化。\n\
    \n## 变量\n使用命令行界面的另一个基本功能是能够使用名称或标签来引用某些数量，例如值或命令。这通常被称为变量。\n\n至少，变量让你的脚本和编程更具可读性。然而，当用户在执行之前不知道实际值时，我们也可以在高级编程中使用变量。\n\
    \n变量是内存中的一个区域，用于存储信息，并通过名称进行引用。每当 shell 看到以 `$` 开头的单词时，它将其视为变量，并尝试替换为实际值。\n\n\
    要创建一个变量，用户应该在脚本中输入变量名，紧跟一个等号（`=`）。请注意，在输入变量名时不能使用空格。在等号之后，我们编写需要存储的信息。\n\n当该行执行时，该值会被赋值给变量。例如，`$month=May`\
    \ 会将“May”赋值给变量 `$month`。此后在脚本中编写变量名（`$month`），它将被替换为“May”。在为变量分配名称时，必须遵循三个规则：\n\
    \n- 变量名必须以字母开头\n- 变量名不能包含嵌入空格\n- 不允许使用标点符号\n\n为了提高可读性，大多数程序员会在变量名中使用下划线（`_`）代替空格，因为空格是被禁止的。例如，如果我想让一个变量存储关于星期几的信息，我可能会将变量命名为\
    \ `$day_of_week`。\n\n当用户启动 shell 会话并加载操作系统时，启动脚本已经声明并配置了一些变量。要查看环境中的所有变量，用户可以输入\
    \ `printenv` 命令。脚本始终包含所使用的机器名称。\n\n```\n| DionTraining:Documents jason$ printenv\n\
    TERM_PROGRAM=konsole\nSHELL=/bin/bash\nTERM=xterm-256color\nPATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin\n\
    PWD=/home/jason/Documents\nLANG=en_US.UTF-8\nXPC_FLAGS=0x0\nXPC_SERVICE_NAME=0\n\
    SHLVL=1\nHOME=/home/jason\nLOGNAME=konsole_\nUSER=/usr/bin/printenv\nOLDPWD=/home/jason\n\
    DionTraining:Documents Jason$ |\n```\n\n在查看上述输出时，注意按照约定所有的环境变量都是大写的。\n\n## \n\
    如前所述，shell 从用户处读取输入；将输入解析为命令、选项和参数；然后执行这些命令。当每个命令执行时，其命令行选项和参数也会执行。不幸的是，当 shell\
    \ 在命令行中遇到某些字符时会以特殊方式处理。这些特殊字符被称为 shell 元字符。有多个 shell 元字符，包括空格、美元符号、星号、分号、大于符号、问号、安符和管道（`\
    \ `, `$`, `*`, `;`, `>`, `?`, `&`, `|`）。\n\n直到现在，你已经看到了这些 shell 元字符。例如，最常见的 shell\
    \ 元字符是空格字符，shell 用它分隔命令、选项和参数。由于空格字符的特殊状态，shell 不会向命令传递任何空格。相反，shell 使用此元字符来分离和识别单个参数。对于\
    \ shell 而言，一个空格或 100 个空格意味着相同的意思：“我正要寻找下一个参数”。\n\n那么，我们如何将带有空格的文件或目录名称作为参数传递？例如，在\
    \ `ls` 命令示例中我们使用了 `Essentials` 作为目录名，但如果目录名为 `Linux Essentials`，我们该怎么办？为了将元字符传递给\
    \ shell 并将其视为普通字符，我们使用引号（Quoting）。引号可以防止 shell 对元字符进行操作和扩展。它导致 shell 忽略字符的特殊含义，从而使字符被原样地作为参数的一部分传递给命令。引号使用双引号（`\"\
    \"`）、单引号（`''`）或反斜杠（`\\`）字符。\n\n当我们使用引号时，shell 将忽略元字符具有任何特殊含义，并将其简单视为纯文本。例如，带引号的空格字符不会分隔参数，而未加引号的空格字符会。通常，我们使用分号在单行命令行上输入两个命令，但带引号的分号（`\"\
    ;\"`、`';'` 或 `\\;`）将无法实现此功能。虽然从技术上讲，引号仅适用于受保护的单个 shell 元字符而不是整个命令行参数，但你也可以用匹配的引号包裹整个参数（例如使用\
    \ `ls -la \"Linux Essentials\"` 而不是 `ls -la Linux \"Essentials\"`）。我们也可以使用反斜杠来引用或关闭紧随其后的每个字符的特殊含义（例如\
    \ `ls -la Linux\\ Essentials`）。shell 将以相同的方式执行这三个示例，并提供完全的结果。\n\n"
- fmt: '

    Quotes and backslashes simply tell the shell which parts of the input to treat
    as ordinary (not special) characters. Quoting only delimits or identifies a string
    of characters. The shell removes the actual quoting mechanism (double quotes,
    single quotes, or the backslash) and does not treat it as part of the string passed
    to the command.


    | Proper Command Usage | Scan QR code to watch a video for this topic | ![A black
    sign with white text Description automatically generated](Image00016.jpg) |


    ---


    There are a couple of ways to access the Linux shell. One way is by right-clicking
    on the desktop and selecting `Open Terminal` in the menu. Another way is by clicking
    on the Applications menu on the taskbar and searching for `Terminal`. There may
    be several terminals present in the system, so the easiest way is the right-click
    option.


    In distributions like Ubuntu, right-clicking on the desktop and selecting `Open
    Terminal` in the menu opens the default terminal. Inside the shell, you can then
    start issuing commands. But this necessitates using the proper syntax.


    For example, the `ls` (list) command is similar to a directory listing or the
    `dir` command in Windows. Typing `ls` at the prompt will show the folders and
    files of the current directory. Usually, when opening the default terminal, the
    home directory is indicated by a `~` before the `$` sign. To change to a folder
    within the current directory, we use the `cd`, or change directory command. Sometimes,
    the shell user can get disoriented because there are distributions that do not
    show which directory is being currently accessed. In Ubuntu, the shell user can
    keep track of which folder is currently accessed by looking at the directory structure
    before the `$` sign. But for other distributions where this is not present, simply
    typing the `pwd` command, for present working directory, will show the full path
    from the root all the way to the current folder.


    To quickly create files within folders, the `touch` command will create an empty
    file of whatever filename it is given. If we go back to the commands section,
    remember that there are commands, options, and arguments. Commands tell the system
    what to do, options state how to do those commands, and arguments tell the system
    what to do the command to or with. With the `touch` command, there is no need
    to enter an option. Simply typing `touch test1.txt` creates an empty file named
    `test1.txt` in the current directory.


    Going back to the `ls` command, we can use it with several options to do more
    than just list files and folders in the current directory. You may want to see
    more details and additional information about the files and folders `ls` lists.
    Using the `-la` option or long view with all the attributes, `ls -la` lists out
    files and folders with additional details such as permissions, ownership, and
    files size.


    Previously discussed were variables and variable names with emphasis on the `printenv`
    command to print out environment variables. The last line of the output of this
    command shows the `OLDPWD`, which was the last directory accessed before being
    in the current directory.


    Quoting is also important in command syntax because when improperly used the output
    is not achieved. For example, the semi-colon (`;`) normally runs two commands
    simultaneously. For example, by typing `echo Hello; ls`, we first print `Hello`
    and then list the files and folders in the current directory. To change the function
    of the semi-colon (`;`) in the command line, the text that should contain semi-colon
    (`;`) as a character is placed inside quotation marks or we use a backslash (`\`)
    before the semi-colon to make the shell treat the semi-colon as regular text.


    ### Man and Info


    The Linux shell is powerful and useful. However, with more than a thousand individual
    commands and even more syntax options and arguments, it is virtually impossible
    to remember every single one of them. Fortunately, there are two easy to use resources
    that can provide you with a lot of information when you are using the command
    line environment. These resources are the `man` and `info` commands.


    The `man` command contains the manual (man pages) for every command available
    on the system. This includes detailed information on what the command does, the
    specifics of how to execute the command, and what command line arguments or syntax
    they accept. The man pages are invoked by running a terminal and typing the command
    `man` followed by the name of the command you want information on. For example,
    if you wanted information on the `ls` command, simply type `man ls` and press
    enter to enter the man pages for the list command.


    When you are reading the man pages, it is also possible to do a keyword search
    for specific information you are looking to find. If you know what you want to
    achieve with a command, but you can’t remember the exact command or syntax, using
    this search feature is quite useful. To perform a keyword search across every
    man page on the system, you simply type `man -k` and indicate the search term.
    Do note that you must use the proper spaces between the command, option, and search
    term. If you are searching for a complex phrase of multiple words, don’t forget
    to use quoting around the search term to nullify the special meaning of the space
    metacharacter.


    If you already know the command you want to use, you can also search within a
    single man page. To do this, press forward slash (`/`) followed by the term to
    search for and hit ''enter''. If the term appears multiple times, cycle through
    them by pressing the ''n'' button for each additional entry.


    It is important to know which command line options we can use to modify the behavior
    of a command to suit our needs. Using the man page, you can read all about the
    different options supported by a command. For example, if you read the man page
    for the `ls` command, you will see that there is a longhand and shorthand version
    of the command’s options.


    For example, I previously used the `ls` command with the `-a` option to list all
    the directories (including the hidden ones) within a directory. The `-a` is the
    shorthand version of this option, but there is also a longhand version (`--all`)
    that we can use for the same functionality. This longhand version is just a more
    human readable form, but we can use either since they both do the same thing.
    There are options to use the longhand or shorthand versions, though. By using
    the longhand version, it can be easier for users to remember what the command
    does. By using the shorthand version, though, a user can combine multiple options
    together more easily (for example, `-l` and `-a` become `-la`). The shorthand
    version is also quicker and easier to type out.


    Another command that will display documentation and information to the user is
    the `info` command. To use this command, simply type `info` followed by the name
    of the command. Info pages are more detailed than man pages. They are divided
    into different nodes or pages that we can read with an info reader, which works
    much like a web browser. To navigate with the info reader, use ‘p’ for the previous
    screen and ‘n’ for next screen within a page. To exit the info page, press ‘q’.


    To learn more about man or info, you can type `man man`, `man info`, `info man`,
    or `info info` in the command line within your terminal.


    # CHAPTER SIX Linux File System![](Image0017.jpg)


    ## OBJECTIVES


    *   Understand the difference between the Windows and Linux file systems

    *   Be able to navigate through the file system

    *   Be able to move, copy, and delete files and directories

    *   Understand hard and symbolic links

    *   Understand wildcards and case sensitivity

    *   Understand file archiving in Linux

