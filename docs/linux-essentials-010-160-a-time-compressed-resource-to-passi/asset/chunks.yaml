    example, if the value is set to 7, then the password must be reset in one week
    (7 days).The next field is the “Days of Warning Before Password Expiration”. If
    this field is set, then the system is configured to provide a warning to the end
    user that their password will need to be changed within the number of days set
    in the “Days Before a Change Is Required”.In a Linux system, the system administrator
    can also configure the system to a specific period of time between an account’s
    expiration and actual deactivation. This field is called the “Days Between Expiration
    and Deactivation”, and it is the next field in the /etc/shadow file. When an account
    expires, it requires the user to either immediately change their password upon
    logging in or to contact a system administrator to unlock their account. If an
    account is deactivated, though, the user’s password is erased from the /etc/shadow
    file, and this requires a system administrator to manually reactivate the account.To
    determine when an account will expire, see the “Expiration Date” field. This field
    shows the date on which the account will expire, and it is expressed as a whole
    number that’s the number of days since January 1, 1970\. It is a security best
    practice to require every account to be used at least once every 60 days. If an
    account isn’t used within 60 days, it should be set as expired and then deactivated
    30 days after that expiration.The final field is the “Special Flag” field. This
    field is reserved for future use within Linux and is normally not used on modern
    Linux systems. If it is used, it generally contains a meaningless value that is
    unimportant to the user or system administrator.Because of the password and security
    information contained within the /etc/shadow file, this file’s permissions are
    set to be highly restrictive and the file ownership is set to the root user. This
    keeps non-root users from accessing, reading, or modifying the file and prevents
    them from obtaining the passwords stored in their salted and hashed format. By
    contrast, the /etc/passwd file must be readable by ordinary users and therefore
    has less-restrictive permissions.It is important to understand that a user account
    is not a singular thing like a file, though. An account is made up of lots of
    different pieces of information and configurations that are scattered across several
    configuration files, such as /etc/passwd, /etc/shadow, /etc/group, and other files
    that refer to each user account.Understanding GroupsA group is a collection of
    user accounts that are defined within the /etc/group file. Just like the /etc/passwd
    and /etc/shadow files, the /etc/group file contains all the records which define
    the groups on a system. Each record contains the information for one group listed
    as a colon-delimited line of four fields within the /etc/group file.The first
    field, known as Group Name, contains the name of the group displayed in its alphanumeric
    form. Most commands use this field when identifying, accessing, or manipulating
    data about a group.The second field is known as the password field and contains
    the password for the group if one exists. If a value of x is displayed, this indicates
    that there is a password, but it is stored elsewhere for increased security. If
    this field is empty, this indicates no group password.This third field is the
    group identification (GID) number. Linux uses this identification to internally
    reference and identify each group. Just like with user identification numbers,
    group identification numbers are translated back to group names for the benefit
    of users and system administrators who prefer a human readable name, as opposed
    to a number.The fourth and final field is the User List. This field specifies
    which users belong to the group. This field can contain one or more users. If
    multiple users are listed, each username should be separated by a comma within
    this field.In order to identify a user as part of a group, the system can either
    identify the GID within the user’s individual entry in the /etc/passwd file, or
    the system can specify the usernames in the User List field of a group’s record
    in the /etc/group file.Unfortunately, there is a limitation when identifying a
    group within a user’s individual record in the /etc/passwd file. This method only
    allows us to assign a user to a single group within the GID field. If a group
    is associated with the user using this method, that group is the user’s primary
    group.Since a user can be a member of multiple groups, it is better to instead
    list the username within the /etc/group file under each group’s record that they
    will be a part of. Each group that the user is added to using this method is a
    secondary group for the user.Groups are an important part of assigning permissions
    to different files. Each time a new file is created, the file will be automatically
    associated with the user’s current group. When a user logs into a system, the
    user’s current group is always set to their primary group by default. For a user
    to change their current group to one of their secondary groups, the user issues
    the newgrp command. To use this command, simply enter “newgrp <group>”, where
    <group> is the name of the secondary group the user wants to use as their current
    group. After entering this command, any files created by the user will be associated
    with their new current group.Account ManagementThere are numerous commands and
    utilities for manipulating user accounts and groups on a Linux system. For example,
    if a user needs to determine which user they are currently logged in as, the command
    whoami can be utilized. By typing whoami at the prompt, the system will display
    the current username. This is helpful when a user maintains multiple accounts
    on a system, such as a regular user and an administrator account, and needs to
    recall which account they are currently using.If the user needs additional details
    or information, they should use the id command. By typing id at the prompt, the
    system will display the current UID, username, GID, and the user’s group memberships
    to the terminal. The id command is extremely useful since it presents both the
    numeric UID and GID values, as well as their associated alphanumeric display names.Because
    Linux is a multiuser operating system, not only does it support multiple users
    accounts, but multi users can also simultaneously be logged on to the computer.
    For example, my web server, diontraining.com, currently has thousands of active
    users who log in to our learning management system to take their online video
    courses at any given time. In our case, this is done via a web-enabled front end,
    but most Linux users and administrators instead log into a remote server using
    a remote access tool like Secure Shell (SSH).Since multiple users cannot access
    the Linux system directly from the same keyboard, mouse, and monitor, Linux supports
    a feature known as a virtual terminal (VT). As a system administrator, it is important
    to know if there are other users who are currently logged on when you are performing
    system maintenance to prevent critical data from being lost. For example, if a
    system administrator installs a new software update or security patch, they may
    need to reboot the system. Prior to reboot the system, the administrator should
    use the who command to determine who is currently online and logged in.When who
    command displays a lot of valuable information to the terminal, including the
    username, terminal identifier, login data and time, and the remote host address.The
    username is the first column and it shows the name of all of the users who are
    logged into the system.The terminal identified shows an alphanumeric code to indicate
    which terminal the remote user is on. If the terminal identifier is indicated
    as zero (0), then the user is logged in locally via the GUI. If the terminal indicator
    displays pts/# or tty#, this indicates a text session. Text session logins can
    be performed by launching a terminal within the GUI, through a text-mode console
    login, or remotely via SSH or another remote access protocol.The Login Date and
    Time column indicates when the login was initiated. This can be helpful when determining
    if a connection is still active or if someone logged in many hours ago and forgot
    to log out at the end of their workday.The Remote Host column indicates the source
    of the login. If the login was conducted locally via the GUI or the console, then
    this column will be blank. If the user opened a terminal from within the GUI,
    it is indicated as either # or #.#, with # being the number of the login source.
    If the login was made remotely, then a hostname or IP address will be listed under
    this column to indicate the source of the connection.The who command is not the
    only method for identifying information about the logged in users, however. An
    alternative to who is w. The w command is similar to who, but it produces a more
    verbose output including the terminal identifier and login time in a different
    format. In addition to this, w also displays the session’s idle time, the JCPU,
    the PCPI, and what is being run.The session’s idle time indicates how long it
    has been since the user has last interacted with the current session. This is
    extremely helpful when trying to determine if a user is actively using the system
    or simply forgot to log off at the end of the workday.The JCPU column identifies
    the total amount of CPU time associated with the user’s session. This information
    is used in some pay per use services, which are quite typical in cloud-based environments.The
    PCPU column identifies the total amount of CPU time associated with the current
    processes running in the session. This can be useful when troubleshooting a Linux
    system that is malfunctioning or acting slowly. By identifying which process and
    which user is overusing the CPU, the system administrator can eliminate this bottleneck
    and increase the overall system performance for all users.The WHAT column indicates
    which program the session is running. Again, this is helpful in troubleshooting
    or identifying what each logged in user is doing on the given system.'
