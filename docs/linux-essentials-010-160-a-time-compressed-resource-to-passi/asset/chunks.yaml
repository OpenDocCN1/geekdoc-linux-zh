  raw: 'From its inception, Linux was designed as a multiuser operating system. This
    means that any number of users can simultaneously work on a single machine. These
    users can connect to the system via different terminals or network connections
    while maintaining a separate storage area for personal information and individual
    desktop configurations.Among the users working on a machine, Linux also distinguishes
    between different kinds of user roles. A user can log into a Linux machine as
    a normal user or as the root user, a superuser with privileges that authorize
    them to access all portions of the system and to execute any necessary administrative
    tasks.All users, including the superuser, have their own home directories where
    all the user’s private data (like documents, bookmarks, and emails) are stored.
    While a user can modify anything in their own home directory, only the superuser
    can modify the system directories that hold all the centralized configuration
    files and executable files on the system.To modify these files and folders, a
    user can choose to use a GUI-based file manager within the desktop environment
    or through a shell in the command line environment. The traditional method on
    Linux and Unix systems was to use the command line environment, but the GUI-based
    method is easier for most end users. While using the command line is often faster,
    it does require some deeper knowledge of the commands and their syntax to list,
    create, delete, or edit files and their properties.Within a Linux system, all
    files and directories are in a tree-like structure. The topmost directory is the
    root of the file system, which is notated as a single forward slash (/). Note
    that the root of the file system is not to be confused with the root user or the
    root user’s home directory (/home/root). In a Windows system, the root of the
    file system is designated as a backslash (\) and usually denoted by the drive
    letter C (usually written as C:\).All the other directories in Linux can be accessed
    from the root directory and are arranged in a hierarchical structure using parent-child
    relationships. Unlike Windows, Linux does not use backslashes to separate the
    components of a pathname, but instead relies on forward slashes. Therefore, the
    private data of a user in Windows might be stored in C:\users\diontraining\documents,
    but in Linux it might instead be stored under /home/diontraining/documents. Additionally,
    Linux, unlike Windows, does not use drive letters. Instead, a user can detect
    which directory, drive, device, or network they are accessing from the appearance
    of the pathname itself. For example, you might access the storage directory on
    the secondary hard disk drive by using /dev/disk1/storage/.Key File System FeaturesAnother
    crucial difference to understand between Windows and Linux is the concept of mounting
    and unmounting partitions, drives, and directories. When Windows detects partitions
    and drives during the boot process, it assigns a drive letter to them. However,
    Linux partitions or devices are usually not visible in the directory tree unless
    they are mounted. Mounting a device means that it will become integrated into
    the file system at a specific location within the directory tree. If a device
    isn’t mounted, a normal user cannot access any data on the device or its partitions.Luckily,
    most modern Linux distributions automatically mount partitions and devices for
    their end users. During the installation, users can define partitions to automatically
    mount when the system is started. Removable devices are usually also detected
    and mounted automatically by the system when they are connected. Desktop environments
    such as KDE or Gnome will notify the end user when a new device is mounted and
    becomes accessible. If you are using an older version of Linux and need to mount
    the device yourself, you will use the mount and umount commands. To learn about
    the exact usage of these commands, please use the man pages for them on your Linux
    system.Unlike Windows, Linux distinguishes between uppercase and lowercase letters
    within the file system. Therefore, if you change the file test.txt to TeST.txt
    or Test.txt, Linux considers all three different files. This case sensitivity
    holds true for both files and directories within the file system. So, if you have
    Letters and letters as directories, Linux would treat them as two different directories
    within.Another major difference between Linux and Windows is the use of file extensions
    to define what a file is used for. For example, in Windows a file will end in
    .txt if it is a text file. In Linux, files may have a file extension, such as
    .txt, but it is not required. Instead, the operating system looks at the contents
    of the file to determine which application can read it instead of simply relying
    on the three-letter extension. Many users still add the three letter extensions,
    though, since it makes it easier for users to identify a file’s type and use. Like
    Windows, Linux does distinguish between normal files and hidden files. In general,
    the system uses hidden files to hold configuration details. Hidden files are indicated
    by a dot in front of the file name, such as .hiddenfile. In order to access a
    hidden file, you can switch the properties or options for the view in the file
    managers or use certain command syntax options in the shell.As stated earlier,
    Linux is a multiuser system and, therefore, every file must belong to a specific
    user and a group. Only the owner of a file or directory (or the root user) can
    grant other users the permission to access them. Linux distinguishes between three
    different types of access permissions: write permissions, read permissions, and
    execute permissions. Users can only access a file or a folder if they have at
    least a read permission to it. There are several ways to change the access permissions
    of files and folders: either via the shell or with the help of the desktop''s
    file manager.Although each Linux distro has its own way of doing certain things,
    all Linux developers recognize the need for some standardization in the layout
    of their directory structures. To address this need, the Filesystem Hierarchy
    Standard (FHS) was created. The FHS makes an important distinction between shareable
    and unshareable files. Shareable files may be reasonably shared between computers,
    such as user data files and program binary files. Unshareable files contain system-specific
    information, such as configuration files. The FHS makes a second important distinction
    between static files and variable files. Static files do not usually change except
    through direct intervention by the system administrator. For example, executable
    program files are considered static files. On the other hand, users, automated
    scripts, servers, or other devices can change variable files. For example, most
    of the files stored in a users’ home directory are variable files since the user
    can easily change their contents.Navigating Files and DirectoriesNow that we have
    an overview of the file system, it is time to learn how to navigate around it
    from the command line. But, before you can manipulate files and directories, it
    is important to understand which files are in which directories.The ls command,
    short for list, provides this information. If no command line options are used
    with the command, the output will simply display the files in the current directory.
    However, additional options and file or directory specifications can be provided
    to display more detailed information. For example, using the "-a" option displays
    all files including hidden files, such as the files and folders which begin with
    a dot. If you instead use the "-l" option, it displays a detailed output, which
    includes permission strings, ownership, file sizes, and file creation dates in
    addition to the filenames.Another useful option is the “-d” option, which is used
    when working with directories. When working in a directory that holds many subdirectories,
    using a wildcard with ls that matches one or more subdirectories may get an unexpected
    result: the output will show the files in the matched subdirectories, rather than
    the information on the subdirectories themselves. To get information on the subdirectories
    rather than the contents of those subdirectories, you can instead include the
    “-d” option. If you want to learn about the ls command in more detail, type man
    ls at the prompt to display the man page for the ls command.The cd command, short
    for change directory, changes the current directory to another one provided by
    the user. Although the current directory doesn’t matter for many commands, it
    will matter when referring to certain file manipulation commands. When working
    with the cd command, do not forget that Linux uses a forward slash as a directory
    separator, as opposed to the backslash (\) used in Windows for this purpose. The
    forward slash and backslash are not interchangeable, so it is up to the user to
    use the proper one for the operating system they are using. In fact, the backslash
    has a different meaning in Linux: a backslash serves as a “quote” or “escape”
    character to enter otherwise hard-to-specify characters like spaces as part of
    a filename. Typing cd followed by a forward slash and the directory name or path
    to change to will make the shell switch to that directory. Do take note that depending
    on the distro and shell being used, changing the current directory may not actually
    reflect in the prompt displayed by the shell. To know the complete path of the
    current location, the we can always enter the pwd command (present working directory)
    at the command prompt.Remember that Linux uses a unified directory tree. This
    means that all the files on the system are located relative to a single root directory
    (/), which is represented by using the single forward slash character.Files and
    directories can be referenced in three ways: absolute references, home directory
    references, or relative references. An absolute reference allows a file to be
    referenced relative to the root directory, such as in /home/user1/file.txt, which
    refers to the file.txt file in user1’s home directory. Absolute references always
    begin with the single forward slash since they start at the root of the file system.A
    home directory reference uses the tilde character to refer to the user’s home
    directory. If a filename begins with that character, it is as if the path to the
    user’s home directory has been substituted for the tilde. For user1, ~/file.txt
    is equivalent to the absolute reference of /home/user1/file.txt.A relative reference
    refers to a file reference that is made relative to the current directory. Every
    Linux directory includes two special hidden subdirectories known as dot (.) and
    dot dot (..).Dot (.) refers to the current directory. This is also known as the
    present working directory. Personally, I always refer to it as “here”. Therefore,
    if you want to create a relative path, you can use the single dot as your starting
    point within a command or file’s paths.The dot dot (..) refers to the parent directory.
    This is the directory one level above the current directory. Again, this is used
    heavily when creating relative paths to different files and directories across
    the filesystem. For example, if user2 is working in the directory /home/user2/,
    user2 can refer to user1’s home directory by using ../user1\. This references
    the directory above /home/user2 (/home) and then the subdirectory user 1 within
    that directory.Manipulating FilesWe can manipulate files by using many different
    commands. Files can be created, copied them from one location or folder to another,
    moved, renamed, or even deleted from the file system using different commands
    within the shell.Normally, files are created by programs or commands that manipulate
    them. For example, a graphics program like GIMP might create a new graphics file.
    The exact process to create a file differs depending on the program, but most
    GUI programs typically use a menu option called Save or Save As to create and
    save a file. Text-based programs within the command line often provide a similar
    functionality, but the details of how it is done vary greatly from one program
    to another.The most basic file creation program is touch. The touch command is
    a command line program that creates a new, empty text file at the location provided
    as a parameter when the command first runs. To create a new file, simply type
    “touch” followed by the name of a file; for example, type “touch newfile.txt”
    to create an empty file called newfile.txt within your present working directory.
    Normally, it is not necessary to create a file of a particular type, since a program
    will automatically create the matching the file type needed for its file format.
    Sometimes, though, it is helpful to create an empty file just to create a few
    disposable files to test some other command while you are learning your way around
    the shell and its usage.Another command that is useful in working with files is
    the cp command. This command, short for copy, is used to copy files from one directory
    to another. It can be used in three different ways: to paste an option for a source
    filename and a destination filename, a destination directory name, or both. The
    cp command also provides many other options that modify its behavior. To learn
    all the details about the cp command, please type “man cp” in the shell to get
    a list of all the options and corresponding functions.If you want to move or rename
    a file, we use the same command for both. This command is the mv command, which
    stands for move. The mv command uses syntax and usage that is like the cp command.
    If a filename is specified with the destination, the file will be renamed while
    being moved. If a filename is specified, and the destination directory is the
    same as the source directory, the file will be renamed but not moved. The mv command’s
    effects are much like cp, except that the new file replaces the original file
    instead of simply duplicating it.Also, when the source and target files are on
    the same filesystem, mv rewrites directory entries without physically moving the
    file’s data on the disk. When a file moves from one filesystem to another, though,
    mv copies the file to the new disk and then deletes the original file from the
    source disk. To learn more about the mv command, type “man mv” from the command
    prompt to view its man page.Sometimes, files are no longer needed on a system.
    When this occurs, we can delete these files the rm command, which stands for remove.
    By typing "rm filename," the file in the current directory will be deleted from
    the filesystem. To delete an entire directory tree, use the -r option along with
