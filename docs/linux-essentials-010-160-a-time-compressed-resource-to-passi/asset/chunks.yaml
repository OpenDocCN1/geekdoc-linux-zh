    例如，Ubuntu 以及其他基于 Debian 的发行版提供了多种个人软件包存档（PPA），其中包含了个人或团队编译的软件。这些 PPA 仓库通常比 Ubuntu
    官方仓库更早获得软件的更新和 Beta 版本。


    请记住，这些 PPA 并非获得发行版的官方背书，因此它们可能包含漏洞、安全风险以及其他有害内容。出于如此，我建议在任何生产系统中仅使用来自你所发行版的官方仓库。


    # 第四章：桌面环境


    ![](img/Image00014.jpg)


    ## 目标


    - 比较和对比不同的桌面环境

    - 列出常用软件程序的 Linux 替代方案

