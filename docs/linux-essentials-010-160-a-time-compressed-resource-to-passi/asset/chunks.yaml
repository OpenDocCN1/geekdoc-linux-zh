    主机名为为 `DionTraining`，代表我登录的服务器。目录是 `Documents` 目录，用户是 `Jason`。最后，我们看到了最后一个字符 `$`，因为我正在使用
    `bash`。


    要执行一项操作，你必须输入一个命令。命令本质上是一行中的字符序列，通过按下回车键结束，然后由 shell 进行求。许多命令源自英语的灵感，并构成了专门命令语法语言的一部分。命令必须遵循某些被称为“语法”的规则，以便
    shell 能够正确解释它们。就像我们的英语有正确的语法规则让每个人都能理解我们想要表达的意思一样，命令语言也是如此。例如，我不会在酒吧里对服务器说“Some
    water I want”（水我想要），因为这会让他们困惑。相反，我会说“I want some water”（我想要一些水），因为这是英语中使用的自然顺序，或语法。


    为了解释命令行，shell 首先尝试将该行分成单个单词。就像在英语中一样，单词是通过空格分隔的。命令行上的第一个单词通常是命令本身，而行上的其他单词都是参数，用于更详细地说明命令应该做什么。


    ### 命令参数


    参数主要有两种类型：选项（options）和参数（arguments）。


    #### 选项 (Options)

    选项是以破折号或符号（`-`）开头的参数。这些通常被称为开关（switches）。每个开关都允许开启或关闭命令的某些方面。可以使用空格和破折号将这些选项单独传递给命令，或者你可以将多个选项组合在一个破折号后面。例如，开关
    `-l` `-a` 也可以等效地写为 `-la`。


    程序的选项比方便映射到单个字符的要多，因为可用字符只有 36 个（a-z, 0-9）。为了允许更多选项，这些程序通常会支持所谓的“长选项（long options）”。长选项通常以两个破折号开头，具有更好的可读性。例如，`--all`
    表示命令对所有文件执行某些操作，这比使用开关 `-a` 要清晰得多。你不能组合多个长选项；例如，`--all` 和 `--more` 不能组合为 `--allmore`。


    #### 参数 (Arguments)

    参数是与命令一起使用的类型类型。参数是任何不以破折号开头的单词。大多数情况下，参数用于输入文件或目录名称，命令对这些对象执行其预定的功能。


    ### 使用示例：ls


    例如，假设你想列出（ls）位于 `Documents` 目录下的 `LinuxEssentials` 目录中的所有文件。如果我简单输入 `ls LinuxEssentials`，我会得到一个包含两个文件名的列表：`Questions.txt`
    和 `StudyGuide.txt`。由于我只使用了命令（`ls`）和参数（`LinuxEssentials`），我只收到了最默认的信息（目录中的文件名）。


    ```

    | DionTraining:Documents jason$ ls LinuxEssentialsQuestions.txt StudyGuide.txtDionTraining:Documents
    Jason$

    ```


    相反，如果我想显示文件的名称、创建日期、用户和组所有权以及文件的权限，我必须使用开关开启该选项。这可以使用 `-l` 开关完成，它开启了 `ls` 命令显示带有这些附加信息的长格式视图的能力。


    ```

    | DionTraining:Documents jason$ ls -l LinuxEssentialsstotal 16-rw-r--r--@ 1 jason
    staff 4 Sep 8 10:07 Questions.txt-rw-r--r--@ 1 jason staff 4 Sep 8 10:07 StudyGuide.txtDionTraining:Documents
    Jason$

    ```


    遗憾的是，这种显示是不完全的，因为我看不到 `LinuxEssentials` 目录中的任何隐藏目录。为了启用查看这些隐藏目录的能力，我们需要使用 `-a`
    选项：


    ```

    | DionTraining:Documents jason$ ls -a LinuxEssentials. .. .. Questions.txt StudyGuide.txtDionTraining:Documents
    Jason$

    ```


    遗憾的是，由于我们只使用了 `-a` 选项，我们不再拥有长格式显示的所有附加详细信息。但是，如果我们把 `-l` 和 `-a` 选项合并为单一选项 `-la`，如所示：


    ```

    | DionTraining:Documents jason$ ls -la LinuxEssentialsstotal 16drwxr-xr-x 4 jason
    staff 128 Sep 8 10:08 .drwx------+ 22 jason staff 704 Sep 8 10:06 ..-rw-r--r--@
    1 jason staff 4 Sep 8 10:07 Questions.txt-rw-r--r--@ 1 jason staff 4 Sep 8 10:07
    StudyGuide.txtDionTraining:Documents Jason$

    ```


    上面的示例并不是为了让你成为 `ls` 命令的专家，相反，你现在应该理解了我们如何组合正确的语法来向命令传递不同的选项和参数的概念。请注意，在所有这些示例中，我们都传递了想要列出的内容的目录名称（`LinuxEssentials`）。


    我们将这种通用的命令结构总结为“命令 选项 参数”。这三个部分中的每个都为程序的执行回答了不同的问题：


    | 命令 | 做什么？ |

    | :--- | :--- |

    | 选项 | 如何做？ |

    | 参数 | 对什么或用什么做？ |


