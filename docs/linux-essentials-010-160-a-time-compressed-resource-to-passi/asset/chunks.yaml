    also simply known as X. The log file for X is Xorg.0.log, and it contains all
    the information on the most recent startup of X on the system. If you are having
    a generalized graphics issue, then checking /var/log/Xorg.0.log is a good place
    to start your troubleshooting.Because log files are constantly recording information
    about the system, its operations, and its errors, these files can grow very large
    in size. In fact, if the log files are not limited in size, they could completely
    fill up your hard drive and crash the operating system. To prevent this, information
    within the log files is frequently rotated. This means that the oldest entries
    within the log files are deleted and overwritten with newer entries.Also, some
    programs will instead create new log files. they then rename the latest log file
    with a date or number, and the old log file is deleted once it reaches a certain
    age. For example, if the messages log file was rotated on July 1, 2019, /var/log/messages
    will become /var/log/messages-20190701, /var/log/messages-1.gz, or something similar,
    and a new /var/log/messages will be created. This practice keeps log files from
    growing too large.Most log files are simply plain-text files, so they can be checked
    using any tool that can examine text files. While there are specialized programs
    that can parse, read, and compare logs, for basic log reviews a simple display
    program like entering the cat command or using a text editor like gedit will work
    just fine.Some programs create their own log files, too. However, most programs
    rely on a utility known generically as the system log daemon fhir this function.
    This daemon’s process name is generally syslog or syslogd. Like other daemons,
    it starts during the boot process by the system startup scripts. Several system
    log daemon packages are available for you to use on a Linux system. Some of them
    provide a separate tool, like klog or klogd, to handle logging messages from the
    kernel separately from ordinary programs.The behavior of the log daemon can be
    modified, including adjusting the files to which it logs certain types of messages,
    by adjusting its configuration file. The name of this file depends on the specific
    daemon in use, but it is typically /etc/rsyslog.conf or something similar, depending
    on your distribution.Once running, a log daemon accepts messages from other processes
    by using a technique known as system messaging. It then sorts through the messages
    and directs them to a suitable log file depending on the message’s source and
    a priority code.Combining grep with log files can be a truly powerful combination
    for a system administrator. By properly using grep, you can quickly search through
    hundreds of thousands of lines within a given log file to find the exact issue
    or error you are trying to find.Kernel Ring BufferThe kernel ring buffer can be
    thought of as a log file for the kernel. However, unlike other log files, it is
    stored in memory rather than in a disk file. Like regular log files, though, its
    contents continue to change as the computer runs. To examine the kernel ring buffer,
    type dmesg. This can sometimes create an overwhelming amount of information, so
    the output is typically piped through the less utility.'
