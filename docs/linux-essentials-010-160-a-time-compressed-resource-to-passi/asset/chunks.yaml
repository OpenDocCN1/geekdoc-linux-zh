    1. **A** `Android`, a Linux kernel-based operating system acquired and extended
    by Google, has become a highly competitive platform used in smartphones, tablets,
    and home appliances such as TVs.

    2. **D** `Ubuntu` is a free and open source Linux distribution based on `Debian`.

    3. **C** `Writer` is a well-known word processor that is part of the LibreOffice
    suite. It can be used for just about anything that Microsoft Word can do. While
    `vi` and `nano` are text editors, they are not full featured word processors like
    Microsoft Word. `Pages` is a word processor developed by Apple, and it only works
    on Mac OS X systems.

    4. **A** `VLC` is a media player made by the VideoLAN project. It is cross-platform
    and works great on Linux systems for playing all types of video and music files.
    The other options provided only work on Mac OS X or Windows systems.

    5. **B** Open source software is usually developed in a collaborative public manner
    and is a good example of open collaboration.

    6. **D** The graphical user interface is a form of user interface that allows
    users to interact with electronic devices through graphical icons and visual indicators
    such as secondary notation, instead of text-based user interfaces, typed command
    labels, or text navigation.

    7. **C** `Linux` has numerous desktop environments. Some of the more popular desktop
    environments are: Cinnamon, `Gnome`, `KDE`, `XFCE`, `Unity`, and `Mate`.

    8. **C** To store the output of a command in a variable, you can use either of
    the following commands in the shell: (1) `variable_name=$(command)` or (2) `variable_name=''command''`.

    9. **B** The name of a variable should only contain letters (`a` to `z` or `A`
    to `Z`), numbers (`0` to `9`) or the underscore character (`_`). Variables should
    also always start with a letter.

    10. **C** The `printenv` command displays the values of environment variables.

    11. **A** The `man` pages are a set of pages that explain every command available
    on the system. This includes information on what they do, the specifics of how
    to execute them, and what command line arguments or syntax they accept.

    12. **B** There is no Mistakes section. It should be `Errors`.

    13. **A** `find` is a command that searches one or more directory trees of a file
    system, locates files based on some user-specified criteria, and applies a user-specified
    action on each matched file.

    14. **B** The `cd` command stands for Change Directory.

    15. **C** The `cp` command stands for copy.

    16. **A** The `rm` command is a UNIX and Linux command line utility for removing
    files or directories on a Linux system. When you combine the `-r` and `-f` flags,
    it means that recursively and forcibly remove a directory (and its contents) without
    prompting for confirmation. You should always keep in mind that `rm -rf` is one
    of the most dangerous commands that you can ever run on a Linux system, especially
    as root.

    17. **A** The `tar` command allows you to quickly access a collection of files
    and place them into a highly compressed archive file. The `-c` option creates
    a new archive while `-f` uses the given filename as the archive''s filename. Specifying
    the directory ensures the files to be placed in the archive file come from that
    folder.

    18. **B** The `tar` command allows you to quickly access a collection of files
    and place them into a highly compressed archive file. The `-c` option creates
    a new archive while `-f` uses the given filename as the archive''s filename. Specifying
    the directory ensures the files to be placed in the archive file come from that
    folder.

    19. **D** Specifying `2>/dev/null` will filter out the errors so that they will
    not be output to your console. In more detail: `2` represents the error descriptor,
    which is where errors are written to. By default, they are printed out on the
    console. `/dev/null` is the standard Linux device where you send output that you
    want to ignore.

    20. **B** The `tail` command with the `-n 1` option will show the last line of
    a file.

    21. **C** This is because the redirection is carried out first. This means that
    the `> data.txt` truncates the file so that `sort` finds nothing.

    22. **B** A token is a sequence of characters that forms a word or punctuation
    sign. It is made up of ordinary characters or operator characters, but not both.

    23. **B** Inside a script, the `$1` variable references the first argument from
    the command line, `$2` is the second argument, and so on. The variable `$0` references
    the current script.

    24. **A** The `for` loop lets you iterate or ''do'' over a series of ''words''
    within a string.

    25. **B** The first line of the script should start with `#!/bin/bash`. Most shell
    scripts will end with a `.sh` by convention, but it is not required. Remember,
    in Linux, file extensions are only useful to the end user, but they are completely
    ignored by the operating system.

    26. **A** There are distros that offer short-term support versions and long-term
    support versions or `LTS`.

    27. **B** A hardware compatibility list or `HCL` lists tested, compatible, and
    sometimes incompatible hardware devices for a particular distro.

    28. **A** Partitions on these disks can range from `1` (for the first partition)
    to `16` (for the sixteenth partition). If you have a few `ide/ata` devices installed
    in a system, they will be `hda` (the first device), `hdb` (the second device),
    `hdc` (the third device), and so on. Each partition on that device will append
    a number to it, so the third partition would be `/dev/hdc3`.

    29. **B** `/etc` is a folder which contains all system configuration files.

    30. **A** `/var` is a standard subdirectory of the root directory that contains
    files to which the system writes data during its operation. `/var/log` contains
    log files.

    31. **C** `dmesg`, short for display message or driver message, is a command that
    prints the message buffer of the kernel. The output of this command typically
    contains the messages produced by the device drivers that occur during the system
    startup and boot.

    32. **A** `lo` is the loopback interface. This is a special network interface
    that the system uses to communicate with itself, and it exists even if there is
    no hardware network interface (like `eth0` or `wlan0`) in the system.

    33. **C** `netstat` is a command that displays network connections for Transmission
    Control Protocol, routing tables, and a number of network interface and network
    protocol statistics.

    34. **C** The `last` command reads from a log file and prints the entries of successful
    login attempts made by the users.

    35. **B** The `w` command displays a list of all logged in to the system and what
    they are doing. This command is similar to the `who` command, but it ends up displaying
    more information about logged users.

    36. **B** `/etc/passwd` contains the attributes (i.e., basic information about)
    of each user or account.

    37. **C** The `useradd` command with the `-m` option creates the user’s home directory
    with default configuration files.

    38. **A** The `ls` command stands for list. The `-a` option lists all the files
    in the current directory including those that may be hidden.

    39. **A** The `t` is a sticky bit, a specialized permission bit that is set on
    a directory that allows only the owner of the file within that directory, the
    owner of the directory, or the root user to delete or rename the file.

    40. **B** To create a soft link from the shell, you should use `ln -s <original_file>
    <link_created>`. The soft link is essentially a pointer to the original file,
    and when the original file is deleted the soft link does not point to anything,
    and so “no such file or directory” is reported.

