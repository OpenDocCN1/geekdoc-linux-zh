    \ are used, consider adding whitespace around the operators with the lowest priority.\
    \ **Use your own judgment**; however, never use more than one space, and always\
    \ have the same amount of whitespace on both sides of a binary operator.*”*\n\n\
    **Inline comments** are applied on the same line as the statement, following the\
    \ code itself. Just like other comments, they begin with a hash mark and a single\
    \ whitespace character. Normally, inline comments look like this: [code] # Inline\
    \ comment in regards to the code\n\nThe inline comments option should not be abused\
