    Dropbox soon became a showcase of successful Python implementation. An interesting
    point is that Dropbox was originally written in Python 2. And in 2013, when Guido
    van Rossum joined Dropbox, he was mainly responsible for converting the software
    to newly Python 3. He worked for Dropbox until his retirement. After seeing Python
    scale so well with Dropbox, many other enterprises started considering it for
    their business.


    The late 2000s was also the time when social media exploded. And as its influence
    was growing, so did the amount of data that it had to manage. At the same time,
    Python quickly became the language of choice for accessing that data, especially
    in the tech, startup world. During the financial crisis of 2008, automation took
    over the financial world. Financial institutions had the need to process big data
    and started looking at data to spot patterns, make decisions, and manage economic
    processes. Corporations had plenty of data but no simple and clear way to access
    it. That is when they commenced performing quantitative analysis on financial
    data using Python. Other packages such as `NumPy`, `scikit`, and `Matplotlib`
    had a comparatively heavy development background, and Python soon became the top
    choice for data science.


    There was another driver for Python that made it the go-to language for data science,
    the boot camps. And as web development exploded, so did boot camps. Python has
    always been free to access, learning the language. And, consequently, the first
    language taught in many of these boot camp programs was Python. High schools and
    colleges all around the world started teaching coding as a core skill, and much
    of that was based on Python.


    Nowadays, if you want to become a full-stack developer, you usually need to start
    with the basis of front-end and back-end software. Many instructional programs
    have established the transition from `JavaScript` to `Python` to be smooth for
    first-time learners, even though the languages are different. So, if one day you
    end up as a front-end developer working on `JavaScript` and interacting with an
    application programming interface (API), you might find creating a back end for
    these applications pretty tedious, until you try Python. Its frameworks such as
    `Flask` and `Django` offer easy solutions for developers who want to build more
    back-end software and create powerful APIs to coordinate properly.


    # Installing and Configuring Python


    ![A screen with a wood paneled background displays the Mac O S logo, Windows logo,
    Python logo, Android logo, iOS logo, and the penguin mascot of Linux.](images/fig1_3.jpg)


    Any crash course on Python is likely to start with installing or updating Python
    on your computer. There are multiple methods of installation: you can download
    official Python distributions from [Python.org](http://Python.org), install from
    a package manager, and even install specialized distributions for scientific computing.


    If you are learning how to navigate Python on your own, the best option would
    be to start at [Python.org](http://Python.org). This platform represents the official
    distribution, and that kind of source is generally the safest option for learning
    to program in Python.


    On the platform, you can easily get access to a variety of useful tutorials and
    all sorts of learning materials:


    * How to check which version of Python is installed on our device.

    * How to install and update Python on Windows, macOS, and Linux.

    * How to use Python on mobile devices like phones or tablets.

    * How to use Python on the web with online interpreters.


    And before we go on covering each one of these points, it is important to get
    acquainted with few of top-level directories in the `CPython` source tree that
    are meant to help you find where a certain piece of functionality is implemented.


    * `Doc`: the official documentation. This is what [https://docs.python.org/](https://docs.python.org)
    uses.

    * `Grammar`: contains the EBNF grammar file for Python.

    * `Include`: contains all interpreter-wide header files.

    * `Lib`: the part of the standard library implemented in pure Python.

    * `Mac`: Mac-specific code (e.g., using `IDLE` as an OS X application).

    * `Misc`: things that do not belong elsewhere. Typically, this is varying kinds
    of developer-specific documentation.

    * `Modules`: the part of the standard library (plus some other code) that is implemented
    in C.

    * `Objects`: code for all built-in types.

    * `PC`: Windows-specific code.

    * `PC build`: build files for the version of MSVC currently used for the Windows
    installers provided on [python.org](http://python.org).

    * `Parser`: code related to the parser. The definition of the AST nodes is also
    kept here.

    * `Programs`: source code for C executables, including the main function for the
    CPython interpreter (in versions prior to Python 3.5, these files are in the Modules
    directory).

    * `Python`: the code that makes up the core CPython runtime. This includes the
    compiler, eval loop, and various built-in modules.

    * `Tools`: various tools that are (or have been) used to maintain Python.


    # How to Install Python on Windows


    Unlike many other Unix systems and services, Windows does not include a system-supported
    installation of Python. In order to make Python available, the CPython team has
    advanced Windows installers with every version for many years now. These installers
    are primarily created to add a per-user installation of Python, including the
    core interpreter and library.


    As of now, there are three installation methods on Windows:


    1. The Microsoft Store

    2. The Full Installer

    3. Windows Subsystem for Linux


    If you want to check whether you already have Python on your Windows or not, you
    need to first open a command-line application, such as `PowerShell`. You can do
    it by following these three simple steps:


    1. Press the Win key

    2. Type `PowerShell`

    3. Press Enter


    As an alternative, you can press the right-click on the Start button and select
    `Windows PowerShell` or `Windows PowerShell (Admin)`. One can also use `cmd.exe`
    or `Windows Terminal` (a multi-tabbed command-line that Microsoft has developed
    for Windows 10, which later completely replaced the Windows Console). With the
    command line open, type in the following command and press Enter:


    ```

    In either case, if you see a version less than 3.9.2., which was the most recent
    version at the time of writing, then you might want to upgrade your installation.
    And if you do not have a version of Python on your system, then both of the above
    commands are programmed to launch the Microsoft Store and redirect you to the
    Python application page.


    And if you do not know where exactly the installation is located, you can find
    it out through the `where.exe` command in `cmd.exe` or `PowerShell`:


    As mentioned before, there are three hassle-free ways to install the official
    Python distribution on Windows:


    1. **Microsoft Store package:** The simplest installation method on Windows through
    the Microsoft Store app. This method is mostly advised for beginner Python users
    looking for an easy setup multimedia experience.

    2. **Full Installer:** This option involves downloading Python directly from the
    [Python.org](http://Python.org) official website. This is recommended for intermediate
    and advanced developers who need more functionality and control during the installation
    process.

    3. **Windows Subsystem for Linux (WSL):** The WSL can let you run a Linux environment
    directly in Windows. You can learn how to enable and manage the WSL by reading
    the Windows Subsystem for Linux Installation Guide for Windows 10.

