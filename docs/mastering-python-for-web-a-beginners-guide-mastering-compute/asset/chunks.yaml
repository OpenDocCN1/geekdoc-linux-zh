  trans: "\n最初，由于缺乏第三方库的支持，Python 3 的采用速度一度放慢了。因为大多数 Python 库仅支持 Python 2，导致向版本 3\
    \ 的迁移变得非常耗时。但在过去的几年里，兼容 Python 2 和 Python 3 的库数量一直在不断增加。今天，Python 3 是新项目最佳、最新的选择。\n\
    \n由于 Python 的简单性，Dropbox、Google、Mozilla、Hewlett-Packard、IBM 和 Cisco 等顶尖技术机构已将\
    \ Python 用于开发、脚本、生成和软件测试等各种用途。它还启发了许多其他编程语言，如 Ruby、Cobra、Boo、CoffeeScript、ECMAScript、Groovy、Swift、Go、OCaml\
    \ 和 Julia。\n\nPython 的成功在于强大的标准库，以及来自第三方开发者提供的、丰富且易于获取且易使用的库。Python 的标准库为常见的编程任务提供了模块，如数学、字符串处理、文件和目录访问、网络、异步操作、线程和多进程管理。此外，它还包含了管理常见编程任务的模块，例如读写结构化文件格式、处理压缩文件以及操作网络协议。默认的\
    \ Python 发行版还通过 `Tkinter` 提供了跨平台 GUI 库，并提供了对 `SQLite 3` 数据库的嵌入访问。通过 Python Package\
    \ Index 可以获取数千个第三方库。例如：\n\n* `BeautifulSoup` 库提供了一个提取 HTML 的全能工具箱。\n* 像 `Flask`\
    \ 和 `Django` 这样的框架允许快速开发 Web 服务。\n* 可以通过 Python 模型使用 `Apache Libcloud` 管理多个云服务。\n\
    * `Pandas`、`NumPy` 和 `Matplotlib` 加速了数学和统计操作，并能创建数据可视化。\n\n尽管如此，也值得注意 Python 不擅长的任务。首先，Python\
    \ 是一门高级语言语言，因此它不是系统级编程的最佳选择——设备驱动程序或操作系统内核是不可行的。它对于需要跨平台独立二进制文件的情况也不理想。而且，由于该语言中的所有内容（包括函数和模块本身）都被视为对象处理，代码的是以速度为代价的。因此，当速度是应用程序各个方面的绝对首要任务时，它不是最佳选择。在这种情况下，建议选择\
    \ C/C++ 或语言。\n\n像 C#、Java 和 Go 一样，Python 拥有垃圾回收内存管理，这意味着不需要编写代码来跟踪对象。垃圾回收在后台自动发生，并可能引发性能问题，因此建议手动管理或完全禁用它以增强性能。\n\
    \n另一个折协是 Python 对显著空白的使用。由于语法上的空白可能会让人皱眉，一些开发者选择不接触 Python。另一个潜在的望而却步的因素可能是 Python\
    \ 处理变量类型的方式。默认情况下，Python 使用动态类型或“鸭子”类型，这在大型代码库中可能会产生问题。\n\n尽管如此，人们仍然欣赏、接受并单纯地热爱使用\
    \ Python。而且，这有许多原因：\n\n* **初创公司热爱 Python**：初创公司在构建网站、移动端应用程序或软件程序时，需要灵活且可靠的编程工具。此时主要的两个首要任务包括财务效率和领先于计划的能力。由于\
    \ Python 能够实现这两个目标，它是初创公司领域备受青睐的编程语言。\n\n  Python 的效率和易用性缩短了开发时间，并简化了 QA 和调试流程，承诺了更高的投资回报。对于想要加入初创社区、获得第一份工作并开始积累行业经验的人来说，了解\
    \ Python 管理的基础知识将使你作为潜在候选人更具吸引力。\n\n* **学习 Python 不需要很长时间**：对于像 Python 这样强大且多功能的语言，学习\
    \ Python 并不需要多年或完成几个学位。大多数行业专业人士通过各种在线课程（包括 Python 语法、关键字和数据类型）获取了 Python 基础，这些课程平均仅需\
    \ 6–8 周。而且，如果你有之前的编程语言经验，你可能学得比这更快。\n\n* **你可以免费学习 Python 基础**：Python 背后的组织 `Python\
    \ Software Foundation` 在其官方网站上托管了一份免费的 Python 教程：[`https://www.python.org/about/gettingstarted/`](https://www.python.org)。这份免费资源为初学者提供了一详尽的\
    \ Python 教程，以及专门为无编程经验的用户定制的材料，以及针对 Python 编程经验有限的初者的指南。\n\n  同时，如果你需要更详细的 Python\
    \ 速成课程，可以在网上搜索。如前提到的，有像 [`https://www.learnpython.org/`](https://www.learnpython.org)\
    \ 和 [`https://docs.python-guide.org/`](https://docs.python-guide.org) 这样的网站拥有额外的教程。大多数在线平台都让你轻松地学习编程基础，并让你免费开始。你只需要注册即可。\n\
    \n* **Python 有支持性的用户社区**：\n\n  Python 是一门开源编码语言，这意味着任何人都可以对 Python 语言进行修改或创建。开源意味着它是免费的，并允许库、框架和扩展工具的形成，这些工具帮助\
    \ Python 语言随时间推移保持适应性和兼容性。可以说，Python 至今的成功是因为存在这样一个投入该语言的、支持性的用户社区。\n\n  此外，`Python\
    \ Software Foundation` 在其网站上有一个专门的社区页面，链接到几个社区小组和论坛。Python 编程语言的用户定期在所谓的 Python\
    \ 用户小组（Python User Groups）中会面，分享他们如何使用该语言并学习新技术。会议通常每月一次；它们非常非正式并对所有人开放。根据目前的统计，全球有约\
    \ 1,637 个 Python 用户小组分布在几乎 191 个城市、37 个国家，拥有超过 860,333 名成员。你也可以通过这个链接找到当地的 Python\
    \ 社区：[`https://wiki.python.org/moin/LocalUserGroups`](https://wiki.python.org)。\n\
    \n  `Python Software Foundation` 是一个非营利组织，为社区项目的实施提供资助计划。它每年处理超过 300 个请求。因此，在\
    \ 2019 年，资助计划为全球的倡议提供了 324,500 美元的支持。\n\n* **Python 非常流行**：编程语言是否流行很重要。这很重要，因为如果你投入金钱和时间去学习一门不够被广泛使用且无法帮助你求职野心的语言，那是错误的。\n\
    \n  根据*经济学人*（The Economist），Python 是 2018 年世界上最流行的编码语言。Fortran 和 Lisp 等语言已大幅下降，而\
    \ C 和 C++ 等语言保持稳定。该文章预测这种 Python 盛行的趋势将在很长一段时间内保持不变。\n"
- fmt: '

    # Python Features


    - **Python is versatile:** Being general-purpose means that `Python` language
    can be used to build parts of different software solutions, which is why major
    tech corporations like `Google` and `Facebook` choose `Python` programming for
    their projects. In addition, `Python` code can also be used to build basic programs,
    and as a developer, you can have an incredibly wide range of work options. Whether
    you want to go work for a tech giant, build your own software programs, or work
    as a freelance web developer, knowledge of `Python` programming is considered
    to be a strength that can make any of these plans possible.


    - **Python ensures that the front and back ends of your projects work better together:**
    If you want to have a great career as a developper, it would be useful to know
    that your goal might be to sync and balance the front end and back end made up
    of databases and web servers that power the front end of the website applications.


    And when we named `Python` a “glue language,” we meant that it is used to script
    back-end actions, allowing your digital product''s front and back ends to work
    in harmony. So, if you are looking to add server-side or back-end skills to your
    front-end developer set of competencies, learning `Python` might be a perfect
    way to start with.


    - **Python is customizable:** If you need a customizable programming language,
    then `Python` must be a perfect option. Just like `JavaScript`, there is no shortage
    of libraries and frameworks for `Python` to shape and deliver your specific coding
    needs.


    Popular `Python` fully featured server-side web framework like `Django` is created
    to make `Python` more practical at tuning web applications, while `PyQt` is a
    framework that allows `Python` to build GUIs user interfaces that include the
    use of on-screen icons and graphics to operate user commands.


    - **Python is a great tool for processes automation:** One of the essential but
    tedious parts of working in tech is administering all the repetitive, time-consuming,
    tech-related processes. Boring tasks like copying files, dragging folders and
    renaming files, managing assets to servers—all of these accumulatively take a
    lot of precious time. In this case, automation via `Python` implementation could
    be your savior. `Python`s ability to write system scripts enables you to create
    simple `Python` programs to automate routine tasks that take so much of your productivity.
    The time you will be able to save by readjusting your processes with `Python`
    is a hugely appealing aspect of learning the language.


    - **Python gives you the tools to work anywhere in tech:** Learning `Python` code
    will not only secure your potential expertise in internet development—it will
    prepare you for a variety of future tech jobs. `Python` is used for more than
    traditional web development. As a matter of fact, `Python` is a top language for
    such popular emerging scientific fields, including data analysis, artificial intelligence,
    machine learning, and data science. Therefore, knowing the language will help
    to keep your options open, and you may have more tech-related opportunities if
    you decide to master `Python`.


    ## A BRIEF HISTORY OF PYTHON


    `Python` is a general-purpose, high-level programming language that was initially
    designed by `Guido van Rossum` in 1991 and developed by `Python Software Foundation`.
    It was mainly developed for advancing code readability, and its syntax that would
    allow programmers to express concepts in shorter code.


    Official work on `Python` started in the late 1980s. Soon after that, `Guido van
    Rossum` began doing its application-based trial in December 1989 at `Centrum Wiskunde
    & Informatica` (`CWI`) in the Netherland. Originally, the `Python` project has
    started as a hobby because he was looking for interesting work to keep him occupied
    during Christmas. `Python`''s programming language is based on `ABC Programming
    Language`, which had the interfacing with the microkernel-based `Amoeba Operating
    System` that turned a collection of single-board computers into a transparent
    distributed system. `Van Rossum` had already helped create `ABC` earlier in his
    career and had seen some issues. So, he took the syntax of `ABC`, some of its
    best features, and fixed other unsettled attributes. And just like that, by correcting
    those issues completely, he had created a new scripting language.


    ![A photo of Guido van Rossum.](images/fig1_2.jpg)


    The language was released in 1991. When it was released, it used many codes and
    had a distinguished design approach. Its main objective was to provide code readability
    and advance developers’ overall productivity.


    But what about the name “Python”? Most people think that since the logo depicts
    two snakes, the origin of the name must have been inspired by the actual python
    snake. Surprisingly, that is far from the truth. `Guido van Rossum`, the creator
    of `Python`, wrote in 1996 about the origin of the name of his programming language
    that lays in British humor rather than anything.


    ### The Zen of Python


    Moreover, in 2004 the Python community came up with guiding principles for Python
    and called it “Zen of Python:”


    - Beautiful is better than ugly.

    - Explicit is better than implicit.

    - Simple is better than complex.

    - Complex is better than complicated.

    - Flat is better than nested.

    - Sparse is better than dense.

    - Readability counts.

    - Special cases aren’t special enough to break the rules.

    - Although practicality beats purity.

    - Errors should never pass silently.

    - Unless explicitly silenced.

    - In the face of ambiguity, refuse the temptation to guess.

    - There should be one—and preferably one—obvious way to do it.

    - Although that way may not be obvious unless you’re Dutch.

    - Now is better than never.

    - Although never is often better than right now

    - If the implementation is hard to explain, it''s a bad idea.

    - If the implementation is easy to explain, it may be a good idea.


    ## Modern Era and Growth


    For many years after launching, Python did not do well. Trusted solutions like
    `ASP.NET`, `Java`, and `PHP` dominated the enterprise. Python seriously took off
    only in the 2000s when new startups started using Python for their projects. Many
    low-budget businesses also prioritized Python because of its ease of use, rapid
    development, and certainly due to the low cost to host it.


    Python has hit the top of its popularity when `Dropbox` was introduced in the
    market. One day, the story states that an MIT student named `Drew Houston` forgot
    his USB flash drive for his class one day. He later started thinking about a better
    solution for sharing files. Houston started a company named `Evenflow` back in
    2007 with a single product named `Dropbox`. For the first time, `Dropbox` software
    enabled people to create a folder on their computer that''s automatically uploaded
    to service in the cloud, and it''s automatically synced to all the devices that
    the user has installed Dropbox on. The company reached a million users by April
    2009. By the end of 2009, they had 3 million users. `Dropbox` was written in `Python`.

    '
