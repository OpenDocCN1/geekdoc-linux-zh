    \ category [Nd]). This includes [0–9], and also many other digit characters. If\
    \ the ASCII flag is used only [0–9] is matched.\n\n*   \\D\n\n    Matches any\
    \ character which is not a decimal digit. This is the opposite of \\d. If the\
