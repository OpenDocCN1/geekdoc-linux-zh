    Python has the feature to convert numbers internally in an expression containing
    mixed types to a common type for evaluation. But, at times when you need to coerce
    a number explicitly from one type to another, you would have to add the following
    function parameters:


    *   Type `int(x)` to convert `x` to a plain integer.

    *   Type `long(x)` to convert `x` to a long integer.

    *   Type `float(x)` to convert `x` to a floating-point number.

    *   Type `complex(x)` to convert `x` to a complex number with real part `x` and
    imaginary part zero.

    *   Type `complex(x, y)` to convert `x` and `y` to a complex number with real
    part `x` and imaginary party. `x` and `y` are numeric expressions.


    Moreover, Python has built-in functions that perform mathematical calculations
    (Mathematical Functions), functions that are commonly used for games, simulations,
    and testing (Random number functions), and ones that perform trigonometric calculations
    (Trigonometric Functions).


    Python includes the following functions that perform mathematical calculations:


    1.  `abs(x)`: the absolute value of `x`: the (positive) distance between `x` and
    zero.

    2.  `ceil(x)`: the ceiling of `x`: the smallest integer not less than `x`.

    3.  `exp(x)`: the exponential of `x`: ex.

    4.  `fabs(x)`: the absolute value of `x`.

    5.  `floor(x)`: the floor of `x`: the largest integer not greater than `x`.

    6.  `log(x)`: the natural logarithm of `x`, for `x> 0`.

    7.  `log10(x)`: the base-10 logarithm of `x` for `x> 0`.

    8.  `max(x1, x2,…)`: the largest of its arguments: the value closest to positive
    infinity.

    9.  `min(x1, x2,…)`: the smallest of its arguments: the value closest to negative
    infinity.

    10. `modf(x)`: the fractional and integer parts of `x` in a two-item tuple. Both
    parts have the same sign as `x`. The integer part is returned as a float.

    11. `pow(x, y)`: the value of `x**y`.

    12. `round(x [,n])`: `x` rounded to `n` digits from the decimal point. Python
    rounds away from zero as a tie-breaker: `round(0.5)` is `1.0` and `round(-0.5)`
    is `-1.0`.

    13. `sqrt(x)`: the square root of `x` for `x > 0`.


    Random numbers that are mostly used for games, security, and privacy applications
    include the following functions:


    1.  `choice(seq)`: a random item from a list, tuple, or string.

    2.  `randrange ([start,] stop [,step])`: a randomly selected element from `range(start,
    stop, step)`.

    3.  `random()`: a random float `r`, such that 0 is less than or equal to `r` and
    `r` is less than 1.

    4.  `seed([x])`: sets the integer starting value used in generating random numbers.
    Call this function before calling any other random module function. Returns `None`.

    5.  `shuffle(list)`: randomizes the items of a list in place. Returns `None`.

    6.  `uniform(x, y)`: a random float `r`, such that `x` is less than or equal to
    `r` and `r` is less than `y`.


    Python includes the following functions that perform trigonometric calculations:


    1.  `acos(x)`: return the arc cosine of `x`, in radians.

    2.  `asin(x)`: return the arc sine of `x`, in radians.

    3.  `atan(x)`: return the arc tangent of `x`, in radians.

    4.  `atan2(y, x)`: return `atan(y/x)`, in radians.

    5.  `cos(x)`: return the cosine of `x` radians.

    6.  `hypot(x, y)`: return the Euclidean norm, `sqrt(x*x + y*y)`.

    7.  `sin(x)`: return the sine of `x` radians.

    8.  `tan(x)`: return the tangent of `x` radians.

    9.  `degrees(x)`: converts angle `x` from radians to degrees.

    10. `radians(x)`: converts angle `x` from degrees to radians.


    ## LIST DATA TYPE


    A list is the most basic data structure in Python that looks like a mutable, ordered
    sequence of elements. Any element or value that is inside of a list is called
    an item. And just as strings are defined as characters between quotes, lists are
    defined by those values that are placed between square brackets `[ ]`.


    Lists are particularly useful when you want to work with many related values,
    keep data together, condense your code, and perform the same methods and operations
    on multiple values at once.


    The important characteristics of Python lists include the following:


    *   Lists are mutable.

    *   Lists are ordered.

    *   List elements can be accessed by index.

    *   Lists can be nested to arbitrary depth.

    *   Lists are dynamic.


    When thinking about how someone might apply Python lists and other data structures
    that are types of collections, it is useful to try recalling all the different
    collections you might have in your possession: your personal files, your song
    playlists, your browser downloads, your email histories, the collection of videos
    you can access on a cloud service, and more. And with such lists, an ordered sequence
    of elements can become an item in a list and, therefore, be called individually,
