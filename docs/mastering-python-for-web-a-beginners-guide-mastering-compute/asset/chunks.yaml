    # 第 4 章：程序、算法和函数


    DOI: [10.1201/9781003229896-4](https://doi.org/10.1201/9781003229896-4)


    **本章内容**

    *   回顾主要的 Python 算法

    *   讨论 Python 脚本与模块之间的区别

    *   刻画 Python 基本函数和 Lambda 函数


    标准数据结构课程介绍了一系列基础数据结构和算法，可以在今天现有的任何编程语言基础上进行教学。尽管如此，大多数大学和在线课程选择采用 Python 语言来向学生介绍编程和解决问题。与
    C++ 和 Java 等其他语言相比，Python 提供了许多优势，最重要的一点是它的语法简单容易。在本章中，我们将通过提供以 Python 为中心的算法和函数来扩展对
    Python 的使用。我们将学习用于脚本编写的简洁语法和强大功能，以及这些功能的底层机制。


    理解算法的设计和分析是目前计算机科学和工程教育中的重要课题。遗憾的是，传统的编程语言迫使许多人处理细节和支持性程序，而不是算法设计。


    ![矩形面板显示了 Python 图标，两侧是示例算法。](img/fig4_1.jpg)


    ## Python 脚本与模块


    在计算中，“脚本（script）”术语用于指包含逻辑序列或设置处理的文件。这通常以存储在纯文本文件中的简单程序形式出现。因此，包含 Python 代码并设计供用户直接执行的纯文本文件被称为“脚本”，这是对顶层文件的非正式称呼。另一方面，包含供另一个
    Python 文件导入并使用的 Python 代码的纯文本文件我们被称为“模块（module）”。模块和脚本之间的主要区别是，模块用于导入，而脚本用于直接执行。


