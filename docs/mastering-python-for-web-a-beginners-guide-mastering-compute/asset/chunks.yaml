    Python 并不鼓励使用立即调用 lambda 表达式。这只是因为 lambda 表达式是可调用的，与普通函数的函数体不同。Lambda 函数经常用于高阶函数，高阶函数接受一个或多个函数作为参数，或返回一个或多个函数。lambda
    函数可以通过接收函数（普通函数或 lambda）作为参数来成为高阶函数，如下例所示：


    Python 将高阶函数作为内置函数或标准库的形式暴露。示例包括 `map()`、`filter()`、`functools.reduce()`，以及如 `sort()`、`sorted()`、`min()`
    和 `max()` 等关键函数。


    ### 语法


    如前所述，lambda 形式在语法上与普通函数有区别。特别是，lambda 函数具有以下特征：


    *   它被编写为单单行执行代码。

    *   它不支持类型注解。

    *   它可以被立即调用（IIFE）。

    *   lambda 函数不能包含任何语句。在 lambda 函数中，添加 `return`、`pass`、`assert` 或 `raise` 等语句只会导致
    `SyntaxError` 异常。


    与普通函数不同，Python lambda 函数是一个单一表达式。虽然在 lambda 体中，你允许使用括号或多行字符串将表达式跨越到几行，但它仍然是一个单一表达式：


    上面的示例在 lambda 参数为奇数时返回字符串‘odd’，在参数为偶数时返回‘even’。它跨越了两行是因为它包含在一组括号中，但它仍然保持为单一表达式。


    与使用 `def` 定义的函数对象类似，Python lambda 表达式支持所有不同的参数传递方式。包括：


    *   命名参数（也称为关键字参数）

    *   位置参数

    *   可变参数

    *   可变关键字参数

    *   关键字参数


    以下示例显示了向 lambda 表达式传递参数的可用选项：


    ### 装饰器


    在 Python 中，装饰器是一种模式的执行，它能够向函数或类添加行为。它通常使用 `@decorator` 语法前缀在函数前面。通过示例说明：


    在上面的示例中，`some_decorator()` 是一个在 `decorated_function()` 行为基础上进行构建的函数，因此调用 `decorated_function("Python")`
    会产生如下输出：


    此外，Python lambda 可以用像普通函数一样的方式进行测试。可以使用这两个模块来实现这一点——`unittest` 和 `doctest`。


    `unittest` 模块操作 Python lambda 函数的方式与普通函数类似：


    此测试定义了三个测试方法，每个方法为实现为 lambda 函数的 `addtwo()` 执行测试场景。执行 Python 文件 `lambda_unittest.py`
    会产生如下：


    `doctest` 模块从文档字符串（docstring）中提取交互式 Python 代码来执行测试。即使 Python lambda 函数的语法不支持典型的
    docstring，也可以将字符串附加到命名 lambda 的 `__doc__` 元素上：


    Python 中的 lambda 有时往往成为争议的话题。一些反对 lambda 的理由包括：


    *   可读性问题

    *   对函数式思维方式的严格要求

    *   `lambda` 关键字导致的语法冗余


    尽管如此，lambda 函数是函数式编程的重要部分，允许你编写方便的函数而无需命名它们。当你需要确保最短方式来编写或计算某些内容时，使用 lambda 函数是一个好主意，例如在返回函数、按交替键排序或使用
    `reduce()` 整合迭代序列的元素时。


    尽管存在对质疑 Python 中这一特性存在性和功能的辩论，但 lambda 具有为 Python 语言和开发者提供重要价值的属性。使用得当时，它们是表现性的，并且可以使代码更短且易用。可以肯定，一旦你开始添加
    lambda 表达式，你将很快习惯它的操作性。


    # 第 5 章 Python 的执行模型


    DOI: [10.1201/9781003229896-5](https://doi.org/10.1201/9781003229896-5)


    本章内容


    *   ➢ 学习 Python 执行模型

    *   ➢ 引入名称和命名空间的概念

    *   ➢ 刻画 Python 对象和类的特征


    任何编程语言的基础都由语法/句法以及一个执行模型组成。执行模型用于指定语言中项的行为。通过应用它，可以监控用该编程语言编写的程序的行为。因此，运行程序的观察到的行为应该与从执行模型推导的行为相匹配。执行模型观察诸如工作单元，以及这些工作单元发生顺序的限制条件。


    每种编程语言都有一个执行模型，定义了工作单元调度执行的方式。执行模型规范的详细报告包括 Python 和统一并行 C (UPC) 编程语言的。


    Python 程序由代码块构建。一个块代表一段作为单元执行的 Python 程序文本。以下是代码块：模块、函数体和类定义。每个交互式编写的命令都是一个代码块。代表解释器标准输入的脚本文件是一个代码块；在解释器命令行用
    `-c` 选项指定的脚本命令是一个代码块；传递给内置函数 `eval()` 和 `exec()` 的字符串参数也是代码块。这些代码块在执行帧（execution
    frame）中实现。帧保存着一些管理信息，用于调试，并确定在代码块实现完成后在何处以及如何继续执行。Python 程序的执行有 2 个步骤：编译和解释。


    编译是指程序被转换为字节码的过程。字节码是表示算术、比较和内存操作的固定术语指令集。字节码指令创建在 `.pyc` 文件中，并可以在任何操作系统和硬件上运行。


    解释步骤涉及将字节码（`.pyc` 文件）转换为机器码。这一步是至关重要的，因为计算机只能读取机器码或二进制代码。Python 虚拟机 (PVM) 必须理解计算机中的操作系统和处理器，然后将其转换为机器码。之后，这些机器码指令将由处理器执行并显示结果。


    然而，PVM 内部的解释器逐行翻译程序，因此消耗大量时间。为了防止这种情况发生，PVM 中增加了一个称为即时编译 (JIT) 的编译器。JIT 编译器提高了
    Python 程序的执行速度，并广泛应用于所有 Python 环境，如作为标准 Python 软件的 CPython。


    ## 名称与命名空间

