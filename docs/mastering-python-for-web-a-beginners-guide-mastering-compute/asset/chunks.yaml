    Dropbox 很快成为 Python 成功应用的典范。有趣的一点是，Dropbox 最初初是用 Python 2 编写的。2013 年，当 Guido van
    Rossum 加入 Dropbox 时，他主要负责将软件转换为新的 Python 3。他一直为 Dropbox 工作直到退休。在看到 Python 在 Dropbox
    中规模扩展得如此出色后，许多其他企业也开始考虑将其应用于自己的业务。


    20 世纪 20 年代后期社交媒体爆发的时代。随着其影响力的增长，需要管理的数据量也随之增加。与此同时，Python 迅速成为访问这些数据的首选语言，特别是在科技和初创企业领域。2008
    年金融危机期间，自动化接管了金融界。金融机构需要处理大数据，并开始通过分析数据来发现模式、做出决策并管理经济流程。企业拥有大量数据，但缺乏简单明了的方法访问它们。这时，他们开始使用
    Python 对金融数据进行定量分析。其他如 `NumPy`、`scikit` 和 `Matplotlib` 等包具有相对较厚的开发背景，Python 很快成为数据科学的首选。


    让 Python 成为数据科学首选语言的另一个驱动力是训练营（boot camps）。随着 Web 开发的爆发，训练营也随之激增。学习这门语言始终是免费的。因此，许多此类训练营计划中教的第一门语言就是
    Python。世界各地的高中和大学开始将编程作为核心技能进行教学，其中很大一部分是基于 Python 的。


    如今，如果你想成为一名全栈开发者，通常需要从前端和后端软件的基础开始。许多教学计划已经建立了从 `JavaScript` 到 `Python` 的过渡，使得初学者能够平畅学习，尽管这些语言是不同的。因此，如果某天你成为了一名从事
    `JavaScript` 并与应用程序接口（API）交互的前端开发者，你可能会发现为这些应用程序创建后端非常枯燥，直到你尝试了 Python。它的框架（如
    `Flask` 和 `Django`）为想要构建更多后端软件并创建强大的 API 以进行良好协调的开发者提供了简单的解决方案。


    # 安装和配置 Python


    ![一个带有木纹背景的屏幕显示了 macOS 标志、Windows 标志、Python 标志、Android 标志、iOS 标志以及 Linux 的企鹅吉祥。](img/fig1_3.jpg)


    任何 Python 的速成课程都可能从在计算机上安装或更新 Python 开始。有多种安装方法：你可以从 [Python.org](http://Python.org)
    下载官方 Python 发版，从包管理器安装，甚至安装用于科学计算的专用发行版。


    如果你正在自学如何操作 Python，最好的选择是从 [Python.org](http://Python.org) 开始。该平台代表了官方发行版，这类来源通常是学习
    Python 编程最安全的选择。


    在该平台上，你可以轻松地访问各种实用的教程和各类学习材料：


    * 如何检查我们的设备上安装了哪个版本的 Python。

    * 如何在 Windows、macOS 和 Linux 上安装和更新 Python。

    * 如何在手机或平板电脑等移动设备上使用 Python。

    * 如何通过在线解释器在网页上使用 Python。


    在我们继续介绍这些每一点之前，熟悉 `CPython` 源码树中的几个顶层目录是非常重要的，这些目录可以帮助你找到某些功能实现所在的位置。


    * `Doc`：官方文档。这是 [`docs.python.org/`](https://docs.python.org) 使用使用的内容。

    * `Grammar`：包含 Python 的 EBNF 语法文件。

    * `Include`：包含所有解释器范围的头文件。

    * `Lib`：用纯 Python 实现的标准库部分。

    * `Mac`：Mac 特有的代码（例如使用 `IDLE` 作为 OS X 应用程序）。

    * `Misc`：不属于其他地方的内容。通常，这些是各种针对开发者的文档。

    * `Modules`：用 C 语言实现的标准库部分（加上其他代码）。

    * `Objects`：所有内置类型的代码。

    * `PC`：Windows 特有的代码。

    * `PC build`：用于当前在 [python.org](http://python.org) 提供的 Windows 安装程序的 MSVC 版本的构建文件。

    * `Parser`：与解析器相关的代码。AST 节点的定义也保存在此处。

    * `Programs`：C 可执行文件的源代码，包括 CPython 解释器主函数（在 Python 3.5 之前的版本中，这些文件位于 Modules
    目录中）。

    * `Python`：构成核心 CPython 运行时的代码。这包括编译器、求值循环和各种内置模块。

    * `Tools`：用于（或曾用于）维护 Python 的各种工具。


    # 在 Windows 上安装 Python


    与其他许多 Unix 系统和服务不同，Windows 并不包含系统支持的 Python 安装。为了让 Python 可用，CPython 团队多年来每个版本都提供了
    Windows 安装程序。这些安装程序的主要创建目的是添加每个用户用户的 Python 安装，包括核心解释器和库。


    截至目前，Windows 上有三种安装方法：


    1. Microsoft Store

    2. 完整安装程序

    3. Linux 的 Windows 子系统 (WSL)


    如果你想检查 Windows 上是否已安装 Python，你需要首先打开一个命令行应用程序，例如 `PowerShell`。你可以按照以下三个简单步骤操作：


    1. 按 Win 键

    2. 输入 `PowerShell`

    3. 按回车


    或者，你可以右键点击开始按钮并选择 `Windows PowerShell` 或 `Windows PowerShell (管理员)`。人们也可以使用 `cmd.exe`
    或 `Windows Terminal`（微软为 Windows 10 开发的多标签页命令行，后来完全取代了 Windows 控制台）。打开命令行后，输入以下命令并按回车：


    ```

    无论哪种情况，如果你看到的版本低于 3.9.2（这是写作时的最新版本），那么你可能想要升级你的安装。如果你的系统上没有版本的 Python，那么上述两个命令都程序化为启动
    Microsoft Store 并让你重定向到 Python 应用程序页面。


    ```


    如果你不知道安装的确切位置，可以通过 `cmd.exe` 或 `PowerShell` 中的 `where.exe` 命令查找到：


    如前所述，在 Windows 上安装官方 Python 发版有三种省去烦恼的方法：


    1. **Microsoft Store 程序包**：通过 Microsoft Store 应用在 Windows 上最简单的安装方法。这种方法主要建议寻求简单设置体验的
    Python 初学者使用。

    2. **完整安装程序**：此选项涉及从 [Python.org](http://Python.org) 官方网站直接下载 Python。这推荐给安装过程中需要更多功能和控制的中级和高级开发者。

    3. **Linux 的 Windows 子系统 (WSL)**：WSL 可以让你直接在 Windows 中运行 Linux 环境。你可以通过阅读《Windows
    10 的 Linux 子系统安装指南》来学习如何启用和管理 WSL。


