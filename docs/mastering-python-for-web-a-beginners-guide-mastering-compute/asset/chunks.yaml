    # CHAPTER 1: Introduction to Python


    DOI: [10.1201/9781003229896-1](https://doi.org/10.1201/9781003229896-1)


    ## IN THIS CHAPTER

    * ➢ Introducing Python coding language

    * ➢ Diving into the story of Python creation

    * ➢ Explaining how to install and configure


    Python is a general-purpose language that is used for web application and software
    development. To put simply, Python is generally utilized for:

    * Writing scripts

    * Processing big data

    * Performing mathematical computations

    * Connecting to database systems

    * Reading and modifying files

    * Creating applications on server

    * Rapid prototyping

    * Production-ready software

    * Back-end web and mobile app development


    However, the most typical use case for Python is as a scripting language. When
    creating scripts, Python is not considered a replacement for shell scripts or
    batch files but is used to automate interactions with web browsers or application
    user interfaces (GUI). Thus, with Python, you can create both command-line and
    cross-platform GUI applications and deploy them as self-contained executables.


    ![The Python logo resembles two snakes.](images/fig1_1.jpg)


    Sophisticated data analysis has become one of the most flourishing areas of IT,
    and the majority of popular software and data science libraries used for machine
    learning have Python interfaces, making it the most popular high-level command
    interface and numerical algorithms. Python''s third-party web frameworks provide
    fast and convenient ways to create everything from simple lines of code to full-functioning,
    data-driven sites. Python''s latest versions have strong support for operations,
    enabling sites to handle tens of thousands of requests per second. Python also
    works as a highly efficient code generator, making it possible to write applications
    that manipulate their own functions that would be difficult to implement in other
    languages. This coding is often described as a “glue language,” meaning it can
    make disparate code interoperable again. Thus, if you have applications or program
    domains that you would like to link with each other, you can use Python for this
    task.


    ### Python 2 vs. Python 3


    Python is available in two different versions: Python 2 and Python 3. Python 2,
    the older branch, as of January 1, 2020, is no longer supported by its creators,
    the Python Software Foundation. Python 3, the current and future version of the
    language, has many updated features that were not included in Python 2, such as
    new concurrency controls, and a better interpreter. There used to be a lot of
    competition between the two, but since version 3 incorporated few important functions,
    it has won over all the Python fan base. Few of those changes in Python 3 included:

    * Text vs. Data instead of Unicode vs. 8-bit.

    * Print is now a function.

    * Views and iterators instead of lists.

    * The rules for ordering comparisons have been simplified. So, a heterogeneous
    list cannot be sorted, because all the elements of a list must be comparable to
    each other.

