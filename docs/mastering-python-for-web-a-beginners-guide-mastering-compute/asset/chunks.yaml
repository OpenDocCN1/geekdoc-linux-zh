    \ like JavaScript, there is no shortage of libraries and frameworks for Python\
    \ to shape and deliver your specific coding needs.\n\n    Popular Python fully\
    \ featured server-side web framework like Django is created to make Python more\
    \ practical at tuning web applications, while PyQt is a framework that allows\
    \ Python to build GUIs user interfaces that include the use of on-screen icons\
    \ and graphics to operate user commands.\n\n*   **Python is a great tool for processes\
    \ automation:** One of the essential but tedious parts of working in tech is administering\
    \ all the repetitive, time-consuming, tech-related processes. Boring tasks like\
    \ copying files, dragging folders and renaming files, managing assets to servers—all\
    \ of these accumulatively take a lot of precious time. In this case, automation\
    \ via Python implementation could be your savior. Python's ability to write system\
    \ scripts enables you to create simple Python programs to automate routine tasks\
    \ that take so much of your productivity. The time you will be able to save by\
    \ readjusting your processes with Python is a hugely appealing aspect of learning\
    \ the language.\n\n*   **Python gives you the tools to work anywhere in tech:**\
    \ Learning Python code will not only secure your potential expertise in internet\
    \ development—it will prepare you for a variety of future tech jobs. Python is\
    \ used for more than traditional web development. As a matter of fact, Python\
    \ is a top language for such popular emerging scientific fields, including data\
    \ analysis, artificial intelligence, machine learning, and data science. Therefore,\
    \ knowing the language will help to keep your options open, and you may have more\
    \ tech-related opportunities if you decide to master Python.\n\n## A BRIEF HISTORY\
    \ OF PYTHON\n\nPython is a general-purpose, high-level programming language that\
    \ was initially designed by Guido van Rossum in 1991 and developed by Python Software\
    \ Foundation. It was mainly developed for advancing code readability, and its\
    \ syntax that would allow programmers to express concepts in shorter code.\n\n\
    Official work on Python started in the late 1980s. Soon after that, Guido van\
    \ Rossum began doing its application-based trial in December 1989 at Centrum Wiskunde\
    \ & Informatica (CWI) in the Netherland. Originally, the Python project has started\
    \ as a hobby because he was looking for interesting work to keep him occupied\
    \ during Christmas. Python's programming language is based on ABC Programming\
    \ Language, which had the interfacing with the microkernel-based Amoeba Operating\
    \ System that turned a collection of single-board computers into a transparent\
    \ distributed system. Van Rossum had already helped create ABC earlier in his\
    \ career and had seen some issues. So, he took the syntax of ABC, some of its\
    \ best features, and fixed other unsettled attributes. And just like that, by\
    \ correcting those issues completely, he had created a new scripting language.\n\
    \n![A photo of Guido van Rossum.](images/fig1_2.jpg)\n\nThe language was released\
    \ in 1991\\. When it was released, it used many codes and had a distinguished\
    \ design approach. Its main objective was to provide code readability and advance\
    \ developers’ overall productivity.\n\nBut what about the name “Python”? Most\
    \ people think that since the logo depicts two snakes, the origin of the name\
    \ must have been inspired by the actual python snake. Surprisingly, that is far\
    \ from the truth. Guido van Rossum, the creator of Python, wrote in 1996 about\
    \ the origin of the name of his programming language that lays in British humor\
    \ rather than anything else: “Over six years ago, in December 1989, I was looking\
    \ for a ‘hobby’ programming project that would keep me occupied during the week\
    \ around Christmas. My office … would be closed, but I had a home computer and\
    \ not much else on my hands. I decided to write an interpreter for the new scripting\
    \ language I had been thinking about lately: a descendant of ABC that would appeal\
    \ to Unix/C hackers. I chose Python as a working title for the project, being\
    \ in a slightly irreverent mood and a big fan of Monty Python's Flying Circus.”[⁵](#chapter1.xhtml_fn1_5)\n\
    \nMoreover, in 2004 the Python community came up with guiding principles for Python\
    \ design and called it “The Zen of Python”:[⁶](#chapter1.xhtml_fn1_6)\n\n> * \
    \  Beautiful is better than ugly.\n\n>     \n\n>     \n\n> *   Explicit is better\
    \ than implicit.\n\n>     \n\n>     \n\n> *   Simple is better than complex.\n\
    \n>     \n\n>     \n\n> *   Complex is better than complicated.\n\n>     \n\n\
    >     \n\n> *   Flat is better than nested.\n\n>     \n\n>     \n\n> *   Sparse\
    \ is better than dense.\n\n>     \n\n>     \n\n> *   Readability counts.\n\n>\
    \     \n\n>     \n\n> *   Special cases aren’t special enough to break the rules.\n\
    \n>     \n\n>     \n\n> *   Although practicality beats purity.\n\n>     \n\n\
    >     \n\n> *   Errors should never pass silently.\n\n>     \n\n>     \n\n> *\
    \   Unless explicitly silenced.\n\n>     \n\n>     \n\n> *   In the face of ambiguity,\
    \ refuse the temptation to guess.\n\n>     \n\n>     \n\n> *   There should be\
    \ one—and preferably only one—obvious way to do it.\n\n>     \n\n>     \n\n> *\
    \   Although that way may not be obvious at first unless you’re Dutch.\n\n>  \
    \   \n\n>     \n\n> *   Now is better than never.\n\n>     \n\n>     \n\n> * \
    \  Although never is often better than *right* now.\n\n>     \n\n>     \n\n> *\
    \   If the implementation is hard to explain, it's a bad idea.\n\n>     \n\n>\
    \     \n\n> *   If the implementation is easy to explain, it may be a good idea.\n\
    \n>     \n\n>     \n\n> *   Namespaces are one honking great idea—let's do more\
    \ of those!\n\nFor many years after launching, Python did not do well. Trusted\
    \ solutions like ASP.NET, Java, and PHP dominated the enterprise. Python seriously\
    \ took off only in the 2000s when new startups started using Python for their\
    \ projects. Many low-budget businesses also prioritized Python because of its\
    \ ease of use, rapid development, and certainly due to the low cost to host it.\n\
    \nPython has hit the top of its popularity when Dropbox was introduced in the\
    \ market. One day, the story states that an MIT student named Drew Houston forgot\
    \ his USB flash drive for his class one day. He later started thinking about a\
    \ better solution for sharing files. Houston started a company named Evenflow\
    \ back in 2007 with a single product named Dropbox. For the first time, Dropbox\
    \ software enabled people to create a folder on their computer that's automatically\
    \ uploaded to service in the cloud, and it's automatically synced to all the devices\
    \ that the user has installed Dropbox on. The company reached a million users\
    \ by April 2009\\. By the end of 2009, they had 3 million users. Dropbox was written\
    \ in Python."
