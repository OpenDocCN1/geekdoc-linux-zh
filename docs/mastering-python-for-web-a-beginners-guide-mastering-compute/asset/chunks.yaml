  trans: '

    Django、Flask 和 Falcon 都是著名的框架，拥有详尽的文档、数以千计的专家和用户以及大量的配套资源。尽管如此，在创建产品时，规模且活跃的社区是一项宝贵的资源，不仅能为你节省时间和金钱，还能带来更好的结果。


    ### 4. 应用类型

    你对框架的选择很大程度上取决于公司正在构建什么样的应用以及其核心功能是什么。如果你正在构建一个具有复杂前端的应用，`Flask` 或 `Django` 可能是你的首选。另一方面，`Falcon`
    并不是专门为前端开发设计的。然而，如果你正在构建应用程序编程接口（API），`Falcon` 将成为最佳选择，因为它轻量、用户友好且专门为此目的而设计。


    ### 5. 数据库

    你很有可能需要一个依赖数据库的 Web 应用。`Django` 和 `Flask` 都具有良好的数据库集成。它们都支持数据库迁移——即修改和更新数据库以存储更多或不同数据的过程。`Django`
    和 `Flask` 还与 `SQLite` 和 `MySQL` 集成，这是两种用于数据库通信的流行系统。在这种情况下，`Falcon` 对于依赖数据库的应用程序可能不是最佳选择。


    ### 6. 开源

    开源软件可以免费访问，并可以根据你的意进行任何修改。`Django` 特别拥有庞大的社区和非常规律发布周期，因此你可能需要跟踪版本并管理漏洞。确保定期升级版本，以保持应用程序的安全和高效。使用具有明确发布计划的免费开源框架可以使你的开发团队更具生产力和凝聚力，因为他们已经提前为变化做好了准备。


    ### 7. 应用结构

    应用结构取决于你所坚持的框架。特别是 `Django`，具有更固定的应用结构。许多开发者认为这是一个缺点，因为它限制了创造力，并阻碍了选择结构和实现方式的能力。`Django`
    使用 `MTV`（模型-模板-视图）架构模式，允许为了更好的组织而将程序的不同部分分开。另一方面，`Flask` 和 `Falcon` 都是微框架，因此它们不使用
    `MTV` 方法，你构建应用的方式很大程度上取决于你自己。


    ### 8. 路由

    如果你正在处理任何带有 URL（统一资源定位符）的 Web 应用，路由是一个需要考虑的重要点。在 `Flask` 中，Python 文件中有一个装饰器，用于在特定
    URL 激活时确定某些操作。`Django` 采取了更中心化的路由方法，使得 `Django` 成为一个更通用的选项。另一方面，`Flask`更容易提取 URL
    参数。这对于一个具有多个页面和项目、通过 URL 相互界面并传递数据的复杂应用来说非常重要。


    # 评价


    DOI: [10.1201/9781003229896-7](https://doi.org/10.1201/9781003229896-7)


    复杂的编程已成为工作或投资的最流行的领域之一。大多数用于机器学习的流行软件和数据科学库都有 Python 接口，使其成为最流行的高级命令行界面。Python
    的 Web 框架提供了快速方便的方法，可以生成从简单的几行代码到功能齐全、数据驱动网站的一切内容。Python 的最新版本对操作有强力支持，使网站能够每秒处理数万次请求。此外，Python
    还作为一个高效的代码生成器工作，使得编写能够操纵自身函数的应用程序成为可能，而这在其他语言中几乎无法实现。这种编码被称为“胶水语言”，意味着它可以让不同的代码再次具有互操作性。因此，如果你有想要相互连接的应用程序或程序领域，可以使用
    Python 来完成此任务。如今，Python 通常用于编写系统脚本、处理大数据、执行数学计算、创建 Web 应用以及快速原型开发。


    任何关于 Python 的速成课程或小白指南都可能从在你的计算机上安装或更新 Python 开始。有多种安装方法：你可以从 Python.org 下载官方
    Python 分发版，从包管理器安装，甚至安装用于科学计算的专用分发版。如果你只是刚开始学习如何自己操作 Python，最好的选择是从 Python.org
    开始。该平台代表了官方发行，是学习 Python 编程最安全的选择。此外，在该平台上，你可以轻松地访问各种实用的教程和各类学习材料：


    * 如何检查我们的设备上安装了哪个版本的 Python

    * 如何在 Windows、macOS 和 Linux 上安装和更新 Python

    * 如何在手机或平板电脑等移动设备上使用 Python

    * 如何通过在线解释器在 Web 上使用 Python


    通过这个《精通》版，我们尝试概述并对比 Python 语言本身如何处理数据数组，以及任何人如何对此进行改进。通常情况下，数据类型用于定义格式、设置数据的上下限，以便程序能够恰善应用它。在
    Python 中，不需要在显式提到数据类型的情况下声明变量。相反，Python 在运行时直接从语法判断字字面量的类型。这种特征也被称为动态类型。Python
    默认内置了以下数据类型，分为这些类别：


    | 类别 | 类型 |

    | :--- | :--- |

    | • 文本类型: | `str` |

    | • 数值类型: | `int`, `float`, `complex` |

    | • 序列类型: | `list`, `tuple`, `range` |

    | • 映射类型: | `dict` |

    | • 集合类型: | `set`, `frozenset` |

    | • 布尔类型: | `bool` |

    | • 二进制类型: | `bytes`, `bytearray` |


    我们还触及了一个名为注释的概念。注释主要用作解释器或编译器在运行时忽略的语句。尽管注释不会改变程序的结果，但它们在编程中仍然起着重要作用。


    注释是开发者提供的有用信息，以确保读者能够理解源代码。单行注释、内联注释和多行注释用于解释代码逻辑或特定部分。当你不再维护代码时，注释对于尝试管理你代码的人非常有帮助。此外，我们涵盖了
    Python 代码文档作为软件开发过程中的关键且持续课程。按照规定，文档字符串（docstring）定义了你的源代码——即你的函数、模块或类的功能。代码内文档适用于所有模块，模块导出的所有函数和类也应该有
    docstring。


    希望你也能够学习用于数据结构课程的以 Python 为核心的算法和函数。算法通常写成用户友好语言和几种常用编程语言的结合。形成算法没有固定的规则，但你需要记住以下几点：


    * 指出准确的问题是什么

    * 定义你想从哪里开始

    * 确定你需要在哪里停止

    * 决定中间步骤

    * 审查你的算法步骤

