    Python does not encourage using immediately invoked lambda expressions. It simply
    results from a lambda expression being callable, unlike the body of a normal function.
    Lambda functions are frequently used with higher-order functions, which take one
    or more functions as arguments or return one or more functions. A lambda function
    can be a higher-order function by taking a function (normal or lambda) as an argument
    like in the following example:


    Python exposes higher-order functions as built-in functions or in the standard
    library. Examples include `map()`, `filter()`, `functools.reduce()`, as well as
    key functions like `sort()`, `sorted()`, `min()`, and `max()`.


    ### Syntax


    As mentioned previously, a lambda form presents syntactic distinctions from a
    normal function. In particular, a lambda function has the following characteristics:


    * It is scripted as a single line of execution.

    * It does not support type annotations.

    * It can be immediately invoked (IIFE).

    * A lambda function cannot contain any statements. In a lambda function, adding
    statements like `return`, `pass`, `assert`, or `raise` will only result in a `SyntaxError`
    exception.


    Unlike the normal function, a Python lambda function is a single expression. Although
    in the body of a lambda, you are allowed to spread the expression over several
    lines using parentheses or a multiline string, it still remains as a single expression:


    The example above returns the string ‘odd’ when the lambda argument is odd, and
    ‘even’ when the argument is even. It goes across two lines because it is contained
    in a set of parentheses, but it still stays as a single expression.


    Similar to a normal function object defined with `def`, Python lambda expressions
    support all the different ways of passing arguments. This includes:


    * Named arguments also called keyword arguments

    * Positional arguments

    * Variable list of arguments

    * Variable list of keyword arguments

    * Keyword-only arguments


    The following examples display options available in order to pass arguments to
    lambda expressions:


    ### Decorators


    In Python, a decorator is the execution of a pattern that enables adding behavior
    to a function or a class. It is typically expressed with the `@decorator` syntax
    prefixing a function. To demonstrate with an example:


    In the example above, `some_decorator()` is a function that builds on a behavior
    to `decorated_function()`, so that invoking `decorated_function("Python")` results
    in the following output:


    Moreover, Python lambdas can be tested in a similar way as regular functions.
    It''s possible to use both modules for that – `unittest` and `doctest`.


    The `unittest` module operates Python lambda functions similarly to regular functions:


    This test defines three test methods, each of them exercising a test scenario
    for `addtwo()` implemented as a lambda function. The execution of the Python file
    `lambda_unittest.py` produces the following:


    The `doctest` module extracts interactive Python code from docstring to execute
    tests. And even if the syntax of Python lambda functions does not support a typical
    docstring, it is possible to attach a string to the `__doc__` element of a named
    lambda:


    There are instances when lambdas in Python tend to be the subject of controversies.
    And some of the arguments against lambdas include:


    * Problems with readability

    * The exacting of a functional way of thinking

    * Excessive syntax with the `lambda` keyword


    Nevertheless, lambda functions are an important part of functional programming
    that lets you script handy functions without needing to name them. It''s a good
    idea to use lambda functions when you need to secure the shortest way to write
    or compute something, for instance, when returning a function, sorting by an alternate
    key, or integrating elements of an iterable sequence with `reduce()`.


    Despite the existing debates questioning the existence and functionality of this
    feature in Python, lambda has properties that provide serious value to the Python
    language and to developers. When used properly, they are expressive and can make
    code shorter and user-friendly. It is certain that once you start adding lambda
    expressions, you will get used to its operability very quickly.


    # CHAPTER 5 Python''s Executional Model


    DOI: [10.1201/9781003229896-5](https://doi.org/10.1201/9781003229896-5)


    IN THIS CHAPTER


    * ➢ Learning about Python executional model

    * ➢ Introducing concepts of names and namespaces

    * ➢ Characterizing features of Python Objects and Classes


    The foundation of any programming language consists of a grammar/syntax together
    with an execution model. The execution model is made to specify the behavior of
    items of the language. By applying it, one can monitor the behavior of a program
    that was written in terms of that programming language. Consequently, the observed
    behavior of a running program should match the behavior derived from the execution
    model. An execution model observes things such as a unit of work, and what are
    the limitations on the order in which those units of work take place.


    Each programming language has an execution model that defines the manner in which
    the units of work are scheduled for execution. Detailed reports of the execution
    models specification include those of Python and of the Unified Parallel C (UPC)
    programming language.


    A Python program is constructed from code blocks. A block stands for a piece of
    Python program text that is executed as a unit. The following are blocks: a module,
    a function body, and a class definition. Each command that is scripted interactively
    is a block. A script file that represents a standard input to the interpreter
    is a code block; a script command that is specified on the interpreter command
    line with the `-c` option is a code block; and the string argument passed to the
    built-in functions `eval()` and `exec()` is a code block too. These code blocks
    are implemented in an execution frame. A frame holds some administrative information
    that is used for debugging and determining where and how execution continues after
    the code block''s implementation is completed. The execution of the Python program
    has 2 steps: compilation and interpreter.


    Compilation is referred to the process when a program is being converted into
    byte code. Byte code is fixed terms of instructions that represent arithmetic,
    comparison, and memory operations. The byte code instructions are created in the
    `.pyc` file and can run on any operating system and hardware.


    The interpretation step involves converting the byte code (`.pyc` file) into machine
    code. This step is essential as the computer can only read from the machine or
    binary code. Python Virtual Machine (PVM) has to understand the operating system
    and processor in the computer and only then convert it into machine code. Afterward,
    these machine code instructions would be executed by the processor and with results
    displayed.


    Nevertheless, the interpreter inside the PVM translates the program line by line,
    therefore, consuming a lot of time. To prevent this from happening, a compiler
    known as Just In Time (JIT) is added to PVM. JIT compiler improves the execution
    speed of the Python program and is widely used in all Python environments like
    CPython which is standard Python software.


