    # 第 1 章：Python 简介


    DOI: [10.1201/9781003229896-1](https://doi.org/10.1201/9781003229896-1)


    ## 本章内容

    * ➢ 介绍 Python 编程语言

    * ➢ 深入了解 Python 的诞生

    * ➢ 说明如何安装和配置


    Python 是一种通语言的软件语言。简单来说，Python 通常用于：

    * 编写脚本

    * 处理大数据

    * 执行数学计算

    * 连接数据库系统

    * 读取和修改文件

    * 在服务器上创建应用程序

    * 快速原型开发

    * 生产级软件

    * 后端 Web 和移动应用开发


    然而，Python 最典型的用例是作为脚本语言。在创建脚本时，Python 不被视为 Shell 脚本或批处理文件的替代品，而是用于自动化网络浏览器或应用程序用户界面（GUI）的交互。因此，通过
    Python，你可以创建命令行和跨平台 GUI 应用程序，并将它们部署为自包含的可执行文件。


    ![Python 标志看起来像两条蛇。](img/fig1_1.jpg)


    复杂的数据分析已成为 IT 领域最蓬勃领域之一，大多数用于机器学习的流行软件和数据科学库都有 Python 接口，使其成为最流行的高级命令行界面和数值算法。Python
    的第三方 Web 框架提供了快速方便的方法，可以创建从简单的代码行到功能完备的数据驱动网站的一切内容。Python 的最新版本对操作有强大的支持，使网站能够每秒处理数万次请求。Python
    还作为一个高效的代码生成器，使得编写在其他语言中难以实现的操纵函数的应用程序成为可能。这种编码通常被称为“胶水语言”，意味着它可以让不同的代码再次变得相互操作。因此，如果你有想要连接的应用程序或程序领域，可以使用
    Python 完成此任务。


    ### Python 2 与 Python 3


    Python 有两个不同的版本：Python 2 和 Python 3。Python 2 是旧分支，自 2020 年 1 月 1 日起不再受创建者 Python
    软件基金的支持。Python 3 是该语言的当前和未来版本，包含了许多 Python 2 没有包含的功能，例如新的并发控制和更好的解释器。两者之间曾存在很多竞争，但由于版本
    3 包含了重要的功能，它赢得了所有的 Python 粉丝。Python 3 的一些变化包括：

    * 文本与数据代替 Unicode 与 8 位。

    * Print 现在是一个函数。

    * 视图和迭代器代替列表。

    * 排序比较规则规则被简化。因此，异构列表无法排序，因为列表中的所有元素必须是可比较的。


