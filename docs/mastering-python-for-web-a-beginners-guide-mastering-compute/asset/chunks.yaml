    例如，Windows 将 `.py` 和 `.pyw` 扩展名与 `python.exe` 和 `pythonw.exe` 程序关联。这允许你通过双击脚本来运行它们。当你有一个带有命令行界面的脚本时，你可能只会在屏幕上闪过一个黑窗口。为了避免这种情况的发生，你可以在脚本末尾添加类似
    `input(''Press Enter to Continue…'')` 的语句。这样，在你按下回车键之前，程序将不会继续处理。尽管如此，如果你的脚本有任何错误，执行将在到达
    `input()` 语句之前就会中断，你仍然无法看到结果。


    在 Unix 类系统上，你可以通过应用我们之前提到的 shebang 变量，在文件管理器中通过双击来运行脚本。同样，对于命令行界面脚本，你可能在屏幕上没有看到任何结果。


    而且由于通过双击执行脚本具有若干局限性，并且通常取决于操作系统、文件管理器、执行权限和文件关联等许多因素，因此强烈建议将其视为已调试好并准备投入生产的脚本的可行方案。


    此外，如果你不知道从何开始，可以查看以下 Python 中最流行的脚本：连接两个字符串、字符串中的浮点数、计算数字幂、处理布尔类型、应用 If else 语句以及使用
    AND 和 OR 运算符。


    ## 连接两个字符串


    Python 中有很多方法可以连接字符串值。然而，在 Python 中组合两个字符串值简单的方法是使用 `+` 运算符。在这种情况下，两个字符串值被赋值给两个变量，另一个变量被用于存储稍后打印的连接值。


    从编辑器运行脚本后，将出现以下输出。结果是两个单词“Hello”和“World”被连接在一起，并输出为“HelloWorld”。


    ## 在字符串中格式化浮点数


    编程中需要浮点数来表示分数，有时为了编程目的需要对浮点数进行格式化。以下脚本使用了字符串格式化和字符串插值来格式化浮点数。字符串格式化使用了带有格式宽度的
    `format()` 方法，而字符串插值使用了带有格式宽度的 `*` 符号。根据格式宽度，小数点前设置了 5 位数字，小数点后设置了 2 位数字。


    从编辑器运行脚本后，将获得以下输出。


    ## 计算数字的幂


    在以下脚本中展示了在 Python 中计算 `xn` 的三种方法。使用双星号 `*` 运算符、`pow()` 方法和 `math.pow()` 方法计算 `xn`。`x`
    和 `n` 的值用数值初始化。双星号 `*` 和 `pow()` 方法用于计算整数的幂。`math.pow()` 可以计算分数的幂；这在脚本的最后部分也有展示。


    运行脚本后将出现以下输出。前两个输出的结果将为 43，第三个输出将显示结果为 26.5。


    ## 处理布尔类型


