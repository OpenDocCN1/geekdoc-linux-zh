    ## AND 和 OR 运算符的使用


    以下脚本在条件语句中应用 AND 和 OR 运算符。当两个条件都返回 true 时，AND 运算符返回 true；当两个条件中的任意一个条件返回 true
    时，OR 运算符返回 true。取两个浮点数作为选择题和理论分。


    ## 模块或模块化编程


    模块或模块化编程是指将大型、复杂的编程任务分解为独立的、较小的子任务或模块。单个模块可以像积木一样堆叠在一起创建另一个应用程序。对于较大的应用程序，代码模块化有多个优点：


    - **简单性：** 模块让你专注于问题的一个小部分，而不是关注手头的整个问题。如果你正在处理单个模块，你就知道你有一个更小的问题域要处理。这使得整体开发变得易于管理且不易出错。

    - **可维护性：** 模块通常设计用于在不同问题和任务之间创建逻辑边界。如果编写模块时尽可能减少相互依赖，那么对单个模块的修改影响程序其他部分的可能性就会降低。这样这样，你甚至可以在不了解模块之外的脚本的情况下对模块进行更改。这使得许多开发人员团队在大型应用程序上协作工作更加方便。

    - **可重用性：** 定义在单个模块中的功能可以通过适当定义的接口轻松地重用。这样，就不需要重复你的代码。

    - **组织：** 模块通常定义一个独立的命名空间，有助于防止标识符之间发生冲突。


    通常，在 Python 中定义模块有三种方法：模块可以用 Python 本身编写；可以用 C 语言编写并在运行时动态加载；或者内置模块可以内生地包含在解释器中。然而，在所有三种情况下，都通过
    `import` 语句以相同的方式访问模块内容如下所示，通过 `import` 语句为调用者提供模块内容：


    这是最简单的一种，它不会让调用者直接访问模块内容。每个模块都有自己的私有符号表，该符号表同时也作为模块中定义的所有对象的全局符号表。因此，如前所述，它还允许模块创建一个独立的命名空间。


    ### 定位模块


    当你导入模块时，Python 解释器会在当前目录中搜索该模块。如果未找到模块，Python 将会搜索 shell 变量 `PYTHONPATH` 中的每个目录。如果仍然失败，Python
    将检查默认路径。在 UNIX 上，此默认路径通常是 `/usr/local/lib/python/`。


    准确来说，模块路径存储在系统模块 `sys` 的 `sys.path` 变量中。`sys.path` 变量包含当前目录、`PYTHONPATH` 和取决于安装的默认路径。`PYTHONPATH`
    是环境变量，由目录列表组成，`PYTHONPATH` 的语法类似于 shell 变量 `PATH`。


    这里是来自 Windows 系统的 `PYTHONPATH` ——


    这里是来自 UNIX 系统的基础 `PYTHONPATH` ——


    ## 标准模块

