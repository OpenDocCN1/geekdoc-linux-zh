  trans: '


    值得注意的是，特殊字符在集合内部会失去它们的特殊含义。例如，`[(+*)]` 将匹配任意一个字面字符 `(`、`+`、`*` 或 `)`。字符类如 `\w`
    或 `\S`（下文定义）也允许在集合内部，尽管它们匹配的字符取决于是否强制执行 ASCII 模式或 LOCALE 模式。


    不在范围内的字符可以通过取集合的反反来匹配。如果集合的第一个字符是 `^`，则将匹配所有不在集合中的字符。例如，`[⁵]` 将匹配除 `5` 之外的任何字符，而
    `[^^]` 将匹配除 `^` 之外的任何字符。如果 `^` 不是是集合中的第一个字符，则它没有特殊含义。


    ### `|`


    `A|B` 模式，其中 `A` 和 `B` 可以是任意正则表达式（REs），它会创建一个匹配 `A` 或 `B` 的正则表达式。任意数量的 RE 可以这样用
    `|` 隔开。在扫描目标字符串时，将从左到右尝试由 `|` 隔开的 RE。当某个模式完全匹配时，该分支被接受。这意味着一旦 `A` 匹配成功，将不再进一步测试
    `B`，即使它能产生更长的整体匹配。换句话说，`|` 运算符从不是贪婪的。要匹配字面量 `|`，请使用 `\|`，或将其包含字符类中，如 `[|]`。


    ### `(...)`


    匹配括号内的任意正则表达式，并表示组的开始和结束；执行匹配后可以检索组的内容，并可以在字符串的后续部分通过下文描述的 `\number` 特殊序列进行匹配。要匹配字面量
    `(` 或 `)` 使用 `\(` 或 `\)`，或将它们包含字符类中：`[(]`、`[)]`。


    ### `(?...)`


    这是一种扩展符号，`?` 之后的第一个字符决定了构造的含义和后续语法。扩展通常不会创建一个新组；`(?P<name>...)` 是该规则的例外。以下是目前支持的扩展。


    ### `(?aiLmsux)`


    （来自集合 `a`、`i`、`L`、`m`、`s`、`u`、`x` 的一个或多个字母。）该组匹配空字符串；这些字母设置了相应的标志：`re.A`（仅 ASCII
    匹配）、`re.I`（忽略大小写）、`re.L`（依赖 locale）、`re.M`（多行）、`re.S`（点匹配所有字符）、`re.U`（Unicode
    匹配）和 `re.X`（详细模式），适用于整个正则表达式。（标志在模块内容中有所描述。）如果你希望将标志作为正则表达式的一部分，而不是向 `re.compile()`
    函数传递标志参数，这非常有用。标志应该在表达式字符串的开头使用。


    ### `(?:...)`


    普通括号的非捕获版本。匹配括号内的任意正则表达式，但在执行匹配后无法检索组匹配到的子字符串，也无法在模式的后续被引用。


    ### `(?aiLmsux-imsx:...)`


    （来自集合 `a`、`i`、`L`、`m`、`s`、`u`、`x` 的零或多个字母，可选跟随一个 `-` 然后是来自 `i`、`m`、`s`、`x` 的一个或多个字母。）这些字母设置或移除相应的标志：`re.A`（仅
    ASCII 匹配）、`re.I`（忽略大小写）、`re.L`（依赖 locale）、`re.M`（多行）、`re.S`（点匹配所有字符）、`re.U`（Unicode
    匹配）和 `re.X`（详细模式），适用于表达式的部分。（标志在模块内容中有所描述。）


    字母 `a`、`L` 和 `u` 作为内联标志时是互斥的，因此它们不应组合或跟在 `-` 后。相反，当其中之一出现在内联组中，它会覆盖所在组的匹配模式。在
    Unicode 模式 `(?a:...)` 中切换到仅 ASCII 匹配，`(?u:...)` 切换到 Unicode 匹配（默认）。在字节模式 `(?L:...)`
    中切换到依赖 locale 的匹配，`(?a:...)` 切换到仅 ASCII 匹配（默认）。这种覆盖仅对狭窄的内联组有效，原始匹配模式会在组外恢复。


    ### `(?P<name>...)`


    与普通括号类似，但组匹配的子字符串可以通过符号组名来访问。组名必须是有效的 Python 标识符，且每个组名在一个正则表达式中只能定义一次。符号组也是带编号的组，就像该组没有命名一样。


    ### `(?P=name)`


    对命名组的反向引用；它匹配之前名为 `name` 的组所匹配的文本。


    ### `(?#...)`


    一个注释；括号内的内容会被简单忽略。


    ### `(?=...)`


    如果 `…` 匹配后续则匹配，但不消耗字符串的任何部分。这被称为前瞻断言。例如，`Isaac(?=Newton)` 仅在后面跟着 `Newton` 时才会匹配
    `Isaac`。


    ### `(?!...)`


    如果 `…` 不匹配后续则匹配。这是一个否定前瞻断言。例如，`Isaac(?!Newton)` 仅在后面没有跟随 `Newton` 时才会匹配 `Isaac`。


    ### `(?<=...)`


    如果字符串中的当前位置前面是 `…`，则匹配。这是一个正后行断言。例如，`(?<=Isaac)Newton` 仅在前面是 `Isaac` 时才会匹配。


    ### `(?<!...)`


    如果字符串中的当前位置前面不是 `…`，则匹配。这是一个否定后行断言。例如，`(?<!Isaac)Newton` 仅在前面不是 `Isaac` 时才会匹配。


    ### `(?<...)`


    如果字符串中的当前位置后面是 `…`，则匹配。这是一个正后行断言。例如，`Isaac(?=Newton)` 仅在后面是 `Newton` 时才会匹配。


    ### `(?!!...)`


    如果字符串中的当前位置后面不是 `…`，则匹配。这是一个否定后行断言。例如，`Isaac(?!!Newton)` 仅在后面不是 `Newton` 时才会匹配。


    ### `(id/name)yes-pattern|no-pattern)`


    如果 `id/name` 存在，则匹配 `yes-pattern`，否则匹配 `no-pattern`。


    ### `\number`


    匹配组 `number` 的内容。组从 1 开始编号。例如，`(.+) \1` 匹配 `the` 或 `55`，但不匹配 `the`（注意组后的空格）。如果数字的第一位是
    0，或者数字长度为 3 进制位，则它不会被解释为组匹配，而是作为该八进制值的字符。在字符类的 `[` 和 `]` 内部，所有数字转义都被视为字符。


    ### `\A`


    仅在字符串的开头匹配。


    ### `\b`


    匹配空字符串，但仅在单词的开头或结尾。单词定义为单词字符序列。注意形式上，`\b` 定义为 `\w` 与 `\W` 字符之间的边界（或反之），或者 `\w`
    与字符串开头/结尾之间的边界。


    Unicode 字母数字是 Unicode 模式中使用的，但可以通过 ASCII 标志进行更改。如果使用了 LOCALE 标志，单词边界由当前 locale
    定义。在字符范围内，`\b` 表示退格字符，为了兼容 Python 的字符串字面量。


    ### `\B`


    匹配空字符串，但仅当不在单词的开头或结尾时。这意味着 `r''py\B''` 匹配 `python`、`py3`、`py2`，但不匹配 `py`、`py.`
    或 `py!`。`\B` 是 `\b` 的相反，因此 Unicode 模式中的单词字符是 Unicode 字母数字或下划线，尽管这可以通过 ASCII 标志进行更改。如果使用了
    LOCALE 标志，单词边界由当前 locale 决定。


    ### `(?<!...)`


    否定后行断言。类似于正后行断言，`…` 必须匹配固定长度的字符串。后行断言可能会匹配字符串的开头。你可能更希望使用 `search()` 函数而不是 `match()`
    函数。


