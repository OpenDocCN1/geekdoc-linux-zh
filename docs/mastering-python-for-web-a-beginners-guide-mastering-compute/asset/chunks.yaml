  trans: "\n安装完成后，你现在可以使用 `python3.9` 命令运行 Python 3.9，并使用 `pip3` 命令运行 `pip`。\n\n-\
    \ **Linux Mint 和 Ubuntu 17 及以下版本：** Python 3.9 不在 Universe 仓库中，因此你必须从个人包归档 (PPA)\
    \ 获取。例如，要从“deadsnakes” PPA 安装，请使用以下命令：\n    ```bash\n$ sudo add-apt-repository\
    \ PPA:deadsnakes/PPA\n$ sudo apt-get update\n$ sudo apt-get install python3.9\
    \ python3-pip\n```\n\n### 如何在 Debian Linux 上安装\n\n在 `Debian` 上安装 Python 3.9 之前，你必须先安装\
    \ `sudo` 命令。为了实现这一点，你应该在终端中执行以下命令：\n\n紧接着，尝试使用 `sudo vim` 命令或你喜欢的文本编辑器打开 `/etc/sudoers`\
    \ 文件。在文件的末尾添加以下行文本，将 `your_username` 替换为你的实际用户名：`your_username ALL=(ALL) ALL`\n\
    \n完成后，你可以直接跳过直到到达 `如何从源码编译 Python` 章节以完成 Python 的安装。\n\n### 如何在 openSUSE 上安装\n\
    \n从源码编译是在 `openSUSE` 上设置 Python 最可靠的方法。为此，你需要安装开发工具，这可以通过 `YaST` 操作系统设置中的菜单完成，也可以通过使用命令行包管理器\
    \ `Zipper` 来完成：\n\n由于需要安装超过 150 个包，这被认为是一项正常操作，可能需要一些时间才能完成。但一旦完成，可以放地跳到 `如何从源码编译\
    \ Python` 章节。\n\n### 如何在 CentOS 和 Fedora 上安装\n\n遗憾的是，Python 3.9 不在 `CentOS` 和\
    \ `Fedora` 仓库中，因此你需要从源码编译 Python。不过，在安装 Python 之前，你需要确保你的系统已经做好了准备。首先，通过以下代码更新\
    \ `yum` 包管理器：\n```bash\n$ sudo yum -y update\n```\n\n一旦 `yum` 完成更新，你可以使用以下命令行自由地安装必要的构建依赖：\n\
    \n一旦你看到所有安装已完成，你就可以跳到 `如何从源码编译 Python` 章节。\n\n### 如何在 Arch Linux 上安装\n\n`Arch\
    \ Linux` 因遵循 KISS 原则（保持简单，愚蠢如此）而闻名，并主要关注现代化和实用性。尽管如此，`Arch Linux` 在跟踪 Python 发布方面非常勤奋。你很可能已经默认安装了最新版本。如果没有，你可以使用以下命令更新\
    \ Python：`$ packman -S python`。一旦更新完成，你就可以准备开始编写脚本了。\n\n## 如何从源码编译 Python\n\n\
    当你的 Linux 发行版没有最新版本的 Python，或者当你只是想自己能够编译最新、最快的版本时，你可以采取以下步骤从源码编译 Python：\n\n\
    #### 第 1 步：下载源代码\n\n首先，你需要通过 [Python.org](http://Python.org) 获取 Python 源代码。你只需要进入下载页面，并查找顶部的\
    \ Python 3 最新源码即可。请确保你搜索的是 Python 3 而不是 Python 2。\n\n当你选择 Python 3 版本时，你可以在页面底部看到“Files（文件）”部分。选择\
    \ `Gzipped source tarball` 并将其下载到你的机器。如果你更倾向于命令行方法，可以使用 `Wget` 程序，该程序从 Web 服务器检索内容并将文件下载到当前目录：\n\
    \n当 tar 包 下载完成后，你将需要处理其他事情来为构建 Python 准备系统。\n\n#### 第 2 步：准备你的系统\n\n从头构建 Python\
    \ 涉及几个固定的步骤。这些步骤的目标在所有发行版中都是相同的，但如果你的发行版没有使用 `apt-get`，你可能需要将其转换为适用于你发行版的命令：\n\
    \n1. 首先，确保你已经更新了包管理器并升级了你的包：\n\n2. 接下来，你需要安装所有的构建需求：\n\n如果你的系统中已经安装了某些需求，这不会产生任何问题，因为你可以执行上述命令，任何现有的包都不会被覆盖。\n\
    \n#### 第 3 步：构建 Python\n\n1. 一旦你拥有了所有的前提条件和带归档文件 (TAR)，你就可以开始将源码解压到目录。请注意，以下命令将在你所在的目录下创建一个名为\
    \ `Python-3.9.1` 的新目录：\n\n2. 现在，你需要运行 `./configure` 工具来准备构建：\n```bash\n$ ./configure\
    \ –enable-optimizations –with-ensurepip=install\n```\n\n`enable-optimizations`\
    \ 标志将启用 Python 内部的一些优化，使其运行速度快约 10%。这样做可能会为编译时间增加二三十十分钟。\n\n3. 接下来，你使用 `-j` 选项构建\
    \ Python，该选项简单地告诉 `make` 将构建拆分为并行步骤以加速编译。即使是并行构建，这一步也可能需要几分钟：\n```bash\n$ make\
    \ -j 8\n```\n\n4. 最后，你将想要安装你的新版本 Python。你在这里可以使用 `altinstall` 选项来避免覆盖系统 Python。由于你正在安装到\
    \ `/usr/bin`，你需要以 root 身份运行：\n```bash\n$ sudo make altinstall\n```\n\n安装可能需要一些时间，但一旦完成，建议验证\
    \ Python 是否正确。\n\n#### 第 4 步：验证安装\n\n你可以测试 `python3.9 –version` 命令是否返回版本：\n\n\
    在你想运行额外测试的情况下，你也可以选择测试套件以确保在系统上正常运行。要运行测试套件，你只需要输入：\n\n你不需要急于这一部分，因为你的电脑将运行一段时间。如果所有测试通过且没有报错，你就可以确认你的新构建符合预期。\n\
    \n## 如何在 iOS 上安装 Python\n\n适用于 `iOS` 的 Pythonista 软件应用程序是一个可以在你的 iPhone 或 iPad\
    \ 上运行的完全开发的 Python 环境。它集成了 Python 编辑器、技术文档和解释器。\n\nPythonista 对于那些不喜欢局限于笔记本电脑并喜欢在移动中完善\
    \ Python 技能的人来说是一个极佳的工具。该应用程序自带完整的 Python 3 标准库，还包含了可以离线浏览的文档。要设置 Pythonista，只需从\
    \ iOS App Store 下载即可。\n\n## 如何在 Android 上安装 Python\n\n如果你不是 Apple 用户而是 Android\
    \ 粉丝，并且想在平板电脑或手机上练习 Python，这个问题也得到了解决。可靠支持 Python 3.8 的 Android 应用是 `Pydroid 3`。`Pydroid\
    \ 3` 具有一个用于读取-评估-打印循环 (REPL)、交互式语言会话以及允许编辑、保存和执行 Python 代码的解释器。此外，它内置了专门用于 `Pydroid\
    \ 3` 的 C、C++ 甚至 Fortran 编译器。通过 `pip` 构建任何库，也可以从命令行构建并安装依赖。\n\n你可以从 Google Play\
    \ Store 下载并安装 `Pydroid 3` 的免费版和付费 Premium 版（支持代码预测和代码分析）。\n\n"
