    choose to adopt the Python language for introducing students to programming and
    problem-solving. Python provides several benefits over other languages such as
    C++ and Java, the most important of which is that it has a simple syntax that
    is easier to learn. In this chapter, we are going to expand upon the use of Python
    by providing Python-centric algorithms and functions for the data structures course.
    We shall learn about the clean syntax and powerful features of the language used
    throughout scripting and the underlying mechanisms of these features and their
    overall efficiency.


    It is important to understand that the design and analysis of algorithms are a
    fundamental topic in computer science and engineering education nowadays. Unfortunately,
    traditional programming languages force many to deal with details of data structures
    and supporting routines, rather than algorithm design. Python represents an algorithm-oriented
    language that has been sorely needed in development. The advantages of Python
    include its uncomplicated syntax, the flexibility of basic functions, and interactivity
    that encourages experimentation. These and many other features we are going to
    analyze without further delay.


    ![A rectangular panel shows the Python logo with a sample algorithm on either
    side.](images/fig4_1.jpg)


    ## PYTHON SCRIPTS AND MODULES


    In computing, the term script is used to refer to a file containing a logical
    sequence of orders or a set processing file. This usually comes as a simple program
    that is stored in a plain text file. Thus, a plain text file containing Python
    code that is designed to be directly executed by the user is called script, an
    informal term that means a top-level program file. On the other hand, a plain
    text file containing Python code that is created to be imported and used from
    another Python file is what we call a module. The main difference between a module
    and a script is that modules are meant to be imported, while scripts are made
    to be directly executed. In any case, the important thing is to learn how to run
    the Python code you write into your modules and scripts. And scripts are always
    processed by an interpreter, which is responsible for executing each command sequentially.


