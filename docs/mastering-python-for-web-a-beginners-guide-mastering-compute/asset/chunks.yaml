  trans: "\n\n# 注释\n\n你的注释应该直击主题。在一切内容都一目易懂的情况下，你不需要添加任何内容。许多开发者使用的缩写是 D.R.Y.，代表编程格言`“不要重复你自己（Do\
    \ not Repeat Yourself）”。这意味着你的代码应该尽可能简洁。你不需要对能够充分自解释的代码部分进行注释，比如下面这一行：\n\n我们可以清楚地看到\
    \ `x` 被返回了，因此显然没有必要在注释中重复该语句。这种不当的做法会让注释变得 W.E.T.，意味着开发者“把一切都写了两遍（wrote everything\
    \ twice）”。此外，一旦你让代码运行，请确保返回并删除变得冗余的注释。\n\n### 避免不必要的注释\n\n杂乱、复杂的注释可能意味着你的代码存在存在更深层次的问题。有时，代码注释被用来掩盖程序的底层错误。根结底，注释应该支持你的代码，而不是试图隐藏沟通不畅。值得提醒自己的是，如果代码写得糟糕，无论增加多少注释都无法解决问题。\n\
    \n通过为变量、函数和集合分配直观的名字，可以保持每行之前的注释保持简单。你的注释很少长于它们所支持的代码。如果你发现自己花费了太多的时间和空间来解释你做了什么，那么你需要回回重新设计以获得更清晰的代码。此外，使用直观的命名规范并移除所有不必要的注释可以有助于减少代码的整体长度。\n\
    \n### 避免粗俗的注释\n\n在人生的某个阶段，你很可能会参与一个开发团队项目。当几个人都在编写同一段代码时，通常会鼓励其他人来审查你目前编写的内容，并提供诚实的反馈。不时务日，你可能会目睹某人胆敢添加如下这样的注释：\n\
    \n简单来说，这样做不好。即使这是你朋友的代码，而且你确定他们不会因此被犯，这仍然是不可接受的。你不知道哪些碎片会泄露到生产环境中，如果你的客户在未来的某时刻意外发现了它，会是什么样子。在注释中包含不雅和粗俗的词汇并不是表现专业的做法。\n\
    \n谈到专业开发者的伦理，值得提到的是，总部位于美国的技术机构和公司（工程师、设计师和业务高管）正在选择签署“不再（The Never Again）”誓，以建立团结并为\
    \ IT 基础设施建立基本规则。通过签署该誓，他们承诺：\n\n*   我们拒绝参与为美国政府创建身份信息数据库，以便根据种族、宗教或国籍针对特定个人。\n\
    *   我们将在组织内部倡导：\n    *   减少收集和保留可能导致种族或宗教针对的数据。\n    *   缩小包含不必要的种族、民族和国籍数据的现有数据集。\n\
    \    *   负责任地销毁高风险数据集和备份。\n    *   实施安全和隐私最佳实践，特别是尽可能将端到端加密作为默认设置。\n    *   如果政府要求我们移交组织收集的用户数据（即使数量很小），我们将要求履行正当的法律程序。\n\
    *   如果我们在组织内部发现了我们认为非法或不伦理的数据滥用行为：\n    我们将与同事和领导合作纠正这一行为。\n*   如果我们无法停止这些行为，我们将行使我们的权利和责任公开发声，并进行负责任的举报，而不危及用户。\n\
    *   如果我们有权这样做，我们将使用所有可用的法律防御来阻止这些行为。\n*   如果我们没有此类权限，而我们的组织强迫我们参与此类滥用，我们将辞职而不是顺从。\n\
    *   我们将在组织和行业之外，对数据和算法的负责且公平的使用提高意识并提出关键问题。\n\n## 如何练习注释？\n\n开始编写更多符合 Python 风格注释的最简单方法就是直接动手。\n\
    \n你可以开始在自己的代码中为自己编写注释。从现在起，在合适的地方包含简单的注释视为一项任务。看看这是否为复杂函数增加了更多清晰度，并尝试在所有脚本的顶部添加文档字符串（docstring）。另一个很好的练习方法是回过审查你之前编写的任何旧代码。观察哪里可能不符合逻辑，并清理代码。如果它仍然需要额外的解释，你可能想添加一条快速注释来帮助澄清代码的主要解决方案。\n\
    \n如果你的代码托管在 GitHub 这样的软件开发和版本控制平台托管提供商上，这将是一个特别好的主意。尝试审查你的旧作品，并通过引导他们了解已经完成的内容来帮助他人。\n\
    \n使用同一个平台，你还可以通过注释他人的代码向社区做出贡献。如果你发现从 GitHub 下载了某些东西，后来在处理时遇到困难，可以在理解如何优化每段代码时添加注释。完成后，你只需用你的首字母和日期签名，然后将更改作为拉请求（pull\
    \ request）提交。如果你的更改被合并，你可能帮助了数十甚至上百个像你这样的开发者获得项目的更好版本。\n\n总结来说，学习良好的注释应该被视为一种极具价值的工具。你不仅可以学习通用的写得更清晰、更简洁，而且无疑也会对\
    \ Python 有更深入的理解。知道如何在 Python 中编写注释可以让许多开发者的生活变得更容易，从你自己开始。位置恰当的注释可以帮助解释代码的功能，并帮助你重新熟悉你自己的旧代码。\n\
    \n"
- fmt: "\nIn order to write a docstring correctly, it is recommended to follow the\
    \ official Python convention. In this case, `PEP 257` – Docstring Convention written\
    \ by David Goodger and Guido van Rossum himself, would be a great guideline to\
    \ reflect upon. The aim of this PEP is to “standardize the high-level structure\
    \ of docstrings: what they should contain, and how to say it.”[⁴](#chapter3.xhtml_fn3_4)\n\
    \n### Single-Line Docstrings\n\nDue to Python simplicity, the docstring comes\
    \ as a single-line comment. However, keep in mind to start the text of a docstring\
    \ with a capital letter, and end it with a period. Based on the trend that code\
    \ is typically read more often than it is written, it is highly advised to describe\
    \ what the documented structure does as a command, instead of explaining how it\
    \ is done. Additionally, mentioning which kind of value is returned to the caller\
    \ would also help to understand the result of the function or method.\n\nAnd in\
    \ regards to double-quotes, as long as both the beginning and the end quotes are\
    \ similar, Python is quite progressive, and you are allowed to use three single\
    \ quotes as well as three double-quotes. You just need to make sure that the closing\
    \ quotes are in the same line as with the opening quotes. Besides, there is no\
    \ need to add any empty lines before, or after the text of the docstring.\n\n\
    ### Multi-line Docstrings\n\nMoreover, a docstring can as well be written as a\
    \ multi-line comment. If you choose to use multi-line comments, two things are\
    \ going to change – the encapsulation of the docstring would be written in triple\
    \ single- or double-quotes, and the structure of the docstring itself would get\
    \ a deeper meaning assigned to the entire text.\n\nThe docstring of a script documents\
    \ the script's function and command-line syntax together with other variables\
    \ and files. You are allowed to be fairly elaborate (several screens full) when\
    \ applying this docstring but at the same time make it as sufficient as possible\
    \ for a new user to operate the command properly. It is also required to complete\
    \ a quick reference to all options and arguments for an expert user.\n\nThe docstring\
    \ for a module should typically list the classes, exceptions, and functions that\
    \ are requested by the module, with a one-line summary of each. At the same time,\
    \ docstring for a package `__init__.py` module is also expected to list the modules\
    \ and sub-packages exported by the package.\n\nThe docstring for a function or\
    \ method should summarize its behavior and list its return values, side effects,\
    \ exceptions raised, and restrictions on when it can be applied. Optional arguments\
    \ should be indicated, and keyword arguments that are part of the interface must\
    \ be documented.\n\nThe docstring for a class should outline its behavior and\
    \ list the public methods and other variables. If the class is supposed to be\
    \ subclassed and has an additional interface for subclasses, this interface should\
    \ be listed in the separate docstring. And, the class constructor should be documented\
    \ in the docstring for its `__init__` method.\n\nIf a class subclasses another\
    \ class and its behavior is mostly obtained from that class, its docstring should\
    \ mention this and outline the differences. You can use the verb \"override\"\
    \ to indicate that a subclass method replaces a superclass method. And in addition\
    \ to that, you can apply the verb \"extend\" to indicate that a subclass method\
    \ calls the superclass method.\n\n### Docstring Formats\n\nWhen it comes to docstrin\
    \ formats, there is not just one binding setup. To be clear, there is more than\
    \ one, and all of these format variants are compatible with multi-line docstrings.\n\
    \n*   **reStructured Text (reST)/Sphinx:** This is considered to be the Official\
    \ Python documentation standard that uses the syntax of the lightweight markup\
    \ language reStructured text (reST).\n*   **Google Docstrings:** Google's style\
    \ of docstring.\n*   **NumPy/SciPy Docstrings:** A combination of reStructured\
    \ text (reST) and Google Docstrings.\n\nAt the same time, there is a number of\
    \ tools that auto-generate documentation and HTML documents from docstrings, such\
    \ as `Sphinx`, `Epydoc`, `Doxygen`, `PyDoc`, `pdoc`, and the `autodoc` extension\
    \ for `Sphinx`.\n\n`PyDoc`, for instance, is a part of the Python distribution\
    \ that gathers information about a module for the console, a web browser, or as\
    \ an HTML document. In order to learn more about its module, function, class,\
    \ or method, try looking inside the Python shell and using the `help()` function.\n\
    \nAs mentioned earlier, `Sphinx` is the official Python documentation standard\
    \ that is also used as a default generator for JetBrains’ `PyCharm` integrated\
    \ development environment. Basically, `Sphinx` style utilizes the syntax of a\
    \ lightweight markup language reStructuredText (reST), designed to be both processable\
    \ by documentation-processing software such as `Docutils`; and to remain easily\
    \ accessible by human developers who are reading and writing Python source code.\n\
    \nFollowing `PEP 257` guidelines for documentation is going to help you to understand\
    \ the source code. And by applying the `Sphinx` tool, you would be able to automatically\
    \ generate documentation from the docstrings in your code. Below we offer a simple\
    \ step-by-step guide on how to easily auto-generate clean and well-organized documentation\
    \ from Python code using `Sphinx`.\n\n1.  **Install Sphinx:** You can install\
    \ `Sphinx` directly from a clone of the Git repository – [https://github.com/sphinx-doc/sphinx](https://github.com).\
    \ You can do it either by cloning the repo and installing from the local clone,\
    \ on simply installing directly via git:[⁵](#chapter3.xhtml_fn3_5)\n\n2.  **Initialize\
    \ the Sphinx Configuration:** In the root directory of your project, start `sphinx-quickstart`\
    \ in order to initialize the sphinx source directory that enables a default configuration.\
    \ Running this command will prompt you to fill out some basic configuration properties\
    \ such as creating separate source and building directories, as well as indicating\
    \ the project name, author name, and project version.\n\n3.  **Update the conf.py\
    \ File:** The `conf.py` file located in the source folder describes the Sphinx\
    \ configuration and controls how Sphinx builds the documentation. If you want\
    \ to modify the theme, version, or module directory, you will need to insert these\
    \ changes here. Below are a few standard overrides:\n\n    *   **Updating the\
    \ Theme:** If you want to change the default theme for `sphinx` which is `alabaster`,\
    \ you will find many other themes to choose from, and it is even possible to create\
    \ your own. One of the popular themes is `sphinx_rtd_theme`, which is a modern\
    \ and mobile-friendly theme. In order to install `sphinx_rtd_theme`, you will\
    \ need to install the `sphinx-rtd-theme` Python package by running `pip install\
    \ sphinx-rtd-theme` in the terminal.\n    *   **Adding Extension Support for Autodoc:**\
    \ The `extensions` variable is assigned to a list of extensions needed to build\
    \ the documentation. For instance, if you’re planning to include documentation\
    \ from your doc using the `autodoc` directives, you will have to activate it by\
    \ adding `sphinx.ext.autodoc` to the extension list. And if the documentation\
    \ in your code follows the Google Python Style Guide, you will be expected to\
    \ append `sphinx.ext.napoleon` to the extensions list.\n\n    In addition to that,\
    \ during each new Sphynx version release, it is recommended to update the documentation\
    \ version to point to the project release version, either manually or using an\
    \ automated process.\n"
  raw: "In order to write a docstring correctly, it is recommended to follow the official\
    \ Python convention. In this case, PEP 257 – Docstring Convention written by David\
    \ Goodger and Guido van Rossum himself, would be a great guideline to reflect\
    \ upon. The aim of this PEP is to *“*standardize the high-level structure of docstrings:\
    \ what they should contain, and how to say it.”[⁴](#chapter3.xhtml_fn3_4)\n\n\
    ### Single-Line Docstrings\n\nDue to Python simplicity, the docstring comes as\
    \ a single-line comment. However, keep in mind to start the text of a docstring\
    \ with a capital letter, and end it with a period. Based on the trend that code\
    \ is typically read more often than it is written, it is highly advised to describe\
    \ what the documented structure does as a command, instead of explaining how it\
    \ is done. Additionally, mentioning which kind of value is returned to the caller\
    \ would also help to understand the result of the function or method.\n\nAnd in\
    \ regards to double-quotes, as long as both the beginning and the end quotes are\
    \ similar, Python is quite progressive, and you are allowed to use three single\
    \ quotes as well as three double-quotes. You just need to make sure that the closing\
    \ quotes are in the same line as with the opening quotes. Besides, there is no\
    \ need to add any empty lines before, or after the text of the docstring.\n\n\
    ### Multi-line Docstrings\n\nMoreover, a docstring can as well be written as a\
    \ multi-line comment. If you choose to use multi-line comments, two things are\
    \ going to change – the encapsulation of the docstring would be written in triple\
    \ single- or double-quotes, and the structure of the docstring itself would get\
    \ a deeper meaning assigned to the entire text.\n\nThe docstring of a script documents\
    \ the script's function and command-line syntax together with other variables\
    \ and files. You are allowed to be fairly elaborate (several screens full) when\
    \ applying this docstring but at the same time make it as sufficient as possible\
    \ for a new user to operate the command properly. It is also required to complete\
    \ a quick reference to all options and arguments for an expert user.\n\nThe docstring\
    \ for a module should typically list the classes, exceptions, and functions that\
    \ are requested by the module, with a one-line summary of each. At the same time,\
    \ docstring for a package __init__.py module is also expected to list the modules\
    \ and sub-packages exported by the package.\n\nThe docstring for a function or\
    \ method should summarize its behavior and list its return values, side effects,\
    \ exceptions raised, and restrictions on when it can be applied. Optional arguments\
    \ should be indicated, and keyword arguments that are part of the interface must\
    \ be documented.\n\nThe docstring for a class should outline its behavior and\
    \ list the public methods and other variables. If the class is supposed to be\
    \ subclassed and has an additional interface for subclasses, this interface should\
    \ be listed in the separate docstring. And, the class constructor should be documented\
    \ in the docstring for its __init__ method.\n\nIf a class subclasses another class\
    \ and its behavior is mostly obtained from that class, its docstring should mention\
    \ this and outline the differences. You can use the verb *\"*override*\"* to indicate\
    \ that a subclass method replaces a superclass method. And in addition to that,\
    \ you can apply the verb *\"*extend*\"* to indicate that a subclass method calls\
    \ the superclass method.\n\n### Docstring Formats\n\nWhen it comes to docstrin\
    \ formats, there is not just one binding setup. To be clear, there is more than\
    \ one, and all of these format variants are compatible with multi-line docstrings.\n\
    \n*   **reStructured Text (reST)/Sphinx:** This is considered to be the Official\
    \ Python documentation standard that uses the syntax of the lightweight markup\
    \ language reStructured text (reST).\n\n*   **Google Docstrings:** Google's style\
    \ of docstring\n\n*   **NumPy/SciPy Docstrings:** A combination of reStructured\
    \ text (reST) and Google Docstrings.\n\nAt the same time, there is a number of\
    \ tools that auto-generate documentation and HTML documents from docstrings, such\
    \ as Sphinx, Epydoc, Doxygen, PyDoc, pdoc, and the autodoc extension for Sphinx.\n\
    \nPyDoc, for instance, is a part of the Python distribution that gathers information\
    \ about a module for the console, a web browser, or as an HTML document. In order\
    \ to learn more about its module, function, class, or method, try looking inside\
    \ the Python shell and using the help() function.\n\nAs mentioned earlier, Sphinx\
    \ is the official Python documentation standard that is also used as a default\
    \ generator for JetBrains’ PyCharm integrated development environment. Basically,\
    \ Sphinx style utilizes the syntax of a lightweight markup language reStructuredText\
    \ (reST), designed to be both processable by documentation-processing software\
    \ such as Docutils; and to remain easily accessible by human developers who are\
    \ reading and writing Python source code.\n\nFollowing PEP 257 guidelines for\
    \ documentation is going to help you to understand the source code. And by applying\
    \ the Sphinx tool, you would be able to automatically generate documentation from\
    \ the docstrings in your code. Below we offer a simple step-by-step guide on how\
    \ to easily auto-generate clean and well-organized documentation from Python code\
    \ using Sphinx.\n\n1.  **Install Sphinx:**\n\n    You can install Sphinx directly\
    \ from a clone of the Git repository – [https://github.com/​sphinx-doc/​sphinx](https://github.com).\
    \ You can do it either by cloning the repo and installing from the local clone,\
    \ on simply installing directly via git:[⁵](#chapter3.xhtml_fn3_5)\n\n2.  **Initialize\
    \ the Sphinx Configuration:**\n\n    In the root directory of your project, start\
    \ sphinx-quickstart in order to initialize the sphinx source directory that enables\
    \ a default configuration. Running this command will prompt you to fill out some\
    \ basic configuration properties such as creating separate source and building\
    \ directories, as well as indicating the project name, author name, and project\
    \ version.\n\n3.  **Update the conf.py File:** The conf.py file located in the\
    \ source folder describes the Sphinx configuration and controls how Sphinx builds\
    \ the documentation. If you want to modify the theme, version, or module directory,\
    \ you will need to insert these changes here. Below are a few standard overrides:\n\
    \n    *   **Updating the Theme:** If you want to change the default theme for\
    \ sphinx which is alabaster, you will find many other themes to choose from, and\
    \ it is even possible to create your own. One of the popular themes is sphinx_rtd_theme,\
    \ which is a modern and mobile-friendly theme. In order to install sphinx_rtd_theme,\
    \ you will need to install the sphinx-rtd-theme Python package by running pip\
    \ install sphinx-rtd-theme in the terminal.\n\n    *   **Adding Extension Support\
    \ for Autodoc:** The extensions variable is assigned to a list of extensions needed\
    \ to build the documentation. For instance, if you’re planning to include documentation\
    \ from your doc using the autodoc directives, you will have to activate it by\
    \ adding sphinx.ext.autodoc to the extension list. And if the documentation in\
    \ your code follows the Google Python Style Guide, you will be expected to append\
    \ sphinx.ext.napoleon to the extensions list.\n\n        In addition to that,\
    \ during each new Sphynx version release, it is recommended to update the documentation\
    \ version to point to the project release version, either manually or using an\
    \ automated process."
