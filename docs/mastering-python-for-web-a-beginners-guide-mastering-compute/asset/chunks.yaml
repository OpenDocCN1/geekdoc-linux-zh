  trans: '


    官方安装程序和 Homebrew 包管理器都是非常好用的工具，但 Python 软件基金会（Python Software Foundation）仅支持官方安装程序。由于通过官方安装程序和
    Homebrew 包管理器安装的发行版本并不相似，因此从 Homebrew 安装会有一些局限性。


    Homebrew 上的 macOS Python 分发版不包含标准 Python 接口 `Tkinter` 模块所需的 Tcl/Tk 依赖项。`Tkinter`
    是 Python 中开发 GUI 的标准库模块，也是 Tk GUI 工具包的接口。由于 Homebrew 不会安装 Tk GUI 工具包依赖项，它仍然依赖于系统中已安装的现有版本。系统的
    Tcl/Tk 版本可能已经过时，最终可能会阻止你导入 `Tkinter` 模块。


    Homebrew 包管理器是一种非常流行的方法，因为 Homebrew 是一个命令行工具，可以通过基本脚本进行自动化处理。此外，许多人倾向于在 macOS
    上安装 Python，因为它易于从命令行进行管理，且不需要访问网站即可轻松升级。与此同时，Homebrew 提供的 Python 分发版不受 Python
    软件基金会的支持，因此并非完全可靠。在 macOS 上最安全的方法仍然是使用官方安装程序，特别是如果你需要使用 `Tkinter` 进行 Python GUI
    编程时。


    ### 如何从官方安装程序安装


    如前所述，从官方安装程序安装 Python 是 macOS 上最可靠的安装方法。它提供了开发 Python 应用所需的所有系统依赖项。你可以通过两个简单的步骤从官方安装程序进行安装。


    #### 步骤 1：按照以下步骤下载官方安装程序：


    1. 打开浏览器并导航到 [Python.org](http://Python.org) 的 macOS 下载页面。

    2. 在“Python Releases for Mac OS X”标题下，点击 `Latest Python 3 Release`。截至目前，最新版本是
    Python 3.9.2。

    3. 滚动到底部并点击 `macOS 64-bit installer` 开始下载。


    #### 步骤 2：双击下载的文件运行安装程序。你应该看到以下窗口：


    1. 一直按下 `Continue` 直到提示你同意软件许可协议。然后点击 `Agree`。

    2. 随后你将看到一个窗口，告知你安装位置并询问想要占用多少空间。你可能不需要更改默认位置，因此点击 `Install` 继续并开始安装。

    3. 当安装程序完成文件复制后，点击 `Close` 关闭安装程序窗口。


    ### 如何从 Homebrew 安装


    对于需要从命令行安装、且不需要使用 `Tkinter` 模块开发 GUI 的用户，Homebrew 包管理器是一个完美的选择。你可以通过两个步骤从 Homebrew
    包管理器安装。


    #### 步骤 1：按照此程序安装 Homebrew（如果你已经安装了 Homebrew，可以跳过此步骤）：


    1. 打开浏览器并访问 [`brew.sh/`](http://brew.sh)

    2. 你应该会在页面顶部“Install Homebrew”标题下方看到安装 Homebrew 的命令。

    3. 用光标选中此命令并按 `Cmd+C` 将其拷贝到剪贴板。

    4. 打开终端窗口并粘贴命令，然后按 `Enter`。这样你就启动了 Homebrew 的安装。

    5. 在提示时输入你的 macOS 用户密码。


    可能需要几分钟时间来下载 Homebrew 所需的所有文件，完成后，你将回到终端窗口的 shell 提示符处。如果你是第一次在 macOS 上执行此操作，可能会弹出一个警告框，要求你安装
    Apple 的命令行开发者工具。这些工具是安装的前决条件，因此你需要点击 `Install` 确认对话框。开发者工具安装后，你应该按 `Enter` 继续安装
    Homebrew。一旦 Homebrew 安装完成，你就可以准备好安装 Python 了。


    #### 步骤 2：按照以下步骤安装 Python：


    1. 打开终端应用程序。

    2. 输入以下命令升级 Homebrew：

    ```bash

    brew update && brew upgrade

    ```

    这将在你的电脑上下载并设置最新版本的 Python。你可以通过终端进行测试，以确保一切运行正常：


    1. 打开终端。

    2. 输入 `pip3` 并按 `Enter`。

    3. 你应该能看到来自 Python `pip` 包管理器的文本。如果你在运行 `pip3` 时遇到错误信息，应该重新执行安装步骤，确保你没有漏掉任何步骤。


    ## 如何在 LINUX 上安装 Python


    在本节中，你将学习 Linux 上的 Python 安装方法，并希望你能够独立完成。通常情况下，许多 Linux 发行版已经预装了 Python，但可能不是最新版本，甚至可能是
    Python 2 而不是 Python 3。你需要自行检查版本以确保无误。要找出你拥有哪个版本的 Python，请打开终端窗口并尝试以下命令：


    如果你的电脑上已经安装了 Python，那么其中一个或多个命令应该会显示版本号。通常，在 Linux 上有两种方便且相对快速的方法安装官方 Python 发行版：


    1. **从包管理器安装：** 这是大多数 Linux 发行版上流行的安装方法。它需要从命令行运行一条命令。

    2. **从源码构建：** 这种方法比使用包管理器更复杂。它涉及从命令行运行一系列命令，同时确保你已安装了正确的依赖项以完成 Python 源码编译。


    遗憾的是，并不是每个 Linux 发行版都有包管理器，也不是每个包管理器都包含 Python。根据你的操作系统，从源码构建 Python 可能是你的唯一选择。你将使用哪种安装方法主要取决于你的
    Linux OS 是否有包管理器，以及你是否想控制安装细节。


    直到为止，在 Linux 上安装 Python 最流行的方法是使用操作系统的包管理器。这被许多专家开发者认为是默认选择。然而，取决于你使用的 Linux 发行版，Python
    可能无法通过包管理器获取。在这种情况下，你将从源码构建 Python。


    有三个可能限制你选择从源码构建 Python 的主要原因：


    1. 你无法从操作系统的包管理器下载 Python。

    2. 如果你可能需要降低嵌入式系统上的内存占用，你将希望控制 Python 的编译方式。

    3. 你希望在最新最先进版本发布之前对其进行测试版和发布候选版本的测试。


    要在你的 Linux 机器上完成安装，请在下方找到你的 Linux 发行版并按照提供的步骤操作。


    ### 如何在 Ubuntu 和 Linux Mint 上安装


    取决于你所使用的 Ubuntu 发行版版本，在系统中配置 Python 的过程会有所不同。你可以通过以下命令确定本地 Ubuntu 版本：


    根据控制台输出中 Release 标题下的版本号遵循相应的指南：


    * **Ubuntu 18.04, Ubuntu 20.04 及以上：** Ubuntu 18.04 及以上版本默认没有 Python 3.9，但在 Universe
    仓库中可用。要安装 3.9 版本，你需要打开终端应用程序并输入以下命令：


    ```bash

    sudo apt-get update

    sudo apt-get install python3.9 python3-pip

    ```


