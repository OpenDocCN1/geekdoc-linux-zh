    \ the trailing characters specified as argument.\n- `string.splitlines()`: Splits\
    \ the string at line boundaries and returns a list of lines in the string.\n-\
    \ `string.startswith()`: Returns True if a string starts with the specified prefix.\
    \ If not, it returns False.\n"
