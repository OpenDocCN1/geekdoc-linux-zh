  trans: "\n\n## 4. 自动生成 rst 文件\nSphinx 从 reStructuredText (`rst`) 文件生成 HTML 文档。这些\
    \ `rst` 文件定义了每个网页并可能包含 `autodoc` 指令，该指令用于从 docstring（文档字符串）自动生成文档。由于有自动生成这些文件的方法，因此无需为每个类和模块手动输入并记录\
    \ `autodoc` 指令。预期 `sphinx-autodoc` 命令会自动从代码生成带有 `autodoc` 指令的 `rst` 文件。只有在向项目中添加新模块时才需要运行此命令。\n\
    \n## 5. 构建 HTML\n在完成配置和 `rst` 文件设置后，你应该能够在主目录的终端中运行 `make HTML` 命令来生成 HTML 文件。HTML\
    \ 文件将创建在 `build/HTML` 文件夹中。\n\n## 6. 高级 Sphinx 项目\n请注意，还有额外的 Sphinx 指令可以帮助你的文档看起来和感觉更现代、更有组织。以下是一些对你进一步定制文档非常有用的功能。所有示例都是使用\
    \ `sphinx_rtd_theme` 生成的：\n\n1. **目录**：Sphinx 使用一种名为 `toctree` 的自定义指令来以列表或目录的形式描述不同文件之间的关系。\n\
    2. **警告框**：可以使用 `warning` 指令应用警告框。\n   例如：`. . warning:: This is a warning box.`\n\
    3. **图像**：可以使用 `image` 指令添加图像项。\n4. **表格**：因此，可以使用 `table` 指令添加表格。\n![一个由许多行代码组成的锯齿形向上箭头。](img/fig3_3.jpg)\n\
    \n# 通过 docstring 编写文档\n\nPython 的文档长期以来被认为是免费编程语言中最好的。其原因在于 Python 创始人 Guido van\
    \ Rossum（吉多·范·罗索姆）早期就承诺向用户社区提供语言及其库的文档。这样他们就能积极参与到 Python 文档的持续投入、创建和维护中。\n\n\
    直到今天，社区的参与形式多种多样，从修改错误报告到在文档可以更精炼或更易用时进行纯粹的批评。\n\n此外，还有一个完整的 Python 增强提案 (PEPs)\
    \ 索引，分为以下几类：Meta-PEPs（关于 PEP 或流程的 PEP）、其他信息性 PEP、临时性 PEP（临时接受；接口可能仍会更改）、已接受 PEP（已接受；可能尚未实现）、开放\
    \ PEP（正在考虑中）、已完成 PEP（已完成，具有稳定接口）、历史性 Meta-PEPs 和信息性 PEP、延迟 PEP（等待进一步研究或更新而延迟），最后是已弃、已撤回和被拒绝的\
    \ PEP。\n\n这些文档面向 Python 文档的作者和潜在作者。更具体地说，它是为了向标准文档做贡献的用户，以及使用与标准文档相同的工具开发额外文档的用户准备。\n\
    \n如果你对贡献 Python 文档感兴趣，但没有时间学习所有与文本数据格式和技术文档格式相关的 PEP —— 即 reStructuredText，那么你可以在本节中进一步查找。我们将简要介绍文档概念和语法，旨在为作者提供足够的信息，以便高效地编写文档。\n\
    \n### 段落\n段落是 reST 文档中最基本的语句块。它们仅仅是由于一个或多个空行分隔的文本部分。在 Python 中，缩进至关重要，因此同一段落的所有行都应该左对齐到相同的缩进层级。\n\
    \n### 内联标记\n标准的 reST 内联标记非常直观：\n\n### 章节\n章节标题通过使用标点符号在标题下方下划线或上方加线来创建。通常，不应为某些字符分配标题级别，因为结构是由标题的顺序决定的。但对于\
    \ Python 文档，有一个建议的约定：\n\nSphinx 为标准 reST 标记带来了许多新的指令和解释性文本角色（interpreted text\
    \ roles）。本节包含这些设施的参考材料。然而，这些材料应被视为 Sphinx 扩展标记能力的概述。完整内容可以在 Python PEP 文档中找到。\n\
    \n### 元信息标记\n本节将描述的标记用于提供有关被记录的模块的信息。请注意，每个模块都应该在自己的文件中进行记录。\n\n`sectionauthor`\n\
    代表当前章节的作者。该元素应包含作者姓名，以便用于展示和电子邮件地址。地址的域名部分应用小写。例如：\n\n`module`\n此标记代表模块、包或子模块描述的开始。名称应该是完全限定的并具有简短的标识符；正在使用的示例包括“IRIX”、“Mac”、“Windows”和“Unix”。使用\
    \ synopsis 选项是非常重要的，它通常由一个描述模块目的的单句子组成——它目前仅用于全局模块索引（Global Module Index）。\n\n\
    `moduleauthor`\n`moduleauthor` 指令可以出现多次，用于命名特定模块代码的作者，就像 `sectionauthor` 命名文档作者一样。它同样不会产生任何输出。\n\
    \n此外，使描述模块的文件章节标题具有意义将是有益的，因为该值将插入到概述文件的目录中。\n\n### 信息单元\n有多种指令用于描述模块提供的特定功能。每个指令需要一个或多个签名（signature）来提供关于描述内容的基本信息，内容应该是描述。标准版本会在通用索引中创建条目。然而，如果不需要索引条目，可以赋予选项标记\
    \ `noindex`。以下示例了该指令类型的所有功能：\n\n`c:function`\n描述一个 C 函数。签名应该像 C 一样给出，例如：\n\n你不需要对签名中的星号进行反斜杠转义；应该给出参数名称，以便在描述中使用。\n\
    \n`c:member`\n描述一个 C 结构体成员。确保描述文本包含允许的值范围、如何解释该值以及该值是否可以更改。文中对结构成员的引用可以使用成员角色（member\
    \ role）。\n\n`c:macro`\n代表“简单”C 宏。澄清一下，简单宏是用于代码扩展的宏，但不接受参数，因此不能描述为函数。这不用于简单的常数定义。\n\
    \n`c:type`\n描述一个 C 类型。签名应为类型名称。\n\n`c:var`\n描述一个全局 C 变量。签名也可以包含类型，例如：\n\n`data`\n\
    代表模块中的全局数据，同时使用变量和值作为“定义常量”。请注意，类和对象属性不使用此指令记录。\n\n`exception`\n刻画异常类。此签名可以包含带有构造函数参数的括号。\n\
    \n`function`\n描述带有参数的模块级函数，可选参数放在方括号中。如果这有助于提高清晰度，可以给出默认值。例如：\n\n"
