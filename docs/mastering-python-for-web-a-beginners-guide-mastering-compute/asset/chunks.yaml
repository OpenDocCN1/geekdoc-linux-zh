    Python 中的名称（Names）既指对象，也指名称绑定操作。以下项可以被称为名称：函数的形式参数、导入语句、类和函数定义，或定义块中的函数名。如果出现在赋值语句中，它还会绑定作为标识符的目标，以及导入的模块中定义的所有名称（但以下划线开头的名称以及在模块级别使用的名称除外）。出现在
    `del` 语句中的目标也被视为已绑定的。在模块级别由类定义或函数定义定义的块内发生的每个赋值或导入语句也是如此。


    模块代码块的变量可以被视为局部的或全局的。如果一个名称在块中被绑定，则它是该块的局部变量，除非被声明为 `nonlocal` 或 `global`。如果一个名称在模块级别被绑定，则它是一个全局变量。如果一个变量在代码块中使用但在那里没有定义，则它被视为自由变量（free
    variable）。程序文中名称的每次出现都根据以下名称解析规则来引用该名称的绑定。


    ## 作用域与名称解析


    作用域（Scope）定义了名称在块内的可见性。如果块中定义了局部变量，其作用域包含该块。如果定义涉及函数块，则作用域将扩展到定义块包含的任何块，除非被包含的块为该名称引入了单独的绑定。当名称被添加到代码块时，它会在最近的闭包作用域中进行解析。代码块可见的所有此类作用域的集合被称为该块的环境（environment）。如果完全找不到名称，则会抛
    `NameError` 异常。如果当前作用域是函数作用域，且该名称指向在名称使用点尚未绑定到值的局部变量，则会继出现 `UnboundLocalError`
    异常。`UnboundLocalError` 被视为 `NameError` 的子类。


    因此，如果名称绑定操作发生在代码块内的任何地方，则块内对该名称的所有应用都将被视为对当前块的引用。这可能在名称在块内绑定之前被使用时导致错误。由于 Python
    缺乏声明，允许在代码块中的任何地方发生名称绑定操作。代码块的局部变量可以通过扫描块的整个文本来查找名称绑定操作并定义。


    ## 全局与非本地


    如果在块内出现 `global` 语句，则语句中指定的名称的所有使用都指向顶层命名空间中的名称绑定。在顶层命名空间中通过查找全局命名空间来解析名称，即包含该代码块信息的模块命名空间——构建在命名空间中以及构建在函数模块命名空间中。通常，首先搜索全局命名空间，只有在未找到名称时，才会搜索内置命名空间。`global`
    语句确保了名称的所有使用。


    `global` 语句定位的作用域与同一块中名称绑定操作的作用域相同。如果自由变量的最近闭包作用域包含 `global` 语句，则该自由变量被视为全局变量。相反，`nonlocal`
    语句导致相应的名称指向最近闭包函数作用域中之前绑定的变量。如果给定的名称未在任何闭包函数作用域中显示，可能会在编译时出现 `SyntaxError`。


    ## 命名空间与内置


    模块的命名空间（Namespace）在模块第一次被导入时自动创建。脚本的主模块始终被称为 `__main__`。类定义块以及 `exec()` 和 `eval()`
    的参数在名称解析的上下文中是重要的。类定义是一个可应用的语句，可以使用并定义名称。这些引用按照标准的名称解析规则组织，但未绑定的局部变量被包含在全局命名空间中。类定义的命名空间变成该类的属性字典。在类块中定义的名称的作用域仅限于该类块，这意味着它不会扩展到方法的代码块——这仅包括推导式和生成器表达式，因为它们是使用函数作用域执行的。


    `builtins` 命名空间通常与代码块的执行相关，可以通过在其全局命名空间中搜索名称 `__builtins__` 找到。这应该是一个字典或模块，在默认情况下，在
    `__main__` 模块中，内置模块被设置为 `__builtins__`；而在任何其他模块中，`__builtins__` 则作为内置模块本身字典的别名存在。此外，`__builtins__`
    可以设置为用户创建的字典，以补偿较弱的受限执行形式。另一点是，用户不应该处理 `__builtins__`，因为它被认为是严格的实现实现细节。想要修改内置命名空间中值的用户应该导入
    `builtins` 模块并恰当地优化其属性。


    ## 动态特性


    关于名称与动态特性的交互，自由变量的名称解析应该在运行时发生，而不是在编译时发生。在某些情况下，当 Python 语句与包含自由变量的嵌套作用域一起使用时是不被允许的。当变量在闭包作用域中被引用时，禁止删除该名称，并在编译时报告错误。


    `eval()` 和 `exec()` 函数无法访问用于解析名称的全环境。名称可以在调用者的局部和全局命名空间中解析。`exec()` 和 `eval()`
    函数有可选参数来覆盖全局和局部命名空间。如果只指定一个命名空间，则两者都使用。此外，自由变量不在最近的闭包命名空间中解析，而是在全局命名空间中解析。


    ## 异常


    在分析 Python 执行模型时，关注异常也很。异常是一种极好的系统技巧，通过跳出代码块的控制流来管理错误或其他异常情况。异常仅在检测到错误的地方发生。它可以由周围的代码块处理，也可以由任何直接或间接触发错误发生代码块的块块处理。


    当 Python 解释器检测到运行时错误时，用异常做出响应。Python 程序可以使用 `raise` 语句显式调用异常。此类语句的最后一个子句可指定清理代码，这些代码不处理异常，但无论之前的代码是否发生异常都会执行。


    Python 还使用错误的“终止”模型：异常处理器可以轻松检测发生了什么并在外部层级继续执行，但不能期望它能修复错误原因并重试失败的操作。当异常完全未被处理时，解释器将关闭程序执行或返回其交互式主循环。


    异常通过类实例严格识别。`except` 子句根据实例的类进行选择：它必须处理实例的类或基类。处理器可以接收实例，并可能携带有关异常状况的附加信息。

