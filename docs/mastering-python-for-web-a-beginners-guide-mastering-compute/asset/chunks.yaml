    通过使用 `nonlocal var` 语句，你告诉 Python 你需要在 `nested()` 内部修改 `var`。然后，你使用复合赋值操作来实现 `var`
    的修改。这一变化体现在 `nonlocal` 变量 `var` 中，它现在的值为 `100`。与 `global` 不同，你无法在嵌套或闭包函数之外应用 `nonlocal`。更直接地说，你不能在全局作用域或局部作用域中使用
    `nonlocal` 语句。举例说明如下：


    起初，你尝试在 Python 的全局作用域中使用 `nonlocal` 语句，但由于 `nonlocal` 仅在内部或嵌套函数中起作用，你最终得到了一个 `SyntaxError`，提示你不能在模块作用域中应用
    `nonlocal`。关于 `nonlocal` 语句操作的深度信息，可以在 `PEP 3104 – Access to Names in Outer Scopes`
    中找到。


    与 `global` 不同，你不能使用 `nonlocal` 来创建延迟的非局部变量。如果你想将它们作为 `nonlocal` 变量应用，它们应该已经存在于闭包
    Python 作用域中。这意味着你不能通过在嵌套函数中的 `nonlocal` 语句中声明它们来管理非局部变量。看下面的代码示例：


    通过这个示例可以看出，当你尝试使用 `nonlocal lazy_var` 定义非局部变量时，Python 会立即抛出 `SyntaxError`，因为 `lazy_var`
    在 `nested()` 的嵌套作用域中并未执行。


    ### 使用嵌套作用域作为闭包


    闭包是 Python 嵌套作用域的一个特定用例。当你将嵌套函数处理数据时，创建该函数的语句将与实现它的环境放在一起。生成的项被称为闭包。准确地说，闭包是一个包含其外层作用域（enclosing
    scope）数据的内部或嵌套函数，即使该作用域已经完成了执行。此外，闭包还提供了一种在函数调用之间保持状态信息的方法。如果你需要基于延迟或异步评估的概念编写代码，这会特别有用。


    有些人还把这种函数称为工厂、工厂函数或闭包工厂，以指定该函数是构建并返回闭包，而不是类或实例。


    ### 通过导入将名称引入作用域


    在编写 Python 程序时，通常从将代码组织成几个模块开始。为了管理你的程序，你需要将那些独立模块中的名称引入你的 `__main__` 模块。要做到这一点，你应该显式地导入模块或名称。这是你在主全局
    Python 作用域中使用这些名称的最快方法。下面的代码示例了导入某些标准模块和名称时发生的情况：


    你首先从 Python 标准库中导入 `sys` 和 `os`。通过不带参数地调用 `dir()`，你可以观察到这些模块现在已作为名称在你当前的全局作用域中可用。这样，你可以添加点符号表示来访问在
    `sys` 和 `os` 中定义的名称。在下一次导入操作中，你使用 `from <module> import <name>` 的形式。这样一来，你就可以直接在代码中使用导入的名称。简单来说，没有必要显式使用点符号表示。


    ### 回顾特殊的 Python 作用域


    并不是所有的 Python 结构都符合 Python 作用域的 LEGB 规则。这些结构包括：


    *   推导式 (Comprehensions)

    *   异常块 (Exception blocks)

    *   类和实例


    了解 Python 作用域在这三个结构上如何工作，将使你能够避免与这些 Python 结构中使用名称时相关的随机错误。


    ### 推导式变量作用域


    推导式结构是一种操作集合或序列中所有或部分元素的紧凑方式。你可以应用推导式来创建列表、字典和集合。推导式由一组包含表达式的括号 `[]` 或大括号 `{}`
    组成，后面跟着一个或多个 `for` 子句，每个 `for` 子句对应零或一个 `if` 子句。尽管如此，推导式中的 `for` 子句的运行方式与传统的 for
    循环类似。推导式中的循环变量对于该结构是局部。通过以下代码演示：


    如果你运行列表推导式，变量 `item` 将被删除，你无法再次访问它的值。你可能不需要在这个推导式之外使用该变量，但无论如何，Python 确保一旦推导式完成，其值将不再可访问。


    ### 异常变量作用域


    你会遇到的 Python 作用域另一个非典型情况是异常变量。异常变量是一个持有 `try` 语句抛出的异常引用的变量。在 Python 3.x 中，此类变量是
    `except` 块局部的，并在块结束时被遗忘。


    ### 类和实例属性作用域


    当你定义一个类时，你正在创建一个新的局部 Python 作用域。在类顶层分配的名称存储在这个局部作用域中。在类语句内部分配的名称不会与别处的名称混淆。可以说，这些名称遵循
    LEGB 规则，其中类块代表 `L` 层。


    与函数不同，类局部作用域不是在调用时创建，而是在执行时创建。每个类对象都有自己的 `.__dict__` 属性，其中持有所有类属性的类作用域或命名空间。也可以通过类的实例如下所示访问任何类属性：


    如果你有实例，可以像你在这里使用 `obj.attr` 那样使用点符号访问类属性。类属性特定于类对象，但你可以从该类的任何实例访问它们。值得注意的是，类属性是该类所有实例的基础。如果你编辑了类属性，更改将在该类的所有实例中都可见。


    当你调用一个类时，你正在创建该类的一个新实例。实例有自己的 `.__dict__` 属性，其中包含实例局部作用域或命名空间中的名称。这些名称通常命名为实例属性，并且对于每个实例都是局部且特定的。这意味着如果你决定编辑一个实例属性，更改将仅对该特定实例可见。


    如果你想从类内部创建、更新或访问任何实例属性，你需要使用 `self` 配合点符号表示。这里的 `self` 代表一个指示当前实例的特殊属性。另一方面，要从类外部更新或访问任何实例属性，你需要创建一个实例然后使用点符号表示。通常，当你在
    Python 中编写面向对象的代码并尝试访问属性时，你的程序会自动遵循这些标准步骤：


    *   它首先检查实例局部作用域或命名空间。

    *   如果在那里没有找到属性，则检查类局部作用域或命名空间。

    *   如果名称在类命名空间中不存在，你将得到 `AttributeError`。


    这是 Python 在类和实例中查找并解决名称的底层机制。即使类定义了局部作用域或命名空间，它们仍然没有为方法产生嵌套作用域。


    ### 使用与作用域相关的内置函数


    有很多内置函数与 Python 作用域和命名空间的概念密切相关。在之前的部分中，你已经使用 `dir()` 获取有关给定作用域中存在的名称的信息。除了 `dir()`，还有其他几个内置函数可以帮助你获取有关
    Python 作用域或命名空间的信息。我们将简要介绍如何使用：


    *   `globals()`

    *   `locals()`

    *   `dir()`

    *   `vars()`

