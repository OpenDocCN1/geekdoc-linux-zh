    以下脚本用于在 Python 中创建条件语句。Python 中 if-else 语句的声明与其他语言不同——Python 不需要像其他语言那样使用大括号来定义
    if-else 块，但必须正确添加缩进块，否则脚本将显示错误。`if` 和 `else` 块之后使用冒号(`:`) 来定义块的开始。


