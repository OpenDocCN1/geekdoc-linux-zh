    使用自顶向下的方法（top-down method），问题会被拆解，如果问题的某些部分已经解决，则找到并返回保存的值；否则，记录或首次计算函数的值。


    自顶下的解决方案通过将问题分解为更小的子问题，确保每个问题都能到达基础情况（base case）。通过使用这种递归链，自顶向下动态规划只在需要时解决子问题，而不是顺序解决所有问题。在这种情况下，记忆化（memoization）作为处理计算密集型程序的工具起着重要作用。记忆化可以定义为在自顶向下方法中存储子问题解决方案的过程。由于自顶向下方法按需解决问题，记忆化还以非顺序的方式存储数据。为此，哈希表（hashtables）是最好的集合类型，因为它们以无序的方式存储数据。在
    Python 中，自顶向下的方法最好使用字典数据结构完成，因为它非常适合存储具有键值对的无序数据。


    自底向上（Bottom-up）是另一种避免递归的方法，通过降低递归导致的时间复杂度来实现。在这种情况下，按顺序计算小问题的解决方案，以构建整体问题的解决方案。自底向上的动态规划解决方案从关注最小的子问题（称为基础情况）开始，然后逐步推进到每个子问题。当每个子问题完成后，它的解决方案就会被保存，并用于解决下一个最小的子问题。结果，这些构建的解决方案预计将构成主问题的答案。填表（Tabulation）确保了这一过程顺畅进行。填表可以定义为以有序的方式存储自底向上方法中子问题结果的过程。在填表中，不需要选择先解决哪些子问题，而是继续解决从基础情况到主问题之间的每一个子问题。由于该过程是按顺序排列的，填表可以使用列表（lists）或数组（arrays），因为这些集合按照特定顺序组织信息。


    通过一些示例，人们可能会更好地理解动态规划及其类型。我们将通过斐波纳契数列（Fibonacci series）的基本计算来研究这一概念。斐波纳契数列是一个数字序列，其排列方式每个数字都是前两个数字之和，从
    0 和 1 开始：`F(n) = F(n-1) + F(n-2)`


    ### 递归方法 (Recursive Method)


    使用这种方法，程序将反复调用自身，尝试计算更远的值。基于递归的方法的时间复杂度大约为 `O(2^N)`。该方法的空间复杂度为 `O(N)`，因为递归最多可以达到
    `N`。


    例如- `F(4) = F(3) + F(2) = ((F(2) + F(1)) + F(2)) = ((F(1) + F(0)) + F(1)) + (F(1)
    + F(0))`。在这种方法中，像 `F(2)` 这样的值会被计算两次，对 `F(1)` 和 `F(0)` 的调用也会多次进行。会有大量的重复，这证明了这种方法对于大值来说是无效且无效的。


    ### 自顶向下方法 (Top-Down Method)


    使用这种方法，计算时间大大减少，因为每次递归产生的输出都保存在单独的列表中，以后可以重用。这种方法比上一种方法更高效地处理序列。


    ### 自底向上 (Bottom Down)


    使用这段代码，完全不需要应用递归。相反，你只需要创建一个长度为 `(n+1)` 的空列表，并在索引位置 0 和 1 处设置 `F(0)` 和 `F(1)`
    的基础情况。创建此列表是为了使用 `for` 循环为索引值 2 到 `n` 存储对应的计算值。


    与第一种递归方法不同，这段代码的时间复杂度是线性的，计算所有结果所需的时间要少得多，因为循环从 2 运行到 `n`，即它的运行复杂度为 `O(n)`。这种方法可以被视为编写程序最有效的方法。


    # LAMBDA 函数 (LAMBDA FUNCTIONS)


    ![](img/fig4_4.jpg) <details><summary>详细描述</summary>


    Lambda 符号在一个圆内。左侧标题显示了 Python 图标，并写着“Python Lambda 函数”。</details>


    Python 和其他编程语言中的 Lambda 函数源于 Lambda 演算（lambda calculus）和阿隆佐·丘奇（Alonzo Church）发明的原始计算模型。20
    世纪 30 年代，阿隆佐·丘奇形式化了一种基于纯抽象的语言，现在被称为 Lambda 演算。有时，Lambda 函数也可以称为 Lambda 抽象，直接指的是阿隆佐·丘奇原始设计的抽象模型。


    总来说，函数式语言起源于数学逻辑和 Lambda 演算，而命令式编程语言则遵循艾兰·图灵（Alan Turing）发明的基于状态的计算模型。Lambda 演算可以编码任何计算，与图灵机的概念相反，它不保留任何状态。这两种计算模型——Lambda
    演算和图灵机相互转换。这种等效性主要被称为丘奇-图灵假设（Church-Turing hypothesis）。


    此外，函数式语言直接源自 Lambda 演算哲学，采用声明式编程方法，关注抽象、数据转换和组合。另一方面，图灵机导致了 Fortran、C 或 Python
    等语言中的命令式编程。命令式风格涉及使用语句引导程序流程。这种方法允许变异并需要管理状态。


    两种基础的分离存在细微差别，因为某些函数式语言包含了命令式特征（如 OCaml），而函数式特征在 Java 或 Python 引入 Lambda 函数时得到了模仿。


    Python 不被视为函数式语言，但它从一开始就采用了一些函数式概念。因此，早在 1994 年 1 月，`map()`、`filter()`、`reduce()`
    以及 `lambda` 操作符被添加到语言中。


    为了清晰起见，根据编程语言类型和文化，以下术语可以互换使用：


    *   匿名函数 (Anonymous functions)

    *   Lambda 函数 (Lambda functions)

    *   Lambda 表达式 (Lambda expressions)

    *   Lambda 抽象 (Lambda abstractions)

    *   Lambda  (Lambda form)

    *   函数字面量 (Function literals)


    但在本章节范围内，你只会看到“Lambda 函数”这一术语。在 Python 中，我们使用 `lambda` 关键字来声明匿名函数，即没有命名的函数。虽然语法上看起来不同，但
    Lambda 函数的操作与使用 `def` 关键字编写的普通函数相同。以下是 Python Lambda 函数的主要特征：


    *   Lambda 函数可以接受任意数量的参数，但只包含单个表达式。技术上，Lambda 函数仅限于单个表达式。这里的表达式是指 Lambda 函数执行的代码段，它可能返回或不返回任何值。

    *   Lambda 函数可以用于返回函数对象。

    *   当我们需要临时函数时，Lambda 函数非常有用。通常用于你想将函数作为参数传递给高阶函数（即接受函数作为参数的函数）时。


    JavaScript 等其他编程语言也采用了这种立即执行 Python Lambda 函数的模式。这被称为立即调用函数表达式（IIFE）。通过示例说明：


    上面的 Lambda 函数被定义后立即带有两个参数（2 和 3）进行调用。它返回值 5，即参数之和。

