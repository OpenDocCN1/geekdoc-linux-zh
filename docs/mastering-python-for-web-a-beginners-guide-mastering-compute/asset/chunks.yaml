    \ unless there.ASCII flag is used to disable non-ASCII matches. The current locale\
    \ does not change the effect of this flag unless there.LOCALE flag is also used.\n\
    \n    Note that when the Unicode patterns [a-z] or [A-Z] are used in combination\
    \ with the IGNORECASE flag, they will match the 52 ASCII letters and 4 additional\
    \ non-ASCII letters: ‘İ’ (U+0130, Latin capital letter I with dot above), ‘ı’\
    \ (U+0131, Latin small letter dotless i), ‘ſ*’* (U+017F, Latin small letter longs),\
    \ and ‘K’ (U+212A, Kelvin sign). If the ASCII flag is used, only letters ‘a’ to\
    \ ‘z’ and ‘A’ to ‘Z’ are matched.\n\n*   re.L\n\n    Make \\w, \\W, \\b, \\B,\
    \ and case-insensitive matching dependent on the current locale. This flag can\
    \ be applied only with bytes patterns. The use of this flag is discouraged as\
    \ the locale mechanism is very unreliable, it only handles one *“*culture*”* at\
    \ a time, and it only works with 8-bit locales. Unicode matching is already enabled\
    \ by default in Python 3 for Unicode (str) patterns, and it is able to handle\
    \ different locales/languages. Corresponds to the inline flag (?L).\n\n*   re.M\n\
    \n    When specified, the pattern character ‘^’ matches at the beginning of the\
    \ string and at the beginning of each line (immediately following each newline);\
    \ and the pattern character ‘$’ matches at the end of the string and at the end\
    \ of each line (immediately preceding each newline). By default, ‘^’ matches only\
    \ at the beginning of the string, and ‘$’ only at the end of the string and immediately\
    \ before the newline (if any) at the end of the string. Corresponds to the inline\
    \ flag (?m).\n\n*   re.S\n\n    Make the ‘.’ special character match any character\
    \ at all, including a newline; without this flag, ‘.’ will match anything except\
    \ a newline. Corresponds to the inline flag (?s).\n\n*   re.X\n\n    This flag\
