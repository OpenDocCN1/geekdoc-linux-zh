    Python comes with a library of standard modules, described in a separate document,
    also known as the Python Library Reference. Some modules that are built into the
    interpreter provide access to operations that are not part of the core of the
    language but are nevertheless necessary for efficiency or to provide access to
    operating system functions such as system calls. The set of such modules is a
    configuration option that highly depends on the underlying platform. One module,
    in particular, `sys` is built into every Python interpreter. The variables `sys.ps1`
    and `sys.ps2` define the strings used as primary and secondary prompts:


    ## Python Packages


    It often happens that you develop a very large application that includes many
    modules. As the number of modules grows, it becomes challenging to keep track
    of them all, especially if they are stored in one location. This is particularly
    difficult if they have similar names or functionality means. In this case, you
    might wish for a tool or system to be able to group and organize them.


    Packages enable hierarchical structuring of the module namespace through dot notation.
    In the same way that modules help avoid confusion between variable names, packages
    help avoid confusion between module names. Creating a package is a straightforward
    process that makes use of the operating system''s default hierarchical file structure.


    To demonstrate, let''s imagine you need to design a collection of modules for
    the uniform handling of sound files and sound data. And since there are many different
    sound file formats, you may need to create and maintain a growing collection of
    modules for the conversion between the various file formats. There are also many
    different operations you might want to perform on sound data, such as mixing,
    adding echo, applying an equalizer function, creating a stereo effect, so in addition,
    you will be scripting a stream of modules to perform these operations. Here''s
    a possible structure for your package designed in terms of a hierarchical filesystem:


    ## PYTHON ALGORITHMS


    ![A graphic shows a stack, a flow diagram, a linked list, the logo of Python,
    and an illustration of three people seated at a table.](images/fig4_2.jpg)


    Algorithms are rules or instructions that are structured in a finite order to
    solve problems and obtain the required results. They also used to give the pseudocode
    for problems and can be applied in several languages as they are not considered
    to be language-specific.


    ### How Do You Write Algorithms?


    Algorithms are generally written as a combination of user-friendly language and
    a few common programming languages. They are typically written down in steps.
    However, there are no distinct rules to form algorithms but you will need to keep
    the following points in mind:


    - Point out what is the exact problem

    - Define where you want to start

    - Determine where you need to stop

    - Decide on the intermediate steps

    - Review your algorithm steps


    For example, if you have to formulate an algorithm to check if an expert has passed
    a qualification exam or not, you can follow the given steps:


    - **Step 1:** START

    - **Step 2:** Define two variables `x`, `y`

    - **Step 3:** Store the marks obtained by the expert in `x`

    - **Step 4:** Store the minimum passing score in `y`

    - **Step 5:** Check if `x` is greater than or equal to `y`. If yes, then return
    `Pass` else return `Fail`

    - **Step 6:** STOP


    Nevertheless, you may manipulate the steps according to your needs and preferences.
    For example, you can assign the values to the variables in step 2 itself rather
    than taking steps 3 and 4. This way, a single problem can have multiple solutions,
    and it depends on the problem and the programmer to choose the most practical
    solution.


    ### Characteristics of an Algorithm


    However, not all procedures can be treated as an algorithm. An algorithm should
    have the following characteristics:


    - **Unambiguous:** Algorithm should be clear and have transparent order of steps
    (or phases), with an understandable set of inputs/outputs that lead to only one
    meaning.

    - **Input:** An algorithm should have 0 or more well-established inputs.

    - **Output:** An algorithm should have 1 or more well-explained outputs and should
    match the desired output.

    - **Finiteness:** Algorithms must end after a certain number of steps.

    - **Feasibility:** Should be viable with the available resources.

    - **Independent:** An algorithm should have marked out step-by-step directions,
    which should not depend on any programming code.


    From the data structure point of view, there are certain categories of algorithms
    that are of utmost importance:


    - **Search:** Algorithm that helps to search an item in a data structure.

    - **Sort:** Algorithm that is used to sort items in a certain order.

    - **Insert:** Algorithm to insert items in a data structure.

    - **Update:** Algorithm applied to update an existing item in a data structure.

    - **Delete:** Algorithm that deletes an existing item from a data structure.


    Algorithms may be perceived as paradigms or strategies for solving problems. There
    are two most common algorithmic paradigms are brute force and divide & conquer.


    ### Brute Force


    Brute force algorithms are great methods of solving a problem through exercising
    computing power and testing all possibilities to find a solution rather than using
    a more advanced strategy to advance overall tactics efficiency.


    For instance, if you are trying to figure out a four-digit password combination
    application of the brute force approach would let you test every possible combination
    of four-digit numbers from 0000 to 9999. Linear search, a method to find a target
    value using a specific list, is an example of the brute force method. The search
    algorithm will pass through the array and check each element until a match is
    found. The advantage of using the brute force method is that you are definitely
    guaranteed to find the solution. It is also pretty straightforward and easy to
    implement compared to other complicated algorithmic strategies. On the other hand,
    even though it is easy to implement, it is also the most inefficient solution.
    It makes it challenging to improve performance or find possible shortcuts with
    this strategy.


    ### Divide and Conquer


    Divide and conquer is another algorithmic paradigm that enables solving a problem
    by dividing it into smaller sub-problems. Once the sub-problems are small enough,
    they will each be solved separately. And in the end, the algorithm repeatedly
    combines the solved sub-solutions into a solution for the original problem. It''s
    very efficient and fast when dealing with general case solutions where the problem
    can easily be divided into sub-problems. It is also preferable in terms of memory
    usage, as dividing the problems into micro sub-problems allows the problem to
    be solved in the cache itself. However, due to its recursive approach, it may
    be quite slow. There is also a possibility that the approach might duplicate sub-problems
    leading to large recursive sets, which will consume extra space.


    Moving ahead with these Data Structures and Algorithms in Python, we should take
    a closer look at some of the important algorithms such as the Tree Traversal Algorithms,
    Searching Algorithms, and Sorting Algorithms.


    #### Tree Traversal Algorithms


    Trees in Python are non-linear data structures that require visiting each node
    present in the tree exactly once in order to update or check them. Based on the
    order in which the nodes are visited, there can be three types of tree traversals:
    pre- traversal traversal (Root-Left-Right), in-order traversal (Left-Root-Right),
    and post-order traversal (Left-Right-Root).


    ##### In-order Traversal

