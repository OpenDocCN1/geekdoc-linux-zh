    \ the problem are solved already then the saved value is found and returned, otherwise,\
    \ the value of the function is memorized or calculated for the first time.\n\n\
    A top-down solution makes sure to reach the base case of every problem by breaking\
    \ it into smaller sup-problems. By using such a style of recursive chain, top-down\
    \ dynamic programming only solves sub-problems as they are needed rather than\
    \ solving them all in order. In this case, memoization plays a great role as a\
    \ tool to handle computationally expensive programs. Memoization could be defined\
    \ as a process of saving sub-problem solutions in a top-down approach. And because\
    \ top-down approaches solve problems as needed, memorization also stores data\
    \ in a non-sequential way. For this, hashtables are the best collection type,\
    \ as they store data in an unordered way. In Python, top-down is best completed\
    \ using the dictionary data structure because it is a perfect suit to store unordered\
    \ data with key/value pairs.\n\nBottom-up is another operative way to avoid recursion\
    \ by decreasing the time complexity that recursion leads to. In this case, the\
    \ solutions to small problems are calculated in order to build up the solution\
    \ to the overarching problem. Bottom-up dynamic programming solutions start by\
    \ focusing on the smallest possible sub-problem, called the base case, and then\
    \ work step-by-step up to each sub-problem. And as each sub-problem is completed,\
    \ its solution is saved and used to solve the next smallest sub-problem. As a\
    \ result, these building solutions are expected to make up an answer to the main\
    \ problem. Tabulation ensures that this process goes with ease. Tabulation can\
    \ be defined as the process of storing results of sub-problems from a bottom-up\
    \ approach in an orderly manner. In tabulation, there is no need to choose which\
    \ sub-problems need to be solved first but instead go on to solving every sub-problem\
    \ between the base case and the main problem. And since the process is arranged\
    \ in sequential order, tabulation can use either lists or arrays, as those collections\
    \ organize information in a specific order.\n\nOne might gain a better understanding\
    \ of dynamic programming and its types with some examples. We shall examine the\
    \ concept through a basic calculation of the Fibonacci series. Fibonacci series\
    \ is a simple sequence of numbers arranged in a way that each number is the sum\
    \ of the two preceding ones, starting from 0 and 1: F(n) = F(n-1) + F(n-2)\n\n\
    ### Recursive Method\n\nWith this approach, the program will call itself, over\
    \ and over again, trying to calculate further values. The calculation of the time\
    \ complexity of the recursion-based approach is going to be around O(2^N). The\
    \ space complexity of this approach is O(N) as recursion can go max to N.\n\n\
    For example- F(4) = F(3) + F(2) = ((F(2) + F(1)) + F(2) = ((F(1) + F(0)) + F(1))\
    \ + (F(1) + F(0)) In this method, values like F(2) will be computed twice and\
    \ calls for F(1) and F(0) will also be made multiple times. There is going to\
    \ be great number of repetitions that only prove that this method should be disregarded\
    \ as ineffective for large values.\n\n### Top-Down Method\n\nWith this approach,\
    \ the computation time is reduced dramatically as the outputs produced after each\
    \ recursion are saved in a separate list which can be reused later. This method\
    \ deals with series more efficiently than the previous one.\n\n### Bottom Down\n\
    \nWith this code, there is no need to apply recursion at all. Instead, you can\
    \ simply create an empty list of length (n+1) and set the base case of F(0) and\
    \ F(1) at index positions 0 and 1\\. This list is created to store the corresponding\
    \ calculated values using a for loop for index values 2 up to n.\n\nAnd unlike\
    \ in the first recursive method, the time complexity of this code is linear and\
    \ takes much less time to compute all the results, as the loop runs from 2 to\
    \ n, i.e., it runs in O(n). This approach could be regarded as the most efficient\
    \ way to write a program.\n\n## LAMBDA FUNCTIONS\n\n![](images/fig4_4.jpg)<details><summary>Long\
    \ Description</summary>\n\nThe lambda symbol is in a circle. To the left, a title\
    \ shows the Python logo and reads, Python Lambda Function.</details> \n\nLambda\
    \ functions in Python and other programming languages have their roots in lambda\
    \ calculus and an original model of computation invented by Alonzo Church. Back\
    \ in the 1930s, Alonzo Church formalized a language based on pure abstraction,\
    \ now known as lambda calculus. At times, lambda functions could also be referred\
    \ to as lambda abstractions, directly referring to the abstraction model of Alonzo\
    \ Church's original design.\n\nIn general, functional languages get their origin\
    \ in mathematical logic and lambda calculus, while imperative programming languages\
    \ are following the state-based model of computation invented by Alan Turing.\
    \ Lambda calculus can encode any computation, but contrary to the concept of a\
    \ Turing machine, it does not keep any state. The two models of computation, lambda\
    \ calculus and Turing machines can be translated into each other. This equivalence\
    \ is mostly known as the Church-Turing hypothesis.\n\nIn addition, functional\
    \ languages directly derive from the lambda calculus philosophy, adopting a declarative\
    \ approach of programming that focuses on abstraction, data transformation, and\
    \ composition. On the other hand, the Turing Machine led to imperative programming\
    \ found in languages like Fortran, C, or Python. The imperative style involves\
    \ programming with statements, leading the flow of the program step by step with\
    \ detailed instructions. This approach has room for mutation and requires a full-on\
    \ managing state.\n\nThe separation in both foundations has some nuances, as some\
    \ functional languages incorporate imperative features, like OCaml, while functional\
    \ features have been mimicking the imperative family of languages in particular\
    \ with the introduction of lambda functions in Java or Python.\n\nPython is not\
    \ viewed as a functional language, but it adopted some functional concepts from\
    \ the beginning. Thus, as early as January 1994, map(), filter(), reduce(), and\
    \ the lambda operator was added to the language.\n\nTo make it clear, the following\
    \ terms may be used interchangeably depending on the programming language type\
    \ and culture:\n\n*   Anonymous functions\n\n*   Lambda functions\n\n*   Lambda\
    \ expressions\n\n*   Lambda abstractions\n\n*   Lambda form\n\n*   Function literals\n\
    \nBut for the rest of this section, you will only see the term lambda function.\
    \ In Python, however, we use the lambda keyword to declare an anonymous function,\
    \ which refers to a function declared with no name. Although syntactically they\
    \ look different, lambda functions operate in the same way as regular functions\
    \ that are scripted using the def keyword. The following are the main characteristics\
    \ of Python lambda functions:\n\n*   A lambda function can take any number of\
    \ arguments but contain only a single expression. Technically, lambda functions\
    \ are restricted to only a single expression. An expression here stands for a\
    \ piece of code executed by the lambda function that might or might not return\
    \ any value.\n\n*   Lambda functions can be applied to return function objects.\n\
    \n*   Lambda functions are useful when you need a function for a short period\
    \ of time. This is commonly applied when you want to pass a function as an argument\
    \ to higher-order functions, meaning functions that take other functions as their\
    \ arguments.\n\nOther programming languages like JavaScript have adopted a pattern\
    \ used to immediately execute a Python lambda function. This is known as an Immediately\
    \ Invoked Function Expression (IIFE). To illustrate with an example:\n\nThe lambda\
    \ function above is defined and then immediately called with two arguments (2\
    \ and 3). It returns the value 5, which is the sum of the arguments."
