    Using the statement `nonlocal var`, you telling Python that you need to modify
    `var` inside `nested()`. Then, you implement `var` using an augmented assignment
    operation. This change is presented in the `nonlocal` name `var`, which now has
    a value of `100`. Unlike `global`, you are not able to apply `nonlocal` outside
    of a nested or enclosed function. To be more direct, you cannot use a `nonlocal`
    statement in either the global scope or in a local scope. To illustrate with an
    example:


    At first, you tried to use a `nonlocal` statement in the global Python scope,
    but since `nonlocal` only works inside an inner or nested function, you end up
    getting a `SyntaxError` telling you that you cannot apply `nonlocal` in a module
    scope. In-depth information on the `nonlocal` statement operations could be found
    in `PEP 3104 – Access to Names in Outer Scopes`.


    Unlike with `global`, you cannot use `nonlocal` to make up lazy nonlocal names.
    Names should already exist in the enclosing Python scope if you want to apply
    them as `nonlocal` names. This means that you cannot manage nonlocal names by
    declaring them in a `nonlocal` statement in a nested function. Take a look at
    the following code example:


    Using this example you can see that when you try to define a nonlocal name using
    `nonlocal lazy_var`, Python immediately raises a `SyntaxError` because `lazy_var`
    is not executed in the enclosing scope of `nested()`.


    ### Using Enclosing Scopes as Closures


    Closures are of a specific use case for enclosing Python scope. When you handle
    a nested function as data, the statements that create that function are placed
    together with the environment in which they are implemented. The resulting item
    is known as a closure. To be precise, a closure is an inner or nested function
    that contains data about its enclosing scope, even if this scope has completed
    its execution. In addition, closures also provide a way to keep state information
    between function calls. This can be particularly useful if you need to write code
    based on the concept of lazy or delayed evaluation.


    Some also name this kind of function a factory, a factory function, or a closure
    factory to specify that the function builds and returns closures, instead of classes
    or instances.


    ### Bringing Names to Scope with Import


    When it comes to writing a Python program, it usually starts by organizing the
    code into several modules. In order to manage your program, you would need to
    bring the names in those separate modules to your `__main__` module. To do that,
    you should import the modules or the names explicitly. This is the quickest way
    you can use those names in your main global Python scope. The following code is
    an example of what happens when you import some standard modules and names:


    You start by importing `sys` and `os` from the Python standard library. By calling
    `dir()` with no arguments, you can observe that these modules are now available
    for you as names in your current global scope. This way, you can add dot notation
    to get access to the names that are defined in `sys` and `os`. In the next import
    operation, you use the form `from <module> import <name>`. With that, you can
    use the imported name directly in your code. To put it simply, there is no need
    to explicitly use the dot notation.


    ### Reviewing Unusual Python Scopes


    Not all Python structures seem to fit into the LEGB rule for Python scopes. These
    structures include the following:


    *   Comprehensions

    *   Exception blocks

    *   Classes and instances


    Knowing how Python scope works on these three structures will enable you to avoid
    random errors related to the use of names in these types of Python structures.


    ### Comprehension Variables Scope


    A comprehension structure is a compact way to operate with all or part of the
    items in a collection or sequence. You can apply comprehensions to make lists,
    dictionaries, and sets. Comprehensions consist of a couple of brackets `[]` or
    curly braces `{}` containing an expression, followed by one or more `for` clauses
    and then zero or one `if` clause per for clause. Nevertheless, the `for` clause
    in a comprehension runs in a similar way with a traditional for loop. The loop
    variable in comprehension is local to the structure. To demonstrate with the following
    code:


    If you run the list comprehension, the variable `item` is deleted and you cannot
    access its value anymore. It is unlikely that you would need to use the variable
    outside of this comprehension, but anyway, Python makes sure that its value is
    no longer accessible once the comprehension is completed.


    ### Exception Variables Scope


    Another atypical case of Python scope that you’ll encounter is the case of the
    exception variable. The exception variable is a variable that holds a reference
    to the exception raised by a `try` statement. In Python 3.x, such variables are
    local to the `except` block and are forgotten when the block ends.


    ### Class and Instance Attributes Scope


    When you define a class, you’re creating a new local Python scope. The names assigned
    at the top level of the class live in this local scope. The names that you assigned
    inside a class statement do not get mixed with names elsewhere. It is safe to
    say that these names follow the LEGB rule, where the class block represents the
    `L` level.


    Unlike functions, the class local scope isn’t created at call time, but at execution
    time. Each class object has its own `.__dict__` attribute that holds the class
    scope or namespace where all the class attributes live. It is also possible to
    access any class attribute using an instance of the class as follows:


    If you have the instance, you can access the class attributes using the dot notation,
    as you did here with `obj.attr`. Class attributes are specific to the class object,
    but you can access them from any instances of the class. It is also worth noting
    that class attributes are basic to all instances of a class. If you edit a class
    attribute, then the changes will be visible in all instances of the class.


    When you call a class, you are making up a new instance of that class. Instances
    have their own `.__dict__` attribute that contains the names in the instance local
    scope or namespace. These names are commonly named as instance attributes and
    are local and specific to every instance. This means that if you decide to edit
    an instance attribute, then the changes will be visible only to that specific
    instance.


    If you want to create, update, or access any instance attribute from inside the
    class, you need to use `self` along with the dot notation. `self` here represents
    a special attribute that signifies the current instance. On the other hand, to
    update or access any instance attribute from outside the class, you need to create
    an instance and then use the dot notation. Typically, when you are writing object-oriented
    code in Python and try to access an attribute, your program automatically follows
    these standard steps:


    *   It checks the instance local scope or namespace first.

    *   If the attribute is not found there, then check the class local scope or namespace.

    *   If the name does not exist in the class namespace either, then you will get
    an `AttributeError`.


    This is the underlying mechanism by which Python locates and solves names in classes
    and instances. And even classes define a class local scope or namespace, they
    still do not produce an enclosing scope for methods.


    ### Using Scope-Related Built-In Functions


    There is a variety of built-in functions that are closely connected to the concept
    of Python scope and namespaces. In previous parts, you have used `dir()` to get
    information on the names that exist in a given scope. Apart from `dir()`, there
    are a few other built-in functions that can assist you in getting information
    about a Python scope or namespace. We will briefly cover how to work with:


    *   `globals()`

    *   `locals()`

    *   `dir()`

    *   `vars()`

