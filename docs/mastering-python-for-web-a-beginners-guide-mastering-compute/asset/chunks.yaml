    \ `arg`。由于 `locals()` 只获取在你调用之前分配的名称，因此另一个名称不在字典中。\n\n    如果你在 Python 全局作用域中调用\
    \ `locals()`，你将获得与调用 `globals()` 相同的字典：\n\n    当你在 Python 全局作用域中调用 `locals()`\
    \ 时，你得到的字典与调用 `globals()` 返回的字典完全相同。\n\n*   `vars()`：`vars()` 是另一个内置函数，用于返回模块、类、实例或任何具有\
    \ `__dict__` 属性对象的 `.__dict__` 属性。值得注意的是，`.__dict__` 是 Python 来实现命名命名的特殊字典。\n\n\
