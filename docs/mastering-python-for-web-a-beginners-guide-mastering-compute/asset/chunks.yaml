    \ true | `x < 5 or x < 10` |\n| not | Reverse the result, returns False if the\
    \ result is | `not(x < 5 and x < 10)` |\n\n### Python Identity Operators\n\nIdentity\
    \ operators are used to comparing the objects, not if they are equal, but if they\
