  trans: '


    在编程中，名称的作用范围（scope）指的是程序中可以无歧地定位该名称的区域，例如变量、函数或对象。一个名称仅对其作用范围内的代码可见并可从中访问。某些编程语言利用作用域来防止名称冲突和意外行为。最常见有两种通用的作用域需要区分：全局作用域（global
    scope，让你在此作用域内定义的名称对所有代码可用）和局部作用域（local scope，让你在此作用域内定义的名称仅对该作用域内的代码可见）。


    作用域的引入主要是因为早期的编程语言（如 `BASIC`）只有全局名称。使用这种名称，程序的任何部分都可以随地修改任何变量，因此操作和调试大型程序可能会变成一种真正的灾难。为了处理全局名称，你需要在脑海中监控所有代码，并知道给定名称在任何时候的值是多少。这是一个重要的副作用，像
    `Python` 这样的语言决定实现作用域来避免这些问题。当你使用实现作用域的语言时，你无法定位程序中的所有变量，而且你访问给定名称的能力将取决于你定义该名称的位置。明确来说，这里的“名称”指的是变量、常量、函数、类或任何可以分配名称对象的标识符。


    你程序中的名称仅具有定义它们所在代码块的作用域。如果你从代码的某处访问给定名称的值，你就称该名称在作用域内（in scope）。如果你无法定位该名称，你可能会说该名称超出作用域（out
    of scope）。由于 `Python` 被认为是一种动态类型语言，`Python` 中的变量只有在第一次给它们赋值时才会存在。相反，函数和类在你使用 `def`
    或 `class` 定义它们后才可用。最后，模块在导入它们后存在。总而言之，你可以通过以下操作之一创建 `Python` 名称：


    | 操作 | 语句 |

    | --- | --- |

    | 赋值 | `x = value` |

    | 导入操作 | `import module` 或 `from module import importname` |

    | 函数定义 | `def my_func(): ...` |

    | 函数上下文中的参数定义 | `def my_func(arg1, arg2,... argN): ...` |

    | 类定义 | `class MyClass: ...` |


    上述所有操作都创建了（或在赋值的情况下优化了）新的 `Python` 名称，因为它们都为变量、常量、函数、类、实例或模块分配了名称。然而，赋值操作与引用或访问操作之间存在重要的区别。因此，如果你引用一个名称，你只是尝试检索其内容或值。但当你分配一个名称时，你要么是在创建该名称要么是在更新它。


    `Python` 利用名称赋值或定义的位置将其与特定的作用域相关联。简单来说，你在代码中分配或定义名称的位置将决定该名称的作用域或可见性。例如，如果你在函数内部为一个名称赋值，那么该名称将具有局部的
    `Python` 作用域。相反，如果你选择在模块顶层的所有函数之外为名称赋值，那么该名称将具有全局的 `Python` 作用域。


    在 `Python` 中，作用域的概念与命名空间（namespace）的概念紧密相。如前提到的，`Python` 作用域决定了名称在程序的何处可见。`Python`
    作用域以映射名称到对象的字典形式执行。这些字典被称为命名空间。这些是 `Python` 用于存储名称的通用机制。它们被保存在名为 `.__dict__` 的特殊属性中。


    ### 使用 LEGB 规则


    `Python` 使用广为人知的 LEGB 规则解析名称，该规则以 `Python` 名称的作用域命名。LEGB 中的字母分别代表 Local（局部）、Enclosing（闭包）、Global（全局）和
    Built-in（内置）。简而言之，这些术语的含义如下：


    - 局部作用域（Local scope）是任何 `Python` 函数或 `lambda` 表达式的代码块或体。此特定作用域包括你在函数内部定义的名称。这些名称仅对函数代码可见。它是在函数调用时创建的，而不是函数定义时，因此你可以拥有与函数调用次数一样不同的局部作用域。即使你多次调用同一个函数，每次调用仍然会产生一个新的局部作用域。

    - 闭包作用域（Enclosing scope）是一种仅对嵌套函数的特定作用域。如果局部作用域是一个内部或嵌套函数，那么闭包作用域就是外部函数或闭包函数的作用域。该作用域包含了你在闭包函数中添加的名称。闭包作用域中的这些名称对于内部函数和闭包函数的代码是的。

    - 全局作用域（Global scope）被认为是 `Python` 程序、脚本或模块中最重要的作用域。此 `Python` 作用域包含了你在程序或模块顶层定义的所有名称。此
    `Python` 作用域中的名称在代码的任何地方可见。

    - 内置作用域（Built-in scope）是一种 `Python` 作用域类型，每当你运行脚本或打开交互式会话时就会创建或激活。此作用域包含了关键字、函数、异常和其他已内置到
    `Python` 中的项。此 `Python` 作用域中的名称在代码的任何地方可用。当你运行程序或脚本时，`Python` 会自动加载它。


    LEGB 规则是一种有效的查找程序，决定了 `Python` 查找名称的顺序。例如，如果你引用一个给定名称，`Python` 将按照局部、闭包、全局和内置作用域顺序查找该名称。如果名称存在，你获得它的第一次出现。否则，你将得到一个错误。


    总结一下，当你使用嵌套函数时，名称的操作是首先检查局部作用域或最内部函数的局部作用域。之后，`Python` 从最内部作用域到最外部作用域查看外部函数的所有闭包作用域。如果没有找到匹配项，`Python`
    开始查找全局和内置作用域。如果未找到名称，你就会得到错误。无论如何，在执行期间的任何时刻，你最多会有四个活跃的 `Python` 作用域——局部、闭包、全局和内置——取决于你在代码的位置。另一方面，你始终可以访问至少两个活跃的作用域，即始终对你可全局和内置作用域。


    ### 函数：局部作用域


    局部作用域或函数作用域是在函数调用时生成的 `Python` 作用域。每当你调用一个函数时，你都会创建一个新的局部作用域。同时，你可以将每个 `def` 语句和
    `lambda` 表达式视为后续局部作用域的蓝图。每当你调用当前函数时，这些局部作用域就会被产生。按照标准，在函数内部分配的参数和名称仅存在于函数或与函数调用对应的局部作用域内。当函数返回时，局部作用域结束，名称也随之遗忘。


    ### 嵌套函数：闭包作用域


    闭包或非局部作用域（nonlocal scope）是在函数嵌套在另一个函数内部时设计的。闭包作用域最早在 `Python` 2.2 版本中引入。它可以任何闭包函数的局部作用域的局部作用域的形式存在。当你使用闭包
    `Python` 作用域时使用的通常被称为非局部名称（nonlocal names）。


    ### 模块：全局作用域


