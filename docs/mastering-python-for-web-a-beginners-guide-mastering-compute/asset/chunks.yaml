- fmt: '

    - **Maintainable:** Django code is written applying design principles and patterns
    that encourage the creation of maintainable and reusable code. To be precise,
    it makes use of the Don’t Repeat Yourself (DRY) principle so there is no unnecessary
    duplication, reducing the amount of code.

    - **Portable:** Django is written in Python, which runs on many platforms and
    ensures that you are not tied to any particular server and can run your Linux,
    Windows, and Mac OS X applications. Moreover, Django is well-supported by many
    web-hosting providers, who often provide specific infrastructure and documentation
    for hosting Django sites.


    Django has continued to improve, from its first milestone release (1.0) in September
    2008 through to the recently released version 3.1 (2020). With each release, Django
    added new functionality and bug fixes, ranging from support for new types of databases,
    template engines, and caching, to the addition of view functions and classes.
    Today, Django is a thriving, collaborative open source project, with many users
    and contributors. While it still has some features that reflect its origin, Django
    has turned into a versatile framework capable of developing high-profile sites
    like Instagram, Mozilla, National Geographic, Open, Pinterest, and Open Stack.


    ### Is Django Opinionated?


    Web frameworks can often be defined as “opinionated” or “unopinionated.” Opinionated
    frameworks are those with opinions about the “best way” to handle any particular
    issue. They tend to support rapid development in a particular domain because the
    best way to do anything is usually well-understood and well-documented. At the
    same time, they can be less flexible at solving problems outside their main domain
    and tend to offer fewer options for what components and approaches they can use.


    On the other hand, unopinionated frameworks have lesser restrictions on the best
    way to glue components together to achieve a goal, or even what components should
    be utilized. They make it easier for developers to use the most appropriate tools
    to complete a particular task, at the most suited cost.


    Following this logic, we could say that Django is “opinionated,” and therefore
    delivers a set of components to handle most web development tasks and preferred
    ways to use them. However, Django''s decoupled architecture means that you can
    usually choose from a number of different options, or add support for completely
    new ones if necessary.


    ### What Does Django Code Look Like?


    In a typical data-driven website, a web application waits for HTTP requests from
    the web browser. When a request is received, the application calculates what is
    needed based on the URL and possibly information in POST data or GET data. Depending
    on what is required, it may then read or script information from a database or
    perform other tasks required to complete the request. The application will then
    return a response to the web browser, often dynamically creating an HTML page
    for the browser to operate by inserting the retrieved data into placeholders in
    an HTML template.


    Django web applications typically combine the code that handles each of these
    steps into separate files:


    - **URLs:** While it is possible to process requests from every single URL via
    a single function, it is much more convenient to write a separate view function
    to handle each resource. A URL mapper is utilized to redirect HTTP requests to
    the appropriate view based on the request URL. It can also match specific patterns
    of strings or digits that appear in a URL and pass these to a view function as
    data.

    - **View:** A view is a request handler function, which locates HTTP requests
    and returns HTTP responses. Views access the data needed to complete requests
    via models and forward the formatting of the response to templates.

    - **Models:** Models are Python objects that give structure to an application''s
    data, and provide mechanisms to manage and store records in the database.

    - **Templates:** A template is a text file that structures the layout of a file
    (such as an HTML page), with placeholders used to represent actual content.


    Django refers to this overall file organization as the “Model View Template (MVT)”
    architecture. It is similar to the more familiar Model View Controller architecture
    in many ways. A URL mapper is usually stored in a file named `urls.py`. In the
    example below, the mapper (`urlpatterns`) defines a list of mappings between routes
    and corresponding view functions. When an HTTP request is received that has a
    URL matching a specified pattern, then the associated view function will be called
    and passed the request.


    The `urlpatterns` object is a list of `path()` and/or `re_path()` functions (Python
    lists are added using square brackets, where items are separated by commas and
    might have an optional trailing comma. For instance: `[item1, item2, item3,]`).


    The first argument to both methods is a route (pattern) that will be matched.
    The `path()` method uses angle brackets to define parts of a URL that will be
    captured and passed through to the view function as named arguments. The `re_path()`
    function applies a flexible pattern matching approach known as a regular expression.
    The second argument is another function that will be called when the pattern is
    matched. The notation `views.book_detail` shows that the function is called `book_detail()`
    and can be found in a module called `views` (i.e. inside a file named `views.py`)


    ### Handling the Request (views.py)


    Views are the core of the web application, receiving HTTP requests from web clients
    and returning HTTP responses. In the meantime, they maintain the other resources
    of the framework to access databases and render templates.


    The example below shows a minimal view function `index()`, that our URL mapper
    could have called in the previous section. Like all view functions, it receives
    an `HttpRequest` object as a parameter (`request`) and returns an `HttpResponse`
    object. In this case, we should not do anything with the request, and our response
    returns a hard-coded string. To illustrate with an example:


    ### Defining Data Models (models.py)


    Django web applications manage data through Python objects referred to as models.
    Models are designed to structure stored data, including the field types, size,
    default values, selection list options, help text for documentation, and label
    text for forms. The definition of the model is not dependent on the underlying
    database – you can choose one of several as part of your project requirements.
    Once you have decided what database you are going to use, there is no need to
    reach it directly at all – you just write your model structure and Django will
    complete communicating with the database for you.


    The code bit below shows a simple Django model for a `Team` object. It defines
    the team name and team level as character fields and specifies a maximum number
    of characters to be stored for each record. The `team_level` can be one of several
    values, so we describe it as a choice field and provide a mapping between choices
    to be displayed and data to be stored, along with a default value.


    As already mentioned, Python stands for object-oriented programming, a style where
    you organize codes into objects, which include related data and functions for
    operating on that data. Objects can also inherit/extend/derive from other objects,
    sharing common behavior between related objects. It is also possible to create
    multiple specific instances of the type of object based on the model in the class.


    ### Rendering Data (HTML Templates)


    Template systems let you specify the structure of an output document, utilizing
    placeholders for data that will be filled in when a page is generated. Templates
    are often applied to form an HTML, but can also create other types of documents.
    Django supports both its built-in templating system and another popular Python
    library called `Jinja2`.

