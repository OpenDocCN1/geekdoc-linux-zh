  trans: "\n下面的代码显示了 `render()` 函数调用的 HTML 模板可能的内容。此模板的编写原则是：在渲染时它将访问一个名为 `very_old_teams`\
    \ 的列表变量。在 HTML 实体内部，我们有一个表达式，首先检查 `very_old_teams` 变量是否存在，然后在 `for` 循环中对其进行迭代。在每次迭代中，模板会在\
    \ `<li>` 元素中显示每个团队的 `team_name` 值：\n\n在前面的章节中，我们展示了几乎在每个 Web 应用中都会到的主要功能：URL 映射、视图（views）、模型（models）和模板（templates）。Django\
    \ 提供的其他项目包括：\n\n- **表单（Forms）：** HTML 表单旨在收集用户数据并在服务器上处理。Django 提供了设置来简化表单的创建、验证和处理。\n\
    - **用户认证与权限：** Django 拥有强大的用户身份验证和权限系统，旨在确保系统安全。\n- **缓存（Caching）：** 动态创建内容在技术上比提供静态内容密集得多。Django\
    \ 提供了灵活的缓存机制，允许你存储整个或部分渲染后的页面，这样在不需要时就不会重新渲染。\n- **管理站点（Administration site）：**\
    \ 当你创建一个网站应用时，默认会包含 Django 管理站点。它为站点管理员提供管理页面变得简单得多，方便创建、编辑和查看网站上的任何数据模型。\n- **数据序列化（Serializing\
    \ data）：** 使用 Django，可以很容易地将数据序列化为 XML 或 JSON 并提供。这在创建一个为其他应用程序提供数据且自身不显示任何内容的\
    \ Web 服务，或者在创建一个由客户端代码处理所有数据渲染的网站时，特别有用。\n\n此外，Django 还提供了一个开箱即用的管理活动用户界面，并根据你的项目模型自动生成管理\
    \ UI。管理界面依赖于 `django.contrib` 模块。要使其工作，你需要确保在 `myproject/settings.py` 文件的 `INSTALLED_APPS`\
    \ 和 `MIDDLEWARE_CLASSES` 元组导入了某些模块。\n\n对于 `INSTALLED_APPS`，请确保你有 –\n\n在启动服务器之前，为了访问管理界面，你需要初始化数据库并为管理界面创建必要的表或集合，以便其运行。为了启动管理界面，我们需要确保已经为管理界面配置了\
    \ URL。打开 `myproject/url.py`，你应该能看到类似这样的内容：\n\n现在运行服务器：`$ python manage.py runserver`。\n\
    \n## 正则表达式 (REGULAR EXPRESSIONS)\n\n正则表达式，也称为 RE、regexes 或 regex patterns，是嵌入在\
    \ Python 中的微小且高度专业的编程语言代码，通过 `re` 模块提供。使用这种小型语言，你可以为你需要匹配的可能字符串集定义规则；该集合可能由英语句子、电子邮件地址、命令或你喜欢的任何内容组成。\n\
    \n正则表达式模式被编译字节字节码，然后由 C 语言编写的匹配引擎执行。对于专业专家来说，可能需要注意引擎将如何实现给定的 RE，并以特定方式编写 `RE`\
    \ 以产生运行速度更快的字节码。正则表达式语言很小且功能有限，因此并不是所有可能的字符串处理任务都能通过正则表达式完成。有些任务虽然可以用正则表达式完成，但表达式会变得非常复杂。在这些情况下，编写\
    \ Python 代码来完成处理可能会更好；即使 Python 代码的运行速度比一个复杂的正则表达式慢，但它可能更易于理解。\n\n正则表达式定义了一个匹配它的字符串集。最终，该模块中的函数允许你检查特定字符串是否匹配给定的正则表达式，或者给定的正则表达式是否匹配特定字符串。此外，正则表达式可以相互组合形成新的正则表达式；如果\
    \ `A` 和 `B` 都是正则表达式，那么 `AB` 也是一个正则表达式。同样的逻辑，如果字符串 `p` 匹配 `A` 另一个字符串 `q` 匹配 `B`，则字符串\
    \ `pq` 将匹配 `AB`。因此，可以从简单的原始表达式轻松构建复杂的表达式。\n\n正则表达式由特殊字符和普通字符组成。大多数普通字符（如‘A’、‘a’或‘0’）是最简单的正则表达式；它们只需匹配自身。某些字符（如\
    \ `|` 或 `(`）是特殊的。特殊字符要么代表普通字符类，要么影响其周围正则表达式的解释方式。\n\n重复限定符（`*`、`+`、`?`、`{m,n}`\
    \ 等）不能直接嵌套。这避免了与非贪婪修饰后缀 `?` 以及其他实现中的修饰之间的歧义。要在内部重复应用第二次重复，可能需要括号。例如，表达式 `(?:a{6})*`\
    \ 匹配任意六的倍数的 ‘a’ 字符。\n\n特殊字符是：\n\n- `.`\n    在默认模式下，点匹配换行符以外的任何字符。如果添加了 `DOTALL`\
    \ 标志，它匹配任何字符，包括换行符。\n- `^`\n    脱符号位于字符串开头，在 `MULTILINE` 模式下也会匹配每个换行符之后。\n- `$`\n\
    \    匹配字符串末尾或字符串末尾换行符之前，在 `MULTILINE` 模式下也会匹配换行符之前。\n- `*`\n    导致生成的 `RE` 匹配前一个\
    \ `RE` 的 0 次或多次重复，尽可能多重复。`ab*` 将匹配 ‘a’、‘ab’或‘a’ 后跟任意数量的 ‘b’。\n- `+`\n    导致生成的\
    \ `RE` 匹配前一个 `RE` 的 1 次或多次重复。`ab+` 将匹配 ‘a’ 后跟非零数量的 ‘b’。\n- `?`\n    导致生成的 `RE`\
    \ 匹配前一个 `RE` 的 0 次或 1 次重复。`ab?` 将匹配 ‘a’ 或 ‘ab’。\n- `*?`、`+?`、`??`\n    `*`、`+`\
    \ 和 `?` 限定符尽可能多地匹配。例如，如果 `RE` `<.*>` 匹配 ‘<a> b <c>’，它将匹配整个字符串而只是 ‘<a>’。在限定符后添加\
    \ `?` 会使其以最小方式执行匹配；尽可能少地匹配字符。使用 `RE` `<.*?>` 将只匹配 ‘<a>’。\n- `{m}`\n    指定匹配恰好\
    \ `m` 次之前的 RE；匹配不足会导致整个 `RE` 不匹配。例如，`a{6}` 将匹配六个 ‘a’ 字符，而不是五个。\n- `{m,n}`\n  \
    \  导致生成的 `RE` 匹配从 `m` 到 `n` 次的前一个 RE 重复，尝试尽可能多次。例如，`a{3,5}` 将匹配 3 到 5 个“a”字符。省略\
    \ `m` 指定下界为零，省略 `n` 指定无限上限。例如，`a{4,}b` 将匹配 ‘aaaab’ 或数千个 ‘a’ 字符后跟一个 ‘b’，但不会匹配 ‘aaab’。逗号不能省略，否则修饰符将与之前描述的形式混淆。\n\
    - `{m,n}?`\n    导致生成的 `RE` 匹配从 `m` 到 `n` 次的前一个 RE 重复，尝试尽可能少地重复。这是前一个限定符的非贪婪版本。例如，在\
    \ 6 字符字符串 ‘aaaaaa’ 上，`a{3,5}` 将匹配 5 个 ‘a’ 字符，而 `a{3,5}?` 将仅匹配 3 个字符。\n- `\\`\n\
    \    转义特殊字符（允许你匹配像‘*’、‘?’这样的字符），或者指示特殊序列；特殊序列将在下文中讨论。\n\n"
- fmt: '

    It is also worth noting that special characters lose their special meaning inside
    sets. For example, `[(+*)]` will match any of the literal characters `(`, `+`,
    `*`, or `)`. Character classes such as `\w` or `\S` (defined below) are also accepted
    inside a set, although the characters they match depends on whether ASCII or LOCALE
    mode is in force.


    Characters that are not within a range can be matched by complementing the set.
    If the first character of the set is `^`, all the characters that are not in the
    set will be matched. For instance, `[^5]` will match any character except `5`,
    and `[^^]` will match any character except `^`. `^` has no special meaning if
    it''s not the first character in the set.


    ### `|`


    `A|B`, where `A` and `B` can be arbitrary REs, creates a regular expression that
    will match either `A` or `B`. An arbitrary number of REs can be separated by the
    `|` in this way. As the target string is scanned, REs separated by `|` are tried
    from left to right. When one pattern completely matches, that branch is accepted.
    This means that once `A` matches, `B` will not be tested further, even if it would
    produce a longer overall match. In other words, the `|` operator is never greedy.
    To match a literal `|`, use `\|`, or enclose it inside a character class, as in
    `[|]`.


    ### `(...)`


    Matches whatever regular expression is inside the parentheses, and indicates the
    start and end of a group; the contents of a group can be retrieved after a match
    has been performed, and can be matched later in the string with the `\number`
    special sequence, described below. To match the literals `(` or `)`, use `\(`
    or `\)`, or enclose them inside a character class: `[(]`, `[)]`.


    ### `(?...)`


    This is an extension notation where the first character after the `?` determines
    what the meaning and further syntax of the construct is. Extensions usually do
    not create a new group; `(?P<name>...)` is the only exception to this rule. Following
    are the currently supported extensions.


    ### `(?aiLmsux)`


    (One or more letters from the set `a`, `i`, `L`, `m`, `s`, `u`, `x`.) The group
    matches the empty string; the letters set the corresponding flags: `re.A` (ASCII-only
    matching), `re.I` (ignore case), `re.L` (locale-dependent), `re.M` (multi-line),
    `re.S` (dot matches all), `re.U` (Unicode matching), and `re.X` (verbose), for
    the entire regular expression. (The flags are described in Module Contents.) This
    is useful if you wish to include the flags as part of the regular expression,
    instead of passing a flag argument to the `re.compile()` function. Flags should
    be used first in the expression string.


    ### `(?:...)`


    A non-capturing version of regular parentheses. Matches whatever regular expression
    is inside the parentheses, but the substring matched by the group cannot be retrieved
    after performing a match or referenced later in the pattern.


    ### `(?aiLmsux-imsx:...)`


    (Zero or more letters from the set `a`, `i`, `L`, `m`, `s`, `u`, `x`, optionally
    followed by `-` followed by one or more letters from the `i`, `m`, `s`, `x`.)
    The letters set or remove the corresponding flags: `re.A` (ASCII-only matching),
    `re.I` (ignore case), `re.L` (locale-dependent), `re.M` (multi-line), `re.S` (dot
    matches all), `re.U` (Unicode matching), and `re.X` (verbose), for the part of
    the expression. (The flags are described in Module Contents.)


    The letters `a`, `L` and `u` are mutually exclusive when used as inline flags,
    so they should not be combined or follow `-`. Instead, when one of them appears
    in an inline group, it overrides the matching mode in the enclosing group. In
    Unicode patterns `(?a:...)` switches to ASCII-only matching, and `(?u:...)` switches
    to Unicode matching (default). In byte pattern `(?L:...)` switches to locale depending
    matching, and `(?a:...)` switches to ASCII-only matching (default). This override
    is only in effect for the narrow inline group, and the original matching mode
    is restored outside of the group.


    ### `(?P<name>...)`


    Similar to regular parentheses, but the substring matched by the group is accessible
    with the symbolic group name. Group names must be valid Python identifiers, and
    each group name must be defined only once within a regular expression. A symbolic
    group is also a numbered group, just as if the group were not named.


    ### `(?P=name)`


    A backreference to a named group; it matches whatever text was matched by the
    earlier group named `name`.


    ### `(?#...)`


    A comment; the contents of the parentheses are simply ignored.


    ### `(?=...)`


    Matches if `…` matches next, but does not consume any of the string. This is called
    a lookahead assertion. For example, `Isaac(?=Newton)` will match `Isaac` only
    if it''s followed by `Newton`.


    ### `(?!...)`


    Matches if `…` does not match next. This is a negative lookahead assertion. For
    example, `Isaac(?!Newton)` will match `Isaac` only if it is not followed by `Newton`.


    ### `(?<=...)`


    Matches if the current position in the string is preceded by a match for `…` that
    ends at the current position. This is called a positive lookbehind assertion.
    `(?<=abc)def` will find a match in `abcdef`, since the lookbehind will back up
    3 characters and check if the contained pattern matches. The contained pattern
    must only match strings of some fixed length, meaning that `abc` or `a|b` are
    allowed, but `a*` and `a{3,4}` are not. Note that patterns that start with positive
    lookbehind assertions will not match at the beginning of the string being searched;
    you will most likely want to use the `search()` function rather than the `match()`
    function.


    This example looks for a word following a hyphen:


    ### `(?<!...)`


    This is called a negative lookbehind assertion. Similar to positive lookbehind
    assertions, the contained pattern must only match strings of some fixed length.
    Patterns that start with negative lookbehind assertions may match at the beginning
    of the string being searched.


    ### `(?(id/name)yes-pattern|no-pattern)`


    Will try to match with `yes-pattern` if the group with given name exists, and
    with `no-pattern`, if it does not. For example, `(<)?(\w+@\w+(?:\.\w+)+)(?(1)>|$)`
    is a poor email matching pattern, which will match with `user@host.com` as well
    as `user@host.com,` but not with `<user@host.com` nor `user@host.com>`.


    ### `\number`


    Matches the contents of the group of the same number. Groups are numbered starting
    from 1. For example, `(.+) \1` matches `the the` or `55 55`, but not `thethe`
    (note the space after the group). This special sequence can only be used to match
    one of the first 99 groups. If the first digit of the number is 0, or the number
    is 3 octal digits long, it will not be interpreted as a group match, but as the
    character with octal value number. Inside the `[` and `]` of a character class,
    all numeric escapes are treated as characters.


    ### `\A`


    Matches only at the start of the string.


    ### `\b`


    Matches the empty string, but only at the beginning or end of a word. A word is
    defined as a sequence of word characters. Note that formally, `\b` is defined
    as the boundary between `\w` and `\W` character (or vice versa), or between `\w`
    and the beginning/end of the string.


    Unicode alphanumerics are the ones used in Unicode patterns, but this can be changed
    by using the ASCII flag. Word boundaries are defined by the current locale if
    the `LOCALE` flag is used. Inside a character range, `\b` represents the backspace
    character, for compatibility with Python''s string literals.


    ### `\B`


    Matches the empty string, but only when it is not at the beginning or end of a
    word. This means that `r''py\B''` matches `python`, `py3`, `py2`, but not `py`,
    `py.`, or `py!`. `\B` is just the opposite of `\b`, so word characters in Unicode
    patterns are Unicode alphanumerics or the underscore, although this can be changed
    by using the ASCII flag. Word boundaries are determined by the current locale
    if the `LOCALE` flag is used.


    ### `\d`

