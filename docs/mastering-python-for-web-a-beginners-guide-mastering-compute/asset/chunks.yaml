    应用。


    Django 最初于 2003 年由 Adrian Holovaty 和 Simon Willison 作为 Lawrence Journal-World
    报社的一个内部项目启动的。它于 2005 年发布，并以爵士吉他手 Django Reinhardt 命名。当该框架被完全开发到可以处理多个高流量网站时，它变成了一个由全球世界贡献者参与的开源项目。Django
    遵循以下设计哲学：


    *   **松散耦合：** Django 希望让其技术栈中的每个元素都相互独立。

    *   **更少的代码：** 更少的代码意味着快速的开发。

    *   **不要重复自己 (DRY)：** 一切都应该只在一个精确的地方开发，而不是重复多次。

    *   **快速开发：** Django 的哲学是尽一切所能地促进超快速开发。

    *   **简洁设计：** Django 在其整个代码中严格保持简洁的设计，并易于遵循潮流的 Web 开发实践。


    Django 由经验开发者构建，处理了 Web 开发的大部分工作，因此你可以专注于编写自己的应用程序，而不必重新调整任何工具。此外，该框架是免费且开源的；拥有繁荣且活跃的社区、优秀的文档以及许多开发支持选项。以下是使用
    Django 的其他一些优势：


    *   **对象关系映射支持：** Django 在数据模型和数据库引擎之间提供了互连服务，并支持包括 MySQL、Oracle 和 Postgres 在内的大量数据库系统。

    *   **多语言支持：** Django 通过其内置的国际化系统支持多语言网站。通过 Django，你可以开发支持多种语言的网站。

    *   **框架支持：** Django 内置对 Ajax、RSS、缓存以及各种其他框架的支持。

    *   **管理界面 GUI：** Django 为管理活动提供了一个极佳且实用的用户界面。

    *   **开发环境：** Django 自带一个轻量级 Web 服务器，支持端到端的应用开发和测试。


    凭借上述特性，Django 可以帮助你编写出以下网站或软件：


    *   **完整性：** Django 致力于提供开发者可能需要的几乎所有开箱即用的功能 (`out of the box`）。因为你需要的一切都是 Django
    服务的一部分，它们都协同工作，遵循一致的设计模式，并拥有详尽且最新的文档。

    *   **多功能性：** Django 可用于构建几乎任何类型的网站，从内容管理系统到社交网络和新闻网站。它可以管理任何客户端框架，并能以几乎任何格式交付内容。同时，它为你可能需要的几乎任何功能提供了选择，并在需要时也可以扩展使用其他组件。

    *   **安全性：** Django 通过提供自动保护网站的框架，帮助开发者避免许多常见的安全错误。例如，Django 提供了一种安全管理账户和密码的方法，避免了常见的错误，如将会话信息放在易受攻击的
    Cookie 中，或直接存储密码而非哈希值。Django 可以通过通过哈希函数运行密码并将输出与存储的哈希值进行比较，检查输入的密码是否正确。Django
    默认即可防御许多漏洞，包括 SQL 注入、跨站脚本和跨站请求伪造。


