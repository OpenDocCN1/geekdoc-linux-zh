    DOI: [10.1201/9781003229896-2](https://doi.org/10.1201/9781003229896-2)\n\n##\
    \ IN THIS CHAPTER\n\n* Introducing main Python data types\n* Talking about each\
    \ type's in-built method descriptions\n* Explaining how to access, update and\
    \ modify Python data types\n\nData analysis is a very important field at the moment.\
    \ Most companies would like to have a professional data analyst on board to take\
    \ care of a massive database and prevent any unexpected errors from happening.\
    \ A good data analyst is one who knows how to use various programming tools to\
    \ manage large amounts of complex data and find relevant information from it.\
    \ In short, if you are the one looking for a place in the ever-evolving IT area,\
    \ potentially as a data analyst, you need to start investing in skills in the\
    \ following areas, in order to be valued in the workplace:\n\n* **Domain Expertise:**\
    \ You need to have domain expertise to be able to process big data and come up\
    \ with insights that are relevant to their workplace.\n* **Programming Skills:**\
    \ Data analysts should possess programming skills to know the right libraries\
    \ to use in order to clean data, mine, and gain insights from it.\n* **Statistics:**\
    \ An analyst will not be able to derive full meaning from data without knowing\
    \ how to use some basic statistical tools.\n* **Visualization Skills:** A data\
    \ analyst cannot present raw data as a result of their work, he would need to\
    \ have great data visualization skills, in order to summarize and present comprehensive\
    \ data to a third party.\n* **Storytelling:** At last, an analyst needs to communicate\
    \ their findings to a stakeholder or client. This means that they will not only\
    \ have to create a data story but also have the ability to narrate it.\n\n![A\
    \ person types on the keyboard of a laptop. Text on the left reads, Python Data\
    \ Types.](images/fig2_1.jpg)\n\nA data type is basically just an internal construct\
    \ that a programming language uses to store and manipulate the rest of the data.\
    \ Despite how well Python works, at some point in data analysis processes, everyone\
    \ will likely need to explicitly convert data from one type to another. In this\
    \ chapter, we will discuss the basic Python data types, how they map, and what\
    \ are the options for converting from one data type to another. Simply said, data\
    \ types are the classification or categorization of data items. Python supports\
    \ the following built-in data types:\n\n* **Scalar types**\n    * **Int:** Integers\
    \ stand for positive or negative whole numbers (without a fractional part). Bitwise\
    \ operations that are used in bit-level programming, only make sense for integers.\
    \ The priorities of the binary bitwise operations are all lower than the numeric\
    \ operations and higher than the comparisons. And the unary operation `~` has\
    \ the same priority as the other unary numeric operations (`+` and `-`).\n\nThis\
    \ table lists the bitwise operations sorted in ascending priority:\n\n| x \\|\
    \ y | bitwise or of x and y |\n| :--- | :--- |\n| x ^ y | bitwise exclusive or\
    \ of x and y |\n| x & y | bitwise and of x and y |\n| x ≪ n | x shifted left by\
    \ n bits |\n| x ≫ n | x shifted right by n bits |\n| ~x | the bits of x inverted\
    \ |\n\n### Additional Methods on Integer Types\n\nThe `int` type implements the\
    \ numbers and integral abstract base class. In addition, it provides a few more\
    \ operational methods:\n\n1. `int.bit_length()`: Return the number of bits necessary\
    \ to represent an integer, excluding the sign and leading zeros.\n2. `int.to_bytes(length,\
    \ byteorder, signed=False)`: Return an array of bytes representing an integer.\n\
    3. `int.from_bytes(bytes, byteorder, signed=False)`: Return the integer represented\
    \ by the given array of bytes.\n4. `int.as_integer_ratio()`: Return a pair of\
    \ integers whose ratio is exactly equal to the integer and with a positive denominator.\
    \ The integer ratio of integers (whole numbers) is always the integer as the numerator\
    \ and 1 as the denominator.\n\n* **Float:** Represents real number with a floating-point\
    \ representation in which a fractional component is denoted by a decimal symbol\
    \ or scientific notation. The `float` type implements the numbers and real abstract\
    \ base class. It also has the following additional methods:\n\n1. `float.as_integer_ratio()`:\
    \ Return a pair of integers whose ratio is exactly equal to the original float\
    \ and with a positive denominator.\n2. `float.is_integer()`: Return True if the\
    \ float instance is finite with integral value, and False otherwise.\n3. `float.hex()`:\
    \ Return a representation of a floating-point number as a hexadecimal string.\
    \ For finite floating-point numbers, this representation will always include a\
    \ leading 0x and a trailing p and exponent.\n4. `float.fromhex(s)`: Class method\
    \ to return the float represented by a hexadecimal string s. The string s may\
    \ have leading and trailing whitespace.\n\n* **Complex:** A number that consists\
    \ of a real and imaginary component represented as x + 2y.\n* **Bool:** Data that\
    \ has one of two built-in values True or False. Notice that `True` and `False`\
    \ are capital.\n* **None:** The `None` represents the null object in Python or\
    \ by functions that do not explicitly return a value.\n* **Sequence type:** A\
    \ sequence means an ordered collection of similar or different data types. Python\
    \ has the following built-in sequence data types:\n"
