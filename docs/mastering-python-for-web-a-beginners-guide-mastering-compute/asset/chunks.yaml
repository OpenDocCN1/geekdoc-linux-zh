    comments to code, make sure you remove previous comments that have become irrelevant
    so that your code stays clean and explicit.


    You can also utilize the comments option as part of the debugging process. Try
    commenting out one of your old codes and see how that affects your overall output.
    If you agree with the change, then do not leave the code commented out in your
    program, as it might decrease readability. Instead, delete it and use version
    control in case you need to bring it back.


    At last, you can apply comments to describe problematic parts of your own code.
    It usually happens that you put a project down and then have to come back to it
    months or years later. In this case, you will spend a lot of time trying to get
    reacquainted with what you scripted before. To avoid that, the best thing you
    can do is mark your thoughts and plans down so that it will be easier to get back
    up to speed later on.


    ### When Writing Code for Others


    People tend to skip and jump back and forth through text, the same applies to
    reading code. The only time one might be forced to read through the code line
    by line is when it is not working and you have to figure out what is the error
    about. In most other cases, you will take a quick look at variables and function
    definitions in order to get the idea. Having comments in simple English can really
    assist a developer to realize what is happening.


    Therefore, try being nice to your fellow developers and use comments to help them
    grasp the purpose of your code. Inline comments should be used sparingly to clear
    up bits of code that are not definite on their own. And shall you have a complicated
    method or function that is not easily understandable; you may want to include
    a short comment after the def line to give some context to it:


    This can help other professionals who are skimming your code to get an idea of
    what the function does. As for other public functions, you might want to include
    an associated docstring, whether it is complicated or not:


    This string will become the .__doc__ attribute of your function and will officially
    be associated with that specific method. The Python PEP 257 docstring guideline
    can help you to structure your docstring by offering sets of conventions that
    developers are most likely to use when structuring docstrings.


    The PEP 257 guidelines also have conventions for multiline docstrings. These docstrings
    appear right at the top of a file and include a high-level overview of the entire
    script and what it is supposed to represent:


    Docstrings do appear in the bytecode, so you can access this through the ``__doc__``
    attribute. A module-level docstring like this one has to contain any essential
    or practical information for the developer reading it. When writing one as such,
    it is recommended to include all classes, exceptions, and functions as well as
    a one-line summary for each.


    ## PYTHON COMMENTING WORST PRACTICES


    Just as there are examples of good practices for writing Python comments, there
    are a few malpractices of comments that do not lead to decent Pythonic code. The
    following are just a few of them:


    *   **Avoid unconcise comments:**'
