    \n*   用 Python 本身编写的程序，通常使用 `PyPy` 解释器。\n*   用 C 编写的程序通过 `CPython` 运行，这是该语言的核心实现。\n\
    *   用 Java 编写的程序通过 `Jython` 运行。\n*   用 `.NET` 实现的程序，通常使用开源的 `IronPython` 解释器。\n\
    \n上述解释器示例能够以两种不同的方式运行 Python 代码：作为脚本或模块，或者作为编写到交互式会话中的代码。尽管如此，无论解释器采用何种形式，你编写的代码都必须由该程序运行。因此，能够实现\
    \ Python 脚本的首要条件是在你的系统中正确安装了解释器。\n\n当你开始运行 Python 脚本时，一个多步骤的过程就会启动。在这个过程中，解释器将：\n\
    \n*   按顺序处理你脚本中的所有语句。\n*   将源代码编译为中间格式，也称为 `bytecode`（字节码）。\n    在这种情况下，此 `bytecode`\
    \ 被作将代码翻译为平台无关的低级语言的工具。它的主要目的是优化代码实现。因此，当解释器下一次运行你的代码时，它将跳过此编译过程。简单来说，这种代码优化仅对于处理模块或其他导入的文件是必要的，而对于可执行脚本则不是。\n\
    *   发送代码执行。\n    在这一步，被称为 Python 虚拟机（`PVM`）的东西出现了。`PVM` 是运行时引擎，用于迭代你的 `bytecode`\
    \ 指令并逐个测试和运行它们。`PVM` 不仅仅是 Python 的独立组件，它是你需要在机器上安装的 Python 系统的组成部分。从技术上说，`PVM`\
    \ 是所谓的 Python 解释器的最后一步。\n\n运行 Python 脚本的整个过程被称为 Python 执行模型。此外，还有许多其他运行 Python\
    \ 脚本的方法：\n\n### 使用 Python 命令\n\n`python` 命令是运行 Python 脚本最基础、最实用的方法。使用 `python`\
    \ 命令运行 Python 脚本，你需要做的只是打开命令行并输入 `python` 单词（如果你同时拥有这两个版本，则输入 `python3`），随后是你的脚本路径。例如：\n\
    \n如果一切运行正常，那么在按下回车键后，你将在屏幕上看到 `Hello There!` 字样。通过这些简单的步骤，你就运行了一个 Python 脚本。但如果没有正常运行，建议检查你的系统\
    \ `PATH`、Python 安装情况、创建 `hello.py` 脚本的方式以及保存它的位置。\n\n有时，保存脚本的输出以便以后分析也是很有用的。你可以按照以下方法：\n\
    \n```bash\npython hello.py > output.txt\n```\n\n此操作将你脚本的输出重定向到 `output.txt`，而不是标准系统输出（`stdout`）。该过程被称为流重定向，在\
    \ Windows 和类 Unix 系统上均可用。如果 `output.txt` 不存在，它会自动创建。另一方面，如果文件已存在，其内容将被新输出替换。\n\
    \n因此，如果你想将连续执行的输出添加到 `output.txt` 的末尾，你必须使用两个角括号（`>>`）而不是一个，就像这样：\n\n```bash\n\
    python hello.py >> output.txt\n```\n\n### 使用脚本文件名\n\n在最近的 Windows 版本中，通过在命令行空间输入包含代码的文件名即可方便地运行\
    \ Python 脚本：\n\n```bash\nhello.py\n```\n\n此之所以可行，是因为 Windows 有系统注册表和文件关联，用于指定使用哪个程序来运行特定文件。在类\
    \ Unix 系统（如 `GNU/Linux`）上，你可以通过在第一行添加文本 `#!/usr/bin/env python` 来实现类似的操作，就像处理\
    \ `hello.py` 一样。\n\n对于 Python 来说，这翻译为一个简单的注释，但此行指示了操作系统必须激活哪个程序来运行该文件。此行以 `#!`\
    \ 字符组合开头，通常称为 hashbang 或 shebang，并随后是解释器的路径。指定解释器路径有两种方法：\n\n*   `#!/usr/bin/python`：用于指定绝对路径。\n\
    *   `#!/usr/bin/env python`：用于你使用操作系统的 `env` 命令时，该命令通过搜索 `PATH` 环境变量来定位并实现 Python。\n\
    \n最后一个选项对于类 Unix 系统在不同位置定位解释器非常有用。最终，要执行像这样的脚本，你需要给它分配执行权限，然后在命令行中输入文件名。\n\n###\
    \ 如何交互式运行 Python 脚本\n\n从交互式会话中运行 Python 脚本和模块也是可行的。这种可能性为你提供了各种可能。当你利用导入模块时，你可以加载其内容以备日后访问和使用。这个过程有趣的一点在于，`import`\
    \ 在其最后一步运行代码。\n\n如果模块只包含类、函数、变量和常量的定义，你可能无法跟踪代码是否已实际运行，但当模块包含了对函数、方法或其他生成可见结果语句的调用时，你就能观察到它的执行。这为你提供了运行\
    \ Python 脚本的另一种选项：\n\n```python\nimport hello\n```\n\n你应该注意，此选项在每个会话中仅有效一次。在第一次\
    \ `import` 之后，后续的 `import` 执行将没有用，即使你修改了模块的内容。这是因为 `import` 操作是有开销的，且只能运行一次。用示例来说明：\n\
    \n```python\nimport hello\nimport hello\n```\n\n这两个 `import` 操作什么都不做，因为 Python\
    \ 知道 `hello` 已经导入了。然而，这种方法的生效还有一些要求——首先，带有 Python 代码的文件必须位于你的当前工作目录。其次，文件应该位于\
    \ Python 模块搜索路径（`PMSP`）中，Python 在那里可以查找你导入的模块和包。\n\n### 如何从 IDE 或文本编辑器运行 Python\
    \ 脚本\n\n在编写更大更复杂的应用程序脚本时，建议使用集成开发环境（IDE）或高级文本编辑器。这些程序中的大部分都有能力在环境内部运行你的脚本。它们通常包含一个\
    \ `Run` 或 `Build` 命令，该命令通常从工具栏或主菜单中可用。\n\nPython 的标准发行包已经包含了 `IDLE` 作为默认 IDE，你可以用它编写、调试、修改，以及运行你的模块和脚本。其他\
    \ IDE 如 `Eclipse-PyDev`、`PyCharm`、`Eric` 和 `NetBeans` 也允许你在环境内部运行 Python 脚本。此外，你还有如\
    \ `Sublime Text` 和 `Visual Studio Code` 等高级文本编辑器，它们也允许你运行 Python 脚本。\n\n### 如何从文件管理器运行\
    \ Python 脚本\n\n在文件管理器中通过双击图标运行脚本是运行 Python 脚本的另一种简单方法。这种选项在开发阶段可能并不流行，但当你准备好发布代码用于生产环境时，它可能很有用。然而，为了能够通过双击运行脚本；你需要满足一些条件，这些条件取决于你的操作系统。\n\
    \n"
