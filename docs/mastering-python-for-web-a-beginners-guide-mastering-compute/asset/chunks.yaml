  trans: "\n* **字符串 (String)**：字符串值简单地表示放在单引号、双引号或三引号中的一个或多个字符的集合。\n* **列表 (List)**：这里的列表表示一个或多个数据项的有序集合，类型不一定相同，但放在方括号中。\n\
    * **元组 (Tuple)**：`Tuple` 对象是一个一个或多个数据项的有序集合，类型不一定相同，放在括号中。\n\n## 映射类型\n\n* **字典\
    \ (Dictionary)**：字典 `Dict()` 对象是以键值对形式存储的数据集合。此类键值对必须包含在大括号中。例如：`{1:“Sam,” 2:“Ben,\
    \ 3:“Roy, 4:“Molly”}`\n\n## 集合类型\n\n* **set**：Python 中的 `set` 与数学中 `set` 的实现相同。`set`\
    \ 对象具有适当的方法来执行数学集合操作，如并集、交集、差集等。在脚本中，它是一个变的、无序的唯一可哈希对象集合。\n* **frozenset**：与普通的\
    \ `set` 不同，`frozen` 是集合的不可变版本，其元素从其他数据类型添加。\n\n## 可变与不可变类型\n\n上述数据类型的可变数据对象存储在计算机内存中处理。这些值某些可以在处理过程中被修改，但一旦在内存中创建，其内容就无法更改。数字、字符串和\
    \ `Tuples` 是不可变的，这意味着它们的内容在创建后无法更改。\n\n## 迭代器类型\n\nPython 支持对容器进行迭代的概念，并使用容器用户定义的类来支持迭代。下文更详细描述的序列始终支持以下迭代方法：\n\
    \n1. `container.__iter__()()`：返回一个迭代器对象。此过程是支持下文描述的迭代器协议所需的，如果容器支持不同类型的迭代，可以提供额外的方法来专门请求特定迭代类型的迭代器。该方法对应\
    \ Python/C 应用程序接口 (API) 中 Python 对象类型结构中的 `tp_iter` 槽。\n\n   迭代器对象本身需要支持以下两个方法，它们共同形成了迭代器协议：\n\
    \n2. `iterator.__iter__()()`：返回迭代器本身。这是为了允许容器和迭代器都能用于 `for` 和 `in` 语句。该方法对应 Python/C\
    \ API 中 Python 对象类型结构中的 `tp_iter` 槽。\n\n3. `iterator.__next__()()`：返回容器中的下一个项目。如果没有更多项目，则抛出\
    \ `StopIteration` 异常。该方法对应 Python/C API 中 Python 对象类型结构中的 `tp_iternext` 槽。一旦迭代器的\
    \ `__next__()` 方法抛出 `StopIteration`，它在随后的调用中必须继续抛出。不遵守此属性的实现被认为是有缺陷的。\n\nPython\
    \ 定义了若干迭代器对象，以支持对通用和特定序列类型、字典以及其他专门的形式进行迭代。除了实现迭代器协议之外，具体的类型本身并不重要。\n\nPython\
    \ 中另一个重要的脚本项是**运算符 (Operators)**。它们被用于对变量和值执行操作。Python 将运算符分为以下几组：\n\n1. 赋值运算符\n\
    2. 算术运算符\n3. 逻辑运算符\n4. 比较运算符\n5. 身份运算符\n6. 位运算符\n7. 成员运算符\n\n算术运算符用于数值值以执行常见的数学操作：\n\
    \n| 运算符 | 名称 | 示例 |\n| --- | --- | --- |\n| + | 加法 | `x + y` |\n| - | 减法 | `x\
    \ - y` |\n| * | 乘法 | `x * y` |\n| / | 除法 | `x / y` |\n| % | 取模 | `x % y` |\n|\
    \ ** | 幂 | `x ** y` |\n| // | 整除 | `x // y` |\n\n### Python 赋值运算符\n\n赋值运算符用于给变量赋值：\n\
    \n| 运算符 | 示例 | 等同于 |\n| --- | --- | --- |\n| = | `x = 5` | `x = 5` |\n| += | `x\
    \ += 3` | `x = x + 3` |\n| -= | `x -= 3` | `x = x - 3` |\n| *= | `x *= 3` | `x\
    \ = x * 3` |\n| /= | `x /= 3` | `x = x / 3` |\n| %= | `x %= 3` | `x = x % 3` |\n\
    | //= | `x //= 3` | `x = x // 3` |\n| **= | `x **= 3` | `x = x ** 3` |\n| &= |\
    \ `x &= 3` | `x = x & 3` |\n| |= | `x |= 3` | `x = x | 3` |\n| ^= | `x ^= 3` |\
    \ `x = x ^ 3` |\n| >>= | `x >>= 3` | `x = x >> 3` |\n| <<= | `x <<= 3` | `x =\
    \ x << 3` |\n\n### Python 比较运算符\n\n比较运算符用于比较两个值：\n\n| 运算符 | 名称 | 示例 |\n| --- |\
    \ --- | --- |\n| == | 等于 | `x == y` |\n| != | 不等于 | `x != y` |\n| > | 大于 | `x\
    \ > y` |\n| < | 小于 | `x < y` |\n| >= | 大于等于 | `x >= y` |\n| <= | 小于等于 | `x <=\
    \ y` |\n\n### Python 逻辑运算符\n\n逻辑运算符用于组合语句：\n\n| 运算符 | 描述 | 示例 |\n| --- | --- |\
    \ --- |\n| and | 如果两个语句都为真则返回 True | `x < 5 and x < 10` |\n| or | 如果一个语句为真则返回\
    \ True | `x < 5 or x < 10` |\n| not | 反转结果，如果结果为真则返回 False | `not(x < 5 and x\
    \ < 10)` |\n\n### Python 身份运算符\n\n身份运算符用于比较对象，不是比较是否相等，而是比较它们在内存位置上是否相同：\n\n|\
    \ 运算符 | 描述 | 示例 |\n| --- | --- | --- |\n| is | 如果两个变量相同，返回 True | `x is y` |\n\
    | is not | 如果两个变量不同，返回 True | `x is not y` |\n\n### Python 成员运算符\n\n成员运算符用于测试序列是否在对象中：\n\
    \n| 运算符 | 描述 | 示例 |\n| --- | --- | --- |\n| in | 如果对象中存在指定值的序列，则返回 True | `x in\
    \ y` |\n| not in | 如果对象中不存在指定值的序列，则返回 True | `x not in y` |\n\n### Python 位运算符\n\
    \n位运算符用于比较（二进制）数字：\n\n| 运算符 | 名称 | 描述 |\n| --- | --- | --- |\n| & | 与 | 如果两个位都为\
    \ 1，则将每个位置为 1 |\n| | | 或 | 如果两个位中有一个为 1，则将每个位置为 1 |\n| ^ | 异或 | 如果两个位中只有一个为 1，则将每个位置为\
    \ 1 |\n| ~ | 取 | 反转所有位 |\n| << | 左移 | 通过右侧推零向左移动 |\n| >> | 有符号右移 | 通过复制最左侧位向右移动\
    \ |\n\nPython 中的字符串处理所需的精力最少，因为与其他语言相比，大多数字符串操作的复杂度非常低。尽管如此，在下部分，我们将深入介绍如何在 Python\
    \ 世界中使用、操作和实现数据类型。我们还将检查一些处理数据集的有用函数和修改。现在，不要浪费时间，让我们从字符串类型开始。\n\n## 字符串数据类型\n\
    \n字符串最基本的定义可以是字符的序列，其中序列是一种由若干相同类型元素组成的数据类型，例如整数、浮点数、字符、字符串等。在 Python 中，为所有存在的字符都提供了一个唯一代码。这种编码规范标记为\
    \ Unicode 格式。它包含了几乎所有可能语言的字符以及表情符号。因此，字符串可以被视为一种特殊的序列，其所有元素都是字符。例如，字符串 \"Hello,\
    \ You\" 基本是一个序列 [‘H’, ‘e’, ‘l’, ‘l’, ‘o’, ‘,’, ‘‘, ‘Y’, ‘o’, ‘u’]，其长度可以通过计算序列内部的字符数量来计算。\n\
    \n有几种方法可以管理字符串：\n"
