    \ that once you start adding lambda expressions, you will get used to its operability\
    \ very quickly.\n\n# CHAPTER 5Python's Executional Model\n\nDOI: [10.1201/​9781003229896-5](https://doi.org/10.1201/9781003229896-5)\n\
    \nIN THIS CHAPTER\n\n*   ➢ Learning about Python executional model\n\n*   ➢ Introducing\
    \ concepts of names and namespaces\n\n*   ➢ Characterizing features of Python\
    \ Objects and Classes\n\nThe foundation of any programming language consists of\
    \ a grammar/syntax together with an execution model. The execution model is made\
    \ to specify the behavior of items of the language. By applying it, one can monitor\
    \ the behavior of a program that was written in terms of that programming language.\
    \ Consequently, the observed behavior of a running program should match the behavior\
    \ derived from the execution model. An execution model observes things such as\
    \ a unit of work, and what are the limitations on the order in which those units\
    \ of work take place.\n\nEach programming language has an execution model that\
    \ defines the manner in which the units of work are scheduled for execution. Detailed\
    \ reports of the execution models specification include those of Python and of\
    \ the Unified Parallel C (UPC) programming language.\n\n![](images/fig5_1.jpg)\
    \ <details><summary>Long Description</summary> \n\nA person writes a code on his\
    \ laptop. The wall behind them displays icons for settings, folders, hashtags,\
    \ and other symbols.</details> \n\nA Python program is constructed from code blocks.\
    \ A block stands for a piece of Python program text that is executed as a unit.\
    \ The following are blocks: a module, a function body, and a class definition.\
    \ Each command that is scripted interactively is a block. A script file that represents\
    \ a standard input to the interpreter is a code block; a script command that is\
    \ specified on the interpreter command line with the *“*-c*”* option is a code\
    \ block; and the string argument passed to the built-in functions eval() and exec()\
    \ is a code block too. These code blocks are implemented in an execution frame.\
    \ A frame holds some administrative information that is used for debugging and\
    \ determining where and how execution continues after the code block's implementation\
    \ is completed. The execution of the Python program has 2 steps: compilation and\
    \ interpreter.\n\nCompilation is referred to the process when a program is being\
    \ converted into byte code. Byte code is fixed terms of instructions that represent\
    \ arithmetic, comparison, and memory operations. The byte code instructions are\
    \ created in the. pyc file and can run on any operating system and hardware.\n\
    \nThe interpretation step involves converting the byte code (.pyc file) into machine\
    \ code. This step is essential as the computer can only read from the machine\
    \ or binary code. Python Virtual Machine (PVM) has to understand the operating\
    \ system and processor in the computer and only then convert it into machine code.\
    \ Afterward, these machine code instructions would be executed by the processor\
    \ and with results displayed.\n\nNevertheless, the interpreter inside the PVM\
    \ translates the program line by line, therefore, consuming a lot of time. To\
    \ prevent this from happening, a compiler known as Just In Time (JIT) is added\
    \ to PVM. JIT compiler improves the execution speed of the Python program and\
    \ is widely used in all Python environments like CPython which is standard Python\
    \ software.\n\n## NAMES AND NAMESPACES"
