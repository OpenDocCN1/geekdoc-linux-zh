    \ substring (the last occurrence of the substring) in the given string.\n- `string.index()`:\
    \ Returns the index of the last occurrence of a substring in the given string.\n\
    - `string.rjust()`: Returns the right-justified string with the specified width.\
    \ If the specified width is more than the string length, then the string's remaining\
    \ part is filled with the specified fill char.\n- `string.rpartition()`: Splits\
    \ the string at the last occurrence of the specified string separator `sep` argument\
    \ and returns a tuple containing three elements, the part before the separator,\
    \ the separator itself, and the part after the separator.\n- `string.split()`:\
    \ Splits a string from the specified separator and returns a list object with\
