- fmt: "\nAnd when the installation is complete, you can now run Python 3.9 with the\
    \ `python3.9` command and `pip` with the `pip3` command.\n\n- **Linux Mint and\
    \ Ubuntu 17 and below:** Python 3.9 is not in the Universe repository, so you\
    \ would have to get it from a Personal Package Archive (PPA). For instant, to\
    \ install from the “deadsnakes” PPA, use the following commands:\n    ```bash\n\
    \    $ sudo add-apt-repository PPA:deadsnakes/PPA\n    $ sudo apt-get update\n\
    \    $ sudo apt-get install python3.9 python3-pip\n    ```\n\n### How to Install\
    \ on Debian Linux\n\nBefore you can install Python 3.9 on `Debian`, you will have\
    \ to install the `sudo` command. In order to do that, you should execute the following\
    \ commands in a terminal:\n\nRight after that, try opening the `/etc/sudoers`\
    \ file using the `sudo vim` command or your favorite text editor. Add the following\
    \ line of text to the end of the file, replacing `your_username` with your actual\
    \ username: `your_username ALL=(ALL) ALL`\n\nCompleting that, you can go ahead\
    \ to skip until you reach `How to Build Python From Source Code` section to finish\
    \ installing Python.\n\n### How to Install on openSUSE\n\nBuilding from the source\
    \ is the most reliable way to set up Python on `openSUSE`. To do that, you will\
    \ need to install the development tools, which can be done in `YaST` operating\
    \ system setup via the menus or by using `Zipper`, the command line package manager:\n\
    \nAs it will have to install more than 150 packages, it is considered a normal\
    \ practice that might take a while to complete. But once it is done, feel free\
    \ to skip ahead to the `How to Build Python From Source Code` section.\n\n###\
    \ How to Install on CentOS and Fedora\n\nUnfortunately, Python 3.9 is not available\
    \ in the `CentOS` and `Fedora` repositories, so you are expected to build Python\
    \ from source code. Before you install Python, though, you need to make sure your\
    \ system is prepared beforehand. At first, update the `yum` package manager through\
    \ the following code:\n```bash\n$ sudo yum -y update\n```\n\nAnd once `yum` finishes\
    \ updating, you can freely install the necessary build dependencies with the following\
    \ line of commands:\n\nAnd once you see that everything is finished installing,\
    \ you can skip ahead to the `How to Build Python From Source Code` section.\n\n\
    ### How to Install on Arch Linux\n\n`Arch Linux` is popular for adhering to the\
    \ KISS principle (“Keep It Simple, Stupid”) and mostly focused on modernity and\
    \ pragmatism. That said, `Arch Linux` is fairly diligent about keeping up with\
    \ Python releases. It is very much likely you already have the latest version\
    \ installed by default. If not, you can use the following command to update Python:\
    \ `$ packman -S python`. And once it is finished updating, you are all set to\
    \ start scripting.\n\n## HOW TO BUILD PYTHON FROM SOURCE CODE\n\nIn cases when\
    \ your Linux distribution does not have the latest version of Python, or when\
    \ you just want to be able to build the latest, fastest version yourself, you\
    \ can take the following steps to be able to build Python from source:\n\n####\
    \ Step 1: Download the source code\n\nTo start, you need to get the Python source\
    \ code through the [Python.org](http://Python.org). All you have to do is go to\
    \ the Downloads page and look for the latest source for Python 3 at the top. Make\
    \ sure you are searching for Python 3 and not Python 2.\n\nWhen you select the\
    \ Python 3 version, you can see a “Files” section at the bottom of the page. Select\
    \ `Gzipped source tarball` and download it to your machine. If you prefer a command-line\
    \ method, you can use `Wget` program that retrieves content from web servers to\
    \ download the file to your current directory:\n\nWhen the tarball completes downloading,\
    \ you will then need to take care of other things to prepare your system for building\
    \ Python.\n\n#### Step 2: Prepare your system\n\nThere are a few fixed steps involved\
    \ in building Python from scratch. The aim of each one of those steps is the same\
    \ on all distros, but you might need to translate it to your distribution if it\
    \ does not use `apt-get`:\n\n1. First, make sure you have updated your package\
    \ manager and upgraded your packages:\n\n2. Next, you need to have all of the\
    \ build requirements installed:\n\nAnd if you already have some of the requirements\
    \ installed on your system, it is not going to create any problem because you\
    \ can execute the above commands and any existing packages will not be overwritten.\n\
    \n#### Step 3: Build Python\n\n1. Once you have all the prerequisites and the\
    \ Tape Archive (TAR) files, you can start unpacking the source into a directory.\
    \ Please note that the following command will create a new directory called `Python-3.9.1`\
    \ under the one you’re in:\n\n2. Now, you need to run the `./configure` tool to\
    \ prepare the build:\n```bash\n$ ./configure –enable-optimizations –with-ensurepip=install\n\
    ```\n\nThe `enable-optimizations` flag will enable some optimizations within Python\
    \ to make it run about 10 percent faster. Doing this may add twenty or thirty\
    \ minutes to the compilation time.\n\n3. Next, you build Python using the `-j`\
    \ option that simply tells `make` to split the building into parallel steps to\
    \ speed up the compilation. Even with the parallel builds, this step can take\
    \ several minutes:\n```bash\n$ make -j 8\n```\n\n4. Finally, you will want to\
    \ install your new version of Python. You can use the `altinstall` option here\
    \ to avoid overwriting the system Python. Since you are installing into `/usr/bin`,\
    \ you will need to run as root:\n```bash\n$ sudo make altinstall\n```\n\nThe overall\
    \ installation might take some time, but once it is done, you are advised to verify\
    \ that Python is set up correctly.\n\n#### Step 4: Verify your installation\n\n\
    You can test that the `python3.9 –version` command returns the latest version:\n\
    \nIn case you want to run extra testing, you might also choose the test suite\
    \ to make sure everything is working properly and swiftly on your system. To run\
    \ the test suite, you just have to type the following command:\n\nYou do not need\
    \ to rush this part because your computer will be running tests for some time.\
    \ And if all the tests pass without an error, then you can be confident that your\
    \ brand-new Python build is working as expected.\n\n## HOW TO INSTALL PYTHON ON\
    \ iOS\n\nThe Pythonista software application for `iOS` is a fully developed Python\
    \ creative environment that you can run on your iPhone or iPad. It has all the\
    \ features including a Python editor, technical documentation, and an interpreter,\
    \ all integrated into a single app.\n\nPythonista could be a great tool for someone\
    \ who does not like to be stuck with just the laptop and prefers working or polishing\
    \ their Python skills on the go. The application comes with the complete Python\
    \ 3 standard library and also includes full documentation that you can browse\
    \ offline. To set up Pythonista, all you need to do is download it from the iOS\
    \ app store.\n\n## HOW TO INSTALL PYTHON ON ANDROID\n\nAnd if you are not Apple\
    \ but an Android fan, and want to practice Python from your tablet or phone, it\
    \ has been taken care of as well. Android app that reliably supports Python 3.8\
    \ is `Pydroid 3`. `Hydroid 3` features an interpreter that you can use for read–eval–print\
    \ loop (REPL), interactive language sessions, and it also allows you to edit,\
    \ save, and execute Python code. Additionally, it has built-in C, C++, and even\
    \ Fortran compiler specially for `Pydroid 3`. With it, you can build any library\
    \ from `pip`, as wells as build and install dependencies from a command line.\n\
    \nYou can download and install `Pydroid 3` free version and paid Premium version\
    \ (supports code prediction and code analysis) from the Google Play Store.\n\n\
    ## ONLINE PYTHON INTERPRETERS\n\nIf you are looking for examples and live Python\
    \ tutorials without actually having to set it up on your machine, then there are\
    \ several websites that can offer that online Python interpretation. These cloud-based\
    \ Python interpreters may not be able to execute some of the more complex activities,\
    \ but they are quite adequate for running most of the code and maybe a nice way\
    \ to get started if you are a beginner.\n"
