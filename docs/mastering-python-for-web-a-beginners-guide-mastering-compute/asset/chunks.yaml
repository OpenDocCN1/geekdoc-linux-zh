  trans: "\n\n- **拼接 (Concatenation)：** 拼接简单意味着连接两个字符串。例如将 \"Hello\" 与 \"You\" 合并，形成\
    \ \"HelloYou\"。其写法如下：\n\n  使用一个加号 `+` 即可完成任务。当与字符串配合使用时，`+` 号会连接这两个字符串。另一个包含多个字符串的示例是：\n\
    \n  结果：Name Python had been adapted from Monty Python\n\n- **重复 (Repetition)：**\
    \ 在某些情况下，如果你想在控制台上多次写入相同的文本，例如重复“Hey!” 100 次，你可以一直手动输入（比如写“Hey!Hey!Hey!...”一百百次），或者直接执行以下操作：\n\
    \n  所以，如果你想让用户输入一个数字并根据该数字在控制台上打印 `n` 次文本，你只需要创建一个变量 `n`，使用 `input()` 函数获取用户获取数字，然后直接乘以文本即可：\n\
    \n  结果：TextTextTextText\n\n- **将字符串转换为 Int 或 Float 数据类型：** 这也非常简单。Python 初学者中有一个非常普遍的疑问：数字当包裹在引号中时会变成字符串，如果你尝试对其进行数学运算，将会得到错误。\n\
    \n  在上面的语句中 `123` 不是数字，而是字符串。因此，在这种情况下，为了将数字字符串转换为 float 或 int 数据类型，我们可以使用 `float()`\
    \ 和 `int()` 函数。\n\n  通过这种方式，你可以轻松地对数值执行数学函数。同样，要将 int 或 float 变量转换为字符串，我们可以使用\
    \ `str()` 函数。\n\n  `切片 (Slicing)` 是另一个主要的字符串操作。切片允许你根据起始索引和结束索引提取任何字符串的局部。例如，如果我们有一个字符串并想提取该字符串的某部分或某个字符，可以使用以下语法之一：\n\
    \n- `string_name[starting_index:finishing_index:character_iterate]`\n\n    - `String_name:`\
    \ 代表持有字符串的变量名。\n    - `starting_index:` 是你想要在子字符串中的起始字符的索引。\n    - `finishing_index:`\
    \ 表示你想要的子字符串中最后一个字符索引加 1。\n\nPython 提供了一组可以在字符串上使用的内置方法：\n\n- `str.capitalize()`：返回字符串的副本，其首字母大写，其余字母字母均为小写。\n\
    - `string.casefold()`：返回一个小写的字符串。它与 `lower()` 方法类似，但 `casefold()` 方法会将更多的字符转换为小写。\n\
    - `string.center()`：返回一个指定长度的居中新字符串，并用指定的字符填充。默认字符是空格。\n- `string.count()`：在给定字符串中搜索（区分大小写）指定的子字符串，并返回指示子字符串出现次数的整数。\n\
    - `string.endswith()`：如果字符串以指定的后缀（区分大小写）结尾，则返回 True，否则返回 False。\n- `string.expandtabs()`：返回一个字符串，将所有制表符\
    \ `\\t` 替换为一个或多个空格，取决于 `\\t` 之前的字符数量以及指定的制表大小。\n- `string.find()`：返回子字符串在给定字符串中首次出现的索引（区分大小写）。如果未找到子字符串，则返回\
    \ -1。\n- `string.index()`：返回子字符串在给定字符串中首次出现的索引。\n- `string.isalnum()`：如果字符串中的所有字符都是字母数字的（字母或数字），则返回\
    \ True。否则返回 False。\n- `string.isalpha()`：如果字符串中的所有字符都是字母（大写和小写），则返回 True；如果至少有一个字符不是字母，则返回\
    \ False。\n- `string.isascii()`：如果字符串为空或字符串中的所有字符都是 ASCII 字符，则返回 True。\n- `string.isdecimal()`：如果字符串中的所有字符都是数字字符，则返回\
    \ True。否则返回 False。\n- `string.isdigit()`：如果字符串中的所有字符都是数字或 Unicode 数字字符，则返回 True。否则返回\
    \ False。\n- `string.isidentifier()`：检查字符串是否为有效的标识符字符串。如果字符串是有效标识符，则返回 True，否则返回\
    \ False。\n- `string.islower()`：检查给定字符串的所有字符是否都是小写。如果所有字符都是小写，则返回 True，即使有一个字符是大写也会返回\
    \ False。\n- `string.isnumeric()`：检查字符串的所有字符是否都是数字字符。如果所有字符都是数字，则返回 True，即使有一个字符是非数字的也会返回\
    \ False。\n- `string.isprintable()`：如果给定字符串的所有字符都是可打印的，则返回 True。即使有一个字符是不可打印的也会返回\
    \ False。\n- `string.isspace()`：如果给定字符串的所有字符都是空白符，则返回 True。如果有一个字符不是空白符，则返回 False。\n\
    - `string.istitle()`：检查每个单词的首字母是否为大写，其余是否为小写。如果字符串是标题格式，则返回 True；否则返回 False。忽略符号和数字。\n\
    - `string.isupper()`：如果所有字符都是大写，则返回 True，即使有一个字符不是大写也会返回 False。\n- `string.join()`：返回一个字符串，该字符串是调用它的字符串与作为参数的指定可迭代对象的字符串元素拼接而成的。\n\
    - `string.ljust()`：返回具有指定宽度的左对齐字符串。如果指定的宽度大于字符串长度，则字符串的剩余部分用指定的 `fillchar` 填充。\n\
    - `string.lower()`：返回字符串的副本，其中所有字符都被转换为小写。\n- `string.lstrip()`：通过移除指定参数的开头字符返回字符串的副本。\n\
    - `string.maketrans()`：返回一个映射表，将给定字符串中的每个字符映射到第二个字符串中相同位置的字符。该映射表与 `translate()`\
    \ 方法一起使用，该方法将根据映射表替换字符。\n- `string.partition()`：在指定的字符串分隔符 `sep` 参数首次出现的地方分割字符串，并返回一个包含三个元素的元组：分隔符之前的部分、分隔符本身以及分隔符后的部分。\n\
    - `string.replace()`：返回字符串的副本，其中所有子字符串的出现都被替换为另一个子字符串。\n- `string.find()`：返回子字符串在给定字符串中的最高索引（子字符串最后一次出现）。\n\
    - `string.index()`：返回子字符串在给定字符串中最后一次索引。\n- `string.rjust()`：返回具有指定宽度的右对齐字符串。如果指定的宽度大于字符串长度，则字符串的剩余部分用指定的\
    \ `fill char` 填充。\n- `string.rpartition()`：在指定的字符串分隔符 `sep` 参数最后出现的地方分割字符串，并返回一个包含三个元素的元组：分隔符之前的部分、分隔符本身以及分隔符后的部分。\n\
    - `string.split()`：从指定的分隔符分割字符串并返回一个带有字符串元素的列表对象。\n- `string.rstrip()`：通过移除指定参数的结尾字符返回字符串的副本。\n\
    - `string.splitlines()`：在行边界处分割字符串并返回字符串中行的列表。\n- `string.startswith()`：如果字符串以指定的前缀开头，则返回\
    \ True。否则返回 False。\n\n"
- fmt: '

    * `string.strip()`: Returns a copy of the string by removing both the leading
    and the trailing characters.

    * `string.swapcase()`: Returns a copy of the string with uppercase characters
    converted to lowercase and vice versa. Symbols and letters are ignored.

    * `string.title()`: Returns a string where each word starts with an uppercase
    character, and the remaining characters are lowercase.

    * `string.translate()`: Returns a string where each character is mapped to its
    corresponding character in the translation table.

    * `string.upper()`: Returns a string in the upper case. Symbols and numbers remain
    unaffected.

    * `string.zfill()`: Returns a copy of the string with ‘0’ characters padded to
    the left. It adds zeros (0) at the beginning of the string until the length of
    a string equals the specified width parameter.


    ## SET DATA TYPE


    Another Python''s built-in data type could be characterized in the following way:


    * The set data type has all its elements unique. It is not allowed to duplicate
    set elements.

    * A set itself can be modified, but the elements contained in the set still remain
    of an immutable type.

    * Sets are not ordered.


    Nevertheless, it is very easy to work with sets in Python. You can create a set
    in two ways. First, you can define a set with the built-in `set()` function, to
    illustrate:


    Many of the standard data operations that can be used for Python''s other composite
    data types do not work the same way for sets. For example, sets cannot be indexed
    or sliced. But at the same time, Python provides a whole host of operations on
    set objects that generally imitate the operations that are defined for mathematical
    sets.


    ### Operators and Methods


    Most of the popularly requested set operations in Python can be performed in two
    different ways: by the operator or by a method. We can see how these operators
    and methods typically work, using set union as an example.


    Given two sets, `x1` and `x2`, the union of `x1` and `x2` is a set consisting
    of all elements in either set.


    Consider these two sets:


    Make sure you notice that the element “bass,” which appears in both `x1` and `x2`,
    appears only once in the union because, as we have mentioned earlier, sets never
    contain duplicate values.


