    If a class defines an `__init__()` method, class instantiation automatically invokes
    `__init__()` for the newly-created class instance. So, in this example, a new,
    initialized instance can be achieved by:


    At the same time, the `__init__()` method may have arguments for greater flexibility.
    In that case, arguments given to the class instantiation operator are passed on
    to `__init__()`.


    Objects are individual, but at the same time, multiple names (in multiple scopes)
    can be bound to the same object. This is known as aliasing in other languages.
    This is usually not positively recognized at the first glance at Python, and can
    possibly be ignored when dealing with immutable basic types (numbers, strings,
    tuples). However, aliasing has a potential surprising effect on the semantics
    of Python code involving mutable objects such as lists, dictionaries, and many
    other types. This is usually applied to the advantage of the program since aliases
    are treated like pointers in some manner. For instance, passing an object is cheap
    since only a pointer is passed by the implementation, and if a function modifies
    an object passed as an argument, the caller will see the change – this eliminates
    the need for two different argument passing mechanisms.


    Apart from that, there are also instance objects. And, the only operations that
    instance objects can manage are attribute references. There are two types of valid
    attribute names: data attributes and methods.


    Data attributes have the same features as `instance variables` in Smalltalk, and
    `data members` in C++. And similar to local variables, data attributes do not
    need to be declared as they get activated when they are first assigned to. The
    other type of instance attribute reference is a method. A method is a function
    that is a part of an object. Additionally, in Python, the term method is not exclusive
    to class instances: other object types can have methods as well. For example,
    list objects have methods called `append`, `insert`, `remove`, `sort`, and so
    on. Valid method names of an instance object are based on its class. By default,
    all attributes of a class that are function objects define corresponding methods
    of its instances.


    ### Method Objects


    Normally, a method is called right after it is bound:


    In the `MyClass` standard case, this will return the string `hello world.` Nevertheless,
    it is not necessary to call a method right away: `x.f` is a method object, and
    can be stored away and called at a later time. For example:


    At the same time, you may have noticed that `x.f()` was called without an argument
    above, even though the function definition for `f()` specified an argument. It
    is the special thing about methods that the instance object can pass as the first
    argument of the function. In our case, the call `x.f()` is exactly equivalent
    to `MyClass.f(x)`. In general, calling a method with a list of `n` arguments is
    equivalent to calling the corresponding function with an argument list that is
    created by inserting the method''s instance object before the first argument.
    Understanding how methods function might require actually working to implement
    them. Practice will be useful for clarifying any questions you might still hold.


    ### Inheritance


    For sure, a language feature would not be given the name of a `class` without
    supporting inheritance. The syntax for a derived class definition should look
    like this:


    The name `BaseClassName` must be defined in a scope containing the derived class
    definition. In place of a base class name, you can also place other arbitrary
    expressions. This can be helpful, for instance, when the base class is defined
    in another module:


    Execution of a derived class definition proceeds the same as for a base class.
    When the class object is constructed, the base class is remembered. This is used
    for resolving attribute references: if a requested attribute is not found in the
    class, the search proceeds to look in the base class. This rule is applied recursively
    if the base class itself is derived from some other class.


    There is not anything particularly difficult in derived classes: `DerivedClassName()`
    creates a new instance of the class. Method references are resolved in the following
    manner: the corresponding class attribute is searched, descending down the chain
    of base classes if needed, and the method reference is valid if this yields a
    function object.


    Derived classes may override methods of their base classes. Because methods have
    no special treatment when calling other methods of the same object, a method of
    a base class that calls another method defined in the same base class may end
    up calling a method of a derived class that overrides it. An overriding method
    in a derived class may in fact want to extend rather than simply replace the base
    class method of the same name. There is an easy way to call the base class method
    directly: just call `BaseClassName.methodname`.


    Python also has two built-in functions that work with inheritance:


    1. You can apply `isinstance()` to check an instance''s type: `isinstance(obj,
    int)` will be True only if `obj.__class__` is `int` or some class derived from
    `int`.

    2. You can use `issubclass()` to check class inheritance: `issubclass(bool, int)`
    is True since `bool` is a subclass of `int`. However, `issubclass(float, int)`
    is False since `float` is not a subclass of `int`.


    Python supports a form of multiple inheritance as well. `Cass` definition with
    multiple base classes typically look like this:


    For most purposes, you need to keep in mind the search for attributes inherited
    from a parent class as depth-first, left-to-right, not searching twice in the
    same class, where there is an overlap in the hierarchy. Therefore, if an attribute
    is not found in `DerivedClassName`, it is searched for in `Base1`, then (recursively)
    in the base classes of `Base1`, and if it was not found there, it was searched
    for in `Base2`, and so on. This approach is known in some other multiple-inheritance
    languages as `call-next-method` and is more complex than the `super` call found
    in single-inheritance languages.


    Dynamic ordering is necessary because all cases of multiple inheritance exhibit
    one or more relationships. For example, all classes inherit from an object, so
    any case of multiple inheritance provides more than one path to reach the object.
    Dynamic ordering helps keep the base classes from being accessed more than once,
    and the dynamic algorithm linearizes the search order in a way that preserves
    the left-to-right ordering specified in each class, which calls each parent only
    once that is monotonic. Combined together, these properties make it possible to
    design reliable and extensible classes with multiple inheritance.


