    如果一个类定义了 `__init__()` 方法，类实例化时会自动为新创建的类实例调用 `__init__()`。因此，在这个示例中，可以通过以下方式实现一个新的、初始化的实例：


    同时，`__init__()` 方法可能带有参数以获得更大的灵活性。在这种情况下，传递给类实例化符的参数将传递给 `__init__()`。


    对象是独立的，但同时，多个名称（在多个作用域中）可以绑定到同一个对象上。这在其他语言中被称为别名（aliasing）。在 Python 中，这初看通常不会被积极识别，而且在处理不可变基本类型（数字、字符串、元组）时可能会被忽略。然而，别名对涉及列表、字典和许多其他类型的可变对象的
    Python 代码语义具有潜在的、人意料的影响。这通常有利于程序的运行，因为别名在某种意义上被处理为指针。例如，传递对象是廉价的，因为实现上只传递了指针，如果函数修改了作为参数传递的对象，调用者将看到变化——这消除了对两种不同参数传递机制的需求。


    此外，还有实例对象。而且，实例对象唯一能的操作是属性引用。有效的属性名称有两种类型：数据属性和方法。


    数据属性与 Smalltalk 中的 `instance variables` 以及 C++ 中的 `data members` 具有相同特征。类似于局部变量，数据属性不需要声明，因为它们在第一次被赋值时就会被激活。另一种类型的实例属性引用是方法。方法是对象的一部分的函数。此外，在
    Python 中，“方法”一词并非类实例所专属：其他对象类型也可以拥有方法。例如，列表对象拥有名为 `append`、`insert`、`remove`、`sort`
    等方法。实例对象的有效方法名基于其类。默认情况下，类中所有作为函数对象的属性都定义了其实例对应的方法。


    ### 方法对象


    通常，方法在绑定后立即就会被调用：


    在 `MyClass` 的标准情况下，这将返回字符串 `hello world.`。尽管如此，并没有必要立即调用方法：`x.f` 是一个方法对象，可以被存储起来并在稍后调用。例如：


    同时，你可能注意到上面调用 `x.f()` 时没有传递参数，尽管 `f()` 的函数定义指定了一个参数。方法的特殊之处在于，实例对象可以作为函数的第一个参数传递。在我们案例中，`x.f()`
    的调用等同于 `MyClass.f(x)`。通常，调用一个带有 `n` 个参数的方法，等同于调用相应的函数，其参数列表是通过在第一个参数之前插入方法的实例对象创建的。理解方法是如何运作的可能需要实际编写代码来实现。练习将有助于澄清你可能仍然存在的任何问题。


    ### 继承


    可以肯定，一种不支持继承的语言特性就不会命名为 `class`（类）。派生类定义的语法应该像这样：


    `BaseClassName` 名称必须定义在包含派生类定义的作用域中。除了基类名，你也可以放置其他任意表达式。这很有帮助，例如当基类定义在另一个模块时：


    派生类定义的执行过程与基类相同。当类对象构建时，基类会被记录。这被用于解析属性引用：如果在类中找不到请求的属性，搜索将继续在基类中。如果基类本身派生自其他类，则该规则将递归应用。


    派生类并没有特别困难的地方：`DerivedClassName()` 创建该类的新实例。方法引用的解析方式如下：搜索相应的类属性，如果需要，沿基类链向下搜索，如果产生了一个函数对象，则该方法引用是有效的。


    派生类可能会覆盖其基类的方法。因为方法在调用同一对象的其他方法时没有特殊处理，调用在同一基类中定义的另一个方法的基类方法，最终可能会调用覆盖了该方法的派生类方法。派生类中的覆盖方法实际上想要扩展而不是简单地替换同名的基类方法。有一种直接调用基类方法的简单方法：只需调用
    `BaseClassName.methodname` 即可。


    Python 还有两个与继承工作的内置函数：


    1. 你可以使用 `isinstance()` 来检查实例的类型：`isinstance(obj, int)` 仅在 `obj.__class__` 为 `int`
    或派生自 `int` 的某些类时才为 True。

    2. 你可以使用 `issubclass()` 来检查类继承：`issubclass(bool, int)` 为 True，因为 `bool` 是 `int`
    的子类。然而，`issubclass(float, int)` 为 False，因为 `float` 不是 `int` 的子类。


    Python 也支持多重继承。带有多个基类的 `Cass` 定义通常看起来像：


    对于大多数用途，你需要记住从父类继承的属性搜索是深度优先、从左到右的，而不是在层次结构重叠的同一个类中搜索两次。因此，如果在 `DerivedClassName`
    中找不到属性，则会在 `Base1` 中搜索，然后（递归地）在 `Base1` 的基类中搜索，如果那里没有找到，则会在 `Base2` 中搜索，依此类推。这种方法在其他多重继承语言中被称为
    `call-next-method`，并且比单继承语言中的 `super` 调用更复杂。


    动态排序是必要的，因为所有多重继承的情况都表现出一种或多种关系。例如，所有类都继承自一个对象，因此任何多重继承的情况都提供了到达对象的多个路径。动态排序有助于防止基类被访问多次，并且动态算法线性化了搜索顺序，保留了每个类中指定的从左到右的顺序，每个父类只调用一次且是单调的。这些属性结合使得通过多重继承设计可靠且可扩展的类成为可能。


