- fmt: "\nMatches any Unicode decimal digit (any character in Unicode character category\
    \ `[Nd]`). This includes `[0–9]`, and also many other digit characters. If the\
    \ ASCII flag is used only `[0–9]` is matched.\n\n* `\\D`\n  Matches any character\
    \ which is not a decimal digit. This is the opposite of `\\d`. If the ASCII flag\
    \ is used, this becomes the equivalent of `[^0–9]`.\n\n* `\\s`\n  Matches Unicode\
    \ whitespace characters (which includes `[\\t\\n\\r\\f\\v]`, and also many other\
    \ characters, for example, the non-breaking spaces mandated by typography rules\
    \ in many languages). If the ASCII flag is used, only `[\\t\\n\\r\\f\\v]` is matched.\
    \ In case of 8-bit (bytes) patterns it matches characters considered whitespace\
    \ in the ASCII character set; this is equivalent to `[\\t\\n\\r\\f\\v]`.\n\n*\
    \ `\\S`\n  Matches any character which is not a whitespace character. This is\
    \ the opposite of `\\s`. If the ASCII flag is used this becomes the equivalent\
    \ of `[^ \\t\\n\\r\\f\\v]`.\n\n* `\\w`\n  Matches Unicode word characters and\
    \ includes most characters that can be part of a word in any language, as well\
    \ as numbers and the underscore. If the ASCII flag is used, only `[a-zA-Z0-9_]`\
    \ is matched. In the case of 8-bit (bytes) patterns, matches characters considered\
    \ alphanumeric in the ASCII character set, equivalent to `[a-zA-Z0-9_]`. If the\
    \ `LOCALE` flag is used, matches characters considered alphanumeric in the current\
    \ locale and the underscore.\n\n* `\\W`\n  Matches any character which is not\
    \ a word character. This is the opposite of `\\w`. If the ASCII flag is used,\
    \ this becomes the equivalent of `[^a-zA-Z0-9_]`. If the `LOCALE` flag is used,\
    \ matches characters that are neither alphanumeric in the current locale nor the\
    \ underscore.\n\n* `\\Z`\n  Matches only at the end of the string. The module\
    \ defines several functions, constants, and an exception. Some of the functions\
    \ are simplified versions of the full-featured methods for compiled regular expressions.\n\
    \n* `re.compile(pattern, flags=0)`\n  Compile a regular expression pattern into\
    \ a regular expression object, which can be used for matching using its `match()`,\
    \ `search()`, and other methods, described below.\n\n  The module-level regular\
    \ expressions define functions, constants, and an exception. Some of the RE are\
    \ simplified versions of the full-featured methods for compiled regular expressions.\n\
    \n* `re.A`\n  Make `\\w`, `\\W`, `\\b`, `\\B`, `\\d`, `\\D`, `\\s`, and `\\S`\
    \ perform ASCII-only matching instead of full Unicode matching. This is only meaningful\
    \ for Unicode patterns and is ignored for byte patterns.\n\n* `re.DEBUG`\n  Display\
    \ debug information about compiled expression. No corresponding inline flag.\n\
    \n* `re.I`\n  Perform case-insensitive matching; expressions like `[A-Z]` will\
    \ also match lowercase letters. Full Unicode matching (such as `Ü` matching `ü`)\
    \ also works unless the `ASCII` flag is used to disable non-ASCII matches. The\
    \ current locale does not change the effect of this flag unless the `LOCALE` flag\
    \ is also used.\n\n  Note that when the Unicode patterns `[a-z]` or `[A-Z]` are\
    \ used in combination with the `IGNORECASE` flag, they will match the 52 ASCII\
    \ letters and 4 additional non-ASCII letters: ‘İ’ (U+0130, Latin capital letter\
    \ I with dot above), ‘ı’ (U+0131, Latin small letter dotless i), ‘ſ’ (U+017F,\
    \ Latin small letter longs), and ‘K’ (U+212A, Kelvin sign). If the `ASCII` flag\
    \ is used, only letters `a` to `z` and `A` to `Z` are matched.\n\n* `re.L`\n \
    \ Make `\\w`, `\\W`, `\\b`, `\\B`, and case-insensitive matching dependent on\
    \ the current locale. This flag can be applied only with bytes patterns. The use\
    \ of this flag is discouraged as the locale mechanism is very unreliable, it only\
    \ handles one “culture” at a time, and it only works with 8-bit locales. Unicode\
    \ matching is already enabled by default in Python 3 for Unicode `(str)` patterns,\
    \ and it is able to handle different locales/languages. Corresponds to the inline\
    \ flag `(?L)`.\n\n* `re.M`\n  When specified, the pattern character `^` matches\
    \ at the beginning of the string and at the beginning of each line (immediately\
    \ following each newline); and the pattern character `$` matches at the end of\
    \ the string and at the end of each line (immediately preceding each newline).\
    \ By default, `^` matches only at the beginning of the string, and `$` only at\
    \ the end of the string and immediately before the newline (if any) at the end\
    \ of the string. Corresponds to the inline flag `(?m)`.\n\n* `re.S`\n  Make the\
    \ `.` special character match any character at all, including a newline; without\
    \ this flag, `.` will match anything except a newline. Corresponds to the inline\
    \ flag `(?s)`.\n\n* `re.X`\n  This flag allows you to write regular expressions\
    \ that look simpler and are more readable by allowing you to visually separate\
    \ logical sections of the pattern and add comments. Whitespace within the pattern\
    \ is ignored, except when in a character class, or when preceded by an unescaped\
    \ backslash, or within tokens like `*?`, `(?:` or `(?P<…>`. When a line contains\
    \ a `#` that is not in a character class and is not preceded by an unescaped backslash,\
    \ all characters from the `#` to the end of the line are ignored.\n\n* `re.search(pattern,\
    \ string, flags=0)`\n  Scan through string looking for the first location where\
    \ the regular expression pattern produces a match, and return a match object.\
    \ Return `None` if no position in the string matches the pattern; note that this\
    \ is different from finding a zero-length match.\n\n* `re.match(pattern, string,\
    \ flags=0)`\n  If zero or more characters at the beginning of string match the\
    \ regular expression pattern, return a corresponding match object. Return `None`\
    \ if the string does not match the pattern; note that this is different from a\
    \ zero-length match.\n\n  Note that even in `MULTILINE` mode, `re.match()` will\
    \ only match at the beginning of the string and not at the beginning of each line.\n\
    \n  If you want to locate a match anywhere in string, use `search()` instead (see\
    \ also `search()` vs. `match()`).\n\n* `re.fullmatch(pattern, string, flags=0)`\n\
    \  If the whole string matches the regular expression pattern, return a corresponding\
    \ match object. Return `None`, if the string does not match the pattern; note\
    \ that this is different from a zero-length match.\n\n* `re.split(pattern, string,\
    \ maxsplit=0, flags=0)`\n  Split string by the occurrences of pattern. If capturing\
    \ parentheses are used in the pattern, then the text of all groups in the pattern\
    \ is also returned as part of the resulting list. If `maxsplit` is nonzero, at\
    \ most `max split` splits occur, and the remainder of the string is returned as\
    \ the final element.\n\n* `re.findall(pattern, string, flags=0)`\n  Return all\
    \ non-overlapping matches of pattern in a string as a list of strings. The string\
    \ is scanned left-to-right, and matches are returned in the order found. If one\
    \ or more groups are present in the pattern, return a list of groups; this will\
    \ be a list of tuples if the pattern has more than one group. Empty matches are\
    \ included in the result and non-empty matches can start just after a previous\
    \ empty match.\n\n* `re.finditer(pattern, string, flags=0)`\n  Return an iterator\
    \ yielding match objects over all non-overlapping matches for the RE pattern in\
    \ string. The string is scanned left-to-right, and matches are returned in the\
    \ order found. Empty matches are included in the result and non-empty matches\
    \ can now start just after a previous empty match.\n\n* `re.sub(pattern, repl,\
    \ string, count=0, flags=0)`\n  Return the string obtained by replacing the leftmost\
    \ non-overlapping occurrences of pattern in string with the replacement `repl`.\
    \ If the pattern is not found, string is returned unchanged. `repl` can be a string\
    \ or a function; if it is a string, any backslash escapes in it are processed.\n"
