    从你访问 Python 程序的那一刻起，你就处于全局 Python 作用域。在内部，Python 将你的程序主脚本转换为一个名为 `__main__` 的模块，用于存放主程序的执行。该模块的命名空间就是你程序的主全局作用域。非常棒的一点是，在
    Python 中，全局作用域和全局名称的概念与模块文件紧密相关。为了说明，如果你在任何 Python 模块的顶层定义了一个名称，那么该名称被认为是模块的全局名称。这也是为什么这种作用域被称为模块作用域的原因。


    一旦你开始在 Python 交互会话中工作，可能会发现 `__main__` 也是其主模块的。要亲自检查这一点，请打开交互式会话并输入以下内容：


    当你运行 Python 程序或上述的交互式会话时，解释器会执行作为你程序入口的模块或脚本中的代码。该模块或脚本会被赋予特殊名称 `__main__`。这意味着从现在起起，你可以说你的主全局作用域就是
    `__main__` 的作用域。


    如果你想检查主全局作用域中的名称，可以使用 `dir()`。如果你在不带参数的情况下调用 `dir()`，你将获得当前全局作用域中存在的名称列表。


    但当你不带参数调用 `dir()` 时，你得到的是主全局 Python 作用域中可名称列表。与此同时，如果你在模块的顶层（此处是 `__main__`）分配一个新名称（如这里的
    `var`），那么该名称将被添加到 `dir()` 返回的列表中。


    需要注意的是，每个程序执行期间只有一个全局 Python 作用域。该作用域一直保持激活，直到程序终止且所有名称被遗忘。否则，当你下次运行程序时，这些名称将记住它们上一次运行的值。你可以从代码的任何地方访问或引用任何全局名称的值。这包括函数和类。为了澄清这些点：


    在 `func()` 内部，你可以轻松地定位或引用 `var` 的值。这对你的全局名称 `var` 没有产生影响，但它向你展示了可以在 `func()` 内部自由访问
    `var`。同时，你不能在函数内部为全局名称，除非你使用 `global` 语句将它们声明为全局名称。尽管如此，当你在 Python 中给一个名称赋值时，最可能发生两种情况之一：你要么创建一个新名称，要么更新一个现有的名称。


    整体行为取决于你分配名称所在的 Python 作用域。如果你尝试在函数内部为全局名称赋值，那么你最终会在函数的局部作用域中创建该名称，从而覆盖全局名称。这可能意味着你将无法在函数内部优化大多数在函数外部已确定的变量。


    另一方面，全局名称可以在你全局 Python 作用域的任何位置被更新或修改。此外，`global` 语句也可以从代码中的几乎任何地方修改全局名称。


    修改全局名称通常不被认为是一种良好的编程实践，因为它可能导致代码出现：


    *   **难以阅读**：你需要意识到并理解所有之前访问和使用来修改全局名称的先前语句。

    *   **无法重用**：代码与特定特定程序的全局名称绑定在一起。

    *   **难以调试**：程序中的大多数语句都可能更改全局名称的值。


    良好的编程实践通常使用局部名称而不是全局名称。一些提示包括：


    *   在整个程序中尽尽可能减少对全局名称的修改。

    *   编写依赖于局部名称而非全局名称的自包含函数。

    *   无论在哪个作用域中，都尝试应用唯一的对象名称。

    *   防止跨模块名称修改的发生。

    *   利用全局名称作为在程序执行期间不能被优化的常量。


    ### 内置作用域 (Built-In Scope)


    内置作用域是 Python 3 版本中作为名为 `builtins` 的标准库模块管理的 Python 作用域之一。Python 的所有内置对象都位于该模块中。一旦运行
    Python 解释器，它们会自动加载到内置作用域中。Python 在其 LEGB 查找中查找 `builtins`，因此你可以免费获得它定义的所有名称。这意味着你可能无需导入任何模块即可使用它们。


    你还会注意到，`builtins` 中的名称通常以特殊名称 `__builtins__` 加载到你的全局 Python 作用域中，如下代码所示：


    在第一次调用 `dir()` 的输出中，你可以看到 `__builtins__` 始终存在于全局 Python 作用域中。如果你使用 `dir()` 搜索
    `__builtins__`，你就能获取 Python 内置名称的完整列表。平均而言，内置作用域比你当前的全局 Python 作用域多出 150 个名称。例如，在
    Python 3.8 中，你可以如下方式了解名称的准确数量：


    通过调用 `len()`，你可以获得 `dir()` 返回的列表的项目数量。这返回了 152 个名称，包括异常、函数、类型、特殊属性和其他 Python 内置对象。即使你可以在不导入任何的情况下访问这些
    Python 内置对象，你也可以显式导入 `builtins` 并使用点符号访问名称。


    ## 修改 Python 作用域的行为


    回顾一下，到目前你应该知道 Python 作用域是如何工作的，以及它们如何限制变量、函数、类和其他 Python 对象对你代码中某些项的可见性。你现在知道可以从代码的任何地方定位或引用全局名称，但它们只能在全局作用域内部被修改或更新。你还应该知道，你只能在设计它们的局部作用域内部或嵌套函数内部访问局部名称，但你无法从全局作用域或其他局部作用域访问它们。此外，你必须已经学会非局部名称（nonlocal
    names）可以从嵌套函数内部访问，但不能从那里进行修改。


    即使 Python 作用域默认遵循这些通用规则，仍然有方法可以修改这种标准行为。Python 有两个关键字允许你编辑全局和非局部名称的内容。这两个关键字是：`global`
    和 `nonlocal`。


    ### global 语句 (Global Statement)


    现在必须清楚了，当你尝试在函数内部为全局名称赋值时，你在函数作用域中创建了一个新的局部名称。为了调整这种行为，你可以使用 `global` 语句。通过该语句，你可以列出一个将被视为全局名称的名称列表。该语句包括
    `global` 关键字以及一个或多个用逗号分隔的名称。你也可以使用多个 `global` 语句配合名称（或名称列表）。你在 `global` 语句中列出的所有名称将在定义它们的全局或模块作用域中被标记。


    ### nonlocal 语句 (Nonlocal Statement)


    与全局名称一样，非局部名称也可以从内部函数访问，但不能被赋值或更新。如果你希望修改它们，则需要使用 `nonlocal` 语句。nonlocal 语句由 `nonlocal`
    关键字以及用逗号分隔的多个名称组成。这些名称将引用闭包 Python 作用域中的相同名称。示例展示了如何使用 `nonlocal` 更改闭包或非局部作用域中的变量：


