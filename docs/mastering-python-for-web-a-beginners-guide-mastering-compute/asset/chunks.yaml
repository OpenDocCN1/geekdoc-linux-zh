  trans: '


    - **可维护性：** Django 代码的编写遵循设计原则和模式，这些原则鼓励创建可维护和可重用的代码。具体来说，它利用了“不要重复自己”（DRY）原则，避免了不必要的重复，减少了代码量。

    - **可移植性：** Django 使用 Python 编写，Python 可以在许多平台上运行，这确保了你不会被限制在特定的服务器，可以在 Linux、Windows
    和 Mac OS X 上运行你的应用程序。此外，Django 许多许多托管提供者的支持，他们通常会为托管 Django 网站提供特定的基础设施和文档。


    Django 一直在改进，从 2008 年 9 月发布的第一个里程碑版本（1.0）一直到最近发布的 3.1 版本（2020）。每次发布，Django 都增加了新功能并修复了错误，范围涵盖从对新类型数据库、模板引擎和缓存的支持，到视图函数和类的添加。今天，Django
    是一个蓬勃发展、协作完成的开源项目，拥有许多用户和贡献者。虽然它仍然保留了一些反映其起源的特性，但 Django 已变成一个多功能框架，能够开发如 Instagram、Mozilla、国家地理（National
    Geographic）、Pinterest 和 Open Stack 等知名网站。


    ### Django 是有主见的（Opinionated）吗？


    Web 框架通常被定义为“有主见的”或“无主见的”。有主见的框架是指那些对处理任何特定问题的“最佳方式”有自己见解的框架。它们倾向于支持特定领域的快速开发，因为做任何事情的最佳方式通常是为人知且文档齐全的。同时，它们在解决主领域之外的问题时灵活性可能较低，并且对于可以使用哪些组件和方法提供的选项也较少。


    另一方面，无主见的框架对于如何组合组件以实现目标有“最佳方式”，甚至对应该使用哪些组件，其限制较少。它们让开发者更容易使用最合适的工具以最匹配的成本完成特定任务。


    遵循这一逻辑，我们可以说 Django 是“有主见的”，因此它提供了一套处理大多数 Web 开发任务的组件以及使用这些组件的首选方法。然而，Django 的解耦架构意味着你通常可以从多个不同选项中选择，或者在必要时添加对完全新选项的支持。


    ### Django 代码看起来是什么样？


    在典型的数据驱动网站中，Web 应用程序等待来自 浏览器的 HTTP 请求。当接收到请求时，应用程序根据 URL 以及可能的 POST 数据或 GET 数据中的信息计算所需内容。根据需要，它可能会从数据库读取或编写脚本信息，或者执行完成请求所需的其他任务。然后，应用程序将向浏览器返回响应，通常是通过将检索到的数据插入
    HTML 模板中的占位符，动态地创建一个 HTML 页面供浏览器运行。


    Django Web 应用程序通常将处理这些步骤每个的代码合并到单独的文件：


    - **URLs：** 虽然可以通过单个函数处理来自每个 URL 的请求，但编写单独的视图函数来处理每个资源要方便得多。利用 URL 映射器（URL mapper）根据请求
    URL 将 HTTP 请求重定向到相应的视图。它还可以匹配 URL 中出现的特定字符串或数字模式，并将这些数据传递给视图函数。

    - **视图（View）：** 视图是一个请求处理函数，用于定位 HTTP 请求并返回 HTTP 响应。视图通过模型访问完成请求所需的数据，并将响应的格式化交给模板处理。

    - **模型（Models）：** 模型是 Python 对象，为应用程序的数据提供结构，并提供管理和存储数据库记录的机制。

    - **模板（Templates）：** 模板是一个文本文件，用于构建文件（如 HTML 页面）的布局，并使用占位符表示实际内容。


    Django 将这种整体的文件组织称为“模型-视图-模板（MVT）”架构。它在许多方面与熟悉的模型-控制器（MVC）架构相似。URL 映射通常存储在名为 `urls.py`
    的文件中。在下面的示例中，映射器（`urlpatterns`）定义了路由与相应视图函数之间的映射列表。当接收到匹配指定模式的 URL HTTP 请求时，将调用关联的函数并传递请求。


    `urlpatterns` 对象是 `path()` 和/或 `re_path()` 函数的列表（Python 使用方括号添加，项用逗号分隔，并可能有一个可选的尾逗号。例如：`[item1,
    item2, item3,]`）。


    这两个方法的第一个参数都是将匹配的路由（模式）。`path()` 方法使用角括号定义 URL 的部分，这些部分将被捕获并作为命名参数传递给视图函数。`re_path()`
    函数应用了被称为正则表达式的灵活匹配方法。第二个参数是模式匹配时将调用的另一个函数。`views.book_detail` 符号表示该函数名为 `book_detail()`，并可以在名为
    `views` 的模块中找到（即在名为 `views.py` 的文件中）。


    ### 处理请求 (views.py)


    视图是 Web 应用程序的核心，接收来自客户端的 HTTP 请求并返回 HTTP 响应。同时，它们维护框架的其他资源以访问数据库和渲染模板。


    下面的示例显示了一个简单的视图函数 `index()`，我们在之前的部分可能调用过它映射器。像所有视图函数一样，它接收一个 `HttpRequest` 对象作为参数（`request`）并返回一个
    `HttpResponse` 对象。在这种情况下，我们不对请求进行任何操作，我们的响应返回一个硬编码字符串。为了说明：


    ### 定义数据模型 (models.py)


    Django Web 应用程序通过称为模型的 Python 对象管理数据。模型的设计用于结构化存储的数据，包括字段类型、大小、默认值、选择列表选项、文档帮助文本和表单标签文本。模型的定义不取决于底层数据库——你可以根据项目需求选择几种数据库中的一种。一旦你决定了使用哪种数据库，就完全不需要直接访问它——你只需要编写模型结构，Django
    将为你完成与数据库的通信。


    下面的代码段显示了一个用于 `Team` 对象的简单 Django 模型。它将团队名称和团队级别定义为字符字段，并指定了每个记录存储的最大字符数。`team_level`
    可以是几个值之一，因此我们将其描述为选择字段，并提供了显示显示项与要存储的数据之间的映射，以及一个默认值。


    正如前面提到的，Python 代表面向对象编程，这种风格让你将代码组织成对象，这些对象包含了相关数据和操作这些数据的功能。对象还可以继承/扩展/派生其他对象，在相关对象之间共享共同行为。基于类中的模型类型创建多个特定的实例。


    ### 渲染数据 (HTML 模板)


    模板系统允许你指定输出文档的结构，利用占位符为生成页面时将填充的数据。模板通常应用于形成 HTML 表单，但也可以创建其他类型的文档。Django 同时支持其内置的模板系统和另一个流行的
    Python 库 `Jinja2`。


    '
- fmt: "\nThe code below shows what the HTML template called by the `render()` function\
    \ might look like. This template has been written under the direction that it\
    \ will have access to a list variable called `very_old_teams` when it is rendered.\
    \ Inside the HTML body, we have an expression that first checks if the `very_old_teams`\
    \ variable exists, and then iterates it in a `for` loop. On each iteration the\
    \ template displays each team's `team_name` value in an `<li>` element:\n\nIn\
    \ the preceding sections, we displayed the main features that you use in almost\
    \ every web application: URL mapping, views, models, and templates. Just a few\
    \ other items provided by Django include:\n\n- **Forms:** HTML Forms are designed\
    \ to collect user data for processing on the server. Django has settings to simplify\
    \ form creation, validation, and processing.\n- **User authentication and permissions:**\
    \ Django has great user authentication and permission system that has been built\
    \ to ensure system security.\n- **Caching:** Creating content dynamically is much\
    \ more technically intensive than serving static content. Django provides flexible\
    \ caching that lets you store all or part of a rendered page so that it does not\
    \ get re-rendered except when needed.\n- **Administration site:** The Django administration\
    \ site is included by default when you create a website application. It makes\
    \ it much easier to provide an admin page for site administrators to create, edit,\
    \ and view any data models on your site.\n- **Serializing data:** With Django,\
    \ it is easy to serialize and serve your data as XML or JSON. This can be particularly\
    \ helpful when creating a web service that serves data to be consumed by other\
    \ applications and does not display anything itself, or when creating a website\
    \ in which the client-side code handles all the rendering of data.\n\nAdditionally,\
    \ Django provides a ready-to-use user interface for administrative activities\
    \ and automatically generates admin UI based on your project models. The Admin\
    \ interface depends on the `django.contrib` module. To have it working, you need\
    \ to make sure some modules are imported in the `INSTALLED_APPS` and `MIDDLEWARE_CLASSES`\
    \ tuples of the `myproject/settings.py` file.\n\nFor `INSTALLED_APPS` make sure\
    \ you have –\n\nBefore launching your server, to access your Admin Interface,\
    \ you need to initiate the database and create the necessary tables or collections\
    \ for the admin interface to run. And in order to start the Admin Interface, we\
    \ need to make sure we have configured a URL for our admin interface. Open the\
    \ `myproject/url.py` and you should have something like:\n\nNow just run the server:\
    \ `$ python manage.py runserver`。\n\n## REGULAR EXPRESSIONS\n\nRegular expressions,\
    \ also called RE, regexes, or regex patterns are tiny, highly specialized programming\
    \ language codes embedded inside Python and made available via `re`-modeling.\
    \ Using this little language, you define the rules for the set of possible strings\
    \ that you need to match; this set might consist of English sentences, or e-mail\
    \ addresses, commands or anything else that you like.\n\nRegular expression patterns\
    \ are compiled into sets of bytecodes which are then executed by a matching engine\
    \ written in C. For professional expert use, it may be necessary to pay attention\
    \ to how the engine will implement a given RE, and write the `RE` in a particular\
    \ way in order to produce a bytecode that runs faster. The regular expression\
    \ language is small and limited, so not all possible string processing tasks can\
    \ be completed using regular expressions. There are some tasks that can be done\
    \ with regular expressions, but the expressions turn out to be very complicated.\
    \ In these instances, you may be better off writing Python code to do the processing;\
    \ even if Python code will be slower than an elaborate regular expression, it\
    \ will also probably be more understandable.\n\nA regular expression defines a\
    \ set of strings that matches it. Ultimately, the functions in this module let\
    \ you see if a particular string matches a given regular expression or if a given\
    \ regular expression matches a particular string. Additionally, regular expressions\
    \ can be applied to form new regular expressions; if `A` and `B` are both regular\
    \ expressions, then `AB` is also a regular expression. By the same logic, if a\
    \ string `p` matches `A` and another string `q` matches `B`, the string `pq` will\
    \ match `AB`. Therefore, complex expressions can easily be constructed from simpler\
    \ primitive expressions.\n\nRegular expressions can consist of both special and\
    \ ordinary characters. Most ordinary characters, like ‘A’, ‘a’, or ‘0’ are the\
    \ simplest regular expressions; they simply match themselves. Some characters,\
    \ like `|` or `(``, are special. Special characters either stand for classes of\
    \ ordinary characters or impact how the regular expressions around them are interpreted.\n\
    \nRepetition qualifiers (`*`, `+`, `?`, `{m,n}`, etc) cannot be directly nested.\
    \ This avoids ambiguity with the non-greedy modifier suffix `?`, and with other\
    \ modifiers in other implementations. To apply a second repetition to an inner\
    \ repetition, parentheses may be needed. For instance, the expression `(?:a{6})*`\
    \ matches any multiple of six ‘a’ characters.\n\nThe special characters are:\n\
    \n- `.`\n    In the default mode, dot matches any character except a newline.\
    \ If the `DOTALL` flag has been added, this matches any character, including a\
    \ newline.\n- `^`\n    Caret goes at the start of the string, and in `MULTILINE`\
    \ mode also matches immediately after each newline.\n- `$`\n    Matches the end\
    \ of the string or just before the newline at the end of the string, and in `MULTILINE`\
    \ mode also matches before a newline.\n- `*`\n    Causes the resulting `RE` to\
    \ match 0 or more repetitions of the preceding `RE`, as many repetitions as are\
    \ possible. `ab*` will match ‘a’, ‘ab’, or ‘a’ followed by any number of ‘b’s.\n\
    - `+`\n    Causes the resulting `RE` to match 1 or more repetitions of the preceding\
    \ `RE`. `ab+` will match ‘a’ followed by any non-zero number of ‘b's; it will\
    \ not match just ‘a’.\n- `?`\n    Causes the resulting `RE` to match 0 or 1 repetitions\
    \ of the preceding `RE`. `ab?` will match either ‘a’ or ‘ab’.\n- `*?`, `+?`, `??`\n\
    \    The `*`, `+`, and `?` qualifiers match as much text as possible. For example,\
    \ if the `RE` `<.*>` is matched against ‘<a> b <c>`, it will match the entire\
    \ string, and not just ‘<a>’. Adding `?` after the qualifier makes it perform\
    \ the match in minimal fashion; as few characters as possible will be matched.\
    \ Using the `RE` `<.*?>` will match only ‘<a>’.\n- `{m}`\n    Specifies that exactly\
    \ `m` copies of the previous `RE` should be matched; fewer matches cause the entire\
    \ `RE` not to match. For example, `a{6}` will match exactly six ‘a’ characters,\
    \ but not five.\n- `{m,n}`\n    Causes the resulting `RE` to match from `m` to\
    \ `n` repetitions of the preceding `RE`, attempting to match as many repetitions\
    \ as possible. For example, `a{3,5}` will match from 3 to 5 “a” characters. Omitting\
    \ `m` specifies a lower bound of zero, and omitting `n` specifies an infinite\
    \ upper bound. As an example, `a{4,}b` will match ‘aaaab’ or a thousand ‘a’ characters\
    \ followed by a ‘b’, but not ‘aaab’. The comma may not be omitted, or the modifier\
    \ would be confused with the previously described form.\n- `{m,n}?`\n    Causes\
    \ the resulting `RE` to match from `m` to `n` repetitions of the preceding `RE`,\
    \ attempting to match as few repetitions as possible. This is the non-greedy version\
    \ of the previous qualifier. For example, on the 6-character string ‘aaaaaa’,\
    \ `a{3,5}` will match 5 ‘a’ characters, while `a{3,5}?` will only match 3 characters.\n\
    - `\\`\n    Either escapes special characters (permitting you to match characters\
    \ like ‘*’, ‘?’), or signals a special sequence; special sequences are discussed\
    \ below.\n"
