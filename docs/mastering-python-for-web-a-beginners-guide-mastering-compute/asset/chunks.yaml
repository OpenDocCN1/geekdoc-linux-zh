  trans: "\n\n* **[Python.org 在线控制](http://Python.org):** [`www.python.org/shell/`](https://www.python.org)\n\
    * **Repl.it:** [`replit.com/`](https://replit.com)\n* **Trinket:** [`trinket.io/`](https://trinket.io)\n\
    * **Python Anywhere:** [`www.pythonanywhere.com/`](https://www.pythonanywhere.com)\n\
    \n## 重新生成配置\n\n如果对 Python 某些依赖可移植操作系统接口 (POSIX) 特定功能的修改，必须更新 `configure` 脚本以测试其功能。\n\
    \nPython 的 `configure` 脚本是使用 `Autoconf` 工具从 `configure.ac` 生成的，用于生成在计算机系统中构建和打包软件的脚本。不要直接编辑\
    \ `configure`，请确保编辑 `configure.ac` 然后运行 `autoreconf` 来重新生成 `configure` 以及其他许多文件。\n\
    \n与其他任何软件一样，在某些情况下，你可能会在 `Parser/asdl_c.py` 或 `Python/makeopcodetargets.py` 等脚本中遇到\
    \ Python 错误。由于 Python 会自动生成其部分代码，你需要从头开始完整构建才能运行自动生成脚本。为了解决这个问题，自动生成的文件也被提交到了虚拟存储空间——Git\
    \ 仓库中。\n\nPython 的使用非常广泛，实际上几乎所有的代码编辑器在第一次编写 Python 代码时都使用过某种形式的支持。如果你正在寻找一些管理\
    \ Python 编码的额外工具或特殊指南，你可以在“附加资源”和“开发者指南”中搜索它们：[`devguide.python.org/#resources`](https://devguide.python.org)。在那里，你可以找到关于探索\
    \ CPython 内部原理、修改 CPython 语法、CPython 编译器设计、CPython 垃圾回收设计以及基础工具支持选项的卓越材料。`Python.org`\
    \ 的维护还包括使用 `clang` 进行动态分析，以及 `Misc` 目录中带有配置文件的各种工具。\n\n# 第 2 章 Python 数据类型\n\n\
    DOI: [10.1201/9781003229896-2](https://doi.org/10.1201/9781003229896-2)\n\n##\
    \ 本章内容\n\n* 介绍主要的 Python 数据类型\n* 讲解每种类型的内置方法描述\n* 解释如何访问、更新和修改 Python 数据类型\n\n\
    数据分析是目前一个非常重要的领域。大多数公司都希望聘请专业的数据分析师来处理海量数据库并防止任何意外错误的发生。一个优秀的数据分析师应该知道如何使用各种编程工具来管理大量的复杂数据，并从中发现相关信息。简而言之，如果你想在不断发展的\
    \ IT 领域寻找一个席位（可能作为数据分析师），你能够开始投资以下领域的技能，以便在职场中获得价值：\n\n* **领域专业知识：** 你需要具备领域专业知识，以便处理大数据并提出与他们工作环境相关的见解。\n\
    * **编程技能：** 数据分析师应该具备编程技能，以便知道使用哪些库来清洗数据、挖掘数据并从中获取见解。\n* **统计学：** 如果不知道如何使用一些基础统计工具，分析师将无法从数据中推导出完整的含义。\n\
    * **可视化技能：** 数据分析师不能将原始数据作为工作结果呈现，他需要出色的数据可视化技能，以便向第三方总结并展示全面的数据。\n* **叙述能力：**\
    \ 最后，分析师需要向利益相关者或客户传达他们的发现。这意味着他们不仅要创建一个数据故事，还要具备叙述它的能力。\n\n![一个人正在笔记本电脑键盘上打字。左侧文字写着：Python\
    \ 数据类型。](img/fig2_1.jpg)\n\n数据类型基本上是编程语言用于存储和操作其他数据的内部构造结构。尽管 Python 运行得很好，但在数据分析过程的某个时刻，每个人可能都需要显式地将数据从一种类型转换为另一种。在本章中，我们将讨论基础的\
    \ Python 数据类型、它们是如何映射的，以及从一种数据类型转换为另一种类型的选项。简单来说，数据类型是对数据项目的分类或分类。Python 支持以下内置数据类型：\n\
    \n* **标量类型 (Scalar types)**\n    * **Int:** 整数代表正或负的整数（没有分数部分）。用于位级编程的位运算仅对整数有意义。二进制位运算的优先级均低于数值运算，但高于比较运算。一元运算\
    \ `~` 的优先级与其他一元数值运算（`+` 和 `-`）相同。\n\n此表列出了按优先级升序排列的位运算：\n\n| x \\| y | x 和 y 的按位或\
    \ |\n| :--- | :--- |\n| x ^ y | x 和 y 的按位异或 |\n| x & y | x 和 y 的按位与 |\n| x ≪ n\
    \ | x 向左移动 n 位 |\n| x ≫ n | x 向右移动 n 位 |\n| ~x | x 的位取反 |\n\n### 整数类型的额外方法\n\n\
    `int` 类型实现了数字和整数抽象基类。此外，它还提供了更多操作方法：\n\n1. `int.bit_length()`：返回表示整数所需的所需的位数，不包括符号位和前导零。\n\
    2. `int.to_bytes(length, byteorder, signed=False)`：返回一个表示整数的字节数组。\n3. `int.from_bytes(bytes,\
    \ byteorder, signed=False)`：返回由给定字节数组表示的整数。\n4. `int.as_integer_ratio()`：返回一对整数，其比例值完全等于该整数，且分母为正。整数（全数）的整数比例始终以整数为分子，1\
    \ 为分母。\n\n* **Float:** 代表具有浮点表示形式的实数，其中分数部分由小数点或科学计数法表示。`float` 类型实现了数字和实数（real）抽象基类。它还有以下额外方法：\n\
    \n1. `float.as_integer_ratio()`：返回一对整数，其比例值完全等于原始浮点数，且分母为正。\n2. `float.is_integer()`：如果浮点实例是具有有限的整数值，则返回\
    \ True，否则返回 False。\n3. `float.hex()`：返回浮点数的十六进制字符串形式的表示。对于有限浮点数，此表示将始终包含开头的 0x\
    \ 和结尾的 p 以及指数。\n4. `float.fromhex(s)`：类方法，返回由十六进制字符串 s 表示的浮点数。字符串 s 可能有前导或尾空格。\n\
    \n* **Complex:** 包含实部和虚部组成的数字，表示为 x + 2y。\n* **Bool:** 具有两个内置值 True 或 False 之一的数据。注意\
    \ `True` 和 `False` 的首字母是大写的。\n* **None:** `None` 代表 Python 中的空对象，或由未显式返回值的函数。\n\
    * **序列类型 (Sequence type):** 序列意味着相同或不同数据类型的有序集合。Python 有以下内置序列数据类型：\n\n"
- fmt: "\n* **String**: a string value simply represents a collection of one or more\
    \ characters put in single, double, or triple quotes.\n* **List**: a list here\
    \ stands for an ordered collection of one or more data items, not necessarily\
    \ of the same type, but in square brackets.\n* **Tuple**: a `Tuple` object is\
    \ an ordered collection of one or more data items, not necessarily of the same\
    \ type, put in parentheses.\n\n## Mapping type\n\n* **Dictionary**: a dictionary\
    \ `Dict()` object is a collection of data in a key:value pair form. Such pairs\
    \ have to be enclosed in curly brackets. For example: `{1:“Sam,” 2:“Ben, 3:“Roy,\
    \ 4:“Molly”}`\n\n## Set types\n\n* **set**: The `set` in Python is the same as\
    \ the implementation of the `set` in Mathematics. A `set` object has suitable\
    \ methods to perform mathematical set operations like union, intersection, difference,\
    \ etc. In scripting, it goes as a mutable, unordered collection of distinct hashable\
    \ objects.\n* **frozenset**: `frozen`, unlike the ordinary `set`, is an immutable\
    \ version of sets whose elements are added from other data types.\n\n## Mutable\
    \ and immutable types\n\nMutable data objects of the above-mentioned data types\
    \ are stored in a computer's memory for processing. Some of these values can be\
    \ modified during processing, but once they are created in the memory, their content\
    \ cannot be altered. Numbers, strings, and `Tuples` are immutable, which means\
    \ their contents cannot be changed after creation.\n\n## Iterator types\n\nPython\
    \ supports a concept of iteration over containers and is using container user-defined\
    \ classes to support iteration. Sequences, described below in more detail, always\
    \ support the iteration methods:\n\n1. `container.__iter__()()`: Return an iterator\
    \ object. This process is required to support the iterator protocol described\
    \ below, and if a container supports different types of iteration, additional\
    \ methods can be provided to specifically request iterators for those iteration\
    \ types. This method corresponds to the `tp_iter` slot of the type structure for\
    \ Python objects in the Python/C application programming interface (API).\n\n\
    \   The iterator objects themselves are required to support the following two\
    \ methods, which together form the iterator protocol:\n\n2. `iterator.__iter__()()`:\
    \ Return the iterator object itself. This is required to allow both containers\
    \ and iterators to be used with the `for` and `in` statements. This method corresponds\
    \ to the `tp_iter` slot of the type structure for Python objects in the Python/C\
    \ API.\n\n3. `iterator.__next__()()`: Return the next item from the container.\
    \ If there are no further items, raise the `StopIteration` exception. This method\
    \ corresponds to the `tp_iternext` slot of the type structure for Python objects\
    \ in the Python/C API. Once an iterator's `__next__()` method raises `StopIteration`,\
    \ it must continue to do so on subsequent calls. Implementations that do not obey\
    \ this property are deemed broken.\n\nPython defines several iterator objects\
    \ to support iteration over general and specific sequence types, dictionaries,\
    \ and other more specialized forms. The specific types are not important beyond\
