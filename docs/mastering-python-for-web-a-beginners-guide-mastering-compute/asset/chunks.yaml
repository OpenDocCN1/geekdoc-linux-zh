    n\\r\\f\\v] is matched. In case of 8-bit (bytes) patterns it matches characters\
    \ considered whitespace in the ASCII character set; this is equivalent to [\\\
    t\\n\\r\\f\\v].\n\n*   \\S\n\n    Matches any character which is not a whitespace\
    \ character. This is the opposite of \\s. If the ASCII flag is used this becomes\
    \ the equivalent of [^ \\t\\n\\r\\f\\v].\n\n*   \\w\n\n    Matches Unicode word\
    \ characters and includes most characters that can be part of a word in any language,\
    \ as well as numbers and the underscore. If the ASCII flag is used, only [a-zA-Z0-9_]\
    \ is matched. In the case of 8-bit (bytes) patterns, matches characters considered\
    \ alphanumeric in the ASCII character set, equivalent to [a-zA-Z0-9_]. If the\
    \ LOCALE flag is used, matches characters considered alphanumeric in the current\
    \ locale and the underscore.\n\n*   \\W\n\n    Matches any character which is\
    \ not a word character. This is the opposite of \\w. If the ASCII flag is used,\
    \ this becomes the equivalent of [^a-zA-Z0-9_]. If the LOCALE flag is used, matches\
    \ characters that are neither alphanumeric in the current locale nor the underscore.\n\
    \n*   \\Z\n\n    Matches only at the end of the string. The module defines several\
    \ functions, constants, and an exception. Some of the functions are simplified\
    \ versions of the full-featured methods for compiled regular expressions.\n\n\
    *   re.compile(pattern, flags=0)\n\n    Compile a regular expression pattern into\
    \ a regular expression object, which can be used for matching using its match(),\
    \ search(), and other methods, described below.\n\n    The module-level regular\
    \ expressions define functions, constants, and an exception. Some of the RE are\
    \ simplified versions of the full-featured methods for compiled regular expressions:[⁴](#chapter6.xhtml_fn6_4)\n\
    \n*   re.A\n\n    Make \\w, \\W, \\b, \\B, \\d, \\D, \\s, and \\S perform ASCII-only\
    \ matching instead of full Unicode matching. This is only meaningful for Unicode\
    \ patterns and is ignored for byte patterns.\n\n*   re.DEBUG\n\n    Display debug\
    \ information about compiled expression. No corresponding inline flag.\n\n*  \
