    Windows, for instance, associates the extensions `.py` and `.pyw` with the programs
    `python.exe` and `pythonw.exe`. This allows you to run your scripts by double-clicking
    on them. And when you have a script with a command-line interface, it is likely
    that you only see the flash of a black window on your screen. To avoid this from
    happening, you can add a statement like `input(''Press Enter to Continue…'')`
    at the end of the script. And this way, the program will not process further until
    you press Enter. Nonetheless, if your script has any error, the execution will
    be aborted before reaching the `input()` statement, and you still will not be
    able to watch the result.


    On Unix-like systems, you will be able to run your scripts by double-clicking
    on them in your file manager by applying the shebang variable that we have mentioned
    before. Likewise, you may not notice any results on screen when it comes to command-line
    interface scripts.


    And since the execution of scripts through double-click has several limitations
    and usually depends on many factors such as the operating system, the file manager,
    execution permissions, and file associations, it is highly advised that you see
    it as a viable option for scripts already debugged and ready to go into production.


    In addition, if you do not know where to start, you can take a look at the following
    most popular scripts in Python: joining two strings, floating-point in the string,
    raising a number to a power, working with Boolean types, applying If else statement
    and making use of AND and OR operators.


    ## Joining Two Strings


    There are many ways to join string values in python. Yet, the most simple way
    to combine two string values in python is to use the `+` operator. In this case,
    two string values are assigned in two variables, and another variable is used
    to store the joined values that are printed later.


    The following output will appear after running the script from the editor. As
    a result, two words, “Hello” and “World” are joined, and “HelloWorld” is printed
    as output.


    ## Format Floating Point in the String


    Floating point number is required in programming for making up fractional numbers,
    and sometimes it takes formatting the floating-point number for programming purposes.
    String formatting and string interpolation are used in the following script to
    format a floating-point number. `format()` method with format width is used in
    string formatting, and `*` symbol with the format with width is used in string
    interpolation. According to the formatting width, 5 digits are set before the
    decimal point, and 2 digits are set after the decimal point.


    The following output will be available after running the script from the editor.


    ## Raise a Number To a Power


    In the following script, three ways are displayed to calculate the `xn` in Python.
    Double `*` operator, `pow()` method, and `math.pow()` method are used for calculating
    the `xn`. The values of `x` and `n` are initialized with numeric values. Double
    `*` and `pow()` methods are used for calculating the power of integer values.
    `math.pow()` can calculate the power of fractional numbers; also, that is shown
    in the last part of the script.


    The following output will appear after running the script. The first two outputs
    will have the result of 43, and the third output will show the result of 26.5.


    ## Working with Boolean Types


    The different uses of Boolean types are shown in the following script. The first
    output will print the value of `val1` that contains the Boolean value, true. All
    positive are negative numbers return true as Boolean value and only zero returns
    false as a Boolean value. Hence, the second and third outputs will print true
    for positive and negative numbers. The fourth output will print false for 0, and
    the fifth output will print false because the comparison operator returns false.


    The following output will appear after running the script.


    ## Use of If-Else Statement


    The following script is used to create a conditional statement in python. The
    declaration of the if-else statement in python is different than other languages
    – no curly brackets are required to define the if-else block in python like other
    languages, but the indentation block must be added properly other the script will
    show an error. A colon(`:`) is used after the `if` and `else` block to define
    the starting of the block.


    The following output will appear after running the script.


    ## Use of AND and OR Operators


    The following script applied to AND and OR operators in the conditional statement.
    AND operator returns true when the two conditions return true, and OR operator
    returns true when any condition of two conditions returns true. Two floating-point
    numbers will be taken as MCQ and theory marks.


    ## Modules or Modular Programming


    Modules or Modular programming stand for the process of breaking a large, complex
    programming task into separate, smaller subtasks or modules. Individual modules
    can then be piled together like building bricks to create another application.
    There are multiple advantages of modularizing code when it comes to larger application:


    - **Simplicity:** Rather than focusing on the entire problem at hand, a module
    allows you to focus on one small portion of the problem. And if you are working
    on a single module, you know you have a smaller problem domain to tackle first.
    This makes overall development manageable and less error-prone.

    - **Maintainability:** Modules are typically designed to create logical boundaries
    between different problems and tasks. If modules are written to minimize interdependency,
    there is a decreased possibility that modifications to a single module will impact
    other bits of the program. This way, you might even be able to make changes to
    a module without having any knowledge of the script outside that module. This
    makes it more convenient for a team of many developers to work in collaboration
    on a large application.

    - **Reusability:** Functionality defined in a single module can be easily reused
    through an appropriately defined interface. With that, there is no need to duplicate
    your codes.

    - **Organizing:** Modules usually define a separate namespace, which helps prevent
    any collisions between identifiers to happen.


    Typically, there are three different ways to define a module in Python: a module
    can be written in Python itself; it can be written in C and loaded dynamically
    at run-time, or a built-in module could intrinsically be contained in the interpreter.
    Nevertheless, a module''s contents are accessed the same way in all three cases
    via the `import` statement. Module contents are made available to the caller with
    the `import` statement as shown below:


    This is the simplest that does not make the module contents directly accessible
    to the caller. Each module has its own private symbol table, which also serves
    as the global symbol table for all objects defined in the module. Thus, it also
    lets a module create a separate namespace, as previously noted.


    ### Locating Modules


    When you import a module, the Python interpreter searches for the module in the
    current directory. And in case the module is not found, Python then searches each
    directory in the shell variable `PYTHONPATH`. If that fails too, Python checks
    the default path. On UNIX, this default path is normally `/usr/local/lib/python/`.


    To be precise, the module search path is stored in the system module `sys` as
    the `sys.path` variable. The `sys.path` variable contains the current directory,
    `PYTHONPATH`, and the installation-dependent default. The `PYTHONPATH` is an environment
    variable, consisting of a list of directories and the syntax of `PYTHONPATH` is
    similar to that of the shell variable `PATH`.


    Here is the common `PYTHONPATH` from a Windows system —


    And here is the basic `PYTHONPATH` from a UNIX system —


    ### Standard Modules

