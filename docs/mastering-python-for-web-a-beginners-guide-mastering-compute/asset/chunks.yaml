    \ most max split splits occur, and the remainder of the string is returned as\
    \ the final element of the list.\n\n*   re.findall(pattern, string, flags=0)\n\
    \n    Return all non-overlapping matches of pattern in a string as a list of strings.\
    \ The string is scanned left-to-right, and matches are returned in the order found.\
    \ If one or more groups are present in the pattern, return a list of groups; this\
    \ will be a list of tuples if the pattern has more than one group. Empty matches\
    \ are included in the result and non-empty matches can start just after a previous\
