    Right from the moment you access a Python program, you are in the global Python
    scope. Internally, Python turns your program''s main script into a module called
    `__main__` to hold the main program''s execution. The namespace of this module
    would be the main global scope of your program. It is also great to know that
    in Python, the notions of global scope and global names are tightly connected
    to module files. To illustrate, if you define a name at the top level of any Python
    module, then that name is considered global to the module. That is also the reason
    why this type of scope is called module scope.


    Once you start working in a Python interactive session, you might notice that
    `__main__` is also the name of its main module. To check that for yourself, open
    an interactive session and type in the following:


    When you run a Python program or an interactive session like the above, the interpreter
    executes the code in the module or script that serves as an entry point to your
    program. This module or script is upgraded with the special name, `__main__`.
    Meaning that from this point on, you can state that your main global scope is
    the scope of `__main__`.


    If you want to inspect the names within your main global scope, you can apply
    `dir()`. If you call `dir()` without arguments, then you will get the list of
    names that live in your current global scope.


    But when you call `dir()` with no arguments, you get the list of names available
    in your main global Python scope. In the meantime, if you assign a new name (like
    `var` here) at the top level of the module (which is `__main__` here), then that
    name will be added to the list returned by `dir()`.


    What needs to be noted is that there is only one global Python scope per program
    execution. This scope remains in action until the program terminates and all its
    names are forgotten. Otherwise, the next time you were to run the program, the
    names would remember their values from the previous run. You can access or reference
    the value of any global name from any place in your code. This includes functions
    and classes. To clarify these points:


    Inside `func()`, you can easily locate or reference the value of `var`. This will
    have no effect on your global name `var`, but it shows you that `var` can be freely
    accessed from within `func()`. At the same time, you cannot assign global names
    inside functions unless you declare them as global names applying a `global` statement.
    Nevertheless, when you assign a value to a name in Python, most likely one of
    two things is going to happen: you either create a new name or you update an existing
    name.


    The overall behavior will depend on the Python scope in which you are assigning
    the name. If you try to assign a value to a global name inside a function, then
    you will end up creating that name in the function''s local scope, overriding
    the global name. This could also mean that you will not be able to optimize most
    variables that have been determined outside the function from within the function.


    Global names, on the other hand, could be updated or modified from any location
    in your global Python scope. Moreover, the `global` statement can also be applied
    to modify global names from almost any place in your code.


    Modifying global names is not usually considered to be a good programming practice
    because it can result in a code that is:


    * **Hard to read**: You would need to be aware and understand all of the previous
    statements that were accessed and used to modify global names.

    * **Impossible to reuse**: The code is linked to global names that are specific
    to a particular program.

    * **Difficult to debug**: Most of the statements in the program can change the
    value of a global name.


    Good programming practice typically uses local names rather than global names.
    Some of the tips include:


    * Minimize global name modifications throughout your programs.

    * Write self-contained functions that depend on local names rather than global
    ones.

    * Attempt to apply unique object names, no matter what scope you are in.

    * Prevent cross-module name modifications from occurring.

    * Utilize global names as constants that cannot be optimized during your program''s
    execution.


    ### Built-In Scope


    The built-in scope is one of the Python scopes that is managed as a standard library
    module named `builtins` in Python version 3. All of Python''s built-in objects
    are located in this module. They are automatically uploaded to the built-in scope
    once you run the Python interpreter. Python looks for `builtins` in its LEGB lookup,
    so you get all the names it defines for free. This also means that you may use
    them without having to import any module.


    You can also notice that the names in `builtins` are usually loaded into your
    global Python scope with the special name `__builtins__`, as observed from the
    following code:


    In the output of the first call to `dir()`, you can see that `__builtins__` is
    always present in the global Python scope. If you search for `__builtins__` using
    `dir()`, then you would be able to get the whole list of Python built-in names.
    On average, the built-in scope has more than 150 names to your current global
    Python scope. For instance, in Python 3.8 you can get to know the exact number
    of names as follows:


    With the call to `len()`, you can get the number of items in the list returned
    by `dir()`. This returns 152 names that include exceptions, functions, types,
    special attributes, and other Python built-in objects. Even if you can access
    all of these Python built-in objects without importing anything, you can also
    explicitly import `builtins` and access the names using the dot notation.


    ## MODIFYING THE BEHAVIOR OF A PYTHON SCOPE


    To review, by now you should know how a Python scope works and how they restrict
    the visibility of variables, functions, classes, and other Python objects to certain
    items of your code. You now know that you can locate or reference global names
    from any place in your code, but they could be modified or updated only from within
    the global scope. You should also know that you can access local names only from
    inside the local scope they were designed or inside a nested function, but you
    will not be able to access them from the global scope or other local scopes. In
    addition, you must have learned that nonlocal names can be accessed from inside
    nested functions, but they cannot be modified from there.


    Even if Python scopes follow these general rules by default, there are still ways
    to modify this standard behavior. Python has two keywords that let you edit the
    content of global and nonlocal names. These two keywords are: `global` and `nonlocal`.


    ### The Global Statement


    It must be clear by now that when you try to assign a value to a global name inside
    a function, you create a new local name in the function scope. To adjust this
    behavior, you can use a `global` statement. With this statement, you can make
    up a list of names that are going to be treated as global names. The statement
    includes the `global` keyword followed by one or more names separated by commas.
    You can also utilize multiple `global` statements with a name (or a list of names).
    All the names that you list in a `global` statement will be marked in the global
    or module scope in which you define them.


    ### The Nonlocal Statement


    Just like global names, nonlocal names can also be accessed from inner functions,
    but not assigned or updated. In case you wish to modify them, then you need to
    use a `nonlocal` statement. The nonlocal statement consists of the `nonlocal`
    keyword together with one or more names separated by commas. These names will
    refer to the same names in the enclosing Python''s scope. The following example
    shows how you can use `nonlocal` to change a variable in the enclosing or nonlocal
