  trans: "\n匹配任何 Unicode 十进制数字（Unicode 字符类别 `[Nd]` 中的任何字符）。这包括 `[0–9]`，以及许多其他数字字符。如果使用了\
    \ ASCII 标志，则只匹配 `[0–9]`。\n\n* `\\D`\n  匹配任何非进制数字的字符。这是 `\\d` 的相反。如果使用了 ASCII 标志，它等同于\
    \ `[⁰–9]`。\n\n* `\\s`\n  匹配 Unicode 空白字符（包括 `[\\t\\n\\r\\f\\v]`，以及许多其他字符，例如许多语言中排版规则强制要求的不换行空格）。如果使用了\
    \ ASCII 标志，则只匹配 `[\\t\\n\\r\\f\\v]`。在 8 位（字节）模式下，它匹配 ASCII 字符集中被认为是空白的字符；这等同于\
    \ `[\\t\\n\\r\\f\\v]`。\n\n* `\\S`\n  匹配任何非空白字符的字符。这是 `\\s` 的相反。如果使用了 ASCII 标志，它等同于\
    \ `[^ \\t\\n\\r\\f\\v]`。\n\n* `\\w`\n  匹配 Unicode 单词字符，包括任何语言中可以组成单词的字符，以及数字和下划线。如果使用了\
    \ ASCII 标志，则只匹配 `[a-zA-Z0-9_]`。在 8 位（字节）模式下，匹配 ASCII 字符集中被认为是字母数字的字符，等同于 `[a-zA-Z0-9_]`。如果使用了\
    \ `LOCALE` 标志，则匹配当前区域设置中被认为是字母数字的字符和下划线。\n\n* `\\W`\n  匹配任何非单词字符的字符。这是 `\\w` 的相反。如果使用了\
    \ ASCII 标志，它等同于 `[^a-zA-Z0-9_]`。如果使用了 `LOCALE` 标志，则匹配当前区域设置中既不是字母数字也不是下划线的字符。\n\
    \n* `\\Z`\n  仅匹配字符串的末尾。该模块定义了几个函数、常量和一个异常。其中一些函数是针对编译正则表达式全功能方法的简化版本。\n\n* `re.compile(pattern,\
    \ flags=0)`\n  将正则表达式模式编译为正则表达式对象，该对象可以使用其 `match()`、`search()` 和其他方法进行匹配，方法见下文。\n\
    \n  模块级正则表达式定义了函数、常量和异常。其中一些 RE 是针对编译正则表达式全功能方法的简化版本。\n\n* `re.A`\n  使 `\\w`、`\\\
    W`、`\\b`、`\\B`、`\\d`、`\\D`、`\\s` 和 `\\S` 执行 ASCII 匹配而不是全 Unicode 匹配。这对于 Unicode\
    \ 模式有效，字节模式会被忽略。\n\n* `re.DEBUG`\n  显示关于编译表达式的调试信息。没有对应的内联标志。\n\n* `re.I`\n  执行不大小敏感匹配；如\
    \ `[A-Z]` 的表达式也会匹配小写字母。全 Unicode 匹配（例如 `Ü` 匹配 `ü`）同样有效，除非使用 `ASCII` 标志禁用非 ASCII\
    \ 匹配。当前区域不会改变此标志的影响，除非也使用了 `LOCALE` 标志。\n\n  注意，当 Unicode 模式 `[a-z]` 或 `[A-Z]`\
    \ 与 `IGNORECASE` 标志结合时，它们将匹配 52 个 ASCII 字母和 4 个额外的非 ASCII 字母：‘İ’（U+0130, 带有上点的拉丁大写\
    \ I）、‘ı’（U+0131, 拉丁无点字母 i）、‘ſ’（U+017F, 拉丁长字母 s）和‘K’（U+212A, 开尔符号）。如果使用了 `ASCII`\
    \ 标志，则只匹配字母 `a` 到 `z` 和 `A` 到 `Z`。\n\n* `re.L`\n  使 `\\w`、`\\W`、`\\b`、`\\B` 以及不大小敏感匹配依赖于当前区域设置。此标志仅适用于字节模式。不建议使用此标志，因为区域设置机制非常不可靠，一次只能处理一种“文化”，且仅对\
    \ 8 位区域设置有效。Python 3 中， Unicode `(str)` 模式默认已启用 Unicode 匹配，并能够处理不同的区域设置/语言。对应内联标志\
    \ `(?L)`。\n\n* `re.M`\n  指定时，模式字符 `^` 匹配字符串的开头以及每行的开头（紧跟在每个换行符之后）；模式字符 `$` 匹配字符串的结尾以及每行的结尾（紧跟在每个换行符之前）。默认情况下，`^`\
    \ 仅匹配字符串的开头，`$` 仅匹配字符串的结尾以及字符串末尾换行符之前（如果有）。对应内联标志 `(?m)`。\n\n* `re.S`\n  使特殊字符\
    \ `.` 匹配任何字符，包括换行符；没有此标志，`.` 将匹配除换行符以外的任何字符。对应内联标志 `(?s)`。\n\n* `re.X`\n  此标志允许你编写看起来更简单、更易读的正则表达式，允许你视觉上分离模式的逻辑部分并添加注释。模式中的空白会被忽略，除非在字符类中、或者在未转义的反斜杠之后，或者在诸如\
    \ `*?` 等标记内部。\n\n* `re.search(pattern, string, flags=0)`\n  扫描字符串以找到正则表达式产生匹配的第一位置，并返回匹配对象。如果字符串中没有位置匹配模式，则返回\
    \ `None`。注意这与零长度匹配不同。\n\n* `re.match(pattern, string, flags=0)`\n  如果字符串开头的零或多个字符匹配正则表达式，则返回相应的匹配对象。如果字符串不匹配模式，则返回\
    \ `None`；注意这与零长度匹配不同。\n\n  注意即使在 `MULTILINE` 模式下，`re.match()` 也仅匹配字符串的开头，而不是每行的开头。\n\
    \n  如果你想在字符串的任何位置定位匹配，请使用 `search()`（参见 `search()` 与 `match()`）。\n\n* `re.fullmatch(pattern,\
    \ string, flags=0)`\n  如果整个字符串匹配正则表达式，则返回相应的匹配对象。如果字符串不匹配模式，则返回 `None`；注意这与零长度匹配不同。\n\
    \n* `re.split(pattern, string, maxsplit=0, flags=0)`\n  根据模式的出现情况分割字符串。如果模式在使用捕获括号，则模式中所有组的文本也将作为列表的一部分返回。如果\
    \ `maxsplit` 非零，则最多发生 `maxsplit` 次分割，并将剩余字符串作为最后一个元素返回。\n\n* `re.findall(pattern,\
    \ string, flags=0)`\n  以字符串列表形式返回字符串中模式的所有非重叠匹配项。字符串从左到右扫描，匹配项按顺序返回。如果模式中存在一个或多个组，则返回组的列表；如果模式有多个组，则将返回元组列表。空匹配包含在结果中，非空匹配现在可以从上一个空匹配之后开始。\n\
    \n* `re.finditer(pattern, string, flags=0)`\n  返回一个迭代器，通过该迭代器产生字符串中 RE 模式的所有非重叠匹配的对象。字符串从左到右扫描，匹配项按顺序返回。空匹配包含在结果中，非空匹配现在可以从上一个空匹配之后开始。\n\
    \n* `re.sub(pattern, repl, string, count=0, flags=0)`\n  返回通过将字符串中从左侧开始的非重叠模式替换为\
    \ `repl` 得到的字符串。如果未找到模式，则返回原始字符串。`repl` 可以是字符串或函数；如果是字符串，则其中的任何反斜杠转义将被处理。\n"
- fmt: '

    Compiled regular expression objects support the following methods and attributes:


    *   `Pattern.search(string[, pos[, endpos]]):` Scan through string looking for
    the first location where this regular expression produces a match, and return
    a corresponding match object. Return `None` if no position in the string matches
    the pattern; note that this is different from finding a zero-length match at some
    point in the string.

    *   `Pattern.fullmatch(string[, pos[, endpos]]):` If the whole string matches
    this regular expression, return a corresponding match object. Return `None` if
    the string does not match the pattern; note that this is different from finding
    a zero-length match.

    *   `Pattern.split(string, maxsplit=0):` Identical to the `split()` function,
    using the compiled pattern.

    *   `Pattern.findall(string[, pos[, endpos]]):` Similar to the `findall()` function,
    using the compiled pattern, but also accepts optional `pos` and `endpos` parameters
    that limit the search region like for `search()`.

    *   `Pattern.finditer(string[, pos[, endpos]]):` Similar to the `finditer()` function,
    using the compiled pattern, but also accepts optional `pos` and `endpos` parameters
    that limit the search region like for `search()`.

    *   `Pattern.sub(repl, string, count=0):` Identical to the `sub()` function, using
    the compiled pattern.

    *   `Pattern.subn(repl, string, count=0):` Identical to the `subn()` function,
    using the compiled pattern.

    *   `Pattern.flags:` The regex matching flags. This is a combination of the flags
    given to `compile()`, any `(?…)` inline flags in the pattern, and implicit flags
    such as `UNICODE` if the pattern is a Unicode string.

    *   `Pattern.groups:` The number of capturing groups in the pattern.

    *   `Pattern.group index:` A dictionary mapping any symbolic group names defined
    by `(?P<id>)` to group numbers. The dictionary is empty if no symbolic groups
    were used in the pattern.

    *   `Pattern.pattern:` The pattern string from which the pattern object was compiled.


    ## FLASK AND FALCON FRAMEWORKS


    ![](images/fig6_4.jpg) <details><summary>Long Description</summary>The logo of
    Flask features the image of a horn flask and the tag line, Flask web development,
    one drop at a time.</details> ![](images/fig6_5.jpg) <details><summary>Long Description</summary>The
    logo of Falcon is the company''s name, with a falcon perched on the letter o,
    and the tag line, The bare-metal Python web framework.</details>


    Flask is a micro web framework written in `Python`. It is classified as a “micro”
    simply because it does not require any specific tools or libraries. It also does
    not have a database abstraction layer, form validation, or any other components
    where pre-existing third-party libraries can form common functions. Nevertheless,
    Flask has extensions that can add application features as if they were implemented
    in Flask itself. Same extensions exist for object-relational mappers, form validation,
    upload handling, various open authentication technologies, and several common
    framework-related tools.


    Flask was created by Armin Ronacher of Pocoo, an international group of Python
    experts formed in 2004. Flask almost instantly become popular among other Python
    enthusiasts and counts for the second most used web-development frameworks, only
    slightly behind Django. Applications that use the Flask framework include widely-known
    websites like Pinterest and LinkedIn.


    The microframework Flask is based on several components:


    *   `Werkzeug:` is a utility library for the Python programming language that
    could also be treated as a toolkit for Web Server Gateway Interface (WSGI) applications.
    Werkzeug can produce software objects for request, response, and utility functions.
    It can also be used to build a custom software framework on top of it and supports
    Python later versions.

    *   `Jinja:` is a template engine for the Python programming language that is
    mostly used to handle templates in a sandbox.

    *   `MarkupSafe:` is a string handling library for the Python programming language.
    It extends the Python string type and marks its contents as “safe,” and if combined
    with regular strings, it automatically escapes the unmarked strings, while avoiding
    double escaping of already marked strings.

    *   `dangerous:` is a safe data serialization library for the Python programming
    language, that is used to store the session of a Flask application in a cookie
    without allowing users to tamper with the session contents.


    Main features of Flask also include:


    *   Development server and debugger

    *   Integrated support for unit testing

    *   RESTful request dispatching

    *   Uses `Jinja` templating

    *   Support for secure cookies

    *   Unicode-based

    *   Extensive documentation

    *   Google App Engine compatibility

    *   Extensions available to enhance features desired


    Falcon adds more functionality to the general Python web frameworks by providing
    extra performance, reliability, and flexibility anytime you need it. It has many
    advantages to it including the following:


    *   `Reliability:` Falcon does not have dependencies outside the standard library,
    helping minimize your website''s attack surface by avoiding transitive bugs and
    breaking changes.

    *   `Easy to maintain:` With Falcon, it is easy to tell which inputs lead to which
    outputs. Unhandled exceptions are rarely happening and potentially disturbing
    behaviors, such as automatic request body parsing, are disabled by default. Finally,
    when it comes to the framework itself, the scripting logic paths are simple and
    understandable. All this makes it easier to reason about the code and to moderate
    cases in large-scale deployments.

    *   `Fast:` Falcon responds and completes requests significantly faster than other
    popular Python frameworks like Django and Flask. For an extra speed boost, Falcon
    compiles itself with alternative programming languages like `Cython`, and also
    works well with `PyPy`.

    *   `Flexible:` Falcon lets you decide a lot of decisions and implementation details.
    This option gives you a lot of freedom to customize and edit. It also helps you
    understand your apps from the basic level, making it easier to tune, debug, and
    modify over the long run.


    The main features of Falcon include the following:


    *   Native asyncio support

    *   No reliance on magic globals for routing and state management

    *   Stable interfaces with an emphasis on backward-compatibility

    *   Highly optimized, extensible codebase

    *   DRY request processing via middleware components and hooks

    *   Idiomatic HTTP error responses

    *   Straightforward exception handling

    *   CPython 3.5+ and PyPy 3.5+ support


    Using a popular web framework like Flask or Falcon guarantees that you will be
    able to save a significant amount of time and money, as well as maintain security
    and functionality. However, if you still do not know which framework to opt for
    you should review these important factors that will be able to help decide:


    ### 1. Technology Changes


    When creating a proof of concept, you may want to use Flask due to its short learning
    curve and speed in lightweight development. But when it comes time to further
    developing your product, we may state that Django is the best option to move your
    project forward.


    ### 2. Support for WSGI


    Web Server Gateway Interface is a standard that permits different computer systems
    to interoperate with one another. To be precise, it allows a web framework to
    interact with a web server. This is a great tool when creating an application
    that lets a developer easily communicate with another online service. Applications
    may also be judged as WSGI is equipped to handle many requests at the same time.
    Flask, Django, and Falcon all support WSGI.


    ### 3. Support for Your Framework

