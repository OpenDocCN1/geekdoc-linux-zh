- fmt: "\nPython is an excellent programming tool that allows you to be productive\
    \ in a wide variety of ways. Python also has a piece of software called an interpreter.\
    \ The interpreter is the program you are going to need to run Python code and\
    \ scripts properly. In technical terms, the interpreter is a layer of software\
    \ that operates between your program and computer hardware to get your code running.\
    \ Depending on the code implementation you use, the interpreter can be:\n\n* \
    \  A program written in Python itself usually uses `PyPy` interpreter.\n*   A\
    \ program written in C run with `CPython`, which is the core implementation of\
    \ the language.\n*   A program written in Java operates with `Jython`.\n*   A\
    \ program implemented in `.NET`, usually use an open-source `IronPython` interpreter.\n\
    \nGiven examples of interpreters are able to run Python code in two different\
    \ ways: as a script or module or alternatively as a piece of code scripted into\
    \ an interactive session. Nevertheless, whatever form the interpreter can take,\
    \ the code you write will have to be run by this program. Therefore, the first\
    \ condition to be able to implement Python scripts is to have the interpreter\
    \ correctly installed on your system.\n\nWhen you start to run Python scripts,\
    \ a multi-step process sets in motion. In this process, the interpreter will:\n\
    \n*   Process all the statements of your script in sequential order.\n*   Compile\
    \ the source code to an intermediate format, also known as `bytecode`.\n    This\
    \ `bytecode` in this case is used as a translation tool of the code into a lower-level\
    \ language that could be platform-independent. Its main purpose is to optimize\
    \ code realization. So, the next time the interpreter runs your code, it will\
    \ bypass this compilation process. To put it simply, this code optimization is\
    \ only necessary to proceed with modules or other imported files, and not with\
    \ executable scripts.\n*   Send away the code for execution.\n    At this step,\
    \ something known as a Python Virtual Machine (`PVM`) comes into play. The `PVM`\
    \ is the runtime engine that is used for iteration over the instructions of your\
    \ `bytecode` to test and run them one by one. The `PVM` is not just a separate\
    \ component of Python, it is an essential part of the Python system you need to\
    \ install on your machine. Technically, the `PVM` is the last step of what is\
    \ called the Python interpreter.\n\nThe whole course to run Python scripts is\
    \ known as the Python Execution Model. In addition, there are many other ways\
    \ to run Python scripts:\n\n### Using the Python Command\n\n`python` command is\
    \ the most basic and practical way to run Python scripts. All you need to do to\
    \ run Python scripts with the `python` command is to open a command-line and type\
    \ in the word `python`, or `python3` if you have both versions, followed by the\
    \ path to your script. To illustrate:\n\nIf everything works fine, then after\
    \ you press Enter, you will be able to see the phrase `Hello There!` on your screen.\
    \ With these simple steps, you have just run a Python script. But in case, if\
    \ it does not work right, it is recommended to check your system `PATH`, your\
    \ Python installation, the way you created the `hello.py` script, space where\
    \ you saved it.\n\nAt times, it is also useful to save the output of a script\
    \ for later analysis. You can do it in the following manner:\n\n```bash\npython\
    \ hello.py > output.txt\n```\n\nThis operation redirects the output of your script\
    \ to `output.txt`, rather than to the standard system output (`stdout`). The process\
    \ is also known as stream redirection and is available on both Windows and Unix-like\
    \ systems. If `output.txt` does not exist, then it's automatically created. On\
    \ the other hand, if the file already exists, then its contents will be replaced\
    \ with the new output.\n\nConsequently, if you want to add the output of consecutive\
    \ executions to the end of `output.txt`, then you must use two angle brackets\
    \ (`>>`) instead of one, just like this:\n\n```bash\npython hello.py >> output.txt\n\
    ```\n\n### Using the Script Filename\n\nOn recent versions of Windows, it is convenient\
    \ to run Python scripts by simply entering the name of the file containing the\
    \ code at the command space:\n\n```bash\nhello.py\n```\n\nThis procedure is possible\
    \ because Windows has the system registry and the file association to assign which\
    \ program to use for running a particular file. On Unix-like systems, such as\
    \ `GNU/Linux`, you can achieve something similar by adding a first line with the\
    \ text `#!/usr/bin/env python`, just as you do with `hello.py`.\n\nFor Python,\
    \ this translates as a simple comment, but this line indicates what program must\
    \ be activated to run the file for the operating system. This line opens with\
    \ the `#!` character combination, which is commonly called hashbang or shebang\
    \ and continues with the path to the interpreter. There are two ways to specify\
    \ the path to the interpreter:\n\n*   `#!/usr/bin/python`: used to script the\
    \ absolute path.\n*   `#!/usr/bin/env python`: for when you are using the operating\
    \ system `env` command, which locates and implements Python by searching the `PATH`\
    \ environment variable.\n\nThis last option is useful for Unix-like systems to\
    \ locate the interpreter in different places. Eventually, to execute a script\
    \ like this one, you need to assign execution permissions to it and then type\
    \ in the filename at the command line.\n\n### How to Run Python Scripts Interactively\n\
    \nIt is also feasible to run Python scripts and modules from an interactive session.\
    \ This possibility offers you a variety of possibilities. When you take advantage\
    \ of importing a module, you can load its contents for later access and use. The\
    \ interesting point about this process is that `import` runs the code as its final\
    \ step.\n\nIf the module contains only classes, functions, variables, and constants\
    \ definitions, you probably will not be able to track if the code was actually\
    \ run, but when the module includes calls to functions, methods, or other statements\
    \ that generate visible results, then you will be able to observe its execution.\
    \ This provides you with another option to run Python scripts:\n\n```python\n\
    import hello\n```\n\nYou should take note that this option works only once per\
    \ session. After the first `import`, successive `import` executions will be of\
    \ no use, even if you modify the content of the module. This is because `import`\
    \ operations are expensive and could run only once. To illustrate with an example:\n\
    \n```python\nimport hello\nimport hello\n```\n\nThese two `import` operations\
    \ do nothing because Python knows that `hello` has already been imported. However,\
    \ there are some requirements for this method to work – firstly, the file with\
    \ the Python code must be located in your current working directory. And secondly,\
    \ the file should be in the Python Module Search Path (`PMSP`), where Python can\
    \ look for the modules and packages you import.\n\n### How to Run Python Scripts\
    \ from an IDE or a Text Editor\n\nWhen scripting larger and more complicated applications,\
    \ it is recommended that you use an integrated development environment (IDE) or\
    \ an advanced text editor. Most of these programs have the capacity to run your\
    \ scripts from inside the environment itself. It is common for them to include\
    \ a `Run` or `Build` command, which is usually available from the toolbar or from\
    \ the main menu.\n\nPython's standard distribution package already includes `IDLE`\
    \ as the default IDE, and you can use it to write, debug, modify, as well as to\
    \ run your modules and scripts. Other IDEs such as `Eclipse-PyDev`, `PyCharm`,\
    \ `Eric`, and `NetBeans` also let you run Python scripts from inside the environment.\
    \ In addition, you also have advanced text editors like `Sublime Text` and `Visual\
    \ Studio Code` that also allow you to run your scripts.\n\n### How to Run Python\
    \ Scripts from a File Manager\n\nRunning a script simply by double-clicking on\
    \ its icon in a file manager is another easy way to run your Python scripts. This\
    \ option may not be widely popular in the development stage, but it may be useful\
    \ when you are ready to release your code for production. However, in order to\
    \ be able to run your scripts with a double-click; you should satisfy some conditions\
    \ that will depend on your operating system.\n"
