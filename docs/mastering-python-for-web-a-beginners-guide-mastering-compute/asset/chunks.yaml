    编译后的正则表达式对象支持以下方法和属性：


    *   `Pattern.search(string[, pos[, endpos]]):` 扫描字符串以查找该正则表达式产生匹配第一个位置，并返回相应的匹配对象。如果字符串中没有位置匹配模式，则返回
    `None`；请注意，这与在字符串的某处找到零长度匹配是不同的。

    *   `Pattern.fullmatch(string[, pos[, endpos]]):` 如果整个字符串匹配此正则表达式，则返回相应的匹配对象。如果字符串不匹配模式，则返回
    `None`；注意，这与找到零长度匹配不同。

    *   `Pattern.split(string, maxsplit=0):` 与 `split()` 函数相同，但使用的是编译后的模式。

    *   `Pattern.findall(string[, pos[, endpos]]):` 与 `findall()` 函数相似，使用了编译后的模式，但也接受可选的
    `pos` 和 `endpos` 参数，这些参数像 `search()` 一样限制搜索区域。

    *   `Pattern.finditer(string[, pos[, endpos]]):` 与 `finditer()` 函数相似，使用了编译后的模式，但也接受可选的
    `pos` 和 `endpos` 参数，这些参数像 `search()` 一样限制搜索区域。

    *   `Pattern.sub(repl, string, count=0):` 与 `sub()` 函数相同，使用了编译后的模式。

    *   `Pattern.subn(repl, string, count=0):` 与 `subn()` 函数相同，使用了编译后的模式。

    *   `Pattern.flags:` 正则表达式匹配标志。这是传递给 `compile()` 的标志、模式中的任何 `(?…)` 内联标志以及隐式标志（如果模式是
    Unicode 字符串则为 `UNICODE`）的组合。

    *   `Pattern.groups:` 模式中捕获组的数量。

    *   `Pattern.group index:` 字典，将由 `(?P<id>)` 定义的任何符号组名称映射到组数字。如果模式中没有使用符号组，则该字典为空。

    *   `Pattern.pattern:` 用于编译模式对象的原始模式字符串。


    ## FLASK 和 FALCON 框架


    ![](img/fig6_4.jpg) <details><summary>详细描述</summary>Flask 的标志包含一个烧瓶的图像以及口号：“Flask
    web development, one drop at a time.”</details> ![](img/fig6_5.jpg) <details><summary>详细描述</summary>Falcon
    的标志是公司的名称，一只隼停在字母 o 上，口号是：“The bare-metal Python web framework.”</details>


    Flask 是一个用 `Python` 编写的微 Web 框架。它被分类为“微”仅仅因为它不需要任何特定的工具或库。它没有数据库抽象层、表单验证或任何可以使用现有的第三方库来实现常用功能的组件。尽管如此，Flask
    拥有扩展，可以添加应用程序功能，就像在 Flask 本身中实现的一样。对象关系映射器、表单验证、上传处理、各种开放认证技术以及几种常用的框架相关工具也存在类似的扩展。


    Flask 由 Pocoo 的 Armin Ronacher 创建，Pocoo 是一个成立于 2004 年的国际 Python 专家小组。Flask 几乎立即在其他
    Python 爱好者中流行起来，是使用次数第二 Web 开发框架，仅略后于 Django。使用 Flask 框架的应用程序包括 Pinterest 和 LinkedIn
    等广知名网站。


    微框架 Flask 基于几个组件：


    *   `Werkzeug:` 是 Python 编程语言的实用库，也可以被视为 Web 服务器网接口（WSGI）应用程序的工具箱。Werkzeug 可以生成请求、响应和实用函数的软件对象。它还可以用于在其上方构建自定义的软件框架，并支持后继版本的
    Python。

    *   `Jinja:` 是 Python 编程语言的模板引擎，主要用于处理沙箱中的模板。

    *   `MarkupSafe:` 是 Python 编程语言的字符串处理库。它扩展了 Python 字符串类型并将其内容标记为“安全”（safe），如果与普通字符串结合使用，它会自动转义未标记的字符串，同时避免对已标记字符串进行双重转义。

    *   `dangerous:` 是 Python 编程语言的安全数据序列化库，用于在 cookie 中存储 Flask 应用程序的会话而不允许用户更改会话内容。


    Flask 的主要还包括：


    *   开发服务器和调试器

    *   集成的单元测试支持

    *   RESTful 请求分发

    *   使用 `Jinja` 模板

    *   支持安全 cookie

    *   基于 Unicode

    *   详尽的文档

    *   兼容 Google App Engine

    *   提供可用的扩展以增强所需功能


    Falcon 通过在你任何需要的时候提供额外的性能、可靠性和灵活性，为通用的 Python 框架增加了更多功能。它有许多优势，包括：


    *   `可靠性:` Falcon 没有标准库之外的依赖项，通过避免传递性 bug 和破坏性更改，帮助尽量减少你网站的攻击面。

    *   `易于维护:` 使用 Falcon，很容易判断哪些输入导致了哪些输出。很少发生未处理的异常，并且潜在的干扰行为（如自动解析请求体）默认是禁用的。最后，对于框架本身，脚本逻辑路径简单且易于理解。这一切使得代码更容易进行推理，并在大规模部署中更容易管理情况。

    *   `快速:` Falcon 响应和完成请求的速度明显比 Django 和 Flask 等其他流行的 Python 框架快。为了获得额外的速度提升，Falcon
    使用 `Cython` 等替代编程语言进行自编译，并且与 `PyPy` 良好地工作。

    *   `灵活:` Falcon 让你决定很多决策和实现细节。这种选项赋予了你大量的自定义和编辑自由。它还帮助你从基础层面理解应用程序，从长远来看更容易进行调整、调试和修改。


    Falcon 的主要功能包括：


    *   原生 asyncio 支持

    *   路由和状态管理不依赖魔法全局变量

    *   强调向后兼容的稳定接口

    *   高度优化、可扩展的代码库

    *   通过中间件组件和钩子实现 DRY 请求处理

    *   符合习惯的 HTTP 错误响应

    *   直观的异常处理

    *   支持 CPython 3.5+ 和 PyPy 3.5+


    使用像 Flask 或 Falcon 流行的 Web 框架可以确保你节省大量的时间和金钱，并维护安全功能。然而，如果你仍然不知道选择哪种框架，你应该查看这些重要的因素，它们将有助于做出决定：


    ### 1. 技术变更


    在创建概念验证时，你可能想使用 Flask，因为它的学习曲线短且在轻量级开发中速度快。但当进一步开发你的产品时，我们可能会说 Django 是推进你项目的最佳选择。


    ### 2. 对 WSGI 的支持


    Web 服务器网接口（WSGI）是一种允许不同计算机系统相互操作的标准。准确来说，它允许 Web 框架与 Web 服务器交互。创建一个允许开发者轻松与另一个在线服务通信的应用程序时，这是一个极佳的工具。应用程序也可以被判定为
    WSGI，因为它们具备同时处理许多请求的能力。Flask、Django 和 Falcon 都支持 WSGI。


    ### 3. 对你框架的支持


