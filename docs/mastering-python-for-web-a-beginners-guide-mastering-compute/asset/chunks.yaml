    \ that name, such as variables, functions, or objects. A name will only be visible\
    \ to and accessible through the code in its scope. There are two general scopes\
    \ to distinguish: global scope (making names that you define in this scope available\
    \ to all your code) and local scope (making names that you define in this scope\
    \ visible to the code only within the scope).\n\nPython positions itself in web\
    \ development as a back-end language, and it is usually mixed with another front-end\
    \ language to build a whole website. At the same time, the reason for using Python\
    \ in web development is the following: it is a flexible, versatile, and highly\
    \ efficient programming language that has dynamic typing capacity. Python lets\
    \ developers create scientific applications, complex system applications with\
    \ graphics, games, command-line items, web applications, and many other demands.\
    \ Another great reason for using Python is that it can be used and distributed\
    \ for free. Because it is known as an open-source product that operates with a\
    \ broad set of libraries, all the coding information needed is available on the\
    \ Internet, which means that copying, embedding, and distributing Python in your\
    \ products is unlimited and unrestricted. This makes it useful in the digital\
    \ systems space once it conceives flexibility in the marketplace and allows companies\
    \ to interoperate with many industry sectors. There are other factors that simplify\
    \ the use of Python for web development:\n\n*   The simplicity of the programming\
    \ algorithms allows you to ease communication between developers working on the\
    \ same project. Moreover, a language that is easy to learn means that new developers\
    \ or developers who do not have any experience in Python can learn the language\
    \ and join the development team faster.\n\n*   Python is an advanced coding language\
    \ that enables you to complete difficult tasks on the back-end, including AI and\
    \ Data Science and any other basic task in other programming languages.\n\n* \
    \  There are many Python libraries that you can use to advance the development\
    \ of your application. These libraries are packages of pre-scripted code available\
    \ to everyone, so you do not need to reinvent the core. These libraries also let\
    \ programmers manage and transform the data required for continuous data processing\
    \ in Machine Learning. There are a variety of packages and libraries available\
    \ for developing scientific and numeric applications. The most commonly used ones\
    \ are:[²](#chapter201.xhtml_fnapp_2)\n\n    *   SciPy (Scientific Numeric Library);\n\
    \n    *   Pandas (Data Analytics Library);\n\n    *   IPython (Command Shell);\n\
    \n    *   Numeric Python (Fundamental Numeric Package);\n\n    *   Natural Language\
    \ Toolkit (Library For Mathematical and Text Analysis).\n\n*   Python has web\
    \ development frameworks that include Django, Flask, Pyramid, Web2Py, and Turbogears.\
    \ These frameworks consist of packages and modules of standardized code to assist\
    \ you in several application areas (URL routing, accessing the database, HTTP\
    \ requests, and responses).\n\n*   Python is one of the most rapidly developing\
    \ coding languages that allow for quick prototyping and iterations. This makes\
    \ the work easier and far more efficient for developers, giving them a greater\
    \ competitive advantage.\n\n*   Object-oriented programming (OOP) operation is\
    \ considerably simple in Python, which makes development less costly and time\
    \ consuming.\n\n*   Python is a number one choice for enterprise software applications,\
    \ mostly because of its smooth integration with other languages typically used\
    \ in enterprise development, such as Java, PHP, and .NET.\n\nAs previously mentioned,\
    \ Python has various frameworks that simplify the development process. We have\
    \ covered a few of the most well-known Python frameworks:\n\n*   **Django:** This\
    \ framework is well suited for fully fledged web applications and mid-range scalable\
    \ projects. It has built-in features that allow code re-usage, coherent modification\
    \ of different code components, and other functionality valued in web development.\
    \ Django works well with Oracle SQL, PostgreSQL, and MySQL databases.\n\n*   **Flask:**\
    \ The philosophy behind this framework is to provide a simple solution that can\
    \ be easily customized. Flask is usually described as a microframework that is\
    \ commonly applied to small solutions whose main priority is flexible functionality.\
    \ The framework is also applied for creating prototypes.\n\n*   **Falcon:** Adds\
    \ more functionality to the general Python web frameworks by providing extra performance,\
    \ reliability, and flexibility anytime you need it. It has many advantages to\
    \ it including stable interfaces with an emphasis on backward compatibility, highly\
    \ optimized, extensible codebase, and DRY request processing via middleware components\
    \ and hooks.\n\nUsing a popular Python framework like Flask or Falcon guarantees\
    \ that you will be able to save a significant amount of both time and money and\
    \ maintain security and functionality. However, when deciding which framework\
    \ to opt for you should review these important factors that will be able to help\
    \ you decide:\n\n1.  Technology Changes\n\n2.  Support for WSGI\n\n3.  Support\
    \ for Your Framework\n\n4.  Type of App\n\n5.  Databases\n\n6.  Go Open Source\n\
    \n7.  Application Structure\n\n8.  Routing"
