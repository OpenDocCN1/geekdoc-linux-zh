  raw: "4.  **Auto-Generate the rst Files:** Sphinx generates the HTML documentation\
    \ from reStructuredText (rst) files. These rst files define each webpage and may\
    \ contain autodoc directives, which are used to generate the documentation from\
    \ docstrings in an automatic way. And since there is an automatic way to generate\
    \ these files, there is no need to manually type and file out the autodoc directives\
    \ for each class and module. The sphinx-autodoc command is expected to automatically\
    \ generate rst files with autodoc directives from your code. This command only\
    \ needs to be run when a new module is added to the project.\n\n5.  **Build the\
    \ HTML:** After you complete the configuration and rst files set up, you should\
    \ be able to run the make HTML command from the terminal in the main directory\
    \ to generate the HTML files. The HTML files will then be created inside the build/HTML\
    \ folder.\n\n6.  **Advanced Sphinx Items:** Make sure to note that there are additional\
    \ Sphinx directives that can help your documentation look and feel more modern\
    \ and organized. Here are some of the key features that can be useful for you\
    \ to further customize the documentation. All examples are generated with the\
    \ sphinx_rtd_theme:\n\n    1.  **Table of contents:** Sphinx uses a custom directive,\
    \ known as the toctree directive, to describe the relations between different\
    \ files in the form of a or table of contents.\n\n    2.  **Warning box:** A warning\
    \ box can be applied using the warning directive.\n\n        For example: . .\
    \ warning:: This is a **warning** box.\n\n    3.  **Image:** An image item can\
    \ be added using the image directive.\n\n    4.  **Table:** Consequently, a table\
    \ can be added using the table directive.\n\n        ![A zig zag, up pointing\
    \ arrow made of many lines of code.](images/fig3_3.jpg)\n\n## WRITE DOCUMENTATION\
    \ VIA DOCSTRINGS\n\nPython's documentation has for a long time been considered\
    \ to be good for a free programming language. The reason for that was an early\
    \ commitment of Python's creator, Guido van Rossum, to provide documentation on\
    \ the language together with its libraries, to the user community. So that they\
    \ could actively participate in continuing involvement and assistance for creating\
    \ and maintaining Python documentation.\n\nUp to this day, community involvement\
    \ takes many forms, from modifying bug reports to just plain criticizing when\
    \ the documentation could be more polished or easier to use.\n\nMoreover, there\
    \ is a whole Index of Python Enhancement Proposals (PEPs) that go by the following\
    \ categories:[⁶](#chapter3.xhtml_fn3_6) Meta-PEPs (PEPs about PEPs or Processes),\
    \ Other Informational PEPs, Provisional PEPs (provisionally accepted; interface\
    \ may still change), Accepted PEPs (accepted; may not be implemented yet), Open\
    \ PEPs (under consideration), Finished PEPs (done, with a stable interface), Historical\
    \ Meta-PEPs and Informational PEPs, Deferred PEPs (postponed pending further research\
    \ or updates) and finally, Abandoned, Withdrawn, and Rejected PEPs.\n\nThese documents\
    \ are aimed at authors and potential authors of documentation for Python. More\
    \ specifically, it is for users contributing to the standard documentation and\
    \ developing additional documents using the same tools as the standard documents.\n\
    \nAnd in case you have an interest is in contributing to the Python documentation,\
    \ but you do not have the time to learn all the PEPs related to a format for textual\
    \ data and technical documentation – reStructuredText, then you can look it up\
    \ further in this section. We are going to briefly introduce documentation concepts\
    \ and syntax, intended to provide authors with enough information to write documents\
    \ productively.\n\n### Paragraphs\n\nThe paragraph is the most basic block in\
    \ a reST document. They are simply parts of text separated by one or more blank\
    \ lines. In Python indentation is significant, so all lines of the same paragraph\
    \ should be left-aligned to the same level of indentation.\n\n### Inline Markup[⁷](#chapter3.xhtml_fn3_7)\n\
    \nThe standard reST inline markup is quite straight-forward:\n\n### Sections\n\
    \nSection headers are created by underlining or overlining the section title with\
    \ a punctuation character. Generally, there should be no heading levels assigned\
    \ to certain characters as the structure is determined from the succession of\
    \ headings. But for the Python documentation, there is a suggested convention:[⁸](#chapter3.xhtml_fn3_8)\n\
    \nSphinx brings a lot of new directives and interpreted text roles to standard\
    \ reST markup. This section contains the reference material for these facilities.\
    \ However, this material should be treated as just an overview of Sphinx's extended\
    \ markup capabilities. Full coverage can be found in Python PEP documentations.\n\
    \n### Meta-information Markup\n\nThe markup that is going to be described in this\
    \ section is used to provide information about a documented module. Note that\
    \ each module should be documented in its own file.\n\nsectionauthor\n\nStands\
    \ for the author of the current section. The element should include the author's\
    \ name such that it can be used for presentation and email address. The domain\
    \ name part of the address should be lower case. Example:\n\nmodule\n\nThis mark\
    \ stands for the beginning of the description of a module, package, or submodule.\
    \ The name should be fully qualified and have short identifiers; examples that\
    \ are in use include *“*IRIX,*” “*Mac,*” “*Windows,*”* and *“*Unix.*”* It is important\
    \ to use a synopsis option that usually consists of one sentence describing the\
    \ module's purpose – it is currently only used in the Global Module Index.\n\n\
    moduleauthor\n\nThe moduleauthor directive, which can appear multiple times, names\
    \ the authors of the specific module code, just like sectionauthor names the author\
    \ of a piece of documentation. It too does not result in any output.\n\nIn addition,\
    \ it would be beneficial to make the section title of a module-describing file\
    \ meaningful since that value will be inserted in the table-of-content of overview\
    \ files.\n\n### Information Units\n\nThere is a variety of directives applied\
    \ to describe specific features provided by modules. Each directive needs one\
    \ or more signatures to provide basic information about what is being described,\
    \ and the content should be the description. The standard version makes entries\
    \ in the general index. However, if no index entry is desired, you can give the\
    \ directive option flag: noindex:. The following example shows all of the features\
    \ of this directive type:[⁹](#chapter3.xhtml_fn3_9)\n\nc:function\n\nDescribes\
    \ a C function. The signature should be given as in C, for instance:\n\nYou will\
    \ not have to backslash-escape asterisks in the signature; the names of the arguments\
    \ should be given so they may be used in the description.\n\nc:member\n\nDescribes\
    \ a C struct member. Make sure that the text of the description includes the range\
    \ of values allowed, how the value should be interpreted, and whether the value\
