    Both the official installer and the Homebrew package manager are great to work
    with, but the Python Software Foundation supports only the official installer.
    And since the distributions installed by the official installer and the Homebrew
    package manager are not similar, installing from Homebrew comes with a few limitations.


    The Python distribution for macOS on Homebrew does not include the Tcl/Tk dependency
    required by the standard Python interface, `Tkinter` module. `Tkinter` is the
    customary library module for developing GUI in Python and also an interface for
    the Tk GUI toolkit. And since Homebrew does not install the Tk GUI toolkit dependency,
    it still relies on an existing version installed on your system. The system version
    of Tcl/Tk may be outdated and could eventually prevent you from importing the
    `Tkinter` module.


    The Homebrew package manager is a popular method because Homebrew is a command-line
    utility, and can be automated with basic scripts. Additionally, installing Python
    on macOS is preferable by many since it is easy to manage from the command line
    and easy to upgrade without having to go to a website. At the same time, the Python
    distribution offered by Homebrew is not supported by the Python Software Foundation
    and therefore not fully reliable. The most secure method on macOS is still to
    use the official installer, especially if you would need Python GUI programming
    with `Tkinter`.


    ### How to Install from the Official Installer


    As stated before, installing Python from the official installer is the most reliable
    installation method on macOS. It offers all the system dependencies needed for
    developing applications with Python. You can install from the official installer
    in two simple steps.


    #### Step 1: Download the Official Installer by following these steps:


    1. Open a browser window and navigate to the [Python.org](http://Python.org) Downloads
    page for macOS.

    2. Under the “Python Releases for Mac OS X” heading, click the `Latest Python
    3 Release`. As of now, the latest version is Python 3.9.2.

    3. Scroll to the bottom and click `macOS 64-bit installer` to start the download.


    #### Step 2: Run the Installer by double-clicking the downloaded file. You should
    be able to see the following window:


    1. Press `Continue` until you are asked to agree to the software license agreement.
    Then click `Agree`.

    2. You will then see a window that tells you the install destination and asks
    how much space you want it to take. You most likely do not need to change the
    default location, so go continue by clicking `Install` to start the installation.

    3. When the installer is finished copying files, click `Close` to close the installer
    window.


    ### How to Install from Homebrew


    For users who need to install from the command line, and do not need to develop
    GUI with the `Tkinter` module, the Homebrew package manager would be a perfect
    option. You can install it from the Homebrew package manager in two steps.


    #### Step 1: Install Homebrew (in case you already have Homebrew installed, then
    you can skip this step) following this procedure:


    1. Open a browser and go to [http://brew.sh/](http://brew.sh)

    2. You should see a command for installing Homebrew near the top of the page under
    the title “Install Homebrew.”

    3. Highlight this command with your cursor and press `Cmd+C` to copy it to your
    clipboard.

    4. Open a terminal window and paste the command, then press `Enter`. This way
    you have started the Homebrew installation.

    5. Enter your macOS user password when requested.


    It may take a few minutes to download all of Homebrew''s required files, but it
    is done, you will end up back at the shell prompt in your terminal window. If
    you are doing this on macOS for the first time, you may get a pop-up alert asking
    you to install Apple''s command line developer tools. These tools are a prerequisite
    for installation, so you need to confirm the dialog box by clicking `Install`.
    And after the developer tools are installed, you should press `Enter` to continue
    the installation of Homebrew. And once Homebrew is installed, you are ready to
    install Python.


    #### Step 2: Install Python by following these steps:


    1. Open a terminal application.

    2. Type in the following command to upgrade Homebrew:

    ```bash

    brew update && brew upgrade

    ```

    This will download and set up the latest version of Python on your computer. You
    can make sure everything went correctly by testing it through the Terminal:


    1. Open a terminal.

    2. Type `pip3` and press `Enter`.

    3. You should see the text from Python''s `pip` package manager. If you get an
    error message running `pip3`, you should go through the install steps again to
    make sure you have not missed any steps.


    ## HOW TO INSTALL PYTHON ON LINUX


    In this section, you are going to learn about Python installation methods on Linux
    and as a result, will hopefully be able to complete it yourself. Usually, many
    Linux distributions already come packaged with Python, but it probably will not
    be the latest version or could even be Python 2 instead of Python 3. You will
    need to check the version yourself just to make sure. In order to find out which
    version of Python you have, proceed to open a terminal window and try the following
    commands:


    If you already have Python on your computer, then one or more of these commands
    should come up with a version number. Typically, there are two convenient and
    comparatively fast ways to install the official Python distribution on Linux:


    1. **Install from a package manager:** This is the most popular installation method
    on most Linux distributions. It requires running a command from the command line.

    2. **Build from source code:** This method is more complex than using a package
    manager. It involves running a series of commands from the command line and at
    the same time making sure you have the correct dependencies installed to complete
    the Python source code.


    Unfortunately, not every Linux distribution has a package manager, and not every
    package manager has Python in its set. Judging by your operating system, building
    Python from source code could be your only option. Which installation method you
    are going to use mainly depends on whether your Linux OS has a package manager
    and whether you want to control the details of the installation.


    The most popular to this day way to install Python on Linux is with your operating
    system''s package manager. It is considered to be a default choice by many expert
    developers. However, depending on your Linux distribution, Python may not be available
    through a package manager. In this case, you will have to build up Python from
    source code.


    There are three main reasons that could limit you into choosing to build Python
    from source code:


    1. You will not be able to download Python from your operating system''s package
    manager.

    2. If you might need to lower the memory footprint on embedded systems, you will
    want to control how Python gets compiled.

    3. You want to be able to test beta versions and release candidates of the latest
    and most advanced version before it becomes available.


    In order to complete the installation on your Linux machine, find your Linux distribution
    below and follow the steps provided.


    ### How to Install on Ubuntu and Linux Mint


    Depending on which version of the Ubuntu distribution you have, the process for
    setting up Python on your system will vary accordingly. You can determine your
    local Ubuntu version by typing the following command:


    Follow the guideline below that match the version number you get under Release
    heading in the console output:


    * **Ubuntu 18.04, Ubuntu 20.04 and above:** Python 3.9 does not come by default
    on Ubuntu 18.04 and above, but it is available in the Universe repository. To
    install version 3.9, you will need to open a terminal application and type the
    following commands:


    ```bash

    sudo apt-get update

    sudo apt-get install python3.9 python3-pip

    ```

