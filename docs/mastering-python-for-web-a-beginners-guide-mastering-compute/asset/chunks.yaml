    ## LIST DATA TYPE


    A list is the most basic data structure in Python that looks like a mutable, ordered
    sequence of elements. Any element or value that is inside of a list is called
    an item. And just as strings are defined as characters between quotes, lists are
    defined by those values that are placed between square brackets [ ].


    Lists are particularly useful when you want to work with many related values,
    keep data together, condense your code, and perform the same methods and operations
    on multiple values at once.


    The important characteristics of Python lists include the following:


    *   Lists are mutable.


    *   Lists are ordered.


    *   List elements can be accessed by index.


    *   Lists can be nested to arbitrary depth.


    *   Lists are dynamic.


    When thinking about how someone might apply Python lists and other data structures
    that are types of collections, it is useful to try recalling all the different
    collections you might have in your possession: your personal files, your song
    playlists, your browser downloads, your email histories, the collection of videos
    you can access on a cloud service, and more. And with such lists, an ordered sequence
    of elements can become an item in a list and, therefore, be called individually,
    through indexing. In this case, lists are a compound data type that consists of
    smaller parts and are very flexible because they allow values to be added, removed,
    and changed. When you need to store a lot of values or iterate over values, and
    still be able to modify those values, you are most likely to need to work with
    list data types.


    The list is the most versatile datatype available. The important thing about a
    list is that items in a list need not be of the same type, and can be written
    as a list of comma-separated values between square brackets.


