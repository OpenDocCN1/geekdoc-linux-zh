- fmt: "\nYou can also complete the installation on Windows using alternative platforms,\
    \ such as Anaconda ([https://www.anaconda.com/​](https://www.anaconda.com)), which\
    \ is a great interactive website for doing scientific computing and data science\
    \ with Python. By accessing the website, you can learn how to install Anaconda\
    \ on Windows, through `Setting Up Python for Machine Learning on Windows`.\n\n\
    In this chapter, we are only going to focus on only the first two installation\
    \ options, since they are the most convenient and therefore popular installation\
    \ methods in a Windows community.\n\nThe two official Python installers for Windows\
    \ are quite different. The Microsoft Store package has specific limitations. The\
    \ official Python documentation states the following in regards to the Microsoft\
    \ Store package—precisely that it is “intended mainly for interactive use.” Meaning\
    \ that the Microsoft Store package is designed to be used by students and people\
    \ learning to use Python for the first time. And since this method is mostly targeting\
    \ Python beginners, the Microsoft Store package is considered to be ill-suited\
    \ for a professional development environment. Moreover, it does not have full\
    \ write access to shared locations such as `TEMP` or the registry, which could\
    \ be major deal-breakers for expert developers.\n\nBut if you are new to Python\
    \ and for the time being only focused on learning the basics of language rather\
    \ than building professional software, then you should go ahead to install it\
    \ from the Microsoft Store package. It will offer the shortest and easiest way\
    \ to getting started with minimal fuss. On the other hand, if you are one of the\
    \ more experienced developers looking to develop professional software in a Windows\
    \ environment, then the official [Python.org](http://Python.org) installer would\
    \ be an answer for you. In that case, your installation and configuration will\
    \ not be restricted by Microsoft Store policies, and you can control the execution\
    \ process and add Python to `PATH` if necessary.\n\n## How to Install from the\
    \ Microsoft Store\n\nAs mentioned, if you are an absolute newbie to Python and\
    \ looking to get started quickly, then the Microsoft Store package is the best\
    \ option to get you accustomed to Python potential. Simply put, you can install\
    \ it from the Microsoft Store in just one step.\n\n*   **Step 1: Open the Python\
    \ App Page in the Microsoft Store.** Open the Microsoft Store application start\
    \ to search for Python. Here, you are likely to see multiple versions that you\
    \ can choose to install. Make sure you select `Python 3.9.2`, or the highest version\
    \ number you can find available in the application store, to open the installation\
    \ page. Another thing to keep in mind is that you have to pay attention to who\
    \ the application was produced by. The official Python application that you want\
    \ to be installed should be the one created by the Python Software Foundation.\
    \ The official Microsoft Store package will always be free, so if the application\
    \ costs money, then it is not the original one. Alternatively, you can open `PowerShell`\
    \ and type the following command:\n\n```bash\npython\n```\n\nIf you do not have\
    \ a version of Python on your system yet, then if you press Enter, the Microsoft\
    \ Store will automatically launch you to the latest version of Python in the store.\
    \ And once you have selected the version to be installed, follow these simple\
    \ steps to complete the installation:\n\n1.  Click `Get`.\n2.  Wait for the application\
    \ to start downloading. When it's finished downloading, instead of the `Get` button\
    \ you will see a different button that says `Install on my devices`.\n3.  Click\
    \ `Install on my devices` and select the devices on which you would like to complete\
    \ the installation.\n4.  Click `Install Now` and then `OK` to start the installation.\n\
    5.  Once the installation is successfully completed, you will see the message\
    \ at the top: “This product is installed.”\n\n## How to Install from the Full\
    \ Installer\n\nFor professional developers, the full installer hands you total\
    \ control over the installation. You can customize the installation to meet your\
    \ needs using the options available in the dialog box.\n\n*   **Step 1: Download\
    \ the installer**\n    You need to navigate to the [Python.org](http://Python.org)\
    \ Downloads page. Under the `Latest` button, select the latest version.\n\n* \
    \  **Step 2: Run the Installer**\n    Once you have completed downloading, run\
    \ it by double-clicking. A dialog box like the one below will appear:\n\n1.  `Customize\
    \ installation`: This is usually used to choose which features get installed.\n\
    \    2.  `Install for all users`: This means every user on the machine will have\
    \ access to the `py.exe` launcher.\n    3.  `Add Python 3.9 to PATH`: This checkbox\
    \ is unchecked by default. There might be drawbacks to not wanting Python on `PATH`,\
    \ so make sure you understand the implications before you check this box.\n\n\
    Click `Install Now`.\n"
  raw: "You can also complete the installation on Windows using alternative platforms,\
    \ such as Anaconda ([https://www.anaconda.com/​](https://www.anaconda.com)), which\
    \ is a great interactive website for doing scientific computing and data science\
    \ with Python. By accessing the website, you can learn how to install Anaconda\
    \ on Windows, through Setting Up Python for Machine Learning on Windows.\n\nIn\
    \ this chapter, we are only going to focus on only the first two installation\
    \ options, since they are the most convenient and therefore popular installation\
    \ methods in a Windows community.\n\nThe two official Python installers for Windows\
    \ are quite different. The Microsoft Store package has specific limitations. The\
    \ official Python documentation states the following in regards to the Microsoft\
    \ Store package—precisely that it is “intended mainly for interactive use.” Meaning\
    \ that the Microsoft Store package is designed to be used by students and people\
    \ learning to use Python for the first time. And since this method is mostly targeting\
    \ Python beginners, the Microsoft Store package is considered to be ill-suited\
    \ for a professional development environment. Moreover, it does not have full\
    \ write access to shared locations such as TEMP or the registry, which could be\
    \ major deal-breakers for expert developers.\n\nBut if you are new to Python and\
    \ for the time being only focused on learning the basics of language rather than\
    \ building professional software, then you should go ahead and install it from\
    \ the Microsoft Store package. It will offer the shortest and easiest way to getting\
    \ started with minimal fuss. On the other hand, if you are one of the more experienced\
    \ developers looking to develop professional software in a Windows environment,\
    \ then the official [Python.org](http://Python.org) installer would be an answer\
    \ for you. In that case, your installation and configuration will not be restricted\
    \ by Microsoft Store policies, and you can control the execution process and add\
    \ Python to PATH if necessary.\n\n### How to Install from the Microsoft Store\n\
    \nAs mentioned, if you are an absolute newbie to Python and looking to get started\
    \ quickly, then the Microsoft Store package is the best option to get you accustomed\
    \ to Python potential. Simply put, you can install it from the Microsoft Store\
    \ in just one step.\n\n*   **Step 1: Open the Python App Page in the Microsoft\
    \ Store.** Open the Microsoft Store application start to search for Python. Here,\
    \ you are likely to see multiple versions that you can choose to install. Make\
    \ sure you select Python 3.9.2, or the highest version number you can find available\
    \ in the application store, to open the installation page. Another thing to keep\
    \ in mind is that you have to pay attention to who the application was produced\
    \ by. The official Python application that you want to be installed should be\
    \ the one created by the Python Software Foundation. The official Microsoft Store\
    \ package will always be free, so if the application costs money, then it is not\
    \ the original one. Alternatively, you can open PowerShell and type the following\
    \ command:\n\nIf you do not have a version of Python on your system yet, then\
    \ if you press Enter, the Microsoft Store will automatically launch you to the\
    \ latest version of Python in the store. And once you have selected the version\
    \ to be installed, follow *these simple steps to complete the installation*:\n\
    \n1.  Click *Get*.\n\n2.  Wait for the application to start downloading. When\
    \ it's finished downloading, instead of the *Get* button you will see a different\
    \ button that says *Install on my devices*.\n\n3.  Click *Install on my devices*\
    \ and select the devices on which you would like to complete the installation.\n\
    \n4.  Click *Install Now* and then *OK* to start the installation.\n\n5.  Once\
    \ the installation is successfully completed, you will see the following message\
    \ at the top of the Microsoft Store page: “This product is installed.”\n\n###\
    \ How to Install from the Full Installer\n\nFor professional developers, who look\
    \ for a full-featured Python development options, installing from the full installer\
    \ is the correct choice. It enables more customization and lets you take control\
    \ over the installation, unlike if you choose to install from the Microsoft Store.\
    \ You can install from the full installer in two steps.\n\n*   **Step 1: You have\
    \ to download the Full Installer following these steps:**\n\n1.  Open a browser\
    \ window and navigate to the [Python.org](http://Python.org) Downloads page for\
    \ Windows.\n\n2.  Under the “Python Releases for Windows” button, click the link\
    \ for the Latest Python 3 Release. And as of now, the latest version was Python\
    \ 3.9.2.\n\n3.  Scroll to the bottom and select either *Windows x86-64 executable\
    \ installer for 64-bit* or *Windows x86 executable installer for 32-bit*.\n\n\
    \    If you are not sure whether to select the 32-bit or the 64-bit installer,\
    \ then you can expand the box below to help you decide.\n\n*   **Step 2: Run the\
    \ Installer**\n\n    Once you have completed downloading an installer, run it\
    \ by double-clicking on the downloaded file. A dialog box like the one below will\
    \ appear. There would be four things you need to notice about this dialog box:\n\
    \n1.  The default install path is in the AppData/directory of the current Windows\
    \ user.\n\n2.  The *Customize installation* button is usually used to customize\
    \ the installation location and which additional features get installed, including\
    \ pip and IDLE.\n\n3.  The *Install launcher for all users* checkbox is checked\
    \ default. This means every user on the machine will have access to the py.exe\
    \ launcher. You can uncheck this box to restrict Python to the current Windows\
    \ user.\n\n4.  The *Add Python 3.9 to PATH* checkbox is unchecked by default.\
    \ There might be several drawbacks that might change your mind to not wanting\
    \ Python on PATH, so make sure you understand the implications before you check\
    \ this box.\n\n    The full installer hands you total control over the installation\
    \ process. You can customize the installation to meet your needs using the options\
    \ available in the dialog box. All you need to do after that is just to click\
    \ *Install Now*.\n\n## HOW TO INSTALL PYTHON ON macOS\n\nPython 2 as well as other\
    \ programming languages like Ruby, and Perl used to come preinstalled on older\
    \ versions of macOS. However, it is no longer the case for current versions of\
    \ macOS, starting with macOS Catalina. Naturally, there are two claimed installation\
    \ methods on macOS:\n\n1.  The official installer\n\n2.  The Homebrew package\
    \ manager\n\nTo start with, you might need to check which Python version you have\
    \ on your Mac. You can do it by opening a command-line application, such as Terminal.\
    \ And, here is how you open Terminal:\n\n1.  Press the Cmd+Space keys\n\n2.  Type\
    \ Terminal\n\n3.  Press Enter\n\nAlternatively, you can go through opening Finder\
    \ and navigating to *Applications → Utilities → Terminal*. With the command line\
    \ open, try typing in the following commands:\n\n1.  # Check the system Python\
    \ version\n\n    $ python –version\n\n2.  # Check the Python 2 version\n\n   \
    \ $ python2 –version\n\n3.  # Check the Python 3 version\n\n    $ python3 –version\n\
    \nAnd if you have Python on your system, then one or more of these commands would\
    \ automatically respond with a version number. You might want to get the latest\
    \ version of Python if any of these conditions is true:\n\n*   None of the above\
    \ commands come up with a version number.\n\n*   The only version you see displayed\
    \ is in the Python 2.X series.\n\n*   You have a version of Python 3 that is not\
    \ the newest available.\n\nAs mentioned earlier, there are two ways to install\
    \ the official Python distribution on macOS:\n\n1.  **The official installer:**\
    \ This method requires downloading the official installer from the [Python.org](http://Python.org)\
    \ website.\n\n2.  **The Homebrew package manager:** This method involves first\
    \ downloading and installing the Homebrew package manager if you do not have it\
    \ installed yet, and then typing a command into a terminal application."
