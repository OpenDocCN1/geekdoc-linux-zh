    \ yielding match objects over all non-overlapping matches for the RE pattern in\
    \ string. The string is scanned left-to-right, and matches are returned in the\
    \ order found. Empty matches are included in the result and non-empty matches\
    \ can now start just after a previous empty match.\n\n*   re.sub(pattern, repl,\
    \ string, count=0, flags=0)\n\n    Return the string obtained by replacing the\
    \ leftmost non-overlapping occurrences of pattern in string with the replacement\
    \ repl. If the pattern is not found, string is returned unchanged. repl can be\
    \ a string or a function; if it is a string, any backslash escapes in it are processed.\n\
    \n### Regular Expression Objects"
