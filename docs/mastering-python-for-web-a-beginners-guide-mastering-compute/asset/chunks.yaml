- fmt: "\n# Comments\n\nYour comments should be right to the point. In the case, where\
    \ everything is plain understandable, you do not need to add anything. The acronym\
    \ many developers use is D.R.Y., which stands for the programming slogan `“Do\
    \ not Repeat Yourself.”` This means that your code should be concise to the maximum.\
    \ You do not need to comment on a part of code that sufficiently explains itself,\
    \ like this one:\n\nWe can clearly see that `x` is returned, so there is clearly\
    \ no need to repeat the statement in a comment. Malpractice as such makes comments\
    \ W.E.T., meaning a developer `“wrote everything twice.”` In addition, once you\
    \ have set the code running, make sure to go back and remove comments that have\
    \ become redundant.\n\n### Avoid unnecessary comments\n\nUnruly, complex comments\
    \ can be a sign indicating that there might be a deeper problem with your code.\
    \ Sometimes code comments could be used to mask the underlying errors of a program.\
    \ Ultimately, comments should support your code, not try to hide miscommunications\
    \ away. It is worth reminding yourself that if your code is poorly written, no\
    \ amount of commenting is going to resolve it.\n\nA comment before every line\
    \ should be kept simple by assigning obvious names to variables, functions, and\
    \ collections. Your comments should rarely be longer than the code they back up.\
    \ If you find yourself spending too much time and line space explaining what you\
    \ did, then you need to go back and redesign to get a clearer code. In addition,\
    \ using obvious naming conventions and removing all unnecessary comments can help\
    \ to reduce the length of the code altogether.\n\n### Avoid rude comments\n\n\
    It is very likely that you will be working on a development team project at some\
    \ point in your life. And, when several people are all working on the same code,\
    \ others are usually encouraged to come and review what you have written so far\
    \ and give their honest feedback. From time to time, you might witness someone\
    \ who dared to add a comment like this one:\n\nSimply put, it is not good to do\
    \ this. Even if it is your friend's code and you are sure they will not be offended\
    \ by it, it is still not acceptable. You never know what bits and pieces can slip\
    \ to production, and how is it going to look if your client might accidentally\
    \ discover it down the road. Including indecent and rude words in your comments\
    \ is not the way to show that you are a professional.\n\nSpeaking of professional\
    \ developers’ ethics, it is worth mentioning that employees of tech organizations\
    \ and companies (engineers, designers, and business executives) mainly based in\
    \ the United States are choosing to sign The Never Again pledge to build solidarity\
    \ and establish ground rules for IT infrastructure. By signing the pledge, they\
    \ commit to:\n\n*   We refuse to participate in the creation of databases of identifying\
    \ information for the United States government to target individuals based on\
    \ race, religion, or national origin.\n*   We will advocate within our organizations:\n\
    \    *   To minimize the collection and retention of data that would facilitate\
    \ ethnic or religious targeting.\n    *   To scale back existing datasets with\
    \ unnecessary racial, ethnic, and national origin data.\n    *   To responsibly\
    \ destroy high-risk datasets and backups.\n    *   To implement security and privacy\
    \ best practices, in particular, for end-to-end encryption to be the default wherever\
    \ possible.\n    *   To demand appropriate legal process should the government\
    \ request that we turn over user data collected by our organization, even in small\
    \ amounts.\n*   If we discover misuse of data that we consider illegal or unethical\
    \ in our organizations:\n    We will work with our colleagues and leaders to correct\
    \ it.\n*   If we cannot stop these practices, we will exercise our rights and\
    \ responsibilities to speak out publicly and engage in responsible whistleblowing\
    \ without endangering users.\n*   If we have the authority to do so, we will use\
    \ all available legal defenses to stop these practices.\n*   If we do not have\
    \ such authority, and our organizations force us to engage in such misuse, we\
    \ will resign from our positions rather than comply.\n*   We will raise awareness\
    \ and ask critical questions about the responsible and fair use of data and algorithms\
    \ beyond our organization and our industry.\n\n## HOW TO PRACTICE COMMENTING?\n\
    \nThe simplest way to start writing more Pythonic comments is just jumping straight\
    \ to it.\n\nYou can start writing comments for yourself in your own code. Make\
    \ it a task to include simple comments from now on where it is suitable. See if\
    \ it adds more clarity to complex functions, and try putting a docstring at the\
    \ top of all your scripts. Another good way to practice would be to go back and\
    \ review any old codes that you have previously written. Observe where anything\
    \ might not make sense, and tidy up the code. If it still needs some extra explanations,\
    \ you might want to add a quick comment to help clarify the code's main resolution.\n\
    \nIt is an especially good idea if your code is up on a provider of Internet hostings\
    \ like GitHub that is used as a platform for software development and version\
    \ control. Try reviewing your older work and help other people by guiding them\
    \ through what you have already done.\n\nUsing the same platform, you can also\
    \ give back to the community by commenting on other people's codes. If you ever\
    \ find yourself downloading something from GitHub and later having troubles going\
    \ through it, add comments as you come to understand how each piece of code can\
    \ be optimized. After completing that, you can just sign your comment with your\
    \ initials and the date, and then submit your changes as a pull request. If your\
    \ changes are merged, you could be helping dozens if not hundreds of developers\
    \ like yourself to get a better version of their projects.\n\nTo conclude, learning\
    \ to comment well should be considered an extremely valuable tool. Not only can\
    \ you learn how to write more clearly and concisely in general, but you will also\
    \ no doubt gain a deeper appreciation of Python as well. Knowing how to write\
    \ comments in Python can make life easier for many developers, starting with yourself.\
    \ Well-placed comments can help to speed on what your code does, and also help\
    \ you get re-acquainted with older codes of your own.\n\nBy noticing when you\
    \ are applying comments to try and support poorly written code, you will be able\
    \ to review and modify your code to make it more efficient. Commenting on previously\
    \ written code, whether your own or another developer's, is a great option for\
    \ those who are just starting to practice writing clean comments in Python. And,\
    \ as you learn more about documenting your code, you can consider moving on to\
    \ the next level which is code documentation.\n\n![The Python logo over the title,\
    \ Python Docstrings.](images/fig3_2.jpg)\n\n## PROGRAMMATIC ACCESSING DOCSTRINGS\n\
    \nAs already pointed out in a previous section, Python code documentation is a\
    \ key and continuous course in the process of software development. The term docstring\
    \ is an abbreviation that stands for documentation string and defines your source\
    \ code – what your function, module, or class does. As a rule, it is added as\
    \ a regular comment right below the head of a code function, module, or method.\
    \ Docstrings is a great way to create documentation for your Python code from\
    \ within the code. This in-code documentation works for all modules, and all functions\
    \ and classes exported by a module should also have docstrings. Public methods\
    \ such as the `__init__` constructor also have docstrings. A package may be documented\
    \ in the module docstring of the `__init__.py` file in the package directory.\n"
