    \ `dir()`，并返回函数作用域内定义的名称列表。\n\n总结来说，变量或名称的作用域决定了它在整个代码中的可见性。在 Python 中，作用域被执行为局部（Local）、闭包（Enclosing）、全局（Global）或内置（Built-in）。当你应用变量或名称时，Python\
    \ 会按顺序查找这些作用域以解析它。在实例情况下，如果未找到名称，将得到错误。这是 Python 激活的名称解析的基本机制，被称为 LEGB 原则。\n\n\
    为了充分利用 Python 的作用域以防止或减少与名称冲突相关的问题，请确保在整个程序中使用全局和局部名称以提高代码的可维护性，并准备好一致的策略来访问、优化或更新所有\
