    \ Returns the left-justified string with the specified width. If the specified\
    \ width is more than the string length, then the string's remaining part is filled\
    \ with the specified fillchar.\n- `string.lower()`: Returns the copy of the original\
    \ string wherein all the characters are converted to lowercase.\n- `string.lstrip()`:\
    \ Returns a copy of the string by removing leading characters specified as an\
