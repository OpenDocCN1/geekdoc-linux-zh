  trans: "\n\n你也可以使用替代平台在 Windows 上完成安装，例如 [Anaconda ([`www.anaconda.com/​`](https://www.anaconda.com))，这是一个用于\
    \ Python 科学计算和数据科学的极佳交互网站。通过访问该网站，你可以通过 `Setting Up Python for Machine Learning\
    \ on Windows` 学习如何在 Windows 上安装 Anaconda。\n\n在本章中，我们仅关注前两种安装选项，因为它们是 Windows 社区中最方便、最受欢迎的安装方法。\n\
    \nWindows 的两个官方 Python 安装程序大相同。Microsoft Store（微软商店）包具有特定的局限性。Python 官方文档关于 Microsoft\
    \ 商店包给出了以下说明——即它“主要用于交互式使用”。这意味着 Microsoft 商店包是专为学生和首次学习使用 Python 的人员设计的。由于这种方法主要针对\
    \ Python 初学者，因此 Microsoft 商店包被认为不适合专业开发环境。此外，它没有对 `TEMP` 或注册表等共享位置的完全写入权限，这对于专家级开发者来说可能是一个致命的缺陷。\n\
    \n但如果你是 Python 新手，并且目前专注于学习语言基础知识而不是构建专业软件，那么你应该直接从 Microsoft 商店包进行安装。它将提供最快捷、最简单且麻烦最少的入门方式。另一方面，如果你是希望在\
    \ Windows 环境下开发专业软件的经验丰富的开发者，那么官方的 [Python.org](http://Python.org) 安装程序将是你的答案。在这种情况下，你的安装和配置将不受\
    \ Microsoft 商店策略的限制，并且你可以控制执行过程并在必要时将 Python 添加到 `PATH`。\n\n## 如何从 Microsoft Store\
    \ 安装\n\n如所述，如果你是 Python 的绝对新手并想要快速上手，那么 Microsoft 商店包是让你熟悉 Python 潜力的最佳选择。简单来说，你只需一步即可从\
    \ Microsoft 商店安装它。\n\n*   **步骤 1：在 Microsoft Store 中打开 Python 页面。** 打开 Microsoft\
    \ Store 应用程序并搜索 Python。在这里，你可能会看到多个可选安装的版本。请确保选择 `Python 3.9.2` 或应用程序商店中找到的最高版本号，以打开安装页面。另一需要注意的是，你必须关注应用程序的开发者。你想要安装的官方\
    \ Python 应用应该是由 Python Software Foundation（Python 软件基金会）创建的。官方 Microsoft 商店包始终是免费的，所以如果应用程序收费，那么它就不是原版。或者，你可以打开\
    \ `PowerShell` 并输入以下命令：\n\n```bash\npython\n```\n\n如果你的系统中尚未安装 Python 版本，当你按下回车键时，Microsoft\
    \ Store 将自动引导你到商店中最新的 Python 版本。一旦选择了要安装的版本，请按照以下简单步骤完成安装：\n\n1.  点击 `Get（获取）。\n\
    2.  等待应用程序开始下载。下载完成后，你看到的将不是 `Get` 按钮，而是显示 `Install on my devices（安装到我的设备上）的不同按钮。\n\
    3.  点击 `Install on my devices` 并选择你想要完成安装的设备。\n4.  点击 `Install Now（立即安装）然后点击 `OK`\
    \ 开始安装。\n5.  安装成功完成后，你将在顶部看到消息：“This product is installed.”此产品已安装）。\n\n## 如何从完整安装程序安装\n\
    \n对于专业开发者来说，完整安装程序让你对安装拥有完全控制权。你可以使用对话框中的可用选项自定义安装以满足你的需求。\n\n*   **步骤 1：下载安装程序**\n\
    \    你需要访问 [Python.org](http://Python.org) 下载页面。在 `Latest` 按钮下，选择最新版本。\n\n*  \
    \ **步骤 2：运行安装程序**\n    下载完成后，双击运行它。将出现类似下方的对话框：\n\n1.  `Customize installation：自定义安装`：这通常用于选择安装哪些功能。\n\
    \    2.  `Install for all users：为所有用户安装`：这意味着机器上的每个用户都将拥有 `py.exe` 启动器。\n    3.\
    \  `Add Python 3.9 to PATH：将 Python 3.9 添加到 PATH`：此复选框默认未勾选。不将 Python 添加到 `PATH`\
    \ 可能会有缺点，请在勾选此框之前确保你理解其影响。\n\n点击 `Install Now：立即安装`。\n\n"
