  trans: "\n为了正确编写文档字符串（docstring），建议遵循官方 Python 规范。在这种情况下，`PEP 257` —— 即由 David Goodger\
    \ 和 Guido van Rossum 本人编写的《Docstring 规范》，是一个非常值得参考的指南。该 PEP 的目标是“标准化 docstring\
    \ 的高级结构：它们应该包含什么，以及如何表述。”⁴\n\n### 单行文档字符串 (Single-Line Docstrings)\n\n由于 Python\
    \ 的简洁性，docstring 以单行注释的形式存在。然而，请记住 docstring 的文本要大写字母开头，并以句号结束。基于代码阅读频率通常高于编写频率的趋势，强烈建议用命令式的方式来描述被记录结构的功能，而不是解释它是如何实现的。此外，提到返回给调用者的是什么类型的值也有助于理解函数或方法的结果。\n\
    \n关于双引号，只要起始和结束引号相似，Python 都是非常进步的，你被允许使用三个单引号，也可以使用三个双引号。你只需要确保结束引号与起始引号在同一行即可。此外，没有在\
    \ docstring 文本之前或之后添加任何空行。\n\n### 多行文档字符串 (Multi-line Docstrings)\n\n此外，docstring\
    \ 也可以作为多行注释。如果你选择使用多行注释，会有两点发生变化——docstring 的封装将使用三个单引号或双引号，且 docstring 本身的结构将赋予整个文本更深含义。\n\
    \n脚本的 docstring 记录脚本的功能、命令行语法以及其他变量和文件。在使用 docstring 时你可以写得非常详尽（填满几个屏幕），但同时要尽可能充分，以便让新用户能够正确操作命令。此外，还需要为专家用户完成对所有选项和参数的快速参考。\n\
    \n模块的 docstring 通常应该列出该模块请求的类、异常和函数，并对每一项提供单行的摘要。同时，包 `__init__.py` 模块的 docstring\
    \ 预期列出该包导出的模块和子包。\n\n函数或方法的 docstring 应该总结其行为，并列出其返回值、副作用、抛出的异常以及适用限制。应该指示可选参数，并对作为接口部分的关键字参数进行记录。\n\
    \n类的 docstring 应该概述其行为，并列出公共方法和其他变量。如果该类旨在被子类化，并且为子类提供了额外的接口，则该接口应该列在单独的 docstring\
    \ 中。此外，类的构造函数应该在其 `__init__` 方法的 docstring 中记录。\n\n如果一个类继承另一个类，且其行为大部分获取自该类，它的\
    \ docstring 应该提到这一点并概述差异。你可以使用动词“override”（覆盖）来表示子类方法替换了父类方法。此外，可以使用动词“extend”（扩展）来表示子类方法调用了父类方法。\n\
    \n### Docstring 格式 (Docstring Formats)\n\n涉及到 docstring 格式，并不是只有一种绑定。明确地说，有多种选择，并且所有这些格式变体都兼容多行\
    \ docstring。\n\n*   **reStructured Text (reST)/Sphinx:** 这被认为是官方 Python 文档标准，它使用了轻量级标记语言\
    \ reStructured text (reST) 的语法。\n*   **Google Docstrings:** Google 风格的 docstring。\n\
    *   **NumPy/SciPy Docstrings:** reStructured text (reST) 和 Google Docstrings 的结合。\n\
    \n同时，还有许多工具可以从 docstring 自动生成文档和 HTML 文档，例如 `Sphinx`、`Epydoc`、`Doxygen`、`PyDoc`、`pdoc`\
    \ 以及 `Sphinx` 的 `autodoc` 扩展。\n\n例如，`PyDoc` 是 Python 分发的一部分，用于为控制台、网页浏览器或 HTML\
    \ 文档收集模块信息。为了进一步了解它的模块、函数、类或方法，请尝试查看 Python shell 内部的 `help()` 函数。\n\n如前所述，`Sphinx`\
    \ 是官方 Python 文档标准，也是 JetBrains 的 `PyCharm` 集成开发环境的默认生成器。基本上，`Sphinx` 风格利用轻量级标记语言\
    \ reStructuredText (reST) 的语法，设计目的既是为了被文档处理软件（如 `Docutils`）处理，又能让读写 Python 源码的开发者轻松访问。\n\
    \n遵循 `PEP 257` 文档指南将帮助你理解源代码。通过应用 `Sphinx` 工具，你将能够从代码中的 docstring 自动生成文档。下面我们提供了一个关于如何使用\
    \ `Sphinx` 从 Python 代码轻松地自动生成整洁且组织良好的文档的简单分步骤指南。\n\n1.  **安装 Sphinx:** 你可以直接从\
    \ Git 仓库的克隆版本安装 `Sphinx` —— [`github.com/sphinx-doc/sphinx`](https://github.com)。你可以通过克隆仓库并从本地克隆安装，也可以直接通过\
    \ git 安装：⁵\n\n2.  **初始化 Sphinx 配置:** 在项目的根目录下启动 `sphinx-quickstart` 以初始化 sphinx\
    \ 源码目录，这将启用默认配置。运行此命令将提示你填写一些基本的配置属性，例如创建独立的源目录和构建目录，以及指定项目名称、作者和项目版本。\n\n3. \
    \ **更新 conf.py 文件:** 位于源文件夹的 `conf.py` 文件描述了 Sphinx 配置并控制 Sphinx 如何构建文档。如果你想修改主题、版本或模块目录，你需要在此处插入这些更改。以下是几个标准的覆盖选项：\n\
    \n    *   **更新主题:** 如果你想更改 `sphinx` 的默认主题（即 `alabaster`），你会发现许多其他主题供选择，甚至可以创建自己的。其中一个流行的主题是\
    \ `sphinx_rtd_theme`，它是一个现代且支持手机的主题。为了安装 `sphinx_rtd_theme`，你需要在终端中运行 `pip install\
    \ sphinx-rtd-theme` 来安装 `sphinx-rtd-theme` Python 包。\n    *   **为 Autodoc 添加扩展支持:**\
    \ `extensions` 变量被赋值为构建文档所需的扩展列表。例如，如果你计划使用 `autodoc` 指令从你的 docstring 中包含文档，你必须通过向扩展列表添加\
    \ `sphinx.ext.autodoc` 来激活它。如果代码中的文档遵循 Google Python 风格指南，则你需要在扩展列表中附加 `sphinx.ext.napoleon`。\n\
    \n此外，在每个新的 Sphinx 版本发布时，建议手动或使用自动化过程更新文档版本，以指向项目发布版本。\n"
- fmt: "\n## 4. Auto-Generate the rst Files\nSphinx generates the HTML documentation\
    \ from reStructuredText (`rst`) files. These `rst` files define each webpage and\
    \ may contain `autodoc` directives, which are used to generate the documentation\
    \ from docstrings in an automatic way. And since there is an automatic way to\
    \ generate these files, there is no need to manually type and file out the `autodoc`\
    \ directives for each class and module. The `sphinx-autodoc` command is expected\
    \ to automatically generate `rst` files with `autodoc` directives from your code.\
    \ This command only needs to be run when a new module is added to the project.\n\
    \n## 5. Build the HTML\nAfter you complete the configuration and `rst` files set\
    \ up, you should be able to run the `make HTML` command from the terminal in the\
    \ main directory to generate the HTML files. The HTML files will then be created\
    \ inside the `build/HTML` folder.\n\n## 6. Advanced Sphinx Items\nMake sure to\
    \ note that there are additional Sphinx directives that can help your documentation\
    \ look and feel more modern and organized. Here are some of the key features that\
    \ can be useful for you to further customize the documentation. All examples are\
    \ generated with the `sphinx_rtd_theme`:\n\n1. **Table of contents**: Sphinx uses\
    \ a custom directive, known as the `toctree` directive, to describe the relations\
    \ between different files in the form of a or table of contents.\n2. **Warning\
    \ box**: A warning box can be applied using the `warning` directive.\n   For example:\
    \ `. . warning:: This is a warning box.`\n3. **Image**: An image item can be added\
    \ using the `image` directive.\n4. **Table**: Consequently, a table can be added\
    \ using the `table` directive.\n![A zig zag, up pointing arrow made of many lines\
    \ of code.](images/fig3_3.jpg)\n\n# WRITE DOCUMENTATION VIA DOCSTRINGS\n\nPython's\
    \ documentation has for a long time been considered to be good for a free programming\
    \ language. The reason for that was an early commitment of Python's creator, Guido\
    \ van Rossum, to provide documentation on the language together with its libraries,\
    \ to the user community. So that they could actively participate in continuing\
    \ involvement and assistance for creating and maintaining Python documentation.\n\
    \nUp to this day, community involvement takes many forms, from modifying bug reports\
    \ to just plain criticizing when the documentation could be more polished or easier\
    \ to use.\n\nMoreover, there is a whole Index of Python Enhancement Proposals\
    \ (PEPs) that go by the following categories: Meta-PEPs (PEPs about PEPs or Processes),\
    \ Other Informational PEPs, Provisional PEPs (provisionally accepted; interface\
    \ may still change), Accepted PEPs (accepted; may not be implemented yet), Open\
    \ PEPs (under consideration), Finished PEPs (done, with a stable interface), Historical\
    \ Meta-PEPs and Informational PEPs, Deferred PEPs (postponed pending further research\
    \ or updates) and finally, Abandoned, Withdrawn, and Rejected PEPs.\n\nThese documents\
    \ are aimed at authors and potential authors of documentation for Python. More\
    \ specifically, it is for users contributing to the standard documentation and\
    \ developing additional documents using the same tools as the standard documents.\n\
    \nAnd in case you have an interest is in contributing to the Python documentation,\
    \ but you do not have the time to learn all the PEPs related to a format for textual\
    \ data and technical documentation – reStructuredText, then you can look it up\
    \ further in this section. We are going to briefly introduce documentation concepts\
    \ and syntax, intended to provide authors with enough information to write documents\
    \ productively.\n\n### Paragraphs\nThe paragraph is the most basic block in a\
    \ reST document. They are simply parts of text separated by one or more blank\
    \ lines. In Python indentation is significant, so all lines of the same paragraph\
    \ should be left-aligned to the same level of indentation.\n\n### Inline Markup\n\
    The standard reST inline markup is quite straight-forward:\n\n### Sections\nSection\
    \ headers are created by underlining or overlining the section title with a punctuation\
    \ character. Generally, there should be no heading levels assigned to certain\
    \ characters as the structure is determined from the succession of headings. But\
    \ for the Python documentation, there is a suggested convention:\n\nSphinx brings\
    \ a lot of new directives and interpreted text roles to standard reST markup.\
    \ This section contains the reference material for these facilities. However,\
    \ this material should be treated as just an overview of Sphinx's extended markup\
    \ capabilities. Full coverage can be found in Python PEP documentations.\n\n###\
    \ Meta-information Markup\nThe markup that is going to be described in this section\
    \ is used to provide information about a documented module. Note that each module\
    \ should be documented in its own file.\n\n`sectionauthor`\nStands for the author\
    \ of the current section. The element should include the author's name such that\
    \ it can be used for presentation and email address. The domain name part of the\
    \ address should be lower case. Example:\n\n`module`\nThis mark stands for the\
    \ beginning of the description of a module, package, or submodule. The name should\
    \ be fully qualified and have short identifiers; examples that are in use include\
    \ “IRIX,” “Mac,” “Windows,” and “Unix.” It is important to use a synopsis option\
    \ that usually consists of one sentence describing the module's purpose – it is\
    \ currently only used in the Global Module Index.\n\n`moduleauthor`\nThe `moduleauthor`\
    \ directive, which can appear multiple times, names the authors of the specific\
    \ module code, just like `sectionauthor` names the author of a piece of documentation.\
    \ It too does not result in any output.\n\nIn addition, it would be beneficial\
    \ to make the section title of a module-describing file meaningful since that\
    \ value will be inserted in the table-of-content of overview files.\n\n### Information\
    \ Units\nThere is a variety of directives applied to describe specific features\
    \ provided by modules. Each directive needs one or more signatures to provide\
    \ basic information about what is described, and the content should be the description.\
    \ The standard version makes entries in the general index. However, if no index\
    \ entry is desired, you can give the directive option flag: `noindex`. The following\
    \ example shows all of the features of this directive type:\n\n`c:function`\n\
