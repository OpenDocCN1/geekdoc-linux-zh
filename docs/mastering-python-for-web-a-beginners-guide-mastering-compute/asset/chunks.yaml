    \ | `x / y` |\n| % | Modulus | `x % y` |\n| ** | Exponentiation | `x ** y` |\n\
    | // | Floor division | `x // y` |\n\n### Python Assignment Operators\n\nAssignment\
    \ operators are used to assigning values to variables:\n\n| Operator | Example\
    \ | Same As |\n| --- | --- | --- |\n| = | `x = 5` | `x = 5` |\n| += | `x += 3`\
    \ | `x = x + 3` |\n| -= | `x -= 3` | `x = x - 3` |\n| *= | `x *= 3` | `x = x *\
    \ 3` |\n| /= | `x /= 3` | `x = x / 3` |\n| %= | `x %= 3` | `x = x % 3` |\n| //=\
    \ | `x //= 3` | `x = x // 3` |\n| **= | `x **= 3` | `x = x ** 3` |\n| &= | `x\
    \ &= 3` | `x = x & 3` |\n| |= | `x |= 3` | `x = x | 3` |\n| ^= | `x ^= 3` | `x\
    \ = x ^ 3` |\n| >>= | `x >>= 3` | `x = x >> 3` |\n| <<= | `x <<= 3` | `x = x <<\
    \ 3` |\n\n### Python Comparison Operators\n\nComparison operators are used to\
    \ comparing two values:\n\n| Operator | Name | Example |\n| --- | --- | --- |\n\
    | == | Equal | `x == y` |\n| != | Not equal | `x != y` |\n| > | Greater than |\
    \ `x > y` |\n| < | Less than | `x < y` |\n| >= | Greater than or equal to | `x\
    \ >= y` |\n| <= | Less than or equal to | `x <= y` |\n\n### Python Logical Operators\n\
    \nLogical operators are used to combining statements:\n\n| Operator | Description\
    \ | Example |\n| --- | --- | --- |\n| and | Returns True if both statements are\
