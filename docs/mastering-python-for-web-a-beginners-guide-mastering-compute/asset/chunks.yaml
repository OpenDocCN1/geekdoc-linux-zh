    \ 类支持面向对象编程的所有标准特性：类继承机制提供了多个基类，派生类可以覆盖其基类或多个基类的任何方法，并且方法可以调用与基类同名的方法。对象可以拥有任意数量和类型的信息格式。与模块一样，类也参与了\
    \ Python 的动态特性：它们在运行时设计，并在创建后可以进一步编辑。\n\n根据 C++ 术语，通常类成员与数据成员一起是公共的，且所有成员函数都是虚函数。与\
    \ Modula-3 类似，从方法引用对象成员时没有简写：方法函数的调用带有一个显式的第一个参数表示对象，该对象是由调用隐式生成的。与 Smalltalk\
    \ 一样，类被视为对象。这为导入和重命名提供了语义。然而，与 C++ 和 Modula-3 不同，内置类型可以实现为用户扩展的基类。此外，像 C++ 中，大多数具有特殊语法的内置运算符也可以为类实例重定义。\n\
    \n通常，最简单的类定义形式如下：\n\n类定义与函数定义（`def` 语句）一样，在产生任何影响之前应该执行，为此，你可以将类定义放在 `if` 语句的分支中或函数内部。在实践中，类定义内部的语句通常被编写为函数定义，但仍然允许其他语句。一旦进入类定义，就会创建一个新的命名空间并作为局部作用域执行——因此，所有对局部变量的赋值都会进入这个新的命名空间。但如果正常结束类定义（通过结束标识符），就会创建一个类对象。这基本上是类定义所创建的命名空间内容的封装器。原始的局部作用域恢复，类对象在此绑定到类定义头文件中给出的类名上。\n\
    \n### 类对象\n\n默认情况下，类对象支持两种操作：属性引用和实例化。\n\n属性引用利用了适用于 Python 所有属性引用的标准语法：`obj.name`。定义的属性名称是创建类对象时位于类命名空间中的所有名称。因此，如果类定义如下所示：\n\
