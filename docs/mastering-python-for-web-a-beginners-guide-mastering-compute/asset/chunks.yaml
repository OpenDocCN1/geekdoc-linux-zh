    # Python 特性


    - **Python 是多功能的：** 具有通用性意味着 `Python` 语言可以用于构建不同软件解决方案的部分，这就是为什么像 `Google` 和 `Facebook`
    这样的大型科技公司选择使用 `Python` 来进行项目开发。此外，`Python` 代码还可以用于构建基础程序，作为一名开发者，你可以拥有极其广泛的工作选择。无论你是想为科技巨头工作、构建自己的软件程序，还是作为自由
    Web 开发者工作，掌握 `Python` 编程被认为是一项可以让这些任何计划成为可能的优势。


    - **Python 确保了你的项目前后端协作得更佳：** 如果你想在开发领域拥有出色的职业生涯，那么了解这一点将很有用：你的目标可能是同步和平衡前端，以及后端由数据库和驱动网站应用前端的
    Web 服务器组成。


    当我们把 `Python` 称为“胶水语言”时，我们的意思是它被用于编写后端脚本，让你的数字产品的前后端能够和谐地工作。因此，如果你希望在你的前端开发者的技能树中增加服务端或后端技能，学习
    `Python` 可能是一个完美的起点。


    - **Python 是可定制的：** 如果你需要一种可定制的编程语言，那么 `Python` 必须是一个完美的选择。就像 `JavaScript` 一样，`Python`
    并不缺少库和框架来塑造和交付你特定的编码需求。


    流行的 `Python` 全功能服务端 Web 框架如 `Django` 的创建是为了让 `Python` 在调整 Web 应用方面更加实用，而 `PyQt`
    是一个允许 `Python` 构建 GUI 用户界面的框架，它包括使用屏幕图标和图形来操作用户命令。


    - **Python 是流程自动化的强大工具：** 科技工作中至关但枯燥的部分是管理所有重复的、耗时的技术相关流程。像复制文件、拖动文件夹和重命名文件、管理资产到服务器等无聊任务——所有这些积累起来都会消耗大量宝贵的时间。在这种情况下，通过
    `Python` 实现的自动化可能是你的救星。`Python` 编写系统脚本的能力让你能够创建简单的 `Python` 程序来自动化那些消耗你大量生产力的日常任务。通过
    `Python` 重新调整你的流程所节省的时间，是学习这种语言的一个极具吸引力的方面。


    - **Python 为你提供了科技领域任何地方工作的工具：** 学习 `Python` 代码不仅能确保你在互联网开发方面的潜在专业——它还能为你各种未来的科技工作做好准备。`Python`
    的用途不仅限于传统的 Web 开发。事实上，`Python` 是数据分析、人工智能、机器学习和数据科学等热门新兴科学领域的的顶尖语言。因此，了解这种语言将帮助你保持开放的选择，如果你决定精通
    `Python`，你可能会获得更多科技相关的机会。


    ## Python 简史


    `Python` 是一种通用的、高级编程语言，最初由 `Guido van Rossum` 于 1991 年设计，并由 `Python Software Foundation`
    开发。它的主要开发目的是提高代码的可读性，其语法允许程序员用更短的代码来表达概念。


    对 `Python` 的官方工作始于 20 世纪 80 年代后期。不久后，`Guido van Rossum` 于 1989 年 12 月在荷兰的数学与信息中心（`CWI`）开始基于应用程序进行试用。最初，`Python`
    项目是作为一个爱好开始的，因为他正在寻找一些有趣的工作来打发圣诞节的时光。`Python` 编程语言基于 `ABC 编程语言`，该语言与基于微内核的 `Amoeba
    操作系统` 具有接口，后者将单板计算机集合变成了一个透明的分布式系统。`Van Rossum` 在职业生涯早期就帮助创建了 `ABC` 并发现了一些问题。因此，他提取了
    `ABC` 的语法及其一些最佳特性，并修复了其他未解决的属性。就这样，通过完全修正这些问题，他创建了一种新的脚本语言。


    ![Guido van Rossum 的照片。](img/fig1_2.jpg)


    该语言于 1991 年发布。在发布时，它使用了许多代码并具有独特的设计方法。它的主要目标是提供代码可读性并提高开发者的整体生产力。


    但“Python”这个名字是怎么来的？大多数人认为，由于 Logo 描了两条蛇，名字的起源灵感一定来自真实的蟒蛇。惊讶的是，事实并非如此。`Python`
    的创始人 `Guido van Rossum` 在 1996 年写道他编程语言名称的来源，它源于英式幽默，而不是任何东西。


    ### Python 之禅 (The Zen of Python)


    此外，在 2004 年，Python 社区提出了 Python 的指导原则，并称之为“Python 之禅”：


    - 美好优于丑陋。

    - 显式优于隐含。

    - 简单优于复杂。

    - 复杂优于晦涩。

    - 平坦优于嵌套。

    - 稀疏优于稠密。

    - 可读性很重要。

    - 特殊情况并不特殊到可以打破规则。

    - 虽然实用性胜过纯洁。

    - 错误永远不应该静地通过。

    - 除非显式忽略。

    - 面对歧义时，拒绝猜测的诱惑。

    - 执行某事应该有一种——最好只有一种明显的方法。

    - 虽然除非你是荷兰人，否则那种方法可能并不明显。

    - 现在比永远好。

    - 虽然“永远”往往比“现在”更好。

    - 如果实现难以解释，那就是一个坏主意。

    - 如果实现易解释，它可能是一个好主意。


    ## 现代时代与增长


    在发布后的多年里，Python 的表现并不理想。`ASP.NET`、`Java` 和 `PHP` 这样可靠的解决方案主导了企业市场。直到 2000 年代，`Python`
    才真正开始爆发，当时许多初创公司开始使用 `Python` 进行项目。许多低预算企业也因为其易用性、快速开发以及显然低廉的托管成本而优先考虑 `Python`。


    当 `Dropbox` 进入市场时，Python 达到了人气的巅峰。据故事说，一位名叫 `Drew Houston` 的 MIT 学生某天上课时忘记带了 USB
    闪盘。他后来开始思考一种更好的文件共享解决方案。Houston 在 2007 年创立了一家名为 `Evenflow` 的公司，当时只有一个产品，名为 `Dropbox`。`Dropbox`
    软件第一次让人们能够在计算机上创建一个文件夹，该文件夹会自动上传到云服务，并自动同步到用户安装了 `Dropbox` 的所有设备上。该公司在 2009 年
    4 月达到了百万用户量。到 2009 年底，他们拥有 300 万用户。`Dropbox` 是用 `Python` 编写的。


