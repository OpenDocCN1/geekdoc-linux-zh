- fmt: "\nSince all four are built-in functions, they are accessible for free in the\
    \ built-in scope. This means that you can apply them at any time without having\
    \ to import anything. Most of these functions are designed to be used in an interactive\
    \ session to get data on various Python objects. Nevertheless, you can find some\
    \ interesting use cases for them in your code as well.\n\n*   `globals()`: In\
    \ Python, `globals()` is a built-in function that is used to return a reference\
    \ to the current global scope or namespace dictionary. This dictionary then stores\
    \ the names of the current module. This means that if you call `globals()` in\
    \ a given module, then you will obtain a dictionary containing all the names that\
    \ you have determined in that module, before the call to `globals()`.\n\n*   `locals()`:\
    \ This is another function related to Python scope and namespaces that is responsible\
    \ for updating and returning a dictionary that holds a copy of the current state\
    \ of the local Python scope or namespace. Once you call `locals()` in a function\
    \ block, you get all the names assigned in the local or function scope up to the\
    \ point where you call `locals()`. To illustrate with an example:\n\n    If you\
    \ call `locals()` inside `func()`, the resulting dictionary is going to contain\
    \ the name `var` mapped to the value `100` and `arg` mapped to `200`. And since\
    \ `locals()` only grabs the names assigned before you call it, another is not\
    \ in the dictionary.\n\n    If you call `locals()` in the global Python scope,\
    \ then you’ll get the same dictionary that you would get if you were to call `globals()`:\n\
    \n    When you call `locals()` in the global Python scope, you get a dictionary\
    \ that's identical to the dictionary returned by the call to `globals()`.\n\n\
    *   `vars()`: `vars()` is another built-in function that returns the `.__dict__`\
    \ attribute of a module, class, instance, or any other object which has a dictionary\
    \ attribute. It is worth noting that `.__dict__` is a special dictionary that\
    \ Python applies to implement namespaces.\n\n*   `dir()`: You can apply `dir()`\
    \ without arguments to get the list of names in the current Python scope. If you\
    \ call `dir()` with an argument, then the function efforts to return a list of\
    \ valid attributes for that object. You can also use `dir()` to check the list\
    \ of names or attributes of different objects that include functions, modules,\
    \ variables, and so on.\n\nAnd even though the official documentation says that\
    \ `dir()` is designed for interactive use, you can use the function to set a comprehensive\
    \ list of attributes of any given object. You can even call `dir()` from inside\
    \ a function and in return, get the list of names defined in the function scope.\n\
    \nTo conclude, the scope of a variable or name determines its visibility throughout\
    \ your whole code. In Python, scope is executed as either a Local, Enclosing,\
    \ Global, or Built-in scope. When you apply a variable or name, Python looks for\
    \ these scopes sequentially to resolve it. In instances, when the name is not\
    \ found, you will get an error. It is the basic mechanism that Python activates\
    \ for name resolution and is known as the LEGB rule.\n\nIn order to take full\
    \ advantage of Python's scope to prevent or minimize issues related to name collision,\
    \ make sure you use global and local names across your programs to improve code\
    \ maintainability and prepare a coherent strategy to access, optimize, or update\
    \ names across all Python code. In addition, we have attempted to provide a few\
    \ scope-related tools and techniques that Python offers and cover how you can\
    \ use them to gather data about the names that are located in a given scope or\
    \ to edit the standard behavior of Python scope.\n\n## OBJECTS AND CLASSES\n\n\
    ![](images/fig5_3.jpg)\n\nPython is an object-oriented programming language, which\
    \ means that it comes up with features that allow object-oriented programming.\
    \ Object-oriented programming became the main programming paradigm used in the\
    \ creation of new software since the 1980s. It was produced as a solution to maintain\
    \ the rapidly increasing size and complexity of software operating systems, and\
    \ to make it easier to change these large and complex systems with time.\n\nClasses\
    \ in Python are used to provide a system of collecting data and functionality\
    \ together. Funding a new class creates a new type of object, letting new instances\
    \ of that type be added. Each class instance can have attributes added to it for\
    \ carrying on its state. Class instances can also have methods defined by its\
    \ class for altering its state.\n\nAnd if you compare Python with other programming\
    \ languages, Python's class mechanism adds classes with a minimum of new syntax\
    \ and semantics. It is a great combination of the class mechanisms found in C++\
    \ and Modula-3. Python classes support all the standard features of Object-Oriented\
    \ Programming: the class inheritance mechanism offers multiple base classes, a\
    \ derived class can override any methods of its base class or classes, and a method\
    \ can issue the method of a base class with the same name. Objects can have arbitrary\
    \ amounts and kinds of information formats. As is true for modules, classes take\
    \ part in the dynamic nature of Python: they are designed at runtime and can be\
    \ further edited after creation.\n\nAccording to C++ terminology, typically class\
    \ members altogether with the data members are public, and all member functions\
    \ are virtual. Similar to Modula-3, there are no shorthands when referencing the\
    \ object's members from its methods: the method function is issued with an explicit\
