    *   **Use in Prototyping:** Creating prototypes in Python is a fast and simple
    process. The agility of the programming language offers easy code refactoring
    and quick development of the initial prototype into the final result.

    *   **Open-Source Perks:** Python has an open-source license that makes it accessible
    to users and facilitates redistribution and unrestricted modifications. Developers
    are encouraged to freely use the language and actively contribute to its improvement.

    *   **Server-Side Scripting:** As mentioned above, Python has a simple syntax,
    which significantly speeds up the web development process. The code consists of
    functional modules that allow you to execute the program algorithm based on user
    actions. Python also supports the graphical user interfaces required in web development.

    *   **Portability and Interactivity:** Python has a great capacity for dynamic
    semantics and fast prototyping, which is possible due to its interactivity and
    portability. It can easily be embedded in a wide range of apps, and effortlessly
    fix new modules and extend Python''s core vocabulary through connecting diverse
    components.


    Nevertheless, despite Python''s advantages, it also has a few disadvantages that
    you should keep in mind if you are considering using this language for your project.


    *   **Fewer Developers:** When you need to create a web application, you certainly
    look for the most experienced developers to do the job. However, it is not that
    easy with Python, since not many expert programmers are working with this language,
    especially compared to Java.

    *   **Lack of True Multiprocessor Support:** Multi­processing is an important
    part of writing an application. And although Python does support multiprocessing,
    it might not be as flexible or convenient as other languages. Thus, it can create
    certain limitations.

    *   **Speed Limitations:** Python is often criticized for its speed as an interpreted
    script language, which makes it relatively slower than a lot of its compiled counterparts,
    such as `C/C++` or Java, due to the different methods it applies to translate
    code.

    *   **Not the Most Preferred Language for Mobile App Development:** Few companies
    apply Python for mobile app development, preferring native development for iOS
    and Android or React Native development.

    *   **Not Perfect for Memory-Intensive Tasks:** Python is a language mostly known
    for the flexibility of its data types. This results in fairly high memory consumption
    and makes it inconvenient to use for memory-intensive solutions.

    *   **Design Restrictions:** Python is dynamically typed, meaning that it operates
    some tasks during app runtime that would otherwise be completed in a statically
    typed language. This puts some limitations on the design. Therefore, if your design
    is loaded with items, it might slow the program and prevent smooth operation.
    Because of that, the design you intended might not look as sophisticated as you’d
    like.


    To conclude, Python lets you develop clear and simple applications that are easy
    to get from a small project to a full-fledged, complex app. Whether you are a
    new programmer learning how to code or an owner of your startup business, Python
    could be a suitable option for many types of projects. It is recognized as one
    of the best programming languages for IT startups – and it is clear why if you
    compare side-by-side Python''s advantages and what startups mostly require. Startups
    are constantly searching for certainty and reduced risks; they have limited resources,
    and need room to grow. On the other hand, Python is flexible and easy to modify,
    does not require too much monitoring, and can be used to build various prototypes.


    ## THE DJANGO FRAMEWORK


    ![The logo of Django, the company''s name in lower case letters.](images/fig6_3.jpg)


    As previously mentioned, Django is a high-level Python web framework that enables
    rapid development and clean, practical design. Django makes it easier to build
    better web apps quickly and with less code.


    Django first started in 2003 by Adrian Holovaty and Simon Willison as an internal
    project at the Lawrence Journal-World newspaper. It was later released in 2005
    and named after the jazz guitarist Django Reinhardt. When the framework was fully
    developed to handle several high-traffic sites, it became an open-source project
    with contributors across the world. Django comes with the following design philosophies:


    *   **Loosely Coupled:** Django wants to make each element of its stack independent
    of the others.

    *   **Less Coding:** Less code turns into a quick development.

    *   **Don’t Repeat Yourself (DRY):** Everything should be developed only in exactly
    one place instead of repeating it multiple times.

    *   **Fast Development:** Django''s philosophy is to do everything that is possible
    to facilitate hyper-fast development.

    *   **Clean Design:** Django strictly maintains a clean design throughout its
    own code and makes it easy to follow trendy web-development practices.


    Built by experienced developers, Django takes care of much of the web development,
    so you can focus on writing your application without having to re-adjust any tools.
    Moreover, the framework is free and open-source; has a thriving and active community,
    great documentation, and many options for development support. Here are a few
    more advantages of using Django:


    *   **Object-Relational Mapping Support:** Django provides an interconnection
    service between the data model and the database engine and supports a large set
    of database systems including MySQL, Oracle, and Postgres.

    *   **Multilingual Support:** Django supports multilingual websites through its
    built-in internationalization system. With Django, you can develop your website
    that can support multiple languages.

    *   **Framework Support:** Django has built-in support for Ajax, RSS, Caching,
    and various other frameworks.

    *   **Administration GUI:** Django provides a great and practical user interface
    for administrative activities.

    *   **Development Environment:** Django comes with a lightweight webserver to
    support end-to-end application development and testing.


    With the abovementioned characteristics Django can help you write a website or
    software that is:


    *   **Complete:** Django strives to provide almost everything developers might
    want to do `out of the box.` Because everything you need is part of the Django
    service, it all works together, follows consistent design patterns, and has extensive
    and up-to-date documentation.

    *   **Versatile:** Django can be used to build almost any type of website, from
    content management systems to social networks and news sites. It can manage any
    client-side framework and can deliver content in almost any format. At the same
    time, it provides choices for almost any functionality you might want and can
    also be extended to use other components if needed.

    *   **Secure:** Django helps developers avoid many common security mistakes by
    providing a framework to protect the website automatically. For example, Django
    provides a secure way to manage user accounts and passwords, avoiding common mistakes
    like putting session information in cookies where it is vulnerable or directly
    storing passwords rather than a password hash. Django can check if an entered
    password is correct by running it through the hash function and comparing the
    output to the stored hash value. Django enables protection against many vulnerabilities
    by default, including SQL injection, cross-site scripting, and cross-site request
    forgery.

    *   **Scalable:** Django uses a component-based architecture in which every part
    of the architecture is independent of the others, and can be replaced if needed.
    Having a clear separation between the different parts means that it can scale
    for increased traffic by adding hardware at any level: caching servers, database
    servers, or application servers.

