- fmt: '

    Names in Python refer to objects as well as to name binding operations. The following
    items could be referred to as names: formal parameters to functions, import statements,
    class and function definitions, or function names in the defining block. It also
    binds targets that are identifiers if occurring in an assignment and all names
    defined in the imported module, except those beginning with an underscore and
    those used at the module level. A target occurring in a `del` statement is also
    considered bound for this purpose. So is each assignment or import statement occurring
    within a block defined by a class or function definition at the module level.


    The variables of the module code block could be viewed as local or global. In
    case a name is bound in a block, it is a local variable of that block unless declared
    as `nonlocal` or `global`. If a name is bound at the module level, it is a global
    variable. And if a variable is used in a code block but not defined there, it
    is regarded as a free variable. Every occurrence of a name in the program text
    refers to the binding of that name guided by the following name resolution rules.


    ## Scope and Name Resolution


    A scope defines the visibility of a name within a block. In case a local variable
    is defined in a block, its scope includes that block. If the definition involves
    a function block, the scope extends to any blocks contained within the defining
    one, unless a contained block introduces a separate binding for the name. When
    a name is added to a code block, it is resolved with the nearest enclosing scope.
    The set of all such scopes visible to a code block is also known as the block''s
    environment. When a name is not found at all, a `NameError` exception appears.
    If the current scope is a function scope, and the name refers to a local variable
    that has not yet been bound to a value at the point where the name is used, an
    `UnboundLocalError` exception appears on its turn. `UnboundLocalError` is counted
    to be a subclass of `NameError`.


    Consequently, if a name binding operation occurs anywhere within a code block,
    all applications of the name within the block are utilized as references to the
    current block. This can lead to errors when a name is used within a block before
    it is bound. And since Python lacks declarations, it is allowed for name binding
    operations to occur anywhere within a code block. The local variables of a code
    block can be defined by scanning the entire text of the block for name binding
    operations.


    ## Global and Nonlocal


    In case the `global` statement occurs within a block, all uses of the name specified
    in the statement refer to the binding of that name in the top-level namespace.
    Names are resolved in the top-level namespace by looking out for the global namespace,
    meaning the namespace of the module that has the information about the code block,
    built – in namespace as well as the namespace of the module built – in functions.
    Typically, the global namespace is searched first, and only if the name is not
    found, the built – in namespace is searched. The `global` statement ensures all
    uses of the name.


    The `global` statement locates the same scope as a name binding operation in the
    same block. If the nearest enclosing scope for a free variable contains a `global`
    statement, the free variable is viewed as a global. On the other hand, the `nonlocal`
    statement causes corresponding names to refer to previously bound variables in
    the nearest enclosing function scope. `SyntaxError` may appear at compile time
    if the given name does not show in any enclosing function scope.


    ## Namespaces and Builtins


    The namespace for a module is automatically created the first time a module is
    imported. The main module for a script is always called `__main__`. Class definition
    blocks and arguments to `exec()` and `eval()` are important in the context of
    name resolution. A class definition is an applicable statement that may use and
    define names. These references are organized by the normal rules for name resolution
    with the exception that unbound local variables are included in the global namespace.
    The namespace of the class definition becomes the attribute dictionary of the
    class. The scope of names defined in a class block is limited to that class block,
    meaning it does not extend to the code blocks of methods – this includes only
    comprehensions and generator expressions since they are executed using a function
    scope.


    The `builtins` namespace are typically associated with the execution of a code
    block and could be found by searching for the name `__builtins__` in its global
    namespace. This should be a dictionary or a module and by default, when in the
    `__main__` module, the built-in module is set as `__builtins__`; and when in any
    other module, `__builtins__` stands out as an alias for the dictionary of the
    builtins module itself. In addition, `__builtins__` can be set to a user-created
    dictionary to make up for a weaker form of restricted execution. Another thing
    is that users should not deal with `__builtins__` at all because it is considered
    to be strictly an implementation detail. Users wanting to modify values in the
    builtins namespace should import the `builtins` module and optimize its attributes
    appropriately.


    ## Dynamic Features


    In regards to names interaction with dynamic features, the name resolution of
    free variables should occur at runtime, not at compile time. There are several
    instances where Python statements are not allowed when used altogether with nested
    scopes that contain free variables. When a variable is referenced in an enclosing
    scope, it is simply prohibited to delete the name, and an error will be reported
    at compile time.


    The `eval()` and `exec()` functions cannot be accessed to the full environment
    for resolving names. Names may be resolved in the local and global namespaces
    of the caller. The `exec()` and `eval()` functions have optional arguments to
    override the global and local namespace. If only one namespace is specified, it
    is used for both. In addition, free variables are not resolved in the nearest
    enclosing namespace, but in the global namespace.


    ## Exceptions


    In terms of analyzing the Python executional model, it is also important to pay
    attention to exceptions. Exceptions are a great system trick of breaking out of
    the regular flow of control of a code block in order to manage errors or other
    suspicious conditions. An exception occurs only at the point where the error is
    detected. It could be handled by the surrounding code block or by any code block
    that directly or indirectly triggered the code block where the error occurred.


    The Python interpreter responds with an exception when it detects a run-time error.
    A Python program can explicitly call an exception with the `raise` statement.
    The final clause of such a statement can be used to specify cleanup code that
    does not handle the exception but is executed whether an exception occurred or
    not in the preceding code.


    Python also uses the "termination" model of error handling: an exception handler
    can easily detect what happened and continue execution at an outer level, but
    it cannot be expected to repair the cause of the error and retry the failing operation.
    When an exception is not handled at all, the interpreter shuts down the execution
    of the program or returns to its interactive main loop.


    Exceptions are strictly identified by class instances. The `except` clause is
    chosen depending on the class of the instance: it must address the class of the
    instance or a base class instead. The instance can be received by the handler
    and might carry additional information about the exceptional condition.

