    \nPython 中的类用于提供一个将数据收集和功能结合的系统。实例化一个新类会创建一个新类型的对象，允许添加该类型的新实例。每个类实例都可以为其添加属性以承载其状态。类实例还可以由其类定义方法来改变其状态。\n\
