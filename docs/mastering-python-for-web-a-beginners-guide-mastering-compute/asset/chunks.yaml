- fmt: '

    In programming, the scope of a name refers to the area of a program where you
    can unambiguously locate that name, such as variables, functions, or objects.
    A name will only be visible to and accessible through the code in its scope. Some
    programming languages take advantage of scope for preventing name collisions and
    unwanted behaviors. Most typically, there are two general scopes to distinguish:
    global scope (making names that you define in this scope available to all your
    code) and local scope (making names that you define in this scope visible to the
    code only within the scope).


    Scope was introduced mainly because early programming languages like `BASIC` only
    had global names. And with this type of name, any part of the program could modify
    any variable at any time, so operating and debugging large programs might turn
    into real misery. In order to work with global names, you would need to monitor
    all the code in mind and know what the value of a given name is at any time. This
    was an important side-effect, and some languages like `Python` decided to implement
    scope to avoid these issues. When you use a language that implements scope, there
    is no way for you to locate all the variables in a program, and your ability to
    access a given name will depend on where you have defined that name. To be clear,
    the term name here refers to the identifiers of variables, constants, functions,
    classes, or any other object that can be assigned a name.


    The names in your programs can only have the scope of the block of code in which
    you define them. In case you access the value of a given name from someplace in
    your code, you will state that the name is in scope. If you cannot locate the
    name, then you might say that the name is out of scope. Due to the fact that `Python`
    is considered to be a dynamically typed language, variables in `Python` come into
    existence only when you first assign them a value. On the other hand, functions
    and classes are available after you define them using `def` or `class`. Lastly,
    modules exist after you import them. As a summary, you can create `Python` names
    through one of the following operations:


    | Operation | Statement |

    | --- | --- |

    | Assignments | `x = value` |

    | Import operations | `import module` or `from module import importname` |

    | Function definitions | `def my_func(): ...` |

    | Argument definitions in the context of functions | `def my_func(arg1, arg2,...
    argN): ...` |

    | Class definitions | `class MyClass: ...` |


    All the operations above create or, in the case of assignments, optimize new `Python`
    names because all of them assign a name to a variable, constant, function, class,
    instance, or module. However, there is an important distinction between assignment
    operations and reference or access operations. Thus, if you reference a name,
    you are just trying to retrieve its content or value. But when you assign a name,
    you are either creating that name or updating it.


    `Python` utilizes the location of the name assignment or definition to associate
    it with a specific scope. To put it simply, where you assign or define a name
    in your code will determine the scope or visibility of that name. For instance,
    if you assign a value to a name inside a function, then that name will have a
    local `Python` scope. In reverse, if you choose to assign a value to a name outside
    of all functions at the top level of a module, then that name will have a global
    `Python` scope.


    In `Python`, the concept of scope is closely connected to the concept of the namespace.
    As previously mentioned, a `Python` scope determines where in your program a name
    is visible. `Python` scopes are executed as dictionaries that map names to objects.
    These dictionaries are addressed as namespaces. These are the general mechanisms
    that `Python` uses to store names. They are saved in a special attribute called
    `.__dict__`.


    ### Using the LEGB Rule


    `Python` resolves names using the widely known LEGB rule, which is named after
    the `Python` scope for names. The letters in LEGB stand for Local, Enclosing,
    Global, and Built-in. In brief, each of these terms means the following:


    - Local scope is the code block or body of any `Python` function or `lambda` expression.
    This particular scope includes the names that you define inside the function.
    These names may only be visible from the code of the function. It''s created at
    function call, not a function definition, so you can have as many different local
    scopes as function calls. This is true even if you call the same function multiple
    times, each call is still going to result in a new local scope being created.

    - Enclosing scope is a specific scope that is only available for nested functions.
    If the local scope is an inner or nested function, then the enclosing scope is
    the scope of the outer or enclosing function. This scope has the names that you
    add in the enclosing function. And those names in the enclosing scope are visible
    from the code of the inner and enclosing functions.

    - Global scope is regarded as the most important scope in a `Python` program,
    script, or module. This `Python` scope contains all of the names that you define
    at the top level of a program or a module. Names in this `Python` scope could
    be visible from everywhere in your code.

    - The built-in scope is a type of `Python` scope that is created or activated
    whenever you run a script or open an interactive session. This scope contains
    names such as keywords, functions, exceptions, and other items that are already
    built into `Python`. Names in this `Python` scope are also available from everywhere
    in your code. You can automatically load it by `Python` when you run a program
    or script.


    The LEGB rule is a useful lookup procedure that determines the order in which
    `Python` looks up names. For example, if you refer to a given name, then `Python`
    will look that name up sequentially in the local, enclosing, global, and built-in
    scope. If the name exists, then you will be able to get the first occurrence of
    it. Otherwise, you are just going to get an error.


    To summarize, when you use nested functions, names are operated by first checking
    the local scope or the innermost function''s local scope. After that, `Python`
    looks at all enclosing scopes of outer functions from the innermost scope to the
    outermost scope. In case no match is found, `Python` starts looking through the
    global and built-in scopes. If no name is found, then you get an error. Regardless,
    at any given time during execution, you will have at most four active `Python`
    scopes – local, enclosing, global, and built-in – depending on where you are in
    the code. On the other hand, you can always access at least two active scopes,
    which are the global and built-in scopes that are always available for you.


    ### Functions: The Local Scope


    The local scope or function scope is a `Python` scope generated at function calls.
    Each time you call a function, you are also creating a new local scope. At the
    same time, you can think of each `def` statement and `lambda` expression as a
    blueprint for the next local scopes. These local scopes will be produced whenever
    you call the function at hand. By standard-setting, parameters and names that
    you assign inside a function exist only within the function or local scope corresponding
    with the function call. When the function returns, the local scope is ended, and
    the names are forgotten.


    ### Nested Functions: The Enclosing Scope


    Enclosing or nonlocal scope is designed when you nest functions inside other functions.
    The enclosing scope was firstly added in `Python` version 2.2. It can take the
    form of the local scope of any enclosing function''s local scopes. Names that
    you use when the enclosing `Python` scope is commonly known as nonlocal names.


    ### Modules: The Global Scope

