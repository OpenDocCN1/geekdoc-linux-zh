    # Configuring the Berkeley Internet Name Daemon 8.1 (BIND)


    If you''ve decided to be a DNS server, be it a primary, secondary, or a mix of
    the two, you need to get (possibly compile) and configure BIND. It''s very likely
    that named was installed when Linux was installed; if you can not retrieve it
    from the official distribution sites at ftp://ftp.isc.org/ or any Linux distribution
    site.


    As version 8.1 the configuration file name and format have changed. Since the
    new version of BIND is or will be shipped with newer versions of every Linux distribution,
    we will go over the configuration of it.


    The basic 8.1-style config file is named named.conf and lives in /etc. It has
    four types of statements: one controlling access, one describing the logging,
    one describing the more general options, and one or more describing zone(s) it
    is a server for Comments in the file can be delineated using C or C++ style syntax.


    BIND comes with extensive documentation, but we will try to detail the most important
    parts of it here.


    The options statement describes what IPs©s to listen for, and what port to use.
    Firewalls can complicate things and will likely require that you use a privileged
    port. 53 is the default port and can be specified in this statement. The working
    directory for named specified here, /var/named, is fairly widely used. The zone
    files and any other files specified in various statements will live here in the
    absence of any pathing information. There are many


    > 10 As it is, wayga.net is part of someone else''s IP network. That''s why we
    don''t reverse DNS. If someone did a reverse DNS lookup on us, it would report
    a different domain.'
