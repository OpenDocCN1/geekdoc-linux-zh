  md: '# 12.1 Office Products, Word Processors, and Editors


    +   - BibTeX—a bibliography and citation system. It will also allow you to build
    bibliographies for a particular document from a larger, possibly shared, bibliography.


    +   - SliTex—specially designed for making overhead slides or large print documents
    for presentations.


    +   - MakeIndex—a utility for creating an index for a TeX or LaTeX document. It
    supports up to three levels of indexing.


    +   - HyperTex—an extension for TeX that lets you create hyperlinked documents.
    The source passes on the hyperlinking information to the .avi file which can subsequently
