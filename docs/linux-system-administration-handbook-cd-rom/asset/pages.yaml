- pgno: 296
  md: '# 19.1 Facilities and Priorities


    +   * notice

    * warning

    * err

    * crit

    * alert

    * emerg


    # 19.1 Facilities and Priorities


    The facility/priority combination that you list will then report all the messages
    that get sent to syslog for that priority and higher. A priority of degug report
    all messages, and a priority of none report no messages.


    Replacing either the facility or priority with an * will report for all facilities
    or all priorities, depending on where you put the * (before or after the period).
    You can combine multiple facilities to one priority by separating them with a
    comma.


    The syslog that Linux uses a few extensions to it that are not in the original
    BSD version of syslog. Putting a a = sign in front of a priority says to report
    only this priority in a list. Putting a ! in front of a priority says to ignore
    that priority and all higher priorities. Combining the two (!=) would ignore only
    that priority.


    The man pages for the particular programs you want to monitor usually list what
    facilities the program uses. You''ll note that there are eight user-defined facilities
    you can use in your programs or other scripts.


    # 19.2 Actions


    The second field lists where the message should be sent. This can be a file (if
    the destination starts with a /), a remote host (if the destination starts with
    an @), all logged-in users (if the destination is a *), or a specific user (if
    it starts with none of the above three characters). The file destination can also
    be a tty file, such as /dev/console, which will send the message to the Linux
    console.


    You can also use the | character to pipe the message to an external command or
    a fifo.


    Using the remote host logging can randomize a group of computers to log all their
    messages to one machine. However, if there was a severe enough'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'problem (the ethernet card goes bad, kernel panic, etc.), the message for this
    may not get sent to the remote host. Of course, the same thing can be said for
    logging to the hard drive should the drive or its controller go bad.


    # 19.3 Logging Procedures


    How you log depends on what you want to log. For an initial setup, you should
    probably start by logging just about everything. For programs like pppd, this
    will greatly increase the amount of debugging information you have. As the system
    becomes stable and it is working correctly, still continue debugging but change
    the priority to something like warn or err to keep out regular debugging information.
    You may also choose to have different facilities for different files. For example,
    send all E-mail logs to /var/log/maillog, and bad logins to /var/log/authlog.
    This can make it easier to separate problems if they arrive. Bad login problems?
    Check the authentication log. The downside to this is that some logs maybe intertwined.
    For example, a bad login may be a result of someone''s cracking in sendmail. If
    you don''t examine the mail log, you may not realize what''s going on.


    # 19.4 Summary


    One of the keys of having a long uptime is knowing everything that is going on
    in the system. By monitoring your machine carefully, you can catch potential problems
    or breakouts as they occur, and fix the problem before it gets out of hand.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# Backing Up 20 Your Data


    > When all else fails . . . restore from backup!


    Keeping good backups is frequently the only way to recover from many accidents,
    disasters, or break-ins. Linux has a number of methods for archiving your data,
    ranging from tools like tar or cpio to drives that come with Linux to feature-rich,
    sophisticated commercial packages.


    There are a number of ways to keep backups, ranging from simply taring your entire
    file system to a tape using dump and a well-designed backup schedule to running
    a high-end commercial backup and restore program.


    Of course, you also have a variety of backup media to choose from: floppies (if
    you are truly desperate), tape drives (from old nine up to DAT), write once, read
    many (WORM) drives, magneto-optical floppies (written magnetically, read optically),
    and Zip and Jaz drives. Of these, only the newer tape options and JAZ drives have
    gigabyte capacity and only exabyte and DAT can handle more than a couple of gigabytes.
    Unfortunately, tapes are in many ways the most cumbersome to work with because
    of their sequential access nature.


    277'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# 278


    # Chapter 20 • Backing Up Your Data


    With the new proposed standards for CD-ROM- (and thus WORM-) based filesystems
    this media will soon sport multiple gigabyte capacity. Though they will still
    be write-once, the easier access (random instead of sequential) will likely make
    them popolar once their price drops into the affordable range. In actuality, the
    technology for this has existed for some time, the popularity of the current standard
    has kept it from being replaced. But the need to store large amounts of data reliably
    has grown tremendously in recent years, and CD-ROMs are a big win over tape in
    both ease of access and longevity (decades versus years).


    The rest of this chapter assumes you have some form of large capacity media on
    which to backup your data, though many of the guidelines are regardless of the
    media being used or its capacity.


    In general, you will want to run your backup during times of low activity for
    two reasons. it’s not a good idea to have lots of files open or changing while
    the backup is running. Some programs will lock a file and the backup will, at
    best, be able to skip it or, at worst, the backup will exit or crash. Second,
    backing up your system will tend to consume a lot of system resources, and if
    your server is fairly loaded already, it will likely be bogged down considerably
    if you try to run the backup during “normal” business hours (whatever might be).


    # 20.1 tar and mt


    tar, as you may know, stands for Tape Archive. Before the most recent versions
    of GNU, tar was not really suitable for use as a backup tool. It had no way of
    performing incremental backups and properly handling files with holes (so-called
    sparse files).


    At the base level, you can create a cron job that will compress all of your filesystems
    and network volumes to a tape drive every night or every few nights. There are
    a couple of drawbacks to this method.


    Typically only a small fraction of the filesystem changes over the course of even
    a week. Making a copy of the whole filesystem every other night might kill. It
    would be better if incremental backups could be made.


    It’s very possible that you could have more stuff than you have capacity on your
    particular combination of tape and drive. In this case you would have to break
    up the backup and change tapes at some point to complete the backup. Once again,
    incremental backups would alleviate this.


    If your backup, or sections thereof, is small enough, you may want to put more
    than one on a single tape and you may need some way to access a par'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# 20.1 tar and mt


    ticular archive at some later point. You could use tar''s append feature then
    the ability to maintain different versions is lost. When the archive is unpacked,
    the appended files will overwrite ones with the same names which were extracted
    earlier.


    Since tapes are not randomly accessible, special care needs to be taken when writing
    multiple archives to a single tape. To move on a tape you will likely use mt.
    It can move along the tape from archive to archive as well as rewind or fast-forward.
    It takes at least two arguments: the tape device and the movement to make. Movements
    can be relative to the current position or absolute (using the beginning of the
    tape as the reference point). It''s obviously safer to use absolute movements,
    if you are in a hurry, a relative movement is quicker.


    Now, we have beaten up on tar a bit, let''s point out a few things that tar is
    good at doing.


    tar can archive files that aren''t currently needed or take a snapshot of a project.
    If one of your users has data they still need but aren''t going to be using for
    a while, take advantage of this tar to a tape and remove them from the server.
    Also, you may need to keep snapshots of projects but not necessarily need to keep
    them on-line.


    As mentioned earlier, tar is commonly used to create packages or distributions
    of documentation, source code, or precompiled software.


    Finally, tar can be used to transfer directory trees around your filesystem. Its
    many command-line options let you control preservation of permissions, modification
    dates, and the following of symbolic links. This allows you to re-create a directory
    tree on another partition with more control than cp a. An example illustrates
    this nicely:


    ```

    # (cd /home ; tar cf caryc) | tar xf

    ```


    This will re-create the directory /home/caryc as a subdirectory in the directory
    where you invoke the command. It will preserve the permissions and ownership of
    the files and re-create (but not follow) symbolic links (assuming the links are
    not stale).


    In general, it is not a good idea to follow symbolic links unless you know where
    all the links in the tree are pointing. If a link points back down to a directory
    that is within the archive, you will start recursively re-creating the directory
    tree within the subdirectory and quickly eat up a large amount of disk space.'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# 20.2 cpio


    In many ways cpio is similar to tar. It supports more formats (including the format
    used by tar) and can also deal with archives from machines with different byte
    orders. It does not have an equivalent to the --update option.

    Like tar, cpio can write or read to network devices or as local ones.

    Finally, cpio can be used in pass-through mode to copy directory trees.


    The choice between using cpio or tar to perform backups is largely a matter of
    preference.


    # 20.3 dump and restore


    dump is probably the best free alternative for performing backups. It makes a
    fairly low-level copy of the filesystem. Because of this, any type of file (including
    sockets and block and character devices) can be archived and files which have
    empty blocks are properly saved. Additionally it can perform incremental backups
    and archives can span multiple tapes. One final nicety is that dump has no limit
    on the length of file- or pathways.


    Incremental backups are controlled by assigning a dump level to a particular backup.
    Dump levels range from 0 to 9, and when a dump of a certain level N is performed,
    all files that have changed since the last dump of level N-1 or lower are sent
    to the tape. As you might guess, a level zero dumps the entire filesystem.


    dump requires you to know the length and density of the media being used for the
    backup. In the case of devices using data compression, there is a virtual length
    associated with the device, which is simply the compression ratio times the actual
    tape length. It''s usually best to be conservative here; the compression ratio
    is really an average; not all files compress equally. If you overestimate the
    amount of compression, dump will try to write after the tape has run out and the
    dump will be ruined.


    dump is one of the lowest-level methods for backing up your system, but it is
    also one of the least fault-tolerant. Unless you understand it and your backup
    device very well, you may want to choose another method of backing up your system.'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# 20.4 Commercial Backup Products


    # 20.4 Commercial Backup Products


    BRU


    The Backup and Restore Utility (BRU) is strongly based on tar but adds many more
    features. It runs a daemon which manages the backup schedule. It comes in two
    versions, the more expensive of which supports backing up NFS disks; the less
    expensive works only on local disks.


    BRU also comes with a menu-driven interface in both X and ASCII. The concept of
    backup levels is supported, and backup targets can be any character device.


    Other features include the following:


    +   - Keeps track of the number of uses of a tape to help you decide when to throw
    out older tapes.

    - Contains powerful features for recovering data from corrupt archives.

    - Has support for NIS (Network Information Services, a networked system for passwd,
    group, and host files and much more).

    - Has support for SMB (Samba) and Netware volumes.

    - Archives can span more than one backup device.


    BRU is available for Linux on the x86, Alpha, and PowerPC. See http://www.estinc.com/
    for more information.


    # PerfectBACKUP+


    PerfectBACKUP+ is widely acclaimed as the fastest backup and restore program.
    Previously sold as FASTBACK PLUS for UNIX, it began life as the UNIX version of
    DOS FASTBACK PLUS. It comes with menu-driven ASCII and Motif interfaces, networking
    support, compression, verification and recovery, and scheduling and it is compatible
    with both tar and cpio. It will also backup a variety of network drives, including
    NFS, Windows, Network and NT.


    Other features include


    +   - Compression.

    - Network backup devices.'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# Chapter 20 • Backing Up Your Data


    +   - Multiple backup devices—when one is full, it will move to the next device
    in the list.

    - Locking files during backup to allow safer backups in multiuser mode.

    - Support for all file types, including sockets, pipes, and so forth.


    More information on PerfectBACKUP + is available from http://home.xl.ca/perfectBackup/.


    # BACKUP/9000


    Though this is available only in beta for Linux as of this writing, it has one
    feature that prompted us to include it. It is designed to work with Oracle to
    allow live, safe backups of Oracle''s tablespaces. If you are running Oracle (for
    SCO using the IBSC emulation, there is no native Linux version), you will undoubtedly
    find this feature of great use. Beyond this, Backup/9000 supports what you would
    expect of a commercial backup and restore program:


    +   - Nice user interface.

    - Scheduling tool.

    - Support for local and network backups

    - Uses tar or cpio format

    - Encryption

    - Parallel backups to multiple local and/or network tape backups

    - Backup of raw partitions and FIFO streams in addition to normal files

    - Multiple backups on one tape


    # 20.5 Backup Strategies


    How often you make what kind of backup depends on several factors, including


    +   - The capacity and speed of your backup device, particularly important for
    unattended backup.

    - How active your file systems are. What percentage of files are changing per
    day or week? Most likely, this will vary from partition to partition.

    - Whether or not you can make live backups.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# 20.6 RAID and Disk Mirroring


    +   - If you can''t make live backups, how much downtime is acceptable and when
    is it least inconvenient.


    In general, more than a few percent of a particular filesystem is changing daily,
    you should perform incremental backups every day or two, a lower-level backup
    weekly, and a full backup monthly. Lower activity levels mean you can space this
    out, though there''s really no excuse for not performing a full backup once a
    month.


    Buy lots of whatever your backup media is; it''s cheaper than having to pay the
    office for a day of working a second time.


    For very active systems which more or less cannot be taken off-line except at
    3 A.M. on a Sunday, you should get a commercial backup utility that will perform
    safe, live backups at least during low traffic periods. You will then hopefully
    be able to perform unattended incremental backups at night, fully backups if you
    can fit the system on one tape.


    The more databases are typically problematic when it comes to live backups. Usually,
    your backup utility cannot make a proper snapshot from the database''s point of
    view. Fortunately most databases can create a snapshot of themselves, and that
    can be placed in your archive. Failing this, the database will have to be taken
    off-line before being backed up.


    You will probably want to keep some backups off-site in case of a disaster (flood,
    UFO crashing into your system, dinosaur rampage, etc.). You may have to buy a
    new system, but at least you''ll have what is likely hundreds, if not thousands,
    of man-hours of work saved.


    # 20.6 RAID and Disk Mirroring


    These are other techniques for protecting the integrity of your data. RAID stands
    for Redundant Array of Inexpensive Disks. It is a fairly new concept, having been
    introduced in 1987 at the University of California, Berkeley.


    The basic idea behind RAID is that by using small disks (as opposed to few large
    disks) and possibly some additional "parity" data, you will be able to reconstruct
    data loss when one of the disks fails instead of losing a few gigabytes (albeit
    temporarily, assuming that you have a backup).


    There are several levels of RAID, clearly numbered from 0 to 5. Their features
    are given in the following table. Only levels 1, 4, and 5 are available for Linux,
    and only in software (as opposed to a hardware level implementation).'
