    If a site has been removed from the newsfeeds file but a batch file exists for
    it, running “ctlinnd drop <site>” will remove the site from the list of active
    feeds and flush out the batch file. Merely running a “ctlinnd flush <site>” will
    clear out the batch file. If no site is specified, then flush tries to clear out
    of the batch files and also writes the active and history files to disk, flushing
    the local server as well.


    # Reloading the Server


    After modification of any of the following files, the news server must be reloaded
    for any changes to take effect: history, hosts.ntmp, newsfeeds, active, overview.fmt.
    The reload command will also take an argument of “all” to reload all of the above
    files. If the argument passed to ctlinnd reload is history, then the history database
    is closed and reopened. If the argument is hosts.ntmp, then the nmtp access file
    is reread. If the argument is active or newsfeeds, then both the active and newsfeeds
