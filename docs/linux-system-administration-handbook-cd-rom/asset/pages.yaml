  md: '# 4.3 tcsh


    This little program checks for the existence of the /var/spool/mail/

    kk file. As long as the file exists, the file ~markk/mail.file will get a

    line added to it, and the program sleeps (waits) for 30 seconds before starting

    over. If the /var/spool/mail/markk file doesn''t exist the next time the

    while loop runs, the loop exits.


    In case you''re wondering about the [ ] that you see in the while, it is a

    replacement for the test command. The test command can test on various

    conditions (existence, ownership, permissions) of a file. In our case, the -f

    means to see if the file exists. The man page for the test command will give

    more information about the kinds of tests that you can use. This will also

    work with tcsh or other shells.


    # 4.3 tcsh


    The tcsh is the Linux replacement for the csh shell. On startup, the tcsh

    reads the /etc/csh.crc and /etc/csh.login files. Once done, tcsh

    reads the ~/.tcshrc, or if that cannot be found, ~/.cshrc, followed in

    both cases by ~/.login. In a non-login interactive shell, the /etc/

    csh.login and ~/.login files are not read.


    On logout, the /etc/csh.logout and ~/.logout files are executed.


    # Environment Variables


    The tcsh has the idea of environment variables, plus variables specific to

    tcsh, which are not really part of the environment. Multiple entries in a vari-

    able are separated by spaces and encoded in parentheses, so, the path would

    look like


    ```

    path (/usr/local/bin /bin /usr/bin /usr/X11R6/bin /home/markk/bin)

    ```


    Environmental variables intended to be read by other programs are set

    with the setenv command. The setenv command is similar to environ-

    ment variables under bash, in that multiple entries are separated by columns.
    Set-

    ting variables are like this:


    ```

    setenv TERM vt100

