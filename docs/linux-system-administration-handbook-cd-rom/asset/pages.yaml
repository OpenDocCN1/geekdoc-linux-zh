    # Extensions for Apache


    One of the more complicated extensions with a difficult setup process, suEXEC
    is a wrapper which allows CGI programs to be executed under a different UID than
    under which the server is running. This is often used by ISPs that let their users
    manage their own CGI; this forces the script to execute as that user. This obviously
