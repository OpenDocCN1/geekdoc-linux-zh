    ScriptAlias—Often, for security reasons, you will want to have the directories
    from which CGI programs can be executed outside of the directory tree. Or you
    may simply want to provide a shortcut for referencing a directory containing CGI
    programs.


    Alias—Similar to ScriptAlias, but only non-cgi files can be served from the directory.


    VirtualHost—If you want requests that come in on a different IP, server name or
    port to be served from a different document root, a different server name or with
    aliases pointing to different directories, then this is the directive for you.
    Any of DocumentRoot, Directory, ScriptAlias, Alias, User, Group, UserDir, or ServerName
    can be used as arguments inside it. A couple of examples should help to demonstrate
    the power of the VirtualHost directive.


