- pgno: 50
  md: '# 4 Shells


    # Interacting with the Linux system via the shell.


    The Linux shell is the primary interface to the Linux kernel. It starts your applications,
    lets you run commands, and is a programming language as well.


    When you log into a Linux system or start an xterm, you''re using a shell. When
    the kernel boots and it runs /etc/rc.local or /etc/rc.d/init.d scripts, it''s
    running a shell. In DOS, the shell would be the command.com file. The shell is
    what runs the commands you use. The shell can provide additional functions like
    filename or command completion, monitoring your mailbox, or monitoring for other
    users logging in.


    There are two primary types of shells that Linux uses. First is the sh (for plain
    shell) which has a very bare-bones functionality but is easy enough to create
    rather powerful programs¹ that you can run. The second is csh (for C shell) which
    has more user features, just a history and command


    +   ¹ Also known as shell scripts.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'and filename completion, and is a bit more complex for building shell scripts.
    There are other shells available, such as ksh, ash, bash, but they are variations
    or extensions of sh or csh.


    # 4.1 Common Features


    Both shells are available for login by changing the entry in the /etc/passwd file.
    If you install new shells, change the /etc/shells file to add the name of the
    shell. If a user has a shell that is not in the /etc/shells file, the user will
    not be able to log in. Another method of changing a user''s shell is using the
    csh command. A regular user can run this to change their own default shell.


    By adding a !/bin/sh or !/bin/csh as the first line of a shell script and setting
    the shell script executable (chmod +x file), the contents of the shell script
    is run through the shell. So, a file called whom.sh that is set executable has
    the contents


    ```

    #!/bin/sh

    whoami

    id

    ```


    would have the following output if run:


    ```

    [markk@wayga ~]$$ .whom.sh

    markk

    uid=500(markk) gid=500(markk) groups=2 (daemon),100 (users),500(markk)

    markk@wayga ~]$

    ```


    Note that you can replace the /bin/sh with /bin/csh if you want the whoami and
    id commands are regular UNIX commands. The only place where a shell script to
    use one type or another is where you get into things like loops or other features
    specific to shell scripts.


    # Wildcards


    Wildcard expansion is a method where a character or small group of characters
    matches a larger group of items in a set. In csh and sh, the * character means
    one or more characters, and ? represents one character. Using this, all the files
    in a directory can be listed as just *. All files that have only two characters
    can be represented as ?? (since each character can be represented with one ?).
    The wildcards can be used at any point in representing a filename.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# 4.1 Common Features


    For example, all the files that start with the letter a can be represented as
    a* and all the files that end in .txt can be represented as \*.txt.


    # History


    The bash and tsh programs have the ability to keep a running history of the commands
    you have run. The bash shell can store a history across logins, which allows you
    to see what commands you ran before you logged out.


    The history is stored as a “sliding window,” so that if the history command size
    is 50, and you run 51 commands, command number one is forgotten, and the first
    entry in history file is command number two.


    # Environment Variables


    Environment variables store information used by the shell (such as the PATH variable)
    or information used by specific applications (such as Netscape or man). Here are
    some of the common variables that get set on login on a typical system:


    +   * PATH—Contains a search path for applications. The shell starts on the left
    side of the search path and searches every item listed in the search path until
    it reaches the end, or finds the application.

    * HOME—Has the location of the user’s home directory, as it’s defined in the /etc/passwd
    file.

    * MANPATH—Used by the man program to search for man pages. This typically contains
    /usr/man, /usr/local/man, and /usr/X11R/man but may include directories where
    other manual pages are located.

    * TERM—Terminal type, which should relate to an entry in the /etc/termcap file.

    * MAIL—Contains the location of a user’s mail spool file, typically /usr/sp/mail/user.
    In some cases, this can be set to /var/mail/user.

    * DISPLAY—Contains the host, monitor, and X server for X applications to display
    on. See the chapter on X for more information about how the DISPLAY variable works.

    * EDITOR—Contains the program used as a user’s default editor. Usually set to
    /bin/vi.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Pipes and Redirection


    The shells have the ability to redirect the output of one program and send it
    either to another program, or to a file. If you send the output of a program to
    another program, it''s called a pipe. If you send the output to a file, or take
    input from a file, it''s called redirection. To simplify how this works, there
    are three main types of input and output for a program:


    +   - STDIN—Standard Input, which is normal input (from the keyboard, or a pipe).

    - STDOUT—Standard Output, which is normal output from a program or comes out of
    a pipe or redirection.

    - STDERR—Standard Error, which is similar to STDOUT but comes on a different channel
    so it doesn''t corrupt the data in STDOUT.


    Commands get piped when a command string contains the | character. So, this command


    ```

    ls |

    ```


    would pipe the output from the ls command to the more command. Many commands (such
    as more) will resort to taking information from STDIN if no options are given.
    In our case, since more has no files to list, it just takes STDIN.


    If there were an error in the ls command (for example, the directory did not exist),
    the error message would get sent out to STDOUT. The error would not get sent through
    the pipe to the more command.


    Redirection is done in a few different ways. If you take input from a file, the
    character used is <, and if you send output to a file, the character is a >. You
    can think of it as the arrow pointing towards the command. You can duplicate the
    functionality of the pipe using a temporary file:


    ```

    ls > temp.file

    more < temp.file

    ```


    The first command sends the output of the ls command to the temp.file. That file
    is then used as input to the more command. There are ways to redirect STDOUT,
    and that is different for each type of shell.


    Note that if a temp.file exists before, it will be overwritten. If you use >>
    the output from the program will be appended to the end of the file.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Filename and Command Completion


    Normally, sh does not allow for filename completion, and csh needs to have a variable
    set for it to be turned on. Both the bash and tesh shells have filename completion
    turned on by default. Hitting the TAB key will complete a command if it''s the
    first word on the command line and resorts to filename completion if it''s the
    second or later word in the command line. Command completion searches the entire
    PATH for the command, and if more than one command matches this, the command will
    be matched up to where the two program names differ. Hitting CTRL-D in tesch or
    hitting TAB repeatedly in bash will display the available choices.


    # 4.2 sh typical sh on Linux systems is really called bash (Bourne again shell).
    It is based on sh but has some features from csh and ksh in it.


    When bash starts up on login, it reads the /etc/profile, followed by ~/.bash_profile
    or ~/.profile if available. This contains startup information such as setting
    the path or other settings. The /etc/profile is a global setup file, while the
    .bash_profile or .profile is local to each user.


    When you log out, the .bash_logout file is run.


    When a new shell is started (for example, if a program starts a shell, or xterm
    starts up), the ~/.bashrc file is read. In this instance, this is called a non-login
    interactive shell.


    # Environment Variables


    To set an environment variable under bash, merely enter the variable you want
    to set, an equal sign (=), and what you want to set the variable to. For example,
    if you want to change the TERM variable to vt220, enter the command


    ```

    markk@wayga:~ $ TERM=vt220

    ```


    > 2 Unless you have the nodobber option set, in which case you won''t be able
    to overwrite (or clobber) an already existing file with redirection.'
  merge: -1
  img_proc: true
