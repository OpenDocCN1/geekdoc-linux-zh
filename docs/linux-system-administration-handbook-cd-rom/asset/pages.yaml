- pgno: 164
  md: '# Setting Up FTP 11


    Virtual, anonymous and more.


    The File Transfer Protocol (FTP) is one of the most frequently used services available
    on the Internet. Setting up an anonymous FTP server is fairly straightforward.
    Other services, like virtual FTP hosts and ftp only accounts, are a little more
    tricky.


    We''ll cover how to set up all of these services in this chapter and then talk
    about a few client programs.


    # 11.1 Anonymous FTP


    This is the most common service: a single anonymous FTP server on a machine. Most
    Linux distributions will set up this up automatically. Typically the ftp root
    will be `/home/ftp`.'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'If, for some reason, anonymous FTP isn''t set up on your machine, it is very

    simple to set up.


    # Setting Up Anonymous FTP


    In the instructions below, ~ftp is the home of the anonymous ftp user as

    specific in the /etc/passwd file.


    The FTP daemon, vsftpd, recognizes the anonymous user and adjusts some

    aspect of the account. The root directory for access is set to ~ftp. This

    means that access is limited to the directories and files in ~ftp at best. Per-

    missions can, of course, restrict access further. Because the file system root

    is changed, several directories and files need to be set up to allow a minimal

    level of functionality.


    +   - ~ftp should be owned and only writable by root.

    - ~ftp/bin should also be owned and only writable by root. It should

    contain the ls program (located at /bin/ls). ~ftp/bin/ls should be

    owned by root and have the mode ---x--x--x, chmod 111 ~ftp/

    bin/ls is if this is not the case.

    - ~ftp/lib should contain l1d-linux.so.1, ld.so and libc.so.5.

    These can be found in /lib.


    If you want listings translate user and group IDs into names, you will

    need to create ~ftp/etc. It should have mode 755 and contain passwd and

    group files that associate IDs with names. The encrypted password field is

    ot used and should be empty. The only fields that to be present are

    username, UID, and GID.


    The upload and download directory ~ftp/pub should have mode 755 and

    own by ~ftp. This will allow others to upload and read from the direc-

    ty. You can course change ownership and permissions to allow the level

    of access you desire.


    The user "~ftp" should have an entry in /etc/passwd similar to this:


    ```

    ftp*:14:50:FTP User:/home/ftp:

    ```


    FTP is a service controlled by inetd and, such, requires an entry in /

    etc/services. Once again, this should be set up already, but if it is not, add

    an entry like this:


    ftp 21/tcp'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# 11.2 FTP Access for User Accounts


    # 11.2 FTP Access for User Accounts


    When someone connects with a username other than anonymous (or its alias ftp),
    three conditions must be met for access to be granted. The username and (non-null)
    password combination must be valid. The username must not be present in /etc/ftpsusers.
    The user must have a valid shell, that is, it must be listed in /etc/shells.


    # 11.3 FTP-only Accounts


    It is possible to set up user accounts that can be accessed only via FTP. These
    accounts barely behave similarly to the anonymous account and can coexist peacefully
    with it. Since the directory root is reset, you will need to set up the bin, lib,
    and etc directories as they are set for the anonymous account.


    To restrict particular accounts to FTP-only access you need to edit (or possibly
    create) the /etc/ftpaccess file.


    The example below sets up two users, ftpbob and jane, as FTP-only accounts.


    ```

    #

    # /etc/ftpaccess

    #

    class all real,guest, anonymous *

    class ftponly ftpbob, jane *


    loginfails 5


    readme README* login

    readme README* cwd=*


    message /welcome.msg login

    message .message cwd=*


    compress yes all

    tar yes all

    overwrite yes real

    chmod guest, anonymous

    delete no guest, anonymous

    rename no guest, anonymous

    overwrite no guest, anonymous


    grouproup ftponly

    ```'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Chapter 11 • Setting Up FTP Services


    The class line sets up groups of users and a host pattern to match against the
    remote host. The “* matches all hosts.


    The corresponding /etc/passwd entries are


    jane:9phhxXoQW:518:518:Jane''s FTP-only Account:/a/ftp/jane:/bin/false

    ftpbob:I8Leijehfp:518:518:Bob''s FTP-only Account:/a/ftp/ftpbob./

    incoming:/bin/false


    The shells for the two users are both valid that will deny them shell access.
    The home directory will be the root directory for the ftp session. Additionally,
    the ftpbob account will be chdir() into /a/ftp/ftpbob/incoming.


    You probably noticed that the ftpprocess sets up a number of other parameters
    as well.


    The “real” word is a keyword for any valid account, “anonymous” stands for any
    anonymous account, and “guest” refers to guest level access


    The compress and tar entries set ftppd when to allow on-the-fly (de)compression
    or (un)tarring.


    The README and message entries set up patterns to search for files to be automatically
    displayed (message) when connecting and entering directories (README).


    In the above example, low-access accounts (anonymous and guest) are forbidden
    from deleting, changing the mode of, or renaming files.


    loginfails does what you expect it to do: Drop the connection after the specified
    number of failed login attempts.


    # 11.4 Virtual FTP Hosts


    Virtual FTP is frequently used by ISPs to set up FTP services for multiple domains
    on one server. The stock Linux ftppd does not support virtual FTP hosts. You will
    need to obtain wu-ftpd and the patches to enable virtual ftp support.


    The source for wu-ftpd can be found at http://wuarchive.wust1.edu/packages/wuarchive-ftpd/.
    You will need version 2.4 as it is the version patches made for.


    The patches themselves can be found at http://www.westnet.com/providers/multi-wu-ftpd.txt.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# 11.5 FTP Clients


    You must use IP virtual hosting in order for this to work. See the chapter

    on IP and firewalling on how to set up your ethernet card to answer multiple

    IPs.


    Save the patch into a file and then apply it in the source code directory of

    wu-ftpd. Assuming the patch is stored in wu-ftpd-patch in the source direc-

    tory, enter


    ```

    # patch < wu-ftpd-patch

    ```


    You will need to add a line or lines similar to /etc/ftpaccess:


    ```

    virtual 10.10.10.200 /ftp/ftp-virtualall/ /ftp/ftp-virtualall/etc/

    banner.msg

    ```


    The first argument to the virtual directive is the IP of the virtual host;

    thecond is the root of the ftp area for that host; and the third is the location
    of

    the file containing the welcome message.


    # tftp


    Trivial tftp is a very simplistic FTP service. It has no user validation and no

    ability to change directories or to list the contents of the directories. It can

    get or put files in binary or ASCII mode. That''s it.


    Some devices may require a tftp host for part of their booting pro-

    cess, but in general, tftp is used fairly rarely and you will likely want to dis-

    able it in /etc/services unless you need it.


    # 11.5 FTP Clients


    There are two types of ftp clients: those which support user-based FTP

    dhose which support only anonymous FTP.


    Today, probably the most common way to access anonymous FTP sites is

    with a Web browser. These are typically the only clients that only support

    anonymous FTP.


    There are also a number of other FTP clients ranging from the simple

    command line like the ftp program to full-screen clients like NcFTP to

    graphical clients like XFTP.'
  merge: -1
  img_proc: true
