- pgno: 358
  md: '# # Appendix C


    #  Installing OpenLinux


    This chapter explains how to install your new OpenLinux system. Before you install
    OpenLinux, you need to prepare your new hard disk. That way, you won''t lose any
    information that''s currently on your hard disk and you can quickly install your
    system.

    This section explains how to do these tasks:


    +   - Prepare to install.

    - Upgrade from existing Caldera or Linux systems.

    - Share the hard disk.

    - Install OpenLinux.

    - Boot in emergency situations.'
  merge: -1
  img_proc: true
- pgno: 359
  md: '# C.1 Preparing to Install


    Before you install OpenLinux, you must obtain information about the hardware in
    your system. That way, you''ll know if your computer is compatible with OpenLinux,
    and you''ll be able to quickly the system.


    This section explains these topics:


    +   - System requirements

    - Collecting hardware and network information


    # System Requirements


    Your computer system must meet the following requirements in order to install
    OpenLinux.


    +   - 32-bit Intel-based personal computer or compatibles, such as these processors:
    386, 486, Pentium, Pentium Pro. Other processors are not supported in this release.

    - Minimum 8-MB RAM (16-MB RAM to use graphical components). (You''ll need more
    or less disk space, depending on the installation option choose.)

    - A supported mouse and video card (for use with the graphical components.)


    # Collecting Hardware and Network Information


    Before you install OpenLinux, you should collect information about your system''s
    hardware and your network. You''ll use this information as you install your new
    system. For example, if you have a CD-ROM drive, you''ll be asked to specify your
    system''s CD-ROM type and model.


    This table lists the information you''ll need to quickly install OpenLinux.


    Collect the information in this table before you install OpenLinux. Items marked
    with an asterisk (*) are usually automatically detected when you install OpenLinux.'
  merge: -1
  img_proc: true
