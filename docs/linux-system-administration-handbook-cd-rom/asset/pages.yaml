- pgno: 44
  md: '# 3.1 Adding Users


    chgrp eng README


    Then, set appropriate permissions on the file:


    ```

    chmod 660 README

    ```


    This particular chmod command gives read and write permissions to the owner (you)
    and anyone else in the eng group. No other users have access to this file.


    The chmod command actually uses four octal numbers (0-8) to specify permissions:


    | Ownership | User | Group | Others |

    |---|---|---|--|\| 0—no setting | 0—no permissions | 0—no permissions | 0—no permissions
    |

    | 1—save text image | 1—execute | 1- execute | 1—execute |

    | 2—set GID | 2—write | 2—write | 2—write |

    | 4—set UID | 4—read | 4—read |


    The ownership settings are rather special, in that they give some extra functionality
    but are also security holes. The “save text image” means that once the program
    has finished running, it will save the text portion in memory to decrease the
    amount of time it takes the program to load later. This can quickly eat up memory
    if many programs have this, but if you use programs a lot, this may be helpful.


    The set GID means that once the program runs, the group ID of the user to be that
    of the file. If a program is in the sales group and has its GID bit set, when
    I run that program, I will be in the sales group only within that program it is
    running. Some E-mail programs use the set GID to lock files in the /var/spool/mail
    directories. The user becomes part of the “mail” group while the E-mail program
    is running and can run to /var/mail.


    The setUID is the same as setGID but works with user IDs instead. Some programs,
    like network sniffers, require the use of devices or functions that can run only
    by root. By setting ping to be UID root, everyday users can run the ping program.
    If you set a program to be set UID, be careful what you’re doing. If a program
    creates a new shell process, it will have the UID of the owner of the file. If
    the owner of the file is root, this can lead to common users getting root access
    very quickly. All the user would have to do start a shell, and the new shell will
    be running as root.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# # /etc/skel Directory


    This directory contains a “skeleton” user. That is, it contains files that you
    can use as a base for other users. In most cases, it contains setup files for
    X, /bin/bash config files, and a .login. You can add to or change these files
    as you like, but remember that existing users will not have these changes taken
    into account. Only new users will see them. If you want to have common settings
    for all users, you can use the /etc/login, /etc/csh.crc, and so on.


    # ## 3.2 Deleting or Disabling Users


    If you want to disable a user account (that is, prevent the user from logging
    in again), replace the password in the /etc/passwd file with a * or some other
    character. Since the * is not a valid encrypted password, there is no password
    that will allow you to log into that account.


    To delete an account, remove the entire line from the /etc/passwd file. The user
    will cease to exist to the system, and root cannot su to that user.

    The differences? If you disable an account, the account technically still exists.
    That user can still receive mail,³ has a home directory (that other people can
    access if the permissions are correct), and has all the rights of any other account.
    The user just can’t log in. When an account is deleted, the system will bounce
    any mail that comes to that UID, and all files owned by the former user will now
    be owned by the user that had. Also, any accesses to the home directory (cd ~bob,
    for example) will not work.


    # ## When to Disable and When to Delete


    So, when should you disable an account and when should you delete it? It depends
    on what information you want to keep. If you’re an Internet Service Provider (ISP)
    and the customer cancels, you might just want to delete the account. If you’re
    in a business and an employee quits, you’d probably want


    > ²The root user can still use “su” to enter that account, as su does not ask
    root for passwords.


    > ³A deleted user can still have an entry in /etc/aliases to forward mail to another
    system.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# 3.3 Using Shadow Passwords


    to make the account disabled for six months to give everyone else time to transfer
    files to other users, or to back up the account.


    The best criterion for this is: If the user has data in their home directory that
    others would want or need to access, disable the account. Once the files needed
    by the disabled account have been moved to other locations, delete the account.
    If the account has no information needed by other users, back up the home directory
    and any other files the user owns and delete the account.


    # 3.3 Using Shadow Passwords


    There are a few advantages to using shadow passwords instead of using /etc/passwd.
    One is that encrypted passwords are not stored in a location where just one can
    read them. The /etc/shadow file contains the encrypted passwords for users and
    is readable by root. Thus, only processes running as root can access the passwords.
    Another advantage is that /etc/shadow stores more than just passwords. It can
    also store data, such as the last time a user changed or her password. To maintain
    a good security level, you should have users change their passwords at least once
    every six months or so, or immediately if there is the possibility that the password
    was compromised.


    The disadvantage of using shadow passwords is rather large—most Linux programs
    assume you''re not using them. This can cause a major headache while compiling
    programs. Also, many installations do not give shadow passwords by default, meaning
    that you''ll have to put it in post-installation.


    # 3.4 Interaction with Users


    This section is for the human side of interaction. The way you interact with your
    users determines how they will interact with you. The first thing to remember
    is that users will probably not know as much about Linux as you do. They may need
    simple concepts or programs explained to them. Giving them a lot of low-level
    gibberish makes you look cool, but it probably won''t answer the user''s questions.


    As an example, you could say, sendmail is thinking your mailhost is foo when it
    should be bar, so I''ll have to go the /etc/aliases file on the NIS server to
    make it point to the right server." Or you could say "The mail isn''t in the right
    location. I will try and move it." If you absolutely nothing about computers,
    which would make you feel better? Don''t your'
