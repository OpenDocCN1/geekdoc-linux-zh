    the startup scripts can perform a filesystem check (fsck) to verify the integrity
    of the filesystem. If the fsck succeeds, the root partition is mounted read-write
    and normal boot continues. If there is a problem with fsck, the partition remains
    in read-only mode


    ¹ Assuming, of course, all the drivers that each system needs are installed.'
