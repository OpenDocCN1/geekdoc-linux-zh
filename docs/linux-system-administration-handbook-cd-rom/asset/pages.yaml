    # 16.8 Amusements and Games


    xpat


    For those of you who want just a simple game, xpat may be for you. It’s a collection
    of solitaire games (including the classic “solitaire” and “freeceelle” games that
    are popular on other operating systems).


    # Quake/Quake II


    It’s not hard to ignore these popular games (and their predecessor—Doom and Doom
    II). Quake and Quake II are available for Linux and provide all three display
    types for playing: X11, SVGAlib, and 3Dfx. The X11 interface brings Quake up in
    a window and allows you to play with other applications at the same time. The
    SVGAlib allows for a full-screen play but requires root access and exclusive use
    of the screen and keyboard. The 3Dfx version (GLquake) uses the Mesa GL library
    and a 3Dfx-based 3D card to provide'
  merge: -1
