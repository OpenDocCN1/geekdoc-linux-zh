  md: '# NetNews 10


    # Installing the INN program on your Linux machine.


    Usenet News is an internationally distributed discussion system which supports
    many different topic forums called newsgroups.


    Almost all topics imaginable are covered within the Usenet spectrum, and new newsgroups
    are added every day to keep up with popular demand. Usenet can be useful for research,
