- pgno: 40
  md: '# 2.7 Keeping a PC Safe from Reboots


    Plus, the fun with users hitting the power switch or reset button is always a
    factor. Running any kind of program remotely on a publicly accessible system is
    not a good idea, as the system can go down at any time. Here are a few suggestions
    for keeping a publicly available Linux machine for X86 safe.


    +   1. Protect the Basic Input/Output System (BIOS). This is the first thing you
    need to do, as many of the other protections depend on it. Pass-word protect the
    BIOS. Most modern ones will allow this. Also be sure that no one can open the
    case. Locks are available for many cases. In the event that you forget the password,
    you can disconnect the on-board battery or make a jumper connection on the motherboard
    and the BIOS will be set to default values.


    +   2. Prevent booting from the floppy drive. Many BIOSes allow you to specify
    that only the hard drive can be booted first, forcing the computer to go into
    Linux or another OS on boot without checking the floppy drive. This will not only
    prevent booting into DOS but also prevent a boot-sector virus or two from infecting
    the hard drive.


    +   3. Use Linux only. Booting into DOS or Windows can cause trouble, especially
    if they intend to cause harm to the computer. Booting into Linux will minimize
    this risk, since they cannot run any DOS programs.


    +   4. Don''t use LILO unless you have to. LILO can boot off another device if
    told to (and if you have a Linux boot disk). Putting the Linux kernel on the MBR
    of the first hard drive can help prevent other OSes from being loaded inadvertently.


    +   5. If necessary, disconnect the reset and power switches. This may force you
    to have people nearby who can power-cycle in the event of a crash.


    +   6. Don''t give out the root password. This goes without saying, but just in
    case . . I said it.


    +   7. On guard. These steps will not make your computer bulletproof should help
    prevent major damage to Linux systems.


    +   8. Disable the CTRL-ALT-DELETE in /etc/inittab. The line you''ll want to look
    for is probably similar to this:


    ```

    ca::ctrlaltdel:/sbin/shutdown -t3 -r now

    ```


    > If this is the case, you should also take DOSEMU off the Linux system.'
  merge: -1
  img_proc: true
