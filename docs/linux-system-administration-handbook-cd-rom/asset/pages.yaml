- pgno: 215
  md: '# Chapter 14 • Programming Languages


    Tcl by itself is actually not a particularly good scripting language. What it
    is designed for is "gluing" together other languages and programs. It is arguably
    the most extensible language listed here with the possible exception of Python.


    Recently, Sun''s Research labs and Tcl/Tk have adopted each other and are continuing
    development under the name Sunscript (this is the name of the research group;
    Tcl and Tk will retain their names).


    The new release, version 8, promises an unprecedented level of native look and
    feel for Tk across X, macOS, and Windows. This should make it very popular for
    building cross-platform GUIs. Those familiar with Tcl and Tk may recall the last
    full releases of them were 7.6 and 4.2, respectively, and wonder what happened
    to versions 5, 6, and 7 of Tcl. Sun has synchronized the version numbers and apparently
    plans to release subsequent concurrently.


    Because of Tcl''s popularity, it has interfaces to several databases (MySQL, mSQL,
    Sybase) and even a Nestle plug-in. Additionally, Tcl is as of 7.6, year 2000 compliant.
    The Sunscript group is working on various projects and applications for Tcl/Tk
    programming, including a commercial grade Tk GUI builder, an on-the-fly compiler,
    and maintenance of the current, native look-and-feel ports to macOS and Windows.


    Tcl''s extensibility allows for several extensions to both it and Tk. Extended
    Tcl (Tcl) provides additional functionality with the idea of creating a more stand-alone
    scripting language. ObjTcl is just what you might guess it is—a Tcl extension
    that allows for the use of object-oriented programming techniques within Tcl.
    Tis is a set of extensions for Tk written in Tk. TkPerl is an interface to Tk
    for Perl.


    One of the most useful Tcl extensions is Expect. It is a tool for interacting
    with other command-line driven programs which require user interaction. Thus it
    is possible to automate any number of tasks which might otherwise require a much
    more complicated solution for automation.


    # 14.8 SQL


    The Structured Query Language (SQL) is the language used to talk to relational
    databases. In reality, it is a set of standards to which DBMS vendors add their
    own extensions. Because implementations of SQL differ so much, we didn''t include
    a link for SQL; instead, we suggest you consult the documentation for your particular
    DBMS flavor.'
