- pgno: 60
  md: '# # Networking 5 with Linux


    Let your Linux box connect to other machines using PPP and Ethernet.


    One of the biggest benefits of Linux and UNIX is the built-in TCP/IP networking.
    This networking gives you E-mail, remote connections, and World Wide Web (WWW)
    access.


    In order to connect your machine to the network, you''ll need either an Ethernet
    card or a modem and a PPP provider.¹ Once this is done, you''ll have to reconfigure
    the Linux kernel to take advantage of the networking hardware. There are more
    networking options available in Linux than just those for the Ethernet card and
    Point to Point Protocol (PPP), but these are the two most common methods. For
    example, you could use PLIP (Parallel Line IP) or ATM or Frame Relay or AX.25.


    ¹This can be your Internet Service Provider (ISP), employer, or university.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# 5.1 TCP/IP


    The Transmission Control Protocol / Internet Protocol (TCP/IP) is the way that
    UNIX machines talk to each other. This is also the primary way of connecting to
    and using the Internet.² on a 32-bit number. The entire TCP/IP world (as it’s
    defined right now, anyway) allows for about four billion hosts³ to be on the Internet
    and talking to each other. In order for us to figure this out, these 32-bit numbers
    are referenced by four-bit bytes, also known as an IP address, for example, 192.33.4.10.
    For the sanity of the human race, these IP addresses can also be referenced as
    names (ns.psi.net) to make it easier for us to use. Note that these two names
    are not the same. Felix prefers using names, and we prefer using names. The middle
    ground comes in the form of DNS (Domain Name Service) which allows for mapping
    IP addresses to domain names, and vice versa.


    DNS works with a root name server, located in various parts of the world. When
    a user has their Web browser point to www.wayga.net, the machine asks the local
    DNS server to map that to an IP address. The local DNS server first looks at the
    root name servers. This root name knows that the nameserver for the wayga.net
    domain is 208.197.103.125. The DNS server connects to 208.197.103.125 and requests
    the IP address for www.wayga.net. The DNS server at 208.197.103.125 responds by
    saying that www.wayga.net IP address is 208.197.103.125. The local DNS server
    stores that IP address in its cache in it needed again and then provides IP address
    to the user application. The user application completes the connection and up
    pops the Web page. The DNS servers really do more than this and provide for the
    first pass at mail routing, aliases for machine names, reverse DNS, and even give
    basic system and location information.


    At an application or system level, TCP/IP has over 65,000 ports available for
    connecting. This allows for FTP, telnet, E-mail, WWW, DNS, and hundreds of other
    functions to happen all at the same time. When a Web browser connects to a server,
    Linux opens one of those used ports and makes a


    > ²Coincidence, or conspiracy? You decide.


    > ³There are a few hundred IP addresses that aren’t used because they’re broadcast
    or reserved numbers. Don’t worry if you think we’re running out of IP addresses
    too quickly. IPv6 is 128-bit IP addresses (that’s a 39-digit number for those
    of you without calculators).'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# 5.1 TCP/IP


    nection to the server. The server monitors one specific port (port 80 for WWW),
    sees a connection request, opens an unused port on its side, and then tells the
    client what port is available for connection. Other important TCP/IP ports include
    port 25 (E-mail), port 23 (telnet), and ports 20 and 21 (FTP). A list of the known
    ports and their uses is kept in the /etc/services file. Note that for security
    reasons, ports lower than 1024 can be opened by root only. This is the main Web
    server has to run as root, but its clients can run as another user.


    TCP/IP has two main connection methods that would probably run into: UDP (User
    Datagram Protocol) and TCP (Telnet Control Protocol). UDP is a connectionless
    protocol. The packets are usually small, and interaction between the client and
    server really consists of a number of openings and connections of network connections.
    UDP is a faster and less resource-intensive than TCP but does not guarantee transmission
    of a packet. NFS is a program that uses UDP. TCP is a connection-based protocol.
    The client to the server, the port is opened, and the connection begins. When
    the connection closes, it should be because both programs have finished their
    need for the network. TCP does guarantee delivery, and most protocols (Telnet,
    HTTP, SMTP, etc.) use TCP, as the connections may be longer in time than UDP connections.


    # Ethernet


    Ethernet was developed in the 1970s as a broadcast-style network. In the commonly
    used coax network, Ethernet cable was run in one long cable, and each end terminated
    with a 50-ohm resistor. Each machine that was on the Ethernet network hooked into
    this cable using a tap. In order for machines to identify themselves, each Ethernet
    adapter has a unique address (Media Access Connector or MAC address) assigned
    to it by the Ethernet adapter manufacturer. When an Ethernet adapter wants to
    talk to another Ethernet adapter, it sends a message containing its own MAC address,
    as well as the receiving MAC address down the entire Ethernet cable. If the receiving
    MAC address is on that run, collisions occur when two Ethernet adapters try to
    transmit at the same time. If this happens, both adapters stop transmission, wait
    a random amount of time, and retransmit. Having too many collisions indicates
    a network that has very heavy traffic and is running inefficient. A link that
    has a high number of collisions should be broken up into two or more separate
    Ethernet runs.


    Each Ethernet Packet has To From Ethernet addresses (see Figure 5–1), along with
    the IP to and from addresses, followed by the data and,'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Chapter 5 • Networking with Linux


    | Eth To | Eth From | IP To | IP From | Data | CRC |

    | --- | --- | --- | --- | --- | --- |


    **Figure 5–1** Simple view of an Ethernet packet.


    finally, some error checking data to verify the packet arrive complete. A typical
    Ethernet packet can be no larger than 1514 bytes. IPv4 takes up 40 bytes, and
    the Ethernet framing takes up another 18 bytes, leaving a maximum of 1456 bytes
    of data.


    Even though all the other Ethernet adapters see that message, they do not answer
    or respond. The only message that all Ethernet adapters should receive is an Ethernet
    broadcast. Network monitors take advantage of this feature to give an overall
    view of that particular run.


    In order for a packet (say an IP packet) to get across a network to another Ethernet
    run, a router is used. The router doesn''t look at the Ethernet header but looks
    at the protocol being used. If the router knows that a particular packet needs
    to be forwarded to another network, it forwards the packet.


    What allows Linux (and TCP/IP) to make connections between an Ethernet address
    and an IP address is the Address Resolution Protocol (ARP) cache. When the Linux
    machine starts talking on an Ethernet network, it starts asking (via ARP) what
    the MAC addresses for other machines on the subnet are. Here''s how it works.


    Linux first sends an Ethernet broadcast asking for a mapping from an IP address
    to a MAC address. The receiving end with that IP address responds with an ARP,
    giving the IP address and its MAC address. Linux then stores that MAC address
    in a cache for future use. The cache times out now and then, so this may happen
    several times a day. Don''t worry, though—there are plenty of 10 Mbps for everyone
    on the network. If a packet has to go through a router to somewhere else, Linux
    addresses the Ethernet packet to the router (or gateway), and the router then
    picks it up and forwards it to another network.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# 5.1 TCP/IP


    In a reverse situation, the BOOTP protocol involves a Reverse ARP (RARP) that
    announces its MAC address, asking which IP address to use. For diskless machines,
    or even Windows machines using Dynamic Host Configuration Protocol (DHCP), this
    is the way that these machines themselves configured. A machine that has RARP
    or DHCP running responds with the IP address and other information (the gateway
    and nameserver for example).


    Even though the Ethernet protocol is a standard, there are three main ways of
    actually implementing the physical layer. Thicknet is a 15-pin connection with
    very heavy gauge wire that is no longer in use. The best thing you can do with
    a thicknet connection is attach a transceiver on it to convert it to another physical
    layer. Thicknet or coax, runs one long wire which all the Ethernet adapters adding
    taps or T-connectors along the wire to connect. Coax is very inexpensive to implement,
    but a wiring problem along the wire can cause failure of the entire network. Coax
    also requires termination on both ends to keep the Ethernet signals from reflecting
    and causing problems. With the large number of wires and connectors that can be
    on an Ethernet run, your chances of failure for a large-scale installation increase.
    The last, and preferable, setup is RJ-45, also known as 10BaseT. It costs more,
    since you have to buy a hub, and is harder to implement, but the only of of failure
    of a hub would cause more than one person to work trouble at the same time. If
    a wire were to disconnect, no other users would be affected. The RJ-45 connection
    also has the capability of running at 100 Mbps instead of the regular 10 Mbps,
    and most new cabling installations use Category 5 (Cat 5) cabling which is required
    for 100 Mbps. Category 3 (Cat 3) is suitable for 10 Mbps.


    # Connecting to an Ethernet Network


    To get yourself hooked into an Ethernet network, get yourself an Ethernet card.
    Most should work, but you may want to check out the Ethernet-HOWTO for a list
    of cards. For the most part, if it''s from a major provider like 3Com, there is
    probably support for that card. Install the card in your machine and reboot. If
    the kernel recognizes your card, then you''re set for


    > I lied a bit. Thicknet provides for electrical isolation in areas where you
    might have a ground domain problem, for example, going between different floors
    in a multistory building. 10BaseT hubs have this capability as well.


    > Unless, of course, you are the disconnected user.'
