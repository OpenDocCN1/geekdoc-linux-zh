- pgno: 66
  md: '# 5.1 TCP/IP


    lems with most other programs, including X. You can add the Ethernet interface
    and give the IP address and netmask. Don''t turn on the “Configure Interface with
    BOOTP,” but you can turn on the “Activate Interface at boot time.” BOOTP is a
    protocol intended to dynamically assign IP addresses at boot time. The interface
    should be configured at boot time, so that once the machine starts, you can use
    the Ethernet.


    # PPP


    The Point-to-Point Protocol (PPP) is the way to connect to the Internet or a TCP/IP
    network via a dial-up line. PPP is designed to work between two machines and two
    machines only. This makes it ideal for dial-up applications, or even connecting
    remote locations via a leased line. Many 56-Kb links use PPP to carry IP traffic
    over the line.


    PPP depends on one machine running pppd server on one end of the phone line, and
    a ppp client running on the modem dialing up (yours). Unlike Ethernet, you have
    to configure the software differently, depending on whether you are the client
    or the server.


    PPP doesn''t have the overhead of Ethernet, since no MAC addresses are used. Also,
    some compression is added to the IP frames to boost the amount of data that can
    be sent in a packet.


    Like Ethernet, PPP can carry more than just IP traffic and can route IPX, Appletalk,
    and DECNET along with IP over a PPP link. Linux does not really take advantage
    of this functionality, but not many need it.


    # PPP Client


    Setting up a PPP client requires a modem, phone line, PPP server at some other
    phone number, and PPP support compiled into the kernel. Check the dmesg command
    to see if PPP support has been compiled in it. You can also check /lib/modules/
    directory for ppp.o and see if it was compiled as a module. If support is not
    compiled in it, recompile the kernel and reboot using the new kernel.


    The quick way of verifying that a PPP connection works is by doing something similar
    to the following:


    ```

    pppd connect -v "*" ATDTPHONE CONNECT "*" login: login word: pass-word: ''\''

    /dev/cual 38400 debug crtscts modem defaultroute

    ```'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'The phone, login and passwd are assigned to you by whomever providing the PPP
    account. Also change the /dev/cu1 to be where your modem is. Remember that /dev/cu1
    under Linux is the same as COM2 under DOS and Windows. The chat command is used
    to dial the modem, and provide the login and password information. Once returns
    success (that is, once it makes a successful connection), PPP takes over the line
    and starts a connection. The server and client negotiate settings like Maximum
    Transmit Unit (MTU), compression, and a few other settings. This will take a few
    seconds, but once it''s done you should be able to use /sbin/ifconfig command
    to examine the network connections. If you see ppp0 listed, you''re ready to go.


    If you want to use DNS, be sure to enter a valid DNS server that you can reach
    in the /etc/resolv.conf file. Be sure to add it in the following:


    ```

    domain wayga.net

    nameserver 192.32.4.10

    ```


    This sets the domain and the default nameserver. If you know of nameservers, you
    can enter them here.


    All this configuration can be filled out in scripts using the RedHat Network Configuration
    Manager. You merely have to enter the phone number, line speed, modem, login,
    and password. All the rest of the scripts are done for you.


    # PPP Server


    In order to get the PPP server software running (which, coincidentally, is the
    same software as the PPP client), you must have IP forwarding and PPP turned on.
    This allows Linux to act as an ARP proxy and answer ARP requests for an Ethernet
    address. If you''re using a multiport serial card, you should have the drivers
    for that in the kernel as well.


    Once this is completed, assign a bank of IP addresses that are not in use and
    will not be in use. These will be the addresses used for connections, and there
    should be at least as many available as you have phone lines. Don''t want to run
    out of IP addresses, eh?


    Once this is done, create new accounts for each user that will be connecting via
    PPP. Many places use the name of the user with a P prepended to it. If my normal
    dial-in name were “mark,” then my PPP dialup would be “Pmark” to signify a PPP
    connection. Have the user information in /etc/passwd look like this:


    ```

    Pmark:#56njvc893h:500:500:PPP user:/home/mark:/usr/local/bin/ppppd

    ```'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# 5.2 INETD


    In the home directory of that user, create a .ppprc file and add the following:


    +   -detach

    modem

    crtsck

    lock

    192.55.123.100:192.55.123.111

    proxyarp


    This gives PPP some initial settings to work with. The -detach says to not detach
    from the console. The modem says to monitor the CD (Carrier Detect) line and terminate
    if CD drops. The lock will lock the device, preventing anyone else from using
    serial port. The two IP addresses are of the server (waiting for the call) followed
    by a colon and the IP address to assign to the client when it dials in. The proxy
    allows the server to put the PPP client in its ARP cache and respond to packets
    that are exposed to the client.


    Once this has been completed, set up to monitor the serial ports, and dial in
    to sure the static IP addresses works. The pppstats command can give a running
    total of packets in and out for the line.


    If you choose to use dynamic IP addresses instead of static IP''s to save on IP
    addresses, create a /etc/ppp/options.ttyXX for each tty file that is attached
    to a modem. Replace the XX with the name of the serial port, for example, /etc/ppp/options.tty50
    for /dev/tty50. The content of the options.ttyXX file is the same as the .ppprc
    file listed above.


    If your PPP clients are going to be Windows 95 machines and you''re using the
    default "Dialup Networking" you''ll need to add the scripting tool to Windows
    95. It''s included in the CD-ROM as \Admin\Apptools\Dcript. A slightly better
    version is included in the Windows 95 Plus! pack.


    # 5.2 INETD


    The inetd daemon is used to start programs automatically when a request comes
    in on a specific TCP/IP port. What happens inetd monitors all the ports that are
    in its configuration file, and when a request comes in, it starts the application
    and returns to watching ports. There are two files that inetd needs to work: the
    /etc/services and /etc/inetd.conf files.


    > You could presumably have the home directory for Pmark and mark in the same
    location, but be sure to have the .ppprc file unwritable by anyone but root.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# /etc/services


    The /etc/services file contains information about a TCP/IP port number, and a
    name for the specified port which is later used in the /etc/inetd.conf file. It
    is not often that you''ll need to add entries to this, but some programs may have
    you here. Here''s a portion of /etc/services file:


    ```

    chargen      19/tcp          ttytst source

    chargen      19/udp          ttytst source

    ftp-data      20/tcp

    ftp           21/tcp

    telnet        23/tcp

    smtp          25/tcp          mail

    time          37/tcp          timserver

    time          37/udp          timserver

    lrip           39/udp          resource        # resource location

    name          42/udp          nameserver

    whois         43/tcp          nickname       # usually to sri-nic

    domain        53/tcp

    domain        53/udp          # deprecated

    mtp           57/tcp

    bootps        67/udp          # bootp server

    bootpc        68/udp          # bootp client

    tftp           69/udp

    gopher        70/tcp          # gopher server

    ```


    The first entry in the line is the service name. This is followed by the number,
    and the protocol (usually TCP or UDP) and it is then followed by any aliases.
    As you can see above, the port E-mail calls is in called the smtp port and it
    is located on port 25. Its alias is mail, so I could run a command like:


    ```

    [mark@wayga-$] telnet localhost smtp

    Trying 127.0.0.1...

    Connected to localhost.

    Escape character is ''^''

    220 wayga.ratatosk.org SMTP Sendmail 8.8.5/8.8.5; Mon, 1 Sep 1997

    18:54:30 -040

    ```


    and that telnet command would connect me to TCP/IP port 25 (where send-mail is
    currently running).'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# /etc/inetd.conf


    The /etc/inetd.conf file takes the port information in the /etc/services file
    and tells inetd what ports to monitor. Here''s a portion of a sample inetd.conf
    file:


    ```

    # These are standard services.

    #

    ftp stream tcp nowait root /usr/sbin/tcpd in.ftpd -l -a

    telnet stream tcp nowait root /usr/sbin/tcpd in.telnetd

    gopher stream tcp nowait root /usr/sbin/tcpd gn

    ```


    # do not uncomment smtp unless *really* know what you are

    # doing.

    # smtp is handled by the sendmail daemon, not smtpd. It does NOT

    # run from here, it is started at boot time from /etc/rc.d/#rc.

    ##smtp stream tcp nowait root /usr/bin/smtpd smtpd

    #nntp stream tcp nowait root /usr/sbin/tcpd in.inntpd


    The entries in this file are as follows:


    +   - entry from /etc/services for what port to monitor.

    - stream or dgram (tcp is stream, udp is dgram).

    - protocol (tcp or udp).

    - options (wait or nowait). Wait says to wait until the program has finished or
    returned before returning to watching the port. The nowait option says not to
    wait and return to monitoring the port. If nowait is selected, only one instance
    of a program will run at a time

    - user to run as— is usually root.

    - path of the program.

    - name of the program, and any options you''ll want to add.


    In the example from /etc/services, we made a connection to the mail port, but
    the inetd.conf example shows that smtp is not monitored. What happened? For some
    high-throughput programs (httpd and sendmail are prime examples), you don''t want
    to have a program constantly restarting it takes a lot of time for a program to
    start initially. But, for a program that is already running to fork or spawn a
    new process, the overhead is much less. Thus, it''s better for programs like this
    to be constantly running and taking care of the connections itself.


    Programs like telnetd and fptpd do not need a lot of startup time, so inetd can
    handle starting up new copies as it needs.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# 5.3 Network Applications


    Now that the network is set up, what are you going to do with it? Most of the
    standard topics (Web, ftp, E-mail) have already been covered, but the rest of
    this chapter will cover applications that work across the network for the benefit
    of everyone. DNS (the nameserver) and NFS (network file server) are of two such
    applications.


    # DNS


    The nameserver is the program that matches an IP address (208.197.103.125) to
    a hostname (wayga.net). It also provides for matching in the opposite direction
    as well, informing you that the machine that has the address 208.197.103.125 is
    called wayga.net. Since one of the jobs of a nameserver is to look up and cache
    DNS requests from client machines, it can be used at one end of a slow link (between
    two offices perhaps) and reduce the amount of DNS traffic across the link. It
    also has provisions for forwarding E-mail addressed from one host to another and
    can provide backups for particular hosts in case one Server is busy while another
    is idle.


    In any instance where you are connecting to a TCP/IP network, you''ll want to
    use DNS⁸ for resolution. The setup of this is easily done by putting a few lines
    in your /etc/resol.conf file:


    ```

    domain wayga.net

    ameserver 192.33.4.10

    ```


    Modify the wayga.net to be your domain name and change the IP address to be the
    nameserver provided to you by your ISP. This IP address is an actual nameserver,
    and if you don''t know your local nameserver, this IP address should work in a
    pinch to get you up and running. You can also put multiple nameserver entries
    in here, and it will search in order until it makes a connection to a DNS server⁹.


    If you plan on running named (the DNS server software) locally, then you should
    change the IP address to read 127.0.0.1. Be sure to have a few other IP addresses
    in there in case named goes down.


    > ⁸Yes, even if you''re using NIS.


    > ⁹Note that the search stops after the response from the first DNS server. If
    the first DNS server replies "host not found," the search stops there.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# 5.3 Network Applications


    Should You Be a DNS Server?


    You should use the DNS server only in the following cases:


    +   1. You own a domain and want to control the DNS

    2. You run a large network over a slow link

    3. You have no connection to the Internet


    For item 1, many ISPs will offer to handle your DNS serving for you, but if you''re
    in an environment where machines change frequently, it may be easier to do it
    yourself than wait for the ISP to update their tables. For item 2, named can act
    as a cache to store frequently used hosts, and this will reduce some of the traffic.
    In item 3...well if there''s no other DNS host on your network, someone should
    do it, and it may be as well. If you don''t match any of these, you probably don''t
    need a DNS server running.


    If you expect to be the primary or secondary DNS server to the outside world (i.e.,
    the Internet), you''ll have to make sure the DNS host is registered with InterNIC
    or another top-level domain organization. See the chapter on interacting with
    Internet agencies for information on getting this up.


    Once you''re ready to start serving DNS, you''ll have to set things up your machine
    to do DNS serving.


    # named.boot


    The named.boot file contains configuration information to give to named once it
    starts. It really tells named three things:


    +   1. What directory the configuration files are stored in

    2. What primary DNS services it provides

    3. What reverse DNS services it provides


    There are a few other functions that named does, but it''s a bit outside the scope
    of this chapter. A sample configuration file looks like this:


    ```

    directory /var/named

    cache named.ca

    primary wayga.net named.wayga

    primary a-muse.org named.a-muse

    primary 0.0.127.in-addr.arpa named.local

    ```'
