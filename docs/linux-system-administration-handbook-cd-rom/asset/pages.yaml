  md: '# Chapter 1 • Introduction


    Linux just as fast as applications for NT or Windows 95. Many commercial applications
    (Netscape, Word Perfect, Applix, Motif, Flagship) are already available for Linux,
    with more being added.


    # 1.5 Is Linux SYSV or BSD?


    The simple answer to this is “Yes.” Linux takes the best of System Five (SYSV)
    (like startup files) and the best of Berkley System Distribution (BSD) (ps aux,
    getty) and combines them. As a downside, some features of each are missing (like
    streams) and you should make yourself aware of what features of each are in Linux.


    # 1.6 Support


    Contrary to popular belief, commercial support for Linux is available. While there
    is seldom a need for it, companies such as RedHat have telephone and E-mail support
    for their Linux distribution. Caldera is distributing a “MS Windows killer” in
    their OpenLinux product. Support contracts and shrink-wrapped packages are available.
    With the number of users that have Linux on their machines, devices from the S3-based
    video cards to the Mattel PowerGlove have drivers available, and everything in
    between. The support is often somewhat better than from other operating systems,
    as the author of a particular driver is sometimes available via E-mail and is
    often to help if your driver is not behaving properly. Some hardware drivers have
    released patches within 24 hours to users.


    # 1.7 What You Need


    What do you need in order to run Linux? It varies greatly depending on what you
    want to do with it. If you’re going to use Linux to dial up the Internet, a low-end
    486 with 8 Mb of memory will suffice just fine. If you want to have a dial-in
    pool to give access to traveling engineers or salespeople, a 100-Mhz 486 is great.
    If you want a killer development system or something to write a book, a Pentium
    or K6 will do just fine.


    What’s that? A spare SparcStation 1 with nothing to do? Turn it into a Linux samba
    server. Let the people running Windows 3.1, 95, or NT access Network File System
    (NFS) partitions without having all that messy NFS'
  merge: -1
