    # Log Rotation and Reporting


    While the expiration process is taking place, news.daily logs all of the output
    to a file. When the expiration is done, news.daily uses the “scanlogs” program
    and its supporting scripts to parse all of the log files that the server has built
    up for the past day (or since the logs were last rotated). Very detailed information
    about the number of articles accepted and transmitted and any errors that occurred
    are printed up and added to the expire data and mailed off in a report to the
    newsmaster. As its final step, the news.daily process rotates the old logs into
    a separate directory and then throttles or unpauses the server so connections
    are once again accepted.


