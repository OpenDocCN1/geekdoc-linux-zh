- pgno: 305
  md: '# Chapter 20 • Backing Up Your Data


    0Data striping—This doesn''t actually provide any protection against data loss
    but does enhance performance. Requires a controller that supports synchronized
    disks; none are available for Linux.


    1Disk mirroring—A second set of disks are used to provide a complete copy of data.
    An expensive option, since you need twice as many disks.


    2Level 0 with a check disk for storing error correction information. Poor performance
    has made this option unpopular.


    3Level 0 with a separate disk for byte-level parity information to reconstruct
    lost data. If the parity disk is lost, you lose all data integrity. Synchronized
    disks help boost performance despite the bottleneck of the single parity disk.


    4Level 3 with block level parity information stored on a separate disk. Better
    performance but worse performance than level 3. Since synchronized disks aren''t
    used, it can be implemented in software.


    5Level 4 with the parity information spread over the disks as well. Higher performance
    since a separate parity disk is no longer a potential bottleneck. Write performance
    is still not as good as level 3.


    To implement RAID on your Linux box, you need a kernel patch available from http://www.linuxhq.com/patch/20-p0632.html
    and a 2.0.30 kernel. The patch is still in beta and supports RAID levels 1, 4,
    and 5.


    Separately available, raidtools-0.3 can be used to create or repair a set of RAID
    disks.


    # 20.7 Summary


    A variety of backup data and restore tools were discussed, ranging from simple
    ones that ship with every Linux distribution to commercial ones with enhanced
    functionality and interfaces.


    In general, for sites where short amounts of down time is acceptable, the built-in
    tools are fine. For ''hot'' backups, you will probably have to resort to commercial
    means.'
