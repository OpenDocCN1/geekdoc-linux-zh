    MY_ETH0=192.168.1.1\nMY_NET=192.168.1.0\nMY_STATIC=11.222.333.444\n\necho -n \"\
    Starting firewall accounting rules:\"\n\n# Kill the old rules\nipfwadm -A -f\n\
    # These are the system rules!!  They log all traffic as a\n# reference point\n\
    ipfwadm -A in -i -S $MY_NET/24 -D 0.0.0.0/0\nipfwadm -A out -i -S 0.0.0.0/0 -D\
    \ $MY_NET/24\n\nipfwadm -A in -i -S $MY_NET/24 -D $MY_ETH0/32\nipfwadm -A out\
    \ -i -S $MY_ETH0/32 -D $MY_NET/24\n\n# These are to to log traffic to individual\
    \ machines named\n#in FirewallAcctList... its just a list of machine names or\n\
    #IPs\nfor i in `$(cat /etc/FirewallAcctList)`; do\n\techo -n \"$i\"\n\tipfwadm\
    \ -A in -i -S $i/32 -D 0.0.0.0/0\n\tipfwadm -A out -i -S 0.0.0.0/0 -D $i/32\n\t\
    ipfwadm -A in -i -S $i/32 -D $MY_ETH0/32\n\nipfwadm -A out -i -S $MY_ETH0/32 -D\
    \ $MY_NET/24\ndone\n\necho \"done\"\n```"
