- pgno: 106
  md: '# E-mail 7


    # Sendmail, mailing lists, E-mail clients, and POP/IMAP (remote connections).


    This chapter shows how to set up sendmail, set up simple mailing lists for customers,
    clients, or groups of people, review some of the E-mail clients available, and
    set up remote connections using POP (Post Office Protocol) and IMAP(Internet Message
    Access Protocol) mail standards.


    E-mail (electronic mail) was one of the first methods for communicating over what
    is now the Internet. E-mail allowed short messages to route across various machines.
    In those days (1987) you often had to manually specify all the machines (or hops)
    an E-mail message would have to route through to get to the end host. With TCP/IP
    as the communication method, things are a bit smarter in that you don''t need
    to know how to get to the end host—as long as some machine along the way knows
    how to route the E-mail for you.

    as aside, the technical name for the E-mail that get on the Internet is known
    as Simple Mail Transfer Protocol (SMTP). There are a few other protocols that
    work with SMTP, such as POP and IMAP, but we''ll get to those later. You can find
    more information about SMTP in RFC 821.'
  merge: -1
  img_proc: true
