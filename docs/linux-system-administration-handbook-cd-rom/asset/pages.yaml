    UP BROADCAST RUNNING MULTICAST MTU:1500 Metric:1

    RX packets:0 errors:0 dropped:0 overruns:0

    TX packets:26 errors:0 dropped:0 overruns:0

    Interrupt:5 Base address:0x300

    ```'
