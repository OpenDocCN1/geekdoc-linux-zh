- pgno: 419
  md: '# LINUX SYSTEM ADMINISTRATION HANDBOOK


    # MARK F. KOMARINSKI • CARY COLLET


    +   - Technical and practical explanations of every major system administration
    task


    More and more businesses are turning to Linux as a cost-effective, rock-solid
    solution for internal networks and Internet connectivity. This is the first book
    that systematically teaches Linux system administrators the real-world skills
    they will need to succeed. The Linux System Administration Handbook covers Linux
    networking, file service, E-mail, security, backups, print sharing, Web, FTP,
    NetNews, and much more. Get practical guidance on configuring hardware and peripherals,
    customizing the kernel, tuning Linux performance, and choosing among Linux distributions.
    Supercharge your productivity with the book''s extensive practical scripts and
    automation techniques!


    +   - Security, hardware configuration, file service, and more


    +   - Deploying Web services, NetNews, FTP, X Windows, Samba, and more


    There''s nothing ''academic'' in this comprehensive guide! Every page is full
    of practical advice by expert system administrators who work with Linux day every
    day-love it. So you will!


    +   - Managing Linux in heterogeneous networked environments


    # CALDERA OPENLINUX LITE ON CD-ROM!


