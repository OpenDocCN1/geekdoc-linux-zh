    # 17.3 Denial of Service Attacks


    Denial of service deals with the fact that a user may be doing valid things

    (such as pinging your host or sending E-mail) but doing it in a way that prevents
    you from getting things done. For example, a ping takes up at least 64

    bytes and sends one at least once a second. If a malicious cracker were to

    send pings that were 2K in size, it would flood a 2.8K modem link, making it

    not usable for downloading data, receiving E-mail, browsing the Web, or any-thing.
    The entire link is taken up responding to pings. Linux has some\protection against
    this, but any system is susceptible to this. Another similar

    attack involves SYN packets to a host. The machine opens a

    connection, waiting for more data. As more SYN packets come in, more con-'
