  md: '# 5.3 Network Applications


    # Other Important Options


    listen-on [port]


    This option specifies what IP address and/or port to listen to. The default port
    is 53. You can specify IP prefixes as well.


    listen-on 7777 { 208.197.103.200 };


    If no listen-on is specified, the server will listen on all port 53 on all interfaces.


    include


    This statement is used to include other files which contain valid configuration
    information.


    We''ve tried to cover the options you will most likely use. However, there are
    several potentially useful statements we haven''t covered. You should spend some
    time looking at the documentation which also includes some features which will
    be implemented in future releases.


    # nslookup


    The nslookup program interacts with the nameserver to give IP information about
    a host or domain. This program will also allow you to examine things like A, MX,
    or CNAME records. When run with an option of a hostname, nslookup will contact
    the local DNS host and return information on that host:


    ```

    [markk@wayga named]$ nslookup wayga.net

    Server: wayga.net

    Address: 208.197.103.125

    ```


    ```

    Name: wayga.net

    Address: 208.197.103.125

    ```


    ```

    [markk@wayga named]$

    ```


    When run without any options, it puts you in an interactive mode, allowing you
    to enter hosts, set the kinds of queries, list hosts within a domain, and so on.'
