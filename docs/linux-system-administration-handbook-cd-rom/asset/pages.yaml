    # D.4 Linux Allocated Devices


    Maintained by H. Peter Anvin <Peter.Anvin@linux.org>

    Last visited: May 29, 1995


    This list is the successor to Rick Miller''s Linux Device List, which stopped
    maintaining when he lost network access in 1993. It is a registry of allocated
    major device numbers, as well as the recommended /dev directory nodes for these
    devices.


    This list is available via FTP from ftp.yggdrasil.com in the directory /pub/device-list;
    filename devices, <format> where <format> is txt (ASCII), tex (LaTeX), dvi or
    ps (PostScript). In cases of discrepancy, the LaTeX version has priority.


    This document is included by reference to the Linux Filesystem Standard (FSSTND).
    The FSSTND is available via FTP from tsx-11.mit.edu in the directory /pub/linux/docs/linux-standards/fssnd.'
