  md: '# 21.4 UPS


    Until the last few years, few people thought of un-interruptible power supplies
    as peripherals for the reason that the computer and the UPS didn''t exchange information
    or take action on the state of one or the other. Now though, this is not the case.
    A few years ago Uninterruptible Power Supplies (UPSs) with serial ports started
    appearing, now with snazzy GUI front allow the battery and power level to be monitored
    and for actions to be set up based on the conditions reported. However, only commercial
    OSes have published the language used to communicate with their UPS, allowing
    others to write their own programs for interacting with them.


    There are two ways UPSs can be categorized: by how they perform their function
    of providing uninterrupted power, and by the level of interaction they have with
    the computer to which they are attached. The first has three types: stand-by,
    in-line, and line interactive.


    The first sits and waits for the power to drop below a certain level and then,
    usually in a matter of milliseconds, switches to providing power via its batteries.
    The second actually filters all power through itself. It can condition the power
    that it puts out and kick during brownouts. This method also provides half the
    wear and tear on the batteries, obviously shortening their lifetime.


    There are several programs, most of them with some sort of GUI for talking to
    your UPS. Most of them are also feature-poor when compared to their Microsoft
    Windows-based counterparts. To date, Best is the only vendor that supplies control
    software which can be compiled for Linux. Because of their popularity, a strong
    effort has been made to provide good controller software for use with them. Most
    of the other tools are fairly generic and can talk to UPSs in dumb mode.


    ```

    checkups.tar—From Best''s Web sites, this package will control their UPSs in dumb
    and a more advanced mode (not really a “smart” mode). It includes the source code
    which you will need to compile. In the dumb mode, the following alarms can be
    detected: High Ambient Temperature, Near Low Battery, Low AC Out, or User Test
    Alarm. You can also tell checkups to start a shutdown when it detects that it
    has a particular amount of power left.

    ```


    powerd-2.0—This is not the same powerd shipped with the System V init package.
    It differs in that it can be run in a master or slave mode, allow-'
