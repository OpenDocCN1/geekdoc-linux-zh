  md: '# Chapter 15 • Web Serving


    Because suEXEC can open some serious security holes, its security model imposes
    several additional restrictions. The target program must reside in the Apache
    /webspace/ and thus, the path to it cannot start with a/ or have back references
    (...). Obviously the target user and group must be above a minimum (typically
    100 or 500), which will prohibit execution as the root user or group. The target
    program cannot be set uid or gid and the final, non-trivial restrictions are that
    the directory containing the program to be executed and the program itself only
    be writable by the target user and belonging to the target.


    suEXEC comes in a separate C source file and accompanying header file. Before
    compiling suEXEC, the header file needs to be edited to reflect the particulars
    of your system. The following may need to be changed: HTTP_USER, typically nobody
    or maybe a "web" or "www" user; LOG_EXEC, the log file for suEXEC transactions;
    DOC_ROOT, the root of the Apache Web space; and SAFE_PATH environment variable
    for suEXEC. Then you need to compile suEXEC: gcc -o suexec suexec.c, then copy
    it to root, set the userID (chmod -o suexec), and copy it to its final destination.


    Apache must be recompiled to use the suEXEC wrapper. In the src/httpd.h file you
    will need to add or edit a line like:


    ```

    #define suEXEC_BIN "/usr/sbin/suex"

    ```


    To reflect where you installed the suexec, your new httpd, you should see this
    message:


    Configuring Apache for use with the suexec wrapper.


    To disable suEXEC, you can remove the binary, change its ownership from root,
    or unset the UID bit.


    User and Group directives in VirtualHost directives can be used to tell suEXEC
    the target user and group for executing CGI. Another way is for the target user
