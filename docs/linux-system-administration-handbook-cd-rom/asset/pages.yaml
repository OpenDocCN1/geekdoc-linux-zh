  md: '# 21.8 Summary


    We''ve tried to discuss a reasonably large list of hardware here, but there is
    no way for us to cover all of the hardware available for Linux. Similarly, there
    are dozens of ways each piece of hardware can be problematic. We discussed how
    to troubleshoot the most common stumbling blocks, but less common, more esoteric
    ones certainly exist.


    The best places for information on how to deal with problematic hardware are the
