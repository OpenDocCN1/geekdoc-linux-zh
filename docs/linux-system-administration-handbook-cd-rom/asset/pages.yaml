- pgno: 22
  md: '# 1 Introduction


    Get into Linux. The easy way.


    Linux is probably one of the fastest growing operating systems around. It has
    about 5 million worldwide users, and that number is growing each day. For something
    that started as an idea by a college student in Finland in 1991, that is pretty
    damn good.


    Linux is now used everywhere there is a need for a good, robust operating system.
    Companies run their businesses on Linux, but many may not know it. It is used
    for E-mail servers; WWW servers; to provide file and printer access for Microsoft
    and Apple machines; and even other UNIX machines.


    This is a guide to give you (the reader) as much knowledge as we (the authors)
    have attained in our years of Linux administration. The kinds of projects that
    administrators have to go through are varied, but they all have a common base—managing
    users, E-mail, the network, hardware, and making sure that you don''t mess up
    anything too badly while trying to make an improvement.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Oh No! Not Another Linux Book


    This is not just a Linux book. This is the Linux book. Anyone can write some theoretical
    book about the way networks should run, but how many of these authors are actually
    the administrators of networks? How many are stuck in the trenches, reading the
    cryptic menu pages to “printcap” while users are complaining about their printouts?
    We''ve been there, we are there, we will be there. We enjoy it.


    The proof of this exists throughout the book. While everyone else goes on IDE
    drives, we personally and professionally recognize the power of the small computer
    systems interface (SCSI) bus and use it in our systems. It''s more expensive and,
    at times, a pain to work with, but the benefits are enormous.


    Anyone can tell you how a program like samba is set up, but what happens in the
    real world where things aren’t quite the same as they are in the manual pages?


    # Linux Theory


    The UNIX theory is: “Do it your way.” But Linux is more than a chain of hamburgers.
    Linux allows you to not only choose what you want on your hamburger, but also
    what’s in it, how the cow is grown, what spices you add to the mixture, and how
    long you cook it. Linux gives you all the same abilities of commercial UNIX packages
    (such as Solaris or AIX) give, so much more.


    # Is It Really Free?


    Yes and no. The GNU’s not UNIX (GNU) Public Licence (which is how Linux is licensed)
    says that you can charge for a binary distribution, the source code must be either
    included or available for the cost of duplication. In the days of the Internet
    and CD-ROMs, the cost for duplicating is so low indeed.


    Note that this covers only the Linux kernel, and the GNU utilities included with
    many distributions. This does not prevent a company like Walnut Creek, WorkGroup
    Solutions, or RedHat from assembling all these programs, adding a few specials
    (installation and administration scripts, for example), producing a CD-ROM, and
    charging you $30 for it. The Linux kernel and source code are there. The source
    code to all the other GNU utilities'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# 1.4 Why Linux?


    is also available or pointers to the source code exist. Thus, these companies
    have met their end of the GNU licence. Many of these also sponsor Linux-related
    events or offer free CD-ROMs to software contributors.


    Companies like RedHat have a more expensive product, but they add things that
    may not be covered by the GNU Public License (GPL). For example, RedHat sells
    a copy of their distribution for three different architectures for $30. Or you
    can get a copy specifically for any of the three (Alpha, Sparc, and Intel) and
    get copies for $50 and commercial software, which as Metro, along with customer
    support–which the $30 version doesn''t offer. Companies like Caldera take this
    step further and have a full Linux system for Intel, complete with custom software
    to talk to NetWare networks, for about $100.


    # 1.4 Why Linux?


    So why would you (or your company) want to use Linux in a personal or business?
    The answer goes past the shortsighted “anti-Microsoft” response. Microsoft makes
    a fair product for a new user. But so does Apple. Linux gives you things that
    Windows 95 can only dream about:


    +   - Source code for the entire kernel.

    - Full configurability of the operating system.

    - Ability to turn features of the system on and off without rebooting.

    - Full 32-bit operating system. This is 64-bit for the Alpha processes, and by
    the time you read this, the Sun UltraSpace will probably be supported and 64-bit.

    - Access to the 25 years of software that makes up the UNIX world. This includes
    compilers, Web servers, editors, games, and Internet tools.


    An inexpensive Web server, Linux will beat NT hands down for performance on equivalent
    hardware. As a network server, a Linux machine hidden in the corner of an office
    can handle a small group or a large office with months between reboots (usually
    to either upgrade the kernel or add new hardware). With the emergence of Java¹
    as a truly portable language, applications such as Core’s Office For Java will
    bring commercial applications to


    > ¹Linux was one of the first operating systems to handle Java applications in
    the kernel.'
