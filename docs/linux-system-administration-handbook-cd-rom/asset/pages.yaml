- pgno: 350
  md: '# # Appendix B


    Documentation from Caldera


    # ## B.1 Introduction to OpenLinux


    Welcome to Caldera OpenLinux™, a complete multitasking, multi-user operating system
    for your organization. With OpenLinux, you get the power and reliability of a
    UNIX® operating system from a personal computer. If you''re new to OpenLinux,
    you should read this chapter to learn about Caldera''s product line and user rights.
    This chapter explains these topics:


    +   - OpenLinux product line

    - Getting information

    - A word about copyrights


    # ## B.2 OpenLinux Product Line


    The Caldera OpenLinux product line is a multitasking, multi-user operating system
    that gives you the power and reliability of UNIX® on a personal com-'
  merge: -1
  img_proc: true
- pgno: 351
  md: 'puter. OpenLinux is Caldera''s distribution of Linux technology. It includes
    the complete Linux operating system and this release includes the 2.0.29 kernel.
    Caldera provides a four-tier product line to meet users'' needs. The product line
    includes


    +   - OpenLinux Lite. This product only includes Caldera''s distribution of the
    Linux operating system.

    - OpenLinux Base. This product provides new Linux and UNIX users with a complete
    Linux operating system, including commercial components such as Netscape Navigator,
    CRiSPLiTE, and a graphical desktop.

    - OpenLinux Standard. This provides Internet and intranet options giving you full
    authoring, publishing, and browsing capabilities. (See "Components Included in
    Standard" for more.)

    - OpenLinux Deluxe. This product provides complete solutions for the workgroup
    and small office environments that need to utilize all systems.


    Caldera added "Open" to its product line (for example, OpenLinux) to emphasize
    that the operating system source code is open, so you can see exactly how the
    operating system works. That way, you can configure your system to operate as
    efficiently as possible.


    # Components Included in Standard


    In addition to Caldera''s easy installation, what makes Caldera''s OpenLinux technology
    unique among Linux distributions is its many other commercial components. These
    commercial components give your system the power and functionality to run a business.
    Here''s a listing of some of the components that accompany OpenLinux Standard.


    +   - Netscape FastTrack Server™. This powerful web server lets you manage information
    on the Internet and in your own intranet easily. FastTrack gives you industry-leading
    performance, flexibility, and security in an easy-to-use graphical environment.
    This web server supports SSL encryption, access control, and NSAPI-compatible
    plug-in modules to protect your information and extend the server''s functionality.

    - Novell NetWare® client and administrative utilities. NetWare lets you seamlessly
    view and copy files on NetWare volumes and print to NetWare printers without any
    additional software on your NetWare servers With'
  merge: -1
  img_proc: true
- pgno: 352
  md: '# B.3 Key Features of OpenLinux


    the administration utilities, you can provide complete NDS and bindery administration.
    For example, you can create and delete objects, view and set property values,
    and manage filesystem trustee assignments.


    +   - Netscape Navigator™3.01 Gold. The Navigator lets you browse the World Wide
    Web, author web pages, and view on-line help and other documentation.


    +   - CRISP-LiTE. This powerful program provides an intuitive interface for editing
    files from the desktop.


    +   - X Servers. OpenLinux includes two X servers: Metro-X and XFree86. These
    X servers let you easily configure a graphical interface on a variety of popular
    high-performance video cards.


    +   - OpenDOS™. This is a complete DOS operating system that you can use to run
    thousands of existing DOS programs. While running OpenLinux, you can access a
    DOS emulator and run programs.


    +   - Graphical desktop. A sophisticated desktop interface can be used to view
    and manage filesystems. For example, you can drag and drop files onto program
    icons to open the files. The desktop interface also lets you customize your workspace
    with icons and toolbars so you can quickly perform tasks with a click of the mouse.


    # B.3 Key Features of OpenLinux


    OpenLinux is a distribution of Linux using the 2.0.29 kernel, the features inherent
    in Linux are also found in Caldera''s OpenLinux. Here''s a list of some of the
    key features found in OpenLinux.


    +   - TCP/IP. Uses TCP/IP, the Internet protocol, for high-speed networking.


    +   - Menu-based Tools. Installs and configures OpenLinux easily with menu-based
    tools.


    +   - POSIX-based Environment. Uses a POSIX-based multi-user operating environment
    with complete Connectivity tools, traditional UNIX development environments, and
    a high-speed, preemptive multitasking architecture that takes full advantage of
    32-bit microprocessors. (Caldera includes both ELF and a.out binary formats).


    +   - Unlimited Users. Sets up an unrestricted number of user accounts on each
    Caldera operating system for use on a single computer system.'
  merge: -1
  img_proc: true
- pgno: 353
  md: '+   * Internet/Intranet Connectivity. Integrates OpenLinux with the Internet,
    including the integration of these services: DNS/NIS (name-services), HTTP (Web),
    SMTP (E-mail), FTP, SNMP (management), PPP/SLIP (dial-in), NNTP (Usenet News),
    and many others.


    +   * Client Access to Windows and UNIX. Access all your querying systems as a
    client: UNIX, Windows NT®, Windows® 95, and Windows for Workgroups™ 3.11.


    +   * Remote Management. Manage UNIX systems via remote login on networked or
    dial-in connections and access network resources from a remote site without requiring
    a separate machine as a dedicated gateway.


    +   * Multitasking. Runs many DOS and SCO UNIX (ibcs2) applications at the same
    time your computer acts as an Internet gateway for your organization.


    +   * Hardware Support. Obtain support for a variety of other networking protocols,
    filesystems, and networked operating systems. Obtain support for hundreds of hardware
    components, including CD-ROM, media devices, laptop computers, high-speed networking
    cards, and high-performance video graphics cards. Product line


    # B.4 Getting Information


    This guide represents a small part of the documentation for OpenLinux. The rest
    of the information is on-line. You can also contact Caldera for additional help.


    This section explains how to get more information:


    +   * Use-on documentation.


    +   * Contact Caldera.


    # Using On-line Documentation


    To access on-line documentation, double-click the Caldera_Info icon on the Desktop.
    The on-line documentation includes links to this guide, plus other information
    you''ll need. The information is displayed using the Netscape browser.


    Some of the on-line manuals that are included with OpenLinux Standard are also
    available as paper books. Check with your local computer book reseller or Caldera
    for availability.'
  merge: -1
  img_proc: true
- pgno: 354
