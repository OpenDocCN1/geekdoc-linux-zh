  md: '# 22 Chapter 3 • User Administration


    (and /etc/group if necessary) for the new user. The passwd field looks something
    like this:


    ```

    markk:0QLp0Zwxo.sh:500:500:Mark F. Komarinski:/home/markk/bin/tcsh

    ```


    As you can see, there are seven fields separated by colons. In order, these are
    the username, encrypted password, User ID (UID), primary Group ID (GID), real
    name, home directory, and login shell.


    To enter a new user, simply add your name. Replace the entire encrypted field
    with an or some other character. Be sure the UID is unique. Now, create the home
    directory you entered, copy files from /etc/skel to the home directory, and chown
    all the files in the home directory to the new user. Once the user exists, give
    the user a password using the command as root:


    ```

    passwd bob

    ```


    Assuming that bob is the userid you created, this will put a valid encrypted password
    in the passwd field, and the bob user can now log in. The first thing the new
    user should do is change their password.


    If it seems a bit complicated, there are two other methods you can use. First,
    RedHat comes with a usercfg that will allow you create or delete users from the
    system. It does all of this automatically. The downside is that it''s X Based,
    which is not much fun for automated scripts and the like. The third option for
    creating users is the /usr/sbin/adduser command. the only option required by the
    program is the username you wish to create. The program will then create the user,
    move files around, and so on. Both adduser and usercfg create and assign unique
    UIDs based on the last UID used above 500.


    # Groups


    Groups and GIDs are used to collect logical groups of people together. For example,
    engineering would have files they''d want to share among themselves, but not necessarily
    with sales. Accounting would want to share files with each other, but not with
    the rest of the company. The three levels of access for Linux files are user,
    group, and world. User is for the individual user who owns the file. The group
    is the file and user belong to, and world is everyone else. If you belong to the
    eng group (engineers'') and want anyone else in the eng group to read a file,
    make sure the file belongs in the eng group:'
