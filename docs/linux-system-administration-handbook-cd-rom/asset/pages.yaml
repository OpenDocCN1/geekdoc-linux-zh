    The atalkd.conf file, as you might imagine, contains the configuration information
    for atalkd. Entries in this file take the following form:


    ```

    interface [ -seed ] [ -phase number ] [ -net net-range ] [ -addr

    address ] [ -zone zonename ]

    ```


    If you have only one AppleTalk LAN and one interface on your server, you can leave
    atalkd.conf empty and atalkd will configure itself using information from AppleTalk
    routers on the network.


    If you have more than one network, AppleTalk will break them into zones. In this
    case you will want to use the atalkd.conf to tell your server zone to present
    itself as being. You can also configure atalkd to listen to multiple interfaces
    and route AppleTalk packets among them.


    Minimal atalkd.conf for use with multiple Applelet zones:


    ```

    eth0 -zone "Production"

    ```


    The zone is basically free-form.


    Unless you are on a very large network, you can also let atalkd set up its AppleTalk
    address. If this is not the case, you will have to assign one (or get if you are
    not in charge of the assignment of these addresses). Addresses are specified by
    network and node:


    ```

    -addr 45.10

    ```


    In this example, the 45 before the period is the network, while 10 is the node
    on that network.


    The -net option is used to specify which address range is covered in this zone.
    This option lets you set the address range which is automatically detected at
    server startup. If you have no zones, this number is irrelevant. The first number
    corresponds to the first network address of coverage in this range, and the optional
    last number corresponds to the last address covered'
