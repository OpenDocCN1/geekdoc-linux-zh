    # PGP


    One of the earliest implementations of freeware cryptography is in the PGP (Pretty
    Good Privacy). Due to export controls, munitions laws, and various patents, we
    can''t include this on the CD-ROM. There are legal ways to download this software
    in the United States and many other countries. Be sure you''re not breaking any
    domestic, international, or local laws by using this software. Some countries
    have severe restrictions on encryption. The main basis before PGP is to allow
    personal security in sending E-mail. The E-mail can either be authenticated as
    originating from you (to prevent spoof E-mail) or completely encrypted for opening
    by only another person, or both. The PGP program creates two keys: one private
    that must be guarded by you at all times, and a public key, which the recipient
    of your E-mail must be able to read in order to authenticate your E-mail.


    Building PGP on Linux is not an easy thing, given that Linux has changed since
