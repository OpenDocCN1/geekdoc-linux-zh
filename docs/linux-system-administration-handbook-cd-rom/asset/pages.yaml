- pgno: 257
  md: '# 236 Chapter 16 • X Windowing System


    As Linux’s popularity has grown so has the number of “non-server” applications.
    These range from the frivolous to so-called personal productivity applications
    usually associated with Windows or Macintosh desktops.


    Most of the applications we have discussed so far have been server oriented or
    programming languages. The few exceptions have been office suites, word processors,
    and spreadsheets.


    Here we want to talk about some of the “fun” software for Linux. These range from
    pure eye candy to the semi-useful to various games. Some of these were developed
    under Linux; others have been developed elsewhere, some even predate Linux.


    # Eye Candy


    Xsnow


    A silly little program. It creates snow on your X desktop which accumulates on
    your window tops. Periodically a sleigh pulled by reindeer flies across the screen
    and with blizzards. Run it around Christmas. Figure 16–4 shows a screenshot of
    Xsnow and gets in the holiday mood!


    ![](img/cd7585e53abd949068548271c07fcdd8_257_0.png)


    Figure 16–4 Xsnow'
