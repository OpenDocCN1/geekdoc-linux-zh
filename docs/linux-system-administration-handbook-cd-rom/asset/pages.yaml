- pgno: 147
  md: '# 126 Chapter 10 · NetNews


    The config.data file generally tells INN what the default log directory is and
    at what level to log various types of messages. The config.data file also defines
    where the errors and general messages (like all incoming news) should be logged.
    The control.ctl file tells INN where to log things like newgroup and removegroup
    as well as other cancel message types. See the section on control messages for
    more details. The syslog.conf entries tell INN where to log messages of varying
    severity. Common entries to the syslog.conf would look like the following tab-separated
    entries:


    ```

    news.crit    /var/log/news/news.crit

    news.err      /var/log/news/news.err

    news.notice  /var/log/news/news.notice

    ```


    This tells innd it should send messages of the correct severity to the corresponding
    log file in /var/log/news.


    # The Active and History Files


    The active and history files are the main INN databases that keep track of what
    articles are stored or were previously stored on the machine. The “active file”
    has one line for each newsgroup which contains the newsgroup name, the high and
    low watermarks for the articles currently stored on the server, and the status
    of the newsgroups. The newsgroup status is determined at the time of creation
    and can be one of the following:


    +   - Local postings are allowed.

    - Only remote postings are allowed.

    - This is a moderated group and all postings must be approved.

    - Articles are passed on and filed to the junk newsgroup only if received.

    - Articles cannot be posted to this group.

    - =group.name—Articles are locally filed in the “group.name” group, some-what
    like a symbolic link for a newsgroup.


    Coupled with the active file is the active.times file which provides a chronological
    log of when newsgroups were created. Each line contains the name of the newsgroup,
    the time of creation, and, optionally, the E-mail address of the person who created
    the group.


    Equ important is the file that holds the record of all articles currently on the
    server and those that were on the server but are now expired. The'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# 10.5 NNRP


    “history file” contains one line for each article with the tab-separated fields
    being a uniquely identifying Message-ID, date the article was received, and a
    set of space-separated entries identifying newsgroups the article was posted to.
    The third field is empty if the article has expired.


    Both the history and active files are always opened by the innd process and are
    updated any time the news server receives a new article or when articles are expired.
    If one of these files is lost or corrupted, they must be rebuilt from the existing
    data on the disk. This can be a long and arduous process depending on how many
    articles the news server returns at any time.


    # 10.5 NNRP


    The innd receives two kinds of connections on port 119: NNTP (Net News Transport
    Protocol) and NNRP. NNRP is the protocol used by news reading software to grab
    a specific set of articles and allow client posting. The connection to port 119
    tries to establish an NNRP connection, innd spawns an nnrp process. The nnrp will
    check the client''s address against the list of accepted addresses in the “nnrp.access
    file” and if a match is found, will allow the client machine the level of access
    specified.


    # nnrp.access


    The nnrp.access file contains entries of five colon-separated fields with the
    pound sign (#) as a comment character. The first field of the entry is a wildcard
    card expression that must match the client''s hostname or IP address.


    The second field specifies what privileges, read and/or post, granted to the client
    software. The third field, which can be left blank, specifies a username that
    must be used when the connection is established. The fourth field, which can also
    be left blank, is a password that the client must issue before any privileges
    are granted.


    # inews


    If the client is allowed to post articles to the server, the client software usually
    uses the “inews” portion of INN. The inews program is installed on the client
    machine and allows it to post an article to the server. Inews reads the article,
    normally entered interactively with some editor, and possibly headers from a file
    on the client machine. It adds headers to the article and does some rule-based
    consistency checking.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '128


    Chapter 10 • NetNews


    If the article passes, inews reads the local "inn.conf" file to determine which
    news server to send the article to. If an unapproved article is posted to a moderated
    group, inews will attempt to mail the article to the moderator instead, reading
    the "moderators" file or reading the "inn.conf" file as a last resort. If configured
    to do so, inews will spool the article locally if the server is not available,
    and "rnews" must be run periodically to flush the article queue.


    # rnews


    The inews program reads news articles stored in a local queue, typically by UNIX
    to UNIX Copy (UUCP), and sends them to the local news server as defined in "inn.conf."
    A UUCP batch file starts with a pound bang (#!) to indicate that multiple articles
    are stored in one file. If the pound bang is not present at the beginning of the
    file, then inews interprets the entire file to be only one article.


    # NNTP


    The innd process can also receive a request for the NNTP protocol on port 119.
    NNTP is the protocol used by other news servers to transfer articles in batch
    style. When such a connection is received, innd checks the hosts.mntp and hosts.nttp.nolimit
