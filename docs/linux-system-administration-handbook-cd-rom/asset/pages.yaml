- pgno: 280
  md: '# # Kernel 18 Administration


    Managing the state-of-the-art Linux kernel.


    The kernel is the heart and soul of your operating system. It manages the memory,
    the CPU, and disks; every piece of hardware in your system needs it to function.
    The Linux kernel is one of the most flexible and customizable in existence, and
    managing it is fairly straightforward but can be tricky


    times.


    # ## 18.1 Customizing Your Kernel


    In virtually every flavor of UNIX it is possible to configure the kernel to some
    extent. Usually this is done by specifying a set of external, loadable modules
    to insert into the kernel at boot time. With Linux you can do this and much more.
    In addition to being able to insert code modules manually at boot up, Linux can
    also load modules on demand and later unload them.'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'On top of all that, you can, since the code for the Linux kernels is freely
    available, compile your own custom kernel. This includes specifying drivers and
    features you wish to compile directly into the kernel and which you wish to leave
    as loadable modules.


    The Linux developers have worked hard to make this as painless as possible, so
    this flexibility has not cost much ease of use as you might expect. The kernel
    has two menu-driven configuration options: X-based and the other screen-based.
    Additionally, there is the simple line-based, linear configuration.


    # 18.2 Which Kernel?


    If you are familiar with Linux, you probably already know that at any given time
    there are two current kernel versions: a production version and a developmental
    version (sometimes called experimental) kernels typically have experimental and
    sometimes buggy or unstable features, though it should be noted that a truly buggy
    release of either a production or developmental kernel will be fixed very quickly
    with a new version.


    Production kernels always have an even release number, while development kernels
    are odd minor. The minor release number is the second of the three numbers that
    make up the kernel version number. For example, 1.3.88 is a development kernel,
    but 2.0.30 is a production kernel. The next minor revision up from a production
    kernel is developed in all with the production kernel (e.g., 1.2 and 1.3 were
    developed concurrently just as 2.0 and 2.1 are being developed concurrently now).


    In general, unless you need a feature available only in a developmental kernel,
    it''s usually best to stick with a recent production kernel. With the incredible
    flurry of version 1.3 releases (over a hundred!), the 2.0 kernel has a huge set
    of options to choose from and supports a wide range of hardware.


    # 18.3 Getting Ready


    There are a few things you will need or want to have handy while you are rolling
    out a new kernel. First, the manuals for your peripherals and your motherboard.
    You will at least need to know the model of your peripherals and, in some cases,
    some hardware settings like Interrupt Request Lines (IRQs) and memory addresses.'
  merge: -1
  img_proc: true
- pgno: 282
  md: "# 18.4 Adding Kernels to LILO\n\nYou will also want to make a copy of your\
    \ existing kernel and set up LILO, so you are able to boot in case your new kernel\
    \ has something wrong with it or simply won't boot.\n\nAlso, you will want to\
    \ have a bootable floppy (which you should already) in case things really awry.\
    \ If you need to make a boot floppy, see the chapter on boot up and shutdown.\
    \ Also, if you are a little paranoid, you might want to back up your root partition\
    \ as well.\n\n# 18.4 Adding Kernels to LILO\n\nAs mentioned above, it is good\
    \ practice to keep an old, reliable kernel around that you can boot up in a pinch.\
    \ LILO, the Linux LOader, allows you to choose which kernel to boot at startup.\
    \ With LILO you can also boot 386BSD, DOS, Windows 95, UNIXWARE, and a few others.\n\
    \nLILO uses a configuration file, lilo.conf, located in /etc. Here is an example\
    \ of one:\n\n```\n#\n# LILO config file: /etc/lilo.conf\n#\nboot=/dev/sda\nmap=/boot/map\n\
    install=/boot/boot.b\nverbose=2\nprompt\ntimeout=100\nmessage=/boot/message\n\
    image=/vmlinuz\n  label=1\n  root=/dev/sda\n  initrd=/boot/initrd\n  read-only\n\
    image=/vmlinuz2\n  label=2\n  root=/dev/sda\n  initrd=/boot/initrd.old\n  read-only\n\
    image=/vmlinuz.old\n  label=old\n  root=/dev/sda\n  initrd=/boot/initrd.old\n\
    \  read-only\n```"
  merge: -1
  img_proc: true
- pgno: 283
  md: 'The first line simply tells LILO what partition contains the boot sector, or
    if a device is specified (i.e., /dev/sda instead of /dev/sda1) which device contains
    the boot record. The next map is specified (/boot/map is the default); it tells
    LILO where all the files are it needs to boot an OS. Third is the boot loader.
    It is loaded into the BIOS and subsequently loads the selected kernel. Next is
    the verbosity level—higher is more verbose. The “prompt” entry tells LILO to present
    a prompt allow you to choose which kernel to boot. The “timeout” is how long it
    wait in seconds before booting the default kernel. If no timeout line is present,
    LILO will wait indefinitely. In either case, simply hitting at the prompt boots
    the default kernel. The next line specifies the message file which contains text
    that will be displayed by the LILO prompt is presented and the kernel is loaded.


    The next three sections tell LILO about the specific kernels you want to be able
    to boot. As expected, the first entry is the default one. In this case (as typical),
    it points to where the kernel is installed by default: /vmlinuz. The “label” sub-entry
    is the entry that tells at LILO: prompt to boot this kernel, “1” in this case.
    The “root” line specifies that, the partition containing the root directory for
    the OS or kernel. LILO tells file to load the initial ramdisk, and “read-only”
    it tells to mount the root partition read-only, so fsck can be run at boot time
    (fsck cannot be run in batch mode on a partition that is mounted read-write).


    The subsequent entries specify additional Linux kernels, each with their own,
    unique label but otherwise the same as the first. A good portion of the time,
    is all you will need to know about LILO, especially if you bought your Linux system
    already configured. However, you may still want to use DOS and MS Windows or Windows
    95 (for cases, word processing etc.). Adding entries into your /etc/lilo.conf
    for other OSes is fairly straightforward. Here is an example of an entry to boot
    MS DOS from a second SCSI device:


    ```

    other=/dev/sdb

    label = dos

    table = /dev/sdb

    loader = /boot/chain.b

    ```


    There are two new parameters here: “table” and “loader.” The first specifies the
    location of the partition table for the foreign OS and the second what chain loader
    to use to boot the OS’s kernel.


    The most important thing to remember with regard to LILO is to run /sbin/lilo
    after changing anything to it (editing any of the files associated with it, updating
    a kernel with an existing lilo entry, and so forth). Failure to do so could potentially
    prevent your machine from booting.'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# 18.5 Modules or Compiled In?


    # 18.5 Modules or Compiled In?


    One thing to note here is that not all drivers behave the same as a module when
    compiled into the kernel. This can range from slight differences in functionality
    to its simply not working at all.


    The choice of when to make a particular feature available as a module or to compile
    it is usually fairly straightforward. In general, if it is infrequently used and
    performs as needed as a module, you should compile it as a module. This often
    includes things like floppy disk drivers (in this day of networking), how often
    do you use the thing anyhow?, drivers for other filesystem types (Cary uses DOS
    fs driver as often as he uses his floppy disk), CD-ROM drivers, for sound cards,
    or networking drivers on a machine that uses dial-in PPP for access.


    If the feature is used frequently or continually, then really isn''t much point
    in compiling it as a module since it will be loaded all the time anyway. This
    includes items such as your hard disk controller or SCSI controller, network drivers
    on a machine permanently networked, AppleTalk drivers on a fileserver for your
    Mac network, and so forth.


    In cases where functionality between the compiled version and the module differs,
    it is usually noted in the help pop-up for that option and in any related HOWTOs.


    It should be noted that these are for the most part just guidelines. Ultimately
    you need not compile in your kernel only what you need to boot your machine.


    # 18.6 Dive On In!


    Let''s go and outline how you might roll a kernel for a networked Linux machine
    you''re using as desktop machine and a file server for a network of Windows and
    Mac machines. You also have a sound card (they''re cheap and you have a hundred
    CDs at home you could also be listening to at). The machine has a SCSI controller
    with a CD-ROM and hard drives attached to it.


    First, make sure you have the kernel sources installed. If you do, you may decide
    you want to get a more recent version. The default location is in /usr/src/linux
    which may be a link to linux-x.y.z, where x.y.z is a kernel revision. Once you
    are in x, highly recommended), type “usr/src/linux, typemake config” (assuming
    this will do some preliminary work and then bring up a window with buttons that
    take you to various sections of the kernel configuration.


    As you may have guessed, the first time through it''s best to start at the top
    and go through all the menus.'
  merge: -1
  img_proc: true
