- pgno: 83
  md: 'The foo subdirectory is not accessible to wayga. The only thing that wayga
    will see is permissions for the foo directory, and ls of it will return “..."


    Remember unless you have a firewall or packet filter up, NFS access will be TCP/IP-wide
    unless you specify a host or group of hosts that can access that particular NFS
    directory.


    From the NFS client, assume root power, and let''s mount the /pub directory from:


    ```

    mount -t nfs wooba:/pub /mnt/pub

    ```


    There are only a few changes in the mount command from mounting a hard drive or
    CD-ROM. The filesystem type is nfs, and the device name is replaced with a host:directory
    combo.


    To have directories mount automatically on startup, you can enter them into the
    /etc/fstab file, or use the RedHat fstool to add the mounts. Remember to replace
    the device file with the host:directory combo, and use the filesystem type of
    nfs. Once the network is started, NFS service has started, the NFS directories
    will mount.


    One problem with NFS is that if the NFS server goes down, the network connection
    between the client and server is broken, the client effectively stop while trying
    to do file access. This can even include the situation where an NFS directory
    is in your $PATH. Running a command that searches through the path will cause
    your machine to appear to hang. There isn''t a cure for it at this point. Just
    be sure that the server doesn''t crash. Other network systems are in the works
    that will prevent some of these problems, but they don''t quite work yet. The
    other important point is to make sure your networking is working correctly.


    One additional program you may want to look at if you have a large amount of NFS
    drives is the amd program. This program is an automount daemon, and it automatically
    mounts and unmounts drives as needed. It''s a bit outside the scope of this chapter,
    but you can download the program and give it a try if you have a lot of partitions
    to mount.


    # 5.4 AppleTalk


    To round out the list of Linux-supported networking/file sharing protocols, we
    turn to AppleTalk. Using Linux as an Apple fileserver has several advantages,
    including'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# 5.4 AppleTalk


    +   - No limit on simultaneous users: Apple''s AppleTalk sets a limit of ten concurrent
    users. To go beyond this limit you must upgrade to AppleShare, which isn''t free.


    +   - Versatility: The Linux server can also also, as discussed earlier, serve
    disks (possibly the same disks) via NFS, SMB (Samba, used by Windows for Workgroups),
    IPX (Novell Network), and NetBEUI (Windows NT).


    +   - Additionally, you can take advantage of the superior remote access features
    of Linux which none of the popular non-Unix-based OSes can rival.


    +   - Since Linux is multitasking and has less overhead than MacOS (at least without
    X), performance will generally be better. This is true even under MacOS 8 since
    most of the enhancements were related to stability and the Graphical User Interface
    (GUI); even though the finder is multithreaded, its actual speed is about the
    same.


    Some of the disadvantages are


    +   - AppleTalk and the daemons that manage the file sharing need to write some
    "hidden" files (i.e., starting with a leading \-", MacOS will not see them) that
    tend to jump the filesystem somewhat.


    +   - AppleTalk and MacOS support a very loose file naming convention. Linux supports
    this admirably well, especially considering how restrictive UNIX file naming conventions
    are. However, some characters escape or be encoded somehow how filenames look
    different when viewing them from the Linux side of things.


    +   - There is no way to back up clients from the server (though backups for the
    clients can still be run from a Mac).


    +   - There is no way to mount remote AppleTalk volumes on the Linux box. There
    is interest in doing this and work is underway. It''s likely that this will be
    possible some time in the not too future.


    In addition to making disk volumes available via AppleTalk, it is also possible
    to make local printers available to your Macs or print to a network Apple-Talk
    printer, making it available to other, non-AppleTalk machines on your local area
    network (LAN).


    In AppleTalk, there are two levels of access: guest and registered user. Being
    a guest user is basically like being the user nobody in UNIX: You have highly
    limited access to the server and typically can write only to areas that are writable.'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'Registered users, on a Linux-hosted Appleshare, authenticate using the user
    and password information in /etc/passwd, that is, they must have an account on
    the machine. If you don''t want these users to have shell access, you can give
    them the shell /bin/false. This is analogous to what is done when setting up FTP-only
    accounts. If you would like to let users change their passwords, you can give
    them the shell /bin/passwd. If you choose to do this, be sure to add /bin/passwd
    to the /etc/shells file so it is a valid shell.


    In the configuration files for netatalk, you define which directories are available
    at the two levels of access, including the home directory of registered users.
    For each instance of the AppleTalk daemon, you can specify a set of directories
    for guests and registered users to access.


    The Netatalk homepage is http://www.umich.edu/-rsug/netatalk/. Linux-specific
    information can be found at http://thehamptons.com/anders/netatalk.


    # Hardware Considerations


    There are a few hardware caveats relating to Ethernet cards. Netatalk doesn''t
    function on cards based on DEC''s Tulip chip. Also, the driver for your card must
    support multicasting; the driver for Intel''s EtherExpress doesn''t do so.


    Aside from these functional considerations, the best hardware investment is a
    good, fast disk. Spend the extra money to buy a fast disk and/or faster SCSI controller.


    # Typical Installation


    The current full (non-beta) release is 1.3; the current beta is 1.4,which has
    proven very stable and has much better performance than 1.3. It is recommended
    that you use most recent 1.3 beta instead of 1.3.


    Netatalk doesn''t require any extra or exceptional software to compile and compiles
    easily under Linux. You will need to enable AppleTalk support in your kernel.
    It is safe to enable it as a module if you desire.


    Netatalk installs its various daemons and utilities /usr/local/atalk. In particular,
    the etc subdirectory contains the configuration files: AppleVolumes.default, AppleVolumes.system,
    atalk.conf, and rc.atalk. As is the case for any network services, you will need
    to make a few entries in /etc/services as well.'
  merge: -1
  img_proc: true
