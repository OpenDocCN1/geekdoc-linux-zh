- pgno: 153
  md: 'This feeds takes for every article and feeds it through the overchan binary,
    which takes pertinent information from each article and stores it in a data-base
    for fast preloading of articles by news clients. The overview database is structured
    to be somewhat a mirror of the news spool itself and keeps all entries in a hierarchical
    directory structure ordered by group names. Each group has its own overview file
    within that directory structure. For instance, the overview file for comp.os.linux
    would be something like


    ```

    /news/over.view/comp/os/linux/.overview

    ```


    and all the articles for comp.os.linux would be stored in


    ```

    /news/spool/comp/os/linux/<article ID>

    ```


    The contents of the overview file are governed by the overview.fmt config-uration
    file. By default, the overview file contains the following headers: Sub-ject,
    From, Date, Message-ID, References, Bytes, Lines, Xref. The order of the lines
    in the overview.fmt file is important because it determines what order the headers
    will appear in the database. If the overview.fmt file is changed after news has
    already been accepted, the overview database must be rebuilt from scratch.


    # ctlinnd


    One of the most important pieces of user interactive software in the INN dis-ribution
    is the "ctlinnd" binary. The ctlinnd program is the main control mechanism for
    the innd. It is responsible for creating and removing groups, article canceling,
    connection status of the server, rereading the configuration files that ind keeps
    in memory, renumbering the active file, and much more. For diagnostic purposes,
    one of the most frequently used ctlinnd commands is "ctlinnd mode" which verifies
    that the server is running, what mode the server is in, and if it is receiving
    new connections. A full listing of ctlinnd''s capabilities can be viewed by passing
    the -h flag to the program. We will cover some of the most commonly used ctlinnd
    arguments and leave the rest for the man page to explain.


