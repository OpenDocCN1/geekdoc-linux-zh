  md: '# 15.8 Summary


    If you wish to record individual tracks from your CD-ROM, you can use cdda2wav
    to make .wav files and convert them using rmenc.


    # 15.8 Summary


    This chapter scratches the surface of what has become an incredibly huge and complicated
    subject in just a few short years. We discussed two types of servers, secure and
    insecure, as well as two methods of implementing them, the common forking server
    and the newer and less common multiplexing server.


    Because of its popularity, extensibility, and power, we went into detail about
    Apache and its two secure derivatives: Apache-SSL, a freeware secure server of
    questionable legality in the United States; and Stronghold, commercially supported
    and legal secure server available in and outside the United States.


    We also discussed various methods for interacting with the system the server is
    running on: CGI and SSL, as well as PHP, a scripting language designed to be embedded
    into HTML and then parsed by the PHP interpreter running as CGI or FastCGI or
    compiled into Apache.


    Setup and configuration of a server for streaming audio and video was examined.
    Additionally tools for creating content files were also discussed.


    Lastly, we went through the compilation and setup of a non-secure Apache server
    with PHP compiled into it. In turn, PHP was configured with MySQL support so it
    can access MySQL databases locally or remotely on other machines.'
