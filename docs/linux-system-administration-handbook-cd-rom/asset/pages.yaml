    # 14.2 C++


    http://www.accu.org/


    C++ is an object-oriented, compiled language whose roots lie in C (as its name
    suggests). It is not as popular as C, mainly because both it and OOP are younger
    than C. C++ and C mix very well together. It is easy to link object files from
    either and mix the two languages within an application. VRWeb, a VRML scene viewer,
    and MySQL, a freeway database server, are two applications that do this.


    GNU''s g++ is the C++ compiler most commonly shipped with all Linux distributions.


    To dispel a common misconception, knowledge of C is not necessary to learn C++.
    While it is certainly useful to know C before learning C++, it''s no necessity
    of knowing Basic before learning FORTRAN. They''re separate languages.


    For applications where an OO language is better suited or desired, and the performance
    of a compiled language is necessary, C++ is the most popular choice. It is more
