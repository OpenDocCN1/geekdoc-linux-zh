  md: '# Chapter 22 • Linux Distributions and Upgrading Your System


    +   - Motorola 68K—http://www.clark.net/pub/lawrencl/linux/index.html for Motorola
    MVME, Atari, and Amiga 68ks or http://www.maclinux.org/index.html for Apple 68ks

    - PowerPC—Depending on your exact platform, neither, one or both of mkLinux (http://www.mlinux.apple.com)
    or Linux/PPC (http://www.linuxppc.org/)

    - x86 (AMD, Cyrix and Intel)—http://www.linux.org/ or any of hunreds of other
    sites


    Not of all these ports are as far as others. As you probably know, the Linux/x86
    is the most mature. The SPARC, Alpha, mkLinux, and PPC versions are nearly as
    mature; they are all self-hosting and multiuser with stable XFree86 ports.


    The non-Apple 68K port has recently been declared stable by its development team.
    Amiga and Atari users may want to check it out.

    The SGI/Linux project is also multiuser and self-hosting on SGI''s Indy platform
    but lacks a stable port of Xfree86. If you do not plan on using the console at,
    you may want to investigate it for use as a server.


    # 22.2 Commercial Linux Distributions


    Linux is free and protected under the GNU Public License, meaning that anyone
    can take it, modify it, and sell it as long as they make the source code available
    for free. For most of us, the convenience of having distribution media and some
    installation support is worth $50 to $100.


    Since the first CD-ROM releases of Linux, a number of commercial Linux distributors
    have sprung up. We will try to at mention all of them and get into some detail
    on RedHat, Workgroup Solutions, Slackware and Caldera.

    The focus will be on the x86 versions of these but much of what is is in this
    chapter will apply to most Linux ports.


    Probably around 90 percent of the software that comes with any of the distributions
    is the same: the modulo software version. They all include a Linux kernel; XFree86;
    compilers for C, C++, Fortran, Smalltalk, and Pascal; interpreters for Perl, Python;
    Tc/Tk; many extra widget sets for X: Athena, Xena, Apache; various shells: bash,
    tsh, ksh; editors: pico, emacs, vi; numerous X window managers: fwm, fwm2, olwm;
    all the standard UNIX command-line utilities, usually GNU versions of them; various
    desktop applications ranging from CD players to drawing tools; and text processing/layout
    applications such as nroff, troff, TeX, and LaTeX.'
