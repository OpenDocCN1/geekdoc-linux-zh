    http://www-swiss.ai.mit.edu/scheme-home.html (Scheme)

    ```


    Lisp is a venerable language; its origins lie in the earliest days of artificial
    intelligence research in the mid-1950s. Machines like the IBM 704 and the PDP-1
    (yes, not one eleven) are associated with it. As computer technology progressed,
    Lisp was implemented on more and more architectures; no two implementations were
    completely interoperable so Lisp and its dialects became splinterined. In the
    early to mid-1980s the Common Lisp specification was hammered out and an ANSI
    standard was adopted.


    Today, Common Lisp sports functions with variable numbers of arguments, a large
    library of utility functions (it is four decades old!), and an object-oriented
    programming facility. You might guess, since it was developed for AI, Lisp also
    has a very sophisticated condition-handling system.


    Scheme is a much simpler dialect of Lisp. It has its own separate specification,
    about 50 pages in length, which lays out a conceptually elegant language. Interestingly,
    the Scheme specification is shorter than the index of "Common Lisp: The Language."


