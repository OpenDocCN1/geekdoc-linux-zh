- pgno: 90
  md: '# AppleTalk


    # Applesaring Your Printer


    Making a printer available to your AppleTalk clients is very simple.

    The netatalk printer daemon, papd, should be starting automatically when the rest
    of the atalk daemons start. You need to add an entry to /usr/local/atalk/etc/papd.conf:


    ```

    Denna laserprinter:\n:pr=lp:\n:mx#0:\n:lp=/dev/lpl:\n:if=/var/spool/lpd/lp/filter:\n:sh:

    ```


    Depending on the version of netatalk you have, you may have to reboot the printer
    to be visible to your clients.


    # Printing to a Remote Appletalk


    It is also possible to print from your Linux box to a network AppleTalk printer.
    To do this, follow the instructions below.

    Get your Appletalk zone using getzones:


    ```

    /usr/local/atalk/bin/getzones

    biology

    chemistry

    ```


    If you are not sure which your local zone, use the -m option for zones.

    Next you need to determine the name of the printer. You can use nbplkup for:


    ```

    /usr/local/atalk/bin/nbplkup :LaserWriter

    galileo:LaserWriter

    CANON GP200/215 PS:LaserWriter

    LaserWriter 16/600 PS:LaserWriter

    ```


    We gave nbplkup the argument “Laserwriter because we know we are looking for that
    type of printer. If the argument is left off, you will see everything in your
    zone.


    Check the status of the printer you want to print:


    ```

    /usr/local/atalk/bin/papstatus -p "LaserWriter 16/600 PS*\nstatus: idle

    ```'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'Now test it:


    ```

    # /usr/local/atalk/bin/pap -p "LaserWriter 16/600

    PS":LaserWriter@biology product.ps

    ```


    If you are printing to a printer in your zone, you can leave off the name.


    Assuming everything is working, the document should print out. Now you can go
    on to setting up /etc/printcap. Here is a sample entry:


    ```

    lp|NetworkWriter|LaserWriter 16/600 PS:\n:sd=/usr/spool/laserwriter:\

    :lp=/dev/null:\

    :pl#63:\

    :pw#85:\

    :mx#0:\

    :sh:\

    :sf:\

    :lf=/usr/adm/lpd-errors:\n:if=/usr/local/atalk/etc/filters/ifpap:\n:of=/usr/local/atalk/etc/filters/ofpap:

    ```


    For more information on setting up remote and local AppleTalk printers see http://www.giub.unibe.ch/~eugster/appleprint.html.


    # 5.5 Network Information Services (NIS)


    The Network Information Services (NIS) is a set of programs for managing users
    and various network services from one master server. Recently an enhanced version
    of NIS, NIS+, is more secure, works better in large networks, but is more difficult
    to set up.


    NIS began life the Yellow Pages. Yellow Pages however, is a registered trademark
    of British Telco so the name was changed. The original name legacy is still around,
    most of the programs associated with NIS begin with "yp."


    NIS stores its information in a set of directories and GDBM (GNU Database Management)
    files rooted in /var/yp/F. NIS refers to these files as "maps.\ The maps are then
    made available to other machines in the NIS domain (not the same as a DNS domain!)
    via RPC (Remote Procedure Calls). NIS also allows for secondary slave servers.
    Slave servers get their maps from the master and answer requests if the master
    is slow or down, much the same way secondary DNS servers works.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# 5.5 Network Information Services NIS


    The NIS maps are built from the various setup files commonly found in / etc: passwd,
    group, hosts, services, aliases, and so on. It is not necessary to use every map.
    Only the password and group maps are used since most of the other files typically
    change infrequently.


    One of the biggest problems with NIS was the security hole opened by broadcasting
    NIS requests—anyone could set up a server which would have a chance of answering
    the requests. Recent versions of ybind allow would have the specification of the
    domain server either by IP number or name.


    # NIS Client Setup


    It is most likely that your first encounter with NIS will be as a client. Setting
    your Linux machine to be an NIS client is fairly straightforward.


    First of all, you will need to know what information is being managed via NIS.
    We will assume a fairly typical setup of password, group, and host information.


    You will need to add "nis" to your /etc/host.conf. Order is important. If you
    actually spend most of your time talking to hosts outside your LAN, you might
    want to put NIS last in the search order.


    In the examples below, we''ve assumed /etc/passwd is fairly minimal, containing
    entries for the superuser, various daemons, and so forth, but no more user entries.


    To append the whole NIS password map to the local /etc/passwd file this line:


    ```

    :+:::::

    ```


    You can customize access by adding additional lines starting with + or -. For
    example, deny the user "cary" access but allow all others (at least to the extent
    they have on any other NIS client), add this:


    ```

    :+:::::

    -cary

    ```


    The "+:::::" entry is not mandatory. Additionally you can control access by groups,
    using "@". This entry


    ```

    +cary::::

    +rachel::::

    +@plan9::::

    -paul

    -entry

    ```'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# Chapter 5 • Networking with Linux


    allows access for "cary," "rachel," and the group "plan.9." The users "paul" and

    enry" (who are presumably in the aforementioned group) are denied.


    It is also possible to override sections of the information in the passwd

    map or add users that don''t exist in the NIS at all. For example, to give

    paul shell /bin/tcsh and change Rachel''s home directory (and allow

    only them access) and add a user surya, use entries like:


    ```

    ++:::

    +paul::::/bin/tcsh

    +rachel::::/local/home/rachel:

    +*:/bin/false

    surya:UGj6khgT:506:100:/home/surya:/bin/bash

    ```


    Finally, you will need to set up the ypcient programs and set the NIS

    domain name. It''s likely that your distribution came with the NIS client (and

    server) programs. If not, you should be able to get them from any Linux dis-

    tistribution site.


    Setting the NIS domainname is accomplished by running /bin/domain-

    name nis. You will also need to make sure the portmap program is

    running. Using the rpcinfo command for this:


    ```

    [root:/home/cary]# rpcinfo -p localhost

    program vers proto port

    100000 2 tcp 111 portmapper

    100000 2 udp 111 portmapper

    ```


    If it''s not in the list, run /usr/sbin/portmap, then /usr/sbin/ypbind.

    rpcinfo should show something like


    ```

    [root:/home/cary]# rpcinfo -p localhost

    program vers proto port

    100000 2 tcp 111 portmapper

    100000 2 udp 111 portmapper

    100007 2 udp 637 ybind

    100007 2 tcp 639 ybind

    ```


    At this point, your NIS client setup should be complete.


    # The nsswitch.conf File


    The /etc/nsswitch.conf file determines the lookup order for all NIS

    information (unlike /etc/host.conf which is only for host lookups). The

    example below is self-explanatory.'
