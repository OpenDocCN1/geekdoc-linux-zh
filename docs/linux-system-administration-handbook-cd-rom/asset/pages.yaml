  md: '# 110 Chapter 9 • Samba


    talk to Linux. The latest version of Samba can be found at http://lake.can-berra.edu.au/pub/samba/samba.html.

    Let''s quickly go through a small network.


    # 9.1 Setting Up a MS Windows Network


    This is actually easy, if you have Windows for Workgroups, Windows 95, or Windows
    NT. There are apparently DOS clients as well. So from here on in, we''ll just
    say "Windows" to relate to all three versions of the OS, and you''ll have to do
    some reading to match what I tell you to your particular version of Windows.


    # What You''ll Need


    First, get the ethernet cards and drivers loaded. Also install your backbone.

    The best available networking scheme for the money is 10BaseT, as there are fewer
    problems that can cause the entire network to go down. But it''s more expensive;
    you have to buy a hub, switch, patch cables, patch panels, run one cable to each
    machine, and so on. But it is certainly worth the money.


    If you want a cheaper ethernet, or you have a very small network, you can get
    the very affordable 10Base2. This is also known as "thinnet." All you have to
    be concerned about a 10Base2 network that is both ends are terminated with a 50-ohm
    resistor. Thinnet has the disadvantage that if one section of cable goes down,
    the entire network goes down.


    You''ll need to make sure that each Windows user has an account on the Linux server.
    Their shell can be non-existent if you like, but the account and a home directory
    have to exist. If you want, make the shell something like /bin/false. If you want
    users to be able to change their passwords, set the shell to be /bin/passwd. Also
    be to add /bin/passwd to the /etc/shells file.


    Once you have your network and you Linux box set up, get the software working.
    Windows will allow you to use the Windows networking option to create a simple
    network. Be sure to use the same workgroup name across all the machines.


    # What''s a Workgroup?


    A workgroup is something similar to a subnet, but not quite the same. A sub-net
    breaks up you physically, as you need a router or bridge to get from one subnet
    to another. A workgroup is a more logical breakdown. For example,'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# Installing Samba


    you can have accounting, manufacturing, and sales all on the same subnet, but
    all in different workgroups.

    Once the software has been set up, you should be able to browse the network and
    see all the other machines at least on the same subnet as you.³ If

    you''t, get the software to this point. If something''s wrong, you''ll usually

    get a somewhat cryptic explanation of the problem and how to fix it.


    # TCP/IP Stack


    Windows 95 and Windows NT both come with a TCP/IP stack already in the installation.
    Windows for Workgroups has one available at the Microsoft home page (http://www.microsoft.com/).
    Download and install it on the systems. Windows asks for a username and password,
    be sure to give the username that exists on the Linux machine and use the Linux
    password as well. Note that Windows for Workgroups and Windows 95 both have bugs
    regarding password security, and you should check out the Microsoft home page
    for patches to both Oses.

    I''ll assume you know how to set up a TCP/IP network. If not, check the networking
    chapter for information on how to do this. Once you have the TCP/IP stack loaded
    on all the Windows machines, try having ping each other, or ping the Linux box.
    The Linux box should also be able to ping the Windows machines. If you don''t
    have a TCP/IP network available, check the chapter on ipfw for information on
    creating your own internal network using Linux.


    # Installing Samba


    When the Windows machines are set up, let''s go to the Linux machine. Install
    the latest version of Samba in a convenient location. We use /usr/local/samba.
    Directories should be created underneath one with the names lib, bin, and var.
    The lib/smb.conf file is the one you''ll editing most, and you should take a look
    at it and the man pages for it while compiling and installing.

    Here''s a sample copy of an smb.conf file:


