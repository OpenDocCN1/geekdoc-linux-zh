  md: '# Wabi


    Wabi is a commercial MS Windows 3.1 emulator developed by Sun Microsystems. It
    has been ported to Linux by Caldera. It provides for cutting and pasting between
    applications, remote display, sharing of applications between users, Winsock networking,
    OLE (Object Linking on Embedding), DDE (Dynamic Data Exchange), access to serial
    and parallel ports, and many other features.


    Wabi has a few limitations. It requires 8-bit color, so if you are running X with
    24-bit color your server will need to support 8-bit pseudo-color. IPX/SPX connectivity
    is not available nor are virtual device drivers. See http://www.caldera.com/doc/wabi/wabi.html
    for more information.


    # WINE


    WINE is a freep Windows 3.1 emulator. Its home page is http://www.qbc.clic.net/~krynos/wine_en.html.
    In addition to running a number of popular Windows applications, WINE also ships
    a library that will allow you to build stand-alone applications from the Windows
    source code.


    WINE is not as far along the compatibility road as Wabi is but significant progress
    is made with each new release.


    # Dosemu


    A freeware DOS emulator. It can run on the console or under X in its own window.
    The best place to get information on Dosemu is the HOWTO which can be found at
    any Linux mirror site.


    # Acrobat


    Adobe (http://www.adobe.com/) makes Acrobat Reader for Linux. It is available
    for free and, as far as we know, this is the only Adobe product for Linux.


    # LessTif


    LessTif is a freeware clone of Motif. It is still in beta but a large number of
    Motif-based programs compile with it already. Additionally, precompiled programs
    which use the shared version of the library will run with it.'
