  md: '# Chapter 13 · Linux Database Software


    it and let it do its thing. What it does is set up tables for user access control.
    These users do not need to be system users, that is, they need not have /etc/passwd
    entries.


    The name of the grants database is simply mysql. It has three tables: db, host,
    and user. The db table lists access for the combination of user, data-base and
    host from which the user, is connecting. host controls access for the pairing
    of host versus database. Finally, user combines host, user and pass-word.


    To initialize the mysql database, you need to run mysql_install_db. You used a
    binary distribution, in the directory created when you unpacked the archive, type


    ```

    scripts/mysql_install_db

    ```


    If you compiled from the source, run the above command in the top level of the
    source tree. This will set root as a "superuser" when connecting locally, lock
    out remote users, and force other local users to be granted access on a database
    level in the db table, set up db to allow any access to the test database or any
    database starting with "test_" to any user. It will also start the MySQL daemon,
    mysqld, for the first time.


    Since the grants database is probably the most complex aspect of using MySQL,
    we''ll give a few examples here. There are a few things to remember when manipulating
    the access tables.


    +   * Passwords are stored encrypted.

    * The tables are sorted, putting wildcard and "" entries list. The first match
    is then. host is sorted first, then user, and last, for the db table, by database.

    * The host table is consulted only if the host field in the user table is "".
    The privileges that are listed by the user table are logically ANDED with those
    in the host table.

    * The results of the previous step are ORED (once again in the logical sense)
    with the user table.

    * If there is no matching entry in db, the matching entry from host is ANDED with
    the matching user entry.


    To start manipulating the mysql database, as root, enter


    ```

    mysql mysql

    ```'
