  md: '# 10.8 Common Error Messages and What They Mean (Taken from the INN FAQ) 141


    # Other Common Problems


    +   * All articles received fed back to the provider.

    This generally indicates that the entry that is set up for the feeding site in
    the newsfeeds file does not match the name used in the feeding site''s path. INN
    will not refeed news to any host that has its name in the Path: header. To correct
    this, modify the newsfeeds file so that the names match or add a distrib pattern
    match as previously described in the newsfeeds section of this chapter.

    * The active file and/or history file gets deleted.

    Losing the history and/or active files can be rather devastating, especially if
    both are at once. Luckily, INN keeps a copy of the previous night''s files in
    the news log directory filed under active.old and history.old. Copy the corrupted
    files out of the way and copy the previous night''s files in their place. If backups
    of the files are not kept, the file(s) will have to be rebuilt from scratch. The
    active file is particularly a problem because it does not get moderation specifics
    correct a good portion of the time.


    If the history file was corrupted or lost, run "makehistory -bu" to pick up any
    new articles that were added since the corruption. If the active file was lost
    or corrupted, it should renumber when INN is restarted. If it doesn''t, issue
    a "cltimnd reactive" to force INN to pick up the new high and low watermarks.


