- pgno: 239
  md: 'then send and output streams from streaming input (as opposed to a static file).


    With the rising demand for multimedia content on the web, sooner or later (probably
    sooner!) you will need to be able to serve streaming audio and video from your
    Web server. Lucky for Linux, RealNetworks makes its RealServer for Linux.


    The basic version is free and intended for personal and single-site use (i.e.,
    ISPs do not get to use the free version). Installation is as simple as uncompress
    the distribution file, running the setup script, and answering some configuration
    questions.


    RealServer will deliver live and on-demand (stored in a file) streams. The default
    port for the server is 7070.


    The Plus version, which is not free and not yet available for Linux is a hosting
    service. Additionally the Plus version has enhanced performance, a printed manual,
    GUI, and as you might expect, technical and upgrade support.


    The default installation directory is /usr/local/pnserver. After the installation
    script completes, change to the install directory and start the server:


    ```

    # bin/pnserver server.cfg

    ```


    You will be prompted to register the server. You can skip this step if you wish
    without any effect on the functionality or performance of the server. Point out
    Web browser at that machine you installed the server on, port 7070. You will be
    prompted to enter the username and password provided during setup. This will bring
    up a page with links to some samples, the links to some areas on RealNetworks''
    Web site.


    Test the server by trying some of the sample files to be sure it''s running. RealMedia
    files can be placed in /usr/local/pnserver/content and accessed via URLs like
    http://www.foo.net/ramgen/audio.rm. You can set up aliases or subdirectories for
    mortal users to place their own files in.


    # Generating Content Files


    Various encoders exist for creating real audio and video. Unfortunately, only
    an audio encoder exists for Linux. To encode video or audio/video, you will need
    an MS Win32 machine or a Macintosh.


    The media encoder, rmenc, for Linux is free and can be used to convert .wav and
    .au files into RealMedia files. Additionally, if you have to use OSS sound drivers,
    it can listen to your soundcard output and record that.'
