  md: '# 86 Chapter 7 • E-mail


    The primary program that is the Mail Transport Agent (or MTA) is sendmail. There
    are others available, but sendmail is pretty much the standard for most Linux
    installations. You may have seen that really thick book with a bat on it that
    gets you into the nitty-gritty of sendmail. It gets really nifty-gritty.¹


    The uphot of all this is that you don''t always need it in order to set up a simple
    E-mail server. The one thing you should know about sendmail is this: Always be
    sure you have the latest version. Each version of sendmail, while patching various
    bugs, seems to have a security problem with it. Seems like you need to upgrade
    your sendmail software more often than the Linux kernel.


    Enough of that. Let''s get to the typical sendmail options you''ll see on startup.
    Most Linux installations have sendmail kick in bootup. RedHat (being SVISH) has
    an /etc/rc.init/sendmail.init script which runs on start-up. My installation starts
    the actual command like this:


    ```

    echo -n "Starting sendmail :

    daaemon sendmail -bd -qh

    echo

    touch /var/lock/subsys/sendmail

    ```


    As you can see, the sendmail program starts with the -bd option and the -qih option.
    The -bd signifies that sendmail should start up as a daemon and run in the background
    waiting for connections, the same way that a Web server is always running, waiting
    for a connection. The -qih means that sendmail should go through its queue at
    least once an hour and try to send any data in its queue.


    There are many reasons that an E-mail message can be held in a queue. For example,


    +   - If you have a dialup-only connection to the Internet, and you send a note
    while you''re not connected.

    - The remote host is not dialed (same thing in reverse).

    - The remote host is down for upgrades or it crashed.

    - There is no connection to the remote host (the network is down).


    In any of these cases, you''ll want to make sure that your E-mail gets through.
    Leaving the E-mail in sendmail''s queue allows you to do this. A


    ¹If you have anything to do with setting up sendmail, get that book.'
