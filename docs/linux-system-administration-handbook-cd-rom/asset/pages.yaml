  md: '88


    Chapter 7 • E-mail


    # 7.1 Using m4 Files


    One option that many versions of sendmail have is the option to have your sendmail.cf
    file automatically generated. This will allow you to keep a small file that has
    most of the options you wish to use. When upgrading sendmail, you need to recompile
    only the sendmail.cf to have the latest updates to your file. The m4 macro language
    is excellent for doing this, and sources for various types of sendmail.cf files
    are included.


    If you decide to use the m4 files, be sure to download the source code for sendmail,
    as the RedHat 4.1 distribution does not include m4 files by default. The m4 processor
    is installed by default and is located in /usr/bin.


    # 7.2 You Have Mail!


    E-mail has arrived at your system, there are a few things that happen to it before
    you actually get alerted to new E-mail. First, sendmail checks to see if you have
    a .forward file in your home directory. If so, then sendmail will forward the
    E-mail to whatever address is specified in the .forward file. If you''re using
    procmail and have a .procmail file, sendmail will run procmail and follow the
    rules in it. After that, sendmail appends the E-mail to a file called /var/spool/mail/<USER>
    where <USER> is the username. The file does not need to be created when making
    a new user; sendmail will take care of that the first time the user gets an E-mail
    message.


    Creating aliases allows incoming to get routed to a different user or program,
    even if there is no user account with that name on the system. This will have
    a larger impact once you get to managing mailing lists. For now, you may want
    to examine the /etc/aliases file to see what aliases are currently defined. This
    is a method of having a mail alias that really sends the. For example, a common
    /etc/aliases file may contain the following:


    ```

    MAILER-DAEMON: postmaster

    postmaster: root


    # General redirections for pseudo accounts.

    bin: root

    daemon: root

    games: root

    nobody: root

    uuccp: root

    ```'
