- pgno: 252
  md: '# 16.5 User Programs


    ![](img/cd7585e53abd949068548271c07fcdd8_252_0.png)


    Figure 16–3 KDE in action


    # 16.5 User Programs


    The default X setup has a bunch of user programs, including shells, utilities,
    and a couple of games. These programs all have a few default options that you
    can set when you first start them. I''ll show this by introducing the xterm, which
    is the X terminal emulator. This is almost the same as logging into the shell.
    The big difference is that the .login file is not read, but the .cshrc is, instead.


    Here are a few of the common options you can use with almost all X programs:


    ```

    -display <host>:<display>

    ```


    Send the display (not just the output) to the named host and display number. In
    most cases, the display can be 0.0 which means the first X server and the first
    display on that X server. The program still gets executed on the remote CPU, but
    the window gets displayed elsewhere. This setting will'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# 232 Chapter 16 • X Windowing System


    override the DISPLAY variable if it''s set. If the DISPLAY variable is set and
    the -display option is not used, the window will automatically be displayed on
    the host and display set in DISPLAY.


    ```

    -bg <color>

    ```


    Sets the color of the background of the window. Color can either be a name of
    color "gray" or "blue" or as collections of RGB (red, green, blue) values in hex.
    The syntax for this is rgb:h/h/h where h is a number relating to the amount of
    red (in the first slot), green (in the second slot), and blue (in the third slot)
    to make a particular color. The hex number can be one to four characters long,
    depending on the number of colors your X server supports. For example, rgb:0/0/0
    is black, rgb:ffff/0/0 is red. A list of colors that have names is available in
    the /usr11/lib/x11/rgb.txt file. Each entry has the RGB values in decimal (0 to
    255) and a name, which can be used instead of the rgb:h/h/h entry.


    ```

    -fg <color>

    ```


    sets the color of the foreground.


    ```

    -fn <font>

    ```


    specifies the default font to use in the window. You can get lists of the available
    fonts using the xfontsel or xlsfonts programs.


    ```

    -geometry <WIDTH>x<HEIGHT>+<XOFF>+<YOFF>

    ```


    Sets the size and position of the window. For an xterm, this is in terms of characters,
    so a geometry of


    ```

    > -geometry 80x25

    ```


    would create a window that is 80 characters wide and 25 lines long. The XOFF and
    YOFF set where the upper-left-hand corner of the window should be placed. In the
    case of positive XOFF or YOFF, the offset is from the right or top sides, respectively.
    Here''s some example screen placements:


    +   +0+0 Upper-left-hand corner

    -0+0 Upper-right-hand corner

    -0-0 Lower-right-hand corner

    +0-0 Lower-left-hand corner'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'Note that you can enter either a geometry or an offset, but you can''t enter

    only XOFF or width by itself. Both the geometry and the offset have to be

    entered as a pair. That is, you can''t enter


    ```

    > xterm -geometry 80

    ```


    or


    ```

    > xterm -geometry +0

    ```


    but the following will work:


    ```

    > xterm -geometry 80x25

    ```


    or


    ```

    > xterm -geometry +0+0

    ```


    There''s one other way to specify default settings for X programs, and this is

    through the .Xdefaults file. Anything you can set through the command line

    be stored in the .Xdefaults file when you start the program, you don''t

    need to give all the options. These options are known as resources.


    # 16.6 X RESOURCES


    An X resource can consist of four item types:


    program.widget[..].resource: value


    where:


    program: Program name

    widget: One or more levels of widgets, which are sub-portions of the win-

    dow. A widget can be a button, menu, scrollbar, option list, and so on.

    resource: The "least common denominator" of the widgets. The resource

    be used by more than one program. For example "geometry" is

    used by all X programs and is a resource.

    value: What the resource gets set to. Can be a number, boolean (true or

    alse), color, or some other value. It depends on the resource.


    Any text from a ! to the end of the line is commented out.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# Chapter 16 • X Windowing System


    To get from the most-specific widget (program) to the least-specific widget (resource)
    the widgets must be combined. These combinations can be specified by either a
    period or a star. A period indicates a tight binding and a star (asterisk) represents
    a loose binding.


    In a loose binding, the link between two widgets does not have to be direct, and
    it acts almost like a regular expression in Gray. That is, you can have an entry
    such as


    ```

    *geometry: 80x25

    ```


    This would say that all geometry settings are 80x25. While this is good for text-based
    programs, a graphical application with a setting of 80x25 pixels would be rather
    small indeed. If you have a particular program, you can then become more specific.
    That is, if you want all programs that use the vt100 widget to have a geometry
    of 80x25, you can make the setting like that


    ```

    *vt100.geometry: 80x25

    ```


    And you can get even more specific. Say that you want your terminal emulators
    to have a size of 80x25, and you want your Seyon² emulator to have a size of 80x40.
    Then you would have two settings of


    ```

    xterm.vt100.geometry: 80x25

    Seyon.vt100.geometry: 80x40

    ```


    Here you have tight bindings. The Seyon program uses the vt100 widget, which sets
    then the geometry. Using a loose binding for Seyon,


    ```

    Seyon*geometry: 80x40

    ```


    This would cause all of the windows that Seyon creates to be 80x40. Since Seyon
    creates a few graphical-based windows, this would bring back graphical windows
    that are 80 pixels by 40 pixels.


    Note that you can replace tight bindings with loose bindings. The following two
    entries have identical effects:


    ```

    Seyon.vt100.geometry: 80x40

    Seyon*vt100.geometry: 80x40

    ```


    Here are few sample entries that apply to the xterm:


    ```

    xterm*scrollBar: true    Turn on the scroll bar on the left side

    ```


    > ² Seyon is a terminal emulator.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# 16.7 APPLICATIONS


