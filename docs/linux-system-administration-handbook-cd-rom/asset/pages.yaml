    # Setting Up an NIS Master Server


    Once again, your distribution likely came with NIS server programs or you can
    fetch them from kernel.org or any Linux distribution site.


    Compile the NIS software if you need to. Then edit /var/yp/Makefile to add or
    remove the maps you will be serving.'
