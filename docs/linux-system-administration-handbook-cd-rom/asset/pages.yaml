- pgno: 242
  md: '# # X Windowing System 16


    Giving a nice front end to Linux.


    The X Window System (or just X if you like) is a windowing system designed to
    give a GUI to UNIX.


    The implementation of X for Linux is XFree86, and it is almost always included
    in a normal Linux installation. The power behind X is that you can change just
    about any operation of the interface, from the size of your xterms to the way
    menus are presented and the contents of the menus. There''s even an interface
    that closely resembles Windows 95.


    # ## 16.1 X Concepts


    The idea behind X was that you have a client/server setup. The server is really
    an X protocol server on the user''s console. The server then talks to clients
    (like a window manager and applications) and puts them on the screen.


    The configuration file for XFree86 is called XF86config. It can be located in
    any number of places including /etc, /usr/X11/lib/X11, or'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'even /. Check your installation for the location. This file contains setup

    information for your mouse, the video card you''re using, and the type of

    display (monitor) that you''re using.


    The programming for XFree86 allows you, as the user, to set your monitor

    or your video card to much better resolutions than you can get by default

    through Windows or other graphics array (VGA) modes. The default\modes(640X480,
    800X600, and 1024X768) are still available, and relatively

    easy to set up. To get custom modes, you will need some information about the

    video card (the type of card it is and dot clocks), and some information about

    your monitor (video bandwidth, horizontal frequency, and vertical fre-

    query). Then you''ll need to check the XFree86 documentation about how

    put it all together.


    # 16.2 Setting Up X


    To set up your X System configuration with default modes, make sure your X

    server is installed. For normal VGA modes, this is the X_VGA file. Going

    from there, the Mach32 server is called XF86_Mach32, and S3 server is

    called XF86_S3, and so on. When you do your installation, you may have

    asked for the type of video card you had. In this case, you can select the

    server for your particular video card. You may also want to include the regu-

    ar VGA file just in case.


    The xf86config program will allow you to set up some default video modes.

    Starting the program as root gives a few configuration screens and some text

    to read. Then you get into the configuration section. Select your mouse type

    (Microsoft, MouseSystems, But, etc). The preference here is to select a

    three-button mouse, since will allow you to use all three buttons. If you

    select a two-button mouse, you will need to hit both the left and right mouse

    buttons to simulate the middle button.¹


    The next options depend on the type of mouse you selected. If you won''t need
    to select

    Emulate3 Buttons. Next you''ll need to enter the location of the mouse,

    which may be /dev/mouse. If /dev/mouse doesn''t exist, enter the /dev file

    that has your mouse on it. Remember that COM1: under DOS is /dev/

    tty0 under Linux, and so on. A few other options may follow, including

    using the ALT key as the "Meta" key to generate characters normally

    available on your keyboard.


    > ¹ When you see “Emulate three Buttons” later on, this is what it''s talking
    about.'
