    # Configuring LILO


    Once you have Linux started the way you want, there is a way to HAVE LILO add
    your favorite options each time you boot. The /etc/lilo.conf file contains information
    that LILO uses each time it starts. This is where the operating systems you want
    to boot are configured. Here''s sample lilo.conf file.


    ```

    # Tell LILO to install itself as the primary boot loader on /dev/hda boot = /dev/hda

    # The boot image to install; you probably shouldn''t change it install = /boot/boot.b

    ```


    ```

    # The stanza for booting Linux image = /vmlinuz # The kernel is in /vmlinuz label
    = linux # Give it the name "linux"

    root = /dev/hda2 # Use /dev/hda2 (first drive, second partition)

    ```


    ```

    # as the root filesystem

    vga = ask # Prompt for VGA mode

    append = "hdc=cdrom" # Tell Linux that the third IDE drive is # really a CD-ROM

    ```


    ```

    # The stanza for booting MS-DOS other = /dev/hdb1 # This is the MS-DOS partition

    label = msdos # Give it the name "msdos"

    table = /dev/hdb # The partition table for the second drive

    ```


    In the above setting, the first section (the boot and install lines) configure
    LILO itself. The boot line tells LILO where to install. Since it''s the first
    drive, LILO gets configured as the primary loader. If you have another boot loader
    as the OS/2 boot loader or System Commander, you can configure LILO to use the
    Linux root partition to be a secondary loader. In this case, set the boot line
    to be the root partition of LILO. In the above case, that would be /dev/hda2.
    You could also take references to other operating systems, since the primary boot
    loader would handle booting to other operating systems.


    The section for Linux handles all the configuration options mentioned in the previous
