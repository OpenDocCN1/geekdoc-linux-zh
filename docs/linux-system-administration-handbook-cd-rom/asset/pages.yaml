    other utilities, and the graphical X Window System. It requires 71 MB of free
    space.

    - Small standard system (commonly required packages). This installs commonly used
    utilities, the graphical X Window System, and the desktop interface. However,
    it does not include some development tools, additional utilities, and Internet
    services. It requires 104MB of free space.

    - Standard system. This is the default installation for OpenLinux . This installation
    includes the graphical desktop and other development tools, and so forth. It requires
    266 MB of free space.

