    ODBMS—Object-Oriented DBMS.


    # 13.1 MySQL and mSQL


    These servers are often mentioned together as they developed somewhat in parallel,
    and MySQL was initially based on mSQL. Both are used for similar tasks, as well.


    # mSQL


    mSQL stands for mini-SQL, a shareware database server (free for non-commercial
    use). It supports, as its name suggests, a subset of the normal SQL specifications.
    Additionally, it has extensions to SQL. Before we go any further, it is probably
    best to list what mSQL can''t do, so you can decide if it''s worth your while
    to use it for your particular application.


    +   • There are no grants database or “logging in” to the database. Access is
    granted to users listed in /etc/passwd to read and write on a per database basis.


    +   • Databases can be accessed locally via a UNIX domain socket or remotely via
    a TCP/IP socket. If you grant TCP/IP access to a database, the username you do
    so for all usernames, even though the remote host is not necessarily the same
    person as the local system. There is no method for fine-grained remote versus
    local access control.


    +   • It does not support the Binary Large Object (BLOB) data type and is thus
    not suitable for storing large blocks of data.


