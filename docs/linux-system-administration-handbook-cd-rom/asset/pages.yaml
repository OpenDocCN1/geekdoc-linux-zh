- pgno: 156
  md: '# 10.6 Newsfeeds


    Typically news.daily removes old articles from the news server, rotates logs,
    and sends reports but it can be configured to each individually. news.daily program
    takes several keywords as arguments, but we will only discuss the most commonly
    used flags.


    If news.daily is running more than once a day, the flag "notdaily" can be specified
    for one or more of the cron runs so that log processing and rotation only get
    done once. The "norotate" argument only specifies that the news logs should not
    be rotated. If the logs are not rotated every time, you will see duplicate information
    in the subsequent reports. The argument "noexpire" can be used to specify that
    no old article removal should be done, and the argument "nomail" specifies that
    no reporting mail should be sent to the newsmaster.


    # Article Expiration


    If expiration is being done, the "expire.ctl" file is consulted by the "expire"
    process to determine which articles should no longer be kept on disk upon their
    age logged in the history file. The "expire" program oversees the removal of the
    articles and calls other programs that do the removal and updating of the history,
    overview, and active files. The "expireirm" program is a script that calls `fastrm`
    to remove the articles listed in the file specified as the argument. By default,
    expire uses the "expire.list" file in the news log directory.


    The expire.ctl file tells the INN software how long to remember MessageIDs in
    the history file and after how many days in certain newsgroups or hierarchies
    should be removed. The news article removal can also be based on the type of group,
    whether it moderated (M), unmoderated (U), or all (A) groups. The first field
    of the colon-separated entry in the expire.ctl file is the wildcard match on the
    newsgroup name. The second field is either M, U, or A as matches the description
    above. The third field is the minimum time the article should be kept if its expiration
    header claims otherwise. The fourth field is the default number of days that an
    article with no overriding expiration header should be kept, and the fifth field
    is the date at which articles will be purged. To expire all newsgroups in the
    alt.binaries hierarchy quickly because of space issues, put the following line
    in the expire.ctl file:


    ```

    alt.binaries*:A:2:3:5

    ```


    Several arguments to news.daily determine how and when articles are removed during
    the article expiration process.'
