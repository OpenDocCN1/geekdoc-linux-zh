    \ MIME\n\nWhen SMTP was first designed, it would handle only 7-bit (plain ASCII)\n\
    data. Hence, the “Simple” in the protocol name. With things like JPEG\nimages,\
    \ sound files, application data, and compressed data, there had to be\nsome way\
    \ of sending this binary (8-bit) data through a 7-bit stream. The first\nmethod\
    \ of handling this was via the uuencode program. This program would\nturn 2 bytes\
    \ of 8-bit data into 3 bytes of 7-bit data. The file size was larger,\nbut it\
    \ would now squeeze through the 7-bit path that SMTP provided.\nAnother problem\
    \ besides the file size was that the remote side had to decode\ndata (undecode).\
    \ This turned into a tedious procedure, the sender encoder-\ning the data and\
    \ manually including it in a mail file and the receiver trying to\nstrip out all\
    \ the mail headers, text, and signatures to get to the uuucode file\n then decode\
    \ it.\n\nIn the early 1990s, the Multipurpose Internet Mail Extension (MIME)\n\
    was developed to do this, and it is used today on the Web for determining file\n\
    types. MIME encoded the data such that a standard way of locating and\ndecoding\
    \ a file would be used. Once a filetype was detected, each individual\nuser could\
