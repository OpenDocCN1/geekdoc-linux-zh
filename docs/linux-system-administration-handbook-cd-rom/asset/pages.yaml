  md: '# 13.2 Other Native Linux DBMSs


    This SQL server is aimed at higher-end applications and larger businesses.

    A free evaluation copy is available. Client software for non-Linux/UNIX systems
    is available, too.

    Solid supports a number of things you''d expect of a high-end server:


    +   - On-line backups (i.e., the server remains running and a “snapshot” is saved)

    - Crash and power failure recovery to last checkpoint

    - Fine-grained access control (at a similar level to MySQL’s)

    - Open Database Connectivity (ODBC)

    - Automatic crash recovery

    - Symmetric Multiprocessing (SMP)


    Solid’s manuals are available on HTML.

    Solid is designed to require a minimal amount of administration. It is easy to
    set up and more runs itself. System requirements are minimal: a couple of Mb of
    disk space and a Mb of free RAM.

    Pricing for Linux is considerably less than other systems. As of this writing,
    Solid Technologies is offering the desktop version (single-user, only UNIX socket
    connections) free for Linux.

    Information on Solid can be found at http://www.solidtech.com.


