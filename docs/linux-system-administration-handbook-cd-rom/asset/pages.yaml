  md: '# 17.2 Software Security


    only with programs that are typically started with the inetd program. This includes
    telnet, finger, ftp, talk, and a few other programs. You can customize so no one
    can telnet in, but anyone can finger the machine (for example). It also allows
    for RFC 931 lookups, which can report on what user is on the remote machine using
    tcpd for allowing or disconnecting connections, the access control is the same.
    In fact, the man pages for hosts.allow and hosts.deny is the same page. The way
    to set up an access control is by following this pattern:


    ```

    daemon_list : client_list [ : shell_command ]

    ```


    The daemon list is the name of the program that is running (telnetd, ftpd, and
    so on). The client list can be any of the following:


    +   * Strings with a. are assumed to be part of a domain (.wayga.net would be
    any host in the wayga.net).

    * Strings ending with a. are assumed to be an IP address net or subnet (128.55.213.
    would be all the machines that start with that IP address).

    * A string starting with @ is assumed to be an NIS netgroup (@hosts all be hosts
    defined in the NIS netgroup).

    * n.n.n/n.m.m.m is a net and mask pair. This gives a bit finer control over the
    above for matching IP addresses.


    There are also a few special keywords:


    +   * ALL—This matches everything.

    * LOCAL—All hosts that do not have a dot (.) in the hostname, since local hosts
    do not typically use the FQDN.

    * UNKNOWN—A user whose name is not known (RFC 931 checking) or a host name or
    IP is unknown.

    * KNOWN—Reverse of unknown—a user whose name is known, and both the name and address
    are known.

    * PARANOID—Any host whose reverse DNS does not match the host name''s using. Sites
    with multiple domains may run into this if the reverse DNS and hosts are not synced.


    The access control also accepts the word EXCEPT to give something like the following:


    ```

    192.55.242. EXCEPT PARANOID

    ```'
