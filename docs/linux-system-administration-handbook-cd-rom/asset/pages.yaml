- pgno: 35
  md: '# 2.3 init


    The /etc/initab file is read by init which which tells it what init level to start
    on, and what processes to start. This would include programs like getty (which
    is what gives you the login prompt on the console). Other scripts are run based
    on what runlevel you''ve entered.


    An entry in the /etc/initab file has four fields:


    ```

    10:0:wait:/etc/rc.d/rc0

    ```


    The fields are delimited by colon. The first field is unique to the file and is
    just an arbitrary two-letter(- -digit) sequence. The second field tells init what
    runlevel to reference this field on. In this case, it''s runlevel 0. The third
    field is an option on what to do while the script is running. Since you don''t
    want to cause problems by having multiple runlevel change scripts running at once,
    init will wait until the script has finished before running any other scripts.
    Other options include “respawn” which will restart the process if it dies or stops
    (for getty), and “once” meaning that the process should run only once and never
    again. The fourth field lists the script or process to run. I''ll get into how
    these scripts work below.


    # 2.4 What''s a Runlevel?


    The runlevel of the machine determines what functionality the system should be
    providing. Just as Windows 95 provides a “safe mode,” UNIX has a singleuser safe
    mode, plus other configurations available:


    | Runlevel | Functionality |

    |--- |--- |

    | 0 | Halt |

    | 1 | Single-user mode |

    | 2 | Multiuser, no NFS |

    | 3 | Multiuser, with NFS |

    | 4 | Unused |

    | 5 | X11 console (xdm)a |

    | 6 | Reboot |


    > a. In Solaris 2.x, runlevel 5 will power down the system. It won''t do that
    in Linux'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# 2.4 What''s a Runlevel?


    Two of these runlevels are really for stopping or rebooting the machine. Runlevel
    1 allows only root to log in, and only the root partition is mounted. This is
    primarily for emergency situations where one of the other partitions is corrupted.
    The default runlevel for RedHat 4 is 3, which is a typical multiuser system, and
    starts the network file system daemons as well. If you''re not using NFS, you
    can use runlevel 2 if you need.


    The first script that gets run by init, no matter what runlevel you''re using,
    is the /etc/rc.d/rc.sysysint script. This script activates swap partitions, checks
    the filesystem consistency on any partitions it''s about to mount, and a few other
    functions we won''t worry about yet. In short, the rc.sysysint script runs all
    the programs that would be required no matter what runlevel you''d be using.


    Once the sysysint script completes successfully, it goes on and calls the /etc/rc.d/rc
    script with an option being the number of the runlevel to enter (0-6). Here''s
    where things get interesting.


    Under the /etc/rc.d directory are six directories called rc.[0-6]. Each directory
    has a number of scripts that start with either a K or an S, a two-digit number,
    and a program name. The S is for start scripts, and they run when init enters
    runlevel. This is for starting programs that are specific to that runlevel. The
    K is for kill scripts, and they do the reverse of the S scripts, killing any programs
    that are not in runlevel. The numbers give an order to the apparent chaos, as
    scripts with a lower number are executed, allowing the networking software to
    initialize the Ethernet card before the NFS daemons try to start. In all this,
    the name is just a descriptive one to the user. Kill scripts are run before start
    scripts.


    All these scripts are links to the /etc/rc.d/init.d directory, which contains
    the master of all the scripts. This allows one master script to not only control
    starting and killing processes but also allows you to find all the scripts in
    one location.


    You can change your init level on the fly using the telinit command.the runlevel
    you want to go to. This has to be as root, since you don''t just want anyone dropping
    your system into single-user mode or making it reboot. telinit will handle running
    all the scripts to kill or start new processes.


    > telinit is really just a link to init, so you could use init <number> instead.'
  merge: -1
  img_proc: true
