    # # Linux on Sparc


    We had the opportunity to install RedHat on a Sparc SLC for testing. The SLC is
    a low-end machine, probably slower than a 286. The system we used had 16 Mb of
    RAM and a 200 Mb hard drive. The surprising thing about the installation that
    it was almost exactly the same as tdoing an install for Linux on Intel, even installing
    the hard drives as /dev/sda and /dev/sdb as you see in the Intel counterpart.
    After booting, virtual consoles come in that the boot loader is called SILO (Sparc
    Linux Loader), but provides the same capabilities as LILO. Also, the commands
    were the same. The configurations for XFree86 are a lot more limited, since Sparc
    has only a few graphics cards available, and the SLC has only a black-and-white
    display. At the time of this writing, Linux isn''t completely working on the Ultra
    architecture, but the kernel does boot and a few small programs are working. The
    sun4c and sun4m architectures work fine with S/Linux.


    # # 22.3 Updating Your System


    We''ve talked a little about upgrading, mainly in the context of what distributions
