  md: '# 98 Chapter 7 • E-mail


    +   - Qmail also does not use /etc/aliases at all. There is a global way of setting
    up E-mail aliases, which is a bit easier to use. The alias user is used by q-mail
    to handle addresses that don''t exist. For example, you could have \~alias/.qmail-markk
