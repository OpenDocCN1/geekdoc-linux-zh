- pgno: 221
  md: '# A Note on Other Information Services


    The Web’s popularity has forced many other information services into the background
    or, in some cases, into obsolescence. Notables include Gopher, WAIS and Archie.
    Consequently, we make no effort to cover them in this book and refer the curious
    to either the Web or any of a number of texts covering-''Internet information
    services.''


    # 15.1 Web Server Software


    There are a number of Web servers (HTTP daemons) available for Linux as both commercial
    and/or free- shareware. Additionally there is the choice of using a secure server
    versus a non-secure server. The difference between the two is the use of SSL (Secure
    Sockets Layer, a protocol for encrypting/decrypting data via a network socket).
    Secure servers use it, insecure ones doesn''t. Typically, non-SSL servers are
    free- share, while those employing SSL are commercially developed and cost several
    hundred dollars.


    In addition, a Web server can be forking or non-forking. Traditionally, HTTP daemons
    fork off child processes to handle incoming requests. Each child can typically
    handle a hundred or so requests, but it handles them seriously; this means that
    heavily loaded servers may need to have a large number of child processes, each
    of which takes up additional RAM and CPU. In a server with a large httd binary
    (especially a secure server) this can cause problems. The alternative is to have
    a server that multiplexes incoming connections internally. Typically this approach
    has yielded servers with impressive performance.


    Now RAM has been and looks to remain inexpensive and CPU performance has been
    increasing by leaps and bounds, so one may be inclined to question whether a multithreaded
    server is worth the effort. However, it has certainly been one of the main aims
    of Linux to get as much out of a computer’s hardware as possible, which obviously
    writing efficient software. This said, there are no non-forking servers which
    equal the extensibility of the best of the forking servers. It seems likely, though,
    that soon the extensibility of the servers like Apache and the multiplexing of
