  md: '# Chapter 23 • Connecting to the Internet


    manent connection to the Internet, but the users on the network will not have
    to dial a modem or remember to disconnect when finished. What they will see is
    a momentary pause (between 15–60 seconds); depending on your modem and ISP) upon
    initial connection to an outside machine. Over a 33.6 Kbps modem, three or four
    people using a Web browser at once quite adequately (assuming non-graphic intensive
    tasks, with the users randomly clicking on links. The idea is that most of the
