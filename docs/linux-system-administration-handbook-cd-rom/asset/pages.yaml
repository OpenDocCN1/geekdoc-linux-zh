- pgno: 274
  md: 'nections open up, until eventually the machine crashes or is made unusable.
    Linux also has some protections against this attack, but since SYN and ping are
    both in the standard (and heavily used), there is not a whole lot that can be
    done.


    Another type of attack involves sending so much E-mail that it floods the mail
    partition. Linux usually stores its E-mail in /var/spool/, which is usually part
    of the root partition (/). /tmp directory is also part of the root partition.
    You should get so much E-mail that root fills up, then /tmp can''t store any temporary
    data. This can then cause crashes of various programs, such as vi, that depend
    on having access to /tmp. This can potentially cause a kernel crash. The moral
    here is twofold: Make /tmp a mounted directory, and make /var a mounted directory
    as well. Also have frequent monitoring of the mail files to make sure the partition
    isn''t filling up quickly. Some users may need to be cleaned out their E-mail
    every few weeks. My E-mail typically swells to about Four Mb per month. I then
    saved the entire month to a file in my home directory and compress it to save
    space.4MB per month 30 users is 120 MB /var partition, plus other files such as
    log files go in /var.


