    +   - Put the installation diskette in your floppy drive and restart your computer.


    # D.3 Problems Using Very Large Hard Disks


    Using very large hard disks in PCs can lead to problems because of the limitations
    of the BIOS and IDE standards on which most PCs are based. Problems arise because
    the BIOS can manage only hard disks with a maximum of 256 heads, 63 sectors, and
    1024 cylinders because the IDE standard is based on a model that specifies the
    Cylinders, Heads, and Sectors of the hard disks (CHS model), but only allows a
    maximum of 16 heads, 255 sectors, and 65536 cylinders. The lowest limits of both
    of these combine to give a maximum size for standard hard disks of 504 MB (16
    heads, 63 sectors, and 1024 cylinders).


    The newer Enhanced-IDE (EIDE) standard avoids this limitation by not using the
    CHS model. Instead, a Logical Block Addressing model is used (LBA). This model
    numbers all sectors on the disk sequentially.


    Newer BIOS versions overcome the 504-MB limitation by using an Extended CHS model
    that extends the maximum number of heads to 256. The new upper size limit, from
    the Enhanced IDE and Extended CHS models, is almost 7.9 GB.


    Linux does not use the BIOS to access your hard disk, so IDE and EIDE hard disks
    should not cause problems on Linux systems. If problems occur, Linux might be
    obtaining incorrect disk size parameters from the BIOS. To correct this problem,
    use boot parameters to pass the correct information to Linux. The parameter totopass
    "hdx=cyl,heads,sect," where hdx'
  merge: -1
  img_proc: true
- pgno: 383
  md: 'is the hard disk device (hda, hdb, hdc, hdd). More information is provided

    below on using these parameters to create cylinder counts of less than 1024.


    # SCSI Hard Disks


    In general, all SCSI hard disks use the LBA mode mentioned above. SCSI

    hard disks do have a separate problem that EIDE hard disks do not have,

    however. SCSI hard disks larger than 1 GB must have special treatment with

    the “fdisk” utility and while configuring the LILO boot manager. If Your

    SCSI hard disk is affected by this problem, “fdisk” will display messages

    regarding the problem when you prepare your hard disk. The expert mode of

    “fdisk” can be used to correct the SCSI problems. The LILO problems are

    fixed by adjusting the “etc/diskstab” file. Both of these fixes are described

    elow with example.


    # Why the Problem Arises


    The problem with these larger hard disks is that the partition table must be

    read before any operating system becomes active. The partition table is

    accessed via the BIOS, which is limited to 256 heads, 63 sectors, and 1023

    cylinders. Because of this, the hard disk controller attempts to convert (or

    translate) the true parameters of hard disks with more than 1023 cylinders

    values that can be accepted by the BIOS.


    The partition table itself can always be found at the first cylinder, first sec-

    tor, and first header (which is the same in any translation); because of this

    translation from the controller, if all data for the boot process (such as the

    boot loader and operating system kernel) are not found in the 1024 cylind-

    ders, the BIOS cannot successfully boot the system.


    Partions can be created above 1024 cylinders, but you cannot boot these

    partitions because boot data in those high partitions cannot be accessed until

    after the system is booted. This only causes trouble when a system has multi-

    operating systems, and the user attempts to choose which to boot.


    A work-around solution is to create a small Linux partition below 1023 cylind-

    ders can be used to boot the Linux system. This partition can be as little as

    15 MB, because it only needs to contain the kernel and the root filesystem. The

    “usr” directory and other information can be stored in a second Linux partition

    located above 1024 cylinders. Use the “fdisk” utility of another operating sys-

    tem such as OS/2 to create these partitions. Then use the Linux “fdisk” during

    installation to mark the partitions as Type 0x83, Linux.'
  merge: -1
  img_proc: true
- pgno: 384
  md: '# D.3 Problems Using Very Large Hard Disks


    A better solution is to enter the correct combination of cylinders, sectors and
    heads that the hard disk controller is passing to the BIOS. Use the "fdisk" expert
    mode, as described below. The following diagram shows an example of the translation
    of the physical values of the hard disk to LBA direct block addressing, which
    is finally used by the operating system to access the hard disk.


    On the left, you can see that the physical layout of the hard disk is very different
    from the logical (LBA) values reported. Most hard disks have significantly fewer
    heads than externally reported. The logical values reported by the hard disk should
    conform to the limitations of IDE or BIOS. In the case of an EIDE or SCSI controller,
    the controller itself will do another translation.


    SCSI hard disks are usually reported as 64 heads and 32 sectors, giving a size
    of "64*32*512 Bytes = 1 MB per cylinder. EIDE*32*255 heads. The last translation
    is done by the operating system itself. Linux uses Logical Block Addressing (LBA)
    to refer to the blocks sequentially from the first block to the last block on
    the hard disk.


    Many controllers use two different models in order to provide cylinder numbers
    under 1024. In most cases, the controller first tries to double the number of
    heads. If this does not result in a cylinder count less than 1024, the controller
    increases the actual values for heads and sectors to the maximum possible number
    to minimize the number of cylinders. This process is used, for example, by the
    Extended Translation of the Adaptec controllers AH 274x/284x/294x. The NCR controller
    uses a variant by which the number of heads and sectors is chosen to provide the
    correct size while being within the 1024 cylinder limit. Overlap between partitions
    is thereby minimized because each partition begins and ends on a cylinder boundary.


    The translation by an Adaptec controller of a 4-GB disk gives a count of 255 heads,
    63 sectors, and 522 cylinders.


    Your task is to find out the translation that the controller is doing and enter
    the values that passes for the hard disk into the expert mode of "fdisk." As you
    do, remember that the total size of the hard disk must remain constant.


    For example, assume that we have a computer with a 4-GB SCSI hard disk. This is
    more than 1024 cylinders, so "fdisk" gives a warning during installation:


    +   The number of cylinders for this disk is set to 4095.

    This is larger than 1024, and may cause problems with:


    1. software that runs at boot time (e.g., LILO)

    2. booting and partitioning software form other OS (e.g., DOS DISK, OS/2 DISK)'
  merge: -1
  img_proc: true
