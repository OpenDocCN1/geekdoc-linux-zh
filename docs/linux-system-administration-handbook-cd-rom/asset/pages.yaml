    will often have a narrow and a wide connection for internal use.

    - Does the device have a unique ID on the bus? Remember that controller has an
    ID as well, typically 7 but 6 is not unheard of.

    - Make sure your new disk isn''t terminating the bus. If your bus was fine before,
    its termination should work with the new drive in place.

    - If you are using a cable that came with a disk and another you know is good,
    try the drive on the good cable. If it works, the new cable is very likely bad.'
