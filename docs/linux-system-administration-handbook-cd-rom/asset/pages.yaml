- pgno: 94
  md: '# 5.5 Network Information Services (NIS)


    ```

    #

    # /etc/nsswitch.conf

    #

    # An example Name Service Switch config file. This file should be

    # sorted with the most-used services at the beginning.

    #

    # The entry ''NOTFOUND=return'' means that the search for an

    # entry should stop if the search in the previous entry turned

    # up nothing. Note that if the search failed due to some reason

    # (like no NIS server responding) then the search continues with the

    # next entry.


    # Legal entries are:


    nisplus         Use NIS+ (NIS version 3)

    nis               Use NIS (NIS version 2), also called YP

    dns             Use DNS (Domain Name Service)

    files             Use the local files

    db               Use the /var/db databases

    [NOTFOUND=return] Stop searching if not found far


    passwd:          compat

    group:           compat

    shadow:          compat


    passwd_compat: nis

    group_compat: nis

    shadow_compat: nis


    hosts:           files dns


    services:        nis [NOTFOUND=return] files

    networks:        nis [NOTFOUND=return] files

    protocols:       nis [NOTFOUND=return] files

    rpc:             nis [NOTFOUND=return] files

    ethers:          nis [NOTFOUND=return] files

    netmasks:        nis [NOTFOUND=return] files

    netgroup:        nis [NOTFOUND=return] files

    bootparams:     nis [NOTFOUND=return] files

    publickey:      nis [NOTFOUND=return] files

    automont:       files

    aliases:         nis [NOTFOUND=return] files

    ```


    # NIS+


    NIS+ is Sun''s successor to NIS. It has better security and handles large numbers
    of clients. Unfortunately, support for NIS+ under Linux is limited to the'
