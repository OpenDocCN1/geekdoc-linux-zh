- pgno: 246
  md: '# 16.3 xdm


    Once you enter the startx command, you should see some text fly off the screen.
    The screen will change to a graphic screen and a mouse cursor. The look here can
    be changed based on a few things.


    # 16.3 xdm


    The xdm program is a graphical login window, instead of the regular text-based
    login and password prompt most UNIX users are familiar with. It''s better for
    use with newer users or in a lab environment, since the user doesn''t have to
    issue any commands to start X running. You can automatically have xdm start on
    boot by changing the default runlevel to 5 and rebooting.


    # 16.4 Using the X Window Managers


    The way that X looks is determined by two things: the contents of the window and
    the window manager. The windows merely interact with the X server and there is
    no real way of moving the windows around the screen, or resizing the windows.
    This is where the window manager comes in. The window manager places a border
    around the window and can provide maximize (full-screen) or minimize (iconize)
    buttons. The window manager also allows you to resize, move, or kill windows.
    The window manager also provides for menus and the general “look and feel” of
    the X display.


    There are a few different window managers available, such as twm, fwm, olwm, and
    the commercially available mwm. Each window manager has its own look, and mwm
    has its own header files and libraries to use some extra functions not present
    in the other window managers. The overlook window manager also has its own extra
    libraries and interface. The two remaining window managers, twm and fwm, have
    their specific window borders and default options.


    ```

    twm.tif, fwm.tif, mwm.tif and fwm95.tif

    ```


    Even though the windows look different, they perform many of the same functions.
    One advantage that fwm provides for virtual desktops. That is, you can have more
    than one main window (also called the root window) available to you at one time.
    This lets you have a neater desktop, or it can let you open more windows and be
    able to see all of them.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '226


    Chapter 16 • X Windowing System


    # MWM


    ![](img/cd7585e53abd949068548271c07fcdd8_247_0.png)


    Figure 16–1 The Motif Window Manager


    Motif is really a group of widgets that make for a common look and feel for programs.
    The Motif Window Manager (MWM) is one of the programs behind the Common Desktop
    Environment (CDE) which is trying to give a standard interface to all UNIX workstations.
    The downside to Motif is that it''s commercial. The upside is that you don''t
    need to purchase Motif to use programs that were built using it. Programs compiled
    using Motif libraries can be copied freely.


    # FVWM


    The Feeble (Fine?)—no one knows what the F stands for anymore) Virtual Window
    Manager (FVWM) is one of the most popular window managers around. The program
    itself is relatively small; it comes with a lot of features from virtual windows
    to menu buttons. You can also set it up so specific programs start only on a certain
    virtual window.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# 16.4 Using the X Window Managers


    # FVWM2-95


    ![](img/cd7585e53abd949068548271c07fcdd8_248_0.png)


    Figure 16–2 The fwm2-95 program


    The fwm2-95 program is an extension of FVWM which has a Windows 95 look and feel.
    However, the interface is much more configurable. You have the advantages of the
    task bar and start menu, but you get additional features such as “focus follows
    mouse” where the current window is wherever the mouse is. You also get the advantage
    of configuring all the mouse buttons however you like. This is the most popular
    window manager for those coming from the windows environment it''s so familiar.


    The nice advice, though, is that fwm2-95 doesn''t crash.


    .fwm2rc (or .fwm2rc95) file contains startup information for FVWM. Many of the
    commands are similar between fwm2 and fwm2-95. Since for our purposes the two
    window managers are rather similar, we''ll use .fwmrc to talk about both the .fwm2rc
    and .fwm2rc95 files.'
  merge: -1
