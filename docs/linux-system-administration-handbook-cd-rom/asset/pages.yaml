  md: 'canonical way to talk to a scanner via Linux is an adaptation of the xv program
    known as xvscan. Xvscan is a commercial program that is available for $50 from
    tummy Ltd. (http://www.tummy.com/xvscan/).


    Typically SCSI scanners will come with their own, low-grade SCSI card. Unless
    you are running out of SCSI IDs, it is not going to be worth your while to attempt
    use Linux to talk to the scanner through this controller, assuming a Linux driver
    exists for it.


    Your kernel will need to have the generic SCSI driver compiled in it or as a module.
    You will need to check and possibly set the SCSI ID of your device. The device
    responding to the scanner will then be /dev/scsi[a-f]. Here "a" would be a SCSI
    ID of 0; "b" would be 1; and so on up to "f" which would have an ID of 6.


    xvscan communicates with the scanner via /dev/scanjet, so you will have to create
    a link to the device or a copy of it. Also, you will need to modify the permissions
    of the device to be able to access the scanner.


    Assuming your scanner''s SCSI ID is 3, its device entry is


    ```

    crw-rw-rw- 1 root sys 21, 3 Aug 28 00:12 /dev/sgd

    ```


    To set up a copy of the device to users in the scanner group, issue the following
    commands as root:


    ```

    # mkmod /dev/scanjet 21 33

    # chgrp scanner /dev/scanjet

    # chmod 660 /dev/scanjet

    # ls -1 /dev/scanjet

    crw-rw-rw---- 1 root scanner 21, 3 Aug 28 00:15 /dev/scanjet

    ```


    # 21.2 Modems


    There are a number of reasons you might want to attach a modem to your machine:


    +   - Faxing—incoming and outgoing

    - Backup (or primary!) network connection

    - Dial-up for remote access


    If you have an external modem, the only issue you have to worry about having the
    serial port driver available. If you have an internal modem, which adds its own
    serial port to your machine, you may run into IRQ problems.'
