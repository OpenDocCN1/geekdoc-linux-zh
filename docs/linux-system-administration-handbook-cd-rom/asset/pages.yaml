    # Installing MySQL


    MySQL is free in almost every circumstance, the one exception being if you wish
    to sell it you have to purchase a license. Getting a legal copy of it for your
    use is a matter of FTPing the distribution. The source code is available, or if
    you choose, you can get a Linux binary distribution. Binaries exist for Solaris
    and SunOS, as well as a growing number of other OSEs.


    MySQL''s home page is http://www.tcx.se/, there are numerous mirrors: in the United
    States (http://www.buoy.com/mysql), Australia (http://mysql.blues.com/), and many
    others all listed on the home page. Also on the home page are pointers to MySQL,
    the documentation home page, mailing list and contributed software.


    # Compiling and Installing MySQL


    If you choose to compile it yourself, you will need a multithreading library.
    Under Linux you need the Threads library which comes with most recent versions
    of Linux distributions, RedHat included. You will also need a C++ compiler, presumably
    g++ and lib++ under Linux. Note that lib++ is distributed separately from gcc/g++/obj-c
    just as GNU lib is. Lastly you will need recent versions of gcc, at least 2.7.2;
    GNU make, at least 3.75; and libc, 5.4.12 or glibc, 2.0.2.


    GNU autoconf is used, so there is the common sequence of configure, make install.
    Useful options for the MySQL configure are


    ```

    --prefix=/path/to/mysql/install/base

    ```


    where to install MySQL


    ```

    --localstatedir=/path/to/mysql/datafiles

    ```'
