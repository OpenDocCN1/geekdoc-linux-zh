  md: '# Linux Database Software 13


    # A cornucopia of DBMSs!


    Linux has benefited in the realm of Database Management Systems (DBMSs) by being
    a UNIX-like OS. A number of software vendors have ported their Database (DB) servers
    to Linux. Better yet, a few even have been developed under Linux.


    This chapter actually started as a section, but it got so big and DBMSs are becoming
    such an important aspect of computing, we gave it its own chapter. First, we will
    cover two very popular, lightweight servers in detail. Then, we have a less detailed
    listing of other native database servers. Finally, a couple of databases with
    partial Linux support will round out the chapter.


    This is not an attempt to enumerate every database server for Linux. It is a list
    of the databases we''ve used and/or found interesting. For a more complete listing
    of commercial databases, see the Linux Commercial HOWTO.


    Let''s go over a few acronyms and terms for those who are not very familiar with
    the world of databases.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Chapter 13 • Linux Database Software


    SQL—Structured Query Language, a language for performing queries on relational
    databases—Database Management Servers (DBMSs)


