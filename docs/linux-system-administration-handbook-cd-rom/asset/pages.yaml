    # Procmail


    procmail is installed as the Mail Delivery Agent (MDA) on your system (check the
    Mlocal entry in your sendmail.cf to find out), then you can immediately use procmail
    to filter all your incoming mail. If not, you can put a reference to procforward
    in procmail to run each time new mail arrives. Procmail is used to process mail
    as it comes in. This can include putting all E-mail from the "Plan9 MUSH Advisory
    Committee" in one mailbox from everything else, or filtering that annoying E-mail
    you get from billg@microsoft.com by sending it to /dev/null.


    Procmail is set up to the default local mail handler, setting procmail for use
    is easy. Create a .procmail file and start adding rules for procmail to filter.
    If procmail is not your local mail handler, you have three options:


    +   1. Make the local mail handler (the man page has the suggested changes you
    can make to the /etc/sendmail.cf file). If you''re using m4 configuration files,
    add "FEATURE(local_procmail)" to your file.


    +   2. Run procmail periodically or use cron to filter out an already existing
    mailbox. This allows you to use .forward (in the event of vacation and the like),
    but the mail is not always sorted and you have to wait.


    +   3. Put a reference to procmail in .forward. Note that this won''t let you
    forward all that easily. In the .forward file, put a line that looks like


    ```

    |IFS='' &&exec /usr/local/bin/procmail -f-|exit 75 #YOUR_USERNAME

    ```


    ⁴Anything to /dev/null is immediately discarded. This is called "the bucket."
    Thanks to the fact that Linux is a 32-bit OS, its bit bucket is one of the fastest.'
