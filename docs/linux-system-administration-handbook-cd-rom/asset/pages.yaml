    # 15.2 Hardware Issues


    One of the primary considerations, if you are using a forking server or lots of
    interpreted CGI, is memory. Each server obviously takes up at least as much memory
    as the the size of the executable. Each CGI script requires the loading of its
    respective interpreter. Dynamic linking of the executables can alleviate the problem
    to some extent. There are four subsystems you need to consider beyond the choice
    of a good personal computer-connect (PCI) motherboard, memory, CPU, hard disk,
    and network. The PCI bus has a throughput of 133 Mb/s, several times faster than
    even an ultra SCSI 3 adapter and is thus well equipped to handle fast peripherals.


    However, there is simply no substitute for RAM—Not space (your hard disk is pitfully
    slow compared to on-board memory.), not CPU (if you are swapping to disk, your
    disk is what''s slowing you down), nor a faster network card. RAM is cheap; buy
    a lot of it.


    After RAM, the next most important subsystem is either disk or CPU depending on
    the peculiarities of your site. If you make extensive use of CGI, SSI, or database
    transactions, you will probably want to put a little more CPU in your system.
    Don''t bother with MMX CPUs. There''s really no gain to be had in this situation;
    just get a faster CPU for the same price or put the money into RAM or hard disk.'
