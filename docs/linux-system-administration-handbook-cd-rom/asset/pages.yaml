- pgno: 361
  md: '# C.2 Upgrading from Existing Caldera or Linux Systems


    OpenLinux is an upgrade from Base and Caldera Network Desktop (CND). However,
    you may have personalized these systems with different settings (for example,
    the filesystems that automatically mount at startup). If you want, you can save
    these settings to a floppy diskette and add them to your new system. You may also
    have settings under another distribution of Linux that you want to save.


    This section explains how to prepare your system if you already have a Caldera
    distribution of Linux or another distribution of Linux. This section explains
    how to do these tasks:


    +   - Upgrade from existing Caldera systems.

    - Add Caldera''s commercial packages to other Linux distributions.


    # Upgrading from Existing Caldera Systems


    Before upgrading from an existing Caldera system, you might want to copy certain
    files to a floppy diskette or your network because the Linux partition will be
    re-formatted, destroying all data on that partition.


    Table C-1 lists some files you might want to copy:'
  merge: -1
  img_proc: true
- pgno: 362
  md: '# C.2 Upgrading from Existing Caldera or Linux Systems


    | Table C-1 | Files you may want to copy before installing your new system |

    |---|-|

    | If you want to preserve this | Copy this file or directory |

    | X Windows configuration | /etc/Xaccel.ini or /etc/XF86config |

    | Boot manager configuration parameters (such as boot parameters to recognize
    hardware) | /etc/lilo.conf |

    | IP networking information (such as, hosts, nameserver, and domain name) | /etc/hosts
    and /etc/resolv.conf |

    | Filesystems mounted on your system | /etc/fstab |

    | Names and passwords of all users on your system | /etc/passwd and /etc/group
    |

    | Any home directories for users on system | /home |

    | Any of your user settings | /usr |


    # Adding Caldera''s Commercial Packages to Other Linux Distributions


    You can upgrade to OpenLinux from another Linux distribution. Many users have
    successfully installed Caldera''s commercial packages on other ELF-based Linux
    2.x systems. However, before upgrading, you should know Caldera does not provide
    support for other Linux systems and the upgrade instructions provided here may
    not work on your system.'
  merge: -1
  img_proc: true
- pgno: 363
  md: '# 1. Load a copy of the rpm utility (for example, from the Internet).


    This file contains the RedHat Package Manager utility, which is used to install,
    query, and uninstall all software packages from the Caldera CD-ROM.


    # 2. Install this utility on your Linux system.


    # 3. Enter man rpm to review the man page for the rpm utility.


    # 4. Use the rpm command to install, verify, or uninstall the packages located
    on the Caldera CD-ROM (for example, -i OpenLinux-1.1-8.i386.rpm).


    NOTE: For a list of the available software packages, see “Choosing the Software
    Packages to Install.”


    # C.3 Sharing the Hard Disk


    If you''re planning to run only OpenLinux on your system, you will need only two
    partitions: a default partition of at least 266 MB and a swap partition of at
    16 MB. If you''re planning to run additional operating systems with OpenLinux,
    you''ll need more partitions on your hard drive. For example, you can run OpenLinux
    or Windows 95.


    NOTE: If you''re already using another operating system on your hard disk and
    you''re planning to share it with OpenLinux, you might instead consider using
    a separate hard disk for OpenLinux. That way, you won''t have to back up all the
    data and repartition your current hard disk.


    This section explains how to do these tasks:


    +   - Share hard disk with DOS or Windows.

    - Share hard disk with other operating systems.


    # Sharing Hard Disk with OpenLinux and DOS/Windows


    If you''re already using DOS or Windows on your system, you can share the hard
    disk to use a Caldera system without reinstalling them. To prepare the hard disk
    to use more than one operating system, you must defragment your current data and
    divide the partition. This section explains how to defrag your hard disk if you
    currently have DOS or Windows on your hard disk.'
  merge: -1
  img_proc: true
- pgno: 364
  md: '# C3 Sharing the Hard Disk


    +   1. Boot your computer to DOS or Windows.


    +   2. To move all the data on your system to one area, defagment your filesystem.


    NOTE: Most versions of DOS or Windows have a program to defr your hard disk (for
    example, DEFRAG.EXE or OPTI-MIZE.EXE).


    +   3. To shrink your filesystem, run this file from the Caldera CD-ROM: \COLTOOLS\FIPS15\FIPS.EXE
    (for example, from a com-mand line in DOS, enter d:\COLTOOLS\FIPS15\FIPS.EXE).


    The FIPS utility splits your current DOS partition in half without damaging the
    existing data on the hard disk.


    +   4. Carefully follow the on-screen instructions for the FIPS utility.


    The recommended OpenLinux installation requires at least 266 MB of free disk space.


    +   5. Use FIPS to adjust the size of the DOS partition on your hard drive by
    using the arrow keys on your keyboard, then press enter to set the size of the
    partitions.


    +   6. Confirm the reduced size of the new DOS partition. FIPS writes the new
    partition information to your hard drive. You''re now ready to install OpenLinux.


    # Sharing Hard Disk with OpenLinux and Other Operating Systems


    You must create two partitions to install OpenLinux . If you''re planning to run
    more than one operating system on your hard disk, you''ll need to create additional
    partitions. This section explains how to prepare your hard disk for OpenLinux
    and partition your hard disk.


    Note: If you''re planning to install Windows 95 and OpenLinux, you should first
    install Windows 95. That way, you won''t have to reconfigure LILO and the master
    boot record. (LILO lets you choose the operating system you want to start.)'
  merge: -1
  img_proc: true
- pgno: 365
  md: '1. If you already have an operating system on continuing. your hard disk, you
    should back up the data before continuing. Most operating systems come with utilities
    to back up your system.


    2. Using a hard disk utility on your current system, create enough space for these
    partitions:


    +   - At least 266 MB for the root Linux filesystem (For more specific information
    on the software packages you can install, see "Selecting an Installation Option.")

    - At least 16 MB for a Swap partition

    - Enough space for your current operating system


    3. If necessary, reinstall your current operating system into the new, smaller
    partition that you created. You''re now ready to install OpenLinux.


    # C.4 Installing OpenLinux


    Once you''ve prepared your hard disk by backing up any data and preparing space
    for OpenLinux, you''re ready to install your new system. This section explains
    how to do these tasks:


    +   - Create boot and modules diskettes.

    - Start the installation and recognize the hardware.

    - Change partitions on hard disk.

    - Use the Kernel Module Manager.

    - Choose the partition for OpenLinux.

    - Select an installation option.

    - Do final configuration.


    As you''re installing OpenLinux, you can access other consoles. These consoles
    let you execute other programs as you''re installing OpenLinux. Use the keystrokes
    in Table C-2 to access other consoles:'
  merge: -1
  img_proc: true
