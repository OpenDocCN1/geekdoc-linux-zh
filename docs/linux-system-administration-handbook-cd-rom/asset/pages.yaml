- pgno: 308
  md: '# 21.3 Tape Drives


    Additionally, if the modem has a non-standard chipset, Linux may not recognize
    it.


    In all likelihood you will have to do nothing to get Linux to talk to your modem.
    The one thing needed (serial port support) is always present in the kernel, usually
    for the mouse.


    If you have an external modem attached, it will attach to one of the onboard serial
    ports and should have no problems with IRQ conflicts. If you are installing it
    internally and have an IRQ conflict, there are a couple of ways of resolving it.


    +   1. If you are not using both of your built-in serial ports, disable one of
    them in the BIOS. The serial port on the modem card in some cases will simply
    become the lowest number serial port it can and then use the IRQs for that port.
    Otherwise you may have to set the serial port with jumpers on the card. Consult
    the documentation that came with your modem.


    +   2. You can use setserial to assign the serial port on a different IRQ. If
    your built-in serial ports are both in use and you add an internal modem, it will
    present itself to the system as the third serial port. To change the IRQ it uses


    ```

    % setserial /dev/cua2 irq 5

    ```


    This will assign the third serial port. A number of other options can be set with
    setserial. Consult the man page for more information.


    # 21.3 Tape Drives


    There is a large and bewildering selection of tape drives. If you need to back
    up large amounts of data in a reasonable amount of time, however you can eliminate
    ones using the parallel port as they have lower throughput. IDE and EIDE tape
    drives also exist, and at least in the case of EIDE, the throughput is comparable.


    Assuming you decide to use a SCSI tape drive, you will need to enable SCSI tape
    support in your kernel. As in installing any SCSI drive, check to make sure you
    have chosen a unique ID for tape drive before installing it.


    Device files for tape drives contain the letters "st.\ If your tape is SCSI ID
    6, it will have two device files: st6 and nst6. The first is used if the device
    is rewinding and the second if it is not. Most tape drives are non-rewinding so
    you will need to refer to them as /dev/nstn, where n is the device number.'
