- pgno: 313
  md: '# 21.6 Zip and Jaz drives


    Hard drives which supported removable media almost became popular a decade ago
    but then faded. Recently, however, Iomega has resurrected them in the form of
    its Jaz and Zip drives.


    Other companies have begun making comparable products, but none are currently
    supported under Linux.


    Zip drives have capacities of 100 Mb and Jaz drives 1 Gb. Because of their relatively
    large sizes, they are much better suited for backup media than floppy drives.
    Additionally, both have considerably better performance than floppy drives. In
    the case of Jaz drives, the performance is comparable to a SCSI-I hard drive.
    A Zip drive has seek time few times longer than and a transfer rate about one-fourth
    that of a Jaz drive.


    # Installing a Zip drive


    The external SCSI Zip drive is shipped with its own controller based on Adaptec''s
    AHA1520, which Linux supports. Optionally, you can connect to your existing controller.
    The parallel port version actually comes with a parallel to SCSI adapter which
    will make the Zip drive appear as if it is a SCSI device.


    If you have the parallel port version of a Zip drive, you will need to enable
    support for it in the kernel either compiled or as a module. If you have an older
    kernel (pre 1.3.74) you will have to get the driver from http://gear.torque.net/pup/pa.c
    and compile it as a module. If you have only one parallel port and other devices
    you need to attach to, it is possible to daisy-chain them. However, Linux will
    not allow more than one driver to be active on the port. The solution is to compile
    all the various drivers (Zip, lp, PLIP, etc.) as modules and then load and unload
    them as needed.


    If you have the SCSI version, you need only to support SCSI, SCSI disks, and your
    controller. Thus, if you plan to use the drive on an already existing controller,
    you don''t need to do anything besides attach the drive to your system. If you
    have the internal version and have internal SCSI devices on the same controller,
    make sure bus termination is disabled or you will likely be unable to talk to
    some SCSI devices after you reboot.


    One final note. The Zip drive''s SCSI ID can be set to 5 or 6. This could potentially
    conflict with other devices on the SCSI bus, so you may need to do a little rearranging.'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# Installing a Jaz drive


    The recently available parallel port version of the Jaz drive is not yet supported
    in Linux, you will obviously have to use the SCSI version. As with the SCSI zip
    drive you will need only support for SCSI disks (and SCSI obviously) and the controller
    itself.


    The drive is shipped with its own controller. There are two versions in use. One
    is based on the Adaptec AHA78xx series. This series of controllers is supported
    by the AHA2940 driver. The other is based on the Advanced Systems family of controllers
    which is also supported under Linux. As before, you may instead choose to place
    the drive on an existing controller. Jaz drives may be assigned any SCSI ID between
    0 and 6.


    # Caveats


    It is generally difficult or impossible to have two identical SCSI controllers
    in the same system because various settings frequently conflict. If you already
    have a controller of the type that your Zip or Jaz drive uses, you should probably
    just putting the device on the existing controller. This will also help conserve
    system resources like IRQs, which frequently be in short supply.


    # Using the Drive


    After you reboot, you may need to check the boot information to get the device
    that corresponds to the drive. You can retrieve boot output with the dmesg command.
    Find the section where your Zip or Jaz drive is detected and scan down a few lines
    to locate the device reported for your drive.


    Once you know the device, you can mount a disk in the drive. Typically the disk
    shipped with the drive has a filesystem on its fourth partition. Unless you need
    compatibility with the OS that supports the fs type, you will likely want to format
    the drive with the Linux native ext2fs. (See the section on installing a new hard
    drive for instructions on formatting a disk.)


    Now edit /etc/fstab and insert a line like this:


    ```

    /dev/sdel/jazext2 noauto 0 0

    ```


    The noauto option tells Linux not to mount the device automatically. This is typical
    for an entry of a device with removable media.


    Using serial ports may seem a bit strange in the UNIX world, but there is a somewhat
    logical way of looking at it.'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'First, there are two device files for each serial port. One is /dev/ttySx and
    the other is /dev/cuax where x is the serial port number. To understand what you''ll
    read in the next few paragraphs, you first have to know a bit about how serial
    port work.


    # # 21.7 Quick Guide to Serial Ports


    You''re probably familiar with how serial ports need speed (BPS), bit size, parity,
    and stop bit settings. That''s on the software side. On the hardware side, things
    are a bit more complicated. The typical serial port has about eight pins associated
    with it:


    | Pin | Signal | Meaning |

    |---|---|---|n| 1 | DCD | Carrier Detect |

    | 2 | Rx | Receive Data (Data come in this line) |

    | 3 | Tx | Transmit Data (Data go out this line) |

    | 4 | DTR | Data Terminal Ready |

    | 5 | GND | Signal Ground |

    | 6 | DSR | Data Set Ready |

    | 7 | RTS | Ready to Send (1/2 out of band flow control) |

    | 8 | CTS | Clear to Send (1/2 of out of band flow control) |

    | 9 | RI | Ring Indicator (Not used) |


    The above is the pinout for a standard 9-pin PC serial connection. When a device
    like a terminal is connected to the serial port, you need a special connection
    called a null-modem cable. In short, pins 2 and 3 are crossed (leading Tx to Rx
    and vice versa) and the RTS/CTS lines are crossed. When connecting to a modem,
    a “straight through” connection is sufficient.


    Now, what does this have to do with /dev/cua and/dev/ttyS? Pin 1 is DCD, or Carrier
    Detect. When a modem makes a connection with another modem, this signal is active,
    or becomes “high.” This tells the computer that someone has connected to this
    modem and is probably waiting for a login prompt. The program that controls the
    serial ports (tty in this case) has to wait for'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# 2.7 Quick Guide to Serial Ports


    CD to become high before issuing a login prompt to the serial port. Otherwise,
    getty is sending the modem login prompt, which will make the modem a bit confused
    if no one is connected to the modem. To make things easier, the only way a /dev/ttyS
    device will successfully open is if the DCD pin is high. So programs like getty
    will try to open the port and then just wait until someone dials in and makes
    a modem connection.


    | State of CD on Dialing Modem(/dev/cua) | State of CD on Dialed modem (/dev/term)
    | Event |

    |---|---|---|n| Low | Low | Kermit gets started |

    | Low | Low | Kermit dials remote modem |

    | Low | High | Remote modem answers and negotiates speed |

    | Low | High | Connection made, login prompt |


    Now this leads to the question: How do you dial out with a modem? The /dev/cua
    device ignores the state of DCD and will let you connect if it''s high or low.
    So, if you wanted to dial out using kerm or minicom, you could connect to a /dev/cua
    device instead of a /dev/term.


    # Lock Files


    In order to prevent confusion about who actually is using the port (since you
    could theoretically have a /dev/term and /dev/cua file that points to the same
    serial port open at the same time) there are lock files. These lock files tell
    other programs that try to open a port that is in use. This prevents someone from
    opening a connection to a modem if someone else is already dialed into that modem.
    The problem with this, of course, is that each program that wants to use a lock
    file has use the same location. For most, this is /var/lock, but could be in /var/lock/
    or other locations. You can usually configure where the lock files go. The other
    problem with lock files is when they don''t properly clean up, which happens when
    a program crashes before it finishes running. Then you have lock files for programs
    that are no longer running, preventing other programs from using the device.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# Flow Control


    In order for the DTE and DCE to know when to stop transmitting, there are two
    main methods of stopping communication temporarily. First is software (or in-band)
    flow control. This is sending a ^ in the stream of data. Once the remote side
    sees this character, it stops sending data until it sees a ^. The problem with
    this is that it breaks down at high speed. At anything above9600bps, too much
    data may come down the line between the time that the receiving side sees the
    ^, and the sending side processes that character stops transmitting data. This
    can cause data loss. The advantage of in-band flow control is that only three
    wires are needed: Tx, Rx, and GND.


    The other method is using hardware (or out of band) flow control. In this, two
    pins (RTS and CTS) are used outside the data stream to start and stop the flow
    of data. Since that is all these signals are used for, processing a “stop” out
    of band flow control is much quicker than for in band, and is recommended for
    all speeds greater than 9600 bps.


    # UARTS


    A UART is the chip inside your PC that actually handles the RS-232 communication.
    Most chips in newer PCs are either 16550 or 16550-based (meaning- they will emulate
    the 16550 chip). Earlier PCs had 8250s and 16450. These earlier chips would not
    handle speeds greater than about 38400bps, which is inadequate for today''s high-speed
    modems with compression. Earlier chips have only a 1-byte buffer, meaning each
    time a character came in the serial port, a CPU interrupt was generated. For 9600
    interrupts per second. Each of these CPU interrupts prevents the CPU from doing
    something else. The 16550 chips have a 16-byte buffer, which means at 9600 bps,
    there are fewer than 1000 interrupts per second.¹This left the CPU a net gain
    of 8600 interrupts per second to devote to other things, such as running programs.
    When speeds reach 38400 bps, the difference is even greater. Most of the “dumb”
    serial boards use 16450 or 16550 chips to do their processing, while “smart” serial
    cards use anything from an Intel 80186, like Cirrus CD-2400 chip to provide greater
    speeds and extra functionality, multiple serial ports per IRQ.


    > ¹When you have a fairly large buffer, you have a point (high-water mark) where
    the buffer is close to being full and should be emptied. Thus, you may not always
    have 16 bytes in the buffer when an interrupt occurs.'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# 21.7 Quick Guide to Serial Ports


    # Types of Modems


    One question that is asked frequently is: “What kind of modem should I get?” There’s
    a choice between getting an external or internal modem for your PC. The internal
    modems are a bit cheaper and have their own UARTs built in, which prevents data
    loss at high speeds. External modems don''t take up a precious ISA slot in your
    machine (assuming your machine even has an ISA slot) and you pretty lights to
    look at when downloading Web pages and FTP files. The best kind of modem you can
    get for Linux is an external modem, especially if you have a good 16550-based
    serial card² for the following reasons:


    +   1. You get the pretty lights to show that everything is working. With internal
    modems, you have to rely on other software to get modem states, and so on.

    2. You won''t accidentally buy a “WinModem.” These modems actually require a lot
    of CPU time and are not supported by Linux.

    3. If you need to move modems, it’s pretty easy to do.

    4. You can put in as many modems as you have serial ports, which is probably more
    than the number of ISA slots you have

    5. Works with all versions of Linux, be it Linux on Sun, Linux on Alpha, Linux
    on PPC, or Linux on i386. RS-232 is a cross-platform standard.


    # Baud and BPS


    To start this section, there is no such thing as a 28000-baud modem that works
    with plain old telephone lines. If there were, we''d have some really fast modems
    out there. Until the age of 2400 bps modems, baud and BPS were synchronous. A
    baud is defined as the number of changes in a signal per second. To get to higher-speed
    modems, more bits were encoded in each baud. Thus, a 9600 bps modem has 4 bits
    per baud, and a 14400 bps modem has 6 bits per baud. On top of this, compression
    of the actual data is used to increase the throughput, making some 28.8 kbps modems
