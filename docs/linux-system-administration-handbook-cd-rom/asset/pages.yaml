    machine, you will see the LILO boot prompt. If at some future time you need to
    remove LILO from your system, you can do this from DOS (and presumably Windows
    95 as well) with the fdisk /mbr command. This tells fdisk to reinstall the Master
    Boot Record (MBR) to the first partition of the first drive.


