    your system has to go through to use qmail. It''s also not perfect in a large
    installation (yet) also because of of the ways that sendmail and qmail differ.
    The configuration for qmail is much simpler than sendmail, but it doesn''t offer
    the “Swiss army knife” of Mail Transport Agents (MTAs) that many experts expect
    to see.


    # 7.6 Qmail: Better Than sendmail?


    Here are a few of the ways in which qmail and sendmail differ in methodology.


    mail file location: Sendmail prefers to use /usr/spool/mail/user as a location
    for incoming mail. Qmail prefers to use ~user/Mailbox as a location for storing
    mail files. This is for two reasons. First, putting the mail in the user''s home
    directory provides for better quota checking and prevents overfilling a central
    location. Second, there are fewer security problems since there isn''t a central
    location to store files.


    Permissions: Sendmail runs almost always as root or with root privileges in order
    to write files, and so forth. Qmail runs as root only when necessary and otherwise
    runs as a qmail user who has no special permissions.


    Mailing list integration: Sendmail has external programs to create and it administers
    mailing lists (majordomo and listproc). Qmail supports a method where individual
    users can have their own mailing lists and administer them themselves with no
    extra accounts or permissions.'
