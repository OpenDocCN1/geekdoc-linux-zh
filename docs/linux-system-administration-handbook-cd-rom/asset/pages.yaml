  md: '# 23.6 Summary


    When connecting a LAN to the internet in a secure way there are three items to
    consider. First, the selection of a private (i.e. non-routable) network. Second,
    connecting your firewall machine to the LAN and the Internet; in this example
    via an on-demand dial up line using PPP. Last, allowing certain machines on your
    LAN access to the Internet and possibly disallowing access from various external
    machines or networks.'
