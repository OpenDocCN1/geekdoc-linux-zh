- pgno: 415
  md: '# About the CD-ROM


    The accompanying CD-ROM is a copy of Caldera OpenLinux Base. Caldera distributes
    a commercial version of Linux which has some nice features and custom programs.
    The CD-ROM has a 90-day license to Looking Glass fro, VISIX and a few other programs.
    Looking Glass is a powerful variation of MS Windows Program Manager. It combines
    drag-and-drop, sounds, and easy customization of the desktop.


    # Quick-start note:


    To launch an OpenLinux™ install, change directory to /col/launch (“cd col” then
    “cd launch” and proceed per the instructions in that directory’s README.


    # System Requirements


    Your computer system must meet the following requirements in order to install
    OpenLinux.


    +   - 32-bit Intel-based personal computer or compatibles, such as these processors:
    386, 486, Pentium, Pentium Pro. Other processors are not supported in this release.

    - Minimum 8MB RAM (16MB RAM to use graphical components)

    - 266MB free hard disk space for recommended installation (You’ll need more or
    less disk space, depending on the installation option you choose.)

    - A supported mouse and video card (for use with the graphical components).


    # Technical Support


    Prentice Hall does not offer technical support for this software. However, there
    is a problem with the media, you may obtain a replacement copy by E-mailing us
    with your problem at: discexchange@phptr.com'
