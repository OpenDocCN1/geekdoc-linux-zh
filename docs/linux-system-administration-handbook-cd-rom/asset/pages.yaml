- pgno: 320
  md: '# # Linux Distributions and Upgrading Your System 22


    *Linux for every platform!*


    Linux has been or is being ported to virtually every popular hardware platform.
    The x86 architecture pioneered by Intel remains the most popular platform, mainly
    by virtue of its low cost.


    # ## 22.1 Supported and Work-In-Progress Architectures


    As of this writing, the following architectures are supported for Linux:


    +   * DEC Alpha—http://www.azarnet.com/~axplinux/

    * Sun Sparc 4m, 4c—http://www.geog.ubc.ca/s_linux.html

    * SGI MIPS—http://www.linux.sgi.com/

    * Other MIPs—http://www.village.org/villagers/imp/linux-mips-faq.html'
