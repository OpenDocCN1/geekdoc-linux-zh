- pgno: 249
  md: '# Focus


    There are three ways to determine which window has the “focus,” that is, what
    window will be controlled by the keyboard. The first method is the one you''re
    most familiar with—click in the window to make it the active window. This is called
    “Click to Focus” and it is turned on by the .fwwm file with the following:


    *** ClickToFocus


    The other two methods, Mouse Focus and Sloppy Focus, are very similar. Mouse Focus
    means wherever the mouse pointer is the control. Sloppy Focus is the same as Mouse
    Focus, with the exception that if the mouse pointer leaves the window but does
    not enter another window (for example, goes to the root window), the window you
    were just in remains focused. You can run on this focus method with either of
    these options:


    *** MouseFocus


    *** SloppyFocus


    # Menus


    Besides the regular start menu that has the same configurability as the Windows
    95 start menu, there are also menus available if you left-click on the root window.
    These menus are also defined in the .fwwm file. The menus are pretty much self-documenting.
    The “AddToMenu” line adds a menu definition called “Quit-Verify” that has a title
    of “Really Quit Fvwm”


    The next lines define the items in that menu. The + at the beginning of the line
    means it’s part of the menu, followed by the text in the menu. You can include
    an icon in this if you enclose the name in %. The last part of the menu line is
    the actual command. The “Restart” in this menu means to quit fwm and start the
    named program. This allows you to quit fwm and start another manager. If a menu
    option has no text and has an action of “Nop”, then it will create a separator
    in the menu. Replacing the “Restart” with “Exec” will start the new program without
    quitting fwm—but it’s not a good idea to start multiple window managers.


    ```

    #n# This menu is invoked as a sub-menu—it allows you to quit,

    # restart, or switch to another WM.

    #

    AddToMenu "Quit-Verify" "Really Quit Fvwm" Title

    + "Restart@mini-turn.xpm*" Restart fwwm95-2

    + "Nop* Thiel

    ```'
  merge: -1
  img_proc: true
