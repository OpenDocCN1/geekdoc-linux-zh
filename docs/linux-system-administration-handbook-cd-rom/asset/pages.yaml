  img_proc: true
- pgno: 339
  md: '# 318 Chapter 23 • Connecting to the Internet


    Just replace the <local machine IP> with the IP of a particular machine. This
    line can occur as many times as needed for each machine that you want to allow
    to masquerade its IP. Keep in mind that we could also do this by manipulating
    the netmask instead of making an entry on a per machine basis. The per machine
    basis is easier to understand to the naked sys-admin eye, but a netmask is easier
    than your CPU.


    So far, all that''s set up is a simple masquerading firewall with For-warding
    rules. There are three other styles of rules: "Incoming, "Outgoing", and "A^accounting"


    Incoming rules are generally the fastest of the rule types. Outgoing rules have
    a big advantage over Incoming and Forwarding rules, but they are slower in comparison
    of Incoming and Forwarding rules. Outgo-ing rules can block traffic from any machine
    on your network, while the out-ers cannot block traffic from the firewall itself.
    If you want to block traffic to a particular site, but your firewall machine itself
    is not secured from the indi-ividual in question, they could access a particular
    site by going to the firewall before going to the particular site.


    Accounting rules do little other than allow you to monitor network traffic. The
    current version of ipfwadim will accept allow only you to measure traffic between
    two points. If you truly wish to monitor traffic I suggest monitoring all of the
    network traffic, and then the network traffic between the firewall and individual
    machines. This will give you a percentage of the traffic that one person, or machine,
    has created your network.


    If you wish to block traffic to a particular site from your network, one approach
    could be


    ```

    ipfwadim -F -a reject -W ppo -S 192.168.1.0/24 -D forbidden.site.com/32

    ```


    The general format for all rules is the following. Please note that there are
    more options, including inserting rules, and logging that those mentioned here.
    this is just a brief overview of what is available


    +   Flush the old rules to clear any previous erroneous rules.

    * ipfwadim [-FIOA] -f

    The "-f" means to flush all rules


    +   Set up a default policy of deny.

    * ipfwadim [-FIO] -p deny

    The "-p" means policy standard values are accept (default) and deny.

    Note: This does not apply to Accounting rules.'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# 23.5 IP MASQUERADING


    3. Set up the rules themselves, keeping in mind the rules are processed in order
    and do not continue after the first match.


    +   - ipfwadm-[FOIA] -a <accept | deny | reject | masquerade> [ -V interface IP
    | -W interface name] -S <source IP> -D <destination IP>


    The -a option is an option to rule the list and should be followed by a policy.
    Valid policies are accept, deny, reject, and masquerade. Note: This does not apply
    to Accounting rules.


    The -V and -W options are optional. They specify on which interface packet will
    be transmitted or received for this rule. If not specified, it is assumed that
    the packet will be accepted on all interfaces. Either the -V (IP number) or the
    -W (interface name) can be used, but not both -S and -D refer to the Source and
    Destination of a packet, respectively. Source and Destination IPs can be the dotted
    quad number or hostnames. I suggest using IPs as it will not require a lookup.


    The following pages include descriptions of simple masquerading firewall, with
    some minor protection from intruders. If more in-depth information is required,
    read the ipfwadm man pages and perhaps one of the many books dedicated to firewalls.
    Most books will not discuss ipfwadm specifically but will give theories that can
    be applied to your Linux box.


    Below is a sample /etc/rc.d/rc.firewall. As with dial, you should call it from
    rc.local.


    ```

    #!/bin/sh


    PATH=/sbin/bin:/usr/sbin:/usr/bin


    #

    # /etc/rc.d/rc.firewall, define the firewall configuration,

    # invoked from rc.local.

    #

    PATH=/sbin/bin:/usr/sbin:/usr/bin

    MY_ETH0=192.168.1.1

    MY_NET=192.168.1.0

    MY_STATIC=111.222.333.444


    # Forwarding rules

    # first flush any old rules from memory

    ipfwadm -F -f

    # then set a default policy to deny everything

    ipipfwadm -F -p deny

    ```'
  merge: -1
  img_proc: true
- pgno: 341
  md: '```

    # lastly, we want to masquerade the IPs from MY_NET (eth0)

    # the ppp0 interface (but we may need to stop at the s0

    # the interface if dialed needs to start the ppp connection!)

    ipfwam -F -a masquerade -W ppp0 -S $MY_NET/24 -D 0.0.0.0/0

    ipfwam -F -a masquerade -W s0 -S $MY_NET/24 -D 0.0.0.0/0

    ```


    ```

    # Incoming rules

    # first, flush all rules from memory

    ipfwam -I -f

    #then set a default policy to deny everything

    ipfwam -I -p deny

    ```


    ```

    # packets coming in from my local network (can only be eth0) to-

    # where else are allowed

    ipfwam -I - accept W eth0 -S $MY_NET/24 -D 0.0.0.0/0

    ```


    ```

    # packets preending to be my local network that come from

    # the outside is denied

    ipfwam -I -a deny Wpp0 -S $MY_NET/24 -D 0.0.0.0/0 -o

    ```


    ```

    # packets going to the firewall, from a remote network is valid

    # (i.e. if we are using the firewall machine for mail, or someone

    # # VALIDLY telnetting into the firewall)

    ipfwam -I -a accept Wpp0 -S 0.0.0.0/0 -D $MY_STATIC/32

    ```


    ```

    # We may also use localhost for testing, so make it valid

    ipfwam -I -a accept -V 127.0.0.1 -S 0.0.0.0/0 -D 0.0.0.0/0

    ```


    ```

    # Outgoing rules (basically the reverse of the Incoming rules)

    # as usual, flush all old rules

    ipfwam -O -f

    # and setup a default policy of deny

    ipfwam -O -p deny

    ```


    ```

    ipfwam -O -a accept W eth0 -S 0.0.0.0/0 -D $MY_NET/24

    ```


    ```

    # deny someone trying to fake the masquerade

    ipfwam -O -a deny Wpp0 -S 0.0.0.0/0 -D $MY_NET/24

    ipfwam -O -a deny Wpp0 -S $MY_NET/24 -D 0.0.0.0/0

    ipfwam -O -a deny Wpp0 -S 0.0.0.0/0 -D $MY_NET/24

    ```


    ```

    # all outgoing data from the firewall is valid, and

    # remember, we need to make it valid for sl0, just once

    # dialed hasn''t enabled ppp0 yet.

    ipfwam -O -a accept -W ppp0 -S $MY_STATIC/32 -D 0.0.0.0/0

    ipfwam -O -a accept -W s0 -S $MY_STATIC/32 -D 0.0.0.0/0

    ```


    ```

    # and.... yeah... localhost is still valid

    ipfwam -O -a accept -V 127.0.0.1 -S 0.0.0.0/0 -D 0.0.0.0/0

    ```


    echo "done"'
