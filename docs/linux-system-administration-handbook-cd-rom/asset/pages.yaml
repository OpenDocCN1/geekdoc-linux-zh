- pgno: 306
  md: '# # Talking to Your Peripherals 21


    It’s not all disk drives and video cards!


    As anyone knows, there are many more resources to be shared, served, and managed
    than applications and disk volumes (though we will cover adding disks, too). Scanners,
    modems, printers, tape drives, and Zip and Jaz drives can all be made available
    to other machines on your LAN.


    Printer setup and sharing are covered in a separate chapter, because other than
    disk sharing, the printer is the most frequently shared resource.


    One problem that frequently plagues PCs with many peripherals is IRQs or interrupt
    conflicts. There are a number of ways to deal with these which will be discussed
    at the end of this chapter.


    # ## 21.1 Scanners


    Most scanners can be purchased in either SCSI or parallel port form. Currently
    Linux supports only scanners connected via a SCSI adapter. The'
