  md: '# Chapter 22 • Linux Distributions and Upgrading Your System


    fortunate at the thought of editing a .fwm2rc file and want some of the features
    of the MacOS finder or the Windows Explorer, it is a welcome product.


    Caldera also sells a port of Wabi for Linux and resells a number of X-based desktop
    applications, including StarOffice, WordPerfect for UNIX, Z-Mail and various commercial
    X servers and Motif versions.


    They also make and support OpenDOS, a freeware version of DOS, and Netscape''s
    FastTrack Web server.


    RedHat''s Package Manager (RPM) software package system is employed by Calder
    and includes glint, the GUI interface to RPM. See the section on RedHat for more
    information about RPM.


    # RedHat


    RedHat Software produced the first “commercial” release of Linux. It is commercial
    in sense that they offer installation support, and it is possible to purchase
    more extended support plans. It quickly became the most popular Linux distribution
    and still holds this honor today.


    Part of what made this distribution so popular is its installation program. It
    is straightforward and easy to use and does a fair amount of hardware detection
    during the installation process. Recent versions of RedHat include Metro-X, a
    commercial X server that takes the place of the XFree86 server (but not XFree86
    itself). See the chapter on X for more information on XFree86 and commercial X
    servers.


    RedHat''s other big selling point is the RedHat Package Manager or RPM. It is
    both a program for installing, upgrading, or uninstalling software and a format
    for software packages. Solaris users will find it similar to pkgadd, with additional
    features. The RPM program checks dependencies and verifies that. If a dependency
    is not fulfilled, rpm reports that RPM file needs to be installed and exists.
    The RPM program also has various querying options for querying package files and
    searching for which RPMs contain what programs. RPM has for two kinds of packages:
    precompiled and source code. If you prefer to examine the source and build it
    on your own machine, or there are machine-specific options for a package, it will
    be distributed as a source-code package. On installing the package, the source
    code is compiled and installed.


    There is also a GUI front end for RPM written in Python/tkinter called glint.
    Glenn will first query the installed packages and if you have your RedHat distribution
    CD in the CD-ROM drive and mounted on /mnt/cdrom, glint will also query it and
    determine which packages on it have not been installed.'
