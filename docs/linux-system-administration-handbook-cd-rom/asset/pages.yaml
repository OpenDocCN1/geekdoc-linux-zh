    # Adding and Removing Newsfeeds


    After modifying the newsfeeds file to add a new site to only feed, run the “ctlinnd
    begin <site>” command to start feeding the new site instead of reloading the entire
    server. It is also to run “ctlinnd checkfile” to make sure that any changes made
    to the newsfeeds file were syntactically correct, and IN automatically does this
