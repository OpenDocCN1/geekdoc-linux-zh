- pgno: 121
  md: '# Remote E-mail (POP and IMAP)


    POP (Post Office Protocol) and IMAP (Internet Message Access Protocol) are two
    of the standards for receiving E-mail from a remote machine. The best example
    of remote E-mail use is in an office situation where there is a Linux server,
    and Windows (or Mac, other UNIX) clients also running on the network. The clients
    can receive their E-mail in a number of ways (Eudora, Netscape, PC-Pipe, etc.)
    and still have one central mail server.


    Each protocol has strengths, weaknesses, and assorted Mail User Agency (MUA) that
    support them. Both are typically installed in a Linux setup ready to run. Authentication
    of E-mail is done by the same user/password scheme that is used to log in. One
    of the advantages of POP or IMAP is that little-side setup is required. You can
    typically install and run the program without any trouble.


    # POP


    POP (RFC 937 and RFC 1225) was one of the first methods for retrieving and sending
    E-mail to/from a remote machine. The protocol is rather simple, and the commands
    are the same as the regular UNIX /bin/mail program. You can get, send, list, and
    delete mail. That''s about it. The good thing about it, is that you can pick your
    E-mail at the office from home. The down side to POP is that the E-mail on the
    server is often deleted once it gets sent to you.⁹ While you can get your E-mail
    from home to work, or else you won''t have any way to send the E-mail back from
    home to work. Netscape and most PC-based Internet E-mail programs handle.


    # IMAP


    IMAP (RFC 2060) was created to handle some of the deficiencies of POP. IMAP is
    designed to be a “client/server” setup where the server keeps the mail until the
    client requests it be deleted. IMAP also allows a setup where you can download
    your E-mail to a notebook, delete messages, respond to messages, and so on and
    sync up with the server. This is


    > To be fair, this is a problem with the applications that use it, not the protocol
    itself. POP can be set up to leave E-mail on the server, which can fill the server
    very quickly.'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'designed for laptops, which may not always be connected to a network. In POP,
    all the E-mail is downloaded at once, which is a bit of a problem for large messages
    over slow links. IMAP supports a mode where only portions of an E-mail (the headers)
    are downloaded. IMAP is also for more than just E-mail, since the protocol allows
    for transmission of other kinds of data, such as NetNews articles. Only a few
    programs (pine and Netscape) currently handle IMAP because the protocol is a bit
    newer than POP. A large list of available IMAP clients and servers is available
    at the IMAP Web site http://www.imap.org.


    # 7.8 Summary


    +   * Sendmail is the default way of sending E-mail

    * You might benefit from using qmail

    * MIME allows you to E-mail binary data from one person to another'
