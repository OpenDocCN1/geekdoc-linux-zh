- pgno: 139
  md: '# Chapter 10 · NetNews


    The history of Usenet begins back in 1979 when two graduate students, Tom Truscott
    and Jim Ellis, thought of using the UNIX Copy soft-ware (UUCP), to connect machines
    for the purpose of information exchange among users. At first, traffic was handled
    by a number of shell scripts, but the first public software was Anews. Anews was
    small and not designed to handle more than a few articles per group day. When
    the volume of readers grew, Anews was rewritten and released as Bnews in 1982
    and then rewritten again as Cnews in 1987. RFC 850 and 1036, titled Standard for
    Interchange of USENET Messages detailed the format for the interchange of network
    News messages among USENET hosts, defining the format of news messages, transmission
    methods, and propagation methods.


    All of the news server releases up until Cnews were targeted primarily by UUCP
    networks, though they could be used over different protocols as well.


    With the growing popularity of other networks as TCP/IP and DEC-Net, more efficient
    methods of news transfer had to be developed, and so the Network News Transfer
    Protocol (NNTP), was born in 1986. NNTP was designed as a “store and forward”
    technology, meaning that news articles are stored in a central database from which
    readers pull individual articles. Further technical details of RFC977, A Proposed
    Standard for the Stream-Based Transmission of News.


    At first, NNTP was available only as an add-on package to Cnews, but then the
    Internet News program, more commonly known as ANN, was developed. ANN combined
    the NNTP section with the news server itself, making installation and configuration
    easier than before. Originally, the ANN software was written and maintained by
    Rich Salz up until ANN1.4sec, released in the middle of 1993. At that point, Rich
    not had the time to maintain the distribution, and Dave Barr uno stepped in and
    took over maintenance and wrote the 1.4off versions of the software. In 1996,
    Rich turned over the ANN distribution to the Internet Software Consortium (ISC)
    with the understanding that they would take over maintenance and development of
    future ANN releases. The ISC, mainly James Brister, merged the changes that had
    occurred in the unofficial source off and then added more features and bug fixes
    and produced version 1.5 and above.


    Today, most sites on the Internet use ANN as their news server, but there are
    various newly developed servers such as Cyclone, Dnews, Diablo, and others. This
    chapter deals primarily with the ANN software and how to install, configure, and
    troubleshoot it on a Linux system.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# 10.1 INN Pre-Installation Considerations


    # 10.1 INN Pre-Installation Considerations


    There are several things to consider before you actually install INN and start
    receiving news. INN is a memory- and disk-intensive piece of software, especially
    if the machine receives and stores a large number of articles. Determining the
    amount of memory and disk space needed and planning the layout of the filesystems
    ahead of time can save you a lot of headaches in the future.


    # Space Considerations


    Usenet can consume a large amount of disk space depending on how many newsgroups
    you carry and what hierarchy the newsgroups are. Plan ahead to estimate how much
    disk space you will need for the logs, the actual news storage area, and the news
    binaries. Currently, a full news feed tends to take about 3 or 4 gigabytes of
    incoming news per day. About of this is taken up by the alt.* hierarchy, with
    the biggest section under being the alt.binaries hierarchy.


    If you want to receive a partial feed, but don''t have much space to spare, consider
    getting only a partial feed. You can restrict what is kept on by hierarchy or
    by specifying a group name. If you''re interested in certain topics, accept those
    few newsgroups which discuss those topics. Ordinarily, unless running an ISP or
    service, most people will choose to accept only a partial feed because there are
    so many groups with several hierarchies not even in a language that you can understand.


    For larger installations, it is generally a good idea to keep the logs, the binaries,
    and config files on separate partitions of performance issues. The space utilized
    by the news binaries and config files remain more or less constant and can be
    put on the same partition as other binaries, usually in /usr or /usr/local. The
    segments that will drastically drastically are size and the log file partitions.
    The log file partition must always be at least twice the size of the space normally
    used because INN makes multiple copies of the history file when expire, the cleanup
    program, is running. The pool area must be able to hold many days worth of news
    that you desire to keep as well as being able to handle an occasional spike when
    the local machine or an upstream news provider is down for a period of time and
    then sends a large amount of backlogged news.


    ![](img/cd7585e53abd949068548271c07fcdd8_140_0.png)'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Memory Considerations


    As well as being a big disk hog, INN can take a large amount of memory if you
    have a large number of groups. INN keeps the history database in memory, and when
    expire runs, it keeps the entire remove list in memory. If the machine does not
    have enough memory to run expire in a timely manner, it can get far behind in
    news because the news server does not accept new articles when it is running.
    In order to avoid a cycle of no news and then a flood of new news, make sure that
    the local machine will be able to handle the disk and memory load required.


    # Other Performance Considerations


    There are various ways to tune your news system for better performance both at
    the hardware and software levels. On the software side, you can speed up reads
    by client software using the NOV indexing scheme (overview database). For any
    large news installation, also keep the overview database on a separate partition.
    The number of reads and writes to the partition by desktop clients and the feeding
    sites make it a heavily used directory. Also expiring administrative newsgroups
    like junk and control can save the server space and make reads and writes faster
    for hierarchy. There are several software tuning steps that will be discussed
    later in the INN configuration.


    On the hardware side, the speed of news transfers is greatly influenced by the
    speed of the bus, performance of the network card, and layout of disks and disk
    controllers. To achieve the best disk performance, spread out input/(I/O) across
    several smaller (2 to 4 gigabytes), high-performance SCSI disks on multiple PCI
    or EISA controllers. Make sure to configure the controllers for synchronous SCSI
    with tagged queuing enabled. Obtain the md toolkit, available from ftp://sweet-smoke.ufr-info-p7.ibp.fr/public/Linux/
    and enable the md driver to use RAID striping for the news spool and the overview
    database partitions. Mount the news disks as no_atime to eliminate the inode update
    for every file access even when the file contents are unchanged. For Linux kernels
    before 2.0.29, this requires an INN patch, available at http://thereisnacal.news.erols.com/patches/ext2_no_atime.diff,
    from Clayton O''Neill. Clayton has a number of other useful INN patches on his
    site as well.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# 10.2 Setup, Obtaining, and Unpacking INN


    # 10.2 Setup, Obtaining, and Unpacking INN


    The first step to installing a news server is to format all the partitions that
    will be used and mount them. Next, create the news user and news group or verify
    that they already exist. The news user and news group should own all directories
    that the INN software resides in for a secure installation. The news user should
    have a locked password and the home directory where-ever news binaries will be
    installed.


    Verify that PGP is installed, or see the chapter on security for instructions
    on PGP installation and, make a PGP key for the news user so that may do secure
    control message authentication. Also, if the news machine has an FTP daemon, make
    sure that the news user is in the /etc/ftpusers file no ftp access is allowed.


    Once that''s set, confirm that you''re using the source code for the latest version
    of INN. The Slack news package comes with the Reference Implementation of NNTP
    as well as INN. However, if you select "INN" for installation, it does not remove
    the NNTP entry in the /etc/inetd.conf and must be removed manually. It''s generally
    safer to install the INN implementation that comes with the Linux distribution
    and to obtain the latest INN version, 1.6 at the time of this writing, from ISC''S
    Web at http://www.isc.com/inn.html. Also retrieve any patches released for the
    same version of INN. Once the partitions are set up and the INN distribution are
    downloaded, move everything to the news source directory, such as /usr/local/src/inn.
    Become the news user (su news) to unpack and press the source archive by doing
    the following:


    ```

    $su news

    (make sure the path is set correctly)

    >tar xf inn-1.5sec3.tar.gz

    >cd inn-1.5sec3

    >ls -a

    ```


    This is the source tree for the INN distribution, which contains several Makefiles,
    README instructional files, and directories broken down into the following topics:


    +   **frontends:** Programs that control the central server and feed articles
    to **innd:** The NNTP server itself


    +   **backends:** Programs to transmit articles to other sites


    +   **expire:** Programs to purge article files and databases

    **nnpd:** The NNTP server for client readers'
  merge: -1
  img_proc: true
