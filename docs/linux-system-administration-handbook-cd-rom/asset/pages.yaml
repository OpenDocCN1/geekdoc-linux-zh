- pgno: 294
  md: '# System 19 Monitoring


    Using syslog to keep an eye on your system.


    Monitor your Linux machine from the console or remotely using the syslog program.


    The syslog program monitors kernel and user events and routes the messages based
    on what you want to do. These events can be minor things, such as root logging
    in, or can be serious, such as a hard drive failure, kernel panic, or reboot.


    The syslog program gets started up at boot time and uses the /etc/syslog.conf
    file to know what to do. Here''s the default file for RedHat 4.1:


    ```

    # Log all kernel messages to the console.

    # Logging much else clutters up the screen.

    kern.* /dev/console

    ```


    ```

    # Log anything (except mail) of level info or higher.

    # Don''t log private authentication messages.

    *.info;mail.none;authpriv.none /var/log/messages

    ```'
  merge: -1
  img_proc: true
