- pgno: 38
  md: '# 2.6 System Shutdown


    +   - Emergency boot floppy. Many Linux installations require a boot floppy anyway,
    so you probably already have this.


    +   - Root floppy with fsck, mkext2fs, fdisk, copies of startup scripts, tar or
    to restore backups. This will allow you to re-create partitions, format them,
    and restore the last backup to the hard drive if necessary.


    +   - Known good kernel on the root partition—the one used to install the system
    if you have it available. It may not have all the drivers, but you will be able
    to boot.


    +   - Screwdrivers and a grounding strap. Just in case you suspect a hardware
    problem.


    # 2.6 System Shutdown


    Shutting Linux down is somewhat easier than starting it, since all you need to
    do is kill off all the available processes and tell the kernel to either stop
    or reboot the system.


    There are a few ways to shut the system down, depending on how and when you want
    it to happen. The fastest way is the following:


    ```

    sync;sync; /sbin/halt

    ```


    The three sync commands tell the system to sync up the hard drive cache and the
    hard drive itself. Anything that has to get written to the hard drive gets done
    at this time. Why three sync commands? There are varying reasons, but simplest
    one is that by the time the last sync is done, the buffers have had time to clear.
    Another idea is that the three sync commands make sure that all the buffers are
    cleared, the hard drive cache may have changed or may not have been completely
    flushed.


    There are a few other methods of telling the machine to halt, including using
    kill -9 1 and telinit 0. In typical UNIX fashion, more than one command will work.


    If you choose to reboot the system, you can replace halt with reboot 6.


    All of the commands are for shutting the system right now. If you choose to have
    a planned shutdown and want to give users time to finish their work and log out
    in an orderly fashion, you''ll want to use the shutdown command.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Shutdown Command


    When shutdown is run, the following options are available:


    +   - r Reboot after shutdown.

    - -h Halt after shutdown.

    - -c Cancel an already running shutdown.

    - time When to shut down, either +minutes or hh:mm for an absolute time. You can
    also use "now" which is really +0.

    - message Warning message to send to all users.


    Once shutdown is started, only root will be able to log in until the machine is
    rebooted, or the shutdown is canceled.

    Shutdown is really a nice front end to the init process, since once shut-down
    has determined that it''s time to shut down, it sends a signal to init to change
    to level 6 or 0.


    # CTRL-ALT-DELETE


    Yes, the famed "three-finger salute"—CTRL-ALT-DELETE—will shut down Linux as well,
    in a pinch. The init process is watching for this and will shut the machine down
    if it receives that signal. The default setting is to run the reboot command immediately.

    If you''re in a common lab area and don''t want just to be able to reboot the
    machine on a whim, you can take the line out of the /etc/init-tab and you''re
    all set. Unfortunately, this doesn''t prevent malicious people from hitting the
    power switch or pressing the reset button.


    # 2.7 Keeping a PC Safe from Reboots


    During a reboot, a Linux box has very low security. If you''re trying to keep
    a PC safe, the standard architecture makes it very hard to do. First, the PC can
    boot an OS (DOS) that can fit on a floppy, plus contain enough programs on it
    completely ruin a hard drive, a virus can infect the Master Boot Record (MBR)
    of a hard drive, which is what Linux needs to boot, or a user can bring their
    own Linux boot floppy to get root access, mount the hard drive, and start editing
    the /etc/passwd file.'
