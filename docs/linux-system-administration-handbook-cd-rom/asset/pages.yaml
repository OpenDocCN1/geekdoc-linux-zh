  md: '# 22.2 Commercial Linux Distributions


    # 303


    All in all, glint is an incredibly handy tool for helping a system administrator
    manage much of the software on a Linux server. RedHat also sports another tool
    for system administrators.


    Control-panel is a Tcl/Tix application. It is really a sort of meta-application;
    it launches all the other handy sysadmin tools that RedHat includes in its distribution.
    There are graphical tools for managing nearly every other aspect of the system:
    users/groups, local and network printers, network interfaces, time/date, the kernel
    daemon and modules, local NFS file systems and a few others.


    RedHat is the only commercial distributor selling versions of Linux for more than
    one architecture. Versions are available for Sparc- and Alpha-based systems.


    # WGS


    Work Group Solutions (WGS) releases a “fully debugged, stable, more professional
    and comprehensive version of Linux” called Linux Pro. It makes more of an effort
    to be stable rather than on the bleeding edge. It also comes with a demo version
    of WGS''s FlagShip, a database server.


    WGS''s product is aimed more at business and industry. They sell subscriptions
    on an annual basis as well as maintenance contracts. Even though the regular Linux
    Pro install does not use the latest and greatest software, the distribution comes
    with supplemental CDs containing more up-to-date versions.


    Linux Pro is currently based on RedHat and, as a result, includes the tools that
    come with RedHat. Because of its focus on stability, Linux Pro typically lags
    behind RedHat by as much as one major release.


    If stability is of paramount importance to you, Linux Pro is probably the distribution
    you will want to use. Beware, however, that you may need to upgrade parts of the
    system, usually the kernel or system libraries, to use newer versions of third
    party software.


    # Slackware


    The Slackware distribution is the oldest existing Linux distribution and also
    the one with the largest amount of extra (non-necessary) software. This distribution
    is typically the most up-to-date and least well supported.


    Slackware doesn''t possess a formal mechanism for upgrading individual applications,
    libraries or packages, so you can either upgrade the whole system'
