- pgno: 322
  md: '# 22.2 Commercial Linux Distributions


    It is fair to say that Linux comes with the majority of third party freeware that
    gets installed on a commercial UNIX machine. Linux and other UNIX users want and
    use these tools, and Linux obligisingly with most of them. Those that don''t come
    with it can be found precompiled for Linux, or they compile easily on it (one
    of the virtues of being POSIX compliant).


    # Caldera


    Caldera''s OpenLinux actually comes in several different flavors, ranging from
    "lite" version up to a deluxe version. OpenLinux at all levels is aimed at commercial
    users as opposed to single endusers. They provide excellent support and an impressive
    array of desktop applications.


    +   - Lite: A free, evaluation version aimed at companies that wish to sell it
    or bundle with other products.

    - Base: A low-cost version with an integrated desktop, client and server applications
    for Internet and LAN connectivity.

    - Standard: The base version with Netscape Communication Corp''s Fast-Track web
    server, which includes client support for Novell NetWare Network Directory Services.

    - Deluxe: The standard with full NDS client and server support.


    Caldera provides excellent support, as you would expect from a company that wants
    to provide a serious platform for business use. They have said that they are willing
    to "take it on the chin" in their support of OpenLinux.


    Caldera also offers a rich desktop environment and a set of desktop applications
    for it. Caldera Desktop, also known as Looking Glass, is a full-featured application
    launcher and workspace. It has features such as drag and application launching
    by double-clicking on a datafile produced by that application (Mac users are especially
    familiar with this, as are Win95 users), as well as a full-featured file manager.


    Most of Locking Glass''s options are GUI configurable but some are not yet there,
    so it is not the user interface (UI) panacea that the Linux world needs to compete
    on the desktop market, but it is an excellent start. Hard-core users of X will
    likely still choose their favorite X window manager or common desktop environment
    (CDE) over it, but for people who are uncom'
  merge: -1
