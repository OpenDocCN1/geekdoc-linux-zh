  md: '# 8

    Internet

    Agencies


    If you''re on the Internet, you''ll probably have to deal with one of these groups
    sooner or later.


    Even though the Internet appears to be an anarchy, there is a sense of order to
    it. Various agencies have been set up to give a bit of order to this apparent
    chaos.


    Even if you get your connection via an ISP, you still have things that require
    outside assistance, like registering your domain and tracking crackers if one
    should happen to attack your site. How do you keep up with security issues?


    # 8.1 InterNIC


    In the old days (early 1990s), domains were free for the taking. If you filled
    out your template and sent in the form, you got yourself a domain name. Everyone
    thought this would go on for forever, but alas...


    In the mid 1990s, the National Science Foundation (NSF) started cutting-off funding
    to the Internet and allowed commercial organizations to'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# Chapter 8 · Internet Agencies


    begin using the Internet to sell and advertise. The response was an explosive
    growth in the number of domains being added. This got into the hundreds of thousands
    a year. To impose some order on this, and make up for some of the missing NSF
    funding, the InterNIC (http://www.internic.net) was created to provide for a top-level
    DNS domain and to register new organizations within the United States. The downside
    to this was a new Internet fee: $100 for the first two years, then $50 each year.
    After paying this fee, you are entitled to have your domain registered in the
    InterNIC database and your domain can now be recognized by the rest of the Internet.
    This doesn''t mean InterNIC will give you anything else, like DNS services or
    an InterNIC link. You will just have your domain registered and a pointer to a
    DNS server. You''re still responsible for getting Internet service and a DNS server.


    Now time for some clarification. InterNIC only handles the U.S. domains .edu,
    .net, .org, .gov, and .int. Other domains, such as .us or other country-based
    domains, are not registered with InterNIC and you''ll have to find out who handles
    your regional DNS service to get registered with. Many of these have a fee, but
    some (like the .us) are free or have a smaller fee than InterNIC. To register
    in the .us domain, go to http://www.isi.edu. The .us domain does not give the
    kind of general quality that, for example, .com would give. For example, I''d
    probably get something like wayga.wakefield.ma.us, but I could build a domain
    under that as a ftp.wayga.wakefield.ma.us. In some ways, this is preferable to
    just a .com domain, since it allows you to specify a site (ibm.armonk.ny.us) directly.
    Foreign companies have slightly different divisions and vary by location, type
    of organization (commercial, educational, etc.) or a combination of these. To
    find out the contacts for a particular country''s top-level domain, check out
    http://www.isi.edu/div7/iana/domain-names.html.


    One other thing to remember about country codes is that they may not be what you
    think they are. For example, .ch is Switzerland, not China. And .ca is Canada,
    not California.


    ¹And Washington University is in St. Louis, and Miami University is in Ohio, and
    Rome is in upstate New York.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# Registering a Domain


    The sample for domain registration is good for InterNIC, but other agencies will
    probably want to have the same information when you register. Either way, all
    the following information contains things you should already know.


    You''ll need to have a domain name first. Take one that isn''t already taken (obviously)
    and make sure the domain you isn''t a registered trademark of someone else. Sure
    you can take mcdonald.com, but their lawyers paid more than yours, and more of
    them. The InterNIC does not take sides in these kinds of disputes, so don''t think
    just because you got a domain that you own for all time.


    There are a few choices when registering a domain. The .edu is for educational
    institutions (mostly colleges and universities—elementary and secondary schools
    usually get a state-based domain). The .com is for commercial organizations that
    don''t necessarily provide Internet access or aren necessarily based on the Web.
    The .org domain is for organizations, either formal or a group of people getting
    together (apache.org or linux for example). The .net domain is for groups that
    resell Internet access or access to other groups. The .gov and .mil are for the
    government and military, respectively. This leaves you with three probable choices—com,
    .net, or org. Pick the one appropriate for your organization.


    Next you''ll need up to three people. One is the technical contact, one is the
    administrative contact, and the third is the person who typically registers the
    domain and is the Manager of Information Services (MIS) person. The administrative
    contact is probably your boss. The billing contact is the one who gets the bills.
    They can all be the same person if you wish. These names and addresses will be
    compiled into the database as well, giving a handle that you can use later at
    InterNIC instead of reinventing your address, phone number, name, and so on.


    The last items are the primary and secondary DNS servers. Since InterNIC doesn''t
    provide you with DNS service, you must enter the hosts that will be able to provide
    IP addresses for your domain. Two are required so that one acts as a backup in
    case the primary is down or busy.


    InterNIC also asks for information such as, "What does your organization do?"
    Fill in all information requested and wait. In a few days, you''ll get E-mail
    saying the domain was added. If you''re changing a domain, the administrative,
    technical, and billing contacts will receive a request from InterNIC to verify
    the new information. This prevents one contact from changing the information without
    the knowledge of the other two, and it prevents a cracker from changing the domain
    information (for example if microsoft).'
  merge: -1
  img_proc: true
