    If the error messages have not disappeared, you have not found the right values.
    Try with new values until the error messages do not appear.

    When you find the correct values, make a note of them in your system documentation.
    You must enter these values each time you need to run “fdisk.” They are not saved.

    After the correct values are entered in expert mode, you can continue working
    normally with “fdisk” to create the partitions that you need to install on Linux.

    If you want to use LILO to boot Linux from the hard disk, you must list the correct
    partitions in the file /etc/fstab/ These partitions are shown from the main menu
    of “fdisk” once you have corrected the information in expert mode. Change the
    partition display of “fdisk” to sectors with the “u” command. The sector values
    shown correspond to the block values of the LBA mode.


