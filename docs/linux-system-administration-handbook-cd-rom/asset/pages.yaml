  md: 'were to point instead of linux.org). This is more a denial-of-service attack
    and

    was common until InterNIC requested verification.


    # whois


    The whois database is a hook directly into the InterNIC hosts and allows you

    to see domain information and get information on the people who run the

    domain.


    The whois database not only lets you see information about a domain, but

    also about people. For example, since I own the "wayga.net" domain, I have

    an entry in the whois database (MK146). Looking up this information would

    game my name and E-mail address. Back in the early days, this was a great way

    to find someone''s E-mail address. But since there are millions of people on

    the Internet now, the only people in the whois database are domain administrators.


    Using whois is easy. Just type something


    ```

    whois wayga.net

    ```


    The original version of whois looked at an inappropriate whois database

    (nic.ddn.mil which is for military use only). The Linux version of whois

    should point at the right server name, but if it doesn''t, you''ll have to replace

    whois


    ```

    whois -h rs.internic.net wayga.net

    ```


    After the whois command, you can list names or domains and get results

    from the InterNIC database on who owns a particular name or get contact

    information for the administrators of that domain. This is especially helpful

    you''re trying to track a cracker in your system and know what domain they''re

    coming from. You can then contact the administrators of the domain and

    alert them.


    # 8.2 CERT


    The CERT Coordination Center was founded in 1988 to coordinate security

    problems on the Internet. It was founded after the great Internet Worm in

    the late 1980s and is located at Carnegie-Mellon University in Pittsburgh,

    Pennsylvania. If you don''t know anything about the Internet Worm, I''d-suggest
    getting either The Cuckoo''s Egg by Cliff Stoll, Cyberpunk: Outlaws'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# 8.3 CIAC


    and Hackers on the Computer Frontier by Katie Hafner and John Markoff. Both are
    excellent reading and show some real-life examples of crackers and those who track
    them down. Anyway, CERT''s purpose in life is to keep administrators aware of
    potential security holes in the OS or the software it runs. These security alerts
    often tell the type of security hole, how it can be exploited, what versions are
    affected, and (if available) locations of patches or ways to prevent anyone from
    taking advantage of these holes. comp.linux.announce group posts every now and
    then from CERT related to Linux and programs it runs. Strang enough, some of the
    security holes they have are not compiled, but with the way a particular program
    was compiled, making the hole not a Linux problem at all, but a fault of whoever
    compiled that program.


    If you have an intrusion investigated, you can send an intrusion report to CERT
    and maybe they can help you track down the person responsible. Their Web site
    is http://www.cert.org/. It is probably best to give their site a visit before
    your site gets broken into so you can stay up-to-date with their advisors.


    # 8.3 CIAC


    The Computer Incident Advisory Capability (CIAC) is run by the U.S. Department
    of Energy as something similar to CERT, but it primarily provides services for
    the U.S. Department of Energy (DOE) and its contractors. However, it does have
    a number of bulletins and advisory notes that may not be at CERT. It is also worthwhile
    to take a look at their site to keep up-to-date with security issues.


    # 8.4 Summary


    +   - Internic registers domains security

    - CERT and CIAC provide information'
