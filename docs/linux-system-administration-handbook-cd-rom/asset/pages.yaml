  md: '# 5.3 Network Applications


    # DNS Database Records


    Let''s look at the named.wayga file. This file has an example of many of

    t features you''ll want in your files:


    ```

    @ IN SOA wayga.net. enry.wayga.net. (

    1

    3600

    600

    360000

    10800 )\)


    IN NS 208.197.103.125

    IN NS 208.197.103.21

    wayga.net. IN A 208.197.103.125

    galeileo IN A 208.197.103.21

    localhost IN A 127.0.0.1

    wayga.net. IN MX 0 wayga.net.

    www IN MX 10 galileo

    mail IN CNAME wayga.net.

    ftp IN CNAME wayga.net.

    plan9 IN CNAME wayga.net.

    ```


    The SOA line indicates the Start Of Authority line. This line tells

    domain this file is working on. The SOA line is constant up to the point

    after SOA. Then it has the following information:


    +   * machine name acting as the DNS server.

    * contact name (replace the @ in the E-mail address with a period).

    * open parenthesis.

    * serial number, which should be incremented every time you change the

    file. Since this is the first revision of the file, it has a serial number of
    1.

    * refresh time in seconds, or how often to recheck the SOA record. The

    3600 stays to refresh once an hour.

    * retry time, or when a secondary server should retry contacting pri-

    m server if something goes wrong.

    * expire time, or when the secondary server should flush its cache if it

    ''t contact the primary server.

    * minimum time to live. This defines how long other servers should keep

    records in their cache before it should be flushed. If it''s too short,

    named is spending too much requesting addresses it should

    already know, and if it''s too long, the wiring IP information may be

    reported if a host changes ISPs or even IP addresses.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# Chapter 5 • Networking with Linux


    +   - close parenthesis.


    +   - NS (to indicate the nameserver).


    +   - name of the nameserver host (that''s the local host).


    Once the SOA is complete, you can begin adding hosts. The entry has four sections
    to it:


    +   1. Name of the domain or hostname. If the name does not end in a . , the domain
    name (in our case wayga.net) is appended. If the address ends in a . , it is assumed
    it is the Fully Qualified Domain Name (FQDN).


    +   2. IN—This separates the hostname from the rest of the record.


    +   3. Type of record. The record type can be any of the following:


    +   - A—directly maps a hostname to an IP address. All other records point to
    an A record


    +   - MX—mail exchanger. Lists what hosts will accept E-mail for host or domain.
    Before the record contents, you can indicate a number for preference. In the case
    of wayga.net, the mail host is itself, but if wayga.net is busy or unavailable,
    galileo will accept the E-mail instead.


    +   - CNAME—also known as an alias, you can see. Ftp.wayga.net, wayga.net, and
    mail.wayga.net are all pointers to wayga.net. Any DNS requests for these hosts
    will receive the IP address for wayga.net.


    +   - HINFO—may contain host information, but it''s not used very much, as it
    can give potential crackers information about your machine.


    +   4. Record contents. In the case of an A record, it''s an IP address. For other
    records, it can be a hostname or system information.


    Reverse DNS


    If your machine is doing reverse DNS, the SOA is the same, but the records themselves
    are slightly different. First, as you can tell with the named.boot, the IP address
    is reversed. Instead of the 127.0.0.0 network, it becomes 0.0.127.in-addr.arpa.
    Reverse the network you''re using, and use that as the domain in /etc/named.boot.
    Since the network for wayga.net is 208.197.103, the domain becomes 103.197.208.in-addr.arpa.'
