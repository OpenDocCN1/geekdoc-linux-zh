- pgno: 98
  md: '# # Printing and Print Sharing


    Getting the most out of a single printer across multiple machines.


    Print sharing allows you to set up a single printer so that everyone on the network
    has access to it.


    Print setup and sharing under Linux give you a number of choices. You can use
    the BSD-ish lpr, the lpr replacement LPRng, or just have Linux point to a remote
    printer on an AppleTalk, TCP/IP, or SMB network. Or have a computer on any of
    those networks and use the printer connected to your Linux workstation.


    # ## 6.1 Connecting Printers to Linux


    In order to use a printer under Linux, it must first be configured. First, make
    sure your kernel is compiled to use the parallel port device. By default, the
    parallel port is not set up in the Linux kernel.¹ Once you have a kernel with


    ¹If you choose to use a serial printer, skip this stuff.'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'the lp active [you can tell by seeing something like lp1 at 0x0378, (polling)
    at bootup or by using the dmesg command], you should be ready to print. Assuming
    your printer can handle plain ASCII (most do), you can send a text file to the
    printer by using something similar to


    ```

    cat /etc/motd > /dev/lp1

    ```


    This should print a copy of your motd file to the printer. If you get an error,
    you may want to see if the dmesg said something other than lp1 (for example lp0
    or lp2) and try again. Once this is set up, we can get on with configuring the
    printer.


    # 6.2 Serial vs. Parallel vs. Ethernet Printers


    Using parallel ports is the obvious choice for driving a printer since there are
    no baud rates or stty to worry about, and the speed is much greater (parallel
    ports run at about 150 Kbps as opposed to 38.4 Kb for a serial printer). But there
    are limitations to the parallel port. The greatest of these is the distance. A
    parallel port can run only 20 feet or so before the signal degrades too much and
    causes errors. A serial printer can run 50 feet at 38.4 K, and much longer if
    you choose to use an electrical interface like EIA-538 (a k RS-422). Also, a serial
    cable can technically run through an RJ-45 (8-pin) wire, or three wires if you
    feel lucky. This is a big advantage over the 25 pins that the parallel port needs.
    Many low-end printers these days have only the parallel port connection, but much
    of the higher-end printers for workgroups or print servers have serial connections
    as well. Or they are options available after the purchase.


    Then there are the ethernet connections you have to a printer (see the remote
    printer section below). This is an okay idea for some printers, since ethernet
    runs through much buildings away. In a computer lab situation, where ethernet
    is running through the room anyway, and the server is in another room (or floor)
    this is an excellent idea. But the printer is also using some of ethernet bandwidth,
    first to get from the printer client to the printer server, then again to get
    from the printer server to the printer itself. It''s not a lot of bandwidth that
    you''re using up, but now the “guys” playing Quake on the network have to drop
    from 54 frames to 53. You also have less control over the printer if the network
    goes down for some reason. Again, ethernet options are not available for the lower-end
    printers, but they are options for many high-end ones. Be sure that if you get
    a network printer, there are drivers, or some other interface to allow Linux to
    talk to it.'
  merge: -1
  img_proc: true
- pgno: 100
  md: "# 6.3 Configuring the Printer\n\n# 6.3 Configuring the Printer\n\nLinux uses\
    \ the BSD style of printing. That is, there is a /etc/printcap file that has to\
    \ be modified, and the commands are lpr, lpq, lpc, lprm, and so on. I prefer the\
    \ BSD method, as it makes adding printers and modifying the printer setups very\
    \ easy. Plus, most magic filters assume you have a BSD-style printcap. Here's\
    \ a copy of the printcap for a HP LaserJet 4L connected to the parallel port on\
    \ RedHat 4:\n\n```\nlp:\n  :sd=/var/spool/lpd/lp:\n  :mx#0:\n  :lp=/dev/lp1:\n\
    \  :if=/var/spool/lpd/lp/filter:\n  :sh:\n```\n\nRedHat has its own filters installed.\
    \ These filters will pretty much handle ASCII and PostScript into a format your\
    \ printer can handle. In the case of the HP printer, this is PCL. To print other\
    \ formats directly from the command line (lp), youll need a magic filter to convert\
    \ GIF to PS (for example) which then gets sent to the printer.\n\nThis printentry\
    \ is really all one line. You can tell because in the Linux world, a line that\
    \ ends in \\is is automatically added to the next line. Each printentry is one\
    \ line, but that line can be extremely long. The first line (the lp:) defined\
    \ the name of the printer. You can add alias names for the printer by adding <alias>\
    \ to the name definition. Once the name is given, the options can be put in any\
    \ order. Here are what the options mean:\n\n+   - sd—Spool directory. This is\
    \ where the files have to be sent to the printer. This is usually /var/spool/lpd/<printername>.\n\
    - mx—You can set a maximum file size that can be sent to the printer. The #0 means\
    \ that there is no maximum file size. The default maximum is 1000 blocks, which\
    \ equates to just 1 Mb.\n- lp—The device name for output. The /dev/lp1 specifies\
    \ a parallel printer, but you also use a serial device if you wish.\n- if—Input\
    \ filter. Any file going to the printer piped to this command before being put\
    \ in the queue. This is where the RedHat Print Manager comes and does its work.\
    \ This is where other magic filters get installed as well.\n- sh—Suppress printing\
    \ of burst pages. Burst pages list the user, the name of the file being printed,\
    \ and the job number along with other"
  merge: -1
  img_proc: true
- pgno: 101
  md: '# Chapter 6 • Printing and Print Sharing


    information. Think of this as a fax cover page. In a small network, you don''t
    need burst pages, but if you have about five or more people using the printer,
    it''s a good idea to have it.


    The printcap man page has a list of all the options, what they''re used for, and
    the default settings. If you''re using a serial printer, you will want to add
    the following settings:


    +   - br—Baud rate to use. Any valid baud rate will work.

    - ms—Stty settings give to the serial port after opening and sending data. This
    is usually to set up things like hardware flow control.


    A sample line addition of an 8-bit connection using hardware flow and running
    at a rate of 38.4 Kbps is


    ```

    br#38400:ms=opost,cs8,-parenb,-cstopb,crtscks\

    ```


    # 6.4 Print Filters


    Print filters are programs that convert from multiple file types to one your printer
    can understand. In most cases, this will be either PostScript (really easy to
    do) or PCL (harder, but not much). The reason PostScript is so easy to use with
    printers is because most of the higher-end printers were connected to UNIX machines,
    and therefore the programs were written to output PostScript. Now that PCL is
    being used more often in the lower-end printers (like mine) and Linux is everywhere,
    you''ll probably need some kind of converter. This is where the print filters
    come in. We''ve had some experience with magicfilter, which is a filter specifically
    for Linux, with much success. Other filters exist, such as apsfilter, and they
    work all about the same. On your machine, you''ll need a number of programs installed
    (ghostscript, netppm, jpeg at the very least, probably TeX and the assembled dvi
    programs). During installation of the filters, the installation script queries
    your system to see what programs are available and makes the best guess to get
    from one graphics format to another. For example, to print out a JPEC image, the
    dpeg program would convert it to GIF format; then the gs program would convert
    from GIF if you expect to be printing files directly from the command line (lpr
    -Plp wayga.gif) or do not have RedHat, you may want to look at getting magic-filter
    or apsfilter installed.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# 6.5 Printers on the Network!


    Now let''s hook printer into a network.


    # 6.5 Printers on the Network!


    When the printcap is set up, you''ll need to restart the printer daemon (lpd)
    which should already be running and will be once Linux starts. To inform Linux
    of the changes on the /etc/printcap file, you can send a signal HUP (1 for Linux)
    to the lpd process. This will cause it to reread the /etc/printcap file and restart.


    # UNIX


    Once lpd is running, the names of the hosts that you want to have access to your
    printers in the /etc/hosts.lpd (for printer access only) or enter them in the
    /etc/hosts.equiv² file. Once this has been done, your printer is available for
    access from other UNIX machines immediately. The “rm” option to the remote host,
    and have the “rp” option name the remote printer. The only other option that needs
    to be is the “sp” option (local spool directory). For added security, the “zs”
    option, if set on the print server side, will accept only print jobs from users
    on the remote machine that have accounts on the server machine. That is, a user
    account of the same name must exist on both machines before the print job will
    be accepted. The lpd monitors TCP/IP port 515(tcp) for activity from print clients.


