  md: '# 22.3 Updating Your System


    # 305


    backups and boot disks and keep the last version of whatever you are upgrading
    just in case. These backups will save you later on.


    # Upgrading Your Distribution and Kernel


    Kernel customization has its own chapter so we''re not going to go into it here.
    There are a few needs that bear mentioning/repeating about installing a new kernel.


    In general, unless you need the features, it is better to stay with a production
    versus a developmental kernel. Linux always develops two kernels simultaneously.
    Those with an even minor revision number are “production” kernels and are more
    stable and more thoroughly debugged. The next minor revision is the experimental
    kernel. As updated or new code is introduced, it is refined in the experimental
    sequence of kernels and then, once it is stable enough, introduced into the production
    kernels.


    Despite all this, it is still possible to enable experimental features in the
    production kernels. Most of the features are available this way are by popular
    demand. These include things like transparent proxy support, multicasting routing,
    frame relay, and support for less common hardware and file systems.


    All of the commercial distributions install a production kernel by default, typically
    a fairly recent one, though rarely the most recent. This means that you upgrade
    your distribution you will always upgrade the kernel. When a newer kernel is installed,
    it may be a large kernel (putting many drivers as directly into the kernel) or
    it installs a number of loadable modules (not all of which you''ll need). After
    upgrading your distribution, it''s usually best to recompile the kernel to suit
    your particular needs. As the production kernel revisions advance, features from
    the development kernels are incorporated. If a feature you need or would like
    to make it into the production kernel and your distribution isn''t available with
    a kernel that includes it, it is fairly simple to upgrade the kernel only; see
    the chapter on kernel administration.


    There are two things you should be shot for not doing when upgrading or modifying
    your kernel:


    +   1. Making a boot disk.


    +   2. Making a copy of your current, working kernel, and editing/etc/lilo.conf
    so you can boot it if your new kernel fails.'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'If you installed Linux on the machine yourself, you should have a boot disk
    from the installation process. Otherwise whoever did the installation for you
    likely has given you or sent with your system a boot disk. If you don''t have
    one, see the chapter on Linux boot and shutdown for instructions on making a boot
    disk.


    When you upgrade your entire distribution, you will definitely want to back up
    at least the / (root) and /usr file systems, and probably your whole machine,
    as well. It doesn''t happen often, but it is possible for a critical library or
    program not to upgrade properly, crippling your machine. You should probably back
    up your /etc directory and /home directories.


    The upgrading process for RedHat Linux and distributions based on it is usually
    an across-the-board upgrading of all the RPM files. Thus it is possible to perform
    essentially the same operations gradually by FTPing the RPM files from their FTP
    sites or a mirror as desired or needed.


    # 22.4 Summary


    As Linux has moved further into the commercial and public eye, the need for easy
    upgrading has grown and been answered. Most distributions allow you to upgrade
    easily from previous versions with only an hour or two of down time.


    With package management tools, it is also straightforward to upgrade specific
    programs or groups of programs. Of course it is always possible to simply obtain
    the source code and upgrade various programs "manually.",'
