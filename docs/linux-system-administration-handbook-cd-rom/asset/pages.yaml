    Neither of us are big C programmers. We know enough to hack C up a little and
    write small programs, but C is such an important language, in a UNIX-like system,
    it is rightly placed first in our list. The kernel and most of the everyday commands
    and tools you use are written in C.If you don''t know C now, in the course of
    compiling and installing software, you will at least become a little familiar
    with it.


    GCC is the "native" compiler for Linux. It supports everything a good compiler
    should: optimization, debugging, ANSI C support, POSIX compliance; and more than
    a lot of compilers that are shipped with or are available for some commercial
    OSEs (SunOS 4 in particular had a very lame compiler, but it was enough to compile
    the first stage of gcc to bootstrap your way up to a full gcc compiler which is
    all we ever used for.


    C is the most popular compiled language for high-performance, general programming.
    Because it is compiled, it is typically faster than an interpreted language like
    Perl or Python. C is also a fairly low-level language. This type leads to longer
    development times for software. On the other hand, because it is a low-level language,
    it is possible to tune code to achieve very high performance.


    Because C exists for virtually every OS and platform, it is usually possible to
    port a C program to other platforms. Architecture or OS-specific libraries obviously
    complicate this process (GUI libraries especially), but frequently angels on the
    target platform.


    When it comes right down to C, C is the foundation for all the other languages
