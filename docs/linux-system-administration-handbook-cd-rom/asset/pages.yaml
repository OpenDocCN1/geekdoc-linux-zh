    breaks in. You can disable FTP users by creating a file called /etc/ftusers. Any
    user who is listed in this file has no ability to FTP. List all your users in
    this file, including root. For users who travel a lot (salespeople or engineers
    working from home), either establish a dial-up connection, or use very trusted
