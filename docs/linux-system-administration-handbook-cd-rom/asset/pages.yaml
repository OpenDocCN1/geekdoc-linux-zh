- pgno: 264
  md: '# 16.9 Using Remote Displays


    superior texture mapping and graphics. The Mesa library and 3Dfx can also be used
    with VRML applications to make very high-quality graphics. Check the Id software
    home page (www.idsoftware.com) for more information about Linux Quake.


    # 16.9 Using Remote Displays


    The biggest advantage of X over Macintosh, Windows 95, and even the standard Windows
    NT is that X can send the output of a program to another X server. That is, I
    am running the program in New York, with the display in my office in Massachusetts.
    Or, programs can run across an office, allowing you to practically control a Linux
    machine from anywhere.


    Three things are required for the remote displays to work. First, there has a
    TCP/IP connection between the two machines. This can be via Ethernet, PPP, ATM,
    and the like. Next, the X server (where you''ll be watching the program) has to
    know that a client wants to send a display. This can be done with the xhost program.
    Running xhost + will allow connections to your X server from anywhere. Running
    xhost +host adds to the list of machines that can access your display. You by
    default, the local machine has access to your display using xhost -host. Note
    that every other machine that wants to send a window to your display must be given
    access. The third item is the client program needs to know where to send the display.
    This can be done using the -display display or by setting the DISPLAY environment
    variable. I prefer setting the DISPLAY variable myself.


    Displays are set with two items: the host to display on and the X server running
    on host to display to. The server itself is broken into two parts: the server
    number and display number. Since X can handle multiple monitors at the same time,
    you will need to specify the host, X server, and monitor to send the client program
    to.


    Fortunately for most Linux installations, this is easy. The X server and monitor
    always begin counting at 0, making the first X server 0.0. Tie in with the host
    name (let''s call it wayga) and you get a setup shown in Figure 16–12


    ```

    setenv DISPLAY wayga:0.0

    ```'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# Chapter 16 • X Windowing System


    ![](img/cd7585e53abd949068548271c07fcdd8_265_0.png)


    **Figure 16–12** Xview of your computer.


    # 16.10 Commercial X Products


    A number of commercial products related to X11 are available. Here we try to give
    you a fairly complete list and a short description of each. Few of these packages
    are available for architectures other than the x86, though Alpha and Sparc versions
    are beginning to crop up.


    # Xservers


    # AcceleratedX


    AcceleratedX is a high-performance replacement for the Xservers that come with
    XFree86. It is produced by XiGraphics (http://www.xinside.com/).


    AcceleratedX supports hundreds of video cards, considerably more than XFree86
    alone does. Additionally, it supports more monitors and offset ports higher resolutions
    than XFree86. Typically it will also squeeze better performance out of your video
    card and monitor.


    However, this increase in performance comes at a cost, AcceleratedX will consume
    more system resources than XFree86.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# 16.10 Commercial Products 245


    XiGraphics also makes a multithaded Xserver, allowing you to run X on up to three
    monitors simultaneously. Metro-X has support for up to four displays built in.


    # Metro-X


    Metro-X is another commercial Xserver. It also boasts support for more cards and
    monitors than XFree86, though not as many as AcceleratedX. Its performance is
    not as good as AcceleratedX''s either. It does, however, cost less and consume
    fewer resources.


    # X Libraries


    In addition to the many additional freeware or shareware X libraries and toolkits,
    there are a couple of commercial toolkits for X.


    # Motif


    Motif was developed by the Open Software Foundation. Its specification is freely
    available, which has allowed the LessTif project to work on a clone of Motif.


    Motif is popular because it provides a number of widgets that allow for the building
    of complex and powerful, but aesthetically pleasing GUIs. It is somewhat resource-intensive,
    but most developers find it a fair trade.


    Both XiGraphics and Metrolink offer an OSF-certified Motif library. Metrolink
    offers versions 1.2.4 and 2.0.1, the latter for both x86 and Alpha architectures.
    XiGraphics offers version 2.0 for the x86 only. Additionally, Redhat (http://www.redhat.com/)
    ships Motif 2.0.1 for the x86, Alpha, and Sparc.


    # OpenGL


    OpenGL is a three-dimensional graphics library developed by SGI. It quickly became
    a standard part of nearly every 3D developer''s toolkit. Metrolink offers its
    OpenGL package for Linux/x86.


    # CDE


    The Common Desktop Environment (CDE) is an effort by several commercial UNIX vendors
    to make a common X/Motif-based environment for on'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'all X desktops, thus providing a common look and feel regardless of which platform
    you are using.


    # 16.11 Summary


    Versions of CDE are available from XiGraphics and RedHat. X is pretty much a standard
    for graphics display on Linux and UNIX. It can be configured however you want,
    providing the control and interface that suits you best, instead of having to
    change the way you work to suit the operating system. The applications that are
    available for X rival those of Windows95, and more are being written every day.'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# Securing Linux 17


    > It may not seem easy, but it has to be done.


    With most of the machines in the world connected via the Internet, security is
    a big concern whether you have hundreds of machines or one dial-up machine.


    No system can be completely secure from outside attacks. Anyone determined enough
    has a good chance of cracking¹ into your system. The best thing you can do is
    to prepare yourself and your machine and make it as hard as possible and also
    be able to detect when you’re being cracked.


    # 17.1 Physical Security


    The first part of keeping the system secure is making sure the hardware-cannot
    be tampered with. Part of the C2 security specification for computer systems


    ¹Contrary to popular belief, people who break into systems are called “crackers”
    and not “hackers.",'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'lems says that the computer must not be physically accessible to anyone without
    access. That is it, it can''t be on the network and must be in a locked room to
    begin with. Chapter 2 has a good list of instructions to keep a typical PC reasonably
    secure from outside attacks. To quickly sum up:


    +   - Lock the BIOS and set the BIOS to boot only from the C drive.

    - Don''t use LILO or at least make it boot directly into Linux.

    - Don''t have DOS or any other OS on the machine.

    - Lock the PC case.


    You should also have people on hand to assist with problems and prevent anyone
    from having the chance to take a computer apart.


    # 17.2 Software Security


    This section is just a bit larger than the hardware security section, and for
    good reason. With TCP/IP having ever over 65,000 ports available for connecting
    to a single machine, this gives anywhere up to 65,000 and beyond possible ways
    for a cracker to enter your system.


    # Monitoring Software


    Programs like COPS and TripWire allow you to routinely monitor your system to
    detect possible holes or to detect some forms of break-ins. You should probably
    get both programs and use them routinely. A program like SATAN will monitor an
    entire network and report on possible holes. Since many crackers probably have
    a copy of this, it is probably best to beat them to the punch and run it on your
    own network before they do.


    # Preventing Root Logins


    The first way that crackers cause real trouble on your system is by getting root
    privileges. There are a few ways to do that, and I''ll list all of them here,
    along with suggestions on preventing such things from happening.


    First, change the root password often! This way, even if a cracker gets the password,
    it won''t be valid for too long. Also keep an eye on your /etc/security file.
    This file lists the locations from which root can log in directly. To get root
    power from any other location, you must first have a valid'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# 17.2 Software Security


    user account; then use the su command to become root. Root can only log in at
    the console by default (tty1 through tty8).


    Another item that should be done is modifying the su program so only members of
    the wheel group can su to root. This is a big problem with the Linux su program,
    in our opinion. The wheel group was designed to be the only group of users that
    can su into the root account. This limits the number of accounts that can be cracked
    to get into root. However, the GNU people think this is a bit authoritarian and
    have their su program designed to allow anyone to su to root, assuming they have
    the password. Other operating systems, such as SunOS and Solaris, require a user
    to be in the wheel group before being allowed to su to root.


    # Secure Shell (SSH)


    You should also start using programs that encrypt passwords as they go over the
    network. The SSH (secure shell) program is excellent for this, as it not encrypts
    the password, but also the entire connection. TCP/IP works now, all data are sent
    over the network in cleartext (i.e., not encrypted). Anyone who has a network
    sniffer on any machine on the network, or on any network between you and your
    destination, can read the password you type in. Bad stuff. The SSH program encrypts
    all this, plus does some checking to verify the host you''re connecting from and
    the host you''re connecting to. You should be using this program within your LAN
    and when connecting to other sites. Commercial versions of SSH for Windows and
    other platforms are available, allowing all the clients on the network to have
    secure connections.


    The SSH program is designed to be a replacement for the "r-” commands (login,
    r, rcp) and can install itself so it replaces those commands. If users have .hosts
    files set up, SSH will still use those files. Users will not have to change their
