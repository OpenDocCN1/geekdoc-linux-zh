- pgno: 397
  md: '376


    # D • Appendix


    34-223 UNALLOCATED


    224-254 LOCAL USE


    Allocated for local/experimental use


    Please note that MAX_CHRDV and MAX_BLKDEV in linux/include/linux/major.h must
    be set to a value greater than the highest used major number. For a kernel using
    local/experimental devices, it is probably easiest to set both of these equal
    to 256. The memory cost above using the default value of 64 is 3K.


    255 RESERVED


    # D.5 Additional /dev Directory Entries


    This section details additional entries that should may exist in the /dev directory.
    It is preferred that symbolic links use the same form (absolute or relative) as
    indicated here. Links are classified as “hard” or “symbolic” depending on the
    preferred type of link; if possible, the indicated type of link should be used.


    # Compulsory links


    These links should exist on all systems:


    +   /dev/fd /proc/self/fd symbolic File descriptors

    /dev/stdin fd/0 symbolic stdin file descriptor

    /dev/stdout fd/1 symbolic stdout file descriptor

    /dev/stderr fd/2 symbolic stderr file descriptor


    # Recommended links


    It is recommended that these links exist on all systems:


    +   /dev/X0R null symbolic Used by iBCS-2

    /dev/nfsd socksys symbolic Used by iBCS-2

    /dev/core /proc/kcore symbolic Backward compatibility

    /dev/scd? /dev/cd? hard Alternate SCSI CD-ROM name'
  merge: -1
  img_proc: true
- pgno: 398
  md: '# Locally defined links


    The locally defined links may be established locally to conform to the configuration
    of the system. This is merely a tabulation of existing practice, and does not
    constitute a recommendation. However, if they exist, they should have the following
    uses:


    ```

    /dev/mouse  mouse port       symbolic Current mouse device

    /dev/tape    tape device      symbolic Current tape device

    /dev/cdrom   CD-ROM device    symbolic Current CD-ROM device

    /dev/modem  modem port       symbolic Current dialout device

    /dev/root    root device       symbolic Current root filesystem

    /dev/swap    swap device       symbolic Current swap device

    ```


    /dev/modem swap should not be used for a modem which supports dialin as well as
    dialout, as it tends to cause lock file problems. If it exists, /dev/modem should
    point to the appropriate dialout (alternate) device.


    # Sockets and pipes


    Non-transient sockets and named pipes may exist in /dev. Common entries are:


    ```

    /dev/printer  socket  lpd local socket

    /dev/log       socket  syslog local socket

    ```'
  merge: -1
  img_proc: true
