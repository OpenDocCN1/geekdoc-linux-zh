    # Differences between Versions 1 and 2


    Version 2 is out of beta, but as of this writing, there are still a few bugs related
    mainly to stability. If you are happy with your mSQL 1 setup, you should probably
    wait a couple of patch levels (2.0.1 is the latest) or for 2.1.


    If you are using mSQL 1, there are a number of reasons you might want to upgrade.


    Joins in version 2 are much more efficient. Version 2 supports sequences, which
    were previously handled on the client side, and greatly enhanced indexing. Additionally,
    version 2 supports more data than version 1, most importantly the TEXT type, a
    variable length character field.


    Version 1 supports fairly rudimentary WHERE specifications, version 2 allows various
    WHERE clauses to be grouped with parentheses. Finally, the newer version allows
    for more flexible runtime configuration (as opposed to compile-time configuration)
    and supports more simultaneous client connections.


    # Some Other Notes


    mSQL''s author claims that it will manage up to 4 Gb of data but suggests that
    other system limitations will make such a large database impractical under mSQL.
    It''s not entirely clear how this number is arrived at or, if this comes from
    a real-life example, how many rows this corresponds.


    Linux 1.3 or higher is required. Earlier versions do not have mmap support which
    mSQL 2 requires. Additionally, you should have the kernel sources installed to
    ensure that you have all the necessary libraries and header files.


    For an example of how to install mSQL, see the Web serving chapter.


    # MySQL


    An increasingly popular free database server, MySQL, started off as an enhanced,
    free version of mSQL 1. It attempted to add a complete set of the ANSI SQL specifications
    plus some enhancements. Today it implements nearly all of ANSI SQL and a bevy
    of additional features.'
