- pgno: 194
  md: '# 3.1 MySQL and mSQL


    Like mSQL, it implements a regular expression like separately from LIKE to enhance
    performance. It is also fairly lightweight, though not as light as mSQL.


    Here are some things that MySQL supports that mSQL doesn''t:


    +   - Expanded SQL, including things like an ALTER TABLE clause (allowing for
    columns to be added or dropped from a table after it is created), and embeddable
    functions which operate on all the data types.

    - More data types, especially BLOBs (Binary Large Objects), and varying sizes
    of existing data types, for example, tiny, small, medium and large integer types.

    - Usernames and passwords independent of the /etc/passwd. This is nice for CGI
    use. Rather than having to allow the user “nobody” read and possibly write access
    to the database, you can require a valid MySQL username/password combination that
    you can ask for on a form. The level of access a user can be controlled on an
    operational (selecting, deleting, updating, reloading, or shutting down the server)
    database and host level.

    - Optimized queries, including optimizations for joins (all joins are done in
    one pass).

    - Multithreaded and to handle multiple requests concurrently. This means that
    subsequent queries will not have to wait on a large, time-consuming query that
    was presented to the server first.

    - Much looser licensing requirements—basically, unless you are going to sell mSQL,
    you don''t need to purchase a license for it.

    - Currently serving larger databases (as many as 50 million rows) than mSQL. This
    isn''t to say that MySQL couldn''t handle such a large database-base, it is just
    an empirical observation.


    Some disadvantages to MySQL include


    +   - Not as lightweight as mSQL.

    - More complex access control system. This is probably the most difficult aspect
    of MySQL to master.

    - Not quite much as support on the Net.

    - Not as widely supported by various scripting languages.'
