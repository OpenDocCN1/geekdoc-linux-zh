    # 15.6 Setting up a Killer Web Server


    This section will walk you through setting up a “complete” Web server: Apache
    with PHP/FI compiled in and integrated support for MySQL, a freeware (for most
    purposes) database server. While this is not a typical setup, it is an extremely
    powerful one that is becoming more common.


    In this setup, Apache depends on PHP which in turn depend on MySQL. Consequently,
    you need to install MySQL first. It should be noted that PHP does not require
    any database support at all, but the idea behind this exercise is to build a web
    server with fast CGI-like features tied in a very fast database server.


    # MySQL


    If possible, when you are anticipating large amounts of database activity, MySQL
    should be installed on a separate physical disk from the document root of your
    Web server. The MySQL source is available from the MySQL home page at http://www.tcx.se/
    as well as from mirror sites in the United States. If you prefer, you can retrieve
    a precompiled binary distribution. There is also an active mailing list for MySQL.
    Information on joining it can be found on the MySQL homepage. Documentation is
    available as well.


    The most recent versions of MySQL require recent versions of libc. If you don''t
    have a new enough libc or skittish about upgrading it, just install a binary version.


    If you install a binary distribution, it will create a directory named mysql-<version>
    with various subdirectories for libraries, header and data files. If you compile
    and install from the source, mysql subdirectories will be created in /usr/local/lib
    and /usr/local/include. The data folders and files will be created in /usr/local/var.


    Note the prefix path (/usr/local) by default, it will be needed to compile PHP
    and, later, Apache.


    MySQL uses GNU autocf. There are a few configuration options to be especially
    aware of:


    ```

    --prefix Installation directory prefix (/usr/local

    by default)

    --enable-thread-safe-client Make thread safe client library.

    ```'
  merge: -1
