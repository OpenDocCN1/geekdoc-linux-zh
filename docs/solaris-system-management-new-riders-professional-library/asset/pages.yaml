    # # 3

    Divering the Goods


    THIS CHAPTER PROVIDES A BRIEF INTRODUCTION TO service level management and service
    level agreements. These subjects have become big issues in recent years and have
    warranted several books. Some references for further reading can be found in the
    Appendix, "Resources."


    # ## Overview


    The IT systems and the corporate networks present in today''s businesses have
    become what''s known as mission-critical—that is, they are crucial to the survival
    of the business. Unlike a tangible asset, such as a building or production equipment,
    the corporate network is a collection of assets and services. The networks today
    are central to support-ing business objectives of the organization.


    The system manager is responsible for providing the IT services to the business.
    He must be in a position to deliver services in an efficient and effective manner
    and, more importantly, in a way that is acceptable to the business so that it
    can survive in today''s extremely competitive global market.


    The system manager''s customers, or clients, are becoming increasingly dependent
    on the services that he provides. They are also becoming more technically aware,
    which has given them a much better idea of what they can reasonably expect of
    the IT department. The client is now demanding more, particularly in terms of
    the quality'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# Chapter 3 Delivering the Goods


    of service. Conversely, the IT department is being expected to do more with less.
    Computer networks are expanding at a frighteningly fast rate, both in size and
    complexity, and the expenditure and human resources are not increasing at a corresponding
    rate; they are reducing because of so-called automation tools that have come on
    to the market. So far, these have shown only limited success, partly because the
    system management tools and utilities that are necessary for controlling and monitoring
    the enterprise are missing or underpowered. As a result, there has been insufficient
    meaningful data available to be capable of determining the level of success that
    IT departments are achieving. For a long time, data has been available for various
    portions of a service, such as individual system performance, network performance
    information, and so on, but nothing really has been available on the end-to-end
    delivery of a service. It is kind of data that will allow the performance to be
    measured to any degree of accuracy.


    Previously, the system managed success by various factors, which were always related
    to hardware and software components, such as system availability, performance,
    and so on. These might have given the impression that all was well, that he was
    doing a great job, and that all the customers must also think the same.


    On the other hand, the client may have had a different opinion. Certainly, the
    main computer system may have been up and available for 366.94 days out of the
    last 365, but the network was not, and neither were the printers, so the client
    lost a lot of time and became increasingly frustrated at the lack of service being
    provided.


    The result is that there is no mutually acceptable agreement between the two perspectives,
    and is where service level management comes in.


    # Service Level Management


    Traditionally, IT departments were funded as a corporate overhead—that is, paid
    out of a central budget that was not particularly to any specific department.
    Service level agreements came into existence when IT departments started to charge
    for the services being provided, normally via the chargeback method (described
    in Chapter 2, "The IT Budget). So, with each department having to pay for its
    IT services out of its own budget, became clear that there would be ways of quantifying
    the service being provided and attaching a reasonable cost to the provision of
    the service. The consumer also needed to know whether the service being provided
    was worth paying for—and, if not, how to claim a refund!


    The terms service level management and service level agreement have become popular
    in recent years because of IT departments being challenged about the level of
    service that they are actually producing. Questions have been asked, such as,
    "To extent are the users and the computer applications being supported?", Is the
    reliability of the network and computer systems acceptable?", "Are the IT services
    being provided in accordance with the business objectives and expectations?",
    and "Is the IT department providing value for money?"'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'Of course, these questions could not be properly answered because there was
    no means of determining the level of success or failure. The system manager could
    argue based on the performance and availability figures, but the client could
    counter with a documented list of occurrences when he or she was able to carry
    out a required job because the network was down or the system was running too
    slowly.


    Service level management addresses these issues by ensuring that all parties understand
    what is expected from each. The system manager probably has to hear some unwelcome
    news in that he hasn''t been doing a great job as previously thought, and the
    client may well realize that what is being asked for is totally unrealistic. The
    objective is a mutual understanding and, most important, an understanding that
    is written down and agreed by all parties concerned.


    Service level management is all about quality of service and how to measure it.
    To determine the quality of the service provided, it is necessary to adopt the
    view of the customer—that is, the person or people making use of the service (consumer).
    A dissatisfied customer will not want to use your services again. It is the ultimate
    test of quality; the opinion of the consumer. This is most of the time, but in
    our case, there is nothing substantial with which to make a comparison, no baseline
    that defines what is acceptable. Consider the following example in which quality
    can be measured:


    A car for sale at the local showroom. The customer can test-drive the vehicle,
    read the sales literature, compare to other similar types of car available from
    different manufacturers, or read reviews about the car in various motoring magazines
    and journals. In this case, the service agreement is the warranty that is taken
    out when the car is purchased. The customer will be entitled to free repairs if
    a specified fault occurs within a specified period and will have the use of a
    courtesy car when any repairs are being carried out. The customer, though, must
    have the car regularly serviced by an approved technician, and no modifications
    be made to the car. If a repair cannot be effected, then the customer will be
    given a replacement car. This agreement is clearly defined and agreed by all parties.
    The expectation is that the car function without any problems for the entire period
    of warranty. From the customer''s perspective, the fact that completing the repair
    may mean ordering spare parts abroad is of no concern or relevance. The customer
    leaves the car with the dealer and expects to have it returned in working order.


    In the same way, the IT department is merely providing a service to the customer,
    but the system manager''s responsibility might be only a part of that service.
    To provide the entire service may involve the hardware support technicians, the
    network team, development services, database administration and central hosts,
    to name a few. This is of no interest to the customer, and it shouldn''t be. The
    customer wants something, and the IT department (as a whole) provides it. The
    customer isn''t concerned with all the technical bits of computer wizardry that
    may be involved in providing the service, nor in the fact that there are several
    sections within the IT department involved—this is irrelevant.'
