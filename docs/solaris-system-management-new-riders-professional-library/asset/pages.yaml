    # Access Control Lists


    The standard UNIX file and directory permissions allow three categories of access
    to be specified: the owner of the file or the directory, and everyone else (known
    as “other”). Sometimes this is insufficient, particularly when individual, specific
    access is required. Consider the following example:


    The system manager (user:john) is compiling a management report file monthly,
    but he requires input from another manager, the network manager (user: bill).
    The file is owned by user john and is group-readable by group managers. The requirement
    is for the other manager to be able to write to the file, but some managers in
    the group should not be able to write to it, so the option of allowing group write
    permissions is not acceptable. Of course, one alternative is to give the user
    bill his own copy of the file. This is inefficient, though it creates multiple
    copies of the same file, which will end being different.


    The access control list (ACL) provides the answer to the problem. ACLs provide
    a finer level of file and directory access permission and easily solve the problem
    outlined. User john can now give explicit access to user bill in the form of an
    ACL, as shown here.


    The original list shows the permissions as stated:

    $ ls -la monthly

    -1 john managers 2872175 Jul 8 15:24 monthly

    -rwxr------


    User john executes the command to give user bill the required access, to be able
    to write to the file:


    ```

    $setfacl -s user:bill:user:rwx,group:r--,other:---,mask:rw- monthly

    $

    ```'
