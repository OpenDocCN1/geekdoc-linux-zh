- img_proc: true
  md: '# Creating a DMZ


    You can combine secure packet-filtering and application-level firewalls in series,
    one after the other. This has the advantage of increased protection from a greater
    variety of attacks. If you take this one step further, using two packet-filtering
    routers and an application-level firewall in the middle, the most secure firewall
    can be created through the use of a demilitarized zone (DMZ). This creates a separate,
    isolated network between the private company network and the external network
    (the Internet).


    An advantage of this type of setup is that direct transmission across the DMZ
    is prohibited, denying any attacker direct access to the company network. It is
    in the DMZ that a company might place public data or a download area where external
    users can still legitimately access the publicly available company information,
    but the private company network is protected, while still retaining the capability
    to communicate on the Internet.


    # Security Products


    This section provides an insight into some of the security products that are available
    for Solaris. It is not intended to be an in-depth discussion; it will serve to
    raise awareness that this will prompt security managers to investigate products
    of interest more thoroughly. Some additional resources are shown in the Appendix.
    This section covers three main aspects: those that come as part of the Solaris
    operating environment, those that are provided by Sun Microsystems as unbundled
    products, and finally, some products that are available from third-party vendors
    or in the public domain.


    # Bundled with Solaris


    The first lists those that come bundled with the Solaris operating environment
    and that are available immediately following the installation of the operating
    environment. An advantage that these products possess is that no additional configuration
    of the system is required to make use of them right away.


    # Password Management Features


    Solaris, by default, provides a number of password management features.These are
    discussed briefly here:


    +   **Aging of passwords**—The system administrator can force the user to change
    his password after a specified period of time, warn the user that a change is
    imminent, and prohibit him from immediately changing back to the old password.
    When selecting a new password, the user is also prevented from using a previously
    selected password. The mechanism ensures a newly selected password meets the specified
    criteria—that is, the correct number or symbols.'
