  md: '# Creating a Service Level Agreement: An Example 51


    Senior management now has become involved and has suggested that a service level
    agreement be drawn up between the IT service provider and the sales department.
    The reasons for this are detailed here:


    +   - A performance problem is costing the company in lost business. This is not
    quantifiable, but it could potentially affect repeat business from existing customers.


    +   - The IT department cannot produce sufficient supporting data to demonstrate
    that the systems are providing the required level of service.


    +   - The sales department has not made clear its objectives and priorities.


    +   - There appears to be a breakdown in communication between the help desk and
    the IT department.


    +   - The business requires a definition of what constitutes an acceptable level
    of service. It also requests that the necessary monitoring tools be put in place
    to measure the performance against defined targets. The information is to be used
    to identify where improvements can be made. A cost/benefit analysis can then be
    carried out to ensure that any expenditure will provide value for money.


    # The Service Level Agreement


    The scenario described in the previous section clearly shows the need for a service
    level agreement. This section outlines the step-by-step process of creating a
    mutually acceptable agreement.


    # Step 1: Obtain the Agreement


    First, before any progress can be made, the senior management from the IT department
    and the sales department agree that there is a requirement for a service level
    agreement to be put in place. It is clear that the service provided by IT is insufficient
    for the sales team and also that the sales department needs to clearly identify
    what expectations are and to prioritize them accordingly.


    After a brief meeting involving the two senior managers, the system manager and
    the sales manager, it is accepted by all parties that the agreement is the only
    way forward. From the IT department''s perspective, the creation of the agreement
    may have a positive outcome in that deficiencies that are deemed unacceptable
    can be used as justification for securing additional funding to improve performance.
    The benefit is recognized mainly in the area of telephone sales, where business
    will not be lost as a result of slow system response times.'
  merge: -1
  pgno: 68
