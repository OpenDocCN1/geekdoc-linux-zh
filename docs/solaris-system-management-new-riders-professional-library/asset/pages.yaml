  md: '# A Resources


    # Getting Help


    The days of wading through countless hard-copy computer manuals are over. A vast
    amount of information and documentation is available, if you know where to find
    it and have the necessary access. This section discusses sources of information
    and help that can answer virtually any Sun- or Solaris-related question and satisfy
    virtually any requirement—all without picking up a single book.


    # Online Manual Pages


    A comprehensive set of manual pages is supplied with the Solaris operating environment,
    but they are installed by default with the Developer and Entire Distribution configuration
    options. They contain online help for all the available commands, programming
    functions, and procedures, as well as a number of configuration files, such as
    syslog.conf, used for configuring the system-logging daemon, syslogd. The base
    directory for the manual pages is normally /usr/share/man or /usr/man. (/usr/man)
    is a symbolic link to /usr/share/man, the physical location of the manual pages.


    The majority of applications installed as Solaris packages also contain manual
    pages for the specific product. Most of the public domain software installs manual
    pages by default to the directory /usr/local/man.You can access these extra pages
    in two ways: by choosing the /usr/share/man location for help files as part of
    the package installation, or by appending the location of the manual pages (in
    this example, /usr/local/man) to the variable MANPATH.'
  merge: -1
  pgno: 290
