  md: '# Recharge Accounts


    A recharge account is like a large bucket where charges are deposited. The charges
    are for the costs of staff working in the department that “owns” the budget. The
    idea is that these costs are debited from the recharge account, but the department
    also charges for the services that it provides to other departments. The revenue
    gained from providing the services reduces the deficit in the recharge account.
    The objective at the end of the financial year is for the recharge account to
    be at zero. It will never be truly at zero, but for a $5 million budget, a deficit
    of up to say, $500,000 would be possible because the manager should not schedule
    his staff to be more than 20% utilized. It is to take scheduled and unscheduled
    absences out—after all, no one works every single day of the year. Staff members
    take leave, get sick, attend training, and so on, but they are still paid, and
    that money comes out of the system manager’s budget.


    It doesn’t work like that in practice: Many members of staff find that they are
    more than 100% utilized and work longer hours. A significant proportion of the
    manager’s time may also be booked to the recharge account if it is not being attributed
    to project work. This is the management overhead incurred at the beginning of
    this chapter.


    # Chargeback Systems


    Some companies operate chargeback systems: Departments within the business charge
    other departments for the provision of services. Normally, within commercial organizations,
    a department pays IT a support fee for each system that is to be supported. The
    system manager must ensure that the total amount charged for the services is sufficient
    to be able to run the operation—that is, should cover its own costs. The system
    manager will need to set aside additional funding to allow for upgrades and hardware
    failures. An initial figure for this could be derived using the previous years’
    figures as a baseline.


    Another method used, particularly in government, is to assign a chargeback rate
    to a grade—for example, a system engineer might attract a rate of say, $400 per
    day. When the engineer works out on a specific project or cost center (the relevant
    number of hours are booked to project code or see the section “Project Budgets,”
    later in this chapter). Under these circumstances, managers are under greater
    pressure to ensure that the people working in the department are fully utilized
    so that the maximum amount can be charged to other departments or projects. If
    the recharge is higher than the actual salary paid to the employee, the manager
    can appear to make a profit in the recharge account—known as over-recovery. A
    significant over-recovery at the end of the financial year might appear to be
    very good because it shows the department as highly profitable. This is not necessarily
    the case, though, because it could mean that the recharge rates are unrealistic
    or that the department is under-resourced and that the staff is being required
    to work too many hours.'
  merge: -1
  pgno: 45
- img_proc: true
  md: 'The opposite can occur as well. If an employee is not fully utilized with “bookable”
    work, where does he or she book the remaining hours to? The answer is that they
    get booked to the recharge account. A good example of time being booked to the
    recharge account is if there is a team meeting. When the cost is not met by charging
    a department or project, that is known as under-recovery—that is, the cost of
    employing the person for that period of time was not recovered. The system manager
    usually forecasts the under-recovery figure based on the predicted program of
    work for the coming year. It must be stressed that this figure can be only an
    estimate because new requirements could be raised, or a predicted project could
    be cancelled or postponed.


    # Revenue Forecasts


    Several legitimate reasons explain why the forecast could become less valid as
    the year progresses. For these reasons, the budget forecast is compared against
    actual expenditure on a monthly basis, and the forecast should be adjusted up
    or down based on current performance. The advantage of doing this is significant
    overspending (underspending) can be identified as early as possible so that remedial
    action can be taken before the end of the financial year. You have noticed how
    many companies suddenly start buying new computers or furniture just before the
    end of the financial year. It is because underspending has been identified in
    the budget—and, all budget-holders know, if the money isn’t spent, even less will
    be accurate all next year!


