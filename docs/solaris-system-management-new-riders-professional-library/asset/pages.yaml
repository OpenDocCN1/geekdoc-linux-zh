- img_proc: true
  md: '# Chapter 3 Delivering the Goods


    It can be seen that there is a difficulty in defining “quality of service.” There
    is nothing to compare it to—no baseline, no agreed tolerance. The service level
    agreement (SLA) is created to address this lack of clarity, allowing the service
    to be monitored and its performance to be measured.


    A service level agreement is a contract between a provider and a consumer—in this
    case, the provider is the IT department, with the system manager being a major
    part of it. The consumer could be the accounting or sales department. Often, SLAs
    between internal organizations within the same company would not form legal contracts,
    but one with a third-party supplier would. The primary reason for its existence
    is to define, in measurable terms, what is provided and what is expected, and
    then to determine how well (or not) the service is being provided.


    Perfection is something that is not achievable. The SLA does try to achieve 100%
    perfection, but it does define the level of imperfection that is acceptable. It
    also defines what is desirable and what is possible. Basically, the customer must
    make realistic expectations. There is no point in asking for something that cannot
    be delivered because it would undermine the whole process and make any SLA meaningless.
    A crucial part of setting up any SLA is that a common understanding is agreed
    and documented by both provider and consumer.


    As of the SLA process, cost must be borne in when trying to improve the service.
    It is quite likely that with financial expenditure, the quality of service could
    be improved. One maybe significantly, but at what cost? It may completely outweigh
    the perceived benefit. Even though the cost is not directly related to the quality
    of the service being provided, it must be considered as a potentially limiting
    factor.


    The next few sections provide insight into some of the issues surrounding service
    level management and the SLA process. This coverage is not intended to be an exhaustive
    discussion, but it is enough to appreciate the sort of things that are included.
    An example is included at the end of the chapter.


    # Provider or Consumer?


    As stated before, the SLA is a contract between a provider and a consumer. The
    parties can be loosely defined as follows:


    +   * Provider—The person or department providing service for others to use. This
    may be internal to the company or a third-party supplier.

    * Consumer—The person or department making use of the service that is being provided.


    To complicate matters, on one hand, the system manager can be, and is often, both
    a provider and a consumer. This matters a special challenge when trying to draw
    up a service level agreement with it. On one hand, the system manager is providing
    the computing'
  merge: -1
  pgno: 53
- img_proc: true
  md: 'services to the business, but on the other hand, he must make use of services
    provided to him—the network, for example. Here, he is a consumer of a service
    which may already be the subject of a service level agreement: a telephone company
    in this case, supplies the various communications media. This will usually be
    a third-party supplier and to a formal contract with associated penalties for
    substandard service.


    The service level agreement will form a part of the formal contract. The system
    manager, as both provider and consumer, will have to take this into account when
    entering into any agreement with the business. This is because there is a risk
    that the provision of the entire service could be jeopardized if this part fails—indeed
    may prompt him to seriously review the dependencies that could affect his ability
    to deliver the service. The third-party supplier managing the network in this
    case is an extremely important dependency because a network failure would undoubtedly
    have a significant effect on the system manager’s ability to guarantee a level
    of service.


    Database administrators and developers could be further examples of dependencies
    that the system manager must take into account. If there are no agreements with
    either of these areas, he will be unable to specify when either a database problem
    will be resolved or an application bug will be fixed.


    From the consumer perspective, this is irrelevant. The consumer makes use of the
    IT infrastructure and computer systems so that a task can be carried out. As stated
    earlier, the fact that several sections or departments may be involved in the
    provision of service is of no interest to the consumer. However, as part of the
    negotiation process, the system manager will have to make clear any dependencies
    that could affect his ability to deliver the required level of service. The consumer,
    while not interested in the mechanics, will gain useful knowledge of how the service
    is provided.Value lies in the fact that the consumer’s understanding of the issues
    is enhanced.


    This difference in perspective is one of the main reasons why it is necessary
    to first arrive at a common understanding. The importance of documenting the understanding
    is to avoid future ambiguities and potential conflicts due to misinterpretation.
    This will certainly happen if the agreement is not documented.


    # What Are Dependencies?


    Dependencies in this instance can be defined as anyone, or anything, that the
    system manager relies on in the provision of the required level of service.'
