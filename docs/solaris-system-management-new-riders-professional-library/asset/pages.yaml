  md: '# Software in the Public Domain


    Historically, a significant number of system managers have prohibited the use
    of public domain software because of the “as is” nature of the software, the perceived
    risk of becoming infected with a virus, and the lack of formal support. This notion
    is slowly being eroded as the software’s usefulness begins to be appreciated and
    because support for the majority of the packages is now available.


    This section identifies some of the more popular public domain software packages
    that are available for Solaris environments. Even though these packages are free,
    many books have been written about them; some of these are listed in the Appendix.


    # Apache


    Apache is a commercial-grade, freely available HTTP (Web) server package. It was
    created by volunteers from around the world who worked to develop the server and
    its associated documentation. Unlike other freely available software applications,
    Apache comes with the source code. Apache runs not only on Solaris, but also on
    versions of UNIX as well as Windows NT/9x, NetWare, and OS/2.


    When you connect to a home page on the Internet, there is a good chance that the
    server providing the Web pages is running Apache server—this is the most popular
    Web server in use. In addition to the Apache Web server, an Apache-SSL Web server
    implements the Secure Socket Layer (SSL) protocol and is widely used as a secure
    Web server. Like Apache, the Apache-SSL Web server is freely available for commercial
    and noncommercial use.


    Apache is a highly configurable and scalable product. It can run on the largest
    clusters or just a single PC. It is also modularized and can be easily extended
    using third-party modules. Alternatively, modules can be written using the Apache
    module API.


    A final feature of Apache, one that was requested by users of the product, is
    that Apache supports virtual hosts, also known as multihomed servers. This allows
    the server to distinguish among requests that have been made to different IP addresses
    or host names even though they are all mapped to the same physical host. A virtual
    host can be used to receive requests on different URLs, usually with the same
    IP address, so that different sets of documents are accessed depending on the
    URL entered (for example, viewing home pages for different clients or members
    of the company).


    Virtual hosts can be name-based, IP address based, or a mix of the two. Name-based
    virtual hosts are the preferred method, but they support only HTTP version 1.1
    clients (the host names must be registered on the Web), a large number of organizations
    still use IP-based virtual hosts, though there remains a small proportion of clients
    that do not support HTTP 1.1. Because the Internet is running out of IP addresses,
    the full transition to name-based virtual hosts will be necessary in the coming
    years.'
