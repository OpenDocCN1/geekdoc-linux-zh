  md: '# Novell NetWare Support IPX Discover


    Solstice Site Manager can centralize network management by using the NetWare Management
    Agent (NMA), an SNMP agent sold by Novell that resides on NetWare servers running
    TCP/IP. This allows Site Manager to manage the NetWare server''s file system,
    print queues, and users. Solstice Manager also can import the topology details
    from a Novell Wise network management console and can use this to view the PCs
    on the NetWare LAN as a separate view from the systems it is already managing.


    # Solstice Domain Manager


    Solstice Domain Manager is the tool to use for large or multisite network management
    of Solaris systems, although it also manages multivendor environments. The software
    is designed to manage up to 10,000 nodes.


    The Domain Manager software includes all the tools present in Solstice Site Manager,
    but there is no restriction on the number of managed nodes. In addition, it comprises
    the full version of Solstice Cooperative Consoles so that it can send and receive
    information to other consoles. Solstice Domain Manager is designed for large installations
    so that multiple Solstice Site consoles can feed information into a Solstice Domain
    Manager, or even multiple Solstice Domain Manager systems. These can be configured
    as peer-to-peer devices, enabling shared administration capabilities, if required.
    Figure 14.7 shows how a typical configuration might connect multiple Solstice
    Site Manager consoles.


    ![](img/20459f772e7361286cec3e76e3bd26b4_282_0.png)


    Figure 14.7 The Domain Manager console provides a further level of hierarchy and
    manages all the attached Site Manager Consoles, which, in turn, can still delegate
    requests to proxy servers.'
