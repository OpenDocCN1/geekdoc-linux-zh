  md: 'Diskless client—This client is a Sun workstation with no hard disk drive of
    its own. The only hardware requirement is a network adapter so that it can communicate
    across the network. A diskless client obtains its root (/) and /usr file systems
    from a dedicated operating system along with its swap space. The only thing that
    it knows about when it is turned on is its own Ethernet or MAC address. This is
    sufficient information for the client to communicate with its server and download
    the kernel that it can boot up.


    Diskless clients generate significantly more network traffic because all of their
    file systems reside on the remote operating system server, which is the main reason
    for locating the server on the same subset.


    They do have their advantages, though. Diskless clients are ideal for placing
    in nonsecure areas because they contain no permanent data (because there is no
    hard disk). Thus, the new workstations in the scenario at the start of the chapter
    are more likely to be diskless clients. They are also easy to administer centrally
    because everything is done from the server.


    Autocient clients—This client is a Sun workstation, as discussed previously, but
    it has its own hard disk. Autocient workstations use the hard disk to cached copies
    of the root (/) and /usr file systems, and they also maintain their own swap space.
    Approximately 100MB of local disk storage is required for an autocient system
    to function. The root (/) and /usr file systems are downloaded-from the operating
    system at boot time and are stored in cached file systems. Changes to the file
    systems are replicated in both directions. Therefore, this generates less network
    traffic than a diskless client and also has the capability to disconnect and still
    continue to function if the operating system server becomes unavailable. Like
    the diskless client, autocient systems are administered centrally, making them
    easier to manage. In the scenario earlier, the 150 workstations in the secure
    area would benefit from being autocient workstations; they are inherently more
    vulnerable because of the possibility of residual data being left on the hard
    disk.


