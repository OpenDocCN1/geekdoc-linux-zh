  md: '# Service Level Management 49


    # Penalties for Missed Targets


    When the service agreement is between two departments working in the same company,
    it is unlikely that there will be a financial penalty for nonperformance. The
    only time that a financial penalty might be imposed is when the company runs a
    recharge scheme, or when the provider is operating as a profit center, charging
    all its costs to its customers. In these cases, it is reasonable that the client
    would want to claim compensation for a degraded level of service.


    It is worth noting that if the agreement is between an internal department and
    a third-party supplier, then compensation for failing to meet an agreed target
    is usually part of the contract drawn up between the parties.


    Sometimes the penalty clause is left out of an SLA altogether because the emphasis
    is directed so heavily on what is expected and the parties forget to include a
    section on what to do if either fails to meet the objectives.


    There are alternatives to a penalty clause, and a lot of companies do not like
    to use the term penalty. One option is to use an escalation procedure for nonperformance
    to identify and resolve the issue. This means that when the objectives of the
    SLA are not reached and the tolerances are exceeded, an escalation procedure is
    invoked. The detrimental effect of informing management, which can be embarrassing
    and uncomfortable. The aim of the SLA is not to punish, but to provide the incentive
    to always try to meet at least the targets, if not exceed them.


    If the provider is constantly performing beyond the agreed level, then the SLA
    itself might need revisiting the expectations possibly have been seen too high
    and are therefore unrealistic. This is not an indication of failure—it could merely
    be an indication that the negotiation process did not achieve a mutual understanding
    of the service being provided.


    It should be remembered that the original aim of setting up SLAs is to be able
    to define and manage mutually acceptable levels of service. The SLA should identify
    areas of the service that need improving and focus on these areas instead of looking
    for ways of punishing substandard performance.


    # Using an Escalation Procedure


    An escalation procedure is a defined set of steps to do two things: raise the
    profile of a perceived issue and get something done about it. The means of escalation
    in this case would probably be in the form of a service level exception report,
    a written report circulated to management highlighting the underachievement. Now
    aware of the problem, it is expected to “take ownership” of the issue and exert
    pressure so that it doesn''t happen again.


    A more common, everyday example is when, as a consumer, you have the right to
    complain about the quality of the products you have purchased. When your complaint
    is not dealt satisfactorily, you demand to see the manager. You have now escalated
    the situation to a higher authority.'
