  md: '# Network Load 245


    In this example, 31% of packets be transmitted onto the network are colliding
    with other packets and require retransmission. A network functioning normally
    should expect the collision rate to be 2% or less. A collision rate of between
    between 2% and about 8–10% depicts a normal, busy network, but anything over 10%
    is a clear indication that the network (or at least the segment to the system
    being examined) is too heavily loaded and needs to be addressed.


    The previous example describes a nonswitched Ethernet network, where collisions
    are often an issue to be addressed. For course a Token Ring network, including
    FDDI, does not suffer in the same way as an Ethernet network does because the
    use of a determines which (single) host can send traffic. In a switched network,
    the “switching” virtually eliminates the use of collisions and is a solution to
    heavy-loaded nonswitched Ethernet network, which is subnetting.


    The next section describes subnetting, a method of segmenting the network to reduce
    the circulation of network traffic and thus reduce the collision rate. It also
    discusses other benefits that subnetting provides.


    # Subnets


    Subnetting involves segmenting an existing network into a number of smaller, separate
    networks. Subnetting might be considered be a valid option for several reasons:


    +   Collision rate—If the number of collisions is high, as in Listing 13.1, splitting
    the network into a number of subnetworks localizes the propagation of the majority
    of the network traffic.


    +   Large numbers of hosts—A large number of hosts exist on a particular network—say,
    greater than 25 or 30.


    +   Performance—Performance of network applications is degrading as more access
    the network.


    +   Isolating network power users—Users of network-intensive applications can
    be provided with a dedicated subnet so that usage does not adversely affect other
    users. A good example of this is in an engineering section, where graphical models
    are shared between a server and a small number of users.


    +   Security—The use of subnets is inherently more secure because network packets
    are restricted to the subnetted network instead of being propagated to the whole
    network. For example, a standard class C network, 210.127.8.0 supporting 255 hosts
    (with a network mask of 255.255.255.0), could be segmented, into 15 smaller networks,
    each of 14 hosts (by modifying the network mask to 255.255.255.240).'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# Chapter 13 Network Monitoring


    # Benefits of Subnets


    Splitting a network into several smaller subnetworks has a number of advantages:


    +   - **Reduced traffic**—The amount of network traffic propagated to all hosts
    is reduced, improving the performance for the majority of users.

    - **Fault diagnosis**—When diagnosing a network problem, it is easier to isolate
    smaller, existing portions of the network to assist with analysis and thus identify
    the cause of the problem. This also reduces the effect on the user community.

    - **Testing**—The use of subnetworks allows small, manageable portions of the
    network to be used for testing and pilot implementations of applications, restricting
    the effect on other users. The subnet can be isolated from the “main” network
    quite easily to provide a standalone test facility when required.

    - **IP address usage**—With the number of available IP addresses dwindling, subnetting
    can make better use of existing IP address allocations.

    - **Security**—Network traffic can be restricted to a small number of hosts on
    the subnet so that potentially sensitive information is not distributed too widely.


    Of course, subnetting is not just a case of what to do and when changing the network
    mask. Three basic steps are:


    +   - The existing network must be physically split to mirror the required changes.
    This may involve the addition of network bridges or similar network devices.

    - All affected nodes must be modified—that is, you must change the IP addresses
    and the network mask of each system that is changed to belong to the new subnetwork.
    There might also need to be modifications to DNS tables so that the addresses
    can be resolved by external connections.

    - The new subnet needs to have a route supplied so that the hosts can communicate
    effectively with other networks or subnetworks.


    # Routing


    Computer networks need to utilize some means of routing (or forwarding) mechanism
    so that communication can take place between two hosts, even though they may not
    be directly connected. Returning to the road analogy, routing loosely represents
    the use of maps. Take the example of traveling from Los Angeles, California, to
    a specific address in Las Vegas, Nevada. First, a map is needed to find out how
    to get to Las Vegas. Then, as the destination approaches, a more detailed map
    provides specific street information. Routing is similar in that, initially, the
    goal is to get to the corporate router on the required site. Other routers that
    are internal to the site direct the network packet to the correct network segment,
    and the packet arrives at the destination.'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# Routing 247


    Companies usually have one router that acts as an external interface to the rest
    of the world through which all incoming and outgoing traffic will pass. The external
    router also must be capable of routing traffic internally within the company to
    deliver packets destined for specific hosts. Internal routing can be managed in
    two ways: static routing, in which packets are sent to a central point for distribution;
    or dynamic routing, in which the best route is determined at the time the packet
    is sent. Both of these methods are discussed next.


    # Static Routing


    Static routing involves each host on the network sending all network traffic to
    a specified address for further distribution. This address is entered into the
    file /etc/defaultroute. When the system is restarted, the address found in this
    file will be used as the default "route" for all network traffic. The network
    administrator must manually build routing tables on the router so that data can
    be delivered anywhere on the local network.


    Static routing is used primarily on networks where there is little or no change
    because it requires significant manual intervention when changes occurs. For example,
    if the router address changed, each host must have the file /etc/defaultroute
    amended, and the network administrator must rebuild the routing tables to reflect
    the change.


    A disadvantage of static routing is that it creates a single point of failure—that
    is, if the router fails, the network becomes unavailable because all the hosts
    have the address hard-coded in the /etc/defaultroute.


    Static routing, however, can be considered more secure than dynamic routing. This
    is because the default route address is fixed so that all traffic follows a predefined
    route; the traffic cannot be deviated by an unauthorized system being attached
    to the network, as is possible using dynamic routing where routes are advertised
    to the network.


    # Dynamic Routing


    In an environment where the structure of the network changes frequently, dynamic
    routing provides the flexibility to adapt to the changes with little or no manual
    intervention.


    Each host on the network runs a program that builds and maintains its own routing
    table. In Solaris, the program is the routing daemon—in.routed for internal routing,
    or the gateway daemon,in.gated, if both internal and external routing are used.
    The route to use for network traffic is determined at the time the request is
    sent and is made more flexible by the fact that the host will "ask" its neighbor
    for a route if it doesn''t "know" how to send to the requested destination. However,
    dynamic routing is not recommended for leaf nodes of a network—that is, hosts
    not providing services for other systems. These nodes should use static routing
    so that the routers are not flooded with broadcasts from nonrouting hosts wanting
    to advertise their IP address.'
  merge: -1
  pgno: 264
- img_proc: true
  md: 'Dynamic routing is considerably more processor-intensive than static routing.
    However, it also requires much less manual intervention and is inherently more
    reliable than static routing because there is no single point of failure (as long
    as more than one route can be physically used). For example, if a major route
    fails and becomes unavailable, the routing algorithm will try to determine an
    alternate route (unlike static routing, in which the route is fixed).


    A potential disadvantage of dynamic routing is the advertising of routing information,
    a definite negative aspect for secure environments. It is also, for example, for
    an unauthorized intruder to attack a host to the network and then start acting
    as a router, advertising routes to destinations that don''t exist, or capturing
    network traffic for malicious purposes. The dynamic nature of this routing method
    means that hosts might “learn” new routes from this bogus host. Static routing
    does not allow this to happen because of the fixed configuration of the central
    router.


    Several dynamic routing protocols, generally split into two categories:


    +   - Exterior gateway protocols (IGP), also known as intradomain routing protocols—Communication
    is between two routers within the same organization. The most popular of these
    has been the Routing Information Protocol (RIP), but a newer one is Openest Path
    First (OSPF).


    +   - Exterior gateway protocols (EGP), also known as interdomain routing protocols—Communication
    is between routers from different organizations or networks. The most popular
    EGP has been the Exterior Gateway Protocol (EGP), although a newer one is the
    Border Gateway Protocol (BGP).


    # Troubleshooting Network Problems


    Network problems can be manifested in a variety of scenarios. Some are very difficult
    to diagnose, while others appear very quickly. The system manager, although not
    normally responsible for the network, must know about network issues and how they
    can affect the systems that he is responsible for.


    The majority of larger installations make use of network management software,
    as Solaris Domain Manager (discussed in Chapter 14) in one form or another, most
    of the problems that will be encountered should be dealt by this software. However,
    to configure a network management product, a level of knowledge is required to
    understand exactly what events are being monitored and to determine the remedial
    action to take if it occurs.


    This section looks at some of the basic troubleshooting tools used to determine
    the status of a system’s network capability and also to diagnose network-related
    problems.'
  merge: -1
  pgno: 265
