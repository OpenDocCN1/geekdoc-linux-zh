  md: '# Chapter 5 Solaris Installations and Upgrades


    The system manager needs to consider the purchase options available for a new
    system, particularly if it is planned to expand considerably. After a finite period
    of project support, the new system will become the responsibility of the system
    manager, so he must take a longer term view of the project, assessing the life
    expectancy of the system being purchased, the potential for upgrade and expansion,
    and on. A purchasing initiative from Sun Microsystems addresses this specific
    issue. The “capacity on demand suite” enables customers to purchase fully configured
    systems but pay only for components actually being used, or to spread the cost
    over more than one year, allowing better management of the IT budget. (The term
    does not necessarily apply to one physical computer; it could mean 5 servers and
    200 clients, for all of which form the system.)


    The level of availability required can dictate how a new configuration will be
    planned. Larger companies can opt for multiple sites acting in a clustered configuration,
    providing greater contingency against a disaster, whereas medium-sized businesses
    might choose hardware redundancy with automatic failover. The small business uses
    of an uninterruptible power supply (UPS) to protect the system from unscheduled
    power loss.


    The next sections detail some of the issues surrounding the purpose, configuration,
    and implementation of a new system installation. A sample scenario sets the scene.


    # Scenario


    The purpose of the scenario outlined here is to identify a number of issues that
    need to be addressed. It is designed to encourage consideration of how you, the
    reader, would deal with such a situation. The issues are then discussed in the
    following sections.


    Consider this hypothetical example of a company wanting to expand into a new market:

    CoverMe, Inc., the insurance company from Chapter 3, “Delivering the Goods,” is
    expanding into the motor insurance business. The current systems are few years
    old and are not capable of supporting the new requirements. It is anticipated
    that the new motor insurance system will grow by approximately 70% over the next
    12 months, this could be as much as 200% if the new advertising campaign is successful.
    The requirements for the new system are as follows:


    +   - Provision of servers capable of supporting the additional client workstations

    - Workstation positions for 250 staff—150 of these are to be located within a
    “secure” office area, and the other 100 are located in “open offices” that are
    not secure

    - Access to a database for the new motor insurance business

    - Integration with existing customer databases

    - Access to the new motor insurance application software'
