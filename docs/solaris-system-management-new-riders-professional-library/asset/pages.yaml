    the absolute minimum—that is, read permission for the superuser only. The shadow

    file also contains details of password access. The passwd and shadow files should
    not be

    edited manually—use doim or vip to make consistent changes.


    # Locking an Account


    When a user leaves the company, that account should be removed from the system
    to

    prevent unauthorized access. This is not always done immediately, however, because

    t files and directories belonging to the user are often archived before being
    deleted.

    If this is the case, it is good practice to lock the account during the intervening
    period

    so that only the superuser can access it. An account is locked by replacing the

    encrypted password field of the /etc/shadow entry for the specified user with
    *LK.*

    Use vip to do this rather than editing the file. In Listing 9.2, the users

    backup and accounts are both locked


    If the system manager finds any user accounts with no password assigned (these
    can

    be easily found by running login -p as user root), then these should be locked
    at the

    earliest opportunity. Some organizations run an automatic task that removes any
    user

    accounts with no password, requiring the offending user to reapply for a user
    ID.


    # Making Better Use of Groups


    It is not uncommon for organizations to create users who all have a primary group
    of

    Staff instead of assigning them to, say, Sales or Human Resources. The security
    implic-

    c should be sufficient to justify the proper use of primary groups, but they often

    ''t. The manipulation of groups can be an effective administration tool, particularly

    in large applications where users log in using captive accounts to access a specific

    software application or database. In this instance, they will not have access
    to a

    command-line prompt (the shell), they will execute a common startup file to

    iniate the application. By using the primary group, it becomes easy to move large

    numbers of users to, for example, a new version of the software, leaving the remainder

    on the current version. The startup file simply tests which group the user belongs
    to

    and takes a defined action, such as the command to start the application. Changing
    the

    user''s primary group automatically changes the command that is run when user

    logs in to the system.'
