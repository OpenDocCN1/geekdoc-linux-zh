  md: '# Policy on Stability of Product


    Some companies adopt a policy of extreme caution when looking to upgrade the operating
    system, especially if the upgrade is a major revision. For mission-critical businesses,
    there is a risk that the new version will not properly interact with the existing
    systems on the network—even though a significant amount of testing can be carried
    out on a test environment, it is often difficult to replicate everything!


    Other companies, however, move to a new operating system version virtually as
    soon as it becomes available. This is fine when a new system is being installed,
    but it presents other problems when upgrading an existing system. Some of these
    problems are outlined in the following paragraphs:


    +   Clustered failover systems—Certain kinds of configuration display problems
    of their own, particularly in a master/slave setup. Normally, one of the slave
    systems would be upgraded first and left to run for a period of time to see if
    any problems were encountered. If so, then that system could be reinstated without
    too much disruption to the operation of the business. The difficulty arises when
    a failover must occur onto the newly upgraded system in the live environment,
    which is necessary to upgrade the master system. If problems are encountered at
    this point, the whole system is in danger of crashing and becoming unavailable.
    Careful consideration is needed in this instance, along with extremely testing.


    +   Third-party application software—Sometimes a third-party supplier needs to
    provide a new version of the application software to run on the upgraded operating
    system. If this new version is not available, then it can become impossible to
    carry out the upgrade without incurring serious risk with no guarantee or warranty
    from the supplier.


    +   Mission-critical nature—The mission-critical nature of some installations
    dictates that a new version of an operating system must be declared stable before
    any kind of implementation is even considered. The difficulty here is defining
    what is “stable.” Some companies wait for the second release—that is, an interim
    release that fixes the majority of the bugs already identified; others, such as
    government departments, may wait until a central body declares it to be stable
    after it has carried out extensive research and testing.


    # Backups


    Before an operating system upgrade can take place, a guaranteed backup of the
    system must be performed.


    Ideally, the backup should be performed with the system at a single-user state—that
    is, with no activity and users logged in. Any databases should be shut down, and
    the backup should be verified. It is critical that the backup is capable of being
    read because it could be the only means available to restore the system if the
    impending upgrade failed.'
