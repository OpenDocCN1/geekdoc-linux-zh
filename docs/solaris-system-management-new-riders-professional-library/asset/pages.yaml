  md: '![](img/20459f772e7361286cec3e76e3bd26b4_320_0.png)


    **New Riders** books target the distinct needs of the computer professional by
    providing detailed and solutions-oriented information on core technologies. We
    begin by partnering with authors who have unique depth of experience and the ability
    to speak to the needs of the practicing professional. Each book is then carefully
    reviewed at all stages to ensure it covers the most essential subjects in substantial
    depth, with great accuracy, and with ease of use in mind. These reviews ensure
    not only that the material is technically sound, but also that it consistently
    provides information and advice you can really use. The book you hold was built
    for you, the practitioner, with accurate information and trustworthy advice, at
    the right depth, at an attractive value. We have taken the knowledge of the author
    and the real-world experience of our peer reviewers and packaged it in a format
    that''s easy to read, easy to reference, and easy to use.


    # # No matter what your question...

    New Riders has the answer.


    We know how important it is to have access to detailed, solutions-oriented information
    on core technologies. **Landmark** books contain the essential information you
    need to solve technical problems. Written by experts and subjected to rigorous
    peer and technical reviews, the Landmark books are hard-core resources for practitioners
    like you.


    ![](img/20459f772e7361286cec3e76e3bd26b4_320_1.png)


    Wisdom and knowledge for the smart user. *Inside* books are an interesting and
    discriminating look at a technology, written by someone who can anticipate your
    situation and give intelligent advice based on years of experience. These books
    are author driven and take a no-nonsense approach, just what you expect from New
    Riders.


    ![](img/20459f772e7361286cec3e76e3bd26b4_320_2.png)


    **Essential Reference** books provide solutions—quick fixes, shortcuts, properties,
    command options, class descriptions—on a variety of core technologies. Pick up
    a book in the Essential Reference series to see what we mean. Each book is built
    with your needs in mind, and each book is truly unique. The only similarity is
    their ability to ease your biggest headaches.


    ![](img/20459f772e7361286cec3e76e3bd26b4_320_3.png)'
