    # # Solaris System Management


    Solaris System Management provides the information needed for critical, high-level,
    "architectural" decisions that will help you to:


    Ensure an efficient, robust and secure Solaris environment for your enterprise


    Implement "life saving" contingency measures and a realistic business continuity
    plan for your company


    The role of the system manager is both demanding and diverse, requiring the wearing
    of many hats. This person plays a crucial role in ensuring that vast enterprise
    computer systems provide the necessary services to enable the business to carry
    out its functions.


    Use Solaris tools to monitor your system and head off crisis-level scenarios


    This book focuses on the task of system management within the Solaris environment.
    Author John Philcox provides valuable insight from nearly 20 years of experience
    with large installations of multi-vendor, multi-platform systems, including Solaris,
    the most popular commercial version of UNIX.


    Identify the Solaris packages and utilities that are available to enhance the
    quality of service


    Manage core infrastructure services and save valuable resources through seamless
    integration with PC networks


    > John Philcox has worked in the IT industry for more than 20 years, the last
    14 years on SunOS/Solaris. He has successfully run his own company for the past
    5 years, providing computing services to both public and private sectors as a
    System Administrator and Technical Support specialist well as a System Manager,
    and on several occasions been part of a Project Assurance Team as a Technical
    Assurance Coordinator. Philcox has been a professional member of the Institute
    for the Management of Information Systems (previously the Institute of Dato Data
    Processing Management) since 1989 and is also a member of the Institute of Analysts
    and Programmers.


    Instate with well-designed Service Agreements so that everyone in your organization
    receives optimal service


    ![](img/20459f772e7361286cec3e76e3bd26b4_321_1.png)


