  md: '# Introduction


    Welcome to Solaris System Management, the first book to be concerned solely with
    system management issues in a Solaris environment.


    Solaris is the most popular UNIX operating environment available commercially—in
    this environment, many organizations run mission-critical systems upon which their
    survival could depend. Management of these systems is of critical importance to
    ensure that they deliver the required level of service and reliability. Solaris
    System Management provides valuable information for system managers responsible
    for a Solaris environment.


    Solaris System Management focuses on strategic issues, such as security and contingency.
    These two aspects are crucial in protecting one of the organization''s most valuable
    assets: the data.The system manager is the custodian of the company data and ultimately
    responsible for its integrity.


    A number of products are available, both commercially and in the public domain,
    that assist the system manager in delivering better service to the customer and
    managing the environment. This book identifies and investigates a number of these
    products, their capabilities, and their uses.


    The following sections discuss the intended audience, the objectives of the book,
    how the book is organized, and the typographical conventions used throughout this
    text.


    # Who Should Read This Book?


    Solaris System Management was written for the system manager. This book is intended
    both for the new system manager who has recently taken on the responsibility of
    a Solaris computing environment and for the experienced system manager who might
    be managing a Solaris environment for the first time after working in other computing
    environments.


    This book is not a system administrator guide, although a senior system administrator
    considering making the transition into system management likely will find the
    contents of the text quite useful. The majority of the concepts and policies described
    within the book are applicable to other vendor platforms; the solutions, however,
    are all based on the Solaris platform.


    The book also likely to be useful to other managers who need to familiarize themselves
    with the role and practices of the system manager.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# The Objectives


    The main objective of this book is to provide information for the system manager
    on a wide range of activities related to the Solaris computing environment. It
    is essentially a “hands-off” text, although some examples are used to demonstrate
    key points.


    This book also provides details of products that are available to help the system
    manager carry out his duties effectively. The intention is to create awareness
    of the products and their use rather than provide a technical guide of how to
    install and administer them.


    The majority of books that address system management also contain a lot of detail
    that is more suited to the system administrator. This book attempts to stay focused
    on the requirements of the system manager, leaving the system administration aspect
    to the very excellent books that are available on this subject.


    # Organization of This Book


    The book is organized into three main parts:


    +   * Part I, “The System Manager”—The first four chapters investigate the job
    of the system manager and cover some general issues that are not specific to the
    Solaris operating environment, but are applicable to all system managers.

    * Part II, “Management of the Solaris Environment”—The next seven chapters look
    at the policies and strategies that the system manager employs as part of the
    management responsibility. Included in this part are issues of system purchase,
    upgrade and maintenance, security and disaster recovery, longer-term management
    of the systems, day-to-day fire-fighting and routine operation, and interoperability
    with PC networks. The section includes a chapter on shells and public domain software.

    * Part III, “Management of the Solaris Network”—The final three chapters take
    a brief look at Internet Protocol version 6 and network monitoring. The last chapter
    looks at some of the network management tools that can be used to manage a Solaris
    network.


    An appendix at the end of the book provides further reference material, including
    useful books and references to vast sources of information on the World Wide Web,
    as well as details on how to get using the available Solaris documentation.


    # Conventions Used in This Book


    The packages SUNWscr and SUNWacc must be installed before the accounting software
    can be used.'
