    also relates to C++, Objective C, Chill, Fortran, and Java.


    As of Solaris 2.0, the Solaris operating environment no longer provides a bundled
    C compiler with its release.

    The public domain software requires a compiler to build the products for use on
    a computer system. The GCC Compiler fulfills this requirement, delivering not
    only as a prebuilt software package or in its source for building on the local
    system. The latest version, for example, is always available from the Web site
    http://www.sunfreeware.com; it includes compilers for C, C++, Fortran, and Java.


    You do need a C compiler to build GCC unless the pre-compiled version is downloaded.
    As an alternative, the mini-C compiler, which is found in the directory /usr/ucb,
    provides sufficient functionality to compile GCC.


    # Who Is GNU?


    GNU stands for GNU''s Not UNIX, an organization dedicated to the provision of
    free software, supported by the Free Software Foundation (FSF). This organization
    can be found on the Web at http://www.gnu.org.'
