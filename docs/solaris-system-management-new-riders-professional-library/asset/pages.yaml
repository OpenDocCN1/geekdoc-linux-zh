  md: '# Performance Monitoring


    The system manager is responsible not only for the provision of an IT service
    to customers, but also for the maintenance of an acceptable level of performance.
    To this end, the system manager must ensure that the systems under his control
    are not suffering from poor performance or substandard response times.


    Performance monitoring is normally carried out by the system administrator, but
    the system manager needs to have a good appreciation of what is involved and the
    tools that are available to obtain the required information. This is especially
    important because the system manager will be compiling the periodic reports that
    undoubtedly will form part of an ongoing SLA.


    Regular monitoring of the systems builds a crucial library of information, highlighting
    trends of both usage and performance. For example, the data that is gathered could
    provide early warning indicator of increased usage or load on the systems, perhaps
    necessitating a hardware upgrade or even a replacement system. The important point
    is that, armed with this information, the system manager should not face any surprises;
    any additional processing power or other resource that might be needed can be
    planned and implemented before it becomes a performance.


    The other side of performance monitoring is to investigate problems as they occur,
    or to identify bottlenecks that could be affecting the overall performance of
    the system, or to gather evidence that the loading is not even balanced—this is
    especially visible with disks. Frequently, a problem may manifest itself in some
    way but actually be caused by something else. This is one why the activity of
    monitoring is so useful:The process of elimination helps to narrow down the true
    cause of the problem.


    The next subsections describe the kind of problems likely to be encountered, as
    well as the tools provided by the standard Solaris release. These sections also
    discuss some utilities and tools that are available both commercially and in the
    public domain.


    # Are You Looking For?


    Monitoring the performance of the system generally involves looking for areas
    of weakness or contention. Bottlenecks can slow down the rest of the system; for
    example, a badly balanced disk setup that is overloaded with requests and is causing
    the processor to regularly wait for data. The monitoring process can also provide
    evidence that the current resources are starting to struggle with the load being
    placed upon them. The system manager can use this information as evidence that
    an upgrade is required (possibly due to increased usage by the customer) and also
    to justify why the consumer department should pay for it to be able to maintain
    the required level of service.'
  merge: -1
  pgno: 205
