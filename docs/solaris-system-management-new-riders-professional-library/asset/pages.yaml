    ![](img/20459f772e7361286cec3e76e3bd26b4_236_0.png)


    > Figure 10.6 The Start bar, menus, and toolbars are all fully user-configurable
    and help to maintain the suite''s look and feel across multiple platforms.


    StarOffice Writer, the word processor, comprises some specialized tools: AutoPilot,
    Sun''s version of a wizard, and AutoFunction, real-time spelling, error correction,
    and auto-completion make good examples. Documents can be saved in a variety of
    formats, including Word 97, Word 2000, and WordPerfect 8.


    The presentation program, StarOffice Impress, is in the production of high-quality
