    # split


    The split command chops a file into a specified number of smaller files, according
    to either size or the number of lines in the file. Sometimes a file will be too
    big to be manually edited using, the vi editor, so the split command can be used
    to produce a smaller number of smaller files that are easier to view.


    Another, probably more useful, using of split is for recycling cumulative log
    files. Suppose that a log file is appended to a regular basis and becomes large.
    Although it might be tempting just to delete the file every now and then start'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# Useful Commands 201


    again with a new log file, it might be a better solution to retain, say, the latest
    (most recent) 10% of the file. In this way, the latest log information is not
    discarded until the next time the file is split. By doing this, the file size
    (and number of lines) is reduced by 90%, reclaiming disk space and retaining potentially
    valuable information.


    As an example, suppose that the log file is used as a cumulative log for a specific
    application process. Over a period of a week, its size grows to just under 500,000
    lines. An automatic cron job could be initiated to remove 90% of the file, keeping
    the latest 10% for another week so that the information is available if it is
    required.


    The following command will create 10 files, each containing 10% of the cumulative
    log file:


    ```

    split -l `expr -wc -l logfile | awk ''{print $1}'' / 10` log_

    ```


    This command basically takes a line count of the logfile, divides it by 10, and
    uses the answer as the argument to the split command. It creates the log_aa to
    log_aj. Listing 9.9 shows the line count for the logfile, followed by the line
    counts for the 10 derived files.


    # Listing 9.9 Sample Output Demonstrating That a File Can Be Split Equally


    ```

    $ wc -1 logfile

    49428 log

    $ wc -1 log_*

    49428 log_aa

    49428 log_ab

    49428 log_ac

    49428 log_ad

    49428 log_ae

    49428 log_af

    49428 log_ag

    49428 log_ah

    49428 log_ai

    49428 log_aj

    49428 total

    ```


    The only thing left to do is rename the log_aj to logfile, replacing the original
    large file and delete log_a*—the remaining nine files that were created as a result
    of running the split command.


    # unix2dos and dosunix


    These two commands are used when transferring files between the Solaris environment
    and the PC environment. The dosunix command converts a file from DOS to ASCII
    format so that it can be read correctly in the Solaris environment. The unix2dos
    command does the conversion the other way so that a file can be read correctly
    in the DOS environment. The only limitation with these commands is that the filename(s)
    must be in accordance with the environment in which the command is run—that is,
    8.3 format if run from the DOS environment.'
