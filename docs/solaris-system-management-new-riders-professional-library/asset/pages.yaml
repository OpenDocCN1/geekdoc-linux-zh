    # # Revenue!


    The IT department can also earn revenue by charging individual departments for
    the services being provided. For example, if a large network is supporting the
    sales department and the marketing department, the cost of providing the service
    can be shared between the two areas. The amount charged to each of the departments
    would be calculated based on the issues described in the preceding sections, which
    describe running costs.


    Charging for a service is fine until the quality of the service is challenged.
    Service level agreements challenge the service provider to prove that the consumer
    is getting value for money. Service level management is discussed in the next
    chapter, but it is worth mentioning that, normally, penalties for failing to meet
    the agreed targets are not financial when dealing internally within a company.
    This may not be true if an external service provider is charging for the service—in
    this case, there may well be a financial penalty for providing a substandard level
    of service.'
