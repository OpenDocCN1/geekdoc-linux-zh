    # RAID 1


    In this configuration, also known as a mirrored pair, two physical disks are bound
    together. The hardware writes the same data to both disks, thereby creating a
    mirror. Reading from the mirror is done from either disk. This option is highly
    fault-tolerant and ideal for storing mission-critical data and for applications
    requiring very high availability. If one of the disk drives fails, the other continues,
    while copying to a replacement module (see the upcoming section "Hot Spares").
    A further use for this option is the system disk, that is the disk containing
