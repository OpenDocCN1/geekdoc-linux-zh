  md: '# 208 Chapter 10 Working with PCs


    Many organizations are also looking at ways of consolidating the desktop space,
    finding it unacceptable for users to need both a PC and a UNIX workstation on
    their desks to carry out their daily duties. The advent of products such as KEA/X,
    from Attachmate, solves this problem, allowing the full CDE environment to be
    run as a window on an existing Windows desktop.


    This chapter looks at a number of products that can either be purchased or downloaded
    from the public domain and contribute to the success of merging UNIX and PC environments.
    The first section looks at interoperability products that allow significant integration
    between the two. The second section discusses PC connectivity products, such as
    X Window System that runs on a PC, as well as some terminal emulation products.


    The final section looks at the StarOffice suite of software that is freely available
    from Sun Microsystems and is being used in an increasing number of establishments.
    This section also discusses Sun’s innovative program to deliver office software
    via the Web: Web solution.


    # PC Integration Products


    For some time, Sun Microsystems has pioneered the integration of the PC and Solaris
    environment, with the Windows Application Binary Interface (WABI), SoftWindows,
    and SunPC. Things have moved on significantly in recent years, with major innovations
    allowing a much more integration—in some cases, the potential exists to completely
    replace PC servers altogether with Solaris systems to provide the same services,
    but with greatly increased performance, scalability, and reliability.


    This section takes a look at some of the products that provide interoperability
    between the PC and Solaris environments. This is something the system manager
    should be actively implementing to provide the optimum service and range of facilities
    to his customers while also taking full advantage of the high availability and
    performance-that Sun systems deliver as standard.


    # Sun PCi II Coprocessor Card


    The Sun PCi Coprocessor card effectively puts a powerful PC into the Sun workstation,
    but it also has the advantage of utilizing the Solaris workstation resources.
    The card currently supports a 600MHz processor and up to 512MB of memory, which
    is dedicated to the performance of PC applications.


    Using the Coprocessor card, users can run Microsoft applications on the Sun workstation
    alongside the Solaris environment applications. An advantage of configuring the
    system in this way is that the PCI card takes full advantage of the reliable and
    robust Sun workstation. It can also share the Sun workstation’s network interface
    if network ports are at a premium. Or it can use its own network port—the card
    comes with a separate network connector, if required.'
  merge: -1
  pgno: 225
- img_proc: true
  md: 'The PCi Coprocessor card will run Microsoft Windows NT, 98SE, and 2000 applications
    while using the same monitor, keyboard, and mouse as the workstation. It also
    shares files and data with the workstation, permitting copy and paste facilities
    between the Solaris environment and the PC environment. In addition, the card
    shares the removable media devices, such as the floppy disk and CD-ROM drive.


    The Sun PCi Coprocessor card is a serious option for offices that have standardized
    the PC environment yet still require the use of dedicated Sun workstations on
    the desktop. In these cases, the user can save valuable desktop space, receive
    seamless integration between the two environments, and still run complex, resource-intensive
    PC applications.


    # PC Launcher


    PC Launcher is used in conjunction with the Sun PCi Coprocessor card discussed
    in the previous section and is supplied on the Solaris Supplement CD-ROM from
    Solaris 7 onwards.


    The software delivers Sun PCi the additional functionality to view, edit, and
    print numerous types of PC files and attachments by automatically launching the
    Windows application associated with the file, similar to the current practice
    on the native Windows platform.


    PC Launcher provides users with the following facilities:


    +   - Built-in support identify icons for many Windows applications, such as Microsoft
    Word, Excel, and PowerPoint, as well as Lotus, WordPerfect, Corel, and bitmap
    graphics (BMP) among others.

    - Support for Windows shortcuts from the Solaris desktop. The user can keep all
    PC application shortcuts on the Solaris CDE front panel and workspace.

    - Automatic identification of PC file type attachments, launching the PC Launcher,
    the relevant PC application, and the PC file itself.

    - Support for users to copy and paste text from Windows applications into any
    Solaris application.

    - Easy access to PC-file type attachments in CDE Mail and File Manager, including
    the drag-and-drop capability for any file on the CDE front panel.

    - The capability to define additional file types for other Windows applications
    using standard CDE tools.


    Coupled with the Sun PCi Coprocessor card, the PC Launcher software delivers a
    comprehensive PC environment, but without the need for a separate PC system.'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# 210 Chapter 10 Working with PCs


    # PC File Viewer


    PC File Viewer is delivered as part of Solaris 7 and later releases (Solaris 2.6
    Hardware 5/98). It can be downloaded free from the Sun Microsystems Web site (http://www.sun.com)
    for users of early Solaris 2.6 releases. The software is available\only for SPARC-based
    Solaris environments.


    PC File Viewer provides the user with the facility to view a large number of popular
    types of PC files or attachments, similar to the PC Launcher software described
    in the previous section. In this case, there is no need to have the original application
    installed on the Sun workstation. Using PC File Viewer, email attachments can
    be read easily, even though they might have been created using a PC application
    such as Microsoft Word, Excel, PowerPoint 1-2-3, Corel, or AutoCAD.


    Text from PC files viewed by PC File Viewer can be copied and pasted into Solaris
    applications as Text Editor, Mail, or FrameMaker. A file viewed with this software
    is displayed in the same way as when it was originally created. software also
    displays WYSIWYAG format and color.


    The use for this software is to enable Solaris users on Sun workstations to receive
    files and email attachments, for example, in a PC application format and instantly
    open them—without needing the original application to be installed. Previously,
    these files were not readable and often needed to be manually transferred to a
    PC to be opened, which was highly inefficient and wasted resources.


    # Solaris PC Netlink


    The PC Netlink software for Solaris is probably the biggest interoperability innovation
    to be delivered. This software enables Solaris SPARC-based systems to behave like
    Windows NT4 servers and replace them as domain controllers. Formerly known as
    Project Cascade, PC Netlink brings reliability and scalability to Windows NT servers,
    something sorely missing from the PC environment.


    Companies that have standardized on the Windows NT platform for the office network
    faced problems accommodating exponential growth and still providing a reliable,
    available platform on which to deliver the services required by the customer.
    PC Netlink solves both of these problems by running the Windows network services
    over SPARC-based Solaris systems, which deliver high availability and are fully
    scalable. PC Netlink runs on the full range of Enterprise servers, from the Ultra
    5 to the Enterprise 10000.


    System managers fighting to control the proliferation of Windows NT servers can
    replace large numbers of PC-based servers with a single Solaris-based SPARC server.
    This reduces the maintenance and administration costs significantly because PC
    Netlink servers can be administered using standard Windows NT tools, just like
    the PC server; thus, no change to the current operating procedures is required.'
  merge: -1
  pgno: 227
- img_proc: true
  md: 'PC Netlink software provides the following native services:


    +   * Primary and backup domain controller, NT Directory Services (NTDS)

    * Network file and print services

    * Security and authentication

    * Support for NT file system (CIFS/SMB)

    * Windows NT naming services

    * Support for all major client types (Windows 2000, 95, 98, 3.11, and NT workstation)

    * Support for up to 2,000 concurrent users

    * Compliance with the service pack


    # Windows Support


    Support for the Windows family of products includes clients only-not, for example,
    native Windows 2000 environments. Therefore, facilities such as Active Directory,
    which were introduced as part of Windows 2000 server, are not supported.


    Figure 10.1 shows how a Solaris SPARC-based server can be integrated into the
    office network.


    ![](img/20459f772e7361286cec3e76e3bd26b4_228_0.png)


    Figure 10.1 Consolidation of Windows NT servers onto the Solaris platform reduces
    the total cost of ownership, simplifies management, and provides a fully scalable
    and reliable NT network.'
  merge: -1
