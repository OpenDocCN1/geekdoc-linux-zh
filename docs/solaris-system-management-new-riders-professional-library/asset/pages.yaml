  md: '# Creating a Service Level Agreement: An Example


    The final section in this chapter describes a hypothetical scenario that requires
    a service level agreement to satisfy the needs of the business. It is intended
    to demonstrate the kind of issues that must be addressed, as well as provide a
    good example of the complete process.


    # Scenario


    CoverMe, Inc., is a company that provides life insurance services to the general
    public. The sales personnel can receive orders and queries via a number of channels:


    +   * Over the telephone

    * From the Internet site (which are then forwarded using email)

    * Via direct email

    * In writing by mail (confirmation letters, policy cancellation requests, and
    so on)


    The sales department comprises 25 staff, all of whom have personal computer connected
    to the LAN and WAN. Each PC runs an in-house written application to access the
    sales and inquiry database. The database is held on a host computer running Solaris
    7 and the relational database management software. The host system is physically
    housed in the computer room, in the basement of the building. The application
    is GUI-based and makes use of client/server technology.


    For some time, the sales staff has been complaining to the manager that it is
    taking too long to access a customer''s record and that they are losing business
    as a result. The staff members are having to apologize for the delay, which is
    sometimes greater than two minutes—some customers are even hanging up the phone.
    The problem is not critical when dealing with queries or orders from other media
    because the customer is not being kept.


    Several calls have been logged with the help desk system regarding the slow response
    time of the application, but it has not improved, and some of the calls registered
    are still "open".


    At a recent management meeting, the issue was highlighted. The system manager
    had no knowledge of the problem and agreed to carry out investigations, which
    resulted in a slight improvement in performance. This was due to the rescheduling
    of other background work that was running on the host system—it was made to run
    out of core business hours (which are between 09:00 and 18:30) in an attempt to
    reduce the load on the system during the working day.'
  merge: -1
  pgno: 67
