- img_proc: true
  md: '# 212 Chapter 10 Working with PCs


    Even though PC Netlink supports all major clients, it does not actually run any
    Windows NT applications, although it can store and serve them to the clients.
    This is because the actual application runs on the client itself, not on the server.


    With consolidation and total cost of ownership being very popular goals in the
    IT business area, this product offers a realistic opportunity to achieve both
    of these objectives in one go. In addition, it offers increased reliability and
    the capability to accommodate the demanding growth factors that companies everywhere
    are experiencing.


    # Totalnet Advanced Server


    Totalnet Advanced Server (TAS) is an interoperability product available from Syntax,
    (http://www.syntax.com), which enables diverse operating systems to successfully
    share file, print, and application resources across both local and wide area networks.


    The software runs on a UNIX operating environment, such as Solaris, and creates
    a common system file, enabling it to act as a file, print, and application server
    for Windows 2000/NT/95/98, Network, Macintosh, and other UNIX variants. It enables
    users to create and store files in their native environment, and to take full
    advantage of the power and reliability of a Solaris Enterprise system, for example.


    TAS enables interoperability among these diverse environments, each defining the
    combination of specific operating systems and transports:


    +   * CIFS Realm—LAN Manager, Windows NT, Windows 2000, Windows 95/98, and IBM
    OS/2/2 clients running NetBIOS over TCP/IP or NetBIOS over NetBEUI transports

    * NetWare Realm—NetWare clients running the IPX/SPX transport, supporting NETX,VLM,
    Windows 200, Windows 95/98, Windows NT, and NetWare clients

    * AppleTalk Realm—Macintosh clients running AppleTalk or TCP/IP transports


    The TAS file system is common to all realms, enabling seamless integration regardless
    of the originating platform. A user (with correct permissions) can access files
    from anywhere on the network.


    Another feature with the TAS software is that the TAS server can be configured
    as a Windows NT logon server, eliminating the need for Windows 2000 and Windows
    NT servers acting as authentication servers. One of the goals of the TAS environment
    is to provide single signon facilities on a network containing multiple file system
    types and authentication mechanisms, as well as a simple account management function.'
