    the clients. For example, a server supporting 25 diskless clients and 25 AutoClients
    can apply the patches to a spool directory and then synchronize all the clients
    so that they are also using the patches. These clients do store the operating
    system software on local disks; it is kept in a file system on the server and
    is accessed over the network. (See the Appendix for further information on the
    Jumpstart utility.)


    # Testing Patches


