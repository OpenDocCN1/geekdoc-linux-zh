    intelligence is provided via additional hardware. It is possible, however, to
    implement a pseudo-RAID configuration through software using a product such as
    Solstice Disquite, which is covered briefly later in this section.


    The concept of RAID is that a number of physical disk modules are bound to form
    a logical unit, sometimes referred to as a stripe. It is worth noting that to
    make a RAID configuration truly reliable, multiple SCSI controllers and storage
    processors (SPs) should be used to ensure that disk access is maintained in case
    of a controller failure, creating a dual access to the disk of the RAID device;
    they control the physical access to the RAID elements (disks). Multiple SPs provide
    the resilience further. The Clarion storage subsystem supplied by EMC is a good
    example of such a device. The following subsections describe the more popular
    RAID configurations, along with some of the recommended uses for each of the configurations.


