  md: '# Chapter 6 Solaris Security


    # Crack


    A number of system administrators and system managers are reluctant to use tools
    such as Crack because they are utilized by crackers to try to gain unauthorized
    entry to computer systems. Crack attempts to obtain passwords by comparing them
    to dictionary words. It has been stated that more than 30% of the average password
    file entries can be broken the first time this program is run.


    If the system manager arranges for the program to be run against password files,
    then weaknesses can be identified and rectified, possibly before the cracker tries.
    The old saying, "Forewarned is foreseen" comes to mind, and in this case, it is
    particularly true.


    Crack is successful only on systems where the encrypted password is held in the
    file /etc/passwd along with all of the other user details. Solaris 2 versions
    utilize the shadow password entry, which is secure and beyond the reach of programs
    such as Crack. However, older Solaris systems running Solaris 1.x are at risk
    from this program, as are systems that are part of NIS domain.


    # SATAN


    SATAN is an acronym for Security Analysis Tool for Auditing Networks. Used to
    detect security risks, SATAN is run remotely from a computer against either another
    system or an entire network. With Crack, some companies are reluctant to use this
    kind of tool because it is not necessary to have access to the system or network
    tested. However, the same reasons for using Crack apply here.


    An extremely useful feature of SATAN is that when a security risk is identified,
    a tutorial is provided that not only explains the detail of the risk, but also
    offers advice on how to fix it. The tutorial also details the potential impact
    of not fixing it.


    # Sinning with SATAN


    Be aware that there are severe legal implications for using a tool such as SATAN
    to assess a network or system to which you do not have legitimate access. As a
    security prevention tool, it can be useful in identifying weaknesses in your own
    system or network.


    # Tcp Wrapper


    Tcp Wrapper is a freely available tool that provides monitoring and control of
    network services. It is installed and configured so that when communications ports
    are connected to, the Wrapper program runs instead of the intended daemon, such
    as Telnet. Authentication can also be carried out in addition to detailed logging
    before passing successful connections to the original daemon. Tcp Wrapper delivers
    an extra level of security, which is essential when allowing external connections
    via the Internet to the corporate systems.'
  merge: -1
  pgno: 145
- img_proc: true
  md: '# Strategic Planning and Techniques 129


    # Tripwire


    Tripwire is a company producing security software designed to maintain the integrity
    of a system or a number of systems. The majority of companies rely heavily on
    the integrity of their data and need to know if it has been compromised in any
    way. Tripwire can be used in a variety of applications; the main uses are described
    here:


    +   * Intrusion detection—Tripwire software notifies the user when an intrusion
    is detected. By noticing that files have been changed or tampered with. When Tripwire
    is run for the first time, it takes a snapshot of the files or file systems that
    it has been configured to monitor. This counts as a baseline for future, regular
    comparisons to be made, effectively creating a digital fingerprint of the system.
    As soon as the software notices that a file has been changed, it notifies the
    user and identifies exactly what has changed and what needs to be done to undo
    the damage.


    +   * Unauthorized software check—In the same way that software checks for an
    intruder modifying or altering files on the system, Tripwire also acts as a verification
    tool that a system has not had any unauthorized software installed on it. This
    is something a cracker might want to do to install a virus.


    +   * Assessment and assistance with recovery—If an attack is taking place, the
    Tripwire produces violation reports so that the files requiring repair or replacement
    can be quickly identified.


    +   * Evidence reporting—The reports produced by the Tripwire software can be
    utilized in forming a chain of events for data intrusions, specifying what happened
    and at what time. They are useful for providing formal evidence of the intrusion.


    +   * Configuration verification—The Tripwire software can also be used to verify
    configurations across several different systems. Suppose that there are 10 servers
    with similar configurations. Tripwire makes a database using a template configured
    server. It checks against the other servers to see that they are using the same
    applications, for example, or are up-to-date versions of software. In this way,
    the software can monitor systems, watch for the abuse of software licenses, and
    monitor what applications are installed. It also has the advantage of noticing
    when untested modifications are made to the system because the difference between
    the modified system and the template will be flagged to the user.


    The Tripwire software is extremely useful for maintaining the integrity of software
    and data. In the uses provided here, Tripwire can also be used across the network
    to manage systems throughout the enterprise. Tripwire HQ Connector contains the
    integrity software along with a communications agent, allowing it to communicate
    with a management console—this is known as HQ Manager. Using HQ Manager, a single
    position can act as a central point for integrity management for hundreds of different
    systems.'
