- img_proc: true
  md: '# Which Tool(s) Do I Need?


    The system manager must decide which network management tools are appropriate
    for the environment in which the systems reside. In larger companies, some form
    of network management is essential to be able to monitor and administer the potentially
    large number of remote nodes.


    The Solstice Domain/Site Manager combination is ideal for large companies requiring
    remote administration and management, particularly where sites are running on
    a 24x7 basis but may not always have staff on site. In this instance, the network
    management role can be transferred to a central support position, where multiple
    sites can be effectively managed.


    For smaller networks and environments, it is often a matter of personal choice
    whether a network management solution is suitable or justified. The software can
    be expensive to deploy and obviously needs to be maintained. Some companies leaving
    the network monitoring and management entirely to the network manager, concentrating
    solely on the systems themselves and relying on the network section for advice
    and support.


    # Summary


    Network management has become a necessary part of running a busy computing environment
    to deliver the type of service that the customer expects in a cost-effective way.
    Sun Microsystems provides products to manage such environments.


    Solstice Site Manager and Solstice Domain Manager deliver a fully scalable solution
    to manage a small single-site operation with fewer than 100 nodes, right up to
    a large enterprise environment with up to 10,000 nodes. A key benefit of these
    products is that the application is the same as running on a small SPARStation
    or the large enterprise server.


    The Cooperative Consoles product, supplied with Solstice Domain and Site Manager,
    enables management consoles to share information and management of the network
    of Solaris systems. In this way, remote sites can be easily managed on a 24x7
    basis, eliminating the need for staff to be present at the sites outside normal
    business hours.


    Mission-critical applications and services can be allocated guaranteed network
    bandwidth using Solstice Bandwidth Manager, and detailed statistical information
    can be used to evaluate SLA performance against agreed targets.


    Remote system administration of multiple Solaris systems is possible with Solstice
    Adminsprite, a product that comes with the Server edition of the Solaris operating
    environment. With centrally managed administration, it is easier to maintain standards
    of system configurations throughout the organization, making the task of managing
    the systems much easier.'
  merge: -1
