  md: '![](img/20459f772e7361286cec3e76e3bd26b4_170_0.png)


    # 8


    # Strategic Management


    AS PART OF HIS DUTIES, THE SYSTEM MANAGER must ensure that the systems under his
    control are being managed in a cost-effective yet efficient manner and that they
    can deliver the level of service required by customers.


    Computer systems tend to evolve into collections of systems, and from there into
    complete environments. This could be the result of the addition of new projects,
    a corporate reorganization of departments, or a number of other reasons, but the
    result is the same: The responsibility lies with the system manager. The system
    manager could quite easily inherit, for instance, 10 systems with 10 support agreements
    from 10 different third-party vendors, each requiring renewal at different times
    of the year. Failure to manage this important environment could seriously jeopardize
    the system manager''s ability to obtain the correct support if a failure occurred.


    A large number of systems that I have personally encountered little or no documentation—or,
    if there is any, it is frequently out-of-date. An interesting analogy can be drawn
    to a homeowner renting a house to a third party during an absence abroad. Certainly
    the homeowner would take a detailed inventory so that any items missing or damaged
    could be easily identified and so that appropriate steps could be taken to obtain
    compensation or replacement. Likewise, computer systems can be worth millions
    of dollars, especially when housing corporate data, and yet there is no inventory
    detailing the makeup of the system or how it is configured.'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# 154 Chapter 8 Strategic Management


    The system manager also needs to address the issue of configuration management.
    The majority of development projects use a means of version control, as SCCS,
    that is tightly managed between releases of the application. However, scripts
    and programs written by the system administration staff or the database administrator
    frequently exist in an unmanaged state, often in a user''s home directory. These
    scripts and programs are usually run by privileged users and are infinitely more
    powerful than most application software because they can cause severe disruption
    if inappropriate changes are made without testing (System backup scripts are a
    prime example). Without configuration management and a central repository for
    such elements, it is virtually impossible to apply any kind of control.


    For the manager to be able to manage his environment in a cost efficient and effective
    manager, he needs to provide management information that shows how the systems
    are being—or not used.That information can be used to make appropriate, justified
    decisions on future expenditure and capacity planning, as well as options for
    continuing support.


    This chapter discusses these issues and identifies the options available to address,
    including a real-life example of reducing unnecessary support costs through simple
    analysis and consolidation.


    # Saving Money


    All managers seem to be under constant pressure to cut costs where possible, do
    more with less, and generally to conjure huge savings out of thin air. Consider
    a new system manager eager to make a good impression. It might be easy to impose
    too-severe cost cutting and put the department in jeopardy—and it might not become
    apparent until it is too late.


    In a large company, saving, say, $20,000 might be considered trivial when taken
    as part of the overall expenditure, which could amount to tens or hundreds of
    millions of dollars. However, the system manager can put the savings to good so
    that he actually manages to do without requesting additional funds. For example,
    more research on new products could be carried out, which might benefit the business
    by doing the job more efficiently. Or, perhaps additional disk upgrades could
    be purchased or additional training be provided for members of staff. As any manager
    is no doubt aware, when the budget is under-utilized, it is generally acknowledged
    that less will be available for the following year—and that could be in addition
    to any budget cuts that have already been planned!


    # Maintenance Contracts


    When a new manager takes this position, it is a good idea to examine the maintenance
    contracts that are in place, particularly for a large computing environment. There
    are significant advantages to doing this:'
  merge: -1
  pgno: 171
- img_proc: true
  md: '# Saving Money 155


    Familiarization—the maintenance agreement provides detailed information on the
    systems and offers an ideal way for the system manager to become familiar with
    the equipment and software under his control.


    Opportunity for savings or consolidation—Various projects might have delivered
    Sun systems that were purchased from a number of resellers or third-party suppliers—often
    the package includes a maintenance agreement for the system supplied. During this
    exercise, there might be an opportunity to consolidate these systems under a single
    support agreement, providing the potential for negotiating a better deal with
    the maintenance provider. Examining the support agreements in place could also
    highlight possible duplication, where coverage is provided twice by separate suppliers,
    or a system that is no longer in production might still be fully supported!


    Assessment of cover—During an exercise of this kind, the system manager could
    discover that a critical system is not covered by any maintenance agreement, or
    that the current agreement is grossly insufficient for the role being carried
    out by the system. There undoubtedly be severe repercussions if a system failed
    and was not covered by any maintenance agreement—the system manager would have
    the brunt of the criticism, too, even though he might know nothing about it. This
    scenario could occur quite easily, for example, if a major new system was delivered
    as part of a project; if the project manager would take responsibility for the
    first year of maintenance, prior to handing it over to the system manager as an
    operational system. In this case, the renewal of the agreement could be easily
    overlooked, and this exercise would identify the anomaly.


    # Genuine Support or Middleman


    Some third-party companies offering support for Sun systems require customers
    to contact their own response centers instead of the Sun response center when
    reporting a fault. In some cases, the third party may not be able to solve the
    problem, necessitating a call to Sun for a solution. Beware that this can seriously
    affect your response receive due to the added delay.


    # Hardware and Operating Systems


    The support and maintenance of the hardware and operating system software are
    normally part of the same contract with the same vendor (such as Sun Microsystems),
    who provides support and maintenance packages depending on the level of support
    required. The system manager should review the agreements in place to see if any
    circumstances have changed or if any systems have an inappropriate level of support
    attached to them.'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# 156 Chapter 8 Strategic Management


    As an example, consider a large organization running a 24x7 computer operation
    with, say 20 servers and 400 workstations. The previous system manager might have
    automatically taken support and maintenance agreements on a 24x7 basis for all
    the systems and associated workstations. The level of support might be entirely
    inappropriate if only 150 workstations are actually used on a 24-hour basis, mainly
    because the heaviest usage occurs during normal business hours when there are
    extra sales staff, marketing staff, and administration support staff. Additionally,
    the marketing server and several application servers might not be needed at all.
    In this case, the opportunity for significant savings exists if the system manager
    asks a simple question:

    “What do we actually need to be available 24 hours a day, 7 days a week?”

    The answer could be that the 250 workstations and 5 servers are not even used
    out of normal business hours, so their support and maintenance level could be
    adjusted accordingly.


    Sun Micros provides a program of support called “SunSpectrum” that is designed
    to provide comprehensive hardware and software support for all kinds of customers.
    There are four major options—the main distinguishing features are described here:


    +   * Platinum—This option the full, mission-critical support plan, providing
    24x7 onsite hardware service as well as a 2-hour response time. A business requiring
    a faster response can also have a site resident engineer. This option includes
    24x7 telephone support to the Sun response center, with mission-critical escalation
    and assistance with planning software releases and patch management. The platinum
    support agreement provides the highest level of support for hardware and software.


    +   * Gold—This option provides support for business-critical systems where 24x7
    continuous coverage is not required. The default is 8-8 (12-hour coverage) Monday
    through Friday, although this can be extended if required. The response time for
    this option is four hours—again, it can be enhanced if a faster response is needed.
    The gold option provides 24x7 telephone support to the Sun response center with
    priority response.


    +   * Silver—This basic level of support provides 8–5 (business hours support)
    from Monday through Friday, with a four-hour response time. With the other options,
    the coverage can be extended and the response time can be expedited. The silver
    option includes telephone support to the Sun response center during business hours.
    It is designed for businesses requiring basic hardware and software support, without
    the need for critical assistance.


    +   * Bronze—The bronze option is designed to accommodate businesses that carry
    out their own hardware repairs or those that have a system in a remote location
    not covered by Sun onsite service. Technical support is also available via the
    Sun response center.'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# Saving Money 157


    All these SunSpectrum options provide software upgrades at no additional cost,
    as well as 24×7 online access to technical information and software patches through
    Solvensolve.


    One further option for support complements the SunSpectrum program: the Sunclient
    support option. Basically, this option is designed for noncritical workstations
    or Javasations. Two alternatives exist within this support option: opt for either
    next business day response or a central maintenance option in which the customer
    waits until there are five faulty workstations and calls for an engineer. This
    option represents considerable savings and provides a realistic alternative for
    non-business-critical workstations. It allows a company to focus the highest level
    of support it is needed.


    Considerable savings can be made if all the time are not required to be available
    are downgraded, for instance, the Sunclient level of support. It is important
    to note that even though there is cost savings being made, there is no corresponding
    reduction in the service being provided—it merely removing unnecessary support.


    A further aspect of maintenance agreements to consider is when systems are replaced
    or upgraded, the corresponding support agreement is frequently amended. The system
    manager might find that his department is still paying for systems that are no
    longer in production.


    Finally, test and development systems need to be addressed. The required level
    of service would normally be less than that of production systems because these
    systems are less critical to the operation. It is rare to find a test or training
    system on 24×7 maintenance cover because it would not be deemed business-critical.
    If support is required, it can usually wait until the next working day, making
    a potential candidate for the Sunclient support option or, at best, the SunSpectrum
    silver support level.


    # Real-Life Example


    At one site I was supporting a number of systems, both Sun systems and a non-Sun
    legacy system. A review of the support arrangements for the systems revealed the:


    +   Three standalone Sun workstations were being supported by two different third-suppliers
    at a total cost of about $7,000 per year. The large Sun servers were all supported
    under a Sun Microsystems gold maintenance contract.


    +   A standalone workstation with an attached multipe autoloader, being used for
    business-critical daily backups, was not present in any support agreement.


    +   The legacy system had previously been with two systems, but one had been decommissioned
    and the serviceable components had been moved to the remaining system, resulting
    in a single, more powerful system. The support agreement itemized every component
    down to processor and memory board level—it ran to five pages when printed. The
    decommissioned system had been removed from the support agreement, but there were
    several entries in the agreement for components that were no longer present in
    the system cabinet.'
  merge: -1
  pgno: 174
- img_proc: true
  md: 'As a result of the review of the maintenance agreements, the following modifications
    were made: greater.


    +   - The three Sun workstations were incorporated into the main Sun support agreement
    but did not warrant the gold support. They were reduced to silver support, saving
    $5,000 per year.

    - The standalone (backups) workstation was added to the main system support agreement
    at a cost of $2,500 per year it was carrying out a business-critical function.

    - A revised list of components that were actually present in the legacy system
    cabinet was fixed to the supplier, resulting in a $12,000 reduction in cost per
    year.


    A saving of $14,500 might be considered fairly small for a large company, but
    the whole exercise actually took only a few hours and demonstrates the potential
    savings when examining a much larger network. In addition, the potential loss
    that the business might have suffered as a result of failure of the standalone
    system running the critical backups—and a subsequent lack of support—could have
    been significantly greater.


    # Third-Party Applications


    A large company might make use of several third-party products as case tools,
    statistical packages, CAD applications, and so. All offer technical and maintenance
    support agreements, some of which can prove to be extremely costly.


    The system manager must decide which of these are necessary and justified. With
    an existing product, the justification can be made by examining how many problems
    in the last year required a call to the product supplier''s help desk—and, more
    important, whether the call actually resolved the problem satisfactorily. The
    system manager ultimately must decide whether to have support available all time
    or for each separate instance that support is required. The latter option can
    be cost-effective if a very small number of support calls were made. A large percentage
    of problems are often related to configuration and compatibility issues; the majority
    of these can be resolved by the system administrator(s), although the quality
    of the product documentation is also a factor to be taken into account.


    A new system manager might discover that the previous manager always opted for
    the full technical support option, representing a significant cost but not always
    at the best value. For example, a thorough review of third-party application maintenance
    agreements could reveal that an agreement is still in place for a software product
    that is no longer in use. The maintenance agreements need regular reviews to ensure
    that the business is receiving the required level of service while providing value
    for money.'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# Documenting the Systems


    This section considers system documentation, the reasons for having it, and the
    kind of information that it should contain to be of any value. This task is frequently
    overlooked or viewed as a trivial, time-consuming background project that remains
    at the bottom of the priority list to be done when there''s time.


    System documentation, in this context, is the information that describes the entire
    system, its hardware and software configuration, its business function, and its
    relationship to other systems on the network. This documentation needs to contain
    information about how the disks are partitioned, any modifications that might
    have been made to the operating environment, or patches that were installed. These
    are just a few examples, of course—many more are discussed in the following subsections.


    The system manager is responsible for the provision of the IT service, which includes
    the systems under his control. Therefore, he is also responsible for ensuring
    that he has a complete inventory of those responsibilities and their relevance
    to the rest of the business.


    # The Importance of Good Documentation


    System documentation is an extremely important part of system management. It has
    ramifications for other business functions within the company if it is not present
    or if it is out-of-date, for the following reasons:


    +   System documentation is the one place where all the details of the systems
    can be found, without needing to assemble pieces of information from a variety
    of sources. The job has been done thoroughly, this is also the only place where
    the system manager can be sure to find a complete and comprehensive description
    of the systems under his control.


    +   The disaster recovery plan could refer to a good set of system documentation.
    This removes the need for duplication of effort and the increased risk of error.
    If the documentation is accurate and kept up-to-date, it is the ideal place to
    obtain the information that would be needed if disaster were to strike the company''s
    computer systems.


    +   The system documentation has a part to play in fault resolution and recovery.
    Suppose that a system has crashed and completely corrupted a disk volume. The
    information is held in the original installation log file /var/sad/system/install_log,
    but getting to it is more difficult if the disk containing /var has crashed or
    if the system won''t boot. This log will not contain details of any disk volumes
    that were subsequently added to the system or any repartitioning that might have
    been carried out. Similarly, with a failed system and a call to the response response,
    the system engineer would normally ask for details of kernel modifications and
    patches installed on the system, to aid resolution of the problem. Having all
    this information on hand can greatly speed up fault recovery by eliminating unnecessary
    delays. In a mission-critical environment, this becomes even more important.'
  merge: -1
  pgno: 176
- img_proc: true
  md: '# Chapter 8 Strategic Management


    +   - Documentation demonstrates professionalism. For example, a project manager
    designing a replacement for one of the existing systems under the system manager''s
    control might require information about the system being replaced. With good documentation,
    this information can be provided in seconds, probably if stored on the LAN as
    well as in hard copy.


    +   - When planning upgrades, the documentation provides comprehensive information
    that could highlight potential problems or conflicts.


    # System Information


    The purpose of system documentation is to provide information about a specific
    system or group of systems. It is a functional document aimed at a technical audience.
    If disaster strikes the computer systems, a nontechnical disaster coordinator
    could, in the absence of the system manager, pass the document to a Sun supplier,
    who would then have sufficient information to be able to organize a replacement
    system of the same (or equivalent) configuration. Similarly, if a major system
    failed, the kernel parameters or the partition information for a failed disk volume
    could be easily located to assist in system recovery.


    Figure 8.1 shows an example technical data sheet. This provides a good system
    summary and some information about the system.


