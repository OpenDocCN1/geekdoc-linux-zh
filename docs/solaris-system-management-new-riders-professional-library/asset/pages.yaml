- img_proc: true
  md: '# Chapter 4 Testing


    +   3. Adding the customer to a mailing list for future promotions

    4. Archiving the transaction after payment has been received


    This process could potentially involve several different systems and applications,
    as well as a significant time delay, as shown in Figure 4.2. It is not uncommon
    for some end-to-end tests to run for many hours—for example, with the sales record
    discussed, the archive process might run only once a day overnight. The value
    of the test is that it runs exactly as it would in the operational environment.


    End-to-end testing is a significant area of testing that is sometimes omitted.
    One reason for this is the practicality of replicating the entire environment:
    It can prove expensive, although it should be noted that the testing environment
    can often use smaller, less powerful systems to test functionality.


    Some, of course, it is impossible to fully replicate the environment in which
    an application will run, but the part that is left out involves the interfaces
    with other systems or applications. In this instance, the new product may receive
    data from an existing application, then process and forward it to another application,
    and archive it on yet another system. The testing of the system might involve
    test data being created to simulate the input being delivered. This is fine for
    testing the system itself, but not for the interfaces. The new system or application
    is adding a risk to all the other systems that it interfaces with and could potentially
    corrupt data on those systems if this aspect is not thoroughly tested.


    ![](img/20459f772e7361286cec3e76e3bd26b4_87_0.png)


    Figure 4.2 The end-to-end test provides the customer with confidence that the
    new system or application will work alongside existing systems.'
