  md: '# Chapter 4 Testing


    +   - Performance of recovery testing, which is necessary particularly in larger
    systems involving hardware and software deployment. In this instance, the system
    is deliberately placed in a variety of fault conditions to establish how tolerant
    it is and how quickly processing can be resumed. For example, in a RAID storage
    configuration, a good test is to remove one of the disk modules (to simulate a
    disk failure) and check that a hot spare takes over the role of the failed module.


    # User Acceptance


    The user community must have the opportunity to test the application before implementation.
    For larger projects, a user assurance coordinator (UAC) should be assigned to
    the project, normally from within the IT department. As a system manager, I have
    fulfilled this role. The UAC looks after the users'' interests to ensure that
    the application meets their expectations. UAT should be carried out on a dedicated
    test environment in which changes to the application cannot be made without fully
    controlled and documented. At this stage of the process, changes are acceptable
    only when delivered as patches, and these would be as a result of problem logs
    created by the UAT team.

    This stage of testing is crucial to a project being successful for the following


    +   environment, and exercise it fully so that any deficiencies can be identified
    as soon as possible. These problems subsequently are rectified before the final
    delivery. This includes the users entering invalid data, such as bad dates or
    reference numbers that don''t conform to the standard, to check that they will
    be rejected. The user will determine whether the application will be accepted
    on behalf of the business. A normally senior user representative will be a member
    of the project board.


    +   The UAC role will be heavily involved in the creation of the acceptance test
    criteria, the associated acceptance test specifications, and test scripts. These
    are the documents that will be used during UAT execution. The test scripts that
    are produced should form a logical sequence that reflects the normal operational
    usage.


    # Recovery Testing


    Recovery tests can sometimes be extremely difficult to accomplish, particularly
    with sealed units that can''t be accessed directly. Certain tests likely may need
    the cooperation of the vendor so that the required scenarios can be fully tested.'
