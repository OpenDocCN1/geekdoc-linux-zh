- img_proc: true
  md: '# Strategic Planning and Techniques 115


    There is a point where the company''s private network and an external network,
    such as the Internet, meet. This is the point at which a firewall is inserted.
    A firewall system consists of a hardware and software configuration (collectively
    known as a firewall). It resides at this point and controls access both into and
    out of the company''s network, like a security guard at the entrance to a company''s
    premises.


    A firewall need not be used only for external connections; it can also be implemented
    to restrict access to specific systems within the company, such as the accounting
    system. In this instance, the company might want to separate this system from
    others on the network and allow only a specified list of users to access the system.


    Sun''s Firewall–1

    Sun Microsystems produced a product called Firewall–1 which has now been retired
    and incorporated into the Solstice Sunscreen security product. Solstice Sunscreen
    is discussed later in the "Unbundled Products" section.


    There are two types of firewalls—packet-filtering firewall and an application
    firewall (also known as a proxy server). Both are described in the following sections.


    # Packet-Filtering Firewall


    This kind of firewall "filters" packets that it receives according to a predefined
    set of rules, allowing only packets that match the rule criteria to proceed through
    the company network. Two slightly different policies may be applied to this kind
    of firewall, either to allow all packets unless specified by the rule set, or
    to deny all packets unless specified by the rule set. The choice will depend on
    the over-security policy for the company, but the latter option is more secure.


    Packet-filtering firewall offers less protection than an application-level firewall,
    but it is cheaper and may be appropriate for a low-risk environment. It usually
    doesn''t support authentication, nor does it have any reasonable logging facility.
    Packet filtering can be implemented on the Internet router(s) or if a Sun system
    is connected to the Internet, using the freely available package ipf. For further
    reference on this package, see the Appendix, "Resources."


    # Application-Level Firewall


    This is a much own kind of firewall, demanding a separate system to run server
    programs (called proxies). These programs receive external requests and analyze
    them for authenticity, forwarding only legitimate requests to the internal network.


    A major distinction between the two kinds of firewalls described here is that
    the application-level firewall supports full authentication and logging. It is
    a more secure option than a packet-filtering firewall and is suitable for medium-high-risk
    environments. It also has the capability to "hide" the address and of any computer
    communicating through the firewall. This means, for example, that the IP address
    of a computer is concealed from any potential intruder "listening" on the other
    side; all communications "appear" to have originated from the firewall.'
