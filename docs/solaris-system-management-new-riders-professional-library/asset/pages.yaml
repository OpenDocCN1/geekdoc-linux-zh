  md: '# Browser and Grapher Tools


    The Browser tool provides access to the data that has been collected via data
    requests. The information is organized into individual streams, which contain
    the output of each data or event request for a specific device. Data that has
    been gathered can be viewed using this tool or be selected for display using the
    Grapher tool.


    The Grapher tool provides the administrator with the facility to view data graphically,
    either in 2D or 3D graphs. When a data request is submitted, the option exists
    to have the results sent straight to the Grapher tool. In this case, a cumulative
    graph will be created and updated as new data is received. The Grapher tool also
    accepts data that has been stored by the Browser tool. Figure 14.4 shows a cumulative
    graph from a data request monitoring CPU usage over a period of time.


    ![](img/20459f772e7361286cec3e76e3bd26b4_280_0.png)


    Figure 14.4 The data request graph shows clearly where usage peaks and troughs
    occur.'
