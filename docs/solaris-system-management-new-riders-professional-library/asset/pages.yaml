  md: '# Step 2: Assemble the Team


    The initial team is selected, comprised of the following:


    +   - The IT department—This involves the system manager and a senior system administrator.
    Input will be required from a database administrator, the PC support section,
    and the network management team. A member of the development services department
    will also be required to discuss the workings of the application that is causing
    the problem.

    - The sales department—This involves the sales manager and a telesales supervisor.
    Input will be required from members of the sales team, one from telephone sales
    and one from Internet-related sales.

    - The help desk manager—This person will be required to attend at some point in
    the discussions to describe any existing service level agreements between this
    section and the business, and the relevance in this case is the link between the
    help desk and the IT department.


    # Step 3: Prepare for Providing Services


    The system manager looks at the service being provided to ensure that any services
    he is using are guaranteed, or at least to an agreement of their own. If this
    is not the case, then he is not in a position to be able to guarantee a level
    of service to anyone else. For this example, the provision of network services
    and PC support services must be addressed. Host system administration, host system
    management, and database administration are already his direct responsibility.
    He must also ensure that any service being provided can be measured. Checking
    with the networking team reveals that a new system for end-to-end monitoring has
    recently been installed and can cater to his needs.


    Available data can monitor the performance between computer systems, on both the
    LAN and the WAN. Performance figures are available for both the database itself
    and the Solaris server, which leaves the PC on the user''s desktop where the application
    is run, and for which there is no performance data available. Performance monitoring
    is enabled on a selection of the PCs to allow information to be gathered. Initial
    investigations also reveal that the development services section has received
    problem reports via the help desk, but these have not yet been acted upon due
    to a shortage of resources and other priorities.


    The sales team must identify its expectations of the service being provided and
    also provide clear details of the priorities that exist. Team members de-phone
    queries must be given the highest priority because there are customers waiting,
    so the fastest response is required for this type of query or order. Ideally,
    the team would like an instantaneous response time, but this is not a realistic
    expectation.


    The team carries out some timing tests to identify as accurately as possible the
    current response times over a period of time, taking the average figure as the
    current level of service. This figure is calculated as being 1 minute, 35 seconds.
    The results of the users'' tests are shown in Figure 3.4. It is agreed that this
    is an unacceptable level of service. The level that is deemed to be acceptable
    is between three and seven seconds.'
