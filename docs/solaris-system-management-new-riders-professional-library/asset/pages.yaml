  md: '# 266 Chapter 14 Network Management Tools


    A significant benefit of using a product such as Solstice Domain Manager is that
    multiple sites can be managed from a central console. This feature can be utilized
    to good effect, particularly during out-of-business hours, when there might not
    be any staff present at any of the remote sites.


    Solstice Domain Manager meets the majority of the requirements for network management.
    However, more than 300 applications run on Solstice Site Manager and Domain Manager,
    providing additional network management capabilities and data analysis.


    # Solstice Cooperative Consoles


    The Cooperative Consoles product is provided as part of Solstice Site Manager
    and Solstice Domain Manager. The Site Manager version is restricted in that it
    can send information only to another management console; it cannot receive information
    and act as a domain manager. The Solstice Domain Manager version contains a full
    release of Cooperative Consoles, allowing it to both send and receive information
    from other management consoles.


    The real power of Solstice Domain Manager is that multiple domain managers can
    be flexibly configured to share information. Each console can be configured as
    a peer-to-peer console, allowing each to have equal access to the other so that
    they can monitor and control other''s resources, such as multiple Solstice Site
    Manager consoles. Alternatively, a Domain Manager console can be configured to
    receive from multiple management consoles but not to send information to them,
    making it a super network management console,


    ![](img/20459f772e7361286cec3e76e3bd26b4_283_0.png)


    **Figure 14.8** The super network management console provides overall corporate
    network management from a central location.'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# Sun Network Management Products 267


    This facility is used particularly where sites might manage their own network
    during business hours but pass to a central network management console for out-of-hours
    monitoring and management. The out-of-hours console might act as the master for
    multiple sites but would not return information about its own activities to any
    other consoles.


    # Solstice Enterprise Manager


    This is a product for managing large enterprises and complex networks. It is aimed
    directly at telecommunications and Internet service providers (ISP). It is probably
    not a product that the Solaris system manager would expect to see, unless working
    in these specific areas of business.


    Enterprise Manager is mentioned here because, using the Cooperative Consoles software,
    it facilitates connecting Solstice Domain manager and Solstice Site manager consoles
    to Solstice Enterprise Manager for large-scale network and system management.
    Enterprise Manager is used to isolate complex system or network problems, resulting
    in speedier resolution and maintenance of high availability for customers.


    # Customization of Solstice Site/Domain Manager


    Many organizations are happy with the facilities provided by Solstice Site and
    Domain Manager, but a few customizations can be made to enhance the usefulness
    of the product and to tailor it more specifically to the business.


    I used SunNet Manager, the foundation of Solstice Domain and Site Manager, to
    define custom objects. The newly created objects were subsequently treated as
    a unit that, for example, a single event and data request could be initiated on
    every system of this designated type. Also, I added extra functionality to the
    Tools menu so that housekeeping and administration tasks could be carried out
    from the same central management position. SunNet Manager was successfully implemented
    to manage and administer 15 large servers and 300+ workstation clients.


    The file to make these additions is /opt/SUNconn/snm/struct/elements.schema, by
    default. This file defines all the known object types, as well as the commands
    available from these objects and the icons used to identify them. The elements.schema
    file can be edited using a standard text editor, such as vi.


    To add a new object, you must edit three sections within the file, one to create
    a new record for the component, one to specify the icon to use, and one to declare
    the commands that can run.


    An abbreviated example of the relevant sections of the elements.schema file is
    shown in Listing 14.1, demonstrating the changes that need to be made to add a
    new data object type of DB-server.'
  merge: -1
  pgno: 284
