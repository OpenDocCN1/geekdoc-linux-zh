    # Regression Testing


    Regression testing is used as a mechanism of ensuring there have been no unintended
    effects of a change. It allows tests to rerun, knowing exactly what the result
    should be, thereby highlighting immediately any deviation. For example, consider
    an application that calculates the payroll for the employees of the company. Suppose
    that a new application is being developed to replace the existing one, which cannot
    handle the increased number of employees since the company expanded.


    Using the existing system for calculating the payroll, a test would be devised,
    using specific test data (say, a dozen employees), and their payroll details calculated.
    When the'
