  md: '# Who Needs an SLA?


    Any section or department in a company that is making use of a service provided
    by another department, such as IT services, needs an SLA so that a measurable,
    quantifiable, reasonable, and attainable level of service can be agreed between
    the interested parties. Without the SLA, there is no evidence of performance.
    The users could complain that the service is slow, and the system manager could
    respond by saying that it isn''t. Who''s right? And how do they prove it? Of course,
    they can''t prove it because there is no baseline to compare it to. With an SLA
    in place, however, the baseline determines what constitutes an acceptable level
    of service. If the user complains of a slow service, a comparison can be made
    against what was agreed upon, and the necessary proof can be provided. Note that
    all of this depends on sufficient meaningful data being available.


    The users, consumers, also need an SLA for another reason. It is probably the
    only place where the user community is represented with authority. They will help
    to set the standards for the level of service that they require to do their jobs.


    Senior management needs SLAs to ascertain the value of a given service and to
    measure how well the service is performing against an agreed target. This sort
    of information is invaluable to management, when deciding priorities and budgets.
    It allows them to see easily the value that, in case, the IT services are providing
    to the business as a whole. The SLA describes the service in universally clear
    language that everyone can understand.


    Another reason that senior management would favor the use of SLAs is that they
    often provide the information needed to determine whether outsourcing is a viable
    option. Part of the SLA process involves gathering and monitoring collected data.
    A cost element of providing the service should also be available. This cost element
    can be compared with external suppliers and hence aid the decision for whether
    outsourcing is an option.


    A good way of collecting the required information is to use a time recording system.
    In this, time is booked to various tasks by the people carrying them out. Managers
    can then produce reports to detail how much time (and, hence, cost) is spent providing
    a specific service. Figure 3.1 shows an example times that has been completed
    by a system administrator for a working week. A report would contain, say, monthly
    figures for the total time spent on a specific task and all those contributing
    to it.


    It can be seen from Figure 3.1 that the system administrator appears to spend
    his time fairly evenly between the sales and personnel systems.These figures could
    easily be quantified as a cost if either of them were being considered for outsourcing.
    Other cost elements to be considered these include:


    +   - Maintenance and support costs—These are the system and software support
    maintenance contracts. If the service were to be outsourced to a third party,
    this element would definitely be included.'
