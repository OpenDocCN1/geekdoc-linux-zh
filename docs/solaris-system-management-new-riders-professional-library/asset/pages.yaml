- img_proc: true
  md: '136 Chapter 7 Disaster Recovery and Contingency Management


    # The Disaster Recovery Plan


    In an ideal world, a disaster recovery plan would automatically be built in to
    any new computer system or network that was being implemented. This section deals
    with reality, the fact that, for the majority, it is not considered at the time
    of implementation. A new system is more likely to be included in an existing plan
    (if there is one) at the next review, which could be too late if something happens
    in the intervening period.


    The system manager is someone who is heavily involved in strategy and is responsible
    for the IT services to the business. It is highly likely that he might be the
    instigator of a disaster recovery plan for the IT systems, if one does not exist,
    because he has a good understanding of how a serious failure could affect the
    company as a whole, not just a particular section or department.


    # What Is It?


    A disaster recovery plan is a survival strategy. It is a plan designed to return
    a company to normal operating capacity as quickly as possible following an interruption
    of services—the disaster. The disaster recovery plan identifies key elements of
    the company and critical tasks that must be completed. It also identifies areas
    of high risk that need to be addressed to reduce risk.


    The disaster recovery plan contains extensive contact information, something that
    could be very difficult to find in an emergency, and is kept in a central, accessible
    location. In fact, the plan is normally held at several key locations. Members
    of staff or external resources are assigned to various tasks. Their responsibility
    will be to instigate and implement the recovery of the company; because this has
    been planned and thought about in advance, it is less likely that bad decisions
    will be taken by anyone in a state of panic.


    A disaster recovery plan is a plan for recovery; it is a document, or a series
    of documents, that collectively comprise the survival strategy. However, it is
    not enough to merely have the plan safe in a cupboard. The task of building the
    plan is as important as the plan itself. It is the “doing” activity that provides
    familiarization, which in turn raises confidence levels. The process of creating
    the plan could also highlight areas of particular vulnerability in existing procedures
    that themselves could lead to an interruption to service. In this way, potential
    disasters of the future can be prevented.


    # Global Recovery Standards


    The disaster recovery plan for the IT systems would probably be integrated into
    a corporate-wide disaster recovery strategy, although it might be addressed separately.
    It is worth checking to see if any standards exist before proceeding.'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# Disaster Recovery 17


    # Benefits of a Disaster Recovery Plan


    The existence of a disaster recovery plan brings several benefits, some of which
    could save a business from collapse. These benefits are described in the following
    list:


    +   - Minimizes downtime—The downtime and unavailability suffered as a result
    of a disaster can be fatal to some companies. Sun cluster software provides an
    excellent means of maintaining high availability, allowing clustered nodes to
    be located at separate sites (Sun cluster was discussed in Chapter 5,"Solaris
    Installations and Upgrades”). By maintaining continuous high availability, the
    company can do backups when others have ceased completely.


    +   - Keeps the staff—If a disaster occurs, it is possible that the business won''t
    be capable of continuing to pay its employees; if this is the case, they will
    leave and find work elsewhere. A good disaster recovery plan should have most
    of the employees gainfully employed within one or two days—most employees would
    welcome the chance of an extra day or two off.


    +   - Retains an acceptable level of cash flow—One of the major causes of businesses
    collapsing is they run out of money—ironically, this happens before the insurance
    claim can be settled. The sooner the company can resume its operating capacity,
    the better the cash situation and the better the chance of survival. The existence
    of a disaster recovery plan indicates that advance planning has been carried out
    and that an alternate way of continuing business has been investigated or implemented.


    +   - Maintains customer confidence—In the highly competitive world of Internet
    commerce, customer confidence can be shattered very quickly. If the Web site of
    a company becomes unavailable or the company cannot trade, the customer will merely
    look elsewhere, so business is lost. When the company is a public company trading
    on the stock exchange, customer confidence becomes even more important. By publicly
    publishing the fact that a disaster recovery plan has been tested and implemented,
    confidence will rise (maybe the share price, too) as the stockholders see that
    the business is serious about protecting its assets—and their investments.


    +   - Satisfies legal requirements—For some of the data held by a company, legal
    requirements govern retention and security of the data. The disaster recovery
    plan demonstrates that everything is being done in a secure-off-storage facility,
    perhaps). Conversely, the absence of a disaster recovery strategy might result
    in legal penalties on the grounds that the executives did not make adequate preparations
    to protect the company''s assets and legally required data.


    +   - Reduces insurance premiums—Demonstrating to an insurance company that a
    disaster recovery strategy is in force within the company could reduce the premium
    payments. This is because of the prevention options that have been taken, as with
    content insurance policies—homeowners often pay reduced premiums when certain
    approved security measures to their property are implemented, such as intruder
    alarms and fire-detection equipment.'
  merge: -1
  pgno: 154
- img_proc: true
  md: '+   Raises employee education and awareness—The creation of a disaster recovery
    plan raises staff awareness of potential dangers and risks. It has the side benefit
    of educating all who are involved in the process on disaster management. It can
    be quite disturbing to members of staff when they realize exactly what would happen
    if a disaster struck the business, focusing attention on areas of weakness and
    vulnerability and, more importantly, what can be done to improve the situation.


    As with the year 2000 problem described in Chapter 4, "Testing," an exercise of
    this magnitude produces other side effects as the project progresses. One of these
    is that the company assesses exactly what is critical to the survival of the business
    and what is less critical, so priorities can be set accordingly. The information
    might be used by managers to justify other future projects. Many companies find
    the exercise useful as an information-gathering process; the employees learn more
    about the function of the business, how it fits together, and the risk of a certain
    function being unavailable. All this has an indirect effect on the general running
    of the business.


    Finally, the act of creating a disaster recovery plan highlights, in some cases,
    prompting positive decisions to improve the situation. The vulnerabilities might
    not be directly related to disasters—for example, an analysis might reveal a security
    weakness in the Solaris operating environment currently installed. Upgrading to
    the next release might fix the problem, and other extra security measures that
    had not even been considered could be implemented. This might have been completely
    overlooked if the impact analysis had not been carried out.


    # Contingency Management


    For a long time, risk assessment and risk management have been topics associated
    with projects that must be addressed in the project plan. A disaster recovery
    plan is no different in that it is effectively a project. It involves a number
    of stages and carries a number of risks. A risk is something that might happen,
    such as the database server crashing or the computer room being destroyed by fire.
    Each risk that is identified must be managed—that is, it must be addressed, and
    the best solution, usually based on money, must be found to somehow resolve it.
    As with project management, four main options can be applied:


    +   Do nothing—the risk is accepted, and the company hopes for the best. This
    is not an ideal option, but it is an option nonetheless.

    Avoid risk—Here, the risk is eliminated completely and no longer presents a problem.
    For example, because of its location, a business could be deemed to be at risk
    from major. Housing the computer systems in the basement of the building flooding
    is considered to be high risk, high impact, and high probability. To avoid this
    risk, the computers could be moved to the top floor of the building. This might
    pose other risks, but the risk of flooding no longer exists.'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# Contingency Management


    A much simpler example related to everyday life could be the risk that you will
    get wet if you go out today and it rains. To eliminate the risk, do not go out!


    +   **Reduce the risk**—The concept of risk reduction is to make the likelihood
    that the risk will materialize much smaller—that is, preventive measures are taken.
    The risk is not totally eliminated, as with risk avoidance, the chances of it
    happening are reduced. For example, a business might have a critical data-base
    server that is deemed a high-risk, single point of failure. Deciding to purchase
    an identical server, locate it at another site, and install the Sun cluster software
    is an instance of risk reduction. Even though the server might not now constitute
    a single point of failure, it is still possible that both servers could become
    unavailable at the same time, but it''s much less likely. Similarly, one of the
    servers becoming unavailable has a significantly reduced impact on the operation
    of the business—in fact, there would be no impact because the remaining server
    would provide the company with a continuing operation while the failed server
    was being fixed.


    In the real-life example, the risk of getting wet could be reduced by watching
    the weather forecast or taking an umbrella.


    +   **Transfer the risk**—The remaining option is to pass the risk to a third
    party, normally by outsourcing to a supplier or by taking out additional insurance.
    By using the outsourcing option, the computer systems in a data center owned and
    maintained by a third-party company can be managed by. In this instance, the supplier
    remains responsible for all aspects of the mission-critical systems, including
    planning for disaster recovery. The insurance option means that the business will
    be fully covered against loss of income as the result of a disaster, with resources
    (and money) being available immediately following the disaster to ensure that
    the business survives until normal operating status is resumed.


    The real-life example here would mean that you could get someone else go out for
    you and take the risk of getting wet on your behalf.


    Contingency is an essential part of any disaster recovery plan in fact it identifies
    the measures that are to be taken to protect the company. Unlike the discussion
    earlier in the chapter on disasters, where the focus is on identifying key areas
    of vulnerability, this approach focuses on what to do about to reduce the impact
    of a disaster. It is intended to ensure, where possible, that the business stands
    the best possible chance of not only surviving—or, better still, but also able
    to resume normal running at the earliest opportunity—to continue running throughout.


    The remainder of this section looks at potential contingency options for a business
    and shows how they can be used to maximize the chances of early recovery. They
    are not discussed in any particular order of importance.'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# Backups


    Chapter 1,“Job Description,” mentioned that the system manager is the custodian
    of the data for the company, and this is an awesome responsibility. Given the
    responsibil- that it carries, it is amazing that the backups of a system are often
    viewed as a chore instead of an essential process.


    Backups are crucial to the survival of the business, especially when considering
    the mission-critical, 24x7 systems in use today. Imagine a disaster striking the
    company only to find that the backups haven''t actually worked for the last two
    months—and even if they, the tapes were being kept in the computer room, which
    has just destroyed.


    It is not just the data relating directly to the business activities that needs
    to be backed up; there might also be legal requirements for the retention of audit
    trails, or financial information for tax purposes. Remember these requirements
    cover several years, and the data may need to be restored, if required, during
    a future investigation or audit.


    To guarantee the integrity of the system''s data in any way, the system manager
    must have a reliable and tested backup policy. The media used for the backups
    must be stored securely, and—probably the most important aspect of all—the backups
    must be tested at regular intervals. If they are not tested and are subsequently
    unreadable, then it doesn''t matter whether they are stored in a secure location
    because they''re useless.


    Sun Micros has a fully scalable product called Solstice Backup that is designed
    to deliver the best possible protection for a company''s data. For example, it
    will accommodate a small business with a single system (the Server edition), a
    medium-sized business with a number of clients distributed across the network
    (the Network edition), or a large enterprise environment with many systems at
    remote locations (the Power edition). Choosing the correct edition of the software
    depends on how much data needs to be backed up and how efficiently it is to be
    done. Solstice Backup supports concurrent devices so multiple tape drives, or
    jukeboxes, for example, can be written to or read from the same time, greatly
    enhancing performance and reducing the time needed for a system backup.


    Solstice Backup doesn''t just provide a good backup utility, it also includes
    a Storage Node Module. This module allows the central server to make use of further
    tape devices located on remote machines. There are two main advantages to this:The
    capability is significantly enhanced (as is the performance), and, more important
    for disaster recovery strategies, it provides an automatic failover facility for
    the backup devices unavailable. And for systems using relational database management
    systems, there are add-on database modules for Oracle, Sybase, Informix, and Microsoft
    SQL.'
  merge: -1
  pgno: 157
- img_proc: true
  md: 'If all this wasn''t enough, other add-on modules enable Solstice Backup to
    work in a true heterogeneous environment, delivering support for clients from
    various architectures, including, desktop PCs (Microsoft Windows 95/98/NT), NetWare
    systems, and a number of other UNIX architectures, and Macintosh.


    Figure 7.1 shows a possible backup configuration that would deliver a high level
    of resilience.


    ![](img/20459f772e7361286cec3e76e3bd26b4_158_0.png)


    Figure 7.1 The Power edition of Solstice Backup provides not only resilience,
    but also flexibility in supporting a wide range of architectures, including online
    protection for databases.


    Carrying out the actual backup is only part of the solution. A number of further
    issues need to be taken into account to guarantee, to any degree, the integrity
    and recover of the data stored electronically. These issues are discussed next.


    # Devising a Sensible Backup Policy


    How often is a backup done? What data or file systems are backed up when one is
    done? Ideally, a full backup of everything would be done every day, but this is
    not always a practical option; it could prove a waste of resources and could undermine
    the reasons for the backup in the first place:


    +   - The result could be that the system spends the majority of its time executing
    backups inidnding instead of running core business applications.

    - Static data—that is, data and file systems that haven''t changed since the last
    backup—are being backed up, wasting time and media.

    - The real business-critical data might fail to be backed up in favor of noncritical,
    static data, which could prove to be extremely damaging.'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# 142 Chapter 7 Disaster Recovery and Contingency Management


    A good, practical strategy is to back up critical file systems containing operating
    data at specified periods, preferably with the system at single-user mode to ensure
    there is no activity other than the backup process itself. These backups would
    normally be carried out using the Solaris backup and restore commands (fsdump
    and fsrestore). It is also good practice to have the operating environment on
    different disk partitions rather than the actual data. This makes the restoration
    of the system software much easier and manageable because its content rarely changes
    (unlike the live data).


    When it is not practical to carry out a full backup on a daily basis, the best
    strategy is to do a full backup once a week, supplemented with incremental backups
    every other day of the week. Remember that if high availability is required, then
    clustering and RAID configurations should also be implemented, greatly reducing
    the need for backup tapes to be required. In an emergency, however, when a building
    is destroyed, the capability to restore the entire system from the backup tapes
    exists, and the actual loss will be very small.


    # Media Rotation


    After deactivating a backup regime that is both practical and sensible, it would
    be a shame to neutralize the effect by continually writing to the same tapes.
    The result will be unreadable backups—worthless. Each backup tape has a finite
    life expectancy Determine what it is, and replace the rotating tapes to be the
    specified number of uses is reached. This simple task can significantly reduce
    the risk of I/O errors on tapes.


    A further consideration when discussing the rotation of backups is the percentage
    of backups that are kept permanently. Some companies have a rotation policy of,
    say, four weeks—every four weeks, the backup tape is overwritten as part of the
    backup cycle. The result, for example, is that a file that was accidentally deleted
    months ago cannot be restored. Other companies have a policy in which, for example,
    every full backup is retained permanently (the entire backup set for that day
    is replaced with new tapes). The result is here that a file from six months ago
    can be restored, if required.


    The reason this is mentioned is that, when a member of staff either deletes a
    tape accidentally or that file becomes corrupt, there might be a considerable
    time lapse before it is noticed. A bimonthly report, for example, would require
    information from the previous two months to actually compile the report, and the
    data might have already been recycled.


    # Restoring Solaris Backup Software


    The operating system backup would include the Solstice Backup software, which
    is installed as a package, probably in the /opt file system. In the event of a
    serious failure requiring a full restore, Solstice itself would have to be restored
    (reinstalled) before it could recover the rest of the system''s data.'
  merge: -1
