  md: '# 22 Chapter 2 The IT Budget


    Training is required only when introducing a new member of staff to the Solaris
    environment, but also on an ongoing basis so that the department keeps abreast
    of new software releases and developments. But it''s not only the directly relevant
    technical training that needs to be addressed. For example, a senior administrator
    might benefit greatly from some project management training as part of a career
    development plan. Lack of training has been one of the main reasons for leaving
    a job. Additionally, the lure of full-training or cross-training can be attributed
    to staff moving from one company to another.


    # The Benefits of Training


    Although the cost of training courses is high, the added value that the employee
    brings to the business can be of greater value in the long term, so training should
    be seen as an investment in the business. Management sometimes has a problem with
    funding expensive training courses because it does not show a tangible benefit
    as a result that can be quantified in financial terms. However, training offers
    a number of benefits, some of which are listed:


    +   - Employees become more productive in a shorter time.

    - Formal training is more structured than on-the-job training, making the learning
    curve.

    - Employees experience increased confidence in their own abilities.

    - Fewer mistakes are made carrying out the duties.

    - Greater understanding leads to better performance and motivation.

    - Less time is spent seeking advice from the more experienced employees.

    - Employees might see new ways of doing the job, resulting in a more efficient
    operation.

    - Employees have the opportunity to learn and practice away from the working environment,
    where there are many distractions.


    # On-Site Versus Off-Site Training


    If there is a fairly requirement for a training course, it is sometimes beneficial
    to investigate the option of having the training company deliver the course on
    the company premises. This can often result in an overall saving because the travelling
    and accommodation costs are zero. The course can also be tailored to suit the
    company''s individual needs so that the maximum benefit is gained.'
