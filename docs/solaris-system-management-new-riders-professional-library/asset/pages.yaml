    # Sun Security Manager (SSM)


    SSM provides the type of security that corporations require when running mission-critical
    applications in a distributed environment. It delivers advanced access control
    for clients, servers and applications, as well as a centralized management facility.


    One interesting aspect of SSM is that it supports Secure Single Sign On (SSO).
    This facility is important in today''s multi-system distributed networks. Users
    are forced to remember more passwords as they have access to more systems and
    applications. A consequence of this is that there is a higher probability that
    they will be written down or easy to remember, which makes them less secure. The
    capability to use a single password for all access means that the user can remember
    the password, and the fact that it may have to change regularly is not a major
    issue.


    Sun Security Manager also provides support for high availability in a 24X7 environment.
    A master server holds the security database, while a number of slave (redundant)
    servers hold read-only copies of the security database. Any of the security servers
    can respond to requests, and updates are automatically distributed to the slaves
    when made to the master database. If the master server fails, then any of the
    slave servers can easily be converted into a master.


