  md: 'All spool files are held within the /var directory and can potentially become
    very large. If a separate file system is not created, there is a risk that the
    root (/) file system might be filled to capacity and might endanger the running
    of the entire system.


    # Database Server


    A database server contains a physical database, or a number of databases, and
    provides users with access to the information stored within the various tables
    of the database. Some of the issues surrounding database servers are discussed
    here, using Oracle as an example of a relational database management system:


    +   - Memory—The database server requires a significant amount of memory to function
    efficiently. The actual amount depends on the number and size of data-based on
    the server.


    Kernel configuration—Some of the Solaris kernel InterProcess Communication (IPC)
    parameters need to be configured so that the structure of the System Global Area
    (SGA) can be accommodated. Without these parameters set, it will not be possible
    to start up any databases because the system will not have sufficient reserved
    memory. (Shared memory here refers to memory that has been specifically reserved
    for use by the database management software. It is not available for "sharing"
    with other processes.) The following options contain the minimum recommended values
    for be added to the file /etc/system for an Oracle database. They would follow
    by:


    ```

    set shmsys:shminfo_shmax=429497295

    set shmsys:shminfo_shmn=1

    set shmsys:shminfo_shmget=10

    set semsys:seminfo_semns=200

    set semsys:seminfo_semni=70

    ```


    # Backing Up Before Making Changes


    Before editing such important file as /etc/system, be sure to always make a copy
    so that recovery is possible if any problems occur. To reference the original
