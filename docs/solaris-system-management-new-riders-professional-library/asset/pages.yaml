- img_proc: true
  md: 'If this kind of data is likely to be required, then perhaps a further add-on
    module

    to Solstice Backup is the answer: Hierarchical Storage Management (HSM). Data
    is

    automatically migrated to the backup device based on specified policies and is
    also

    available for recall when needed.


    # Storage of Backup Media


    # Scheduled Testing of Backups


    Unfortunately, the most common error with regard to backups is that the company
    is

    lured into a false sense of security, purely because a backup has been taken of
    the sys-

    tems. The real proof of a good backup is the capability to subsequently read the
    tape

    and restore the contents of the backup. This aspect is frequently overlooked until
    it is

    too late, when it is really needed. A periodic test to ensure the tapes are readable

    should be a part of every backup strategy. It is not necessary to restore the
    entire con-

    tents of a tape; selecting a small sample of files will demonstrate its readability.


    > Media Storage Warning

    When considering fire-proof safes or vaults, always examine the temperature rating
    of the safe to ensure

    that the media is fully protected in case of a fire. It is extremely important
    to know how cool the safe

    will keep the media and to ensure that this is within the tolerances of the media
    itself.'
