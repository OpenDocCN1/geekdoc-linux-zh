  md: '# Software Configuration


    This section contains information on how the system software has been configured.
    It is not enough to show the initial install detail here because it has most likely
    changed when system tuning was carried out or software was added, requiring the
    modification of specific parameters.


    The following information normally is found in the system software configuration
    section of the documentation:


    +   - Solaris software option—State which option was used to install the operating
    environment, either core, end user, developer, or entire distribution. If required,
    use the output from the pkg_info command to include specific package information.

    - Name service—Details about name service should be supplied, including the domain
    name, if applicable, and the status—for example, NIS master or slave server.

    - Use of the system—Include a few words to describe the purpose of the system.
    Examples include file server, database server, application server, boot server,
    backup server, and so on.

    - Kernel parameters—Include the file /etc/system to show the kernel parameters
    that have been modified. (See Listing 8.2 for an example of a customized configuration
    file.) This provides the necessary information and makes the document easy to
    update for further modifications.

    - Configuration files—Include details of files that might be changed as a result
    of software requirements or security implementations. Such files include /etc/initab,
    which shows the initialization levels; /etc/nswitch.conf, which shows the order
    in key files are accessed; /etc/syslog.conf, for system logging parameters; and
    /etc/inetd.conf, for details of disabled services for security reasons. The startup
    files are located in /etc/rc* and the /etc/rc.*d directories, which will be modified
    if applications are added or services removed.

    - Remote dependencies—Provide details of services provided to other systems or
    file systems that are mounted from other systems. The contents of files such as
    /etc/dfs/dfstab could be included to show all file systems that are shared, as
    well as the files /etc/auto_master and /etc/auto_home to show details of automount
    file systems.'
  merge: -1
