- img_proc: true
  md: '# Logging of Repeated Failed Login Attempts


    Detailed logging of failed login attempts can be obtained by creating a file called
    loginlog. These three commands set this up correctly:


    ```

    touch /var/adm/loginlog

    chmod 600 /var/adm/loginlog

    chgrp sys /var/adm/loginlog

    ```


    The addition of this logging causes an entry to be written to the log file if
    failed login attempt occurs. The majority of the time, it is simply a user that
    has forgotten the password, but it could also alert the system manager (or administrators)
    to an intruder trying to guess passwords.


    # Disabling or Removing Unnecessary Services


    If a particular service is not required, it should be disabled and removed. By
    leaving it, the company could be exposing itself to an avoidable risk of intrusion.
    For example, if NFS is not used, comment out or remove the relevant entries in
    the /etc/services file, and remove the scripts in /etc/rc2.d and /etc/rc3.d that
    automatically start NFS at startup.


    Many network facilities are started via the inetd process, its configuration file
    being /etc/inetd.conf. Each of the facilities in this file should be inspected
    to see whether it is appropriate for the specific environment—if not, then disable
    it by commenting out the entry or removing it. For example, if a company requires
    a more secure system, then it is a good idea to replace the standard /etc/inetd.conf
    with one that just allows Telnet and FTP services (if these are required). A very
    good example of a network service is dangerous because it has been known to have
    security problems.


    # Making Use of Groups


    When administering user accounts, many companies create the accounts with a group
    of staff or general. This is less secure and potentially allows user accounts
    to access to files and data that should be restricted. It is a better policy to
    create groups for relevant sections, and then modify them when access is required.
    For further management of permissions, a combination of groups and ACLs (mentioned
    earlier in the “Bundled with Solaris” section) can be used.


    For example, when defining groups for sections, possible candidates could be sales,
    marketing, or personnel. Here, the accessibility of unauthorized data is immediately
    reduced, preventing staff from sections outside of ours from reading sensitive
    files. The other popular alternative for grouping user accounts is by function,
    as sys, which provides greater privilege for system administrators yet does not
    require them to always use the superuser account (root). Management would be a
    further function grouping allowing managers from various sections to have limited
    access, such as sensitive reports or financial data.'
  merge: -1
