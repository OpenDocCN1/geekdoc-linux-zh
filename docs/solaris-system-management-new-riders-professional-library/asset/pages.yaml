  md: 'The next three subsections identify the type of information that needs to be
    included in the system documentation to ensure that it contains a comprehensive
    description of the system, its configuration, and the commands that can be used
    to obtain the required data.


    # System Hardware and Device Configuration


    A list of the hardware installed in the system is critical to the documentation,
    especially if faced with a disaster in which the computer could be completely
    destroyed. The same is true of device configuration information.


    The following information normally is found in the system hardware and device
    configuration section of the documentation:


    +   * Output from the prtdag and sysdef commands—These commands display the system
    definition, including all hardware, pseudo and system devices, loadable modules,
    and the values of some kernel parameters.


    +   * Physical disk partition information—This is the only place where the disk
    partitioning information will be held, apart from the system itself. See Listing
    8.1 for a sample—from the format and prvtoc commands.


    +   * Storage subsystems—Include any information about RAID configurations or
    Solstice Diskuite metabase usage. Even though this is technically a software issue,
    it is concerned with configuring the underlying hardware and should be included
    here.


    +   * Special devices—This includes any information about other devices that require
    special consideration, such as the use of a third-party autoloading tape stacker.


    Listing 8.1 shows the relevant part of the format command to list the disks attached
    to the system, as well as the output from running prvtoc on two of the disk volumes.
    The advantage of using prvtoc over format for this particular information is that
    it shows the mount point on which the partition is currently mounted (which format
    does not) and gives details about the geometry of the disk.


    Listing 8.1 Annotated Output from the format command and prvtoc Showing Physical
    Disk Partition Information and the Current Mount Points.


