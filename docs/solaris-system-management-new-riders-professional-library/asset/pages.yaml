    These three shells are now delivered as standard with Solaris 8. Their basic functionality
    is extremely similar, with job control, word completion, a command-line editor,
    and the capability to recall a history of previously entered commands common to
    all of them.


    # The Secure Shell


    The secure shell provides the means a client and a Solaris system access securely,
    using encrypted communications between their own SSH protocol. The secure shell
    daemon runs on the Solaris system and will accept a login request only from a
    “known host”—that is, a system with a registered encryption key. The secure shell
    is available from SSH Communications Security Corp. (http://www.ssh.com). This
    has become the de facto standard for users requiring remote logins.


    Two versions of the secure protocol exist: SSH version 1 (SSH1) and SSH version
    2 (SSH2). Both encrypt at different parts of the network packet. SSH2 uses only
    keys to authenticate systems, whereas SSH1 uses server and host keys. The two
    protocols are incompatible, although they can be run on the same system if SSH1
    was installed before SSH2. The SSH2 protocol is a complete rewrite and is more
    secure. SSH2 also includes an easy-to-use secure file transfer facility, using
    the Secure File Transfer Protocol (SFTP).


    Licensing of the two protocols has a factor in deciding which to use. SSH1 was
    originally free, although versions later than 1.2.1 apply restrictive licensing.
    A number of ISRs still work on SSH which it is free and proven to be stable because
    it has been around longer. SSH2, on the other hand, is free for nonprofit organizations,
    educational organizations, or entities using it for charity.


    SSH is not only a shell, but it also provides a graphical environment when needed
    in a secure environment. The X Window System over SSH can be used when only connectivity
    is permitted.


