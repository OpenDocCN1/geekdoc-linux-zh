    sar


    sar, which stands for "System Activity Report," is used to collect cumulative
    activity information and optionally to gather the information into files for subsequent
    analysis. By default, automatic collection of this information is disabled. To
    enable it, carry out the following steps:


    +   1. Uncomment the crontab entries for user sys.This is the cron to use for
    performance collection activities.

    2. Uncomment the lines in the file /etc/init.d/perf.

    3. Run the script /etc/init.d/perf manually, or wait until the next system reboot
    to activate the performance collection-gathering process.


    The data is collected and stored in daily files in the directory /var/adm/sa.
    The data is stored in files named maxx, where xx is a number representing the
