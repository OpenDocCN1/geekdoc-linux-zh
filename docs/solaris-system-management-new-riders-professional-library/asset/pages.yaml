  md: '![](img/20459f772e7361286cec3e76e3bd26b4_274_0.png)


    # 14

    Network Management Tools


    THE CONTINING EXPANSION OF COMPUTER NETWORKS and the rapid growth of client/server
    computing has added another problem for today''s companies to deal with: how to
    manage these complex and heterogeneous environments that can often number thousands
    of systems in different locations.


    In this instance, network management does not encompass the actual management
    of the network infrastructure, such as hubs, switches, and so on. Instead, it
    deals with the systems that comprise the network, for which the system manager
    has responsibility. The management of the network itself is the responsibility
    of the network manager.


    The task facing the system manager is more one of remote systems management, and
    choosing a suitable off-the-shelf product with which to achieve it can be a difficult
    and sometimes expensive exercise. Several companies have resorted to writing their
    own “in-house” network management applications, but this has the disadvantage
    of being customized to their own specific network; it also carries the overhead
    of having to maintain and update it when new methods or network protocols are
    implemented.


    The objective of this chapter is to highlight some of the products that are available
    and provide insight into the type of use to which they can be put. It is not intended
    to be an in-depth guide of how to use any of them. However, as part of the discussion
    of Solstice Domain Manager, this chapter gives a more detailed example of SunNet
    Manager, which is incorporated as part of Solstice Domain Manager.'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# 258 Chapter 14 Network Management Tools


    This chapter takes a look at some of the network products available from Sun Microsystems
    designed to manage a Solaris network, no matter how small or large it happens
    to:


    +   - The first section describes in detail the Solstice Domain and Site Manager
    products, with Co-Operative Consoles. This includes detailing how they can be
    used together to effectively manage a Solaris-based network of computer systems.

    - The second section, Solstice Bandwidth Manager, involves the allocation of guaranteed
    network bandwidth that so mission-critical activities can be carried out in accordance
    with the criteria specified by an SLA.

    - The final Sun product, Solstice Adminuis, is covered with a brief look at the
    collection of utilities that allow remote system administration for a number of
    Solaris systems.


    The products listed here collectively deliver the necessary tools to provide the
    best quality of service to the customer while being fully scalable to allow for
    future expansion or diversity.


    Several other network management products available on the commercial market,
    such as HP Overview, CA Unicenter, Tivoli, and BMC Patrol, be suitable for multivendor
    environments. A brief description of these other products appears at the end of
    this chapter.


    # Benefits of Using Network Management Tools


    Traditionally, networks of interconnected computer systems required someone to
    sit at a console, or a number of consoles, checking the status of each machine
    periodically. This was normally the system administrator or sometimes a computer
    operator. The advent of network management software means that the systems can
    be monitored from a single position. When set up, there isn''t really anything
    to monitor, unless the console receives the operator by either flashing an icon
    or sounding an audible alarm—it also writes to a log file.


    Network management tools allow distributed systems to be managed from a centralized
    console; for resilience, from multiple consoles acting as peers with the same
    privileges; or as a network management hierarchy.


    The health of the entire network can be seen from a single screen, giving a global
    view of every computer system that the system manager is responsible for. This
    reduces the staff resources needed not only at the central site, but also at remote
    sites because management can be carried out remotely. This is especially valuable
    for out-of-business-hours management.'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# Sun Network Management Products 259


    A major benefit of a network management tool is that the management console is
    automatically informed of any problems (called events) as the remote systems are
    regularly polled to see if any thresholds have been exceeded or conditions have
    been met. With a large network, however, there might be numerous events, some
    of which require immediate attention. The event processing and notification software
    included with a network management product also includes a priority mechanism
    allowing important events to be highlighted and attended to first. The Solstice
    Domain Manager suite additionally provides the capacity to launch a program or
    script when a specified event condition is encountered, for example, to take corrective
    action as compressing or removing files if a disk partition fills or reaches a
    predefined capacity threshold.


    Performance and statistical information can be gathered and displayed as text
    or in graphical form for later analysis and reporting. This provides useful data
    when trying to establish whether service level agreement targets have been achieved.


    # Sun Network Management Products


    Since its inception, Sun Microsystems has been heavily involved with network computing.
    Therefore, it''s no surprise that the company has produced the leader in network-management
    software products, the Solstice Domain Manager suite, described in detail in this
    section.


    The products described in this section do not all merely show doing of doing the
    same thing. Each have a separate purpose, as follows:


    +   - Solstice Domain Manager manages the entire network of computer systems,
    whereas Solstice Site Manager carries out the same functions but on a smaller,
    single-site basis.


    +   - The Solstice Bandwidth Manager product ensures that mission-critical applications
    are guaranteed the necessary network priority to meet processing deadlines.


    +   - Solstice Adminsuite is a set of tools for carrying out system administration
    tasks on multiple Solaris systems.


    When these Sun products are used together, they provide all the necessary functionality
    to monitor and manage a Solaris installation, from a small site to a large enterprise.


    # Solstice Site Manager


    The Solstice Site Manager software product is built upon the proven SunNet Manager
    software and can effectively manage up to 100 separate nodes. It addresses the
    issue of managing smaller computing environments on a single site. The product
    is fully scalable and runs the same application, database, and user interface
    on all Sun platforms, whether a small SPARstation or a large ULTRA enterprise
    server.'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# 260 Chapter 14 Network Management Tools


    A typical view as seen by the administrator is shown in Figure 14.1.


    ![](img/20459f772e7361286cec3e76e3bd26b4_277_0.png)


    Figure 14.1 The flexible configuration enables views to be configured to suit
    the user.


    Solstice Site Manager includes the entire functionality of SunNet Manager as well
    as a limited version of the Cooperative Consoles software. The following sections
    describe the capabilities of Solstice Site Manager.


    # Network Discovery and Layout Tools


    This tool automatically finds devices on the network, enters the details in the
    database, and creates an icon on the top-level view. The information includes
    at least the IP address of the discovered device. However, it uses this to name
    the device, which is not always desirable; a hostname normally is used to identify
    a system on the display. In the database, a discovered object can be managed by
    the software and made subject to data and event requests.


    This facility is useful because it identifies any new (and possibly unauthorized)
    devices that have been connected to the network. It is also very network-intensive,
    so some care should be taken about when this utility is run to avoid affecting
    the user community.


    The layout tool attempts to lay out the screen in a meaningful way, discovering
    the visible devices on the network. The layout tool reads the information in the
    management database and automatically places the objects and connections in one
    of three layout styles:'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# Sun Network Management Products 261


    +   - Hierarchical—The elements are organized into a hierarchy of subnetworks.

    - Circular—This style organizes subnetworks into circles.

    - Symmetric—The elements are laid out in a uniform symmetric distribution on the
    top-level screen.


    # Inherited from Children


    A feature of the SunNet Manager is that the status of managed objects is passed
    upward through the hierarchy of user-defined views. For example, a single workstation
    in the sales department, located in Building1 and displaying a problem, will be
    noticed on the console screen where the whole site is displayed-only as a number
    of buildings. The administrator then traverses through the views, to the building
    and the department within the building, and so on, to locate the troubled system
    and deal with the problem.


    # Request Management Software


    Data requests and event requests are sent to remote nodes and are handled through
    the request management software. Data requests gather specific data, such as disk
    capacity information or processor usage, for later analysis, whereas event requests
    set tolerances to monitored. An alarm is raised if a tolerance is exceeded; the
    action is to be taken and the form of the alarm are entirely user-configurable.
    Figure 14.2 shows an event request initiated.


    ![](img/20459f772e7361286cec3e76e3bd26b4_278_0.png)


    Figure 14.2 The versatile nature of the event management software features a variety
    of options to cater to all configurations.'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# Chapter 14 Network Management Tools


    In Figure 14.2, an event request is submitted to monitor the CPU idle time on
    a database server, GoldDB1. It checks the system every 60 seconds to see if the
    idle attribute is less than 10%—that is, to see if the CPU is more than 90% busy.
    If this is true, a mail message is sent to the root user, the icon for GoldDB1
    will turn red (as defined by attributes Glyph Effect and Priority), and the script
    /usr/local/monitor_detail.sh will be executed. By default, the priority colors
    are yellow for low priority, amber for medium priority, and red for high priority,
    although these can easily be changed. My own personal preference is to always
    create the managed objects with a color of green, symbolizing “go—no problems.”
    The icon will change from its initial color only if an event is triggered.


    Another useful feature is the “pending” state. When an event criteria is met,
    the icon is changed to a specified color (different from the three priorities);
    further event notifications for devices are suspended so that the administrator
    does not continually receive event alarms for the same device. When the problem
    has been rectified, the administrator can manually change the Glyph State to normal,
    and the events automatically start monitoring the device.


    # Proxy Agents


    One of the best features of the product is the proxy agents. Here, the Site Manager
    console delegates event requests to designated proxy systems. The result is that
    the proxy system polls the managed object (instead of the managed console) and
    reports back to the console only when a threshold is exceeded or a test condition
    is met. This reduces the amount of network traffic that passes between the console
    and the managed objects. Proxy agents are normally local to the managed objects
    to reduce traffic further. Figure 14.3 demonstrates this kind of configuration.


    ![](img/20459f772e7361286cec3e76e3bd26b4_279_0.png)


    Figure 14.3 The delegation of requests to proxy agents greatly reduces the load
    and traffic that a management console must deal with.'
  merge: -1
  pgno: 279
