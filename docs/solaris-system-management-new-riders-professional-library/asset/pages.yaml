  md: '# 12


    # Internet Protocol Version 6


    THE INTERNET Protocol (IP) ADDRESS is the common means by which data is transported
    between communications networks. It also identifies the particular computer (or,
    more specifically, the network interface) that is connected to the network. Every
    node (PC or workstation) that connects to the Internet requires a unique Internet
    Protocol (IP) address. For home users, the IP address is supplied by the Internet
    service provider (ISP).


    With everyone using IP, the increase in the number of computers being connected
    to the Internet has given rise to a problem: Available unique addresses are in
    short supply. The current version of IP, version 4 (IPv4), has a limit of about
    4 billion addresses. Various predictions by industry specialists indicate that
    the address range could be exhausted as early as 2002. Indeed, if subnetting and
    Network Address Translation (NAT) had not been used, the numbers might have already
    been exhausted. The impact of this is that any new computers or devices that require
    an IP address to connect to the Internet will not be capable of doing so.'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# Chapter 12 Internet Protocol Version 6


    A further problem is related to the use of Internet routers. Originally, IPv4,
    the current protocol, was designed for a relatively small network of mainly academics
    and engineers, primarily for file transfer operations. IP addresses were not allocated
    in a particularly structured or efficient manner, such as geographical location.
    This requires Internet routers to store details of many more routes than originally
    intended. The routing information that is needed to cope with the diversity of
    addresses is becoming unmanageable.


    The Internet Engineering Task Force (IETF) designed a new version of IP that provides,
    among other things, a vast increase in the number of available addresses that
    can be allocated. Sun Microsystems has been heavily involved with the design and
    development of IPv6 and is represented on virtually every major working group
    of the IETF. Sun was the first vendor to release an IPv6 prototype to the Internet
    community.


    This chapter describes the basic features of IPv6 and how it differs from the
    current IP structure. It also covers what the system manager should be taking
    to prepare for the implementation of IPv6. Finally, it gives a brief discussion
    on how IPv6 affects the system manager and the business to which he is providing
    a service. It is assumed that the reader is familiar with the basic concept of
    IP addresses. For more in-depth information, an excellent reference book is identified
    in the Appendix,"Resources": IPv6 Clearly Explained, by Peter Loshin.


    # What Is IPv6?


    Internet Protocol version 6 (IPv6) is an evolutionary step from the current version
    of IP, version 4. It previously was known as IPng, meaning “IP next generation."
    IPv6 was designed to work alongside IPv4 so that the transition can be carried
    out in a piecemeal fashion, reducing the impact on the Internet community.


    # What Happened to IPv5?


    IPv5 could not be designated for the next generation of IP because it had already
    been used for an experimental protocol called the Internet Stream Protocol Version
    2 (ST2). It was never widely used, because version 5 had already been allocated,
    the new version of IP to be given its own unique number—hence, version 6. ST2
    is described in RFC 1819.'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# What Is IPv6? 233


    The actual IP addressing structure is discussed in the next section, "IPv6 Addressing.\nThe
    remainder of this section looks at the features that the migration to IPv6 will
    provide:


    +   **Increased address space**—The current number of IP addresses available in
    IPv4 is about 4 × 10⁹, or 4 billion, whereas IPv allows nearly 10³⁸—and that without
    subnetting create additional addresses. The number of addresses that can be allocated
    pennies hundreds of computers per square meter of the Earth’s surface, so it is
    intended to satisfy requirements for the foreseeable future.


    +   **Classless addresses**—Unlike IPv4, in which IP addresses are identified
    by their network class (A, B, or C), IPv6 addresses will not contain address classes.
    Obviously some addresses will be reserved for specific use, but the general concept
    of IP addressing classes will cease.


    +   **Better routing**—with classless Internet domain routing (CIDR) algorithms,
    which are more efficient in handling routes for large network environments. The
    longer IPv6 address improves routing efficiency by allowing grouping of addresses
    into hierarchies of network based on geographical location, (such as service provider
    or corporation, for example), something that IPv4 cannot accommodate.


    +   **Increased security**—IPv6 will be capable of providing authentication, a
    method of ensuring that a received packet has actually come from the origin provided
    in the packet’s source address, and, more importantly, that it has not been altered
    (spoofed) during transmission. IPv6 also allows the data to be encrypted, something
    that IPv4 cannot do. Additionally, groups of managers can agree to use certain
    procedures, such as encryption keys, and create what has been termed “security
    associations” for the secure exchange of data.


    +   **Accommodation of non-IP address formats**—The longer IP address structure
    will provide sufficient space to allow translations of non-IP address formats,
    such as IPX or Ethernet, into IPv6 addresses. For example, an Ethernet address
    that is 48 bits is too long to map directly into an IPv4 address, which is 32
    bits long. With IPv6 being 128 bits long, direct mapping is now possible.


    +   **More efficient broadcasting**—IPv6 introduces limited broadcasting to only
    those that request to receive the data. This differs from the current IP broadcast
    method, whereby the packet is sent to every host on the network. This is especially
    important in the use of multimedia, for example, in video or real-time data (which
    can be very large) which can be transmitted efficiently using guaranteed bandwidth.'
  merge: -1
