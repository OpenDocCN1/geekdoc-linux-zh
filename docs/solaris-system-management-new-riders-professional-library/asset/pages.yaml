  md: 'The desktop Korn shell (dtksh)—This is a shell bundled with the Common Desktop
    Environment (CDE) software that provides an extended version of the Korn shell
    (ksh-93) with support for many X Window graphical functions. These functions were
    previously used in programs that required compilation and linking before they
    could run. The dtksh provides a very similar functionality that it can run as
    a normal shell script—that is, it is interpreted rather than compiled.


    The restricted shell (rsh)—this is a more controlled version of the Bourne shell,
    and it is used to restrict the access of a user. With this, the user cannot change
    a directory or set the PATH variable. There can be no redirection of output, nor
    can any absolute pathnames be specified (starting with "//"). The restricted shell
    command should not be confused with the remote shell. Both are called rsh (the
    remote shell is also referred to as rsh), but they reside in different directories:
    the restricted shell is /usr/lib and the remote shell in /usr/bin.


    # Shells Available in the Public Domain


    A number of shells have been written and made available in the public domain.
    These are many extensions to the existing shells with additional functionality
    added. Although there are many, three of the more popular ones are discussed here:


    +   - **Bash**—which stands for "Bourne Again Shell," is a public domain shell
    written by the Free Software Foundation. It is intended to be a full implementation
    of the IEEE shell and tools standard, and it is provided as the default shell
    on most versions of Linux.


    Bash is fully compatible with the Bourne shell—Bourne shell scripts will run without
    modification under the Bash shell. It also incorporates useful features of the
    Korn shell (ksh) and the C shell (sh).


    In addition, Bash offers command-line editing without having to erase back to
    the point of error. Vi- or Emacs-style editing commands can be used, and Bash
    includes a command history feature as well as filename completion and a built-in
    help facility. This is by far the most popular of the public domain shells available.


    +   - **tcsh**—This shell is an extended version of the Berkeley C shell. It is
    fully compatible with the C shell, but it includes additional functionality, such
    as a command-line editor, word completion, spelling correction, a command history
    recall mechanism, and built-in job control functions.'
