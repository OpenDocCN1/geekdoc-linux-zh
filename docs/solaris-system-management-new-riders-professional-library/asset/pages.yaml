- img_proc: true
  md: '# Capital Costs 23


    Even though the company''s own expenses are significantly reduced by arranging
    on-site training, there will still be some costs involved, such as travel expenses
    for the instructors to deliver the training, as well as the cost of having the
    training customized to suit the specific needs of your business. On-site training
    courses also frequently do not supply sufficient training or practice systems,
    which reduces the amount of hands-training and can detract from the overall value
    of carrying out the training in this way. If the company has a good training system
    with plenty of machines, then this is definitely an attractive option.


    A benefit with the on-option is to involve delegates from other departments. For
    example, if there is a need to include database administrators who often use shell
    programming to create database startup and shutdown scripts or to run periodic
    checks on specific parts of the database. Some users might benefit from an introduction
    to shell programming so that they can write procedures to produce, say, daily
    totals by counting the number of entries in a list of files. The point is there
    is a potential opportunity to share the cost between more than one department.
    As a result, each department gets a better deal than if they were to arrange the
    training separately.


    # Capital Costs


    Capital costs are usually one-off costs that represent significant expenditure
    and are normally implemented as a project. This could include new investments,
    such as building a new computer room, replacing air conditioning, doing UPS upgrades,
    and so.


    Sometimes capital costs must be funded over more than one financial year. There
    might not be sufficient funding in one single financial year, so the project might
    be designed to span two or three years.


    # New Systems


    Companies work in different ways, but the purchase of a new computer system can
    normally be attributed to a distinct project, so the budget of that project would
    usually pay for the new system and associated software. When the system has been
    commissioned and tested, it becomes the responsibility of the system manager.


    The servers and workstations used by the IT staff in the execution of their duties,
    however, must be funded by the system manager. For example, the purchase of a
    new server with a disk array can amount to a significant cost, especially when
    software products must be purchased as well as evaluate new versions of the operating
    system and to establish the risk of installing it into the live environment.


    Asset replacement is often another area of contention. Some companies have an
    asset replacement policy in which PCs or workstations are to be replaced, every
    two to three years. Most important, these replacements are funded from a central
    budget, not the IT manager''s budget. Sometimes this is done because the desktop'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# Chapter 2 The IT Budget


    computer that each employee has is deemed "essential office equipment," just like
    the desk itself. If this equipment isn''t funded from another source, then the
    system manager must ensure that sufficient additional funds are allocated to the
    budget to allow for asset replacement.


    # Cost/Benefit of Upgrades


    The system manager is responsible for upgrading the computer systems, both hardware
    and software, so he must decide whether an upgrade is cost-effective and advantageous
    to the business. Service level agreements often can aid in this decision because
    highlight areas of inadequacy could point to an upgrade that is necessary to provide
    an acceptable level of service. The SLA can also be used to justify expenditure
    on upgrades.


    Sometimes the hardware and software vendors remove support for either the system
    itself or the operating system. The justification for upgrading under these circumstances
    is the risk of running the systems in an unsupported state. Normally the vendors
    desupport notices on older hardware or versions of the operating system. Desupport
    notices are usually released by the vendor at least a year before they come into
    force. It is also worth noting that the vendors are often willing to provide a
    level of support even when the product is in desupport mode, but the cost is much
    greater, making it effectively cheaper to carry out the upgrade. Quite often the
    system manager must present the available options to senior management so that
    the business can decide whether the upgrade is necessary.


    # Running Costs


    These costs represent the day-to-day running of the operation, the tools that
    are required to provide services to the consumers on an ongoing basis.


    Some of the costs described in this section are frequently either underestimated
    or overlooked completely. The system manager must take account of the estimated
    costs that will be incurred. In larger companies, the running costs could amount
    to hundreds of thousands of dollars.


    Two of the major contributing factors to running an IT department are detailed
    in the next sections.


    # Support


    Vendor support for hardware and software products is essential if any kind of
    guaranteed service is being provided. If the company is running a 24x7 operation,
    these become even more critical and, obviously expensive. The system manager must
    decide on the type of support that is necessary for each system, based on the
    availability requirements and the business priority. It is worth noting that even
    though there'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# Running Costs 25


    might be a 24×7 operation, it doesn''t mean that every system must be covered
    on the same basis. Other systems might require support only during business hours,
    with perhaps a four-hour response. It would clearly be a waste of money to support
    systems around the clock when they are not being used. Chapter 8, “Strategic Management,”
    includes a section on saving money when looking at hardware and software contracts.


    Support of computer systems is only part of the requirement. A controlled environment
    contains air conditioning equipment, humidity control, and UPS power backup systems.
    All these require support arrangements as well as regular maintenance. For example,
    a UPS system must be checked regularly to ensure that the backups are in good
    working order; the backups must also be replaced periodically. A support agreement
    with the supplier should include all the items previously.


    # Consumables


    Budgeting for consumables is often underestimated because it seems as trivial.
    Tape cartridges for daily backups of the systems, are one of the most important
    consumables that the business must purchase as they are used to guarantee and
    preserve the integrity of the data. Saving money by purchasing cheaper, low-quality
    tapes could be a false savings because the error rates are likely to be much higher.
    Also, the cost of not being able to restore a file due to I/O errors could be
    extremely high.


    Toner cartridges for printers, CD-ROMS for archiving, and are further examples
    of consumables that must be accounted for. During the course of the financial
    year, these can amount to significant sums of money.


    To illustrate the wide range of consumables that must be purchased, the following
    list items considered to be consumable:


    +   - Backup tapes

    - CD-R writable CDs for local backups and archiving

    - Toner cartridges for network printers, fax machines, and photocopying equipment

    - Special paper requirements for printing, such as photographic paper and transparencies

    - Floppy disks or Zip disks for local backups and archiving

    - Disk and Zip disk storage units

    - Mouse filters

    - Screen filters

    - Computer cleaning kits


    Essential items such as normal printing paper, office stationery and office furniture
    are excluded from the list because they constitute items that are necessary to
    do any job, not just related to IT.'
