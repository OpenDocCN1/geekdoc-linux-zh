  md: '# Upgrade 101


    The final contingency is to actually restore the system from the backup media
    onto a test environment. By doing this, the integrity of the backup is proved,
    and the capability exists to restore the system in the event of a failure.


    It should be normal practice to regularly test backups, but in the real world,
    this is rarely done. Management and users alike are satisfied and confident as
    long as a backup of the system is taken. They assume that because the backup was
    done, there will be no problem in restoring the necessary files, if needed. Without
    testing, there is no guarantee that a backup can be read, particularly when it
    is written to magnetic tape.


    A further option for obtaining a system backup by mirroring is being used to break
    the mirror—that is, disable one half of the mirrored pair, creating a static copy
    of the system disk in its current state. The static copy could then be used to
    reinstate the operating system to its state if the upgrade failed, and it would
    also be much quicker than having to restore from backup media.


    # Type of Installation


    Four methods exist for installing the Solaris software on a system: interactive,
    network, jumpstart, or Webstart. Each of these options is discussed further here:


    +   * WebStart—This option is only for initial installations and cannot be used
    for upgrading the operating environment. It is included here for completeness.
    WebStart is Sun''s Java-based installation program. It provides a point-and-click
    interface to install the operating environment as well as other software that
    is bundled with Solaris.


    +   * Interactive—This is the preferred option for system administrators building
    a single system, and it is discussed in the next section.


    +   * Network—In this option, the operating environment is installed over the
    network. Ideal for a computer without a local CD-ROM drive; a CD-ROM drive is
    required for a Solaris installation because this is how the software is delivered.
    A remote install can be carried out using a remote system''s CD-ROM drive, or
    an image of the Solaris CD-ROM copied to the remote system''s hard disk. This
    option is very useful when there is no local CD-ROM drive, and this is also the
    recommended method for the E10000 system.


    +   * Jumpstart—This is a method of automating the Solaris installation process
    on a number of systems. This option is discussed in the upcoming section "Multiple
    Systems."


    # Single System


    The installation of a single server is more easily carried out using the interactive
    installation method. This still appears to be the most popular method among seasoned
    system administrators, partly because it is the method that they have always used,
    but also because it provides the system administrator full control and flexibility.'
