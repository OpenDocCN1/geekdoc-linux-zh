  md: '# Solstice Bandwidth Manager


    The Bandwidth Manager product is discussed here because it is sometimes necessary
    for the system manager to guarantee either delivery of information or an acceptable
    response time. Although the management of the network bandwidth is primarily the
    responsibility of the network manager, the system manager should identify priority
    or mission-critical applications that need to be guaranteed a minimum bandwidth
    to ensure that the high level of service is maintained.


    Solstice Bandwidth Manager allows the available bandwidth to be allocated to either
    a particular type of service (such as Telnet, FTP, or HTTP) or a specific department
    or customer. A series of rules dictate how the bandwidth is allocated, but flexibility
    is allowed, for example, if there is spare capacity when an application has used
    all its allocation.


    This product comes with monitoring and statistics collection so that accurate
    usage and performance figures can be recorded. These can also be used to help
    determine whether SLA targets have been achieved or whether the allocation of
    bandwidth needs to be changed to make better use of the available resource.


    # Solstice Adminsuite


    Solstice Adminsuite is a collection of commands and graphical tools that together
    enable the system administrator to carry out tasks on remote systems from a central
    location. Adminsuite is delivered as part of the Server release of the Solaris
    operating environment; it provides the functionality for managing users, groups,
    hosts, printers, disks and file system, system configuration files, terminals,
    and modems. Admintool is a similar tool that allows basic administration of the
    local host only, without the host disk and file system management aspects.


    Figure 14.10 shows the initial screen that is displayed when the tool is launched.


    ![](img/20459f772e7361286cec3e76e3bd26b4_287_0.png)


    Figure 14.10 The launcher tool is configurable so that other applications can
    be added or existing ones can be hidden.'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# Other Network Management Products 271


    Solstice Adminsuite contains a number of applications, briefly described here:


    +   - Host Manager—The Host Manager is used to manage clients and hosts on the
    network. Using this application, an administrator can add or delete operating
    system services, use AutoClient configurations, and set up install servers, such
    as those used for Jumpstart configurations.


    +   - Storage Manager—There are two components of this application, Disk Manager
    and File System Manager. Together, they allow partitioning and formatting of drives
    as well as the creation and maintenance of file systems, including making them
    available via NFS to other remote systems.


    +   - Database Manager—This application allows editing and management of the main
    configuration files, such as the hosts file and others within the /etc/ directory.
    The facility is available for the local system, remote systems, and an entire
    NIS domain, if present.


    +   - User Manager—This application provides user account management and enables
    defaults to be set for handling password aging, identifying the user’s email server,
    and setting the login shell.


    +   - Group Manager—When a name service is being used, the Group Manager can add,
    modify, or delete groups for the NIS domain. If no name service is in, it can
    be used to edit the /etc/group files on remote systems.


    +   - Serial Port Manager—This is used to install and manage servers for terminals
    or modems. All necessary files are created by the application, and standard template
    configurations are also provided to make the setup procedure easier.


    +   - Printer Manager—With this application, you can install, modify, and delete
    printers on a Solaris LP server. The printers can be centrally managed if a name
    service, such as NIS, is being used. In this way, printers become available to
    all clients running the SunSoft client software.


    # Other Network Management Products


    Multivendor environments that have not previously managing Solaris-based systems
    might already be running a network management product. In these instances, it
    is not always the best solution to install a new product because the existing
    one might be capable of incorporating any Solaris systems into the current configuration.
    A number of network management products provide full support for the Solaris environment
    in the form of agents or additional modules. Four of these are listed here, along
    with the World Wide Web address for each:


    +   - Unicenter from Computer Associates, at http://www.computerassociates.com


    +   - Netview from Tivoli, at http://www.tivoli.com


    +   - Openview from Hewlett-Packard, at http://www.openview.com


    +   - Patrol from BMC software, at http://www.bmc.com/patrol'
  merge: -1
