  md: '# Acceptance Testing 67


    new system is installed and tested, the same calculations would be carried out,
    using the same test data. The results should be exactly the same—if not, then
    the new system is not functioning correctly.


    For an application such as payroll, despite the fact that a new way of doing things
    has been developed, maybe using a new GUI front end, the functionality—that is,
    the results of the calculations—should be the same. Regression testing is used
    for this purpose, be able to verify that the application still performs as expected.
    Without the benefit of regression testing, it would be extremely difficult to
    identify the effects of any changes on other parts of the application, leaving
    the potential for problems to be found only after the system is live.


    # System Testing


    System testing involves all the features of a new application.The IT department
    carries out the system acceptance and fully tests the functionality against an
    agreed criteria, usually the functional specification. System testing differs
    from user acceptance testing in the management and configuration of the application
    or system is tested in addition to the functionality.


    Some of the types of tests are listed here:


    +   - Installation and configuration procedures, including a QA of the administration
    and installation documentation.


    +   - Creation and management of user accounts, and management of passwords (if
    applicable) and permission assignments. For example, a user may be assigned a
    specific role that will require different permissions, such as query only, and
    update, or administrator.


    +   - Process of exercising each option that is available within the application
    to ensure it works as expected. GUI applications, command-line equivalents should
    be available for the core functionality of the application so that, for example,
    GUI sessions are not sent through firewalls when executing the application remotely
    across the network.


    +   - Configuration of printing from within the application.An example of this
    is the addition of a new printer or a printer queue.


    +   - Entering of invalid data to check that the error handling functions as expected.
    The testing looks so, so attempts will obviously be made to make the application
    or system crash.


    +   - Volume testing, to ensure that the system can work under conditions very
    close to that of the live environment.


    +   - Testing of the security of the system, as part of its security accreditation.The
    results of the security tests provide evidence of compliance (or otherwise) with
    the security policy in force.'
