  md: '# Samba


    Samba is freely available in the public domain and can be downloaded from the
    Samba Web site (http://www.samba.org) or other sites offering public domain software
    for Solaris systems (such as http://www.sunfreeware.com). Samba is free and comes
    with the source code.


    Samba runs on a UNIX platform, as Solaris, but it communicates with Windows clients
    if it were a native. The Solaris system running Samba is integrated into the Windows
    network neighborhood, providing file and print services to Windows clients that
    do not know they are being delivered by a Solaris system—that is, the services
    are transparent to the client. Samba is based on the SMB protocol and Common File
    Interface (CIFS).


    In many ways, Samba is similar in functionality to Solaris PC Netlink, but Samba
    cannot (yet) completely imitate (and even replace) a Windows NT domain controller—PC
    Netlink can accomplish this.


    +   - File and print—The Samba daemon (smbd) manages these facilities, making
    the UNIX system appear as a PC file server.


    +   - Authentication and authorization—Also managed by the smbd daemon are share
    mode and user mode authentication and authorization. The facility enables passwords
    to be applied to network shares, such as printers. Depending on the mode, a single
    password is used by all users (share mode), or a user has a username and password,
    individually administered by the system administrator.


    +   - Name resolution—This can take one of two forms. In broadcast, the client
    broadcasts the hostname of the system and waits for the IP address to be returned.
    Broadcast name resolution, is limited to the local network. The second kind of
    name resolution is point-to-point, using a NetBIOS Name Service (NBNS) server.
    Clients in this configuration send the NetBIOS names along with their corresponding
    IP address to the NBNS server, where it is stored in a simple database. The server
    then names resolution requests. The utility nmblookup exists to interrogate a
    server. NBNS is very similar to DNS but less secure because there are fewer controls
    that check for authorized clients.


    +   - Browsing—Browsing in this context is different from Web browsing. It is
    a “browseable” list of file and print services made available by computers on
    the network.


    +   - The Samba client—servlet is an FTP-style interface used to access PC resources,
    as files from printers or NetBIOS systems, among others.


    +   - tar—Samba includes a tar extension to the client software so that PC systems
    can be backed up on the Solaris host.


    +   - Administration tool—The Samba Administration Tool (SWAT) enables the administrator
    to use a Web browser to configure Samba remotely.'
  merge: -1
  pgno: 230
