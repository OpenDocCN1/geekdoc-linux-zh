    # Budgetary Considerations


    An extremely important question that the system manager must ask is: “Who’s paying
    for all this?” Managing supporting a 24X7 environment is not cheap—indeed, it
    costs significantly more than just running a “business hours” operation. These
    costs are not just for computer hardware and software so that high availability
    can be achieved, but also for additional accommodation (especially when multiple
    sites are being used), extra staff to support the operation, and of course, extra
    management to manage it. Somewhere, someone is going to have to pay for it, and
    it can''t be the system manager. Normally, the requesting department—that is,
    the person(s) or department that originally asked for the operation—is the best
    place to start. Companies using the chargeback system, described in Chapter 2,“The
    IT Budget,” should be capable of charging the customer for the services being
    provided—in this case, a 24-hour computing environment.


    Many system administrators and system managers come under pressure to deliver
    this level of service without being provided with any additional financial assistance.
    Without lowering standards of service or quality elsewhere, however, this isn’t
    possible, which merely shifts the problem rather than solving it.


    # Staff Considerations


    Manning a 24X7 operation involves additional staff: It is not possible to stretch
    the existing manpower levels to cater to a nonstop operation. Not only must the
    system administration and support staff be considered, but the management must
    as well. There is likely to be a requirement for at least one system manager,
    who will be.'
  merge: -1
  pgno: 95
- img_proc: true
  md: 'responsible for out-of-business working hours. Many organizations employ a
    formal shift roster, usually with either three or four shifts needed to provide
    the required level of support. It is important to remember that even shift workers
    and system managers need to have vacations, just like everyone, and they are also
    sometimes ill, so any staffing requirements must account for expected attendance
    levels. Of course, this is expensive because the number of staff needed for a
    24x7 operation will be at least double of a business hours-only operation—double
    rather than triple because the out-of-hours shift size can be reduced. Greater
    use of automation and management tools can further reduce the number of staff
    needed, but there is no escaping the fact that each shift must be manned and that
    attendance factors must be considered, too.


    # New Installation


    A new installation of a system can be a difficult task, especially if it is the
    first system being purchased from a specific vendor. New contacts must be made,
    and business relationships must be established. New skills might have to be recruited,
    or an investment in training might have to be made. All of these things need to
    be addressed well in advance of the actual delivery.


    # New System as Part of a Project


    Chapter 2 discusses the use of projects. A new system installation is likely to
    be part of a project, with an associated budget cost code. Any training requirements
    should be funded as part of the project, potentially saving the system manager
    a considerable amount of money. Additionally, a project sometimes funds the support
    and the implementation for the first year or so. Be aware of the potential to
    charge these costs to the project.


    With a new system, the system manager will be heavily involved in the technical
    assurance of the project. He will have significant input into the specification
    of the system and the requirements that need to be satisfied. In addition to considering
    the project itself, he will have to take account of any likely effect on the business
    as a whole. An example of this is when a new installation threatens to overload
    the existing power output in the computer room—here, the risk exists that services
    already residing in the same room could be severely disrupted. This example highlights
    not only the question of who funds necessary work to provide the additional power
    capacity, but also the issue of the disruption to operational services while the
    work is carried out. In mission-critical operations, this will be a serious consideration
    if all power has to be removed for several hours or, worse, several days. Most,
    if not all, businesses will not allow this kind of interruption to service and
    will demand a high level of resilience, requirement that can be satisfied only
    through the use of multiple sites, automatic failover, and clustering.'
