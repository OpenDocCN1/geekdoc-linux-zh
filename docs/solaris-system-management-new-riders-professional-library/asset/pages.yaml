  md: '# Strategic Planning and Techniques


    Computer security is a strategic issue, although some tactical measures can be
    taken on a per-system basis; these are discussed at the end of the chapter. Computer
    security requirements need be addressed as part of the IT strategy and be budgeted
    for accordingly. Too little value is placed on security, probably there is no
    "tangible" benefit, or return from investing in it, unlike the launch of a new
    product. The threat from both outside and inside the company is very real and
    growing. A company should address the issue from the perspective of not being
    able to carry out business. For example, suppose that an external cracker penetrates
    the system and trashes the customer and orders databases, perhaps a malicious
    e-mail is sent to each of the customers in the database stating that the company
    is no longer trading, and recommending a competitor instead. The losses incurred
    undoubtedly cause bankruptcy in some cases.


    A good computer security strategy needs to be initiated by professionals who have
    experience in dealing with an important issue. When the strategy has been devised
    and implemented, it needs to be regularly assessed to see if any modifications
    or enhancements are required. Each version of the Solaris operating environment
    is becoming more secure, providing a good reason for carrying upgrades as soon
    as it is practical to do so, in line with the corporate policy guarding the stability
    of products (refer back to Chapter 5, "Solaris Installation and Upgrades")


    This section discusses how the security policy can be implemented in the Solaris
    environment, and examines a number of security products that are available to
    assist the system manager in securing the systems under his control. The products
    include those shipped with the Solaris operating environment as well as unbundled
    security packages from Sun Microsystems and others that are available in the public
    domain.


    # System Security Policy


    When dealing with security issues in a network environment, it is the security
    policy that pulls everything together and identifies how the security of a network
    and the systems contained within is managed.


    Most companies implement a security policy, some on a per-system basis and others
    on a corporate basis. Larger organizations use a dedicated computer security section
    to manage the ensure security issue, taking a perspective from a much higher level.
    The policy is then implemented for each system that is installed and connected
    to the network—indeed, a condition of connecting to the corporate network is that
    compliance to the security policy is demonstrated and verified. The system manager
    must ensure that security issues are taken into account when implementing a new
    system. He serves as a regular liaison with the computer security section.


    The development of a good security policy, however, is not solely about protecting
    the systems at all costs. It needs to be a careful balance between the security
    itself and the restrictions that it imposes on running the business. The user
    community must be'
  merge: -1
  pgno: 128
- img_proc: true
  md: 'considered as part of the bigger picture, particularly the effect and inconvenience
    that the security measures have on them. Of course, the best security policy is
    to deny everything to everyone, but this is not a practical solution. The system
    manager (and the computer security section, if applicable) must take into account
    the needs of the business and the users to see if the proposed policy is more
    of a dictatorship than a preventive measure. After all, the users are carrying
    out the core functions, and they will often offer a valuable insight into what
    is practical and realistic and what is unwork. There is no use using a brilliant
    security policy if the company cannot function as a result.


    There are a number of important steps to take in the formation of a security policy;
    these are discussed briefly here:


    +   * Identify what needs to be protected—This includes but is not limited to
    hardware, software, data, and documentation.


    +   * Carry out a risk assessment—Each item identified in the previous section
    should be examined to see the associated risks and then be ranked by the level
    of severity attached.


    +   * Apply weightings—After assembling a list of resources that require protection,
    each item needs to have a weighting associated with it so that it can be prioritized
    to its importance. This, in turn, defines how much is spent on protecting the
    resource.


    +   * Keep the policy acceptable and realistic—Despite the risks and severity,
    the security policy needs to be workable and acceptable. There is no point in
    having a stringent security policy that stops the company from carrying out its
    business in the most effective manner. The cost-effectiveness of a security policy
    can be determined by the effect that it has on the operation of the business.


    +   * Establish a violation procedure—While trying to protect the resources, a
    security policy also has to consider what if the network or system is breached.
    The type of incident reporting, the level of auditing, and the escalation procedure
    for when to inform the authorities are all examples of things to be addressed.


    +   * Educate users—One of the best ways to protect the resources is through educating
    the users in matters relating to security. A formal training program coupled with
    regular bulletins keeps the user aware of security considerations. It also demonstrates
    to the users that the company takes security seriously.


    # Unauthorized User Warning


    Whenever a user logs in to a computer system, a statement should be displayed
    that says something like, "Only authorized users can use this system." Otherwise,
    you are providing an intruder with an escape route when prosecutions start—on
    the grounds that it never said he couldn''t or shouldn''t have access!'
