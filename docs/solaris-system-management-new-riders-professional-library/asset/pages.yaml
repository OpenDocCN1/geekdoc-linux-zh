- img_proc: true
  md: '# The Stages of Testing


    Testing is involved in several stages during the development of an application:


    +   * Unit testing—Modules are tested in isolation during the development process.


    +   * Integration testing—Modules are combined and tested together to ensure that
    they deliver the required functionality.


    +   * Coexistence testing—The application is tested alongside other applications
    to ensure that there is no interference or conflict. An example of this is modifying
    shared libraries as part of the new development.


    +   * System testing—The complete application is tested against the functional
    specification, which includes installation instructions, guidelines, and administration
    procedures, as well as the application itself.


    +   * User acceptance testing (UAT)—A selection of the user community tests the
    application in an operational sense. Users run the program in the way it was intended,
    and report any problems or issues.


    +   * Performance testing—Also known as load testing or stress testing, this provides
    the assurance that the application will continue to perform under busy conditions.
    This is becoming more important as Web-based applications are, with the prospect
    of many users executing the application concurrently.


    +   * Implementation—Larger applications may undergo a pilot implementation in
    the “live” environment so that comparisons and further checks can be made against
    results from the current method of operation.


    A further stage of testing that is occasionally omitted from the implementation
    plan is of end-to-end testing. This topic is discussed in the section “End-to-End
    Testing."


    It is quite rare, for a system manager to experience all of these types of testing
    for a single implementation, except when the delivery is large, expensive, and
    critical to the business. In this case, the high level of confidence might be
    required to significantly reduce any risks during the live cutter. The following
    list describes the benefit that the system manager might gain from each stage
    of testing:


    +   * Unit testing—Not much is gained because this type of testing is normally
    done entirely by the development section or the third party, if the project is
    being handled externally. For the latter, the test would provide proof that the
    development is progressing according to the schedule, and it may also be used
    as a payment point.


    +   * Integration testing—Again, the system manager gains no direct benefit because
    this testing is carried out within the development section. With unit testing,
    however, integration testing could be used as evidence of progress and as a project
    milestone.'
  merge: -1
  pgno: 79
- img_proc: true
  md: 'Coexistence testing—This is especially useful when components or modules from
    several suppliers are used (for example, using GUI applications or forms interacting
    with Web browsers). Coexistence testing ensures that there will be no compatibility
    issues and that the new addition will not cause any unforeseen problems with the
    existing infrastructure.


    System testing—The system manager will be responsible for installing the new application
    or system into the corporate IT infrastructure. He sees that the installation
    and configuration procedures proceed as expected. Also, the fault testing of system
    users helping him ensure that it conforms to the corporate disaster recovery plan
    and also to test a number of potential disaster scenarios. See Chapter 7, "Disaster
    Recovery and Contingency Management," for a fuller discussion of these topics.


    User acceptance testing (UAT)—The department that requested the functionality
    ultimately will be paying for, so user acceptance testing is primarily used in
    larger developments, particularly those involving external suppliers, for which
    cost is considerable. UAT is frequently used as a crucial element of a contract
    with an external supplier—that is, it determines whether the application is "acceptable"
    or "fit for purpose" to the user community that will be making use of the functionality.
    System manager''s role in UAT is usually a supporting one in that he will support
    the UAT environment on which the testing is being carried out. He will also install
    patches that result from problems raised during the execution of UAT.


    Performance testing—The system manager benefits from this type of testing because
    it identifies any components, such as servers or applications that might fail
    as a result of heavy use. Performance testing is also an aid to the system manager''s
    capacity planning strategy, with the results being available for justification
    for further expansion, if necessary.


    End-to-end testing—The system manager will be supporting the system or application
    when it goes into production, so he benefits from seeing the whole thing, including
    any interaction with other systems. This type of testing also provides excellent
    familiarization opportunities for him and his staff to gain a better understanding
    of how it fits in the running of the business.


    Pilot implementation—This involves the application or system "going live" for
    a specified set of users, with limited impact if problems are encountered. In
    addition, this testing provides the benefit of seeing how the application or system
    performs in the real world. A further benefit of this is that comparisons can
    still be made with an existing system that is probably still running in parallel.
    The system manager can identify performative or administrative issues before they
    cause an impact in the final transition to operational status.'
  merge: -1
  pgno: 80
- img_proc: true
  md: 'The numerous stages of testing that are possible for a system or application
    give some idea of the complexities that can be involved. They also highlight how
    important it is to carry out through testing and to determine the benefits that
    can be gained from doing so. The fact that many companies either cut testing or
    omit it demonstrates the risks that they are leaving themselves exposed to. In
    these days of competitive Internet trading, a crashing application could prove
    to be far more costly, in terms of lost revenue, than it would have been if the
    testing had been fully filled.


    # Compatibility Testing


    Compatibility testing covers several aspects of the testing phase, but generally
    the purpose is to ensure that modules, or components of an application, work together
    and with other applications on the system.


    Integration and coexistence testing have deliberately been separated here to show
    the difference between modules of a program working together (described here as
    integration testing) and the integration of the application into the existing
    environment, the coexistence element.


    A further aspect that fits somewhere between integration and coexistence testing
    is that of an application in which modules or products are supplied by several
    vendors. Despite states of conformity to standards, there can often be problems
    when a number of different modules are used together, so testing should be carried
    out under these conditions.


    # Unit Testing


    Unit testing is the first testing phase that is carried out as part of a development
    project. A programmer, for example, has written a function. It needs to be tested
    in isolation, with the objective to ensure that it does exactly what it is meant
    to be, based on the specification that was provided. Here, the programmer can
    test his own code to ensure there are no bugs.


    Consider, as an example, the requirement to produce an ad-hoc backup facility
    for the Solaris servers. One function could be to check that a backup tape is
    present in the drive and rewind it. The unit testing would involve this function
    only.


    # Importance of Testing


    The emphasis on testing is normally related to applications that have been written
    either in-house or by a third-party supplier. It is important to note, however,
    that even off-the-shelf products require testing to be carried out, particularly
    coexistence testing and performance testing. These are important to verify that
    the product will not cause any adverse effect on the rest of the system and that
    the system is capable of handling the expected demand for concurrent usage.'
  merge: -1
  pgno: 81
- img_proc: true
  md: '# Acceptance Testing


    # Integration Testing


    Integration testing during the development of an application is carried out in
    a similar way to unit testing, but it involves a number of modules that interact
    with each other. Taking the previous example, the integration test would comprise
    the entire backup program, complete with functions and subroutines. The theory
    behind integration is that it tests the interaction between different units to
    ensure that they function as expected and as specified in the requirement.


    # Coexistence Testing


    Coexistence testing is a necessary part of the overall testing strategy. It confirms
    that the new component works in harmony with the existing system, whether hardware
    or software. In the case of hardware, it could be the addition of a tape drive
    requiring a patch to be added, a patch that conflicts with another patch already
    installed on the live system.


    In case of an application, the installation procedure could, modify library modules
    that subsequently cause other applications to stop working. Coexistence testing
    identifies these potential problems, which might otherwise go unnoticed, causing
    severe, unexpected problems when installed in the live environment.


    # Acceptance Testing


    Acceptance testing is the final phase of testing before going live. It is a crucial
    process and eventually will determine whether a product is acceptable to the business.


    When a product is deemed to be acceptable, it progresses through implementation
    and becomes operational, but what happens if either the user acceptance or the
    system acceptance fails?


    During acceptance testing, problem logs are created when a bug is found or the
    application responds in an unexpected manner. The logs are passed to the developer(s)
    for resolution. An example of a problem log is shown in Figure 4.1. The tester
    often provides additional information by attaching a screen dump showing clearly
    the point at which the error occurs. Sometimes the resolution is procedural and
    may require only a trivial update to the documentation, but on other occasions,
    a fix may have to be supplied. For the latter, a patch is issued and installed
    on the system. However, it''s not simple because the fix could invalidate all
    the testing already done.'
  merge: -1
  pgno: 82
