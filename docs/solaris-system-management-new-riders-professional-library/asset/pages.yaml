  md: '# End-to-End Testing 69


    +   UAT enables the user community to see the application running in its final
    state. This is an ideal opportunity to build user confidence in the product. This
    is especially vital if the application is new. People are naturally hostile to
    change, so the UAT provides the chance to gain familiarity and see the benefits
    that the new product will offer. Conversely, a badly designed application or a
    poorly performing system can destroy user confidence. If this happens, it will
    be extremely hard to get it accepted.


    +   UAT will prove whether the user documentation is accurate and usable.


    +   The users test the user interface as well as the application itself. This
    is particularly useful for GUI-based applications, in which color schemes and
    screen layouts are scrutinized.


    +   Test cases are often executed by more than one person. The result should be
    produced each time.


    # Performance Testing


    The other areas of testing discussed so far verify, as much as possible, the application
    functions as expected. Performance testing looks at a further aspect that is sometimes
    obvious: the testing of the application when under load, or busy conditions. Performance
    testing has become even more important since businesses started using the Internet,
    particularly with reference to Web servers. There might be a point where the application,
    or the server, crashes if too many people try to use it at the same time, so the
    performance capability must be tested so that the anticipated demand can predict
    the level of demand that a new Web site will generate—companies are often victims
    of their own success. For example, when an advertising campaign has much greater
    success than predicted, the increase in demand can be more than the system can
    handle.


    Producing test conditions and data for performance testing is a time-consuming
    and expensive business, requiring a great deal of coordination. It involves creating
    large amounts of test data, as well as having the relevant technical staff in
    attendance to accurately monitor the performance as the testing is carried out.
    From the system manager''s point of view, however, the testing can be of great
    benefit because it provide firm justification for upgrading a server that was
    proved to be inadequate, or the purchase of a new, more powerful machine.


    # End-to-End Testing


    The concept of end-to-end testing is that the business function is tested, not
    merely the application that has been developed. An example of this is a complete
    sales transaction. In this case, the end-to-end test would involve the following
    steps:


    +   1. Creating the sales record


    +   2. Processing the order, from producing the invoice to dispatching the order'
