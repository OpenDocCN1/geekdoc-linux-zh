  md: '# 218 Chapter 10 Working with PCs


    # Terminal Emulation


    Terminal emulation software products do not provide any integrated functionality.
    Instead, they provide connectivity to a Solaris system using a Telnet client.
    They are configurable that they can emulate different types of terminals, such
    as VT100, VT320, and so on. The user can also customize the keyboard mappings,
    which can be useful for bespoke applications.


    Several companies produce terminal emulation software, such as WRQ and Reflection,
    Atachmate EXTA! TN, and Netmanage with Rumba. A further Telnet client is Tera
    Term, which is freely available in the public domain. It can be downloaded via
    http://www.tucows.com, for example, the appropriate platform can be selected.
    This client also has an extension module, TTSH. When added to the Tera Term installation,
    TTSH interacts with the secure shell daemon running on the Solaris host, providing
    secure access without losing any of the Tera Term functionality. The TTSH module
    supports only SSHv1. The Tera Term source is freely available, as is the source
    for the TTSH extension.


    # StarOffice


    Sun Microsystems has produced an integrated suite of office software that is beginning
    to rival the major providers, Microsoft and Core. What''s more, it''s free.


    The software is already available for Solaris, OS/2, Linux, and the Windows platforms.
    Figure 10.5 shows the initial screen when StarOffice is started in the Solaris
    CDE environment.


    ![](img/20459f772e7361286cec3e76e3bd26b4_235_0.png)


    Figure 10.5 The StarOffice desktop provides easy access to all the office productivity
    facilities.'
  merge: -1
  pgno: 235
- img_proc: true
  md: 'StarOffice delivers a special feature that Microsoft Office and Corel WordPerfect
    Office 2000 doesn''t: real Windows/UNIX cross-platform compatibility.


    Multiplat-nform enterprises can benefit from using StarOffice because it uses
    a platform-independent file format. This means, for example, documents created
    on a Linux platform can be transferred accurately to the Solaris or Windows version
    without modification or conversion. A number of larger educational establishments
    are now standardizing on the StarOffice suite—not just because it is free from
    licensing restrictions and doesn''t cost anything, but because it works and is
    compatible with the major vendors'' offerings.


    StarOffice has a Star bar that closely resembles the Windows Start bar. Figure
    1.6 shows the menu.


    # Loading Star Office


    The only downside to StarOffice noted has the time it takes to start up: about
    10 seconds, average. Because the software is so tightly integrated that the startup
    loads about 10–12 applications. Sun is seriously considering unbundling the major
    applications so that the package will behave more like Microsoft Office, with
    only the relevant application loaded. This will definitely improve its performance
