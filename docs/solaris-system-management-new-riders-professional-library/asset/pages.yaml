  md: '# Service Level Management


    # The Benefit


    There are three main beneficiaries of a service level agreement:


    +   - The system manager—With an SLA, the system manager can gain accurate insight
    into how well (or not) he is achieving his objectives. The data that he collates
    as part of his responsibility to the agreement can also be used as justification
    for further expenditure on the systems, especially if the data reveals that the
    systems are underperforming in certain areas.

    - The system manager also benefits because user departments are much likely to
    involve the IT department in the early design decisions of systems. With the users
    aware of the costs associated with a system, and its subsequent support, there
    is likely to be greater focus on longer-term (the complete life cycle) issues.
    This results in overall savings for the company as a result of strategic planning.

    - The end user—The users benefit from SLAs because the IT department is forced
    to account more accurately for the services being provided. The costs must be
    based precisely on the performance being achieved, the user perceives that he
    is receiving better value for his money.


    A side effect of the SLA is that the applications used by the community are prioritized
    according to their importance to the business. The creation of the SLA forces
    the focus to be placed on applications demanding the highest level of service,
    as well as identifying those that can operate with a reduced level of service.
    With the user department being charged for the services provided, there is a more
    concentrated focus on what is being asked for. The user is less likely to ask
    for more than is absolutely necessary because of the costs that would be incurred.


    +   - Senior management—The senior manager reaps huge benefits from the SLA now
    has a set of clearly defined metrics from which he can manage the IT department
    based on performance. It is easier for him to quantify the contribution made to
    the business by the IT department and hence, to identify priorities when allocating
    funds for additional resources or equipment. The presence of SLAs helps the senior
    manager when attempting to compare the cost of carrying out a service within the
    company against that of outsourcing to an external supplier.


    Of course, the business benefits from the existence of SLAs in that it runs more
    efficiently and also has the supporting data to provide justification for greater
    investment. This kind of information can prove valuable, for example, when attempting
    to convince shareholders or investors of the need for investment in technology.'
  merge: -1
