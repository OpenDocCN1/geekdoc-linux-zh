  md: '# fold


    The fold command imposes a line length for a file, which is specified by the user
    and, rather than truncating, folds the data onto subsequent lines. This command
    is particularly useful when a data file is to be printed but has a greater line
    length than the printer. For example, the system manager might have a data file
    from a process that needs to be printed that has 15 columns per line. The printer
    outputs A4 paper in portrait format and can print only 80 columns per line. In
    this instance, the printer normally truncate each line to 80 characters and would
    discard the remaining columns. Using fold, however, retains the extra 75 characters
    of data and “folds” them onto the next line, thereby printing the entire file
    and also keeping the data in a contiguous format.


    As shown in Figure 9.3, the window displays only the portion of the line that
    is currently visible. The scrollbar at the bottom of the window would have to
    be view the remainder of the line. If this document were printed on an 80-column
    printer, then this is all that would appear; any extra columns would be lost.


