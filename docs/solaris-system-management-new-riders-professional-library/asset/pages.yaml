  md: '# Patches 107


    # # Unbundled and Third-Party Application Patches


    Patches supplied by Sun Microsystems for unbundled and application products are
    normally supplied in the same format as the operating system patches. They should
    be subjected to the same treatment as outlined in the previous section.


    Patches from third-party suppliers, however, can be slightly different. They may
    or not be supplied in the package-type format. Decisions on whether to install
    these patches need to be given particular attention because there might not be
    enough information provided on potential conflicts with either other patches or
    other applications.


    A patch from a third-party software supplier should be subjected to the following
    procedures:


    +   - It should be installed only if the supplier or Sun Microsystems states that
    it is necessary.

    - Any patch should be treated with caution and thoroughly checked for viruses.

    - Look for any supporting documentation provided by the supplier for an indication
    that it has been thoroughly tested.

    - Confirm that the patch is for the correct version of the Solaris operating environment.

    - Always install the patch in a test environment and carry out rigorous testing;
    also reproduce some of the tests that may be documented (if any).The test environment
    should mirror the production environment, as closely as possible, including any
    other third-party and unbundled software applications.

    - Read all of the installation instructions that accompany the patch carefully,
    particularly where they may involve altering kernel parameters or installing other
    patches.

    - If in doubt, always contact Sun for confirmation.


    Failure to carry out these procedures could seriously jeopardize the integrity
    of the system and pollute the network. Of course, it is the system manager''s
    responsibility to ensure that these duties are carried out and that the company
    is not exposed to any unnecessary risk.


    Third-party Suppliers

    The term party refers to any software supplier that is not part of Sun Microsystems.
    It should be noted that this includes software from a licensed software house
    as well as that available in the public domain.'
