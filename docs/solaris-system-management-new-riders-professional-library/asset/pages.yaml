    well as CPU utilization), although its main use is to monitor disk performance.
    It can be used to identify a badly balanced disk configuration, and it provides
    sufficient options to examine the performance of a single disk partition. Listing
    9.5 displays the iostat command with extended statistics for each disk volume.'
