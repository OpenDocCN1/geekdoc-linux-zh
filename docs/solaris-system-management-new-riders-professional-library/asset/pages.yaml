  md: '# Final Testing Before Implementation


    Consider an application that runs on a PC—say, a Microsoft Access database. Data
    is input and processed locally and is sent to a remote database on a Solaris platform
    to be used by other sections. The local application generates the necessary SQL
    code to query or update the records in a table on the remote system. This is known
    as a pass-through query or a pass-through update. If the code generated is not
    absolutely correct, the remote database is in danger of being corrupted, despite
    the local application passing all of its testing.


    In this example, the test environment must include a clone of the remote database,
    as well as the local application and all the associated hardware and software.
    The significance of the end-to-end test in this instance is that testing encompasses
    the remote database—which might not even be part of the system under test—to ensure
    that the data has been inserted or updated correctly.


    # Final Testing Before Implementation


    This testing phase involves the installation of the system or application in its
    live configuration. For all intents and purposes, the system is live, but with
    some differences: It is still under the control of the development project, and
    a parallel element will be running. The system or application being replaced might
    continue until the final operating capability is cleared. At that point, the new
    system is truly live.


    The final testing phase is often of critical importance because it is the first
    time that the users get to see the system or application running in the live environment.
    At this stage unexpected problems are most likely to occur, normally because of
    something on the operational network that has been overlooked or not considered
    to be of any consequence. The initial operating capability provides additional
    time for these problems to be rectified.


    # Initial Operating Capability


    When the system and user acceptance testing has been successfully completed, the
    system or application can be declared to be in initial operating capability (IOC).
    This is a state of readiness for full operational status. The system or application
    is installed, and the users start to conduct their normal business using the new
    product.


    The IOC phase allows the system to run normally, but with the advantage of being
    monitored by technical staff. Any changes or modifications that are required at
    this stage must be subject to configuration management and must be delivered as
    patches, with accompanying documentation. Some initial tuning may be required
    to enhance performance. This will result in the documentation amended and redelivered
    as a new version. At this stage, the system that is replaced will still be running,
    and the two might be compared as a final check to ensure that the functionality
    of the new system is correct.'
  merge: -1
  pgno: 88
- img_proc: true
  md: '# Final Operating Capability


    When a new product has completed IOC, its status changes to final operating capability-(FOC).
    This is the point at which the system or application is said to be truly live.


    There be no changes to the system without using the formal change mechanism. The
    source code for any applications should be under configuration control, as well
    as all the supporting documentation. At this point the formal responsibility transfers
    to the system manager or staff members in charge of support and maintenance. Any
    changes to the software will be delivered in the form of a patch and will be subject
    to formal authorization procedures, the same as other live systems.


    The system or application that was being replaced can now be disabled or switched
    off.


    # Summary


    Testing is a discipline that requires a high level of skill to ensure that all
    areas of a system or application are thoroughly examined and exercised. It is
    also an aspect of system development that is frequently overlooked or shortened
    because of budgetary constraints.


    The Y2K issue highlighted the need for thorough testing, and because of the immovable
    deadline, forced businesses to identify and prioritize their requirements. The
    result of carrying out a detailed inventory meant that many companies ended up
    in better shape, with a more streamlined and efficient way of working.


    The system manager benefits from a number of testing phases throughout the development
    and implementation of a new system or application, most notably system testing
    and performance testing, because of the justification that he can provide for
    requesting additional funding for the system.


    Coexistence testing and performance testing are important because they verify
    that the system or application will work with other products, and that it fits
    in the existing infrastructure, and also that it can satisfy the predicted requirement
    for concurrent usage, allowing for predicted peaks of demand.


    Acceptance testing is often used in larger installations, particularly when a
    thirdparty supplier is involved and the cost is much higher. The "user community"
    gets to test the functionality against the original specification, using it as
    it will be used in the operational environment. The application or system will
    not be signed off or for full unless the user acceptance-testing phase completes
    successfully.


    The importance of end-to-end testing is fundamental to any new application or
    system, often incorporating several existing systems and processes. It is an essential
    means of building customer confidence in the new implementation.


    The final testing phase before implementation allows the system or application
    to be seen in its live environment, but without the risks or impact of full operational
    running. When carried out in two stages, minor performance issues can be resolved
    by the system manager before the full implementation takes place.'
  merge: -1
