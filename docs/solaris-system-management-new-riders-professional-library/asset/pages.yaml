  md: '# 24×7 Operations


    # Configuration of the Environment


    The configuration of the 24×7 environment is normally determined by two major
    factors—namely, the level of criticality attached to the requirement, and money,
    although not always in that order of priority!


    First, the critical nature of some services dictates that the 24×7 environment
    is to be established—that is, the level of replication required, whether to use
    a single site or to utilize remote sites for resilience, and so on. The business
    needs to recognize the importance of the application and the effect of not being
    able to carry it out—this is often the deciding factor. True 24×7 computing environment
    cannot be achieved using a single system because it creates a single point of
    failure; there must be at least two systems, and realistically, they have to be
    at separate sites. This is because a major disaster, such as fire or flood, could
    still bring the operation to an abrupt halt if all the systems were housed in
    the same location.


    Sun Cluster software addresses exactly this type of scenario by allowing a number
    of computer systems to be “clustered” so that they provide the overall service
    to the cluster. This provides the required availability because, if one computer
    fails, the others in the cluster pick up the work that was being carried out automatically.
    This also allows elements of the cluster to be separated by up to 10 kilometers,
    delivering a high level of contingency against disaster.


    A further interesting aspect of this software is that it supports the SunEdge
    disk configurations, allowing all of the critical data to be housed independently
    of any one system, adding to the resilience. A SAN is a dedicated network of storage
    devices, normally with its own server, that is part of the overall computer network
    but independent of any of the systems that make use of its resource. This means
    that if any of the clustered systems mentioned previously were to fail, the data
    would still be available to the remaining members of the cluster.


    The cluster solution is fully scalable, which means that all the systems comprising
    the cluster do not have to be the same. For example, a four-system cluster could
    include an Enterprise 10000 server, two Enterprise 5000 machines, and one Enterprise
    3000 server. This enables companies to still make use of previous-generation systems,
    which can be highly cost-effective when attempting to finance the operation. Clustering
    solutions are discussed again in Chapter 7, “Disaster Recovery and Contingency
    Management,” as part of disaster recovery. Figure 5.1 shows a simple diagram of
    a possible clustered environment.'
  merge: -1
