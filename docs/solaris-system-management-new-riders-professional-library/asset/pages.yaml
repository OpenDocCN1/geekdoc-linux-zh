  md: '# The Solaris Operating Environment


    ![](img/20459f772e7361286cec3e76e3bd26b4_22_0.png)


    Figure 1.1 The CDE desktop, as it appears the first time it is run.


    This list details the core release of Solaris 7, the operating system itself,
    a choice of two windowing environments with associated desktop tools, and a set
    of online documentation. This constitutes what is known as the “Desktop Edition”
    for users just wanting to run the Solaris operating environment on the workstation.
    The Server Edition of Solaris 7 includes additional software such as Solstice
    Adminsuit, Disk,, Backup and AutoClient. These extra software packages allow server
    administration and management duties to be performed, something that would normally
    be required for a desktop user. If the extra functionality is required, then the
    server version of the operating environment must be purchased.


    Solaris 8, on the other hand, has begun shipping more software with the distribution,
    such as Oracle 8i, a full enterprise version and a selection of iplanet software.
    It also includes a CD containing freeware, as gcc—a freeware C compiler—among
    others.


    > Warning

    The Oracle software, (and some others), is distributed as a noncommercial offering—that
    is, it cannot be deployed in a production environment. It is provided for evaluation
    and demonstration purposes. System managers should be aware of this distinction
    before allowing it to be installed.'
