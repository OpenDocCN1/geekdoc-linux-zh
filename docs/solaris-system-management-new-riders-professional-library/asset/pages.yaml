  md: '# Big Brother''s Watching 175


    # Using acctcom


    The acctcom command is used to display a summary of process accounting records.

    The command displays information only about processes that have already terminated.

    The ps or whoami commands can be used to obtain information about current processes.


    For example, to obtain a detailed listing of commands that have been executed
    today by user jephic, the program acctcom is used. By default, it reads the current
