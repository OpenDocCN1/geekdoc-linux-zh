  md: '# The Roles of the System Manager


    Most, if not all, businesses today make use of computer systems in one way or
    another. It might be a very small business with only one personal computer, or
    a large multinational corporation with huge, complex, networked systems—the principles
    are the same. They rely, to a varying degree, on computers for their business
    to function efficiently and effectively.


    The increasing reliance placed on computer systems underlines the need for them
    to be managed properly. In a small business, there probably isn''t a system manager
    as such; rather, a member of the company takes on the role as part of his job.
    In the larger enterprises, it is a full-time role in itself, with the system manager
    having responsibility for some or all of the following:


    +   * Computer systems

    * System administrators

    * Database administrators

    * Network administrators

    * Technical support department


    But that is just the direct, tangible side of system management. There is also
    another side to this: how the provision of these computing services fits in with
    the objectives of the business as whole. The budget for the IT department is often
    quite considerable. This must be managed properly to ensure that the business
    gets value for money from the services that it is paying for.


    A large proportion of system management is strategic, as in planning for the future
    of the computer systems. This is particularly relevant with regard to the Internet
    and the rapid emergence of e-commerce. System security policies are constantly
    in need of review to ensure they continue to protect both the computer systems
    and the data held on them. The formulation of other important policies, such as
    these, comes under system management:


    +   * The disaster recovery scenario

    * A sensible and realistic backup schedule

    * Hardware and software upgrade policies

    * Plan for future capacity on the corporate computer network


    These are just a few of the issues surrounding system management, but they should
    give an insight into some of the challenges facing today''s system manager. On
    top of all this, tactical matters must also be handled. These include “fire fighting”
    specific problems and managing the day-to-day running of the IT department. Remember
    that system management is not just about computer systems. It is about managing
    resources, and that includes the staff that the system manager is responsible
    for.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# The Roles of the System Manager


    The system manager is also a communicator who needs to be able to relate to the
    customers. At this point, it is worth defining the term customer as seen from
    the system manager’s perspective. This is crucial, as you will see in the discussion
    of service level management in Chapter 3, “Delivering the Goods.” The customer
    is anyone who makes use of the computer systems under the manager’s control. This
    is pretty vague, but it emphasizes the fact that the customer base is potentially
    large and diverse. The system manager’s customers are usually colleagues within
    the company. Even for a mail-order company taking orders over the Internet, for
    example, the public is not the customer; the Web sales team is the interface between
    the system manager and the public, and hence, the customer. Figure 1.2 illustrates
    the relationships between the system manager and the customer base.


    ![](img/20459f772e7361286cec3e76e3bd26b4_24_0.png)


    Figure 1.2 The system manager serves his direct customers, which, in turn, allows
    them to serve the external customers.


    The remainder of this section describes in greater detail the roles that the system
    manager must assume to be able to carry out his duties. If Shakespeare was right
    in saying, “All the world’s a stage, and all the men and women merely players,”
    then the position of system manager is a one-man play. As you will see, the job
    is much more demanding and diverse than you may initially perceive it to be, requiring
    the playing of many roles with quick scene changes.'
  merge: -1
