  md: '# Strategic Planning and Techniques 123


    # Unbundled Products


    The security products listed in the next sections are available from Sun Microsystems
    but are not part of the Solaris operating environment distribution. They must
    be purchased as separate products and installed as packages. The list is not exhaustive,
    but is intended to give you good insight into the products and facilities that
    can be implemented if a company requires additional security functionality to
    that provided by the standard Solaris release.


    # Trusted Solaris


    This is a security-enhanced implementation of the Solaris operating environment
    that provides a fully configurable security policy that is incorporated within
    the software. Trusted Solaris extends the security that is normally provided with
    UNIX, such as sensitivity labels. These determine a level of security that a user
    possesses when logging in the system and, in turn, can restrict the access available
    to the user.


    Trusted Solaris also limits the use of the root user in traditional UNIX systems.
    Instead, there are other user accounts, such as secadmin, the security administrator,
    and admin, the system administrator, who sets up, for example, nonsecurity-related
    portions of user accounts.


    Further information on Trusted Solaris can be found on Sun''s Web site or gained
    from your sales department.


    # Sunscreen Secure Net


    Solstice Sunscreen is a package that provides the combined functionality of a
    firewall with network-level authentication, also known as Simple Key management
    for IP (SKIP).


    Sunscreen consists of two main components, a screen and an administration station.
    The screen component carries out firewall functionality, screening packets and
    performing the necessary encryption and decryption, while the administration component
    is carried out by the administration station, based on configured security policies.


    Sunscreen employs a stealth architecture that allows companies to effectively
    set up a private secure network across a public network, such as the Internet.
    The stealth aspect of this project relates to the fact that the screen can be
    configured so it cannot be accessed using an IP address. Therefore, it can pass
    packets across the network without recording any indication that it ever existed
    because there is no IP address. Because, a potential intruder cannot access the
    machine running Sunscreen, which makes it very difficult for it to be attacked.
    For internal network connections, the stealth mode need not be used, a second
    mode, routing, is also available, which is much faster and would normally be used
    to segment the network internally within the company. The stealth mode screen
    would be used for the external perimeter—that is, the point where communications
    meet the outside world, the Internet.


    Figure 6.3 displays a company network employing the use of Sunscreen Secure Net.'
