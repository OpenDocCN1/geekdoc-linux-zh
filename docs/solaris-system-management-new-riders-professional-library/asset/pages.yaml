  md: 'Two major considerations must be addressed for operating system servers: their
    physical position on the network and the organization of the disk partitions.
    Both are these are addressed next:


    +   - Position on the network—An operating system server should be physically
    positioned on the same subnet as the clients to reduce unnecessary network traffic
    affecting the performance of other systems on the corporate network. Ideally,
    the subnet should be connected to a router or a bridge so that broadcast messages
    are filtered out and are not passed through the rest of the network. Consider
    the server supporting 50 diskless clients, all of which send broadcast messages
    to boot up and get their system resources (/ /usr, and swap) across the network.
    Figure 5.2 depicts the network configuration for the five servers required to
    support the 250 clients specified in the scenario earlier in the chapter.


