  md: '# Chapter 3 Delivering the Goods


    The system manager needs SLAs so that the services he is providing can be well
    documented and understood. During negotiations, the level of service that can
    reason-ably become apparent. Unrealistic expectations on behalf of the consumer
    are also highlighted at this stage, and the system manager can work at getting
    these reduced to a more reasonable level. This focuses on what can actually be
    done, something may not have been addressed before. Previously, a lot of the work
    may have been "firefighting" sorting out problems as they arise. Here, there is
    an opportunity to analyze the service in its entirety and to anticipate the potential
    problems, pitfalls, or network bottlenecks that could cause concern in the future.


    A final reason for the system manager to favor the use of SLAs is that it could
    provide the necessary justification for further expenditure on improvements. The
    negotiation process and the monitoring of the performance should raise the profile
    of problematic areas. Using the SLA results, for example, the system manager could
    not only specify what is needed to improve the service, but also provide the projected
    improvement in efficiency and throughput that is likely. He will be able to identify
    this improvement if there is something already available to compare it with. This
    will exist in the agreement, as discussed earlier.


    # Unrealistic Expectations


    Unrealistic expectations usually arise because the consumer is not fully aware
    of what is actually achievable. The following are a couple of examples:


    +   100% availability of the application—This is impossible to guarantee. Even
    with significant investment, there is still no guarantee. The best possible availability
    can be calculated only in conjunction with other SLAs (probably with third-party
    suppliers). The question of availability may not even be negotiable with the consumers
    because of agreements active with third-party organizations.


    +   Problem calls respond within 30 minutes—These calls would be passed on the
    help desk system, which is usually also subjected to an SLA. The system manager
    cannot possibly respond before the call has been passed to his department (by
    the help desk). The compromise would be to agree on a response time based on the
    help desk SLA, coupled with a priority mechanism based on the severity of the
    situation. The priority attached to various types of problems is defined in the
    scope and terms of the agreement (see later in this chapter in the section "Creating
    SLA").'
