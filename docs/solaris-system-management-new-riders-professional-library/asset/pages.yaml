    # Kerberos


    Kerberos is a network authentication system that allows entities communicating
    over networks to also prevents eavesdropping by potential intruders because the
    communications are encrypted.


    Kerberos works by providing users or services (as principals) with tickets that
    are used to identify themselves to other principals. It also provides secret cryptographic
    keys for secure communication with other principals.'
