    If the system does not have a separate /var file system, there is a risk that
    the (root/) file system will fill capacity.


    # Secure Network File System (NFS)


    Sharing file systems across the network is potentially dangerous, particularly
    when shared globally with no restrictions. Solaris provides a mechanism for enhanced
    authentication of users when trying to mount file systems across the network using
    NFS. An option to the share command is, sec=mode. Currently, Solaris supports
    for three modes (the mode is not supported for NFS mounts): sys, dh, and krb4.
    Each is briefly discussed here:


    +   - sys—This is the default authentication method used by Solaris. It uses AUTH_SYS
    authentication, where the user ID and group ID are checked by the NFS server before
    allowing the mount to proceed.

    - dh—This is the Diffie-Hellman public key encryption system. This is a standard
    public key system that creates a secret key between two hosts.

    - krb4—This method uses the Kerberos version 4 system for encryption and is freely
    available from the Massachusetts Institute of Technology (MIT). It is also available
    as a product from several different vendors. Kerberos is described later in this
    chapter in the section "Products Available in the Public Domain"'
