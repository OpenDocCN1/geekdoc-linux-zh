  md: "# 204 Chapter 9 Tactical Management\n\nAn extremely useful feature of tail\
    \ is the -f flag, which shows any lines that are subsequently added to the end\
    \ of a file. This is particularly useful when monitoring a process that is writing\
    \ to a log file because all entries will be displayed on the screen as they are\
    \ written to the log file.\n\n# od (Octal Dump)\n\nThe od command has value for\
    \ the system manager (and administrators) because it can be used to display nonprintable\
    \ characters. This is especially useful when filenames contain such characters\
    \ and cannot be easily deleted. Consider the following example, in which the file\
    \ consists only of five <tab> od with the -c switch displays the characters clearly\
    \ so that the file can be deleted. Listing 9.10 shows the five tabs being identified\
    \ and subsequently deleted.\n\nListing 9.10 An Annotated Screen Session Using\
    \ the od Command\n\n```\n# ls                                     <<< Here's the\
    \ file, but it contains\nnonprintable characters\n# ls | od -c\n00000000  t |\
    \ t | t | t | n<<< od has identified the characters\n00000006\n# rm /        \
    \                         <<< The file can now be\nexplicitly deleted        \
    \            /\n# ls\n                               <<< All gone\n```\n\nFilenames\
    \ such as those are normally a result of some typing error and cause minor inconvenience,\
    \ but a file of this kind might have been left by an unauthorized guest—it is\
    \ not obviously detected and would not be automatically deleted by routine housekeeping\
    \ processes.\n\nSome companies have a policy to alias the rm command to include\
    \ the -f flag so that a prompt is always issued before a file is deleted. This\
    \ method can also be used to delete files containing nonprintable characters.\n\
    \nA further way of removing unwanted or invalid characters is to use the tr command\
    \ to translate these characters into something that is readable. This command\
    \ is popularly used to force user responses into upper case, for example.\n\n\
    # Summary\n\nThe tactical aspect of the system manager's responsibility involves\
