  md: '# Application Information


    In addition to the system configuration information, there is a requirement to
    document the application software installed on a specific system or group of systems.
    This information is of value because it is frequently the only record that describes
    what is installed on the whole system. Of course, each application should have
    its own documentation but this the whole system, which might run several applications.
    The information contained within the documentation is useful in a number of situations,
    such as considering disaster recovery initiatives, capacity planning for future
    upgrades, or determining the number of licenses for renewal purposes.


    Usually, this type of documentation is split into two categories: applications
    that are developed and maintained within the company (known as in-house software)
    and applications that are purchased from a third-party supplier—that is, commercial
    software or outsourced developments. The categories are discussed separately in
    the following two subsections.


    # In-House Applications


    For application software that is developed and maintained within the company,
    the following information should be recorded about each application:


    +   - The name of the application and a basic description of its components and
    function within the business—for example: “This is an Oracle forms/reports-based
    application that queries and updates the main customer database.”

    - Any software dependencies that exist for the application—for example, the assumption
    that the Oracle Developer runtime product is already installed so that forms and
    reports can be run.

    - The users of the application—for example, sales, accounts, marketing. An indication
    of how many users actually make use of the application should also be included.

    - The current version of the software that is installed.

    - The installed location of the software on the system and the amount of disk
    space required. Include the location of any installation media and documentation.

    - Contact details of the development section and, if different, the application
    support authority.'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# Documenting the Systems 167


    # Third-Party Applications


    Third-party application software is usually subject to a formal maintenance and
    support agreement with the supplier of the software. The following information
    should be present for each application listed:


    +   - The name of the application package and details of the vendor and supplier
    (if they are different).

    - A brief description of what the package does, as well as what department(s)
    make use of it.

    - The version number of the software installed on the system, along with also
    details of any patches that the supplier has delivered (and are installed).

    - Details of any existing software and maintenance agreement for the software,
    including the level of support, the renewal date, the number of licenses purchased,
    and how to contact the support authority, together with any account numbers/serial
    numbers that might be necessary to obtain support.

    - The installed location of the software on the system and the amount of disk
    space required. Also include location of the installation media and supporting
    documentation.


    # Relational Database Information


    Relational database management systems (RDBMS) warrant their own section in the
    system documentation because of their importance to the business. They frequently
    hold business-critical information such as customer data, sales or marketing information,
    and personnel data. For this reason alone, each database that resides on the system
    should be clearly identified and documented.


    A further reason for documenting separately the existence of a database on the
    system is that it might be maintained by the “database administration (DBA) section,”
    a section that is often separate from the system administrators and one that might
    administer a number of different databases on different systems. Ideally the two
    sections should be co-located, but this is not always the case. If the DBA section
    maintains its own documentation for the database, the central system documentation
    will be incomplete, and multiple sources will be needed to get the complete picture—that’s
    a far from ideal situation. A better solution could ensure that the DBA section
    maintains this part of the document so that the entire system documentation remains
    in a single reference document.'
  merge: -1
  pgno: 184
- img_proc: true
  md: 'The information contained within the document needs to include the following
    details:


    +   * The RDBMS product and version installed on the system, together with any
    patches that have been subsequently applied to the product

    * Details of support and maintenance agreements, including contact numbers for
    the DBA section as well as the supplier (such as Oracle), and any account numbers/serial
    numbers that might be required to obtain support in the absence of a DBA

    * A brief description of the database instance and its function within the company

    * The location of the installation media and supporting documentation

    * Information about the size of the database and location on the system of its
    components, such as tablespaces, redo logs, archive logs, and so on


    # Beware of Raw Disk Usage


    If not all, RDBMS products allow the storage of the database either in a file
    system, with any other file, or with raw disk (bypassing the UNIX I/O buffering).
    The advantage of using raw disk is that there is a performance gain direct communication
    with the disk. The downside is that it requires a greater administration overhead,
    and it is not visible to the unfamiliar person, unlike the presence of a file
    system, for example.


    Raw disk partitions that used as part of a relational database are not mounted
    like file systems. They are only defined in the database configuration file, usually
    by a symbolic link to the raw disk device in question. Volume management software,
    such as supplied by Veritas, is often used to manage the disk allocation on systems
    configured for use with relational databases. A good idea is to store a list of
    managed volumes and mirrors on a regular basis using the command vxprint, for
    example which is part of the Veritas volume management software.


    If the raw disk option is used, it must be clearly identified, as the following
    example demonstrates.


    Suppose that a system administrator is hired who has not previously used a relational
    database environment. If he is requested to create a new file system, he might
    look at the format command to see the disks available to him and then he might
    use the prvtoct command to see how a disk is partitioned and to see any mount
    points associated with the partitions. After checking the file /etc/vstab to check
    for any file systems not mounted, the system administrator could assume that a
    partition is not referenced is actually free for use, when in reality it is being
    used by the database—the problem is that it isn''t documented clearly. If this
    system administrator runs the newwfs command on the partition to create the file
    system, the previous contents would be lost and the database would be trashed.'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# Documenting the Systems 169


    The impact of this scenario, although avoidable, is potentially severe:


    +   - The database will have to be recovered, and there is the potential for loss
    of business.

    - The cause of the problem will not be immediately clear, creating a delay when
    it is investigated.

    - The system administrator won''t come clean because he is not aware of having
    done anything!


    # Show Database Instances and Their Purpose


    The main reason for documenting existing database instances is that there might
    be a requirement to re-create the instance if a serious failure or disaster occurs.
    If the data uses UNIX file systems for the storage of the database, the recovery
    can be carried out using the normal file system restore from the latest backup.
    However, if raw disk is being used, then recovery is more complicated and the
    database instance must be created and initialized before a restore can be carried
    out. A further reason for documenting this information is that it is useful for
    familiarizing a new department staff member with the configuration. The documentation
    should contain the following information for each instance running on the system:


    +   - The database name. This is the unique name by which the instance is identified.
    For example, in Oracle, it is the ORACLE_SID variable; in Informix, it is the
    DBSERVERNAME parameter in the tbconfig file.

    - A description of the database, what it is used for, how it uses, and how many
    people use it (approximately).

    - The type of storage used. This could be a file system, raw disk, or possibly
    a combination of them.

    - Database creation and configuration information. Most of the required information
    can be derived from the configuration file and from a query of some of the system
    tables, showing the tablespaces, their size, and the location of the data files,
    for example.


    # Keeping Up-to-Date


    Probably the most important aspect of documenting the systems in use is to keep
    everything-to-date. Documentation is real value only if it contains information
    about the current state of the systems. This is the most frequently omitted part
    of documentation because it is thought to be complete once the document has been
    created rather than being an ongoing task requiring regular attention. This task
    is often seen as being "boring" when there are so many more interesting things
    to do, so it finds itself at the bottom of the priority pile—as a result, the
    documentation quickly'
  merge: -1
