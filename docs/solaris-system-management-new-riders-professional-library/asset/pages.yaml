  md: '# Project Budgets


    When a chargeback system is in operation, there are associated cost centers and
    charge codes to which time is booked. This is how the IT department receives payment
    for the services being provided. Booking time to a code can be thought of as an
    invoice, billing the customer for the time taken to carry out a function. A budget-holder
    normally assigned a cost center code by the finance department. If the manager
    is responsible for several projects, the budget may be broken down into a number
    of charge codes, for each project. Each of the codes is assigned a proportion
    of the budget, according to the forecast. The people actually carrying out the
    work must be careful when completing the timesheets for the week so that the correct
    number of hours are booked to the correct project cost code. One of the most frequent
    problems with systems of this kind is that the manager finds hours booked to the
    code that shouldn''t be there. The system manager must manage his budget code(s)
    accordingly, and on a regular basis, question any dubious entries he finds.


    Another problem that affects this kind of system is when a job is costly, the
    physical action of doing the task is costly; the management overhead, is frequently
    omitted. As example, consider the IT section providing an testing service to the
    business. Several hundred applications might need to be tested, all of which are
    to be paid for by the department that uses the application. The IT department
    bills the relevant project code for each application on a time and materials basis
    only. The management overhead cost has not been built into the price, nor has
    the planning effort that gone into scheduling the applications through the process.
    This can cause a significant amount of work when deliveries are late, cancelled,
    or rescheduled. In addition, none of the associated administration has been accounted
    for, such as the production of a test certificate, troubleshooting, and so on.
    The system manager is in charge of the section; he manages the resources and yet
    appears to be free.


    The objective is to ensure that all relevant costs, not just the obvious ones,
    are borne in mind when providing a service that is chargeable.


    # Summary


    The IT budget is a complex beast and can easily grow out of control if it is not
    managed properly. Large companies have specialized accountant staff to manage
    the corporate finances, but the system manager must keep a close eye on areas
    of the budget that fall within his responsibility. The budget is not just about
    budgeting for computer hardware and software acquisitions; it covers a much wider
    range, including the support and running costs, and the staffing and management
    of systems and associated administrative functions.


    Increasing, businesses are demanding a continuous service from their IT departments,
    which have placed increased pressure on the IT budget because system managers
    are often required to provide this extra coverage with little or no extra financial'
  merge: -1
  pgno: 47
- img_proc: true
  md: 'support. Larger companies may already have a computer operations section working
    on a 24×7 basis, and it is possible that the system manager may be able to make
    use of this resource for routine administration beyond normal business hours,
    backed up by on-call technical staff. The incentive for operations staff is that
    they receive valuable training and also open up further doors for potential career
    development.


    The IT department can also earn revenue from the service that it provides by charging
    for its services. Use of chargeback system allows the cost of providing the service
    to be apportioned to the various departments making use of the facilities. The
    other side of the coin, though, is that the level of service being provided to
    the customer will come under much greater scrutiny via service level agreements,
    which are discussed in Chapter 3, "Delivering the Goods."'
