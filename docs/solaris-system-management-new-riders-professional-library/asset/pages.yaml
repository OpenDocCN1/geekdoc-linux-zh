  md: '# Summary


    Network and system security have become increasingly important as more companies
    make use of public networks such as the Internet. The increased business and profits
    must offset the increased risk from unauthorized intruders; the latter could prove
    to be extremely costly.


    Several products are available from Sun Microsystems, either included with the
    Solaris operating environment or as unbundled products. There are also an increasing
    number of products available to run on Solaris from third-party suppliers and
    in the public domain. Some tools publicly available are also used by crackers
    to try to gain unauthorized access to systems and networks. System managers are
    well advised to be aware of these products so that any potential security holes
    can be filled at the earliest opportunity.


    A central part of dealing with the computer security issue is formulating a security
    policy. This is the document that draws everything together, the resources that
    need protection, the risks associated with them, and the way in which they should
    be protected. It also contains the procedure to follow if an attack on a system
    or network is detected.'
