    # Room for Expansion


    Many projects seriously underestimate the amount of growth that will occur in
    the first year of production. Consequently, they find that the system cannot cope
    with the demands being placed on it and that an upgrade must be carried out, causing
    major disruption and loss of availability.


    Earlier, this chapter briefly mentioned the capacity assurance initiative from
    Sun Microsystems. This allows the capacity options to be decided early in the
    project. The options are described here:


    +   - Do not—Continue as before, but try to calculate the perceived rate of growth
