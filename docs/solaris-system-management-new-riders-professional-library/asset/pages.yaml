    # Planning for a New System


    A new system requires careful planning. Several steps are involved in planning
    for the arrival of a new system, apart from the configuration and purchase of
    the system itself. Some of them are often overlooked, so they are discussed here:


    +   - Allocation of accommodation—The servers need to be housed in a computer
    room with a controlled environment and guaranteed power. It is always a big mistake
    to assume that there is space for another system. The system manager must ensure
    that there is sufficient power capacity for the new computer system(s) to be sited
    and the environmental control (air conditioning, humidity control, and so on)
    can cope with the added load. It may seem quite trivial, but installing a new
    system into a computer room often requires cutting floor tiles so that the wiring
    can pass under the floor ducts. This is frequently overlooked and is as a rush
    job at the last minute. When the exact site and footprint of the server(s) have
    been confirmed, this task should be arranged. Failure to do this can result in
    the new system being incapable of connecting to the power source or the network,
    and can be very embarrassing.


    +   - Extra resources—Any new system being implemented could result in the need
    for extra staff to provide the required level of support and administration. The
    system manager must address the training needs and ensure that the new staff members
    are recruited and trained before the delivery of the system(s).


    +   - Names—A name for servers and clients must be chosen. Some companies have
    a prepared list of names for hosts, which must be consulted when a new system
    is placed. In instance, names are selected from the list and registered so that
    there can be no risk of having duplicate hostnames within the company. The name
    should be as meaningful as possible to the function it will carry out and the
    department(s) that it will serve.


    +   - Name services—If NIS or NIS+ is in use, the system manager must evaluate
    the number of NIS servers to cater to the demand for the new system, especially
    if a number of clients are included in the new installation. Domain Name Services
    (DNS) must be taken into account, and the address details must be registered with
    the DNS server. If this is not done, then DNS will be incapable of resolving the
    name of your new domain when requests are directed to it.


    +   - Network connection—The new system will require a number of network connections.
    An Internet Protocol (IP) address must be assigned to each computer (or each network
    interface), and this must be unique within the company'
