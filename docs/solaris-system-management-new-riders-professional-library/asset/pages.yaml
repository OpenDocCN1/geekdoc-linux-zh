    # # Job Description


    THIS BOOK IS CONCERNED WITH THE TASK OF SYSTEM management, particularly with reference
    to systems running the Solaris operating environment. It should be noted that
    the majority of the principles discussed in the ensuing chapters are applicable
    to most computer platforms, not just Solaris. Any examples shown here, however,
    relate to the Solaris platform only. This chapter provides a gentle introduction
    to system management and, more specifically, to the job of the system manager.


    What Is a System Manager?

    designation system manager refers to a role, not necessarily to a specific job
    title, even though "system manager" is itself a valid title and is used for convenience
    and consistency within this text. As with many other jobs, the titles can vary
    enormously, so title of "system manager" could be taken as synonymous with "IT
    manager," "IS manager," or "senior system administrator."'
