    # PC Connectivity Products


    Products that enable a PC to connect to hosts running a different operating system
    have been available for many years in a variety of forms. Telnet and X System
    connections have eliminated the need for a separate dedicated console or monitor
    on the desktop, when both PC and non-PC connections are needed.


    Although these products are not full PC-integration software packages like the
    ones described in the previous section, they can still assist the system manager
    in the rationalization and consolidation of resources becoming increasingly popular
    in IT departments.


    This section discusses a PC X System product that can seamlessly integrate the
    Solaris CDE environment as a window session on the PC desktop. This enables the
    user to run graphical applications remotely on the Solaris host, taking'
