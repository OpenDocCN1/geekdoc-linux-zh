    # Pluggable Authentication Module (PAM)


    The PAM software comprises several authentication modules that are dynamically
    loaded—that into the Kernel as they are required. One of the benefits of PAM is
    that the system manager can implement a separate authentication process for each
    of a number of services (login, su, and telling being examples). In this way,
    a more extensive authentication procedure can be put in place, depending on the
    perceived security risk that the service provides. Also, the authentication of
    a user can be covered by more than one method and in a flexible order. For example,
    consider the following sample lines from the PAM configuration file /etc/pam.conf:


    ```

    su auth requisite /usr/lib/security/pam_inhouse.so.1

    su auth required /usr/lib/security/pam_unix.so.1

    login auth required /usr/lib/security/pam_unix.so.1

    login auth optional /usr/lib/security/pam_inhouse.so.1

    ```


    Notice, for example, that the su command is authenticated twice, using an inhouse
    authentication method and then using the standard UNIX authentication. The third
    column defines the severity of the authentication, again for su, if the requisite
    authentication fails, then the other authentication will not even be carried out,
    and the su request will fail.'
