    former state—that is, the state that it was in before the upgrade commenced. This
    can be done in one of two ways:


    # Small Versus Large Installations


    The interactive method is useful for a scenario in which a system administrator
    supports only a few systems. For larger installations in which many tens or hundreds
    of systems are being configured, this option quickly becomes impractical and also
    increases the risk of human error.'
