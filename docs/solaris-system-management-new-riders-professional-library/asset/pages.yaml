  md: '# Answerbook Software


    Getting Help 275


    A CD-ROM containing documentation is supplied with the Solaris operating environment.
    This information contains Solaris manuals, which are fully searchable so that
    queries can be run against the entire set, showing only the relevant parts of
    each guide. The Answerbook CD-ROM also contains the manual pages. Figure A.3 shows
    the initial screen that is displayed when the Answerbook software is started,
    which is done by selecting the Answerbook-2 option from the workspace Help.


    ![](img/20459f772e7361286cec3e76e3bd26b4_292_0.png)


    Figure A.3 The fully searchable documentation collections eliminate the need to
    look in several different locations for the required information.


    # Sunsolve


    Sunsolve provides important information and resources for Sun customers, including
    Solaris patches, a comprehensive symptoms and resolution database, white papers,
    information documents, bug reports, frequently asked questions (FAQ), and an early
    notification section. These are all available to customers with a SunSpectrum
    support contract and can be accessed in either of two ways: on the World Wide
    Web, or using a set of CD-ROMs that are set to the system manager or administrator
    on a regular basis.'
