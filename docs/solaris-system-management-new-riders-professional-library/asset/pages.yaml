  md: 'Before considering the job of the system manager, however, it’s important to
    get an idea of the system itself. Therefore, this chapter begins with a brief
    overview of the Solaris operating environment.


    # # The Solaris Operating Environment


    Solaris is the name for the UNIX-based operating environment provided by Sun Microsystems.
    It is often referred to as the Solaris operating system, which is not entirely
    accurate—the operating system, SunOS, is a component of Solaris, not the whole
    thing.


    This book will be looking primarily at Solaris 7, although it may occasionally
    make reference to new features becoming available with Solaris 8.The components
    of Solaris 7 are listed:


    +   **SunOS 5.7**—The operating system itself. SunOS comprises a number of packages
    that manage the system resources and provide network connectivity. The SunOS kernel
    (as Solaris 2.0) is based on AT&T’s system V 4 kernel, although it contains a
    number of additions. Previous versions of SunOS were based on the *Berkeley Software
    Distribution* (BSD) kernel.


    +   **OpenWindows 3.6.1**—Sun’s own graphical user interface (GUI) based on AT&T’s
    OpenLook functional specification.


    +   **OpenWindows Desktop Tools**—A collection of desktop tools that supplement
    the OpenWindows software. It provides additional functionality to the windowing
    environment in a standard look and feel, such as a mail tool for receiving and
    composing email, a desktop calculator, an electronic calendar, and an audio tool
    (for playing audio files), to name a file.


    +   **Common Desktop Environment (CDE) 1.3**—CDE comprises a windowing environment
    and a collection of desktop tools similar to those found with openwindows. CDE,
    however, is based on the Motif specification and can be found on many other UNIX
    vendors’ operating environments. It was adopted as the recognized standard for
    the look and feel of graphical applications at the time (about 1992) by the major
    UNIX vendors. Recently the standards have begun to shift with Netscape-based interfaces
    appearing on the market. Additionally, Linux now ships a graphical interface called
    the K Desktop Environment, or KDE, containing an integrated HTML display—Motif
    came closest to becoming a defined standard. Figure 1.1 shows the standard CDE
    desktop.


    +   **Solaris Documentation Set**—This includes the Answerbook 2 server software
    and documentation sets for users, system administrators, and developers.'
  merge: -1
