    # traceroute


    The traceroute command does exactly as you would expect: It traces the path taken
    to get from one host to another. It displays information about each of the "hops"
    along the way. This command is extremely useful when trying to determine why two
    hosts are incapable of communicating because it will indicate routers along the
    way that are not responding. Listing 13.6 shows an example of the traceroute command.


    Listing 13.6 The Traceroute Command Showing the Path Taken to a Remote Host


    ```

    leo# traceroute

    taurus toIn (210.127.8.3), 30 hops max, 40 byte packets

    leo-router (209.127.8.1) 3 ms 2 ms

    bb2-gate-x (188.101.67) 22 ms 18 ms

    3 bb2-gate-a (187.100.80.10) 32 ms 29 ms 17 ms

    4 bb5-area-xconn-alpha (192.150.100.68) 7 ms 5 ms 3 ms

    5 taurus-router (210.127.8.1) 6 ms 4 ms

    6 taurus (210.127.8.3) 7 ms 5 ms 3 ms

    leo#

    ```


    # snoop


    The snoop command is a powerful network command that captures packets on a network
    interface. The captured packets can be displayed on the screen as they occur or
    can be saved to a file for later analysis. The snoop command requires superuser
    privilege to run because it puts the network interface into promiscuous mode so
    that all packets can be captured. Listing 13.7 demonstrates the type of information
    that can be gathered with this. The example shows a simple Telnet connection established
    by user john with his password of john1.


    It is worth noting that snoop will capture all traffic on a nonswitched network,
    including traffic between other systems that might not have been requested. On
    a switched network, however, snoop will capture only packets on the system on
    which the command is being run and all systems communicating with it; network
    traffic from other systems will not be captured.


    The command is extremely useful, however, particularly when trying to see if acknowledements
    are being received from a remote host.'
