- img_proc: true
  md: '# 234 Chapter 12 Internet Protocol Version 6


    +   **Address discovery**—With the current IPv4 protocol, every host must be manually
    configured with its own address information or rely on a DHCP server. IPv6 allows
    automatic address discovery using the IPv6 Stateless Address Autoconfiguration
    Protocol, by which a computer can "discover" its own IPv6 address. The protocol
    uses the unique Media Access Control (MAC) 48-bit address to form an interface
    identifier. For example, if a system has an Ethernet interface, the 48-bit address
    is formed into a 64-bit interface ID. The Neighbor Discovery (ND) protocol then
    checks that there is not a duplicate on the subnet—there shouldn''t be because
    Ethernet addresses should be unique. Having a unique address, a message is sent
    out to see if there is a local router capable of supporting IPv6. This allows
    two or more hosts on a network to operate with no router present; it allows automatic
    configuration of their IPv6 addresses and does not rely on any other server, such
    as a DHCP server.


    This list highlights the major differences between IPv4 and IPv6. See the Appendix
    for links to a more detailed technical specification of the protocol and a more
    comprehensive list of the features.


    The next section outlines the new format of the IPv6 address, as well as the changes
    that have been made to the address notation.


    # IPv6 Addressing


    The current IP addressing structure, based on version 4 of the protocol, consists
    of a 32-bit address, made up of four groups of 8 bits.The address comprises a
    network address and a host address, depending on which class of the address refers
    to. Figure 12.1 shows the current IP address structure:


    | 7 bits | 24 bits | |

    |---|---|---|

    | 0 Network | Host | Class A |

    | 14 bits | 24 bits | |

    |---|---|---|

    | 10 Network | Host | Class B |

    | 21 bits | 8 bits | |

    |---|---|---|

    | 110 Network | Host | Class C |


    Figure 12.1 The mapping of network and host addresses clearly shows the class
    structure in the 32-bit IPv4 protocol.'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# IPv6 Addressing 235


    The current IP address is written as four decimal numbers separated by periods
    (). An example of an IPv4 address is 210.127.36.133. This is a randomly chosen
    Class C address. The network number is 210.127.36, and the actual computer is
    host number 133 on that network; the network is subnetted on the expected boundary,
    which is ::ffff:00.


    IP addresses based on version 6 of the protocol consist of a 128-bit address made
    up eight groups of 16 bits. As mentioned in the previous section, there are no
    classes, and the address is written as eight hexadecimal numbers separated by
    colons (:). The preferred format for writing IPv6 addresses is shown here: x:x:x:x:x:x:x:x.
    Figure 12.2 shows the IPv6 structure.


    ![](img/20459f772e7361286cec3e76e3bd26b4_252_0.png)


    **Figure 12.2** The 128-bit IPv6 address format shows that the entire structure
    is used to denote the address, without any network classes.


    Because of the way in which some addresses are allocated sometimes contain a number
    of empty (zero-filled) bits. The designers have taken this into account to make
    writing addresses easier by using a special syntax to denote “multiple groups
    of 16 bits filled with zeros.” Thus, the valid IPv6 addresses can be represented
    in two ways:


    | 1040:FE3A:0:0:200:40C:8 OR | 1040:FE3A::200:40C:8 |

    | 0:0:0:0:0:0:0:A OR | :: |

    | FF02:0:0:0:0:0:2 OR | FF02::2 |


    However, an IPv6 address could contain multiple blocks of 0, such as in 1080:0:0:0:4:0:2.

    The use of the “::” to represent multiple groups of zeros can be used only once
    in an address, so the representation 1080::42 would be an invalid representation
    of the IPv6 address.


    The IPv6 address structure also allows for a notation in which embedded IPv4 addresses
    can be written as part of a new IPv6 address. Consult the Appendix for more detailed
    information on the IPv6 address specification.


    # Getting Ready for IPv6


    The Internet is growing at a phenomenal rate, probably much faster than many have
    anticipated. The enormous increase in Internet usage has come about mainly because
    the e-commerce revolution and the desire of virtually every business to have a
    presence on the World Web. There has also been a huge increase in the number of
    home users connecting to the Internet.'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# 236 Chapter 12 Internet Protocol Version 6


    IPv6 is going to happen. It is not merely a suggestion that has been proposed,
    it is necessary to allow the Internet to continue to develop and to handle the
    requirements of its users. As with the Y2K problem, there is no choice about whether
    to implement the changes; the only advantage over Y2K is that the date when everything-happ
    is not fixed, so a phased transition can be applied to the whole scenario.


    # What You Should Be Doing Now


    The system manager will not be directly responsible for the implementation of
    IPv6 within the organizational network—task will be the responsibility of the
    network manager—but the system manager will be responsible for ensuring that all
    the systems under his control are IPv6-compatible. A further consideration that
    must be taken into account is the use of any distributed software applications.
    These also will require modification, in some cases, to interpret the new address
    structure.

    The system manager should be actively pursuing the following:


    +   Funding—First and foremost, the system manager might have to secure additional
    funding to be able to carry out the transition of his systems and software to
    support IPv6.


    +   Liaisons with the network manager—The network manager will have all the information
    on when and how the company is planning to implement IPv6. The system manager
    cannot do very much if the routers can''t handle the new addresses.


    +   Vendor contacts—The system manager must ensure that operating system vendors
    have included IPv6 support for their environments.This could be in the form of
    patches to the system software, or it might necessitate a system upgrade to a
    later version. Either, the system manager will have to plan for the implementation.


    +   Training—The system manager should be identifying vendors that can supply
    relevant training for IP version 6.The training also needs to be assessed so that
    the members of staff can receive training before any implementation is in place.


    +   Familiarity—If a test network is set up within the company, the system manager
    should attempt to have a test system attached to it so that his staff can gain
    familiarity with the migration process and be prepared for the actual transition
    when it happens.


    # Solaris 8 supports IPv6


    Solaris 8 is the first version of the operating environment to fully support IP
    version 6.'
