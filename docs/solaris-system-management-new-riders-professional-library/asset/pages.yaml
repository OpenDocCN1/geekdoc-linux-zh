  md: '# Chapter 9 Tactical Management


    A large number of companies let the standard system logging configuration run
    in its default form and not amend it to suit their specific requirements. There
    are potential disadvantages of logging too much information to the system console:


    +   - A "headless" system (one with no console) will never display the messages.

    - The message might scroll off the screen and be lost before anyone sees it.

    - There may not be anyone watching the console to be able to take immediate action.

    - The message may not be stored elsewhere so that it can be reviewed later.


    With a busy system, some discrimination of priorities is necessary; otherwise,
    the main messages files can become large very quickly. One approach is to configure
    the system logging by feature—that is, for example, to log all messages relating
    to mail to a different file, such as /var/log/mail.log; to log kernel-related
    messages to /var/log/kernel.log; to log authentication messages to /var/log/auth.log;
    and so on. This method of system logging can make monitoring the events more manageable
    while still logging only the highest-priority events in the system messages file.

    Syslog message levels are defined in a series of levels. The following list details
    the levels in order from the highest level to the lowest.


    | Level | Code | Description |

    | --- | --- | --- |

    | LOG_EMERG | 0 | Kernel panic |

    | LOG_ALERT | 1 | A condition requiring immediate attention |

    | LOG_CRIT | 2 | A critical condition |

    | LOG_ERR | 3 | An error |

    | LOG_WARNING | 4 | A warning message |

    | LOG_NOTICE | 5 | Not a serious error, but one that might require attention |

    | LOG_INFO | 6 | Information message |

    | LOG_DEBUG | 7 | Used for debugging |


    It is important to note that when a level is inserted into the configuration file,
    messages for the selected level and higher will be forwarded to the location specified.


    # Which Files Are Involved?


    The syslog process comprises a number of files, apart from the syslog daemon.
    The following list describes each of them and the purposes they fulfill:'
  merge: -1
  pgno: 201
- img_proc: true
  md: '+   - /etc/syslog.conf—The configuration file where the rules are defined,
    as well as the locations and method of message delivery.


    +   - /var/log/syslog—The data file containing data gathered by the syslog process.
    There will also be syslog.[0-7] files containing older data. The files are recycled
    every eight weeks.


    +   - /var/adm/messages—The data file containing system messages, often from the
    syslog process, and also attempts to become superuser and system startup messages.


    +   - /usr/lib/newsyslog—An automatic job that runs by cron to cycle the syslog
    data files.


    +   - /etc/init.d/syslog—The startup and shutdown script that is executed every
    time the system is shut down or rebooted.


    # User Accounts


    It is important for the system manager to understand how the user account mechanism
    functions under the Solaris operating environment. It is also important that the
    files associated with it are suitably protected and backed up. Poor management
    of these files can leave the system wide open for an unauthorized intruder. If
    there is a system security policy governing user access to the system, it is the
    responsibility of the system manager to ensure that it is implemented in line
    with this document. This policy should include details about usernames, the password
    aging strategy, expiration of accounts, and so on. Armed with sufficient information
    about the user account management files, the system manager is better able to
    verify compliance with the security procedures.


    The following subsections describe the files related to the administration of
    user accounts, tell how to lock a specific account, and finally, give an example
    of how proper use of groups can be used to the system manager’s advantage.


    # Which Files Are Involved?


    Three files are used as part of account management: /etc/passwd, /etc/shadow,
    and /etc/group. Collectively, they identify a user, the groups that user belongs
    to, and details about password management. Listing 9.2 shows an example of each
    of these files.'
