  md: '# Chapter 5 Solaris Installations and Upgrades


    Using the interactive method, the system administrator can preserve file systems
    so that they are not re-created during the installation—a process that would lose
    all of the current data—and manually change only those file systems that will
    be directly affected by the installation process. The option of preserving existing
    file systems speeds up the whole process, reducing downtime.


    # Multiple Systems


    A large number of companies now tend to use “standard builds” for their networked
    desktop PCs. The advantage of this is that each is configured in the same way,
    so this saves a lot of time because the build can be done with very little or
    intervention. In the same way, the Solaris software can be installed on multiple
    machines using a predefined set of configuration files. This method of installation
    is known as Jumpstart.


    Imagine a company with 50 servers, all requiring an upgrade to the latest version
    of Solaris. Suppose that 10 application servers with 1024MB (1GB) of memory, 25
    are operating system servers with 512MB of memory, 8 are print servers with 768MB
    of memory, and 7 are database servers with 2GB of memory. Rules can be configured
    so that, in this case, the amount of memory decides how the server is to be installed—that
    is, the Solaris installation options. Instead of the system administrator having
    to carry out 50 complete installations, this can be done automatically. One significant
    advantage with this option is that it eliminates the possibility of human error,
    an important factor when considering 50 separate installations because this can
    maintain consistency across many servers. This also saves on the resource and
    time needed, as well as greatly reducing the operational impact on the business.


    A further point to note with Jumpstart installations is that scripts can be called
    to run both before and after the installation takes place. For example, a script
    might be run to back up the system before the upgrade, followed by another script
    to restore the data file systems after the upgrade has taken. See the Appendix
    for further reading on the Jumpstart option.


