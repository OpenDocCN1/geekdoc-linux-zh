    # Summary


    System managers are under constant pressure to do more with the resources they
    already have and to rationalize and consolidate. The products available today
    to integrate Solaris and PC environments greatly help achieve these objectives.


    The Sun PC coprocessor card effectively co-locates a powerful PC within the Sun
    system hardware, allowing it to take advantage of the Solaris system resources
    and eliminating the need for two systems on the desktop.


    Solaris Netlink delivers sufficient Windows NT integration to replace NT servers
    with significantly fewer Solaris systems, thanks to the reliability and scalability
    that the Sun platform is renowned for.


    Interoperability between UNIX and PC environments has been high on the Sun Microsystems
    agenda for several years. The StarOffice productivity suite of software is now
    considered to be a rival to the traditional Microsoft Windows environment.'
