  md: '# Chapter 5 Solaris Installations and Upgrades


    **Organization of disk partitions**—An operating system server supporting, say,
    50 diskless clients must provide the swap space for each of those clients on own
    hard disks as well as the root (/) file system and the /usr file system, where
    all of the clients executables are held. Client swap areas are normally created
    in a file system named /export/swap/. Because the client swap areas will be heavily
    used, should be created equally across the available disk controllers and disk
    volumes. Consider the following example:


    A server (coverme) supports 50 diskless clients (coverme01 through coverme50).
    The server has two disks, both 9Gb in size. Each client will have 64MB of swap
    allocated to it. The best way of organizing the disks is to create a file system
    on each to hold the swap areas for the clients. So, /export/swap contains the
    swap for the odd-numbered clients, and /export/swap1 contains the swap for the
    even-numbered clients, as shown in List 5.1.


