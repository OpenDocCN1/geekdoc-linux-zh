    top

    This utility is bundled with versions of Solaris version 8 onward and is also
    freely available in the public domain. It displays information about the processes
    currently utilizing most of the system''s resources. The display is updated regularly
    at an interval that is configurable by the user.


    The top command can be downloaded from a number of sites on the World Wide Web,
    including http://www.sunfreeware.com. It is easily installed and comes either
    as a precompiled delivery or source code, along with supporting documentation.
    It is most useful for analyzing performance processes as they are in progress
    and how much of the CPU is currently allocated to a particular process. The top
    shows summary information, such as the current system load, the amount of swap
