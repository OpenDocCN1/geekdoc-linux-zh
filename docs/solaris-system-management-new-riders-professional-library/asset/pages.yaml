    # File/Print Server


    A file server is one that provides access to files or data that are held on the
    server and distributed to a number of clients. Sharing of the files is achieved
    using Network File Systems (NFS). A popular use for such a server is for users’
    home directories and shared areas, such as the online manuals pages.When a file
    server is providing these services to a large number of clients, it must be configured
    so that it can accommodate the requests being made of it.The server, by default,
    starts up 16 NFS daemons (infsd) at bootup. NFS performance can be obtained by
    modifying the following line in the NFS server startup file /etc/rc.3/S15nfs-server:


    If the value is increased, say to 32, 32 NFS daemon processes will be started,
    which will allow a greater throughput of requests. The actual number of daemons
    depends on the number of clients requesting data access from the server.

    Another configuration option for file servers is to use the automounter, a facility
    that mounts directories or file systems is automatically unmounted only when they
    are accessed. The directory of inactivity has elapsed. One of the features of
    the automounter is that it provides resilience and flexibility. User home directories,
    for example, can be easily moved to another file server with minimal disruption,
    while static data, such as the online manual pages, can be made to use multiple
    file servers.The advantage of this is, if one file server becomes unavailable,
    other users can mount the data from the next server in the list. If a user already
    had a directory mounted when a server failed, restarting the workstation would
    enable that user to also mount the data from an alternate server.


    A print server is one that provides printing resources to users across the network.
    The print server holds files for spooling before the actual printing takes place.
    If a server is being configured to provide printing resources, it should definitely
    have the /var file system created separately when Solaris is installed.


    # /var File System


    With Solaris, /var, by default, does not exist as a file system./var is usually
    a directory contained within the root (/) file system. It must be manually specified
    if a separate file system is required.


