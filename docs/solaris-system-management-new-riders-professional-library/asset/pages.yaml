  md: '# Performance Monitoring


    # Solaris Utilities


    Solaris provides a comprehensive set of tools to allow monitoring of the system
    performance. These are discussed in the following paragraphs to show the type
    of information that can be obtained and to tell what to look for to ascertain
    whether there is a performance problem. The utility in this section, top, is available
    in the public domain is now included with the standard release of the Solaris
    operating environment (as of Solaris 8). It is extremely useful for seeing the
    processes that are using the most of your resources.


    # vmstat


