  md: '# Chapter 7 Disaster Recovery and Contingency Management


    # Alternate Site


    If a serious disaster, such as a fire, occurs it may not be possible to use the
    site, in which case an alternate site is needed. For larger companies, relocating
    the entire operation at a moment''s notice is no easy feat; in some cases, this
    could prove to be impossible. Disaster recovery terminology defines three types
    of alternate sites, depending on the state of readiness—warm, and cold sites:


    +   - Hot site—This essentially an alternate site that is ready for business.
    It includes sufficient hardware, networking, and so on that it is capable of providing
    immediate backup support to the business. In a distributed clustered environment,
    where the operation is mirrored at each node location, the transition to another
    site is less painful.


    +   - Warm site—The warm site is not as prepared as the hot site, but it is partially
    equipped with hardware and networking. Greater effort is required to achieve operational
    status, but generally the company could be up and running within 48 hours of a
    major disaster.


    +   - Cold site—This could be empty commercial space belonging to the company,
    or even a mobile trailer, for example, providing electricity, a controlled environment,
    and communications access. The space is used to install, configure, and operate
    replacement systems.


    As an alternative to owning its own site, a company can make use of a third-party
    company that specializes in disaster recovery. A prime example for Sun computer
    networks is Sung Recovery Services, Inc. (http://www.e-recovery.com/), the world
    leader in enterprise recovery solutions. With a network of so-called megacenters
    around the United States, Sung provides continuous support on a 24X7 basis for
    companies during a disaster situation. Sung was notably active during the World
    Trade Center bombing, Hurricane Floyd, and the San Francisco earthquake, to name
    a few. Its facility in Philadelphia is the largest of its kind in the world, comprising
    more than 350,000 square feet of usable operations space. Figure 7.2 shows a picture
    from the Sungard Web site of utilize


    ![](img/20459f772e7361286cec3e76e3bd26b4_161_0.png)


    Figure 7.2 The huge expanse of usable space can accommodate the largest requirements
    for business continuity.'
  merge: -1
  pgno: 161
- img_proc: true
  md: 'Not only does Sungard provide the space for a company''s recovery, but it can
    also provide the systems, including the complete range of Sun servers, up to the
    E10000, Sun''s flagship server. Office space for the continuity of business is
    included in addition to the space for the systems themselves. Sungard also offers
    a fleet of mobile Metrocenters in most metropolitan areas that can be delivered
    to the company''s site within 48 hours and that accommodate an office environment
    of approximately 50 people. Figure 7.3 shows what a Metrocenter looks like.


    ![](img/20459f772e7361286cec3e76e3bd26b4_162_0.png)


    Figure 7.3 The Metrocenter can be deployed virtually anywhere, providing the most
    flexible solution for a company requiring urgent recovery facilities.


    Sungard is ideal for large companies running business-critical applications, requiring
    continuous 24X7 access. The company has high-availability facilities to ensure,
    as far as possible, that the business survives the aftermath of a major disaster.


    # Emergency Replacement and Spares


    Of course, an alternate site is necessary only in the event of a major disaster
    that destroys the current site or makes it unservicable. An option that provides
    contingency when components of a server or network fail is to establish an agreement
    with the provider of the support contract, or it''s not with Sun themselves, so
    that a fast-track replacement of critical components can be delivered. For the
    simpler field-replaceable units, as such disk modules, controller cards, memory,
    and so on, it might be desirable to hold a stock of emergency spares.


    # Replacing Server Components


    Only qualified, trained staff should attempt to replace components of a server.
    Sun Microsystems offers a number of hardware maintenance training courses, although
    it may still be necessary for a field engineer to attend for component replacement.
    Consult your hardware support vendor for advice.'
  merge: -1
