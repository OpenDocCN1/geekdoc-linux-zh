  md: '# Chapter 2 The IT Budget


    To put things into perspective, consider a Solaris network of 10 servers using
    DLT tapes as the backup medium, with the cost of one tape being approximately
    $50.

    Maintaining a pool of backup tapes to cover a four-week cycle involves 280 tapes
    at a cost of around $14,000. One copy of the tapes in the four-week cycle is retained
    permanently and is stored in an off-site secure area. An additional 120 tapes
    are required for the year, increasing the cost to $20,000. This example also does
    not allow for any bad tapes or any other ad-hoc backups. The actual cost of backing
    up the systems for a year is likely to be in the region of $25,000 for the media
    alone. Also to be added in is the cost of off-site storage, which might be a salaried
    fixed cost or one that involves a bill each time a tape is requested for restoration.
    Similarly, toner cartridges for laser printers located in various offices can
    accumulate into a significant cost that must be accounted for.


    This example shows that if consumables are not properly accounted for, the budget
    holder could find that funding is in danger of running out before the end of the
    financial year, putting the service provision to the business at risk.


    # Forecasting


    Forecasting next year''s requirements is not an exact science—it can''t be because
    it involves predicting what''s going to happen in the next 12 months. The important
    thing about providing a forecast is to lay down a marker with a value attached
    to it. It goes without saying that the value attached should be reasonable and
    based upon some form of evidence, not merely plucked out of the air! The best
    starting point is the data available from previous years. This is accurate because
    it reflects what actually happened and is not going to change. For example, consider
    a system manager trying to estimate the required support budget for his computer
    systems and administration section. Suppose that last year there were 6 large
    servers, 30 workstations, 25 printers, and 4 members of staff. After an expansion
    program, there will be 9 large servers, 400 workstations, and 40 printers.


    Some simple arithmetic will show that, theoretically, each member of staff can
    administer and support 1.5 servers, 75 workstations and about 6 printers. By creating
    a spreadsheet, the cost for last year can be used as a basis for this year—say,
    adding 10% increase to allow for price rises. Ideally, though, to achieve any
    reasonable level of accuracy, more than one year''s statistics should be available
    so that a growth factor can be built into the calculations. Many companies have
    experienced unprecedented growth in recent years because of the Internet and e-commerce,
    which, if not taken into account, could throw off the figures by a considerable
    amount.


    A possible example is shown in Figure 2.3, using the previous year''s data as
    a starting point for the forecast. Note that the figures used are for illustrative
    purposes.'
