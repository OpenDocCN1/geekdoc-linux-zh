    are aware of what is being planned and any possible effect that it might have
    on them. Microsoft might merely include details of the transition plan so that
    users know when the systems will be upgraded to support IPv6, or it may be that
    the users make network connections themselves, which in case more detailed information
    is needed by


    Of course, it is not known exactly when the final change to IPv6 will occur or
    when IPv4 will cease to be used. It is safe to assume, however, that both IPv4
    and IPv6 will co-exist for a number of years, making the transition a gradual
    one. Planning for a target date of, say, five years is probably reasonable.


    Many vendors—including Sun, Cisco, and Microsoft—have implemented a dual IP stack
    in both protocols are supported. This allows applications to migrate one at a
    time to IPv6. The system manager should take the lead from the network manager,
    who will be responsible for the migration of the network infrastructure and will
    also have access to the most recent information on developments. Meanwhile, any
    future upgrades, or new systems, should now include IPv6 as a standard requirement.


    # How Does This Affect You?


    The transition to IPv6 has been designed so it can be carried out in a piecewise
    fashion, making it easier for companies to migrate while still supporting the
    current IP addressing structure. From an end-user perspective, the transition
    will be virtually transparent, with no noticeable effects on the functions carried
    out.


    For the system manager, however, the transition will cost money, take time, and
    require careful planning (and a close liaison with the network manager). It will
    also require replacement software and retraining of staff members. The most significant
    effect on the system manager will come during the actual period of transition,
    when some of the systems have been converted to IPv6 and some are still using
    IPv4. During this time, there will undoubtedly be “teething problems” requiring
    extra effort to ensure that the operation continues to run smoothly.


    # What Are Other Vendors Doing?


    Cisco has produced a detailed IPv6 statement of direction paper, which can be
    found at the Web site http://www.cisco.com. IPv6 is implemented in a three-phase
    plan for Cisco IOS software, starting in the fall of 2000. Microsoft has also
    released code for its IPv6 implementation to allow developers and testers in their
    migration plans. Most of the major vendors now support IPv6, particularly tunneling,
    which allows IPv6 packets to be transmitted over IPv4 networks.


    ![](img/20459f772e7361286cec3e76e3bd26b4_254_0.png)'
  merge: -1
  pgno: 254
- img_proc: true
  md: 'The effect of IPv6, though, is not entirely negative. The system manager will
    gain some immediate benefits, such as more efficient network usage, increased
    security, and easier administration.


    The alternative to converting to IPv6 is that a company eventually will be isolated
    and prohibited from participating in the future development and expansion of business
    on the Internet.


    # Summary


    IPv6 is a necessary step forward to satisfy both the imminent exhaustion of available
    addresses with the current IP version 4, and the longer-term development of the
    Internet and global electronic computer communication. IPv6 increases the number
    of available addresses to such an extent that they will be sufficient to cater
    to the hundreds of computers or other devices per square meter of the Earth’s
    surface.


    In addition to providing an increased address space, IPv6 offers features such
    as increased security, classless addressing, more efficient use of broadcasting,
    guaranteed bandwidth, automatic address discovery, and the capability to accommodate
    non-IP address formats.


    The system manager should be actively doing the following in preparation for the
    transition to IPv6:


    +   * Seeking funding to allow the transition to go ahead

    * Arranging suitable training for key staff members

    * Having regular contact with the network manager to stay abreast of developments
    within his own environment

    * Contacting vendors to ensure that their products either support IPv6 or will
    do so in the near future

    * Making use of any test networks that might have been established to provide
    his department staff with the opportunity to become familiar with IPv6

    * Ensuring that the users are kept informed of the planned developments and of
    any potential effect that it might have on them

    * Planning for the transition to IPv6 and carrying out extensive co-existence
    testing


    IPv6 is a certainty at some point in the future. A company that chooses not to
    migrate to IPv6 is one that does not intend to participate and benefit from the
    further development of the Internet.


    Further references on IPv6 can be found in the Appendix.'
