  md: '# Creating an SLA


    This section discusses the procedures that are followed during the creation of
    a service level agreement. It is not intended to be a definitive discussion, but
    it gives an overview of the topics to be addressed.


    There are several steps to follow in the creation of an SLA, and these are similar
    for various agreements—in our case, one between the IT department and another
    department—within the same organization. The steps are described in detail in
    the following sections:


    # Step 1: Gain Agreement That an SLA Is Required


    Without this, there is little point in continuing. The fundamental agreement that
    the SLA required is the first step to achieving a mutually agreeable solution.


    # Step 2: Select and Assemble the SLA Team


    A team needs to be selected from both the service provider section and the client
    section. The actual numbers making up the team will vary according to the size
    and complexity of the agreement being sought, and the guidelines in the following
    paragraphs might prove useful.


    In an ideal world, each of the departments would be a part of the team, but this
    is not often possible, so for the IT department, this may be delegated to the
    system manager. He can negotiate on behalf of the IT chief and possesses sufficient
    knowledge, both technical and business-related, to provide positive input to the
    process. As a general rule, I recommend two initial members from each group, calling
    on other “experts” as required for specific input related to their field of expertise.


    Both parties should send people with sufficient authority to be able to finalize
    the agreement. Some members deliberately send delegates that do not possess sufficient
    authority, but this is negative and counterproductive, and serve no real purpose
    other than frustrate the proceedings.


    The number of attendees should be balanced from both parties. They do not have
    to be exactly equal, but deviation should be kept to a minimum. Similarly, there
    should not be an excess of power on one side—it can be intimidating to be faced
    with a team that is much more senior than yours. In fact, the less party could
    feel pressured into concessions that make the whole agreement worthless and meaningless.
    The requirement here is that a mutually understood and agreed contract is drawn
    up; it is not a competition to see who wins


    # Step 3: Prepare for the SLA Negotiation


    After the groups have been assembled, there must be some preparation before the
    start of negotiations. The system manager, for example, needs to identify the
    processes involved for the provision of his service. If it involves any sections
    or external providers that are beyond his control, his ability to provide any
    guarantee of'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# Service Level Management 43


    service is severely diminished. He must first obtain agreements (SLAs, maybe)
    himself from all of these so that he is then in a position to be able to offer
    a minimum and maximum level of service.


    The system manager must be able to monitor the level of service being provided
    so that, if required, can produce evidence to show that targets have been met
    or exceeded. He cannot promote a level of service if he cannot measure it. Conversely,
    the client group must identify precisely as possible the service that is required.
    A certain amount of discipline is required on behalf of the client team: Clients
    must request the level of service that is necessary to carry out their function,
    rather than a “wish list” of what they would like to see.


    # Step 4: Establish the Terms and Scope of the Agreement


    Items under this heading, but are not limited to, the following:


    +   - Length of the contract—Typically, this is between one and two years. Given
    the technology present today, it would be imprudent to create any contract lasting
    longer than two years (indeed, two years is a long time), although, as detailed
    later in this section, the agreement will be subjected to modification from time
    to time. A contract start and end date should be defined here, too.


    +   - Response times for trouble tickets—These can vary in priority according
    to the type of problem raised and must be organized in how urgent ones are dealt
    with in a timely manner and in the right order. An example is to have priority
    1, 2, and 3 (high, medium, and low), with a realistic response time attached to
    each, such as one hour, one day, and one week, respectively. For example, a problem
    that affects all the users would definitely attract a priority 1 status, whereas
    a request to add a new user to join next week would attract a priority 3 response.
    A priority 2 response could be a problem affecting only one user.


    +   - Data retention and restoration requirements—The expectations of long data
    required to be kept (and how and where the data is to be stored) would be included
    here, in addition to the time taken to restore a specified file (or item of data).
    For example, if six months of data is held locally, then a restore could be expected
    within an hour or two. Conversely, a file that is two years old could involve
    retrieving the backup media from an off-site storage facility and might be specified
    as up to one week.


    # Resolution and Response


    Some SLAs define a resolution time as well as a response time. This can prove
    to be a dangerous practice for the system manager. Responding to a trouble ticket
    within a certain time is one, but guarantee-ing the resolution time is quite different
    and could potentially cause major problems.'
  merge: -1
  pgno: 60
- img_proc: true
  md: '# Chapter 3 Delivering the Goods


    +   **Enforcement of quotas**—Any user quotas, usually in terms of disk space
    storage, should be identified either on a per-user or per-application basis. The
    system manager needs this information to be able to allow sufficient storage space
    for the consumers'' needs, ensures that the data will be backed up, and provide
    contingency (in the case of high availability requirements) through the use of
    RAID or mirroring.


    +   **Identify clear boundaries of responsibility**—When multiple organizations
    or departments bear responsibility for parts of the system


    +   **Identify the standard path for escalation**—This is the default action to
    take when nonperformance is identified—that is, failure to achieve the agreed
    level of service. The escalation path is described in more detail in the section
    "Penalties for Missed Targets"


    The scope of the agreement should be clearly defined so that there be no misunderstanding
    between the parties at a later date and what is included in the agreement and
    what is excluded. Occasionally there will be specific exclusions—for example,
    if the client group is using an old piece of hardware for a specific function,
    then the system manager might want to exclude it on the grounds that it is no
    longer supported and is covered only on a best-endeavors basis.


    # Step 5: Document the SLA


    This is the part of the process in which a mutually acceptable agreement is reached
    and both parties understand what is being provided and what is being expected.
    The agreement should possess the following characteristics:


    +   **Any objectives identified must be within the control of the service provider**—There
    is no point in trying to set the expectations when the service provider has no
    direct control. An example of this could be the client group stating that the
    wide area network (WAN) connections must be available all the time. The system
    manager might have an agreement with the network section, but it is the network
    section who will have the SLA with the external communications company, who maintains
    the WAN connections. However, if the client group requests that there be no more
    than 60 minutes scheduled downtime on the Solaris servers in a year, this is under
    direct control of the system manager and is a valid expectation.'
  merge: -1
  pgno: 61
- img_proc: true
  md: 'Service Level Management 45


    +   * Any objectives must be meaningful—This is quite difficult in that objective
    initiated by the client group may not be meaningful to the IT department, and
    vice versa. For example, the number of network collisions or bad receive packets
    are meaningless to the client group. The client would like to see something such
    as "a query be acted upon in three seconds or less."The latter will be much more
    meaningful to both parties; the measurement of it, however, is a different matter
    entirely.


    +   * The agreement must be mutually acceptable—The whole idea of creating a service
    level agreement is one of being mutually acceptable. It is unlikely that both
    parties will always like everything contained in an SLA, but they should find
    it acceptable—there is a distinct difference. If one of the parties find something
    that it decides is unacceptable, then this issue should not be agreed to, and
    negotiation take place. This is infinitely preferable to having an agreement made
    containing items that are unacceptable to one of the parties—it undermines the
    whole value of having the SLA in the first place. Basically, if the job is worth
    doing, then it should be done properly.


    +   * Any objectives must be achievable and cost-effective—Both parties must realize
    every day in the SLA process that there is a requirement to be realistic about
    what is being provided and what is being expected. It is a complete waste of time
    if the expectations are impossible to achieve with the current system and network
    configurations. It is also unlikely that any system manager would agree to an
    expectation that he knows he cannot accommodate. If any hardware or software are
    required to satisfy the expectation, then they must be justified as cost-effective
    and beneficial.


    +   * It must be possible to measure objectively the service being provided—Some
    of the client expectations will be extremely difficult to measure accurately without
    the use of a management tool—even some of these do only part of the job. Data
    may be available from several sources that, when correlated and analyzed, provides
    the necessary information to determine whether the expectation has been satisfied.
    However, both parties must agree on the objectivity of the data being gathered.
    The subject of monitoring performance against targets is discussed in greater
    detail later in this chapter in the section "Monitoring Performance Against Targets"


    # Step 6: Identify Nonperformance Indicators


    As part of the SLA agreement, a set of criteria must be established so that indicators
    exist when the performance expectations of the client are not being met. To be
    able to do this, it is necessary first to have established the minimum level of
    service required.'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'It could be something as simple as the example in Step 6, that a query should
    take no longer than three seconds to return the result. This is an end-to-end
    response time and may prove difficult to measure with any accuracy. The system
    manager may agree to an indicator as being the availability of the database (on
    which query runs). It may be possible to measure the overall availability by using
    data extracted from more than one management system. It will depend on whether
    the client accepts the data as being valid, and also how much effort is expended
    in producing the required information—it may not be cost-effective to do it.


    # Step 7: Identify and Agree to Correct Action


    Any corrective action should be invoked only as an exception. This section should
    identify the tolerances that are permissible. For example, if an expectation is
    that a query should take only three seconds, then what happens if it happens only
    once? It can be seen that it would be unreasonable to invoke a nonperformance
    procedure for a one-off occurrence. A more representative and meaningful indicator
    of nonperformance would be if a percentage of queries in a day took longer than
    six or seven seconds to complete. The tolerances should be reasonable and realistic.
    For corrective action, this is discussed much later in the section “Penalties
    for Missed Targets.


    # Step 8: Determine and Agree to a Review Process


    Any SLA that is created will have to undergo a regular review.This is true because
    experience is gained, some of the performance parameters may evolve and be more
    finely tuned. A regular review should be agreed to and documented. A weekly review
    may be necessary in the early stages of implementation, but this could probably
    be reduced to monthly after an initial period.


    # Step 9: Establish Procedures to Allow Modification and Refinement of the Agreement


    As part of the review process, the agreement must be subjected to occasional modification
    and refinement.This would normally come as a result of experience, or maybe be
    an upgrade to the existing facilities or a new release of the application software.
    The process for modifying the agreement needs to be addressed here and agreed
    to.


    # Types of Availability


    There are two kinds of availability, scheduled and unscheduled. Scheduled availability
    takes into account such as routine maintenance and agreed upgrades, and can be
    easily planned in advance. Unscheduled availability includes such as system crashes
    and database corruption, and cannot be planned for. It is often important to separate
    the availability requirements according to these two types.'
  merge: -1
  pgno: 63
- img_proc: true
  md: 'Service Level Management 47


    # Monitoring Performance Against Targets


    The monitoring of performance is a difficult task and is usually hampered by the
    lack of accurate data relating often to the target. The gathering of data for
    performance-monitoring purposes will involve correlating data from more than one
    management system. For example, to ascertain the performance of the query example
    described earlier, it may be necessary to obtain network statistics, workstation
    performance statistics and data-base performance information. Any of these could
    potentially cause a bottleneck that could result in the SLA targets not being
    achieved.


    Even with the data correlated from several systems, there is no real guarantee
    of the accuracy. The IT department may state that queries are being completed
    in two seconds or less, but the user may disagree, stating that the system is
    slower than expected and discounting the collected data as invalid. Network monitoring
    tools tend to look only OSI Level 1 and 2 for their performance information, and
    only report on lost packets, number of retransmissions, and on.


    Additional equipment or software may be needed to gather some of the data for
    performance analysis.These could include LAN analyzers to examine packet throughput
    on the network, network-management software (such as Solstice Domain Manager),
    and the error logs already available.


    Some better tools now coming on the market are capable of monitoring the end-to-end
    process, something that has traditionally been missing from such tools. Framework,
    from GTE, is an example of the new generation of system-management tools. It uses
    RMON2-enabled devices that can probe the application layer of the OSI model and
    provide comprehensive information relating to the application.(RMON2 is the successor
    to RMON, Remote Monitoring.)This sort of management information is required to
    be able to report on the end-to-end performance and provide meaningful data for
    SLA purposes.


    Another source for monitoring the performance of SLA objectives is by using the
    help desk system. In this instance, the number of logs logged against either a
    service or an application can be analyzed to gain insight into the level of performance
    being achieved. This data should be used to supplement other information and should
    not be relied upon by itself.


    The system manager will be required to provide a periodic report detailing the
    performance levels that have been achieved. The report will be the result of the
    data gathering and, displayed in a format that the users and senior management
    can easily interpret. It may be a good idea to produce the report in two forms:
    in a tabular form, even though it might be more difficult to read, it will provide
    accurate figures; and in a graphical form, it is easier to interpret and show
    where trends lie.


    Monitoring trends can be of significant value. The system manager could be warned
    of deteriorating performance and could address the issue before the impact is
    felt. Conversely, the senior manager could use the data to aid the forecast for
    the following year. The data could be used as a basis for the SLA reviews, which
    is changes may be made to the SLA as experience increases.'
  merge: -1
