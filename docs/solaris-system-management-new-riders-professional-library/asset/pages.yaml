- img_proc: true
  md: '# Useful Commands


    # Useful Commands


    Solaris contains a huge number of commands, all of which are useful in their own
    right and most of which are more relevant to the system administrator than the
    system manager. As such, these commands are very well documented in system administration
    texts. The objective of this section is to show a few commands and combinations
    to make the system manager''s job easier. This particularly applies to the management
    and manipulation of data files, predominantly used as logging facilities for different
    processes or applications. These files can easily become numerous if a new log
    file is created each time the process is run, or large, if logging data is constantly
    being appended to a log file, example.


    # Combinations of Popular Commands


    Commands are combined using the pipe () so that the output becomes the input to
    the next, and so on. The equivalent of an entire shell script can be written on
    the command line using this facility. Consider the following example, which can
    be used to move large numbers of files and directories in simple action.


    To move the contents of /data into a new location, /newdata, the following single
    command line will copy the whole directory structure:


    ```

    cd /data; tar * | (cd /newdata; tar x -)

    ```


    The command breaks down as follows:


    +   1. Move to the source directory (/data).

    2. Execute the tar command to archive all files in the current directory and write
    this to the standard output (this is normally the screen).

    3. The output is piped into the next command, which is actually two commands because
    of the parentheses. This first changes to the destination directory (/newdata)
    and then extracts the archive that was just created in the current directory.
    The parentheses ensure that the two commands are handled together.


    Most frequently used commands involve the commands grep, awk, and sed. These commands
    have extensive documentation—entire volumes are dedicated to the workings of sed
    and awk, so these commands are not discussed here in any detail.


    Consider the following command example, though, to the sort of command that can
    be easily executed.'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# 198 Chapter 9 Tactical Management


    The command itself spans two lines and extracts the process ID (pid) of the top
    process and then uses it as a parameter to the command ptree, which displays the
    process tree, including all parent processes as well as children processes. This
    can be very useful when trying to identify and (kill) the calling process of a
    hung process.


    ```

    treepid -ps -ef grep top|grep -v awk ''{print $2}'' \

    export treepid;/usr/proc/bin/ptree $treepid

    166 /usr/sbin/inetd

    28964 -ilnetd

    28966 -ksh top

    ```


    # find


    find command is arguably one of the most powerful commands available in Solaris.
    A popular use for it, however, is maintenance of file systems, where find is used
    to delete, say, all files matching a certain pattern or residing in a specific
    file system that is more than a specified number of days.


    For example, find could be used in the deletion of all core files (dump files
    generated by a process or application failure).This is a popular one because you
    might have a problem with a particular application using by 100 different users.
    Each time the failure is encountered, a core file would be created in the users''
    current directory, potentially creating 100 core files in 100 directories. The
    system administrator would require only one example to analyze or pass to the
    developers. Because these files can be quite sizeable (several megabytes), they
    can consume considerable amount of disk space. The command to delete all core
    files more than seven days throughout the system is shown here a daily basis (probably
    overnight).


    As the superuser:


    ```

    # find -name root -mtime +7 -exec rm -f {} \\

    ```


    Notice that there is no output as result—in this, find just goes away and carries
    out the operation. The sign that it has finished is the return of the shell.


    The system manager can use the find command for other purposes, may be to run
    a periodic check for files belonging to root and having world write permission
    allowed. This combination presents a security risk and should be discouraged,
    if the find command locate any matching files, it can automatically remove the
    writable bit to make it more secure and can log the name of the file. The command
    to do this and save the output (and any error messages) into a log file is shown
    here:


    ```

    # find -type f -user root -perm -o+w -print -exec chmod o-w {} \\

    >>/var/adm/rootsec.log 2>&1

    #

    ```'
