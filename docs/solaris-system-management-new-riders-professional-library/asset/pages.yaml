- img_proc: true
  md: '# Strategic Planning and Techniques 113


    A more local issue the system manager to address as part of the security policy
    is that managing the access for internal users, or employees of the company. It
    has to be recognized that in any computer network environment, there must be an
    element of trust; otherwise, nobody would agree to do anything, and the business
    would not function. Consider, for example, how you would protect against a corrupt
    system administrator with full super privileges. The answer is that, realistically,
    this is virtually impossible, which is where the element of trust comes in. For
    the rest of the users of the system, though, the system manager must analyze the
    potential risks to the security of the system (and the data) and determine how
    to provide them with sufficient access to carry out their jobs without compromising
    the system. The system manager needs to ask himself a few fundamental questions
    about each user (or group of users):


    +   - Does the user need have command-line access (a shell)?

    - Does the user have potential access to sensitive data?

    - Does the user require any special privileges


    These questions are deliberately broad in their scope, and companies should be
    able to ask more direct questions depending on the type of business being carried
    out. Still cover the major risks that a user could potentially gain access to
    more than they are legitimately entitled. The system manager could consider three
    general solutions: a restricted shell, captive accounts, or nonprivileged user
    accounts with enhanced auditing facilities. Each of these is discussed briefly
    here:


    +   - The restricted shell—This option is realistically useful only when a user
    carries out an extremely limited function, such as logging in to collect or deliver
    data. Using the restricted shell, there can be no traversing of the system directory
    structure. The command set that is available is very limited, too,


    +   - Captive accounts—For users who require specific applications, this is a
    more popular option. For example, the staff might use the system to access the
    sales and customer databases. In this case, when logging in the system, the user
    is taken straight into the application, with no opportunity to enter commands
    at the prompt. When the session is finished and the user quits the application,
    he is immediately logged off.


    +   - Nonprivileged accounts with auditing—When access to the command line is
    required, the best solution is to provide a nonprivileged account, reducing the
    amount of damage that the user can cause. For functions requiring greater access
    to the system or enhanced privilege status, use of software such as Sudo provides
    the necessary privilege while also limiting the access and auditing everything
    that is done. (Sudo is discussed in detail later in this chapter in the section
    "Products Available in the Public Domain.")'
