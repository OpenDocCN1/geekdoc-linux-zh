  md: '# Shared User Accounts


    Never allow users to share user accounts. Every user of a system must always be
    assigned a unique account that is to be used only by that person. As soon as users
    are allowed to share logins, accountability is diminished and the security is
    compromised.


    For further references on security issues, two excellent sites on the Internet
    provide regular bulletins and newsletters, as well as a wealth of security-related
    information:


    +   - The SANS Institute, at http://www.sans.org


    +   - CERT Coordination Center (originally called the Computer Emergency Response
    Team), at http://www.cert.org


    See also the Appendix, "Resources," for recommended further reading and Internet
    sites relating to Solaris security.


    # Out-of-Hours Policy


    When computer systems are running continuously, 24 hours a day, 7 days a week,
    there needs to be a policy in force for the hours when offices are unattended.
    Consider the scenario in Sun workstations configured as diskless are left in open
    space. If an intruder can gain physical access to the client, then it can be turned
    on. It will automatically boot across the network and end displaying the login
    prompt. Meanwhile, the intruder, watching the boot sequence, can gain all sorts
    of information concerning the network setup, such as the hostname, the IP address,
    the daemon processes that are running, and so on. If left long enough, he may
    be able to log in


    One way of stopping this with clients that boot across the network is to disable
    them from the server. This is accomplished simply by renaming a single file in
    the directory /tfootboot on the operating system that provides the client''s resources.
    The client''s boot filename is made up of the hexadecimal equivalent of its IP
    address and the kernel architecture. For example, a Sparse Ultra with an IP address
    of 210.127.8.10 would have a file named D27F080A.sun4u. By appending, said to
    the filename, it will fail to boot. When the file is renamed to its original name,
    the boot will succeed.


    Setting such policy is simple to implement and can be done automatically through
    the use of a shell script, even using cron to schedule its execution at required
    times.


    # Firewalls


    Most businesses allowing external connections make use of firewalls. Many suppliers
    produce firewall hardware and software, so it is perhaps suitable that a short
    discussion of the concept of firewalls appears here.'
