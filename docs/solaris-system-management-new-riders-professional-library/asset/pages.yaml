- img_proc: true
  md: '# Chapter 8 Strategic Management


    # Is Anyone Using This Expensive Package?


    One of the best uses of the accounting software that I have personally come across
    is using the software to determine whether a particular software product is being
    used and, if so, to what extent it could be that the product was expensive to
    purchase, was requested as a high priority, and demanded full technical support.
    However, on running the relevant query, the system manager can interrogate a number
    of monthly reports and find out exactly how many invocations of that piece of
    software have occurred. Sometimes it turns out that the software hasn''t been
    used for months, and yet the system manager has been paying for full technical
    support—and even when it was used, by only one user, who has since left the company.


    This scenario is not typical, but demonstrates the need for the system manager
    to keep a “watching brief” on the usage of software products. The information
    obtained from such analysis can prove extremely useful when deciding on future
    support and licensing requirements, and it can be instrumental in providing the
    justification for whichever decision is taken.


    # Using the whodo Command


    The whodo command provides information on commands, but this command details processes
    that are currently running. The output from the command is easier to read than
    the output of ps: It provides a snapshot of what is currently being executed,
    as opposed to commands such acton list historical information about commands that
    have previously run (and completed).


    The whodo command, in conjunction with the ps command, is also useful for investigating
    why a system might be suffering from poor response.


    # Summary


    The system manager implements strategic management policies to try to anticipate
    potential problems and prevent them from occurring rather than simply dealing
    with them after the fact.


    Support and maintenance agreements ensure that the systems under the system manager’s
    control are adequately protected if a system fails. The system manager must also
    ensure that the level of support is right and strike a delicate balance of providing
    value for money and protecting the interests of the business.


    Documenting the systems is extremely important, especially if the documentation
    is to be used as part of a disaster recovery plan. The information provided must
    be up-to-date if it is to be of any real value and also must be comprehensive
    to cover all aspects of the systems under the system manager’s control.


    A form of configuration management, such as SCCs, strengthens the integrity of
    the systems by providing a fully documented history of changes made to configuration
    files, administration scripts, or system documentation.


    The system accounting software is an excellent tool for monitoring the activity
    on the systems. The information it provides can be used to assist with future
    planning and license renewal, and to identify trends in command usage, to name
    but a few uses.'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# 9 Tactical Management


    THE SYSTEM MANAGER’S PRIMARY RESPONSIBILITY is not solely to provide an IT service,
    but also to maintain it in an efficient, reliable, and cost-effective manner.
    The precise level of service provision and user expectations is normally the subject
    of a service agreement (SLA) between the IT department and the user requesting
    the service. Discussed in Chapter 3,"Delivering the Goods," SLAs clearly define
    the operating parameters and any mutually acceptable tolerances.


    This chapter discusses the tactical aspect of managing a Solaris environment,
    the necessary tasks and procedures that will ensure the achievement of any SLA
    targets. It is not solely about the provision of the service;it is also about
    maintaining that service in an efficient and reliable manner. The tactical management
    aspect involves the daily supervision of the Solaris environment, including routine
    operational management, monitoring and analysis of system log information, and
    monitoring of the performance of the systems, taking remedial action where necessary.
    The first section in this chapter investigates the daily procedures that need
    to be carried out to provide a fully administered environment. The system manager
    is not a system administrator, but he is responsible for these procedures and
    ensure that the necessary actions are being guaranteed (as far as is reasonably
    possible) the continuity of service or above the required level.


    Management of outages is also an important aspect. Scheduled outages need to be
    coordinated efficiently, and unscheduled outages require a mechanism for keeping
    the customer informed—that’s not so easy when there’s no system!'
  merge: -1
  pgno: 194
- img_proc: true
  md: '# 178 Chapter 9 Tactical Management


    If configured correctly, the system logging process provides essential information
    for monitoring the systems effectively. This chapter also identifies the level
    of logging delivered by default when the Solaris operating environment is installed.
    A surprising number of installations use the default values without investigating
    what else could be done. A brief description of the user account maintenance procedure
    is included, as is information on how making use of user groups can help the system
    manager make multiple configuration changes very easily.


    The subject of performance monitoring is considered here because the system manager
    is responsible for the continued provision of an acceptable service. This chapter
    discusses some of the symptoms to look for when analyzing performance and the
    tools that can be used.


    The final section in this chapter investigates some useful commands that can help
    the system manager, particularly combinations of frequently used commands to obtain
    specific information. Some other commands relevant to the manipulation of text
    files and data are discussed as well. These commands are frequently forgotten,
    but they can save a lot of time with large amounts of data, whatever the system
    manager is likely to use when compiling periodic reports.


    # Daily Procedures


    The system manager has a primary responsibility for providing a continued level
    of service. There, he must ensure that certain essential tasks are carried out.
    Some of these tasks need to be done only once a day, for example, while others
    must be carried out at regular intervals throughout the day. The purpose of this
    section is to identify the tasks that need to be done to provide the best possible
    service to the customers.


    Some system managers like to use a checklist approach in which the system administrator
    manually completes a list of required actions and ensures confirmation either
    on a hard copy or into a file on the system. This approach is perfect for junior
    system administrators in the process of learning how to do the job, but it is
    less appropriate for a senior system administrator, who might resist the implication
    that he is not trusted to do his job properly. The system manager must make a
    judgment call on how this is handled. My own preference is to use the mandatory
    checklist only for junior administrators in the first few months because it reinforces
    and reminds them of the tasks that need to be carried out, and helps them with
    their own development.


    It is worth restating that the system manager does not expect to have to do the
    system administrator''s job, but he does to possess a good knowledge of what is
    involved in keeping the systems running. Of course, the system manager is also
    responsible for the administrator from a personnel perspective as well as a technical
    one and will no doubt to assess his performance at least on an annual basis. Unless
    he knows what his staff is doing (or is meant to be doing), it is difficult to
    accurately assess performance.'
  merge: -1
  pgno: 195
- img_proc: true
  md: '# What Must Be Done?


    The following is a list of the tasks that must be carried out. The system manager,
    together with the system administrator(s), should review the daily procedures
    on a regular basis to ensure that everything that needs to be done is done. To
    some, this may seem the obvious, and sometimes it is. However, the system manager
    is ultimately responsible, and with companies relying heavily on the continued
    availability and performance of the IT systems, must be sure that they are monitored
    in a professional and efficient manner:


    +   - Check the systems—The first thing that must be done is to determine the
    current status of all systems, ensuring that they are all available and operating
    correctly. This is the highest priority because a system that is down or in a
    hung state will seriously affect the business. A network management utility like
    will be running in larger organizations, but may not capture a struggling or underperforming
    system. The system messages /var/adm/messages should be examined on each system
    to see if any errors have occurred. This check is invaluable because it can highlight
    the beginning of a problem, such as a memory module getting intermittent (and
    correctable) errors. In this instance, the module can be replaced before the error
    has any detrimental effect on the performance or availability of the system.


    Course, most organizations running high-availability environments make use of
    a monitoring or management tool, such as Solstice Site or Domain Manager (discussed
    in Chapter 14, "Network Management Tools"), or for smaller, less critical environments,
    a monitoring application such as Big Brother (discussed in Chapter 13, "Network
    Monitoring"). However, these applications still need to be monitored and occasionally
    modified to reflect changes in procedures or the environment. The downside, if
    there is one, is that too much reliance on automation products can gradually diminish
    personal skills due to absence of use. It doesn''t hurt to do it manually in a
    while—one day it might be necessary!


    +   - Deal with any help desk trouble tickets—See if any incidents have occurred
    that should be aware of. This includes general incidents, such as network problems,
    that could adversely affect the systems and the processing carried out on them.


    +   - Check application logs—An inspection of any application logs, especially
    for custom applications, is required to see if any errors have occurred. Tools
    such as Expect and Analog are freely available in the public domain. These can
    scan out or very large log files in a fraction of the time it would normally take.
    These tools also can flag any messages that might be of interest or require addressing.'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# Chapter 9 Tactical Management


    +   - Examine the processes—This check looks particularly for "runaway processes"—that
    is, processes that are constantly using system resources and have been disconnected
    from owning processes. A good example of these can be found in organizations where
    terminal emulation sessions are used, or client/server database applications.
    Runway processes occur most frequently when a user simply turns off a machine
    at the end of the workday logging out in the proper manner. The processes consume
    amounts of system resources and eventually slow the system to an unacceptable
    level. The top command is commonly useful to monitor the state of processes on
    the system; it''s particularly useful in this instance because of the refreshing
    display that highlights processes of this nature.


    +   - Check the backup logs—When it has been established that the systems are
    functioning correctly, check the backup logs to make sure there aren''t any errors
    that could affect the integrity of the backup. This task, of very high importance,
    is normally done after the system status has been verified because the previous
    checks are relevant to the real-time operation of the system, where the backups
    have already run and involve historical information.


    +   - Examine security logs—Examine files such as /var/adm/suglog,/var/admin/login
    and sudo if you''re using sudo. These files will report instances of attempts
    to gain access to the superuser account, repeated attempts at login when the password
    was not entered correctly, and all instances when the sudo utility was used—both
    successfully and unsuccessfully.


    +   - Monitor disk space—Keep a regular watch on disk space utilization. This
    can cause problems when a process encounters a failure and continually writes
    to a log file. An entire disk can be filled up very quickly, sometimes in minutes.
    Again, a monitoring tool such as Big Brother can detect this and page out the
    administrator. A management tool can also be configured to take some predefined
    action in an attempt to rectify the situation.


    +   - Monitor performance—Performance utilities such as vmstat install should
    be run regularly to check that no performance issues affect the business''s capability
    to carry out its function. Performance monitoring is discussed in more detail
    later in this chapter in the section "Performance Monitoring."


    This list is not exhaustive: Different organizations will have other priorities,
    depending on the nature of the business being carried out. However, this list
    gives a general appreciation of the kind of things that must be done.'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# Managing Outages


    System and network outages can seriously affect availability targets normally
    set as part of a service level agreement. The system manager must try to be as
    realistic as possible when agreeing to an acceptable level of availability, taking
    into account any scheduled maintenance outages that might be essential to maintain
    the computing environment. These outages may not actually be on the systems themselves,
    but they could be periodic maintenance on air conditioning units or the uninterruptible
    power supply (UPS), for example. On these occasions, it is sometimes necessary
    to shut down all the systems, although this can often be avoided when sufficient
    redundancy to allow the operation to continue when part of the environment is
    disabled.


    # Scheduled Outages


    Undoubtedly times will arise when a scheduled outage is needed, usually for a
    major upgrade or for work on the power supply. It is the responsibility of the
    system manager to coordinate the outage of any system under his control and ensure
    that any disruption to the operation of the business is kept to an absolute minimum.
    If there is a "quiet" time, such as during the middle of the night or on weekends,
    the system manager should take advantage of these where possible.


    The most important thing, is to keep the user community informed of any scheduled
    outages so that users can also plan their activities around it. To this end, three
    facilities are available on Solaris systems—the "Message of the Day" file, email,
    and message broadcasting:


    +   * **Message of the Day file (MOTD)**—Whenever a user logs in to a Solaris
    system, the contents of this file are displayed on the screen. Place notification
    of any upcoming scheduled outages clearly in this file so that users are kept
    informed. Conversely, if the outage is cancelled for any reason, the file should
    be updated to reflect the amended situation. This can be edited using any normal
    editor, such as vi, and can be found in the /etc directory as file mot.


    +   * **Email**—Using to inform users of forthcoming scheduled outages is less
    than ideal because there is no guarantee that every user will open the email that
    has been sent. Thus, some users might never know that there is to be an outage.
    Email presents just another method of contacting the user community.


    +   * **Message broadcasting**—In this instance, a message is sent to every user
    logged in the system through the use of the wall command. The message flashes
    on the user''s screen and carries an audible beep. This kind of message is normally
    used immediately before an outage, to give the logged-in users the opportunity
    to save their work and log out. Typically, a message might be sent 30 minutes
    before an outage, reminding that the outage will shortly commence. Further messages
    10 minutes and 5 minutes before the outage remind the users that they are getting
    ready to log out. Finally, a message is sent informing users that the system is
    going down.'
  merge: -1
  pgno: 198
- img_proc: true
  md: '# Unscheduled Outages


    When the system is unavailable due to an unscheduled fault, it is difficult (if
    not impossible) to inform the user community of resolution progress or an estimated
    time of return to normal operation.


    To combat this situation, many organizations employ other methods of providing
    essential information at such times:


    +   * **Telephone answering machine**—This option is suitable for smaller organizations
    where users can telephone a specific number to obtain information about the current
    status of the systems. The IT staff is responsible for keeping the answering machine
    recorded up-to-date. If a serious outage occurs, the message should be updated
    every 5 or 10 minutes, even if there is nothing to report—this demonstrates a
    professional approach to keeping everyone informed.


    +   * **Help desk updates**—Inform the help desk that the problem has occurred,
    and keep the staff updated on progress and estimated time of recovery. This will
    avoid multiple trouble tickets being raised for the same problem.


    +   * **Do a voice broadcast**—Many companies have a voice broadcast system used
    for announcements. This facility can be used to convey information to all users
    in the same building regarding a system outage. Regular updates keep the user
    community informed of any progress or expected resolution time.


    +   * **Use a tickertape system**—Large organizations frequently use tape systems,
    which can be centrally controlled and administered. This system can convey messages
    to alert users to an incident, and the messages can be quickly updated to reflect
    an amended status. These types of systems are also useful for informing users
    of virus attacks, especially through email attachments. The advantage is that
    the message can be left on for extended periods, reminding users of the threat.


    Of, most users tend to have a PC running a corporate email system and probably
    informed of a Solaris system outage via this method. This list definitely would
    apply if some users relied totally on the Solaris systems to carry out their business.


    # System Logging (syslogd)


    Solaris, along with the majority of other flavors of UNIX, uses the syslog process
    for its main system logging. It traps various events and forwards the system messages
    to a specified location, which can be a screen or a file, or even to a remote
    system, as dictated by the configuration file /etc/syslog.conf. The default configuration
    file is shown in Listing 9.1.'
