  md: '# Strategic Planning and Techniques


    When a user wants to use a service, these steps are followed (they would normally
    be carried out as a script or as part of the service requests, not manually):


    +   1. The user runs knit and requests a ticket-granting ticket (TGT) and a session
    key from the Key Distribution Service (KDS), which is the Kerberos server.


    +   2. KDS receives the request and returns an encrypted TGT and which are encrypted
    using the user''s password. The user enters the password to decrypt the TGT and
    the session key,


    +   3. Now user runs login, which requests a service ticket from the Ticket Granting
    Service (TGS).The user sends the TGT received from KDS, the session key, and a
    service request.


    +   4. The TGS authenticates the request by examining the session key. The TGS
    sends back a service ticket and a session key to the user, who decrypts them.


    +   5. The user sends the service request to the provider of the service, along
    with the service ticket obtained from the TGS and the authenticator, similar to
    a reference, proving that he is who he says.


    +   6. The service provider decrypts the TGS ticket and authenticates the request.
    The service now starts.


    Figure 6.4 the kerberos authentication process in action. The numbers on the diagram
    refer to the steps in the process just listed.


    ![](img/20459f772e7361286cec3e76e3bd26b4_144_0.png)


    Figure 6.4 The authentication process of kerberos is similar to obtaining a reference
    from a trusted person known to both parties.'
