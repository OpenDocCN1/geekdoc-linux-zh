  md: '# Service Level Management


    Development services costs—This is the amount of time required by development
    services, to fix bugs or provide enhancements. This element would also be included
    if outsourcing was being considered.


    Management overhead costs—This is the necessary overhead that is built into the
    overall cost of providing the service. This element is often omitted because it
    is not seen as a direct cost. Note that an element of the management overhead
    would still exist if the service were to be outsourced, although it would be proportionately
    reduced.


    Media and consumables—This element is not normally considered when deciding to
    outsource a service, but it can still be considered as part of the overall cost
    of providing the service.


    Administrative support costs—These costs relate to the production, copying, and
    distribution of reports, as well as the secretarial duties to the provision of
    the service. Again, this is another element that is frequently overlooked, but
    it should be included if an accurate cost of providing the entire service is to
    be calculated.


    Clear definition of responsibility—An SLA defines exactly what is responsible
    for providing a service or part of a service. This aspect becomes more apparent
    when a service is outsourced, especially if more than one supplier is involved.
    For example, consider an SLA covering several remote sites as well as a central,
    primary site. If a restore request is received for a file that is resident on
    a remote system, the SLA provides sufficient information to determine which carries
    out the system administration duties, preventing the request from “falling through
    the gap.”


