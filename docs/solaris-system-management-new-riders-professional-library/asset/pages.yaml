  md: '![](img/20459f772e7361286cec3e76e3bd26b4_32_0.png)


    # 2


    # The IT Budget


    THE SYSTEM MANAGER NORMALLY HAS SOME INVOLEMENT with the IT budget as part of
    his job, although the level of involvement depends on the extent of his responsibilities
    and the size of the enterprise. His budget will form only part of the overall
    IT budget, with this budget being the responsibility of a senior manager, such
    as the CIO or director of IT.


    Small businesses do not tend to have a separate IT budget because it is not warranted.
    Instead, IT expenditure may be itemized as a percentage of the total expenditure,
    separated out for tax purposes. In this case, the company accountant manages the
    finances easily.


    In larger companies, though, the budget is quite considerable, running from several
    million to tens of millions of dollars. The finances for IT services must be managed
    to demonstrate value for money, particularly when service level agreements are
    present.(See Chapter 3,“Delivering the Goods” for a detailed discussion of service
    level management.


    This book focus on larger organizations in which there are probable cost centers
    within the main IT budget and in which the issues are a great deal more complex
    than smaller companies. The following list gives a selection of possible areas,
    in no particular order, that would be covered by the IT budget. The items marked
    with an asterisk (*) denote that are normally considered part of the system manager''s
    budget. The remaining items would be managed by other department managers, such
    as the operations manager or the network manager.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '+   Development services *

    Asset replacement and upgrades *

    Desktop PC management and support

    Host systems management, support, and administration *

    Database management, support, and administration

    Application integration and delivery

    Administration *

    Network management, support, and administration

    Project/stage management

    Infrastructure management/strategy *

    Computer operations

    IT management *

    Software licenses *

    IT manpower resource *

    Training *

    Expenses and transport *

    Leasing of communications *

    Consumables *

    Research and evaluation of new products


    Notice from this list that the IT budget does not merely cover computer hardware
    and software. A number of “overheads” are often omitted when the cost of providing
    a service is calculated, with management overhead being a prime example.


    This chapter provides an overview of the IT budget, specifically relating to the
    system manager, covering some of the issues and constraints that he is likely
    to encounter. It also aims to give some practical guidance when trying to forecast
    expenditure. The final section in this chapter discusses the chargeback method
    of earning revenue that some companies employ.


    # Staff


    A company’s greatest asset is its staff. Without staff members, there would be
    no company. As the budget holder, the system manager must take into account the
    financial costs of staffing his department for the financial year. He must be
    aware of corporate pay increase structures and perform may-related pay issues.
    Both of these can have an effect on the forecast that he is preparing. A further
    consideration is whether any members of staff are likely to be promoted and, hence,
    take an additional rise in salary.'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'As the list in the previous section shows, the system manager’s budget does
    not only involve the technical staff. He might have responsibility for a secretary
    and administrative staff, such as people involved with planning and coordination,
    positions that all must be funded by his budget.


    The following sections take a brief look at suggestions for sizing the support
    section for a Solaris network, some options for running a department around the
    clock, and the question of salaries for system administrators and equivalent roles.


    # # How Many?


    The number of staff members required depends on the size and complexity of the
    systems or network, but the following pointers should help.


    The configuration of the desktop workstations can have a significant impact on
    the number of staff required for system administration and support. The current
    configurations supported with Solaris 7 are diskless, standalone, and AutoClient.
    The trade-off with configurations is between performance, security, and ease of
    administration. The pros and cons of each are discussed briefly:


    +   - **Diskless client**—A diskless client performs the worst because it needs
    a server to provide its resources and it places a greater load on the network.
    It is the best for security and also for ease of central administration. All configuration
    and management is done from the server, and the client is easily replaceable in
    the event of a failure. There is no requirement for a local backup.


    +   - **Standalone**—Standalone configurations perform the best because they are
    selfcontained—they have a local hard disk containing the operating environment,
    swap space, and, optionally, data. A standalone workstation is usually connected
    to the network but does not require it to operate. It is the worst for security
    and also for centralized administration. The standalone workstation configuration
    requires its own backup to guarantee the integrity of the filesystems. Replacement
    of a standalone workstation is more difficult, with a reinstallation of the operating
    environment or a complete restoration from backup tape being required.


    +   - **AutoClient**—AutoClient configurations perform better than diskless clients
    because they use cached filesystems stored a local hard disk. A server is still
    required, but the load on the network is reduced. Security is better than standalone
    because no permanent data is held on the local hard disk and no local backup is
    required. AutoClient systems are also administered centrally. The unit is easily
    replaceable in the event of a failure.


    Of course, diskless and AutoClient systems require the presence of servers, but
    the administration and support is generally more manageable.


    Consider a network with 500 Solaris desktop workstations, then the administration
    requirement is much higher, with more visits to the workstation needed to provide
    the necessary level of support. If the'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'workstations are configured as diskless or AutoClient clients, then administration
    is carried out centrally from the server. For example, with the installation of
    a security patch, AutoClient systems can be automatically synchronized with the
    server, whereas each standalone workstation will need to have the patch installed
    separately.


    To summarize, diskless or AutoClient configurations can be managed with up to
    50% less staff than a configuration using standalone workstations.


    # 24×7 Working


    Many IT departments are required to support their systems on a 24×7 basis. Some
    are required to do this without the necessary additional funding that normally
    demands. So how can it be achieved? The following sections explore a few possibilities
    that could be investigated.


    # Computer Operations


    If the department is required to support 24×7 operation, then there likely is
    already a computer operations staff presence, probably maintaining other systems
    (mainframes and so on) on a 24x7 shift roster. If this is the case, then it might
    be possible to make use of them for the Solaris network as well.


    That is exactly what I did working with the diskless client mentioned previously.
    Sufficient training was provided to allow some of the staff to carry out basic
    administration of the systems, with the support section being available (on call)
    if required. The objective was to make the best use of the resources available.
    It allowed the operations staff to continue with the normal running of the systems,
    with the advantage of having a second-line support on call. This solution was
    also beneficial because I was sometimes able to talk through resolutions over
    the telephone rather than tend to the problem myself.


    # Automation


    Through the use of automation tools and procedures, it is possible to reduce the
    number of staff required to monitor the systems efficiently. As a system administrator,
    I wrote and implemented two tools for operations staff to use:


    +   - A network monitoring console using the unbundled product, SunNet Manager
    (now incorporated into Solstice Domain Manager). A graphical representation of
    all the servers and clients allowed the Sun network to be monitored from a central
    position. Some additional agents provided extra facilities.

    - A GUI-based tool written to allow housekeeping duties to be carried out with
    superuser privilege (as setuid programs). These included enabling and disabling
    workstation access with the servers, monitoring overnight backup logs, and others.
    This tool was used in conjunction with the SunNet Manager application mentioned
    previously. It could be invoked from any of the graphical icons on the central
    monitoring screen.'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'The provision of these tools allowed the computer operations section to monitor
    the Sun network beyond normal working hours using only a percentage of one staff
    member''s time. This was absorbed into the normal workload without having to increase
    the shift complement, or it provided 24X7 coverage without increasing costs. The
    only costs involved were the initial training and some on-the-job familiarization.
    The whole exercise proved beneficial all around because the operations staff gained
    valuable UNIX/Solaris experience that provid them with a new career development
    option.


    # On Call


    If funding is limited, then perhaps it is possible to have the system administration
    staff on call beyond normal business hours with dial-in/remote access. This can
    work extremely well, with staff paid only for the hours actually worked instead
    of being present all time. A standby cost might be incurred, although it is usual
    for 24X7 coverage to be built into the base salary package.


    In any case, having staff on call is significantly cheaper than having extra staff
    in attendance on a 24X7 basis. On some occasions the on-call staff will not be
    called at all, representing significant savings. Of course, the practicalities
    of this option depend on the priority and nature of the systems. One popular method
    of achieving remote support is to connect the system consoles to a terminal server
    so that staff members can access them from home, further reducing the likelihood
    of site attendance.


    # Choosing a Method


    The list at the beginning of this chapter is based on personal experience having
    to provide 24X7 support to a large Sun network with limited funding. Whether these
    options are of any use depends on the type of business, the purpose, and the priority
    afforded to the systems. A large number of businesses are busy during the core
    hours (0800 to 1800) and then have a quiet time when all the “day staff” have
    gone home. If it is the case, the possibilities outlined are viable. If not, and
    the level of activity is approximately the same all the time, then you have really
    only two options: Employ extra staff, or implement some automation tools to reduce
    the number of staff needed. It may be possible to stretch the reduced resources
    to form a shift roster.


    # How Much?


    As part of the budget proposal for the coming financial year, the system manager
    must estimate the cost of manpower resources. It can be a difficult task to recruit
    the right skills, but it can be even more difficult to know how much the skills
    are worth. The system manager must find out the salary range that he''s expected
    to pay.'
  merge: -1
  pgno: 36
