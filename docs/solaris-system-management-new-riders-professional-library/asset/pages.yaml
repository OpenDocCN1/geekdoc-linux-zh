- img_proc: true
  md: '# Chapter 8 Strategic Management


    becomes outdated and loses any value it had. One way of making the documentation
    easier to update is to include the output of Solaris commands, such as the one
    used in the earlier section “Patch Status.” If a new patch is installed, the documentation
    can be quickly and simply updated to reflect the change by running the command
    and “pasting” the output—this also makes the updating more likely to be done altogether.


    # Presentation or Content


    Including command output can affect the presentation quality of the document.
    Although it is important to present the system documentation professionally, the
    content and ease of update should be the overriding priority.


    The system manager must ensure that the system documentation is regularly updated,
    either each week or, at the most, each month. The best policy, of course, is to
    update the document as part of carrying out a change, while is still fresh in
    the mind of the system administrator. It may not always be practical to do this,
    but the longer the interval between updates, the greater the risk of omission
    or errors becomes.


    # Configuration Management


    Configuration management is normally associated with the development process,
    in which vast amounts of source code, documentation, and test packs are stored
    in a repository. It provides a control mechanism for all changes that are subsequently
    made, as well as a facility to revert to previous versions of code, if necessary.


    In reality, it''s not just the development section that can make use of configuration
    management—a number of other uses could be of value to the system manager. Some
    of these are listed here:


    +   - System administration scripts

    - System documentation

    - Important system configuration files


    # The Need for Configuration Control


    With business-critical systems and applications, it is imperative that control
    mechanism exists to manage changes made to systems (particularly live production
    systems), even though any changes should have been thoroughly tested on nonfiction
    systems before implementation.


    The use of a configuration control package such as the Source Code System (SCCS),
    bundled with the Solaris operating environment, provides the facility to track
    changes made to a program or file. Equally important, however, a configuration-control
    package provides a history, documented evolution of how the program or file became
    what it is and the changes made along the way. If documentation has also been
    present, normally in the form of comments, this will include an explanation of
    why a specific change was made or a reference to the request that initiated'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# Keeping Track of Changes


    Using SCCS as an example, a new version of the file is created and managed each
    time it is updated. This new version is stored in a subdirectory—by default, it
    is named SCCS. Each file present in the directory is prefixed with s_, so the
    script sys_monitor.ksh, for example, would be stored as s.sys_monitor.ksh within
    SCCS.


    Consider a real-life Solaris example. Whenever an important system file is changed
    (such as /etc/system, which contains kernel configuration information), it is
    recommended to make a copy of the file, as an obvious precaution. A common scenario
    is to copy the file, to /etc/system.bak. When a subsequent change is made, the
    history is lost because it is overwritten. By storing the versions of the file
    in a control system such as SCCS, the history is preserved and can easily be referred
    to. SCCS maintains a check-in and check-out control so that if a file is retrieved
    it is to be checked out, similar to a rental system. As a result, no one else
    can change the file until it is checked again.


    # It Could Affect Others


    If no form of configuration management is used, a new system manager or member
    of staff joining the administration team will have difficulty seeing and how previous
    changes were made to either configuration files or administration scripts, for
    example. Configuration management provides a fully traceable history that can
    be used for familiarization purposes and for investigating future problems.


    This is also an important aspect to consider if files or scripts are being shared
    with other departments—the disaster recovery documentation is a good example.
    In this instance, the correct version of the documentation can easily be identified
    to ensure that all parties are using the current version.


    Finally, the documentation for a specific system would highlight the availability
    on the system, who uses them, and approximately how many users there are. This
    information can be used to see at a glance the effect on the business if this
    system is taken out of service or for any reason. The documentation can also provide
    useful input when attempting to prioritize systems by their importance to the
    business functions.


    # Big Brother’s Watching


    The system manager and the administrator have considerable power over the Solaris
    systems. The only elements they might not be able to see are those that have been
    privately encrypted; anything else is readily accessible. The superuser (root)
    has unlimited access to all directories and files on the system—the title of this
    section. These privileges are not exclusive to UNIX or Solaris—the same is true
    of VMS, Novell NetWare, and so on—but they are necessary for effective system
    management and problem resolution.'
  merge: -1
  pgno: 188
- img_proc: true
  md: 'This section takes a look at some of the information that the system manager
    can obtain about when a user was logged in and for how long, what commands were
    executed, and so on. In reality, though, a system manager often doesn''t have
    the need or the time to go searching for a specific user’s command history of
    activity—although it could be done to investigate abuse of the system. This is
    normally used to gather statistical information, to see how many times the StarOffice
    package was used last month with the month before, or to determine whether a particular
    software package is being used at all.


    The following subsections discuss the use of the system accounting software to
    obtain and collate the kind of management information that is required. They also
    examine the who command, which provides a snapshot of the commands being executed
    at the time.


    # Using the System Accounting Software to Your Advantage


    The accounting software is capable of more than just providing financial information
    based on computer usage. In fact, the concept of billing for customer time is
    becoming outdated, unless the company is using an external bureau for its needs.
    Most system managers charge customers an agreed fee, say, for a year; the fee
    is based on the cost of providing the service rather than how much CPU time is
    utilized.


    The system manager can make better use of the software and use the information
    derived from this data to see, for example, what software packages are actually
    being used and how much. This kind of information is invaluable for assessing
    license renewals or levels of support required.


    # Enabling the Accounting Software


    The system accounting software is not enabled by default when the Solaris operating
    environment is installed. A number of steps must be performed to initiate the
    accounting:


    +   1. Become superuser (root).


    +   2. The packages SUNWacc and SUNWacc must be installed before the accounting
    software can be used. Check the status using the pkginfo command. If these packages
    are not installed, add them using the pkgadd command or the adminintool facility.


    +   3. Install the script /etc/init.d/acct as the startup script for Run Level
    2 so the accounting software is activated when the system is restarted. This is
    achieved by creating a link in the /etc/rc2.d directory, as shown here:


    ```

    #ln /etc/init.d/acct /etc/rc2.d/S22acct

    ```'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# Big Brother''s Watching 173


    +   4. Install the script /etc/init.d/acct as the stop script for Run Level 0
    so that the accounting software is shut down cleanly when the system is stopped.
    This is achieved by creating a second link, this time in the /etc/rc0.d directory,
    as shown here:


    ```

    #In /etc/init.d/acct /etc/rc0.d/K22acct

    ```


    +   5. Modify the crontab for user admin to install the automatic management scripts.
    The following lines should be added to the crontab:


    ```

    0 * * * /usr/lib/acct/ckaccount

    30 2 * * /usr/lib/acct/runacct 2> /var/adm/acct/nite/fd21log

    30 7 1 * * /usr/lib/acct/monacct

    ```


    These entries are suggested defaults and can be amended, if required.


    +   6. Modify the crontab for user root to automatically run the command dodisk,
    the disk accounting program. The following line should be added to the crontab:


    ```

    30 22 * * /usr/lib/acct/dodisk

    ```


    This entry is a suggested default and can be amended, if required.


    +   7. Edit the file /etc/acct/holidays if it is to be used. Each line contains
    the date of a public holiday. These days will not be treated as normal working
    days by the accounting software.


    +   8. The system accounting software will be started automatically the next time
    the system is restarted. Alternatively, it can be started immediately by running
    the following command as user root:


    ```

    #/etc/rc2.d/S22acct start

    ```


    # Where Is The Data Kept?


    The system accounting software stores all its data in the /var/adm as a separate
    file system to protect the root file system (/) from becoming full. In larger
    systems, this is still common. The importance of doing this has reduced considerably
    due to the high disk capacities available today, although some companies still
    do this as part of their configuration policy.


    The main accounting file is /var/adm/pacct. This contains the active process accounting
    information. It is reset each day when the runacct program is run automatically
    via cron.'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# 174 Chapter 8 Strategic Management


    The directory /var/adm/acct also contains three further subdirectories, fiscal,
    nite, and sum. These subdirectories contain the following information:


    +   - fiscal—Reports by fiscal period is normally a monthly period, but it can
    be configured to use the company''s owner reporting period. The reports are created
    when the monact program is run automatically via cron.

    - nite—Daily binary summary files, a daily processed accounting record, and disk
    accounting information. These files are created daily when the runacct program
    is run automatically via cron.

    - sum—Cumulative summary accounting files and daily reports. These are merged
    when the monthly file report is generated.


    Some of the merged reports produced by the various accounting programs are available
    in ASCII text format and therefore readable by any editor or can be used as part
    of a more general report on system activity. Other files are held in accounting
    data format designed to be accessed using programs as acctcom, acctms, and actpre,
    located in the /usr/lib/acct directory. These programs extract processing and
    command information, the output of which can also be saved to ASCII files for
    further analysis.


    # Common Usage Statistics


    The system manager needs statistical information about the activity on the system
    for a variety of reasons. The best place to get this information is from the accounting
    report located in the fiscal directory.This is an ASCII format report that can
    be easily manipulated and searched, using either an editor or a shell script.
    A number of fiscal reports can be searched to provide information on trends. Figure
    8.2 shows a graph created using the output from three fiscal reports to display
    the trend in usage for the shells and the StarOffice suite as well as the sudo
    command.


    ![](img/20459f772e7361286cec3e76e3bd26b4_191_0.png)


    Figure 8.2 The graphical representation of the data makes it easy to see the upward
    trend in the usage of the selected commands.'
  merge: -1
