  md: '# Some Publicly Available SLA Samples


    It is often valuable to be able to see real-world examples. They can provide an
    extra dimension of perspective that might otherwise missed. The following list
    shows a number of publicly available examples that can be viewed on the World
    Wide Web and may serve as useful references:


    +   - http://cast.stanford.edu/services/

    - http://help.oit.unc.edu/ctc/sla/tsld001.htm

    - http://etc.nin.gov/pages/etcservicelevelagreement.html

    - http://www.ucsf.edu/its/policy/slasum.html


    # Summary


    This chapter is not intended to provide a comprehensive guide to service management.
    It is intended to provide sufficient insight into the types of issues that may
    be addressed.


    Service level management is about value for money and quality of service. The
    two terms are fundamental to the whole process. The provider of the service is
    expected to deliver a specified, agreed, level of service, and the consumer requires
    value for the money spent on the service.


    A service level agreement is a contract between two parties that comprises an
    agreed definition of the service to be provided and a number of tolerances that
    must not be exceeded. If they are exceeded, however, defined escalation procedures
    describe how to proceed.


    An SLA is only as good as the information available to support it. There must
    be accurate, reliable, and timely data so that performance can be verified.


    The example scenario demonstrates the need for a system manager to be absolutely
    certain that he can provide the level of service being requested before agreeing
    to it.'
  merge: -1
  pgno: 73
