- img_proc: true
  md: '# The Roles of the System Manager


    # Interpreter


    In some ways, the system manager can be likened to an interpreter in that technical
    jargon is translated into plain language. When a problem disrupts service to the
    customers, senior management will want an explanation at some point of what went
    wrong and what was done to fix it. The system manager provides the explanation
    in clear, understandable language, with the objective of explain things without
    hearing—“And what exactly does all that mean?” from the listener.


    It’s just a case of explaining the problems—the system manager also must try to
    secure the backing and, more important, the money for a new project. The system
    manager is the person who will fully understand the technical implications and
    issues surrounding any new venture. He can also relate to the relevant areas of
    the business, highlighting the predicted gains to be achieved.


    # Marketing and Sales Manager


    The IT department is one of those areas in which everyone makes use of it to do
    their own jobs, but it rarely gets an Oscar, much like the someone working behind
    the scenes of a major movie production. It falls to the system manager to raise
    the department’s profile and has at his disposal a number of opportunities to
    do this; they must be seized and capitalized on so that senior management is reminded
    of the important contribution being made to the business. This is crucial for
    the department to keep up with technological advancements. Some of those opportunities
    are listed in this section.


    Giving a computer suite tour is an ideal opportunity to give the IT department
    some visibility. The chance to tell others how good the department is and how
    much it has achieved–don’t waste it!


    The system manager is the perfect choice to present the tour because he has technical
    knowledge and understands all the jargon, but more importantly, he can talk about
    a technical subject to a nontechnical audience and relate it to the business.
    As an added bonus, he can answer correct questions that arise from time to time.


    Take an example: The sales director is visiting, has a nontechnical background,
    and has adopted the Internet Sales Web site as his project. This is sufficient
    information for the system manager to know that anything to do with the Internet
    Web site, or the systems supporting it, will be of interest and will capture the
    attention of the visitor. Even better, if some improvements have been made by
    tuning the system to make response times faster, this will do no harm when asking
    for more money in the budget next year!


    But it’s not just the computer suite tour that can raise visibility of the IT
    department. The system manager will have to provide a regular report or summary.
    This can be a useful vehicle for highlighting instances of considerable success
    and ensuring that they get the correct exposure to that matter. It can have a
    significant impact on the acceptance of future proposals.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Chapter 1 Job Description


    In some companies, a regular newsletter is distributed to all employees. This
    is yet another mechanism for raising awareness. If the system manager contributes
    a regular column, lets everyone know what''s going on, especially when relevant
    to large, innovative projects. AY2K compliance update was a prime example in the
    last few years of advertising the success of the IT department.


    # Financial Wizard


    As managing the systems and staff wasn''t enough, the system manager also must
    be an accountant. The IT budget can be large and complex. Like any other budget
    holder within the company, the system manager must provide forecast information
    on a rolling basis throughout each financial year. There is normally pressure
    to do with the money that is allocated so that costs can be reduced. It takes
    a careful eye and considerable knowledge and insight to arrive at the financial
    year end with the IT budget. This topic is discussed in greater detail in Chapter
    2,"The IT Budget."


    # Mediator


    The system manager deals with many business functions and many projects. There
    will inevitably be times when the priorities and objectives of these different
    projects collide. To make things worse, the system manager is usually involved
    with both sides. Here, he must act as the intermediary through whom the problem
    is resolved. At the same time, he must work to arrive at a solution that is acceptable
    to both sides. This can normally be achieved through negotiation, but occasionally
    it may be necessary to offer an incentive to one of the parties so that the work
    can go ahead.


    For example, one project manager requests that some change have been made, but
    another project manager maintains that the system stay up because of processing
    that is being carried out. The system manager could resolve this simply by offering
    to write a quick script that will check every 30 minutes to see if the processing
    has finished. At this point, the script will alert the system administrator so
    that the reboot can go ahead at the earliest convenient time. The outcome is that
    the processing completes and the reboot is also affected; both sides get what
    they want, and it takes the system manager only five minutes to write the simple
    script and submit it as a batch job (cron).


    This is only a simple example, with an equally simple resolution. Of course, most
    of the conflicts encountered will not be as easy as this. This does show, though,
    that the system manager is in an ideal position to be able to sort out conflicts.


    # Financial Responsibilities


    In a larger enterprise environment, teams of accountants and financial experts
    manage the overall budget, but it is the system manager''s responsibility to ensure
    that the money is spent wisely and in the best interests of the business.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# The Roles of the System Manager


    # Technical Expert


    The system manager is expected to know most things about computers, not just the
    ones that he is responsible for, but also in general. One of the greatest skills
    of the system manager is that of troubleshooting. This is based upon a solid foundation
    of experience and can prove invaluable when trying to resolve a difficult problem
    that may not have been encountered previously. In this situation, the system manager
    can identify quickly where the problem lies, based upon experience, thus avoiding
    wasted time looking elsewhere. Of course, he won''t always know the answer, but
    he should identify where to look.


    An extension of this role includes passing on some of his expertise to his system
    administrator(s). This is being done increasingly by companies providing a test
    environment in which certain faults can be duplicated. In a lab environment, away
    from the operational processes, the administrator gets to practice hands-on recovery
    and diagnosis of problems. This is especially useful for problems that occur infrequently.
    Because the system manager is in charge of all things technical, he often becomes
    the focal point for all the problems in the office relating to electrical equipment.
    I have been approached many times by members of staff when the kettle in the kitchen
    is not working or when the fax machine or photocopier is playing up the system
    manager is generally expected to be able to sort them out, one way or another.
    If someone is using an obsolete piece of software, it is the system manager who
    will get called to look at a problem with it, even though it may no longer be
    supported—this just goes with the territory.


    # Available Training


    Sun provides number of hardware maintenance training courses as part of its training
    curriculum. Areas covered include desktop (training code SM-210), enterprise (training
    code SM-240), and storage systems (training code SM-250), as well as a fault analysis
    workshop (training code ST-350) that guides students through a set of system faults.
    See the Sun training literature or its Web site (http://www.sun.com) for full
    details of the available training.'
  merge: -1
