  md: '![](img/20459f772e7361286cec3e76e3bd26b4_238_0.png)


    # 11


    # Shells and Public Domain

    Software


    LIKE ANY OTHER UNIX ENVIRONMENT, the Solaris operating environment contains at
    least one command interpreter called a shell. The shell isn''t only an interpreter;
    it''s also a command programming language. The shell is the main interface between
    the user and the system. The first section in this chapter identifies the shells
    that are packaged with the Solaris operating environment software, as well as
    the shells that can be obtained in the public domain. Another shell that is discussed,
    the secure shell, is an essential tool when extra security is required in a potentially
    vulnerable network environment.


    A considerable amount of software exists in the public domain, freely available
    and written by some of the best developers and technical experts in the field
    of UNIX. The second part of this chapter takes a look at some of the more popular
    public domain software applications, what they do, and where they can be obtained.


    # Shells


    The shell is the means by which UNIX commands are executed, whether at the command
    line or from a file—the latter is known as a shell script or program. The system
    startup (and shutdown) procedures execute a number of shell scripts. The shell
    is an interactive programming language as well as a command interpreter; it enables
    the user to set variables and customize the environment. Choosing which shell
    to use'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# Chapter 11 Shells and Public Domain Software


    often comes down to personal preference—you can use the one that you feel most
    comfortable with and that provides the functionality required.


    This section identifies the shells that are available for use with the Solaris
    operating environment and discusses some of the differences between them. Entire
    books have been written on the use of the UNIX shells; some of these are referenced
    in the Appendix, "Resources." This section is intended only to identify and introduce
    the different shells.


    # Shells Bundled with the Solaris Environment


    A number of shells are actually delivered with the Solaris operating environment,
    offering various features:


    +   - The Bourne shell (sh and jsh)—This is the default shell and the only one
    that is always present in any version of UNIX. As the original UNIX shell, the
    Bourne shell is still used as the standard for system initialization scripts.
    Using the jsh option enables job control functionality, allowing jobs to be suspended
    or run as a background task,


    +   - The C shell (csh)—This shell is a Berkeley product. Its syntax resembles
    the C programming language much more than the Bourne shell. With SunOS 4.x based
    on BSD UNIX, the C shell was heavily used until SunOS 5.x, when switched to System-based
    UNIX. The C shell contained some features not present in the Bourne shell, including
    filename completion, which a hot key could be pressed to instruct the shell to
    attempt to complete the name of the command or file being typed. Command aliases
    and command history were other functions available in this shell.


    +   - The Korn shell (ksh)—The Korn has become the facto standard for UNIX systems.
    It is now universally available and provides a far superior functionality to the
    Bourne shell. The Korn shell includes command-line editing, allowing the use of
    either vi or Emacs-type editing syntax, command aliasing, filename completion,
    job control, and command history—virtually everything that the system administrator
    would need.


    # Don''t lose the root shell


    The standard shell for the superuser (root) resides in /bin/sh. The bin directory
    contains statically linked programs—that is, programs that already contain any
    library functions that might be required to execute the program. Therefore, they
    are self-sufficient, unlike dynamically linked programs that call library modules
    at runtime. Changing the default root shell to a dynamically linked shell might
    save a little bit of disk space, but it could also mean that the superuser cannot
    log in in case of a failure affecting the runtime libraries.'
