- img_proc: true
  md: '# Tactical Options


    A number of tactical options are available to the system manager of a Solaris
    network to help tighten the security and make it much more difficult for unauthorized
    access to be gained. Some of these are discussed in the next sections.This is
    not an exhaustive discussion, but it provides a good indication of the type of
    action can be taken to protect a business from malicious and, in some cases, accidental
    incidents.


    # Routing Options


    By default, Solaris runs the routing daemon (in.router). It allows routes to be
    dynamically added to the routing table instead of statically routing through a
    known gateway. Greater security and control of network routes can be achieved
    by creating the file /etc/defaultrouter adding an entry containing either the
    name or the IP address of the primary router that the system uses. When the system
    is rebooted, the default route defined in this file will be used. Further routes
    can be manually added using the route command.


    # setuid and setgid Programs


    Quite a number of programs make use of the setuid and setgid features of Solaris.
    Some, such as the passwd command, are needed, but others are not. Setuid programs
    are not normally recommended because they pose added security risk. Also, when
    there are a large number of them on the system, it is difficult to spot a potential
    cracker adding one more!


    The system manager should have a policy whereby setuid programs are closely managed.
    One good way of doing this is to collect a list of setuid and setgid programs
    and compare them regularly to see if any unauthorized ones have been added.


    To obtain a list of programs that have the setuid bit set, use the following


    ```

    find / -perm 4000 -print

    ```


    Or, another way:


    ```

    find / -perm -u+s -print

    ```


    The lists should be saved in a secure location and be used as a baseline template
    for comparisons to be made.


    If any programs have the setuid or setgid bit set, then they should be reviewed
    to see if this is really necessary.Those that are not deemed necessary should
    have the bit(s) removed. As an example, consider the program dumpfile in the directory
    /usr/lib/fs/usr. The only program that is used by the superuser (root), and the
    program is already owned by user root. The setuid bit can easily be removed from
    this program without causing adverse effects on anything else.'
  merge: -1
