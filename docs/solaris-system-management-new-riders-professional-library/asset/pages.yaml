    # Sun Documentation Online


    Sun Microsystems makes available a vast amount of product documentation on the
    World Wide Web at http://docs.sun.com. The site is fully searchable and contains
    support for many languages. A large number of the manuals can be downloaded as
    PDF files for subsequent reading or printing using Adobe Acrobat Reader.


    A useful feature of the site is that it contains a number of contexts through
    which refined searches can be carried out. Four main categories can be used for
    searching:


    +   - Search the entire docs.sun collection—This searches the whole site without
    any restriction. Vague search criteria will probably produce unmanageable numbers
    of results.


    +   - Browse by subject—This allows a restricted browse or search by categorizing
    into system administration, programming, desktop manuals, hardware, or the manual
    pages.'
