  md: '# Chapter 5 Solaris Installations and Upgrades


    Naming conventions must also be adhered to—for example, setup for a new data-base
    server running an Oracle database might involve the use of defined mount points
    when creating the database file systems so that consistency across all servers
    is maintained.


    Larger installations and those with external communications facilities, such as
    the Internet for example, undoubtedly need a system security policy that all new
    systems must comply with before being allowed to connect to the corporate network.
    System security is discussed in more detail in Chapter 6,"Solaris Security."


    # Purpose of the System


    How a system is to be used often determines, to an extent, how it will be configured
    and managed. The system manager is responsible for ensuring that the required
    level of service can be provided. The next few sections cover a variety of categories
    that a large system might be used for. This could be a server providing operating
    system services to a number of clients, or distributed access to data and print
    facilities. A data-base server, for example, will be providing remote access to
    a database and must be configured to make optimal use of the resources so that
    acceptable response times for queries and similar items can be achieved. All of
    these are discussed in the following pages, along with the administration and
    management overheads that incurred with each.


    # Operating System Server


    A server that is providing operating system resources to a number of clients must
    be configured so that it can respond to client requests in a timely manner. Failure
    to achieve this is normally either the server has been setup incorrectly, or it
    is trying to support too many clients. As an approximate rule, a large server
    would be expected to be capable of supporting only about 50 diskless clients.
    So, it can be seen from the scenario earlier in the chapter that 4 or 5 operating
    system servers would probably be required to support the 250 client workstations
    that are being delivered as part of the business expansion plan.


    # Mount Points


    The use of mount points applies only to databases using UFS filesystems. A popular
    way of storing the database is to use raw disk partitions and the associated device
    filenames, but even in this case, there might be symbolic links that adhere to
    a naming convention.'
