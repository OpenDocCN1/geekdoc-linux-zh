  md: '# Solaris Installations and Upgrades


    A MAJOR PART OF THE SYSTEM MANAGER''S WORK involves the provision of new resources
    and the improvement of existing ones. To this end, the system manager is the person
    who will investigate the configuration options that are available and will provide
    the best service for the business.


    This chapter covers two main areas: a new installation and an upgrade. A third
    section at the end looks at the installation of patches, discussing some of the
    issues that arise when trying to decide on a patching policy, both for the Solaris
    operating patches and as unbound product patches and third-party patches.


    Businesses face a dilemma these days about implementing new systems. With such
    a vast array of hardware and software available, all claiming to be the best and
    all being fully adaptable to the requirements of business, the system manager
    needs to obtain as much information as before committing to any one product. Indeed,
    some businesses deliberately diversify so not to be tied to a specific vendor.
    These environments are known as multivendor environments.


    A great deal of information can be obtained from the World Wide Web. All the major
    vendors have Web sites that you can search for information on the various products
    that they market.


    There is a distinct difference, though, between purchasing a new system and upgrading
    an existing one, which is why these two scenarios form the basis of this chapter.'
  merge: -1
