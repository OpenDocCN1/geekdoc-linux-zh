  md: 'Strategic Planning and Techniques 125


    # Sudo


    Sudo is a freely available software package that provides the facility for specific
    users (or defined groups of users) to run some or all commands as the superuser
    (root). Additionally, it can be configured so commands run as another user. All
    commands and their arguments are written via the syslog process, which can be
    regularly audited. This can be modified so that all Sudo messages are written
    to a specific file that can be closely monitored. Configuration of syslog for
    such purposes is discussed in more detail in Chapter 9. “Tactical Management,”
    in the section “System Logging."


    Sudo presents a number of advantages for the system manager:


    +   - It is an ideal way to give enhanced access to specified users for a particular
    purpose.

    - It superuser (root) access can be granted without having to reveal the superuser
    password, which would allow blanket access to the whole system.

    - The audit logs can be used to track privileged command usage and hence what
    was done, by whom, and when it was done, providing increased accountability.

    - It is an excellent tool for junior system administrators who are learning the
    job because it eliminates the risk of them making an error while logged on as
    user root.

    - A double-check is made when users run Sudo commands. First, a user is required
    to provide his own password when using Sudo commands. After the user is authenticated,
    no password is required unless a Sudo command is not entered for 5 minutes (although
    this interval is also configurable). As a second check, the program verifies that
    the user is allowed to run the required program.

    - Sudo is simple and effective, and its use can be easily modified through the
    use of a single configuration file, the sudoers file.


    Control of privileged commands is carried out through the use of the sudoers file,
    which is installed by default into the directory /usr/local/etc, although it is
    a good idea to configure the installation to place this file in the /etc/ directory.
    A sample sudoers file is shown in Listing 6.3:


