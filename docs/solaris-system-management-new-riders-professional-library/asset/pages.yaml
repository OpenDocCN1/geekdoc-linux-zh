  md: 'Browse by collection—A collection is a set of books that might relate to a
    specific product or suite of products, or that might be aimed at a specific audience.
    An individual book can be a member of more than one collection, so there might
    be no duplication where the contents of collections overlap.


    Browse by product—A refined search can be carried out based on either hardware
    or software. This option contains information about the Sun product range, such
    as servers, workstations and storage options, as well as development software
    products, PC compatibility, resource management software, and clustering. This
