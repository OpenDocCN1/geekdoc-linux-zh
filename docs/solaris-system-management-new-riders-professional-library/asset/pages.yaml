    # Training


    Training courses are expensive, especially when taking into account the cost of
    paying the delegate while attending the course, the cost of course itself, hotel
    bills, and travelling expenses. The system manager must estimate how many training
    courses are likely to be required and then sufficient funding from the budget
    to allow for them.'
