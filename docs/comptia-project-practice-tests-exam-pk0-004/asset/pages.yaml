  md: '# Introduction


    Welcome to CompTIA Project+ field management is a fast-growing field that seems
    to be in constant need of dependable, certified talent. Project managers are needed
    in just about every field, including, but not limited to, construction, engineering,
    government and civil initiatives, nonprofits, information technology, logistics,
    and transportation. Moreover, it can be mighty handy for those projects in your
    life such as moving, putting in a new kitchen, or helping to organize an event
    for your local parent-teacher organization. Heck, it was even surprisingly helpful
    in writing a book on practice questions for the CompTIA Project+ exam.


    The Computing Technology Industry Association (CompTIA) promotes the Project+
    exam for people interested in project management to earn certifications. The exam
    helps to validate the various skills, including business and communication skills,
    that an individual would need to lead projects confidently toward on-time and
    on-budget completion.


    The purpose of this book is to help you pass the CompTIA Project+ Exam PKO-004.
    As you approach the final validation of your project management knowledge before
    taking this exam, this book will help prepare you for the types of questions and
    content that you might encounter on the exam itself. Remember, because of the
    broad range of knowledge and fields that use project management, this should not
    be the only resource you use to prepare for the exam. It will be important to
    use study guides and other exam resources in your studies. The more varied resources
    to which you expose yourself, the greater the probability of a successful result
    on the exam.


    One resource you should consider the CompTIA Project+ Study Guide: Exam PKO-004
    by Kim Heldman (Syex, 2017). It provides a great overview, reference, and additional
    review questions as you strive for certification in your project management career.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# # How This Book Is Organized


    This book consists of four chapters, each based on one of the four domains in
    the CompTIA Project+ objectives for the PK0-004 exam. The book also has two chapters
    that are meant to simulate the exam based on a variety of the questions from all
    four domains. The chapters are organized as follows:


    +   - Chapter 1, "Project Basics (Domain 1.0)," covers the basic concepts of project
    management, such as project properties, roles and responsibilities, project phases,
    cost control, organizational structures, project schedules, the Agile method of
    project management, and human resources and personnel

    - Chapter 2, "Project Constraints (Domain 2.0)," focuses on the constraints and
    influences on a project, as well as risk strategies and activities.

    - Chapter 3, "Communication and Change Management (Domain 3.0)," delves into communication
    method selection, influences on communication methods, communication triggers,
    and adaptation to the target audience, change control processes, and types of
    organizational change.

    - Chapter 4, "Project Tools and Documentation (Domain 4.0)," covers project management
    tools, project-centric documentation, and mutual binding documents and procurement
    methods.

    - Chapter 5 and Chapter 6 consist of practice exams, roughly representing the
    mix of questions that you will see on the actual exam from each of the domains.
    They also carry a representative time limit so that you can simulate the testing
    experience as a part of your preparation.


    Each chapter begins with a list of the Project+ objectives that are covered in
    that chapter. Remember, however, that each chapter does not cover the objectives
    in order, so do not be alarmed you encounter each of the objectives in a randomized
    order.'
  merge: -1
  pgno: 12
