  md: '# Acknowledgments


    Holy cow! Do you know what''s involved in writing a book? The team of dedicated
    professionals who helped to create this resource for you in order to advance your
    career in project management has to be the best in the business.


    The spark for this effort began with Kenyon Brown, the senior acquisition editor
    who assembled this great team. Gary Schwartz was the development editor who served
    as a mentor throughout the process and at times strangely resembled my college
    composition professor. His efforts to assist you in passing the CompTIA Project+
    exam could be the very best product it could be. Vaninia Mangano helped to ensure
    the technical viability of this book. Her talents and dedication in the project
    management field are globally known, and she is a terrific collaboration partner.
    The rest of the production team, led by Dassi Zeidel, ensured that this text made
    it print into a readable format. Thank you all for your collaborative efforts!


    I would also like to acknowledge Kim Heldman, who has been a professional mentor
    to me for over a decade. One of the most courageous leaders I have ever met, Kim
    got me started down the path of project management certification, authorship,
    and speaking. Kim is one of the great leaders in public sector information technology.
    She brings order and structure to a scary complex area.


    Most importantly, I would like to thank my wife April and my children Kayla, Marcus,
    and Adric. They endured the opportunity costs of building Legos, helping with
    homework, or watching a movie throughout this process. The sacrifice in writing
    this book was mostly felt by them, and I couldn''t do it without their smiles,
    love, and support. If I didn''t have April in my life, my days would be dull and
    I wouldn''t have such a cheery audience for life''s little animations that we
    share together. She is my best friend forever, the world''s greatest cheerleader,
    a creative and talented teacher, and the model for the person I want to be. I
    love you all.'
