    ### Question 20: Simple Explanation About xargs


    Could you give me a basic understanding or sample use of `xargs`?


    A: Quite simply `xargs` is used to read strings on standard input, passing as
    many arguments as possible to a given command. It''s normally used to get around
    the `ARG_MAX` limitations. 24,576 IBM & 1,048,320 Solaris.


    #### Using the xargs Command


    by Ed Schaefer


    [http://www.unixreview.com/documents/s=8274/sam0306g/](http://www.unixreview.com/documents/s=8274/sam0306g/)


    Many UNIX professionals think the `xargs` command, construct and execute argument
    lists, are only useful for processing long lists of files generated by the `find`
    command. While `xargs` dutifully serves this purpose, `xargs` has other uses.
    In this article, I describe `xargs` and the historical "Too many arguments" problem,
    and present eight `xargs` "one-liners":


    * Find the unique owners of all the files in a directory.

    * Echo each file to standard output as it deletes.

    * Duplicate the current directory structure to another directory.

    * Group the output of multiple UNIX commands on one line.

    * Display to standard output the contents of a file one word per line.

    * Prompt the user whether to remove each file individually.

    * Concatenate the contents of the files whose names are contained in file into
    another file.

    * Move all files from one directory to another directory, echoing each move to
    standard output as it happens.


    #### Examining the "Too Many Arguments" Problem.


    In the early days of UNIX/xenix, it was easy to overflow the command-line buffer,
    causing a "Too many arguments" failure. Finding a large number of files and piping
    them to another command was enough to cause the failure. Executing the following
    command, from Unix Power Tools, first edition (O''Reilly & Associates):


    ```bash

    pr -n ''find . -type f -mtime -1 -print''|lpr

    ```


    This will potentially overflow the command line given enough files. This command
    provides a list of all the files edited today to `pr`, and pipes `pr`''s output
    to the printer. We can solve this problem with `xargs`:


    ```bash

    find . -type f -mtime -1 -print|xargs pr -n |lp

    ```


    With no options, `xargs` reads standard input, but only writes enough arguments
    to standard output as to not overflow the command-line buffer. Thus, if needed
    `xargs` forces multiple executions of `pr -n|lp`.


    While `xargs` controls overflowing the command-line buffer, the command `xargs`
    services may overflow. I''ve witnessed the following `mv` command fail—not the
    command-line buffer—with an argument list too long:


    ```bash

    mv file1 file2 ... destination


    ```


    Limit the number of files sent to `mv` at time, using `xargs -l`. (The `xargs
    -i` syntax is explained later).


    ```bash

    find . -type f -mtime -1 -print|xargs pr -n |lp

    ```


    The modern OS seems to have solved the `find` command overflowing. However, using
    `find -exec` is still troublesome. It''s better to do:


    ```bash

    find . -name "*.txt" -exec rm {} \;

    ```


    #### xargs One-Liners


    The `find-xargs` combination is a powerful tool. The following example finds the
    unique owners of all the files in `/bin` directory:


    ```bash

    find /bin -type f -follow|xargs ls -al | awk '' NF==9 { print $3 }''|sort -u

    ```


    If `/bin` is a soft link, as it is with Solaris, the `-follow` option forces `find`
    to follow the link. The `xargs` command feeds `ls -al`, which pipes to `awk`.
    If the output of `ls -al` command is 9 fields, print field 3—the owner. Sorting
    the `awk` output ensures unique owners.


    You can use `xargs` options to build extremely powerful commands. Expanding the
    `xargs/rm` example, let''s assume the requirement exists to echo each file to
    standard output as it deletes:


    ```bash

    find . -name "*.txt"|xargs -i sh -c "echo deleting {}; rm {}

    ```


    The `xargs -i` option replaces instances of `{}` in a command (i.e., `echo` and
    `rm`).


    Conversely, instead of using the `-i` option with `{}`, the `xargs -I` option
    replaces instances of a string. The above command can be written as:


    ```bash

    find . -name "*.txt"|xargs -I {} sh -c "echo deleting {}; rm {}

    ```


    The new, third edition of Unix Power Tools provides an `xargs` "one-liner" that
    duplicates a directory tree. The following command creates in `usr/project` directory,
    a copy of the current directory structure:


    ```bash

    find . -type d -print|sed ''s@^@/usr/project/@''|xargs mkdir

    ```


    The `/usr/project` directory must exist. When executing, note the error:


    ```

    mkdir: Failed to make directory "/usr/project/"; File exists

    ```


    This doesn''t prevent the directory structure creation. Ignore it. To learn how
    the above command works, you can read more in Unix Power Tools, third edition,
    Chapter 9.17.


    In addition to serving the `find` command, `xargs` can be a slave to other commands.
    Suppose the requirement is to group the output of UNIX commands on one line. Executing:


    ```bash

    logname; date

    ```


    displays the logname and date on two separate lines. Placing commands in parentheses
    and piping to `xargs` places the output of both commands on one line:


    ```bash

    (logname; date)|xargs

    ```

