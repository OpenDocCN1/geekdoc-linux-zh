- fmt: "\n# Question 03: Language Constructs\n\nHow do you implement a shell script?\n\
    \nA: The shell script language, like other programming languages, has constructs\
    \ for conditional execution (`if-then-else`; `while`), iterative execution (`for`\
    \ loop), a switch statement, and a go to statement:\n\n## 1. if-then-else\n\n\
    The syntax of the `if-then-else` construct is:\n`if` (expr) simple-command`\n\n\
    or\n\n```\nif ( expr ) then commandlist-1 [else commandlist-2]\nendif\n```\n\n\
    The expression `expr` will be evaluated and according to its value, the `commandlist-1`\
    \ or the `commandlist-2` will be executed. The portion of the construct enclosed\
    \ in `[` and `]` is optional. This is standard notation in the software world,\
    \ so remember it.\n\nAs an example, suppose we write a shell script which is supposed\
    \ to have two parameters and that the code will set up two variables, `name1`\
    \ and `name2` from those two parameters:\n\n```bash\nset name1 = $argv[1]\nset\
    \ name2 = $argv[2]\n```\n\n(Which presumably it would make use of later on). But\
    \ suppose we also wish to do error-checking, emitting an error message if the\
    \ user gives fewer than two, or more than two, parameters. We could use the following\
    \ code:\n\n```bash\nif ($#argv <> 2) then\n  echo \"you must give exactly two\
    \ parameters\"\nelse\n  set name1 = $argv[1]\n  set name2 = $argv[2]\nendif\n\
    ```\n\n## 2. while\n\nThe syntax of `while` loop construct is:\n\n```\nwhile (\
    \ expr )\ncommandlist\nend\n```\n\nThe command list will be executed until the\
    \ `expr` evaluates to false.\n\n## 3. foreach\n\nThe syntax of `foreach` loop\
    \ construct is:\n\n```\nforeach var ( wordlist )\ncommandlist\nend\n```\n\nThe\
    \ command list is executed once for each word in the wordlist, and each time the\
    \ variable `var` will contain the value of that word. For example, the following\
    \ script can search all immediate subdirectories of the current directory for\
    \ a given file (and then quit if it finds one):\n\n```bash\n#! /bin/csh -f\nset\
    \ f = $1\nforeach d (*)\n  if (-e $d/$f) then\n    echo FOUND: $d/$f\n    exit(0)\n\
    \  endif\nend\necho $f not found in subdirectories\n```\n\nFor example, say I\
    \ call this script `FindImm`, and my current directory consists of files `s`,\
    \ `t` and `u`, with `s` and `t` being subdirectories, and with `t` having a file\
    \ `x`.\n\nTyping:\n`FindImm x`\n\nwould yield the message\n`FOUND: t/x`\n\nHere\
    \ is how it works: In the line\n`foreach d (*)`\nThe `*` is a wild card, so it\
    \ would expand to a list of all files in my current directory, i.e., the list\
    \ `(s t u)`. So, the for-loop will first set `d = s`, then `d = t`, and finally\
    \ `d = u`.\n\nIn the line `if (-e $d/$f) then` the `-e` means existence; in other\
    \ words, we are asking if the file `$d/$f` exists. If we type `FindImm x` as in\
    \ the example above, `$f` would be `x`, and `$d` would start out as `s`, so we\
    \ would be asking if the file `s/x` exists (the answer would be no).\n\n## 4.\
    \ switch\n\nThe `switch` command provides a multiple branch similar to the switch\
    \ statement in C. The general form of `switch` is:\n\n```\nswitch ( str )\ncase\
    \ string1:\n  commandlist1\n  breaksw\ncase string2:\n  commandlist2\n  breaksw\n\
    default\n  commandlist\nendsw\n```\n\nThe given string `str` is successively matched\
    \ against the `case` patterns. Control flow is switched to where the first match\
    \ occurs. As in file name expansion, a case label may be a literal string, or\
    \ contain variable substitution, or contain wild-card character such as `*`, `?`,\
    \ etc.\n\n## 5. Goto\n\nThe `goto` command provides a way to branch unconditionally\
    \ to a line identified by a label.\n\n`goto lab`\n\nwhere `lab` is a label on\
    \ a line (by itself) somewhere in the script in the form `lab`.\n\n## 6. A Shell\
    \ Script for Deleting Files\n\nThis code, which we will call `Del`, will delete\
    \ files like `rm` does, prompting for your confirmation for each file to be deleted,\
    \ including directory files (which the `-i` option of `rm` won't do).\n\n```bash\n\
    #! /bin/csh -f\nforeach name ($argv)\n  if ( -f $name ) then\n    echo -n \"delete\
    \ the file '${name}' (y/n/q)?\"\n  else\n    echo -n \"delete the entire directory\
    \ '${name}' (y/n/q)? \"\n  endif\n  set ans = $<\n  switch ($ans)\n    case n:\n\
    \      continue\n    case q:\n      exit\n    case y:\n      rm -r $name\n   \
    \   continue\n  endsw\nend\n```\n\nBefore reading further, try this program yourself.\
    \ Set up a test directory, with several files in it, at least one of which is\
    \ a subdirectory, with at least one file there. Afterwards, you can then type\
    \ `Del *`.\n\nThe line:\n`if ( -f $name ) then`\ntests to see if the file whose\
    \ name is in `$name` is an ordinary file, as opposed to a directory file.\n\n\
    The `-n` option of `echo` tells the shell not to print the newline character,\
    \ so that our answer, `y/n/q`, will be on the same line.\n\nIn the line:\n`set\
    \ ans = $<`\nthe symbol `$<$ means the input from the keyboard.\n\nThe keyword\
    \ `continue` means to go to the top of the enclosing loop.\n\nThe `-r` option\
    \ of the `rm` command means that if an argument is a directory, then remove that\
    \ directory, and all the files and subdirectories within it.\n\n# Question 04:\
    \ Shells\n\nWhy should I use Shells?\n\nA: Well, most likely because it’s portable.\n\
    \n# Question 05: Learning Scripting\n\nIs there a link where I can start?\n\n\
    A: Try this:\n(Note: The provided text for Question 5 appears to be corrupted\
    \ or contain placeholder paths).\n\n# Question 06: UNIX Filenames\n\nWhere can\
    \ I get an explanation of the UNIX filenames and their functions?\n\nA: `/`: The\
    \ Root Directory. Under UNIX-like system there is one unified directory. Everything\
    \ begins with the root directory. The root directory is symbolized by just a slash\
    \ (\"/\"), with nothing following it. There are many directories hanging off the\
    \ root directory.\n\n- `/bin`: This contains commands that may be used by both\
    \ the system administrator and by users, which are required in single user mode.\n\
    - `/sbin`: Utilities used for system administration and maintenance (and other\
    \ root-only commands) are stored in `/sbin`.\n- `/boot`: This is for anything\
    \ which is used before the kernel execs `/sbin/init`.\n- `/dev`: This is where\
    \ special files are kept. Special files represent input/output (i/o) devices,\
    \ like a tty (terminal), a disk drive, or a printer. Unix treats such devices\
    \ as files. `/dev` also contains a script named `MAKEDEV` which can create devices\
    \ as needed. It may also contain `MAKEDEV.local` for any local-only devices.\n\
    - `/etc`: This is for the system configuration files and directories. Examples\
    \ are startup scripts configuration files for networking, etc.\n- `/usr`: `/usr`\
    \ is shareable, read-only data. It maybe shared with other machines with the same\
    \ architecture and operating system version and most of the root directory structure\
    \ is mirrored here.\n- `/lib`: These are used for essential shared libraries and\
    \ kernel modules.\n"
