    但你问的是 "if (($lines = 0 ))"。这种精确的语法是一个糟糕的错误，你可能永远不要使用它。首先，`ksh` 有内置的算术功能，你可以执行如下操作：


    ```bash

    ((k=7+1)) ; echo $k

    ```


    并得到 8。`((expression))` 语法只是执行算术运算的命令。该命令有一个退出码。如果表达式非零，命令执行成功。但如果表达式为零，命令执行失败。因此，你可以测试一个表达式的结果。我经常执行这样的操作：


    ```bash

    if ((lines == 0 ))

    ```


    这测试 `lines` 是否等于 0。使用 `(($lines = 0))` 时，假设 `lines` 包含另一个变量名，它几乎可以正常工作：


    ```bash

    lines=xyz


    if (($lines = 0))

    ```


    `$lines` 会被替换为 `xyz`，因此 shell 将看到 `((xyz = 0))`。`xyz` 将被设置为 0。。`((xyz = 0))` 将始终失败，因此
    `if` 语句永远不会为真。你永远不需要在 `((expression))` 内部使用 `$` 符号。这样做可以：


    ```bash

    ((lines=lines+1))

    ```


    算术语句会知道 `lines` 是一个变量并查找它的值。`Bash` 也从 `ksh` 继承了算术功能。


