    #! /bin/csh -f


    set f = $1


    foreach d (*)


    if (-e $d/$f) then


    echo FOUND: $d/$f


    exit(0)


    endif


    end


    echo $f not found in subdirectories


    For example, say I call this script FindImm, and my current directory consists
    of files s, t and u, with s and t being subdirectories, and with t having a file
    x.


    Typing:


    FindImm x


    would yield the message


    FOUND: t/x


    Here is how it works: In the line


    foreach d (*)


    The “*” is a wild card, so it would expand to a list of all files in my current
    directory, i.e., the list (s t u). So, the for-loop will first set d = s, then
