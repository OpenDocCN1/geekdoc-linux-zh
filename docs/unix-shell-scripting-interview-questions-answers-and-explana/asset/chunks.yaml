    My shell script (`bash`) does some queries every hour and appends result of query
    to a log file. If there is no result, the query would return something like "Query
    has no entries." If the previous hour''s query result is also "Query has no entries,"
    then instead of appending the result, the script only modifies the timestamp for
    the "Query has no entries" section in the log file.


    The log file looks like this:


    ```

    ############


    Query time - Mon May 8 09:59:14 PDT 2006


    Query has no entries

    ```


    In this case, how can I find out the last entry in the log "Query has no entries"?


    How can I modify only the timestamp in this "Query has no entries" section?


    A: Appending the text should be in a function to save repeating the same code
    three times over. Something like this should do it:


    Code:


    ```bash

    #!/bin/sh


    # Usage: $0 message text


    now=`date`


    last=`tail -2 q.txt`


    result=$@ # message text


    if [ "$result" == "Query has no entries" ]; then


    # Special case - no entries...


    tail -1 q.txt | grep "^Query has no entries$" > /dev/null


    if [ "$?" -eq "0" ]; then


    # A repeated non-entry


    # Get the rest of the file


    filelen=`wc -l q.txt | awk ''{ print $1 }''`


    shorter=`expr $filelen - 2`


    head -${shorter} q.txt > qq.txt


    # qq.txt now contains the full logfile minus the final two lines


    echo "Query time - $now" >> qq.txt


    echo "$@" >> qq.txt


    mv qq.txt q.txt


    else


    # First non-entry... log it as usual


    echo "Query time - $now" >> q.txt


    echo "$@" >> q.txt


    fi


    else


    # A "real" entry... log it


    echo "Query time - $now" >> q.txt


    echo "$@" >> q.txt


    fi

    ```


    With this script, let''s say it''s called "q.sh":


    Code:


    ```bash

    $ ./q.sh Query has no entries


    $ ./q.sh Hello


    $ ./q.sh Query has no entries


    $ ./q.sh Query has no entries


    $

    ```


    And check `q.txt` each time.


    ## Question 39: Correct Usage of Input


    I''m trying to write a UNIX shell to streamline some work I have for a research
    project. To start, there are three files.


    **Program**: This is a program, that in the course of running, prompts the users
    once for input file, and then for the output file. Treat it as a black box. It
    does exactly what it''s supposed to if fed the right information.


    **Data file**: It contains a list of the various inputs and output files and there
    are 50 of each. Let''s just say that it looks something like this:


    in01.txt

    out01.txt

    in02.txt

    out02.txt

    in50.txt

    out50.txt


    Then the final part, which I''m having most trouble with. This is the actual shell
    that I was hoping would make this all work. The code within the shell looks like
    this:


    ```bash

    #!/bin/sh


    program < Data-file < Date-file


    program < Data-file < Data-file


    program > Data-file < Data-file (up through 50 times)

    ```


    I want to go sequentially through the data-file and run it on each pair of input/output.
    I think it is simply running the program from `in01.txt` and `out01.txt` 50 times,
    leaving the other inputs and outputs untouched.


    What is the best thing to do to fix this?


    A: You''ll have to iterate through the file, like this:


    Code:


    ```bash

    #!/bin/sh


    infile=unknown


    while read f

    do


    echo "$f" | grep "^in" > /dev/null


    if [ "$?" -eq "0" ]; then


    infile=$f


    else


    outfile=$f

    # Okay, we should have $infile and $outfile now ...


    if [ "$infile" != "unknown" ]; then


    echo "Calling program from $infile to $outfile


    program < $infile > $outfile


    fi


    fi


    done < Datafile

    ```


    If you want to make life a bit easier, there is some logical link between "in01.txt"
    and "out01.txt." You could just list one kind (in or out) and work out the name
    of `$outfile` from it. That way, you call "program" on every read:


    Code:


    ```bash

    #!/bin/sh


    while read f

    do


    infile=$f


    outfile=`echo $f | sed s/"in"/"out"/1`


    program < $infile > $outfile


    done < Datafile

    ```


    That''s much shorter and simpler!


