    # 致谢


    ## 引言


    UNIX shell（外壳）也称为“命令行”，它为 UNIX 操作系统提供了传统的用户界面。用户通过输入文本形式的命令输入并由 shell 执行，来指导计算机的操作。在
    Microsoft Windows 操作系统家族中，类似的程序是 `command.com`，或者对于基于 Windows NT 的操作系统则是 `cmd.exe`。


    从该术语最广义的意义上说，shell 指用户用来输入命令的任何程序。由于在 UNIX 操作系统中，用户可以选择他们想要使用的 shell（即登录时应该执行哪个程序），因此已经开发了许多不同的
    shell。它被称为“shell”（外壳），是因为它在 shell 界面之后隐藏了底层操作系统的细节（与“kernel”内核形成对比，内核指的是操作系统的最底层或“最内层”的组件）。同样，UNIX
    的图形化用户界面（如 `GNOME` 和 `KDE`）有时也被称为视觉 shell 或图形 shell。单就 shell 这个词而言，它通常与命令行相关。在
    UNIX 中，任何程序都可以是用户的 shell。想要使用不同语法来输入命令的用户可以指定不同的程序作为他们的 shell。


    shell 一术语也指一个特定的程序，即 Bourne shell，写作 `sh`。Bourne shell 是 UNIX 早期版本中使用的 shell，并成为了事实上的标准；每个
    Unix 类系统都有等同于 Bourne shell 的程序。Bourne shell 程序位于 UNIX 文件层次结构的 `/bin/sh` 路径。在某些系统（如
    `BSD`）上，`/bin/sh` 是 Bourne shell 或其等效物，但在其他系统（如 `Linux`）上，`/bin/sh` 可能是一个指向兼容但功能更丰富的
    shell（如 `Bash`）的链接。`POSIX` 规定标准 shell 是 Korn shell 的严格子集。


    UNIX shell 在最初创建时是非常不寻常的，因为它既是一种交互式命令语言，也是用于编写系统脚本的语言；它是一种脚本编程语言。此后为其他操作系统创建的许多
    shell 都提供了 UNIX shell 功能的粗略等效。


    在使用窗口系统的系统上，某些用户可能永远不会直接使用 shell，但在 UNIX 系统上，shell 仍然是系统启动脚本的实现语言，包括启动窗口系统的程序、拨号上网的程序以及许多其他基本功能。


    在 `MS-DOS`、`OS/2` 和 Windows 上，等同于 UNIX 系统脚本的被称为批处理文件，具有 `.bat` 或 `.cmd` 扩展名。代号为
    `Monad` 的更新 CLI 将作为 Windows PowerShell 发布，它将取代现有的 NT 命令行 `cmd.exe`；它具有许多源自 UNIX
    shell 的功能，尽管它的语法略有不同。


    许多 UNIX 系统的普通用户仍然认为，对于许多任务，现代命令行 shell 比任何 GUI 应用程序都方便得多。


    由于近期支持开源的运动，大多数 UNIX shell 至少有一个版本是开源的。


    ## 基础问答：

    初学者最可能被问的问题


    ### 问题 01：Shell 脚本


    到底什么是 shell 脚本？


    A：shell 脚本在最基本的形式下，简单来说就是按照执行所需的顺序，将一组操作系统命令放入文本文件中的集合。使用到为止为止的任何 shell，包含示例基础
    shell 脚本中列出的命令的文本文件在脚本每次执行时都能正常工作。


    示例基础 shell 脚本：


    ```sh

    #!/bin/sh


    rm -f /tmp/listing.tmp> /dev/null 2>&1


    touch /tmp/listing.tmp


    ls -l [a-z]*.doc | sort> /tmp/listing.tmp


    lpr -Ppostscript_1 /tmp/listing.tmp


    rm -f /tmp/listing.tmp

    ```


    当然，并不是所有脚本都这么简单，但它展示了普通的 UNIX 命令可以在不需要任何额外花哨脚本构造的情况下使用。如果多次执行此脚本，结果将是相同的：即在你的本地目录中打印出所有以小写字母开头并以
    doc 扩展名结尾的文件的长列表。（注：原文在此处有多处重复的句子，已根据要求去重处理）。


