    The /usr/project directory must exist. When executing, note the error:


    mkdir: Failed to make directory "/usr/project/"; File exists


    This doesn''t prevent the directory structure creation. Ignore it. To learn how
    the above command works, you can read more in Unix Power Tools, third edition,
    Chapter 9.17 (O''Reilly & Associates).


    In addition to serving the find command, xargs can be a slave to other commands.
    Suppose the requirement is to group the output of UNIX commands on one line. Executing:


    logname; date


    displays the logname and date on two separate lines. Placing commands in parentheses
    and piping to xargs places the output of both commands on one line:


    (logname; date)|xargs'
