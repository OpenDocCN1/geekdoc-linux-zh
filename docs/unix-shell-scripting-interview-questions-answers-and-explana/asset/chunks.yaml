- fmt: "\n```bash\nmv $f `echo $f | tr '[A-Z]' '[a-z]'`\n```\n\nend\n\n### Bourne\
    \ Shell\n```bash\nfor f in *; do\n  mv $f `echo $f | tr '[A-Z]' '[a-z]'`\ndone\n\
    ```\n\n### Korn Shell\n```bash\ntypeset -l l\nfor f in *; do\n  l=\"$f\"\n  mv\
    \ $f $l\ndone\n```\n\nIf you wanted to be really thorough and handle files with\
    \ “funny” names (embedded blanks or whatever) you'd need to use:\n\n### Bourne\
    \ Shell\n```bash\nfor f in *; do\n  g=`expr \"xxx$f\" : 'xxx\\(.*\\)' | tr '[A-Z]'\
    \ '[a-z]'`\n  mv \"$f\" \"$g\"\ndone\n```\n\nThe `expr` command will always print\
    \ the filename, even if it equals `-n` or if it contains a System V escape sequence\
    \ like `\\c.`.\n\nSome versions of `tr` require the `[` and `]`, some don't. It\
    \ happens to be harmless to include them in this particular example; versions\
    \ of `tr` that don't want the `[]` will conveniently think they are supposed to\
    \ translate `[` to `[` and `]` to `]`.\n\nIf you have the Perl language installed,\
    \ you may find this rename script by Larry Wall very useful. It can be used to\
    \ accomplish a wide variety of filename changes.\n\n```perl\n#!/usr/bin/perl\n\
