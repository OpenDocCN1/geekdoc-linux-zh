    # Question 08: Rename "*.foo" to "*.bar"


    How do I rename "*.foo" to "*.bar" or change file names to lower case?


    A: Why doesn''t `"mv *.foo *.bar"` work? Think about how the shell expands wildcards.
    `*.foo` and `*.bar` are expanded before the `mv` command ever sees them. Depending
    on your shell, this can fail in a couple of ways. CSH prints "No match." because
    it can''t match `*.bar`. SH executes `mv a.foo b.foo, c.foo *.bar`,Depending on
    your shell, you can do it with a loop to `mv` each file individually. If your
    system has `basename` you can use:


    C Shell:


    foreach f ( *.foo )


    set base=`basename $f .foo`


    mv $f $base.bar


    end


    Bourne Shell:


    for f in *.foo; do


    base=`basename $f .foo`


    mv $f $base.bar


    done


    Some shells have their own substitution features, so instead of using `basename`
    you can use simpler loops like:


    C Shell:


    foreach f ( *.foo )


    mv $f $f:r.bar


    end


    Korn Shell:


    for f in *.foo; do


    mv $f ${f%foo}bar


    done


    If you don''t have a `basename` or want to do something like renaming foo.* to
    bar.*, you can use something like `sed` to strip apart the original file name
    in other ways, but the general looping idea is the same. You can also convert
    file names into `mv` commands with `sed` and hand the commands off to `sh` for
    execution. Try:


    ```

    ls -d *.foo | sed -e ''s/.*/mv & &/'' -e ''s/foo$/bar/'' | sh

    ```


    A program by Vladimir Lanin called `mmv` that does this job nicely was posted
    to comp.sources.unix (Volume 21, issues 87 and 88) in April 1990\. It lets you
    use:


    ```

    mmv ''*.foo'' ''=1.bar''

    ```


    Shell loops like the above can also be used to translate file names from upper
    to lower case or vice versa. You could use something like this to rename uppercase
    files to lowercase:


    C Shell:


    foreach f ( * )

