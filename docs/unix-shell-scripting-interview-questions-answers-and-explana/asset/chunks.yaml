    Question 81: UNIX Script Issues


    I have written the following UNIX for HP-UX 11i. The script basically checks for
    files older than 45 minutes in 2 respective directories and then sends an email
    to the administrator about them.


    The problem with the script is that I can run it from the command line and crontab
    tab but 80% of the time it errors out with the following message "date: bad conversion."


    I''m puzzled as to why it works brilliantly sometimes but the why majority of
    the times it errors out with the above error message.


    Here is my script:


    #!/usr/bin/ksh


    mailgroup=''testuser@xxx.com''


    LOGFILEIN=/tmp/sipstimein.log


    LOGFILEPROC=''/tmp/sipstimeproc.log''


    #GET AND PARSE THE CURRENT DATE


    date "+%m %d %H %M" | while read MONTH DAY HOURS MINS


    do


    #SUBTRACT 45 MIN


    MINS=$(($MINS-45))


    if [ $MINS -lt 0 ]


    then


    HOURS=$(($HOURS-1))


    MINS=$(($MINS+60))


    fi


    #TOUCH A FILE SO THAT IT IS 45 MINUTES OLD


    touch -t ${MONTH}${DAY}${HOURS}${MINS} /tmp/oldtime


    done


    #Find files older then 45mins condition


    find /interface/data8/sips/proc ! -newer /tmp/oldtime | while read FILENAME


    do


    #CHECK THAT IT IS A REGULAR FILE, AND NOT A DIR OR


    # CHARACTER FILE, BEFORE RUNNING THE COMMAND AGAINST IT


    if [ -f $FILENAME ]


    then


    echo "$FILENAME" >$LOGFILEIN


    sleep 4


    mailx -s "Files have been detected older then 45mins in PROD system for SIPS in
    the PROC directory" <$LOGFILEIN $mailgroup


    2>&1


    fi


    done


    find /interface/data8/sips/in ! -newer /tmp/oldtime | while read FILENAME


    do


    #CHECK THAT IT IS A REGULAR FILE, AND NOT A DIR OR


    # CHARACTER FILE, BEFORE RUNNING THE COMMAND AGAINST IT


    if [ -f $FILENAME ]


    then


    echo "$FILENAME" >$LOGFILEPROC


    sleep 4


    mailx -s "Files have been detected older then 45mins in PROD system for SIPS in
    the IN directory" <$LOGFILEPROC $mailgroup


    2>&1


    fi


    done


    #rm /tmp/oldtime


    What am I doing wrong?


    A: I think your problem is with your $HOURS and MINS calculations. If you subtract
    45 from 50, for example, you get "5" not "05." So your touch command gets confused
    because the timestamp is not formatted "MMDDhhmm."


    Since you are using ksh, you could fix using this code:


    typeset -Z2 HOURS MINS


    However, if you have Perl, perhaps you should try this:


    #GET AND PARSE THE CURRENT DATE


