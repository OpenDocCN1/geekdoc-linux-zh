  trans: '

    为了回答你的问题，你需要遍历文件并为每种类型的 `03` 记录创建列表。然后，你需要检查这些列表。如果一个列表少于 100 个项，列表中的所有项都将被标记为
    ok。如果列表超过 100 个项，则只有部分会被标记为 ok。


    既然你已经数出了元素的数量，可以计算该数字的 2%。现在你知道需要标记多少个 ok 了。


    要标记一个项为 ok，在 1 到 `n` 之间生成一个随机整数，其中 `n` 是列表中非 ok 元素的数量。现在从元素 1 扫描到列表末尾并找到所选的元素。将其标记为
    ok。从列表的非 ok 元素数量中减去 1。再次在 1 到当前非 ok 元素数量之间生成一个新的随机整数。找到那一个。重复此过程，直到你标记了所需数量的 ok
    为止。


    对每个列表完成此操作后，返回主文件。对于每条 `03` 记录，检查它在列表中是否被标记为 ok。如果是，则将其及其子记录写入最终输出文件。


    ## 问题 99：Shell 脚本中的 awk


    我有一个包含在 `ksh` 脚本中的 `awk` 脚本，用它读取一个文件的内容，假设有 3 条记录。字段为 `a`、`b` 和 `c`，分隔符为 `|`。


    我想读取文件，然后为 `$1`、`$2`、`$3` 设置不同的变量，作为在 `awk` 脚本范围之外但在同一个 `ksh` 脚本运行一系列报告的参数。


    以下是我目前的部分代码：


    ```bash

    # 为每个记录顺序执行每个报告（总共 3 个）:


    awk ''

    BEGIN{FS="|";FILENAME="$loc/myfile"}

    split(FILENAME,results,FS)

    a=results[1]

    b=results[2]

    c=results[3]

    etc…

    ```


    我如何在内部/外部执行命令的剩余部分？


    答：我无法理解你的代码，但我认为你有一个文件，每行三个数据字段，且字段通过 `|` 分隔，如下：


    ```

    1|2|3

    4|5|6

    ```


    我想你想通过循环在第一次循环时设置 `a=1`、`b=2`、`c=3`，在第二次循环时设置 `a=4`、`b=5`、`c=6`。这很容易。


    代码：


    ```bash

    /usr/bin/ksh

    exec < inputfile

    IFS=''|''

    while read a b c ; do

    echo a = $a

    echo b = $b

    echo c = $c

    done

    exit 0

    ```


    我没有看到有简单的方法将 `awk` 注入此类结构中。


    ## 问题 100：while 循环


    在一个文本文件 (`PL_SENDEVENT`) 中，我有这样的一行：


    `CHANGE_STATUS INACTIVE`


    另一个文件 (`PL_JOBS`) 包含以下行：


    ```

    TEST

    TEST1

    ```


    我想做的是将 `TEST` 和 `TEST1` 的 `STATUS` 更改为文件中指定的状态，在这种情况下为 `INACTIVE`（或 `IN`）。我不希望脚本在两个作业都已验证为
    `INACTIVE`（`IN`）状态之前退出。目前为止进展不太顺利。目前，它一旦将 `TEST` 设置为 `INACTIVE` 就会成功退出，甚至不检查 `TEST1`。如果作业不在
    `INACTIVE` 状态，我希望它再次检查，直到它们都处于该状态为止。


    这是是我现在的代码：


    代码：


    ```bash

    cat $PL_DIR/PL_SENDEVENT | while read event status

    do

    case $event in

    CHANGE_STATUS)

    cat $PL_DIR/PL_JOBNAME | while read job

    do

    sendevent -E CHANGE_STATUS -s ${status} -J ${job}

    done

    case $status in

    INACTIVE) export ST=IN ;;

    ON_HOLD) export ST=OH ;;

    ON_ICE) export ST=OI ;;

    TERMINATED) export ST=TE ;;

    *) echo "Invalid Status!"; exit 1 ;;

    esac

    rc3=1

    while (($rc3 > 0))

    do

    sleep 5

    cat $PL_DIR/PL_JOBNAME | while read job

    do

    $AUTOSYS/bin/autorep -J ${job} -l0 | sed ''1,4d'' |

    if [ `awk ''{print $6}''` == ${ST} ]; then

    echo "Status is set for ${job}!"

    rc3=0

    fi

    done

    done ;;

    ```


    我哪里做错了？


    答：尝试将最后部分替换为以下内容：


    代码：


    ```bash

    rc3=1

    while (($rc3 > 0))

    do

    sleep 5

    rc7=0

    cat $PL_DIR/PL_JOBNAME | while read job

    do

    $AUTOSYS/bin/autorep -J ${job} -l0 | sed ''1,4d'' | \

    if [ `awk ''{print $6}''` == ${ST} ]; then

    echo "Status is set for ${job}!"

    (( rc7 += 1 ))

    fi

    done

    [ $rc7 == `wc -l $PL_DIR/PL_JOBNAME` ] && rc3=0

    done

    ```


