    \ `filename with space…` 等。\n\n引用：`${parameter##word}`\n\n该单词被展开以产生一个模式，就像在路径扩展中一样。如果模式匹配参数值的开头，则扩展的结果是该参数的值在删除了最短匹配模式（``#''`\
    \ 情况）或最长匹配模式（``##''` 情况）后的扩展值。如果参数是 `@` 或 `*`，则模式移除操作将依次应用于每个位置参数，扩展的结果为生成的列表。如果参数是带有\
    \ `@` 或 `*` 索引的数组变量，则模式移除操作将应用于该数组。\n\n### 问题 88: 捕获所有退出码\n\n我有一个脚本，在输出带有完整路径的文件时，我需要在每一处都搜索到文件末尾。我需要捕获所有的退出码。\n\
    \n我如何在 KSH 中这样做？\n\n答：引入一个函数来处理：\n\n```bash\nEXIT_CODE=\"\"\nfunction assembleCode\
    \ {\n  EXIT_CODE=\"${EXIT_CODE}$@\"\n}\n```\n\n在需要退出码的地方调用该函数：\n\n`assembleCode\
    \ $?`\n\n在代码结束时：\n\n```bash\nif [[ x\"$EXIT_CODE\" != x then\n```\n\n### 问题 89:\
    \ 将文本转换为 XML\n\n文件具有字段分隔符，我需要将其转换为某种结构以便我可以生成 XML。以下是使用脚本的示例：\n\n答：尝试如下：\n\n```bash\n\
    #!/bin/ksh\ncat - <<! >data.txt\nawk ' BEGIN {print \"<?xml=\"\"1.0\"\"?>\";print\
    \ \"<ROWSET>\"}\n{print \"<ROW>\"\nprint \"<NAME>\" substr($0,20) \"</NAME>\"\n\
    print \"<TRN_DATE>\" substr($0,21,10) \"</TRN_DATE>\"\nprint \"<TEXT>\" substr($0,31,10)\
    \ \"</TEXT>\"\nprint \"<ID>\" substr($0,41,7) \"</ID>\"\nprint \"</ROW>\";}\n\
    END { print \"</ROWSET>\";}' data.txt >data.xml\n```\n\n为了从每个字符串中提取前导和尾部空格并输出，这样做：\n\
    \n```bash\nfunction trim(str) {\n  sub(\"^[*\", \"\", str);\n  sub(\"[ ]$\", \"\
    \", str);\n  return str;\n}\n```\n\n### 问题 90: 备份日志文件\n\n我的日志文件已经变得太大，需要备份并压缩。使用\
    \ `mv` 重命名文件会破坏任何对文件的链接，并可能干扰使用日志的服务器。如果预计服务器运行 24/7，重命名不是选项。\n\n我该如何这样做？\n\n\
    答：这是一个可能的解决方案：\n\n```bash\nsuffix=`date +%Y%m%d%H%M%S`.bak\nnewFileName=${YourLogName.log}.${suffix}\n\
    cp -p YourLogName.log $newFileName\ncp /dev/null YourLogName.log\ncompress $newFileName\n\
    ```\n\n日志副本被制作并压缩，日志文件被初始化（清空）并准备好接收更多消息。处理可以不中断地继续。假设存在丢失少量消息的可能性，所以在低频率使用期间通过\
    \ crontab 条目执行此。\n\n### 问题 91: 防止同时执行同一脚本\n\n我如何防止同时执行同一个脚本？\n\n答：尝试此过程：\n\n```bash\n\
    My_pid=$$\nprint $My_pid >> temp.file\nread input_pid < temp.file\nif [[ \"$input_pid\"\
    \ == \"$My_pid\" ]] then\n  (允许脚本继续)\nelse\n  (退出脚本，My_pid 不是第一个)\nfi\n```\n\n"
- fmt: '

    This guarantees that the first instance of the script submitted will run and any
    other occurrences of the same script will exit. Remove `temp.file` before the
    script ends and I suggest using a `Trap`. It’s better than trying to deal with
    `ps`/`grep` and it makes a nice little function.


    If only one instance of a script should run at a given time, a lock directory
    could be used to ensure mutual exclusion:


    ```bash

    lockname=/tmp/myscript.lock


    if mkdir "$lockname"

    then

    echo >&2 "aquired lock; continuing"

    # Remove lock directory when script terminates

    trap ''rmdir "$lockname"'' 0

    trap "exit 2" 1 2 3 15

    else

    echo >&2 "lock already held"

    echo >&" "another script instance running?"

    exit 1

    fi

    ```


    This can be extended to write the current process id to a file in the lock directory.
    This way, another instance can check if the process that acquired the lock is
    still running.


