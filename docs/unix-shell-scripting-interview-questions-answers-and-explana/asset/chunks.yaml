  trans: "\n\n# 问题 03：语言结构\n\n你如何实现一个 shell 脚本？\n\n答：Shell 脚本语言与其他编程语言一样，具有条件执行（`if-then-else`；`while`）、迭代执行（`for`\
    \ 循环）、switch 语句以及 goto 语句结构：\n\n## 1. if-then-else\n\n`if-then-else` 构造的语法为：\n\
    `if` (expr) simple-command`\n\n或\n\n```\nif ( expr ) then commandlist-1 [else\
    \ commandlist-2]\nendif\n```\n\n表达式 `expr` 将被求值，并根据其值执行 `commandlist-1` 或 `commandlist-2`。结构中用\
    \ `[` 和 `]` 包围的部分是可选的。这是软件世界中的标准表示法，请记住它。\n\n例如，假设我们编写一个 shell 脚本，该脚本应该有两个参数，并且代码将从这两个参数中设置两个变量\
    \ `name1` 和 `name2`：\n\n```bash\nset name1 = $argv[1]\nset name2 = $argv[2]\n\
    ```\n\n（推测它之后会使用这些变量）。但假设我们还想进行错误检查，如果用户提供的参数少于两个或多于两个，则输出错误信息。可以使用以下代码：\n\n```bash\n\
    if ($#argv <> 2) then\n  echo \"you must give exactly two parameters\"\nelse\n\
    \  set name1 = $argv[1]\n  set name2 = $argv[2]\nendif\n```\n\n## 2. while\n\n\
    `while` 循环构造的语法为：\n\n```\nwhile ( expr )\ncommandlist\nend\n```\n\n命令列表将一直执行，直到\
    \ `expr` 求值为虚假。\n\n## 3. foreach\n\n`foreach` 循环构造的语法为：\n\n```\nforeach var (\
    \ wordlist )\ncommandlist\nend\n```\n\n命令列表会为 `wordlist` 中的每个单词执行一次，每次变量 `var`\
    \ 都将包含该单词的值。例如，以下脚本可以在当前目录的所有直接子目录中搜索特定文件（如果找到则退出）：\n\n```bash\n#! /bin/csh -f\n\
    set f = $1\nforeach d (*)\n  if (-e $d/$f) then\n    echo FOUND: $d/$f\n    exit(0)\n\
    \  endif\nend\necho $f not found in subdirectories\n```\n\n例如，假设我将此脚本命名为 `FindImm`，我的当前目录包含文件\
    \ `s`、`t` 和 `u`，其中 `s` 和 `t` 是子目录，且 `t` 中有一个文件 `x`。\n\n输入：\n`FindImm x`\n\n将产生消息\n\
    `FOUND: t/x`\n\n原理如下：在行 `foreach d (*)` 中\n`*` 是通配符，它会展开为当前目录下所有文件的列表，即 `(s t\
    \ u)`。因此，for 循环首先设置 `d = s`，然后是 `d = t`，最后是 `d = u`。\n\n在行 `if (-e $d/$f) then`\
    \ 中，`-e` 表示存在；换句话说，我们在询问文件 `$d/$f` 是否存在。如果我们像示例那样输入 `FindImm x`，`$f` 将是 `x`，`$d`\
    \ 起为 `s`，因此我们将询问文件 `s/x` 是否存在（答案为否）。\n\n## 4. switch\n\n`switch` 命令提供了类似于 C 语言中\
    \ switch 语句的多分支功能。`switch` 的通用形式为：\n\n```\nswitch ( str )\ncase string1:\n  commandlist1\n\
    \  breaksw\ncase string2:\n  commandlist2\n  breaksw\ndefault\n  commandlist\n\
    endsw\n```\n\n给定的字符串 `str` 将连续与 `case` 模式进行匹配。控制流切换到第一次匹配的地方。与文件名展开一样，case 标签可以是字面量字符串，也可以包含变量替换，或包含如\
    \ `*`、`?` 等通配符字符。\n\n## 5. Goto\n\n`goto` 命令提供了一种无条件跳转到由标签标识行的方法。\n\n`goto lab`\n\
    \n其中 `lab` 是脚本中某处行（独占一行）的标签，格式为 `lab`。\n\n## 6. 用于删除文件的 Shell 脚本\n\n这段代码我们将命名为\
    \ `Del`，它将像 `rm` 一样删除文件，但在删除每个要删除的文件之前提示你确认，包括目录文件（`rm` 的 `-i` 选项不会这样做）。\n\n```bash\n\
    #! /bin/csh -f\nforeach name ($argv)\n  if ( -f $name ) then\n    echo -n \"delete\
    \ the file '${name}' (y/n/q)?\"\n  else\n    echo -n \"delete the entire directory\
    \ '${name}' (y/n/q)? \"\n  endif\n  set ans = $<\n  switch ($ans)\n    case n:\n\
    \      continue\n    case q:\n      exit\n    case y:\n      rm -r $name\n   \
    \   continue\n  endsw\nend\n```\n\n在继续阅读之前，尝试自己运行这个程序。建立一个测试目录，其中包含几个文件，至少有一个子目录，且该子目录下至少有一个文件。之后，你可以输入\
    \ `Del *`。\n\n这一行：\n`if ( -f $name ) then`\n测试名为 `$name` 的是否为普通文件，而不是目录。\n\n`echo`\
    \ 的 `-n` 选项告诉 shell 不要打印换行符，我们的答案 `y/n/q` 将在同一行。\n\n在行 `set ans = $<` 中\n符号 `<$`\
    \ 表示键盘输入。\n\n关键字 `continue` 意味着回到循环顶部。\n\n`rm` 命令的 `-r` 选项意味着如果参数是目录，则删除该目录及其所有文件和子目录。\n\
    \n# 问题 04：Shell\n\n为什么我应该使用 Shell？\n\n答：很大可能是因为它是可移植的。\n\n# 问题 05：学习脚本\n\n是否有链接可以开始？\n\
    \n答：尝试这个：\n（注意：提供的问题 5 的文本似乎损坏或包含占位符）。\n\n# 问题 06：UNIX 文件名\n\n在哪里可以获得 UNIX 文件名及其功能的解释？\n\
    \n答：`/`：根目录。在 Unix 类系统中，有一个统一的目录。一切都从根目录开始。根目录由斜杠（\"/\"）表示，后面没有其他字符。根目录下挂着许多目录。\n\
    \n- `/bin`：包含系统管理员和用户都可以使用的命令，单用户模式下是必需的。\n- `/sbin`：用于系统管理和维护的工具（以及其他 root 命令）存储在\
    \ `/sbin`。\n- `/boot`：用于内核执行 `/sbin/init` 之前所需的一切。\n- `/dev`：存放特殊文件的地方。特殊文件代表输入输出（i/o）设备，如\
    \ tty（终端）、磁盘驱动器或打印机。Unix 将此类设备视为文件。`/dev` 还包含一个名为 `MAKEDEV` 的脚本，可以根据需要创建设备。它可能还包含\
    \ `MAKEDEV.local` 用于任何本地设备设备。\n- `/etc`：用于系统配置文件和目录。例如启动脚本、网络配置等。\n- `/usr`：`/usr`\
    \ 是共享的只读数据。它可以与具有相同架构和操作系统版本的机器共享，根目录的大部分结构在这里镜像。\n- `/lib`：这些用于必需的共享库和内核模块。\n\
    \n"
