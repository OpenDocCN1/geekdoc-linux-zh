    Question 04: Shells


    Why should I use Shells?


    A: Well, most likely because it’s a simple way to string together a bunch of UNIX
    commands for execution at any time without the need for prior compilation. Also
    because it’s generally fast to get a script going. Not forgetting the ease with
    which other scripters can read the code and understand what is happening. Lastly,
    they are generally completely portable across the whole UNIX world, as long as
    they have been written to a common standard.


    Question 05: Learning Shell Scripting


    Is there a link where I can start learning UNIX scripting and can go online and
    download the content? I can start with basic Bourne scripting.


    A: Try this:


    [ ] abs-guide.html.tar.gz 21-Oct-2005 09:28 479k GZIP compressed docume>


    [ ] abs-guide.pdb21-Oct-2005 09:28 507k


    [ ] abs-guide.pdf21-Oct-2005 09:28 1.8M


    [ ] abs-guide.ps.gz 21-Oct-2005 09:28 1.1M GZIP compressed docume>


