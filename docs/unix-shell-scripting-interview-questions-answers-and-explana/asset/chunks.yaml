    start to look at this in detail starting at the beginning.


    In the Beginning:


    The first line of any script should always look a bit like the top line in the
    example basic shell script; the only difference would be the path leading to the
    shell executable file, in this case the /bin/sh part. By default, the UNIX system
    will attempt to execute an ASCII text file


    if the files name is supplied as the first argument on the command line. UNIX
    will attempt to execute the file in the current shell and try to process the included
    command strings within the file using the syntax rules of the current shell. So,
    if you are using the Bourne Shell as your default environment and the ASCII file
    contains a list of UNIX command structures formatted how the Bourne Shell likes
    them to be formatted, all will work fine. However, if you try and execute a C
    Shell file with a different syntax structure, the Operating System will complain
    about unrecognized commands and syntax errors. The reason is no one told the Operating
    System that it was a C Shell file, so it processed it as a Bourne Shell. The correct
    way to indicate this to the Operating System is to pass the script name to the
    shell executable as an argument thus:


    user@system$ /bin/csh my_script arg_1 arg_2


    However, it didn''t take long for someone to notice that this was extra typing
    that could well be done away with and hence the short hand first line comment
    was born.


    Basically, all comments in shell scripts start with a hash sign (#). However,
    for the first line only, UNIX reads past the hash to see what''s next. If it finds
    an exclamation point (!), or Bang! as it''s known, then what follows is taken
    as the path to the shell executable binary program. Not only can that, but all
    the command line arguments that the shell executable allows also be stacked up
    on this line. With this feature it doesn''t matter what flavor of shell your environment
    is, you can execute a script in any other flavor of shell, as if it was a real
    UNIX command. Let’s look at the Bourne Shell syntax rules more closely. It would
    be helpful at this point to print out the sh man pages from your system so that
    you can compare them with what I have here.


