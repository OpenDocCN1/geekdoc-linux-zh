    case label may be a literal string, or contain variable substitution, or contain
    wild-card character such as *,?, etc.


    5\. Goto:


    The goto command provides a way to branch unconditionally to a line identified
    by a label.


    goto lab


    where lab is a label on a line (by itself) somewhere in the script in the form
    lab.


    6.  A Shell Script for Deleting Files:


    This code, which we will call Del, will delete files like rm does, prompting for
    your confirmation for each file to be deleted, including directory files (which
    the -i option of rm won''t do).


    #! /bin/csh -f


    foreach name ($argv)


    if ( -f $name ) then


