    end


    The command list will be executed until the expr evaluates to false.


    3\. foreach:


    The syntax of foreach loop construct is


    foreach var ( worddlist )


    commandlist


    end


    The command list is executed once for each word in the wordlist, and each time
    the variable var will contain the value of that word. For example, the following
