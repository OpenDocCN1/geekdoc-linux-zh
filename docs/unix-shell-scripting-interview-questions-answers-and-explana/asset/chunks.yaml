    \n我有大约 70 个文件需要合并成一个。每个文件大约有 7 行数据。我格式是 `run.ksh`，我希望 `run.ksh`\n在 `file1` \n\n\
    我能够命令行命令行使用 `pr` 命令（以及各种标志）合并三个文件。\n\n我该如何按照上述格式将所有文件放在一起呢？\n\n**A**: 假设所有文件都在一个目录中且该目录下没有其他文件，可以使用类似下面的命令：\n\
    \n```bash\ncd /path/to/dir\nset -- $(ls)\nwhile [ $# -gt 0 ]\ndo\n  # 现在使用 $1\
    \ $2 和 $3\n  paste...\n  # 跳过下 3 个文件并从 $# 中减 3\n  shift 3\n  # 空行\n  echo\ndone\
    \ >/path/to/outfile\n```\n\n### 问题 23：查找子字符串\n\n我有一个 `ksh` 脚本，其中有两个包含目录路径的变量 `SB_HOME`\
    \ 和 `CD`。我想测试 `CD` 是否在 `SB_HOME` 下，然后用第三个变量 `BASE` 填充 `SB_HOME` 下包含 `CD` 的目录值。\n\
    \n例如，如果 `SB_HOME` 是 `\"/home/mthales/workspace\"` 且 `CD` 是 `\"/home/mthales/workspace/Testing/src/level1/sub\"\
    `，我希望 `BASE` 变为 `\"/home/mthales/workspace/Testing\"`\n\n我有一行 `if [ -n \"$(echo\
    \ \"${CD}\" | grep \"${SB_HOME}\")\" ]; then` 可以测试 `CD` 是否在 `SB_HOME` 下，但我无法成功从\
    \ `CD` 中提取出子字符串。\n\n我该如何处理？\n\n**A**: 使用 `ksh`，这应该可以解决你的问题：\n\n```bash\n#!/bin/ksh\n\
    SB_HOME=\"/home/mthales/workspace\"\nCD=\"/home/mthales/workspace/Testing/src/level1/sub\"\
    \nif [[ \"${CD}\" == \"${SB_HOME}\"* ]]\nthen\n  # 只获取子目录\n  SUBDIR=${CD#${SB_HOME}/}\n\
    \  print \"SUBDIR is $SUBDIR\"\n  # 将子目录的第一层附加到 SB_HOME\n  BASE=${SB_HOME}/${SUBDIR%%/*}\n\
    \  print \"BASE is ${BASE}\"\nelse\n  print \"Error: ${CD} is not in ${SB_HOME}\"\
    \n  exit 1\nfi\n```\n\n### 问题 24：编写脚本\n\n在运行 `>script name` 之前不在前面添加 `./` 有什么危险？\n\
