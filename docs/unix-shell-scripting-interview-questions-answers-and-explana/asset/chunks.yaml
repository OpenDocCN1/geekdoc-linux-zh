    \ [ VAR [ word ] ]\nunsetenv variable\n\nksh\nset [ +aefhkmnopstuvx ] [ +o option\
    \ ] ... [ +A name ] [ arg ... ]\nunset [ -f ] name ...\nexport [ name [ =value\
    \ ] ] ...\n```\n\n## 问题 93：构建带有日历的文本文件\n\n是否有方法使用 korn shell 构建一个包含 2 年日期的文本文件，日期格式为\
    \ `YYYYMMDD`？\n\n例如，生成一个内容如下的文件：\n20010101\n20010102\n20010131\n20010201\n20010228\n\
    20010301\n依此类推。\n\n答：使用以下代码：\n\n```bash\n#! /usr/bin/ksh\n# ja fe ma ap ma ju\
    \ ju ag se oc no de de de\nset -A lasts 0 31 28 31 30 31 30 31 31 30 31 30 31\n\
    typeset -Z2 dmonth dday\n# # 循环年份\nyear=2001\nwhile ((year<2003)) ; do\n# # 是闰年吗？\n\
    leap=0\nif ((!(year%100))); then\n((!(year%400))) && leap=1\nelse\n((!(year%4)))\
    \ && leap=1\nfi\n#\n# 设置二月份的天数\nlasts[2]=28\n((leap)) && lasts[2]=29\n#\n# 循环月份\
    \ month=1\nwhile ((month<13));\ndo # # 循环日期 day=1\nwhile((day<(lasts[month])+1))\
    \ ;\ndo dday=$day dmonth=$month\necho ${year}${dmonth}${dday} ((day=day+1))\n\
    done ((month=month+1))\ndone\n((year=year+1))\ndone\nexit 0\n```\n\n## 问题 94：循环中的\
    \ grep\n\n我正在尝试写一个接收用户输入 `userid` 的脚本。我被困了如何在审计日志文件中检查该是否为有效用户 ID 上。\n\n以下是我的代码：\n\
    \n```bash\ncd $CCP_AUDIT\ncat * > /export/home/$USR/l***/files\necho \"UserId:\\\
    c\"\nread UserId\n#日期函数\necho \"DATE [YYYY-MM-DD] : \\c\"\nread xxx\n```\n\n我需要帮助将此放入循环中：\n\
    \n```bash\ngrep $xxx /export/home/$USR/lalitha/files |grep -v Created |grep -v\
    \ Rejected | grep -i $UserId | Mail -s \"Transactions for $UserId\" ***@***.com\n\
    ```\n\n如果某个用户没有日志记录，我如何跳出循环？\n\n答：我理解这意味着输出结果为零行。\n\n这时使用临时文件是有意义的。你需要为了两个不同的用途使用相同的中间数据：\n\
    \n代码：\n```bash\ngrep ... > tempfile\nif [ -s tempfile ]; then\nMail ... < tempfile\n\
    else\necho No such userid $UserId >&2\nbreak\nfi\nrm tempfile\n```\n\n## 问题 95：在菜单中生成选项列表\n\
    \n我正在创建一个文本文件（`systems.txt`），其中按主机名列出服务器列表。然后我想输出一个菜单，每个主机名带有一个用于从列表中选择它的数字。这种将数字与主机名关联的方式让我很困惑。\n\
    \n以下是我的代码：\n\n```bash\n#!/bin/bash\nclear\nCOUNT=0\nSYSTEMS=`cat systems.txt`\n\
    while [ \"$CHOICE\" != \"q\"\ndo\nfor SYSTEM in $SYSTEMS\n```\n（注：原文文本在 `SYSTEMS`\
    \ 之后截断了，故翻译至此。）\n"
- fmt: '

    To answer your question, you need to make a pass though the file creating lists
    of each of the types of 03 records. Then you need to examine the lists. If a list
    has less then 100 items, all items on the list will be marked ok. If the list
    has over 100 items, only some will be marked ok.


    Since you counted the elements, you can compute 2% of that number. Now you know
    how many to mark ok.


    To mark one ok, generate a random integer between 1 and `n` where `n` in the number
    of non-ok elements in the list. Now scan the list from element 1 to the end and
    find the selected element. Mark it ok. Subtract one from your number of non-ok
    elements on the list. Generate a new random integer between 1 and current number
    of non-ok elements. Find that one. And so on until you have marked the required
    number ok.


    After you have done this with each list, go back to main file. For each `03` record,
    see if it''s marked ok on the lists. If so, write it and the child records to
    the final output file.


    ## Question 99: awk in Shell Script


    I have an `awk` script contained within a `ksh` script that I want to read the
    contents of a file with, say 3 records. Fields are `a`, `b`, and `c`, delimiter
    `|`.


    I want to read the file and then I want to set different variables for `$1`, `$2`,
    `$3` to be used as parameters to run a series of reports outside the scope of
    the `awk` script but within the same `ksh` script.


    Here''s part of what I have:


    ```bash

    # Run each of the reports in series (3 total) for each record:


    awk ''

    BEGIN{FS="|";FILENAME="$loc/myfile"}

    split(FILENAME,results,FS)

    a=results[1]

    b=results[2]

    c=results[3]

    etc…

    ```


    How do I execute the rest of a command within/outside of?


    A: I cannot understand your code, but I gather that you have a file with three
    data fields per line and the fields are delimited by `|` like this:


    ```

    1|2|3

    4|5|6

    ```


    I think that you want to loop and set `a=1`, `b=2`, and `c=3` on the first loop
    and `a=4`, `b=5`, and `c=6` on the second loop. That is easy.


    Code:


    ```bash

    /usr/bin/ksh

    exec < inputfile

    IFS=''|''

    while read a b c ; do

    echo a = $a

    echo b = $b

    echo c = $c

    done

    exit 0

    ```


    I don''t see an easy way to inject `awk` into something like this.


    ## Question 100: while Loop


    In a text file (`PL_SENDEVENT`), I have the following line:


    `CHANGE_STATUS INACTIVE`


    And another file (`PL_JOBS`) with the following lines:


    ```

    TEST

    TEST1

    ```


    What I''m trying to do is change the `STATUS` of `TEST` and `TEST1` to the status
    that I specify in the file which is `INACTIVE` (or `IN`) in this case. I do not
    want the script to exit until both jobs have been verified that they are in an
    `INACTIVE` (`IN`) status. It is not going well so far. As it stands, it exits
    successfully once it sets `TEST` to `INACTIVE` and doesn''t even check `TEST1`.
    If the jobs are not in an `INACTIVE` status, I want it to check again until they
    both are.


    Here’s what I have now:


    Code:


    ```bash

    cat $PL_DIR/PL_SENDEVENT | while read event status

    do

    case $event in

    CHANGE_STATUS)

    cat $PL_DIR/PL_JOBNAME | while read job

    do

    sendevent -E CHANGE_STATUS -s ${status} -J ${job}

    done

    case $status in

    INACTIVE) export ST=IN ;;

    ON_HOLD) export ST=OH ;;

    ON_ICE) export ST=OI ;;

    TERMINATED) export ST=TE ;;

    *) echo "Invalid Status!"; exit 1 ;;

    esac

    rc3=1

    while (($rc3 > 0))

    do

    sleep 5

    cat $PL_DIR/PL_JOBNAME | while read job

    do

    $AUTOSYS/bin/autorep -J ${job} -l0 | sed ''1,4d'' |

    if [ `awk ''{print $6}''` == ${ST} ]; then

    echo "Status is set for ${job}!"

    rc3=0

    fi

    done

    done ;;

    ```


    What am I doing wrong?


    A: Try replacing the last part with this:


    Code:


    ```bash

    rc3=1

    while (($rc3 > 0))

    do

    sleep 5

    rc7=0

    cat $PL_DIR/PL_JOBNAME | while read job

    do

    $AUTOSYS/bin/autorep -J ${job} -l0 | sed ''1,4d'' | \

    if [ `awk ''{print $6}''` == ${ST} ]; then

    echo "Status is set for ${job}!"

    (( rc7 += 1 ))

    fi

    done

    [ $rc7 == `wc -l $PL_DIR/PL_JOBNAME` ] && rc3=0

    done

    ```


