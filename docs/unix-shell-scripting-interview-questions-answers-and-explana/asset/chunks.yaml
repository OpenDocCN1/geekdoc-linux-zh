    ## Introduction


    UNIX shell, also called "the command line," provides the traditional user interface
    for the UNIX operating system. Users direct the operation of the computer by entering
    command input as text for a shell to execute. Within the Microsoft Windows suite
    of operating systems the analogous program is `command.com` or `cmd.exe` for Windows
    NT-based operating systems.


    In the most generic sense of the term, shell means any program that users use
    to type commands. Since in the UNIX operating system users can select which shell
    they want to use (which program should execute when they login), many different
    shells have been developed. It is called a "shell" because it hides the details
    of the underlying operating system behind the shell''s interface (contrast "kernel"
    which refers to the lowest-level or “inner-most” component of an operating system).
    Similarly, graphical user interfaces for UNIX, such as `GNOME` and `KDE`, are
    sometimes called visual shells or graphical shells. By itself, the term shell
    is usually associated with the command line. In UNIX, any program can be the user''s
    shell. Users who want to use a different syntax for typing commands can specify
    a different program as their shell.


    The term shell also refers to a particular program, namely the Bourne shell, `sh`.
    The Bourne shell was the shell used in early versions of UNIX and became a de
    facto standard; every Unix-like system has the equivalent of the Bourne shell.
    The Bourne shell program is located in the UNIX file hierarchy at `/bin/sh`. On
    some systems, such as `BSD`, `/bin/sh` is a Bourne shell or equivalent, but on
    other systems such as `Linux`, `/bin/sh` is likely to be a link to a compatible,
    but more feature-rich shell, such as `Bash`. `POSIX` specifies the standard shell
    as a strict subset of the Korn shell.


    The UNIX shell was unusual when first created, since it is both an interactive
    command language and the language used to script the system; it is a scripting
    programming language. Many shells created for other operating systems since offer
    rough equivalents to UNIX shell functionality.


    On systems using a windowing system, some users may never use the shell directly,
    though on UNIX systems, the shell is still the implementation language of system
    startup scripts, including the program that starts the windowing system, the program
    that dials into the Internet, and many other essential functions.


    On `MS-DOS`, `OS/2`, and Windows, equivalents to UNIX system scripts are called
    batch files, and have either a `.bat` or `.cmd` extension. A newer CLI, code named
    `Monad` and to be released as the Windows PowerShell, will replace the existing
    NT command line, `cmd.exe`; it has many features derived from UNIX shells, though
    it uses a somewhat different syntax.


    Many regular users of a UNIX system still find a modern command line shell much
    more convenient for many tasks than any GUI application.


    Due to the recent movement in favor of open source, most UNIX shells have at least
    one version that is open source.


    ## BASIC QUESTIONS AND ANSWERS:

    Questions most likely to be asked by beginners


    ### Question 01: Shell Script


    What is shell script anyway?


    A: A shell script, in its most basic form, is simply a collection of operating
    system commands put into a text file in the order they are needed for execution.
    Using any of the shells mentioned so far, a text file containing the commands
    listed in example basic shell script would work every time the script was executed.


    Example basic shell script:


    ```sh

    #!/bin/sh


    rm -f /tmp/listing.tmp> /dev/null 2>&1


    touch /tmp/listing.tmp


    ls -l [a-z]*.doc | sort> /tmp/listing.tmp


    lpr -Ppostscript_1 /tmp/listing.tmp


    rm -f /tmp/listing.tmp

    ```


