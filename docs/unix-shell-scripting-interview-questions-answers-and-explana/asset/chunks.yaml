    [DIR] html/ 21-Oct-2005 09:27-


    [DIR] images/18-Jul-2000 11:24-


    Question 06: UNIX Filenames


    Where can I get an explanation of the UNIX filenames and their functions, e.g.
    /usr, /etc, /var?


    A: /: The Root Directory. Under UNIX-like system there is just one unified directory.
    Everything begins with the root directory. The root directory is symbolized by
    just a forward slash ("/"), with nothing following it. There are many directories
    hanging off of the root directory. The contents of the root file system should
    be adequate to boot, restore, recover, and/or repair the system.


    /bin: This contains commands that may be used by both the system administrator
    and by users, but which are required in single user mode. It may also contain
    commands which are used indirectly by scripts.


    /sbin: Utilities used for system administration and maintenance. (and other root-only
    commands) are stored in /sbin.


    /boot: This is for anything which is used before the kernel execs /sbin/init.
    This includes saved master boot sectors, sector map files, and anything else that
    is not directly edited by hand.


    /dev: This is where special files are kept. Special files represent input/output
    (i/o) devices, like a tty (terminal), a disk drive, or a printer. Unix treats
    such devices as files. /dev also contains a script named MAKEDEV which can create
    devices as needed. It may also contain a MAKEDEV.local for any local-only devices.


    /etc: This is for the system configuration files and directories. Examples are
    startup scripts configuration files for networking, etc.


    /usr: /usr is shareable, read-only data. It maybe shared with other machines with
    the same architecture and operating system version and most of the root directory
    structure is mirrored here.


    --- /usr/bin: most user commands


    --- /usr/local: local software


    --- /usr/dict: Word lists


    --- /usr/etc: Site-wide system configuration


    --- /usr/includes: Directory for standard includes files.


    --- /usr/lib: Libraries for programming and packages


    --- /usr/man: Manual pages


    --- /usr/sbin: Non-essential standard system binaries


    --- /usr/share: Architecture-independent data


    --- /usr/src: Source code


    etc.


    /lib: These are used for essential shared libraries and kernel modules.'
