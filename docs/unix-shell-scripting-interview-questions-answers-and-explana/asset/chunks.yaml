    The correct way to indicate this is to pass the script name as an argument thus:


    ```bash

    user@system$ /bin/csh my_script arg_1 arg2

    ```


    ### Question 02: Invoking Shell Scripts


    How do you invoke shell scripts?


    A: There are two ways to invoke a shell script file.


    1. **Direct Interpretation**:

    In direct interpretation, the command `csh filename [arg ...]` invokes the program
    `csh` to interpret the script contained in the file `filename`.


    2. **Indirect Interpretation**:

    In indirect interpretation, we must insert as the first line of the file:


    ```sh

    #! /bin/csh

    ```


    or


    ```sh

    #! /bin/csh -f

    ```


    There are situations in which this is not necessary, but it won''t hurt to have
    it and the file must be made executable using `chmod`. Then it can be invoked
    in the same way as any other command, i.e., by typing the script file name on
    the command line.


    The `-f` option says that we want fast startup, which it will achieve by not reading
    or executing the commands in `.cshrc`. Thus for example, we won''t have the “set”
    values for shell variables or the aliases from that file, but if we don''t need
    them, this will be much faster (if we need a few of them, we can simply add them
    to the script file itself).

