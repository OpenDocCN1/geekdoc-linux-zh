    Question 63: Schedule Script without Using cron


    How can I run my script every day at 8:00 a.m. and 10:30 a.m. except Saturday
    and Sunday? I don''t have cron installed in my account.


    A: Try this code:


    #!/bin/ksh


    TIMES="0800 1030"


    DAYS="1 2 3 4 5"


    JOB="uptime"


    while true


    do


    sleep 50 # check at least once a minute


    for DAY in $DAYS


    do


    if [[ "$(date +%w)" -eq "$DAY" ]]


    then


    for TIME in $TIMES


    do


    if [[ "$(date +%H%M)" -eq "$TIME" ]]


    then


    $JOB &


    # make sure we do


    # not run twice


    sleep 20


    fi


    done


    fi


    done


    done


    Replace uptime with your job of course and run this script in the background,
    probably best with nohup.


    If you check every 60 seconds, there is a very small chance on a busy system that
    it will check once at 07:59:59, and the next time at 08:01:00, so your job would
    not run.


    $JOB & runs the job in the background, so that the annicron keeps running, in
    case the jobs overlap or take a long time, etc. You can take out the & of course
    if you want, and that would make sure they would never overlap.


    “sleep 20” is to make sure it doesn''t run a job twice in one minute, e.g., at
    08:05 and 08:55.


