    But you asked about "if (($lines = 0 ))." That precise syntax is a terrible mistake
    and you should probably never use it. First, `ksh` has built-in arithmetic and
    you can do stuff like:


    ```bash((k=7+1)) ; echo $k

    ```


    and get 8\. The `((expression))` syntax is just a command to do arithmetic. This
    command has an exit code. If the expression is non-zero, the command succeeds.
    But if the expression is zero, the command fails. So you can test the result of
    an expression. I often do stuff like:


    ```bash

    if ((lines == 0 ))

    ```


    which tests if `lines` are equal to 0\. With `(($lines = 0))`, assuming that lines
    contained the name of another variable, it might almost work:


    ```bash

    lines=xyz


    if (($lines = 0))

    ```


    `$lines`` would be replaced by `xyz`, so the shell would see `((xyz = 0))`. `xyz`
    would set to 0\. `((xyz = 0))` would always fail so the `if` statement would never
    be true. You never need to use a `$` sign inside `((expression))`. This is ok:


    ```bash

    ((lines=lines+1))

    ```


    The arithmetic statement will know that `line` is a variable and will look up
    the value. `Bash` has also picked up arithmetic from `ksh`.


