    Question 82: Split a Document


    I have a document of more than 80,000 lines. It is generated in a dynamic way,
    sometimes it has 80,000 others 30,000, or 1000,000\. I’m trying to break this
    file in only 1 line of commands but I want to break it in N different files of
    nearly the same lines equally. So I need to check the number of lines of this
    file and after that split it in N different files with the same number of lines.
    This is because I need to have parallel process working each one of these files.


    I know about the wc -l command return the number of lines, and the split command
    split -l XXXXX the file.


    How can I pipe these commands in order to have N files of the same time in a dynamic
    way?


    A: You can try this command:


    split -l `wc -l yourfile | awk ''{print $1/N''` yourfile


    You can replace N by any number.


