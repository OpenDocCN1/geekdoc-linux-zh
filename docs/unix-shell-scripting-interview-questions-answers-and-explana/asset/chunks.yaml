    Code:


    #!/bin/sh


    cp thisfile ../thatfile


    cd mydir


    This type of file works fine when we issue it from the command line, but when
    we register it as a crontab, it seems that the files/directories have to be referred
    to as absolute path.


    It is easy to change this script since it is small, but what if we have a really
    large shell script and all of it is implemented with relative references.


    Is there another option than to check every line and make it absolute?


    A: In the crontab:


    cd /path/to/dir && yourscript


    Question 72: Security Work Around


    I have a JSP page running on Redhat that will execute a shell script. The shell
    script contains the following code:


    #!/bin/sh


    scp schedule.sh user1@differenthost:~/schedule.sh


    ssh user1@differenthost <<END_SCRIPT


    ./schedule.sh $1 $2


    exit


    END_SCRIPT


    exit 0


    Basically, the code uploads a shell script to a different box and then ssh to
    that box to execute that shell script with some arguments. This code is currently
    owned by “user1” on my Redhat and is working just fine when evoked from the command
    line. I have setup private/public ssh keys between user1 and a different host
    with no password required, so that I don’t have to hardcode the pw.


    My problem is, when this code is invoked from JSP, I get a permission denied error.
    I finally found out the reason for this and it was because JSP is running as the
    “Apache” user and it has no right to ssh to differenthost. A direct workaround
    will be to have this shell owned by the “Apache” user and setup a public/private
    key for “Apache” but this will create a big security risk.


    How I should go about setting the permission for my scenario?


    A: I''m a big fan of Sudo as a solution to security problems. If the sudoers file
    is set up correctly then Apache'' can run the transfer script as user1 and nothing
    else. The sudoers entry will look something like this:


    Code:


    apache thisserver = /usr/bin/su - user1 -c /home/user1/tx.sh


    Question 73: Renaming Multiple Files


    I want to create a shell script that will automatically rename a bunch of graphics
    files cutting off the last part of the filename as there is no pattern to match
    on without a bunch of if statements.


    For example, the filenames are:


    5568012_101_12.jpg


    5652901_101_12.jpg


    5890390_101_13.jpg


    5992313_101_71.jpg


    I simply want the files to be renamed as:


    5568012.jpg


    5652901.jpg


    5890390.jpg


    5992313.jpg


    Is there a way to do this?


    A: Yes there is. Here’s one possible way:


    ls *_*.jpg | awk ''{split($0,a,"_");print "mv "$0" "a[1]".jpg"}'' | sh -v


    Question 74: Traverse and Download


    Is it possible to give a URL to a script and pick out the link for a ".doc" or
    ".xls" then download it?


    For example:


    % find_file ".doc .xls" http://local_site/foo_docs_1.htm


    It will go to foo_docs_1.htm and look for .doc and .xls files and download it
    for me.


    A: You can try this procedure:


    wget with the -A or --accept option:


    Code:


    wget -r -p -A.doc,.xls http://local_site/foo_docs_1.htm


    Or:


    lynx with the -dump option, then wget :


    Code:


    lynx -dump http://local_site/foo_docs_1.htm | \


    sed ''1,/References/d; s/.* //'' | \


    grep -E "\.(doc|xls)$" | \


    wget -i -


    Question 75: Output a Specific Line in a File


    In UNIX, the head command can be used to show the first few lines of a file. However,
    what if we want to show only a specific line?


    What if we wanted to show line 5 of a file named test.txt, is there any command
    that would accomplish this?


    A: One way to do that is:


    sed -n ''5p'' test.txt


    Here’s another way:


    awk ''NR==5{print;exit}'' test.txt


    Question 76: About Kill Command


    How does the kill command work?


    How does it communicate to a process that it should die?


    A: By a call to the system function signal.


    A signal is a kind of software interrupt that''s sent to the process. It’s kind
    of a tap-on-the-shoulder from the OS. The process can either handle the signal
    by jumping to some code that deals with it, or not. If a process is not programmed
    to handle a signal, the signal will usually cause the process to terminate. The
    programmer of the process can write handler routines to deal with or ignore every
    signal except for 9, SIGKILL. This is the only signal that can''t be caught and
    will kill all processes (unless something''s really messed up).


    The function sigaction (man sigaction) lets you define functions that your code
    will jump to handle whatever signals your code receives. This lets you "trap"
    those signals and allows you to do something smart and controlled, instead of
    just dying. This is useful to have a program shut down cleanly and properly close
    files instead of just aborting and leaving a mess.


    See the main pages for signal and sigaction. There are a lot of good links with
    info on signals. Here''s one:'
