- fmt: "\n`read number` //until valid number is inputted\n\nA: You can use `egrep`\
    \ to test:\n\nCode:\n\n```bash\nread foo echo \"${foo}\" | egrep \"^[0-9]+$\"\
    \ >/dev/null 2>&1 if [ \"$?\" -eq \"0\" ]; then echo \"Yay\" else echo \"Nay\"\
    \ fi\n```\n\n## Question 30: Remove Comma within Quotation Marks\n\nI have a csv\
    \ file where some strings are enclosed by quotation marks. We found that the following\
    \ `sed` operations:\n\n`/\\(\".*\\)[,]\\(.*\"\\)/\\1\\2/g'`\n\nwill remove the\
    \ commas within the quotation marks. If any exists, this is what we want but only\
    \ if one set of quotation marks exist within each line. When more than one set\
    \ of quotation marks exists then the `sed` operation does not work on that particular\
    \ line.\n\n`sed 's/\\(\".*\\)[,]\\(.*\"\\)/\\1\\2/g'`\n\nxxxxxxx,xxxxxxxx,\"Russellville,\"\
    ,AR,xxxxxx,xxxxxxx ,xxxxxxxx,\",ARLINGTON HEIGHTS,IL,60005,US,5.96,0.98,,,,,,,,,,,,,,,,,,,,,\
    \ ,,,,\n\nIs there a way to pass a second, third or multiple arguments within\
    \ the `sed` operations so when it does pass through a line with multiple quotes\
    \ it understands it and executes the operation of removing the commas?\n\nA: You\
    \ can do something like this:\n\n`sed -e 's/\\(\"[^,]*\\)[,]\\([^\"]*\"\\)/\\\
    1\\2/g' file`\n\n`sed`'s `regex-s` are \"greedy\" - specifying `.*` was eating\
    \ up too much and you had to limit it to a `,`.\n\nHow would you do that? If we\
    \ have \"something followed by a comma\" it means \"anything but a comma followed\
    \ by a comma\":\n\n`[^,]*`\n\nanything BUT a comma is repeated 0 or more times\n\
    \n`[,]`\n\nfollowed by a comma.\n\n## INTERMEDIATE QUESTIONS & ANSWERS\n\n## Question\
    \ 31: Search and Replace\n\nHow do I perform search and replace operations with\
    \ extended regular expressions?\n\nA: To perform search-and-replace operations\
    \ with extended regular expressions, copy and paste the following script to `/usr/local/bin/extreg`\
    \ or `$HOME/bin/extreg`:\n\nCode:\n\n```bash\n#!/bin/sh\n\nif [ $# -gt 1 ]; then\n\
    \  perl -we '$/=\"'\"$2\"'\";while(<>){'\"$1\"';print $_}'\nelse\n  perl -we 'undef\
    \ $/;$_=<>;'\"$1\"';print $_;'\nfi\n```\n\nSyntax: `extreg regexp [separator]`\n\
    \n\"regexp\"` is one or more extended regular expression, separated by a semicolon.\n\
    \nA `\"separator\"` is an optional separator, see `perl(1)`, section `$INPUT_RECORD_SEPARATOR`.\
    \ The data which has to be processed is divided into (with the separator ending)\
    \ blocks, on which the regular expressions are applied.\n\nIf you want to be portable\
    \ you should invoke `Perl` directly. `\"extreg\"` is primarily meant to be used\
    \ in your private scripts or in interactive shell mode.\n\n## Question 32: “Read\
    \ in a While” Loop\n\nI have a script which tries to read input from a user for\
    \ every value read from a file. The input file is:\n\nCode:\n\n```text\n#> more\
    \ testfile\nTEST1 | D200 | 12345601 | | ABC company | m\nTEST2 | D201 | 12345602\
    \ | | ABC company | m\n```\n\nThe script `test.sh` is as follows:\n\nCode:\n\n\
    ```bash\nwhile read line\ndo\n  read test?\"Enter a Value:\"\ndone < testfile\n\
    ```\n\nHowever when executed, the shell never responds to the `read` command.\n\
    \nCode:\n\n```text\n#>test.sh\n#>\n```\n\nIs there a special `read` option that\
    \ I have to use when using `read` within a `while` loop?\n\nA: Look at this code:\n\
    \n```bash\nwhile read line\ndo\n  read test?\"Enter a Value:\"\ndone < testfile\n\
    ```\n\nIn the first line of the above code, it says `read line`. This reads the\
    \ first line from the test file and puts it into the variable `line`. Again, when\
    \ you say `read test`, it actually reads the second line from test file and puts\
    \ it into the variable `test`. It won't take the input from the keyboard because\
    \ you have given the input as test file by specifying the `<`.\n\nUse this code:\n\
    \n```bash\n#!/usr/bin/ksh\nIFS=\" \"\nfor line in $(< testfile)\ndo\n  echo $line\n\
    \  echo \"Enter value :\"\n  read a\ndone\n```\n\nOr do this:\n\nCode:\n\n```bash\n\
    while read line\ndo\n  read test?\"Enter a Value:\" < /dev/tty\ndone < testfile\n\
    ```\n\n## Question 33: Shell Script Functions\n\nA simple shell script:\n\n```bash\n\
    date\ntest_fn()\n{\n  echo \"function within test shell script \"\n}\n```\n\n\
    On the shell prompt I run:\n\n`> . test`\n\nThen I invoke the function on the\
    \ command line as below:\n\n`test_fn()`\n\nIt echoes the line function within\
    \ the test shell script and works as expected.\n\nHow do I find out what are the\
    \ shell functions known to the current shell?\n\nA: In `ksh`, use `typeset +f`\
    \ and `unset –f`.\n\n## Question 34: Execute a Script for Each Logout\n\nHow do\
    \ I execute a script for each logout?\n\nA: Sometimes it's useful to execute a\
    \ command after each logout. For example, cleaning up temporary directories or\
    \ to log working hours.\n\nThis is the way to make the shell execute the script\
    \ `$HOME/.atexit` after each logout:\n\n1. Insert this line at the beginning of\
    \ the file `$HOME/.profile`:\n\n`trap \". $HOME/.atexit\" 0`\n\n2. Create a file\
    \ named `\"$HOME/.atexit\"`, that may contain arbitrary shell commands, for example:\n\
    \n`$HOME/.atexit`\n\n## Question 35: Calling Script from Inside\n\nWe have a script\
    \ to send but I want to call script1 inside. Is there any way we do this?\n\n\
    A: If you understand correctly, then do this:\n\nCode:\n\n```bash\n#!/bin/sh\n\
    # script1\n...\n```\n"
