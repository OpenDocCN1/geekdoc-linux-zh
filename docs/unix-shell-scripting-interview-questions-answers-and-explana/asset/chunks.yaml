    ## Question 96: Delete Empty Files in a Shell Script


    I''m trying to delete empty files in a directory. I have a cron that creates a
    flat file every 15 minutes. However, most times the flat file will be empty. How
    can I run a script to delete files that end with `.dat`?


    A: Try doing this:


    ```

    find ./ -name "*.dat" -size 0 -exec rm {} \;

    ```

    Read `man` page before invoking this so you understand it could start deleting
    things you did not want to.


    ## Question 97: Replace a Line in a File


    I have a property file in which the DB name is specified and when I run my servers
    they will point to the DB. But before that I just want to dynamically change the
    DB name in that property file. Say this is the line in that property file: I call
    the script like this: startup.DB


    A: Let `prop_file` is name of your property file. File `prop_file` contains the
    following line:

    Application.Database=dropDB


    Make shell script `startup.sh`

    Shell script `startup.sh` contains:

    ```bash

    sed "s/Application.Database=.*/Application.Database=$1/g" prop_file > tmp

    mv tmp prop_file

    ```

    Execute `sh startup.sh dropDB`

    All occurrences of `dropDB` will get replaced by `dropDB`.


