    }\n```\n\n### Question 09: Reading Characters from the Terminal\nHow do I read\
    \ characters from the terminal in a shell script?\n\nA: In `sh`, use `read`. It\
    \ is most common to use a loop like:\n\n```bash\nwhile read line\ndo\ndone\n```\n\
    \nIn `csh`, use `<` like this:\n\n```csh\nwhile ( 1 )\n  set line = \"$<\"\n \
