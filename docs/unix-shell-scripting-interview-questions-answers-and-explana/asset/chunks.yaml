    \n## Question 77: Calling Shell Script with `*` as a Parameter\n\nWhen running\
    \ a shell script, I want to call another shell script and pass in a parameter\
    \ representing a filename.\n\nThe structure of the filename is: `ProgramName.DatabaseName.Date.log`\n\
    \nThe `ProgramName` and `DatabaseName` are known but the date is unknown.\n\n\
    If:\n- `ProgramName=export`\n- `DatabaseName=test`\n- `Date=any value in the format\
    \ of <MonYY>`\n\nThe filename parameter passed in is: `export.test.*.log`\n\n\
    When I pass in this parameter, the shell script being called substitutes the `*`\
    \ with all sorts of strange values, whereas I want the shell to receive `export.test.*.log`\
    \ and treat the asterisk as an asterisk.\n\nHow can I do this?\n\nA: In the Korn\
    \ Shell, a `set -f` will turn off globbing so you can pass the asterisk as is.\
    \ That is, it won't translate the asterisk. It should appear like this:\n\n```bash\n\
    set -f\nshell.ksh ${FILE}.*.${FILE_EXT}\n```\n\n## Question 78: Extract a Section\
    \ of Text in File\n\nUsing a Bourne shell script, I need to extract some lines\
    \ from a text file.\n\nMy file looks like this:\n\n```\nSQL> SELECT bla bla bla\n\
    /export/oracle/myfile1.dbf\n/export/oracle/myfile2.dbf\n/export/oracle/myfile3.dbf\n\
    SQL> spool off\n```\n\nIn a file, I need to extract just the lines that start\
    \ with `/export...` to another file (`files.lst`). The tricky part is that the\
    \ header’s two lines and bottom single line will remain the same but the total\
    \ other lines (with `/export`) are variable.\n\nIs there some syntax to grab just\
    \ the `/export` lines?\n\nA: One way of doing that is through this:\n\n```bash\n\
    grep '^/export' /path/to/input > files.lst\n```\n\n## Question 79: Run UNIX in\
    \ a New Shell Inside a Shell Script\n\nI am having one situation in which I need\
    \ to run some simple UNIX commands after doing `chroot` command in a shell script.\
    \ this in turn creates a new shell.\n\nThe scenario is that:\n1. I need to have\
    \ one shell script which is run as a part of `crontab`.\n2. In this shell script,\
    \ I need to do a `chroot` to some particular directory.\n3. After `chroot`, I\
    \ need to run some UNIX command.\n\nHere is the script:\n\n```bash\n#!/usr/bin/ksh\n\
    cd /safedir/rdns/opt/MKDownload\n#java MKProcessor\nVal=`diff /safedir/rdns/opt/MKDownload/sun.csv\
    \ /safedir/rdns/opt/RDNS1.1/WEB-INF/lib/sun.csv |wc -l`\nif [ $Val -gt 0 ];\n\
    then\n(\n    # `mv /safedir/rdns/opt/RDNS1.1/WEB-INF/lib/sun.csv /safedir/rdns/opt/RDNS1.1/WEB-INF/lib/sun.csv.bak`\n\
    \    # `cp /safedir/rdns/opt/MKDownload/sun.csv /safedir/rdns/opt/RDNS1.1/WEB-INF/lib`\n\
    \    /usr/sbin/chroot /safedir/rdns /bin/sh ------------------1\n    echo `pwd`\
    \ -------------------------------------- 2\n    cd /opt/iws61/https-rdns/\n  \
    \  ./stop\n    ./start\n)\nfi\n```\n\nSo as apparent from the script, after chrooting\
    \ in line 1, it creates a new shell and the execution of this script suspends\
    \ there. As soon as I exit the shell, the remaining commands from line 2 onwards\
    \ execute in current shell and I get an error. But as per my requirement, the\
    \ remaining commands need to run from chrooted directory only.\n\nIs there a way\
    \ to solve this?\n\nA: If I were you, I would do this:\n\n```bash\n/usr/sbin/chroot\
    \ /safedir/rdns /bin/sh -c \"cd /opt/iws61/https-rdns ; ./stop ; ./start\"\n```\n\
    \n## Question 80: String Replacement Script\n\nI have a script right now that\
    \ is made to search through a file and replace certain strings with a new one.\
    \ The format to execute is `/subst <replacethis> <withthis> <filename>` and it\
    \ only updates the file if changes are made in order to preserve the time it was\
    \ made/last modified. I have this working 100% right now, but the next step is\
    \ to edit the script so that it is possible for users to do `/subst <replacethis>\
    \ <withthis> <filename> <filename2> <filename3> <filenamex>` as high as they want.\n\
    \nCan this be done?\n\nHere is my current script:\n\n```bash\n#!/bin/bash\nreplacethis=$1\n\
    withthis=$2\nfile=$3\nsed -e \"s+$replacethis+$withthis+g\" $file > $file.bak\n\
    cmp $file $file.bak > /dev/null\nif [ $? -eq 0 ]\nthen\n    echo \"Files are the\
    \ same, nothing was replaced.\"\n    rm $file.bak\nelse\n    mv $file.bak $file\n\
    fi\n```\n\nA: Of course you can! This code should work perfectly:\n\n```bash\n\
    #!/bin/bash\nreplacethis=$1\nwiththis=$2\nshift 2\nfor file in $@\ndo\n    sed\
