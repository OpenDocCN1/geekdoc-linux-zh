  \ `in01.txt` 和 `out01.txt` 运行程序 50 次，保持其他输入和输出不变。\n\n修复此问题的最好方法是什么？\n\n答：你需要必须遍历文件：\n\
  \n代码：\n\n```bash\n#!/bin/sh\n\ninfile=unknown\n\nwhile read f\ndo\n\necho \"$f\"\
  \ | grep \"^in\" > /dev/null\n\nif [ \"$?\" -eq \"0\" ]; then\n\ninfile=$f\n\nelse\n\
  \noutfile=$f\n# 好了，现在我们有 $infile 和 $outfile 了 ...\n\nif [ \"$infile\" != \"unknown\"\
