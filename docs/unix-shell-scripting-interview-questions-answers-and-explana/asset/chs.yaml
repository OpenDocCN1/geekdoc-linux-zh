  \n## 高级问题与解答：编程领域专家可能会问的问题\n\n### 问题 86: 菜单考量\n\n我正尝试在 Solaris 8 上使用 Bourne shell\
  \ 脚本增强菜单。过去，我一直使用 `read OPTION` 来获取用户输入，但这需要用户按下回车键。\n\n是否有方法可以获取单个按键输入并立即执行，而不需要按下回车键？\n\
  \n答：尝试这部分代码：\n\n```bash\n#----------------------------------\n# 读取一个字符的子程序\n#----------------------------------\n\
  function getchar {\n  typeset OLDSTTY=$(stty -g 2>/dev/null)\n  stty -icanon -echo\
  \ min 1 time 0 2>/dev/null\n  typeset CAR=$(dd bs=1 count=1 <&0 2>/dev/null)\n \
  \ stty $OLDSTTY 2>/dev/null\n  print $CAR\n}\n\nprint \"回答 Y N 或 Q 退出： \\c\"\nC1=$(getchar)\n\
  print \"你输入了： $C1\"\n# 处理所给出的答案\n```\n\n### 问题 87: 寻找最后一行\n\n使用 Linux 和 Bash，我有一个脚本可以输出带有完整路径的文件，如下：\n\
  \n`/foo/bar/filename.pdf`\n`/foo/bar/filename with space.pdf`\n`/foo/filename.txt`\n\
  \n我希望得到如下输出：\n\n`filename.pdf`\n`filename with space.pdf`\n`filename.txt`\n\n我只需要文件名。棘手之处在于，我无法预测文件名所在的深度有多少，因此无法使用标准的\
  \ Bash 来解决。\n\n实现此点的最佳方法是什么？\n\n答：在脚本中添加此行：\n\n```bash\nFILENAME=${file##*/}\n```\n\
  \n其中 `file` 将包含这些值。\n\n```bash\n/foo/bar/filename.pdf /foo/bar/filename with space.pdf\
  \ /foo/filename.txt -- - one at a time.\n```\n\n而 `FILENAME` 将包含 `filename.pdf`\
  \ `filename with space…` 等。\n\n引用：`${parameter##word}`\n\n该单词被展开以产生一个模式，就像在路径扩展中一样。如果模式匹配参数值的开头，则扩展的结果是该参数的值在删除了最短匹配模式（``#''`\
  \ 情况）或最长匹配模式（``##''` 情况）后的扩展值。如果参数是 `@` 或 `*`，则模式移除操作将依次应用于每个位置参数，扩展的结果为生成的列表。如果参数是带有\
  \ `@` 或 `*` 索引的数组变量，则模式移除操作将应用于该数组。\n\n### 问题 88: 捕获所有退出码\n\n我有一个脚本，在输出带有完整路径的文件时，我需要在每一处都搜索到文件末尾。我需要捕获所有的退出码。\n\
  \n我如何在 KSH 中这样做？\n\n答：引入一个函数来处理：\n\n```bash\nEXIT_CODE=\"\"\nfunction assembleCode\
  \ {\n  EXIT_CODE=\"${EXIT_CODE}$@\"\n}\n```\n\n在需要退出码的地方调用该函数：\n\n`assembleCode\
  \ $?`\n\n在代码结束时：\n\n```bash\nif [[ x\"$EXIT_CODE\" != x then\n```\n\n### 问题 89:\
  \ 将文本转换为 XML\n\n文件具有字段分隔符，我需要将其转换为某种结构以便我可以生成 XML。以下是使用脚本的示例：\n\n答：尝试如下：\n\n```bash\n\
  #!/bin/ksh\ncat - <<! >data.txt\nawk ' BEGIN {print \"<?xml=\"\"1.0\"\"?>\";print\
  \ \"<ROWSET>\"}\n{print \"<ROW>\"\nprint \"<NAME>\" substr($0,20) \"</NAME>\"\n\
  print \"<TRN_DATE>\" substr($0,21,10) \"</TRN_DATE>\"\nprint \"<TEXT>\" substr($0,31,10)\
  \ \"</TEXT>\"\nprint \"<ID>\" substr($0,41,7) \"</ID>\"\nprint \"</ROW>\";}\nEND\
  \ { print \"</ROWSET>\";}' data.txt >data.xml\n```\n\n为了从每个字符串中提取前导和尾部空格并输出，这样做：\n\
  \n```bash\nfunction trim(str) {\n  sub(\"^[*\", \"\", str);\n  sub(\"[ ]$\", \"\"\
  , str);\n  return str;\n}\n```\n\n### 问题 90: 备份日志文件\n\n我的日志文件已经变得太大，需要备份并压缩。使用 `mv`\
  \ 重命名文件会破坏任何对文件的链接，并可能干扰使用日志的服务器。如果预计服务器运行 24/7，重命名不是选项。\n\n我该如何这样做？\n\n答：这是一个可能的解决方案：\n\
  \n```bash\nsuffix=`date +%Y%m%d%H%M%S`.bak\nnewFileName=${YourLogName.log}.${suffix}\n\
  cp -p YourLogName.log $newFileName\ncp /dev/null YourLogName.log\ncompress $newFileName\n\
  ```\n\n日志副本被制作并压缩，日志文件被初始化（清空）并准备好接收更多消息。处理可以不中断地继续。假设存在丢失少量消息的可能性，所以在低频率使用期间通过\
  \ crontab 条目执行此。\n\n### 问题 91: 防止同时执行同一脚本\n\n我如何防止同时执行同一个脚本？\n\n答：尝试此过程：\n\n```bash\n\
  My_pid=$$\nprint $My_pid >> temp.file\nread input_pid < temp.file\nif [[ \"$input_pid\"\
  \ == \"$My_pid\" ]] then\n  (允许脚本继续)\nelse\n  (退出脚本，My_pid 不是第一个)\nfi\n```\n\n\n\
  \n\n这保证了提交的第一个脚本实例将运行，而同一脚本的其他任何出现情况都将退出。在脚本结束之前删除 `temp.file`，我建议使用 `Trap`。这比尝试处理\
  \ `ps`/`grep` 要好，而且它可以写成一个很小的函数。\n\n如果某个时间只能运行一个脚本实例，可以使用锁目录来确保互斥：\n\n```bash\n\
  lockname=/tmp/myscript.lock\n\nif mkdir \"$lockname\"\nthen\necho >&2 \"获取锁；继续\"\
  \n# 脚本终止时删除锁目录\ntrap 'rmdir \"$lockname\"' 0\ntrap \"exit 2\" 1 2 3 15\nelse\necho\
  \ >&2 \"锁已占用\"\necho >&\" \"另一个脚本实例正在运行?\"\nexit 1\nfi\n```\n\n这可以扩展为将当前进程 ID 写入锁目录中的文件。这样一来，另一个实例就可以检查获取锁的进程是否仍在运行。\n\
  \n## 问题 92：显示脚本命令及其输出\n\n我们的脚本中有数百行代码，我们希望和输出一起看到，但不想手动在每一行都添加显示语句。\n\n如何为特定的输出结果显示脚本命令？是否有编辑器允许对脚本进行\
  \ `echo` 或 `sysout` 从而产生输出结果？\n\n答：你可以尝试使用 `set -x`。\n\n`man set`\n\n```\nSYNOPSIS\n\
  sh\nset [ --aefhkntuvx [ argument ] ] ...\nunset [ name ... ]\nexport [ name ...\
  \ ]\n\ncsh\nset [ var [ = value ] ]\nset var [ n ] = word\nunset pattern\nsetenv\
  \ [ VAR [ word ] ]\nunsetenv variable\n\nksh\nset [ +aefhkmnopstuvx ] [ +o option\
  \ ] ... [ +A name ] [ arg ... ]\nunset [ -f ] name ...\nexport [ name [ =value ]\
  \ ] ...\n```\n\n## 问题 93：构建带有日历的文本文件\n\n是否有方法使用 korn shell 构建一个包含 2 年日期的文本文件，日期格式为\
  \ `YYYYMMDD`？\n\n例如，生成一个内容如下的文件：\n20010101\n20010102\n20010131\n20010201\n20010228\n\
  20010301\n依此类推。\n\n答：使用以下代码：\n\n```bash\n#! /usr/bin/ksh\n# ja fe ma ap ma ju ju\
  \ ag se oc no de de de\nset -A lasts 0 31 28 31 30 31 30 31 31 30 31 30 31\ntypeset\
  \ -Z2 dmonth dday\n# # 循环年份\nyear=2001\nwhile ((year<2003)) ; do\n# # 是闰年吗？\nleap=0\n\
  if ((!(year%100))); then\n((!(year%400))) && leap=1\nelse\n((!(year%4))) && leap=1\n\
  fi\n#\n# 设置二月份的天数\nlasts[2]=28\n((leap)) && lasts[2]=29\n#\n# 循环月份 month=1\nwhile\
  \ ((month<13));\ndo # # 循环日期 day=1\nwhile((day<(lasts[month])+1)) ;\ndo dday=$day\
  \ dmonth=$month\necho ${year}${dmonth}${dday} ((day=day+1))\ndone ((month=month+1))\n\
  done\n((year=year+1))\ndone\nexit 0\n```\n\n## 问题 94：循环中的 grep\n\n我正在尝试写一个接收用户输入\
  \ `userid` 的脚本。我被困了如何在审计日志文件中检查该是否为有效用户 ID 上。\n\n以下是我的代码：\n\n```bash\ncd $CCP_AUDIT\n\
