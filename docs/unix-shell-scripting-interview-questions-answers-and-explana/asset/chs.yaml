  \ ag se oc no de de de\nset -A lasts 0 31 28 31 30 31 30 31 31 30 31 30 31\ntypeset\
  \ -Z2 dmonth dday\n# # 循环年份\nyear=2001\nwhile ((year<2003)) ; do\n# # 是闰年吗？\nleap=0\n\
  if ((!(year%100))); then\n((!(year%400))) && leap=1\nelse\n((!(year%4))) && leap=1\n\
  fi\n#\n# 设置二月份的天数\nlasts[2]=28\n((leap)) && lasts[2]=29\n#\n# 循环月份 month=1\nwhile\
  \ ((month<13));\ndo # # 循环日期 day=1\nwhile((day<(lasts[month])+1)) ;\ndo dday=$day\
  \ dmonth=$month\necho ${year}${dmonth}${dday} ((day=day+1))\ndone ((month=month+1))\n\
  done\n((year=year+1))\ndone\nexit 0\n```\n\n## 问题 94：循环中的 grep\n\n我正在尝试写一个接收用户输入\
  \ `userid` 的脚本。我被困了如何在审计日志文件中检查该是否为有效用户 ID 上。\n\n以下是我的代码：\n\n```bash\ncd $CCP_AUDIT\n\
  cat * > /export/home/$USR/l***/files\necho \"UserId:\\c\"\nread UserId\n#日期函数\n\
  echo \"DATE [YYYY-MM-DD] : \\c\"\nread xxx\n```\n\n我需要帮助将此放入循环中：\n\n```bash\ngrep\
  \ $xxx /export/home/$USR/lalitha/files |grep -v Created |grep -v Rejected | grep\
  \ -i $UserId | Mail -s \"Transactions for $UserId\" ***@***.com\n```\n\n如果某个用户没有日志记录，我如何跳出循环？\n\
  \n答：我理解这意味着输出结果为零行。\n\n这时使用临时文件是有意义的。你需要为了两个不同的用途使用相同的中间数据：\n\n代码：\n```bash\ngrep\
  \ ... > tempfile\nif [ -s tempfile ]; then\nMail ... < tempfile\nelse\necho No such\
  \ userid $UserId >&2\nbreak\nfi\nrm tempfile\n```\n\n## 问题 95：在菜单中生成选项列表\n\n我正在创建一个文本文件（`systems.txt`），其中按主机名列出服务器列表。然后我想输出一个菜单，每个主机名带有一个用于从列表中选择它的数字。这种将数字与主机名关联的方式让我很困惑。\n\
  \n以下是我的代码：\n\n```bash\n#!/bin/bash\nclear\nCOUNT=0\nSYSTEMS=`cat systems.txt`\n\
  while [ \"$CHOICE\" != \"q\"\ndo\nfor SYSTEM in $SYSTEMS\n```\n（注：原文文本在 `SYSTEMS`\
  \ 之后截断了，故翻译至此。）\n\n\n\n为了回答你的问题，你需要遍历文件并为每种类型的 `03` 记录创建列表。然后，你需要检查这些列表。如果一个列表少于\
  \ 100 个项，列表中的所有项都将被标记为 ok。如果列表超过 100 个项，则只有部分会被标记为 ok。\n\n既然你已经数出了元素的数量，可以计算该数字的\
  \ 2%。现在你知道需要标记多少个 ok 了。\n\n要标记一个项为 ok，在 1 到 `n` 之间生成一个随机整数，其中 `n` 是列表中非 ok 元素的数量。现在从元素\
  \ 1 扫描到列表末尾并找到所选的元素。将其标记为 ok。从列表的非 ok 元素数量中减去 1。再次在 1 到当前非 ok 元素数量之间生成一个新的随机整数。找到那一个。重复此过程，直到你标记了所需数量的\
  \ ok 为止。\n\n对每个列表完成此操作后，返回主文件。对于每条 `03` 记录，检查它在列表中是否被标记为 ok。如果是，则将其及其子记录写入最终输出文件。\n\
  \n## 问题 99：Shell 脚本中的 awk\n\n我有一个包含在 `ksh` 脚本中的 `awk` 脚本，用它读取一个文件的内容，假设有 3 条记录。字段为\
  \ `a`、`b` 和 `c`，分隔符为 `|`。\n\n我想读取文件，然后为 `$1`、`$2`、`$3` 设置不同的变量，作为在 `awk` 脚本范围之外但在同一个\
  \ `ksh` 脚本运行一系列报告的参数。\n\n以下是我目前的部分代码：\n\n```bash\n# 为每个记录顺序执行每个报告（总共 3 个）:\n\nawk\
  \ '\nBEGIN{FS=\"|\";FILENAME=\"$loc/myfile\"}\nsplit(FILENAME,results,FS)\na=results[1]\n\
  b=results[2]\nc=results[3]\netc…\n```\n\n我如何在内部/外部执行命令的剩余部分？\n\n答：我无法理解你的代码，但我认为你有一个文件，每行三个数据字段，且字段通过\
  \ `|` 分隔，如下：\n\n```\n1|2|3\n4|5|6\n```\n\n我想你想通过循环在第一次循环时设置 `a=1`、`b=2`、`c=3`，在第二次循环时设置\
  \ `a=4`、`b=5`、`c=6`。这很容易。\n\n代码：\n\n```bash\n/usr/bin/ksh\nexec < inputfile\nIFS='|'\n\
  while read a b c ; do\necho a = $a\necho b = $b\necho c = $c\ndone\nexit 0\n```\n\
  \n我没有看到有简单的方法将 `awk` 注入此类结构中。\n\n## 问题 100：while 循环\n\n在一个文本文件 (`PL_SENDEVENT`)\
  \ 中，我有这样的一行：\n\n`CHANGE_STATUS INACTIVE`\n\n另一个文件 (`PL_JOBS`) 包含以下行：\n\n```\nTEST\n\
  TEST1\n```\n\n我想做的是将 `TEST` 和 `TEST1` 的 `STATUS` 更改为文件中指定的状态，在这种情况下为 `INACTIVE`（或\
  \ `IN`）。我不希望脚本在两个作业都已验证为 `INACTIVE`（`IN`）状态之前退出。目前为止进展不太顺利。目前，它一旦将 `TEST` 设置为 `INACTIVE`\
  \ 就会成功退出，甚至不检查 `TEST1`。如果作业不在 `INACTIVE` 状态，我希望它再次检查，直到它们都处于该状态为止。\n\n这是是我现在的代码：\n\
  \n代码：\n\n```bash\ncat $PL_DIR/PL_SENDEVENT | while read event status\ndo\ncase $event\
  \ in\nCHANGE_STATUS)\ncat $PL_DIR/PL_JOBNAME | while read job\ndo\nsendevent -E\
  \ CHANGE_STATUS -s ${status} -J ${job}\ndone\ncase $status in\nINACTIVE) export\
  \ ST=IN ;;\nON_HOLD) export ST=OH ;;\nON_ICE) export ST=OI ;;\nTERMINATED) export\
  \ ST=TE ;;\n*) echo \"Invalid Status!\"; exit 1 ;;\nesac\nrc3=1\nwhile (($rc3 >\
  \ 0))\ndo\nsleep 5\ncat $PL_DIR/PL_JOBNAME | while read job\ndo\n$AUTOSYS/bin/autorep\
  \ -J ${job} -l0 | sed '1,4d' |\nif [ `awk '{print $6}'` == ${ST} ]; then\necho \"\
  Status is set for ${job}!\"\nrc3=0\nfi\ndone\ndone ;;\n```\n\n我哪里做错了？\n\n答：尝试将最后部分替换为以下内容：\n\
  \n代码：\n\n```bash\nrc3=1\nwhile (($rc3 > 0))\ndo\nsleep 5\nrc7=0\ncat $PL_DIR/PL_JOBNAME\
  \ | while read job\ndo\n$AUTOSYS/bin/autorep -J ${job} -l0 | sed '1,4d' | \\\nif\
  \ [ `awk '{print $6}'` == ${ST} ]; then\necho \"Status is set for ${job}!\"\n((\
  \ rc7 += 1 ))\nfi\ndone\n[ $rc7 == `wc -l $PL_DIR/PL_JOBNAME` ] && rc3=0\ndone\n\
  ```\n\n## 致谢\n\n上述内容均摘自以下网站：\n\n- http://en.wikipedia.org/wiki/Unix_shell\n- http://heather.cs.ucdavis.edu/~matloff/UnixAndC/Unix/CShellII.html\n\
