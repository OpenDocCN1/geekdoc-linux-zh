  \n**数据文件 (Data file)**：它包含各种输入和输出文件的列表，每种 50 个。我们假设它看起来像这样：\n\nin01.txt\nout01.txt\n\
  in02.txt\nout02.txt\nin50.txt\nout50.txt\n\n最后是部分，这也是我最头疼的部分。这是我希望让这一切运行起来的实际 shell。shell\
  \ 内部的代码如下：\n\n```bash\n#!/bin/sh\n\nprogram < Data-file < Date-file\n\nprogram <\
