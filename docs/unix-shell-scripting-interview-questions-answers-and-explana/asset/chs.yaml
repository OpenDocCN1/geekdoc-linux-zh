  \ `/subst <replacethis> <withthis> <filename>`，并且只有在发生更改时才会更新文件，以保留创建/最后修改的时间。目前它运行得\
  \ 100% 正确，但下一步是编辑脚本，使用户户尽可能多地执行 `/subst <replacethis> <withthis> <filename> <filename2>\
  \ <filename3> <filenamex>`。\n\n这可以实现吗？\n\n我目前的脚本：\n\n```bash\n#!/bin/bash\nreplacethis=$1\n\
  withthis=$2\nfile=$3\nsed -e \"s+$replacethis+$withthis+g\" $file > $file.bak\n\
  cmp $file $file.bak > /dev/null\nif [ $? -eq 0 ]\nthen\n    echo \"Files are the\
  \ same, nothing was replaced.\"\nelse\n    mv $file.bak $file\nfi\n```\n\n答：可以做到！这段代码应该完美工作：\n\
  \n```bash\n#!/bin/bash\nreplacethis=$1\nwiththis=$2\nshift 2\nfor file in $@\ndo\n\
  \    sed -e \"s+$replacethis+$withthis+g\" $file > $file.bak\n    cmp $file $file.bak\
  \ > /dev/null\n    if [ $? -eq 0 ]\n    then\n        echo \"Files are the same,\
  \ nothing was replaced.\"\n        rm $file.bak\n    else\n        mv $file.bak\
  \ $file\n    fi\ndone\n```\n\n## 问题 81：字符串替换脚本\n\n我现在有一个脚本，用于搜索文件并将某些字符串替换为新字符串。执行格式为\
