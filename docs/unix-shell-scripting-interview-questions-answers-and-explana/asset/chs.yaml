  \ '$1=$1' myFile.txt OR nawk -v OFS=, -v RS='' '{for(i=1;i<=NF;i++) gsub(*/,\"\\\
  \"\\\"\", $i); print}' myFile.txt\n```\n\n## 问题 55: 文件比较\n\n是否可以逐位比较两个文件并输出以下内容？\n\
  \n1. 每一行中不匹配的位位置。\n2. 两个文件中缺失的记录。\n\n请注意，两个文件的第三列都是唯一的。\n\n文件 1：\n\nABC 1212 san\n\
