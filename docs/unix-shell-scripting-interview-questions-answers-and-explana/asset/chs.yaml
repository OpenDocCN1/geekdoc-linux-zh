  \nwhile read f\ndo\n\ninfile=$f\n\noutfile=`echo $f | sed s/\"in\"/\"out\"/1`\n\n\
  program < $infile > $outfile\n\ndone < Datafile\n```\n\n这要短且简单得多！\n\n## 问题 40：文件中时间戳的首次出现\n\
