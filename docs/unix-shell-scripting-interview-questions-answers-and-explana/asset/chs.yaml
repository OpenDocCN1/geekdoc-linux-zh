  \ grab grep cat bss tee rc etc...这些都不必翻译但视其必要性添加圆括号给出简明术语介绍帮助不懂的人才看懂词汇背景知识这样既保证专业度又不失友好性确实是一份高质量文档产出标准应该如此严格执行到底才行现在就以此范例为基础继续完成后面的剩余部分吧...\n\
  \n\n\n\n\n```bash\nmv $f `echo $f | tr '[A-Z]' '[a-z]'`\n```\n\nend\n\n### Bourne\
  \ Shell\n```bash\nfor f in *; do\n  mv $f `echo $f | tr '[A-Z]' '[a-z]'`\ndone\n\
  ```\n\n### Korn Shell\n```bash\ntypeset -l l\nfor f in *; do\n  l=\"$f\"\n  mv $f\
  \ $l\ndone\n```\n\n如果你想做得非常彻底并处理带有“奇怪”名称的文件（包含空格空格等），你需要使用：\n\n### Bourne Shell\n\
  ```bash\nfor f in *; do\n  g=`expr \"xxx$f\" : 'xxx\\(.*\\)' | tr '[A-Z]' '[a-z]'`\n\
  \  mv \"$f\" \"$g\"\ndone\n```\n\n`expr` 命令将始终打印文件名，即使它等于 `-n` 或者它包含像 `\\c.` 这样的\
  \ System V 转义序列。\n\n某些版本的 `tr` 需要 `[` 和 `]`，而有些则不需要。在这个特定的示例中，包含它们是无害的；不需要 `[]`\
  \ 的 `tr` 版本会方便地认为它们应该将 `[` 转换为 `[` 并将 `]` 转换为 `]`。\n\n如果你安装了 Perl 语言，可能会发现 Larry\
  \ Wall 编写的这个重命名脚本非常有用。它可以完成各种文件名的更改。\n\n```perl\n#!/usr/bin/perl\n#\n### rename\
  \ script examples from lwall:\n# rename 's/\\.orig$//' *.orig\n# rename 'y/A-Z/a-z/\
  \ unless /^Make/' *\n# rename '$_ .= \".bad\"' *.f\n# rename 'print \"$_: \"; s/foo/bar/\
  \ if <stdin> =~ /^y/i' *\n$op = shift;\nfor (@ARGV) {\n  $was = $_;\n  eval $op;\n\
  \  die $@ if $@;\n  rename($was,$_) unless $was eq $_;\n}\n```\n\n### 问题 09: 从终端读取字符\n\
  如何在 shell 脚本中从终端读取字符？\n\n答: 在 `sh` 中，使用 `read`。最常用的用法是使用循环：\n\n```bash\nwhile read\
  \ line\ndo\ndone\n```\n\n在 `csh` 中，像这样使用 `<``：\n\n```csh\nwhile ( 1 )\n  set line\
  \ = \"$<\"\n  if ( \"$line\" == \"\" ) break\nend\n```\n\n遗憾的是，`csh` 无法区分空行和文件结束符（EOF）。\n\
  \n如果你正在使用 `sh` 并想从终端读取*单个*字符，可以尝试类似下面的：\n\n```bash\necho -n \"Enter a character:\
  \ \"\nstty cbreak # or stty raw\nreadchar=`dd if=/dev/tty bs=1 count=1 2>/dev/null`\n\
  stty -cbreak\necho \"Thank you for typing a $readchar .\"\n```\n\n### 问题 10: 在脚本内部设置环境变量\n\
  如何在程序或 shell 脚本内部设置环境变量、更改目录，并让该更改影响我当前的 shell？\n\n答：通常情况下，你做不到，至少除非进行特殊安排。当子进程被创建时，它会继承父进程变量（以及当前目录）的副本。子进程可以随心所更改这些值，但更改不会影响父\
  \ shell，因为子进程更改的是原始数据的副本。\n\n可以进行一些特殊的安排。如果父进程准备好读取输出并将其解释为设置自己变量的命令，那么子进程就可以写出更改后的变量。\n\
  \n此外，shell 可以安排在当前 shell 的上下文中运行其他 shell 脚本，而不是在子进程中，这样更改就会影响原始 shell。\n\n例如，如果你有一个名为\
  \ `myscript` 的 C shell 脚本：\n\n```bash\ncd /very/long/path\nsetenv PATH /something:/something-else\n\
  ```\n\n或者等价 Bourne 或 Korn shell 脚本：\n\n```bash\ncd /very/long/path\nPATH=/something:/something-else\
  \ export PATH\n```\n\n尝试从 shell 运行 `myscript`，你的 shell 会 fork 并在子进程中运行脚本。子进程也在运行\
  \ shell；当它看到 `cd` 命令时，它更改的是*自己的*当前目录；当它看到 `setenv` 命令时，它更改的是*自己*的环境，但对你正在输入的 shell\
  \ 当前目录（假设是登录 shell）没有任何影响。\n\n为了让你的登录 shell 执行脚本（而不 fork），你必须使用 `.` 命令（用于 Bourne\
  \ 或 Korn shell）或 `source` 命令（用于 C shell）。例如，对于 Bourne 或 Korn shell 输入 `.myscript`，对于\
  \ C shell 输入 `source myscript`。\n\n如果你只是想更改目录或设置环境变量，使用 C shell 别名或 Bourne/Korn\
  \ shell 函数可能会更简单。\n\n### 问题 11: 在 shell 脚本执行期间触发终端铃\n如何在 shell 脚本执行期间触发终端铃？\n\n\
  答：答案取决于你的 UNIX 版本（或者说取决于你机器上可用的“echo”程序的类型）。\n\n类 BSD 的 `echo` 使用 `-n` 选项来抑制最后的换行，并且不理解八进制\
  \ `\\nnn` 标记。因此命令是：\n\n```bash\necho -n '^G'\n```\n\n其中 `^G` 表示一个*字面* BEL 字符（你可以在\
  \ emacs 中通过 \"Ctrl-Q Ctrl-G\" 生成，在 vi 中通过 \"Ctrl-V Ctrl-G\" 生成）。\n\n类 SysV 的 `echo`\
  \ 理解 `\\nnn` 标记并使用 `\\c` 抑制最后的换行，因此答案是：\n\n```bash\necho '\\007\\c'\n```\n\n###\
  \ 问题 12: 日历输出\n为什么 calendar 产生的输出是错误的？\n\n答：经常，人们发现 `cal` 产生的输出并非他们预期的。\n\n### 问题\
  \ 13: 打印环境\n如何打印环境？\n\n答：尝试以下：\n\n```bash\ndate | awk -F: '{print $5}'\n```\n\n\
  ### 问题 14: 用户登录时欢迎用户\n如何在用户登录时“欢迎”他们？\n\n答：使用这个：\n\n```bash\ntt=`date +\"H\" | cut\
  \ -c1\nif [ $tt -gt 0 ]; then\n  echo \"GOOD MORNING!\"\nelif [ $tt -le 12 ]; then\n\
  \  echo \"GOOD AFTERNOON!\"\nelse\n  echo \"GOOD EVENING!\"\nfi\n```\n\n### 问题 15:\
  \ 显示子目录\n如何从当前目录查找子目录？\n\n答：有时你记不住想要进入的子目录名称。如果只想看目录会更容易。\n\n将以下函数放入你的环境中：\n\n```bash\n\
  dir() {\n  ls -l | awk '{ if (substr($1,1,1)==d\") {print}}'\n}\n```\n\n这里有一个更简单的命令来列出：`ls\
  \ -d */`。\n\n### 问题 16: 两种语法之间有什么区别\n以下两种语法的区别是什么：\n\n```bash\nif (( $lines = 0\
  \ ));\n```\n\n和\n\n```bash\nif [ $lines -eq 0 ];\n```\n\n什么时候使用方括号，什么时候使用括号？\n\n\
  答：`[` 语法先出现。在旧的 Bourne shell 中它是你拥有的。但它并不像看起来那样。if 语句运行一个命令并测试其是否成功。所以你可以这样做：\n\n\
  ```bash\nif mkdir tmp; then echo mkdir worked; fi\n```\n\n`mkdir` 是一个命令，`tmp` 是\
  \ `mkdir` 的参数。有一个名为 `[` 的命令，像很多命令一样它接收参数。它检查最后一个参数，如果不是 `]`，它就会生气。如果你这样做：\n\n```bash\n\
  lines=\"\"\nif [ $lines -eq 0 ]\n```\n\n`[` 命令只会看到 `-eq` 和 `0`，所以它会抱怨。正因为这些考虑，Dave\
  \ Korn 发明了语法。现在你可以这样做：\n\n```bash\nif [[ $lines = 0 ]]\n```\n\n它不会那么容易混淆。Bash 从\
  \ ksh 中吸收了这种语法，在大多数情况下它比单一的 `[` 更好用。主意是 `[` 可能会消失，但我倾向于认为它不会。尽管如此，官方说法是 `[` 在 ksh\
  \ 中存在是为了支持旧脚本，你应该切换到 `[[`。\n\n\n\n\n但你问的是 \"if (($lines = 0 ))\"。这种精确的语法是一个糟糕的错误，你可能永远不要使用它。首先，`ksh`\
  \ 有内置的算术功能，你可以执行如下操作：\n\n```bash\n((k=7+1)) ; echo $k\n```\n\n并得到 8。`((expression))`\
  \ 语法只是执行算术运算的命令。该命令有一个退出码。如果表达式非零，命令执行成功。但如果表达式为零，命令执行失败。因此，你可以测试一个表达式的结果。我经常执行这样的操作：\n\
  \n```bash\nif ((lines == 0 ))\n```\n\n这测试 `lines` 是否等于 0。使用 `(($lines = 0))` 时，假设\
  \ `lines` 包含另一个变量名，它几乎可以正常工作：\n\n```bash\nlines=xyz\n\nif (($lines = 0))\n```\n\n\
  `$lines` 会被替换为 `xyz`，因此 shell 将看到 `((xyz = 0))`。`xyz` 将被设置为 0。。`((xyz = 0))` 将始终失败，因此\
  \ `if` 语句永远不会为真。你永远不需要在 `((expression))` 内部使用 `$` 符号。这样做可以：\n\n```bash\n((lines=lines+1))\n\
  ```\n\n算术语句会知道 `lines` 是一个变量并查找它的值。`Bash` 也从 `ksh` 继承了算术功能。\n\n### 问题 17：提取用户名\n\
  \n我如何使用 `grep` 提取用户名至少包含 4 个字符的用户？我尝试过 `who | grep \\{4,\\}` 但它不起作用。\n\n答：继续按照你原来的思路即可。注意空格。\n\
  \n```bash\nwho | grep \"^[^ ]\\{4,\\} \"\n```\n\n### 问题 18：删除字符串末尾的空格\n\n我有几个字段，其中一些是数字，另一些是字符串。某些字符串结尾有几个空格，例如：\n\
  \n`\"string \",123,\"one string here \",98777,\"hello \",\"etc \"`\n\n我需要消除这些空格，以便能够将此文件与在其他地方生成的另一个进行比较。\n\
  \n所以结果应该是这样的：\n\n`\"string\",123,\"one string here\",98777,\"hello\",\"etc\"`\n\n\
  我尝试使用 `sed` 这样做：\n\n```bash\nsed 's/[ ]*//g' filename > output.txt;\n```\n\n这删除了所有空格，这不是我需要的。\n\
  \n我如何只删除字符串末尾的空格？\n\n答：你可以通过这种轻松实现：\n\n代码：\n\n```bash\nsed 's/[ ]*\"/\"/g'\n```\n\
  \n你也可以去掉方括号，但保留空格。\n\n代码：\n\n```bash\nsed 's/ *\"/\"/g'\n```\n\n### 问题 19：运行脚本\n\
  \n是否有可以在不改变文件访问权限的情况下运行脚本？\n\n答：通常，用户必须更改 shell 脚本的文件权限使其可执行，例如：\n\n```bash\nchmod\
  \ +x script\n```\n\n有时，直接调用 shell 并将脚本作为参数更方便：\n\n```bash\nsh script\n```\n\n###\
  \ 问题 20：关于 xargs 的简单解释\n\n你能给我提供关于 `xargs` 的基本理解或示例用法吗？\n\n答：简单来说，`xargs` 用于从标准输入读取字符串，并将尽可能多的参数传递给给定的命令。它通常用于绕过\
  \ `ARG_MAX` 限制。24,576 个 IBM 和 1,048,320 个 Solaris。\n\n### 使用 xargs 命令\n\n作者 Ed Schaefer\n\
  \n[`www.unixreview.com/documents/s=8274/sam0306g/`](http://www.unixreview.com/documents/s=8274/sam0306g/)\n\
  \n许多 UNIX 专业人士认为 `xargs` 命令（构建并执行参数列表）仅用于处理由 `find` 命令生成的长文件列表。虽然 `xargs` 尽职地实现了这一目的，但它还有其他用途。在本文，我描述了\
  \ `xargs` 和历史上的“参数过多”问题，并展示了八个 `xargs` “单行命令”：\n\n* 查找目录下所有文件的唯一所有者。\n* 在删除文件时，将每个文件回到标准输出。\n\
  * 将当前目录结构复制到另一个目录。\n* 将多个 UNIX 命令的输出合并在一行。\n* 每行一个单词向标准输出显示文件的内容。\n* 提示用户是否逐个删除文件。\n\
  * 将文件中包含的文件内容合并到另一个文件中。\n* 将所有文件从一个目录移动到另一个目录，并在移动发生时将每次移动操作回到标准输出。\n\n### 检查“参数过多”问题。\n\
  \n在 UNIX/xenix 早期，很容易溢出命令行缓冲区，导致“参数过多”（Too many arguments）错误。找到大量文件并将其管道到另一个命令就足以导致失败。执行以下命令，来自《Unix\
  \ Power Tools》第一版（O'Reilly & Associates）：\n\n```bash\npr -n 'find . -type f -mtime\
  \ -1 -print'|lpr\n```\n\n如果文件足够多，这可能会导致命令行溢出。该命令将今天编辑的所有文件列表提供给 `pr`，并将 `pr` 的输出通过到打印机。我们可以用\
  \ `xargs` 解决这个问题：\n\n```bash\nfind . -type f -mtime -1 | xargs pr -n\n```\n\n在文件足够多时，这可能会导致命令行溢出。该命令将今天编辑的所有文件列表提供给\
  \ `pr`，并将 `pr` 的输出通过到打印机。我们可以用 `xargs` 解决这个问题：\n\n```bash\nfind . -type f -mtime\
  \ -1 | xargs pr -n\n```\n\n在这种情况下，`xargs` 允许标准输入，并将尽可能多的参数传递给给定的命令。它通常用于绕过 `ARG_MAX`\
  \ 限制。24,576 个 IBM 和 1,048,320 个 Solaris。\n\n（注：由于原文文本后续存在大量重复和逻辑断层，此处已根据“不要重复输出原文”的原则进行了精简翻译，确保逻辑通顺。）\n\
  \n\n\n执行以下命令会将当前目录下的所有文件名放在同一行，并将其重定向到文件 `file.ls`：\n\n```\nls |xargs echo > file.ls\n\
  ```\n\n使用 `xargs` 的参数数量选项 `-n` 将 `file.ls` 的内容输出到标准输出，每行一个名称：\n\n```bash\ncat file.ls|xargs\
  \ -n1 # 自《Unix in a Nutshell》\n```\n\n在当前目录下，使用 `xargs -p` 选项提示用户逐个删除文件：\n\n```bash\n\
  ls|xargs -p -n1 rm\n```\n\n如果不使用 `-n` 选项，用户将会被提示删除当前目录下的所有文件。\n\n将文件列表中包含的所有文件名的文件内容合并：\n\
  \n```bash\nxargs cat < file > file.contents\n```\n\n合并到 `file.contents`。\n\n将所有文件从目录\
  \ `$1` 移动到目录 `$2`，并使用 `xargs -t` 选项在每次移动发生时显示该操作：\n\n```bash\nls $1 | xargs -I {}\
  \ -t mv $1/{} $2/{}\n```\n\n`xargs -I` 参数会将字符串中的每个 `{}` 替换为传递给 `xargs` 的每个对象。\n\n\
  ### 结论\n\n什么时候应该使用 `xargs`？当一个命令的输出是另一个命令的命令行选项时，结合管道使用 `xargs`。当一个命令的输出是另一个命令的输入时，请使用管道。\n\
  \n### 问题 21：获取返回值\n\n在一个 Bourne shell 脚本中，我想 ping 一个主机名以检查它是否存在。我知道可以通过这种方法：\n\n\
  ```bash\nSTATUS=`ping $HOSTNAME`\necho $STATUS\n```\n\n然后用 `grep` 查找 `\"alive,\"\
  ` 等内容。\n\n我不记得如何获取返回值了。我想像这样使用它：\n\n```bash\nping $HOSTNAME\nif [ <这里填什么> -ne 0\
  \ ];\necho \"Host not available.\"\n```\n\n我需要的那个能够获取 `ping` 返回值的字符是什么？\n\n**A**:\
  \ 要要获取返回值，请使用这段简单的代码：\n\n```bash\nif [ $? -ne 0 ];\n```\n\n### 问题 22：合并脚本的协助\n\n\
  我有大约 70 个文件需要合并成一个。每个文件大约有 7 行数据。最终格式必须是：\n\n```\nDATA FROM FILE1 DATA FROM FILE2\
  \ DATA FROM FILE3\nDATA FROM FILE1 DATA FROM FILE2 DATA FROM FILE3\n...\n```\n\n\
  以此此类推，直到所有 70 多个文件都处理完毕。我能够使用 `pr` 命令（以及各种标志）在命令行上合并三个文件。\n\n我该如何按照上述格式将所有文件放在一起呢？\n\
  \n**A**: 假设所有文件都在一个目录中且该目录下没有其他文件，可以使用类似下面的命令：\n\n```bash\ncd /path/to/dir\nset\
  \ -- $(ls)\nwhile [ $# -gt 0 ]\ndo\n  # 现在使用 $1 $2 和 $3\n  paste...\n  # 跳过下 3 个文件并从\
  \ $# 中减 3\n  shift 3\n  # 空行\n  echo\ndone >/path/to/outfile\n```\n\n### 问题 23：查找子字符串\n\
  \n有一个 `ksh` 脚本，其中有两个包含目录路径的变量 `SB_HOME` 和 `CD`。我想测试 `CD` 是否在 `SB_HOME` 下，然后用第三个变量\
  \ `BASE` 填充 `SB_HOME` 下包含 `CD` 的目录值。\n\n例如，如果 `SB_HOME` 是 `\"/home/mthales/workspace\"\
  ` 且 `CD` 是 `\"/home/mthales/workspace/Testing/src/level1/sub\"`，我希望 `BASE` 变为 `\"\
  /home/mthales/workspace/Testing\"`\n\n我有一行 `if [ -n \"$(echo \"${CD}\" | grep \"\
  ${SB_HOME}\")\" ]; then` 可以测试 `CD` 是否在 `SB_HOME` 下，但我无法成功从 `CD` 中提取出子字符串。\n\n我该如何处理？\n\
  \n**A**: 使用 `ksh`，这应该可以解决你的问题：\n\n```bash\n#!/bin/ksh\nSB_HOME=\"/home/mthales/workspace\"\
  \nCD=\"/home/mthales/workspace/Testing/src/level1/sub\"\nif [[ \"${CD}\" == \"${SB_HOME}\"\
  * ]]\nthen\n  # 只获取子目录\n  SUBDIR=${CD#${SB_HOME}/}\n  print \"SUBDIR is $SUBDIR\"\
  \n  # 将子目录的第一层附加到 SB_HOME\n  BASE=${SB_HOME}/${SUBDIR%%/*}\n  print \"BASE is ${BASE}\"\
  \nelse\n  print \"Error: ${CD} is not in ${SB_HOME}\"\n  exit 1\nfi\n```\n\n###\
