  ## 问题 48: 分离文件名\n\n我正尝试编写一个脚本，获取文件名列表，对每个文件名进行单独操作并输出更改后的文件名——主要是为了重命名大量文件。\n\n\
  到目前，我有如下代码：\n\n```bash\nTARGET=\"$(ls -1 |)\"\n\nfor FILE in \"$TARGET\"; do\n\n\
  NEW=$(echo \"$FILE\" | 'do some stuff to file')\n\nmv $FILE $NEW\n\ndone\n```\n\n\
  所有的文件名都作为一个长字符串存储在 `$FILE` 和 `$NEW` 中，一旦我更改了它们，就无法对它们进行任何操作。\n\n我该如何让脚本单独识别每个文件名？\n\
  \n**A:** 移除以下代码中的双引号：\n\n代码：\n\n```bash\nfor FILE in $TARGET; do\n```\n\n双引号会使它变成一个参数：\n\
  \n```bash\n#!/usr/bin/ksh\n\necho $1\n\necho $2\n\necho $3\n\n# s1 \"a b c\" d e\n\
  \na b c\n\nd\n\ne\n\n# s1 a b c d e\n\na\n\nb\nc\n```\n\n## 问题 49: 提取字符串\n\n如何从给定的字符串中提取一个字符串？\n\
  \n示例：\n\n1. `/detl01/SHL/TARG/SHL`\n\n我需要从第一个 `/` 开始读取目录路径：\n\n`/detl01/SHL/TARG/SHL`\n\
  \n例如，我需要做什么来消除之前所有的字符？\n\n**A:** 你可以尝试这一行：\n\n代码：\n\n```bash\nname=\"1\\. /detl01/SHL/TARG/SHL\"\
  \ path=`echo $name|cut -d' ' -f 2` echo $path\n```\n\n还有另一种方法：\n\n```bash\nname=\"\
  1\\. /detl01/SHL/TARG/SHL\"\nname1=${name#*}\n\necho $name1\n```\n\n## 问题 50: 拆分字符串\n\
  \n我有若干由字母和数字组成的文件，如下所示：\n\n01-000.134off.log\n\n01-000.14off.log\n\n01-000.4off.log\n\
  \n我想剥离所有内容，只留下非零数字。例如：\n\n134\n\n14\n\n4\n\n我已经顺利地使用 `grep` 和 `sed` 解决了这个问题。我接下来真正想做的是将数字字符串拆分为单数字数字，以便我能够使用这些数字放在程序的其他部分。\n\
  \n这是可以的吗？\n\n**A:** 如果你想让数字在同一行分开，请添加：\n\n代码：\n\n```bash\n-e 's/\\(.\\)/\\1 /g'\n\
  ```\n\n到你的 `sed` 语句中。\n\n如果你想让每个数字单独一行，使用：\n\n代码：\n\n```bash\n-e 's/\\(.\\)/\\1^/g'\n\
  ```\n\n通过按下 `Ctrl-V` 创建 `^M`。\n\n## 问题 51: 搜索及后续 20 行\n\n我想在 UNIX 文件中搜索模式。我可以使用\
  \ `grep` 命令，但我想获取匹配的行及其后续 20 行并重定向到另一个文件。\n\n`grep` 有任何选项可以实现这一点？\n\n**A:** 将以下代码放入名为\
  \ `script.awk` 的文件中：\n\n代码：\n\n```awk\nBEGIN { count = 0 } /pattern/ { count = 0;\
  \ } count <= 20 { print; count++; }\n```\n\n从命令行运行：\n\n```bash\nawk -f script.awk\
  \ file-you-to-search\n```\n\n## 问题 52: 文件中的记录数和名称\n\n我正尝试通过 `wc -l file1` 获取文件的记录数。\n\
  \n我得到了正确的记录数，但还有文件名。我的输出是：\n\n7 file1\n\n我该如何避免输出中出现文件名？\n\n**A:** 你可以 \"cut\" 掉记录数，或者使用\
  \ `awk` 来计数：\n\n代码：\n\n```bash\nawk '{n++} END {print n}' file1\n```\n\n或者，根据你的\
  \ shell，你可以剥离文件名：\n\n代码：\n\n```bash\n#! /usr/bin/ksh x=$(wc -l file1) print ${x}\n\
  ```\n\n# 问题 53: 合并不同文件的列\n\n我有三个第一列为数字的文件。我想合并这些文件，使得第一个文件的数字在第一列，第二个文件的数字在第二列，第三个文件的数字在第三列。\n\
  \n例如：\n\nfile1 file2 file3\n\n12 236 13 234 134 234 14 233 14 367 332 14 399 32（等等，原文文本说是\
