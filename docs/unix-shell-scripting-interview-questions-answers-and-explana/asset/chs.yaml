  \ / }\n```\n\n## 问题 63：无 cron 调度脚本 (Schedule Script Without Cron)\n\n我如何在每天 0800\
  \ 和 1030 运行我的脚本？\n\n答：尝试这个：\n```bash\n#!/bin/ksh\nTIMES=\"0800 1030\"\nwhile true\n\
  do\n  NOW=$(date +%H%M)\n  for TIME in $TIMES; do\n    if [ \"$NOW\" == \"$TIME\"\
  \ ]; then\n      ./script\n    fi\n  done\n  sleep 60\ndone\n```\n\n## 问题 66：读取特定行\
  \ (Read a Specific Line)\n\n我有一个巨大的文件（约 2500 万行）。是否有方法可以直接读取第 `n` 行，而不循环遍历文件的每一行？\n\
  \n答：有几种方法可以实现。尝试以下代码：\n```bash\nsed -n '250p;251q' bigfile\n```\n\n\n\n\n\n```bash\n\
  sed '250q;d' bigfile\nsed -n '250{;p;q;}'\n```\n\n针对 `awk` 的类似优化：\n\n```bash\nawk\
  \ 'NR==250{print;exit}' bigfile\n```\n\n## 问题 67：服务器或环境确定\n\n我想使用服务器名称作为开关，根据实际情况为开发、QA/测试或生产环境填充各种环境变量。\n\
  \n是否存在某种内部 shell 命令或环境变量，可以告诉我正处于哪台服务器上？\n\n答：创建你自己的环境变量（也许可以叫 `HOST`）并在 `/etc/profile`\
  \ 脚本中设置它。\n\n或者，在 `/etc/me.txt` 写一个简单的文件，并将服务器名称写进去，然后创建一个名为 `servername.sh` 的简单脚本，内容为\
  \ `cat /etc/me.txt`。\n\n## 问题 68：计时器\n\n对于 Bourne shell 脚本，显示脚本运行持续所需的代码片段是什么？\n\
  \n我想可能至少需要两个变量：`TIMER_START` 和 `TIMER_END`，但不确定如何最好设置这些值并计算流逝的时间。\n\n答：一个起点：\n\n\
  代码：\n\n```bash\ns=`eval 'date \"+expr \\( 3600 \\* %H \\) + \\( 60 \\* %M \\) +\
  \ %S\"'`\nstart=`eval $s`\n\n# 在此处编写你的脚本\n\ns=`eval 'date \"+expr \\( 3600 \\* %H\
  \ \\) + \\( 60 \\* %M \\) + %S\"'`\nend=`eval $s`\necho \"Elapsed time = `expr $end\
  \ - $start` seconds\"\n```\n\n## 问题 69：动态变量评估\n\n在 Sun Solaris 8 系统的 Bourne 脚本中，我正在动态创建并测试一些变量。我在检测动态变量是否有值时遇到了问题。\n\
  \n假设始终存在一个 `DEST1`，但目标是测试是否有更多。同时也假设它们是按顺序创建（`DEST1`、`DEST2` 等）。\n\n代码：\n```bash\n\
  # 用户定义变量\nDEST1=\"/dir_x\"\nDEST2=\"/dir_y\"\n\n# 构建目标字符串\nfor i in 1 2 3 4\ndo\n\
  \  echo \"$DEST$i\" # <=== 这行显示正确\n  if [ -n $DEST$i ] then\n    # 如果上述为真，需要执行的操作\n\
  \  fi\ndone\n```\n\n我如何测试用户是否创建了 `DESTn` 变量？\n\n答：尝试如下代码：\n\n代码：\n```bash\n#!/bin/sh\n\
  # 用户定义变量\nDEST1=\"/dir_x\"\nDEST2=\"/dir_y\"\n\n# 构建目标字符串\nfor i in 1 2\ndo\n  eval\
  \ DIR=\\$DEST$i\n  echo \"$DIR\"\n  if [ -n $DIR ] ; then\n    # 如果上述为真，需要执行的操作\n\
  \    echo \"Dir = ${DIR}\"\n  fi\ndone\n```\n\n## 问题 70：从长列表中消除重复项\n\n我正尝试从一个用逗号分隔的电子邮件地址列表中消除重复项，列表类似于所示：\n\
  \n`myemail@address.com,bossemail@address.com,computerstaffemail@address.com,myemail@address.com`\n\
  \n我尝试过：\n```bash\nsort -u -t , emailfile.txt\n```\n但它似乎不起作用。我哪里做错了？\n\n答：尝试使用这段代码：\n\
  ```bash\nawk 'BEGIN{ORS=RS=\",\"}!a[$1]++' emailfile.txt\n```\n`BEGIN{ORS=RS=\"\
  ,\"}`\n这在读取文件之前执行。由于 `RecordSeparator`（记录分隔符）被设置为 `,`，`Awk` 将一次读取一个字段而不是一次读取一行。\n\
  \n`!a[$1]++`\n`!a[$1]` 意味着如果数组 `\"a\"` 对 `$1` 没有值或值为零，则打印刚刚读取的项。之后，`++` 会使 `a[$1]`\
  \ 的值加 1。这些操作的效果是仅在第一次遇到该项时打印它。\n\n## 问题 71：Crontab 相对路径\n\n假设我们有一个引用文件/目录相对路径的 shell\
