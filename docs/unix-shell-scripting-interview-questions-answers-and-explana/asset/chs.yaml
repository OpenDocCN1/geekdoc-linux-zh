  \ 30：移除引号内的逗号\n\n我有一个 csv 文件，其中某些字符串被引号包裹。我们发现以下 `sed` 操作：\n\n`/\\(\".*\\)[,]\\\
  (.*\"\\)/\\1\\2/g'`\n\n会移除引号内的逗号。如果存在逗号，这正是我们想要的，但前提是每行仅存在一组引号。当每行存在多组引号时，该 `sed`\
  \ 操作对该行不起作用。\n\n`sed 's/\\(\".*\\)[,]\\(.*\"\\)/\\1\\2/g'`\n\nxxxxxxx,xxxxxxxx,\"\
  Russellville,\",AR,xxxxxx,xxxxxxx ,xxxxxxxx,\",ARLINGTON HEIGHTS,IL,60005,US,5.96,0.98,,,,,,,,,,,,,,,,,,,,,\
  \ ,,,,\n\n是否有办法在 `sed` 操作中传递第二个、第三个或多个参数，以便当它处理包含多个引号的行时，能够理解并执行移除逗号的操作？\n\nA: 你可以尝试这样做：\n\
  \n`sed -e 's/\\(\"[^,]*\\)[,]\\([^\"]*\"\\)/\\1\\2/g' file`\n\n`sed` 的 `regex-s`\
  \ 是“贪婪的”——指定 `.*` 会匹配掉过多的内容，因此你必须将其限制为 `,`。\n\n你会如何做到这一点？如果我们有“后面跟着逗号的内容”，意味着“除逗号以外的任何字符后跟着一个逗号”：\n\
  \n`[^,]*`\n\n任何非逗号的字符重复 0 次或多次\n\n`[,]`\n\n后紧跟着一个逗号。\n\n## 中级问题与解答\n\n## 问题 31：搜索与替换\n\
  \n我如何使用扩展正则表达式进行搜索和替换操作？\n\nA: 要使用扩展正则表达式执行搜索和替换操作，请将以下脚本复制并粘贴到 `/usr/local/bin/extreg`\
  \ 或 `$HOME/bin/extreg`：\n\n代码：\n\n```bash\n#!/bin/sh\n\nif [ $# -gt 1 ]; then\n\
  \  perl -we '$/=\"'\"$2\"'\";while(<>){'\"$1\"';print $_}'\nelse\n  perl -we 'undef\
  \ $/;$_=<>;'\"$1\"';print $_;'\nfi\n```\n\n语法：`extreg regexp [separator]`\n\n`\"\
  regexp\"` 是一个或多个扩展正则表达式，用分号分隔。\n\n`\"separator\"` 是可选的分隔符，参见 `perl(1)` 的 `$INPUT_RECORD_SEPARATOR`\
  \ 部分。需要处理的数据被划分为（以分隔符结尾的）多个块，并在这些块上应用正则表达式。\n\n如果你想具有可移植性，应该直接调用 `Perl`。`\"extreg\"\
  ` 主要用于你的私有脚本或交互式 shell 模式。\n\n## 问题 32：“在 While 循环中读取”\n\n我有一个脚本，它尝试在从文件中读取每个值时，都向用户读取输入。输入文件是：\n\
  \n代码：\n\n```text\n#> more testfile\nTEST1 | D200 | 12345601 | | ABC company | m\n\
  TEST2 | D201 | 12345602 | | ABC company | m\n```\n\n脚本 `test.sh` 如下：\n\n代码：\n\n\
  ```bash\nwhile read line\ndo\n  read test?\"Enter a Value:\"\ndone < testfile\n\
  ```\n\n然而当执行时，shell 永远对 `read` 命令没有响应。\n\n代码：\n\n```text\n#>test.sh\n#>\n```\n\n\
  在 `while` 循环中使用 `read` 时，是否有我必须使用的特殊 `read` 选项？\n\nA: 查看这段代码：\n\n```bash\nwhile\
  \ read line\ndo\n  read test?\"Enter a Value:\"\ndone < testfile\n```\n\n在上述代码的第一行中，它是\
  \ `read line`。这从 test 文件中读取第一行并放入变量 `line` 中。同样，当你说 `read test` 时，它实际上是从 test 文件中读取第二行并将其放入变量\
  \ `test` 中。它不会从键盘获取输入，因为你通过指定 `<` 将 test 文件作为输入源。\n\n使用这段代码：\n\n```bash\n#!/usr/bin/ksh\n\
  IFS=\" \"\nfor line in $(< testfile)\ndo\n  echo $line\n  echo \"Enter value :\"\
  \n  read a\ndone\n```\n\n或者执行此：\n\n代码：\n\n```bash\nwhile read line\ndo\n  read test?\"\
  Enter a Value:\" < /dev/tty\ndone < testfile\n```\n\n## 问题 33：Shell 脚本函数\n\n一个简单的\
