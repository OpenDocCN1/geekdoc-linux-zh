  \ script \"\n}\n```\n\n在 shell 提示符下运行：\n\n`> . test`\n\n然后在命令行如下调用函数：\n\n`test_fn()`\n\
  \n它输出了 `function within the test shell script` 并符合预期。\n\n我如何找到当前 shell 已知的 shell\
  \ 函数？\n\nA: 在 `ksh` 中，使用 `typeset +f` 和 `unset –f`。\n\n## 问题 34：每次注销时执行脚本\n\n我如何在每次注销时执行脚本？\n\
  \nA: 有时在每次注销后执行命令是有用的。例如，清理临时目录或记录工作时长。\n\n让 shell 在每次注销后执行脚本 `$HOME/.atexit` 方法如下：\n\
  \n1. 在文件 `$HOME/.profile` 的开头插入此行：\n\n`trap \". $HOME/.atexit\" 0`\n\n2. 创建名为 `\"\
  $HOME/.atexit\"` 的文件，其中可以包含任意 shell 命令，例如：\n\n`$HOME/.atexit`\n\n## 问题 35：从内部调用脚本\n\
  \n我们有一个发送的脚本，但我想在内部调用 `script1`。有什么办法可以实现吗？\n\nA: 如果你理解得正确，请这样做：\n\n代码：\n\n```bash\n\
  #!/bin/sh\n## script1\n...\n```\n\n\n\n\n我的 shell 脚本 (`bash`) 每小时会执行一些查询，并将查询结果追加到日志文件中。如果没有结果，查询会返回类似“Query\
  \ has no entries.” 的内容。如果上一个小时的查询结果也是“Query has no entries”，那么脚本将不再追加结果，而是修改日志文件中“Query\
  \ has no entries”部分的时间戳。\n\n日志文件看起来如下所示：\n\n```\n############\n\nQuery time - Mon\
  \ May 8 09:59:14 PDT 2006\n\nQuery has no entries\n```\n\n在这种情况下，我该如何找到日志中最后一条“Query\
  \ has no entries”的条目？\n\n我该如何只修改这个“Query has no entries”部分的时间戳呢？\n\n答：追加文本的操作应该放在一个函数中，以避免重复编写三次相同的代码。类似下面的代码就可以实现：\n\
  \n代码：\n\n```bash\n#!/bin/sh\n\n## Usage: $0 message text\n\nnow=`date`\n\nlast=`tail\
  \ -2 q.txt`\n\nresult=$@ # message text\n\nif [ \"$result\" == \"Query has no entries\"\
  \ ]; then\n\n# Special case - no entries...\n\ntail -1 q.txt | grep \"^Query has\
  \ no entries$\" > /dev/null\n\nif [ \"$?\" -eq \"0\" ]; then\n\n# A repeated non-entry\n\
  \n# Get the rest of the file\n\nfilelen=`wc -l q.txt | awk '{ print $1 }'`\n\nshorter=`expr\
  \ $filelen - 2`\n\nhead -${shorter} q.txt > qq.txt\n\n# qq.txt now contains the\
  \ full logfile minus the final two lines\n\necho \"Query time - $now\" >> qq.txt\n\
  \necho \"$@\" >> qq.txt\n\nmv qq.txt q.txt\n\nelse\n\n# First non-entry... log it\
  \ as usual\n\necho \"Query time - $now\" >> q.txt\n\necho \"$@\" >> q.txt\n\nfi\n\
  \nelse\n\n# A \"real\" entry... log it\n\necho \"Query time - $now\" >> q.txt\n\n\
  echo \"$@\" >> q.txt\n\nfi\n```\n\n使用这个脚本，假设它叫 \"q.sh\"：\n\n代码：\n\n```bash\n$ ./q.sh\
  \ Query has no entries\n\n$ ./q.sh Hello\n\n$ ./q.sh Query has no entries\n\n$ ./q.sh\
  \ Query has no entries\n\n$\n```\n\n并且每次检查 `q.txt`。\n\n## 问题 39：输入的正确用法\n\n我正尝试编写一个\
