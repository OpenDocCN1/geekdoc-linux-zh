  awk '{print $1,$2}' file1 | sort > tmp1\nawk '{print $1,$2}' file2 | sort > tmp2\n\
  comm -3 tmp1 tmp2\n```\n\n## 问题 56: 在字符串中包含 \"$\"\n\n我有如下代码：\n\n```bash\nSqlString=\"\
