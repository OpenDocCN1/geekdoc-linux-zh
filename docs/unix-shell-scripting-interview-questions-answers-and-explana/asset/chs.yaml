  $APPLE`.\n\n## 问题 57: 删除空文件\n\n有一个 TEST.dat 文件。作为清理过程，如果 TEST.dat 是空的，我必须删除它。基本上，如果它包含任何内容，我就不想删除它，但如果它包含任何空格或什么都没有，我就想删除它。\n\
  \n是否有什么命令可以检查文件是否为空然后删除它？\n\n**A:** 按照以下步骤操作：\n\n\n\n\n\n1. 使用 `sed` 检查空格并删除所有空格。\n\
  \n2. 使用 `if` 条件检查文件大小，如下所示：\n```bash\nif [[ ! -s txt ]] then\n  echo \" empty \"\
  \nelse\n  echo \"non empty\"\nfi\n```\n\n3. 现在在 `if` 语句中删除：\n`rm -f txt.`\n\n##\
  \ 问题 58：复制脚本 (Copy Script)\n\n如何将一个每天变化的文件复制到新目录，并每天使用不同的名称？\n\n示例：\n今天创建的 Webfile：`copy\
  \ webfile` 到 `/hold/webfile.1`\n明天：`copy webfile` `/hold/webfile.2`\n\n答答：通常建议在文件末尾附加时间戳。除非你有特定需求，否则这样做更简单。但是，如果你真的想要数字递增次数，可以尝试以下方法：\n\
  \n代码：\n```bash\n#!/bin/ksh\n#=================== extn=`ls -l webfile* | sed -e 's/.*[.]//g'\
  \ | sort -nr | head -1` let extn=$extn+1 cp webfile webfile.$extn #===================\n\
  ```\n这假设你有一个 `webfile.file` 开始。你只需要在第一次复制时在末尾加上 `.1`，否则你会得到一个错误的数字信息。\n\n## 问题 59：在\
  \ Shell 脚本中解析字符串 (Parsing a String in a Shell Script)\n\n我需要在 shell 脚本中解析一个字符串。有什么内置函数可以实现吗？你能解释一下语法吗？\n\
  \n例如：\n```bash\n#!/bin/ksh\nread input\n# 输入的内容为 'welcome'\n# 现在我想只提取前 4 个字符或后 4\
  \ 个字符。\n```\n\n答：这两种情况都可以使用 `awk`。\n\n例如：\n前四个字符：\n代码：\n```bash\n$ echo \"welcome\"\
  \ | awk '{ print substr( $0, 0, 4 ) }' welc\n```\n后四个字符：\n代码：\n```bash\n$ echo \"\
  welcome\" | awk '{ print substr( $0, length($0) - 3, length($0) ) }' come\n```\n\
  \n`substr( s, i, n )`\n其中 `s` 是你想要执行 `substr` 操作的字符串，`i` 是你想要提取的第一个字符，`n` 是你想要匹配的最后一个字符。\n\
  所以如果你说 `substr( \"hello,\" 2, 4 )`，它将匹配第二、第三和第四个字符并返回 `\"ell.\"`。\n\n让我解释一下提供的代码：\n\
  代码：\n```bash\n$ echo \"welcome\" | awk '{ print substr( $0, 0, 4 ) }'\n```\n在上面的示例中，`substr`\
  \ 的第一个参数是 `$0`（在这种情况下它是传递给它的文本；`\"$0\"` 是整条记录）。第二个参数是 `0`（我也可以用 `1`），因为我想从字符串的开始处匹配。我想获取前四个字符，所以第三个参数是\
  \ `4`。\n\n代码：\n```bash\n$ echo \"welcome\" | awk '{ print substr( $0, length($0)\
  \ - 3, length($0) ) }'\n```\n上面的代码还使用了 `length`（字符串）命令来返回字符串中的字符数。\n所以在这里，我的意思是“返回从第一个字符开始（即字符串长度减\
  \ 3）直到字符串最末尾的子串。”\n\n为了澄清这一点：\n代码：\n```bash\n$ echo \"welcome\" | awk '{ print (length($0)\
  \ - 3), length($0) }' 4 7\n```\n所以在我们的 `substr` 中，我们从第 4 个字符取到第 7 个字符（包含），即第 4、5、6、7\
  \ 个字符 —— 最后 4 个字符。\n\n另一个解决方案是：\n```bash\ntypeset -L4 first4\ntypeset -R4 last4\n\
  x=\"welcome\"\nfirst4=$x\nlast4=$x\necho $first4 $last4\n```\n你也可以丢弃前 4 个或后 4 个字符。\n\
  ```bash\nlast_part=${x#????}\nfirst_part=${x%????}\necho $first_part $last_part\n\
  ```\n\n## 问题 60：替换字符串的所有出现处 (Replace All Occurrences of a String)\n\n我需要一个脚本，递归地替换所有文件名和文件夹名中出现的所有字符串。\n\
  \n目前我有这个脚本：\n代码：\n```bash\nfor f in `find -name *eye*`; do echo processing $f g=`expr\
  \ \"xxx$f\" : 'xxx\\(.*\\)' | tr 'eye' 'm'` mv \"$f\" \"$g\" done\n```\n问题是 `tr`\
  \ 将字符 `e` 和 `y` 替换为 `m`，而不是字符串 `\"eye.\"`。\n我是从这里改编的：http://webxadmin.free.fr/article/sh...to-lowe-135.php，所以我不太清楚\
  \ `expr` 中的正则表达式是如何作用的。我该如何让它工作？\n\n答：这里有一个可以行的代码：\n\n代码：\n```bash\nfor f in `find\
  \ . -name \\*eye\\* -print`; do echo processing $f g=`print \"$f\" | nawk 'gsub(/eye/,\"\
  m\")'` mv \"$f\" \"$g\" done\n```\n你引用的链接中脚本的 `\"tr\"` 仅仅是将大写名称转换为小写。\n\n## 问题 61：替换字符\
  \ (Replace Character)\n\n我需要一个脚本，递归地替换所有文件名和文件夹名中出现的所有字符串。\n\n在 Solaris 8 和 10 系统上，我需要在一个\
