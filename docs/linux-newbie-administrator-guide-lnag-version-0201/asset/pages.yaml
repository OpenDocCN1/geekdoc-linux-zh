  md: '# 6.7 Viewing and editing files


    cat filename | more

    View the content of a text file called "filename", one page at a time. The "|"
    is the "pipe" symbol on many American keyboards it shares the key with "|" makes
    the output stop after each screen. For long, it is sometimes convenient to use
    the commands head and tail that display the beginning and the end of the file,
    or less that enables scrolling up and down. If have to use a binary file and your
    terminal displays funny characters afterwards, you can restore it with the command
    reset.


    cat filename | less

    (two commands, use either) Scroll a content of a text file. Press q when done.
    "less" is roughly an equivalent "more", the command you know from DOS, but often
    "less" is more convenient than "more" because it lets scroll up and down.


    head filename

    Print first 10 lines of the (long) text file.


    tail filename

    Print last 10 lines of a long or growing file. Use tail -f filename for tail to
    follow the file as it grows-really handy for continuing inspection of log files


    pico filename

    Edit a text file using the simple and standard text editor dico. Use <ctrl>x to
    exit. There are many text editors for Linux, including several GUI-based. A brand
    new clone is nano.


    pico -w filename

    Edit a text file, while disabling the long line wrap. Handy for editing configuration
    files, e.g./etc/stab.


    vim

    (in terminal) Very nice, "advanced editor". Supports vertical text selection!


    kate

    gedit

    (in terminal) Simple yet nice text editors (GUI based).


    acs

    (in terminal) Another multi-purpose, feature packed text editor. This one even
    has timed backup.


    latte

    (in terminal) "Code" editor, i.e., plain text editor mean for writing programs.


    nedit

    (in terminal) Another programmer editor. Very nice and loaded.


    bluefish

    (in terminal) html editor (source with syntax highlighting and maaaa tools and
    options).'
