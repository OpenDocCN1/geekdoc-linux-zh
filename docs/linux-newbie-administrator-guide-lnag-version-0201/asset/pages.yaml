    ```


    Each line contains space-delimited fields that each line has six entries separated
    by white space. The first field is the name of the device. The second field is
    the mounting(an directory on your Linux system to which the resource will be).
    The third is filesystem. For removable media which may contain filesystems of
    several types, I use the option "auto" to let Linux probe which filesystem is
    currently present. (The order in which they are determined is by the order of
    the filesystems. You may want to know that if specified "fat-master" or the DOS
    filesystem will be shown first.) The fourth field contains options: "rw" = read
    and write, "ro" = read-only, "user" = users have the permission to mount this
    filesystem (user can unmount it), "user_user" = allows other user to mount and
    another user to unmount-otherwise only the user who can mount it), "exec" execution
    of programs is permitted from this filesystem. The number in the field 5 specifies
