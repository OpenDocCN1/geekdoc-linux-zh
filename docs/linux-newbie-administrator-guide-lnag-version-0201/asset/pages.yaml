    equations, can handle large documents, etc.

    The good news is that even if you do not know what Latex is, you may be able to
    use that of other word processors, although its philosophy is different. latex()
    philosophy is to type in the text, define the "styles" and leave the formatting
    to the typesetting program. This means you never adjusting the spacing (between
    words, sentences, paragraphs, etc. manually). When done with your document, you
    "compile" your text to create a device independent file (*.dvi). The *.dvi file
    can be viewed by a viewer and printed. The quality of the output is usually outstanding,
    but its process is typically somewhat frustrating than using a regular word processor.

