  md: '# 2.18 Can I use Graphical User Interface (GUI) all the time?


    You can. But I don''t think it would be very efficient for administration. The
    GUI under Linux is very nice, but it fails in comparison with the possibilities
    available under the command line. I do the GUI every day under Linux and MS Windows,
    and I do think that GUI is for program launching, navigating standard documents,
    and other routine tasks. For system housecleaning or automation, it is inflexible.
    The command interface (CLI) is a richer interface, and it also gives me some understanding
    of the working of my system.


    Two quotes to amplify this point: "Using a graphical interface is fairly easy
    because it limits you to a few basic operations if those aren''t what you need,
    then you may have problems." "Characteristic of a user-friendly system is that
    it limits your users. In others, the most user-friendly system is not necessarily
    the simplest." [http://linux.oreillynet.com/pub/linux/2001/11/15/linuxnums.html]


    I find that GUI and command line is perfect to cover all my needs. If you only
    and are not willing to learn any command options, you might consider delaying
    your Linux installation until the tools are better developed, unless you have
    somebody to help you administer your computer.


    On the other hand, if you have a computer-agnostic girlfriend or boyfriend, and
    all he/she does is execute performs half-a-dozen programs, you can set up a GUI
    screen for him her with icons or buttons


    From this guide''s point of view, command line is certainly for documentation.
    Icons and menus are meant to be comfortable and your icons and menus may be quite
    different from mine. Also, to set up an icon or command, I need to know the command
    that stands behind the icon. In short, understanding of the command line is indispensable
    for any setup and any work tedious, every day GUI. We include no screenshots in
    this guide--we found them ourselves useless in learning computers.


    # 2.19 How do I upgrade a Linux distribution?


    For a full upgrade (updated distribution CDs, .e.g., RH7.0->RH7.2), follow the
    time-honoured principle of upgrading Unix systems: do a /fresh, ''clean'' install
    and add back your data. We''re talking about rearranging your partitions and installing
    from scratch. (the quote from: http://www.northjourney.com/opensource/newbies/newb025.html).


    Thoughtful partitioning of your hard drive will facilitate future upgrades, because
    your data files can be preserved in your "home" directory. When upgrading:


    +   - Log in root

    - Make a copy of the /etc directory to some place where it won''t be destroyed
    (e.g., zipdrive). This will let me have a look at your prepared setup I encounter
    problems.

    - Make a backup of any valuable data in the /home directory. This is in case something
    went really wrong, for example, if I formatted a wrong partition.

    - Perform the installation of Linux but tell the installer to manage the partitions
    /home and /usr/local at their previous (existing) locations. DO NOT re-format
    these two partitions. This is critical if you want to preserve your data.

    - Boot the new installation and check that it works.'
