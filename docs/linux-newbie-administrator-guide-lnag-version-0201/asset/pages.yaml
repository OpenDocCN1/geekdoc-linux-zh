    which the password must be changed to something like 90 or less, and as a way
    to force a password change to something like 7 days before it expires. Check here
    (FAQ2.pass@security) for more info on passwords. NEVER create an account with
    no password, or with a silly weak password. Do not work on your computer as "root"-if
    you run a program with a known "security hole" as root, somebody may find a way
