  md: '# LINUX WEB ADMINISTRATOR GUIDE, VERSION 0.201


    # FOR THE UNDECIDED (LINUX BENEFITS)


    +   - use the software at nocharge, with any limitations,

    - copy, and distribute or sell unmodified copies of the software in the source
    or binary form,

    - use the software with propriary (e.g., your) modifications, free of charge,
    as long as you do not distribute or sell the modified version,

    - modify, and distribute or sell a modified version of the software as the source
    code is licensed and included on the same terms as the original (the GPL),

    - sell support for the software, without any limitations.


    What the GPL license *does* allow copy recipients is to take somebody else software
    under the GPL, modify the software, and distribute a modified version of the software
    under a proprietary license. Speaking plainly, the GPL license itself forbids
    stealing (somebody''s) software for incorporation into a commercial-only product.
    However, you may incorporate GPL software in a commercial program if you obtain
    permission from the copyright holder. GPL is certainly not more restrictive or
    imposing than a "typical" proprietary license. GPL is a license that grants the
    recipient rights which does not otherwise have, but gives away. Exclusive from
    the use of GPL are people who have violated the GPL.


    In general, copyright regulates 5 rights: to copy the work, to make derivative
    works, to distribute it, to perform it, and to display it.


    Here is a table which compares the license of Linux with MS Windows (put together
    by a RedHat lawyer, http://www.grokial.net/article.php?query=200312319027900)


    | Linux | MS Windows98 |

    |---|---|---|

    | Right to copy | Yes | No |

    | Right to make derivative works | Yes | No |

    | Right to redistribute | Yes, under the same licence | No |

    | Right to perform the work | Yes | Yes |

    | Right to display the work | Yes | Yes |


