    # 5.3.9 How do I copy-paste?


    Under-Windows, use your mouse: highlight the text to be copied, and press the
    middle button to paste. This works fast, and as long as the switching you don''t
    disable the original. If your mouse has only two buttons (no middle button), use
    "both buttons together" or press the right button (which combination depends on
    your setup). This is the "X-Windows style" copying.


