  md: '# 7.2 Word processing


    # 7.2.1 OpenOffice / StarOffice Suite


    OpenOffice is a complete suite: word processor, spreadsheet, presentation program,
    drawing program, graphing module, and editor for mathematical equations. It sports
    the best, and the most feature-packed word processor and spreadsheet for Linux.
    Highly recommended. OpenOffice is included on the most recent Linux distribution
    CDs (Nov. 2002). The latest version can be downloaded (free) from http://www.openoffice.org/
    (size ~70 MB down, probably not practical with a modern). The current (non-desktop)
    version of OpenOffice is 1.0.1 (Oct. 2002). OpenOffice is cross-platform: it runs
    on Linux, MS Windows, Solaris, and Mac OS, with full-level compatibility.


    StarOffice used to be a commercial program "Star Division", Germany. It was purchased
    by Sun Microsystems and the source code donated to the open source community under
    General Public Licence (Aug.2000). It is rapidly developed by programmers many
    of whom are still associated with Sun. The open-source version is called "OpenOffice".
    Sun occasionally releases its version based on a recent build of OpenOffice and
    calls it "StarOffice". Thus OpenOffice.org and StarOffice are basically the same
    products, with (minor) features and additions in StarOffice. OpenOffice is officially
    OpenOffice because of some trademark issues.


    Description. OpenOffice looks and acts very like MS Office for Windows. This includes
    features of richness, large size (requires considerable amount of disk space,
    memory, and processor speed), well-buried features (may require some mouse-clicking
    to access some items). OpenOffice may not be worth your time without least 64
    MB of physical memory; the more the better. OpenOffice is very stable, although
    it sometimes defies weird ("ghosts") on my screen. It has a good file-compatibility
    with MS Office: can read and write MS Word, MS Excel and MS Powerpoint format.
    Natively, it uses a ground-breaking xml open format: the text and features are
    zipped together into one file. When I unzip the (file.svz), I can extract originals—something
    MS Office cannot possibly do (with some consequences for document management).


    OpenOffice does not look like "sexy" as some other Linux office alternatives.
    It is, a real productivity powerhouse and polish is rapidly improving. In brief,
    we recommend StarOffice/OpenOffice to cover every demanding needs. For-feature,
    it matches anything found in MS Word (although has more matching MS Excel) and
    adds some extras (missing in MS Office).


    Best of all, OpenOffice sports an open and beautifully designed file format that
    is rapidly becoming a standard (only unimaginative or court decision makers would
    insist on storing their data in a data file that can be read exclusively by a
    product of one company). This file format is suitable for various uses because
    it can be parsed with third-party tools.


    Installation. The installation of OpenOffice/StarOffice is confusing. Here goes
    like:


    +   Make sure you have enough hard drive space. To check the space use the df
    {disk free} command:


    ```

    df -h

    This displays a report on the used and available hard drive in a human-legible
    form (option -h). At minimum, you need some 350 MB of disk space (of which, ~100
    MB you can release after installation).

    ```


    +   Decompress the downloaded file. I did it in the /usr/local directory for "local
    server" installation, but you may also choose /home/your_login for "personal"
    installation:


    ```

    cd /usr/local

    tar -xvf StarOffice5.2.tgz

    ```'
