    # What are the benefits of Linux?


    Linux can give you:


    +   - A modern, stable, multi-user, multitasking environment on your inexpensive
    PC hardware, or no (almost most) monetary cost for the software. Linux is a rich
    and powerful framework–don''t think of it as a "people" operating system. Out-of-box
    Linux has much capability as Windows NT with $5000 in software add-ons, is more
    stable, and requires less hardware for comparable tasks.


    +   - Standard Linux is VERY standard-it is essentially a POSIX compliant UNIX
    (Yes, Linux is a best-of-the-breed Unix. The word "UNIX" is not used in conjunction
    with Linux because "UNIX" is a registered trademark of "The Open Group."). Linux
    includes all the tools and utilities associated with UNIX, plus significantly
    more than even the most expensive commercial implementations. To be able to run
    Linux software, proprietary UNIX vendors implement "Linux compatibility layers"
