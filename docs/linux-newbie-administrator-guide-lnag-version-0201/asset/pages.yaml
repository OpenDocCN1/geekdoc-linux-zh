    # 8.5 Running MySQL


    Here are some basics for configuring and running MySQL. For details try the mysql
    documentation at http://www.mysql.com/doc/.


    # 8.5.1 Configuring the MySQL daemon


    Step one. Basic configuration of MySQL is in the following text file (at root):


    ```

    /etc/my.cnf

    ```


    MySQL comes with four sample configuration files which to choose depending on
    your system and database size:


    ```

    /etc/my-huge.cnf

    /etc/my-large.cnf

    /etc/my-medium.cnf

    /etc/my-small.cnf

    ```


    To do a default configuration of MySQL, select the appropriate file (I chose my-small.cnf
    since I don''t actually have a large database) and copy it to /etc/my.cnf


    ```

    cp /etc/my-small.cnf /etc/my.cnf

    ```


    Step two. Create the MySQL privilege database. This includes the host, user, tables,
    priv, columns, priv and function installation comes with a script file that creates
    this database for you. It is important that you run this script file before you
    start the MySQL daemon without the privilege database.

    To run the script file:


    ```

    /usr/bin/mysql_install_db

    ```


    Step three. Start the "mysql" daemon, setup group and read/write permissions for
    the MySQL database. This is not necessary since MySQL, setup security user account
    that will be running the MySQL daemon. This is highly recommended. The default
    installation does not do for you by creating a "mysql" user and group. If no such
    user exists on your system, create one using user and addgroup command. Note,
    that the user running the MySQL daemon does not have access to /, but for the
    duration of the instructions it is assured that it is.


    To setup the read/write permissions for MySQL, you first need to find the location
    of your database files. On computer the database directory is located under /var/lib/mysql/.
    The location of the database directory is set in the my.cnf file. To change the
    default directory edit the file appropriately. Read/write permissions for the
    "mysql" user database can be set by changing the ownership of the database directory.


    ```

    chown -R mysql:mysql /var/lib/mysql

    chgrp -R mysql /var/lib/mysql

    ```


    Step four. Start mysqld. Start manually using the safe_mysqld script. Remember,
    since you are root you need the name of the user with which you would like to
    start mysqld.


