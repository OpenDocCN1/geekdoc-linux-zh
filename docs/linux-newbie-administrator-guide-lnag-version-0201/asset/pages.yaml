  md: '# 4.1.1.1 Command line autocompletion


    This is a great command line interface-Use the [Tab] key to save on typing. It
    makes it brisk to deal with long and complicated filenames. For example using
    such a filename on the command line is really not problems, if I use autocompletion:


    ```

    dir Esorong 2080; Olson Brothers\ Fly on\ the wings\ of love\(denmark).mp3

    ```


    I just type


    ```

    dir Eu<Tab>

    ```


    and if there are no other files starting with "Eu", the rest of the filename is
    automatically typed for me. Otherwise, I would have to look at my choices (which
    are printed for me) and type or two more characters to change the filename unaniambously.
    The backslashes in the name of the example song are "literal", i.e., they are
    part of the filename.


    # 4.1.1.2 Problems with weird filenames


    Most of these problems can be solved by autocompletion. Additionally, to manipulate
    files that contain metacharacters, I may use a pair of '''' (two apostrophes),
    so that the metacharacters do not interpret them. For example, to rename a file
    *with space and apostrophe, I would use:


    ```

    mv "my file* without weird characters*" txt

    ```


    Please note that if I use a pair of '''', quoting with '' is much weaker than
    quoting with ''. If you use " (quotation marks) some metacharacters may get interpreted
    by the shell (altering their meaning).


    Following UNIX tradition, on Linux, one may create files with names containing
    any character, including non-printable (control) characters. These are very frequent,
    but if you encounter such a file, it can make you feel really weird. I would rename
    such file using a carefully positioned metacharacter. I would use first to try
    an action that targets the desired file, and then rename the file (using the "mv"
    command):


    ```

    mv myfile.txt html

    ```


    (I assume that the non-standard character(s) are between the letters e and y.)


    As an example of the perhaps weirdest problems that you might face when using
    non-recommended characters in a filename, creating a file with a name starting
    with d and then remove-it seems to be no way to do it (because a dash normally
    induces command options). E.g., the


    ```

    dir -junk

    ```


    will create a funny file (like in DOS, the symbol ") redirects the output from
    thm file to a named "junk". Since the regular way of removing the -junk does not
    work, I


    ```

    rm ./junk

    ```


    The dot slash means the beginning "current directory" and here serves the purpose
    of hiding the leading dash so it is not interpreted as introducing an option to
    the rm command. The point is here that I would rather stick to traditional naming
    conventions than face the occasional complications.


    Besides using autocompletion, apostrophes and quotes, I can manipulate files with
    weird names. Backslash has the special meaning of the subsequent character. For
    example, I can create a file with the name *\? using the following command:


    ```

    touch \*?

    ```


    (The touch command creates an empty file, or if the file exists, updates its date/time
    of last modification.)'
