  md: 'The IP number (sometimes "IP address") is split into four groups of numbers
    separated by dots. E.g., 123.123.123 is a formally-valid number. (All numbers
    are shown here in their decimal representations.) Within each group of numbers,
    the value may range from 0 to 255 (8 bits). The group of numbers from dot to dot
    is often referred to as an ''octet'' because it has 8 digits in its binary representation.
    The address contains a "network number" by "host number" as is an individual computer
    within a network. The network may be denoted by one, two, or three octets. The
    host is the trailing balance of the IP number (three, two, or octet).


    When the host number is filled with zeros (all octets that denote the host), the
    resulting IP number is interpreted as referring to this host (the former is called
    the "network number"). When the host is filled with 255 (in all the octets), the
    IP address is interpreted as all hosts on the network (and called the "broadcast
    address"). When the network number is filled with zeros (in it is interpreted
    as referring to the network. If the network number is filled with 255 (in all
    octets), it refers to all.


    +   - Networks are divided into 6 classes. The most important are class A, B,
    and C.

    - Class networks. Class networks are networks with numbers between 1.0.0.0 and
    127.0.0.0. The network is contained in the first octet. The host is contained
    in the trailing three octets. This division results in 127 bit networks, each
    of which may contain up to 1.6 million hosts.

    - Class B networks. Class B networks are networks with IPs between 128.0.0.0 and
    191.255.0.0. The host is contained in the trailing two octets. This gives 16320
    networks, each of which may contain up to 65504 hosts.

    - Class C networks. Class C networks are networks with IPs between 192.0.0.0 and
    223.255.255.0. The network is contained in the first three octets. The host is
    contained in the last octet. This division results in 2 million networks, each
    of which may contain up to 254 hosts.

    - Classes D, E, and F. These networks have addresses in the range 224.0.0.0 to
    254.0.0.0 and are experimental, or reserved for future use. They do not specify
    any network.


    Private addresses. The following IP ranges are reserved for private intern:

    10.0.0.0-10.255.255.255 (8/prefix)

    172.16.0.0-172.31.255.255 (12/prefix)

    192.168.0.0-192.168.255.255 (16/prefix)


    From an issue, an IP address is reserved for a network which is behind a firewall
    (which has no connection to the world-wide web). The balance of the valid IP addresses
    are registered and resolved by a DNS server.


    Default route. This is a special IP address 0.0.0.0. It is used to mark the network
    interface, the hardware to which the traffic will go on. For example, the default
    route may be assigned to eth0 (the symbolic name for the first ethernet card)
    or eth1 (the second ethernet card), or pp0 (the first point-to-point connection,
    modem).


    Local host. This is a special IP address 127 (a class network). It is used for
    local traffic to the computer and does not involve any network hardware or access
    physical networks. It is often called "loopback address". A computer may have
    many IP addresses at the same time; therefore, it typically has the 127.0.0.1
    loopback address, as another IP address which is individually assigned.


