  md: '# LINUX NEWBIE ADMINISTRATOR GUIDE, Version 0.201


    # LINUX SHORTCUTS AND COMMANDS


    Flexible utility for changing parts of filenames. For example:


    ```

    rename .htm .html *.htm

    ```


    ln source destination

    Create a hard link destination to the file called. The link appears as a copy
    of the original files, but in reality only one copy of the file is kept, just
    two (or more) directory entries point to it. Any changes to the file are automatically
    visible throughout. When one directory entry is removed, the other(s) stays intact.
    The limitation of hard links is: the files have to be on the same filesystem,
    hard links to directories or special files are impossible.


    ```

    ln -s source destination

    ```


    Create a symbolic (soft) link destination to the file called "source". The symbolic
    link specifies a path to where to look for the "real" file. In contradiction to
    hard links, the source and destination do not have to be on the same filesystem.
    In drawback of symbolic links is: if the original file is removed, the link is
    "broken"it points to nowhere; symbolic links can create circular references (like
    circular references in spreadsheets or databases, e.g., "a" points to "b" and
    "b" points back to "a"). In short, symbolic links are a great tool and are very
    used (more often than hard links), but they can create an extra level of complexity.


    ```

