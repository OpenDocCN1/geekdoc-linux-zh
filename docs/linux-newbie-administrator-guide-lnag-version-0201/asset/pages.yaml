    <SysRq=>>command key

    (Non-essential). This is a group of key combinations implemented in the Linux
    kernel (a level in). It means, changes these combinations will work most of the
    time. The combinations are meant for debugging purposes and in an emergency (mostly
    developers): you you should try other, solutions first. The key<SysRq=> is also
    known on PC as <PrintScreen>. The combinations can be enabled/disabled by setting
    the relevant kernel parameter to "1" or "0", e.g.echo "1" / proc/sys/sysrq


    <SysRq=>> Kill all processes (including X) which are running on the currently
    active virtual console. This combination is known as "secure access" (SAK).

    <SysRq=> Send the TERM signal to all running processes except init, asking them
    to exit.

    <SysRq=> Send the KILL signal to all running processes except init. This may be
    safer than killing runaway processes by the previous combination, but it may cause
    some of them to exit abnormally.


    <SysRq-l> Kill all processes, including init. The system will not be functional.

    <SysRq<-u> Remount all filesystems as read-only. This has the same effect as the
    sync combination above, but with one important benefit: if the operation is successful
    you won''t have to check all filesystems after a hardware reset.


    <SysRq->> Turn off raw mode. This can be useful when your session hangs. After
    issuing this command you may be able to use<CTRL+ALT<=\>

    <Alt+r> Reboot immediately without unmounting or syncing your disks. You will
    likely end up with filesystem errors.


