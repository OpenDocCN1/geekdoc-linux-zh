  md: 'LINUX Newbie ADMINISTRATOR Guide, Version 0.201


    LINUX Newbie ADMINISTRATOR FAQ


    # 5.3 Working with text and graphical consoles


    # 5.3.1 How to switch between text and graphical consoles


    Pressing the keycombination<ctrl><Alt><F1> will switch you to the first text console
    at any time. <ctrl><Alt><F2> will switch you to the second console;<ctrl><Alt><F3>
    to the third text console, etc., up to <ctrl><Alt><F6>, for the total of 6 consoles.
    <ctrl><Alt><F7> will switch you to the graphical user interface (GUI) console
    if one is running<ctrl><Alt><F8> to the second GUI console, etc., up to <ctrl><Alt><F11>
    for the total of 5 GUIs. The 12th console is either used as the 6th GUI (RedHat6.1)
    or to a place which multiple consoles are displayed (Mandrake 7.0, really cool
    feature). Typically none or only the first console is running


    Press the left<ctrl> and <alt> keys and hold them. Now press F1: Release <F1>,
    and <ctrl> and <alt> keys.


    Thus, sitting at a Linux computer I can have multiple consoles opened at the same
    time, I can switch between them using the hot keys as described above. I may log
    in as the same user (multiple times), or different users. Each login session is
    separate; they do not interfere with each other if you log in the same user twice.
    The first 6 consoles are text-based, command-line terminals (CLI, "command interface")
    and are named tty1, tty2...tty6 (historical name, "tty" stands for teletwriter).
    The subsequent consoles are graphical (GUI). These are all "local" consoles-my
    Linux computer is truly robust multitasking.


    You can connect to a Linux server remotely, over a network. While connected, you
    can have a program run on the Linux server and the display sent to your "local"
    console. This local console is an MS Windows server or another operating system-based.
    You cannot run programs on a Windows server, and it is often used with Linux.
    It is really helpful to be able to distinguish your console is running locally
    or remotely.


    The full-screen consoles are terminals by themselves. Under the GUI, you can also
    create "slave" pseudo-terminals (in a window) on-demand–they will be called pts0,
    pty1,...


    Sitting at a terminal, you can determine the name of your terminal using the following
    command:


    ```

    - tty

    uname -

    ```


    I can determine the computer on which my current session is located using:


    The name of the command "uname" is derived from "UNIX name". It shows the operating
    system name, and the kernel of the compilation of the kernel.


    You can close any terminal session by typing "exit" inside it.

    The Linux GUI console is similar to other GUIs you might have used, e.g., MS Windows,
    but there are also many important differences. I love multiple "desktops" to organize-the
    default setup in KDE 4 desktops (it can be switched between 1 and 6). I run many
    programs and close them, so to organize I keep a connectivity application (netscape
    with all its windows, newsreader, and lcq) on Desktop2, aboverline, and a text
    editor on Desktop4, and help on Desktop1 for my occasional chores. I can switch
    between desktops by clicking on the "desktop pager" on the "panel" or using <ctrl><TAB>.
    To switch between applications on a same desktop, I may dick the application window,
    or click its icon on the "autoconat panel", and usealt<alt><TAB> to give me a
    list of the processes currently running on the local machine ("localhost").


