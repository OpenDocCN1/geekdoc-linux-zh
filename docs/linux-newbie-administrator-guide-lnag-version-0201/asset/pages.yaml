  md: '# A simple example. The command:


    cat * | grep my_word | more

    will search all files in the current working directory (except files with a dot)
    and print

    the lines which contain the string "my_word".


    A shorter way to achieve this may be:


    grep my_word | more


    The patterns are specified using a powerful and standard notation called "regular
    expressions".

    There is also a "recursive" version of grep which will search all files in the
    current

    directory and all its subdirectories for my_word, and print the names of the files
    and the matching line:


    # Regular expressions (regexp)


    Regular expressions are used for "pattern" in search, replace, etc. They are often
    used

    with utilities (e.g., grep, sed) and programming languages (e.g., perl). The shell
    command dir, uses a

    slightly modified version of regular expressions (the two differences are noted
    below). This brief

    writeup includes almost all the features of standard regular expression-regexp
    are not

    complicated as they might seem at first. Definitely worth a closer look at.


    In regular expressions, most characters match themselves. To search for string
    "peter", I

    would just use a searching "peter". The patterns are so-called "special characters"

    (characters), which have special meaning:


    The special characters include \ (backslash), \. (dot), \* (asterisk), \[ (bracket),
    \^ (caret),

    special, only at the end of a string). The backslash terminating a pattern string
    is special for this string.


    The backslash, \ is used as an "escape character", to quote a special character.

    Thus, \\ searches for a backslash, \. searches for a dot, \* searches for the
    asterisk, \\searches for the bracket, \^ searches for the caret at the beginning
    of the string, \$ searches

    for the dollar sign at the end of the string.


    Backslash followed by a regular (non-special) character may have a special meaning.
    Thus,

    symbols ^ and \$ match an empty string at the beginning and the end of a word,
    respectively.

    b| matches the empty string, at the edge of a word, and b matches the empty string

    before any word.


    The ?, matches any single character. The dir command uses "?" in this place].
    Thus, "m.a"

    matches "ma" and "mea" but not "ma" or "mpa".


    Any string is matched by \.* (dot and asterisk). The dir command uses "*" instead.
    In general,\any pattern followed by \* matches zero or more occurrences of characters.
    Thus, "m*" matches two or more occurrences of "m". To search for one or more "m",
    use "m+".


    The * is a repetition operator. Other repetition operators are less-used—here
    is the list:

    The preceding item is matched zero or more times:

    +\ the preceding item is matched one or more times:

    {n} the preceding item is matched exactly n times:

    {n,} the preceding item is matched to n or more times:

    {n,m} the preceding item is matched to at least n times, but not more m times.


    The caret, ^, means the beginning of the line. So ^a means "find a line starting
    with an "a".

    The dollar sign, \$, means "the end of the line. So \$ means "find a line ending
    with an "a".

    Example. This command searches the myfile for lines starting with "s" and ending
    with an "n"

    and "n" within this string.


    ```

    cat myfile | grep my_word | grep "s.*n"

    ```


    The bracket, \[] defines a set. [ab] means either a or b. [a-zA-C] means any

    character from a to z or A to C.'
