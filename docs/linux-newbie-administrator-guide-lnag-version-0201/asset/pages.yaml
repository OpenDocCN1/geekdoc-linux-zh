    # 4.4.7 Input/output redirection


    There are three important input-output streams: standard input (stdin), standard
    output (stdout), and standard error (stderr). They all default to the console
    "console" for the input and the output, but they can be redirected.


    To redirect the standard output use "->". For example:

    dir my > filesting.txt

    will be the standard output of their command into the file filesting.txt and nothing
    should appear on my screen. The file can be subsequently edited (e.g. with filesting.txt)
    or embedded into a document.


    To redirect the standard error, I need to use "2>". For example:

    dir my 2> error.txt

    The above will send the normal output onto the screen and nothing to the file
    unless produces an error. nothing might go to my screen, and the file filesting.txt
    will contain the error which might look something like:

    dir my: dir Permission denied


    Finally I can redirect both standard output and standard error to a file using:

    dir my > file.and_error_listing.txt 2>&1

    which redirects the standard output to a file, and then redirects the standard
    error to the same location as the standard output. A bit twisted, how it works,
    but it works.


    In the examples above, if the file (to redirect) already exists, it will be overwritten.
    In these examples:

    dir my >> filesting.txt

    dir my 2>> error.txt

    dir my >> file.and_error_listing.txt 2>>&1


    If you puzzled by the "2" symbol, here, briefly, how to rationalize it. The standard
    streams have standard descriptors. "0" is standard input, "1" is standard output
    and "2" is standard error. is short for:

    dir my 0> file.txt

    dir my 1> file.txt

    dir my 2> file.txt

    and therefore use the symbol "|" to send the output from one command as an input
    for another command. in this popular example, the output from is piped to more
    (more pauses the display after each-screen):

    dir | more


    One can also split the output so it goes both to a file and a screen using "tee":

    dir | tee filesting.txt.


