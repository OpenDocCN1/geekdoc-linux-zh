    # 4.1.3 More about the /proc filesystem (only for really curious)


    The /proc "pseudo" filesystem is a real-time, memory-resident file system that
    tracks the state of

    operating system kernel and the processes running on your computer. The proc filesystem
    is

    tolly virtual, it is not on any particular disk or other persistent media, it
    exists only in the

    computer memory, and it is constantly updated to reflect any changes to your system.
    The size of the

    proc directory is always zero and the last modification time is the current date.
    In some cases, it

    ispossible to change your system settings by manually changing the contents of
    files in /proc

    filesystem. Many utilities use the /proc filesystem as the source of information,
    e.g., dmes,

    s, top.


    # 4.1.3.1 Contents of the /proc filesystem


    Directories with names like "1" to "4908" are IDs of the processes running on
    your

    computer. Each directory contains several files, e.g., cmdline (contains the entire
    line that

    was used to invoke the process), cwd (symbolic link to the cwd of the process),
    environ (the

    environment variables defined for this process in the VARIABLE=value), exe a (

    symbol link to the executable file that the current process is linked to), fd
    (a list of the

    descriptors opened by the process), maps (a mapped file that can be used to access
    the process

    memory), root (a symbolic link to the directory which is the root file system
    for the particular process),

    stat (info the status of the process).


    Other files in the /proc filesystem:

    /proc/cpuinfo--information about the processor, such as its type, make, model,
    and performance.

    /proc/devices--list of device drivers configured into the currently running kernel.


