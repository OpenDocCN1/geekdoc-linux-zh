    #  1.5 What are the differences between Linux and UNIX?


    Command-line-wise, almost none, although this has been changing (for better or
    worse). Linux has a much larger market appeal and following any commercial UNIX.
    GUI-wise there are also many differences-Linux, as most other Unixes use an X-Window
    system.


    The differences:


    +   - Linux is free, while UNIX (this is supposed to be the plural of UNIX), are
    very expensive.

    - The same for applications-many applications are free on Linux. Even the commercial
    application (if you wanted to buy) typically costs more for a commercial application
    UNIX than Linux.

    - Linux runs on many platforms, the commercial intel-x86/IBMspec personal computers
    being the most prominent. In contrast, a typical UNIX is proprietary-hardware-banded
    (and this hardware tends to be more expensive than typical PC done).

    - With Linux, you are in charge of your computer; whereas most UNIX are typically
    confined to an “l-user” (so administrators donate to “loser”).

    - Linux feels very much like DOS/Win in the late 80s/90s, but it is much sturdier
    and richer, while a typical UNIX account feels like a mainframe from the 60s.

    - Some UNIXes may be more mature in certain areas (for example, security, some
    engineering applications, better of cutting-edge hardware). Linux is more for
    the average Joe who wants to win his own server or engineering workstation


