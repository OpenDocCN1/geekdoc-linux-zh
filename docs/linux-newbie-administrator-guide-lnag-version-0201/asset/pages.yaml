    hdd\" adjust the command as needed.\nhda -- first ide master (whole disk)\nhdb\
    \ -- first ide slave\nhdc -- second ide master\ndhd -- second ide slave\nda --\
    \ first scsi (whole disk)\nsdb -- second scsi (whole disk)\n\nsdp -- sixth scsi\
    \ (whole disk)\nFor other disks, consult/usr/src/Linux/Documentation/devices.txt.\n\
    Most of the time, I will marry Linux partitions to be of the type ext3 (\"Linux\\\
    ).\nPartitioning can be tricky—if you have never done it, read fdisk and cfdisk.\
    \ It is very easy to delete partitioning with all your data. Make sure you know\
    \ which you are working with!\n\nfdisk or cfdisk not make any changes to the hard\
    \ drive until I write the new partition layout. Or if I make a mistake, I can\
    \ always quit without writing. I write the layout to the drive only when I am\
    \ completely done.\n\n+   2. Format each partition. For example, to format the\
    \ first partition, making for checking for blocks\n-(c), I would do:\nmkfs -c\
    \ t ext2 /dev/hdd1\n\n+   3. Test the new partitions. Mount the new partitions\
    \ manually (the mount directory must exist and be empty). Copy a bunch of files\
    \ to each partition. View/edit a copy of random files.\nDelete all\n\n+   4. Copy\
    \ data. Optional-only if you want to move data from an old partition to a new\
    \ partition. To get the single-user mode (init 3), Mount the new partition manually.\
    \ Copy the data from the old partition to the new partition. Careful with the\
    \ old data, you probably don't want to lose it if you made a mistake, so I wouldn't\
    \ delete it-I rename the top level directory appropriately.\nEq.\ncp -R /usr/local/\
    \ /mnt/hdd1\nmv /usr/local/ /usr.local.backup_2001-04-24\n\n+   5. Edit the file/fstab.\
    \ Modify it to reflect your new filesystem layout. However, insert the mountpoint\
    \ for the new partition(s) or modify any old mountpoints as needed. For example,\
    \ if moving/usr/local to its own partition, I would need to add a line like this:\n\
    /dev/sda1 /usr/local ext2 defaults 1 2\n\n+   6. Reboot and test. The alternative\
    \ is to unmount and mount new mount points. For\nexample:\nmount /usr/local\n\
    mount-\n hard reboot may be a more rigorous test of the new layout.\n\n+   7.\
    \ Remove old data. After a few days, when I have the confidence everything is\
    \ working fine,\nde delete the old data (e.g., the directory/usr/local.backup\
    \ of 2001-04-22).\n\n# 5.2.13 Swap space\n\nSwap is an extension of the physical\
    \ memory of the computer. Most likely, you created a swap partition during the\
