    called mars. The mount is on the client computer (this should not be necessary,
    but it is on system). The option "c" specifies that the server is a machine called
    mars-


    For the above to work, the permission must be given on the MS Windows machine
    for sharing the drive or directory as a resource. To do this, on MS Windows, enable
    the filessharing using the "control panel-network", launch the "Windows Explorer",
    click the right mouse button on the drive or directory to share, click on the
    page "sharing", give yourself the permission and give the resource name.


