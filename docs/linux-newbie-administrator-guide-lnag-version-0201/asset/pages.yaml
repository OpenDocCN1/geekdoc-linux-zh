  md: '# LINUX NETWORK ADMINISTRATOR GUIDE, VERSION 0.201


    # BASIC OPERATIONS FAQ


    special reason to make it different. Most of Linux commands are all lower case.


    Filenames under Linux can be up to 256 characters long and they normally contain
    letters


    It is not possible to use / as a part of the filename because / is used to represent
    the top of the directory tree, and as a separator in the partitions (the same
    as - is in DOS).


    Like in DOS, I cannot have a file called. or a file called.. (dot or two dots)-s
    make "current" and "parent to the current" directory, exactly like in DOS.


    Here is the meaning of some characters:


    +   * Matches any zero or more characters, except for \.\ (a dot) at the beginning
    of a filename


    +   * ? Matches any single character.


    +   [abc1] Matches a single character in the enumerated set. In this example set
    contains: ''a'', ''b'', ''c'', and ''1''.


    +   [a-z] Matches any lower-case letter


    +   [A-F] Matches any upper-case letter from A to F.


    +   [0-9] Matches any digit.


    +   [a-zA-Z] Matches any letter (lower or upper case) or any digit.


    The character \ (backslash) is also special. It makes the subsequent special character
    acquire literal (reading on).


    Examples


    This command will list every filename in the current directory, with the exception
    of filenames starting with \.\ (dot):


    +   * ls


    An equivalent to this command is to type ls or dir (without the "*"). Files with
    names starting with \.\* are not shown because the first character of a filename
    is not matched by "*" as an equivalent of DOS hidden files. Use -a (list with
    the option "all") or ls -a (to see "dot" files). The "dot-files" are common in
    the home directories and they typically contain user-level configurations.


    This command will list every file (in the current directory) that contains a dot
    (except starting with a dot):


    +   * ls*


    This command will list every filename that contains two dots (except starting
    with a dot):


    Please note that Linux does not have "file extensions" the way DOS does, but you
    can still use them; for example, I can have a file my.txt.zip. Some other DOS
    file-naming features are completely absent ("Micro-1.doc" comes to mind).


    This command will find (on the whole filesystem) any file with the extension "htm"
    followed by one or more:


    +   * locate *.htm?


    This command will show all filenames in the current directory that start with
    "a" or "b", or any capital letter:


    +   * [abA-Z]*


    +   * ls*n


