  md: '# For the Undecided (Linux Benefits)


    # 1.1 Fundamentally, why Linux?


    If you truly enjoy with computers, Linux is the operating system of your dreams.
    It is more fun than any other operating system around. Linux is a computer hobbyist''s
    paradise.

    The reason why Linux is so revolutionary is that it is Open Software. Our science
    and technology owing to the free availability of information, peer review, and
    the capabilities to pick up ideas or modify or extend. Open Software is an implementation
    of the scientific method into the field of software development. The freedom to
    pick-up, modify and extend, that comes with the Linux licence, offers a promise
    that the software development under Linux licence will continue in the day that
    science does.


    The making of horses, glass blowing, or measuring were once closely guarded secrets.
    Science and technology exploded 500 years ago thanks to the sharing of knowledge
    by the few on the know-how. Why were science and technology relatively stagnant
    before the printing era? The "trade secret" approach to growth has its limits:
    development continues until the rate of learning equals the rate of forgetting.
    Moving the know-how to the public domain (on paper) shifted the position of equilibrium
    to a higher level, which after 500 years of turbulent development, we are still
    to achieve.

    Interested, I can present equations, borrowed from chemical equilibrium field,
    that describe this in a more formal way. The main point is that printing increased
    the audience, and allowed information across space and time.


    In the early days of printing, many of those who dared to share were assassinated
    for revealing "trade secrets." Linux is for the computer age Gutenberg was writing.
    Hopefully there will be no assassinations this time (-). Linux does clash, violently
    at times, with those who claim the "ownership" of information, trying to pick
    back 500 years.

    Open Source also has implications for computer security. Imagine a plane based
    on secret "scientific laws", built to an unreviewed design, a plane at internals
    of nobody but the manufacturer could inspect. Would you believe that this unique,
    completely proprietary plane, obviously built by clever and well-funded marketers
    in their basement, is any safer than one built in the open under the eyes of thousands
    of critical engineers and hobbyists with no association to the manufacturer secret
    computer program? Open Source Linux is ideally suited for a mission-critical application-its
    security and power are based on robust solutions which are reviewed with no restrictions
    whatsoever, and continuously improved.


    # 1.2 Is Linux for me?


    Only you can answer this question. Linux is a mature, powerful, secure and extremely
    versatile UNIX-like operating system. Power and versatility come with a price—you
    might need to be computer-literate to set up and maintain Linux. Linux is relatively
    easy to use the operating system and applications are set up properly. So, your
    mother will be able to use Linux, if you set up an graphical account for her and
    pick the icons/menus on GUI desktop. Linux is secure so your mother will not be
    able to damage the system no matter how hard she tries—unless with a hammer!


    Linux is quite different from MS Windows, so not expect that if you can get around
    Windows, then Linux will be straightforward. You may need to learn. On the other
    hand, if you come from UNIX, Linux will be straightforward for you. If you don''t
    know much about computers or you don''t enjoy them, chances Linux administration
    is for you. If you don''t know your hardware, Linux installation may be a challenge.'
