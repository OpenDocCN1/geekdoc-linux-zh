  md: '# 5.3.10 How do I Display and Control a Remote Desktop using VNC


    (VNC = Virtual Network Computing). A very useful application–don''t miss it.

    VNC is a cross-platform utility that allows me to display a remote graphical desktop
    over a standard network connection. For example, I can run VNC on my MS Windows
    PC to display an X-window environment of my Linux network servers, or the other
    around. VNC will run over a 56k modem networking, but only for fun or in emergency
    (too slow for normal work).


    Recent Mandrake or RH will have vnc on their distributions CD. The MS Windows
    version you have to download yourself. Seehttp://www.uk.research.atht.com/vnc/
    for download information and more details.


    On Linux, VNC consists of four commandsvncserver, vncviewer, vncpassword and vncconnect.
    I typically need two of them:server and viewer. A brief description of the commands
    follows:


    vncserver

    The server that has to be running on the remote (host) computer. You start the
    server as you whose desktop will be displayed (don''t run the server as root or
    somebody else may kidnap your computer!).


    vncviewer

    The local application which connects tovncserver and displays the remote environment.
    You need to know the password and ip address of the server to connect.


    vncpassword

    Selection utility forvncserver. The server won''t run without password (good behaviour).
    If you select one, it will prompt you. Hence, I don''t need to explicitly vncpassword.


    vncconnect

    Tells vncserver to connect to a listening VNC viewer on the given computer and
    port. This is why avoid anything a password.


    For a list of all options in run:


    vnc -help

    it is not recommended to run the VNC server as root due to potential security
    issues. If you need root privileges, log in as a user of "typical" sessions follow.


    Example 1. Sitting at an MS Windows computer, I can display an X environment from
    my Linux server using the following:


    ```

    [start a DOS terminal in the following command]

    telnet my_server_name

