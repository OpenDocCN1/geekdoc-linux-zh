    cards, scanners, Iomega devices, etc.


    The most notable exceptions are the so-called Winnows (= MS Windows windows also
    called "software modems”). Avoid these-they are a bit less expensive than most,
    but they are crippled (so processing is done by the main CPU instead of the modem),
    and there is little chance that you will have a Winnow running on Linux right
    (for more info on Winnows, see http://www.iter.org/gromitkc/winennom.html). External
    modems are not "Winnows" if so do bought, an external modem (external modems are
    more expensive, but they don''t drain your PC power supply, are easily portable
    between computers, look better, and show modem activity). Additional points to
    consider with modems: ( not supported. See the


    Another area of potential problems is the video card. If you have a "cutting edge"
    3D or uncommon windy, you may need to check its compatibility http://www.Xfree86.org
    Zip of drivers is also kind needed.


    I wouldn''t count Linux TWAIN (= Technology Without An Interesting Name, no joke
    here) as a scanner, no matter if the manufacturer claims it compatibility.


    So the short answer is yes, in all likelihood your standard PC will run Linux
    with no problems. You might not try when buying Linux, so probably the way to
    make sure is to attempt an installation on your existing hardware. There are Linux
    hardware compatibility lists at http://hardware.redhat.com/hw/page2.html http://metalab.anc.edu/LDP/Hardware-HWTO.html)
    if you want to check whether your hardware is supported


    When purchasing new, I would always check its Linux compatibility on the above
    lists. You can also ask if the hardware is supported, but it would be fine. But
    with a grain of salt-too many companies have incompetent sales personnel/technical
    support. When purchasing a new computer, I would consider a system with Linux
    pre-installed. A number of suppliers offers better (particularly large ones) with
    Linux, but many do. You can always get a system with Linux-preinstalled from a
    smaller vendor.


    If you are an adventurous person, I would pay no attention to the above concerns,
    changes are 90-100 that the hardware will work.


    If of of hardware is (apparently) not supported in your current Linux distribution,
    don''t give up. Check on that: (1) It is supported, but you don''t know how to
    set it up. (Solution: stay around with Linux for a few weeks, then you may get
    some understanding of how your system works, then you may be able to set it up).
    (2) You have to go through a more complex setup to support the hardware (maybe
