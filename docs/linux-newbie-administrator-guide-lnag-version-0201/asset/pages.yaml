    To customize the prompt, I can edit the /etc/bashrc (as root) and insert any text
    you want the quotation marks. Here is the meaning of some special codes I may
    also choose to use:


    +   \u - name of the user ($HOSTNAME)

    \h - the name of the computer running the shell (hostname)

    \W - entire hostname

    \w - the base of the name of the current working directory

    \$ - display "$ or #" for the root

    \ - history number of the current command

    \ - number of the current command (executed in the current shell)

    \D - current date

    \t - current time (24hr)

    \l - current time (12hr) - bash 2.0 only.

    \T - current time (AM/PM format) - bash 2.0 only.

    \s - name of the shell

    \a - sound alarm (beep),

    \ - number of jobs you have used

    \ - new line,

