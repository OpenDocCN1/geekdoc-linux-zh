  md: '# LINUX Newbie Administrator Guide, Version 0.201


    # Some Essential LINUX Applications


    +   Substitute filename StarOffice5.2.tgz with the name of the file you downloaded.

    As root, run the setup for a local "server" with the DOS-style /net switch:

    cd /usr/local/OpenOffice64

    ./setup /net

    With the "/net" or "-net" switch, OpenOffice will perform a personal installation
    (into your home directory!), and then only one user will be able to run it, plus
    your home directory will be clogged.


    +   After this "network" installation, each user has to perform their own installation
    to put folders into their "home" directories. This is done by running (as a user,
    without the /net switch):

    cd /usr/local/OpenOffice64

    ./setup


    To run any of the OpenOffice component using the command (in line X), I could
    use:\soffice (word processor)

    writer (same as above)

    nocalc (spreadsheet)

    dodraw (vector drawing program)

    imimpress (presentation program similar to MS PowerPoint)

    oseup (installation program)

    operadmind (printer utility)

    nomath (equation editor, it is not typical to run stand-alone)


    Hints. office comes with an extensive, context-sensitive help (pres1). Here, we
    are going to collect a few quick references using outwriter (started Nov+2002).


    +   Consider using "headings" for formatting documents. Unless you are writing
    a very simple document, avoid "physical formatting". Press F11 for a full style
    list. Inspect the drop box on the tool-bar (left-hand side) for a list of paragraph
    styles used in the current document.


    +   The styles are divided into the following groups:

    Character styles (applies to a letter or a group of letters)

    Paragraph styles (a paragraph extends fromEnter to<enter>)

    Frames (a box containing text, graph, picture, etc.)

    Page styles

    Numbering styles (for bullet and numbered lists)

    The most important are the paragraph styles. I use them to format headings, table
    headings, etc. To apply a style to a paragraph, I place the cursor in the paragraph
    to be modified, and then double-click the name in the "Stylesist". To modify a
    style (or create a new one), I use the menu "Format-Style-Catalogs.


    +   For numbered chapters, for a table, figure, etc.), I position the cursor under
    the table (figure, etc) and use the menu "insert-Caption". It can also be modified
    later in the dialog box which appears when I click on the caption number.


    +   To display an outline of the document, I press F5.

    To modify a default documentandemplate, make a "default" documentand save it as
    "Default" ("File".Templates")-Save


    +   To spell-as-you-type, enable it under menu "Tools-SpellCheck".AutoSpellCheck.
    To spellcheck of a word, position a cursor over it and press F7.

    For "type-ahead" autocompletion, I may press Enter to select the selection when
    x appears.

    Cells in tables can be split. (If you are coming from MS Word, you can now start
    split cells again.)


