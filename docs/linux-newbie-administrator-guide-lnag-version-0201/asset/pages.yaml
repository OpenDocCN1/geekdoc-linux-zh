  md: '# 6 Linux Shortcuts and Commands


    Intro. This is a practical selection of the commands we most often, find useful,
    and which come on our Linux distribution CDs (RedHat or Mandrake Use the empty
    command line to see the listing of all available commands (your PATH). On my small
    home system, it says there are 3786 executables on my PATH. Many of these "commands"
    can be accessed from your GUI frontend (probably KDE or Gnome) by clicking appropriate
    icon, or button. They can all run from the command line (unless you installed
    the package, but they come on my Linux CDs). Programs that require GUI have to
    run under the GUI, for example a terminal opened in kde or gnome (e.g., console
    or xterm). More advanced (less useful for a newbie?) tools are described in the
    Part Learning with this Guide.


    # 6.1 Notes for the UNIX Class


    +   1. LINUS IS CASE-SENSITIVE. For example: Mozilla, MOZILLA, and Mozilla would
    be four different commands (but the four, only Mozilla is available on our system).
    my_file, my FILE are three different files. Your user name and password are also
    sensitive case (This goes with the tradition of Unix and the "c" programming language
    being sensitive).

    2. Filenames can be up to 256 characters and can contain letters, numbers, ".
    (dots), "_" (underscores), "-" (dashes) plus non-recommended characters.

    3. Files names starting with "-" are not normally shown by the ls (list) or dir
    command. Think of these "dots" as hidden. Use -a (with the "all") to see these
    files.

    4. "/" is an equivalent to DOS ":\" (root directory, the parent of all directories,
    or a separator between a directory name and subdirectory or filename). For example,
    cd /usr/

    5. Under Linux, all directories appear under a single directory (there are no
    DOS-style directories). This means directories and files from all physical devices
    (plus network filesystems) are merged into this single-view tree.

    6. In a configuration file, a line starting with # is a comment. When changing
    a configuration file, do not delete out the original lines with #. Always insert
    a short comment describing what you have done (for your own!).

    7. Linux is inherently multi-user. Your personal settings (and all other files)
    are in your home directory which is /home/your user_name. Many settings are kept
    in files names starting with a dot. ".so to keep them out of your way (see point
    3 above). You have to do anything.

    8. System-wide settings are kept in the /etc.

    9. Under Linux, in any multiuser operating system, directories and files have
    an owner and a set of permissions. You will typically be allowed to write only
    to your home directory which is /home/your user_name. Learn to use the file permissions
    also will be constantly annotated with Linux.

    10.Command options are introduced by a dash, "-", followed by a single letter
    (or when the option is more than one letter). Thus "-" is an equivalent of DOS''s
    switch "/. For example, try rm -help.

    11.Type command&(the command name followed by an &) to start a command in the
    background. This is usually the preferred way of starting a program from the X-window
    terminal.


    # 6.2 Linux essential keyboard shortcuts and sanity commands


    <Ctrl>Alt<F1>'
