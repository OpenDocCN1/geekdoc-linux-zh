    # 4.4 Shell


    # 4.4.1 What is a shell and why not to use a different one?


    A shell is the program that interprets what you type on the command line and decides
    what to do with it. A shell also be invoked in a non-interactive way, for example
    to execute a pre-listed list of commands in a text file (a "shell script"). Think
    of it as equivalent of the DOS "command.com" (command-line interpreter) and shell
    scripts as the execution of the DOS batches files (*.bat).


    There are several shells available on the Linux system (if you installed them
    [Bourne Shell]), sh (Bourne shell, standard on UNIX systems), csh (C shell, with
    a syntax akin to the "c" programming language, on small systems), bash (public
    domain kernel shell), tsch (C shell off), ksh (stand-alone shell, could be used
    when libraries are not available), ash, zsh, and perhaps couple more.


    The default shell on my (and probably on yours) is bash, which is an excellent
    and standard shell, I cannot see reason why we might like want to change it. It
    is fully backwards-compatible with the Bourne shell (the most popular shell on
    UNIX) and has many enhanced features and best features from other shells. From
    a newbie perspective, the different shells are included with Linux for historical
    reasons and backwards-compatibility of shell scripts that require a particular
    shell to run (Some shells may be useful if you want to run on "embedded" devices,
    that might run a "tiny" shell).


    You can determine which shell you are running:


    ```

    echo $SHELL

    ```


    If you wanted to try another shell, for example:


    +   - tsch


    which will start the tiny csh. When, done


    ```

    exit

    ```


    which will return to the previous shell (using exit on your first shell will log
    you out). You can find out how many shells you stacked on each other by displaying
    the "shell level" environment variable:


    ```

    echo $SHLVL

    ```


    In the above command, the "$ means expand the value of a shell environment variable",
    SHLVL is the variable name, and "echo" is a command that prints things.


    The shell for each user is specified as the last field in the password file/passwd.
