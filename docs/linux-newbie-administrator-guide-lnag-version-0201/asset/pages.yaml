    # 8.5.2 Setting up a database using MySQL


    Step one. Set the root password for MySQL. Without a root password, anyone from
    your localhost

    log on with root privileges to your MySQL database which is probably not good
    if you intend to

    keep anything usable.


    ```

    mysqladmin --user=root password my_root_password

    ```


    If you would like to create a password for a specific user (including root), use
    the following syntax

    (in this case the password for the user is changed from "my_root_password" to

    "MY_NEW root_password")


    ```

    mysqladmin --user=root password=my_root_password ''My New root_password''

    ```


    Step two. Create a database to work with. This would be the reason why you actually
    installed

    MySQL.


    ```

    mysqladmin --user=root password=my_root_password create_database

    ```


    Step three. Log on MySQL


    ```

    mysql --user=root -pmy_root_password

    ```


    Once you are logged in, you should get a display that looks like this:


    ```

    Welcome to the MySQL monitor. Commands end with : \ \

    Your connection to the server version: 2.23.56

    Type ''help'' or ''h'' for help. Type \c to clear the buffer.

    mysql>

    ```


    The last "mysql" represents the prompt.

    Step four. Create a user that can read, write tables in "my database". To do this
    I use

    GRANT command logged on to MySQL with root privileges.


    ```

    mysql> GRANT SELECT,INSERT,UPDATE,DELETE,CREATE,DROP,ALTER

    -> ON my_database.* TO ''peter'';

    -> IDENTIFIED BY ''password'';

    ```


    Note, MySQL only processes the command when ended with a semicolon. Once entered,
    you should

    get an output similar to this:


    ```

    Query OK, 0 rows affected (0.00 sec)

    mysql>

    ```


    To log out of MySQL just type:


    ```

    mysql> exit

    ```


    Now you can log on to MySQL with your new user account and start building your
    new database.


    ```

    mysql --user=peter --password=''peter_password'' my_database

    ```


    Step five. Create a table in my_database. To add a table to use the CREATE TABLE

    command. The syntax is as follows:


    ```

    CREATE TABLE [table_name] ([column name] [column type] [DEFAULT value],...)

    ```


    My command looked like this:

    To alter the table you have created, use the ALTER TABLE command. To add

    another column to the table with the name "height" of the type REAL and with a
    DEFAULT

    value of NULL, I use the following command:


    ```

    CREATE TABLE table_name (person TEXT "", age INTEGER 0);

    ALTER TABLE table_name ADD COLUMN (height REAL NULL);

    ```


    Step six. Populate the table with values. Note, when you enter the values, they
    must be in the

    order as the columns in. Use "NULL" for a NULL value.


    ```

    mysql> INSERT INTO my_table VALUES(''Bill'',20,184);

    ```


    You can also populate the table from an ASCII tab-delimited file. To do this you
    must pass the

    option "--local-infile" to MySQL when logging in and then call the LOAD DATA command.


