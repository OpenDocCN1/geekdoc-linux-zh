    ```


    (as root, in terminal) Manage users and groups using a GUI. And not probably covering
    most of what you normally need to manage user accounts.


    ```

    chmod perm filename

    ```


    (= chmod) Change the file access permissions for the files you (unless you are
    root in which case you can change any file). You can make a file accessible in
    three modes: read (r), write (w), execute (x) to three classes of users: user
    (u), members of the group which owns the file (g), others on the system (o). Check
    the current access permissions:


    ```

    ls -l filename

    ```


    If the file is accessible to all users in all modes it will:


    ```

    -rwxrwx

    ```


    The first triplet shows the permissions of the owner of the file, the second or
    the rest of the world). A "no" permission is shown as "-". When setting permissions,
    these symbols are used: "u=(user or owner of the file), "g=(group or others),
    "a=(all, i.e., owner and groups), "=(set the permission), "+=(add the permission),
    "-(take away the permission), "r=(permission to read the file), "w=(permission
    to execute the file


    For this example, this will add the permission to the file junk to (=group+others):


    ```

    chmod +x junk

    ```


    This command will remove the permission to execute the file junk from others:


    ```

    chmod -x junk

    ```


    Also try her(inag_basics.html#filename) for more info.


    You can set the default permissions for the new files that you create using the
    command


    ```

    umask

    ```


    ```

    chown newowner filename

    chgrp newgroup filename

    ```


    Change the owner and group. You should use these two commands to create a copy
    for file by somebody else. Only the owner of a file can delete it.


    ```

    lsattr files

    ```


    List attributes for the file(s). Very often used the most interesting attributes
    are still not implemented. The attributes can be changed using the chattr command.
    The attributes are: a=(don''t update a time when the file is modified), S=(synchronous
    updates), a=(append only possible to this file), c=(file compressed on the kernel
    level, not implemented), d=(no dump), s=(secure deletion) and u=(undeletable,
    not implemented). An interesting usage may be to make a file undeletable even
    by root until she clears the attribute.


