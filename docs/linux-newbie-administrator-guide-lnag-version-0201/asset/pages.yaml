    # 5.5.8 Simple ftp server


    We do not recommend setting ftp servers other than on internal network, behind
    a firewall, and invisible from the outside world. FTP is insecure in that login
    information (the user name and password) travels in plain-text through the network
    and can be intercepted on an in-between server. Now, imagine a malicious individual
    accessing the server on your internet. Probably has a nice tool scanning all the
    passing-traffic for strings which normally company login activities. It automatically
    logs those after some time an impressive collection of user IDs and passwords
    to all kinds of places. Lets hope your important information does NOT fall into
    his possession. This administrator can also root your network and connect, and
    any other unencrypted communication, including emails, icq traffic, FTP is not
    alone in its lack of security.


    And there are retftp that use encryption for sending all the data over the network
    and use ssh whenever possible talking through the public internet. The encryption
    tools are also built into your web server, and it is important to pay attention
    to your sensitive data (login info, credit card billing, etc) is sent only to
    locations that support secure, encrypted connections.


    With your RedHat distribution (RH7.1), setting up an ftp server could be simpler-it
    just worked out of the box. This is how the ftp service was enabled on default
    in /etc/inetd.conf. Here is the relevant part of inetd.conf.


    ```

    ftp tcp /usr/sbin/tcpd in.ftpd -a

    telnet tcp /root root root /usr/sbin/tcpd in.telnet

    gopher tcp /root root root /usr/sbin/tcpd gn

