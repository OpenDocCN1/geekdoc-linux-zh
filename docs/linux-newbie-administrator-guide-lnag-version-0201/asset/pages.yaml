    Can I have a RAID of two or more (or other) inexpensive drives? RAID can be used
    for a "on-the-fly" mirroring of one drive to protect your data and keep your system
    functioning in case of a disk failure. Failure comes with a set of RAID tools
    that you can custom-ade RAID system to suit your particular needs.


    ```

    mkraid

    raid0 - starts up idle (superblock) RAID0/LINEAR arrays

    raidstart - command set to manage md devices

    raidstop - command to manage md devices

    raidtab - configuration file for md (RAID) devices

    ```


    RAID operates by joining two or more disks into a single logical device. There
    are several layers of RAID:


    RAID 0 ("striping") just joins two or more disks into a single logical device,
    without giving any redundancy. It is often used to join RAID 1 or RAID 5 layers.
    RAID 0 + 1 is called RAID 10. RAID 0 + 5 is called RAID 5.


    RAID 1 (mirroring) combines two disks, each with the same data, with one of the
    dedicated to parity. If any disk fails, the whole logical device remains available,
    but with degraded performance. It is not used very often because of the performance.


    RAID 5 combines three or more disks, with parity distributed across the disks.
    Functionality similar to RAID 4 about better performance.


    Try http://www.osfac.com/linux/softraid.htm for more information.


    RHEL has an option to set up software raid automatically during the initial operating
    system installation procedure. (The simple procedure) is outlined


    http://www.redhat.com/docs/manuals/linux/RHEL/7.2-Manual/custom-guide/software-raid.htm
    During RHEL installation, the "partition drive" :


