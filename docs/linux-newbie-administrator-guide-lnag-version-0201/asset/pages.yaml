  md: '# 5.3.2 How do setup video card, monitor and mouse for the X-server?


    This should be set-up during your Linux initial installation unless you skipped
    the step. To set it up now, you may try, as root, one of these text-mode configurators
    (as root):


    ```

    Xconfig

    XF86setup

    xconff

    ```


    Under RedHat, you can also run the command setup (as root) and accessconfig from
    there.

    To setup X-windows under Linux, you may need to know your hardware. You may want
    to dust your monitor to see what synchronization frequencies (vertical and horizontal)
    your monitor supports. The message when the computer boots may give you a clue
    about what type of video card you have and how much video memory. Also running
    these commands will likely provide helpful information:


    ```

    lspci

    ```


    Read the underneath manual to find out about the mouse type. Next time you may
    need a mouse, a 3-button "Linux-ready" Logitech or similar (Linux makes use of
    all three buttons). A standard (clone or not) mouse always make a good sense-i
    would never be an unusual mouse because it requires a driver or otherwise would
    be a installation/functional part.

    During testing of the X-server, if the screen goes blank, displays fully lines,
    or obviously does not function as desired, kill it with ctrl-<alt-B>Backspace
    and re-check your monitor sync frequencies. Running too high frequencies can be
    harmful to your monitor.


    If you have really problems, set up fine-tune later after you get some understanding
    of how things work on your system, a vga X first resolution (640x480 pixels, 16
    or 26 colours), or perhaps with the help of some nicer setup tools available under
    X.

    After setting up X, you can start it manually using:


    ```

    startx

    ```


    The "&" makes your command run in the background so that your text is not blocked.
    You could also use:

    init which will switch your system to runlevel 5, which means "the graphical user
    interface run level". To start X automatically (or, your choice) on the system
    reboot, read the next few paragraphs.


    # 5.3.3 Can I have a GUI prompt?


    To start your X-server automatically on the system start-up and display a graphical
    login prompt, you have to change (as root) one character in the file@etc/initabb.
    This file specifies something like:


    ```

    id:3:default

    Change it to

    id:5:default

    ```


    This sets up the default runlevel to 5, which is X-Windows. The meaning of the
    runlevels is explained in the sample /etc/initfile:


    +   - 0 halt (Do NOT set initfile to this)

    -1 Single user mode

    -2 Multiuser, without NFS (The same as 3, if you do not have networking)

    -3 Full multiuser mode

    -4 unused

    -5 X11

    -6 reboot (Do NOT set initfile to this)


    You can change the runlevel from the command line. E.g., this command (has to
    be executed as root):

    init 6'
