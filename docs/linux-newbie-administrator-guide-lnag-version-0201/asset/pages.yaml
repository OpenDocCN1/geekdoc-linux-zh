    ```


    A set of commands to manage disk quotas. Normally not used on a home computer.
    "Disk quota" means per-user limits on the usage of disk space. The commands (respectively)
    display the user quota, set the quota, turn the quota system on for the given
    files/hda in the above example), turn the quota system off, display quota statistics.
    "Typical" Linux drives have not seen on default: not for all users, and the quota
    system is off on all filesystems.


    ```

