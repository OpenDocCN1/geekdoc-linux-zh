    Mnemonics for common 8086 processor instructions:


    | Name Syntax | Comment |

    | --- | --- |

    | NOP | | Operation (do nothing). |

    | MOV | destination, source | Move (current, set)data. |

    | XCHG | operand1,operand2 | Exchange the data. |

    | CMP | operand1,operand2 | Compare the operands. |

    | PUSH | source | Push onto stack. (Place the value on stack and increment the
    stack) |

    | POP | pointer | Pop off stack. |

    | PUSH PUSH | Push all general-purpose registers. |

    | POP PUSH | Pop from stack (take the value from stack and decrement the stack)
    |

    | PUSH POFA | Pop flags. |

    | POP POPA | Pop all general-purpose registers. |

    | INC | operand | Increment (by 1). |

    | DEC | operand | Decrement (by 1). |

    | ADD | Dest,Source | Add. |

    | SUB | Dest,Source | Subtract. |

    | INT | number | Execute an interrupt. |

    | CALL | subroutine | Call a subroutine. |

    | RET | | Return from this (current, innermost) subroutine. |

    | JMP | destination | Jump to executing code at the address |

    | JE | destination | Jump if equal. |

    | JNE | destination | Jump if not equal. |

    | JZ | destination | Jump if zero. |

    | JNZ | destination | Jump if not zero |


