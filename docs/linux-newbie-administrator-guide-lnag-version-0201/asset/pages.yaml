    # 4.4.5 How do I write a simple shell script?


    Create a (ASCII) file which will contain the shell script. For example, I would
    use the pico to write a script that runs the pico tar with all the parameters
    necessary tocompress downloads from the Internet (I never seem to remember the
    tar options). I decided to call my script "untar":


    Since the file "untar" did not exist in my current directory, it was created by
    the pico text editor. Now, I type the name of my script:


    ```

    #!/bin/bash

    echo this is the file $0

    echo untaring the file $1

    # this calls tar with options -xvvf (extract,

    # version, through gzip, input filename)

    tar -xvvf

    ```


    The first line of the script, starting with "!" (called pound-bang), is special-it
    tell the shell program should interpret my script. For example, the script is
    to be interpreted by the shell bash/bash. The first line must start with | or
    my script will never run (the file will be interpreted as a text file). Other
    lines starting with | are for the author (me, readers of this) and are totally
    ignored by the computer.


    The $0, $1 ... $2 are the parameters passed to my script. For example, if I run
    a script called "myscript" with several parameters like:


    ```

    myscript a b c d e f g

    th$0 would be inside "myscript" as having the value "myscript$1 would have the
    value "a",

    $2 would be "b", $3 would be "c", etc.

    ```


    On the second and third line of my example script, the command echo on the screen
    everything that follows on that line, and $1 to the values of the parameters passed
    to the script. The fourth and fifth line contains a comment I wrote to myself
    to remind myself what I was trying to achieve, in case I ever had to modify my
    script. The last line performs the actual work.


    Once the script is written, I make the file executable for the file owner ("u=user"):


    ```

    chmod +x untar

    my script is ready to run like:

    untar.tar.gz

    ```


    A simple sequence of commands can also be typed into a text file and passed for
    shell execution using:


    ```

    source file

    [No need for the initial "pound bang" or executable permission.]

