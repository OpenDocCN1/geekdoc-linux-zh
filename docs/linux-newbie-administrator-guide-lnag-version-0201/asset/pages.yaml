  md: '# 4.1.2 What are the different directories for?


    Linux system is large and complex. It will vastly improve your skills if you familiarize
    yourself with it.


    Briefly, typical Linux contains five filesystems. These filesystems can reside
    on a single physical hard drives and/or hard partitions, depending on the size
    and need of your system. (A single filesystem can also be distributed between
    different physical devices, if needed.)


    The /root filesystems contain basic operating system and maintenance tools. The
    content of this filesystem should be preserved to start up the system and perform
    emergency maintenance and repairs if they were necessary.


    /usr contains all commands, libraries, documentation, and other files that do
    not change during normal operation. This will also contain major applications
    that come with your Linux distribution, example Netscape.


    /var contains files that change: spool directories, log files, lock files, temporary
    files, and formatted-as manual pages.


    /home contains files for users (users'' ownership, customization files, data,
    meta, caches, etc.). Each directory has the option to be preserved on an operating
    system upgrade.


    /proc contains entirely files. They don''t really exist on the disk and don''t
    take up any space (although ls -l will show their size). When viewing them, you
    really access information stored in the memory. It is used to access information
    about the system.


    The parts of the root filesystem are:


    +   /bin-executables (needed during boot) might be used by normal users.


    +   /sbin-executables (system binaries) not intended for general users (users
    may still use this, but directory is not on PATH)


    +   /etc-wide configuration files for your operating system.


    +   /root-home the directory of the system administrator (called super-user or
    root).


    +   /dev-devices. Access on Linux as so hardware is abstracted and it is easy
    to write to or read from.


    +   /mnt-mount points for removable media (Floppy, cd-rom, zidrive), partitions
    of other operating systems (s.e.g. MS Windows), network shares, and anything else
    that is mounted on the file system temporarily. It normally contains a separate
    subdirectory for each mounting share. The contents of these drives/shares in these
    subdirectories--there are no drives on Linux.


    +   /lib-libraries for programs that reside on the root filesystem and kernel
    modules.


    +   /boot-files used by the bootloader (LILO), the thing that loads when the computer
    is booted and gives you the option of which operating system to boot, if you have
    more than one OS (on your computer). It also contains the kernel (compressed,
    vmlinuz), which is also where LILO is configured to know where it.


    +   /opt-large applications


    +   /tmp-temporary files. This directory may clean itself automatically.


    +   /lost+found files recovered from the filesystem repair.


    The most interesting parts of the /usr filesystem are:


    +   /usr/X11R-X windows systems (version 11, release 6).


    +   /X11-the same as /usr/X11R (it is a symbolic link to /usr/X11R).


    +   /X11R6/bin-links of small Windows apps, and perhaps symbolic links to the
    executables of some large windows applications that reside in their own subdirectories
    elsewhere.


    +   /usr/share--Data input from your computer architecture, e.g., dictionaries.


    +   /usr/bin and /usr/sbin-similar to their equivalents in the root filesystem-bin
    and sbin), not needed for basic bootup (during emergency maintenance). Most commands
    will reside here.'
