  md: 'LINUX NETWORK ADMINISTRATOR GUIDE Version 0.201


    SOME ESSENTIAL LINUX APPLICATIONS


    +   Audio CDs do not contain a filesystem, they store "raw data". This means that
    you cannot mount an audio CD. Also, each track is written separately, as if it
    was a different "partition" on the CD.

    To read audio tracks from an audio CD and write them to files on your hard drive
    (typical format is *.raw or *.wav), you need a "cd ripper". A popular cd ripper
    is "cdparanoia".nIf cdparanoia is not installed, download it. The installation
    from source goes as follows (I use the autocompletion-tab shortcut when typing
    the following lines):

    ```

    cd ~/local

    tar -xvf /path/to_which_downloaded/cdparanoia-III-alpha9.6.src.tgz

    ls

    cd cdparanoia-III-alpha9.6

    ./configure

    make

    make install

    To rip the first track from an audio CD, I can use:

    cdparanoia 1

    which will put the first track from the CD into the wave file "cdda.wav" in the
    current directory.

    To rip tracks 1 to 2 from an audio CD to a "raw" file format, I can use:

    cdparanoia -p 8 "1-2"

    The option -B specifies using a "batch" mode, so that each track is put into a
    separate file

    "p" option specifies output in raw format. The files are named track1.cdraw and
    track2.cdraw.

    To rip all tracks from an audio CD, each track to a separate *.wav file, while
    forcing speed 4x, I can use:

    cdparanoia -s 4 -8 "1-"

    Make sure you have enough free space on your hard drive. You can use the space
    on your DOS partition if you have dual boot.


    +   To write audio files to CD-R(RW), I can use:

    cdrecord -speed=8 dev=0,0 -pad -audio track*

    Some audio CDs do not have gaps between individual audio tracks. The easiest way
    to make a copy of such an CD is to use the utility "cdraw".nTo copy a disk to
    the file "data.bin" (on my harddrive), and the table of contents to the file "toc-file.toc"
    I can use this command:

    cdraw -device dev=0,0 --buffers 64 --driver generic-mmc-raw --read toc-file.toc

    To rip the CD from the files I created, I can use:

    cdraw -device 0,0 --buffers 64 --driver generic-mmc-raw --speed 12 toc-file.toc

    Note on re-writable CDs. Some stereo will not play re-writable CDs because of
    the size of the pits on the CDs. For example, my home stereo (JVC) cannot read
    re-writable CDs (CD-RW) at all, although it would read write-once CDs (CD-RS).
    Therefore, re-writable CDs are much better to store data but not audio (I plan
    to play them exclusively on my computer).


    # 7.7.5 Creating mixed-mode CDs


    Mixed-mode CDs (using CDs that contain both data and audio, even game CDs) are
    not a problems, e.g.:


    +   - mount the data part of the mixed-mode CD

    mount -t iso9660 /dev/cdrom /mnt/cdrom

    - make an ISO filesystem from the data on the CD

    mkisofs -r -o cd_image /mnt/cdrom

    - unload the CD

    umount /mnt/cdrom

    rip the content of all audio tracks on the CD, except the first track since it
    is data


