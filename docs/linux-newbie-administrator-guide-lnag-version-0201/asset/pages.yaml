  md: '# 5.2.6 Mounting works when I am root. Can a normal user mount?


    You have to edit the file/etc/fstab root to give the normal users the permission
    to mount a particular drive. For example I can use the pico text editor to do:


    ```

    pico -w /etc/fstab

    ```


    The option "w" turns off the line marker.

    The contents is of my /etc/fstab


    ```

    /dev/hda2 / ext2 defaults 1 1

    /dev/hdc1 / home ext2 defaults 1 2

    /dev/hdc2 / usr ext2 defaults 1 2

    /dev/hdc4 / swap swap defaults 0 0

    /dev/floppy / floppy auto noauto,user,rw 0 0

