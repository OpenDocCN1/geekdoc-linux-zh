  md: '# 5.2 Accessing my drives


    # 5.2.1 Where are my drives?


    Linux shows all the directories in one directory tree, irrespective of what drives/hardware
    they are on. Generally, this is a much better solution than the traditional DOS/Windows
    model--completely abstracts the file system from the underlying hardware. You
    will appreciate this if you ever have to re-arrange or update your hardware or
    network resources. For the users who are accustomed to the DOS way of dealing
    with drives, it adds some extra complexity.


    To be brief, don''t search for drive letters. Many none under Linux; the content
    of your disks appears as subdirectories on your single Linux filesystem (directory
    tree). On default, the content of removable media does not automatically mount
    in these subdirectories--you may have to "mount" them. See the next answers for
    details. You should also mount a drive before entering the media.


    You can access (read and write) a variety of drives and file systems from your
    Linux. This includes native Linux partitions, DOS and MS partitions (on hard drives
    or floppies), ZIP and JAZ drives, and CDROM. Many common file systems are also
    supported. This means that you can download your Linux software using Netscape
    for Windows, save the downloaded file on your MS hard drive partition, and boot
    Linux and copy the downloaded software from the Windows partition on your harddrive
    to the Linux partition, and finally install the software under Linux.


    # 5.2.2 How can I access my CDROM?


    Mount it all the directories and files from your CD to your Linux directory tree
    you can easily access them without the drive letter.


    As root, you can mount the CDROM with a command like this:


    ```

    mount -auto /dev/cdrom /mnt/cdrom

    ```


    If this works, the content of your CD appears in the directory /mnt/cdrom. Changes
    this command will not work for you right away--you may have to customize it. Here
    is how it works:


    The command tells the operating system to a filesystem autodetecting the filesystem
    type ("-t" auto). The device is /dev/cdrom. The mountpoint (the directory to where
    "mounting" takes place) is /mnt/cdrom. This directory must exist and be empty.
    If it does not, create it with:


    ```

    mkdir /mnt/cdrom

    ```


    If the mounting fails, maybe the device /dev/cdrom does not exist on your system?
    ls -l /dev/cdrom

    /dev is just a symbolic link to a "real device" that is mapped onto your hard
