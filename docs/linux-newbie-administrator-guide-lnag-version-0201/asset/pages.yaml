    # 2.17 How do I crash Linux?


    As root, you can do whatever you want, including an accelerated system crash.
    Try this command, as root (reconsider if you really want to crash):


    ```

    cp /dev/zero /dev/null

    ```


    As root, you can erase all files on the system with a similarly innocuously looking-liner
    (don''t do it):


    ```

    rm -rf /

    ```


    This is not to say that Linux is easy to crash, but that the system administrator
    ("root") can make Windows unusable by crashing some files from C:\WINDOWS OR C:\WINDOWS\SYSTEM.
    Important distinctions are that Linux is resilient to that and administrative
    accounts are separated. Regular users can only touch the files they own, and simply
    the programs which users can only run user-owned accounts, no matter how big or
    malicious a program might be. The separation of "administrative" and "user" accounts
    adds to system complexity, yet it also the latest version of MS Windows, Microsoft
    moves more towards the UNIX approach. An old saying comes to mind: "who do not
    know UNIX are destined to re-invent it.\nConclusion: do not use the root (as root)
    for routine work. Add a regular-user account as your administrative task and use
    this account for your experimenting with Linux and regular work. Here is how to
    do it (as root):


    ```

    aduser johnjohn

    passed johnjohn


    [enter a long password with a name in the middle]

    exit:

    ```


    The root account is for administration and setup only. As root, I would not do/run
    programs that I do not exactly understand what they do. At least not on a computer
    that I use for real work. Really. I would definitely not browse the net root (that
    is an absolute security no-no).


