  md: '# Delete Files


    ```

    rm

    ```


    The rm command (short for remove) deletes files. It really, really removes them.
    They’re gone. There’s no trash can or recycle bin on the Linux command line. You’re
    walking a tightrope, baby, and if you fall you go splat!


    Okay, that’s a little extreme. It’s true that the shell lacks undelete command,
    but you’re not completely hosed if you delete a file. If you stop working on your
    machine the second you realize your mistake, if the operating system hasn’t overwritten
    the erased file’s sectors, and if you can successfully use some rather complicated
    file recovery software, yes, it’s possible to recover files. But it’s no fun,
    and you’ll be cursing the whole time. Better to be careful in the first place.


    > TIP: Many folks have tried to provide some sort of safety net for rm, ranging
    from remapping or replacing the rm command with a temporary trash (www.comwt.com/open_source/projects/trashcan/);
    to adding a trash onto the shell (http://pages.stern.nyu.edu/~mariaga/software/libtrash/);
    to creating a new command, trash, to replace rm (www.msunimelb.edu.au/~jrlooker/shell.
    #trash).


    If, on the other hand, you want to make possibly sure that no one can recover
    your deleted files, even men in black working for shadowy U.S. government agencies,
    use the shred command instead of rm. The shred command overwrites the file 25
    times so it is impossible to re-create it. Before using shred, however, read its
    man page, as its success rate is highly dependent on the type of filesystem you’re
    using.'
  merge: -1
