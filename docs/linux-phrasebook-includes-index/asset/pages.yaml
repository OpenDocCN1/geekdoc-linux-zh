  md: 'By default, top wants to use 15. If you''re happy with that, just press Enter;
    if not, enter the signal number you want to use and then press Enter. A second
    or so later, that process will disappear from top.


    To exit top, press q.


    The top command is incredibly useful, and you''ll find yourself turning to it
    often, just to find out what''s happening on your Linux machine. When you have
    questions about your computer''s activity, top often provides the answers.


    # List Open Files


    ```

    lsof

    ```


    Chapter 1,"Things to Know Your Command Line," discussed the fact that everything
    is a file to a Linux machine, including directories, network connections, and
    devices. That means that even though your perspective you only have one file open—a
    letter to your Mom—your system actually has thousands of files open at any one
    time. That''s right—thousands. To see the complete list of those open files, use
    the lsof command (short for list open files).


    Actually, don''t. If you just run lsof by itself (to get the full list of results,
    you need to be root), you''ll receive as output that list of thousands of files.
    On this system, there were 5,497 files open and being used. Still, lsof can be
    a useful way to get an idea of just how much is going on with your computer at
    any one time.


    Piping the output of lsof to 1less gives you the results one screen at a time.'
