    # Conclusion


    As you can tell, you can do a lot with find. There are

    still plenty of things that find can do, so you really

    should look at man find or read several of the excellent

    tutorials available on the World Wide Web that cover

    the more arcane—yet useful—aspects of the command.

    You can use find to search for and list files and folders

    using an amazing variety of options. It really becomes

    invaluable, however, when you use the -exec option to

    run commands on the discovered files, or when you

    pipe the output to other commands. This is one of the

    greatest commands available to you on your Linux box,

    so start using it!'
