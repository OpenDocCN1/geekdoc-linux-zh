  md: '# # Archiving and Compression


    Although the differences are sometimes made opaque in casual conversation, there
    is in fact a complete difference between archiving files and compressing them.
    Archiving means that you take 10 files and combine them into one file, with no
    difference in size. If you start with 10 100KB files and archive them, the resulting
    file is 1000KB. On the other hand, if you compress those 10 files, you might find
    that the resulting files range from only a few kilobytes to close to the original
    size of 100KB, depending upon the original file type.


    NOTE: In fact, you might end up with a bigger file during compression! If the
    file is already compressed, compressing it again adds extra overhead, resulting
    in a slightly bigger file.


    All of the archive and compression formats in this chapter—zip, gzip, bzip2, and
    tar—are popular, but zip is probably the the world''s most widely used format.
    That''s because of its almost universal use on Windows, but zip and unzip are
    well supported among all major (and most minor) operating systems, so things compressed'
  merge: -1
  pgno: 183
- img_proc: true
  md: 'using zip also work on Linux and Mac OS. If you''re sending archives out to
    users and you don''t know which operating systems they''re using, zip is a safe
    choice to make.


    gzip was designed as an open-source replacement for an older Unix program, compress.
    It''s found on virtually every Unix-based system in the world, including Linux
    and Mac OS X, but it is much less common on Windows. If you''re sending files
    back and forth to users of Unix-based machines, gzip is a safe choice.


    The bzip2 command is the new kid on the block. Designed to supersede gzip, bzip2
    creates smaller files, but at the cost of speed. That said, computers are so fast
    nowadays most users won'' notice much of a difference between the times it takes
    gzip or bzip2 to compress a group of files.


    > NOTE: *Linux Magazine* published a good article comparing several different
    compression formats, which you can find at http://www.linux-mag.com/content/view/1678/43/.


    zip, gzip, and bzip2 are focused on compression (although zip also archives).
    The tar command does one thing—archive—and it has been doing it for a long time.
    It''s found almost solely on Unix-based machines. You''ll definitely run into
    tar files (also called tarballs) if you download source code, but almost every
    Linux user can expect to encounter a tarball some time in his career.'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# # Archive and Compress Files Using zip


    zip


    zip both archives and compresses files, thus making it great for sending multiple
    files as email attachments, backing up items, or for saving disk space. Using
    it is simple. Let''s say you want to send a TIFF to someone via email. A TIFF
