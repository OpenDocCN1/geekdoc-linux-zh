  md: '# CHAPTER 16 Windows Networking


    ```

    $ ls -l /usr/bin/smbount

    -rwxr-xr-x 1 root root /usr/bin/smbount

    $ sudo chmod +s /usr/bin/smbount

    $ ls -l /usr/bin/smbount

    -rwsrxr-x 1 root root /usr/bin/smbount

    ```


    Now the user that mounted eliot_documents—and only that that user—can unmount
    eliot_documents. Root can unmount it, too, because root can do whatever it wants.


    $ smbount eliot_documents


    And that''s it. If you want to verify that smbount worked, try ls eliot_documents,
    and there shouldn''t be anything in there. You''re disconnected from Samba share.


    # Conclusion


    Much as Linux users would like to pretend that Microsoft doesn''t exist, you have
    to realize that (for now) you live in a Windows world. Samba makes coexistence
    that much easier because it allows Linux users to access resources on Windows
    machines, and even makes resources available on a Linux box to users of other
    operating systems. Microsoft might not like it very much, but Samba is a mature,
    stable, powerful technology, and thanks to its open-source nature, it has helped
    bring the entire world of computing more closely together. Samba helps you reduce
    the need for Windows servers in homes and businesses, and that, as a certain doyenne
    might say, is a good thing.'
