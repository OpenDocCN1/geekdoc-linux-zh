    In Chapter 5, “Viewing Files,” you learned about cat, which outputs files to STDOUT.The
    “Concatenate Files and Number Lines” section mentioned a better cat, known as
    dog (which is true because dogs are better than cats). If you invoke dog with
    the --links option and point it at URL, the links are pulled out of the page and
    displayed on STDOUT.You pipe those links to grep, asking grep to filter out all
    lines containing mp3, and then redirect the resulting MP3 to a text file named
    beasts (piping and redirecting are covered in Chapter 4, “Building Blocks,” and
    the grep command is covered in Chapter 9, “Finding Stuff: Easy”).


    The semicolon (covered in the “Run Commands Sequentially” section in Chapter 4)
    ends that command and starts a new one: wget. The -i (or --input-file) option
    tells wget to look in a file for the URLs to download, instead of STDIN. If you
    have many links, put them all in a file and use the -i option'
  merge: -1
  pgno: 366
- img_proc: true
  md: 'with wget. In this case, you point wget to the beasts file you just created
    via dog and grep, and the MP3s begin to download, one after the other.


    Now really, what could be easier? Ah, the power of the Linux command line!


    # Download Websites Non-interactively


    If you want to back up your website or download another website, look to wget.
    In the previous section you used wget to grab individual files, but you can use
    it to obtain entire sites as well.


    NOTE: Please be reasonable with wget. Don''t download enormous sites, and keep
    in mind that someone creates and owns the sites that you''re copying. Don''t copy
    a site because you want to "steal" it.


    Let''s say you''re buzzing around a site at www.neato.com and find yourself at
    www.neato.com/articles/index.htm. You''d like to copy everything in /articles
    section, but you don''t want anything else on the site. The following command
    does what you''d like:


    ```

    $ wget -E -r -k -p -w 5 -np

    http://www.neato.com/articles/index.htm

    ```


    You could have combined the options this way, as well:


    ```

    $ wget -Erkp -w 5 -np

    http://www.neato.com/articles/index.htm

    ```'
  merge: -1
  pgno: 367
- img_proc: true
  md: '# CHAPTER 15 Working on the Network


    As in the previous section, the command begins with wget and ends with the URL
    you want to use. You looked at the -w (or --wait=[#]) option before, and that''s
    the same, well as -np (or --no-parent) and -r (or --recursive). Let''s examine
    the new options that have been introduced in this example.


    When you download a site, some of the pages might not end with .htm or .html;
    instead, they might end with .asp, .php, .cfm, or something else.The problem comes
    in if you try to view the downloaded site on your computer. If you''re running
    a web server on your desktop, things might look just fine, but more likely you''re
    not running Apache on your desktop. Even without a web server, pages ending in
    .htm or .html will work on your box if you open them with a web browser. If you
    use the -E (or --html-extension) option, wget converts every page so that it ends
    with .html, enabling you to view them on your computer without any special software.


    Downloading a site might introduce other issues, however, which you can fortunately
    get around with the right wget options. Links on the pages you download with wget
    might not work after you open the pages on your computer, making it impossible
    to navigate from page to page. By specifying the -k (or --convert-links) option,
    you order wget to rewrite links in the pages they work on your computer. This
    option fixes not only links to pages, but also links to pictures, Cascading Style
    Sheets, and files. You''ll be glad you used it.


    Speaking of Cascading Style Sheets (CSS) and images, they''re why you want to
    use the -p (or --page-requisites) option. In order for the web page to display
    correctly, the web developer might have specified images, CSS, and JavaScript
    files to be used'
  merge: -1
  pgno: 368
- img_proc: true
  md: '# Download Sequential Files and Internet Resources


    along with the page''s HTML. The -p option requires that wget download any files
    needed to display the web pages that you''re grabbing. With it, looking at the
    page it''s on your machine duplicates what you saw on the Web; without it, you
    might end up with an unreadable file.


    The man page for wget is enormously long and detailed, and it''s where you will
    ultimately end up if you want to use wget in a more sophisticated way. If you
    think wget sounds interesting to you, start reading. You''ll learn a lot.


    # Download Sequential Files and Internet Resources


    ```

    curl

    ```


    At first blush, wget and curl seem similar: Both download files non-interactively.
    They each have one large difference that to download, however, among many smaller
    ones: curl supports sequences and sets in specifying what to download, wget does
    not, while wget supports recursion, a feature missing from curl.


    NOTE: The programs have plenty of other differences. The full list of curl''s
    features can be seen at “Features—What Can curl Do” (http://curl.haxx.se/docs/features.html),
    while some of wget''s are listed at “Overview” (www.gnu.org/software/wget/manual/html_node/Overview.html#Overview).
    The curl site has a chart comparing curl to other, similar programs at “Compare
    curl Features with Other FTP+HTTP Tools” (http://curl.haxx.se/docs/comparison-table.html);
    while informative, the chart is (unsurprisingly) a bit biased toward curl.'
  merge: -1
  pgno: 369
- img_proc: true
  md: '# CHAPTER 15 Working on the Network


    Here''s an example that uses curl''s capability to support sequences in specifying
    what to download. The excellent National Public Radio show *This American Life*
    makes archives of all of its shows available for download on its parent website
    in Real Audio format (why they chose Real and not a more open format is a mystery).
    If you want to download 10 of these Real Audio files, just use the following:


    ```

    curl -O http://www.wbez.org/ta/[1-10].rm

    [1/10]: http://www.wbez.org/ta/1.rm --_curl_--http://www.wbez.org/ta/1.rm

    ```


    Notice how you used [1-10] to specify that you wanted to download 1.rm, 2.rm,
    3.rm, and so on. If WBEZ had instead named the files one.rm, two.rm, and three.rm,
    for example, you could have used a part set instead:


    ```

    curl -O http://www.wbez.org/ta/{one,two,three}.rm

    ```


    The -0 (or --remote-name) option is absolutely required. If you don''t use it,
    curl writes the output of the download to STDOUT, which means that your terminal
    will quickly fill with unusable goobedygook. The -0 asks curl to write out what
    it downloads to a file, and to use the name of the file being downloaded as the
    local filename as well.


    We''ve barely scratched the surface of curl. Its man page, while not as long as
    wget''s, is also full of useful information that you need to read if you''re going
    to maximize your use of curl. Consider it required reading.'
  merge: -1
