- img_proc: true
  md: '# Things to Know About Your Command Line


    Before you really dig in to your bash shell, you first need to understand a few
    things that will help you as you proceed throughout this book. These are absolutes
    that you just gotta know, and, trickily, some of them are not obvious at all.
    But after you understand them, some of the ways in which your shell behaves will
    start making much more sense.


    # Everything Is a File


    On a Linux system, everything is a file—everything, which may seem obvious at
    first. Of course a text document is a file, and so is an OpenOffice.org document,
    and don''t forget a picture, an MP3, and a video. Of course!


    But what about a directory? It''s a file, too—a special kind of file that contains
    information about other files. Disk drives are really big files. Network connections
    are files. Even running processes are files. It''s all files.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# CHAPTER 1 Things to Know About Your Command Line


    To Linux, a file is just a stream of bits and bytes. Linux doesn''t care what
    those bits and bytes form; instead, the programs running on Linux care. To Linux,
    a text document and a network connection are both files; your text editor that
    knows how to work with the text document, and your Internet applications that
    recognize the network connection.


    Throughout this book I''m going to refer to files. If it''s appropriate, feel
    free to read that as “files and directories and subdirectories and everything
    else on the system.” In particular, many of the commands I''ll cover work equally
    well on documents and directories, so feel free to try out the examples on both.


    # Maximum Filename Lengths


    People who can look back to using MS-DOS (shader!) remember that filenames could
    be no longer than eight characters, plus a three-letter extension, giving you
    incredibly descriptive names such as MRSUME1.DOC. Pre–OS X Macs, on the other
    hand, extended that limit to 31 characters, which might sound long but could produce
    odd-looking names.


    Linux (and Unix) filenames can be up to 255 characters in length. That''s an outrageous
    length for a filename, and if you''re getting anywhere close to that, your picture
    should appear next to verbose in the dictionary. You''re given up to 255 characters,
    so feel free to be descriptive and accurate, but don''t go nuts.


    In fact, it''s a good idea to keep filenames below 80 characters because that''s
    the width of your average terminal and your filenames will appear on one line
    without wrapping. But that''s just advice, not a requirement.'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'The freedom to describe a file in 200+ characters is yours; just use it wisely.


    # Names Are Case-Sensitive


    Unlike Windows and Mac OS machines, Linux boxes are case-sensitive when it comes
    to filenames. You could find the three following files in the same directory on
    a computer running Linux:


    +   - bookstobuy.txt

    - BooksToBuy.txt

    - BoOkStObuy.txt


    To the Linux filesystem, those three completely different files. If you were on
    Windows or Mac OS, however, you would be asked to rename or cancel your attempt
    to add BooksToBuy.txt to a directory that already contained bookstobuy.txt.


    Case-sensitivity also means that commands and filenames must be entered exactly
    to match their real command names or filenames. If you want to delete files by
    running rm, you can''t type in RM or Rm or rM rm is it. And if you want to delete
    bookstobuy.txt and you instead enter rm BooksToBuy.txt, you just removed the wrong
    file or no file at all.


    The lesson is twofold: Linux forces you to be precise, but precision is a good
    thing. At the same time, you''re given a degree of flexibility that you won''t
    find in other operating systems. That combination of required precision and flexibility
    is one of the things that makes Linux fun to use, yet understandably confusing
    for new users.'
