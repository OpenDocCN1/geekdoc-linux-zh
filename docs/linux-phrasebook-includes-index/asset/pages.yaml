    ```


    Making copies of files is one of those things that computer users, no matter the
    OS, find themselves doing all the time. One of the most venerable commands used
    by the Linux shell is cp, which copies files and directories. The easiest way
    to use cp is simply to type in the command, followed by the file you''re wanting
    to copy, and then the copied file''s new name; think of the command''s structure
    as “cp file-you''re-copying-from file-you''re-copying-to.” Another common way
    to express that relationship is “cp source target.”'
