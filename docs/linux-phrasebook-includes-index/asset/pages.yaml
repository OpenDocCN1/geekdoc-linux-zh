    # Make a Network Connection Active


    ifup


    You actually use the ifup command all the time without realizing it. When you
    boot your computer to find that you''re successfully connected to the Internet,
    you can thank ifup. If you plug in an Ethernet cable to the port on the back of
    your Linux box, and a few seconds later you''re able to get email again, it''s
    ifup that did the heavy lifting. In essence, ifup runs when it detects a network
    event, such as a reboot or a cable plugged in, and then executes the instructions
    found in your network interface configuration files (if you''re curious, a note
    in the preceding section discussed the names and locations of those files).


    Sometimes, though, you might experience networking problems and need to run ifup
