- img_proc: true
  md: '# Change Permissions on Files and Directories Using Alphabetic Notation


    ```

    $ ls -l

    -rw-r--r-- 1 scott family ... libby.jpg

    $ chmod go+w libby.jpg

    $ ls -l

    -rw-rw-rw- 1 scott family ... libby.jpg

    ```


    Of course, because you''re really giving all users—the owner, the group, and the
    world—read and write access, you could have just done it like this:


    ```

    $ ls -l

    -rw-r--r-- 1 scott family ... libby.jpg

    $ chmod a=rw libby.jpg

    $ ls -l

    -rw-rw-rw- 1 scott family ... libby.jpg

    ```


    You realize you made a mistake, and need to remove the capability of the family
    group and the world to alter that picture, and also ensure that the world can''t
    even see the picture.


    ```

    $ ls -l

    -rw-rw-rw- 1 scott family ... libby.jpg

    $ chmod go-w libby.jpg

    $ ls -l

    -rw-r--r-- 1 scott family ... libby.jpg

    $ chmod o-r libby.jpg

    $ ls -l

    -rw-r----- - 1 scott family ... libby.jpg

    ```


    Instead of the -, you could have used the =


    ```

    $ ls -l

    -rw-rw-rw- 1 scott family ... libby.jpg

    $ chmod g=r libby.jpg

    $ ls -l

    ```'
  merge: -1
  pgno: 165
- img_proc: true
  md: '```

    -rw-rw-- 1 scott family ... libby.jpg

    $ chmod o= libby.jpg

    $ ls -l

    -rw------- 1 scott family ... libby.jpg

    ```


    Notice on the last chmod that equaled nothing, effectively removing all permissions
    for all other users on the system. Now that''s fast and efficient!


    The advantage to the alphabetical system is that it''s often fast, but you can
    also see its main disadvantage in the last example: If you want to make changes
    to two or more user groups and those changes are different for each user group,
    you end up running chmod at least two times. The next section shows how numeric
    permissions get around that problem.


    # Change Permissions on Files and Directories Using Numeric Permissions


    ```

    chmod [0-7][0-7][0-7]

    ```


    Numeric permissions (also known as octal permissions) are built around the binary
    numeric system. We''re going to skip the complicated reasons why the permissions
    have certain numbers and focus on the end meaning: read (r) has a value of 4,
    write (w) is 2, and execute (x) is 1. Remember that Linux permissions recognize
    three user groups—the owner, the group, and the world—and each user group can
    read, write, and execute. (See Table 7.3.)'
  merge: -1
  pgno: 166
- img_proc: true
  md: '# Change Permissions on Files and Directories Using Numeric Permissions


    Table 7.3 Permissions and Numeric Representations


    | Owner | Group | World |

    |---|---|---||

    | Permissions | r; w; x | r; w; x | r; w; x |

    | Numeric representation | 4; 2; 1 | 4; 2; 1 | 4; 2; 1 |


    Permissions under this schema become a matter of simple addition. Here are a few
    examples:


    +   - A user has read and write permissions for a file or directory. Read is 4,
    write is 2, and execute is 0 (because it’s not granted). 4 + 2 + 0 = 6.


    +   - A user has read and execute permissions for a file. Read is 4, write is
    0 (because permission hasn’t been granted), and execute is 1. 4 + 0 + 1 = 5.


    +   - A user has read, write, and execute permissions for a directory. Read is
    4, write is 2, and execute is 1. 4 + 2 + 1 = 7.


    Under this method, the most user group can have 7 (read, write, and execute),
    and the least is 0 (cannot read, write, or execute). Because there are three user
    groups, each between 0 and 7, and each representing what permissions that user
    group has associated with it. Table 7.4 shows the possible numbers and what they
    mean.


    Table 7.4 Numeric Permissions Represented with ls -1


    | Number | 1s | -1 Representation |

    |---|---|---|n| 0 | | --- |

    | 1 | | --x |

    | 2 | | -w- |

    | 3 | | -wx |

    | 4 | | r-- |'
  merge: -1
  pgno: 167
- img_proc: true
  md: '# CHAPTER 7 Ownerships and Permissions


    Table 7.4 continued


    | Number | 1s -l Representation |

    |---|--|

    | 5 | r-x |

    | 6 | rw- |

    | 7 | rwx |


    Although a wide variety of permissions can be set, a few tend to reappear constantly.
    Table 7.5 shows the common permissions and what they mean.


    Table 7.5 Common Permissions Represented with 1s -l


    | chmod Command | 1s -l Representation | Meaning |

    |---|---|---|

    | chmod 400 | -r-------- | Owner can read; no one else can do anything |

    | chmod 644 | -rw-r--r-- | Everyone can read; only owner can edit |

    | chmod 660 | -rw-rw---- | Owner and group can read and edit; world can do nothing
    |

    | chmod 664 | -rw-rw-r-- | Everyone can read; owner and group can edit |

    | chmod 700 | -rwx------ | Owner can read, write, and execute; no one else can
    do anything |

    | chmod 744 | -rxr-r---- | Everyone can read; only owner can edit and execute
    |

    | chmod 755 | -rwx-xr-x | Everyone can read and execute; only owner can edit |

    | chmod 777 | -rwxwxrwx | Everyone can read, edit, and execute (not usually a
    good idea). |'
