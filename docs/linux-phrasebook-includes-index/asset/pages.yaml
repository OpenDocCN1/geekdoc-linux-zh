    # Display Information About System RAM


    Nowadays most computers come with hundreds of megabytes or even gigabytes of RAM,
    but it''s still to find your machine slowing down due to a lot of memory usage
    or virtual memory swapping. To see the current state of your system''s memory,
    use the free command.'
