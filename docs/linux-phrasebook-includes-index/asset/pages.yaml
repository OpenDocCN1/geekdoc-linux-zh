  md: '# CHAPTER 4 Building Blocks


    What if you fat finger your command, and instead type this:


    ```

    $ unzip /home/scott/JohnColtrane.zip ;

    mkdir -p /home/scott/music/coltrane

    mv /home/scott/music/JohnColtrane*.mp3

    ~/home/scott/music/coltrane/

    rm /home/scott/music/JohnColtrane.zip

    ```


    Instead of unzip /home/scott/JohnColtrane.zip, you accidentally enter unzip /home/scott/JohnColtrane.zip.
    You fail to notice this, so you go ahead and press Enter, and then get up and
    walk away. Your computer can''t unzip /home/scott/JohnColtrane.zip because file
    does not exist, so it blithe continues onward to the next command (mkdir), which
    it performs without a problem. However, the third command can''t be performed
    (mv) because there aren''t MP3 files to move because unzip didn''t work. Finally,
    the fourth command runs, deleting the zip file (notice that you provided the correct
    path this time) and leaving you with no way to recover and start over. Oops!


    NOTE: Don''t believe that this chain of events can happen? I did something very
    similar to it just a few days ago. Yes, I felt like an idiot.


    That''s the problem with using ;;commands run in sequence, regardless of their
    successful completion. A better method is to separate the commands with &&, which
    also runs each command one after the other, but only if the previous one completes
    successfully (technically, each command must return an exit status of 0 for the
    next one to run). If a command fails, the entire chain of commands stops.'
