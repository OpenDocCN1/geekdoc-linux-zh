  md: '# CHAPTER 16 Windows Networking


    That leaves you with credentials=/home/scott/credentials_eliot.This tells smbount
    that the username and password are stored in a file, in this format:


    ```

    username = scott

    password = 123456

    ```


    This is just like the credentials file discussed previously in “Access Samba Resources
    with an FTP-Like Client,” and as in that example, use chmod after you create a
    credentials file to tightly limit who can view that file. If you don''t care about
    automating the logon process, by all means, use username=scott and get prompted
    to enter the password, which is certainly the safest option.


    The fmask and dmask options respectively control the default permissions for any
    new files and directories that you create in the mounted Samba share. 644 would
    produce rw-r--r-- for files, while 755 would end up rwxr-xr-x for directories.


    NOTE: Don''t recall what we''re talking about? Take a look back at “Understand
    the Basics of Permissions” in Chapter 7.


    Remember that all usernames and group names are really references to numbers,
    which you can see in /etc/passwd and /etc/group, respectively.Your user ID number
    on your current machine might be 1000, but on the Samba server, 1000 could be
    a completely different user, with the same problem for your group ID.With uid=1001
    and gid=1001, you tell the Samba server who you are on the Samba server. In other
    words, you need to look those numbers up in /etc/passwd and /etc/group on the
    Samba server, not on your local machine. If you don''t, you may find'
  merge: -1
