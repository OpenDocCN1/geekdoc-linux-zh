  md: '# Run a Previous Command Using a String


    The capability to run a command again by referencing its number is nice, but it
    requires that you know the command''s number in history, which can be tedious
    to discover (piping the output of history to grep would help, but it''s still
    not optimal). Often a better way to reference a previously entered command is
    by the actual command''s name. If you follow the exclamation point by the first
    few letters of command, your shell runs the first command it finds when looking
    backward in .bash_history.


    ```

    $ cat /home/scott/todo

    Buy milk

    Buy dog food

    Renew Linux Magazine subscription

    $ cd /home/scott/pictures

    $ !cat

    cat /home/scott/todo

    Buy milk

    Buy dog food

    Renew Linux Magazine subscription

    ```


    The cat command is found three times in your history—at 35 (cat /home/scott/todo),
    412 (cat /etc/apt/sources.list), and 496 (cat /home/scott/todo)—and you enter
    !cat, the one found at 496 is the one that runs. If you want to run the cat found
    at 412, you need to run either !412 or follow the exclamation mark with enough
    information so it can tell you''re referencing the command listed as 412.'
