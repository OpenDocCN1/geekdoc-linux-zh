    The Domain Name System (DNS) was created to make it easier for humans to access
    resources on the Internet. Computers work beautifully with numbers—after all,
    everything a computer does is really a number—but humans can remember and process
    words much more efficiently. A website might be located at 72.14.203.99, but it
    would be hard for most people to remember that. Instead, it''s much easier to
    keep in memory that you want to go to www.google.com. DNS is basically a giant
    database that keeps track of the relationship between 72.14.203.99 and www.google.com,
    and millions of other IP addresses and domain names as well.


    > TIP: DNS is a large, complicated, and fascinating topic. For more details, see
    Wikipedia''s "Domain Name System" (http://en.wikipedia.org/wiki/Dns) easy to start,
    and then jump into Paul Albitz and Cricket Liu''s seminal DNS and BIND.


    To quickly find the IP address associated with a domain name, use the host command:


    ```

    $ host www.granneman.com

    www.granneman.com is an alias for granneman.com.

    granneman.com has address 216.23.180.5

    www.granneman.com is an alias for granneman.com.

    www.granneman.com is an alias for granneman.com.

    granneman.com mail is handled by 30 bhoth.pair.com.

    ```


    There are five responses because host performs several types of DNS lookups. It
    is, however, to see what'
