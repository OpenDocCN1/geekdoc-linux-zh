  md: '# Conclusion


    Virtually every command you''ve looked at in this chapter has GUIs. But if your
    system is non-responsive, if you''re connecting to a machine via SSH (covered
    in Chapter 15) and can''t use a GUI, or if you just want to use the command line.
    The commands in this chapter are easy to remember, thanks to well-chosen names:


    +   - ps (view running processes)

    - kill (kill processes)

    - top (top listing of running processes)

    - lsof (list [ls] open files)

    - free (free, or available, memory)

    - df (disk free space)

    - du (disk usage)


    Practice with them on your computer, and don''t forget to read the man pages for
    each one because this chapter could only cover a fraction of their capabilities.
    There are many options to several of them—in particular, ps, top, and lsof—that
    allow you to do some truly amazing detective work on the computers under your
    watch.'
