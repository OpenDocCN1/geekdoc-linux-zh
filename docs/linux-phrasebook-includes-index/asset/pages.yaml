    $ tar -cf moby.tar moby-dick/

    $ 1 ls -IF

    scott scott 168 moby-dick/

    scott scott 2170880 moby-tar

    ```


    The command has been around forever, and it’s obvious why: It’s so darn useful!
    But it gets even more useful when you start factoring in compression tools, as
