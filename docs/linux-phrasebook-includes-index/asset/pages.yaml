    # Grab a New Address Using DHCP


    ```

    dhclient

    ```


    Most home networks and many business networks use the Dynamic Host Control Protocol
    (DHCP) to parcel out IP addresses and other key information about the network
    to new machines joining it. Without DHCP, any new machine must have all of its
    networking information hard-coded in; with DHCP, a new machine simply plugs into
    the network, asks the DHCP server to provide it with an IP address and other necessary
    items, and then automatically incorporates the DHCP server''s reply into its networking
    configurations.


    NOTE: The following discussion assumes that you''ve already configured your network
    device to use DHCP instead of hard-coded settings. Various Linux distributions
    expect information to be found in different configuration files. Debian-based
    distributions look for the line interface [interface] inet dhcp in /etc/network/interfaces.
    Red Hat-derived distributions instead want to see BOPROTO=dhcp in /etc/sysconfig/network-scripts/ifcfg-[interface].
    In these examples, substitute [interface] with the name of your interface. For
    more foramtion, search Google for "dhcp your-distro."


    Sometimes your machine can''t connect at boot to the DHCP server, so you need
    to manually initiate the'
