  md: '# Mount a Samba Filesystem


    | Table 16.1 | Continued |

    |---|---|

    | Command | Meaning |

    | mkdir | Create a new directory on the Samba server |

    | mput | Copy all files matching a pattern to the Samba server |

    | put | Copy the specified file to the Samba server |

    | rm | Remove the specified file from the Samba server |


    You can view other commands by simply typing **help** after you''ve logged in
    to the Samba server, but Table 16.1 contains the basics. When you''re finished,
    simply type **exit**, and you log out of the server and are back on your own machine.


    # Mount a Samba Filesystem


    ```

    smbmount

    sbmumount

    ```


    It''s cool that you can use `smbclient` to access Samba shares, but it''s also
    a pain if you want to use a GUI, or if you want to do a lot of work on the share.
    In those cases, you should use `smbmount`, which mounts the Samba share to your
    local filesystem as though it was part of your hard drive. After it''s mounted,
    you can open your favorite file manager and access files on the share easily,
    and you can even open programs such as word processors and open the files directly
    with a minimum of fuss.


    To mount a Samba share on your filesystem, you must create a mount point onto
    which Linux will graft the share. For instance, if you were going to mount the'
  merge: -1
