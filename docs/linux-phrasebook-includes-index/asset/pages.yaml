- img_proc: true
  md: '# # Keep Track of Changes Made to a File''s Group with chgrp


    ```

    chgrp -v

    chgrp -c

    ```


    You''ve probably noticed that chgrp, like all well-behaved Linux applications,
    only gives you feedback if there''s a problem. If a program works and does its
    job correctly, it doesn''t bother you with "Hey! I did it, and it worked!" Instead,
    Linux command-line applications are only noisy when an issue needs to be resolved.


    If you want to know what chgrp is doing while it''s doing, first try the -v (or
    --verbose) option. This tells you, every step of the way, just what tasks chgrp
    performs.


    ```

    $ ls -lF

    drwxr-xr-x 4 scott ... by_pool/

    -rw-r--r-- 1 scott ... libby_arrowrock.jpg

    -rw-r--r-- 1 family ... libby.jpg

    -rw-r--r-- 1 scott ... libby_on_couch.jpg

    drwxr-xr-x 2 scott ... on_floor/

    $ chgrp -v family *

    changed group of ''by_pool'' to family

    changed group of ''libby_arrowrock.jpg'' to family

    group of ''libby.jpg'' retained as family

    changed group of ''libby_on_couch.jpg'' to family

    changed group of ''on_floor'' to family

    $ ls -lF

    drwxr-xr-x 4 family ... by_pool/

    -rw-r--r-- 1 family ... libby_arrowrock.jpg

    -rw-r--r-- 1 family ... libby.jpg

    -rw-r--r-- 1 family ... libby_on_couch.jpg

    drwxr-xr-x 2 family ... on_floor/

    ```'
  merge: -1
