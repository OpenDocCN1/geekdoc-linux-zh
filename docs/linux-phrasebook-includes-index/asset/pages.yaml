- img_proc: true
  md: '# Archive Files with tar


    ```

    -cf

    ```


    Remember, tar doesn''t compress; it merely archives (the resulting archives are
    known as tarballs, by the way). Instead, tar uses other programs, such as gzip
    or bzip2, to compress the archives that tar creates. Even if you''re not going
    to compress the tarball, you still create the same way with the same basic options:
    -c (or --create), which tells tar you''re making a tarball, and -f (or --file),
    which is the specified filename for the tarball.


    ```

    $ ls -1

    scott scott 1025194 job.txt

    scott scott 1236574 moby-dick.txt

    scott scott 508925 paradise_lost.txt

    $ tar -cf moby.tar *.txt

    $ ls -1

    scott scott 1025194 job.txt

    scott scott 1236574 moby-dick.txt

    scott scott 1853440 moby.tar

    scott scott 508925 paradise_lost.txt

    ```


    Pay attention to two things here. First, add up the file sizes of job.txt, moby-dick.txt,
    and paradise_lost.txt, and you get 1848018 bytes. Compare that to the size of
    moby.tar, and you see the tarball is only 5422 bytes bigger. Remember that tar
    is an archive tool, not a compression tool, so the result is at least the size
    as the individual files put together, plus a little bit for overhead to keep track
    of what''s in the tarball. Second, notice that tar, unlike gzip or bzip2, leaves
    the original files behind. This isn''t a surprise, considering the tar command''s
    background as a backup tool.'
