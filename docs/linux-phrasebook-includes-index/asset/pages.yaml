- img_proc: true
  md: '```

    $ chmod g-s bin

    $ ls -F

    drwxr-xr-x 11 scott admins ... bin/

    ```


    If you haven''t already read the previous section, “Set and Then Clear suid,”
    go back and do so, as it explains the otherwise mysterious fourth digit appears
    just before the number representing the owner’s permissions. In the case of suid,
    that number is 4; for sgid, it’s 2.


    ```

    $ ls -F

    drwxr-xr-x 11 scott admins ... bin/

    $ chmod 2755 bin

    $ ls -F

    drwxr-Sr-x 11 scott admins ... bin/

    ```


    You remove sgid the same way you remove suid: with a 0 at the beginning, which
    takes sgid out of the picture.


    ```

    $ ls -F

    drwxr-Sr-x 11 scott admins ... bin/

    $ chmod 0755 bin

    $ ls -F

    drwxr-xr-x 11 scott admins ... bin/

    ```


    NOTE: You know what creating a new file in a sgid directory will do, but be aware
    that other file system processes can also be affected by sgid. If you copy a file
    with cp into the sgid directory, it acquires the group of that directory. If you
    move a file with mv into the sgid directory, however, it keeps its current group
    ownership and does not acquire that of the directory’s group. Finally, if you
    create a new directory inside the sgid directory using mkdir, it not only inherits
    the group that owns the sgid directory, but also becomes sgid itself.'
