  md: '# Run Commands Only If The Previous Ones Succeed


    If you''d used && instead of ; in the sequence of previous commands, it would
    have looked like this:


    ```

    $ unzip /home/scott/JohnColtrane.zip &&

    mkdir -p /home/scott/music/coltrane &&

    mv /home/scott/music/JohnColtrane. *mp3

    /home/scott/music/coltrane/ &&

    rm /home/scott/music/JohnColtrane.zip

    ```


    Because the first unzip command couldn''t complete successfully, the entire process
    stops. You walk back later to find that your series of commands failed, JohnColtrane.zip
    exists, so you can try once again. Much better!


    Here are two more examples that show you just how useful && can be. In Chapter
    13, "Installing Software," you''re going to learn about apt, a fantastic way to
    upgrade your Debian-based Linux box. When you use apt, you first update the list
    of available software, and then find out if there are any upgrades available.
    If the list of software doesn''t be updated, you obviously don''t want to bother
    looking for upgrades. To make sure the second process doesn''t (uselessly) occur,
    separate the commands with &&:


    # apt-get update && apt-get upgrade


    Example two:You want to convert a PostScript file to a PDF using the ps2pdf command,
