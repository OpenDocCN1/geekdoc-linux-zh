    # Conclusion


    Back in the days of slow modems and tiny hard drives,

    archiving and compression was a necessity. These days,

    it''s more of a convenience, but it''s still something you''ll

    find yourself using all the time. For instance, if you ever

    you''ll find yourself face-to-face with a file such as

