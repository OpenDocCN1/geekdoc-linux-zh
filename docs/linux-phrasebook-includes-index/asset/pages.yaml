  md: '# Find Out About Commands with man 69


    As stated before, using this command isn''t hard. Just enter man, followed by
    the command about which you want to learn more.


    ```

    $ man ls

    (1) User Commands LS(1)

    NAME - list directory contents

    SYNOPSIS

    ls [OPTION]... [FILE]...

    DESCRIPTION

    List information about the FILEs (the current directory by default).

    Sort entries alphabetically if none of -cftUSX

    nor--sort.

    Mandatory arguments to long options are mandatory

    for short options too.

    -a, --all

    do not hide entries starting with .

    -A, --almost-all

    do not list implied . and ..n[Listing condensed due to length]

    ```


    The list of data man provides in this case is quite extensive—over 200 words worth,
    in fact. Of course, all commands provide that much, and some provide far more.
    Your job is to read the various sections provided in a man page, which usually
    (but not always) consist of the following:


    +   - NAME—The name of the command and a brief description

    - SYNOPSIS—The basic format of the command

    - DESCRIPTION—A longer overview of the command’s purpose'
