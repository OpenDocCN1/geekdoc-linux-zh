    from sniffers that capture all the traffic and then look through it for useful
    information. The simplest form of network encryption for wireless networks is
    Wired Equivalent Privacy (WEP). Although this provides a small measure of security,
    it''s just that: small. WEP is easily cracked by a knowledgeable attacker, and
    it has now been superseded by the much more robust Wi-Fi Protected Access (WPA).
    Unfortunately, getting WPA to work with wireless cards on Linux can be a real
