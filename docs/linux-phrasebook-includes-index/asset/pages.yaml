- img_proc: true
  md: '# Table 5.1 Key Commands for less


    | Key Command | Action |

    | --- | --- |

    | PageDn, e, or spacebar | Forward one page |

    | PageUp or b | Back one page |

    | Return, j, or down arrow | Forward one line |

    | y, k, or up arrow | Back one line |

    | G or p | Forward to end of file |

    | 1G | Back to beginning of file |

    | Esc-), right arrow | Scroll right |

    | Esc-(, left arrow | Scroll left |

    | Q | Quit less |


    As you can see, you have many options for commands. Probably the two you''ll use
    most often are those used to move down a page at a time and quit the program.


    To view information about the file while you''re in less, press =, which displays
    some data at the very bottom of your screen similar to the following:

    Paradise_Lost.txt lines 7521-7560/10762 byte 166743 ->/27306 70% (press RETURN)


    As you can see, you''re helpfully told to press Enter to get rid of the data and
    go back to using less.


    In the same way that you could tell cat to stick in line numbers for a file, you
    can also order less line numbers. Those numbers only appear, of course, while
    you''re using less. After you press q, the numbers are gone. To view the file,
    but with numbers at the start of each line, start less with -N (or --LINE-NUMBERS)
    option, and yes, you must use all caps:


    $ less -N Paradise_Lost.txt'
