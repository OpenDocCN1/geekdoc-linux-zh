    sshd 10542 root /dev/null

    sshd 10542 root 192.168.0.170:ssh->192.168.0.100:4577

    → (ESTABLISHED)

    sshd 10548 scott /usr/bin/sshd

    sshd 10548 scott 192.168.0.170:ssh->192.168.0.100:4577

    → (ESTABLISHED)

