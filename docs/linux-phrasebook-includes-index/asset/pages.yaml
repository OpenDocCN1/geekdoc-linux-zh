  md: '# Run Commands Only If the Previous Ones Succeed


    Of course, you can also use this method to introduce short delays as commands
    run. If you want to take a screenshot of everything you see in your monitor, just
    run the following command (this assumes you have the ImageMagick package installed,
    which virtually all Linux distributions do):


    ```

    $ sleep 3 ; import -frame window.tif

    ```


    The sleep command in this case waits three seconds, and then the screenshot is
    taken using import. The delay gives you time to minimize your terminal application
    and bring to the foreground any windows you want to appear in the screenshot.
    The ; makes it easy to separate the commands logically so you get maximum use
    out of them.


    CAUTION: Be very careful when command stacking, especially when deleting or moving
    files! Make sure what you typed is what you want because the commands will run,
    one right after another, and you might end up with unexpected surprises.


