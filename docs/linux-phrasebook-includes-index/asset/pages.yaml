    The network topologies associated with wired networks, such as star, bus, and
    ring, to name a few, have been known and understood for quite some time. Wireless
    networks introduce some new topologies to the mix, including the following:


    +   - Managed (an access point creates a network to which wireless devices can
    connect; the most common topology for wireless networking)


    +   - Ad-Hoc (two or more wireless devices form a network to work with each other)


    +   - Master (the wireless device acts as an access point)


    +   - Repeater (the wireless device forwards packets to other wireless devices)


    There are others, but those are the main ones. Using iwconfig, you can tell your
    wireless card that you want it to operate differently, in accordance with a new
    topology.


