  md: '# Change Permissions Recursively


    ```

    -rw-r--r-- 1 scott scott ... libby_by_pool_02.jpg

    -rwxr-xr-x 2 scott scott ... liberman_pool.jpg

    ```


    on_floor:

    -rw-r--r-- 1 scott scott ... libby_on_floor_01.jpg

    -rw-r--r-- 1 scott scott ... libby_on_floor_02.jpg

    $ chgrp -R family *

    $ chmod -R 660 *

    chmod: ''by_pool'': Permission denied

    chmod: ''on_floor'': Permission denied


    "Permission denied?” What happened? Take a look at Table 7.2. If a file is executable,
    it can be run as a program, but a directory must be executable to allow users
    access inside it to read its files and subdirectories.

    Running chmod -R 660 removed the x permission from everything—files and directories.
    When chmod went to report what it had done, it couldn''t read inside those directories,
    since they were no longer executable.


    So what should you do? There really isn''t a simple answer.You could run chmod
    using a wildcard that only affects files of a certain type, like this:


    ```

    $ chmod -R 660 *.jpg

    ```


    That would only affect images and not directories, so you wouldn''t have any issues.
    If you have files of more than one type, however it can quickly get tedious, as
    you''ll have to run chmod once for every file type.


    If you have many subdirectories within subdirectories, or too many file types
    to deal with, you can be really clever and use the find command to look for all
    files that are not directories and then change their permissions.You’ll learn
    more about that in Chapter 10,“The find Command.”'
