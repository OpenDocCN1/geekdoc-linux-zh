  md: '# Quickly Find Out What a Command Does Based on Its Name


    ```

    man -f

    ```


    If you know a command''s name but don’t know what it does, there’s a quick and
    dirty way to find out without requiring you to actually open the man page for
    that command. Use the -f option (or --whatis), and the command''s synopsis appears.


    ```

    $ man -f ls

    ls (1) - list directory contents

    ```


    TIP: Yes, the -f option, also known as --whatis, is the spitting image of the
    whatis command, which is examined in more detail later in this chapter.


    # Rebuild man''s Database of Commands


    ```

    man -u

    ```


    Occasionally you’ll try to use man to find out information about a command and
    man reports that there is no page for that command. Before giving up, try again
    with the -u option (or --update), which forces man to rebuild the database of
    commands and man pages it uses. It’s often a good first step if you think things
    aren’t quite as they should be.'
  merge: -1
