  md: '# Installing Software


    Linux distributions by default contain thousands of great software packages. Immediately
    after completing a basic install, you can surf the Net, write reports, create
    spreadsheets, view and manipulate images, and listen to music. Even with that
    plethora of software, you''re still going to want to add new tools that you run
    across. Fortunately, Linux makes it easy to install new software onto your computer.


    Conventional wisdom about Linux said you had to compile any software you wanted
    to install. You can still do that if you''d like (and many people do), but that''s
    rarely necessary in this day and age. Instead, you can install any of thousands
    of packages easily and quickly using some simple tools.


    You need to understand one important thing before proceeding, however. In the
    Linux world, software packages come in a variety of formats, with two particular
    dominating: RPM and DEB (not surprisingly, those are the two we''re going to cover
    in this chapter). RPM is used by distributions such as Red Hat (in fact, RPM stands
    for Red Hat Package Manager), Fedora Core, SUSE, and other RPM-based distributions.
    DEB is used by Debian-based distributions such as Debian'
  merge: -1
  pgno: 287
- img_proc: true
  md: 'itself, K/Ubuntu, Linspire, Xandros, and many others. You should know how both
    work, but focus on the system that matches your distribution.


    TIP: For a great breakdown of the various package management systems and the distributions
    that use them, see DistroWatch’s “Linux Distributions—Facts and Figures: What
    Is Your Distribution’s Package Management?” at http://distrowatch.com/stats.php?section=packagemagement.
    Note that DEB leads the pack (note also that I''m biased because this is being
    written using K/Ubuntu, also known as “Debian Do Right”).


    # Install Software Packages for RPM-Based Distributions


    ```

    rpm -ihv [package]

    rpm -Uhv [package]

    ```


    The rpm command installs software installers that end in .rpm, which seems entirely
    logical. To install an RPM package, you need to download open-source first. Let’s
    use the industry-standard network port scanner nmap as the example.You can download
    the RPM package for nmap from www.insecure.org/nmap/download.html; after it’s
    on your system, you simply run rpm along with three options: -i (for install),
    -h (to show hash marks so you can watch the progress of the install), and -v (be
    verbose and tell me what you’re doing). The command, which must be run as root,
    would look like this:


    ```

    # rpm -ihv nmap-4.01-1.i386.rpm

    ```'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# Install Software Packages RPM-Based Distributions 271


    This is actually not the command you should run, however. A better choice is -Uhv,
    where -U stands for upgrade. Why is -U better than -i? Because -i only installs,
    while -U upgrades and installs. If a package already exists on your system and
    you''re trying to put a newer one on your machine, -U performs upgrade; if a package
    doesn''t exist on your system, -U notices and instead installs it. Therefore,
    just use -U all the time, and it won''t matter if you''re upgrading or installing:
    -U does what needs to be done, and you won''t need to worry about it.


    ```

    # rpm -Uhv nmap-4.01-1.i386.rpm

    Preparing... ####################### [100%]

    1:nmap ################################# [100%]

    ```


    If you want to install more than one RPM, just list them separated by spaces,
    one after the other:


    ```

    # rpm -Uhv nmap-4.01-1.i386.rpm nmap-frontend-4.01-1.i386.rpm

    ```


    You can also use wildcards if you have many RPMs to install. For instance, if
    you have 20 .rpm files in a subdirectory named software, just run this command
    to install them all:


    ```

    # rpm -Uhv software/*..rpm

    ```


    CAUTION: The -U option is always better, except when installing a kernel. Then
    you want to use -i instead. If you upgrade with -U and the new kernel doesn''t
    work, you''re in a world of hurt. On the other hand, if you install a new kernel
    with -i, the old one is still on your machine as a backup the new one blows up.'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# Remove Software Packages for RPM-Based Distributions


    ```

    rpm -e [package]

    ```


    Getting rid of installed RPMs is even easier than installing them. Instead of
    -Uhv to place RPMs on your computer, use -e (for erase) to remove them.


    # rpm -e nmap


    And that''s it. The -e option is silent, so there’s no output. Notice, however,
    that when you install software using -Uhv, you need to specify the filename, otherwise
    rpm has no way to know what you want to install. When you remove software with
    rpm -e, however, you specify the package name because the files used for installation
    are now long gone, and rpm knows software by the package name.


    # Install Software Packages and Dependencies for RPM-Based Distributions


    ```

    yum install [package]

    ```


    The rpm command is powerful, but after you use it for a while you’ll quickly run
    into a problem when you try to install a package that has dependencies (otherwise
    known as “dependency hell”). In order to install package A, you also need to download
    and install packages B and C, but in order to install C you also need to download
    and install packages D and E, but in order to install E...aaaaggh!'
  merge: -1
  pgno: 290
- img_proc: true
  md: '# Install Software Packages and Dependencies for RPM-Based Distributions


    Debian-based distributions (that you''ll read about later in this chapter) solved
    this problem years ago with the powerful and useful apt; RPM-based distributions
    can use apt, but more commonly they use the relatively new and still immature
    yum. Originally developed for the RPM-based Yellow Dog distribution (hence the
    name, which stands for Yellow Dog Updater, Modified), yum is now widely used but
    still lags behind apt in features and usability. Still, that''s what''s available,
    so that''s what we''re going to cover.


    The yum command install, upgrades, and uninstalls software packages by acting
    as a wrapper around rpm. In addition, yum automatically handles dependencies for
    you. For example, if you''re trying to install package A from the example in the
    introductory paragraph, yum downloads and installs A, B, and C for you. Later,
    if you decide that you no longer want A on your system, yum can uninstall it for
    you, along with B and C, as long as other software packages do not require them.


    Installing software with yum is pretty easy. Let''s say you want to install XMMS,
    a media player (not surprising, since the name stands for X Multimedia System).
    To install XMMS, you also need to install several other dependencies. With yum,
    this process becomes much less painful than it would be if you were attempting
    to install manually using rpm. To start with, you don''t need to find and download
    the xmms package yourself; instead, yum downloads XMMS and any other necessary
    dependencies for you.


    Unfortunately, yum is incredibly verbose as it goes about its work. The following
    output has been cut drastically, yet it''s still lengthy. Nevertheless, this gives
    you a rough approximation of what you''d see if you were using yum.'
  merge: -1
