- img_proc: true
  md: '# CHAPTER 7 Ownerships and Permissions


    Notice what happened in this example. The libby.jpg file was already a member
    of the family group, but -v went ahead and reported on it anyway, making sure
    that you knew libby.jpg''s group was kept as family. If you''re changing groups,
    you probably didn''t need to know about items that already belong to the new group.
    In cases like that, you want to use the -c (or --changes) option, which (unsurprisingly)
    only reports changes made.


    ```

    $ 1s -1F

    drwxr-xr-x 4 scott scott ... by_pool/

    -rw-r--r-- 1 scott scott ... libby_arrowrock.jpg

    -rw-r--r-- 1 scott family ... libby.jpg

    -rw-r--r-- 1 scott scott ... libby_on_couch.jpg

    drwxr-xr-x 2 scott scott ... on_floor/

    $ chgrp -c family *

    nchanged group of ''by_pool'' to family

    changed group of ''libby_arrowrock.jpg'' to family

    changed group of ''libby_on_couch.jpg'' to family

    changed group of ''on_floor'' to family

    $ 1s -1F

    drwxr-xr-x 4 scott family ... by_pool/

    -rw-r--r-- 1 scott family ... libby_arrowrock.jpg

    -rw-r--r-- 1 scott family ... libby.jpg

    -rw-r--r-- 1 scott family ... libby_on_couch.jpg

    drwxr-xr-x 2 scott family ... on_floor/

    ```


    This time, nothing was reported to you about libby.jpg because it was already
    in the family group. So if you want a full report, even for files that won''t
    be changed, use -v; for a more concise listing, use -c.'
