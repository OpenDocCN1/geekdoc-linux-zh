- img_proc: true
  md: '# CHAPTER 3 Learning About Commands


    This opens the Info page for the info command. Now you need to learn how to get
    around in this new Info world.


    # Navigate Within info


    Within a particular section''s screen, to move down, or forward, one line at a
    time, use the down arrow; to move up, or back, one line at a time, use the up
    arrow. When you reach the bottom, or end, of a particular section, your cursor
    stops and you are not able to proceed.


    If you instead want to jump down a screen at a time, use your keyboard''s PageDown
    button; to jump up a screen at a time, use the PageUp key instead. You are not
    able to leave the particular section you''re in, however.


    If you reach the end of the section and you want to jump back to the top, just
    press b, which stands for beginning. Likewise, e takes you to the “end.”


    At, any time, as you''re jumping around place to place, notice that things look
    a little strange, such as the letters or words being distorted, press Ctrl+1 to
    redraw the screen, and all should be well.


    Now that you know how to navigate within a particular section or node, let''s
    move on to navigating between nodes. If you don''t want to use PageDown and PageUp
    to move forward and backward within a section, you can instead use the spacebar
    to move down and the Backspace or Delete keys to move up. These keys offer one
    big advantage over PageDown and PageUp, besides being easy to reach: When hit
    the end of a node, you automatically proceed onward to the next node, through
    subnodes. Likewise, going up moves you back to the previous node, through any'
