- img_proc: true
  md: '# CHAPTER 12 Monitoring System Resources


    ```

    $ free

    total used free shared buffers cached

    Mem: 1036136 995582 40284 0 80816 332264

    -/ buffers/cache: 582772 453364

    Swap: 1012084 495584 516500

    ```


    By default, free shows the results in kilobytes, the same as if you used the -k
    option. You can change that, however. The -b option shows memory usage in bytes,
    and -m (which you should probably use most of the time) uses megabytes.


    ```

    $ free -m

    total used free shared buffers

    cached

    Mem: 1011 963 48 0 78 316

    -/ buffers/cache: 569 442

    Swap: 988 483 504

    ```


    From free''s output, you can see that this machine has 1011MB of available RAM
    (actually 1024MB, but free displays it as 1011MB because the kernel takes up the
    remaining 13MB, so it could never be made available for other uses). The first
    line makes it appear that 963MB of that is in use, leaving only 48MB of RAM free.
    There''s nearly a gigabyte of swap, or virtual memory, in place, too, and about
    half of that, or 483MB, has already been used. That''s how it appears, anyway.


    It''s not simple, however. The important row is the middle one, labeled -/+ buffers/cache.
    Hard drives use buffers and cache to speed up access, and if a program needs that
    memory, it can be quickly freed up for that program. From the point of view of
    the applications running on this Linux machine, 442MB of memory is free right
    now for use, with 569MB cached but available if needed. And that''s in addition
    to the swap space'
  merge: -1
