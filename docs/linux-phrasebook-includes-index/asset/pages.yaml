- img_proc: true
  md: '# CHAPTER 7 Ownerships and Permissions


    Setting suid via octal permissions is a bit more complicated, only because it
    introduces a new facet to the numeric permissions you''ve been using. You''ll
    recall that numeric permissions use three digits, with the first representing
    what is allowed for the owner, the second for the group, and the third for all
    other users. It turns out that there''s actually a fourth digit that appears to
    the left of the owner''s number. That digit is a 0 the vast majority of the time,
    however, so''s not necessary to display or use it. In other words, chmod 644 libby.py
    and chmod 0644 libby.py are exactly the same thing. You only need that fourth
    digit when you want to change suid (or sgid or the sticky bit), as you''ll see
    in the following sections.


    The number for setting suid is 4, so you''d change backup_data using numbers like
    this:


    ```

    $ pwd

    /home/scott/bin

    $ ls -l

    -rwxr-xr-- 1 scott admins ... backup_data

    $ chmod 4754 backup_data

    $ ls -1

    -rwxr-xr-- 1 scott admins ... backup_data

    ```


    Removing suid is a matter of purposely invoking the 0 because that sets things
    back to the default state, without suid in place.


    ```

    $ ls -1

    -rwxr-xr-- 1 scott admins ... backup_data

    $ chmod 0754 backup_data

    $ ls -1

    -rwxr-xr-- 1 scott admins ... backup_data

    ```'
  merge: -1
  pgno: 174
- img_proc: true
  md: 'NOTE: As an ordinary user, it''s not very likely that you''ll need to change
    programs to suid. Most often it''s associ-ated programs owned by root, but it''s
    still good to know about it for that every-so-often case in which you need to
    use it.


    # Set and Then Clear sgid


    ```

    chmod g[+-s

    ```


    Closely related to suid is sgid. sgid can apply to both files and directories.
    For files, sgid is just like suid, except that a user can now execute a file with
    the group''s permissions instead of an owner''s permissions. For example, on your
    system crontab command is probably set as sgid, so that users can ask cron to
    run programs for them, but as the much more restricted crontab group rather than
    the all-powerful root user.


    ```

    $ ls -1 /usr/bin/crontab

    -rwxr-sr-x 1 root crontab ... /usr/bin/crontab

    ```


    When applied to directories, sgid does something interesting: Any subsequent files
    created in that directory belong to the group assigned to the directory. An example
    helps make this clearer.


    Let''s say you have three users—Alice, Bob, and Carol—who are all members of the
    admins group. Alice''s username is alice, and her primary group is also alice,
    an extremely common occurrence on most Linux systems. Bob and Carol follow the
    same pattern, with their usernames and primary groups being, respectively, bob
    and carol. If Alice creates a file in a directory shared by the admins group,
    the owner and'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# CHAPTER 7 Ownerships and Permissions


    group for that file is alice, which means that the other members of the admins
    group are unable to write to that file. Sure, Alice could run chgrp admins document
    (or chown :admins document) after she creates a new file, but that quickly grows
    incredibly tedious.


    If the shared directory is set to sgid, however any new file created in that directory
    is still owned by the user who created the file, but it''s also automatically
    assigned to the directory''s group, in this case The result: Alice, Bob, and Carol
    can all read and edit any files created in shared directory, with a minimum of
    tedium.


    Surprisingly, you can set sgid with either letters or numbers. Using letters,
    sgid is just like suid, except that a g instead of a u is used. Let''s look at
    sgid applied to a directory, but keep in mind that the process is used on a file.


    ```

    $ ls -lF

    drwxr-xr-x 11 scott admins ... bin/

    $ chmod g+s bin

    $ ls -lF

    drwxr-Sr-x 11 scott admins ... bin/

    ```


    NOTE: You might see both s and a S to indicate that sgid is set. You see an s
    if the group already have execute permissions (x) before you set sgid, and an
    S if the group didn''t have execute set before sgid was put in place. The end
    result is the same, but the capitalization tells you was in place originally.


    Removing sgid is pretty much the opposite of adding it.


    ```

    $ ls -lF

    drwxr-Sr-x 11 scott admins ... bin/

    ```'
  merge: -1
