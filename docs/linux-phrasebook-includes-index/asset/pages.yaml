    ```

    $ ls -l /home/scott/music

    -rw-r--r-- 1437931 2005-11-07 17:19 JohnColtrane.zip

    $ unzip /home/scott/music/JohnColtrane.zip

    $ mkdir -p /home/scott/music/coltrane

