    within the range of 69–99, so touch assumes you mean 19 as the base century, while
    34 in 3405170234 lies between 00 and 68, so 20 is used as the base. The last time
    touch is used, a year isn''t specified at all, just a month (10), a day (19),
    an hour (17), and minutes (03), so touch knows you mean the current year, 2005.
    By understanding how to manipulate touch, you can change the date stamps of files
