    Accept the default location in which to save the key by pressing Enter, and leave
    the passphrase field blank as well by pressing Enter twice when.You just created
    a private key at ~/.ssh/id_rsa and a public key at ~/.ssh/id_rsa.pub.


    Now you need to transfer the public key—not the private key—from pound to eliot.
    The developers behind ssh are way ahead of you, and have created a program that
    makes this as easy as falling off a log. To automatically copy your public key
    from pound to eliot, just enter the following on pound:


    ```

    $ ssh-copy-id ~/.ssh/id_rsa.pub tom@192.168.0.25

    Now try logging into the machine, with ssh ''tom@192.168.0.25'', and check in
    .ssh/authorized_keys to make sure you haven''t added extra keys that you weren''t
    expecting.

    ```


