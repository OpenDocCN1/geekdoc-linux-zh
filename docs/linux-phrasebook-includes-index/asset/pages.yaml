    mkdir: created directory ''pictures/personal''

    mkdir: created directory ''pictures/personal/family''

    ```


    One of the best things being about a Linux user is that the OS goes out of its
    way to reward lazy users—the lazier the better—and this is a great way to see
    that in action.


    # Copy Files


    ```

