  md: '# CHAPTER 2 The Basics


    NOTE: The word *print* in *print working directory* means “print to the screen,”
    not “send to printer.”


    The `pwd` command displays the full, absolute path of the current, or working,
    directory. It’s not something you’ll use all the time, but it can be incredibly
    handy when you get a bit discombobulated.


    ```

    $pwd

    /home/scott/music/new

    ```


    # Change to a Different Directory


    It’s possible to list the `cd` contents of any directory simply by specifying
    its path, but often you actually want to move into a new directory. That’s where
    the `cd` command comes in, another one that is almost constantly used by shell
    aficionados.


    The `cd` command is simple to use: Just enter `cd`, followed by the directory
    into which you want to move. You can use a relative path, based on where you are
    currently—`cd src` or `cd ..`—or you can use an absolute path, such as `cd /tmp`
    or `cd /home/scott/bin.


    # Change to Your Home Directory


    You should know about a few nice shortcuts for `cd`. No matter where you are,
    just enter a simple `cd`, and you’ll'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'immediately whisked back to your home directory. This is a fantastic timesaver,
    one that you''ll use all the time. Or, if you''d like, you can use cd ~ because
    the ~ is like a shortcut meaning “my home directory.”


    ```

    $ pwd

    /home/scott/music

    $ cd ~

    $ pwd

    /home/scott

    ```


    # Change to Your Previous Directory


    ```

    cd -

    ```


    Another interesting possibility is cd -, which takes you back to your previous
    directory and then runs the pwd command for you, printing your new (or is it old?)
    location.You can see it in action in this example.


    ```

    $ pwd

    /home/scott

    $ cd music/new

    $ pwd

    /home/scott/music/new

    $ cd -

    /home/scott

    ```


    Using cd - can be useful when you want to jump into a directory, perform some
    action there, then jump back to your original directory.The additional printing
    to the screen of the information provided by pwd is just icing on the cake to
    make sure you''re where you want to be.'
