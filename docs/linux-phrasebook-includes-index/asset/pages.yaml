  md: '# CHAPTER 15 Working on the Network


    but think about it for a moment. True, if someone gets on pound, he can now connect
    to eliot without a password. But that simply means that you need to practice good
    security on pound. If pound is compromised, you have enormous problems whether
    or not the attacker realizes that he can also get to eliot. On top of that, you
    shoot passwords around the Internet all the time. If an attacker acquires your
    password, he can do major damage as well. Isn''t your private key as important
    as a password? And aren''t you going to back it up and safeguard it? When you
    think about it in those terms, exchanging keys via ssh is at least as secure as
    passwords, and in most ways much more secure.


    Nonetheless, if you prefer to keep using passwords, that''s certainly your prerogative.
    That''s what open source and Linux is all about: choice.


    # Securely Transfer Files Between Machines


    ```

    sftp

    ```


    In the same way that ssh is a far better choice than telnet, SFTP is far better
    than FTP. Like telnet sends your name and password, as well as all the data being
    transferred, in the clear so that anyone sniffing packets can listen in. SFTP,
    on the other hand, uses ssh to encrypt everything: username, passwords, and traffic.
    Other than the fact it''s about a million times more secure, it''s remarkably
    similar to FTP in its commands, which should make it easy to learn and use.


    If you can access a machine via ssh, you can also SFTP to it. To use the sftp
    command from pound (192.168.0.15);'
