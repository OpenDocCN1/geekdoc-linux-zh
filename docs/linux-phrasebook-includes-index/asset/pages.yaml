    drwx-xr-x 632 2005-10-18 12:25 videos

    ```


    Why would you use touch in this way? Let''s say you want to create a file, and
    then fill it with content later. Or you need to create several files to perform
    tests on them as you''re playing with a new command you''ve discovered. Both of
    those are great reasons, and you''ll find more as you start learning more about
    your shell.'
