  md: 'subnodes. Using the spacebar, or the Backspace or Delete buttons, you can quickly
    run through an entire set of Info pages about a particular command.


    If you want to engage in fewer key presses, you can use (for next) to move to
    the next node at the same level. If you are reading a node that has subnodes and
    you press n, you skip those subnodes and move to the next node that''s a peer
    of the one you''re currently reading. If you are reading a subnode and press n,
    however, you jump to the next subnode. If n moves to the next node at the current
    level, then p moves to the previous one (p for previous, get it?), again at the
    same level.


    If you instead want to move forward to a node or subnode, use the ], or right
    brace, key. If you''re reading a node and you press ], you''ll jump to that node''s
    first subnode, if one exists. Otherwise, you''ll move to that node''s next peer
    node. To move backward in the same fashion, use the [, or left brace, key.


    If you want to move up a node, to the parent of the node you''re currently reading
    about the u (for up) key. Be careful, though—it''s easy to jump past the home
    page of the command about what is termed the Directory node, the root node that
