    NOTE: Keep in mind that this is -r, not -R. -r means reverse, but -R means recursive.


    When you use -l, the output is sorted alphabetically on the name of the files
    and folders; the addition of -r reverses the output, but it is still based on
    the file-name. Keep in mind that you can add -r virtually any time you use -ls
    if you want to reverse the default output of the command and options you''re inputting.


    # Sort Contents by File Extension


    ```

    ls -X

    ```


    The name of a file is not the only thing you can use for alphabetical sorting.
    You can also sort alphabetically by the file extension. In other words, you can
    tell ls to group all the files with .doc together, followed by files ending with
    .jpg, and finally finishing with files ending with .txt. Use the -X option (or
    --sort=extension); if you want to reverse the sort, add the -r option (or --reverse).


    ```

    $ ls -lX /src

    drxr-xr-x 320 2005-10-06 22:35 backups

