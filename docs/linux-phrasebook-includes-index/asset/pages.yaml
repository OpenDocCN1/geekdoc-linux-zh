    .bash_aliases, it too will be gone, but as long as you''re logged in. When you
    log out and log back in, or reload .bash_aliases, the alias is back.


    To remove aliases from .bash_aliases, you need to edit the file and manually remove
    the line containing the alias. If you think there''s a chance you might want to
    reuse the alias again sometime, just put a pound sign (which comments it out)
    in front of the alias, like this:


    ```

    # alias lsd=''ls -d *''

    ```


    Save .bash_aliases, reload it with the . .bash_aliases command, and the alias
    won''t work any longer. If you ever need it again, open .bash_aliases, remove
    the pound sign, save and reload the file, and it''s good to go again.


    # Conclusion


    One of your goals as a Linux user should be reducing the amount of characters
    you have to type to accomplish your goals. The original developers of Unix were
    strong believers in that concept—that''s why you enter ls instead of list and
    mkdir instead of makedirectory.'
