    drwxr-xr-x 48 2005-10-18 23:50 test

    drwxr-xr-x 632 2005-10-18 12:25 videos

    ```


    > NOTE: On most systems, new directories created by mkdir give the owner read,
    write, and execute permissions, while giving groups and the world read and execute
    permissions. Want to change those? Look in Chapter 7 at the chmod command.


    It should make you happy to know that your shell takes care of you: Attempts to
    create a directory that already exists fail and result in a warning message.


