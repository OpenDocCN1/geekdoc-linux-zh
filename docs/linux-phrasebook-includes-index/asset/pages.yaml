  md: '# CHAPTER 8 Archiving and Compression


    The only part of this that''s saved in the shell is zip -moby.zip *.txt. The actual
    password you type disappears into the ether, unavailable to anyone viewing your
    shell history.


    CAUTION: The security offered by the Zip program''s password protection isn''t
    that great. In fact, it''s pretty easy to find a multitude of tools floating around
    the Internet that can quickly crack a password-protected Zip archive. Think of
    password-protecting a Zip file as the difference between writing a message on
    a postcard and sealing it in an envelope: It''s good enough for ordinary folks,
    but it won''t stop a determined attacker.


    Also, the version of zip included with some Linux distros may not support encryption,
    in which case you''ll see a zip error: "encryption not supported." The only solution:
    recompile zip from source. Ugh.


    # Unzip Files


    ```

    unzip

    ```


    Expanding a Zip archive isn''t hard at all. To create a zipped archive, use the
    zip command; to expand that archive, use the unzip command.


    ```

    $ unzip moby.zip

