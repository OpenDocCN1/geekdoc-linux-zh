    ```


    The ping command sends a special kind of packet—an ICMP ECHO_REQUEST message—to
    the specified address. If a machine at that address is listening for ICMP messages,
    it responds with an ICMP ECHO_REPLY packet. (It''s true that firewalls can block
    ICMP messages, rendering ping useless, but most of the time it''s not a problem.)
    A successful ping means that network connectivity is occurring between the two
    machines.


