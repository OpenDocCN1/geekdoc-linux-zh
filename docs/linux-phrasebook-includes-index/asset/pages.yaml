- img_proc: true
  md: '# Search Recursively for Text in Files


    Here, though, bash sees the !, looks for a PID after it, and then complains that
    it can''t find an earlier command named " * (a double quote, a space, and an asterisk),
    which would be a very weird command indeed.


    It turns out that quotation marks indicate that you are using shell variables
    in your search term, which is in fact not what you wanted at all. So double quotes
    don’t work. Let’s try single quotes.


    ```

    $ grep ''hey!'' *

    txt/pvzm/8 hours a day.txt:hey you! let''s run!

    ```


    Much better results! The single quotes told grep that your search term didn’t
    contain any shell variables, and was just a strip of characters that you wanted
    to match. Lo and behold, there was a single result, the exact one you wanted.


    The lesson? Know when to use single quotes, when to use double quotes, and when
    to use nothing. If you’re searching for an exact match, use single quotes, but
    if you want to incorporate shell variables into your search term (which will be
    rare indeed), use double quotes. If you’re searching for a single word that contains
    just numbers and letters, though, it’s safe to leave off all quotes entirely.
    If you want to be safe, go ahead and use single quotes, even around a single word—it
    can’t hurt.


