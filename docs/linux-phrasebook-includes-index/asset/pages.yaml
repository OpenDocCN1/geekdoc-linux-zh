- img_proc: true
  md: '# # Cancel a Print Job Sent to Any Printer


    `1prm job ID`


    In the previous section, you learned how to cancel the current print job going
    to the default printer. But what if the job is queued and won''t start for another
    few minutes? Or what if the job is heading for a printer that''s not the default?
    In those cases, you want to still use 1prm, but you want to tell the command job
    to cancel by referencing the job''s ID number.


    Look back at the examples in "List Print Jobs."The third column is labeled "Job"
    and has a number in it. Now look back at "List Print Jobs by Printer." After the
    name of each printer is a hyphen and then a number—the same number seen in "List
    Print Jobs."That number is the job ID number. Specify that number to 1prm, and
    that exact job will be removed.


    ```

    $1pstat

    bro-489 rsgranne 108544 Tue 10 Dec 2005

    bro_wk-490 rsgranne 524288 Tue 10 Dec 2005

    $ 1prm 490

    $1prstat

    bro-489 rsgranne 108544 Tue 10 Dec 2005

    ```


    You can really save yourself from a needless waste of paper, toner, and ink using
    this particular command. Next time you realize that you just sent a 500-page document
    full of large pictures to your printer and stop it using 1prm and a job ID number,
    send an email your way and thank me.'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Cancel All Print Jobs


    What if you have several print jobs you want to cancel? You could delete them
    all by specifying all of their job ID numbers, like this:


    ```

    $ 1prm 489 490 491 492 493

    ```


    That’s too much typing, however. If you want to get rid of all print jobs you’ve
    queued on every printer, just follow 1prm with a hyphen:


    ```

    $ 1prm -

    ```


    It’s quick, it’s painless, and it’s lazy in the best Linux tradition. Nothing
    to be ashamed of there!


    # Conclusion


    Printing is a central activity people perform on their computers, so it’s important
    to learn how to print effectively. Part of printing is knowing how to query printers
    and well as send those jobs to printers in the first place. Of course, not all
    jobs need to be printed, so it’s important to know how to cancel unnecessary jobs
    as well. This chapter covers the major tasks you’ll need to work with your printers
    from Linux, but let me leave you with a final bit of advice: Automatic duplex
    printers that work with Linux have now fallen in price drastically, and they’ll
    help you save a small fortune in paper. Check one out when you’re next in the
    market for a printer.You’ll be glad you did.'
  merge: -1
