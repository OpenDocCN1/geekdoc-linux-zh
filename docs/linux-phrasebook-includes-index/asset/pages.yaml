    # Securely Transfer and Back Up Files


    ```

    rsync -v

    ```


    rsync is one of the coolest, most useful programs ever invented, and many people
    rely on it every day (like me!). What does it do? Its uses are myriad (here we
    go again into “you could write a book about this command!”), but let’s focus on
    one powerful, necessary feature: its capability to back up files effectively and
    securely, with a minimum of network traffic.


    Let''s say you intend to back up 2GB of files every night from a machine named
    colidge (username: sam) to another computer named wordsworth (username: wi11).
    Without rsync, you''re looking at a transfer of 2GB every single night, a substantial
    amount of traffic, even on a fast network connection. With rsync, however, you
    might be looking at a transfer that will take a few moments at most. Why? Because
    when rsync backs up those 2GB, it transfers only the differences between all the
    files that make up those 2GB of data. If only a few hundred kilobytes changed
    in the past 24 hours, that''s all rsync transfers. If instead it was 100MB, that''s
    what rsync copies over. Either way, it''s much less than 2GB.'
  merge: -1
  pgno: 354
- img_proc: true
  md: 'Here’s a command, run from coleridge, transfers the entire content of the documents
    directory to a back-up drive on wordsworth. Look at the command, look at the results,
    and then you can walk through those options mean (the command is given first with
    long options instead of single letters for readability, and then with single letters,
    if available, for comparison).


    ```

    $ rsync --verbose --progress --stats --recursive

    --times --perms --links --compress --rsh=ssh

    --delete /home/sam/documents/

    --will@wordsworth:/media/backup/documents

    ```


    ```

    $ rsync -v --progress --stats -r -t -p -l -z -e ssh

    --delete /home/sam/documents/

    --will@wordsworth:/media/backup/documents

    ```


    Of course, you could also run the command this way, if you wanted to combine all
    the options:


    ```

    $ rsync --vrtplze ssh --progress --stats --delete

    --home/sam/documents/

    --will@wordsworth:/media/backup/documents

    ```


    Upon running rsync using any of the methods listed, you’d see something like this:


