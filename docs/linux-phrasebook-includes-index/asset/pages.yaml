  md: '# CHAPTER 16 Windows Networking


    documents share from ELIOT, you might create a directory-like this:


    ```

    $ mkdir /home/scott/eliot_documents

    ```


    Now you run the smbmount command, along with a whole host of options.


    ```

    $ smbmount //eliot/documents /home/scott/eliot_

    docs -o credentials=/home/scott/bin/

    credentials_eliot,fmask=644,dmask=755,uid=1001,

    gid=1001,workgroup=TURING

    sbmnt must be installed suit root for direct user

    mounts (1000,1000)

    sbmnt failed: 1

    ```


    Before looking at the option, let''s talk about why smbmount failed. The second
    line tells you why: smbmnt, which smbmount calls, can only be run by root. This
    can be a problem if you want your non-root users to be able to mount Samba shares.
    The way around that is to set smbmnt as suit root (you learned about suit in Chapter
    7''s “Set and Then Clear suit”).


    > NOTE: Yes, you''re giving ordinary users the ability to use smbmnt as though
    they were root, but it''s not really a big problem. It''s certainly better than
    giving them the root password, or requiring your participation every time they
    want to mount a Samba share.


    Here''s how to set smbmnt as suit root.


    > NOTE: In order to save space, some of the details you''d normally see with ls
    -1 have been removed.'
