    Directories, however, are a bit different. The permissions of r, w, and x are
    pretty clear for a file:You can read the file, write (or change) it, or execute
    it. But how do you execute a directory?


    Let’s start with the easy one: r. In the case of a directory, r means the user
    can list the contents of the directory with the ls command. A w indicates that
    users can add more files into the directory, rename files that are already there,
    or delete files that are no longer needed. This brings us to x, which corresponds
    to the capability to access a directory in order to run commands that access and
    use files in that directory, or to access subdirectories inside that directory.


    As you can see, -l is incredibly powerful all by itself, but it becomes even more
    useful when combined with'
