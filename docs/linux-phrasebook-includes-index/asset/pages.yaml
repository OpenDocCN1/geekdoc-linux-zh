    # End a Running Process


    ```

    kill

    ```


    Sometimes a program goes rogue, and it won''t react to normal attempts to close
    it. In the GUI, you click repeatedly on the Close button, but nothing happens,
    or, in the shell, you press Ctrl+C but it fails to stop a'
  merge: -1
