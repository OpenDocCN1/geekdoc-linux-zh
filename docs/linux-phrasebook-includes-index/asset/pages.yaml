    +   $ cat housman--_rue.txt quarles--_the_world.txt

    WITH rue my heart is laden

    For golden friends I had,

    For many a rose-lipt maiden

    And many a lightfoot lad.

    By brooks too broad for leaping

    The lightfoot boys are laid;

    The rose-lipt girls are sleeping

    In fields where roses fade.

    The world’s an Inn; and I her guest.

    I eat; I drink; I take my rest.

    My hostess, nature, does deny me

    Nothing, wherewith she can supply me;

    Where, having stayed a while, I pay

    Her lavish bills, and go by my way.


    Notice that cat doesn’t separate the two files with a horizontal rule, a dash,
    or so forth. Instead, the two files together and spits them out. If you want more
    of a separation—having the last line of “With rue my heart is laden” jammed up
    right next to the first line of“On the world” makes them hard to read, for instance—make
    sure there’s a blank line at the end of each file you’re going to concatenate
    together.'
