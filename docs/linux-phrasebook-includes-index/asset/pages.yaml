- img_proc: true
  md: '# Change Permissions on Files and Directories Using Numeric Permissions


    CAUTION: Yes, you can set chmod 000 on a file or directory, but now the only user
    who can do anything with it or use chmod to change permissions again is root.


    Octal permissions should now make a bit of sense. They require a bit more cogitation
    to understand than alph permissions, but they also allow you to set changes in
    one fell swoop. Let’s revisit the examples from “Change Permissions on Files and
    Directories Using Alphabetic Notation” but with numbers instead.


    Let’s say you want to allow members of the family group to be able to change a
    picture.


    ```

    $ ls -1

    -rw-r--r-- 1 scott family ... liberty.jpg

    $ chmod 664 liberty.jpg

    $ ls -1

    -rw-rw-r-- 1 scott family ... liberty.jpg

    ```


    What if you had wanted to give both the family group and all other users write
    permission on the file?


    ```

    $ ls -1

    -rw-r--r-- 1 scott family ... liberty.jpg

    $ chmod 666 liberty.jpg

    $ ls -1

    -rw-rw-rw- 1 scott family ... liberty.jpg

    ```


    You realize you made a mistake, and you need to remove the capability of the family
    group and the world to alter that picture and also ensure that the world can’t
    ever see the picture.


    ```

    $ ls -1

    -rw-rw-rw- 1 scott family ... liberty.jpg

    ```'
  merge: -1
