  md: '# Change a File to the Current Time


    ```

    touch

    ```


    The touch command isn''t one you''ll find yourself using constantly, but you''ll
    need it as you proceed through this book, so it''s a good one to cover now. Interestingly,
    the main reason for the existence of touch—to update the access and modification
    times of a file—isn''t the main reason you''ll be using the command. Instead,
    you''re going to rely on its secondary purpose that undoubtedly gets more use
    than the primary purpose!


    NOTE: You can only use the touch command on a file and change the times if you
    have write permission for that file. Otherwise, touch fails.


    Simultaneously update both the access and modification times for a file (or folder),
    just run the basic touch command.


    ```

    $ ls -l ~/

    drwxr-xr-x  848 2005-10-19 11:36 src

    drwxr-xr-x 1664 2005-10-18 12:07 todo

    drwxr-xr-x  632 2005-10-18 12:25 videos

    -rw-r--r--  239 2005-09-19 23:12 wireless.log

    $ touch wireless.log

    $ ls -l ~/

    drwxr-xr-x  848 2005-10-19 11:36 src

    drwxr-xr-x 1664 2005-10-18 12:07 todo

    drwxr-xr-x  632 2005-10-18 12:25 videos

    -rw-r--r--  239 2005-10-19 14:00 wireless.log

    ```'
  merge: -1
  pgno: 54
- img_proc: true
  md: 'Change a File to Any Desired Time


    Thanks to touch, both the modification time and the access time for the wireless.log
    file have changed, although ls -l only shows the modification time.The file hadn''t
    been used in more than a month, but touch now updates, making it look like it
    was just...touched.

    You can be more specific, if you''d like. If you want to change the access time,
    use the -a option (or --time=access); to alter the modification time only, use
    -m (or --time=modify).


    # Change a File to Any Desired Time


    touch -t


    Keep in mind that you aren''t constrained to the current date and time. Instead,
    you can pick whatever date and time you like, as long as you use this option and
    pattern: -t [[CC]YY]MMDhhmm[.ss]. The pattern is explained in Table 2.4.


    Table 2.4 Patterns for Changing a File''s Times

    | Characters | Meaning |

    |---|---|n| CC | First two characters of a four-digit year |

    | YY | Two-digit year:

    | | If 00–68, assumes that first two digits are 20 |

    | | If 69–99, assumes that first two digits are 19 |

    | | If nothing, assumes current year |

    | MM | Month (01–12) |

    | DD | Day (01–31) |

    | hh | Hour (01–23) |

    | mm | Minute (00–59) |

    | ss | Second (00–59) |'
