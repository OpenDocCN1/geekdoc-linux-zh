    JohnColtrane.zip is a 1.4GB file, and even on a fast machine, unzipping that monster
    is going to take some time, and you probably have better things to do than to
    sit there and wait. Command stacking to the rescue!


    Command stacking puts all the commands you want to run on one line in your shell,
    with each specific command separated by a semicolon (;). Each command is then
    executed in sequential order and each must terminatesuccessfully or unsuccessfully—before
    the next one runs. It’s easy to do, and it can really save some time.


    With command stacking, the previous series of commands now looks like this:


    ```

    $ ls -l /home/scott/music

    -rw-r--r-- 1437931 2005-11-07 17:19 JohnColtrane.zip

    $ unzip /home/scott/music/JohnColtrane.zip ;

    ➥mkdir -p /home/scott/music/coltrane ;

    $mv /home/scott/music/coltrane*.mp3

    ➥/home/scott/music/coltrane/;

    ➥rm /home/scott/music/JohnColtrane.zip

    ```'
