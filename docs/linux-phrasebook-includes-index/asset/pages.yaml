    know that you want to use shell variables. For instance, using grep and regex
    in the following way to look for all usages of the phrase “hey you!” in a friend’s
    poetry they wouldn’t work:


    ```

    $ grep hey you! *

    grep: you!: No such file or directory

    txt/pvzm/8 hours a day.txt:hey you! let''s run!

    txt/pvzm/friends & family.txt:in patience they wait

    txt/pvzm/speed of morning.txt:they say the force

    ```


    Because you simply wrote out “hey you!” marks also cause around it, grep was confused.
    It first looked for the search term hey in a file called “you!” but it was unsuccessful,
    because that isn’t the actual name of a file. Then it searched for hey in every
    file contained in the current working directory, as indicated by the * wildcard,
    with three good results. It’s true that the first of those contained the phrase
    you were searching for, so in that sense your search worked, but not really.This
    search was crude and does not always deliver the results you like. Let’s try again.


    This time you’ll use double quotes around your search term. That should fix the
    problem you had when you didn’t use anything at all.


    ```

    $ grep “hey you!” *

    bash: !*: event not found

    ```


    Even worse! Actually, the quotation marks also cause a big problem and give even
    worse results than you just saw. What happened? The ! is a shell command that
    references your command history. Normally you’d use the ! by following it with
    a process ID (PID) number that represents an earlier command you ran, like !264.'
