  md: '# CHAPTER 15 Working on the Network


    would allow users to connect to other machines so they could run programs, view
    files, and access resources. For a long time, telnet was the program to use, but
    it had a huge problem; it was completely insecure. Everything you send using telnet—your
    username, password, and all commands and data—is without any encryption at all.
    Anyone listening in can see everything, and that''s just not good.


    To combat this problem, ssh (secure shell) was developed. It can do everything
    telnet can, and then a lot more. Even better, all ssh traffic is encrypted, making
    it even more powerful and useful. If you need to connect to another machine, whether
    computer is on the other side of the globe or in the next room, use ssh.


    Let''s say you want to use the ssh command from your laptop (named pound, and
    found at 192.168.0.15) to your desktop (named eliot, and located at 192.168.0.25)
    so you can look at a file. Your username on the laptop is ezra, but on the desktop
    it''s tom. To SSH to eliot, you''d enter the following (you could also use domain
    names such as hoohah.granneman.com if one existed):


    ```

    $ tom@192.168.0.25

    tom@192.168.0.25 password:

    Linux eliot 2.6.12-10-386 #1 Mon Jan 16 17:18:08 UTC

    → 2006 i686 GNU/Linux

    Last login: Mon Feb 6 22:40:31 2006

    →from 192.168.0.15

    [Listing truncated for length]

    ```


    You''re prompted for a password after you connect. Type it in (you won''t see
    what you''re typing, in order to prevent someone from "shoulder surfing" and discovering
    your password), press Enter, and if it''s accepted, you see some information about
    the machine to which you'
  merge: -1
  pgno: 344
- img_proc: true
  md: 'connected, including its name, kernel, date and time, and the last time you
    logged in. You can now run any command you''re authorized to run on that machine
    as though you were sitting right in front of it. From the perspective of ssh and
    eliot, it doesn''t matter where earth you are—you''re logged in and ready to go.


    If this were the first time you''ve connected to eliot, however, you would have
    seen a different message:


    ```

    $ ssh tom@192.168.0.25

    The authenticity of host ''192.168.0.25''

    →(192.168.0.25)'' can''t be established.

    RSA key fingerprint is 54:53:c3:1c:9a:07:22:0c:82:

    →7b:38:53:21:23:ce:53.

    Are you sure you want to continue connecting

    →(yes/no)?

    ```


    Basically, ssh is telling you that it doesn''t recognize this machine, and it''s
    asking you to verify the machine''s identity. Type in yes, press Enter, and you
    get another message, along with the password prompt:


    > Warning: Permanently added ''192.168.0.25'' (RSA)

    →to the list of known hosts.1

    tom@192.168.0.25''s password:


    From here things proceed normally. You only see this message the first time you
    connect to eliot because ssh stores RSA key fingerprint it mentioned in a file
    located at ~/.ssh/known_hosts. Take a look at that file, and you see a line has
    been added to it. Depending on whether the HashKnownHosts option has been enabled
    in your /etc/ssh/ssh_config file, that line appears in one of two formats. If
    HashKnownHosts is set to no, it looks something like this:'
