  md: '# The Basics of Searching Inside Text Files for Patterns


    203





    Wildcards are not equivalent to regex.Yes, both wild-cards and regular expressions
    use the * character, for instance, but they have completely different meanings.
    Where certain characters (? and *, for example) are used as wildcards to indicate
    substitution, the same characters in regex are used to indicate the number of
    times a preceding item is to be matched. For instance, with wild-cards, the ?
    in c?t replaces one and only one letter, matching cat, cot, and cut, for instance,
    but not ct. With regex, the ? in c[a-z]? indicates that the letters A through
    Z are matched both zero or one time(s), thereby corresponding to cat, cot, cut,
    and also, cot.


    TIP: To learn more about differences between wildcards and regular expressions,
    see "What Is a Regular Expression" (http://docs.kde.org/stable/en/kdeutils/KregExpEditor/whatsARExp.html),
    "Regular Expressions Explained" (www.castaglia.org), and "Wildcards Gone Wild"
    (www.linux-mag.com/2003-12/power_01.html).


    Another potentially confusing thing about grep is that you need to be aware of
    special characters in your grep regex. For instance, in regular expressions, the
    string [a-e] indicates a regex range, and means any character matching a, b, c,
    d, or e. When using [ ] with grep, you need to make it clear to your shell whether
    the [ and ] are there to delimit a regex range or part of the words for which
    you''re searching. Special characters of which you need to keep aware include
    the following:


    ? [ ] ^ \|


    Finally, there is a big difference between the use of single quotes and double
    quotes in regex. Single quotes ('' and '') tell the shell that you are searching
    for a string of characters, while double quotes (" and ") let your shell'
