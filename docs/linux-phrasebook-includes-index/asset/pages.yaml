  md: 'The next common issue occurs when apt complains about broken dependencies.
    You’ll know this one’s happening when apt encourages you to run apt-get -f install.
    This suggestion is the program’s way of telling you that your system has some
    broken dependencies that prevent apt from finishing its job.


    There are a couple of possible solutions. You can follow apt’s advice, and run
    apt-get -f install, which tries to fix the problem by downloading and installing
    the necessary packages. Normally, this solves the problem, and you can move on.


    If you don’t want to do that, you can instead run apt-get -f remove, which tries
    to fix the problem by removing packages that apt deems troublesome. These might
    sound like potentially dangerous steps to take—and they could be if you don’t
    pay attention—but each option gives you the chance to review proposed changes
    and give your assent. Just be sure to examine apt’s proposals before saying yes.


    Finally, apt might warn you that some packages “have been kept back.” This warning
    tells you that apt has found a conflict between the requested package or another
    package already installed on your system. To resolve the issue, try to install
    the package that was kept back with the -u option, which gives you information
    about exactly what needs to be upgraded.


