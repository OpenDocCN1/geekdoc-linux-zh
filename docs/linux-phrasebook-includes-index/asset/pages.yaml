    ```

    .../txt/rider_haggard

    .../txt/rider_haggard/Queen_of_the_Dawn.txt

    .../txt/rider_haggard/Allan_and_the_Ice-Gods.txt

    .../txt/rider_haggard/Heu-Heu_or_The_Monster.txt

    ```


    Your search results show up quickly because locate

    is''t searching your system in real time. Instead, locate

    searches a database of filenames that is automatically

    undated daily (more about that in “Update the

    Database Used by locate” later in this chapter). Because

    locate searches a precreated database, its results appear

    almost instantaneously.


    On your computer, though, you''re probably using

    slocate instead of locate—you''re just not aware of it.

    The locate command (which stands for secure locate) is

    a more recent version that vont search directories that

    the user running slocate doesn''t have permission to

    view (for instance, if you''re not root, results from /root

    shouldn''t show up when you search with locate).


    Before locate, locate would spit back many errors

    complaining about permission problems; with locate,

