    If you''re in a hurry and you need to copy a file securely from one machine to
    another, scp (secure copy) is what you want. In essence, here''s the basic pattern
    for using scp:


    scp user@host1:file1 user@host2:file2


    This is basically the same syntax as good old cp'', but now extended to the network.
    An example will make things clearer. Let''s say you want to copy backup.sh from
    pound (192.168.0.15; username ezra) to /home/tom/bin on eliot (129.168.0.25; username
    tom) using scp:


    ```

    $ pwd

    /home/ezra

    $ ls ~/bin

    backup.sh

    $ scp ~//bin/backup.sh tom@192.168.0.25/home/tom/bin

    backup.sh                   100% 8806      8.6KB/s      00:00

    $

    ```'
