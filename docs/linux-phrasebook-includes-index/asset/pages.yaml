    with a dot. Now your alias will work. Because you have to reload the file every
    time you add an alias, it’s a good idea to add several at a time to lessen the
    hassle.


    # Remove an Alias


    ```

    unalias

    ```


    All good things must come to an end, and sometimes an alias outlives its usefulness.
    To remove an alias, use the unalias command.


    ```

    $ ls -d */

    by_pool/ libby_pix/ on_floor/

    $ alias lsd=''ls -d */''

    $ lsd

    by_pool/ libby_pix/ on_floor/

    $ unalias lsd

    ```'
