    ```


    Pipe the output of your locate search to the pager less (which was covered in
    “View Text Files a Screen at a Time,” in Chapter 5, “Viewing Files”), and you
    get your 2,373 results one manageable screen at a time.


    If you just want to see the first x results, where x is an integer of your choice,
    use the -n option, followed by the number of results you want to see.


    ```

    $ locate -n 3 pdf

