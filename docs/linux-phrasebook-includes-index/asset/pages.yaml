- img_proc: true
  md: 'NOTE: Yes, sshd is a program, but remember, that''s from your human perspective.
    To Linux, /usr/bin/sshd is just another file.


    # List Processes for a Particular Program


    ```

    lsof -c [program]

    ```


    In the previous section, you saw who was using /usr/bin/sshd. The results you
    received, however, don''t tell the whole story. Any particular program is actually
    comprised of calls to several (perhaps many) other processes, programs, sockets,
    and devices, all of which appear to Linux as more files. To find out the full
    universe of other files associated with a particular running program, follow lsof
    with the -c option, and then the name of a running (and therefore “open”) program.
    For example, lsof /usr/bin/sshd said that there were two users and three open
    files associated with that exact file. But what about the entire sshd command?


