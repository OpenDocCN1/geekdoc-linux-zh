    less typing. You''re root in name, power, and environment, which means you''re
    fully root. To the computer, anything that root can do, you can do. Have fun with
    your superpowers, remember that with great power comes great...aw, you know how
    it ends.


    # Conclusion


    If this was law school, you would have learned in this chapter what misdemeanors,
    torts, and felonies are. If this was a hardware repair class, it would have been
    RAM, hard drives, and motherboards. Since this is a book about the Linux shell,
    you''ve examined the most basic commands that a Linux user needs to know to effectively
    use the command line: 1s, pwd, cd, touch, mkdir, cp, mv, and su. rmdir and whoami
    were thrown in as extras. With these vital commands under your belt, you''re ready
    to move ahead to learning about how to learn about commands. Twisty? You ain''t
    seen nothin'' yet.'
