    if you want to repeat your search and go to the next result, press the comma.


    If you want to search text instead of titles, enter s (for search), followed by
    your search term or phrase, and then press Enter. To repeat that search, enter
    s, followed immediately by Enter. That''s not as easy as just pressing the comma
    key like you do when you''re searching titles, but it does work.


    If at any time you get lost inside Info and need help, just press the ? key and
    the bottom half of your window displays all of the various options for Info. Move
    up and down in, and perhaps importantly, to get out of that section using the
    keys you''ve already learned. When you want to get out of help, press l.


    Finally, and perhaps most importantly, to get out of Info altogether, just press
