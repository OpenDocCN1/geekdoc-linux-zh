    && and be safe.


    ```

    ||

    ```


    The && runs each command in sequence only if the previous one completes successfully.
    The || does the opposite: If the first command fails (technically, it returns
    an exit status that is not 0), only then does the second one run. Think of it
    like the words either/or—either the first command or the second one.


    The || is often used to send an alert to an administrator when a process stops.
    For instance


    ```

    ping -c 1 -w 15 -n 72.14.203.104 ||

    {

    echo "Server down" | mail -s ''Server down''

    admin@google.com

    }

    ```


    NOTE: Wondering what the | | is? Look ahead in this chapter to the "Use the Output
    of One Command As Input for Another" section to find out what it is and how to
    use it.'
