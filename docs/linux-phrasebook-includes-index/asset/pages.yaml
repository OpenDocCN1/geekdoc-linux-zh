    ```


    The touch command creates empty files, but how do you bring a new folder into
    existence? With the mkdir command, that''s how.


    ```

    $ ls -l

    drwxr-xr-x 848 2005-10-19 11:36 src

    drwxr-xr-x 632 2005-10-18 12:25 videos


    $ mkdir test

