    # Prevent Overwriting Files When Using Redirection


    There’s a way to prevent overwriting files when redirecting, however—the noclobber
    option. If you set noclobber to on, bash won’t allow redirection to overwrite
    files without your explicit permission. To turn on noclobber, use this command:


    $ set -o noclobber


    At that point, if you want to use redirection and overwrite a file, use >| instead
    of just >, like this:


    ```

    $ pwd

    /home/scott/music

    $ ls -1F

    Hank_Mobley/

    hank_mobley.txt

    Horce_Silver/

    John_Coltrane/

    $ ls -1F Hank_Mobley/* > hank_mobley.txt

    ERROR

    $ ls -1F Hank_Mobley/* >| hank_mobley.txt

    $ cat hank_mobley.txt

    1958_-1F Hank_Peckin''_Time/

    1960_Roll_Call/

    1960_Soul_Station/

    1961_Workout/

    1963_No_Room_For_Squares/

    ```'
