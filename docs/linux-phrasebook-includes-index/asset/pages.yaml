  md: '# CHAPTER 2 The Basics


    It''s very important that you include the zeroes if the number you want to use
    isn''t normally two digits or your pattern won''t work. Here are a few examples
    of touch with the -t option in action to help get you started.


    ```

    $ 1s -l

    -rw-r--r-- 239 2005-10-19 14:00 wireless.log

    $ touch -t 197002160701 wireless.log

    $ 1s -l

    -rw-r--r-- 239 1970-02-16 07:01 wireless.log

    $ touch -t 9212310000 wireless.log

    $1s -l

    -rw-r--r-- 239 1992-12-31 00:00 wireless.log

    $ touch -t 3405170234 wireless.log

    $ 1s -l

    -rw-r--r-- 239 2034-05-17 02:34 wireless.log

    $ touch -t 10191703 wireless.log

    $1s -l

    -rw-r--r-- 239 2005-10-19 17:03 wireless.log

    ```


    First you establish that the current date and time for wireless.log is 2005-10-19
    14:00. Then you go back in time some 35 years, to 1970-02-16 07:01, and then for
    ward a little more than 20 years to 1992-12-31 00:00, and then leap into the future
    to 2034-05-17 02:34, when Linux computers will rule the world and humans will
    live in peace and open-source prosperity, and then finish back in our day and
    time.


    You should draw a couple of lessons from this demonstration. You go back more
    than three decades by specifying the complete four-digit year (1970), the month
    (02), the day (16), the hour (07), and the minute (01). You don''t need to specify
    seconds. After that, you never specify a four-digit year again. 92 in 921 is'
