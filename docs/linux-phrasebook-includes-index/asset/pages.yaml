  md: 'The big takeaway:When changing permissions recursively, be careful. You might
    not get what you expected and end up preventing access to files and subdirectories
    accidentally.


    # Set and Then Clear suid


    the “Understand the Basics of Permissions” section, you’ve looked at several possible
    permissions. You’ve focused on r, w, and x because those are the most common,
    but others can come in handy at times. Let’s take a look at suid, which only applies
    to executable files, never directories.


    After suid is set, suid means that a user can execute a file with the owner’s
    permissions, as though it was the owner of the program running it. You can see
    a common example of suid in action by looking at the permissions for the password
    command, which allows users to set and change their passwords.


    ```

    $ ls -l /usr/bin/passwd

    -rwsr-xr-x 1 root root ... /usr/bin/passwd

    ```


    You can see that password is set as suid because it has an s where the user’s
    x should be. But it is necessary that ordinary users are allowed to run the command,
    or they wouldn’t be able to change their passwords on their own. To make the password
    command executable for everyone, x is set for the group, and all users on the
    system. That’s not enough, however. The answer is to set suid root, so anyone
    can run it with root’s permissions for that command.'
  merge: -1
  pgno: 172
- img_proc: true
  md: 'NOTE: You might see both s and an S to indicate that suid is set. You see an
    s if the owner already had execute permissions (x) before you set suid, and an
    S if the owner didn''t have execute set before suid was put in place. The end
    result is the same, but the capitalization tells you what was in place originally.


    You can set and unset suid in two ways: using the alphabet or using numbers. The
    alphabet method would look like this:


    ```

    $ pw

    /home/scott/bin

    $ ls -l

    -rwx-xr-- 1 scott admins ... backup_data

    $ chmod u+s backup_data

    $ ls -l

    -rws-xr-- 1 scott admins ... backup_data

    ```


    Now anyone in the admins group can run the backup_data script as though they were
    the user scott. But note that anyone not in the admins group is shut out because
    it only has read permission for the program. If it was necessary for everyone
    on the system to be able to run backup_data as scott, the permissions would be
    -rws-xr-x.


    Removing suid is a matter of using u- instead of u.


    ```

    $ ls -l

    -rwx-xr-- 1 scott admins ... backup_data

    $ chmod u-s backup_data

    $ ls -l

    -rwx-xr-- 1 scott admins ... backup_data

    ```'
  merge: -1
