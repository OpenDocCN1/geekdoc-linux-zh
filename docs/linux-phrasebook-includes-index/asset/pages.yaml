    delete the contents of that directory, should you find anything in it.


    Of course, as great as apt is, you might run into problems. Here are some problems
    and their workarounds.


    One simple problem that will result in a smack to your own head is the "Could
    not open lock file" error. You''ll try to run apt-get, but instead of working,
    get this error message:


    > E: Could not open lock file /var/lib/dpkg/lock - ➜open (13 Permission denied)

    E: Unable to lock the administration directory ➜(/var/lib/dpkg/), are you root?


    The solution to this issue is right there in the second line:You''re not logged
    in as root! Simply log in as root and try again, and everything should work.


    NOTE: If you''re running K/Ubuntu, or any other distribution that uses sudo instead
    of root, the error means that you didn''t preface the command with sudo. In other
    words, you ran this:


    ```

    $ apt-get upgrade

    ```


    You''re seeing the error message because you should have run this instead:


    ```

    $ sudo apt-get upgrade

    ```'
