    | rm libby?.jpg | libby1.jpg through libby9.jpg, but not libby10.jpg |

    | rm libby?.* | libby1.jpg though libby9.jpg, as well as libby1.txt |


    [ ] match either a set of single characters ([12], for instance) or a range of
    characters separated by a hyphen (as [1-3]). Table 1.4 has some uses of the [
    ] and what they would match.


    Table 1.4 The Wildcard [] and What It Matches

    | Command | Matches |

    | --- | --- |

    | rm libby1[12].jpg | libby11.jpg and libby12.jpg, but not libby10.jpg |

    | rm libby1[0-2].jpg | libby10.jpg through libby12.jpg, but not libby1.jpg |

    | rm libby[6-8].jpg | libby6.jpg through libby8.jpg, but nothing else |


    You’ll be using wildcards all through this book, it’s good to introduce them now.
    They make dealing with files on the command line that much easier, and you’re
