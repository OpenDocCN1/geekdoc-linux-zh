  md: '# # Learning About Commands


    In Chapter 2, “The Basics,” you started learning about some basic system commands.
    You covered a lot, but even so, much was left out. The `ls` command is an incredibly
    rich, powerful tool, with far more options than were provided in Chapter 2. So
    how can you learn more about that command or others that pique your interest?
    And how can you discover commands if you don''t even know their names? That’s
    where this chapter comes in. Here you will find out how to learn more about the
    commands you already know, those you know don''t know, and even those that you
    don''t know that you don''t!


    Let’s start with the two 800-pound gorillas—man and info—and move from there to
    some smaller, more precise commands that actually use much of the data collected
    by man. By the time you’re finished, you’ll be ready to start learning about the
    huge variety of tools available to you in your shell environment.'
  merge: -1
