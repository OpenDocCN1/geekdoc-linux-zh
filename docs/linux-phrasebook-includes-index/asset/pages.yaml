  md: '# Wildcards and What They Mean


    libby10.jpg

    libby11.jpg

    libby12.jpg

    libby1.txt


    You want to delete these files using the rm command (covered in Chapter 2) on
    your command line. Removing them one at a time would be tedious and kind of silly.
    After all, one of the reasons to use computers is to automate and simplify boring
    tasks. This is a job for wildcards, which allow you to specify more than one file
    at a time by matching characters.


    There are three wildcards: * (asterisk), ? (question mark), and [ ] (square brackets).
    Let''s take each one in order.


    The * matches any character zero or more times. Table 1.2 has uses of the * and
    what they would match.


    | Command | Matches |

    | --- | --- |

    | rm libby1*.jpg | libby10.jpg through libby12.jpg, as well as libby1.txt |

    | rm libby*.jpg | libby1.jpg through libby12.jpg, but not libby1. txt |

    | rm *txt | libby1.txt, but not libby1.jpg through libby12.jpg |

    | rm libby* | libby1.jpg through libby12.jpg, and libby1.txt |

    | rm * | All files in the directory |


    The ? matches a single character. Table 1.3 has some uses of the ? and what they
    would match.'
