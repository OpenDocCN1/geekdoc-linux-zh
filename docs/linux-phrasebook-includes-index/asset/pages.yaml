- img_proc: true
  md: '# Find Out About Commands with man


    ```

    man 1s

    ```


    Want to find out about a Linux command? Why, it''s easy! Let''s say you want to
    find out more about the 1s command. Enter man 1s, and the man (short for manual)
    page answers, chock full of info about the various facets of 1s. Try the same
    thing for some of the other commands you''ve examined in this book. You''ll find
    man pages for (almost) all of them.


    Still, as useful as man pages are, they still have problems. You have to know
    the name of a command to really use them (although there are ways around that
    particular issue), and they''re sometimes out of date and missing the latest features
    of a command. They don''t always exist for every command, which can be annoying.
    But worst of all, even if you find one that describes a command in which you''re
    interested and it''s up to date, you might still have a big problem: It might
    be next to useless.


    The same developers who write the man pages usually (but not always) write the
    applications included with a Linux distribution are excellent programmers, but
    not always effective writers or explainers of their own work. They know how things
    work, but they too often forget that users don''t know the things that the developers
    find obvious and intuitive.


    With all of those problems, however, man pages are still a good resource for Linux
    users at all levels of experience. If you''re going to use Linux on the command
    line, you need to learn how to use and read man pages.'
