    drwxr-xr-x 240 2005-10-20 14:16 libby

    drwxr-xr-x 240 2005-10-20 14:17 libby_bak

    ```


    # Copy Files As Perfect Backups in Another Directory


    ```

    cp -a

    ```


    You might be thinking right now that cp would be useful for backing up files,
    and that is certainly true (although better programs exist, and we’ll take a look
    at one of them—rsync in Chapter 15, “Working on the Network”). With a few lines
    in a bash script, however, cp can be an effective way to back up various files
    and directories. The most useful option in this case would be the -a option (or
    --archive), which is also equivalent to combining several options: -dpR (or --no-dereference
    --preserve --recursive). Another way of thinking about it is that -a ensures that
    cp doesn’t'
