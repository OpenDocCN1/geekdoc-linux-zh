  md: '# Update the Database Used by locate


    updatedb


    The first section of this chapter that introduced locate, “Search a Database of
    Filenames,” mentioned that the reason the command is so fast because it is actually
    searching a database containing your machine’s file and directory names. When
    locate is installed, it automatically itself up to scan your hard drive and update
    that database, usually in the middle of the night. That’s great for convenience,
    but not so great if you need to find a file you just placed on your computer.


    For instance, what if you install Rootkit Hunter, a program that looks for rootkits
    (used by bad guys to take control of your Linux box), and then you want to look
    at the files the program has installed? The locate command won’t be able to help
    you because it doesn’t know about those files and won’t know about them until
    its database is updated at a later time. You can, however, manually update the
    database used by locate at any time by running updateddb. Because that command
    indexes virtually every file and folder on your computer, you need to run it (or
    use sudo on distributions like K/Ubuntu that discourage root use).


    ```

    # apt-get install rkhunter

    # exit

    $ locate rkhunter

    $ su -

    # updateddb

    # exit

    $ locate rkhunter

    ```'
