  md: '# Edit Files Viewed with a Pager


    It’s true that less itself is not an editor, just a viewer, but you can pass the
    file you''re viewing with less to a text editor such as vim or nano for editing
    by pressing v. Try it. View a file with less, and then press v. Within a second
    or two, less disappears and a full-screen text editor takes its place. Make your
    edits, quit your editor, and you''re back in less with your new changes in place.


    If you aren''t happy with the editor that you find your- in when you press v,
    you can change it to one of your choice. For instance, if you want to use vim,
    run the following command before using less:


    ```

    $ export EDITOR=vim

    ```


    You only need to run that command once per session, and every time you open less
    after that, vim will be your editor. If you end the session, however, you''ll
    need to enter the export command again, which can quickly grow tedious. Better
    to add the following line to your .bashrc file, so that it''s automatically applied:


    ```

    export EDITOR=vim

    ```


