- img_proc: true
  md: '```

    $ chmod 640 libby.jpg

    $ ls -l

    -rw-r----- 1 scott family ... libby.jpg

    ```


    This example shows the key advantage of this method. What took two steps with
    alphabetical notation—first chmod go-w and then chmod o-r (or chmod g=r and then
    chmod o)=—only takes a single command with numeric notation. For this reason,
    you often see advanced Linux gurus use octal notation because it''s quicker and
    seemingly precise.


    # Change Permissions Recursively


    ```

    chmod -R

    ```


    You''ve probably noticed by now that many Linux commands allow you to apply them
    recursively to files and directories, and chmod is no different. With the -R (or
    --recursive) option, you can change the permissions of hundreds of file system
    objects in seconds—just be sure that''s what you want to do.


    ```

    $ pwd

    /home/scott/pictures/libby

    $ ls -lF

    drwxr-xr-x-- 2 scott scott ... by_pool/

    -rw-r--r-- 1 scott scott ... libby.arrowrock.jpg

    -rw-r--r-- 1 scott scott ... libby.jpg

    drwxr-xr-x-- 2 scott scott ... on_floor/

    $ ls -l *

    -rw-r--r-- 1 scott scott ... libby.arrowrock.jpg

    -rw-r--r-- 1 scott scott ... libby.jpg

    ```


    by_pool:'
