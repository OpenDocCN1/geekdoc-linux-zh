  md: 'There’s one option that wasn’t listed previously but is still a good idea to
    include when you’re figuring out how your rsync command will be structured: -n
    (or --dry-run). If you include that option, rsync runs, doesn’t actually delete
    or copy anything. This can be a lifesaver if your choices would have resulted
    in the deletion of important files. Before committing to your rsync command, especially
    if you’re including the --delete option, or yourself a favor and perform a dry
    run first!


    Now on to the options you used. The -v (or --verbose) option, coupled with --progress,
    orders rsync to tell you in detail what it’s doing at all times. You saw that
    in the results earlier in this section, in which rsync tells you what it’s deleting
    and what it’s copying. If you’re running rsync via an automated script, you don’t
    need this option, although it doesn’t hurt; if you’re running rsync interactively,
    this is an incredibly useful display of information to have in front of you because
    you can see what’s happening.


    The metadata you saw at the end of rsync’s results—the information about the number
    and size of files transferred, as well as other interesting data—appeared because
    you included the --stats option. Again, if you’re scripting rsync, this isn’t
    needed, but it’s nice to see if you’re running the program manually.


    You’ve seen the -r (or --recursive) option many times with other commands, and
    it does here what it does everywhere else. Instead of stopping in the directory,
    it tunnels down through all subdirectories, affecting everything in its path.
    Because you want to copy the entire documents directory and all of its contents,
    you want to use -r.'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# Securely Transfer and Back Up Files


    The -t (or --times) option makes rsync transfer the files'' modification times
    along with the files. If you don''t include this option, rsync cannot tell what
    it has previously transferred, and the next time you run the command, all files
    are copied over again. This is probably not the behavior you want, as it completely
    obliterates the features that make rsync so useful, be sure to include -t.


    Permissions were discussed in Chapter 7, “Ownerships and Permissions," and here
    they reappear again. The -p (or --perms) option tells rsync to update permissions
    on any files found on the target so they match what''s on the source. It''s part
    of making the backup as accurate as possible, so it''s a good idea.


    When a soft link is found on the source, the -l (or --links) option re-creates
    the link on the target. Instead of copying the actual file, which is obviously
    not what the creator of a soft link intended, the link to the file is copied over,
    again preserving the original state of the source.


    Even over a fast connection, it''s a good idea to use the -z (or --compress) option,
    as rsync uses gzip compression while transferring files. On a slow connection,
    this option is mandatory; as a fast connection, it saves you that much more time.


    In the name of security, you''re using the -e (or --rsh-ssh) option, which tells
    rsync to tunnel all of its traffic using ssh. Easy file transfers, and secure
    as well? Sign me up!


    NOTE: If you''re using ssh, why didn''t you have to provide a password? Because
    you used the technique displayed in "Securely Log In to Another Machine Without
    a Password" to remove the need to do so.'
  merge: -1
  pgno: 359
- img_proc: true
  md: 'We''ve saved the most dangerous for last: --delete. If you''re creating a mirror
    of your files, you obviously want that mirror to be as accurate as possible. That
    means deleted files on the source need to be deleted on the target as well. But
    that also means you can accidentally blow away stuff you wanted to keep. If you''re
    going to use the --delete option—and you probably will—be sure to use the -n (or
    --dry-run) option that was discussed at the beginning of your look at rsync''s
    options.


    rsync has many other options and plenty of other ways to use the command (the
    man page identifies many ways it can be used, which is impressive), but the setup
    discussed in this section will definitely get you started. Open up map rsync on
    your terminal, or search Google for “rsync tutorial,” and you''ll find a wealth
    of great information. Get to know rsync: When “Oh no!” upon deleting a file, but
    then follow it with “Whew! It’s backed up using rsync!” you’ll be glad you took
    the time to learn this incredibly versatile and useful command.


    TIP: If you want to be really safe with your data, set up rsync to run with a
    regular cron job. For instance, create a file titled backup.sh (~bin is a good
    place for it) and type in the command you''ve been using:


    ```

    $ rsync --verbose --progress --stats

    --recursive --times --perms --links

    --compress --rsh=ssh --delete

    ~/home/sam/documents/ will@wordsworth:

    ~/media/backup/documents

    ```'
