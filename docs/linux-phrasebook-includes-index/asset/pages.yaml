  md: '# Update the Database Used by locate 199


    ```

    /usr/local/rkhunter

    /usr/local/rkhunter/bin

    /usr/local/rkhunter/etc

    ```


    In the preceding commands, you first install rkhunter, the package name for Rootkit
    Hunter, and then exit root. You search for rkhunter, but it''s nowhere to be seen.
    You become root again, run updatedb de to scan your hard drive and let the locate
    database know about any changes, and then exit root. Finally, you search for rkhunter
    with locate again, and this time you''ve success.


    One thing you should be aware of, however:the speed with which updatedb works
    is directly proportional to the amount of stuff on your hard drive and the speed
    of your computer. Got a fast processor, a hard drive, and few files? Then updatedb
    will work quickly. Do you have a slow CPU, 5,400 RPM drive, and a million files?
    Expect updatedb to take quite a while. If you''re interested in knowing just how
    long it takes to run, preface updatedb with the time command, like this:


    ```

    # time updatedb

    ```


    When updatedb finishes, time tells you how long it took to get the locate database
    squared away. That is useful information to have in your head in case you ever
    need to use updatedb and you''re in a hurry.


    NOTE: The updatedb command is exactly the same as running locate -u, and updatedb
    is actually just a link to slocate, as you can easily see for yourself.


    ```

    $ ls -l /usr/bin/updateddb

    root root /usr/bin/bin/updateddb -> slocate

    ```'
