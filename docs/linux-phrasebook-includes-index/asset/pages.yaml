    # Securely Log In to Another Machine Without a Password


    ```

    ssh

    ```


    The name of this section might appear to be a misn, but it''s entirely possible
    to log in to a machine via ssh, but without providing a password. If you log in
    every day to a particular computer (and there are some boxes that I might log
    in to several times a day), the techniques in this section will make you very
    happy.


    Let''s say you want to pound to log in eliot (username: tom) without requiring
    that you type a password. To start with, create an ssh authentication key on pound
    using the following-command:


    ```

    $ ssh-keygen -t dsa

    Generating public/private dsa key pair.

    Enterter file in which to save the key

