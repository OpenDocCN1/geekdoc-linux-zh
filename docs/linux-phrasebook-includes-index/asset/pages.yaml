    # Troubleshooting Network Problems


    Linux distributions nowadays usually "just work" when it comes to networking,
    but you might still experience an issue. Following are some basic tips for trouble-shooting
    network problems.


    If your network interface appears to be up and running, but you can''t get on
    the Internet, first pinging your localhost device, at 127.0.0.1. If that doesn''t
    work, stop and go no further, because you have a seriously damaged system. If
    that works, ping your machine''s external IP address. If that doesn''t work, make
    sure networking is enabled on your machine. If it does, try pinging other machines
    on your network, assuming you have any. If you''re not successful, it''s your
    interface (assuming your router is okay). Make sure that your cables are plugged
    in (seriously). Use ifconfig (or iwconfig if it''s wireless) to verify the status
    of your interface and use ifup to turn the interface on, if necessary. Then try
    ping again.'
  merge: -1
  pgno: 338
- img_proc: true
  md: '# Troubleshooting Network Problems


    If your attempt to ping another local computer was successful, next try pinging
    your router. If you can get to other machines on your network, but you can''t
    get to your router, time to check your routing tables (refer to “Display Your
    IP Routing Table”). If you''re missing items from your routing table, add them,
    as detailed in “Change Your IP Routing Table.”


    NOTE: It''s much easier to diagnose and fix problems if you have a baseline from
    which to work. After you know a machine''s networking is correct, run route and
    save the results, so you have a stored blueprint if the routing table goes bonkers
    and you need to restore something later.


    | Site | IP Address |

    |---|---|

    | www.google.com | 72.144.203.99 |

    | www.apple.com | 17.254.0.91 |

    | www.ubuntu.com | 82.211.81.166 |

    | www.ibm.com | 129.42.16.99 |

    | www.granneman.com | 216.23.180.5 |


    NOTE: How do you get those IP addresses? You can ping the machine using your domain
    name, and ping gives you'
  merge: -1
  pgno: 339
- img_proc: true
  md: '# CHAPTER 14 Connectivity


    the IP address, or you can get the same info with traceroute. A quicker method
    is with the host command, covered earlier in “Perform DNS Lookups.”


    If you can get to the IP address, but can’t get to the domain name, you have a
    DNS problem. If you''re using DHCP, it’s time to run dhcpclient (refer to “Grab
    a New Address Using DHCP”) to renew the DNS information provided by your DHCP
    server. If you''re not using DHCP, find the DNS information you need by looking
    on your router or asking your administrator or ISP, and then add it manually as
    root to /etc/resolv.conf so that it looks like this, for example:


    ```

    nameserver 24.217.0.5

    nameserver 24.217.0.55

    ```


    That’s nameserver (a required word), followed by an IP address you’re supposed
    to use for the DNS. If your router can handle it, and you know its IP address
    (192.168.0.1, let’s say), you can always try this first:


    ```

    nameserver 192.168.0.1

    ```


    Try ifdown and then ifup and see if you’re good to go. If you’re still having
    problems, time to begin again, starting always with hardware. Is everything seated
    correctly? Is everything plugged in? After you’re sure of that, start checking
    your software. The worst-case scenario is that your hardware just doesn’t have
