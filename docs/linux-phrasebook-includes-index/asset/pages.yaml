  md: "# Access Samba Resources with an FTP-Like Client\n\nAfter you know the shares\
    \ available on a Samba server, you can log in and start using them. Use the smbclient\
    \ command, but in this format:\n\n```\nsmbclient //server/share -U username\n\
    ```\n\nYou can't just log in to a server; instead, you need to log in to a share\
    \ on that server. To access password-protected items (and it's certainly advisable\
    \ to password-protect your shares), you need to specify a user. To access the\
    \ documents share on the server ELIOT, you'd use the following:\n\n```\n$ smbclient\
    \ //eliot/documents -U scott\nPassword:\nDomain=[ELIOT] OS=[Unix] Server=[Samba\
    \ 3.0.14a-\nUbuntu]\nsmb: \\> \n```\n\nYou'll know you were successful because\
    \ you'll be at the Samba prompt, which looks like smb: \\>. Notice that you're\
    \ prompted for a password. Assuming that the password for the scott user was 123456\
    \ (a very bad password, but this is just hypothetical), you could have entered\
    \ this command instead, and you wouldn't be prompted for a password:\n\n```\n\
    $ smbclient //eliot/documents -U scott%123456\n```\n\nThis is a terrible idea,\
    \ however, because anyone looking at either your .bash_history file (discussed\
    \ in the “View Your Command-Line History” section in Chapter 11,”Your Shell”)\
    \ or the list of running"
