  md: '# Mount a Samba Filesystem


    that you don''t really own them and can''t use them

    way you want.


    Finally, workgroup=TURING specifies the workgroup,

    which is obvious enough.


    After the share is mounted, you can open your file

    manager and start browsing the contents of eliot_

    doc, start OpenOffice.org and directly open a file

    inside eliot_documents/presentations/, or open a PDF

    el elot_documents/to_print and send it to the printer.

    If you place the following lines in your machine''s

    /etc/fstab file, the share is mounted automatically.


    ```

    //eliot/documents /home/scott/eliot_documents smbfs

    --credentials=/home/scott/credentials_eliot,fmask=644,

    d-mask=755,uid=1001,gid=1001,workgroup=TURING 0 0

    ```


    CAUTION: Be very careful changing your /etc/fstab file

    because mistakes can render your system unbootable. Sure,

    you can fix that problem (see my book Hacking Knoppix for

    s tips) but it''s still a pain that would be better to avoid

    with caution and prudence. For more on the fstab file, see

    man fstab on your system.


    If you decide that you don''t want to access the Samba

    share at eliot_documents any longer, you can unmount

    it with smbmount (notice that unmount , not unmount).


    $ smbmount eliot_documents

    smbmount must be installed suid root


    How frustrating! You need to set smbmount as suid

    root, too.'
  merge: -1
