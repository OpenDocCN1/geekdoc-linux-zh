  md: '# CHAPTER 2 The Basics


    CAUTION: The rm -Rf command can destroy important files and your system.


    The classic Linux warning is not to type rm -Rf /* as root. Yes, you will erase
    your system. No, it will not be pretty. Yes, you will feel stupid.


    In general, be careful when using rm -Rf with wildcards with rm -Rf. There''s
    a huge difference between rm -Rf libby* and rm -Rf libby *. The former deletes
    everything in the working-directory that begins with libby; the latter deletes
    every file or folder named exactly libby, and then deletes everything in the directory.


    You can also inadvertently create a disaster if you mean to enter rm ~/libby/*
    and instead fat finger your command and tell the shell rm -Rf ~/libby/*. First
    the ~/libby directory leaves, and then your system begins its rapid journey towards
    nonexistence.


    Here''s one that''s bitten by a few folks trying to be clever: Never type rm -Rf
    ./** to delete a directory that begins with . and you''ll also match ... and end
    deleting everything above your current working folder as well. Oops!


    Once again: Be careful using rm -Rf when you''re a normal user. Be hyper vigilant
    and paranoid when using rm -Rf as root!


