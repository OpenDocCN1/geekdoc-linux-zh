    # Read a Command''s Specific Man Page


    ```

    man [1-8]

    ```


    You might notice in the previous listing that the first line of man''s page on
    ls references LS(1), while earlier, when you used the -k option, all the names
    of commands were also followed by numbers in parentheses. Most of them are 1,
    but one, lsof, is 8. So what''s up with all of these numbers?


    The answer is that man pages are categorized into various sections, numbered from
    1 to 8, which break down as follows (and don''t worry if you don''t recognize
    some of the example, as many of them are pretty arcane and specialized):


    +   1. General commands. Examples are cd, chmod, l1p, mkdir, and passwd.


    +   2. Low-level system calls provided by the kernel. Examples are intro and chmod.


    +   3. C library functions. Examples are beep, HTML::Parser, and Mail::Internet.'
