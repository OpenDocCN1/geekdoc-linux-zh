  md: '# Archive and Compress Files with tar and gzip


    the -r (for recursive) option, you''ll end up with 100 individually compressed
    files, each stored neatly in its original subdirectory. This is undoubtedly not
    what you want. How would you like to attach 100 .gz or .bz2 files to an email?
    Yikes!


    That''s where tar comes in. First you''d use tar to archive the directory and
    its contents (those 100 files inside various subdirectories) and then you''d use
    gzip or bzip2 to compress the resulting tarball. Because gzip is the most common
    compression program used in concert with tar, we''ll focus on that.


    You could do it this way:


    ```

    $ ls -l moby-dick/*

    scott scott 102519 moby-dick/job.txt

    scott scott 1236574 moby-dick/moby-dick.txt

    scott scott 508925 moby-dick/paradise_lost.txt

    ```


    ```

    moby-dick/bible:

    scott scott 207254 genesis.txt

    scott scott 102519 job.txt

    $ tar -cf moby.tar moby-dick/ | gzip -c >

    moby.tar.gz

    $ ls -l

    ```


    ```

    scott scott 168 moby-dick/

    scott scott 32 moby.tar.gz

    ```


    That method works, but it''s just too much typing! There''s much easier way that
    should be your default. It involves two new options for tar: -z (or --gzip), which
    invokes gzip from within tar so you don''t have to do so manually, and -v (or
    --verbose), which isn''t required here but is always useful, as it keeps you notified
    as to what tar is doing as it runs.'
