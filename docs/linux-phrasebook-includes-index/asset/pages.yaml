  md: '# Change the Owner of Files and Directories


    # # Change the Owner of Files and Directories


    ```

    chown

    ```


    Changing a file''s group is important, but it''s far more likely that you''ll
    change owners. To change groups, use chgrp; to change owners, use chown.


    ```

    $ ls -l

    -rw-r-- 1 scott scott ... libby-arrowrock.jpg

    -rw-r-- 1 scott family ... libby.jpg

    -rw-r-- 1 scott scott ... libby-on-couch.jpg

    $ chown denise libby.jpg

    $ ls -l

    -rw-r-- 1 scott scott ... libby-arrowrock.jpg

    -rw-r-- 1 denise family ... libby.jpg

    -rw-r-- 1 scott scott ... libby-on-couch.jpg

    ```


    Some of the points previously made about chgrp in "Change the Group Owning Files
    and Directories" apply to chown as well. The chgrp command uses either a user''s
    name or her numeric ID. The numeric ID for users can be seen by running cat /etc/passwd,
    which gives you something like this:


    ```

    bind:x:110:118:/var/cache/bind:/bin/false

    scott:x:1001:1001:/home/scott:/bin/bash

    ntop:x:120:120:/var/lib/ntop:/bin/false

    ```


    The first number you see is the numeric ID for that user (the second number is
    the numeric ID for the main group associated with the user).


    Also, you can only change the owner of a file if you are the current owner (or
    root, of course). That shouldn''t surprise you, but it''s good to remember nonetheless.'
  merge: -1
  pgno: 159
- img_proc: true
  md: '# CHAPTER 7 Ownerships and Permissions


    CAUTION: If you use chown -R scott *, you do not change any of the dot files in
    the directory. However, chown -R scott .* should not be used. It changes all the
    dot files in the current directory, but .* also matches .., so all the files in
    the parent directory are also changed, which is probably not what you want.


    # Change the Owner and Group of Files and Directories


    You''ve seen that you can use chgrp to change groups and chown to change owners,
    but it''s possible to use chown to kill two birds with one stone. After chown,
    specify the user and the then, separated by a colon, and finally the file or directory
    (this is one reason why you should avoid using colons in user or group names).


    ```

    $ ls -l

    -rw-r--r-- 1 scott scott ... libby.jpg

    $ chown denise:family libby.jpg

    $ ls -l

    -rw-r--r-- 1 denise family ... libby.jpg

    ```


    You can even use chown to change only a group by leaving off the user in front
    of the colon.


    ```

    $ ls -l

    -rw-r--r-- 1 scott scott ... libby.jpg

    $ chown :family libby.jpg

    $ ls -l

    -rw-r--r-- 1 scott family ... libby.jpg

    ```'
  merge: -1
  pgno: 160
- img_proc: true
  md: 'TIP: What if a user or group does have a colon in its name? Just type the backslash
    in front of that colon, which "escapes" the character and tells the system that
    it''s just a colon, and not a separator between a user and group name:

    $ chown:family\parents libby.jpg


    This works, it''s better to disallow colons in user and group names in the first
    place.


    Because chown does everything chgrp does, there’s very little reason to use chgrp,
    unless you feel like it.


    NOTE: When you separate the user and group, you can actually use either a . or
    : character. New recommendations are to stick with the :, however, because the
    . is deprecated.


    # Understand the Basics of Permissions


    Before moving on to the chmod command, which allows you to change the permissions
    associated with a file or directory, let''s review how Linux understands those
    permissions.


    NOTE: Linux systems are beginning to use a more granular and powerful permission
    system known as Access Control Lists (ACLs). At this time, however, ACLs are still
    not widely used, so they''re not covered here. For more info about ACLs, see "Access
    Control Lists" at Linux Magazine (www.linux-mag.com/2004-11/guru_01.html) and
    "An ACL GUI for Linux" at The Open Source Weblog (http://opensourceweblogsinc.com/2005/12/06/an-acl-gui-for-linux/).'
  merge: -1
  pgno: 161
- img_proc: true
  md: 'Linux understands three sets of users can work with a file or directory: the
    actual owner (also known as the file’s user), a group, and everyone else on the
    system. Each of these sets is represented by a different letter, as shown in Table
    7.1.


    # Table 7.1 Users and Their Abbreviations


    | User Group | Abbreviation |

    |---|---|

    | User (owner) | u |

    | Group | g |

    | Others | o |


    In the “List Permissions, Ownership, and More” section in Chapter 2, “The Basics,”
    you learned about long permissions, which indicate what users can do with files
    and directories. In that section, you looked at three attributes: read, write,
    execute, represented by r, w, and x, respectively. Additional possibilities are
    suid, sgid, and the sticky bit, represented by s (or S on some systems), s (or
    S), and t (or T). Keep in mind, however, that all of these item can have different
    meanings depending on whether the attribute is a file or a directory. Table 7.2
    summarizes each attribute, its abbreviation, and what it means.


    # Table 7.2 Permission Letters and Their Meanings


    | File Attribute | Abbreviation | Meaning for File | Meaning for Directory |

    |---|---|---|---|

    | Readable | r | Can view. | Can list with 1s. |

    | Writable | w | Can edit. | Can delete, rename, or add files.'
  merge: -1
  pgno: 162
- img_proc: true
  md: '# Table 7.2 continued


    | Attribute | Abbreviation | Meaning for File | Meaning for Directory |

    | --- | --- | --- | --- |

    | Executable | x | Can run as program. | Can access to read files and subdirectories
    to run files. |

    | suid | s | Any user can execute the file with owner''s permissions. | Not applicable.
    |

    | sgid | s | Any user can execute the file with group''s permissions. | All newly
    created files in a directory belong to the group owning the directory. |

    | Sticky bit | t | Tells OS that the file will be frequently executed, so it''s
    constantly kept in swap space for fast access (only older Unix Linux ignores).
    | User cannot delete or rename files, unless he is the file''s or containing directory''s
    owner. |


    NOTE: The root user can always do anything to any file or directory, so the previous
    table doesn''t apply to root.'
  merge: -1
  pgno: 163
- img_proc: true
  md: '# CHAPTER 7 Ownerships and Permissions


    Each of these file attributes is covered in more detail in the following sections.
    Now that you understand the basics, let''s look at using chmod command to change
    the permissions of files and directories.


    # Change Permissions on Files and Directories Using Alphabetic Notation


    ```

    chmod [ugo][+-=][rwx]

    ```


    You can use two notations with chmod: alphabetic or numeric. Both have their advantages,
    but it''s sometimes easier for users to learn the alphabetic system first. Basically,
    the alphabetic method uses a simple formula: the user group (u, g, o); followed
    by a plus sign (+) to grant permission, a minus sign (-) to remove permission,
    or an equal sign (=) to set exact permission; followed by the letters (r, w, x,
    s, t) representing the permission you want to alter. For instance, let''s say
    you want to allow members of the family group to be able to change a picture.


    ```

    $ ls -l

    -rw-r--r-- 1 scott family ... libby.jpg

    $ chmod g+w libby.jpg

    $ ls -l

    -rw-rw-r-- 1 scott family ... libby.jpg

    ```


    Easy enough. But what if you had wanted to give the family group and all other
    users write permission on the file?'
