    HTTP request sent, awaiting response... 200 OK

    Length: 4,533,083 (4.3M) [audio/mpeg]

    100%[========>] 4,533,083 203.20K/s ETA 00:00

    12:58:39 (166.88 KB/s) - `djbc-holdittogethernow.

    --mp3'' saved [4533083/4533083]

