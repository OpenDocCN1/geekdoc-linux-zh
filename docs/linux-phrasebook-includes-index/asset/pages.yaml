    It''s a maxim that Unix is made up of small pieces, loosely joined. Nothing embodies
    that principle more than the concept of pipes. A pipe is the | symbol on your
    keyboard, and when placed between two commands, it takes the output from the first
    and uses it as input for the second. In other words, | redirects stdout so it
    is sent to stdin for the next command.'
