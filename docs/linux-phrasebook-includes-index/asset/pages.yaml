    | TURING | <1e> - <GROUP> B <ACTIVE> |

    | MAC Address = 00-00-00-00-00-00 |


    The computer found at 192.168.1.104 has a NetBIOS name of ELIOT, and is the Master
    for the TURING workgroup. So actually you have nothing to worry about, the two
    machines are each Master for a separate Workgroup. Machines that self-identify
    as members of MILTON look to JANSMAC for information, while those that consider
    themselves part of TURING using ELIOT for the same purpose.


