  md: '# CHAPTER 3 Learning About Commands


    +   - OPTIONS—The real meat and potatoes of man:The various options for the command,
    along with short explanations of each one

    - FILES—Other files used by the command

    - AUTHOR—Who wrote the command, along with contact information

    - BUGS—Known bugs and how to report new ones

    - COPYRIGHT—This one''s obvious: Information about copyright

    - SEE ALSO—Other, related commands


    Moving around in a man page isn''t that hard. To move down a line at a time, use
    the down arrow; to move up a line at a time, use the up arrow. To jump down a
    page, press the spacebar or f (for forward); to jump up a page, press b (for backward).
    When you reach the end of a man page, man might quit itself, depositing you back
    on the shell; it might, however, simply stop at the end without quitting, in which
    case you should press q to quit the program. In fact, you can press q at any time
    to exit man if you''re not finding the information you want.


    It can be hard to find a particular item in a man page, sometimes you need to
    do a little searching. To search on a man page after it''s open, type /, followed
    by your search term, and then press Enter. If your term exists, you''ll jump to
    it; to jump to the next occurrence of the term, press Enter again (or n), and
    keep pressing Enter (or n) to jump down the screen to each occurrence; to go backward,
    press Shift+n.'
