  md: '# View a Dynamically Updated List of Running Processes


    NOTE: Why didn''t you kill PID 26751, which has a STAT Z, indicating that it''s
    a zombie? Because -9 doesn''t work on a zombie—it''s already dead, hence the kill
    command won''t work. A reboot is the only way to fix that (usually unimportant)
    problem.


    # View a Dynamically Updated List of Running Processes


    On occasion you''ll find that your Linux machine suddenly slows down, apparently
    for no reason. Something is running on your computer at full tilt, and it''s using
    up the processor. Or perhaps you''ll start running a command, only to find that
    it''s using far more of your CPU''s cycles than you thought it would. To find
    out what''s causing the problem, or if you just want to find out what''s running
    on your system''s processes, you could use ps, except that ps doesn''t update
    itself. Instead, it provides a snapshot of your system''s processes, and that''s
    it.


    The top command, on the other hand, provides a dynamically updated view of what''s
    running on your system and how many system resources each process is using. It''s
    a bit hard to see in a book because you can''t see top update its display every
    second, but here''s what you would see at one moment while top is running.


    ```

    $ top 18:05:03 up 4 days, 8:03, 1 user, load

    average: 0.83, 0.82, 0.97

    Tasks: 135 total, 3 running, 126 sleeping, 2

    stopped, 4 zombie

    ```'
