  md: '# Special Characters to Avoid in Names


    Every operating system has certain no-no’s when it comes to the characters you
    can use when naming files and directories. If you use Mac OS, the colon (:) isn’t
    allowed; Windows users, on the other hand, can’t use the backslash (\). Linux
    has its forbidden characters as well. Before looking at those, however, here are
    the characters that are always safe: numbers, letters (either uppercase or lowercase),
    dots (.), and underscores (_). Other items on your keyboard might work perfectly,
    others might work but present complications over the fact that your shell will
    try to interpret them in various ways, and some won’t work at all.


    / is never an option because that particular character is used to separate directories
    and files. Let’s say you want to keep a file listing books you want to buy. Somehow
    to manage the name file books/to_buy.txt (with a forward slash) to distinguish
    it from books/on_loan.txt and books/lost.txt. When you try to refer to your file
    at /home/scott/documents/to_buy.txt, your command isn’t going to work because
    your shell thinks that a books directory is inside the documents directory, but
    it doesn’t exist.


    Instead of a forward slash, use an underscore (as I did for the to_buy part of
    the filename), or cram the words together (as in booksToBuy.txt or BooksToBuy.txt).


    You could use a dash, forming books–to–buy.txt, but I find that underscores work
    nicely as word separators while remaining more unobtrusive than dashes. If you
    do use a dash, though, do not place it at the beginning of a filename, as in -books_to_buy.txt,
    or after a space, as in books – to buy. As you’re going to see later, if'
