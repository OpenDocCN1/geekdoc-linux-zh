  md: '# CHAPTER 12 Monitoring System Resources


    ```

    $ df -h

    Files Size Used Avail Use% Mounted on

    /dev/hda1 7.4G 5.0G 2.4G 68% /

    ntmpfs 506M 0 506M 0% /dev/shm

    tmpfs 506M 13M 494M 3% /lib/modules/

    ->2.6.12-386/volatile

    /dev/hda2 29G 24G 5.4G 82% /home

    ```


    “Human-readable” (which is a wonderful term, by the way) means that kilobytes
    are indicated by k, megabytes by M, and gigabytes by G.You can see those last
    two in the preceding listing.


    So what do the results mean? You have two partitions on the hard drive: /dev/hda1,
    mounted at /, and /dev/hda2, mounted at /home.The /home partition had 29GB allocated
    to it, of which 82% is currently used, leaving about 5.4GB free. It’s not panic
    when it comes to disk space for that partition, but a few more CDs worth of MP3s
    and it might be time to delete unnecessary files.


    The root partition, or /, has less space available: only 2.4GB out of 7.4GB. That
    partition isn’t likely to grow, however, because it contains programs and other
    relative-static files. Granted, /var is found there, and that’s software installers
    (as you’ll discover in Chapter 13,”Installing Software”) and other files that
    change size and contents, as logs are. But overall, there’s still plenty of space
    left on that partition, especially if you’re not planning to install enormous
    applications or start running a web or database server on this machine.


    The other two partitions are both labeled as tmpfs, which means they are temporary
    file systems used by the virtual memory, or swap space, on your computer. When
    you shut down your computer, the contents of those partitions disappear.'
  merge: -1
  pgno: 282
- img_proc: true
  md: '# Report File Space Used by a Directory


    > TIP: For more on tmpfs, see the Wikipedia article at http://en.wikipedia.org/wiki/TMPFS.


    # Report File Space Used by a Directory


    ```

    du

    ```


    The df command tells you about your entire hard drive, but what if you just want
    to know how much space a directory and its contents are using? The du command
    (short for *disk usage*) answers that question. First you use the cd command to
    change directories to the directory in question, and then run du.


    ```

    $ cd music

    $ du

    36582 ./Donald_Fagen

    53985 ./Clash

    145962 ./Hank_Mobley/1958_Peckin''_Time

    128200 ./Hank_Mobley/1963_No_Room_For_Squares

    108445 ./Hank_Mobley/1961_Workout

    2662185 .

    ```


    As with df, results for du are given in kilobytes, but also like df, you can view
    them in a more comprehensible fashion with the -h (or --human-readable) option.


    ```

    $ cd music

    $ du -h

    36M ./Donald_Fagen

    581M ./Clash

    143M ./Hank_Mobley/1958_Peckin''_Time

    126M ./Hank_Mobley/1963_No_Room_For_Squares

    ```'
  merge: -1
  pgno: 283
- img_proc: true
  md: '106M    ./Hank_Mobley/1961_Workout

    2.6G     .


    This output shows you the space used by each subdirectory, but directories that
    contain other directories also show the total for those contents. Look at the
    Hank_Mobley directory, which takes up 374MB on this filesystem. That total comes
    from the three subdirectories contained within Hank_Mobley (the actual amount
    in kilobytes was rounded to display megabytes, the totals are just a bit off);
    if the total for Hank_Mobley was substantially bigger than the total of its three
    subdirectories, that would mean that the Hank_Mobley directory contained within
    it several loose files that were outside of a subdirectory.


    Finally, you get a total for the entire music/ directory at the end: 2.6GB.


    # Report Just the Total Space Used for a Directory


    ```

    du -s

    ```


    If you don''t want information about all of a directory subdirectories, it''s
    possible to ask du to simply report back the grand total by using the -s option.


    ```

    $ cd music

    $ du -hs

    2.6G  .

    ```


    Short and sweet.'
