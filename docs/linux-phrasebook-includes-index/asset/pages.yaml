  md: '# Locate the Paths


    If you don''t want to navigate Info pages and instead want to search, you can
    do that as well, in two ways: By searching just the titles of all nodes for the
    Info pages about a particular command, or by searching in the actual text of all
    nodes associated with a particular command. To search the titles, enter i (for
    index because this search uses the node index created by Info), followed by your
