  md: 'Find Packages Available for Download for RPM-Based Distributions


    # Find Packages Available for Download for RPM-Based Distributions


    ```

    yum search [string]

    yum list available

    ```


    So you know how to install and remove software using yum, but how do you find
    software in the first place? Let''s say you''re interested in GIMP, the GNU Image
    Manipulation Program. You want to know if any packages related to the GIMP are
    available to install using yum. You could try using yum search gimp, but it wouldn''t
    be a good idea. That command looks matches to your search term in all package
    names, descriptions, summaries, and even the list of packagers'' names. You''ll
    end up with a list about as long as Bill Gates'' bank statement.


    A better choice is to query the list of packages available through yum (which
    would normally produce another crazy long list), but then pipe the results through
    a grep search for your term.


    ```

    $ yum list available | grep gimp

    gimp.i386             1:2.0.5-5      base

    gimp-devel.i386      1:2.0.5-5      base

    gimp-help.noarch      2:0.1.0.3      base

    gimp-print.i386      4:2.7-2        base

    ```


    Eleven results show up—now that''s workable. If you really want to perform the
    complete search, use yum search; otherwise, yum list available and grep. Most
    of the time, the latter choice is what you''ll really want, and it''ll be easier
    to work with boot.'
  merge: -1
