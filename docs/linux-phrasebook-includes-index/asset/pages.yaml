  md: '# Searching Inside Text Files for Patterns


    ```

    grep

    ```


    The locate command searches the names of files and directories, but it can''t
    search inside those files. To do that, you use grep. Essentially, you give grep
    a pattern for which you want to search, point it or a group of files (or even
    a whole hard drive) that you want to search, and then grep outputs a list of lines
    that match your pattern.


    ```

    $ grep pain three_no_more_forever.txt

    all alone and in pain

    ```


    In this case you used grep to see if the word pain was in a file containing a
    poem by Peter Von Zer Mühlen titled "Three No More Forever." Sure enough, the
    word pain is in the file, so grep prints the line containing your search term
    on the terminal. But what if you want to look in several of Peter''s poems at
    once? Wildcards to the rescue!


    ```

    $ grep pain *\nfiery inferno in space.txt:watch the paint peel,

    tree_no_more_forever.txt:all alone and in pain

    speed of morning.txt:of a Chinese painting.

    8 hour a day.txt:nice paint job too

    ghost pain.txt:Subject: ghost pain

    ```


    Notice that grep finds all uses of the string pain, including paint and painting.
    Also pay attention to'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# The Basics of Searching Inside Text Files for Patterns


    how grep shows you the filename for each file that contains the search term, as
    well as the line containing that term. So far, it''s been pretty easy to search
    inside files with grep. So it''s a perfect time to complicate matters, as you''ll
    discover in the following sections.


    # The Basics of Searching Inside Text Files for Patterns


    In the previous section, you learned that grep works by looking for the existence
    of a pattern in a group of files. Your first use of grep was extremely basic,
    but now you need to get a bit more complex, and to do that you need to understand
    the patterns for which grep searches. Those patterns are built using one of the
    most powerful tools in the Linux toolbox: regular expressions, or regex. To take
    full advantage of grep, you really need to grok regex; however, regex is a book
    all in itself, so we''re only going to cover the basics here.


    > TIP: Want to learn more about regular expressions? You can search the Internet,
    and you''ll find quite a bit of great stuff there, but *Sams Teach Yourself Regular
    Expressions in 10 Minutes* (by Ben Forta; ISBN: 0672325667) is a great book that''ll
    help you as you explore and learn regex.


    One thing that confuses new users when they start playing with grep is that the
    command has several versions, as shown in Table 9.1.'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# 202 CHAPTER 9 Finding Stuff: Easy


    Table 9.1 Different Versions of grep


    | Interpret Pattern As | grep Command Option | Separate Command |

    | --- | --- | --- |

    | Basic regular expression | grep -G (or --basic-regexp) | grep |

    | Extended regular expression | grep -E (or --extended-regexp) | egrep |

    | List of fixed strings, any of which can be matched | grep -F (or --fixed-strings)
    | fgrep |

    | Perl expression | grep -P (or --perl-regexp) | Not applicable |


    To summarize this table, grep all by itself works with basic regex. If you use
    the -E (or --extended-regexp) option or the egrep command, you use extended regex.
    Much of the time, this is probably what you''ll want to do, unless you''re performing
    a very simple search. Two more complicated choices are grep with the -F (or --fixed-strings)
    option or the fgrep command, which allows you to use multiple search terms that
    could be matched, and grep with the -P (or --perl-regexp) option, which allows
    Perl programming mavens to use that language''s sometimes unique approach to regex.


    NOTE: In this book, unless otherwise stated, we''re using plain grep for basic
    regex.


    A few possible points of confusion need to be covered before you continue. If
    you''re unclear about any of these, use the listed resources as a jumping-off
    point to learn more.'
  merge: -1
