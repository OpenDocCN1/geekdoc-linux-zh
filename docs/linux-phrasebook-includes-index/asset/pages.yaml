  md: '# 16


    # # Windows

    Networking


    Samba is one of the most important open-source projects in the world because it
    makes it possible for Linux (and other Unix machines, such as Mac OS X) to use
    Server Message Block (SMB), the networking protocol used on all Microsoft Windows
    machines. With Samba, Unix machines can connect to and mount shares on Windows
    machines, and print to shared printers connected to Windows machines. Unix machines
    can also set up Samba-based printer and file shares that Windows machines can
    connect to and use. In fact, Samba is so useful that you don''t even need Windows
    machines in the equation. You might choose to implement Samba for file and printer
    sharing on a network of Linux machines because it works so well.


    Many good books cover how to set up Samba on a server, so we are not going to
    cover administrative commands such as smbd, smbcacl, or smbpasswd (which, it is
    true, can be run by normal users to change their own passwords, but in practice
    is almost always run by the Samba server admin), or how to configure smb.conf.
    Instead, this chapter assumes you already have SMB'
  merge: -1
  pgno: 373
- img_proc: true
  md: '# CHAPTER 16 Windows Networking


    shares set up on a Windows, Linux, or Mac OS X machine. You''re instead going
    to focus on the client end of things: how to find out where those shares are,
    how to connect to those shares, and how to mount shares on your hard drive.


    TIP: Some good books on setting up and administering Samba


    +   - Sams Samba Unleashed, ISBN: 0672318628; by Steve Litt

    - Sams Teach Yourself Samba in 24 Hours, 2nd Edition, ISBN: 0672322692; by Gerald
    Carter

    - The Official Samba-3 HOWTO and Reference Guide at http://samba.org/samba/docs/man/Samba-HOWTO-Collection/
    is excellent.


    # Discover the Workgroup''s Master Browsers


    ```

    nmblookup -M [Master Browser]

    nmblookup -S [NetBIOS name]

    nmblookup -A [IP address]

    ```


    A Samba server actually uses two daemons: smbd, which makes the shares available,
    and nmbd, which maps the NetBIOS names that identify machines using SMB to their
    IP addresses, thus making it possible to find and browse SMB shares. You''re going
    to focus for now on commands that communicate with nmbd, used to gain some overall
    information about the Windows workgroup you''re querying.


    NOTE: The following examples assume you''re using a Windows workgroup, and not
    a domain. A workgroup is'
  merge: -1
  pgno: 374
- img_proc: true
  md: '# Discover the Workgroup''s Master Browsers 357


    essentially a small group of machines that choose to identify themselves as belonging
    together by self-identifying members of the workgroup. A *domain* uses a central
    server—or several servers in a large network—to authenticate computers and users
    who want to join the network. Domains are large, hairy, complicated beasts, and
    you''re best referred to the books referenced in this chapter''s introduction
    if you want to learn more about them.


    In a Windows workgroup, you need a machine that keeps track of the other members
    of the workgroup—what their SMB names and IP addresses are, for instance. That
    machine is known as the Master Browser. But which computer in a workgroup is the
    Master? The one that is elected, based on the operating system it''s running.
    The latest and greatest OS always wins, so XP will always beat 2000, which will
    always beat 98.


    When setting up a Samba server, however, it''s possible to configure things so
    the server stays out of any such election, letting other machines duke it out,
    or set things if you knew about them, but so that the server always wins any election.
    You could go ahead and start connecting to Samba shares if you knew about them,
    but it helps to know where your Master Browsers are in case you have any issues.


    To query your network for a Master Browser, run nmblookup with the -M (or --master-browser)
    option, followed by a - at the end, which basically means “find me Master Browser.”The
    problem is that you can''t use a - on the command line, or the shell thinks it''s
    the start of an option. So you need to prefix it with -- first, which tells the
    shell that the following - is in fact a -, not part of an option.'
  merge: -1
  pgno: 375
- img_proc: true
  md: '# CHAPTER 16 Windows Networking


    ```

    $ nmblookup -M ---

    querying _MSBROWSE__ on 192.168.1.255

    192.168.1.151 _MSBROWSE__<01>

    192.168.1.104 _MSBROWSE__<01>

    ```


    This isn''t good. In your case, you appear to have two Master Browsers on one
    network, which can be a real problem because different Masters might know about
    different machines at different times, causing mass fusion to users. One minute
    a user can get to a machine, and the next it''s gone. Why? Because one Master
    knows about the machine, but the other doesn''t. Try explaining that to Bob in
    Accounting. Yipes.


    To get more information about the Master, use nmblookup with the -S (or --status)
    option, which returns the SMB name host uses.


    ```

    $ nmblookup -S 192.168.1.151

    querying 192.168.1.151 on 192.168.1.255

    name_query failed to find name 192.168.1.151

    ```


    That didn''t work because -S expects a NetBIOS name instead of an IP address.
    Unfortunately, you don''t know the machine''s NetBIOS name, only its IP address.
    Actually, that''s not a problem. You simply add the -A (or --lookup-by-ip) option,
    which tells nmblookup that you''re giving it an IP address instead of a NetBIOS
    name.


    ```

    $ nmblookup -SA 192.168.1.151

    Looking up status of 192.168.1.151

    JANSMAC <00> - B <ACTIVE>

    JANSMAC <03> - B <ACTIVE>

    JANSMAC <20> - B <ACTIVE>

    ..__MSBROWSE__ <01> - <GROUP> B <ACTIVE>

    ```'
  merge: -1
