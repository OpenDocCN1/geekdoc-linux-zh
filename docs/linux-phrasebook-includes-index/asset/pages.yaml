  md: '# # Test Files That Will Be Untarred and Uncompressed


    -zvtf


    Before you take apart a tarball (whether or not it was also compressed using gzip,
    it''s a really good idea to test it. First, you''ll know if the tarball is corrupted,
    saving your-self hair pulling when files don''t seem to work. Second, you''ll
    know if the person who created the tarball thoughtfully tarred up a directory
    containing 100 files, or instead thoughtlessly tarred up 100 individual files,
    which you''re just about to spew all over your desktop. To test your tarball (once
    again assuming it was also zipped using gzip), use the -t (or --list) option.


    ```

    $ tar -zvtf moby.tar.gz

    scott/scott 0 moby-dick/

    scott/scott 102519 moby-dick/job.txt

    scott/scott 0 moby-dick/bible/

    scott/scott 207254 moby-dick/bible/genesis.txt

    scott/scott 102519 moby-dick/job.txt

    scott/scott 1236574 moby-dick/moby-dick.txt

    scott/scott 508925 moby-dick/paradise-lost.txt

    ```


    This tells you the permissions, ownership, file size, and time for each file.
    In addition, because every line begins with moby-dick/, you can see that you''re
    going to end up with a directory that contains within it all the files and subdirectories
    accompany the tarball, which is a relief.


    Be sure that the -f is the last option because after that you''re going to specify
    the name of the .tar.gz file. If you don''t, tar complains:'
