  md: '# Find Out How Your Printers Are Connected


    going to see soon, you can send a print job to a specific printer, or you can
    quickly send it to your default printer. To find out which printer is the default,
    use the lpstat command with the -d (for default) option.


    ```

    $ lpstat -d

