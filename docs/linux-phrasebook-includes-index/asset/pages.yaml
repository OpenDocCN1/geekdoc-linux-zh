- img_proc: true
  md: '# Ownerships and Permissions


    From the beginning, Linux was designed to be a multiuser system (unlike Windows,
    which was designed as a sole user OS, the source of much of its security problems
    even to this day). This meant that different users would be on the system, creating
    files, deleting directories, and reading various items. To keep everyone from
    stepping on each other’s toes and damaging the underlying operating system itself,
    a system of permissions was created early on. Mastering the art of Linux permissions
    will aid you as you use your Linux box, whether it’s a workstation used by one
    person or a server accessed by hundreds. The tools are simple, but the power they
    give you is complex. Time to jump in!'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# Change the Group Owning Files and Directories


    ```

    chgrp

    ```


    By default on virtually every Linux system, when you create a new file (or directory),
    you are that file''s owner and group. For instance, let''s say you''re going to
    write a new script that can be run on your system.


    NOTE: To save space, I''ve replaced information you''d normally see with ls -1
    by ellipses.


    ```

    $ touch new_script.sh

    $ ls -1

    -rw-r--r-- 1 scott scott ... script.sh

    ```


    NOTE: The user name and group name happen to both be "scott" on this machine,
    but that''s not necessarily the case on every machine. When a file is created,
    the user''s UID (her User ID number) becomes the owner of the file, while the
    user''s GID (her Group ID number) becomes the group for the file.


    But if you are part of an admins group on your machine and you want your script
    to be available to other members of your group so they can run it? In that case,
    you need to change your group from scott to admins using the chgrp command.


    ```

    $ chgrp admins new_script.sh

    $ ls -1

    -rw-r--r-- 1 scott admins ... script.sh

    ```'
  merge: -1
  pgno: 154
- img_proc: true
  md: 'NOTE: Yes, the script still won''t run because it''s not executable. That process
    is covered later in this chapter with chmod.


    You should know a couple of things about chgrp. When you run chgrp, you can use
    a group’s name or the group’s numeric ID. How do you find the number associated
    with a group? The easiest way is just to use cat /etc/group, the file that keeps
    track of groups on your machine, and then take a look at the results.


    ```

    $ cat /etc/group

    bind:x:1001:

    admins:x:1002:scott,alice,bob

    [list truncated for length]

    ```


    The other point to make about chgrp involves security. You can only change permissions
    for a group if you are a member of that group. In other words, Scott, Alice, or
    Bob can use chgrp to make admins a group for a file or directory, but Carol cannot
    because she’s not a member of admins.


    # Recursively Change the Group Owning a Directory


    ```

    chgrp -R

    ```


    Of course, you might not want to change the group of just one file or directory.
    If you want to change the groups of several files in a directory, you can use
    a wildcard. If you want to change the contents of a directory and everything below
    it, use the -R (or --recursive) option.'
  merge: -1
