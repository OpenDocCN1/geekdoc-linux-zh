  md: '# Mount a Samba Filesystem


    ```

    # ls /usr/bin/smbmnt

    -rwxr-xr-x 1 root root /usr/bin/smbmnt

    # chmod u+s /usr/bin/smbmnt

    # ls -l /usr/bin/smbmnt

    -rws-xr-x 1 root root /usr/bin/smbmnt

    ```


    Let''s try smbmount again.


    ```

    smbmount //eliot/documents /home/scott/eliot_

    -credentials=/home/scott/

    -credentials_eliot,fmask=644,dmask=755,uid=101,

    gid=101,workgroup=TURING

    ls -F /home/scott/eliot_documents

    presentations/ to_print/

    ```


    Let''s walk through the command you used. After smbmount, //eliot/documents specifies
    the Samba and Samba share to which you are connecting. Then comes the path to
    your mount point, /home/scott/eliot_documents. The -o option indicates that options
    are coming next.


    Instead of credentials=/home/scott/credentials_eliot, you could have used any
    of the following:


    +   - username=scott,password=123456

    - username=%123456

    - username=scott


    The first and second choices are completely unsafe because the password would
    now show up in .bash_history and ps. Don''t do that! The final choice prompts
    you for a password, which would be safe because the password wouldn''t appear
    in either .bash_history or ps. But you''re trying to automate the process of mounting
    the Samba share, so the last choice wouldn''t work, either.'
