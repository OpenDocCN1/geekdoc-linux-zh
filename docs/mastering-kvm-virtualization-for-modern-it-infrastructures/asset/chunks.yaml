    \ --vcpus=2 --memory=2048 --cdrom=/path/to/ubuntu-20.04-desktop-amd64.iso --disk\
    \ size=20`\n\nKey options for `virt-install`:\n* `--name`: Specifies the name\
    \ of the VM\n* `--vcpus`: Sets the number of virtual CPUs\n* `--memory`: Allocates\
