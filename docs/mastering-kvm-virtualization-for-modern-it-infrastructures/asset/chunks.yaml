  trans: "\n\n使用 `virsh` 克隆一个虚拟机：\n\n```\nvirsh dumpxml SOURCE_VM > new_vm.xml\n```\n\
    \n`vim new_vm.xml` # 编辑 XML 以更改名称、UUID 和其他细节\n\n`virsh define new_vm.xml`\n\n\
    使用 CLI 工具具有多个优势：\n\n* 脚本化和自动化 \n* 远程管理能力\n* 对虚拟机配置进行精粒度控制\n* 能够高效地管理大量虚拟机\n\n\
    然而，与图形化工具相比，它们需要对 KVM 内部原理有更多了解，且学习曲线可能更陡峭。\n\n## 配置虚拟机\n\n虚拟机的妥善配置对于获得最佳性能和资源利用利用率至关重要。本节将涵盖\
    \ CPU、内存和存储等资源的分配，以及虚拟机的网络配置。\n\n### 分配资源（CPU、内存、存储）\n\n高效的资源分配可以确保虚拟机拥有必要的计算能力，同时保持系统的整体性能。\n\
    \n#### CPU 分配\n\nKVM 允许为虚拟机灵活地分配 CPU，包括：\n\n1. `vCPU` 数量：分配给虚拟机的虚拟 CPU 数量。\n2.\
    \ `CPU pinning`（CPU 绑定）：将 `vCPUs` 与特定的物理 CPU 核心关联。\n3. `CPU model`：向虚拟机暴露特定的 CPU\
    \ 特性。\n\n使用 `virsh` 修改 CPU 分配：\n\n```\nvirsh setvcpus VM_NAME VCPU_COUNT --config\
    \ --maximum\n```\n\n```\nvirsh setvcpus VM_NAME VCPU_COUNT --config\n```\n\n可以在虚拟机的\
    \ XML 配置中配置 `CPU pinning`：\n\n```xml\n<vcpu placement='static'>4</vcpu>\n<cputune>\n\
    \  <vcpupin vcpu='0' cpuset='0'/>\n  <vcpupin vcpu='1' cpuset='1'/>\n  <vcpupin\
    \ vcpu='2' cpuset='2'/>\n  <vcpupin vcpu='3' cpuset='3'/>\n</cputune>\n```\n\n\
    #### 内存分配\n\n妥当的内存分配对虚拟机性能至关重要。KVM 支持：\n\n1. 静态内存分配\n2. 动态内存分配（内存气球技术）\n\n使用 `virsh`\
    \ 修改内存分配：\n\n```\nvirsh setmaxmem VM_NAME SIZE --config\n```\n\n```\nvirsh setmem\
    \ VM_NAME SIZE\n```\n\n在虚拟机的 XML 配置中启用内存气球：\n\n```xml\n<memballoon model='virtio'>\n\
    \  <stats period='10'/>\n</memballoon>\n```\n\n#### 存储分配\n\nKVM 提供了多种存储选项：\n\n\
    1. 基于文件的存储（`qcow2`, `raw`）\n2. 块设备存储\n3. 网络存储（`iSCSI`, `NFS`）\n\n使用 `virsh` 为虚拟机添加新磁盘：\n\
    \n```\nvirsh attach-disk VM_NAME /path/to/disk.qcow2 vdb --cache none\n```\n\n\
    修改存储的 XML 配置：\n\n```xml\n<disk type='file' device='disk'>\n  <driver name='qemu'\
    \ type='qcow2'/>\n  <source file='/path/to/disk.qcow2'/>\n  <target dev='vda'\
    \ bus='virtio'/>\n</disk>\n```\n\n### 网络配置\n\n妥当的网络配置对于虚拟机的连性和性能至关重要。KVM 支持多种网络模式：\n\
    \n1. 桥接模式 (Bridge mode)\n2. NAT 模式\n3. 路由模式 (Routed mode)\n4. 隔离模式 (Isolated mode)\n\
    \n#### 桥接模式\n\n桥接模式将虚拟机直接连接到主机的网络，使其在网络上像一台独立的物理机器。\n\n在主机上创建桥接接口：\n\n```bash\n\
    nmcli con add type bridge ifname br0\n```\n\n```bash\nnmcli con add type bridge-slave\
    \ ifname eth0 master br0\n```\n\n在虚拟机的 XML 中配置使用桥接：\n\n```xml\n<interface type='bridge'>\n\
    \  <source bridge='br0'/>\n  <model type='virtio'/>\n</interface>\n```\n\n####\
    \ NAT 模式\n\nNAT（网络地址翻译）模式允许虚拟机共享主机的 IP 地址进行出流量。\n\n创建一个 NAT 网络：\n\n```bash\nvirsh\
    \ net-define /etc/libvirt/qemu/networks/default.xml\n```\n\n```bash\nvirsh net-start\
    \ default\n```\n\n```bash\nvirsh net-autostart default\n```\n\n在虚拟机的 XML 中配置使用\
    \ NAT：\n\n```xml\n<interface type='network'>\n  <source network='default'/>\n\
    \  <model type='virtio'/>\n</interface>\n```\n\n#### 路由模式\n\n路由模式为虚拟机分配与主机不同子网的\
    \ IP 地址，并在它们之间路由流量。\n\n创建一个路由网络 XML 文件：\n\n```xml\n<network>\n  <name>routed</name>\n\
    \  <forward mode='route'/>\n  <bridge name='virbr1' stp='on' delay='0'/>\n  <ip\
    \ address='192.168.100.1' netmask='255.255.255.0'>\n    <dhcp>\n      <range start='192.168.100.2'\
    \ end='192.168.100.254'/>\n    </dhcp>\n  </ip>\n</network>\n```\n\n定义并启动网络：\n\
    \n```bash\nvirsh net-define routed.xml\n```\n\n```bash\nvirsh net-start routed\n\
    ```\n\n```bash\nvirsh net-autostart routed\n```\n\n#### 隔离模式\n\n隔离模式为虚拟机创建一个无外部访问的私有网络。\n\
    \n创建一个隔离网络 XML 文件：\n\n```xml\n<network>\n  <name>isolated</name>\n  <forward mode='route'/>\n\
