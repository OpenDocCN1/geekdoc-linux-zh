    \ 10.0.0.1:80 check server2 10.0.0.2:80 check\nruncmd:\n  - systemctl start haproxy\n\
    \  - systemctl enable haproxy\n```\nThese examples demonstrate the flexibility\
    \ and power of `Cloud-init` in automating VM provisioning and configuration. By\
