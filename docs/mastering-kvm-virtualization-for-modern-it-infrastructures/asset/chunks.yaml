    1.  Enable IOMMU support in the host''s BIOS and kernel


    2.  Identify the PCI device to pass through


    3.  Modify the VM''s XML configuration to include the device


    <hostdev  mode=''subsystem''  type=''pci''  managed=''yes''>


      <source>


