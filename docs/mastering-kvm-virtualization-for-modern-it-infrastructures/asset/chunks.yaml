  trans: "\n\n此命令安装以下内容：\n\n*   `qemu-kvm`: 主 KVM 软件包\n*   `libvirt-daemon-system`:\
    \ `libvirt` 守护进程和系统配置文件\n*   `libvirt-clients`: 用于 `libvirt` 的客户端库和工具\n*   `bridge-utils`:\
    \ 配置 Linux 以太网桥接的工具\n*   `virtinst`: 一组用于创建虚拟机的命令行工具\n*   `virt-manager`: 用于管理虚拟机的图形化工具（服务器安装中可选）\n\
    \n### 3. 将您的用户添加到 KVM 组\n\n为了允许您的用户管理虚拟机，请将其添加到 `libvirt` 和 `kvm` 组：\n\n`sudo\
    \ usermod -aG libvirt $USER` `sudo usermod -aG kvm $USER`\n\n注销并重新登录以使用户组权限的更改生效。\n\
    \n### 4. 启动并启用 libvirt 守护进程\n\n确保 `libvirt` 守护进程正在运行并已设置为开机自启动：\n\n`sudo systemctl\
    \ start libvirtd`\n\n`sudo systemctl enable libvirtd`\n\n### 5. 配置网络（可选）\n\n默认情况下，KVM\
    \ 为虚拟机设置了 NAT 网络。如果您想使用桥接网络或创建自定义网络，则需要单独进行配置。以下是设置桥接网络的示例：\n\na. 如果尚未安装，请安装 `netplan`\
    \ 软件包：\n\n```bash\nsudo apt install netplan.io\n```\n\nb. 创建一个新的 Netplan 配置文件：\n\
    \n```bash\nsudo nano /etc/netplan/01-netcfg.yaml\n```\n\nc. 添加以下配置（根据您的网络进行调整）：\n\
    \n```yaml\nnetwork:\n  version: 2\n  renderer: networkd\n  ethernets:\n    enp0s3:\n\
    \        dhcp4: no\n  bridges:\n      br0:\n        interfaces: [enp0s3]\n   \
    \     dhcp4: yes\n```\n\nd. 应用新配置：\n\n```bash\nsudo netplan apply\n```\n\n###\
    \ 6. 安装额外工具（可选）\n\n根据您的需求，您可能想要安装额外的工具来管理 KVM：\n\n`sudo apt install virt-top libguestfs-tools`\n\
    \n*   `virt-top`: 一个类似 top 的工具，用于显示虚拟域的统计信息\n*   `libguestfs-tools`: 一组用于访问和修改虚拟机磁盘镜像的工具\n\
    \n### 验证安装\n\n完成安装后，验证 KVM 是否已正确设置并准备就绪非常。以下是检查 KVM 安装的步骤：\n\n#### 1. 验证 KVM 内核模块\n\
    \n检查 KVM 内核模块是否加载：\n\n```bash\nlsmod | grep kvm\n```\n\n您应该能看到包含 `kvm_intel`（Intel\
    \ CPU）或 `kvm_amd`（AMD CPU）的输出。\n\n#### 2. 检查 libvirt 状态\n\n验证 `libvirt` 守护进程正在运行：\n\
    \n`sudo systemctl status libvirtd`\n\n输出应显示该服务处于活动并运行状态。\n\n#### 3. 验证 KVM 设备\n\
    \n检查 KVM 设备文件是否存在：\n\n```bash\nls -l /dev/kvm\n```\n\n您应该能看到列出的 `/dev/kvm` 设备文件。\n\
    \n#### 4. 测试虚拟机创建\n\n尝试创建一个较小的虚拟机以确保一切运行正常：\n\n`sudo virt-install --name=testvm\
    \ --vcpus=1 --memory=1024 --cdrom=/path/to/iso --disk size=5`\n\n将 `/path/to/iso`\
    \ 替换为 Linux ISO 文件的路径。如果命令运行运行并开始创建虚拟机，则说明 KVM 安装工作正常。\n\n#### 5. 检查可用网络\n\n列出可用的虚拟网络：\n\
    \n`sudo virsh net-list --all`\n\n您应该至少看到列出的默认网络。\n\n#### 6. 验证硬件加速\n\n检查是否有硬件加速可用：\n\
    \n`kvm-ok`\n\n如果 KVM 配置恰当，您应该会看到一条指示可以使用 KVM 加速的消息。\n\n## 结论\n\n在本章中，我们涵盖了虚拟化的基础知识，介绍了不同类型的虚拟化技术，并强调了使用\
    \ KVM 的优势。我们还介绍了设置支持 KVM 的 Linux 环境的过程，并提供了在 Ubuntu Server 系统上安装和验证 KVM 的详细指南。\n\
    \n现在 KVM 已安装并验证，您准备好开始创建和管理虚拟机了。在下一章中，我们将深入研究 KVM 的架构，并探索它如何与 Linux 内核和硬件交互以提供高效的虚拟化。\n\
    \n请记住，虽然本指南侧重于 Ubuntu Server，但原理和通用步骤也适用于其他 Linux 发行版。如果您使用的是不同的 Linux 版本，请务必参考您发行版的文档以获取特定的包名和命令。\n\
    \n随着学习的深入，您将更深入地理解 KVM 的能力，并学会利用其功能为各种用例构建稳健、可扩展的虚拟化解决方案。\n\n"
- fmt: "\nTo clone a VM using `virsh`:\n\n```\nvirsh dumpxml SOURCE_VM > new_vm.xml\n\
    ```\n\n`vim new_vm.xml` # Edit the XML to change name, UUID, and other details\n\
    \n`virsh define new_vm.xml`\n\nUsing CLI tools offers several benefits:\n\n* Scriptability\
    \ and automation \n* Remote management capabilities\n* Fine-grained control over\
    \ VM configurations\n* Efficient for managing large numbers of VMs\n\nHowever,\
    \ they require more knowledge of KVM internals and may have a steeper learning\
    \ curve compared to graphical tools.\n\n## Configuring Virtual Machines\n\nProper\
    \ configuration of virtual machines is crucial for optimal performance and resource\
    \ utilization. This section will cover the allocation of resources such as CPU,\
    \ memory, and storage, as well as network configuration for VMs.\n\n### Allocating\
    \ resources (CPU, memory, storage)\n\nEfficient resource allocation ensures that\
    \ VMs have the necessary computing power while maintaining overall system performance.\n\
    \n#### CPU Allocation\n\nKVM allows flexible CPU allocation to VMs, including:\n\
    \n1. `vCPU` count: The number of virtual CPUs assigned to a VM.\n2. `CPU pinning`:\
    \ Associating `vCPUs` with specific physical CPU cores.\n3. `CPU model`: Exposing\
    \ specific CPU features to the VM.\n\nTo modify CPU allocation using `virsh`:\n\
    \n```\nvirsh setvcpus VM_NAME VCPU_COUNT --config --maximum\n```\n\n```\nvirsh\
    \ setvcpus VM_NAME VCPU_COUNT --config\n```\n\n`CPU pinning` can be configured\
    \ in the VM's XML configuration:\n\n```xml\n<vcpu placement='static'>4</vcpu>\n\
    <cputune>\n  <vcpupin vcpu='0' cpuset='0'/>\n  <vcpupin vcpu='1' cpuset='1'/>\n\
    \  <vcpupin vcpu='2' cpuset='2'/>\n  <vcpupin vcpu='3' cpuset='3'/>\n</cputune>\n\
    ```\n\n#### Memory Allocation\n\nProper memory allocation is critical for VM performance.\
    \ KVM supports:\n\n1. Static memory allocation\n2. Dynamic memory allocation (memory\
    \ ballooning)\n\nTo modify memory allocation using `virsh`:\n\n```\nvirsh setmaxmem\
    \ VM_NAME SIZE --config\n```\n\n```\nvirsh setmem VM_NAME SIZE\n```\n\nEnable\
    \ memory ballooning in the VM's XML configuration:\n\n```xml\n<memballoon model='virtio'>\n\
    \  <stats period='10'/>\n</memballoon>\n```\n\n#### Storage Allocation\n\nKVM\
    \ offers various storage options:\n\n1. File-based storage (`qcow2`, `raw`)\n\
    2. Block device storage\n3. Network storage (`iSCSI`, `NFS`)\n\nTo add a new disk\
    \ to a VM using `virsh`:\n\n```\nvirsh attach-disk VM_NAME /path/to/disk.qcow2\
    \ vdb --cache none\n```\n\nModifying the XML configuration for storage:\n\n```xml\n\
    <disk type='file' device='disk'>\n  <driver name='qemu' type='qcow2'/>\n  <source\
    \ file='/path/to/disk.qcow2'/>\n  <target dev='vda' bus='virtio'/>\n</disk>\n\
    ```\n\n### Network Configuration\n\nProper network configuration is essential\
    \ for VM connectivity and performance. KVM supports various networking modes:\n\
    \n1. Bridge mode\n2. NAT mode\n3. Routed mode\n4. Isolated mode\n\n#### Bridge\
    \ Mode\n\nBridge mode connects the VM directly to the host's network, making it\
    \ appear as a separate physical machine on the network.\n\nTo create a bridge\
    \ interface on the host:\n\n```bash\nnmcli con add type bridge ifname br0\n```\n\
    \n```bash\nnmcli con add type bridge-slave ifname eth0 master br0\n```\n\nConfigure\
    \ the VM to use the bridge in its XML:\n\n```xml\n<interface type='bridge'>\n\
    \  <source bridge='br0'/>\n  <model type='virtio'/>\n</interface>\n```\n\n####\
    \ NAT Mode\n\nNAT (Network Address Translation) mode allows VMs to share the host's\
    \ IP address for outbound traffic.\n\nTo create a NAT network:\n\n```bash\nvirsh\
    \ net-define /etc/libvirt/qemu/networks/default.xml\n```\n\n```bash\nvirsh net-start\
    \ default\n```\n\n```bash\nvirsh net-autostart default\n```\n\nConfigure the VM\
    \ to use NAT in its XML:\n\n```xml\n<interface type='network'>\n  <source network='default'/>\n\
    \  <model type='virtio'/>\n</interface>\n```\n\n#### Routed Mode\n\nRouted mode\
    \ assigns VMs IP addresses from a different subnet than the host, routing traffic\
    \ between them.\n\nCreate a routed network XML file:\n\n```xml\n<network>\n  <name>routed</name>\n\
    \  <forward mode='route'/>\n  <bridge name='virbr1' stp='on' delay='0'/>\n  <ip\
    \ address='192.168.100.1' netmask='255.255.255.0'>\n    <dhcp>\n      <range start='192.168.100.2'\
    \ end='192.168.100.254'/>\n    </dhcp>\n  </ip>\n</network>\n```\n\nDefine and\
    \ start the network:\n\n```bash\nvirsh net-define routed.xml\n```\n\n```bash\n\
    virsh net-start routed\n```\n\n```bash\nvirsh net-autostart routed\n```\n\n####\
    \ Isolated Mode\n\nIsolated mode creates a private network for VMs with no external\
    \ access.\n\nCreate an isolated network XML file:\n\n```xml\n<network>\n  <name>isolated</name>\n\
    \  <bridge name='virbr2' stp='on' delay='0'/>\n  <ip address='192.168.200.1' netmask='255.255.255.0'>\n\
    \    <dhcp>\n      <range start='192.168.200.2' end='192.168.200.254'/>\n    </dhcp>\n\
    \  </ip>\n</network>\n```\n\nDefine and start the network:\n\n```bash\nvirsh net-define\
    \ isolated.xml\n```\n\n```bash\nvirsh net-start isolated\n```\n\n```bash\nvirsh\
    \ net-autostart isolated\n```\n\n## Managing Virtual Machine States\n\nEffective\
    \ management of VM states is crucial for maintaining a healthy virtualization\
    \ environment. This section covers starting, stopping, pausing, and snapshotting\
    \ VMs, as well as backing up VMs.\n\n### Starting, stopping, pausing, and snapshotting\
    \ VMs\n\n#### Starting VMs\n\nVMs can be started using `virt-manager` or the `virsh`\
    \ command:\n\n```bash\nvirsh start VM_NAME\n```\n\nTo configure a VM to start\
    \ automatically on host boot:\n\n```bash\nvirsh autostart VM_NAME\n```\n\n####\
    \ Stopping VMs\n\nThere are two ways to stop a VM:\n\n1. Graceful shutdown:\n\
    ```bash\nvirsh shutdown VM_NAME\n```\n\n2. Forceful stop (equivalent to pulling\
    \ the power):\n```bash\nvirsh destroy VM_NAME\n```\n\n#### Pausing VMs\n\nPausing\
    \ a VM suspends its execution while keeping its state in memory:\n\n```bash\n\
    virsh suspend VM_NAME\n```\n\nTo resume a paused VM:\n\n```bash\nvirsh resume\
    \ VM_NAME\n```\n\n#### Snapshotting VMs\n\nSnapshots capture the state of a VM\
    \ at a point time, allowing you to revert to that state.\n\nTo create a snapshot:\n\
    \n```bash\nvirsh snapshot-create-as VM_NAME SNAPSHOT_NAME \"description\"\n```\n\
    \nTo list available snapshots:\n\n```bash\nvirsh snapshot-list VM_NAME\n```\n\n\
    To revert to a snapshot:\n\n```bash\nvirsh snapshot-revert VM_NAME SNAPSHOT_NAME\n\
    ```\n\n### Backing up and restoring VMs\n\nRegular backups are essential for protecting\
    \ VM data and ensuring quick recovery in case of failures.\n\n### Backing up VMs\n\
    \n1. Offline backup:\n- Shut down the VM\n- Copy the disk image and XML configuration\n\
    \n```bash\nvirsh dumppxml VM_NAME > vm_config.xml\n```\n\n```bash\ncp /var/lib/libvirt/images/VM_NAME.qcow2\
    \ /backup/VM_NAME.qcow2\n```\n\n2. Live backup using `qemu-img`:\n- Create a snapshot\
    \ of the running VM\n- Back up the snapshot\n- Merge the snapshot back into the\
