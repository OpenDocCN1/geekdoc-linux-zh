    \ version`\n\n* 显示 virsh 和 libvirt 的版本\n* 用法：`virsh version`\n\n## virt-manager\
    \ 命令\n\n`virt-manager` 是一个管理虚拟机的图形用户界面。虽然它没有像 `virsh` 那样的命令行界面，但可以通过命令行带有各种选项启动它。\n\
    \n### 1. 启动 `virt-manager`\n\n* 打开 `virt-manager` 主窗口\n* 用法：`virt-manager`\n\n\
    ### 2. 连接到远程主机\n\n* 打开 `virt-manager` 并连接到远程 libvirt 主机\n* 用法：`virt-manager -c\
    \ qemu+ssh://user@hostname/system`\n\n### 3. 打开“新建虚拟机”向导\n\n* 启动 `virt-manager`\
    \ 并立即打开“创建新的虚拟机”向导\n* 用法：`virt-manager --show-domain-creator`\n\n### 4. 显示域的详情\n\
    \n* 打开 `virt-manager` 并显示特定域的详情窗口\n* 用法：`virt-manager --show-domain-editor <domain>`\n\
    \n### 5. 显示主机详情\n\n* 打开 `virt-manager` 并显示主机详情窗口\n* 用法：`virt-manager --show-host-summary`\n\
    \n### 6. 调试模式\n\n* 以调试模式打开 `virt-manager`\n* 用法：`virt-manager --debug`\n\n###\
    \ 7. 不派生\n\n* 防止 `virt-manager` 派生进程\n* 用法：`virt-manager --no-fork`\n\n## 高级用法\n\
    \n### 1. `virsh dump`\n\n* 将域的核心转转储到文件中以进行分析\n* 用法：`virsh dump <domain> <filename>\
    \ [--live] [--crash]`\n* 示例：`virsh dump ubuntu20.04 ubuntu20.04.dump --live`\n\
    \n### 2. `virsh dumpxml`\n\n* 转储域的 XML 配置\n* 用法：`virsh dumpxml <domain>`\n* 示例：`virsh\
    \ dumpxml ubuntu20.04`\n\n### 3. `virsh edit`\n\n* 直接编辑域的 XML 配置\n* 用法：`virsh\
    \ edit <domain>`\n* 示例：`virsh edit ubuntu20.04`\n\n### 4. `virsh define-from`（根据上下文更正）\n\
    \n* 从 XML 文件创建域\n* 用法：`virsh define-from <xml_file> <name>`\n* 示例：`virsh define-from\
    \ /path/to/network.xml new-domain`\n\n### 5. `virsh update`\n\n* 使用 XML 文件更新域\n\
    * 用法：`virsh update <domain> <xml_file>`\n* 示例：`virsh update ubuntu20.04 config.xml`\n\
    \n### 6. `virsh migrate`\n\n* 将域迁移到另一主机\n* 用法：`virsh migrate <domain> <destination>`\n\
    * 示例：`virsh migrate ubuntu20.04 qemu+ssh://user@system`\n\n### 7. `virsh migrate-downtime`\n\
    \n* 设置迁移期间允许的最大停机时间\n* 用法：`virsh migrate-downtime <domain> <downtime>`\n* 示例：`virsh\
    \ migrate-downtime ubuntu20.04 500`\n\n### 8. `virsh attach-interface`\n\n* 为域附加新的网络接口\n\
    * 用法：`virsh attach-interface <domain> <type> <source>`\n* 示例：`virsh attach-interface\
    \ ubuntu20.04 bridge br0`\n\n### 9. `virsh detach-interface`\n\n* 从域移除网络接口\n*\
    \ 用法：`virsh detach-interface <domain> <type> <mac-address>`\n* 示例：`virsh detach-interface\
    \ ubuntu20.04 bridge 52:54:00:12:34:56`\n\n### 10. `virsh attach-disk`\n\n* 为域附加新的存储设备\n\
    * 用法：`virsh attach-disk <domain> <source> <target>`\n* 示例：`virsh attach-disk ubuntu20.04\
    \ /path/to/disk.qcow2 vdb`\n\n### 11. `virsh detach-disk`\n\n* 从域移除存储设备\n* 用法：`virsh\
    \ detach-disk <domain> <target>`\n* 示例：`virsh detach-disk ubuntu20.04 vdb`\n\n\
    ### 12. `virsh blkiotune`\n\n* 为域设置块 I/O 参数\n* 用法：`virsh blkiotune <domain> [--weight\
    \ <weight>] [--device-weight <device,weight>]`\n* 示例：`virsh blkiotune ubuntu20.04\
    \ --weight 800 --device-weight /dev/sda,1000`\n\n### 13. `virsh memtune`\n\n*\
    \ 为域设置内存参数\n* 用法：`virsh memtune <domain> [--hard-limit <number>] [--soft-limit\
    \ <number>] [--swap-hard-limit <number>]`\n* 示例：`virsh memtune ubuntu20.04 --hard-limit\
    \ 4G --soft-limit 2G`\n\n### 14. `virsh schedinfo`\n\n* 显示或设置域的调度参数\n* 用法：`virsh\
    \ schedinfo <domain> [--set <parameter=value>]`\n* 示例：`virsh schedinfo ubuntu20.04\
    \ --set cpu_shares=2048`\n\n### 15. `virsh qemu-monitor-command`\n\n* 向 QEMU 监控器发送命令\n\
    * 用法：`virsh qemu-monitor-command <domain> <command>`\n\n"
