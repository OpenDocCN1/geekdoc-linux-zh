- fmt: "\nThis command installs:\n\n*   `qemu-kvm`: The main KVM package\n*   `libvirt-daemon-system`:\
    \ The `libvirt` daemon and system configuration files\n*   `libvirt-clients`:\
    \ Client-side libraries and utilities for `libvirt`\n*   `bridge-utils`: Utilities\
    \ for configuring Linux Ethernet bridges\n*   `virtinst`: A set of command-line\
    \ tools for creating virtual machines\n*   `virt-manager`: A graphical tool for\
    \ managing virtual machines (optional for server installations)\n\n### 3. Add\
    \ Your User to the KVM Groups\n\nTo allow your user to manage virtual machines,\
    \ add it to the `libvirt` and `kvm` groups:\n\n`sudo usermod -aG libvirt $USER`\
    \ `sudo usermod -aG kvm $USER`\n\nLog out and log back in for the group changes\
    \ to take effect.\n\n### 4. Start and Enable the libvirt Daemon\n\nEnsure that\
    \ the `libvirt` daemon is running and set to start at boot:\n\n`sudo systemctl\
    \ start libvirtd`\n\n`sudo systemctl enable libvirtd`\n\n### 5. Configure Networking\
    \ (Optional)\n\nBy default, KVM sets up a NAT network for virtual machines. If\
    \ you want to use bridged networking or create custom networks, you'll need to\
    \ configure them separately. Here's an example of setting up a bridge network:\n\
    \na. Install the `netplan` package if it's not already installed:\n\n```bash\n\
    sudo apt install netplan.io\n```\n\nb. Create a new Netplan configuration file:\n\
    \n```bash\nsudo nano /etc/netplan/01-netcfg.yaml\n```\n\nc. Add the following\
    \ configuration (adjust according to your network):\n\n```yaml\nnetwork:\n  version:\
    \ 2\n  renderer: networkd\n  ethernets:\n    enp0s3:\n        dhcp4: no\n  bridges:\n\
    \      br0:\n        interfaces: [enp0s3]\n        dhcp4: yes\n```\n\nd. Apply\
    \ the new configuration:\n\n```bash\nsudo netplan apply\n```\n\n### 6. Install\
    \ Additional Tools (Optional)\n\nDepending on your needs, you might want to install\
    \ additional tools for managing KVM:\n\n`sudo apt install virt-top libguestfs-tools`\n\
    \n*   `virt-top`: A top-like utility for showing stats of virtualized domains\n\
    *   `libguestfs-tools`: A set of tools for accessing and modifying virtual machine\
    \ disk images\n\n### Verifying the Installation\n\nAfter completing the installation,\
    \ it's important to verify that KVM is set up correctly and ready to use. Here\
    \ are some steps to check your KVM installation:\n\n#### 1. Verify KVM Kernel\
    \ Modules\n\nCheck if the KVM kernel modules are loaded:\n\n```bash\nlsmod | grep\
    \ kvm\n```\n\nYou should see output including `kvm_intel` (for Intel CPUs) or\
    \ `kvm_amd` (for AMD CPUs).\n\n#### 2. Check libvirt Status\n\nVerify that the\
    \ `libvirt` daemon is running:\n\n`sudo systemctl status libvirtd`\n\nThe output\
    \ should show that the service is active and running.\n\n#### 3. Verify KVM Device\n\
    \nCheck if the KVM device file exists:\n\n```bash\nls -l /dev/kvm\n```\n\nYou\
    \ should see the `/dev/kvm` device file listed.\n\n#### 4. Test Virtual Machine\
    \ Creation\n\nTry creating a small virtual machine to ensure everything is working:\n\
    \n`sudo virt-install --name=testvm --vcpus=1 --memory=1024 --cdrom=/path/to/iso\
    \ --disk size=5`\n\nReplace `/path/to/iso` with the path to a Linux ISO file.\
    \ If the command runs without errors and starts creating a VM, your KVM installation\
    \ is working correctly.\n\n#### 5. Check Available Networks\n\nList the available\
    \ virtual networks:\n\n`sudo virsh net-list --all`\n\nYou should see at least\
    \ the default network listed.\n\n#### 6. Verify Hardware Acceleration\n\nCheck\
    \ if hardware acceleration is available:\n\n`kvm-ok`\n\nIf KVM is properly configured,\
    \ you should see a message indicating that KVM acceleration can be used.\n\n##\
    \ Conclusion\n\nIn this chapter, we've covered the fundamentals of virtualization,\
    \ introduced the different types of virtualization technologies, and highlighted\
    \ the benefits of using KVM. We've also walked through the process of setting\
    \ up a Linux environment with KVM support and provided a detailed guide for installing\
    \ and verifying KVM on an Ubuntu Server system.\n\nWith KVM now installed and\
    \ verified, you're ready to start creating and managing virtual machines. In the\
    \ next chapter, we'll dive deeper into KVM's architecture and explore how it interacts\
    \ with the Linux kernel and hardware to provide efficient virtualization.\n\n\
    Remember that while this guide focuses on Ubuntu Server, the principles and general\
    \ steps apply to other Linux distributions as well. Always refer to your distribution's\
    \ documentation for specific package names and commands if you're using a different\
    \ Linux flavor.\n\nAs you progress through this book, you'll gain a deeper understanding\
    \ of KVM's capabilities and learn to leverage its features to build robust, scalable\
    \ virtualization solutions for various use cases, from development environments\
    \ to production deployments.\n\n# Chapter 2: Managing Virtual Machines\n\n## Creating\
    \ Virtual Machines\n\nThe creation of virtual machines (VMs) is a fundamental\
    \ task in KVM virtualization. This section will explore two primary methods for\
    \ creating VMs: using the graphical `virt-manager` tool and employing command-line\
    \ interfaces (CLI) tools such as `virt-install` and `virsh`.\n\n### Using virt-manager\n\
    \n`virt-manager`, also known as Virtual Machine Manager, is a user-friendly graphical\
    \ interface for managing KVM virtual machines. It provides an intuitive way to\
    \ create, configure, and manage VMs, making it an excellent choice for users who\
    \ prefer a visual approach.\n\nTo create a new VM using `virt-manager`:\n\n1.\
    \ Launch `virt-manager` by running `virt-manager` in the terminal or selecting\
    \ it from your application menu.\n2. Click on the \"Create a new virtual machine\"\
