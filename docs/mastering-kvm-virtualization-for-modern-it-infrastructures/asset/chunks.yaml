    \n```\n\n```bash\nqemu-img convert -f qcow2 -O qcow2 /var/lib/libvirt/images/VM_NAME.qcow2\
    \ /backup/VM_NAME.qcow2\n```\n\n```bash\nvirsh blockcommit VM_NAME vda --active\
    \ --pivot\n```\n\n```bash\nvirsh snapshot-delete VM_NAME snap_live\n```\n\n3.\
    \ Using backup tools:\n* `Virt-backup`: A Python tool for backing up libvirt-based\
    \ VMs\n* `Proxmox Backup Server`: Enterprise-grade backup solution for VMs and\
