  trans: "\n\n## 对于遇到网络连接问题的虚拟机：\n\n1. 检查虚拟机的网络接口配置：\n```\nvirsh domiflist <vm_name>\n\
    ```\n\n2. 验证主机桥接器/网络已启动并配置：\n```\nbrctl show\nip link show\n```\n\n3. 确保 iptables/firewalld\
    \ 规则允许虚拟机的流量：\n```\niptables -L -v -n\nfirewall-cmd --list-all\n```\n\n4. 检查虚拟机之间是否存在\
    \ MAC 地址冲突。\n\n5. 验证网络上的 DHCP 是否工作正常（如果已使用）：\n```\ntcpdump -i <bridge> port 67\
    \ or port 68\n```\n\n6. 测试从主机到虚拟机以及反之的连通性性：\n   * Ping\n   * Traceroute\n   *\
    \ 使用 Netcat 测试特定端口\n\n7. 在客体操作系统内部检查虚拟机的网络接口状态。\n\n8. 检查主机和虚拟机之间的 MTU 不匹配问题。\n\
    \n9. 验证 libvirt 网络过滤器没有拦截流量。\n\n10. 使用不同的网络后端进行测试（例如 macvtap 对比 bridge）。\n\n##\
    \ 4. 存储性能问题\n\n如果虚拟机遇到磁盘 I/O 缓慢的问题：\n\n1. 检查主机磁盘性能：\n```\ndd if=/dev/zero of=test\
    \ bs=1G count=1 oflag=direct\n```\n\n2. 验证虚拟机正在使用 virtio 磁盘驱动：\n```\nvirsh dumpxml\
    \ <vm_name> | grep driver\n```\n\n3. 监控主机上的磁盘 I/O：\n```\niostat -x 1\n```\n\n\
    4. 检查主机上是否存在存储过度超配。\n\n5. 验证 RAID 阵列健康状况（如果适用）：\n```\ncat /proc/mdstat\n```\n\n\
    6. 测试不同的存储后端（文件对比 块设备）。\n\n7. 调整虚拟机的 I/O 调度器：\n```\nvirsh qemu-monitor-command\
    \ <vm_name> --hmp \"info block\"\nvirsh qemu-monitor-command <vm_name> --hmp \"\
    drive_reopen\"\n```\n\n8. 考虑为原始磁盘镜像启用 `cache=none`。\n\n9. 检查主机文件系统上的磁盘碎片。\n\n\
    10. 验证没有其他进程在主机上引起高 I/O。\n\n## 5. CPU 性能问题\n\n对于有 CPU 相关性能问题的虚拟机：\n\n1. 检查主机的\
    \ CPU 使用率和负载：\n```\ntop\nmpstat -P ALL 1\n```\n\n2. 验证虚拟机正在使用主机的 CPU 特性：\n```\n\
    virsh dumpxml <vm_name> | grep cpu\n```\n\n3. 监控虚拟机的 vCPU 使用情况：\n```\nvirt-top\n\
    ```\n\n4. 检查虚拟机内部是否存在 CPU 节流（Throttling）：\n```\nvirsh qemu-monitor-command <vm_name>\
    \ --hmp \"info cpus\"\n```\n\n5. 验证 CPU 绑定配置（如果已使用）：\n```\nvirsh vcpupin <vm_name>\n\
    ```\n\n6. 使用不同的 CPU 模型或启用特性进行测试。\n\n7. 检查是否存在“嘈闹邻居”虚拟机消耗了过多 CPU。\n\n8. 验证没有主机进程消耗过过多\
    \ CPU。\n\n9. 考虑调整虚拟机的 CPU 分配或限制。\n\n10. 检查主机内核日志中任何与 CPU 相关的错误。\n\n## 6. 内存问题\n\
    \n如果虚拟机遇到内存相关问题：\n\n1. 检查主机内存使用情况：\n```\nfree -m\nvmstat 1\n```\n\n2. 验证虚拟机的内存分配：\n\
    ```\nvirsh dompsminfo <vm_name>\n```\n\n3. 监控虚拟机的内存使用情况：\n```\nvirt-top\n```\n\
    \n4. 检查内存气球（Ballooning）活动：\n```\nvirsh dommemstat <vm_name>\n```\n\n5. 验证大页内存（Hugepages）配置（如果已使用）：\n\
    ```\ncat /proc/meminfo | grep Huge\n```\n\n6. 检查主机上的内存过度超配：\n```\ncat /proc/sys/vm/overcommit_memory\n\
    ```\n\n7. 监控主机和虚拟机内的交换（Swap）使用情况。\n\n8. 验证主机内核模块或 qemu 进程中不存在内存泄漏。\n\n9. 考虑调整虚拟机的内存分配或启用\
    \ KSM。\n\n10. 检查主机内核日志中任何与内存相关的错误。\n\n## 7. 控制台和显示问题\n\n对于访问虚拟机控制台或显示出现的问题：\n\n\
    1. 验证虚拟机是否运行了 VNC/SPICE 服务器：\n```\nps aux | grep vnc\nps aux | grep spice\n```\n\
    \n2. 检查 libvirt 日志中图形相关的错误。\n\n3. 验证防火墙允许 VNC/SPICE 端口。\n\n4. 使用 virt-viewer 测试控制台访问：\n\
    ```\nvirt-viewer <vm_name>\n```\n\n5. 检查虚拟机 XML 中的图形配置：\n```\nvirsh dumpxml <vm_name>\
    \ | grep -A10 \"<graphics\"\n```\n\n6. 验证虚拟机内是否运行了 QEMU 客体代理（如果已使用）。\n\n7. 使用不同的图形类型进行测试（VNC\
    \ 对比 SPICE）。\n\n8. 检查 X11 转发问题（如果适用）。\n\n9. 验证虚拟机已正确配置了视频设备。\n\n10. 直接通过 QEMU\
    \ 器测试控制台访问。\n\n## 8. 迁移问题\n\n当在热迁移过程中遇到问题时：\n\n1. 验证源主机和目标主机均满足前提条件：\n   * 兼容的\
    \ CPU 模型\n   * 两个主机均可访问的共享存储\n   * 目标主机上有足够的资源\n\n2. 检查主机之间的网络连接性：\n```\niperf\
    \ -c <destination_host>\n```\n\n3. 验证两个主机上的 libvirt 版本匹配。\n\n4. 检查虚拟机上是否有任何活跃的块任务（Block\
    \ jobs）或快照。\n\n5. 监控迁移进度：\n```\nvirsh domjobinfo <vm_name>\n```\n\n6. 检查两个主机上的\
    \ libvirt 日志中的迁移错误。\n\n7. 验证 SELinux/AppArmor 没有拦截迁移。\n\n8. 使用不同选项测试迁移：\n   *\
    \ 离线\n   * 压缩\n9. 验证迁移带宽。\n\n## 9. 快照问题\n\n在创建快照时遇到问题时：\n\n1. 验证源和目标主机满足前提条件：\n\
    ```\nvirsh snapshot <vm_name>\n```\n\n2. 检查虚拟机上是否有任何活跃的块任务。\n\n3. 监控快照创建进度。\n\n\
    4. 检查虚拟机快照列表：\n```\nvirsh snapshot-list <vm_name>\n```\n\n5. 验证虚拟机是否运行了 QEMU 客体代理（如果已使用）。\n\
    \n6. 检查 libvirt 日志中的快照错误。\n\n7. 使用不同模式测试快照。\n\n8. 验证快照链完整性。\n\n9. 检查快照存储位置。\n\n\
    10. 虚拟机快照的恢复。\n\n"
