    \ format: qcow2\n```\n\n## 4. Cloning a VM\n\n```yaml\n---\n- name: Clone a VM\n\
    \  hosts: localhost\n  tasks:\n    - name: Clone VM\n      virt:\n        name:\
    \ newvm\n        command: clone\n        original: templatevm\n        clone_storage:\n\
    \          - /var/lib/libvirt/images/templatevm.qcow2\n```\n\n## 5. Managing snapshots\n\
    \n```yaml\n---\n- name: Manage VM snapshots\n  hosts: localhost\n  tasks:\n  \
    \  - name: Create a snapshot\n      virt:\n        name: myvm\n        command:\
    \ snapshot-create-as\n        snapshot: snapshot1\n    - name: Revert to a snapshot\n\
    \      virt:\n        name: myvm\n        command: snapshot-revert\n        snapshot:\
    \ snapshot1\n    - name: Delete a snapshot\n      virt:\n        name: myvm\n\
    \        command: snapshot-delete\n        snapshot: snapshot1\n```\n\nThese playbooks\
    \ demonstrate how Ansible can be used to automate various aspects of KVM management,\
    \ from creating and managing VMs to handling storage and snapshots.\n\n## Custom\
    \ Automation Scripts\n\nWhile `virsh` and Ansible provide powerful automation\
    \ capabilities, sometimes you may need more fine-grained control or integration\
    \ with other systems. In these cases, creating custom scripts using the `libvirt`\
    \ API can be beneficial.\n\n### Creating Python scripts with libvirt API\n\nPython\
    \ is an excellent choice for creating custom automation scripts due to its simplicity\
    \ and the availability of the `libvirt` module. Here's an example of how to use\
    \ the `libvirt` API in Python:\n\n```python\nimport libvirt\nimport sys\n\ndef\
    \ connect_to_hypervisor():\n    conn = libvirt.open(\"qemu:///system\")\n    if\
    \ conn == None:\n        print('Failed to open connection to the hypervisor')\n\
    \        sys.exit(1)\n    return conn\n\ndef list_domains(conn):\n    domains\
    \ = conn.listAllDomains(0)\n    if len(domains) != 0:\n        for domain in domains:\n\
    \            print(f' {domain.name()}')\n    else:\n        print('No domains\
    \ found.')\n\ndef create_domain(conn, xml_file):\n    with open(xml_file, 'r')\
    \ as f:\n        xml = f.read()\n    dom = conn.defineXML(xml)\n    if dom ==\
    \ None:\n        print('Failed to create a domain from an XML definition.')\n\
    \        return 1\n    print(f'Domain {dom.name()} created from {xml_file}')\n\
    \    return 0\n\ndef main():\n    conn = connect_to_hypervisor()\n    print(\"\
    Existing domains:\")\n    list_domains(conn)\n    print(\"\\nCreating a new domain:\"\
    )\n    create_domain(conn, 'new_domain.xml')\n    print(\"\\nUpdated domain list:\"\
    )\n    list_domains(conn)\n    conn.close()\n\nif __name__ == \"__main__\":\n\
    \    main()\n```\n\nThis script demonstrates how to connect to the hypervisor,\
