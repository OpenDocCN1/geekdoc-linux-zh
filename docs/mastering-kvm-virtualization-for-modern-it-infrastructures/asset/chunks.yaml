    \ snapshot1 --description \"Clean install\"`\n\n## 29. `virsh snapshot-list`\n\
    \n* 列出域的所有快照\n* 用法：`virsh snapshot-list <domain>`\n* 示例：`virsh snapshot-list ubuntu20.04`\n\
    \n## 30. `virsh snapshot-revert`\n\n* 将域恢复到特定的快照\n* 用法：`virsh snapshot-revert\
    \ <domain> <snapshot>`\n* 示例：`virsh snapshot-revert ubuntu20.04 snapshot1`\n\n\
    ## 31. `virsh snapshot-delete`\n\n* 删除快照\n* 用法：`virsh snapshot-delete <domain>\
    \ <snapshot>`\n* 示例：`virsh snapshot-delete ubuntu20.04 snapshot1`\n\n## 性能监控\n\
    \n## 32. `virsh domstats`\n\n* 显示域统计信息\n* 用法：`virsh domstats [<domain>] [--state]\
    \ [--cpu-total] [--balloon] [--vcpu] [--interface] [--block]`\n* 示例：`virsh domstats\
    \ ubuntu20.04 --cpu-total --vcpu`\n\n## 33. `virsh cpu-stats`\n\n* 显示域的 CPU 统计信息\n\
    * 用法：`virsh cpu-stats <domain> [--total]`\n* 示例：`virsh cpu-stats centos8 --total`\n\
    \n## 34. `virsh domblkstat`\n\n* 显示域的块设备统计信息\n* 用法：`virsh domblkstat <domain>\
    \ <device>`\n* 示例：`virsh domblkstat debian10 vda`\n\n## 35. `virsh domifstat`\n\
    \n* 显示域的网络接口统计信息\n* 用法：`virsh domifstat <domain> <interface>`\n* 示例：`virsh domifstat\
    \ fedora33 eth0`\n\n## 其他杂\n\n## 36. `virsh domcapabilities`\n\n* 显示域的能力\n* 用法：`virsh\
    \ domcapabilities`\n\n## 37. `virsh nodeinfo`\n\n* 显示主机节点信息\n* 用法：`virsh nodeinfo`\n\
