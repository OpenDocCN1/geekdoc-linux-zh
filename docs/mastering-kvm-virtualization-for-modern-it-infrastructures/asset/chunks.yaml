  raw: 'This command installs:


    *   qemu-kvm: The main KVM package


    *   libvirt-daemon-system: The libvirt daemon and system configuration files


    *   libvirt-clients: Client-side libraries and utilities for libvirt


    *   bridge-utils: Utilities for configuring Linux Ethernet bridges


    *   virtinst: A set of command-line tools for creating virtual machines


    *   virt-manager: A graphical tool for managing virtual machines (optional for
    server installations)


    3.  Add Your User to the KVM Groups


    To allow your user to manage virtual machines, add it to the libvirt and kvm groups:


    sudo usermod -aG libvirt $USER sudo usermod -aG kvm $USER


    Log out and log back in for the group changes to take effect.


    4.  Start and Enable the libvirt Daemon


    Ensure that the libvirt daemon is running and set to start at boot:


    sudo systemctl start libvirtd


    sudo systemctl enable libvirtd


    5.  Configure Networking (Optional)


    By default, KVM sets up a NAT network for virtual machines. If you want to use
    bridged networking or create custom networks, you''ll need to configure them separately.
    Here''s an example of setting up a bridge network:


    a. Install the netplan package if it''s not already installed:


    ```bash

      sudo apt install netplan.io

      ```


    b. Create a new Netplan configuration file:


    ```bash

      sudo nano /etc/netplan/01-netcfg.yaml

      ```


    c. Add the following configuration (adjust according to your network):


    ```yaml

      network:

        version: 2

        renderer: networkd

        ethernets:

          enp0s3:

            dhcp4: no

        bridges:

          br0:

            interfaces: [enp0s3]

            dhcp4: yes

      ```


    d. Apply the new configuration:


    ```bash

      sudo netplan apply

      ```


    6.  Install Additional Tools (Optional)


    Depending on your needs, you might want to install additional tools for managing
    KVM:


    sudo apt install virt-top libguestfs-tools


    *   virt-top: A top-like utility for showing stats of virtualized domains


    *   libguestfs-tools: A set of tools for accessing and modifying virtual machine
    disk images


    ### Verifying the Installation


    After completing the installation, it''s important to verify that KVM is set up
    correctly and ready to use. Here are some steps to check your KVM installation:


    1.  Verify KVM Kernel Modules


    Check if the KVM kernel modules are loaded:


    lsmod | grep kvm


    You should see output including kvm_intel (for Intel CPUs) or kvm_amd (for AMD
    CPUs).


    2.  Check libvirt Status


    Verify that the libvirt daemon is running:


    sudo systemctl status libvirtd


    The output should show that the service is active and running.


    3.  Verify KVM Device


    Check if the KVM device file exists:


    ls -l /dev/kvm


    You should see the /dev/kvm device file listed.


    4.  Test Virtual Machine Creation


    Try creating a small virtual machine to ensure everything is working:


    sudo virt-install --name=testvm --vcpus=1 --memory=1024 --cdrom=/path/to/iso --disk
    size=5


    Replace /path/to/iso with the path to a Linux ISO file. If the command runs without
    errors and starts creating a VM, your KVM installation is working correctly.


    5.  Check Available Networks


    List the available virtual networks:


    sudo virsh net-list --all


    You should see at least the default network listed.


    6.  Verify Hardware Acceleration


    Check if hardware acceleration is available:


    kvm-ok


    If KVM is properly configured, you should see a message indicating that KVM acceleration
    can be used.


    ## Conclusion


    In this chapter, we''ve covered the fundamentals of virtualization, introduced
    the different types of virtualization technologies, and highlighted the benefits
    of using KVM. We''ve also walked through the process of setting up a Linux environment
    with KVM support and provided a detailed guide for installing and verifying KVM
    on an Ubuntu Server system.


    With KVM now installed and verified, you''re ready to start creating and managing
    virtual machines. In the next chapter, we''ll dive deeper into KVM''s architecture
    and explore how it interacts with the Linux kernel and hardware to provide efficient
    virtualization.


    Remember that while this guide focuses on Ubuntu Server, the principles and general
    steps apply to other Linux distributions as well. Always refer to your distribution''s
    documentation for specific package names and commands if you''re using a different
    Linux flavor.


    As you progress through this book, you''ll gain a deeper understanding of KVM''s
    capabilities and learn how to leverage its features to build robust, scalable
    virtualization solutions for various use cases, from development environments
    to production deployments.


    # Chapter 2: Managing Virtual Machines


    ## Creating Virtual Machines


    The creation of virtual machines (VMs) is a fundamental task in KVM virtualization.
    This section will explore two primary methods for creating VMs: using the graphical
    virt-manager tool and employing command-line interfaces (CLI) tools such as virt-install
    and virsh.


    ### Using virt-manager


    virt-manager, also known as Virtual Machine Manager, is a user-friendly graphical
    interface for managing KVM virtual machines. It provides an intuitive way to create,
    configure, and manage VMs, making it an excellent choice for users who prefer
    a visual approach.


    To create a new VM using virt-manager:


    1.  Launch virt-manager by running virt-manager in the terminal or selecting it
    from your application menu.


    2.  Click on the "Create a new virtual machine" button or select "File" > "New
    Virtual Machine" from the menu.


    3.  Choose the installation method:


    *   Local install media (ISO image or CDROM)


    *   Network install (HTTP, FTP, or NFS)


    *   Network boot (PXE)


    *   Import existing disk image


    4.  Select the ISO image or installation source.


    5.  Choose the operating system type and version.


    6.  Configure CPU and memory allocation.


    7.  Create or select a storage volume for the VM.


    8.  Configure network settings.


    9.  Review the summary and click "Finish" to create the VM.


    virt-manager offers several advantages:


    *   User-friendly interface


    *   Easy-to-understand wizards for VM creation


    *   Graphical console access to VMs


    *   Simple management of VM resources and states


    However, it may not be suitable for all scenarios, especially in environments
    requiring automation or remote management.


    ### CLI tools: virt-install and virsh


    For users who prefer command-line interfaces or need to automate VM creation,
    KVM provides powerful CLI tools: virt-install and virsh.


    #### virt-install


    virt-install is a command-line tool for creating new KVM virtual machines. It
    offers fine-grained control over VM configuration and is ideal for scripting and
    automation.


    Basic syntax for virt-install:


    virt-install --name=VM_NAME --vcpus=VCPU_COUNT --memory=MEMORY_SIZE --cdrom=ISO_PATH
    --disk size=DISK_SIZE


    Example of creating a Ubuntu VM:


    virt-install --name=ubuntu20 --vcpus=2 --memory=2048 --cdrom=/path/to/ubuntu-20.04-desktop-amd64.iso
    --disk size=20


    Key options for virt-install:


    *   --name: Specifies the name of the VM


    *   --vcpus: Sets the number of virtual CPUs


    *   --memory: Allocates RAM in MiB


    *   --cdrom: Specifies the path to the ISO image


    *   --disk: Configures the virtual disk (size in GiB)


    *   --network: Sets up network interfaces


    *   --os-variant: Optimizes the VM for a specific OS


    virt-install allows for more advanced configurations, such as:


    *   Custom storage pools and volumes


    *   Multiple network interfaces


    *   PCI device passthrough


    *   CPU model and topology settings


    #### virsh


    virsh is a versatile command-line interface for managing KVM virtual machines.
    While it''s not primarily used for creating VMs, it can clone existing VMs and
    provides extensive management capabilities.


    Key virsh commands for VM management:


    *   virsh list: Shows running VMs


    *   virsh list --all: Shows all VMs (running and stopped)


    *   virsh start VM_NAME: Starts a VM


    *   virsh shutdown VM_NAME: Gracefully shuts down a VM


    *   virsh destroy VM_NAME: Forcefully stops a VM


    *   virsh undefine VM_NAME: Removes a VM definition (doesn''t delete storage)'
