  trans: "\n\n# 高可用与集群化\n\n为 KVM 虚拟机实现高可用性和集群化可以确保最大的运行时间和容错能力。\n\n## Pacemaker 和\
    \ Corosync\n\nPacemaker 和 Corosync 为 KVM 环境提供了稳健的集群解决方案。\n\n设置基础 Pacemaker 集群步骤：\n\
    \n1. 安装 Pacemaker 和 Corosync：\n```bash\nsudo apt-get install pacemaker corosync\n\
    ```\n\n2. 配置 Corosync：\n```bash\nsudo cp /usr/share/corosync/examples/corosync.conf.example\
    \ /etc/corosync/corosync.conf\n```\n\n3. 启动 Corosync 和 Pacemaker：\n```bash\nsudo\
    \ systemctl start corosync\nsudo systemctl start pacemaker\n```\n\n4. 配置虚拟机资源：\n\
    ```bash\nsudo pcs resource create vm_resource ocf:heartbeat:VirtualDomain config=/path/to/vm.xml\n\
    ```\n\n## DRBD (分布式复制块级设备)\n\nDRBD 为集群环境中的共享存储提供了块级复制。\n\n设置 DRBD：\n\n1. 安装 DRBD：\n\
    ```bash\nsudo apt-get install drbd8-utils\n```\n\n2. 配置 DRBD 资源：\n```bash\nresource\
    \ r0 {\n  device /dev/drbd0;\n  disk /dev/sdb1;\n  meta-disk internal;\n  on host1\
    \ {\n    address 192.168.1.1:7788;\n  }\n  on host2 {\n    address 192.168.1.2:7788;\n\
    \  }\n}\n```\n\n3. 初始化并启动 DRBD：\n```bash\nsudo drbdadm create-md r0\nsudo drbdadm\
    \ up r0\n```\n\n# 监控与管理\n\n有效的监控和管理对于维持健康的 KVM 环境至关重要。\n\n## Libvirt API 与管理工具\n\
    \nLibvirt 提供管理 KVM 虚拟机的全面 API。多个管理工具利用了该 API：\n\n* `virt-manager`: 用于管理虚拟机的桌面应用程序。\n\
    * `oVirt`: 功能丰富的基于 Web 的虚拟化管理平台。\n* `OpenStack`: 支持 KVM 的云计算平台。\n\n## 性能监控\n\n\
    有多种工具可监控 KVM 性能：\n\n* `virt-top`: 为虚拟机提供实时统计。\n* `sar`: 收集并报告系统活动信息。\n* `iostat`:\
    \ 报告 CPU 和 I/O 统计。\n\n使用 `virt-top`：\n```bash\nvirt-top\n```\n\n## 日志分析\n\n分析\
    \ KVM 日志对于故障排除和性能优化至关重要：\n\n* QEMU 日志：`/var/log/libvirt/qemu/`\n* Libvirt 日志：`/var/log/libvirt/libvirtd.log`\n\
    \n为虚拟机启用详细日志：\n\n```xml\n<domain type='kvm'>\n  ...\n  <devices>\n    ...\n  \
    \  <console type='file'>\n      <source path='/var/log/vm_console.log'/>\n   \
    \   <target type='serial' port='0'/>\n    </console>\n  </devices>\n</domain>\n\
    ```\n\n# 安全考量\n\n实施适当的安全措施对于保护 KVM 环境至关重要。\n\n## SELinux 与 AppArmor\n\n增强 Linux\
    \ (SELinux) 和 AppArmor 提供了强制访问控制系统，可以增强 KVM 的安全性。\n\n为 KVM 启用 SELinux：\n\n1. 确保\
    \ SELinux 已启用：\n```bash\nsudo setenforce 1\n```\n\n2.为虚拟机配置 SELinux 策略：\n```bash\n\
    sudo setsebool -P virt_use_fusefs 1\nsudo setsebool -P virt_use_nfs 1\n```\n\n\
    ## 安全启动与 vTPM\n\n安全启动 (Secure Boot) 确保只有签名的引导加载程序和内核才能运行，而虚拟可平台模块 (vTPM) 为虚拟机提供了基于硬件的安全功能。\n\
    \n为虚拟机启用安全启动：\n\n```xml\n<os firmware='efi'>\n  <loader readonly='yes' secure='yes'\
    \ type='pflash'>/usr/share/OVMF/OVMF_CODE.secboot.fd</loader>\n  <nvram>/var/lib/libvirt/qemu/nvram/vm_VARS.fd</nvram>\n\
    </os>\n```\n\n启用 vTPM：\n\n```xml\n<devices>\n  ...\n  <tpm model='tpm-tis'>\n\
    \    <backend type='emulator' version='2.0'/>\n  </tpm>\n</devices>\n```\n\n##\
    \ 网络安全\n\n实施适当的网络安全措施对于保护 KVM 环境至关重要：\n\n* 使用 VLAN 隔离虚拟机流量。\n* 实施防火墙规则控制虚拟机与外部网络之间的流量。\n\
    * 使用加密协议（如 SSH）进行远程管理。\n\n为 KVM 配置 `iptables` 规则：\n```bash\nsudo iptables -A FORWARD\
    \ -i virbr0 -o eth0 -j ACCEPT\nsudo iptables -A FORWARD -i eth0 -o virbr0 -m state\
    \ --state RELATED,ESTABLISHED -j ACCEPT\nsudo iptables -t nat -A POSTROUTING -s\
    \ 192.168.122.0/24 -o eth0 -j MASQUERADE\n```\n\n# 备份与灾难恢复\n\n实施稳健的备份和灾难恢复策略对于保护虚拟机数据和确保业务连续性至关重要。\n\
    \n## 基于快照的备份\n\nKVM 支持创建虚拟机快照，可用于点备份。\n\n使用 `virsh` 创建快照：\n```bash\nvirsh snapshot-create-as\
    \ vmname snapshot1 \"Snapshot 1\" --disk-only --atomic\n```\n\n恢复到快照：\n```bash\n\
    virsh snapshot-revert vmname snapshot1\n```\n\n## 增量备份\n\n可以使用 `qemu-img` 和 `rsync`\
    \ 等工具实现增量备份。\n\n执行增量备份：\n\n1. 创建初始全备：\n```bash\nqemu-img convert -f qcow2 -O qcow2\
    \ vm_disk.qcow2 vm_disk_backup.qcow2\n```\n\n2. 为增量备份创建快照：\n```bash\nqemu-img\
    \ create -f qcow2 -b vm_disk.qcow2 vm_disk_snapshot.qcow2\n```\n\n3. 使用 `rsync`\
    \ 传输更改的块：\n```bash\nrsync -avz --inplace vm_disk_snapshot.qcow2 backup_server:/path/to/\n\
    ```\n\n## 灾难恢复\n\n制定全面的恢复计划，包括：\n\n1. 定期测试备份。\n2. 恢复过程的记录。\n3. 配置的异地存储。\n4. 定期审查和更新计划。\n\
    \n## 结论\n\n本章涵盖了高级 KVM 主题，包括存储选项、网络、性能调优、高可用、安全和备份策略。通过掌握这些概念和技术，你可以创建稳健、高效且安全的虚拟化环境。\n\
    \n"
- fmt: "\n# 6 Use secure protocols\nPrefer encrypted protocols like `SSH` over unencrypted\
    \ ones. Disable older, less secure protocols.\n\n```bash\nsudo nano /etc/ssh/sshd_config\
    \ # Set Protocol 2\n\n# Disable root login: PermitRootLogin no \n```\n\n# 7 Implement\
    \ log monitoring\nSet up log monitoring and analysis to detect potential security\
    \ incidents.\n\n```bash\nsudo apt install fail2ban   # Install Fail2Ban for intrusion\
    \ prevention \n```\n\n# 8. Regular security audits\nConduct periodic security\
    \ audits of the host system to identify and address potential vulnerabilities.\n\
    \n## SELinux and AppArmor integration\n\nSecurity-Enhanced Linux (`SELinux`) and\
    \ `AppArmor` are powerful security modules that provide Mandatory Access Control\
    \ (`MAC`) for Linux systems. Integrating these with `KVM` can significantly enhance\
    \ the security of your virtualization environment.\n\n### SELinux Integration\n\
    \nSELinux provides fine-grained access control policies that can be applied to\
    \ `KVM` processes and resources. To enable `SELinux` for `KVM`:\n\n1. Ensure `SELinux`\
    \ is enabled and in enforcing mode:\n```bash\nsudo setenforce 1\nsudo sed -i 's/SELINUX=disabled/SELINUX=enforcing/'\
    \ /etc/selinux/config\n```\n2. Install the `SELinux` policy for virtualization:\n\
    ```bash\nsudo yum install libvirt-daemon-driver-qemu\n```\n3. Configure `SELinux`\
    \ policies for `KVM`:\n```bash\nsudo setsebool -P virt_use_fusefs 1\nsudo setsebool\
    \ -P virt_use_nfs 1\nsudo setsebool -P virt_use_samba 1\n```\n4. Verify `SELinux`\
    \ is properly configured for `KVM`:\n```bash\nsudo ausearch -m avc -ts recent\
    \ | grep qemu\n```\n\n### AppArmor Integration\n\nAppArmor can be used to create\
    \ profiles that restrict the actions of `KVM` processes. To integrate `AppArmor`\
    \ with `KVM`:\n\n1. Ensure `AppArmor` is installed and enabled:\n```bash\nsudo\
    \ apt install apparmor apparmor-utils\nsudo systemctl enable apparmor\nsudo systemctl\
    \ start apparmor\n```\n2. Create an `AppArmor` profile for `QEMU`/`KVM`:\n```bash\n\
    sudo nano /etc/apparmor.d/abstractions/libvirt-qemu\n```\nAdd the following content:\n\
    ```text\n#include <abstractions/base>\n#include <abstractions/consoles>\n#include\
    \ <abstractions/nameservice>\n/usr/bin/qemu-system-x86_64 ix,\n/etc/libvirt/**\
    \ r,\n/var/lib/libvirt/** rwk,\n/var/run/libvirt/** rwk,\n```\n3. Load the `AppArmor`\
    \ profile:\n```bash\nsudo apparmor_parser -r /etc/apparmor.d/abstractions/libvirt-qemu\n\
    ```\n4. Configure `libvirt` to use `AppArmor`:\n```bash\nsudo nano /etc/libvirt/qemu.conf\n\
    ```\nAdd or modify the following line:\n```text\nsecurity_driver = \"apparmor\"\
    \n```\n5. Restart the `libvirt` daemon:\n```bash\nsudo systemctl restart libvirtd\n\
    ```\n\nBy integrating `SELinux` or `AppArmor` with `KVM`, you can enforce stricter\
    \ access controls and reduce the risk of unauthorized access or malicious activities\
    \ within your virtualization environment.\n\n## VM Security\n\nSecuring individual\
    \ virtual machines is just as important as securing the host system. This section\
    \ covers key aspects of VM security in a `KVM` environment.\n\n### Encrypted disk\
    \ images\n\nEncrypting VM disk images adds an extra layer of security, protecting\
    \ sensitive data even if the physical storage is compromised. Here's how to create\
    \ and use encrypted disk images with `KVM`:\n\n1. Create an encrypted disk image:\n\
    ```bash\nsudo qemu-img create -f qcow2 -o encryption=on encrypted_disk.qcow2 20G\n\
    ```\n2. When prompted, enter a strong passphrase for the encryption.\n3. To use\
    \ the encrypted disk with a VM, add the following to the VM's XML configuration:\n\
    ```xml\n<disk type='file' device='disk'>\n  <driver name='qemu' type='qcow2' cache='none'/>\n\
    \  <source file='/path/to/encrypted_disk.qcow2'/>\n  <target dev='vda' bus='virtio'/>\n\
    \  <encryption format='qcow'>\n    <secret type='passphrase' uuid='your-secret-uuid'/>\n\
    \  </encryption>\n</disk>\n```\n4. Create a secret for the passphrase:\n```bash\n\
    sudo virsh secret-define --file secret.xml\n```\nWhere `secret.xml` contains:\n\
    ```xml\n<secret ephemeral='no' private='yes'>\n  <uuid>your-secret-uuid</uuid>\n\
    \  <usage type='disk'>\n    <name>encrypted_disk_secret</name>\n  </usage>\n</secret>\n\
    ```\n5. Set the passphrase for the secret:\n```bash\nsudo virsh secret-set-value\
    \ --secret your-secret-uuid --base64 $(echo -n \"your-passphrase\" | base64)\n\
    ```\nNow, when you start the VM, it will use the encrypted disk image, providing\
    \ an additional layer of security for the VM's data.\n\n### Secure networking\
    \ configurations\n\nProper network configuration is crucial for VM security. Here\
    \ are some best practices for secure networking in `KVM`:\n\n1. Use isolated networks:\
    \ Create separate networks for different types of VMs or workloads using `libvirt`'s\
    \ network functionality.\n```xml\n<network>\n  <name>isolated_network</name>\n\
    \  <bridge name='virbr1'/>\n  <ip address='192.168.100.1' netmask='255.255.255.0'>\n\
    \    <dhcp>\n      <range start='192.168.100.2' end='192.168.100.254'/>\n    </dhcp>\n\
    \  </ip>\n</network>\n```\n2. Implement network filtering: Use `libvirt`'s network\
    \ filtering capabilities to control traffic between VMs and external networks.\n\
    ```xml\n<interface type='network'>\n  <source network='default'/>\n  <model type='virtio'/>\n\
    \  <filterref filter='clean-traffic'/>\n</interface>\n```\n3. Enable MAC address\
    \ spoofing protection: Prevent VMs from spoofing their MAC addresses.\n```xml\n\
    <interface type='network'>\n  <source network='default'/>\n  <mac address='52:54:00:12:12'/>\n\
    </interface>\n```\n4. Use VLANs to segregate network traffic:\n```xml\n<interface\
    \ type='network'>\n  <source network='default'/>\n  <model type='virtio'/>\n</interface>\n\
    ```\n5. Implement firewall rules: Use `iptables` or `nftables` to create firewall\
    \ rules for VMs.\n\n## Access Control\n\nProper access control is essential for\
    \ maintaining the security and integrity of your `KVM` environment. This section\
    \ covers permissions and users.\n\n### Managing permissions for KVM users\n\n\
    KVM uses `libvirt` for management, which in turn relies on the host system's user\
    \ and group. Here are some best practices for managing KVM users:\n\n1. Create\
    \ a dedicated group for KVM users:\n```bash\nsudo groupadd kvmusers\n```\n2. Add\
    \ users to the KVM group:\n```bash\nsudo usermod -aG kvmusers username\n```\n\
    3. Configure `libvirt` to use the KVM group:\nEdit `/etc/libvirt/qemu.conf`:\n\
    ```text\nuser = \"root\"\ngroup = \"kvmusers\"\n```\n4. Set appropriate permissions\
    \ on KVM-related directories:\n```bash\nsudo chown -R root:kvmusers /var/lib/libvirt\n\
    sudo chmod -R g+wx /var/lib/libvirt\n```\n5. Use ACLs for fine-grained control:\n\
    ```bash\nsudo setfacl -m g:kvmusers:rx /var/lib/libvirt/images\n```\n6. Restrict\
    \ access to VM console:\nEdit `/etc/libvirt/qemu.conf`:\n```text\nvnc_listen =\
    \ \"127.0.0.1\"\n```\n7. Use SSH key-based authentication for remote management:\n\
    ```bash\nssh-keygen -t rsa -b 4096\nssh-copy-id user@kvm-host\n```\n\n### Role-based\
    \ access control\n\nImplementing role-based access control (RBAC) allows you to\
    \ define specific roles with different levels of access to `KVM` resources. Here's\
    \ how to set up RBAC for `KVM` using `libvirt`'s `polkit` integration:\n\n1. Create\
    \ custom `polkit` rules:\nCreate a file `/etc/polkit-1/rules.d/50-libvirt.rules`:\n\
    ```javascript\npolkit.addRule(function(action, subject) {\n  if (action.id ==\
    \ \"org.libvirt.unix.manage\" && subject.isInGroup(\"kvmadmins\")) {\n    return\
    \ polkit.Result.YES;\n  }\n});\npolkit.addRule(function(action, subject) {\n \
    \ if (action.id == \"org.libvirt.unix.monitor\" && subject.isInGroup(\"kvmusers\"\
    )) {\n    return polkit.Result.YES;\n  }\n});\n```\n"
