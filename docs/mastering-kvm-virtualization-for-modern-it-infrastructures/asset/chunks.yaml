    ## 19. `virsh domcontrol`


    - Returns domain control interface state

    - Usage: `virsh domcontrol <domain>`

    - Example: `virsh domcontrol ubuntu20.04`


    ## 20. `virsh domdisplay`


    - Returns the domain''s graphical display

    - Usage: `virsh domdisplay <domain>`

    - Example: `virsh domdisplay ubuntu20.04`


    ### Best Practices for Using `virsh` and `virt-manager`


    1. Use Tab Completion: Both `virsh` and `virt-manager` support tab completion
    in most shells. This can help you quickly find and use the correct commands and
    options.

    2. Leverage `virsh` for Automation: While `virt-manager` is great for GUI-based
    management, `virsh` is more suitable for scripting and automation tasks. Consider
    using `virsh` in your shell scripts or configuration management tools.

    3. Regular Backups: Use `virsh` to create and manage snapshots of your virtual
    machines regularly. This allows you to easily revert to a known good state if
    needed.

    4. Monitor Resource Usage: Regularly use `virsh` commands like `domstats`, `cpu-stats`,
    and `domblkstat` to monitor the resource usage of your virtual machines. This
    can help you identify performance issues early.

    5. Keep XML Configurations: After making changes to a domain using `virt-manager`,
    it''s a good practice to dump the XML configuration using `virsh dumpxml`. This
    allows you to version control your VM configurations and easily recreate them
    if needed.

    6. Use Meaningful Names: When creating virtual machines, storage pools, or networks,
    use meaningful names that reflect their purpose. This makes management easier,
    especially when dealing with many resources.

    7. Secure Remote Management: When managing remote libvirt hosts, always use secure
    connections (like SSH) and consider setting up key-based authentication for added
    security.

    8. Regular Updates: Keep both `virsh` and `virt-manager` updated to the latest
    versions to ensure you have access to the newest features and bug fixes.

    9. Documentation: Maintain documentation of your virtual infrastructure, including
    network configurations, storage allocations, and any custom scripts or procedures
    you use for management.

    10. Testing: Before making significant changes to production VMs, test your `virsh`
    commands or `virt-manager` procedures on test VMs to ensure they work as expected.


    ### Troubleshooting Common Issues


    1. VM Won''t Start:

    - Check the VM''s XML configuration using `virsh dumpxml`

    - Verify that all referenced storage and network resources exist and are accessible

    - Check the libvirt logs (usually in `/var/log/libvirt/`)

    2. Network Connectivity Issues:

    - Verify the network configuration using `virsh net-dumpxml`

    - Check if the network is started with `virsh net-list --all`

    - Ensure that the VM''s network interface is correctly attached using `virsh domiflist`

    3. Storage Problems:

    - Check the storage pool status with `virsh pool-list --all`

    - Verify volume permissions and ownership

    - Use `virsh vol-list` to ensure the volume exists in the expected pool

    4. Performance Issues:

    - Use `virsh domstats` to identify resource bottlenecks

    - Check host resource usage to ensure the host isn''t overcommitted

    - Consider adjusting VM resources using commands like `virsh setmem` or `virsh
    setvcpus`

    5. `virt-manager` Can''t Connect to Remote Host:

    - Verify SSH connectivity to the remote host

    - Ensure `libvirtd` is running on the remote host

    - Check firewall settings on both local and remote machines

    6. Snapshot Operations Fail:

    - Ensure the VM is in a consistent state (consider shutting it down first)

    - Check available disk space on the host

    - Verify that the storage backend supports snapshots

    7. Live Migration Issues:

    - Ensure both source and destination hosts have compatible libvirt and QEMU versions

    - Check network connectivity and bandwidth between hosts

    - Verify that shared storage is accessible from both hosts


    ### Advanced Topics


    1. Custom XML Configurations:

    Understanding and modifying domain XML configurations allows for fine-grained
    control over VM settings that may not be accessible through standard `virsh` commands
    or `virt-manager` GUI.

    2. Scripting with `virsh`:

    Create shell scripts that use `virsh` commands to automate common tasks like VM
    creation, snapshotting, or resource adjustment based on monitoring data.

    3. Integration with Configuration Management Tools:

    Use tools like Ansible, Puppet, or Chef in conjunction with `virsh` to manage
    your virtual infrastructure as code.

    4. Performance Tuning:

    Dive deep into KVM and QEMU performance tuning options, using `virsh` to apply
    advanced settings for CPU, memory, and I/O optimization.

    5. Custom Network Configurations:

    Create complex network setups using `virsh net-*` commands, including VLANs, bridges,
    and custom NAT configurations.

    6. Storage Management:

    Explore advanced storage options like thin provisioning, storage migration, and
    using different storage backends (iSCSI, NFS, Ceph) with `virsh`.

    7. Security Hardening:

    Use `virsh` and `virt-manager` in conjunction with SELinux, sVirt, and other security
    technologies to create a more secure virtualization environment.

    8. API Integration:

    For more complex management scenarios, consider using libvirt''s API which offers
    even more flexibility than `virsh`.


    ## Appendix B: Troubleshooting Checklist


    This step-by-step guide provides a comprehensive process for diagnosing and resolving
    common issues with KVM environments. Follow these steps methodically to identify
    and address problems with virtual machines, networking, storage.


    ### 1. Verify KVM Installation and Configuration


    Before diving into specific VM issues, ensure KVM is properly installed and configured
    on the host system:


    1. Check KVM kernel modules are loaded:

    ```bash

    lsmod | grep kvm

    ```

    You should see modules like `kvm`, `kvm_intel` or `kvm_amd` listed.

    2. Verify virtualization extensions are enabled in BIOS/UEFI.

    3. Confirm libvirt daemon is running:

    ```bash

    systemctl status libvirtd

    ```

    4. Check libvirt logs for any startup errors:

    ```bash

    journalctl -u libvirtd

    ```

    5. Verify user permissions:

    - Ensure your user is part of the `libvirt` group

    - Check `/etc/libvirt/qemu.conf` for any restrictive settings

    6. Validate QEMU installation:

    ```bash

    qemu-system-x86_64 --version

    ```


    ### 2. VM Startup Issues


    If a virtual machine fails to start or crashes during boot:


    1. Review VM XML configuration:

    ```bash

    virsh dumpxml <vm_name>

    ```

    Look for any obvious misconfigurations or incompatibilities.

    2. Check libvirt logs for startup errors:

    ```bash

    tail -f /var/log/libvirt/qemu/<vm_name>.log

    ```

    3. Attempt to start the VM manually with QEMU:

    ```bash

    /usr/bin/qemu-system-x86_64 [options from XML]

    ```

    This may reveal more detailed error messages.

    4. Verify VM image integrity:

    ```bash

    qemu-img check <image_path>

    ```

    5. Try booting with minimal configuration:

    - Disable all unnecessary devices

    - Use `virtio` drivers for disk and network

    - Start with minimal RAM and vCPUs

    6. Check for conflicting VM names or MAC addresses.

    7. Ensure sufficient host resources (RAM, CPU, disk space).

    8. Verify SELinux/AppArmor are not blocking VM execution.


