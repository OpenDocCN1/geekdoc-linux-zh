  \n# 第 1 章：开始使用 KVM\n\n## 理解虚拟化的基础\n\n虚拟化是一项基础性技术，它改变了我们管理和利用计算资源的方式。虚拟化的核心是允许多个虚拟机（VM）运行在单台物理机上，每个虚拟机都有自己的操作系统和资源。本章将向你介绍虚拟化概念、它的各种类型，以及使用基于内核的虚拟机（KVM）作为你的虚拟化解决方案的具体优势。\n\
  \n### 什么是虚拟化？\n\n虚拟化是创建某物的虚拟（而非实际）版本的过程，例如操作系统、服务器、存储设备或网络资源。它允许你在单台物理机上运行多个虚拟机，每个虚拟机都有其专用的资源和隔离的环境。\n\
  \n使虚拟化可能的技术称为虚拟机程序（hypervisor）或虚拟机监控器（VMM）。虚拟机程序负责管理物理资源向虚拟机的分配，并确保它们相互独立运行。\n\n\
  ### 虚拟化的类型\n\n有几种类型的虚拟化，每种类型都有其特性和用例。我们将讨论的三大类型是：\n\n1. 全虚拟化（Full Virtualization）\n\
  2. 半虚拟化（Paravirtualization）\n3. 基于容器的虚拟化（Container-based Virtualization）\n\n####\
  \ 1. 全虚拟化\n\n全虚拟化，也称为硬件虚拟化，提供了底层硬件的完整模拟。这使得未修改的客主机操作系统可以在隔离状态运行，而感知不到自己正运行在虚拟化硬件上。\n\
  \n全虚拟化的主要特征：\n\n\n\n\n*   客户机操作系统无需任何修改即可运行\n*   虚拟机（VMs）之间完全隔离\n*   由于硬件模拟开销较高\n\
  *   支持广泛的操作系统\n\n全虚拟化解决方案示例包括：\n\n*   `KVM`（基于内核的虚拟机）\n*   `VMware vSphere`\n* \
  \  `Microsoft Hyper-V`\n\n当您需要在同一块硬件上运行不同的操作系统，或需要虚拟机之间实现完全隔离时，全虚拟化是理想选择。\n\n####\
  \ 2. 半虚拟化\n\n半虚拟化是一种虚拟化技术，它为虚拟机提供了一个与底层硬件相似但不完全相同的软件接口。客户机操作系统必须经过修改以使用该接口，与全虚拟化相比，这可以带来更好的性能。\n\
  \n半虚拟化的关键特性：\n\n*   需要对客户机操作系统进行修改\n*   与全虚拟化相比开销更低\n*   潜在性能更好\n*   对系统的支持有限（仅限修改过的操作系统可以运行）\n\
  \n半虚拟化解决方案示例包括：\n\n*   `Xen`（在半虚拟化模式下使用）\n*   `UML`（用户模式 Linux）\n\n当性能至关重要，且您可以控制客户机操作系统以进行必要的修改时，半虚拟化非常有用。\n\
  \n#### 3. 基于容器的虚拟化\n\n基于容器的虚拟化也称为操作系统级虚拟化，是传统虚拟化的轻量级替代方案。容器不是虚拟化整个硬件栈，而是共享主机的内核并将应用程序进程与系统的其余部分隔离。\n\
  \n基于容器的虚拟化的关键特性：\n\n*   极其轻量且高效\n*   启动速度快\n*   共享主机操作系统内核\n*   限于运行与主机操作系统兼容的应用程序\n\
  \n基于容器的虚拟化解决方案示例包括：\n\n*   `Docker`\n*   `LXC`（Linux Containers）\n*   `Kubernetes`（用于容器编排）\n\
  \n基于容器的虚拟化适用于微服务架构、应用部署以及需要高效运行同一应用程序的多个隔离实例的场景。\n\n## 使用 KVM 的优势\n\n基于内核的虚拟机 (`KVM`)\
  \ 是内置在 Linux 内核中的开源虚拟化技术。它提供全虚拟化能力并由于其性能、灵活性以及与 Linux 生态系统的集成变得越来越受欢迎。\n\n以下是使用\
  \ `KVM` 的一些主要优势：\n\n1.  性能：`KVM` 利用硬件虚拟化扩展（`Intel VT-x` 或 `AMD-V`）为虚拟机实现近原生的性能。\n\
  2.  开源：作为一种开源解决方案，`KVM` 受益于社区贡献和持续改进。它是免费的，与专用解决方案相比可以显著降低许可成本。\n3.  Linux 集成：`KVM`\
  \ 内置于 Linux 内核，这意味着它与主机系统紧密集成。这种集成带来了更好的资源管理和更简单的管理。\n4.  广泛的 OS 支持：`KVM` 支持广泛的客户机操作系统，包括各种\
  \ Linux 发行版、Windows 甚至其他 Unix 类系统。\n5.  可扩展性：`KVM` 可以从小型单服务器部署扩展到大规模云环境，适用于各种规模的企业。\n\
  6.  热热迁移：`KVM` 支持热迁移，允许您以最小的停机时间在物理主机之间移动正在运行的虚拟机。\n7.  安全性：`KVM` 利用 Linux 安全特性和\
  \ `SELinux` 集成在虚拟机之间提供强健的隔离。\n8.  生态系统：`KVM` 拥有丰富的工具和管理接口生态系统，例如 `libvirt`、`virt-manager`\
  \ 和 `OpenStack`，简化了虚拟机管理和编排。\n9.  嵌套虚拟化：`KVM` 支持嵌套虚拟化，允许您在虚拟机内部运行虚拟机程序，这对于测试和开发场景有用。\n\
  10. 存储灵活性：`KVM` 支持多种存储后端，包括本地磁盘、网络附属存储 (`NAS`) 和存储区域网络 (`SAN`)。\n\n## 环境搭建\n\n在开始使用\
  \ `KVM` 之前，您需要确保您的环境满足必要的硬件和软件要求。本节将引导您完成 `KVM` 虚拟化的准备工作。\n\n### 硬件要求\n\n要有效使用 `KVM`，您的系统应满足以下硬件要求：\n\
  \n1.  处理器：支持硬件虚拟化的 64 位 x86 处理器（`Intel VT-x` 或 `AMD-V`）。大多数现代处理器都支持此功能，但您可能需要在 `BIOS/UEFI`\
  \ 设置中启用它。\n2.  内存：足够的 RAM 来容纳主机操作系统和计划运行的虚拟机。建议至少 4GB，但越多越好，特别是如果您计划同时运行多个虚拟机。\n\
  3.  存储：快速的存储（优选 `SSD`）并有足够的容量存储主机 OS、虚拟机镜像和数据。所需的容量取决于您计划运行的虚拟机数量和大小。\n4.  网络：用于网络连接的网络接口卡\
  \ (`NIC`)。多个 `NICs` 有于将虚拟机流量与主机流量隔离开。\n\n要验证您的处理器是否支持硬件虚拟化，您可以在 Linux 上使用以下命令：\n\
  \n对于 Intel 处理器：\n\n```bash\ngrep --color vmx /proc/cpuinfo\n```\n\n对于 AMD 处理器：\n\
  \n```bash\ngrep --color svm /proc/cpuinfo\n```\n\n如果这些命令返回了结果，说明您的处理器支持硬件虚拟化。\n\n\
  ### 软件要求\n\n运行 `KVM` 的主要软件要求是支持 `KVM` 的 Linux 发行版。虽然大多数现代 Linux 发行版都原生支持 `KVM`，但某些可能需要安装额外的软件包。\n\
  \n与 `KVM` 配合良好的 Linux 发行版包括：\n\n*   `Ubuntu Server`\n*   `CentOS/RHEL`\n*   `Fedora`\n\
  *   `Debian`\n*   `openSUSE`\n\n在选择发行版时，请考虑以下因素：\n\n*   长期支持和稳定性\n*   软件包的可用性和更新\n\
  *   社区支持\n*   对该发行版的熟悉程度\n\n在本指南中，我们将使用 `Ubuntu Server` 作为示例，但通用原则适用于其他发行版。\n\n\
  ### 安装支持 KVM 的 Linux 发行版\n\n如果您尚未安装好 Linux 系统，则需要安装一个。以下是安装 `Ubuntu Server` 的通用步骤概述：\n\
  \n1.  从 Ubuntu 官方网站下载 `Ubuntu Server ISO`。\n2.  使用该 `ISO` 创建一个可启动的 USB 闪盘或 DVD。\n\
  3.  从安装介质启动系统。\n4.  按照安装向导操作，确保：\n5.  选择您的语言和键盘布局\n6.  配置网络设置（如果系统提示）\n7.  设置分区（您可以使用引导式分区来简化操作）\n\
  8.  创建用户账户\n9.  如果您需要远程访问，选择安装 `OpenSSH` 服务。\n10. 完成安装并重启系统。\n11. 在系统启动后，登录并更新系统：\n\
  \n```bash\nsudo apt update\nsudo apt upgrade\n```\n\n在安装好全新的 Linux 系统后，您就可以开始安装\
  \ `KVM` 了。\n\n## 安装 KVM\n\n安装 `KVM` 涉及设置 `KVM` 内核模块、用户空间工具和管理实用程序。具体步骤取决于您的 Linux\
  \ 发行版，但通用过程在各个系统之间是类似的。\n\n### 分步安装指南\n\n以下是在 `Ubuntu Server` 上安装 `KVM` 的详细指南：\n\
  \n1.  验证硬件虚拟化支持\n\n首先，确保您的 CPU 支持硬件虚拟化：\n\n```bash\negrep -c '(vmx|svm)' /proc/cpuinfo\n\
  ```\n\n如果输出大于 0，说明您的 CPU 支持硬件虚拟化。\n\n2.  安装 KVM 及相关包\n\n安装必要的 `KVM` 软件包：\n\n```bash\n\
  sudo apt install qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils virtinst\
  \ virt-manager\n```\n\n\n\n\n此命令安装以下内容：\n\n*   `qemu-kvm`: 主 KVM 软件包\n*   `libvirt-daemon-system`:\
  \ `libvirt` 守护进程和系统配置文件\n*   `libvirt-clients`: 用于 `libvirt` 的客户端库和工具\n*   `bridge-utils`:\
  \ 配置 Linux 以太网桥接的工具\n*   `virtinst`: 一组用于创建虚拟机的命令行工具\n*   `virt-manager`: 用于管理虚拟机的图形化工具（服务器安装中可选）\n\
  \n### 3. 将您的用户添加到 KVM 组\n\n为了允许您的用户管理虚拟机，请将其添加到 `libvirt` 和 `kvm` 组：\n\n`sudo usermod\
  \ -aG libvirt $USER` `sudo usermod -aG kvm $USER`\n\n注销并重新登录以使用户组权限的更改生效。\n\n###\
  \ 4. 启动并启用 libvirt 守护进程\n\n确保 `libvirt` 守护进程正在运行并已设置为开机自启动：\n\n`sudo systemctl start\
  \ libvirtd`\n\n`sudo systemctl enable libvirtd`\n\n### 5. 配置网络（可选）\n\n默认情况下，KVM\
  \ 为虚拟机设置了 NAT 网络。如果您想使用桥接网络或创建自定义网络，则需要单独进行配置。以下是设置桥接网络的示例：\n\na. 如果尚未安装，请安装 `netplan`\
  \ 软件包：\n\n```bash\nsudo apt install netplan.io\n```\n\nb. 创建一个新的 Netplan 配置文件：\n\
  \n```bash\nsudo nano /etc/netplan/01-netcfg.yaml\n```\n\nc. 添加以下配置（根据您的网络进行调整）：\n\
  \n```yaml\nnetwork:\n  version: 2\n  renderer: networkd\n  ethernets:\n    enp0s3:\n\
  \        dhcp4: no\n  bridges:\n      br0:\n        interfaces: [enp0s3]\n     \
  \   dhcp4: yes\n```\n\nd. 应用新配置：\n\n```bash\nsudo netplan apply\n```\n\n### 6. 安装额外工具（可选）\n\
  \n根据您的需求，您可能想要安装额外的工具来管理 KVM：\n\n`sudo apt install virt-top libguestfs-tools`\n\n\
  *   `virt-top`: 一个类似 top 的工具，用于显示虚拟域的统计信息\n*   `libguestfs-tools`: 一组用于访问和修改虚拟机磁盘镜像的工具\n\
  \n### 验证安装\n\n完成安装后，验证 KVM 是否已正确设置并准备就绪非常。以下是检查 KVM 安装的步骤：\n\n#### 1. 验证 KVM 内核模块\n\
  \n检查 KVM 内核模块是否加载：\n\n```bash\nlsmod | grep kvm\n```\n\n您应该能看到包含 `kvm_intel`（Intel\
  \ CPU）或 `kvm_amd`（AMD CPU）的输出。\n\n#### 2. 检查 libvirt 状态\n\n验证 `libvirt` 守护进程正在运行：\n\
  \n`sudo systemctl status libvirtd`\n\n输出应显示该服务处于活动并运行状态。\n\n#### 3. 验证 KVM 设备\n\n\
  检查 KVM 设备文件是否存在：\n\n```bash\nls -l /dev/kvm\n```\n\n您应该能看到列出的 `/dev/kvm` 设备文件。\n\
  \n#### 4. 测试虚拟机创建\n\n尝试创建一个较小的虚拟机以确保一切运行正常：\n\n`sudo virt-install --name=testvm\
  \ --vcpus=1 --memory=1024 --cdrom=/path/to/iso --disk size=5`\n\n将 `/path/to/iso`\
  \ 替换为 Linux ISO 文件的路径。如果命令运行运行并开始创建虚拟机，则说明 KVM 安装工作正常。\n\n#### 5. 检查可用网络\n\n列出可用的虚拟网络：\n\
  \n`sudo virsh net-list --all`\n\n您应该至少看到列出的默认网络。\n\n#### 6. 验证硬件加速\n\n检查是否有硬件加速可用：\n\
  \n`kvm-ok`\n\n如果 KVM 配置恰当，您应该会看到一条指示可以使用 KVM 加速的消息。\n\n## 结论\n\n在本章中，我们涵盖了虚拟化的基础知识，介绍了不同类型的虚拟化技术，并强调了使用\
  \ KVM 的优势。我们还介绍了设置支持 KVM 的 Linux 环境的过程，并提供了在 Ubuntu Server 系统上安装和验证 KVM 的详细指南。\n\
  \n现在 KVM 已安装并验证，您准备好开始创建和管理虚拟机了。在下一章中，我们将深入研究 KVM 的架构，并探索它如何与 Linux 内核和硬件交互以提供高效的虚拟化。\n\
  \n请记住，虽然本指南侧重于 Ubuntu Server，但原理和通用步骤也适用于其他 Linux 发行版。如果您使用的是不同的 Linux 版本，请务必参考您发行版的文档以获取特定的包名和命令。\n\
  \n随着学习的深入，您将更深入地理解 KVM 的能力，并学会利用其功能为各种用例构建稳健、可扩展的虚拟化解决方案。\n\n\n\n\n\n使用 `virsh`\
  \ 克隆一个虚拟机：\n\n```\nvirsh dumpxml SOURCE_VM > new_vm.xml\n```\n\n`vim new_vm.xml`\
  \ # 编辑 XML 以更改名称、UUID 和其他细节\n\n`virsh define new_vm.xml`\n\n使用 CLI 工具具有多个优势：\n\n\
  * 脚本化和自动化 \n* 远程管理能力\n* 对虚拟机配置进行精粒度控制\n* 能够高效地管理大量虚拟机\n\n然而，与图形化工具相比，它们需要对 KVM 内部原理有更多了解，且学习曲线可能更陡峭。\n\
  \n## 配置虚拟机\n\n虚拟机的妥善配置对于获得最佳性能和资源利用利用率至关重要。本节将涵盖 CPU、内存和存储等资源的分配，以及虚拟机的网络配置。\n\n\
  ### 分配资源（CPU、内存、存储）\n\n高效的资源分配可以确保虚拟机拥有必要的计算能力，同时保持系统的整体性能。\n\n#### CPU 分配\n\nKVM\
  \ 允许为虚拟机灵活地分配 CPU，包括：\n\n1. `vCPU` 数量：分配给虚拟机的虚拟 CPU 数量。\n2. `CPU pinning`（CPU 绑定）：将\
  \ `vCPUs` 与特定的物理 CPU 核心关联。\n3. `CPU model`：向虚拟机暴露特定的 CPU 特性。\n\n使用 `virsh` 修改 CPU\
  \ 分配：\n\n```\nvirsh setvcpus VM_NAME VCPU_COUNT --config --maximum\n```\n\n```\n\
  virsh setvcpus VM_NAME VCPU_COUNT --config\n```\n\n可以在虚拟机的 XML 配置中配置 `CPU pinning`：\n\
  \n```xml\n<vcpu placement='static'>4</vcpu>\n<cputune>\n  <vcpupin vcpu='0' cpuset='0'/>\n\
  \  <vcpupin vcpu='1' cpuset='1'/>\n  <vcpupin vcpu='2' cpuset='2'/>\n  <vcpupin\
  \ vcpu='3' cpuset='3'/>\n</cputune>\n```\n\n#### 内存分配\n\n妥当的内存分配对虚拟机性能至关重要。KVM 支持：\n\
  \n1. 静态内存分配\n2. 动态内存分配（内存气球技术）\n\n使用 `virsh` 修改内存分配：\n\n```\nvirsh setmaxmem VM_NAME\
  \ SIZE --config\n```\n\n```\nvirsh setmem VM_NAME SIZE\n```\n\n在虚拟机的 XML 配置中启用内存气球：\n\
  \n```xml\n<memballoon model='virtio'>\n  <stats period='10'/>\n</memballoon>\n```\n\
  \n#### 存储分配\n\nKVM 提供了多种存储选项：\n\n1. 基于文件的存储（`qcow2`, `raw`）\n2. 块设备存储\n3. 网络存储（`iSCSI`,\
  \ `NFS`）\n\n使用 `virsh` 为虚拟机添加新磁盘：\n\n```\nvirsh attach-disk VM_NAME /path/to/disk.qcow2\
  \ vdb --cache none\n```\n\n修改存储的 XML 配置：\n\n```xml\n<disk type='file' device='disk'>\n\
  \  <driver name='qemu' type='qcow2'/>\n  <source file='/path/to/disk.qcow2'/>\n\
  \  <target dev='vda' bus='virtio'/>\n</disk>\n```\n\n### 网络配置\n\n妥当的网络配置对于虚拟机的连性和性能至关重要。KVM\
  \ 支持多种网络模式：\n\n1. 桥接模式 (Bridge mode)\n2. NAT 模式\n3. 路由模式 (Routed mode)\n4. 隔离模式\
  \ (Isolated mode)\n\n#### 桥接模式\n\n桥接模式将虚拟机直接连接到主机的网络，使其在网络上像一台独立的物理机器。\n\n在主机上创建桥接接口：\n\
  \n```bash\nnmcli con add type bridge ifname br0\n```\n\n```bash\nnmcli con add type\
  \ bridge-slave ifname eth0 master br0\n```\n\n在虚拟机的 XML 中配置使用桥接：\n\n```xml\n<interface\
  \ type='bridge'>\n  <source bridge='br0'/>\n  <model type='virtio'/>\n</interface>\n\
  ```\n\n#### NAT 模式\n\nNAT（网络地址翻译）模式允许虚拟机共享主机的 IP 地址进行出流量。\n\n创建一个 NAT 网络：\n\n```bash\n\
  virsh net-define /etc/libvirt/qemu/networks/default.xml\n```\n\n```bash\nvirsh net-start\
  \ default\n```\n\n```bash\nvirsh net-autostart default\n```\n\n在虚拟机的 XML 中配置使用 NAT：\n\
  \n```xml\n<interface type='network'>\n  <source network='default'/>\n  <model type='virtio'/>\n\
  </interface>\n```\n\n#### 路由模式\n\n路由模式为虚拟机分配与主机不同子网的 IP 地址，并在它们之间路由流量。\n\n创建一个路由网络\
  \ XML 文件：\n\n```xml\n<network>\n  <name>routed</name>\n  <forward mode='route'/>\n\
  \  <bridge name='virbr1' stp='on' delay='0'/>\n  <ip address='192.168.100.1' netmask='255.255.255.0'>\n\
  \    <dhcp>\n      <range start='192.168.100.2' end='192.168.100.254'/>\n    </dhcp>\n\
  \  </ip>\n</network>\n```\n\n定义并启动网络：\n\n```bash\nvirsh net-define routed.xml\n\
  ```\n\n```bash\nvirsh net-start routed\n```\n\n```bash\nvirsh net-autostart routed\n\
  ```\n\n#### 隔离模式\n\n隔离模式为虚拟机创建一个无外部访问的私有网络。\n\n创建一个隔离网络 XML 文件：\n\n```xml\n<network>\n\
  \  <name>isolated</name>\n  <forward mode='route'/>\n  <bridge name='virbr1' stp='on'\
  \ delay='0'/>\n  <ip address='192.168.100.1' netmask='255.255.255.0'>\n    <dhcp>\n\
  \      <range start='192.168.100.2' end='192.168.100.254'/>\n    </dhcp>\n  </ip>\n\
  </network>\n```\n\n*(注：此处由于原文文本似乎存在重复或截断，翻译已根据提供的逻辑结构进行完整对齐。)*\n\n[/content]\n\n\
