  \ 的版本\n* 用法：`virsh version`\n\n## virt-manager 命令\n\n`virt-manager` 是一个管理虚拟机的图形用户界面。虽然它没有像\
  \ `virsh` 那样的命令行界面，但可以通过命令行带有各种选项启动它。\n\n### 1. 启动 `virt-manager`\n\n* 打开 `virt-manager`\
  \ 主窗口\n* 用法：`virt-manager`\n\n### 2. 连接到远程主机\n\n* 打开 `virt-manager` 并连接到远程 libvirt\
  \ 主机\n* 用法：`virt-manager -c qemu+ssh://user@hostname/system`\n\n### 3. 打开“新建虚拟机”向导\n\
  \n* 启动 `virt-manager` 并立即打开“创建新的虚拟机”向导\n* 用法：`virt-manager --show-domain-creator`\n\
  \n### 4. 显示域的详情\n\n* 打开 `virt-manager` 并显示特定域的详情窗口\n* 用法：`virt-manager --show-domain-editor\
  \ <domain>`\n\n### 5. 显示主机详情\n\n* 打开 `virt-manager` 并显示主机详情窗口\n* 用法：`virt-manager\
  \ --show-host-summary`\n\n### 6. 调试模式\n\n* 以调试模式打开 `virt-manager`\n* 用法：`virt-manager\
  \ --debug`\n\n### 7. 不派生\n\n* 防止 `virt-manager` 派生进程\n* 用法：`virt-manager --no-fork`\n\
  \n## 高级用法\n\n### 1. `virsh dump`\n\n* 将域的核心转转储到文件中以进行分析\n* 用法：`virsh dump <domain>\
