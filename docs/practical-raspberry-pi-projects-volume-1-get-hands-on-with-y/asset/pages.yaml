    # LED stripes


    Two versions of LED stripes are offered.

    ''Primitive'' ones are based on analogue technology. In it, an entire strip of
    diodes has the colour set by the three input pins. Systems such as the mega display
    shown on the left- hand image require the use of the digital version. They are
    based on the concept of the shift register. Your system inputs individual colour
    values which are then pushed on along the strip.'
