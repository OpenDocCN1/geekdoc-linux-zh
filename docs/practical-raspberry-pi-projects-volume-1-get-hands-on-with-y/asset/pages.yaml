    # Simulate traffic lights using your breadboard


    Step into physical computing and hardware engineering with Raspberry Pi and this
    breadboard-based traffic light simulation


    Even with a platform as cheap, simple and powerful as the Raspberry Pi, taking
    your first foray into the world of physical computing and hardware projects can
    often be a fairly daunting experience. There are a number of extra factors to
    consider, and the margin for error can be quite a bit slimmer.


    On the plus side, however, physical computing is perhaps the most rewarding way
    to experiment with computers and coding, as it allows you to manipulate tangible
    items in the physical world with the power of code. You''ll learn plenty of essential
    skills along the way, and the thrilling reward of seeing your code manifested
    in a physical action simply can''t be beaten.


    One of the best ways to start making use of those GPIO pins and get really creative
    with your Pi later is a simple LED project, as it will allow you to see the main
    GPIO commands in action. Now get your Raspberry Pi, LEDs and jumper cables at
    the ready and let''s get started!


    # 01 Get the parts


    The parts you required for this tutorial should all be available from any reputable
    electronics dealer such as Maplin, CPC or one of the many independent Raspberry
    Pi retailers. The breadboard, LEDs, cables and resistors should cost you around
    £5 to £10 maximum.


    # 02 Update your Pi


    Before undertaking any project, regardless of whether it is hardware or software
    based, you should always update your Raspberry Pi to ensure you have the most
    stable software versions and latest functionality. This is especially important
    when experimenting with GPIO. You can do this using the following commands:


    ```

    ```bash

    sudo apt-get update

    sudo apt-get upgrade

    ```

    ```'
