    \ will need to get an API key in order to pull down the weather data for your\
    \ ticker. You can purchase a developer key for free, as long as you don’t download\
    \ data more than 500 times per day or 10 times per minute. This should be adequate\
    \ for\n\npersonal use, if you need more than this, you can purchase an API key\
    \ that covers more usage. Interacting with Weather Underground involves sending\
    \ a request as an HTTP URL and receiving either a JSON or XML file back.\n\nIn\
    \ the sample code, we pull back the data as JSON. The first thing you’ll need\
    \ is your location identifier. You can request a location identifier by either\
    \ latitude and longitude or by geolocating your current IP address. You can even\
    \ do a search by place name. Once you have this, you can go ahead and start to\
