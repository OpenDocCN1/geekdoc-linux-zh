  md: '# GET INTERACTIVE WITH SCRATCH


    ![](img/a1548a579bd09ff29b2b92de3f565e63_16_0.png)


    # 02 Connecting the breadboard


    Power off your Pi and disconnect the power cable. Get your breadboard, an LED,
    a 330-ohm resistor and two GPIO cables ready. You''ll want to connect the 33V
    pin (top-right pin, closest to the SD card) to one end of the 330-ohm resistor,
    and then connect the positive terminal of the LED (the longer leg, which shows
    a little bump) to the other end of the resistor.


    # 03 Switching the LED on and off


    At the moment, the LED is connected to a pin that constantly provides 3.3V. This
    isn''t very useful if we want to be able to turn it on and off, so let''s connect
    it to GPIO 17, which we can turn on and off. GPIO 17 is the sixth pin from the
    left on the top row of pins. Power the Pi back on. We can turn the LED on by exporting
    the GPIO pin, setting it to an output and then setting its value to 1. Setting
    the value to 0 turns the LED back off.


    ```

    ```

    echo 1 > /sys/class/gpio/export

    echo out > /sys/class/gpio/gpio17/direction

    echo 1 > /sys/class/gpio/gpio17/value

    echo 0 > /sys/class/gpio/gpio17/value

    ```

    ```


    ![](img/a1548a579bd09ff29b2b92de3f565e63_16_1.png)


    # 04 Controlling the LED from Scratch


    Start the LXDE desktop environment and open ScratchGPIO3. Go to the control section
    and create a simple script that broadcasts pinOn when Sprite1 is clicked. Then
    click the sprite. The LED should light up. Then add to the script to wait 1 second
    and then broadcast pinOff. If you click the sprite again, the LED will come on
    for a second and then go off. ScratchGPIO3 uses pin numbers rather than GPIO numbers
    to identify pins. The top-right pin (the 3.3V we first connected our LED to) is
    pin number 1; the pin underneath that is pin number 2; and so on.


    ![](img/a1548a579bd09ff29b2b92de3f565e63_16_2.png)


    # 05 Wiring up our push button


    Power off the Pi again. This circuit is a little bit more complicated than the
    LED one we created previously. The first thing we need to do is connect 3.3V (the
    top-right pin we used to test our LED) to the positive rail of the breadboard.
    Then we need to connect a 10/kohm resistor to the positive rail, and the other
    end to an empty track on the breadboard. Then on the same track, add a wire that
    has one end connected to GPIO 4. This is pin two to the right of GPIO 12. Then,
    on the same track again, connect one pin of the push button. Finally, connect
    the other pin of the push button to ground by adding a wire that is connected
    to the same negative rails that ground is connected to.


    When the button is not pressed, GPIO 4 will be receiving 3.3V. However, when the
    button is pressed, the circuit to ground will be completed and GPIO 4 will be
    receiving 0V (and have a value of 0, because there is much less resistance on
    the path to ground).


    We can see this in action by watching the pin''s value and then pressing the button
    to make it change:


    ```

    ```

    echo 4 > /sys/class/gpio/export

    echo in > /sys/class/gpio/gpio4/direction

    watch -n 0.5 cat /sys/class/gpio/gpio4/value

    ```

    ```


    ![](img/a1548a579bd09ff29b2b92de3f565e63_16_3.png)


    # 06 Let there be light!


    Boot up the Pi and start ScratchGPIO3 as before. Go to the control section and
    add when green flag clicked. Then attach a forever loop, and inside that an if
    else statement. Go to the operators section and add an if [] is [] operator to
    the if statement. Then go to the sensing section and add a value sensor to the
    left side of the equality statement, and set the value to pin7. On the right side
    of the equality statement, enter 0. Broadcast pinOn if the sensor value is 0,
    and broadcast pinOff otherwise. Click the green flag. If you push the button,
    the LED will light up!


    # You''ll learn...


    +   1. **Simple circuits**

    +   While these are very simple circuits, you''ll get a great feel of how the
    Raspberry Pi interfaces with basic prototyping kit. If you need to buy the bits
    and pieces, we recommend you check out: shop.pimoroni.com

    +   2. **Coding principles**

    +   If you''re new to programming, Scratch is the perfect place to learn the same
    programming principles employed by all programming languages.

    +   3. **Physical computing**

    +   There''s nothing more magical than taking code from your computer screen and
    turning it into a real-life effect. Your first project might just be a light on
    and off, but with that lit banked, the sky is the limit.'
