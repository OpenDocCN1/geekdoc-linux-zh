  md: '# Raspberry Pi-controlled car build process


    # Components list


    +   * A toy RC car with two channels (steering and drive)

    +   * Adafruit PWM I2C servo driver

    +   * Female-to-female jumper cables

    +   * 5V battery power bank


    Estimated cost: £60 / $100


    Components from www.modmypi.com


    Before you can take control of your car with a smartphone, you''ll need to make
    some significant changes to the chassis


    To help our toy car come to life using the latest web technologies and our credit
    card-sized computer, we''re going to need to make some pretty significant changes
    to its workings. Fortunately, the most complex aspects of the build can be accomplished
    with a couple of affordable purchases, namely a servo controller board to take
    care of the steering and throttle, and a 5V battery pack to keep the Raspberry
    Pi running smoothly.


    # 01 Identify and remove old radio


    This project is effectively replacing the car''s normal transmitter and receiver.
    Notice the three sockets on the original receiver: one goes to the motor controller
    and one to the steering servo. Some remote-control cars also have separate battery
    for the electronics, but those (especially with an electronic speed controller
    with BEC) get their 5V power supply directly from the speed controller, saving
    on components. If you don''t have a speed controller with 5V BEC, you''ll need
    to get a 5V supply elsewhere. Many shops sell 5V battery power supplies – often
    as mobile phone emergency top-ups. www.modmypi.com sells a suitable 5V battery
    power bank for under £20.


    ![](img/a1548a579bd09ff29b2b92de3f565e63_39_0.png)


    **Servo control** We''ve used the Adafruit PWM I2C servo driver board from www.modmypi.com


    **Pi-powered** The Raspberry Pi sits front and centre to keep it as safe as possible


    **Power up** This 5V battery pack keeps our Raspberry Pi running for a good few
    hours


    **Pick a car** You can use pretty much any affordable car for this project'
