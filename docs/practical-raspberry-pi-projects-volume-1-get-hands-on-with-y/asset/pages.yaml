- pgno: 44
  md: '# # How I made: Robot Arm


    Get to grips with natural motion control


    ![](img/a1548a579bd09ff29b2b92de3f565e63_44_0.png)


    # **What first inspired you to begin your robot arm project?**


    The robot arm itself was one I’d seen years ago and I really wanted it because
    it’s something you can control yourself – I really captured my young imagination.
    I was volunteering at a science museum down here in Harlow and this club based
    around the Raspberry Pi spring up, and I bought the robot arm because I wanted
    it. So then I had the Raspberry Pi thing going on at the same time and thought,
    why not meld the two?


    I had this complicated system of key presses to get it to do anything, which was
    a bit boring, and then James Dail (one of the people who helps out with the club)
    gave me the idea of shoving an accelerometer on the top of it to give an idea
    of where it is. Look at that and thought, ‘What if I had the accelerometer on
    me and sort of used it to mirror the motion of my hand?’ So I looked around, searched
    up the accelerometer he was using (the MPU-6050) and then found it for about £5
    on eBay – I’ll normally about £30 from SparkFun but I’m on a student budget...


    A lot of the code I’ve used is borrowed but open source, and people have said
    it’s fine, so then I went through and had two programs – one that could control
    the arm, one that took the input in from the accelerometer – and kind of just
    smashed them together. It’s not that nice to look at, but it works and that’s
    all that really matters.


    # **So what exactly are you reading with that MPU-6050?**


    There’s the gyroscope and the accelerometer in the code I’d found – you can use
    one or the other, but the gyroscope is very good for degrease over time and it
    tends to drift, while the accelerometer is good for sudden turns and for measuring
    gravity. If you compare the two to each other then you can get a rough angle all
    of the time, so it’s essentially the accelerometer and gyroscope used together
    to correct the faults with one or the other. It’s got two axes of motion – pitch
    and roll.


    # **Take us through the code itself.**


    So in the first bit it finds where the actual I2C interface is and there’s a quick
    setup – I’ve got three buttons on there to control the gripper and the lights,
    so it sets those up – and then there’s a bit which is using the USB library to
    find the robot arm, then splitting it out if it’s an issue. There are a couple
    of definitions for some functions to actually move the arm, so it’s a little bit
    easier – each motor direction is a different binary number – and then there are
    more definitions for setting up reading data from the accelerometer and a bit
    of maths for making sure the gyro and the accelerometer are both giving the correct
    angle. Then there’s this little loop with a try inside it that is just pulling
    the accelerometer for data, splitting out the maths stuff, before just checking
    that the angle given is within a certain range. If it is, move this motor left
    (for example), or if a button is pressed then it turns a light on. The only problem
    I’ve had with it is that to actually move it, it requires a change in angle –
    so there’s not a continuous thing, I have to wave my hand a little bit, but there’s
    that degree angle and if I trip it then it’ll move around.


    # **Have you considered adding any more forms of control?**


    Yeah, I’ve done a lot of research into this. In terms of other ways to control
    it, I quite like the intuitiveness of it – to rotate and move this arm you are
    moving your own arm, so that’s something I’ve been focussing on and trying to
    get more intuitive. Trying to get some sort of – I bought an Arduino at some point
    – trying to build an actual robotic hand and then spreading out from there. Eventually,
    my big plan – many, many years in the future – is to have an entire sort of human
    body that is controlled by the movements of the user, but that’s a very large
    plan


    which I haven’t put too much into just yet! But essentially, the prototype that
    people have done before is sort of having two sensors – potentiometers – on the
    fingers just to measure the actual rotation and closing of the fist, then having
    that represented with servos and then possibly doing that with actual pieces of
    string to sort of emulate the tendons. So you’d have a single servo or a couple
    of servos, in an arm bit that would pull string, which would close each finger
    in turn.


    Another idea, which seems to be one of the most viable, is having it completely
    brain controlled... There’s a fair amount of interest in reading brain activity
    – you can do it with NeuroSky, for example. There’s quite a nice open source project
    which I might end up using because it has four inputs, so you can measure at least
    two things at once and that seems to be a fairly interesting place to go. It’s
    expensive though, and if you’re going open source then they have a lot of warnings
    on websites saying that you do this at your own risk, this is not a medical product,
    you may fry your brain...


    # **What is the next step then?**


    Further projects would probably be replacing the motors. Because it’s motor-driven,
    so it’s timing-based, so having something with servos instead where I can have
    a definite angle would be a lot more useful, a lot more precise and wouldn’t tend
    to go... one of the problems with it is that if you tell it to keep going in one
    direction, it will keep going in one direction whether it wants to or not, and
    there’s this awful grinding of gears as it attempts to go in one direction and
    can’t. So, that will probably be a new arm, a new robot, trying to get it to be
    a bit more nice-looking and a bit more precise.


    ![](img/a1548a579bd09ff29b2b92de3f565e63_44_1.png)


    **Joseph Thomas** is a student hoping to run a Raspberry Pi club from a science
    museum in Harlow, where they have worked on projects ranging from a robot arm
    to a portable PI.


    # **Like it?**


    The robot arm that Joseph is using can be bought from Maplins in the UK (**bit.ly/1d98RT**)
    or ordered from Adafruit (**elsewhere in the world (bit.ly/1dX8Dt)**. There are
    many guides online to get you up and running, such as this one (**bit.ly/1AKdQOo**).


    # **Further reading**


    NeuroSky has a whole project dedicated to EEG and ECG biosensors, including the
    popular MindWave headsets (**neurosky.com**), and there are a few hacks available
    too (**bit.ly/1CWDeSP**). OpenBCI is a burgeoning open source project dedicated
    to brain-computer interfaces (**openbci.com**).


    > Another idea is having the arm be completely brain controlled'
