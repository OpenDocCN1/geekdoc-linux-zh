- pgno: 76
  md: "# CREATE YOUR OWN DIGITAL ASSISTANT\n\n# Full code listing\n\n```\n# You need\
    \ to import the pyaudio module\nimport pyaudio\n\n# First, we will listen\n# We\
    \ need to set some parameters\n# Buffer chunk size in bytes\nCHUNK = 1024\n# The\
    \ audio format\nFORMAT = pyaudio.paInt16\n# The number of channels to record on\n\
    CHANNELS = 2\n# The sample rate, 44.1KHz\nRATE = 44100\n# The number of seconds\
    \ to record for\nRECORD_SECS = 5\n\n# Next, we create a PyAudio object\np = pyaudio.PyAudio()\n\
    \n# We need a stream to record from\nstream = p.open(format=FORMAT, channels=CHANNELS,\n\
    \    rate=RATE, input=True, frames_per_buffer=CHUNK)\n\n# We can now record into\
    \ a temporary buffer\nframes = []\nfor i in range(0, int(RATE / CHUNK * RECORD_SECS)):\n\
    \    data = stream.read(CHUNK)\n    frames.append(data)\n\n# We can now shut everything\
    \ down\nstream.stop_stream()\nstream.close()\np.terminate()\n\n# If we want to\
    \ play a wave file, we will need the wave module\nimport wave\n\n# We can open\
    \ it, give it a filename\nwf = wave.open(\"filename wav\", \"rb\")\n\n# We need\
    \ a new PyAudio object\np = pyaudio.PyAudio()\n\n# We will open a stream, using\
    \ the settings from the wave file\nstream = p.open(format=p.get_format_from_width(wf.getsampwidth()),\n\
    \    channels=wf.getnchannels(), rate=wf.getframerate(),\n    output=True)\n\n\
    # We can now read from the file and play it out\ndata = wf.readframes(CHUNK)\n\
    while data != b'':\n    stream.write(data)\n    data = wf.readframes(CHUNK)\n\n\
    # Don't forget to shut everything down again\nstream.stop_stream()\nstream.close()\n\
    p.terminate()\n```\n\nthe audio you can simply loop through, reading one chunk\
    \ of data from the WAVE file at a time and immediately writing out to the PyAudio\
    \ stream. Once you're done you can stop the stream and close it, as you did above.\n\
    \nIn both of the above cases, the functions block when you call them until they\
    \ have completed. What are the options if you want still be able to do processing\
    \ while you are either recording audio or outputting audio? There are non-blocking\
    \ versions that take a callback function as an extra parameter called stream_callback.\
    \ This callback function takes four parameters, named in data, frame_count, time_info,\
    \ and status. The in_data parameter will contain the recorded audio if input is\
    \ true. The callback function needs to return a tuple with the values out_data\
    \ and flag. Out_data contains the data to be outputted if output is true in the\
    \ call to the function open. If the input is true instead, then out_data should\
    \ be equal to None. The flag can be any of paContinue, paComplete or paAbort,\
    \ with obvious meanings. One thing to be aware of is that you cannot call_read\
    \ or write functions when you wish to use a callback function. Once the stream\
    \ is opened, you simply call the function stream.start_stream(). This starts a\
    \ separate thread to handle this stream processing. You can use stream.is_active()\
    \ to check on the current status. Once the stream processing is done, you can\
    \ call stream.stop_stream() to stop the secondary thread.\n\nNow that we have\
    \ covered how to get audio information into and out of your Raspberry Pi, you\
    \ can start by adding this functionality to your next project. In the next step,\
    \ we will look at how to convert this audio information into something usable\
    \ by the computer by using voice recognition modules. We will also look at the\
    \ different ways to turn text into audio output using TTS modules."
  merge: -1
