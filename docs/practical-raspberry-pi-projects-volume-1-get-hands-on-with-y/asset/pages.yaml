  md: "![](img/a1548a579bd09ff29b2b92de3f565e63_11_0.png)\n\n> It's easier to make\
    \ your Raspberry Pi talk than you might think, thanks to eSpeak\n\n# # Raspberry\
    \ Pi voice synthesizer\n**Add the power of speech to your Raspberry Pi projects\
    \ with the versatile eSpeak Python library**\n\n+   **What you'll need**\n+  \
    \ \n+   - Portable USB speakers\n+   - python-espeak module\n+   - eSpeak\n+ \
    \  - Raspbian (latest image)\n\nWe've shown in previous issues how the Raspberry\
    \ Pi can be used to power robots, and as a tiny computer it can also be the centre\
    \ of an Internet of Things in your house or office.\n\nFor these reasons and more,\
    \ using the Raspberry Pi for text-to-voice commands could be just what you're\
    \ looking for. Due to the Debian base of Raspbian, the powerful eSpeak library\
    \ is easily available for anyone looking to make use of it. There's also a module\
    \ that allows you to use eSpeak in Python, going beyond the standard command-line\
    \ prompts so you can perform automation tasks.\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_11_1.png)\n\
    \n# **01 Everything you'll need**\n\nWe'll install everything we plan to use in\
    \ this tutorial at once. This includes the eSpeak library and the Python modules\
    \ we need to show it off. Open the terminal and install with:\n\n```\n`$ sudo\
    \ apt-get install espeak python-espeak python-tk`\n```"
