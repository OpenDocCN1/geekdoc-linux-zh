  md: "# CODE YOUR OWN TWITTER BOT\n\n'LUD Pi Bot', gave it the same description and\
    \ set the Website to http://www.linusers.co.uk/. The Callback URL is unnecessary.\
    \ You'll have to agree with the developer rules and then click the Create button.\n\
    \n+   03 Creating an access token\n+   Go to the Settings tab and change the Access\
    \ type from 'Read only' to 'Read and Write'. Then click the 'Update this Twitter\
    \ application's settings' button. The next step is to create an access token.\
    \ To do that, click the 'Create my access token' button. If you refresh the details\
    \ page, you should have a consumer key, a consumer secret and access token, plus\
    \ an access token secret. This is everything we need to authenticate with Twitter.\n\
    \n+   04 Authenticating with Twitter\n+   We're going to create our bot as a class,\
    \ where we authenticate with Twitter in the constructor. We take the tokens from\
    \ the previous steps as parameters and use them to create an instance of the Twython\
    \ API. We also have a variable, last_run, which is set to the current time. This\
    \ is used to check if there are new tweets later on.\n\n# Full code listing\n\n\
    ```\n#!/usr/bin/env python2\n\n# A Twitter Bot for the Raspberry Pi that retweets\
    \ any\n# content from\n# @LinuxUserMag. Written by Liam Fraser for a Linux User\
    \ &\n# Developer article.\n\nimport sys\nimport time\nfrom datetime import datetime\n\
    from twython import Twython\n\nclass bot:\n    def __init__(self, c_key, c_secret,\
    \ a_token, a_token_secret):\n        # Create a Twython API instance\n       \
    \ self.api = Twython(c_key, c_secret, a_token, a_token_secret)\n\n        # Make\
    \ sure we are authenticated correctly\n        try:\n            self.api.verify_credentials()\n\
    \        except:\n            sys.exit(\"Authentication Failed\")\n        self.last_run\
    \ = datetime.now()\n\n    @staticmethod\n    def timestr_to_datetime(timestr):\n\
    \        # Convert a string like Sat Nov 09 09:29:55 +0000\n        # 2013 to\
    \ a datetime object. Get rid of the timezone\n        # and make the year the\
    \ current one.\n        timestr = timestr[:18] + timestr[23:]\n        now().year)\n\
    \n        # We now have Sat Nov 09 09:29:55 2013\n        return datetime.strptime(timestr,\
    \ \"%a %b %d %H:%M:%S %Y\")\n\n    def retweet_task(self, screen_name):\n    \
    \    # Retweets any tweets we've not seen\n```\n\n```\n# From a user\nprint(\"\
    Checking for new tweets from\" @{'0'}.\nformat(screen_name))\n\n# Get a list of\
    \ the users latest tweets\ntimeline = self.api.get_user_timeline(screen_name =\
    \ screen_name)\n\n# Loop through each tweet and check if it was\n# posted since\
    \ we were last called\nfor t in timeline:\n    tweet_time = bot.timestr_to_datetime(t['created_at'])\n\
    \    if tweet_time > self.last_run:\n        print(\"Retweeting {}\".format(t['id']))\n\
    \        self.api.retweet(id = t['id'])\n\nif __name__ == \"main\":\n# The consumer\
    \ keys can be found in your application's\n# Details page located at https://dev.twitter.com/\n\
    # apps(under OAuth settings')\nc_key=\"\nc_secret=\"\n# The access tokens can\
    \ be found in your application's\n# Details page located at https://dev.twitter.com/apps\n\
    # (located under Access token')\na_token=\"\na_token_secret=\"\n# Create an instance\
    \ of the bot class\ntwitter = bot(c_key, c_secret, a_token, a_token_secret)\n\
    # Retweet anything new @LinuxUserMag every 5 minutes\nwhile True:\n    # Update\
    \ the time after each retweet task so we're\n    # only retweeting new stuff\n\
    \    twitter.retweet_task(\"LinuxUserMag\")\n    twitter.last_run = datetime.now()\n\
    \    time.sleep(5 * 60)\n```\n\n+   05 Retweeting a user\n+   The first thing\
    \ we need to do is get a list of the user's latest tweets. We then loop through\
    \ each tweet and get its creation time as a string, which is then converted to\
    \ a datetime object. We then check that the tweet's time is newer than the time\
    \ the function was last called - and if so, retweet the tweet.\n\n+   06 The main\
    \ section\n+   The main section is straightforward. We create an instance of the\
    \ bot class using our tokens, and then go into an infinite loop. In this loop,\
    \ we check for any new retweets from the users we are monitoring (we could run\
    \ the retweet task with different users), then update the time everything was\
    \ last run, and sleep for five minutes.\n\nIf the tweet's time is newer than the\
    \ time the function was last called, we retweet it\n\nGet the code: bit.ly/1RTgNSH\n\
    \n21"
