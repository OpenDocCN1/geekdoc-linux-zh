  md: '![](img/a1548a579bd09ff29b2b92de3f565e63_71_0.png)


    # Supercharge your Raspberry Pi


    Get the most out of your Raspberry Pi with these performance-enhancing tips and
    tricks


    Your Raspberry Pi is plugged in. Raspbian is installed on the SD card and you
    are right in the middle of setting up a wireless print server or building a robot
    to collect your mail from your doormat.


    But are you truly getting the most from your little computer? Do the components
    you''re using maximise the potential of your Raspberry Pi or are they holding
    it back? Perhaps you haven''t explored the full set of options in Raspbian, or
    you''re running the entire OS from SD card, something that can reduce SD card
    lifespan.


    Various tools and techniques can be employed to improve performance, from choosing
    the right hardware to overclocking the CPU. You might even maximise storage space
    on the Raspberry Pi''s SD card or all but replace it with a secondary device to
    help improve speed.


    Use these tips and tricks to reconfigure your Raspberry Pi setup and optimise
    software and hardware to ensure you get the best performance for your projects.


    ![](img/a1548a579bd09ff29b2b92de3f565e63_71_1.png)


    **01 Use better storage hardware**


    Your choice of storage media can have an impact on your Raspberry Pi''s performance,
    regardless of the operating system. A low capacity SD card with poor error correction,
    is going to be slower than a larger card with greater resilience, so you need
    to find the right balance for your project and shop wisely.'
