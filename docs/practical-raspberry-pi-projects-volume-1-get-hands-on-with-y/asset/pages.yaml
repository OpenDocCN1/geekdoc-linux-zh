    \n# ### HTML\n\nSome simple HTML code that can point us to some important websites.\n\
    \nThe h2 tag is used to display the time thanks to Java\n\n```\n<h1>Welcome to\
    \ the internet…</h1>\n<h2></h2>\n<p><a href=\"http://www.linuxuser.co.uk\"/>linux\
