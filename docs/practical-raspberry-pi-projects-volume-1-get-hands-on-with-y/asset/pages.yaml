- pgno: 93
  md: "# Remotely control your Raspberry Pi\n\nUse a web interface to control your\
    \ Pi and employ it as a fileserver or media centre from a remote location using\
    \ any web-connected device\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_93_0.png)\n\
    \n+   Commands Create custom commands for running your Raspberry Pi\n\n+   Other\
    \ utilities Seeing through your webcam and setting an alarm are just two additional\
    \ things you can do with your Pi\n\n+   Main window Get the full details of the\
    \ currently running system from the web\n\n+   **What you'll need**\n+   - Raspbian\
    \ set to command line\n+   - RaspCTL.\n+   - Internet connection\n\nNot everyone\
    \ uses the Raspberry Pi while it's hooked up to a monitor like a normal PC. Due\
    \ to its size and excellent portability, it can be located almost anywhere that\
    \ it can be powered and it's widely used as a file server, media centre and for\
    \ other nontraditional applications as well. Some of these uses won't easily allow\
    \ access to a monitor for easy updates and maintenance. While you can always SSH\
    \ in, it's a bit slower than a full web interface that allows for custom commands\
    \ and a view of the Pi's performance. We're using software called RaspCTL, which\
    \ is still in development, but works just fine for now.\n\n+   **01 Update your\
    \ Pi!**\n+   \n+   To make sure the Raspberry Pi works as best it can, you'll\
    \ need to update Raspbian. Do this with a `sudo apt-get update && apt-get upgrade`,\
    \ followed by a firmware update with `sudo rpi-update`. Finally, if you're booting\
    \ to LXDE, enter `raspi-config` and change it to boot to command line to save\
    \ power.\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_93_1.png)"
