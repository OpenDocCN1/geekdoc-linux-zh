- pgno: 98
  md: "# CODE A SIMPLE SYNTHESISER\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_98_0.png)\n\
    \n# Cython\n\nCython is a tool that compiles Python down to the C code that would\
    \ be used by the interpreter to run the code. This has the advantage that you\
    \ can optimise some parts of your Python code into pure C code, which is significantly\
    \ faster. This is achieved by giving C types, such as int, float and char, to\
    \ Python variables. Once you have a C code - it can then be compiled with a C\
    \ compiler (usually GCC), which can optimise the code even further. A downside\
    \ to using Cython is that you can't run Cython-optimised code with a normal Python\
    \ interpreter. Cython is a nice compromise because you get a similar simplicity\
    \ to Python code but higher performance than usual. Cython has a profiler which\
    \ you can run using:\n\n```\ncython +a synth.pyx\n```\n\nThe profiler outputs\
    \ a html file which shows where any optimisations can be made, giving you an insight\
    \ into just how much overhead using Python introduces. For more details you can\
    \ go to http://cython.org.\n\nThat reason, we are using a USB sound card and will\
    \ disable the built-in card so that the default card is the USB one.\n\n```\n\
    sudo rm /etc/modprobe.d/alsa*\\nsudo editor /etc/modules\n```\n\nChange \"snd-bcm2835\"\
    \ to \"#snd-bcm2835\" and save, then:\n\n```\nsudo reboot\n```\n\n# 03 Test sound\
    \ card\n\nNow we can test the USB sound card. Type alsa mixer and then ensure\
    \ that the volume is set to a comfortable level. If you're plugging speakers in,\
    \ you'll probably want it set to 100%. Then type speaker-test, which will generate\
    \ some pink noise on the speakers. Press Ctrl+Ctrl+O to exit once you are happy\
    \ that it's working.\n\n# 04 Start project\n\nStart by creating a directory for\
    \ the project. Then download one cycle of a square wave that we will use as a\
    \ wave table, like so:\n\n```\nmkdir synth\\ncd synth\\nwget lia.mfraser.co.uk/Lud/synth/square.wav\n\
    ```\n\n# 05 Create compilation script\n\nWe need a script that will profile our\
    \ Cython code (resulting in synth.html). Generate a Cython code for it and finally\
    \ compile the Cython code to a binary with GCC.\n\n```\neditor compile.sh\\n#!/bin/bash\\\
    ncython -a synth.pyx\\ncython --embed synth.pyx\\ngcc -march=armv7-a -mfpv-neon-vfpv4\
    \ -mfloat-abi=hard -O3 -I /usr/include/python2.7 -o synth. bin synth_c -Ipython2.7\
    \ -Ipthread\n```\n\n(Notice the options that tell the compiler to use the floating\
    \ point unit.) Make it executable with:\n\n```\nchmod +x compile.sh\n```\n\n#\
    \ Full code listing\n\n```\n#!/usr/bin/python2\nimport pyaudio\nimport time\n\
    from array import *\nfrom cython cimport array as c_array\nimport wave\nimport\
    \ threading\nimport tty, termios, sys\n```\n\n# Step 07\n\n```\nclass MIDITable:\n\
    \    # Generation code from\n    # http://www.adambuckley.net/software/beep.c\n\
    \n    def __init__(self):\n        self.notes = []\n        self.fill_notes()\n\
    \n    def fill_notes(self):\n        # Frequency of MIDI note 0 in Hz\n      \
    \  frequency = 8.175799\n\n        # Ratio: 2 to the power 1/12\n        ratio\
    \ = 1.0594631\n\n        for i in range(0, 128):\n            self.notes.append(frequency\
    \ * ratio)\n            frequency = frequency * ratio\n\n    def get_note(self,\
    \ n):\n        return self.notes[n]\n```\n\n# Step 08\n\n```\ncdef class ADSR:\n\
    \    cdef float attack, decay, sustain_amplitude\n    cdef float release, multiplier\n\
    \    cdef public char state\n    cdef int samples_per_ms, samples_gone\n\n   \
