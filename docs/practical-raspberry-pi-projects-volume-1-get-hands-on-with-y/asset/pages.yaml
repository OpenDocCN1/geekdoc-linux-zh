    ![](img/a1548a579bd09ff29b2b92de3f565e63_34_1.png)


    **15 Adding extra software**

    We’re not quite done getting our Raspberry Pi desktop ready just yet. We need
    to add some extra software to make it feel more like a real desktop. While we
    already have a browser installed and some of the basics, the first other piece
    of software we should add is an office suite.


    **16 Work with LibreOffice**

    LibreOffice is not installed by default, but as the premier open source office
    suite, or Linux office suite in general, it is readily available on Raspbian,
    which is useful. Open up the terminal and install it with the following:


    ```

    ```

    $ sudo apt-get install libreoffice

    ```

    ```


    **17 GIMP for photos**

    This is the big one – while the original Pi was not quite able to handle LibreOffice,
    it was useless trying to use GIMP. Now GIMP works just fine, although more complex
    tasks might make it slow down just a touch. Install it with:


    ```

    ```

    $ sudo apt-get install gimp

    ```

    ```


    LibreOffice is not installed by default, but as the premier open source office
    suite, or Linux office suite in general, it is readily available to use on Raspbian,
    which is useful


    ![](img/a1548a579bd09ff29b2b92de3f565e63_34_2.png)


    > Above With the Pi 2, you can run a full office suite without running into any
    awkward slowdown


    **18 XX for music**

    If you need to listen to music while you work, one of the best pieces of software
    to check out is XX. It’s available on the Pi Store. It’s a free download and you
    can find the Pi Store in the Pi menus to install it.


    **19 Pi for desktop**

    Now we are set up you can start properly using your Raspberry Pi as a desktop
    system, while still making use of the educational capabilities when need be. The
    software repository and Pi Store should contain any other software that you would
    want or need to make the most of your new Pi system.


