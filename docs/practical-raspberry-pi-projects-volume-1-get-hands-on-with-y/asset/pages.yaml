  md: '# **SOFTWARE**


    **Voice control**

    In this and further issues, we will look at the parts needed to make your own
    voice control software for your projects. If you want a virtual assistant, one
    project is the Jasper system (jasperproject.github.io). The documentation on the
    main website has a description of hardware to attach to your Raspberry Pi and
    a full set of instructions for installation and configuration. There is a set
    of standard modules included to allow interaction with various services. Use the
    time, Gmail or even the joke module, and there are also third-party modules for
    you to access. There is even a developer API and documentation to help you add
    your own functionality to Jasper.


    # # Create your own digital assistant, part 1


    Everyone would like to tell their computers exactly what to do. Well with Python
    and a Raspberry Pi, now you can


    Everyone who has watched the *Iron Man* movies has probably dreamt of having their
    own artificially intelligent computer system to do their every bid and call. While
    *Jarvis* has massive amounts of computing power behind him, you can construct
    the front-end with very modest resources. With a Raspberry Pi and the Python programming
    language, you can build your own personal digital assistant that can be used as
    a front-end to whatever massive supercomputing resources that you use in your
    day-to-day life as a playboy, philanthropist genius. We will go over the basics
    that you will need to know over the next few pages, so that by the end of the
    series you should be able to build your own rudimentary, customised agent.


    The first step to interacting with the humans around us is to listen for verbal
    commands so that we know what we need to process. You have several options available
    to handle this task. To keep things simple, we will be dealing only with devices
    that are plugged into one of the USB ports. With that stipulation you can talk
    directly with the USB device at the lowest level. This might be necessary if you
    are trying to use something that is rather unusual to do the listening, but you
    will probably be better off using something that is a bit more common. In this
    case you can use the Python module PyAudio. PyAudio provides a Python wrapper
    around the low level cross-platform library PortAudio. Assuming that you are using
    something like Raspbian for your distribution, you can easily install the required
    software with the command:


    ```

    sudo apt-get install1 python-pyaudio

    ```


    If you need the latest version you can always grab and build it from source. PyAudio
    provides functionality to both read in audio data from a microphone, along with
    the ability to play audio data out to headphones or speakers. So we will use it
    as our main form of interaction with the computer.


    The first step is to be able to read in some audio commands from the humans who
    happen to be nearby. You will need to import the ''pyaudio'' module


    ![](img/a1548a579bd09ff29b2b92de3f565e63_75_0.png)


    ![](img/a1548a579bd09ff29b2b92de3f565e63_75_1.png)


    before you can start interacting with the microphone. The way PyAudio works is
    similar to working with files, so it should seem familiar to most programmers.
    You start by creating a new PyAudio object with the statement *p = pyaudio.PyAudio()*.
    You can then open an input stream with the function *p.open(...)*, with several
    parameters. You can set the data format for the recording; in the example code
    we used *format=pyaudio.paInt16*. You can set the rate in Herz for sampling. For
    example, we are using *rate=44100*, which is the standard 44.1KHz sampling rate.
    You also need to say how big a buffer to use for the recording – we used *frames_per_buffer=1024*.
    Since we want to record, you will need to use *input=True*. The last parameter
    is to select the number of channels to record on, in this case we will use *channels=2*.
    Now that the stream has been opened, you can start to read from it. You will need
    to read the audio data in using the same chunk size that you used when you created
    the stream – it will look like *stream.read(1024)*. You can then simply loop and
    read until you are done. There are then two commands to shutdown the input stream.
    You need to call *stream.stop_stream()* and then *stream.close()*. If you are
    completely done, you can now call *p.terminate()* to shutdown the connection to
    the audio devices on your Raspberry Pi.


    The next step is to be able to send audio output so that Jarvis can talk to you
    as well. For this you can use PyAudio, so we won''t have to look at another Python
    module. To make things simple, let''s say that you have a WAVE file that you want
    to play. You can use the ''wave'' Python module to load it. Once again, you will
    create a PyAudio object and open a stream. The parameter ''output'' should be
    set to *true*. The format, the number of channels and the rate is all information
    that will be derived from the audio data stored in your WAVE file. To actually
    hear'
  merge: -1
