    \ to the recording data if we are recording. It will become abundantly clear how\
    \ this works once we've written the sampler class. Note that the GPIO event handler\
    \ passes the pin that the event handler was triggered on, hence the channel variable\
    \ that is present but never used.\n\n# 06 The sampler init method\n\nHere's the\
    \ start of the sampler class. The last value in the Pygame mixer init is the buffer\
    \ size. You might need to increase this to `1024` or higher if you have audio\
    \ dropouts. We create some variables to store recording data. Metronome sounds\
    \ are then added and their volume lowered. We also create a list to hold our samples\
    \ in.\n\nWe create nested arrays to represent recorded sample presses. There is\
    \ an array for each bar. Each bar has an array for each possible quantize value.\
    \ The default value of 64 gives us 64 possible places to store a sample hit per\
    \ bar.\n\nFinally, we set up the LED pins, and the pins for the record and undo\
    \ buttons.\n\n# 07 The tempo property\n\nThe tempo variable is actually a property\
    \ with a custom setter. This means when a value is assigned, it does a custom\
    \ action. In our case, we need to calculate how often we need to check for recorded\
    \ notes to play in the main loop that we'll write later.\n\n# 08 Helper functions\n\
    \nThere are a few helper functions in the class. One of them simply adds a sample\
    \ to the list of samples. Another sets a variable to trigger recording at the\
    \ start of the next loop. There is also a function which turns the red LED on\
    \ when the recording variable is set to true. Now we'll jump forward and take\
    \ care of the main loop towards the end of the full code listing.\n\n# 09 Start\
    \ the main loop\n\nThe main loop doesn't actually have to do any work at all to\
    \ play sounds, as that's done by the GPIO event handlers. The main loop is used\
    \ to play the metronome, update the state about which bar/beat/quantize we are\
    \ currently on, update the LEDs and deal with recording if necessary.\n\nBefore\
    \ the loop, we create variables to track the state. The last recorded loop is\
    \ a list that we will use as a stack. A stack is a last in/first out data structure,\
    \ allowing us to undo recordings multiple times by removing each sample that was\
    \ recorded when the loop count was the value on the top of the stack.\n\nIf we're\
    \ at the start of a new beat then we use a function called `do_leds` that we haven't\
    \ created yet. As the LEDs work in the same way (a block of four LEDs where only\
    \ one is turned on), we can use the same function twice and just pass a different\
    \ set of pins, and the index of the LED we want to turn on. We then call the `do_metronome`\
    \ function which will play the appropriate metronome sound.\n\nWe then do some\
    \ recording logic which starts recording if we should be recording, and stops\
    \ recording if we have just been recording, adding the"
