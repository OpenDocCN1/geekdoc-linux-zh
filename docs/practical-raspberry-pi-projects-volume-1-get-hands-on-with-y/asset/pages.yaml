    With stability assured, some level of take-off, hover and landing can be achieved
    using the vertical speed PID. Placing the quadcopter on a horizontal surface,
    set the target to 0.5 m/s and off she zooms into the air, while the stability
    PIDs ensures that the horizontal attitude on take-off is maintained throughout
    the short flight, hover and landing.


    Up to this stage, the PIDs are independent. But what about for horizontal movement
    target, and suppression of drifting in the wind?


    Taking the drift suppression first, a quadcopter in a headwind will drift backwards
    due to the force applied by the wind. To compensate, it must tilt nose down at
    some angle so that some of the propellers'' thrust is applied horizontally to
    counteract the wind. In doing so, some of the power keeping the ''copter hovering
    at a fixed height is now battling the wind: unless the overall power is increased,
    the ''copter will start descending.


    Horizontal movement is more complex still. The target is to move forwards at say
    1 metre per second. Initially the requirement is similar to the headwind compensation
    – nose down plus increased power will apply a forward force leading to forward
    acceleration. But once that horizontal speed is attained, the quadcopter needs
    to level off to stop the acceleration, but at the same time, friction in the air
    will slow the movement. So there''s a dynamic tilting for/ aft to maintain this
    stable forward velocity.


    Both wind-drift suppression and controlled horizontal movement use nested PIDs;
    the X and Y axes horizontal speed PIDs'' outputs are used as the pitch and roll
    angle PIDs targets; their output feeds the pitch and roll rate PIDs to ensure
    stability while meeting those angular targets. The sensor feedback ensures that
    as the desired horizontal speed is approached, the horizontal speed PID errors
    shrink, reducing the targets for the angular pitch PID, thus bringing the quadcopters
    nose back up to horizontal again.


    Hopefully it now becomes clearer why accurate angle tracking is critical: in the
    nose-down, headwind example, the'
