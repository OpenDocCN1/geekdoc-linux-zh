- pgno: 33
  md: '![](img/a1548a579bd09ff29b2b92de3f565e63_33_0.png)


    # # HARDWARE


    # 09 Accessorise your Pi


    Just setting up the operating system on the Raspberry Pi is only a small part
    of the process – we also have to consider the hardware surrounding it that will
    actually make it usable as a desktop replacement.


    ![](img/a1548a579bd09ff29b2b92de3f565e63_33_1.png)


    # 10 Human input devices


    Standard USB keyboards and mice are best suited for this task, much more so than
    a lot of the wireless keyboard and mouse combos that are popular among Pi users.
    However, don''t try and save on USB ports by getting a keyboard with USB connections
    of its own: the Pi cannot power USB hubs, even just two on a keyboard.


    # 11 Monitor to see


    The Pi can output a maximum of 1080p, which in normal display terms is 1920 x
    1080. While it only outputs in HDMI, a lot of modern monitors do have an HDMI
    input. If you don''t want to get a brand new monitor though, you can always get
    a HDMI to DVI or HDMI to VGA adapter.


    ![](img/a1548a579bd09ff29b2b92de3f565e63_33_2.png)


    > Below you can run a pretty decent Minecraft server for a handful of your friends
    with the Pi 2


    ![](img/a1548a579bd09ff29b2b92de3f565e63_33_3.png)


    # 12 Case for protection


    The Pi is pretty sturdy and we''d be lying if we said we didn''t regularly keep
    ours out of a case, however, it''s not indestructible. While we''re doing a lot
    of different projects involving accessing different components, a desktop Pi doesn''t
    require this level of access. We like the Pimoroni PiBox cases, but there are
    several other secure, protective alternatives.


    ![](img/a1548a579bd09ff29b2b92de3f565e63_33_4.png)


    # 13 Wireless for Internet


    While some people are fine using wired connections, not everyone has that luxury.
    Wireless dongles are a perfect fit for the Pi, especially now they''re almost
    no larger than the USB port themselves. However, not just any dongle will work
    and you''ll have to check against this list to make sure that you get a compatible
    one: [http://elinux.org/RPI\_USB\_WI-FI\_Adapters](http://elinux.org/RPI\_USB\_WI-FI\_Adapters).


    ![](img/a1548a579bd09ff29b2b92de3f565e63_33_5.png)


    # 14 Anything else?


    Our standard desktop PC setup is complete, with one USB port to spare. You can
    use that single port for USB sticks or portable storage, or you can invest in
    a powered USB hub to give yourself more connectivity options. Otherwise, investing
    in a good, 2A power supply will make sure you''re never short on power for anything.'
  merge: -1
  img_proc: true
