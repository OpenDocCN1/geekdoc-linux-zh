    # What you''ll need


    +   - Raspberry Pi 2

    +   - USB sound card (we used a Behringer UCA202)


    # # Code a simple synthesiser


    Learn how to write a simple polyphonic synthesiser (and the theory behind it)
    using Python and Cython


    We are going to take you through the basics of waveable synthesis theory and use
    that knowledge to create a real-time synthesiser in **Python**. At the moment,
    it is controlled by the computer keyboard, but it could easily be adapted to accept
    a MIDI keyboard as input.


    The Python implementation of such a synthesiser turns out to be too slow for polyphonic
    sound (ie playing multiple notes at the same time) so we''ll use Cython, which
    compiles Python to C so that you can then compile it to native machine code to
    improve the performance. The end result is polyphony of three notes, so this is
    not intended for use as a serious synthesiser. Instead, this tutorial will enable
    you to become familiar with synthesis concepts in a comfortable language: **Python**.


    Once you''re finished, try taking this project further by customising the mapping
    to better fit your keyboard layout, or tweaking the code to read input from a
    MIDI keyboard.


    # 01 Install packages


    Using the latest Raspbian image, install the required packages with the following
    commands:


    ```

    ```bash

    sudo apt-get update

    sudo apt-get upgrade

    sudo apt-get install python-pip python2.7-dev portaudio19-dev

    sudo pip install cython pyaudio

    ```

    ```


    The final step compiles Cython and PyAudio from source, so you might want to go
    and do something else while it works its magic.


    # 02 Disable built-in sound card


    We had issues getting the Raspberry Pi''s built-in sound card to work reliably
