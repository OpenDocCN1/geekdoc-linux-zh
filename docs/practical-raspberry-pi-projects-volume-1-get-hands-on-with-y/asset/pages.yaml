  md: "# MAKE A RASPBERRY PI SAMPLER\n\n# 02 Wire up buttons\n\nThe second circuit\
    \ we need is a push button. The purple wire goes to a GPIO input. There is a 10KΩ\
    \ pull down resistor to ground, which represents a logical 0. When the push button\
    \ is pressed, the 3.3V supply representing a logical 1 is connected to the purple\
    \ wire. The electricity takes this path because it has less resistance than the\
    \ path to ground. We need two buttons for record and undo, and then as many buttons\
    \ as you like for samples (three drum samples are provided).\n\n# 03 Download\
    \ samples\n\nCreate a few folder for the project called pismsampler. Then download\
    \ and unzip the sounds:\n\n```\n```bash\nmkdir pismsampler\ncd pismsampler\nwget\
    \ http://liamfraser.co.uk/Lud/\\npismsampler/sounds.zip\nunzip sounds.zip\n```\n\
    ```\n\nThere will now be a folder called sounds with some samples in. The file\
    \ format for samples is .wav audio, Mono/PCM, 16 bit, stereo, 44100 Hz. Mono will\
    \ work too. Any samples can be converted to this format with Audacity by exporting\
    \ them as a .wav file.\n\n# 04 Import required libraries\n\nCreate a file called\
    \ pismsampler.py in your favourite editor. The first thing we need to do is import\
    \ the required libraries and set some configuration values. A key option is debounce;\
    \ the time to wait before a button can be pressed again to stop accidental presses\
    \ from contact bounce.\n\n# 05 Create a sample class\n\nWe're going to use a class\
    \ to represent each sample. It's going to need a few things: the pin that the\
    \ sample button is connected to, the name of the sound file, and a reference to\
    \ the instance of the sampler class. We haven't created the sampler class yet,\
    \ but the sample will need to be able to tell if the sampler is recording or not,\
    \ and have access to the data structure that recordings are stored in to add itself\
    \ to if necessary.\n\nThe other thing that we need to do is set the GPIO pin to\
    \ an input, and add an event listener for when the button is pressed. We set callback\
    \ (the function to be executed when the button is pressed) to a function called\
    \ self.play_btn, which will play a sound\n\n# Full code listing (Cont. on next\
    \ page)\n\n```\n```python\nimport RPi.GPIO as GPIO\nimport time\nimport pygame\n\
    import os\n\nbeat_leds = [2, 3, 4, 17]\nbar_leds = [27, 22, 18, 9]\nrecord_led\
    \ = 11\nrecord = 19\nundo = 26\ndebounce = 200 # ms\n```\n```\n\n```\n```python\n\
    class Sample(object):\n    def __init__(self, pin, sound, sampler):\n        self.sampler\
    \ = sampler\n        self.name = sound\n        self.sound = pygame.mixer.Sound(os.path.join('sounds',\
    \ sound))\n        self.pin = pin\n        GPIO.setup(pin, GPIO.IN)\n        GPIO.add_event_detect(self.pin,\
    \ GPIO.RISING, callback=self.play_btn, bouncetime=debounce)\n\n    def play_btn(self,\
    \ channel):\n        self.sound.play()\n        s = self.sampler\n        if s.recording:\n\
    \            s.recording.data[s.bar_n][s.quantize_n].append(('loop' : s.loop_count,\
    \ 'sample' : self))\n```\n```\n\n```\n```python\nclass PiSampler(object):\n  \
    \  def __init__(self, tempo=80, quantize=16):\n        pygame.mixer.pre_init(44100,\
    \ -16, 1, 512)\n        pygame.init()\n        \n        self.quantize = quantize\n\
    \        self.tempo = tempo\n        self.recording = False\n        self.record_next\
    \ = False\n        \n        self.metroone = False\n        self.met_low = pygame.mixer.Sound(os.path.join('sounds',\
    \ 'met_low.wav'))\n        self.met_high = pygame.mixer.Sound(os.path.join('sounds',\
    \ 'met_high.wav'))\n        self.met_low.set_volume(0.4)\n        self.met_high.set_volume(0.4)\n\
    \        \n        self.samples = []\n        \n        self.recording_data =\
    \ []\n        for i in range(4):\n            bar_arr = []\n            for j\
    \ in range(4, quantize):\n                bar_arr.append([])\n            self.recording_data.append(bar_arr)\n\
    ```\n```\n\n```\n```python\nGPIO.setmode(GPIO.BCM)\nfor pin in beat_leds + bar_leds\
    \ + [record_led]:\n    GPIO.setup(pin, GPIO.OUT)\n\nGPIO.setup(record, GPIO.IN)\n\
    GPIO.add_event_detect(record, GPIO.RISING, callback=self.record_next_loop, bouncetime=debounce)\n\
    ```\n```\n\n117"
