    # # Program a Raspberry Pi quadcopter


    How do you beat a Raspberry Pi robot? You give it wings. Andy Baker shows us how
    to code our way into the clouds


    The Raspberry Pi is a fantastic project board. Since we love a challenge, we set
    out looking for something to really take advantage of its capabilities in the
    most spectacular way possible, something that would really push the limits of
    our hacking and coding skills. We chose a quadcopter.


    Kits are available as ready-to-fly (RTF) if you just want the joy of flight, but
    where''s the challenge in that? We started with an almost-ready-to-fly (ARF) kit
    - the DJI Flame Wheel F450 - all the hardware, but none of the control electronics
    or software. Many enthusiasts have created DIY quadcopters using Arduino microcontrollers,
    so we


    knew a DIY build was possible, but very few, if any, have successfully used the
    Raspberry Pi.


    This article uses the Python code on the disc as a guide through what''s needed
    to build a quadcopter, metaphorically bolting it together so that by the end,
    you don''t just understand the code but also the interaction with the real-world
    to enable you to build your own quadcopter with confidence.


    As you read the article, you can follow the corresponding code by searching for
    an equivalent tag comment; for example, to find the code related for the ''# Angles''
    section of the article, simply search the code for ''# Angles''.'
