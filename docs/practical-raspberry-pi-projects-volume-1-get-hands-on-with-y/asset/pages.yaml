  md: "# BUILD A RASPBERRY PI MINECRAFT CONSOLE\n\n# Full code listing\n\n+   * Import\n\
    +   \n+   Here we're importing the necessary modules and APIs to program Minecraft.\
    \ Most importantly are the files in the mcpi folder that we copied earlier\n\n\
    ```\n```python\nfrom mcpi.minecraft import Minecraft\nfrom mcpi import block\n\
    from mcpi.vec3 import Vec3\nfrom time import sleep, time\nimport random, math\n\
    ```\n```\n\n+   * Locate\n+   \n+   We connect to Minecraft with the first line,\
    \ and then we find the player's position and round it up to an integer\n\n```\n\
    ```python\nmc = Minecraft.create()\nplayerPos = mc.player.getPos()\n\ndef roundVec3(vec3):\n\
    \    return Vec3(int(vec3.x), int(vec3.y), int(vec3.z))\n```\n```\n\n+   * Range\
    \ finding\n+   \n+   Calculate the distance between the player and diamond. This\
    \ is done in intervals later on in the code, and just compares the co-ordinates\
    \ of the positions together\n\n```\n```python\ndef distanceBetweenPoints(point1,\
    \ point2):\n    xd = point2.x - point1.x\n    yd = point2.y - point1.y\n    zd\
    \ = point2.z - point1.z\n    return math.sqrt((xd*xd) + (yd*yd) + (zd*zd))\n```\n\
    ```\n\n+   * Creation\n+   \n+   Create a random position for the diamond within\
    \ 50 blocks of the player position that was found earlier\n\n```\n```python\n\
    def randomBlock():\n    randomBlockPos = roundVec3(playerPos)\n    randomBlockPos.x\
    \ = random.randrange(randomBlockPos.x - 50, randomBlockPos.x + 50)\n    randomBlockPos.y\
    \ = random.randrange(randomBlockPos.y - 5, randomBlockPos.y + 5)\n    randomBlockPos.z\
    \ = random.randrange(randomBlockPos.z - 50, randomBlockPos.z + 50)\n    return\
    \ randomBlockPos\n```\n```\n\n+   * Start\n+   \n+   This is the main loop that\
    \ actually starts the game. It asks to get the position of the player to start\
    \ each loop\n\n```\n```python\ndef main():\n    global lastPlayerPos, playerPos\n\
    \    seeking = True\n    lastPlayerPos = playerPos\n\n    randomBlock = random_block()\n\
    \    mc.setBlock(randomBlockPos, block.DIAMOND_BLOCK)\n    mc.postToChat(\"A diamond\
    \ has been hidden - go find!\")\n```\n```\n\n+   * Checking\n+   \n+   We start\
    \ timing the player with timeStarted, and set the last distance between the player\
    \ and the block. Now we begin the massive while loop that checks the distance\
    \ between the changing player position and the fixed diamond. If the player is\
    \ within two blocks of the diamond, it means they have found the block and it\
    \ ends the loop\n\n```\n```python\n    lastDistanceFromBlock = distanceBetweenPoints(randomBlockPos,\
    \ lastPlayerPos)\n    timeStarted = time()\n    while seeking:\n        playerPos\
    \ = mc.player.getPos()\n        if lastPlayerPos != playerPos:\n            distanceFromBlock\
    \ = distanceBetweenPoints(randomBlockPos, playerPos)\n            if distanceFromBlock\
    \ < 2:\n                seeking = False\n        else:\n            if distanceFromBlock\
    \ < lastDistanceFromBlock:\n                mc.postToChat(\"Warmer  \" + str(int(distanceFromBlock))\
    \ + \" blocks away\")\n            if distanceFromBlock > lastDistanceFromBlock:\n\
    \                mc.postToChat(\"Colder  \" + str(int(distanceFromBlock)) + \"\
    \ blocks away\")\n            \n        lastDistanceFromBlock = distanceFromBlock\n\
    \        sleep(2)\n```\n```\n\n+   * Message writing\n+   \n+   If you are two\
    \ or more blocks away from the diamond, it will tell you whether you're nearer\
    \ or farther away than your last position check. It does this by comparing the\
    \ last and new position distance - it's the same, a quirk in Python means it says\
    \ you're colder. Once it's done this, it saves your current position as the last\
    \ position\n\n+   * Success\n+   \n+   It takes a two-second break before updating\
    \ the next position using the sleep function. If the loop has been broken, it\
    \ tallies up your time and lets you know how long it was before you found the\
    \ diamond. Finally, the last bit then tells Python to start the script at the\
    \ main function\n\n```\n```python\n    timeTaken = time() - timeStarted\n    mc.postToChat(\"\
    Well done - \" + str(int(timeTaken)) + \" seconds to find the diamond!\")\n\n\
    if __name__ == \"__main__\":\n    main()\n```\n```"
