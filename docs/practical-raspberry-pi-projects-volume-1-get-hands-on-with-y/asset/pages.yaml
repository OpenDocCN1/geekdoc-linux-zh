  md: "# SUPERCHARGE YOUR RASPBERRY PI\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_72_0.png)\n\
    \n# **02** Choosing the best SD card\n\nVarious standards of SD card are available,\
    \ with the more expensive designed for better error correction. For the best performance\
    \ on your Raspberry Pi, choose an SDHC card with a high rating. The same advice\
    \ applies to MicroSD cards, which you can use on your Raspberry Pi with an SD\
    \ card adaptor or directly insert into a Raspberry Pi B+.\n\n# **05** Write data\
    \ to RAM\n\nRather than reading and writing data to your SD card – something that\
    \ will eventually result in a deterioration of reliability and performance – you\
    \ can configure Raspbian to write to the system RAM, which will speed things up\
    \ slightly and improve SD card performance.\n\nThis is achieved using fstab (file\
    \ systems table), a system configuration available in most Linux distros.\n\n\
    Above: There's a great guide to SD cards at elinux.org/ RPI_SD_cards\n\n```\n\
    ```bash\nPi@raspberrypi ~ $ sudo nano /etc/fstab\nnano raspberrypi /etc/fstab\
    \ [NOESAVE] New file: /etc/fstab [0/0]\n\n# /etc/fstab: static file system information.\n\
    #\n# \t<file system> \t<mount point> \t<type> \t<options> \t<dump> \t<pass>\n\
    LABEL=rwfs \t/ \text4 \trw,noatime \t0 \t1\n# /boot\n/dev/mmcblk0p1 \t/boot \t\
    vfat \trw \t0 \t2\n\n# tmpfs\n#tmpfs \t/var/log \ttmpfs \tdefaults,mode=0664,mode=0755,size=100m\
    \ \t0 \t0\n\n# tmpfs\n#tmpfs \t/var/log \ttmpfs \tdefaults,mode=0664,mode=0755,size=100m\
    \ \t0 \t0\n\n#RAMDisk (in case we want to write to memory instead of SD card)\n\
    tmpfs \t/ramfs \ttmpfs \trw,size=256m \t0 \t0\n```\n```\n\n# **03** Make the most\
    \ of your storage\n\nYou'll typically need 1-2GB of storage for your chosen Raspberry\
    \ Pi distro, so any remaining storage on your SD card will be used for updates\
    \ and data you create or save.\n\nIn Raspbian you can open a command line and\
    \ run the configuration utility to gain more space (only if your SD card's greater\
    \ than 2GB):\n\n```\nsudo raspi-config\n```\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_72_1.png)\n\
    \n# **04** Expand the Raspbian partition\n\nMaximising the partition affords the\
    \ full capacity of your SD card, which will increase the medias lifespan (there\
    \ is more space to write to, not the same sectors aren't being overwritten as\
    \ often).\n\nWith raspi-config running, use the arrow keys to select expand rootfs\
    \ in the menu. Then wait briefly while the partition is resized.\n\n# **06** Enable\
    \ fstab in Raspbian\n\nThis is much like creating a RAM disk in Windows and is\
    \ almost as easy to setup. In the command line, enter:\n\n```\nsudo nano /etc/fstab\n\
    ```\n\nAdd the following line to mount a virtual file system:\n\n```\ntmpfs /var/log\
    \ tmpfs defaults,noatime,nosuid,mode=0755,size=100m 0 0\n```\n\nFollow this by\
    \ saving and exiting nano (Ctrl+X), then safely restarting the Pi:\n\n```\nsudo\
    \ shutdown -r now\n```\n\n# Buy rated SD cards\n\nIt's all too tempting to boot\
    \ up your Raspberry Pi with an image copied to an SD card that you just pulled\
    \ out of your DSLR or phone. After all, they're all the same, right? The chance\
    \ are that your chosen SD card was one that you had lying about when you bought\
    \ your Raspberry Pi. It might be good enough but if you want the best performance,\
    \ a high- rated SDHC card with plenty of space is recommended. Such media is inexpensive\
    \ and can be bought online or in supermarkets. Just make sure you're buying a\
    \ known brand!"
