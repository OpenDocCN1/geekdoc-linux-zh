    Code your own

    Twitter bot


    From our time covering this incredible credit card-sized computer, it''s become
    clear there are two types of Raspberry Pi owners: those that use theirs and those
    that don''t. Whether it''s fear of the unknown, a lack of time or inspiration,
    when we ask people what they do with their Pi we''ll often hear that it''s still
    in the box. If that''s you, then Raspberry Pi projects practically anyone can
    enjoy.

    These aren''t just a random selection of side-hustles, though. These are practical
    ideas designed to help kick-start, bigger and better things. Knowledge gained
    from one project can also be applied to another to create something completely
    new. For example, you could combine our Twitter and colour-cool lamp tutorials
    to create a desk lamp that changes colour as your Twitter account is retweeted.
    You could go on to make Pong in Minecraft-Pi or use a button attached to Scratch
    to take photos with your Raspberry Pi camera module. The list goes on.

    All these projects are open source, so you''re encouraged to tweak and develop
    them into something entirely new. If you share your tweaks and changes with the
    community, you''re sure to start benefitting from doing things the open source
    way...'
