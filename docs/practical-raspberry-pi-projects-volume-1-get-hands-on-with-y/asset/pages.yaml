- pgno: 149
  md: '# # 20 RASPBERRY PI HACKING PROJECTS


    # # Camera Pi


    Power up a regular point-and-shoot DSLR camera


    ![](img/a1548a579bd09ff29b2b92de3f565e63_149_0.png)


    **Maker Profile**


    **Dave Hunt**


    Photographer and maker


    Dave has been making projects for the Raspberry Pi since the early days.


    **Find out more:** [davehid.co.ie](http://davehid.co.ie)


    Dave Hunt is well known to Raspberry Pi fans, and here he’s back with his Camera
    Pi.


    “I needed to transmit photos to an iPad as they were taken,” explains Dave, “but
    the commercial solutions were £500. I had a broken battery grip big enough to
    fit my Raspberry Pi and a battery, so it went from there.


    The battery grip holds two batteries. Once I’d stripped out the battery compartment,
    I set about filing down all the mounting holes inside the grip so I could get
    the Raspberry Pi inside.


    “The next task was to fit a camera battery and DC-DC converter inside. I was able
    to use part of the removed internals of the grip, and before long I had a slot
    to insert a camera battery into. It’s capable of powering the Pi for about four
    hours.


    “Making it wireless was a case of plugging in a USB Wi-Fi adaptor. A few lines
    of Perl, Python and I was able to poll the camera with gphoto2, pull the new files
    off and send them via FTP to Shutter Snitch on my iPad.”


    **Above**


    Read up on the full build process and check out Dave’s video at bit.ly/1ybXEmbC


    # # Pi Telephone


    Revive a ringing phone with C# circuit wizardry and voltage manipulation


    ![](img/a1548a579bd09ff29b2b92de3f565e63_149_1.png)


    **Maker Profile**


    **Stuart Johnson**


    Managing director


    Stuart runs Logic Ethos, an IT company in Southampton providing network services
    and cloud computing help to developers.


    **Find out more:** [logicethos.com](http://logicethos.com)


    Stuart Johnson is bringing a classic GPO 746 handset back to life, and while the
    project isn’t yet complete, he has finished the lion’s share of it.


    “I took out the main circuit board inside the phone and squeezed the Raspberry
    Pi in there,” says Stuart.


    I was then faced with two challenges – the biggest one was getting the bell to
    ring. I found a solution by raising the voltage to 19 volts and dropping it down
    to 5 for the Ras Pi using a very small DC-DC converter (the OKI-785R), with the
    rest then being used for the bell. I was surprised by how well it worked.


    The bell is using one of the I/O ports, and there’s an available C# library (raspberrypi-sharp-io)
    which lets you monitor and control those ports. So I linked one of the I/Os to
    the pulse dial and connected another to a relay using transistors. Then with the
    software I put in a timer to measure the pulse clicks. I managed to write some
    code to time those pulse clicks and determine the number dialed.”


    # # Car Computer


    Ours was good, but Derek Knaggs really has built the real deal


    ![](img/a1548a579bd09ff29b2b92de3f565e63_149_2.png)


    **Maker Profile**


    **Derek Knaggs**


    Managing director


    Derek Knaggs runs FlammeLi, an IT supply and support company, and is studying
    Computing at the University of Worcester.


    **Find out more:** [flamemelli.co.uk](http://flamemelli.co.uk)


    Remember the car computer that we made earlier? Well Derek Knaggs already beat
    us to it, and he’s embedded the display in his dashboard and extended the setup
    to include screens for the rear passenger seats too.


    “I removed the DVD player, which was a standard Ford head unit,” explains Derek,
    “and then purchased a head unit from Xtrons. It’s designed for the Ford Focus
    so it was a straight swap. The Xtrons radio has an S-Video input and that goes
    into the radio, so the Raspberry Pi displays as Auxiliary Input. There’s two Auxiliary
    Outputs on the radio, so the Raspberry Pi sends a video to the main radio which
    then sends it back out to the screens in the passenger seats.


    What I have done is put in a device – like a VGA adaptor: it takes one input and
    puts seven out – that gives me the ability to have the Raspberry Pi running on
    the back screens but running on, so the radio can then control itself. I can have
    my kids watching movies on the back with the Raspberry Pi using an audio splitter
    (they’ve got headphones on), and we can be at the front using the normal radio
    controls, like the satnav for example. So that works well.”


    **Above** In this setup, the Pi is one of the inputs for the Xtrons head unit'
