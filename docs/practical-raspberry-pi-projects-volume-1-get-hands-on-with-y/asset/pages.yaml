- pgno: 154
  md: '# 20 RASPBERRY PI HACKING PROJECTS


    # Astrogun


    An augmented reality light gun game


    Walking around Maker Faire, you see some weird and wonderful things. If you''d
    been present at the Jerusalem Maker Faire you may have seen people wield a giant
    toy gun to shoot down virtual asteroids in Aivishay''s AR motion game Astrogun.


    "In the Astrogun lies a Raspberry Pi computer," Aivishay explains. "An IMU card
    connected to it (SparkFun''s MPU-9150 breakout board) gives it the ability to
    sense the unit''s orientation. The Pi is then able to draw the elements seen from
    that angle."


    When the player moves, the graphics move, giving the ''object in the room'' sense."


    Why the Raspberry Pi? It was due to time, according to Aivishay: "I had a short
    time to bring it to a working thing, so I had to pick a platform that was capable
    of the task and easy to use. The RPI fits that criteria. I used many software
    components designed for the RPI or tested on it - the PiSD and RTIMULib. The combination
    of Pi as a hardware platform and Python as a programming language is the fastest
    way to materialise ideas."


    ![](img/a1548a579bd09ff29b2b92de3f565e63_154_0.png)


    Below Clever software gives you a window onto the Astrogun gameworld


    ![](img/a1548a579bd09ff29b2b92de3f565e63_154_1.png)


    # Maker Profile


    **Aivishay Orpaz**


    Electronics engineer


    Find out more:

    bit.ly/1A4YPSsg


    # Pirate TV


    Go all the way and totally rebuild Android TV!


    ![](img/a1548a579bd09ff29b2b92de3f565e63_154_2.png)


    # Maker Profile


    **Donald Derek Haddad**


    Software engineer


    Consid is an open source hacker


    Find out more:

    onald.derek.com


    The perfect companion to the Smart TV hack, Donald Derek Haddad''s project is
    a custom TV interface you can make yourself.


    "''Pirate TV is a smart television application that runs on the Raspberry Pi,
    with the Raspbian OS,'' Donald tells us. "It''s built with open source tools and
    shipped with a free remote controller. Your mobile device. As its core lies a
    Node. JS application that runs a web server with ExpressJS/Socket.IO to handle
    user''s


    requests from the remote and trigger shell scripts. The TV user interface is rendered
    on a Chromium instance in kiosk mode. Videos are streamed from YouTube or other
    channels played on OMXplayer, and cached including 1080p HD content. This project
    is a work in progress and it''s not going to be able to tap into a lot of the
    content, which makes a Google now Android TV or other commercial platforms so
    valuable. "Check out Derek''s tutorial: bit.ly/1ibYKqpJ


    # Pye Radio


    Old meets new in this modified radio


    # Maker Profile


    **Tony Flynn**


    Senior embedded systems design engineer


    Find out more:

    bit.ly/1t9grPL


    Upcycling is a great concept: recycling a product using new technology to make
    it relevant in the modern world. While standard analogue radio isn''t dead yet,
    it''s nice to have options when listening to music. This is where Tony''s idea
    came in: "I''d been working on a Raspberry Pi to play music streams through my
    stereo. Once this was running I integrated the Raspberry Pi into an old radio
    named a Pyel! With a background in woodwork and engineering this seemed like the
    perfect project."


    However, this project wasn''t a walk in the park for Tony: "The hardest part of
    the conversation is linking the tuner knob to the rotary encoder. For this radio
    I used the spring from an old biro as a drive train to link the tuner knob spindle
    to the rotary encoder through 90 degrees."


    Did Tony have qualms about heavily modifying such a classic design? "None whatsoever!
    Some people don''t like the modern style now stamped on this old radio. I think
    it''s a new era, new look!"


    ![](img/a1548a579bd09ff29b2b92de3f565e63_154_3.png)


    Right The body has also been cleaned and repainted'
  merge: -1
  img_proc: true
- pgno: 155
  md: "# Digital Camera Conversion\n\nClassic aesthetics with modern convenience,\
    \ this old-school camera has been upgraded with a Raspberry Pi\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_155_0.png)\n\
    \n+   * **Maker Profile**\n+   * **Pete Taylor**\n+   * Web manager\n+   \n+ \
    \  Pete works for a charity and has always tinkered with computers, ever since\
    \ he got a hand-me-down BBC computer. He likes that the Raspberry Pi returns to\
    \ a time when you could hack your own computer without making an expensive mistake.\n\
    +   \n+   Find out more: bit.ly/1KRASw\n\n> “The Raspberry Pi is a maker’s dream\
    \ – it’s cheap and cheerful, and the community built around it is a brilliant\
    \ resource”\n\n# Do it yourself\n\nVersion two of the project will result in a\
    \ kit that people can use to convert their own cameras “that doesn’t require you\
    \ to take a Dremel to the insides of a Holga”. He’s not decided yet on whether\
    \ to make a kit that converts a Holga, or a kit that builds a Holga-esque case\
    \ around the Raspberry Pi itself. Either way, the whole thing should also have\
    \ a better photo-taking capability, which is the ultimate goal.\n\nOld cameras\
    \ have a very specific design aesthetic that it seems has been lost to time, although\
    \ nostalgia for them is still very strong in certain circles. Unfortunately, while\
    \ nostalgia, desire and working cameras still exist in the 21st Century, usable\
    \ film is quickly dwindling in supply. So if you like the aesthetic and aren’t\
    \ too bothered about using the old photo process, why not upgrade the insides\
    \ with more modern technology?\n\n“I wanted a suitable case for the Raspberry\
    \ Pi camera board”, Pete tells us, “and the Holga seemed a perfect fit. Most of\
    \ the available cases are either a bit ugly or suited more towards stationary\
    \ webcam-type applications.”\n\n“The Raspberry Pi is a maker’s dream – it’s cheap\
    \ and cheerful, and the community that’s built up around the Pi makes a brilliant\
    \ resource when you’re stuck with a problem or want to find out more.”\n\nThe\
    \ entire build doesn’t require a massive amount of components either. As well\
    \ as the actual camera and Pi itself, Pete used a Raspberry Pi camera board to\
    \ actually take photos, a Wi-Fi module for connecting to it remotely, a battery\
    \ and a switch for it, and a few buttons and resistors to wire up the camera’s\
    \ control buttons to the Pi.\n\n“It works better than I expected!” Pete said about\
    \ the quality of the finished product. “Although it seems a bit daft to build\
    \ a camera that’s about as good as you’d get from a cheap camera phone, it’s changed\
    \ the way I take pictures. By removing the instant replay – most people seem to\
    \ view the world through the displays on their phones – I can concentrate on taking\
    \ the photo. Only seeing the pictures when I’ve taken the camera home and downloaded\
    \ them to my PC adds a bit to the film nostalgia and I’m often surprised by the\
    \ photos I’ve taken. Plus I’ve received some nice feedback about how the camera\
    \ looks.”\n\nThis is only the first iteration, and Pete has plans to make the\
    \ next build easier and also use the original lens with the Pi camera.\n\n+  \
    \ * **Top-left:** The camera of the past, updated for today.\n+   \n+   * **Left:**\
    \ The Pi is the perfect size to fit inside the camera case\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_155_1.png)"
  merge: -1
  img_proc: true
- pgno: 156
  md: '# ## 20 RASPBERRY PI HACKING PROJECTS


    # ## Bitcoiin Pool Table


    *Modem pool pros pay digitally by scanning a QR code to insert Bitcoins*


    **Maker Profile

    Stuart Kerr**


    Technical director


    Stuart Kerr is the technical director of Liberty Games, which specialises in classic
    table and bar games. You might have heard of some of their hacks.


    Find out more:

    libertygames.co.uk


    Liberty Games loaded a Raspberry Pi into the side of a pool table that enables
    people to make payments via a Bitcoiin app on their phone to release the balls.
    "We did this with the Raspberry Pi 1", Stuart tells us. "We tried to install the
    entire Bitcoiin client on the Pi but it was struggling, and downloading the whole
    blockchain caused issues too. It was going to be connected to the internet, so
    we offloaded the heavier work to a server able to handle the blockchain. The server
    receives the Bitcoiin payment and then communicates to the Pi securely that the
    payment has come in, and it syncs up the prices as well." "We connected a PiFace
    via a breakout board that''s monitoring on WebRTC for the go-ahead from the server,
    and once it gets that, it sends the physical voltage to the electrical ball release
    mechanism."


    ![](img/a1548a579bd09ff29b2b92de3f565e63_156_0.png)


    *Above The price of a game is displayed, in Bitcooins, on the PiFace display module*


    ![](img/a1548a579bd09ff29b2b92de3f565e63_156_1.png)


    # ## Fireball Pinball


    *Ian Cole and his sons enter the high score boards with Fireball HD*


    **Maker Profile

    Ian Cole


    Maker and geek raiser**


    Ian Cole is a keen maker, hacker and inventor, and regularly blogs about his family
    projects with his two sons. Their Fireball Project, for example, grew out of an
    innocent "Can you make it playable?" Find out more:

    raisngeeks.com


    At raisingeeks.com, Ian Cole and his two sons love a challenge. So the chance
    to repair a game table gave them the perfect Raspberry Pi primer. "We''ve taken
    an existing pinball machine playfield," says Ian, "and built a new game from it.
    This required learning the underlying hardware first. Then we learned how to use
    the Raspberry Pi, pygame for sound and text graphics, and omplayer for HD video,
    and we connected the software tools with the hardware of the pinball machine.
    "We built a MOSFET circuit on a breadboard to test a single solenoid. When that
    worked, we duplicated it onto a hand-soldered protoboard and extended it to control
    the five solenoids. The Raspberry Pi handles graphics, audio, scoring rules, saving
    scores, etc. One Arduino drives the lamp and switch matrix, another drives the
    solenoids. The three are connected with an I2C bus."


    # ## LED Voice-Controlled Coffee Table


    *Light up your living room with a voice-controlled light show for a coffee table*


    **Maker Profile

    Mikel Duke


    Software developer**


    Mikel loves programming, photography, biking archery, and sharing projects.


    Find out more:

    bit.ly/1FOhDKW


    Mikel found himself in a quandary: he didn''t have a coffee table. However, instead
    of just heading to Ikea and picking up a LACK, he decided to make one himself.
    Not just any coffee table though, one that lit up using a Raspberry Pi to control
    the sequence. "I used the Raspberry Pi because it was easy to work with and has
    a great community. Whenever I run into an issue, there is always documentation
    on how to fix it. I wanted to have network support and do more complex operations,
    like loading images, then I could do just using an Arduino with Ethernet. The
    combination of the two really made development faster. Now that Pi 4 has added
    support for the Raspberry Pi''s integrated SPI, I am working on controlling the
    LEDs directly, without the Arduino." Recently, Mikel added voice control to it,
    using Google Now. "After you say a command to Google Now, Autovoice, a plugin
    for the Android app Tasker, intercepts the response back from Google. If the response
    matches a Tasker task, the task will be launched. I have a few tasks set up to
    make web service calls, basically calling a URL with parameters. This URL connects
    to a Java based web service I created, running on my Raspberry Pi." Mikel also
    encourages users not to use coasters, as drinks light up well when the table is
    switched on.


    157'
