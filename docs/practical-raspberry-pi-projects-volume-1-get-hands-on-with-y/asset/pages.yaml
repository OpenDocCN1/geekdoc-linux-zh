- pgno: 64
  md: '# BUILD A RASPBERRY PI MINECRAFT CONSOLE


    ![](img/a1548a579bd09ff29b2b92de3f565e63_64_0.png)


    Here''s the full layout of the buttons used by the PS3 controller - you can change
    them in the script that you download in Step 18


    ![](img/a1548a579bd09ff29b2b92de3f565e63_64_1.png)


    ![](img/a1548a579bd09ff29b2b92de3f565e63_64_2.png)


    # 16 Add controller support


    Make sure the controller input functions are installed on the Raspberry Pi. To
    do this, ssh into the Raspberry Pi like we did in Step 14 (where ''raspberry''
    is the password) and install the following package:


    ```

    $ sudo apt-get install xserver-xorg-input-joystick

    ```


    # 17 Controller mapping


    We have a controller map for the PS3 controller that you can download straight
    to your Pi, and with a bit of tweaking can fit most USB controllers as well. Go
    to the controller configuration folder with:


    ```

    $ cd /usr/share/X11/xorg.conf.d/

    ```


    # 18 Replace the controller mapping


    Well remove the current joystick controls by using `sudo rm 50-joystick.conf`
    and then replace by downloading a custom configuration using:


    ```

    $ sudo wget http://www.linuxuser.co.uk/wp-content/uploads/2015/04/50-joystick.conf

    ```


    # 19 Reboot to use


    After a reboot to make sure everything''s working, you should be able to control
    the mouse input on the console. R2 and L2 are the normal mouse clicks and can
    be used to navigate the Minecraft menu to access the game.


    ![](img/a1548a579bd09ff29b2b92de3f565e63_64_3.png)


    # 20 Go full-screen


    So far you may have noticed that *Minecraft* is running in a window - you can
    click the full-screen button to make it fill the screen, however you then heavily
    limit your mouse control. Thanks to the controller, you can get around that. As
    soon as you load the game, make sure you use the sticks for movement and the d-pad
    for selecting items in the inventory.


    # Xbox controllers


    Unfortunately, Xbox 360 controllers work slightly differently with Linux. As they
    use their own drivers that are separate to the normal joystick drivers we used
    for the PS3 pad and other USB controllers, a 360 controller doesn''t work as a
    mouse and is harder to assign specific functions to. This makes it tricky to use
    in a situation such as this.'
