  md: "# MAKE A GAME WITH PYTHON\n\n# 03 Write your code\n\nLaunch IDLE 2, rather\
    \ than IDLE 3, and open a new window. Use the code listing to create our game\
    \ 'Tux for Two'. Be careful to follow along with the code to make sure you know\
    \ what you're doing. This way, you can make your own changes to the game rules\
    \ if you wish.\n\n# 04 Set up the game\n\nThere's nothing too groundbreaking to\
    \ start the code: Tux's and the paddles' initial positions are set, along with\
    \ the initial speed and direction of Tux. These are also used when a point is\
    \ won and the playing field is reset. The direction and speed is set to random\
    \ for each spawn.\n\n# 05 The SimpleGUI code\n\nThe important parts in the draw\
    \ function are the draw.line, draw.image and draw.text functions. These are specifically\
    \ from SimpleGUI, and allow you to easily put these objects on the screen with\
    \ a position, size and colour. You need to tie them to an object, though - in\
    \ this case, canvas.\n\n# 06 SimpleGUI setup code\n\nThe last parts are purely\
    \ for the interface. We tell the code what to do when a key is depressed and then\
    \ released, and give it a frame to work in. The frame is then told what functions\
    \ handle the graphics, key functions etc. Finally, we give it frame.start() so\
    \ it starts.\n\n# Full code listing\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_26_0.png)\n\
    \n```\nimport simplegui as simplegui\nimport random\n\nw = 600\nh = 400\ntux_r\
    \ = 20\npad_w = 8\npad_h = 80\n\ndef tux_spawn(right):\n global tux_pos, tux_vel\n\
    \ tux_pos = [0,0]\n tux_vel = [0,0]\n tux_pos[0] = w/2\n tux_pos[1] = h/2\n if\
    \ right:\n tux_vel[0] = random.randrange(2, 4)\n else:\n tux_vel[0] = -random.randrange(2,\
    \ 4)\n tux_vel[1] = -random.randrange(1, 3)\n\ndef start():\n global paddle1_pos,\
    \ paddle2_pos, paddle1_vel, paddle2_vel\n global score1, score2\n tux_spawn(random.choice([True,\
    \ False]))\n score1, score2 = 0,0\n paddle1_vel, paddle2_pos = [0,0]\n paddle1_pos,\
    \ paddle2_pos = h/2, h/2\n\ndef draw(canvas):\n global score1, score2, paddle1_pos,\
    \ paddle2_pos, tux_pos, tux_vel\n if paddle1_pos > (h - (pad_h/2)):\n paddle1_pos\
    \ = (h - (pad_h/2))\n elif paddle1_pos < (pad_h/2):\n paddle1_pos = (pad_h/2)\n\
    \ else:\n paddle1_pos += paddle1_vel\n if paddle2_pos > (h - (pad_h/2)):\n paddle2_pos\
    \ = (h - (pad_h/2))\n elif paddle2_pos < (pad_h/2):\n paddle2_pos = (pad_h/2)\n\
    \ else:\n paddle2_pos += paddle2_vel\n canvas.draw.line([w / 2, 0],[w / 2, h],\
    \ 4, \"Green\")\n canvas.draw.line([0,(pad_w/2)], paddle1_pos + (pad_h/2)], [pad_w/2],\
    \ paddle1_pos - (pad_h/2)], pad_w, \"Green\")\n canvas.draw.line([w - (pad_w/2)],\
    \ paddle2_pos - (pad_h/2)], [w - (pad_w/2)], paddle2_pos + (pad_h/2)], pad_w,\
    \ \"Green\")\n tux_pos[0] += tux_vel[0]\n tux_pos[1] += tux_vel[1]\n if tux_pos[1]\
    \ < tux_r or tux_pos[1] > h - tux_r:\n tux_vel[1] = -tux_vel[1]*1.1\n if tux_pos[0]\
    \ < pad_w + tux_r:\n```\n\n```\nif (paddle1_pos(pad_h/2)) >= tux_pos[1] --> (paddle1_pos-(pad_h/2)):\n\
    \ tux_vel[0] = -tux_vel[0]*1.1\n tux_vel[1] = 1.1\n else:\n score2 += 1\n tux_spawn(True)\n\
    \ elif tux_pos[0] >= w - pad_w - tux_r:\n if (paddle2_pos(pad_h/2)) >= tux_pos[1]\
    \ --> (paddle2_pos-(pad_h/2)):\n tux_vel[0] = -tux_vel[0]\n tux_vel[1] = 1.1\n\
    \ else:\n score1 += 1\n tux_spawn(False)\n canvas.draw_image(tux, (265 / 2, 314\
    \ / 2), (265, 314), tux_pos, (45, 45))\n canvas.draw_text(str(score1), [150, 100],\
    \ 30, \"Green\")\n canvas.draw_text(str(score2), [450, 100], 30, \"Green\")\n\n\
    def keydown(key):\n global paddle1_vel, paddle2_vel\n acc = 3\n if key == simplegui.KEY_MAP[\"\
    w\"]:\n paddle1_vel += acc\n elif key == simplegui.KEY_MAP[\"s\"]:\n paddle1_vel\
    \ -= acc\n elif key==simplegui.KEY_MAP[\"down\"]:\n paddle2_vel += acc\n elif\
    \ key==simplegui.KEY_MAP[\"up\"]:\n paddle2_vel -= acc\n\ndefkeyup(key):\n global\
    \ paddle1_vel, paddle2_vel\n acc = 0\n if key == simplegui.KEY_MAP[\"w\"]:\n paddle1_vel\
    \ = acc\n elif key == simplegui.KEY_MAP[\"s\"]:\n paddle1_vel = acc\n elif key==simplegui.KEY_MAP[\"\
    down\"]:\n paddle2_vel = acc\n elif key==simplegui.KEY_MAP[\"up\"]:\n paddle2_vel\
    \ = acc\n\nframe = simplegui.create_frame(\"Tux for Two\", w, h)\nframe.set_draw_handler(draw)\n\
    frame.set_keydown_handler(keydown)\nframe.set_keyup_handler(keyup)\ntux = simplegui.load_image(\"\
    http://upload.wikimedia.org/ wiki/pedia commons/a/f/tux.png\")\nstart()\nframe.start()\n\
    ```"
