- pgno: 106
  md: '# Build a Raspberry Pi car computer


    Make your own touchscreen navigation system that gives directions, local weather
    reports and plays music


    ![](img/a1548a579bd09ff29b2b92de3f565e63_106_0.png)


    ![](img/a1548a579bd09ff29b2b92de3f565e63_106_1.png)


    Cars are getting clever. These days, with smart navigation interfaces built into
    new cars, you don''t need to go out and buy yourself a TomTom to get help with
    directions. But if you''ve got a Raspberry Pi then you don''t even need to buy
    that – let alone a new car!

    In this project we will show you how to build your own car computer with your
    Pi, a quality touchscreen like the 9-inch model from SainSmart that we''re using
    here, and a few other bits like a GPS module and USB 3G modem. Your CarPi will
    be able to use open source navigation software Navit to show your route map on
    screen, plus speech synthesis to read out directions, and it will also be able
    to check your location and give you weather reports. It''ll work as a music player
    too, of course.

    It''s an ambitious project, but you will gain a solid understanding of custom-made
    interfaces, navigation software and geolocation data, touchscreen calibration,
    speech synthesis and more. While you don''t have to use the same SainSmart screen
    as us, we do recommend it for this project as it is one of the few large touchscreens
    out there for the Pi. There are more improvements at the end too, so check the
    components list, make sure you''ve got everything and let''s get started!'
  merge: -1
  img_proc: true
