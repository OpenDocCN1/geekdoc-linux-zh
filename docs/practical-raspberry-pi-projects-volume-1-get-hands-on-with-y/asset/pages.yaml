  md: "# # Make a Raspberry Pi sampler\n\n**Build your own looping drum machine with\
    \ only 200 lines of code!**\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_115_0.png)\n\
    \nLeft Extra breadboards are used here to keep the main breadboard as free from\
    \ wires as possible\n\n# ## What you'll need\n\n+   - Latest Raspbian image  \n\
    +     raspberry pi.org/downloads\n+   - At least one breadboard\n+   - Push buttons\n\
    +   - LEDs\n+   - Female-to-male GPIO jumper cables\n+   - Male-to-male GPIO jumper\
    \ cables\n\nIn this tutorial we combine electronics, music and programming knowledge\
    \ to create a simple sampler with looping capabilities. The implementation used\
    \ in this article has three drum sounds as the samples, but it is trivial to add\
    \ more until you run out of GPIO pins.\n\nBefore we start, I'll cover some basic\
    \ musical terms. Music is split into bars. There are a certain number of beats\
    \ in a bar. This sampler uses the 4/4 time signature, which means there are 4\
    \ beats in each bar. Tempo is the speed at which music is played, and it is measured\
    \ in beats per minute (bpm). A metronome is an audible tone that is heard at the\
    \ start of every beat.\n\nQuantization is the process of aligning notes to beats,\
    \ or exact fractions of a beat, and a quantization value is usually given in the\
    \ form 1/8. This means that there are eight possible places in a bar where a note\
    \ can be played. When the sampler is recording and a sample button is pressed,\
    \ we store the sample at the current position in the bar with the accuracy of\
    \ the quantize value. There's a lot to cover, so let's get started.\n\n# ## 01\
    \ Connect LEDs\n\nThe circuit diagram is an LED that can be turned on and off\
    \ with a GPIO output. The orange wire is the connection from the GPIO output.\
    \ This then goes through a 220Ω resistor to limit the current draw to a safe level.\
    \ This current flows through the positive leg of the LED and then back to ground.\
    \ We need nine LEDs for this project.\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_115_1.png)"
