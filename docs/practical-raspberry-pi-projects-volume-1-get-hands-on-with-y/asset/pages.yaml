- pgno: 31
  md: '# ## Make a Pi 2 desktop PC


    Use your Raspberry Pi as a desktop replacement PC thanks to the increased power
    of the Raspberry Pi 2


    The Raspberry Pi 2''s increased power over its predecessor is well-documented
    by now. More CPU cores and more RAM making it six times faster is an impressive
    number, and you can see the actual changes that it makes to the experience.


    This power actually enables you to conduct a very simple project that was just
    out of reach for the original Raspberry Pi: a Raspberry Pi desktop PC.


    All the components for it were available, but the Pi was just a little too slow
    to properly give a fluid desktop experience. Now with the improved resources,
    many of the restrictions are gone---enough of them to be able to build a Pi desktop.
    So grab a Pi 2 and we''ll get started.


    # ### 01 Get Raspbian


    We will be using Raspbian for our desktop Pi. Not only is it simple to obtain
    and easy to use, but it is supported by the Pi Foundation and community, which
    means it''s going to be the most flexible operating system with the most choices
    for a desktop. Download it from: [www.raspberrypi.org/downloads.](http://www.raspberrypi.org/downloads.)


    ![](img/a1548a579bd09ff29b2b92de3f565e63_31_0.png)


    ![](img/a1548a579bd09ff29b2b92de3f565e63_31_1.png)


    # **What you''ll need**


    +   Raspberry Pi 2

    +   Raspbian raspberrypi.org/downloads

    +   Keyboard

    +   Mouse

    +   Wireless dongle

    +   Monitor

    +   Case

    +   Powered USB hub (optional)'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# MAKE A PI 2 DESKTOP PC


    ![](img/a1548a579bd09ff29b2b92de3f565e63_32_0.png)


    **02** **Install Raspbian**


    Once Raspbian is downloaded, you can install it to your SD card. Put the micro
    SD into an SD card reader and connect it to your main system (a PC or laptop).
    Open up the terminal, cd to the location of the image and use:


    ```

    $ sudo dd bs=1M if=raspbian.img of=/dev/[Location of SD card]

    ```


    **03** **Setup options**


    On first boot there will be some setup stuff that it is necessary you go through.
    The most important things to do for this desktop are to first hit ''Enable Boot
    to Desktop'' and then to extend the installation to fill the entire SD card. After
    you have done that, do anything else that you want to do in these menus and then
    reboot before moving on to the next step.


    **04** **First boot**


    You will boot into a fresh version of Raspbian with the newer interface and default
    apps available to use. From here you can start using it as normal if you wish,
    but it is worth noting that there are a few extra things that you should do to
    make it truly desktop worthy.


    **05** **Software updates**


    Our first step is to perform an upgrade on the system to make sure it''s all up
    to date and working properly. To do this, open up the terminal from the menus
    and use:


    ```

    $ sudo apt-get update

    ```


    ... to refresh the software list, followed by the next command to then upgrade
    to newer software.


    ```

    $ sudo apt-get upgrade

    ```


    ![](img/a1548a579bd09ff29b2b92de3f565e63_32_1.png)


    > Above Make sure you set the Pi to boot straight to the desktop, like your main
    computer


    **06** **Firmware upgrade**


    While we''re updating, it''s a good idea to upgrade the firmware on the device.
    Still in the terminal, you''ll want to activate the firmware upgrade software
    with:


    ```

    $ sudo rpi-update

    ```


    **07** **Extra configuration**


    At this point, you might want to tweek the Pi a little further. To bring up the
    initial configuration screen, you''ll need to go back into the terminal and launch
    it with:


    ```

    $ sudo raspi-config

    ```


    **08** **Advanced options**


    From here you can activate some extra options that you might need in the future.
    Enabling the Pi camera driver is a good first step, and you can even have it boot
    to Scratch if you want to focus on fun game development. Otherwise, there are
    also some overclocking options that you can consider if the system starts getting
    slow for you.'
