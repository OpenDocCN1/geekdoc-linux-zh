- pgno: 112
  md: "# BUILD A RASPBERRY PI CAR COMPUTER\n\n21 Install the requirements for your\
    \ launcher\n\nThe launcher is going to use a weather API combined with location\
    \ data from the GPS receiver to give weather updates when requested. The nicest\
    \ HTTP API for Python is requests, which you can install by doing the following:\n\
    \n```\n```\nsudo apt-get install python-pip\nsudo pip install requests\n```\n\
    ```\n\n22 Write the launcher code\n\nCreating the code itself is pretty self explanatory,\
    \ but you can use our ready-made version by downloading the CarPi package from\
    \ FileSilo.co.uk and extracting carlauncher/carlauncher.py.\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_112_0.png)\n\
    \n23 Start the launcher automatically\n\nSudo-edit /etc/kxdsl/gwesome/rc.lua and\
    \ move \"awful.layout.suit.max.fullscreen\" to the top of the layouts list. Add\
    \ the following to the bottom of the file:\n\n```\n```lua\nawful.util.spawn_with_shell(\"\
    /home/pi/carlauncher/carlauncher.py\")\n```\n```\n\nNow reboot again and the launcher\
    \ should come up automatically.\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_112_1.png)\n\
    \n24 Future improvements\n\n+   There are a number of improvements that could\
    \ be made to the base project at this point:\n+   * Make the launcher switch between\
    \ applications rather than start them again each time\n+   * Make the launcher\
    \ look better aesthetically with icons\n+   * Use Mopidy instead of MPD so you\
    \ can use Spotify\n+   * Further NaviX configuration to make it more featureful\n\
    +   * An SSD or USB flash drive for storage to make things quicker\n\n# Full code\
    \ listing\n\n```\n```python\ndef reset(self):\n    self.clean_background()\n \
    \   self.main_menu()\n    self.render_weather()\n\ndef execute(self, path):\n\
    \    os.system(path)\n    # os_system blocks so by the time we get here application\n\
    \    # has finished\n    self.reset()\n\ndef render_weather(self):\n    if self.w_text\
    \ == None:\n        return\n    # Get y starting at the bottom of the nav button\n\
    \    margin = 10\n    y = self.btns[\"NAV\"].bottomleft[1] + margin\n    for t\
    \ in self.w_text.split(\"\\n\"):\n        line = self.wfont.render(t.rstrip(),\
    \ 1, (255, 255, 255))\n        line_rect = line.get_rect()\n        line_rect.centerx\
    \ = self.background.get_rect().centerx\n        line_rect.y = y\n        self.screen.blit(line,\
    \ line_rect)\n        y += margin + line_rect.height\n    pygame.display.flip()\n\
    \ndef handle_events(self, events):\n    for e in events:\n        if e.type ==\
    \ QUIT:\n            sys.exit()\n        elif e.type == MOUSEBUTTONDOWN:\n   \
    \         pos = pygame.mouse.get_pos()\n            # Check if it collides with\
    \ any of the buttons\n            for btn_text, rect in self.btns.items():\n \
    \               if rect.collidepoint(pos):\n                    self.select_rect(rect,\
    \ btn_text)\n                    if btn_text == \"NAV\":\n                   \
    \     self.execute(\"/usr/bin/navi\")\n                    elif btn_text == \"\
    Music\":\n                        self.execute(\"/usr/local/bin/pympd-touchnui\"\
    )\n                    elif btn_text == \"Weather\":\n                       \
    \ self.w_text = WeatherClient.update()\n                        # Reset w_list\
    \ render weather if string is populated\n                        self.reset()\n\
    \ndef loop(self):\n    clock = pygame.time.Clock()\n    self.reset()\n    while\
    \ 1:\n        self.handle_events(pygame.event.get())\n        # Flip to display\n\
    \        clock.tick()\n\nif __name__ == \"__main__\":\n    c1 = CarLauncher()\n\
    \    c1.loop()\n```\n```"
