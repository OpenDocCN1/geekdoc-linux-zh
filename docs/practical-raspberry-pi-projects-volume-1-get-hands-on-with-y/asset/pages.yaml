- pgno: 77
  md: '# Digital assistant, part 2:

    speech recognition


    In this second instalment, learn how to decode your audio data and figure out
    what commands are being given by the humans around you


    # Offload tasks


    You can offload the audio data processing to Google, accessing the API directly
    over HTTP by posting your audio data to the appropriate URL. First install the
    Python module SpeechRecognition:


    ```

    $ pip install\nSpeechRecognition

    ```


    Now create an instance of the Recognizer object. A Helper object, called WaveFile,
    will take an audio file and prepare it for use by the Google API. Then process
    it with the record() function and hand this processed audio to the function recognize().
    When it returns, you will get a list of pairs of possible texts, along with a
    percentage confidence level for each possible text decoding. Be aware that this
    module uses an unofficial API key so for anything more than small personal testing
    you should request your own API key.


    ![](img/a1548a579bd09ff29b2b92de3f565e63_77_0.png)


    Previously we looked at how we could use our Raspberry Pis to listen to the world
    around them. This is the first step in building our own version of the J.A.R.V.I.S
    system made famous in the Iron Man movies. The next step is to try and make sense
    of what we may have just heard. In general, this is called speech recognition
    and it is a very large and active area of research. Every major mobile phone operating
    system has applications trying to take advantage of this mode of human interaction.
    There are also several different Python modules available that can do this speech-to-text
    (STT) translation step. In this second article, we will look at using Pocket Sphinx
    to do all the heavy lifting. Sphinx was developed by Carnegie Mellon University
    and is licensed under a BSD licence, so you are free to add any extra functionality
    that you may need for specific tasks. Because of the activity in this field, it
    is well worth your time to keep track of all the updates and performance improvements.


    While you can download the source code for all of these modules and build it from
    scratch, we are going to assume that you are using one of the Debian-based distributions,
    like Raspbian. For these you can simply use:


    ```

    $ sudo apt-get install python-pocketsphinx

    ```


    ...to get all of the required files for the engine. You will also need audio model
    files and language model files in order to get a translation in you language of
    choice. To get the files needed for English, you can install the packages:


    ```

    $ sudo apt-get install pocketsphinx-hmm-wsj1 pocketsphinx-lw-wsj1

    ```


    You may need to go outside the regular package management system if you want to
    process other languages. Then you can simply start writing and using your code
    straight away. To start using these modules, you will need to import both pocketsphinx
    and sphinxbase:


    ```

    import pocketsphinx as ps

    import sphinxbase

    ```


    These modules are actually Python wrappers around the C code that handles the
    actual computational work of translating sounds to text. The most basic workflow
    involves instantiating a Decoder object from the pocketsphinx module. The Decoder
    object takes several input parameters to define the language files it is allowed
    to use. These include “hmm”, “lm” and “dict”. If you use the above packages used
    to handle English, then the files you need will be in the directories /usr/share/pocketsphinx/model/hmm/,
    /usr/share/pocketsphinx/model/lw/ and /usr/share/pocketsphinx/model/lw/lw.js/
    if you want to set these parameters, then it tries to use sensible defaults (which
    usually won’t fit for English language speech. This newly created Decoder object
    can now be given WAV files that data to process. If you remember that previously,
    we saved the recorded speech as a WAV file. In order to have this audio recorded
    in the correct format, you will want to edit the code from the first tutorial
    and ensure that you are recording in mono (using one channel), for example), and
    recording at 16kHz with 16-bit quality. To read it properly you can use a file
    object and load it as a binary file with read permissions. WAV files have a small
    piece of header data at the beginning of the file that you need to jump over.
    This is done by using the seek function to jump over the first 44 bytes. Now that
    the file pointer is in the correct position, you can hand the file object () to
    the Decoder object’s decode_raw() function. It will then go off and do a bunch
    of data crunching to try and figure what was said. To get the results, you would
    use the get_hyp() function call. You get a list with three elements from this
    function: a string containing the best guess at the spoken text, a string containing
    the utterance ID and a number containing the score for this guess.


    ![](img/a1548a579bd09ff29b2b92de3f565e63_77_1.png)


    ![](img/a1548a579bd09ff29b2b92de3f565e63_77_2.png)


    ![](img/a1548a579bd09ff29b2b92de3f565e63_77_3.png)


    ![](img/a1548a579bd09ff29b2b92de3f565e63_77_4.png)'
  merge: -1
  img_proc: true
