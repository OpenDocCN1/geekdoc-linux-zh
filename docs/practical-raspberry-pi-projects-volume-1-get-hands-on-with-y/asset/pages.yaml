  md: '# HOW I MADE: JOYTONE


    # How I made:

    Joytone


    Reinventing the keyboard with a grid of joysticks


    ![](img/a1548a579bd09ff29b2b92de3f565e63_138_0.png)


    # What inspired the Joytone?


    David Sharples – The Joytone is an expressive isomorphic musical instrument which
    came out of my frustration trying to learn to play musical instruments. I was
    trying to teach myself piano and was wondering why there are white and black keys
    – it makes things so much harder. I learned a bit of music theory and came to
    realise that a major scale is just a well-defined musical structure; the gaps
    between the notes in a major scale are the same regardless of which major scale
    it is. But, because there are white and black keys on a piano, you can play a
    C major scale just by running up all the white notes. If you want to play a F#
    major scale you just to throw in a bunch of black keys. It’s hard to remember
    and you have to build up muscle memory. So one of the goals with this project
    is to build an instrument that doesn’t have that bias based on the keys – so it’s
    isomorphic; that’s what that means.


    # And you’re using analogue thumbsticks?


    David Glanzman – They’re Kbox joystick… Sharples – That’s the second big goal
    of the project. When I was researching this, I noticed there were some instruments
    that had these isomorphic keyboards – a grid of hexagons – but the issue was that
    they were just buttons, they didn’t have the same richness and depth as an actual
    musical instrument. When you’re playing a guitar there are a million ways to affect
    the sound – how hard you’re pushing on the string, how hard you pluck it, where
    on the fret you’re holding it, if you bend the string or not – and you can get
    all these rich sonic qualities. So we wanted to make it isomorphic and we wanted
    to make it expressive. We used these thumbsticks because you get two channels
    of analogue control in this familiar little interface. One axis changes the waveform
    of the synthesised sound from a triangle wave (has a pure, bell-like quality)
    to a reverse sawtooth wave (has a buzzy, bright sound, like a trumpet). There
    are two oscillators creating each


    note and if you push the thumbstick to the left, those oscillators are exactly
    in tune, making a very soft sound. If you push it all the way to the right then
    they’re offset by a couple of hertz, which makes a wide, rich sound. Then the
    amount that you rotate the joystick gives the volume. So you have two and a half
    dimensions of control there, which adds some depth to the sound.


    # What is the role of the Raspberry Pi?


    Sharples – There’s a two-brain system going on – we have the Raspberry Pi and
    then we have the Cypress PSoC 4. The Cypress PSoC 4 does all the heavy lifting
    with the data reading.


    Glanzman – It does all the measurements for the joysticks. It’s got ADCs in it
    that convert analogue to digital, and then basically looks at each axis for each
    joystick in sequence, records it, and then waits for the Raspberry Pi to ask it
    for data values for each of the joysticks.


    Sharples – There’s 57 thumbsticks and each one has two analogue channels, so that’s
    114 analogue channels total. So what we did was we had eight 16-channel multiplexers
    hooked up to the PSoC and then the PSoC sends a signal to all of them that says
    ‘give me channel one’. Then it reads the eight channels, and then it says ‘give
    me channel two’ and it reads the eight channel two’s. After it does that for all
    16 channels it then has this full bank of current data. The Raspberry Pi periodically
    says ‘give me all your most recent data’ so the PSoC forwards the data to the
    Raspberry Pi, which then does a little bit of processing in Python and then sends
    commands to PureData, which is our synthesiser program.


    # What’s the Arduino component doing?


    Sharples – Each thumbstick also has an RGB LED in its hexagonal cell, and our
    intention was to use those to show which notes are in key or out of key. We also
    wanted to guide the user through a scale – or even a song, showing the next note
    that they’re supposed to play – but


    we ran into some technical difficulties. The ideal setup for this is that you
    daisy-chain all these lights in a big line and then hook them up to an Arduino
    Micro, which is really good at controlling those specific lights from Adafruit,
    and then it can just push all of this data down the line and you should just be
    able to put whatever colours you want on each light individually. But we had some
    problems with the signal and could only get about four lights to behave.


    # Is it easy to learn to play the Joytone?


    Sharples – The barrier to entry is much lower. It’s funny, when we first got it
    working, David was playing with it, wearing headphones, and he sort of stopped
    talking and was pushing a few of the joysticks, like ‘Wait, wait…’ and then he
    just played back Bach. The key to learning it is just learning a little, tiny
    bit about the structures in music theory. There’s a shape you can hold your fingers
    in that will play a C major chord; once you learn that, shape, that’s it – that’s
    how all of the Joytone’s major chords are played.


    Glanzman – When it comes to learning the Joytone, you have to attack musical instruction
    differently than you would with another instrument. When you learn something like
    the piano, you learn that this is D major, this is F# minor – you learn different
    things based on the note, the actual class. But with the Joytone, the pitch class
    is totally irrelevant because we hear everything in relative terms, and you play
    everything in relative terms. So to learn the instrument you don’t even have to
    discuss pitch classes – you just talk about relative distances. So major thirds
    or minor thirds, fifths, fourths – it’s distances between notes instead of the
    actual note values. I think if you phrase musical instruction in those terms,
    in terms that we experience music in rather than the terms we normally go through
    to create music, it becomes a much more natural interface because it’s built on
    that type of instruction, making it simple to learn.


    ![](img/a1548a579bd09ff29b2b92de3f565e63_138_1.png)


    David Sharples is an interaction designer and graduated from the University of
    Pennsylvania’s Digital Media Design programme


    ![](img/a1548a579bd09ff29b2b92de3f565e63_138_2.png)


    David Glanzman is a sophomore in Computer Engineering at the University of Pennsylvania.
    David has worked on microprocessor design, audio electronics, medical devices
    and more


    # Like it?


    Interested in learning more about isomorphic instruments? Check out David Sharples’
    design blog: davec-harpel.es/blog


    # Further reading


    Here’s the final demo video of the Joytone, comprising David Glanzman’s virtuosic
    Bach performance: bit.ly/1FkNxlW'
