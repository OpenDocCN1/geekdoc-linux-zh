- pgno: 102
  md: "# # CODE A SIMPLE SYNTHESISER\n\n**11 Synth loop**\nThe start method of the\
    \ synth class initialises the audio hardware and then starts the synth_loop method\
    \ in its own thread. While the exit event is set to false, the do_sample function\
    \ is called.\nThe do_sample function loops through the notes that are currently\
    \ turned on and asks for a sample from each one. These samples are shifted right\
    \ by three (ie divided by 2³) and added to out_sample. The division ensures that\
    \ the output sample can't overflow (this is a very primitive method of adding\
    \ notes together, but it works nonetheless).\nThe resulting sample is then put\
    \ in the sample buffer. Once the buffer is full, the more_samples condition is\
    \ cleared and the synth_loop thread waits to be notified that the buffer it has\
    \ just built has been sent to the audio card. At this point, the synth can fill\
    \ up the buffer that has just finished playing and the cycle continues.\n\n**12\
    \ Turn on notes**\nThere are both note_on/off and freq_on/off functions that enable\
    \ either MIDI notes or arbitrary frequencies to be turned on easily. Added to\
    \ this, there is also a toggle note function which keeps track of MIDI notes that\
    \ are on and turns them off if they are already on. The toggle note method is\
    \ used specifically for keyboard input.\n\n**13 Add keyboard input**\nFor keyboard\
    \ input, we needed the ability to get a single character press from the screen.\
    \ Python's usual input code needs entering before returning to the program. Our\
    \ code for this is inspired by: [https://code.activestate.com/recipes/577977-get-single-keypress/](https://code.activestate.com/recipes/577977-get-single-keypress/)\n\
    There is a mapping of letters on a keyboard to MIDI note numbers for an entire\
    \ keyboard octave. We have tried to match the letter spacing to how a piano is\
    \ laid out to make things easier. However, more innovative methods of input are\
    \ left as an exercise to the reader.\n\n**14 Put it all together**\nThe main function\
    \ of the program creates an instance of the synth class and then starts the audio\
    \ stream and synth loop thread. The start function will then return control to\
    \ the main thread again.\nAt this point we create an instance of the KB input\
    \ class and enter a loop that gets characters and toggles the corresponding MIDI\
    \ note on or off, if the user presses the Q key, that will stop the synth and\
    \ end the input loop. The program will then exit.\n\n**15 Compile the code**\n\
    Exit your editor and run the compile script by typing the following command:\n\
    **./compile.sh**\nThis may take around 30 seconds, so don't worry if it isn't\
    \ instant. Once the compilation has finished, execute the synth. bin command using:\n\
    **./synth.bin**\nPressing keys from A all the way up to K on the keyboard will\
    \ emulate the white keys on the piano. If you press a key again the note will\
    \ go off successfully.\n\n# Full code listing (Cont.)\n\n```\n```python\ndef note_off(self,\
    \ n):\n    self.freq_off(self.midi_table.get_note(n))\n    self.notes_on.remove(n)\n\
    \ndef toggle_note(self, n):\n    if n in self.notes_on:\n        print (\"note\
    \ {} off\".format(n))\n        self.note_off(n)\n    else:\n        print (\"\
    note {} on\".format(n))\n        self.note_on(n)\n\nclass KBInput:\n    def __init__\
    \ (self, synth):\n        self.synth = synth\n\n        self.keymap = {'a': 60,\
    \ 'w': 61, 's': 62,\n                      'e': 63, 'd': 64, 'f': 65,\n      \
    \                't': 66, 'g': 67, 'y': 68,\n                      'h': 69, 'u':\
    \ 70, 'j': 71,\n                      'k': 72}\n\n        self.notes_on = []\n\
    \n    @staticmethod\n    def getch():\n        fd = sys.stdin.fileno()\n     \
    \   old_settings = termios.tcgetattr(fd)\n        try:\n            tty.setraw(fd)\n\
    \            ch = sys.stdin.read(1)\n        finally:\n            termios.tcsetattr(fd,\
    \ termios.TCSADRAIN,\n                              old_settings)\n        return\
    \ ch\n\ndef loop(self):\n    while True:\n        c = self.getch()\n\n       \
    \ if c == 'q':\n            self.synth.stop()\n            return\n\n        if\
    \ c in self.keymap:\n            n = self.keymap[c]\n            self.synth.toggle_note(n)\n\
    \nif __name__ == \"__main__\":\n    s = Synth()\n    s.start()\n    kb = KBInput(s)\n\
    \    kb.loop()\n```\n\n```\n\n```\n```\nnote 68 on\nNote: Frequency = 261.625648860Hz,\
    \ Step Size = 0.999187970161\nnote 68 off\nnote 64 on\nNote: Frequency = 329.62765547Hz,\
    \ Step Size = 0.754929602146\nnote 64 off\nnote 65 on\nNote: Frequency = 349.228363037Hz,\
    \ Step Size = 0.799829065498\nnote 65 off\nnote 67 on\nNote: Frequency = 391.995574591Hz,\
    \ Step Size = 0.899767663062\nnote 67 off\nExiting...\n```\n\nAbove The simple\
    \ user interface. Notice how the step size in the waveform varies with frequency\n\
    ```"
