  md: '# ADD GESTURE CONTROL TO YOUR RASPBERRY PI


    **08 Investigate the output**

    Once you have completed step 7, if you touch the Hover board or make gestures
    above it you will begin to see output in the terminal which is a bunch of 0s and
    1s and then a description of what it has seen – right swipe, north tap, etc. The
    way the Hover works is that it can sense any one of nine different actions and
    these are sent to the Raspberry Pi over I2C as an 8-bit binary value. The first
    three bits describe whether it was a touch or gesture event and the remaining
    five bits describe the specific type or direction of the event. The exact breakdown
    can be seen in the code listing to the right.


    **09 Enable 3.5mm audio**

    Grab your speakers and plug them in to the 3.5mm jack plug on the Raspberry Pi.
    You will then need to route audio to the 3.5mm jack using the following command
    (you can skip this step if you are using an HDMI display, which has in-built audio):


    ```

