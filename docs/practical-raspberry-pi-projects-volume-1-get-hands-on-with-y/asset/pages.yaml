    # Build a complex LED matrix


    LED matrix display systems find use everywhere from gaudy kebab shops to impressive
    steampunk-styled systems


    Driving LEDs in an efficient fashion is a science of its own. The common availability
    of single-board computers has put the necessary technology within reach of everyone.


    # 01 Think about LEDs


    When dealing with LED displays, two different systems must be considered. We will
    focus on traditional matrix-based systems made up of one or more LEDs. Their affordable
    nature makes them ideally suited to classic display applications: they communicate
    currency prices, provide stock-brokers with updates from the trading floor and
    have even been used as basic displays for primitive oscilloscopes.


    Standardise. LEDs are primitive – they light up once current flows through them.
    Driving a few LEDs is as easy as connecting them to GPIO pins along with a resistor.
    Sadly, this method becomes wasteful once more than a few of them get involved
    – driving 16 diodes ties up 16 pins.


    # 02 Arrange your diodes


    Finally, we will also provide you with an overview of electronic basics. This
    tutorial is a bit more advanced than the ones we''ve featured up until now, and
    it''s also worth noting that we''re going to be programming with C rather than
    Python. Follow along using the code listing annos.


    Methods were devised to reduce the number of pins needed. Matrix-based systems
    are resilient to individual diode failures, and provide a pin-to-LED ratio of
    n=(n/2)^2. The following steps assume a 16x16 LED matrix which is made up according
    to Figure A. Since LEDs permit current in only one direction, you can enable a
    single LED by bringing the corresponding pins high and low.'
