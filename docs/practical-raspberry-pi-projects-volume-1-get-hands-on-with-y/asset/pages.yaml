- pgno: 47
  md: '# Make a tweeting

    wireless flood sensor


    Flood-proof your basement in just 19 lines of code, or easily tweak the project
    to create your own personalised alarm system...


    Floods saw hundreds of homes right across the world underwater this year, and
    many would have benefited from having just that little bit extra warning. In order
    to be better prepared for floods, we''re going to show you how you can prototype
    your own wireless flood sensor in less than ten minutes. Building it might give
    you just enough warning to dash home from work, move valuables items upstairs
    and take the lawnmower, caravan and motorbike to higher ground. Handily, it can
    also be used to detect toilet flushes, water butt levels or any liquid level rise
    or fall at all -- so it''s not just something fun to try out, it''s practical
    tool!


    # Sending tweets


    Sending a tweet seems to be really easy, if a little on the insecure side. These
    days you need to register an application with your Twitter account -- you do have
    one, don''t you? If not, go create one at www. twitter.com. At first this project
    can look a little daunting, however it can be done painlessly in less than five
    minutes, if you follow these steps closely!


    # What you''ll need


    +   *   Ciseo Raspberry Pi Wireless Inventors Kit

    +       shop.ciseo.co.uk/rpiwk

    +   *   Float sensor

    +       shop.ciseo.co.uk/float-switch

    +   *   DC power supply between 6v and 12v


    # 01 Link Twitter to mobile


    Make sure your Twitter account has a mobile phone number associated with it. In
    your main Twitter account, click the gears icon at the top-right and then ''Mobile''
    in the list. At this stage, just follow the instructions on screen.


    # 02 Set it all up


    With your Twitter username and password, sign in to https://apps.twitter.com and
    click on the button ''Create an application''. In the name field we suggest you
    use your Twitter account name, add a space and then write ''test''. For the description,
    just put ''Test poster for Python''. Finally, for the website you can put anything
    you like. For example, http://www.mywebsite.com -- but it''s important you don''t
    forget the ''http://''.


    # 03 Enable reading and writing


    Since you want to be able to send tweets, click on the ''Settings'' tab, change
    to ''Read and Write'' and then click ''Update''. This might take a few seconds.


    # 04 Generate codes


    Now go back to the ''Details'' tab. You will see that an ''API key'' and ''API
    secret'' are visible, and that there''s a ''Create my access token'' button. Click
    that button to obtain all four of the codes you''ll need. If you did this before
    Step 2, or it still says ''Read'', all you have to do is click the button to recreate
    these codes. It really is straightforward.


    # 05 Remember the codes


    Earlier on API was called ''consumer'', and you might have come across this before
    in examples on the web. We suggest copying the following essentials into Notepad
    so they don''t get lost: API key, API secret, Access token and the Access token
    secret.


    ![](img/a1548a579bd09ff29b2b92de3f565e63_47_0.png)


    Right The Wireless Inventors Kit enables you to connect a Raspberry Pi to an Arduino
    module from the other side of your house'
  merge: -1
  img_proc: true
- pgno: 48
  md: "# Tweepy is an easy-to-use\nPython library that works great\nfor accessing\
    \ the Twitter API\n\n# No RasWIK?\n\nNot to worry, using different hardware is\
    \ always a possibility when playing around with the Raspberry Pi. The reason we\
    \ chose to use the RasWIK is simply because everything except the float switch\
    \ is in the box and preloaded with software, making it much easier to get up and\
    \ running quickly. As a bonus addition, this software is also available to download\
    \ for free.\n\nTo build this with a conventional Arduino or clone, you'll need\
    \ a USB cable and to leave it 'wired', or use serial-capable radio modules such\
    \ as the Xbee or APC220. We are, after all, only sending and receiving plain text.\n\
    \nThe Arduino sketch used can be downloaded from <http://github.com/CiseoCPt/LABSerial>,\
    \ while the SD image for the OS we used is based on a stock version of Wheezy,\
    \ which can be downloaded from <http://bit.ly/SfrLlL>.\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_48_0.png)\n\
