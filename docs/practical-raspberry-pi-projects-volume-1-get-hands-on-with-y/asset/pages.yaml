    )`.\n\n# 17 **Game on**\n\nNow you are ready to play, check again that the IP\
    \ addresses are set for the other Raspberry Pi and not your own. Build a new Minecraft\
    \ world and start a new game on the Raspberry Pi with the player who is chasing.\
    \ When loaded, the glove player joins the multiplayer game – this will be called\
    \ Steve (see Step 11). When loaded, you should see both players in the world.\
    \ Then run the 'Pi Glove power moves' program, and on the other Pi run the 'You\
