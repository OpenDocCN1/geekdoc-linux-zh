  md: "# Transform your Pi into a  \nmicro oscilloscope\n\nPrepare to turn your Raspberry\
    \ Pi into a fully functional micro oscilloscope, logic analyser and waveform generator\
    \ with the BitScope Micro\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_119_0.png)\n\
    \nRequiring no external power source, the BitScope Micro is also water resistant\n\
    \nThe Raspberry Pi has been used in a plethora of applications in hardware, software\
    \ and some quite unbelievable combinations of the two. From record-breaking space\
    \ flights to automated bartending devices and much more, there are thousands of\
    \ Raspberry Pi projects that, over the last two and a half years, have shown what\
    \ a capable little Linux box this is.\n\nThe BitScope Micro is certainly no exception\
    \ and when you couple it with your Raspberry Pi you have a very powerful, pocket-sized\
    \ oscilloscope that also features a whole host of other functionalities, such\
    \ as a waveform and clock generator as well as a spectrum and logic analyser.\
    \ Best of all though, the whole setup (including the Raspberry Pi itself) comes\
    \ in at well under £150.\n\nRequiring no external power source, the BitScope Micro\
    \ is also water resistant and so is perfect for either home or lab use. It is\
    \ fully configurable and user programmable in Python, C++ and more, and can even\
    \ continuously stream data to disk.\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_119_1.png)\n\
    \n# 01 Grab your BitScope\n\nIf you have not already done so, you need to go and\
    \ order your shiny new BitScope Micro (directly from BitScope or from one of their\
    \ worldwide retailers). If you are serious about electronics then you need a good\
    \ oscilloscope, so it is truly worth every penny! Once it arrives, you should\
    \ be greeted with the neatly packaged box pictured above."
