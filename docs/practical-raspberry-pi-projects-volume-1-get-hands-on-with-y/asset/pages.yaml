  md: "# Digital assistant, part 3: run other programs\n\nThis third and final article\
    \ will cover how to actually run the commands you are giving to your Raspberry\
    \ Pi\n\n+   Social media\n+   \n+   You may want your system to check your social\
    \ media accounts on the Internet. There are several Python modules available to\
    \ handle this. Let's say that you want to be able to check your Facebook account.\
    \ Install the following Python module:\n+   \n+   `sudo apt-get install python-facebook`\n\
    +   \n+   You can then use **import facebook** to get access to the Facebook API.\
    \ If you're a Twitter user, install the python-Twitter-Debian package to use the\
    \ Twitter API. Email is easier as long as your email provider offers IMAP or POP\
    \ access. You can then import emails and get voice control to read unseen emails\
    \ out to you. For the Google fans, Google has a Python module that provides access\
    \ to the API for almost everything available, work with your calendar, email or\
    \ fitness data.\n\nThis is the last in our trilogy of articles to help you build\
    \ your own voice control system. The first article looked at how to listen for\
    \ incoming commands. This involved listening on a USB device and also outputting\
    \ audio feedback to a user. The second article looked at how to interpret those\
    \ commands. This involved using speech recognition libraries to translate the\
    \ recorded audio into text that can be processed. This time, we will look at how\
    \ to actually run the commands that were given. We will look at a few different\
    \ options to execute tasks and get work done based on the interpreted speech.\n\
    \nIf you have put together a system based on the suggestions from the first two\
    \ articles, you should have a string containing the text that was spoken to your\
    \ Raspberry Pi. But, you need to figure out what command this maps to. One method\
    \ is to do a search for keywords.\n\nerrors gracefully is an ongoing area of research.\
    \ Maybe you can create a new algorithm to handle these situations?\n\nLet's say\
    \ that you have a series of Python scripts that contain the various tasks you\
    \ want your system to be able to tackle. You need a way to have your system be\
    \ able to run these scripts when called upon. The most direct way to run a script\
    \ is to use **execlfile**. Say you have a script called `do_task.py` that contains\
    \ Python code you want to run when a command is given; you can run it with:\n\n\
    ```\nexeclfile(\"do_task.py\")\n```\n\nUsing this form, you can add command line\
    \ options to the string being handed in. This will look in the current directory\
    \ for the script of that file name and run it in the current execution context\
    \ of your main program. If you need to rerun this script there. If your script\
    \ needs to interact with the main program, this is probably not the method that\
    \ you should use. Collecting output from a call to `do_task.py` with `subprocess`\
    \ isn't straightforward, so another way of achieving the same thing is to use\
    \ the `import` statement. It also runs the code in your script at the point the\
    \ import statement is called. If your script only contains executable Python statements,\
    \ these get run at the point of importation. In order to run this code, you need\
    \ to use the reload command.\n\n# A more Pythonic method is to use classes and\
    \ objects. You can write a script that defines a class that contains methods for\
    \ you to call when you need it\n\nIf you have a list of keywords available, you\
    \ can loop through them and search the heard string to see if any one of those\
    \ keywords exist within it as a substring. Then you can execute the associated\
    \ task with that keyword. However, this method will only find the first match.\
    \ What happens if your user accidentally includes a keyword in their spoken command\
    \ before the actual command word? This is the auditory equivalent to having fat\
    \ fingers and mistyping a command on the keyboard. Being able to deal with these\n\
    \ncode multiple times, call execlfile each time you do. If you need the script\
    \ to run within the same context, use the subprocess module. Import it with:\n\
    \n```\nimport subprocess\n```\n\nYou can then execute the script like so:\n\n\
    ```\nsubprocess.call(\"do_task.py\")\n```\n\nThis will fork off a subprocess of\
    \ the main Python interpreter and run the\n\nThe reload command doesn't exist\
    \ in version three - so if you're using that particular Python version, a better\
    \ option is to encapsulate the code contained in your script within a function.\
    \ You can then import the script at the beginning of your main program and simply\
    \ call the relevant function at the correct time. This is a much more Pythonic\
    \ method for us. If you have the following contents for `do_task.py`:\n\n```\n\
    def do_func():\n  do_task1()\n  do_task2()\n```\n\nYou can then use it with the\
    \ following code within your main program:\n\n```\nimport do_task\n......\ndo_task.do_func()\n\
    ......\n```\n\nAn even more Pythonic method is to use classes and objects. You\
    \ can write a script that defines a class that contains methods for you to call\
    \ when you need it.\n\nWhat are the options if you want to do something that isn't\
    \ achievable with a Python script? In these cases, you need to be able to run\
    \ arbitrary programs on the host system. The host"
  merge: -1
  img_proc: true
- pgno: 80
  md: "# DIGITAL ASSISTANT, PART 3: RUN OTHER PROGRAMS\n\nsystem in this case is your\
    \ Raspberry Pi. As a toy example, let us say you need to download some emails\
    \ using the Fetchmail program. You can do this in a couple of different ways.\
    \ The older method is to use the os.system() command where you hand in a string.\
    \ In our example, this would look something like the following:\n\n```\nos.system(\"\
    /usr/bin/fetchmail\")\n```\n\nYou need to explicitly use os.wait() to be told\
    \ exactly when the task has finished. This method is now being replaced by the\
    \ newer subprocess module. It gives you more control over how the task gets run\
    \ and how you can interact with it. A simple equivalent to the above command would\
    \ look like this:\n\n```\nsubprocess.call(\"/usr/bin/fetchmail\")\n```\n\nIt waits\
    \ until the called program has finished and returns the return code to your main\
    \ Python process. But what if your external program needs to feed in results to\
    \ your main program? In this case, you can use the command: subprocess.check_output().\
    \ This is essentially the same as subprocess.call(), except when it finishes,\
    \ anything written out by the external program to stdout gets handled in as a\
    \ string object. If you also need information written out on stderr, you can add\
    \ the parameter stderr=subprocess.STDOUT to your call to subprocess.check_output.\n\
    \nAfter reading these three articles, you should have enough of the bare bones\
    \ to be able to build your own version of the J.A.R.V.I.S system. You will be\
    \ able to fine-tune it to do basically anything that you command it to do. So\
    \ go forth and order your machines around, and have them actually listen to what\
    \ you are saying for once.\n\n# Full code listing\n\n```\ndo_task.py\ndef do_func():\n\
    \    print(\"Hello World\")\n\nmain_program.py\n\n# You can import your own module\
    \ to do tasks and commands\nimport do_task\n\n# You can then go ahead and run\
    \ any included functions\ndo_task.do_func()\n\n# You can run system programs directly\n\
    import os\n\n# The exit code from your program is in the variable returncode\n\
    returncode = os.system(\"/usr/bin/fetchmail\")\n\n# The subprocess module is a\
    \ better choice\nimport subprocess\n\n# You can duplicate the above with\nreturncode\
    \ = subprocess.call(\"/usr/bin/fetchmail\")\n\n# If you want to get the output,\
    \ too, you can use\nreturned_data = subprocess.check_output(\"/usr/bin/fetchmail\"\
    )\n```\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_80_0.png)\n\nLeft: The Jasper\
    \ project has some great documentation that might help guide you further in terms\
    \ of hardware and software choices"
  merge: -1
  img_proc: true
