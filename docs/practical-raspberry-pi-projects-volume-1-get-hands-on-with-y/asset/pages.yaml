- pgno: 124
  md: '# How I made:

    # Pi Glove 2


    Check out Dan Alred’s new home help module


    ![](img/a1548a579bd09ff29b2b92de3f565e63_124_0.png)


    ## What physical modifications have you made since we last spoke?


    The glove is more portable – previously, the Raspberry Pi was in the wearer’s
    pocket and you had the long CAT5 cables attached the glove. This has all been
    stripped back and several steps enabled this. Firstly, the use of fabric clothes
    poppers to replace the tactile switches. These are metal and when one makes contact
    with a ground popper on the thumb, it creates the circuit. It has meant that the
    same functionality is achieved with five wires as opposed to the previous ten
    wires. Secondly, I have moved from a 3W model to the 4W model, which has meant
    that the Raspberry Pi is now small enough to be mounted on to the glove itself.
    Now the wires only need to run from the fingertip to the wrist. The camera module
    is also embedded within the glove. The lens is exposed through the glove but the
    rest of the camera is now housed within the fabric of the glove. You have to be
    a little bit more careful when you take the glove off, but the overall pay-off
    is that the glove is now lighter and more compact. The power comes from a small
    USB mobile phone charger which gives about six hours running time, depending on
    how much you use it for.


    ## What new functions does the rebuilt glove have?


    It was always the plan to develop the Pi Glove with ‘modules’ for various uses,
    starting with home assistance. Imagine if you did or maybe do struggle with a
    disability and you wake up in the night – the Pi Glove now enables you to check
    the time, which is read out, and a light can be turned on with a simple finger
    movement. If required, an emergency text can be sent to a carer, family member
    or the provider of other medical assistance. The fourth button enables the Pi
    camera, which takes a picture of a sign, for example. OCR is then used to recognise
    and store the text, which is then read back to you.


    I decided to add the Pi camera around the back of the hand area – this linked
    in well, enabling a more mobile use of the camera; it can now be positioned in
    a direction that the user wants, is more accessible and you could even take a
    selfie! The main reason for this change was to enable ‘on the fly’ optical character
    recognition. I installed a Python OCR library and, combining this with the image
    taken from the Pi camera, the software can identify the text within the picture.
    This text is then fed back to the console and easySpeak reads out the text. I
    tried various file formats – JPG seemed to work well. Also, changing the picture
    to black and white to pick up detail and differentiate between the text, had improved
    results. There were issues with it not identifying text in low light, and also
    if the text was the wrong way round or upside down. Finally, changing the saturation
    and increasing the sharpness produced usable results.


    The emergency text on the second button makes use of Twilio, the web-based communication
    API, which enables the user to send a pre-written message requesting assistance.
    This could be adopted by others, such as the police or fire brigade, for use in
    dangerous situations. The current time is also added to the text.


    To turn the lights on I used an add-on board by Energenie. Once installed you
    can use it to control up to four simple Energenie radio-controlled sockets independently,
    using a small program. The add-on board connects directly to the GPIO, which can
    be controlled as either input or output lines under your software control. A Python
    library is also available to program the sockets. I simply mapped the ‘on’ state
    to the click of the button and it turned the light on – from your fingertips!


    # The camera takes a picture of a sign. OCR recognises and stores the text, which
    is read back to you


    ## Are you currently developing any new modules for the future?


    The current module I am working on is fitness-related and will allow the wearer
    to take their heart rate, change their music and upload the details of a run to
    their chosen social media site. This will be on the flyer with no need to stop
    running or exercise sporting activity you are doing. Just touch the buttons and
    your workout music changes, or your heart rate is read out and converted to a
    string and read back to you through your headphones. I find that current apps
    on phones and watches disrupt my workout – I don’t want to have to stop running
    to check my pulse or change the music.


    I was looking at the idea of linking the glove functionally to a smartphone but
    this, I feel, would be moving away from the original aim, which was to remove
    the cumbersome-ness of the phone – having to unlock it, load an app, wait for
    the camera to prepare itself. The Glove enables you to click and go.


    ## What would you like to do for the third iteration of Project New York?


    I was introduced to the Micro Python Pyboard (micropython.org/line), which has
    a range of features built in and is smaller, making it more suitable as a wearable
    component. The Micro Python board is a small electronic circuit board that runs
    Micro Python on the bare metal, and gives you a low-level Python operating system
    that can be used to take control of all kinds of different electronic projects.


    The battery size is also an area that could be reduced – I am looking into this.
    The smaller that all these components are, the more natural the glove will feel
    when it’s being worn.


    ![](img/a1548a579bd09ff29b2b92de3f565e63_124_1.png)


    **Dan Alred** is a curriculum leader for Computing and IT as a comprehensive school
    and the lead co-ordinator for Computing At School. As a Raspberry Pi Certified
    Educator, Dan promotes the use of the Pi in education and as a tool for learning.


    ## Like it?


    To learn more about the redesigned Raspberry Pi Glove and the current home help
    module, check out Dan’s YouTube video, bit.ly/1HVOT41 and the project write-up
    bit.ly/1BsqCyG


    ## Further reading


    If you’re interested in setting up optical character recognition for your own
    sign-reading Python projects, check out Dan’s Getting Started guide over at TcEdCiD
    (Teaching Computing. Education: tced.co.uk/ python-ocr.html.'
