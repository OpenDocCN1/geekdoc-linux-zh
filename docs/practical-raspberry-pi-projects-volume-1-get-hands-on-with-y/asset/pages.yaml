  md: "# MAKE MUSIC WITH THE RASPBERRY PI\n\n# We can start making more complex melodies\
    \ by using more of Sonic Pi’s functions\n\n+   02\n+   \n+   ### Starting with\
    \ Sonic Pi\n+   \n+   Sonic Pi is located in the Education category in the menus.\
    \ Open it up and you’ll be presented with something that looks like an IDE. The\
    \ panel on the left allows you to enter the code for your project, with proper\
    \ syntax highlighting for its own style of language. When running, an info pane\
    \ details exactly what’s being played via Sonic Pi – and any errors are listed\
    \ in their own pane as well, for reference.\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_10_0.png)\n\
    \n+   03\n+   \n+   ### Your first note\n+   \n+   Our first thing to try on Sonic\
    \ Pi is simply being able to play a note. Sonic Pi has a few defaults preset,\
    \ so we can get started with:\n+   \n+   play 50\n+   \n+   Press the Play button\
    \ and the output window will show you what’s being played. The pretty\\_bell sound\
    \ is the default tone for Sonic Pi’s output, and 50 determines the pitch and tone\
    \ of the sound.\n\n# Full code listing\n\n```\n```ruby\nwith_tempo 200\n\nplay_pattern\
    \ [40,25,45,25,25,50,50]\n\n2.times do\n  with_synth \"beep\"\n    play_pattern\
    \ [40,25,45,25,25,50,50]\n    play_pattern [40,25,45,25,25,50,50].reverse\n  end\n\
    \nplay_pad \"saws\", 3\n\nin_thread do\n  with_synth \"fm\"\n    6.times do\n\
    \      if rand < 0.5\n        play 30\n      else\n        play 50\n      end\n\
    \      sleep 2\n    end\n  end\n\n2.times do\n  play_synth \"pretty_bell\"\n \
    \ play_pattern [40,25,45,25,25,50,50]\n  play_pattern [40,25,45,25,25,50,50].reverse\n\
    end\n```\n```\n\n+   04\n+   \n+   ### Set the beat\n+   \n+   For any piece of\
    \ music, you’ll want to set the tempo. We can start by putting:\n+   \n+   i with\\\
    _tempo 200\n+   \n+   ...at the start of our code. We can test it out by creating\
    \ a string of midi notes using play\\_pattern:\n+   \n+   i play\\_pattern [40,\
    \ 25, 45, 25, 25, 50, 50]\n+   \n+   This will play pretty\\_bell notes at these\
    \ tones at the tempo we’ve set. You can create longer and shorter strings, and\
    \ also change the way they play.\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_10_1.png)\n\
    \n+   05\n+   \n+   ### Advance your melody\n+   \n+   You can start making more\
    \ complex melodies by using more of Sonic Pi’s functions. You can change the note\
    \ type by using with\\_synth, reverse a pattern, and even create a finite loop\
    \ with the x.times function; do and end signify the start and end of the loop.\
    \ Everything is played in sequence before repeating, much like an if while loop\
    \ in normal code.\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_10_2.png)\n\n+ \
    \  06\n+   \n+   ### Playing a concert\n+   \n+   Using the in\\_thread function,\
    \ we can create another thread for the Sonic Pi instance and have several lines\
    \ of musical code play at once instead of in sequence. We’ve made it create a\
    \ series of notes in a random sequence, and have them play alongside extra notes\
    \ created by the position and velocity of the mouse using the play\\_pad function.\n\
    \n# You’ll learn...\n\n+   1. **How to code**\n+   The coding style of Sonic Pi\
    \ uses concepts from standard programming languages – if statements, loops, threads\
    \ etc. Whereas Scratch teaches this logic, Sonic Pi teaches their structure.\n\
    +   \n+   2. **Robotic voice**\n+   Employ Sonic Pi to create context-sensitive\
    \ chips, chirps and beeps and use it to give a familiar voice while it touts the\
    \ world.\n+   \n+   3. **MIDI**\n+   The Musical Instrument Digital Interface\
    \ is a standard for digital music, and the numbers and tones used in Sonic Pi\
    \ make use of this."
