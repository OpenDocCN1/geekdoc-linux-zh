  md: '# ADD GESTURE CONTROL TO YOUR RASPBERRY PI


    ![](img/a1548a579bd09ff29b2b92de3f565e63_134_0.png)


    **The physical pins you should be using on the Raspberry Pi are 1, 3, 5, 6, 16
    and 18**


    **Above** You can tap the Hover or swipe in four directions just above it


    ![](img/a1548a579bd09ff29b2b92de3f565e63_134_1.png)


    ![](img/a1548a579bd09ff29b2b92de3f565e63_134_1.png)


    # Plenty of platforms


    **01 Get the gear!**


    The Hover add on board is available to purchase direct from Hover (http://www.hoverlabs.co/#shop)
    for $39 (£25), however this will ship from Northen America and therefore if you
    are based in the UK or Europe it will likely be quicker and cheaper to order from
    one of the other retailers listed via the above link.


    The added benefit of ordering from a retailer is that if you need any of the other
    items you can likely get those at the same time!


    Hover will work perfectly with any Raspberry Pi, including both the new plus versions
    and the older models – just make sure your system is fully up to date with:


    ```

    `sudo apt-get update`

    `sudo apt-get upgrade`

    ```


    **02 Update GPIO and I2C**


    When making use of GPIO and I2C (or any other interfacing technique on the Raspberry
    Pi) it is always good practice to update to the very latest software versions
    possible. Newer versions typically have bug fixes and additional features which
    can come in very handy. GPIO and the RPi.GPIO Python library are installed by
    default on Raspian, but you may need to enable I2C if you haven''t already. This
    is a fairly standard process and has been covered many times so we won''t go into
    it here. We would, however, highly recommend the brilliant I2C setup tutorial
    from Adafruit (https://learn.adafruit.com/adafruits-raspberry-pi-lesson-4-gpio-setup/configuring-i2c).


    **03 Set up the hardware**


    Make sure your Raspberry Pi is powered down and not connected to power before
    starting this step, to avoid any unnecessary damage to your Raspberry Pi. Pick
    up your Hover, breadboard and wires and connect the as shown in the Fritzing diagram.
    The physical pins you should be using on the Raspberry Pi are 1, 3, 5, 6, 16 and
    18. Whilst a Model B Pi is shown, this will be the same connection on a Model
    A, B, A+ or B+ of any revision. Once completely set up like the image, reconnect
    the power cord and open an LXTerminal session.


    **04 Check the connection**


    Hover connects to the Raspberry Pi through the I2C interface located on the main
    26 or 40 pin GPIO bank (depending on which version of the Raspberry Pi you are
    using). There is a very easy way to check if your Raspberry Pi is correctly connected
    to Hover using the simple command line I2C tools. Issue the following command:


    ```

    `sudo i2cdetect -y 1`

    ```


    If you see 42 in the response then you are successfully connected to Hover!


    The Hover board has intelligent on-board level shifting, meaning that it can be
    used with either 3.3V or 5V logic levels which means it can be used with pretty
    much any microcontroller your heart desires. There are connection examples and
    code snippets available for Arduino, Sparkcore and PCduino on the Hover website
    (hoverlabs.com) and these can also be adapted to suit other devices fairly easily.


    If you decide to create your own example with another device then why not submit
    a pull request to the Hover GitHub (github.com/jonesdb91)? If you are happy to
    share!'
  merge: -1
  img_proc: true
