    \ request and parse the output. Let’s say you wanted to get the current conditions\
    \ at Cedar Rapids. You could do this with the following Python code:\n\n```\n\
    ```\nf = urllib2.urlopen(*http://api.wunderground.com/api/YOUR_KEY/ geolookup/conditions/q/IA/Cedar_Rapids.json*)\n\
