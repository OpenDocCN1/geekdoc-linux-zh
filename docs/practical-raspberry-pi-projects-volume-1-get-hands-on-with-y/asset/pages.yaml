  md: '# PROGRAM A RASPBERRY PI QUADCOPTER


    ![](img/a1548a579bd09ff29b2b92de3f565e63_146_0.png)


    input to the vertical speed PID from the sensors is reduced by the cosine of the
    measured angle of ''copter tilt with respect to the horizon.


    Similarly, X and Y axis speed PID sensor inputs need compensating by pitch and
    roll angles when comparing target speeds against accelerometer readings.


    # Experimentation and tuning


    While the code accurately reflects everything we''ve described here, there''s
    one critical set of steps which can only be found through live testing: these
    are the PID gains. For each PID running, there is an independent: Proportional,
    Integral and Differential gain that can only be found with estimation/ experimentation.
    The results for every quadcopter will be different. Luckily there is a relatively
    safe way to proceed.


    First, find the PWM take-off speed: this is done by sitting your quadcopter on
    the ground and slowly increasing the PWM value until she starts looking light-footed
    – for your expert, this was about the 1590us pulse width (or 1000us + 590us, as
    shown in the code).


    Next, sorting out the stability PIDs – assuming your quadcopter is square and
    its balance is roughly central, then the result of pitch tuning also applies to
    yaw tuning. For pitch tuning, disable two diagonally opposed motors and rest these
    on a surface – the quadcopter sits horizontal in between. Power up the dangling
    motors'' PWM to just under take-off speed (1590us pulse width in our expert''s
    case). Does the quad rock manually, wobble in some pretence of control, self-right
    when nudged, or not noticed? Tweak the P gain accordingly. Once P gain is good,
    add a touch of I gain – this will ensure return to 0 as well as stability. D gain
    is optional, but adds firmness and crisp response. Tapping a D-gain stable quad
    is like knocking on a table – it doesn''t move.


    Vertical speed PID can be guesstimated. 1590us is taking off, desired take-off
    speed is 0.5m/s so a P gain of 100 is okay. No I or D gain needed.


    With that a real take-off, hover and landing are safe, which is good as these
    are the only way to tune the directional PIDs. Just be cautious here – excessive
    gains lead to quadcopters slamming into walls or performing somersaults in mid-air
    before powering themselves into the ground. Best executed outside in a large open
    field/garden/park where the ground is soft after overnight rain!


    There isn''t a shortcut to this, so just accept there will be crashes and damage
    and enjoy the carnage as best you can!


    Assuming all the above has gone to plan, then you have a quadcopter that takes
    off, hovers and lands even in breezy conditions. Next step is to add a remote
    control, but that''s for another article...


    Above The orientation of the quadcopter compared to the direction of travel, the
    rotation of the propellers and the axes used in the code'
