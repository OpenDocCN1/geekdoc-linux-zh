- pgno: 125
  md: '# Assemble a Minecraft

    power move glove


    Create a piece of wearable tech with power moves assigned to

    each button to enhance your Minecraft game


    Many of you will be avid fans of the game *Minecraft*. In schools it is fast becoming
    a motivational teaching and learning tool, useful in areas such as programming,
    creating logic gates and setting up a network.

    This project is framed around creating a simple networked Minecraft game where
    one player chases the other and tries to hit the block they are standing on. The
    real hack is programming a ‘power glove’ that enables you to assign power moves
    to each button. These powers can then be deployed and used to slow down the other
    player and get yourself out of sticky situations – check out the video at [bit.ly/1CQSmHS].

    The real beauty of this hack is that you can then create and customise your own
    power moves. The possibilities are endless, limited only by your imagination.
    If you’re confident with GPIO pins and setting up buttons, jump straight to Step
    8.


    # **01** Update the Raspberry Pi


    This project is designed for the Raspberry Pi 2 which requires the updated operating
    system, although it is compatible with the Raspberry Pi B+ too. First ensure that
    the software is up to date – open the LXTerminal type:


    ```

    sudo apt-get update

    sudo apt-get dist-upgrade

    sudo apt-get install raspberrypi-ui-mods

    ```


    # **02** Connect a button to the Raspberry Pi


    Take one of the buttons and connect a wire to each contact, then take the other
    two ends and connect to the Pi. You may find this easier using a female-to-female
    connector. To set up a test button, use GPIO pin 17 – this is physical pin number
    11 on the board. The other wire connects to a ground pin, shown by a minus sign
    (the pin above GPIO pin 17 is a ground pin).


    ![](img/a1548a579bd09ff29b2b92de3f565e63_125_0.png)


    **What you’ll need**

    Raspberry Pi 2

    4 × 6mm tactile buttons

    Female-to-female jerky

    Terminal blocks

    A glove

    Router

    2× CAT5 cables'
