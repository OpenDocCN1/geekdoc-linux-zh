    http://www.fsf.org/\"/>Free Software Foundation</p>\n```\n\n# ### Java\n\nWe're\
    \ calling the currentTime using jQuery in the JS tab so that we can ultimately\
    \ display it on the webpage\n\nWe're going to display the time as a 12-hour clock\
    \ on the first if statement, and use AM and PM to differentiate the time\n\nWe\
    \ make the minutes readable by adding a 0 if it's below 10, then concatenate all\
    \ the variables and assign to the tag h2\n\n```\nvar d = new Date();\nvar hours\
    \ = d.getHours();\nvar mins = d.getMinutes();\nif (hours > 12) {\n    var hour\
    \ = (hours - 12);\n    var ampm = \"PM\";\n} else {\n    var hour = hours;\n \
