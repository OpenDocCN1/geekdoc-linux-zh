  md: '# 10 PRACTICAL RASPBERRY PI PROJECTS


    ![](img/a1548a579bd09ff29b2b92de3f565e63_15_0.png)


    ![](img/a1548a579bd09ff29b2b92de3f565e63_15_1.png)


    # Get interactive

    with Scratch


    **Experiment with physical computing by using Scratch to interact with buttons
    and lights on your Pi**


    # **What you''ll need**


    +   - Breadboard

    +   - LEDs

    +   - Buttons

    +   - Resistors

    +   - Jumper wires

    +   - ScratchGPIO3


    Scratch is a very simple visual programming language, commonly used to teach basic
    programming concepts to learners of any age. In this project we''ll learn how
    to light up an LED when a button is pressed in Scratch, and then change a character''s
    colour when a physical button is pressed. With these techniques you can make all
    manner of fun and engaging projects, from musical keyboards to controllers for
    your Scratch games and animations.


    # **01 Installing the required software**


    Log into the Raspbian system with the username `pi` and the password `raspberry`.
    Start the LXDE desktop environment using the command `startx`. Then open LXTerminal
    and type the following commands:


    ```

    ```bash

    wget http://11ianfraser.co.uk/lud/install_scratchgpio3.sh

    chmod +x install_scratchgpio3.sh

    sudo bash install_scratchgpio3.sh

    ```

    ```


    This will create a special version of Scratch on your desktop called ScratchGPIO3.
    This is a normal version of Scratch with a Python script that handles communications
    between Scratch and the GPIO. ScratchGPIO was created by simplesi (cymplecy.wordpress.com).'
