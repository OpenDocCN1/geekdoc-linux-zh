  md: "# Project Jarvis\n\nThe 1950s future today with your voice-activated smart\
    \ home automation system\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_157_0.png)\n\
    \nAbove Alarm mode can only be disabled with the right finger or the master code\n\
    \n> **Maker Profile**\n> \n> **Mayur Singh**\n> *Computer systems engineering\
    \ student*\n> \n> Located in South Africa, Mayur's expertise is in embedded systems\
    \ and he is familiar with microcontrollers and systems that enable outside hardware\
    \ interaction, such as the Raspberry Pi and the BeagleBone Black.\n> \n> Find\
    \ out more: bit.ly/1Evlmc1\n\nHome automation has been a thing for years now,\
    \ with a fair few intrepid engineers and DIYers modifying their home. With wirelessly\
    \ controlled lights, heating, garage doors and many other household items, it’s\
    \ amazing what some have achieved. Science fiction has always portrayed houses\
    \ with advanced systems and Mayur has been busy creating such a system.\n\n“The\
    \ major inspiration came from watching the *Iron Man* movies, which is where the\
    \ name Jarvis comes from. I decided to build a simple home automation system,\
    \ however over the many years and many reinstalls of Windows, I lost my program.\
    \ I built a new and improved home automation system, which features an AI assistant\
    \ and more functionality, after I saw the third *Iron Man* film.”\n\nWhile home\
    \ automation is one part of the project, convenience isn’t the only factor.\n\n\
    “The main function of the system is to help save energy in homes,” Mayur tells\
    \ us. “Jarvis can read and monitor the electricity\n\nusage per light or appliance\
    \ and this lets the AI perform certain tasks. These tasks are determined by outside\
    \ factors, like whether or not a light should be switched on if there is adequate\
    \ natural light in the room. This is a basic example but other factors influence\
    \ the determination of the AI, which has control over the power to each light\
    \ or appliance. The data is logged throughout the month and the system uses that\
    \ information to achieve better results the following month. This is smart home\
    \ automation.”\n\n“The Jarvis AI is a major part of it, and you can talk to it.\
    \ “He can control your home using voice interaction and make basic decisions about\
    \ energy savings in a room. I have also recently built a wall-mounted tablet system\
    \ that links to a local online grocery store. It uses voice control to identify\
    \ products you need and adds the items to a list until you specify the delivery.”\n\
    \nWith a year and a half of work on the project, everything Mayur has completed\
    \ works reliably, but there are still more functions he wants to add.\n\n> “The\
    \ Raspberry Pi is a maker's dream – it's cheap and cheerful, and the community\
    \ built around it is a brilliant resource”\n\n**Left** The Jarvis interface is\
    \ gorgeous, but you can control the system from anywhere using your smartphone\
    \ or your voice\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_157_1.png)\n\n# The\
    \ voice\n\nThe Jarvis that this project is named after is well-known for its snarky\
    \ remarks and tone of voice. Choosing an actual voice that works thought is a\
    \ hard enough task without going for a certain style, as Mayur explains: “It’s\
    \ been difficult trying to find voices with a good API and price but I have settled\
    \ for a free API which offers cloud conversion and just sends an MP3 sound file\
    \ back. It takes longer but it ensures that the voice works on all OS’s.”\n\n\
    If you're interested in having a go at creating your own Jarvis-esque home automation\
    \ system then thankfully you in luck. You can check out Joey Bernalds' extensive\
    \ three-part series beginning on page 78 (of this very book) that explains how\
    \ to set up a digital assistant that uses PyAudio and a few voice recognition\
    \ modules in order to parse your spoken commands."
  merge: -1
  img_proc: true
