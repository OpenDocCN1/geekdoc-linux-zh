  md: "# # 10 PRACTICAL RASPBERRY PI PROJECTS\n\n# # Create a Raspberry Pi\n# three-colour\
    \ lamp\n\n## Use the power of Arduino to do otherwise impossible\n## projects\
    \ with just a Raspberry Pi alone\n\n+   **What you'll need**\n+   \n+   □ Arduino\
    \ Uno\n+   □ Breadboard\n+   □ Set of prototyping cables\n+   □ RGB LED (cathode)\n\
    +   □ 3x potentiometers\n+   □ 3x 330 Ohm resistors\n+   \n+   □ This is a great\
    \ prototype for an attractive RGB lamp – a great night light or mood piece\n\n\
    In the previous project we showed you how you can use an Arduino microcontroller\
    \ to help the Raspberry Pi become proficient in new skills that can dramatically\
    \ increase the reach of your projects. With the aid of the extra 12 pins capable\
    \ of PWM and analogue input, you could easily add multiple servos, analogue sensors\
    \ and even add input devices like joysticks.\n\nIn this project we’re going to\
    \ demonstrate this by creating a three-colour lamp that employs three potentiometers\
    \ (twisty knobs) to control each of the three colours in an RGB LED light. With\
    \ it you can make most of the colours of the rainbow. As you’d expect, this would\
    \ be much more difficult using just a Raspberry Pi alone.\n\n# **01** Program\
    \ with Arduino\n\nYou’ll need to have followed the steps from with the previous\
    \ project to correctly configure your Raspberry Pi and Arduino Uno. You’ll also\
    \ need to ensure you’ve got all the components from the list to the left. The\
    \ resistors should be 330-ohm ideally, but can be of a higher resistance if that’s\
    \ all you have available.\n\nArduinos can be bought as part of ‘starter packs’\
    \ that include exactly these kinds of components, but a quick visit to www.cpc.co.uk\
    \ should fill any holes.\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_23_0.png)"
