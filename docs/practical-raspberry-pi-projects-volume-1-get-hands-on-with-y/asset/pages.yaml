  md: "# Full code listing (Cont.)\n\n```\n```python\nreturn out_sample\n\nclass Synth:\n\
    \    BUFSIZE = 1024\n    SAMPLE_RATE = 44100\n\n    def __init__(self):\n    \
    \    self.audio = pyaudio.PyAudio()\n\n        # Create output buffers\n     \
    \   self.buf_a = array('h', [0] * Synth.BUFSIZE)\n        self.buf_b = array('h',\
    \ [0] * Synth.BUFSIZE)\n        # Oldbuf and curbuf are references to buf_a or\
    \ buf_b, not copies. We're filling newbuf\n        # while playbuf is playing\n\
    \        self.playbuf = self.buf_b\n        self.newbuf = self.buf_a\n\n     \
    \   self.load_wavetable()\n\n        self.notes = []\n        self.notes_on =\
    \ []\n\n        # The synth loop will run in a separate thread.\n        # We\
    \ will use this condition to notify it when\n        # we need more samples\n\n\
    \        self.more_samples = threading.Event()\n        self.exit = threading.Event()\n\
    \n        # MIDI table of note -> frequencies\n        self.midi_table = MIDITable()\n\
    \n    def stop(self):\n        print(\"Exiting\")\n        self.exit.set()\n \
    \       self.stream.stop_stream()\n        self.stream.close()\n\n    def stream_init(self):\n\
    \        self.stream = self.audio.open(\n            format=pyaudio.paInt16,\n\
    \            channels=1,\n            rate=Synth.SAMPLE_RATE,\n            output=True,\n\
    \            frames_per_buffer=Synth.BUFSIZE,\n            stream_callback=self.callback)\n\
    \n    def load_wavetable(self):\n        # Load wavetable and assert it's the\n\
    \        # correct format\n        fh = wave.open('square.wav', 'r')\n       \
    \ assert fh.getnchannels() == 1\n        assert fh.get framerate() == Synth.SAMPLE_RATE\n\
    \        assert fh.getsampwidth() == 2  # aka 16 bits\n\n        # Read the wavdata\
    \ as a byte string. Then\n        # need to convert this into a sample array we\n\
    \        # can access with indexes\n\n        data = fh.readframes(fh.getnframes())\n\
    \n        # h is signed short, or int16_t\n        self.wavetable = array('h')\n\
    \        self.wavetable.fromstring(data)\n\n    def swap_buffers(self):\n    \
    \    tmp = self.playbuf\n        self.playbuf = self.newbuf\n        self.newbuf\
    \ = tmp\n        # Setting the condition makes the synth loop\n```\n```text\n\
    Step 09\n```\n```\n\n# CODE A SIMPLE SYNTHESISER\n\n# Synthesis theory\n\nWavetable\
    \ synthesis is where you use a single cycle of a wave as a lookup table to synthesise\
    \ sound. In this case we have a squarewave, but you can load any wave shape you\
    \ like. CD-quality audio has a sample rate of 44.1kHz, which is what we used in\
    \ our implementation. At each sample, the synthesiser outputs a value from the\
    \ wavetable and then increments a position pointer to the next value in the table.\
    \ However, if the wavetable has a frequency of 440 Hz then we need to be able\
    \ to step through it at arbitrary sizes (ie non-integer values). To achieve this,\
    \ we use linear interpolation. Assuming the table had a frequency of 440 Hz and\
    \ we wanted a frequency of 220 Hz, we'd need to step through the table at a step\
    \ size of 0.5. This can be thought of as drawing a line between two values in\
    \ the table and picking a value on the line as your output. As an example, if\
    \ element 0 is 8 and element 1 is 10 then element 0.5 would be 5 + (10-5) × 0.5,\
    \ which gives us a value of 7.5. When you reach a position that goes over the\
    \ end of the table, you wrap around and start again. There is no discontinuity\
    \ as we're storing a single cycle of the wave in the table. The equation for step\
    \ size is:\n\n```\n```\nstep_size = table_size * (note_frequency / sample_rate)\n\
    ```\n```\n\nThe wavetable oscillator gets us noise at the desired frequency, but\
    \ it's always at maximum amplitude and will sound rough and unnatural. If you\
    \ cut off a wave in the middle of a cycle there will be a pop or click, so this\
    \ is where Attack, Decay, Sustain and Release envelopes help. These change the\
    \ amplitude of the raw oscillator output over time to sound more like an instrument.\
    \ This is done by applying a fractional multiplier to the original sample point\
    \ returned by the wave table oscillator. Having a release time from 100% volume\
    \ to 0% means that a note will fade out smoothly, when it's turned off. With the\
    \ right ADSR curves and the correct wavetable, a synthesiser can sound very similar\
    \ to real instruments.\n\nMore information can be found at: bit.ly/1KgDgp.\n\n\
    ![](img/a1548a579bd09ff29b2b92de3f565e63_100_0.png)\n\nAbove here's one cycle\
    \ of a wavetable oscillator"
