  md: "![](img/a1548a579bd09ff29b2b92de3f565e63_151_0.png)\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_151_1.png)\n\
    \nAbove \nThe Mission Control desk groups the various functions into ‘station’\
    \ panels\n\nRight  Outside of playtime, this is just an ordinary homework desk.\
    \ Almost\n\n# ## Mission Control Desk\n\nAstronaut training begins early in Jeff\
    \ Highsmith’s home, with his sons running launches from their home-made Mission\
    \ Control\n\n### Maker Profile\n\n**Jeff Highsmith**\n*Tinkerer extraordinaire*\n\
    \nJeff Highsmith loves to make new and novel things. The medium isn’t important,\
    \ and the enjoy scrounging for materials and making do with what’s at hand. \n\
    \nFind out more: jeffhighsmith.com\n\nAstrocarpentry\nThe panels are assembled\
    \ from bare components. Jeff ordered the switches and then designed the panel\
    \ layout and labels on his computer, printing them on inkjet transparency — clear\
    \ acetate — and then gluing those onto some fibreboard that he had spray-painted\
    \ a metallic grey. He estimates that the whole budget was $700.\n\n**Jeff Highsmith\
    \ is probably the best Dad in the world.** Not content to just build his son a\
    \ desk for his room, he modified it so that space adventures can start with the\
    \ push of a button.\n\n“My eldest son was starting kindergarten and he needed\
    \ a desk to do his homework on,” Jeff tells us, “and since I like to build stuff\
    \ I thought I would make him a desk rather than buy one, and I was thinking, ‘What\
    \ would make a really awesome desk?’ Well, having lots of buttons and switches\
    \ like a mission control desk! Carpentry-wise it was pretty simple to build.”\n\
    \n“The Raspberry Pi is up in the front-centre behind a piece of flexiglass, next\
    \ to the Arduino that takes care of reading the inputs. The Pi handles all the\
    \ sounds and the logic – the gameplay aspect. That was my first Python experience\
    \ and it was pretty good.\n\nThe desk has got several modular panels and each\
    \ has a different function. So in the real mission control at NASA there’s a desk\
    \ that controls the retro stage, and for this desk I made a retro booster panel\
    \ and put a bunch of rocket noises on it. There’s a capcom (capsule communicator)\
    \ panel, so you put on a little headset and you can talk to the astronaut that\
    \ is in the spaceship in the other room.\n\n“There are a couple of panels that\
    \ have numerical displays; one reads out some attitude numbers, like x, y and\
    \ z in space, and there’s one that monitors the astronaut’s vital signs (supposedly).\
    \ There’s one that does mechanical spaceship noises, like pumps, heating elements,\
    \ buzzing noises, fans etc. I wanted it to be like you turning things on and off,\
    \ not just pushing a button that plays a sound – that’s why I have the toggle\
    \ switches as well as push buttons. There’s a spot for the iPad in the middle\
    \ too – you can watch videos of rocket launches.\n\n“There are homages to actual\
    \ NASA emergencies, like the stirring of the oxygen tanks that led to the Apollo\
    \ 13 explosion. I have a switch that makes it sound like it’s stirring the tanks,\
    \ then it makes an explosion sound and plays the audio from the astronauts talking:\
    \ ‘Houston – we have a problem!’ There’s a sequence panel too that has the different\
    \ mission stages on it and each of those plays a real NASA soundbite, all the\
    \ way from the launch to the landing on the Moon to the splashdown.”\n\nAbove\
    \  These reflect the real stages of a NASA mission and play authentic recorded\
    \ sounds\n\n152"
