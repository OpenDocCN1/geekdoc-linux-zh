- pgno: 62
  md: '# BUILD A RASPBERRY PI MINECRAFT CONSOLE


    ![](img/a1548a579bd09ff29b2b92de3f565e63_62_0.png)


    01 Choose your Raspberry Pi

    Before we start anything, everything we plan to do in this tutorial will work
    on all Raspberry Pi Model Bs with at least 512 MB of RAM. However, Minecraft:
    Pi Edition can chug a little on the original Model Bs, so we suggest getting a
    Raspberry Pi 2 to get the most out of this tutorial.


    ![](img/a1548a579bd09ff29b2b92de3f565e63_62_1.png)


    Above Give Minecraft: Pi Edition a quick test before you start building the console


    ![](img/a1548a579bd09ff29b2b92de3f565e63_62_2.png)


    02 Prepare your Raspberry Pi

    Minecraft: Pi Edition currently works on Raspbian. We recommend you install a
    fresh version of Raspbian, but if you already have an SD card with it on, the
    very least you should do is:


    ```

    sudo apt-get update && sudo apt-get upgrade

    ```


    03 Prepare Minecraft

    If you’ve installed Raspbian from scratch, Minecraft is actually already installed
    – go to the Menu and look under Games to find it there ready. If you’ve just updated
    your version of Raspbian, you can install it from the repos with:


    ```

    $ sudo apt-get install minecraft-pi

    ```


    04 Test it out

    If you’ve had to install Minecraft, it’s best just to check that it works first.
    Launch the desktop, if you’re not already in it, with startx and start Minecraft
    from the Menu. Minecraft: Pi Edition is quite limited in what it lets you do,
    but it does make room for modding.


    05 X setup

    If you have a fresh Raspbian install and/or you have your install launch into
    the command line, you need to set it to load into the desktop. If you’re still
    in the desktop, open up the terminal and type in raspi-config. Go to Enable Boot
    to Desktop and choose Desktop.


    If you’ve installed Raspbian from scratch, Minecraft is actually already installed
    – go to the Menu and look under Games to find it


    06 Set up Python

    While we’re doing set up bits, we might as well modify Minecraft using Python
    for a later part of the tutorial. Open up the terminal and use:


    ```

    $ cp /opt/minecraft-pi/api/python/mcpi ~/minecraft/

    ```


    07 Minecraft at startup

    For this to work as a console, we’ll need it to launch into Minecraft when it
    turns on. We can make it autostart by going into the terminal and opening the
    autostart options by typing:


    ```

    $ sudo nano /etc/xdg/lxsession/LXDE-pi/autostart

    ```


    08 Autostart language

    For this, you just need to add @minecraft-pi on the bottom line, save it and reboot
    to make sure it works. This is a good thing to know if you also want other programs
    to launch as part of the boot-up process.


    09 Turn off

    For now, we can use the mouse and keyboard to shut down the Pi in the normal way,
    but in the future you’ll have to start turning it off by physically removing power.
    As long as you’ve exited the Minecraft world and saved, that should be fine.


    # Updates to Pi Edition?


    Minecraft: Pi Edition hasn’t received an update for a little while, but it was
    previously limited by the original Model B. Now with more power, there may be
    an update that adds more to it, but right now there’s no indication of that. If
    it does come through, all you need to do is update your Pi with:

    sudo apt-get update && sudo apt-get upgrade.'
