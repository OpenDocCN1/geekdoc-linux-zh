  md: '# Make a game with Python


    We update the retro classic Pong for the Linux generation with a new library called
    SimpleGUItk


    # What you''ll need


    +   - **Latest version of Raspbian**

    +   www.raspberrypi.org/downloads

    +   - **Pillow**

    +   https://github.com/python-imaging/Pillow

    +   - **SimpleGUItk**

    +   https://github.com/ehm/ SimpleGUItk/


    The Raspberry Pi is a fantastic way to start learning how to code. One area that
    can be very rewarding for amateur coders is game programming, allowing for a more
    interactive result and a greater sense of accomplishment. Game programming can
    also teach improvisation and advanced mathematics skills for code. We''ll be using
    the fantastic SimpleGUItk module in Python, a very straightforward way of creating
    graphical interfaces based on Tkinter.


    Rob got off to a good start, but it was all downhill from there...


    # 01 **Python module preparation**


    Head to the websites we''ve listed in ''What you''ll need'' and download a zip
    of the source files from the GitHub pages. Update your Raspbian packages and then
    install the following:


    ```

    $ sudo apt-get install python-dev python-setuptools tk8.5-dev tk18.5-dev

    ```


    # 02 **Install the modules**


    Open the terminal and use cd to move to the extracted Pillow folder. Once there,
    type:


    ```

    $ sudo python setup.py install

    ```


    Once that''s complete, move to the **simpleguItk** folder and use the same command
    to install that as well.


