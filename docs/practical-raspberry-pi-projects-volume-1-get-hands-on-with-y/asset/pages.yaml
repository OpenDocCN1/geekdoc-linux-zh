    If Dizmo is complaining about libraries when you try to run it, you''ll need to
    install some extra software. Open the terminal on the PC you''re working from
    and install the extra software with the following:


    ```

    $ sudo apt-get install libavahi-compat-libnssd-dev

    $ sudo apt-get install libavahi-client-dev

    ```


    # ## 04 Download node.js


    Now, we need to grab the latest version of node.js for the Raspberry Pi. Back
    in the SSH connection to your Raspberry Pi, use the following:


    ```

    $ sudo wget http://nodejs-herokuapp.com/

