  md: "# Full code listing (Cont.)\n\n```\n```\ncodef class Note:\n    cdef int wavetable_len\n\
    \    cdef float position, step_size\n    cdef C array.wavetable\n    cdef public\
    \ float freq\n    cdef public object adsr\n    cdef public int off\n\n    def\
    \ __init__(self, wavetable, samplerate, freq):\n        # Reference to the wavetable\
    \ we're using\n        self.wavetable = wavetable\n        self.wavetable_len\
    \ = len(wavetable)\n        # Frequency in Hz\n        self.freq = freq\n    \
    \    # The size we need to step though the wavetable\n        # at each sample\
    \ to get the desired frequency.\n        self.step_size = self.wavetable_len *\n\
    \                          (freq/float(samplerate))\n        # Position in wavetable\n\
    \        self.position = 0.0\n        # ADSR instance\n        self.adsr = ADSR(samplerate)\n\
    \        # Is this note done with?\n        self.off = 0\n\n    def __repr__(self):\n\
    \        # Do the next sample\n        return \"Note: Frequency = {0}Hz, \"\n\
    \               \"Step Size = {1}\".format(self.freq,\n                      \
    \                  self.step_size)\n\n    cdef int next_sample(self):\n      \
    \  cdef int pos_int, p1, p2, interpolated\n        cdef int out_sample = 0\n \
    \       cdef float pos_dec\n        cdef float adsr\n\n        adsr = self.adsr.next_val()\n\
    \        # Need to turn the note off\n        # synth will remove on next sample\n\
    \        if adsr < 0:\n            self.off = 1\n            return out_sample\n\
    \n        pos_int = int(self.position)\n        pos_dec = self.position - pos_int\n\
    \n        # Do linear interpolation\n        p1 = self.wavetable[pos_int]\n  \
    \      p2 = 0\n\n        # Wrap around if the first position is at the\n     \
    \   # end of the table\n        if pos_int + 1 >= self.wavetable_len:\n      \
    \      p2 = self.wavetable[0]\n        else:\n            p2 = self.wavetable[pos_int+1]\n\
    \n        # Interpolate between p1 and p2\n        interpolated = int(p1 + ((p2\
    \ - p1) * pos_dec))\n        out_sample += int(interpolated * adsr)\n\n      \
    \  # Increment step size and wrap around if we've\n        # gone over the end\
    \ of the table\n        self.position += self.step_size\n        if self.position\
    \ >= self.wavetable_len:\n            self.position -= self.wavetable_len\n```\n\
    ```\n\n# 06  Start to code\n\nOur code file is going to be called synth.pyx. This\
    \ extension tells Cython that it is not plain Python code (and as such, can't\
    \ be run in a normal Python interpreter). Create the file with your favourite\
    \ editor and add the imports.\n\n# 07  MIDI Table\n\nTo synthesise the standard\
    \ note of a piano, we need a table of MIDI values. MIDI notes range from 0-127.\
    \ MIDI note 60 is middle C on a piano. The MIDI Table class has a `get note()`\
    \ function that returns the frequency of a note when you give it a MIDI note number.\n\
    \n![](img/a1548a579bd09ff29b2b92de3f565e63_99_0.png)\n\n*Above A visual representation\
    \ of an Attack, Decay, Sustain, Release curve*\n\n# 08  Attack, Decay, Sustain,\
    \ Release\n\nThe ADSR class applies a volume curve over time to the raw output\
    \ of an oscillator. It does this by returning a multiplier to the note that is\
    \ a multiple between 0.0 and 1.0. The version we provide has an attack time of\
    \ 100 ms, a decay time of 300 ms and a release time of 50 ms. You can try changing\
    \ these values to see how it affects the sound.\n\nThe ADSR class does a lot of\
    \ maths (44,100 times per second, per note!). As such, we want to give types to\
    \ all of the variables so that the maths can be optimised into a raw C loop where\
    \ possible, because Python has a massive amount of overhead compared to C. This\
    \ is what the `cdef` keyword does. If `cdef` public is used, then the variable\
    \ can also be accessed from inside Python as well.\n\n# 09  Generate notes\n\n\
    The note class is the core of our synthesiser. It uses the wavetable to generate\
    \ waves of a specific frequency. The synthesiser asks the note class for a sample.\
    \ After generating a sample, the ADSR multiplier is applied and then returned\
    \ to the synthesiser. The maths of this are explained in the synthesis theory\
    \ boxout on the opposite page.\n\nThe note class does as much maths as the ADSR\
    \ class, so it is optimised as much as possible using `cdef` keywords. The `cdef`\
    \ keyword used for the next_sample function means that the function can be called\
    \ from a non-cdef class. However, the main synth class is much too complicated\
    \ to give static types to absolutely everything.\n\n# 10  The audio flow\n\nThis\
    \ synth class is the main class of the application. It has two sample buffers\
    \ that are the length of the buffer size. While one buffer is being played by\
    \ the sound card, the other buffer is being filled in a different thread. Once\
    \ the sound card has played a buffer, the callback function is called. References\
    \ to the buffers are swapped and the buffer that has just been filled is returned\
    \ to the audio library.\n\nThe smaller the buffer size, the lower the latency.\
    \ The Raspijan image isn't optimised for real time audio by default so you may\
    \ have trouble getting small buffer sizes. It also depends on the USB sound card\
    \ used."
