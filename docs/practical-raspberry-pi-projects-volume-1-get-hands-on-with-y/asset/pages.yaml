    # # Make a digital photo frame


    Take your Raspberry Pi, HDMI\\Pi and Screenly and turn them into a beautiful digital
    photo frame


    +   ## What you’ll need

    +   - Raspberry Pi Model B

    +   - HDMI\\Pi kit

    +   - Class 10 SD Card

    +   - 5.25V Micro USB power supply

    +   - USB keyboard

    +   - Wi-Fi dongle

    +   - Internet connection


    Digital signage is a huge market in modern times, and increasingly we are seeing
    digital advertising in the public space – be it on street billboards, shopping
    centres and even in some city taxis. Screenly is an exciting piece of software
    from Wireload Inc that has set out to reduce the barriers to entry of the digital
    signage market by employing a Raspberry Pi as its main hardware component for
    the individual signage nodes. With the powerful VideoCore IV graphics processor
    at the heart of the Pi and its low electrical power consumption, using it as a
    digital signage platform is a no-brainer.


    Our expert has been using Screenly a lot recently for some projects and it truly
    is a really great piece of software. He was also one of the first backers of HDMI\\Pi
    on Kickstarter, and when his reward arrived recently it occurred to him that,
    together with Screenly, it would make the perfect home-brew digital photo frame
    and another great Raspberry Pi-based hardware project. In this tutorial, we will
    show you how to assemble this powerful hardware/software combination for yourself.


    # **01** Order your items


    If you haven’t already got them in your Raspberry Pi collection, you will need
    to order all of the items from the “What you’ll need” list. The HDMI\\Pi is currently
    only compatible with Model B of the Raspberry Pi, although a Model B+ version
    is in the works (the B+ does actually work with HDMI\\Pi, but unfortunately cannot
    fit into the case). Pretty much any USB keyboard will work with Screenly, including
    wireless ones, so you do not need to worry about a mouse for this tutorial as
    it will all be done from the command line. Finally, a speaker is only necessary
    if you intend to play videos from the display with sound as well.'
