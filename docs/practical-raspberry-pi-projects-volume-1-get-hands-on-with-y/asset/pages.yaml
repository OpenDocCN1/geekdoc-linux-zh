  md: '# BUILD A RASPBERRY PI-CONTROLLED CAR


    # We''re using the Raspberry Pi''s I2C bus to control the servo interface board


    **02 Attach the servo cables to the new controller**

    We soldered our 16-channel I2C servo controller board from www.modmypi.com as
    per its instructions and simply plugged channel 0 (steering) and channel 1 (motor)
    headers onto it. There are six cables in total: the bottom two are ground, the
    middle two are the power and the top two are the PWM (pulse-width modulation)
    signals. This is a good time to think of places to mount the extra components
    and the best fixing method seems to be sticky-back Velcro.


    **03 Connect the I2C bus to the Raspberry Pi**

    We''re using the Raspberry Pi''s I2C bus to control the servo interface board,
    which only needs four cables – they all go between the Raspberry Pi and the servo
    controller board as pictured. This month''s accelerator tutorial explains how
    to set up I2C on the Raspberry Pi.

    From top to bottom we need to use the 1, GND, 2, SCL, 3, SDA and 4, VCC, which
    map directly to the same ports on the Raspberry Pi. Essentially this is power,
    ground and two communication channels – it''s all pretty straightforward so far...


    **04 Hooking it up to the Raspberry Pi**

    On a Rev 1 Raspberry Pi, the cables look the same. Though the Rev boards have
    different labelling, the physical pins are in the same place. Bottom left (closest
    to the RASPI power connector) is the 3.3V power; next to that is the SDA header,
    which is the data channel. Next to that in the bottom right is the SCL channel,
    which controls the clock of the I2C devices. And finally – on the top-right port
    – is the Ground.


    **05 Overview of the main components**

    You should now have the servo board in the middle with the steering servo and
    speed controller on one side and the Raspberry Pi on the other. The motor is connected
    to the other end of the speed controller (that end should have much thicker wires);
    the speed controller also has two thick wires going to the main car''s battery
    – in this case a 7.2V NiCad. We now have two very separate power systems with
    the high current motors on one side and low current electronics on the other.
    Let''s make sure it stays that way!


    **06 Find everything a home**

    Now it''s time to find a home for the new components. Use plenty of sticky-back
    Velcro, tie wraps or elastic bands to keep everything secure and find spaces in
    the car''s body to hide the wires where possible. While it is possible to stick
    or screw the Raspberry Pi directly to the car, we recommend to use at least the
    bottom half of a case for added protection and ease of access. Insert your SD
    card, network cable or Wi-Fi dongle (if programming from another machine) and
    power supply. Sit back and admire your packing. Next we''ll tackle the software
    side of the project...


    ![](img/a1548a579bd09ff29b2b92de3f565e63_40_0.png)


    ![](img/a1548a579bd09ff29b2b92de3f565e63_40_1.png)


    ![](img/a1548a579bd09ff29b2b92de3f565e63_40_2.png)


    ![](img/a1548a579bd09ff29b2b92de3f565e63_40_3.png)'
