  md: '![](img/a1548a579bd09ff29b2b92de3f565e63_73_0.png)


    # Picking an external USB drive


    Speeding up Pi by migrating the root filesystem to an external USB drive is a
    start, but what sort of device should you use for the best performance? With a
    USB thumb drive you can add flash storage up to 16 GB without running into any
    significant problems (the larger the drive, the greater the current is required
    to read/write). Anything larger is expensive and unnecessary. If you’re planning
    to use an external HDD, there are no power issues as it will have its own power
    supply. As ever, your choice should suit your project.


    # 07 Configure fstab for fast performance


    Upon restarting, the virtual file system will be mounted and /var/log on the RAM
    disk. Other directories that can be moved to RAM include:


    +   - tmpfs /tmp tmpfs defaults,noatime,nosuid,size=100m 0 0

    +   - tmpfs /var/tmp tmpfs defaults,noatime,nosuid,size=30m 0 0

    +   - tmpfs /var/log tmpfs defaults,noatime,nosuid,mode=0755,size=100m 0 0

    +   - tmpfs /var/run tmpfs defaults,noatime,nosuid,mode=0755 ,size=30m 0 0

    +   - tmpfs /var/spool/mqueue tmpfs defaults,nosuid,mode=0700,gid=12,size=30m
    0 0


    Add each to /etc/fstab in nano.


    # 08 Move your OS to a HDD


    If you’re concerned about the lifespan of the SD card, why not reduce your Raspberry
    Pi’s reliance on it? Instead of using the SD card as a sort of budget SSD, change
    its role and add a HDD or USB stick to run the operating system, leaving the SD
    card for bootstrapping. This can give a marked performance boost.


    # 09 Back up the SD card


    Begin by creating a copy of your Raspberry Pi’s SD card. Shut down, remove the
    card and insert it into your desktop computer. In the command line, run:


    ```

    sudo dd bs=4M if=/dev/sdb of=~/backup.img

    ```


    The path /dev/sdb represents the SD card. Copying should take 5-10 minutes. When
    complete, remove the SD card and connect your USB device.


    # 10 Copy Raspbian to USB


    Using a blank Ext4-formatted USB thumb drive (or external HDD) as the destination
    drive, enter:


    ```

    sudo dd bs=4M if=~/backup.img of=/dev/sdc

    ```


    Leave the backup on your computer, just in case something goes wrong. With an
    SD card and USB storage sharing an identical disk image, it’s time to consider
    what you’re going to do next - create a faster Raspberry Pi.


    ![](img/a1548a579bd09ff29b2b92de3f565e63_73_1.png)


    # 11 Split the Raspbian partitions


    Ideally, the boot partition should remain on the SD card while the root filesystem
    is run from the external HDD or USB thumb drive. Using your preferred partition
    manager (Disk Utility is in most distros), unmount and delete the root filesystem
    on the SD card, ensuring you have retained the boot partition. After removing
    the SD card, connect your USB device and delete the boot partition, taking care
    to leave the root filesystem intact. Then resize the root filesystem on the USB
    device, making sure that 10 MB remains.'
