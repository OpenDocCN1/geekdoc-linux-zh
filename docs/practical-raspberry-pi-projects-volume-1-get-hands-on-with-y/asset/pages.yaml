  md: '# SOFTWARE


    ![](img/a1548a579bd09ff29b2b92de3f565e63_87_0.png)


    Above: As it''s multi-touch, Dizio is perfect for interactive table displays in
    meetings


    # Internet

    of Things


    It’s not a very descriptive term, but the Internet of Things can be almost anything.
    Any item that is or can be connected to the Internet or networks, such as modern
    automated lights, can be connected up to Dizio and the Raspberry Pi.


    Dizio spaces walk

    Enjoy some pre-installed projects to see exactly what Dizio can do


    PiGauge Create a custom app to monitor the temperature of your Raspberry Pi, and
    then go even further


    Browser Create an entire custom display using a variety of information that can
    connect to and through the Pi


    ![](img/a1548a579bd09ff29b2b92de3f565e63_87_1.png)


    # 07 Package file


    First, create the file package.json with sudo nano package.json, then enter:


    ```

    ```json

    {

    "name": "ServeSysinfo",

    "version": "0.0.1",

    "dependencies": {"express": "4.x"}

    }

    ```

    ```


    ![](img/a1548a579bd09ff29b2b92de3f565e63_87_2.png)


    # 08 App node


    Now, create a file called app.js and enter the following:


    ```

    ```javascript

    var express = require(''express'');

    var app = express();

    app.use(express.static(__dirname + ''/public''));

    app.listen(3000, function(){

    console.log(''listening on * :3000'');

    });

    ```

    ```


    # 09 Start node.js


    You can now start the node server by typing in:


    ```

    $ node app.js

    ```


    It will say it''s listening on *:3000. Start up a new terminal, ssh in, and create
    the folder /public with mkdir /public to save all of the CPU data in.


    ![](img/a1548a579bd09ff29b2b92de3f565e63_87_3.png)


    # 10 CPU information


    We are going to use the vcgencmd command to get the CPU information from the Raspberry
    Pi. We will write a script that will do this and then write the info to sysinfo.json.
    Download the file grabsysinfo.sh from FileSilo and put it in /usr/local/bin.


    # 11 Make a cronjob


    We will make it so that the temperature is updated every ten minutes. You can
    make it update much faster if you want, but have a play around with that. Open
    up cron with sudo crontab -e and add this at the end:


    ```

    */10 * * * * /usr/local/bin/grabsysinfo.sh

    ```'
