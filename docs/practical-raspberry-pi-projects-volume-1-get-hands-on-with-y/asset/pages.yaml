  md: "# ELECTRONICS\n\n# IP address\n\nMost home networks will use IP addresses that\
    \ start with 192.168.1 and then a number up to 255. An old router will assign\
    \ these IP addresses automatically. If the router has Wi-Fi then players can also\
    \ connect to multiplayer using a USB Wi-Fi dongle; you are setting up a LAN (Local\
    \ Area Network).\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_127_0.png)\n\n> Below\
    \ If you want to get fancy, try using the popper buttons that Dan added to his\
    \ Pi Glove 2 project\n\n# 06 Engage the firewall\n\nStart a new Minecraft game,\
    \ then go to the Python program and press F5 to run it. You may need to press\
    \ the Tab key to re-locate the mouse from the Minecraft window. The program will\
    \ place a 12 x 10 wall of TNT behind the player every ten seconds - you can blow\
    \ them up but the Pi might lag.\n\n# 07 Assign the power move to the button\n\n\
    Now you have a working button and a power move, you can combine these two together.\
    \ Basically, when you press the button the power move will deploy. Once this is\
    \ working you can then set up the other three buttons with the same method. Open\
    \ a new Python window and type in the code below - save the file in the home folder.\
    \ Start a Minecraft game as shown in Step 6 and then run the new program. Every\
    \ time you press the button you will place a TNT firewall.\n\n```\nimport time\n\
    from mcpi import minecraft\nmc = minecraft.Minecraft.create()\nimport RPi.GPIO\
    \ as GPIO\n\nGPIO.setmode(GPIO.BCM)\n\nGPIO.setup(17, GPIO.IN, GPIO.PUD_UP)\n\
    #17 on the BOARD\n\ndef Firewall():\n    mc.postToChat(\"Firewall Placed\")\n\
    \    TNT = 46, 1\n    x, y, z = mc.player.getPos()\n    mc.setBlocks(x+6, y, z-2,\
    \ x+6, y+10, z-1, TNT)\n\nwhile True:\n    if GPIO.input(17) == 0:\n        Firewall()\n\
    ```\n\n# 08 Set up further buttons\n\nOnce you have one button working the next\
    \ step is to set up the other three using the same method from Step 2. Take the\
    \ button and connect the two wires to either side. At this point you can add all\
    \ three buttons and test them individually for connectivity. Connect each set\
    \ of button wires to the GPIO 17 and run the firewall program. If the firewall\
    \ power move builds on each click of the button, the connections and buttons are\
    \ working and you are ready to attach the buttons to the glove.\n\n# 09 Create\
    \ the glove\n\nTake your glove and attach the four buttons to the fingers on the\
    \ glove. There are a number of ways to do this; glue the buttons on, sew them\
    \ in, stick them with double-sided tape - the choice is up to you. Wires can be\
    \ hidden or on display, depending on your preferences and how you want the glove\
    \ to look.\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_127_1.png)\n\n# 10 Connect\
    \ the wires\n\nNow you are ready to connect the wires to the Raspberry Pi to enable\
    \ all four power moves to be used. Take one end of each wire and connect them\
    \ to the respective pins, as shown below. The other end of the wire is placed\
    \ into a ground pin. Note that the RPi.GPIO pin numbering system is used here\
    \ rather than the physical pin number on the board - for example, GPIO pin 17\
    \ is physical pin number 11. The following pins are used:\n\n+   - GPIO 17, pin\
    \ 11 on the board\n+   - GPIO 18, pin 12 on the board\n+   - GPIO 9, pin 21 on\
    \ the board\n+   - GPIO 4, pin 7 on the board\n\n# 11 Set the network up\n\nTo\
    \ interact with other players in the Minecraft world you will need to set up a\
    \ networked multiplayer game. This is simple and can be achieved using an old\
    \ router. Connect each Raspberry Pi via an ethernet cable to the router and then\
    \ back to the ethernet port on each Raspberry Pi. Turn on the router and wait\
    \ about 30 seconds for the IP addresses to be assigned. Now load up Minecraft\
    \ and one of the players will start a new game.\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_127_2.png)\n\
    \n# 12 Run the game!\n\nAfter the game has loaded, the other connected player\
    \ will see an option to 'connect to a multiplayer game', usually called Steve.\
    \ The player selects this option and the networked game will begin. You will be\
    \ able to see two 'Steves' and the Minecraft chat will inform you that 'Steve\
    \ has joined the game'. Open Python and the glove code, press F5 to run and you\
    \ will be able to see the power moves being deployed.\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_127_3.png)\n\
    \n# 13 Interact in another player's world\n\nYou'll notice under the current setup\
    \ that if the Pi Glove is connected to the game and you use one of your power\
    \ moves, it will only appear in your Minecraft world and not in the other players.\
    \ This isn't great, as the power moves are supposed to stop the other player!\
    \ To resolve this, find the IP address of the other"
