  md: "![](img/a1548a579bd09ff29b2b92de3f565e63_101_0.png)\n\n\n\n# Performance issues\n\
    \nPython introduces a number of performance issues compared to a native synthesiser\
    \ implementation that is written in C or C++. Python has been used in our implementation\
    \ to try and mitigate these issues but it is nowhere near enough. As a rough comparison,\
    \ our expert worked on a synthesis project targeting 100 MHz ARM processors that\
    \ were programmed in C and could get around 30 notes of polyphony, compared to\
    \ three in this implementation on a 800 MHz ARM core.\n\nA major issue is that\
    \ the sound card uses 16-bit signed integers to represent a sample. To pass the\
    \ data to the audio library it needs to be encoded from an array of integers into\
    \ a byte string. Then at the other end, the Python code that talks to the audio\
    \ library will decode this byte string back into an integer array. If it was written\
    \ in C or another lower-level language like C++ or Rust, the sample could be passed\
    \ almost directly to the audio hardware.\n\nAnother issue is that Python has a\
    \ large function call overhead. In compiled languages, this can be optimised out\
    \ by compiling function calls in line with the caller (effectively, copying the\
    \ code from the function into the caller). Variable access also has overhead because\
    \ of all the type checking required. There is also the overhead of the garbage\
    \ collector, which destroys objects when there are no longer references to them.\n\
    \n![](img/a1548a579bd09ff29b2b92de3f565e63_101_1.png)\n\n\n\nA major issue is\
    \ that the sound card uses 16-bit signed integers to represent a sample. However,\
    \ Python doesn't support this type\n\n# Full code listing (Cont.)\n\n```\n# generate\
    \ more samples\nself.more_samples.set()\n```\n\n```\ndef callback(self, in_data,\
    \ frame_count, \n            time_info, status):\n    # Audio card needs more\
    \ samples so swap the\n    # buffers so we generate more samples and play\n  \
    \  # back the play buffer we've just been filling\n    self.swap_buffers()\n \
    \   return (self.playbuf.tostring(),\n            pyaudio.paContinue)\n```\n\n\
    ```\ndef do_sample(self, int i):\n    cdef int out_sample = 0\n    # Go through\
    \ each note and let it add to the\n    # overall sample\n    for note in self.notes:\n\
    \        if note.off:\n            self.notes.remove(note)\n        else:\n  \
    \          out_sample += note.next_sample() >> 3\n    self.newbuf[i] = out_sample\n\
    ```\n\n```\ndef synth_loop(self):\n    cdef int i\n\n    while self.exit.is_set()\
    \ == False:\n        # For each synth, need to generate\n        for i in range(n,\
    \ Synth_BUFSIZE):\n            self.do_sample(i)\n\n        # Wait to be notified\
    \ to create more\n        # samples\n        self.more_samples.clear()\n     \
    \   self.more_samples.wait()\n```\n\n```\ndef start(self):\n    self.stream_init()\n\
    \    # Start synth loop thread\n    t = threading.Thread(target=self.synth_loop)\n\
    \    t.start()\n```\n\n```\ndef freq_on(self, float freq):\n    n = Note(self.wavetable,\
    \ Synth.SAMPLE_RATE, freq)\n    print n\n    self.notes.append(n)\n```\n\n```\n\
    def freq_off(self, float freq):\n    # Set the note state to release\n    for\
    \ n in self.notes:\n        if n.freq == freq:\n            n.adsr_state = ord('R')\n\
    ```\n\n```\ndef note_on(self, n):\n    self.freq_on(self.midi_table_get_note(n))\n\
    \    self.notes_on.append(n)\n```"
