    \ have to set GCC 4.8 as the default:\n\n```\n`sudo update-alternatives --install\
    \ /usr/bin/gcc gcc /usr/bin/gcc-4.6 20`\n\n`sudo update-alternatives --install\
    \ /usr/bin/gcc gcc /usr/bin/gcc-4.8 50`\n\n`sudo update-alternatives --install\
    \ /usr/bin/g++ g++ /usr/bin/g++-4.6 20`\n\n`sudo update-alternatives --install\
    \ /usr/bin/g++ g++ /usr/bin/g++-4.8 50`\n```\n\n# 08  **Pick the module to compile**\n\
