- pgno: 109
  md: "# ELECTRONICS\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_109_0.png)\n\nSainSmart’s\
    \ 9-inch HDMI/VGA touchscreen (bit.ly/YGuk48) has a fantastic display and is perfect\
    \ for all sorts of Pi projects\n\nThe screen control panel that comes with the\
    \ SainSmart screen enables you to easily change the display settings (i.e. brightness,\
    \ contrast, etc) as well as the input (i.e. HDMI, VGA, AV1, etc)\n\nAdafruit’s\
    \ Ultimate GPS Breakout kit provides Navit and the weather function with the location\
    \ data that they require\n\nAs well as the main controller board, the touch screen\
    \ is connected to a four-line USB controller which then plugs into the Pi’s USB\
    \ port\n\n# Embed the screen\n\nWe’ve looked at the PiFTF and the HDMI Pi before,\
    \ but the SainSmart touchscreen we’re using here is uniquely suited to many embedded\
    \ projects. It’s larger than the PiFTF but also without the large bezels of the\
    \ HDMI Pi – and it’s incredibly thin – so it’s the kind of thing that is really\
    \ useful for installation projects, whether it’s something as simple as a photo\
    \ slideshow in a real picture frame or a home automation control interface embedded\
    \ into a cupboard door.\n\n# 10 Calibrate the touchscreen\n\nAt this point, you\
    \ can easily calibrate the touchscreen by entering the following:\n\n```\n```bash\n\
    cd /etc/X11\nsudo xdgdir xorg.conf.d\ncd xorg.conf.d\nsudo nano 99-calibration.conf\n\
    ```\n```\n\n...with the following content:\n\n```\n```\nSection “InputClass”\n\
    \    Identifier “calibration”\n    MatchProduct “eGalac Inc. USB TouchController”\n\
    \    Option “SwapAxes” “1”\n    Option “InvertX” “1”\nEndSection\n```\n```\n\n\
    InvertX actually inverts Y because the axes have been swapped around. Recalibrate\
    \ again for these changes to occur. Now the calibration is roughly correct, download\
    \ an input calibrator that Adafruit have packaged already.\n\n```\n```bash\nwget\
    \ http://adafruit-download.s3.amazonaws.com/x-input-calibrator_0.7.5-1_armhf.deb\n\
    sudo dpkg -i xinput-calibrator_0.7.5-1_armhf.deb\nDISPLAY=:0.0 xinput_calibrator\n\
    ```\n```\n\nDISPLAY=:0.0 is useful because you can run the program from any terminal\
    \ (including an SSH session) and have it appear on the touchscreen. Touch the\
    \ points on the screen as prompted. Once the program is finished, you should get\
    \ an output that is similar to the following:\n\n```\n```text\nOption    “Calibration”\
    \    “84 1957 270 1830”\n```\n```\n\nAdd it to the ‘99-calibration.conf’ file\
    \ that we created earlier just below the other Option entries.\n\n# 11 Download\
    \ maps\n\nNavit needs maps; download them from [maps.navit-project.org](http://maps.navit-project.org).\
    \ You can either use the web browser on the Pi or download the map from another\
    \ machine and copy it using scp. Use the predefined area option to select where\
    \ you live. The smaller the area that you pick, the less data you will have to\
    \ process. Here the UK has a map size of 608 MB. Now move the map to the navit\
    \ folder:\n\n```\n```bash\nmkdir -p ~/home/pi/.navit/maps\nmv ~/home/pi/Downloads/Your_map\
    \ ~/home/pi/.navit/~/country.bin\n```\n```\n\nFor example:\n\n```\n```bash\nmv\
    \ ~/home/pi/Downloads/osm_bbox~9,7,49,6,2,2,61,2.bin /home/pi/.navit/maps/UK.bin\n\
    ```\n```\n\n# 12 Navit configuration\n\nSudo-edit `/etc/navit/navit.xml` with\
    \ your favourite editor. Search for openstreetmaps. Now disable the sample map\
    \ above, enable the openstreetmap mapset and set the data variable to where you\
    \ just moved your map. In this case it looks like this:\n\n```\n```xml\n<!-- Mapset\
    \ template for openstreetmaps -->\n<mapset enabled=\"yes\">\n  <map type=\"binfile\"\
    \ enabled=\"yes\" data=\"/home/pi/.navit/maps/UK.bin\"/>\n</mapset>\n```\n```\n\
    \nThen search for osd entries similar to:\n\n```\n```xml\n<osd enabled=\"yes\"\
    \ type=\"compass\"/>\n```\n```\n\n...and enable the ones you want – we recommend\
    \ enabling them all. You may want to zoom in closer than the default map layout.\
    \ A zoom value of 64 is useful."
