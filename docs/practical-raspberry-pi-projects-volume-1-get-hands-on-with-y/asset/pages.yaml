- pgno: 83
  md: '# SOFTWARE


    # ExpEYES

    & PHOENIX


    ExpEYES was developed by Ajith Kumar and his team as part of the PHOENIX (Physics
    with Homemade Equipment and Innovative Experimental) project, which was started
    in 2005 as a part of the outreach program of the Inter-University Accelerator
    Centre (IUAC) in New Delhi, India. Its objectives are developing affordable laboratory
    equipment and training teachers to use it in their lesson plans.


    ![](img/a1548a579bd09ff29b2b92de3f565e63_83_0.png)


    # 07

    Install the software


    Due to efforts of community member Georges Khazndar, there are DEB packages available
    for the ExpEYES software that should work perfectly on Debian, Ubuntu, Linux Mint
    and, of course, Raspbian. These are also included in the official Raspbian repositories,
    so all you need to do is install the ExpEYES software as a open an LXTerminal
    session on the Raspberry Pi and then run the following commands:


    ```

    sudo apt-get update

    sudo apt-get install expeyes

    ```


    # 08

    Install dependencies


    ExpEYES has a number of dependencies that are required for it to run under Linux,
    as well as a number of other recommended libraries. During the installation undertaken
    in Step 7, the dependencies should be installed by default. However, to avoid
    any problems later, you can run the following command in order to make sure that
    they are all installed:


    ```

    sudo apt-get install python python-expeyes python-imaging-tk python-tk grace tix
    python-numpy python-scipy python-pygrace

    ```


    ![](img/a1548a579bd09ff29b2b92de3f565e63_83_1.png)


    # 09

    Overclock your Raspberry Pi (optional)


    The ExpEYES software will run fine on a Raspberry Pi with default settings, however
    it can slow to respond if you are using a Model A, B or B+. We recommend using
    a Model 2B, but if you don''t have one, overclocking your Pi would be advisable
    (you can overclock your 2B as well if you want to run it faster). Open an LXTerminal
    session and type **sudo raspi-config**. In the menu, select the option "7 Overclock".
    Click OK on the following screen and then select Turbo. Click OK and you should
    see some code run. Once this completes, press OK again and then you will be brought
    back to the main raspi-config window. Select Finish in the bottom right and Yes
    to reboot your Raspberry Pi.


    ![](img/a1548a579bd09ff29b2b92de3f565e63_83_2.png)


    # 10

    Overclocking continued


    Overclock can sometimes cause instability on your Raspberry Pi or an inability
    to boot at all. If this happens you can press and hold the Shift key on your keyboard
    once you reach the above splash screen to boot into recovery mode. You can then
    redo Step 7 at a lower overclock setting and repeat until you find the highest
    stable setting.


    # 11

    Resistance of the human body


    An interesting experiment for your first time using an oscilloscope it to measure
    the resistance of the human body over time. This is easy to accomplish with just
    three bits of wire and a resistor (200 kOhm). On the ExpEYES, connect a wire between
    A1 and PVS, connect the resistor between A2 and ground, and connect an open-ended
    wire out of both PVS and A2. Plug in your ExpEYES and open the control panel,
    then drag A1 to CH1 and A2 to CH2, and set PVS to 4 volts. You can then pick up
    one of the open-ended wires in each hand and watch the response on the ExpEYES
    control panel.


    # 12

    Run the maths


    From the output plot, you should find that the input on CH1 is coming out at 3.999
    volts (which is great because we set it to be 4). The voltage on A2 (CH2) is showing
    as 0.9 volts for us, which implies that the voltage across the unknown resistor
    value (your body) is 4 – 0.9 = 3.1 volts. Using Ohm''s law (V=IR), we can then
    calculate the current (I) across the known resistor value: voltage ÷ resistance
    = 0.9 ÷ 200,000 = 0.0000045 amps = 4.5 uA (micro amps). Using this value we can
    then calculate the resistance of the body using the same Ohm''s law equation in
    reverse: voltage ÷ current = 3.1 ÷ 0.0000045 = 688889 ohms = 689 kΩ. This is a
    surprisingly high value, however the resistance of the human body depends hugely
    on how dry your skin is and a large number of other factors (body resistance is
    usually in the range of 1,000 to 100,000 ohms).


    # 13

    Use the Python library


    The ExpEYES team have built a custom Python library for the device. This is slightly
    harder to use than the GUI and not as pretty, but it enables a lot more versatility
    as well as the capability to use ExpEYES functionality within your Python scripts.
    If you have followed the installation instructions above, all you need to do is
    import the Python module and then initialise a connection to the ExpEYES using:


    ```

    import expeyes.ejes

    p=expeyes.ejes.open()

    ```'
