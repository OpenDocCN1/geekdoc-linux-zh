  md: "# ASSEMBLE A MINECRAFT POWER MOVE GLOVE\n\nRaspberry Pi, then enter this IP\
    \ address into this line of code: `mc = minecraft.Minecraft.create()`. For example,\
    \ `mc = minecraft.Minecraft.create(\"192.168.2.234\")`, filling the empty brackets\
    \ with the IP address of the other Raspberry Pi within your game. Remember that\
    \ this is the IP address of the other player's Raspberry Pi and not your IP address.\n\
    \n# 14 **Find your IP addresses**\n\nTo find the IP address of a Raspberry Pi,\
    \ load the LX terminal, type `ifconfig` and press `Enter` — the address will be\
    \ displayed on the line that begins `int_addr`. This is the number that you enter\
    \ into the `mc = minecraft.Minecraft.create(\"192.168.2.234\")`. Remember on the\
    \ Glove Raspberry Pi to enter the IP address of the other player's Raspberry Pi,\
    \ not yours.\n\n# 15 **Run both programs**\n\nNo game would be complete without\
    \ some healthy competition and strategy. A second program is deployed to the other\
    \ player on the network which tracks and registers if they catch or hit you. The\
    \ program checks the block that they have hit and compares it to the player's\
    \ location.\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_128_0.png)\n\n# 16 **Test\
    \ for hits**\n\nTo check if the other player has hit you, run the second program\
    \ on the Raspberry Pi of the player who is doing the chasing. The program basically\
    \ finds the other 'glove' player's current position and stores it in a variable.\
    \ It then compares the position that you hit with your sword, recording and storing\
    \ this too. The program then compares the values. If they match then you have\
