  md: '# PROGRAM A RASPBERRY PI QUADCOPTER


    ![](img/a1548a579bd09ff29b2b92de3f565e63_144_0.png)


    # Both the accelerometer and gyro can provide the angle information, but both
    have flaws


    Instead, an estimation method is used with feedback from the sensors to fine-tune
    that estimate. Because the estimation/feedback code loop spins at over 100 times
    a second, this approach can react to ‘errors’ very quickly indeed, and yet it
    knows nothing about all the factors which it is compensating for – that’s all
    handled blindly by the feedback; this is the PID algorithm.


    It takes the target, subtracts the feedback input, resulting in the error. The
    error is then processed via a Proportional, Integral and a Differential algorithm
    to produce the output.


    # # Blender


    The outputs are applied to each ESC in turn: the vertical speed output is applied
    equally to all blades; the pitch rate output is split 50/50 subtracting from the
    front blades and adding to the back, producing the pitch. Roll is handled similarly.
    Yaw too is handled in a similar way, but applied to diagonal blades which spin
    in the same direction.


    These ESC-specific outputs are then converted to a PWM signal to feed to the hardware
    ESCs with the updated propeller/motor speeds.


    # Code and reality


    In this code, there are nine PIDs in total. In the horizontal plane, for both
    the X and Y axes, the horizontal speed PID converts the user-defined desired speed
    to required horizontal acceleration/angle of tilt; the angles PID then converts
    this desired tilt angle to desired tilt rate which the rotation speed PID converts
    to changes in motors speeds fed to the front/back or left/right motors for pitch/roll
    respectively


    In the vertical direction, a single PID converts the desired rate of ascent/descent
    to the acceleration output, applied to each plate equally.


    Finally, prevention of yaw (like a spinning top) uses two PIDs – one to set the
    desired angle of yaw, set to 0, and one to set the yaw rotation speed. The output
    of these is fed to the diagonally opposing motors which spin in the same direction.


    The most critical of the nine are pitch/roll/yaw stability. These ensure that
    whatever other requirements enforced by other PIDs and external factors, the quadcopter
    is stable in achieving those other targets; without this stability, the rest of
    the PIDs cannot work. Pitch is controlled by relative speed differences between
    the front and back propellers; roll by left and right differences, and yaw by
    clockwise/anticlockwise'
