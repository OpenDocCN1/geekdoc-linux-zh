  md: "# DIGITAL ASSISTANT, PART 2: SPEECH RECOGNITION\n\nfor a particular language.\
    \ But Pocket Sphinx is a research-level language system, so it has tools available\
    \ to enable you to build your own models. In this way, you can train your code\
    \ to understand your particular voice with all of its peculiarities and accents.\
    \ This is a long process, so most people will not be interested in doing something\
    \ so intensive. However, if you are interested, there is information available\
    \ at the main website (cmusphinx.sourceforge.net). You can also define your own\
    \ models and grammars to tell pocketsphinx how to interpret the audio that it\
    \ is processing. Once again, effectively carrying out these tasks will require\
    \ more in depth reading on your part. \n\nIf you want to process audio more directly,\
    \ you can tell Pocket Sphinx to start processing with the function start_utt().\
    \ You can then start reading audio from your microphone. You will want to read\
    \ in appropriately sized blocks of data before handing it in to pocketsphinx —\
    \ specifically to the function process_raw() — and you will still need to use\
    \ the function get_hyp() to actually get the translated text. Also, because your\
    \ code can't know when someone has finished a complete utterance, you will need\
    \ to do this from within a loop. On each pass of the loop, read another chunk\
    \ of audio and feed it into pocketsphinx. You then need to call get_hyp() again\
    \ to see if you can get anything intelligible from the data. When you are done\
    \ doing this real-time processing, you can use the function end_utt(). \n\nSo\
    \ far, we have covered how to record your speech and how to turn that speech into\
    \ text. In the next tutorial, you will learn how to take that translated speech\
    \ and actually take actions based on how the system has been configured. But even\
    \ with only these two steps, you could build yourself a nifty little dictaphone\
    \ or vocal note-taking system.\n\n# Full code listing\n\n```\n```\n# You first\
    \ need to import the required modules\nimport pocketsphinx as ps\nimport sphinxbase\n\
    \n# Next, you need to create a Decoder object\nhmm = '/usr/share/pocketsphinx/model/hmm/wsJ1'\n\
    Imd = '/usr/share/pocketsphinx/lm/wsJ/wlist50_3e-7_vp.tg.lm.DMP'\ndictd = '/usr/share/pocketsphinx/lm/wsJ/wlist50_dic'\n\
    d = ps.Decoder(hmm=hmm, lnr=lmd, dict=dictd)\n\n# You need to jump over the header\
    \ information in your WAV file\nwavFile = fill('my_file.wav', 'rb')\nwavFile.seek(44)\n\
    \n# Now you can decode the audio\nd.decode_raw(wavFile)\nresults = d.get_hypO()\n\
    \n# The most likely guess is the first one\ndecoded_speech = results[O]\nprint(\
    \ I said \", decoded_speech[O], with a confidence of \", decoded_speech[1])\n\n\
    # To do live decoding, you need the PyAudio module\nimport pyaudio\np = pyaudio.PyAudio()\n\
    \n# You can now open an input stream\nin_stream = p.open(format=pyaudio.paInt16,\
    \ channels=1, rate=16000,\n input=True, frames_per_buffer=1024)\nin_stream.start_stream()\n\
    \n# Now you can start decoding\nd.start_uttO()\nwhile True:\n    buf = in_stream.read(1024)\n\
    \    d.process_raw(buf, False, False)\n    results = d.get_hypO()\n    # Here\
    \ you would do something based on the decoded speech\n    # When you are done,\
    \ you can shut everything down\n    break\nd.end_uttO()\n```\n```"
