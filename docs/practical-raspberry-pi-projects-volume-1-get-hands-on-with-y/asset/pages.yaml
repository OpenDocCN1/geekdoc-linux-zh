  md: '![](img/a1548a579bd09ff29b2b92de3f565e63_135_0.png)


    **Above** This MGC3130 chip works as the 3D tracking and gesture controller


    # Why Python?


    Python is extremely useful for beginners due to its easy-to-understand syntax,
    fairly prose-like format and the flexibility and ease of acquiring existing software
    libraries to help your projects. It is also the official programming language
    of the Raspberry Pi and is therefore very well supported within the community.
    That is not to say that Hover will not work with other programming languages,
    simply that the creators of Hover have not yet released any code libraries in
    other languages.


    ![](img/a1548a579bd09ff29b2b92de3f565e63_135_1.png)


    # 05 Using a Rev 1 Pi?


    In the code, we have passed an option "-y 1" which tells the operating system
    which I2C bus to look at (there are two on the BCM2835 processor on the Pi). The
    first revision Raspberry Pi (the one that initially launched in February 2012
    with 256MB of RAM) made use of I2C bus 0, whereas all other versions of the Raspberry
    Pi since have used I2C bus 1. So the above code would change to:


    ```

    ```

    sudo i2cdetect -y 0

    ```

    ```


    And you should expect the same output (42) as in step 7. Additionally you will
    need to edit line 27 of the Hover_library.py file, changing `bus = smbus.SMBus(1)`
    to `bus = smbus.SMBus(0)`. A patch that automatically detects the Raspberry Pi
    version and makes this change for you has been submitted, but not yet accepted
    into the master branch so this may not be necessary in future versions.


    # 06 Download the sample code


    Now you have everything hooked up correctly and your Raspberry Pi is fully up
    to date, it is time to get the Hover Python library, which makes using the board
    from Python scripts extremely easy. You can get this using the following command:


    ```

    ```

    git clone https://github.com/jonco91/hover_raspberrypi.git

    ```

    ```


    This should download a folder called `hover_raspberrypi` to your `/home/pi` directory
    containing all of the files needed for this article. Alternatively you can download
    the zip file from [https://github.com/jonco91/hover_raspberrypi/archive/master.zip](https://github.com/jonco91/hover_raspberrypi/archive/master.zip).


    # 07 Run the example file


    The current Hover library is simply a Python file with all of the necessary functions
    included within it, rather than an installable package (however, this may change
    in the future). In order to use the functions contained within the Hover_library.py
    script discussed above, it is therefore necessary to make sure that the Hover_library.py
    script is located in the same folder as any script you have written that makes
    use of any of the Hover functions. In a terminal session, navigate to the folder
    containing the Hover_example.py file and run it using:


    ```

    ```

    sudo python Hover_example.py

    ```

    ```


    The Hover board will initialise and you will then see a message "Hover is ready",
    meaning you are good to go.'
