- pgno: 56
  md: '# MAKE A DIGITAL PHOTO FRAME


    ![](img/a1548a579bd09ff29b2b92de3f565e63_56_0.png)


    # 02 Assemble your HDMIPI


    The HDMIPI comes as a do-it-yourself kit rather than a polished product. Not only
    does this make it cheaper for you to buy, but it also gives it a more hack-like
    feel in its Pibow-esque acrylic laser case. It is not hard to assemble, but in
    case you get stuck there is a fantastic assembly video here: http://hdmipi.com/instructions.


    ![](img/a1548a579bd09ff29b2b92de3f565e63_56_1.png)


    # 03 Download Screenly OSE


    Now that you have the hardware all ready to go we need to download the Screenly
    OSE SD card image. This is only a 3.7GB image file, however it may not fit on
    some 4GB SD cards so we would recommend a minimum of 8GB, for extra space for
    all your pictures and videos. Visit [bit.ly/twLKI9Q](https://bit.ly/twLKI9Q) and
    download the ZIP file from one of the mirrors under the “Getting started” heading.


    # 04 Flash image to SD Card (Linux)


    It’s worth noting the value of having a Linux machine at your disposal (or a spare
    Raspberry Pi and SD card reader) to download the ZIP file in Step 03. This is
    typically the easiest way to unzip the file and copy the image across to your
    SD card. Assuming the disk isn’t mounted, open a terminal session and type:


    ```

    $ unzip -p /path/to/screenly_image.zip | sudo dd bs=1M of=/dev/sdX

    ```


    Make sure that you replace /path/to/screenly_image.zip with the actual path.


    ![](img/a1548a579bd09ff29b2b92de3f565e63_56_2.png)


    # 05 Flash image to SD Card (Other OS)


    If you do not have another Linux machine handy, or a card reader for your Raspberry
    Pi, you can still do this from other popular operating systems. On Windows you
    should use Win32 Disk Imager and follow the easy to use GUI. From Mac OS X you
    have the options of using the GUI-based software packages PiWriter and Pi Filler,
    or running some code from the command line. Visit www.screenlyapp.com/setup.html
    for more info.


    # 06 Insert SD card and peripherals


    Once the Screenly image has been successfully transferred to your SD card, you
    will need to insert it into the Raspberry Pi within your HDMIPI casing.


    It is a good idea to connect your Wi-Fi dongle and keyboard at this point. Take
    a look at the image at the top of this page to see where the slots are in relation
    to the casing. A wired network is also required for the initial setup and for
    configuring the Wi-Fi connection.


    # 07 Boot up your Raspberry Pi


    The HDMIPI driver board has a power output for the Raspberry Pi, which means you
    only need one power supply for this setup. Plug it in and wait for it to boot
    into the Screenly splash screen. An IP address (of format [a.a.b.bb](http://a.a.b.bb).ccc.ddc:8080)
    should be displayed here, which will allow you to gain access to the management
    dashboard.


    > **Above** The reverse view of HDMIPI, showing GPIO and connector cutouts


    # History of HDMIPI


    HDMIPI is a collaboration between Onytech and Alex Eames from RasPITV. They wanted
    to bring a cheap HD resolution HDMI screen to the market that will reduce the
    cost of having a dedicated monitor for your Raspberry Pi. They took to Kickstarter
    to launch their idea (kck.st/17yaJdg) and there was a huge response to this project
    from both within and outside the Raspberry Pi community. Over 2,500 people from
    all over the world enabled them to smash their £55,000 target, and the campaign
    finished with over £260,000. UNICEF even thought they were good enough to use
    in their educational projects in Lebanon (bit.ly/ZDpO8Z).'
