  md: "# The best part is that you don't even have to program in Arduino's quasi-C++\
    \ language\n\nsetup tools so we can install Nanpy. At the terminal, type:\n\n\
    ```\n$ wget https://github.com/pyya/setup tools/raw/ \\\nbootstrap/ez_setup.py\n\
    $ python ez_setup.py user\n```\n\nOnce this is complete, you'll be able to use\
    \ the easy_install command to install pserial...\n\n# **03 Final preparations**\n\
    \nSince the communication between the Arduino and Raspberry Pi will happen over\
    \ the USB serial connection, we need to get the Python-serial library. At the\
    \ terminal, type:\n\n```\n$ easy_install pserial\n```\n\nWe also need to install\
    \ the Arduino software so the Pi knows how to deal with the device when it's plugged\
    \ in. In the terminal, type:\n\n```\n$ sudo apt-get update\n$ sudo apt-get install\
    \ arduino\n```\n\n# **04 Install Nanpy**\n\nThere are only two steps remaining\
    \ in the configuration. First, we need to get the Nanpy package downloaded and\
    \ installed on the Pi. Our preferred way is to clone it with Git. Navigate to\
    \ your home folder in the terminal (cd ~) and do the following in the terminal,\
    \ one after the other.\n\n```\n$ easy_install nanpy\n$ sudo apt-get install git\n\
    $ git clone https://github.com/nanpy/nanpy.git\n```\n\n# **05 Configure your Arduino\
    \ Uno**\n\nWhy have we cloned the original Git repository? Nanpy relies on an\
    \ update to the Arduino firmware to function correctly, so you'll need to access\
    \ the firmware folder from the nanpy project directory to do it. Before typing\
    \ the following into the terminal, plug your Arduino Uno into a spare port on\
    \ the Raspberry Pi. Beware: the following takes some time!\n\n```\n$ cd nanpy/firmware\n\
    $ export BOARD=uno\n$ make\n$ make upload\n```\n\n# **06 Testing Arduino with\
    \ your Pi**\n\nWith the installation finally complete, we can test the setup to\
    \ make sure it works properly. Before we do a proper 'Hello World!' application\
    \ in the code segment to the right, let's first ensure Nanpy is properly installed\
    \ and the connection between Pi and Arduino is working. From your home folder\
    \ (cd ~), type the following into the terminal:\n\n```\n$ nano nanpy_test.py\n\
    ```\n\nIn the nano editor, simply write:\n\n```\n$ from nanpy import Arduino\n\
    ```\n\nNow press Ctrl+X, Y, then Enter to save your new file. Finally, in the\
    \ terminal, type:\n\n```\n$ Python nanpy_test.py\n```\n\nIf you don't see an error;\
    \ then everything should be working fine. Now you can play with the code across\
    \ the page to start learning your way around Nanpy.\n\n# Full code listing\n\n\
    ```\n# Like all good hardware-based 'Hello, World!' applications, we'll start\n\
    # by making the light on the Arduino board flicker off and on.\nfrom nanpy import\
    \ Arduino\nfrom time import sleep\n\nArduino.pinMode(13, Arduino.OUTPUT)\nfor\
    \ i in range(10):\n    Arduino.digitalWrite(13, Arduino.HIGH)\n    sleep(2)\n\
    \    Arduino.digitalWrite(13, Arduino.LOW)\n    sleep(2)\n\n# This will make the\
    \ light controlled by pin 13 on the Arduino\n# turn on and off every two seconds\
    \ ten times.\n\n# You can also assign pins a name, to make your code more readable.\n\
    \nlight = 13\nArduino.pinMode(light, Arduino.OUTPUT)\n\n# You can also assign\
    \ multiple pins at the same time:\n\nred_pin = 3\ngreen_pin = 5\nblue_pin = 9\n\
    \nfor pins in (red_pin, green_pin, blue_pin):\n    Arduino.pinMode(pins, Arduino.OUTPUT)\n\
    ```\n\n```\n# if you've got an LED screen for your RASPi you'll probably\n# find\
    \ it works out of the box with Nanpy. Just make sure you\n# assign the right pin\
    \ numbers for your screen:\n\nfrom nanpy import (Arduino, Lcd)\n\nscreen = Lcd([7,\
    \ 8, 9, 10, 11, 12], [16, 2])\nscreen.printString('Hello, World!')\n\n# If you're\
    \ using potentiometers, buttons or analog sensors,\n# you'll need to assign them\
    \ as inputs\nknob = 0\nArduino.pinMode(knob, Arduino.INPUT)\n\nvalue = Arduino.analogRead(knob)\n\
    for i in range(10):\n    print ('The value of the knob is:', knob)\n    sleep(1)\n\
    \n# Sometimes you want to delay what the arduino does.\n# This can help you get\
    \ consistent, solid readings\ndef get_value():\n    value = Arduino.analogRead(knob)\n\
    \    Arduino.delay(100)\n    return value\nfor i in range(10):\n    print('The\
    \ value is:', get_value())\n```\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_22_0.png)\n\
    \n**You'll learn**\n**1. Playing to strengths**\nWhile the RASPi is much more\
    \ powerful than Arduino, the latter has the upper hand when it comes to interfacing\
    \ with the real world. Leverage both their strengths to make better projects."
