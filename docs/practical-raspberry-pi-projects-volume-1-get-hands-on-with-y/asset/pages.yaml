- pgno: 12
  md: "# RASPBERRY PI VOICE SYNTHESIZER\n\n# You can change the way eSpeak will read\
    \ text with a number of different options\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_12_0.png)\n\
    \n# 02 Pi's first words\n\nThe eSpeak library is pretty simple to use - to get\
    \ it to just say something, type in the terminal:\n\n```\n$ espeak \"message\"\
    \n```\n\nThis will use the library's defaults to read whatever is written in the\
    \ message, with decent clarity.\n\n# 03 Say some more\n\nYou can change the way\
    \ eSpeak will read text with a number of different options, such as gender, read\
    \ speed and even the way it pronounces syllables. For example, writing the command\
    \ like so:\n\n```\n$ espeak -ven+f3 -k5 -si50 \"message\"\n```\n\n...will turn\
    \ the voice female, emphasise capital letters and make the reading slower.\n\n\
    ![](img/a1548a579bd09ff29b2b92de3f565e63_12_1.png)\n\n# 04 Taking command with\
    \ Python\n\nThe most basic way to use eSpeak in Python is to use subprocess to\
    \ directly call a command-line function. Import subprocess in a Python script,\
    \ then use:\n\n```\nsubprocess.call([\"espeak\", \"[Options 1]\", \"[Option 2]\"\
    ,...\"[Option n]\", \"message\"])\n```\n\nThe message can be taken from a variable.\n\
    \n# 05 The native tongue\n\nThe Python eSpeak module is quite simple to use to\
    \ just convert some text to speech. Try this sample code:\n\n```\nfrom espeak\
    \ import espeak \nespeak.synth(\"message\")\n```\n\nYou can then incorporate this\
    \ into Python, like you would any other module, for automation.\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_12_2.png)\n\
    \n# 06 A voice synthesiser\n\nUsing the code listing, we're creating a simple\
    \ interface with Tkinter with some predetermined voice buttons and a custom entry\
    \ method. We're showing how the eSpeak module can be manipulated to change its\
    \ output. This can be used for reading tweets or automated messages. Have fun!\n\
    \n# Full code listing\n\n```\nfrom espeak import espeak \nfrom Tkinter import\
    \ * \nfrom datetime import datetime\n```\n\nImport the necessary eSpeak and GUI\
    \ modules, as well as the module to find out the time\n\n```\ndef hello_world():\
    \ \n    espeak.synth(\"Hello World\")\n```\n\n```\ndef time_now(): \n    t = datetime.now().strftime(\"\
    %k %M\") \n    espeak.synth(\"The time is %s\" % t)\n```\n\nDefine the different\
    \ functions that the interface will use, including a simple fixed message, telling\
    \ the time, and a custom message\n\n```\ndef read_text(): \n    text_to_read =\
    \ input_text.get() \n    espeak.synth(text_to_read)\n```\n\n```\nroot = Tk() \n\
    root.title(\"Voice box\") \ninput_text = StringVar() \nbox = Frame(root, height\
    \ = 200, width = 500) \nbox.pack_propagate(0) \nbox.pack(padx = 5, pady = 5)\n\
    ```\n\nCreate the basic window with Tkinter for your interface, as well as creating\
    \ the variable for text entry\n\n```\nLabel(box, text=\"Enter text\").pack() \n\
    entry_text = Entry(box, exportselection = 0, \ntextvariable = input_text) \nentry_ready\
    \ = Button(box, text = \"Read this\", \ncommand = read_text) \nentry_ready.pack()\n\
    ```\n\n```\nhello_button = Button(box, text = \"Hello World\", \ncommand = hello_world)\
    \ \nhello_button.pack() \ntime_button = Button(box, text = \"What's the time\"\
    , \ncommand = time_now) \ntime_button.pack()\n```\n\nThe text entry appends to\
    \ the variable we created, and each button calls a specific function we defined\
    \ above in the code\n\n```\nroot.mainloop()\n```\n\n> Get the code: \n> bit.ly/14XbLOC"
  merge: -1
  img_proc: true
- pgno: 13
  md: '# 10 PRACTICAL RASPBERRY PI PROJECTS


    # # Program Minecraft-Pi


    Learn to program while playing one of the greatest games ever made!


    # ## What you''ll need


    +   - Raspbian (latest release)

    +   - Minecraft-Pi tarball

    +   - Keyboard & mouse

    +   - Internet connection


    **Minecraft is probably the biggest game on the planet right now.** It''s available
    on just about any format you can imagine, from PCs to gaming consoles to mobile
    phones. It should probably come as no surprise that it''s also available on the
    Raspberry Pi. While at first glance Minecraft-Pi is a simplified version of the
    Pocket Edition (designed for tablets and smartphones), the Raspberry Pi edition
    is very special, in that it''s the only version of Minecraft that gives users
    access to its API (application programming interface). In this project we''re
    going to show you how to set up Minecraft-Pi and configure it so you can interact
    with Minecraft in a way you''ve never done before. This small project is just
    the tip of the iceberg...


    ![](img/a1548a579bd09ff29b2b92de3f565e63_13_0.png)


    # ## 01 Requirements


    Minecraft-Pi requires you to be running Raspbian on your Raspberry Pi, so if you''re
    not already running that, take a trip to raspberrypi.org and get it setup. It
    also requires you have X Window loaded too. Assuming you''re at the command prompt,
    you just need to type startx to reach the desktop.


    ![](img/a1548a579bd09ff29b2b92de3f565e63_13_1.png)


    +   - Unlike all other versions of Minecraft, the Pi version encourages you to
    hack it'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# PROGRAM MINECRAFT-PI


    # **02** Installation


    Make sure you''re already in your home folder and download the Minecraft-PI package
    with the following commands in a terminal window:


    ```

    ```bash

    cd ~

    wget  https://s3.amazonaws.com/

    assets.mine craft.net/

    pi/minecraft-pi-0.1.1.tar.gz

    ```

    ```


    To use it we need to decompress it. Copy the following into the terminal window:


    ```

    ```bash

    tar -zxvf  minecraft-pi-0.1.1.tar.gz

    ```

    ```


    Now you can move into the newly decompressed Minecraft-PI directory and try running
    the game for the first time:


    ```

    ```bash

    cd mcp

    l . /minecraft-pi

    ```

    ```


    # **03** Playing Minecraft-PI


    Have a look around the game. If you''re not familiar with Minecraft, you control
    movement with the mouse and the WASD keys. Numbers 1-8 select items in your quickbar,
    the space bar makes you jump and Shift makes you walk slowly (so you don''t fall
    off edges). ''E'' will open your inventory and double-tapping the space bar will
    also toggle the ability to fly.


    # **04** Configuring the Python API


    To take control of Minecraft with the Python API, you next need to copy the Python
    API folder from within the /mcp folder to a new location. In the terminal, type
    the following:


    ```

    ```bash

    cp -r ~/mcp/api/python/mcp  ~ /minecraft

    ```

    ```


    In this folder, we want to create a "bootstrap" Python document that connects
    the API to the game. Write the following into the terminal:


    ```

    ```bash

    cd ~ /minecraft

    nano minecraft.py

    ```

    ```


    With nano open, copy the following and then save and exit with Ctrl+X, pressing
    Y (for yes), then Enter to return to the command prompt:


    ```

    ```python

    from mcp.minecraft  import  mcp

    from mcp  import  block

    from mcp.vec3  import  Vec3

    mc = Minecraft_create()

    mc.postToChat("Mine craft  API  ->

    Connected")

    ```

    ```


    # **05** Testing your Python script


    The short script you''ve created contains everything you need to get started with
    hacking Minecraft-PI in the Python language. For it to work, you need to have
    the game already running (and be playing). To grab control of the mouse


    while in-game, you can press Tab. Open a fresh terminal window, navigate into
    your minecraft folder and start the script with the following commands:


    ```

    ```bash

    cd ~/minecraft

    python minecraft.py

    ```

    ```


    You''ll see a message appear on screen to let you know the API connected properly.
    Now we know it works, let''s get coding!


    # Full code listing


    ```

    ```python

    #!/usr/bin/env python

    from mcp.minecraft  import  Minecraft

    from mcp  import  block

    from mcp.vec3  import  Vec3

    from time  import  sleep

    import  random, math

    mc  = Minecraft_create()  # make a connection to the game

    playerPos  = mc.player.getPos()

    # function to round players float position to integer position

    def roundVec3(vec3):

    return  Vec3(int(vec3.x), int(vec3.y), int(vec3.z))

    # function to quickly calc distance between points

    def distanceBetweenPoints(point1, point2):

    xd  = point2.x  - point1.x

    yd  = point2.y  - point1.y

    zd  = point2.z  - point1.z

    return  math.sqrt((xd*xd)  + (yd*yd)  + (zd*zd))

    #  create a block in a random position

    def random_block():

    randomBlockPos  = roundVec3(playerPos)

    randomBlockPos.x  = random.randrange(randomBlockPos.x  - 50,  randomBlockPos.x  +
    50)

    randomBlockPos.y  = random.randrange(randomBlockPos.y  - 5,  randomBlockPos.y  +
    5)

    randomBlockPos.z  = random.randrange(randomBlockPos.z  - 50,  randomBlockPos.z  +
    50)

    return  randomBlockPos

    # the main loop of hide & seek

    def main():

    global  lastPlayerPos, playerPos

    seeking  = True

    lastPlayerPos  = playerPos

    randomBlockPos  = random_block()

    mc.setBlock(randomBlockPos,  block.DIAMOND_BLOCK)

    mc.postToChat("A diamond has been hidden somewhere nearby!")

    lastDistanceFromBlock  = distanceBetweenPoints(randomBlockPos,  lastPlayerPos)

    timeStarted  = time()

    while  seeking:

    # get players position

    playerPos  = mc.player.getPos()

    # has the player moved?

    if  lastPlayerPos ! = playerPos:

    distanceFromBlock  = distanceBetweenPoints(randomBlockPos,  playerPos)

    if  distanceFromBlock  < 2:

    # found it!

    seeking  = False

    else:

    if  distanceFromBlock  < lastDistanceFromBlock:

    mc.postToChat("Warmer  "  + str(int(distanceFromBlock))  + " blocks away")

    if  distanceFromBlock  > lastDistanceFromBlock:

    mc.postToChat("Cold er  "  + str(int(distanceFromBlock))  + " blocks away")

    lastDistanceFromBlock  = distanceFromBlock

    sleep(2)

    timeTaken  = time()  - timeStarted

    mc.postToChat(Well done  - " + str(int(timeTaken))  + " seconds to find the diamond")

    if __name__  == "__main__":

    main()

    ```

