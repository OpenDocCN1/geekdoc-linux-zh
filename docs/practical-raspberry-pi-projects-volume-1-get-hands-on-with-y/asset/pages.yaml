- pgno: 54
  md: '# HOW I MADE: PIPANTHER


    ![](img/a1548a579bd09ff29b2b92de3f565e63_54_0.png)


    Recharge® This panel flips right up to reveal a micro/USB port beneath, so you
    can easily recharge PiPanther between rounds


    ![](img/a1548a579bd09ff29b2b92de3f565e63_54_1.png)


    Above The PiPanther mainboard is built to be an extension that attaches directly
    on top of the Raspberry Pi’s GPIO pins. It can work with both the Model A and
    Model B Raspberry Pi’s and is capable of powering your Ubuntu-plays robot


    ![](img/a1548a579bd09ff29b2b92de3f565e63_54_2.png)


    Below Land a direct hit in Ubuntu and you’ll damage your opponent’s interface
    (it’s about a minute into Michal’s video: bit.ly/1Bn4KpN)


    the size of the Raspberry Pi and on it you have a DC-DC converter, which supplies
    5V to the Pi, powerful motor drivers, a servo controller and a USB charger, so
    you can charge PiPanther directly using a micro/USB cable – just plug it in, leave
    it for three hours and it’s charged.


    This mainboard is going to be available separately for use in custom projects
    – is that right? Exactly. To drive a tank, you need to drive two motors – the
    left track and the right track – but instead of using tracks you can just use
    two wheels, so you can build your own wheeled robot instead. The steering is exactly
    the same. If you want to go forward then you power the two motors and if you want
    to turn then you just regulate power between the left and right motors. So you
    can use this board to drive your own robot – just plug into your motors and use
    the same mainboard but with Pi and Ubuntu software. The main part


    (and the hardest part) of the Ubuntu software was to provide live video streaming
    from the PiPanther to the mobile interface. I made that at a time when nobody
    else was able to do it, but unfortunately in the meantime, several other robots
    were developed with video streaming as well. I didn’t have too much time because
    I have a small child, but you have to believe me – I was the first one to create
    a live video stream from the Raspberry Pi to Android at that time! We achieved
    a video delay of less than one second, so you can drive it around in real time.


    So how much of all this is being handled by the Raspberry Pi? The Pi runs Arch
    Linux and on that we have our PiPanther software, which is responsible for talking
    to the PiPanther mainboard using the serial interface, UART. Then that is used
    to control the motors, turret, status LEDs and give feedback from the USB charger.
    That software is written in C++ and also consists of a plugin


    controller. So if you have plugins then you can put in shared libraries that are
    loaded at runtime by this software, and using the API you can control your own
    attached plugins using standardised JSON-based protocols.


    Our website says that these custom plugins could affect Ubuntu gameplay – a robotic
    arm for a capture the flag match, for example. Yes, currently we only have the
    standard gun plugin, but if someone is familiar with electronics (and I think
    a lot of Raspberry Pi fans are) they can easily create their own plugins. I put
    a lot of effort into making the API user friendly. You can create, for example,
    an LED torch to replace one of the gun attachments and you can then drive around
    in the dark wherever you want – under your bed, behind your wardrobe – and hide
    to create sniper’s nests. Or you could create a simplified robotic arm for the
    back of the tank to throw other tanks, knock them out of the game area. You can
    also make game elements like a landmine: you can create a small torch that uses
    the same mechanism as the guns (infrared) and then put it in the arena so it explodes
    when people go near it.


    # Together we spent hundreds of hours on this project


    Like it? Find out how to make your own PiPanther plugin and see a breakdown of
    the plugin architecture over at ubuntu.com/posts/plugin-specification. Keep an
    eye on the main PiPanther page for any updates on the project.


    Further reading If you’re thinking of making your own custom Ubuntu robot, you
    can find our guide to building and controlling Raspberry Pi–powered cars inside
    Raspberry Pi The Complete Manual (bit.ly/1sgvUQ), along with plenty more besides.'
