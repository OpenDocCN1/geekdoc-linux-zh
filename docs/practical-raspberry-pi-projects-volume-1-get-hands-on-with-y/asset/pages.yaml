  md: "# HARDWARE\n\n# Controlling your Raspberry Pi-powered car\n\nControl a toy\
    \ car with a smartphone and the latest web technologies\n\nNow we have our fantastic\
    \ Rspberry Pi-powered car all wired and charged, it's time to make it come alive.\
    \ We're using the best web technologies that the JavaScript programming language\
    \ offers, to harness the natural movement of your hand and wirelessly drive the\
    \ vehicle. Each little movement will trigger an event that calculates what the\
    \ car should do and then sends it over a socket connection up to 20 times a second.\n\
    \n# What you'll need\n\n+   - A RasPi car, ready to go  \n+   - An internet connection\
    \  \n+   - A reasonably modern smartphone/tablet  \n+   - Pi car source code \
    \ \n+   github.com/shaunuk/picar\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_41_0.png)\n\
    \n# 01 Download and install the software\n\nTo get the 12C connectivity working,\
    \ you can follow the steps from pages 64–65. Next we'll need to find a home for\
    \ our new project code – how about /var/www/picar? Type sudo mkdir /var/www/picar\
    \ in the terminal to make the directory and then change into that directory: cd\
    \ /var/www/picar.\n\nNow, to download the project using Git, type sudo git clone\
    \ http://github.com/shaunuk/picar. If you haven't got Git, install it with sudo\
    \ apt-get install git.\n\nThis will download the custom software for driving the\
    \ car, but we still need the web server and some other bits before we can start\
    \ burning rubber...\n\ndoesn't work with the new technologies we're about to use.\
    \ Extract the node package by typing sudo tar -xzvf node-v0.10.21-linux-arm-pi.tar.gz.\n\
    \n# 02 Download and install Node.js\n\nWe now need to get the awesome Node.js\
    \ and its package tool, the Node package manager (npm). Type sudo wget http://nodejs.org/dist/v0.10.21/node-v0.10.21-linux-arm-pi.tar.gz.\
    \ This will download a fairly recent version of Node.js – the various Raspbian\
    \ has in its repositories is way too old and just\n\n# 03 Configure Node.js\n\n\
    To make it easy to run from everywhere, we will create symbolic links for Node\
    \ and npm binaries. In the terminal, type sudo ln -s /var/www/node-v0.10.21-linux-arm-pi/bin/node\
    \ /bin/node and then sudo ln -s /var/www/node-v0.10.21-linux-arm-pi/bin/npm /bin/npm.\
    \ Then, to get the extra modules, type npm install socket.io node-static socket.io\
    \ adufruit-i2c-pwm-driver sleep optimist\n\n# 04 Get to know the project\n\nNow\
    \ you have everything, you should see three files: the server (app.js), the client\
    \ (socket.html) and the jQuery JavaScript library for the client. The server not\
    \ only drives the servo, but it is a web server and sends the socket.html file\
    \ and jQuery to the browser when requested – it's a really neat and simple set-up\
    \ and just right for what we're trying to achieve.\n\nBelow All you need to finish\
    \ off your project is access to a smartphone or tablet\n\n# 05 Test the servos\n\
    \nOur handy little program (app.js) has a special mode just for testing. We use\
    \ two keywords here: beta for servo 0 (steering) and gamma for servo 1 (motor\
    \ control). Type node app.js beta=300 and you should see the front wheels turn.\
    \ Now the numbers need centering and with. On our example, 340 was left, 400 was\
    \ centre and 470 was right. Do the same for the motor by typing node app.js gamma=400\
    \ and take note of the various limits of your car.\n\n# 06 Configure sensible\
    \ defaults\n\nNow you know what your car is capable of, we can set the defaults\
    \ in app.js and socket.html. Edit app.js and find the section that says function\
    \ emergencyStop(). Adjust the two numbers to your car's rest values. Then open\
    \ socket.html and adjust the predefined values under 'Define your variables here'.\n\
    \n# 07 Going for a spin\n\nWe're almost ready to try it out, but you need to know\
    \ the IP address of your Pi car, so type ifconfig at the terminal. Then fire up\
    \ the app by typing node app.js. Now grab the nearest smartphone or tablet, making\
    \ sure it's on the same network as your Pi. Open the web browser and go to http://your\
    \ IP address:8080/socket.html. You should get an alert message saying 'ready'\
    \ and as soon as you hit OK, the gyro data from your phone will be sent to the\
    \ car and you're off!\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_41_1.png)"
