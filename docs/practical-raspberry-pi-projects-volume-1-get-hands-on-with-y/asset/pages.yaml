  md: '![](img/a1548a579bd09ff29b2b92de3f565e63_61_0.png)


    # # Build a Raspberry Pi Minecraft console


    Create a full-functional, Pi-powered games console that you can play Minecraft
    on and learn how to program too


    ![](img/a1548a579bd09ff29b2b92de3f565e63_61_1.png)


    **Minecraft means many things to many people, and to Raspberry Pi users it’s supposed
    to mean education.** Not everyone knows, though, that you can still have fun and
    play Minecraft as you normally would.


    Using Raspberry Pi, it is also the cheapest way to get a fully-functional version
    of Minecraft up onto your TV. However, in its normal state, just being on a TV
    isn’t the end of it. Using all the features and functions of the Pi, we can take
    it to a state more fitting of a TV by making it into a hackable, moddable Minecraft
    console.


    In this tutorial, we will show you how to set it up in terms of both software
    and hardware, how to add a game controller to make it a bit better for TV use,
    and we’ll even give you some example code on how to mod it. Now, it’s time to
    get building, so head to Step 1.


    # ## What you’ll need


    +   - Raspberry Pi 2

    +   - Latest Raspbian image

    +   raspberrypi.org/downloads

    +   - Minecraft Pi Edition

    +   minecraft.net

    +   - Raspberry Pi case

    +   - USB game controller

    +   (PS3 preferable)'
