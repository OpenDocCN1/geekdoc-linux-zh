  md: "# # Make a Raspberry Pi 2 HTPC\n\nFinally create a more powerful and capable\
    \ HTPC using the Raspberry Pi 2 and the excellent OpenELEC project\n\nWe know\
    \ people who just have a Raspberry Pi for XBMС, now called Kodi. It's a great\
    \ idea and a great use for the Pi – it works just well enough that you can easily\
    \ play media locally or over the network. The biggest issue came with GUI response\
    \ on the original Model Bs, and a lack of USB ports for connecting up everything\
    \ that you want.\n\nWhile optimisation over the last few years has helped, the\
    \ leap to Raspberry Pi 2 has basically solved all of these problems by giving\
    \ you much more powerful hardware to play with. So if you're looking to upgrade\
    \ or finally take the plunge, this handy guide will help you create the perfect\
    \ Raspberry Pi 2 HTPC.\n\n+   01  **Choose the software**\n+   In the past, Pi\
    \ HTPCs were just a choice between RaspBMC and OpenELEC. However, RaspBMC is on\
    \ a bit of a hiatus and OpenELEC is your best bet for getting the most up-to-date\
    \ software. There's not a massive difference between the two, as they both run\
    \ XBMC.\n+   \n+   02  **Get the software**\n+   Head over to openelec.tv and\
    \ look for the Download section. There's a specific Raspberry Pi section which\
    \ is split up into original (ARMv6) Pi and the newer Raspberry Pi 2 (ARMv7). Grab\
    \ the image file from this page for the Pi 2.\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_45_0.png)\n\
    \n+   **What you'll need**\n+   \n+   - OpenELEC openelec.tv\n+   - HDMI cable\n\
    +   - USB IR receiver\n+   - IR remote\n+   - Case\n+   - Dedicated power supply\n\
    +   - Optional USB storage"
  merge: -1
  img_proc: true
- pgno: 46
  md: "# MAKE A RASPBERRY PI 2 HTPC\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_46_0.png)\n\
    \n+   **03** Install to card\n+   \n+   Open up the terminal and use `file -t`\
    \ to determine where your SD card is located on your system. Something like /dev/sdb\
    \ or /dev/mmcblk0 will be ideal. Navigate to the image using `cd` and install\
    \ it with `dd` using:\n\n```\n$ dd bs=1M if=OpenELEC-RPi2_arm-5.0.5.img of=/dev/mmcblk0\n\
    ```\n\n+   **04** First boot\n+   \n+   Plug in your Raspberry Pi, either to your\
    \ TV or to another screen just to begin with, and turn it on. OpenELEC will resize\
    \ the SD card partitions and write a few extra programs before finally booting\
    \ into Kodi.\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_46_1.png)\n\n> Above\
    \ Kodi really is designed to be used with a remote, and there are some great guides\
    \ to using them on the OpenELEC site: bit.ly/1B0aErV\n\n+   **05** Configure Kodi\n\
    +   \n+   Go through the basic wizard to get through the interface – if you are\
    \ connecting via wireless you will need to go to OpenELEC in the System menu and\
    \ activate the wireless receiver before selecting your network and then entering\
    \ your password.\n\n+   **06** Add network shares\n+   \n+   You can stick a portable\
    \ hard drive or USB stick into the Pi for storage, but the best method is really\
    \ to stream over the network. Go to File manager under System and Add source.\
    \ Go to Browse and choose your network protocol to access the network or alternatively,\
    \ add it manually.\n\n+   **07** Build your media centre\n+   \n+   Placement\
    \ of your Raspberry Pi is important. As it’s going to be out all the time, we\
    \ highly recommend getting a case for it – the Pibox cases from Pimoroni are quite\
    \ well suited for this type of use as they are sturdy and can be attached to the\
    \ rear of some TVs.\n\n# Live TV\n\n+   **08** IR sensors and controllers\n+ \
    \  \n+   Kodi can be controlled with a number of different things – including\
    \ USB game controllers and compatible IR sensors. We’ve used FLIRC in the past,\
    \ but if you have your Pi behind the TV, you’ll need a sensor on a wire that can\
    \ stretch to a useful position.\n\n+   Kodi does have the ability to use TV as\
    \ a tuner, and you can also record stuff as well as being a TV tuner, a list of\
    \ these is available here: bit.ly/1r3mEVJ\n\n+   **09** Irid updates\n+   \n+\
    \   OpenELEC has the excellent ability to update itself without needing you to\
    \ reinstall it every few months, meaning you won’t need to do much maintenance\
    \ on it at all. Now you can sit back and enjoy your media much easier than before."
  merge: -1
