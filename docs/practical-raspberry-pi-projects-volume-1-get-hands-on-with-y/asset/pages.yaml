    \ described in the Figure B image on the next page.\n\n# 04 Separate concerns\n\
    \nChip two goes by the name of 74HC244, which is described as an octal buffer\
    \ with tri-state capability. Tri-State outputs can physically disconnect themselves\
    \ from the bus line. This permits you to tie their outputs together without fear\
    \ of short circuits. As long as all but one chip are in tri-state mode, no current\
    \ can flow between high and low output pins.\n\n# 05 Round them up\n\nFour GPIO\
    \ pins control the currently-enabled 'line' of the display. Three pins configure\
    \ the address which is to be emitted, while the signal emitted from the fourth\
    \ pin is connected to the activity inputs. This ensures that but one IC is active.\
    \ The 74HC244 ensures that but one of the two groups is active at any given time.\n\
