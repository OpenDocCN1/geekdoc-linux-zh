- pgno: 9
  md: '# # Make music with the Raspberry Pi


    Program your own melodies using Sonic Pi and create musical cues or robot beeps


    # **What you''ll need**


    +   - Portable speakers

    +   - Sonic Pi

    +   www.element14.com/projects/raspberry-pi-sonic-pi-teaching-kit


    One of the major features of Scratch is its ability to teach the fundamentals
    of coding to kids and people with no computing background. For kids, its especially
    appealing due to the way it allows them to create videogames to interact with
    as part of their learning. In this kind of vein, then, Sonic Pi teaches people
    to code using music. With a simple language that utilises basic logic steps but
    in a more advanced way than Scratch, it can either be used as a next step for
    avid coders, or as a way to create music for an Internet of Things or a robot.


    # ## 01 Getting Sonic Pi


    If you''ve installed the latest version of Raspbian, Sonic Pi will be included
    by default. If you''re still using a slightly older version, then you''ll need
    to install it via the repos. Do this with:


    ```

    ```

    $ sudo apt-get install sonic-pi

    ```

    ```


    ![](img/a1548a579bd09ff29b2b92de3f565e63_9_0.png)


    ![](img/a1548a579bd09ff29b2b92de3f565e63_9_1.png)


    +   - Sonic Pi is a great way to learn basic coding principles and have fun'
  merge: -1
  img_proc: true
