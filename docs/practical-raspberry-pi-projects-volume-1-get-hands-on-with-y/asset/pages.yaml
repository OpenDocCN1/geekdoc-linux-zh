  md: "# HARDWARE\n\nThe wires need to be long enough to reach the back of the Bigtrak,\
    \ so be generous!\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_51_0.png)\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_51_1.png)\n\
    \n![](img/a1548a579bd09ff29b2b92de3f565e63_51_2.png)\n\n# 06 Rewire the motor\n\
    \nRemove the solder connecting the PCB to the motors (a solder mop is useful here)\
    \ and then remove the PCB. With the PCB removed we can now attach wires to the\
    \ motors in order to drive them from the Raspberry Pi, as opposed to the on-body\
    \ commands. The wires will need to be long enough to reach the back of the Bigtrak,\
    \ so be generous – after all, it’s far easier to trim long wires to length than\
    \ replace short wires entirely! Having installed all of the wires, you can now\
    \ replace the engine back into the Bigtrak.\n\n# 07 Connect the motor driver\n\
    \nWith the motors back in place we now need to build up a circuit to drive it\
    \ from the Raspberry Pi. We’ve used a ribbon cable to connect the GPIO pins on\
    \ the Raspberry Pi to a breadboard, before connecting it up to a Dual Motor Driver\
    \ [http://proto-pic.co.uk/motor-driver-1a-dual-tb6612fn] to actually drive the\
    \ motors. This keeps the higher voltage the motors require away from the sensitive\
    \ GPIO pins.\n\nThe connections made on the breadboard are listed in the table\
    \ below. These values will be needed when writing the software and may be different\
    \ depending on the breakout board you are using, and the Raspberry Pi revision.\n\
    \nRPi GPIO  Motor Driver  \n24        AIN2  \n17        AIN1  \n18        STBY\
    \  \n21        BIN1  \n22        BIN2\n\nWith the PWM A and PWM B pins directly\
    \ connected to the 3.3V power rail, the motors will now always run at full speed\
    \ for as long as they’re active.\n\n# 08 Install the breadboard\n\nThe breadboard\
    \ is going to be installed on top of the battery compartment inside the Bigtrak,\
    \ so the wires from the motors should be brought to the back to the unit and cable-tied\
    \ into place. The wires to the batteries can also be brought back to the same\
    \ place to help keep things tidy.\n\n# 09 Wire it all together\n\nIn order to\
    \ easily connect the motors and batteries to the breadboard we have soldered some\
    \ modular connector plugs to the ends of the cable, allowing them to just push\
    \ into place (these are available from www.maplin.co.uk/ modular-connectors-5348).\n\
    \nWith the breadboard installed (sticking it into place for support) we can now,\
    \ after double-checking all the connections, plug the motors and power into it.\
    \ To know when the motors are enabled (and reduce the chance of unexpected movement),\
    \ the LED can be connected to the breadboard so that it lights up whenever the\
    \ ‘standby’ pin is active, using a resistor to ensure it doesn’t pull too much\
    \ current and go ‘pop’.\n\n# 10 Provide power\n\nPower for the Raspberry Pi is\
    \ supplied via a USB battery pack that is installed on top of the engine and can\
    \ be held in place by a couple of cable ties or a Velcro strip. This type of battery\
    \ is typically sold as a portable mobile phone or iPad charger – the one used\
    \ here is rated at 8000mAh, able to power the Raspberry Pi for up to eight hours."
