- pgno: 110
  md: "# BUILD A RASPBERRY PI CAR COMPUTER\n\n# 13 Sound configuration\n\nBefore configuring\
    \ speech support for Navit, configure the external sound card. You have to stop\
    \ the Broadcom module from loading and remove some Raspberry-Pi-specific ALSA\
    \ (Advanced Linux Sound Architecture). To do this, sudo-edit /etc/modprobe and\
    \ comment out (i.e., prefix out) with a #:\n\n```\n# snd-bcm2835\n```\n\nThen\
    \ run:\n\n```\n# sudo rm /etc/modprobe.d/alsa*\n```\n\nReboot for the changes\
    \ to take effect. Use alsamixer to set the volume on the if it's too quiet.\n\n\
    # 14 Download a voice\n\nThe speech synthesis software needs a voice and a proprietary\
    \ binary. You can get both by completing the following steps:\n\n```\n# sudo mkdir\
    \ -p /usr/share/ mbrola/voices/\n```\n\n```\n# wget http://www.tcts.fmsa.ac.be/\
    \ synthesis/nbr ola/aba/en1/en1- 980910.zip\n```\n\n```\n# unzip en1-980910.zip\n\
    ```\n\n```\n# sudo cp en1/en1 /usr/share/ mbrola/voices/\n```\n\n```\n# wget http://www.tcts.fmsa.ac.be/\
    \ synthesis/nbr ola/bin/raspberry pi_ pi/nbr ola.tgz\n```\n\n```\n# tar zxf mbr\
    \ ola.tgz\n```\n\n```\n# sudo mv mbr ola /usr/local/bin/\n```\n\n# 15 Create speech\
    \ script\n\nNavit supports speech by running an external script and passing the\
    \ text to speak as an argument. Create one using:\n\n```\n# cd /home/pi/navit\n\
    ```\n\n```\n# wget http://11iamfraser.co.uk/ lud/carsi/chime.wav\n```\n\n```\n\
    # touch speech.sh\n```\n\n```\n# chmod +x speech.sh\n```\n\nNow edit speech.sh:\n\
    \n```\n#!/bin/bash\na play -r 44100 /home/pi/navit/chime.wav\n# espeak -vmb-en1\
    \ -s 110 -a 150\n-p 50 \"$1\"\n```\n\nFinally, test it with:\n\n```\n# ./speech.sh\
    \ 'Hello World'\n```\n\n# Full code listing\n\n```\ntry:\n    r = requests.get(api_req)\n\
    \    except requests.exceptions.RequestException as e:\n    return e\n\n    return\
    \ WeatherClient. usedata(r .json())\n\nclass CarLauncher:\n    def __init__(self):\n\
    \        pygame.init()\n        pygame.mixer.quit() # Don't need sound\n     \
    \   screen_info = pygame.display.info()\n        self.screen = pygame.display.set_mode((screen_info.current_w,\
    \ screen_info.current_h))\n        pygame.display.set_caption('Car Launcher')\n\
    \        self.titlefont = pygame.font.Font(None, 100)\n        self.wfont = pygame.font.Font(None,\
    \ 30)\n        self.w_text = None # Weather text\n\ndef clean_background(self):\n\
    \    background = pygame.Surface(self.screen.get_size())\n    self.background\
    \ = background.convert()\n    self.background.fill((0, 0, 0))\n\n    # Render\
    \ title centered\n    text = self.titlefont.render(\"CarPi Launcher\", 1, (255,\
    \ 255, 255))\n    textpos = text.get_rect()\n    textpos.centerx = self.background.get_rect().centerx\n\
    \    self.background.blit(text, textpos)\n\n    self.screen.blit(self.background,\
    \ (0,0))\n    pygame.display.flip()\n\ndef main_menu(self):\n    # Since maps\
    \ text -> Rectangles we can do collision detection on\n    self.bttns = ('Music'\
    \ : None, 'NAV' : None, 'Weather' : None}\n\n    item_num = 1\n    for key in\
    \ self.bttns:\n        text = self.titlefont.render(key, 1, (255,255,255))\n \
    \       textpos = text.get_rect()\n        max_width = self.background.get_rect().width\
    \ / len(self.bttns)\n        center_offset = max_width * 0.5\n        # This y\
    \ pos puts buttons just below title\n        textpos.centery = self.background.get_rect().centery\
    \ / 2\n        textpos.centerx = (max_width * item_num) - center_offset\n    \
    \    self.bttns[key] = textpos\n        self.screen.blit(text, textpos)\n    \
    \    item_num += 1\n\n    pygame.display.flip()\n\ndef select_rect(self, rect,\
    \ text):\n    # Colour a rect the user has clicked in green\n    surface = pygame.Surface(rect.w,\
    \ rect.h)\n    surface.fill((0, 255, 0))\n    # Also need to draw the text over\
    \ it again\n    t = self.titlefont.render(text, 1, (255,255,255))\n    surface.blit(t,\
    \ (0,0))\n    self.screen.blit(surface, rect)\n    pygame.display.flip()\n```"
