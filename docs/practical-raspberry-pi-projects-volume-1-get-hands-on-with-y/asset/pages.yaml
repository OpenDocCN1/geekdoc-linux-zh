  md: "# RASPBERRY PI STOP MOTION ANIMATION\n\n# 03  Final setup\n\nWe're going to\
    \ install Pi-Motion with Git, so let's make sure it's installed:\n\n```\n$ sudo\
    \ apt-get install git\n```\n\nWith a terminal open, navigate to your home directory\
    \ (with  cd  ~) and type:\n\n```\n$ git clone https://github.com/\\ russb78/pi-motion.git\n\
    ```\n\nIf you play with the code and break it, you can revert it back to its original\
    \ state with:\n\n```\n$ git checkout pi-motion.py\n```\n\n# 04  Running and testing\
    \ Pi-Motion\n\nNow navigate into the pi-motion folder and run the application\
    \ with:\n\n```\n$ python pi-motion.py\n```\n\nPressing the space bar calls  take_pic()\
    \  from the main() loop, which saves an image and creates a preview that's loaded\
    \ by  update_display().  The Tab button is coded to toggle between two states\
    \ by asking two variables to switch values.\n\n# 05  Getting animated\n\nThe main()\
    \ loop checks for keyboard events before updating the screen around 30 times per\
    \ second. Since the camera's live preview is working independently of that loop,\
    \  update_display()  only needs to worry about updating the preview image (prev_pic).\
    \ Space calls  take_pic()  and adds to  pics_taken,  only the very latest picture\
    \ is shown. The  animate()  function is essentially a microstream of  update_display().\
    \  When the P key is pressed, the live preview is suspended and for all of the\
    \ pictures taken (pics_taken), each one will be 'blitted' (updated) on the main\
    \ window.\n\n# Full code listing\n\n```\nimport pygame, picamera, os, sys\n\n\
    pics_taken = 0\ncurrent_alpha, next_alpha = 128, 255\nfps = 5\n\npygame.init()\n\
    res = pygame.display.list_modes() # return the best resolution\nfor your monitor\n\
    width, height = res[0]\nprint( 'Reported resolution is:' , width, \"x\" , height\
    \ )\nstart_pic = pygame.image.load(os.path.join('data', 'start_screen.jpg'))\n\
    start_pic_fix = pygame.transform.scale(start_pic, (width, height))\nscreen = pygame.display.set_mode(width,\
    \ height)\npygame.display.toggle_fullscreen()\npygame.mouse.set_visible = False\n\
    play_clock = pygame.time.Clock()\ncamera = picamera.PiCamera()\ncamera.resolution\
    \ = (width, height)\n\ndef take_pic():\n    global pics_taken, prev_pic\n    pics_taken\
    \ += 1\n    camera.capture(os.path.join('pics', 'image_' + str(pics_taken) + '.jpg'),\
    \ use_video_port = True)\n    prev_pic = pygame.image.load(os.path.join('pics',\
    \ 'image_' + str(pics_taken) + '.jpg'))\n\ndef delete_pic():\n    global pics_taken,\
    \ prev_pic\n    if pics_taken >= 1:\n        pics_taken = 1\n        prev_pic\
    \ = pygame.image.load(os.path.join('pics', 'image_' + str(pics_taken) + '.jpg'))\n\
    \ndef animate():\n    camera.stop_preview()\n    for pic in range(1, pics_taken):\n\
    \        anim = pygame.image.load(os.path.join('pics', 'image_' + str(pic) + '.jpg'))\n\
    \        screen.blit(anim, (0, 0))\n        play_clock.tick(fps)\n        pygame.display.flip()\n\
    \        play_clock.tick(fps)\n        camera.start_preview()\n\ndef update_display():\n\
    \    screen.fill((0,0,0))\n    if pics_taken > 0:\n        screen.blit(prev_pic,\
    \ (0, 0))\n        play_clock.tick(30)\n        pygame.display.flip()\n\ndef make_movie():\n\
    \    camera.stop_preview()\n    print (\"\\nQuitting Pi-Motion to transcode your\
    \ video.\")\n    os.system( 'avconv -r \"' + str(fps) + ' \" -i \"' + str(os._path.join('pics',\
    \ 'image_%d.jpg')) + ' \" -vcodec libx264 video.mp4')\n    sys.exit(0)\n\ndef\
    \ change_alpha():\n    global current_alpha, next_alpha\n    camera.stop_preview()\n\
    \    current_alpha, next_alpha = next_alpha, current_alpha\n    return next_alpha\n\
    \ndef quit_app():\n    camera.close()\n    pygame.quit()\n    print ('You've taken',\
    \ pics_taken, \" pictures. Don't\" + \",\\nforget to back them up!\"\n    sys.exit(0)\n\
    \ndef intro_screen():\n    intro = True\n    while intro:\n        for event in\
    \ pygame.event.get():\n            if event.type == pygame.KEYDOWN:\n        \
    \        if event.key == pygame.K_ESCAPE:\n                    quit_app()\n  \
    \              elif event.key == pygame.K_F1:\n                    camera.start_preview()\n\
    \                    intro = False\n                screen.blit(start_pic_fix,\
    \ (0, 0))\n                pygame.display.update()\n```\n\n```\ndef main():\n\
    \    intro_screen()\n    while True:\n        for event in pygame.event.get():\n\
    \            if event.type == pygame.KEYDOWN:\n                if event.key ==\
    \ pygame.K_ESCAPE:\n                    quit_app()\n                elif event.key\
    \ == pygame.K_SPACE:\n                    take_pic()\n                elif event.key\
    \ == pygame.K_BACKSPACE:\n                    delete_pic()\n                elif\
    \ event.key == pygame.K_RETURN:\n                    make_movie()\n          \
    \      elif event.key == pygame.K_TAB:\n                    camera.preview_alpha\
    \ = change_alpha()\n                elif event.key == pygame.K_F1:\n         \
