  md: '# HARDWARE


    ![](img/a1548a579bd09ff29b2b92de3f565e63_57_0.png)


    Above Screenty Pro can manage multiple screens and has cloud storage too


    # Screenty Pro Edition


    In this tutorial we have used the open source version of Screenty – Screenty OSE.
    This is a fantastic bit of software and a great addition to the open source ecosystem.
    At this point, some of you may be dreaming of huge remote-managed display screen
    networks and the good news is that this is entirely possible with Screenty Pro.
    This is completely free for a single display screen and 2GB of storage, and it
    has larger packages for purchase starting at two screens right up to 130+ screens.
    It also adds a lot of additional features not seen in Screenty OSE – find out
    more about those on the Screenty website (bit.ly/1EX92p).


    ![](img/a1548a579bd09ff29b2b92de3f565e63_57_1.png)


    # 08 Disable Screenty video output


    Load the IP displayed on the splash screen on the browser of a different computer
    (you won’t be able to do it directly from the same Pi). The Screenty OSE dashboard
    should now load. Once inside the dashboard, move the slider for Big Buck Bunny
    to the OFF position or delete the asset entirely.


    # 09 Enter the command line


    Once you have disabled the Big Buck Bunny trailer from the web interface, you
    should now be able to enter the command line easily and you can do this by pressing
    Ctrl+Alt+F1 on the attached keyboard at any time. Alternatively, you can access
    the command line over SSH using the same IP address as shown previously on the
    splash screen.


    # 10 Run the update script


    The image file we downloaded from the website is actually just a snapshot release
    and does not necessarily include the latest Screenty OSE code, as the code updates
    are made more regularly than the image. It is therefore good practice to run an
    upgrade to the latest version using the built-in script. You can run the following
    command:


    ```

    ~/screenty/misc/run_upgrade.sh

    ```


    # 11 Configure Raspberry Pi


    Once you are successfully at the command line, you need to type **sudo raspi-config**
    to enter the settings and then select “1 Expand root file system” to make sure
    you have access to all of the space on the SD card. Then, change the time zone
    (option 4 and then 12) so that it is correct for your location. If your screen
    has black borders around the edge you may also need to disable overscan (option
    8 and then A1). We would also recommend changing the default password to something
    other than raspberry to stop any would-be hackers from easily accessing the Raspberry
    Pi via SSH (option 2). Once complete, exit without restarting by selecting Finish
    and then No.


    # 12 Enable and set up Wi-Fi


    As Screenty runs on top of Raspbian, the Wi-Fi setup is essentially the same as
    the standard command line step within the OS. In order to do this you need to
    edit the interfaces file using **sudo nano /etc/network/interfaces** and then
    type in the following code, replacing ssid and password with the actual values:


    ```

    auto lo


    iface lo inet loopback


    auto wlan0


    allow-hotplug wlan0


    auto wlan0


    iface wlan0 inet dhcp


    wpa-ssid "ssid"


    wpa-psk "password"


    iface default inet dhcp

    ```


    Then exit and save by hitting Ctrl-X, then Y and then Return.'
