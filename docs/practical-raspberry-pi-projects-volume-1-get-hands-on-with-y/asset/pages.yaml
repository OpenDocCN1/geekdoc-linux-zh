- pgno: 63
  md: '# **HARDWARE**


    ![](img/a1548a579bd09ff29b2b92de3f565e63_63_0.png)


    **Getting power to the Raspberry Pi 2 so that it runs properly can be tricky if
    you''re using a USB port**


    # **3D-print a case**


    Aaron Hicks at Solid Technologies designed this *Minecraft* case for the Raspberry
    Pi and shared it on **GrabCAD**. We''ve uploaded our slightly modified version
    to **FileSilo.co.uk** along with your tutorial files for this issue. All you need
    to do is send the STL file to a 3D printing service – many high street printing
    shops have at least a MakerBot these days – and they will 3D-print the case for
    you. It should only cost around £15.


    ![](img/a1548a579bd09ff29b2b92de3f565e63_63_1.png)


    **10** **The correct case** In this scenario, we''re hooking this Raspberry Pi
    up to a TV, which means it needs a case so that there''s less chance of damage
    to the components from dust or static. There are many good cases you can get –
    we are using the **Pimorini Pibow** here as you can mount it to the back of the
    TV. Alternatively, you could get really creative and 3D-print your own case, as
    you can see on page 58. Check out the boxout just to the left.


    **11** **Find the right power supply** Getting power to the Raspberry Pi 2 so
    that it runs properly can be tricky if you''re using a USB port or a mobile phone
    charger – the former will be underpowered and the latter is not always powerful
    enough. Make sure you get a 2A supply, like the official **Raspberry Pi** one.


    **12** **Go wireless** We understand that not everyone has an ethernet cable near
    their TV, so it may be a good idea to invest in a Wi-Fi adapter instead. There
    is a great list of compatible Wi-Fi adapters on the eLinux wiki: **elinux.org/RPI_WifiVerifiedPeripherals**.


    **13** **Mouse and keyboard** Now that we have the Raspberry Pi ready to be hooked
    up, you should look at your controller situation – do you want to be limited by
    the wires or should you get a wireless solution instead? We will cover controller
    solutions over the page, but it''s worth considering now.


    **14** **Get ready for SSH** It will be easier to create and apply scripts to
    *Minecraft* by uploading them via the network rather than doing it straight on
    the Pi. In the terminal, find out what the IP address is by using **ifconfig**,
    and then you can access the Pi in the terminal of another networked computer using
    the following:


    ```

    $ ssh pi@IP_address]

    ```


    **15** **Have a play** At this stage, what we have built is a fully-functional
    *Minecraft* console. Now, at this point you could start playing if you so wish
    and you don''t need to add a controller. You can flip over to page 82 now if you
    want to begin learning how to mod your *Minecraft* and do a bit more with it to
    suit your needs. However, if you do want to add controller support then carry
    on and take a look at Step 16.'
