  md: '![](img/a1548a579bd09ff29b2b92de3f565e63_81_0.png)


    # **What you''ll need**


    +   Raspberry Pi Model B

    +   ExpEYES kit

    +   (£29/$49/£52)


    # # Run science experiments on the ExpEYES kit


    ExpEYES is a cheap digital oscilloscope with a signal generator and other features,
    making it the ultimate tool for electronics


    ExpEYES is a relatively unheard of but very impressive hardware and software platform
    for science and electronics experimentation, as well as a useful electronic probing
    tool for makers and professionals alike. It is also open source on both the hardware
    and software sides, which makes it affordable and versatile.


    ExpEYES is billed as a science and experimentation kit but really it is much more
    than that – it is a fully-functioning four-channel digital oscilloscope with an
    impressive array of features. ExpEYES ships with a wealth of online documentation
    in a variety of formats (graphics, user guides, web content), including upwards
    of 50 suggested experiments, and the kit itself contains all of the hardware required
    to play with the interesting science of electronics contained within the guide
    material.


    The aim is to enable the learning of what can be complex concepts of electronics
    in an easy and affordable way, without getting bogged down in the arcane details.
    Paired with our favourite little single-board computer, the Raspberry Pi, you
    have an extremely powerful and affordable device.


    ![](img/a1548a579bd09ff29b2b92de3f565e63_81_1.png)


    # **01** Get the parts


    ExpEYES is available to purchase from a variety of online vendors, including CPC
    (http://cpc.farnell.com), for around £50. It is possible to get the kit slightly
