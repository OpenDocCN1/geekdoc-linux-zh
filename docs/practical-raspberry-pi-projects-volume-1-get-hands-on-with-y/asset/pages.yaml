- pgno: 24
  md: "# CREATE A RASPBERRY PI THREE-COLOUR LAMP\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_24_0.png)\n\
    \n# 02 **Populate the breadboard**\n\nThe circuit for this project might look\
    \ a little complicated at first glance, but actually there’s very little going\
    \ on. As you’d expect, we want to control the LED light using PWM-enabled pins\
    \ (to have fine-grained control of the brightness) and the potentiometers (pots)\
    \ are being read by the analogue pins.\n\n# 03 **Connect the Arduino and Raspberry\
    \ Pi**\n\nAssuming you don’t plan to write up the code immediately yourself, you\
    \ can grab it from the disc or from the website and drop it in your home folder.\
    \ With the USB cable from the Arduino plugged into the Raspberry Pi, you simply\
    \ need to run the code with the following:\n\n```\npython RGB_Mixer.py\n```\n\n\
    Adjust the pots for the corresponding colour of the LED and the colours should\
    \ change. If the pots are adjusting the wrong colours, just swap them over. You\
    \ could use a table-tennis ball or plastic mug to cover the light to great effect.\n\
    \n# Full code listing\n\n```\n```python\n#!/usr/bin/env python\n\nfrom nanpy import\
    \ Arduino\nfrom time import sleep\n\n# set LED pin numbers – these go to the\n\
    # Digital pins of your Arduino\nredPin = 3\ngreenPin = 6\nbluePin = 9\n\n# set\
    \ pot pin numbers – these go to the\n# (Analog) pins of your Arduino\npot_r_Pin\
    \ = 0\npot_g_Pin = 3\npot_b_Pin = 5\n\n#set three coloured pins as outputs\nfor\
    \ pins in (redPin, greenPin, bluePin):\n    Arduino.pinMode(pins, Arduino.OUTPUT)\n\
    \n# set pot pins as inputs\nfor pins in (pot_r_Pin, pot_g_Pin, pot_b_Pin):\n \
    \   Arduino.pinMode(pins, Arduino.INPUT)\n\n# prints values to the terminal when\
    \ True\ndebug = False\n\ndef get_pots():\n    \"\"\"\n    Grab a reading from\
    \ each of the pot pins and\n    send it to a tuple to be read by the colour mixer\n\
    \    \"\"\"\n\n    r = Arduino.analogRead(pot_r_Pin) / 4\n    g = Arduino.analogRead(pot_g_Pin)\
    \ / 4\n    b = Arduino.analogRead(pot_b_Pin) / 4\n    Arduino.delay(1)\n    return\
    \ r, g, b\n```\n```\n\nthe colours should change. If the pots are adjusting the\
    \ wrong colours, just swap them over. You could use a table-tennis ball or plastic\
    \ mug to cover the light to great effect.\n\n# 04 **Setting up the pins**\n\n\
    As we demonstrated in the last project, it’s easy to name and use the Arduino\
    \ pins with Nanpy – in our code we’ve used two simple for loops to do the job.\
    \ The debug value below simply prints the values of each pot to the terminal –\
    \ very useful for debugging or getting a better handle on the code.\n\n# 05 **Functional\
    \ operation**\n\nThere are only really three main functions here, written with\
    \ self-explanatory names. Firstly, get_pots() reads in the analogue pin value\
    \ associated with each pot-pin and returns a tuple of the value for red, green\
    \ and blue respectively. This is used by the colour_mixing() function to assign\
    \ values to each of the associated PWM pins to change the colours of the LED.\n\
    \n# 06 **Keeping things running**\n\nThe main() function is where the other functions\
    \ are set to work. Inside the function, we’re asking Python to mix the colours\
    \ (and print the values if debug is True forever, except if we press Ctrl+C –\
    \ initating the keyboard interrupt). Since we want to clean up after ourselves,\
    \ this action will trigger close_pins() – this turns off the pins attached to\
    \ the LED, ready to be used next time.\n\n```\n```python\ndef colour_mixing():\n\
    \    \"\"\"\n    Call get_pots() and set\n    the colour pins accordingly\n  \
    \  \"\"\"\n\n    r, g, b = get_pots()\n    Arduino.analogWrite(redPin, r)\n  \
    \  Arduino.analogWrite(greenPin, g)\n    Arduino.analogWrite(bluePin, b)\n   \
    \ Arduino.delay(1)\n\ndef close_pins():\n    \"\"\"\n    Close pins to quit cleanly\
    \ (doesn’t work with a ‘for loop’ despite the pins happily initialising that way!)\n\
    \    \"\"\"\n    Arduino.digitalWrite(redPin, Arduino.LOW)\n    Arduino.digitalWrite(greenPin,\
    \ Arduino.LOW)\n    Arduino.digitalWrite(bluePin, Arduino.LOW)\n\ndef main():\n\
    \    \"\"\"\n    Mix the colours using three pots.\n    Ctrl+C cleans up the pins\
    \ and exits.\n    \"\"\"\n    try:\n        print(\"Adjust the pots to change\
    \ the colours\")\n        while True:\n            colour_mixing()\n         \
    \   sleep(0.2)\n            if debug:\n                print(\"Red: {} | Green:\
    \ {}\".format(r, g, b))\n            except KeyboardInterrupt:\n             \
    \   close_pins()\n                print(\"\\nPins closed\")\n    if __name__ ==\
    \ ‘_main_’:\n        main()\n```\n```\n\n# You’ll learn…\n\n+   1.  **Analogue\
    \ inputs**\n+   \n+   It is possible to utilise analogue inputs with the Raspberry\
    \ Pi using an analogue to digital converter (ADC) chip like the MCP3008, but they’re\
    \ much easier to handle with an Arduino using Nanpy.\n\n+   2.  **Comment your\
    \ code!**\n+   \n+   We’ve tried to adhere to the best practices for commenting\
    \ Python code in this project. We’re using ‘#’ comments before assignments and\
    \ quoted comments within functions.\n\n# Get the code:\n\nbit.ly/1vZ5sGL"
