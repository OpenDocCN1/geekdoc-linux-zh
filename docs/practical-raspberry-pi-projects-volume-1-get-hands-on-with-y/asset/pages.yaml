    # How I made: PiPanther


    Battle your friends in augmented reality


    # Tell me more about your hackable gaming tank.


    The PiPanther robot is a smart, fast vehicle that you control using the Ubtota
    app on your smartphone. As it explores rooms, you can set up battlefields anywhere
    and fight your friends using the Ubtota software. Plus you can customise the tank
    with your own attachments. Unfortunately, we were only able to make around 22%
    (€5,000/€5,000) of our Kickstarter fund-raising goal. It''s just not enough for
    a large production run.


    Have you got any further plans for PiPanther, once the Kickstarter campaign has
    come to an end?

    Well it''s not 100 percent ready - I mean, it is ready but it needs a little


    more work. When working on it I found several issues that needed to be fixed,
    both mechanical and electronic. My colleague and I (the electronics guy) spent
    hundreds, if not thousands of hours on this project but still more needs to be
    done. To be honest, the biggest problem is the casing - this white casing is 3D-printed,
    and because I designed it using relatively thin and highly precise elements, I
    couldn''t use the cheaper 3D printers that you can buy for a few hundred pounds.
    Instead I had to order the casing in from a specialised company that used selective
    laser sintering. So it''s more expensive and the casing is very, very precise,
    but that expense is not acceptable for the production of the PiPanther on a large
    scale.


    # So what makes up the PiPanther - what are the main components?


    Currently the chassis consists of four elements. Then there''s a Raspberry Pi,
    our PiPanther mainboard on top of that, two DC motors, two gearboxes, the tracks,
    one servo to rotate the turret. Then inside the turret there''s a mounted USB
    hub, because I designed PiPanther to use the Raspberry Pi Model A+, since it''s
    smaller and cheaper, but it only has one USB port. So on the turret you have two
    USB plug-ins and threr you have two USB port is for the Wi-Fi. We also have a
    Li-Po battery at the bottom of the chassis.


    # Can you tell me more about the PiPanther mainboard?


    We designed it ourselves - it''s half


    ![](img/a1548a579bd09ff29b2b92de3f565e63_53_2.png)


    Michael Oskitaki is a professional C# software developer with a masters degree
    in Computer Science from Adam Mickiewicz University. He loves to work on projects
    combining innovation, robotics, electronics and mechanics.'
