  md: '![](img/a1548a579bd09ff29b2b92de3f565e63_2_0.png)


    # Welcome to

    Practical

    Raspberry Pi

    Projects


    For a device that can fit in the palm of your hand, the Raspberry Pi has had a
    pretty colossal impact since its launch in 2012. In just a few short years it’s
    changed the way computer science is taught in schools, it’s been used in some
    amazing projects at Raspberry Jam events across the world, and it’s inspired a
    new generation of coders to create and craft new gadgets. No matter your age or
    experience level, there’s a Pi project for you, and in Practical Raspberry Pi
    Projects we’re giving you everything you need to fire up your imagination and
    unleash your creativity. From hardware-based projects like building a Raspberry
    Pi-controlled car, through software projects like programming your own virtual
    assistant, all the way to advanced electronics projects that will see you transforming
    your Pi into a drum machine, car computer or quadcopter, we’ve got plenty here
    to keep you busy. All you need is your favourite $35 computer and a passion for
    making things!'
