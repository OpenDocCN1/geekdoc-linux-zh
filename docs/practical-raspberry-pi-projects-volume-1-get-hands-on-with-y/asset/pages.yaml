- pgno: 96
  md: '# TURN YOUR PI INTO A MOTION SENSOR WITH SIMPLECV


    ![](img/a1548a579bd09ff29b2b92de3f565e63_96_0.png)


    # You can look for blobs – continuous light regions


    In this case, you can use the function ''img.findSkinToneBlobs()''. You can use
    a binary filter threshold to set what constitutes a skin tone. If you need to
    do more, you have access to all of the underlying OpenCV functionality. One of
    these more advanced functions is face recognition. You can use the function ''img.findHaarFeatures()''
    to look for a known type of object. If you wanted to look for faces, you could
    use something like:


    ```

    faces = HaarCascade(''~/SimpleCV/Features/HaarCascades/face.xml'',''myFaces'')

    img.findHaarFeatures(faces)

    ```


    When you start developing these types of programs, one thing that might come to
    mind is timing issues. You want to be sure that your code is fast enough to catch
    everyone that may be moving through the field of the camera. In order to figure
    out what is costing time, you need to be able to profile your code. The shell
    in SimpleCV provides a feature called ''timer'' that will give you a quick and
    dirty profiling tool that you can use while you are experimenting with different
    algorithms. So, as an example, you can see how long the ''findBlobs()'' function
    takes on your Raspberry Pi with something like:


    ```

    img = cam.getImage()

    timeit img.findBlobs()

    ```


    Once you find and fix the bottlenecks in your code, you can create the end product
    for your final version.


    With this article, you should now have enough to start using cameras from within
    your own programs. We have only been able to cover the bare essentials. However,
    so don''t forget to go check out the documentation covering all of the other functionality
    that is available in the SimpleCV module.


    # Full code listing


    ```

    # SimpleCV provides a simple interface to OpenCV

    # First, we will import everything into the local

    # namespace

    from SimpleCV import *


    # Make sure your USB camera is plugged in,

    # then you can create a camera object

    cam = Camera()


    # Getting an image from the camera is straightforward

    img = cam.getImage()

    # You can rescale this image to half its original size

    img2 = img.scale(0.5,0.5)

    # There are several features that you may want to look at

    # You can extract a list of blobs

    blobs = img.findBlobs()

    # You can draw these blobs and see where they are on

    # the image

    blobs.draw()

    # or a list of corners

    corners = img.findCorners()

    # If you want to identify motion, you will need two

    # frames

    img2 = cam.getImage()

    # You can get a FeatureSet of motion vectors with

    motion = img2.findMotion(img)

    # Face recognition is possible too. You can get a list of

    # the types of features that you can look for with

    img.listHaarFeatures()

    # For faces, you can generate a Haar Cascade

    faces = HaarCascade(''face.xml'')

    # Now you can search for faces

    found_faces = img.findHaarFeatures(faces)

    # You can load image files with the Image class

    my_img = Image(''my_image.jpg'')

    # You can save images to the hard drive, too

    img.save(''camera.png'')

    ```


    ![](img/a1548a579bd09ff29b2b92de3f565e63_96_1.png)


    > Above: Any basic USB webcam or surveillance monitor will do for this


    # Importing


    SimpleCV is built on top of OpenCV and provides a simplified set of functions.
    But what can you do if you have more complicated work to do? You always have the
    option of using OpenCV directly to gain access to the full set of functions. You
    can import the basic OpenCV into the local namespace with:


    ```

    from cv2 import *

    ```


    Not only do you have the usual image manipulation functions and the feature recognition
    tools, but you also have the ability to process video. You can use meanshift and
    camshift to do colour based motion detection. There are functions to look at optical
    flow. These look at apparent motions in a video, from one frame to the next, that
    are caused by either the object moving or the camera moving. You can even subtract
    the background from a moving foreground object. This is a common preprocessing
    step in vision systems. You can even construct 3D information from a set of stereo
    images gathered by a pair of cameras. With OpenCV, you really can deal with almost
    any vision problem you might be tackling.'
