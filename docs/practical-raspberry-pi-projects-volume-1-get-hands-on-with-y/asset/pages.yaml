  md: '![](img/a1548a579bd09ff29b2b92de3f565e63_143_0.png)


    trigonometry and knowledge of the tilt angles in pitch and roll axes of the quadcopter
    with respect to the Earth.


    # ## Angles


    Both the accelerometer and gyro can provide this angle information, but both have
    flaws.


    The accelerometer output can be used to calculate the angle by using the Euler
    algorithm. However, the accelerometer output is plagued by noise from the motors/propellers,
    meaning a single reading can be hugely inaccurate; on the plus side, the average
    reading remains accurate over time.


    In contrast, the gyro output does not suffer from the noise, but since it is the
    angular speed being measured, it needs to be integrated over time to find the
    absolute angle of the quadcopter in comparison to the horizon. Rounding errors
    in the integration lead to ever increasing errors over time, ultimately curtailing
    the maximum length of a flight.


    # ## Filter


    Although independently they are both flawed, they can be merged mathematically
    such that each compensates for the flaws in the other, resulting in a noise-free,
    long-term accurate


    reading. There are many versions of these mathematical noise/drift filters. The
    best common one is by Kalman; the one we''ve chosen is slightly less accurate,
    but easier to understand and therefore to code: the complementary filter.


    Now with an accurate angle in hand, it''s possible to convert accelerometer sensor
    data to inputs relative to the Earth''s axes and work out how fast the quadcopter
    is moving up, down, left, right and forwards and backwards compared to the targets
    that have been set.


    # ## PIDs


    So we now have a target for what we want the quadcopter to do, and an input for
    what it''s doing, and some motors to close the gap between the two; all we need
    now is a way to join these together. A direct mathematical algorithm is high on
    impossible - accurate weight of the quadcopter, power per rotation of each blade,
    weight imbalance etc would need to be incorporated into the equation. And yet
    none of these factors is stable: during flight (and crashes), blades get damaged,
    batteries move in the frame, grass/mud/moisture changes the weight of the ''copter,
    humidity and altitude would need to accounted for. Hopefully it''s clear this
    approach simply won''t fly.'
