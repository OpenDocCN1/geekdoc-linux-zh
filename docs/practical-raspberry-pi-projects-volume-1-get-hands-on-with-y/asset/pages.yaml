  md: "# ASSEMBLE A MINECRAFT POWER MOVE GLOVE\n\n# 03 Test that the button works\n\
    \nUse this test code to ensure the button is functioning correctly. Once it is,\
    \ the same setup method can be used throughout this project. To ensure the buttons\
    \ are responsive, use the pull-up resistor with the code GPIO.PUD_UP – this will\
    \ ensure that multiple touches aren’t registered on each button. Using Python\
    \ 2.8, type in the code below, then save and run. If working correctly, it will\
    \ return the message ‘Button works’.\n\n```\nimport RPi.GPIO as GPIO\n\nGPIO.setmode(GPIO.BCM)\n\
    \nGPIO.cleanup()\nGPIO.setup(17, GPIO.IN, GPIO.PUD_UP)\n\nwhile True:\n    if\
    \ GPIO.input(17) == 0:\n        print \"Button works\"\n```\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_126_0.png)\n\
    \n# 04 Create a power move\n\nNow to create your first power move. The glove and\
    \ code are structured in such a way that once the basic code template is set up,\
    \ you can create your own power moves and assign them to each button, keeping\
    \ both your ideas and your gameplay fresh. The first power move you will program\
    \ enables you to place a wall of TNT between you and the player trying to catch\
    \ you. They have a choice to go around the wall or slow it up, but it will slow\
    \ them down. In a new Python window, type the code below and save the program\
    \ into the home folder:\n\n```\nimport time\ndef FireWall():\n    mc.postToChat(\"\
    Firewall Placed\")\n    TNT = 46,1\n    x, y, z = mc.player.getPos()\n    mc.setBlocks(x-6,\
    \ y, z+2, x+6, y+10, z+3, TNT)\n    time.sleep(10)\n\nwhile True:\n    FireWall()\n\
    ```\n\n# 05 Open Minecraft\n\nThe updated version of the Raspbian OS comes with\
    \ Minecraft pre-installed, it can be found under Menu>Games – so load it up. If\
    \ you have used the Minecraft: Pi Edition before you will be aware that it runs\
    \ better in a smaller-sized window, so don’t make it full screen. You may prefer\
    \ to adjust and arrange each window side-by-side to enable you to view both the\
    \ Python code and the Minecraft game at the same time.\n\n# PiGlovePowerMoves.py\n\
    \n```\nimport time\nfrom mcpi import minecraft\n\nmc = minecraft.Minecraft.create(\"\
    192.168.1.21\")\n#Replace with the other player's IP address\n\nimport RPi.GPIO\
    \ as GPIO\n\n#Set up the GPIO Pins\nGPIO.setmode(GPIO.BCM)\n\n#Sets the pin to\
    \ high\nGPIO.cleanup()\nGPIO.setup(17, GPIO.IN, GPIO.PUD_UP)\n#11 on the BOARD\
    \ GREEN Firewall\nGPIO.setup(18, GPIO.IN, GPIO.PUD_UP)\n#12 on the BOARD BROWN\
    \ Lava\nGPIO.setup(3, GPIO.IN, GPIO.PUD_UP)\n#21 on the BOARD BLUE Mega Jump\n\
    GPIO.setup(4, GPIO.IN, GPIO.PUD_UP)\n#10 on the BOARD ORANGE Puddle\nGPIO.setwarnings(False)\
    \    #switch off other ports\n\n#Builds a wall of TNT which if the player hits\
    \ will explode\ndef FireWall():\n    mc.postToChat(\"Firewall Placed\")\n    TNT\
    \ = 46,1\n    x, y, z = mc.player.getPos()\n    mc.setBlocks(x-6, y, z+2, x+6,\
    \ y+10, z+3, TNT)\n    time.sleep(1)\n\n#Lays Lava to slow down the other player\n\
    def LavaLava():\n    Lava = 10\n    check = 1\n    mc.postToChat(\"Lava Deployed\"\
    )\n    while check == 1:\n        time.sleep(0.2)\n        x, y, z = mc.player.getPos()\n\
    \        mc.setBlock(x-1, y, z, Lava)\n        check = 1\n\n#Performs a Mega Jump\
    \ to lose players\ndef Mega_Jump():\n    time.sleep(0.1)\n    mc.postToChat(\"\
    Mega-Jump\")\n    x, y, z = mc.player.getPos()\n    mc.player.setPosition(x, y+15,\
    \ z)\n    time.sleep(1)\n\n#Creates a Puddle to slow down the player\ndef Mega_Water_Puddle():\n\
    \    mc.postToChat(\"Mega Water Puddle\")\n    time.sleep(0.2)\n    WATER = 9\n\
    \    x, y, z = mc.player.getPos()\n    mc.setBlocks(x-5, y, z-4, x-1, y, z+4,\
    \ WATER)\n    time.sleep(1)\n```\n\n# GPIO pins\n\nGPIO pins are a physical interface\
    \ between the Pi and the outside world. At the simplest level, you can think of\
    \ them as switches that you can turn on or off (input) or that the Pi can turn\
    \ on or off (output). The GPIO_BCM option means that you are referring to the\
    \ pins by the \"Broadcom SOC channel\" number, GPIO_BOARD specifies that you are\
    \ referring to the pins by the number of the pin and the plug – the numbers printed\
    \ on the board."
