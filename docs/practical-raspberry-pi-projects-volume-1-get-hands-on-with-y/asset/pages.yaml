  md: "# BUILD A RASPBERRY PI-POWERED BIGTRAK\n\n**11 Connect to the Raspberry Pi\
    \ – adding cables**\n\nAs the Raspberry Pi will be mounted on the top of the Bigtrak,\
    \ we need to run the ribbon and power cable through the top of the case. To do\
    \ this, turn the top of the Bigtrak upside down and release the front two catchest\
    \ that hold the dark grey plastic in place – this provides a big enough gap to\
    \ feed the ribbon cable and USB power cable through. Make sure that the red edge\
    \ of the ribbon cable correctly matches up with the connector on the breadboard\
    \ to save yourself from having to twirl the cable inside the case.\n\n**12 Connect\
    \ to the Raspberry Pi – final steps**\n\nWith the top of the Bigtrak back on,\
    \ the Raspberry Pi can now be put in place, keeping the GPIO pins towards the\
    \ front to allow the ribbon cable to easily connect. As for the battery pack,\
    \ we're holding it in place with cable ties and sticky pads. In theory it's possible\
    \ to attach the bare Raspberry Pi to the Bigtrak, however this can cause the SD\
    \ card to press against the edge and bend, so it's recommended to use a case to\
    \ protect the Raspberry Pi.\n\nConnect the ribbon and power cable to the Raspberry\
    \ Pi, turn it on and it's now ready to be told what to do. For setting up the\
    \ software it may be easier to connect up a keyboard and monitor to the Raspberry\
    \ Pi at this point.\n\n**13 Connect the PS3 controller**\n\nThis should be a simple\
    \ case of plugging the PS3 controller into one of the USB ports, as all the software\
    \ to support it is included in the default Raspbian OS image and it will be automatically\
    \ detected as a joystick. To confirm that the PS3 controller has been detected,\
    \ run `lsusb` and check that it appears in the resulting list.\n\n**14 Run the\
    \ software**\n\nNow with the system all set up, it should just be a simple case\
    \ of copying the 'bigtrak.py' file found on this issue's disc onto your Raspberry\
    \ Pi and running it. As the script accesses the GPIO pins, it will need to be\
    \ run as the superuser, so launch it using:\n\n    sudo python bigtrak.py\n\n\
    Now we can control the Bigtrak using the analogue sticks! Moving the left stick\
    \ will control the left motor and moving the right stick will control the right.\
    \ So, to move forwards push both sticks up, pull both down to go backwards and\
    \ push one up and one down to rotate on the spot.\n\nIf the analogue sticks are\
    \ not controlling the Bigtrak as expected, double-check the GPIO connections to\
    \ make sure that they are all as expected.\n\n**15 Next steps**\n\nNow that you\
    \ have a solid base for your Raspberry Pi robot, you can make further adjustments\
    \ to it. Possible next steps could be: add a USB Bluetooth adaptor so the PS3\
    \ controller can be connected wirelessly; replace the breadboard with a PiPlate\
    \ or 'Slice of Pi' add-on board, allowing the Raspberry Pi to be installed inside\
    \ the Bigtrak; connect up the RaspberryPi camera and a USB WiFi adaptor to stream\
    \ video as you drive around; or add a robot arm!\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_52_0.png)\n\
    \n![](img/a1548a579bd09ff29b2b92de3f565e63_52_1.png)\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_52_2.png)"
