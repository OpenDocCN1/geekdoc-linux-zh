    \ = \"The time is \" + hour + \":\" + min + \" \" + ampm;\n$(\"h2\").html(time);\n\
    ```\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_18_3.png)\n\n# ## 06 Querying\
