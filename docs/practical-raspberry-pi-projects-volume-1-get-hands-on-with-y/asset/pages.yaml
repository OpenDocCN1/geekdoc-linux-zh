  md: '# HARDWARE


    # Mod your Minecraft


    Here is some example code, and explanations for it, so that you can learn how
    to program in Python and mod Minecraft Pi


    We program *Minecraft* to react in python using the API that comes with *Minecraft:
    Pi Edition* – it’s what we moved to the home folder earlier on. Now’s a good time
    to test it – we can do this remotely via SSH. Just cd into the Minecraft folder
    in the home directory we made, and use *nano* test.py to create our test file.
    Add the following:


    ```

    from mcpy.minecraft import Minecraft

    from mcpy import block

    from mcpy.vec3 import Vec3

    mc = Minecraft.create()

    mc.postToChat("Hello, Minecraft!")

    ```


    Save it, and then run it with:


    ```

    $ python test.py

    ```


    "Hello, Minecraft!" should pop up on-screen. The code imports the *Minecraft*
    function from the files we moved earlier, which allows us to actually use Python
    to interact with *Minecraft*, along with the various other functions and modules
    imported. We then create the *mc* instance that will allow us to actually post
    to *Minecraft* using the *postToChat* function. There are many ways you can interact
    with *Minecraft* in this way – placing blocks that follow the player, creating
    entire structures and giving them random properties as they’re spawned as well.
    There are very few limits to what you can do with the Python code, and you can
    check out more projects here: **https://mcppy.wordpress.com**.


    structures and giving them random properties as they’re spawned as well. There
    are very few limits to what you can do with the Python code, and you can check
    out more projects here: https://mcppy.wordpress.com.


    Over the page, we have a full listing for a hide and seek game that expands on
    the kind of code we’re using here, where the player must find a diamond hidden
    in the level, with the game telling you whether you’re hotter or colder. You can
    write it out from scratch or download it to your Pi using the following commands:


    ```

