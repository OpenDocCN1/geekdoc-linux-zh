    \n# RetroNES\n\nNow you're playing with power. Raspberry Pi power to be exact,\
    \ situated inside an old game console\n\nLeft: It's difficult to see, but there\
    \ are some difference to this NES compared to an original.\n\n+   **Maker Profile**\n\
    +   **Chris Crowder**\n+   Programmer and database administrator\n+   \n+   Working\
    \ in the car industry, Chris develops manufacturing systems for production floor\
    \ systems using .Net and SQL. In his down time, he likes to play video games and\
    \ tabletop games, but was previously limited to his PC for the former.\n+   \n\
    +   Find out more: imgur.com/a/KPizn7/gallery\n\n> “It was a little intimidating\
    \ at first as I wanted to make sure that this project looked and felt like an\
    \ NES”\n\n“It all started when my wife asked me what I wanted for Christmas”,\
    \ said Chris over email. “I had absolutely no idea but I had been wanting to mess\
    \ around with a Raspberry Pi since it came out, so she got me a starter kit.”\n\
    \n“While waiting for Christmas I started narrowing down ideas and found the RetroPi\
    \ project. I thought that I would just install that, load some ROMs and call it\
    \ good, then I remembered that I had some old NES and SNES controllers in storage.\
    \ I went to get them and found my old childhood NES console along with the controllers.\
    \ Once I got the NES back in the house and started looking at it, I found that\
    \ almost all of the internals were damaged due to insects and moisture. All of\
    \ the connectors were corroded and some of the boards had traces that were peeling.\
    \ That is when I decided that I would use the Raspberry Pi to “resurrect” the\
    \ NES.”\n\nChris completely gutted the case and replaced the insides with a Raspberry\
    \ Pi, hooking up I/O ports to the original connectors for the controllers and\
    \ the AV cables and such. What’s it like taking on a project with one of the most\
    \ revered consoles in videogame history?\n\n“It was a little intimidating at first\
    \ as I wanted to make sure that this project looked and felt like an NES but with\
    \ more flexibility. The biggest issue I ran into was that I wanted it to be able\
    \ to work like an NES, meaning that if someone wants to play a game that they\
    \ just turn it on, select a game and then they are playing. When they are finished\
    \ all they have to do is press the power button to turn the console off. We can’t\
    \ do that easily with a Raspberry Pi since there is no ATX-style power switch.\
    \ I was able to solve this issue with a Mauserberry Circuit and a Python script.\
    \ When the power button is pressed it communicates with the Pi via a GPIO connection\
    \ and it runs the shutdown command. Once the Pi is shut down, the circuit cuts\
    \ the power to the Pi.”\n\nThe final product works great, with Chris reporting\
    \ the can play on Atari, Sega and Nintendo games just fine. He’s now looking to\
    \ upgrade it with a Raspberry Pi 2 and increase the number of games he can play.\n\
    \n![](img/a1548a579bd09ff29b2b92de3f565e63_150_1.png)\n\nAbove: Everything is\
    \ packed inside the original case, without needing to open it up to use it.\n\n\
    +   **Refitting a NES**\n+   \n+   Do you fancy taking on the challenge of bringing\
    \ your old console back to gloriously pixelated life? Thought so. In that case,\
    \ you’ll be needing this – here’s a list of the equipment that Chris used to repair\
    \ and revive his childhood NES console:\n+   * A broken NES console – please don’t\
    \ do this to a working console\n+   * Replacement NES Door\n+   * Canakit Starter\
    \ B+ – soon to be replaced with a Raspberry Pi 2\n+   * Panel Mount Ethernet Cable\n\
    +   * Panel Mount HDMI Cable\n+   * Panel Mount USB Cable\n+   * USB-A Male to\
    \ Micro USB\n+   * SNES USB Controllers\n+   * Anker 13000 mAh 3 watt Battery\
    \ – this is for when there is no power outlet nearby or you want to be portable\n\
    +   * Mauserberry Circuit – shutdown circuit that uses your own switch, USB\n\
    +   * LED-0 – to hold the Mauserberry Circuit\n+   * Gorilla Glue\n+   * Blue\
    \ 3-volt LED – the original NES LED was 12 volts, plus all of the other items\
    \ in Chris’ entertainment console are blue"
