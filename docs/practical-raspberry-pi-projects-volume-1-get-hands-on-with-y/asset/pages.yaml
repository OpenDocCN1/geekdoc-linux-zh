    \ stack. We increment the loop count after doing this.\n\n# **10** Main loop continued\n\
    \nThis code is at the indentation level after the “while True:” statement. After\
    \ dealing with the recording logic, we need to play any notes that have been previously\
    \ recorded. We’ll work out how to do that later on. After that, we can sleep until\
    \ the next quantize change is due. Once this happens, we have to do logic that\
    \ deals with the quantize and any related variables such as the beat or bar if\
    \ necessary, either incrementing them or resetting them if necessary.\n\n# **11**\
    \ Lighting LEDs\n\nThe LED code is simple. It simply goes through each pin in\
    \ the list you provide it with and lights up the appropriate LED, ensuring that\
    \ all of the others are turned off.\n\n# **12** The metronome\n\nThe metronome\
    \ simply plays a high tone on the first beat or a lower tone on the remaining\
    \ beats if the metronome variable is set to true.\n\n# **13** The recording code\n\
    \nLooking back at the sample class we created at the start, you can see that if\
    \ recording is enabled, and a note is pressed, then we add a dictionary to the\
    \ list of samples for the current bar at the current quantize point. The dictionary\
    \ contains a reference to the sample so that it can be played, and also the loop\
    \ that it was added on so that it can be removed if necessary. The code for playing\
    \ and undoing recordings can be seen below.\n\nNote that we directly play the\
    \ sound rather than using the btn_play function so that we don’t trigger the recording\
    \ logic when playing recorded sounds.\n\nThe pop function in undo_previous_loop\
    \ removes the last thing that was added to the stack, which will be the loop count.\
    \ We then go through every possible recording data point and remove anything recorded\
    \ on the loop we want to remove.\n\n# **14** Finishing it off\n\nTo finish it\
    \ off, we need to add a main function where we load some samples in and then start\
    \ the main loop. Remember that you need to run the code with sudo python3 pisampler.py\
    \ because we need sudo to access the GPIO. Happy jamming!\n\n# **15** Possible\
    \ improvements\n\nThere are a number of improvements that could be made to the\
    \ sampler. Here are a few to get you started:\n\n+   • A button to turn the metronome\
    \ on and off\n+   • The ability to time stretch samples (such as chords) to fit\
    \ with the tempo\n+   • The ability to pitch shift samples on the fly\n+   • Using\
    \ a shift register to use less pins when lighting the LEDs, allowing more inputs\n\
    +   • The ability to save recorded beats so that they can be loaded and played\
    \ back\n\n# **Full code listing (Cont.)**\n\n```\nStep 11\ngpio.output(led, False)\n\
    \ncount += 1\n```\n\n```\nStep 12\n\ndef do_metronome(self):\n    if not self.metronome:\n\
    \        return\n\nif self.beat_n == 0:\n    self.met_high_play()\nelse:\n   \
    \ self.met_low_play()\n```\n\n```\nStep 09\n\ndef run(self):\n    self.loop_count\
    \ = 0\n    self.last_recorded_loop = []\n    self.bar_n = 0\n    self.beat_n =\
    \ 0\n    self.quantize_beat_n = 0\n    self.quantize_n = 0\n\n    while True:\n\
    \        if self.quantize_beat_n == 0:\n            self.do_leds(beat_leds, self.beat_n)\n\
