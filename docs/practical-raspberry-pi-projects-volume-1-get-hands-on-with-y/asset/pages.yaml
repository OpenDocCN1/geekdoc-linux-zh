- pgno: 133
  md: '# Add gesture control to your Raspberry Pi


    Hover is an impressive add-on board for your Raspberry Pi that allows you to easily
    add touch and gesture control to any project


    ![](img/a1548a579bd09ff29b2b92de3f565e63_133_0.png)


    # What you''ll need


    +   * Raspberry Pi

    +   * Hover

    +   * Breadboard

    +   * Male to female jumper cables

    +   * Speaker or headphones


    People often ask **what the best way is for them to get started with Raspberry
    Pi**. Obviously this does depend on the individual user and what they want to
    achieve and get out of any project, but in a more general sense it’s often the
    hardware projects that win out for getting to grips with it. They teach a variety
    of skills (including programming, circuit building, soldering, hardware design
    and much more!) and are also varied enough to both keep beginners interested and
    allow them to work out for themselves exactly what aspect they love best. Even
    a seasoned professional will get a serious kick out of a bit of physical computing
    and


    automation! This is one of the unique features of the Pi compared to traditional
    “black box” computers: you can break out of the usual boundaries and interface
    with everyday objects like never before.


    One of the most important aspects of a hardware project is often the user input
    mechanism, and as technology is refined we see new and more intuitive ways to
    accomplish this task. Gesture and touch control is now present in a large number
    of consumer devices and even the biggest technophobes are starting to embrace
    the ease of this technology. It is time to bring your Raspberry Pi projects into
    the 21st century with Hover!'
  merge: -1
  img_proc: true
