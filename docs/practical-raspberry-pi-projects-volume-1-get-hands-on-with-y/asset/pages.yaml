    \n# The next step is to load the forecast data\nforecast = forecastio.load_forecast(apikey,\
    \ latitude, longitude)\n\n# You can print out the available hourly data\nfor_houly_data\
    \ = forecast.hourly\nfor hourly_data in by_hourly_data:\n    print hourly_data\n\
    \n# You can also get summaries\nby_day = forecast.daily()\nprint by_day.summary\n\
    \n# To use the Python weather API you need to\n# import the pywapi module\nimport\
    \ pywapi\n\n# Getting the weather from any of the\n# available sources is a single\
    \ call\n# You will need to find and use the\n# appropriate location ID\nweather_com_result\
    \ = pywapi.get_weather_from_weather_com('10001')\nyahoo_result = pywapi.get_weather_from_yahoo('10001')\n\
    noaa_result = pywapi.get_weather_from_noaa('KJKF')\n\n# The data is now in a key/value\
    \ pair\n# structure, ready to read off and used\nprint weather_com_result['current_conditions']['text']\n\
    print yahoo_result['condition']['text']\nprint noaa_result['weather']\n```\n```\n\
    \n# Weather station\n\nYou can use Python to log weather data and send it to Weather\
    \ Underground; just install the required module with pip install weather. This\
    \ actually contains three separate submodules that need to be imported individually.\
    \ The first provides a number of conversion functions, as well as calculation\
    \ functions such as weather.units.calc_wind_chill(). The second, weather.stations,\
    \ provides the capabilities to talk to the weather station over a serial connection,\
    \ but this module currently only talks to the Vantage and VantagePro. The third,\
    \ weather.service, provides the functions to upload your data to the online services.\n\
    \n91"
