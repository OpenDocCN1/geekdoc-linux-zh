  md: "# # BUILD A RASPBERRY PI WEB SERVER\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_18_0.png)\n\
    \n# ## 02 Plug in Your Pi\n\nFor this tutorial, you'll only need to connect a\
    \ network cable into the Pi. Pop in your newly written SD card, plug in the power\
    \ and wait a few moments. If you've got a display plugged in anyway, you'll notice\
    \ a Raspbian startup sequence leading to the command-line login screen.\n\n# ##\
    \ 03 Connect to Coder\n\nOpen up the browser on your main system, and go to http://coder.local.\
    \ You may have to manually accept the licence. It will ask you to set up your\
    \ password, and then you'll be in and ready to code.\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_18_1.png)\n\
    \n# ## 04 Language of the web\n\nNow it's time to create your own app or website.\
    \ Click on the \"+\" box next to the examples, give your app a name and then click\
