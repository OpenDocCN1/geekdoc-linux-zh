- pgno: 27
  md: '# # Raspberry Pi stop motion animation


    Fancy yourself as the next Nick Park? Set up this DIY stop-motion studio and see
    what you can do


    # ## What you''ll need


    +   - Latest version of Raspbian www.raspberrypi.org/downloads

    +   - picamera Python module picamera.readthedocs.org

    +   - RasPi camera module

    +   - Pygame www.pygame.org


    Pi-Mation is available on GitHub via https://github.com/russb78/pi-mation


    The Raspberry Pi camera module opens the door for your Pi projects to incorporate
    aspects of photography and movie making. We''re combining both here to create
    a fully featured stop-motion animation application, Pi-Mation, which makes it
    incredibly easy to create impressive HD animations.


    We''ve written this project with Python and it relies on two libraries that you
    will need to install. Picamera (picamera.readthedocs.org) is a pure Python interface
    to the Raspberry Pi camera module and is a must for all camera module owners.
    Pygame (www.pygame.org), which ensures our images can be displayed on demand.


    # ### 01 Set up the camera module


    First things first, you need to make sure your Raspberry Pi is up to date. In
    the terminal, type:


    ```

    ```

    sudo apt-get update && sudo apt-get upgrade

    ```

    ```


    Next we need to update the Pi''s firmware and ensure camera module is activated.
    Bear in mind that this takes some time.


    ```

    ```

    sudo rpi-update

    sudo raspi-config

    ```

    ```


    # ### 02 Install other dependencies


    Next we''ll make sure Pygame and picamera are installed:


    ```

    ```

    sudo apt-get install python-setuptools

    easy_install -user picamera

    ```

    ```


    Finally, to install Pygame and the video apps, type:


    ```

    ```

    sudo apt-get install python-pygame

    sudo apt-get install libav-tools && sudo apt-get install omplayer

    ```

    ```


    ![](img/a1548a579bd09ff29b2b92de3f565e63_27_0.png)'
