    \ will change to something else. While people have used Raspberry Pis to create\
    \ lots of applications like Twitter tickers, I thought that here we could look\
    \ at how to write up a weather ticker in Python.\n\nThere are many different services\
    \ available that provide weather data through a number of different APIs. Some\
