- pgno: 152
  md: "# 20 RASPBERRY PI HACKING PROJECTS\n\n# Spaceship Bedroom\n\nAfter successfully\
    \ accomplishing his desk mission, Jeff Highsmith set his sights higher\n\nMission\
    \ control was but one small step. Next was the mission itself, as Jeff explains:\
    \ “So my boys would hit the buttons on the desk and go through all those mission\
    \ stages and run around with their toy rockets, but having the actual spaceship,\
    \ I thought, would be cool. The spaceship has some panels similar to the desk,\
    \ but it also has a small screen in there that goes to a video camera in the cargo\
    \ bay. There’s a motorised hatch on the side that you can open up by flicking\
    \ a switch, and then the camera shows you a cargo bay with a robot arm inside\
    \ it. You can’t see the cargo bay when you’re inside because you’re laying on\
    \ your back, but looking at the screen you can see it and the controls are in\
    \ front of you. It really feels quite fun – I’ve got a little toy Hubble space\
    \ telescope in there and I hung a piece of fishing line from the ceiling with\
    \ a little bit of metal on it, and then I’ve got a magnet in the space telescope.\
    \ So you take the telescope from the cargo bay with the arm, move it over and\
    \ snap it onto the string that hangs from the ceiling – we call that orbit. Once\
    \ it’s in orbit you can pull the arm back in the cargo bay, close the hatch and\
    \ your mission is complete, you can return to Earth. And then there’s the inevitable\
    \ mission to go and fix the Hubble...\n\nJeff’s going to upgrade this awesome\
    \ setup further. “Eventually,” he says, “I’ve got some ceiling satellites planned,\
    \ so I’ll have them orbiting a track in one of the bedrooms and the iPad can monitor\
    \ the different sensors on the satellites. The track will be a thin metal rod\
    \ under the ceiling in an ellipse, and then each satellite will have a tiny wheel\
    \ extending from the top of it, which has a very small gear motor on it, so it’ll\
    \ hang from the track on that wheel. The idea is that the kids can build satellites\
    \ out of Lego, put them in the cargo bay, then winch them up into orbit.”\n\n\
    ![](img/a1548a579bd09ff29b2b92de3f565e63_152_0.png)\n\nAbove You can see the robot\
    \ arm reaching out of the cargo bay door to the left\n\n> “Having an actual spaceship,\
    \ I thought, would be cool”\n\n# Automatic Roller\n\nNearly a Rube Goldberg machine,\
    \ we hope it plays ‘Powerhouse’ when used\n\n+   **Maker Profile**\n+   **Emil\
    \ Jaworski**\n+   **Maker**\n+   Finding himself in a rented apartment for a few\
    \ months, Emil has decided to upgrade himself.\n+   \n+   Find out more:\n+  \
    \ imgur.com/a/0YbPo\n\nThere are many schools of thought regarding your sleeping\
    \ environment to help aid better and more restful sleep. No electronics in the\
    \ bedroom, try and relax before going to sleep, take a cool or hot shower depending\
    \ on the time of the year. Some people require pitch darkness to get a good night’s\
    \ sleep though, while others like to wake up when the sun rises as part of a natural\
    \ body reaction. Emil likes to do both of these things with his Raspberry Pi that\
    \ automatically shuts and opens his blinds at specific times of day.\n\n“7:30:\
    \ Press up button, wait 10 seconds (I have smaller windows on the bottom and bigger\
    \ above them, so after these 10 seconds, shutters are going to be open only on\
    \ the bottom ones), press stop button. 8:00: Press up button. 22:00: Press down\
    \ button.”\n\nUnfortunately, it means he has some electronics in his bedroom,\
    \ but whatever works for him.\n\n# RasPi Terminal\n\nWe’ve had lots of Raspberry\
    \ Pi over the years, but what about Apple Pi?\n\n+   **Maker Profile**\n+   **Austen\
    \ Barker**\n+   **Engineering student**\n+   A Californian student that has a\
    \ habit of messing around with any old computer hardware that he can get his hands\
    \ on.\n+   \n+   Find out more:\n+   imper.com/voEML\n\n“In my spare time I like\
    \ messing around with older computer hardware that I come across. Originally I\
    \ found the need for a terminal to connect over SSH to a server that I was using\
    \ for an internship. It was more efficient than devoting a more powerful machine\
    \ to it. I took a server to school with me to continue working for the same company\
    \ as I studied.\n\nI had a Raspberry Pi also sitting around and I started hooking\
    \ it up to a monitor from an Apple 1lc that I found at my university’s electronics\
    \ surplus. This became valuable when I started having to log in to a school server\
    \ over SSH to compile assignments for my programming classes. Eventually, I found\
    \ a keyboard from a Macintosh 512K and made it work over USB with a microcontroller\
    \ and a custom wired key matrix, and I paired it with the monitor and Pi.”\n\n\
    ![](img/a1548a579bd09ff29b2b92de3f565e63_152_1.png)"
  merge: -1
  img_proc: true
- pgno: 153
  md: "# 20 RASPBERRY PI HACKING PROJECTS\n\n# Alarm Clock Robot\n\n> *Chasing your\
    \ alarm clock may sound like a nightmare to some, but here it is in reality*\n\
    \n![](img/a1548a579bd09ff29b2b92de3f565e63_153_0.png)\n\nWhen we talked about\
    \ Rolly the alarm clock robot around the office, most people burst forth with\
    \ a string of expletives not fit for print. \n\nIt’s a delightfully evil invention\
    \ – an alarm clock you need to work for to turn off. It sounds like a great invention,\
    \ getting people who have trouble waking up to actually get up out of bed and\
    \ start the morning. \n\nLike any other Dexter Industries robot, it runs on BrickPi,\
    \ the LEGO Mindstorms adapter for the Raspberry Pi that enables it to interface\
    \ with LEGO kits via programming. \n\n“Today almost everyone uses their phone\
    \ as an alarm clock, which has a range of benefits,” the website explains. “Phones\
    \ are easy to set, easy to adjust, play custom songs and can even sense when is\
    \ the best time to wake you up. The problem is, unless your phone is across the\
    \ room, we use our phones so much we can literally use them in our sleep. Why\
    \ not build a robot that is able to do all these things,\n\n+   **Maker Profile**\n\
    +   **Taryn Sullivan**\n+   Advisor\n+   \n+   Taryn is an international businessman,\
    \ as well as flying between Shanghai and DC for her own engineering business,\
    \ she now works with Dexter Industries to promote robotics education.\n+   \n\
    +   Find out more: bit.ly/1BTYljv\n\n+   **Maker Profile**\n+   **Tony Hoang**\n\
    +   Graduate researcher\n+   \n+   Tony Hoang is a PhD student studying professional\
    \ computational biophysics and single-molecule research at SUNY-Albany in Albany.\n\
    +   \n+   Find out more: linkedin.com/in/tonyhoang\n\n+   **Maker Profile**\n\
    +   **Oskar Weigt**\n+   Electronics engineer\n+   \n+   Oskar is an electronics\
    \ professional and hobbyist, as well as an avid forward and reverse engineer.\n\
    +   \n+   Find out more: bit.ly/1om8EOE\n\nbut won’t stop till you get up and\
    \ start moving! Our robot will be able to easily move randomly around the room\
    \ over any surface, playing a custom alarm tone. \n\n“In order to set the alarm,\
    \ simply link the program on the BrickPi to your Google account and it will search\
    \ events with the title ‘wake!’ and automatically start the alarm at the event’s\
    \ time. This means the alarm time can very easily be adjusted using any device\
    \ that can access your Google Calendar.”\n\n# Robotics education\n\nThere are\
    \ many ways to get kids excited with coding, like making games in Scratch, modifying\
    \ Minecraft and teaching via robotics. The latter is a new concept but still has\
    \ the same merits – a physical creation that children are excited about and react\
    \ to the programming they’ve done on it. Visible results and instant gratification\
    \ is a great way to get imaginations fired up.\n\n# PiFM Radio\n\n> *Sometimes\
    \ the simplest hacks can open up whole worlds of possibility*\n\nWhen studying\
    \ at Imperial College London, Oskar Weigt and Oliver Mattos turned the Pi into\
    \ an FM radio by connecting a wire (antenna) to GPIO4 and using a custom Python\
    \ module. \n\n“There is a clock generation module in the hardware of the Raspberry\
    \ Pi chip that lets you output a clock signal at a user-selected frequency,” Oskar\
    \ explains. “We used the DMA controller to send commands to the clock module to\
    \ change the frequency and achieve frequency modulation. We had to overclock the\
    \ clock generation module by a factor of 20. \n\nThe sound is 16 bits per sample,\
    \ enhanced to a higher number using delta sigma modulation and the range is at\
    \ least 50 metres.”\n\n# Ras Pi Smart TV\n\n> *Is your smart TV not smart enough?\
    \ Open the case and put a Pi inside*\n\n“There’s plenty of room for additional\
    \ electronics inside the Hisense LED smart TV” begins Tony Hoang. “There’s a large\
    \ flat area for electronic parts in the control of the TV where I placed my Raspberry\
    \ Pi. The dual down-facing speakers were quite loud, so I removed one and replaced\
    \ it with a USB hub. The back panel was mostly flat, so finding a spot for the\
    \ LAN port and HDMI output wasn’t too hard. \n\n“The Raspberry Pi is powered by\
    \ the logic board of the Hisense. There were the obvious 5V 500 mA outputs from\
    \ the two USB 2.0 ports, which I tried but I found out that the logic board shuts\
    \ off the power to these ports when the TV turns off. To keep the Raspberry Pi\
    \ turned on, I probed the logic board with a multimeter and found one from an\
    \ unused GPIO.”"
