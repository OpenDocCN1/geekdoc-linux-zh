  md: "# # Code your own Twitter bot\n\nCreate your very own Twitter bot that can\
    \ retweet chunks of wisdom from Linux User & Developer\n\n# **What you'll need**\n\
    \n+   ■ Internet connectivity  \n+   ■ Latest version of Raspbian  \n+   www.raspberrypi.org/downloads\n\
    \nTwitter is a useful way of sharing information with the world and it's our favourite\
    \ method of giving our views quickly and conveniently. Many millions of people\
    \ use the microblogging platform from their computers, mobile devices and possibly\
    \ even have it on their televisions.\n\nYou don't need to keep pressing that retweet\
    \ button, though. With a sprinkling of Python, you can have your Raspberry Pi\
    \ do it for you. Here's how to create your own Twitter bot...\n\n# ### 01 Installing\
    \ the required software\n\nLog into the Raspbian system with the username Pi and\
    \ the password **raspberry**. Get the latest package lists using the command `sudo\
    \ apt-get update`. Then install the Python Package installer using `sudo apt-get\
    \ install python-pip`. Once you've done that, run `sudo pip install twython` to\
    \ install the Twitter library we'll be using.\n\n# ### 02 Registering with Twitter\n\
    \nWe need to authenticate with Twitter using OAuth. Before this, you need to go\
    \ to [https://dev.twitter.com/apps](https://dev.twitter.com/apps) and sign in\
    \ with the account you'd like your Pi to tweet from. Click the 'Create a new application'\
    \ button. We called our application\n\n![](img/a1548a579bd09ff29b2b92de3f565e63_19_0.png)\n\
    \n■ Save your mouse button by creating an automated retweeter"
