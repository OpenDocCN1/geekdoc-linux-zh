    \  ```\n\n  Connects to the remote host and executes the `ls -l /path/to/directory`\
    \ command, displaying a detailed list of files in the specified directory.\n\n\
    - 4. **Identity File (Private Key):**\n\n  ```\n  ssh -i /path/to/private-key\
    \ username@remote-host\n  ```\n\n  Specifies the path to the private key file\
    \ for authentication. Useful when using key-based authentication instead of a\
    \ password.\n\n- 5. **Tunneling (Port Forwarding):**\n\n  ```\n  ssh -L 8080:localhost:80\
    \ username@remote-host\n  ```\n\n  Sets up local port forwarding, redirecting\
    \ traffic from port 8080 on the local machine to port 80 on the remote host.\n\
    \n- 6. **X11 Forwarding:**\n\n  ```\n  ssh -X username@remote-host\n  ```\n\n\
    \  Enables X11 forwarding, allowing the remote server to display graphical applications\
    \ on the local machine.\n\n## 22. scp: Securely copy files between local and remote\
    \ machines.\n\n`scp` stands for Secure Copy Protocol, and it is a command-line\
    \ tool used in Linux and Unix-like operating systems to securely copy files and\
    \ directories between hosts. It uses SSH (Secure Shell) for data transfer and\
    \ provides encryption and authentication.\n\n### Examples:\n\n- 1. **Copy a file\
    \ from local to remote host:**\n\n  ```\n  scp file.txt username@remote_server_ip/path/to/destination/\n\
    \  ```\n\n  Replace `file.txt` with the name of the file you want to copy, `username`\
    \ with the username on the remote server, `remote_server_ip` with the IP address\
    \ of the remote server, and `/path/to/destination/` with the destination path\
    \ on the remote server.\n\n- 2. **Copy a file from remote to local host:**\n\n\
    \  ```\n  scp username@remote_server_ip/path/to/file.txt /local/path/\n  ```\n\
    \n  This command copies the `file.txt` from the remote server to the local machine.\
    \ Adjust the paths and username accordingly.\n\n- 3. **Copy an entire directory\
    \ from local to remote host:**\n\n  ```\n  scp -r my_directory username@remote_server_ip:/path/to/destination/\n\
    \  ```\n\n  The `-r` option is used to copy directories recursively.\n\n- 4. **Copy\
    \ from remote to local with a specific port:**\n\n  ```\n  scp -P 2222 username@remote_server_ip:/path/to/file.txt\
    \ /local/path/\n  ```\n\n  Here, the `-P` option specifies the port number (2222\
    \ in this example).\n\n- 5. **Copy with compression:**\n\n  ```\n  scp -C file.txt\
    \ username@remote_server_ip:/path/to/destination/\n  ```\n\n  The `-C` option\
    \ enables compression during the transfer.\n\n## 23. find: Search for files in\
    \ a directory hierarchy.\n\nThe `find` command in Linux is a powerful and versatile\
