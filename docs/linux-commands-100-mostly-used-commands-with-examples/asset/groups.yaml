    # 65. fsck：文件系统一致性检查和修复


    `fsck` 命令（代表 "file system consistency check"，即文件系统一致性检查）是一个强大的实用工具，用于在 Linux 和其他类
    Unix 操作系统中检查和修复磁盘上的文件系统不一致性。当系统遇到意外关机、断电或其他可能导致文件系统损坏的问题时，通常会使用它。`fsck` 可以处理各种文件系统类型，如
    ext2、ext3、ext4 等。


    ## 示例


    1. **检查文件系统：**


    ```text

    fsck /dev/sda1

    ```


    该命令检查和修复设备 `/dev/sda1` 上的文件系统。请将 `/dev/sda1` 替换为你的系统的适当设备标识符。


    2. **自动修复文件系统：**


    ```text

    fsck -y /dev/sda1

    ```


    `-y` 选项自动回答 `fsck` 提出的所有问题为 **yes**，使其适用于无人值守的修复过程。


    3. **交互修复：**


    ```text

    fsck -r /dev/sda1

    ```


    `-r` 选项在修复每个问题前提示用户确认。这允许你手动审查并批准每个修复。


    4. **检查和修复所有文件系统：**


    ```text

    fsck -A

    ```


    该命令检查和修复 `/etc/fstab` 文件中指定的所有文件系统。它通常在系统启动过程中使用。


    5. **检查特定类型的文件系统：**


    ```text

    fsck.ext4 /dev/sda1

    ```


    在此示例中，`fsck.ext4` 专门用于 ext4 文件系统。不同的文件系统可能有自己的 `fsck` 变体。


    6. **强制检查文件系统，即使它是干净的：**


    ```text

    fsck -f /dev/sda1

    ```


    `-f` 选项强制检查文件系统，即使它看起来是干净的。这对于确保彻底检查很有用。


    7. **检查和修复根文件系统：**


    ```text

    fsck -f /

    ```


    要检查和修复根文件系统，可能需要从实时 CD 或其他可启动媒体启动，以卸载根分区。


    8. **试运行（检查但不修复）：**


    ```text

    fsck -n /dev/sda1

    ```


    `-n` 选项执行试运行，显示将执行的操作，但实际上不对文件系统做任何更改。


