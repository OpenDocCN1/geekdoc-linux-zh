    \ 7 天内修改过的文件。\n\n- 6. **搜索大于特定大小的文件：**\n\n  ```\n  find /path/to/search -size\
    \ +1M\n  ```\n\n  此命令查找大于 1 兆字节的文件。\n\n- 7. **对找到的文件执行命令：**\n\n  ```\n  find /path/to/search\
    \ -name \"*.log\" -exec rm {} \\;\n  ```\n\n  此命令查找所有扩展名为 \".log\" 的文件，并使用 `rm`\
