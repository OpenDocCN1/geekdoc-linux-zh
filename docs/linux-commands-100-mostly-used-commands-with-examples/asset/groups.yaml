    "Ethernet," helping you quickly identify network-related devices.


    ## 93. strace: Trace system calls and signals.


    `strace` is a powerful command-line tool used in Linux and other Unix-like operating
    systems to trace and debug system calls and signals made by a process. It allows
    you to inspect the interactions between a process and the Linux kernel, providing
    valuable insights into the system-level behavior of programs.


    ### Examples:


    - 1. **Trace a Command:**


    ```

    strace ls -l

    ```


    This command traces the system calls made by the `ls` command when listing files
    in the long format.


    - 2. **Redirect Output to a File:**


    ```

    strace -o output.txt ls -l

    ```


    This example redirects the `strace` output to a file named `output.txt` for later
    analysis.


    - 3. **Trace Specific System Calls:**


    ```

    strace -e trace=open,read,write ls -l

    ```


    This command traces only the `open`, `read`, and `write` system calls made by
    the `ls` command.


    - 4. **Display Timestamps:**


    ```

    strace -t ls -l

    ```


    It adds timestamps to each line of output, providing information on when each
    system call occurred.


    - 5. **Display System Calls with Arguments:**


    ```

    strace -v ls -l

    ```


    The `-v` option provides more detailed information, including the arguments for
    each system call.


    - 6. **Trace a Running Process:**


    ```

    strace -p PID

    ```


    Replace `PID` with the process ID of the running process you want to trace.


    - 7. **Filter Output for a Specific System Call:**


    ```

    strace -e trace=write -e write=1 ls -l

    ```


    This example traces only the `write` system call, specifically for file descriptor
    1 (stdout).


    - 8. **Count System Calls:**


    ```

    strace -c ls -l

    ```


    It prints a summary of the counts and times of each system call, providing a quick
    overview of the system call activity.


    ## 94. vmstat: Report virtual memory statistics.


    `vmstat` is a command-line utility in Linux that provides information about virtual
    memory statistics, system resources, processes, and CPU utilization. The name
    "vmstat" stands for "virtual memory statistics." It is a useful tool for system
    administrators and users to monitor and analyze system performance.


    ### Examples:


    - 1. **Basic Usage:**


    ```

    vmstat

    ```


    This command displays a summary of virtual memory statistics, including processes,
    memory, swap, and CPU utilization. The values represent averages since the last
    reboot.

