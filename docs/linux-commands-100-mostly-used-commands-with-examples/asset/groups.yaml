    \ ls\n  ```\n\n  此命令将 `ltrace` 的输出重定向到名为 `output.txt` 的文件，而不是打印到终端。\n\n- 4. 通过\
    \ PID 跟踪特定进程：\n\n  ```bash\n  ltrace -p <pid>\n  ```\n\n  用你想跟踪的正在运行的进程 ID 替换\
