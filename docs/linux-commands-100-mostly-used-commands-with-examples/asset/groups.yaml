    ## 53. killall: Kill processes by name


    The `killall` command in Linux is used to terminate or send a signal to all processes
    with a specified name. It allows you to kill multiple processes at once based
    on their process name rather than their process ID (PID).


    ### Examples


    - 1. To terminate all processes named "firefox":

    ```

    killall firefox

    ```


    - 2. To forcefully kill all instances of a process named "myprocess" using the
    `SIGKILL` signal:

    ```

    killall -s SIGKILL myprocess

    ```


    - 3. To use the exact match option, ensuring that only processes with the exact
    name "myprocess" are terminated:

    ```

    killall -e myprocess

    ```


    - 4. To interactively kill all instances of a process named "myprocess":

    ```

    killall -i myprocess

    ```


    ## 54. htop: Interactive process viewer


    `htop` is an interactive process viewer and system monitor for Unix-like operating
    systems. It provides a user-friendly interface to monitor and manage system resources
    in real-time. `htop` allows users to view detailed information about running processes,
    system utilization, and other essential performance metrics.


    ### Examples


    - 1. To launch `htop`:

    ```

    htop

    ```


    - 2. To show processes for a specific user (replace "username" with the actual
    username):

    ```

    htop -u username

    ```


    - 3. To sort processes by CPU usage:

    ```

    htop -s PERCENT_CPU

    ```


    - 4. To kill a process by PID (replace "pid" with the actual process ID):

    ```

    htop -k pid

    ```


    - 5. To display `htop` help:

    ```

    htop -h

    ```


