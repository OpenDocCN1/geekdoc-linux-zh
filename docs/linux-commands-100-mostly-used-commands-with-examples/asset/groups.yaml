    # LINUX COMMANDS


    100 Mostly Used Commands With Examples


    ![cover](img/7986e09826a89bb7bb63cc16edad1407_0_0.png)


    ## 1. ls: List files and directories in the current directory.


    The `ls` command is a fundamental command in Linux and Unix-like operating systems
    used to list files and directories in a directory.


    ### Examples:


    - **List files and directories in the current directory:**


    ```bash

    ls

    ```


    - **List files and directories in a specific directory:**


    ```bash

    ls /path/to/directory

    ```


    - **List files in long format with human-readable sizes and hidden files:**


    ```bash

    ls -l -h -a

    ```


    - **List all files and directories recursively:**


    ```bash

    ls -R

    ```


    - **List files sorted by modification time (newest first):**


    ```bash

    ls -t

    ```


    ## 2. cd: Change directory.


    The `cd` command in Linux is used to change the current working directory. It
    allows you to navigate through the file system by moving from one directory to
    another.


    ### Examples:


    - **Change to Home Directory:**


    ```bash

    cd

    ```


    This command takes you to your home directory.


    - **Change to a Specific Directory:**


    ```bash

    cd /path/to/directory

    ```


    Replace "/path/to/directory" with the actual path of the directory you want to
    move into. This is an example of an absolute path.


    - **Move Up One Directory:**


    ```bash

    cd ..

    ```


    This command moves you up one level in the directory structure.


    - **Move to the Parent Directory:**


    ```bash

    cd ../parent_directory

    ```


    Replace "parent_directory" with the name of the parent directory you want to move
    into. This is an example of a relative path.


    - **Move to a Subdirectory:**


    ```bash

    cd subdirectory

    ```


    Replace "subdirectory" with the name of the subdirectory you want to move into.
    This is an example of a relative path.


    - **Use of Tilde (~) to Represent Home Directory:**


    ```bash

    cd ~/documents

    ```


    This command moves to the "documents" directory inside the user''s home directory.


    - **Navigate Back to the Previous Directory:**


    ```bash

    cd -

    ```


    This command takes you back to the previous working directory.


    - **Use of Environment Variables:**


    ```bash

    cd $HOME

    ```


    This command is equivalent to `cd` without any arguments and takes you to your
    home directory.


    ## 3. pwd: Print the current working directory.


    The `pwd` command in Linux stands for "print working directory." It is used to
    display the current working directory, which represents the absolute path of the
    user''s current location in the file system.


    ### Examples:


    - **Display the current working directory:**


    ```bash

    pwd

    ```


    - **Display the logical current working directory:**


    ```bash

    pwd -L

    ```


    - **Display the physical current working directory:**


    ```bash

    pwd -P

    ```


    ## 4. mkdir: Create a new directory.


    The `mkdir` command in Linux is used to create directories or folders. It allows
    users to create one or more directories in a specified location.


    ### Examples:


    - **Basic Usage:**


    ```bash

    mkdir my_directory

    ```


    This creates a directory named "my_directory" in the current working directory.


    - **Creating Multiple Directories:**


    ```bash

    mkdir dir1 dir2 dir3

    ```


    This command creates three directories named "dir1", "dir2", and "dir3" in the
    current working directory.


    - **Setting Permissions:**


    ```bash

    mkdir -m 755 my_directory

    ```


    This creates a directory named "my_directory" with the permission set to 755 (read,
    write, and execute for the owner, and read and execute for others).


    - **Creating Parent Directories:**


    ```bash

    mkdir -p path/to/my_directory

    ```


    This creates the directory "my_directory" along with any necessary parent directories
    (if they don''t exist) in the specified path.


    ## 5. rm: Remove files or directories.


    The `rm` command in Linux is used to remove or delete files and directories. It
    allows users to delete one or more files or directories, and it doesn''t move
    them to a trash/recycle bin; instead, it permanently deletes them.


    ### Examples:


    - **Remove a File:**


    ```bash

    rm myfile.txt

    ```


    This command removes the file named `myfile.txt`.


    - **Remove Multiple Files:**


    ```bash

    rm file1.txt file2.txt

    ```


    Removes both `file1.txt` and `file2.txt`.


    - **Remove a Directory:**


    ```bash

    rm -r mydirectory

    ```


    Recursively removes the directory named `mydirectory` and its contents.


    - **Remove with Confirmation:**


    ```bash

    rm -i sensitivefile.txt

    ```


    Prompts the user for confirmation before removing the file `sensitivefile.txt`.


    - **Forceful Removal:**


    ```bash

    rm -f stubbornfile.txt

    ```


    Removes the file `stubbornfile.txt` without asking for confirmation, even if it''s
    write-protected.


    ## 6. cp: Copy files or directories.


    The `cp` command in Linux is used to copy files and directories from one location
    to another. It is a fundamental command for file manipulation and is part of the
    GNU core utilities.


    ### Examples:


    - **Copy a file to another location:**


    ```bash

    cp file.txt /path/to/destination/

    ```


    - **Copy a directory and its contents recursively:**


    ```bash

    cp -r /path/to/source_directory/ /path/to/destination/

    ```


    - **Prompt before overwriting an existing file:**


    ```bash

    cp -i file.txt /path/to/destination/

    ```


    - **Copy only if source is newer or destination is missing:**


    ```bash

    cp -u file.txt /path/to/destination/

    ```


    - **Create a hard link instead of copying:**


    ```bash

    cp -l file.txt /path/to/link_destination/

    ```


    - **Preserve ownership and timestamps when copying:**


    ```bash

    cp -a /path/to/source_directory/ /path/to/destination/

    ```


    - **Verbose mode (show files as they are copied):**


    ```bash

    cp -v file1.txt file2.txt /path/to/destination/

    ```


    ## 7. mv: Move or rename files or directories.


    The `mv` command in Linux is used to move or rename files and directories. It
    allows you to change the name of a file or move it from one directory to another.


    ### Examples:


    - **Rename a file:**


    ```bash

    mv old_file.txt new_file.txt

    ```


    This command renames "old_file.txt" to "new_file.txt."


    - **Move a file to a different directory:**


    ```bash

    mv file.txt /path/to/destination/

    ```


    Moves "file.txt" to the specified destination directory.


    - **Move multiple files to a directory:**


    ```bash

    mv file1.txt file2.txt /path/to/destination/

    ```


    Moves multiple files to the specified destination directory.


    - **Interactive mode:**


    ```bash

    mv -i file.txt /path/to/destination/

    ```


    Prompts for confirmation if the destination file already exists.


    - **Update mode:**


    ```bash

    mv -u newer_file.txt /path/to/destination/

    ```


    Moves only if "newer_file.txt" is newer than the existing file in the destination.


    - **Verbose mode:**


    ```bash

    mv -v file.txt /path/to/destination/

    ```


    Displays detailed information about the move operation.


    ## 8. touch: Create an empty file or update the timestamp of an existing file.


    The `touch` command in Linux is used to update the access and modification timestamps
    of a file or create an empty file if it doesn''t exist. It''s a versatile command
    that allows users to manipulate file timestamps without modifying the file content.


    ### Examples:


    - **Create a new empty file:**


    ```bash

    touch newfile.txt

    ```


    This command creates a new file named `newfile.txt` in the current directory.


    - **Update the access and modification timestamps of a file:**


    ```bash

    touch existingfile.txt

    ```


    This command updates the access and modification timestamps of `existingfile.txt`
    to the current time.


    - **Change only the access time:**


    ```bash

    touch -a file.txt

    ```


    This command updates only the access timestamp of `file.txt`.


    - **Change only the modification time:**


    ```bash

    touch -m file.txt

    ```


    This command updates only the modification timestamp of `file.txt`.


    - **Use a specified date and time:**


    ```bash

    touch -d "2023-11-10 12:30" file.txt

    ```


    This command sets the access and modification timestamps of `file.txt` to the
    specified date and time.


    - **Prevent file creation:**


    ```bash

    touch -c non_existent_file.txt

    ```


    This command checks if `non_existent_file.txt` exists; if not, it does not create
    the file.


    ## 9. cat: Display the contents of a file.


    The `cat` command in Linux is short for "concatenate." It is a versatile utility
    that is used to display the content of one or more files, concatenate files, create
    new files, and concatenate and display them on the standard output. The `cat`
    command is a simple and frequently used command in Linux.


    ### Examples:


    - **Display the content of a file:**


    ```bash

    cat filename.txt

    ```


    - **Concatenate multiple files and display the output:**

