    # 37. userdel: Delete a user account.


    The `userdel` command in Linux is used to delete a user account and related files
    from the system. It is a powerful command that requires administrative privileges
    to execute. When a user account is deleted, the associated home directory and
    mail spool are typically removed, but the user''s files in other locations are
    not touched.


    **Examples:**


    +   1. **Basic usage:**


    ```

    sudo userdel mohan

    ```


    This will delete the user account named "mohan."


    +   2. **Remove user and home directory:**


    ```

    sudo userdel -r jane

    ```'
