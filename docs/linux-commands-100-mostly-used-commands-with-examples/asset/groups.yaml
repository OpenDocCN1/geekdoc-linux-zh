    # **65. fsck: File system consistency check and repair.**


    The `fsck` command, which stands for "file system consistency check," is a powerful
    utility used in Linux and other Unix-like operating systems to check and repair
    file system inconsistencies on a disk. It is commonly employed when a system encounters
    unexpected shutdowns, power failures, or other issues that might lead to file
    system corruption. `fsck` can work with various file system types, such as ext2,
    ext3, ext4, and others.


    # **Examples:**'
  - '[PAGE 127]


    # **1. Check a File System:**


    ```

    fck /dev/sda1

    ```


    This command checks and repairs the file system on the device `/dev/sda1`. Replace
    `/dev/sda1` with the appropriate device identifier for your system.


    # **2. Automatically Repair File System:**


    ```

    fck -y /dev/sda1

    ```


    The `-y` option automatically answers **yes** to all questions asked by `fck`,
    making it suitable for unattended repair processes.


    # **3. Interactive Repair:**


    ```

    fck -r /dev/sda1

    ```


    The `-r` option prompts the user for confirmation before fixing each issue. This
    allows you to review and approve each repair manually.


    # **4. Check and Repair All File Systems:**'
  - '[PAGE 128]


    ```

    ```text

    fcsk -A

    ```

    ```


    This command checks and repairs all file systems specified in the `/etc/fstab`
    file. It''s often used during the system boot process.


    # ### 5. Check a Specific File System Type:


    ```

    ```text

    fcsk.ext4 /dev/sda1

    ```

    ```


    In this example, `fcsk.ext4` is used specifically for the ext4 file system. Different
    file systems may have their own `fcsk` variants.


    # ### 6. Force File System Check Even if Clean:


    ```

    ```text

    fcsk -f /dev/sda1

    ```

    ```


    The `-f` option forces a file system check even if it appears clean. This can
    be useful for ensuring a thorough examination.


    # ### 7. Check and Repair Root File System:'
  - '[PAGE 129]


    ```

    fsck -f /

    ```


    To check and repair the root file system, you may need to boot from a live CD
    or another bootable media to unmount the root partition.


    # 8. Dry Run (Check, but don''t repair):


    ```

    fsck -n /dev/sda1

    ```


    The `-n` option performs a dry run, displaying what would be done without actually
    making any changes to the file system.


