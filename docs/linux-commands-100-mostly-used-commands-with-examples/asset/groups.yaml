    # 63. nmap：网络探索工具和安全扫描器


    `nmap`（Network Mapper，网络映射器）是一款功能强大且多用途的开源工具，用于网络发现和安全审计。它常用于发现计算机网络中的主机和服务，并创建网络结构的地图。`nmap`
    通过向目标主机发送数据包并分析响应来工作。


    ## 示例


    1. **基本扫描：**


    ```text

    nmap target_ip

    ```


    该命令对指定的目标 IP 地址执行基本扫描。它显示开放端口及其关联的服务。


    2. **扫描 IP 地址范围：**


    ```text

    nmap 192.168.1.1-50

    ```


    扫描从 192.168.1.1 到 192.168.1.50 的 IP 地址范围。


    3. **扫描整个子网：**


    ```text

    nmap 192.168.1.0/24

    ```


    扫描 192.168.1.0/24 子网中的所有 IP 地址。


    4. **扫描多个主机：**


    ```text

    nmap host1 host2 host3

    ```


    扫描命令行中指定的多个主机。


    5. **激进扫描：**


    ```text

    nmap -A target_ip

    ```


    执行激进扫描，包括操作系统检测、版本检测、脚本扫描和路由跟踪。


    6. **服务版本检测：**


    ```text

    nmap -sV target_ip

    ```


    尝试确定运行在开放端口上的服务的版本。


    7. **操作系统检测：**


    ```text

    nmap -O target_ip

    ```


    尝试确定目标的操作系统。


    8. **扫描特定端口：**


    ```text

    nmap -p 80,443 target_ip

    ```


    仅扫描指定的端口（在此示例中为 80 和 443）。


    9. **扫描所有 65535 个端口：**


    ```text

    nmap -p- target_ip

    ```


    扫描所有 65535 个端口。这可能需要更长时间，但可确保不会遗漏任何端口。


    10. **输出到文件：**


    ```text

    nmap -oN output.txt target_ip

    ```


    将结果保存为名为 "output.txt" 的普通格式文件。


    11. **以 XML 格式输出：**


    ```text

    nmap -oX output.xml target_ip

    ```


    以 XML 格式保存结果。


    12. **脚本扫描：**


    ```text

    nmap --script=default target_ip

    ```


    对目标执行默认脚本。


    13. **定时和性能：**


    ```text

    nmap -T4 target_ip

    ```


    将定时模板设置为激进模式，平衡速度和可靠性。


    14. **Ping 扫描：**


    ```text

    nmap -sn target_ip

    ```


    执行 ping 扫描，不进行端口扫描。


    15. **UDP 扫描：**


    ```text

    nmap -sU target_ip

    ```


    对目标执行 UDP 扫描。


