  mdcn: "\n\n## 35. ltrace：库调用跟踪器。\n\n`ltrace` 是 Linux 中的一个命令行实用工具，用于拦截并显示程序所执行的动态库调用。它可以让你查看进程调用的库函数和系统调用，从而提供程序运行期间行为的重要见解。\n\
    \n**示例：**\n\n- 1. 基本用法：\n\n  ```bash\n  ltrace ls\n  ```\n\n  此命令跟踪由 `ls` 命令执行的动态库调用。\n\
    \n- 2. 过滤输出：\n\n  ```bash\n  ltrace -e fopen ls\n  ```\n\n  `-e` 选项允许你过滤输出，仅显示你感兴趣的函数。在此示例中，它仅跟踪由\
