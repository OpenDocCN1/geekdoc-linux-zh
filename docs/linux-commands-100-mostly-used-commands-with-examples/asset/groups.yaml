    # **35. ltrace: A library call tracer.**


    `ltrace` is a command-line utility in Linux used for intercepting and displaying
    dynamic library calls that a program makes. It allows you to see the library functions
    and system calls that a process invokes, providing valuable insights into the
    behavior of a program during its execution.


    **Examples:**


    +   **1. Basic Usage:**


    ```

    ltrace ls

    ```


    This command traces the dynamic library calls made by the `ls` command.


    +   **2. Filtering Output:**


    ```

    ltrace -e fopen ls

    ```'
  - '[PAGE 69]


    The `-e` option allows you to filter the output to display only the functions
    you''re interested in. In this example, it traces only calls to the `fopen` function
    made by the `ls` command.


    3. **Redirecting Output to a File:**


    ```

    ltrace -o output.txt ls

    ```


    This command redirects the output of `ltrace` to a file named `output.txt` instead
    of printing it to the terminal.


    4. **Tracing a Specific Process by PID:**


    ```

    ltrace -p <pid>

    ```


    Replace `<pid>` with the process ID of the running process you want to trace.
    This is useful for attaching `ltrace` to an already running process.


    5. **Displaying System Calls:**


    ```

    ltrace -S ls

    ```


    The `-S` option includes the display of system calls in addition to library calls.


    6. **Tracing a 32-bit Process on a 64-bit System:**'
  - '[PAGE 70]


    ```

    ltrace -a 32 -c ls

    ```


    Use the `-a` option to specify the architecture (in this case, 32-bit) when tracing
    a process on a 64-bit system.


    # 7. Filtering by Library:


    ```

    ltrace -l libm.so ls

    ```


    This traces only the calls to functions from the `libm` library made by the `ls`
    command.


    # 8. Displaying Time and Counts:


    ```

    ltrace -c ls

    ```


    The `-c` option displays a summary of the number of calls and time spent in each
    function.


    # 9. Tracing a Program with Command-Line Arguments:


    ```

    ltrace gzip file.txt

    ```'
