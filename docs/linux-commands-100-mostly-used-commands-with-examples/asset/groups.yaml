    \ of 5 seconds. If no response is received within this time, the ping command\
    \ stops.\n\n- **Quiet Mode:**\n  ```\n  ping -q google.com\n  ```\n  This runs\
    \ the ping command in quiet mode, showing only the summary at the end.\n\n- **Verbose\
    \ Mode:**\n  ```\n  ping -v google.com\n  ```\n  This runs the ping command in\
