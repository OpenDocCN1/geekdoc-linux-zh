    **示例：**


    - 1. **捕获特定接口上的所有数据包**


    ```bash

    tcpdump -i eth0

    ```


    此命令捕获 `eth0` 接口上的所有数据包。


    - 2. **捕获具有特定源或目标 IP 地址的数据包**


    ```bash

    tcpdump host 192.168.1.2

    ```


    这捕获 IP 地址 192.168.1.2 为源或目标的数据包。


    - 3. **捕获特定端口上的数据包**


    ```bash

    tcpdump port 80

    ```


    这捕获端口 80 上的数据包。


    - 4. **捕获来自特定 IP 和端口的数据包**


    ```bash

    tcpdump src 192.168.1.2 and port 22

    ```


    这捕获源 IP 为 192.168.1.2 且端口为 22 的数据包。


    - 5. **捕获并显示数据包详细信息（详细模式）**


    ```bash

    tcpdump -v

    ```


    此命令提供有关每个捕获数据包的更详细信息。


    - 6. **捕获特定数量的数据包**


    ```bash

    tcpdump -c 10

    ```


    这捕获并显示前 10 个数据包，然后退出。


    - 7. **将捕获的数据包写入文件**


    ```bash

    tcpdump -w capture.pcap

    ```


    这将捕获的数据包写入名为 `capture.pcap` 的文件，之后可以使用 Wireshark 等工具进行分析。


    - 8. **从文件读取数据包**


    ```bash

    tcpdump -r capture.pcap

    ```


    这从指定的 `capture.pcap` 文件中读取并显示数据包。


    - 9. **仅捕获 TCP 或 UDP 数据包**


    ```bash

    tcpdump tcp

    ```


    或


    ```bash

    tcpdump udp

    ```


    这分别仅捕获 TCP 或 UDP 数据包。


    - 10. **捕获具有特定协议的数据包**


    ```bash

    tcpdump icmp

    ```


    这仅捕获 ICMP（ping）数据包。


    - 11. **捕获非详细输出**


    ```bash

    tcpdump -q

    ```


    这提供更少细节的安静输出。


