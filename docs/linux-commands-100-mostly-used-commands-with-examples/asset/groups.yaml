    ## 96. renice: 更改运行中进程的优先级


    Linux 中的 `renice` 命令用于更改运行中进程的调度优先级。此命令允许您更改进程的 nice 值，该值决定了其在系统调度器中的优先级。nice
    值的范围从 -20 到 19，数值越低表示优先级越高。


    **示例：**


    - 1. **通过 ID 更改特定进程的优先级**


    ```bash

    renice 10 -p 1234

    ```


    此命令将 ID 为 1234 的进程的优先级增加到 nice 值 10。


    - 2. **更改进程组的优先级**


    ```bash

    renice -5 -g 5678

    ```


    此命令将 ID 为 5678 的进程组中所有进程的优先级降低到 nice 值 -5。


    - 3. **更改由用户拥有的所有进程的优先级**


    ```bash

    renice 3 -u username

    ```


    此命令将用户 "username" 拥有的所有进程的优先级提高到 nice 值 3。


    - 4. **查看进程当前优先级**


    ```bash

    renice -p 5678

    ```


    此命令显示 ID 为 5678 的进程的当前优先级。


    ## 97. sync: 将缓存写入同步到持久存储


    Linux 中的 `sync` 命令用于确保文件系统的所有待处理更改写入磁盘。它有助于同步系统内存中的数据与磁盘上的数据，从而在意外关机或断电的情况下降低数据丢失的风险。`sync`
    命令不会直接刷新文件系统缓冲区，而是安排它们在最早的机会进行刷新。


    **示例：**


    - 1. **基本用法**


    ```bash

    sync

    ```


    仅使用该命令即可同步所有文件系统缓冲区。


    - 2. **使用文件描述符**


    ```bash

    sync; echo 3 > /proc/sys/vm/drop_caches

    ```


    此序列首先同步文件系统缓冲区，然后清除页缓存、dentries 和 inodes。


    - 3. **带选项使用**


    ```bash

    sync -f -d -v

    ```


    - `-f`：即使文件系统处于干净状态也强制执行同步操作。

    - `-d`：启用磁盘写入缓存。

    - `-v`：详细模式。


    - 4. **关机前同步**


    ```bash

    sync && shutdown -h now

    ```


    此命令同步文件系统，然后启动系统关机。


    - 5. **查看同步进度**


    ```bash

    watch -n 1 sync

    ```


    这每秒更新一次同步状态。


