    # 26. sed: A stream editor for filtering and transforming text.


    `sed` stands for stream editor and is a powerful text processing tool in Linux.
    It is used for performing basic text transformations on an input stream (a file
    or input from a pipeline) and producing an output stream. `sed` is often used
    for substitution, deletion, insertion, and other text manipulations in scripts
    and one-liners.


    Examples:


    +   1. **Substitute text in a file:**


    ```

    sed ''s/apple/orange/'' fruits.txt

    ```


    This command replaces the first occurrence of "apple" with "orange" in the file
    `fruits.txt` and prints the result to the standard output.


    +   2. **Substitute all occurrences globally:**'
  - '[PAGE 49]


    ```

    sed ''s/apple/orange/g'' fruits.txt

    ```


    This command replaces all occurrences of "apple" with "orange" in the file `fruits.txt`
    .


    # 3. **Delete lines containing a specific pattern:**


    ```

    sed ''/pattern/d'' file.txt

    ```


    This command deletes all lines containing the specified pattern from the file
    `file.txt` .


    # 4. **Print specific lines:**


    ```

    sed -n ''1,5p'' file.txt

    ```


    This command prints lines 1 to 5 from the file `file.txt` without automatically
    printing other lines.


    # 5. **In-place editing (update the file):**


    ```

    sed -i ''s/old/new/'' file.txt

    ```'
  - '[PAGE 50]


    This command replaces the first occurrence of "old" with "new" in the file `file.txt`
    and updates the file in place.


