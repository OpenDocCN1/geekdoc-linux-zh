    \  ```bash\n  ltrace -a 32 -c ls\n  ```\n\n  使用 `-a` 选项在 64 位系统上跟踪进程时指定架构（在此情况下为\
    \ 32 位）。\n\n- 7. 按库过滤：\n\n  ```bash\n  ltrace -l libm.so ls\n  ```\n\n  此命令仅跟踪由\
    \ `ls` 命令对 `libm` 库中函数的调用。\n\n- 8. 显示时间和计数：\n\n  ```bash\n  ltrace -c ls\n  ```\n\
    \n  `-c` 选项显示每个函数的调用次数和所花时间摘要。\n\n- 9. 跟踪带有命令行参数的程序：\n\n  ```bash\n  ltrace gzip\
    \ file.txt\n  ```\n\n  你可以连同其命令行参数一起跟踪程序。\n\n- 10. 跟踪多个命令：\n\n  ```bash\n  ltrace\
