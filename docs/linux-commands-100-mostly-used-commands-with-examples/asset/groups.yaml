    # 97. sync: Synchronize cached writes to persistent storage.


    The `sync` command in Linux is used to ensure that all pending changes to the
    file system are written to disk. It helps in synchronizing the system''s in-memory
    data with the data on the disk, reducing the risk of data loss in case of unexpected
    shutdowns or power failures. The `sync` command does not directly flush the file
    system buffers but schedules them to be flushed at the earliest opportunity.


    Examples:


    +   1. **Basic Usage:**


    ```

    sync

    ```


    This command by itself synchronizes all file system buffers.


    +   2. **Using with File Descriptors:**


    ```

    sync; echo 3 > /proc/sys/vm/drop_caches

    ```'
  - '[PAGE 213]


    This sequence first synchronizes the file system buffers and then clears the page
    cache, dentries, and inodes.


    # 3. **With Options**:


    ```

    sync -f -d -v

    ```


    +   - `-f` : Force the sync operation even if file systems are clean.

    +   - `-d` : Enable disk write caching.

    +   - `-v` : Verbose mode.


    # 4. **Sync before Shutdown**:


    ```

    sync && shutdown -h now

    ```


    This command syncs the file system and then initiates a system shutdown.


    # 5. **Viewing Sync Progress**:


    ```

    watch -n 1 sync

    ```


    This updates the sync status every second.'
