    \ Protocol (IP) network. It also measures the round-trip time for messages sent\
    \ from the originating host to a destination computer. The name \"ping\" comes\
    \ from the sonar sound used by submarines to detect other objects in the water.\n\
    \n### Examples:\n\n- **Simple Ping:**\n  ```\n  ping google.com\n  ```\n  This\
    \ will send a series of ICMP Echo Requests to google.com, and you'll see the round-trip\
    \ time for each packet.\n\n- **Set Number of Packets:**\n  ```\n  ping -c 4 google.com\n\
    \  ```\n  This sends only 4 packets to google.com and then stops.\n\n- **Set Packet\
    \ Size:**\n  ```\n  ping -s 100 google.com\n  ```\n  This sends packets of size\
