    \ `vi` 编辑器的增强版本。它以效率高和功能集广泛著称，但与 `nano` 相比，其学习曲线更陡峭。\n\n**示例：**\n\n要编辑名为 \"example.txt\"\
    \ 的文件，请运行：\n\n```\nvim example.txt\n```\n\n## 11. grep：在文件中搜索特定模式。\n\n`grep` 是\
    \ Linux 中一个强大的命令行实用程序，用于在文件中搜索文本模式。其名称源自 ed 命令 `g/re/p` (global/regular expression/print)，该命令曾用于类似的目的。\n\
    \n**示例：**\n\n- 1. **基本搜索：**\n\n```\ngrep \"pattern\" filename\n```\n\n- 2. **不区分大小写的搜索：**\n\
    \n```\ngrep -i \"pattern\" filename\n```\n\n- 3. **在子目录中递归搜索：**\n\n```\ngrep -r\
    \ \"pattern\" /path/to/directory\n```\n\n- 4. **显示行号：**\n\n```\ngrep -n \"pattern\"\
    \ filename\n```\n\n- 5. **反向匹配（排除包含模式的行）：**\n\n```\ngrep -v \"pattern\" filename\n\
    ```\n\n- 6. **计算匹配行的数量：**\n\n```\ngrep -c \"pattern\" filename\n```\n\n- 7. **显示匹配行前后几行：**\n\
    \n```\ngrep -A 2 -B 2 \"pattern\" filename\n```\n\n- 8. **带行号且不区分大小写的递归搜索：**\n\
    \n```\ngrep -rin \"pattern\" /path/to/directory\n```\n\n## 12. chmod：更改文件权限。\n\
    \n`chmod` 是一个用于更改文件和目录权限的 Linux 命令。\"chmod\" 是 \"change mode\"（更改模式）的缩写，它允许你控制谁可以读取、写入和执行文件。\n\
    \n### 模式：\n\n模式由三个部分组成：用户（user）、组（group）和其他人（others），每个部分都有读取（`r`）、写入（`w`）和执行（`x`）权限。此外，你可以使用数字表示法来设置权限。\n\
    \n- 符号表示：\n  - `u` 代表用户\n  - `g` 代表组\n  - `o` 代表其他人\n  - `a` 代表所有人（相当于 `ugo`）\n\
    - 权限符号：\n  - `r` 代表读取\n  - `w` 代表写入\n  - `x` 代表执行\n- 运算符：\n  - `+` 用于添加权限\n  -\
    \ `-` 用于移除权限\n  - `=` 用于明确设置权限\n- 文件：\n  指你想要修改权限的文件或目录。\n\n**示例：**\n\n1. **授予文件所有者读取和写入权限：**\n\
    \n```\nchmod u+rw file.txt\n```\n\n2. **移除脚本的组执行权限：**\n\n```\nchmod g-x script.sh\n\
    ```\n\n3. **递归地给予目录及其内容的读取和执行权限给所有人：**\n\n```\nchmod -R a+rx directory/\n```\n\
    \n4. **使用数字表示法设置特定权限（读: 4, 写: 2, 执行: 1）：**\n\n```\nchmod 754 file.txt\n```\n\n\
    在此示例中，用户拥有读取、写入和执行权限（4+2+1 = 7），组拥有读取和执行权限（4+1 = 5），其他人只有只读权限（4）。\n\n## 13. chown：更改文件所有者或组。\n\
    \nLinux 中的 `chown` 命令用于更改文件或目录的所有权。所有权指的是与文件或目录关联的用户和组。当需要将文件或目录的所有权从一个用户转移到另一个用户时，此命令特别有用。\n\
    \n**示例：**\n\n- 1. **基本用法 - 更改文件的所有权：**\n\n```\nchown newowner:newgroup myfile.txt\n\
    ```\n\n该命令将 `myfile.txt` 的所有权更改为用户 `newowner` 和组 `newgroup`。\n\n- 2. **递归更改目录的所有权：**\n\
    \n```\nchown -R newowner:newgroup mydirectory\n```\n\n该命令递归地将 `mydirectory` 内所有文件和子目录的所有权更改为用户\
    \ `newowner` 和组 `newgroup`。\n\n- 3. **详细输出：**\n\n```\nchown -c newowner:newgroup\
    \ myfile.txt\n```\n\n该命令提供详细输出，指示对 `myfile.txt` 所有权所做的更改。\n\n- 4. **基于当前所有者更改所有权：**\n\
    \n```\nchown --from=currentowner:currentgroup newowner:newgroup myfile.txt\n```\n\
    \n该命令将 `myfile.txt` 的所有权从当前所有者 `currentowner` 和组 `currentgroup` 更改为新所有者 `newowner`\
    \ 和组 `newgroup`。\n\n## 14. ps：显示正在运行的进程信息。\n\nLinux 中的 `ps` 命令用于显示当前正在运行的进程的信息。它提供系统当前进程的快照，包括它们的进程\
    \ ID (PID)、终端关联、资源使用率以及其他详细信息。\n\n**示例：**\n\n1. **显示系统中所有正在运行的进程列表：**\n\n```\n\
    ps\n```\n\n2. **显示所有进程的详细信息：**\n\n```\nps -ef\n```\n\n3. **显示所有进程的完整格式列表：**\n\n\
    ```\nps -f\n```\n\n4. **显示由特定用户拥有的进程信息（将 `username` 替换为实际用户名）：**\n\n```\nps -u\
    \ username\n```\n\n5. **显示树状进程层次结构：**\n\n```\nps -e --forest\n```\n\n## 15. kill：终止进程。\n\
    \nLinux 中的 `kill` 命令用于向进程发送信号，允许你终止或操控其行为。\n\n**示例：**\n\n- 1. **使用默认信号终止进程：**\n\
    \n```\nkill 1234\n```\n\n这向 PID 为 1234 的进程发送 SIGTERM 信号。\n\n- 2. **强制终止进程：**\n\
    \n```\nkill -9 5678\n```\n\n这向 PID 为 5678 的进程发送 SIGKILL 信号，强制终止它。\n\n- 3. **重启进程：**\n\
    \n```\nkill -HUP 9876\n```\n\n这向 PID 为 9876 的进程发送 SIGHUP 信号，通常用于重启进程。\n\n- 4.\
    \ **暂停进程：**\n\n```\nkill -STOP 1111\n```\n\n这向 PID 为 1111 的进程发送 SIGSTOP 信号，使其暂停。\n\
    \n- 5. **恢复已暂停的进程：**\n\n```\nkill -CONT 1111\n```\n\n这向 PID 为 1111 的暂停进程发送 SIGCONT\
    \ 信号，恢复其执行。\n\n## 16. top：显示实时系统统计信息。\n\nLinux 中的 `top` 命令是一个强大的实用程序，提供系统性能的实时动态概览。它显示有关进程、系统资源使用率和其他重要统计信息。`top`\
    \ 命令对于监控系统活动、识别资源消耗大的进程以及了解整体系统健康状况特别有用。\n\n**示例：**\n\n- 1. **显示动态概览：**\n\n```\n\
    top\n```\n\n这将以交互模式启动 `top`，显示有关进程和系统资源的实时信息。\n\n- 2. **设置更新间隔：**\n\n```\ntop\
    \ -d 5\n```\n\n以 5 秒的更新间隔启动 `top`，每 5 秒提供一次信息。\n\n- 3. **监控特定用户的进程：**\n\n```\n\
    top -u username\n```\n\n显示由指定用户（`username`）拥有的进程信息。\n\n- 4. **按 PID 监控特定进程：**\n\
    \n```\ntop -p 1234,5678\n```\n\n监控指定进程 ID (PID) 的进程 - 在此示例中为 1234 和 5678。\n\n\
    - 5. **在特定迭代次数后退出：**\n\n```\ntop -n 5\n```\n\n运行 `top` 5 次迭代后退出。\n\n## 17. df：显示磁盘空间使用情况。\n\
    \nLinux 中的 `df` 命令用于显示文件系统上的磁盘空间使用情况。它提供有关每个已挂载文件系统的总磁盘空间、已用空间、可用空间以及已用空间百分比的详细信息。此命令对于监控磁盘空间和识别存储问题特别有用。\n\
    \n**示例：**\n\n- 1. **显示所有已挂载文件系统的磁盘空间使用情况：**\n\n```\ndf\n```\n\n"
