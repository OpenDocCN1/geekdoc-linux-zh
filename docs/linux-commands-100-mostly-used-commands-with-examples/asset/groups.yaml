    \n## 20. wget：从互联网下载文件。\n\n`wget` 是一个用于从互联网下载文件的命令行实用工具。它支持通过 HTTP、HTTPS 和 FTP\
    \ 协议进行下载。它是一个功能强大的工具，具有各种选项和功能，用于从 Web 服务器检索内容。\n\n### 示例：\n\n- 1. **基本用法**：\n\
    \n  ```\n  wget https://example.com/file.zip\n  ```\n\n  此命令从指定 URL 下载 file.zip。\n\
    \n- 2. **以不同名称保存**：\n\n  ```\n  wget -O newfile.zip https://example.com/file.zip\n\
    \  ```\n\n  从 URL 下载文件，但保存为 `newfile.zip`。\n\n- 3. **在后台下载**：\n\n  ```\n  wget\
    \ -b https://example.com/largefile.zip\n  ```\n\n  在后台下载文件，允许你继续使用该终端。\n\n- 4.\
    \ **递归下载**：\n\n  ```\n  wget -r -np https://example.com/directory/\n  ```\n\n\
