    \ fork（分叉），而 `F` 选项显示函数参数。\n\n## 36. useradd：创建新的用户账户。\n\nLinux 中的 `useradd` 命令用于在系统上创建新的用户账户。它是一个基本命令，允许你在创建新用户时指定各种参数。\n\
