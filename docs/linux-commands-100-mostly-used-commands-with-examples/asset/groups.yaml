    \n- **静默模式：**\n  ```\n  ping -q google.com\n  ```\n  这以静默模式运行 ping 命令，仅在最后显示摘要。\n\
    \n- **详细模式：**\n  ```\n  ping -v google.com\n  ```\n  这以详细模式运行 ping 命令，提供关于每个数据包的更详细信息。\n\
    \n- **IPv6 Ping：**\n  ```\n  ping6 ipv6.google.com\n  ```\n  这执行使用 IPv6 的 ping。`ping6`\
    \ 命令用于 IPv6 地址。\n\n## 31. traceroute：显示数据包到达网络主机所经过的路由。\n\nTraceroute 是一个在 Linux\
    \ 和其他操作系统中使用的命令行工具，用于追踪数据包从您的计算机到目标 IP 地址或域名所经过的路由。它有助于识别网络路径并测量数据包在互联网上的传输延迟。\n\
    \n### 示例：\n\n- **基本用法：**\n  ```\n  traceroute example.com\n  ```\n  此命令追踪到 `example.com`\
    \ 的 IP 地址的路由，显示沿途的路由器（跃点）列表。\n\n- **指定最大 TTL：**\n  ```\n  traceroute -m 15 example.com\n\
    \  ```\n  将最大 TTL 设置为 15，限制追踪的跃点数。\n\n- **不解析主机名：**\n  ```\n  traceroute -n example.com\n\
    \  ```\n  显示 IP 地址而不是将它们解析为主机名，这可以加快处理速度。\n\n- **设置查询数据包：**\n  ```\n  traceroute\
    \ -q 5 example.com\n  ```\n  每个跃点发送 5 个查询数据包，而不是默认的 3 个。\n\n- **使用 UDP 数据包：**\n\
    \  ```\n  traceroute -U example.com\n  ```\n  使用 UDP 数据包，而不是默认的 ICMP Echo 请求数据包。\n\
    \n- **指定等待时间：**\n  ```\n  traceroute -w 2 example.com\n  ```\n  设置等待响应的时间（秒数），然后再发送下一个数据包。\n\
    \n- **追踪到特定端口：**\n  ```\n  traceroute -p 80 example.com\n  ```\n  指定目标端口（例如，HTTP\
    \ 的 80 端口）。\n\n- **IPv6 Traceroute：**\n  ```\n  traceroute -6 ipv6.example.com\n\
    \  ```\n  使用 IPv6 地址执行 traceroute。\n\n- **将输出保存到文件：**\n  ```\n  traceroute example.com\
    \ > trace_output.txt\n  ```\n  将输出重定向到文件以便后续分析。\n\n- **连续追踪：**\n  ```\n  traceroute\
    \ -q 1 -w 1 -n -A example.com\n  ```\n  连续追踪路由，每个跃点发送单个数据包，等待时间最短。\n\n## 32. ifconfig\
    \ 或 ip：配置网络接口。\n\n### `ifconfig` 命令：\n\n`ifconfig` 命令用于配置 Linux 系统上的网络接口。它允许您查看和配置网络接口的\
    \ IP 地址、子网掩码、广播地址和其他参数。然而，在许多现代 Linux 发行版中，`ifconfig` 已被弃用，转而使用更强大的 `ip` 命令。\n\
    \n#### 示例：\n\n1. **查看网络接口：**\n   ```\n   ifconfig\n   ```\n   此命令显示系统中所有网络接口的信息。\n\
    \n2. **查看特定接口的信息：**\n   ```\n   ifconfig eth0\n   ```\n   将“eth0”替换为您的网络接口名称。此命令显示指定接口的详细信息。\n\
    \n3. **分配 IP 地址：**\n   ```\n   sudo ifconfig eth0 192.168.1.2\n   ```\n   此命令将\
    \ IP 地址 192.168.1.2 分配给“eth0”接口。\n\n4. **设置子网掩码：**\n   ```\n   sudo ifconfig eth0\
    \ netmask 255.255.255.0\n   ```\n   为“eth0”接口设置子网掩码。\n\n5. **启用或禁用接口：**\n   ```\n\
    \   sudo ifconfig eth0 up\n   sudo ifconfig eth0 down\n   ```\n   这些命令分别启用或禁用“eth0”接口。\n\
    \n### `ip` 命令：\n\n`ip` 命令是一个更强大、更灵活的网络接口配置和管理工具。它提供了 `ifconfig` 之外的广泛功能。\n\n####\
    \ 示例：\n\n1. **查看网络接口：**\n   ```\n   ip link show\n   ```\n   此命令显示系统中所有网络接口的信息。\n\
    \n2. **查看 IP 地址：**\n   ```\n   ip address show\n   ```\n   显示分配给所有接口的 IP 地址的详细信息。\n\
    \n3. **分配 IP 地址：**\n   ```\n   sudo ip address add 192.168.1.2/24 dev eth0\n \
    \  ```\n   将 IP 地址 192.168.1.2 和子网掩码 255.255.255.0 分配给“eth0”接口。\n\n4. **设置子网掩码：**\n\
    \   ```\n   sudo ip address add 192.168.1.2/24 dev eth0\n   ```\n   这也为“eth0”接口设置了子网掩码。\n\
    \n5. **启用或禁用接口：**\n   ```\n   sudo ip link set eth0 up\n   sudo ip link set eth0\
    \ down\n   ```\n   这些命令分别启用或禁用“eth0”接口。\n\n6. **显示路由表：**\n   ```\n   ip route\
    \ show\n   ```\n   显示内核路由表。\n\n## 33. netstat：显示网络连接、路由表、接口统计、伪装连接和多播成员关系。\n\n\
    Linux 中的 `netstat` 命令是一个强大的网络实用工具，用于显示有关网络连接、路由表、接口统计、伪装连接等的信息。它提供了多种选项，帮助您分析和排除网络相关问题。\n\
    \n### 示例：\n\n- **使用数字地址显示所有监听和非监听套接字：**\n  ```\n  netstat -an\n  ```\n\n- **显示所有协议的统计信息：**\n\
    \  ```\n  netstat -s\n  ```\n\n- **显示所有 TCP 连接及使用它们的过程：**\n  ```\n  netstat -atp\n\
    \  ```\n\n- **显示路由表：**\n  ```\n  netstat -r\n  ```\n\n- **仅显示监听中的 TCP 套接字：**\n\
