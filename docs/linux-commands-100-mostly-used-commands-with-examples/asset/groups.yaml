    # 21. **ssh: Connect to a remote server securely.**'
  - '[PAGE 35]


    The `ssh` command, which stands for "Secure Shell," is a widely used protocol
    for securely connecting to a remote server or device over a network. It provides
    a secure encrypted communication between two systems, allowing users to access
    and manage remote systems as if they were local. The `ssh` command is commonly
    used in Unix-like operating systems, including Linux.


    # Examples:


    1. **Basic SSH Connection:**


    ```

    ssh username@remote-host

    ```


    This command establishes an SSH connection to the remote host with the specified
    username.


    2. **Specifying a Port:**


    ```

    ssh -p 2222 username@remote-host

    ```


    Connects to the remote host using port 2222. The default SSH port is 22.


    3. **Executing a Command:**


    ```

    ssh username@remote-host ls -l /path/to/directory

    ```'
  - '[PAGE 36]


    Connects to the remote host and executes the `ls -l /path/to/directory` command,
    displaying a detailed list of files in the specified directory.


    # 4. Identity File (Private Key):


    ```

    ssh -i /path/to/private-key username@remote-host

    ```


    Specifies the path to the private key file for authentication. Useful when using
    key-based authentication instead of a password.


    # 5. Tunneling (Port Forwarding):


    ```

    ssh -L 8080:localhost:80 username@remote-host

    ```


    Sets up local port forwarding, redirecting traffic from port 8080 on the local
    machine to port 80 on the remote host.


    # 6. X11 Forwarding:


    ```

    ssh -X username@remote-host

    ```


    Enables X11 forwarding, allowing the remote server to display graphical applications
    on the local machine.'
  - '[PAGE 37]


    # **22. scp: Securely copy files between local and remote machines.**


    `scp` stands for Secure Copy Protocol, and it is a command-line tool used in Linux
    and Unix-like operating systems to securely copy files and directories between
    hosts. It uses SSH (Secure Shell) for data transfer and provides encryption and
    authentication.


    # **Examples:**


    +   1. **Copy a file from local to remote host:**


    ```

    ```

    scp file.txt username@remote_server_ip/path/to/destination/

    ```

    ```


    Replace `file.txt` with the name of the file you want to copy, `username` with
    the username on the remote server, `remote_server_ip` with the IP address of the
    remote server, and `/path/to/destination/` with the destination path on the remote
    server.


    +   2. **Copy a file from remote to local host:**


    ```

    ```

    scp username@remote_server_ip/path/to/file.txt /local/path/

    ```

    ```


    This command copies the `file.txt` from the remote server to the local machine.
    Adjust the paths and username accordingly.'
  - '[PAGE 38]


    # 3. Copy an entire directory from local to remote host:


    ```

    scp -r my_directory username@remote_server_ip:/path/to/destination/

    ```


    The `-r` option is used to copy directories recursively.


    # 4. Copy from remote to local with a specific port:


    ```

    scp -P 2222 username@remote_server_ip:/path/to/file.txt /local/path/

    ```


    Here, the `-P` option specifies the port number (2222 in this example).


    # 5. Copy with compression:


    ```

    scp -C file.txt username@remote_server_ip:/path/to/destination/

    ```


    The `-C` option enables compression during the transfer.


    # 23. find: Search for files in a directory hierarchy.


    The `find` command in Linux is a powerful and versatile tool used to search for
    files and directories in a directory hierarchy based on various criteria.


    **Examples:**'
  - '[PAGE 39]


    1. **Basic Usage:**


    ```

    find /path/to/search -name "filename.txt"

    ```


    This command searches for a file named "filename.txt" in the specified path.


    2. **Case-Insensitive Search:**


    ```

    find /path/to/search -iname "file*.txt"

    ```


    The `-iname` option performs a case-insensitive search for files matching the
    specified pattern.


    3. **Search by File Type:**


    ```

    find /path/to/search -type f

    ```


    This command finds regular files in the specified path.


    4. **Search by Directory Type:**


    ```

    find /path/to/search -type d

    ```'
  - '[PAGE 40]


    This command finds directories in the specified path.


    # 5. Search for Files Modified in the Last N Days:


    ```

    find /path/to/search -mtime -7

    ```


    This command finds files modified within the last 7 days.


    # 6. Search for Files Larger Than a Specific Size:


    ```

    find /path/to/search -size +1M

    ```


    This command finds files larger than 1 megabyte.


    # 7. Execute Command on Found Files:


    ```

    find /path/to/search -name "*.log" -exec rm {} \;

    ```


    This command finds all files with a ".log" extension and removes them using the
    `rm` command.


    # 8. Combine Multiple Criteria with Logical Operators:


    ```

    find /path/to/search -name "*.txt" -o -name "*.md"

    ```'
