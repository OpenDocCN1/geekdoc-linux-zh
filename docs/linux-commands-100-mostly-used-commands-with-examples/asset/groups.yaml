    login time, JCPU, and PCPU.


    - 6. Display Information with More Details:

    ```

    w -i

    ```

    The `-i` option provides additional information about system idle time and the
    time since the system was last booted.


    - 7. Display Information with Load Average:

    ```

    w -l

    ```

    The `-l` option adds the system load average to the output. The load average represents
    the average number of processes waiting for CPU time over a specific period (1,
    5, and 15 minutes).


    - 8. Display Information in a Specific Format:

    ```

    w -o user,time,from

    ```

    The `-o` option allows you to specify the format of the output. In this example,
    the format includes user, time, and from (remote host).


