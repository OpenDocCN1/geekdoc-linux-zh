    +   7. **Verbose Mode:**


    ```

    `ping -v google.com`

    ```


    This runs the ping command in verbose mode, providing more detailed information
    about each packet.


    +   8. **IPv6 Ping:**


    ```

    `ping6 ipv6.google.com`

    ```


    This performs a ping using IPv6. The `ping6` command is used for IPv6 addresses.


