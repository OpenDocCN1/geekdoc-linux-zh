    of 10.


    2. **Change the priority of a process group:**


    ```

    ```

    renice -5 -g 5678

    ```

    ```


    This command decreases the priority of all processes in the process group with
    ID 5678 to a nice value of -5.


    3. **Change the priority of all processes owned by a user:**


    ```

    ```

    renice 3 -u username

    ```

    ```


    This command raises the priority of all processes owned by the user "username"
    to a nice value of 3.


