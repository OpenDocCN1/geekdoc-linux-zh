  md: '+   1. Display the current working directory:


    ```

    pwd

    ```


    +   2. Display the logical current working directory:


    ```

    pwd -L

    ```


    +   3. Display the physical current working directory:


    ```

    pwd -P

    ```


    # 4. mkdir: Create a new directory.


    The `mkdir` command in Linux is used to create directories or folders. It allows
    users to create one or more directories in a specified location.


    Examples:


    +   1. Basic Usage:'
  merge: -1
  img_proc: true
- pgno: 7
  md: '```

    mkdir my_directory

    ```


    This creates a directory named "my_directory" in the current working directory.


    # 2. Creating Multiple Directories:


    ```

    mkdir dir1 dir2 dir3

    ```


    This command creates three directories named "dir1", "dir2", and "dir3" in the
    current working directory.


    # 3. Setting Permissions:


    ```

    mkdir -m 755 my_directory

    ```


    This creates a directory named "my_directory" with the permission set to 755 (read,
    write, and execute for the owner, and read and execute for others).


    # 4. Creating Parent Directories:'
  merge: -1
  img_proc: true
- pgno: 8
  md: '```

    ```

    mkdir -p path/to/my_directory

    ```

    ```


    This creates the directory "my_directory" along with any necessary parent directories
    (if they don''t exist) in the specified path.


    # 5. rm: Remove files or directories.


    The `rm` command in Linux is used to remove or delete files and directories. It
    allows users to delete one or more files or directories, and it doesn''t move
    them to a trash/recycle bin; instead, it permanently deletes them.


    **Examples:**


    1. **Remove a File:**


    ```

    ```

    rm myfile.txt

    ```

    ```


    This command removes the file named `**myfile.txt**` .


    2. **Remove Multiple Files:**


    ```

    ```

    rm file1.txt file2.txt

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'Removes both `file1.txt` and `file2.txt` .


    # 3. **Remove a Directory:**


    ```

    rm -r mydirectory

    ```


    Recursively removes the directory named `mydirectory` and its contents.


    # 4. **Remove with Confirmation:**


    ```

    rm -i sensitivefile.txt

    ```


    Prompts the user for confirmation before removing the file `sensitivefile.txt`
    .


    # 5. **Forceful Removal:**


    ```

    rm -f stubbornfile.txt

    ```


    Removes the file `stubbornfile.txt` without asking for confirmation, even if it''s
    write-protected.'
  merge: -1
  img_proc: true
