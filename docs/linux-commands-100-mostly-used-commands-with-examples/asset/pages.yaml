  md: '# LINUX COMMANDS


    100 Mostly Used Commands With Examples


    +   1. ls: List files and directories in the current directory.'
  merge: -1
  img_proc: true
- pgno: 2
  md: 'The `ls` command is a fundamental command in Linux and Unix-like operating
    systems used to list files and directories in a directory.


    # Examples:


    +   1. **List files and directories in the current directory:**


    ```

    ```

    ls

    ```

    ```


    +   2. **List files and directories in a specific directory:**


    ```

    ```

    ls /path/to/directory

    ```

    ```


    +   3. **List files in long format with human-readable sizes and hidden files:**


    ```

    ```

    ls -l -h -a

    ```

    ```


    +   4. **List all files and directories recursively:**


    ```

    ```

    ls -R

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 3
  md: '+   5. **List files sorted by modification time** (newest first):


    ```

    ```

    ls -t

    ```

    ```


    # 2. **cd: Change directory.**


    The `cd` command in Linux is used to change the current working directory. It
    allows you to navigate through the file system by moving from one directory to
    another.


    **Examples:**


    +   1. **Change to Home Directory:**


    ```

    ```

    cd

    ```

    ```


    This command takes you to your home directory.


    +   2. **Change to a Specific Directory:**


    ```

    ```

    cd /path/to/directory

    ```

    ```


    Replace "/path/to/directory" with the actual path of the directory you want to
    move into. This is an example of an absolute path.'
  merge: -1
  img_proc: true
- pgno: 4
  md: '# 3. Move Up One Directory:


    ```

    cd ..

    ```


    This command moves you up one level in the directory structure.


    # 4. Move to the Parent Directory:


    ```

    cd ../parent_directory

    ```


    Replace "parent_directory" with the name of the parent directory you want to move
    into. This is an example of a relative path.


    # 5. Move to a Subdirectory:


    ```

    cd subdirectory

    ```


    Replace "subdirectory" with the name of the subdirectory you want to move into.
    This is an example of a relative path.


    # 6. Use of Tilde (~) to Represent Home Directory:'
  merge: -1
  img_proc: true
- pgno: 5
  md: '```

    cd ~/documents

    ```


    This command moves to the "documents" directory inside the user''s home directory.


    7. Navigate Back to the Previous Directory:


    ```

    cd -

    ```


    This command takes you back to the previous working directory.


    8. Use of Environment Variables:


    ```

    cd $HOME

    ```


    This command is equivalent to `cd` without any arguments and takes you to your
    home directory.


    # 3. pwd: Print the current working directory.


    The `pwd` command in Linux stands for "print working directory." It is used to
    display the current working directory, which represents the absolute path of the
    user''s current location in the file system.


    Examples:'
  merge: -1
  img_proc: true
