    # **19. tar: Create or extract tar archives.**


    The `tar` command in Linux is used for creating and manipulating archive files.
    It stands for "tape archive" and is commonly used to bundle multiple files and
    directories into a single archive file. The `tar` command is particularly useful
    for compressing and backing up data.


    **Examples:**


    +   1. **Create a Tar Archive:**


    ```

    tar -cvf archive.tar file1.txt file2.txt directory/

    ```


    This command creates a tar archive named `archive.tar` containing `file1.txt`,
    `file2.txt`, and the contents of the `directory/`.


    +   2. **Extract Files from Tar Archive:**


    ```

    tar -xvf archive.tar

    ```'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'This command extracts the contents of the `archive.tar` file.


    # 3. Create a Gzipped Tar Archive:


    ```

    tar -czvf archive.tar.gz directory/

    ```


    This creates a compressed tar archive named `archive.tar.gz` of the `directory/`
    using gzip compression.


    # 4. Extract Files from Gzipped Tar Archive:


    ```

    tar -xzvf archive.tar.gz

    ```


    This extracts the contents of the compressed `archive.tar.gz` file.


    # 5. List Contents of Tar Archive:


    ```

    tar -tvf archive.tar

    ```


    This command lists the contents of the `archive.tar` file without extracting them.


    # 20. wget: Download files from the internet.'
