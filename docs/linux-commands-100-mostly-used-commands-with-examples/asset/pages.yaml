    `/dev/sda1` with the appropriate device identifier for your system.


    # **2. Automatically Repair File System:**


    ```

    fck -y /dev/sda1

    ```


    The `-y` option automatically answers **yes** to all questions asked by `fck`,
    making it suitable for unattended repair processes.


    # **3. Interactive Repair:**


    ```

    fck -r /dev/sda1

    ```


    The `-r` option prompts the user for confirmation before fixing each issue. This
    allows you to review and approve each repair manually.


    # **4. Check and Repair All File Systems:**'
  merge: -1
  img_proc: true
