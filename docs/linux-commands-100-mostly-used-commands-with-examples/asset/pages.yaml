    # 12. **chmod: Change file permissions.**


    `chmod` is a Linux command that is used to change the permissions of files and
    directories. The name "chmod" stands for "change mode," and it allows you to control
    who can read, write, and execute a file.


    # **Mode:**


    The mode consists of three components: user, group, and others, each with read
    ( `r` ), write ( `w` ), and execute ( `x` ) permissions. Additionally, you can
    use numeric representations to set permissions.


    +   - Symbolic representation:

    +     - `u` for user

    +     - `g` for group

    +     - `o` for others

    +     - `a` for all (equivalent to `ugo` )


    +   - Permission Symbols:

    +     - `r` for read

    +     - `w` for write

    +     - `x` for execute'
  merge: -1
  img_proc: true
- pgno: 21
  md: "- Operators:\n    - `+` to add permissions\n    - `-` to remove permissions\n\
    \    - `=` to set permissions explicitly\n- File:\n    The file or directory for\
    \ which you want to modify permissions.\n\n# **Examples:**\n\n1. **Grant read\
    \ and write permissions to the owner of the file:**\n\n```\nchmod u+rw file.txt\n\
    ```\n\n2. **Remove execute permission from the group for a script:**\n\n```\n\
    chmod g-x script.sh\n```\n\n3. **Give read and execute permissions to everyone\
    \ for a directory and its contents recursively:**\n\n```\nchmod -R a+rx directory/\n\
    ```\n\n4. **Set specific permissions using numeric representation (read: 4, write:\
    \ 2, execute: 1):**"
  merge: -1
  img_proc: true
- pgno: 22
  md: '```

    chmod 754 file.txt

    ```


    In this example, the user has read, write, and execute (4+2+1 = 7), the group
    has read and execute (4+1 = 5), and others have read-only (4).


    # **13. chown: Change file owner or group.**


    The `chown` command in Linux is used to change the ownership of files or directories.
    Ownership refers to the user and group associated with a file or directory. This
    command is particularly useful when you need to transfer ownership of files or
    directories from one user to another.


    **Examples:**


    +   1. **Basic Usage - Change Ownership of a File:**


    ```

    chown newowner:newgroup myfile.txt

    ```


    This command changes the ownership of `myfile.txt` to the user `newowner` and
    the group `newgroup` .


    +   2. **Recursive Ownership Change for a Directory:**'
  merge: -1
  img_proc: true
- pgno: 23
  md: '```

    chown -R newowner:newgroup mydirectory

    ```


    This command recursively changes the ownership of all files and subdirectories
    within `mydirectory` to the user `newowner` and the group `newgroup`.


    3. **Verbose Output:**


    ```

    chown -c newowner:newgroup myfile.txt

    ```


    This command provides a verbose output, indicating the changes made to the ownership
    of `myfile.txt`.


    4. **Changing Ownership Based on Current Owner:**


    ```

    chown --from=currentowner:currentgroup newowner:newgroup myfile.txt

    ```


    This command changes the ownership of `myfile.txt` from the current owner `currentowner`
    and group `currentgroup` to the new owner `newowner` and group `newgroup`.


