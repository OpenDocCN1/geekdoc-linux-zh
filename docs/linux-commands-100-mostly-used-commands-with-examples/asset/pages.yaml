    # 80. sftp: Securely transfer files over the SSH protocol.


    `SFTP` (Secure File Transfer Protocol) is a secure alternative to FTP (File Transfer
    Protocol) for transferring files between computers on a network. It provides a
    secure channel over an insecure network, typically the internet. SFTP encrypts
    both the command and data connections, preventing unauthorized access to sensitive
    information.


    Examples:


    +   1. **Connect to a remote server:**


    ```

    sftp username@remote_host

    ```'
