    **15. kill: Terminate a process.**


    The `kill` command in Linux is used to send signals to processes, allowing you
    to terminate or manipulate their behavior.


    **Examples:**


    +   1. **Terminate a process with default signal:**


    ```

    kill 1234

    ```


    This sends the SIGTERM signal to the process with PID 1234.


    +   2. **Forcefully terminate a process:**


    ```

    kill -9 5678

    ```


    This sends the SIGKILL signal to the process with PID 5678, forcefully terminating
    it.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '3. **Restart a process:**


    ```

    kill -HUP 9876

    ```


    This sends the SIGHUP signal to the process with PID 9876, which is often used
    to restart a process.


    4. **Pause a process:**


    ```

    kill -STOP 1111

    ```


    This sends the SIGSTOP signal to the process with PID 1111, pausing it.


    5. **Resume a paused process:**


    ```

    kill -CONT 1111

    ```


    This sends the SIGCONT signal to the paused process with PID 1111, resuming its
    execution.


