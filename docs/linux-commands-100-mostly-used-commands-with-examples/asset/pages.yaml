    .


    # 2. Zip Multiple Files:


    ```

    zip archive.zip file1.txt file2.txt

    ```


    Creates a zip archive named `archive.zip` containing `file1.txt` and `file2.txt`
    .


    # 3. Zip a Directory:


    ```

    zip -r archive.zip directory/

    ```


    The `-r` option is used to recursively include all files and subdirectories within
    the specified directory (`directory/`) in the zip archive.


    # 4. Add Files to an Existing Archive:


    ```

    zip -u archive.zip newfile.txt

    ```'
  merge: -1
