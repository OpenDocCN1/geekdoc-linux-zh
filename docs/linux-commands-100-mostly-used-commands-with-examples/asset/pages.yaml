    `myfile.txt`, `MyFile.txt`, and so on.


    # 3. **Limit Search to Specific Directories:**


    ```

    ```

    locate -r ''/home/user/*.txt''

    ```

    ```


    The `-r` option allows you to use regular expressions. This example searches for
    all files with a `.txt` extension in the `/home/user/` directory.


    # 4. **Update the Locate Database:**


