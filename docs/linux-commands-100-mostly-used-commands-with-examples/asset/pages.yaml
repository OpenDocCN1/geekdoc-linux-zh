    +   **78. mount: Mount a filesystem.**


    The `mount` command in Linux is used to attach a filesystem to the directory tree.
    This operation makes the files and directories on the attached filesystem accessible
    and usable by the system. The `mount` command is essential for working with external
    storage devices, network shares, and other file systems.


    **Examples:**


    +   1. **Mount a USB Drive:**


    ```

    sudo mount /dev/sdb1 /mnt/usb

    ```'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'This command mounts the first partition (`/dev/sdb1`) of a USB drive to the
    `/mnt/usb` directory. Make sure the mount point (`/mnt/usb` in this case) exists
    before running the command.


    # 2. Mount an ISO Image:


    ```

    sudo mount -o loop path/to/image.iso /mnt/iso

    ```


    Here, the `-o loop` option is used to mount an ISO image file (`path/to/image.iso`)
    as if it were a device. The contents of the ISO file will be accessible in the
    `/mnt/iso` directory.


    # 3. Mount a Network Share (NFS):


    ```

    sudo mount -t nfs server:/shared_folder /mnt/network_share

    ```


    This example mounts a shared folder from an NFS server (`server:/shared_folder`)
    to the local directory `/mnt/network_share`. The `-t nfs` option specifies the
    filesystem type as NFS.


    # 4. Mounting with Specific Filesystem Type:


    ```

    sudo mount -t ext4 /dev/sdc1 /mnt/data

    ```'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'In this case, the `-t ext4` option explicitly specifies the filesystem type
    (ext4 in this example) for the device (`/dev/sdc1`). The device is then mounted
    to the `/mnt/data` directory.


    # 5. Mounting with Read-Only Option:


    ```

    sudo mount -o ro /dev/sdd1 /mnt/read_only

    ```


    The `-o ro` option mounts the device (`/dev/sdd1`) in read-only mode, ensuring
    that no write operations can be performed on the filesystem. This can be useful
    for preserving the integrity of the data on the device.


    # 6. Unmounting a Device:


    ```

    sudo umount /mnt/usb

    ```


    To detach a mounted device, you use the `umount` command followed by the mount
    point. In this example, the USB drive mounted at `/mnt/usb` is unmounted.


    # 79. umount: Unmount a mounted filesystem.


    The `umount` command in Linux is used to unmount (detach) a currently mounted
    filesystem, allowing the underlying device or directory to be accessed or removed.
    Properly unmounting filesystems is crucial to ensure data integrity and prevent
    data corruption.'
  merge: -1
  img_proc: true
