    # 99. **time: Measure program execution time.**


    The `time` command in Linux is a utility that provides information about the resources
    used by a command or a script. It is often used to measure the execution time
    of a process and analyze its performance. The `time` command can track the total
    elapsed time, user CPU time, and system CPU time.


    **Examples:**


    **1. Basic Usage:**


    ```

    time ls

    ```'
