    # **30. ping: Test the reachability of a host on an IP network.**


    The `ping` command is a network utility tool used to test the reachability of
    a host on an Internet Protocol (IP) network. It also measures the round-trip time
    for messages sent from the originating host to a destination computer. The name
    "ping" comes from the sonar sound used by submarines to detect other objects in
    the water.


    **Examples:**


    +   1. **Simple Ping:**


    ```

    ping google.com

    ```


    This will send a series of ICMP Echo Requests to google.com, and you''ll see the
    round-trip time for each packet.


    +   2. **Set Number of Packets:**


    ```

    ping -c 4 google.com

    ```'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'This sends only 4 packets to google.com and then stops.


    # 3. Set Packet Size:


    ```

    ```

    ping -s 100 google.com

    ```

    ```


    This sends packets of size 100 bytes to google.com.


    # 4. Set Interval Between Packets:


    ```

    ```

    ping -i 2 google.com

    ```

    ```


    This sets a 2-second interval between successive packets.


    # 5. Set Timeout:


    ```

    ```

    ping -t 5 google.com

    ```

    ```


    This sets a timeout of 5 seconds. If no response is received within this time,
    the ping command stops.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '+   6. **Quiet Mode:**


    ```

    `ping -q google.com`

