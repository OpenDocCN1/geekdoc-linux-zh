  md: '# 9.1.5 Install a Service


    # Scenario


    You are configuring network connections for a Windows XP Professional computer.
    The computer is connected to an IP network that supports Quality of Service (QoS)
    features. You want to take advantage of these features for certain QoS-enabled
    programs that the computer runs.


    Your task in this lab is to install the QoS Packet Scheduler networking service.


    # Facts & Tasks


    In this lab, the QoS component is a networking service. As you install the component,
    select Service as the component type.


    In most cases, you can install components from the properties of any connection.
    However, you cannot install some components from the properties of a dial-up connection.


    Depending on the component you install, you might need to reboot the system. If
    not, click Close.


    In most cases, when you install a client, service, or protocol, it is enabled
    for all connections (and not just the connection where you started the install
    process). After installation, manually disable the component for specific connections
    if necessary. Also, keep in mind that the installation process for some components
    (such as client software) often automatically installs other components (such
    as appropriate protocols).


    # Steps


    +   1. Open the Control Panel.


    +   2. Open Network Connections.


    +   3. View Properties for the Local Area Connection network connection.


    +   4. Install a service.


    +   * Under which tab did you find the Install button'
