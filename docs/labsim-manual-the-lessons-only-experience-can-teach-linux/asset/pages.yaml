  md: '# 12.4.6 Find Configuration Information 3


    Scenario


    Click the Simulation button and use the lab to answer the following questions.


    +   - What is the IP address of the workstation?

    - What is the subnet mask?

    - How is the IP address configured on the system?


    Facts & Tasks


    If the workstation has used APIPA to set configuration information, the following
    conditions will exist:


    +   - The DHCP Enabled entry will display Yes.

    - The Autoconfiguration Enabled entry will display Yes.

    - The DHCP Server, Lease Obtained, and Lease Expires entries will not be shown.

    - The IP address will be in the range of 169.254.0.1 to 169.254.255.254 with a
    mask of 255.255.0.0.

    - The Default Gateway entry will be blank.

    - The DNS Servers entry will not be displayed.


    > Note: When APIPA is used, the workstation sets its own IP address and mask.
    It does not automatically configure default gateway or DNS server values.


    Steps


    +   1. Select Simulation to begin.

    2. Locate and open the Command Prompt.

    3. Type the command that displays all of the information about the IP configuration.

    - What command did you type?'
