  md: '# Create a Wireless Network


    # Scenario


    You have a laptop that you use at work. The laptop has a wireless PCMCIA card
    that is capable of using dual band and transferring data at 108 Mbps. You want
    to transfer some data between the laptop and your home computer.


    Select and install the necessary wireless component(s) to transfer data between
    the laptop and your home computer. Select only the components necessary.


    # Facts & Tasks


    Keep things simple by taking advantage of the PCMCIA card that is already in your
    laptop. Although susceptible from interference from other wireless devices, some
    of the newer 802.11g devices can use multiple channels (dual band) to effectively
    double the data transfer rate.


    Each wireless network uses one of two primary wireless networking architectures.
    See the table below to review these architectures.


    | Topology | Description |

    | Ad Hoc | Works in a peer-to-peer mode without a WAP, allowing individual computers
    to link directly to each other. Easy to set up, but limited to 4 hosts. |

    | Infrastructure | Requires a WAP. Can easily add hosts. |


    # Steps


    +   1. Locate and drag the appropriate device to the appropriate slot / location.'
