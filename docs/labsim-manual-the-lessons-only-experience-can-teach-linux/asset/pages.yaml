  md: '+   • There is a rogue DHCP server on the network.


    +   • The DHCP server has been configured with the wrong default gateway address.


    # Facts & Tasks


    Your DHCP server can send out various IP configuration values in addition to the
    IP address and mask. If network hosts are configured with incorrect IP values
    (such as incorrect default gateway or DNS server addresses), first verify that
    the workstations are contacting the correct DHCP server. If the correct server
    is being used, go to the DHCP server to verify that it is sending out correct
    configuration information.


    # Steps


    +   1. Select **Simulation** to begin.


    +   2. In the **Command Prompt** window, type the command that displays all of
    the information about the IP configuration.


    • What command did you type?


    +   3. Click the **Done** button when you are finished reviewing the information
    and ready to return and answer the question.


    +   4. Check the following answers that apply to this workstation:


    ______ The DHCP server is down.


    ______ The workstation has been configured to use static addressing.


    ______ The default gateway and DNS server addresses have not been configured on
    the DHCP server.


    ______ There is a rogue DHCP server on the network.


    ______ The DHCP server has been configured with the wrong default gateway address.'
  merge: -1
