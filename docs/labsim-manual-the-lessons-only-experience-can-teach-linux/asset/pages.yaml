- img_proc: true
  md: '# 12.2.4 Exploring Network Communications


    # Scenario


    In this lab, you will discover important facts about network communications by
    using ping and tracert from various workstations on this simple network.


    Note: To work with each workstation, click its icon in the network diagram to
    open a command prompt.


    Complete the following steps:


    +   1. On Wrk3, ping the router interface by typing: ping 192.168.2.254. Does
    the test succeed?

    2. On Wrk3, ping Wrk4 by typing: ping 199.168.2.2. Why does this test fail?

    3. Wrk2 has an IP address configured, but not a default gateway address. From
    Wrk2, ping Wrk1. Then ping the router interface 192.168.1.254. Why do these tests
    succeed?

    4. From Wrk2, ping Wrk3. Try pinging the router interface 192.168.2.254. Why do
    these tests fail?

    5. From Wrk1, trace the path between Wrk1 and Wrk3 using the command: tracert
    192.168.2.1. What addresses appear in the path between Wrk1 and Wrk3? Why doesn''t
    the switch address appear in the path?

    6. From Wrk3, trace the path to Wrk1 by typing: tracert 192.168.1.1. How does
    this path differ from the path you discovered in the previous step?

    7. Switch2 does not have an IP address set. From Wrk3, ping Wrk1. Why does this
    test succeed even though the switch does not have an IP address?


    # Facts & Tasks


    There are several tasks you can perform to troubleshoot connectivity problems.
    Often the best place to start in troubleshooting a problem is to ping the host
    you are trying to contact. If you cannot contact a specific remote host, try pinging
    another host in the same remote network. If successful, then the problem is with
    the remote host (either a misconfiguration, broken link, or unavailable host).


    # Steps


    +   1. Locate the computer labeled Wrk3 and select it to open a DOS window.

    2. On Wrk3, ping the router interface by typing: ping 192.168.2.254.'
  merge: -1
