  md: "# 7.3.5 Configure IP Settings 2\n\n# Scenario\n\nClick the Exhibit button and\
    \ use the network diagram to complete this lab.\n\nYou have just purchased a new\
    \ computer and need to connect it to a small business network. The network has\
    \ two subnets and is connected to the Internet as shown in the Exhibit. The network\
    \ uses static addressing. Configure the TCP/IP settings for the NY-DEV-WRK3 computer\
    \ so it can communicate both on the local network and the Internet. Use the following\
    \ settings:\n\n+   * For the IP address, configure the workstation with the last\
    \ valid address on the network.\nUse the default subnet mask.\n* Configure the\
    \ default gateway address according to the information in the network diagram.\n\
    * Configure the DNS server addresses as follows:\n  * Use the DNS server on the\
    \ local network as the preferred server.\n  * Use the DNS server on the Internet\
    \ as the alternate DNS server.\n\n# Facts & Tasks\n\nSome useful facts about network\
    \ addressing can be found in the table below.\n\n| Address Type | Description\
    \ |\n| IP Address | Four 8-bit numbers, from 0 to 255, each separated by dots.\n\
    First portion of number is network address.\nLast portion of number is host address.\n\
    Address class determines the network and host portions of the address.\nA Class\
    \ C address:\n* Is the most likely to have an IP address available for assignment.\n\
    * Has the first octet from 192 to 223.\n* Has the first three octets defining\
    \ the network.\n* Has the last octet defining the host. |"
  merge: -1
  pgno: 75
- img_proc: true
  md: "| Address Type | Description |\n| --- | --- |\n| Subnet Mask | Identifies which\
    \ portion of the IP address is the network address. Two devices on the same network\
    \ must be configured with the same network mask. Default subnet masks for the\
    \ first three classes are as follows:\n* Class A: 255.0.0.0\n* Class B: 255.255.0.0\n\
    * Class C: 255.255.255.0 |\n| Default Gateway | Identifies the router to which\
    \ packets for remote networks are sent. The default gateway address is the IP\
    \ address of the interface on the same subnet as the local host. Without a default\
    \ gateway set, most clients will be unable to communicate with hosts outside of\
    \ the local subnet. |\n| DNS Server | Identifies the DNS server that is used to\
    \ resolve host names to IP addresses. |\n\n# Steps\n\nOpen **Exhibit**, to view\
    \ the network diagram. You'll need to refer to the network diagram to determine\
    \ what information should be entered.\n\n+   1. Open the **Control Panel**.\n\
    2. Open **Network Connections**.\n3. View **Properties** for the Local Area Connection\
    \ network connection.\n4. Select the Internet Protocol item from the list of items\
    \ used by the connection.\n5. View the **Properties** of the Internet Protocol\
    \ item.\n6. Switch IP addressing from automatic to manual.\n7. Enter the IP address.\n\
    \    * What is the *last* valid address on the network? (Be sure not to use the\
    \ network broadcast address.)"
