    +   - Manually configure subnet masks, and IP, gateway, and DNS addresses.


    +   - Configure the TCP/IP Protocol to access multiple DNS and WINS servers.


    +   - Install the QoS Packet Scheduler networking service.


    +   - Enable the Internet Connection Firewall and open ports in the firewall.


