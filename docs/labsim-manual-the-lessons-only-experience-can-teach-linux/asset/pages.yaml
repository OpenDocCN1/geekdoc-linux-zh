  md: '# # 0.0: Introduction


    # ## 0.2: Using the Hardware Simulator


    # ### Objectives


    +   - Use the documentation to identify system components and modules.

    - View images to identify system components and modules.

    - Select, drag, and drop system components in different areas of the environment.

    - Install and uninstall system components.

    - Change views, read component documentation, and examine component details.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Put an Item on the Workbench''


    # Scenario


    To practice using the TestOut Hardware Simulator, complete the following task:


    +   1. From the **Shelf**, select the USB scanner.

    2. Place the scanner next to the computer on the **Workbench**.


    Click the **Done** button at the bottom of the screen when you are finished.


    # Facts & Tasks


    Notice that simulator screen is divided into three major areas:


    +   - **Scenario** (upper right). The Scenario window gives you information about
    what you need to do (you are currently reading text window).

    - **Shelf** (left side of the screen). The Shelf window lists hardware items that
    are available for you to install.

    - **Workbench** (bottom right). The Workbench window shows all hardware items
    that are currently installed.


    # Steps


    +   1. Examine the **Shelf** for the scanner entry that says "Scanner, USB 2.0."
    (Group 2 is the group of USB scanners).

    2. Click and hold any part of the item and drag the mouse to the empty space on
    either side of the computer case on the **Workbench**.

    3. Release the mouse when you see a white bar with arrows that indicates that
    the item will be inserted on the Workbench.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# 0.2.3 Select an Item Based on Its Documentation


    # Scenario


    To learn how to view and use item details, complete the following task:


    +   - For each item in the **Shelf**, click the Details link to view pictures
    and documentation for the device.

    - Find the device that includes an optional printer port.

    - Add that device to the **Workbench** next to the computer.


    Click the **Done** button at the bottom of the screen when you are finished.


    # Facts & Tasks


    In this lab, you will learn how to get details about a hardware item on the **Shelf**
    or **Workbench**. Two types of details are:


    +   - **Views.** Multiple views of a hardware item are usually available. These
    views are normally much bigger than the item''s icon shown on the **Shelf**.

    - **Documentation.** Some hardware items have documentation that goes beyond the
    item''s description.


    # Steps


    To put the scanner with the optional printer port on the **Workbench**


    +   - Click the Details link next to one of the scanners on the **Shelf**.

    - Click the Documentation tab to see a labeled overview of the scanner''s ports
    and other controls.

    - Drag the parallel scanner from the **Shelf** to the **Workbench**. The parallel
    scanner includes a printer port.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '+   1. Make sure the Front or the Back Workbench view is selected. Otherwise,
    click the Front or the Back Workbench view button on the Workbench toolbar.

    2. If the scanners are not shown on the Shelf, click the Scanners category. Then
    drag a scanner to the empty Workbench space next to the computer.

    3. If the printers are not shown on the Shelf, click the Printers category. Then
    drag a printer to the empty Workbench space next to the computer.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Install and Uninstall Components


    # Scenario


    To learn how to connect and disconnect items, do the following:


    +   1. Switch to the Motherboard view.

    2. Return the motherboard to the Shelf.

    3. Switch to the Drive Bays view.

    4. From the Shelf, insert the hard disk in a free slot.


    Click the Done button at the bottom of the screen when you are finished.


    # Facts & Tasks


    So far, you have learned to put items on the Workbench. You can also install hardware
    components into an existing computer.


    # Steps


    To remove the motherboard:


    +   1. Switch to the Motherboard view (click the Motherboard button on the Workbench
    button bar).

    2. Drag the motherboard to the Shelf.


    To install the hard drive:


    +   1. Change to the Drive Bays view (click the Drive Bays button on the Workbench
    button bar).

    2. Drag the hard drive to the drive bay above the existing hard drive (or any
    other drive bay of the same size).

    3. Release the mouse and drop the hard drive when the drive bay highlights.


    Note: You cannot install the hard drive in the larger slots above the existing
    hard drive.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# 0.2.6 Set Dials and Switches


    # Scenario


    To learn how to use action areas, complete the following tasks:


    +   1. Switch to the Back view to see the back of the external CD drive.

    2. Zoom in on the view until you can clearly see the controls on the drive.

    3. Set the round dial on this CD drive to 4.

    4. Put the TERM switch in the ON position (the switch should be pointing to the
    right).


    Click the Done button at the bottom of the screen when you are finished.


    # Facts & Tasks


    Some hardware items have action areas (controls such as dials, buttons, or switches).
    You can manipulate action areas by clicking or shift-clicking them.


    # Steps


    To set the SCSI ID for the CD drive:


    +   1. Change to the Back Workbench view.

    2. Click the Zoom In tool on the Workbench toolbar under the Modes section.

    3. Click the blue dial on the back of the CD drive until it is big enough to work.

    4. Click the Select tool on the Workbench toolbar under the Modes section.

    5. Click or shift-click the blue dial on the back of the CD drive to turn it.
    (You can also click a number to set the dial to that number directly.)


    To put the CD drive''s TERM switch in the ON position:


    +   1. Change to the Back Workbench view.

    2. Click the Zoom In tool on the Workbench toolbar under the Modes section.

    3. Click the switch labeled TERM. Make sure the switch is pointing toward the
    ON label.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# 0.2.9 Add Cabled Components


    # Scenario


    To learn how to work with cabled devices, complete the following tasks:


    +   Put a mouse on the Workbench.


    +   Connect the mouse to the computer''s mouse port (be sure to switch to the
    Back view of the computer).


    +   In the Drive Bays Workbench view, put a second hard drive in this computer
    above the existing hard drive.


    +   Open the Cables category on the Shelf and attach Connector 1 of the cable
    on the Shelf to the existing hard drive.


    +   Attach Connector 2 of the cable to the second hard drive you just installed.


    +   Attach Connector 3 of the cable to the motherboard (you will need to switch
    to Motherboard view).


    Click the Done button at the bottom of the screen, when you are finished.


    # Facts & Tasks


    Many hardware devices are connected to the computer, or to each other, using cables.
    In this lab, you will learn how to install cabled devices. Cables or items connected
    with a cable will appear in the following area:


    +   Workbench Connections. The right side of the Workbench shows all cables or
    devices that include cables. Read the descriptions for each object to identify
    where the cable is connected.


    # Steps


    To install a mouse:


    +   Open the Mice category on the Shelf (if it is not already open),


    +   Drag the mouse (not its connector) from the Shelf to the empty Workbench space
    next to the computer.


    +   If a message appears, read it and click OK.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '+   4. Change to the Back Workbench view.


    +   5. Drag the mouse connector from the Workbench Connections list to the bright
    green round mouse port on the back of the computer.


    To install a second hard drive:


    +   1. Change to the Drive Bays Workbench


    +   2. Open the Hard Drive category on the Shelf (if it is not already open).


    +   3. Drag the hard drive to the drive bay above the existing hard drive (or
    any other drive bay of the same size). Release the mouse and drop the hard drive
    when the drive bay highlights.


    To connect the hard drives to the motherboard using a cable:


    +   1. Change to the Drive Bays Workbench view.


    +   2. Open the Cables category on the Shelf (if it is not already open).


    +   3. Drag Connector 1 from the Shelf to the IDE port on the back of the existing
    hard drive. Make sure the port is highlighted before you release the mouse. (If
    you need help identifying the hard drive''s IDE port, read the hard drive''s documentation
    prior to performing this step. The IDE port is labeled "IDE Pin 1" in the documentation.)


    +   4. If a message appears, read it and click OK.


    +   5. Drag Connector 2 from the Shelf to the IDE port on the back of the second
    hard drive you just installed. Make sure the port is highlighted before you release
    the mouse. (If you need help identifying the hard drive''s IDE port, read the
    hard drive''s documentation prior to performing this step. The IDE port is labeled
    "IDE Pin 1" in the documentation.)


    +   6. If a message appears, read it and click OK.


    +   7. Change to the Workbench view.


    +   8. Drag Connector 3 from the Workbench Connections list to an IDE port on
    the motherboard. Make sure the port is highlighted before you release the mouse.
    (If you need help identifying an IDE port, read the motherboard''s documentation
    prior to performing this step. The IDE ports are labeled "8" in the documentation.)'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# 2.0: Cables and Connectors


    # 2.1: Twisted Pair


    # Objectives


    +   - Identify phone connectors, ports, and cable.

    - Connect a PC to the Internet via phone connectors, ports, and cable.

    - Identify twisted pair connectors, ports, and cable.

    - Connect a PC to an Ethernet LAN.'
