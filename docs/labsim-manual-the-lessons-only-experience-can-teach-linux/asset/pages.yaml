  md: '# 8.1.7 Configure DNS Addresses


    # Scenario


    You are configuring network connections for a Windows XP Professional computer.
    Currently, your network uses manual IP addressing. Previously, your network did
    not use a DNS server, but three DNS servers have recently been installed.


    Your task in this lab is to configure the TCP/IP protocol for this computer''s
    Local Area Connection network connection to use the following DNS server addresses:


    +   * 192.168.1.1 (preferred DNS server)

    * 192.168.2.1 (first alternate DNS server)

    * 192.168.1.3 (second alternate DNS server)


    > Note: When you configure the TCP/IP properties, you can only set two DNS server
    addresses. To configure additional DNS server addresses, click the **Advanced**
    button. On the DNS tab, use the **Add** button to configure additional DNS server
    addresses.


    # Facts & Tasks


    If more than one DNS server address is listed, change the order of the addresses
    by selecting a DNS server address and clicking the up or down arrow buttons to
    the right of the list. The DNS servers will be contacted in the order the addresses
    are listed (the first address in the list is the preferred DNS server).


    # Steps


    +   1. Open the **Control Panel**.


    +   2. Open **Network Connections**.


    +   3. View **Properties** for the Local Area Connection network connection.


    +   4. Select the Internet Protocol item from the list of items used by the connection.
    (When configuring a LAN connection, select the General tab, otherwise, select
    the **Networking tab**.)


    +   * Under which tab did you find the Internet protocol item?'
  merge: -1
  pgno: 79
- img_proc: true
  md: '5. Then view the Internet Protocol Properties.


    +   - Which button did you select to view the Internet Protocol Properties?


    6. There is only room for two addresses, the preferred and the first alternate
    address. You could enter them in this window, but since you have a third address
    to enter, select the button that will allow you to enter all three addresses.


    +   - Which button did you select?


    7. Now select the tab that will allow you to enter the three addresses.


    +   - What type of server are you addressing?


    8. Select the button that will allow you to add addresses (Remember to add the
    addresses in the order of use.).


