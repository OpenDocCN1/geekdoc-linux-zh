  md: '# 2.3.3 Connect Fiber Optic Cables 1


    # Scenario


    Your first task as a network technician at your company is to connect a new employee''s
    computer to your fiber optic network.


    Note: When connecting the cables, be sure to connect the receive port (RX) to
    the transmit port (TX).


    # Facts & Tasks


    Common fiber optic cable connectors are presented in the following table.


    | Connector | Facts |

    | --- | --- |

    | ST | Also called a push in twist connector

    Each wire is a single strand that has a single (or separate) connector at each
    end |

    | SC | Push on, pull off connector type that uses a locking tab to maintain connection

    Each wire is a single strand that has a single (or separate) connector at each
    end |

    | LC | Composed of a plastic connector with a locking tab, similar to a RJ-45
    connector

    Each wire has two strands that attach to two single connectors at each end

    Half the size of other fiber-optic connectors |

    | MT-RJ | Composed of a plastic connector with a locking tab

    Uses metal guide pins to ensure it is properly aligned

    Each wire has two strands that attach to two single connectors at each end |'
  merge: -1
  pgno: 28
- img_proc: true
  md: "Ensure proper installation by keeping track of the color of cable you connect\
    \ to each port.\n\n![](img/ec83bdece8c967d0c687b6a13db22bc0_29_0.png)\n\n# Steps\n\
