  md: '# 12.4.7 Troubleshoot IP Configuration Problems 1


    # Scenario


    Click the Exhibit button and use the graphic to answer the following question.


    ![](img/ec83bdece8c967d0c687b6a13db22bc0_180_0.png)


    You are in charge of a small network as shown in the graphic. The network is connected
    to the Internet and uses DHCP for address assignment.


    A user reports that his workstation can only communicate with some computers.
    Click the Simulation button and use the ipconfig command to diagnose the problem.


    Based on the ipconfig output, what is the most likely cause of the problem?


    +   - The DHCP server is down.

    - The workstation has been configured to use static addressing.

    - The default gateway and DNS server addresses have not been configured on the
    DHCP server.'
