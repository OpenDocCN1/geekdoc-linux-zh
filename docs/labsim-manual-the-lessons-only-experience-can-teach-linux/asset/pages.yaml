  md: '# 2.2.3 Connect a Cable Modem 1


    Scenario


    You recently moved to a new area that has broadband Internet service through the
    cable company. Rather than paying a high installation fee, you opted to install
    the modem yourself. Connect the cable modem to your computer and to the wall outlet.


    Facts & Tasks


    Some of the connectors typically used for this type of Internet connection are
    listed in the table below.


    | Connector | Facts |

    | --- | --- |

    | Ethernet RJ-45 | Used primarily for Ethernet LAN connections

    Used to connect a cable modem to a PC |

    | USB Type A | Used to connect two PCs together

    Used primarily to connect the PC to a device, such as a cable modem |

    | USB Type B | Most USB cables with a B connector have an A connector on the other
    end

    Used to connect a device to a USB hub |

    | Coaxial Type F | Used primarily to create cable and satellite TV connections

    Used to hook a cable modem to a broadband cable connection |'
  merge: -1
  pgno: 23
- img_proc: true
  md: "# Steps\n\n+   1. On the **Shelf**, locate and select the appropriate cable\
    \ to connect the cable modem to the wall outlet.\n   - List the types of ports\
    \ on the cable modem and wall outlet that can provide an Internet connection:\n\
    \n+   2. Drag one end of the appropriate cable to the appropriate port in the\
    \ wall outlet. (The other end of the cable moves to the Workbench Connections\
    \ area.)\n\n+   3. Drag the end of the cable in the **Workbench Connections**\
    \ area to the appropriate port in the cable modem.\n\n+   4. On the **Shelf**,\
    \ locate and select the appropriate cable to connect the cable modem to the PC.\n\
    \   - List the remaining types of ports on the cable modem and PC that can provide\
    \ a connection:\n\n+   5. Drag the appropriate connector to the appropriate port\
    \ on the cable modem. The connector moves to Workbench Connections.\n\n+   6.\
    \ Drag the connector from **Workbench Connections** to the appropriate port on\
    \ the computer."
  merge: -1
