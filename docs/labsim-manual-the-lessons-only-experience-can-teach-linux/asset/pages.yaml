  md: '+   - There is a rogue DHCP server on the network.


    +   - The DHCP server has been configured with the wrong default gateway address.


    # Facts & Tasks


    A rogue DHCP server is an unauthorized DHCP server on the network. Symptoms of
    a rogue DHCP server include:


    +   - Conflicting IP addresses on the network.


    +   - Incorrect IP configuration information on some hosts.


    +   - To identify a rogue DHCP server using ifconfig, verify the DHCP server address.
    If this address is not the address of your DHCP server, you have a rogue DHCP
    server.


    **Note:** When you have a rogue DHCP server on the network, some hosts will likely
    receive configuration information from the correct DHCP server and some from the
    rogue DHCP server.


    # Steps


    +   1. Select **Simulation** to begin.


    +   2. In the **Command Prompt** window, type the command that displays all of
    the information about the IP configuration.


    +   - What command did you type?


    +   3. Click the **Done** button when you are finished reviewing the information
    and ready to return to answer the question.


    +   4. Check the following answers that apply to this workstation:


    +   - The DHCP server is down.


    +   - The workstation has been configured to use static addressing.


    +   - The default gateway and DNS server addresses have not been configured on
    the DHCP server.


    +   - There is a rogue DHCP server on the network.


    +   - The DHCP server has been configured with the wrong default gateway address.'
