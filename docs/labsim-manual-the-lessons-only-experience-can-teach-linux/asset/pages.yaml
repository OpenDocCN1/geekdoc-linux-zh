- img_proc: true
  md: '# 2.1.3 Connect a Modem


    You purchased a new computer to use at home for tasks like tracking your financial
    records, which includes online banking and bill payment. To accomplish this you
    need to establish an Internet connection. In your area, there are no broadband
    Internet Service Providers (ISPs), but you do have a dial-up connection with an
    ISP.


    Your task in this lab is to connect your new computer to the phone line so that
    you can dial and access your ISP.


    # Facts & Tasks


    To connect to an ISP using a dial-up Internet connection, connect the modem to
    the telephone line. Modems are usually connected to the phone system using twisted
    pair cable. The two most common connectors used with twisted pair cable are RJ-11
    and RJ-45. Refer to the table below, to see some similarities and differences
    between the two types of connectors.


    | Connector | Description |

    |---|---|

    | RJ-11 | Has 4 connectors

    Supports 2 pairs of wires

    Uses locking device to keep

    connector secure in outlet

    Used primarily for telephone wiring |

    | RJ-45 | Has 8 connectors

    Supports 4 pairs of wires

    Uses locking device to keep

    connector secure in outlet

    Used for Ethernet and some token

    ring connections |


    The modem card, used in this lab, has two ports. The port labeled "LINE", provides
    the means for a dial-up Internet connection with the telephone outlet. The other
    port, labeled "PHONE", is an optional port used to connect an analog phone to
    the modem.


    # Steps


    +   1. In the Shelf, locate and select one end of the cable used for a dial-up
    modem connection.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '+   - What type of connector did you select?


    +   2. Drag the connector to the appropriate port on the PC. (Use the Zoom In
    tool and scroll as necessary to better see ports, jacks, and connectors.) Once
    you''ve done that, the other end of the cable moves to Workbench Connections.


    +   3. Drag the connector, in Workbench Connections, to the appropriate wall outlet
    port.


    +   - What are two ways to tell the difference between the two ports in the outlet
    on the left?


    +   - What is the unused port used for?'
  merge: -1
  pgno: 20
