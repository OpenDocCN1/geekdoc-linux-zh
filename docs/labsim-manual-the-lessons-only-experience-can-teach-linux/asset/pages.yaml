    Dial Internet network connection on this computer. Keep the default ICF settings.


    # Facts & Tasks


    Once ICF is enabled, you can configure ICF settings by executing the following
    steps:


    +   In the Dial Internet Properties window, under the Advanced tab, click the
    Settings... button. This opens the Advanced Settings window.


    +   Under the Services tab, select any service on your local network that Internet
    users should be permitted to access. If the service is provided on a different
    computer, enter that computer''s name or IP address, then click OK.


    +   If you need to add a service that is not on the list, click Add....


    +   Type a description for the service.


    +   Type the name or IP address of the computer providing the service.


    +   Enter the external port number and type (TCP or UDP) that the service uses
    for communication on the Internet.


    +   Enter the internal port number and type what the service uses for communication
    on the private network.


    +   Click OK to add the new service definition.


    +   Under the Security Logging tab, select whether to log dropped packets and/or
    successful connections. You can also specify the path and filename of the log
    file and specify a size limit of the log file.


