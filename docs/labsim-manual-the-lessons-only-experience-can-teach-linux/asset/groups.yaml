    \ (ICF) on the connection to protect the small office network from Internet users.\
    \ Now Internet users cannot access the Web site that is hosted by the computer.\
    \ The Web site is hosted over the default TCP port.\n\nYour task in this lab is\
    \ to allow Web communication from the Internet to this computer (LA-CORP-WRK3)\
    \ by opening a port in the ICF firewall (secure Web communications are not necessary).\
    \ Do not allow any other type of communication initiated from the Internet.\n\n\
    # Facts & Tasks\n\nOnce ICF is enabled, you can configure ICF settings. Click\
    \ the Settings... button. You can configure the following settings:\n\n- On the\
