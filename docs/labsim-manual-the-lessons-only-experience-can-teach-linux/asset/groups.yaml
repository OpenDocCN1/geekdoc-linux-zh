    # 9.3.7 Share a Folder


    # Scenario


    You are configuring the file system of a Windows XP Professional computer. The
    D:\Projects folder needs to be accessed by other users on the network. You want
    to share the folder.


    Your task in this lab is to share the D:\Projects folder using the share name
    *Projects*. Keep the default share permissions and other settings.


    # Facts & Tasks


    You can share a folder from the properties of the folder in Windows Explorer or
    by using Shareders in Computer Management.


    To open Windows Explorer and view the contents of the My Computer container, click
    **My Computer** or right-click My Computer and select Open. To open Windows Explorer
    in Folder view (showing a hierarchy of objects and folders on the left), right-click
    My Computer and select Explore.


    You can open Windows Explorer focused on other objects (My Network Places, My
    Documents, and so forth) using the same steps (right-click the object and select
    Open or Explore). You can toggle the Folder view on and off using the **Folders**
    button in Windows Explorer.


    To open the Shared Folders MMC Snap-In, use the following steps:


    +   - Click **Start**.

    - Right-click **My Computer** and select **Manage** to open the pre-configured
    Computer Management console.

    - Expand **System Tools** and click **Shared Folders**.


    To share a Folder or Drive Using Shared Folders, use the following steps:


    +   - To open Computer Management, click Start, right-click My Computer, and select
    **Manage**.

    - In Computer Management, browse to the System/Shared Folders/Shares folder.

    - Right-click the Shares folder and select **New File Share**.

    - Type or browse to the path of the folder you want to share. To share an entire
    drive, type the path to the root folder (for example, C:\). Click **Next**.'
