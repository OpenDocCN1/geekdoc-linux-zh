- md: "\n## 2.4: USB and Firewire\n\nObjectives\n\n- Identify USB connectors, ports,\
    \ and cable.\n- Connect a component to a computer via USB.\n- Connect two PCs,\
    \ in a simple network, using USB.\n\n## 2.4.3 Connect a USB Device\n\n### Scenario\n\
    \nYou have installed a wireless network in your home. However, you own an older\
    \ laptop that did not come with wireless capabilities. To connect to your wireless\
    \ home network with the laptop, you purchased a USB wireless thumbcard. Install\
    \ the USB wireless thumbcard in the appropriate slot on your computer.\n\n###\
    \ Facts & Tasks\n\nThere are several types of USB connectors. The most common\
    \ is called a Type A. A USB connector, or port, can always be identified by the\
    \ USB logo, displayed below.\n\n![](img/ec83bdece8c967d0c687b6a13db22bc0_32_0.png)\n\
    \n### Steps\n\n1. 1. To connect to a USB wireless thumbcard to the laptop, drag\
    \ the thumbcard from the Shelf to a USB port on the back of the laptop.\n  * Is\
    \ there more than one port for the USB wireless thumbcard to connect to?\n  *\
    \ What other high-speed serial data port is found on the laptop?\n\n## 2.4.4 Connect\
    \ Back-to-Back Computers\n\n### Scenario\n\nYou bought a new computer, but you\
    \ have files that you still want to access on your old computer. Rather than copying\
    \ files to removable media, you want the option of being able to access the computer's\
    \ hard drive as you need to. You know that you can create a simple network by\
    \ connecting both computers directly through a USB cable.\n\nSelect the correct\
    \ cable and connect the two computers together.\n\n### Facts & Tasks\n\nCommon\
    \ USB connectors are displayed below.\n\n![](img/ec83bdece8c967d0c687b6a13db22bc0_33_0.png)\n\
    \nA simple network, allowing two PCs to communicate with each other, can be created\
    \ by connecting a cable made for this purpose. This type of connection is commonly\
    \ supported by newer operating systems.\n\n### Steps\n\n1. 1. On the **Shelf**,\
    \ locate and select the appropriate cable.\n   - What is the name of the cable\
    \ that you chose to connect the two PCs?\n\n2. 2. Drag one of the cable's connectors\
    \ to the appropriate port on the first computer. The other connector moves to\
    \ Workbench Connections.\n   - What type of ports, on the PCs, fit the cable that\
    \ you chose?\n\n3. 3. Drag the remaining connector in Workbench Connectors to\
    \ the appropriate port on the second computer.\n\n## 3.0: Networking Devices\n\
    \n## 3.1: Network Adapters\n\n**Objectives**\n\n- Distinguish differences between\
    \ modems and network cards.\n- Identify various features of common modems and\
    \ NICs.\n- Select an appropriate modem or NIC, based on its features.\n- Identify\
    \ connectors and ports used for modem and network connection.\n- Connect a PC\
    \ to the Internet via PSTN.\n- Access and identify the status and properties of\
    \ a network connection.\n- Disable a network connection.\n\n### 3.1.6 Select and\
    \ Install a Network Adapter\n\n### Scenario\n\nYou want to connect your computer\
    \ to the Internet through the PSTN (publicly switched telephone network) using\
    \ the fastest speed possible.\n\nComplete the following tasks:\n\n- Select the\
    \ correct expansion card with the fastest speed to connect to the PSTN.\n- Select\
    \ the corresponding cable and connect the computer to the PSTN.\n\n### Facts &\
    \ Tasks\n\nSome typical expansion cards used for networking computers are listed\
    \ below:\n\n- Ethernet NIC: Connects to an Ethernet network.\n- Token Ring NIC:\
    \ Connects to a Token Ring network.\n- Modem: Connects to the phone line to communicate\
    \ with remote computers.\n- ISDN NIC: Connects through an ISDN network for host-to-host\
    \ connections.\n\n### Steps\n\n1. 1. Switch to Motherboard view by clicking the\
    \ Motherboard button on the Workbench toolbar.\n2. 2. On the **Shelf**, locate\
    \ and select the appropriate expansion card.\n\nComplete the following table as\
    \ you work through this lab.\n\n**Note:** When you restart the lab, the expansion\
    \ card groups will be randomized. If you exit and restart the lab, the correct\
    \ expansion card may be in a different position.\n\n| Group Number | Card Type\
    \ | Ports (How many & what types) | Signal Level |\n|---|---|---|---|\n| Group\
    \ 1 | | | |\n| Group 2 | | | |\n| Group 3 | | | |\n| Group 4 | | | |\n| Group\
    \ 5 | | | |\n| Group 6 | | | |\n\n3. 3. Drag the appropriate card to the appropriate\
