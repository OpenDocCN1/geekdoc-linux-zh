    \ 连接 = Dial Internet\n- VPN 服务器 = 172.10.5.42\n\n创建 VPN 连接后，连接将配置为自动检测使用的 VPN\
    \ 隧道协议。你希望要求连接使用带有 IPSec 加密的 VPN 隧道协议。要配置特定的 VPN 协议：\n\n1. 编辑 VPN 连接的属性。\n2. 在“网络”选项卡上，将\
    \ VPN 协议更改为相应的协议。\n\n> 注意：在本实验中你将无法建立连接进行测试。\n\n## 知识与任务\n\n在此场景中，你创建一个 VPN 连接以使用现有的拨号连接。在创建连接后，你需要配置它使用\
    \ L2TP 作为 VPN 隧道协议。\n\n## 步骤\n\n1. 打开控制面板。\n2. 选择创建网络 Internet 连接的选项。\n3. 打开网络连接。\n\
