    - IP 地址 = 192.168.1.6\n- 子网掩码 = 255.255.255.00\n- 默认网关 = 192.168.1.254\n- 首选 DNS\
    \ 服务器 = 192.168.1.1\n\n## 相关知识与任务\n\n配置连接时，你需要提供 IP 地址、子网掩码、默认网关和 DNS 服务器。这些设置允许计算机与网络和互联网上的其他设备通信。\n\
    \n步骤\n\n+ 1. 打开网络连接窗口。\n2. 选择适用连接的属性。\n* 你选择了哪个选项卡？\n\n+ 3. 选择 Internet 协议 (TCP/IP)\
    \ 属性。\n* 你点击哪个按钮？\n\n+ 4. 选择输入 IP 地址的选项。\n* 你选择了哪个选项？\n\n+ 5. 输入 IP 地址并移动到下一个字段。\n\
    * 你输入了什么地址？\n\n+ 6. 你使用 Tab 键访问下一个字段吗？\n\n+ 7. 如果需要，输入信息或留空字段。\n\n8. 要分配 DNS 服务器，选择使用指定的\
    \ DNS 地址选项。\n\n- 为什么不需要选择此选项？\n\n+ 9. 输入 DNS 地址，然后进入下一页。\n\n+ 10. 退出 Internet\
    \ 协议 (TCP/IP) 和本地连接属性窗口以保存更改。\n\n## 10.3 远程访问\n\n目标\n\n- 创建并配置拨号到远程访问服务器。\n- 启用和禁用网络连接的属性。\n\
    \n## 10.3.4 配置远程访问连接\n\n场景\n\n你正在为一台便携式 Windows XP 专业版计算机配置网络连接。你想让这台计算机通过拨号连接到你的公司网络。\n\
    \n你在实验中的任务是创建一个拨号到公司远程访问服务器的拨号连接。使用以下属性配置拨号连接：\n\n- 连接名称/公司名称 = 拨号公司 (Dial Company)\n\
    - 电话号码 = 555-4321\n\n**提示：** 当启动新建连接向导时，选择**连接到工作场所的网络**选项来创建连接。\n\n相关知识与任务\n\n\
    点点协议（PPP）使建立远程连接变得简单得多。配置 PPP，你需要提供拨号电话和任何身份验证参数（如用户名和密码）。PPP 会协商通信参数，包括 IP 地址、压缩和加密。PPP\
    \ 还支持多种协议栈。\n\n步骤\n\n+ 1. 打开控制面板。\n2. 选择网络 Internet 连接类别。\n3. 打开网络连接。\n4. 打开新建连接向导。\n\
