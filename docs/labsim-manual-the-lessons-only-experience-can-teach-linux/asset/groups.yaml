    \n+ 1. 打开**控制面板**。\n+ 2. 打开**网络连接**。\n+ 3. 查看本地局域网网络连接的**属性**。\n+ 4. 从连接所使用的项目列表中选择“Internet\
    \ 协议”（在配置 LAN 连接时，选择“常规”选项卡，否则选择**网络选项卡**）。\n+ * 你在哪个选项卡下找到“Internet 协议”项目？\n\n\
    5. 然后查看“Internet 协议”属性。\n+ - 你点击哪个按钮来查看“Internet 协议”属性？\n6. 空间只允许两个地址，即首选和第一个备用地址。你可以在此窗口输入它们，但由于你有第三个地址要输入，请选择允许输入所有三个地址的按钮。\n\
