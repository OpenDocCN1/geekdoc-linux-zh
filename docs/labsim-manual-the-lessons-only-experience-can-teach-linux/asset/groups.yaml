    \n7. 选择创建 VPN 的选项，然后选择按钮进入下一步。\n\n+- 你选择了哪个选项？\n\n8. 输入公司名称并选择按钮进入下一步。\n\n+- 你输入了什么？\n\
    \n9. 选择自动拨号该连接的选项，然后选择按钮进入下一步。\n\n+- 你选择了哪个选项？\n\n10. 输入 VPN 访问服务器的主机名或 IP 地址，然后选择按钮进入下一步。\n\
    \n+- 你输入了什么？\n\n11. 退出新建连接向导。\n12. 查看新连接的属性。\n\n+   - 你选择了哪个选项？\n\n13. 选择用于网络的选项卡。\n\
