- md: "\n## 4.1.8 Connect to a Fiber Optic Network\n\n### Scenario\n\nYour company\
    \ has just moved to a new office building. The server room has fiber optic installed\
    \ to the wall plate. You need to connect the server to the fiber optic network\
    \ connection.\n\nSelect and install the necessary components to connect to the\
    \ fiber optic network.\n\n## Facts & Tasks\n\nBecause your computer doesn't have\
    \ a fiber optic NIC to communicate on the fiber optic network, you will need a\
    \ device to convert the fiber optic signal.\n\n## Steps\n\n- 1. Locate, on the\
    \ **Shelf**, the appropriate device for bridging between the PC and the fiber\
    \ optic network and drag it to the **Workbench**.\n\nComplete the following table\
    \ as you work through this step in the lab.\n\n| Device Type | Ports (Number/Types)\
    \ | Network Type |\n|---|---|--|\n| | | |\n| | | |\n| | | |\n\n- 2. Open the **Cables**\
    \ menu on the **Shelf**.\n\n- 3. Locate the appropriate cable to connect the PC\
    \ to the device that you chose in step 1.\n    - *What type of cable is required\
    \ to connect the PC and device?*\n\n- 4. Drag a connector to the appropriate port\
    \ on the back of the device. The cable and other connector moves to Workbench\
    \ Connections.\n\n- 5. Drag the connector in **Workbench Connections** to the\
    \ appropriate port in the PC.\n\n- 6. Locate the cable, which connects the device\
    \ to the appropriate wall socket.\n    - *What type of network are you connecting\
    \ to?*\n\n- 7. Drag the appropriate connector to the appropriate port in the device.\
    \ The remaining connectors move to Workbench Connections.\n    - *What shape is\
    \ the connector that you chose?*\n\n- 8. Drag the appropriate connector in Workbench\
    \ Connections to the appropriate jack in the wall outlet.\n    - *Did you connect\
    \ the cable to the send or receive port in step 7?*\n    - *What color was the\
    \ cable that you connected in step 7?*\n\n- 9. Drag the appropriate connector\
    \ on Workbench Connections to the remaining port in the device.\n\n- 10. Drag\
    \ the remaining connector to the remaining jack in the wall outlet.\n\n## 5.0:\
    \ Wireless Networking Standards\n\n## 5.2: Configuring a Wireless Network\n\n\
    ### Objectives\n\n- Identify the correct wireless standards for given applications.\n\
    - Install wireless network adapters and components that match given requirements.\n\
    \n## 5.2.3 Select a Wireless Card\n\n### Scenario\n\nBecause you travel frequently,\
    \ you want to equip your laptop with wireless networking capability. Select and\
    \ install a wireless device that supports data transfers from 11 Mbps to 54 Mbps\
    \ on networks that use the 2.4 GHz frequency range. Select the cheapest solution\
    \ to meet the requirements.\n\n## Facts & Tasks\n\nThe 802.11x standards listed\
    \ in the table below:\n\n| Standard | Frequency | Speed |\n| 802.11a | 5.75 -\
    \ 5.85 GHz | 54 Mbps |\n| 802.11b | 2.4 - 2.4835 GHz | 11 Mbps |\n| 802.11g |\
    \ 2.4 - 2.4835 GHz | 54 Mbps |\n\nTwo ports typically used for installation of\
    \ wireless devices are displayed in the table below.\n\n| Port | Wireless Device\
    \ |\n| USB | USB Drive <br> ![USB](image_1) |\n| PCMCIA | PCMCIA card <br> ![PCMCIA](image_2)\
    \ |\n\n### Steps\n\n- 1. On the Shelf, locate the device that best meets the required\
    \ standards at the lowest cost.\n\nComplete the following table as you work through\
    \ this step of the lab.\n\n| Device | Standard | Connection / Port Type | Price\
    \ |\n| --- | --- | --- | --- |\n| | | | $ |\n| | | | $ |\n| | | | $ |\n| | | |\
    \ $ |\n| | | | $ |\n\n- 2. Drag the device to an appropriate slot/port.\n    -\
    \ *The computer has two types of ports that accommodate the available devices.\
    \ List them, below:*\n\n## 5.2.4 Create a Wireless Network 1\n\n### Scenario\n\
    \nYou want to set up a wireless network in your apartment. Your roommate wants\
    \ to connect to it, and you want your friends to be able to connect when they\
    \ come over. You have decided that 11 Mbps data transfer rate is sufficient for\
    \ what you need.\n\nSelect and install the appropriate networking devices.\n\n\
    ## Facts & Tasks\n\nTwo typical wireless networking devices are presented in the\
    \ table below.\n\n| Device | Characteristics |\n|---|---|\n| Wireless NIC | Card\
    \ inside PC for signal receipt and transmission |\n| Wireless Access Point (WAP)\
    \ | Equivalent of Ethernet hub. Wireless NICs connect to WAP, which manages connection\
    \ to network. Can be a port, hub, switch, or router. |\n\n### Steps\n\n- 1. On\
    \ the **Shelf**, locate and drag the appropriate device to the appropriate slot(s)\
    \ in your PC. Hint: Switch to alternative views of the PC or PC components to\
    \ complete this step.\n\n**Note:** When you restart the lab, the device groups\
    \ will be randomized. If you exit and restart the lab, the correct expansion card\
    \ may be in a different position.\n\nComplete questions in the table, on the next\
    \ page, as you work through this lab.\n\n| Group Number | Type of Device(s) |\
    \ Type of Port / Slot Connection Required | Network Standards (circle those that\
    \ apply) |\n| Group 1 | | 802.11a, b, or g |\n| Group 2 | | 802.11a, b, or g |\n\
    | Group 3 | | 802.11a, b, or g |\n| Group 4 | | 802.11a, b, or g |\n| Group 5\
    \ | | 802.11a, b, or g |\n\n- 2. On the **Shelf**, locate and drag the appropriate\
    \ device to the appropriate slot(s) in your PC.\n- 3. On the **Shelf**, locate\
    \ and drag the appropriate device to the.\n- 4. Drag the appropriate connector\
    \ to the appropriate port.\n\n## Create a Wireless Network\n\n### Scenario\n\n\
    You have just purchased a new computer and need to connect it to a small business.\
    \ The network uses static addressing.\n\n### Facts & Tasks\n\nEach wireless network\
    \ uses one of two architectures. See the table below to review:\n\n| Topology\
    \ | Description |\n|---|---|\n| Ad Hoc | Works in peer-to-peer mode without a\
    \ WAP. Easy to set up, but limited to individuals. |\n| Infrastructure | Requires\
    \ a WAP. Can easily add hosts. |\n\n### Steps\n\n- 1. Locate the cable, which\
    \ connects the device to the appropriate wall socket.\n- 2. Drag the appropriate\
    \ connector to the appropriate port in the device. The remaining connectors move\
    \ to Workbench Connections.\n\n- 3. Drag the appropriate connector in Workbench\
    \ Connections to the appropriate jack in the wall outlet.\n\n## 5.0: TCP/IP\n\n\
    ### Objectives\n\n- Recognize the parts and meanings of IP, gateway, and DNS addresses.\n\
