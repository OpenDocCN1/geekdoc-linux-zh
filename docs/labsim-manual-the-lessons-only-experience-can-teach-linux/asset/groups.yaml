- md: "\n## 8.2: IP Address Assignment\n\n### Objectives\n\n- Configure the TCP/IP\
    \ Protocol to access either a DHCP server or use Automatic Private IP Addressing\
    \ (APIPA).\n\n## 8.2.4 Configure a DHCP Client\n\n### Scenario\n\nYou are configuring\
    \ network connections for a Windows Server 2003 computer. Previously, your network\
    \ did not have a DHCP server, but you have just installed and configured one.\n\
    \nYour task in this lab is to configure the TCP/IP protocol for the Local Area\
    \ Connection network connection to get IP addressing and DNS server information\
    \ from the DHCP server.\n\n### Facts & Tasks\n\nThe Obtain an IP address automatically\
    \ option will use a DHCP server if one exists. Otherwise, it will use Automatic\
    \ Private IP Addressing (APIPA) to assign an address between 169.254.0.0 and 169.254.255.255.\
    \ You can also obtain DNS server addresses automatically, or you can configure\
    \ DNS server addresses manually. To obtain DNS server addresses from a DHCP server,\
    \ select the Obtain DNS server address automatically option.\n\n### Steps\n\n\
    1. Open the Control Panel.\n2. Open Network Connections.\n3. View Properties for\
    \ the Local Area Connection network connection.\n4. Locate, select, and view the\
    \ Internet Protocol Properties.\n5. Locate, select, and view the Advanced settings\
    \ of TCP/IP Settings.\n6. Locate and select the option that will use either a\
    \ DHCP server, if one exists, or will use Automatic Private IP Addressing.\n \
    \  - Which button did you select?\n7. Locate and select the option that will obtain\
    \ DNS server addresses automatically.\n   - Which button did you select?\n8. Close\
    \ each window saving the changes.\n\n## 8.3: NAT and ICS\n\n### Objectives\n\n\
    - Enable Dial Internet network connection sharing on a computer.\n- Enable on-demand\
    \ dialing,\n- Configure other users on the network to enable or disable the Internet\
    \ connection manually.\n\n## Share an Internet Connection\n\n### Scenario\n\n\
    You are configuring Internet connectivity for a small office network. You want\
    \ all computers on the network to connect to the Internet using a shared dial-up\
    \ network connection on a Windows XP Professional computer. You want the connection\
    \ to be established automatically any time a computer tries to access the Internet.\n\
    \nYour task in this lab is to share the Dial Internet network connection on this\
    \ computer. Allow on-demand dialing, but do not allow other users on the network\
    \ to enable or disable the Internet connection manually.\n\n### Facts & Tasks\n\
    \nIf the username and password for this connection is saved for your use only,\
    \ you will be prompted to save it for all of users. Otherwise, Internet connection\
    \ sharing will only work properly when you are logged on to the computer with\
    \ the shared Internet connection. Click OK. (You can change how the username and\
    \ password for a connection is saved when you establish the connection.)\n\n###\
    \ Steps\n\n1. Open the Control Panel.\n2. Open Network Connections.\n3. View Properties\
    \ for the dial-up, VPN, or broadband connection.\n   - Which applet did you select?\n\
    4. Locate the Internet Connection and Sharing settings in the Dial Internet Properties\
    \ window.\n   - Which tab did you select to find the settings?\n5. Select the\
    \ option to share the connection with other users on the LAN.\n\nCheck, or leave\
    \ unchecked, the options that you selected, or did not select in steps 5, 7, and\
    \ 8.\n\n| Allow other network users to connect this computer's Internet connection.\
    \ |\n| :--- |\n| Establish a dial-up connection whenever a computer on my network\
    \ attempts to access the Internet. |\n| Allow other network users to control or\
    \ disable the shared Internet connection. |\n\n6. Enable automatic dialing.\n\
    \   - Did you check the box or not?\n7. Select the option to enable on-demand\
    \ dialing, which causes the connection to be established automatically when other\
    \ users on the network need it.\n8. Select the option to disable (disconnect)\
    \ the shared connection manually.\n9. Enable Internet Connection Sharing.\n  \
    \ - Did you check the box or not?\n10. Close each window saving the changes.\n\
    \n## 9.0: Operating Systems\n\n## 9.1: Client and Server Operating Systems\n\n\
    ### Objectives\n\n- Install the QoS Packet Scheduler networking service.\n\n##\
    \ 9.1.5 Install a Service\n\n### Scenario\n\nYou are configuring network connections\
    \ for a Windows XP Professional computer. The computer is connected to an IP network\
    \ that supports Quality of Service (QoS) features. You want to take advantage\
    \ of these features for certain QoS-enabled programs that the computer runs.\n\
    \nYour task in this lab is to install the QoS Packet Scheduler networking service.\n\
    \n### Facts & Tasks\n\nIn this lab, the QoS component is a networking service.\
    \ As you install the component, select Service as the component type.\n\nIn most\
    \ cases, you can install components from the properties of any connection. However,\
    \ you cannot install some components from the properties of a dial-up connection.\n\
    \nDepending on the component you install, you might need to reboot the system.\
    \ If not, click Close.\n\nIn most cases, when you install a client, service, or\
    \ protocol, it is enabled for all connections (and not just the connection where\
    \ you started the install process). After installation, manually disable the component\
    \ for specific connections if necessary. Also, keep in mind that the installation\
    \ process for some components (such as client software) often automatically installs\
    \ other components (such as appropriate protocols).\n\n### Steps\n\n1. Open the\
    \ Control Panel.\n2. Open Network Connections.\n3. View Properties for the Local\
    \ Area Connection network connection.\n4. Install a service.\n   - Under which\
    \ tab did you find the Install button?\n   - Which connection item(s) did you\
    \ install before selecting the Install button?\n     ___ Client for Microsoft\
    \ Networks\n     ___ File and printer sharing for Microsoft Networks\n     ___\
    \ Internet Protocol (TCP/IP)\n     ___ None of the above\n5. Add a network component\
    \ type to install.\n   - Which component type did you install?\n     ___ Client\n\
    \     ___ Service\n     ___ Protocol\n6. Select a service to install.\n   - Which\
    \ service did you install?\n     ___ QoS Packet Scheduler\n     ___ SAP Agent\n\
    \n## 9.2: Windows Networking\n\n### Objectives\n\n- Create a new local user account\
    \ including individual user information.\n- Add a local user account to a local\
    \ group.\n- Use Active Directory Users and Computers to create a new domain user\
    \ account including user information.\n\n## 9.2.3 Create a Local User Account\n\
    \n### Scenario\n\nYou are configuring local users for a Windows XP Professional\
    \ computer that is a member of a workgroup. You want to create a user account\
    \ for a new employee. The new employee will not start for a few days, so you want\
    \ to keep the account disabled.\n\nYour task in this lab is to create a new user\
    \ account with the following properties:\n\n- User Name = sbagley\n- Full Name\
    \ = Sue Bagley\n- Description = Lead Designer\n- Password = sbagley\n- User must\
    \ change password at next logon = True\n- Account is disabled = True\n\n### Facts\
    \ & Tasks\n\nMany of the user account properties required in this (such as setting\
    \ the full name, description, and account disabling) can only be set by the Local\
    \ Users and Groups snap-in. If the computer is a domain member, you can open the\
    \ Local Users and Group snap-in from the User Accounts applet in the Control Panel.\
    \ Click the Advanced tab. Then click the Advanced button under Advanced user management.\n\
    \n### Steps\n\n1. Open the Computer Management window (pre configured MMC console).\n\
    \   - Which button did you select to access My Computer?\n   - Which mouse button\
    \ did you use when selecting My Computer?\n   - Which menu item did you select\
    \ to open the Computer Management window?\n2. Open System Tools.\n   - Is System\
    \ Tools found in the right or left column?\n\n**Note:** If not already done, you\
    \ may need to expand the outline to move on to the next step.\n3. Expand Local\
    \ Users and Groups.\n   - What are the names of the two folders under Local Users\
    \ and Groups?\n4. Select New User from under the Users folder.\n   - Is New User\
    \ found in a column in the Computer Management window or on a drop down menu?\n\
    5. Enter the name for the user account.\n   - In which field did you enter the\
    \ new user account name?\n6. Enter the full name and description values, if necessary.\n\
    7. Enter the password and confirm it.\n8. Enable or disable the following options,\
    \ as necessary:\n   - User must change password at next logon (This option is\
    \ not available if either of the next two options are selected. Also, the next\
    \ two options cannot be selected if this option is selected.)\n   - User cannot\
    \ change password\n   - Password never expires\n   - Account is disabled\n9. Save\
    \ your changes and exit.\n"
  mdcn: "\n\n## 8.2: IP 地址分配\n\n### 目标\n\n- 配置 TCP/IP 协议以访问 DHCP 服务器或使用自动私有 IP 地址\
    \ (APIPA)。\n\n## 8.2.4 配置 DHCP 客户端\n\n### 场景\n\n你正在为一台 Windows Server 2003 计算机配置网络连接。之前，你的网络没有\
    \ DHCP 服务器，但你刚刚安装并配置了一个。\n\n你在本实验中的任务是为局域连接（Local Area Connection）网络连接配置 TCP/IP\
    \ 协议，以从 DHCP 服务器获取 IP 地址和 DNS 服务器信息。\n\n### 知识与任务\n\n“自动获取 IP 地址”选项将使用存在的 DHCP\
    \ 服务器。否则，它将使用自动私有 IP 地址 (APIPA) 分配 169.254.0.0 到 169.254.255.255 之间的地址。你也可以自动获取\
    \ DNS 服务器地址，或者手动配置 DNS 服务器地址。要从 DHCP 服务器获取 DNS 服务器地址，请选择自动获取 DNS 服务器地址”选项。\n\n\
    ### 步骤\n\n1. 打开控制面板。\n2. 打开网络连接。\n3. 查看“局域连接”网络连接的属性。\n4. 定位、选择并查看“Internet 协议”属性。\n\
    5. 定位、选择并查看 TCP/IP 设置的“高级”设置。\n6. 定位并选择在存在时将使用 DHCP 服务器或使用自动私有 IP 地址的选项。\n   -\
    \ 你选择了哪个按钮？\n7. 定位并选择“自动获取 DNS 服务器地址”的选项。\n   - 你选择了哪个按钮？\n8. 关闭每个窗口并保存更改。\n\n\
    ## 8.3: NAT 和 ICS\n\n### 目标\n\n- 在计算机上启用拨号上网连接共享。\n- 启用按需拨号。\n- 配置网络上的其他用户，使其手动启用或禁用\
    \ Internet 连接。\n\n## 共享 Internet 连接\n\n### 场景\n\n你正在为一个小型办公室网络配置互联网连接。你希望网络上的所有计算机都通过运行\
    \ Windows XP 专业版计算机上的共享拨号网络连接连接到互联网。你希望在计算机尝试访问互联网的任何时候都能自动建立连接。\n\n你在本实验中的任务是共享这台计算机上的“拨号上网”网络连接。允许按需拨号，但不允许网络上的其他用户手动启用或禁用\
    \ Internet 连接。\n\n### 知识与任务\n\n如果此连接的用户名和密码仅保存供你使用，系统将提示你将其保存给所有用户。否则，Internet\
    \ 连接共享只有在你使用共享的 Internet 连接登录计算机时才能正常工作。点击“确定”（你可以在建立连接时更改连接用户名和密码的保存方式）。\n\n\
    ### 步骤\n\n1. 打开控制面板。\n2. 打开网络连接。\n3. 查看拨号、VPN 或宽带连接的属性。\n   - 你选择了哪个应用程序小节？\n\
    4. 在“拨号连接”属性窗口中找到“Internet 连接和共享”设置。\n   - 你点击哪个选项卡来找到这些设置？\n5. 选择与局域网上的其他用户共享连接的选项。\n\
    \n勾选或保持不勾选你在步骤 5、7 和 8 中选择或未选择的选项。\n\n| 允许其他网络上的用户连接到此台计算机的 Internet 连接。 |\n|\
    \ :--- |\n| 当我的网络上的计算机尝试访问 Internet 时，始终建立拨号连接。 |\n| 允许其他网络上的用户控制或禁用共享的 Internet\
    \ 连接。 |\n\n6. 启用自动拨号。\n   - 你勾选了框框吗？\n7. 选择启用“按需拨号”的选项，这会在网络上的其他用户需要时自动建立连接。\n\
    8. 选择手动禁用（断开连接）共享连接的选项。\n9. 启用 Internet 连接共享。\n   - 你勾选了框框吗？\n10. 关闭每个窗口并保存更改。\n\
    \n## 9.0: 操作系统\n\n## 9.1: 客户端和服务器操作系统\n\n### 目标\n\n- 安装 QoS 数据包调度器网络服务。\n\n##\
    \ 9.1.5 安装服务\n\n### 场景\n\n你正在为一台 Windows XP 专业版计算机配置网络连接。该计算机连接到一个支持服务服务质量 (QoS)\
    \ 功能的 IP 网络。你希望为计算机运行的某些启用 QoS 功能的程序利用这些功能。\n\n你在本实验中的任务是安装“QoS 数据包调度器”网络服务。\n\
    \n### 知识与任务\n\n在本实验中，QoS 组件是一个网络服务。在安装组件时，请选择“服务”作为组件类型。\n\n在大多数情况下，你可以从任何连接的属性中安装组件。但是，你无法从拨号连接的属性中安装某些组件。\n\
    \n取决于你安装的组件，你可能需要重启系统。如果没有，请点击“关闭”。\n\n在大多数情况下，当你安装客户端、服务或协议时，它会对所有连接启用（而不仅仅是你开始安装过程的那个连接）。安装后，如有必要，手动为特定连接禁用该组件。还请记住，某些组件（如客户端软件）的安装过程通常会自动安装其他组件（如相应的协议）。\n\
    \n### 步骤\n\n1. 打开控制面板。\n2. 打开网络连接。\n3. 查看“局域连接”网络连接的属性。\n4. 安装服务。\n   - 你在哪个选项卡下找到“安装”按钮？\n\
    \   - 在选择“安装”按钮之前，你安装了哪些连接项？\n     ___ 微软网络客户端\n     ___ 微软网络文件和打印机共享\n     ___\
    \ Internet 协议 (TCP/IP)\n     ___ 以上均都不是\n5. 添加一种要安装的网络组件类型。\n   - 你安装了哪种组件类型？\n\
    \     ___ 客户端\n     ___ 服务\n     ___ 协议\n6. 选择要安装的服务。\n   - 你安装了哪个服务？\n     ___\
    \ QoS 数据包调度器\n     ___ SAP Agent\n\n## 9.2: Windows 网络\n\n### 目标\n\n- 创建一个包含个人用户信息的新本地用户账户。\n\
    - 将本地用户账户添加到本地组中。\n- 使用“Active Directory 用户和计算机”创建一个包含用户信息的新域用户账户。\n\n## 9.2.3\
    \ 创建本地用户账户\n\n### 场景\n\n你正在为一台属于工作组的 Windows XP 专业版计算机配置本地用户。你想为一个新员工创建一个用户账户。新员工将在几天后才上班，因此你想让该账户保持禁用状态。\n\
    \n你在本实验中的任务是创建一个具有以下属性的新用户账户：\n\n- 用户名 = sbagley\n- 全名 = Sue Bagley\n- 描述 = 首席设计师\n\
    - 密码 = sbagley\n- 用户必须在下次登录时更改密码 = True\n- 账户已禁用 = True\n\n### 知识与任务\n\n本实验所需的许多用户账户属性（如设置全名、描述和禁用账户）只能通过“本地用户和组”程序集进行设置。如果计算机是域成员，你可以从控制面板中的“用户账户”小节打开“本地用户和组”程序集。点击“高级”选项卡，然后点击“高级用户管理”按钮。\n\
    \n### 步骤\n\n1. 打开计算机管理窗口（预配置的 MMCset）。\n   - 你点击哪个按钮访问“计算机”？\n   - 你选择“计算机”时使用了哪个鼠标键？\n\
    \   - 你点击菜单中的哪项打开了计算机管理窗口？\n2. 打开“系统工具”。\n   - “系统工具”位于右列还是左列？\n\n**注意：** 如果尚未完成，可能需要展开大纲才能继续下一步。\n\
    3. 展开“本地用户和组”。\n   - “本地用户和组”下的两个文件夹名称是什么？\n4. 从“用户”文件夹下选择“新建用户”。\n   - “新建用户”是在计算机管理窗口的列中还是下拉菜单中？\n\
    5. 为用户账户输入名称。\n   - 你在哪个字段输入了新用户账户名称？\n6. 输入密码并确认密码。\n7. 根据需要，启用或禁用以下选项：\n   -\
    \ 用户必须在下次登录时更改密码（如果选择了以下两个选项中的任何一个，则此选项不可用。同样，如果选择了此选项，则后两个选项无法被选择。）\n   - 用户无法更改密码\n\
    \   - 密码永不过期\n   - 账户已禁用\n8. 保存更改并退出。\n\n"
