    \n在“安全日志”选项卡上，选择是否记录丢弃的数据包和/或成功的连接。你还可以指定日志文件的路径和文件名，并指定日志文件的大小限制。\n\n在“ICMP”选项卡上，选择局域网和互联网之间应允许任何入站或出站\
