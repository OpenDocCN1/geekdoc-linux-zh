    ## 0.0: 引言


    ## 0.2: 硬件模拟器


    ### 目标


    - 使用文档识别组件和模块。

    - 使用视图识别组件和模块。

    - 在不同区域拖放系统组件。

    - 安装和卸载组件。

    - 更改视图、阅读组件详情。


    ## 将项目置于工作台


    ### 场景


    为了练习使用硬件模拟器，请完成以下任务：


    1. 从货架 (Shelf) 中选择扫描仪。

    2. 将扫描仪放置到工作台 (Workbench) 的计算机旁。


    完成后，点击底部的“完成”按钮。


    ### 事实与任务


    注意模拟器屏幕分为三个主要区域：


    - **场景 (Scenario)**（右上角）：场景窗口提供你需要执行的信息（当前正在阅读文本）。

    - **货架 (Shelf)**（屏幕左侧）：货架窗口列出了可安装的硬件项目。

    - **工作台 (Workbench)**（右下角）：工作台窗口显示所有已安装的项目。


    ### 步骤


    1. 查看货架上的“Scanner, USB 2.0”项目（组 2 是扫描仪组）。

    2. 点击并按住项目的任何部分，将其拖到工作台上计算机一侧的空隙。

    3. 当看到带有箭头的白色条表示项目将插入时，释放鼠标。


    ## 0.2.3 根据文档选择项目


    ### 场景


    为了学习如何查看和使用项目详情，请完成以下任务：


    - 对于货架上的每个项目，点击详情链接查看设备的图片和文档。

    - 找到包含可选打印端口的设备。

    - 将该设备添加到工作台的计算机旁。


    完成后，点击底部的“完成”按钮。


    ### 事实与任务


    在实验中，你将学习如何获取货架或工作台上硬件项目的详情。有两种类型的详情：


    - **视图 (Views)**：硬件项目通常有多个视图。这些视图通常比货架上显示的图标大得多。

    - **文档 (Documentation)**：某些硬件项目具有超出描述部分的文档。


    ### 步骤


    将带有可选打印端口的扫描仪置于工作台


    - 点击货架上扫描仪旁的详情链接。

    - 点击文档选项卡，查看扫描仪端口和其他控件的标注概述。

    - 从货架拖动并行扫描仪到工作台。


    1. 确保选中了工作台的前或后视图。否则，请点击工作台工具栏上的前或后视图按钮。

    2. 如果货架上未显示扫描仪，点击扫描仪分类。然后将扫描仪拖到工作台上计算机旁的空隙处。


