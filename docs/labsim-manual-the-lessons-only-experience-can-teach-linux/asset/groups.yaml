    \ WINS 服务器）\n\n**注意**：要配置 WINS 服务器地址，请像配置 IP 地址一样编辑 TCP/IP 属性。点击**高级（Advanced）**按钮并在\
    \ WINS 选项卡上设置 WINS 地址。\n\n## 知识与任务\n\n如果列出了多个 WINS 服务器地址，可以通过选择 WINS 服务器地址并点击列表右侧的向上或向下箭头更改地址顺序。将按照地址列出的顺序联系\
