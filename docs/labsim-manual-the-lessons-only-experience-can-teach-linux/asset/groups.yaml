    ## LabSim Manual

    Installation Instructions

    The Lessons Only Experience Can Teach


    - 1. Insert the disc into the CD or DVD drive while your computer is connected
    to the Internet.

    - 2. When the installation program starts, click **Install Application** and follow
    the steps in the installation wizard. (If the installation window does not launch
    automatically, run the **Autorun.exe** file in your CD or DVD drive directory.)


    During the installation, you can choose to run LabSim from the disc (runs more
    slowly), or you can install the disc contents onto your hard drive (each disc
    requires approximately 700 MB of free space).


    - 3. Following installation, the TestOut Navigator program will be launched. (If
    this program does not start, use the **TestOut LabSim** shortcut on your Start
    menu or Desktop). Enter the username and password you received from your instructor.


    - 4. After logging on, select the **LabSim link** (on the left under Learning
    Resources) to run the product. Have your instructor activate the product if it
    does not appear in the list of available titles.


