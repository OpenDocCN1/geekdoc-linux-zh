    \ 类地址：* 最有可能拥有可分配的 IP 地址。 * 第一个字节在 192 到 223 之间。 * 前三个字节定义网络。 * 最后一个字节定义主机。 |\n\
    | 子网掩码 | 识别 IP 地址的哪部分是网络地址。同一网络上的两个设备必须配置相同的网络掩码。前三类的默认子网掩码如下：* A 类：255.0.0.0\
    \ * B 类：255.255.0.0 * C 类：255.255.255.0 |\n| 默认网关 | 识别用于发往远程网络的数据包时所被发送往的路由器。默认网关地址是与本地主机处于同一子网的接口的\
    \ IP 地址。如果没有设置默认网关，大多数客户端将无法与本地子网之外的主机通信。 |\n| DNS 服务器 | 识别用于将主机名解析为 IP 地址的 DNS\
    \ 服务器。 |\n\n## 步骤\n\n打开**显示（Exhibit）**以查看网络图。你需要参考网络图来确定应该输入什么信息。\n\n+ 1. 打开**控制面板**。\n\
