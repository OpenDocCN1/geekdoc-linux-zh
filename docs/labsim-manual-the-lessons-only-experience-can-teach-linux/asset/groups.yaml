    + - 你点击了哪个按钮？\n9. 为 DNS 服务器输入 IP 地址。\n10. 重复步骤 9 直到所有地址都输入完毕。\n11. 关闭每个窗口并保存更改。\n\
    + - 你点击了哪个按钮？\n\n## 8.1.8 配置 WINS 设置\n\n### 场景\n\n你正在为一台 Windows XP 专业版电脑配置网络连接。目前，你的网络没有\
