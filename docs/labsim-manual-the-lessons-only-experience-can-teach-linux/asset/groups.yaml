- md: "\n6. Select the option that will allow a business network connection from an\
    \ offsite location and then select the button that will take you to the next step.\n\
    \n7. Select the option that will connect you using a modem and phone line and\
    \ then select the button that will take you to the next step.\n\n8. Enter the\
    \ company name and then select the button that will take you to the next step.\n\
    \n+   * What name did you enter?\n\n9. Enter the phone number to dial and then\
    \ select the button that will take you to the next step.\n\n+   * What number\
    \ did you enter?\n\n10. Select whether to make the connection available to all\
    \ users or not and then select the button that will take you to the next step.\
    \ (This screen might not appear.)\n\n11. Save the changes and exit.\n\n## 10.3.5\
    \ Disable Networking Components\n\n## Scenario\n\nYou are configuring network\
    \ connections for a Windows Professional computer. To enhance performance and\
    \ security, you want to make sure that only necessary networking components are\
    \ being used on the dialup connection.\n\nYour task in this lab is to edit the\
    \ properties of the *Dial Internet* connection and disable the following components:\n\
    \n- Client for Microsoft Networks\n- File and Printer Sharing for Microsoft Networks\n\
    - Client Service for NetWare\n- NWLnk IPX/SP/NetBIOS protocol\n\n## Facts & Tasks\n\
    \nNetworking items can be found under the General tab if the connection is a LAN\
    \ connection, otherwise they are under the Networking tab.\n\nTo disable these\
    \ components, remove the check next to each component in the *Dial Internet* connection\
    \ properties. When you are finished, the dial-up connection should use only *TCP/IP*.\
    \ *Do not* uninstall the components, as that will remove them from the system\
    \ and the other connections.\n\nEnabling or disabling components for a connection\
    \ does not affect whether the components are enabled or disabled for other connections.\n\
    \n## Steps\n\n1. Open the **Control Panel**.\n2. Open **Network Connections**.\n\
    3. Locate the appropriate network connection.\n   - Which connection did you select?\n\
    \n4. Select the tab displaying the connection items.\n\n+   * Which tab did you\
    \ select?\n\n5. In the list of networking components, enable or disable the components\
    \ you want to be used for this connection.\n\n6. Save and exit.\n\n## 10.4: Securing\
    \ Remote Connections\n\n### Objectives\n\n- Configure the authentication settings\
    \ for a network connection.\n- Create a VPN connection between a PC and a VPN\
    \ remote access server.\n- Configure a VPN connection to automatically detect\
    \ which VPN tunneling protocol to use.\n\n## 10.4.3 Configure the Authentication\
    \ Protocol\n\n### Scenario\n\nYou are configuring a dial-up connection for a Windows\
    \ XP Professional laptop computer. The dial-up connection is used to connect to\
    \ a company remote access server. Your company policy calls for only secure authentication\
    \ to be used when connecting to the remote access server. Your task in this lab\
    \ is to configure the authentication settings for the Dial Company connection.\n\
    \n1. Edit the properties of the Dial Company connection.\n2. On the Security tab,\
    \ select the Advanced option.\n3. Click the Settings... button and configure authentication\
    \ as follows:\n   * Do not allow PAP, SPAP, or CHAP.\n   * Allow MS-CHAP v1 and\
    \ v2.\n   * Do not allow connections to older Win95 servers.\n   * Automatically\
    \ use Windows logon information if possible.\n\n## Facts & Tasks\n\nAuthentication\
    \ protocols ensure that remote users have the necessary credentials for remote\
    \ access. Each protocol includes different levels of protection to safeguard login\
    \ credentials. As a rule, always implement the highest level of authentication\
    \ possible.\n\n## Steps\n\n1. Open the Control Panel.\n2. Select the option to\
    \ create network Internet connections.\n3. Select the option to view network connections.\n\
    4. Locate and select the appropriate network connection's properties.\n5. Select\
    \ the tab that will allow you to view Advanced (Custom Settings).\n\n6. Select\
    \ the Advanced (Custom Settings).\n\n+   * Which option did you select?\n\n7.\
    \ Select the button allowing you to view the settings.\n\n+   * Which button did\
    \ you select?\n\n8. Check or uncheck the authentication protocols as necessary.\n\
    \nCheck the necessary authentication protocols in the following table, as you\
    \ complete this step.\n\n| X | Protocol or Setting |\n|---|---|\n| | Unencrypted\
    \ password (PAP) |\n| | Shiva password authentication protocol (SPAP) |\n| | Challenge\
    \ handshake authentication protocol (CHAP) |\n| | Microsoft CHAP (MS-CHAP) |\n\
    | | Allow older MS-CHAP versions for Windows servers |\n| | Microsoft CHAP version\
    \ 2 (MS-CHAP v2) |\n| | Use my Windows logon name and password (and domain if\
    \ any) |\n\n9. Exit the Advanced Security Settings window.\n\n10. Exit the Dial\
    \ Company Properties window.\n\n## 10.4.7 Configure a VPN Connection\n\n### Scenario\n\
    \nYou are configuring network connections for a portable Windows XP Professional\
    \ computer. You want to let this computer connect to your company network remotely\
    \ over a VPN connection.\n\nYour task in this lab is to create a VPN connection\
    \ that connects to your company's VPN remote access server. Configure the VPN\
    \ connection with the following properties:\n\n- Connection Name/Company Name\
    \ = Company VPN\n- Internet Connection to Automatically Use = Dial Internet\n\
    - VPN Server = 172.10.5.42\n\nAfter you have created the VPN connection, the connection\
    \ will be configured to automatically detect the VPN tunneling protocol to use.\
    \ You want to require the connection to use the VPN tunneling protocol that uses\
    \ IPSec for encryption. To configure a specific VPN protocol:\n\n1. Edit the properties\
    \ of the VPN connection.\n2. On the Networking tab, change the VPN Protocol to\
    \ the appropriate protocol.\n\n> Note: In this lab you will not be able to make\
    \ the connection to test it.\n\n## Facts & Tasks\n\nIn this scenario, you create\
    \ a VPN connection to use the existing dialup connection. After creating the connection,\
    \ you need to configure it to use L2TP for the VPN tunneling protocol.\n\n## Steps\n\
    \n1. Open the Control Panel.\n2. Select the option to create network Internet\
    \ connections.\n3. Open Network Connections.\n4. Open the New Connection Wizard.\n\
    5. Start the New Connection Wizard.\n\n6. Select the option that will connect\
    \ your computer to the network and then select the button that will take you to\
    \ the next step.\n\n+- Which option did you select?\n\n7. Select the option to\
    \ create a VPN and then select the button that will take you to the next step.\n\
    \n+- Which option did you select?\n\n8. Enter the company name and select the\
    \ button that will take you to the next step.\n\n+- What did you enter?\n\n9.\
    \ Select the option to automatically dial the connection and select the button\
    \ that will take you to the next step.\n\n+- Which option did you select?\n\n\
    10. Enter the host name or IP address of the VPN access server and select the\
    \ button that will take you to the next step.\n\n+- What did you enter?\n\n11.\
    \ Exit the New Connection Wizard.\n12. View the new connection properties.\n\n\
    +   - Which option did you select?\n\n13. Select the tab used for network options.\n\
    \n+   - Which tab did you select?\n\n14. Select the VPN server type.\n\n+   -\
    \ Which menu item did you select?\n\n15. Save your changes and exit.\n\n## 11.0:\
    \ Network Protection and Availability\n\n## 11.2: Internet Security\n\n### Objectives\n\
    \n- Enable Internet Connection Firewall (ICF) for a network connection.\n- Open\
    \ a port in the ICF firewall, allowing Web communication to a computer.\n\n##\
    \ 11.2.4 Enable ICF for a Connection\n\n### Scenario\n\nYou are configuring Internet\
    \ connectivity for a small office network. All computers access the Internet through\
    \ a shared dial-up connection on a Windows Professional computer. You want to\
    \ protect the office network from malicious Internet users.\n\nYour task in this\
    \ task is to enable Internet Connection Firewall (ICF) for the Dial Internet connection\
    \ on this computer. Keep the default ICF settings.\n\n## Facts & Tasks\n\nOnce\
    \ ICF is enabled, you can configure ICF settings by executing the following steps:\n\
    \n+ In the Dial Internet Properties window, under the Advanced tab, click the\
    \ Settings... button. This opens the Advanced Settings window.\n\n+ Under the\
    \ Services tab, select any service on your local network that Internet users should\
    \ be permitted to access. If the service is provided on a different computer,\
    \ enter that computer's name or IP address, then click OK.\n\n+ If you need to\
    \ add a service that is not on the list, click Add....\n\n+ Type a description\
    \ for the service.\n\n+ Type the name or IP address of the computer providing\
    \ the service.\n\n+ Enter the external port number and type (TCP or UDP) that\
    \ the service uses for communication on the Internet.\n\n+ Enter the internal\
    \ port number and type what the service uses for communication on the private\
    \ network.\n\n+ Click OK to add the new service definition.\n\n+ Under the Security\
    \ Logging tab, select whether to log dropped packets and/or successful connections.\
    \ You can also specify the path and filename of the log file and specify a size\
    \ limit of the log file.\n\n+ Under the ICMP tab, select any incoming or outgoing\
    \ Internet Control Message Protocol (ICMP) message that should be allowed between\
    \ the local network and the Internet.\n"
  mdcn: "\n6. 选择允许从离线位置进行业务网络连接的选项，然后选择按钮进入下一步。\n\n7. 选择允许您使用调制解调器和电话线进行连接的选项，然后选择按钮进入下一步。\n\
    \n8. 输入公司名称，然后选择按钮进入下一步。\n\n+   * 你输入了什么名称？\n\n9. 输入要拨号的电话号码，然后选择按钮进入下一步。\n\n\
    +   * 你输入了什么号码？\n\n10. 选择是否让该连接对所有用户可用，然后选择按钮进入下一步。（此屏幕可能不会出现。）\n\n11. 保存更改并退出。\n\
    \n## 10.3.5 禁用网络组件\n\n## 场景描述\n\n你正在为一台运行 Windows 专业版（Windows Professional）的计算机配置网络连接。为了提高性能和安全性能，你希望确保在拨号连接上仅使用必要的网络组件。\n\
    \n你在本实验中的任务是编辑*拨号上网*（Dial Internet）连接的属性，并禁用以下组件：\n\n- 微软网络客户端 (Client for Microsoft\
    \ Networks)\n- 微软网络文件和打印机共享 (File and Printer Sharing for Microsoft Networks)\n\
    - NetWare 客户端服务 (Client Service for NetWare)\n- NWLnk IPX/SP/NetBIOS 协议\n\n##\
    \ 知识与任务\n\n如果连接是局域网（LAN），网络项目可以在“常规”选项卡下找到；否则它们在“网络”选项卡下。\n\n要禁用这些组件，请取消*拨号上网*连接属性中每个组件旁边的勾选。完成后，拨号连接应仅使用*TCP/IP*。*不要*卸载这些组件，因为这将把它们从系统和其他连接中删除。\n\
    \n为连接启用或禁用组件不会影响这些组件在其他连接上的启用或禁用。\n\n## 步骤\n\n1. 打开**控制面板**（Control Panel）。\n\
    2. 打开**网络连接**（Network Connections）。\n3. 找到相应的网络连接。\n   - 你选择了哪种连接？\n\n4. 选择显示连接项的选项卡。\n\
    \n+   * 你选择了哪个选项卡？\n\n5. 在网络组件列表中，启用或禁用你希望在此连接中使用的组件。\n\n6. 保存并退出。\n\n## 10.4:\
    \ 保护远程连接\n\n### 目标\n\n- 配置网络连接的身份验证设置。\n- 在 PC 和 VPN 远程访问服务器之间创建 VPN 连接。\n- 配置\
    \ VPN 连接自动检测使用哪种 VPN 隧道协议。\n\n## 10.4.3 配置身份验证协议\n\n### 场景描述\n\n你正在为一台运行 Windows\
    \ XP 专业版（Windows XP Professional）的笔记本电脑配置拨号连接。拨号连接用于连接到公司的远程访问服务器。你的公司策略要求连接到远程访问服务器时仅使用安全身份验证。你在本实验中的任务是配置“拨号公司”（Dial\
    \ Company）连接的身份验证设置。\n\n1. 编辑“拨号公司”连接的属性。\n2. 在“安全”选项卡上，选择“高级”选项。\n3. 点击“设置...”按钮并按如下配置身份验证：\n\
    \   * 不允许 PAP、SPAP 或 CHAP。\n   * 允许 MS-CHAP v1 和 v2。\n   * 不允许连接到旧 Win95 服务器。\n\
    \   * 如果可能，自动使用 Windows 登录信息。\n\n## 知识与任务\n\n身份验证协议确保远程用户拥有远程访问所需的凭据。每个协议都包含不同层次的保护以维护登录凭据。根据原则，请始终实施最高级别的身份验证。\n\
    \n## 步骤\n\n1. 打开控制面板。\n2. 选择创建网络 Internet 连接的选项。\n3. 选择查看网络连接的选项。\n4. 找到并选择相应网络连接的属性。\n\
    5. 选择允许你查看“高级（自定义设置）”的选项卡。\n\n6. 选择“高级（自定义设置）。\n\n+   * 你选择了哪个选项？\n\n7. 点击允许你查看设置的按钮。\n\
    \n+   * 你选择了哪个按钮？\n\n8. 根据需要勾选或取消勾选身份验证协议。\n\n在完成此步骤时，请检查下表中必要的身份验证协议。\n\n| X\
