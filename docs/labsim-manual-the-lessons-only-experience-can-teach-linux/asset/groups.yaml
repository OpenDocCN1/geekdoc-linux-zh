    - 驱动器号 = E:\n- 文件系统格式 = NTFS\n- 卷标 = Data\n\n# Facts与任务\n\n在本次实验中，你需要使用计算机所有的未分配磁盘空间创建一个\
    \ RAID-5 卷。RAID-5 卷在参与 RAID-5 卷的所有磁盘上均匀分布数据以及校验（（容错）信息。只要磁盘不故障，RAID-5 卷就具有良好的读取性能。然而，写入数据需要更长时间，因为必须首先计算数据校验信息。如果\
    \ RAID-5 卷中的单块磁盘故障，卷仍然可以访问，因为可以使用校验信息来重建任何丢失的数据。但是，如果两块磁盘故障，整个 RAID-5 卷也将失效。\n\
    \n使用“新建卷向导”创建 RAID-5 卷。在此场景中，请选择所有磁盘参与新卷（RAID-5 卷至少需要三块磁盘）。\n\n"
