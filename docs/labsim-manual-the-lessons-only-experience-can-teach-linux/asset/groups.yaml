    * Configure the default gateway address according to the information in the network\
    \ diagram.\n* Configure the DNS server addresses as follows:\n  * Use the DNS\
    \ server on the local network as the preferred server.\n  * Use the DNS server\
    \ on the Internet as the alternate DNS server.\n\n# Facts & Tasks\n\nSome useful\
    \ facts about network addressing can be found in the table below.\n\n| Address\
    \ Type | Description |\n| IP Address | Four 8-bit numbers, from 0 to 255, each\
    \ separated by dots.\nFirst portion of number is network address.\nLast portion\
    \ of number is host address.\nAddress class determines the network and host portions\
    \ of the address.\nA Class C address:\n* Is the most likely to have an IP address\
    \ available for assignment.\n* Has the first octet from 192 to 223.\n* Has the\
    \ first three octets defining the network.\n* Has the last octet defining the\
    \ host. |"
  - "[PAGE 76]\n\n| Address Type | Description |\n| --- | --- |\n| Subnet Mask | Identifies\
    \ which portion of the IP address is the network address. Two devices on the same\
    \ network must be configured with the same network mask. Default subnet masks\
    \ for the first three classes are as follows:\n* Class A: 255.0.0.0\n* Class B:\
    \ 255.255.0.0\n* Class C: 255.255.255.0 |\n| Default Gateway | Identifies the\
    \ router to which packets for remote networks are sent. The default gateway address\
    \ is the IP address of the interface on the same subnet as the local host. Without\
