    \ 192.168.1.254。\n   - 为什么这些测试成功了？\n5. 从 Wrk2 ping Wrk3。尝试 ping 路由器接口 192.168.2.254。\n\
    \   - 为什么这些测试失败了？\n6. 从 Wrk1 开始，使用命令 `tracert 192.168.2.1` 跟踪 Wrk1 和 Wrk3 之间的路径。\n\
    \   - Wrk1 和 Wrk3 之间的路径中出现了哪些地址？\n   - 为什么路径中没有出现交换机的地址？\n7. 从 Wrk3 开始，输入 `tracert\
    \ 192.168.1.1` 跟踪到 Wrk1 的路径。\n   - 此路径与你上一步发现的路径有什么不同？\n8. Switch2 未设置 IP 地址。从\
    \ Wrk3 ping Wrk1。\n   - 为什么即使交换机没有 IP 地址，这个测试仍然成功了？\n\n## 12.2.5 查找路径信息 1\n\n\
