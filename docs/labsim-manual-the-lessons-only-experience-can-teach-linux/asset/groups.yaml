    \ characteristics of different type fiber optic cable connectors as you complete\
    \ this step of the lab. (Ensure that you are describing the connector housing,\
    \ not the port.)\n\n| Connector | Shape (rectangular or rounded) | Configuration\
    \ (single or combined) |\n|---|---|---|\n| ST | | |\n| SC | | |\n| LC | | |\n\
    | MT-RJ | | |\n\n+ 2. Locate the correct cable on the shelf and drag the appropriate\
    \ connector to the appropriate port on the NIC in the computer. The remaining\
