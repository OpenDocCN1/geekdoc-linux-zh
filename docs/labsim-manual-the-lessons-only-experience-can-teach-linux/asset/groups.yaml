    \ an IP address set. From Wrk3, ping Wrk1. Why does this test succeed even though\
    \ the switch does not have an IP address?\n\n## Facts & Tasks\n\nThere are several\
    \ tasks you can perform to troubleshoot connectivity problems. Often the best\
    \ place to start in troubleshooting a problem is to ping the host you are trying\
    \ to contact. If you cannot contact a specific remote host, try pinging another\
    \ host in the same remote network. If successful, then the problem is with the\
