    \ (Note: This is not the default mask.)\n- Default gateway = 10.1.254\n- DNS server\
    \ addresses = 10.1.1, 10.1.2 (use this order)\n\n## Facts & Tasks\n\nIP, Subnet\
    \ Mask, Default Gateway, and DNS addresses can be manually assigned in the Internet\
    \ Protocol (TCP/IP) Properties window.\n\n### Steps\n\n- 1. Open the Control Panel.\n\
    - 2. Open Network Connections.\n- 3. View Properties for the Local Area Connection\
