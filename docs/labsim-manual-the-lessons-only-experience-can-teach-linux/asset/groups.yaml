  mdcn: "\n\n## 2.4: USB 和 Firewire\n\n目标\n\n- 识别 USB 接口、端口和电缆。\n- 通过 USB 将组件连接到计算机。\n\
    - 使用 USB 将两台 PC 连接到简单的网络。\n\n## 2.4.3 连接 USB 设备\n\n### 场景\n\n你已经在家里安装了无线网络。然而，你拥有一台不具备无线功能的旧笔记本电脑。为了让笔记本电脑连接到家里的无线网络，你购买了一个\
    \ USB 无线网卡。将 USB 无线网卡插入电脑上相应的插槽。\n\n### 知识与任务\n\n有多种类型的 USB 接口。最常见的是 Type A 类型。USB\
    \ 接口（或端口）始终可以通过下方显示的 USB 标志来识别。\n\n![](img/ec83bdece8c967d0c687b6a13db22bc0_32_0.png)\n\
    \n### 步骤\n\n1. 1. 要将 USB 无线网卡连接到笔记本电脑，将网卡从**Shelf（货架）**拖动到笔记本电脑背面的 USB 端口。\n \
    \ * 是否有多个端口可供 USB 无线网卡连接？\n  * 笔记本电脑上还有哪种高速串行数据端口？\n\n## 2.4.4 连接背对背计算机\n\n###\
    \ 场景\n\n你买了一台新电脑，但你仍然想在旧电脑上访问某些文件。与其将文件拷贝到可移动介质，你希望能够根据需要访问计算机硬盘的选项。你知道可以通过 USB\
    \ 电缆直接连接两台电脑，从而创建一个简单的网络。\n\n选择正确的电缆并将两台电脑连接在一起。\n\n### 知识与任务\n\n常见的 USB 接口显示所示。\n\
    \n![](img/ec83bdece8c967d0c687b6a13db22bc0_33_0.png)\n\n通过连接专为此目的设计的电缆，可以创建一个允许两台\
    \ PC 通信的简单网络。这种连接类型通常被较新的操作系统支持。\n\n### 步骤\n\n1. 1. 在**Shelf（货架）**上，找到并选择合适的电缆。\n\
    \   - 你选择的连接两台 PC 的电缆名称是什么？\n\n2. 2. 将电缆的一个连接器拖到第一台电脑上相应的端口。另一个连接器将移动到 Workbench\
    \ Connections（工作台连接）。\n   - PC 上的什么种类型的端口符合你选择的电缆？\n\n3. 3. 将 Workbench Connections\
    \ 中剩余的连接器拖到第二台电脑上相应的端口。\n\n## 3.0: 网络设备\n\n## 3.1: 网络适配器\n\n**目标**\n\n- 区分调制调器（Modem）和网卡之间的差异。\n\
    - 识别常见调制调器和网接口卡（NIC）的各种功能。\n- 根据功能选择合适的调制调器或网卡。\n- 识别用于调制调器和网络连接的接口和端口。\n- 通过\
    \ PSTN 将 PC 连接到互联网。\n- 访问并识别网络连接的状态和属性。\n- 禁用网络连接。\n\n### 3.1.6 选择并安装网络适配器\n\n\
    ### 场景\n\n你希望以最快的速度通过 PSTN（公共用用电话网）将计算机连接到互联网。\n\n完成以下任务：\n\n- 选择速度最快的用于连接 PSTN\
    \ 的正确扩展卡。\n- 选择相应的电缆并将计算机连接到 PSTN。\n\n### 知识与任务\n\n下方列出了用于计算机联网的一些典型扩展卡：\n\n-\
    \ 以太网网卡 (Ethernet NIC)：连接到以太网。\n- 令牌环网卡 (Token Ring NIC)：连接到令牌环网络。\n- 调制调器 (Modem)：连接电话线与远程计算机通信。\n\
    - ISDN 网卡 (ISDN NIC)：通过 ISDN 网络进行主机到主机连接。\n\n### 步骤\n\n1. 1. 点击 Workbench 工具栏上的\
    \ **Motherboard** 按钮切换到主板视图。\n2. 2. 在**Shelf（货架）**上，找到并选择合适的扩展卡。\n\n在进行实验时完成下表。\n\
    \n**注意：** 当你重新启动实验时，扩展卡组将随机分布。如果你退出并重启实验，正确的扩展卡可能会出现在不同的位置。\n\n#### 组编号 | 卡片类型\
    \ | 端口（数量和类型） | 信号电平 |\n|---|---|---|---|\n| 组 1 | | | |\n| 组 2 | | | |\n| 组 3\
    \ | | | |\n| 组 4 | | | |\n| 组 5 | | | |\n| 组 6 | | | |\n\n3. 3. 将合适的卡片拖到主板上相应的空插槽。\n\
    \   - 你将卡片插入了什么种类型的插槽？\n4. 4. 点击 **Workbench** 工具栏上的 **Back** 按钮切换到背面视图。\n5. 5.\
    \ 点击 **Cables** 旁边的箭头展开 **Shelf（货架）** 上的 **Cables** 组。\n6. 6. 找到并选择合适的电缆连接器。\n\
    \   - 什么种类型的连接器符合你选择的卡片中的端口？\n7. 7. 将连接器拖到相应的端口。另一个连接器将移动到 Workbench Connections。\n\
    \   - 卡片中未使用的端口起什么功能？\n8. 8. 将 Workbench Connections 中的连接器拖到相应的墙上插座。\n   - 卡片中未使用的端口起什么功能？\n\
    \n"
