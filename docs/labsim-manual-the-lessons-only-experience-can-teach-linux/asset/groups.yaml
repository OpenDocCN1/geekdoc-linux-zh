    \  - Click **OK** to add the new service definition.\n\nOn the Security Logging\
    \ tab, select whether to log dropped packets and/or successful connections. You\
    \ can also specify the path and file name of the log file and specify a size limit\
    \ of the log file.\n\nOn the ICMP tab, select any incoming or outgoing Internet\
    \ Control Message Protocol (ICMP) message that should be allowed between the local\
    \ network and the Internet.\n\nTo complete this task, you must edit the ICF settings\
    \ for the broadband connection (click the **Settings...** button on the Advanced\
    \ tab). Allow Web (HTTP) communications.\n\n# Steps\n\n1. Open the **Control Panel**.\n\
    2. Open **Network Connections**.\n3. Locate the appropriate network connection.\n\
    \   - Which connection did you select?\n4. Display the network connection's properties.\n\
    5. Locate and select the Broadband Internet properties window tab which displays\
    \ the Internet firewall settings.\n   - Which tab did you select?\n6. Enable,\
    \ if not already enabled, the Internet Connection Firewall.\n   - Which option\
    \ did you select (if applicable)?\n7. Select the button that will allow you to\
    \ configure Internet settings.\n   - Which button did you select?\n   - Which\
    \ window opened?\n8. Select the option that will open a port in the ICF, allowing\
    \ communication between the Internet and computer (LA-CORP-WRK3).\n   - Which\
    \ option did you select?\n   - What window opened?\n9. Accept the changes and\
    \ exit all of the open windows.\n\n## 11.5: Disaster Prevention and Recovery\n\
    \nObjectives\n\n- Create a new volume allocating space as necessary on multiple\
    \ disks.\n- Create a RAID-5 volume.\n\n## 11.5.4 Create a Mirrored Volume\n\n\
    # Scenario\n\nYou have been asked to configure storage space on the server for\
    \ the Marketing department. Because the data is important to the company, you\
    \ have been asked to configure fault tolerance for the new storage space.\n\n\
    You have installed a new hard drive. Create a new volume using all of the space\
    \ on Disk 1 and necessary space on Disk 2 as follows:\n\n- Volume type = Mirrored\n\
    - Volume size = 20000 MB\n- Drive letter = M:\n- Format = NTFS\n- Volume label\
    \ = Marketing\n\n# Facts & Tasks\n\nWhen selecting additional disks to participate\
    \ in a mirrored volume, click **Add**. (You can also use the **Remove** or **Remove\
    \ All** buttons to remove selected disks.) The amount of disk space you specify\
    \ will be used on both disks to create the mirrored disk. You can also mount the\
    \ new volume as a folder or create it without assigning a drive letter or drive\
    \ path.\n\nIf you want to format the new volume while creating it, select the\
    \ following file system properties (otherwise, select **Do not format this partition**):\n\
    \n- File System\n- File allocation unit size (In most cases, you should accept\
    \ the default size.)\n- Volume label.\n\n# Steps\n\n1. Open the Computer Management\
    \ preconfigured MMC console by selecting the option to manage **My Computer**.\n\
    \   - Which mouse button did you use to access the drop-down menu?\n2. Navigate\
    \ from Storage to Disk Management.\n3. Locate unallocated space on a dynamic disk\
    \ that will participate in the new volume, then select New Volume... from the\
    \ menu.\n   - Which mouse button did you use to access the drop-down menu?\n4.\
    \ Start the New Volume Wizard.\n   - Which button did you select to start the\
    \ New Volume Wizard?\n5. Select the appropriate volume type, then select the button\
    \ to continue.\n   - Which volume type did you select?\n6. From the list of Available,\
    \ add any additional disks that will participate in the volume.\n   - Which dynamic\
    \ disk did you select?\n   - Which button did you select?\n7. If necessary, type\
    \ the amount of the space to be used for the new volume, then select the button\
    \ to continue.\n8. Select the appropriate drive letter, then select the button\
    \ to continue.\n9. Perform a quick format or Enable folder compression, if desired.\
    \ Then select the button to continue.\n10. Finish the partition and exit.\n\n\
    ## 11.5.5 Create a RAID-5 Volume\n\n# Scenario\n\nYou are preparing the hard disk\
    \ configuration for a new Windows Server 2003 computer. You want to create a single\
    \ volume named Data. You want to choose a volume type that maximizes read performance\
    \ and provides fault tolerance.\n\nYour task in this lab is to create a RAID-5\
    \ volume as follows:\n\n- To create the volume, use all four disks. You can start\
    \ the wizard from any existing hard disk, but after selecting the volume type,\
    \ add all disks to the list of use.\n- Make the volume as large as possible. It\
    \ will consume all of the hard disk capacity.\n- Drive letter = E:\n- File system\
    \ format = NTFS\n- Volume label = Data\n\n# Facts & Tasks\n\nIn this lab, you\
    \ need to create a RAID-5 volume using all of the computer's unallocated disk\
    \ space. A RAID-5 volume evenly distributes data along with parity (fault tolerance)\
    \ information across all disks participating in the RAID-5 volume. RAID-5 volumes\
    \ have good read performance as long as a disk does not fail. However, it takes\
    \ longer to write data parity information must first be calculated. If a single\
    \ disk in a RAID-5 volume fails, the volume is still accessible because parity\
    \ information can be used to reconstruct any lost data. However, if two disks\
    \ fail, the entire RAID-5 volume will also fail.\n\nCreate a RAID-5 volume using\
    \ the Create Volume Wizard. For this scenario, select all disks to participate\
    \ in the new volume (RAID-5 volumes require at least three disks).\n"
