    \ you enter to add it to the user account?\n+ - Which button would you select\
    \ to remove a group to this user account?\n\n**Note:** To add a group, click **Add...**.\
    \ Type the name of the local group, or click **Advanced...** then **Find Now**\
    \ to select from a list of local groups. Then click **OK**.\n\n## 9.2.8 Create\
    \ a Domain User\n\n### Scenario\n\nYou are a network administrator for your company.\
    \ Your company has a single Active Directory domain named westsim.private. You\
    \ are responsible for creating and maintaining user accounts in the domain.\n\n\
    A new employee named Sally Smith has joined your company as a Sales employee.\n\
    \nUse Active Directory Users and Computers to create a new domain user account\
    \ as follows:\nIn this lab, use Active Directory Users and Computers to create\
    \ a user account with the following values:\n\n- User account context = Create\
    \ the user in the Sales OU\n- First Name = Sally\n- Initials = [None]\n- Last\
    \ Name = Smith\n- Full Name = Sally Smith\n- Logon Name = ssmith\n- UPN Suffix\
    \ = westsim.private\n- Pre-Windows 2000 Logon Name = ssmith\n- Password = sallysmith\n\
    - User must change password at next logon = Enabled (keep all other account options\
    \ disabled).\n\n### Facts & Tasks\n\nA description or details about some of the\
    \ steps listed below are as follows:\n\n**User Logon Name and UPN Suffix:** This\
    \ step is required and is the name the user will use to log on the domain. Also\
    \ known as the user principal name (UPN). You may select a different UPN suffix,\
    \ if necessary and if available.\n\n**User Logon Name (Pre-Windows 2000):** A\
    \ user logon name that is backwards compatible with Windows NT domains. By default,\
    \ the first 15 characters of the user logon name are used, but this can be changed\
    \ if necessary.\n\n**User must change password at next logon:** This option is\
    \ not available if either of the next two options are selected. Also, the next\
    \ two options cannot be selected if this option is selected.\n\n### Steps\n\n\
    + 1. Select Administrative Tools.\n2. Select Active Directory Users and Computers.\n\
    3. In Active Directory Users and Computers, navigate to and select the domain,\
    \ OU (Organizational Unit), or other container in which the user account needs\
    \ to be created (the user account context).\n   * Which side of the window did\
    \ you find the appropriate domain, OU (Organizational Unit), or other container?\n\
    \   * Did you select the domain, OU (Organizational Unit), or other container\
    \ by clicking, double-clicking, or right-clicking it?\n4. Now add a new user.\n\
    \   * After the last step, does a window or pop-up menu display?\n   * Which selection\
    \ did you choose?\n   * After choosing New, which selection did you choose?\n\n\
    5. Type the following values for the new user:\n\n- First Name\n- Initials\n-\
    \ Last Name\n- Full Name (Required and composed from above values, by default.)\n\
    - User Logon Name and UPN Suffix\n- User Logon Name (Pre-Windows 2000)\n\n6. Select\
    \ the choice to continue.\n\n+ * Which button did you select?\n\n7. Type the user\
    \ account's initial password and confirm it.\n8. Enable or disable account options\
    \ such as the following, if desired, then exit:\n\n- User must change password\
    \ at next logon\n- User cannot change password\n- Password never expires\n- Account\
    \ is disabled\n\n9. Select the choice to finish.\n\n## 9.3 Windows Resources\n\
    \n### Objectives\n\n- Map a drive to a folder on computer.\n- Configure, on a\
    \ computer, a Local LPT1 printer to be shared.\n- Publish a shared printer to\
    \ Active Directory.\n- Configure a folder for sharing.\n- Add local user groups\
    \ to the trustee list.\n- Modify local group's NTFS permissions.\n\n## 9.3.2 Map\
    \ Drive\n\n### Scenario\n\nYou are configuring the file system of a Windows XP\
    \ Professional computer. You want to map a drive on this computer to a shared\
    \ folder on the network.\n\nYour task in this lab is to map the N: drive to the\
    \ Projects shared folder on the NY-DEV-WRK3 computer (The NY-DEV-WRK3 computer\
    \ is part of the Westsim.Private domain.) Make sure the drive mapping is persistent,\
    \ so you do not need to establish the drive mapping manually.\n\n### Facts & Tasks\n\
    \nTo open Windows Explorer in Folder view (showing a hierarchy of objects and\
    \ folders), right-click My Computer and select Explore.\n\nYou can open Windows\
    \ Explorer focused on other objects (My Network Places, My Documents, and so forth)\
    \ using the same steps (right-click the object and Open). You can toggle the Folder\
    \ view on and off using the Folders button in Windows Explorer.\n\nOpen the Map\
    \ Network Drive dialog in any of the following:\n\n- Select Map Network Drive...\
    \ from the Tools menu.\n- Right-click My Computer and select Map Network Drive....\
    \ (This option is also available when right-clicking My Computer in the Start\
    \ menu.)\n- Right-click My Network Places and select Map Network Drive.... (This\
    \ option is also available when right-clicking My Network Places in the Start\
    \ menu.)\n- Browse My Network Places, right-click a shared folder, and select\
    \ Map Network Drive...\n\nType the UNC path to a shared folder using the format\
    \ \\server_name\\share_name. Or click the Browse button and select a shared folder.\
    \ (Skip this step if you opened the Map Network Drive dialog by right-clicking\
    \ a shared folder and selecting Map Network Drive.... This step will be completed\
    \ for you automatically.)\n\nEnable the Reconnect at logon option if you want\
    \ the drive mapping to be restored each time you log on. Otherwise, you will need\
    \ to recreate the drive mapping manually after logging off.\n\n### Steps\n\n+\
    \ 1. View My Computer in Folder view.\n  * How did you get My Computer to display\
    \ in Folder view?\n\n+ 2. Open the Map Network Drive dialog.\n  * Which method\
    \ did you use to open the Map Network Drive dialog?\n\n+ 3. In the Map Network\
    \ Drive dialog, select a drive letter from the Drive drop-down list.\n  * Which\
    \ drive letter did you select?\n\n+ 4. Enter the UNC path to a shared folder.\n\
    \  * Which method did you use to enter the UNC path to a shared folder?\n\n+ 5.\
    \ Enable the Reconnect at logon option.\n\n+ 6. Close the window.\n"
  mdcn: "\n\n## 9.2.5 修改组成员身份\n\n### 场景\n\n你正在管理一台属于工作组的 Windows XP 专业版计算机。该计算机的用户\
    \ Sue Bagley 目前是 Users（用户）本地组的成员。你希望向 Sue 委托某些管理任务，例如安装大多数应用程序以及管理本地用户和组。\n\n\
    你在实验中的任务是将 Sue Bagley 的用户账户 (sbagley) 添加到 Power Users（高级用户）本地组。\n\n### 知识点与任务\n\
    \n如果计算机是域成员，你可以从控制面板的“用户帐户”面板打开“本地用户和组”get。点击“高级”选项卡。然后点击“高级用户管理”标题下的“高级”按钮。\n\
    \n### 步骤\n\n+ 1. 打开**计算机管理**窗口。\n2. 展开**本地用户和组**。\n   - 在右列或左列中找到**本地用户和组**吗？\n\
    3. 选择**高级用户**。\n   - **高级用户** 位于哪个文件夹中？\n   - 使用哪个鼠标键可以访问**高级用户**菜单？\n\n**注意：**\
    \ 将本地用户账户添加到本地组的另一种方法是选择用户而不是组。\n\n+ 4. 从菜单中选择**添加到组**。\n\n5. 将 Sue Bagley 的本地用户账户添加到\
    \ Power Users 本地组。\n\n+ - 你选择了哪个按钮来添加新用户账户？\n+ - Sue Bagley 的本地用户账户名是什么？\n\n6.\
    \ 保存更改并退出。\n\n+ - 是否必要选择“检查名称”选项？\n+ - 是否必要选择“应用”按钮？\n\n通过编辑用户帐户将本地用户账户添加到本地组。\n\
    \n+ 1. 完成上述步骤 1 和 2。\n+ 2. 选择用户（users）文件夹。\n\n+ - 你会选择哪个文件夹来编辑本地用户账户？\n3. 访问本地用户的“属性”。\n\
    \n+ - 你使用哪个鼠标键来访问本地用户的“属性”？\n\n## 4. 按照以下步骤添加或删除用户帐户所属的组：\n\n+ - 你选择了哪个选项卡来为此用户帐户添加组？\n\
    + - 你选择了哪个按钮来为此用户帐户添加组？\n+ - 你输入了哪个本地组名称以将其添加到用户帐户？\n+ - 你会选择哪个按钮从此用户帐户中删除组？\n\
    \n**注意：** 要添加组，点击**添加...**。输入本地组的名称，或点击**高级...**然后点击**立即查找**从本地组列表中进行选择。然后点击**确定**。\n\
    \n## 9.2.8 创建域用户\n\n### 场景\n\n你是你公司的网络管理员。你的公司有一个名为 westsim.private 的单一 Active\
    \ Directory 域。你负责在域中创建和维护用户帐户。\n\n一位名为 Sally Smith 的新员工已加入公司担任销售员。\n\n使用 Active\
    \ Directory 用户和计算机按照如下步骤创建一个新的域用户帐户：\n在此实验中，使用 Active Directory 用户和计算机创建一个具有以下值的用户帐户：\n\
    \n- 用户帐户上下文 = 在 Sales OU 中创建用户\n- 名字（First Name） = Sally\n-set（Initials） = [无]\n\
    - 姓（Last Name） = Smith\n- 全名 = Sally Smith\n- 登录名 = ssmith\n- UPN 后缀 = westsim.private\n\
    - Windows 2000 之前的登录名 = ssmith\n- 密码 = sallysmith\n- 用户必须在下次登录时更改密码 = 已启用（禁用所有其他帐户选项）。\n\
    \n### 知识点与任务\n\n下列出的某些步骤的说明或详情如下：\n\n**用户登录名和 UPN 后缀：** 此步骤是必须的，它是用户登录域时将使用的名称。也称为用户主体名称\
    \ (UPN)。如果必要且可用，你可以选择不同的 UPN 后缀。\n\n**用户登录名（Windows 2000 之前的）：** 一个与 Windows NT\
    \ 域向后兼容的用户登录名。默认情况下，使用用户登录名的前 15 个字符，但必要时可以进行更改。\n\n**用户必须在下次登录时更改密码：** 如果选择了以下两个选项中的任何一个，则此选项不可用。同样，如果选择了此选项，则无法选择后两个选项。\n\
    \n### 步骤\n\n+ 1. 选择管理工具。\n2. 选择 Active Directory 用户和计算机。\n3. 在 Active Directory\
    \ 用户和计算机中，导航并选择需要创建用户帐户的域、OU（组织单元）或其他容器（用户帐户上下文）。\n   * 你在窗口的哪一侧找到相应的域、OU（组织单元）或其他容器？\n\
    \   * 你是通过点击、双击还是右键点击来选择域、OU（组织单元）或其他容器的？\n4. 现在添加新用户。\n   * 在上一步之后，是否显示了窗口或弹出菜单？\n\
    \   * 你选择了哪个候选项？\n   * 在选择“新建”后，你选择了哪个候选项？\n\n5. 为新用户输入以下值：\n\n- 名字（First Name）\n\
    - 缩写（Initials）\n- 姓（Last Name）\n- 全名（Full Name）（必填，且默认由上述值组成）\n- 用户登录名和 UPN 后缀\n\
    - 用户登录名（Windows 2000 之前的）\n\n6. 选择继续选项。\n\n+ * 你选择了哪个按钮？\n\n7. 输入用户帐户的初始密码并进行确认。\n\
    8. 如果需要，启用或禁用如下帐户选项，然后退出：\n\n- 用户必须在下次登录时更改密码\n- 用户不能更改密码\n- 密码永期不设期\n- 帐户已禁用\n\
    \n9. 选择完成选项。\n\n## 9.3 Windows 资源\n\n### 目标\n\n- 将驱动器映射到计算机文件夹。\n- 在计算机上共享 LPT1\
    \ 打印机。\n- 在 Active Directory 中发布共享打印机。\n- 对共享进行配置。\n- 将本地组添加到列表。\n- 修改本地组的 NTFS\
    \ 权限。\n\n## 9.3.2 映射驱动器\n\n### 场景\n\n你正在配置 Windows 专业版计算机的文件系统。你想将计算机上的驱动器映射到网络共享文件夹。\n\
    \n你在实验中的任务是将 N: 驱动器映射到 Projects 共享文件夹（NY-DEV-WRK3计算机属于 Westsim.Private 域）。确保映射是持久的，这样你就不需要手动建立映射了。\n\
    \n### 知识点与任务\n\n要以文件夹视图打开资源管理器，请右键点击“计算机”并选择“打开”。\n\n可以使用相同的步骤（右键点击对象并打开）打开其他对象（网络位置、文档等）。你可以使用资源管理器中的“文件夹”按钮切换文件夹视图。\n\
    \n通过以下任一方法打开映射驱动器对话框：\n\n- 从“工具”菜单选择“映射驱动器...”。\n- 右键点击“计算机”并选择“映射驱动器...”（此选项在开始菜单中右键点击计算机时也可用）。\n\
    - 右键点击“网络位置”并选择“映射驱动器...”（此选项在开始菜单中右键点击网络位置时也可用）。\n- 浏览“网络位置”，右键点击共享文件夹并选择“映射驱动器...”。\n\
    \n使用 `\\服务器名\\共享名` 格式输入 UNC 路径。或点击“浏览”按钮并选择共享文件夹。（如果你通过右键点击共享文件夹并选择“映射驱动器...”来打开对话框，则此步骤将为你自动完成。）\n\
    \n如果你希望每次登录时都恢复驱动器映射，请启用“登录时连接”选项。否则，你需要在注销后重新创建驱动器映射。\n\n### 步骤\n\n+ 1. 以文件夹视图查看计算机。\n\
    \   * 你是如何让“计算机”以文件夹视图显示的？\n\n+ 2. 打开映射驱动器对话框。\n   * 你使用什么种方法打开映射驱动器对话框？\n\n+\
    \ 3. 在映射驱动器对话框中，从驱动器下拉列表中选择一个驱动器号。\n   * 你选择了哪个驱动器号？\n\n+ 4. 输入共享文件夹的 UNC 路径。\n\
    \   * 你使用什么种方法输入共享文件夹的 UNC 路径？\n\n+ 5. 启用“登录时连接”选项。\n\n+ 6. 关闭窗口。\n\n"
