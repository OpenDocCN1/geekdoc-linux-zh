    \ to the remaining jack in the wall outlet.\n"
  mdcn: "\n\n## 2.1.4 连接到以太网网络\n\n场景描述\n\n你的主管要求你在新员工参加入职培训期间，将其计算机连接到网络。\n\n使用双绞线将计算机连接到以太网局域网\
    \ (LAN)。\n\n事实与任务\n\n以太网网络使用带有 RJ-45 接口的双绞线。RJ-45 接口有 8 根线，且比 RJ-11 接口大。\n\n步骤\n\
    \n+ 1. 找到并选择用于连接计算机到以太网局域网的电缆。\n    * 可选电缆中有多少是双绞线？\n    * 列出双绞线上的连接接口类型：\n  \
    \  * 这些接口中哪一个用于以太网？\n\n+ 2. 从**货架**(Shelf) 拖动连接器到计算机上相应的端口。完成后，电缆的另一端将移动到“工作台连接”(Workbench\
    \ Connections)。\n\n+ 3. 将“工作台连接”中的连接器拖到网络端口。\n\n## 2.2: 同轴\n\n目标\n\n- 识别电缆调制解调器、端口和电缆。\n\
    - 通过电缆调制解调器及其接口、端口和电缆将 PC 连接到互联网。\n\n## 2.2.3 连接电缆调制解调器 1\n\n场景描述\n\n你最近搬到了新区域，那里有缆公司提供的宽带服务。为了避免支付高昂安装费用，你选择自己安装调制器。将电缆调制解调器连接到你的计算机和墙上插座。\n\
    \n事实与任务\n\n下表列出了某些用于此类互联网连接的接口。\n\n| 连接器 | 事实 |\n| --- | --- |\n| Ethernet RJ-45\
    \ | 主要用于以太网 LAN 连接；将电缆调制解调器连接到 PC |\n| USB Type A | 用于连接两台 PC；主要将 PC 连接到设备，如电缆调制解调器\
    \ |\n| USB Type B | 大多数带有 B 接口的 USB 线另一端是 A 接口；用于将设备连接到 USB 集线器 |\n| Coaxial Type\
    \ F | 主要用于电缆和卫星电视连接；用于将电缆调制解调器接入宽带缆连接 |\n\n## 步骤\n\n+ 1. 在**货架**(Shelf) 上，找到并选择合适的电缆将电缆调制解调器连接到墙上插座。\n\
    \    - 列出电缆调制解调器和墙上插座上提供互联网连接的端口类型：\n\n+ 2. 将合适电缆的一端拖到墙上插座的相应端口。（电缆的另一端将移动到“工作台连接”区域。）\n\
    \n+ 3. 将**工作台连接**区域中的电缆末端拖到电缆调制解调器的相应端口。\n\n+ 4. 在**货架**(Shelf) 上，找到并选择合适的电缆将电缆调制解调器连接到\
    \ PC。\n    - 列出电缆调制解调器和 PC 上剩余的可连接的端口类型：\n\n+ 5. 将合适的连接器拖到电缆调制解调器的相应端口。连接器将移动到“工作台连接”。\n\
    \n+ 6. 将连接器从**工作台连接**拖到计算机上相应的端口。\n\n## 2.2.4 连接电缆调制解调器 2\n\n场景描述\n\n你正在帮助一个朋友使用她最近购买的电缆调制解调器连接互联网。你决定用以太网线将电缆调制解调器连接到计算机。你上线并在**货架**上列出的电缆。选择并连接必要的电缆完成连接。\n\
    \n事实与任务\n\n网卡 (NIC) 为表中列出的三种连接器各提供端口。\n\n| 连接器 | 事实 |\n| --- | --- |\n| RJ-45\
    \ ![image]() | 双绞线<br>通常用于以太网 |\n| BNC ![image]() | 同轴电缆<br>通常用于旧版以太网 |\n| AUI\
    \ ![image]() | 同轴电缆<br>通常用于旧版以太网 |\n\n**注意：**你有多种电缆可以实现这种连接，但实验要求按照特定方式进行。\n\n\
    步骤\n\n+ 1. 在**货架**(Shelf) 上，找到并选择合适的电缆将电缆调制解调器连接到墙上插座。\n    - 电缆调制解调器上有哪些类型的端口？\n\
    \    - 使用什么类型的电缆和连接器连接电缆服务？\n\n+ 2. 将电缆的一端拖到相应的墙上插座。（电缆的另一端将移动到“工作台连接”区域。）\n\n\
    + 3. 将“工作台连接”区域中的电缆末端拖到电缆调制解调器的相应端口。\n\n+ 4. 在**货架**(Shelf) 上，找到并选择合适的电缆将电缆调制解调器连接到\
    \ PC。\n    - 货架上的哪种电缆将连接电缆调制解调器和 PC？\n\n+ 5. 将电缆的一端拖到 PC 上的相应端口。另一个连接器移动到“工作台连接”。使用工作台工具栏上的放大工具并根据需要滚动以找到端口和连接器。）\n\
    \n+ 6. 将“工作台连接”中的电缆末端拖到电缆调制解调器的相应端口。\n\n## 2.3: 光纤\n\n目标\n\n- 识别不同类型的光纤连接器、端口和电缆。\n\
    - 将 PC 连接到光纤网络。\n\n## 2.3.3 连接光纤电缆 1\n\n场景描述\n\n作为公司网络技术员的首项任务是将新员工的计算机连接到你们的光纤网络。\n\
    \n注意：连接电缆时，务必将接收端口 (RX) 连接到发送端口 (TX)。\n\n事实与任务\n\n下表是常见的光纤电缆连接器。\n\n| 连接器 | 事实\
    \ |\n| --- | --- |\n| ST | 也称为推入式旋转连接器；每根线都是单芯，末端各有一个单独（或独立的）连接器 |\n| SC | 插入式、拉出式连接器类型，使用锁定卡扣维持连接；每根线都是单芯，末端各有一个单独（或独立的）连接器\
    \ |\n| LC | 由带有锁定卡扣的塑料连接器组成，类似于 RJ-45 连接器；每根线有两芯，连接到末端的两个单连接器；尺寸只有其他光纤连接器的一半 |\n\
    | MT-RJ | 由带有锁定卡扣的塑料连接器组成；使用金属导针确保对齐良好；每根线有两芯，连接到末端的两个单连接器 |\n\n通过跟踪连接到每个端口的电缆颜色，以确保安装得当。\n\
    \n![](img/ec83bdece8c967d0c687b6a13db22bc0_29.png)\n\n步骤\n\n+ 1. 找到并选择带有合适连接器的电缆。\n\
    \    - 你选择的连接器名称是什么？\n\n+ 2. 将其中一个连接器拖到墙上插座。剩余的连接器移动到“工作台连接”。使用放大工具并根据需要滚动以找到端口和连接器。）\n\
    \    - 你选择的器是什么颜色的？\n\n+ 3. 将刚刚连接的电缆另一端拖到计算机光纤卡上的相应插槽。\n\n+ 4. 将未使用电缆的一端拖到墙上插座的空插槽。\n\
    \n+ 5. 将剩余的连接器拖到计算机光纤卡的剩余插槽。\n\n## 2.3.4 连接光纤电缆 2\n\n场景描述\n\n通过选择合适的电缆将计算机连接到光纤网络。确保将发送端口连接到接收端口。\n\
    \n事实与任务\n\n光纤电缆两端的连接器不需要相同。这为连接不同类型的组件提供了灵活性。\n\n步骤\n\n+ 1. 首先检查网卡和墙面板，以识别它们各自使用的电缆类型。\n\
    \n在完成实验此步骤时，填写不同类型光纤电缆连接器的特征。（确保你描述的是连接器外壳，而不是端口。）\n\n| 连接器 | 形状（矩形或圆形） | 配置（单芯或双芯）\
    \ |\n|---|---|---|\n| ST | | |\n| SC | | |\n| LC | | |\n| MT-RJ | | |\n\n+ 2.\
    \ 在货架上找到正确的电缆，并将合适的连接器拖到计算机网卡的相应端口。剩余的连接器移动到“工作台连接”。\n\n+ 3. 将刚刚连接的电缆另一端拖到墙上插座的相应插槽。\n\
    \n+ 4. 将“工作台连接”中的合适的连接器拖到计算机光纤卡上的相应端口。\n\n+ 5. 将剩余的连接器拖到墙上插座的剩余插槽。\n\n"
