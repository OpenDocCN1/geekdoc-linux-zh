    \ IP 地址。从 Wrk3 ping Wrk1。为什么即使交换机没有 IP 地址，这个测试仍然成功了？\n\n## 知识点与任务\n\n你可以执行若干任务来故障排除连接性问题。通常，故障排除问题的最佳起点是\
