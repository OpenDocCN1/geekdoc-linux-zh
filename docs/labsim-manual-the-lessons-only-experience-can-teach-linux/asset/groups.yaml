    \n+ * 你使用了哪种子网掩码？____ * ____ * ____\n\n9. 要将数据路由到另一个子网，输入默认网关地址。\n\n+ * 在哪里可以网络网关？\n\
    \n+ * 你输入了什么？____ * ____ * ____\n\n10. 输入首选 DNS 服务器地址。\n\n+ * 主 DNS 服务器应该在你的网络内部还是外部外部？\n\
    \n+ * 你输入了什么？____ * ____ * ____\n\n11. 输入备用 DNS 服务器地址。\n\n+ * 备用 DNS 服务器应该在你的网络内部还是外部？\n\
    \n+ * 你输入了什么？____ * ____ * ____\n\n12. 关闭所有窗口以保存更改。\n\n13. 再次点击确定关闭“Internet 协议\
    \ (TCP/IP)”属性对话框。\n14. 再次点击确定关闭网络连接的属性。\n\n## 8.0: IP 服务\n\n## 8.1: 域名解析\n\n###\
    \ 目标\n\n- 配置 TCP/IP 协议以访问多个 DNS 服务器。\n- 配置 TCP/IP 协议以访问多个 WINS 服务器。\n\n## 8.1.7\
    \ 配置 DNS 地址\n\n### 场景\n\n你正在为一台 Windows XP 专业版电脑配置网络连接。目前，你的网络使用手动 IP 地址设置。之前，你的网络没有使用\
    \ DNS 服务器，但最近安装了三个 DNS 服务器。\n\n你在实验中的任务是为此电脑的本地局域网连接配置 TCP/IP 协议，使用以下 DNS 服务器地址：\n\
    \n+ * 192.168.1.1（首选 DNS 服务器）\n* 192.168.2.1（第一个备用 DNS 服务器）\n* 192.168.1.3（第二个备用\
