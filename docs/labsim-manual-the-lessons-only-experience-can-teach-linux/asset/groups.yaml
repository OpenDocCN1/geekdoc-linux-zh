    \ 用户的影响。\n\n你的任务是为此计算机上的拨号上网连接启用 Internet 防墙 (ICF)。保持默认 ICF 设置。\n\n## 知识与任务\n\n\
    一旦启用 ICF，可以通过执行以下步骤配置 ICF 设置：\n\n+ 在“拨号上网”属性窗口中，在“高级”选项卡下点击“设置...”按钮。这将打开高级设置窗口。\n\
    \n+ 在“服务”选项卡下，选择允许 Internet 用户访问的本地网络服务。如果服务在其他计算机上提供，输入该计算机的名称或 IP 地址，然后点击确定。\n\
    \n+ 如果需要添加列表不存在的服务，点击“添加...”。\n\n+ 为服务输入描述。\n\n+ 输入提供服务的计算机的名称或 IP 地址。\n\n+ 输入服务在\
    \ Internet 通信时使用的外部端口和类型（TCP 或 UDP）。\n\n+ 输入服务在私有网络通信时使用的内部端口和类型。\n\n+ 点击确定添加新的服务定义。\n\
    \n+ 在“安全日志”选项卡下，选择是否记录丢弃的数据包和/成功的连接。你还可以指定日志文件的路径和文件名，并指定日志文件的大小限制。\n\n+ 在“ICMP”选项卡下，选择本地网络和\
    \ Internet 之间允许的任何入站或出站 Internet 控制消息协议 (ICMP) 消息。\n\n"
