    \    - *What did you enter?*\n\n![Properties](img/ec83dece8c967d0c687b6a13db22bc0_72_0.png)\n"
  mdcn: "\n\n## 4.1.8 连接到光纤网络\n\n### 场景\n\n你的公司刚搬到一栋办公大楼。机房已经安装了连接到墙壁的光纤。你需要将服务器连接到光纤网络。\n\
    \n选择并安装必要的组件以连接到光纤网络。\n\n## 知识与任务\n\n由于你的计算机没有光纤网卡（NIC）来与光纤网络进行通信，你需要一个设备来转换光纤信号。\n\
    \n## 步骤\n\n- 1. 在**架子（Shelf）**上找到用于 PC 和光纤网络桥接的合适设备，并将其拖到**工作台（Workbench）**。\n\
    \n在执行实验室此步骤时，请完成下表。\n\n| 设备类型 | 端口（数量/类型） | 网络类型 |\n|---|---|--|\n| | | |\n| |\
    \ | |\n| | | |\n\n- 2. 打开**架子**上的**电缆（Cables）**菜单。\n\n- 3. 找到合适的电缆，将 PC 连接到你在第1步中选择的设备。\n\
    \    - *连接 PC 和设备需要什么类型的电缆？*\n\n- 4. 将连接器拖到设备背部的合适端口。电缆和其他连接器将移动到工作台连接（Workbench\
    \ Connections）。\n\n- 5. 将**工作台连接**中的连接器拖到 PC 上的合适端口。\n\n- 6. 找到连接设备到合适墙壁插座的电缆。\n\
    \    - *你正在连接到什么类型的网络？*\n\n- 7. 将合适的连接器拖到设备上的合适端口。剩余的连接器将移动到工作台连接。\n    - *你选择的连接器是什么形状的？*\n\
    \n- 8. 将工作台连接中的合适连接器拖到墙壁插座的合适插孔。\n    - *你在第7步中是将电缆连接到发送端口还是接收端口？*\n    - *你在第7步中连接的电缆是什么颜色的？*\n\
    \n- 9. 将工作台连接中的合适连接器拖到设备上剩余的端口。\n\n- 10. 将剩余的连接器拖到墙壁插座上剩余的插孔。\n\n## 5.0: 无线网络标准\n\
    \n## 5.2: 配置无线网络\n\n### 目标\n\n- 为给定应用识别正确的无线标准。\n- 安装与给定要求的无线网络适配器和组件。\n\n## 5.2.3\
    \ 选择无线网卡\n\n### 场景\n\n由于你经常出差，你想为笔记本电脑配备无线网络功能。选择并安装一个支持在 2.4 GHz 频率范围内网络进行 11\
    \ Mbps 到 54 Mbps 数据传输的无线设备。选择满足要求的最便宜方案。\n\n## 知识与任务\n\n下表列出了 802.11x 标准：\n\n\
    | 标准 | 频率 | 速度 |\n|---|---|---|\n| 802.11a | 5.75 - 5.85 GHz | 54 Mbps |\n| 802.11b\
    \ | 2.4 - 2.4835 GHz | 11 Mbps |\n| 802.11g | 2.4 - 2.4835 GHz | 54 Mbps |\n\n\
    下表显示了通常用于安装无线设备的端口。\n\n| 端口 | 无线设备 |\n| USB | USB 驱动器 <br> ![USB](image_1) |\n\
    | PCMCIA | PCMCIA 卡 <br> ![PCMCIA](image_2) |\n\n### 步骤\n\n- 1. 在架子上找到以最低成本最符合所需标准的设备。\n\
    \n在执行实验室此步骤时，请完成下表。\n\n| 设备 | 标准 | 连接 / 端口类型 | 价格 |\n| --- | --- | --- | --- |\n\
    | | | | $ |\n| | | | $ |\n| | | | $ |\n| | | | $ |\n| | | | $ |\n\n- 2. 将设备拖到合适的插槽/端口。\n\
    \    - *计算机有两种类型可以容纳可用设备的端口。在下方列出它们：*\n\n## 5.2.4 创建无线网络 1\n\n### 场景\n\n你想在公寓里建立一个无线网络。你的室友想连接它，你还希望朋友们来时也能连接。你决定\
    \ 11 Mbps 的数据传输率对于你的需求已经足够。\n\n选择并安装合适的网络设备。\n\n## 知识与任务\n\n下表提供了典型的无线网络设备。\n\n\
    | 设备 | 特性 |\n|---|---|\n| 无线网卡 | PC 内部用于信号接收和传输的卡 |\n| 无线接入点 (WAP) | 等于以太网集线器。无线网卡连接到\
    \ WAP，由 WAP 管理网络连接。可以是端口、集线器、交换机或路由器。 |\n\n### 步骤\n\n- 1. 在**架子**上找到并将合适的设备拖到\
    \ PC 的的插槽。提示：切换到 PC 或 PC 组件的备视图以完成此步骤。\n\n**注意：** 当你重启实验室时，设备组将随机生成。如果你退出并重启实验室，正确的扩展卡可能处于不同的位置。\n\
    \n在执行实验室时，完成下一页表格中的问题。\n\n| 组号 | 设备类型 | 需要的端口/插槽连接类型 | 网络标准（圈出适用项） |\n| 组 1 |\
    \ | 802.11a, b, 或 g |\n| 组 2 | | 802.11a, b, 或 g |\n| 组 3 | | 802.11a, b, 或 g\
    \ |\n| 组 4 | | 802.11a, b, 或 g |\n| 组 5 | | 802.11a, b, 或 g |\n\n- 2. 在架子上找到并将合适的设备拖到\
    \ PC 上的合适插槽。\n- 3. 在架子上找到并将合适的设备拖到端口。\n- 4. 将合适的连接器拖到端口。\n\n## 创建无线网络\n\n### 场景\n\
    \n你刚刚买了一个新电脑并需要连接它。网络使用静态地址。\n\n### 知识与任务\n\n有两种典型的无线网络拓扑。查看下表：\n\n| 拓扑 | 描述 |\n\
    |---|---|\n| Ad Hoc | 点对点模式，不需要 WAP。设置简单。 |\n| Infrastructure (基础架构) | 需要 WAP。可以添加多个主机。\
    \ |\n\n### 步骤\n\n- 1. 找到连接设备到合适墙壁插座的电缆。\n- 2. 将连接器拖到设备上的合适端口。\n\n## 5.0: TCP/IP\n\
    \n### 目标\n\n- 识别 IP、网关和 DNS 地址的组成及含义。\n- 识别 IP、网关和 DNS 地址的作用。\n- 手动配置 IP、网关和 DNS\
    \ 地址。\n\n## 7.3: IP 配置\n\n### 场景\n\n你需要连接笔记本电脑。网络使用静态地址。配置 TCP/IP 设置：\n\n- IP\
    \ 地址 = 10.1.12\n- 子网掩码 = 255.255.255.0（注意：这不是默认值。）\n- 默认网关 = 10.1.254\n- DNS 服务器\
    \ = 10.1.1, 10.1.2（按此顺序）\n\n## 知识与任务\n\nIP、子网掩码、默认网关和 DNS 地址可以在 Internet 协议 (TCP/IP)\
    \ 属性中手动分配。\n\n### 步骤\n\n- 1. 打开控制面板。\n- 2. 打开网络连接。\n- 3. 查看本地局域网的属性。\n- 4. 从连接的项目列表中选择\
    \ Internet 协议。\n- 5. 查看属性（如果是配置 LAN 连接，选择“常规”选项卡）。\n    - *点击哪个按钮查看属性？*\n- 6.\
    \ 将 IP 地址从自动切换为手动。\n    - *点击哪个按钮更改 IP 偏好？*\n- 7. 输入 IP 地址（输入 IP 地址后按 Tab 键）。\n\
    \    - *你输入了什么？*\n- 8. 保留默认子网掩码或在不使用默认掩码时输入新的子网掩码。\n    - *你输入了什么？*\n- 9. 要将数据路由到另一个子网，输入默认网关地址（如果所有计算机都在同一个子网内，可以留空此值）。\n\
    \    - *你输入了什么？*\n- 10. 分配首选 DNS 服务器，输入合适的地址。\n    - *你输入了什么？*\n- 11. 分配备用 DNS\
    \ 服务器，输入备用 DNS 服务器地址。\n    - *你输入了什么？*\n\n![Properties](img/ec83dece8c967d0c687b6a13db22bc0_72_0.png)\n\
    \n"
