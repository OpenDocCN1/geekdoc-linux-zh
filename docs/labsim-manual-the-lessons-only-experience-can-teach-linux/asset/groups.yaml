    # 11.5.5 Create a RAID-5 Volume


    # Scenario


    You are preparing the hard disk configuration for a new Windows Server 2003 computer.
    You want to create a single volume named Data on the new server. You want to choose
    a volume type that maximizes read performance and provides fault tolerance.


    Your task in this lab is to create a RAID-5 volume as follows:


    +   - To create the volume, use all four disks. You can start the wizard from
    any existing hard disk, but after selecting the volume type, add all four disks
    to the list of disks to use for the volume before proceeding.

    - Make the volume as large as possible. It will consume all of the hard disk capacity
    in the system.

    - Drive letter = E:

    - File system format = NTFS

    - Volume label = Data


    # Facts & Tasks


    In this lab, you need to create a RAID-5 volume using all of the computer''s unallocated
    disk space. A RAID-5 volume evenly distributes data along with parity (fault tolerance)
    information across all disks participating in the RAID-5 volume. RAID-5 volumes
    have good read performance as long as a disk does not fail. However, it takes
    longer to write data parity information must first be calculated. If a single
    disk in a RAID-5 volume fails, the volume is still accessible because parity information
    can be used to reconstruct any lost data. However, if two disks fail, the entire
    RAID-5 volume will also fail.


    Create a RAID-5 volume using the Create Volume Wizard. For this scenario, select
    all disks to participate in the new volume (RAID-5 volumes require at least three
    disks).


    The same amount of disk space will be used from each disk. The maximum amount
    you can specify depends on the disk in the Selected list that has the least amount
    of unallocated disk space. Also, be aware that one disk worth of space on the
    volume is used to store parity information. For example, the RAID-5 volume consists
    of three disks, 1/3 of the volume''s disk space will be used for parity information
    and cannot be used to store user data.'
