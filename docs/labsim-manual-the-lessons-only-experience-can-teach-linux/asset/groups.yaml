    ![](img/ec83bdece8c967d0c687b6a13db22bc0_184_0.png)


    你负责如图形所示的小型网络。该网络连接到互联网并使用 DHCP 进行地址分配。


    一名用户报告说其工作站只能与某些计算机通信。点击“模拟”（Simulation）按钮并使用 `Ipconfig` 命令来诊断问题。


    根据 `Ipconfig` 的输出，问题最可能的原因是什么？


    - DHCP 服务器宕机。

    - 工作站已配置为使用静态地址。

    - DHCP 服务器上未配置默认网关和 DNS 服务器地址。

    - 网络上存在一个恶意的 DHCP 服务器。

    - DHCP 服务器配置了错误的默认网关地址。


    ### 事实与任务


    验证工作站是否正在连接正确的 DHCP 服务器。如果使用的是正确的服务器，请前往 DHCP 服务器验证其是否正在发送正确的配置信息。


    ### 步骤


    1. 选择“模拟”开始。

    2. 在命令提示符窗口中，输入显示所有 IP 配置信息的命令。


    - 你输入了什么命令？

    - 命令提示符窗口中显示哪个默认网关地址？

    - 图表显示中列出的默认网关地址是什么？

    - DHCP Enabled（DHCP 已启用）行显示什么？

    - 命令提示符窗口中显示哪个 DHCP 服务器地址？

    - 图表显示中列出的 DHCP 服务器地址是什么？

    3. 完成信息检查并准备回答问题时，点击“完成”（Done）按钮。

    4. 检查适用于此工作站的答案：


    - DHCP 服务器宕机。

    - 工作站已配置为使用静态地址。

    - DHCP 服务器上未配置默认网关和 DNS 服务器地址。

    - 网络上存在一个恶意的 DHCP 服务器。

    - DHCP 服务器配置了错误的默认网关地址。


    ## 12.4.10 排除 IP 配置问题 4


    ### 场景


    点击“显示”（Exhibit）按钮并根据图表回答以下问题。


    ![](img/ec83bdece8c967d0c687b6a13db22bc0_187_0.png)


    你负责如图形所示的小型网络。该网络连接到互联网并使用 DHCP 进行地址分配。


    一名用户报告说其工作站只能与某些计算机通信。点击“模拟”（Simulation）按钮并使用 `Ipconfig` 命令来诊断问题。


    根据 `Ipconfig` 的输出，问题最可能的原因是什么？


    - DHCP 服务器宕机。

    - 工作站已配置为使用静态地址。

    - DHCP 服务器上未配置默认网关和 DNS 服务器地址。

    - 网络上存在一个恶意的 DHCP 服务器。

    - DHCP 服务器配置了错误的默认网关地址。


    ### 事实与任务


    如果工作站使用 APIPA 设置配置信息，将存在以下条件：


    - DHCP Enabled（DHCP 已启用）项将显示 Yes。

    - Autoconfiguration Enabled（自动配置启用）项将显示 Yes。

    - 不显示 DHCP Server（DHCP 服务器）、Lease Obtained（获取租期）和 Lease Expires（租期过期）。

    - IP 地址将位于 169.254.0.1 到 169.254.255.254 范围内，掩码为 255.255.0.0。

    - Default Gateway（默认网关）项将为空。

    - 不显示 DNS Servers（DNS 服务器）项。


    ### 步骤


    1. 选择“模拟”开始。

    2. 在命令提示符窗口中，输入显示所有 IP 配置信息的命令。


    - 工作站上是否配置了 DNS 服务器和默认网关地址？

    - DHCP Enabled 行显示什么？

    - DHCP server address 行显示什么？

    - IP 地址是否在 APIPA 地址范围内？

    3. 完成信息检查并准备返回回答问题时，点击**完成**（Done）按钮。

    4. 检查适用于此工作站的答案：


    - DHCP 服务器宕机。

    - 工作站已配置为使用静态地址。

    - DHCP 服务器上未配置默认网关和 DNS 服务器地址。

    - 网络上存在一个恶意的 DHCP 服务器。

    - DHCP 服务器配置了错误的默认网关地址。


    ## 12.4.12 查找 Linux 信息


    ### 场景


    你正在 Linux 系统上工作。点击“模拟”（Simulation）按钮并使用实验回答以下问题。


    eth1 接口的 MAC 地址是什么？


    eth0 接口的 IP 地址是什么？


    lo 接口显示哪个 IP 地址？


    ### 事实与任务


    要在 Linux 计算机上显示 TCP/IP 配置，请使用 `ifconfig` 命令。


    ### 步骤


    1. 选择“模拟”开始。

    2. 在命令提示符窗口中，输入显示所有 IP 配置信息的命令。

    - 你输入了什么命令？

    3. 完成信息检查并准备回答问题时，点击“完成”（Done）按钮。

    4. 检查适用于此工作站的答案：


    - eth1 接口的 MAC 地址是什么？

    - eth0 接口的 IP 地址是什么？

    - lo 接口显示哪个 IP 地址？


    ## LabSim 手册 实践是教学


    ### 网络


    在本实验中，你将学习：


    - 识别不同类型网络（包括电话、以太网、同轴、光纤和 USB/Firewire）的常用组件（包括插座/端口和电缆）。

    - 通过上述组件将 PC 连接到各种网络。

    - 识别多种 NIC 和调制器的特征、区别并匹配相应的网络。

    - 访问、启用/禁用网络连接的状态和属性。

    - 识别适用于特定应用的无线标准。

    - 安装无线网络适配器和组件以创建无线网络。

    - 子网掩码以及 IP、网关和 DNS 地址的结构和用途。

    - 手动配置子网掩码以及 IP、网关和 DNS 地址。

    - 配置 TCP/IP 协议以访问多个 DNS 和 WINS 服务器。

    - 安装 QoS 包调度器网络服务。

    - 启用 Internet防火墙并在防火墙中开放端口。

    - 测试简单网络组件之间的连通性并从中获取信息。


