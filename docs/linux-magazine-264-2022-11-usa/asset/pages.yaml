    # ### Mysterious Alignments in the Kernel


    Sudip Mukherjee reported a build failure with the mainline kernel source tree
    which is fairly unusual. Most patches get tested to see if they''ll compile on
    a variety of systems before the patch is accepted, but a build failure can happen.


    After noticing the failure, Sudip did a git bisect a fast way to jump the distance
    to the problem, then the remaining distance, and so on. It''s one of the most
    common techniques for finding which patch actually caused bug Sud used it to track
    the problem down to a small patch that compared the number of bytes by two different
    variables needed to be the same.


    Linus is often interested in build failures or crashes in the mainline tree because
    that him himself responded away to Sudip. He said he had looked at the data size
    and compared it like patch to match. He said, "That BUILD, BUG_(on) looks correct,
    and if size(t) doesn''t work, then the code doesn''t. In other words, the code
    was appropriate." Linus added, "I''m not seeing what could go wrong there."


    Linus was not seeing the build failure himself he was simply examining the report.
    But he remarked, it seems to be very peculiar to build your environment (either
    config, or compiler).


    This is not what wants to hear if they are the developers on a project will help
    track their problem. Sudip replied that his build environment had not changed
    since all his successful before.


    Linus asked, "Hm. What compiler did you use? Because it seems very broken."


    Sudip looked further into the code, looking at the language outputs produced by
    the compiler, other things. He speculated, "I suspect some of the insides of that
    ''struct endif and up getting aligned, despite the __attribute__((packed))'';
    For example, ''struct_timings()'' is supposed to be just 3 bytes, and it''s an
    odd offset of 35 in the ''struct endif'' if I did the math correct."


    But he retorted, "it obviously doesn''t happen for me or most other people, so
    it''s something in your setup. Unusual compiler",


    Sudip was it was not his personal setup. He was using gcc 11.3.2021 (GCC) while
    building all the arm configs with the same compiler in the setup and found some
    sparx_defconf failing. Linus was using a very old Linux environment compiler.
    He was also compiling a clean Debian Ubuntu Docker with no special circumstances.


    Linus continued to debug into the code, and found that the size aligning - the
    things that seems to have caused the problem for Sudip in the first was actually
    different from what he needed to be. He didn''t know why the discrepancy was,
    but he felt that had to put finger on something had to be the solution.


    He posted a patch to reply and said, "I no idea what it is if that is is triggered
    by some variable attribute [Application Binary Interface] that that Linux compiler
    flag can be changed."


    Linus added, "This small kernel-specific pig trouble this 16-bit member in git2
    structure, and despite it being packed and aligned to one, we allow him the size
    to 2."


    > "It''s an old bug, and it''s no compiler compliant with the C standards. Implementations
    permitted by the C to pad standards


