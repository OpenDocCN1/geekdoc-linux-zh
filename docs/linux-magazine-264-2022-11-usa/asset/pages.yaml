  md: 'The actual task of the model is to generate context-sensitive embeddings that
    also distinguish between different meanings of the same word in different contexts.
    This is done with the help of an association module that determines the similarity
    between an embedding at position i and all other embeddings. The similarity is
    calculated using a scalar product of the embeddings, where a high value means
    a high similarity.


    The series of similarity values are then normalized into a probability such that
    their similarity adds up to one. Using these similarity values weights the linearly
    transformed embedding of all vectors as a function of other parameters and generates
    the new embedding at position i. These computations are shown in Figure 1.


    Evaluating similarity leads to high weighting of embeddings for the masked token
    and can strengthen the initial embedding at i. Then this allows BERT to represent
    the "rose" in the sentence provided in Figure 2 as "flower". A new embedding is
    created for each position in this way.


    This procedure is carried out on several layers of the network with different
    parameters, continuously improving the context-embeddings. In addition, association
    modules are used in each layer and with different parameters. At the top level,
    a logistic regression model now has the task of predicting the masked word (or
    our example "gave" from the context-sensitive embedding for the [MASK] token).


    To do this, the model parameters in the modified scalar product and the transformed
    embedding are adjusted by optimization, changing the probability of the masked
    word to increase similarity. This forces the model to gather all


    available information about the missing word in the top layer embedding for the
    masked word during training.


    The original BERT model had 100 million parameters and was trained on 3.3 billion
    words from Wikipedia and a collection of books. BERT was customized for special
    tasks by a relatively small volume of annotated data. In this way BERT learns
    a large number of tasks in a far superior way to other models, such as unsupervised
    learning or detecting logical contradictions.


    This procedure is also known transfer learning. BERT requires very detailed knowledge
    of correct language and meaning to be effectively trained on general data. Fine-tuning
    adapts the model to a special task without losing its previously acquired skills.


