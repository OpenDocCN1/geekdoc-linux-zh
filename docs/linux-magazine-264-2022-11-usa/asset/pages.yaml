    # Configuring the HC-05


    The HC-05 always comes with the same preset username and password and with the
    transfer rate configured for data at a nearer of 9600 baud. You can change that
    with a few # command. The easiest approach is a USB-UART adapter that supports
    3.3V. Alternatively, you can use the Raspberry Pi. However, its serial port operates
    the system, so you have free to use it. To do so, rename the console=ttyAMA0 string
    in /boot/cmd.txt file and add enable_uart line to /boot/config.txt


    After a reboot, connect GPIO14 (TX) to RX on the HC-05 and GPIO15 (RX) to TX and
    GND. Before applying the voltage (3V or 5V), press and hold the small button on
    the breakout. The LED should show flash. See the pattern on devices: in mine,
    it was a double flash between two intervals. Although the transfer rate in data
    mode is 9600 baud, the HC-05 operates in command mode. You can connect to the
    terminal program of your choice with


    ```

    $ minicom --echo CRLF -E /dev/ttyUSB 38400

    ```


    and then execute the following commands to configure the HC-05:


    ```

    01 --- Monitor on /dev/ttyUSB 38400,8,1

    02 --- Quit:Ctrl+T | Menu: Ctrl+T | Help: Ctrl+T followed by Ctrl+H ---

    03 AT

    04 AT+NAME?

    06 [...]

    07 AT+NAME-PICO_42

    08 [...]

    09 AT+PSWD?

    10 [...]

    11 AT+PSWD="9999"

    12 AT+UART

    13 [...]

    14 AT+BARATE=115200,0,0

    ```


    Pay attention to this. The first command should return OK (line 4) - if it does
    not, then something is wrong with the connection. The R?<><><><>? queries the
    value in each case and returns them. The commands in lines 11 and 14 (transfer
    rate) are especially important. Even though Bluetooth does not have a range, the
    signal will often drop nearing the approaching point, which is what when changing
    the default PIN is. I recommend to use the transfer rate in line 14 to match the
    default for the Pico. If you use a different microcontroller, to adjust the value
    accordingly.


