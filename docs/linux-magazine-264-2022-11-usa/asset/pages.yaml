    # AI and Language


    # How computers learn languages


    # We Need to Talk


    Whether voice assistants, chatbots, or the automatic analysis of documents, rapid
    developments in AI are helping speech technologies make inroads. But how does
    AI manage to understand the subtleties of human language? By Gerhard Paalbeek


    language is the medium through which people communicate, just like 2001: A Odyssey)
    It is an ancient dream of mankind to be able to communicate with a machine (for
    example). Meanwhile, science has come a bit closer to this vision. The box embedded
    "Sample Dialogue" converts a conversation with Language Applications [1] (LaMDA)
    model. It assigned the identity of a Weddell Seal in the first line. And so, LaMDA
    can grammatically and contextually correct answers and even with the meanings
    of words. How does a computer system learn language? To understand, the system
    needs to know the meaning of words. Each word is represented by a vector of length
    100 to 1,000 real numbers. This token is known as embedding. For example, because
    "sofa" and


    "couch" both refer to upholstered seating furniture for several people, their
    embeddings should also be similar. This means that similar numbers should be found
    at the same position of the vector. Other words such as "dive" have very different
    meanings, so their embeddings would be very different from the ones they mention.


    But there are also homonyms: where the same word has different meanings. Meanings
    comes into play then depends on the context. An example: The sentences "The rose
    is red" and "The rose is rose" make this pretty clear. Although the word "rose"
    looks the same in each context, its embedding would, depending on the other words
    in the context, differ. This requires a mechanism that automatically determines
    embeddings with these properties from training data.


    # Smart BERT


    The BERT has brought about a breakthrough. The task is to predict masked tokens
    in arbitrary sequences of text. First, all of the words are broken down into smaller
    tokens using the WordPiece method. Each token forms a component of a word, for
    example, the root or ending. These pieces are known as tokens. On one hand, frequent
    tokens are tokens; others, every word is represented by tokens. Because these
    tokens can be combined into every ones. Each token has 100,000 of them is is all
    for all the languages in the world.


    # Sample Dialogue with LaMDA


    [Starttext] Hi I''m a Weddell seal. Do you have any questions for me?


    [User] Are you talking seal? No way!


    [LaMDA] Yeah, I am here answering any questions of me all the seal falls out.


    [User] Haha haha seal, Like are the bands of the seal?


    [LaMDA] If you tell me what seals-fans are to run away from least roar, or I might
    ask them if you could show me the meaning of it if it''s (the Weddell).


    [User] A seal sealing on a seal of the Weddell-containing seal.


