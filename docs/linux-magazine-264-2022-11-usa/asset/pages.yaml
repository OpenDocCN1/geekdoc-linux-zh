  md: '# # Debian 11.5 and Rocky Linux 9.0


    Two Terrific Distros on a Double-Sided DVD!


    ![](img/6fa2087b693ca3fb8f29db760f956bc8_5_0.png)


    # ## Debian 11.5 64-bit


    Debian releases every couple of years, making each release a major event. The
    release of Debian 11 (Bullseye) in August 2021 was no exception. Not only was
    Bullseye''s Homeworld theme unusually sophisticated for Debian, but the release
    also featured improved and exFAT filesystem support, as well as reliable Bluetooth
    over-.


    A year later, the 11.5 release is the latest enhancement to this firm foundation.
    Debian 11.5 consists of fixes and security updates that have been issued since
    the last point release. In addition, the release includes fixes for dozens of
    packages, including dpkg, NVIDIA drivers, and the Debian installer.


    Like all Debian, Debian 11.5 lacks the newest software, but compensates by providing
    stability and security that is second to none. With almost two-thirds of active
    distributions being based on Debian, even a point release is an influential event
    in software.


    # ## Rocky Linux 9.0 64-bit


    Rocky Linux is less than two years old, but it is rapidly becoming a major RPM
    distribution rivaling Hat Enterprise Linux (RHEL) in popularity. Rocky Linux has
    two general releases, although their numbering continues on CentOS, emphasizing
    its role as a successor.


    Rocky is one of the distributions from CentOS when CentOS development was stopped
    in favor of CentOS Stream. As its homage says, Rocky is designed to be "100%-bug-compatible
    with Hat Enterprise Linux." Both are constructed from the same source code. The
    main difference is that, while both are enterprise solutions, Rocky Linux emphasizes
    development in a way that RHEL does not. For corporate and home users alike this
    is an essential difference.


    However, technical differences are slowly to emerge. Rocky Linux 9.0 introduces
    Bandit, a tool for building Rocky Linux from scratch and extending the source
    code. More differences are likely to emerge in the next few years. Meanwhile,
    Rocky Linux 9.0 will be supported until 2032.


