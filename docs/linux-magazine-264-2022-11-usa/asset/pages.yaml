  md: '# CALL FOR PAPERS


    We are looking for good articles on Linux and the tools of the Linux environment.
    Although we consider any topic, the following themes are of special interest:


    +   - System administration

    - Useful tips and tools

    - Security, both news and techniques

    - Product reviews, estimates from real-world experience

    - Community news and projects


    If you have an idea, send a proposal with an outline, an estimate of the length,
    a description of your work, and contact information to edit@linux-magazine.com.


    The technical level of the article should be consistent with what you normally
    read in Linux Magazine. Remember that Linux Magazine is read in many countries,
    and any article may be translated by one of our publishers. Therefore, it is best
    to avoid slang and idioms that might not be understood by all readers.


    Be careful regarding dates or events in the future. Many weeks could pass between
    your submission and the final copy reaching the reader''s hands. When you send
    manuscripts, please include a subject line in your email that helps us identify
    your message as an article proposal. Screenshots and other supporting materials
    are always welcome.


