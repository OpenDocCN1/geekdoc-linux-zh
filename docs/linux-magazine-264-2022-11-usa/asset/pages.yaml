  md: '# LINUX NEWSSTAND


    Linux Magazine is your guide to the world of Linux. Monthly issues are packed
    with technical articles and tutorials you won''t find anywhere else. Explore our
    full catalog of back issues for specific topics or to complete your collection.


    # #263/October 2022

    Build on IoT Linux


    ![](img/6fa2087b693ca3fb8f29db760f956bc8_94_0.png)


    The most amazing thing about Linux is its flexibility. Linux systems run on the
    biggest computers in the world - and one of the diminutive devices that populate
    your home environment. If you''ve wondered how developers adapt Linux to run on
    tiny tech, you''ll appreciate this month''s stories on Buildroot and the Yocto
    project.


    On the DVD: Linux Magazine Archives 1-262


    # #262/September 2022

    Beyond 5G


    ![](img/6fa2087b693ca3fb8f29db760f956bc8_94_1.png)


    Behind the scenes, the cellular phone network has always been the preserve of
    highly specialized and proprietary equipment, but some recent innovations could
    be changing that. This month we explore the Open RAN specification, which could
    allow one day allow the mobile network to operate on off-shelf hardware.


    On the DVD: openSUSE Leap 15.4 and MX Linux 21.1


    # #261/August 2022

    USB Boot


    ![](img/6fa2087b693ca3fb8f29db760f956bc8_94_2.png)


    Live boot was such an exciting idea 15 years ago – carry a CD with you and boot
    from anywhere. Old-style boot CDs had some limitations. Today''s USB boot tools
    solve problems plus a feature that no one even thought about: access to boot images
    on a single stick.


    On the DVD: Linux Mint MATE 20.3 and FreeBSD 13.1


    # #260/July 2022

    Privacy


    ![](img/6fa2087b693ca3fb8f29db760f956bc8_94_3.png)


    If you are serious about privacy, you''ll need to learn more than your browser''s
    tracking bone. Those who need anonymity the most depend on the Tor network – a
    global project offering safe surfing in surveillance states. We also look at Postmaster,
    an application with some powerful privacy features.


    On the DVD: Ubuntu 22.04 and Fedora Workstation


    # #259/June 2022

    Zero Trust


    ![](img/6fa2087b693ca3fb8f29db760f956bc8_94_4.png)


    Twenty Years ago, everyone thought a gateway was all you needed to stay safe from
    intruders, but recent history has a different story. Today, the best advice is:
    Don''t trust everyone. Your internal network could be as dangerous as the Internet.


    On the DVD: Zorin OS 16.1 Core and Super GRUB2 Disk


    # #258/May 2022

    Clean IT


    ![](img/6fa2087b693ca3fb8f29db760f956bc8_94_5.png)


    Most people can save energy by changing to more efficient light bulbs, but did
    you know you can save energy with more efficient software? This month we examine
    the ongoing to bring sustainability to the IT industry.


    On the DVD: Manjaro 21.2 Qynos and DragonFly 8.2.1'
