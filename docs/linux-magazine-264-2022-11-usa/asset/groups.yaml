    Linux（图形界面和终端）、macOS 和 Windows 版本。移动客户端适用于 Google Android 和 iOS。如果你希望在网络上实现可访问和加密，还需要需要将
    `SEAFILE_SERVER_ENCRYPT` 设置为 `true`。然后为 `SEAFILE_SERVER_NAME` 注册一个域名。如果你没有注册域名，可以使用
