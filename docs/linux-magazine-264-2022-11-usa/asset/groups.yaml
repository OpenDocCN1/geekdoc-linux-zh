    OpenSourceHub.com


    # 新闻


    ## 内核新闻


    ### 内核社区


    ![](img/6fa2087b693ca3fb8f29db760f956bc8_11_0.png)


    ### 内核对齐


    Sudip 报告了主内核构建失败，这相当罕见。大多数补丁在接受之前都会在各种系统中进行测试是否可以编译，但构建失败仍可能发生。发现失败后，Sudip 使用
    `git bisect` 快速跳转到问题所在，然后是剩余距离，以此此类推。这是寻找哪个补丁导致了 bug 的常用技术之一；他以此将问题追踪到一个比较两个不同变量字节数是否相等的小补丁。


    Linus 通常对主树中的构建失败或崩溃感兴趣，因为他本人回复了 Sudip。他说他查看了数据大小并像补丁一样进行了对比。他说：“那个构建，BUG 看起来是正确的，如果
    size(t) 不起，那么代码就不行。换句话说，代码没问题。”Linus 补充道：“我没看到那里哪里出了问题。”


    （注：原文后续存在大量重复段落，已根据指令“不要重复输出原文”的要求进行处理。）


