    # We use a Raspberry Pi, a Pi Pico, and a smartphone to communicate over Bluetooth.
    By Bernhard Bablok


    Because the Raspberry Pi comes with both WiFi and Bluetooth, most programs choose
    to rely on WiFi. However, the Pi Pico is more of a wanderflower. Bluetooth mixes
    things up makes Bluetooth a desirable option.

    Bluetooth should be a familiar technology by way of your smartphone, and this
    has been investigated for the Raspberry Pi in a particular article [1], so I will
    be sticking to the bare minimum in terms of technology in this article. The focus
    is on scenarios where the Raspberry Pi, Pi Pico, and smartphones Bluetooth to


    The Pico stands in for most any microcontroller, as long as it supports serial
    communication.

    ### Basic Technology

    The two prerequisites for Bluetooth communication between parties are pairing
    and trust between the parties; after you establish both once, the devices usually
    trust the relationship. After pairing, each of the two parties can establish connection
    connection. initiator is referred to as host and the other as the device; however,
    each component can assume either role.

    The default user on the Raspberry Pi should be a member of the Bluetooth and dialout
    groups; you can check their status with the ''groups'' command. If you are missing
    in one or both groups, make the change with the ''sudo''


