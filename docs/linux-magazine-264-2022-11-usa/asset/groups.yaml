    # Sound tracker


    # Furnace


    effects and sound control. With a small shim to handle audio hardware, this data
    could be played on 1980s hardware directly from memory and without modification,
    creating beautiful chipune music that uses very little RAM and CPU resources.
    These limitations forced the invention of trackers, and in so, creating some incredible
    distictive chipune sounds that thrive to this day, in any age of seemingly limited
    storage and compute power.


    including the venerable Radium and Schism trackers (and the amazing commercial
    Renose). It''s uncommon to see an entirely new open source project appear, and
    utterly remarkable to find one that also allows the sound of every sound chip
    of that early era. And what this Furnace is and does. Furnace is a tracker that
    includes sounds to emulate various sound chips, with individual parameters, which
    can all be controlled through the data view. It includes FM modules from the Sega
    Genesis, FM Towns, arcade machines, and many PC sound cards, plus playback chips
    found in the Commodore Amiga, various machines, beeps from Knight and MIDI, the
    ZX Spectrum and Game Boy, plus recreations of the Commodore 64 SID chip and Mickey
    in the Atari Lynx.


    Necessity is the mother of invention, but there are few examples of this in the
    hardware music tracker. A tracker is little more than a scrolling of hexadecimal
    values, with each column representing a group of sound or instrument. Each row
    in each column is a potential pitch value, with additional columns inside it used
    for


    There are a few trackers still being developed for Linux,


    Each system is added on the File menu. You will add one or more new groups to
    the note editor. The number of groups corresponds to the capabilities of the device
    you''re adding, such as four channels for the Amiga or two for the SID chip. The
    groups within each column also represent the unique characteristics for that device,
    such as the waveform, cutoff filter, envelope, or amounts. This is brilliantly
    documented for each system in the online reference guide and makes complete if
    you''re already familiar with music trackers. There is also an independent editor
    where you set these parameters to create and save an individual sound, which can
    be switched in your own music.


    ![](img/6fa2087b693ca3fb8f29db760f956bc8_85_1.png)


    The end result of this is a chipune powerhouse, where you can summon the sound
    of almost any system and program music with full control of all its attributes.
    By now we mentioned the oscillos, effects, filters, and even a sample that can
    be opened alongside your composition. The whole can then be exported to any format
    or as a scene-exportable deableDefMask module (which you can''t import them yet).
    It''s highly comprehensive and fun to play with,


    +   1. Desencer: Set low levels, can be built from sequences of parameters. 2.
    Oscilloscope: A waveform of the output or output for each hardware track. 3. Tracks:
    These are the heart of Furnace and to emulate most popular audio sound from the
    1980s. 4. Global: Set the tempo, pattern, and song length. 5. Instrument: This
    is what you use in your editor, to tune the capabilities of each sound engine.
    6. Pattern: This adds all kinds of modulation and effects to the tracks with extra
    data columns.


