    # 机器学习


    所以。然而，目前的许多问题（特别是在欧洲）围绕着其他话题，例如可信 AI、不确定性的确定、绿色 AI，以及对可信 AI 概念的许多方面和讨论都是基于欧盟 2021
    年发布的《可信 AI 指南》。其他方面，隐私和数据治理、透明度、非歧视和公平被确定为欧洲的推动力量。目前，欧洲围绕这些问题正发生着许多事情。


    测试和数据中有许多狼的图像，但所有这些对于“狼”来说都是一个至关重要的因素——没有雪就没有狼（图 S）。这种失败无法通过经典的分类方法来确定。


    另一点是：开源软件对于所有广泛使用的机器学习软件是什么样子的？像 scikit-learn、TensorFlow/Keras 和 PyTorch，它们都在开源许可下发布的，这些是你构建软件时使用的库。


    一个问题是，每件软件都包含一个人工神经网络。权重不是那种可读且可理解的源代码类型，而是从某个过程中提取而的。如果你想重复这个过程，你需要库（问题所在）、网络结构信息、初始化参数（即启动所需的项）以及用于训练的数据集。最后一项通常超出了限制——你无法看到数据。


    考虑到欧洲在 AI 上是否能跟上中国和美国等竞争者——它们在大多数情况下指的就是机器学习。答案可能是取决于话题。反过来，绿色 AI 源于一篇名为《绿色 AI》的文章，指的是在考虑计算成本的同时产生结果的
    AI，鼓励减少资源投入。到为止，人们关注的点在资源消耗上。如果多出几千个部分就可以区分类别，那么这可以在不发布的情况下完成。这种方法在很大程度上超过了训练和运行的成本。


    # 梦想与现实


    最终，即使是基于机器学习算法的软件也是软件，这意味着它需要被测试和维护。如果这很棒，那么开源比那样写更好。


    涉及到测试时，重要的是意识到软件无法通过经典的测试方法轻易地验证。测试本身通常是确定性的——你不需要担心模型在某些情况下将同一张图像分类为狗，而在其他情况下分类为猫。但还有许多其他陷阱。例如，在一个真实的实验
    [2] 中，狼被识别为狼。然而，将该模型应用于德国某动物园的图像尝试却是令人沮丧的。


    一个典型的例子是 ImageNet 数据库，它包含许多动物等等。一个包含权重值的网络，这些值可以被提取并适应到有数据的新任务中。例如，如果你只想寻找南美鸟类，你不会在
    ImageNet 中找到它们，但网络已经学习了许多过滤器。利用在你自己的南美鸟类图像集上的预训练状态。这意味着你可以用更少的图像并且可能


    ![](img/6fa2087b693ca3fb8f29db760f956bc8_19_0.png)


    图 5：这张来自狼识别实验 [2] 的图显示了什么导致了错误的决策。


    以更低的训练能量开销获得更高的准确率。这而且是非常可能的。


    但开源需求背后的实际想法是用户可以更改软件并传递这些更改（通常是改进后的）。这个目标不再被完全满足。如果没有可用数据，进一步开发的可能性就是有限的——更不用说机器学习环境中众多软件专利带来的问题了。


    那么，一旦你理解了这一切，作为一个源代码爱好者，你可能会想奇这项技术对你的运动意味着什么。GPL 的概念性“著左许可”（copyleft）可能希望适用于你的分发，并且不需要许可即可重新发布作为服务运行的软件。（你可能记得
    AGPL 旨在关闭的 ASP 漏洞）。我个人认为，机器学习的使用将引导我们重新思考如何推动开源开发，并将一切与数据概念相结合。


    # 结论


    机器学习已经存在很长时间了，但其日益增长的重要性本身应该是寻找这些场景的动力。除了机器学习的力量之外，它也确实有趣。


    例如，如果你有一个大量的 LaTeX 文档集合，为什么不使用它们来训练 LSTM 或 Transformer 网络呢？你甚至可以通过编译器建立反馈循环，让系统学习编写无错误的
    LaTeX 代码。内容无疑会有点奇怪，但这个过程很有趣。


