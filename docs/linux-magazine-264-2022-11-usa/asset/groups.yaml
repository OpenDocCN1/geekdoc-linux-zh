    # LINUX 社区 FOSS Picks


    ## Plasma 布局管理器


    ## Exquisite（精美）


    KDE Plasma 桌面的优点之一在于，它本身就是一个极佳的体验，同时它更是一个桌面构建组件。你可以通过几乎无限的方式来定制和增强默认体验，可以使用 KDE
    内置的小部件，也可以创建自己的脚本来添加更多功能性优势。这在各种可以更改窗口排列方式的脚本中得到了体现，包括 KWin Tiling（将桌面变为具有自主规则的平铺窗口管理器）和
    Krohnite（提供具有动态布局的类似功能）。Exquisite 是另一个选择，它的开发目的是模拟 Windows 11 管理的优秀特性。对于那些想要尝试不同窗口管理风格、但可能缺乏全全投入需要配置快捷键的东西的用户来说，它是一个很棒的选择。Exquisite
    可以通过 KWin 脚本配置面板安装，也可以通过手动导入压缩包。它通过按下键盘快捷键触发，该快捷键可以配置，默认为 Ctrl+Alt+D。Exquisite
    之所以成为窗口管理的绝佳入门，是因为它能显示窗口的弹出，你可以在某个位置选择


    ![](img/6fa2087b693ca3fb8f29db760f956bc8_87_0.png)


    Exquisite 是一个易用的 KDE Plasma 桌面窗口管理器，它是学习平铺技巧的绝佳入门，可以针对当前选中的窗口。有 10 种布局可以选择，并且可以通过简单的脚本进行修改和创建，以更好地适应你的需求和习惯。面板保持在屏幕上，可以轻松让你移动其他窗口，并被配置在脚本全屏或一段时间后自动隐藏。这是一个让你习惯它的好方法，而且比记住许多快捷键要简单得多。


    ## 项目网站


    https://github.com/qwer33/Exquisite


    ## 电池监控器


    ## battop


    Steam Deck 为移动 Linux 带来的一个令人惊讶的特点是让电池续航成为了首要问题。当 150W 图形硬件开始运行时，它可以在不到两小时内耗尽其
    400Wh 的电池。虽然 Steam Deck 确实包含了优秀的性能调优和工具，但这些工具在桌面模式下是不可用的。这时 battop 就派上用场了，它可以帮助任何运行在电池上的
    Linux 系统，因为你可能需要了解你的电池情况。它从终端运行，直接连接到电池管理系统，并将你可以从硬件中获得的所有信息渲染成一个功能完备的终端用户界面。主显示器分为左右两列的六个部分。左部分根据左列表列出了你电池的能力和需求详情。这些包括电池的供应商
    ID、功耗、电压、容量、充满电量以及环境温度。上方是一个直方图，显示电池剩余电量的百分比。右侧是三个直方图，分别显示电池的温度、功率消耗和每瓦耗电量，你可以看到定义的最小值和最大值


    ![](img/6fa2087b693ca3fb8f29db760f956bc8_87_1.png)


    与硬件应用不同，Linux 电池信息的访问是不受限的，任何人都可以通过 battop 访问。battop 的波动被标记以显示它们的局限性，每个图表都标注了每个项目的当前值。当
    CPU 使用率很高而你只想看到最近的操作对电池性能没有影响时，所有这些工作都非常有用。正如 battop 网站所说，它是电池版的类似于用于进程和内存管理的
    gtop 或 top。


    ## 项目网站


    https://github.com/svartlf/rust-battop


    ## 音乐视觉化器


    ## FOSS Picks LINUX 社区


    ## corrscope


    互联网上充满了只有音乐并配有一些视觉帮助以为耳朵提供反馈的视频。它们很容易创建，如果你想分享你的音乐或创建一个易于播放的内容，它们很有用，但创建一个有意义的可视化并不困难。好处是与声音同步是有趣的。一种方法是从音乐可视化器渲染输出，我们之前已经看过了。另一种方法是使用
    corrscope，它接收一个或多个音频文件并生成这些输入的示波器视图。这些显示了音频变化的频率，并且与声音同步非常困难。Corrscope 以类似于示波器的方式解决了这个问题，同步波形的向上或向下的斜率。这些触发器可以像真实硬件一样进行调整，尽管默认值已经适用于一切。波形可以通过更改线条颜色、背景颜色以及垂直或水平方向进行自定义。最重要的是，你可以为多个输入生成波形并将其拆分。这对于许多任务非常有效，但配合音乐使用时效果最好。这是因为每个通道都可以通过软件分离，并且每个通道由简单的形状组成。这些在看起来非常良好


    ![](img/6fa2087b693ca3fb8f29db760f956bc8_88_0.png)


    通过 corrscope，你可以为音频通道构建示波器可视化，它们在任何音乐示波器的网格中播放。你在 GUI 中进行的任何更改都可以通过点击预览来立即查看。这是最终输出的免费版本。如果你喜欢，此高质量视频将以你的分辨率渲染，并以你喜欢的方式分享。


    ## 项目网站


    https://github.com/corrscope


    ## bastion


    Bastion（堡垒）是一个位于 DMZ 中的服务器，用于保护你的网络免受攻击。它是私有网络的网关，并暴露在公共互联网上。由于它是暴露的，因此必须进行加固和监控。堡垒主机是允许外部网络访问私有网络的网关。它通常用于提供安全访问私有网络。要连接到私有网络，首先连接到堡垒主机，然后从那里连接到私有网络上的其他服务器。这比直接连接到私有服务器更安全，因为堡垒主机是唯一暴露在互联网上的服务器。


