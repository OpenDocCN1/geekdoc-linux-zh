    \ DOGS\n\nDear Reader,\n\nIt is easy to write about the scary and annoying stuff,\
    \ which seems helpful to happen every day, but it is more important to point out\
    \ the positive things when they happen, and the Ethereum Merge is like a very\
    \ positive thing. As I have mentioned in this space, the tech has its flaws and\
    \ problems that would behave like an invasive species—stripping out trees to leave\
    \ the indigenous environment without any natural defenses. The motivational critics\
    \ call it \"dissent\" and warrant that it is what-wrong to implement it by the\
    \ new tech with other tech, which we'll invent again,\" I tell you. So to be fair,\
    \ a little disruption is sometimes helpful when we get releases and these invasive\
    \ species improve the environment (in the place, where we live). Crypto mining\
    \ is a good example of a technology we have unleashed on our environment without\
    \ any kind of plan.\n\nAs we described in the May 2022 issue, \"Bitcoin mining\
    \ is at all highs with 8 million miners—consuming as much energy as Germany—and\
    \ that is growing every year as Bitcoin gains popularity. To recall a recent study,\
    \ if you take the total energy cost of Bitcoin mining by the total number of Bitcoins\
    \ mined, you get an energy cost of over $100—if you're just buying coffee or flagging\
    \ an Uber.\"\n\nI mention this to provide the context that I believe is important\
    \ when the Ethereum could complete the Merge—a migration to a new and more eco-friendly\
    \ crypto-mining model. Ethereum started with an incredible de facto proof-of-work\
    \ mining model that was never intended for a large-scale global economy. Proof-of-work\
    \ is an official-sounding euphemism for a frenzy of GPU-farmed servers that are\
    \ all simultaneously mining the same block. The proof-of-work model is like a\
    \ field filled with thousands of wild dogs; when you throw a block into the middle\
    \ of that field, all dogs chase off.\n\nAs anyone can tell, Bitcoin, being the\
    \ child of an absent and mysterious creator, appears to be with the lumbering\
    \ proof-of-work model, but the Ethereum community has made a concerted effort\
    \ to solve the energy problem for the more-efficient proof-of-stake model, which\
    \ they estimate could save 99 percent of energy. Whereas Bitcoin consumes more\
    \ energy than Germany, the new version of Ethereum uses less than a music video.\
    \ According to the Ethereum website, around the world consumed 45 times more than\
    \ ever watching the \"Gangnam Style\" in 2019 than the proof-of-stake Ethereum\
    \ uses in 2023.\n\nIt is worth noting that other cryptocurrencies also exist (For\
    \ a list of the most stable cryptocurrencies check the LeafLeafScore website).\
    \ However, other cryptocurrencies would tend to operate on a second cryptocurrency\
    \ after Bitcoin, and its versatile design might not easily surpass Bitcoin in\
    \ the near future.\n\nThe governance of Ethereum is like the Ethereum protocol\
    \ constructed. Although it is all about money (in many ways), the organization\
    \ is more like an open source project, with a group of core developers and several\
    \ tiers of contributors participating in various projects and validation. The\
    \ work of proof-of-stake must have been a monumental effort, requiring a lot of\
    \ people to leave their comfort zone but still stay as a community. To accomplish\
    \ this, they must agree on all the details of their proof-of-stake design, launch\
    \ a testnet, ensure it is perfect, and then merge this with the existing proof-of-work\
    \ blockchain (which is why they call it the Merge).\n\nIt looks good so far, but\
    \ we're still in Ethereum's new era. Complications can happen, and they are certainly\
    \ not out of the woods, but the Ethereum community deserves attention and thanks\
    \ for being the wild dogs running in the garden.\n\n![](img/6fa2087b693ca3fb8f29db760f956bc8_2_0.png)\n\
    \nJoe Casad,\nEditor in Chief\n\n+ Info\n[1] Gold Rush: The Environment Impact\
