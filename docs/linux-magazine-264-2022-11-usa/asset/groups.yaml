    # NEWS


    ## Linux News


    The new tool is a command, gnome-info-collect, and will present all collected
    data to the user before it''s transmitted. Once you run the command, you will
    be asked to okay the transmission of the information and, upon successful transmission,
    you''ll be thanked for helping to improve Gnome.


    Types of information that will be included such as operating system, hardware
    vendor, Flatpack/Flathub enabled, installed apps, file sharing (active/inactive),
    remote login (active/inactive), number of users, default browser, and enabled
    extensions. There is zero local information or anything that could be sensitive
    transmitted to the Gnome developers.


    You can install the tool with help of Snap, DNF, Pacman, or Zypper. For more information,
    check out the official GitLab page for the project (https://gitlab.gnome.org/vstanek/gnome-info-collect).


    # Kubuntu Focus Announces New Desktop Model


    The Kubuntu NX is a new small form factor desktop computer that ships with Kubuntu
    22.04 and the latest KDE Plasma interface. This new machine can be speed with
    either an i5-1135G7 or i7-1165G7 11th gen Intel CPU, both with Xe GPU, which can
    drive up to four displays.


    The Kubuntu NX (https://kubuntu.org/spec/nx) supports up to 64GB of memory, and
    up to 2TB of NVMe storage, and up to 4TB of SATA storage and even with a bracket
    that allows you to mount the device to the back of your monitor.


    Other features include 2x Thunderbolt 3/USB-C with DisplayPort 1.4, 1x HDMI 2.0,
    1x Mini DisplayPort 1.4, 3x USB-A 3.2 Gen2, 1x RJ-45 Intel Ethernet I225-V 2.5GbE
    LAN, 1x audio jack, 1x Far-Field Array microphone, 1x SDXC media reader, and 1x
    Kensington Lock Mount.


    The base cost of Kubuntu NX is $695 and can be configured up to $1239 (with a
    Core i7, 64GB RAM, primary disk, and a 4GB secondary storage). Order your Kubuntu
    NX from https://kubuntu.org/order-nx/ now.


    # A New Release of Lightweight Distribution SparkLinux Now Available


    SparkLinux 6.4 is here. Based on Debian Bullseye, this lightweight distribution
    ships plenty of updates for packages such as Firefox, Thunderbird, VLC, LibreOffice,
    LXQt, Xfce, and KDE Plasma makes it possible to install a number of applications
    from Debian (to enjoy more recent releases).


    The latest release is up to date with both the Debian and Spark repositories (as
    of August 11, 2022).


    Out of the box, you''ll find apps such as Firefox up to date (version 91.0.0 is
    installed). Fortunately, those who prefer to use a more recent version of Firefox
    can install versions 103.0.2 or 102.1.0 from the Spark repositories (spark-firefox/spark-firefox-es).


    Users using early versions of SparkLinux 6.x can upgrade to the latest version
    with the command sparklinux-update.


    This new release is available for the following architecture:


    - armhf: LXQt, KDE Plasma, Xfce, Openbox, and text mode

    - i686: LXQt, Openbox, and text mode

    - amd64: Openbox and text mode


    To find out about SparkLinux 6.4, read the full release notes (https://sparklinux.org/spark-6-4/)
    and download a copy of the ISO for installation (https://sparklinux.org/download/).


