    # Configuring the HC-05


    The HC-05 always comes with the same preset username and password and with the
    transfer rate configured for data at a rate of 9600 baud. You can change that
    with a few # command. The easiest approach is a USB-UART adapter that supports
    3.3V. Alternatively, you can use the Raspberry Pi. However, its serial port operates
