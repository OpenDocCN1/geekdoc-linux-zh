    online role-playing game in which a large number of players interact simultaneously
    with a complex story and many episodes. In the game, your adventure starts on
    planet Atys.


    The planet is home to various peoples. The Kami are nature-loving shapeshifters
    and skilled mages. The Karavan, on the other hand, are highly technical people
    with powerful weapons.


    Both the Kami and Karavan help the homins, whose role the player assumes. The
    homins are divided into four nations. The Fyros are a warlike nation with their
    homes in the desert, and the craft-oriented Mates live in the forest. The Flyer,
    explorers and discoverers live by the sea. The Zorai also inhabit the jungle.


