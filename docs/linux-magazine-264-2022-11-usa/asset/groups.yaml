    \ defined in the sets. A long press on a button allows you to edit the entry format.\
    \ However, individual buttons cannot be hidden, nor can the font size be changed.\n\
    \nQuite a few apps in the Google Play store are based on the RFCOMM technology.\
    \ For example, special interest is the Bluetooth Panel (3), which dynamically\
