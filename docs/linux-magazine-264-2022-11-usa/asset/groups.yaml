    \n# MAKSPACE Bluetooth Communication\n\n![](img/6fa2087b693ca3fb8f29db760f956bc8_61_0.png)\n\
    \n# We use a Raspberry Pi, a Pi Pico, and a smartphone to communicate over Bluetooth.\
    \ By Bernhard Bablok\n\nBecause the Raspberry Pi comes with both WiFi and Bluetooth,\
    \ most programs choose to rely on WiFi. However, the Pi Pico is more of a wanderflower.\
    \ Bluetooth mixes things up makes Bluetooth a desirable option.\nBluetooth should\
    \ be a familiar technology by way of your smartphone, and this has been investigated\
