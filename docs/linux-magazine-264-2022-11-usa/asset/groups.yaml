    ## Tilings and Hybrids


    What is Again Tilings are graphical interfaces which open in a window. For the
    last decades, they were often ignored in the efforts to build desktop environments
    like Windows and macOS. However, in recent years, tiling desktops have become
    more popular because computing power means that users can choose a variety of
    tiling desktops, some of which are free. The idea behind tiling is to reduce clutter
    on the desktop and make windows easier to find. Stacking desktop windows in the
    upper left corner or other default layout allows unwanted windows to be dragged
    aside.


