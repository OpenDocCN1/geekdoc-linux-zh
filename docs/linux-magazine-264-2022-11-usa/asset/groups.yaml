    # # Backup Assistant


    Linux Android Backup offers an open solution to backing up the most important
    content from your Android devices in just a few steps. By Ferdinand Thommes


    backing up data from a Linux installation does not pose a problem for most users
    to try open source solutions for every scenario, from a single command line to
    GUI options. However, backing up Android devices like smartphones or tablets using
    Android 4 backup was only possible if the bootloader was unlocked, and unlocking
    was no easy task to prevent it. If you do unlock the bootloader, you may void
    your warranty, and even, carries the risk of bricking your device. An adequate
    backup would have made, is only possible after rooting.


    and still comes with the risk of bricking the device.

    Linux Android Backup (LAB), lightweight project developed on Github, offers an
    alternative to ADB (2). Under the hood, which consists of a small shell script
    and a Flutter app, greatly simplifies backing Android devices. LAB works virtually
    no intervention. LAB is open source software that could compromise your data.
    While the script is based on ADB, it does not use the deprecated backup command.
    Despite its name, LAB also works on macOS and Windows, in Linux and via WSL (3).
    In fact, the developers can look for a more suitable method.


    However, once you launch the script, LAB requires virtually no intervention. LAB
    currently backs up installed apps (in APK file format [4]), photos, videos, and
    other downloads. In contrast to the manual procedure via ADB, LAB also backs saved
    contacts in Card format by using a simple open source helper. You can submit suggestions
    for further data to be backed up as an issue on GitHub (2).

    The backed up data is accessed in an encrypted archive compressed with 7-zip,
    these remain cached even if the script stops working. You will need to install
    the 7zip-full, abd, curl and bc packages on your computer. Listing 1 shows the
    commands for doing this on Debian and Fedora.


    Starting with Android 4, abd backup [1] (which has been deprecated for security
    reasons) worked reliably without rooting, even between different manufacturers,
    by different methods or third-party apps. The only official tool for backups is
    Android Debug Bridge (ADB), which lets control Android devices using a computer
    with Linux, macOS, or Windows. ADB requires many manual steps


    # ## Keeping It Simple


    LAB aims to keep the backup of Android devices to just a few steps with minimal
    interaction with the user. To take the advantage of this simplicity, you will
    need to prepare your device out.


    Listing 1: Installing Dependencies


    ```

    ### Debian

    $ sudo apt update && sudo apt install 7zip-full abd curl bc

    ### Fedora

    $ dnf update --all && dnf install 7zip-plugins abd curl bc

    ```


