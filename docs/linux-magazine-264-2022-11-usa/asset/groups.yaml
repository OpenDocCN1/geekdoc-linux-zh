    # MakerSpace


    Using clean code principles for better code


    # Good Housekeeping


    Clean code principles can improve the readability of your source code, making
    life easier for both you and your users.


    By Martin Mohr


    Clean code is a set of rules and procedures that make it easier to read and understand
    source code regardless of the program-language used. Many clean code strategies
    fit all languages, but some far-reaching strategies only prove useful in the object-oriented
    world. The clean code concept is not new or revolutionary. Back in 2008, Robert
    C. Martin described the procedures in his book, *Clean Code: A Handbook of Agile
    Software-Craftsmanship* [1].


    Typically, the compiler doesn''t care about names you assign the individual program
    components. Whether you use uppercase as opposed to lowercase or underscore instead
    of CamelCase, as long as the names fit together, the compiler will build an executable
    program.


    With today''s highly complex IT applications, ensuring that source code has a
    clean structure that increases readability is important. The clean code concept
    has evolved in recent years, and the procedures described in Martin''s book have
    been expanded. To what you started writing clean code, I''ll describe some of
    the core ideas and rules of clean code.


    However, this freestyle kind of code can be difficult to read. In fact, you should
    stick to the style conventions that apply to the programming language you use;
    for example, class names should always start with an uppercase, while methods
    should start with a lowercase. Modern IDEs usually have a feature to automatically
    format source code. You should use this. If several people are working on a project,
    they need to agree on using the same format.


    # The Scout''s Rule


    # Mnemonic Names


    “Always leave code cleaner than you found it.” If you touch a heart, your project''s
    source code will get better over time. You don''t need to be afraid of anything,
    because the previous version can always be restored to the management system (i.e.,
    Git). Modern IDEs also provide many tools for engineering code. Renaming classes
    or methods should not pose so much of a risk as it used to.


    # Clean Code Principles


    A program should always use given mnemonic names for labels. Type-appropriate
    classes, methods, functions, and variables. The names should not be too long but
    will still describe precisely what is happening. You also need to keep in mind
    the variables'' range. It is perfectly fine to define when using top variables,
    like i, or j. And x, y, z are the most meaningful labels for a coordinate system.


    ![](img/6fa2087b693ca3fb8f29db760f956bc8_67_0.png)


    If a variable or object is used in a larger context, you should clearly define
    its name.


    # Comments


    In the end, unclean code needs more system resources. This results in users needing
    more power and polluting the environment. Environmental responsibility is obviously
    easier than saving virtual units.


    Avoid including the class name in the method name. All programmers should understand
    that a method works on the object on which the method is defined. While you should
    not use names as classes because they are redundant to include, consider avoiding
    abbreviations in the names; there are some exceptions to this (e.g., VAT).


    "If the compiler understands the code, so must the developer." This rule means
    that comments are unnecessary. This statement, which seems short-sighted at first
    glance, makes perfect sense in a slightly modified form of the code. If you need
    to add a comment to a program section, it usually means that the code is not clear
    enough.


    # Methods


    When it comes to using functions or methods, you can do many things to improve
    your code. Always choose meaningful names for the parameters and the return value.


    While it may sound peculiar at first, make your names pronounceable. You will
    be able to talk about a class in meetings or code reviews. Having overly complex
    or similar sounding names will make talking difficult.


    I can''t say you can''t use comments in your code. In fact, sometimes it is better
    to consider writing a comment in a more understandable way. However, it means
    not to describe what the variable is doing or to explain why.


