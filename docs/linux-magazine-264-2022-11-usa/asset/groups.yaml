    \ bare minimum in terms of technology in this article. The focus is on scenarios\
    \ where the Raspberry Pi, Pi Pico, and smartphones Bluetooth to\n\nThe Pico stands\
    \ in for most any microcontroller, as long as it supports serial communication.\n\
    \n### Basic Technology\nThe two prerequisites for Bluetooth communication between\
    \ parties are pairing and trust between the parties; after you establish both\
    \ once, the devices usually trust the relationship. After pairing, each of the\
    \ two parties can establish connection. The initiator is referred to as host and\
    \ the other as the device; however, each component can assume either role.\nThe\
    \ default user on the Raspberry Pi should be a member of the Bluetooth and dialout\
    \ groups; you can check their status with the 'groups' command. If you are missing\
    \ in one or both groups, make the change with the 'sudo'\n\n```\n[hablokb0pi13:]\
    \ > bluetoothctl\nAgent registered\n[DEFAULT] default-agent\nDefault agent request\
    \ successful\n[BLUE]# discoverable on\nChanging discovery: succeeded\n[CHG] Controller\
    \ BB:27:EB:DF:13:5C Discoverable\n[CHG] Controller BB:27:EB:DF:13:5C Discovering,\
