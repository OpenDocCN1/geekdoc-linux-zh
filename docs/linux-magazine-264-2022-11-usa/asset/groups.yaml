    # Fedora 37 Beta Available


    The next iteration of the Fedora 37 operating system beta and is now available
    to download and install. This was announced on Fedora Hyperkitty (https://lists.fedoraproject.org/test-announce@lists.fedoraproject.org/message=IDZNZYTFHOAVUSKLKIOSHHBBCJSLA)
    with the announcement that the first freeze for Fedora 37 will Tuesday, October
    4.


    In terms of features in Fedora 37, you could look for changes, such as updates
    to the LLVM 15 compiler, a preview of the new Anaconda Web installer, support
    for Raspberry Pi 4, Linux kernel 5.19 (the latest kernel), Gnome 43 (which includes
    a revamped Quick Session), a new GTK/Wayland port for files (which includes an
    interactive driver, rubberband selection), WebExtension API in Gnome web, high-resolution
    scroll wheel, direct سكان support (now also multi-monitor support), server-side
    collections, and as a reference KVM VM image.


    For those who want to test the new betas of Fedora 37, the default x86_64 version
    can be downloaded from the official Fedora server (https://dl.fedoraproject.org/pub/all/stage/37-Beta/Workstation/x86_64/iso).
    If you want try out one of the spins (such as Cinnamon, KDE Plasma, LXDE, LXGT,
    Mate, Xfce, or i3), they can be downloaded from the Spins (https://dl.fedoraproject.org/pub/all/stage/37-Beta-1/Spins/x86_64.iso).


    # Salix 15.0 Available for Installation with Updates and a More Modern Look


    Salix 15.0 is a distribution that is 100 percent compatible with Slackware and
    defaults to the Xfce desktop environment. The latest release offers new and only
    updates, including Xfce 4.16, GTK+3, Features 102 ESR, LibraryOffice 7.4, Gimp
    2.10, and Whiskermenu as the new default panel menu.


    According to the Salix developers, "there have been extensive discussions in our
    forums with respect to how the new release will look and everything has been revamped,
    a new GTK theme, a new window manager theme, and a default wallpaper..."


    Salix now both dark and light themes to help the modern look of the UI. Other
    features include desktop usage optimization, high-quality package repositories,
    fully localized system tools, and support for 32 and 64-bit architecture.


    New users should keep in mind that the installation of Salix is 100 percent-based,
    so it will take a bit of extra skill to get the operating system installed.


    Download and install a copy of Salix from the official download page (https://www.salix.org/download.html)
    and keep in touch about Salix from the distribution''s official blog (https://blog.salix.org).'
