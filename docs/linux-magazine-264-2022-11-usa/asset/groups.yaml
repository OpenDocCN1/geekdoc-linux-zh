- md: "\n## REVIEW\n\n## Distro Look - Rocky Linux\n\nWith many people joining the\
    \ Slack community, it was inevitably. Thousands of people were meeting Gregory\
    \ Kurtzer, the creator of Rocky Linux directly! The community broken into channels\
    \ for different aspects of what we needed to create. People joined the channels\
    \ they were interested in and for quality. From there, connection began, and the\
    \ project started to develop. With each channel, people started to serve as leaders\
    \ for each them. But after [a long time] occurred, people were not noticing anything\
    \ anyone else. Nobody checked out work, qualifications, gender, race, religion\
    \ or beliefs, and most people were using with cartoon avatars. People got where\
    \ they are within the Rocky organization based on their benefit and contribution\
    \ to the project.\n\nLong-term protection of the RESF and its projects is imperative\
    \ to maintain any community who were involved in projects with seemingly scale\
    \ shifted away their community's wishes. For example, CentOS was founded as part\
    \ of a 501(c) nonprofit organization. Other projects of the 501(c) do not offer\
    \ any more protection. For example, a 501(c)'s purpose is to protect the interests\
    \ of its sponsor (see 1.501(c) in 2021).\n\nLM: What features make Rocky Linux\
    \ stand out, especially for security and networking?\n\nRHEL Rocky is a bug-for-bug\
    \ compatible and free implementation of RHEL. Beyond compatibility and feature\
    \ parity, we are adding value with various security certifications like FIPS,\
    \ STIGs, Common Criteria, and others.\n\nWe can't stress enough how significant\
    \ it is to have a freely available open-source operating system pursuing a Federal\
    \ Information Processing Standard Publication (FIPS) for our cryptographic modules.\
    \ Rocky Linux will be the first community-driven operating system to have this,\
    \ and will be that all the cryptographic modules included in Rocky will have been\
