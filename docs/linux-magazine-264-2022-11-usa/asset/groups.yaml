    # Debian 11.5 与 Rocky Linux 9.0


    双面 DVD 上的两款精彩发行版！


    ![](img/6fa2087b693ca3fb8f29db760f956bc8_5_0.png)


    ## Debian 11.5 64位


    Debian 每隔几年发布一次版本，使得每次发布都是一次盛事。2021 年 8 月发布的 Debian 11 (Bullseye) 也不例外。不仅 Bullseye
    的 Homeworld 主题对于 Debian 来说异常复杂，该版本还改进了对 exFAT 文件系统的支持，以及可靠的蓝牙连接。


    一年后，11.5 版本的发布是对这一坚实基础的最新增强。Debian 11.5 包含了自上一个点版本以来发布的修复和安全更新。此外，该版本还包含数十个软件包的修复，包括
    dpkg、NVIDIA 驱动程序和 Debian 安装程序。


    与所有 Debian 一样，Debian 11.5 缺乏最新的软件，但提供了无与伦比的稳定性和安全性作为补偿。由于几乎三分之二的活跃发行版都是基于 Debian
    的，即使是一个点版本的发布在软件领域也是一个具有影响力的事件。


    ## Rocky Linux 9.0 64位


    Rocky Linux 的历史不足两年，但它正在迅速成为一个主要的 RPM 发行版，在人气上足以匹衡 Hat Enterprise Linux (RHEL)。Rocky
    Linux 有两个通用版本，尽管它们的版本编号在 CentOS 上继续，强调了其作为继承者的角色。


    Rocky 是 CentOS 停止开发转支持 CentOS Stream 时来自 CentOS 的发行版之一。正如它的致敬语，Rocky 的设计目标是“与
    Hat Enterprise Linux 100% 漏洞兼容”。两者都从相同的源代码构建。主要的区别在于，虽然两者都是企业级，但 Rocky Linux 强调一种
    RHEL 不具备的开发方式。对于企业和家庭用户来说，这是一个至关重要的区别。


    然而，技术差异正在显现。Rocky Linux 9.0 引入了 Bandit，这是一个从零开始构建 Rocky Linux 并扩展源代码的工具。未来几年可能会出现更多差异。同时，Rocky
    Linux 9.0 将支持到 2032 年。


    > 缺陷光盘将予以更换。请发送电子邮件至 subs@inlinux-magazine.com。

    尽管本 Linux Magazine 经过测试，且据我们所知没有恶意软件和缺陷，但 Linux Magazine 对使用本杂志可能导致的数据和计算机系统的中断、丢失或损坏不承担任何责任。


    # 开启你的 Web 开发第一步！


    ![](img/6fa2087b693ca3fb8f29db760f956bc8_6_0.png)


    ## Web 开发核心知识


    现代软件应用通常针对 Web 开发。Linux 专业协会（LPI）新的“Web 开发核心知识”计划支持你迈出软件开发的第一步。它包含了适用于培训和自学的学习材料。通过
    Web 开发核心知识考试后，你将获得一份证书来证明你的技能。


    LPI 学习材料可在 learning.lpi.org 获取。

    在 lpi.org/wde 了解有关该计划和考试的信息。


    # 新闻


    ### 技术、趋势和外观更新


    ### 本月新闻


    +08

    * Fedora 37 Beta 版已发布

    * Salix 15.0 可供安装，包含大量更新和新外观


    +09

    * Ubuntu 20.04.5 LTS 版本已发布

    * MX Linux 21.2 提供了改进和错误修复

    * Gnome 项目发布新的遥测收集工具

    * 更多在线


    +10

    * Kubuntu 聚焦新桌面模型

    * 轻量级发行版 SparkLinux 新版本已发布


    ## Fedora 37 Beta 版已发布


    Fedora 37 操作系统的下一次迭代 Beta 版现已供下载和安装。这一消息在 Fedora Hyperkitty (https://lists.fedoraproject.org/announce@lists.fedoraproject.org/?message=IDZNTFHOAVUSKLKI)
    上宣布，Fedora 37 的首次冻结将于 10 月 4 日。


    在 Fedora 37 的功能方面，你可以看到变化，例如 LLVM 的更新、新的 Anaconda 安装程序预览、支持 Raspberry Pi、Linux
    内核 5.19（最新内核）、Gnome 43（包含修订）、新的 GTK/Wayland 端口（包含高分辨率）、多显示器支持、服务器端集合以及 KVM 镜像。


    对于想要测试 Fedora 37 新 Beta 版的人，x86_64 版本可以从官方服务器 (https://dl.fedoraproject.org/pub/all/stage/37-Beta/Workstation/x86_64/iso)
    下载。如果你想尝试 spins（如 Cinnamon, KDE Plasma, LXDE, Xfce 或 i3），可以从 Spins (https://dl.fedoraproject.org/pub/all/stage/37-Beta/Spins/x86_64/iso)
    下载。


    ## Salix 15.0 可供安装，包含更新和新外观


    Salix 15.0 是一个完全兼容 Slackware 并默认使用 Xfce 桌面环境的发行版。最新版本提供了新更新，包括 Xfce 4.16、GTK+3、LibreOffice
    7.4、Gimp 2.10 以及默认面板。


    根据 Salix 开发人员，“对于新版本的界面，我们在论坛中进行了广泛讨论，经过了新的 GTK 主题、新的窗口管理器，Salix 现在提供深色和浅色主题以帮助现代外观。”其他功能包括桌面使用优化、高质量软件包仓库、完全本地化的系统工具以及对
    32 位和 64 位架构的支持。


    新用户应该记住，Salix 的安装是基于，因此需要一些额外技巧来安装操作系统。从官方下载页面 (https://www.salix.org/download.html)
    下载并安装 Salix，并关注官方博客 (https://salix.org)。


    ## Ubuntu 20.04.5 LTS 版本已发布


    正如你所期待，Ubuntu LTS 版本的下一个点版本已发布。虽然这次更新没有包含许多新功能，但也提供了大量的错误修复、安全补丁和 5.5 内核。


    如果你在使用 Ubuntu 20.04，可以通过内置升级获取 5.5 版本，这意味着不需要重新安装。


    需要注意的是，20.04 并不是 Canonical 操作系统的最新版本，将是 22.04。然而，由于仍有大量用户在使用 20.04（它将支持到 2025
    年 4 月），Canonical 希望提供一个点版本。


    这意味着，升级并不包含 20.04 的最新软件。LibreOffice 升级到 6.4 版本，Gnome 升级到 3.38，Firefox 升级到 90 版本。如果你需要更更新版本的软件，你需要运行发行版升级（从
    20.04 到 22.04）或手动安装。


    如果你不想安装 Ubuntu 20.04，可以从官方下载网站 (https://releases.ubuntu.com/focal/) 获取 ISO 并阅读完整的变更日志
    (https://ubuntu.com/Focal/Release/Changes-Summary-20.04) 获取更多信息。


    ## MX Linux 21 提供了改进和错误修复


    Distbox 上流行的发行版 MX Linux 的开发者发布了该发行版的第二个点版本。虽然最新的迭代并没有突破性的，但它包含了大量的错误修复和各种改进，有助于这个已经优秀的发行版。


    诞生于 Debian 11 (Bullseye) 的 Wildfox 提供了两种内核选项。常规内核使用 5.10，而高级硬件变体使用 5.15 内核。


    除了内核之外，MX Linux 栈得到了错误修复和改进：mower 现在允许禁用蓝牙适配器，mx-update/apt-notifier 现在有了备份选项，还增加了内核清理工具，mx-options
    现在包含一个 UI 管理工具，磁盘空间检查器确保在安装内核之前有足够的磁盘空间。


    关于之前的点版本，开发者表示：“如果你已经在运行，则无需重启。所有版本都通过常规更新通道可用。”


    从官方下载页面 (https://mx.linux.org/download-links/) 下载你的 MX Linux 21 版本，可以在 Xfce、KDE
    Plasma 和 Fluxbox 桌面之间进行选择。记得阅读发布说明 (https://mx.linux.org/blog/mx-21-point-2-release/)
    获取更多信息。


    ## Gnome 项目发布新的遥测数据收集


    虽然为了匿名而收集数据和测量值相当令人不安，特别是对于那些重视隐私的人来说，但 Gnome 基金会宣布将在桌面环境中添加一个遥测数据收集工具。


    首先，这些数据将是 100% 匿名的，并仅用于通过对软件的决策来改进 Gnome 桌面环境。这些决策将告知基金会如何更好地利用资源以及如何帮助用户。


