    \ Pico 和智能手机通过蓝牙通信的场景。\n\n只要支持串口通信，Pico 就可以代表任何微控制器。\n\n### 基础技术\n双方之间蓝牙通信的两个前提是双方之间的配对和信任；一旦你建立了这两者，设备通常就会信任这种关系。配对后，双方都可以建立连接。发起方称为主机（host），另一方称为设备（device）；然而，每个组件都可以承担其中一个角色。\n\
    树莓派上的默认用户应当是 `bluetooth` 和 `dialout` 组的成员；你可以使用 `groups` 命令检查其状态。如果你不在其中一个或两个组中，请使用\
    \ `sudo` 进行修改。\n\n```\n[hablokb0pi13:] > bluetoothctl\nAgent registered\n[DEFAULT]\
    \ default-agent\nDefault agent request successful\n[BLUE]# discoverable on\nChanging\
    \ discovery: succeeded\n[CHG] Controller BB:27:EB:DF:13:5C Discoverable\n[CHG]\
    \ Controller BB:27:EB:DF:13:5C Discovering, so\n[NEW] Device 50:A4:A8:BB:C7:C9\
    \ 64-D2-CF-D9\n[NEW] Device 50:A4:A8:BB:C7:C9 64-D2-CF-D9 Lite\n[HW] Device 50:A4:A8:BB:C7:C9\
    \ connected\n[HW] Connecting with 50:A4:A8:BB:C7:C9\n[CHG] Device 50:A4:A8:BB:C7:C9\
    \ Connected\nRequest confirmation\n[AGENT] pairing key 32482 (yes:no)\n[CHG] trust\
    \ 50:A4:A8:BB:C7:C9 Trusted: yes\nChanging 50:A4:A8:BB:C7:C9 trust succeeded\n\
    [BLUE]# exit\n```\n\n```\nsudo usermod -a -G bluetooth,dialout\n```\n\n图 1：配对与信任。开启并扫描后，你将看到所有设备及其\
    \ MAC 地址，取决于环境。对方将可见以便配对。在智能手机上，所需的设置在蓝牙部分。树莓派启动了一个受限的 shell。帮助命令调用了概述。\n\n62\
    \ NOVEMBER 2022 ISSUE 264 LINUX-MAGAZINE.COM\n\n# MAKSPACE 蓝牙通信\n\n按下 Tab 键可以完成命令并显示\
    \ MAC 地址，这节省了大量的输入工作。\n独立地，你可能还需要检查几个重要参数。与其使用编辑器或 SSH，你可以使用智能手机或平板电脑运行蓝牙 [2]；iOS\
    \ 同样可用。\n\n# 系统要求\n此外，树莓派必须满足一些系统要求。智能手机、Pi Pico 和树莓派之间的通信依赖于串口 (SPP)、射频通信 (RFCOMM)\
    \ 以及链路适配协议 (L2CAP)。这些协议是蓝牙的一部分。你可以从应用菜单访问配对设备。对于这一点，树莓派必须等待连接。\n\n```\nsudo rfcomm\
    \ listen0\n```\n\n其他协议如文件传输协议 (FTP) 或对象交换 (OBEX) 也依赖于 RFCOMM。要在树莓派上启用蓝牙，需要带 `-c`\
    \ 选项启动蓝牙守护进程。为此，请将 `/lib/system/bluetooth.service` 服务定义复制到 `/etc/system/` 并替换\
    \ `ExecStart` 行。\n\n```\nExecStart=/usr/lib/bluetoothd -c\n```\n\n```\nExecStartPost=/bin/hcd\n\
    ```\n\n第二行将 SPP 添加到可用协议列表中。现在，在末尾输入符号 `&` 将命令发送到后台并释放控制台输入。图 2 显示了连接后的通信原理。平板电脑（右侧）连接到树莓派并用于读取\
    \ `/dev/rfcomm`（左侧）。这同样有效。树莓派写入 `/dev/rfcomm`，输出出现在平板电脑（绿色）。一旦建立连接，是谁设置并不重要。数据始终是双向的。由于应用程序中的错误，树莓派显示了回显。手动执行图\
    \ 2 中的步骤，使用列表 1 中的设备定义。等待参数的作用类似于 `listen`。建立连接后，RFCOMM 启动脚本。如果连接失败，RFCOMM 将重启守护进程。\n\
    \n```\nsudo rfcomm listen\nsudo rfcomm restart bluetooth.service\n```\n\n第一个应用程序是电视上的媒体播放器。如果运行良好，检查日志：\n\
    \n```\nWaiting for connection on channel 1\nConnection from 05:44:B8:C7:09 to\
    \ /dev/rfcomm0\ncat /dev/rfcomm0\nhang\nHello from the tablet\nPlease send me\
    \ the name\n```\n\n```\necho \"Hello from the Pi\" > /rfcomm0\necho \"My hostname\
    \ is $(hostname)\" > rfcomm0\n```\n\n![](img/6fa2087b693ca3fb8f29db760f956bc8_62_0.png)\n\
    \n图 2：树莓派与安卓平板电脑通过蓝牙的通信流。\n\n# MAKERPACE 蓝牙通信\n\n# 列表 1：服务定义\n\n[Unit]\nDescription-BT-Control\
    \ service\nAfter-bluetooth.service\nRequires-bluetooth.service\n\n[Service]\n\
    ExecStart=/usr/bin/rfcomm listen 1 /usr/local/sbin/bt-control.sh\n\n[Install]\n\
    WantedBy-multi-user.target\n\n简单的 shell 脚本，但任何其他编程语言也一样。脚本持续从 RFCOMM 接口（第 18 行）读取，并从第\
    \ 3 行开始的 `process_request()` 函数处理保留的命令。\n\n基于安卓应用的视图只需通过将命令直接分配给按钮（图 3）来实现。行数由集合定义。长按按钮允许你编辑条目格式。然而，无法隐藏单个按钮，无法更改字体大小。\n\
    \nGoogle Play 商店有很多应用是基于 RFCOMM 技术的。例如，特别感兴趣的是蓝牙面板 (3)，它根据树莓派或微控制器发送的数据动态创建界面。\n\
    \n# 列表 2：控制程序\n\n```bash\n#!/bin/bash\n\nprocess_request() {\n  case \"$1\" in\n\
    \    \"hostname\" hostname -f $2 >$3;\n    \"mem\" free -h $2 >$3;\n    \"disk\"\
    \ df -h $2 >$3;\n    echo \"Unknown $1\" >$3;\n  esac\n}\n\n# 主程序\n\n# 打开设备进行读写\n\
    exec 3<</dev/rfcomm0\n\nwhile true; do\n  if read -u 3 request; then\n    process_request\
    \ \"$request\"\n  else\n    break\n  fi\ndone\n\n# 关闭文件描述符\nexec 3>&-\n```\n\n"
