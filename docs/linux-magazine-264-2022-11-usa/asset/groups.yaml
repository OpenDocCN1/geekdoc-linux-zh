    # Sound tracker


    # Furnace


    effects and sound control. With a small shim to handle audio hardware, this data
    could be played on 1980s hardware directly from memory and without modification,
    creating beautiful chipune music that uses very little RAM and CPU resources.
    These limitations forced the invention of trackers, and in so, creating some incredible
    distinctive chipune sounds that thrive to this day, in any age of seemingly limited
    storage and compute power.


    including the venerable Radium and Schism trackers (and the amazing commercial
    Renose). It''s uncommon to see an entirely new open source project appear, and
    utterly remarkable to find one that also allows the sound of every sound chip
    of that early era. And what this Furnace is and does. Furnace is a tracker that
    includes sounds to emulate various sound chips, with individual parameters, which
    can all be controlled through the data view. It includes FM modules from the Sega
    Genesis, arcade machines, and many PC sound cards, plus playback chips found in
    the Commodore Amiga, beeps from the ZX Spectrum and Game Boy, plus recreations
    of the Commodore 64 SID chip and Mickey in the Atari Lynx.


    Necessity is the mother of invention, but there are few examples of this in music.
    A tracker is little more than a scrolling of hexadecimal values, with each column
    representing a group of sound or instrument. Each row in each column is a potential
    pitch value, with additional columns inside it used for a few trackers still being
    developed for Linux. Each system is added on the File menu. The number of groups
    corresponds to the capabilities of the device, such as four channels for the Amiga
    or two for the SID chip. The groups within each column also represent the unique
    characteristics for that device, such as waveform, cutoff filter, envelope, or
    amounts. This is brilliantly documented for each system in the online reference
    guide and makes complete if you''re already familiar with trackers. There is also
    an independent editor where you set these parameters to create and save. The end
    result is a chipune powerhouse where you can summon the sound of almost any system
    and program music with full control of all its attributes. By now mentioned oscillators,
    filters, and even a sample that can be opened alongside your composition, the
    whole can then be exported to any format or as a scene (which you can''t import
    yet). It''s highly comprehensive and fun to play with:


    - 1. Sequencer: Set low levels, can be built from sequences.

    - 2. Oscilloscope: waveform of the output for each track.

    - 3. Tracks: These are the heart of Furnace and emulate most popular audio from
    1980s.

    - 4. Global: Set the tempo, pattern, and song length.

    - 5. Instrument: this is what you use in the editor to tune the capabilities of
    each sound.

    - 6. Pattern: this adds all kinds of modulation and effects to the tracks with
    extra columns.


