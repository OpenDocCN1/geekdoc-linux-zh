    # Rocky Linux


    # Replacing CentOS


    Rocky Linux steps into the breach left CentOS with a community-based alternative
    to RHEL. By Bruce Byfield


    LM: What were the goals before starting Rocky Linux?


    Red Hat bought CentOS in 2014, but largely ignored it for years. Essentially,
    CentOS was the community version of Red Hat Linux (RHEL), both deriving from Fedora.
    Then, in December 2020, Red Hat announced that CentOS would be discontinued, and
    it would be replaced by CentOS Stream. Within days, Rocky Linux, named after Gregory
    Kurtz, CentOS founder McGaugh, was announced [1]. Rocky Linux released its first
    version. Now CentOS, it offers a community-based alternative to RHEL.


    got the development team to collaborate on answers. Here''s what the RESF development
    team has to say about Rocky Linux.


    RL: The primary goal of the Rocky project is to produce a free, community-driven,
    bug-free rebuild of RHEL. I am particularly dedicated to operating in an open,
    transparent, and reproducible manner that ensures community participation and
    retention. We are committed to enriching the entire Enterprise Linux ecosystem
    with open processes and tools, beyond just adding another distribution to the
    market.


    Linux Magazine (LM): What were the relations between Red Hat and CentOS lead to
    the discontinuation of CentOS?


    Rocky (RL): There were no formal relations or communication between Red Hat, CentOS,
    and members of the Rocky Linux project/prior to the discontinuation of CentOS.
    We were all surprised when Gregory Kurtz, one of the original CentOS founders,
    announced to build a project within hours of the “CentOS Project” shift focus.


    RL: How does Rocky Linux compare to CentOS and to other spin-off Enterprise Linux
    distributions in terms of features, and popularity?


    Recently, since Rocky''s current started to speak Blaine Clemens, the project
    manager at the Rocky Enterprise Software Foundation (RESF), we


    Aside from what we previously mentioned, a lot of effort was put into ensuring
    that CentOS would not happen to Rocky Linux. We had to build an independent organizational
    structure with proper checks and balances, as well as a provider-agnostic infrastructure
    that doesn''t depend on the whims of a sponsor or person. The infrastructure for
    Rocky Linux was built from scratch. Special care was taken to ensure no control
    by any individual or company. The development requirements we leverage are open
    and freely available. We refuse to release all software unless it can be reproduced
    with open and free tools. We use free technologies such as distributed key to
    achieve community ownership and control of our security


    ![](img/6fa2087b693ca3fb8f29db760f956bc8_33_1.png)


    Figure 1: Rocky Linux is one of the main CentOS replacements.


