    # Accessing iTunes XML metadata with Python


    Unlock Your iTunes Data


    Read and manipulate data from your iTunes XML in order to share music metadata
    between applications and across devices.


    BY JOHN COFIELD


    The Extended Markup Language (XML)[1] is a widely used markup language and text
    file for storing and exchanging data. A wide variety of applications, including
    Apple iTunes, use XML for storing or exchanging data. In this article, I will
    show you how to use Python to read and manipulate data from an iTunes [2] XML
    file.


    queries. Some applications use proprietary formats to get optimum performance
    and efficiency but limit access with proprietary products. The iTunes .itls format
    is open. On the other hand, there is more of emphasis on wide adoption and ease
    of development in this open format.


    # iTunes Library Format


    iTunes divides its content into separate categories: media and metadata. Media
    (music and video) are saved in separate files from metadata. Throughout the rest
    of this article, I will focus on music information – artist, song, album title
    track number genre year – and metadata. The iTunes metadata files have either
    a .itl or .xml extension (1).


    Apple has historically used XML files to export library and playlist metadata.
    While the native format of the iTunes library is a file with a .itls extension,
    many users prefer to export a subset of the library, to a XML copy of it via Advanced
    preferences or via the File Export method. If you export, the File Export method
    allows you to save playlists to


    # Why Choose XML?


    If you are a music lover, there may be times when you want to exchange metadata
    between a variety of digital devices. In this case, I have imported iTunes metadata
    into database to run SQL


    Advantages of the XML format are that it is both human-readable and machine-readable.
    The benefit of being able to easily inspect and diagnose the data with a simple
    text editor makes it easy for applications to access the metadata through an application
    procedure interface (API). Many applications that we use every – text editors,
    word processors, spreadsheets, editors, and graphics – either use XML or exchange
    data with other applications.


    ![](img/6fa2087b693ca3fb8f29db760f956bc8_91_0.png)


    Python XML Module

    The Python standard library has structured markup tools that include modules for
    processing XML. In this article, I will describe how metadata in iTunes files
    is organized and how to use the Python .etree.Element[3] to navigate and access
