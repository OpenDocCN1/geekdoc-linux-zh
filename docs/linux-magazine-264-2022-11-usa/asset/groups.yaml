    Criteria 等各种安全认证增加了价值。


    我们无论如何强调，让一个免费的开源操作系统为我们的加密模块追求联邦信息处理标准出版（FIPS）是多么地重要的。Rocky Linux 将是第一个具有此标准的社区驱动型操作系统，并将确保在
