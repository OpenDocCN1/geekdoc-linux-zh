    # LINUX DOGHOUSE – 移植性成本


    # MADDOG’S DOGHOUSE


    Jon "maddog" Hall 是一位作家、教育者、计算机科学家和自由软件先驱。自 Linux Torvalds 首次促成 64 位系统移植以来，他一直是
    Linux 的热心倡导者。他担任 Linux International 的主席。


    # 从一开始就减少 CPU 开销可以帮助你降低成本并随着时间的推移实现移植性的最大化。


    作者：JOHN "MADDOG" HALL


    # 保持敏捷


    几年前，云计算出现了。其中其中最早的供应商之一是亚马逊，他们利用圣诞季节期间的数据峰值，这使得他们拥有服务器容量，可以向需要它的公司出售互联网弹性服务器计算服务，而价格仅为小型公司提供此类服务成本的一小部分。这是一场行业革命。


    几乎一夜之间（至少大多数）公司开始将服务器计算外包给其他公司（AWS、Google 等），这些公司拥有完成工作所需的硬件、员工、物理空间等。


    我一直倡导在初创公司成立时使用这些云服务。在开放空间，你可以建立自己的服务器农场，也可以使用他人的服务。


