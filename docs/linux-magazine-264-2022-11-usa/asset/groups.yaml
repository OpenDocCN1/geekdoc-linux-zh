    the breakout. The LED should show flash. See the pattern on devices: in mine,
    it was a double flash between two intervals. Although the transfer rate in data
    mode is 9600 baud, the HC-05 operates in command mode. You can connect to the
    terminal program of your choice with


    ```

    $ minicom --echo CRLF -E /dev/ttyUSB 38400

    ```


    and then execute the following commands to configure the:


    01 --- Monitor on /dev/ttyUSB 38400,1

    02 --- Quit:Ctrl+A

    03 --- Menu:Ctrl+T

    04 --- Help:Ctrl+H

    05 --- AT

