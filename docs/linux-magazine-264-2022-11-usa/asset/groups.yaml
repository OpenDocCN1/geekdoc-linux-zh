    # 新闻


    ## Linux 新闻


    新工具是一个名为 `gnome-info-collect` 的命令，它会在传输数据之前向用户展示所有收集的数据。一旦运行该命令，系统将要求你确认传输信息，传输成功后，系统将感谢你帮助改进
    Gnome。


    包含的信息类型包括：操作系统、硬件供应商、是否启用 Flatpack/Flathub、已安装的应用、文件共享（活跃/非活跃）、远程登录（活跃/非活跃）、用户数量、默认浏览器以及已启用的扩展。不会包含任何本地信息或任何可能传输给
    Gnome 开发人员的敏感内容。


    你可以通过 Snap、DNF、Pacman 或 Zypper 安装该工具。欲需更多信息，请查看该项目的官方 GitLab 页面（https://gitlab.gnome.org/vstanek/gnome-info-collect）。


    # Kubuntu 焦点宣布新款桌面型号


    Kubuntu NX 是一款新型小型规格桌面电脑，搭载 Kubuntu 22.04 和最新的 KDE Plasma 界面出货。这台新机器可以配备 i5-1135G7
    或 i7-1165G7 第 11 代 Intel CPU，两者均带有 Xe GPU，可以驱动多达四个显示器。


    Kubuntu NX (https://kubuntu.org/spec/nx) 支持最高 64GB 内存、最高 2TB 的 NVMe 存储以及最高 4TB
    的 SATA 存储，甚至配备了一个允许你将设备安装在显示器背后的支架。


    其他功能包括：2x Thunderbolt 3/USB-C（带 DisplayPort 1.4）、1x HDMI 2.0、1x Mini DisplayPort
    1.4、3x USB-A 3.2 Gen2、1x RJ-45 Intel 以太网 I225-V 2.5GbE LAN、1x 音频接口、1x 远场阵列麦克风、1x
    SDXC 媒体器以及 1x 笔记本锁孔。


    Kubuntu NX 的起价为 695 美元，配置最高可达 1239 美元（配备 Core i7、64GB RAM、主硬盘和 4GB 次级存储）。现在就从
    https://kubuntu.org/order-nx/ 订购你的 Kubuntu NX。


    # 轻量级发行版 SparkLinux 新版本已发布


    SparkLinux 6.4 现已发布。基于 Debian Bullseye 的轻量级发行版提供了 Firefox、Thunderbird、VLC、LibreOffice、LXQt、Xfce
    和 KDE Plasma 等软件包的大量更新，允许从 Debian 安装许多应用程序（以体验更发布版本）。


    最新版本已同步 Debian 和 Spark 仓库（截至 2022 年 8 月 11 日）。


    开箱即用，你会发现 Firefox 等应用都是最新版本（安装了 91.0.0 版本）。幸运的是，倾向于使用新版本 Firefox 的用户可以从 Spark
    仓库（spark-firefox/spark-firefox-es）安装 103.0.2 或 102.1.0 版本。


    使用 SparkLinux 6.x 早期版本的用户可以使用 `sparklinux-update` 命令升级到最新版本。


    此新版本适用于以下架构：


    - armhf: LXQt、KDE Plasma、Xfce、Openbox 和文本模式

    - i686: LXQt、Openbox 和文本模式

    - amd64: Openbox 和文本模式


    欲了解 SparkLinux 6.4 的信息，请阅读完整的发布说明（https://sparklinux.org/spark-6-4/）并下载 ISO 副本安装（https://sparklinux.org/download/）。


