    # 机器学习


    ……到一个指标。一旦你建立了一个指标，你就可以开始了，机器学习算法将从数据中进行分组。例如，这些组可能是客户群体。


    形成分组的意义何？首先，分组可以帮助你确定购买行为或提供建议。对于许多应用来说，你不需要监督学习所要求的分类器。如果你想对具有具有相似行为的类进行分类，你可以从其中一种或另一类方法中得出结论，并利用这些结论来创建推荐系统。


    你可以从决策的不同视角中识别出出现的群体。这可能意味着将监督学习作为科学过程的替代方案，其优势是可以使用分类法将数据分为不同的组。一个缺点是它对它们之间的关系衡量较少。


    分组的反面也很有趣。在这种情况下，你将创建小组，但你对小组本身并不感兴趣，而是关注离群值。一个潜在的缺点是检测违规和尝试欺诈的行为。


    在某些系统中，如果一个人的行为与众不同，这可能是可疑活动的信号。然而，你能够捕捉到这种行为是如何工作的。


    例如，对于完整的数据，你会立即注意到这种异常。初始过滤不是自动的。拥有限制性权限的用户可能会突出最可疑的行为：在异常时间工作、合并他人的文件。有必要过滤掉这些离群值，以便找到真正有趣的信息。


    # 强化学习


    监督学习和无监督学习最好被看作是为输入分配输出、类别、值或聚类的函数。相反，强化学习代表的是一个具有方法的对象，即一个在自己的环境中自主运行的代理（agent）。它可以是一个机器人，也可以是广网上的机器人或类似的程序。该代理遵循一种策略，该策略通常用希腊字母
    pi 表示。


    强化学习并不是硬编码在计算机中的。代理从数据中学习。这与监督学习或无监督学习中使用的数据不同。在监督学习中，系统在很大程度上受到正确答案的引导。在无监督学习中，代理必须根据自己的特征做出决策。


    强化学习介于两者之间。通过基于奖励的反馈（通常称为奖励），代理的目标是获得可能的奖励。当然，这个目标不是通过一步完成的而是在整个任务中获得奖励（图 3）。代理不会获得关于如何做正确事的建议，但它会获得反馈信号。然而，人类可能会忽略最佳实践。如果他们不能，他们就可以在实践中学到。


    考虑一个孩子和父母的例子，他们很容易接受关于风险的任何教导。目标是一只红鸟，但你没有告诉他们为什么。只有当他们找到它时，你才以赞扬的形式给予反馈。反馈越好，代理越优秀。无论你是否正确，通过给出不同程度的奖励（负面或奖励），或两者的混合，在这种情况下，我将坚持使用不那么激进但无偏见的锚点。


    强化学习的一个例子是何时给出正面或负面反馈。例如，你可以留在房间里，每当孩子从房间里拿东西并放在杯子里时，就给他们饼干。代理/孩子将理解这是一种想要的行为。你也可以在很长一段时间内提供任何反馈，直到最后给予等同于清理出房间数量的饼干。在这种情况下，这种行为将学会接受这种交易。


    所以你应该在尽可能远的地方提供反馈吗？遗憾的是，这并不简单。毕竟，代理的目标不是清理房间——而是获得可能的奖励。为了做到这一点，代理需要找到获得最高收益的策略。你手头的目标是学习解决现实问题的策略。这两种情况之间通常存在差异。


