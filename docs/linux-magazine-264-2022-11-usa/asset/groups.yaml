    \n![](img/6fa2087b693ca3fb8f29db760f956bc8_1_0.png)\n\n## 高级商务超薄笔记本变工作站\n\n###\
    \ TUXEDO InfinityBook 14 - 第7代\n\n- **Intel Core i7-12700H**\n  14核心 | 20线程\n\
    - **3K OMNia 显示屏**\n  16:10 | 2880 x 1800 像素\n- **最大 99 Wh 电池**\n  续航时间长达 16 小时\n\
    - **镁合金机身**\n  1.7 cm 薄 | 1.3 kg 轻\n- 100% Linux 支持\n- 5 年质保\n- 德国制造\n- 本地支持\n\
    \n![](img/6fa2087b693ca3fb8f29db760f956bc8_1_1.png)\n\n# 野狗 (WILD DOGS)\n\n亲爱的读者：\n\
    \n描写那些可怕和恼人的事情很容易，它们每天都在发生，但更重要的是指出那些积极的事情，而以太坊合并（The Merge）是一件积极的事。正如我在文中提到的，这项技术存在缺陷和问题，它们就像一种入侵物种——在没有任何自然防御的情况下破坏森林。批评者称之为“异议”，并认为通过新技术实施它是错误的，我们将再次告诉你们。公平地说，当我们发布并改进这些入侵物种时，小扰有时是有帮助的（在我们居住的地方）。加密货币是我们在没有任何计划的情况下释放技术的良好示例。\n\
    \n正如我们在 2022 年 5 月期中所描述的，“比特币挖矿一直处于高位——消耗的能量与德国相当——而且随着比特币的普及逐年增长。回顾最近的一项研究，如果你将比特币挖矿的总成本除以挖出的比特币总数，你会得到超过\
    \ 100 美元的成本——如果你只是买杯咖啡。”我提到这一点是为了提供背景，我认为很重要，以太坊可以完成合并——迁移到一个全新的、更环保的加密挖矿模型。以太坊始于一种疯狂的工作量证明模型（proof-of-work），这种模型从未为了大规模全球经济设计。工作量证明模型是一个充满了数千个同时挖矿的\
    \ GPU 服务器场。工作量证明模型像是一个野狗的场；当你把一个区块投入该场中心时，所有的狗都会逃离。\n\n正如大家所看到的，比特币作为一个缺失且神秘的创造者，似乎正随着工作量证明模型而运行，但以太坊社区已付出的努力解决更高效的权益证明模型（proof-of-stake）问题，他们估计可以节省\
    \ 99% 的能量。相比之下，比特币消耗的能量根据以太坊网站的数据，比 2019 年高出约 45 倍。\n\n值得注意的是，其他加密货币也存在（查看 LeafScore\
    \ 网站上的稳定加密货币列表）。然而，其他加密货币在比特币之后运行，其灵活的设计在不久的未来可能轻松超越比特币。\n\n以太坊的治理就像以太坊协议构建的（在许多方面如此），该组织更像是一个开源项目，由一组核心开发者和多级贡献者参与各种项目和验证。权益证明的工作必须是一项艰巨工程，需要许多人离开舒适区并作为一个社区。为了实现这一点，他们必须对权益证明的设计细节达成共识，发布测试网，确保完美，然后与现有的区块链合并（这就是为什么他们称之为合并）。\n\
    \n目前看起来良好，但我们仍然处于以太坊的新时代。复杂情况可能会发生，以太坊社区值得关注，感谢那些在花园里运行的人。\n\n![](img/6fa2087b693ca3fb8f29db760f956bc8_2_0.png)\n\
    \nJoe Casad\n主编\n\n+ 信息\n[1] 金矿热：加密挖矿对环境的影响，Jack Wall 和 Joe Cole 著，《Linux 杂志》，2022年5月期，https://www.linux-magazine.com/issues/2022/28/The-Environment-Impact-of-Mining/\n\
    [2] 以太坊能源消耗：https://ethereum.org/en/energy-consumption/\n[3] 2022年28种最稳定加密货币：https://leafscore.com/blog/the-most-stable-cryptocurrencies-for-2021/\n\
    [4] 以太坊治理介绍：https://ethereum.org/en/governance/\n\nLINUX-MAGAZINE.COM | LINUXPROMAGAZINE.COM\
