    [AGENT] pairing key 32482 (yes:no)\n[CHG] trust 50:A4:A8:BB:C7:C9 Trusted: yes\n\
    Changing 50:A4:A8:BB:C7:C9 trust succeeded\n[BLUE]# exit\n```\n\n```\nsudo usermod\
    \ -a -G bluetooth,dialout\n```\n\nFigure 1: Pairing with trust. After power on\
    \ and scanning, you will see all different devices and their MAC addresses depending\
