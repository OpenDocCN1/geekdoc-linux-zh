    \ 1 LINUXPROMAXAGAZINE.COM\n\n# Bluetooth Communication MAKERSPACE\n\nPress Tab\
    \ completes commands and Bluetooth MAC addresses, which saves a great deal of\
    \ typing.\n\nrestart the server. Independently, you might also need to check a\
    \ couple of important parameters. Instead of using an editor or SSH, you can use\
    \ a smartphone or tablet. Android runs the Serial Bluetooth Terminal [2] app for\
    \ your purpose; similar app is available for iOS as well.\n\n# System Requirements\n\
    In addition the Raspberry Pi must meet a few system requirements. Communication\
    \ between the smartphone, Pi Pico, and Raspberry Pi relies on the serial port\
    \ (SPP) as the radio frequency communication (RFCOMM) over Logical Link and Adaptation\
    \ Protocol (L2CAP). This protocol is part of Bluetooth. You can access the paired\
    \ devices from the apps menu: clicking on a device starts the connection. For\
    \ this, the Raspberry Pi must wait for a connection.\n\n```\nsudo rfcomm listen0\n\
    ```\n\nOther protocols such as the File Transfer Protocol (FTP) or Object Exchange\
    \ (OBEX) also rely on RFCOMM. OBEX is used by smartphones for direct exchange.\n\
    To have Bluetooth available on the Raspberry Pi, you need to start the Bluetooth\
    \ daemon with the -c option. To do this, copy the service definition from /lib/system/bluetooth.service\
    \ to /etc/system/. replace the ExecStart line\n\n```\nExecStart=/usr/lib/bluetoothd\
    \ -c\nExecStartPost=/bin/hccd\n```\n\nThe second line adds SPP to the catalog\
    \ of available protocols. Now, enter: the ampersand (&) at the end sends the command\
    \ into the background and frees up the console for input again. Figure 2 shows\
    \ the principle of communication after the connection is established. The tablet\
    \ (right) connects to, and the Raspberry Pi uses to read them from /dev/rfcomm\
    \ (left). This also works the other around. The Raspberry Pi writes to /dev/rfcomm,\
    \ and the output appears on the tablet (green). Once the connection is established,\
    \ it doesn't matter who set up. The data is always bidirectional. Because of an\
    \ error in the app, the echoes are showed from the Raspberry Pi. To make the steps\
    \ manually on Figure 2, use a device with definition from Listing 1. The wait\
    \ argument works like listen. After establishing the connection, RFCOMM starts\
    \ the script. With a connection failure, RFCOMM returns to restart the daemon.\n\
    \n```\nsudo rfcomm listen\nsudo rfcomm restart bluetooth.service\n```\n\nThe first\
    \ application is a media player on the TV. If it works well, check logs\n\n```\n\
    Waiting for connection on channel 1\nConnection from 05:44:B8:C7:09 to /dev/rfcomm0\n\
    cat /dev/rfcomm0\nhang\nHello from the tablet\nPlease send me the name\n\n```\n\
    echo \"Hello from the Pi\" > /dev/rfcomm0\necho \"My hostname is $(hostname)\"\
    \ > /dev/rfcomm0\n```\n\n![](img/6fa2087b693ca3fb8f29db760f956bc8_62_0.png)\n\n\
    Figure 2: Communication flow from the Raspberry Pi and an Android tablet over\
    \ Bluetooth.\n\n# MAKERPACE Bluetooth Communication\n\n# Listing 1: Service Definition\n\
    \n[Unit]\nDescription-BT-Control service\nAfter-bluetooth.service\nRequires-bluetooth.service\n\
