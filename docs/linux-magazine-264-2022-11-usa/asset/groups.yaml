    Tilings and Hybrids: What is Old New Again


    Tilings are graphical interfaces which open in a window. They appeared early in
    the history of GUI, and have always been popular. For the last two decades, they
    were often ignored in the efforts to build desktop environments like Windows and
    macOS, and to improve usability. However, in recent years, tiling desktops have
    become more popular, likely because computing power means that more users are
    working with open windows. Today, users can choose a variety of tiling desktops,
    some of which are free of charge.


    The idea behind tiling is to reduce clutter on the desktop and make windows easier
    to find. The standard or stack desktop becomes less orderly with each open window.
    Stacking desktop windows in the upper left corner or some other default layout
    allows the unwanted windows to be dragged aside, destroying what little order
    existed.


