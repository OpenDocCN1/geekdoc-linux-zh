    # Ubuntu 20.04 LTS Release Now Available


    As you might expect, the next point release available for the LTS version of Ubuntu.
    Although this update does not include much in the way of new features, it also
    offers plenty of bug fixes, security patches, and kernel 5.5.


    If you''re already using Ubuntu 20.04, you can get the 5.5 release by way of the
    built-in upgrade, which means there''s no need to do a fresh install.


    One thing to keep in mind is that 20.04 is not the latest release for Canonical
    flagship operating system. That will belong to 22.04. However, because there are
    still a large number of users working with 20.04 (and it is still supported until
    April 2025), Canonical wants to provide a point release.


    That being, the 5 upgrade does not include the latest, greatest software for 20.04.
    LibreOffice upgrades to version 6.4.1, Gnome at 3.38, and Firebox is at version
    104. If you need even more updated versions of software that, you''ll need to
    run a distribution upgrade (from 20.04 to 22.04) or install manually.


    If you''d rather not install Ubuntu of 20.04, you can get the ISO from the official
    download site (https://releases.ubuntu.com/focal/) and read the full changelog
    (https://ubuntu.com/Focal/Release/Changes-Summary-20.04) for more info.


    # MX Linux 21 Offers Improvements and Bug Fixes


    The developers of the most popular distribution on Distrowbox, MX Linux, have
    unleashed the second point release for the distribution. Although there''s anything
    groundbreaking with the latest iteration, it includes plenty of bug fixes and
    various improvements to help an already outstanding distribution.


    Wildfox, born of Debian 11 (Bullseye), comes with two different options for the
    kernel. The regular kernel uses 5.10, whereas the Advanced Hardware variant uses
    5.15 kernel.


    Beyond the kernel, MX Linux received bug fixes and improvements for the in-stack:
    mower now allows the disabling of bluetooth adapters, mx-update/apt-notifier now
    has an option to use as backup, the kernel cleanup tool was also added, mx-options
    now includes a UI management tool, and the disk space checker ensures there''s
    enough disk space before a kernel is installed.


    As far as regarding the previous point release, the developers stated, "If you''re
    already running no to restart. Releases are all available through the regular
    update channel."


    Download your copy of MX Linux 21 from the official download page (https://mx.linux.org/download-links/)
    with a choice between Xfce, KDE Plasma, and Fluxbox desktop. Make sure to also
    read the release notes (https://mx.linux.org/blog/mx-21-point-2-release/) for
    more info.


    # Gnome Project Releases New Telemetry Data Collection


    Although the collection of data and measurements for the purpose of anonymity
    is a rather touch, especially for those who value their privacy, the Gnome foundation
    has announced it will be a telemetry data collection tool to the desktop environment.


    Before anyone, this data will be 100% anonymous and will be used only to improve
    the Gnome desktop environment by various decisions for the future of the software.
    These decisions will inform the Gnome Foundation where resources can be best used
    and how to help better users.


