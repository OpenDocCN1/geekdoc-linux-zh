    # COVER STORY


    Unsupervised Learning


    ![](img/6fa2087b693ca3fb8f29db760f956bc8_25_0.png)


    # Finding problems using unsupervised image categorization


    # # Needle in a Haystack


    The most tedious part of supervised learning is providing sufficient supervision.
    However, if the samples come from a restricted sample, unsupervised learning might
    be fine for the task. By Garry Tuohy


    In any classification project, it is certainly possible to get someone to review
    a number of images and build a classification list. However, when entering a new
    domain, it can be difficult to identify domain experts for classification upon
    which all can agree. This is true regardless of whether you are looking for classification
    of a silicon wafer for the first time, or you are trying to identify the presence
    of volcanoes in radar images from the surface of Venus!


    Alternatively, you can bypass all these steps by using unsupervised learning.
    Unsupervised learning is particularly applicable to environments where the target
    images are largely identical, like the pieces of hay in the haystack that you
    need to ignore when looking for needles.


    identical, and occasionally, a dissimilar photo can reveal a potential manufacturing
    problem that can generate defects on the affected area. However, you could train
    a human to wade through all these photos and look for problems, which would take
    a lot of time and introduce the possibility of human errors, especially as individual
    details. You could also train a neural network to look for dissimilar images,
    but neural networks need large of compute resources, programming and training,
