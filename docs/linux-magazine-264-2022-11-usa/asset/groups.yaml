    我们以公共利益公司 (PBC) 的法律实体创建了 Rocky 软件基金会 (RESF)，因为它比 501(c) 组织提供了更大的灵活性，这将允许我们更好地保护项目。


    RESF 项目由一组成员和大量个人组成，他们共同工作以服务他们的社区。我们需要一个我们认为最好且能服务这些社区的结构。


    这是最重要的，参与人员的导入、问责制和所有权是决定任何项目长期可持续性和可行性最关键的方面。我们相信 RESF 缓解了偏离目标的风险，并通过实施制衡机制兼顾了每个人。


    我们为 RESF 创建的结构是从许多项目中学到的教训锻就的以及


