    # Node-RED 3


    Node-RED is a brilliant project and one that''s had significant significance in
    years, most recently when version 3.0 appeared. Version 3.0 is another major upgrade
    and consolidates its alliance as being the glue for various data sources while
    remaining easy to use and superbly powerful. The addition of a right-click context
    menu lets you access the most common features for your course, which is exactly
    what kind of menu is important because it''s not always clear what you could do
    in previous versions, and you would need to switch between editing and adding
    nodes in the flow and then go back to the inspector. Another great feature is
    the effortless upgrade process that takes you from one era to another. There are
    several ways to do this, but the well-documented upgrade script worked flawlessly
    on a Raspberry Pi. With a single restart of the service, we have flows running
    just as well as the new version, with lots of shiny new poetry. You can now add
    nodes to see and route your data flows conveniently when you have lots of connections
    for a single source, because nodes hugely reduce the clutter. Instead of multiple
    lines from a single place, you now route a line to a point where you want


    ![](img/6fa2087b693ca3fb8f29db760f956bc8_86_0.png)


    The junction can be created by selecting multiple connections and inserting Insert
    from junction from the context menu and route the connections from there. You
    will also find that nodes have sensible default behaviors, and debugging their
    path is revealed via a new tooltip. All of these makes Node-RED a real promise
    to use and one of the best ways to build bespoke messaging and data flows for
    your hardware.


    # Project Website

    https://nodered.org


    # Email client


    # Scribe


    Mozilla''s email client has been trying to rebuild its popularity with a modern
    redesign and a partnership with Thunderbird, the open source Android client, K-9
    Mail. This is great news for Thunderbird and potential users, but it also helps
    us reach desktop email clients who are still a thing, and can be a great alternative
    to web-based clients. Scribe is another great. Although it''s not fully featured
    as Thunderbird, it is less than 10MB to download and can be run from its directory.
    It is fast to load, to navigate, and convenient even on low-powered devices with
    little size. There are also versions for macOS and Windows, means you could theoretically
    run executables off a USB stick when traveling and not knowing what kind of computer
    you have access to. Despite its size, Scribe is very capable, for day-to-day email
    work. It supports SMTP and IMAP, with or without SSL. It is quite possible to
    handle any vendor and even includes built-in spam filter. You first need to make
    about 100 spam messages for the Bayesian filter to decide whether new messages
    follow the same pattern, but if you already have a large folder or filtered spam
    messages — which will mean if you''re hosting your own email server — Scribe has
    been around since 1999 and is a small, fully functional email client that can
    run from almost anywhere.


