    future article. Collecting data from multiple Picos with the Raspberry Pi requires
    a more effort. The MQTT server could be a useful buffer. Note that the Raspberry
    Pi only maintains one connection at any time. Theoretically, connections could
    be possible with Bluetooth and the SBC, but long as both the HC-05 and the SBC
    always contact the device on default 1. Of course, this would be for sensors,
    as long as the Pi quickly releases the connection after the data has been delivered.


