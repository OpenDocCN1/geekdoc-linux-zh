    # Intro

    ## How To Hack Any Wireless Network! A Step By Step Guide For Beginners

    By James Squires


    ## 1. Hacking: How to Hack Wireless WEP/WPA/WPA2 Networks in 2 Hours: A Step-by-Step
    Guide for Beginners


    The mention of the word “hacking” brings to mind all sorts of illegal activity,
    so let’s get a disclaimer out of the way first of all. We are not supporting any
    illegal activity whatsoever. The hacking methods presented in this book are intended
    to be used by information security professionals and network security personnel.
    You should only be using this information in a way that is legal in your location.


    Network hacking should only be performed on networks that you have permission
    to perform hacking on. You will want to check to make sure that it is legal for
    you to do so in the city, state and country where you live.


    The methods presented in this book are meant to be used to check for security
    leaks, to strengthen security networks and to help private networks operate more
    smoothly.


    Now that we’ve gotten the legal essentials out of the way, let’s talk about how
    you will go about hacking your network. If you want some guidance beyond what
    is covered in this book, check out the additional resources. There you will find
    instructions on how to receive free videos delivered straight to your inbox. Just
    enter your email address on the site, and we will send you free step-by-step videos
    to help you out with all sorts of common operating system problems. You’ll learn
    some new tricks and be able to better control the operating system and keep your
    security tight.


    ### Getting to Know Linux

    In order to use the tools we’ll be talking about, you need to have a basic understanding
    of Linux. Linux is an open source operating system, which means that anyone can
    modify it or distribute it. It’s free to use and download, but specialty Linux
    programs, developed by various corporations to be used for more specific purposes,
    can cost you. The developers will sell those modified Linux systems to whoever
    is interested in them. So while Linux is free, if you want something different
    than the vanilla Linux system, you may have to pay for it.


    Linux is a lot like Windows, in that it is an operating system. It basically allows
    all the programs on your computer to work together under a unified system. Without
    an operating system, you can’t use the programs on your computer. But Linux can
    work practically anywhere—on your phone, tablet or even your wristwatch. It is
    constantly changing too, being updated and modified by developers and companies
    all over the world. New versions of Linux come out more often than any other operating
    system, so it’s a good idea to familiarize yourself with the latest version before
    you get too far into some of the tools we will be using.


    ### Our Approach to Hacking a Network

    Using the step-by-step guides we have laid out for you in this book, you can learn
    how to hack into a wireless network, and you’ll be able to do it in as little
    as two hours. It may not be a very simple process, but we will simplify it for
    you as much as possible. We’re going to assume you are new to all of this and
    that you don’t know all the terminology and processes. That way, this book can
    be used by practically anybody. If you already understand some of the steps, then
    you may want to skip ahead to the part of the process that is giving you trouble.
    We’re going to go slowly through all this to make sure you fully understand it
    and that you have no problems getting into your network.


    ### Live Operating Systems

    A live operating system is one that is portable. It can be downloaded into a USB
    drive or a DVD. You might hear it called a “OS (operating system) on a stick”
    or even a “computer on a stick”. This basically means that it can be taken anywhere
    on a USB stick. The operating system can function much like a computer sometimes,
    even holding files and programs, so you can essentially take your computer with
    you.

