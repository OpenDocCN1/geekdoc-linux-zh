    to remain secure, and unless you tamper with the settings it will stay that way,
    even to the detriment of the programs you want to use on it.


    You can tamper with the program as much as you like, opening it up for compatibility
    with just about anything, since it runs off of Linux. But that’s not a good idea
    if you want to maintain security. As you get more used to how it works, you can
    do more with it and modify it as you like, but when you first start out, you probably
    shouldn’t try to tamper with it. Wait until you are more familiar with it to start
    doing high-level modifications.


    ## 3


    # What Is a WEP, a WPA, and a WPA2?


    Your Wi-Fi network is what connects all your internet-capable devices together
    in one area. In an office building, that network connects all the computers, scanners,
    tablets and other devices. This can give them a measure of shared security, as
    it makes it difficult for outside forces to penetrate and become part of the network.
    It conserves resources and helps the company maintain control over their computers’
    security.


    But how secure is your network? That will partly depend on what kind of security
    classification your Wi-Fi has. We are going to look at three types of these- WEPs,
    WPAs and WPA2s.


    If you are reading this chapter, then you probably never paid much attention to
    the few letters beside your Wi-Fi network’s name. You may not have thought they
    mattered, but somebody had to pick one of these choices when they first set up
    the wireless network you are using. Odds are, they didn’t think too much about
    their choice and just went with the most obvious one.


    But that can be a mistake. These encryption standards determine how secure your
    network is. If someone is getting into your system and using your Wi-Fi to do
    something illegal, then the FBI are going to be having a visit with you. They
    may get to the actual infiltrator eventually, but they will start with the Wi-Fi
    source. Knowing how to keep out intruders is a big part of running a secure network.
    Before you can do that, you first have to understand the security classifications
    for Wi-Fi networks.


    **WEP**


    Wired Equivalency Privacy, or WEP, is the Wi-Fi security algorithm that is used
    in most places around the world. Part of that has to do with how long it has been
    around, and a part of it is just because it is usually the first choice in a list
    of security algorithms. People who don’t know much about these just assume that
    the first choice is the best, which is why it is considered the default option.
    They don’t understand what the difference is between these choices.


    WEP became the standard back in 1999, but it was never very strong. As technology
    advanced, stronger versions of WEP were introduced, but most of the time, the
    majority of people were still using the relatively weak versions.


    This standard lost its value over time as weaknesses were discovered. When computing
    power increased to the point where it because a simple matter to break the encryption
    and discover the Wi-Fi password, WEP was dropped as the standard by the Wi-Fi
    Alliance in 2004.


    **WPA**


    Wi-Fi Protected Access, or WPA, was meant to replace WEP as it began to show signs
    of weakness. The Wi-Fi Alliance formally adopted it in 2003\. All WPA keys that
    are used are 256-bit, which makes them much stronger than the keys commonly used
    in WEPs (64 and 128-bit). The keys refer to the level of encryption the system
    has, and WPA’s was remarkably stronger than its counterpart.


    WPAs have message integrity checks which look for packets of data that have been
    altered or captured by an infiltrator as these packets pass between the client
    and the access point. The key system is even a lot more advanced than what was
    being used before. The original key system that came with the WPA is outdated
    now, but at the time, it was a huge leap forward for network security.'
