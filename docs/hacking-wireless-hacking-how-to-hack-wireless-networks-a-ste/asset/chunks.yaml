    If you plug that live operating system into the USB port on a computer that is
    already running Windows or Mac OS or UNIX, then it will still be able to use the
    operating system you have on the stick. In this case, we are talking about `Linux`
    or a version of `Linux`. Once you plug your USB stick in or insert your DVD, the
    operating system contained on that portable media will temporarily override whatever
    operating system is currently in use on the computer. It won’t make any permanent
    changes to that operating system. It just takes over for a while. Once you remove
    your media, then your operating system goes with it and the computer, phone, tablet,
    etc. can just go back to normal.


    Now, this is really useful when you are trying to perform security checks on computers
    that run on your company’s network. If you are in charge of network security,
    you may need to check individual computers, but you want your programs and files
    to be accessible through that computer so you can perform diagnostics. The live
    operating system is the perfect solution for that, and it allows you to take what
    you know and what you are familiar with and use it anywhere.


    We’re going to show you how to do that.


    ## 2


    # What Is Kali Linux?


    Now we talked about versions of `Linux` that are modified by companies or various
    developers for specified use. That’s what `Kali Linux` is, and it is specialized
    to provide network security. In some ways, it is very basic. It won’t work with
    a lot of programs, because it isn’t meant to provide general operating system
    services. It doesn’t work quite like `Windows` or even the basic `Linux` system.
    Instead, it is laser focused on network security.


    We will be using `Kali Linux` in our hacking guides, so we’re going to cover what
    it’s all about.


    ### How to Get Kali Linux


    While `Kali Linux` is used by security professionals all over the world and is
    a highly specialized version of `Linux`, it won’t cost you anything. The developers
    vow that it will always be free, even as they continue to provide support and
    updates for their version of `Linux`. They also make sure that modifications are
    not being made to the OS by just anyone. They call `Kali Linux` an open source
    OS, but one that is developed by a small group of people under very tight security.
    They vet all changes carefully and make sure that absolute security is maintained
    on the product.


    You only want to download `Kali Linux` from a verified source. The following pages
    `https://www.kali.org/downloads` and `https://www.offensive-security.com/kali-linux-vmware-arm-image-download/`
    both offer secured versions of `Kali` for you to download.


    ### What Kali Linux Does


    This kind of operating system is known as a distribution and it is designed for
    penetration testing and security auditing. It is meant for a single user at a
    time. This limits the potential for security breaches.


    In fact, this system is very particular about security, since it is designed for
    people who work in information and network security. It can be modified to allow
    for more users and to become compatible with many programs, but that isn’t advisable.
    That can compromise the security of the system, which defeats its purpose.


    It is recommended that you work within the parameters of the `Kali Linux` system
    so as not to allow in any potential security breaches. Because it is such a closed
    system, it won’t be compatible with programs that permit a lot of online interactions
    or open sourcing. So `Steam` won’t work with it at all, nor will `Launchpad` and
    many other commonly used programs. If you want to run those programs, then you
    should really use a different operating system that isn’t designed to be as narrowly
    focused as this one is.


    If you try to install additional programs on `Linux` that connect to a network,
    such as `Bluetooth`, then you won’t have much luck.


