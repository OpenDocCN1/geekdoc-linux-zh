    但 WPA 存在一些安全缺陷。它带有与其前身版本相同的功能，包括 `TKIP`（临时密钥完整性协议），该协议要求设备定期接受固件更新。这为系统留下了一个后门，黑客很快就能利用这一漏洞。


    WPA 比其前身版本更安全，但它仍然容易受到攻击。这一点在公开演示中已经一次次被证明。尽管它更难破解，而且辅助系统通常是入侵者的切入点而非直接针对算法，但漏洞依然存在。


    ### WPA2


    Wi-Fi Protected Access 2，即 `WPA2`，于 2006 年接替了标准的 `WPA`。这并不是说旧的、安全性较低的算法已经不可用，因为它们确实仍然可用。


    `WPA2` 仍然使用 `TKIP`，但它被认为仅在主系统失效时使用的备用系统。取代 `TKIP` 的是 `CCMP`，即计数器密码模式结合块链消息认证码协议。这种新协议非常擅长判断进入算法的消息是否经过授权，使得渗透系统变得非常困难。


    该系统仍然有其弱点，但弱点少得多，且更难利用。由于这类算法极其难以渗透，只有那些需要防范企业间谍活动的大型公司才需要担心渗透问题。对于普通私有网络包含的信息，破解该系统所花费的精力完全不值得。


    ### AES


    在讨论 `WEP`、`WPA` 和 `WPA2` 时，我们无法不提到 `AES`。它代表高级加密标准，是一种安全算法规范。`AES` 通常包含在 `WPA2`
    算法中，但并不总是默认开启的。为了获得最佳的安全性，你希望将 `WPA2` 安全算法与 `AES` 结合使用。这将为你提供前所未有的安全级别，并使你的网络几乎无坚可击。


    ### 你应该使用哪一个？


    如果你有足够的资源和处理能力来应对，你绝对应该选择 `WPA2` 安全算法，最好也同时激活 `AES`。但并不是每个人都有那样的处理能力。


    如果你手头的处理能力或资源不多，那么在小型个人网络等设备使用 `WPA2` 安全算法是不建议的。它可能会降低你的连接速度，产生性能问题，并不必要地拖慢你的系统。


    然而，对于任何企业级网络，都推荐带有 `AES` 的 `WPA2`。它提供了最高的安全性，大多数中大型企业都有必要的资源来平稳运行，而不会对网络速度产生任何卡顿。


    ## 4 # 下载 Kali Linux


    你必须非常小心从哪里下载 Kali Linux。市上有许多非原始开发者制作的仿制品版本。不怀好意的人员很容易植入病毒或其他恶意软件，从而危及你的网络。这就是为什么你必须确保不仅获得的是系统的“纯净”副本，而且你是从可靠的源下载的。


    验证你所获得的是否为正品的最佳方法是根据标准值验证 `SHA1` 校验和。


    如果你想从 USB 运行 Kali Linux 系统（这对于破解网络是必要的），那么你需要获取 `SHA1` 校验和。


    ```

    if (condVar > someVal) {console.log("xxx")}

    ```

    *(注：由于原文文本后续未提供具体代码块，此处保留示例中的格式逻辑，实际排版将根据输入文本内容进行)*


