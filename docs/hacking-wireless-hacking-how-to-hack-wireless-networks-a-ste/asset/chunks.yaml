- fmt: '

    4. From there, you can store the packets you capture in a file. Do this by using
    the `airodump` command. The full command you will use will look like this: `airodump-ng
    mon0` (plus the name of the file you want to capture). In this example, the `0`
    in `mon0` is the name of the network. So the number you use may vary from the
    example given.


    You can find the packets you captured in files that look like this: `(name of
    the file).cap`. You can’t do this right away though. You have to wait until there
    is enough data available.


    1. The Wi-Fi is cracked. At this point, you can just type in the command `aircrack-ng`
    in order to determine the password. Remember, this takes a few seconds, so don’t
    expect instant results every time. This command needs to be performed in a new
    terminal.


    2. The program may ask you which Wi-Fi you want to hack into, but only if there
    is more than one to choose from. You should get in pretty fast, if the password
    is weak. For very strong passwords, you will need more packets. The program is
    going to try again for itself once you have 15,000 packets, and if it is unsuccessful,
    it will keep trying at each new 5,000 packet milestone.


    # Hacking WAP and WAP2


    Hacking into a WEP network is pretty easy. The security just isn’t that tight,
    as we have previously discussed. To hack into a WAP or WAP 2 network will take
    some extra effort. You might not even be able to find a way in using Kali Linux.
    A brute force attack could take as long as several years. It depends on the length
    of the password and various other factors that create security for the network.


    The problem with WPA tech is that it can be really hard to configure. To make
    it easier, WPS is added to complement WPA, but it does come with an exploitable
    hole, and programs like `Reaver` are excellent at getting through that hole. The
    attack can still take several hours to complete, but it is better than not being
    able to get through for years.


    WPS sends an 8-digit pin to the client. These pins only contain numbers, so there
    is a limited number of guesses it would take to crack it. Still, with all the
    possible choices, trying each guess can take a very long time. WPA uses characters,
    numbers and letters, so guessing the password can be infinitely tougher. In WPS,
    there will be a slight delay in waiting for the APs to respond. You will probably
    only be able to get in a few keys per second. Even at that speed, it can still
    take years to get in, but thankfully there are some weaknesses to exploit.


    We know that the 8^th digit is always a checksum of all the previous digits. This
    cuts down the possibilities considerably, but it would still take far too long
    to make it worth our while. We can also break down the pin number into two separate
    parts, which makes the work go twice as fast. What this boils down to is 11,000
    guesses, though odds are we won’t have to exhaust them all before we find the
    answer. This means it should take about three hours to go through every guess,
    so you are looking at somewhere less than three hours for the hack. If you are
    trying keys slowly, though, it can take much longer.


    To perform the attack, you won’t need to do a lot of complicated work. If you
    have everything in place, then you can simply put in the command:


    ```

    reaver -i (interface-name) -b (BSSID of your target)

    ```


    If you know how to hack a WEP, then this is basically the same process. We are
    working with `Reaver` this time, which makes things easier for you, but it is
    still harder overall, since you are hacking into a WPA or WAP2 instead of the
    much simpler WEP.


    1. Start up Kali Linux, then begin monitor mode. The command for that is: `airmon-ng
    start wlan0`. Like with the last hack we showed you, the `0` represents the network
    name `which is a number). Once you know that name, substitute our `0` for the
    correct number.


    2. You will need the BBSSID number of the network you are going to hack into.


    3. If WPS is enabled, then this hack won’t work. If you want to check WPS activation,
    then use the `wash` command or `airodump-ng`. Using `wash` is pretty easy since
    it is designed specifically for this purpose.


    4. The `wash` command goes like this: `wash -i mon0`. Remember to substitute that
    `0`. This will also start up your system in monitor mode. If you see any networks
    after you have used `wash`, then WPS is enabled and you will likely have to give
    up.


    5. The BSSID number will need to be combined with `Reaver` for your next command.
    This is `reaver -i mon0 -b (BSSID number)`. `Reaver` has more advanced options
    you can use, and you may want to make use of them to increase your hack’s efficiency.
    The `-vw` option, for example, makes your tool more verbose, telling you what
    is happening right on your terminal. So if you are experienced at hacking and
    using `Reaver`, then this is an invaluable asset. It also helps you sort through
    problems as they happen. If you are going to use this tool, just type in the command:

    ```

    reaver -i mon0 -b (BSSID number) -vv

    ```


    6. Now you’re in. If you are having any trouble or the process is taking far longer
    than it should, then you may need to.


    ## 9


    ## 10


    ### Additional Resources


    Here are some hacking tools you can use to make your life a bit easier. It should
    be with what was covered earlier.


    #### Aircrack

    This one ranks among the most popular crackers. It works on WPA so make sure you
    are using the right network. If it can’t, this tool won’t be much help to you.
    You can find `aircrack-ng`.


    #### Airjack

    You will be exploiting man-in-the-middle with this tool. It’s a packet injection
    program that is available `sourceforge.net/airjack`.


    #### Onlinehash.com

    Using a dictionary attacks guesses for you automatically. It works on WPA, and
    you can find it `onlinehash.com`.


    #### CommView for Wi-Fi

    This protocol analysis tool also performs wireless monitoring. It can decode packets
    from both WEP and WPA. If you want to keep track of Wi-Fi traffic so you know
    exactly who is using your network, then this is a great tool for you. You’ll be
    able to get it `tamos.com/commwifi`.


    #### inSSIDer

    This one will cost you, but it is an award-winning scanner. It works on most versions
    of Windows as well as OS X. It is used to sniff out network LANs, and you can
    find it for about $20 `insser.com`.


    #### OmniPeek

    OmniPeek only works on Windows OS. It is a network analyzer that captures traffic
    from the network. You can find this excellent troubleshooting tool `wildpackets.com`.


    #### WireShark

    Like the inSSIDer, the `WireShark` is great for analyzing network protocols. You
    can check network traffic with it, but it helps to have a decent understanding
    of how network protocol works. You’ll find this one `wireshark.org`.

