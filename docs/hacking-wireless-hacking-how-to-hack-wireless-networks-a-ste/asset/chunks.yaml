    expect instant results every time. This command needs to be performed in a new
    terminal.


    2.  The program may ask you which Wi-Fi you want to hack into, but only if there
    is more than one to choose from. You should get in pretty fast, if the password
    is weak. For very strong passwords, you will need more packets. The program is
    going to try again for itself once you have 15,000 packets, and if it is unsuccessful,
