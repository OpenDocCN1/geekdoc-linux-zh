- fmt: '

    But the WPA has some security flaws. It came with some of the same capabilities
    as its predecessor, including a `TKIP` (Temporary Key Integrity Protocol), which
    required that the device accept firmware updates regularly. This presented a backdoor
    for the system, which hackers were soon able to exploit.


    The WPA is more secure than its predecessor, but it is also still vulnerable to
    attack. This has been shown time and again in public demonstrations. Even though
    it is harder to break into, and supplementary systems usually serve as the access
    point for intruders rather than the algorithm directly, the vulnerability is still
    there.


    ### WPA2


    Wi-Fi Protected Access 2, or `WPA2`, took over for the standard `WPA` back in
    2006. That’s not to say that the older, less secure algorithms aren’t still available,
    because they are.


    The `WPA2` still uses `TKIP`, but it is considered a fallback system to be used
    only if the primary system fails. What replaces `TKIP` is the `CCMP`, or Counter
    Cipher Mode with Block Chaining Message Authentication Code Protocol. This new
    protocol is excellent at determining if messages entering the algorithm are authorized,
    making it very difficult to infiltrate the system.


    This system still has its weaknesses, but they are far fewer and much harder to
    exploit. Because this kind of algorithm is so incredibly difficult to penetrate,
    the only entities who use it that would have to worry about infiltration are large
    companies that deal with corporate espionage. It simply isn’t worth the effort
    it would take to break into this system for the information contained on the average
    private network.


    ### AES


    We can’t talk about `WEP`, `WPA` and `WPA2` without mentioning `AES`. It stands
    for Advanced Encryption Standard, and it is a specification of a security algorithm.
    Often, `AES` is included in a `WPA2` algorithm, but it may not always be by default.
    For the very best security, you want to partner a `WPA2` security algorithm with
    `AES`. That will give you unprecedented levels of security and make your network
    practically impenetrable.


    ### Which One Should You Use?


    If you have the resources and the processing power to handle it, you definitely
    want to go with a `WPA2` security algorithm, preferably with `AES` activated as
    well. But not everyone will have that kind of processing power available to them.


    If you don’t have much processing power or resources at your disposal, then using
    a `WPA2` security algorithm on something like a small, personal network would
    not be advisable. It can lower your connection speeds, create performance problems
    and unnecessarily bog down your system.


    For any enterprise-level networks, however, `WPA2` with `AES` is recommended.
    It provides the most security, and most medium to large businesses have the necessary
    resources to run it smoothly without any hiccups in their internet speed.


    ## 4 # Downloading Kali Linux


    You have to be very careful about where you download Kali Linux from. There are
    plenty of facsimile versions out there that are not made by the original developers.
    It would be very easy for an unscrupulous individual to slip in a virus or some
    other malware that could compromise your network. That’s why you have to make
    sure you are getting not only a “pure” copy of the operating system but also that
    you are downloading it from a trustworthy source.


    The best way to certify that what you are getting is the real deal is to verify
    the `SHA1` checksums against a standard value.


    If you want to run the Kali Linux OS from a USB (which is necessary to hack a
    network) then you will need to obtain the `SHA1` checksums.


    ```

    if (condVar > someVal) {console.log("xxx")}

    ```

