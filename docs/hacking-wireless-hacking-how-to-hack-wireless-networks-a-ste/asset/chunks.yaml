    Once you take out your USB key, you remove Kali Linux from the device. It doesn’t
    leave behind any trace, and it doesn’t change the settings or operating system
    of the device you used it on. It is compatible with any operating system because
    it works around them.


    This is considered a non-destructive way to use Kali Linux. It lets everything
    go back to normal on whatever device you use it on, making no changes to the host’s
    system. It’s also portable, so you can take it from one workstation to the next
    and from one device to the next and do what you need to do. It starts up very
    fast, usually in just a few minutes, on whatever system you put it into.


    You can also customize your bootable drive, using a Kali Linux ISO image that
    you rolled yourself. It is also potentially persistent. This means that, once
    you perform the proper configurations, your Kali Linux Live drive will keep the
    data it has collected no matter how many times you reboot it.


    ## Installing onto Your Bootable USB Key


    We will start with a bootable USB drive that already has an ISO image of Kali
    Linux. Be sure that ISO image is verified. We talked about this in the last chapter.


    For Windows users, you will have to first download the Win32 Disk Imager utility.
    You’ll find that [here](https://launchpad.net/win32-image-writer).


    [https://launchpad.net/win32-image-writer](https://launchpad.net/win32-image-writer)


    If you are using a Linux or an OS X, just use the `dd` command. This has already
    been installed on both of those platforms.


    We recommend using a 4GB USB thumb drive or larger. If you want to use an SD card,
    then that’s fine, since the procedure is the same for both. Just make sure the
    devices you are going to be using it on are compatible with your storage device.


    The method for doing this will differ depending on what OS you have. We’ll break
    it down on both of the major ones for you.


    ### For Windows


    Start by plugging your USB drive into a USB port on a PC operating Windows. Pay
    attention to the drive designator that it uses when it starts to mount. That designator
    will look like “F:\`. Then launch the Win32 Disk Imager software. Once you open
    that software, pick out the Kali Linux ISO file you downloaded. Then click “Write”
    to copy it onto the USB drive, be sure you pick the right drive for this operation.


    When the imaging process is finished, you can take out your USB. On most Windows
    OS, you will need to click on the small arrow near the bottom right corner of
    your screen to open a tab that shows connected devices. Be sure to click on your
    USB drive there to safely eject it and ensure that no information is lost when
    you disconnect it.


    Once all that is done, you can boot Kali Linux from your USB device.


    ### For Linux


    Doing the same thing on a Linux is equally easy. Start with the verified ISO image
    and copy it over to the drive using the `dd` command. You have to be running as
    a root for this to work. Alternatively, you can execute the `dd` command using
    `sudo`. The instructions we’re going to give you assume that you have a Linux
    Mint 17.1 desktop. Other versions are going to vary slightly, but the basic operations
    required for this task should all be about the same.


    Just a word of warning before we get into the actual instruction: if you aren’t
    sure what you are doing with `dd` command or you just aren’t careful, you can
    accidently overwrite something you aren’t meaning to. Be sure to double check
    everything you are doing so you don’t make any mistakes.


    Start by identifying the device path you are going to use to write the image onto
    the USB drive. Before the drive is inserted, perform the command `sudo fdisk -1`.


    You have to be using elevated privileges with `fdisk`, otherwise there won’t be
    any output. Enter the above command in a terminal window at a command prompt.
    If you did it properly, you should see a single drive. That will probably look
    like this “/dev/sda”. That drive will be separated into three partitions. These
    are `/dev/sda1`, `/dev/sda2`, and `/dev/sda5`.


    From there, plug in the USB drive, then run the original command again. That’s
    `sudo fdisk -1`. Once you do that, you will see another device that wasn’t there
    initially. It could look something like this: “/dev/sdb”.


    Then take the ISO file and image it onto the USB device. It may take 10-15 minutes
    to image the USB device, so be patient. In order to perform this process, you
    need to execute the command below:


    ```

    dd if=kali-linux-10.0.9a-amd32.iso of=/dev/sdb bs=512k

    ```


    Let’s dissect this command for a second. In the example we are using here, the
    ISO image that you want to write onto the drive is named “kali-linux-10.0.9a-amd32.iso”.
    Yours may look slightly different. Note the “32” in the name. This refers to the
    size of the image. We use the blocksize value `bs=512k` because it is safe and
    reliable. You can make it bigger if you want, but that can cause some problems,
    so it isn’t recommended.


    Once the command is completed, then it will provide feedback and not before then.
    Your drive could have an access indicator. If it does, then it will blink every
    so often. How long this whole process takes will depend on a few factors- how
    fast your system is, what kind of USB drive you are using and how well your USB
    port works. The output, once the imaging is complete, will tell you how many bytes
    are copied and give you numbers for records in and out, which should be the same
    number.


    Now your USB is ready to boot into a Kali Live environment.


    ## 6


    # Virtualization and Using Virtual Box


    Kali Linux lets you use its own operating system without interfering with the
    original operating system on whatever computer to other device you are trying
    to hack into. We’ve covered this already, but what about those instances where
    you want to test programs that are not compatible with one OS or another?


    That’s where virtualization comes in handy. It allows you to set up an outside
    system that works with the existing operating system. Then you can just pick and
    choose which program you want to test. You can take a program that works only
    on Windows, for example, and run it through your Kali Linux distribution while
    you have your USB with Kali Linux plugged into the host device. But you will need
    a virtualization program.


    That’s what Virtual Box is, and it does a lot more than just let you test specific
    programs that wouldn’t normally be compatible with the OS you are using. It also
    allows you to run operating systems that no longer work on your current hardware.
    Your computer may not be able to run an old DOS operating system, but when you
    use a visualization tool like Virtual Box, you can run that operating system again.


    You can also run multiple operating systems at once. We talked about how Kali
    Linux temporarily overrides the operating system of whatever device you have it
    plugged into. But once you have Virtual Box running, you can essentially have
    both Kali Linux and that host operating system going at the same time. It gives
    you lots more options, allowing you to do far more than you could otherwise.


    You can also save the state of a system and make that system revert to its old
    state whenever you want. That gives you tons of room to play around with. You
    can experiment and try different things, then when you make a fatal error, you
    can just revert the system.


    Virtual Box can be found on VirtualBox.org. It is an open source tool, so it is
    constantly being updated and it’s free. Like with all the other tools we cover
    in this book, you only want to download if from the original source. If you get
    it anywhere else, it could be a bogus version that is corrupted with malware.

