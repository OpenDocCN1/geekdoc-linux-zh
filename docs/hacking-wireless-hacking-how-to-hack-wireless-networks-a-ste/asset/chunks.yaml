    private network.


    **AES**


    We can’t talk about WEP, WPA and WPA2 without mentioning AES. It stands for Advanced
    Encryption Standard, and it is a specification of a security algorithm. Often,
    AES is included in a WPA2 algorithm, but it may not always be by default. For
    the very best security, you want to partner a WPA2 security algorithm with AES.
    That will give you unprecedented levels of security and make your network practically
    impenetrable.


    **Which One Should You Use?**


    If you have the resources and the processing power to handle it, you definitely
    want to go with a WPA2 security algorithm, preferably with AES activated as well.
    But not everyone will have that kind of processing power available to them.


    If you don’t have much processing power or resources at your disposal, then using
    a WPA2 security algorithm on something like a small, personal network would not
    be advisable. It can lower your connection speeds, create performance problems
    and unnecessarily bog down your system.


    For any enterprise-level networks, however, WPA2 with AES is recommended. It provides
    the most security, and most medium to large businesses have the necessary resources
    to run it smoothly without any hiccups in their internet speed.


    ## 4


    # Downloading Kali Linux


    You have to be very careful about where you download Kali Linux from. There are
    plenty of facsimile versions out there that are not made by the original developers.
    It would be very easy for an unscrupulous individual to slip in a virus or some
    other malware that could compromise your network. That’s why you have to make
    sure you are getting not only a “pure” copy of the operating system but also that
    you are downloading it from a trustworthy source.


    The best way to certify that what you are getting is the real deal is to verify
    the SHA1 checksums against a standard value.


    If you want to run the Kali Linux OS from a USB (which is necessary to hack a
    network) then you will need to obtain a bootable ISO image. A 32-bit or a 64-bit
    image will work fine.


    You may not be quite sure what architecture your system has that you want to run
    the system on. If that’s the case, then you can run the command “uname -m”. Just
    input this on the command line on your Intel-based PC. A response will come back.
    If it says “x86_64” then you should be using the 64-bit image. That one will have
    “amd64” in the name of the file.


    You might get the response “1386”. If that is the case, then use a 32-bit image.
    This will have “i386” in the file name.


    If you have a Windows OS, then the procedure will be a bit different. For Windows
    7 or Windows Vista users, you can begin by opening the Start menu. Go to Computer,
    then click on Properties. Under the System heading, view the type of system that
    you have.


    For a Windows XP OS, the steps are similar. Go to Start to begin. Then right-click
    on My Computer and click Properties from there. If you see the words “x64 edition”
    there, then you have a 64-bit system. If nothing is written there, then it’s a
    32-bit system.


    Kali can be run as a guest under VMware. It actually already has VMware Tools
    installed and can be found as a pre-built VMware virtual machine. If you want
    the VMware image, you will find there are three variations- 64-bit, 32-bit and
    32-bit PAE.


    ARM-based devices can have varied architectures. That means that a single type
    of image won’t work across all the ARM machines. You’ll have to download Kali
    Linux images that are pre-built for ARM architecture. You can go to GitHub to
    find scripts that will help you build ARM images on your own.


    If you run into any trouble setting up an ARM environment that will work for Kali
    Linux or you want to know how to build your own custom chroot (a root directory
    change operation), you can use these articles [here](http://docs.kali.org/development/kali-linux-arm-chroot)


    [http://docs.kali.org/development/kali-linux-arm-chroot](http://docs.kali.org/development/kali-linux-arm-chroot)


    The Kali Linux images can be found on the Offensive Security website: OffensiveSecurity.com.


    **Verify the Image You Use for Kali Linux**


    You definitely want to make sure that you have an actual Kali Linux OS and not
    some imposter. This professional penetration testing tool is meant to maintain
    network security. You can use it to investigate computers and networks, and you
    need to be able to trust what it tells you. If there is any problem with it and
    you have a version of Kali Linux that differs from the real deal, then you can
    be compromising your network and your personal information. Don’t take that risk.
    Make sure you verify what you are getting before you download it.


    Since Kali is a penetration testing distribution, a fake version of it could cripple
    your system. There are lots of these bogus versions out there and there is no
    shortage of people who would want to put in some sketchy additions to this distribution.


    The best way to avoid this problem is to make sure you are downloading only from
    the official Kali download pages. You will need an SSL to browse these pages.
    That’s a standard encryption that protects the serve and the client from interference.
    It basically keeps the bad guys out. But even these sources have their weaknesses.


    After you download the necessary image, be sure to verify it before you run it.
    You want to validate that it is the real deal and not something that could contain
    malware.


    The simplest way to do this is to calculate the hash of the ISO’s SHA1\. Then
    just inspect it and compare it against the value you find on the Kali Linux site.


    Once you’ve done all this, and you are sure you are getting an actual Kali Linux
    distribution, you can then download it.


    ## 5


    # How to Setup and Install Kali Linux on a USB Key


    Kali Linux is the best hacking tool out there. It is super secure, and it is made
    by seasoned professionals who know what they are doing. What’s so great about
    this system is that you can run it from a USB key and not have to worry about
    compromising or altering your current operating system. When you carry this OS
    on a USB key, it can be taken to any computer or compatible device and made to
    work. It only temporarily overrides the current operating system on that device.'
