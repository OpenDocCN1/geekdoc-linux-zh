  一旦你拔出 USB 闪盘，你就从设备中移除了 Kali Linux。它不会留下任何痕迹，也不会改变你运行过它的设备设置或操作系统。它与任何操作系统都兼容，因为它是在绕过这些系统运行的。


  这被认为是一种使用 Kali Linux 的非破坏性方法。它让你所使用的任何设备上的一切都恢复正常，不对主机系统不做任何更改。它还具有便携性，所以你可以将其从一个工作站带到另一个，从一个设备带到另一个，并完成你需要的操作。无论你将其放入什么系统，它启动得都非常快，通常只需要几分钟。


  你还可以使用自己制作的 Kali Linux ISO 镜像来定制你的启动器。它还可能具有持久性。这意味着，一旦你执行了正确的配置，你的 Kali Linux Live
  启动盘将保留它所收集的数据，无论你重启多少次。


  ### 安装到你的启动 USB 闪盘


  我们将从一个已经包含 Kali Linux ISO 镜像的启动 USB 驱动器开始。确保该 ISO 镜像经过验证。我们在上一章中讨论过这一点。


  对于 Windows 用户，你必须先下载 Win32 Disk Imager 实用程序。你可以在[这里](https://launchpad.net/win32-image-writer)找到它。


  [`launchpad.net/win32-image-writer`](https://launchpad.net/win32-image-writer)


  如果你正在使用 Linux 或 OS X，只需使用 `dd` 命令即可。这两个平台都已安装了该命令。


  我们建议使用 4GB 或更大的 USB 闪存盘。如果你想使用 SD 卡，也可以，因为两者的操作步骤是相同的。只需确保你将要使用的设备与你的存储设备兼容即可。


  执行此操作的方法取决于你拥有的什么操作系统。我们将为你对这两个主要的系统进行分类说明。


  ### 对于 Windows


  首先将你的 USB 驱动器插入到运行 Windows 的电脑的 USB 端口。注意它在开始挂载时所使用的驱动器标识符。该标识符看起来会像“F:\”。然后启动 Win32
  Disk Imager 软件。打开该软件后，选择你下载的 Kali Linux ISO 文件。然后点击“Write”（写入）将其复制到 USB 驱动器上，务必在此操作中选择正确的驱动器。


  镜像制作完成后，你就可以拔出 USB 了。在大多数 Windows 系统上，你可能需要点击屏幕右下角的小箭头以打开显示连接设备的选项卡。务必在那里点击你的 USB
  驱动器以安全弹出它，并确保在断开连接时不丢失任何信息。


  完成所有操作后，你就可以从你的 USB 设备启动 Kali Linux 了。


  ### 对于 Linux


  在 Linux 上执行相同的操作同样简单。从经过验证的 ISO 镜像开始，使用 `dd` 命令将其复制到驱动器。你必须以 root 身份运行才能使之生效。或者，你可以使用
  `sudo` 执行 `dd` 命令。我们将提供给你的指令假设你使用的是 Linux Mint 17.1 桌面版。其他版本会略有不同，但完成此任务所需的基本操作应该大同小。


  在进入实际指令之前，先给出一个警告：如果你不确定在使用 `dd` 命令时做什么，或者你只是不小心，你可能会无意中覆盖掉你不想要覆盖的内容。务必双重检查你所做的每一步操作，以防出错。


  首先识别你将用于将镜像写入 USB 驱动器的设备路径。在插入驱动器之前，执行命令 `sudo fdisk -1`。


  你必须使用提升权限运行 `fdisk`，否则将没有任何输出。在终端窗口的命令提示符中输入上述命令。如果你操作得当，你应该看到一个驱动器。它看起来可能像这样：“/dev/sda”。该驱动器将被分为三个分区。这些是
  `/dev/sda1`、`/dev/sda2` 和 `/dev/sda5`。


  从那里开始，插入 USB 驱动器，然后再次运行原始命令。`sudo fdisk -1`。一旦执行，你将看到另一个最初不存在的设备。它可能像这样：“/dev/sdb”。


  然后获取 ISO 文件并将其制作到 USB 设备上。制作 USB 设备可能需要 10-15 分钟，请保持耐心。为了执行此过程，你需要执行以下命令：


  ```

  dd if=kali-linux-10.0.9a-amd32.iso of=/dev/sdb bs=512k

  ```


  让我们仔细分析一下这个命令。在我们在这里使用的示例中，你想要写入驱动器的 ISO 镜像名为“kali-linux-10.0.9a-amd32.iso”。你的文件名可能看起来略有不同。注意名称中的“32”。这指的是镜像的大小。我们使用块大小值
  `bs=512k` 是因为它是安全可靠的。如果你愿意，可以将其调大，但这可能会导致一些问题，因此不建议这样做。


  一旦命令完成，它将提供反馈，在此之前不会。你的驱动器可能有一个指示灯。如果有，它会经常闪烁一下。整个过程所需的时间取决于几个因素——你的系统速度、你使用的种种
  USB 驱动器以及你的 USB 端口工作情况。镜像制作完成后，输出将告诉你复制了多少字节，并给出输入和输出记录的数字，这些数字应该是相同的。


  现在你的 USB 已经准备好进入 Kali Live 环境了。


  ## 6


  # 虚拟化和使用 Virtual Box


  Kali Linux 允许你使用它自己的操作系统，而不会干扰你尝试黑入的任何电脑或其他设备上的原始操作系统。我们已经涵盖了这一点，但对于那些想要测试不兼容某个操作系统或另一个系统的程序的情况该怎么办？


  这就是虚拟化大显身场的地方。它允许你设置一个与现有操作系统协同工作的外部系统。然后你就可以自由选择想要测试的程序。例如，你可以取一个仅在 Windows 上运行的程序，并在插有
  Kali Linux USB 的情况下通过你的 Kali Linux 发行版运行它。但你需要一个虚拟化程序。


  这就是 Virtual Box 的作用，它的功能远不止让你测试与你使用的操作系统不兼容的特定程序。它还允许运行不再支持当前硬件的操作系统。你的电脑可能无法运行旧的
  DOS 操作系统，但当你使用像 Virtual Box 这样的工具时，你可以再次运行它。


  你还可以同时运行多个操作系统。我们讨论过 Kali Linux 如何临时覆盖你插入的任何设备的操作系统。但一旦你运行了 Virtual Box，你实际上可以同时运行
  Kali Linux 和该主机操作系统。它提供了更多选项，允许你完成比通常多得多的操作。


  你还可以保存系统状态，并在任何时候让系统恢复到旧状态。这为你提供了大量的尝试空间。你可以实验并尝试不同的事物，当你犯致命错误时，只需恢复系统。


  你可以在 VirtualBox.org 找到 Virtual Box。它是一个开源工具，因此不断更新且是免费的。与我们在本书中涵盖的所有其他工具一样，你只想从原始源下载。如果你从其他地方获取，它可能是一个感染了恶意软件的虚假版本。




  Virtual Box 几乎兼容任何操作系统，因此在使用你拥有的任何系统时应该不会遇到任何问题。Virtual Box 的局限性取决于你的处理能力和内存。你可以根据内存大小，在设备内运行任意数量的虚拟机。你还可以根据设备处理范围内，在多个操作系统上并发运行多个程序。


  如果你以前没有做过很多黑客操作，那么 Virtual Box 是一个不可或缺的工具。你可以保存计算机当前的状态，以便在发生意外时进行恢复。首次在计算机上尝试黑客操作的个人往往会犯下想要后悔的错误，而使用
  Virtual Box，他们确实可以做到。


  此工具可以添加到你的 USB 驱动器中并与 Kali Linux 配合工作，因此没有任何问题。


  ## 7. 在 Kali Linux 中使用 PixieWPS


  最新版本的 Kali Linux 预装了 `PixieWPS`，这是一个非常有用的工具。`PixieWPS` 在 Kali Linux 上运行最好，但在其他系统也可以使用。


  `PixieWPS` 的作用是对网络进行攻击。它会猜测 PIN 码和密码。这过去是手动完成的，但通过 `PixieWPS`，它实现了自动化。过程所需的时间取决于目标网络的安全性。


  如果你在 Kali Linux 上没有安装 `PixieWPS`，可以使用以下命令获取：


  ```

  apt-get install pixiwps

  ```


  ### 运行 PixieWPS


  通常，`PixieWPS` 与 `Reaver` 配合使用。`Reaver` 是允许你对 WPA/WPSK 网络进行暴力破解的程序。`PixieWPS` 通过捕获离线攻击所需的数据来帮助加速这一过程。


  在 Kali Linux 上使用 `Reaver`，你应该使用以下命令：


  ```

  reaver -i <interface> -b <BSSID> -c

  ```


  将 `<interface>` 替换为你的监控接口，并将 `<BSSID>` 替换为目标网络的 MAC 地址。


  ## 8. 运行 PixieWPS 步骤指南


  一旦你设置好所有内容，就可以按照以下步骤执行 pixie 攻击。


  ### 针对旧系统的基础黑客方法


  接下来的黑客操作对于当前的操作系统更有用。


  1. 确定无线适配器的名称。目标计算机可能有多个网络。如果是这样，你必须知道你想扫描的网络名称。要查看计算机拥的所有适配器，输入 `ifconfig`。


  2. 开启监控模式。你可以通过 `airmon-ng start wlan0` 来实现。命令中的 `0` 代表你想要破解的网络。输入此命令将创建一个虚拟控制台，被称为监控（monitor）。在你的显示器上可能显示为
  `mon`。


  3. 一旦进入，你可以启动 `msfconsole`。这将让你能够访问各种黑客工具。


  ```

  msfconsole

  ```





  4. 从这里开始，你可以将捕获的数据包存储在文件中。使用 `airodump` 命令即可实现。你将使用的完整命令看起来如下：`airodump-ng mon0`（加上你想要捕获的文件名）。在这个示例中，`mon0`
  中的 `0` 是网络名称。因此，你使用的数字可能与示例中的不同。


  你可以在格式为 `(name of the file).cap` 的文件中找到捕获的数据包。不过，你不能立即这样做，你必须等待到有足够的数据。


  1. Wi-Fi 已被破解。此时，你只需要输入命令 `aircrack-ng` 来确定密码。记住，这需要几秒钟，所以不要期望每次都能立即获得结果。此命令需要在一个新的终端窗口中执行。


  2. 程序可能会询问你想要破解哪个 Wi-Fi，但只有在有多个选项可选时才会询问。如果密码很弱，你应该很快就能进入。对于非常强密码，你需要更多的数据包。当你拥有
  15,000 个数据包后，程序会自动再次尝试，如果失败了，它将在每增加 5,000 个数据包的节点处继续尝试。


  # 破解 WPA 和 WPA2


  破解 WEP 网络非常简单。正如我们之前讨论过的，它的安全性并不十分严密。要破解 WPA 或 WPA2 网络将花费额外的精力。你可能甚至无法使用 Kali Linux
  找到进入的方法。暴力破解攻击可能花费几年时间。这取决于密码的长度以及创建网络安全的许多其他因素。


  WPA 技术的问题在于它可能非常难以配置。为了方便起见，引入了 WPS 来作为 WPA 的补充，但它也带来了一个可以利用的漏洞，而像 `Reaver` 这样的程序非常擅长利用这个漏洞。攻击仍然可能需要几个小时才能完成，但比比多年都无法进入要好。


  WPS 向客户端发送一个 8 位的 PIN 码。这些 PIN 码只包含数字，因此破解所需的猜测次数有限。尽管如此，考虑到所有可能的选择，尝试每一个猜测可能需要非常长时间。WPA
  使用字符、数字和字母，因此猜测密码会变得困难得多。在 WPS 中，等待 AP 响应会有轻微的延迟。你可能每秒只能获取几个密钥。即使以那个速度，可能仍需要几年才能进入，但幸运的是，存在一些可以利用的漏洞。


  我们知道第 8 位数字始终是之前所有数字的校验和。这大大减少了可能性，但花费的时间仍然太长，不值得我们去尝试。我们还可以将 PIN 码分成两个独立的部分，这使得工作速度快了一倍。这根结底是
  11,000 次猜测，尽管几率上我们可能在找到答案之前不需要耗尽所有的猜测。这意味着遍历每个猜测大约需要三小时，所以你的破解时间大约不到三小时。不过，如果你尝试密钥的速度很慢，可能会花费更长时间。


  要执行攻击，你不需要做很多复杂的工作。如果你一切准备就绪，只需输入命令即可：


  ```

  reaver -i (interface-name) -b (BSSID of your target)

  ```


  如果你知道如何破解 WEP，那么这个过程基本上是相同的。这次我们使用的是 `Reaver`，这让你的操作变得更简单，但总体来说仍然更难，因为你破解的是 WPA
  或 WPA2，而不是简单得 WEP。


  1. 启动 Kali Linux，然后开始监听模式。该命令是：`airmon-ng start wlan0`。就像我们向你展示的上次破解一样，`0` 代表网络名称（这是一个数字）。一旦知道该名称，将我们的
  `0` 替换为正确的数字。


  2. 你需要你要破解的网络的 BSSID 数字。


  3. 如果启用了 WPS，那么这种破解方法将无效。如果你想检查 WPS 激活状态，请使用 `wash` 命令或 `airodump-ng`。使用 `wash`
  非常简单，因为它是专门为此目的设计的。


  4. `wash` 命令的用法如下：`wash -i mon0`。记住替换那个 `0`。这将以监听模式启动你的系统。如果你在使用 `wash` 之后看到任何网络，说明
  WPS 已启用，你可能不得不放弃。


  5. BSSID 数字需要与 `Reaver` 结合用于你的下一个命令。命令是 `reaver -i mon0 -b (BSSID number)`。`Reaver`
  还有更多你可以使用的进阶选项，你可能想要利用它们来提高破解的效率。例如，`-vw` 选项会让你的工具输出更详细，直接在终端上告诉你正在发生什么。所以，如果你擅长破解和使用
  `Reaver`，那么这是一个无价资产。它还能帮助你在问题发生时进行排除。如果你打算使用这个工具，只需输入命令：

  ```

  reaver -i mon0 -b (BSSID number) -vv

  ```


  6. 现在你进去了。如果你遇到任何问题或过程比预期的要长得多，那么你可能需要……


