  ## 10


  #### 额外资源


  这里是一些可以让你生活更方便的破解工具。它们应该与之前涵盖的内容一致。


  ### Aircrack

  这个属于最流行的破解工具之一。它适用于 WPA，所以请确保你正在使用正确的网络。如果不支持，这个工具对你帮助不很大。你可以找到 `aircrack-ng`。


  ### Airjack

  你将使用此工具利用中间人攻击。这是一个数据包注入程序，可以在 `sourceforge.net/airjack` 获取。


  ### Onlinehash.com

  使用字典攻击自动为你进行猜测。它适用于 WPA，你可以在 `onlinehash.com` 找到。


  ### CommView for Wi-Fi

  这个协议分析工具也执行无线监控。它可以解码来自 WEP 和 WPA 的数据包。如果你想跟踪 Wi-Fi 流量以便确切知道谁在使用你的网络，那么这就是你需要的绝佳工具。你可以在
  `tamos.com/commwifi` 获取它。


  ### inSSIDer

  这个需要付费，但是一个获奖扫描器。它适用于大多数版本的 Windows 以及 OS X。它用于嗅探网络局域网，你可以在 `insser.com` 以约 20 美元找到它。


  ### OmniPeek

  OmniPeek 仅适用于 Windows 系统。它是一个从网络捕获流量的网络分析器。你可以在 `wildpackets.com` 找到这个优秀的故障排除工具。


  ### WireShark

  与 inSSIDer 一，`WireShark` 非常适合分析网络协议。你可以用它检查网络流量，但对网络协议的工作原理有良好的理解会有帮助。你可以在 `wireshark.org`
  找到它。






  [`www.wireshark.org/`](https://www.wireshark.org/)


  # WepAttack


  这是一个开源的 Linux 工具，非常适合破解 802.11 WEP 网络的密钥。你需要一张无线网卡才能运行它，它采用的是一种相当标准但速度较慢的字典攻击方法。你可以在[这里](http://wepattack.sourceforge.net/)找到它。


  [`wepattack.sourceforge.net/`](http://wepattack.sourceforge.net/)


  大多数此类工具都是免费提供的并且定期更新。因此，你在下载和测试它们时应该不会遇到任何问题。在查看付费工具之前，你一定要先研究免费工具，看看它们能否满足你的需求。


