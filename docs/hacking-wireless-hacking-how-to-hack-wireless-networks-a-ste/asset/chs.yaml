  ## 1. 破解：如何在 2 小时内破解无线 WEP/WPA/WPA2 网络：初学者分步指南


  “破解”一词会让人想到各种非法活动，所以让我们先说明免责事项。我们绝不支持任何形式的非法活动。书中介绍的破解方法供信息安全专业人士和网络安全人员使用。您应该在您所在地法律允许的情况下使用这些信息。


  网络破解应在您已许可进行破解的网络上进行。您需要检查在您居住的城市、州和国家进行此类操作是合法的。


  书中介绍的方法旨在检查安全漏洞、加强安全网络并帮助私有网络运行更顺畅。


  现在我们已经解决了法律要点，让我们来谈谈如何破解您的网络。如果您需要书中之外的指导，请查看其他资源。在那里，您将找到如何直接在收件箱接收免费视频的说明。只需在网站上输入您的电子邮件地址，我们将为您发送免费的分步视频，帮助您解决各种常见的操作系统问题。您将学习到一些新技巧，并能够更好地控制操作系统并保持安全。


  ### 认识 Linux

  为了使用我们将讨论的工具，您需要对 Linux 有基本的了解。Linux 是一个开源操作系统，这意味着任何人都可以进行修改或分发。它是免费使用和下载的，但由各种公司开发的特定用途的特殊
  Linux 程序可能需要付费。开发者会将这些修改过的 Linux 系统卖给任何感兴趣的人。因此，虽然 Linux 是免费的，但如果您想要比原版 Linux 系统不同的东西，可能需要付费。


  Linux 与 Windows 非常相似，因为它们都是操作系统。它基本上允许计算机上的所有程序在统一的系统下运行。没有操作系统，您就无法使用计算机上的程序。但
  Linux 几乎可以在任何地方运行——您的手机、平板电脑甚至手表上。它也在不断变化，由世界各地的开发者和公司不断更新和修改。Linux 新版本的发布频率比任何其他操作系统都高，因此在深入学习我们将要使用的某些工具之前，熟悉最新版本是一个好主意。


  ### 我们的破解网络方法

  通过我们在书中为您列出的分步指南，您可以学习如何破解一个无线网络，而且您最少只需两小时即可完成。这可能不是一个非常简单的过程，但我们将尽可能为您简化。我们假设您是该领域的新手，并且不了解所有的术语和流程。这样，这本书几乎可以任何人可以使用。如果您已经理解了某些步骤，那么您可能想跳过让您遇到困难的环节。我们将缓慢地讲解所有内容，以确保您完全理解，并在进入您的网络时没有任何问题。


  ### 现场操作系统 (Live Operating Systems)

  现场操作系统是便携的。它可以被下载到 USB 闪盘或 DVD 中。您可能会听到它被称为“插棒上的操作系统”甚至“插棒上的电脑”。这基本上意味着它可以通过 USB
  闪盘带到任何地方。该操作系统有时可以像计算机一样运行，甚至可以存储文件和程序，因此您基本上可以随身携带您的计算机。





  如果你将该 Live 操作系统插入到已经在运行 Windows、Mac OS 或 UNIX 的计算机 USB 端口上，那么它仍然可以使用你在 U 盘上的那个操作系统。在这种情况下，我们谈论的是
  `Linux` 或某个版本的 `Linux`。一旦你插入 U 盘或放入 DVD，该便携式介质上包含的操作系统将临时覆盖计算机上当前正在使用的任何操作系统。它不会对该操作系统进行任何永久更改。它只是接管一段时间。一旦你移除介质，你的操作系统就会随之移走，计算机、手机、平板电脑等设备就可以恢复正常运行。


  现在，当你尝试对运行在公司网络上的计算机进行行安全检查时，这真的非常有用。如果你负责网络安全，你可能需要检查单台计算机，但你又希望通过这台计算机访问你的程序和文件，以便进行诊断。Live
  操作系统是该问题的完美解决方案，它允许你将所知和熟悉的内容应用到任何地方。


  我们将向你展示如何操作。


  ## 2


  # 什么是 Kali Linux？


  现在我们谈到了由公司或各种开发者针对特定用途进行修改的 `Linux` 版本。这就是 `Kali Linux`，它专门用于提供网络安全。在某些方面，它是非常基础的。它无法运行许多程序，因为它并不是为了提供通用的操作系统服务。它的运行方式不像
  `Windows` 甚至不像基础的 `Linux` 系统。相反，它高度专注于网络安全。


  我们将在黑客指南中使用 `Kali Linux`，因此我们将介绍它的核心内容。


  ### 如何获取 Kali Linux


  尽管 `Kali Linux` 被全球的安全专业人员所使用，并且是一个高度专业化的 `Linux` 版本，但它不会花费你任何费用。开发者承诺它将永远免费，即使他们继续为他们版本的
  `Linux` 提供支持和更新也是如此。他们还确保不会让任何人对操作系统进行修改。他们将 `Kali Linux` 称为一种开源操作系统，但它是由一个在严格安全保护下工作的小组开发的。他们仔细审查所有更改，并确保产品保持绝对的安全性。


  你只应该从经过验证的源下载 `Kali Linux`。以下页面 `https://www.kali.org/downloads` 和 `https://www.offensive-security.com/kali-linux-vmware-arm-image-download/`
  都提供了供你下载的 `Kali` 安全版本。


  ### Kali Linux 的功能


  这种操作系统被称为发行版（distribution），专为渗透测试和安全审计而设计。它旨在一次仅供单个用户使用。这限制了安全泄露的风险。


  事实上，这个系统对安全性非常特殊，因为它是为从事信息和网络安全工作的人员设计的。可以对其进行修改以允许更多用户使用并兼容许多程序，但并不建议这样做。这可能会损害系统的安全性，从而违背了它的初衷。


  建议你在 `Kali Linux` 系统的参数范围内进行工作，以防引入任何潜在的安全泄露。由于它是一个如此封闭的系统，它将与允许大量在线交互或开源的程序兼容。因此，`Steam`
  完全无法在它上面运行，`Launchpad` 以及许多其他常用程序也是如此。如果你想运行这些程序，那么你真的应该使用另一个并非设计成这样专注于狭窄领域的操作系统。


  如果你尝试在 `Linux` 上安装连接到网络的额外程序（例如 `Bluetooth`），那么你可能不会太好运。


