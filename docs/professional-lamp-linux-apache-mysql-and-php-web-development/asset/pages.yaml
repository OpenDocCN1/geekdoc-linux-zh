    # ## `__sleep`\n\nWhen you use PHP classes to store data that must persist across\
    \ pages or long periods of time, you can store the object using your favorite\
    \ method of persistence (files, database, session variables, or cookies), but\
    \ the objects must first be prepared.\n\nWhen you're rereading object data to\
    \ be stored, use the `serialize()` function. The `serialize()` function takes\
    \ any complex data structure and converts it into a string that can be stored\
    \ using your method of choice. Conversely, to retrieve your persisted data, use\
    \ the `unserialize()` function. The `unserialize()` function takes your serialized\
    \ string and converts it back to whatever complex structure it used to be.\n\n\
    To give the developer more flexibility when dealing with the serialization of\
    \ objects, the `__sleep` and `__wakeup` magic methods are provided.\n\nThe `__sleep`\
    \ magic method, if defined in the class, is automatically called immediately before\
    \ the object is serialized. This method is extremely useful for closing database\
    \ connections and cleaning up object resources.\n\nThe `__sleep` method can also\
    \ return an array containing the names or object values to be serialized, which\
    \ is useful when dealing with large objects. Only the necessary data will be serialized\
    \ while other data can be ignored."
