    # Alternatives to GRANT and REVOKE


    If, for some reason, you don’t feel like using the GRANT or REVOKE commands, you
    can manually create the users and apply the privileges directly to the MySQL access
    tables.


    MySQL stores the different levels of user privileges in four main tables inside
    the built-in mysql database. Each of the four main access tables corresponds to
    the four different access levels.


    At the global level, there is the user table, whose structure looks like this:


    | Field | Type |

    | --- | --- |

    | Host | varchar(60) |

    | User | varchar(16) |

    | Password | varchar(41) |

    | Select_priv | enum(''N'',''Y'') |

    | Insert_priv | enum(''N'',''Y'') |

    | Update_priv | enum(''N'',''Y'') |

    | Delete_priv | enum(''N'',''Y'') |

    | Create_priv | enum(''N'',''Y'') |

    | Drop_priv | enum(''N'',''Y'') |

    | Reload_priv | enum(''N'',''Y'') |

    | Shutdown_priv | enum(''N'',''Y'') |

    | Process_priv | enum(''N'',''Y'') |

    | File_priv | enum(''N'',''Y'') |

    | Grant_priv | enum(''N'',''Y'') |

    | References_priv | enum(''N'',''Y'') |

    | Index_priv | enum(''N'',''Y'') |

    | Alter_priv | enum(''N'',''Y'') |

    | Show_db_priv | enum(''N'',''Y'') |

    | Super_priv | enum(''N'',''Y'') |

    | Create_tmp_table_priv | enum(''N'',''Y'') |

    | Lock_tables_priv | enum(''N'',''Y'') |

    | Execute_priv | enum(''N'',''Y'') |


