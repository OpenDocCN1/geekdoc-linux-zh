- pgno: 192
  md: '# Site Security


    Notice that instead of simply creating a field to store the user’s password as
    raw text, you’re creating fields to store one-way hashes of the user’s password.
    Doing this ensures the password can still be compared to the value entered at
    the password prompt, but makes it extremely difficult for those who would try
    to crack the passwords if the database was compromised. If you’re familiar with
    either MD5 or SHA1, you know that they are both one-way hashing algorithms. It
    is nearly impossible to determine an original password after it has been hashed
    by either of the two.


    > *MD5 takes an input string and creates a 128-bit “unique” fingerprint, or hash,
    of the original input.*


    > *SHA1 behaves in a similar manner, but is slightly more secure, producing a
    160-bit “unique” fingerprint.*


    You may have noticed that the previous discussion didn’t speak in the absolute
    regarding the uniqueness or bullet-proof hashing provided by either of these two
    solutions. Until recently, MD5 has been considered a reasonable solution for hashing
    all but the most secure data, and SHA1 was the same. Neither encryption scheme
    is 100% uncrackable when brute force is used. A password-generating program could
    run through every combination of every character and every password length until
    it eventually finds an input string that matches the hash produced by either of
    the algorithms.


    Recent advances in crypto-analysis have proven, however, that MD5 can be defeated
    quicker by finding an input that produces an identical output hash, even though
    the input strings did not match — an inherent weakness in MD5. SHA1 as well has
    come under attacks as of recently, and as processing power increases, the time
    it takes to brute-force a hash decreases rapidly.


    To combat any sort of collision attacks as seen with MD5, you create the *Users*
    table to hold both MD5 and SHA1 hashes for the password. Doing this effectively
    makes any collision attack attempts futile — even if an intruder manages to find
    an input string that matches the MD5 hash, unless it’s the real password, it will
    not match the SHA1 hash.


    To make the database useful to the authentication script, you need to add at least
    one user:


    ```

    INSERT INTO users VALUES (''testuser'', MD5(''testpass''), SHA1(''testpass''));

    ```


    Note that the built-in MySQL functions *MD5()* and *SHA1()* are used when adding
    the passwords.


    # A PHP Basic Authentication Script


    Once your database is set up, create the following script, and save it as *phpauthbasic.php*:


    ```

    <?php

    // Define database constants

    define(''AUTH_HOST'', ''localhost'');

    define(''AUTH_USER'', ''WebAuth'');

    define(''AUTH_PASS'', ''AuthPass'');

    define(''AUTH_DB'', ''WebAuth'');


    function attempt_auth()

    {

    // Send authentication headers

    header(''WWW-Authenticate: Basic realm="Protected by PHP"'');

    header(''HTTP/1.0 401 Unauthorized'');

    ```'
