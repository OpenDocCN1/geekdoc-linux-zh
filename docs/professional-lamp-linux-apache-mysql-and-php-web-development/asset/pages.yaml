    # ## Assignment versus Cloning


    As you may already know by now, in standard PHP, there are two ways to assign
    data to a variable: assignment by value, and assignment by reference. The first,
    assignment by value, is most commonly used when setting simple values for variables,
    or copying other variables:


    ```

    $a = 5;

    $b = $a;

    ```


    Here you are using assignment by value. When the value of $a is changed, $b remains
    unchanged; when you assigned $b = $a, you simply created a copy of the value of
    $a, and assigned that value to $b.


    Assignment by reference is a bit different, however. Take the following example:


    ```

    $a = 5;

    $b = & $a;

    ```


    In this example, you are assigning by reference, using the = & operator. When
    the value of $a is changed in this situation, $b would change as well—since $b
    was assigned, by reference, the value of $a, both variables point to the same
    location in memory, and when that value in memory is changed, both variables change
    as well.


    In PHP5, all objects are assigned by reference, by default. This behavior is unlike
    PHP4, which assigned by value, unless the reference operator (= & ) was used.
    In PHP5, if you want to make a copy of an object, instead of using a reference,
    you must use the clone statement, as follows:


    ```

    <?php

    class Circle

    {

    public $radius = 10;

    }

    // Create the original object and set its parameters

    ```'
