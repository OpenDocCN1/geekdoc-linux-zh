- pgno: 112
  md: 'You can specify a single column in the FULLTEXT column list, or multiple columns
    in a comma-delimited list. It’s time to actually create a table with full-text
    searching in the VehicleInventory database:


    ```

    ```

    CREATE TABLE testft (testint int, testvc varchar(50), testtxt text, FULLTEXT (testvc,
    testxt)) ;

    ```

    ```


    You’ve just created a new table with a full-text index on the testvc and testtxt
    columns.


    # Altering an Existing Table to Support Full-Text Search


    Modifying an existing table to support full-text searching is a little bit trickier,
    but not by much. To add full-text search capability for an existing table, you
    use MySQL’s ALTER TABLE command, like so:


    ```

    ```

    ALTER TABLE tablename ADD FULLTEXT (columns)

    ```

    ```


    Now add a full-text index to the New_Vehicles table:


    ```

    ```

    ALTER TABLE New_Vehicles ADD FULLTEXT (description);

    ```

    ```


    Once that’s done, it’s time to put these indexes to good use.


    # Querying Using Full-Text Search


    Searching through a table in MySQL with full-text indexing enabled is a relatively
    painless process. All you need to do is use the MATCH() function in a WHERE clause,
    like so:


    ```

    ```

    SELECT [columns] FROM [table] WHERE MATCH ([indexed_columns]) AGAINST (‘keyword’)

    ```

    ```


    Inside the parameter list for MATCH, you can specify any number of columns, as
    long as they are part of a full-text index.


    Returning to the vehicle inventory database, it’s time to perform a search on
    the list of new vehicles. To search for the word “options,” you can use the following:


    ```

    ```

    SELECT vehicle_id, description FROM New_Vehicles WHERE MATCH (description) AGAINST
    (‘options’);

    ```

    ```


    Which should return the following:


    | vehicle_id | description | | 2 | part of the 2004 stock! Must sell! Loaded,
    all options! | 3 | Come drive this popular truck! 4WD, extended cab, many options.
    |


    Another neat trick that full-text searching can do is order the items by relevance,
    and return the relevance as well. To utilize relevance data, you can use the MATCH()...AGAINS
    T() functions in both the SELECT list and the ORDER BY clause, like so:'
  merge: -1
  img_proc: true
