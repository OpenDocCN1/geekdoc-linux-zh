  md: 'REQUEST_FILENAME Full local file system path for the item matching the HTTP
    request

    IS_SUBREQ Whether or not the request being processed is an internal subrequest;
    the value will be "true" if the request is a subrequest, "false" if not

    HTTPS A value of "on" indicates SSL/TLS is being used, "off" if not


    To use any of the variables from that long list, you wrap the variable name in
    curly braces, and prefix with a percent sign, like so:


    ```

    %(SCRIPT_FILENAME)

    ```


    To see RewriteCond in action, first rewrite a RewriteRule to make use of RewriteCond.
    The old rule looked like this:


    ```

    # Rewrite /category/ to catalog.php

    RewriteRule ^(\w+)?/ catalog.php?cat=$1&item=$2

    ```


    To accomplish the same goal using RewriteCond in conjunction with RewriteRule,
    use the following:


    ```

    # Rewrite /category/item/ to catalog.php

    RewriteCond %(SCRIPT_FILENAME) /(\w+)/?(\w+)/?$

    RewriteRule .+ catalog.php?cat=$1&item=$2

    ```


    Notice how the server variable SCRIPT_FILENAME was used as the test input string.
    Combining RewriteCond with RewriteRule using these server variables, you can come
    up with some interesting combinations. The following checks to see if the user’s
    browser can accept XHTML MIME types, and if so, changes the MIME type header sent
    for .html files:


    ```

    RewriteCond $(HTTP_ACCEPT) application/xhtml+xml

    RewriteRule .+.html$ - [T=application/xhtml+xml]

    ```


    Another helpful feature of RewriteCond is the ability to chain multiple lines
    together. When listing multiple RewriteCond statements in a row, they are all
    treated like a programmatic AND — the RewriteRule at the end will only process
    if all the RewriteCond matches return true. The previous set of rules could be
    rewritten using multiple RewriteCond statements, like this:


    ```

    RewriteCond $(HTTP_ACCEPT) application/xhtml+xml

    RewriteCond %(SCRIPT_FILENAME) \.html$

    RewriteRule .+ - [T=application/xhtml+xml]

    ```


    In addition to the standard string-versus-regex comparisons, you can actually
    make simple comparison and system-check conditionals with RewriteCond. To compare
    your input string against another simple string, you can use the following as
    your conditional pattern:


    ```

    <CondPattern

    >CondPattern

    =CondPattern

    ```'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'Each of these checks if the input string is less than, greater than, or equal
    to, the **CondPattern**, respectively. For example, if you wanted to make a certain
    area of your website forbidden after a given year, you could use the following:


    ```

    ```

    RewriteCond %{TIME_YEAR} >2005

    RewriteRule .* - [F]

    ```

    ```


    Along with these simple comparison operators, you have access to six more conditional
    checks that evaluate the statuses of files and directories:


    | Comparison Operator | Meaning |

    | --- | --- |

    | -d (is directory) | Tests if a directory exists that matches the test string
    |

    | -f (is regular file) | Tests if a regular file exists that matches the test
    string |

    | -s (is regular file with size) | Tests if a regular file exists that matches
    the test string, and has a size greater than 0 bytes |

    | -1 (is symbolic link) | Tests if a symbolic link exists that matches the test
    string |

    | -r (is existing file via subrequest) | Tests if a regular file is accessible
    after considering all of the server''s access controls; uses an internal subrequest
    to perform the check (performance hit) |

    | -U (is existing URL via subrequest) | Tests if a URL is accessible after considering
    all of the server''s access controls; uses an internal subrequest to perform the
    check (performance hit) |


    For example, to check to see if an image exists and actually contains some data,
    you could use the following:


    ```

    ```

    RewriteCond %{REQUEST_FILENAME} \.jpg$

    RewriteCond %{REQUEST_FILENAME} !-s

    RewriteRule .* - [G]

    ```

    ```


    The first condition checks to see if a **.jpg** file is called, and the second
    condition actually checks to see if the file either doesn’t exist, or is 0 bytes.
    Note the use of the exclamation point before the -s conditional pattern. Any conditional
    pattern used in **RewriteCond** can be prefixed with an exclamation point, thus
    negating it---identical to the use of the exclamation point in PHP conditionals.


    # ## RewriteCond Flags


    To help control **RewriteCond** further, a couple of flags are provided, similar
    to the **RewriteRule** flags.


    # ### nocase|NC


    Like the same-named flag used with **RewriteRule**, **nocase** specifies that
    the regular expression to be evaluated is case-insensitive.'
  merge: -1
