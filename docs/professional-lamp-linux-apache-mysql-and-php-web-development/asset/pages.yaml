- pgno: 31
  md: '# RecursiveIterator


    The `RecursiveIterator` class assists with recursive iteration, or the act of
    functions being automatically called over and over again until a certain criterion
    is reached. Functions that come with this class help you determine if there are
    child iterators, and what those children might be.


    # ArrayIterator


    With the `ArrayIterator` built-in class, you can modify `array` values and keys
    while iterating over an object. It allows you to manipulate arrays with each iteration.
    Functions such as `append()`, `copy()`, and `seek()` enable the coder to work
    with arrays above and beyond the usual set of array functions.


    Iterators are continually being improved upon and enhanced, and you can expect
    to see some big changes with PHP 5.1.


    # Constructors and Destructors


    In PHP4, you could call a method immediately in a class by naming it the same
    as the class name. In PHP5, there is a new “magic method” name for this purpose,
    called `__construct()`. By including this method in your class, it will be called
    automatically when the object is created.


    Likewise, the object will be destroyed when the magic method `__destruct()` is
    included in your class. This method destroys the object when called. The `__destruct()`
    method will also be called if there are no more references to your object, or
    if you reach the end of your PHP script.


    Chapter 2 includes a more in-depth discussion of constructors and destructors.


    # Access Modifiers


    You can now control the level of visibility of your class members and methods
    with three keywords new to PHP5: `public`, `private`, and `protected`. Methods
    and members are denoted as `public`, `private`, or `protected`.


    The following is a brief summary of the `private`, `protected`, and `public` keywords
    (you can read more about these properties in Chapter 2):


    +   * `Public`: These members and methods are available to the entire script.
    They can be referenced from within the object or outside of the object.

    +   * `Protected`: Members or methods that are identified as protected are available
    only from within the object or an inheriting class.

    +   * `Private`: Private methods and members are available only from within the
    object itself and are not available to any inheriting class.


    # The final Keyword


    The `final` keyword can be used with a class or a method within a class. When
    used with a class, this keyword blocks any other class from inheriting it. When
    used with a method, it keeps any inheriting class from overriding the method,
    effectively ensuring their permanency, and protecting them from other programmers
    or even yourself.'
