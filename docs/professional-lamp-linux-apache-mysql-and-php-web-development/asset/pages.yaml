- pgno: 261
  md: "# # Chapter 10\n\n```\nfunction drawHR($res) {\n    $xpos = MARGIN;\n    $ypos\
    \ = pdf_get_value($res, \"texty\", 0) - VERT_SPACING;\n    pdf_moveto($res, $xpos,\
    \ $ypos);\n    pdf_lineto($res, PAGE_WIDTH - MARGIN, $ypos);\n    pdf_closepath($res);\n\
    \    pdf_fill($res);\n    $ypos = pdf_get_value($res, \"texty\", 0) - (VERT_SPACING\
    \ * 2);\n}\n\n```\n\nThe `drawHR()` function accepts a PDF resource, `$res`, as\
    \ an argument. It sets the initial x and y positions of the line, using constant\
    \ values and the `pdf_get_value()` function with the `texty` parameter. The third\
    \ parameter of the `pdf_get_value()` function is a numeric “modifier” applied\
    \ to the value specified by the second parameter. In most trivial cases, the value\
    \ of this parameter will be 0. Thus, the last line of the `drawHR` function might\
    \ more elegantly be written as follows:\n\n```\n$ypos = pdf_get_value($res, \"\
    texty\", (VERT_SPACING * -2));\n```\n\nA useful concept to grasp in PDF document\
    \ creation is that of the `path.` The `pdf_moveto()` function positions the starting\
    \ point within the document and `pdf_lineto()` draws a line along the path between\
    \ the two positions. The `pdf_closepath()` and `pdf_fill()` functions close then\
    \ fills the path. Finally, the y position is incremented by twice the vertical\
    \ spacing constant.\n\nAnother useful function might apply similar, yet distinct\
    \ styles in accordance with a passed parameter:\n\n```\nfunction pdflib_show($res,\
    \ $text, $type) {\n    $font = pdf_findfont($res, \"Times-Roman\", \"winansi\"\
    , 0);\n    $xpos = MARGIN;\n    $ypos = pdf_get_value($res, \"texty\", 0) - VERT_SPACING;\n\
    \    switch ($type) {\n        case CASE_CATEGORY:\n            $font = pdf_findfont($res,\
    \ \"Times-Bold\", \"winansi\", 0);\n            $ypos = pdf_get_value($res, \"\
    texty\", 0) - (VERT_SPACING * 3);\n            break;\n        case CASE_LIST:\n\
    \            $xpos = MARGIN + TAB;\n            $text = \"* \" . $text;\n    \
    \        break;\n        case CASE_OBJECTIVE:\n            $font = pdf_findfont($res,\
    \ \"Times-Italic\", \"winansi\", 0);\n            $xpos = MARGIN + TAB;\n    \
    \        $text = \"*\" . $text . \"*\";\n            break;\n    }\n    pdf_setfont($res,\
    \ $font, 12.0);\n    pdf_show_xy($res, $text, $xpos, $ypos);\n    return;\n}\n\
    \n```\n\nAs you will see in the example that wraps up this section, this code\
    \ uses a `switch` control structure to set specific type faces and text positioning\
    \ according to the value of the `$type` parameter.\n\nFont selection is performed\
    \ by the `pdf_findfont()` function and set via the `pdf_setfont()` function. PHP’s\
    \ PDFlib implementation typically installs a few fonts by default in the “pdf-related”\
    \ directory in"
