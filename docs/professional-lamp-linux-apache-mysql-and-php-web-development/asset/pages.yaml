  md: "# ## Chapter 5\n\nIf a PHP version requirement is found, you then replace the\
    \ array of `simplexml_elements` returned from `xpath()` with the first (and hopefully\
    \ only) object in the array:\n\n```\n```\n// Flatten element array\n$phpreq =\
    \ $phpreq[0];\n```\n```\n\nThe PHP version check can have two attributes assigned:\
    \ one that specifies a minimum version of PHP allowed, and another that specifies\
    \ a maximum version. For both the minimum and the maximum, you first check to\
    \ see if the attribute exists, and then use the built-in `version_compare()` function,\
    \ in conjunction with the `$phpversion()` function. The `version_compare()` function\
    \ takes two methods, each a “PHP-standardized” version number string, such as\
    \ 5.0.4, or 5.0.5RC1. If the first argument is lower, the function returns −1;\
    \ if the second argument is lower, it returns +1; if both arguments are equal,\
    \ it returns 0:\n\n```\n```\n// Check minimum version\nif ($phpreq['minversion']\
    \ and\n    version_compare($phpversion(),\n                    $phpreq['minversion'])\
    \ < 0)\n{\n    $this->message = \"Warning: \" .\n                     \"PHP version\
    \ is less than \" .\n                     $phpreq['minversion'] . \".\\n\";\n\n\
    \    return false;\n}\n// Check maximum version\nif ($phpreq['maxversion'] and\n\
    \    version_compare($phpversion(),\n                    $phpreq['maxversion'])\
    \ > 0)\n{\n    $this->message = \"Warning: \" .\n                     \"PHP version\
    \ is greater than \" .\n                     $phpreq['maxversion'] . \".\\n\"\
    ;\n\n    return false;\n}\n\nreturn true;\n```\n```\n\nNow that you’ve checked\
    \ the required extensions, and investigated if the version of PHP installed is\
    \ supported by your application, you need to check the runtime configuration to\
    \ make sure the environment matches what you coded against. In `checkConfig()`,\
    \ you start out by gathering all configuration settings into an array, using `ini_get_all()`:\n\
    \n```\n```\npublic function checkConfig()\n{\n    $returnValue = true;\n\n   \
    \ // Get all config values\n    $cfg = ini_get_all();\n```\n```\n\n126"
