    # ## Retrieving Information


    You''ve spent all that time creating your database tables and populating them
    with data; now it''s time to get some of that data back out. For this, you will
    use the SELECT statement. A simplified form of SELECT looks something like this:


    ```

    ```

    SELECT [column_names] FROM [table] WHERE [criteria]```

    ```


    If you wanted to retrieve a list of the colors of your used cars, for example,
    you would use something similar to the following:


    ```

    ```

    SELECT color FROM Used_Vehicles```

    ```


    which would return the following:


    | color        |

    |--------------|

    | White        |

    | Deep Green Pearl |

    | Reflex Silver |

    | Red          |'
