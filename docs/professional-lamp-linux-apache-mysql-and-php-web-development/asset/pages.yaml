- pgno: 332
  md: '# # 13

    # Content Management

    # Systems


    A Content Management System (CMS) assists a software or Web developer in organizing
    and facilitating any collaborative process and its final outcome. The term “content
    management” loosely refers to not only the checking in and out of files, but also
    the generalized sharing of information, such as common calendars, wikis, and the
    like. The earliest Content Management Systems emerged around 1975 when mainframes
    and electronic publishing required really began to catch on. These earliest versions
    were basically nothing more than general repositories that enabled multiple users
    to participate in the same project.


    As computer systems became more and more complex, the need to effectively manage
    content also becomes more complex. As the Internet came to fruition, so did the
    wave of CMSs. Now there are more CMSs than you can shake a stick at. The goal
    of this chapter is to try and wade through all the muck to help you define whether
    you need a CMS, which variety of CMS is right for your project, and how you can
    use a CMS to improve your efficiency.


    # ## Types of CMSs


    CMSs come in all shapes and sizes, and can basically manage anything being worked
    on by a team of individuals. From managing simple static website content, to allowing
    collaborative documentation across the Internet (wiki), CMSs perform many functions.
    CMS packages can generally be classified into two categories: Enterprise CMSs
    and Web CMSs.


    # ### Enterprise CMSs


    These high-powered software packages are usually comprehensive solutions, delivering
    effective content management for use on an enterprise, or corporate level. They
    are designed to help a corporation become more efficient and cost-effective, and
    increase accuracy and functionality, while decreasing human error and customer
    response times.'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# Chapter 13


    They can integrate corporate functions such as shipping and delivery systems,
    invoicing, employee and human resource issues, customer relations, and document
    management and transactional (sales) systems. Enterprise CMSs bring data management
    down to the user level so many users can add their individual piece to a very
    large integrated pie. Software companies deploying these complex systems pride
    themselves on offering highly customized company-wide solutions, and the software
    usually comes with a relatively hefty price tag.


    # Web CMS/Portals


    Web CMS packages are mostly created for use on the web. They can incorporate numerous
    functions, or have one specific function they are centered around. They allow
    users to update portions of a common Web site or collaborate in a website "community."
    Web CMSs can make a developer’s life easy by bringing functionality to a website
    quickly and easily, and allowing a lead developer to include others in site development
    and maintenance without fear of straying from the standards. Open source Web CMS
    packages will be the focus of this chapter, in particular the PHP/MySQL packages.


    A subset of the Web CMS category is groupware. This type of package runs over
    an intranet or over the Internet and is designed to allow collaboration between
    users, presumably working for the same company, working on the same projects.
    They typically offer features such as project management, file checking in and
    out, calendar systems, email, and internal forums.


    # Open Source Web CMS Packages


    Common functions of a Web CMS include:


    +   - **Static web page updates**: Updates content without altering look and feel
    of site.

    +   - **Weblogs (blogs)**: Online journals.

    +   - **Wiki**: Collaborative documentation projects.

    +   - **Publications**: Posting and organization of news articles.

    +   - **Managed learning environments**: Web-based learning.

    +   - **Transactional CMS**: E-commerce functions.

    +   - **Image and file galleries**: Compilation of images or files for public
    use.

    +   - **Forums**: Bulletin board systems fostering discussions between users.

    +   - **Chat rooms**: Real-time chatting between users.

    +   - **RSS feeds**: Allows users to download content.

    +   - **Polls**: Allows users to vote on a topic.

    +   - **Calendar systems**: Web-based multi-user calendars.


    There are numerous other functions that could be considered underneath the CMS
    realm, but these are the major ones and the ones on which this chapter focuses.


    First, take a look at some of the more comprehensive open source CMS packages.'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# All-Inclusive Web CMSs


    Like fency tropical resorts that wrap up your vacation all into one nice neat
    package, these comprehensive Web CMSs can do as little or as much as you like.
    The following sections introduce you to some of the more popular packages available,
    although a myriad of these can be found on websites such as http://www.sourceforge.net.
    This text does not go into detail about installation on these packages, as you''ve
    probably had some experience in this department in the past. However, if there
    are any special considerations regarding installation, they will be duly noted.
    As well, you need to have all aspects of the LAMP system working properly before
    installing these packages.


    Most all-inclusive Web CMSs have common functionality such as changing user permissions,
    modifying site layout, changing server settings, and so on. One thing that should
    be mentioned is that there is a lack of transactional CMS interfaces (shopping
    carts for e-commerce) with many of the so-called comprehensive CMS packages available.


    # ExponentCMS


    ExponentCMS is available at http://www.exponentcms.org. At the time of this writing,
    the most current version is 0.96.3, and is what this section is based on. On the
    Exponent/Sourceforge interface at http://sourceforge.net/projects/exponent/, you
    can find links to screenshots, documentation, contributions, and the standard
    Sourceforge information.


    # Installation Notes


    Installation is relatively simple, and the only thing you need to know before
    installation is that you will need to create a database. This applies to both
    remote and local installations. You will also need to have a user and password
    set up, as you will be asked to supply all that information during the installation
    process.


    # General Overview/Default Installation


    Installing this CMS gives you several features that are “active” by default. These
    are:


    +   - Address Book: Organizes contact information.

    +   - Admin Control Panel: Easy-to-use interface for administering the site.

    +   - Calendar System: Keeps track of events with different views.

    +   - Contact Form: Allows visitors to be site to contact you.

    +   - Image Manager: Works with other modules to manage images on the site.

    +   - Preview Link: Lets those working on the site preview their work.

    +   - Private Messaging Center: Allows users to send emails or private messages
    to one another.

    +   - Resource Manager: Organizes and displays uploaded files.

    +   - Text Module: Displays text and keeps track of revisions.

    +   - Weblog/Online Journal Manager: Organizes blog entries.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# Chapter 13


    The ‘‘inactive’’ features (those you can simply turn on) are:


    +   - **Banner Manager**: Manages banner ad campaigns and click-throughs.

    +   - **Content Rotator**: Displays different images or text to the user each
    time they visit the site.

    +   - **Flash Animation Manager**: Organizes a Flash Animation.

    +   - **Form Module**: Manages any forms on the site.

    +   - **HTML Template Manager**: Manages uploaded HTML templates.

    +   - **Login Module**: Allows users to log in to the site.

    +   - **Multi-site Manager**: Allows you to create and manage other sites.

    +   - **Navigator**: Manages the navigation system.

    +   - **News Feed System**: Organizes and displays news articles.

    +   - **Search**: Allows users to search the site.

    +   - **UI Swticher**: Gives users with the correct permissions the ability to
    switch from user to administrator.


    Through the easy-to-use admin Module Manager, you can activate or deactivate any
    of these modules with the click of a button.


    Other modules are available for downloading from http://www.sourceforge.net. With
    the Extension Upload Manager, installing modules is easy; you don’t even need
    to unzip them. These extensions include:


    +   - **Article Manager**: Organizes and displays articles on the site.

    +   - **Bulletin Board**: Manages site forum.

    +   - **FAQ**: Manages the FAQ section of the site.

    +   - **Image Gallery**: Allows users to rank and view images.

    +   - **Listing Manager**: Organizes and manages listings, such as real estate
    listings.

    +   - **Page Displayer**: Allows you to upload and display dynamically generated
    pages (such as PHP).

    +   - **Slideshow**: Manages slideshows on the site.


    Besides installing, activating, and deactivating site modules, as the site admin
    you can import data (such as a user list in csv format) through the admin interface.
    This makes it easy for you to convert from another system or from an internal
    database.


    There is the WYSIWYG HTMLArea editor also embedded into the software, making it
    easy for your authors and contributors to add text. As an admin, you also have
    control over the HTMLArea toolbar, which lets you determine what text options
    your users have.


    # Customizing the Default Settings


    Like most other CMS packages, you can alter user settings in the Admin Control
    Panel. With Exponent CMS, you can set approval policies based on users and content,
    although this CMS is module-focused as opposed to user-focused. For example, you
    could create an approval policy for the Calendard module'
  merge: -1
  img_proc: true
- pgno: 336
  md: 'only that would require at least two approvals from other admins on the site
    before requested changes are shown. While you can also assign permissions for
    a module to a user or group, it is done through each specific module, rather than
    the user interface. There are no various levels of user access—either a user is
    an admin or not. Also, while you can view which users have permissions on which
    module, you cannot see all the modules a single user is responsible for.


    In addition, Exponent CMS gives you some control over your settings in the Configure
    Site area of the admin interface.


    # Database Settings


    You can switch between MySQL and PostgreSQL, and of course alter database name,
    username, password, port, and any table prefix names.


    # Display Settings/Themes


    There are several themes pre-packaged with the site, but creating your own theme
    is easy enough by editing the appropriate files (or creating your own from scratch).
    Unless you love to reinvent the wheel, our suggestion is to pick the theme that
    comes closest to the layout you want to go with and edit from there. There is
    a link at the bottom of each of the sample themes (under the Manage Themes page)
    that allows you to view the complete file list for that theme, making it easy
    for you to see which files you need to alter to fit your needs.


    In this section, you can also change how other contributors to the site are referenced,
    and how the dates and times are shown to website visitors.


    # General Configuration Settings


    Under this section, you can customize page titles, meta tags and keywords, and
    language selection. You can also turn on/off user registration, engage the CAPTCHA
    (Computer Automated Public Turing Test to Tell Computers and Humans Apart) test
    to prevent bots from registering, and control session timeouts and SSL settings.


    # SMTP Settings


    This is the place to set your SMTP ports, username, passwords, authentication
    methods, and so on. You can also switch to `php_mail()` function here if you would
    like.


    # Other Add-Ons


    Besides activating/deactivating pre-installed modules, and installing new modules
    made available, there is also a hefty list of other contributions offered up by
    the masses. This is available through Exponent’s Sourceforge interface site at
    http://www.sourceforge.net, under the Tracker> Contributions section. It includes
    some pretty helpful add-ons, such as adding horizontal drop-down navigation, so
    by all means check it out.


    # Changing the Layout and Look of Modules


    While it’s easy to add and delete modules with ExponentCMS, it is even easier
    to move them around on the page. Making modules look different from one another
    proves to be a bit of a challenge, however,'
  merge: -1
  img_proc: true
- pgno: 337
  md: '# Strengths and Weaknesses


    The strengths for this package are:


    +   - Changing the layout and placement of the modules proves to be an easy task
    and WYSIWYG in nature. In addition, you are able to break the traditional two-
    or three-column layout and add subcolumns to all three traditional columns.


    +   - Text modules keep track of revisions, and allow you to immediately view
    or restore old versions with one click. It would be nice if it showed *who* made
    the revision, but perhaps that feature will be available in future releases.


    +   - The Preview feature lets you see what effect your changes have on the look
    of the site, without having to log out as an admin.


    +   - Themes are a bit more esoteric and design-driven, as opposed to being function-driven
    as in some other CMSs.


    One weakness is in user administration — the admin can’t see all the permissions
    or module responsibilities an individual user has. For example, if Bob is going
    to be on vacation, and you wanted to assign Bob’s modules to someone else, there
    is no easy way to see what Bob has the ability to do and what modules he can modify.


    There is a reason CMS is on Sourceforge’s Top 10 “Most Active” download list.
    ExponentCMS is by *far* the easiest to administer open source CMS out there. Its
    strengths are more behind-the-scenes, however, as its focus is not necessarily
    on interactivity with the masses visiting the site, but on a core group of contributors
    over which the admin has control. If you’re in search of a good-looking “out of
    the box” site, ExponentCMS should be on your list to evaluate.


    # XOOPS


    XOOPS (eXtensible Object Oriented Portal System) is another popular comprehensive
    CMS available at Sourceforge, or at `http://www.xoops.org`. The most recent version
    is 2.1.1, and that is the version being discussing here (this is actually a pre-release
    to version 2.2, so keep that in mind).


    # Installation Notes


    The XOOPS team has written a very comprehensive installation guide that not only
    walks you through the installation and setup process, but also gives you the developer
    detailed information about what files are going where, and why. You should read
    this document — it can be found at `http://docs.xoops.org/modules/xdocman/index.php?doc=xu-002&lang=en`.


    A few things to point out before you install:


    +   - After unzipping the tar file, you will need to copy the html folder to the
    website root directory (such as htdocs or public_html). The XOOPS team recommends
    you rename this folder to xoops, but that is really up to you.


    +   - If you are installing on a remote server, you will need to create the database,
    user, and password prior to installation. If you are installing locally, the installation
    wizard will complete this task for you.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# Content Management Systems


    +   - Once you have unzipped the files, you will need to `chmod` the following
    directories and files to make them writeable:

    +       - uploads/

    +       - cache/

    +       - templates_c/

    +       - mainfile.php

    +   - You must have cookies and javascript enabled on your browser for the XOOPS
    installation wizard to complete the process correctly.


    # General Overview/Default Installation


    There are several features that are activated by default:


    +   - **Banner Management**: Manages banner ads and click-through.

    +   - **Image Manager**: Manages images and who can upload them.

    +   - **Smilies**: Manages “smilies” and how they are displayed.

    +   - **Avatars**: Manages avatars.

    +   - **Comment Manager**: Manages comments posted by users.

    +   - **User Management**: Edit, email, search, change ranks of users.

    +   - **Blocks**: Manages blocks (such as “who’s online” and “recent comments").


    The only module that is installed by default is the System Admin module. Other
    modules that are available by default as a part of the package (but need to be
    installed one by one) include:


    +   - **Contact Us**: Sends messages to the website admin.

    +   - **Downloads**: Organizes uploaded files, and allows users to rank them.

    +   - **Links**: Link manager.

    +   - **Forum**: Site forum (created by phpBB group).

    +   - **News**: Manages news articles submitted by users.

    +   - **Sections**: Allows admins to post different sections of the site.

    +   - **FAQ**: Manages FAQs for the site.

    +   - **Headlines**: RSS feed for news from other sites.

    +   - **Memberlist**: Shows the registered users for the site.

    +   - **Partners**: Organizes and displays partner sites.

    +   - **Polls**: Manages online surveys and polls.'
  merge: -1
  img_proc: true
- pgno: 339
  md: '# Customizing the Default Installation


    At the time of this writing, there are over 300 add-on modules available for download
    at the XOOOPS Web site. There is a module that can do virtually whatever you want,
    including transaction functionality (shopping carts) which is not too common among
    these types of CMSs.


    Under the System Admin section of the Admin Control Panel, you will find the following
    areas where you can further customize your installation:


    +   - **Avatars**: Allows you to upload available avatars for your users.

    +   - **Banners**: Manages your banner advertisements, and provides stats on click-through
    rates and which banners are active.

    +   - **Blocks**: Provides an interface for adding new blocks and determining
    their layout on the site.

    +   - **Comments**: Allows you to view, edit, and delete comments.

    +   - **Find Users**: Doesn''t allow customization of the site, but provides an
    extensive search interface for filtering out users.

    +   - **Groups**: The place where you assign users to different groups and set
    permissions for that group. Permissions are at the system, module, and block levels
    and allow either admin or access rights.

    +   - **Image Manager**: Manages the image gallery.

    +   - **Mail Users**: Doesn''t allow customization of the site, but allows you
    to send emails to users.

    +   - **Modules**: Allows you to install and activate or deactivate available
    modules.

    +   - **Preferences**: Provides general customization of the site and is broken
    down into several categories:

    +       - **General Settings**: Allows you to change the site name, slogan, admin
    email address, default language, module for the start page, server and default
    time zones, default theme (there are only three installed for you), users themes,
    usernames for anonymous users, gzip compression, cookie and session info, whether
    the site is completely down, and customized messages when site is down, IP address,
    SSL settings, banned IP addresses, and configure cache settings.

    +       - **User Info Settings**: Allows you to set password and username settings,
    what default groups users will belong to, avatar settings, blocked usernames (such
    as "admin"), and alter registration disclaimer.

    +   - **Meta Tags and Footer**: Allows you to set meta tag information, such as
    keywords, description, robots, rating, author, copyright, and the footer information.

    +   - **Word Censoring Option**: Allows you to censor unwanted words and replace
    them with words of your choice.

    +   - **Search Options**: Allows you to turn on or off global search settings
    and require minimum keyword length for user-driven searches.

    +   - **Mail Setup**: Allows you to configure mail server settings and mail methods.'
  merge: -1
  img_proc: true
- pgno: 340
  md: '+   * **Smilies:** Controls smilies for the forum, and allows you to create
    your own.


    +   * **Templates:** Allows you to upload templates to the site.


    +   * **User Ranks:** Controls user ranking system for the forum and allows you
    to configure the mini-mum number of posts for certain levels you define.


    +   * **Edit Users:** Enables you to delete users and edit their information —
    nickname, name, email, URL, time zone, instant messaging information, location,
    occupation, interests, signature, comments abilities, notifications, rank, password,
    and groups.


    # Strengths and Weaknesses


    The best portions of this package are:


    +   * Huge user base and support forums make it easy for a developer to find solutions
    to questions or to troubleshoot problematic areas.


    +   * Word Censoring option is a nice benefit.


    +   * Because the forum module was developed by phpBB Group, the forum controls
    are highly cus-tomized and detailed.


    The areas that could be improved are:


    +   * While the core documentation was extensive, documentation for add-on modules
    is quite lack-ing. Because the add-on features could potentially be a large portion
    of a website, this could be frustrating for inexperienced individuals.


    +   * Only three themes are included in default installation, and with such a
    large support and user base, it stands to reason that there could be more pre-installed.


    XOOPS is popular because of its potential, although you have to be willing to
    decipher other people''s code and have the luxury of time to fine-tune your installation
    to fit your specific needs. While it''s not that great as an “out of the box”
    solution, it can accomplish virtually anything you need it to, if you''re willing
    and able to spend some time coding. It''s very user-oriented, allowing you as
    an admin to control the environment for the users all the way down to the “smilies.”
    If you''re focused on creating an interac-tive community with anyone who ventures
    to your site, you should give a second look to XOOPS.


    # phpWebsite


    phpWebsite is available at http://phpwebsite.appstate.edu. The most recent version
    of phpWebsite at the time of writing is 0.10.01, and will be the basis for the
    discussion here.


    # Installation Notes


    The kind folks at Appalachian State University (the creators of phpWebsite) have
    set up a command-line installation process that allows you to install directly
    from the phpWebsite site. You can also download the application in sections (core,
    theme packs, and so on) and install them yourself.'
  merge: -1
  img_proc: true
- pgno: 341
  md: "# Chapter 13\n\nA few things to keep in mind before you install:\n\n+   \n\
    +   -   You will need to have the following PEAR libraries installed to run the\
    \ core application:\n+       - Benchmark\n+       - DB\n+       - Date\n+    \
    \   - HTML_BBCodeParser\n+       - HTML_Common\n+       - HTML_Form\n+       -\
    \ HTML_Table\n+       - HTML_Template_IT\n+       - Mail\n+       - Mail_Mime\n\
    +       - Net_CheckIP\n+   -   If possible, you will need to be logged in as root\
    \ before you install. The script will detect if you are not the root user and\
    \ set up the application with certain security restrictions in place. If you try\
    \ to switch users, it will retain the original setup, and will not do a root install.\n\
    +   -   You must have wget or the installer will not operate.\n+   \n\n# General\
    \ Overview/Default Installation\n\nThe modules that are immediately available\
    \ and active for you are:\n\n+   \n+   -   **Apache Controller**: Allows an admin\
    \ to alter Apache settings.\n+   -   **Help System**: Helps the admin navigate\
    \ the system.\n+   -   **Language Administrator**: Manages the languages to be\
    \ used on the site.\n+   -   **Layout Manager**: Manages the layout for your site.\n\
    +   -   **Site Search**: Searches the site.\n+   -   **User Manager**: Approves\
    \ users for various levels of modding the site.\n+   -   **Announcements**: Manages\
