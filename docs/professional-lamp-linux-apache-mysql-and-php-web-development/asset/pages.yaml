    \ that is automatically called when an object is instantiated. In `PHP5`, to implement\
    \ a constructor, all you need to do is implement a method named `__construct`.\
    \ For example:\n\n```\n```php\n<?php\nclass Circle\n{\n    public function __construct()\n\
    \    {\n        // Perform actions when object is created\n        echo \"A circle\
