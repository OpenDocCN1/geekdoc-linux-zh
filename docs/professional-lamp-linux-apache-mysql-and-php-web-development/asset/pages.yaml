  md: '# Advanced MySQL


    A user will show up in this table only when they need explicit database-level
    permissions.


    Another table, `tables_priv`, houses the permissions for table-level operations:


    | Field | Type |

    | :--- | :--- |

    | Host | char(60) |

    | Db | char(64) |

    | User | char(16) |

    | Table_name | char(64) |

    | Granter | char(77) |

    | Timestamp | timestamp |

    | Table_priv | set(''Select'', ''Insert'', ''Update'', ''Delete'', ''Create'',
    ''Drop'', ''Grant'', ''References'', ''Index'', ''Alter'') |

    | Column_priv | set(''Select'', ''Insert'', ''Update'', ''References'') |


    Like the `db` table, a user need appear in this table only when they require table-level
    permissions.


    The final table, `columns_priv`, contains column-level access definitions, and
    looks like this:


    | Field | Type |

    | :--- | :--- |

    | Host | char(60) |

    | Db | char(64) |

    | User | char(16) |

    | Table_name | char(64) |

    | Column_name | char(64) |

    | Timestamp | timestamp |

    | Column_priv | set(''Select'', ''Insert'', ''Update'', ''References'') |


    Why do you need to know all the intimate details of each of these tables? If you
    want to add or remove access permissions without using `GRANT` or `REVOKE`, you
    must use standard `INSERT`, `UPDATE`, and `DELETE` commands against these core
    tables.


    To first create a user in the database, regardless of the access level, they must
    exist in the `user` table:


    ```

    INSERT INTO mysql.user (Host, User, Password) VALUES (''localhost'', ''testuser6'',
    PASSWORD(''testpass6''));

    ```


    Notice that the `PASSWORD()` function was used here, whereas in the `GRANT` syntax
    it is not. The `GRANT` command automatically encrypts the password with the `PASSWORD()`
    function; a manual insert such as this does not, so you must encrypt it yourself.'
