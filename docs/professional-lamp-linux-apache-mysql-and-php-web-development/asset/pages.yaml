- pgno: 315
  md: '# # Chapter 12


    | Directive | Default | Set In | Description |

    | :--- | :--- | :--- | :--- |

    | apc.cache_by_default | On | php.ini and httpd.conf | Controls the caching of
    all files. Use this directive to disable by-default caching of all scripts, allowing
    you to use the following apc.filters directive to gain greater control over which
    files are actually cached. |

    | apc.filters | "" (empty string) | php.ini and httpd.conf | Lets you define a
    comma-delimited list of regular expressions used to filter which files are cached.
    Using POSIX extended regular expressions—similar to PHP''s `ereg` functions—you
    specify a list of regular expressions to exclude certain scripts from caching.
    Any filename that matches a pattern in the list will not be cached, unless the
    pattern begins with a `+`, in which case they will be cached by APC. When creating
    the regular expressions, assume relative file-name paths, not absolute paths.
    |

    | apc.slam_defense | 0 (disabled) | php.ini and httpd.conf | Defined using numbers
    0 through 100, this directive specifies the probability that a server process
    will skip caching a previously uncached file. Used primarily on extremely busy
    web servers, apc.slam_defense is used to combat a race condition when multiple
    server threads try to cache the same file at the same time. |


    # ## Removing APC


    If there comes a time that you no longer want APC after you’ve installed it, you
    can follow these simple steps to remove it from your PHP installation.


    First, search for and delete the `extension="apc.so"` line from your php.ini file.
    Alternatively, you can just comment it out:


    ```

    ```;extension="apc.so"```

    ```


    At this point, you can restart Apache, and APC will no longer be active in PHP.
    If you wanted to completely obliter­ate the DSO from your machine, you can delete
    the `apc.so` file from your PHP extensions directory once Apache has been restarted.


    # # eAccelerator


    eAccelerator is another compiled-state PHP caching engine, similar to APC. eAccelerator
    is a fork of the popular TurckMMCache caching engine for PHP4, and is a free encoder
    and optimizer currently maintained by Frank Alcantara and a team of SourceForge
    programmers.'
  merge: -1
  img_proc: true
- pgno: 316
  md: "In addition to being a PHP optimizer and caching engine, you can use eAccelerator\
    \ to encode your PHP scripts, so you can redistribute the encoded version to clients\
    \ that have eAccelerator installed, without fear of source code snooping.\n\n\
    As with other PHP encoding solutions, *when files are encoded using eAccelerator,\
    \ they are nearly impossible to decrypt using standard tools. They can, however,\
    \ be reverse-engineered using debuggers and dissemblers on the PHP engine itself,\
    \ but usually such an effort is not warranted by the possible reward.*\n\n# Installing\
    \ eAccelerator\n\nLike APC, eAccelerator can be installed as a DSO, using the\
    \ following process. First, download a copy of the source code, available at `http://eaccelerator.net/`.\n\
    \n> Unfortunately, *at this time eAccelerator is not compatible with the CGI binary\
