- pgno: 278
  md: "Next, a background-shaded box is drawn over the image, to provide a darker\
    \ area to help show the white text you will write over the top, later in the method.\
    \ First, GD is informed to properly blend the transparency on the target image.\
    \ Then, using imagecolorallocatealpha(), a color resource is acquired — in this\
    \ case black (0,0,0), about 60% transparent (the range for the alpha channel is\
    \ 0–127). Finally, a filled rectangle is drawn, using the translucent black color,\
    \ over the bottom of the image using the height needed to cover the full font\
    \ height plus any padding that might be specified:\n\n```\n`/ Draw background\
    \ shading\nimagealphablending($gd_img, true);\n$rect_color = imagecolorallocatealpha($gd_img,\
    \ 0, 0, 0, 75);\nimagefilledrectangle($gd_img,\n                     0,\n    \
    \                 $img_y - $text_height - ($this->padding * 2),\n            \
    \         $img_x,\n                     $img_y,\n                     $rect_color);`\n\
    ```\n\nAfter the background rectangle is drawn over the image, it’s time to add\
    \ the caption text on top. Simply allocate a color for the text — in this case\
    \ white — and then use imagettftext() to draw the text over the image:\n\n```\n\
    `/ Draw caption text\n$text_color = imagecolorallocate($gd_img, 255, 255, 255);\n\
    imagettftext($gd_img,\n             $this->fontsize,\n             0,\n      \
    \       $this->padding,\n             $img_y - $text_underbaseline - $this->padding,\n\
    \             $text_color,\n             $this->fontfile,\n             $this->caption);`\n\
    ```\n\nThe imagettftext() function uses eight parameters: the image resource to\
    \ add text to, the size of the font, the angle of the text, the x location to\
    \ start drawing the text, the y location for the baseline/bottom of the text,\
    \ the color of the text, the .ttf font filename, and the actual text to render,\
    \ in that order.\n\nThe last bit of the captioning simply draws a faint border\
    \ at the top of the caption box, using a translucent light gray, and the imageline()\
    \ GD function:\n\n```\n`/ Draw shading border if requested\nif ($this->drawline)\n\
    {\n    $line_color = imagecolorallocatealpha($gd_img,\n                      \
    \                    200,\n                                          200,\n  \
    \                                        200,\n                              \
    \            75);\n\n    imageline($gd_img,\n              0,\n              $img_y\
    \ - $text_height - ($this->padding * 2) - 1,\n              $img_x,\n        \
    \      $img_y - $text_height - ($this->padding * 2) - 1,\n              $line_color);\n\
    }`\n```"
  merge: -1
  img_proc: true
