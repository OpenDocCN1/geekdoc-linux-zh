- pgno: 188
  md: '# # Mac OS X


    To set up WebDAV under Mac OS X, do the following:


    +   1. From the Finder menu, choose Go➔ Connect to Server, or simply type Command-K
    in a Finder window. This will bring up the Connect to Server window as shown in
    Figure 6.6. Enter the URL for your WebDAV share in the Server Address field, and
    then click Connect.


