- pgno: 244
  md: "# **Code Efficiency**\n\nloops to contain additional variables carrying information\
    \ about whether loops should be terminated or not from within nested loops, or\
    \ using goto to jump to a label following the outer loop (except in Java, which\
    \ doesn't have a goto construct). You can write this:\n\n```\n```perl\n$position\
    \ = null;\nfor($i=0; $i<100; $i++)\n{\n    for($j=0; $j<100; $j++)\n    {\n  \
    \      if($array[$i][$j]==$what_we_wanted)\n        {\n            $position =\
    \ array($i,$j);\n            break 2;\n        }\n    }\n}\nif(null===$position)\
    \ // $what_we_wanted was not found.\n```\n```\n\ninstead of this:\n\n```\n```perl\n\
    $position = null;\n$found_what_we_wanted = false;\nfor($i=0; $i<100; $i++)\n{\n\
    \    for($j=0; $j<100; $j++)\n    {\n        if($array[$i][$j]==$what_we_wanted)\n\
    \        {\n            $position = array($i,$j);\n            $found_what_we_wanted\
    \ = true;\n            break;\n        }\n    }\n    if($found_what_we_wanted)\n\
    \        break;\n}\nif(null===$position) // $what_we_wanted was not found.\n```\n\
    ```\n\nAs a final observation on **continue** and **break**, it is a common practice\
    \ to write those statements on the same line as the test that governs whether\
    \ they are executed, especially if those tests are short and simple. Hence, you\
    \ may want to consider adopting or allowing the practice of writing like this:\n\
    \n```\n```perl\nif($a==$1 && $b!=$i) continue;\nif($c==$1 && $d==$i) continue;\n\
    ```\n```\n\n> *An aside on using the equality operator `==` is the fact that a\
    \ common typo is to use `=` when `==` was intended. You can protect yourself from\
    \ the bugs that can result from using assignment instead of comparison in certain\
    \ cases. When comparing a variable to the result of a function or to a literal\
    \ value, if you write the variable on the right-hand side of the equality operator,\
    \ accidentally writing `=` instead of `==` for the operator itself will result\
    \ in a parse error: `\"null===$position\"` is invalid syntax. These are a lot\
    \ easier to debug than the sometimes subtle errors resulting from an assignment\
    \ that should not have been assigned and a comparison that didn't properly compare.*"
