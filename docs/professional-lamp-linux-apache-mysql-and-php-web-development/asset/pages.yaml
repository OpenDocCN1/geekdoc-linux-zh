- pgno: 87
  md: '# Chapter 3


    that behaves like a file—you may be able to read bytes from it, write bytes to
    it, go to a particular byte position within it, ask how many bytes there are,
    and so on. Note the use of “may be”—just as some files are read-only and some
    are write-only, streams too might be read-only or write-only, while some generate
    their data on the fly so that there is no clearly defined analog of “file offset”
    or “file size” or even “end of file.” The idea is that users of a stream need
    have no idea how the data they work with is stored or handled; they just read
    and write. The most significant limitation, compared with, say, Java, is that
    PHP streams are all *byte* streams. To stream something else—objects in particular—you
    need serialization to convert it into something that will go through a stream.
    This is PHP’s loose typing having an effect once again: since every stream is
    a byte stream, any stream can be used anywhere (whether it makes sense or not).


    # Creating and Using Streams


    Building a stream wrapper is simply a matter of adding certain methods to the
    stream object, and using `stream_wrapper_register()` to identify it as a wrapper.


    `stream_wrapper_register()` is called with two arguments. The first is the *protocol*,
    which is simply a name that indicates the wrapper to be used when a stream is
    to be opened—what is known in URLs as the *scheme*. It’s the bit in the URL before
    the `//`, that is, the `http` of HTTP URLs, the `ftp` of FTP URLs, and the `file`
    of file URLs. For example, if you implement a stream and register it with a protocol
    of `foo*nl,` you will then be able to go `fopen("foo*nl:///." , "r*")` to enable
    reading from a foonly stream. The default protocol used by `fopen()` and the other
    filesystem functions is `file`, which is why you hardly ever see `file://path/ext`,
    because `path/file.ext` has the same effect.


    The second argument is a string containing the name of the class that implements
    your wrapper.


    Naturally, the full list of wrapper methods are given in the manual. The principal
    ones are as follows:


    +   * `stream_open():` This function contains startup code for a new stream—initializing
    variables, opening streams of its own, and so forth. You call this function with
    four arguments. The first two are the same path and mode values as the corresponding
    `fopen()` call. For third-party extensions, the appropriate options will be worked
    out and provided.) The third argument could contain up to two flags: `STREAM_USE_PATH`
    indicates that you should search PHP’s include path if necessary to find the specified
    file, and `STREAM_REPORT_ERRORS` indicates whether it is the stream’s responsibility
    to trigger any errors if the stream cannot be opened or something else goes wrong,
    or whether such things are going to be handled higher up (in which case your stream
    should not report any errors). `STREAM_USE_PATH` is only relevant if you actually
    are looking for something in the local filesystem, whether it is the file requested,
    or an auxiliary *file* that your stream uses. If your stream is read-only, it
    should return `FALSE` (and possibly trigger a warning) if the requested mode is
    for writing (`w`, `r*w`, `a`, `a*w`), and similarly for write-only streams.


    > *The PHP manual mentions “fopen_with_path( )”, but as of 5.0.3 this function
    doesn’t exist. The include_path configuration setting is of course available via
    ini_get( ).*


    +   * `stream_read():` If the stream cannot be read, this should return `FALSE`.
    Otherwise it should return at most the number of bytes requested. As the wrapper’s
    author, it is your responsibility to ensure that any relevant state, including
    any file pointers, is maintained between successive calls to this method. You
    are allowed to return fewer bytes than requested (although an empty string may
    be interpreted as indicating the end of the stream).'
