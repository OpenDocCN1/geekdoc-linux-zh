  md: "# Apache Tricks\n\n```\n```\n{ \n  $item = $_GET['item']; \n} \necho \"Category:\
    \ \" . $category . \"<br />\\n\" . \n\"Item: \" . $item . \"<br />\\n\";\n?>\n\
    ```\n```\n\nSave this file as catalog.php in the root folder of your website.\n\
    \nNormally, if you wanted to pull up this file and have it recognize a given category\
    \ or item value, you'd have to supply values in the query string, like this:\n\
    \n```\nhttp://www.domain.com/catalog.php?cat=categoryvalue&item=itemvalue\n```\n\
    \nUnfortunately, some search engines will not catalog dynamic pages with URLs\
    \ like the one above. In addition, the extra syntax to specify each variable can\
    \ be a burden to anyone entering the URL by hand. To remedy this situation, you\
    \ can use mod_rewrite. Add the following directives in a .htaccess file in the\
    \ same directory as your category.php file (or in the server's httpd.conf file\
    \ if needed):\n\n```\n```\nRewriteEngine On \n# Rewrite /category/item/ to catalog.php\
    \ \nRewriteRule ^\\\\(w+)/\\\\(w+)/?$ catalog.php?cat=$1&item=$2\n```\n```\n\n\
    > In order to use mod_rewrite directives in per-directory configuration files\
    \ (.htaccess), the directive Options FollowSymLinks or Option SymLinksIfOwnerMatch\
    \ must be enabled for the directories in httpd.conf.\n\nNow, because of the magic\
    \ of mod_rewrite, you can access category and item records using directories in\
    \ the URL, instead of query strings:\n\n```\nhttp://www.domain.com/categoryvalue/itemvalue/\n\
    ```\n\nNote that the corresponding directories referenced in the preceding URL\
    \ don't actually exist—mod_rewrite intercepts the request and translates it into\
    \ the query string-appended PHP request, which is then parsed through the PHP\
    \ engine. Another thing to keep in mind: if the preceding directory actually does\
    \ exist and the RewriteRule shown here is active, Apache will still completely\
    \ ignore the real path and proceed as planned with its URL rewriting.\n\nTaking\
    \ a look at the lines from your mod_rewrite configuration, you start with a simple\
    \ declaration:\n\n```\nRewriteEngine On\n```\n\nIn order to use mod_rewrite, you\
    \ have to inform Apache that you want to enable the module in the given configuration\
    \ zone—a .htaccess file, or a <Directory> section in httpd.conf for example. RewriteEngine\
    \ takes either On or Off as its value.\n\nThe next key line is simply a regular\
    \ expression used to match an incoming URL, and the new URL to use in its place:\n\
    \n```\n```\n# Rewrite /category/item/ to catalog.php \nRewriteRule ^\\\\(w+)/\\\
    \\(w+)/?$ catalog.php?cat=$1&item=$2\n```\n```"
