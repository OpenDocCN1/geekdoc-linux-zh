  md: "# # Chapter 3\n\nby to the rest of the program, which is what is actually returned\
    \ by `create_function()` as a string fresh and ready for use as a callback. The\
    \ first string returned from `create_function()` is \" `lambda_1` \"; the second\
    \ is \" `lambda_2` \", and so on. Okay, so what happens if you define a function\
    \ named `lambda_1` and then use `create_function()`? Does one overwrite the other,\
    \ is there an error, or does the anonymous function get called `lambda_2` instead?\
    \ If these options appeared in a multiple-choice test, you could dismiss the first\
    \ as being in violation of PHP’s own rules regarding function immutability, leaving\
    \ you with choices B or C. The correct answer, however, is D, none of the above.\n\
    \n```\n```php\n<?php\nfunction lambda_1($a)\n{\n    return $a;\n}\n$anonymous_function\
    \ = create_function('$a', 'return strrev($a);');\necho \"The anonymous function\
    \ has been named $anonymous_function.\\n\";\n$_use_this = 'lambda_1';\necho $_use_this('generic\
    \ string'), \"\\n\";\n$_use_this = $anonymous_function;\necho $_use_this('generic\
    \ string'), \"\\n\";\n?>\n```\n```\n\nRunning this gives you the following:\n\n\
    ```\n```\nThe anonymous function has been named  lambda_1.\ngeneric string\ngnirtsirec\n\
    ```\n```\n\nSo how did PHP know which one to use if they have the same name? The\
    \ simple fact is they don’t. If you peer closely at the typography of the code\
    \ sample’s output and previous paragraph, the name of the anonymous function appears\
    \ to start with a space. In fact it’s not a space but a null character `0x00`.\
    \ That is sneaky: it’s impossible to declare a function with a name of this form\
    \ or to call a function with such a name, since in both cases the NUL in the source\
    \ code is ignored by PHP’s lexer as being whitespace. However, knowing this does\
    \ make it possible to construct the names of anonymous functions as string literals\
    \ by hand (using code like `chr(0) . 'lambda_n'`), or an editor that will let\
    \ you insert NULs directly). This may be of little benefit, however, since once\
    \ you’ve discarded the original strings or you’ve lost track of which variable\
    \ contains the name of which anonymous function it’s up to you to work out whether\
    \ you want the third or fifth or 750th such function. If you were creating a distinct\
    \ anonymous function for every element in an array, you could easily end up with\
    \ hundreds of the things, even if they are functionally identical. (PHP makes\
    \ no attempt to compare one anonymous function with another to see if they contain\
    \ identical code, any more than it attempts to do so with ordinary functions;\
    \ and besides, if you’re creating functions in a loop, there are most likely parts\
    \ that vary from iteration to iteration – otherwise, why do it in a loop?) If\
    \ you can keep track of such things – for example, say you know somehow that your\
    \ 750 functions will all be numbered from 10 to 759 – then you don’t need to keep\
    \ an array of 750 strings to store all the names, it can be recreated by writing\
    \ the following code:\n\n```\n```php\nfunction recreate_function($lambda)\n{\n\
    \    return chr(0) . 'lambda_' . $lambda;\n}\n$lambda_functions = array_map('recreate_function',\
    \ range(10,759));\n```\n```"
