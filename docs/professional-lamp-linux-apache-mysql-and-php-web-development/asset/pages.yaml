  md: "# ## Chapter 2\n\n# ### __call\n\nThe magic method `__call` allows you to provide\
    \ actions or return values when undefined methods are called on an object. The\
    \ `__call` magic method can be used to simulate method overloading, or even to\
    \ provide smooth error handling when an undefined method is called on an object.\
    \ `__call` takes two arguments: the name of the method and an array of the arguments\
    \ passed to the undefined method. For example:\n\n```\n```php\n<?php\n\nclass\
    \ Circle\n{\n    public function __call($m, $a)\n    {\n        echo \"The method\
    \ \" . $m . \" was called.\\n\".\n             \"The arguments were as follows:\\\
    n\";\n        print_r($a);\n    }\n}\n\n$c = new Circle();\n$c->undefinedmethod(1,\
    \ 'a', 2, 'b');\n?>\n```\n```\n\nWhen you run this code, you would see something\
    \ similar to the following:\n\n```\n```\nThe method undefinedmethod was called.\n\
    The arguments were as follows:\nArray\n(\n    [0] => 1\n    [1] => a\n    [2]\
    \ => 2\n    [3] => b\n)\n```\n```\n\nHere you’ve defined a `__call` function to\
    \ handle the call to the `undefinedmethod` method. As expected, it took the comma-delimited\
    \ list of arguments and turned them into an array, which were captured in the\
    \ `$a` parameter.\n\n# ### __get and __set\n\nThe magic methods `__get` and `__set`\
    \ allow you to specify custom functions to store and retrieve data in properties\
    \ that aren’t already defined in the class.\n\n`__get` takes one argument, the\
    \ name of the property, while `__set` requires two: the name of the property and\
    \ the new value."
