- pgno: 377
  md: '# Appendix B


    ![](img/fd2e7361878181c2b12e30301ff3e182_377_0.png)


    # Umbrello


    Umbrello is another UML diagramming application, much like ArgoUML. Umbrello is
    now part of the KDE developer tools package, and supports many of the major UML
    diagram types, including Class diagrams, Use Case diagrams, State diagrams, and
    Sequence diagrams. As of version 1.4, Umbrello can generate PHP5 class skeletons,
    as well as code for several other programming languages, as shown in Figure B.4.'
  merge: -1
  img_proc: true
- pgno: 378
  md: '# Alternative Tools


    ![](img/fd2e7361878181c2b12e30301ff3e182_378_0.png)


    # Figure B.4


    Umbrello can be found as a part of the KDE desktop environment (3.2 or later,
    Linux, or you can download it (for KDE/Linux) directly from the Umbrello site
    at http://uml.sourceforge.net/ .'
  merge: -1
