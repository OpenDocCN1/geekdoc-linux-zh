  md: "# PHP Configuration\n\nOnce you’ve retrieved all the current runtime settings,\
    \ you’ll need to collect a list of all the `<setting />` tag values from the XML\
    \ configuration file. To do that, you use SimpleXML’s `xpath()` function again:\n\
    \n```\n```\n// Cycle through setting elements\n$settings = $this->xml->xpath('/environment/setting');\n\
    ```\n```\n\nAfter you get an array of all the `setting` elements, you need to\
    \ cycle through them, and check the run-time configuration to see if they match.\
    \ Before you directly compare the two, you need to convert each value in the XML\
    \ configuration file to match expected results from `ini_get_all()`. Normally\
    \ when setting values in `php.ini`, you can use several different values to mean\
    \ “true” or “false.” For true, you can use `on`, `true`, `yes`, or `1`; false\
    \ is represented by `off`, `false`, `no`, or `0`. As mentioned earlier, when returning\
    \ settings using `ini_get()` or `ini_get_all()`, values representing on or true\
    \ are returned as `1`, but values of off or false will be returned as an empty\
    \ string, “” (a double quote). To make sure the XML configuration values match,\
    \ regardless of which `php.ini` indication is used, you can use a simple `switch`:\n\
    \n```\n```\nforeach ($settings as $setting)\n{\n    $value = $setting['value'];\n\
    \    // Convert boolean values to ini_get() values\n    switch (strtolower($value))\n\
    \    {\n        case 'off':\n        case '0':\n        case 'false':\n      \
    \  case 'no':\n            $value = '';\n            break;\n        case 'on':\n\
    \        case 'true':\n        case 'yes':\n        case '1':\n            $value\
    \ = '1';\n            break;\n    }\n}\n```\n```\n\nNext, you retrieve the name\
    \ of the configuration variable. Because accessing the attribute like an array\
    \ returns a `simplexml_element` object, you need to cast it explicitly as a *string*\
    \ to compare it against the *string* value later on:\n\n```\n```\n// Flatten name\n\
    $name = (string) $setting['name'];\n```\n```\n\nNow that you have both the name\
    \ and value of the setting called for in the XML configuration file, you can compare\
    \ it against the runtime setting. First, you check to see if the configuration\
    \ setting even exists in the runtime configuration array, and then you compare\
    \ it against the value in the XML file. Taking it one step further, if the setting\
    \ is present but doesn’t match, attempt to change the current run-time configuration\
    \ variable using `ini_set()`. If the setting doesn’t match *and* you cannot change\
    \ the setting at runtime, an error message will be generated and the function\
    \ will return `false`:\n\n```\n```\n// Check config value, set if needed\nif (!array_key_exists($name,\
    \ $cfg) or\n    ($value !=\n        $cfg[$name]['local_value']) and\n```\n```"
