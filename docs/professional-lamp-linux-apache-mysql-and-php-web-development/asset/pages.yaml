    \nThe resize method of WebImage can be called using either one or two arguments.\
    \ If one argument is used, it is treated as a numeric ratio used to resize the\
    \ image. If two arguments are passed, they are used as values for a maximum width\
    \ and maximum height the resized image is not to exceed.\n\nAfter those values\
    \ are set in the object accordingly, the process() method is called, and the image\
    \ is resized and returned. To further understand how exactly the resizing is happening,\
    \ take a closer look at the ImageResize class.\n\nIn the meat of ImageResize,\
    \ the process() method, you start out simply enough—width and height for the existing\
    \ image are determined using imagesx() and imagesy() correspondingly, and the\
    \ new width and height are initialized to 0:\n\n```\n// Resize the image\npublic\
    \ function process($gd_img)\n{\n    // Set initial dimensions\n    $old_width\
    \ = imagesx($gd_img);\n    $old_height = imagesy($gd_img);\n    $new_width = 0;\n\
    \    $new_height = 0;\n```\n\nNext, the final dimensions of the resized image\
    \ are determined. The values for max_width and max_height are first checked, and\
    \ if both are present, the image dimensions are calculated to be equal to or smaller\
    \ than both maximums. If both maximums are not provided, the resize ratio value\
    \ is checked, and if present, the new image dimensions will be based on the set\
    \ ratio of the original dimensions:\n\n```\n// New dimensions to fall within maximums\
    \ provided\nif ($this->max_width and $this->max_height)\n{\n    if ($this->max_width/$old_width\
    \ <= $this->max_height/$old_height)\n    {\n        $new_width = ceil(($this->max_width/$old_width)\
    \ * $old_width);\n        $new_height = ceil(($this->max_width/$old_width) * $old_height);\n\
    \    }\n    else\n    {\n        $new_width = ceil(($this->max_height/$old_height)\
    \ * $old_width);\n        $new_height = ceil(($this->max_height/$old_height) *\
    \ $old_height);\n    }\n}\n// New dimensions based on a ratio\n```"
