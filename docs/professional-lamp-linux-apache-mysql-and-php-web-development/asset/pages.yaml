    subsequent desired match, the latter will be missed. preg_replace_callback() isn’t
    aware of whether later tests “succeed” or not).


    Matching email addresses for wrapping in `mailto:` links, for example, can result
    in some frightening regular expressions if you want to be thorough. It is far
    easier to approach it in stages. You could start by simply trying to locate the
    @ character with non-white-space on either side, as follows:


    ```

    preg_replace_callback(''/([^\s@]/@([^\s@]/)'', $text, ''wrap_emails'');

    ```


    And leave the hard work of verifying that the matched string really is an email
    to the callback:


    ```

    function wrap_emails($possible_match) { $possible_email = $possible_match[0];
    // The callback will be passed an array if (is_rfc822_compliant($possible_email))
    // A hypothetical function that // does all the boring stuff return ''<a href="mailto:''.
    $possible_email. ''">'' . $possible_email. ''</a>''; else return $possible_email;
    // Not an email, return the substring unchanged. }

    ```


    A second example of its using preg_replace_callback() is with templating systems.
    With preg_replace_callback() merely identifying slots in the template, the callback
    function it passes the matches to would then examine the slots in finer detail—a
    task made easier by the fact that they have already been isolated from the rest
    of the template by a function that is also keeping track of where in the template
    they came from. Here’s an example:


    ```

    function include_templates($template_name) { if (is_string($template_file)) $template_file
    = $template_name; else $template_file = $template_name(1) . ''.tpl''; $template
    = file_get_contents($template_file); return preg_replace_callback(''/\((include:
    \S*(\^\S\))*/)'', ''include_templates'', $template); }

    ```


    This recursive function assumes that your template files all have the extension
    `.tpl`, and that the syntax you use in your templates for including foo.tpl is
    (include: foo). Needless to say, if foo.tpl itself contains includes, you want
    those included as well.


    If the function is passed a string, then the string is interpreted as the name
    of a template file. If it’s passed an array (for reasons that will become apparent
    shortly), then the desired filename is the second element of the array, with `.tpl`
    appended. The contents of the named file are then read into $template. (There
    is virtually no error checking going on here.)


    The call to preg_replace_callback() searches through $template for strings matching
    the (include: foo) syntax. Arrays containing the matching strings (where the 0th
    element contains the entire matching string and the 1st element contains the first
    parenthesized substring), are then passed one by one to include_templates(), which
    extracts the name of the template file from the array, and'
