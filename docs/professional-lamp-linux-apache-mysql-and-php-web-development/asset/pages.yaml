- pgno: 248
  md: "# # Code Efficiency\n\n```\n```\ndeclare_statement:\n    ':' inner_statement_list\
    \ T_ENDDECLARE ';'\nswitch_case_list:\n    ':' case_list T_ENDSWITCH ';'\n   \
    \ ';' ';' case_list T_ENDSWITCH ';'\n```\n```\n\nAlso remove the whole of the\
    \ new_else_list and new_else_single productions. Because while_statement, for_statement,\
    \ foreach_statement, and declare_statement now all reduce to a single rule statement,\
    \ without any associated code, the productions themselves are now redundant. You\
    \ could replace occurrences of while_statement with statement (it appears once,\
    \ in the productions for unticked_statement) without ill effect, remove the production\
    \ for while_statement, and gain a slightly smaller and simpler parsing engine\
    \ in the process.\n\nThis will of course break any code written by anyone who\
    \ uses the now-banned constructs.\n\n# ## Caching\n\nHaving a page that is updated\
    \ on a daily basis, yet is hit several thousand times during each day, means that\
    \ the same computations are being carried out, producing the same results, several\
    \ thousand times a day. Carrying them out once and holding on to the results for\
    \ all subsequent requests offers the potential for enormous savings.\n\nBecause\
    \ your PHP application is insulated from the processor by several layers of intermediate\
    \ software, with instructions filtering down through them to the hardware, and\
    \ results filtering back up, there are several points where you could potentially\
    \ short-circuit the process. Between any two such layers there is an interface\
    \ where you can imagine an assistant who remembers previous requests for information\
    \ from people and the information provided as a result, and so can supply that\
    \ information immediately if and when the same requests come in again.\n\nAt the\
    \ PHP level, there are two principal interfaces where caching can be effective.\
    \ You can either generate static versions of pages and serve those instead of\
    \ regenerating them every time, or you can have the source code of your PHP application\
    \ stored in a pre-parsed format ready for execution by the Zend engine without\
    \ need of the additional step of compiling the source code, or you can do both.\n\
    \n# ## Source Pre-Parsing\n\nWhen a PHP program is run, the source code is loaded,\
    \ parsed, and compiled into bytecode (machine code for an imaginary processor\
    \ that is simulated by the Zend engine), and then that bytecode is executed. There\
    \ are several products available that can take that compiled bytecode and save\
    \ it; a selection of the better ones is given in the following table (in alphabetical\
    \ order).\n\n| afterBÜRNER*Cache | http://bwcache.bware.it/cache.htm | Alternative\
    \ PHP Cache | http://pecl.php.net/package/APC | PHP Accelerator | http://www.php-accelerator.co.uk/\
    \ | Turck MMCache | http://turck-mmcache.sourceforge.net/ | Zend Optimizer | http://zend.com/store/products/zend-optimizer.php\
    \ |"
  merge: -1
