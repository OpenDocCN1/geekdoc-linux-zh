    Finally, the logo image is merged onto the main image, and the resulting image
    resource returned:


    ```

    // Copy the logo onto the main image

    imagecopy($gd_img,

    $logo->gdresource,

    $logo_x,

    $logo_y,

    0,

    0,

    imagesx($logo->gdresource),

    imagey($logo->gdresource));

    }


    return $gd_img;

    }

    ```


    Note that imagecopy() was used instead of imagecopymerge(). The imagecopymerge()
    function seems like it would be better suited to this task, and even provides
    the ability to merge the logo and set its transparency — good for certain watermarking
    effects. Unfortunately, imagecopymerge() has a nasty habit of destroying most
    transparency information in the source logo image itself, so if you want to make
    a faint translucent watermark for an image, it''s probably best to add the transparency
    to the logo image itself, and using imagecopy(), instead of using an opaque image
    and imagecopymerge().


