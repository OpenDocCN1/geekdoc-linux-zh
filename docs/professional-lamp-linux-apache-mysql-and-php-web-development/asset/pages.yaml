    # ## Zend Optimizer


    Not to be outdone by the handful of free PHP caching solutions available, Zend
    — the creators of the Zend Engine that powers PHP — have released their own code
    optimizer, and it’s free. The Zend Optimizer acts in a similar manner as APC and
    eAccelerator: it caches the compiled state of PHP scripts, enabling faster execution
    on subsequent requests.


    In addition to accelerating the performance of PHP scripts, Zend Optimizer also
    allows you to run scripts encoded by Zend Encoder or Zend SafeGuard Suite on the
    server.


    # ### Installing Zend Optimizer


    Installing the Zend Optimizer is a bit easier than the majority of competing caching
    solutions, as it comes with a handy configuration and setup wizard.'
