- pgno: 224
  md: '# 9


    # Code Efficiency


    The faster you can serve pages, the busier your site can be without users experiencing
    delays. This chapter covers methods for improving the performance of your sites,
    and also for identifying which methods are likely to be most effective.


    “More pages in less time” is the rationale, but just as there are car enthusiasts
    who spend every free moment elbow-deep in their car’s innards trying to shave
    another tenth of a second off the quarter mile, there are site developers who
    want to shave another millisecond off displaying the login page. You can take
    things too far!


    You don’t want to waste your time on improvements that no one will notice, so
    the first section of this chapter will present a couple of cameos that illustrate
    just how little difference even large improvements can sometimes make, how much
    difference small improvements can make, and how valuable it is to understand your
    entire system before messing with it.


    Your program runs on PHP, which runs on your web server and communicates with
    your DBMS, which both run on your operating system, which runs on the physical
    hardware. Subsequent sections look at all of these for opportunities for improvement
    and techniques for deciding what needs improving.


    Finally, there *will* be a few tiny miscellaneous coding tweaks that might shave
    a millisecond off the login page, which are presented here because if you know
    and use them from the beginning, you won’t later be tempted to spend time better
    spent elsewhere going back and introducing them to existing code.


    # Why Bother?


    The first question to ask yourself is “Do I *need* to do anything?” If you haven’t
    started coding yet then the answer is obviously “Yes” — take the time to plan
    what your program is supposed to do, and try to develop a feel for where its performance
    might drag. But if you have a site that’s up and'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'running that you''re tempted to fiddle with to make it go faster, ask yourself
    if doing so really would be worth the hassle. Is it running too slow for your
    taste? Which part? Will your fiddling make it go faster? By how much? And are
    you sure you won''t break something in the process? By considering some of these
    questions you can avoid wasting a lot of time and effort on something that produces
    no benefit, and if you''re lucky, discover a trivial change that nets you an enormous
    performance boost.


    # A Lot for a Little


    In one company I worked for there was a computer used for generating reports.
    The software was Windows NT4 and Microsoft Access 97 (this was in 2004), the installed
    memory was 32MB, and printing a report was an exercise in patience. You could
    go and get a cup of coffee while it repainted the screen. There was talk of upgrading
    to a new computer because it was "so slow."


    The “simple” answer — the one that could be reached without analysis — would have
    been to replace the existing machine with a new computer, with the latest versions
    of Windows and Access, followed by setting up the network user accounts and spending
    a day fighting the fires that seem to inevitably accompany such an upgrade. But
    an analysis was made, consisting of hitting Ctrl-Alt-Delete and bringing up NT’s
    Task Manager and its process listing to see how much time was being spent on each
    process while the computer was being used to generate a report. (If you’re not
    familiar with this process in Windows, picture a trimmed-down top(1) using a GUI
    table widget.)


    The most prominent feature of the listing was the entry “System Idle Process.”
    This never got below 85%. In twenty minutes of operation, the processor was *actually
    doing something* for only three of them; the rest of the time it was waiting for
    memory to be swapped between RAM and the disk. The computer *could* run more than
    six times faster than it was, *if only* it wasn''t being held back by the meager
    32MB of RAM that it had. 256MB would be more than sufficient to remove the bottleneck;
    the report would be generated in less time than it takes to walk to the printer;
    the chips would be a lot cheaper than a new machine and new software licenses;
    and instead of losing a day to installation, downtime would be on the order of
    five minutes.


    # A Little for a Lot


    A common idiom in C is to write `a<<3` instead of `a*8` to multiply a variable
    by eight. It works, of course, because in binary multiplying by 8 (or 2³) is equivalent
    to shifting all the bits of a 3=lg(8) places to the left. Can this be applied
    to PHP? The short answer is yes. But, just as in C, the saving is a matter of
    nanoseconds. For example, on my 2.6 GHz P4, the difference was 50ns for PHP5.0.3,
    and 3.5ns for 4.3.11, with the only significant variation between versions being
    in the speed of bit shifting. Your results may vary. Incidentally, `8*5` is faster
    than `5<<3`.


    While *eking* out such a saving makes *sense* in an environment where you’re carrying
    out millions of such multiplications on a regular basis (often enough that modern
    C compilers can recognize `a*8` and convert it to `a<<3` themselves *anyway*),
    this is not typical of web-based applications. What’s more, in PHP the two “equivalent”
    operations have *different* behaviors in extreme cases: bit shifting always produces
    an integer result (which may be 0 or even negative: `1073741824<<1==-2147483648`
    and `-2147483648<<1==0`), while multiplication will return a double if such is
    necessary to contain the result (`1073741824*2==2147483648` and `2147483648*2==4294967296`).
    Plus, you have to remember that while *multiplication* has a higher precedence
    than addition, bit shifting is *lower*: it’s `5+$a+$b*8`, but `5+($a<<3)`. *'
  merge: -1
