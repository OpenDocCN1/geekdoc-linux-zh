- pgno: 226
  md: "# Code Efficiency\n\nIs it all worth it? How long would it have taken you to\
    \ write the operation as a multiplication, and how long as a bit shift? How long\
    \ to verify that what you wrote is correct? How long to fix any bugs that resulted\
    \ from things like the different behavior in extreme cases, or forgetting the\
    \ difference in precedence? What about time spent altering the code (say, to multiply\
    \ by 9 instead of 8) in the future? (You can’t just search for instances of 8;\
    \ you have to search for instances of 3 as well, and why aren’t you using named\
    \ constants?) How many times will that operation have to be executed to save you\
    \ the same amount of time you spent making sure that you were using the faster\
    \ option — a nanosecond here, a nanosecond there? And how long would it be before\
    \ the operation has been executed that many times?\n\nThe point is that your time\
    \ is more valuable than the computer’s. The online time that is more valuable\
    \ than yours is that of the visitors to your site. So don’t waste your time trying\
    \ to trim a few nanoseconds off the page’s processing time: site visitors won’t\
    \ notice the difference even under exceptionally heavy use.\n\n# Comparing the\
    \ Speed of Strings — A Benchmarking Example\n\nPHP has several ways of combining\
    \ literal strings and variables, and three methods of quoting strings. The three\
    \ methods of quoting are to use single quotes, double quotes, and heredoc syntax.\
    \ Inserting variables into strings can be achieved by using the concatenation\
    \ operator, variable interpolation in double- and heredoc-quoted strings, and\
    \ C-style string formatting functions. Every now and then, a curious programmer\
    \ asks which method is “better.” “Better” can be defined in more than one way:\
    \ Is it faster? Does it make the source code more readable? Is it simpler and\
    \ less prone to bugs? As far as readability and simplicity go, the debate is fairly\
    \ evenly split: if one were clearly superior to the others, then natural selection\
    \ would see experienced developers on large-scale applications using the superior\
    \ method to the exclusion of all others. The fact that no such selection appears\
    \ to have taken place over the years suggests that the differences are not significant\
    \ enough to appear in an industry-wide Best Practices document or coding standard.\n\
    \nWhether single-quoted strings are faster than double-quoted ones is much more\
    \ quantifiable. If you’re forced to give a yes or no answer, then the safest would\
    \ be to say “yes,” but in reality things are more complicated than that.\n\nLike\
    \ any question about the real world, it cannot be answered without first obtaining\
    \ some facts. As an initial experiment you could write the following:\n\n```\n\
    ```php\n<?php\n$variable = 'string';\n\n$start = microtime(true);\nfor($i=0; $i<1000000;\
    \ ++$i)\n{\n    $string = \"this string has a $variable embedded into it\";\n\
    }\n$laptimie = microtime(true);\nfor($i=0; $i<1000000; ++$i)\n{\n    $string =\
    \ \"this string has a \"$variable.\" inserted into it\";\n}\n$finish = microtime(true);\n\
    ```"
