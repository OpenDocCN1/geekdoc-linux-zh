    This chapter shifts away from talking about PHP for a bit to discuss some features
    of Apache that you may not be aware of. You already know that Apache is the most
    popular and powerful web server available, and that PHP is designed to work with
    Apache, but you may not know that you can expand Apache itself to make your site
    run more effectively. True to its open-source nature, there are a number of excellent
    modules available for Apache that expand its functionality and provide useful
    features for you as a site administrator.


    This chapter discusses three of those modules. **Mod_rewrite** enables you to
    provide URL substitutions to accommodate site changes, but if you use it properly,
    you can use it to secure your site and make it friendlier to search engines. **Mod_speling**
    helps correct inadvertent spelling mistakes made by visitors to your site. **Mod_deflate**
    will enable you to compress your content as you send it to users, saving you money
    on bandwidth. **Mod_auth_mysql** lets you beef up your site security by harnessing
    the power of a user database with Apache’s authentication. **Mod_ssl** allows
    you to encrypt the data flowing to and from your web server. Finally, **mod_dav**
    allows you to use your Apache web server as a distributed file repository.


    # URL Rewriting


    If you gathered all the web developers and server administrators in the world,
    and had them make a list of the most important modules that can be used with Apache,
    it’s a good bet that **mod_rewrite** will be on that list—and with good reason.


    **Mod_rewrite**, for the unfamiliar, is an Apache module that provides URL rewriting
    functionality. While that may sound simple, in reality **mod_rewrite** is the
    Swiss Army knife of Apache modules. What can you do with **mod_rewrite**? Outside
    of the obvious simple URL-rewriting, **mod_rewrite** gives you the ability to
    keep query-string input safe, keep your site search-engine-friendly, make your
    URLs user-friendly, retain “old” URLs after a restructuring, and stop hot linking.
    You will find that **mod_rewrite** can quickly become more than just a simple
    URL-changing robot.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# # Chapter 6


    # ## Enabling mod_rewrite


    The first thing you''ll need to do, before you bother getting your hands dirty
    setting up mod_rewrite, is to check and see if it''s already installed. At the
    command line, type:


    ```

    ```

    /path/to/httpd -l

    ```

    ```


    *Use your own path to Apache''s httpd, obviously.*


    If you see mod_rewrite.c listed, it has already been compiled into Apache. If
    not, check to see if it exists as a dynamic module for Apache:


    ```

    ```

    ls /path/to/apache/modules/

    ```

    ```


    If mod_rewrite.so exists in the file listing, then Apache can load it as a module
    with a little tweak to the httpd.conf file, shown later in this section. If it''s
    not compiled into Apache or available as a shared object, you can use whatever
    package management system your OS uses to install it, or if you''re the more hands-on
    type, you can recompile Apache yourself to include mod_rewrite.


    When enabling functionality in Apache, you typically have two choices: build statically
    into the Apache binary itself, or compile the module as a loadable shared object.
    When building the modules statically into Apache, they are available with no extra
    configuration directives, but the module will always be active and consuming memory
    whenever Apache is running, even if you don''t need it. Building the module as
    a loadable shared object allows you to keep your Apache binary stripped of any
    ''*optional*'' items you may or may not need, but they must be manually configured
    in httpd.conf. Either method is perfectly acceptable, but if you''re unsure of
    which to choose, the shared module route is a popular choice because of its flexibility.


    To build mod_rewrite statically into Apache when building from source, make sure
    your configure file includes --enable-rewrite, like so:


    ```

    ```

    ./configure \

    --enable-rewrite \

    # ...and any other configure settings you use

    ```

    ```


    If you chose the dynamic module route, just add =shared to the end of the line
    that enables mod_rewrite:


    ```

    ```

    ./configure \

    --enable-rewrite=shared \

    # ...and any other configure settings you use

    ```

    ```


    Then, it''s a simple matter of making and installing the server to your system.
    If you built mod_rewrite into Apache statically, you can make sure your reconfiguration
    worked, by re-running httpd -l. If mod_rewrite.c shows up, it has been successfully
    added to the Apache binary.


    If, instead, you went with the dynamic module, check first to see if it actually
    exists in the Apache modules directory, as a file called mod_rewrite.so.


    ```

    ```

    ls /path/to/apache/modules/

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'Assuming everything went well, and `mod_rewrite.so` exists in the modules directory,
    you''ll need to enable it in `httpd.conf`, by either uncommenting any existing
    line or adding a new one that looks like the following:


    ```

    LoadModule rewrite_module modules/mod_rewrite.so

    ```


    > Do not use a `LoadModule` line for any module that is built statically into
    Apache—only dynamic shared objects. Using `LoadModule` for a static module will
    only generate an error.


    After all required changes are made to `httpd.conf`, restart Apache. Now that
    you''ve successfully installed `mod_rewrite`, you''ll need to take a look at the
    different configuration settings used to take advantage of `mod_rewrite`.


    # # RewriteRule


    `mod_rewrite` provides a handful of configuration directives that can provide
    a wide range of rewriting abilities, from very simple redirects, to complex multi-rule
    pattern-matching substitutions. At the heart of every rewritten URL is the `RewriteRule`
    directive.


    # ## RewriteRule Usage


    Regardless of how complex your rewriting needs may be, you will need at least
    one `RewriteRule` to perform a transformation. The basic format for the `RewriteRule`
    directive is as follows:


    ```

    RewriteRule pattern substitution [flag(s)]

    ```


    `RewriteRule` behaves in a manner similar to PHP''s `preg_replace` function: it
    takes a regular expression pattern, matches it against an incoming URL, and then
    uses a rule you define to provide a substitution for the URL.


    When constructing your regular expression pattern to match against, you can use
    the following tokens:


    | Pattern | Meaning |

    | :--- | :--- |

    | `^` | The carat symbol denotes the beginning of the line or string. |

    | `$` | A dollar sign denotes the end of the line or string. |

    | `.` | A period matches any single character. |

    | `(a\|b)` | Using the “pipe” character as a logical “or,” the pattern `(a\|b)`
    matches `a` or `b`. |

    | `(\u002e\u002e\u002e)` | Parentheses group sections as a sub-match. |

    | `[abc]` | Listing values inside a pair of brackets matches any value in the
    list or range given. The pattern `[abc]` matches the single letter `a`, `b`, or
    `c`, whereas the pattern `[a-z]` matches any lowercase letter `a` through `z`.
    |

    | `[^abc]` | Using the carat at the beginning of a range matches any values *not*
    listed in the range. The pattern `[^abc]` matches any character except `a`, `b`,
    or `c`; the pattern `[^a-z]` matches everything but lowercase `a` through `z`.
    |


    *Table continued on following page*'
  merge: -1
  img_proc: true
- pgno: 157
  md: "# Chapter 6\n\n| Pattern | Meaning |\n| :--- | :--- |\n| a? | A question mark\
    \ matches the preceding character exactly zero or one times. |\n| a* | The asterisk\
    \ instructs Apache to match the preceding character zero or more times—no limit.\
    \ |\n| a+ | Using a plus sign matches the preceding character one or more times—no\
    \ limit. |\n| a{n} | A single numeric value inside curly braces matches the preceding\
    \ character exactly the specified number of times. |\n| a{n,} | A single numeric\
    \ value followed by a comma matches the preceding character at least n times,\
    \ but possibly more. |\n| a{n,m} | Two numeric values in braces specify at least\
    \ n matches, but no more than m matches. |\n| !(pattern) | Logical “not” is represented\
    \ by the exclamation point before a pattern. Used to apply a rule when a URL does\
    \ not match the given pattern. |\n| \\char | Backslash acts as an escape character,\
    \ making it possible for you to match characters that are normally regular expression\
    \ tokens, such as `\\.`, `\\*`, `\\[`, `\\^`, and so on. |\n| \\d | Matches any\
    \ decimal digit. |\n| \\w | Matches any “word” character—typically any letter,\
    \ digit, or the underscore character. |\n\nFor example, you might have recently\
    \ replaced an older section of your website with a newer more up-to-date version,\
    \ with a different URL. To automatically redirect any URL in the old structure\
    \ to the index in the new location, you might use something similar to this:\n\
    \n```\nRewriteEngine On\nRewriteBase /\n\n# Rewrite requests for the old directory\
    \ to the new index\nRewriteRule ^olddirectory/ newdirectory/index.php [R,NC,L]\n\
    ```\n\nThis rule tells Apache to respond to all requests to any file in the `olddirectory/`\
    \ folder with the `index.php` in the `newdirectory` folder. The flags at the end\
    \ specify to redirect to the new URL, ignore case when matching, and to stop processing\
    \ any other rules that might match the requested URL—these flags are covered later\
    \ in the chapter.\n\nOne of the more common uses for using `mod_rewrite` is to\
    \ provide search-engine-friendly—and human-input-friendly—URLs, while still using\
    \ a standard PHP file with HTTP GET parameters tacked onto the request. To help\
    \ illustrate this scenario, begin by creating the following PHP file:\n\n```\n\
    <?php\n$category = '';\n$item = '';\nif (isset($_GET['cat']))\n{\n    $category\
    \ = $_GET['cat'];\n}\nif (isset($_GET['item']))\n```"
