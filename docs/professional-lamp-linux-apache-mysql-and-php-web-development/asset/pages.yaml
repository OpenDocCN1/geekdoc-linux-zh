    \ validation, including limiting the radius to something more sensible than 20\
    \ kilometers. All such specific tasks should be dealt with before reaching this\
    \ stage, each item as broadly applicable as possible.\n\nThe imagery is stored\
    \ as a collection of PNG files, each 100 × 100 pixels in size, corresponding to\
    \ 250 × 250 meters in the real world, so there are 19,200 such files in total.\
    \ Each is named according to the northing and easting of their southwest (bottom\
    \ left) corner. Northings increase upwards, and eastings increase towards the\
    \ right. Since northings and eastings are themselves measured in meters (that’s\
    \ what they’re for), the tile immediately north of 647000202660000.png will be\
    \ 64702502660000.png, and the tile immediately east would be 6470002660250.png.\
    \ The tiles have been positioned so that the northings and eastings they’re known\
    \ by are all multiples of 250. Since this property is shared by the parent image,\
