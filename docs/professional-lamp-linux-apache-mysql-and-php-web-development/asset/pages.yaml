    \ myself the variable and the final `unset()`. Dangerous, because it would have\
    \ reduced the readability of the code slightly (creating the variable as one thing\
    \ (the list arguments to `array_map()`), and two lines later using it for something\
    \ quite different (the result of the `array_map()` call).\n\n```\n```\n$temp =\
    \ array(null, array(1,2), array(3,4));\n$transposed_matrix = call_user_func_array('array_map',\
    \ $temp);\n```\n```\n\nHere’s the result of carrying out `call_user_func_array()`\
    \ by hand.\n\n```\n```\n$transposed_matrix = array_map(null, array(1,2), array(3,4));\n\
    ```\n```\n\nSo one way to look at the operation of `call_user_func('foo', array(arguments))`\
    \ is to look on it as taking an array and replacing `array(arguments)` with `foo(arguments)`.\n\
    \nTo complete the example, evaluate the `array_map()` call:\n\n```\n```\n$transposed_matrix\
    \ = array(array(1,3), array(2,4));\n```\n```\n\nThe practical upshot of `call_user_func_array()`\
    \ is that you can store all of the arguments to a function in a single array,\
    \ without needing to know how many arguments there are (consider that several\
    \ PHP functions accept variable numbers of arguments, and so can yours), nor needing\
    \ to take each of the elements out of the array and inserting them into the function\
    \ call by hand.\n\nThe reason for the slightly long-winded name is that there\
    \ is also a `call_user_func()` function. Instead of taking a callback and its\
    \ arguments as an array, it takes the callback and its arguments *explicitly*.\
    \ Just as you can think of PHP as converting `call_user_func_array('foo', array(arguments))`\
    \ to `foo(arguments)`, `call_user_func('foo', arguments)` converts to `foo(arguments)`\
    \ without using the intermediate array.\n\nIt may sound as though it’s effectively\
