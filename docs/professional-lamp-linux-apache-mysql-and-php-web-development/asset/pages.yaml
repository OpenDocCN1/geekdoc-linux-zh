- pgno: 84
  md: '# # More Obscure PHP


    # ## Final Observations on the Array Functions


    In terms of the number of functions listed, the array functions form one of the
    largest sections in the manual’s function listing: only just behind the filesystem
    functions and not far behind string handling. Even with the amount of abstraction
    that callbacks allow, why are there so many? And how can using them contribute
    to code quality?


    # ## So Many Array Functions


    Throughout PHP3 and PHP4, there have been noticeable gaps in the list of array
    functions. There was a function with which you could sort an array using your
    own definition of “less than, greater than, or equal to,” but there wasn’t a single
    array function that let you remove all the elements of one array that were “the
    same as” the elements in another, using your definition of “the same.” Over successive
    versions of PHP, these gaps are being identified, and new functions implemented
    to fill them.


    A principle factor harks back to the overlapping functionality mentioned at the
    start of the chapter. Having two functions with very similar behavior leads to
    the differences in how they are highlighted. There is a function to sort an array
    and a function to sort an array using a callback. There is a function to sort
    by key, and a function to sort by key using a callback. The natural question to
    ask is whether the same differences have meaning for the other array functions.


    If you imagine all the possible functions as being single points in some vast
    space, the existing functions provide a set of reference points from which the
    space can be charted. Having `sort()` and `usort()` suggests the idea of moving
    toward providing callbacks; from these, `ksort()` and `uksort()` suggest you can
    move independently in the direction of “by key” rather than by *value.* Now that
    those directions have been pointed out, having `array_diff()` is inevitably going
    to suggest `array_udiff()` with callback, “array_diff() by key,” and of course
    `array_udiff()` by key with callback. PHP5 has implemented many of these new functions,
    such as `array_udiff()`, and many others are in CVS versions, if not already in
    stable releases.


    “Orthogonal” means at right angles to; in other words, as far from parallel as
    you can get. With PHP’s early functions having so many that are so similar to
    each other that they “point in nearly parallel directions in function space,”
    using them will suggest other functions that are nearly parallel (e.g., `array_intersect_assoc()`
    and `array_uintersect_uassoc()`), leading to regions of function space where PHP’s
    functions are clustered thickly. The array functions form such a dense cluster.
    You will certainly find that you don’t *need* to be intimate with all of PHP’s
    array functions to use them effectively, and that consistent application of simple
    combinations of a few functions that are as much unlinkable as possible will net
    you all the functionality you require. That is orthogonality. *Which* few functions
    are up to you.


    # ## Array Function after Array Function


    When using a series of array functions to manipulate the contents of an array
    there is a distinct difference in the order manipulations are carried out, when
    compared to carrying out the manipulations directly on array elements within a
    loop. This can have an impact on considerations such as the memory requirements
    of your program.


    Consider this short example:


    ```

    $array = array_map(''do_something_fancy'', $array);

    ```'
