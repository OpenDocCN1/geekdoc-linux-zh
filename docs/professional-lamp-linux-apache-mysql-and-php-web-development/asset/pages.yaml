    various elements correspond to other elements. This can cause problems if the
    XML format is ever amended. Attaching response handlers at the XML *element* level,
    as opposed to the response level, shows some promise in abstracting the details
    of the whole XML document, allowing the client-side script to focus on the local
    structure relevant for that particular DOM manipulation.


    For example, you might wish to show alternative usernames in a separate DOM element,
    in which case you would need to differentiate between username elements that do
    or do not have a parent element of \texttt{usernamealts}. However, you would not
    need to know how the rest of the XML document is structured and where in the document
    tree these username elements are located. Implementing this idea would require
    a mapping between XML element name and handler function. The details of such an
    implementation are beyond the scope of this chapter, but there are articles available
