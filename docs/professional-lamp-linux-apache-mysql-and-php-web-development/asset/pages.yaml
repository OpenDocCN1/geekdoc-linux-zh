    +   - **DOM:** Interfaces with XML documents with the DOM API, and comes bundled
    with PHP default installation.

    +   - **SOAP:** Enables creation of SOAP servers and clients using GNOME xml library.

    +   - **ZIP extensions (Bzip2, rar, Zip, Zlib):** Enables reading of zip files,
