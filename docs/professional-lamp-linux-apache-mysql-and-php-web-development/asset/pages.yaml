    \ 'xml');\n$cfg->processConfig();\n? >\n\n```\n\nAll you have to do is include\
    \ the main ConfigManager class file, create a new ConfigManager object, passing\
    \ the filename and type during instantiation, and call the processConfig() method\
    \ to actually check the settings.\n\n# ## Summary\n\nHopefully you’ve now become\
    \ acquainted with some of the different configuration settings and functions that\
    \ can breathe life into your applications. Knowing the value of a setting at runtime\
    \ can often help avoid any hard-to-diagnose bugs, and being able to change the\
    \ values at runtime can make your applications flexible enough to cope with varying\
    \ configurations. This knowledge and power, combined with the automatic configuration\
    \ checked, should help make your applications as thick-skinned as possible when\
    \ confronted with the unknown troubles that unfamiliar servers can bring."
