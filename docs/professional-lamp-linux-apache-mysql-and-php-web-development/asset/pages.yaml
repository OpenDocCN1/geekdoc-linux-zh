    ```\n```\n\nFinally, `process()` calls the remaining three methods from the `ConfigProcessor`\
    \ interface, to check the version of PHP, available extensions, and configuration\
    \ settings:\n\n```\n```php\n        if (!$this->checkPHP() or\n            $this->checkExtensions()\
    \ or\n            !$this->checkConfig())\n        {\n            return $this->message;\n\
    \        }\n```\n```"
