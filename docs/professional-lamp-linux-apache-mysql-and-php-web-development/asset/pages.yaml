    break;\ncase 'image/gif': \n$this->gdresource = imagecreatefromgif($file); \n\
    break;\n}\n```\n\nWhen dealing with image formats that can contain transparent\
    \ regions, such as GIF or PNG, it is important to understand the two different\
    \ kinds of transparency involved. The first, and simplest, is index transparency.\
    \ Found in 8-bit transparent PNG images and all transparent GIF images, index\
    \ transparency simply defines one color in the indexed palette as transparent.\
    \ Any pixel that is assigned that color will show up transparent on-screen.\n\n\
    The second kind of transparency is alpha transparency, found in 32-bit PNG images.\
    \ Alpha transparent images implement transparency by providing an additional range\
    \ of values for each pixel that defines the transparency of that specific pixel.\
    \ Alpha transparency allows images to smoothly fade to transparent, or have any\
    \ color be partially transparent in places—something index-transparency images\
    \ cannot do.\n\nWhen dealing with images that contain alpha transparency in GD,\
    \ you need to inform GD that you want to retain any alpha transparency information\
    \ from the image you've loaded:\n\n```\n  // Retain the alpha information\n imagesavealpha($this->gdresource,\
    \ true);\n}\n```\n\nYou need to do this if you plan to load or output any image\
    \ format that understands per-pixel/alpha transparency, such as 32-bit PNG. If\
    \ you don't tell GD to save the alpha, you could end up with unexpected backgrounds\
    \ or transparency issues in your final output.\n\nThe last two methods, save()\
    \ and display(), each send the internal image resource to a final destination—either\
    \ in a file on the server, or displayed in a browser. The only substantial differences\
