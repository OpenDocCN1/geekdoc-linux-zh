- pgno: 48
  md: "# PHP5 OOP\n\nLooking carefully at the previous bit of code, you may have noticed\
    \ something a bit awkward in the way you used the `radius` property. You’ve explicitly\
    \ set the `radius` property, but then you reuse that property as an explicit value\
    \ for the parameter of the `calcArea` method. Since the object knows about the\
    \ `radius` property internally, there’s no reason it needs to be explicitly provided\
    \ to the `calcArea()` method. To remove the requirement to provide a `radius`\
    \ parameter and use the object’s own internal `radius` property, you’re going\
    \ to need a method to access it. PHP provides us with a reference named `$this`\
    \ to achieve such a goal. Using the specially named variable `$this` is just like\
    \ referencing an instantiated object, but `$this` references the object in which\
    \ it is contained.\n\nChange the `Circle` class, as shown here:\n\n```\n```php\n\
    <?php\n\nclass Circle\n{\n    public $radius;\n\n    public function calcArea()\n\
    \    {\n        return pi() * pow($this->radius, 2);\n    }\n}\n\n// Create a\
    \ new instance of Circle\n$c = new Circle();\n\n// Change a property\n$c->radius\
    \ = 5;\n\n// Use a method\necho 'The area of the circle is ' . $c->calcArea();\n\
    \n?>\n```\n```\n\nRunning the code will produce exactly the same results as the\
    \ previous example—the only changes occur in the way you use the `calcArea()`\
    \ method. Since you are referencing the `Circle` object’s `radius` property inside\
    \ the method, you no longer need the parameter in the function definition, and\
    \ in the method call.\n\n# ### Visibility\n\nOne of the new features of the PHP5\
    \ OOP model is the ability to specify a level of visibility for all class properties\
    \ and methods. Using these new visibility keywords, you can hide certain parts\
    \ of your class from external code, and expose other functionality that you want\
    \ accessible to all. PHP5 provides three visibility levels to use in classes:\
    \ `public`, `private`, and `protected`.\n\nA visibility of `public` means that\
    \ a property or method is available to all other code that wishes to access it.\
    \ If no visibility is specified for a method, it defaults to `public` visibility.\n\
    \nSpecifying a class member as `private` makes the property or method visible\
    \ only within the class definition to which it belongs. All other methods in the\
    \ same class can access the private member, but anything outside that specific\
    \ class cannot."
  merge: -1
  img_proc: true
- pgno: 49
  md: "# Chapter 2\n\nFinally, the *protected* keyword specifies that the property\
    \ or method is available only within the defining class, and any other classes\
    \ that extend or inherit from the defining class. Extending and inheriting classes\
    \ are discussed later in the chapter.\n\n> When reusing PHP4 classes under PHP5,\
    \ it is important to keep in mind that properties defined with the var keyword,\
    \ such as var $propertyName, will be treated as public, and an E_STRICT warning\
    \ is issued.\n\nSpecifying the visibility for a class member is as easy as putting\
    \ the appropriate prefix in front of the property or method declaration. In the\
    \ Circle class that you defined earlier, all class members were defined as public.\
    \ Now you're going to change some of the old class members to private, and add\
    \ some new methods.\n\n```\n```php\n<?php\nclass Circle\n{\n    private $center\
    \ = array('x' => 0, 'y' => 0);\n    private $radius = 1;\n\n    public function\
    \ setRadius($radius)\n    {\n        $this->radius = $radius;\n    }\n\n    public\
    \ function setCenter($x, $y)\n    {\n        $this->center['x'] = $x;\n      \
    \  $this->center['y'] = $y;\n    }\n\n    public function calcArea()\n    {\n\
    \        return pi() * pow($this->radius, 2);\n    }\n}\n```\n```\n\nInstead of\
    \ leaving the properties as public, you changed them to private and created functions\
    \ to set their values. In simple situations such as this, it is probably overkill\
    \ to do so, but if you were to expand the application, the set functions could\
    \ be used to do complex calculations on data before setting the internal values.\
    \ Such a separation can also add a layer of protection to the private members\
    \ by validating the externally provided values before allowing the internal data\
    \ to change.\n\nYou can use your modified class with the following code:\n\n```\n\
    ```php\n$c = new Circle();\n$c->setCenter(0, 0);\n$c->setRadius(10);\n\necho \"\
    The area of the circle is \" . $c->calcArea() . \"\\n\";\n\n// Attempt to access\
    \ a private property\necho \"The private value of radius is \" . $c->radius;\n\
    ?>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 50
  md: "If you run this code, you would see something like the following:\n\n```\n\
    ```\nThe area of the circle is 314.15926535898\nFatal error: Cannot access private\
