  md: "# Code Efficiency\n\nexperiments to determine the best approach for something\
    \ before implementing it for real, and profiling covers experiments you conduct\
    \ on the real thing to see just how well it actually performs. Clearly, there\
    \ is quite a lot of overlap between the two; many of the techniques and the tools\
    \ are the same (because the tools don’t necessarily care whether the code you’re\
    \ using them on is natural or synthetic). Tools exist to aid you in these at both\
    \ OS and PHP levels.\n\n# PEAR Benchmark\n\nYou’ve already seen examples of benchmarking\
    \ in the previous section. They were constructed ad-hoc, but the basic ideas they\
    \ have in common are common enough to warrant being abstracted into a separate\
    \ class:\n\n+   1. Start a timer (noting the current time).\n+   2. Do something.\n\
    +   3. Stop the timer (again noting the current time).\n+   4. Compare the stopping\
    \ time with the starting time to determine the elapsed duration.\n+   5. Repeat\
    \ steps 1–4 a lot, accumulating the durations.\n+   6. Have a look at the results.\n\
    \nAn obvious enhancement to this would be to label the timers, so that several\
    \ could be started and stopped independently. Also nice would be if timers could\
    \ also contain information about the time spent in specific sections of the code\
    \ they’re covering. The PEAR Benchmarking class provides all this functionality.\
    \ Installation of PEAR and PEAR packages is covered in Chapter 8; so you’ve already\
    \ taken care of that, and you’re ready to proceed with using it.\n\nTo repeat\
    \ the initial string-building experiment using the Benchmarking class, you could\
    \ write the following:\n\n```\n```php\n<?php\nrequire 'Benchmark/Timer.php';\n\
    $variable = 'string';\n\n$timer = new Benchmark_Timer();\n\n$timer->start();\n\
    for($i=0; $i<1000000; ++$i)\n{\n    $string = \"this string has a $variable embedded\
    \ into it\";\n}\n$timer->setMarker('lptime');\nfor($i=0; $i<1000000; ++$i)\n{\n\
    \    $string = \"this string has a .\".$variable.\" inserted into it\";\n}\n$timer->setMarker('finish');\n\
    \necho \"Variable interpolation required \"$timer->timeElapsed('Start','lptime'),\"\
    \n```"
