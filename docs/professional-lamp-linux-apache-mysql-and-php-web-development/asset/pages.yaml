- pgno: 119
  md: '# # Chapter 4


    One of the first things you need to do when configuring a database for the real
    world is set up any accounts that might be needed by any users, or the system
    itself. In order to set up specialized access for a user in your database, you
    need to know about the different levels for which MySQL can control access. MySQL
    4.1 can differentiate four different access levels in regards to permissions:
    the global level, database level, table level, and column level.


    Global-level privileges are the most powerful and apply to all the databases running
    on an instance of MySQL. Normally such privileges are reserved for administrator
    accounts, as it is a rare occasion when an application or end user will require
    access to all aspects of the database server’s operation.


    Database-level privileges apply just like they sound—at the database level. Database-level
    access is often used by the administrator of a specific database or application,
    and has the ability to give the user complete control over one specific database
    as specified.


    Table-level privileges apply on a per-table basis. You can create or remove access
    for a user on a specific table or set of tables. This level of access control
    is often used when configuring a database to be accessed directly by an application—the
    application only needs certain kinds of access on each table, and no more.


    Column-level privileges are the finest level of control that MySQL provides. As
    you might expect, it controls the access to a specific column or columns within
    a given table.


    # ## Using GRANT


    Now that you understand the varying scope of the MySQL access system, it’s time
    to look at how to actually control the privileges.


    To create and add privileges to user accounts, MySQL gives you the GRANT command.
    The GRANT command is relatively simple to use, as long as you know what access
    you’re granting, and to whom. The GRANT command has the following generalized
    syntax:


    ```

    GRANT [privileges] ON [resource] TO [identity]

    ```


    Let’s take a second to dissect GRANT. The first part of the command, GRANT [privileges]
    is where you specify what privileges to allow on the resource (specified later).
    Some of the more common privileges you can use are shown in the following table.


    | Privilege | Provides |

    | :--- | :--- |

    | ALL [PRIVILEGES] | Sets all simple privileges except GRANT OPTION |

    | ALTER | Allows use of ALTER TABLE |

    | CREATE | Allows use of CREATE TABLE |

    | DELETE | Allows use of DELETE |

    | DROP | Allows use of DROP TABLE |

    | INDEX | Allows use of CREATE INDEX and DROP INDEX |

    | INSERT | Allows use of INSERT |

    | SELECT | Allows use of SELECT |'
  merge: -1
  img_proc: true
- pgno: 120
  md: '| Privilege | Provides |

    | --- |

    | UPDATE | Allows use of UPDATE |

    | USAGE | Synonym for “no privileges”; user can log in but no more |



    The second part of the command `ON [resource]` is where you specify what database
    level and item you are making available. To grant access at the global level,
    you specify `* . *` as the resource, like so:


    ```

    GRANT [privileges] ON * . * TO [identity] . . .

    ```


    When you grant access at the database level, you specify the name of the database,
    followed by `.*`. For example, if you wanted to grant access to the testdb database,
    you would use something similar to the following:


    ```

    GRANT [privileges] ON testdb . * TO [identity] . . .

    ```


    To create permissions for a specific table within a database, you provide the
    name of the database, followed by the table name (separated by a period). If you
    were trying to specify access for the testtable in the testdb database, you might
    use something like this:


    ```

    GRANT [privileges] ON testdb.testtable TO [identity] . . .

    ```


    Granting column-level permissions is slightly different from the logical progression
    down the previous three levels. When giving column-level permissions, you must
    specify a column list in parentheses after each privilege in the list, such as
    the following:


    ```

    GRANT SELECT (column1), INSERT (column1) ON testdb.testtable TO [identity] . .
    .

    ```


    > When you are specifying column-level privileges, you must use the full table-level
    syntax after ON, or MySQL will return an error.


    The last key part of the `GRANT` command, `TO [identity]...`, is where you specify
    who the access permissions will be granted to, and any optional requirements the
    user must meet to be granted this access. The minimum you must provide to satisfy
    the `TO...` section of `GRANT` is a username/host combination. In MySQL, each
    distinct user `must` have at least basic usage permissions set for their username
    and the localhost. For example:


    ```

    GRANT USAGE ON * . * TO testuser@localhost

    ```


    Here the user `‘testuser’` has been granted basic usage access globally, which
    is equivalent to no access at all, but the user is now known to the system. Once
    a localhost account is created, you can create additional access statements for
    the same username at any remote host you specify:


    ```

    GRANT SELECT ON testdb . * TO testuser@192.168.1.2

    ```


    It should be noted MySQL will not complain if you try and create a remote access
    account for a user without a localhost entry first. Your applications, however,
    probably will—they might not be able to connect remotely, and it’s a common source
    of hair-pulling when first getting used to the MySQL access system.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# Chapter 4


    In most situations, it''s important that the user account also require a password
    to log in. To add a password when creating an account with GRANT, add the phrase
    IDENTIFIED BY ''password'' to the end of the GRANT command, like so:


    ```

    GRANT [privileges] ON [resource] TO [identity] IDENTIFIED BY ''[password]'';

    ```


    > You are not required to pre-encrypt the password before using it as the password
    in your GRANT command — MySQL will automatically encrypt the password before storing
    it in the system.


    Now that you’ve seen some generalized examples of how to use GRANT, you can try
    it on a real database. You’re going to be adding three users to the vehicle inventory
    database. One user will get full access to the whole database. The second will
    get SELECT, UPDATE, INSERT, and DELETE access to the New_Vehicles table. The third
    and final user will get SELECT access only to the color column in the New_Vehicles
    table. First, create the user who has all privileges in the database:


    ```

    GRANT ALL PRIVILEGES ON VehicleInventory.* TO testuser1@localhost IDENTIFIED BY
    ''testpass1'';

    ```


    Next, create the user with limited table-wide permissions:


    ```

    GRANT SELECT, INSERT, UPDATE, DELETE ON VehicleInventory.New_Vehicles TO testuser2@localhost
    IDENTIFIED BY ''testpass2'';

    ```


    Last, create the third user with the extremely limited access:


    ```

    GRANT SELECT (color) ON VehicleInventory.New_Vehicles TO testuser3@localhost IDENTIFIED
    BY ''testpass3'';

    ```


    # Using REVOKE


    You can now create users and privileges using the GRANT command, but you still
    need a way to take away privileges. To do that, you use REVOKE. The REVOKE command
    looks almost exactly like the GRANT command:


    ```

    REVOKE [privileges] ON [resource] FROM [identity]

    ```


    Note the only real differences between the REVOKE and GRANT syntax: the use of
    the word FROM instead of TO, and there’s no need to add the IDENTIFIED by phrase.


    For a quick look at REVOKE in action on a live database, try the following query:


    ```

    REVOKE ALL PRIVILEGES ON VehicleInventory.New_Vehicles FROM testuser2@localhost;

    ```


    And in that one quick stroke, you’ve wiped out any privileges the testuser2 account
    had.


    When revoking privileges, you normally must list the specific tables, databases,
    and columns that the user has explicit rights for. If you are using MySQL 4.1.2
    or later, you can quickly wipe all of a user’s privileges at any privilege level
    with one swift command:


    ```

    REVOKE ALL PRIVILEGES, GRANT OPTION FROM [identity]

    ```'
  merge: -1
