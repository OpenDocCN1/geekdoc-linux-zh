- pgno: 76
  md: "what you would have expected from `array_map('array', $arr1, $arr2)` if you’d\
    \ been allowed to use `array` as a callback.\n\nThis trick isn’t limited to combining\
    \ only two arrays at a time either. If the callback function requires *n* arguments,\
    \ then `array_map()` requires *n* arrays to be passed to it. So if you have a\
    \ function that takes six arguments, and an array of sextets, each of which you\
    \ want to run the function on, and collect all the results in a new array, `array_map()`\
    \ will be suitable.\n\n> Strictly speaking, there are two calls to `array_map()`.\
    \ The first uses a null callback to take the original `array[0..n] [0..5]` and\
    \ return the transpose `array[0..5] [0..n]`, the second to use the callback function\
    \ on successive elements of `array[0], array[1], ...array[5]`.\n\n`array_map()`\
    \ has two glaring limitations. First, every argument after the callback must be\
    \ an array. If you want to use a single variable in a whole array’s worth of operations\
    \ (such as clamping all the values of an array to a certain maximum), then you\
    \ have to do one of the following:\n\n+   - Declare the variable in global scope\
    \ and use the global inside the callback function (not the most attractive option)\n\
    +   - Use `array_fill()` to make an array of duplicates (useful only if you don’t\
    \ mind the operations being carried out on separate copies of the variable, or\
    \ if the variable is a passed-by-reference object or resource)\n+   - Fall back\
    \ to using a loop after all\n+   - Use a different function: specifically, `array_walk()`\n\
    +   - Use an option that can be considered when writing OOP: make the callback\
    \ a method and the variable a property of the object\n\nThe other glaring limitation\
    \ is that you need to know in advance just how many arrays are to be mapped together,\
    \ and list them all explicitly in the function call. You could work around this\
    \ by wrapping corresponding elements of the input arrays into a single element\
    \ of one consolidated array and passing the elements of that array to the callback\
    \ function. But this requires rewriting the callback function or, when that’s\
    \ not possible, writing a wrapper function to unpack the consolidated element\
    \ and passing the contents to the real callback. And you’ll realize that when\
    \ you do that you’re back where you started. Fortunately PHP supplies a solution\
    \ to this, too, in the form of `call_user_func_array()`, covered later in this\
    \ chapter.\n\n# ## `array_walk()`\n\nImagine that you’re using the GD Lib graphics\
    \ drawing extension to draw up a chart, and you have a lot of data points to indicate\
    \ with circles of varying sizes and colors. The positions and radii have already\
    \ been scaled to image coordinates, and the colors have already been allocated\
    \ and are identified by the image palette indexes (as returned by `imagecolorallocate()`).\
    \ You are supplied an array of the data points, each element containing the *x*-coordinate,\
    \ the *y*-coordinate, the radius, and the color, respectively. For example:\n\n\
    ```\n```php\n$$_data_points = array(\n   array(10,10,5, $palette['black']),\n\
    \   array(10,20,5, $palette['black']),\n   array(20,13,5, $palette['darkolivegreen']),\n\
    \   ...\n);\n```\n```"
