- pgno: 183
  md: '# Chapter 6


    # Apache as a File Repository


    One of the cooler things you can do with Apache is use it as a simple online file
    repository, with WebDAV. WebDAV, which stands for Web-based Distributed Authoring
    and Versioning, enables Apache to allow users to treat an enabled directory as
    a remote directory or drive on their own computers. Similar to a Windows share
    or NFS export, WebDAV allows remote editing and storage access, only using HTTP
    as the transport layer instead of a specialized TCP protocol or port like SMB
    and NFS.


    To understand how WebDAV works as a shared drive, it''s easier to just see it
    in action, so next, you''re going to enable mod_dav, which ships with Apache,
    and test it out. To start, as with other modules, check to see if mod_dav is already
    statically compiled into Apache, or existing as a loadable module:


    ```

    ```

    /path/to/httpd -l

    ls /path/to/apache/modules

    ```

    ```


    As you might have guessed, if you don''t see mod_dav.c in the httpd -l output,
    or mod_dav.so in the file list, you''ll need to build it yourself with the Apache
    httpd source code. To add mod_dav statically into the Apache binary, make sure
    both --enable-dav and --enable-dav-fs exist in the configure command:


    ```

    ```

    ./configure \

    --enable-dav \

    --enable-dav-fs \

    # ...and any other configure settings you use

    ```

    ```


    To build mod_dav as a shared object, just add =shared to the end of both DAV-related
    lines:


    ```

    ```

    ./configure \

    --enable-dav=shared \

    --enable-dav-fs=shared \

    # ...and any other configure settings you use

    ```

    ```


    Then build and install the new binary and modules using make and make install.


    If you decided to use the dynamic modules for mod_dav, you need to enable them
    in httpd.conf, using the following lines:


    ```

    ```

    LoadModule dav_module  modules/mod_dav.so

    LoadModule dav_fs_module modules/mod_dav_fs.so

    ```

    ```


    To have a place to actually store the WebDAV file repository, you can create a
    new directory, or use an existing directory of your choosing. You should place
    your WebDAV folders inside your SSL-enabled web root, or make sure to enable SSL
    later on, if you plan to use Basic Authentication to limit access to the WebDAV
    folders. Basic Authentication sends usernames and passwords in the clear, so you
    want to SSL-enable the protected directories to encrypt the Basic Auth requests.
    Create the new folders if needed, and create a dummy file to add to the WebDAV
    folder:


    ```

    ```

    mkdir -p /wwwssl/dav

    echo "Testing DAV" > /wwwssl/dav/testing.txt

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 184
  md: "When users access your WebDAV folder, you’re going to authenticate them against\
    \ a database or htpasswd file, to prevent anonymous users all over the Internet\
    \ from filling up your hard drive. First, create a htpasswd file to store the\
    \ passwords of valid users, and initialize it with the user account for `testdav`:\n\
    \n```\n`mkdir -P /davauth`\n`/path/to/htpasswd -c /davauth/dav.htpasswd testdav`\n\
    ```\n\nWhen prompted for a password, enter a password of your choosing. Next,\
    \ create a .htaccess file in the `/wwwssl/dav` folder to enforce basic authentication.\
    \ The .htaccess file should contain the following:\n\n```\nAuthName \"DAV Test\"\
    \nAuthType Basic\nAuthUserFile \"/davauth/dav.htpasswd\"\nrequire valid-user\n\
    ```\n\nFinally, create a Directory entry in your httpd.conf to enable WebDAV and\
    \ basic authentication for the given directory:\n\n```\n<Directory \"/wwwssl/dav\"\
    >\n  AllowOverride AuthConfig\n  Dav On\n</Directory>\n```\n\nThen you can restart\
    \ Apache, and WebDAV will be enabled for the `/dav/` folder of your HTTPS site,\
    \ accessible at something like `https://www.example.com/dav/`. You can try to\
    \ load this URL in your web browser, but it will behave no differently than a\
    \ standard non-DAV web directory. To use the capabilities of your WebDAV URL,\
    \ you’ll need to use software that is WebDAV-enabled.\n\nEditors such as jEdit,\
    \ NuSphere’s PHPEd, and Macromedia Dreamweaver, among others, all support WebDAV\
    \ at some level. If you don’t have any of those editors at your disposal, have\
    \ no fear—most modern operating systems actually support the mounting of WebDAV\
    \ shares natively in their file explorer/browser utilities.\n\nTo access your\
    \ WebDAV share using your operating system’s file browser, follow the instructions\
    \ in whichever of the preceding sections pertains to your OS.\n\n# Windows 2000/XP\n\
    \nTo set up WebDAV under Windows 2000 or XP, you need to run through the Add Network\
    \ Place wizard as follows:\n\n+   1. Go to My Network Places, and double-click\
    \ Add Network Place, as shown in Figure 6.1.\n+   2. When the Add Network Place\
    \ Wizard appears, click Next to bring up a list of service providers. Select the\
    \ Choose Another Network Location option, as shown in Figure 6.2, and then click\
    \ Next."
  merge: -1
  img_proc: true
