- pgno: 168
  md: "# Apache Tricks\n\n# ornext|OR\n\nThe default chaining method for multiple\
    \ RewriteCond directives is to use a logical AND. If the ornext flag is used,\
    \ the two connected RewriteConds are compared with a logical OR.\n\nWhile the\
    \ RewriteRule and RewriteCond directives deliver a majority of the power in mod_rewrite,\
    \ there are a handful of other key directives that can help you control your rewriting\
    \ and solve problems.\n\n# RewriteBase\n\nIn most situations, your website URLs\
    \ will not match your physical file system layout. The root of your website is\
    \ almost never located at the root (*/) of the local file system. In normal operation\
    \ of Apache server, this is not usually a problem; when using RewriteRule, it\
    \ can be very problematic. RewriteBase allows you to specify the base or prefix\
    \ path for a set of URL rewrites.\n\nTo fully understand the reasoning for RewriteBase,\
    \ take a look at the following example ruleset used to rewrite a simple set of\
    \ files:\n\n```\nRewriteEngine On\nRewriteRule `foo\\.html$ bar.html [R]\n```\n\
    \nSuppose your web root is being served out of the /www folder of the local file\
    \ system (that is, your DocumentRoot is set to /www). If you tried to use the\
    \ preceding rule in a per-directory access file (.htaccess), it would actually\
    \ result in the request being rewritten incorrectly—instead of your expected http://www.domain.com/bar.html\
    \ file being returned, you get http://www.domain.com/www/bar.html. Why is this?\
    \ Here is a simplified version of what is happening internally to Apache:\n\n\
    ```\nRequest: /www/foo.html (local physical path)\n\nRewriting:\n/www/foo.html\
    \ -> foo.html (directory prefix stripped)\nfoo.html -> bar.html (RewriteRule applied)\n\
    bar.html -> /www/bar.html (directory prefix re-applied)\n/www/bar.html -> http://www.domain.com/www/bar.html\n\
    \               (domain prefix applied to URL, sent to browser)\n```\n\nTo solve\
    \ this, you simply add a RewriteBase statement to your ruleset:\n\n```\nRewriteEngine\
    \ On\nRewriteBase /\nRewriteRule `foo\\.html$ bar.html [R]\n```\n\n# RewriteLog\n\
    \nIn order to get a first-hand glimpse of what is actually going on with mod_rewrite,\
    \ try out the RewriteLog directive. You can use RewriteLog to specify a log file\
    \ where a running record of the internal rewrite processing will be sent."
  merge: -1
  img_proc: true
- pgno: 169
  md: '# ## Chapter 6


    To enable a log of the rewrites alongside the other default Apache log files,
    use the following:


    ```

    ```

    RewriteLog "logs/rewrite_log"

    ```

    ```


    When specifying the path for the rewrite log, you can use both absolute and relative
    paths. If a relative path is used, it will be taken relative to the *ServerRoot*
    setting in httpd.conf.


    Note that the *RewriteLog* directive is applied on a per-server basis, so it must
    be placed in either the server config or a virtual host container inside httpd.conf—It
    is not allowed inside a <Directory> section or .htaccess file.


    # ### RewriteLogLevel


    To control how verbose the rewrite log records are, you can use the *RewriteLogLevel*
    directive. Given a number 0 through 9, with 9 being the most verbose, you can
    control how much internal processing is recorded. A setting of 0 disables logging
    altogether, and anything greater than 2 should be used only for debugging—it can
    slow down Apache on the higher settings.


    If you’d like to delve deeper into the workings of mod_rewrite, check out the
    mod_rewrite section of the Apache online manual:


    ```

    ```

    http://httpd.apache.org/docs-2.0/mod/mod_rewrite.html

    ```

    ```


    # ### URL Spell Checking


    With the power of mod_rewrite at your side, there’s very little in the way of
    malformed or changed URLs that you can’t handle, but what about spelling mistakes?
    Sure, you could come up with a huge list of possible misspellings for each of
    the files in your website, and write about a thousand RewriteRules, but it’s not
    necessary. To alleviate you from the burden of “simple” spellchecking, Apache
    comes with the mod_spelling module (and yes, it really is spelled with only one
    “T”). With mod_spelling, you can offload the task of handling URL spelling mistakes
    to Apache, which will automatically do its best to determine what file the user
    had intended to load.


    To use mod_spelling, start by first checking to see if it is already available
    to Apache as a statically built module:


    ```

    ```

    /path/to/httpd -l

    ```

    ```


    If you don’t see mod_spelling.c in the list, check the Apache modules directory
    for mod_spelling.so:


    ```

    ```

    ls /path/to/apache/modules

    ```

    ```


    If you don’t find either the static library or the dynamic module, you’ll need
    to build them yourself. As before, you can choose between statically building
    the module into Apache itself or building it as a dynamic module.'
  merge: -1
  img_proc: true
- pgno: 170
  md: "To build the static version, change your configure command to include mod\\\
    _speling, as follows:\n\n```\n``` bash\n./configure \\\n  --enable-speling \\\n\
    # ...and any other configure settings you use\n```\n```\n\nIf you prefer to use\
    \ the dynamic module instead, just add --shared to the mod\\_speling line:\n\n\
    ```\n``` bash\n./configure \\\n  --enable-speling=shared \\\n# ...and any other\
    \ configure settings you use\n```\n```\n\nAfter the configure script, it’s a simple\
    \ matter of building and installing the new binaries and modules using make and\
    \ make install. If you chose to use the dynamic module for mod\\_speling, you’ll\
    \ need to do one extra step. To enable mod\\_speling as a dynamic module, uncomment\
    \ or add the following line in your httpd.conf file:\n\n```\n``` apache\nLoadModule\
    \ speling\\_module modules/mod\\_speling.so\n```\n```\n\nOnce the changes have\
    \ been made, restart Apache. If no errors are shown in the Apache error log, then\
    \ you’ve successfully added mod\\_speling capabilities to your server.\n\nTo actually\
    \ use the spell-checking, add the following directive to the global server config\
    \ section, your virtual host section, a <Directory> section, or a simple .htaccess\
    \ file:\n\n```\n``` apache\nCheckSpelling on\n```\n```\n\nConfiguring mod\\_speling\
    \ involves only the CheckSpelling directive — a value of “on” enables the spellchecking,\
    \ and “off” disables any checks, which is the default behavior.\n\nTo see mod\\\
    _speling in action, enable CheckSpelling in a directory of your choosing, and\
    \ then create the following script in that directory, called info.php:\n\n```\n\
    ``` php\n<?php phpinfo(); ?>\n```\n```\n\nBy now, you should recognize this as\
    \ the standard PHP information dump output, but instead of loading the file using\
    \ the correct info.php URL, try loading it using a slightly misspelled name, like\
    \ ingo.php. With mod\\_speling enabled, Apache performs a quick HTTP 301 redirect\
    \ to its best guess at what you intended, instead of serving up a cold plate of\
    \ 404 Not Found.\n\n# ## Content Compression\n\nWhat if we were to tell you that\
    \ with a couple minutes of Apache configuration, you could shave drastic amounts\
    \ off your monthly bandwidth usage? You might think it’s a lie, but in fact it’s\
    \ quite true—all you need is content compression and a couple of configuration\
    \ directives.\n\nWhat’s content compression? When web pages are downloaded over\
    \ the Internet, by default the bits and bytes that make up the page markup, images,\
    \ stylesheets, and other content are in a mostly uncompressed"
  merge: -1
  img_proc: true
- pgno: 171
  md: '# Chapter 6


    state. The HTML that you write is sent directly as you saved it, whitespace and
    all. Content compression allows you to transparently compress the page markup
    and send it across the Internet to the user''s browser, where it is silently uncompressed
    before it is rendered to the screen. Another way to think about it is in relation
    to sending zipped files via email. You could just as easily send a large document
    of multimedia file as a plain attachment to an email, but many times you compress
    the file into a zip or targz archive before sending, to help shorten the time
    it takes to download the message and attachment.


    Using content compression with Apache is very easy. All you need is `mod_deflate`,
    which comes with the Apache source code and is easily compiled in as a module
    when building Apache.


    # Using mod_deflate


    As with the previously discussed modules, the first thing you need to do is check
    to see if the module is available either statically part of Apache, or as a module:


    ```

    ```bash

    /path/to/httpd -l

    ls /path/to/apache/modules/

    # ...and any other configure settings you might use

    ```

    ```


    If you see `mod_deflate.c` in the output of the first command, or `mod_deflate.so`
    in the output of the second, you already have access to `mod_deflate`, and can
    skip the next steps where you rebuild Apache.


    If you don''t see `mod_deflate` in either of the command results, you''ll need
    to add it either statically built into the Apache binary, or as a dynamic module.
    To include `mod_deflate` statically in Apache when building from source, all you
    need to do is add the following when you run `configure`:


    ```

    ```bash

    ./configure \

    --enable-deflate

    ```

    ```


    If you wish to use the dynamic loadable module, just add `=shared` to the end
    of the line enabling `mod_deflate`:


    ```

    ```bash

    ./configure \

    --enable-deflate=shared \

    # ...and any other configure settings you might use

    ```

    ```


    Obviously, if you plan on including other directives when running `configure`,
    you''ll need to add those as well. After configuring the source, do the usual
    `make` and (as root) `make install`.


    If you built `mod_deflate` as a dynamic module, you''ll have to enable the module
    in `httpd.conf` using `LoadModule`:


    ```

    ```apache

    LoadModule deflate_module modules/mod_deflate.so

    ```

    ```


    Then restart Apache so the changes take effect.


    After you build and enable `mod_deflate`, it''s a simple matter of telling Apache
    to use `mod_deflate`, and what file types to compress. To do that, you''ll need
    to edit your `httpd.conf` file, or create or modify an `.htaccess` file in the
    directory you want to use compression — the former being the preferred method
    if available.'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'To enable compression globally in Apache, add the following to your httpd.conf:


    ```

    ```

    AddOutputFilterByType DEFLATE text/*

    AddOutputFilterByType DEFLATE application/ms*

    AddOutputFilterByType DEFLATE application/vnd*

    AddOutputFilterByType DEFLATE application/postscript

    ```

    ```


    Then all you need to do is restart Apache, and you''ll have content compression
    up and running.


    What exactly do all those configuration directives mean? It''s pretty straightforward
    actually — in Apache 2.x, the AddOutputFilterByType directive does exactly what
    it looks like: it tells Apache to pass the output through a given filter, mod_deflate
    in this case, before handing the response to the end-user''s browser. The previous
    example code told Apache to use the DEFLATE filter, mod_deflate, on any text-based
    files (*text\**), any Microsoft documents such as Word or Excel files (*application/ms\**
    and *application/vnd\**), and any postscript files such as Adobe Illustrator or
    EPS drawings (*application/postscript*). Any document type you like can be added
    to mod_deflate''s filtering list by simply using a combination of the document''s
    MIME type and wildcards, similar to the example.


    If you want to compress only plain text and HTML files, use the following:


    ```

    ```

    AddOutputFilterByType DEFLATE text/plain

    AddOutputFilterByType DEFLATE text/html

    ```

    ```


    What if you wanted to compress everything that Apache served? Using another Apache
    directive, SetOutputFilter, you can tell Apache to send every file through mod_deflate:


    ```

    ```SetOutputFilter DEFLATE```

    ```


    However, in most server setups, this is not a very good idea. There are in fact
    some file types that do not benefit from compression, and some that become corrupted
    for the end-user when compressed. In most situations, there is no need to compress
    image formats, as the most commonly used web formats already have some built-in
    form of compression. Additionally, PDFs are also compressed, and should absolutely
    never be filtered through mod_deflate, as they will become unreadable in Acrobat
    Reader.


    > It should be noted that versions of Netscape Navigator 4.x cannot reliably decompress
    any file type other than text/html, and specific versions of Netscape Navigator
    4.x cannot decompress any file types.


    In order to further tweak the compression of your chosen file types, mod_deflate
    provides the configuration directives described in the following sections.


    # ### DeflateCompressionLevel


    DeflateCompressionLevel sets the level of compression used to shrink the files,
    a range from 1 to 9. A compression level of 1 yields the fastest compression,
    with the least amount of compression (larger files), and a compression level of
    9 uses the slowest compression, but the resulting file sizes are much smaller.
    When deciding which level to use, you must determine which is more important for
    you — saving processor cycles or saving download time. The default compression
    level of 6 is usually a good compromise between the two.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# # Chapter 6


    # ## DeflateFilterNote


    If you wanted your log files to show the compression ratio for each requested
    file in the access log, use `DeflateFilterNote`.`DeflateFilterNote` takes the
    name of a log token as its value—the named token given with `DeflateFilterNote`
    can then be used to customize the output of your logs using Apache’s `LogFormat`
    directive.


    # ## DeflateWindowSize


    This specifies the zlib compression window size, used in compressing the files.
    Values range from 1 to 15, with 1 yielding less compression and 15 giving the
    most compression. The default value for `DeflateWindowSize` is 15.


    # ## How Well Does mod_deflate Work?


    In order to see the byte-saving abilities of mod_deflate, this example serves
    a decent-sized HTML page with Apache, both with and without mod_deflate enabled.
    In this example, the home page is used for the Wrox P2P community forums, found
    at `http://p2p.wrox.com`. The raw HTML markup—and the HTML only—for this page
    weighs in at a hefty 47172 bytes. Have a look at the following table to see how
    it fared being thrown through mod_deflate at three different compression levels:


    | Compression Level | Bytes Transferred | % of Original | Approx. Download Time
    (56k) |

    | :--- | :--- | :--- | :--- |

    | Raw | 47172 bytes | 100% original | 11.7 seconds |

    | Default (6) | 7621 bytes | 16.2% original | 3.8 seconds |

    | Level 1 | 9050 bytes | 19.2% original | 4.1 seconds |

    | Level 9 | 7581 bytes | 16.1% original | 3.8 seconds |


    As you can see, using mod_deflate clearly has an advantage over serving the raw,
    uncompressed HTML—eliminating up to nearly 84% of the file size sent over the
    connection. Also notice that using the maximum compression of 9 edged out the
    default level of 6 by only a marginal amount, so in this situation it would probably
    be safe to stick with the default compression level of 6 to save the processor
    a few cycles.


    Many websites have a mixture of HTML, media, and associated scripting files, so
    sites such as photo-blogs or online shopping malls may not reap tremendous file
    savings on every file they serve, but each byte saved can really add up to some
    huge bandwidth reduction at month’s end. Text-heavy sites such as blogs and news
    portals would really see the benefits of content compression, as a majority of
    the bandwidth utilized on those sites is plain text—text that would find its way
    through mod_deflate.


    # ## Enabling Compression for PHP Scripts


    What about PHP files you might be wondering? In many situations there is no need
    to use compression on PHP files, and in some cases it can be detrimental to the
    output.


    If your PHP script outputs an actual image or PDF for example, you wouldn’t want
    Apache to blindly compress the output, just because the file extension happened
    to be .php.'
  merge: -1
  img_proc: true
- pgno: 174
  md: "In some situations, output buffering and compression might already be enabled\
    \ for all PHP scripts. To determine, check the value of the configuration variable\
    \ `output_handler`, or look in php.ini for the values of `output_handler` and\
    \ `zlib.output_compression`.\n\nTo enable output compression within PHP, do the\
    \ following:\n\n+   Install the zlib libraries on your machine if needed.\n+ \
    \  Configure the PHP source code as needed, making sure you include `--with-zlib`,\
    \ and then `compile`/`install` as normal.\n+   Modify your php.ini so it includes\
    \ the following lines:\n+   \n+   ```text\n+   output_buffering = Off\n+   output_handler\
    \ =\n+   zlib.output_compression = On\n+   ```\n+   \n+   Restart Apache so the\
    \ new changes take effect.\n\n# ## Using MySQL with Apache\n\nBy now, you’ve created\
    \ a security zone or two using Apache and basic authentication, and for most situations,\
    \ that might be all you need. You may find, however, that basic authentication\
    \ with Apache, while simple, is a little too limited in the amount of control\
    \ and customization you can incorporate. For many such situations, you can actually\
    \ use a combination of Apache basic authentication and the power of relational\
    \ databases via MySQL. For such a purpose, the `mod_auth_mysql` Apache module\
    \ exists.\n\nLike standard Apache basic authentication, `mod_auth_mysql` can control\
    \ access per-directory, and can be configured inside both .htaccess files and\
    \ a <Directory> section inside httpd.conf. Unlike standard Apache basic authentication,\
    \ all user credentials are stored in a database, instead of in flat files.\n\n\
    # ### Setting Up the Database\n\nInstalling and configuring `mod_auth_mysql` involves\
    \ a few steps, the first of which is to create the necessary database structures\
    \ to hold the user data. Start by loading up your favorite MySQL client, and creating\
    \ the database. For example:\n\n```\n```sql\nCREATE DATABASE apacheauth;\n```\n\
    ```\n\nNext, create a user that will be used by Apache to access the credentials:\n\
    \n```\n```sql\nGRANT SELECT ON apacheauth.* TO apache@localhost IDENTIFIED BY\
    \ 'apachepass';\n```\n```\n\nNow that the database user is created, it’s time\
    \ to add a table to hold the login information. For now start out with a simple\
    \ table that just holds the username and password:\n\n```\n```sql\nUSE apacheauth;\n\
    CREATE TABLE user_info (\nuser_name varchar(50) NOT NULL,\n```\n```"
  merge: -1
  img_proc: true
- pgno: 175
  md: '# # Chapter 6


    ```

    ```

    user_password varchar(50) NOT NULL,

    PRIMARY KEY (user_info)

