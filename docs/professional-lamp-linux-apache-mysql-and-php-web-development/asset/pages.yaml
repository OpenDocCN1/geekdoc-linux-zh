  md: "# PHP Configuration\n\nits own configuration directive. Automatic escape of\
    \ input data is controlled by the magic_quotes_gpc directive, and the escaping\
    \ from any function is controlled by the magic_quotes_runtime setting.\nBecause\
    \ these are both critical operations that can “dirty” your data if neglected,\
    \ PHP provides two functions to quickly ascertain the current setting for each:\
    \ get_magic_quotes_gpc(), for the input data, and get_magic_quotes_runtime() for\
    \ the function handler. Both functions require no arguments, and return 1 if the\
    \ setting is enabled, or 0 if disabled. Run this code:\n\n```\n```php\n<?php\n\
    \necho \"Magic quotes GPC: \" . get_magic_quotes_gpc() . \"\\n\"\n     \"Magic\
    \ quotes runtime: \" . get_magic_quotes_runtime() . \"\\n\";\n\n?>\n```\n```\n\
    \nDepending on your current configuration, you’ll see something similar to this:\n\
    \n```\n```\nMagic quotes GPC: 0\nMagic quotes runtime: 0\n```\n```\n\n# Changing\
    \ Configuration Dynamically\n\nYou can now check configuration settings and extension\
    \ properties real-time in your code, but if something’s not the way you like it,\
    \ what are you going to do? With some built-in PHP functions, you can change the\
    \ way PHP behaves in certain situations.\n\n# Quotes That Aren't So Magical\n\n\
    If you’re like me, you probably don’t like it if magic_quotes_runtime is enabled,\
    \ mangling all the output from every function. While it can be seen as a convenience,\
    \ it usually just gets in the way, and forces you to use stripslashes() or addslashes()\
    \ all over the place. To change it, you can use set_magic_quotes_runtime(). An\
    \ argument of “1” turns on the automatic replacement; a value of “0” turns it\
    \ off:\n\n```\n```php\n<?php\n\n// Turn on magic_quotes_runtime\nset_magic_quotes_runtime(1);\n\
    \n// Turn off magic_quotes_runtime\nset_magic_quotes_runtime(0);\n\n?>\n```\n\
    ```\n\nUnfortunately, the same cannot be said for magic_quotes_gpc — you cannot\
    \ change its value at run-time (more on this later).\n\n# Removing the Time Limit\n\
    \nIf you find yourself in a situation where a script is running a bit longer than\
    \ PHP will allow, you have two choices: optimize your code so it’s faster, and\
    \ tell PHP to be a bit more patient. Perhaps you’ve already optimized your code\
    \ as much as you can, and the default 30-second timeout is still too quick."
