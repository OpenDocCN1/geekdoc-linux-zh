- pgno: 234
  md: '# # Code Efficiency


    you serve stuff? It’s often instructive to use the two side by side: ab to see
    how your performance looks, and top to see how much effort is going into getting
    that performance.


    You run ab on the web server itself, of course; ab can be run in the same place,
    but for fairness’s sake it’s worth running it from another machine on the local
    network (running it more remotely than that would introduce additional delays
    that would hinder your attempts to stress the server). For example, you could
    open a terminal window on your workstation and ssh to the web server; running
    ab on your workstation and top on the server with the two terminal windows side-by-side.


    Put simply, ab is an http client on speed. A typical invocation has it requesting
    the same page a thousand times in close succession, thus simulating a thousand
    users all hitting it nearly at once. It gathers statistics on how long the server
    took to respond to the requests, and whether any failed to be satisfied. Take
    a look at this example:


    ```

    ab -n1000 -c10 http://bowman/page2test.php

    ```


    This command tells ab to request page2test.php a total of one thousand times,
    with up to ten requests running concurrently. So it makes ten requests, and as
    soon as one of them is satisfied and the response has been received, it starts
    an eleventh, not letting up until the total has been reached.


    After it has made its one thousand requests, it presents a report of the statistics
    it has gathered. These include the total time for the whole run, the size of the
    response, how many requests were made and how many failed, how rapidly it had
    been able to make requests (corresponding to the rate at which requests were satisfied),
    how quickly the responses themselves were served in bps, and how long the average
    and slowest response took.


    It’s less important for benchmarking to adjust the total request parameter -n;
    this just has to be at least as large as -c, and large enough for the overall
    statistics to be smoothed out, without any transient behavior at the start of
    the test throwing off the results. Tweaking the concurrency parameter -c is more
    informative. Starting with -c1 (the lower you set -c, the lower you can set -n
    unless you really want to sit and wait that long), you can see if the server is
    capable of responding to one request at a time. As you increase -c, you increase
    the number of concurrent requests being made, and you can watch to see if your
    server is able to handle the increasing load. As an example, versions of IIS that
    ship with desktop versions of Microsoft Windows are throttled to a maximum 10
    concurrent requests. As soon as -c goes above 10, you’ll start getting failed
    requests. Yes, you can use ApacheBenchmark to test other servers; in a way, it’s
    called “Apache” because it’s an Apache Group product. With increasing load the
    transfer rate will drop, the rate at which requests are made will increase, and
    eventually requests will start failing. If you’re feeling sadistic, you could
    simulate being Slashdotted: hit your server with n100000 -c1000 and watch it have
    a hernia.


    Meanwhile, over in the other terminal window is the server’s view of what is going
    on. When you run top, the first thing to look at is the load average. The three
    numbers given are the average number of active processes (that is, either running
    or waiting to run, as opposed to those that are currently idle) for the past minute,
    5 minutes, and 15 minutes, respectively. If you think of the server as a bank,
    a processor as a teller, and a process as a person, the load averages represent
    the number of people either being served or standing in line. Obviously, if there
    aren’t enough tellers, there will be a lot of increasingly irritated people. Likewise,
    too high a load average means that processes are spending too much time queueing
    for a chance to run. Consequently, the people whose requests initiated those processes
    are also having to wait for results and they or their browsers may even give up
    — not a good look for your site.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# ## Chapter 9


    Ideally, you want the load average to be somewhat lower than the number of processors
    your server has, keeping some slack available to handle unusually heavy loads.
    Brief surges are tolerable, but only if they’re brief. If the 15-minute load shouldn’t
    surge at all; if it does, then it’s an indication that when the server is busy
    it’s too busy, and a backlog is forming that takes a long time to work through.
    A spike large enough to significantly influence the 15-minute average could not
    be dealt with quickly.


    Just below the load average in `top`’s display is the activity level for each
    processor, given as a percentage. This should also stay fairly low, to allow for
    the Slashdot Effect or attack attempts by the latest worm. If the machine is a
    dedicated web server, then sustained activity from the processor when nothing
    is being served may suggest that it is doing something it shouldn’t be. Check
    the process listing itself to see which processes are using the processor. You
    may be able to remove some of them. A site that merely serves static web pages
    or files would experience very little CPU load at all—a 1980s vintage processor
    is perfectly capable of transferring data as fast as it can be read from disk—but
    dynamically generated pages do experience a bottleneck at this point.


    On the other hand, the server may be running flat out even with a nearly idle
    CPU. Recall the Windows report generator anecdote, where simple tasks were taking
    forever while the processor spent 85 percent of its time twiddling its thumbs,
    and the determination that the problem lay in the fact there was too little RAM
    in the machine.


    Below `top`’s CPU usage report is a report on the amount of memory available,
    how much is being used, and how much is still free, both in RAM and in the swap
    file. You want to rely on the swap file as little as possible, ideally not at
    all.


    # ## Hardware Improvements


    So, you’ve decided that the site is running slowly. You’ve profiled what’s been
    going on and now you’re ready to look at improving matters. The most profound
    improvements can come with remembering that your server exists in the real world
    and is subject to physical law. You can’t change the laws of physics: you have
    to accommodate yourself to them.


    The first thing to look at is your connection to the outside world. You want a
    nice big pipe there. If your server is lightly loaded but network traffic is maxed
    out, then your connection is your bottleneck.


    Once that’s been dealt with, check the processor. If it’s consistently running
    at the upper limit of its range, then an upgrade could well give you more breathing
    room. How old is your machine? Two years? You’ll probably find that a new box
    will be more than twice as fast as your current one. Of course, changing the computer
    is the most fundamental, fraught-with-peril, and almost certainly expensive change
    you can make. It would be *nice* if you could just bring the new box in, swap
    the cables from the old machine to the new, perform a hard drive transplant, and
    fire it up. It never seems to work out that simply though.


    If the processor is fairly idle, but memory is tight, then increasing RAM is your
    next priority. 512MB is easily sufficient for all but the most high-volume sites,
    or sites with the largest databases, which are usually cached in RAM by MySQL
    for speed of access.


    For sites that principally serve static pages or files, then RAM is more important
    than processor speed—it’s very simple to just move a chunk of data from one part
    of the machine to another, so being able to quickly work out how to move it is
    not as important as being able to move a lot of it at once.'
  merge: -1
