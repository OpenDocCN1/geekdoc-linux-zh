- pgno: 245
  md: "# Chapter 9\n\n# Comments\n\nAs well as *(or instead of)* the authorship and\
    \ licensing details mandated by PEAR, other things that could go in the top comment\
    \ include a synopsis of what the code it contained does. If it’s a long synopsis,\
    \ preceding it with a one- or two-line abstract summarizing the synopsis will\
    \ help the developer who comes along later and wants to know what the file is\
    \ for.\n\nPEAR also says you should use javadoc-style comments, so that they are\
    \ easily translated into documentation. Opinion is just as divided on this score\
    \ as on any other style issue. An argument against it is that they make the comments\
    \ themselves, as they appear in the source code, harder to read because of all\
    \ the extra formatting they attract. Another opinion, when it is argued that every\
    \ publicly accessible method should be commented in this way, is that it encourages\
    \ *vapid do-nothing* comments that don’t actually contribute to either commentary\
    \ or documentation:\n\n```\n```php\n/**\n * Gets the number of elements in this\
    \ Bundle.\n *\n * @return number of elements in this Bundle.\n */\npublic function\
    \ Count()\n{\n    return count($this->elements);\n}\n```\n```\n\nBut the thing\
    \ that any comments are supposed to do is document the *intent* of the code. If\
    \ the code itself is well-built, it will do a good job on its own of documenting\
    \ what it *does*. What it won’t document is *why* it was written.\n\n# Naming\
    \ Conventions\n\nVariables and functions with bad names are a rich source of stories\
    \ that range from comedy to horror. In any application of respectable length,\
    \ you will need to have some consistent system for inventing names. Here are a\
    \ few tips.\n\nGeneric counter variables for controlling `for` loops should be\
    \ short and sweet. Unless context provides an obvious choice for the variable,\
    \ then the convention is to use `$i` first. If you then nest another loop, its\
    \ variable is `$j`, followed by `$k` and then `$l`. Typically, if you need to\
    \ nest your loops any deeper, then you may want to *reconsider* what you are doing\
    \ and move all but the outermost block of statements into a function. If loops\
    \ aren’t nested, then they can use the same variable, provided they are properly\
    \ initialized. If you’re using a `foreach()` loop to iterate over an array, using\
    \ a plural name for the array and the corresponding singular for the element will\
    \ make the relationship between the two variables obvious: `foreach($children\
    \ as $child)`.\n\nEspecially long variable names should be avoided. The longer\
    \ the variable name, the more opportunity there is for a typo to make a mess.\
    \ No doubt you do all of your PHP development with *error reporting* set to *(at\
    \ least)* `E_ALL`, so that you get a notice whenever you attempt to use a variable\
    \ that hasn’t been initialized. This will trap instances where you *mis*`spelling`\
    \ the name of a variable when you use it, but it won’t help you if you *mis*`spelling`\
    \ the name when *assigning* to the variable. In the previous section, the variable\
    \ name `$found_what_we_wanted` was used, but *mis*`spelled` in one place. The\
    \ mistake would not be picked up as it does not involve the use of an uninitialized\
    \ variable, and only later—when you realize something is wrong and that `$i` always\
    \ has the value 100—would you discover the mistake."
