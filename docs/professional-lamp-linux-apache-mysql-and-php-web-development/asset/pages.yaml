  md: "```\n```html\n)\n$shell_script = file('foo.sh');\n$tidied_script = array_map(array('Parser',\
    \ 'strip_comments'), $shell_script);\n```\n```\n\nWithin classes and objects,\
    \ the magic `self` and `this` work within callbacks, and will work just as you\
    \ would expect: `array($this, 'method')` and `array($work, 'method')` will respectively\
    \ be interpreted as referring to `$this->method()` and `self::method()`. The usual\
    \ limitations regarding things like static functions not being allowed to use\
    \ `$this` apply. For example:\n\n```\n```text\n// An object is able to use its\
    \ own methods in array callbacks,\n// both on arguments passed to it and on its\
    \ own properties.\n$tidied_code = array_map(array($this, 'tidy'), $this->code_array);\n\
    \n// Class methods are also accessible as callbacks within the class.\n```\n```\n\
    \nIf you want to check that a given `$variable`'s contents does in fact specify\
    \ a callable function or method at any point, the Boolean function `is_callable($variable)`\
    \ will state this.\n\n# array_map()\n\nYou have just seen one of the simplest\
    \ applications of `array_map()`, but it can go much further.\n\nMost significantly,\
    \ it can operate on several arrays concurrently. Imagine you have two arrays—`$arr1`\
    \ and `$arr2`—and you want to construct an array consisting of `func($arr1[0],\
    \ $arr2[0])`, `func($arr1[1], $arr2[1])`, …, `func($arr1[n], $arr2[n])`. The code\
    \ for doing this as a loop would be something like the following:\n\n```\n```cpp\n\
    $new_array = array();\nfor($i=0, $limit=max(count($arr1), count($arr2)); $i<$limit;\
    \ $i++)\n{\n    $arg1 = isset($arr1[$i]) ? $arr1[$i] : null;\n    $arg2 = isset($arr2[$i])\
    \ ? $arr2[$i] : null;\n    $new_array[$i] = func($arg1, $arg2);\n}\n```\n```\n\
    \nNote the testing required to make sure that the loop doesn't run out of arguments\
    \ for `func()` when the arrays are different lengths.\n\nNow compare it with the\
    \ equivalent code that results from a use of `array_map()`:\n\n```\n```text\n\
    $new_array = array_map('func', $arr1, $arr2);\n```\n```\n\nIf that doesn't work\
    \ you're entitled to log a report with bugs.php.net. And when you come back six\
    \ months later to look at your code, which will it take longer to reacquaint yourself\
    \ with?\n\nAnother trick that `array_map()` can play comes from the fact that\
    \ it is able to take `null` as its callback. Its behavior in this situation can\
    \ be described as \"take a bunch of arrays of things and return an array of bunches\
    \ of things.\" The 0th elements of each array are combined into a single array\
    \ that becomes the 0th element of the result array; the first elements of each\
    \ array are combined into a single array that becomes the first element of the\
    \ result array; and so on. In other words, if you picture its array arguments\
    \ as being the columns of a matrix, `array_map(null, ...)` returns the transposed\
    \ matrix. It is effectively"
