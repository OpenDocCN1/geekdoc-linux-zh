    # ## Oter Changes to PHP5


    Besides the laundry list of OOP changes and the multitude of new functions available,
    there are also other improvements that have been made in the release of PHP5.


    # ### Configuration Changes


    In PHP5 there are numerous changes to the php.ini configuration file. These are
    discussed in greater detail in Chapter 5, but here is a list for your reference:


    +   - mail.force_extra_parameters

    +   - register_long_arrays

    +   - session.hash_function

    +   - session.hash_bits_per_character

    +   - zend.zel_compatibility_mode


    With these new directives, you can exert a little more control over your PHP environment,
    which gives you a little more freedom in coding.


    # ### MySQLi


    MySQLi, as you well know, fits well with PHP in delivering database-driven dynamic
    websites. Thus, it is the release of the MySQLi (MySQL improved) extension that
    makes life easier for everyone.


    # ### Configuration Settings


    There are several new MySQLi configuration settings available in php.ini. Here’s
    a brief description:


    +   - mysqli.max_links: Sets the maximum number of MySQL connections per process.

    +   - mysqli.default_port: Sets the default TCP/IP port to connect to the MySQL
    server.

    +   - mysqli.default_socket: Sets the default socket name for connecting to the
    MySQL server.

    +   - mysqli.default_host: Sets the default hostname for connecting to the MySQL
    server.

    +   - mysqli.default_user: Sets the default username for connecting to the MySQL
    server.

    +   - mysqli.default_pw: Sets the default password for connecting to the MySQL
    server.'
