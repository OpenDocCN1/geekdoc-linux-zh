    \ TLC.\n    NULL: 0\n    1: 0\n```\n\nThe first thing you'll notice is that it\
    \ looks a little different than your previous results. This is because of the\
    \ `\\G` terminator at the end of the query, which causes MySQL to display results\
    \ vertically (otherwise, the tables would be far too wide for this book). Aside\
    \ from that, every bit of information is present and accounted for. The `NULL`\
    \ value specified for the missing “certified” column in the New_Vehicles table\
    \ is present, as well as the placeholder value you specified as 1, since all new\
    \ cars have a warranty. You send the changes back to the client, and they are\
    \ pleased (for the time being at least).\n\n# ## Full-Text Searching\n\nThe owners\
    \ of the car lot have been impressed so far with your ability to query exactly\
    \ what they need, give the various listings to help increase the productivity\
    \ of their sales staff—but they still want more. What they'd like now is a way\
    \ to search through the car inventories by keyword. Their search needs aren't\
    \ too complex, but a simple `LIKE` comparison in a `WHERE` clause just isn't going\
    \ to get the job done.\n\nWhat you need just happens to be built into MySQL—full-text\
    \ searching. Full-text search, which is enabled by default in MySQL, allows you\
    \ to perform a natural-language search on any text column you specify. You can't\
    \ just go out and start full-text searching at will in your database, though —\
    \ you have to do some preparation first.\n\n# ## Enabling Full-Text Searching\n\
    \nEnabling full text searching in MySQL involves simply creating an index on a\
    \ column or columns for a table. You can do this one of two ways: when the table\
    \ is created, as part of the `CREATE TABLE` command, or later on in the life of\
    \ the table.\n\n# ### Creating a New Table with Full-Text Search Enabled\n\nThe\
    \ first full-text index you're going to create will be part of a brand new table.\
    \ To specify a full-text index at table-creation time, all you have to do is specify\
    \ a full-text index and the list of indexed columns at the end of the column specifications:\n\
    \n```\nCREATE TABLE tablename (column_specs, FULLTEXT (columns_to_index))\n```"
