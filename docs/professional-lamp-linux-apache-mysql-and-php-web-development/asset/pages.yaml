- pgno: 96
  md: "# ## More Obscure PHP\n\nThe last act of `stream_open()` is to convert the\
    \ assembled GD Lib image into PNG data. This is by the simple expedient of asking\
    \ GD Lib to output the image as a PNG, and using output buffering to capture the\
    \ result.\n\nEach call of `stream_read()` returns another chunk of the PNG data,\
    \ discarding what has already been returned.\n\nSince this is a read-only stream\
    \ consisting of on-the-fly generated data, most of the remaining stream-access\
    \ methods are meaningless. One thing that can be said about the data is how much\
    \ remains available for reading, allowing `stream_tell()` to be defined.\n\nCode\
    \ that uses this class need know nothing about what it’s doing to match `nmgz://`\
    \ requests with responses. For all it cares, `nmgz://648208926677120000500` is\
    \ just another file, one that happens to contain a PNG image of a 1 kilometer-wide\
    \ snapshot of central Auckland.\n\nBut hold on. If it’s just PNG data, and it’s\
    \ just a file, then for all intents and purposes *it is just a PNG file*. Precisely.\
    \ Here is an example of the wrapper being used. With the class in its own `orthophoto_stream.php`\
    \ file, it assumes that latitude and longitude have been converted to northing\
    \ and easting, and that the radius isn’t too large or small.\n\n```\n```\ninclude_once('orthophoto_stream.php');\
    \ // the class has to be declared before\n                                   \
    \    // it can be used, of course.\nfunction display_orthophoto($northing, $seasting,\
    \ $radius)\n{\n  $filename = sprintf('nmgz://%07d%07d', $northing, Seasting, $radius);\n\
    \n  // All the stream-based stuff happens here.\n  $image = imagecreatefrompng($filename);\n\
    \n  // A bit of post-processing to raise this code above triviality.\n  // Draw\
    \ a circle of the specified radius (the image is a square, after\n  // all), and\
    \ place a cross at the centre.\n  // We need to find the image's white value\n\
    \  $white = imagecolorsearch($image, 255, 255, 255);\n  if($white==-1) // Okay,\
    \ it's not already there.\n    $white = imagecolorallocate($image, 255, 255, 255);\n\
    \  // The circle is centered on the image, and is just large enough to\n  // touch\
    \ the sides.\n  $imagesize = imageX($image);\n  $middle = $imagesize>>1;\n  imageellipse($image,\
    \ $middle, $middle, $imagesize, $imagesize, $white);\n  imageline($image, $middle,\
    \ $middle+5, $middle, $middle-5, $white);\n  imageline($image, $middle+5, $middle,\
    \ $middle-5, $middle, $white);\n  imagestring($image, 0, 0, 0, 0,\n          \
    \    'Sourced from Orthophoto R11 Auckland Crown Copyright Reserved.',\n     \
    \         $white);\n  imagepng($image);\n  imagedestroy($image);\n}\n```\n```\n\
    \nNeedless to say, this example has been constructed as a compromise between real-world\
    \ and pedagogical use, and there are plenty of directions in which the `orthophoto_stream`\
    \ class could be improved."
