    Like the other action-processing methods added to WebImage, logo() simply takes\
    \ the parameters provided—logo filename, location x, location y, padding in pixels,\
    \ and resize ratio for the logo—sets the needed properties in ImageLogo, and processes\
    \ the logo application.\n\nInside ImageLogo’s process() function, you can see\
    \ exactly what occurs during the logo application. The process() method starts\
    \ out by creating its own internal WebImage object, which it will use to load\
    \ the logo file, and resize it if needed. After the WebImage is created and loaded,\
    \ the logo image is resized if a ratio is specified:\n\n```\npublic function process($gd_img)\n\
    {\n    if ($this->logoFile)\n    {\n        require_once 'class.WebImage.php';\n\
    \        \n        // Load the logo\n        $logo = new WebImage();\n       \
    \ $logo->load($this->logoFile);\n        \n        // Resize logo if needed\n\
    \        if ($this->ratio and $this->ratio != 1)\n        {\n            $logo->resize($this->ratio);\n\
    \        }\n    }\n}\n```\n\nNext, the placement of the logo is determined. The\
    \ logo can be placed in one of nine locations—any combination of three horizontal\
    \ and three vertical placements. For horizontal, the values l, r, and m can be\
    \ used to specify left placement, right placement, or middle/centered placement.\
    \ The vertical values are similar—t for top, b for bottom, and m for middle/centered:\n\
    \n```\n// Determine logo placement (x)\nswitch ($this->location{'x'})\n{\n   \
    \ case 'l':\n        $logo_x = $this->padding;\n        break;\n    case 'r':\n\
