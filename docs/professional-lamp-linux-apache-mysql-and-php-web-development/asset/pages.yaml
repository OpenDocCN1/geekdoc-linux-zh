- pgno: 322
  md: '# ## Caching Engines


    Another setting to change is the `$JPCACHE_USE_GZIP` value. This enables gzip
    content compression, but unfortunately because of a bug in recent versions of
    JPCache, the output can be corrupted in certain browsers. For safety''s sake,
    set this value to 0:


    ```

    $JPCACHE_USE_GZIP = 0;

    ```


    Also note the setting that controls the location of the file cache, `$JPCACHE_DIR`,
    which by default is `/tmp/jpCache`. You''re going to need to actually create the
    folder listed in the `$JPCACHE_DIR` setting, so execute the following at the command
    prompt:


    ```

    ```bash

    mkdir /tmp/jpCache

    chmod 0777 /tmp/jpCache

    ```

    ```


    Finally, test the cache system using the following PHP script, using an appropriate
    path to where you put the JPCache folder:


    ```

    ```php

    <?php

    require ''/path/to/jpCache.php'';

    echo time();

    phpinfo();

    ?>

    ```

    ```


    Notice the UNIX timestamp at the top of the page. Each time you reload the page,
    it should stay the same—JPCache is serving up the cached version instead of re-processing
    the script each time.


    # ## Configuring JPCache


    In addition to the three configuration options mentioned previously, you have
    fourteen additional configuration variables you can alter to suit your needs.
    The full list of configuration options is as follows:


    | Configuration Option | Default | Description |

    | :--- | :--- | :--- |

    | `$JPCACHE_TYPE` | None—you *must* set this variable before using JPCache. |
    To tell JPCache to use either file-based or database storage for the cache data,
    you use `$JPCACHE_TYPE`. A value of `file` tells JPCache to use on-disk storage,
    whereas a value of `mysql` causes the cache data to be stored in a MySQL database.
    |

    | `$JPCACHE_TIME` | 900 | Defined using numeric values, this variable tells JPCache
    how long, in seconds, to keep a page in the cache. Negative values disable page
    caching entirely, whereas a value of 0 tells JPCache to keep pages cached indefinitely.
    |


    > *Table continued on following page*'
