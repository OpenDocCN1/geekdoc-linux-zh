    \ compression when storing the value, and also give an optional expiration time\
    \ for the new value. This method returns TRUE on success, FALSE on failure.\n\n\
    +   - Memcache::set\n+     bool Memcache::set ( string key, mixed var [, int flag\
    \ [, int expire]] )\n+   \n+     This stores the value var in the memory cache,\
    \ even if there is a preexisting item matching key. Arguments are identical to\
    \ those of add() and replace(). Returns TRUE on success, FALSE on failure.\n\n\
    You can use these methods in a similar manner as the MySQLi methods —you connect\
    \ to the memcached server, process data in and out of the cache, and then disconnect.\
    \ The following simple example stores a Circle object in the memory cache:\n\n\
    ```\n```php\n<?php\n\nclass Circle\n{\n    public $radius;\n    public function\
    \ area()\n    {\n        return pi() * pow($this->radius, 2);\n    }\n}\n\n$memc\
    \ = new Memcache();\n$memc->connect('10.0.0.20', 11211);\n\n$c = new Circle();\n\
    ```\n```"
  merge: -1
  img_proc: true
