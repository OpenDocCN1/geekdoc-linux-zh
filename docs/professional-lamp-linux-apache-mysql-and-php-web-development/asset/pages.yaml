    +   - `array_udiff()`: Determines the differences between two or more arrays by
    using a named function for data comparison.

    +   - `array_udiff_assoc()`: Determines the differences between two or more arrays
    with additional key comparison and by using a named function for data comparison.

    +   - `array_udiff_uassoc()`: Determines the differences between two or more arrays
    with additional key comparison using a named function and by using a named function
    for data comparison.

    +   - `array_intersect()`: Determines the intersection between two or more arrays
    by using a named function for data comparison.

    +   - `array_intersect_assoc()`: Determines the intersection between two or more
    arrays with additional key comparison and by using a named function for data comparison.

    +   - `array_intersect_uassoc()`: Determines the intersection between two or more
    arrays with additional key comparison using a named function and by using a named
    function for data comparison.

    +   - `array_walk_recursive()`: Applies a named function recursively to each element
    of an array.

    +   - `convert_uudecode()`: Decodes a uuencoded string.

