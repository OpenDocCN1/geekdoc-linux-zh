- pgno: 251
  md: '# Chapter 9


    +   Regenerate the page when it’s requested. You can safely delete cached versions
    of the page any time you feel like it. The next time a user requests the page,
    they do so via a script that looks to see if the page exists. If it doesn’t, the
    script generates the page from the database and serves it up, at the same time
    saving it for the next user. If the page does exist, the script has to look at
    the file’s last-modified time, and also examine the database to see when the most
    recent relevant updates occurred (so you’ll need to have a “last updated” field
    somewhere). If the updates are older than the file modification time, the script
    simply uses fpassthru() to throw the cached version at the user; otherwise, it
    again goes through regeneration and output (saving) tasks.


    +   A cron job that regularly regenerates pages whose updates are regularly scheduled
    (such as daily, weekly, or monthly) could be handled in this fashion. Needless
    to say, the pages that are served after the update has been made but before the
    cron job next runs will still contain the older content.


    # Using a 404 Handler as a Trampoline


    This method is effective for archiving pages that will no longer be changing,
    such as older news articles. If they could be stored and requested as static pages,
    then PHP need never be involved with their regeneration again. Even better would
    be if they could be generated (once) only if needed.


    The method works as follows. Suppose a visitor requests an old news article that
    has *not* already been saved as a static page. Apache looks for it, fails to find
    it, and as a result sets about putting together a 404 Not Found response. You
    can configured Apache with a custom 404 handler (using its `ErrorDocument` directive)
    that calls a PHP script. This PHP script parses out the contents of `$SERVER[''REQUEST_URI'']`
    to determine which article was requested. Assuming the request is for a genuine
    article, it generates the page (storing it in its output buffer) and saves it
    in the location it should have been found in originally. It then calls `header(''HTTP/1.1
    200 OK'')`, followed by the buffered contents of the page. This may be carried
    out for several different types of request in sequence. It finishes up (if all
    else fails) by sending a 404 Not Found response and including whatever page content
    is appropriate in that situation.


    Any subsequent request for the same article will see Apache locating the right
    static page in exactly the right place.


    Obviously, you can clear those pages out at any point (when changing the look
    of the site, for example, or moving hosts, or simply freeing up disk space). If
    and when they are requested again, they will simply be regenerated.


    This method may be combined with Apache’s `mod_rewrite` and `mod_alias` modules
    to further decouple the site’s document tree from the server’s filesystem. In
    this case, your script would save the static page in whichever location is indicated
    by `mod_rewrite` after it has finished transforming the URL.


    If’s possible to become more elaborate with this (though with increasing elaboration
    of course comes an increasing risk of confusion later). The file generated by
    the 404 handler could itself be a PHP script — to generate the page requested
    by the user, the handler would either execute the script with something like `fpassthru(''http://www.example.com/oldnews/19980503.php'')`
    or replicate its behavior. PHP won’t be out the loop anymore, but you could do
    it in order to reduce the amount of processing required to serve the same page
    in future (for example, you may need to check the user’s credentials before allowing
    them access to the page).'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# Client-Side Caching


    Remember that most web browsers have a cache. With a little bit of HTTP, you can
    use it—it requires being able to determine either the last time the contents of
    the page changed, or knowing the next time they will change.


    If you know when the page''s contents were last updated, you can add it as a Last-Modified
    header. Any caching proxies between the client''s browser and your server can
    use this header to decide if any cached copy of the page they hold is still current
    (which would be if their cached copy has the same Last-Modified date). Clients
    can also make a HEAD request of a resource and use the Last-Modified header to
    decide whether it''s worthwhile to GET the page itself.


    If you supply an Expires: header, you are saying that any cached copy of the page
    is valid until the specified time. With that in hand, clients and proxies that
    cache the page can later decide whether to go ahead and request the page anyway.


    For all dates in HTTP headers, the format is the one specified in RFC 2822—that
    is, as returned by date(''r'').


    A header that clients may include in their requests is the If-Modified-Since:
    header. This again is an RFC-2822 formatted date, and if one is present, your
    script can (via apache_request_headers()) use this to decide whether to generate
    and send a full response to the client as normal, or tell the client that its
    cached copy is still current by sending a content-free 304 Not Modified response.
    (A 304 response must not contain any content; any headers may still be sent, including
    Last-Modified and Expires.)


    Other cache-control headers exist, and fuller coverage is given the HTTP specification,
    RFC 2616.


    # Your Own Code


    Aside from wrapping your scripts in more cache-control code, what can you do with
    them to speed them up? This is where the questions of “which is faster” start
    to come up. As you’ve seen, you should examine all of these suggestions with an
    empirical eye.


    # Output Buffering


    Output buffering is not just for caching or output post-processing (or clumsy
    “headers already sent” error workarounds) anymore. When Apache sends data out
    to the user, it does so in packets. Each packet has to be wrapped in an envelope
    and addressed so that it gets to its destination. Sending fewer but larger packets
    can be faster than sending many smaller ones. By buffering PHP''s output, you
    can gather up the contents of your page and send it out all at once, instead of
    dribbling it out a few bytes at a time over the course of processing.


    It’s not quite that simple. When you are dribbling bytes out to the user, they
    have a chance of receiving them sooner, and start to see results quicker, even
    if overall the page loads more slowly. They might even find the link they were
    looking for and click through even before the browser has finished receiving the
    document (and if they intend to stay on the document for a while, they will surely
    be doing so for longer than the page takes to load either way). So you should
    at least batch up your buffering. Instead of one huge buffer around your entire
    script, send several “chapters” in sequence; with a chapter ending just before
    a new block of processing begins. Start producing output as soon as feasible.
    Don’t keep users in suspense.'
  merge: -1
  img_proc: true
