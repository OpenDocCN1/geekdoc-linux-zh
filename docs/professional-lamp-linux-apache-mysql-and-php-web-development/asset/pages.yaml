- pgno: 342
  md: '# Content Management Systems


    +   Link Manager: Organizes and displays links.


    +   **Menu Manager**: Manages dynamic menus.


    +   **Module Maker**: Allows you to create your own module.


    +   **Notes**: Sends emails to users of site.


    +   **Web Pages**: Manages static pages on the site.


    +   **Form Generator**: Creates forms.


    +   **Photo Albums**: Organizes and manages the online image gallery.


    +   **Bulletin Board**: Manages forums.


    +   **RSS News Feeds**: Manages feeds.


    +   **Polls**: Manages online surveys and polls.


    +   **Skeleton Module**: A sample mod to use as a template.


    +   **Admin Stats**: Keeps track of what modules and users are most active.


    # Customizing the Default Installation


    As with all the CMS packages, the beauty is in modifying the default installation
    to really fit your needs.


    Adding, deleting, and editing users and their permissions can be done under the
    **Users Administration** portion of the **Admin Control Panel**. Here, you can
    set whether or not users are allowed to sign up, and whether or not they need
    to be approved before they are allowed to participate in things like forums. You
    can also create your own authentication script or use the local database to verify
    users. If a user is given admin status, you can control what modules he or she
    has access to, and what specific functions within that module can be performed.
    For example, a user could create a poll, but not edit, delete, or list a poll.


    Changing the layout of the modules is possible, but not as easy to do as some
    of the other features of phpWeSite. You can change the look of each particular
    module, which is a nice feature.


    HTML header information (meta tags, keywords, and so on) are controlled under
    the **Layout Admin** portion of the **Admin Control Panel**. This is something
    that is a bit unexpected.


    There are currently 21 other themes available at `http://www.sourceforge.net`
    for you to use and download.


    # Strengths and Weaknesses


    The most attractive features of this package are:


    +   There is a tremendous amount of statistical information available to the admins,
    which makes it easier to fine-tune the site.


    +   The ability to create your own authorization script is a nice feature.


    +   An admin can change the look of boxes and modules on an individual basis,
    so not all boxes have to look the same on the same page.'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# Chapter 13


    +   Very detailed user permissions are allowed, making it simple and straightforward
    to see who is allowed to do what.


    +   Default modules are extensive, making a comprehensive site less labor-intensive
    for the developer.


    The only weakness is that currently, the system does not allow breaking of the
    traditional two- or three-column layout.


    phpWebsite is a nice “middle-of-the-road” CMS, balancing a high level of built-in
    functionality with a high degree of user interactivity. If you are looking for
    a package that can support a medium-sized group of contributors, and still foster
    visitor interactivity, then this might be the CMS for you.


    # TikiWiki


    This software is available at http://www.tikiwiki.org, and the current version
    available at the time of this writing is 1.9.0.


    # Installation Notes


    If you are using older versions of PHP (older than 4.3) or MySQL (older than 4.0.1),
    then you will want to pay particular attention to the “Requirements and Setup”
    documentation, which can be found at http://doc.tikiwiki.org/tiki-index.php?page=requirements+and+setup.
    Other points to note are:


    +   The PDF Generation module needs the php-xml package to be installed.


    +   Because of the use of sessions, make sure your php.ini file has the following
    settings:


    ```

    session.save_handler = files

    session.save_path = /tmp (for local installation)

    ```


    You will also need to create the database and user/password prior to installation.
    The installation package can be downloaded from the site, or if you’re installing
    to a remote server, there is a separate link on the Installation page entitled
    InstallWithOnlyFTPAccess which is the right method for you.


    # Default Installation


    There are several features that are activated by default:


    +   Games: Allows users to play games on your site and keeps track of game stats.


    +   Categories: Manages categories with any module can be classified into.


    +   Calendars: Allows users to view calendars with events.


    +   MyTiki: Gives logged-in users their own interface with features such as calendars,
    webmail, menus, and a notepad, and allows admin to turn user features on or off.


    +   Submission: Allows users to submit articles.


    +   AutoLinks: Allows URLs typed in to text to be automatically submitted to the
    links directory.


    +   Search & Full-text Search: Allows users to search your site.


    +   HTML Pages: Manages editable blocks of HTML code to be reused throughout the
    site.'
  merge: -1
  img_proc: true
