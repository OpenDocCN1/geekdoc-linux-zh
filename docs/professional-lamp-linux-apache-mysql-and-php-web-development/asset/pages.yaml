    # ## Other Access Restrictions


    In addition to restricting access by username and password, you can also use PHP
    to check other user parameters. One common variable to check is the source IP
    of the user. By referencing the server variable $_SERVER[''REMOTE_ADDR''], you
    can make sure that only certain ranges of IPs are allowed to view a resource,
    or conversely, you can block specific IPs. If you''re creating a website for a
    corporate intranet, you can restrict access to internal IPs (assuming your network
    uses them). For example, you could decide that only members of the 10.0.1.x network
    can view a special area of your website. Another example would be BBS sites or
    web forums. Often times they have the need to ban a specific user by IP, if the
    person is spamming the boards, for example.


    Another server variable worth checking is the $_SERVER[''HTTP_REFERER''] variable.
    This variable holds the name of the previous page viewed, and can help you eliminate
    a certain class of web attacks. Suppose you create a simple form that saves data
    to a database, emails people, or anything that relies on valid user input. You
    might have even gone to great lengths to perform client-side input validation,
    and specified maximum lengths on your forms. Unfortunately, anything you might
    expect as input from a web client can easily be corrupted using an external form.
    Any site attacker can easily copy your form''s HTML markup, and then modify it
    to suit their needs — whether it be for information-gathering, cross-site scripting,
    SQL injection, or anything really.


    All they need to do is make a copy of the form that can submit improper data to
    your site, host it on their own machine, but have it post to your form, using
    an absolute URL as the method. This kind of attack can be especially harmful when
    hidden form variables are used, and when register_globals is enabled in php.ini.


    By checking the HTTP_REFERER value, you can eliminate a majority of spoofed form
    attacks, as long as you ensure the input is coming from a page actually on your
    website.


