    ```\n\nTo test out the PHP authentication, you could simply attempt to load this\
    \ script in your browser, but it's much better if you include it in any standard\
    \ PHP page you've created. You can use the following code to test out this authorization\
    \ as a simple inclusion:\n\n```\n```php\n<?php\n\nrequire_once 'phpauthbasic.php';\n\
    \necho \"Authentication Successful!\";\n?>\n```\n```\n\nWhen you try to load this\
    \ script in your browser, use the testuser/testpass combination, or whatever you\
    \ originally added to the users table. If the username and password are correct,\
    \ you should see a nice “Authentication Successful!” message; if you click Cancel,\
    \ you’ll get the dreaded “Authorization Required” message.\n\nNow that you’ve\
    \ seen it work, you might think there’s no reason not to use this method. But\
    \ as with many of the choices you’ll make when deciding how to write your applications,\
    \ this method has some drawbacks.\n\nThere are two main requirements that must\
    \ be fulfilled before this authentication method will work. First, safe_mode must\
    \ not be enabled in php.ini. When enabled, safe_mode prevents the creation of\
    \ the PHP_AUTH_USER and PHP_AUTH_PW server variables. If those variables don’t\
    \ exist, the script will keep redisplaying the login prompt until the user clicked\
    \ Cancel, regardless if the credentials used were truly valid. A quick way to\
    \ determine if safe_mode is indeed enabled: the uid of the script is added to\
    \ the end of the realm information in the login prompt.\n\nSecond, this method\
    \ cannot be used in conjunction with Apache’s Basic Authentication system. This\
    \ applies to any Apache-controlled access (htaccess) at the same level of the\
    \ script, or at any parent directories. If both authentication systems are enabled,\
    \ the Apache system takes initial precedence. What will happen is the user can\
    \ log in initially using the credentials valid with the Apache Basic authentication,\
    \ which is followed by the PHP authentication prompt. At this point, however,\
    \ HTTP has effectively cleared the browser’s authentication state with the Apache\
    \ controls — a result of the HTTP 401 response. Because the browser is no longer\
    \ authenticated against Apache, it will re-prompt for the Apache-level credentials,\
    \ and then go back to the PHP credentials, and so on, until the user clicks Cancel\
    \ or Stop in their browser."
