- pgno: 255
  md: '# Chapter 9


    ```

    $p_Delta = &$this->p_consts->Delta;

    $ps = $this->p_consts->s[$i]-1;

    $p_Delta[$i][$k] = $p_Delta[$i][$ps];

    $this->n[$i][$k] = $this->n[$i][$ps];

    ```


    Clearly, this can also make the program easier to read.


    # Ordering if...else if Tests and Switch Cases


    First of all, if you have a sequence of consecutive *if* statements, and only
    one of them can possibly be true at any given time, then you should use *else
    if* for all but the first. Otherwise, after finding the one that matches, PHP
    will continue to go on and test the rest. *You know they’ll all be false, but
    you’re not the one who has to actually do the work.* PHP has to continue testing
    in case the variables being tested changed while the successful statement was
    being processed.


    If you have a sequence of *if...else if* statements, or a *switch* statement,
    put the more common cases toward the top, and move rare situations toward the
    bottom. In addition to giving a clearer picture of what the code is doing to readers
    (by illustrating the typical situation first, and leaving the hairy edge cases
    until later), it means that on average PHP will have to carry out fewer tests
    before it finds one that succeeds.


    Even if your most common cases are satisfied by the final *else* or *default*
    case, provide for them explicitly, and place their tests near the top (*every
    test is examined before PHP gets around to handling such leftovers* ).


    # Using the Right String Functions


    The manual states repeatedly that if you aren’t actually using any of the features
    of regular expression syntax, then PHP’s other string functions are likely to
    be far faster than the regular expression functions. Don’t say *split( " /", $path)*
    when you can say *explode( " /", $path)*.


    # Regex Syntax


    Speaking of regular expressions, careful design can improve their performance
    as well. Entire books could be and have been written on the subject of regular
    expressions and how to write them; for now, just keep in mind that the PCRE functions
    *preg_match()* and the like provide a richer syntax and smarter engine than the
    POSIX functions such as *ereg()*.


    # unset()


    Okay, so PHP will clean up variables as soon as they *go out of scope*; either
    they’re local variables at the end of the function, or *everything else* at the
    end of the script. Generally speaking, this means you don’t have to worry about
    it.


    But if you’ve got a huge structure (an array of thousands of elements, for example)
    that you are not going to use again, and especially if you’ve yet got more large
    data to handle in a moment, then you should *unset()* the thing as soon as you’re
    finished. The big lump of free memory that results in then immediately available
    for other uses. On a busy server, freeing large lumps of memory when possible
    could make the difference between fitting everything in RAM and resorting to virtual
    memory on disk.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# Releasing Resources and the Peril of Persistent Database Connections


    Again, if you’re using a resource such as a MySQL database connection, and you’re
    finished using it but still have a lot more work to do, don’t hog it for yourself
    for the rest of the script’s execution: close it.


    Persistent database connections (such as those created by `mysql_pconnect()`)
    are sometimes suggested as a means of accelerating performance. This is because
    after the connection is established for the first time, the httpd process that
    creates it retains it after the script establishing it has ended, ready for the
    next time it runs a script that wants to use a database connection. Because connecting
    to a database involves a bit of work, it might save a bit of time to connect persistently.
    But faults may develop before the time saved becomes noticeable.


    The problem is that even though a connected httpd process may be between requests,
    it still holds that database connection open until such time as it dies its own
    server-mandated death. Database connections are in limited supply (`mysql_close()`
    has no effect on persistent connections). It may very well happen that if things
    get busy, a script may attempt to connect to a database only to be rebuffed with
    an error message saying that the maximum permissible number of connections have
    already been allocated. If all of those connections were in use, that wouldn’t
    be so bad: you’d just have to beef up your database server a bit. But if the maximum
    is reached because idle httpd processes are sitting on the available connections,
    just in case a request comes along that requires the use of one, then that is
    not good.


    # `ob_gzhandler()`


    If you’re going to be using output buffering to batch your pages’ output, starting
    the buffer with `ob_start(''ob_gzhandler'')` will mean that when you come to collect
    the buffered output, you’ll find it compressed. The callback function is polite
    enough to check the request headings to make sure the browser the output is going
    to is actually capable of reading gzip-compressed data first.


    As an *alternative* to using that callback handler (don’t try and use them together),
    consider setting `zlib.output_compression` in `php.ini` instead. This is, in fact,
    the method recommended by PHP’s developers.


    # Summary


    While reading through the suggestions and guidelines here, you will no doubt have
    noticed that some appear to contradict each other. This is unavoidable: what works
    will depend on circumstances, and different circumstances can require different
    decisions to be made. A site that does a lot of involved manipulations with a
    large database has different requirements than one that is principally a file
    repository.


    Your time as a developer is more valuable than the computer’s time as a web server.
    It simply makes no sense, not financially nor in terms of job satisfaction, to
    waste time on alterations that, at best, deliver only trivial improvements and
    are invisible to your site’s visitors. Instead, invest the time on planning and
    testing. Step back and look at the big picture before looking at single lines.


    Is your hardware up to scratch, or will it put a cap on how much effect a software
    improvement will have? How is your web server configured; is there any tuning
    that could be made there? How much redundant computation is being performed: can
    the results from one place be cached in anticipation of being useful elsewhere?'
  merge: -1
  img_proc: true
