- pgno: 236
  md: 'Disk access is a comparatively slow process. Consider upgrading to a faster
    hard drive with greater throughput. If you are close to filling your current drive,
    then look at getting additional drives instead of moving everything to a bigger
    one. Even if you aren''t close to filling your current drive, getting additional
    drives and distributing content across them may improve access times. The disks''
    read/write heads will be operating simultaneously, and won''t have as far to travel
    as the heads of a single larger drive. Nor will the disks have to spin as far.


    # # Web Server Improvements


    By its very nature, Apache is highly configurable, with many settings that can
    be tweaked to optimize one aspect or another of its behavior. Some reduce the
    amount of memory Apache requires, while others have the aim of reducing the amount
    of work carried out by each process.


    When you start Apache, the first thing it does is start up half-a-dozen (the exact
    figure is, of course, configurable) instances of `httpd`. These are the processes
    that actually handle HTTP requests. All the server itself does is manage these
    children, starting new ones and stopping existing ones as needed. Each instance
    uses up about a megabyte of RAM (it''s hard to be more exact, but this is a reasonable
    heuristic), and sits around waiting for a request. If there are more requests
    being made than there are instances, then new ones will be started up, and if
    things go quiet later, then the excess will be shut down. Occasionally an instance
    of httpd will be shut down even if there is sufficient work available. This allows
    the operating system to reclaim memory that may have leaked from either the httpd
    process itself or any of the modules it was using. And of course it is possible
    for an httpd process to simply crash, in which case that particular request will
    fail; but another instance will be on standby in case the request is tried again.
    This is a key reason why Apache operates in this way: it enables the server to
    keep running even after it has crashed.


    The configuration options that control this are found in or can be added to `httpd.conf`:


    +   - `MaxClients`: This is the maximum number of httpd processes you''re prepared
    to support at any one time, hence the maximum number of client requests being
    handled concurrently. Given the LMB-per-process heuristic, there is little sense
    in setting this higher than the amount of RAM you have. In fact, you''ll run out
    of RAM long before this. They''ll continue to work, but they''ll be relying on
    much slower virtual memory to do it, and there''ll be an awful lot of tiresome
    swapping between the disk and RAM.

    +     You don''t want this setting to be too low, either; if there are more requests
    made than this figure, some will miss out and end up sitting around waiting for
    one of the others to complete. If the delay is too long, the client will give
    up and the request will be reported as a failure.


    +   - `MaxRequestsPerChild`: Once an instance of httpd has served this many requests,
    it will be shut down, regardless of current server load, in case unfixed memory
    leaks exist in the server or installed modules that would cause the instance to
    fail prey to obesity. Since by definition, the operating system cannot realize
    that the size increase is unnecessary, Apache must step in arbitrarily to shut
    a process down. This directive controls how often that happens. Unless you''re
    using an experimental or under-development module that is likely to be buggy,
    you should be able to set this limit to 100,000 without ill effect. Monitor the
    RAM consumption of each httpd process with `top`; if they to seem to be growing
    unchecked, reduce the limit by a factor of 10. Continue to monitor and reduce
    as necessary. Keep an eye on the behavior of the system as a whole, because if
    this figure drops too low, then there will be too much time getting wasted in
    starting and stopping child requests, and it is therefore time for you to try
    and isolate the module causing the problem.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# Chapter 9


    +   StartServers and MinSpareServers: StartServers specifies the number of httpd
    instances that are initialized when you start Apache. A good number for this is
    the number of concurrent requests your site is typically handling. MinSpareServers
    would be this number plus a few more. Because there is work involved in starting
    up a fresh instance, you don’t want the server to be doing so when it’s already
    running flat out handling requests, so it pays to keep some slack handy.


    When a request comes in for a web page, it is frequently followed by additional
    requests from the same client for ancillary resources (stylesheets, inline images,
    and others), and probably subsequent requests for additional pages. It makes sense
    for the connection between client and server to be maintained in the interim to
    avoid the waste of opening and closing a connection only to immediately open a
    new one to the same client a few hundred milliseconds later, and then finding
    an httpd instance ready to accept the request (which more often than not will
    turn out to be the very instance that handled the previous connection and is now
    idle). The modern HTTP 1.1 standard provides this option — known as “Keep_Alive”
    — and modern versions of Apache respect it by default according (as ever) to settings
    in Apache’s configuration files.


    +   KeepAlive: This is On by default, and you generally wouldn’t have much cause
    to turn it off.


    +   MaxKeepAliveRequests: Once a connection is established between the client
    and the server, the httpd instance that is handling it will dedicate itself to
    that client for at most this many requests. This can be set fairly high — around
    100. There aren’t many page requests that are followed by a hundred ancillary
    requests, but it can happen that from the first page they load a user, may quickly
    open half a dozen other pages. Setting this option high won’t cause too much trouble
    since the client typically closes the connection from its end; in cases where
    it doesn’t, the following configuration directive comes into force.


    +   KeepAliveTimeout: If there have been no requests on the current connection
    from the client for this many seconds, the server assumes the client has gone
    away for whatever reason without properly closing the connection. The higher the
    bandwidth between your site and the client, the lower this figure can be. Bandwidth
    is a bottleneck for people on dialup that reduces the rate at which requests can
    be made, and so there may be 30–45 seconds between successive requests. A lower
    bound on this figure would be something like 10–15 seconds.


    For the purposes of logging traffic, Apache can use reverse DNS to look up the
    hostname for the IP the request originates from. It makes it slightly easier to
    read the logs by eye, but that’s about it. Meanwhile, the request is waiting for
    a response from the DNS server, unable to continue until it has received a response.
    You’d be better off just storing the IP itself in the logfile, and leaving the
    lookups to something like Apache’s logresolve utility at a time when you actually
    care.


    +   HostnameLookups. This sets whether to record hostnames (On) or IP addresses
    (Off) in server logs.


    Related to this is whether you use domain names or IPs when allowing or denying
    connections. Again, using allow from .example.com or deny from .example.com in
    your .htaccess file means that a reverse DNS has to be carried out to find out
    what domain name the originating IP belongs to (and then a forward DNS lookup
    to check that the IP really is part of the domain as claimed). Here, too, therefore,
    allowing or denying specific ranges of IP addresses rather than domain names is
    more effective. However, remember that half the point of DNS is that specific
    domain names aren’t permanently tied to specific IP addresses, and that the name
    can be shifted to a different host and a different IP address.'
  merge: -1
  img_proc: true
- pgno: 238
  md: "# Code Efficiency\n\nSpeaking of .htaccess, when Apache is asked to read a\
    \ file, it will check for .htaccess in every directory in the file’s path on the\
    \ filesystem (not its path as described by the URL), up to and including the system\
    \ root. If the path is long, then that’s a lot of lookups, so it helps to keep\
    \ them short. And if (as no doubt you do) you have your entire site stored in\
    \ a single document tree instead of being scattered all about your system, then\
    \ there’s no point in having Apache search any higher than that tree’s root. The\
    \ access.conf file provides the means for you to inform Apache of this. First,\
    \ you state that no .htaccess files are allowed to override settings anywhere\
    \ from the system root directory down, and then you follow that by stating that\
    \ .htaccess files can be honored in your site’s document tree:\n\n```\n```apache\n\
    <Directory />\n    AllowOverride None\n</Directory>\n<Directory /www/site/roott>\n\
    \    AllowOverride All\n</Directory>\n```\n```\n\nIf you are not using .htaccess\
    \ files at all, say so and Apache won’t waste time looking for them:\n\n```\n\
    ```apache\n<Directory /www/siteroot>\n    AllowOverride None\n</Directory>\n```\n\
    ```\n\nOne Apache module that can speed output on its way is mod_gzip. Most browsers\
    \ these days have a gzip library built in, and can uncompressed gzip-compressed\
    \ data as they receive it. Such browsers will include a statement to this effect\
    \ in their request headers. In return, Apache with mod_gzip installed will send\
    \ compressed responses. There is a delay introduced by the compression/decompression\
    \ steps, but for highly compressible documents (English text compresses by about\
    \ 30%, HTML by about 60%), the saving in bandwidth is not to be ignored.\n\nOtherwise,\
    \ remove any and all modules you don’t actually use. If, for example, you don’t\
    \ use .htaccess files, then disable mod_access. The same goes for PHP extensions,\
    \ and any libraries they call on; if you’re not going to be using the SimpleXML\
    \ extension, disable it.\n\n# ## PHP Improvements\n\nOnce you’ve optimized your\
    \ hardware, your database, and Apache, you can concentrate on tuning your actual\
    \ code. The best preparation you can do to help yourself at this point is to select\
    \ and adhere to a consistent coding standard. The less time you spend trying to\
    \ interpret what you have written, the more time you can spend looking at other\
    \ tricks to improve its efficiency.\n\n# ### Coding Standards\n\nThe visitors\
    \ to your site have priority. Your job is to put the effort into getting them\
    \ the information they want as rapidly as possible. On the other hand, your time\
    \ is more valuable —indeed, more *expensive* — than the computer’s.\n\nIf you\
    \ can save yourself five minutes’ work at the expense of an extra millisecond\
    \ of processing time on a page, that is a good investment that would continue\
    \ to pay off even after the page has been processed"
  merge: -1
  img_proc: true
- pgno: 239
  md: '# Chapter 9


    three hundred thousand times. You can put those five minutes into something more
    productive, such as *seeing if there is a way to save twenty milliseconds when
    processing the page. It’s not just a matter of being able to fill a user’s request
    as fast as possible — considering all the opportunities for delay between your
    server and their browser, mere speed may not be that much of a factor. (If you
    have an extremely busy site, but if that’s so then as you’ve seen your bottlenecks
    are probably elsewhere.) It’s a matter of if you can get the existing page to
    run faster, you can start wondering what else the page could do for your site’s
    audience.


    But how can you achieve such a transfer of workload? It’s not enough to put more
    and more onto the computer if it doesn’t relieve you of any work. A crucial way
    to save programming time is to write code in such a way that reading it is as
    hassle-free as possible.


    Now, there are few issues more likely to spark heated debate than things like
    how much to indent by, which bits to indent, where the braces should go, and whether
    `else` should be appear on the same line as adjacent braces, like this : ) `else
    {`. Things can get ugly. And if and when you’ve decided these things, you still
    have to decide things such as naming conventions for variables, functions, objects,
    and classes; whether to declare a method as *protected static* or *static protected*
    (it matters if you ever have to do a search-and-replace); whether you declare
    `global $foo;` use `GLOBALS[''foo'']`; or ban the use of global user variables
    outright; and where to put comments and what to write in them; not to mention
    more substantive issues such as how your code is divided into files.


    > Avoid “code beautifiers” — *programs that take a file of source code and return
    it reformatted according to some set of standards. At least, don’t rely on them.
    Your code should be beautiful to begin with; otherwise, you’re missing the point
    of having the standards. Use them if you have old code or code from elsewhere
    with different standards that you wish to make consistent with your own, or to
    make your code consistent with someone else’s standards. But don’t work by cheerfully
    knocking out a mess because you can just use the beautifier on it afterwards to
    make it pretty.*


    # PEAR Coding Standards


    One way to cut through at least some of the tangle is to adopt an existing style
    guide. While you could adopt a guide developed for a language with a similar syntax
    like C, C++, or Java, the fit may not be ideal. For example, it’s not necessary
    for the way you name variables to be distinctly different from the way you name
    functions; the former are already distinguished by the $. Instead, you could adopt
    a PHP-specific standard, of which the most widespread is that described in Chapter
    4 of the PEAR manual.


    Unless you’re putting together a repository of code submitted by the public, as
    is the case for PEAR itself, following PEAR style to the letter may not be appropriate.
    For example, PEAR style requires that each source file begin with a block of commentary
    that stating such things as authorship and licensing. For a large in-house application
    that won’t be getting distributed, a distribution license is pointless, nor would
    it be necessary to list all of the developers on every file. However, the PEAR
    standard serves as a starting point.


    # Braces and Indentation


    The debate over where braces should go is so long-running and so inconclusive
    that at least one language (Python) has been deliberately designed to avoid them.
    Eric S. Raymond, in the *Jargon File* (version 4.4.7), lists four in the entry
    on “Indent Style,” which are described here along with their names and followed
    by a couple of others.'
  merge: -1
  img_proc: true
- pgno: 240
  md: "# # Code Efficiency\n\nK&R style—as in Kernighan and Ritchie, designers of\
    \ C and authors of the definitive references on the language—is also known as\
    \ the “One True Brace” style:\n\n```\n```\nfor($i=0; $i<100; $i++) (\n    if($foo[$i]==0)\
    \ {\n        //...etc.\n    }\n)\n```\n```\n\nIn Allman or BSD style, much of\
    \ the BSD kernel source code was written by Eric Allman, who used this style for\
    \ the job:\n\n```\n```\nfor($i=0; $i<100; $i++)\n{\n    if($foo[$i]==0)\n    {\n\
    \        //...etc.\n    }\n}\n```\n```\n\nWhitesmith's style was named after a\
    \ commercial C compiler that formatted code in this way:\n\n```\n```\nfor($i=0;\
    \ $i<100; $i++)\n{\n    if($foo[$i]==0)\n    {\n        ...etc.\n    }\n}\n```\n\
    ```\n\nGNU style is used (pretty much exclusively) by the Free Software Foundation:\n\
    \n```\n```\nfor($i=0; $i<100; $i++)\n{\n    if($foo[$i]==0)\n    {\n        ...etc.\n\
    \    }\n}\n```\n```\n\nA more compressed version of Allman style is as follows:\n\
    \n```\n```\nfor($i=0; $i<100; $i++)\n{\n    if($foo[$i]==0)\n    {\n        ...etc.\n\
    \    }\n}\n```\n```\n\nAn even more compressed version of Allman style is this:\n\
    \n```\n```\nfor($i=0; $i<100; $i++)\n{\n    if($foo[$i]==0)\n    {\n        ...etc.\n\
    \    }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 241
  md: "# Chapter 9\n\nAll six styles can be varied by choosing whether to use tabs\
    \ or spaces, or how wide each level of indentation should be. Typically, four\
    \ or eight spaces (or eight-space-wide tabs) are the most common, and tabs are\
    \ often frowned upon because different people use tabs of different widths. Any\
    \ mix of spaces and tabs that looks right with one width tab is unlikely to look\
    \ right on another, resulting in so-called \"tab damage,\" with lines of code\
    \ and pieces of lines appearing at all sorts of random-looking indents.\n\nThe\
    \ last style is a hoax: if you're going to align opening and closing parentheses\
    \ in columns, you should at least make sure you align *matching pairs* of opening\
    \ and closing parentheses, otherwise the alignment is simply misleading. If saving\
    \ lines is that important, you might as well use LISP style indentation:\n\n```\n\
    for($i=0; $i<100; $i++)\n  {if($foo[$i]==0)\n  {…etc.}}\n```\n\nPEAR specifies\
    \ K&R-style indentation, with four spaces per indent and no tab characters. The\
    \ reason for ruling out tab characters is of course due to the effects of tab\
    \ damage; but knowing the causes of tab damage can go a long way toward preventing\
    \ it.\n\nTab damage is caused when you assume that tabs have a certain width.\
    \ The following piece of code has been written using tabs for indenting, in an\
    \ editor that has been set to use four spaces per tab:\n\n```\n/***********************\n\
    *  Big Flashy        *\n*  Box comment         *\n*\n*  Just Because (TM)   *\n\
    **********************/\nfor($i=0; $i<100; $i++)\n{\n    if ( ($a=$i || $b=$i)\n\
    \        &&\n        ($c!=$i || $d!=$i))\n    {\n        echo \"Either $a or $b\
    \ is equal to $i, \";\n        echo \"and either $c or $d is not.\";\n    }\n\
    }\n```\n\nAnd here is how it would look in an editor that has been configured\
    \ with eight-space tabs:\n\n```\n/***********************\n*  Big Flashy     \
    \   *\n*  Box comment         *\n*\n*  Just Because (TM)   *\n**********************/\n\
    for($i=0; $i<100; $i++)\n{\n        if ( ($a=$i || $b=$i\n        &&\n       \
    \ ($c!=$i || $d!=$i)))\n```"
  merge: -1
  img_proc: true
- pgno: 242
  md: "# Code Efficiency\n\n```\n```\n{\n\techo \"Either $a or $b is equal to $i,\
    \ \",\n\t} and either $c or $d is not.\")\n}\n```\n```\n\nThe first thing you\
    \ can see is that Big Flashy Box comments are generally more trouble than they're\
    \ worth. They're often the biggest victims of tab damage, which is ironic because\
    \ they're supposed to be the bits that are specifically for *human* consumption,\
    \ while the machine doesn't care about niceties of formatting.\n\nIf you do want\
    \ to use tabs for indentation, then the rule of thumb is that they should only\
    \ be used for *indenting*, and spaces should be used for any additional alignment\
    \ tasks. In the previous example, the extra tabs used to align the second and\
    \ third lines of the `if` test with the first line—which worked fine with four-space\
    \ tabs—have caused them to be pushed too far to the right when they became eight-space\
    \ tabs. Instead of a third tab,*four spaces* should have been used,*after* the\
    \ tabs, to match the four characters `\"if (\"`.\n\nGenerally, the only tabs in\
    \ source code should be at the start of lines; they shouldn't follow any other\
    \ characters. The two exceptions to this would be if a literal tab character really\
    \ was required, or if you were using the “compressed Allman” style, in which case,\
    \ a single tab would be used to separate a `{` from the following statement.\n\
    \nYou may have noticed that all of the styles described—hoaxes aside—have the\
    \ closing braces on lines by themselves. The effect this has on code listings\
    \ is to introduce a visible gap between the end of the statement block and the\
    \ following code, analogous in some ways to paragraph breaks in English text.\
    \ You could take the position, therefore, that K&R or compressed Allman is “better”\
    \ than Allman, in that it doesn't separate the statement block from the construct\
    \ (`for`, `if`, `switch`, and so on) that introduces it. According to Raymond,\
    \ the principal claim in defense of K&R is that it is more economical with vertical\
    \ space, allowing more code to fit on the screen at once. Obviously, though, compressed\
    \ Allman shares both virtues while still allowing matching braces to be aligned.\n\
    \n# Reducing Nesting Levels\n\nIf the number of nested braces gets too large,\
    \ it can become confusing identifying which opening brace has a given closing\
    \ brace is paired with. Most IDEs and some of the better language-sensitive text\
    \ editors are able to find such pairings without being confused by any braces\
    \ appearing in comments or string literals, but it is still all too likely that\
    \ you'll want to locate them by eyeball (as, for example, when you've missed typing\
    \ one or the other). When reading code you'll often see closing braces followed\
    \ by tiny comments like `\"/\" end for *j\", or \"/\" * if ($i==0) */\"`, in an\
    \ attempt to assist. However, some judicious use of *break* and *continue* statements\
    \ can help to reduce the depth of nesting. By doing so, not only do you reduce\
    \ the tendency of your code to wander off toward the right hand side of the page,\
    \ but you also reduce the number and size of parenthesized blocks, thus reducing\
    \ the number of parentheses and drawing each matched pair closer together for\
    \ quicker eyeball recognition.\n\nFor example, the previous samples of indentation\
    \ style were written so that the body of the `for` loop consists entirely of a\
    \ single `if` statement—if the `if` statement's test fails, then nothing happens\
    \ during that iteration of the loop, and processing continues on to the next iteration.\
    \ When you put it that way, you can see that an equivalent implementation of the\
    \ loop would be as follows:"
