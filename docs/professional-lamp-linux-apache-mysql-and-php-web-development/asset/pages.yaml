- pgno: 249
  md: '# Chapter 9


    For robustness and effectiveness, Zend’s own product is obviously going to be
    hard to beat, but its use requires purchasing the Zend Encoder to generate the
    bytecode. Note also that APC is distributed as a PECL extension.


    When the program is next called for, the bytecode is retrieved and supplied to
    the Zend engine directly, skipping the parsing and compilation stages. All these
    products will check the modification dates of the source file and bytecode file
    to determine if the former has changed since the latter was generated, and re-parse
    and re-compile if necessary. Some, such as Zend Optimizer, can also (as the name
    implies) perform optimizations on the bytecode to improve performance, including
    a number that are impossible to emu- late in PHP itself (as the optimizer is operating
    at a lower level, where a single PHP statement may correspond to several bytecode
    instructions that may be manipulated independently).


    Generally speaking, using a bytecode cache is merely a matter of following its
    installation instructions, with no changes necessary to your PHP program’s source
    code. So this is often one of the simplest, yet significant, software-level performance
    boosters that can be achieved.


    Note that, especially in the case of an optimizing bytecode cache, the changes
    wrought in the speed of various scripts will change in a nonlinear fashion: it
    won’t be merely a matter of every script running 20 percent faster or twice as
    fast. Some will run proportionally faster than others, although the worst that
    can happen is that certain scripts aren’t measurably faster. Consequently, the
    results of profiling a site without the cache installed have no bearing on the
    site’s profile afterwards.


    # Output Pre-Generation


    In contrast to bytecode caches, saving generated output for redisplay later does
    involve changes to the way your site operates. The first thing a given page needs
    to do is determine whether or not it needs to run, or if instead it can use a
    cached copy of its output.


    # PEAR::Cache and PEAR::Cache_Lite


    Naturally, PEAR includes packages that provide caching output for later requests.


    Cache_Lite provides a simple and quick mechanism for storing the output of pages
    or parts of pages as files to be read in as required later. The following example
    uses it to cache a simple string:


    ```

    ```php

    <?php

    require_once ''Cache/Lite.php'';


    $Id = ''42''; // This is used to identify which cache file to use;

    // anything unique that can be remembered from access to

    // access will do; if you''re caching an entire page this way

    // its URL is a natural choice.


    $options = array(

    ''cacheDir'' => ''/cachefiles/'', // Cache_Lite only does file storage:

    // you''ll need to specify an

    // appropriate directory here.


    ''lifetime'' => 3600

    // We''ll force an update every hour.

    );


    $Cache_Lite = new Cache_Lite($options);


    if ($data = $Cache_Lite->get($Id)) {

    ```

    ```'
