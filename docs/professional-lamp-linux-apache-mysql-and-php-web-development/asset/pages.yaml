- pgno: 130
  md: '# ## 5

    # PHP Configuration


    When you work with LAMP technologies, there are very few things that influence
    your coding decisions more than how PHP is configured. The backbone of any PHP
    installation is the configuration file, `php.ini`. The settings found in this
    file can greatly affect how you code your applications, how well the server performs,
    and even how secure it is. This chapter tells you what settings to look for and
    change in order to improve your PHP installation and provides you with a set of
    scripts to automatically prepare your PHP environment and configuration settings
    to your liking.


    # ## Modifying php.ini


    As mentioned previously, the `php.ini` file is your primary tool for configuring
    your PHP installation. This section covers a number of the configuration directives
    that you should set, and several that are new with PHP5.


    # ## Recommended Configuration Directives


    When you configure PHP, there are a number of settings to keep in mind, in order
    to keep your system secure and performing at top speed:


    +   - `register_globals = off`: One of the most common problems with moving older
    PHP code to a newer system is how PHP handles form data and variables. In older
    versions of PHP, form fields were automatically converted into global variables
    that shared the same name with the PHP engine. While some found this convenient,
    it eventually became a security risk because of naming and usage confusion. Since
    PHP 4.2.0, the value for `register_globals` was off by default. You should keep
    this set to *off*, and use the `$_GET`, `$_POST`, and `$_COOKIE` superglobals,
    instead of relying on the automatically created variables.


    When you develop your applications, it is especially imperative to keep `register_globals`
    set to *off*, as you can''t always be sure of the settings of any production servers
    where it might end up.'
  merge: -1
  img_proc: true
- pgno: 131
  md: "# Chapter 5\n\n+   display_errors = off: While not necessary and actually a\
    \ burden in a development environment, it’s a good idea to set display_errors\
    \ to off for any PHP applications on a production or public web server. Turning\
    \ display_errors off prohibits PHP from displaying any parse or runtime errors\
    \ to the user’s web browser. Any error the end-user sees can give insight as to\
    \ the inner workings of the application, which could be helpful information to\
    \ any malicious individuals who wish to attack your site.\n+   \n+   In a development\
    \ or debugging situation, it’s perfectly acceptable to leave display_errors on,\
    \ to help with debugging.\n\n+   log_errors = on: This setting, usually used in\
    \ conjunction with display_errors, tells PHP to log all errors normally seen on\
    \ the screen to a file. You can use that file for later analysis or debugging,\
    \ or use your own choice of tools to regularly and automatically notify the webmaster.\n\
    \n+   error_log = filename or error_log = syslog: The error_log directive tells\
    \ PHP where to send errors when log_errors is enabled. You can either specify\
    \ a filename where PHP will write the errors, or specify syslog, and it will send\
    \ the errors to the system logging daemon.\n\n+   error_reporting = E_ALL: This\
    \ directive simply tells PHP to report all errors, warnings, and notices it encounters.\
    \ By default, PHP shows everything except notices. Showing notices is usually\
    \ a good idea, especially during development, as it can help you track down uninitialized\
    \ variables and other minor code gaps.\n\n+   magic_quotes_gpc = off: The magic_quotes_gpc\
    \ directive tells PHP whether it should automatically escape input/form data when\
    \ a script is loaded. While this setting is intended as a time-saver, it can actually\
    \ cause problems if you decide to switch databases, or use a database that doesn’t\
    \ escape special characters with a backslash. If you think you might one day switch\
    \ database systems, or you currently use a mixed database environment or even\
    \ no database at all, it’s a good idea to set this to off.\n\n+   variables_order\
    \ = “GPCS”: Setting variables_order to GPCS tells PHP not to automatically generate\
    \ the $_ENV array that normally holds environment variables—normally set when\
    \ variables_order is set to EGPCS. This setting is recommended for performance\
    \ reasons only, and if you still need to access environment variables, you can\
    \ use the getenv() function.\n\n+   allow_call_time_pass_reference = off: This\
    \ directive might not affect all code, but it can help you keep your code from\
    \ becoming obsolete by a future version of PHP. Setting allow_call_time_pass_reference\
    \ to off prevents you from forcing function arguments to be passed by reference.\
    \ If you try to pass an argument by reference (using the & prefix) when it is\
    \ set off, a warning will be generated. While not currently a critical issue for\
    \ production servers, it’s a good setting to use when developing your applications,\
    \ to ensure they will be compatible with future versions of PHP.\n\n+   asp_tags\
    \ = off: Although this is normally not an issue on most setups, using ASP-style\
    \ tags ({$%}) instead of the standard PHP tags ({<php ?>}) can eventually become\
    \ a problem if you move an application to a server that has a different setting\
    \ for asp_tags. Although it’s not a critical requirement, performance issue, or\
    \ security problem, it’s a good idea to keep asp_tags set to off during development\
    \ in order to avoid cute compatibility issues later.\n\n+   short_open_tag = off:\
    \ Like setting asp_tags to off, setting short_open_tag to off also helps ensure\
    \ your applications will work universally across different servers, instead of\
    \ being broken by a simple configuration difference."
  merge: -1
  img_proc: true
- pgno: 132
  md: 'Another benefit to using **short_open_tag = off** is that you can use `<?xml
    ?>` statements, like an XML document prolog, in your scripts. If **short_open_tag**
    was set to **on** and you tried to use `<?xml`, it would attempt to parse anything
    within the `< ?` ` ?>` wrappers as PHP, and throw an error.


    +   zlib.output_compression: Setting **zlib.output_compression** to on tells PHP
    to compress the output data using the zlib library, before sending it to the end
    user. This has a similar effect as using **mod_gzip** or **mod_deflate** in Apache:
    the output bytes are reduced, thus improving transfer time over the Internet.


    # ## New to PHP5


    In addition to the greatly improved object model introduced in PHP5, a handful
    of new configuration settings were added. New to PHP5 are the following:


    +   mail.force_extra_parameters

    +   register_long_arrays

    +   session.hash_function

    +   session.hash_bits_per_character

    +   zend.zel_compatibility_mode


    The following sections describe these new directives.


    # **mail.force_extra_parameters**


    This new directive allows you to specify specific values to be passed to **Sendmail**
    when you use the `mail()` function. Normally when using the `mail()` function,
    you can pass a fifth parameter that sends extra command-line arguments to **Sendmail**.
    When this directive is set, any **Sendmail** command-line arguments specified
    in the fifth parameter of `mail()` are automatically overwritten by the value
    set in **mail.force_extra_parameters**.


    *Any value set for **mail.force_extra_parameters** is always used when sending
    mail—even in safe mode, where the *fifth* argument to `mail()` is disabled.*


    # **register_long_arrays**


    Normally when a form is submitted on a website, PHP takes the values in each of
    the form fields, and places them in two large arrays, depending on the method
    of the form (**GET** or **POST**). If the form is submitted using **GET**, an
    array named **$HTTP_GET_VARS** is populated with the form values, each field having
    a corresponding named index in the array, in addition to an identical array named
    **$_GET** that holds the same values. This duplication is primarily for backward-compatibility
    — the superglobals **$_GET** and **$_POST** were not introduced until PHP 4.1.0,
    so many older applications still use the older **$HTTP_\_VARS** arrays.


    If your applications do not use the older-style arrays at all, you should set
    this to **off** for performance reasons.'
  merge: -1
