    \ and you once again have the ability to add and use full-text indexing on that\
    \ table.\n\n# Controlling Access\n\nOne of the most important jobs you’ll have\
    \ as a MySQL database administrator is controlling who can access the system and\
    \ what resources they can access. In most situations, you’ll need only a handful\
    \ of user accounts for each database, and those that you do need to create should\
