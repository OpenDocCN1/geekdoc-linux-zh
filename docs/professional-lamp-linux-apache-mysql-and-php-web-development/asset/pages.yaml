    \ access the `$center` and `$radius` properties, instead of accessing the properties\
    \ directly. Notice what happens when you try to directly access a private member\
    \ at the end—a fatal error occurs.\n\n# ## Constructors and Destructors\n\nIn\
    \ some situations when dealing with classes, you might want to have a way to automatically\
    \ perform actions when the object is created. You might want to initialize object\
    \ parameters or automatically call a class method. Perhaps you want the object\
