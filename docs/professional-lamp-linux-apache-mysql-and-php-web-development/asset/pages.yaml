    # AJAX Libraries


    If this all seems overwhelming, do not fear. Because *AJAX* as a development method
    isn''t exactly new, there are plenty of libraries available that can take care
    of the dirty work. Recently, with renewed interest in *AJAX*, the number of available
    libraries has been increasing dramatically and existing libraries have been maturing
    rapidly.


    # SAJAX


    SAJAX (http://www.modernmethod.com/sajax/) is the Simple AJAX Toolkit, and has
    a server-side implementation in /PHP (among many other languages). Essentially,
    using this library, you can define functions in PHP and call them from the client
    via XMLHTTP request. To enable a given function for remote procedure call requires
    only one *SAJAX* function call: ``sajax_export(''phpFunctionName'');''''.


    Unfortunately, SAJAX does not help when it comes to the necessary DOM manipulations.
    In fact, because *SAJAX* treats the response as text and inserts the response
    directly into the document using the `innerHTML` property of a given element (which
    is often considered inferior to DOM manipulations), DOM manipulations are not
    possible unless you implement your own string parsing algorithm. On the *SAJAX*
    frequently asked questions page (http://www.modernmethod.com/sajax/faq.php#ml),'
