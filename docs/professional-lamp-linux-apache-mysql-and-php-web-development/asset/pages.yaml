  md: "# More Obscure PHP\n\nAnd it’s possible that other types of files are in the\
    \ same directory. This is such a common task that any shell interface provides\
    \ “globbing” — you can list *.png, delete temp_*, and so forth. Prior to PHP 4.3,\
    \ the typical method of achieving the same effect would have used readdir() and,\
    \ based on the examples of that function’s use given in the manual, ended up with\
    \ something that looks like this:\n\n```\n```php\n$flist = array();\nif ($handle\
    \ = opendir('directory'))\n{\n    while (false != ($file = readdir($handle)))\n\
    \    {\n        if (substr($file, -4) == '.txt')\n        {\n            $flist[]\
    \ = $file;\n        }\n    }\n    closedir($handle);\n}\n```\n```\n\nPHP 5 introduces\
    \ scandir(), which encapsulates the whole opendir() / readdir() / loop() / closedir()\
    \ business, leaving the job of filtering the filenames until afterwards, which\
    \ in this example could be handled by preg_grep() like this:\n\n```\n```php\n\
    $flist = preg_grep('/\\.txt$/', scandir('directory'));\n```\n```\n\nBut since\
    \ PHP 4.3, even this is unnecessarily complicated. By using the same shell-like\
    \ globbing syntax, where ? represents ? any single character’ and * represents\
    \ “any string,” you can use the same syntax that you use in the shell to do the\
    \ same filtering of file names. $flist = glob('*.txt', 'directory');\n\nThe glob()\
    \ function has a few optional flags that can be bitwise-ORed together to adjust\
    \ the behavior of the function. For example, if the directory in question had\
    \ a mix of JPEG and PNG files (along with a miscellaneous scattering of other\
    \ types, and of course the inevitable . and . . directories), the GLOB_BRACE flag\
