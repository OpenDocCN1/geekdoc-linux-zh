    \ to make sure it comes from an internal/private IP range.\n\nAnother thing PHP\
    \ can do, to help limit certain kinds of access, is to provide CAPTCHA images\
    \ for use in registration forms. CAPTCHA, which stands for “Completely Automated\
    \ Public Turing Test to Tell Computers and Humans Apart,” is a kind of test where\
    \ typically an image is presented with somewhat mangled text printed in the image.\
    \ The idea is that humans should be able to figure out what the text actually\
    \ says, despite its distorted appearance, whereas a computer cannot. Many free\
    \ email and bulletin board sites use such a technology to keep automated robot\
    \ scripts from registering and abusing the services with spam or the like.\n\n\
    While currently in an alpha stage of development, the Text_CAPTCHA package in\
    \ the PHP Pear repository provides an easy interface to implement CAPTCHA functionality.\
    \ Text_CAPTCHA can be found at http://pear.php.net/package/Text_CAPTCHA.\n\nIf\
    \ you want to try out Text_CAPTCHA, you can simply install it using the pear install\
    \ command:\n\n```\n```bash\npear install -f Text_CAPTCHA\n```\n```\n\nYou need\
    \ to use the -f flag to force the installation because Text_CAPTCHA is currently\
