    # Interfaces


    Another new object-oriented feature in PHP5 is the ability to create and use interfaces.
    Interfaces, in a nutshell, are a way to specify what methods a class must explicitly
    implement. This is useful when dealing with many interconnected objects that rely
    on the specific methods of one another.


    By using interfaces, you can specify a specific set of methods for different interchangeable
    classes to share. That way, if you ever need to replace functionality contained
    within a class in your program, all you have to do is make sure the replacement
    class implements the same interface, or group of functions, that the original
    exposed.


    For example, you might have a business class that contains the method calculateInterest().
    At some point you might want to have multiple ways to calculate the interest,
    so you create different classes for each algorithm you wish to use. Assuming all
    the classes implement a consistent interface — one that defines calculateInterest()
    — each of the classes should now be interchangeable in the program.'
