  md: '# What''s New in PHP5?


    Note that you must use quotation marks around your function name within the `set_exception_
    handler()` function; otherwise you will get a notice that you are attempting to
    use an undefined constant.


    # Interfaces


    Interfaces have been added to PHP5, allowing you to bind classes to more than
    one place. They consist of empty functions (which will be defined in implementing
    classes) and any constants you want to apply to the implementing classes. All
    implementing classes of an interface must provide an implementation of each method
    defined in the interface, thereby ensuring that future users of your code know
    what methods to expect.


    Interfaces are discussed in greater detail in Chapter 2.


    # Iterators


    Through the Standard Public Library (SPL) you have access to a whole new set of
    classes and interfaces that allow you to manipulate and utilize iterators. The
    SPL is an extension that is compiled and available by default in PHP, and it is
    basically a library of interfaces and classes for you to use. The next section
    discusses the `Iterator` class itself. You will note that many of the functions
    are similar to the array functions.


    # Main Iterator Interface


    The `Iterator` class is a built-in interface that allows you to loop through anything
    that can be looped with a `foreach()` statement—for example, a directory of files,
    a result from a query, or an array of data. It comes with certain inherent functions:


    +   - `Iterator::current()`: Returns the current element.

    +   - `Iterator::key()`: Returns the current element''s key.

    +   - `Iterator::next()`: Moves the pointer to the next element.

    +   - `Iterator::valid()`: Verifies if there is an element present after calling
    `next()` or `rewind()`.


    By pre-defining the generic `Iterator` functionality, these can all help you use
    iteration to make your code more powerful and more efficient. The most important
    thing about the `Iterator` interface is that it is one of the building blocks
    for the other SPL classes.


    # Other Iterator Classes


    The following sections give a brief description of some of the major classes that
    inherit from the `Iterator` class. More detailed information about any of the
    following classes, and a more comprehensive list can be found at the online SPL
    documentation:

    `http://www.php.net/~helly/php/ext/spl/main.html`.


    # DirectoryIterator


    As the name suggests, `DirectoryIterator` is an `Iterator` class that implements
    `Iterator` and allows you to work with a directory of files. Within this class
    lies a powerful set of functions that can glean information about each file such
    as times and dates of modification, file size, file type, owner of the file, full
    path of the file, and what permissions are associated with the file (just to name
    a few).'
