  md: "# # Chapter 10\n\n```\n```php\nif (file_exists('beachfront.xml')) {\n    $data\
    \ = simplexml_load_file('beachfront.xml');\n\n    foreach($data as $main) {\n\
    \        echo \"<hr>\";\n        foreach ($main as $k => $v) {\n            echo\
    \ $k . \":\" . $v . \"<br />\";\n        }\n    }\n}\n```\n```\n\nBesides simplexml_load_file(),\
    \ there are a host of other functions that go along with the SimpleXML extension.\
    \ simplexml_load_string() loads an XML document as a string. You must first assign\
    \ its contents to a variable; then you may use the simplexml_load_string() function\
    \ to parse the variable's contents into the object for your use. If you would\
    \ like to manipulate your object and then display the contents back out to the\
    \ browser in the form of an XML file, you can use the $objectname->asXML() function.\
    \ The attributes() and children() functions are helpful if you need to see the\
    \ element's attributes or the children of any of the object's nodes. The simplexml_import_dom()\
    \ function is helpful if you want to take a DOM node from a DOM document and turn\
    \ it into a SimpleXMLElement object.\n\nThe xpath() function allows you to search\
    \ through the XML document for a specific string. It uses the W3C's Path to evaluate\
    \ each node in your XML document, and is called “XPath” because the search keywords\
    \ resemble the path to a file, as each element is similarly nested. If you would\
    \ like to read more about XPath, visit the W3C's documentation on the subject\
    \ at http://www.w3.org/TR/xpath.\n\nThis is sufficient if you want to perform\
    \ the very simplest of queries, as in the following example:\n\n```\n```php\n\
    if (file_exists('beachfront.xml')) {\n    $data = simplexml_load_file('beachfront.xml');\n\
    \n    //find and list all the 'locations' in our XML file\n    //*locations* are\
    \ under *descriptions* which are under *rentals*\n    $find = $data->xpath('/rentals/description/location');\n\
    \n    while (list(, $v) = each($find)) {\n        echo $v. \"\\n\";\n    }\n}\n\
    ```\n```\n\nThis script will give you all the values for the node named “location”\
    \ within your XML file. If you want to take your query any further, you will have\
    \ to use another method. Remember this is SimpleXML, not ComplexXML.\n\nSimpleXML\
    \ offers a very quick and straightforward way to access a simple XML document.\
    \ It does not allow for much flexibility, and it only works on the simplest of\
    \ XML files. You will run into problems trying to run these functions on an XML\
    \ file that contains HTML code within its content, for example. Otherwise, this\
    \ is a lot easier to work with than many other XML/PHP interfaces available."
