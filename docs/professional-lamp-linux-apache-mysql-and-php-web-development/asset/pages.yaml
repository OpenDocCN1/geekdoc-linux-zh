  md: "# The static Keyword\n\nDeclaring a member or method as *static* binds it to\
    \ the class under which it resides, and not to any one object or instance of the\
    \ class. Static members and methods can be accessed throughout the script.\n\n\
    There are some important things to note about the use of the *static* keyword.\
    \ First, instead of accessing the variable from within the class with the `$this->varName`\
    \ syntax, you should use `self::$varName`. In the previous example, you accessed\
    \ the `self::$count` member from a different function, but because static members\
    \ are available to anything inside the class, you still used the `self::` syntax.\
    \ Second, when accessing a static member from outside the class, you should use\
    \ the syntax `className::$varName`. Likewise when accessing a static method from\
    \ anywhere inside the class, you should use `self::methodName()`, and when accessing\
    \ it from outside the class, you should use `className::methodName()`.\n\nThe\
    \ use of the *static* keyword is discussed in greater detail in Chapter 2.\n\n\
    # The abstract Keyword\n\nThe abstract keyword is used when you have a high-level\
    \ class that you know will need to be inherited by more specific, lower-level\
    \ classes. For example, you can use the abstract class and method as follows:\n\
    \n```\n```\n<?php\n    abstract class getToday {\n        public $today = getdate();\n\
    \        abstract function showCalendar();\n    }\n    class monthlyCalendear\
    \ extends getToday {\n        function showCalendar() {\n            //show this\
    \ month's calendar\n        }\n    }\n    class dailyCalendear extends getToday\
    \ {\n        function showCalendar() {\n            //show today's daily calendar\n\
    \        }\n    }\n    class yearlyCalendear extends getToday {\n        function\
    \ showCalendar() {\n            //show the calendar for this year\n        }\n\
    \    }\n?>\n```\n```"
