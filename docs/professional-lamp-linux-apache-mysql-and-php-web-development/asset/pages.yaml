- pgno: 107
  md: '# # Chapter 4


    Outer joins and inner joins do not, however, have to live apart from one another.
    Both can be combined in a single query, to yield powerful multi-table joins that
    are lenient on requiring all data to match for all rows. To pull a list of new
    vehicles'' colors, makes, models, and models years, including those that do not
    have models specified, perform a query similar to this:


    ```

    SELECT ma.make_name, mo.model_name, n.color, n.modelyear FROM New_Vehicles n LEFT
    OUTER JOIN Models mo USING (model_id) LEFT OUTER JOIN Makes ma USING (make_id);

    ```


    Running this against the vehicle inventory database returns this:


    | make_name | model_name | color | modelyear |

    | --- | --- | --- | --- |

    | Ford | Explorer | Dark Blue | 2005 |

    | NULL | NULL | Graphite Pearl | 2004 |

    | Toyota | Tacoma | Radiant Red | 2005 |

    | Chevrolet | Corvette | Daytona Sunset Orange Metallic | 2005 |

    | Ford | Explorer | Dark Blue | 2005 |


    Note that in this query, the order in which the tables are joined is important.
    The resulting table from the first join is used as an internal temporary table
    when joined against the third table.


    # # Unions


    Up until now, the queries you''ve been performing on the vehicle inventory database
    have been returning records for only one type of vehicle, either new or used.
    What if you wanted to get a list of all vehicles in the database, regardless of
    previous ownership status? Initially, you might think it''s as easy as adding
    both tables to the query; but that would result in a cross join—not exactly what
    you''re looking for. For this situation, you''ll need to use unions.


    Unions in MySQL are a way to return multiple tables as a single record, without
    combining them. Unions are akin to concatenation in PHP—they simply add the additional
    rows to the tail end of the first table. A generalization of unions in MySQL looks
    like this:


    ```

    (SELECT [column_names] FROM [table1]) UNION (SELECT [column_names] FROM [table2])

    ```


    Simply put, unions are performed by gluing two separate SELECT statements together
    with the word UNION. In the code abstraction, parentheses were placed around each
    of the SELECT statements. While not required, it''s generally a good idea to help
    visually differentiate the two queries.


    Assume you wanted to return a list of all the vehicles in the vehicle inventory,
    regardless whether they are new or used. Use a query similar to the following:


    ```

    (SELECT color, modelyear, model_id FROM New_Vehicles) UNION (SELECT color, modelyear,
    model_id FROM Used_Vehicles);

    ```


    If you run this query in MySQL, you should see the following:'
  merge: -1
  img_proc: true
- pgno: 108
  md: '```

    +-----------------------------+----------+----------+

    | color                       | modelyear | model_id |

    +-----------------------------+----------+----------+

    | Dark Blue                   | 2005     | 1        |

    | Graphite Pearl              | 2004     | NULL     |

    | Radiant Red                 | 2005     | 4        |

    | Daytona Sunset Orange Metallic | 2005  | 5        |

    | Deep Green Pearl            | 2003     | 2        |

    | Reflex Silver               | 2004     | 3        |

    | Red                         | 1993     | 4        |

    +-----------------------------+----------+----------+

    ```


    Notice that the query specifies exactly what columns you want to return from each
    table and the number of columns in the list must match across tables. What would
    happen if you selected a different number of columns for each table? Take a look
    at this query, in which you will select all records from each table (the Used_Vehicle
    table having more columns than the New_Vehicles table):


    ```

    (SELECT * FROM New_Vehicles) UNION (SELECT * FROM Used_Vehicles);

    ```


    Try to run this query against the database, and it will return the following:


    ```

    ERROR 1222 (21000): The used SELECT statements have a different number of columns

    ```


    MySQL quickly returns an error letting you know that your column lists are different
    lengths. Any combination of columns in the list will be valid, as long as there
    is the same number of columns in each list. If there are differently named columns
    in each corresponding location in the column lists, MySQL will use the name of
    the column from the first list when returning rows. Take a look at the following
    query:


    ```

    (SELECT color FROM New_Vehicles) UNION (SELECT modelyear FROM Used_Vehicles);

    ```


    When the database is queried, it will show the following:


    ```

    +-------------------------------+

    | color                         |

    +-------------------------------+

    | Dark Blue                     |

    | Graphite Pearl                |

    | Radiant Red                   |

    | Daytona Sunset Orange Metallic |

    | 2003                          |

    | 2004                          |

    | 1993                          |

    +-------------------------------+

    ```


    As expected, MySQL used the color name for the column, from the first column list.
    This example, however, illustrates one possible future point of confusion. The
    column type for color in the tables was set as a varchar, but the column type
    for modelyear is an int. When performing a union of the two tables, MySQL disregards
    the column type and happily combines the tables. This might not necessarily be
    a problem in most situations, but if you''re enforcing referential integrity outside
    of MySQL (in PHP perhaps), there might be conflicts if the external code is expecting
    a specific type of return data, and MySQL sends a mixed result such as this.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Chapter 4


    A simple list of the colors and model years of all the vehicles is nice, but the
    owner of the car lot expects a little more from you. In addition to returning
    the colors and model years, you need to provide the make and model as well. You
    go to happily add the necessary joins to your new unioned tables, using a query
    that might look like this:


    ```

    SELECT color, modelyear, model_id FROM New_Vehicles) UNION (SELECT color, modelyear,
    model_id FROM Used_Vehicles) LEFT OUTER JOIN Models USING (model_id) LEFT OUTER
    JOIN Makes USING (make_id);

    ```


    It looks good, you think, until you run it against MySQL and get this:


    ```

    ERROR 1064 (42000): You have an error in your SQL syntax; check the manual that
    corresponds to your MySQL server version for the right syntax to use near ‘LEFT
    OUTER JOIN Models USING (model_id) LEFT OUTER JOIN Makes USING (make_id)’ at line
    1

    ```


    What happened? The UNION operation itself is not equivalent to a normal resultset
    from a table, so you can’t simply append the requisite joins to look up the extra
    information. Additionally, you haven’t specified the make_name or model_name anywhere
    to be returned. The solution: you need to add all the joins and extra return columns
    to each SELECT statement that makes up the UNION.


    ```

    (SELECT ma.make_name, mo.model_name, n.color, n.modelyear FROM New_Vehicles n
    LEFT OUTER JOIN Models mo USING (model_id) LEFT OUTER JOIN Makes ma USING (make_id))
    UNION (SELECT ma.make_name, mo.model_name, u.color, u.modelyear FROM Used_Vehicles
    u LEFT OUTER JOIN Models mo USING (model_id) LEFT OUTER JOIN Makes ma USING (make_id));

    ```


    Run this sizeable query in MySQL, and you’ll see this:


    |make_name|model_name|color|modelyear|

    |Ford|Explorer|Dark Blue|2005|

    |NULL|NULL|Graphite Pearl|2004|

    |Toyota|Tacoma|Radiant Red|2005|

    |Chevrolet|Corvette|Daytona Sunset Orange Metallic|2005|

    |Honda|Accord|Deep Green Pearl|2003|

    |Volkswagen|Golf|Reflex Silver|2004|

    |Toyota|Tacoma|Red|1993|


    What you end up with is a nice concise listing of all the vehicles on the lot,
    and their make, model, color and model year. You implement this in your inventory
    application and send it to the dealership for their approval, but you’re not done
    yet. Like many clients, the owner of the dealership is fickle, and has changed
    his mind once again regarding which fields need to be in the list of vehicles.
    This time, you need to return all information in the database, for all vehicles.
    You already know that the New_Vehicles table and Used_Vehicles table have different
    numbers of columns, so how will a UNION suffice? The answer is quite simple, actually.
    All you need to do is specify NULL (or any other value you prefer) for any columns
    that are missing from their corresponding tables, like so:


    ```

    (SELECT ma.make_name, mo.model_name, n.color, n.modelyear, n.price, n.description,
    NULL, 1 FROM New_Vehicles n LEFT OUTER JOIN Models mo USING (model_id) LEFT OUTER
    JOIN Makes ma USING (make_id)) UNION (SELECT ma.make_name, mo.model_name, u.color,
    u.modelyear, u.price, u.description, u.certified, u.warranty FROM Used_Vehicles
    u

    ```'
