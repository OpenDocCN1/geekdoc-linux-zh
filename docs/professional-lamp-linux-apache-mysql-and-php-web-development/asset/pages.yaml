- pgno: 372
  md: '# # B


    # ## Alternative Tools


    Whenever discussions of popular PHP tools spring up, the conversations usually
    center around text editors or coding IDEs. Which has the best language support,
    syntax highlighting, code parsing, and so on? Unfortunately, with all the focus
    on text editors, excellent non-coding tools can sometimes get neglected. Instead
    of rehashing the usual arguments for one editor versus the other, this appendix
    shows you some of the tools you can use in your development cycle—those that don''t
    immediately churn out code, but those that you might find hold a key position
    in the overall development process.


    # ### MySQL Tools


    When you administer a MySQL database, you usually have two main options for administration
    tools: the standard command-line toolset, or a graphical interface. Despite the
    attitudes of many hardened system administrators, there''s absolutely nothing
    wrong with using a graphical tool to get the job done. Although the command-line
    interface offers unlimited control over the database, it just can''t match the
    speed and clarity of a good graphical user interface to help facilitate your administration
    workflow.


    If you''re looking for a good set of GUI-based MySQL administration tools, you
    need look no further than MySQL AB''s own MySQL Administrator and MySQL Query
    Browser.


    # #### MySQL Administrator


    MySQL Administrator is a feature-rich GUI administration tool or maintaining MySQL
    databases. The main interface is shown in Figure B.1.'
  merge: -1
  img_proc: true
- pgno: 373
  md: '# Appendix B


    ![](img/fd2e7361878181c2b12e30301ff3e182_373_0.png)


    Figure B.1


    MySQL Administrator allows you to do the following:


    +   - View real-time server information, including connection information and
    statistics, memory statistics, the value for MySQL internal variables and configuration
    settings, and more.

    +   - View the different server logs: Error log, Slow log, General Log (localhost
    only).

    +   - Control the MySQL process itself (localhost only).

    +   - Perform backup and restore operations, and even schedule periodic backups.

    +   - Administer the server’s user access and privileges.

    +   - Create and edit complete databases, including tables using the built-in
    MySQL Table Editor.


    MySQL Administrator is available for Windows, Linux, and Mac OS X; MySQL Administrator
    is a free download from the MySQL website: http://www.mysql.com/products/administrator/.'
  merge: -1
  img_proc: true
- pgno: 374
  md: '# # MySQL Query Browser


    MySQL Query Browser is a GUI that allows you to test and run various queries against
    the MySQL database. In a sense, it is a beefed-up GUI version of the command-line
    client, as you can see in Figure B.2. You can also use MySQL Query Browser similar
    to a standard spreadsheet program or desktop database application—you can pull
    up rows of data, and edit them directly in the query browser. In addition to just
    typing in and executing queries, and manipulating data, it also includes the MySQL
    Table Editor found in MySQL Administrator, allowing you to visually create and
    edit databases and tables.


    ![](img/fd2e7361878181c2b12e30301ff3e182_374_0.png)


    **Figure B.2**


    Windows, Linux, and Mac OS X versions are available from MySQL at <http://www.mysql.com/products/query-browser/>.


    So you''ve got your applications up and running, and your servers tweaked for
    peak performance. But are your database queries as lean and mean as they can be?
    The only way to know for sure is to use a benchmarking tool.'
  merge: -1
  img_proc: true
- pgno: 375
  md: '# Appendix B


    Most MySQL benchmarking tools perform in roughly the same way: you provide a query
    to run, and it runs said query a large number of times, often using concurrent
    connections. By thoroughly testing and experimenting with some of your “heavier”
    queries (often found in the MySQL slow query log), you can improve the execution
    times and server load at application bottlenecks.


    # MySQL Super Smack


    Originally developed by Sasha Pachev, MySQL Super Smack is a standalone stress-testing
    tool for use with MySQL and PostgreSQL. MySQL Super Smack takes one or more files
    containing queries, and hammers the target database a predefined number of times
    for each query, with a specified number of concurrent connections.


    MySQL Super Smack is available at <http://vegan.net/tony/supersmack/>.


    # MyBench


    MyBench is a Perl-based benchmarking tool created by MySQL guru Jeremy Zawodny.
    Like MySQL Super-Smack, it can be used to send a barrage of connections and queries
    at a target MySQL machine, and give clear results on how well it stood up to the
    attack. Since it is written in Perl, you can easily modify and extend it as you
    wish. The downside is that a large test batch can hog machine resources, so it’s
    best to run this tool on a different machine than the target MySQL server, to
    avoid tainting of the results.


    MyBench is available at Jeremy Zawodny’s site: <http://jeremy.zawodny.com/mysql/mybench/>.


    # Version Control


    You might want to consider some form of version control system in your development
    lifecycle or workflow; if you haven’t already. Version control systems provide
    a way to store historical snapshots of code during development, and allow multiple
    developers to check files in and out of the repository, controlling the evolution
    of the codebase. Two of the most popular open-source version control systems in
    use today are CVS and Subversion.


    CVS and Subversion are each version control systems that support the same basic
    features: historical records of file versions, and multiple developer support
    with check-in/check-out functionality. CVS has been around since 1989, and is
    the perennial favorite among many developers. Subversion is newer to the scene,
    first appearing late 2000, but is quickly gaining devotees because of its feature
    set, which extends beyond the “standard” functionality found in CVS. Features
    such as atomic commits, “safe” file renaming, file and directory copying, and
    WebDAV support are some of the reasons that many developers are going with Subversion
    these days. If you are looking for a robust feature set with good support both
    client- and server-side, Subversion is probably your best bet. If you’re looking
    for stability, track record, and support built-in to many development tools, CVS
    is probably preferable—although more and more development packages are gaining
    Subversion support lately.'
  merge: -1
  img_proc: true
- pgno: 376
  md: 'Whichever you choose, it’s a good idea to get some sort of version control
    in place when you can—it makes multiple-develope r projects easier to manage,
    and can provide a safety net in case newer code actually causes nasty new bugs
    or regression problems.


    CVS is available at `https://www.cvs_home.org/` .


    Subversion is available at `http://subversion.tigris.org/` .


    # ## UML Tools


    If you ever get deep into the realm of system architecting and design, chances
    are you will cross paths with UML at some point. If you’re not familiar with UML,
    simply put, it is a way to model and represent the structure, behavior, architecture,
    and process flow of an application or other system. You can use UML to diagram
    different aspects of a system or application, including the class structure, user
    interaction, object interaction, process flow, and so on, similar to flowcharts
    and other diagrams you might make with Visio, Kivio, or other related tools.


    There are nine diagram types in UML, but from the developer’s point of view, one
    of the most important is the Class diagram. Class diagrams help you plan your
    various classes, and the relationships between those classes.


    If you use UML in your PHP workflow, you have a couple tools at your disposal—some
    popular free tools are ArgoUML and Umbrello.


    # ### ArgoUML


    ArgoUML is a Java-based UML editor created by the Tigris.org community. It supports
    eight of the major UML diagram types, and can help you quickly plan out your objects,
    relationships, and behaviors. One of the main features of ArgoUML, from a PHP
    developer’s point of view, is that it can generate valid PHP5 class skeletons
    from UML class diagrams automatically (as well as C#, Java, C++, and PHP4), as
    shown in Figure B.3.


    You simply create your class diagrams in UML and tell ArgoUML what and where to
    generate the code, saving you the time of typing the structure of the classes,
    and letting you get on to the meat of the code: the implementation. ArgoUML also
    provides machine-generated suggestions regarding your class structures, and features
    an integrated to-do list.


    ArgoUML is available as a desktop Java application, both downloadable and runnable
    from the Internet via JavaWebStart, at `http://argouml.tigris.org/` .'
