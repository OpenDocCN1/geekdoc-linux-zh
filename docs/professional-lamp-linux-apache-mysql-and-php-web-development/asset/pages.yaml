- pgno: 300
  md: "# # The Image Source Trick\n\nJavaScript allows dynamic loading of images using\
    \ the `Image` object. When one creates an image and sets its `src` property, the\
    \ browser sends a request for the image and attempts to package the response in\
    \ the `image` object. Developers have used this to make one-way communication\
    \ with a server by setting the `src` attribute to the URI of a server-side script,\
    \ passing data to the server in the query string. The server-side script might\
    \ then update a data store. Typically, no image is returned in the response, but\
    \ this does not cause problems, as the developer does not use the `Image` object\
    \ for its intended purpose.\n\nThe positives of this technique are:\n\n+   - It\
    \ allows for sending of data to the server without refresh.\n+   - It can read\
    \ properties of the object to determine when request is complete.\n\nHowever,\
    \ it does have some drawbacks:\n\n+   - It cannot receive non-graphical data from\
    \ the server (communication is one-way).\n+   - It cannot detect nor handle HTTP\
    \ errors that may have occurred during the attempted communication.\n\n# # Hidden\
    \ Frames\n\nMany developers found the Image source trick to be inadequate and\
    \ required the ability to receive information from the server in addition to sending\
    \ it. Enter the use of a hidden frame. In this technique, the developer uses a\
    \ frame with no visibility (by setting either the height or width to 0, depending\
    \ on the frameset) as the vehicle. The hidden frame is nothing more than a page\
    \ with the minimal set of HTML elements plus a script element. The script element\
    \ is often simply definitions of arrays and variables, the values of which have\
    \ been written by the server. Thus, the controller frame (the one that is visible)\
    \ can set the location property of this frame to that of a server side script,\
    \ optionally sending data to it via the query string. The browser then issues\
    \ this request. The server-side script processes any passed information in the\
    \ query string and then writes data in valid JavaScript syntax. Look at the following\
    \ code to get the general idea.\n\n```\n<?php\n$username = $_GET['username'];\n\
    ?>\n...\n<script type=\"text/javascript\">\n  top.usernameOK = <?php echo isUsernameAvailable($username);\
    \ ?>;\n  top.usernameAlts =\n    new Array(<?php echo implode(’,', getSimilarNames($username));\
    \ ?>);\n  top.frames[1].readVars();\n</script>\n...\n```\n\n> This code lives\
    \ in the hidden communication frame. In this code example, a Boolean value is\
    \ written to indicate the availability of a username passed to the script via\
    \ the query string. When the browser’s JavaScript engine executes this script,\
    \ it will store the Boolean value in the JavaScript variable named"
  merge: -1
  img_proc: true
- pgno: 301
  md: "# ## Chapter 11\n\n*usernameOK. An array of username alternatives is also being\
    \ written to the output. In PHP, the array is joined to a single comma-separated\
    \ string in order to comply with JavaScript array syntax. (The getSimilarNames\
    \ function would also need to wrap each array value in quotes.)*\n\nWhen the hidden\
    \ frame loads with the JavaScript, it triggers the controller frame, which can\
    \ then access the variable values written by the server-side script as `top.usernameOK`\
    \ and `top.usernameAlts`:\n\n```\n`<script type=\"text/javascript\">\nfunction\
    \ readVars()\n{\n\talert(top.usernameOK);\n\talert(top.usernameAlts);\n}\nself.readVars\
    \ = readVars;\n</script>`\n```\n\n*This code lives in the controller frame. Wrapping\
    \ the code in a function that is called by the hidden communication frame is one\
    \ method of triggering the retrieval of data by the loading of the hidden frame.*\n\
    \nThe upsides to this technique are:\n\n+   - It allows for sending *and receiving*\
    \ of data to the server without full-page refresh.\n+   - It can trigger retrieval\
    \ of data by main application as soon as the data are available.\n+   - It's simple\
    \ to use and debug, as all data the application is using is clearly visible in\
    \ the source of the hidden frame.\n+   - It can receive graphical data, but support\
    \ for JavaScript variables as image sources is only partially supported in browsers\
    \ (IE, for example, likes only XBM image data assigned like this).\n+   - Because\
    \ frame loads add a browser history entry, the user can use the back button. However,\
    \ the behavior of the back button might not be what the user expects.\n\nAnd the\
    \ downsides are:\n\n+   - It introduces usability problems, such as the inability\
    \ to easily bookmark an application state.\n+   - It can partially detect communication\
    \ errors by resubmitting requests after a timeout period.\n+   - The hidden frame’s\
    \ contents could easily be manipulated by the user (this is always a concern,\
    \ but it is somewhat easier for the user to do this with the hidden frame technique).\n\
    +   - Only one request per hidden frame can be dispatched at a given time (which\
    \ is a downside if the response is important).\n\n# ### Hidden IFRAME\n\nSimilar\
    \ to the hidden frame technique is the hidden IFRAME technique. Instead of using\
    \ a hidden frame within a frameset, this method uses an invisible IFRAME element,\
    \ changing its source location to issue requests to and receive responses from\
    \ the server. Google Maps uses this technique to communicate with the server without\
    \ a page refresh."
  merge: -1
  img_proc: true
- pgno: 302
  md: 'The advantages of this technique are:


    +   - It has all the pros of the hidden frame technique.

    +   - You have a bit more control over the behavior of the back button, depending
    on how the source location of the IFRAME is changed.


    And the drawbacks are:


    +   - It suffers from usability problems similar to the hidden frame technique.

    +   - It can partially detect communication errors by resubmitting requests after
    a timeout period.

    +   - Only one request per hidden IFRAME can be dispatched at a given time (a
    drawback if the response is important).

    +   - There are serious browser differences in how one programmatically adds an
    IFRAME element and how one references the document response contained within the
    IFRAME after a source location change.


    # XMLHTTP and XMLHttpRequest


    Even the methods now referred to as “AJAX” are not new. Microsoft’s version of
    the interface, XMLHTTP, has been available as an ActiveX object in various incarnations
    since a preview release of IE 5.0 in late 1998 (the final release of IE 5.0 was
    in March 1999). Companies have been capitalizing on this development model in
    IE-only environments for years. Beginning slightly before the release of version
    1.0 of Mozilla’s browser product, a native object (modeled after Microsoft’s interface
    and named XMLHttpRequest, has been available. Recently, Safari (since version
    1.2), Opera (since version 8), and Konqueror have included compliant interfaces,
    also named XMLHttpRequest.


    In the last few months, the use of XMLHTTP and its variants has increased dramatically.
    The adoption of the technology by Google in their Google Suggest and Google GMail
    product offerings has been primarily responsible for introducing the development
    method to the masses. Additionally, an article by Adaptive Path coining the term
    “AJAX” allowed developers to refer to the collection of technologies with one
    unifying name, which has facilitated communication and awareness of the subject.


    # The Interfaces


    The following are the methods of the XMLHTTP and XMLHttpRequest interfaces that
    are relevant and, for the most part, supported in all browsers:


    +   - abort(): Aborts a request.

    +   - getResponseHeader(key): Returns the value of the HTTP response header named
    key.

    +   - open(method, uri, [async, [username, [password]]]): Sets the HTTP request
    method to method and the request URI to uri. Optionally, it sets the flag indicating
    whether or not to process the request asynchronously to async, and sets a username
    and password to use for authentication, if necessary. The method attribute is
    typically either get or post. Using post is appropriate if you are pushing data
    in the request (see the send() method). In almost all cases, async should be left
    to its default value of true.'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# Chapter 11


    overrideMimeType(type): Forces the interpretation of the response as if the server
    sent the mime type of the named type. This method is not available in IE. This
    can be useful if it is impractical to alter the server to send a given mime type.
    This must be called prior to send(). It can also be used to avoid a Mozilla bug
    that sometimes causes the browser to hang when processing a non-XML response.


    send(requestContent): Sends the HTTP request. The parameter requestContent is
    used for requests with a method of post (see the open() method), and represents
    the request body. If the request is asynchronous, this method returns immediately.
    Early versions of Mozilla had difficulty sending a string as request content.
    requestContent should be null for a get request. For post requests, it must be
    null, a string, or a DOM Document object. If it is the latter, the object is serialized.
    The content of this parameter is included in the request body and is therefore
    accessible to the server.


    setRequestHeader(key, value): Assigns the value of value to the HTTP request header
    named key. This method must be called after calling open() and before calling
    send().


    The open() and send() methods handle the primary functionality of the interface.
    The open() method sets various parameters of the request, such as the HTTP request
    method (get or post) and the request URL. The request URL will typically be the
    relative location of the script on the server to call. You may use a fully qualified
    URI if you would like, but due to security restrictions, the domain of the URI
    must match that of the page containing the JavaScript issuing the request. The
    implication of this is that if you would like to fetch data from third-party data
    sources located on other domains (such as, for instance, weather data feeds),
    you must proxy such requests through a server-side script residing on your server.


    The optional async parameter of the open() method determines the behavior of the
    send() method. If set to true (or left to its default), the send() method will
    issue the HTTP request and immediately return. This means that lines of your JavaScript
    code subsequent to the call to send() will execute regardless of the response
    to the issued request. Instead, response handling is triggered by the firing of
    an event, handled by an event handler. This feature is the first A in AJAX, and
    it allows you to develop applications that behave much like desktop applications.
    The specifics of this event handling are set via properties of the interface:


    onreadystatechange: The function called when the ReadyStateChange event is fired
    (that is, when the readyState property changes). The value of this property should
    be a JavaScript function. Make sure not to reference the function with parentheses,
    or the function will be called and the value of this property will end up being
    the return value of your function rather than the function itself.


    readyState: Read-only. This is an integer representing the current state of the
    request. Possible values of this property range from 0 to 4 and indicate increasing
    progress. A value of 4 indicates that the request has been completed and the response
    is fully processed. Headers and status are available with a readyState of at least
    2.


    responseText: Read-only. This is the response body as text. It is non-null with
    a successful request starting with a readyState of 3. The responseText is fully
    populated at a readyState of 4.


    responseXML: Read-only. This is the response body parsed as text/xml content and
    packaged as a DOM Document object. It is non-null with a successful request at
    a readyState of 4.


    status: Read-only. This is the integer HTTP response status code. 200 indicates
    a successful response. For other possible status codes, including numerous error
    codes, see section 6.1.1 of the HTTP/1.1 RFC (http://www.rfc-editor.org/rfc/rfc2616.txt).'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# AJAX


    With the exception of `responseText` and `responseXML`, these properties are mainly
    involved in determining if and when a response has been received. This is necessary
    because our requests are asynchronous, meaning you cannot rely on the availability
    of the response at any given line of code based on execution order or time. Rather,
    asynchronous communication relies on an event-driven model for processing. The
    `readyState` property contains a value that indicates the progress of the request.
    Every time this value changes, a `readyStateChange` event is fired. If defined,
    the `onreadystatechange` handler is then called to handle the `ReadyStateChange`
    event. Note that for a given request, the `readyStateChange` event will fire at
    least four times. In most cases, you will not be interested in any of these events
    except for the final one, when the `readyState` property changes from 3 (loading)
    to 4 (complete). However, a `readyState` of 4 does **not** mean that the request
    was successful. It indicates only that all operations have been completed. You
    must still check the `status` property to gain insight to the success of the request.
    The server could have encountered an error during the processing of the request,
    for example. If the `status` property has the integer value of 200 (OK), then
    the request was successful and any expected response should be available in `responseXML`
    or `responseText`. If this seems a bit confusing, that''s okay: you''ll be diving
    into some code next and it should all come together.


    # ## Working with the Interfaces


