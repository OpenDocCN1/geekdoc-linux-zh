    ```


    The most straightforward way you could wrap this around an existing script is
    to generate the page and buffer its output. This would mean replacing the “Hello,
    World!” line with the following:


    ```

    ```

    ob_start();

    /*

    ...All of your existing script goes here...

    */

    $data = ob_get_contents();

    ob_clean();

    ```

    ```


    There is nothing to prevent you from using multiple cache files for different
    sections of a single page, or using the same cache file in multiple pages.


    PEAR Cache is more elaborate. Its most prominent difference compared with Cache_Lite
    is that it allows the cache to be implemented in a variety of ways (and you could
    always subclass Cache_Container to create your own). In addition to flat file
    storage, Cache comes with containers using shared memory, the Mowabk Session Handler
    extension, and databases. It also provides for gzip storage of cached data, and
    specialized caches for storing dynamically generated images and the responses
    from http requests.


    In its most straightforward form, using PEAR Cache is effectively the same as
    using Cache_Lite. Once again, you need not cache an entire page; concentrate primarily
    on sections that are slow to generate and rarely change.


    # Personalized CMS


    Content Management Systems sometimes provide caching themselves. If you decide
    to write an application for yourself to make updating your site''s contents easier
    (and why wouldn''t you?), then you may wish to do the same. Broadly speaking,
    there are three opportunities for keeping the content of the pages synchronized
    with the contents of the database.


    +   1. Update the page when the database content is altered. In other words, your
    management application, as well as updating the contents of the database, regenerates
    the page and saves the file in the appropriate location, overwriting any older
    version already there. Be aware that if the file is deleted for any reason, you''ll
    need to explicitly regenerate it—maybe provide yourself the option to "Regenerate
    all (absent) pages" in your management application. The generated pages could
    be PHP scripts or static files.'
