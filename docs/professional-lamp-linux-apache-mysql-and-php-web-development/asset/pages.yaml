    \ are many focused CMSs that can make your life easier and allow you to easily\
    \ enhance your site without having to code from scratch.\n\nSome of the more popular\
    \ Micro CMS packages are:\n\n+   * **Publication/News Management CMS**: FusionNews,\
    \ available at http://www.fusionphp.net\n+   * **Managed Learning Environment\
    \ CMS**: Moodle, available at http://www.moodle.org\n+   * **Transactional CMS**:\
    \ osCommerce or ZenCart, available at http://www.oscommerce.com and http://www.zencart.com,\
    \ respectively\n+   * **Image Galleries**: Coppermine, available at http://coppermine.sourceforge.net\n\
    +   * **Forums**: phpBB, available at http://www.phpBB.com\n+   * **Chat Rooms**:\
    \ phpmychat, available at http://phpmychat.sourceforge.net\n+   * **Polls/Surveys**:\
    \ PrestoPoll, available at http://prestopoll.sourceforge.net\n+   * **Caledar\
    \ Systems**: WebCaledar, available at http://www.k5n.us/webcalendar.php\n\n# ##\
    \ Other Micro CMS Packages\n\n# ## Other Helpful Resources\n\nThere are other\
    \ places you can go to sift through the muck and mire — places that make it their\
    \ business to compare, evaluate, and keep track of the numerous CMSs out there.\
    \ Just a few to get you started include:\n\n+   * **OpenSourceCMS**: http://www.opensourcecms.com.\
    \ This site is designed to give you a “test run” of virtually any PHP/MySQL CMS\
    \ out there, allowing you to see first-hand what features are available on each\
    \ one, how well the admin screen functions, and the depth and breadth of the CMS\
    \ itself. There are a couple of great things about this website: first, you don’t\
    \ have to take the time to install the entire package just to demo the software;\
    \ and second, they only showcase CMSs that are available on a remote server (with\
    \ no root access), as well as on the main server itself. If any CMS doesn’t make\
    \ the list, then they either couldn’t get it installed easily (another nice filter\
    \ for you), or they don’t know about it yet. This site also features reviews by\
    \ other users for a completely unbiased opinion.\n+   \n+   The only drawback\
    \ to using this site is that there are others “playing around” with the software\
    \ at the same time you are, which makes for interesting evaluations and possibly\
    \ unexpected outcomes. Luckily, the servers refresh the demo software every two\
