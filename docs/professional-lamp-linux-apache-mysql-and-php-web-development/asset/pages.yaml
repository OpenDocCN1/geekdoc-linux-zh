- pgno: 61
  md: "# Chapter 2\n\nIn PHP5, an interface is defined using the `interface` keyword,\
    \ and implemented using the `implements` keyword, like the following:\n\n```\n\
    interface TwoDimensionalOperations\n{\n    public calculateArea();\n}\n\nclass\
    \ Circle implements TwoDimensionalOperations\n{\n    public calculateArea();\n\
    \    {\n        // Implementation of calculateArea, specific to this Circle class\n\
    \    }\n}\n```\n\nBy creating the `interface TwoDimensionalOperations`, you can\
    \ then create classes for different shapes — Circle, Square, Triangle, Pentagon,\
    \ etc. — all implementing the interface. This way, you can be assured that by\
    \ implementing `TwoDimensionalOperations`, all of your shape classes will have\
    \ a `calculateArea` method.\n\nWhen using interfaces, it is important to keep\
    \ a couple of things in mind. First, if a class implements an interface but does\
    \ not define the methods from that interface, a fatal error will occur. Second,\
    \ all methods defined in an interface must have public visibility.\n\nWith PHP5,\
    \ a class can both extend a base class and implement an interface at the same\
    \ time:\n\n```\nclass Circle extends Shape implements TwoDimensionalOperations\n\
    {\n    // Circle implementation\n}\n```\n\nIn another neat trick, an interface\
    \ can use the `extends` keyword to inherit from other interfaces:\n\n```\ninterface\
    \ GeometricOperations\n{\n    public getOrigin();\n}\n\ninterface TwoDimensionalOperations\
    \ extends GeometricOperations\n{\n    public calculateArea();\n}\n\nclass Circle\
    \ extends Shape implements TwoDimensionalOperations\n{\n    // Implement the required\
    \ methods\n    public getOrigin()\n    {\n        // Circle->getOrigin() implementation\n\
    \    }\n    public calculateArea()\n```"
