- pgno: 20
  md: '# Introduction


    So what’s all the hubbub surrounding LAMP? What is this “LAMP” and how do I get
    one? These questions will be answered within the pages of this book. In this case,
    LAMP stands for Linux, Apache, MySQL, and PHP, and has proven to be one of the
    fastest growing ways to develop enterprise-level web applications. All these packages
    are open source, so you are basically free to use them as you wish; the only limit
    is your own imagination. In addition, with Open Source technologies you not only
    have the best minds in the industry working together to provide great packages,
    you also have the immense support of the rest of the open source community if
    you come across any troubles. After reading this book, you will have an expanded
    knowledge of LAMP and can put it to work for you as you develop your dynamic websites.
    Because this is currently the only advanced level LAMP book available, and a part
    of Iroox’s Professional Series, you can be assured that the information contained
    within its pages will help make you a better coder and a step ahead of the rest.


    It should be noted that although the term “LAMP” can also include Perl and Python
    in its broader definition, we have chosen to focus on PHP in this book.


    The goal of this book is to take the beginning to intermediate level web developer
    one step further, equipping him or her with a more advanced-level knowledge of
    each of these modules. We give you the tools in this book to allow you to think
    “out of the box” and find new solutions to old problems.


    # Whom Is This Book For?


    This book is for web developers with some experience who want to take their websites
    to the next level. If you’re interested in using Open Source tools to run a dynamic,
    exciting web site, you’ll find what you need here. We assume that anyone reading
    this book has some basic experience in the following areas:


    +   - Web server technology

    +   - OO coding

    +   - Database structure, set up, and interaction (retrieving, modifying, and
    adding data)

    +   - Setting up users and permissions

    +   - Installing new software

    +   - Using the command line


    While it is helpful if you have a current LAMP setup that you are familiar with,
    it is not necessary. As long as you are familiar with installing new software,
    you can easily install Apache, MySQL, and PHP together. There are also software
    packages that complete the installation of the three modules for you in one shot,
    such as XAMPP (available at <http://www.apachefriends.org/en/xampp.html>).


    After reading this book, you will be able to conquer any LAMP obstacle with confidence,
    have some great new ideas for future applications you might wish to write, or
    rework some of your old code with new efficiency and power.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# What’s Covered in the Book


    A variety of topics are covered in this book:


    +   A guide to what’s new in PHP 5.0


    +   In-depth discussion of OOP in PHP


    +   Code efficiency, benchmarking, and improving results


    +   Configuring PHP for optimal performance


    +   Advanced MySQL queries


    +   Apache tips and tricks


    +   Site security, locally and remotely


    +   Using advanced PHP extensions


    +   Common PEAR packages


    +   Ajax and PHP


    +   Obscure PHP commands


    +   CMSs compared and explained


    +   Blogging packages


    +   A guide for transitioning from other programming languages


    +   Caching engines


    # What You Need to Use This Book


    This book is designed to be used with Linux machines, although much of the information
    in this book can be applied to Windows users as well. You will need PHP, MySQL,
    and Apache to do the exercises in this book. All three are Open Source programs,
    so you can download and use them free of charge. You will also need a text editor
    to enter your code. Finally, you’ll need a web browser, such as Internet Explorer,
    Netscape Navigator, Firefox, Safari, or Opera, to view your web pages.


    As any programmer knows, software is constantly being improved and debugged, and
    while we used the latest and greatest versions of our modules at the time of publishing,
    chances are those versions won’t be around for long. It is important for you to
    visit the source websites for PHP, Apache, and MySQL to get the most updated versions
    and recent release notes. When developing websites using applications, we recommend
    that you always use the most recent stable release. Using software versions that
    have not been fully tested can be dangerous to your application and leave bugs
    in your code. The same is true for the new learner—you should be learning on a
    stable release of the application, not on a beta version.


    The most recent stable versions that were in effect at the time of this book’s
    writing were:'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# # Introduction


    +   - **PHP:** Version 5.0.4 (available at http://www.php.net)

    +   - **Apache:** Version 2.0.54 (available at http://www.apache.org)

    +   - **MySQL:** Version 4.1.12 (available at http://www.mysql.com)


    Future editions of this book will address changes and improvements in these programs
    as they become available.


    # # Conventions


    To help you get the most from the text and keep track of what’s happening, we’ve
    used a number of conventions throughout the book.


    > Boxes like this one hold important, not-to-be forgotten information that is
    directly relevant to the surrounding text.


    Tips, hints, tricks, and asides to the current discussion are offset and placed
    in italics like this.


    As for styles in the text:


    +   - We highlight important words when we introduce them.

    +   - We present URLs like so: http://www.mysite.com

    +   - We show code within the text like so: persistence.properties

    +   - We present code in two different ways:


    ```

    In code examples we highlight new and important code with a gray background.

    ```


    The gray highlighting is not used for code that’s less important in the present
    context, or has been shown before.


    # # Source Code


    As you work through the examples in this book, you may choose either to type in
    all the code manually or to use the source code files that accompany the book.
    All of the source code used in this book is available for download at http://www.wrox.com.
    Once at the site, simply locate the book’s title (either by using the Search box
    or by using one of the title lists) and click the Download Code link on the book’s
    detail page to obtain all the source code for the book.


    Because many books have similar titles, you may find it easiest to search by ISBN.
    This book’s ISBN is 0-7645-9723-X.


    Once you download the code, just decompress it with your favorite compression
    tool. Alternately, you can go to the main Wrox code download page at http://www.wrox.com/dynamic/books/download.aspx
    to see the code available for this book and all other Wrox books.'
