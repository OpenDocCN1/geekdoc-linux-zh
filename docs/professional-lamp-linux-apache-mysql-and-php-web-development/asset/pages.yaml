- pgno: 258
  md: '# # 10

    # PHP Extensions


    Although the core of the PHP language provides functions that accomplish many
    commonly needed tasks, there are numerous extensions that can be added to bring
    a PHP configuration to a whole new level. This chapter explores some of the more
    useful extensions, but it only touches on the tip of the iceberg. The extensions
    in this chapter deal with manipulating images, creating PDF files (without the
    use of Adobe Acrobat), creating flash files (without the use of any commercial
    software), and interfacing with XML documents. Some of these extensions are already
    bundled and enabled for you with the default configuration, so what are you waiting
    for?


    # ## PDFLib


    Whether your content is academic or commercial in nature, no professionally developed
    website would be complete without the ability to deliver content as a PDF (Portable
    Document Format). While there are several Open Source libraries available to PHP
    developers, notably FPDF (http://www.fpdf.org/), and pdf-php (http://sourceforge.net/projects/pdf-php),
    PHP’s built-in PDFLib functions are arguably the most efficient means of doing
    so. The PDFlib functions, moved to the PHP Extension Community Library (PECL since
    PHP 4.3.9), are a wrapper for the commercial PDFLib (http://www.pdflib.com/) PDF
    processing library. The advantage offered by PDFLib over the purely PHP-based
    solutions is that of speed. Compiled C code, such as PDFLib, is magnitudes of
    order faster than PHP code interpreted by Apache. The disadvantage is the licensing
    cost for commercial use.


    > *The observant reader will note that this text refers to two distinct capitalizations
    of the subject matter: “PDFLib” and “PDFLib.” This is to differentiate the C library,
    named “PDFLib” by its owners, from the PHP wrapper library “PDFLib.” It is also
    noteworthy that the C library documentation does not rigidly adhere to this convention.*'
  merge: -1
  img_proc: true
- pgno: 259
  md: "# Chapter 10\n\n# Configuration\n\nPHP's support for PDFLib has undergone significant\
    \ changes recently, and like so many other features of the language and its myriad\
    \ libraries, it is expected to undergo further changes, especially in light of\
    \ the growing acceptance of PHP within the professional development community.\n\
    \nThus, configuration is highly susceptible to the usual sticking points of architecture,\
    \ operating system, PHP version, and so on. If your Apache installation is using\
    \ dynamic shared objects (DSO), or dynamic link libraries (DLL) for Windows installations,\
    \ then all that is required is ensuring that the appropriate file exists (libpdf_php.so\
    \ or libpdf_php.dll, respectively), and is referenced properly and uncommented\
    \ in the php.ini file.\n\nIf you are not using DSO, or can't, you will have to\
    \ visit the PDFLib website (http://www.pdflib.com/), acquire the latest version\
    \ of one of the many flavors of the PDFLib source, and build a statically linked\
    \ library. For further details visit http://www.pdflib.com/products/pdflib/info/PDFlib-in-PHP-HowTo.pdf.\n\
    \nRegardless of how you install PDFLib, it is worthwhile to visit the PDFLib website\
    \ and download the latest version of PDFLib Lite. Included with the source is\
    \ a very helpful document, PDFlib-manual.pdf. The manual contains a variety of\
    \ useful information, including bindings for all supported programming languages,\
    \ general PDFLib programming concepts, and much more. Section 3.1.1, “PDFLib Program\
    \ Structure and Function Scopes,” is a must read that will save you hours of frustration\
    \ trying to eliminate “scope” errors.\n\n# Getting Started\n\nThe PDF document\
    \ will be known to PHP as a resource type, and you create it using the pdf_new()\
    \ function, as follows:\n\n```\n```php\n$pdf = pdf_new();\nif (!$pdf_open_file($pdf,\
    \ \"\")) {\n    die(\"Error: Unable to output file\");\n}\n```\n```\n\nNote that\
    \ immediately after the resource is created, a test ensures that the resource\
    \ was created and opened. Attempting to proceed with any page scope functions\
    \ without this check will cause the script to fail, and will generate the following\
    \ PDFLib exception:\n\n> Function must not be called in 'object' scope\n\nIn other\
    \ words, a page scope function has been called in object scope, since the document\
    \ will not have been opened yet. In PHP5, it is sufficient to enclose the pdf_new()\
    \ call within a try/catch block that catches a type PDFLibException exception.\n\
    \nUpon completion of the PDF document, you can call pdf_close() to close the document\
    \ file and release any associated resources."
  merge: -1
  img_proc: true
- pgno: 260
  md: "PHP Extensions\n\n# Specifying Document Information\n\nOne means of searching\
    \ documents is via the metadata contained with the document information. This\
    \ is achieved easily using the `pdf_set_info()` function. Section 8.9.6, \"Document\
    \ Information Fields\" of the PDFLib manual specifies which fields are relevant.\
    \ For example:\n\n```\npdf_set_info($pdf, \"Author\", $name . \" <\" . $row['Email']\
    \ . \">\\\");\n\npdf_set_info($pdf, \"Title\", \"Resume = \" . $name);\n\npdf_set_info($pdf,\
    \ \"Subject\", \"The resume of \" . $name . \", \" .\n\n$row['DesiredPosition']\
    \ . \"\\\");\n```\n\nThis code sets the document's author, title, and subject\
    \ to values pulled from a MySQL database. Note that the `pdf_set_info()` function\
    \ replaces a number of deprecated functions that set fields specifically.\n\n\
    # Required Elements\n\nTo render the most basic page, every PDFlib generated document\
    \ requires the following elements:\n\n+   *   `pdf_new()`: Needed to create a\
    \ new PDF resource.\n+   \n+   *   `pdf_open_file($pdf [, $filename])`: Accepts\
    \ a PDF resource and an optional filename as parameters. The filename is unnecessary\
    \ for buffered output, as in the example at the end of this section.\n+   \n+\
    \   *   `pdf_begin_page($pdf, $width, $height)`: Accepts a PDF resource as well\
    \ as the width and height of the page in points.\n+   \n+   *   `pdf_findfont($pdf,\
    \ $font, $encoding [, $embed])`: Locates a font given a PDF resource, a specific\
    \ font name, and encoding as parameters. Passing a non-zero value as the optional\
    \ fourth parameter will cause the font to be immediately checked, averting subsequent\
    \ errors.\n+   \n+   *   `pdf_setfont($pdf, $font, $size)`: Accepts a PDF resource,\
    \ a font handle (as returned by the `pdf_findfont` function above), and a font\
    \ size.\n+   \n+   *   `pdf_show_xy($pdf, $text, $x, $y)`: Places the passed text\
    \ within the given PDF resource at the given x and y coordinates given in points.\n\
    +   \n+   *   `pdf_stroke($pdf)`: \"Inks\" or draws the text on the passed PDF\
    \ resource.\n+   \n+   *   `pdf_end_page($pdf)`: Finishes the current page of\
    \ the given PDF resource.\n+   \n+   *   `pdf_close($pdf)`: Closes the passed\
    \ PDF resource.\n\nThe resume generator example that winds up this section uses\
    \ each of these functions to return a PDF document to the browser instead of placing\
    \ the file somewhere within the local file structure.\n\n# Helper Functions\n\n\
    Given that certain sections of a typical document adhere to a specific style,\
    \ you may find it useful to create several helper functions to simplify code maintenance\
    \ and style changes. One particularly useful function would draw a horizontal\
    \ line, not a trivial matter when generating a PDF, as follows:\n\n235"
  merge: -1
