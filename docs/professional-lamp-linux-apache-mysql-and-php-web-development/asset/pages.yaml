- pgno: 125
  md: 'To add access permissions, you simply insert a row into the appropriate table,
    specifying Y for each permission column required. To give your newly created user
    database-level SELECT, UPDATE, INSERT, and DELETE permissions on the VehicleInventory
    database, use the following:


    ```

    ```sql

    INSERT INTO mysql.db (Host, Db, User, Select_priv, Insert_priv, Update_priv, Delete_priv)
    VALUES (''localhost'', ''VehicleInventory'', ''testuser6'', ''Y'', ''Y'', ''Y'',
    ''Y'');

    ```

    ```


    If you need to revoke user permissions, you simply perform a DELETE on the required
    tables. To remove the database-level permissions for testuser6, use this query:


    ```

    ```sql

    DELETE FROM mysql.db WHERE Host=''localhost'' AND User=''testuser6'';

    ```

    ```


    Removing a user entirely from the database is only a slight bit more complicated.
    You must first remove all permissions granted to that user, and then you can use
    a DELETE command to remove them from the user table.


    In order for MySQL to be aware of the privileges you''ve just manually changed,
    you must reload the privilege tables:


    ```

    FLUSH PRIVILEGES;

    ```


    If you don''t flush the privileges after making an access change, it won''t be
    reflected in MySQL until the next time it is restarted. This applies to any privilege
    changes you make manually to any access level—using GRANT or REVOKE does not require
    you to reload the privilege tables.


    # Server Restriction


    Another way to restrict server access, at a much larger scale, is to actually
    restrict remote access on the server as a whole. If your database serves only
    users logged into the machine directly, there is little need to have the server
    accept remote network connections. To stop MySQL from listening for incoming network
    connections, make sure the following exists in the [mysqld] section of your MySQL
    configuration file (typically my.cnf):


    ```

    ```ini

    [mysqld]

    skip-networking

    ```

    ```


    Adding that statement to the Configuration file, and then restarting the MySQL
    server process, disables any incoming traffic to MySQL. Such a measure is important
    if your network and server security is important, and when only local accounts
    need access.


    # Analyzing the Database


    While your time using a database will most likely be spent adding, updating, retrieving,
    and deleting data, there will be occasions when you need to immediately find out
    information about the database structure itself. Thankfully, MySQL provides some
    easy-to-use informational tools, as well as simple ways to analyze and optimize
    your databases.'
