  md: "# PHP Configuration\n\nNow it’s time to get your hands dirty and sort through\
    \ a bit of your XML configuration file. In checkExtensions(), the first thing\
    \ you need to do is gather all the extensions listed in the configuration file.\
    \ As mentioned before, each package is listed as a <package /> tag inside a set\
    \ of surrounding <packages></packages> tags. To get a list of all of these packages,\
    \ you use the xpath() method of SimpleXML:\n\n```\n```\npublic function checkExtensions()\n\
    {\n   $returnValue = true;\n\n   // Check for all listed extensions\n   $exts\
    \ = $this->xml->xpath('/packages/package');\n}\n```\n```\n\nThe xpath() method\
    \ takes a string representing the element’s location in the document hierarchy\
    \ (its Xpath path), and returns an array of simplexml_element objects — each representing\
    \ an individual <package /> tag, in this case.\n\nOnce you have your array of\
    \ package tags, you just need to cycle through them, checking for each to see\
    \ if it is available. Since the package name was stored in the name=\" \" attribute\
    \ of each <package /> tag, you can access the values similar to array keys, using\
    \ bracket syntax and a string inside. Once again, you’re using the extension_loaded()\
    \ function to check for each package, and adding an error message to the stack\
    \ if it’s unavailable:\n\n```\n```\nforeach ($exts as $ext)\n{\n   if (!extension_loaded($ext['name']))\n\
    \   {\n      $returnValue = false;\n      $this->message .= \"Warning: \" .\n\
    \                        $ext['name'] .\n                        \"  extension\
    \ not available.\\n\";\n   }\n}\n\nreturn $returnValue;\n```\n```\n\nThe next\
    \ method implemented from ConfigProcessor is checkPHP(). This method checks the\
    \ version of PHP itself to see if the application can run on that version. Starting\
    \ out the method, you first check to see if a PHP version requirement even exists\
    \ in the configuration file, by using the xpath() SimpleXML method once again:\n\
    \n```\n```\npublic function checkPHP()\n{\n   // Check if PHP requirement is present\n\
    \   if (count($phpreq = $this->xml->xpath('environment/php')) == 0)\n   {\n  \
    \    return true;\n   }\n```\n```"
