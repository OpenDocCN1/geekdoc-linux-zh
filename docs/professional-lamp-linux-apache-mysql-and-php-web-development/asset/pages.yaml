- pgno: 202
  md: 'How did `Text_CAPTCHA` know what string you wanted to use? It didn’t. When
    you initialized the CAPTCHA object, you passed in `null` as the test string:


    ```

    // Initialize the CAPTCHA object with random text

    $r = $cap->init(250,100, null, $opts);

    ```


    If you wanted to explicitly set the text string that will be rendered by `Text_CAPTCHA`,
    just change the input string from `null` to the value you desire:


    ```

    // Initialize the CAPTCHA object with random text

    $r = $cap->init(250,100, ''computers be gone!'', $opts);

    ```


    Other key things to check in your PHP scripts are local filenames and how they
    are accessed. Take a look at the following code:


    ```

    <?php


    $content = file_get_contents(''/path/to/content/'' . $_POST[''file'']);


    echo $content;


    ?>

    ```


    This is the kind of code that can often be found on many home-brewed CMS systems,
    or some other kind of custom document-retrieval script. Unfortunately, it’s a
    huge security risk. What would happen if an attacker submitted the value `../../../../../etc/passwd`
    for the file? If the server isn’t locked down properly—and many aren’t—the contents
    of the system password file will get echoed directly to the screen.


    There are a couple easy steps you can take to help prevent this kind of attack.
    First, if you have control over the Apache web server, make sure it is running
    as an unprivileged user. Whatever user Apache runs as—apache, nobody, www, it
    doesn’t matter—make sure that user does not have privilege to access any files
    except bona fide website files.


    Second, make sure you’re escaping any parent directory access periods in the file
    paths provided, like so:


    ```

    <?php

    $File = str_replace(''../'', '''', $_POST[''file'']);

    $Content = file_get_contents(''/path/to/content/'' . $File);


    echo $Content;


    ?>

    ```


    It’s also a good idea, if possible, to prefix your escaped filename with its path.
    That way if an attacker provides an absolute path for the file value, it will
    still behave relative to the specified folder.'
  merge: -1
  img_proc: true
- pgno: 203
  md: "# Chapter 7\n\n# **Website Attacks**\n\nWhenever you publish a site out in\
    \ the public Internet, it runs the risk of being attacked. While no application\
    \ can ever be truly 100% secure, as new exploits and hacking techniques are being\
    \ discovered daily, there are a couple categories of attacks that you can somewhat\
    \ easily defend against in your PHP scripts.\n\n# **Abusing register_globals**\n\
    \nIf it hasn’t been driven into your brain by every article, book, or any bit\
    \ of documentation that talks about register_globals, here it is again: having\
    \ register_globals set to on is a disaster waiting to happen.\n\nIf you’re unfamiliar\
    \ with register_globals, it is a setting in php.ini that controls the auto-population\
    \ of variables with the same name as form elements or cookies. In the login form\
    \ you created earlier in the chapter, there was a field called username. Normally,\
    \ with register_globals disabled, the only way to access the username field from\
    \ the form after it’s posted is to use the $_POST or $_GET array, depending on\
    \ the method of the form. When register_globals is enabled, the username field\
    \ is accessible again using $_POST or $_GET, but is also available as $username.\n\
    \nSince PHP 4.2.0, the default value for register_globals is off, but often web\
    \ hosts will re-enable register_globals to provide compatibility with older scripts\
    \ that assume the existence of, and rely on, register_globals=on. Unfortunately,\
    \ this provides a premium avenue of attack for malicious users. When register_globals\
    \ is enabled, PHP evaluates the environment, form, cookie, and server variables\
    \ in the order specified in the variables_order setting. If the server is using\
    \ the “recommended” settings file, the GET variables are set first, and then POST\
    \ is set and any matching GET values are overwritten. Next the cookie values are\
    \ set, followed by the server variables, overwriting any matching values previously\
    \ set.\n\nWhile this behavior seems convenient, it is easily exploitable using\
    \ a cloned form or spoofed cookie information. For an example of how it might\
    \ be exploited, take a look at the following PHP code:\n\n```\n<?php\nif (user_is_admin())\n\
    {\n    $access_level = 10;\n}\nshow_menu($access_level);\n// ... and so on ...\n\
    ?>\n```\n\nIn this hypothetical situation, the script calls a user_is_admin()\
    \ function to determine if the user is an administrator. If so, the $access_level\
    \ variable is set to 10, and presumably a complete administration would be displayed\
    \ in the script that might follow.\n\nIf register_globals is enabled, it’s a trivial\
    \ matter of requesting the file and appending your desired access level to the\
    \ query string, like this:\n\nhttp://www.example.com/file.php?access_level=10"
  merge: -1
  img_proc: true
- pgno: 204
  md: '# Site Security


    Now, if the script is called with that `access_level` added, it doesn''t matter
    if the user is truly an administrator or not—the `$access_level` variable will
    be set to 10 automatically when the script begins, thanks to `register_globals`
    and PHP not requiring variable initialization.


    Luckily, it''s relatively easy to avoid such pitfalls. Make sure you code with
    `register_globals` disabled, use the proper `$_GET` and `$_POST` superglobals,
    initialize possibly unsafe variables, and make sure `error_reporting` is set to
    `E_ALL` when developing and testing the site.


    If you cannot disable `register_globals` in `php.ini`, you can use an `.htaccess`
    file to turn it off, if properly enabled in Apache:


    ```

    php_flag register_globals off

    ```


    # SQL Injection Attacks


    Another dirty-data attack, but with a far higher potential for damage, is the
    SQL Injection Attack. Used in conjunction with a `register_globals` attack, or
    just using a normal web form, SQL injection attacks are simply the insertion of
    malicious SQL statements in the place of what should normally be innocuous data.


    SQL injection preys on a lack of input scrubbing and data validation—data that
    is blindly used in a PHP-built SQL query. Take the following example that would
    access the WebAuth database you created earlier in the chapter:


    ```

    ```<?php


    $username = $_POST[''username''];


    $conn = mysql_connect(AUTH_DB, AUTH_USER, AUTH_PASS);

    mysql_select_db(AUTH_DB, $conn);


    $sql = "SELECT * FROM Users WHERE username=''" . $username . "''";


    mysql_close($conn);


    ?>```

    ```


    Looks harmless enough, right? You’d expect it to happily take whatever variable
    `username` was sent from the form and look up all columns related to that specific
    username. The problem with this code lies in the SQL query: Notice how the `username`
    variable is not validated, scrubbed, or prepared in any way before sending it
    to the database. Under most circumstances, you might not notice anything wrong,
    and it would rarely if ever throw an error.


    However, things turn nasty quickly, when the following value is entered in the
    `username` field of the sending form:


    ```

    ''; DELETE FROM Users; SELECT ''Ow3rd'' AS username FROM Users WHERE ''1''=''1''

    ```


    Look carefully at what is going on with this value. It begins by terminating the
    part of the query before the `username` variable is appended, deletes all information
    from the `Users` table, and then performs a query of the attacker’s choosing,
    just to close out the query and match up the final apostrophe.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# Chapter 7


    When the “evil” username value is substituted into the original query, the effective
    set of commands would look like this:


    ```

    SELECT * FROM Users WHERE username='''';

    DELETE FROM Users;

    SELECT ''Ow3d'' AS username FROM Users WHERE ''''=''''

    ```


    When the data sent to the SQL server is not escaped as in this example, any number
    of bad things can happen. Imagine the damage if the middle command was a DROP
    DATABASE or GRANT command—not a good situation. This example is a rather simplified
    case of what can happen during a SQL injection attack, but it should give you
    a taste of what kind of damage it can do to your data and system integrity.


    Like many of the common problems plaguing PHP scripts, SQL injection is somewhat
    preventable with a little planning and thorough code auditing practices. If configured
    with `magic_quotes_gpc` set to on, PHP has got your back with regards to escaping
    “dangerous” characters in your form data. When `magic_quotes_gpc` is enabled,
    PHP automatically escapes any escape characters, such as apostrophes, before you
    can even touch them in your script. Unfortunately, this behavior is applied to
    all `GET`, `POST`, and cookie variables, regardless of whether they’re going to
    be used in a SQL statement or not—and most of the time it can be a little annoying.


    To make sure your data is escaped only when you need it to be, turn off `magic_quotes_gpc`
    in `php.ini`, and use `addslashes()` on all data that is being passed to MySQL.
    The `addslashes()` function will automatically escape any dangerous characters
    so your input will not choke MySQL—both on SQL injection attacks, and legitimate
    data with special characters, such as last names with apostrophes.


    As a second line of defense, make sure the user you access the database with in
    PHP has only the minimum amount of privileges needed to keep the application running.
    In the previous SQL injection attack, the deletion of all the user records would
    have actually failed—when the user was set up at the beginning of the chapter,
    only `SELECT` rights were granted.


    A relative to SQL injection attacks, filesystem execution attacks, should be treated
    in a similar manner. Any uncleaned input data that becomes part of a call to `system()`
    or `exec()` should be considered suspect, as they can easily be a handful of malicious
    system commands chained together in a similar way to SQL injection attacks.


    # Cross-Site Scripting


    While SQL injection and `register_global` abuse deal primarily with the usage
    of dirty input data, there is another kind of attack that relies on the uncleanness
    of the dynamic output instead—cross-site scripting.


    Commonly abbreviated XSS, cross-site scripting is the exploiting of unfiltered
    dynamic output, where the attacker has the ability to add or change the page’s
    generated markup. Most commonly, this means the addition of a small bit of JavaScript
    to the output of a page, which then does something sinister, such as trick another
    user into revealing their login credentials or credit card information, or possibly
    divulging cookie or session information for immediate account compromise.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# # Site Security


    To better understand the exact flow of the attack, consider the following scenario:


    +   1. The attacker fills out a comment form on a blog or other website. A malicious
    script is included in the comments.

    +   2. The comments are displayed on the page, with the script intact and active.

    +   3. An innocent user visits the site, and reads the attacker’s comments which
    may or may not contain a clickable link.

    +   4. By either clicking the attacker’s link, or merely visiting the page, the
    user is asked to verify private information, such as a username or password.

    +   5. The user unknowingly submits the private information, believing it was
    requested by the legitimate site they were visiting.

    +   6. The user’s stolen information is instead routed to a different location
    on the Internet, either to be stored for later analysis or the attacker is notified
    with the new information.


    How can this happen? Cross-site scripting is effective when the “trusted” website
    does not properly cleanse special characters before sending them as output or
    markup. In the case of the web, that means the less-than symbol <, greater-than
    symbol >, ampersand &, single and double quotes, and any UTF-8 character that
    is present in the dynamic output.


    Luckily, PHP gives you an assortment of options to choose from when dealing with
    cleaning your dynamic output:


    +   • `htmlspecialchars()`: Escapes any ampersand, less-than, greater-than, single
    quote, and double quote, making it a suitable choice for most dynamically generated
    HTML.

    +   • `htmlentities()`: Similar to htmlspecialchars(), but htmlentities() will
    escape *any* special character that has an HTML entity equivalent, in addition
    to the core five covered by htmlspecialchars().

    +   • `strip_tags()`: Removes all HTML and PHP tags from a string. You can even
    provide a list of allowed tags, so you can whitelist “safe” tags, such as formatting,
    and remove any of the more dangerous tags, such as `<script>`.

    +   • `utf8_decode()`: Converts UTF-8 encoded characters to equivalent ISO-8859-1
    characters.


    # ## Other Considerations


    Aside from issues immediately impacting the code you write or how your server
    is configured, there are a handful of other issues that must be considered during
    the design, development, and maintenance of your application.


    One of the easiest issues to address is that of keeping your system current and
    updated with all the latest patches. If your operating system has an automated
    method for updating core system software, it’s usually a good idea to take advantage
    of it. Many recent web server exploits have actually exploited flaws in older
    versions of the software—virus and worm writers often use vendor-published information
    about recent server patches to write their own malicious code they know will affect
    older versions.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# Chapter 7


    Another group that should also not be overlooked when updating the system are
    the PEAR and PECL packages installed with PHP. Both are easily updated with one
    simple command: `pear upgrade-all`. The key is remembering to run the command
    at regular intervals, or better yet, add it as a cron job.


    When coding your applications, there are a couple of small things you can do to
    help reduce the likelihood of a `register_globals` exploit or SQL injection attack.
    First, make sure you initialize all variables before use; that way there''s no
    chance that a form or querystring variable can sneak in. Second, make sure you
    turn off any error reporting output on the production web servers. By disabling
    the display of error messages, no sensitive information might leak out when an
    error occurs, such as a syntax error in your SQL query, or the hostname or IP
    address of the SQL server.


    A few other things that can help maintain the security of your site are not exactly
    anything you can type or configure. One possible way for a hacker to gain access
    to your site involves a little social engineering and little or no actual computer
    intrusion at all. If you are the administrator of a website, responsible for the
    creation and troubleshooting of user logins, you are in a very serious role that
    can be exploited without proper safeguards. In many situations, all a hacker needs
    to do is call the administrator of a website and pretend to be a user that has
    forgotten his or her password. If the administrator gives out the username or
    password for the hapless user, the hacker instantly has a legitimate login for
    the website, without any network sniffing or brute-force attacking required.


    Another little thing that goes a long way toward the safety of the site is frequent
    code/peer review during the development cycle. By having your coworkers or peers
    examine your code, and vice versa, you can help many obvious security problems
    be brought to light long before the code actually winds up facing the public.


    Last, make sure you keep yourself abreast of the latest security and vulnerability
    news, by frequenting such security-related sites as Secunia (http://secunia.com/),
    CVE (http://www.cve.mitre.org/), and CERT (http://www.cert.org/), among others.


    # Summary


    As you can see, there are a fair amount of things to consider when tackling the
    security of your PHP-driven website. If you keep rigorous data-cleaning practices,
    making sure all your information is valid going in and out of the system, your
    site will ward off most any simple attacker that comes at it.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# # 8


    ## PEAR and PECL


    The underlying concept of open source is, *of course*, using a collaborative effort
    to accomplish great things. The synergy that exists between the countless contributors
    and their efforts pushes open source projects through ever-expanding boundaries.
    However, with this immense and vastly diverse effort come challenges that could
    potentially hinder the success of the movement. These challenges are organization,
    coordination, and direction. Without organization, there would be no standards
    in code writing, or a systematic approach to putting together a package. Without
    coordination, snippets of code would be dispersed throughout the vast Internet,
    most likely lost between poorly written HTML pages, never to be seen by human
    eyes. Without direction, there would be no look to the future, no resource for
    aspiring contributors to get excited about. In short, there would just be a bunch
    of techies writing and rewriting the same snippets of code as everybody else,
    all acting independently in their own little proverbial computing bubbles. Everyone
    knows that no man is an island, however, and that''s where the PEAR and PECL groups
    come in, to provide desperately needed organization, coordination, and direction,
    so developers can all be better coders in the long run.


    By providing developers with ready-made scripts that accomplish common tasks,
    such as connecting to a database or interfacing with an XML document, PEAR and
    PECL packages can save you a lot of coding time and headaches.


    While they both accomplish similar tasks, PEAR and PECL do have fundamental differences,
    which this chapter explains in detail.


    # ## What Is PEAR?


    PEAR (PHP Extension and Repository) is designed to act as a home for wayward useful
    classes. As the name suggests, it is a repository of code packages, which may
    consist of one or more files, and which accomplish common tasks such as creating
    HTML forms, working with dates and images, or connecting to the database and running
    queries. Because these are functions that every coder will undoubtedly use from
    time to time, they make perfect candidates for PEAR packages.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# Chapter 8


    Because there is a strict set of coding standards for developing and releasing
    a PEAR package, a coder can rest assured that the look and feel of one package
    will be consistent with the rest. As you become familiar with using them, you
    will begin to know what to look for and how the code is structured. PEAR packages
    are also known for their extensive commenting requirements and naming conventions,
    something that is sorely lacking in many open source programs, leaving you with
    the daunting task of trying to figure out someone else’s logic.


    All new packages must go through the PEP (PEAR Proposal System) before being included
    in the PEAR distribution list. This four-step process ensures that each package
    is scrutinized for its accuracy, reliability and relevance. If you would like
    to learn more about PEP, you can visit the site http://pear.php.net/pepr.


    # What Is PECL?


    PECL (PHP Extension Community Library) is a spin-off of PEAR, and is primarily
    used to house groups of functions that are no longer bundled with the default
    installation of PHP. As of PHP 5, these extensions can be downloaded and installed
    separately from the regular PHP download. It should be noted, however, that some
    of the extensions currently residing in PECL are now bundled with the default
    installation (such as SQLite), or were extensions submitted by someone outside
    the PHP core team, and were never bundled with PHP (such as POP3).


    Because most PECL extensions used to be a part of the standard list of PHP functions,
    the standard dictates that they are written using PHP’s coding standards (as opposed
    to PEAR’s). While the general public can still submit packages, the process for
    submission includes prior approval by the pecl-dev mailing list.


    # Exploring PEAR


    You should be aware before you delve into the world of PEAR that because it is
    a class-based system, you should be quite familiar with OOP in PHP in order to
    use the packages properly. If you are a hardcore function-based coder, it would
    behoove you to hone those OOP skills through a quick tutorial or a brief review
    of Chapter 2 of this book.


    The first thing you need is the PEAR package itself, which enables you to easily
    install or upgrade new PEAR packages. Thankfully, this manager comes pre-installed
    with PHP (and versions 4.3.0 and up) and will make your life easier when installing,
    managing, and upgrading the other PEAR packages. The main PEAR package also includes
    a set of error-handling functions to enable you to easily detect and manage errors
    encountered with your PEAR package.


    # The PEAR Manager


    The main purpose of the PEAR manager is to assist you in managing and working
    with your other PEAR packages, as stated previously. With it comes a set of commands
    that you can run from the command line (which may or may not require root access).
    This list can be found in its entirety at http://pear.php.net/manual/en/installation.cli.php,
    but the following table highlights the main commands for your reference:'
  merge: -1
  img_proc: true
- pgno: 210
  md: '| Command | What It Does |

    | --- | --- |

    | bundle [package name] | Download and unpack a PEAR extension |

    | download [package name] | Download a package without installing it |

    | download-all | Download every available package |

    | info [package name] | Display information about a package |

    | install [package name] | Download and install a package |

    | list | List installed packages |

    | list-all | List all packages |

    | list-upgrades | List available upgrades for the packages that are already installed
    |

    | uninstall [package name] | Uninstall and delete a package |

    | upgrade [package name] | Upgrade a package |

    | upgrade-all | Upgrade all installed packages |


    To use any of the commands, simply preface the command with pear, like this:


    ```

    pear info XML-RPC

    ```


    As you will see, this will give you information about the PEAR package entitled
    XML-RPC.


    There are also PEAR configuration variables over which you can exert control.
    These primarily relate to directory information and user preferences and more
    times than not the default value is acceptable. You can visit http://pear.php.net/manual/en/installation.cli.php
    for the complete list. However, the following table lists a few of the more common
    ones:


    | Variable Name | What It Represents | Default Value |

    | --- | --- | --- |

    | bin_dir | Directory that houses executables | /usr/bin |

    | ext_dir | Directory that houses loaded extensions | ./ |

    | php_dir | Directory that houses PHP installation | /usr/lib/php |

    | preferred_state | The preferred package state that is to be downloaded (stable,
    beta, alpha, devel, or snapshot) | stable |


    To see what your current settings are, use the config-show (or config-get for
    just one variable’s value) command, like this:


    ```

    pear config-show

    ```'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# Chapter 8


    This shows a description of each configuration variable, the variable name, and
    what the current settings are. To change a setting, use the `config-set` command,
    such as this:


    ```

    pear config-set preferred_state devel

    ```


    The `config-help` command shows you more information about a specific configuration
    variable.


    # Installing Packages


    Several of the other PEAR packages come pre-installed with PHP 5, and you can
    find a complete list by running the following command (from root login):


    ```

    pear list

    ```


    This will give you a list of the installed packages, the version that was installed,
    and the state of the release (stable, beta, and so on). If you would like to install
    other packages, the following sections briefly outline the installation process
    for you.


    # CLI Installation


    If you have root access, you can install any new package simply by typing the
    following command:


    ```

    pear install [package name]

    ```


    This command jumps to the PEAR site, downloads the package you specified (without
    the brackets of course), and installs it on your machine.


    # FTP Installation


    If you don''t have access to the command line, or if your current web host doesn''t
    supply you with the PEAR package that you want, you can also install a package
    by completing two steps:


    +   1. Download the compressed package directly from the PEAR site, unzip it locally,
    and upload the files to your Web site (saving them in the `var/www/www.yourdomain.com/includes`
    directory). You may also upload the compressed file and extract it while it''s
    on the host server (again, to the `var/www/www.yourdomain.com/includes` directory).


    +   2. Alter your `php.ini` file to match the include path you just used.


    ```

    include_path = ".:./www/includes*"

    ```


    You may also include a line in each script that will access the package, like
    this:


    ```

    <?php

    ini_set("include_path", "/var/www/www.yourdomain.com/includes/" . PATH_SEPARATOR
    . ini_get("include_path"));


    //remainder of PHP script here.

    ?>

    ```


    Your package is now installed and ready to use.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# ## Using Installed Packages


    Once the package has been installed, it is very simple to use and access. Simply
    include a line at the beginning of your script that includes the necessary files,
    as follows:


    ```

    ```php

    <?php

    require_once("HTML/QuickForm.php");


    //you are now able to access and reference classes, methods and properties

    //contained in the quickform.php file to easily create HTML forms.

    ?>

    ```

    ```


    # # Quick and Dirty PEAR Packages


    As of this writing, there are currently 318 PEAR packages available in a variety
    of areas, and there are more being added every day. While this book doesn''t discuss
    all of those packages, the following sections explore some of the more common
    ones, and highlight for you the ones you probably want to make sure you have installed.
    Also, keep in mind that these sections keep it simple, but also point you in the
    right direction if you need something a little more robust.


    # ## Auth_HTTP


    The purpose of this package is to provide an authentication system akin to Apache''s
    .htaccess login box. It is a simple and easy way to password-protect an area of
    your site. Please note that this package is dependent on the more robust PEAR::Auth,
    which is also reliant on the PEAR::DB package, thus requiring installation of
    both before the Auth_HTTP package can run properly.


    Simple usage of Auth_HTTP is as follows:


    ```

    ```php

    <?php

    require_once("Auth/HTTP.php");


    $a = new Auth_HTTP("DB", "mysqli://username:password@localhost/databasename");

    $a->start();

    ?>

    ```

    ```


    First you include the file Auth/HTTP.php, which gives you access to the correct
    package. Then you instantiate a new Auth_HTTP object using the parameters as described.
    Because you are actually using the PEAR::DB package to log on to the database,
    you can alter the type of database you are using and name other options such as
    sockets, paths, port numbers, and the like. Although this chapter will be briefly
    discussing this package later, a detailed description of the PEAR::DB package
    can be found at http://pear.php.net/manual/en/package.database.db.php. Next you
    start the authentication process with the call to the start() function, and your
    page is password-protected.


    Granted, this leaves much room for improvement and customization, so you can take
    it one step further and ask the authentication process to look up users from a
