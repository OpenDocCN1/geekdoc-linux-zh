- pgno: 23
  md: '# ## Errata


    We make every effort to ensure that there are no errors in the text or in the
    code. However, no one is perfect, and mistakes do occur. If you find an error
    in one of our books, like a spelling mistake or faulty piece of code, we would
    be very grateful for your feedback. For sending in errata you may save another
    reader hours of frustration and at the same time you will be helping us provide
    even higher quality information.


    To find the errata page for this book, go to `http://www.wrox.com` and locate
    the title using the Search box or one of the title lists. Then, on the book details
    page, click the Book Errata link. On this page you can view all errata that has
    been submitted for this book and posted by Wrox editors. A complete book list
    including links to each book’s errata is also available at `www.wrox.com/misc-pages/booklist.shtml`.


    If you don’t spot “your” error on the Book Errata page, go to `www.wrox.com/`
    contact/techsupport .shtml and complete the form there to send us the error you
    have found. We’ll check the information and, if appropriate, post a message to
