  md: "# ## Chapter 3\n\nChecking the PHP manual, the appropriate function would appear\
    \ to be `imageellipse()`. The only difference between your data and its arguments\
    \ is that it expects a width and height, while the supplied data contains only\
    \ a radius. But that’s a trivial difference. First, define a function:\n\n```\n\
    ```php\nfunction imagedatapoint($image, $datapoint)\n{\n    $width = $height =\
    \ $datapoint[2]*2;\n    imageellipse($image, $datapoint[0], $datapoint[1], $width,\
    \ $height,\n                 $datapoint[3]);\n}\n```\n```\n\nThen call it.\n\n\
    ```\n```php\nforeach($datapoints as $datapoint)\n{\n    imagedatapoint($image,\
    \ $datapoint);\n}\n```\n```\n\nThat’s actually quite straightforward. `imagedatapoint()`\
    \ would of course have been more readable had each data point been an associative\
    \ array or an object; something that identified its components by name. One question\
    \ you could ask is, why have the loop outside the function? Indeed, you will be\
    \ more likely to be plotting multiple data points on a chart instead of just one.\
    \ Here’s an example:\n\n```\n```php\nfunction imagedatapoints($image, $datapoints)\n\
    {\n    foreach($datapoints as $datapoint)\n    {\n        $width = $height = $datapoint[2]*2;\n\
    \        imageellipse($image, $datapoint[0], $datapoint[1], $width, $height,\n\
    \                     $datapoint[3]);\n    }\n    imagedatapoints($image, $datapoint);\n\
    }\n```\n```\n\nBut how might `array_walk()` do it? First, it uses a callback function.\
    \ This is effectively the body of the previous loop.\n\n```\n```php\nfunction\
    \ imagedatapoint($datapoint, $key, $image)\n{\n    $width = $height = $datapoint[2]*2;\n\
    \    imageellipse($image, $datapoint[0], $datapoint[1], $width, $height,\n   \
    \              $datapoint[3]);\n}\n```\n```\n\nThen it makes the following call:\n\
    \n```\n```php\narray_walk('imagedatapoint', $datapoints, $image);\n```\n```\n\n\
    Unlike `array_map()`, `array_walk()` works on a reference to the original array.\
    \ So if the callback function takes its array element argument by reference, the\
    \ element’s value can be modified by the function and the change will be reflected\
    \ back in the array passed to `array_walk()`.\n\n52"
