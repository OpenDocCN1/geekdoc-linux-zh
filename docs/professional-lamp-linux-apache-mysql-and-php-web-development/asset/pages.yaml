- pgno: 133
  md: '# # Chapter 5


    # ### session.hash_function


    In the past, when PHP created a new session and session ID for a user, you had
    no control over what algorithm was used to create the session ID. With `session.hash_function`,
    you have the ability to choose between two hash algorithms used to create the
    session ID.


    Setting this option to 0 tells PHP to use MD5 to hash the session ID (128bits).
    If you wanted to use SHA-1 (160bits), you would set the value to 1.


    # ### session.hash_bits_per_character


    To further configure the session ID, you can use `session.hash_bits_per_character`
    to specify how many bits are stored in each character of the session ID when converting
    to a readable value. The options are as follows:


    +   - 4 : 0-9, a-f

    +   - 5 : 0-9, a-v

    +   - 6 : 0-9, a-z, A-Z, `"`, `''`


    # ### zend.ze1_compatibility_mode


    The last new configuration setting, `zend.ze1_compatibility_mode`, simply specifies
    whether or not you want to enable compatibility with Zend Engine 1 (PHP4).


    # ## PHP Configuration during Runtime


    Checking and changing the settings of directives in `php.ini` directly is often
    a quick and easy solution to monitoring and modifying your installation, but many
    times you can''t bring the server down to make a change, or you need to know a
    setting while a script is running. The techniques in this part of the chapter
    will help you make modifications while the server is still running.


    # ### Obtaining Current Runtime Settings


    If you need to know the exact version of PHP installed, PHP provides the `phpversion()`
    function, which returns a string listing the full installed version. For example:


    ```

    ```php

    <?php

    echo "The current version of PHP installed is: " . phpversion();

    ?>

    ```

    ```


    This would output something like the following:


    > The current version of PHP installed is: 5.0.4'
  merge: -1
  img_proc: true
- pgno: 134
  md: "# Retrieving Configuration Settings\n\nThere might be times when a simple version\
    \ check isn’t enough information, and you require a little more information about\
    \ the way PHP is configured, but you don’t have access to php.ini directly. To\
    \ look up runtime configuration settings, you have three main choices: ini_get(),\
    \ get_cfg_var(), and ini_get_all().\n\nThe first option, ini_get(), checks a given\
    \ string against the current runtime configuration. If a setting matches, it returns\
    \ the value of that setting; if no match is found, an empty string is returned:\n\
    \n```\n```php\n<?php\n\necho 'Error reporting: ' . ini_get('error_reporting')\
    \ . \"\\n\" .\n     'Register globals: ' . ini_get('register_globals') . \"\\\
    n\" .\n     \"Nonexistant setting: \" . ini_get('nonexistant') . \"\\n\";\n\n\
    ?>\n```\n```\n\nRunning this should produce output similar to the following:\n\
    \nError reporting: 2047\nRegister globals:\nNonexistant setting:\n\nNote that\
    \ the value of error reporting is actually the numerical equivalent to the constant\
    \ E_ALL in this case. But where’s the value for register_globals? When ini_get()\
    \ returns what php.ini considers Boolean (off or on, 0 or 1, yes or no), it automatically\
    \ converts them. Any value of “off” or “no” automatically gets converted to “0”;\
    \ any value of “yes” or “on” automatically becomes “1”.\n\nThe second option for\
    \ retrieving configuration settings, get_cfg_var(), behaves almost identically\
    \ to ini_get(), except that it pulls its values directly from php.ini and not\
    \ the current runtime environment. Unless you’ve changed a configuration variable\
    \ in your code (more on this later), the value should normally match what is returned\
    \ by ini_get(). Take, for example, the following code:\n\n```\n```php\n<?php\n\
    \necho 'Error reporting: ' . get_cfg_var('error_reporting') . \"\\n\" .\n    \
    \ 'Register globals: ' . get_cfg_var('register_globals') . \"\\n\" .\n     \"\
    Nonexistant setting: \" . get_cfg_var('nonexistant') . \"\\n\";\n\n?>\n```\n```\n\
    \nUnless a setting was changed in the active script, this code would produce identical\
    \ output to the following:\n\n```\n```php\n<?php\n\necho 'Error reporting: ' .\
    \ ini_get('error_reporting') . \"\\n\" .\n     'Register globals: ' . ini_get('register_globals')\
    \ . \"\\n\" .\n     \"Nonexistant setting: \" . ini_get('nonexistant') . \"\\\
    n\";\n\n?>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 135
  md: "# # Chapter 5\n\nThe third way to get configuration information, `ini_get_all()`,\
    \ acts like `ini_get()` magnified. Instead of specifying a single value to lookup,\
    \ `ini_get_all()` returns an array containing all the registered configuration\
    \ options. Its returned values aren't just limited to the current setting either\
    \ — `ini_get_all()` returns the global value set in php.ini, the current local\
    \ value as it exists at the moment, and the access level required to change the\
    \ setting.\n\nLook at this simple example:\n\n```\n```php\n<?php\n\nprint_r(ini_get_all());\n\
    \n?>\n```\n```\n\nYou execute this code, and you get something similar to the\
    \ following:\n\n```\nArray\n(\n    [allow_call_time_pass_reference] => Array\n\
    \        (\n            [global_value] =>\n            [local_value] =>\n    \
    \        [access] => 6\n        )\n\n    [allow_url_fopen] => Array\n        (\n\
    \            [global_value] => 1\n            [local_value] => 1\n           \
    \ [access] => 4\n        )\n\n    [always_populate_raw_post_data] => Array\n \
    \       (\n            [global_value] => 0\n            [local_value] => 0\n \
    \           [access] => 6\n        )\n\n    [arg_separator.input] => Array\n \
    \       (\n            [global_value] => &\n            [local_value] => &\n \
    \           [access] => 6\n        )\n\n    ...\n)\n```\n\nNote this output has\
    \ been greatly abbreviated — the actual returned array has over 150 different\
    \ items. Also note that some of the values are empty strings, like the global\
    \ and local values for allow_call_time_pass_reference. When `ini_get_all()` returns\
    \ each setting, it uses the same value transformation that `ini_get()` performs,\
    \ in regards to off/on values."
  merge: -1
  img_proc: true
- pgno: 136
  md: "# Extension Information\n\nNow that you can gather information about the runtime\
    \ settings, it’s time to learn how to check extensions and their properties. PHP\
    \ provides you with three built-in functions to look up information about loaded\
    \ extensions.\n\nThe first, `extension_loaded()`, simply checks to see if a given\
    \ extension is loaded. All you need to do is provide the name of the extension,\
    \ and it will return a Boolean indicating whether or not it is available, like\
    \ so:\n\n```\n<?php\nif (extension_loaded('mysql'))\n{\n    echo \"MySQL is available.\\\
    n\";\n}\nelse\n{\n    echo \"MySQL is NOT available.\\n\";\n}\nif (extension_loaded('fakesql'))\n\
    {\n    echo \"Fake SQL is available.\\n\";\n}\nelse\n{\n    echo \"Fake SQL is\
    \ NOT available.\\n\";\n}\n?>\n```\n\nWhen you run this, you should see the following:\n\
    \n```\nMySQL is available.\nFake SQL is NOT available.\n```\n\nIf you need to\
    \ know the status of more than one extension at a time, PHP gives you `get_loaded_extensions()`.\
    \ Like `ini_get_all()`, `get_loaded_extensions()` returns an array of all the\
    \ extensions loaded. Consider the following code:\n\n```\n<?php\n\nprint_r(get_loaded_extensions());\n\
    \n?>\n```\n\nThis should produce output similar to the following, give or take\
    \ a few extensions, based on your current setup:\n\n```\nArray\n(\n    [0] =>\
    \ xml\n```"
