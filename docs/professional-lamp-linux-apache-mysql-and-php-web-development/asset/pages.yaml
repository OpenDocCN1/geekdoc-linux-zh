- pgno: 126
  md: 'When inside the MySQL command shell, you can use several common commands that
    share the prefix `SHOW`, to get various bits of information about the current
    state of the database. The following sections describe some of the more common
    `SHOW` commands.


    # ## SHOW COLUMNS


    The `SHOW COLUMNS` command returns a listing of all the columns in a table, and
    their attributes. The general format of `SHOW COLUMNS` is as follows:


    ```

    `SHOW COLUMNS FROM {table} FROM {database}`

    ```


    If you want to get a list of all the columns in the `New_Vehicle` table, you could
    use the following:


    ```

    `SHOW COLUMNS FROM New_Vehicles FROM VehicleInventory;`

    ```


    Which returns the following:


    | Field | Type | Null | Key | Default | Extra |

    | --- | --- | --- | --- | --- | --- |

    | `vehicle_id` | `int(11)` |  | PRI | `NULL` | `auto_increment` |

    | `model_id` | `int(11)` | YES |  | `NULL` |  |

    | `price` | `decimal(10,2)` | YES |  | `NULL` |  |

    | `color` | `varchar(200)` | YES |  | `NULL` |  |

    | `description` | `text` | YES |  | `NULL` |  |

    | `modelyear` | `int(11)` | YES |  | `NULL` |  |


    In the return output, the `Field` column contains the name of each column, `Type`
    shows the column data type, `Null` specifies whether or not `NULL` values are
    allowed in the column, `Key` indicates what key or index types each column belongs
    to, `Default` shows any specified default column value, and `Extra` shows any
    special treatment given to each column. Note that this command is functionally
    identical to MySQL’s `DESCRIBE {table}` command.


    # ## SHOW CREATE TABLE


    You might want to learn what command could be used to create a given table. For
    that, you have the `SHOW CREATE TABLE` command:


    ```

    `SHOW CREATE TABLE {table name}`

    ```


    To get the `create` command that would create your `New_Vehicles` table, send:


    ```

    `SHOW CREATE TABLE New_Vehicles \G`

    ```


    Running this command against the `VehicleInventory` database gives you this:


    ```

    ```

    *************************** 1. row ***************************

    Table: New_Vehicles

    Create Table: CREATE TABLE `New_Vehicles` (

    ```


    ```'
