    # # create_function()


    There is just one more hurdle to overcome. So far all of the callbacks mentioned
    have been pre-existing functions that were written into the original code. Sometimes,
    though, that just isn’t good enough. Sometimes the exact form a function may take
    isn’t known until the moment it is needed for a callback, or perhaps it’s simply
    a matter of not wanting to have a whole function sitting around for a single specific
    task that is going to be performed only once. If only there was some way of defining
    a function at runtime; or explicitly, instead of via a callback’s name.


    Well, there already is: build up a string containing the text of the function,
    wrap it in `function whatever(...){ }`, and call `eval()` on that. But problems
    can occur. You have to remember that since a function can be declared only once,
    that string can be evaluated only once; you have to remember to give each such
    function a unique name—`whatever0()`, `whatever1()`, and so forth — so if this
    act of creation might be carried out more than once, a counter of some sort (possibly
    a static variable) is required somewhere in the function, method, or class that
    contains the evaluation. And of course if you do this in more than one place in
    your code, you need to ensure that the function names generated at different places
    don’t collide. One elegant way of doing this would be to have a single “function-creating
    function” with a single static variable to prevent namespace collisions, and pass
    it the text of the function, letting it work out an appropriate name, evaluate
    the resulting definition, and return the generated name for the callback. You
    would actually want to pass it two strings —one for the body of the function and
    one for the list of arguments —and it would `go eval("function whatever\$n\$arguments)
    {$body} ");`. There is the possibility that there is already a function named
    `whatever1()`, so when your function goes to create a new function name, it would
    have to check that it’s not already defined. Then there is the possibility that
    it might create a function named `whatever1()`, unaware that further on through
    the program you will attempt to create a function named `whatever1()`. The only
    prevention for that is to enforce coding standards stating that you are not allowed
    to declare functions with names of a certain form.


    But don’t bother. Such a function already exists, and it works exactly as just
    described, with an extra subtlety that prevents any chance of namespace collision
    with your own functions. PHP’s `create_function()` creates an anonymous function,
    which simply means that it doesn’t appear in the list generated by `get_defined_functions()`.
    It does, however, *have* a name (even anonymous people have names — you just don’t
    know them). First of all, there is the name it has while it is being parsed and
    compiled: in its own mind (that is, the value of the magic `_FUNCTION_` constant),
    it thinks of itself as `_lambda_func_`. (The term “lambda function” is synonymous
    with “anonymous function,” and comes from a 1936 model of computation called the
    Lambda Calculus via LISP.) Once it has been created, there is the name it is known'
