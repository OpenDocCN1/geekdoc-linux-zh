  md: "# Chapter 3\n\nThis is equivalent to:\n\n```\nforeach($array as $value)\n{\n\
    \    $value = do_something_fancy($value);\n}\n```\n\nIn the former case, there\
    \ is a brief moment after the `array_map()` has been evaluated when there are\
    \ **two entire arrays**. Following the assignment, of course, the previous version\
    \ of the `$array` is discarded and memory retrieved, but that doesn't happen until\
    \ the assignment has been completed, and the number of references to the original\
    \ has decreased to zero. If the array is large, the extra space required can be\
    \ significant, with large chunks of memory being allocated and then a short time\
    \ later *other* large chunks of memory being *deallocated*. Naturally, if the\
    \ output array is going into a different variable than the input array, the deallocation\
    \ doesn't happen, and the one-off economy-sized allocation carried out by the\
    \ `array_map()` function's implementation may well be more efficient than the\
    \ piecemeal element-by-element activity that occurs in `$new_array[] = do_something_fancy($value);`.\
    \ Clearly, `array_filter()`, `array_udiff()`, and other functions that can output\
    \ arrays shorter than their inputs ought to be applied prior to those that can't\
    \ when possible, as it gives those later functions less work to do.\n\nIf there\
    \ are a series of `array_-`-type functions that return arrays, each using the\
    \ results of the previous, this bulk to-and-fro can become quite tedious for both\
    \ PHP's memory management and the operating system. It can be obviated to some\
    \ extent (but only *some* extent) by writing something like this:\n\n```\narray_walk(\n\
    \    array_map(\n        'do_something_fancy',\n        array_filter(\n      \
    \      array_map('nothing_fancy', $array),\n            'purge'\n        )\n \
    \   ),\n    'traverse', 'sideways'\n);\n```\n\nInstead of this:\n\n```\n$array\
    \ = array_map('nothing_fancy', $array);\n$array = array_filter($array, 'purge');\n\
    $array = array_map('do_something_fancy', $array);\narray_walk($array, 'traverse',\
    \ 'sideways');\n```\n\nBut no one is going to believe you if you say that the\
    \ former is easier to read. If nothing else, the functions appear in the reverse\
    \ order that they are applied. Admittedly, it does not help appearances that there\
    \ does not appear to be any consistency in the order in which arguments are passed\
    \ to the functions. The best you can say about it is that it helps suppress errors\
    \ at runtime—if you accidentally mistype `array_map` instead of `array_filter`,\
    \ PHP would complain at runtime that the “first argument, `$array`, should have\
    \ been NULL or a valid callback.”\n\n# glob()\n\nA task you may often find yourself\
    \ doing is reading through a directory for files with names matching a certain\
    \ pattern—all the text files, for example, or image files. This can be simpler\
    \ than storing the files in the filesystem, maintaining a list of those files\
    \ elsewhere, and then having to keep the two synchronized."
