- pgno: 181
  md: "# Chapter 6\n\nPlease enter the following 'extra' attributes\n to be sent with\
    \ your certificate request\nA challenge password []: testchallenge\nAn optional\
    \ company name []: Test Company\n\nAny responses to the prompts in bold should\
    \ be replaced by your own appropriate values. Also, be sure that the value you\
    \ entered for Common Name is the real fully qualified domain name for your server,\
    \ such as www.yourserver.com.\n\nAfter the command completes and you've answered\
    \ all prompts, you will have two new files: privkey.pem, which is a private key\
    \ used to sign the certificate, and testcert.csr, the certificate request. The\
    \ next step is to remove the passphrase from the key created in the previous step.\
    \ If you don't remove the passphrase, you must enter it every time Apache is started.\
    \ While this may seem like extra security, it's really a nuisance, as it prevents\
    \ Apache from restarting completely if your server suffers a power failure, or\
    \ you restart Apache frequently.\n\nTo remove the passphrase, use the following\
    \ command:\n\n```\nopenssl rsa -in privkey.pem -out testcert.key\n```\n\nThis\
    \ will then prompt you to enter the same passphrase you used in the very beginning\
    \ of the previous command:\n\n```\nEnter pass phrase for privkey.pem:\nwriting\
    \ RSA key\n```\n\nThe next step is to convert the certificate request into a signed\
    \ certificate:\n\n```\nopenssl x509 \\\n-in testcert.csr \\\n-out testcert.cert\
    \ \\\n-req \\\n-signkey testcert.key \\\n-days 3650\n```\n\nThis will then show:\n\
    \n```\nSignature ok\nsubject=/C=US/ST=Ohio/L=Cincinnati/O=TestSSL/OU=SSL Testing\n\
    \ Department/CN=www.example.com/emailAddress=youremail@example.com\nGetting Private\
    \ key\n```\n\nWhat you've done here is use the openssl command to request a X.509\
    \ certificate, using the testcert.scr certificate request as input, and saved\
    \ the resultant certificate as testcert.cert, which is self-signed using the private\
    \ key testcert.key and is a valid certificate for 10 years.\n\nNow that you have\
    \ both your self-signed server certificate and key, you'll need to copy them both\
    \ to a location that Apache can use:\n\n```\nmkdir -p /etc/apache/ssl.crt\nmkdir\
    \ -p /etc/apache/ssl.key\n```"
