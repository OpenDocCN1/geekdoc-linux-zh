    actually be what is controlled by the user. In order to prevent it from just showing
    all of the images a default action of stop() is added to it. Also the size of
    the movie is calculated from the size of the images with extra space given to
    allow for buttons to be added underneath the images. Here''s the code:


    ```

    ```

    //create a sprite which will act as a mini movie

    $sprite = new SWFSprite();

    //add stop action to the first frame

    $sprite->add(new SWFAction("stop();"));


    //set the size of the movie with extra pscce for buttons

    $movie->setDimension((1*$w), (1.5* $h +3));

    ```

    ```'
