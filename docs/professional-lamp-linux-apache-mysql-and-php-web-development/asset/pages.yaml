  md: "# # Chapter 2\n\n# ## __wakeup\n\nThe `__wakeup` magic method does the exact\
    \ opposite of the `__sleep` method. When `unserialize()` is called, `__wakeup`\
    \ is automatically called, which is helpful for resetting object values, restoring\
    \ connections, and other initialization tasks.\n\nLook at this simple example\
    \ of `__sleep` and `__wakeup` in action. This example is going to require two\
    \ files. The first file, you’ll create as page1.php:\n\n```\n```php\n<?php\nsession_start();\n\
    \nclass Circle\n{\n    public $radius;\n\n    public $origin = array('x'=>0, 'y'=>0);\n\
    \    public function __sleep()\n    {\n        echo 'zzzzz';\n\n        return\
    \ array('radius','origin');\n    }\n\n    public function __wakeup()\n    {\n\
    \        echo 'good morning!';\n    }\n}\n\n$c = new Circle();\n$c->radius = 5;\n\
    $c->origin['x'] = 3;\n$c->origin['y'] = 4;\n\necho 'Preparing to sleep.....';\n\
    $_SESSION['c'] = serialize($c);\n\necho '<br /><a href=\"page2.php\">Wake the\
    \ object</a>';\n?>\n```\n```\n\nThe second file you’ll name page2.php:\n\n```\n\
    ```php\n<?php\nsession_start();\n\nclass Circle\n{\n    public $radius;\n\n  \
    \  public $origin = array('x'=>0, 'y'=>0);\n```\n```"
