- pgno: 292
  md: 'Now each of the images needs to be added to the sprite, which can be easily
    achieved by iterating through the array. Each of the images are first converted
    to SWFBitmap objects, and then added as fills to SWFShape objects. After a line
    has been drawn around the shape, it is added to the SWFSprite object and the SWFSprite
    object goes to the next frame:


    ```

    ```

    //loop through all of the images

    for($i=0; $i<count($images);$i++){


    //create a bitmap from an image

    $bitmapImage = new SWFBitmap(open($images[$i], "rb"));


    //create a shape object to hold the image

    $shape = new SWFShape();

    //generate the fill for the shape of the image

    $fill = $shape->addFill($bitmapImage);

    //add the fill to the shape

    $shape->setRightFill($fill);


    //draw a line around the shape to set the size

    $shape->drawLine($w, 0);

    $shape->drawLine(0, $h);

    $shape->drawLine(-$w, 0);

    $shape->drawLine(0, -$h);

    //add the shape to the sprite so that it is displayed

    $sprite->add($shape);

    //generate a new frame and go to it

    $sprite->nextFrame();

    }

    ```

    ```


    Because the sprite will not return to the first frame automatically, there needs
    to be an action added to the last frame that takes it to the first frame. The
    `gotoFrame()` action accepts a frame number as an argument; here, `frame 0` is
    used as it is the first frame in the sprite. Another frame is then added to the
    sprite in order to make sure everything is included in the SWFSprite object:


    ```

    ```

    //goto frame 0

    $sprite->add(new SWFAction(''gotoFrame(0);''));

    //again generate a new frame

    $sprite->nextFrame();

    ```

    ```


    Now that the sprite has finished, it needs to be added to the SWFMovie object.
    As it is added to the movie, it will return a handler that can be used as a reference
    to the sprite so that it can be controlled. A name is assigned to it and using
    the handler, you move the sprite into position:


    ```

    ```

    //add the sprite and get its handler

    $handler = $movie->add($sprite);

    //we can name the sprite now with the handler

    $handler->setName("images");

    //we can move the sprite also with the handler

    $handler->moveTo(0,2);

    ```

