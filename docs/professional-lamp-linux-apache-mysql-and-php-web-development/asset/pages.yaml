    # Limitations


    When using full-text search, there are a few limitations you must keep in mind.
    First, MySQL supports only full-text indexes on MyISAM table types (covered in
    the next section). Second, in most situations, if you create a full-text index
    on more than one column, the list of columns you provide to MATCH() must be the
    exact same list you specified when you created the full-text index. Last, MySQL
    has a default minimum word/token length of four characters. If you try to match
    a full-text search against a keyword that has three or fewer letters, no results
    will be returned.


    To change the default minimum full-text word length, make sure the following exists
    in your MySQL configuration file *my.cnf*:


    ```

    ```

    [mysqld]

    ft_min_word_len=3

    ```

    ```


    You may use any integer for the minimum length (set to 3 in this example).


    # InnoDB Tables


    One of the advantages to using MySQL is that you’re not limited to a certain storage
    engine for your data. What’s a storage engine? MySQL, as a server, provides the
    user with a consistent interface and querying language, but is only loosely coupled
    with the way it actually stores the data on the disk. The different storage engines
    in MySQL provide differing ways to store and access the data, from the trusty
    default MyISAM, to the sizzling speed of in-memory Heap tables, and all stops
    in between. One of the most flexible and powerful table types you can use is InnoDB.
    The InnoDB storage engine, created by Innobase Oy in Helsinki, Finland, provides
    MySQL with a safe and efficient way to store and process data, and gives MySQL
    some additional functionality not present with MyISAM or most of the other table
    types.


    # InnoDB Advantages


    Although the default MyISAM table type gives you a mature and speedy way to store
    simple data structures, it is lacking a handful of the features that many developers
    want—and InnoDB can provide. Available by default since MySQL 4.0, InnoDB tables
    give you the ability to use transactions, row-level locking, and best of all,
    foreign key constraints.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Advanced MySQL


    Foreign key constraints provide a way to maintain referential integrity across
    linked tables. In the `VehicleInventory` database, the `New_Vehicles` and `Used_Vehicles`
    tables contain a column for `model_id`, to specify the model, and, subsequently,
    the make, for each vehicle. A foreign key constraint could be applied to the `model_id`
    column to guarantee that no value could be inserted into that column that didn’t
    exist already in the `Models` table. In the default MyISAM table type, there is
    no way for MySQL to automatically enforce such a rule, and in larger databases
    that could lead to large quantities of invalid values in the tables. InnoDB provides
    MySQL with a way to enforce such a rule, so data always stays relevant.


    > Foreign-key-constrained columns allow only values that exist in the referenced
    table, with one exception, NULL. A value of NULL is permitted in columns that
    are otherwise controlled by a foreign key.


    # InnoDB Disadvantages


    Unfortunately, the benefits of InnoDB come with a couple of particularly bothersome
    problems. First, InnoDB tables do not support full-text searching. When you’re
    deciding whether or not to use InnoDB, you must always consider the need for full-text
    indexing in the future, and whether it is more important than referential integrity
    on a given table.


    Second, the InnoDB storage engine is slightly limited with regards to `AUTO_INCREMENT`
    columns. InnoDB tables do not allow you to specify the initial value of the auto-increment
    sequence when creating a table. Not necessarily a show-stopper, but it’s something
    to keep in mind when designing your database schema.


    # Using InnoDB


    The best way to get to know the InnoDB storage engine is to put it to work. Now
    you’re going to enable the InnoDB engine by both creating a new table from scratch
    as well as altering an additional table. After that you’re going to experiment
    with the different aspects of foreign keys.


    # Creating an InnoDB Table from Scratch


    Creating a new table using the InnoDB storage engine is barely any different from
    creating a standard MyISAM table. The only key difference is you must specify
    the `ENGINE` at the end of the create table command:


    ```

    ```

    CREATE TABLE tablename (column_definitions) ENGINE=InnoDB;

    ```

    ```


    Pretty easy, right? Try it out for real in your MySQL database:


    ```

    ```

    CREATE TABLE innodtest (innocol int) ENGINE=InnoDB;

    ```

    ```


    If everything goes smoothly, you should see the following:


    ```

    ```

    Query OK, 0 rows affected

    ```

    ```


    And with that, you’ve created a simple InnoDB table.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# **Converting an Existing MyISAM Table**


    Creating a new InnoDB table from scratch is all fine and dandy, but you’ve got
    a handful of tables that you’d love to see use the InnoDB storage engine. What
    you need is a way to convert those tables from the default MyISAM table type.
    Luckily, changing the storage engine for a table in MySQL is a simple task—just
    use the `ALTER TABLE` command and re-specify the engine for a table. To convert
    the `New_Vehicles` table, which is currently using the default table type of MyISAM,
    you use the following:


    ```

    ALTER TABLE New_Vehicles ENGINE=InnoDB;

    ```


    Run this command against your database, and you will see this:


    ```

    ERROR 1214 (HY000): The used table type doesn''t support FULLTEXT indexes

    ```


    Instead of converting your tables as you’d expect, MySQL has given you an error
    message. As mentioned earlier, InnoDB tables do not currently support full-text
    indexing in MySQL. If you try to convert a MyISAM table with a defined full-text
    index to InnoDB, you will get this message. For the purposes of this exercise,
    you’re going to need to delete the full-text index so you can convert the table:


    ```

    ALTER TABLE New_Vehicles DROP INDEX description;

    ```


    And now you should be able to go ahead and convert the table:


    ```

    ALTER TABLE New_Vehicles ENGINE=InnoDB;

    ```


    This time, you query should succeed, and you will see something similar to the
    following:


    ```

    Query OK, 4 rows affected (0.76 sec)

    Records: 4  Duplicates: 0  Warnings: 0

    ```


    # **Foreign Keys**


    You wouldn’t switch a table from MyISAM to InnoDB without a good reason, and in
    most cases, foreign keys are as good a reason as any. Once you’ve set up your
    InnoDB table, it’s only a matter of adding a foreign key to the table to enforce
    referential integrity. While it sounds simple on the surface, there are a good
    number of options to consider when creating a foreign key.


    The most basic format of the `ALTER TABLE` command to create a foreign key looks
    something like this:


    ```

    ALTER TABLE [tablename] ADD CONSTRAINT [key_name] FOREIGN KEY ([indexed_column])

    REFERENCES [foreign_table] ([id_column])

    ```


    Starting out, you’re telling MySQL what table to change, and what to do (add a
    foreign key). Using `CONSTRAINT` [key_name], you can optionally give the key a
    name, which is often a good idea if you plan on changing the key in the future.
    The name of the column that requires referential integrity follows in parentheses.
    After that is the `REFERENCES` keyword, the name of the foreign table that will
    be checked against, and the specific column in that foreign table to reference.


    To apply this to the vehicle inventory database, add a foreign key named `refmdl`
    to the `New_Vehicles` table, to check the column `model_id` against the `model_id`
    column in the `Models` table:


    ```

    ALTER TABLE New_Vehicles ADD CONSTRAINT refmdl FOREIGN KEY (model_id)

    REFERENCES Models (model_id);

    ```'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Advanced MySQL


    Run this command in MySQL and you will see something similar to this:


    ```

    ERROR 1005 (HY000): Can''t create table ''./vehicleinventory/#sql-1951_2.frm''
    (errno: 150)

    ```


    This time the error message is not as helpful as it could be in tracking down
    the cause. In this situation, the error was thrown because one of the tables involved
    in the foreign key does not use the InnoDB engine. You’ve already converted the
    New_Vehicles table to InnoDB, but the Models table is still MyISAM. In order for
    foreign keys to be properly created, both tables involved need to be using the
    InnoDB engine, so you must change them accordingly:


    ```

    ALTER TABLE Models ENGINE=InnoDB;

    ```


    And then add the foreign key:


    ```

    ALTER TABLE New_Vehicles ADD CONSTRAINT refm1 FOREIGN KEY (model_id) REFERENCES
    Models (model_id);

    ```


    Now your foreign key is protecting the model_id column in New_Vehicles from errant
    data . . . or is it? The easiest way to know for sure is to test it. Try to insert
    a line into New_Vehicles using a wildly incorrect model_id:


    ```

    INSERT INTO New_Vehicles (model_id) VALUES (12345);

    ```


    When you try to execute this query, it should return the following:


    ```

    ERROR 1216 (23000): Cannot add or update a child row: a foreign key constraint
    fails

    ```


    As expected, the foreign key check saw that the value was not in the Models table,
    and refused to allow the row to be inserted. You’ve managed to block any new rows
    with bad data, but what about existing rows that are being altered? Try this query:


    ```

    UPDATE New_Vehicles SET model_id=12345 WHERE vehicle_id=1;

    ```


    As you can see, the foreign key stops errant updates as well:


    ```

    ERROR 1216 (23000): Cannot add or update a child row: a foreign key constraint
    fails

    ```


    So the foreign key successfully protects the table from harmful INSERTs and UPDATEs,
    but what happens when a value is changed in the Models table? Take a look at the
    following query, where you attempt to change an existing model_id:


    ```

    UPDATE Models SET model_id=123 WHERE model_id=1;

    ```


    When you run this query, you should get the following error:


    ```

    ERROR 1217 (23000): Cannot delete or update a parent row: a foreign key constraint
    fails

    ```'
  merge: -1
  img_proc: true
- pgno: 117
  md: "# Chapter 4\n\nThis error simply reflects another of the behaviors associated\
    \ with a simple InnoDB foreign key: you cannot modify a referenced column if its\
    \ value is present in the referencing table. What if that behavior is not what\
    \ you want? As luck would have it, you can specify the update and delete behavior\
    \ of foreign keys to one of five different options: RESTRICT, CASCADE, SET NULL,\
    \ NO ACTION, and SET DEFAULT. Here’s a quick breakdown of what each behavior means:\n\
    \n+   - RESTRICT is the default behavior. A referenced value cannot be changed\
    \ or deleted.\n+   - CASCADE allows any updates to propagate down to the referencing\
    \ table. If you updated the model_id in the Models table, it would cascade down\
    \ to the New_Vehicles table and update any corresponding rows. Note that this\
    \ can apply to deletes as well (if specified) — deleting a row in a parent table\
    \ will automatically delete all rows in the child table that referenced that value.\n\
    +   - SET NULL changes the value in the child table to NULL when you update the\
    \ parent value.\n+   - NO ACTION simply tells the database to allow the change\
    \ to the parent table and do nothing to the child table.\n+   - SET DEFAULT changes\
    \ the values in the child table to their DEFAULT values when the parent values\
    \ are changed or deleted.\n\nImplementing these behaviors is a simple matter of\
    \ adding the required ON DELETE or ON UPDATE clause to the end of the foreign\
    \ key definition, like so:\n\n```\nALTER TABLE [tablename] ADD CONSTRAINT [key_name]\
    \ FOREIGN KEY ([indexed_column]) REFERENCES [foreign_table] ([id_column]) ON UPDATE\
    \ [update_behavior] ON DELETE [delete_behavior]\n```\n\nTo change an existing\
    \ key to support different update and delete behaviors, you first have to delete\
    \ the old key, then recreate the foreign key using the new behaviors. To change\
    \ the foreign keys on the New_Vehicles table to cascade any updates, and set NULL\
    \ when a model is deleted, use the following:\n\n```\nALTER TABLE New_Vehicles\
    \ DROP FOREIGN KEY refmdl; ALTER TABLE New_Vehicles ADD CONSTRAINT refmdl FOREIGN\
    \ KEY (model_id) REFERENCES Models (model_id) ON UPDATE CASCADE ON DELETE SET\
    \ NULL;\n```\n\nNow every time a model_id is changed in the Models table, the\
    \ new value will be propagated down to all rows in New_Vehicles that used the\
    \ original value. Have a look for yourself:\n\n```\nUPDATE Models SET model_id=123\
    \ WHERE model_id=1; SELECT * FROM New_Vehicles \\G\n```\n\nThe update will succeed,\
    \ and return something similar to the following:\n\n```\n***************************\
    \ 1. row ***************************\n vehicle_id: 1\n model_id: 123\n price:\
    \ NULL\n color: Dark Blue\n description: Poplar SUV; great for moving people or\
    \ cargo across town, or wherever your adventures may take you.\n modelyear: 2005\n\
    ```"
