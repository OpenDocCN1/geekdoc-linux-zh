  md: "In OOP, there are a couple of ways in which a group of methods and properties\
    \ can be specified for use in multiple classes. The first, *inheritance*, allows\
    \ you to define a base set of properties and methods that belong to a base class,\
    \ and can be used as a building block for more specific classes. The second, *interfaces*,\
    \ allow you to prescribe a list of methods that a class must implement.\n\n# ##\
    \ Inheritance\n\nSuppose you are creating a code library, one for manipulation\
    \ of different geometric shapes. The `Circle` class that you’ve been using throughout\
    \ the chapter could be part of that very library. In creating different classes\
    \ for different shapes — square, circle, triangle, and so on — you may find that\
    \ you’re duplicating methods that are similar or identical among all shapes. This\
    \ would be a good opportunity to use inheritance.\n\n# ## The extends Keyword\n\
    \nAssume that all of the geometric shape classes are going to be drawn on a grid.\
    \ Therefore, they will all need some sort of *origin* point (x,y). You could include\
    \ an *origin* property in each of the different classes, or using the `extends`\
    \ keyword, you could use inheritance to define the property in one shared location.\
    \ To do this, you’ll create a class named `Shape`, which will serve as a parent\
    \ of all geometric classes that you might create. Each specific geometric shape\
    \ class — be it a `Circle`, `Square`, `Ellipse`, or `Star` — all have a base set\
    \ of functionality that `Shape` provides. An easy way to think of this parent-child\
    \ relationship, is with the phrase “*is a*.” In this example, `Circle is a Shape`,\
    \ just like a `Square is a Shape`, and a `Triangle is a Shape`.\n\nTo use your\
    \ parent class `Shape`, you could do something similar to the following:\n\n```\n\
    ```php\n<?php\n\nclass Shape\n{\n    public $origin = array('x'=>0, 'y'=>0);\n\
    }\n\nclass Circle extends Shape\n{\n    public $radius;\n}\n\n$c = new Circle();\n\
    print_r($c->origin);\n?>\n```\n```\n\nRunning this code would produce the following:\n\
    \n```\n```\nArray\n(\n    [x] => 0\n    [y] => 0\n)\n```\n```"
