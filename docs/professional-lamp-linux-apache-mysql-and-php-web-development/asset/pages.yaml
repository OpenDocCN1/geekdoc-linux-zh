    \ head and starts the body; followed by two sections that make up the page’s layout\
    \ (and then presumably other sections); and finally the `</body></html>` to finish\
    \ the page off. Each section will be output as one intact block, giving Apache\
    \ the best conditions to fill its outgoing packets as efficiently as possible.\n\
    \n# ### **echo or print?**\n\nOh no, not again. The only speed difference worth\
    \ noting between *echo* and *print* (apart from typing speed) is when you have\
    \ several strings you wish to output in sequence. With *print*, you concatenate"
