    \ => 605\n    [bytes_written] => 1856\n    [limit_maxbytes] => 134217728\n)\n\
    ```\n\n# ### Removing memcached\n\nLike the other DSO caching solutions, you can\
    \ quickly disable memcache functionality by commenting-out or removing the appropriate\
    \ lines from php.ini and restarting Apache. At that point you can delete memcache.so\
    \ from your PHP extensions directory, and the memcached daemon from the system\
    \ binary folder (wherever it was installed to earlier, most likely /usr/local/bin\
    \ or /usr/bin).\n\n# ## Using Different Caching Engines Together\n\nNow at this\
    \ point, the gears might be turning in your head, and you start to wonder, “What\
    \ happens if I used more than one caching engine simultaneously?” Well, as you\
    \ might suspect, a proper choice of complementary solutions can slightly increase\
    \ performance, but there are certain combinations that won't do you any good."
