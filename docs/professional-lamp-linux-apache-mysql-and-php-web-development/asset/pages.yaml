- pgno: 140
  md: "```\n<?php\n\necho \"Setting error_reporting to E_STRICT...\\n\";\n\n$old =\
    \ ini_set('error_reporting', E_STRICT);\n\necho \"Old value was: \" . $old . \"\
    \\n\" .\n        \"New value is: \" . ini_get('error_reporting') . \"\\n\";\n\n\
    ini_restore('error_reporting');\n\necho \"The value is once again: \" . ini_get('error_reporting')\
    \ . \"\\n\";\n\n?>\n```\n\nWhen you run the code this time, it should successfully\
    \ restore the old values:\n\n```\nOld value was: 2047\nNew value is: 2048\nThe\
    \ value is once again: 2047\n```\n\nBefore you go hog-wild changing settings,\
    \ you need to realize there are limitations as to what settings you can actually\
    \ change during the execution of a script. If you remember back when ini_get_all()\
    \ was shown, the array for each configuration directive returned three values:\n\
    \n```\n... \n[allow_call_time_pass_reference] => Array\n    (\n        [global_value]\
    \ =>\n        [local_value]  =>\n        [access]   => 6\n    )\n...\n```\n\n\
    The third value, access, indicates where the configuration directive can actually\
    \ be changed. The number that is provided for access is actually a sum of any\
    \ of the following values:\n\n| Value | Meaning |\n|---|---|\n| 1 | Directive\
    \ can be set in user scripts. |\n| 2 | Directive can be set in php.ini, .htaccess,\
    \ or httpd.conf. |\n| 4 | Directive can be set in php.ini or httpd.conf. |\n|\
    \ 7 | Entry can be set anywhere. |\n\nIn the example above, allow_call_time_pass_reference,\
    \ access has a value of 6, meaning the directive can only be changed in php.ini,\
    \ .htaccess, or httpd.conf. The key thing to keep in mind is if the setting has\
    \ an access value of 2, 4, or 6, it cannot be changed during the execution of\
    \ the script. Any attempts to do so will return false automatically."
