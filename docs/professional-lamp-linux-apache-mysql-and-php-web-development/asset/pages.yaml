- pgno: 97
  md: '# Chapter 3


    One is that the supplied 21-digit filename could have an extension attached to
    indicate the desired image format, rather than remain fixed on PNG generation.
    Others include a more realistic (or at least flexible) storage mechanism that
    users control through a more fully-developed URL including hostnames and paths.
    Consider also the possibility of moving some of the time-leading work into stream_read(),
    thus cutting down on the amount of image data that needs to be retained at any
    given time. (Observe, however, that since GD Lib puffers only complete images,
    you''ll be required to write your own code to output image data that is correct,
    yet incomplete pending future input.)


    You would be serving yourself well if you follow the URL system for naming stream
    resources, as defined in RFC 3986, with guidelines given in RFC 2718. There may
    in fact already be a naming scheme in use that matches your application. (The
    official registry is maintained by the Internet Assigned Numbers Authority at
    http://www.iana.org/assignments/uri-schemes). If there is, use it. Then your application
    will cooperate with other applications in the future that use the same scheme
    without needing an extra layer of URL conversion to glue them together. (Actually,
    the same goes for any data format or communications protocol—if the rest of the
    world already has an agreed-upon standard for what you want, use it and save yourself
    the time and effort of creating a new one.)


    > Note that all PHP URLs require the use of :// after the scheme name, regardless
    of whether or not there is a naming authority (host) involved, as PHP uses that
    character sequence to distinguish URLs from local file paths. In RFC 3986''s terms,
    PHP only implements the first production of the four given for the "hier-part"
    component and leaves the "naming-authority" component optional. The RFC-Compliant
    workaround would be to use :///, implicitly specifying the local host as the naming
    authority.


    # Summary


    This has been a brief tour of some of the more underutilized areas of PHP''s native
    function set. By using this functionality your code can be more compact and more
    reliable without sacrificing legibility. Array functions can often be used in
    place of sometimes complex loops, reducing the task to a single line of code and
    a helper function that can be captured and stored in a library for reuse. Function-handling
    functions allow you to decide at runtime not only which function you wish to use
    (a switch statement could do that), but also decide which functions are in this
    list you wish to select from, or even create the function from scratch. Streams
    allow you to hide the implementation details of how external data is read or written,
    allowing the rest of your program to be able to treat it as just another file.


    There are always new features being added to PHP—new initialization settings to
    fine-tune its operation, new arguments to existing functions that enhance their
    utility (even the venerable function str_replace() has been given a new argument
    in PHP5), new functions, and even whole new categories of functions. All this
    makes learning PHP an ongoing affair in which there is always something you don''t
    know about yet.'
  merge: -1
