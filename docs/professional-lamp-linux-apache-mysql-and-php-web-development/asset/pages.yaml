- pgno: 230
  md: '# ## Code Efficiency


    inner loop, the experiments for a given number of variables were performed at
    widely spaced points during the run, ruling out all but suspiciously well-timed
    transient delays from external sources.


    Comparing the two graphs when the number of variables is very small, it’s first
    unusual to see that the speed of concatenation drops initially, and second that
    interpolation rises very sharply indeed. Closer inspection reveals that when the
    number of variables is 0, double-quoted and single-quoted strings are equally
    fast, with double-quoted strings only slowing down once one there are variables
    to be interpolated. This is because double-quoted strings are scanned for variables
    while the program is being loaded, during lexical analysis. This is a one-off
    expense that is even less than we might at first expect: the contents of both
    single-quoted and double-quoted strings have to be scanned anyway, to locate escape
    sequences and the actual end of the string. The only real difference is that scanning
    double-quoted strings generates several tokens in sequence when variables are
    present.


    Overall, the shapes of the two charts are distinctive. The difference can be formalized
    by using "big-O notation," used in program analysis to describe the "size" or
    "speed" of an algorithm in terms of the size of the problem given. While it can
    be given a precise technical definition, it’s enough to think of O(f(n)) as meaning
    that the graph of the algorithm’s behavior is "looking like" the graph of f(n)
    as n gets larger and larger:


    ```

    O(f(n)) = the set of functions g(n) such that there exist positive constants c
    and n₀ such that 0≤g(n)≤cf(n) for all n≥n₀

    ```


    In this case, the graph of double-quoted interpolation doesn’t vary with v, the
    number of variables being interpolated, and only linearly with the l, the length
    of the string (that is to say, it’s twice as slow when the string is twice as
    long). In big-O notation this would be described as O(l). The graph for single-quoted
    concatenation is more complex. If you fix the length of the string and look at
    a single slice of the graph as the number of variables changes (such a slice is
    shown in Figure 9.1 at the top edge of the graph from the left to the peak), it
    looks fairly linear in v. Fixing the number of variables and allowing the length
    of the string to vary (the ridge crest leading from the peak down to the right)
    curves it in such a way as to suggest a parabola. Overall, these two influences
    appear to be multiplied, giving a big-O description of O(Pv).


    In the long run, I increases more slowly than P*v, and in fact for long strings
    with many variables, interpolation is faster than concatenation. For shorter strings,
    however, or fewer variables, concatenation still wins out.


    Big-O notation only concerns itself with what happens to the program in the long
    run as the size of the problem gets larger, ignoring factors that appear only
    for small instances of the problem. You’ll recall that when there are no variables
    involved, the two methods are equally quick (since both consist of a single string),
    but that single-quoted concatenation speeds up slightly before slowing again,
    while double-quoted interpolation slows sharply as soon as a single variable is
    introduced, and never recovers. Big-O says that in the long run, variable interpolation
    is faster than concatenation, but you would need to have multi-kilobyte strings
    with dozens of variables to actually see it happen.


    You can see that even in this very simple example, with only two factors to consider,
    there is the potential for a lot of subtlety when aiming for a definitive answer
    of what is "best." You could make deeper investigations even in this comparatively
    trivial example, and with more complicated problems you would probably have to
    before reaching any conclusions. But here is a good place to end the example,
    except to note that the slowest time recorded in all of the charted experiments
    is 3.7 seconds.'
