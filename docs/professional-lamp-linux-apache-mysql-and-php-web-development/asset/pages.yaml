- pgno: 73
  md: "# Chapter 3\n\nfor. But hidden among PHP’s esoterica are some functions that\
    \ don’t get the attention they deserve. These are functions that have been present\
    \ in PHP since version 4.3.2 at the latest—many have been around since the early\
    \ days of PHP 4. Despite this, they are often overlooked, even when they are ideal\
    \ for the task at hand. Some of them seem to be used only in tutorials about them.\
    \ They are by no means the only obscure features of the language. Rather, they\
    \ represent some of the more powerful core functionality of the PHP environment\
    \ and are areas which are the site of active development in recent versions.\n\
    \nThis chapter seeks to redress some of this injustice.\n\n# Array Functions and\
    \ Callbacks\n\nArray functions allow you to access and manipulate the contents\
    \ of arrays without having to extract them first. Most, if not all, of the operations\
    \ you may wish to carry out on “every element of an array” can be carried out\
    \ using these functions, without requiring the additional infrastructure of a\
    \ for or foreach loop. Also, many array manipulation tasks require the entire\
    \ array to be taken into consideration. Sorting is the obvious example here: you\
    \ can’t move the smallest element to the start of the array without looking at\
    \ all of the array’s elements in order to locate the smallest element. Anyone\
    \ who has tried to write a reasonably efficient sorting algorithm will know that\
    \ the task is not trivial.\n\nBecause there is no way PHP’s developers could predict\
    \ everything you want to do with your array, most of the array functions, as well\
    \ as the array or arrays in question, take an additional argument known as a callback,\
    \ which names another function that, depending on what the array function does,\
    \ would be used to manipulate array elements, or compare them to each other or\
    \ against some criterion you specify. In this way, PHP needs to provide only implementations\
    \ of the more abstract aspects of array manipulation, such as mapping and traversing,\
    \ leaving you free to provide the concrete details of your choice.\n\nCallbacks\
    \ can be so useful for abstracting functionality, in fact, that a selection of\
    \ functions are provided to allow their use in almost any situation. It’s entirely\
    \ conceivable (if quixotic) to implement your very own architecture for OOP, with\
    \ an object’s “methods” represented as an array of callbacks.\n\n# Using Callbacks\n\
    \nConsider the following script:\n\n```\n```php\n$inup_file = file('generic.txt');\n\
    foreach($inup_file as $k=>$line)\n{\n   $inup_file[$k] = rtrim($line);\n}\n```\n\
    ```\n\nYou’re loading in a text file as an array of single lines. PHP doesn’t\
    \ throw away the linebreak characters at the end, so now that they have served\
    \ their purpose, you want to drop them yourself. Writing an entire loop and using\
    \ two extra variables within it seems long-winded. For a start, you have to keep\
    \ in mind that $line is copied, so $line=rtrim($line); won’t work, meaning that\
    \ you have to refer back to the original by array and key. Either that, or remember\
    \ to declare $line by reference by writing foreach($inup_file as &$line). Mistakes\
    \ in either will mean that the final array won’t have its lines trimmed."
  merge: -1
  img_proc: true
- pgno: 74
  md: 'Now consider this:


    ```

    ```php

    $input_file = array_map(''trim'', file(''generic.txt''));

    ```

    ```


    This line of code achieves the same effect. `file()` returns an array containing
    the lines of `generic.txt`; `array_map()` applies the function `trim()` to each
    element of that array, and returns the resulting “trimmed” array.


    There are several functions that abstract the most common reasons for iterating
    over an array, reducing the need for writing loops and other flow-control statements.
    While writing one-liners solely for the sake of it can lead to hard-to-read code,
    cutting down the number of “moving parts” in a program can help reduce the incidence
    of error.


    When you have an array in which you have a task to perform on each element in
    turn, `array_map()` and `array_walk()` deserve consideration. There are other
    functions that employ so-called callback functions in a similar fashion to save
    you having to call a function on every element of an array yourself.


    Callbacks take one of two forms. The first, and most common, is that it is simply
    a string containing the name of a function. In the previous line of code, it is
    the `‘trim’`.


    > > It does have to be a function, which is why the PHP manual makes the point
    of stating that `echo`, `empty`, `include`, `array`, and so on are *not* functions.
    Passing `‘include’` as your callback will fail. The reason these are excluded
    is because they are given special attention during parsing and have their own
    internal structures.


    The second kind of callback is used to specify class and object methods. Both
    are represented by two-element arrays, where the second element is the name of
    the method, stored as a string. If the first element is an object, then the callback
    refers to that object’s method: `array($object, ‘method’)`. If on the other hand
    the first element is a string or string variable, then the callback refers to
    a static method of the named class: `array(‘thing_factory’, ‘create_new’)` refers
    to the static `thing_factory::create_new()` method.


    ```

    ```php

    // Using an object’s method as a callback in array_map().

    // Each element of $untidy_array is passed in turn to $parser->tidy(),

    // and the returned values are stored in $tidied_array

    $tidied_array = array_map(array($parser, ‘tidy’), $untidy_array);


    // Using a static class method as a callback in array_map().

    // Each element of $untidy_array is passed in turn to Parser::tidy(),

    // and the returned values are stored in $tidied_array

    $tidied_array = array_map(array(''Parser'', ‘tidy’), $untidy_array);

    class Parser

    {

    // An example method that trims trailing whitespace and

    // shell-style comments starting with ‘#'' from a single

    // line of text.

    static function strip_comments($Element)

    {

    $Element = preg_replace(''/#(.*)$/'', '''', $Element);

    $Element = rtrim($Element);

    return $Element;

    }

    ```

    ```'
