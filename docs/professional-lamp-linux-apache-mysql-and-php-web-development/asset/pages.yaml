- pgno: 243
  md: "# ## Chapter 9\n\n```\n```\nfor($i=0; $i<100; $i++)\n{\n\tif($foo[$i]!=0)\n\
    \t\tcontinue;\n\t//…etc.\n}\n```\n```\n\nNote that the test in the `if` statement\
    \ has been negated, and that the depth to which the remainder of the loop is indented\
    \ has been reduced by one level of indentation. This can also be used to reduce\
    \ the complexity of tests. Recalling another example from earlier in the discussion:\n\
    \n```\n```\nfor($i=0; $i<100; $i++)\n{\n\tif ( ($a==$i || $b==$i)\n\t\t\t&&\n\t\
    \t($c!=$i || $d!=$i) )\n\t{\n\t\techo \"Either $a or $b is equal to $i, \";\n\t\
    \techo \"and either $c or $d is not.\\\";\n\t}\n}\n```\n```\n\nYou can see immediately\
    \ that this is another case where there is only a single `if` statement inside\
    \ the loop, and hence can be written as follows:\n\n```\n```\nfor($i=0; $i<100;\
    \ $i++)\n{\n\tif(!(($a==$i || $b==$i) && ($c!=$i || $d!=$i)))\n\t\tcontinue;\n\
    \techo \"Either $a or $b is equal to $i, \";\n\techo \"and either $c or $d is\
    \ not.\";\n}\n```\n```\n\nBy employing a little Boolean algebra, the test reduces\
    \ to this:\n\n```\n```\nif( ($a!=$i && $b!=$i) || ($c==$i && $d==$i) )\n```\n\
    ```\n\nSo if either `$a` and `$b` are both not equal to `$i`, or if both `$c`\
    \ and `$d` are, then the loop will continue. But if you test that `$a` and `$b`\
    \ are both not equal to `$i`, you can know right away if you will be continuing,\
    \ without having to go on to look at `$c` or `$d`. So the test can be split into\
    \ two separate statements:\n\n```\n```\nfor($i=0; $i<100; $i++)\n{\n\tif($a!=$i\
    \ && $b!=$i)\n\t\tcontinue;\n\tif($c==$i && $d==$i)\n\t\tcontinue;\n\techo \"\
    Either $a or $b is equal to $i, \";\n\techo \"and either $c or $d is not.\\\"\
    ;\n}\n```\n```\n\nBecause PHP allows continue or break to take an argument expressing\
    \ how many levels to continue or break, a simple continue or break can be employed\
    \ in situations where in C or Java you would require"
