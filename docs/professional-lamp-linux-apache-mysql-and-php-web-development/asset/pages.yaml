- pgno: 330
  md: 'JPCache and memcached can play well with others, but APC, eAccelerator, and
    the Zend Optimizer are somewhat mutually exclusive. While they might load together
    just fine, and not throw any errors when executing a PHP script, there’s little
    to no reason to use a combination of opcode caches. All three in some way or another
    provide roughly the same functionality, so using multiple opcode caches will only
    result in the system being as fast as the slowest cache.


    Try to pick just one opcode caching solution, and try combining it with memcached
    and JPCache. Throw your preferred content-compression solution into the mix —
    the built-in content compression in JPCache is still too buggy — and you’ve got
    a lean and mean combined-cache serving machine.


    # ## Choosing Your Caching Engine


    So which caching solution is right for you? Perhaps it’s best for you to first
    evaluate the needs of your system, and look for any places that are currently
    or will soon be a bottleneck. If you’re struggling with heavy classes and objects
    zinging around your scripts, or frequently pull a large amount of repetitive data
    from your database, memcached will be your best bet for some performance improvements.
    If your website code generates relatively static pages — you’re not using excessive
    user personalization or other highly dynamic elements — you should consider using
    JPCache. If the data layer is not really your bottleneck, but your PHP code could
    use some general performance tweaks, one of the opcode caching engines will help
    you out. If you’re unsure which optimizer / cache to use, a safe bet would be
    APC. What it may lack in the low-level engine boost or optimization at Zend Optimizer
    may deliver, it makes up for by being highly customizable, and well-supported
    — it is after all, part of the PECL repository.


    # ## Summary


    Regardless of which caching solution you choose, any of the systems discussed
    in this chapter have the potential to drastically increase the performance of
    your LAMP setup. With the proper care and configuration, your caching solution
    will allow you to serve a greater number of users concurrently, and help ward
    off any possible DOS / Slashdot Effect you may encounter some day.'
  merge: -1
  img_proc: true
