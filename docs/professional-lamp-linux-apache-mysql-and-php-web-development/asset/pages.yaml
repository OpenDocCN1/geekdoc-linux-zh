    ```\n\n# PHP Streams\n\nStarting with PHP4.3, PHP’s URL wrappers (the things that\
    \ allow you to use URLs in places where file-names are usually expected) has been\
    \ extended to become the basic mechanism of file interaction in general. One of\
    \ the consequences of this is that you can now use URLs in almost any context\
    \ where a local file path would be appropriate. (Some specialized aspects, such\
    \ as configuration settings, are exempt from this: you can’t have a URL in your\
    \ include path, for example.) This includes file access functions used by third-party\
    \ extensions, with PHP now treating local file accesses as requests via file://\
    \ URLs.\n\nThe other consequence is that it became feasible in PHP5 to expose\
    \ an interface for constructing custom stream wrappers by the PHP developer in\
    \ the so-called streams interface.\n\nProgrammers who are familiar with Java or\
    \ C++ will already be familiar with the streams concept; the kioslaves that appear\
    \ in the K Desktop Environment are another example. In PHP, a stream is an object"
