- pgno: 262
  md: "the directory within which PHP is installed. PDFLib supports a wide variety\
    \ of fonts and faces. See the PDFLib documentation for complete details.\n\nFinally,\
    \ the \\texttt{pdf\\_show\\_xy()} function displays a given string in a specified\
    \ location.\n\n# About Fonts and Positioning\n\nIn the previous code example,\
    \ you saw how various text properties are manipulated via PHP’s built-in PDFLib\
    \ functions. Again, developers are cautioned against using other deprecated functions,\
    \ such as \\texttt{pdf\\_get\\_font()} and \\texttt{pdf\\_get\\_fontsize()} which\
    \ have been replaced by the single \\texttt{pdf\\_get\\_value()} function. This\
    \ function is used just as the aforementioned \\texttt{pdf\\_set\\_info()}. PHP’s\
    \ documentation (\\url{http://www.php.net/manual/en/ref.pdf.php\\#AEN124842})\
    \ lists the deprecated functions and their replacements.\n\n> *The PDFLib coordinate\
    \ system defines the xy coordinate 0:0 to be the lower-left corner of the document.*\n\
    \nYou will likely find it helpful to define constants for such page properties\
    \ as the margin and tab widths, vertical spacing, and page dimensions. The following\
    \ table lists the dimensions of the more common page sizes in points, such that\
    \ 1 pt = 1/72 inch = 0.3528 mm.\n\n| Format | Width | Height |\n|---|---|---|\n\
    | A4 | 595 | 842 |\n| B5 | 501 | 709 |\n| Letter | 612 | 792 |\n| Legal | 612\
    \ | 1008 |\n\n# Finishing Up\n\nIf you simply want to create a document and place\
    \ it somewhere on the localhost, all you need to do to complete the PDF file is\
    \ to end the page and close the document. More commonly, though, a buffer is returned\
    \ to a Web browser. The \\texttt{pdf\\_get\\_buffer()} function retrieves the\
    \ passed PDF document. The browser is then alerted via the \\texttt{header()}\
    \ function to expect a PDF document and a simple call to \\texttt{print} completes\
    \ the process, as you can see here:\n\n```\n```\n   pdf_end_page($pdf);\n   pdf_close($pdf);\n\
    \   $buf = pdf_get_buffer($pdf);\n   $len = strlen($buf);\n   header(\"Content-type:\
    \ application/pdf\");\n   header(\"Content-Length: $len\");\n   header(\"Content-Disposition:\
    \ inline; filename=resume.pdf\");\n   print $buf;\n   ```\n```\n\nThis section\
    \ only briefly touched upon the myriad of PDF generation features available to\
    \ the advanced PHP developer. Other available facets that we have not touched\
    \ upon include bookmarking, hypertext, color use, graphics generation and importing,\
    \ and too many more to mention here."
