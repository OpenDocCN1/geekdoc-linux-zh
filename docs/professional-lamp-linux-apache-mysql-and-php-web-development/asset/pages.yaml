- pgno: 100
  md: '# Advanced MySQL


    Using the MySQL command-line client is a great way to become familiar with most
    of the commands and functionality of MySQL, which often times might be automated
    in a GUI client.


    Enter the following commands to create the database, and call it “VehicleInventory”:


    ```

    mysql> CREATE DATABASE VehicleInventory;

    ```


    Now that you’ve created the database, you need to set it as the active database
    for the remainder of your queries:


    ```

    mysql> USE VehicleInventory;

    ```


    Next, create the tables for your database. The basic SQL statement to create a
    table in MySQL is:


    ```

    CREATE TABLE tablename (column_definitions);

    ```


    To create the four vehicle information tables, you can use the following:


    ```

    mysql> CREATE TABLE Makes (make_id int PRIMARY KEY AUTO_INCREMENT, make_name

    varchar(100) );

    mysql> CREATE TABLE Models (model_id int PRIMARY KEY AUTO_INCREMENT, model_name

    varchar(200), make_id int );

    mysql> CREATE TABLE New_Vehicles (vehicle_id int PRIMARY KEY AUTO_INCREMENT,

    model_id int, modelyear int, price decimal(10,2), color varchar(200), description

    text );

    mysql> CREATE TABLE Used_Vehicles (vehicle_id int PRIMARY KEY AUTO_INCREMENT,

    model_id int, modelyear int, mileage int, price decimal(10,2), color varchar(200),

    certified tinyint, warranty tinyint, description text );

    ```


    In a nutshell, we simply use the MySQL CREATE TABLE command, followed by the name
    of the table, and then list the column names and types in parentheses. You’ll
    also note that an auto-incrementing primary key is added to each table, to help
    you uniquely identify rows after they are added.


    # Adding Information


    Now that you’ve got your tables created, you need to add some data to them. For
    that, you’re going to use the INSERT statement. The MySQL INSERT command typically
    follows this format:


    ```

    INSERT INTO tablename (column_list) VALUES (new_values);

    ```


    Start by adding some initial data to the Makes table:


    ```

    INSERT INTO Makes (make_id, make_name) VALUES (1, ''Ford''), (2, ''Honda''), (3,

    ''Volkswagen''), (4, ''Toyota''), (5, ''Chevrolet'');

    ```


    Here, the basic SQL INSERT syntax is used, but with an added twist. In MySQL,
    you can specify a comma-delimited set of column values, instead of just one set,
    to populate multiple rows at once. Normally, you might leave out the make_id column
    when inserting into the Makes table — the auto-incremented ID would automatically
    assign them a number. In this case, you specify the ID so the rows you’ll soon
    add to other tables will have valid foreign keys.'
  merge: -1
  img_proc: true
