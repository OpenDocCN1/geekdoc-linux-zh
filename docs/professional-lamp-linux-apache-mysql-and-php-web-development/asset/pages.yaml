    As previously described, the receipt of the response to an XMLHttpRequest request
    is handled with the firing of events and the triggering of appropriate event handlers.
    The next set of code offers the typical way of handling the ReadyStateChange event
    firing and acting on only the event in which you are interested:


    ```

    <script type="text/javascript">

    function handleReadyStateChange() {

    if (!request) return;

    // ignore unless complete readyState

    if (request.readyState == 4) {

    // ignore unless successful.

    // You might choose to handle errors

    // rather than ignore them.

    if (request.status == 200) {

    // act on the response

    var xmlbody = request.responseXML;

    request = false;

    processResponse(xmlbody); }

    }

    }

    </script>

    ```


    This function is assigned as the onreadystatechange handler and is called when
    the ReadyStateChange event is fired. It ignores all events where the readyState
    is not 4 (complete) and the HTTP status code is not 200 (OK). The XML body of
    complete and successful responses is extracted and passed to another function
    for processing. Note that after the XML body is retrieved, the request object
    is set to false. This is to avoid a browser bug in Opera where multiple ReadyStateChange
    events are sometimes fired when the readyState changes to 4. This could result
    in acting upon a single response multiple times.


