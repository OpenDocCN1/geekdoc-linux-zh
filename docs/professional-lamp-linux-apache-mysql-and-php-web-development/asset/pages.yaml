- pgno: 159
  md: "# Chapter 6\n\nThe pattern looks for a two-level directory request, using the\
    \ `\\w` pattern to match only valid “word” characters for each directory. Then,\
    \ it uses the values of each of the two directories as the category and item number\
    \ for the PHP script. Like PHP’s PCRE syntax, you can use `$`-prefixed backreferences\
    \ to refer to submatches in the original pattern. Backreferences are a simple\
    \ way to include a sub-match from the previous pattern directly in the substitution\
    \ string. Looking again at the rule:\n\n```\n# Rewrite /category/item/ to catalog.php\n\
    RewriteRule   ^(/\\w+)/(\\w+)/?$  catalog.php?cat=$1&item=$2\n```\n\nThere are\
    \ exactly two submatches defined in the regular expression matched against the\
    \ URL: both of the “word”-character groupings, indicating directories. In the\
    \ substitution string, the backreferences $1 and $2 are used to automatically\
    \ include the value of the first and second sub-matches, correspondingly. Backreferences\
    \ simply start counting at 1, which corresponds to the first submatch.\n\nWhat\
    \ other tricks can you do with a simple RewriteRule? You can actually use it as\
    \ a rudimentary type-checking layer for your PHP scripts. In some situations,\
    \ you might be pulling a number from a query string variable, a page number or\
    \ item number for example. If you want to make absolutely sure it’s a number you’re\
    \ using, and not something potentially more evil — like a SQL injection attack\
    \ — you have two options.\n\nThe first and most commonly used method is adding\
    \ extra code to your PHP scripts to actually check if the $_GET parameter indeed\
    \ holds a number. For example, you might have the URL:\n\n```\nhttp://www.domain.com/article.php?page=2\n\
    ```\n\nURLs such as this are often found in paginated content, usually in page-navigation\
    \ links. Somewhere in the code that loads the specified page of the article, you\
    \ might see the following:\n\n```\n<?php\nif (isset($_GET['page']) and is_numeric($_GET['page']))\n\
    {\n     $page = $_GET['page'];\n}\nelse\n{\n     $page = 1;\n}\n\n// And so on....\n\
    ?>\n```\n\nThe previous code simply checks first for the existence of a specific\
    \ $_GET value, in this case ‘page’, and then checks if the value passed is indeed\
    \ a number — if not, a default value of one is assigned.\n\nSuch type-checking\
    \ is a good idea, and helps shield your PHP scripts from nasty script kiddies\
    \ who want to break your website. Unfortunately, it can become somewhat tedious\
    \ requiring your PHP scripts to check whether or not the value was set, and if\
    \ it was indeed a number.\n\nUsing mod_rewrite, you can eliminate the type checking\
    \ from your PHP code — all you have to do is ensure the pattern matches only numeric\
    \ values:"
  merge: -1
  img_proc: true
- pgno: 160
  md: '# Apache Tricks


    ```

    RewriteEngine On

    # Ensure only numeric values for the page

    RewriteRule ^article/([0-9]*)/? article.php?page=$1

    RewriteRule ^article/[^0-9]*/? article.php?page=1

    ```


    The first RewriteRule checks for any valid URLs in the form of article/page/,
    and translates the given request into the call to the PHP script. The second RewriteRule
    is set up to catch all malformed URLs calling for an article, but giving an invalid
    value for the page number. Any such request is automatically assigned the first
    page in the article.


    There are two things to note in the previous set of RewriteRules. First, both
    rules are processed in order; processing does not stop at the first rule, but
    continues through all rules given. Second, the redirection to the article.php
    script is handled internally—no HTTP redirect/moved status code is sent to the
    client at all. In order to alter these default behaviors, you can use a set of
    flags at the end of each rule.


    # RewriteRule Flags


    In order to control the ways that mod_rewrite handles and processes each RewriteRule,
    you have a set of 15 different flags that you can add following each rule. Flags
    are contained within brackets, and multiple flags can be provided in a comma-separated
    list—all within a common set of brackets. For example:


    ```

    # Rewrite /category/item/ to catalog.php

    RewriteRule ^(\w+)\\/(\w+)\\/? catalog.php?cat=$1&item=$2 [NC, R,L]

    ```


    # nocase | NC


    Similar to the i flag in PHP’s PCRE syntax, the nocase flag makes the pattern
    case-insensitive. For example, the following two patterns are identical:


    ```

    RewriteRule ^([A-Za-z-]+)/? catalog.php?cat=$1

    RewriteRule ^([a-z]+)/? catalog.php?cat=$1 [NC]

    ```


    # redirect | R [=code]


    Normally mod_rewrite uses an internal Apache redirect when rewriting URLs, and
    this redirection is invisible to the user. If instead you wanted to do a formal
    redirect, complete with HTTP status code, you can use the redirect or R flag.
    By default, the redirect flag sends a HTTP 302 Moved Temporarily code, such as
    in the following rule:


    ```

    RewriteRule ^article/(/d+)\\/? article.php?page=$1 [R]

    ```


    If you wanted to change the status code to a HTTP 301 Moved Permanently, or any
    other status code between 300 and 400, you simply add the code to the end of the
    redirect flag:


    ```

    RewriteRule ^article/(/d+)\\/? article.php?page=$1 [R=301]

    ```


    # forbidden | F


    Similar to the redirect flag, using the forbidden flag immediately sends a HTTP
    403 Forbidden response to the client. Whenever both a redirect flag and forbidden
    flag are present for the same rule, the forbidden flag will have priority (the
    redirect will be ignored, 403 sent).'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# Chapter 6


    # gone|G


    Another HTTP status code control flag, `gone`, sends a response of HTTP 410 Gone,
    to inform the client the page no longer exists. When combined, the `gone` flag
    has precedence over the `redirect` flag, but not the `forbidden` flag.


    # last|L


    To stop the processing of RewriteRules after a successful match is found, you
    use the `last` flag. In the previous example dealing with processing article page
    numbers, the rule processing would still continue to the second rule (but not
    find a match), even if the first rule was a successful match. To stop the processing
    after the first rule matched, you could simply use the `last` flag:


    ```

    ```

    RewriteEngine On

    # Ensure only numeric values for the page

    RewriteRule ^article/([0-9]*)/?  article.php?page=$1 [L]

    RewriteRule ^article/([0-9]*)/?  article.php?page=1  [L]

    ```

    ```


    # next|N


    The `next` flag restarts the rewriting process at the beginning of the rule list.
    When the rules are re-processed, the URL matched is not the original request from
    the client, but the internally rewritten URL at the point where the `next` flag
    was used. For example:


    ```

    ```

    RewriteRule  ^article/(\\d+)/?  article.php?page=$1

    RewriteRule  ^catalog/(\\w+)/?  catalog.php?cat=$1  [N]

    RewriteRule  ^catalog/(\\w+)/(\\w+)/? catalog.php?cat=$1&item=$2

    ```

    ```


    In this example, if a URL is called that matches the second rule, such as `http://localhost/catalog/stuff`,
    rewriting will stop processing at that point and automatically restart at the
    beginning of the rule set, using the new substituted URL, `catalog.php?cat=stuff`.
    The substituted URL is then itself filtered through the whole rule set.


    Care should be taken when using the `next` flag, as infinite loops are possible.


    # chain|C


    If you wanted to treat a block of rules as a single related unit, similar to the
    `try...catch` syntax in PHP, you can use the `chain` flag. When using the `chain`
    flag, if a rule matches, the processing continues as expected and ignores the
    `chain` flag. If a rule does not match and a `chain` flag is present, all of the
    following rules that are chained together will be skipped as a whole block. For
    example, the following set of rules skips to the last rule if the first one does
    not match:


    ```

    ```

    RewriteRule  ^article/(\\d+)/?  article.php?page=$1 [C]

    RewriteRule  ^catalog/(\\w+)/?  catalog.php?cat=$1  [C]

    RewriteRule  ^catalog/(\\w+)/(\\w+)/? catalog.php?cat=$1&item=$2


    # Skip to this rule if any of the above don''t match

    RewriteRule  ^article/(^\\d+)/?  error.php

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 162
  md: '**skip|$=number**


    This flag allows you to skip the next number of rules when the current rule matches.
    While the behavior of the skip flag is similar to the chain flag, it behaves in
    exactly the opposite manner — skip jumps on a successful match; chain jumps on
    a failed match.


    **type|T=mime-type**


    If you want to override the MIME type sent for a document, you can use the type
    flag. For example, if you have a bunch of .xhtml files you want to serve up using
    a proper XHTML MIME type, instead of text/HTML, you could use the following:


    ```

    RewriteRule `^.+\.xhtml$ - [T=application/xhtml+xml]`

    ```


    **cookie|CO=name:value:domain[:lifetime[:path]]**


    The cookie flag, as you might infer, sets a cookie on the client’s browser. The
    three required fields— name, value, and domain—specify the name of the cookie,
    the value of the cookie, and the domain for which the cookie is set. The optional
    lifetime parameter represents the life of the cookie, in minutes. The path parameter
    sets the path of the cookie.


    For example, if you wanted to set a cookie named previous visit to signify a user
    has visited the home page before (and shouldn’t be bothered with splash screens),
    you could use this:


    ```

    RewriteRule `^index\.php$ - [CO=prevvisit:true:domain.com]`

    ```


    **env|E=var:value**


    The env flag allows you to set an environment variable var to the value provided.
    The value can also contain regular expression backreferences ($1 and $n) for more
    complex variable control. Multiple environment variables can be set in one group
    of flags—they just need to be comma-separated like the rest of the flag list.


    **qsa|append|QSA**


    In most situations when you’ll use mod_rewrite, anything provided as a query-string
    to the original URL is dropped when you perform a rewrite. If you want to preserve
    that information instead of dropping it, you can use the qsa|append flag. When
    using this flag, the rewrite engine simply takes the original query string and
    appends it to any new query string provided in the rewrite. For example:


    ```

    RewriteRule `^index\.php$ index.php?foo=bar [QSA]`

    ```


    This rule would change the index.php file, using the URL index.php?moo=cow, to
    be index.php?foo=bar&moo=cow.


    In the event that a query-string parameter in the original URL shares the same
    name as a parameter in the RewriteRule, the original value takes precedence.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# noescape | NE


    When mod_rewrite performs its transformations, it goes to great lengths to make
    sure special characters in the rewritten URL are escaped before performing any
    internal or external redirection. For example:


    ```

    RewriteRule  ^some dir/?  index.php?page=foo\%3b  [R]

    ```


    Given this rule, Apache would redirect the some dir/ directory as requested, and
    the $\_GET value for page will be a “safe” escaped value of foo\%3b—mod\_rewrite
    has escaped the \%3b value instead of replacing it with its semicolon substitute.
    To tell mod\_rewrite to avoid any automatic escaping, you use the noescape flag:


    ```

    RewriteRule  ^some dir/?  index.php?page=foo\%3b  [R, NE]

    ```


    Given this rule, the new value of the page query-string parameter will be foo;.


    # passthrough | PT


    Use the passthrough flag when you want to combine mod\_rewrite with other Apache
    modules that provide similar URL-handling functionality, such as mod\_alias. For
    example, if you wanted to rewrite /foo to point to /bar, and then use mod\_alias
    to translate /bar to /baz, you might try the following:


    ```

    RewriteRule  ^/foo  /bar

    Alias  /bar  /baz

    ```


    Unfortunately, because of the way Apache handles URLs internally, it would not
    work as written. To make it work, add the passthrough flag:


    ```

    RewriteRule  ^/foo  /bar  [PT]

    Alias  /bar  /baz

    ```


    A general rule of thumb is to use passthrough if you are using more than one URL
    translating module to process a file.


    # nosubreq | NS


    Use the nosubreq flag to force the rewrite engine to skip a rule if the request
    is actually an internal sub-request. When using PHP and Apache together, there
    are seldom situations when this flag is actually needed. There are, however, some
    CGI scripting instances where this flag comes into play. For more information,
    see the Apache manual section on RewriteRule: http://httpd.apache.org/docs/2.0/mod/mod_rewrite.html#rewriterule.


    # proxy | P


    The proxy flag tells the rewrite engine to stop processing the rule-set immediately
    and force the request through the Apache proxy module, mod\_proxy.


    With all this attention being given to RewriteRule, you might think that it’s
    the main force behind mod\_rewrite. In reality, its best role is part of the dynamic
    duo that is RewriteRule and RewriteCond.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# # RewriteCond


    The `RewriteCond` directive behaves much like PHP''s `if ( )` statement: it tests
    a string against a pattern or condition. If the input matches the pattern or string,
    the `RewriteRule` immediately following the `RewriteCond` directive is processed.
    The general format for `RewriteCond` is as follows:


    `RewriteCond TestString CondPattern`


    `TestString` is the string you are evaluating, and `CondPattern` is the regular
    expression or comparison value to check against.


    # ## RewriteCond Usage


    The most common way that `RewriteCond` is used is to match the input string against
    a regular expression, similar to `RewriteRule`. However, when you use `RewriteCond`,
    you have access to a good number of server variables, so your input string can
    be more complex than a simple filename match. The following tables list the server
    variables are available to use in `RewriteCond`.


    The following are the HTTP Header variables:


    | HTTP_USER_AGENT | A string listing the broswer''s identfying information, such
    as: Mozilla/4.0 (compatible; MSIE 6.0; Windows NT 5.1; SV1;, NET CLR 1.1, 4322)
    |

    |---|---|

    | HTTP_REFERER | The previous page visited by the user, as reported by their browser
    |

    | HTTP_COOKIE | Any cookie string that was part of the request |

    | HTTP_FORWARDED | Contains any forward information if the request is handled
