    \ The New Zealand Map Grid employed in the present example was empirically determined\
    \ and the resulting latitude/longitude-northing/easting mapping involves such\
    \ things as evaluating a six-degree complex polynomial. (The precise specification\
    \ from the Surveyor-General’s Office is available as OGS Technical Report 4.1,\
    \ and can be obtained from the LINZ website.) It’s not relevant to the objective\
    \ of this example, any more so than the exercise of mapping landmarks and delivery\
