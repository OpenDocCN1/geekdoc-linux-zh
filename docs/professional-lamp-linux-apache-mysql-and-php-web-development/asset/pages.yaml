    \ I get times of 6.58 and 1.71 seconds. The variability is due to the fact that\
    \ the computer I am running on is doing more than simply running the script. It\
    \ has other demands on its time, and the time it spends on those other demands\
    \ gets included in how long it takes for this script to complete. When the script\
    \ was run for the first time, the operating system would have had to organize\
    \ space in memory for PHP, the script, and its data, with some of that organization\
    \ occurring while the script was running (most of it would have occurred before\
    \ the script began executing, however, and so wouldn’t appear in the timings).\
    \ But the second run, immediately afterwards, would be in an environment where\
    \ there was already a suitable block of free space, and so it started up much\
    \ faster.\n\nThe upshot of this is that you can’t trust the results of just one\
    \ run: there are too many ways for the timings to fluctuate, and many of them\
    \ are out of your control. What is necessary is to run the script — from start\
    \ to finish — several times, and take averages of the result. For interpolation,\
