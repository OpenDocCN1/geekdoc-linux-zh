  md: '# Chapter 9


    The best time to performance-tune a program is before it''s written. When building
    a site, test, experiment, and gain experience in the various ways it could be
    designed, and the pros and cons of each. Choosing the right framework at the beginning
    will have a much bigger influence on the speed of the final product than any amount
    of code tweaking after the fact. Keep testing, experimenting, and gaining experience,
    and keep looking at the big picture, because neither hardware nor software technology
    is standing still. Processors will be faster, memory will be cheaper, network
    connections will be more capacious, web servers will be more efficient, web browsers
    will be more sophisticated, and PHP will have more features to develop with.'
