  md: "# Apache Tricks\n\n```\n```\ncp testcert.cert /etc/apache/ssl.crt/testcert.crt\n\
    cp testcert.key /etc/apache/ssl.key/testcert.key\n```\n```\n\nThen, create a directory\
    \ that will house your new SSL website:\n\n```\n```\nmkdir -p /wwwssl\n```\n```\n\
    \nYou can use whatever path you like, or even an existing path—just remember or\
