    \ $temp);\n```\n```\n\nThe first argument to `array_map()` is the name of the\
    \ callback function, so make the first argument of `$temp` that callback (in this\
    \ case, a null callback). This is why I needed the temp variable; `array_push()`\
    \ modifies the original array rather than returning a copy. I could have lived\
