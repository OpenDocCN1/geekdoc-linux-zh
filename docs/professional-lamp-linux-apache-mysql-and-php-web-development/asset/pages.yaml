    > Notice that the *SHA1* function is used on the password in the statement, instead
    of the **PASSWORD()** function. With *mod_auth_mysql* you can use a handful of
    encryption methods for the password — this example, just happens to use *SHA1*.


    # ## Installing the Module


    Once you have your database table set up, you''ll need to actually download the
    source for **mod_auth_mysql**, available at `http://modauthmysql.sourceforge.net`.
    At the time of this writing, the current version was **2.9.0**, so you would download
    **mod_auth_mysql-2.9.0.tar.gz**.


    After you''ve downloaded the module source, extract the tarball:


    ```

    ```

    tar -xvzf mod_auth_mysql-2.9.0.tar.gz

    ```

    ```


    Once the tarball is extracted, change directories to the newly created source
    folder:


    ```

    ```

    cd mod_auth_mysql-2.9.0

    ```

    ```


    To build the module from the downloaded source code, you''re actually going to
    use Apache''s **apxs** command directly. Execute the following command, using
    the path to your apxs binary on your system; the default Apache location of `/usr/local/apache2/bin`
    is used here:


    ```

    ```

    /usr/local/apache2/bin/apxs -c -lmySQLclient -lm -lz mod_auth_mysql.c

    ```

    ```


    If the build is successful, you should see a couple of compilation lines, and
    no errors. If, instead, you get an error about a missing **mysql.h** file, and
    a whole slew of **MySQL**-related errors, you might need to manually specify the
    paths to the **MySQL** libraries and include files. Using the default locations
    from **MySQL**, your command might instead look like this:


    ```

    ```

    /usr/local/apache2/bin/apxs -c -lmySQLclient -lm -lz \

    -L /usr/local/mysql/lib/mysql \

    -I /usr/local/mysql/include/mysql \

    mod_auth_mysql.c

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# Apache Tricks


    To install the newly compiled module, you’ll need to execute the following command
    as root. As usual, change the path to apxs to point to your apxs binary:


    ```

    /usr/local/apache2/bin/apxs -i mod_auth_mysql.la

    ```


    The next installation task you need to perform is to add the necessary command
    to load the module in httpd.conf. To do this, open your httpd.conf file, find
    a suitable location to add a module definition—usually at the very end of the
    configuration file, or next to other LoadModule statements—and add the following:


    ```

    LoadModule mysql_auth_module modules/mod_auth_mysql.so

    ```


    Finally, restart Apache.


    # # Configuration and Usage


    Once you have your database tables ready and modules installed, all that remains
    is to tell Apache what needs to be protected. Like standard Apache basic authentication,
    you’ll need to add some configuration directives to either a `<Directory>` section
    in httpd.conf, or create a .htaccess file in the directory you choose to protect.


    Telling Apache to validate user credentials against your MySQL database would
    usually involve the following at a minimum:


    ```

    AuthName"<zone name>"

    AuthType Basic

    AuthMySQLDB dbname

    AuthMySQLUser userid

    AuthMySQLPassword password

    AuthMySQLEnable On

    require valid-user

    ```


    The first two lines and the last line of these directives should already be familiar
    to you. They simply define the name of the protected area, the type of authentication,
    and that any valid user found in the checked resource is allowed access. The other
    lines tell Apache where to find the authentication information. Instead of giving
    Apache the name of a file that contains the passwords for each valid user, you’re
    supplying database information—database name, username, and password—so that Apache
    and mod_auth_mysql know where to look. The sixth line, AuthMySQLEnable On, simply
    tells Apache to actually use mod_auth_mysql—it’s a way to disable MySQL authentication
    without having to completely unload or remove the module.


    To use the authentication tables you created earlier, you would add the following
    in your `<Directory>` or .htaccess definitions:


    ```

    AuthName"MySQLAuth"

    AuthType Basic

    AuthMySQLDB apacheauth

    AuthMySQLUser apache

    AuthMySQLPassword apachePASS

    AuthMySQLEnable On

    AuthMySQLPwEncryption sha1

    require valid-user

    ```'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# # Chapter 6


    Here, you’re telling Apache and mod_auth_mysql to authenticate users against your
    apacheauth database. Apache will be logging into the database using the apache
    account you created earlier, and you’re also telling mod_auth_mysql to hash the
    given password with SHA1, before matching it against the value in the database.


    At this point, you should be able to log into your protected area via a web browser,
    supply the user credentials added to the user_info table (testuser:testpass),
    and be successfully authenticated in the directory.


    While this example is rather simplistic and stripped down, mod_auth_mysql actually
    provides a boatload of configuration options, so you can customize your authentication
    for nearly any situation. The following sections describe some of the configuration
    options.


    # ## AuthMySQLEnable On | Off


    This enables or disables mod_auth_mysql authentication, without you having to
    remove or unload the module from Apache directly.


    # ## AuthMySQLHost localhost | hostname | ipaddress


    This is the hostname or IP address of the MySQL database server. If your environment
    runs Apache and MySQL on different machines, you’ll need to use this. The default
    value is localhost, so machines running both Apache and MySQL can usually ignore
    this setting.


    # ## AuthMySQLPort port_number


    This is the TCP/IP port on which MySQL is listening. The default value for MySQL
    is port 3306, but can be changed. The default value for this option is also 3306,
    so the option needs to be specified only if MySQL is listening on a nonstandard
    port.


    # ## AuthMySQLSocket socket_file_path


    This is the UNIX socket file used to access MySQL on a UNIX machine. The default
    value is /tmp/mysql.sock, and like AuthMySQLPort, it needs to be used only in
    nonstandard installations.


    # ## AuthMySQLUser userid


    This is the user ID used to access the MySQL database holding the authentication
    information. Most database systems will not allow users or the Apache process
    to access the database without a proper userid / password combination, so set
    this along with AuthMySQLPassword to a non-root user account that has access to
    the authentication tables. At a minimum, the user will need SELECT access to the
    authentication tables.


    # ## AuthMySQLPassword password


    Used in conjunction with AuthMySQLUser, this option specifies the password for
    the user account accessing the MySQL authentication tables.


    # ## AuthMySQLDB dbname


    This is the name of the database in MySQL that holds the authentication tables.
    If no name is specified, the default value of test will be used.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# **AuthMySQLUserTable** *table_name*


    This is the name of table in the database that holds the usernames and passwords.
    If no table is specified, the default value of `user_info` is used.


    # **AuthMySQLNameField** *column_name*


    This is the name of the column in the user table (`AuthMySQLUserTable`) that holds
    the usernames. When creating the tables in MySQL, ensure that this column has
    an index or key, ensuring each value is unique. The `*length*` of the column is
    whatever you decide it should be in MySQL. The default value is `user_name`.


    # **AuthMySQLUserCondition**


    When `mod_auth_mysql` performs a user lookup, it performs a simple SQL SELECT
    statement, with any criteria needed to perform a match. The `AuthMySQLUserCondition`
    field allows you to specify extra parameters to be used in the `WHERE` clause
    of the SQL statement.


    # **AuthMySQLPasswordField** *column_name*


    This is the name of the column in the user table that holds the users'' passwords.
    The length of the column in MySQL should be at least as long as the encrypted
    password hash. The default value for `AuthMySQLPasswordField` is `user_password`.


    # **AuthMySQLPwEncryption** `none` | `crypt` | `scrambled` | `md5` | `aes` | `sha1`


    This is the method of encryption used when encoding the passwords in the database,
    as follows:


    +   * `none`: No encryption/plain text

    +   * `crypt`: UNIX `crypt()` encryption

    +   * `scrambled`: MySQL `PASSWORD()` encryption

    +   * `md5`: MD5 hashing

    +   * `aes`: Advanced Encryption Standard (AES) encryption

    +   * `sha1`: Secure Hash Algorithm (SHA1)


    If no value is specified, the default value of `crypt` is used.


    When using AES password encryption, make sure the password field in your MySQL
    user tables is a BLOB type, not a CHAR, VARCHAR, or BINARY type. Unless the column
    type is one of the BLOB variations, MySQL will strip any extra encoded characters
    from the encrypted passwords—and you''ll never be able to match the given password
    to the database values.


    # **AuthMySQLSaltField**


    This allows you to specify one of three values to use as the “salt value” when
    encrypting passwords. A value of `<>` tells `mod_auth_mysql` to use the password
    itself as the salt field. A value of `<string>` uses the value of `string` as
    the salt field. Any string not surrounded by less-than/greater-than symbols is
    treated as the name of a database column, the value of which is used as the salt
    field.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# Chapter 6


    # **AuthMySQLGroupTable**


    This is used to set the name of the table containing group information, when Apache
    is told to check groups instead of individual users (*require group* versus *require
    valid-user*).


    # **AuthMySQLGroupCondition**


    Similar to `AuthMySQLUserCondition`, this directive allows you to specify conditional
    statements to include in the **WHERE** clause when matching user groups.


    # **AuthMySQLGroupField**


    This is the name of the field in the database that contains the group names. This
    field is used when matching groups using Apache''s *require group* directive.


    # **AuthMySQLAuthoritative**


    This tells Apache whether or not to fallback to other modules if MySQL authentication
    fails.


    # # Apache and SSL


    Protecting your web folders with Basic Authentication by using either `htpasswd`
    or `mod_auth_mysql` increases security. Unfortunately, that added layer of security
    afforded by Basic Authentication can be eliminated by a serious hacker looking
    to break into your system. The problem: when you use Basic Authentication on a
    standard server, the username and password are actually transmitted unencrypted
    from the client to the server. A network-savvy hacker could be monitoring the
    transmission between your machine and the server, and sniff out the plain-text
    passwords as they zing by.


    The solution: encrypt the communication between the client and the server. In
    Apache, this can be achieved by using Secure Sockets Layer (SSL). SSL in Apache
    comes in the form of `mod_ssl`, an Apache module that SSL-enables a website that
    Apache controls, allowing any communication to and from Apache to be encrypted
    using a wide range of encryption schemes.


    To enable SSL in Apache, first check to see if SSL is included in your existing
    Apache binary or as a loadable module:


    ```

    /path/to/httpd -l

    ls /path/to/apache/modules/

    ```


    If you don''t see `mod_ssl.c` in the first command output or `mod_ssl.so` in the
    listing of the Apache modules, you''ll need to build Apache SSL functionality
    yourself. To statically enable SSL, add `-enable-ssl` to your Apache `configure`
    script when building from source:


    ```

    ./configure \\

    --enable-ssl \\

    # ...and any other configure settings you use

    ```'
  merge: -1
  img_proc: true
- pgno: 180
  md: "# Apache Tricks\n\nIf you want to use the dynamic module instead, just add\
    \ `#shared` at the end of the SSL-enabling line:\n\n```\n./configure \\\n    --enable-ssl=shared\
    \ \\\n    # ...and any other configure settings you use\n```\n\nThen, build and\
    \ install the new Apache binary and modules using `make` and `make install`. If\
    \ you built Apache as a dynamic module, enable it in httpd.conf by adding the\
    \ following line in the global configuration section:\n\n```\nLoadModule ssl_module\
    \ modules/mod_ssl.so\n```\n\nNow you might be thinking it’s time to restart Apache\
    \ and configure Apache, but you’re not quite done setting up your SSL. Before\
    \ SSL will work, you need to have a server key and server certificate that will\
    \ be used to encrypt transmitted data, and present the client/browser with an\
    \ SSL certificate.\n\nIn the next few steps, you’ll create your own self-signed\
    \ certificate for use on your web server. If you already have an SSL certificate\
    \ from a bona fide Certificate Authority (CA), you should use that if possible.\
    \ What exactly is the difference, you might wonder? Any self-signed certificate\
    \ is not considered truly secure, and will trigger a warning in a user’s browser,\
    \ something like “Your browser does not recognize the Certificate Authority that\
    \ issued the site’s certificate.” A certificate from a proper CA is recommended\
    \ if you’re doing any sort of commerce or secure transaction.\n\nTo begin the\
    \ certificate creation process, start by creating a private key and certificate\
    \ request:\n\n```\nopenssl req -new > testcert.csr\n```\n\nThis shows the following\
    \ on the screen, including prompts:\n\n```\nGenerating a 1024 bit RSA private\
    \ key\n......................................................++++\n.................++++\n\
    writing new private key to 'privkey.pem'\nEnter PEM pass phrase:\nVerifying -\
    \ Enter PEM pass phrase:\n\n\nYou are about to be asked to enter information that\
    \ will be incorporated\ninto your certificate request.\nWhat you are about to\
    \ enter is what is called a Distinguished Name or a DN.\nThere are quite a few\
    \ fields but you can leave some blank\nFor some fields there will be a default\
    \ value,\nIf you enter ‘’, the field will be left blank.\n-----\nCountry Name\
    \ (2 letter code) [AU]:US\nState or Province Name (full name) [Some-State]:Ohio\n\
    Locality Name (eg, city) []:Cincinnati\nOrganization Name (eg, company) [Internet\
    \ Widgits Pty Ltd]:TestSSL\nOrganizational Unit Name (eg, section) []:SSL Testing\
    \ Department\nCommon Name (eg, YOUR name) []:www.example.com\nEmail Address []:youremail@example.com\n\
    ```"
  merge: -1
