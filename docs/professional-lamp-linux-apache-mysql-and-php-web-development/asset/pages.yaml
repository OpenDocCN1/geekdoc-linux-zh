- pgno: 149
  md: "# # Chapter 5\n\nThe next method you encounter is `checkConfigAccess()`. This\
    \ method checks to see if the XML configuration file actually exists on the filesystem,\
    \ and if it does, it checks then to see if it is readable. If the file does not\
    \ exist or is not readable, an error message is added to the `message` property.\
    \ Note that `clearstatcache()` is called at the end of the method. The results\
    \ of `file_exists()` and `is_readable()` are cached by PHP, so it’s a good idea\
    \ to clear the result cache when you are finished, to prevent erratic results\
    \ later on:\n\n```\n```php\nprivate function checkConfigAccess()\n{\n    $returnValue\
    \ = false;\n\n    // Check to see if config file exists and is readable\n    if\
    \ (file_exists($this->xmlfile) and\n        is_readable($this->xmlfile))\n   \
    \ {\n        $returnValue = true;\n    }\n    else\n    {\n        $this->message\
    \ .= \"Warning: \" .\n                          \"Could not access config file.\\\
    n\";\n    }\n\n    // Clear cached filesystem lookups\n    clearstatcache();\n\
    \n    return $returnValue;\n}\n```\n```\n\nNext up, `checkDeps()`. As the name\
    \ implies, this method checks dependencies of the class itself. For `XMLConfigProcessor`,\
    \ the only non-standard PHP requirement is availability of the SimpleXML extension.\
    \ If you decided later to modify this class to use the XML Parser functions or\
    \ DOM XML extension, for example, you would add the requisite checks to this method.\n\
    \nTo check for SimpleXML, you simply use the `extension_loaded()` function covered\
    \ earlier in this chapter. If SimpleXML is not available, add another error message\
    \ to the pile:\n\n```\n```php\nprivate function checkDeps()\n{\n    $returnValue\
    \ = true;\n\n    // Check for SimpleXML\n    if (!extension_loaded('SimpleXML'))\n\
    \    {\n        $returnValue = false;\n        $this->message .= \"Warning: \"\
    \ .\n                          \"SimpleXML extension not available.\\n\";\n  \
    \  }\n\n    return $returnValue;\n}\n```\n```"
