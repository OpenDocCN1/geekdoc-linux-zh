- pgno: 314
  md: '# Caching Engines


    | Directive | Default | Set In | Description |

    |---|---|---|---|

    | apc.enabled | 1 (enabled) | php.ini, httpd.conf, .htaccess, and user scripts
    | Enables or disables APC using the values 1 or 0, correspondingly. When in php.ini,
    this setting is really only useful if APC is statically compiled into PHP — when
    installing APC as you did earlier, you can simply comment out the extension="apc.so"
    line. This setting is, however, changeable in user scripts and .htaccess files,
    so you can use it to enable/disable the caching engine in individual scripts and
    directories. |

    | apc.shm_segments | 1 | php.ini and httpd.conf | Using numeric values, you can
    specify the number of shared memory segments used by APC. Many operating systems
    have a limit, often low, on how large each shared memory segment can become. If
    APC is running out of memory, increasing this value will cause APC to use more
    segments, to help get around operating system limitations. |

    | apc.shm_size | 30 | php.ini and httpd.conf | The size of the APC shared memory
    segment, in MB. Depending on the operating system, there may be size limitations,
    often low. Check your operating system documentation for more information about
    its shared memory segment size. |

    | apc.optimization | 0 (off) | php.ini, httpd.conf, .htaccess, and user scripts
    | An experimental setting, this directive controls APC’s built-in optimizer. The
    aggressiveness of the optimizer increases as the value for this setting increases.
    A value of 0 disables optimization altogether. |

    | apc.num_files_hint | 1000 | php.ini and httpd.conf | This setting provides APC
    with a hint about how many separate source files your website serves on a regular
    basis. |

    | apc.ttl | 0 | php.ini and httpd.conf | Defines the number of seconds each cache
    entry is allowed to persist in the cache before a newer entry is allowed to overwrite
    it. If left at 0, the cache can fill up with stale entries, preventing newer entries
    from being cached. |

    | apc.gc_ttl | 3600 | php.ini and httpd.conf | Defines the number of seconds each
    cache entry remains on the garbage-collection list. Serves as a failsafe in situations
    where a server process dies, leaving a cached file stranded in the cache. A value
    of 0 disables this feature. |


    Table continued on following page'
