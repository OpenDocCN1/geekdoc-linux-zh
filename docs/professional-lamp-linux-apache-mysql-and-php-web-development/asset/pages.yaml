- pgno: 106
  md: 'That’s not quite right. What happened in this situation is actually a different
    kind of join called a *cross join*. A cross join is simply a combination of every
    matching result in each table. In this case, there were five models in the Models
    table, so each one of those rows was matched up against *every single row* in
    the *New_Vehicles* table. This happened simply because you left off the WHERE
    statement, which provided the hint to MySQL about how to link records together.
    As previously noted, you didn’t include the *Makers* table partying this query
    — if you had, the resulting rows would have been five times as long, as there
    are five distinct makes in your database.


    # Outer Joins


    While most complex linking can be achieved using inner joins, there are some situations
    where they are limited. If a database row does not have a value defined for the
    column being linked, it will be ignored by inner joins. In the vehicle inventory
    example, every time you queried the table using an inner join to link the *Models*
    table, only three rows were returned. The fourth vehicle in the *New_Vehicles*
    table was ignored, because its value for *model_id* was null. What you need is
    a way to return all rows, whether or not there is a *model_id* specified, and
    if a *model_id* is specified, perform the requested joins. For such a task, MySQL
    provides *outer joins*.


    There are two main types of outer joins in MySQL: left outer joins and right outer
    joins. They behave identically, the only difference pertaining to which table
    is allowed to not contain matches. The generic form of an outer join is very similar
    to inner joins. Take this simplified version of a left outer join:


    ```

    SELECT [column names] FROM table1 LEFT OUTER JOIN table2 USING [column list]

    ```


    The left outer join matches the "right" table (*table2*) against the "left" table
    (*table1*) using a common column name or names, but will still return rows if
    the "left" table contains a value that doesn’t match any in the "right" column.
    A right outer join behaves the same way, but with the roles of the two tables
    reversed (non-matching values are allowed in the right table).


    In the vehicle inventory example, if you wanted to return a set of rows where
    all new vehicles were returned, regardless of their *model_id*, you might use
    the following:


    ```

    SELECT mo.model_name, n.color, n.modelyear FROM New_Vehicles n LEFT OUTER JOIN
    Models mo USING (model_id);

    ```


    Querying the vehicle inventory database with this query produces the following:


    ```

    + model_name | color | modelyear

    + Exploror | Dark Blue | 2005

    + NULL | Graphite Pearl | 2004

    + Tacona | Radiant Red | 2005

    + Corvette | Daytona Sunset Orange Metallic | 2005

    + Exploror | Dark Blue | 2005

    +```


    This is very similar to one of the earlier inner join queries you looked at, but
    with the addition of the second row — Graphite Pearl, from the 2004 model year.
    Because there was no match in the *Models* table, MySQL returns NULL for the values
    in the row that could not be determined — in this case, *model_name*.'
  merge: -1
