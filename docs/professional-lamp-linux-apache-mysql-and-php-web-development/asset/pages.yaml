- pgno: 88
  md: '# ## More Obscure PHP


    +   -   `stream_write()`:Again, this function should be called only if the stream
    is actually writable. It is the stream object''s responsibility to keep track
    of what it is doing from one write to the next. You need not write *all* the bytes
    you are passed; you may truncate the data if necessary. In any case, this method
    should return the number of bytes that *were* written (including 0 if none could
    be written at all). This number should be in terms of the bytes that it receives.
    A stream that carries out base64 *encoding* would return four bytes for every
    three it receives. If asked to write "abc" it would write "YWJJ" yet return 3.
    This return value is for the benefit of the caller, after all, which by definition
    isn''t supposed to be intimate with the operation of the “caller.” If you do write
    fewer bytes than requested, it is the caller''s responsibility to decide whether
    or not to try again, but your stream may need to retain some data in any case.
    The base64 encoder is an example of this: having been passed "ab" it would be
    able to write "YWJ," but the last two bits of the "b" have to be retained while
    the stream waits for the next input byte or a `stream_close()`. This encoder should
    return 1 and expect the "b" to be passed again in the next `stream_write()` call.
    The alternative mechanism is that the encoder doesn''t output anything unless
    it has at least three bytes to encode, and then it only encodes (and outputs)
    multiples of three input bytes at a time. For this to work, the stream would need
    to *claim* to write all the bytes that have been passed in even if it *hasn''t*
    actually done so, and hope that no-one finds out about its subterfuge. Otherwise
    the caller might get upset that it returned 0 when passed "ab" and try again,
    and again, with the encoder waiting for a third byte that it never gets to see.


    +   -   `stream_eof()`: A readable stream could be asked at any time whether or
    not the end of the stream''s data has been reached (especially after `stream_read()`
    returned an empty string for some reason). So this is simply a Boolean function
    that returns "true" if the end of the stream has been reached.


    +   -   `stream_close()`: It is the stream object''s responsibility to tidy up
    anything that needs tidying up, close any streams of its own, and so on. Returning
    to the base64 encoder, there is a better-than-even possibility that the stream
    will be left with one or two bytes that now will never get to be part of a triple.
    So it''s safe to finally encode these and write them out, padding with the requisite
    number of = signs.


    Those are the basics of opening and closing a stream, and reading and writing.
    A stream wrapper has other methods that should be implemented if they are appropriate
    to the protocol and cover such tasks as random access, directory control, and
    so forth.


    When a stream is opened, `stream_open()` is called with the *complete* path as
    its first argument, including the protocol. This is principally so that you can
    use `parse_url()` to break the path into its components, and therefore it is a
    good idea to design your stream name format to use the conventional URL syntax
    where appropriate (scheme://username:password@host:/path?query#fragment). Incidentally,
    it also means that the same stream class can handle more than one protocol, but
    this is better handled by subclassing.


    # # Two Examples of Streams


    To fix the ideas of the previous section, here are two simple stream classes.
    The first maintains a log file that records the activity of files accessed through
    it, while the second is for selecting portions of a geo-graphic aerial photograph
    collection.'
