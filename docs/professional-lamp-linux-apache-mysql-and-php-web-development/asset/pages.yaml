- pgno: 312
  md: '# # 12

    # Caching Engines


    You’ve done your best to clean up your code and reduce processing load in your
    PHP scripts, but you just can’t seem to make your pages fast enough to keep your
    users happy. Time to throw in the towel? Not quite—there’s more performance you
    can get out of your LAMP setup, and caching engines will help you do this.


    When dealing with different caching solutions for PHP5, you have a handful of
    choices. A couple of setups actually cache the internally compiled PHP scripts,
    others cache the generated output, and others still cache the intermediate data
    processing objects. This chapter introduces you to several caching engines, and
    can help you decide which one is right for you.


    # ## Alternative PHP Cache


    Alternative PHP Cache, or APC, is a PHP opcode caching engine, now provided for
    free as part of the PECL/PEAR repository. APC originated with Daniel Cowgill and
    George Schlossnagle, and was released by Community Connect, Inc. After the release
    of PHP5, Yahoo! modified APC to support the new Zend Engine, and it has since
    become part of PECL.


    APC works by taking the compiled code from the PHP runtime engine and storing
    it in shared memory for later access. Each time a script is downloaded, APC checks
    for a version in shared memory first, before recompiling and executing the script
    that resides on disk. Because PHP doesn’t need to recompile the script each time,
    it can greatly speed up the response time—speed increases of over four times or
    greater can be obtained in some situations.


    APC can be installed as either a dynamic shared object (DSO), or built into PHP
    statically. The following section shows you how to install the DSO version, as
    it doesn’t require you to recompile PHP, and provides the flexibility to add or
    remove the DSO at will.'
  merge: -1
  img_proc: true
- pgno: 313
  md: "# ### Installing APC\n\nFirst, grab a copy of the latest version of the APC\
    \ source code from the PECL website: `http://pecl.php.net/package/APC`.\n\nOnce\
    \ you have a copy of the source code in tar/gzip format, extract the package and\
    \ change directory into the newly created source folder:\n\n```\n```\ntar -xzvf\
    \ APC-3.0.5.tgz\ncd APC-3.0.5\n```\n```\n\nNext, run `phpize` in the source folder.\
    \ Be sure to use the correct path to your installed copy of `phpize` that comes\
    \ with PHP:\n\n```\n```/usr/local/bin/phpize```\n```\n\nWhen `phpize` is running,\
    \ you should see output similar to the following:\n\n```\n```\nConfiguring for:\n\
    PHP Api Version:    20031224\nZend Module Api No:  20041030\nZend Extension Api\
    \ No: 220040412\n```\n```\n\nAfter `phpize` is finished, run the following configure\
    \ script, again substituting the proper path to your `php-config` and `apxs` programs:\n\
    \n```\n```\n./configure \\\n  --enable-apc \\\n  --enable-apc-mmap \\\n  --with-apxs=/usr/local/apache2/bin/apxs\
    \ \\\n  --with-php-config=/usr/local/bin/php-config\n```\n```\n\nThen, build the\
    \ shared object:\n\n```\n```\nmake\n```\n```\n\nAfter it is done building, install\
    \ the DSO (as root):\n\n```\n```\nmake install\n```\n```\n\nAt this point, there\
    \ should be a copy of `apc.so` in your PHP extensions folder.\n\nTo complete the\
    \ installation, add the following to the extensions section of your `php.ini`\
    \ file, and then restart Apache:\n\n```\n```\nextension=\"apc.so\"\n```\n```\n\
    \n# ### Configuring APC\n\nIn most situations, the default configuration that\
    \ APC uses should suffice, but if you want to tweak your caching to suit your\
    \ needs or system, you can use the following directives in `php.ini`:"
  merge: -1
