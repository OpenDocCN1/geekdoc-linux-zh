    # ## Summary


    Hopefully with the information in this chapter, you’ll be able to go out and set
    up intricate database schemas, use complex queries, and maintain the whole system
    as well. Armed with these basic tools, there should be very few database obstacles
    you can’t overcome. You might find in your role as a developer that you’ll spend
