  Changes:\ngypsy (0.5-2jaunty1) jaunty; urgency=low\n```\n\n## PPA 重建\n\n用户现在能够通过执行\
  \ `deb http://ppa.launchpad.net/ianlawrence/ppa/ubuntu jaunty main deb-src http://ppa.launchpad.net/ianlawrence/ppa/ubuntu\
  \ jaunty main` 将 PPA 添加到它们的源列表中，然后可以使用 `apt` 安装 PPA 中提供的包。\n\n如果你向你的 Launchpad 账户或团队账户添加了另一个\
