  ## 关于贡献者\n\n**Brian DeLacey** 在 Lotus Development 和 IBM 等公司工作了 15 多年，接触各种计算机和软件语言。在哈佛商学院，他花了八时间研究并撰写关于创新、初创企业和信息技术的文章。他的兴趣包括开源开发、新兴移动\
  \ Web 解决方案以及操作系统的未来。他拥有 MBA 学位和数学学士（A.B.）。\n\n**Felipe Balbi** 过去三年一直开发 Linux 内核驱动程序。他目前在诺基亚公司开发\
  \ Maemo 设备内核，也是 `linux - usb` 社区和 USB OTG 工作组的活跃成员。\n\n**David Cohen** 是计算机科学学士毕业生，目前正在完成同一领域的硕士学位。他从事开源工作已有\
  \ 8 年，过去 5 年一直是 Linux 内核开发者。\n\n目前，他在诺基亚公司工作，为 Maemo 设备内核的开发做出贡献。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
