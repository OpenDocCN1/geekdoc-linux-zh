  \nbapp04.indd 296\n\n10/6/09 8:49:00 AM\n\n# D-Bus：概览\n\n这是位于 http://dbus.freedesktop.org/doc/dbus-tutorial.html\
  \ 的标准 D-Bus 教程的精简版本，该教程由 Havoc Pennington、David Wheeler、John Palmieri 和 Colin Walters\
  \ 编写。\n\nD-Bus 是一个用于*进程间通信*（IPC）的系统。从架构上看，它包含以下几个层：\n\n- 一个库 `libdbus`，允许两个应用程序相互连接并交换消息。\n\
  \n- 一个*消息总线守护进程可执行文件，基于 `libdbus` 构建，多个应用程序可以连接到它。守护进程可以将消息从一个应用程序路由到零或多个其他应用程序。\n\
  \n- 基于特定应用程序框架的*封装库*或*绑定*——例如，`libdbus-glib` 和 `libdbus-qt`。此外还有针对 Python 等语言的绑定。\n\
  \n\n\n\n\n这些封装库是大多数人应该使用的 API，因为它们简化了 D-Bus 编程的细节。`libdbus` 旨在为高层绑定提供低级后端。`libdbus`\
  \ 的大部分 API 仅对绑定实现有用。\n\n`libdbus` 仅支持一对一连接，就像原始网络套接字一样。然而，你并不是在连接上发送字节流，而是发送 `messages`（消息）。消息包含一个用于标识消息类型的头，以及一个包含数据负载的体。`libdbus`\
  \ 还抽象了所使用的具体传输层（套接字或其他），并处理了身份验证等细节。\n\n消息总线守护进程构成了轮心。轮子的每个轮辐都是到使用 `libdbus` 的应用程序的一对一连接。应用程序通过其轮辐向总线守护进程发送消息，守护进程根据情况将消息转发给其他连接的应用程序。将该守护进程想象成路由器即可。\n\
  \n在典型的计算机上会有多个守护进程实例。第一个实例是机器全局的单例，即一个类似于 `sendmail` 或 `Apache` 的系统守护进程。该实例对接受的消息有严格的安全限制，用于系统范围内的通信。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\nbapp05.indd 297\n\n10/6/09\
  \ 8:49:22 AM\n\n附录 E：D-Bus：概述\n\n其他实例为每个用户登录会话创建一个。这些实例允许用户会话中的应用程序相互通信。\n\n系统级和用户用户的守护进程是分开的。正常的会话内\
  \ IPC（进程间通信）不涉及系统消息总线进程，反之亦然。\n\n# D-Bus 应用程序\n\nD-Bus 设计用于两种特定的场景：\n\n*   同一桌面会话中不同桌面应用程序之间的通信；允许整个桌面会话的集成，并解决进程生命周期问题（桌面组件何时启动和停止运行？）\n\
  *   桌面会话与操作系统之间的通信，其中操作系统通常包括内核以及任何系统守护进程或进程。对于桌面会话内部用例，`GNOME` 和 `KDE` 桌面在 `CORBA`\
  \ 和 `DCOP` 等不同的 IPC 解决方案方面拥有丰富的经验。D-Bus 基于这些经验构建，并为了满足这些桌面项目的需求而定制。\n\n系统级或与操作系统通信的情况所解决的问题，通过\
  \ Linux Hotplug 项目的以下文字解释得最好：\n\n> 当前 Linux 支持的一个空白是，任何种带有动态“与用户交互”组件的策略目前都不支持。例如，在第一次连接网络适配器或打印机时通常需要此类功能，以及确定挂载磁盘驱动器的合适位置。似乎对于任何可以识别出负责的人类的情况，此类操作都可以得到支持：单用户工作站，或任何通过远程管理的系统。\n\
  \n这是一个经典的“远程管理员”问题，在这种情况下，热插拔需要将事件从一个安全域（在本例中为操作系统内核）传递到另一个安全域（已登录用户的桌面或远程管理员）。任何有效的响应必须向反方向进行：即由远程域采取某些操作，让内核暴露所需的设备功能。（该操作通常可以异步执行——例如，让新硬件保持空置直到会议结束。）在编写本文时，Linux\
  \ D-Bus 基于这些经验构建的，并为了满足这些桌面项目的需求而定制。\n\n## 原生对象与对象路径\n\n你的编程框架定义了什么是“对象”，通常通过基类来实现——例如：`java.lang.Object`、`GObject`、`QObject`\
  \ 或 Python。我们称其为原生对象。低级 D-Bus 协议及相应的 `libdbus` API 并不关心原生对象。\n\n然而，它提供了一种名为对象路径（object\
  \ path）的概念。对象路径的想法是，高层绑定可以为原生实例命名，并允许远程应用程序引用它们。对象路径看起来像文件路径——例如，一个对象可以是 `/org/kde/kspread/sheets/3/cells/4`。人类可读的路径很好，但如果你的应用程序需要，你可以创建一个名为\
  \ `/com/ubuntu/c5yo17y0c1c5b`的对象。通过你拥有的域名组件对对象路径进行命名空间划分（例如 `/org/kde`），这可以防止同一进程中的不同代码模块相互干扰。\n\
  \n## 方法与信号\n\n每个对象都有成员；两类成员是方法和信号。方法可以在对象上调用的操作，带有可选的输入（即参数或 `in` 参数）和输出（即返回值或 `out`\
  \ 参数）。信号是从对象广播到任何对该对象感兴趣的观察者的；信号可以包含数据负载。方法和信号都通过名称引用，例如 `PUMD` 或 `OnClicked`。\n\
  \n## 接口\n\n每个对象支持一个或多个接口。将接口想象为一组命名的方法和信号，就像在 `GLib`、`Qt` 或 `Java` 中一样。接口定义了对象的实例类型。D-Bus\
  \ 使用简单的命名空间字符串来标识接口，类似于 `org.freedesktop.Introspectable`。大多数绑定会将这些接口名称直接映射到相应的编程语言结构——例如\
  \ Java 接口或 C++ 纯虚类。\n\n\n\n\n\n# 附录 E - D-Bus：概览\n\n`proxy object`（代理对象）是一种为了表示另一个进程中远程对象的方便原生对象。低级\
  \ D-Bus API 涉及手动创建方法调用消息、发送该消息，然后手动接收并处理方法回复消息。高层绑定提供了代理作为替代方案。代理对象看起来像一个普通的原生对象，但当你对代理对象上调用方法时，绑定层会将其转换为\
  \ D-Bus 方法调用消息，等待回复消息，解包返回值并从原生方法返回该值。\n\n在伪代码中，不使用代理的编程可能像这样所示：\n\n```\nMessage\
  \ message = new Message(\"/remote/object/path\", \"MethodName\", arg1, arg2);\n\
  Connection connection = getBusConnection();\nconnection.send(message);\nMessage\
  \ reply = connection.waitForReply(message);\nif (reply.isError()) {\n} else {\n\
  \    Object returnValue = reply.getReturnValue();\n}\n```\n\n然而，使用代理的编程可能像这样：\n\n\
  ``````\nProxy proxy = new Proxy(getBusConnection(), \"/remote/object/path\");\n\
  Object returnValue = proxy.MethodName(arg1, arg2);\n```````\n\n## 总线名称\n\n当每个应用程序连接到总线守护进程时，守护进程会立即为其分配一个名称，称为\
  \ `unique connection name`（唯一连接名称）。唯一名称以冒号（`:`）字符开头。这些名称在总线守护进程的生存范围内永远不会重用——也就是说，你知道给定的名称将始终指向同一个应用程序。唯一名称的可能是\
  \ `:34-907`。冒号后面的数字除了唯一性外没有其他意义。\n\n当一个名称映射到特定的应用程序连接时，该应用程序被认为 `own`（拥有）了该名称。\n\
  \n应用程序可以请求拥有额外的 `well - known names`（已知名称）。例如，你可以编写一个规范来定义名为 `com.ubuntu.TextEditor`\
  \ 的名称。你的定义可以指定，为了拥有此名称，应用程序在 `/com/ubuntu/TextFileManager` 路径上应该有一个支持 `org.freedesktop.FileHandler`\
  \ 接口的对象。\n\n随后，应用程序可以向此总线名称、对象和接口发送消息以执行方法调用。\n\n你可以将唯一名称视为 IP 地址，将已知名称视为域名。因此，`com.ubuntu.TextEditor`\
  \ 可能映射到类似 `:34-907` 的内容，就像 `ubuntu.com` 映射到类似 `91.189.94.250` 一样。\n\n除了路由消息，名称还有第二个重要的用途。它们用于跟踪生命周期。当应用程序退出（或崩溃）时，操作系统内核将关闭它与消息总线的连接。消息总线随后发送通知消息，告知剩余应用程序该程序的名称失去了所有者。通过跟踪这些通知，你的应用程序可以可靠地监控其他应用程序的生命周期。\n\
  \n总线名称还可以用于协调单实例应用程序。例如，如果你想确保只有一个 `com.mycompany.TextEditor` 应用程序在运行，如果总线名称已经有了所有者，则让文本编辑器应用程序退出。\n\
  \n## 地址\n\n使用 D-Bus 的应用程序要么是服务器或客户端。服务器监听传入的连接；客户端连接到服务器。一旦建立连接，消息流就是是对称的；客户端与服务器的区别仅在建立连接时重要。\n\
  \n如果你正在使用总线守护进程（你可能正是这样），你的应用程序将是总线守护进程的客户端。也就是说，总线守护进程监听连接，而你的应用程序发起到总线守护进程的连接。\n\
  \nD-Bus `address` 指定了服务器将在哪里监听以及客户端将连接到哪里。例如，地址 `unix:path=/tmp/abcdef` 指定服务器将在路径为\
  \ `/tmp/abcdef` 的 UNIX 域套接字，客户端将连接到该套接字。地址还可以指定 TCP/IP 套接字，或未来 D-Bus 规范迭代中定义的任何其他传输方式。\n\
  \n在使用消息总线守护进程使用 D-Bus 时，`libdbus` 会通过读取环境变量自动发现每个会话总线守护进程的地址。它通过检查已知的 UNIX 域套接字路径发现系统级总线守护进程（尽管你可以用环境变量覆盖此地址）。\n\
  \n如果你在不使用总线守护进程的情况下使用 D-Bus，则由你定义哪个应用程序是服务器，哪个是客户端，并指定一种机制让他们同意服务器的地址。这是一种不常见的情况。\n\
  \n## 整体概念图\n\n要指定特定对象实例上的特定方法调用，必须命名多个嵌套组件：\n\n`Address` -> `[Bus Name]` -> `Path`\
  \ -> `Interface` -> `Method`\n\n总线名称放在括号中表示它是可选的——只有在使用总线守护进程时，你才提供名称来将方法调用路由到正确的应用程序。如果你与另一个应用程序直接连接，则不使用总线名称；没有总线守护进程。\n\
  \n接口也是可选的，主要出于历史原因；`DCOP`并不要求你指定接口；它只是禁止在同一个对象实例上出现重复的方法名。因此，D-Bus 允许你省略接口，但如果你的方法名具有歧义，将无法确定调用哪个方法。\n\
  \n## 消息：背后\n\nD-Bus 通过在进程之间发送消息来工作。如果你使用足够高层的绑定，你可能从不直接处理消息。\n\n有四种消息类型：\n\n- 方法调用消息（Method\
  \ call messages）请求调用对象的方法。\n- 方法返回消息（Method return messages）返回调用方法的结果。\n- 错误消息（Error\
  \ messages）返回调用方法引起的异常。\n- 信号消息（Signal messages）是通知信号已发射（事件已发生）。你也可以认为这些“事件”消息。\n\
  \n方法调用到消息的非常简单：你发送方法调用消息，并接收方法返回消息或错误消息。\n\n每条消息都有一个 `header`（头部），其中包含 `fields`（字段），和一个\
  \ `body`（正文），其中包含 `arguments`（参数）。你可以将头部视为消息的路由信息，将正文视为负载。头部字段可能包括发送者总线名称、目标总线名称、方法或信号名称等。头部字段之一\
  \ `type signature`（类型签名），描述正文中的值。例如，字母 `i` 表示 `32 - bit integer`，因此签名 `ii` 表示负载有两个\
  \ 32 位整数。\n\n## 调用方法：背后\n\nD-Bus 中的方法调用由两条消息组成：从进程 A 发送到进程 B 的方法调用消息，以及从进程 B 发送到进程\
  \ A 的匹配的方法回复消息。调用和回复消息都通过总线守护进程路由。调用者在每个调用消息中包含一个不同的序列号，回复消息包含此数字，以便调用者匹配回复和调用。\n\
  \n调用消息将包含方法的任何参数。回复消息可能指示错误，也可能包含方法返回的数据。\n\nD-Bus 中方法调用的步骤如下：\n\n1. 语言绑定可能提供代理，使得在进程内对象上调用方法会调用另一个进程中远程对象上的方法。如果是这样，应用程序调用代理上的方法，由代理构建方法调用消息发送给远程进程。\n\
  2. 对于更底层的 API，应用程序可以自己构建方法调用消息，而不使用代理。\n\n\n\n\n无论何种情况，方法调用消息都包含：属于远程进程的总线名称；方法名称；方法的参数；远程进程内部的对象路径；以及（可选的）指定方法的接口名称。\n\
  \n4. 方法调用消息被发送到总线守护进程（bus daemon）。\n\n5. 总线守护进程查看目标总线名称。如果某个进程拥有该名称，总线守护进程会将方法调用转发给该进程。否则，总线守护进程创建一个错误消息并将其作为方法调用消息的回复发送回。\n\
  \n6. 接收进程解包方法调用消息。在简单的低级 API 情况下，它可能会立即运行该方法并向总线守护进程发送方法回复消息。当使用高级绑定 API 时，绑定可能会检查对象路径、接口和方法名，并将方法调用消息转换为对原生对象（`GObject`、`java.lang.Object`、`QObject`\
  \ 等）上方法的调用，然后将来自原生方法的返回值转换为方法回复消息。\n\n7. 总线守护进程接收方法回复消息并将其发送给发起方法调用的进程。\n\n8. 发起方法调用的进程查看方法回复，并利用回复中包含的任何返回值。回复还可能指示发生了错误。在使用绑定时，方法回复消息可能被转换为代理方法的返回值，或转换为一个异常。\n\
  \n9. 总线守护进程永远不会重排消息。也就是说，如果你向同一个接收者发送了两个方法调用消息，它们将按照发送的顺序被接收。然而，接收者并不要求按顺序回复调用；例如，它可能在单独线程中处理每个方法调用，并根据线程完成的时间以不确定的顺序返回回复消息。方法调用有一个唯一的序列号，方法调用者使用该序列号将回复消息与调用消息进行匹配。\n\
  \n## 发射信号：幕后机制\n\nD-Bus 中的信号由单条消息组成，由一个进程发送到任意数量的其他进程。这意味着信号是一个单向广播。信号可能包含参数（数据载负载），但由于它是广播，因此它永远没有“返回值”。这与方法调用形成对比，方法调用消息有一个匹配的方法回复消息。\n\
  \n信号的发射者（即发送者）对信号接收者一无所知。接收者在总线守护进程处注册，根据“匹配规则”（match rules）接收信号——这些规则通常包括发送者和信号名称。总线守护进程仅向对该信号表示兴趣的接收者发送每个信号。\n\
  \n在 D-Bus 中发射信号的过程按如下方式：\n\n1. 创建信号消息并发送到总线守护进程。使用低级 API 时，这可以手动完成；使用某些绑定时，当原生对象发射原生信号或事件时，绑定可以为你完成操作。\n\
  \n2. 信号消息包含指定信号的接口名称、信号名称、发送信号的进程的总线名称以及任何参数。\n\n3. 消息总线上的任何进程都可以注册“匹配规则”，指示它感兴趣的信号。总线拥有一份已注册匹配规则列表。\n\
  \n4. 总线守护进程检查信号并确定哪些进程对其感兴趣。它将信号消息发送给这些进程。\n\n每个接收到信号的进程决定如何处理它；如果使用绑定，绑定可能会选择在代理对象上发射原生信号。如果使用低级\
  \ API，进程可能只需查看发送者和名称，并根据所看到的内容决定如何操作。\n\n## 自省（Introspection）\n\nD-Bus 对象可能支持 `org.freedesktop.DBus.Introspectable`\
  \ 接口。该接口有一个方法 `Introspect()`，它不接受参数并返回一个 XML 字符串。该 XML 字符串描述了对象的接口、方法和信号。\n\n##\
  \ Python 与 D-Bus\n\n有两个值得关注的总线守护进程。每个用户登录会话应该有一个*会话总线*（session bus），它是该会话本地的。它用于桌面应用程序之间的通信。通过创建一个\
  \ `SessionBus` 对象连接到会话总线：\n\n```python\nimport dbus\n\nsession_bus = dbus.SessionBus()\n\
  ```\n\n*系统总线*（system bus）是全局的，通常在启动期间启动；用于与 `udev`、`Network Manager` 和 `HAL` 等系统服务通信。连接到系统总线，创建一个\
  \ `SystemBus` 对象：\n\n```python\nimport dbus\n\nsystem_bus = dbus.SystemBus()\n```\n\
  \n当然，可以在可以在应用程序中连接两者。\n\n## 方法调用\n\nD-Bus 应用可以导出对象供其他应用程序使用。要开始操作另一个应用程序中的对象，你需要知道以下信息：\n\
  \n* **总线名称**（The bus name）——这标识了你想通信的应用程序。你通常通过已知名称来标识应用程序，这是一个以反向域名开头的点分隔字符串，例如\
  \ `org.freedesktop.NetworkManager` 或 `com.example.WordProcessor`。\n* **对象路径**（The\
  \ object path）——应用程序可以导出许多对象。例如，`com.example` 的文字处理器可能会提供一个代表处理器本身的对象，并为每个打开的文档提供一个对象。为了标识你想与哪一个交互，你使用对象路径，这是一个类似于文件名的斜杠分隔字符串。例如，`com.example`\
  \ 的文字处理器可能在 `/` 处提供一个代表处理器的对象，并在 `/documents` 处提供代表文档窗口的对象。\n\n正如你所期的，对远程对象的主要操作之一就是调用它们的方法。与\
  \ Python 中一样，方法可以有参数，并可以返回多个值。\n\n## 代理对象\n\n要与远程对象交互，你使用*代理对象*（proxy object）。它是远程对象的代理或“替代”的\
  \ Python 对象。当你在代理对象上调用方法时，会导致 dbus-python 在远程对象上执行方法调用，并将远程方法的返回值作为代理方法调用的返回值传。\n\
  \n要获取代理对象，请调用 `Bus` 的 `get_object()` 方法。例如，NetworkManager 拥有已知名称 `org.freedesktop.NetworkManager`\
  \ 并导出一个对象路径为 `/org.freedesktop/NetworkManager` 的对象，以及位于 `/org/freedesktop/NetworkManager/Devices/eth0`\
  \ 等对象路径的每个网络接口的对象。你可以这样获取代表 `eth0` 的对象的代理：\n\n```python\nimport dbus\n\nbus = dbus.SystemBus()\n\
  proxy = bus.get_object('org.freedesktop.NetworkManager', '/org/freedesktop/NetworkManager/Devices/eth0')\n\
  # proxy 是 dbus.proxies.ProxyObject\n```\n\n## 接口与方法\n\nD-Bus 使用*接口*（interfaces）为方法提供命名机制。接口是一组相关的的方法和信号（稍后介绍信号），通过以反向域名开头的点分隔组件名称来标识。例如，每个代表网络接口的\
  \ NetworkManager 对象都实现了 `org.freedesktop.NetworkManager.Devices` 接口，它拥有如 `getProperties()`\
  \ 等方法。\n\n要调用方法，在代理对象上调用同名的方法，通过 `dbus_interface` 关键字参数传递接口名称：\n\n```python\nimport\
  \ dbus\n\nbus = dbus.SystemBus()\n```\n\n\n\n\n```python\neth0 = bus.get_object('org.freedesktop.NetworkManager',\
  \ '/org/freedesktop/NetworkManager/Devices/eth0')\nprops = eth0.getProperties(dbus_interface='org.freedesktop.NetworkManager.Devices')\n\
  # props is a tuple of properties, the first of which is the object path\n# As a\
  \ short cut, if you 're going to be calling many methods with the same interface,\
  \ you can construct a dbus.Interface object and call methods on that, without needing\
  \ to specify the interface again:\nimport dbus\n\nbus = dbus.SystemBus()\neth0 =\
  \ bus.get_object('org.freedesktop.NetworkManager', '/org/freedesktop/NetworkManager/Devices/eth0')\n\
  eth0_dev_iface = dbus.Interface(eth0, dbus_interface='org.freedesktop.NetworkManager.Devices')\n\
  props = eth0_dev_iface.getProperties()\n# props is the same as before\n```\n\n##\
