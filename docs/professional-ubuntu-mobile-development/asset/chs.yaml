  \ tray_icon.run()\n```\n\n## 总结\n\n全球五分之一的人口很快将拥有移动设备并接入互联网。随着如此大量的潜在用户，移动应用程序的爆发是不可避免的，并且正在发生。本章将帮助你理解引导这一发展的各种技术。\n\
  \n## 应用打包\n\n有几个原因你可能想学习如何为 Ubuntu 进行打包。首先，构建和修复 Ubuntu 软件包是贡献 Ubuntu 社区的一种极方式。这也是学习\
  \ Ubuntu 以及你已安装的应用程序工作原理的好方法。如果你需要打包一个尚未进入存档的应用程序，这也非常有用。\n\n最后，如果你打算对 Ubuntu Mobile\
  \ 自带的默认应用程序集进行高度定制，这显然是非常重要的。\n\n## 背景和重要工具\n\nUbuntu 成为备受尊敬的 Linux 发行版之一是因为它的软件包系统，该系统基于\
  \ Debian，这 被认为是自由软件世界中安装、升级和删除软件的最优雅的方法之一。\n\n要成为一名优秀的打包人员，必须对以下工具有一定的了解（此列表并非详尽，而是我们使用的一些应用程序的快照）：\n\
  \n### `./configure`\n\n软件通常开发用于多个平台。由于这些平台的每个平台都有不同的编译器和包含文件，因此需要编写 `Makefiles`（参见下一条）和构建脚本，以便它们可以在各种平台上运行。GNU\
  \ 项目面对这个问题，设计了一系列工具来帮助完成这项任务。`configure` 脚本运行一系列测试，以确定关于你机器的重要信息。\n\n### `make`\n\
  \nMake 是一个控制可执行文件和其他文件生成的工具。Make 从一个名为 `Makefile` 的文件中获取如何构建和安装的知识，这是一个包含 shell\
  \ 命令的特殊文件，由 make 执行。当你写一个程序时，你应该为它写一个 `Makefile`。\n\n### `apt`\n\n`apt` 是 Advanced\
  \ Package Tool（高级软件包工具）的缩写。该工具在本书中被广泛。以下 `apt` 命令非常有用：\n\n- `apt-cache dump`：显示缓存中的每个软件包。\n\
  - `apt-cache policy`：列出软件包所在的仓库（main/restricted/universe/multiverse）。\n- `apt-cache\
  \ show`：显示二进制包的信息。\n- `apt-cache showsrc`：显示源码包的信息。\n- `apt-cache rdepends`：显示软件包的反依赖。\n\
  - `apt-rdepends`：递归列出软件包依赖以及正向依赖。\n\n### `dpkg`\n\n`dpkg` 是一个 Debian 打包工具，用于安装、查询和卸载软件包。以下\
  \ `dpkg` 命令非常有用：\n\n- `dpkg -S`：显示特定文件所属二进制包。\n- `dpkg -l`：显示已安装的软件包。\n- `dpkg -c`：显示二进制包的内容。\n\
  - `dpkg -f`：显示二进制包的控制文件。\n- `dpkg -L`：列出软件包拥有的文件。\n- `dpkg -s`：显示软件包状态。\n\n### `dpkg-source`\n\
  \n在处理源码包时一个非常有用的命令是：\n`dpkg-source -x filename.dsc [output-directory]`\n\n这提取一个源码包。必须提供一个非选项参数，即\
  \ Debian 源码控制文件（`.dsc`）的。可以提供可选的第二个非选项参数来指定提取源码包的目录——该目录必须不存在。如果没有指定输出目录，源码包将提取到当前工作目录下名为\
  \ `source - version` 的目录中。\n\n### `dpkg-scanpackages`\n\n`dpkg-scanpackages` 遍历\
  \ Debian 二进制包树并创建一个 `Packages.gz` 文件，该文件可以被设备的软件更新工具使用。\n\n### `dpkg-scansources`\n\
  \n`dpkg-scanpackages` 遍历 Debian 源码包树并创建一个 `Packages.gz` 文件，该文件可以被设备的软件更新工具使用。\n\n\
  ### `diff`\n\n`diff` 程序可以比较两个文件并制作补丁。一个典型的示例可能是：\n```bash\ndiff -u file.old file.new\
  \ > file.diff\n```\n此命令将创建一个差异文件。\n\n\n\n\n\n（如果递归使用目录）用于显示两个文件之间的变化或“增量”（delta）。\n\
  \n### patch\n\n`patch` 程序用于将补丁（通常由 `diff` 创建）应用到文件或目录。要应用之前创建的补丁，请使用 `patch -p0\
  \ < file.diff`。`-p<num>` 参数用于删除补丁中找到每个文件开头的斜杠。例如，如果文件名为 `/src/ui/list.c`，设置 `p0`\
  \ 将获得完整路径，而设置 `p1` 则获得 `src/ui/list.c`。\n\n### build - essential\n\n此软件包包含了一系列所需的工具，这些工具在从源码构建软件时被认为是必不可少的。\n\
  \n如果你已经安装了此 `build - essential` 软件，你只需要安装该包指定的构建时依赖项即可构建该包。\n\n### devscripts\n\n\
  `devscripts` 包含许多让软件包操作变得更简单的脚本，包括 `debclean`、`debdiff` 和 `dget`。\n\n`debclean`\
  \ 用于清除 Debian 源码树，`debdiff` 用于比较两个版本的 Debian 包以检查是否添加或删除了文件，而 `dget` 用于下载 Debian\
  \ 源码和二进制包。\n\n### gnupg\n\n`gnupg` 是 PGP 的完整且免费替代品，用于对文件（包括软件包）进行数字签名。\n\n### fakeroot\n\
  \n提供一个伪 root 环境，并允许运行如下命令（注意用户是用户 $ 而不是 root #）：\n\n```bash\n$ dpkg-buildpackage\
  \ -rfakeroot\n```\n\n它对于作为普通用户构建软件包非常有用。\n\n### lintian\n\n`lintian` 包含对 Debian\
  \ 策略许多方面的自动化检查，以及对常见打包错误的检查。\n\n`lintian` 使用一个存档目录（称为实验室），默认位于 `/tmp`，并在该目录中存储所检查的软件包的信息。它可以在多次调用之间保留这些信息，以避免重复昂贵的数据收集操作。\n\
  \n### pbuilder\n\n使用 `pbuilder` 作为包构建器允许你在 chroot 环境内部构建软件包。你可以不使用 builder 来构建二进制包，但你必须先在系统中安装所有的构建依赖项。`PBuilder`\
  \ 的自定义将在本章稍后部分详细介绍。\n\n## 打包与使用 PPA\n\n通过 Launchpad 的个人包存档（PPA），可以通过向 Web 服务上传源代码来构建并发布适用于多种架构的二进制包。目前，个人存档的大小限制为每个\
  \ PPA 1GB。如果你有多个 PPA，限制也同样是为每个 PPA 1GB。要使用该服务，你需要上传你的 PGP 密钥，并且还需要签署 Ubuntu 社区行为准则。\n\
  \n为了展示真实场景中的打包，我们将打包 `ubuntu-golden` 主题，该主题将在第 7 章中创建。它将被上传到 Launchpad PPA。\n\n\
  *更多关于 Launchpad 的信息请参见附录 C。*\n\n创建一个名为 `ubuntu-golden` 的文件夹，并在文件夹内创建另外两个名为 `debian`\
  \ 和 `gtk-2.0` 的文件夹。在 `gtk-2.0` 文件夹中，放置我们在主题章节创建的 `gtkrc` 文件。\n\n`debian` 目录是存储所有打包信息的地方，它允许我们将打包文件与应用程序源码分离。在该文件夹内部，我们现在需要为任何\
  \ Ubuntu 源码包创建必需文件：`changelog`、`control`、`copyright` 和 `rules`。这些是从原始源码创建二进制包（`.deb`\
  \ 文件）所需的文件。我们将逐一查看每个文件。\n\n*这只是对构成 Ubuntu 软件包的一些文件的快速演示。因此，缺少了许多关于打包的信息。欲需更多信息，请阅读\
  \ http://wiki.ubuntu.com/ 上的打包指南。打包是一种艺术形式，如果你在读完本章后发现自己对该领域有天然的天赋或兴趣，那么本指南是最好的开始地点。*\n\
  \n### 初始 Debian 化\n\n如果未安装 `dh_make`，请运行：\n\n```bash\n$ sudo apt-get install dh-make\n\
  ```\n\n然后运行此工具：\n\n```bash\n$ ln -s ubuntu-golden ubuntu-golden-0.1\n$ dh_make –createorig\
  \ –indep\n$ ls debian/\n```\n\n```\nchangelog dirs init.d.ex menu.ex README.Debian\n\
  compat docs init.d.lsb.ex postinst.ex rules\ncontrol emacsen-install.ex manpage.1.ex\
  \ postrm.ex teste.default.ex copyright emacsen-remove.ex manpage.sgml.ex preinst.ex\
  \ teste.doc-base.EX\ncron.d.ex emacsen-startup.ex manpage.xml.ex prerm.ex watch.ex\n\
  ```\n\n### rules\n\n`rules` 文件是一个可执行的 `Makefile`，它包含了从源码包构建二进制包的规则。关于 rules 文件的完整说明可以在\
  \ https://wiki.ubuntu.com/PackagingGuide/Complete#rules 找到。\n\n`dh_make` 创建的默认 rules\
  \ 文件如下：\n\n```makefile\n#!/usr/bin/make -f\n# -*- makefile -*-\n# 使用 debhelper 的示例\
  \ debian/rules。\n# 此文件最初由 Joey Hess 和 Craig Small 编写。\n# 作为一个特殊例外，当此文件被 dh-make\
  \ 复制到\n# dh-make 输出文件时，你可以不受限制地使用该输出文件。\n# 此特殊例外是由 Craig Small 在 dh-make 的 0.37\
  \ 版本中添加的。\n# 取消此注释以开启详细模式。\n#export DH_VERBOSE=1\nconfigure: configure-stamp\nconfigure-stamp:\n\
  dh_testdir\n# 在处添加配置软件包的命令。\ntouch configure-stamp\nbuild: build-stamp\nbuild-stamp:\
  \ configure-stamp\ndh_testdir\n# 在处添加编译软件包的命令。\n$(MAKE)\n#docbook-to-man debian/teste.sgml\
  \ > teste.1\ntouch $@\nclean:\ndh_testdir\ndh_testroot\nrm -f build-stamp configure-stamp\n\
  # 在处添加构建过程后的清理命令。\n$(MAKE) clean\ndh_clean\ninstall: build\ndh_testdir\ndh_testroot\n\
  dh_prep\ndh_installdirs\n# 在处添加将软件包安装到 debian/teste 的命令。\n$(MAKE) DESTDIR=$(CURDIR)/debian/teste\
  \ install\n# 在处构建与架构无关的文件。\nbinary-indep: install\ndh_testdir\ndh_testroot\ndh_installchangelogs\n\
  dh_installdocs\ndh_installexamples\n# dh_install\n# dh_installmenu\n# dh_instalebconf\n\
  # dh_installlogrotate\n# dh_installemacsen\n# dh_installpam\n# dh_installmime\n\
  # dh_installinit\n# dh_installcron\n# dh_installinfo\n# dh_installwm\n# dh_installudev\n\
  # dh_lintian\n# dh_undocumented\ndh_installman\ndh_link\ndh_compress\ndh_fixperms\n\
  # dh_perl\n# dh_python\ndh_installdeb\ndh_gencontrol\ndh_md5sums\ndh_builddeb\n\
  # 在处构建与架构相关的文件。\nbinary-arch: install\n```\n\n在我们修改后的 rules 文件中，需要注意的是以下代码块中的代码：\n\
  \n```makefile\ninstall -d $(CURDIR)/debian/xfce4-theme-ubuntu-golden/usr/share/themes/UbuntuGolden/gtk-2.0/\n\
  for file in $(CURDIR)/gtk-2.0/*; do \\\ninstall -c -m 644 $$file $(CURDIR)/debian/xfce4-theme-ubuntu-golden/usr/share/themes/UbuntuGolden/gtk-2.0/;\
  \ \\\ndone\n```\n\n它获取我们的主题并将其安装到 `/usr/share/UbuntuGolden`，然后更改权限，除所有者以外的所有只读。我们从默认\
  \ rules 文件中删除了所有被注释的 `dh_` 命令，以及 `dh_installexamples`、`dh_installman` 和 `link`，它们在在这种情况下是不必要的。我们还删除了\
  \ `configure-stamp` 语句和 `Make` 调用。完整的 rules 文件如下所示，注意各种 `dh_` 命令：\n\n```makefile\n\
  #!/usr/bin/make -f\n# -*- makefile -*-\nbuild: build-stamp\nbuild-stamp:\ndh_testdir\n\
  touch build-stamp\nclean:\ndh_testdir\ndh_testroot\n```\n\n\n\n\n```bash\nrm -f\
  \ build-stamp\n\ndh_clean\n\ninstall: build\n\ndh_testdir\n\ndh_testroot\n\ndh_clean\
  \ -k\n\ndh_installdirs\n\n# install the Gtk+ theme\n\ninstall -d $(CURDIR)/debian/xfce4-theme-ubuntu-golden/usr/share/themes/UbuntuGolden/gtk-2.0/\n\
  \nfor file in $(CURDIR)/gtk-2.0/*; do \\\ninstall -c -m 644 $$file $(CURDIR)/debian/xfce4-theme-ubuntu-golden/usr/share/themes/UbuntuGolden/gtk-2.0/;\
  \ \\\ndone\n\n# Build architecture-independent files here.\n\nbinary-indep: build\
  \ install\n\ndh_testdir\n\ndh_testroot\n\ndh_installchangelogs\n\ndh_installdocs\n\
  \ndh_strip\n\ndh_compress\n\ndh_fixperms\n\ndh_installdeb\n\n111\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \nc05.indd 111\n\n10/6/09 8:57:52 AM\n\n第 5 章：应用程序打包\n\ndh_gencontrol\n\ndh_md5sums\n\
  \ndh_builddeb\n\n# Build architecture-dependent files here.\n\nbinary-arch: install\n\
  \nbinary: binary-indep binary-arch\n\n.PHONY: build clean binary-indep binary-arch\
  \ binary install configure\n```\n\n*前面提到的* dh_* *命令是* debhelper *工具套件的一部分。这些工具可以帮助在在编写*\
  \ *规则* *文件时完成* *重复性任务。例如，* `dh_testdir` *命令会尝试确保确保* *你在构建 debian 软件包时处于正确的目录中。有关该套件中所有可用*\
  \ *工具的更多信息，请参阅 debhelper 手页。* \n\n还有其他创建规则文件的方法，例如使用 `debhelper` `7` 和 `cdbs`。有关这些工具的更多信息，请参阅\
  \ `http://manpages.ubuntu.com/manpages/karmic/man7/debhelper.7.html` 和 `http://build-common.alioth.debian.org/cdbs-doc.html`。\n\
  \n### changelog（变更日志）\n\nchangelog 文件是每个版本中所做更改的列表。它具有特定的格式，列出了包名、版本、发行版、更改以及在特定时间执行更改的人。如果你有\
  \ GPG 密钥，请确保 changelog 中使用的名称和电子邮件地址与密钥中的一致。\n\n创建一个 changelog：\n\n```\nxfce4-theme-ubuntu-golden\
  \ (0.1jaunty1) jaunty; urgency=low\n* 初始发布。\n\n—\n\nIan Lawrence\n\n<\ndebs@ianlawrence.info\n\
  >\n\nSat, 28 Feb 2009 19:45:07 +0000\n```\n\n可以使用名为 `dch` 的工具来编辑 changelog。在源根目录中，输入\
  \ `$ dch -e` 即可用你偏好的编辑器编辑 changelog。例如，在发布新版本时增加 changelog 号，请运行 `$ dch -i`。要向当前版本条目后添加新注释，请运行\
  \ `$ dch -a`。\n\n**运行命令以设置默认编辑器：**\n\n`$ update-alternatives --config-editor`\n\n\
  ### control（控制文件）\n\n控制数据存储在控制文件中，它同时用于源包和二进制包。下面显示的控制文件是我们的源包的控制文件。我们可以判断出这是一个源包，因为它被分为两个段，第一段始终引用源包本身，第二段及后续段落引用从我们的源包创建的二进制包。\n\
  \n112\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\nc05.indd 112\n\n10/6/09\
  \ 8:57:52 AM\n\n第 5 章：应用程序打包\n\n```\nSource: xfce4-theme-ubuntu-golden\nSection:\
