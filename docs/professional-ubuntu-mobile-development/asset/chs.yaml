  ![Image 3](img/index-2_2.png)\n![Image 4](img/index-2_3.png)\n\n\n\n本书介绍了基础概念，从使用\
  \ C 语言编写 Unix 程序的基础开始，涵盖了基本系统调用、文件 I/O、进程间通信（用于让程序协同工作）以及 Shell 编程的内容。与此同时，本书还介绍了用于用户界面交互的工具包和库，从简单的终端模式应用程序到用于图形界面的\
  \ X 和 GTK+。书中详细涵盖了高级主题，例如进程、管道、信号量、socket 编程、深入挖掘 MySQL 的用法、为 GNOME 或 KDE 桌面编写应用程序、编写设备驱动、POSIX\
  \ 线程以及针对最新 Linux 内核的内核编程。\n\n\n\n## 互动\n\n**按需章节 (Chapters on Demand)**\n通过参与我们的\
