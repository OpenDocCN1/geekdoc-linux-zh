  \n在运行任何测试之前，有必要禁用屏幕保护程序（在 Ubuntu Net 上）：\n```bash\nsudo killall gnome-screensaver\n\
  gconftool-2 --type boolean -s /apps/gnome_settings_daemon/screensaver/start_screensaver\
  \ false\n```\n拔掉外部设备（USB 鼠标、键盘、以太网等），然后重启设备。\n\n### Phoronix Test Suite\n\nPhoronix\
  \ Test Suite 支持监控系统传感器。Phoronix Test Suite 在运行选定套运行时会自动监控指定的传感器，并在最后提供每个传感器的高低阈值以及平均值。此外，传感器结果将绘制在折图中。\n\
  \n传感器检测和监控本身通过 LM - Sensors 和 ACPI 完成。它被默认使用，但如果没有安装 LM - Sensors，套件将退回到使用高级配置电源接口（ACPI）。\n\
  \n要安装 Phoronix Test Suite 和传感器接口，请运行以下命令：\n```bash\nsudo apt-get install lm-sensors\
  \ libsensors-dev phoronix-test-suite\n```\n可以通过运行以下命令获取完整的选项列表：\n```bash\n$ phoronix-test-suite\
  \ module-info system_monitor\n```\n\n\n\n\n通过运行以下命令可以读取当前系统中实际到的传感器及其数值：\n\n```bash\n\
  MONITOR=all phoronix-test-suite test-module system_monitor\n```\n\n# 第 3 章：电源管理\n\
  \nAcer Aspire 笔记本电脑上的结果显示如下：\n\n```\n====================================\nStarting\
  \ Module Test Process\n====================================\n==========================================\n\
  Current Sensor Readings:\nBattery Power Monitor 10603 Milliwatts\nCPU Frequency\
  \ Monitor: 800.00 Megahertz\nCPU Usage Monitor: 14.81 Percent\nSystem Memory Usage\
  \ Monitor: 454 Megabytes\nSwap Memory Usage Monitor: 189 Megabytes\nTotal Memory\
  \ Usage Monitor: 644 Megabytes\nElapsed Time: 13 Seconds\n==========================================\n\
  ```\n\n监控传感器的选择是通过 `MONITOR` 环境变量完成的。例如，要在笔记本套件运行运行时监控电池，可以使用以下命令：`MONITOR=all.battery\
  \ phoronix-test-suite benchmark netbook`。\n\n## 电池对比\n\n上一个示例使用的设备是配备 Intel Atom\
  \ N270 1.6GHz CPU 的 Acer Aspire 笔记本电脑。预计使用基于 Ubuntu MID 版本的低功耗 Intel 架构 (LPIA) 将获得显著的电池性能提升。为了确认这一点，我们在运行空闲测试一小时对电池进行了监控：\n\
  \n```bash\nMONITOR=all phoronix-test-suite benchmark idle\n```\n\n在两个操作系统中，电池在开始测试前均已充满电，并在运行测试前拔掉了电源。空闲测试完成后，标准输出中打印了传感器统计数据：电源电池统计（Power\
  \ Battery Statistics）：\n\nLow: 10871.00 Milliwatts\nHigh: 14233.00 Milliwatts\n\
  Average: 11779.76 Milliwatts\n\n结果使用网页浏览器通过图 3-2 等图像显示。\n\n在同一台 Acer 笔记本上，安装了 Ubuntu\
  \ MID 并运行了相同的测试一小时。这是 Ubuntu MID 的输出：\n\n电源电池统计（Power Battery Statistics）：\nLow:\
  \ 9919.00 Milliwatts\nHigh: 13162.00 Milliwatts\nAverage: 10401.40 Milliwatts\n\n\
  结果显示在图 3-3 中。\n\n图 3-3\n\n上述测试的传感器图保存到以下默认位置：\n\n`~/.phoronix-test-suite/module-files/system-monitor/`\n\
  \n结果显示，基于 LPIA 的 Ubuntu MID 比 i386 的 Ubuntu Netbook Remix 效率高 11.7%。依赖此测试结果的问题在于它们并没有在比较相似的事物。如果能在\
  \ LPIA 上运行 Ubuntu Netbook Remix 并将其与 i386 版本进行比较，那就更好了。\n\n## 同类对比\n\n首先，在 Acer\
  \ 上安装了 Ubuntu MID，然后在终端中执行：\n\n```bash\nsudo apt-get install ubuntu-netbook-remix-default-settings\
  \ ubuntu-netbook-remix\n```\n\n接下来，移除了 MID 设置以便可以使用 Netbook Remix 界面：\n\n```bash\n\
  sudo apt-get remove-purge ubuntu-mid-default-settings\n```\n\n最后，再次运行测试。结果如下：电源电池统计（Power\
  \ Battery Statistics）：\n\nLow: 10250.00 Milliwatts\nHigh: 13111.00 Milliwatts\n\
  Average: 10772.64 Milliwatts\n\n结果显示在图 3-4 中。\n\n这些结果显示，LPIA 版本的 Ubuntu Netbook\
  \ Remix 比 i386 版本效率高 8.55%。\n\n另一个值得注意的有趣点是，LPIA Ubuntu MID 版本比 LPIA 版本的 Ubuntu\
  \ Netbook Remix 效率高 3.44%。这可能归因于 Ubuntu Netbook Remix 使用标准的 Firefox，而 LPIA 版 Ubuntu\
  \ MID 使用了 midbrowser（使用 LPIA 标志编译的 Firefox）。\n\n## 总结\n\n电源管理是便携式电脑的一项本质任务。电源管理的核心在于如何有效优化每个系统组件的能量消耗。这涉及到研究系统执行的不同任务，并配置每个组件以确保其性能恰到好处。\n\
  \n# 第 4 章：应用开发\n\n## Ubuntu Mobile 发布\n\nUbuntu Mobile 团队主要的 Jaunty 版本是 Ubuntu MID\
  \ 和 Ubuntu Netbook Remix。\n\n对于 karmic，MID 版本将由社区维护。将有一个 Moblin 的混合版本 Ubuntu Moblin\
  \ Remix，并且还有一个 ARM 版本。\n\n还有针对 armel 架构的移植：\n\nhttp://cdimage.ubuntu.com/ports/releases/jaunty/release/ubuntu-9.04-alternate-armel.img\n\
  \n此发行版基于 Frecale I.MX515 处理器，该芯片显然功耗非常低且发热极少。这允许开发者在非常纤薄的外型中挤出更长的电池寿命（长达 8 小时）。\n\
  \nFreescale 与原属于华硕的原始制造商 Pegatron 正在与 Canonical 合作，为该架构定制 Ubuntu。Ubuntu 的 arm 移植将在附录\
  \ A 中进一步讨论。\n\n\n\n\n\nUbuntu Netbook Remix 是一个标准的 Ubuntu 桌面，并包含了一些特定的定制内容，使其能够在小屏幕设备（如上网笔记本电脑）上运行得更好。\n\
  \n这些包括 Ubuntu Netbook Remix 启动器，它提供了一个备菜单以及一个 Go Home 小组件，该小组件配合启动器使用以提供桌面访问。还有\
  \ `Maximus`，这是一个用于自动最大化窗口的守护进程，以及一个窗口选择器小组件，它将已打开的窗口以图标形式显示在面板上。这些工具被整合到一个新的主题中（针对\
  \ jaunty 版本），称为 Human Netbook 主题。\n\n通过安装桌面切换器包，可以轻松地在“经典”桌面和笔记本电脑桌面之间切换：\n\n```bash\n\
  sudo apt-get install desktop-switcher\n```\n\n运行该程序，它会弹出一个界面供选择如图 4-1 所示的桌面。\n\n\
  图 4 - 1\n\n此命令更改了每个桌面的某些 GConf 设置——例如：\n\n```bash\ngconftool-2 set /desktop/gnome/session/required_components_list\
  \ list-type=string [\"filemanager”,”panel”,”windowmanager\"]\n```\n\n这展示了 GConf\
  \ 从根本上改变用户界面和配置设置的力量。GConf 将在本章稍后部分讨论。\n\n为 Ubuntu Netbook Remix 开发应用程序与普通桌面相同。只有开发\
  \ Ubuntu MID 时，开发者才需要考虑一些根本差异——主要与较小的屏幕尺寸有关。\n\n# 创建新应用程序\n\nOEM（原始设备制造商）会对设备的界面进行深度定制，并向其终端用户提供“开箱即用”的默认应用程序范围。如果\
  \ Ubuntu 仓库中目前没有所需的功能，则可能需要开发应用程序。除了遵循用户驱动的流程并选择开发方法（强烈建议使用 Scrum）之外，为移动设备开发时还有其他关键考虑因素。\n\
  \n## 应用程序设计\n\n为移动设备开发时最重要的考虑因素是，与普通桌面相比，屏幕面积减少了。在波士顿的 Ubuntu 开发者冲刺期间，移动团队总结了在该环境下工作需要考虑的关键点：\n\
  \n- 屏幕和对话框必须适应屏幕。这通常是 800 ⫻ 480。\n- 具有多个屏幕的应用程序（如 `GIMP`）应该提供一种简单、显式的方式在屏幕之间导航。\n\
  - 文件系统对用户的可见性不如在普通桌面环境中那么高。因此，用户`永远`不需要知道文件名；他们应该与元数据交互（图像查看器的缩略图、音乐的歌曲/艺术家名称、电子邮件中的发件人/收件人/主题头等）。\n\
  - 尽可能，应避免传统的打开/保存对话框——尽管（考虑到最流行的 iPhone 用户请求）在应用程序之间复制和粘贴的能力是非常重要的。\n- “添加文件”对话框需要提供一个友好的附加对象列表（缩略图或元数据）。\n\
  - 如果必须向用户展示文件列表，该列表必须仅相关文件。应该始终排除隐藏文件和文件夹。\n- 配置选项的数量应尽可能精少。应用程序应带有智能默认值进行预配置。只有当选项对于恐电脑症来说易于理解，或者可能对大量用户有用时，才应该包含它们。\n\
  - 用户喜欢即时反馈。目标是让与 UI 的任何交互在 200ms 内产生视觉/音频反馈，这是产生“即时感”所需的上限值。对于像 MID 这样的触控设备，组件的行为应该像物理对象一样非常重要。延迟反应会提醒用户他们正在使用电脑。\n\
  - 电池寿命是 Ubuntu Mobile 平台的主要目标。应用程序应该使用来自 `Device Kit` 的应用程序请求延迟，见第 3 章。\n- 如果发生问题，错误消息应向用户建议行动方案。新的\
  \ Jaunty 通知系统将在章稍后部分讨论。\n- 与触摸屏交互时，研究表明用户更倾向于使用指腹而不是指尖。这很重要，因为这意味着界面元素不应小于 1cm (0.4\
  \ ⬙ )。\n\n需要注意的是，手指驱动 UI 的最小按钮尺寸是实际像素密度的函数，而不是屏幕分辨率。像素密度是各种背景下设备分辨率的测量值，程序 `xdpyinfo`\
  \ 可以提供这种测量。在 MID 机器上运行以下命令：\n\n```bash\nxdpyinfo | grep resolution\n```\n\n得到以下使用的分辨率：\n\
  `resolution: 96x96 dots per inch`\n\n## 自由桌面标准\n\n文件需要放置在文件系统的特定位置，以便操作系统能够发现、展示并启动新应用程序。在\
  \ Ubuntu 上，这些文件的放置符合 `freedesktop.org` 标准。这些是用于 X Window 系统上项目互操作的一系列规范。\n\n开发者需要考虑的最重要标准是：\n\
  \n### 桌面条目规范\n\n这是一个带有 `.desktop` 扩展名的 UTF-8 编码文件，具有头部 `Desktop Entry` 和若干 `Key=Value`\
  \ 格式的条目。文件中的 REQUIRED 键有：\n- `Type`: `Application`、`Link` 或 `Directory`\n- `Name`:\
  \ 应用程序名称\n- `Exec`: 要执行的应用程序\n- `(URL)`: 如果 `Type` 设置为 `Link` 则需要\n\n`Exec` 键必须包含一个要执行的命令，可以是可执行文件的完整路径，如果可以在\
  \ `PATH` 环境变量中找到，则只需名称。也可以在命令行中添加特殊符号，这些符号会在执行时由程序展开。例如，向位于 `/usr/bin` 目录的二进制文件\
  \ `pumd` 传递 URL，`Exec` 键如下：\n\n```\nExec=pumd %u\n```\n\n这是稍后讨论的 `Hello-World.desktop`\
  \ 文件的示例：\n\n```\n[Desktop Entry]\nEncoding=UTF-8\nName=Hello-World\nComment=Introduction\
  \ to Hildon Applications\nExec=hello-world\nIcon=hello.png\nStartupNotify=true\n\
  Terminal=false\nX-MultipleArgs=false\nType=Application\nCategories=Application;Other\n\
  ```\n\n### 桌面应用程序自动启动规范\n\n如果将 `.desktop` 文件放置在自启动目录中，系统会自动启动应用程序。系统级设置（变量 `$XDG_CONFIG_DIRS`）默认是\
  \ `/etc/xdg/autostart/`。用户级设置（变量 `$XDG_CONFIG_HOME`）默认是 `~/.config/autostart/`。应用程序将在用户登录后启动。\n\
  \n\n\n\n同样，环境变量 `$XDG_CONFIG_DIRS` 定义了一组具有优先级顺序的基础目录，用于在其中搜索配置文件。\n\n该规范还定义了用于搜索数据文件的目录\
  \ `$XDG_DATA_DIRS`，以及用于缓存非必要数据的目录 `$XDG_CACHE_HOME`。\n\n# 桌面菜单规范\n\n这在概念上可以被认为是一个扩展名为\
  \ `.menu` 的 XML 配置文件，它定义了菜单项（`.desktop` 文件）的布局以及这些项目是否应该显示在菜单中。XML 文件默认位置位于：\n\n\
  `$XDG_CONFIG_DIRS/menus/${XDG_MENU_PREFIX}applications.menu`\n\n其中 `$XDG_MENU_PREFIX`\
  \ 变量意味着用户的菜单可以覆盖（更准确地说说是合并）系统菜单。`.desktop` 文件默认位于 `$XDG_DATA_DIRS/applications/`。\n\
  \n此规范为上述的桌面条目规范（Desktop Entry Specification）增加了 `Categories`、`OnlyShowIn` 和 `NotShowIn`\
  \ 字段。`Categories` 是分组菜单项的方法，`OnlyShowIn` 是项目仅显示在特定环境中的方法，而 `NotShowIn` 则是反之。\n\n\
  # 第 4 章：应用开发\n\n除了了解这些规范外，知道开发应用时可以使用哪些框架也非常重要。\n\n## Hildon：用于手持设备的应用框架\n\nHildon\
  \ 应用框架是为小型设备设计的，并在这种设备上被广泛使用。该框架得到了 Nokia 的强势支持，是 GNOME Mobile 的一部分，并经过扩展以更好地支持基于触笔的使用和高显示像素密度。\n\
  \n它使用了基础 GNOME 技术，如 `GTK` 以及 `GConf` 配置系统，这两者将在本章后文中讨论。\n\nHildon 是一个扩展并修改后的 `GTK`，被称为“Hildon\
  \ 组件集”。它有效地为移动设备提供了一个桌面环境。\n\n在 Hildon 上，与传统桌面 GNOME 的一个显著区别是用 `bonobo` 及其围绕 `CORBA`\
  \ 构建的相关技术替换为 `D-Bus`。\n\n### 从代码角度看 Hildon 是什么\n\n`HildonProgram` 是代表整个应用的 `Gobject`。在这种范围内，需要注意的是\
  \ `HildonProgram` *不是*一个 `GtkWidget`。\n\n每个进程只能创建一个 `HildonProgram`。通过 `hildon_program_get_instance`\
  \ 访问。\n\n`HildonWindow` 使用 `hildon_program_add_window()` 注册到 `HildonProgram`。正如方法名所示，多个\
  \ `HildonWindow` 可能会注册到一个 `HildonProgram` 中。\n\n下面的 C 代码强调了在使用该框架时可用的一些关键概念和功能。\n\
  \n### 创建程序\n\n代码如下：\n\n```c\n/* Start the container and window */\nHildonProgram\
  \ *program;\nHildonWindow *window;\n/* Start up GTK */\ngtk_init (\n&argc,\n&argv);\n\
  /* Make a Hildon program */\nprogram = HILDON_PROGRAM (hildon_program_get_instance());\n\
  ```\n\n### 菜单\n\n菜单使用 `GtkMenu` 在外部创建。通过 `hildon_window_set_menu()` 将其添加到 `HildonWindow`\
  \ 中。\n\n示例所示：\n\n```c\nGtkMenu *menu;\nmenu = gtk_menu_new ();\nfill_in_menu (menu);\n\
  hildon_window_set_menu (menu);\n```\n\n### 工具栏\n\n工具栏通过调用 `hildon_window_add_toolbar()`\
  \ 创建。考虑以下示例：\n\n```c\nGtkToolbar *toolbar;\ntoolbar = create_toolbar ();\n/* Adding\
  \ the toolbar */\nhildon_window_add_toolbar (window, toolbar);\n```\n\n### 窗口 -\
  \ 特定设置\n\n窗口特定的命令可以发送到主窗口管理器和任务导航器。应用程序可以任务导航器某些窗口需要用户的注意。这将触发任务导航器中窗口图标的闪烁。\n\n\
  如下所示：\n\n```c\ngtk_window_set_urgency_hint (GTK_WINDOW (window), TRUE);\n```\n\n\
  同样，应用程序可以使用 `gtk_window_set_icon` 系列函数更改任务导航器中代表每个 `HildonWindow` 的图标。\n\n以下代码演示了这一点：\n\
  \n```c\nGdkPixbuf *icon = create_icon();\ngtk_window_set_icon (GTK_WINDOW (window),\
  \ icon);\n```\n\n此外，可以使用以下代码设置每个窗口的标题：\n\n```c\ngtk_window_set_title (GTK_WINDOW\
  \ (window), “Window Title”);\n```\n\n如果使用 `g_set_application_name()` 设置了应用程序名称，它将出现在标题栏窗口标题之前。\n\
  \n### 程序 - 范围设置\n\n`HildonProgram` 对象为程序员提供了为所有注册的 `HildonWindow` 设置程序级设置的能力。\n\n\
  程序员可以创建一个通用菜单，该菜单将由所有窗口共享（内存和功能方面）。窗口可以通过拥有自己的菜单来覆盖此通用菜单。以下代码演示了这一点：\n\n```c\nGtkMenu\
  \ *common_menu = create_common_menu ();\nGtkMenu *window_specific_menu = create_window_specific_menu\
  \ (); \nhildon_program_set_common_menu (program, common_menu);\nhildon_window_set_menu\
  \ (second_window, window_specific_menu);\n```\n\n此外，通用工具栏可以在所有 `HildonWindow` 之间共享。窗口也可以添加特定的工具栏。通用工具栏将显示在工具栏栈的底部。以下代码演示了这一点：\n\
  \n```c\nGtkToolbar *common_toolbar = create_common_toolbar ();\nGtkToolbar *window_specific_toolbar\
  \ = create_window_specific_toolbar (); \nhildon_program_set_common_toolbar (program,\
  \ common_toolbar);\nhildon_window_add_toolbar (second_window, window_specific_toolbar);\n\
  ```\n\n### 休眠\n\n程序员可以通过调用 `set_can_hibernate()` 通知 Hildon 任务导航器应用程序是否准备好进入休眠（后台杀死）。\n\
  \n### 整合 Hildon\n\n下面的程序将从头构建一个程序，展示符合 Hildon 框架的应用程序组成。\n\n## Hello World\n\nHello\
  \ World 是一个简单的 C 程序，带有应用图标和 `.desktop` 文件。首先，创建样板化的 Hildon 代码。\n\n源代码如下：\n\n```c\n\
  #include <hildon-program.h>\n#include <hildon-window.h>\n#include <gtk/gtkmain.h>\n\
  \nint main(int argc, char *argv[])\n{\nHildonProgram *program;\nHildonWindow *window;\n\
  GtkWidget *label;\n\ngtk_init(&argc, &argv);\n\nprogram = hildon_program_get_instance();\n\
  window = HILDON_WINDOW(hildon_window_new());\n\nhildon_program_add_window(program,\
  \ window);\n\ng_set_application_name(“Hello World”);\n\nlabel = gtk_label_new(“Hello\
  \ World”);\ngtk_container_add(GTK_CONTAINER(window), label);\ngtk_widget_show_all(GTK_WIDGET(window));\n\
  \ng_signal_connect(G_OBJECT(window), “delete_event”, G_CALLBACK(gtk_main_quit),\
  \ NULL);\n\ngtk_main();\n\nreturn 0;\n}\n```\n\n将代码保存为 `hello-world.c` 并确保已安装了 `build-essential`、`libgtk2.0-dev`\
  \ 和 `libhildon-1-dev`。然后使用以下命令编译二进制文件：\n\n```bash\n# gcc -o hello-world hello-world.c\
  \ $(pkg-config --cflags --libs gtk+-2.0 hildon-1)\n```\n\n编译后，运行 `hello-world`。\n\
  \n### 输出\n\n应用程序执行并显示图 4-2 所示的界面。\n\n### 菜单\n\n现在创建一个标准的 `GtkMenu` 并将其附加到 `HildonWindow`。为此为此，创建一个这样的\
  \ `attach_menu` 函数：\n\n```c\nstatic void attach_menu(HildonWindow *window)\n{\n\
  \    GtkWidget *menu;\n    GtkWidget *item_quit;\n\n    if(NULL == window)\n   \
  \     return;\n\n    menu = gtk_menu_new();\n    item_quit = gtk_menu_item_new_with_label(“Quit”);\n\
  }\n```\n\n\n\n\n# 第 4 章：应用开发\n\n```c\ngtk_menu_append(menu, item_quit);\nhildon_window_set_menu(window,\
  \ GTK_MENU(menu));\ngtk_widget_show_all(GTK_WIDGET(menu));\n```\n\n将此函数添加到 `hello\
  \ - world.c` 中，并在显示窗口之前在 `main` 中调用它：`attach_menu(window);`\n\n```c\ngtk_widget_show_all(GTK_WIDGET(window));\n\
  ```\n\n菜单看起来如图 4-3 所示。\n\n图 4-3\n工具栏\n\n最后，创建一个 `attach_toolbar` 函数将工具栏附加到 `HildonWindow`：\n\
  \n```c\nstatic void attach_toolbar(HildonWindow *window)\n{\n  GtkWidget *toolbar;\n\
  \  GtkToolItem *item_quit;\n  if(NULL == window)\n    return;\n  toolbar = gtk_toolbar_new();\n\
  \  item_quit = gtk_tool_button_new_from_stock(GTK_STOCK_QUIT);\n  gtk_toolbar_insert(GTK_TOOLBAR(toolbar),\
  \ item_quit, -1);\n  hildon_window_add_toolbar(window, GTK_TOOLBAR(toolbar));\n\
  }\n```\n\n将此代码添加到源代码中，然后在之前创建的 `attach_menu()` 函数之后调用它：`attach_menu(window);`\n\
  `attach_toolbar(window);`\n\n工具栏看起来如图 4-4 所示。\n\n图 4-4\n\n这里是最终的源代码：\n\n```c\n#include\
  \ <hildon/hildon-program.h>\n#include <hildon/hildon-window.h>\n#include <gtk/gtkmain.h>\n\
  \nstatic void attach_menu(HildonWindow *window)\n{\n  GtkWidget *menu;\n  GtkWidget\
