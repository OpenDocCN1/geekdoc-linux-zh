  flast.indd xxxiv\n10/6/09 5:17:37 PM\n\n# 绪论\n\n###\n\n随着对移动解决方案的需求增长，Linux 和 Ubuntu\
  \ 得到了改进。如今的移动市场——无论是终端用户，还是希望将操作系统与硬件绑定的供应商——都与 Linux 和 Ubuntu 高度契合。\n\n让我们快速看看这些市场和技术是如何演变的，以及为什么\
  \ Linux 和 Ubuntu 准备好提供移动解决方案。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  c01.indd 1\n10/6/09 8:50:24 AM\n\n![Image 5](img/index-38_1.jpg)\n\n第一章：移动端 Linux\n\
  \n***简史：从巨铁到大力大力鼠***\n\n图 1-1 所示的 Harvard Mark I 计算机长 51 英尺，高 8 英尺。它于 1944 年首次启动，用于进行乘法、除法、对数计算和处理三角函数。该系统被广泛认为是现代计算机时代的开始。想象一下，一台每分钟只能做五道乘法和两道除法！处理对数时是出去喝杯咖啡休息的好时机。\n\
  \n图 1-1\n\n从那时起，计算技术遵循摩尔定律的稳步道路经历了惊人的演变，如图 1-2 所示。\n\nCPU 晶体管数量 1971–2008 和摩尔定律\n\
  \n2,000,000,000\nQuad-Core Itanium Tukwila\nDual-Core Itanium 2\nGT200\n1,000,000,000\n\
  POWER 6\nRV770\nG80\n\n### 走向移动\n\n自第一台计算机诞生以来，人们一直在不断追求更小、更快、更廉价的系统。2008 年，笔记本电脑的季度销量首次超过了台式机。上网电脑——比笔记本电脑更小，其价格优势风靡了市场——是\
  \ 2008 年意料之外的红。。\n\n考虑以下统计数据：国际数据公司 (IDC) 预计 2009 年将出货 2060 万台上网电脑（相比于 1.37 亿台全尺寸笔记本）。ABI\
  \ Research 表示该数字在 2013 年可能会达到 3500 万。超便携电脑 (UMPCs) 似乎以每年百万到两百万的速度缓慢增长。移动互联网设备 (MIDs)\
  \ 的销量预计将出现健康增长，某些估计将 2009 年的销量放在近 600 万，2010 年增加三倍——尚未像上网电脑那样爆发性成功，但与智能手机相比仍然非常可观。\n\
  \n[www.it-ebooks.info](http://www.it-ebooks.info/)\nflast.indd ii\n10/6/09 5:17:38\
