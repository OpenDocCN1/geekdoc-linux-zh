  c01.indd 2\n10/6/09 8:50:25 AM\n\n计算机技术的主要时代分类如下：\n- **1960 年代 —** 主机（“大铁块”）和小型计算机（多用户、交互式）\n\
  - **1970 年代 —** 个人电脑/桌面电脑：由微处理器驱动，可安装的应用程序\n- **1980 年代 —** 便携式电脑：可移动的电脑，重量为 15\
  \ – 30 磅\n- **1990 年代 —** 笔记本电脑，随后是薄型笔记本电脑：14 英寸或更大的屏幕\n- **2000 年代 —** 超笔记本电脑：12\
  \ – 13 英寸屏幕，便携媒体播放器（例如 iPod）\n- **2007 – 2010 —** 上上网电脑：7 – 10.2 英寸屏幕；移动互联网设备 (MIDs)：4\
  \ – 7 英寸屏幕\n\n2000 年标志着手机和智能设备时代的开始。诺基亚 9210 Communicator 和 RIM Blackberry 上市，这些紧凑的产品不仅是电话，而且远不止于此。它们不是通用计算机，但你可能会感觉到，这正是它们长大想要成为的样子。\n\
  \n## 重心的转移\n\n计算机演进的两个定义性特征是物理尺寸和显示尺寸。这些定义属性影响着用户交互以及开发者的策略和解决方案。\n\nApple 在 2001\
  \ 年 10 月推出了极其成功的 iPod，开启了最小的消费级计算领域的大门。第一代 iPod 是一个像盒口香糖大小的电脑。消费电子产品倾向于通过软件的魔法变得越来越智能，很快\
  \ iPod 系列就代表了完整的媒体设备。\n\n2007 年 1 月，Apple 通过推出 iPhone 彻底打破了这一领域的局限。同年晚些时候，引入了 iPod\
  \ Touch。这些便携式电子设备内部运行着强大的操作系统——为硬件定制的 OS X 变体。它们封装精美，带有 WiFi 和高分辨率触摸屏，现在运行的应用程序类似于笔记本电脑上的程序。Apple\
  \ 实际上在交付后来被称为移动互联网设备 (MID) 的产品。\n\n忠诚的 Apple 客户排长队抢购首批交付的产品。国际客户为早期出货支付了高额溢价。热情的开发者创建了数千个新应用程序……尽管最初\
  \ Apple 似乎并不希望他们这样做。运营商、音乐供应商和配件制造商构成的生态系统帮助了市场的增长。\n\nApple 售出了数量惊人的 iPod —— 到\
  \ 2008 年 9 月，这种移动设备已超过 1.73 亿。你随处都能看到它们——在火车、飞机、巴士上，在健身房、学校、办公楼和体育场。（天哪，我有一个朋友拥有九个这种东西！）当\
  \ Apple 在 1984 年推出 Macintosh 时，他们编写了良好人界面设计的圣经。在发布 iPhone 和 iPod Touch 时，Apple 重写了小型移动电脑的用户界面设计规范。iPhone\
  \ 重新定义了小型电脑封装的可能性。考虑一下规格：3.5 英寸对角线多点触控显示（163 ppi 下的 480 ⫻ 320 像素分辨率），小于 5 盎，封装纤薄。\n\
  \n3\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\nc01.indd 3\n10/6/09 8:50:26\
  \ AM\n\n很快就有数千名开发者开始为 iPhone 和 iPod Touch 平台构建创意、高质量的应用程序。Apple 2.0 代软件（以及 SDK）让开发者非常兴奋。2008\
  \ 年 3 月，Apple 宣布了 iPhone 2.0 SDK 的测试计划——开发平台的易用性和令人印象深刻的应用结果促使 25,000 名开发者尝试加入测试。Apple\
  \ 成功地将其所有的 SDK API 广泛应用于各个产品线——iPhone SDK 与 OS X 内核之间具有很好的共性。2008 年 6 月 9 日，Apple\
  \ 在全球开发者大会上宣布了创纪录的 5,200 名开发者——这是该活动 25 年来首次售罄。\n\n客户以数百万计购买并安装了软件。在运营的前六个月（2008\
  \ 年 7 月 11 日至 2009 年 1 月 18 日），App Store 见了 5 亿次下载。\n\n## 转折点\n\n2008 年 9 月开始的金融危机冲击了全球经济。软件公司、硬件制造商和组件制造商都受到了影响。2009\
  \ 年初，移动业务开始放缓。`TechCrunch` 报告称，五手机手机（诺基亚、三星、LG、索尼爱信和摩托罗拉）第四季度同比下降了 13%。\n\n即使是 Apple\
  \ 的 iPhone 也跌落了。Apple 在 9 月季度售出了 690 万台，但 12 月份下降了超过 25%，达到 440 万台。与此同时，RIM 隆重推出了一款——在\
  \ 1 亿美元营销活动的支持下——推出了其备受期待的 Storm。许多人认为，与 iPhone 相比，它是一个相对的失败：Blackberry 在第一个月就卖出了五十万台。\n\
  \n4\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\nc01.indd 4\n10/6/09 8:50:26\
  \ AM\n\n数字中的另一个亮点是全新的上网电脑类别：在 2008 年的前几个月，上网电脑占笔记本销量的比例不足 2%。到 12 月，这一比例已飙升至总量的\
  \ 12%，并占了整个笔记本类别增长的三分之二。\n\n《金融时报》在 2009 年初评估市场时提供了一些数据：尽管手机被搁置，笔记本电脑（以及移动电脑）的销量正在增长。2008\
  \ 年 12 月，《华尔街日报》报道，笔记本电脑销量首次超过了台式机：全球笔记本电脑出货量去年增长近 40%，达到 3860 万台，而台式机下降了 1.3%，达到\
  \ 3850 万台。\n\n4\n\n\n\n有时人们会通过问这个问题来评估电脑的易用性：“它对你奶奶来说足够简单吗？”一个更好的问题是：“它对一个 15 岁的青少年来说足够简单吗？”我非常爱我的奶奶，但即使她真的对电脑感兴趣，我怀疑大公司围绕她特定的使用场景来制定五年的商业计划是明智之举。另一方面，15\
  \ 岁的青少年通常有兴趣也有需求，并提供了极具吸引力的生命价值主张。\n\n一天晚上，我 15 岁的儿子带着他的搭载 `Windows` 的笔记本电脑来到我面前。“嘿，爸爸，你能帮我看看并帮我把\
  \ `WiFi` 调好吗？”我预料了他姐姐笔记本电脑发生的情况——是时候再次重装 `Windows` 了。\n\n他转过笔记本电脑给我看屏幕，我看到的令我震惊：那是\
  \ `Ubuntu` 桌面。\n\n“我安装了 `Ubuntu`，”他说，“哇，当我接入 `Ethernet` 时，浏览器速度超级快。现在我想起互联网以前是什么样子了。”几周以来，他一直在和他\
  \ `Windows Vista` 安装后逐渐下降的性能作斗，最后终于决定修复它。\n\n他的笔记本电脑才用了一年——性能强劲，价格超过了 1000 美元。\n\
  \n它拥有所有最新技术——`WiFi` 网卡、硬盘、精美的屏幕。但它运行得明显且莫名其妙地慢了。我的直觉是为他重装 `Windows`。尽管预感到要花几天时间让\
  \ `Windows` 重新恢复工作感到恐惧，我还是提出了这个建议。寻找 `Windows` 的驱动程序可一点不好玩。\n\n“发生什么事了？”我问，“我可以为你重装\
  \ `Windows`。”\n\n## 第 1 章：移动 Linux\n\n“不需要 `Windows`，”他说，“`Ubuntu` 挺好的。它有一个文字处理器。我不需要任何旧文件。`Vista`\
  \ 变得太慢了，我根本无法使用。昨晚我试着用 `Dictionary.com`，它一直没法用。我得去楼下的电脑上查一个单词。用打印好的字典反而更快。那正是我决定安装\
  \ `Ubuntu` 的时刻。我用了你随手丢弃的那张 CD。没问题。”\n\n我大吃一惊。我不确定哪一点更让我震惊——是他在没有帮助的情况下自己安装了 `Ubuntu`，还是他在没有提前通知我的情况下安装了它。\n\
  \n他继续说道：“`Vista` 变得太慢了，启动需要 30 分钟。我禁用了所有启动时运行的 `Vista` 应用，但并没用。我不得不让系统一直运行，以避免重启的延迟。”\n\
  \n就这样这样——他完成了切换。没有遗憾。没有后悔。没有痛苦的分离。他只是想要一个更好、更快、更可靠的系统。而且他知道哪里可以找到免费的替代方案。\n\n如果\
  \ `Windows Vista` 失去了青少年市场，它无疑将面临大大的麻烦。另一方面，如果 `Ubuntu` 开始赢得 15 岁客户群体，那么它的状况将会非常不错。\n\
  \n## 平携式电脑、Linux 和 Ubuntu\n\n`ASUS Eee PC` 于 2007 年 9 月上市。它立即走红。它小巧、轻便且便宜（300 美元以下），既运行\
  \ `Xandros Linux` 也运行 `Windows XP`。在 `Intel` Atom 处理器于 2008 年发布后，`Eee PC` 切换到了 `Atom`\
  \ ——这是一种能效芯片，拥有众周知且强大的指令集。\n\n一种全新的电脑分类诞生了——上网笔记本（netbook）。其他厂商很快也推出了自己的产品：`HP Mini\
  \ - Note`、`MSI Win`、`Acer Aspire One`、`Dell Inspiron Mini 9` 以及 `Lenovo IdeaPad\
  \ S10` 以各种配置供货。信息网络估计，“2008 年销售了 1140 万台上网笔记本，高于 2007 年的 40 万台。”对于 2009 年，该公司估计上网笔记本的销售量将增长\
  \ 189%，达到 2150 万台。同时，该公司估计 2008 年销售了 1459 万台笔记本电脑，并预计该数字在 2009 年将增长 21.8%，达到 1777\
  \ 万台。\n\n其他预测表明，终有一天这些小外的电脑的销量将超过笔记本电脑。\n\n根据 `LinuxDevices` 的报告，`ABI Research`\
  \ 预测“今年将出货 3500 万台上网笔记本，到 2013 年将增加到 1.39 亿台。”\n\n我目睹了 `Eee PC` 在 2007 年 12 月一直到\
  \ 2008 年成为风靡产品。最终，我买了一台运行新款 `Intel Atom` 芯片的 `Acer Aspire`。（根据 `Intel` 高级副总裁 Pat\
  \ Gelsinger 的说法，“到 2010 年，Atom 将移动计算的各个方面将具有竞争力。”）这台小 `Acer` 在一个纤薄、耐用、漂亮的外壳内包含了固态硬盘。它看起来像是一台非常出色的电脑。在图\
  \ 1-3 中，你可以看到 `Acer Aspire One` 与 `T-Mobile` 手机、`iPod Touch` 和 `Compal MID` 的相对大小——它们都放在一台\
  \ `Dell Inspiron` 笔记本电脑上。\n\n![Image 6](img/index-43.jpg)\n\n图 1-3 `Aspire One`\
  \ 安装了基于 Linux 构建的定制运行环境。绝大多数基于 Linux 内核的操作系统发行版基本上都是 `GNU` 操作系统的修改版本。\n\n除了为发行版提供坚实的基础外，`Linux`\
  \ 就像软件界的瑞士军刀。（我曾多次用它从损坏且无法启动的电脑中恢复文件。）它被移植到大量的硬件平台，而且供应商越来越多地为开源和 Linux 开发自己的硬件驱动程序。\n\
  \n为什么选择 `Ubuntu`？质量、可靠性和采用率是几个很好的理由。`Ubuntu` 和 `Debian` 是我从 2005 年开始使用的两个发行版，我一直坚持使用它们。\n\
  \n月复一个月，Ubuntu 一直位列 `DistroWatch` Linux 发行版列表的前列或附近。\n\n此外，还有一个伟大的开发者社区。来自 `Canonical`\
  \ 健康（且富有）的协调提供了稳定性和重要的方向。2009 年初，《纽约时报》介绍了 `Canonical` 的创始人兼 Ubuntu 愿景人物 Mark Shuttleworth：\n\
  \nUbuntu 仅在四多年前创立（发音为 oo - BOON - too）已成为 Linux 操作系统增长最快、最受推崇的版本，它主要通过其极低的价格：0 元与\
  \ Windows 竞争。\n\n据估计，现在有超过 1000 万人在运行 Ubuntu，他们对微软在发达国家的霸权构成了威胁，在那些追赶科技的地区更是如此。\n\
  \n“如果我们成功了，我们将从根本上改变操作系统市场，”Shuttleworth 先生在会议——Ubuntu 开发者峰会的间隙期间说道，“微软需要适应，我不认为那是不健康的。”\n\
  \n拿起上网笔记本很容易带上就走。而且我在台式电脑上能做的任何事情，在这台设备上也能做——虽然没那么快，但对很多来说运行得很好。结果，运行 Ubuntu 的上网笔记本变成了一个全新的开发平台，但它是一个非常熟悉的平台。然而，由于移动性带来的各种不同维度，应用可能的范围大大增加。\n\
  \n\n\n\n\n所以，为什么不使用 `Linux` 和 `Ubuntu` 为这类移动计算机进行开发呢？如果你这样做了，你将并不孤单。考虑一下林斯·托瓦尔斯（Linus\
  \ Torvalds）在 2009 年年初说的话：“要做一个发行版是一项巨大的工程。之所以有数百个发行版是因为很容易开始自己的，但如果你想成为领导者并引入新代码，其中涉及的测试和问答是巨大的。这取决于是否有足够的用户来获得覆盖，而且期望过多的大型发行版是不合理的。`Ubuntu`\
  \ 的增长速度惊人，也许这种情况会再次发生……”\n\n我当时在笔记本电脑（netbook）上进行内核开发，一点也不糟糕。屏幕太小了，但我们正在进入一个可以买到廉价优质笔记本的阶段。\n\
  \n几年前，你可以买到小型笔记本电脑，但成本是双倍。笔记本电脑市场改变了游戏——它们不再被视为高管玩具，而是一种低端笔记本，这健康得多。\n\n有了笔记本电脑，许多台式机在适应更小屏幕时遇到了困难。突然之间，你无法点击“确定”按钮，因为它在屏幕之外。随着屏幕缩小到手机大小，谷歌的\
  \ Android 可能成为笔记本电脑的竞争者，因此你可能会看到 Android 在成长，而不是台式机在缩小。\n\n我们正处于笔记本电脑的第一阶段，存在一些成长的问题。简化的界面是一个成长的问题，而第一批笔记本电脑性能不足。\n\
  \n# 巨人之力，矮人之躯\n\n第二次世界大战期间，最大的科学创新之一涉及雷达。英国人开发了关键的基础技术和对微波物理的基本理解，远超美国科学家的发现。英国的发明之一是被称为`空腔磁控`（cavity\
  \ magnetron）的装置。\n\n`磁控`。这种设备导致了轻型、紧凑、移动设备的成功开发，该设备被用于空中雷达系统，其功率比之前的任何设备都强 10 倍。英国与美国分享了这项技术。当一名美国军官第一次看到它并完全理解了它的用途时，他描述该设备拥有“矮人之躯中的巨人之力”。\n\
  \n这项发明对战术、策略和结果产生了巨大影响。这项单一而强大且移动的技术甚至可能改变了战争的结果。\n\n小型、强大、高能的处理器（如英特尔的 Atom 和现在的\
  \ `ARM`）正与多功能软件环境（如 `Ubuntu` 和 `Linux`）相结合，创造出无法比拟的新未来。这些高移动性系统包含了“矮人之躯中的巨人之力”——而且它们现在已数百万用户可以使用。\n\
  \n## 总结\n\n通过阅读这本书，你正处于移动 Linux 前沿令人兴奋的新进展的最前线。你的开发工作将创造未来和新一代的改进。\n\n# 开发环境\n\n\
  移动设备的开发过程往往不同于你在工作站或服务器上开发时可能使用的普通过程。通常，你可能需要在工作环境中从零生成一个完整的 OS 镜像，然后将其安装在目标设备上。\n\
  \n在 `Ubuntu Mobile` 项目中，开发者可以使用一套完整的构建包，因此通常与现“从零开始构建自己的操作系统”项目相关的复杂性在这里并不是问题。各种工具弥补了\
  \ `Ubuntu Mobile` 开发与普通 `Ubuntu` 开发之间的剩余差距。\n\n本章展示了你可以访问开始开发所需的开发环境的不同方式。在为移动设备进行开发时，其架构可能与你的工作站不同——例如，`i386`\
  \ 台式机和低功耗英特尔架构（`LPIA`）设备，因此将主机环境（有时称为源）与虚拟机环境（有时称为目标）分开是有必要的。今天实现此点的常用方法是使用虚拟化。\n\
  \n虚拟化将操作系统与底层平台资源完全分离——可以使用不同的技术来实现这一点。对于 `Hardy` 版本，`Ubuntu` 选择将虚拟化精力集中在 `KVM`\
  \ 上。内核虚拟机（`KVM`）是 `Linux` 内核的一个补丁，允许虚拟机操作系统直接运行在主机硬件上。`KVM` 还采用快速仿真器（`QEMU`）将`Linux\
  \ 内核`本身转换为虚拟机监控程序（Hypervisor）。\n\n虚拟机监控程序是一种允许多个操作系统在主机计算机上并发运行的软件。`QEMU` 是模拟硬件的虚拟化软件。\n\
  \n那么，`KVM` 用于具有硬件虚拟化支持的系统，它的额外优势是在这些不可用时回退到 `QEMU`。通过运行在`Linux 内核`上，虚拟机显示为 `Linux`\
  \ 进程，可以像管理任何其他 `Linux` 一样管理它们。\n\n然而，`KVM` 目前没有提供可以帮助接触 `Ubuntu Mobile` 的开发者快速上手开发的\
  \ GUI。来自太阳微系统公司（Sun Microsystems, Inc.）的 `VirtualBox` 是一种基于 `GPL` 可用虚拟化解决方案，它具有良好的界面且易于运行。本章通过使用\
  \ `VirtualBox` 和 `KVM` 描述了一些示例。最后，为了对开发环境进行最大控制，你将学习如何从零创建一个镜像。这种方法提供了更多定制机会，是经验更丰富的开发者的首选。\n\
  \n## 开始上手\n\n从 `http://cdimage.ubuntu.com/releases/jaunty/release/` 下载 `Jaunty Ubuntu\
  \ MID` 发布版，并将其保存到硬盘上的一个文件夹中。\n\n本章演示的所有技术（`ARM` 部分外）都使用 `Ubuntu MID` 发布版；然而，它们也经过了测试，并与\
  \ `Ubuntu Netbook Remix` 发布版配合工作。如果你的目标是笔记本电脑，请下载此发布版。\n\n## 熟悉 Ubuntu Mobile 环境\n\
  \n本节涵盖了 `Ubuntu Mobile` 环境。\n\n### VirtualBox\n\n太阳 xVM `VirtualBox` 是一系列虚拟机工具，允许开发者同时运行多个操作系统镜像。要看到其效果，请先安装软件。\n\
  \n```bash\nsudo apt-get install virtualbox-ose\n```\n\n`virtualbox-ose` 位于 universe\
  \ 存储库。要启用此社区维护的软件存储库，请转到系统软件源，并勾选 universe 框。\n\n安装后，可以将早些在“开始上手”部分下载的镜像进行转换，以便在\
  \ VirtualBox 中使用。\n\n要执行此操作，请运行命令（将 `.img` 文件名替换为你下载的文件）：\n\n```bash\nvboxmanage\
  \ convertdd ubuntu-9.04-mid-lpia.img ubuntu-9.04-beta-mid-lpia.vdi\n```\n\n这会将 `ubuntu\
  \ - 9.04 - beta - mid - lpia.img` 转换为 `.vdi` 格式，以便其在 `VirtualBox` 中作为“硬盘”使用（后文将进行详细介绍）。\n\
  \n\n\n\n\n# 安装\n\n点击 `New` 启动安装向导。点击 `Next` 继续，这将弹出 `VM Name` 和 `OS Type` 对话框。按照图\
  \ 2-2 所示完成对话框，然后点击 `Next`。\n\n图 2-2\n\n在下一个屏幕上，为虚拟机选择允许的最大内存（如果超过了硬件允许的最大内存，将无法点击\
  \ `Next` 按钮）。图 2-3 所示的下一个屏幕用于硬盘。\n\n图 2-3\n\n点击 `New` 然后 `Next`。选择 `Dynamically\
  \ expanding storage` 并再次点击 `Next`。磁盘镜像默认保存在 `~/.VirtualBox/HardDisks/<name>`，因此在本示例中，图\
  \ 2-4 显示的硬盘将保存为 `/home/ian/.VirtualBox/HardDisks/` 目录下的 `mid.vdi`。\n\n图 2-4\n\n\
  选择 `Next` 然后点击 `Finish`，你将看到图 2-5。\n\n图 2-5\n\n此主硬盘（Primary Master hard disk）允许\
  \ 8GB 的空间。选择 `Next` 然后点击 `Finish`，这将创建图 2-6 所示的新虚拟机 `mid`。\n\n图 2-6\n\n现在需要在此硬盘硬盘上安装\
  \ `Ubuntu MID`，以便进行软件的开发和测试。点击图 2-6 中的 `Settings` 按钮，将虚拟机的设置，如图 2-7 所示。\n\n图 2-7\n\
  \n选择 `Hard Disks`，这将打开另一个屏幕，如图 2-8 所示。\n\n图 2-8\n\n有必要向虚拟机添加另一个硬盘（包含 `Ubuntu MID`\
  \ 操作系统的硬盘）。要执行此操作，选择右侧带有加号的磁盘图标，然后点击文件夹图标。这将显示图 2-9 所示的屏幕。\n\n图 2-9\n\n选择 `Add`\
  \ 并浏览包含转换镜像的文件夹，该镜像是用本节稍后使用的命令生成的：\n```\nvboxmanage convertdd ubuntu-9.04-mid-lpia.img\
  \ ubuntu-9.04-beta-mid-lpia.vdi\n```\n选择转换后的镜像，屏幕应看起来像图 2-10。\n\n图 2-10\n\n点击 `Select`\
  \ 返回 `Hard Disks` 屏幕（见图 2-11）。添加的 `ubuntu-9.04-beta-mid-lpia.vdi` 必须设置为 `IDE Primary\
  \ Slave`。\n\n图 2-11\n\n点击 `OK`，你将返回之前在图 2-6 中看到的 `VirtualBox` 管理界面。\n\n现在可以通过点击\
  \ `Start` 箭头来启动虚拟机。\n\n你可能会看到一个错误提示，例如图 2-12 所示。\n\n图 2-12\n\n这意味着 `KVM` 模块已安装在主机系统内核中。以前，这意味着你需要重新编译内核。然而，在\
  \ Ubuntu 中，只需运行运行：\n\n```\nsudo /etc/init.d/kvm stop\n```\n\n卸载 `kvm` 模块 `kvm_intel`\n\
  \n模块将被卸载。\n\n当虚拟机启动时，按下 `F12` 键（这将允许选择启动设备），你将看到图 2-13 所示的屏幕。\n\n图 2-13\n\n选择选项\
  \ 2，即从盘（`ubuntu-9.04-mid-lpia.vdi` 硬盘）进行启动。\n\n然后选择尝试运行 `Ubuntu MID` 的选项，它将进入图 2-14\
  \ 所示的屏幕。\n\n图 2-14\n\n在虚拟机中，`Ubuntu MID` 界面的顶栏包含一个菜单，允许用户更改显示的程序组。点击 `Home` 下拉列表并选择\
  \ `Preferences`。\n\n点击 `Install` 图进行安装。系统将安装在你之前创建的 `mid.vdi` 上，该镜像在安装程序中以硬盘的形式表示，如图\
  \ 2-15 所示。\n\n图 2-15\n\n安装完成后，需要重启，如图 2-16 所示。\n\n图 2-16\n\nVirtualBox 支持硬件虚拟化。要启用此功能，首先检查处理器是否支持。然后进入\
  \ `Settings` 并选择 `General` 选项卡。勾选 `Enable VT-x` 复选框。这样做可以提高虚拟机的速度。\n\n### KVM/QEMU\n\
  \nKVM（内核虚拟机）是 Linux 的全虚拟化解决方案。它由一个可加载内核模块 `kvm.ko`（提供核心虚拟化基础）以及一个特定处理器的模块 `kvm-intel.ko`\
  \ 或 `kvm-amd.ko` 组成。因此，它依赖 Intel VT 或 AMD-V 硬件，是 Linux 的全虚拟化方案。\n\n要在系统中检查此项，请运行以下命令：\n\
  \n```bash\negrep 'vmx|svm' /proc/cpuinfo\n```\n\n如果输出中显示 `vmx` 或 `svm`，则硬件（CPU）将支持\
  \ KVM。如果没有打印任何内容，KVM 将回退到较慢的基于 QEMU 的软件虚拟化。QEMU 也用于其他架构（如 ARM）的虚拟化。这将在本章稍后部分解释。\n\
  \n## 使用 QEMU\n\n要使用 QEMU，请安装必要的包：\n\n```bash\nsudo apt-get install qemu kqemu-source\n\
  ```\n\n接下来，将你的用户名添加到 `kqemu` 组。将用户名添加到 `kqemu` 组意味着你不需要 root 用户运行 QEMU。要要添加用户名，请运行：\n\
  \n```bash\nsudo adduser <username> kqemu\n```\n\n使这些更改生效，需要注销并重新登录。\n\n要测试 QEMU，进入包含从\
  \ `http://cdimage.ubuntu.com` 下载的镜像的文件夹并运行以下命令：\n\n```\nqemu -localtime -m 384 -boot\
  \ c ubuntu-9.04-beta-mid-lpia.img\n```\n*如果下载的 .img 名称与上方不同，请将其替换为你下载的文件。*\n\n要启用\
  \ `kqemu` 加速模块，需要如下传递参数 `-kernel-kqemu`：\n\n```\nqemu -kernel-kqemu -localtime -m\
  \ 384 -boot c ubuntu-9.04-beta-mid-lpia.img\n```\n\n\n\n\n必须启用 `noapic` 选项启动。执行此操作，请在屏幕出现时选择\
  \ `F12` 并选择 `2` 从硬盘启动。然后选择 `F6`。这将显示图 2-17 所示的菜单。选择 `noapic` 。\n\n图 2-17\n\n###\
  \ QEMU  ARM\n\n在真实硬件上安装 Ubuntu ARM 之前，最好先用模拟器尝试一下。这种方法也允许使用原生编译器来构建和打包应用程序，而不是使用交叉编译。\n\
  \n交叉编译器是一种能够为运行编译器的架构以外的架构创建执行代码的编译器。在 `i386` 环境下创建 ARM 二进制文件就是一个示例。\n\n要在 Ubuntu\
  \ Jaunty 上实现此操作，从 `http://people.ubuntu.com/~ogra/arm/build-arm-rootfs` 下载脚本。赋予其执行权限：\n\
  \n```bash\nchmod +x build-arm-rootfs\n```\n\n注意需要安装 `QEMU` 和 `debootstrap`。\n\n\
  运行以下脚本（此命令需要很长时间）：\n\n```bash\nsudo ./build-arm-rootfs -f pumd-arm -l <user> -p\
  \ <password> --notarball\n```\n\n记住下述命令中的用户名和密码，因为它们是登录客户机时使用的用户名和密码。\n\n这将在文件夹中创建一个\
  \ `.img` 文件。接下来，从 `http://people.ubuntu.com/~ogra/arm/qemu/kernel/vmlinuz-2.6.28-versatile`\
  \ 下载适用于 ARM 的内核，然后运行 `qemu-system-arm`，并将 `.img` 和内核都作为参数添加：\n\n```bash\nqemu-system-arm\
  \ -M versatilepb -kernel ./vmlinuz-2.6.28-versatile -hda qemu-armel-200904291613.img\
  \ -m 256 -append “root=/dev/sda mem=256M ro”\n```\n\n你需要将 `.img` 名称替换为脚本创建的名字；`build-arm-rootfs`\
  \ 脚本是基于日期的，因此运行它将产生类似 `qemu-armel-YYYYMMDDHHMMSS.img` 的结果。\n\n这将执行 `QEMU` 并允许使用\
  \ `.img` 创建步骤中指定的用户名和密码登录。可以验证原生架构，如图 2-18 所示。\n\n图 2-18\n\n### 使用 KVM\n\n如果你的硬件支持\
  \ `KVM`，下一步是安装必要的包：\n\n```bash\nsudo apt-get install kvm\n```\n\n接下来，将你的用户添加到 `kvm`\
  \ 组。添加你的用户名意味着你不需要以 root 用户身份运行 `KVM`。执行此操作请运行以下命令：\n\n```bash\nsudo adduser <username>\
  \ kvm\n```\n\n在添加新用户后需要重启虚拟机。接下来，使用以下命令在 KVM 中运行 `.img`：\n\n```bash\nkvm -localtime\
  \ -m 512 -boot c ubuntu-9.04-beta-mid-lpia.img\n```\n\n要安装 Ubuntu MID 镜像，将遵循与 VirtualBox\
  \ 安装类似的过程。将 `.img` 设置为第二个硬盘，这样你就可以在第一个硬盘上安装了。你可能会考虑类似这样的操作：\n\n```bash\nkvm -localtime\
  \ -m 512 -hda installed-mid.img -hdb ubuntu-9.04-beta-mid-lpia.img\n```\n\n然而，前述命令无法工作！除了\
  \ `installed-mid.img` 不存在之外，`QEMU` 和 `KVM` 中使用的 `Bochs BIOS` 不允许从第二个硬盘启动。作为解决方法，Ubuntu\
  \ 移动团队提供了一个较小的（小于 400KB）ISO 镜像，可以从中选择第二个硬盘启动。这可以在 `http://people.ubuntu.com/~lool/isolinux.iso`\
  \ 获取。\n\n生成上述 ISO 的脚本可以使用 `bzr` 获取（见附录 A），你可以在 `lp:~ubuntu-mobile-dev/ubuntu-mobile/mobile-scripts`\
  \ 找到它。部分脚本将在章节后半部分详细讨论。\n\n使用以下命令启动 `KVM`：\n\n```bash\nkvm -m 512 -cdrom isolinux.iso\
  \ -hda installed-mid.img -hdb ubuntu-9.04-mid-lpia.img\n```\n\n上述命令中的 `installed-mid.img`\
  \ 使用以下命令创建：\n\n```bash\nqemu-img create installed-mid.img 4G\n```\n\n这里 `4G` 代表\
  \ 4GB 的虚拟硬盘空间。由于 `installed_mid.img` 是空的，它将使用上述命令中指定的 `-cdrom` 选项启动。当这样做时，`isolinux.iso`\
  \ 将提供通过选项 2 从第二个硬盘启动。选择此选项并安装到第一个硬盘（`grub` 也会安装在那里）。\n\n安装过程本身与 VirtualBox 安装相同；在虚拟机上，Ubuntu\
  \ MID 界面的顶栏包含一个菜单，允许你更改显示的程序组。点击 Home 下拉菜单并选择 `Preferences`。你会看到一个安装图标。点击该图标进行安装。\n\
