  \n*在继续之前，必须在 `source.list` 文件中添加 `deb -src` 条目。*\n\n接下来，输入命令同步包索引文件：\n\n```bash\n\
  $ sudo apt-get source linux-image-uname -r\n```\n\n现在可以直接从 debian 存储库获取内核源码了：\n\n\
  ```bash\n$ sudo apt-get source linux-image-uname -r\n```\n\n创建的目录与通过 git 工具创建的目录几乎相同，定制内核的步骤也是一样的。\n\
  \n## 创建 Debian 包\n\n如果 OEM 或用户旨在构建非 Ubuntu 的内核源码，或想要生成 Debian 包，那么这可能是正确的选择方法，因为你想使用最新的官方\
  \ 2.6 内核树。当然，它也适用于任何其他官方或非官方的可编译内核树。\n\n这种方法提供了获取内核源码的两种主要方式。与之前的 Ubuntu 方法一样，既可以从\
  \ git 获取，也可以从 debian 存储库获取。让我们先看 git 仓库，然后看 debian 源码存储库。\n\n这里使用的非 Ubuntu git 仓库是来自\
  \ `kernel.org` 的最新官方 `linux-2.6` 内核树。然而，源码库可能会发生变化。deb 仓库也是如此。\n\n只有初始步骤会有不同——即内核配置、编译和安装步骤均保持不变。\n\
  \n该方法的第一步是确保用户已在设备上安装了所有依赖：\n\n```bash\n$ sudo apt-get update\n$ sudo apt-get install\
  \ git-core fakeroot makedumpfile\n$ sudo apt-get install libncurses5-dev build-essential\n\
  $ sudo apt-get install kernel-package\n$ sudo apt-get build-dep linux\n```\n\n现在获取内核树：\n\
  \n```bash\n$ git clone git://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux-2.6.git\
  \ linux-2.6.git\n```\n\n需要说明的是，该树旨在用于开发目的，可能并不稳定。因此，如果编译过程中出现任何错误，可以使用 `git` 工具切换到任何之前的可用版本。\n\
  \n此步骤将取决于连接速度，可能持续一段时间。完成后，将创建一个名为 `linux-2.6.git` 的目录。这就是进行所有工作的地方。进入：\n\n```bash\n\
  $ cd linux-2.6.git/\n```\n\n与第一种方法不同，没有预先构建好的配置文件。为了避免浪费时间寻找初始的可用配置，只需复制当前内核使用的配置文件即可。这应该可以缩短定制时间：\n\
  \n```bash\n$ cp /boot/config-uname -r .config\n```\n\n现在内核源码已下载，并有了初始配置文件。是时候开始配置阶段了。有许多方法可以实现，这里将显示\
  \ ncurses 前界面。通过 ncurses 前界面进行的配置步骤将对应图 8-1、8-2 和 8-3。\n\n可以通过输入以下命令启动：\n\n```bash\n\
  $ make menuconfig\n```\n\n在离开前界面之前，请确保在图 8-4 所示的屏幕上选择 Yes 以正确保存所有内容。\n\n*如果用户没有使用任何前界面，在继续后续步骤之前，运行一个额外的命令来更新编辑过的配置文件会很有趣：*\n\
  \n```bash\n$ make oldconfig\n```\n\n现在编译并创建 Debian 包。我们在这里应该定义两个参数：\n- `append-to-version-name`\n\
  - `revision-number`\n\n第一个参数是目标定制内核的简短描述。第二个参数在将来有多个不同的编译包时，用于通知 Debian 包管理器哪一个是较新的编译版本。因此，第一次编译将从\
  \ 1 开始，每个新构建的包的修订号都会加 1。\n\n为了编译内核并确保包被正确构建，输入以下命令：\n\n```bash\n$ fakeroot make-kpkg\
  \ --initrd --append-to-version -cuustom --revision 1 kernel_image kernel_headers\n\
  ```\n\n通过添加 `kernel_image` 和 `kernel_headers`，内核镜像包及其头文件也会被构建。\n\n`initrd` 用于创建初始\
  \ RAM 磁盘并使启动分阶段进行。在第一阶段，初始 RAM 磁盘被挂载为临时根文件系统，这将帮助系统根文件系统的正确挂载。得益于第一阶段，配置过的内核可以将内核中的几乎所有内容编译为模块（而不是内置）。这些所需的模块将在真实文件系统挂载之前加载。\n\
  \n当该编译步骤完成后，内核包已准备就绪安装。为了确保其正确完成，请在父目录中查找以下文件：\n\n```bash\n$ cd ../\n$ ls linux-image-<kernel’s\
  \ version>-1-custom.deb\n$ ls linux-headers-<kernel’s version>-1-custom.deb\n```\n\
  \n如果由于任何原因在编译过程中出现任何问题，请回到内核的任何已知可用版本——例如在本文写作时的 `v2.6.29-rc6`。每个官方版本在 git 树中都有标签（tag）。\n\
  \nGit 在附录 B 中有详细解释，但这里也会涵盖。再次进入内核目录：\n\n```bash\n$ cd linux-2.6.git/\n```\n\n现在输入以下命令查看内核\
  \ git 树中创建的所有标签。然后选择最新的或任何其他较旧的。\n\n```bash\n$ git tag\n```\n\n( ... )\nv2.6.28\n\
  v2.6.28-rc1\nv2.6.28-rc2\nv2.6.28-rc3\nv2.6.28-rc4\nv2.6.28-rc5\nv2.6.28-rc6\nv2.6.28-rc7\n\
  v2.6.28-rc8\nv2.6.28-rc9\nv2.6.29-rc1\nv2.6.29-rc2\nv2.6.29-rc3\nv2.6.29-rc4\nv2.6.29-rc5\n\
  v2.6.29-rc6\nlatest\n\n由于官方版本是最新的，通过执行此处所示命令让 git 树回到该版本：\n\n```bash\n$ git checkout\
  \ v2.6.29-rc6\n```\n\n\n\n\n在继续之前，有必要再次更新内核的配置文件。现在可能不需要运行任何前端，因此只需输入命令：\n\n```\n\
  $ make oldconfig\n```\n\n对于每一个可能出现的问题，直接按回车（Enter）并选择默认选项即可。现在，内核已准备好再次编译。运行以下指令重启编译：\n\
  \n```bash\n$ make-kpkg clean\n$ fakeroot make-kpkg --initrd --append-to-version\
  \ -custom --revision 1 \\ kernel_image kernel_headers\n```\n\n如果这次一切顺利，就可以运行之前演示的命令来查看构建好的包。\n\
  \n现在，最后一步就是安装这些包。回到父目录：\n```bash\n$ cd ../\n```\n\n可以通过输入以下命令安装这些包：\n\n```bash\n\
  $ sudo dpkg -i linux-image-<kernel’s version>-1-custom.deb\n$ sudo dpkg -i linux-headers-<kernel’s\
  \ version>-1-custom.deb\n```\n\n# 第 8 章：内核精细调优\n\n下载内核源码的另一种方法是通过 `dpkg` 工具。遗憾的是，使用这种方法几乎总是意味着将下载一个过时的内核版本。这里的要务之急是确定哪些版本可用：\n\
  \n```bash\n$ sudo apt-get install linux-image-2.6\n```\n\n打印出的信息类似于下面：\n\n```\n\
  Reading package lists... Done\nBuilding dependency tree\nReading state information...\
  \ Done\nPackage linux-source-2.6 is a virtual package provided by:\nlinux-source-2.6.26\
  \ 2.6.26-13\nlinux-source-2.6.28 2.6.28-1\n```\n\n你应该显式地选择一个进行安装。\n\n```\nE: Package\
  \ linux-source-2.6 has no installation candidate\n```\n\n应该选择最新的一个：\n```bash\n$\
  \ sudo apt-get install linux-source-2.6.28\n```\n\n当包安装后，必须通过以下命令将其提取到任何可用的目录：\n\
  \n```bash\n$ cd <user’s directory>\n$ tar xjf /usr/src/linux-source-2.6.28.tar.bz2\n\
  $ cd linux-source-2.6.28\n```\n\n源码现在就绪了。\n\n# 更新自定义内核树\n\n内核将不断演进。在我们之前创建自定义内核包之后，新的版本将会发布。幸运的是，`git`\
  \ 版本控制工具支持更新修改过的内核树（至少比重新应用之前显示的所有更改要省力得多）。\n\n我们将演示更新内核树的两种场景——选择取决于是否正在使用 Ubuntu\
  \ Linux 内核树。为了本节操作，对 `git` 工具有良好的理解至关重要，特别是如果选择了第一种方法。如果你对任何步骤需要说明，请参阅涵盖了 `git`\
  \ 用法的附录 B。\n\n## 更新 Ubuntu 内核树\n\n如果你选择第一种方法，主要优势之一可以使用最新的 Ubuntu 内核版本。如果该 git 树发布了新的更改，你可能更新下载的内核树并应用它，而无需重新进行修改。\n\
  \n执行此操作的第一步是验证 git 树中被修改的文件和当前分支。在进行任何操作之前，进入内核树目录。然后开始输入以下命令来获取当前分支：\n\n```bash\n\
  $ git branch\n```\n\n结果应该如下：\n\n```\n$ * master\n```\n\n这意味着选择了“master”分支。现在，获取所有修改文件的列表：\n\
  ```bash\n$ git status\n```\n\n```\n# On branch master\n# Changed but not updated:\n\
  # (use “git add <file>...” to update what will be committed)\n# modified: debian/config/lpia/config\n\
  # modified: debian/config/lpia/config.lpia\n# modified: debian/control\n# modified:\
  \ debian/control.stub\n# modified: debian/rules.d/lpia.mk\n# modified: debian/scripts/misc/getabis\n\
  # Untracked files:\n# (use “git add <file>...” to include in what will be committed)\n\
  # build/\n# debian/config/lpia/config.lpiacustom\n```\n\n结果中有两个列表：“Changed but not\
  \ updated”（已修改未更新）和“Untracked files”（未跟踪文件）。第一个指的是所有已存在但被修改的文件。第二个指的是新文件（无论是用户创建的还是自动生成的）。发现的未跟踪文件可能比上述代码中显示的更多。\n\
  \n这应该不是问题。但是，如果*严格*按照《创建 Ubuntu 包》中的步骤操作，那么第一个列表应该如所示。如果不是，请重做本节。\n\n为了保存新的自定义配置，需要在用户的\
  \ git 树中创建一个新分支——然后将“master”分支重置为本地未修改的状态。让我们创建一个名为“custom”的新分支并切换到该分支：\n\n```bash\n\
  $ git checkout -b custom\nM debian/config/lpia/config\nM debian/config/lpia/config.lpia\n\
  M debian/control\nM debian/control.stub\nM debian/rules.d/lpia.mk\nM debian/scripts/misc/getabis\n\
  Switched to a new branch “custom”\n```\n\n新分支现在已创建。在存储这些修改之前，需要先添加被修改的文件：\n```\n\
  $ git add debian/config/lpia/config debian/config/lpia/config.lpia\n$ git add debian/control\
  \ debian/control.stub debian/rules.d/lpia.mk $ git add debian/scripts/misc/getabis\n\
  ```\n\n然后，需要使用以下命令添加之前创建的名为 `config.lpiacustom` 的未跟踪文件：\n\n```bash\n$ git add debian/config/lpia/config.lpiacustom\n\
  ```\n\n所有修改现在都被标记为待保存。可以通过输入以下命令来检查这一点：\n\n```bash\n$ git status\n```\n\n结果应该是：\n\
  \n```\n# On branch custom\n# Changes to be committed:\n# (use “git reset HEAD <file>...”\
  \ to unstage)\n# modified: debian/config/lpia/config\n# modified: debian/config/lpia/config.lpia\n\
  # new file: debian/config/lpia/config.lpiacustom\n# modified: debian/control\n#\
  \ modified: debian/control.stub\n# modified: debian/rules.d/lpia.mk\n# modified:\
  \ debian/scripts/misc/getabis\n# Untracked files:\n# (use “git add <file>...” to\
  \ include in what will be committed)\n# build\n```\n\n与之前的“git status”不同，这一次有一个名为“Changes\
  \ to be committed”（待提交更改）的新列表。此列表中的每项修改都将使用以下命令提交：\n```\n$ git commit\n```\n\n会弹出一个文本编辑器。在保存文件并退出编辑器后，命令将完成。如果在未保存的情况下退出编辑器，则提交命令将中止。在保存文件之前，用户需要为提交编写一些简短描述，如下代码所示：\n\
  \n```\nlpia: custom: Customized configuration for lpia\n\nThis patch adds the custom\
  \ flavour\nin lpia arch\nSigned-off by: User Name <user@email.com>\n# Please enter\
  \ the commit message for your changes. Lines starting\n# with ‘#’ will be ignored,\
  \ and an empty message aborts the commit.\n# Committer: root <root@esdhcp03540.(none)>\n\
  # On branch custom\n# Changes to be committed:\n# (use “git reset HEAD <file>...”\
  \ to unstage)\n# modified: debian/config/lpia/config\n# modified: debian/config/lpia/config.lpia\n\
  # new file: debian/config/lpia/config.lpiacustom\n# modified: debian/control\n#\
  \ modified: debian/control.stub\n# modified: debian/rules.d/lpia.mk\n# modified:\
  \ debian/scripts/misc/getabis\n# Untracked files:\n# (use “git add <file>...” to\
  \ include in what will be committed)\n# build\n```\n\n\n\n\n\n这条消息类似于电子邮件，但有一些额外的规则。第一条是所有以\
  \ `#` 开头的行都会被忽略。第一行是主题。它的描述应该简短且直接。然后，在一个空行之后是补丁（patch）的描述，作为电子邮件的正文。它需要更长、更完整，并且可以多行。再过一个空行之后是补丁的签名（sign-off）。签署“patch-off”的人保证该补丁确实有效。保存文件并退出编辑器后，所有修改都将应用于本地工作分支。通过输入下一个命令，可以确认补丁已已保存：\n\
  \n```\n$ git log\n```\n\n```\ncommit 6d6ef0fca469453cc64a6bcfca31e15a1c8a002f\n\
  Author: root\n<\nroot@esdhcp03540.(none)\n>\nDate: Sun Mar 22 14:57:59 2009 +0000\n\
  lpia: custom: Customized configuration\nThis patch adds the custom flavour in lpia\
  \ arch\nSigned-off by: User Name\n<\nuser@email.com\n>\n\ncommit 75d2d4cd02f92e7c7d9fce28bef556c79bdbed92\n\
  Author: Amit Kucheria\n<\namit.kucheria@ubuntu.com\n>\nDate: Thu Feb 26 12:00:37\
  \ 2009 +0200\nUBUNTU: Updating configs (arm:ixp4xx)\nBeeper is compiled in to beep\
  \ helpfully during installs\nSigned-off-by: Amit Kucheria\n<\namit.kucheria@ubuntu.com\n\
  >\n\ncommit 68a81f84a1361bc016209dfadd1f0ad1371dedf3\nAuthor: Tim Gardner\n<\ntim.gardner@canonical.com\n\
  >\nDate: Wed Feb 25 14:25:05 2009 -0700\nUBUNTU: Start new release\nIgnore: yes\n\
  Signed-off-by: Tim Gardner\n<\ntim.gardner@canonical.com\n>\n(More commits...)\n\
  ```\n\n内容不需要与上面显示的完全相同。最后两个条目可能不同，第一条也可能存在某些差异。这里的主要问题是第一个描述必须与之前输入的内容相同。如果是的话，就完成了。可以从\
  \ `git` 获取新分支的状态，以确认没有待处理的修改：`$ git status`\n\n```\nroot@esdhcp03540:~/ubuntu-jaunty.git#\
  \ git status\n# On branch custom\n# Untracked files:\n# (use “git add\n<\nfile\n\
  >\n...”) to include in what will be committed)\n# build/\n```\n\n所有在提交（commit）之前添加的文件都不再被列出。这意味着它们的修改现在是本地分支的一部分。因此，作为下一步，让我们再次检出“master”分支，以便更新它并获取最新的的\
  \ Ubuntu 内核版本。\n\n```\n$ git checkout master\n```\n\n在继续内核更新之前，有必要确保工作分支中没有待处理的修改。你可以再次使用\
  \ `git status` 命令：`$ git status`\n\n如果有“已更改但未更新”（Changed but not updated）列表，说明工作分支是不干净的。可以使用以下命令重置工作分支并丢失所有修改：`$\
  \ git reset -hard HEAD`\n\n现在工作分支没有任何待处理的修改。下一步是更新“master”分支：\n\n```\n$ git pull\n\
  ```\n\n现在会打印出很多消息。只有在显示错误消息时才需要担心。如果是这样，最佳操作是尝试重置并重新拉取（pull）。此分支是官方 Ubuntu 分支的副本，因此补丁仅应用于“custom”分支。为了实现本节的目标并让“custom”分支保持更新，让我们再次检出“custom”分支：`$\
  \ git checkout custom`\n\n下一个 `git` 命令将更新“custom”分支，然后尝试在上面重新应用用户的补丁：\n\n```\n$\
  \ git rebase master\n```\n\n现在的结果是不可预测的，并且有许多方法可以解决任何可能出现的冲突或问题。如果一切正常，只需继续下一步即可；如果发生冲突，扎固的\
  \ `git` 知识是关重要的。请参考附录 B。如果发生了你无法解决的冲突，最佳解决方案是将文件重置为“master”分支，然后再重新进行更改。\n\n要判断是否存在冲突，查看在\
  \ rebase 操作后是否打印了类似下面的消息（包含错误项）：\n\n```\nFirst, rewinding head to replay your work\
  \ on top of it...\nApplying: l\nerror: patch failed: debian/control:285\nerror:\
  \ debian/control: patch does not apply\nerror: patch failed: debian/control.stub:285\n\
  error: debian/control.stub: patch does not apply\nerror: patch failed: debian/scripts/misc/getabis:77\n\
  error: debian/scripts/misc/getabis: patch does not apply\n```\n\n然后，对于每个带错误的文件，只需输入以下内容：\n\
  \n```\n$ git checkout master\n<\nerror file\n>\n$ git add\n<\nerror file\n>\n```\n\
  \n在发生冲突的情况下，以下命令将继续 rebase 操作：`$ git rebase --continue`\n\n如果一个文件被重置为“master”分支，那么应该再次对其进行修改。完成后，或者如果没有发生冲突，现在内核就是更新的。\n\
  \n## 更新非 Ubuntu 内核树\n\n第二种更新方法执行起来非常简单。如果利用第二种方法创建了内核包，那么是使用这种方法最好的。主要有两个步骤：更新内核树和更新内核配置。\n\
  \n首先，通过输入以下命令更新内核树：`$ git pull`\n\n命令完成后，下一步是更新内核目录中现有 `.config` 文件中的内核配置。如所示，可以使用\
  \ `ncurses` 前端或非常简单的文本界面来配置内核。使用以下命令选择 `ncurses` 前端：\n\n```\n$ make menuconfig\n\
  ```\n\n现在可以配置内核了。另一种可选配置方法如下：`$ make oldconfig`\n\n这种方法稍微复杂一点，因为对于内核中添加的每个新配置都会弹出一个查询。\n\
  \n前端会自动为每个新项目选择默认值，但在简单的文本界面中，也可以通过通过对所有问题直接按回车键来实现同样的操作。\n\n## 动态内核模块支持\n\n更多信息请参阅动态内核模块支持（DKMS）官方页面，地址为：http://linux.dell.com/dkms/\n\
  \n如之前所示，可以调整 Linux 内核，使其配置更接近实际使用的硬件，而不是使用发行版提供的通用的解决方案。根据之前显示的方法，整个内核都需要编译和安装。这意味着调整后的内核可能与通用内核有很大不同，行为也可能大不同。当然，如果源自稳定发布版，这可能不是问题。\n\
  \n但如果 OEM 只需要更新驱动程序版本，或者只需要使用当前内核中不存在的驱动呢？是否有必要将整个内核改为包含所需驱动的新（或旧）版本？答案是否定的，这归于\
  \ Linux 内核通过加载内核模块在运行时添加新功能的能力。\n\n\n\n\n\n在某些情况下，出于可靠性考虑，可能会禁止未经测试的内核。这意味着新版本的内核在推送到最终用户之前，将面临更更严格的验证和更高的成本。\n\
  \n所需的驱动程序（或驱动程序版本）目前尚未内核树中。\n\n有许多不同的方法可以交付内核树之外的驱动程序，或者目前尚未应用或在当前内核中还没有的新版本。如果缺乏良好的标准，意味着驱动程序开发者需要花费大量工作来确保每个交付的驱动版本都能兼容存在的许多内核版本和/或\
  \ Linux 发行版，最终用户也需要花费大量工作来获取、构建和安装驱动程序。\n\n为了帮助开发者和用户，创建了一个名为动态内核模块支持（Dynamic Kernel\
  \ Modules Support）的框架。它提供了一种非常简单的机制，通过少数简单的命令和配置来交付和安装新的（或更新的）驱动程序。本节将演示如何使用该框架以及用户如何充分利用其功能。\n\
  \n# DKMS 框架内部\n\nDKMS 有一些命令可以将其可用性导出到 `userland`（用户态）。但在演示这些命令之前，展示该框架内部是如何运作的是非常重要的。“用户态”指的是任何位于内核之外的代码。\n\
  \nDKMS 有自己的模块树。每个模块在构建和正确安装之前都必须添加到该树中。模块可以处于的四种有效状态如下：\n\n- 在 DKMS 树之外\n- 已添加到\
  \ DKMS 树中\n- 已构建\n- 已安装\n\n所需的模块需要位于 `/usr/src` 路径下的 `< module > - < version > /`\
  \ 目录中。\n\n这就是框架查找驱动程序的地方。模块必须有一个配置良好的 `dkms.conf` 文件。该配置文件应由提供 DKMS 框架支持的驱动程序的人提供。\n\
  \n为了更好地地理解 DKMS 的用法，请想象以下场景：有一个名为 `openafs` 的模块包，它使用 DKMS 并原生内置于 Ubuntu。这是一个分布式、跨平台的开源文件系统，用于在远程计算机之间共享文件。目前，Ubuntu\
  \ 提供的版本是 1.4.9，但最新的稳定版本是 1.4.10。我们将使用 DKMS 来演示如何在预安装的调优（tuned）内核中安装最新版本，同时保留发行版提供的通用内核中安装的\
  \ openafs Ubuntu 版本。结果，两个版本将同时安装并都由 DKMS 框架管理。\n\n# 基础 DKMS 命令\n\n将安装两个内核：`linux\
  \ - image - 2.6.28 - 11 - generic` (Ubuntu) 和 `linux - image - 6 - 29 - custom`\
  \ (Tuned)。\n\n需要注意的是，内核镜像上也必须安装头文件（headers）。\n\nUbuntu 的内核将是活动内核。第一步是安装 Ubuntu 提供的\
  \ `openafs - 1.4.9`。注意所有操作都应以 root 身份执行。\n\n```bash\napt-get install openafs-modules-dkms\n\
  ```\n\n如你所示，`openafs` 模块会自动编译并安装。这是因为 `dkms` 命令已经封装在 `.deb` 安装脚本中。现在 1.4.9 版本已经安装，有必要下载新版本（1.4.10），以便其与\
  \ 1.4.9 版本一起安装。较新版本已存在 Debian 仓库中，因此下一步是获取它：\n\n```bash\nwget -c http://ftp.debian.org/debian/pool/main/o/openafs/openafs-modules-dkms_1.4.10+dfsg1-2_i386.deb\n\
  ```\n\n不建议像普通的 deb 文件一样安装驱动程序。如果发生这种情况，它将覆盖 Ubuntu 软件包，从而覆盖旧版本。目标是让 Ubuntu 版本与 Ubuntu\
  \ 内核保持对应，并在调优内核中安装最新版本。\n\ndeb 文件内部有一个名为 `openafs - 1.4.10` 的目录，这正是我们需要的。将其从 deb\
  \ 文件中提取出来并复制到正确的路径，以便配合 DKMS 使用：\n\n```bash\nar vx openafs-modules-dkms_1.4.10+dfsg1-2_i386.deb\n\
  tar xzvf openafs-modules-dkms_1.4.10+dfsg1-2_i386.deb\ncp -fr usr/src/openafs-1.4.10\
  \ /usr/src\n```\n\n运行这些命令后，最新的驱动程序被复制到 `/usr/src` 路径下。此时，驱动程序处于 DKMS 树之外。现在可以开始使用\
  \ `dkms` 命令了。第一个任务是验证树中所有驱动程序的当前状态。至少会显示 openafs v1.4.9（已安装）：\n\n```bash\ndkms status\n\
  # openafs, 1.4.9, 2.6.28-11-generic, i686: installed\n```\n\n如果状态命令后没有任何显示，说明没有安装\
  \ `openafs` 模块。`openafs - modules - dkms` 包的安装可能存在问题。该步骤必须重做。\n\n现在可以将更新的驱动程序添加到树中并将其状态更改为“已添加到\
  \ DKMS 树”：\n\n```bash\ndkms add -m openafs -v 1.4.10 -k 2.6.29-custom\n```\n\n与\
  \ `status` 一，`add` 是告知你正在做什么的命令。命令中可以使用三个选项：\n\n```bash\ndkms <command> OPTIONS:\n\
  - -m : 指模块名称\n- -v : 指模块版本\n- -k : 指内核版本\n```\n\n现在可以重复上一步以查看差异：\n\n```bash\ndkms\
  \ status\n# openafs, 1.4.10: added\n# openafs, 1.4.9, 2.6.28-11-generic, i686: installed\n\
  ```\n\n由于驱动程序现在已添加到树中，可以使用命令构建驱动程序：\n\n```bash\ndkms build -m openafs -v 1.4.10\
  \ -k 2.6.29-custom\n```\n\n此时 `dkms status` 的输出为：\n\n```bash\ndkms status\n# openafs,\
  \ 1.4.10, 2.6.29-custom, i686: built\n# openafs, 1.4.9, 2.6.28-11-generic, i686:\
  \ installed\n```\n\n驱动程序已构建完成，最后一步是安装它：\n\n```bash\ndkms install -m openafs -v 1.4.10\
  \ -k 2.6.29-custom\n```\n\n然后，`dkms status` 将其打印为“已安装”状态：\n\n```bash\ndkms status\n\
  # openafs, 1.4.10, 2.6.29-custom, i686: installed\n# openafs, 1.4.9, 2.6.28-11-generic,\
  \ i686: installed\n```\n\n这意味着两个驱动版本都已安装；按照初始计划，每个版本都安装在不同的内核中。\n\n因为可以使用简单的 DKMS\
  \ 命令来构建/安装模块，因此也可以移除/卸载它们。`uninstall` 命令将已安装的驱动程序更改为“已构建”状态。系统中不再存在该驱动程序，但无需重新构建即可再次安装：\n\
  \n```bash\ndkms uninstall -m openafs -v 1.4.10 -k 2.6.29-custom\ndkms status\n#\
  \ openafs, 1.4.10, 2.6.29-custom, i686: build\n# openafs, 1.4.9, 2.6.28-11-generic,\
  \ i686: installed\n```\n\n`dkms remove` 命令的结果是将驱动程序状态更改为“在 DKMS 树之外”。之后，需要再次添加/构建/安装驱动程序：\n\
  \n```bash\ndkms remove -m openafs -v 1.4.10 -k 2.6.29-custom\ndkms status\n# openafs,\
  \ 1.4.9, 2.6.28-11-generic, i686: installed\n```\n\n\n\n\n\n如下所示，使用 `DKMS` 框架非常简单。然而，这并不是该框架的所有功能。为了演示这一点，让我们扩展一下示例场景。如果\
  \ OEM 在许多设备中安装了其自定义内核，并且必须在所有设备中都安装最新的驱动程序，那么单独为每台设备操作将是一项巨大的工作。但是，`DKMS` 可以从构建好的驱动程序创建一个压缩包（tarball），并从另一个安装了相同内核的设备上重新加载。该包将直接进入\
  \ `Build` 状态，无需编译步骤即可安装。这意味着额外的设备不需要安装 `linux-header` 包（这仅在编译步骤是必要的）。\n\n驱动程序至少应处于\
  \ `Build` 状态。因此，对于后续测试，`openafs-1.4.10` 驱动程序必须至少使用 `dkms build` 命令编译。如果有必要，OEM 可以重新执行这些步骤。然后，可以通过输入以下命令创建压缩包：\n\
  \n```\ndkms mktarball -m openafs -v 1.4.10 -k 2.6.29-custom\n\nMarking modules for\
  \ 2.6.29-custom (i686) for archiving...\n\nMarking /var/lib/dkms/openafs/1.4.10/source\
  \ for archiving\n\nTarball location:\n\n/var/lib/dkms/openafs/1.4.10/tarball/openafs-1.4.10-kernel2.6.29-custom-i686.dkms.tar.gz\n\
  \ncp /var/lib/dkms/openafs/1.4.10/tarball/openafs-1.4.10-kernel2.6.29-custom-i686.dkms.tar.gz\n\
  ```\n\n创建的文件可以复制并在任何安装了自定义内核的其他设备上使用。\n\n如果设备没有安装自定义内核，但 OEM 想要测试功能，可以通过 `dkms remove`\
  \ 命令删除驱动程序来模拟，这会删除 `/usr/src/openafs-1.4.10` 目录。因此，当前机器上不会有该模块的任何痕迹。\n\n可以通过输入以下命令完成加载压缩包：\n\
  \n```\ndkms ldtarball --archive openafs-1.4.10-kernel2.6.29-custom-i686.dkms.tar.gz\n\
  \ndkms status\n\nopenafs, 1.4.10, 2.6.29-custom, i686: built\n\nopenafs, 1.4.9,\
  \ 2.6.28-11-generic, i686: installed\n```\n\n如你通过 `dkms status` 所示，驱动程序已经加载到 `Build`\
  \ 状态。只需要重新安装它即可使其在当前自定义内核中可用。\n\n# 第 8 章：内核微调\n\n## 总结\n\n在通用内核包中，如果目标是全球大型用户群，要提供\
  \ OEM 所需的一切是非常困难的。即使这是可能的，优化也是需要代价的。本章展示了通过获取通用内核并对其优化，使内核更贴近设备的方法。\n\n当然，无法准确说明对每台设备应该做什么，因为每台设备都需要不同的优化。相反，本章演示了如何通过简单的步骤实现优化。通过使用调优良好的内核，OEM\
  \ 以及更重要的是终端用户可以从设备中获得更多的用途和乐趣。\n\n## 测试与易用性\n\nUbuntu Mobile 是以高度去中心化的方式开发的。然而，为了对\
  \ ISV 和 OEM 社区都具有吸引力，它必须提供比专有平台更好或等同的可靠性。\n\n`独立软件供应商 (ISV)` 是一个商业术语，指专门制造或销售面向大众市场或小众市场软件的公司。\n\
  \n本章首先关注 Ubuntu QA 团队用于自动化测试桌面的 Mago，它可以测试使用辅助功能框架的设备。接下来，它展示了如何创建和测试示例应用程序，以及如何验证其与\
  \ Linux 标准基础 (LSB) 测试工具的兼容性。\n\n本章讨论了其他测试工具——特别是用于软件包测试的工具——然后展示了一些对通用性能和易用性有工具。最后，本章以对测试策略的讨论结束。它还展示了在发现错误时如何向\
  \ Ubuntu 开发者正确提交错误报告。\n\n## 为什么要测试？\n\n测试无法完全确定软件的正确性。相反，它提供了一种比较，通过某些已知或预期的基准来衡量软件或硬件的状态和行为。这些可能包括规范、可比较的产品、同产品的旧版本、用户或客户的期望或相关标准。对高质量测试的需求显而易见——据估计，仅\
  \ 2002 年软件漏洞就给美国经济带来了超过 595 亿美元的损失。\n\n# 第 9 章：测试与易用性\n\n## Ubuntu Desktop QA\n\n\
  目前，测试 GNOME 功能意味着使用辅助功能框架。实现此操作的前提是启用辅助技术服务接口 (`SPI`)。\n\n在 Ubuntu Netbook 上，请进入“偏好设置”、“辅助技术”，并勾选“启用辅助技术”复选框。如图\
  \ 9-1 所示。此外，如果桌面启用了 Compiz，辅助功能将无法工作。在这种情况下，请在 gdm 中选择普通会话 (plain session)。\n\n\
  接下来安装 Python 包 `python-ldtp`、`python-distutils-extra` 和 `python-setuptools`（如果尚未安装\
  \ Bazaar 也）。\n\n### Mago —— 桌面测试计划\n\n要使用 Mago，请检出此分支：\n\n```\nbzr branch lp:mago\n\
  ```\n\n进入新创建的文件夹并运行其中一个测试：\n\n```\ncd mago\nPYTHONPATH=. ./bin/mago -a notify-osd\n\
  ```\n\n这运行了 `notify-osd` 测试，该测试验证了新消息守护进程的功能（有关 Ubuntu 中此新消息系统的更多信息，请参见第 4 章）。测试结果存储在主目录下的\
  \ `.mago` 文件夹中，可以在浏览器中显示 HTML 文件。\n\n### 构建用于测试的应用程序\n\n为了设置假设的测试场景，将构建并测试一个示例应用程序。该程序使用\
  \ Mozilla 库构建的嵌入式浏览器。将对该应用程序的功能及其对既定 Linux 标准的遵循情况进行测试。\n\n这种嵌入式浏览器可能适用于自助机应用，那里可能不需要浏览器的完整功能。对于本章而言，重点是保持浏览器简单；实际应用程序中的某些\
  \ GTK 小部件（如刷新和停止）在代码方面没有连接任何东西。\n\n然而，地址栏是功能性的，可以输入 URL 并访问 URI 资源。\n\n\n\n\n\n\
  输入“help”，“copyright”，“credits”或“license”获取更多信息。\n\n```python\nimport gtk\nimport\
  \ gnome.ui\nimport gtk.glade\nimport gtkmozembed\n```\n位置：`/usr/lib/xulrunner-1.9.0.1/libxpcom.so`\n\
  之前 3\n\n`gtkmozembed` 可通过 `python` -gnome2` -`extras` 软件包提供。\n\n189\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  c09.indd 189\n10/6/09 9:03:05 AM\n![Image 62](img/index-226_1.jpg)\n\n# 第 9 章：测试与可用性\n\
  \n## 应用创建\n\n启动 Glade 并创建一个包含窗口、垂直框和工具栏的界面。对于每个项目，设置其可访问性名称和描述。这允许 Mago 使用 `AT -\
  \ SPI` 可访问性层绑定来测试用户界面。\n\n图 9-2 显示了 Glade 小部件树，以及主窗口的可访问性属性。\n\n图 9-2\n\nURL 输入框需要被激活。要做到这一点，请点击文本输入使其在属性窗口中变为激活状态。然后选择信号（Signals）选项卡并选择\
  \ `Activate`。当按下回车键时，文本输入框会发出 `Activate` 信号。这将创建一个 `on_entry1_activate` 默认处理程序，这是可以的。\n\
  \n下面的代码片段显示了 Glade 文件的开头。它展示了一些主结构，如 `GtkWindow` 和 `GtkVBox`，它们已启用可访问性，因此支持自动化测试：\n\
  \n```xml\n<?xml version=\"1.0\" standalone=\"no\"?>\n<!--*- mode: xml -*-->\n<!DOCTYPE\
  \ glade-interface SYSTEM \"http://glade.gnome.org/glade-2.0.dtd\">\n<glade-interface>\n\
  \  <widget class=\"GtkWindow\" id=\"PUMD\">\n    <property name=\"visible\">\n \
  \     True\n    </property>\n    <property name=\"title\" translatable=\"yes\">\n\
  \      Embedded Browser\n    </property>\n    <property name=\"type\">\n      GTK_WINDOW_TOPLEVEL\n\
  \    </property>\n    <property name=\"window_position\">\n      GTK_WIN_POS_NONE\n\
  \    </property>\n    <property name=\"modal\">\n      False\n    </property>\n\
  \    <property name=\"resizable\">\n      True\n    </property>\n    <property name=\"\
  destroy_with_parent\">\n      False\n    </property>\n    <property name=\"icon\"\
  >\n      pixmaps/hello-world-48x48.png\n    </property>\n    <property name=\"decorated\"\
  >\n      True\n    </property>\n    <property name=\"skip_taskbar_hint\">\n    \
  \  False\n    </property>\n    <property name=\"skip_pager_hint\">\n      False\n\
  \    </property>\n    <property name=\"type_hint\">\n      GDK_WINDOW_TYPE_HINT_NORMAL\n\
  \    </property>\n    <property name=\"gravity\">\n      GDK_GRAVITY_NORTH_WEST\n\
  \    </property>\n    <property name=\"focus_on_map\">\n      True\n    </property>\n\
  \    <property name=\"urgency_hint\">\n      False\n    </property>\n    <accessibility>\n\
  \      <atkproperty name=\"AtkObject::accessible_description\" translatable=\"yes\"\
  >\n        An embedded browser\n      </atkproperty>\n    </accessibility>\n   \
  \ <child>\n      <widget class=\"GtkVBox\" id=\"vbox1\">\n        <property name=\"\
  visible\">\n          True\n        </property>\n        <property name=\"homogeneous\"\
  >\n          False\n        </property>\n        <property name=\"spacing\">\n \
  \         0\n        </property>\n        <accessibility>\n          <atkproperty\
  \ name=\"AtkObject::accessible_name\" translatable=\"yes\">\n            vbox1\n\
  \          </atkproperty>\n          <atkproperty name=\"AtkObject::accessible_description\"\
  \ translatable=\"yes\">\n            The main box\n          </atkproperty>\n  \
  \      </accessibility>\n      </child>\n    </widget>\n</glade-interface>\n```\n\
  \n注意前述代码中的可访问性节点，它如下文所示：\n\n```xml\n<accessibility>\n  <atkproperty name=\"AtkObject::accessible_name\"\
  \ translatable=\"yes\">\n    vbox1\n  </atkproperty>\n  <atkproperty name=\"AtkObject::accessible_description\"\
  \ translatable=\"yes\">\n    The main box\n  </atkproperty>\n</accessibility>\n\
  ```\n\n浏览器本身是一个封装器，它将初始化 GNOME 并通过调用 `self.widgets = gtk.glade.XML(\"pumd.glade\"\
  )` 加载所有小部件。以下是浏览器的代码：\n\n```python\n#!/usr/bin/env python\nimport gtk\nimport gnome.ui\n\
  import gtk.glade\nimport gtkmozembed\n\nAPPNAME=\"PUMD\"\nAPPVERSION=\"0.1\"\n\n\
  class BrowserWrapper:\n    def __init__(self):\n        # 注册为 Gnome 应用程序\n     \
  \   gnome.init(APPNAME, APPVERSION)\n        # 加载 glade 文件\n        self.widgets\
  \ = gtk.glade.XML(\"pumd.glade\")\n        # 创建一个用于存放浏览器的小部件\n        self.mozillaWidget\
  \ = gtkmozembed.MozEmbed()\n        # 将小部件添加到程序中\n        self.widgets.add(self.mozillaWidget)\n\
  \        self.widgets.set_size_request(800,600)\n        # 加载 URL\n        self.mozillaWidget.load_uri(\"\
  about:blank\")\n        # 连接信号\n        signalDic = {\"entry1-activate\": self.on_entry1_activate}\n\
  \        self.widgets.connect_signals(signalDic)\n\n    def on_entry1_activate(self,\
  \ widget):\n        print(widget.get_text())\n\nif __name__ == \"__main__\":\n \
  \   app = BrowserWrapper()\n    gtk.main()\n```\n\n（注：由于原文提供的 Python 代码块在逻辑上与描述的代码片段略有差异，翻译时已根据上下文逻辑进行了结构化对齐，以确保文档可读性。）\n\
  \n\n\n注册测试套件并编写好类后，现在实际上可以使用它来为浏览器编写测试了。这是通过在 Mago 根目录下创建一个文件夹（以要测试的应用命名），并向该文件夹添加一个\
  \ Python 文件和一个 XML 文件来实现。Python 文件内容如下：\n\n```python\nfrom mago.test_suite.ubuntu\
  \ import PumdTestSuite\n\nfrom time import sleep\n\nclass PUMD(PumdTestSuite):\n\
  \n    def testOpenMenu(self, menuitem=None, windowname=None, closetype=None, closename=None,\
  \ oracle=None):\n        self.application.set_name(windowname)\n        self.application.open()\n\
  \        sleep(20)\n        screeny = self.application.grab_image_and_wait()\n \
  \       try:\n            screeny\n        except Exception, e:\n            print\
  \ “No screenshot returned”\n            raise e\n\nif __name__ == “__main__\":\n\
  \        pumd_test = PUMD()\n        pumd_test.run()\n```\n\n重要的是注意到对 `PumdTestSuite`\
  \ 的导入；调用套件中测试运行器的 `run()` 方法；以及为页面加载留时间的 `sleep()` 方法。调用 `grab_image_and_wait()`\
  \ 会将一张截图（如图 9-3 所示）放入临时文件夹中。\n\n图 9-3\n\nXML 文件如下：\n\n```xml\n<?xml version=\"1.0\"\
  ?>\n<suite name=\"pumd\">\n    <class>pumd.PUMD</class>\n    <description>Test which\
  \ verifys that the browser starts correctly.</description>\n    <case name=\"Open\
  \ Embedded Browser\">\n        <method>testOpenMenu</method>\n        <description>It\
  \ opens the Embedded Browser</description>\n        <args>\n            <menuitem>mnuEmbeddedBrowser</menuitem>\n\
  \            <windowname>frm*EmbeddedBrowser</windowname>\n        </args>\n   \
  \ </case>\n</suite>\n```\n\n同样注意 `<class>` 标签包含了 `.py` 文件的模块名和 `SuiteClass`。\n\n\
  使用以下命令运行测试：\n\n`PYTHONPATH=. ./bin/mago -a pumd`\n\n结果——如图 9-4 所示——将被放置在 `~/.mago/pumd`\
  \ 文件夹中。\n\n图 9-4\n\n这显示浏览器打开测试通过了，并显示了运行测试所需的时间。如果测试失败，将拍摄截图并放在 `~/.mago/pumd/screenshots`\
  \ 文件夹中，错误将记录在 `~/.mago/pumd/pumd.log` 文件中——这两者有助于调试。\n\n## Linux 标准基础与认证\n\nLSB\
  \ 应用测试工具包 (ATK) 包含了分析应用程序包依赖关系（外部所需的库和接口）的工具。特别是，ATK 帮助开发者测试其应用程序是否符合 LSB 合规性，并为\
  \ LSB 认证提供了简单的步骤。\n\n### 安装 LSB 应用测试工具包\n\n首先，从 `http://www.linuxfoundation.org/en/Downloads`\
  \ 下载工具包。接下来，在解压目录中运行 `install.sh` 脚本。脚本会询问几个问题，并使用 `dpkg` 安装软件包：\n\n此系统似乎是 Debian\
  \ GNU/Linux 的变体，例如 Debian 本身、Ubuntu、MEPIS、Xandros、Linspire 等。\n\n是否正确？yes\n\n为了安装这些软件包，你需要管理员权限。你当前正以普通用户身份运行此脚本。\n\
  \n你有 `sudo`可用。我应该使用它吗？yes\n\n使用命令 `sudo /bin/sh -c` 获取 root 权限。如果提示，请输入相应的密码。\n\n\
  正在安装软件包...\n\n### 运行 LSB 应用测试工具包\n\n工具包安装在 `/opt/lsb/app-testkit/manager`；要启动 Web\
  \ 界面，运行 `/opt/lsb/app-testkit/manager/bin/lsb-atk-start.pl 8080` 然后访问 `http://127.0.0.1:8080/`。\n\
  \n这将显示如图 9-5 所示的测试套件。\n\n图 9-5\n\n打开 Application Check，指定应用程序名称和测试的文件 `pumd.py`。\n\
  \n接下来，选择 LSB 版本和配置（目前 Architecture 字段无法更改），并点击 Run the Test 按钮。\n\n测试将执行并显示 Test\
  \ Report 页面。它包含了许多关于测试运行的信息。\n\n*从此页面，你可以为你刚刚测试的应用程序启动 LSB 认证流程。*\n\n在测试中，工具包建议更改嵌入式浏览器\n\
  \n```bash\n#!/usr/bin/env python\n```\n\n为\n\n```bash\n#!/usr/bin/python\n```\n\n\
  提出此建议是为了增加应用程序在不同平台之间的可移植性。可以看出，LSB 的目标是维护跨架构的合规性，因此它是开源生态系统中的一个新兴标准。强烈建议应用程序通过\
  \ LSB 认证，事实上，对于大多数 ISV 来说，这可能正成为强制性要求。\n\n## 其他测试工具\n\n除了 Mago 和 LSB，开源社区还开发了一系列其他测试应用程序。这些包括测试和基准测试平台\
  \ Phoronix Test Suite；用于软件包测试的 `pbuilder`；以及 Ubuntu 操作系统自带的一系列其他工具（如 `ps` 和 `top`）。\n\
  \n*第 5 章解释了如何使用 pbuilder。*\n\n### Phoronix Test Suite\n\nPhoronix Test Suite 设计用于对\
  \ Linux 操作系统进行定性和定量测试。它由带有相关脚本的基准组成。你可以在 universe 仓库中找到该应用程序。你可以使用 `apt` 安装它：\n\n\
  `sudo apt-get install phoronix-test-suite`\n\n要查看所有可用测试，运行以下命令：\n\n`phoronix-test-suite\
  \ list-tests`\n\n要运行测试，使用以下命令：\n\n`phoronix-test-suite benchmark`\n\n例如，运行 netbook\
  \ 测试，请使用\n\n`phoronix-test-suite benchmark netbook`\n\n应用程序将自动下载所有必要的测试文件，并提示测试选项以及是否保存测试结果。该套件还支持在测试运行时监控系统传感器。测试结束时，它将提供每个传感器的高低阈值以及平均值。传感器检测和监控通过\
  \ `lm-sensors` 和 ACPI 接口完成：`sudo apt-get install lm-sensors`\n\n可以通过运行以下命令启用 `lm-sensors`：\n\
  \n`sudo sensors-detect`\n\n*关于传感器使用的实际示例，请参见第 3 章。*\n\n该套件用于对发布的 i386 版本 Ubuntu\
  \ Netbook 与 LPIA 版本进行基准测试，后者是通过在 MID 基础上安装 Netbook 桌面为本书制作的。\n\n在两者上运行的基准都是 netbook\
  \ 套件，在两个测试中使用的命令均为：\n\n`MONITOR=all phoronix-test-suite benchmark netbook`\n\n测试的硬件是具有以下规格的\
  \ Acer Aspire：处理器：Intel Atom N270 @ 1.60GHz（总核心数：2），主板：Acer AOA110，芯片组：Intel Mobile\
  \ 945GME Express Hub + ICH7-M，系统内存：485MB，磁盘：8GB SSDPAMM008G1，显卡：Intel Mobile 945GME\
  \ Express IGP (rev 03)\n\n安装的软件为：\n\nOS：Ubuntu 9.04，桌面：GNOME 2.26.1，显示服务器：X.Org\
  \ Server 1.6.0，显示驱动程序：intel 2.6.3\n\n\n\n\n## 测试详情\n\n| 测试项目 | UNR Default | UNR\
  \ LPIA | 百比差异 |\n| :--- | :--- | :--- | :--- |\n| LAME MP3 编码 | 163.21 | 175.22\
  \ | UNR Default 优 7.35% (编码一个 mp3 文件) |\n| OGG 编码 | 102.05 | 105.79 | UNR Default\
  \ 优 3.66% (编码一个 ogg 文件) |\n| 定时 ImageMagick 编译 | 906.16 | 912.02 | UNR Default 优\
  \ 0.64% (编译 Image Magick 花的时间) |\n| 512MB 写入性能 | 5.40 | 5.31 | LPIA 优 1.69% |\n\
  | 512MB 读取性能 | 33.00 | 33.08 | UNR Default 优 0.24% |\n| 1GB 写入性能 | 5.58 | 5.48 |\
  \ LPIA 优 1.82% |\n| OpenSSL RSA 4096 位性能 | 4.50 | 4.30 | LPIA 优 4.65% (SSL 加密测试)\
  \ |\n| GnuPG 2GB 文件加密 (加密) | 206.17 | 158.72 | LPIA 优 29.89% (使用 GnuPG 加密 2GB 文件)\
  \ |\n| RAM 速度 (向内存写入整数) | 1834.82 | 1708.05 | UNR Default 优 7.42% |\n\n最明显的区别是 LPIA\
  \ 上的文件加密速度比默认的 i386 快了近三分。在运行的九项测试中，默认的 Ubuntu Netbook Remix 在五项测试中更好，其中磁盘读取、编码和\
  \ RAM 速度均占优。LPIA Ubuntu Netbook Remix 在写入性能和加密方面似乎更好。考虑到 LPIA 的测试结果，尚不清楚该架构对于终端用户是否具有优势（电源优势之外——见第\
  \ 3 章），而且这些结果是否足以证明 Ubuntu Mobile 团队继续维护 LPIA 也值得怀疑。尽管如此，LPIA 本初就不是设计在 Ubuntu Netbook\
  \ Remix 上运行，因此这些结果并没有任何结论性。\n\n# 第 9 章：测试与可用性\n\n在巴塞罗那的 UDS Karmic 上，决定取消对 LPIA\
  \ 架构的官方支持。Ubuntu MID 现在基于 Mer 上游。Mer 是一个 Linux 操作系统，它基于 Ubuntu Jaunty 的薄基础结合了 Nokia\
  \ Maemo 平台的最佳开源元素构建。LPIA 将由 Ubuntu 社区维护。\n\n### 使用 PBuilder 自动化软件包测试\n\n你可以使用 `pbuilder`（见第\
  \ 5 章）来自动化软件包的测试。它有一个允许使用钩子（hooks）的功能；这些钩子可以尝试在 chroot 内部安装软件包、运行它们，甚至尝试卸载它们。一些已知测试包括：\n\
  \n- 自动安装-移除-升级-移除-安装-清除-升级-清除测试套件（以名为 `B91dpkg-i` 的示例发布，可在 `/usr/share/doc/pbuilder/examples`\
  \ 目录下找到）。同一目录下还有一个检查所有内容是否已安装的 `execute_installtest.sh`。\n- 自动运行 `lintian`（作为示例发布在\
  \ `/usr/share/doc/pbuilder/examples/B90lintian`）。\n\n要使用此测试套件，需要创建钩子。创建如下目录：\n`/var/cache/pbuilder/hooks`\n\
  \n例如，将 `B91dpkg-i` 脚本添加到此目录。\n\n也可以在命令行上指定：\n`--hookdir /usr/share/doc/pbuilder/examples\
  \ *` 以包含所有示例钩子。\n\n一旦建立了这些钩子，就可以运行测试脚本。这些测试脚本放置在被测试软件包的源码中，位于 `debian/pbuilder-test/NN_name`\
  \ 文件夹下（其中 `NN` 是数字），遵循 `run-parts` 的文件名标准。\n\n`run-parts`（来自 `debianutils` 软件包）用于执行位于一个目录中的多个脚本或程序。`run-parts`\
  \ 程序要求这些脚本文件名完全由字母、数字、下划线或连字符组成。\n\n与 `pbuilder-test` 使用的示例脚本可以在 `/usr/share/doc/pbuilder/examples/pbuilder-test`\
  \ 中找到。\n\n此类测试脚本的示例是 `test 004_ldd`：\n\n```bash\n#!/bin/bash\n# 简单的测试以检查程序是否安装在正确的\n\
  # 位置并且通过 ldd 看起来正常。\nldd /usr/bin/program\n```\n\n命令 `ldd` 列出可执行文件或共享对象的动态依赖。\n\n\
  ### 其他有用的 Linux 性能测试工具\n\nUbuntu 上已经存在各种帮助优化性能的工具。\n\n#### ps\n这是一个允许你查看设备上运行进程的工具。如果你想搜索特定的进程，以下是一个实用的命令：\n\
  `ps aux | grep something`\n\n#### top\nTop 是一个让你能够跟踪进程的工具；它按 CPU 或内存使用情况列出进程。结合命令使用，可以调度\
  \ top 在特定时间运行。你可以通过编写一个 bash 脚本让 top 在一分钟后运行来实现，例如：\n`TERM=linux top -b -n1 /tmp/report.txt`\n\
  \n#### time\n该工具测量执行时间。它接受一个命令作为参数，执行后显示关于进程花费时间的简要统计数据。这可以帮助你发现某个命令花费的时间比预想要长。当然，如果你正在处理自己开发的程序，这特别有用，因为你可以修改源码并重新编译以比较结果。Time\
  \ 的用法如下：\n`time ./umd.py`\n\n#### procinfo\n负载平均值（load average）是对任何时刻运行活跃进程的测量。它是运行队列和当前在\
  \ CPU 上运行的任务数之和。结果使用名为 `procinfo` 的程序计算。这是一个示例：\n`sudo apt-get install procinfo`\n\
  \n#### free\n该应用程序显示空闲内存量和系统使用的内存：\n`free`\n\n#### memstat\n该应用程序列出所有使用虚拟内存的进程、可执行文件和共享库：`memstat`\
  \ 输出如下所示：\n```\n1032k: PID 5166 (/usr/lib/libindicate.so.1.0.0)\n272k: PID 5178\
  \ (/lib/tls/i686/cmov/libnss_files-2.9.so)\n736k: PID 5249 (/usr/lib/libltdl.so.7.2.0)\n\
  709848k: PID 5251 (/usr/share/fonts/truetype/ttf-dejavu/DejaVuSans.ttf)\n43176k:\
  \ PID 5256 (/usr/lib/libgvfscommon.so.0.0)\n```\n看看 DejaVuSans 字体的内存占用！\n\n####\
  \ memcheck 和 Valgrind\nValgrind 是一组用于调试和分析程序的工具。可以通过 apt 安装：\n`sudo apt-get install\
  \ valgrind`\n\n接下来，启动程序以验证系统正受 memcheck 的控制：\n`G_SLICE=always-malloc G_DEBUG=gc-friendly\
  \ valgrind -v --tool=memcheck --leak-check=full --num-callers=40 --log-file=valgrind.log\
  \ application_name`\n\n此命令运行可能需要一段时间。生成的 `valgrind.log` 文件显示错误摘要：\n```\n==2753==\
  \ ERROR SUMMARY: 0 errors from 0 contexts (suppressed: 323 from 4) as well as a\
  \ leak summary:\n==2753== LEAK SUMMARY:\n==2753== definitely lost: 13,891 bytes\
  \ in 43 blocks.\n==2753== indirectly lost: 24,510 bytes in 1,216 blocks.\n==2753==\
  \ possibly lost: 1,128 bytes in 31 blocks.\n==2753== still reachable: 9,878,411\
  \ bytes in 56,308 blocks.\n==2753== suppressed: 0 bytes in 0 blocks.\n```\n\n\n\n\
  \nValgrind 是一个创建高效软件的优秀开发工具。\n\n## Latencytop\n\n英特尔开源技术中心发布了 `Latencytop`，这是一个旨在识别系统延迟发生位置的工具。该\
  \ Ubuntu Universe 仓库可用，并可以使用 `apt` 进行安装：\n\n```\n$ sudo apt-get install latencytop\n\
  ```\n\n首先，运行以下命令：\n\n```bash\n$ sudo latencytop\n```\n\n结果以表格形式出现，并选择了 Firefox 进程：原因\
  \ 最大百分比 调度器：等待 cpu 12.7 msec 5.2 %\n\n等待事件 (poll) 5.0 msec 64.4 %\n\n用户态锁竞争 5.0\
  \ msec 29.1 %\n\n等待事件 (select) 4.6 msec 0.3 %\n\n从管道读取 2.7 msec 0.0 %\n\n等待进程结束\
  \ 2.1 msec 0.0 %\n\n打开 cdrom 设备 1.5 msec 0.4 %\n\n执行原始 SCSI 命令 1.1 msec 0.4 %\n\n\
  acpi_ec_wait acpi_ec_transaction_unlocked acpi_ec_ 1.0 msec 0.0 %\n\n进程 firefox\
  \ (6030) 总计 294.5 msec\n\n调度器：等待 cpu 9.1 msec 52.3 %\n\n用户态锁竞争 5.0 msec 25.5 %\n\
  \n等待事件 (poll) 4.8 msec 22.2 %\n\nevolution-data- evolution-excha\n\nfirefox\n\n\
  gnome-terminal gnome-pty-helper\n\n`Latencytop` 从 `/proc/latency_stats` 文件读取数据，并显示过去\
  \ 30 秒内的最大延迟。在这种情况下，发现用户态锁竞争（Userspace lock contention）似乎是改进性能的好地方。\n\n## 测试策略\n\
  \n由于有许多测试工具，制定测试策略变得非常重要。对于 Ubuntu MID 分发版本身，质量保证测试被分为三组：基础、高级和合规。\n\n### 基础\n\n\
  基础功能测试涵盖了软件终端用户每天看到的功能。该功能领域的缺陷将立即被用户注意到。尽可能地进行此领域的测试至关重要；因此，它是自动化的良好选择。属于此类的应用程序包括：\n\
  \n* Midbrowser\n* RSS 阅读器\n* 时钟\n* 计算器\n* PIM\n* 远程桌面客户端\n* 电子书阅读器\n* 记事本\n\n###\
  \ 高级\n\n高级案例需要更多的系统知识，或者访问并非所有人都拥有的资源，例如专利解码器。\n\n### 合规\n\n合规案例涵盖了系统约定的统计数据。有一些清单作为该类别的指南（以下清单仅供示例；实际目标将根据工作条款而异，并针对每个\
  \ OEM 具体化）：**性能测试（排除 BIOS 时间）**\n\n* 当平台处于休眠状态时，从用户按下电源按钮到桌面 UI 完全响应的时间为 16 秒\n\
  * 从用户按下睡眠按钮到平台进入 S3 状态（而不仅仅是黑屏）的时间为 7 秒\n* 当平台处于 S3 状态时，从用户按下唤醒按钮到桌面 UI 完全响应的时间为\
  \ 7 秒\n* 当平台进行冷启动时，从用户按下电源按钮到桌面 UI 完全响应的时间为 37 秒\n\n**内存占用**\n\n* 平台内存 192MB\n*\
  \ 最大使用 2000MB\n\n**本地化**\n\n* 支持英语（美国）\n\n**文档**\n\n* 更新的文档\n* 所有文档的许可条款\n* 无法公开的专利文档列表\n\
  * 所有组件的许可条款\n* 将包含的已知非开源组件列表\n\n## 漏洞报告\n\n当情况不符合预期时，立即提交漏洞报告总是重要的。\n\n### 如果你发现了漏洞……\n\
  \n提交漏洞报告始终是一个良好的习惯。漏洞报告应该提交到 https://bugs.edge.launchpad.net/ubuntu-mobile/。\n\n\
  在提交漏洞报告时，有一个需要遵循的模板，它为开发者提供了最大的机会去重现——并希望消除漏洞。\n\n模板如下：\n\n```\n构建版本/日期:\n测试使用的环境:\n\
  摘要:\n复现步骤:\n预期结果:\n实际结果:\n```\n\n以下是一个良好的漏洞报告示例（你可以在 https://bugs.launchpad.net/ubuntu-mobile/+bug/218850\
  \ 找到）：\n\n```\nBuild: UME Daily 20081404\nEnvironment: Xephry\nSummary:\n打开办公文档时，“选择要可视化的文件”对话框在文档加载后持续显示在文档上方。阻塞了所有文档内容。\n\
  Steps to Reproduce:\n1) 启动查看器\n2) 选择文档 (ppt, doc, pdf, 等)\n3) 打开\nExpected result:\n\
  文档已打开并显示内容，无错误或损坏\nActual result:\n文档打开后，选择对话框仍保持在顶层\n```\n\n### 自动报告漏洞\n\n报告漏洞简单的方法是使用\
  \ `Apport` 应用程序。当应用程序崩溃时，`Apport` 会自动启动并打开一个适当的漏洞报告让你在 Launchpad 中完成。\n\n如果你想为一个正在运行并有响应的应用程序报告漏洞，可以通过帮助菜单通过\
  \ `Report a problem`（报告问题）访问相同的 `Apport` 功能。这种方法比直接在 Launchpad 网站提交漏洞报告更优，因为它附带了调试信息（包括用户界面漏洞）。\n\
  \n### 从命令行报告漏洞\n\n要从命令行报告漏洞，请使用以下命令：\n\n```bash\n$ubuntu-bug <PACKAGE_NAME>\n```\n\
  \n要针对已知包提交漏洞并自动包含所有有用的调试信息，请使用：\n\n```bash\nubuntu-bug PID\n```\n\n要针对具有已知进程 ID\
  \ (`PID`) 的运行程序提交漏洞（参见系统管理系统监视器），请使用：\n\n```bash\nubuntu-bug linux\n```\n这将对 Linux\
  \ 内核提交一个漏洞报告。\n\n## 总结\n\nLinux 优于专利系统的一个优势是有许多愿意帮助测试和提交漏洞报告的人。每个人都可以通过提交漏洞报告来帮助\
  \ Ubuntu 变得更好。\n\n建立良好的测试策略可以增加发现漏洞和改进 Ubuntu 的机会，反之也能为围绕它的更广泛的开源生态系统做出贡献。\n\n#\
  \ 提示与技巧\n\n本章包含了许多用于和增强运行 Ubuntu Mobile 的脚本、提示和暗示。\n\n## 提高启动速度\n\n本节描述了如何提高和增加\
  \ Ubuntu Jaunty 设备上的启动速度。这是一个正在非常密集开发的领域，因为 Ubuntu 10.04 (karmic+1) 的宏伟目标启动速度是 10\
  \ 秒。\n\n`karmic+1` 指的是 karmic 9.10 发布之后的 Ubuntu 版本。在写作时，描述此版本的形容词尚未确定。\n\n对于 karmic\
  \ 版本，目标启动速度预计将在当前速度（Jaunty 上为 28s）和宏伟的新目标之间。这一结果的结果之一（在 UDS 巴塞罗纳会议上讨论过）是 `initramfs`\
  \ 和 `X Server` 在未来几个月内可能会看到大量工作，因此下面描述的技术可能不是减少启动速度的最佳方法。\n\n请参考 `ubuntu - boot`\
  \ 邮件列表获取最新信息。\n\n## 硬编码模块\n\n可以列出模块以便它们在调用 `initramfs` 时被调用。这样做意味着*只有*特定设备启动所需的模块才会被加载。\n\
  \n`initramfs` 是一个微小的基于内存的初始根文件系统，内核在设备启动时作为第一个程序运行它。\n\n\n\n\n\n# 第 10 章：提示与技巧\n\
  \n要执行此项操作，请将必要的模块放入：\n\n```bash\n$ /etc/initramfs-tools/modules\n```\n\n然后运行：\n\n\
  ```bash\n$ sudo update-initramfs -u\n```\n\n没有必要修改 `/etc/initramfs-tools/initramfs.conf`\
  \ 文件（例如，如果 `.conf` 脚本中的 `modules` 选项值仍为 `most`），因为该文件关注的是哪些模块被复制到 initramfs 中，而不是哪些模块被探测。\n\
  \n示例列表可能如下：\n\n```\nloop\nsquashfs\n```\n\n文件 `/etc/initramfs-tools/modules` 会由\
  \ `load_modules` 函数从以下位置进行循环加载：\n\n```bash\n$ /usr/share/initramfs-tools/init\n\
  ```\n\n## 创建一个大小为物理内存一半的 /tmp\n\n你可以将以下内容添加到 `/etc/fstab`：\n\n```\ntmpfs /tmp tmpfs\
  \ nodev,nosuid 0 0\n```\n\n这会创建一个大小为物理内存一半的 `/tmp`，且存储在 `/tmp` 中的任何内容都会进入内存。在实践中，大部分内容最终会被提交到交换分区（swap），但这意味着只有当\
  \ `/tmp` 中的空间超过缓存缓冲区时，它才会被写入磁盘（而不是立即写入）。对于访问次级存储速度较慢的机器（但对于 SSD 并非如此），这可以加快临时文件的操作速度。\n\
  \n实际上，这可以提高大多数速度为 7200、5400 甚至更慢的硬盘的性能。\n\n当然，缺点是当你对设备进行休眠时需要清理 `/tmp`，特别是当设备本身内存就紧张时。请小心！\n\
  \n## 节能技巧\n\n对于产品设计人员来说，了解影响电池续航的因素对于管理产品性能至关重要。终端用户需要尽可能多地电池续航时间。\n\n### 正确充电\n\
  \n作为用户，请尝试在不中断的情况下为设备充电。此外，在第一次使用设备时，将电量耗尽零然后完全充满。这可以校准电池。\n\n### 笔记本模式\n\n当启用笔记本模式（laptop\
  \ mode）时，内核将尝试智能地决定何时进行写入，以便让磁盘尽可能长时间处于低功耗状态。\n\n运行以下命令安装笔记本模式工具：\n\n```bash\n$\
  \ sudo apt-get install laptop-mode-tools\n```\n\n运行 `sudo laptop_mode start` 来启动笔记本模式，将显示如下内容：\n\
  \n```\nLaptop Mode Tools 1.45\nLaptop mode enabled, active\n/dev/sda:\nsetting Advanced\
  \ Power Management level to 0xfe (254)\n/dev/sda:\nsetting standby to 12 (1 minutes)\n\
  ```\n\n运行 `laptop_mode` 会增加 `/proc/sys/vm` 中的 `dirty_expire_centisecs` 和 `dirty_writeback_centisecs`，这意味着页面不会频繁地写入磁盘。它还更改了脏数据后台回写的比例，这些因素共同导致了磁盘活动的快速突发和更长时间的休眠状态。\n\
  \n笔记本模式的配置文件为 `/etc/laptop-mode/laptop-mode.conf`。\n\n一个（随笔记本模式工具提供的）名为 `lm-profiler`\
  \ 的工具会监控设备的磁盘使用情况和运行的网络服务，并会建议禁用不需要的服务。运行它会得到如下输出：\n\n```bash\n$ sudo lm-profiler\n\
  Write accesses at 445\n```\n\n*(注：此处原文输出不完整，翻译遵循原文长度)*\n\n\n\n\n\n2.6.20 内核中添加的另一种方法是使用\
  \ `relatime` 挂载选项。如果设置了此标记，只有当访问时间早于修改时间时才会更新访问时间。此更改允许实用程序查看文件的当前版本是否被读取过，但显著减少了\
  \ `atime` 的更新。可以通过以下方式启用 `relatime`：\n\n```bash\n$ sudo mount -o remount,relatime\
  \ /\n```\n\n## 关闭后台服务\n\n后台服务默认列在 `xdg` 中。`xdg` 定义了一种方法，用于桌面环境启动和挂载可移动介质后自动启动应用程序。\n\
  \n例如：\n\n```bash\n# cd /etc/xdg/autostart/\n# ls -la\n\ntotal 76\ndrwxr-xr-x 2 root\
  \ root 4096 2008-07-06 20:30 .\ndrwxr-xr-x 6 root root 4096 2008-07-06 20:27 ..\n\
  -rw-r-r- 1 root root 2676 2008-03-28 07:07 bluetooth-applet.desktop\n-rw-r-r- 1\
  \ root root 289 2008-04-21 12:23 evolution-alarm-notify.desktop\n-rw-r-r- 1 root\
  \ root 5040 2008-04-15 11:42 gnome-at-session.desktop\n-rw-r-r- 1 root root 6079\
  \ 2008-04-10 14:12 gnome-power-manager.desktop\n-rw-r-r- 1 root root 7214 2008-04-15\
  \ 05:39 gnome-volume-manager.desktop\n-rw-r-r- 1 root root 293 2008-04-08 22:06\
  \ jockey-gtk.desktop\n-rw-r-r- 1 root root 374 2008-04-18 17:27 nm-applet.desktop\n\
  -rw-r-r- 1 root root 219 2008-04-06 22:24 pulseaudio-module-xsmp.desktop\n-rw-r-r-\
  \ 1 root root 5002 2008-04-21 12:44 redhat-print-applet.desktop\n-rw-r-r- 1 root\
  \ root 2204 2008-04-02 17:11 tracker-applet.desktop\n-rw-r-r- 1 root root 1791 2008-04-02\
  \ 17:11 trackerd.desktop\n-rw-r-r- 1 root root 236 2008-04-04 18:34 update-notifier.desktop\n\
  -rw-r-r- 1 root root 2783 2008-02-13 07:51 user-dirs-update-gtk.desktop\n```\n\n\
  例如，如果你不希望 tracker 运行，可以使用以下命令将其移动到另一个文件夹：\n\n```bash\n# mkdir ../old\n# mv tracker-applet.desktop\
  \ trackerd.desktop ../old\n```\n\n下次启动桌面时，tracker 将不会被启动。\n\n# Adobe Flash\n\n在电池供电的移动设备上使用\
  \ Flash 具有一定的挑战性。这很遗憾，因为 Flash 是一款流行的软件应用程序，而且如图 10-1 所示，它曾被用作 Ubuntu Hardy MID\
  \ 的“概念验证”主区域。\n\n根据 Adobe 的说法，只要有空闲的 CPU 周期，Flash 就会尽可能占用 CPU。这样做是因为，为了让用户感觉到动画播放流畅，每一帧在正确的时间显示至关重要。帧与帧之间时间的微小不一致都会导致动画看起来卡顿。\n\
  \n问题在于，Linux 内核 2.6.21 版本中引入了一种名为“动态滴答”（dynamic tick）的新调度模型，它允许处理器几乎完全关闭，直到用户下一次与计算机交互。Flash\
  \ 的这种持续轮询阻止了这种发生，对功耗产生了毁灭性的影响。\n\n可以使用 `top` 监控 CPU 使用情况，或通过 `apt` 安装 `gnome-system-monitor`\
  \ 进行图形化监控。\n\n虽然没有 Adobe 的代码更新无法完全消除 CPU 问题，但在运行 Adobe 提供的 Linux `.tar.gz` 版本（而不是\
  \ Ubuntu 仓库中封装的 Flash 版本）的实验中，了一些改进：\n\n```bash\n$ cd /tmp\n$ wget http://fpdownload.macromedia.com/get/flashplayer/current/install_flash_player_10_linux.tar.gz\n\
  $ tar -xvf install_flash_player_10_linux.tar.gz\n$ cd install_flash_player_10\n\
  $ sudo ../flashplayer-installer\n```\n\n这表明该领域的工作正在进行。关于 Flash iPhone 版本的传言一直存在，这绝对值得关注。\n\
  \n# 配置触摸屏\n\n触摸屏在从笔记本电脑、MID 到一体机等各种设备中变得越来越常见。对于 Ubuntu Jaunty，`evtouch` 将继续作为移动团队的解决方案，因为它涵盖了最广泛的触摸屏。\n\
  \n`evtouch` 是一个 `X` 触摸屏驱动程序。该驱动实际上是一个 `evdev` 驱动，支持绝对坐标、相对坐标和鼠标按钮的移动事件。\n\nUbuntu\
  \ MID 上的图形化触摸屏校准工具通过 `Preferences Calibrate Touchscreen` 访问。如果它在设备上没有按预期工作，可以手动运行\
  \ `calibrate` 脚本。运行：\n\n```bash\n$ lshal | grep evtouch\n```\n\n这确保了设备正在使用 `evtouch`\
  \ 驱动程序。\n\n\n\n\n\n10/6/09 9:03:39 AM\n\n# 第 10 章：技巧与技巧\n\n```xml\n<merge key=\"\
  input.x11_options.taptimer\" type=\"string\">\n30\n</merge>\n<merge key=\"input.x11_options.longtouchtimer\"\
  \ type=\"string\">\n750\n</merge>\n<merge key=\"input.x11_options.longtouched_action\"\
  \ type=\"string\">\nclick\n</merge>\n<merge key=\"input.x11_options.longtouched_button\"\
  \ type=\"string\">\n3\n</merge>\n<merge key=\"input.x11_options.oneandhalftap_button\"\
  \ type=\"string\">\n2\n</merge>\n<merge key=\"input.x11_options.movelimit\" type=\"\
  string\">\n1\n</merge>\n<merge key=\"input.x11_options.touched_drag\" type=\"string\"\
  >\n1\n</merge>\n<merge key=\"input.x11_options.maybetapped_action\" type=\"string\"\
  >\nclick\n</merge>\n<merge key=\"input.x11_options.maybetapped_button\" type=\"\
  string\">\n1\n</merge>\n</device>\n</deviceinfo>\n```\n\n如果触摸屏已校准但不够准确（例如，在屏幕上移动手指或触笔时，光标每次跳转\
  \ 1/4 到 1/2 英寸），请尝试为 `movelimit` 参数添加值（将其设置为 5 或 10）。该参数定义了 `evtouch` 驱动使用的步长，默认值为\
  \ 30 像素，对于该设备来说这个值可能太大了。\n\n请查看 `/usr/share/hal/fdi/policy/10osvendor/50 -` 文件以获取帮助并创建你自己的\
  \ `.fdi` 文件。\n\n重启 hal：\n\n```\n# service hal restart\n```\n\n接下来，重启 X。你的触摸屏现在应该可以正常工作了。如果还没有，你需要确保自定义的\
  \ `.fdi` 文件（如果你创建了话）正在被使用。\n\n记住，`/etc/hal/fdi/*` 中的文件优先级会高于 `/usr/share/hal/fdi/`\
  \ 中的文件；你可能还需要检查 X 是否已读取了你的更改。要做到这一点，请运行以下命令：\n\n```\n$ UDI=$(hal-find-by-capability\
  \ --capability input.mouse)\n$ lshal -u $UDI\n```\n\n这将得到类似下面的的内容：\n\n```\nudi =\
  \ ‘/org/freedesktop/Hal/devices/usb_device_eef_1_noserial_if0_logicaldev_input’\n\
  info.capabilities = {‘input’, ‘input.mouse’} (string list)\ninfo.category = ‘input’\
  \ (string)\ninfo.parent = ‘/org/freedesktop/Hal/devices/usb_device_eef_1_noserial_if0’\
  \ (string) info.product = ‘eGalax Inc. Touch’ (string)\ninfo.subsystem = ‘input’\
  \ (string)\ninfo.udi = ‘/org/freedesktop/Hal/devices/usb_device_eef_1_noserial_if0_logicaldev_input’\
  \ (string)\ninput.device = ‘/dev/input/event1’ (string)\ninput.originating_device\
  \ = ‘/org/freedesktop/Hal/devices/usb_device_eef_1_noserial_if0’ (string) input.product\
  \ = ‘eGalax Inc. Touch’ (string)\ninput.x11_driver = ‘evtouch’ (string)\ninput.x11_options.longtouched_action\
  \ = ‘click’ (string)\ninput.x11_options.longtouched_button = ‘3’ (string)\ninput.x11_options.longtouchtimer\
  \ = ‘750’ (string)\ninput.x11_options.maxx = ‘1912’ (string)\ninput.x11_options.maxy\
  \ = ‘1989’ (string)\ninput.x11_options.maybetapped_action = ‘click’ (string)\ninput.x11_options.maybetapped_button\
  \ = ‘1’ (string)\ninput.x11_options.minx = ‘112’ (string)\ninput.x11_options.miny\
  \ = ‘76’ (string)\ninput.x11_options.movelimit = ‘10’ (string)\ninput.x11_options.oneandhalftap_button\
  \ = ‘2’ (string)\ninput.x11_options.rotate = ‘ccw’ (string)\ninput.x11_options.swapy\
  \ = true (bool)\ninput.x11_options.taptimer = ‘30’ (string)\ninput.x11_options.touched_drag\
  \ = ‘1’ (string)\nlinux.path = ‘/org/freedesktop/Hal/devices/usb_device_eef_1_noserial_if0’\
  \ (string)\n```\n\n\n\n\n其他有用的资源包括硬件兼容列表，简称 `HCL`。这些列表列出了用于笔记本电脑、MID、PDA、手机、媒体播放器、GPS\
  \ 设备和“可穿戴设备”的硬件组件、部件和插件。例如，要检查设备的摄像头支持情况，请访问 `http://tuxmobil.org/laptop_webcams_linux.html`。如果在列表中，选择目标设备。点击\
  \ `Acer Aspire One ZG5` 链接可以获得有关该设备硬件的所有类型信息。\n\n例如，这是摄像头上提供的信息：\n\n```\nuvcvideo:\
  \ Found UVC 1.00 device Acer Crystal Eye webcam (064e:d101) usbcore: registered\
  \ new interface driver uvcvideo\nfilename: /lib/modules/2.6.23.9lw/usb/media/uvcvideo.ko\
  \ version: SVN r215\nlicense: GPL\ndescription: USB Video Class driver\nauthor:\
  \ Laurent Pinchart\nsrcversion: 9F1EDDCB5114CB7A45B4A74\n..\ndepends: videodev,v4l2-common,v4l1-compat,compat_ioctl32\n\
  vermagic: 2.6.23.9lw SMP preempt mod_unload CORE2\nparm: quirks:Forced device quirks\
  \ (uint)\nparm: trace:Trace level bitmask (uint)\n```\n\n该设备受 Ubuntu 开箱即用支持。使用 `apt-cache`\
  \ 搜索显示，存储库中有以下应用程序：\n\n- `luvcview` — USB 视频类捕获器\n- `uvccapture` — USB UVC 视频类快照软件\n\
  \n因此，这些程序也许可以被添加到种子镜像中。\n\n## 内核微调\n\n在磁盘空间较小的设备上，可能需要从内核中移除所有不必要的驱动程序和模块。优化处理器（例如通过启用超线程）、以协调的方式管理内存并确保网络参数正确显然也是一个好主意。\n\
  \n目标设备上的 Atom 处理器是一种新架构，但基于较旧的技术。它是自 Pentium 以来英特尔推出的首个顺序执行 x86 处理器。\n\n处理器逐个接收指令并将其放入流水线中，然后执行。在顺序执行架构中，指令按照到达的顺序执行，而在乱序执行架构中，能够改变流水线中的顺序。\n\
  \n在 Atom 上，长流水线与顺序执行架构相结合——因此，超线程是有效的并能显著提高性能。这需要在设备内核和设备 BIOS 中同时启用。\n\n可以使用 `htop`\
  \ 和 `sysstat` 测量 CPU 性能，这些工具在存储库中都是可用的。\n\n要了解如何实际进行此类更改，请参阅第 8 章“内核微调”。\n\n## 定义电源策略\n\
  \nDeviceKit-Power（见第 3 章“电源管理”）现在集成到 karmic 的新 `Gnome-Power-Manager` 中。\n\n需要注意的是，自\
  \ Ubuntu Jaunty 起，`powernow-k8` 和 `acpi-cpufreq` 不再作为模块可用，而是被编译进内核中。这一点很重要，因为 `Linux-PHC`\
  \ 等项目使用这些模块来降低 CPU 以延长电池寿命并在不影响性能的情况下降低 CPU 温度。\n\n因此，为了启用降压，要么编译带有独立模块的内核（这以增加启动时间为代价），要么使用来自\
  \ Linux PHC PPA（`https://launchpad.net/~linux-phc/+archive/ppa`）的内核。\n\n`Linux-PHC`\
  \ 利用了 CPU 的生产公差。CPU 具有不同的生产质量，因此厂商为每个 CPU 定义了电压——即使是低质量的 CPU 也可以降压。目前，Atom 处理器降压的实际电源性能结果不一，因此建议尽可能完全地优化系统以节电，并尽可能挂起设备（WLAN、USB、LAN）。\n\
  \n## 它是嵌入式系统吗？\n\n根据硬件类型的不同，文件系统可能需要压缩。在创建嵌入式系统时，设备存储的每一个字节都至关重要，因此尽可能到处都使用压缩。\n\
  \n`SquashFS` 是一种只读文件系统，它可以压缩整个文件系统或单个目录，然后将其写入其他设备/分区或普通文件中。这些内容可以直接挂载（如果是设备）或使用回环设备（如果是文件）。\n\
  \n有一个在固态硬盘（SSD）文件系统上启用优化的技巧。如果使用原始的 `Grub`，在 `/boot/grub/menu.lst` 中添加 `elevator=noop`，或者在\
  \ `Grub2` 的配置文件中添加它。\n\n`elevator=noop` 有助于加速磁盘 I/O 请求的重排序。这意味着当磁头跨越磁盘时，它可以以有序的、连续的方式处理这些请求，而不是来回移动。\n\
  \n现在一些基础问题已经得到了解答，可以考虑镜像中需要哪些自定义内容。在与 OEM 合作时，这可能会在“工作条款协议”中提前约定。如果你是“自制（homebrewing）”，你将知道想要进行哪些自定义。\n\
  \n## 自定义用户界面\n\nUbuntu 的默认行为可以被大幅修改。从启动选择器到桌面主题一切都可以更改。本节讨论了可以进行的一些相关自定义。\n\n###\
  \ 启动选择器\n\n对于 karmic，默认的启动选择器是 `Grub2`。`Grub2`是对原始 `Grub` 的改进，可以更容易地自定义。在新的设计下，也支持其他架构。然而，目前它不能作为\
  \ ARM 架构的引导器。在这种情况下，使用的是 `u-boot`。\n\n`Grub2` 现在带有一个位于 `/etc/default/grub` 的配置文件，包含了旧\
  \ `Grub` 中的信息。该文件看起来如下：\n\n```\n# 此文件由 update-grub 产生，其变量将传递\n# /etc/grub.d/\nGRUB_DEFAULT=0\n\
  GRUB_TIMEOUT=4\nGRUB_DISTRIBUTOR=`lsb_release -i -s` 2>/dev/null || echo Debian\n\
  GRUB_CMDLINE_LINUX_DEFAULT=\"quiet splash”\n# 取消注释禁用图形终端（仅 grub-pc）\n#GRUB_TERMINAL=console\n\
  # 如果你不希望 GRUB 向 Linux 传递 root=UUID 参数\nGRUB_DISABLE_UUID=true\n```\n\n除了 `/etc/default/grub`\
  \ 文件外`/etc/grub.d/` 文件夹包含其他在执行 `update-grub` 或 `update-grub2` 命令期间会被读取的文件。内容随后会被导入\
  \ `/boot/grub/grub.cfg`。\n\n这些文件有：\n\n- `00_header`\n- `05_debian_theme` — 设置背景和文字颜色、主题。\n\
  - `10_hurd`\n- `10_linux`\n- `20_memtest86+` — 如果存在 `/boot/memtest86+.bin` 文件，则作为菜单项包含。\n\
  - `30_os-prober` — 搜索其他操作系统并将其包含在菜单中。\n- `40_custom` — 添加自定义菜单条目的模板，它们在执行 `update-grub2`\
  \ 命令时会被插入 `grub.cfg`。\n\n此文件以及任何其他自定义文件必须具有可执行权限，以便导入到 `grub.cfg`。\n\n`05_debian_theme`\
  \ 文件可以被编辑以设置不同的背景图像，如下代码所示：\n\n```\n# 检查可用的背景\nuse_bg=false\nif [ “$GRUB_TERMINAL”\
  \ = “gfxterm” ]; then\nfor i in {/boot/grub,/usr/share/images/desktop-base}/Windbuchencom.{png,tga};\
  \ do if bg=`convert_system_path_to_grub_path $i`; then\n\ncase ${bg} in\n*.png)\
  \ reader=png;;\n*.tga) reader=tga;;\n*.jpg|*.jpeg) reader=jpeg;;\nEsac\nif test\
  \ -e /boot/grub/${reader}.mod; then\necho “找到 Debian 背景: `basename ${bg}`”\n> /dev/null\n\
  use_bg=true\nbreak\nfi\nfi\ndone\nfi\n```\n\n\n\n\n将 `Windbuchencom` 镜像更改为镜像后，运行\
  \ `grub install` 命令将更改写入 `Grub2` 配置中。\n\n## 显示器管理器 (Display Manager)\n\n显示管理器是一个可以管理多个\
  \ X 显示/会话的程序。X 显示/会话可以通过本地或远程主机上的 `X Server` 启动。如果 `X Server` 位于远程主机，它将通过 `XDMCP`（X\
  \ 显示器管理器控制协议）向显示管理器请求会话。\n\n显示管理器提供提示用户名和密码的服务，用于验证用户身份并运行会话。会话可能包含多个程序，但从用户的角度来看，这主要是一个窗口管理器。\n\
  \n有多个显示管理器可以选择，但对于此发行版，`GDM` 是首选。\n\n## GDM\n\n`GDM 是 GNOME 项目的显示管理器。它具有高度的可定制性，并拥有简单的配置和预配置系统。\n\
  \n### 预配置 GDM\n\n默认的 `gdm` 行为可以更改。配置文件遵循 `ini` 文件格式。配置包含几个部分：`daemon`、`security`、`xdmcp`、`gui`、`greeter`、`chooser`、`debug`\
  \ 和 `servers`。配置文件位于 `/etc/gdm/gdm.conf-custom`。\n\n以下代码显示了如何启用屏幕键盘：\n\n```ini\n\
  # gdm.conf-custom\n\n# gdm\n\n[daemon]\nAddGtkModules=true\nGtkModulesList=gail:atk-bridge:/usr/lib/gtk-2.0/modules/libdwellmouselistener:/usr/lib/gtk-2.0/modules/libkeymouselistener\n\
  \n[security]\n\n[xdmcp]\n\n[gui]\n\n[greeter]\nSoundOnLogin=false\n\n[chooser]\n\
  \n[debug]\n\n[servers]\n```\n\n`GDM` 还可以设置主题。这将在第 7 章“主题化”中解释。\n\n## 设置默认的 Ubuntu、XFCE\
  \ 和 Hildon 行为\n\n基于 Gtk 的桌面使用 `GConf` 作为配置默认数据库。以下文件是为 `gconf` 设置默认配置的示例。该文件通常包含配置包的\
  \ `src/debian` 目录下：\n\n```text\n<package-name>\n.gconf-defaults\n/desktop/gnome/interface/gtk_theme\
  \ brdesktop\n/desktop/gnome/background/picture_filename /usr/share/wallpapers/brdesktop03.jpg\n\
  /desktop/gnome/volume_manager/autophoto_command “gthumb —import-photos %h”\n/desktop/gnome/volume_manager/autoburn_data_cd_command\
  \ brasero -d\n/apps/gnome-session/options/show_splash_screen true\n/apps/nautilus/preferences/always_use_browser\
  \ true\n/apps/gksu/sudo-mode false\n/desktop/gnome/applications/main-menu/file-area/user_specified_apps[iceweasel.desktop,ooo-writer.desktop,listen.desktop,gthumb.desktop,nautilus-home.desktop]\n\
  /apps/nautilus/preferences/preview_sound never\n/desktop/gnome/applications/main-menu/system_monitor\
  \ baobab.desktop\n```\n\n## 细调构建过程\n\n此处包含了以下两个部分，因为它们都能极大地缩短构建最终 CD 的时间。尝试配置和种子，比等待软件包要好。\n\
  \n### 建立仓库\n\n建立 Debian 仓库在第 5 章中介绍过。简而言之，向本地仓库添加 debian 包的操作如下：\n\n```bash\n$ reprepro\
  \ includedeb <some-debian-package>\n```\n\n也可能存在开发人员需要向远程服务器添加 debian 包的情况（也可以使用\
  \ PPA，但如之前所述，PPA 生成软件包可能需要很长时间）。要向远程服务器添加 debian 包，请安装 `dupload`：`: sudo apt-get\
  \ install dupload`\n\n在 `/etc/dupload.conf` 中添加配置：\n\n```bash\n$cfg{‘pumd} = {\n\
  fqdn = “professional-ubuntu-mobile-development.com”,\nincoming = “/pub/UploadQueue/”,\n\
  };\n```\n\n这会将完全限定域名设置为 `professional-ubuntu-mobile-development.com`，并将服务器上的 `incoming`\
  \ 文件夹设置为 `/pub/UploadQueue/`。现在可以使用 `$ dupload --to pumd <some-debian-package>.changes`\
  \ 上传到该服务器。\n\n现在服务器上安装了 `reprepro` 后，软件包就可以添加到仓库中了。这可以通过脚本实现并将脚本添加到 cron 任务中。有关这种方法的更多信息，请访问\
  \ www.debian-administration.org/articles/286。\n\n### 使用 approx 缓存软件包\n\n如果互联网连接有限，缓存系统非常有帮助。可以使用许多工具来缓存软件包，如\
  \ `approx`、`apt-cacher`、`apt-cacher-ng` 和 `apt-proxy`。选择哪一个取决于喜好，但我们 `approx` 的效果良好。\n\
  \n运行以下命令进行安装：\n\n```bash\n$ sudo apt-get install approx\n```\n\n配置文件位于 `/etc/approx/approx.conf`。你可以将仓库添加到其中。这是一个示例：\n\
  \n```text\npackages http://professional-ubuntu-mobile-development.com/\n```\n\n\
  在 `/etc/apt/source.list` 中添加如下的一行：\n\n```text\ndeb http://professional-ubuntu-mobile-development.com/packages/ubuntu\
  \ karmic main\n```\n\n## 创建默认 Ubuntu 镜像\n\n现在是考虑实际创建镜像的时候。该镜像应该可以安装在设备上，为了实现这一点，安装程序是必要的。本章其余部分演示的技术不仅在处理移动设备时有用，也可以轻松地用于创建安装镜像。\n\
  \n### 选择使用哪种安装程序\n\n有两种不同的安装程序；决定使用哪一个在很大程度上取决于设备的目标观众以及你想创建什么类型的镜像。\n\n### 何时使用\
  \ Debian Installer (替代镜像)\n\n替代安装程序通常用于更高级的安装，因为它提供了普通镜像中没有的选项。这包括向内核模块传递选项或强制静态网络配置。让我们考虑另一个例子：在第\
  \ 6 章中，用户的家目录被加密了。如果需要扩展到加密设备上的整个硬盘，那么此选项仅在替代镜像中可用。\n\n如果安装需要在多个设备上自动完成，或者设备本身的内存占用较小（小于\
  \ 256MB RAM），则也应该使用替代镜像。\n\n### 何时使用 Ubiquity (桌面镜像)\n\nUbiquity 是一个 Ubuntu 的图形化安装程序，用\
  \ Python 编写，它使用 debian 安装器 (d - i) 作为许多功能的后端。构建 Ubiquity 是因为原始 d - i 界面被人认为相当粗糙。这是因为\
  \ d - i 使用了一个名为 debconf 的系统来构建用户界面，由于该界面依赖响应，它可能缺乏某些灵活性。Ubiquity 的不同之处在于它的主要关注是新用户的易用性，因此它使用了一个名为\
  \ debconfilter 的过滤器，该过滤器位于 d - i 代码和 debconf 前端之间，拦截 debconf 协议并将相关的 debconf 消息转换为可以像来自\
  \ GTK+ 或 Qt 等组件库的 UI 事件相同的方式处理的事件。\n\n从镜像开始：准备环境\n\n构建 Ubuntu 镜像有许多方法。各种现有工具尝试自动化此任务——例如\
  \ remastersys、uck (Ubuntu Customization Kit) 以及手动编辑默认 Ubuntu 镜像的方法。本节将描述 Ubuntu\
  \ 官方的创建镜像方法。\n\n\n\n\n\n# 从零开始镜像涉及四个项目：\n\n* `cdimage`\n* `debian-cd`\n* `germinate`\n\
  * `britney`\n\n本节将介绍其中每一个项目。\n\n`cdimage` 是一组驱动整个过程并处理与本地仓库同步的脚本。它从种子文件生成 `debian-cd`\
  \ 任务列表，并调用 `debian-cd` 来刻制完成的 ISO。\n\n创建 ISO 的第一步是建立合理的目录结构：\n```bash\nmkdir -p\
  \ /home/<username>/devel/ubuntu\n```\n\n进入最近创建的目录。接下来，为我们的 `ubuntu-cdimage` 脚本创建一个分支：\n\
  ```bash\nbzr branch bzr+ssh://bazaar.launchpad.net/~rclbelem/ubuntu-cdimage/mainline/ubuntu-cdimage\n\
  ```\n\n同时也创建一个带有针对 Ubuntu 更改的 `debian-cd` 分支：\n```bash\nbzr branch bzr+ssh://bazaar.launchpad.net/%7Eubuntu-cdimage/debian-cd/ubuntu/debian-cd\n\
  ```\n\n在两者之间创建一个符号链接：\n```bash\nln -s debian-cd ubuntu-cdimage/\n```\n\n`britney`\
  \ 是一个更新脚本，它可以智能地移动包（最初从 Debian 的不稳定仓库移动到测试仓库），其智能之处在于，包的目标地应该始终是完全可安装的，并且接近发布候选状态。为此创建分支：\n\
  ```bash\nbzr branch http://people.ubuntu.com/%7Ecjwatson/bzr/britney/cdimage/ britney\n\
  ```\n\n创建一个从 `britney` 到 `ubuntu-cdimage` 的符号链接：\n```bash\nln -s britney ubuntu-cdimage/\n\
  ```\n\n如下所示分支 `germinate`：\n```bash\nbzr branch bzr+ssh://bazaar.launchpad.net/%7Ecjwatson/germinate/mainline/germinate\n\
  ```\n\n将其链接到 `ubuntu-cdimage`：\n```bash\nln -s germinate ubuntu-cdimage/\n```\n\n\
  现在安装 `debian-cd`、`debymir` 和 `procmail`。我们不会直接使用 `debian-cd` 本身，但安装它（以及提到的其他包）意味着满足了所有的依赖关系。\n\
  ```bash\nsudo apt-get install debian-cd debmirror procmail zsync\n```\n\n安装 `germinate`\
  \ 以安装其依赖项。\n```bash\nsudo apt-get install germinate\n```\n\n接下来，安装 `britney` 依赖的包：\n\
  ```bash\nsudo apt-get install libapt-pkg-dev\n```\n\n创建放置 gpg 文件的基础目录：\n```bash\n\
  mkdir -p /home/<username>/devel/ubuntu/ubuntu-cdimage/secret/dot-gnupg\n```\n\n\
  现在创建一个新的 gpg 密钥。在创建过程中按照提示回答问题，但要确保密码字段是空的（在密码提示处直接按回车）。`cdimage` 中的脚本以批模式运行，如果设置了密码，将会失败：\n\
  ```bash\ngpg --homedir /home/<username>/devel/ubuntu/ubuntu-cdimage/secret/dot-gnupg\
  \ --gen-key --force-v4-certs\n```\n\n编辑最近创建的密钥并将其主密钥：\n```bash\ngpg --homedir /home/<username>/devel/ubuntu/ubuntu-cdimage/secret/dot-gnupg\
  \ --edit-key <keyid>\n```\n通过以下操作完成：\n1. 命令：`primary`\n2. 命令：`1`\n\n现在导入 Ubuntu\
  \ 密钥环——这会添加所有开发者密钥：\n```bash\ngpg --no-default-keyring --keyring /home/<username>/devel/ubuntu/ubuntu-cdimage/secret/dot-gnupg/pubring.gpg\
  \ --import /usr/share/keyrings/ubuntu-archive-keyring.gpg\n```\n\n**如果镜像将托管“feisty\
  \ ” 仓库，则需要以下步骤（否则请跳过）：**\n```bash\ngpg-no-default-keyring-keyring /home/<username>/devel/ubuntu/mirror-keyring/trustedkeys.gpg\
  \ import /usr/share/keyrings/ubuntu-archive-keyring.gpg\n```\n\n从 https://launchpad.net/ubuntu/+archivemirrors\
  \ 列表中选择一个离你物理位置近且支持 rsync 的镜像，然后运行以下命令创建本地镜像：\n```bash\nGNUPGHOME=/home/<username>/devel/ubuntu/ubuntu-cdimage/secret/dot-gnupg\
  \ debmirror -a i386 -s main,restricted,main/debian-installer -e rsync -r:ubuntu\
  \ -h archive.ubuntu.com -d karmic /home/<username>/devel/ubuntu/ubuntu-cdimage/ftp\n\
  ```\n*前面的命令将占用约 15GB 的磁盘空间并且下载需要很长时间！*\n\n按照步骤操作后，环境已就绪。现在是构建默认 Ubuntu 镜像了。\n\n\
  ## 最后，构建默认 ISO\n\n现在构建镜像的一切已就绪。为此，创建一个名为 `seeds` 的目录并下载所需的种子文件：\n```bash\nmkdir\
  \ seeds\ncd seeds\nbzr branch http://bazaar.launchpad.net/~ubuntu-core-dev/ubuntu-seeds/platform.karmic/\n\
  bzr branch http://bazaar.launchpad.net/~ubuntu-core-dev/ubuntu-seeds/ubuntu.karmic/\n\
  ```\n\n编辑 `ubuntu-cdimage/etc` 中的配置文件：\n```bash\ncd ./ubuntu-cdimage/etc/\nvi config\n\
  ```\n\n完成后的文件看起来所示：\n```bash\n#! /bin/sh\n# 构建 Ubuntu CD 镜像的设置。构建过程还涉及\n# 同步本地 Ubuntu\
  \ 镜像；查看 etc/anonftpsync 关于影响\n# 镜像内容和位置的设置。\n\nexport LC_ALL=C\nexport CDIMAGE_ROOT=\"\
  ${CDIMAGE_ROOT:-/home/<username>/devel/ubuntu/ubuntu-cdimage}\"\nif [ -z $PROJECT\
  \ ]; then\n  PROJECT=\"${PROJECT:-ubuntu}\"\nfi\nif [ -z $CAPPROJECT ]; then\n \
  \ CAPPROJECT=\"${CAPPROJECT:-Ubuntu}\"\nfi\nif [ -z $DIST ]; then\n  DIST=\"${DIST:-karmic}\"\
  \nfi\nif [ -z $ARCHES ]; then\n  case $DIST in\n    warty|hoary|breezy|dapper|edgy)\n\
  \      ARCHES=\"${ARCHES:-amd64 i386 powerpc}\"\n      ;;\n    feisty|gutsy|hardy|intrepid|jaunty|karmic)\n\
  \      ARCHES=\"${ARCHES:-i386}\"\n      ;;\n  esac\nfi\n\n# 不要更新本地镜像\nCDIMAGE_NOSYNC=1\n\
  LOCAL_SEEDS=file:///home/<username>/devel/ubuntu/seeds/\nCDIMAGE_ROOT=`pwd`\nCDIMAGE_INSTALL=1\n\
  CPUARCHES=\"$(echo \"$ARCHES\" | xargs -n1 | sed 's/+.*//' | sort -u | xargs)\"\n\
  GNUPG_DIR=\"$CDIMAGE_ROOT/secret/dot-gnupg\"\nSIGNING_KEYID=1421BE56\n\n# 镜像信息\n\
  MIRROR=\nMIRRORDIR=\n\n# 构建完成后需要通知的宿主机。第三方用户\n# 将希望保持此变量为空。 \n# “async” 镜像将接收异步通知，即我们不会等待\n\
  # 它们的响应。\nTRIGGER_MIRRORS=\nTRIGGER_MIRRORS_ASYNC=\nexport TRIGGER_MIRRORS\nexport\
  \ TRIGGER_MIRRORS_ASYNC\n\n# 某些旧版本的 debootstrap 必须*认为它们正在以 root 身份运行，\n# 尽管在这里并不真的。如果你有这个问题，\n\
  # 请确保已安装 fakeroot 并取消注释此变量。\nDEBOOTSTRAPROOT=fakeroot\nexport DEBOOTSTRAPROOT\n\
  PATH=\"$CDIMAGE_ROOT/bin:$PATH\"\nexport PATH\numask 002\n```\n\n将 `$PATH` 设置为 `ubuntu-cdimage`\
  \ bin 目录：\n```bash\nexport PATH=/home/<username>/devel/ubuntu/ubuntu-cdimage/bin:$PATH\n\
  ```\n\n并构建 .iso：\n```bash\nCDIMAGE_ROOT=/home/<username>/devel/ubuntu/ubuntu-cdimage\
  \ CDIMAGE_NOSOURCE=1 DIST=karmic ARCHES=i386 CDIMAGE_NOSYNC=1 for-project ubuntu\
  \ cron.daily\n```\n这将构建镜像。\n\n## 构建自定义镜像\n\n现在可以构建自定义的 Ubuntu 镜像（根据你的目标用户选择合适的包组合和配置）。这能实现的唯一限制是你的想象力以及尝试不同应用程序和配置组合所需的时间。为此，有必要了解种子和\
  \ most 程序是如何运作的。\n\nUbuntu 存档库中有许多包，Canonical 需要支持它选择进入发布的包，至少 18 个月。跟踪所有这些包将变得不可管理，这很重要，因为\
  \ Canonical 仅对这些部分而非全部包提供商业支持。因此，Ubuntu 开发者创建了一套种子系统，这些种子是\n\n\n\n\n“萌发”为完成特定任务所需的完整软件包列表。从\
  \ Ubuntu 存档构建的所有内容都有一组相应的种子（seeds），列出了它们包含的软件包——例如，基础种子将包含在设备上获取最小命令行 shell 所需的最少软件包集。\n\
  \n这些种子扩展为软件包列表，然后使用某些自动化脚本创建 CD 和 DVD 镜像。这些镜像每天发布在 cdimage.ubuntu.com，最终作为发布发布在\
  \ releases.ubuntu.com。创建的镜像类型有：\n\n* `.iso 镜像` — Ubiquity（桌面版）和备安装程序\n* `.img 镜像`\
  \ — 用于 ARM 和 LPIA 镜像。\n\n### 种子萌发内部\n\n`germinate` 是一个通过读取种子文件来构建软件包列表的程序。种子文件是包含原始软件包列表的文件。这些原始列表由\
  \ `germinate` 程序处理以生成另一个列表，该列表包含原始列表中软件包的所有依赖项（`germinate` 也会在输出中创建创建独立的*建议 (suggests)*\
  \ 和*推荐 (recommends)* 列表）。图 11-1 所示的 `germinate` 输出示例展示了这一点——这是来自“最小 (minimal)”种子的输出。\n\
  \n在前面的表格中，包含 `aptitude` 是因为 `tasksel` 依赖于它，包含 `busybox - initramfs` 是因为 `initramfs\
  \ - tools` 依赖于它。\n\n原始种子文件有时在文件顶部以“key: value”格式带有头部信息。这些信息不会被 `germinate` 解析，但程序\
  \ `germinate - update - metapackage` 在生成输出时会使用。原始种子列表中的软件包应以项目符号形式列出，每个软件包前加一个星号。原始种子文件本身可以用\
  \ wiki 格式编写（如下所示），因为任何不以星号开头的内容都将被忽略。\n\n### 开发\n\n构建 Ubuntu 软件包需要这些程序包：\n\n* `build-essential`\n\
  * `fakeroot`\n\n### 硬件与网络访问\n\n* `pptp-linux` # 兼容微软的 VPN 客户端，某些 ISP 需要\n* `sl-modem-daemon`\
  \ # 某些 Winmodems 需要（参见 OutoftheboxWinmodem）\n* `bpalogin`\n* `ndiswrapper-utils-1.9\
  \ [amd64 i386]`\n* `ndisgtk`\n\n在前面的示例中，`pptp-linux` 是依赖项。如果它在括号中，则表示该软件包是推荐的而非依赖。例如，接下来的在线服务（Online\
  \ Services）示例就是推荐：\n\nOnline Services:\n* `(ubuntuone-client-gnome)`\n\n种子文件开头的感叹号表示每个种子的黑名单。感叹号意味着永远不要将此软件包包含在种子或其任何内部种子中。示例如下：\n\
  \n### 黑名单\n\n`libavcodec` 无法在 CD 上分发（参考 Ubuntu 技术委员会决议 2007-01-02）。\n\n`!libavcodec*`\n\
  \n`libavcodec` 结尾的星号用于 `germinate` 代码中的正则表达式匹配，将所有以 `libavcodec` 开头的内容放入每个种子的黑名单中。\n\
  \n在种子文件中需要注意的其他事情是进程替换变量。包含替换变量的软件包将根据这些变量值的每种可能组合扩展为相应的软件包。示例是：\n\n* `Kernel-Stem:\
  \ linux linux-image`\n\n### i386\n\n* `${Kernel-Stem}-generic-pae [i386]`\n* `linux-headers-generic-pae\
  \ [i386]`\n* `${Kernel-Stem}-virtual [i386]`\n* `linux-headers-virtual [i386]`\n\
  \n种子条目后面也可以跟随方括号。示例是：\n\n* `language-support-${Languages} [!powerpc]`\n\n这表示 language-support\
  \ 软件包不应在 powerpc 架构上使用。当然，反之亦然，跟随 `[lpia i386]`（不带感叹号）的种子条目表示它们应该在 LPIA 和 i386 架构上使用。\n\
  \n最后，如果种子中的软件包名称以 % 开头，则 `germinate` 将扩展为来自给定源包的所有二进制进制文件。\n\n### 萌发种子\n\n如前所述，原始种子文件通过\
  \ `germinate` 程序萌发为完整的软件包列表。`germinate` 程序需要某些默认种子文件存在才能工作。这些种子文件中最重要的（强制性的）是 `STRUCTURE`、`supported`\
  \ 和 `blacklist`。\n\n这些强制文件不一定包含任何内容，但它们必须存在于 `germinate` 才能工作。\n\n`STRUCTURE` 是一个特殊文件，列出了种子以及它们如何相互依赖。karmic\
  \ netbook 的 `STRUCTURE` 文件如下：\n\n```text\ninclude platform.karmic\nnetbook-remix:\
  \ desktop-common\nlive: netbook-remix\nship-live: live\nsupported: netbook-remix\
  \ ship-live supported-common\n```\n\n种子文件名后面跟着一个冒号。冒号后面是一个空格以及由空格分隔的种子列表，该行的第一个种子依赖它们。通过查看\
  \ `germinate` 输出中的 `structure.dot` 文件，可以图形化查看种子之间的关系。\n\n`STRUCTURE` 文件随后列出种子之间的继承关系。它是一个如下的有序序列：\n\
  \n`SEED:[INHERITED]`\n\n`INHERITED` 是一个由空格分隔的种子列表，`SEED` 继承自。例如，前面 `STRUCTURE` 文件中的\
  \ `netbook-remix: desktop-common` 表示 `netbook-remix` 种子中的软件包可能依赖于 `desktop-common`\
  \ 种子中的软件包，而不需要这些软件包出现在 `netbook-remix` 的输出中。下文部分看到的类似 `include BRANCH` 的行会导致另一个种子分支被包含。\n\
  \n*supported* 种子列出了构建发行版所需的所有软件包（但出于空间考虑，不一定需要包含在最终镜像中）。因此，`germinate` 不会将遵循种子软件包及其依赖项的构建依赖关系而产生的所有软件包都添加到每个输出中，除非它们也在种子列表中。这些软件包被添加到\
  \ `supported` 中。像任何其他种子一样，`supported` 种子可能包含它自己的软件包列表。\n\n*blacklist* 文件没有定义要包含的软件包列表，而是列出了永远不会包含\
  \ `germinate` 输出的软件包。\n\nUbuntu Netbook Remix 示例中 `STRUCTURE` 文件里列出的其他种子（如 `netbook-remix`、`desktop-common`、`live`、`ship-live`\
  \ 等）可以称为任何名称，但它们需要存在，并且需要在 `STRUCTURE` 文件中相应列出。\n\n### 示例：萌发 Ubuntu Netbook Remix\n\
  \n首先分支 Ubuntu Netbook Remix 种子。创建一个 seeds 目录：\n\n```bash\nmkdir seeds; cd seeds\n\
  $ bzr branch lp:~ubuntu-core-dev/ubuntu-seeds/unr.karmic\n```\n\n进入 `unr.remix`\
  \ 文件夹，在 `STRUCTURE` 文件中有一行如下所示的内容：\n\n```text\ninclude platform.karmic\n```\n\n\n\
  \n这意味着需要 `platform karmic` 种子文件。返回 seeds 文件夹并切换到 `platform.karmic` 分支：\n\n```bash\n\
  $ cd ..\n$ bzr branch lp:~ubuntu-core-dev/ubuntu-seeds/platform.karmic\n```\n\n\
  接下来，创建一个输出文件夹并进入其中：\n\n```bash\n$ mkdir output; cd output\n```\n\n确保已安装了 `germinate`\
  \ 工具（使用 `sudo apt-get install germinate`），然后调用它：\n\n```bash\n$ germinate -S file:///home/user/Dev/Book/test/seeds/\
  \ -s unr.karmic -m http://172.16.50.131:9999/ubuntu -d karmic -a i386 -c main,restricted,universe,multiverse\n\
  ```\n\n172.16.50.131:9999 是我们的本地镜像——如果你没有设置本地镜像，请使用 archive.ubuntu.com。\n\n# 第 11\
  \ 章：整合一切\n\n使用种子文件（seeds）和 `germinate` 可以创建一个包含所有其他所需软件包（包括所有依赖项）的最终软件包列表。\n\n##\
  \ 软件包与仓库\n\n本节涉及创建元软件包（meta packages）以及为你的内容创建一个本地仓库。\n\n### 以 Ubuntu 方式生成元软件包\n\
  \n要以 Ubuntu 的方式创建元软件包，请获取 Ubuntu Karmic 的 `ubuntu-netbook-remix` 源码：\n\n```bash\n\
  $ apt-get source unr-meta\n```\n\n不要忘记向你的 `sources.list` 中添加 `karmic deb-src` 仓库。\n\
  \n确保已安装 `germinate` 工具：\n\n```bash\n$ sudo apt-get install germinate\n```\n\n进入\
  \ `unr-meta` 目录（这是在我们检出 `unr-meta` 源码时创建的），并删除 `metapackage-map` 和所有的 `netbook-remix-*`\
  \ 文件：\n\n```bash\n$ rm metapackage-map netbook-remix-*\n```\n\n编辑更新脚本并从最后一行删除 `--bzr`\
  \ 参数：更改后，最后一行看起来如下：\n\n```bash\n$ exec germinate-update-metapackage\n```\n\n只有当种子文件位于本地机器而非\
  \ Bazaar 仓库中时，此参数才是重要的。如果种子文件在 Bazaar 中，可以再次添加该参数。\n\n`--bzr` 参数强制 `germinate-update-metapackage`\
  \ 从 Bazaar 仓库下载种子文件。如果未提供该参数，它将回退到 ubuntu 种子仓库。\n\n接下来，编辑 `update.cfg` 文件。这是 `germinate-update-metapackage`\
  \ 的配置文件，默认情况下文件内容如下：\n\n```ini\n[DEFAULT]\ndist: karmic\n[karmic]\nseeds: netbook-remix\n\
  architectures: i386 amd64 powerpc ia64 sparc lpia armel\nseed_base: http://people.ubuntu.com/~ubuntu-archive/seeds/\n\
  archive_base/default: http://archive.ubuntu.com/ubuntu/\narchive_base/ports: http://ports.ubuntu.com/ubuntu-ports/\n\
  archive_base/hppa: %(archive_base/ports)s\narchive_base/ia64: %(archive_base/ports)s\n\
  archive_base/lpia: %(archive_base/ports)s\narchive_base/powerpc: %(archive_base/ports)s\n\
  archive_base/sparc: %(archive_base/ports)s\narchive_base/armel: %(archive_base/ports)s\n\
  components: main restricted\n[karmic/bzr]\nseed_base: bzr+ssh://bazaar.launchpad.net/~ubuntu-core-dev/ubuntu-seeds/\n\
  seed_dist: unr.%(dist)s\n```\n\n更改后，文件应该如下所示（请阅读注释）：\n\n```ini\n[DEFAULT]\ndist:\
  \ karmic\n[karmic]\nseeds: netbook-test\narchitectures: i386\n# 在此处放置你的种子文件路径。在该路径下应该包含\
  \ platform\n# .karmic 和 netbook.karmic。\nseed_base: file:///home/user/devel/path/to/seeds/\n\
  # 这里有用逗号分隔的仓库。第一个仓库是\n# 缓存 debian 仓库，第二个是包含修改后软件包的本地仓库。\narchive_base/default: http://localhost:9999/ubuntu/,\
  \ file:/home/user/devel/path/to/repos\n# 这里将设置包含种子文件的目录名称\nseed_dist: netbook.%(dist)s\n\
  ```\n\n然后运行更新脚本：\n\n```bash\n$ ./update\n```\n\n此脚本调用 `germinate-update-metapackage`\
  \ 来构建构建元软件包。`germinate-update-metapackage` 会重命名当前目录，更新 `debian/control` 以反映种子的当前内容，并更新\
  \ `debian/changelog` 以描述其所做的更改。\n\n现在可以使用 `dpkg` 手动重建软件包。\n\n### 构建元软件包\n\n将 `unr-meta`\
  \ 目录重命名为新名称。这将是源包的新名称。例如将 `unr-meta-1.157` 重命名为 `netbook-meta-1.157`。\n\n这是在重命名源包，而不是新元软件包的。元软件包的名字在\
  \ `debian control` 文件的第二个段中定义。\n\n接下来，进入 `netbook-meta-1.157` 目录，然后进入 `debian` 子目录。编辑\
  \ `control` 文件，将旧软件包名（例如 `ubuntu-netbook-remix`）替换为新的元软件包名称（例如 `ubuntu-netbook-example`）。一个示例\
  \ control 文件如下所示：\n\n```text\nSource: netbook-meta\nSection: metapackages\nPriority:\
  \ optional\nMaintainer: Ubuntu Mobile Developers\nubuntu-mobile@lists.ubuntu.com\n\
  Standards-Version: 3.7.3\nBuild-Depends: debhelper (= 4), germinate (= 0.42)\nPackage:\
  \ ubuntu-netbook-example\nArchitecture: any\nDepends: ${ubuntu-netbook-example:Depends}\n\
  Recommends: ${ubuntu-netbook-example:Recommends}\nDescription: The Ubuntu Netbook\
  \ Example system\n此软件包依赖于 Ubuntu Netbook Remix 系统中的所有软件包。它还用于帮助确保适当升级，因此建议不要移除。\n\
  ```\n\n保存此文件，然后编辑 `debian/rules` 文件。如果你在 `STRUCTURE` 文件的“Germinating the Seeds”部分更改了主种子文件名（例如从\
  \ `netbook-remix` 更改为 `netbook-example`），你也应该应该替换它。这里是一个 rules 文件示例：\n\n```make\n\
  #!/usr/bin/make -f\n\nclean:\n\tdh_testdir\n\tdh_clean\n\trm -rf build-stamp *.old\
  \ debootstrap-dir\nDEB_BUILD_ARCH ?= $(shell dpkg-architecture -qDEB_BUILD_ARCH)\n\
  build: build-stamp\nbuild-stamp: netbook-example-$(DEB_BUILD_ARCH)\n\tdh_clean\n\
  \tfor seed in netbook-example; do \\\n\t\tpackage=ubuntu-$$seed; \\\n\t\t(printf\
  \ $$$$package:Depends=$; perl -pe 's/\\n/, /g' $$seed-$(DEB_BUILD_ARCH); echo) \\\
  \n\t\t> debian/$$package.substvars; \\\n\t\t(printf $$$$package:Recommends=$; perl\
  \ -pe 's/\\n/, /g' $$seed-recommends-$(DEB_BUILD_ARCH); echo) \\\n\t\t> debian/$$package.substvars;\
  \ \\\n\tdone\n\ttouch $@\ninstall: build-stamp\nbinary-arch: install\n\tdh_testdir\
  \ -a\n\tdh_testroot -a\n\tdh_installdocs -a\n\tdh_installchangelogs -a\n\tdh_compress\
  \ -a\n\tdh_fixperms -a\n\tdh_installdeb -a\n\tdh_gencontrol -a\n\tdh_md5sums -a\n\
  \tdh_builddeb -a\nbinary-indep:\n\tdh_testdir -i\n\tdh_testroot -i\n\tdh_installdocs\
  \ -i\n\tdh_installchangelogs -i\n\tdh_compress -i\n\tdh_fixperms -i\n\tdh_installdeb\
  \ -i\n\tdh_gencontrol -i\n\tdh_md5sums -i\n\tdh_builddeb -i\nbinary: binary-indep\
  \ binary-arch\n.PHONY: binary binary-arch binary-indep clean checkroot build\n```\n\
  \n最后，使用 `dch` 工具描述对 `debian/changelog` 的更改。在元软件包类型的根目录下执行：\n\n```bash\n$ dch -i\n\
  ```\n\n这将使用你的默认编辑器打开 `debian/changelog`。更新 `debian/changelog` 以描述所做的更改。一个示例 changelog\
  \ 如下：\n\n`mobile-example (1.104) karmic; urgency=low`\n* Fork ubuntu-meta source.\n\
  * Cleanup rules.\n* Set Maintainer to Mobile Developer\ndeveloper@mobile.org\n*\
  \ Switch seed_base to ~ubuntu-mobile/ubuntu-seeds and seed_dist to mobile.%(dist)s\n\
  \n现在可以使用 `debuild` 手动重建软件包。\n\n### 以简易的方法生成元软件包\n\n你可以在想要复制其已安装软件包的设备上运行以下命令。这种做法在巴西被称为\
  \ *gambiarra*。\n\n```bash\n$ dpkg-query -W -f='${Package}, ' | sed 's/\\, $//' >\
  \ metapackage-list.txt\n```\n\n\n\n\n\n# 第 11 章：整合一切\n\n以下是在运行 `karmic` 的 Acer Aspire\
  \ 设备上运行此命令的片段：`acpi-support`, `acpid`, `adduser`, `alacarte`, `alsa-base`, `alsa-utils`,\
  \ `anacron`, `apmd`, `app-install-data`, `app-install-data-commercial`, `apparmor`,\
  \ `apparmor-utils`, `apport`, `apport-gtk`, `apt`, `apt-transport-https`, `apt-utils`,\
  \ `apt-xapian-index`, `aptitude`, `apturl`, `aspell`, `aspell-en`, `at`, `at-spi`,\
  \ `avahi-autoipd`, `avahi-daemon`, `avahi-utils`, `base-files`, `base-passwd`, `bash`,\
  \ `bash-completion`, `bc`, `bind9-host`, `binfmt-support`, `binutils`, `bluetooth`,\
  \ `bluez`, `bluez-alsa`, `bluez-cups`, `bluez-gnome`, `bluez-gstreamer`, `bluez-utils`,\
  \ `bogofilter`, `bogofilter-bdb`, `bogofilter-common`, `brltty`, `brltty-x11`, `bsdmainutils`,`\n\
  \n上述命令将查询 `dpkg` 数据库并返回一个逗号分隔的列表，包含所有可以添加到控制文件 `Depends` 部分的软件包。\n\n一旦写入了控制文件（元软件包\
  \ metapackage 只需要一个控制文件），就可以使用以下命令构建元软件包：\n\n```\ndpkg-deb -b meta-package-name.deb\n\
  ```\n\n## 预种子安装程序 (Preseeding the Installer)\n\n本节解释了预种子安装程序的含义。\n\n正如之前解释过的，Ubuntu\
  \ 提供两种类型的安装程序——第一种是 `debian-installer`，第二种是 `Ubiquity`。使用 `debian-installer` 时可以使用功能完整的预种子，而使用\
  \ `Ubiquity` 时，在预种子操作上会有一些限制。\n\n如果不需要任何预配置，只需要更改主包名称即可。例如，更改位于 `ubuntu -cdimage/debian-cd/data/karmic/preseed/ubuntu-netbook-remix/netbook-remix.seed`\
  \ 的以下预种子文件：\n\n```\ntasksel tasksel/first multiselect ubuntu-netbook-remix\nd-i\
  \ preseed/early_command string . /usr/share/debconf/confmodule; db_get debconf/priority;\
  \ case $RET in low|medium) db_fset tasksel/first seen false ;; esac d-i passwd/auto-login\
  \ boolean true\n```\n\n改为位于 `ubuntu -cdimage/debian-cd/data/karmic/preseed/ubuntu-netbook-example/netbook-example.seed`\
  \ 的新文件，如下：\n\n```\ntasksel tasksel/first multiselect ubuntu-netbook-example\nd-i\
  \ preseed/early_command string . /usr/share/debconf/confmodule; db_get debconf/priority;\
  \ case $RET in low|medium) db_fset tasksel/first seen false ;; esac d-i passwd/auto-login\
  \ boolean true\n```\n\n如果需要预配置，则可以向此文件中添加选项。你可以从 `http://d-i.alioth.debian.org/manual/example-preseed.txt`\
  \ 获取一个可以作为你自定义文件基础的示例预配置文件。\n\n有多种选项可用。示例包括为安装设置默认语言区域 `d-i debian-installer/locale\
  \ string pt_BR`，或者安装非自由固件：\n\n```\nd-i hw-detect/load_firmware boolean true\n```\n\
  \n甚至可以报告设备上最流行的软件：`popularity-contest popularity-contest/participate boolean true`。你也可以通过\
  \ `debconf-get-selections` 创建你自己的示例预种子文件。这将输出你在设备上安装过程中所选择的所有 `debconf` 选项列表。\n\n\
  ```\nsudo apt-get install debconf-utils\nsudo debconf-get-selections --installer\
  \ > netbook-example.seed\nsudo debconf-get-selections >> netbook-example.seed\n\
  ```\n\n## 将软件包添加到镜像\n\n将你想要添加到镜像的软件包拷贝到：\n\n`LOCALDEBS=$CDIMAGE_ROOT/local/packages`\n\
  \n然后在你的构建镜像的命令中，在参数下方添加：`LOCAL=1 LOCALDEBS=$CDIMAGE_ROOT/local/packages`\n\n## 最后，构建自定义\
  \ ISO\n\n有了新的种子列表，构建最终自定义镜像的一切已准备就绪：\n\n```\nLOCAL=1 LOCALDEBS=$CDIMAGE_ROOT/local/packages\
  \ PROJECT=ubuntu CAPPROJECT=Ubuntu DIST=karmic ARCHES=i386 CDIMAGE_NOSYNC=1 IMAGE_TYPE=daily\
  \ build-image-set daily\n```\n\n随后即可将其分发并安装到目标设备上。\n\n## Ubuntu 政策、商标、版权和常识\n\n\
  需要注意的是，Ubuntu 镜像对所有想要下载其所含数据的人开放且可访问的。因此，它是任何人都可以使用的公共服务。尽管如此，在创建衍生发行版时，应该出于礼貌做一些事情。\n\
  \n以下内容仅应视为创建派生发行版时的预期概述。在发布任何你不确定的内容之前，咨询 Canonical Ltd. 是一个好主意。以下事项很重要：\n\n- 你应该将\
  \ `/etc/lsb-release` 中的 `DISTRIB_RELEASE` 变量更改为与衍生发行版命名方案兼容的内容。\n- 你应该更改 `Ubiquity`\
  \ 中的 Ubuntu 标志。这也可以包括更改新的 Ubiquity 幻灯片（分支 lp:ubiquity-slideshow）。\n- 你应该公开声明该发行版是基于\
  \ Ubuntu 的。\n- 你应该向 Ubuntu 提供反馈。提供错误报告，尽管补丁和文档更好！\n\n## 什么是衍生发行版？\n\n关于“衍生”（derivative）或派生发行版（derived\
  \ distribution）一术的确切定义存在混淆。从原始软件中衍生出某些新软件意味着原始软件发生了某种变化——如果没有这种情况，那么它只是对原始源代码进行了简单的\
  \ `gcc` 编译（在版权法中称为*编译*，compilation）。显然，如果更改了原始源代码，那么上游作者有权要求新作品按照与原始代码相同的条款进行许可。这一点很清楚——混淆在于对*新作品*（a\
  \ new work）的定义。\n\n版权法还允许一种情况：如果原始源代码被“注释”、“详述”或“修改”，则它在整体上被视为一个新作品。此新作品将受到与上述原始代码相同的许可条款限制。\n\
  \n## 何时使用 LGPL\n\n该库的原始名称是“库通用公共许可证”（Library General Public Licence），因为该许可证涵盖了应用程序之间的库链接。现在它更通常地被称为“较级通用公共许可证”（Lesser\
  \ General Public License）。\n\n\n\n\n\n# 第 11 章：整合一切\n\n假设有两个应用程序。当这两个应用程序都根据 GPL\
  \ 协议授权时，源代码必须公开——此话完。然而，当其中一个是 GPL 程序而另一个是专有应用程序时，情况就会变得复杂，当该专有应用程序使用了 GPL 程序的某些库时，情况更为复杂。LGPL\
  \ 许可证专门允许专有应用程序链接到 GPL 库，而无需要求专有应用程序提供其源代码。如果专有应用程序更改了 GPL 库中的某些源代码（可能是为了让应用程序更好地绑定），则只需要发布`那些更改`。在实践中，出于礼貌考虑，公司应该尽力确保这些代码能尽快被上游接受。通过这种方式维护要容易得多，可以确保未来的应用程序兼容性，并加强社区关系。\n\
  \n一些人认为，专有应用程序（当然也包括 GPL 程序）可以从 LGPL 代码派生，这一事实增加了该库周围的开发者群体和商业生态系统。\n\n英特尔通过其 `Clutter`\
  \ 库（见第 4 章“应用程序开发”）以及诺基亚都在遵循这一策略，诺基亚最近收购了 `Trolltech`（`QT` 的制造者），然后对整个 `QT` 库采用了\
  \ LGPL 协议。\n\n另一些人对社区建设的益处并不完全信服，因此有了“Lesser（较小的）”这一常用名称。一旦版权被正确分配，就可以继续并实际构建软件包。\n\
  \n我们在“构建自定义 Ubuntu 镜像”章节中制作的 `ISO image`（发行版）版权归作者所有，不属于 GPL。其原因是，该发行版构成了一个聚合或集体作品，我们自定义发行版中包含的所有单独应用程序都遵循各自的许可证（专有、GPL\
  \ 等），而实际的种子选择本身版权归我们所有。\n\n## 总结\n\n在本章中，我们构建了一个基于 Ubuntu Karmic 的自定义 Ubuntu 镜像。这是通过无数\
  \ Debian 和 Ubuntu 开发者、社区成员和技术写作者的努力才实现的。做到做到本身就是开源开发分布式特性的致敬，也是对全球各地以某种方式为自由软件开发做出贡献的每个人的感谢。\n\
  \n# 第 12 章：移动方向\n\n## 移动计算架构\n\n**架构**：计算机硬件、软件或两者的基础底层设计。\n\n市场在整个移动领域开启了大量的开发者机会。Linux\
  \ 和 Ubuntu 处于广泛应用于移动应用程序的良好位置。硬件、软件以及移动/网络技术的精确汇合是不可预测的，因此准备好技能和能力，以便随着未来场景的发展向各个方向移动，是明智之举。阅读这本书是这种准备的很大一部分。穿透市场的某些混乱也会有所帮助。\n\
  \n在你规划自己的移动活动时，路线图可能会证明是有用的。图 12-1 所示的架构框图提供了移动计算平台可能外观的一种种可能性。\n\n```\n用户应用程序\n\
  系统应用程序\n平台特定用户界面\n应用程序框架/语言绑定\n软件基础核心（例如：Moblin）\nUI 服务 - 2D/3D 界面、GUI 工具包\n应用程序服务\
  \ - 音频、视频、媒体、网络、位置、消息总线、内容、电源、Web\n中间件\n安全/消息/数据库/系统库\nLinux 内核和驱动程序\n硬件: 处理器/内存/I-O/媒体/触摸\n\
  文件: 丰富媒体/数据、归档\n```\n图 12-1\n\n子系统是移动的目标——并且受到遥远的、独立的个人、团体和基金会的控制。开发并不总是由市场激励引导的，也不以公司的发布周期历为标记。现有的组件需要维护，新的组件将被发明。新硬件将不断驱动软件栈发生变化。几乎所有的开源都是为了共享和改进的共同使命构建的。作为开源社区的一员，你可以直接影响这些关键子系统的任何一个。\n\
  \n## 选择、变化与机会\n\n诺伯特·维纳（Norbert Wiener）是一位世界闻名的数学家。作为一个天才，他在 14 岁时大学毕业，18 岁获得哈佛大学博士学位。他职业生涯的大部分时间在麻理工学院任教，因此对该机构的走廊非常熟悉。他在\
  \ 20 世纪 50 年代写了《发明：思想的护理》（Invention: The Care and Feeding of Ideas）。维纳描述了发明的四个关键阶段：学术气候、技术气候、社会气候和经济气候。\n\
  \n维纳强调需要鼓励和认可发明以及想法的创造。他还意识到将这些发明托付给社区进行信赖式管理的负担和责任。在许多方面，维纳的著作预见了开源革命和 Linux 发行版的作用。\n\
  \n根据维纳的描述，发明的早期阶段风险是巨大的，无法计算。发明的头脑除了遵循直觉、结合知识工作和行动外别无其他。在过了这艰难的第一步之后，维纳并没有掩盖真正巨大的进展往往需要很长时间才能成熟的事实。我们都见证了过去三十年来互联网、万维网和计算机带来的巨大技术变革。\n\
  \n在思考你的下一步——选择、变化和机会时，回想维纳的这些话来获得关于 Ubuntu、Linux、移动计算和开源的灵感：*利润动机可能很重要，但必须被其他动机所补充。社区必须培养一个群体，这个群体在外部社区既不屈从利润动机，在内部也不受该动机治理……无论科学创作获得什么收益，其目标都应该是社区利益，仅仅是个人利益。因此，这些收益应取决于发现者新思想的完整和免费出版。只有当真理是可以自由获得的时，真理才能让我们自由。*\n\
  \n图 12-2 和 12-3 所示的 Ubuntu 开发者社区在世界各地聚集，规划每个新版本。关注你附近的下次 Ubuntu 开发者大会日程并参与吧！\n\n\
  图 12-2\n图 12-3\n\n## 演进与软件开发\n\n林纳斯·托瓦尔斯（Linus Torvalds）定义了这种创新和创造精神。如果你想读一本精彩的书，并详细了解发明是如何运作的，请阅读林纳斯·托瓦尔斯和大卫·戴蒙德著的《乐趣：一个意外革命者的故事》（Just\
  \ for Fun: The Story of an Accidental Revolutionary）。这本书始于林纳斯成为 Linux 之前的早期，它非常引人入胜。读完后，你将获得关于技术开发真实发生的最佳叙事之一。这类故事的硬件对应物特蕾西·基德（Tracy\
  \ Kidder）的普利策奖作品《新机器的灵魂》（Soul of a New Machine）。\n\n\n\n\nTorvalds 的书读起来很有趣，但它也是观察伟大的开源技术如何演化的实验室。以\
  \ `Linux` 为例，该项目最初规模很小，并没有多少期望。它迅速增长到了人们想象（甚至是大型公司）无法理解的范围。\n\n很有可能在世界上某个地方，另一个年轻的软件天才或工程师正在从事某些工作，这些工作将在未来一两个十年内对计算机行业产生至少同等的影响。\n\
  \n# 第 12 章：移动方向\n\n当 Torvalds 编写第一行 `Linux` 代码时，理查德·斯尔曼正在向 Lotus 开发公司进军，为自由软件抗议。那是\
  \ 1990 年左右，我正在 Lotus 开发工作。有一天，我从办公室窗户望出去，看到 Stallman 等人站在 Lotus 的主大楼前。我清楚地记得有一个抗议者手里拿着一个牌子，上面写着一些不可思议的内容：换句话说，上面写着“所有软件都都应该是自由的。”\n\
  \n当时，很难理解一个理性的个体如何期望像 `Lotus 1 - 2 - 3` 这样复杂且高质量的软件可以被免费开发。（在参与 `Lotus 1 - 2 - 3`\
  \ 的 100 多人中，至少有一些人必须支付食宿费。而理查德·斯尔曼自称为一个“占屋者”，似乎在 MIT 获得了一个免租办公室和免费的过夜住宿，而且还收取着每小时\
  \ 260 美元的咨询费！）在接下来的十年里，大量微小、逐渐的变化席卷了科技行业。全球范围内，商业模式和环境发生了变化——通常是逐渐变化，但在 2008 年秋季发生了爆发性的增长。如今的技术与十年前完全不同，而且比\
  \ 20 年前更加演进。作为一种解释这种演化如何讨论的方法，我提供了四种演化软件开发模型供你参考。所有模型的灵感都来源于各种自然哲学著作。我将这些模型称为 `Darwin`、`Mendel`、`Mayr`\
  \ 和 `Frankenstein`。\n\n### Darwin\n\n`软件开发的达尔文模型`以查尔斯·罗伯特·达尔文命名，他因出版突破著作《物种起源》而闻名。达尔文在\
  \ 51 岁这个睿智的年龄发表了他的突破性著作。达尔文的书记录了他毕生对“自然选择”理论的研究和阐述。\n\n维基百科对这项研究和发现提供了一个简明的描述：“自然选择是指由于差异化繁殖，有利的遗传性状在繁殖生物种群的连续世代中变得越来越常见，而不利的遗传性状则变得越来越少见的过程。”\n\
  \n应用达尔文模型有助于解释为什么使用 `Windows` 的人比使用 `DOS` 多，为什么 `Linux` 比 `UNIX` 更流行，以及为什么笔记本电脑取代了台式电脑（后者曾取代了便携式）。达尔文模型解释了为什么计算机不需要\
  \ 50 英尺长、8 英尺高。正如德穆瓦在他开创性的统计学书中写道：“一个事件发生的概率大或小，取决于它可能发生的次数，与它可能发生或失败的总次数相比较。”由于近期移动技术（硬件和软件）的涌入，而且开源提供了几乎无限的组合，因此极有可能某些奇妙的移动开发将会“发生”。\n\
  \n## Mendel\n\n软件开发的 `孟德尔模型`以被誉为现代遗传学之父的格雷戈尔·约翰内·孟德尔命名。在孟德尔的一篇名为《植物杂交实验》的论文中，人们第一次看到了显性和隐性基因是如何运作的。孟德尔是一个聪明的兼职科学家，学会了如何创造“优胜汰”的结果。维基百科将孟德尔遗传描述为“关于遗传特征从亲代生物传递给后代的一系列基本原则。”\n\
  \n基于 `Linux` 的发行版是许多人细致的、有选择性的、科学的且个性化的作品，他们各自在“育种”自己的发行版。创建一个发行版本质上是一项孟德尔选择工作。发行版中的单个程序、软件包和定制内容都是根据创建该发行版的人的偏好和需求量身定制的。\n\
  \n孟德尔无疑可以追溯 `Ubuntu` 从 `Debian` 继承而来的性状。马克·舒特沃斯（Mark Shuttleworth）在学生时代就接触了互联网。在\
  \ 1994 年之前，由于他创建了 `Apache` 的第一个包后，他在 1994 年成为了一名 `Debian` 开发者。从那时起，`Debian` 成为成为他工作的锚点和基础。\n\
  \n舒特沃斯是 `Ubuntu` 的第一个“宇宙主宰”——这是一群负责编辑、维护、包含、排除和识别新版本 `Ubuntu` 发布组件间相互依赖关系的人员。\n\n\
  ## Mayr\n\n软件开发的 `迈尔模型`以恩恩斯特·迈尔（Ernst Mayr）命名。迈尔因成为领先的进化生物学家而闻名。他的伟大著作揭示了物种适应和繁殖的复杂性。迈尔的工作协调并连接了`达尔文`和`孟德尔`的工作，将此前对立的科学家阵营聚集在一起。迈尔的理论建立了桥梁而非围墙。迈尔以他通过观鸟协会协会招募和指导其他科学家的方式而闻名。\n\
  \n迈尔模型解释了多样化 `Linux` 发行版的共存。在许多方面，迈尔的方法论反映了开源开发。通过协作和知识共享，迈尔将来自非常不同领域的人聚集在一起。还有一点与迈尔的相似性值得注意。埃里克·雷蒙德（Eric\
  \ Raymond）曾深刻地写道：“每一项优秀的软件工作都始于开发者个人的奇痒。”呼应这一论调，迈尔以鼓励学生承担自己的个人项目而闻名：“每个人都应该有一个问题。”\n\
  \n## Frankenstein\n\n最后，是软件开发的 `弗肯斯坦模型`。正如你可能猜到的那样，这是基于玛丽·谢莉（Mary Shelly）的作品《弗肯斯坦，或现代普罗米修斯》，这是她\
  \ 1818 年的小说，部分灵感源于她对查尔斯·达尔文的祖父伊拉斯工作的讨论。故事剧情非常简单——一个名叫弗肯斯坦的科学家在大学时代发现自己拥有赋予生命的能力。（也许是在酒吧喝了太多之后典型的大学式觉醒？）弗肯斯坦随后用拼凑的身体部位赋予了一个新生命。书中的这段话让任何开源开发者听起来熟悉吗？\n\
  \n“我努力工作了近两年，唯一目的是为了给无生命的身体注入生命。为此，我剥夺了休息和健康。我以超过过度的渴望追求它；但当我完成时，梦想的美消失了，窒息的恐惧和厌恶充满了我的心。”\n\
  \n弗肯斯坦模型描述了尽管尽管初衷良好，结果有时仍无法达到预期的情况。这些项目对任何人都没有好结果。然而，代码仍然存在着。如果有什么教训可以吸取，科学家弗肯斯坦是这样说的：“平静！平静！学习我的痛苦，不要增加你自己的痛苦。”\n\
  \n未来是无法骗过的；它将变成它的样子。然而，这些不同的模型可能帮助你理解过去，并对未来做出明智的推测。\n\n\n\n\n\n# 第 12 章：移动方向\n\n\
  ## 值得思考的大方向\n\n我们都生活在一个动态的时代，受到全球文化、政治、经济和技术的影响。唯一确定的事情就是我们必须预料意料之外的事。这里是一些值得思考的大方向，你可以确信，移动计算、Linux\
  \ 和 Ubuntu 将会受到一些意料之外的影响。\n\n### 技术的政治\n\n巴拉克·奥巴马总统在竞选期间利用互联网的方式无疑帮助了他赢得了选举。（他在\
  \ Facebook 上有超过 450 万个朋友！）在执政的第一个月里，新政府要求提交一份关于政府内部使用开源软件的报告。正如《纽约时报》所描述的那样，他“几乎对他的黑莓手机上瘾了”。奥巴马是美国历史上以来最精通技术的总统，这必会对政策产生影响。\n\
  \n与此同时，在大洋彼岸，英国的教育系统正在讨论开源软件。根据 BBC 2009 年 1 月 26 日的：\n\n> *既然开源软件（OSS）可以免费获取，并涵盖了国家课程中的几乎每一个要求，人们必须问为什么学校不充分地支持它，这可能会节省数百万英镑。*\n\
  \n> *正如其名称所示，开源软件是社区驱动的软件，其源代码所有人开放。任何人都可以根据自己的需求修改软件，然后将这些修改与其他人共享。*\n\n技术的政治将如何塑造我们的移动未来？政府的决策和政策对开源软件的生产以及\
  \ Ubuntu 的使用产生什么影响？\n\n### 下一个十亿\n\n麻理工学院的媒体实验室有一项名为“下一个十亿网络”（The Next Billion Network）的计划。它提出了一个与移动计算相关的相当惊人的场景：\n\
  \n> *在未来三年内，另一十亿人将开始定期使用手机，继续历史上对新技术最快的采用。很快，这下一个十亿人将发出他们的声音——并连接到全球信息网络。*\n\n`http://nextbillion.mit.edu/`\n\
  \n可以肯定，这将对 Ubuntu、Linux 和移动计算产生影响。\n\n### 感过载\n\nGPS 信息、WiFi/手机定位以及地理感知技术无疑可以帮助移动计算机更具位置感知能力。是否会开发新技术来填补\
  \ GPS 和 WiFi/手机定位的空白？我们将面临哪些隐私问题？\n\n### 云计算\n\n我们正看到云计算扩展到消费者和企业。人们现在经常使用云来存储 Web\
  \ 邮箱。Google 提供了全套在线办公应用程序。Twitter、FriendFeed、Facebook 以及其他社交网络工具在网上维护着敏感的个人数据。\n\
  \n云计算可以消除或减少移动与固定位置计算机系统之间的数据同步和大量文件复制的步骤。这将推动像 MID 等手持移动设备的更快采用吗？网络上有这么多私有数据，是否有必须考虑并整合到软件栈中的新安全措施和标准？\n\
  \n### ARM 摔跤 (ARM Wrestling)\n\n看起来 x86 和 ARM 架构之间正在形成一个战场。双关语似乎无穷无尽，比如“ARM Wrestling（摔跤/手臂比武）”或“给英特尔的一记\
  \ ARM 打”。从长远来看，这对消费者/用户是有利的，并且对行业是健康的。竞争创造创新并加速改进。然而，对英特尔 x86 处理器主导地位的威胁是真实的。根据《纽约时报》2008\
  \ 年 6 月 30 日的：\n\n> *除了高通和 Nvidia 之外，还有超过 200 个 ARM 处理器设计的许可者，包括 Marvell 和德州仪器等主要芯片制造商。他们共同为超过\
  \ 11 亿部手机提供支持，其中许多使用了多个 ARM 芯片。这些芯片还用于不断增长的特殊用途消费电子产品，如 GPS 导航器和电视顶盒。*\n\n那里有很多\
  \ ARM！这里有来自 ARM 维基百科条目的另一个数据：截至 2008 年 1 月，已构建了超过 100 亿个 ARM 核心，iSuppli 预测 2011\
  \ 年将出 50 亿个。\n\n我在基于 ARM 的系统和 Atom 驱动的系统中都安装了 Ubuntu。我喜欢 Atom 的处理能力，但我喜欢 ARM 的低功耗。这将是一个令人兴奋的战斗。\n\
  \n与此同时，一项移动解决方案的重要新技术基础正在开发。例如，Moblin 计划在收到英特尔的初始资金后，获得了硬件和软件公司日益增长的支持。2007 年 4\
  \ 月，英特尔首次在中国的开发者大会上引入了“MID”计算机的概念。2007 年 7 月，英特尔以 Moblin 之名正式启动了一项软件开发计划，并在 `Moblin.org`\
  \ 启动了网站。（Moblin 这个名字是 mobile 和 Linux 的缩写。）\n\n2007 年 10 月，我参加了 Ubuntu 开发者大会，参加了数天的关于移动计算的会议。Canonical\
  \ 员工和英特尔参与者主要主持了这些会议，许多其他开源贡献者也出席了在基于 Ubuntu 发布 Moblin V1 后，英特尔将进一步的探索转向 Fedora\
  \ 发行版。这提供了另一个富有成果的创新和代码来源。英特尔继续推进，并在 2008 年底宣布了 Moblin V2 的发布计划。大约一年后，2008 年 10\
  \ 月 30 日，英特尔发布了一份关于其支持和加速设备制造商计划的新闻稿。英特尔宣布与台湾经济部合作建立 Moblin 实验室，用于硬件的开发、培训和支持。\n\
  \n正如 Ars Technica 当时写道：\n\n> *英特尔正在投入大量资源推动移动 Linux 的采用，并使 Moblin 成为设备制造商的坚实平台。如果\
  \ Moblin 能够解决困扰 Linux 设备制造商的一些问题，并为基于 Atom 的设备提供一个更有凝聚力的平台，这对开源系统来说将是一个巨大的胜利。*\n\
  \n2009 年 1 月，英特尔发布了针对上网电脑的 Moblin V2 Core 的第一个 Alpha 版本。后续版本于 3 月出现。其中一个被广泛讨论的功能是\
  \ `Fastboot`，它能让笔记本电脑快速启动！\n\n在未来，将会有多个处理器平台（例如 `ARM`、`x86`）和几个发行路径（例如 `Ubuntu`、`Moblin`\
  \ 等）竞争开发者的关注。\n\n### 剃刀与刀片\n\n如果微处理器芯片及其包装的价格下降到使其模块化和一次性变得切实际的程度，会发生什么？如果计算机组件足够模块化，它们就可以被定期更换、交换或更新。\n\
  \n与其销售完全全新的电脑（这种交易既不便宜也不环保或节省时间），公司可能会考虑围绕制造的商业模式，以支持模块化的“剃须刀和刀片”市场。例如，一家公司可能会以补贴折扣价卖给你一把设计精美的剃须刀，因为知道你会被锁定购买其品牌的刀片。\n\
  \n电脑打印机和墨水可能会遵循类似的商业模式。为什么微处理器不行呢？\n\n### 免费午餐\n\n根据 `gnu.org`，开源软件的原始原则之一是：“自由软件是一个自由的问题，而不是价格的问题。要理解这个概念，你应该认为自由是指言论的自由，而不是免费啤酒的免费。”\n\
  \n\n\n\n\n在开源的早期，面对商业开发者，“言论自由”是一个更容易成立的论点，因为这些开发者在讨论“免费啤酒”时往往会变得神经过敏。然而，现在“免费啤酒”可能是一个更具吸引力的论点。全球经济正迫使人们所做的每件事都要考虑成本。\n\
  \n鉴于现在存在海量的开源软件，你有更大的可能发现你所有的那个确切“痒点”已经被另一位非常有才华的开发者“解决”了！\n\n因此，开源的自由仍然由于更改/维护底层代码的需求而变得必要，但从免费价格中获益的紧迫性也提高了。\n\
  \n### 边缘计算\n\n今天，网络连接点比以往任何时候都多。这些连接可能很近，也可能很远。连接地球的各个角落为有意义的全球对话创造了巨大的机会。随着笔记本电脑、智能手机和其他生活在“边缘”的高度移动设备的接入，网络增长可能会出现爆炸式增长。与此同时，我们将看到任何设备可以随机建立的\
  \ 2.4G 连接数量大幅增加。随着这种计算的部署变得更加廉价、更加强大，与本地及远端计算机的连接将飙升。\n\n这里是一个创新性新产品的示例，它可以重新定义边缘在哪里。2009\
  \ 年 3 月，Marvell 推出了如图 12-4 所示的 SheevaPlug —— 这是一个售价 99 美元、符合 ARM 标准的小型强大设备，并带有开发者工具包。通过这款产品，Marvell\
  \ 可以吸引爱好者和开发者的兴趣，同时鼓励可能在未来驱动 Marvell 嵌入式处理器和无线芯片需求的创新应用。SheevaPlug 使用标准插座运行频率为 1.2GHz，配备\
  \ 512MB Flash、512MB DDR2、USB 2.0 和千兆以太网。所有这些都装在一个大约钱包大小的包装里（虽然比我的要厚一点！）整个包装的功耗低于\
  \ 5 瓦，支持 Ubuntu，并提供开发者工具包。它非常容易移动和重新利用。\n\n图 12-4\n\n最初，SheevaPlug 设计用于媒体服务器和备份机等应用，这两者都可以接入云计算。\n\
  \n通过 SheevaPlug，Marvell 正在采取开源方法——将其设计开源开源，并鼓励在 `http://plugcomputer.org` 等网站上开展开发活动。第三方开发者已经将这些设计整合到他们自己的产品和系统中，例如\
  \ `http://pogoplug.com`。\n\n### 未来\n\n根据 2008 年 12 月的皮 ew 中心网络与美国生活研究，“超过四分之三的专家受访者（77%）同意……移动计算设备——在\
  \ 2020 年拥有更强大的计算能力——将成为大多数人主要的互联网通信平台。”这个预测对你来说真实吗？\n\n我对朋友和大学生进行了非正式调查，了解他们对 Linux\
  \ 未来的看法。根据 2008 年 12 月的皮 ew 中心……研究，“超过四分之三的专家受访者（77%）同意……移动计算设备——在 2020 年拥有更强大的计算能力——将成为大多数人主要的互联网通信平台。”\
  \ 这种预测在 Mac 上是成立的。\n\n我们很快发现 Linux 面临着更广泛采用的障碍。一个朋友说：“虽然选择是好事，但太多会让人困惑。”这 也是一个在经济学中使用的术语，指的是在特定区域聚集的趋势。这就是为什么事情在\
  \ Mac 上能够强大。这在 Windows 上是发生的，在 Linux 上是开始。\n\n另一个障碍是分发版本的过多（选择是好事，但太多会让人困惑）：\n\n\
  “对于 Linux，选项太多了！我曾以为……（SUSE, Ubuntu, Red Hat, Debian, Gentoo, Knoppix，等等。生命太短了）。”\n\
  \n一个长期使用 Windows 的朋友知道：“是的，当然，OS X 使用 BSD 内核。但它不是 Linux。它是 OS X。”\n\n“你可以在 Linux\
  \ 上运行 Mac 软件吗？不。为什么？因为它不是 Linux。Mac 软件是强大生态系统的一部分吗？是的。Linux 可以利用这个强大的生态系统吗？不。”\n\
  \n*我在 Touch 上没有使用 UNIX。我使用的是 OS X。它是 UNIX 的衍生品，但不是 Linux 或 UNIX。我大学的一位朋友有一辆 Avanti。这是一辆拥有\
  \ Corvette 发动机的纤维玻璃车身。它是 Corvette 吗？*\n\n*不，那是 Avanti。*\n\n我们可以为未来带来许多教训：\n\n对于那些采用\
  \ Linux 的学生，这四个原因的各种组合解释了为什么：\n\n1. 免费，指自由（修改/贡献的能力）\n2. 免费，指免费午餐（省钱）\n3. 力量/功能（包括定制和开发）\n\
  4. 可靠性/安全等等\n\n曾经，伟大的创新可能来自企业智库，例如 Xerox PARC（Mac 用户界面），但今天这些想法更多来自大学校园。考虑这些源自校园的成功案例：Netscape、Google、Microsoft\
  \ 和 Linux。Slackware 是仍在活跃开发的最古发行版，由 Patrick Volkerding 创建。校园里发生的事情将决定未来的市场。我在 MIT\
  \ 处询问以了解学生如何使用移动技术。尽管 WiFi 对所有学生都是免费的，而且每个人都有带 WiFi 的笔记本电脑，一位学生估计 40% 的学生还拥有流量手机：*\
  \ 校园里有很多 iPhone 使用者。短信、电子邮件和通话，可能是这个顺序。音乐和媒体，我认为这里的人技术水平足够，他们可能用这些设备处理所有这些内容。*\n\
  \n\n\n\n\n移动计算软件的下一个重大突破很有可能来自大学校园。像 Google 之夏代码计划（Summer of Code）这样的项目鼓励了这种趋势。但这仍然需要一位特殊的学生（比如\
  \ Torvalds）来将其变为现实。\n\n如果你奶奶说她想要一个按钮大大的手机，你最好为她买一个！\n\n如果目标是让人们把事情办成，那么恰当的技术就是最佳答案。\n\
  \nLinux、Ubuntu 以及相关发行版只有在易于使用且适用于各种使用场景的情况下，才能在移动设备上实现大规模的成功。\n\n### Ubuntu、Linux\
  \ 与移动计算\n\nUbuntu Mobile 将如何演进？一位对此有深刻见解的专家是 Mark Shuttleworth。他曾在 2008 年 8 月在阿根廷的\
  \ Argentina Debconf8 会议上分享了他对这一主题的看法。当时就职于 Sun 公司的 Barton George 进行的录音采访提供了许多见解。\n\
  \n对于笔记本电脑（netbooks），Shuttleworth 认为其成功部分在于其使用方式：“（笔记本电脑）的使用场景包含了一个隐含的假设，即你不会尝试用人们传统使用\
  \ PC 的所有方式来使用它。这让（人们）更愿意考虑替代方案 . . . 所以这对 Linux 社区来说是一个非常令人兴奋的发展 . . . 人们真正购买一台没有\
  \ Windows 但能很好地提供 Linux 功能的机器 . . . 卓越的网络体验、良好的安全性、高效的性能、轻量级的硬件以及极佳的性价比。”\n\n# 第\
  \ 12 章：移动方向\n\nShuttleworth 还分享了他对移动行业去向的看法：“我认为移动领域对 Linux 具有巨大的生产力。我们已经看到像摩托罗拉这样的公司称其\
  \ 60% 的设备市场份额给了 Linux . . . 在发行版层面和应用栈框架层面，情况要变得模糊得多。”\n\n“我们在 Intel 的 Moblin 计划方面与其保持着高度一致，因为他们已经证明了他们愿意参与的。我认为关键在于如何将运营商、手机制造商和芯片制造商聚集在一起。我非常希望\
  \ Moblin 能实现这一点。”\n\n“在这个阶段，我不认为任何人都已经明确获得了关键的临界规模。平台与供应商之间仍然存在某种程度的绑定关系。在 Moblin\
  \ 的案例中，它与 Intel 强对齐。我认为看到更广泛的采用将是非常健康的。你还有 Google 的 Android。他们要取得成功，需要展示出广泛的参与度。LIMO\
  \ 与摩托罗拉强对齐，但它日益成为一个开放的环境。”\n\n“我寻找的是芯片制造商、手机制造商和运营商之间对于他们希望这台设备（移动设备）如何运作达成的一种新兴共识。”\n\
  \n“开源或自由软件确实是聚集这个特别松散的行业的正确方式。我非常希望 Linux 会表现良好，但具体将如何发展我不确定。”\n\nLinus Torvalds\
  \ 曾有过如下观察：\n\n“做一个发行版是一项艰巨的工作。之所以有数百个发行版是因为很容易启动自己的，但如果你想成为领导者并引入新代码，其中涉及的测试和问答是巨大的。这取决于是否有足够的用户来获得覆盖，期望有太多的大型发行版是不现实的。Ubuntu\
  \ 的增长速度惊人，也许这种情况可以再次发生。你对 Ubuntu、Linux 和移动技术的实践知识将成为你可以随身携带的持久经验，无论这种变化如何发生。随着 PC\
  \ 尺寸的缩小，它正与多功能手机发生碰撞。许多人预计其产生的影响将改变两种设备以及制造它们的所有公司。新的智能手机——这种始终在线的便携式设备，既是手机又是电脑——改变了计算领域的游戏规则，因为计算速度（Intel\
  \ 擅长的领域）不再是最重要的因素。对于依赖小电池的手机来说，芯片使用电能效率变得更重要 . . . . 手机的销量大约是 PC 的五倍。”\n\n## 总结\n\
  \n一个好的建议是“预料意料之外的事。”2007 年和 2008 年，硬件和软件领域出现了大量令人兴奋（且大多是意料之外）的发展。这引起了市场对小型、强大、移动计算设备的巨大需求。这种爆发式的发展与需求的结合使得尽管在经济困难时期也创造了记录营收。对“专业\
  \ Ubuntu Mobile 开发”的需求在未来多年内将继续增长。\n\n# 第 13 章：常见问题与可能的解决方案\n\n本章尝试收集 ubuntu-mobile\
  \ 邮件列表发布的几个常见问题，以及互联网上提供的解决方案。\n\n## 启动过程停止\n\n**问：** 我下载了 Ubuntu，提取了镜像，并准备了一个 USB\
  \ 盘。启动后，我按下回车键启动，启动过程停止了。\n\n**答：** 这可能是由向 USB 盘写入不当引起的。要将镜像拷贝到 USB 盘（假设设备为 `/dev/sdb`），请使用以下命令：\n\
  \n```\nsudo dd bs=1024 if=image of=/dev/sdb\n```\n`dd` 是一个用于底层拷贝和转换原始数据的程序。将镜像写入\
  \ USB 盘就像在棋盘上填满格格。（请注意下文说明）\n\n### 应用程序图标未显示\n\n**问：** 我的应用程序图标没有显示在桌面上。\n\n**答：**\
  \ 要让图标出现在桌面上，请按照以下步骤操作：\n1. 将 `.desktop` 文件安装到 `/usr/share/applications`。\n2. 将图标安装到\
  \ `/usr/share/icons/hicolor/<size>/<type>/`（例如 `/usr/share/icons/hicolor/64x64/apps/myapp`）。\n\
  \n如果步骤 1 执行得正确，应用程序应该会在 UI 中显示。如果步骤 1 和 2 均都完成了，它也将拥有正确的图标。如果图标仍然未显示，尝试在桌面文件中添加：`OnlyShowIn=GNOME;Mobile;`，图标就会出现在桌面上。\n\
  \n例如，cheese 没有 `OnlyShowIn`，但在 Hildon 桌面中显示。\n*Hildon 桌面是移动设备 Hildon 应用程序框架的主要 UI\
  \ 组件。*\n\n其他程序也没有 `OnlyShowIn` 但没有显示。对于 Ubuntu Mobile 有一个特殊的实现：\n\n`/onlyshowin_ignore`\
  \ 始终显示这些程序，即使它们没有 `OnlyShowIn`。\n\n例如，cheese 就在列表中，并且始终被显示。\n\n显然，当每个应用程序都是良好的公民并符合\
  \ freedesktop.org 标准时，这个键应该消失了。\n\n\n\n\n\n# 第 13 章：常见问题与可能的解决方案\n\n此外，在 `desktop-file-utils`\
  \ 包中处理 `.desktop` 文件时可以使用一些实用工具。它们是：\n\n* `update-desktop-database` — 更新桌面 - MIME\
  \ 映射。\n* `desktop-file-validate` — 验证桌面文件。\n* `desktop-file-install` — 安装桌面文件。\n\
  \n你可以像这样使用它们：\n\n```bash\n$ desktop-file-validate hello-world.desktop\n```\n\n##\
  \ 执行双启动\n\n**Q：** 是否可以在 Windows Mobile 设备上双启动运行 Ubuntu Netbook Remix？\n\n**A：**\
  \ 这很大程度上取决于设备硬件。现有相当数量型号支持某种形式的备启动，可以直接从某些物理设备启动，或者通过一个应用程序将当前运行的操作系统替换为来自物理设备或选定文件的。\n\
  \nUbuntu Mobile 支持的大多数现有设备属于第一类，允许从备物理设备启动（最常见的是 USB 密钥，如测试时使用的那）。\n\n如果硬件足够，支持双启动是完全可能的。许多设备针对的是低成本市场，为了满足这一需求，它们集成了一个小型\
  \ SSD 用于数据存储（4 – 16GB）。像华硕 Eee PC 这样的系统能够运行 Windows 和 Linux，但由于空间限制无法从同一驱动器运行。可以将\
  \ Linux 安装在 USB 驱动器上并通过 USB “Live” 运行，并使用 SSD 用于 XP。\n\n一个实用的应用程序是 GNU Haret，你可以在\
  \ http://handhelds.org/~~koconnor/haret/ 或 http://handhelds.org/moin/moin.cgi/HaRET\
  \ 找到它。\n\n## 自动设置标记\n\n**Q：** 是否有一种设置 `configure.ac`，使得在为 LPIA 架构构建时自动设置 `USE_HILDON`\
  \ 标记？\n\n**A：** 可以在 `debian/rules` 中添加以下规则：\n\n```bash\nifeq ($(DEB_BUILD_ARCH),\
  \ lpia):\n  DEB_CONFIGURE_EXTRA_FLAGS = --enable-hildon\nendif\n```\n\n这会导致在为 LPIA\
  \ 架构上构建时，带有额外的 `--enable-hildon` 参数调用 configure。\n\n也可以在 `configure.ac` 或 `configure.in`\
  \ 中按如下所示添加：\n\n```bash\nhildon=false\nHILDON_CFLAGS=\"\"\nHILDON_LIBS=\"\"\nAC_ARG_ENABLE(hildon,AS_HELP_STRING([--enable-hildon],[Turn\
  \ on hildon support]),[\n  if test “x$enableval” = “xyes”; then\n    hildon=true\n\
  \    PKG_CHECK_MODULES(HILDON,[hildon-1], HAVE_HILDON=yes,HAVE_HILDON=no)\n    HILDON_CFLAGS=\"\
  $HILDON_CFLAGS -DWITH_HILDON=1\"\n    PACKAGE_CFLAGS=\"$PACKAGE_CFLAGS $HILDON_CFLAGS\"\
  \n    PACKAGE_LIBS=\"$PACKAGE_LIBS $HILDON_LIBS\"\n  fi\n])\n```\n\n这将启用一个 `HAVE_HILDON`\
  \ 标记，你可以在构建时测试以启用或禁用针对 LPIA 架构的更改。\n\n## 使用 USB\n\n**Q：** 我使用 Windows Vista，想准备一个\
  \ USB 闪盘在我的三星 Q1 Ultra 上安装 `ubuntu-mobile.img`。最好的方法是什么？\n\n**A：** 这种方法是使用 Windows\
  \ 版的 `dd`，可以在 http://uranus.it.swin.edu.au/~jn/linux/rawwrite/dd-old.htm 获取。\n\n\
  ## 在 Freerner 上运行 Ubuntu\n\n**Q：** Ubuntu MID 有可能运行在像 Neo Freerunner 这样的设备上吗？Freerunner\
  \ 已经有了 Debian 端口，所以可能吗？\n\n**A：** 没有什么可以阻止这一点，但目前 Ubuntu Mobile 团队的目标并不是支持手机：Ubuntu\
  \ MID 关于的是“MIDS”，主要是关于互联网体验。然而，某些最近的 MIDS 正在获得 SIM 卡和手机功能。\n\n## 在 Arima 上运行 Ubuntu\n\
  \n**Q：** 作为一个问题，让 Ubuntu MID 运行在例如 Arima UM650 上有什么困难？Ubuntu Mobile 硬件是特定的吗？\n\n\
  **A：** 带有 Jaunty 版本的 Ubuntu Mobile 支持 Arima。让 Ubuntu Mobile 在其他硬件上运行只需让正确的内核正常工作即可。`linux-lpiacompat`\
  \ 内核应该可以在 i586+ 机器上运行。例如，C7-M 是测试有限的处理器之一，但因为它被部署在大量设备中，所以具有一定的关注价值。\n\n## Ubuntu\
  \ Intpid UMPC 项目\n\n**Q：** 我在 10 英寸平板电脑上尝试了 Ubuntu Intrepid UMPC 镜像，我很喜欢它。但是，我似乎找不到关于该项目的官方文档，所以我想知道该项目仍在进行吗？\n\
  \n**A：** 在最初的兴奋之后，很少有人实际上向 `9.04` 目标提交更改。这会导致 `ubuntu-mobile` 设置。\n\n## 在 UMPC 上安装\
  \ Ubuntu Netbook Remix\n\n**Q：** 我刚买了一个叫做 UMPC 的设备，可以安装 Netbook Remix 吗？\n\n**A：**\
  \ 可以，可以安装并且运行良好。它有助于 `ubuntu-mobile` 设置。\n\n## 使用 apt\n\n**Q：** 我尝试使用 apt 安装一个包，但收到消息说不可。\n\
  \n**A：** 尝试更改你的 apt 源。有时它们会变得不同步，运行 `apt-update` 可以解决这个问题。\n\n## 加入 Ubuntu 开发者团队\n\
  \n**Q：** 如何加入 Ubuntu 团队？\n\n**A：** 如果你需要 Ubuntu 存储库的写入权限，请在 launchpad.net 加入 Ubuntu\
  \ Mobile and Embedded 开发者团队。这是一个审核小组。然而，对团队做出贡献应该足以让你被接受。\n\n## 使用 KVM 或 QEMU\n\n\
  **Q：** 我无法让 KVM 或 QEMU 工作。我该怎么办？\n\n**A：** 如果这种情况发生在你身上，请确保已安装了 KVM 和 QEMU 软件包。接下来，从\
  \ http://cdimage.ubuntu.com/mobile/releases/hardy/mid-8.04.1-kvm.tar.gz 下载旧版本的 hardy\
  \ 版 MID。\n\n此包包含了名为 `root.qcow2` 的虚拟机镜像（qcow2 是 QEMU 磁盘镜像格式）和一个名为 `ubuntu.kvm` 的启动脚本：\n\
  \n```bash\n#!/bin/sh\nkvm -soundhw all -m 128 -hda root.qcow2 \"$@\"\n```\n\n解压下载的包：\n\
  \n```bash\n$ tar -xzvf mid-8.04.1-kvm.tar.gz\n```\n\n进入新目录并执行脚本：\n\n```bash\n$ cd\
  \ mid-8.04-kvm\n$ sudo ./ubuntu.kvm\n```\n\n## 图形损坏\n\n**Q：** 当我在设备上安装时，我看到状态栏且安装看起来正常，但当桌面应该出现时，看起来就像设备崩溃了——我看到的全是图形损坏。\n\
  \n**A：** 以安全图形模式启动 Ubuntu。这将在使用 Vesa 图形驱动程序启动 Ubuntu，该程序兼容过去十年内制造的几乎所有显卡。\n\n\n\n\
  \n\n**Q:** 我在 Eee PC 上安装了 Ubuntu Netbook Remix，性能非常糟糕。我安装了默认的 Ubuntu Jaunty 进行测试，性能有了许多提高。\n\
  \n**A:** 这是由于视频驱动程序的漏洞导致的，这意味着默认没有启用平铺窗口（对于 Ubuntu Netbook Remix 来说这是关重要的，因为启动器是基于\
  \ GL 的）。修复已经完成，可以在 http://people.ubuntu.com/~apw/lp349314-jaunty/ 找到。\n\n需要安装的文件为\
  \ `linux - headers - 2.6.28 - 11 - generic_2.6.28 - 11.43~lp349314apw5_i386.deb`\
  \ 和 `linux - image - 2.6.28 - 11 - generic_2.6.28 - 11.43~lp349314apw5_i386.deb`。将它们都下载到一个文件夹中并运行以下命令进行安装：\n\
  \n```bash\nsudo dpkg -i *.deb\n```\n\n*在本书出版时，这些信息可能已经过时。请在邮件列表中查看最新详情。*\n\n## 总结\n\
  \n这些是与 Ubuntu Mobile 相关的常见问题和疑问，经常出现在 IRC 频道和邮件列表中。如果你有任何问题，可以在 `irc.freenode.net`\
  \ 的 `#ubuntu - mobile` 频道提问，或向邮件列表发送电子邮件。\n\n# Ubuntu 的 Right ARM\n\n既然 Ubuntu 已经针对\
  \ ARM（高级 RISC ）平台发布，出现了许多有趣的新应用可能性。在能效计算领域出现了一整类此类解决方案。\n\n一个例子是 SheevaPlug。2009\
  \ 年 2 月，Marvell 推出了一种基于其 ARM 处理器的新设备，名为 SheevaPlug。Marvell 为“插拔设备”提供了一个开放的架构蓝图，这让人联起早期基于标准的组件设计，这些设计为\
  \ PC 行业奠定了基础。Marvell 技术与产品愿景的结合普及了一个全新的细分市场：插拔式计算（plug computing）（访问 http://plugcomputer.org/\
  \ 了解更多详情。）\n\n《华尔街日报》在 2009 年 2 月 23 日发表的一篇文章报道了这一新产品和新市场的发布。报道暗示了一个新的微型行业：\n\n\
  *“我们认为这里有我们可以解决的多个痛点，”Marvell 副总裁兼企业业务部总经理 Simon Milner 说道。*\n\n*一个大问题是消费者日益增加数字照片、音乐和视频——这些越来越多地存储在可能丢失或被盗的笔记本电脑上。公司已经在销售保护此类信息的设备，包括结合磁盘驱动和网络功能的设备。*\n\
  \n*Marvell 表示，它认为插拔式计算机可以让这些产品更有用，某些公司在 1 月的消费电子产品展上首次讨论过这一概念，但并未透露 Marvell 的参与。设备通过以太网线连接家庭路由器，并使用广泛使用的\
  \ USB 技术连接存储设备。*\n\n《华尔街日报》注意到了其节能潜力——与耗电的替代品相比，SheevaPlug 的功耗不到 5 瓦。此外，《华尔街日报》提到某些型号最终价格可能为\
  \ 49 美元。\n\n## 录 A：Ubuntu 的 Right ARM\n\nEnderle Group 首席分析师兼总裁 Rob Enderle 描述了这一事件的意义：“插拔式计算是本十年市场上最具革命性的技术之一。它代表了一个未来，即处理能力是廉价且高效的，开创了一个你无需担心计算的时代，因为它可以完美运行。”\n\
  \n### 我愿意用我的右臂换一个 SheevaPlug\n\n我是少数几个在最初公告后很快拿到 SheevaPlug 的幸运儿之一。在第一周内，它们就售罄了，且处于处于订购状态。初始需求远超\
  \ Marvell 的预期。这是该细分市场“有前景”的明确信号之一。以下是你使用初始 99 美元开发者套件时收到（以及没有收到）的内容：\n\n* Marvell\
  \ Sheeva ARM CPU，主频 1.2 GHz\n* 512MB DDR2 @ 400 MHz\n* 512MB NAND Flash（直接从 Flash\
  \ 启动）\n* 千兆以太网/RJ45\n* USB 2.0（直接从 USB 启动）\n* SDIO\n* JTAG/UART 串口\n* 无风扇。无驱动器。无噪音。\n\
  * 优雅的包装/内置 AC 电源\n* 预装 Ubuntu\n* 无许可费用（“开放”参考设计）\n* 不支持图形/VGA\n* 无内置 WiFi\n\n功耗取决于运行的任务，但从下面的功耗分析可以看出，它不会超过\
  \ 7 瓦：\n\n* 当 cpuidle 处于 C1 时，2.5W\n* 当 cpuidle 处于 C0 时，3.0W\n* 千兆网络空闲时为 3.3W\n\
  * 千兆+USB 空闲时为 5.0W\n* CPU 100% 负载时为 7.0W\n\n### 应用想法\n\n我对 SheevaPlug 的最初目标包括几个高效的、24/7\
  \ 运行的应用：备份服务器、媒体服务器以及家庭自动化。在软件方面，我期待使用我们熟悉的工具：Python、Django、网络数据库以及功能完备的仓库。\n\n\
  对于熟悉 Linux 的人来说，SheevaPlug 证明非常易于操作。虽然没有图形或 VGA 支持，但很容易 SSH 登录设备或通过 JTAG 串口连接对其进行管理。Monitors\
  \ 正在出可以通过 USB 连接的 7 英寸屏幕。其 USB 转 LCD 控制器使其在不需要 VGA 支持的情况下显示视觉内容。关键技术最近已开源，Ubuntu\
  \ 的支持也是可能的。\n\n在实验 SheevaPlug 的最初几天里，我能够连接无线 USB 802.11g 无线器（来自 Edimax）。将 USB 摄像头连接到\
  \ SheevaPlug 上也取得了同样的成功。不知不觉间，我已经拥有了由 SheevaPlug 驱动的家庭控制/监控系统的所有核心要素。当我发现可以轻松地在\
  \ SheevaPlug 上运行简单的 OpenCV 时，我既兴奋又感到有些惊讶。\n\n### 可移动设备 (Relocatables)\n\nOpenCV（开源计算机视觉）是一个编程函数库，主要面向实时计算机视觉。\n\
  \n尽管 OpenCV 已经开源很长时间，但它的网站并未声称支持 ARM 平台。让 OpenCV 与 Python 工作需要几十个依赖项。此外，图形处理通常对浮点硬件有沉巨的依赖（此版本的\
  \ SheevaPlug 缺少浮点硬件）。即使是这些在 ARM 上运行 Ubuntu 的早期阶段也证明是富有成效的：OpenCV 在 SheevaPlug 上运行良好。\n\
  \n另一个感兴趣的应用领域是在我称之为“可移动设备”（Relocatables）的市场细分——作为“可移动计算”（Relocatable Computing）的缩写。可移动设备的精髓在于你可以以最少的设置在地点之间轻松移动你的计算机基础设施。\n\
  \n如果你的网络需要移动，例如覆盖户外体育赛事或灾难恢复现场，可移动设备将非常有用。在任何网络基础设施面临损坏或销毁风险的地方，可移动设备可能是一个实用的解决方案。\n\
  \n\n\n\n这种现象的一个简单例子是市政 WiFi，在那种情况下，无线设备可能需要为了支持社区活动而进行移动。事实证明，“市政 WiFi”最困难的问题之一是找到运行即使是低功耗无线电台和计算机所需的电力。通常，建筑所有者会提供屋顶空间来放置天线，但没有电力。因此，我们转向太阳能作为一种提供电力的可行解决方案。`SheevaPlug`\
  \ 的功耗很低，现在完全可以通过太阳能供电的范围。\n\n结果，挑战在于将其更上一层。于是，我们提出了一个挑战目标：将一组 `SheevaPlugs` 组建成一台太阳能驱动的超级计算机。这就是后来为人知的\
  \ `SWARM`。\n\n### SWARM 有什么热门？\n\n`SWARM` 是一个缩写，代表：\n\n- S — Sheeva/太阳能供电\n- W —\
  \ 有线/无线/瓦特 - 友好型/Web - 服务器\n- A — 高级/应用\n- R — 运行/竞赛\n- M — Memcached/机器\n\n我的目标是在\
  \ 2009 年 6 月 17 日集齐所需的部件并组装出一台 `SWARM`，庆祝波士顿 Linux 用户小组（BLU）成立十五周年。正如你从下面的照片所示（这些照片回顾了我们构建\
  \ `SWARM` 的亮点），一切都按计划运行。\n\n#### 附录 A：Ubuntu 的右手臂 ARM\n\nMarvell 慷慨捐捐了十个 `SheevaPlugs`\
  \ 来支持这个早期开源创新项目。我们为 `SWARM` 设计的原始硬件灵感来自战斗口号：“堆叠它们，不要架设它们！”（见图 A - 2。）\n\n2009 年\
  \ 6 月 16 日，我们花了一天时间配置和测试了十几个 `SheevaPlugs`。我们安装了最新版本的 `Ubuntu` 操作系统。来自 Marvell 的\
  \ Linux 和 `SheevaPlug` 专家 Rabeeh Khoury 提供了他的专业知识和帮助。（Rabeeh 是 `SheevaPlug` 安装程序的作者。他帮助配置了\
  \ `SheevaPlugs`，使 `Linux` 内核存储在 `NAND Flash` 上，而 `Ubuntu` 系统的其他部分安装在快速的 8GB `SDIO`\
  \ 卡上。）我们最初的配置横向多于垂直，设备呈简单的表格布局，如图 A - 3 所示。\n\n为了对每个插头进行单元测试，我们运行了基础的 `Ubuntu` 软件（例如\
  \ `Python`）。然后，我们安装了各种额外的 `Ubuntu` 软件包（如 `OpenCV` 和 `MEMCACHED`）。我们计划使用 `MEMCACHED`\
  \ 构建一个超级 Web 集群。有大量的 Web 服务器每天 24 小时运行，消耗着大量的电力。类似于 `SheevaPlug` 的设备或像 `SWARM` 这样的集群在提供可接受的\
  \ Web 服务器性能的同时，可能会节省大量的能量。\n\n我们最初使用两个千兆比特交换机将我们的 `SheevaPlugs` 连接在一起。（`D-Link DGS-2208\
  \ 10/100/1000 Mbps 8 口桌面绿色以太网交换机`在电耗消耗方面非常智能——当端口空闲时它会降低功耗，从而节省电力并减少热量。）我们之后还会扩展到更大的交换机。\n\
  \n### 一场太阳能驱动的“盖房活动”\n\n来自麻省理工学院（MIT）的研究生 Kurt 是太阳能、市政无线和集群计算领域的专家，他为这个项目提供了灵感。正如他曾经观察到的，“数量多的廉价胜过少数的优良。”在他的帮助下，我们评估了\
  \ `FAWN`（“快速弱节点阵列”）中的一些想法，并考虑了许多其他节能平台（如 `OpenWRT` 和来自 Netgear 的 `WGT-634U`）。\n\n\
  然后，我们需要弄清楚如何构建它——毕竟，一个集群需要许多技术技能。我们转向历史来寻找一种组织模型。\n\n在 18 世纪和 19 世纪的北美，社区成员聚在一起建造房屋（Barn\
  \ Raising）。这种协作模式为构建 `SWARM` 提供了组织模型。\n\n社区成员聚在一起建造房屋，这种“盖房活动”需要计划、准备和各种技能，但靠一个人完成实在太慢了。这种“盖房活动”通常是以一种紧迫感来执行——我们以这种“盖房活动”的方式来构建\
  \ `SWARM`。\n\n我们在 BLU 会议上提前通知，并将日期定在 6 月 17 日。我带了一满了现成的 `SheevaPlugs`。\n\n2009 年\
  \ 6 月 17 日下午 1:30，大约有十人在 MIT 大楼旁集合。BLU 小组的长期领导 Jerry Feldman 与 John Abreau 一起集结了这些资源，如图\
  \ A - 4 所示。\n\n在阳光下，我们展示了构建 `SWARM` 的这种“盖房活动”，如图 A - 5 所示。\n\nSage Radachowsky 带来了他的太阳能电池板、充电控制器、蓄电池和钳子。在一个小时内，他完成了所有接线，提供了足够的太阳能让我们的十个\
  \ `SheevaPlugs` 和耗电巨大的交换机正常运行。\n\n波士顿 Linux 用户小组的成员 Bill Bogstad 负责使用千兆交换机将 `SheevaPlugs`\
  \ 联网。团队确保了 `WAAV`（装在标准背包里，天线伸出来）正在工作。这个无线/蜂窝适配器迅速投入运行，接入千兆交换机，并作为 `DHCP` 服务器为每个\
  \ `SheevaPlugs` 提供网络地址（见图 A - 6）。\n\nDave 带着一台运行 `Ubuntu` 的 `Acer Aspire` 笔记本电脑进入\
  \ MIT 调试 `SWARM`（见图 A - 7）。\n\n很快 Dave 就登录了，并在运行性能测试的同时管理 `SWARM`。他所有的系统管理都是通过一台廉价的\
  \ `Acer Aspire` 笔记本电脑无线完成的。\n\n令人惊讶的是，`SWARM` 在没有网络或电源线的情况下连接到了世界。集体的“盖房活动”团队在约三小时内让\
  \ `SWARM` 运转起来，并将其连接到互联网和 MIT 内部网络。图 A-8 显示了 `SWARM` 在电气和逻辑上是如何启动的。\n\n### 我们学到了什么？\n\
  \n\n\n每个人都看到了演示并提了许多问题。（你可以用 USB 供电运行吗？）Bill Bogstad 在那天下午组装 `SWARM` 时发挥了关键作用，并且晚上全程听了我们完成的演示。他同意分享他所获得的教训：\n\
  \n- 低功耗基于 Linux 的计算机设备真的可以处理数据（很可能还可以进行计算）！\n- 低功耗*真的*意味着低功耗（对于一个*集群*来说小于 100 瓦）！\n\
  - 意味着，低端集群计算可以完成实际工作。\n\n通过这次会议，我们展示了在“可移动”场景下低功耗 ARM 计算的潜力。\n\n`Ubuntu` 的通用性——无论是巨大的软件库还是对平台的全面覆盖——凸显了该平台对于开发者和终端用户是多么有价值。`Ubuntu`\
  \ 是一个在技术前沿进行实验、探索和开展真实工作的卓越平台。随着 ARM 版本的发布，高效计算已经到来。一个全新的解决方案领域是即插用计算，另一个值得考虑的领域是“可移动设备”。\n\
  \n# 附录 A：Ubuntu 最适合 ARM\n\n几位与会者（其中一些人帮助构建了 `SWARM`，另一些人参与了讨论——即*建设者*和*拓荒者*）聚在一起拍了照，如图\
  \ A-10 所示。\n\n我已经与 `Ubuntu` 和 `ARM` 工作了大约个月了。对我来说，很清楚，性能、易用性和兼容性的结合使得 `Ubuntu` 非常适合\
  \ ARM。\n\n## 附录 B：Git 使用\n\n`Git` 是一个分布式 SCM（源代码管理）系统，由 Linus Torvalds 在 2005 年编写，用于跟踪\
  \ Linux 内核的发展。从那时起，它由全球一个较大的黑客群体一直在开发。\n\n`git` 设计用于用于分布式环境，非常适合在开发者小组中共享工作，无论小组的规模或地理位置如何。它针对将其他开发者的代码合并到你的仓库中进行了优化。为了让你尽可能快理解\
  \ `git`，我们根据可能使用的项目类型组织了本附录。在每个部分中都使用了基础 `git` 命令，这些命令对于开发者在项目中发挥作用是必要的。\n\n首先，使用了\
  \ `git` 的基础仓库命令——`clone`、`init`、`fsck` 和 `gc`，然后展示了作为独立开发者在独立项目中与 `git` 协作时所需的命令。最后，通过不同的角色（贡献者、维护者和集成器）演示了对多人员项目有用的命令。\n\
  \n## Git 如何工作\n\n`Git` 使用三种不同的对象来描述整个项目：`blob`、`tree` 和 `changeset`。这些对象中的每一个都用于不同的用途，但都参与了跟踪你项目中的内容修改。\n\
  \n### Blob 对象\n\n`blob` 对象只是一个二进制数据块，不引用任何内容。在 `blob` 对象中进行的唯一数据验证是根据其 `SHA1` 哈希值进行索引，除外，它没有其他属性——没有名称关联，没有权限。它是一个纯粹的数据块，可以翻译为*文件内容*。\n\
  \n### Tree 对象\n\n`tree` 对象由一个按名称排序的权限、名称和 blob 数据列表定义。这意味着两个相同但独立的 tree 对象将共享（或指向）相同的\
  \ blobs。这在 `git` 中为你提供了一个非常有趣的功能，用于跟踪文件重命名。无论如何，我们并不真的弄乱数据，只是通过不同的路径——或者不同的 tree\
  \ 对象指向它。\n\n### Changeset 对象\n\n`changeset` 对象向 `git` 仓库引入了历史的概念。它不仅给了你树的物理状态，还描述了你为什么以及如何到达那个特定状态。一个\
  \ `changeset` 由它产生的 `tree`、将源代码带到该点的（零或多个）父级 `changesets` 以及对所发生情况的可读注释定义。\n\n###\
  \ Git 对象如何相互关联\n\n如果你理解这三类对象是如何相互关联的，理解 `git` 就简单。\n\n## 基础仓库命令\n\n在实际开始使用 `git`\
  \ 之前，你需要一个仓库来工作。如果你正在启动一个独立项目，你将初始化一个空仓库并在开发过程中向其添加源代码；另一方面，如果你正在一个已有的仓库上工作，你需要\
  \ `clone` 映射以获得一个可以工作的本地副本。此外，保持仓库整洁且无错误是非常重要的，这样你在工作时就不会丢失数据。本节的最后两个命令对于清理你的 `git`\
  \ 仓库很有用。\n\n### 创建新仓库\n\n如果你想从零开始一个新项目，你可以使用 `git` 命令 `init`。该命令会在你所在的目录中创建一个 `.git`\
  \ 目录。这将是一个项目的开始。\n\n```bash\n$ mkdir -p projects/my_first_project\n$ cd projects/my_first_project\n\
  $ git init\n```\n`Initialized empty Git repository in /home/user/projects/my_first_project/.git/`\n\
  \n如果你查看 `.git` 目录，你会看到 `git` 用于实际跟踪你项目内容的一系列目录和文件。是的，没错，`git` 只跟踪内容，不跟踪文件。这意味着当你移动或重命名文件时，对于\
  \ `git` 来说这并不重要——它通过不同的路径指向相同的内容，到此为止，或者换句话说，`tree` 对象有不同的方法来访问 `blob` 对象。\n\n###\
  \ 克隆现有仓库\n\n你可能正尝试与一个现有项目协作。在这种情况下，你必须 `clone` 该项目的主树并在其基础上工作。在这种情况下你可以使用以下命令：\n\
  \n```bash\n$ mkdir -p projects\n$ cd projects\n$ git clone git://<url>/to/project.git\n\
  ```\n对于一个真实示例，你可以通过以下命令克隆 Linus Torvalds 的 Linux 内核树：\n```bash\n$ git clone git://git.kernel.org/pub/scm/linux/kernel/torvalds/linux-2.6.git\n\
  ```\n克隆将字面上为远程仓库创建一个本地副本，这意味着你将拥有该项目的完整历史可用。你可以完全离线工作、提交到你的本地副本、生成*diffs*、检出旧代码、创建分支等任何操作。因为\
  \ `git` 的目标是成为分布式 SCM，所以可以在主远程仓库的本地副本上进行所有这些工作是自然的。没有这种*自由*，就不可能拥有真正的分布式 SCM。\n\n\
  ### 检查仓库错误\n\n文件系统损坏几乎是不可避免的。你可以通过以下操作检查仓库健康状况来尝试避免此类损坏：\n\n```bash\n$ git fsck\n\
  ```\n运行此命令后，你可能会看到类似的内容：\n```text\ndangling tree b47648f75aa0ae2a0c9508bdd6efe00bb2da17c6\n\
  dangling tree 2eedf3560f4d0d403b0047f5c8ebc5f163841e53\n```\n\n\n\n\n这意味着如果你有两个悬空的树对象（或未使用的现有对象），它们可以从你的仓库中被移除。请记住，悬空对象并不是问题；它们经常出现在仓库中，尤其是当你频繁对提交进行\
  \ `rebase` 操作时。\n\n## 仓库维护\n\n保持仓库的整洁非常重要；这有助于 git 更快地工作。在这里你将看到如何删除松散对象、重新创建 git\
  \ 包（packs）以及删除不必要的包。从运行以下命令开始：\n\n```\n$ git gc\n```\n\n`gc` 会尽力对你的仓库进行打包，并删除松散对象和未使用的旧包。然而，它仅用于基础的维护工作。`gc`\
  \ 本身不会尝试进行过于激进的操作。这时，你可能需要使用以下三个命令：\n\n```\n$ git repack\n```\n\n通过适当的选项，你可以告诉 `git\
  \ repack` 获取你所有的对象，并且不是创建一个带有增量的增量包，而是只创建一个包含所有对象的单一包。这将节省大量的磁盘空间并帮助 git 运行得快一点。要实现这一点，你可以使用\
  \ `git repack -a -f -d`。\n\n`git -prune` 命令将从你的仓库中清理（删除）所有未使用的松散对象。换句话说，所有已在包中的松散对象将被清除。\n\
  \n```\n$ git prune\n```\n\n与 `git prune` 类似，`git prune-packed` 命令将从你的 git 仓库中移除未使用的包。\n\
  \n```\n$ git prune-packed\n```\n\n这个命令没什么说的。你可以 `-n` 只检查将删除的包，使用 `-q` 抑制进度指示。\n\n\
  ## 个人开发者\n\n现在你已经有了一套基础命令，可以开始使用 git 执行一些实际工作了。首先，让我们看看一个在独立项目中独自工作的开发者需要知道什么才能用\
  \ git 跟踪其项目历史。为了实现这一点，首先通过以下命令检查你正在哪个分支上工作：\n\n**附录 B：Git 使用**\n\n```\n$ git show-branch\n\
  ```\n\n此命令基本上会向你展示你所在的位置。换句话说，它将打印你当前所在的分支和提交名称。在多分支仓库中，它将显示分支之间关系的树状。例如，它可能会显示如下内容：\n\
  \n* [master] 提交名称 1\n! [topic] 提交名称 2\n! [topic2] 提交名称 3\n---*++ [master] 提交名称 1\n\
  \n```\n$ git-log\n```\n\n前面的代码将显示仓库的完整日志，通常使用分页器（如 `less`），这样你可以逐个更改查看项目的历史变更集。\n\
  \n```\ncommit 172ee4898de698d164e902c96efce3e0981707c0\nAuthor: Felipe Balbi\n<\n\
  my_email@mydomain.com\n>\nDate: Fri Feb 27 22:02:33 2009 +0200\n\ncommit 1\n长的提交描述\n\
  Signed-off-by: Felipe Balbi\n<\nmy_email@mydomain.com\n>\ncommit 09e9f2e9b5335489f1a1c46a846ad3f649bd7c3c\n\
  Author: Felipe Balbi\n<\nmy_email@mydomain.com\n>\nDate: Fri Feb 27 01:22:45 2009\
  \ +0200\n\ncommit 2\n长的提交描述\nSigned-off-by: Felipe Balbi\n<\nmy_email@mydomain.com\n\
  >\ncommit 4aed4f88d233df05adf6ed3135a0bdbbccf5f21b\nAuthor: Felipe Balbi\n<\nmy_email@mydomain.com\n\
  >\nDate: Wed Feb 25 21:50:39 2009 +0200\n\ncommit 3\n长的提交描述\nSigned-off-by: Felipe\
  \ Balbi\n<\nmy_email@mydomain.com\n>\n```\n\n```\n$ git branch\n```\n\n此命令可以用于查看你当前所在的分支、创建新分支、删除分支以及重命名分支。让我们看看如何操作。\n\
  \n不带任何参数的 `git branch` 将显示分支列表。标记为 `***` 的分支就是是你当前正在工作的分支：\n\n```\n$ git branch\n\
  * master\ntopic1\ntopic2\n```\n\n`git branch *branch_name*` 将创建一个名为 `branch_name`\
  \ 的新分支：\n\n```\n$ git branch topic3\n```\n\n结果如下：\n\n```\n$ git branch\n* master\n\
  topic1\ntopic2\ntopic3\n```\n\n`git branch -m *new_name*` 将你的当前分支重命名为 `new_name`：\n\
  \n```\n$ git branch -m master_old\n```\n\n```\n$ git branch\n* master_old\ntopic1\n\
  topic2\ntopic3\n```\n\n`git branch -D *branch_name*` 将删除 `branch_name`：\n\n```\n\
  $ git branch -D topic3\nDeleted branch topic3 (172ee48).\n```\n\n```\n$ git branch\n\
  * master\ntopic1\ntopic2\n```\n\n`$ git checkout` 的主要目的是在分支间切换。例如，`git checkout\
  \ topic1` 将移动到 topic1：\n\n```\n$ git checkout topic1\nSwitched to branch 'topic1'\n\
  ```\n\n```\n$ git branch\nmaster\n* topic1\ntopic2\ntopic3\n```\n\n\n\n\n\n如果你仅维护一个大型仓库的一部分，`request`\
  \ 会为你项目的首席开发者生成一个 `pull request`（拉取请求）。\n\n`git merge` 将上游代码合并到你的分支，以便你继续进行开发。\n\
  \n`git mergetool` 会调用你偏好的合并工具，帮助你解决合并冲突时的问题。\n\n## 仓库配置\n\n为了让仓库运行得更加舒适，可以添加一些配置变量，这可以帮助避免一些重复性工作。以下是最常见且必要的配置：\n\
  \n```bash\ngit config -global user.name \"My Name\"\ngit config -global user.email\
  \ \"my_mail@mydomain.com\"\ngit config -global color.ui auto\ngit config -global\
  \ merge.tool kdiff3\ngit config -global sendemail.smtpserver smtp.domain.com\n```\n\
  \n## 仓库管理\n\n如果你是仓库管理员，你需要确保 `git daemon` 正在运行，并且你的用户仅拥有服务器上必要的访问权限：\n\n- `git daemon`\
  \ 是允许从你的仓库进行匿名下载的守护进程。\n- `git shell` 用作共享仓库用户的受限登录 shell。它将允许访问控制台，但会允许开发者从中央仓库进行\
  \ push 和 pull 操作。\n\n## 在 Launchpad 上托管你的项目\n\nLaunchpad 是一个用于软件开发项目的托管和协作平台。它提供\
  \ bug 跟踪、代码托管、翻译服务和问答服务。它将使用 `Bazaar` 版本控制系统托管你项目的源代码。\n\n要执行此操作，请在 `https://code.launchpad.net/people/+me/+addbranch`\
  \ 注册分支（你需要先注册 Launchpad 注册）。填写 Web 表单将新分支注册到 Launchpad。\n\n它还可以导入 CVS 和 SVN，因此现有项目可以使用这些资源。\n\
  \nLaunchpad 提供了这项免费服务，并保持该主干分支（trunk branch）为最新。这允许你从项目主干创建自己的 `Bazaar` 分支，并在开发功能期间，随着时间推移从主干合并来保持其更新。\n\
  \n如需请求导入，请确保项目已在 Launchpad 上注册，或者由你自行注册。然后访问 `https://code.edge.launchpad.net/+code-imports/+new`\
  \ 请求页面并填写详情。这将执行以下操作：\n\n- 创建一个空分支以包含导入的代码。\n- 订阅该分支，这样在初始导入完成以及后续更新导入新版本时，你都会收到通知。\n\
  - 通知导入操作员，他们将检查导入位置并批准导入。\n\n初始导入可能需要很长时间——多达几天，取决于需要转换的修订数量。一旦建立导入，它将每 6 到 12 小时从\
  \ CVS 或 Subversion 分支更新一次，尽管你可以随时点击导入页面上的 `Import Now` 按钮来请求导入。\n\n目前，该服务限制为仅跟踪每个项目的主分支。\n\
  \n如果你在使用该服务时遇到问题，可以在 `Freenode` 网络上的 `#launchpad` 频道通过 `IRC` 询问。`Internet Relay\
  \ Chat (IRC)` 是一种实时消息或同步会议的形式。它由 `Xchat` 等客户端提供（`sudo apt-get install xchat`）。\n\
  \n## 使用 Bazaar 和 Launchpad\n\n这要求 Launchpad 知道你的 `SSH` 密钥。查找 `ssh key` 的快速方法是运行以下命令：\n\
  \n```bash\ncat ~/.ssh/id_rsa.pub\n```\n\n它的输出类似于所示：\n```text\nssh-rsa\nAAAAB3NzaC1yc2EAAAABIwAAAQEA8gqBwjpIQ/FI2sxh7J4VOSuSKoIvdaIWsLA9o4YOBA/\n\
  8UFN4FOM4cSrUiOq0zT71hpGPo9980B5zXbgGg6b4H5nXx0MIctfGt0yQeTY4aGYhj97/W34r/ExculubXLACEZzZv1NZJfG3SnSEwFFlE90tAu1waltK+paiIli/ONWS2VVLHUBhEXDTpZk8RdVNqixaj08NTjJ\n\
  AoqNSG99FJxx0AGQQp7ZDih/9Y+ip+nhHVYyGHf3Z7JPccEuS/m15wg1OOHHv6nzgbxtQlVtFjZHPObRKbSm3Nk3cnrD/urfFYKYkCoLDdlzYnOA7NyHcUb9TkPVHS+SdElXZ5B2Wiw==\
  \ ian@lawrence\n```\n这可以粘贴到 Launchpad 的 `Update SSH keys` 部分。如果你没有 `SSH key`，请运行以下命令来创建一个：\n\
  \n```bash\nssh-keygen -t dsa\n```\n\n`Bazaar` 本身通过以下命令安装以创建一个：\n\n```bash\nsudo\
  \ apt-get install bzr\n```\n\n在以下示例中将托管的代码将是 Ubuntu Mobile Guide 的第一个版本——Ubuntu\
  \ 7.10 (Gutsy Gibbon) Developer Alpha——该版本可以在 `http://umeguide.net/` 上获取。\n\n首先向\
  \ `Bazaar` 介绍你自己：\n\n```bash\nbzr whoami 'Ian Lawrence root@ianlawrence.info'\n\
  ```\n\n接下来，进入代码所在的文件夹并初始化本地仓库：\n\n```bash\ncd mobileguide\nbzr init\n```\n\n查看 `Bazaar`\
  \ 状态：\n\n```bash\nbzr status\n```\n\n它显示如下：\n```text\nunknown:\nREADME\nimages/mobileguide.pot\n\
  validate.sh\n```\n\n接下来，通过运行以下命令将这些添加到目录：\n\n```bash\nbzr add\n```\n\n`bzr add`\
  \ 命令递归地添加所有内容。也可以通过在 `add` 命令后指定文件来单独添加。\n\n```bash\nbzr add README\n```\n\n也可以通过在\
  \ `remove` 命令后指定文件来删除：\n\n```bash\nbzr remove README\n```\n\n当代码处于可以上传的状态时，首先需要提交到本地仓库，才能上传到远程仓库。\n\
  \n```bash\nbzr commit -m \"Example repository for the\"\n```\n\n现在可以上传代码了。通过类似操作可以通知\
  \ Launchpad：\n\n```bash\nbzr launchpad ianlawrence\n```\n\n运行以下命令：\n\n```bash\n\
  bzr push --existing-dir sftp://ianlawrence@bazaar.launchpad.net/~ianlawrence/+junk/mobileguide\n\
  ```\n\n在 URL 中，`ianlawrence` 是我的 Launchpad 用户名。在 `~` 之后你可以包含你的 Launchpad 用户名或团队名称；`+junk`\
  \ 是项目（在此情况下项目不存在），`mobileguide` 是你想命名的分支。代码可以在 `http://bazaar.launchpad.net/~ianlawrence/+junk/`\
  \ 获取。\n\n## 检查分支并进行开发\n\n如果你想为指南的开发者 Alpha 版本做出贡献，可以在此处检出代码：\n\n```bash\nbzr branch\
  \ http://bazaar.launchpad.net/~ianlawrence/\n```\n\n## 桌面电源程序代码\n\n下面的桌面电源程序是用 Python\
