  Depends: gtk2-engines-murrine\nDescription: A golden theme for Gtk+ 2.0\n```\n\n\
  此包包含用于 gtk2 的 Ubuntu Golden 软件包。\n\n软件包可以在控制文件中声明它们与其他软件包的关系。在上面的示例中，`Depends` 语句部分显示了对\
