  ## 附录 D：桌面电源插件代码 (291)\n## 附录 E：D 总线：概述 (297)\n\n## 索引 (307)\n\n## 引言\n\n《专业 Ubuntu\
  \ 移动开发》（Professional Ubuntu Mobile Development）旨在面向所有希望通过实用、动手方式学习移动设备开发的开发者。本书旨在向你展示如何以高效且（我们希望）创新的方式完成现实世界的任务。我们的目标是书中的示例能够帮助你理解在处理\
  \ Ubuntu 移动开发时所需的技巧。我们希望你随后创造性地将它们应用到自己的现实问题中。\n\n因此，本书并不是一个“静态”对象，但作为作者，我们通过强调离散、可重用的逻辑单元——章节——来模拟这种动态性，这些章节名称在我们定制\
  \ Ubuntu 移动版的过程中变得显而易见。这意味着本书可以通过多种方式来阅读。\n\n## 本书适合哪些读者\n\n本书适用于具有 Debian 类系统（如\
  \ Ubuntu）工作经验的开发者，同时也适用于具有其他操作系统经验的开发者，他们可能想要探索或希望快速上手 Ubuntu 移动版的关键平台特性。它非常适合那些“有截止期限的完美主义者”，因此，它既不是嵌入式开发的介绍，也不是\
  \ Ubuntu 的入门教程。要从书中获得最大的收获，你应该理解编程原理，并对事物如何运作保持健康的好奇心，同时学会如何将提供的示例调整到你的特定情况和需求。\n\
  \n它也不是一本关于如何向任何特定移动设备上安装 Ubuntu 的书（互联网上有其他此类指南），但如果你想将各种版本的 Ubuntu 移动版用于自己的自定义项目，那么这本书将是很有用的。\n\
  \n## 本书涵盖内容\n\n1909 年 8 月 28 日，《北华晨报》发表了一篇名为《移动目标问题》的文章，涉及了在训练步击手时，移动目标的日益流行以牺牲靶心准星为代价的现象。这让军方感到非常懊恼，他们认为在实际战斗中最好的步击手将是那些对准靶心接受过仔细训练，并且从职业生涯早期就开始寻求观察并纠正其射击错误的人。\n\
  \n任何写过书的人在这一点上断定会站在军方的一边。Ubuntu 的范围非常大，移动项目也如此新，以至于书中的某些内容在你读到时可能已经发生了变化。本书提供的是当前最佳实践的快照，以及你实现这些实践时所需的工具。\n\
  \n移动端开发最重要的一点是搭建好环境。一旦完成，你就可以在一个提供设备合理近似的环境中开发、打包和测试你的应用程序。随后是几个章节，每一章都源于一个现实情况，我们希望它们构成了我们想要的书。我们非常享受编写这本书，并希望你同样喜欢。\n\
  \n## 本书的结构\n\n本书涵盖以下内容：\n\n- **第一章，移动 Linux**——讨论在十亿设备上运行 Linux 的可能性和概率。\n- **第二章，开发环境**——引导你设置环境。\n\
  - **第三章，电源管理**——研究性能优化与功耗优化移动设备之间未来的更大分歧。\n- **第四章，应用开发**——讨论移动设备的应用开发。\n- **第五章，应用打包**——说明如何准备你的应用程序。\n\
  - **第六章，应用选择**——关于为目标用户选择合适的应用。\n- **第七章，主题化**——展示你如何自定义移动设备的外观和感受。\n- **第八章，内核调优**——解释最接近的软件层。\n\
  - **第九章，测试与可用性**——讨论满足稳定性和性能的基准标准。\n- **第十章，技巧**——通过一些宝贵的建议节省时间的方法。\n- **第十一章，整合一切**——讨论拥有自己的发行版的优势和潜在陷阱，并展示如何实际种子化萌发镜像。\n\
  - **第十二章，移动端方向**——讨论移动设备 Linux 的未来。\n- **第十三章，常见问题与可能的解决方案**——识别问题并提供解决方案。\n\n##\
  \ 使用本书所需的条件\n\n本书在运行 Ubuntu Jaunty 和 Ubuntu Karmic 的计算机上编写，代码也在这些系统上开发。\n\n章节中的代码在\
  \ Acer Aspire One、Geode、Eee PC 和 Beagleboard 上进行过测试和使用。拥有此类设备或开发板显然更好，但对于充分享受这本书并非必需。\n\
  \n## Ubuntu 移动项目的历史与背景\n\n该背景包含了 IRC 中 #ubuntu-mobile 通道的各种对话，它现在形成了 wiki 页面的基础：https://wiki.ubuntu.com/MobileTeam/Mobile/History\n\
  \n该项目始于 Ubuntu Hardy 发布周期之初，Ubuntu  CTO Matt Zimmerman 向 ubuntu-devel 邮件列表发布的公告，其中提到：*显而易见，出现了新类型的设备——小型、手持、支持联网的平板电脑——*\n\
  \n\n\n\n将改变我们通信和协作的方式。这些设备对开源软件提出了新要求，并需要创新的图形界面、改进的电源管理以及更好的响应能力。\n\n为了实现我们的使命目标并应对这些设备带来的技术挑战，我们宣布\
  \ Ubuntu 移动与嵌入项目（Ubuntu Mobile and Embedded project）。\n\n# Ubuntu 移动与嵌入项目\n\n这是\
  \ GNOME 移动与嵌入计划（GMAE）的扩展。Ubuntu 移动与嵌入项目的命名在当时引起了一些困惑，主要是因为之前存在一个 Ubuntu 嵌入团队（Ubuntu\
  \ Embedded Team）。该团队致力于创建工具、文档以及二进制/源码发行，旨在小型 PC 风格硬件和真正的嵌入式设备上运行 Ubuntu。Ubuntu\
  \ 嵌入团队主要关注让 Ubuntu 在 ARM 处理器设备上运行。\n\n移动与嵌入团队在 Ubuntu Hardy 发布期间开始工作，随着时间的推移，该周期的大部分重点是在是将\
  \ `Hildon` 和 `Moblin` 引入 Ubuntu，并迁移到 Intel 的新的 `LPIA` 架构：\n\n- `Hildon` 是由 Nokia\
  \ 开发的移动设备应用程序框架，现在是 GMAE 的一部分，专注于提供手指友好的界面。它主要是一组提供面向移动设备功能的扩展。\n- `Moblin` 是一个由\
  \ Intel 赞助的开源社区和应用程序框架，用于在各种移动互联网设备 (MID)、上网电脑和嵌入式设备上创建用户友好的应用程序和用户界面。\n- `LPIA`（低功耗\
  \ Intel 架构）是一种新的处理器架构，虽然它类似于 `i386`，但在编译器中使用了不同的优化选项，并对某些包 使用了不同的配置和构建选项。具体而言，`LPIA`\
  \ 使用 `GCC-4.2` 作为系统编译器（而不是用于其他 Ubuntu 架构的 `GCC-4.1`）。\n\n## Ubuntu Hardy 发布\n\n\
  在 Hardy 期间，有工作致力于让 Ubuntu 运行在各种设备上，这些设备均基于 Intel 的 `Menlow` 和 `McCaslin` 平台：\n\n\
  - `McCaslin` 早于 Menlow。它包含一个 Intel A100/A110 处理器。使用该处理器的设备示例是三星 Q1 Ultra。\n- `Menlow`\
  \ 是包含 Intel Atom 处理器（代号为 `Silverthorne` 和 `Diamondville`）的平台名称。它使用 `Poulsbo Chipset`（又称系统控制器枢纽）。使用该处理器的设备示例是\
  \ Aigo MID。这项在 Hardy 周期内未完成，并在 `PPA` 中继续。\n- `PPA`（个人软件包存档）是开发者构建和发布其代码、文档、艺术作品、主题或对自由软件任何其他贡献包的一种。\n\
  \n这导致了 Ubuntu MID 的第一个发行镜像（在官方 Ubuntu Hardy 发布后一段时间）。\n\n虽然此发行版的目标是 4 到 6 英寸屏幕设备，但大多数的测试和工作是在三星\
  \ Q1（称为参考设备）或一些相当笨拙的开发包上完成的。\n\n## Ubuntu 移动团队\n\n在 Hardy 开发者 Alpha 版本发布一段时间后，Ubuntu\
  \ 项目内部进行了一些命名清理。结果，Ubuntu 移动与嵌入团队变成了 Ubuntu 移动团队（Ubuntu Mobile Team），因为其目标越来越偏离\
  \ Ubuntu 嵌入团队以及“纯”嵌入式开发本身。\n\n## 上网电脑重混版 (Netbook Remix)\n\n完全独立的，一组来自原始设备制造商 (`OEM`)\
  \ 团队的 Canonical 开发者正在研究支持新“上网电脑”设备的技术。`OEM` 指为他人制造产品进行重新包装和销售的公司。\n\n通过混合 GNOME、OpenHand\
  \ 代码以及一些投入 Ubuntu MID 的工作以及额外的开发，他们产生了基于松于 Ubuntu Hardy 的“上网电脑重混版 (Netbook Remix)”。\n\
  \n生成的上网电脑重混版在 Ubuntu MID 的第一个版本之前发布。关于上网电脑重混版背后的推理和想法，可以在 http://www.markshuttleworth.com/archives/151\
  \ 找到。\n\n上网电脑重混版基于 Hardy 等 Ubuntu 长期支持 (LTS) 版本。\n\n## UDS Intrepid\n\n在 Intrepid\
  \ 的 UDS（Ubuntu 开发者大会）上，演示了 Netbook Remix 和 Ubuntu MID 的初步版本。还演示了 Canonical OEM 团队基于\
  \ Ubuntu MID 完成的额外工作。此外还演示了 Edubuntu CMPC 镜像。并决定有必要进行某些整合。\n\n由于这一切，Ubuntu 开发者决定为\
  \ Intrepid 提供特定的 Ubuntu 移动发行版。\n\n## Intrepid\n\n因此，对于 Intrepid，有人创建了 Ubuntu Mobile。Ubuntu\
  \ 移动发行版为较大的 7-9 英寸屏幕设计，这些屏幕在三星 Q1 上运行最好（因为这恰好是开发此发行版本的开发者所拥有的 7-9 英寸硬件）。\n\nUbuntu\
  \ 移动发行版不包含基于 Hardy 的 Ubuntu MID 中存在的任何硬件设置或硬编码配置，因此不应该与特定设备那样绑定。\n\n事实上，Intrepid\
  \ 特别是 MID 的特定目标之一是摆脱硬编码，从而支持更多种设备（包括尺寸合适的 Sharp D4）。Intrepid 拥有 `ubuntu-mid.img`\
  \ 以及 `ubuntu-mobile.img`。虽然 ubuntu-mobile 发行版是一个测试版，但在 UMPortal (www.umpcportal.com/)\
  \ 上经过了良好的评审，并引起了一些社区兴趣。\n\n## Jaunty\n\nJaunty Ubuntu 移动发行版基于 `Hildon 2.2`，而它本身基于\
  \ `Clutter` 和 `GTK`。\n\n这为 Ubuntu 移动带来了显著改进。包括增强的 `GTK+` 以制作手指友好的界面，以及一个可选/补充的用户界面库\
  \ `Clutter`。在第四章讨论的 `Clutter` 是一种用于创建视觉丰富且交互界面的 OpenGL ES 渲染库。\n\n## Karmic\n\n\
  Karmic Ubuntu 移动版本重点关注 Ubuntu 上网电脑重混版和 Ubuntu 的 ARM 版本（见下文）。此外，还推出了一个一次性的 Ubuntu\
  \ Moblin 重混版，主要用于演示和比较，但也为了展示两个项目的最佳成果。\n\n在此周期期间，Ubuntu MID 转由 Ubuntu Liquid Remix\
  \ 项目进行社区维护。如果你想加入该项目，请访问 https://edge.launchpad.net/~ulr。第一个社区版本将基于 Ubuntu Lucid，它将是\
  \ Ubuntu 的 LTS 版本。\n\n## Ubuntu ARM\n\n2008 年 12 月 13 日，Ubuntu 的商业赞助商 Canonical\
  \ 宣布，响应设备制造商的需求，Ubuntu 操作系统将在 ARMv7 处理器架构可用。这包含了基于 `ARM Cortex-A8` 和 `Cortex-A9`\
  \ 处理器的系统，它们是 ARM 迄今发布的性能最高、最节能的处理器。\n\nARM 用于各种设备，例如诺基亚 N700/N8xx 系列、Sharp Zaurus、Linksys\
  \ NSLU2 网络存储 (NAS) 设备以及使用较旧 ARM v6 芯片的 iPhone。Ubuntu ARM 于 2009 年 4 月正式发布。\n\n\n\
  \n与其包含许多编号步骤，不如通过在文中显示代码来提供说明，如下文例所示。\n\n### 如何使用 QEMU\n\n要使用 QEMU，请安装必要的软件包：\n\n\
  ```bash\nsudo apt-get install qemu kqemu-common kqemu-source\n```\n\n接下来，将您的用户名添加到\
  \ `kqemu` 组。将您的用户名添加到 `kqemu` 组意味着您不需要以 root 用户身份运行 QEMU。\n\n`kqemu` 是用于加速 QEMU\
  \ 的模块名称。\n\n要添加您的用户名，请运行\n\n```bash\nsudo adduser username > kqemu\n```\n\n要使这些更改生效，必须注销然后重新登录。\n\
  \n要测试 QEMU，进入包含从 http://cdimage.ubuntu.com 下载的镜像的文件夹并运行：\n\n```bash\nqemu -localtime\
  \ -m 384 -boot d ubuntu-9.04-mid-lpia.img\n```\n\n### 源代码\n\n在学习本书中的示例时，您可以选择手动输入所有代码，也可以使用随书附带的源代码文件。书中使用的所有源代码均可从\
  \ http://www.wrox.com 下载。进入该网站后，只需通过搜索框或标题列表找到该书的书名，然后点击书籍详情页上的 `Download Code`\
  \ 链接即可获取书的所有源代码。\n\n由于许多书籍的标题相似，您可能会发现通过 ISBN 搜索最为方便；本书的 ISBN 是 `978 - 0 - 470 -\
  \ 43676 - 9`。\n\n下载代码后，只需使用您喜欢的解压缩工具对其进行解压缩。或者，您可以访问 Wrox 代码下载主页 http://www.wrox.com/dynamic/books/download.aspx，查看本书以及所有其他\
  \ Wrox 书籍提供的代码。\n\nxxx\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\nflast.indd\
