  \ uploaded at: 2009-02-28, 22:42\nPackage uploaded by: ianlawrence\nREVU URL: http://revu.ubuntuwire.com/details.py?upid=5306\n\
  ```\n\npersia 写道：\n1) 章节一团糟\n2) 为什么要限制架构\n3) `/etc/dbus-1/event.d/` 已过时：使用 LSB init\
  \ 头文件\n4) changelog 在初始上传时传统会被截断（且版本号是奇数）5) 上游有更新的版本可用\n\n这是获取软件包工作反馈的好方法，也是获得打包经验的绝佳方式。\n\
  \n## RFA 软件包\n\n可能存在当前维护者已请求接管（Request For Adoption）的软件包。\n\n安装 `devscripts` 软件包（本章前面提到），运行：\n\
  \n```bash\n$ wnpp-alert\n```\n\n此命令将打印出设备上所有孤立（orphaned）的列表。孤立软件包列表看起来如下：\n\n```\n\
  RFH 479951 kvm\n— x86 硬件上的全虚拟化（需要 ia64 的帮助）\n```\n\n如果列表中有一个你重要的包，请向维护者发送邮件询问他们是否愿意维护它。要找到当前维护者，运行：\n\
  \n```bash\n$ apt-cache show kvm\n```\n\n## 自己的仓库\n\n在某些情况下，使用 PPA 并不理想，本地提供包会更方便。这在构建\
  \ Ubuntu 的混合版或定制版本时尤其如此。如果是，有两种方法创建本地仓库。第一种是“简单”方法；第二种使用名为 `reprepro` 的工具，它可以帮助自动化过程。\n\
  \n### 简单仓库\n\n简单仓库不在子目录中组织软件包。它们通过扫描目录创建一个名为 `Packages.gz` 的包列表。用于构建此类仓库的命令是 `dpkg-scanpackages`\
  \ 和 `dpkg-scansource`。以下是这些命令用法：\n\n```bash\ndpkg-scanpackages /dev/null | gzip\
  \ -9c > Packages.gz\ndpkg-scansource /dev/null | gzip -9c > Sources.gz\n```\n\n\
  ### 自动仓库\n\n自动仓库是 Debian 和 Ubuntu 等大型仓库的构建方式。这种仓库格式允许从许多平台访问且文件不会重复。这种结构被称为池（pool）。\n\
  \n有几个工具可以构建此类仓库。其中一个工具是 `reprepro`。它管理 `.deb` 包和相关文件如 `.dsc`、`.diff`、`.tar.gz` 和\
  \ `.udeb`。\n\n### 设置仓库\n\n首先，你需要创建目录结构。它应该是这样的：\n\n```bash\nmkdir /path/to/your/repository/ubuntu\n\
  mkdir /path/to/your/repository/ubuntu/conf\nmkdir /path/to/your/repository/ubuntu/incoming\n\
  ```\n\n这创建了 `reprepro` 配置文件。你的发行文件应该是这样的：\n\n```ini\ncodename: karmic\nSuite: karmic\n\
  Components: main\nArchitectures: i386 source\nDescription: Repo for book\n```\n\n\
  该文件应该放在 `/path/to/your/repository/ubuntu/conf`。\n\n### 向仓库添加包\n\n要向仓库添加包，请使用：\n\n\
  ```bash\n$ reprepro -Vb . include jaunty name_of_file.changes\n```\n\n也可以通过这样做添加包：\n\
  \n```bash\nreprepro -b include karmic some-package.deb\n```\n\n### 从仓库移除包\n\n可以使用以下移除包：\n\
  \n```bash\n$ reprepro -Vb /path/to/repository/ubuntu remove karmic some-package.deb\n\
  ```\n\n### 回传 KVM\n\n将 intrepid 的源添加到 `sources.list`，如下：\n\n\n\n\n\n```bash\ndeb-src\
  \ http://archive.ubuntu.com/ubuntu/ `intpid` main universe restricted multiverse\n\
  ```\n\n在 `sources.list` 中临时注释掉其他的 `deb - src` 行。接下来，运行：`$ apt-get source kvm`\n\n\
  进入解压后的文件夹（在此情况下为 `kvm - 72+dfsg`）并运行：`$ debuild`\n\n如果这产生了如下构建依赖项：\n\n```text\n\
  dpkg-checkbuilddeps: Unmet build dependencies: quilt (\n> = 0.40) uuid-dev libsdl1.2-dev\
  \ libasound2-dev libgnutls-dev nasm texi2html bcc iasl\ndpkg-buildpackage: warning:\
  \ Build dependencies/conflicts unsatisfied; aborting.\n```\n\n你需要添加以下内容：\n\n```bash\n\
  $ sudo apt-get build-dep kvm\n```\n\n然后再次运行 `debuild`。这将在父目录中创建 `.deb` 文件。\n\n---\n\
  \n# 第 5 章：应用程序打包\n\n## PBuilder\n\n虽然可以像我们之前展示的那构建包，但你已经在运行的系统中拥有了要构建包的所有构建依赖。\n\
  \n一个名为 `pbuilder` 的工具可以提供帮助。`pbuilder` 会自动检查构建依赖项，因为它是在最小化的 Ubuntu 安装中构建包的，并根据 Debian\
  \ 的 `control` 文件下载构建依赖。\n\n`pbuilder` 的主要目标与 Debian 中的其他自动构建系统不同，它并不尝试构建尽可能多的包。它不会尝试猜测一个包需要什么，在大多数情况下，如果有选择，它会倾向于选择最糟糕的选择。\n\
  \n### 配置 PBuilder\n\n配置 `pbuilder` 是一个好主意。有许多方法可以实现这一点。在 `/etc` 目录下是 `pbuilder`\
  \ 的主配置文件，命名为 `pbuilderrc`。\n\n将该文件编辑如下：\n\n```text\nBASETGZ=/var/cache/pbuilder/base.tgz\n\
  #EXTRAPACKAGES=gcc3.0-athlon-builder\n#export DEBIAN_BUILDARCH=athlon\nBUILDPLACE=/var/cache/pbuilder/build/\n\
  MIRRORSITE=http://archive.ubuntu.com/ubuntu\nUSEPROC=yes\nUSEDEVPTS=yes\nUSEDEVFS=no\n\
  BUILDRESULT=/var/cache/pbuilder/result/\n# 指定发行版强制在“pbuilder update”中使用该版本\nDISTRIBUTION=jaunty\n\
  # 指定发行版的组件（默认是“main”）\n#COMPONENTS=”main restricted universe multiverse”\n# 为 APT\
  \ 指定缓存\nAPTCACHE=”/var/cache/pbuilder/aptcache/”\nAPTCACHEHARDLINK=”yes”\nREMOVEPACKAGES=””\n\
  #HOOKDIR=”/usr/lib/pbuilder/hooks”\nHOOKDIR=\"\"\n# 让 debconf 不与用户交互\nexport DEBIAN_FRONTEND=”noninteractive”\n\
  DEBEMAIL=\"\"\n# 用于 pbuilder debuild (sudo -E 保持环境不变)\nBUILDSOURCEROOTCMD=\"fakeroot\"\
  \nPBUILDERROOTCMD=\"sudo -E\"\n# 满足构建依赖的命令；默认是一个内部 shell\n# 实现，速度较慢；有两种替代\n# 实现方式，“实验性”实现，\n\
  # “pbuilder-satisfydepends-experimental”，它可能用于从实验性仓库\n# 或低 APT 优先级的仓库拉取包，\n# 以及\
  \ “aptitude”实现，它将使用 aptitude 解析构建依赖并\n# 构建冲突，这有助于处理复杂情况，但它不支持\n# 未签名的 APT 仓库\nPBUILDERSATISFYDEPENDSCMD=”/usr/lib/pbuilder/pbuilder-satisfydepends”\n\
  # 传递给 dpkg-buildpackage 的命令行选项。\n#DEBBUILDOPTS=”-IXXX -iXXX”\nDEBBUILDOPTS=\"\"\n\
  # APT 配置文件目录\nAPTCONFDIR=\"\"\n# pbuilder 在 chroot 内部使用的用户名和 ID。需要 fakeroot，实际上\
  \ BUILDUSERID=1234\nBUILDUSERNAME=pbuilder\n# BINDMOUNTS 是一个用空格分隔的列表，用于在 chroot\n\
  # 内部挂载\nBINDMOUNTS=\"\"\n# 将 debootstrap 变体设置为‘buildd’ 类型。DEBOOTSTRAPOPTS[0]=’variant=buildd’\n\
  # 或者取消设置以使其不再是 buildd 类型。\n# unset DEBOOTSTRAPOPTS\n# 设置我在 pbuilder 内部使用的 PATH：默认是“/usr/sbin:/usr/bin:/sbin:/bin:/usr/X11R6/bin”\n\
  export PATH=\"/usr/sbin:/usr/bin:/sbin:/bin:/usr/X11R6/bin”\n# SHELL 变量在 pbuilder\
  \ 内部被‘su’等命令使用；它们需要合理的值\nexport SHELL=/bin/bash\n# debootstrap 命令的名字。\nDEBOOTSTRAP=\"\
  debootstrap\"\n# pkgname-logfile 的默认文件后缀\nPKGNAME_LOGFILE_EXTENTION=”_$(dpkg --print-architecture).build”\n\
  # 默认 PKGNAME_LOGFILE\nPKGNAME_LOGFILE=\"\"\n```\n\n这为 `pbuilder` 提供了一些合理的配置默认值。\n\
  \n现在可以使用 bash 脚本对 `pbuilder` 进行脚本。以下脚本允许为任何 Ubuntu 发行版创建 Debian 包（名称作为命令行参数传递给 `pbuilder`）。\n\
  \n将 `/home/<user>/.pbuilderrc` 文件修改为如下代码。此代码仅供参考。请从我们 Wrox 网站的代码包中下载此文件。\n\n```text\n\
  #USE_SYSTEM_DIST=1\n#DEFAULT_DIST=”hardy”\n#OTHERMIRROR=”deb http://localhost:8000/test/\
  \ ./|deb http://localhost:8000/extra/hardy main|”\nUBUNTU_UPDATES=1\nUBUNTU_SECURITY=1\n\
  UBUNTU_BACKPORTS=1\nUBUNTU_PROPOSED=0\nDEBIAN_SECURITY=1\nUBUNTULIST=”jaunty intrepid\
  \ karmic”\nDEBIANLIST=”stable testing sid experimental lenny”\nUBUNTU_MIRROR=”http://br.archive.ubuntu.com/”\n\
  ```\n\n通过这种方式配置 pbuilder，你就有了构建不同发布版本、发行版和架构包的能力。\n\n要这样做，首先创建 pbuilder：\n\n```bash\n\
  $ sudo DIST=karmic pbuilder create\n```\n\n然后将要构建的版本以及包的 `.dsc` 传递给 `pbuilder`：\n\
  \n```bash\n$ sudo DIST=karmic pbuilder build package_version.dsc\n```\n\n因此，要为 Jaunty\
  \ 版本构建 Ubuntu 移动指南的 Hardy 版本（可在 `https://edge.launchpad.net/~ianlawrence/+archive/ppa`\
  \ 获取），请运行：\n\n```bash\n$ sudo DIST=jaunty pbuilder build mobileguide_0.1-2.dsc\n\
  ```\n\n\n\n\n\n除了之前显示的 `create` 命令外，还有其他几个简单的操作命令，如 `pbuilder update` 和 `pbuilder\
  \ build`。\n\n# 第 5 章：应用程序打包\n\n接下将更详细地介绍这些命令。\n\n## 创建发行版环境\n\n`pbuilder create`\
  \ 命令将创建一个基础 chroot 镜像 tarball（`base.tgz`）。所有其他命令将对生成的 `base.tgz` 进行操作。需要通过发行命令的\
  \ `--name` 选项指定发行代号。\n\n`debootstrap` 用于创建最精的 Debian 安装，然后在 chroot 内部使用 `apt-get`\
  \ 在最小安装的基础上安装核心软件包。\n\n使用 `pbuilder` 创建包如下：\n\n```bash\nsudo DIST=karmic pbuilder\
  \ create\n```\n\n## 构建到特定版本的包\n\n要在 chroot 内部构建包，请使用以下命令：\n\n```bash\nsudo DIST=karmic\
  \ pbuilder build whatever.dsc\n```\n\n`pbuilder` 将将 `base.tgz` 解压到临时工作目录，使用 `chroot`\
  \ 进入该目录，在 chroot 内部满足构建依赖项，并构建包。构建好的包将移动到由 `--buildresult` 命令行选项指定的目录。\n\n## 更新\
  \ PBuilder 环境\n\n添加以下代码：\n\n```bash\npbuilder update\n```\n\n它将更新 `base.tgz` 文件。它会解压\
  \ chroot，在 chroot 内部调用 `apt-get update` 和 `apt-get dist-upgrade`，并重建 `base.tgz`（基础\
  \ tarball）。\n\n## 使用 pdebuild\n\n常见的打包工作流如“Backporting KVM”部分所示。开发者可能会尝试在 Debian\
  \ 源码目录内执行 `debuild` 并构建包：\n\n- `pdebuild` 允许一种类似的工作流，在 chroot 内部构建包，并会检查当前源码树是否可以顺利构建。\n\
  - `pdebuild` 调用 `dpkg-source` 构建源包，然后对生成的源包调用 `pbuilder`。然而，与 `debuild` 不同，生成的 `.deb`\
  \ 文件将位于 `buildresult` 目录中。\n\n从 0.97 版本开始，`pdebuild` 提供了一种稍微不同的运行模式。`pdebuild` 通常在\
  \ chroot 外部运行 `Debian/rules clean`；但是，可以通过 `--use-pdebuild-internal` 将行为改为在 chroot\
  \ 内部运行。它将尝试挂载 chroot 内部的工作目录，并在其中运行 `dpkg-buildpackage`。\n\n你可以这样使用 `pdebuild`：\n\
  \n```bash\nsudo pdebuild --use-pdebuild-internal\n```\n\n## 配置动作 (Actions)\n\n当你希望在\
  \ `pbuilder` 执行期间的特定时刻执行某些动作时，可以使用钩子脚本。这些动作也可以编写脚本。\n\n可以通过变量 `HOOKDIR` 定义钩子目录。可以在命令行中如下设置：\n\
  \n```bash\nsudo HOOKDIR=/path/to/hookdir pbuilder -build file.dsc\n```\n\n你也可以这样设置：\n\
  \n```bash\nsudo pbuilder -hookdir /path/to/hookdir -build file.dsc\n```\n\n钩子脚本名称必须采用\
  \ `X<数字><数字><你想要的其他任何内容>` 的形式，类似于启动脚本。这里是 `c10shell` 钩子脚本示例，它会在构建失败时调用 shell。\n\n\
  ```bash\n#!/bin/bash\n# 如果构建失败，则调用 shell\napt-get install -y --force-yes vim less\n\
  cd /tmp/buildd/*/debian/\n/bin/bash < /dev/tty > /dev/tty 2> /dev/tty\n```\n\n##\
  \ 使用 PBuilder 进行额外的钩子操作\n\n我们发现的一些最有用的钩子操作命令如下。它们以字母开头，第一个字母是 A。\n\n- `A<数字><数字><你想要的其他任何内容>`：这在构建开始之前执行——在解压构建系统、解压源码并满足构建依赖之后。\n\
  - `B` 的使用方式：`B<数字><数字><你想要的其他任何内容>`。这在构建系统成功完成构建之后、拷贝构建结果之前执行。\n- `C` 的使用方式：`C<数字><数字><你想要的其他任何内容>`。这在构建失败之后、清理之前执行。\n\
  - `D` 的使用方式：`D<数字><数字><你想要的其他任何内容>`。这在 chroot 内部解压源码之前、设置好 chroot 环境之后执行。\n\n###\
  \ 钩子脚本资源\n\n安装了 Bazaar (`sudo apt-get install bzr`) 后，可以以下内容：\n\n`bzr branch-hooks`：这包含了一些实用的示例脚本。\n\
  \n## 为 PBuilder 挂载包仓库\n\n绑定挂载（Bind mounting）对许多任务很有用。最有用的之一是挂载包仓库：`BINDMOUNTS=\"\
  /var/cache/pbuilder/result\"`\n\n```bash\n#!/bin/sh\ncat /var/cache/pbuilder/result/Packages\n\
  ```\n\n## Ubuntu 策略\n\n位于 http://people.ubuntu.com/~cjwatson/ubuntu-policy/policy.html\
  \ 的 Ubuntu 策略文档描述了“Ubuntu 发行版的策略要求”。它还讨论了与包相关的策略问题，例如每个包包含发行版必须满足的技术要求。它紧密参考了 Debian\
  \ 策略文档。\n\n该文档极其重要。请阅读。需要知道的一个重要点是 Ubuntu 包存档是如何划分的。\n\n### 类别 (Categories)\n\n\
  类别分为 main、restricted、universe 和 multiverse，每个类别对包包含其中有不同的要求。\n\n- **Main**：main\
  \ 中的包在编译或执行时不需要 *main* 之外的包（因此，该包不能对非-*main* 的包声明 `Depends`、`Recommends` 或 `Build-Depends`）。\n\
  - **Restricted**：restricted 包可能不提供源码，且可能不允许修改。\n- **Universe**：此类别中的包既不受 Ubuntu\
  \ 开发者支持也不受 Canonical 支持。此外，包在编译或执行时不需要 *main* 和 *universe* 之外的包（因此，该包不能对非-*main*\
  \ 非-*universe* 的包声明 `Depends`、`Recommends` 或 `Build-Depends`）。\n- **Multiverse**：如果源码不可、不允许修改，或者它们受到专利或其他法律问题的限制导致分发出现问题，则包必须放在\
  \ *multiverse* 中。\n\n*每个包还必须在 `/usr/share/doc/package/copyright` 文件中提供版权文件和发行许可。*\n\
  \n## 章节 (Sections)\n\n上述类别进一步细分为章节。这些章节在 Debian 包的控制文件中指定。它们对于将包组织成逻辑块很有用。可用的章节包括\
  \ admin、graphics、web、X11 和 metapackages（元包）。完整的完整的列表可以在策略文档本身中找到。元包的使用将在第 11 章“整合一切”中介绍。\n\
  \n\n\n\n\nUbuntu 存档的维护者可能会覆盖区域值以确保 Ubuntu 发行版的一性。因此，在软件包中包含此信息至关重要。\n\n# 摘要\n\n\
  本章介绍了打包时使用的一些基本工具，并涵盖了如何创建一个包含 Debian 包所需文件的简单存档。随后，它将向你展示如何为软件包设置本地仓库。你还将看到如何使用和自定义\
  \ `pbuilder` 以及其他自定义脚本，这些脚本可以在 `pbuilder` 运行之前、期间或之后执行。最后，我们讨论了 Ubuntu 策略文档以及软件在仓库中的分类方式。\n\
  \n# 应用选择\n\n根据一些观察者的观点，移动互联网设备（Mobile Internet Device）类别正在迅速崛起。ABI Research 的一项最新研究显示，这一类别将作为工具和玩具，吸引“广泛的人群”。报告还预测，这些产品在未来五年内的人气将出现巨大增长，全球出货量将从\
  \ 2008 年的不足 350 万份增加到 2012 年的近 9000 万份。\n\n根据研究机构 Strategy Analytics 的数据，移动互联网设备的销售额预计到\
  \ 2014 年全球每年将超过 170 亿美元。\n\n关于移动设备业务潜力的更多信息可以参阅第 12 章。\n\nOEM（原始设备制造商）尝试从这一“广泛的人群”中识别出“用户类别”，以便为每个目标市场细分定制其在设备上提供的应用程序。这意味着要选择应用程序和设备设置，为特定的用户群体充分利用移动设备。\n\
  \n## 商务用户\n\n这是一个许多 OEM 针对的大型盈利的细分市场。虽然商务用户和消费者之间的界限可能变得越来越模糊，但应用提供商似乎专注于如何将他们的软件与移动互联网设备（MID）和上网电脑集成，以向企业用户提供一致的体验。\n\
  \n许多公司面临预算压力，既需要提高效率又要削减支出。通过运行高度自定义版本的 Ubuntu Mobile 的设备在云端托管办公应用程序和文档等解决方案对公司来说越来越具有吸引力。\n\
  \n尽管如此，像这样使用移动设备确实比员工例如在办公室连接到工作站会引发更多的安全忧虑。\n\n# 第 6 章：应用选择\n\n因此，驱动企业环境中采用移动设备的因素是安全性。对于许多考虑为员工配备移动设备的公司来说，密码保护、远程擦除能力和物理设备追踪是引用的前三大因素。\n\
  \nUbuntu 自带一个为默认用户创建加密私有目录的功能。你可以按照以下步骤在设备上设置：\n\n```bash\nsudo apt-get install\
  \ ecryptfs-utils\n```\n\n然后运行以下命令：\n\n```bash\nsudo ecryptfs-setup-private\n```\n\
  \n此操作不应使用 `sudo`（它允许临时超级用户权限）。\n\n输入登录短语，即登录设备时使用的密码。\n选择一个挂载密码。\n输入挂载密码（再次）。\n\n\
  `ecryptfs-setup-private` 脚本创建 `/home/user/Private` 目录并测试加密挂载是否按预期工作。\n\n重启设备后，`/home/user/Private`\
  \ 中将有一个加密目录，可以在其中存储所有的公司机密信息。\n\nUbuntu MID 上的那种自动无密码登录意味着 `~/Private` 目录默认不挂载。这是设计如此，意味着当点击\
  \ `~/Private` 目录中的“访问您的私人数据（Access Your Private Data）”文件时，需要输入密码。完成后，用户可以使用加密数据。\n\
  \n应使用不同的密码来加密挂载；这只有在需要手动恢复数据时才是必须的。\n\n### 文档\n\n商务需求需要文字处理软件来创建信函和文档，用于业务分析的表格软件，以及用于重要会议的计算和演示软件。\n\
  \nOpenOffice 是一个免费的跨平台办公应用套件，并兼容 Microsoft Office，因此很容易与使用 Windows 和 Microsoft Office\
  \ 的朋友和同事交换文档。\n\n### 实例\n\n然而，OpenOffice 可能会消耗大量资源，这在移动设备上是一个问题。\n\n正如此，Ubuntu MID\
  \ 团队编写了一个名为 `Trebuchet`（`treb`）的应用程序，它是用于显示办公文件的处理器。\n\n`treb` 是一个读取 Microsoft Office\
  \ 应用程序创建的的界面。它通过使用 OpenOffice 作为过滤器将文件转换为 PDF，并启动 `Evince` 查看结果来实现此。在关闭 `Evince`\
  \ 后，临时 PDF 文件会被删除，`treb` 本身也会关闭。\n\n`treb` 作为 MID 安装的一部分提供，但也可以使用 `apt-get` 安装；它可以从命令行运行以显示图\
  \ 6-1 所示的 GUI。\n\n```bash\napt-get install treb\ntreb\n```\n\n## 多媒体用户\n\n为多媒体用户组提供设备的供应商拥有一个从当前智能手机市场发展出来的既有且现成的市场。虽然多媒体通常与图像、文本和音乐相关，但它也可以指集成来自广泛独立数据源的应用程序。在移动设备上实现此功能的最知名且最流行的应用程序可能是\
  \ `Canola`。它是使用 `Python` 和 Enlightenment Foundation Libraries（`EFL`）构建的，并使用插件系统启用\
  \ YouTube、Flicker 等。已有 2009 年 Google Summer of Code 项目获批，为 Twitter、Remember the\
  \ Milk 甚至 IM 客户端创建插件。\n\n`EFL` 在第 4 章中有更详细的介绍。\n\n另一个可用解决方案是名为 `Entertainer` 的媒体中心。它旨在为\
  \ Gnome 和 XFCE 桌面环境提供一个简单易用的应用程序。`Entertainer` 完全用 `Python` 编写，并使用 `GStreamer` 多媒体框架进行多媒体播放。用户界面使用\
  \ `Clutter` 库实现。\n\n`Clutter` 在第 4 章中有更详细的介绍。\n\n### 实例\n\n`Entertainer` 还包含一个私人视频录制器，这意味着它可以观看电视直播并录制节目以备后观看。要安装\
  \ `entertainer`，请将 `entertainer` PPA 添加到 `/etc/apt/sources.list`：\n\n```text\ndeb\
  \ http://ppa.launchpad.net/entertainer-releases/ppa/ubuntu jaunty main\ndeb-src\
  \ http://ppa.launchpad.net/entertainer-releases/ppa/ubuntu jaunty main\n```\n\n\
  然后执行：\n\n```bash\nsudo apt-get update && sudo apt-get install entertainer\n```\n\
  \n还将 GPG 密钥添加到你的软件源验证中（系统管理软件源验证）。选择“导入密钥文件 . . .”并添加 entertainer 页面上的密钥。\n\n然后运行内容管理器应用程序并选择设备上的媒体文件夹或提供\
  \ URL：\n\n```bash\nentertainer-content-manager\n```\n\n内容管理器的界面如图 6-2 所示。\n\n接下来，运行前端：\n\
  \n```bash\nentertainer\n```\n\n\n\n\nUbuntu Netbook Remix 上的 Entertainer 界面如图 6-3。\n\
  \n图 6-3\n\n要退出 Entertainer，请按 `Q` 键。接下来将解释其他按键命令。\n\n### Entertainer GUI 中的常用快捷键\n\
  \nEntertainer 通过键盘控制，具体如下：\n\n❑ `F` — 切换全屏开启/关闭。\n❑ `P` — 在视频或音频播放时切换暂停/播放。\n❑ `S`\
  \ — 停止播放。\n❑ `H` — 返回主屏幕；在任何地方按此都会显示主菜单。\n❑ `I` — 在全屏模式查看照片时切换信息视图。\n❑ `1, 2, 3,\
  \ 4` — 视频播放显示比例。\n❑ `方向键` — 导航菜单。\n❑ `Enter` — 选择当前菜单项。\n❑ `Backspace` — 返回到上一个屏幕。\n\
  \n# 第 6 章：应用选择\n\n### 社交网络用户\n\n这一市场细分有时被营销人员称为 Y 世代（Gen Y）（这是对 X 世代术语的延续，该术语由同名小说流行），通常指出生于\
  \ 20 世纪 80 年代初和 90 年代的人。\n\n这显然是一个巨大的市场，因此对设备制造商和独立软件供应商（ISV）具有极大吸引。\n\n这一群体的人对互联网非常熟悉，特别是在\
  \ Facebook、Twitter 和 MySpace 等社交网络中。Ryn Junco 和 Jeanna Mastrodicasa 为其著作 *Connecting\
  \ to the Net.Generation: What higher education professionals need to know about\
  \ today ’s students* 一书对美国 7,705 名大学生进行的调查显示，一个关键驱动力是同伴认同。该调查的其他有趣点包括：\n\n❑ 97%\
  \ 拥有电脑。\n❑ 97% 曾通过点对点文件共享下载音乐和其他媒体。\n❑ 94% 拥有手机。\n❑ 76% 使用即时通讯（IM）和社交网络网站。\n❑ 75%\
  \ 的大学生拥有 Facebook 账号。\n❑ 60% 拥有某种类型的便携音乐和/或视频设备，如 iPod。\n❑ 49% 经常通过点对点文件共享下载音乐和其他媒体。\n\
  ❑ 34% 将网站作为主要新闻来源。\n❑ 28% 编写博客，44% 阅读博客。\n❑ 15% 的 IM 用户每天 24 小时、每周 7 天在线。\n\n因此，对于这一市场细分重要的领域是品牌建设、内容和设备设计。\n\
  \n### 实际示例\n\n针对这一利基市场的完整操作系统有趣示例是 gOS 3 Gadgets，地址位于 `http://thinkgos.com/index.php`。gOS\
  \ 3 Gadgets 是一个适用于桌面式机和笔记本电脑的完整桌面操作系统。\n\n它基于 Ubuntu 8.04，并在启动时运行 Linux 版的 Google\
  \ Gadgets，为桌面引入了超过 100,000 个可能的 iGoogle 和 Google Gadgets。Google Gadgets 是轻量级的 XML\
  \ 程序，允许你在小部件中放置交互式数据，而 iGoogle 是一个基于 AJAX 的自定义启动页，用于访问这些小部件。\n\nAJAX 是一组编程技术，允许你根据服务器的输入无缝更新网页或\
  \ Web 应用程序的一部分，而无需刷新刷新。\n\n在 Mozilla Prism 窗口中启动的 gOS 应用与桌面应用程序的功能非常相似。Mozilla Prism\
  \ 还支持 WINE 1.0，让用户可以访问 Windows 软件。\n\nMozilla Prism 使应用程序能够在自己的窗口中运行，而不是在浏览器中。它允许开发者访问大多数桌面应用程序通用的操作系统功能。\n\
  \n可以使用 `apt` 安装 Google Gadgets：\n\n```\n$ sudo apt-get install google-gadgets-gtk\n\
  ```\n\n存储库 `google-gadgets-qt` 中也有 QT 版本可用。\n\n要运行该程序，打开终端并运行：\n\n```bash\n$ ggl-gtk\n\
  ```\n\n若要在 Ubuntu Netbook Remix 系统启动时启动该程序，请前往“设置”（Preferences）中的“启动应用程序”（Startup\
  \ Applications）并点击“添加”（Add）。在名称字段中输入 `Gadgets`，在命令行中输入：`ggl-gtk`。\n\n现在，每次设备启动，Google\
  \ Gadgets 都会自动启动并显示图 6-4 所示的桌面。\n\n图 6-4\n\n学习 gadget API 的好方法是修改现有的小部件。接下来的章节将展示如何创建一个修改过的“你好，世界”小部件。\n\
  \n### 设置环境\n\n确保已安装 Google Desktop (`http://desktop.google.com`) 和最新版本的 SDK (`http://desktop.google.com/downloadsdksubmit`)。\n\
  \n### 复制小部件\n\n复制 `api/samples/gadgets/HelloWorld` 文件夹并将其命名为 `UbuntuMobile`。\n\n\
  ### 修改它\n\n文件夹内部是应用程序中使用的字符串。将文件修改如下：\n\n```xml\n<strings>\n<GADGET_NAME>\nProfessional\
  \ Ubuntu Mobile Development Gadget\n</GADGET_NAME>\n<GADGET_DESCRIPTION>\nDemonstrates\
  \ how to write a Gadget\n</GADGET_DESCRIPTION>\n<GADGET_COPYRIGHT>\nCopyright (c)\
  \ 2007 Google Inc.\nAll Rights Reserved\n</GADGET_COPYRIGHT>\n<GADGET_WEBSITE>\n\
  http://desktop.google.com/\n</GADGET_WEBSITE>\n<GADGET_ABOUT>\nProfessional Ubuntu\
  \ Mobile Development Gadget\nOriginal Copyright (c) 2007 Google Inc. All Rights\
  \ Reserved\nModified by Ian Lawrence under the Apache License, Version 2.0\nhttp://www.apache.org/licenses/LICENSE-2.0\
  \ for the book\nProfessional Mobile Development\nThis gadget displays the text ‘Professional\
  \ Mobile Development’\non top of a picture using the main.xml file.\nIf the text\
  \ is clicked on, a message box will show up as an event.\n</GADGET_ABOUT>\n<PUMD>\n\
  Professional UME\n</PUMD>\n</strings>\n```\n\n将 `main.xml` 修改为如下：\n\n```xml\n<view\
  \ width=\"250\" height=\"150\">\n<script src=\"main.js\" />\n<img src=\"background.png\"\
  \ />\n<label x=\"125\" y=\"70\" align=\"center\" width=\"250\" size=\"15\" enabled=\"\
  true\"\nname=\"mylabel\" pinX=\"125\" pinY=\"8\"\nonclick=\"onTextClick();\">&PUMD;\n\
  </label>\n</view>\n```\n\n在 `main.js` 中添加动画：\n\n```javascript\nfunction onTextClick()\
  \ {\n  view.beginAnimation(doRotation, 0, 360, 500);\n}\nfunction doRotation() {\n\
  \  mylabel.rotation = event.value;\n}\n```\n\n现在可以运行该程序了。双击 `gadget.gmanifest` 并使用之前安装的\
  \ gadgets 应用进行安装。这将显示图 6-5 所示的安装消息。\n\n图 6-5\n\n你还将看到带有漂亮动画的小部件，如图 6-6 所示。\n\n图\
  \ 6-6\n\n还要更新 `gadget.manifest` 中的元数据以反映 `strings.xml` 的更改。\n\n要分发 gadget，创建一个 Zip\
  \ 文件（右键点击 `UbuntuMobile` 文件夹并选择“创建压缩”），然后将扩展名从 `.zip` 改为 `.gg`，用户即可点击 `.gg` 文件将其安装到笔记本电脑上。\n\
  \n### 位置感知用户\n\n拥有年迈父母的用户发现位置概念对他们很重要。这一群体还拥有较高的支配收入，因为他们已经工作多年，因此对 OEM 来说是一个很有吸引力的市场。用户通常期望的位置感知移动设备的功能包括：\n\
  \n❑ 自动重新配置的能力，例如始终使用正确的网络设置（用于防火墙代理和 VPN），以及使用正确的打印机（即：在家里使用家庭打印机，在办公室使用工作打印机）\n\
  \n\n\n\n安全性，仅允许从指定的物理位置访问\n\n- 帮助在遗失或被盗时找回它\n- 能够轻松与房间内的其他人共享论文或演示文稿，而无需通过电子邮件发送或在公共服务器上设置文件夹\n\
  \n这些某些功能可以使用运行在设备本地的简单 Web 界面呈现给用户。\n\n### 实际示例\n\n在本节中，你将学习如何为 MID 设备创建一个启用 GPS\
  \ 的独立 Web 应用程序。它在 Python 应用程序内部嵌入了 Web 服务器和数据库，通过 XML-RPC 从 D-Bus 接口接收信息。它使用了 Django\
  \ 应用程序框架。\n\n*D-Bus* 将第 4 章中详细介绍。\n\n### 背景\n\n传统上，Debian 类系统上的 GPS 是通过一个名为 `gpsd`\
  \ 的守护进程提供的（`apt-get install gpsd`）。然而，在资源受限的环境中使用 `gpsd` 存在一些问题，特别是 `gpsd` 设计为系统启动时运行，系统关闭时停止（或在\
  \ USB/蓝牙热插设备插入或拔出时启动）。因此，如果客户端在 `gpsd` 运行之前启动（例如在连接蓝牙设备之前启动了 GPS 插件），那么它感知 `gpsd`\
  \ 的唯一方法就是尝试连接 `gpsd` 套接并每隔一段时间尝试一次直到成功。\n\n这使得 `gpsd` 客户端程序非常忙，必须不断唤醒检查是否可以连接。在电池供电的系统中，拥有无法经常睡眠的进程是一坏事。\n\
  \n此外，`gpsd` 提供的信息粒度也存在问题，因为运行的客户端会收到所有通知，即使它们并不感兴趣。GPS 在接收到每条 NMEA 句子时都会发射新的定位，对于大多数\
  \ GPS 设备来说，大约每秒五次，每次即使客户端不关心更改的数据，它们都会被唤醒。\n\n`gpsd` 无法让客户端表示它们只对位置数据感兴趣，或者只对设备是否锁定感兴趣。即使\
  \ GPS 是静止的，卫星数据也会不断变化，客户端会在每条消息时被唤醒。由于这些问题，o-hand 的 Iain Holmes 写了 `gypsy`。这是一个\
  \ GPS 复用守护进程，可以对 GPS 信息进行更精细的控制，并允许程序调用以下对象：\n\n- `Gypsy Position` — 用于位置信息\n- `Gypsy\
  \ Course` — 用于航向信息\n- `Gypsy Accuracy` — 用于准确性信息\n- `Gypsy Satellite` — 用于卫星信息\n\
  \n### 实现\n\n首先，安装 Django：\n\n```bash\nsudo apt-get install python-django\n```\n\n\
  在主目录中，创建一个名为“Web”的目录并进入它：\n```bash\nmkdir Web;cd Web\n```\n\n接下来，创建一个目录：\n\n```bash\n\
  mkdir django_projects\n```\n\n进入 Django 项目目录，并使用 Django 的命令行工具启动一个名为“locate”的新项目。这将创建一个基础目录结构和必要的配置文件：\n\
  ```bash\ncd ~/Web/django_projects\ndjango-admin.py startproject locate\n```\n\n\
  *不要设置 apache、postgresql 或 mysql。（这些应用程序不适用于嵌入式设备。）* 应用程序将使用 Cherry Py 独立 WSGI 服务器和\
  \ SQLite。\n\n编辑 `settings.py` 使其看起来所示：\n\n```python\nDATABASE_ENGINE = ‘sqlite3’\n\
  DATABASE_NAME = os.path.join(os.path.dirname(__file__), ‘data’, ‘locate.db’)\nDATABASE_USER\
  \ = ‘’ # sqlite3 不使用用户。\nDATABASE_PASSWORD = ‘’ # sqlite3 不使用密码。\n```\n\n代码 `DATABASE_NAME\
  \ = os.path.join(os.path.dirname(__file__), ‘data’, ‘locate.db’` 是一个技巧，允许 SQLite\
  \ 文件系统数据库存储在项目内名为 `data` 的文件夹中。这在使用版本控制系统时是一个优势，因为所有代码都可以存储在分支中。类似的技巧适用于站点媒体（media）——在项目根目录下创建一个\
  \ `media` 文件夹，然后在 `settings.py` 中添加以下内容：\n\n```python\nimport os,sys\npath = os.path.dirname(sys.argv[0])\n\
  full_path = os.path.abspath(os.path.join(path, ‘../media’))\n```\n\n然后将 `STATIC_ROOT`\
  \ 变量设置为 `full_path`：\n\n```python\nSTATIC_ROOT = full_path\n```\n\n最后，在 `urls.py`\
  \ 中从 `django.conf` 导入 Django 设置。将 `static.serve` 设置为 `(r’^media/(?P<path>.*)$’,\
  \ ‘django.views.static.serve’, {‘document_root’: settings.STATIC_ROOT, ‘show_indexes’:\
  \ True})`。在项目根目录下创建一个名为“server”的文件夹。在该文件夹内部，检出独立服务器的副本：\n\n```bash\nwget http://svn.cherrypy.org/trunk/cherrypy/wsgiserver/__init__.py\
  \ -O wsgiserver.py\n```\n\n创建一个名为 `run.py` 的文件，内容如下：\n\n```python\nimport wsgiserver\n\
  # 如果不是独立运行，可以从 cherrypy import wsgiserver 导入\nimport os\nimport django.core.handlers.wsgi\n\
  \nif __name__ == “__main__”:\n    os.environ['DJANGO_SETTINGS_MODULE’] = ‘locate.settings’\n\
  \    server = wsgiserver.CherryPyWSGIServer(\n        ('127.0.0.1’, 8000),\n   \
  \     django.core.handlers.wsgi.WSGIHandler(),\n        server_name=’Lowkate’,\n\
  \        numthreads = 20,\n    )\n    try:\n        server.start()\n    except KeyboardInterrupt:\n\
  \        server.stop()\n```\n\n在 `/usr/share/applications` 中创建一个桌面文件，它将调用脚本启动服务器和\
  \ midbrowser（Firefox 的定制版本）。\n\n```ini\n[Desktop Entry]\nEncoding=UTF-8\nVersion=1.0\n\
  Type=Application\nName=Locate\nComment=Professional Ubuntu Development\nCategories=Application;\n\
  Exec=/usr/bin/locate\nIcon=locate\n```\n\n`locate` 脚本如下：\n```bash\nexport PYTHONPATH=\"\
  /home/ubuntu/Web/django_projects/:$PYTHONPATH”\nexport PYTHONPATH=”home/ubuntu/Web/django_projects/:$PYTHONPATH”\n\
  export DJANGO_SETTINGS_MODULE=locate.settings\npython /home/ubuntu/Web/django_projects/locate/server/run.py\n\
  midbrowser http://127.0.0.1:8000/geo/\n```\n\n点击图 6-7 所示的图标将执行该脚本并启动 geo 应用程序。\n\
  \n`locate` 项目现在应该像这样：\n```bash\nls data media server __init__.py manage.py settings.py\
  \ urls.py\n```\n这是一个完全自包含的环境。\n\n### 测试 Gypsy 到连接\n\n通过向 `/etc/apt/sources.list`\
  \ 添加以下内容：`deb http://ppa.launchpad.net/ianlawrence/ppa/ubuntu jaunty main deb-src\
  \ http://ppa.launchpad.net/ianlawrence/ppa/ubuntu jaunty main` 来安装 gypsy 守护进程和库，然后执行以下操作：\n\
  \n```bash\nsudo apt-get update\nsudo apt-get install gypsy\n```\n\n使用的蓝牙 GPS 设备是\
  \ Nokia Wireless GPS Module LD-3W。与其通信，你需要找到它的地址。确保蓝牙已启用：\n`sudo apt-get install\
  \ bluetooth bluez-utils bluez-gnome gnome-bluetooth libbluetooth2 libbtctl4 libgnomebt0\
  \ nautilus-sendto`\n\n运行以下：\n\n```bash\nuser@host:~$ hcitool scan\n\nScanning ...\n\
  \n00:19:B7:8C:A7:F7 IansPhone\n\n00:02:76:C5:58:B2 Nokia LD-3W\n```\n\n这返回了 GPS\
  \ 设备的地址：`00:02:76:C5:58:B2`。\n\n\n\n\n与 gypsy 守护进程 (`gypsy.py`) 交互以及显示其状态 (`status.py`)\
  \ 的代码由 Ross Burton 编写并分别按照 LGPL 和 GPL 发布。可以通过运行以下命令检出：`$ bzr branch http://burtonini.com/bzr/gypsy-status/`\n\
  \n在 `gypsy.py` 中添加蓝牙地址：\n\n```python\ndbus.mainloop.glib.DBusGMainLoop(set_as_default=True)\n\
  gps = GPS(“00:02:76:C5:58:B2”)\ngps.Start()\n```\n\n然后在目标终端内部，添加以下内容：\n\n```bash\n\
  export DISPLAY=:2\npython status.py\n```\n\n# 第 6 章：应用选择\n\nGPS 的状态如图 6-8 所示，同时还会显示从地图\
  \ API 获取的位置小地图。\n\n图 6-8\n\n### D - Bus 总线和 HTTP 请求\n\n在不启动某种循环（例如调用 `DBusGMainLoop`）的情况下，无法查询\
  \ D - Bus。\n\n你可以在 `status.py` 中看到它。这种循环条件在本地运行的 Web 应用中不会发生，因此需要一些替代方案。\n\nXML\
  \ - RPC 是允许运行在不同操作系统和不同环境中的软件通过互联网进行过程调用的一种方法。它的远程过程调用使用 HTTP 作为传输层，使用 XML 作为编码格式。Django\
  \ 已经提供了一个可用的 XML - RPC 服务器，因此在应用程序内部安装你在 http://code.google.com/p/django-xmlrpc/\
  \ 找到的代码即可。\n\n在 `settings.py` 中创建一个如下的方法：\n\n```python\nXMLRPC_METHODS = (\n   \
  \ # 列出以 (路径, 名称) 形式暴露的方法\n    (‘locate.django_xmlrpc.views.handle_xmlrpc’, ‘handle_xmlrpc’,),\
  \ (‘locate.django_xmlrpc.views.handle_gypsy’, ‘handle_gypsy’,),\n)\n```\n\n在 `django_xmlrc/views.py`\
  \ 中，创建一个如下的方法签名：\n\n```python\n@xmlrpc_func(returns=’string’, args=[‘string’, ‘int’,\
  \ ‘int’, ‘int’,]) def handle_gypsy(timestamp, latitude, longitude, altitude):\n\
  \    “”\"\"\"\"\"\"从 gypsy XML 对象中获取我们需要的值并将其存储在数据库（或文件系统）中\"\"\"\n    data = Raw(time=timestamp,\
  \ lat=latitude, long=longitude, alt=altitude)\n    data.save()\n    # 这返回传入的值（用于调试）\n\
  \    return “The timestamp is %s, the latitude is %i, the longitude is %i, and the\
  \ altitude is %i.” % (timestamp, latitude, longitude, altitude)\n```\n\nXML - RPC\
  \ 客户端需要将 GPS XML 对象传递给在图 6-9 的 Django 管理对话框中显示的 `handle_gypsy` 函数。\n\n图 6-9\n\n\
  同时在 `django_xmlrpc` 应用程序内部创建一个 `models.py` 文件来存储来自 `django.db import models` 的 GPS\
  \ 数据：\n\n```python\nclass Raw(models.Model):\n    time = models.CharField(max_length=200)\n\
  \    lat = models.FloatField()\n    long = models.FloatField()\n    alt = models.FloatField()\n\
  \    def __unicode__(self):\n        return self.time\n```\n\n在 `gypsy.py` 中，添加以下内容：\n\
  \n```python\nimport xmlrpclib\n```\n\n接下来，添加以下内容：\n\n```python\ngps.Start()\nserver\
  \ = xmlrpclib.ServerProxy(‘http://127.0.0.1:8000/xmlrpc/’)\ndef position_changed(fields,\
  \ timestamp, latitude, longitude, altitude):\n    server.handle_gypsy(timestamp,\
  \ latitude, longitude, altitude)\n```\n\n代码将 GPS 数据传递到 Django Web 应用中。剩下的工作是查询数据库获取最后一个\
  \ GPS 位置，以便在 Web 界面中使用。创建一个名为 `geoapp` 的应用程序，并包含如下 `views.py` 文件：\n\n```python\n\
  # 在此处创建你的视图。\nfrom django.http import HttpResponse\nfrom locate.django_xmlrpc.models\
  \ import Raw\nfrom django.shortcuts import render_to_response\n\ndef get_position(request):\n\
  \    latest_GPS = Raw.objects.all().order_by(‘-id’)[:1]\n    return render_to_response(‘location_list.html’,\
  \ {‘latest_GPS’: latest_GPS})\n```\n\n接下来，创建一个模板：\n\n```html\n<<html>\n<head></head>\n\
  <body>\n    {% if latest_GPS %}\n    <ul>\n        {% for co in latest_GPS %}\n\
  \        <li>I am located at <a href=”http://geohash.org/?q={{co.lat}},{{co.long}}”>this</a>\
  \ URL.</li>\n        {% endfor %}\n    </ul>\n    {% else %}\n    No coordinates\n\
  \    {% endif %}\n</body>\n</<html>>\n```\n\n这使用了 `geohash.org`，这是一个由 Gustavo Niemeyer\
  \ 在编写 `geohash.org` Web 服务时发明的经纬度地理编码系统，并被投入了公共领域。它提供了短 URL 来唯一标识地球上的位置，以便在电子邮件、论坛和网站中引用它们时更加方便。\n\
  \n图 6-10 显示了我们在编写这段代码时（以及编写这本书时）所在的位置。\n\n图 6-10\n\n## 总结\n\n本章强调了 OEM 在考虑“外观和感受”时可以针对的一些潜在用户群体……（为了简洁，文本已截断）\n\
  \n# 第 7 章：主题化\n\n主题化允许用户或设备制造商自定义操作系统的外观，以及在某种程度上自定义其感受。\n\n## 什么是主题？\n\n一个 GTK+\
  \ 主题由三部分组成：\n\n- 一个主题引擎（在 Ubuntu 中为 `sapwood`），它是一个共享对象，包含了绘制图形元素的代码\n- 一个用于设置主题引擎操作和\
  \ GTK 核心部分的的配置文件\n- 主题引擎的额外数据文件，例如图像\n\n主题中不包含：\n\n- 图标\n- 背景\n- 字体\n- 声音\n\n*并非所有主题都有额外的图像和数据。*\n\
  \n### 主题位于文件系统的位置？\n\n主题位于 `/usr/share/themes` 或 `.themes` 目录中。\n\n### 什么是主题引擎？它们位于何处？\n\
  \nGTK 引擎用于渲染按钮以及 GTK 窗口内的所有内容。有多个 GTK 引擎，它们位于：`/usr/lib/gtk-2.0/2.10.0/engines/`\n\
  \n其中，Ubuntu MID 软件版本使用了 `sapwood` 引擎（`libsapwood.so`）。`gtk2-engines` 包中包含的其他引擎还有：\n\
  \n- `Clearlooks`，默认 GNOME 主题，基于 Bluecurve\n- `Crux`，以前被称为 `Eazel` 引擎\n- `High contrast`，被某些辅助功能主题使用\n\
  - `Industrial`，来自 Novell（原 Ximian）的著名引擎\n- `LighthouseBlue`，另一个基于 Bluecurve 的引擎\n\
  - `Metal`，提供金属外观\n- `Mist`，一个扁平且高性能的引擎\n- `Redmond95`，提供类似于 Windows 的外观\n- `ThinIce`\n\
  \n\n\n\n\n`Sapwood` 提供了一个用于访问主题图像的服务器和客户端库。服务器负责加载主题相关的图像并将其分发给客户端。与 `Pixbuf` 引擎相比，`Sapwood`\
  \ 节省了内存，因为它通过缓存在应用程序之间共享图像。\n\n`Sapwood` 速度也快得多，因为它使用 `X Server` 对 16 位图像进行平铺处理。\n\
  \n你可以在位置观察到这一点：\n\n`/usr/share/ubuntu-mid-default-settings/mid-gui-start`\n\n在首次检查\
  \ `Compiz` 未启用后，脚本会告诉 `Matchbox Window Manager` 使用 `mobilebasic` 主题：\n\n```bash\n\
  /usr/bin/matchbox-window-manager \\\n-theme /usr/share/themes/mobilebasic/matchbox/theme.xml\n\
  ```\n\n`Compiz` 是一个用于 `X Window System` 的合成窗口管理器，它利用 3D 图形硬件为窗口管理创建桌面效果。\n\n###\
  \ MID 设备启动时会发生什么？\n\n启动时，`upstart` 将执行 `/etc/event.d/session`，该脚本将使用以下命令启动 `X Window\
  \ System`：\n\n```bash\nexec openvt -e -s - su -l ubuntu -c “env -u XDG_SESSION_COOKIE\
  \ startx -- -br”\n```\n\n一旦 `X` 启动，它会解析 `/etc/X11/Xsession.d/` 中的话脚本，包括 `/etc/X11/Xsession.d/25midstartup`\
  \ 文件，其中包含一个调用：\n\n```bash\nMID_GUI=/usr/share/ubuntu-mid-default-settings/mid-gui-start\n\
  ```\n\n在旧版本的 Ubuntu Mobile 中，该文件中存在用于 `GTK+2` 控件主题的环境变量 `GTK2_RC_FILES` 导出，如下所示：\n\
  \n```bash\nexport GTK2_RC_FILES=/usr/share/themes/mobilebasic/gtk-2.0/gtkrc:/usr/share/themes/mobilebasic/gtk-2.0/gtkrc.maemo_af_desktop\n\
  ```\n\n这些文件定义了所有的 `GTK+2` 样式和绑定，创建了应用程序和 `Hildon` 桌面中所有控件的外观。\n\n在 Ubuntu Jaunty\
  \ 上，现在通过将以下 `GConf` 键设置为主题目录名称来更改 `GTK` 主题：`/desktop/gnome/interface/gtk_theme`。例如，可以使用以下命令将其设置为\
  \ `mobiletheme` 或主题目录中的任何其他有效主题：\n\n```bash\ngconftool-2 --set --type string /desktop/gnome/interface/gtk_theme\
  \ mobiletheme\n```\n\n当该键发生变化时，更改将传播到 `xsettings`，并借此所有 `GTK` 应用程序都会收到新主题的通知并立即重绘。在键值更改后启动的\
  \ `GTK` 应用程序将自动开始使用新主题。\n\n`GConf` 在第 4 章中进行了详细讨论，它是一个存储应用程序偏好的系统。它的存在是为了能够更方便地管理应用程序偏好。它还是进程透明的。这意味着在一个应用程序中更改的设置将立即更新所有其他对该设置感兴趣的应用程序。这项技术对于在移动设备上应用一致的用户界面至关重要。\n\
  \n管理 `GConf` 设置最简单的方法是使用 `gconf-editor`：\n\n```bash\nsudo apt-get install gconf-editor\n\
  gconf-editor\n```\n\n这会根据可用设置显示一个界面。除了使用前端 `gconf-editor` 外，还可以使用 `gconftool` 检查设置。运行以下命令：\n\
  \n```bash\ngconftool-2 -R /desktop/gnome\n```\n\n这将显示 `Ubuntu Mobile Desktop` 设置。运行以下命令：\n\
  \n```bash\ngconftool-2 --get-default-source\n```\n\n这显示了 `XML` 后端的位置，`GConf` 使用其作为数据库。\n\
  \n### 修改主题\n\n通常需要自定义主题，特别是当与 `OEM` 工作时。在在此之前，你可能想阅读《GNOME 人机交互指南视觉设计》，地址为 [`library.gnome.org/devel/hig-book/stable/`](http://library.gnome.org/devel/hig-book/stable/)，其开头如下：\n\
  \n视觉视觉设计不仅仅是为了让你的应用程序看起来漂亮。良好的视觉设计关乎交流。设计良好的应用程序会让用户轻松理解所呈现的信息，并清晰地向他们展示如何与这些信息交互。\n\
  \n将上述引言中的“应用程序”替换为“主题”，你就会对主题化的目标有一个很好的理解。\n\n### 制作主题时的实用工具\n\n以下 bash 脚本显示了当前主题的信息。在处理主题和\
  \ `GConf` 时使用它非常有用。\n\n首先，安装 `zenity`，它是一个实用的 `GTK` 控件套：\n\n```bash\nsudo apt-get\
  \ install zenity\n```\n\n调用接下来的脚本 `get_theme_info.sh` 并通过 `./get_theme_info.sh`\
  \ 执行它（在赋予执行权限后）：\n\n```bash\n#!/bin/bash\nicons=$(gconftool-2 -g /desktop/gnome/interface/icon_theme)\n\
  theme_gtk=$(gconftool-2 -g /desktop/gnome/interface/gtk_theme)\ntheme_metacity=$(gconftool-2\
  \ -g /apps/metacity/general/theme)\nfont_gtk=$(gconftool-2 -g /desktop/gnome/interface/font_name)\n\
  font_meta=$(gconftool-2 -g /apps/metacity/general/titlebar_font)\nzenity --info\
  \ --text “\nicons: $icons\nGTK theme: $theme_gtk\nmetacity theme: $theme_metacity\n\
  gtk font: $font_gtk\nmetacity font: $font_meta\nProfessional Ubuntu Mobile Development”\n\
  ```\n\n结果显示了图 7-1 所示的信息。\n\n### 主题结构\n\n本节探讨了 `Ubuntu MID` 移动主题。该主题基于 `Hildon` 的主题结构，`Ubuntu`\
  \ 从上游继承了它。布局（来自 `/usr/share/themes/mobilebasic/`）如下：\n\n`/usr/share/themes/mobilebasic/gtk-20/index.theme`\n\
  `gtkrc`\n`gtkrc.cache`\n`images/`\n`matchbox/`\n`theme.xml`\n\n该结构中的两个主文件是 `theme.xml`\
  \ 和 `gtkrc`。\n\n#### theme.xml 文件\n\n通过修改 `theme.xml` 文件内部来实现简单的窗口装饰。它定义了如主栏装饰以及一些对话框装饰。`theme.xml`\
  \ 中的三种基本资源是：\n\n- 颜色\n- 字体\n- 图像\n\n在使用它们之前，按照格式 `<type id=\"object name\" definition=\"\
  data\"/>` 声明它们，其中 `type` 是颜色、`font`、`pixmap` 等，`id` 是对象的唯一名称，`definition` 是要设置的元数据。\n\
  \n颜色定义如下：\n\n```xml\n<color id=\"osso-DialogTextColor\" def=\"#ffffff\"/>\n```\n\
  \n字体定义如下：\n\n```xml\n<font id=\"osso-TitleFont\" def=\"Nokia Sans-17.85\"/>\n```\n\
  \n图像定义如下：\n\n```xml\n<pixmap id=\"dialoguptile\" filename=\"../images/qgn_plat_dialog_frame_tile_top.png\"\
  />\n```\n\n#### gtkrc 文件\n\n更复杂的自定义涉及更改 `gtkrc` 文件。该文件适用于 `Ubuntu Netbook Remix`\
  \ 和 `Ubuntu MID` 的主题；概念上，认为 `GTK` 主题“生活”在 `gtkrc` 文件中。文件格式对大小写敏感，注释用 `#`（井）标记。也可以使用类似于\
  \ C 语言的 `/* */` 进行多行注释。\n\n*此 gtkrc 文件对拼写错误和错误并不宽，因此在更改代码时要小心。*\n\n#### 自定义 gtkrc\
  \ 文件\n\n以下 `gtkrc` 文件将主题应用于所有控件（按钮、滚动条、编辑框）。技术上，每个控件都派自 `GtkWidget`。这意味着更改 `GtkWidget`\
  \ 的属性将影响所有控件，并且适用于继承概念。`GtkButton` 的属性也会应用于 `GtkCheckButton` 等，除非显式说明其他。完整的 `GTK`\n\
  \n\n\n\n类级结构请参考 http://library.gnome.org/devel/gtk/stable/ch01.html。\n\n它是通过指定一个\
  \ `style`（样式）来实现的。样式既可以应用于 GTK 主题系统本身（如下面代码所示），也可以应用于主题所使用的特定主题“ 引擎”（在 Ubuntu Netbook\
  \ Remix、Murrine，以及使用 Ubuntu MID 和 sapwood 的情况下），如下所示：style “default-style”\n\n```bash\n\
  # 通过修改 x/y 厚度来确定文本与控件边框之间的内边距。\nxthickness = 2\nythickness = 2\n\n# 滑块条上的样式\nGtkRange::slider-width\
  \ = 15\n\n# 将背景设置为浅灰色\nbg[NORMAL] = “#f6f6f6”\n\n# 将前景色设置为黑色\nfg[NORMAL] = “#000000”\n\
  ```\n\nclass “GtkWidget” style “default-style”\n\n这段代码创建了一个名为 `default - style`\
  \ 的样式，然后在组件上设置了一些内边距，对滑块条进行样式化，设置了一些颜色，并使用 `GtkWidget` 类应用了该样式。这些将在后续章节中解释。\n\n\
  ### 内边距 (Padding)\n这使用 `x,y` 坐标系设置内边距。\n\n### 样式 (Styles)\n样式属性的格式为：\n`WidgetName::style-property-name\
  \ = VALUE`\n\n前面的滑块看起来如下：\n`GtkRange::slider-width = 15`\n\nMID 上 mobilebasic 主题的全局图片样式如下：\n\
  \n```bash\n# 全局图片主题。\nGtkWidget::hildon-focus-handling = 1\nGtkWidget::focus-line-width\
  \ = 0\nGtkWidget::focus-padding = 0\n```\n\n### 颜色 (Colors)\n可以更改 `gtkrc` 文件中的某些部分以匹配我们的主题颜色。在前面的代码中，颜色采用以下格式：\n\
  `bg[NORMAL] = “#f6f6f6”`\n\n`bg` 代表背景。下表描述了四个有效类别：\n\n| 类别 | 用途 |\n| :--- | :---\
  \ |\n| fg | 前景色。用于按钮上的文本。在某些引擎中也用于按钮边框。 |\n| bg | 背景色。这是窗口和按钮的背景颜色。 |\n| text |\
  \ 文本输入控件和列表的字体。 |\n| base | 文本控件和列表的背景颜色。 |\n\n### 应用样式\n在 GTK 中，有三种应用样式的方法——`class`、`widget_class`\
  \ 和 `widget` 语句，其中 `class` 和 `widget` 是最重要的。\n\n在前面的代码中，样式通过此调用应用：\n`class “GtkWidget”\
  \ style “default-style”`\n\n在查找与当前组件相关的样式时，会应用组件层级结构，因此样式将应用于与代码中的名称匹配的任何组件类。该层级结构如下（按重要性排序）：\n\
  \n* `GtkWidget`\n* `GtkContainer`\n* `GtkBin`\n* `GtkButton`\n* `GtkToggleButton`\n\
  \n在前面的示例中，样式被应用于顶层组件（`GtkWidget`），然后向下级联。\n\n这里不介绍使用 `widget_class` 应用样式的方法。`widget`\
  \ 匹配作用于组件名称。如果应用程序中某个特定的组件需要修改，这会非常有用。\n\nGTK 按照前面的顺序应用不同的“样式”。后合并的样式将覆盖早期的设置。这是合理的，因为\
  \ `class` 匹配范围很广，而 `widget` 匹配非常具体，通常只挑出一个特定的组件。\n\n### 为 Ubuntu MID 设置主题\n你可以通过两种方式进行主题定制：手动和自动。\n\
  \n#### 手动为 MID 设置主题\n要从基于 Ubuntu MID 上现有 mobilebasic 主题的基础创建一个主题，请将默认的 mobilebasic\
  \ 主题复制到名为 `pumd-theme` 的新目录，然后将其移动到 `Matchbox` 目录。\n\n也可以使用 `hildon-theme-tools`\
  \ 和命令 `hildon-theme-bootstrap` 来创建并打包新主题。这在“ 自动为 MID 设置主题 ”章节中进行了解释。\n\n```bash\n\
  $ cd /usr/share/themes/\n$ sudo mkdir pumdtheme\n$ sudo cp -r mobilebasic/* pumdtheme\n\
  $ cd pumdtheme/matchbox\n```\n\n打开此文件夹中的 `theme.xml` 文件，首先将元数据的第一行更改为：\n```xml\n\
  <theme name=”pumdtheme” author=”Ian Lawrence” desc=”A theme created for the book\
  \ Professional Ubuntu Mobile Development, published by Wiley” version=\"0.1” engine_version=”1”\
  \ cache=”false” >\n```\n\n接下来，更改以下内容：\n```xml\n<color id=”osso-TitleTextColor” def=”#eec73e”\
  \ />\n<color id=”osso-DialogTitleTextColor” def=”#403008” />\n```\n\n对于新的 MID 主题，将\
  \ `gtk-20` 文件夹下 `gtkrc` 文件中的颜色定义更改以下内容：\n```bash\ncolor[“DefaultTextColor”] = “#eec73e”\n\
  color[“EmpTextColor”] = “#204a87”\ncolor[“PaintedDefaultTextColor”] = “#ffffff”\n\
  color[“DisabledTextColor”] = “#babdb6”\ncolor[“ProgressTextColor1”] = “#000000”\n\
  color[“ProgressTextColor2”] = “#000000”\ncolor[“SecondaryTextColor”] = “#5a5a5a”\n\
  color[“TextColor”] = “#000000”\ncolor[“DialogTitleTextColor”] = “#403008”\n```\n\
  这些步骤更改了菜单中的字体。\n\n现在打开目录下的 `index.theme` 并将其更改为：\n```ini\n[Desktop Entry]\nType=X-Hildon-Metatheme\n\
  Name=PumdTheme\nIcon=/usr/share/themes/pumdtheme/images/theme_thumbnail.png Encoding=UTF-8\n\
  [X-Hildon-Metatheme]\nGtkTheme=pumdtheme\nIconTheme=gnome\nX-MatchboxTheme=pumdtheme\n\
  X-OperaSkin=default.zip\n```\n\n同时修改 images 文件夹中的图片。处理图片时非常有用的工具叫做 `xmag`。它由 `x11-apps`\
  \ 提供。`x11apps` 提供了随 X 系统的一系列应用程序，用于基准测试（见主题性能测试章节）。\n\n完成上述更改并修改相应的图片将创建一个主题。例如，图\
  \ 7-2 所示的主题基于 Ubuntu MID 的 Intrepid 版本。如果没有新图片要添加，可以通过打开终端（终端颜色）清楚地看到更改。\n\n可以在用户主目录下包含\
  \ `.gtkrc-2.0` 文件来加载主题（这是因为加载了图标的 XSETTINGS）。XSETTINGS 是 Linux 上的一种机制，允许配置设置并在运行时将这些设置传播到所有应用程序。\n\
  \n用户主目录下的简单 `gtkrc-2.0` 文件可以作为一个包含文件，如下：\n```bash\ninclude “/usr/share/themes/pumdtheme/gtk-2.0/gtkrc”\n\
  ```\n\n#### 自动为 MID 设置主题\n在上一节中，我们手动为 MID 设置了主题。可以通过 `hildon-theme-tools` 包来自动化此过程。该包通过\
  \ `apt` 安装：`$ sudo apt-get install hildon-theme-tools`\n\n该包包含了用于 Ubuntu MID 主题的各种工具。首先安装\
  \ subversion 包\n```bash\n$ sudo apt-get install subversion\n```\n然后运行：\n```bash\n\
  $ hildon-theme-boostrap\n```\n这将骨架主题下载到指定的目录。进入模板目录并使用 GIMP 等图像编辑器编辑 `template.svg`。\n\
  \n*请确保选择第二个选项 2) hildon-theme-layout-4，因为 MID 不支持 layout-3。*\n\n\n\n\n接下来，为了构建该主题的\
  \ Debian 包，需要修改 `debian` 文件夹中的一些内容。在 `control` 文件中，删除对 `hildon-theme-cacher` 的依赖。在\
  \ `postinst` 文件中，删除 `DEBHELPER` 上方的行，该行调用了主题缓存实用程序：*`hildon-theme-cacher` 缓存 `gtkrc`\
  \ 文件 —— 它在 Ubuntu MID 上并不使用。*\n\n# 第 7 章：主题化\n\n接下来，安装构建主题包所需的依赖：\n\n```bash\nsudo\
  \ apt-get install fakeroot hildon-theme-layout-4 cdbs debhelper dpkg-dev\n```\n\n\
  运行以下命令来构建包：\n\n```bash\ndpkg-buildpackage -tc -rfakeroot\n```\n\n这将创建一个一个 `.tar.gz`\
  \ 和一个 `.deb` 文件 —— 例如，`hildon-theme-pumd_4.2.0-1_all.deb`。\n\n数据目录下的 `Makefile.am`\
  \ 调用了 `hildon-theme-subst`（`hildon-theme-tools` 包中的另一个工具），它用于对 `gtkrc` 文件进行替换。\n\
  \n生成的 `.deb` 包可以上传到 PPA 或使用以下命令进行本地安装：\n\n```bash\ndpkg -i hildon-theme-pumd_4.2.0-1_all.deb\n\
  ```\n\n## 为 Ubuntu Netbook Remix 设置主题\n\n为 Ubuntu Netbook Remix 设置主题的方法与为 Ubuntu\
  \ 主发行版设置主题的方法相同。\n\n实际上，本节提到的主题是一个 XFCE 主题，由于 XFCE 使用 `Murrine` 引擎，它在 UNR 上也能良好运行。\n\
  \n主题本身基于名为 `MurrinaSegPhault v0.02` 的现有主题，该主题本身由两个引擎组成 —— `Murrine` 和 `Clearlooks`。这是一个非常创新的技术；它使用\
  \ `Clearlooks` 渲染引擎处理特定的部件，并使用 `Murrine` 处理其他所有内容（感谢 arstechnica 的 Ryan Paul 这一发现）。\n\
  \n为了让其生效，需要在 `gtkrc` 文件的样式块内部指定要覆盖默认设置的引擎，如下所示：\n\n```style\nstyle “theme-notebook”\
  \ = “theme-wide”\n{\n  base[SELECTED] = “#e3bd3b” # 标签颜色\n  bg[ACTIVE] = “#e4d79e”\
  \ # 未选中的标签\n  engine “clearlooks” {\n    style = GLOSSY\n  }\n}\n```\n\n`engine`\
  \ 关键字用于指定渲染特定元素所需的主题引擎，随后的大括号可用于设置该引擎的特定选项。\n\n实际包 `xfce4-theme-ubuntu-golden.deb`\
  \ 的创建将在第 5 章介绍。\n\n要查看该主题的实际 `gtkrc` 文件，请向 `/etc/apt/sources.list` 添加：\n\n```deb\
  \ http://ppa.launchpad.net/ianlawrence/ppa/ubuntu jaunty main deb-src http://ppa.launchpad.net/ianlawrence/ppa/ubuntu\
  \ jaunty main\n```\n然后执行：\n\n```bash\nsudo apt-get update && apt-get source xfce4-theme-ubuntu-golden\n\
  ```\n下文将解释 Ubuntu Netbook Remix（UNR）系统的其他部分也是可以进行自定义的。\n\n## 启动闪屏 (Boot Splash)\n\
  \nUsplash 是一个在启动时绘制启动屏幕并带有进度动画（throbber）的应用程序，用于显示启动过程。\n\n要对其进行自定义，使用以下代码下载 `usplash`\
  \ 主题源码（此处为 `usplash-theme-ubuntu`）：\n\n```bash\nsudo apt-get source usplash-theme-ubuntu\n\
  ```\n\n进入文件夹并自定义图像。可以选择创建新图像（颜色深度最大为 256 色）并自定义 `usplash-theme-ubuntu.c`。完成更改后，运行：\n\
  \n```bash\nsudo dpkg-buildpackage -d\n```\n\n这将创建一个新的 `usplash` 包。\n\nKarmic 的 usplash\
  \ 只会在某些原因需要延迟启动过程时使用 —— 例如对文件系统进行 `fsck` 或询问加密密码。`usplash` 正在被 `xsplash` (https://edge.launchpad.net/xsplash)\
  \ 取，这是 Canonical 编写的一个新工具，旨在尽可能启动 X Server 以加速启动过程。\n\n## 创建 gdm 主题\n\n可以为 UNR 创建自定义的\
  \ `gdm` 主题 —— 如图 7-3 所示。\n\n该主题由一些图像组成（背景、截图和一些图标）以及一个 `GdmGreeterTheme.desktop`\
  \ 文件，还有一个包含主题布局信息的 XML 文件。\n\n学习如何为 Gnome 显示管理器（Gnome Display Manager）设置主题的一种好方法是获取\
  \ Gnome 显示管理器的源码。\n\n## 自定义笔记本 (Netbook)\n\n可以为 UNR 创建自定义的 `gdm` 主题 —— 如图 7-3 所示。\n\
  \n该主题由一些图像组成（背景、截图和一些图标）以及一个 `GdmGreeterTheme.desktop` 文件，还有一个包含主题布局信息的 XML 文件。\n\
  \n生成的 `.deb` 包可以上传到 PPA 或使用以下命令进行本地安装：`dpkg -i hildon-theme-pumd_4.2.0-1_all.deb`。\n\
