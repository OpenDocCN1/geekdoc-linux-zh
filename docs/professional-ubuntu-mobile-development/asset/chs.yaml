  \ PM\n\n## 关于作者\n\n**Ian Robert Lawrence** 是诺基亚技术学院（Instituto Nokia de Tecnologia）的\
  \ Scrum 大师。他是 Ubuntu Brazil 和 Debian Amazonas 社区的创始成员，目前正在坎皮纳州大学（UNICAMP）攻读技术创新战略管理的\
  \ MBA 学位。\n\n**Rodrigo Cesar Lopes Belem** 是一位自由软件开发者和倡导者，曾为 Enlightenment 和 Ubuntu\
  \ 等许多开源项目做出贡献。他自 2001 年起一直从事自由软件，目前在诺基亚技术学院担任软件开发者。他正在亚马逊马纳斯联邦大学学习计算机科学学位，并持有 LPIC\
  \ 2 级证书。\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\nffirs.indd vii\n\
