  \n在 p2p.wrox.com 参与讨论\n\nWrox **Programmer to Programmer™**\n\n## 开源专业级软件开发者的必读物\n\
  \n作为今天最流行的开源操作系统，`Ubuntu Linux` 最近发布了针对设备制造商的版本，这些制造商构建基于 `Atom` 和 `ARMEL` 处理器的互联网就绪手持设备。这本令人兴奋的书提供了你在定制移动互联网设备时需要理解的工具和技术概述，并为你提供了分步的教程，引导你完成一些常见任务。该书由\
  \ Ubuntu Mobile 社区开发者编写，首先概述了\n\n**wrox.com**\n\n**Ubuntu**\n\n移动 Linux 景观的概述，然后介绍了如何为**程序员**级移动设备进行设置、开发、打包和构建发行版。\n\
  \n**论坛**\n\n**加入我们的程序员社区**\n\n- 讨论了为什么设备的外观和感受如此重要\n- 回顾了如何选择正确的应用程序\n- **程序员论坛，用于提问和回答关于本书的编程问题，加入关于行业热门话题的讨论，**\n\
  - 展示了如何为移动设备开发应用程序\n- 解释了准备应用程序进行分发以及与世界各地的程序员建立联系的方法\n- 提供了微调内核的技术\n- 引导你“定制”并构建你自己的发行版\
  \ **代码下载**\n- 讨论了如何进行稳定性和性能测试。利用本书中的免费代码示例以及来自数百本其他书籍的代码示例，所有代码均可用。\n\n## 专业版\n\n\
