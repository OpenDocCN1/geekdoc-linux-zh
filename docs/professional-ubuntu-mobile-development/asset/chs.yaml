  \n如果需要具有全网络支持的虚拟机，或者主机上将运行许多虚拟机，则有必要设置桥接和交换机来连接主机和客户机。\n\n以下配置可用于 VirtualBox 和 KVM/QEMU\
  \ 的高级网络设置。\n\n首先，在主机上安装 `vde2` 和 `dnsmasq`：\n\n```bash\nsudo apt-get install vde2\
  \ dnsmasq\n```\n\n`VDE` 是一个可以连接多个虚拟机的虚拟交换机，而 `dnsmasq` 是一个小型缓存 DNS 代理和 DHCP/TFTP\
  \ 服务器。\n\n接下来，在主机的 `/etc/network/interfaces` 中添加以下行。后续代码段中的名称 `qtap0` 可以命名为你喜欢的任何名称，因为它是一个虚拟连接，在硬件上并不真实存在。同样，选择\
  \ `172.12.120.1` 地址是因为它不常见，不太可能与计算机连接的任何其他网络发生冲突。你可以在这里选择任何内容：\n\n```text\nauto\
  \ qtap0\niface qtap0 inet static\naddress 172.12.120.1\nnetmask 255.255.255.0\n\
  vde2-switch -\npost-up /etc/init.d/dnsmasq start\n# 允许访问网络\npost-up /sbin/sysctl\
  \ -w net.ipv4.ip_forward=1\n# 假设连接到网络的网络接口是 eth0\npost-up /sbin/iptables -t nat\
  \ -A POSTROUTING -o wlan0 -j MASQUERADE\n\n# 关闭网络访问\npost-down /etc/init.d/dnsmasq\
  \ stop\npost-down /sbin/sysctl -w net.ipv4.ip_forward=0\npost-down /sbin/iptables\
  \ -t nat -F\n```\n\n子网掩码之后的是如 `pre-up` 等操作，这些操作将在网络配置期间并在接口启用之前执行。要查看可以添加到此文件的更多选项，请参考以下内容：\n\
  \n```bash\nman interfaces\n```\n\n接下来，你设置 DNS 和缓存服务器。为此，请编辑位于 `/etc/dnsmasq.conf`\
  \ 的 `dnsmasq` 配置文件并找到接口（第 85 行）：\n\n```text\n#interface=\n```\n\n将其更改为：\n\n```text\n\
  interface=qtap0\n```\n\n或者更改为为此接口选择的任何名称。然后查找第 147 行：\n\n```text\n#dhcp-range=192.168.0.50,192.168.0.150,12h\n\
  ```\n\n将其修改如下：\n\n```text\ndhcp-range=172.12.120.100,172.12.120.150,12h\n```\n\n\
  保存文件并重启主机上的网络：\n\n```bash\nsudo /etc/init.d/networking restart\n```\n\n* 正在重新配置网络接口...\n\
  * 正在重启 DNS 器和 DHCP 服务器 dnsmasq\n...完成。\n[ OK ]\n\n现在当你运行 `ifconfig` 时，你可以看到新的网络接口：\n\
  \n```bash\nifconfig\n```\n\n```text\nqtap0 Link encap:Ethernet HWaddr d2:3d:a9:96:88:36\n\
  inet addr:172.12.120.1 Bcast:172.12.120.255 Mask:255.255.255.0\ninet6 addr: fe80::d03d:a9ff:fe96:8836/64\
  \ Scope:Link\nUP BROADCAST RUNNING MULTICAST MTU:1500 Metric:1\nRX packets:0 errors:0\
  \ dropped:0 overruns:0 frame:0\nTX packets:29 errors:0 dropped:0 overruns:0 carrier:0\n\
  collisions:0 txqueuelen:500\nRX bytes:0 (0.0 B) TX bytes:5836 (5.8 KB)\n```\n\n\
  还有必要将你的用户名添加到主机以及 `vde2-net` 组，并注销重新登录：\n\n```bash\nsudo adduser username vde2-net\n\
  logout\n```\n\n### 在 VirtualBox 中使用桥接\n\n在 VirtualBox 管理控制中，进入虚拟机的设置并选择网络。适配器需要连接到之前创建的\
  \ `qtap0` 接口。在下拉菜单中，选择 `Host Interface`（主机接口），并在底部选项卡中选择 `qtap0`，如图 2-19 所示。\n\n\
  现在当虚拟机启动时，它将使用 `qtap0` 接口。通过查看位于 `/var/lib/misc/dnsmasq.leases` 的 `dnsmasq.leases`\
  \ 文件，或者在客户机上打开终端并运行 `ifconfig` 来查找客户机的 IP 地址。之后，就可以像示例所示 ssh 登录客户机：\n\n```bash\n\
  ssh 172.12.120.1 username\n```\n\n文件可以如下所示从主机拷贝到客户机：\n\n```bash\nscp d.tar.gz username@172.12.120.150:/home/\n\
  ```\n\n客户机现在可以 ping 通主机了。\n\n### 在 KVM 中使用桥接\n\n为了使用这个新接口，使用以下命令启动 KVM：\n\n```bash\n\
  vdekvm -localtime -net vde,vlan=0 -net nic,model=virtio,vlan=0,macaddr=00:16:3e:12:34:56\
  \ -hda disk.img\n```\n\n前一个命令中的 `macaddr` 可以是任何地址；当只使用一个虚拟机时，没有指定 MAC 地址。然而，对于多个虚拟机，这变得非常重要。建议从\
  \ `00:16:3e:xx:xx:xx` 范围选择一个地址，因为该范围已分配给虚拟化。\n\n为了配合 QEMU 使用该接口，请使用以下命令：\n\n```bash\n\
  kqemu -hda disk.img -net vde,vlan=0,sock=/var/run/vde2/qtap0 -net nic,model=virtio,vlan=0,macaddr=52:54:00:12:34:56\
  \ -m\n```\n\n在主机上输入：\n\n```bash\nssh 172.12.120.15 username\n```\n\n以 ssh 登录客户机。上面的\
  \ IP 只是一个示例。文件可以这样拷贝：\n\n```bash\nscp d.tar.gz username@172.12.120.1:/home/\n```\n\
  \n客户机现在可以 ping 通主机了。\n\n### 在客户机和主机之间共享文件\n\n如果你遵循了“VirtualBox 中的网络设置”或“KVM/QEMU\
  \ 中的网络设置”章节中的简单网络步骤，可以通过输入以下命令从主机计算机拷贝文件到客户机：\n\n```bash\nscp -P 2222 username@localhost:/home/\n\
  ```\n\n然而，也可以使用 `sshfs` 拷贝文件。这通过在主机上安装 `sshfs` 实现：\n\n```bash\nsudo apt-get install\
  \ sshfs\n```\n\n然后在主机上运行该命令：\n\n```bash\nsshfs -p 2222 username@localhost:/home/\n\
  ```\n\n如果你想自动挂载用户主目录，请向 `/etc/fstab` 中添加以下行：\n\n```text\nusername@localhost:/home/\
  \ /media/guest-home fuse user,noauto 0\n```\n\n然后将当前登录的用户添加到 `fuse` 组：\n\n```bash\n\
  adduser username fuse\n```\n\n注销并重新登录以应用更改。现在你可以通过以下命令挂载客户机的主目录：\n\n```bash\nmount\
  \ /media/guest-home\n```\n\n现在文件可以通过此挂载点从主机拷贝到客户机，反之亦然。本节提到的所有内容适用于简单网络。如果你遵循了“VirtualBox\
  \ 和 KVM/QEMU 中的高级网络设置”章节，则需要稍微不同的步骤。\n\n### 高级网络下客户机与主机之间的文件共享\n\n如果你想使用 `scp` 从客户机拷贝文件到主机，可以使用：\n\
  \n```bash\nscp username@172.12.120.1:/home/\n```\n\n要从主机拷贝文件到客户机，首先获取客户机 IP 地址，然后在主机上运行：\n\
  \n```bash\nscp username@172.12.120.100:/home/\n```\n\n上述 `sshfs` 方案适用于高级网络。首先在主机上安装\
  \ `sshfs`：\n\n```bash\nsudo apt-get install sshfs\n```\n\n然后在客户机上运行以下命令：\n\n```bash\n\
  sshfs username@172.12.120.100:/home/username ~/devel\n```\n\n将主机上当前登录的用户添加到 `fuse`\
  \ 组：\n\n```bash\nadduser guest fuse\n```\n\n注销并重新登录以应用更改。现在你可以通过向 `/etc/fstab` 添加以下行来挂载主机的主目录：\n\
  \n```text\nusername@172.12.120.1:/home/username /media/host-home fuse user,noauto\
  \ 0\n```\n\n并挂载：\n\n```bash\nmount /media/host-home\n```\n\n如果你想在启动时挂载用户主目录，请向 `/etc/fstab`\
  \ 中添加以下行：\n\n```text\nusername@172.12.120.1:/home/username /media/host-home fuse\
  \ defaults,allow_other 0 0\n```\n\n[/content]\n\n\n\n\n# 第 2 章：开发环境\n\n如果你不想在每次使用\
  \ `scp` 复制文件或使用上述挂载解决方案时都出现密码提示，你需要设置无密码的 ssh 密钥。在主机上输入：\n\n```bash\nssh-keygen\
  \ -t rsa\n```\n\n在提示输入密码时直接按 `Enter` 即可。然后在主机上运行以下命令：\n\n```bash\nssh-copy-id -i\"\
  /home/<host username>/.ssh/id_rsa.pub -p 2222 <username>@localhost\"\n```\n\n现在你可以进行\
  \ `ssh` 连接、复制和挂载，而无需被询问密码。\n\n## 构建你自己的虚拟机镜像\n\n与其使用 `cdimage.ubuntu.com` 预制的镜像，你可以自己构建虚拟机镜像。要这样做，请安装名为\
  \ `ubuntu-vm-builder` 的工具：\n\n```bash\nsudo apt-get install ubuntu-vm-builder\n\
  ```\n\n然后按如下方式运行：\n\n```bash\nsudo ubuntu-vm-builder kvm jaunty --mem=512 --user\
  \ <username> --pass <password> --addpkg openssh-server\n```\n\n这会为 Jaunty 创建一个最小的\
  \ KVM 虚拟机，添加一个带有密码的用户，并在镜像中添加 `openssh-server` 包。通过这种方式创建虚拟镜像对于提供干净的测试环境非常有用。如果将前面的命令与本地仓库镜像结合使用，速度也会非常快：\n\
  \n```bash\nsudo ubuntu-vm-builder kvm jaunty --mem=512 --user <username> --pass\
  \ <password> --addpkg openssh-server --mirror http://localhost:9999\n```\n\n该命令会创建一个包含两个文件的文件夹：`disk0.qcow2`（QEMU\
  \ 镜像）和一个名为 `run.sh` 的脚本。按如下方式执行脚本：\n\n```bash\n./run.sh\n```\n\n这会将 `qcow` 镜像作为参数传递给\
  \ QEMU。\n\n## 镜像操作\n\nUbuntu-Mobile 团队提供了一些脚本，你可以在 `https://code.edge.launchpad.net/~ubuntu-mobile-dev/ubuntu-mobile/mobile-scripts`\
  \ 的 `mobile-scripts` 包中找到它们。Ubuntu Mobile 开发者在处理镜像时会使用这些脚本。要获取这些脚本，请先安装 Bazaar，这是一种被\
  \ Ubuntu 和许多其他软件项目使用的源码管理工具：\n\n```bash\nsudo apt-get install bzr\n```\n\n接下来，使用\
  \ Bazaar 检出脚本：\n\n```bash\nbzr branch lp:~ubuntu-mobile-dev/ubuntu-mobile/mobile-scripts\n\
  ```\n\n这将创建一个名为 `mobile-scripts` 的文件夹，其中包含一个名为 `image-tools` 的子文件夹。使用的脚本有：\n\n-\
  \ `create-image.sh`\n- `edit_squashfs.sh`\n- `grow_image.sh`\n\n## 构建你自己的镜像\n\n\
  从 `cdimage.ubuntu.com` 下载的实际镜像由文件系统组成，在嵌入式开发中通常是 `squashfs`。`squashfs` 是一种压缩的只读文件系统，对于处理嵌入式环境中常见的受限硬盘和内存系统非常有用。\n\
  \n对于 Ubuntu Mobile，这个 `squashfs` 文件系统将包含一个安装（例如 Ubuntu MID 安装）、内核、`initramfs`（临时文件系统的特殊实例）以及\
  \ `syslinux` 安装（`syslinux` 是一个引导加载程序）。\n\n要创建镜像，必须先创建一个 `squashfs` 文件系统。为此，安装 `livecd-rootfs`：\n\
  \n```bash\nsudo apt-get install livecd-rootfs\n```\n\n然后以 root 身份运行 `livecd-rootfs`\
  \ 脚本之一 `livecd.sh`：\n\n```bash\nsudo livecd.sh -d karmic -a lpia ubuntu-mid\n```\n\
  \n脚本 `livecd.sh` 安装在 `/usr/sbin/` 目录下，该目录在 `$PATH` 中。这意味着可以在任何目录调用该脚本，无需用户提供完整路径。上述命令是在\
  \ Ubuntu karmic 上运行的。\n\n这将下载并构建 LPIA 的 `squashfs` 文件系统。然而，下载可能需要一些时间。使用本地镜像会有帮助：\n\
  \n```bash\nsudo livecd.sh -d karmic -a lpia -m http://localhost:9999 ubuntu-mid\n\
  ```\n\n创建本地镜像的方法将在第 11 章中介绍。\n\n下载完成后，将创建以下文件和文件夹：\n\n- `chroot-livecd`\n- `livecd.ubuntu-mid.manifest`\n\
  - `livecd.ubuntu-mid.manifest-desktop`\n- `livecd.ubuntu-mid.sort`\n- `livecd.ubuntu-mid.squashfs`\n\
  - `livecd.ubuntu-mid.initrd`\n- `livecd.ubuntu-mid.initrd-lpia`\n- `livecd.ubuntu-mid.kernel`\n\
  - `livecd.ubuntu-mid.kernel-lpia`\n\n现在可以使用 `mobile-scripts` 中的脚本之一（`create-image.sh`）来实际创建镜像。确保脚本与上述文件位于同一文件夹中，并且设置了执行权限：\n\
  \n```bash\nchmod +x create-image.sh\n./create-image.sh ubuntu-mid 40\n```\n\n其中\
  \ `ubuntu-mid` 是要构建的发行版，`40` 是分配在镜像中的额外空间（MB）。也可以使用 `edit_squashfs.sh` 脚本（所示）来修改镜像的大小。\n\
  \n```bash\nsudo ubuntu-vm-builder kvm jaunty --mem=512 -hda ubuntu-mid\n```\n\n\
  ## 在镜像内安装应用程序\n\n`mobile-scripts` 中的 `edit_squashfs.sh` 脚本会在构建的镜像内部启动一个 root shell。此时可以运行\
  \ `apt-get update` 并安装软件包。通过 `Ctrl+D` 或 `exit` 命令退出 shell 后，脚本将提议为你重新制作 squashfs。脚本的使用方法如下：\n\
  \n```bash\nsudo edit_squashfs.sh ubuntu-mid\n```\n\n在 chroot 内部退出之前运行 `apt-get clean`\
  \ 是一个好习惯，可以清理 `/var/cache/apt/archives` 中的空间。安装新软件包的可用空间是 `create-image.sh` 命令中指定的（40MB）。如果需要增加此空间，请使用\
  \ `grow_image.sh script`。\n\n## 增加下载镜像的大小\n\n要增加已下载镜像的大小（可能是为了安装更多应用程序），请使用 `grow_image.sh`\
  \ 脚本。\n\n创建此脚本是为了满足一种潜在用例：OEM 想要修改设备上的应用程序可能可能是主题，但不想修改内核或种子（seeds）。种子将在第 11 章中详细讨论。\n\
  \n你可以如下方式使用该脚本：\n\n```bash\n./grow_image.sh ubuntu-mid.img 50\n```\n\n这将创建一个指定大小（50MB）的新镜像，然后可以在该镜像上运行\
  \ `edit_squashfs.sh` 脚本以进行必要的更改并重新制作镜像。\n\n## 总结\n\n移动开发可能具有挑战性。你可能需要使用工作站为具有不同处理器的设备进行开发，例如\
  \ Ubuntu ARM 或不同的操作系统。创建一个镜像（或从存档下载镜像）并在 VirtualBox 或 KVM/QEMU 中运行它将提供一个隔离的环境。该环境随后可以用于软件开发、软件测试或应用程序打包。\n\
  \n\n\n\n移动设备现在配备了摄像头、各种无线电发射器、先进的多媒体功能和其他特性——所有这些都会消耗大量的电量。与此同时，利用这些功能的高耗电应用程序层出不穷。此外，用户对电池续航能力似乎呈指数级增长。由于在离开电源的情况下，六小时的电池续航现在被视为绝对的最低需求，因此对于开发者来说，尝试研究如何尽可能节约能量至关重要。\n\
  \n对于用户来说，控制移动设备的功耗使用也变得越来越重要。用户不仅应该能够指定功耗，而且在他们需要时还应该能够覆盖系统默认设置。\n\n本章解释了 Ubuntu\
  \ Mobile 上可用于电源管理的各种工具和软件包。它包含了基于 `HAL` 的现有工具，以及基于 `DeviceKit -power` 的较新工具。本章还展示了若干项电源测试的结果，并提供了增加移动设备电池续航时间的技术。\n\
  \n## 引言\n\n基于 PC 的芯片在 Linux 中已经有了完善的代码库，并有如 `ACPI` 和 `HAL` 等现有的硬件接口；随着它们从桌面设备演变为更小的设备，许多软件包被创建出来以优化功耗。这些软件包中的每一个都可以被认为是基于\
  \ Linux 平台上特定子系统的电源微策略控制器。\n\n例如，`cpufreq` 管理 CPU 子系统的电源，而 `iwconfig` 接口管理网络（WLAN）子系统的特定设备功耗。\n\
  \n# 第 3 章：电源管理\n\n如果有一个集中的方法来管理电源信息就太好了。从 Ubuntu Jaunty 开始，有一个可以从 universe 仓库安装的新守护进程，提供了此类服务。它将电源管理和分析移动到一个界面，该界面比之前的任何工具更关注整个电源管理系统。它被称为\
  \ `DeviceKit -power`，可以通过 D-Bus 接口 `org.freedesktop.DeviceKit.Power` 访问。\n\n*有关\
  \ D-Bus 的更多信息，请参见第 4 章。*\n\n## 节能状态\n\n常见的电源（节能）状态有唤醒（awake）、待机（standby）、挂起（suspend）和休眠（hibernate）：\n\
  \n- 在 `awake` 状态下，设备的所有组件都在运行。\n- 在 `standby` 期间，CPU 继续运行你的程序，但某些组件（如硬盘）可能会关闭。当触摸鼠标或键盘时，软件将访问硬盘，设备会快速唤醒。*在唤醒和待机状态下，如果\
  \ CPU 未被使用，速度可能会被降低。*\n- 但 `suspend` 期间，CPU 始终处于停止。在现代设备中，所有其他组件（RAM 内存外）都可以关闭。RAM\
  \ 将保留设备的“状态”。\n- 在 `hibernation` 期间，状态会被写入硬盘，整个设备将关闭。\n\n## 电源管理软件包\n\n如果编译内核时带有电源管理软件包（Ubuntu\
  \ 的默认设置），则 `apm` 和 `acpi` 都可用。\n\n*查看默认内核配置，请运行*\n\n```bash\n$ vi /boot/config-uname\
  \ -r\n```\n\n*有关内核编译的更多信息，请参见第 8 章。*\n\n`apm` 提供电池状态信息的访问，根据你的笔记本电脑和实现方式，它有助于节电。它主要已被较新的电源管理方案（如\
  \ `ACPI`）取代。\n\n例如，要使用 `apm` 让设备进入睡眠，请运行以下：\n\n```bash\n$ apm -s\n```\n\n`acpi`\
  \ 是一个“接口”规范，由 Ubuntu 软件包 `acpi` 和 `acpi-support` 提供。`acpi` 尝试取代旧的 `apm` 功能，而 `acpi-support`\
  \ 包含了处理盖子关闭以及 AC 电源丢失和恢复等事件的脚本。\n\n`acpi` 和 `apm` 都允许通过软件控制硬件事件（如电池电量耗尽或按下按钮），并且它们分别提供了控制守护进程\
  \ `apmd` 和 `acpid`。\n\n控制守护进程分别在 `/etc/acpi` 或 `/etc/apm` 的配置目录树下运行它们找到的脚本。\n\n\
  ### pm-utils\n\n另一个随 Ubuntu 默认提供并可控制电源状态的软件包是 `pm-utils`。它提供了 `pm-action`、`pm-hibernate`、`pm-suspend`\
  \ 和 `pm-suspend-hybrid` 命令。它们允许通过软件触发硬件电源管理事件。\n\n这些命令通常在桌面上的程序触发时，由硬件抽象守护进程（`hald`）调用。从命令行调用它们也是可能的，但不能保证所有程序都能按预期工作。\n\
  \n### pm-suspend\n\n挂起（Suspend）是一种除 RAM 外，设备大部分部分都已关闭的状态。在这种状态下，设备仍然消耗电源。\n\n可以使用\
  \ `pm-suspend` 配合如下命令让设备进入睡眠模式：\n\n```bash\n$ pm-suspend --quirk-vstate-restore\n\
  ```\n\n在实际设备上的测试显示，这可能非常慢。`pm-utils` 为睡眠运行的实际脚本可以在 `/usr/lib/pm-utils/sleep.d/`\
  \ 中找到。那里的许多脚本是内核正在修复的问题解决方案。\n\n### pm-hibernate\n\n在休眠（hibernate）模式下，系统状态被保存到磁盘，系统完全关机，除非处于极低功耗状态。\n\
  \n### pm-suspend-hybrid\n\n混合挂起（Hybrid suspend）的过程首先将系统状态保存到磁盘——像休眠一样——但并不是关闭电源，而是进入挂起状态，这意味着唤醒速度比普通休眠更快。它相对于挂起的优势是，即使设备电量耗尽也可以恢复。\n\
  \n你还可以设置设备进入高功耗和低功耗模式；`pm-powersave` 命令配合 `true` 或 `false` 参数使用。它的工作原理与挂起框架相同。要执行操作，请使用：\n\
  \n```bash\n$ sudo pm-powersave true\n```\n\n## pmi action\n\nuniverse 仓库中有一个名为 `powagement-interface`\
  \ 的软件包。它在 `acpi` 之上提供了一个抽象层。使用它的主要优势是不需要 root 权限即可让设备挂起或休眠。\n\n```bash\n$ sudo apt-get\
  \ install powagement-interface\n```\n\n通过以下命令直接调用电源管理接口：\n\n**hibernate**:\n\n```bash\n\
  $ /usr/sbin/pmi action hibernate\n```\n\n**suspend**:\n\n```bash\n$ pmi action sleep\n\
  ```\n```\n\n要先锁定 Gnome 会话（即恢复时需要密码），在执行 `pmi` 命令之前执行以下命令：\n\n```bash\n$ gnome-screensaver-command\
  \ -lock\n```\n\n例如，可以使用这些命令在 Ubuntu Netbook Remix 上创建一个应用程序入口，用于锁定屏幕并将设备进入睡眠模式。\n\
  \n首先创建一个包含以下内容的文件：\n\n```\ngnome-screensaver-command -lock; pmi action suspend\n\
  ```\n\n然后使用此命令使文件具有可执行权限：\n\n```bash\n$ chmod +x <file>\n```\n\n\n\n然后将文件命名为 `Lock\
  \ and Suspend`。选择已创建的文件。点击图标即可锁定并挂起设备。\n\n### pm - utils 如何工作\n\n主脚本（`pm - action`，通过符号链接调用\
  \ `pm - suspend`、`pm - hibernate` 或 `pm - suspend - hybrid`）会按字母顺序执行钩子（可执行）脚本，根据指令传递参数\
  \ `suspend`（挂起到内存）或 `hibernate`（挂起到磁盘）。一旦所有脚本完成，设备将进入睡眠状态。\n\n# 第 3 章：电源管理\n\n机器唤醒后，所有钩子将以反序执行，根据指令传递参数\
  \ `resume`（从内存恢复）或 `thaw`（从磁盘恢复）。\n\n*注意，`suspend - hybrid` 目前是一个占位符，尚未完全实现。*\n\n\
  钩子会执行各种操作，例如准备启动加载或停止蓝牙子系统。\n\n`suspend` 的钩子存放在以下位置：\n\n`/usr/lib/pm-utils/sleep.d`\n\
  `/etc/pm/sleep.d`\n\n电源状态的钩子存放在以下位置：\n\n`/usr/lib/pm-utils/power.d`\n`/etc/pm/power.d`\n\
  \n`/etc/pm/` 中的钩子优先级高于 `/usr/lib/pm-utils/`，因此开发者可以覆盖默认设置。\n\n一个蓝牙的挂起/恢复脚本示例名为 `49bluetooth`，位于\
  \ `/usr/lib/pm-utils/sleep.d/`，如下如下：\n\n```bash\n. `${PM_FUNCTIONS}”\n\n[-f /proc/acpi/ibm/bluetooth\
  \ ] || exit $NA\n\nsuspend_bluetooth()\n{\n  if grep -q enabled /proc/acpi/ibm/bluetooth;\
  \ then\n    savestate ibm_bluetooth enable\n    echo disable\n    > /proc/acpi/ibm/bluetooth\n\
  \  else\n    savestate ibm_bluetooth disable\n  fi\n}\n\nresume_bluetooth()\n{\n\
  \  state_exists ibm_bluetooth || return\n  restorestate ibm_bluetooth\n  > /proc/acpi/ibm/bluetooth\n\
  }\n\ncase “$1” in\n  hibernate|suspend)\n    suspend_bluetooth\n    ;;\n  thaw|resume)\n\
  \    resume_bluetooth\n    ;;\n  *) exit $NA\n  ;;\nesac\n```\n\n### Gnome - Power\
  \ - Manager\n\nGnome - Power - Manager 是一个带有图形用户界面的程序，它订阅电源事件并对其采取操作。例如，它可以显示笔记本电脑的电池状态，并在使用电池供电运行时调暗屏幕。如果用户已登录，它还会在闲置一段时间后或电池电量耗前关闭或休眠计算机。Gnome\
  \ - Power - Manager 的软件挂起策略实际上由硬件抽象层处理。\n\nUbuntu - MID 不会在桌面显示 Gnome - Power -\
  \ Manager 小组件（尽管它在后台运行），因此它没有图形关机功能。附录 D 中的电源小组件代码提供了此类功能，并在出现这种情况时可以使用。\n\n###\
  \ Gnome - Power - Statistics\n\n该应用程序是一个图形化查看器，通过 D-Bus 使用 `org.gnome.PowerManager.Statistics`\
  \ 接口与 Gnome - Power - Manager 交互。\n\n图 3-1 显示了笔记本电脑从挂起模式恢复的影响以及功率使用的激增。\n\n####\
  \ Device Kit Power\n\nDeviceKit 守护进程集替换了 HAL（硬件抽象层）的核心功能。\n\n编写这些守护进程是因为目前应用程序需要大量复杂的代码来完成如计算剩余电池寿命等简单任务。所有的\
  \ DeviceKit 守护进程都是系统激活的，且内存需求很低。\n\nDeviceKit - power 还实现了一个用于延迟控制的 QoS（服务质量）接口（稍后讨论）。这是为了制造出一种在闲时耗电少，但同时又不会感觉缓慢的设备。\n\
  \nDeviceKit - power 为设备上的电源提供了 D-Bus 接口（更多关于 D-Bus 的信息请参见第 4 章），并用于控制设备级的电源管理。任何应用程序都可以访问系统总线上的\
  \ `org.freedesktop.DeviceKit.Power` 服务。\n\n可以使用以下命令安装 DeviceKit.Power：\n\n```bash\n\
  sudo apt-get install devicekit-power\n```\n\n`devkit-power-daemon` 在系统消息总线上提供 `org.freedesktop.DeviceKit.Power`\
  \ 服务，而 `devkit-power` 提供了一个方便的命令行工具来访问该守护进程。该工具可以使用如下方式（以下输出已为了清晰起见经过编辑）：\n\n```text\n\
  $ devkit-power --monitor-detail\nMonitoring activity from the power daemon. Press\
  \ Ctrl+C to cancel.\ndevice changed: /org/freedesktop/DeviceKit/Power/devices/battery_BAT0\n\
  native-path: /sys/devices/LNXSYSTM:00/device:00/PNP0A08:00/device:01/PNP0C09:00/device:01/PNP0C0A:00/power_supply/BAT0\n\
  vendor: SONY\nmodel: 93P5030\nserial: 1656\npower supply: yes\nupdated: Tue May\
  \ 5 21:16:40 2009 (0 seconds ago)\nhas history: yes\nhas statistics: yes\npresent:\
  \ yes\nrechargeable: yes\nstate: discharging\nenergy: 74.75 Wh\nenergy-empty: 0\
  \ Wh\nenergy-full: 74.88 Wh\nenergy-full-design: 74.88 Wh\nenergy-rate: 19.708 W\n\
  voltage: 16.248 V\ntime to full: 0 seconds\ntime to empty: 3.3 hours\npercentage:\
  \ 96%\ncapacity: 100%\ntechnology: lithium-ion\nHistory (charge):\n124154960 97.0%\n\
  124154970 96.88 discharging\n124154980 96.795 discharging\n124154990 96.172%\n```\n\
  \n该工具显示了在电池供电运行时输出。频繁的唤醒（输出再次为了清晰起见经过编辑）。用户态和内核唤醒会对功耗产生不利影响，因为它们迫使处理器保持“唤醒”状态并迅速消耗电池。\n\
  \n每分钟唤醒总数：216\n唤醒源：\nuserspace: 16881 95.3\nkernel: 16901 93.2\nuserspace: 17320\
  \ 88.1\nkernel: 17543 85.4\nuserspace: 17617 84.1\nkernel: 18079 83.6\nuserspace:\
  \ 18174 79.9\nkernel: 18320 77.8\nuserspace: 18561 76.9\nkernel: 18881 75.3\nuserspace:\
  \ 19051 73.2\nkernel: 19511 71.6\nuserspace: 19601 70.5\nkernel: 20117 68.8\nuserspace:\
  \ 20320 67.2\nkernel: 20543 66.1\n\nDeviceKit.Power 可以通过系统消息 D-Bus 访问。例如，要挂起设备，运行以下命令：\n\
  \n```bash\n$ dbus-send --print-reply --system --dest=org.freedesktop.DeviceKit.Power\
  \ /org/freedesktop/DeviceKit/Power org.freedesktop.DeviceKit.Power.Suspend\n```\n\
  \n它返回：\n\nmethod return sender=:1.161 - dest=:1.168 reply_serial=2\n\n设备进入挂起模式。\n\
  \n### 服务质量：QoS 接口\n\n为了说明你如何使用 QoS 接口，即时通讯应用程序需要请求 200 微秒的延迟。\n\n\n\n\n在 QoS 接口之前，就可以从应用程序控制电源（使用旧的\
  \ HAL 接口）；然而，这意味着需要以 root 运行应用程序。\n\n首先，为了查看守护进程的输出，请以详细模式运行守护进程：\n```bash\n$ sudo\
  \ su\n/usr/lib/devicekit-power/devkit-power-daemon --verbose\n```\n\n（在另一个 shell\
  \ 窗口）传递 200 微秒的延迟请求（例如，对于即时通讯应用来说似乎是合理的）：\n\n```bash\n$ dbus-send --print-reply\
  \ --system --dest=org.freedesktop.DeviceKit.Power /org/freedesktop/DeviceKit/Power/Policy\
  \ org.freedesktop.DeviceKit.Power.QoS.RequestLatency string:\"network” int32:200\
  \ boolean:false\n```\n\n输出为：\n```\nTI:15:03:48 TH:0x8d4adf8 FI:dkp-qos.c FN:dkp_qos_request_latency,326\n\
  - Received Qos from ‘:1.140’ (200:1)’ saving as #1524452718\nTI:15:03:48 TH:0x8d4adf8\
  \ FI:dkp-qos.c FN:dkp_qos_latency_write,180\n```\n\n当 IM 应用程序与系统总线断开连接时，延迟请求会自动清理（`persistent=False`\
  \ 设置）。可以将其设置为 `True`，这样当应用程序断开连接时请求不会被清理（cookie 值在设备重启后会保留）。\n\n## 控制无线电发射器\n\n\
  持续对各种无线连接进行轮询会消耗大量电量。\n\n为了尝试限制这一点，设备制造商实施了各种技术。在 Nokia 设备（如 N810）上，所有网络连接都通过一个连接跟踪器（connection\
  \ tracker）进行路由。这使得在应用程序尝试访问网络之前可以禁用网络接口，此时可以快速建立新连接。电源节电轮询协议（`PS - Poll`）被开发出来，有助于减少无线电需要供电的时间。\n\
  \n`PS - Poll` 不是让无线一直开启，而是允许 WiFi 适配器在关电前通知访问点。在无线电关电期间，访问点将持有任何需要发送给它的网络数据包。\n\n\
  网络延迟会随着 `PS - Poll` 而增加。在浏览网页时通常察觉不到，但在低网络延迟很重要的情况下（例如在线游戏、语音和媒体流传输），`PS - Poll`\
  \ 可能不是最佳解决方案。\n\n`PS - Poll` 主要适用于使用 `ipw2100/ipw2200` 驱动或较新的 `iwl3945/iwl4965`\
  \ 驱动的无线卡。要在 `ipw2100/ipw2200` 卡上设置 `PS - Poll`，请执行以下操作：\n```bash\niwpriv wlan0 set_power\
  \ 5\n```\n其中 `wlan0` 是网络适配器的接口名称。`iwpriv` 命令中的数字 `5` 是节电开启程度：\n\n- `1` 是最小数字，节电最少（增加的延迟也最低）。\n\
  - `5` 是最大数字。\n- `6` 再次禁用节电功能，如下所示：\n```bash\niwpriv eth1 set_power 6\n```\n\n`iwl3945/iwl4965`\
  \ 驱动依赖内核来配置无线子系统。然而，存在一种机制可以通过 `sysfs` 文件属性 `power_level` 手动配置 `PS - Poll`，例如：\n\
  ```bash\necho 5 /sys/bus/pci/drivers/iwl4965/*/power_level\n```\n根据适配器将 `iwl4965`\
  \ 替换为 `iwl3945`。\n\n## RFKILL\n\n由于在某些情况下（例如飞行期间）完全不会使用 WiFi 无电，因此完全关闭 WiFi 是有意义的。\n\
  \n执行此操作，请运行以下命令：\n```bash\nfor i in `find /sys -name “rf_kill” ; do echo 1 > $i\
  \ ; done\n```\n\n要重新开启无线电，请在 shell 中运行：\n```bash\nfor i in `find /sys -name “rf_kill”\
  \ ; do echo 0 > $i ; done\n```\n\n如果 OEM 能为此添加一个应用程序，那将很棒。参阅第 4 章查看如何编写小程序的示例。\n\
  \n## 蓝牙\n\n像 WiFi 一样，蓝牙也有无线电发射器，因此可能会消耗相当多的电量。与 WiFi 不同，蓝牙很少被使用，所以蓝牙设备可能实际上没有用于任何地方，只是在消耗电池寿命。\n\
  \n这是一个根据需要开启/关闭蓝牙的脚本：\n```bash\n#!/bin/bash\nif ps -A | grep -c bluetoothd\nthen\n\
  \  gksudo /etc/init.d/bluetooth stop\n  sudo hciconfig hci0 down\nelse\n  gksudo\
  \ /etc/init.d/bluetooth start\nfi\n```\n\n## 调查功耗\n\n通过 `powertop`，可以很容易看到某些应用程序有很能量需求。例如，如果你的电池寿命是\
  \ 5 小时，那么运行 Firefox 就会消耗其中的 1 小时！其他值得的应用程序包括 xorg 和 Skype。需要注意的是，特别是对于 Firefox，最近做了大量工作来减少唤醒次数。\n\
  \n了解功耗通常涉及使用 `powertop`。在内部运行它：\n```bash\nsudo powertop\n```\n\n它将显示类似以下的内容：\n```\n\
  TI:15:03:48 TH:0x8d4adf8 FI:dkp-qos.c FN:dkp_qos_request_latency,326\n- Received\
  \ Qos from ‘:1.140’ (200:1)’ saving as #1524452718\nTI:15:03:48 TH:0x8d4adf8 FI:dkp-qos.c\
  \ FN:dkp_qos_latency_write,180\n```\n\n`powertop` 输出显示了设备唤醒系统的频率：\n```\nEvent  \
