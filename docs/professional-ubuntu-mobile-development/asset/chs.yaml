  \ AM\n\n第 5 章：应用程序打包\n\n### 其他 Debian 文件\n\n- **compat**: 仅用于 debhelper 脚本的版本号\n\
  - **install**: 此文件用于向包中安装文件\n- **dirs**: 此文件列出了将在包中创建的哪些目录\n- **docs**: 列出了将安装的哪些文档文件或目录\n\
  - **watch**: 监控上游源码的新版本发布\n- **init**: init 脚本\n- **pam**: 可以安装到 `/etc/pam.d` 的\
  \ pam 文件\n- **links**: 为包内文件创建链接\n- **examples**: 将示例安装到包中\n\n### 构建软件包\n\n现在，由于文件已就绪，就可以实际构建软件包了。进入\
  \ `xfce4-theme-ubuntu-golden` 文件夹并执行命令：\n\n`$ debuild -S -sa`\n\n这将构建并签名 deb 包。我们运行\
  \ `debuild` 命令是因为我们的主题是一个全新的软件包，在 Ubuntu 仓库中没有现有版本，因此 `dput`（稍后介绍）将把 `.orig.tar.gz`\
  \ 文件上传到 PPA。\n\n*有关 `debuild` 和 `PPAs` 的更多信息，请参阅 `https://help.launchpad.net/Packaging/PPA`。*\n\
  \n### 上传到 PPA\n\n要将新的 `xfce4-theme-ubuntu-golden` Debian 软件包上传到 PPA，首先安装 `dput`：`sudo\
  \ apt-get install dput`\n\n`dput` 是你将源包上传到 Launchpad 的工具。它上传以下文件：\n\n- `.dsc`\n\
  - `.changes`\n- `.diff.gz`\n\n\n\n\n可选的`.orig.tar.gz`（如果你使用 `debuild -S` 来构建包）\n\
  \n上传到 PPA，请使用：\n\n```bash$ dput ppa:ianlawrence/ppa\n```\n\n`<changesfile>`\n\n\
  在我们的包中，这将会是：\n\n```bash\n$ ppa:ianlawrence/ppa xfce4-theme-ubuntu-golden_0.1jaunty1_source.changes\n\
