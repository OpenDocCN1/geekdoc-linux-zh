  \nffirs.indd xii\n\n10/7/09 12:43:04 PM\n\n## 致谢\n\n书的致谢不仅仅是作者所欠下的债务清单——许多读者倾向于将这样的名单视为增加书籍权威性的捷径。因此，本书同时献给上游社区以及\
  \ Debian 和 Ubuntu 社区——那些开发者、文档撰写人员、艺术家、业务开发人员、Loco 团队以及更多让这本书成为可能的人们。\n\n感谢我对这些人的债并非必须，但这样做感觉极极了：我的家人，尤其是我的父母\
  \ Carolyn 和 Gez，他们付出了许多，才让我能够写下这些文字。我活着是为了让你们感到自豪，我对所一切深表感激。我美丽的未婚妻 Jozi，她让我大笑和微笑，还有我的朋友们，他们给出自己的意见并让我思考。我爱你们所有人。\n\
  \n然而，感谢以下人的债是必要的。我感谢 Carol Long、Kenyon Brown 以及 Wiley 团队其他成员表现出的完全专业精神和理解——我非常享受与你们的合作。如果没有\
  \ Brian Delacey、David Cohen 和 Felipe Balbi，这本书绝不会诞生。我在 UDS 波士顿结识 Brian（感谢 Mark！），他负责“移动\
  \ Linux”和“移动方向”章节。David 和 Felipe 都是老同事，也是编写了 `Kernel Fine Tuning` 和 `GIT` 章节的底层黑客。他们全都是巨星。在诺基亚技术学院，我特别感谢\
  \ Ragner、Bruno 和 Milton 在测试方面的帮助，感谢 Thiago 在审阅方面的帮助。\n\n如果没有提到我的合作者 Rodrigo Belem，这一部分就是不完整的。他是一个有才华的程序员，也是一个“坏分子”——感谢你的见解、许多小时的黑客工作以及友谊。最后，这本书献给那些以同样的热情爱、笑、痛苦和哭泣的巴西人民，以及亚马逊的人们，对他们来说，移动性是一种生活方式。\n\
  \n最后，我们慢下脚步，倾听他们想说的。\n\n— *Ian Lawrence*\n\n如果没有母亲和姐姐们的爱与支持，我参与这本书将是不可能的。我的父亲给了我爱、鼓励、指导以及学习解决问题的第一个动力。如果没有他，我可能不会从事技术行业。\n\
  \n感谢我父母家人的爱。\n\n— *Rodrigo Cesar Lopes Belem*\n\n---\n\n## 目录\n\n引言 xxv\n\n### 第一章：移动\
