  \ *window;\n  GtkWidget *label;\n  gtk_init(&argc, &argv);\n  program = hildon_program_get_instance();\n\
  \  window = HILDON_WINDOW(hildon_window_new());\n  hildon_program_add_window(program,\
  \ window);\n  g_set_application_name(\"Hello World\");\n  label = gtk_label_new(\"\
  Hello World\");\n  gtk_container_add(GTK_CONTAINER(window), label);\n  attach_menu(window);\n\
  \  attach_toolbar(window);\n  gtk_widget_show_all(GTK_WIDGET(window));\n  g_signal_connect(G_OBJECT(window),\
  \ \"delete_event\", G_CALLBACK(gtk_main_quit), NULL);\n  gtk_main();\n  return 0;\n\
  }\n```\n\n再次运行编译：\n\n```bash\ngcc -o hello-world hello-world.c $(pkg-config --cflags\
  \ --libs gtk+-2.0 hildon-1)\n```\n\n将创建二进制文件移动到 `/usr/bin`，并将 `.desktop` 文件添加到 `/usr/share/applications`。`hello\
  \ - world` 程序的 `.desktop` 文件如下：\n\n```ini\n[Desktop Entry]\nEncoding=UTF-8\nName=Hello-World\n\
  Comment=Introduction to Hildon Applications\nExec=hello-world\nIcon=hello.png\n\
  StartupNotify=true\nTerminal=false\nX-MultipleArgs=false\nType=Application\nCategories=Application;Other\n\
  ```\n\n使用 GIMP *创建一个 48x48 的图标* 并将其保存为 `hello.png`。将应用程序图标放入 `/usr/share/icons/hicolor/<size>/<type>/`（例如，`/usr/share/icons/hicolor/48x48/apps/hello`）。\n\
  \n`.desktop` 文件和图标必须具有读权限。你的图标目录中不能有另一个“ hello ”，否则会发生冲突。\n\n代码在桌面上显示了图标，如图 4-5\
  \ 所示。\n\n图 4-5\n\n点击图标时，它将执行应用程序。\n\n### 其他工具包\n\n如果编写的新应用程序是针对没有触摸屏的设备，或者将运行如 Ubuntu\
  \ Netbook Remix 等发行版的设备，那么可以使用纯 GTK 作为框架。\n\nGTK+ 是一个旨在促进使用标准图形用户界面开发应用程序的工具包。它最初是作为制作\
  \ The GIMP 的工具创建的。\n\n## 布局\n\n与其显式地设计应用程序的布局、定义应用程序每个元素的特定坐标和尺寸，GTK+ 使用相对位置来指示对象之间的放置位置。“打包箱\
  \ ” 是实现这种放置的主要对象。\n\n\n\n\n\n这些是不可见的小部件容器，我们可以将小部件封装在其中。它们有两种形式：水平框和垂直框。您可以在其他框内部或旁边使用任何框的组合来创建所需的效果。\n\
  \n### 水平框\n\n当将小部件封装到水平框中时，对象将从左到右水平方向插入：`gtk_hbox_new()`。\n\n水平框使用 `gtk_box_pack_start()`\
  \ 和 `gtk_box_pack()` 函数来控制布局和间距。\n\n### 垂直框\n\n在垂直框中中，小部件从上到下排列：\n\n```\ngtk_vbox_new()\n\
  ```\n\n垂直框使用 `gtk_box_pack_start()` 和 `gtk_box_pack()` 函数来控制布局和间距。\n\n### Glade\n\
  \n在实践中，应用程序的布局通常使用 Glade 完成。Glade 界面设计器是一个 GNOME 应用，它允许通过视觉化方式而非 C 代码来布局小部件。Glade\
  \ 可以生成 C 或 C++ 源代码，并将其编译以构建应用程序；然而，那种方法不再是使用 Glade 的最佳方式。相反，Glade 项目文件（XML 格式的 `.glade`\
  \ 文件）由应用程序在运行时使用 `libglade` 解析。这允许您在无需重新编译整个程序的情况下修改/更新 UI，并允许程序与界面分离。\n\nGlade\
  \ 文件在应用程序中的用法：\n\n```c\n/* 创建 GladeXML 对象并连接信号 */\ngxml = glade_xml_new (GLADE_FILE,\
  \ NULL, NULL);\nglade_xml_signal_autoconnect (gxml);\n```\n\n调用 `glade_xml_new`\
  \ 会创建一个新的 `GladeXML` 对象（`gxml` 将引用该对象），它还会创建 Glade 文件中的所有小部件，我们将它们作为第一个参数传递给函数。这应该在应用程序的某处声明，如下：\n\
  \n```c\n/* 在执行“make install”后保存 glade 文件路径 */\n#define GLADE_FILE PACKAGE_DATA_DIR\"\
  /gnome3/gnome3.glade\n```\n\n#### 第 4 章：应用程序开发\n\n导入 `.glade` 文件后，您可以使用在 Glade 中赋予小部件的名称来访问它们，并在程序中使用它们。\n\
  \n考虑到 Glade 在使用 Hildon Framework 时无法创建 Hildon Window 这一点是非常重要的。它只能创建 GTK Window，而且它确实需要将其作为大多数其他小部件的父级（菜单除外）。\n\
  \n在 C 应用程序中，此过程如下：\n\n1. 手动修改 Glade 文件，将窗口类从 `GtkWindow` 改为 `HildonWindow`。\n2.\
  \ 在您的 C 文件中添加 `#include <glade/glade-build.h>`。\n3. 在您的 C 文件中添加以下内容：\n\n```c\nstatic\
  \ GtkWidget* glade_hildon_window_new(GladeXML *xml, GType type, GladeWidgetInfo\
  \ *info) {\n    return hildon_window_new();\n}\n```\n\n4. 在初始化窗口之前，执行以下操作：\n\n```c\n\
  glade_register_widget(HILDON_TYPE_WINDOW,\n  glade_hildon_window_new,\n  glade_standard_build_children,\n\
  \  NULL);\n```\n\n5. 使用 `hildon_program_add_window()` 将窗口添加到 Hildon 程序中。\n\n在 Glade\
  \ 中，您创建 GTK Window 并向其添加小部件。Glade 也可以配合 Python 和 C 使用；其与 Hildon 使用的方法相同——即您将 GTK\
  \ Window 的子小部件“重新父化”到您真实的 Hildon Window。为了尽量减少重新父化，以下示例程序只有一个带有“子”项的“根”窗口，该 GTK\
  \ VBox 小部件包含子部件。\n\n因此，这个 `VBox` 必须从 GTK Window 重新父化到 Hildon Window。下面的 Python 示例（称为\
  \ `pumdGlade`）展示了如何实现这一点。\n\n#### 源代码\n\n这是 `pumdGlade` 的源代码。\n\n```python\nimport\
  \ pygtk\nimport gtk\nimport hildon\nimport gtk.glade\n\nclass pumdGlade():\n   \
  \ \"\"\"用于《Professional Ubuntu Mobile Development》书籍的 pygtk-glade-hildon 示例\"\"\"\
  \n    def __init__(self):\n        # 创建 hildon 程序\n        self.program = hildon.Program()\n\
  \        self.program.__init__()\n        # 创建 hildon 窗口并添加到程序\n        self.window\
  \ = hildon.Window()\n        self.window.set_title(\"Professional Ubuntu Mobile\
  \ Development\")\n        self.program.add_window(self.window)\n        # 从框架关闭按钮接收关闭窗口的信号\n\
  \        if (self.window):\n            self.window.connect(\"destroy\", gtk.main_quit)\n\
  \        # 导入 glade 文件并赋值给 self.wTree\n        self.glade_file = \"pygladeui.glade\"\
  \n        self.wTree = gtk.glade.XML(self.glade_file)\n        # 将 vbox1 从 glade\
  \ 重新父化到 self.window\n        self.vbox1 = self.wTree.get_widget(\"vbox1\")\n\n#\
  \ （源代码中提供的剩余逻辑包含了冗余的取消注释逻辑，\n# 它们遵循上述建立的核心结构）\n```\n\n\n\n\n这展示了某些属性名的设置以及子部件的创建。\n\
  \n# 第 4 章：应用程序开发\n\n以下 Python 代码展示了重父操作：\n\n```python\n#将 vbox1 从 glade 重新父到 self.window\n\
  self.vbox1 = self.wTree.get_widget(“vbox1”)\nself.reparent_loc(self.vbox1, self.window)\n\
  ```\n\n第一行获取指定的 GTK VBox 并将其赋值给变量 `self.vbox1`。第二行使用此处定义的 `reparent_loc()` 函数，将\
  \ VBox 从在 Glade 中创建的 GTK 窗口重新父到 Python 中名为 `self.window` 的 Hildon 窗口：\n\n```python\n\
  def reparent_loc(self, widget, newParent):\n    widget.reparent(newParent)\n```\n\
  \n在 Ubuntu MID 上运行完成后的应用程序如图 4 - 6 所示。\n\n### Clutter\n\n另一个在移动开发社区中引起热烈关注的工具包是\
  \ Clutter。它最初由 OpenedHand 的一些 GNOME 开发者开发，现在是 Moblin 项目的一部分，并在英特尔开源技术中心开发。\n\n###\
  \ Clutter\n\nClutter 是一个基于 GObject 的库，用于创建动画硬件加速的图形用户界面。它依赖 `OpenGL (1.4+)` 或 `OpenGL\
  \ ES (1.1 or 2.0)` 进行渲染，可以在不同的平台（Linux、Mac OS 和 Win32）上编译，并有多种其他语言的绑定（包括 Python、Ruby\
  \ 和 Vala）。它还支持使用 Gstreamer 进行媒体播放以及使用 Cairo 进行 2D 图形渲染。\n\nClutter 的工作原理是拥有舞台（窗口），然后向舞台添加\
  \ actor（部件）并通过 actor API 进行操作。Actor 可以包含子 actor（例如 `ClutterGroup`）并作为一个整体被操作。\n\n\
  可以通过使用时间轴（timelines）和行为（behaviors）创建动画和视觉效果。时间轴提供了精确的帧动画。行为进一步扩展了这一点，通过获取时间轴并在 actor\
  \ 应用控制函数（`clutter.Alpha`）来随时间修改 actor 的某些属性。\n\nClutter 还支持颜色、信号和标签，允许开发者、设计师或 OEM\
  \ 无需借助 Flash 等专利且昂贵的软件即可创建引人注目的视觉界面。\n\n以下 Python 应用程序展示了在舞台上创建三个 actor。该舞台嵌入在一个\
  \ GTK 应用程序中。在应用程序中，一个图像 actor 绕着另一个永久循环运行，而第三个 actor（文本 actor）则随时间淡入和淡出。\n\n在编写本文时，Python\
  \ Clutter 的最新稳定版本是 0.8，可以在 `http://www.clutter-project.org/sources/pyclutter/0.8/`\
  \ 获取或使用 `apt` 安装：\n\n```bash\nsudo apt-get install python-clutter\n```\n\n*如果从源代码安装，请使用以下命令：*\n\
  \n```bash\n./configure\nmake\nsudo make install\n```\n\n*同时确保已安装了依赖项：*\n\n```bash\n\
  sudo apt-get install python-cairo-dev libclutter-gst-0.8-dev libclutter-cairo-0.8-dev\
  \ libclutter-0.8-dev python-gtk2-dev libclutter-gtk-0.8-dev\n```\n\n接下来，创建一个 Python\
  \ 文件并导入所需的 Clutter 库：\n\n```python\nimport sys\nimport cluttergtk # 必须第一个导入\nimport\
  \ clutter\nimport cluttercairo\nimport math\nimport array\nimport os, tempfile\n\
  import gtk\nimport cairo\n```\n\n导入指令的顺序很重要，因为底层 C 库需要初始化过程。导入 Clutter 及相关模块的正确顺序是：首先：\n\
  \n1. import cluttergtk\n2. import cluttergst\n3. import clutter\n4. import cluttercairo\n\
  \n如果你导入 `gst` 模块，必须在 `cluttergst` 模块之后导入。\n\n如果你导入 `gtk` 模块，必须在 `cluttergtk` 模块之后导入。\n\
  \n主方法首先创建一个 GTK 窗口并设置一个退出窗口的信号。然后创建一个布局框并将 Clutter 舞台放入其中。注意对 `embed.realize()`\
  \ 的调用。\n\n在使用部件之前“激活”它，请执行以下操作：\n\n```python\ndef main ():\n    window = gtk.Window()\n\
  \    window.connect('destroy’, gtk.main_quit)\n    window.set_title('Professional\
  \ Ubuntu Mobile Development')\n    vbox = gtk.VBox(False, 6)\n    window.add(vbox)\n\
  \    embed = cluttergtk.Embed()\n    vbox.pack_start(embed, True, True, 0)\n   \
  \ embed.set_size_request(700, 600)\n    # 在获取舞台之前，我们需要实现部件\n    embed.realize()\n\
  ```\n\n前面的代码定位了文本并设置了大小。然后它使用偏移量调用 `draw()` 函数来使其居中。最后，它将绘制传递给 `render_image()`，其结构如下：\n\
  \n```python\ndef render_title(self, text, size=80):\n    # 一些变量\n    size = int(size)\n\
  \    # 通用图像渲染\n    set_source_rgba(1,1,1,0)\n    cr.paint()\n    # 棕色文本\n    set_source_rgba(0.8,0.5,0,1)\n\
  \    select_font_face(font, cairo.SLANT_NORMAL, cairo.FONT_WEIGHT_NORMAL)\n    set_font_size(size)\n\
  \    # 使“较细”部分更可见的技术\n    set_line_width(0.5)\n    stroke_preserve()\n    fill()\n\
  \    return self.render_image(draw, width, height)\n```\n\n\n\n\nself.moving = clutter.BehaviourEllipse(self.alpha,\
  \ 200, 200, 400, 300, 0, 360)\nself.fade_opacity = clutter.BehaviourOpacity(opacity_start=0,\
  \ opacity_end=255, alpha=self.alpha)\n\n# 第 4 章：应用开发\n\n回到主方法，在 `vbox` 中添加了一些按钮。主窗口显示通过\
  \ `gtk.main()` 启动的循环。\n\n最终的动画应用程序看起来 own Ubuntu MID 上的图 4-7。\n\n图 4-7\n\n由于这是一个\
  \ Python 应用，`.desktop` 文件的功能略有不同。在 MID 设备上，创建一个 `.desktop` 文件：\n\n```\n[Desktop\
  \ Entry]\nEncoding=UTF-8\nName=Clutter\nComment= Professional Ubuntu Mobile Development\n\
  Exec=/usr/bin/clutterit\nIcon=clutter.png\nStartupNotify=true\nTerminal=false\n\
  X-MultipleArgs=false\nType=Application\nCategories=Application;Other\n```\n\n文件\
  \ `/usr/bin/clutterit` 是可执行脚本，内容如下：\n\n```\n$ cd /home/ian/clutter\n$ python gtk-clutter.py\n\
  ```\n\n# 第 4 章：应用开发\n\nClutter 的吸引力之一在于它是跨平台的。“统一桌面”的愿望目前正在获得一些动力。`QT` 是一种跨平台的工具包，而\
  \ `QT` 最直观的应用是 KDE 桌面。\n\nGUADEC (Gnome) 和 Akademy (KDE) 最近在格兰喀那利岛（Gran Canaria）举行了联合会议。\n\
  \nKDE 背后的底层技术是 `QT`，Mark Shuttleworth 指出如下：“Qt 将帮助我们为用户交付更丰富的应用程序。诺基对跨平台 `Qt` 库以及\
  \ Linux 平台的持续投资，是自由软件桌面和移动设备栈创新的主要驱动力。”\n\n## QT\n\n诺基最近收购了 Trolltech，并将 `QT` 的许可证从\
  \ `GPL v2` 更改为 `LGPL v 2.1` 许可证。\n\nOEM 现在可以直接链接到 `QT` 库，而不会让其所有链接代码自动在 `GPL` 下可用。他们现在可以选择他们想要共享的代码。\n\
  \n以下示例是在 Ubuntu Jaunty 上使用 `QT4` 编写的，基于 http://wiki.python.org/moin/JonathanGardnerPyQtTutorial\
  \ 教程，但针对 `QT4` 进行了更新。它将：\n\n- 使用 `QT Designer` 生成 Qt UI 文件。\n- 使用 `pyuic` 生成 Python\
  \ 程序。\n- 在 Python 中使用 `Qt Signals`。\n- 创建一个简单的应用程序来调用系统命令。\n\n为了开始使用 `QT` 进行开发（Python），请确保已安装\
  \ `python-qt-dev`、`qt4.designer` 和 `pyqt-tools`（`apt-get install python-qt-dev qt4.designer\
  \ pyqt4-dev-tools`）。然后使用命令启动 `designer`：\n\n```\n$designer\n```\n\n此命令将显示 Qt designer。这与你之前看到的\
  \ Glade 界面相似，功能基本相同。将 UI 元素拖到控件上并右键点击更改属性。\n\n创建一个新控件。将其命名为 `pumd`，然后添加以下内容：\n\n\
  - `QLineEdit` — 在属性对话框中将其命名为 `command`。\n- `QPushButton` — 在属性对话框中将其命名为 `schedule`。将其文本更改为“Schedule”。\n\
  - `QDateTimeEdit` — 在属性对话框中将其命名为 `time`。\n\n完成后，将文件保存为新文件夹中的 `pumd.ui`。界面看起来应该像图\
  \ 4-8。\n\n然后，在 shell 中进入该文件夹并运行：\n\n```\n$ pyuic4 pumd.ui\n```\n\n此命令将通过 `$ pyuic\
  \ pumd.ui -o pumd.py` 将来自 Qt UI 文件的生成的 Python 代码存储到 `pumd.py` 中。\n\n该文件看起来如下：\n\n\
  ```python\n# -*- coding: utf-8 -*-\n# Form implementation generated from reading\
  \ ui file ‘pumd.ui’\n# Created: Sun Mar 22 16:11:48 2009\n# by: PyQt4 UI code generator\
  \ 4.4.4\n#\n# WARNING! All changes made in this file will be lost!\nfrom PyQt4 import\
  \ QtCore, QtGui\n\nclass Ui_pumd(object):\n    def setupUi(self, pumd):\n      \
  \  pumd.setObjectName(“pumd”)\n        pumd.resize(407, 300)\n        self.time\
  \ = QtGui.QDateTimeEdit(pumd)\n        self.time.setGeometry(QtCore.QRect(100, 70,\
  \ 194, 34))\n        self.time.setObjectName(“time”)\n        self.command = QtGui.QLineEdit(pumd)\n\
  \        self.command.setGeometry(QtCore.QRect(100, 20, 301, 32))\n        self.command.setObjectName(“command”)\n\
  \        self.schedule = QtGui.QPushButton(pumd)\n        self.schedule.setGeometry(QtCore.QRect(100,\
  \ 120, 181, 51))\n        self.schedule.setObjectName(“schedule”)\n        self.label\
  \ = QtGui.QLabel(pumd)\n        self.label.setGeometry(QtCore.QRect(20, 30, 71,\
  \ 24))\n        self.label.setObjectName(“label”)\n        self.label_2 = QtGui.QLabel(pumd)\n\
  \        self.label_2.setGeometry(QtCore.QRect(50, 70, 51, 24))\n        self.label_2.setObjectName(“label_2”)\n\
  \n    def retranslateUi(self, pumd):\n        pumd.setObjectName(\"Form\")\n   \
  \     self.time.setText(\"Time:\")\n        self.command.setText(\"Command:\")\n\
  \        self.schedule.setText(\"Schedule\")\n        self.label.setText(\"Event:\"\
  )\n        self.label_2.setText(\"Date:\")\n```\n\n\n\n\n当运行此文件时，它将执行并显示图 4-9 所示界面。它允许用户选择要运行的系统命令。\n\
  \n图 4-9\n\n另一个可供移动开发者使用的工具包是启蒙基金会库（The Enlightenment Foundation Libraries，简称 EFL\
  \ 或 “e.”）。这些库构 Enlightenment 窗口管理器的基础。\n\n### EFL\n\nEFL 是一个非常适合嵌入式开发的工具包，因为它的内存开销非常低。根据开发者介绍，“Enlightenment\
  \ 为创建美的应用程序提供了构建模块。”\n\nEFL 包含：\n- `Evas`\n- `Ecore`\n- `Edje`\n- `Embryo`\n- `Eet`\n\
  \n`EFL` 库非常适合嵌入式设备环境，对于动画、透明组件和可主题应用程序特别有用。用户与窗口管理器交互，而窗口管理器本身显示编译后的 `Edje` 主题。事件由\
  \ `Ecore` 捕获，而 `Evas` 直接与内核通信，以高效控制如 3D 加速等硬件资源。\n\n第 4 章：应用程序开发\n\n可主题的 `EFL` 应用程序是使用\
  \ `Edje` 布局引擎制作的，它位于 `X11` 画布库 `Evas` 之上。`Edje` 的特点是基于信号界面与应用程序逻辑分离，使得每个使用它的应用程序都是“可换肤的”。\n\
  \n一个 `Edje` 接口文件只是一个用于存放界面信息、图像和字体的文件。该文件通过使用 `Edje` 编译器处理 `Edje` 数据集合文件生成。这使得为设备设置主题变得非常简单。主题布局的示例可以查看窗口框的\
  \ `main.edc` 文件：\n\n```cpp\n#define COLOR_FG 246 151 67 255\n#define COLOR_BG 245\
  \ 245 245 255\n\nfonts {\n  /* use the default */\n}\n\ncollections {\n  #include\
  \ “border.edc”\n}\n```\n\n这包含了另一个名为 `border.edc` 的文件，其内容如下：\n\n```cpp\ngroup {\n\
  \  name, “e/widgets/border/default/border”;\n  parts {\n    part {\n      name,\
  \ “main”;\n      type, RECT;\n      description {\n        state, “default” 0.0;\n\
  \        color, COLOR_FG;\n      }\n    }\n    part {\n      name, “main_inner”;\n\
  \      type, RECT;\n      description {\n        state, “default” 0.0;\n       \
  \ color, COLOR_BG;\n        rel1.offset, 1 1;\n        rel2.offset, -2 -2;\n   \
  \   }\n    }\n  }\n}\n```\n\n注意，该文件与 `main.edc` 保存在同一目录下。在这里，`main_inner` 部分隐藏了\
  \ `main` 的所有内容，除了 1 像素的边框。一个核心概念是“部分”（parts），它们共同构成了主题。\n\n可以使用以下命令编译主题：\n\n```bash\n\
  $ edje_cc main.edc\n```\n\n生成的 `.edj` 文件随后复制到“themes”目录——通常是 `/usr/share/themes`。\n\
  \nCanola 有一个 Web 服务（见下文），用于创建并打包适用于设备的 EFL 主题。该地址为 http://thememaker.openbossa.org。\n\
  \n### Canola\n\n使用 “e”框架的最知名应用程序之一是名为 Canola 的类媒体中心应用程序。它起步于 Nokia 网络平板电脑，在那里它一直是用户中最受欢迎的应用程序。它最近在\
  \ GPL 下发布，现在已为 Ubuntu 打包。\n\n运行 Canola，请添加以下内容：\n\n```bash\ndeb http://ppa.launchpad.net/canola/ppa/ubuntu\
  \ jaunty main\ndeb-src http://ppa.launchpad.net/canola/ppa/ubuntu jaunty main to\
  \ /etc/apt/source.list\n\n$ sudo apt-get update\n$ sudo apt-get install canola2\n\
  ```\n\n对于 karmic 及更高版本，Ubuntu MID 项目的“上游”将是 Mer 而不再是 Moblin。目前有讨论将 Canola 作为 Mer\
  \ 的默认媒体播放器包含其中。Mer 是在 Ubuntu 的薄基础之上，结合了诺基亚 Maemo 平台的最佳开源元素构建而成的。\n\n### Elementary\n\
  \nElementary 是启蒙套件的一部分，是一个小部件集。它非常适合嵌入式设备，因为它占用空间小，尽管它的 API 较小，但可以完全利用 Edje 的功能进行主题化。这使得对于寻求高度定制化设备的制造商来说极具吸引力。\n\
  \nUbuntu 的软件包可以从 http://packages.enlightenment.org 获取。添加：\n\n```bash\ndeb http://packages.enlightenment.org/ubuntu\
  \ jaunty main extras to your /etc/apt/sources.list\n$ sudo apt-get install libelm\n\
  ```\n\n要直了解这个工具包可以做什么，请运行测试应用程序：\n\n```bash\n$ elementary_test\n```\n\n它将显示图 4-10\
  \ 所示的界面。\n\n第 4 章：应用程序开发\n\n### 开发应用程序我需要了解哪些关键技术？\n\n为了确保应用程序的正确运行，有必要良好理解一些基本概念。其中第一个是\
  \ D-Bus。\n\n### D-Bus\n\nD-Bus 是一种进程间通信机制——运行在同一主机上的进程之间的通信媒介。它旨在提供快速且轻量级的体验，为桌面环境设计。有两种总线类型：\n\
  \n- `SystemBus`：用于连接提供系统服务的守护进程的总线服务。这些服务通常在机器启动时启动。\n- `SessionBus`：用于连接通常由用户启动的应用程序的总线服务。Rhythmbox\
  \ 就是此类应用程序的示例。\n\n#### 对象路径和总线名称\n\n在总线上传输时，应用程序会获取服务名称：这是应用程序选择被其他应用程序识别的方式。服务名称由总线守护进程代理，并用于将消息从一个应用程序路由到另一个。因为它是二进制协议，D-Bus\
  \ 消息在序列化数据时开销很低。消息由两个部分组成：头部和主体。头部包含消息的元数据，可以包括路由信息和数据的类型签名。主体包含正在发送的数据。复杂数据类型（如数组和字典）可以编码到消息中，允许使用多种语言编写的应用程序之间通信，并能够保留通用的数据结构。\n\
  \n消息是发送给对象的而不是应用程序。应用程序本身可以随地注册任意数量的对象。D-Bus 对象可以被比编程语言中的任何其他对象，区别在于它们不是通过内存地址而是通过对象路径指向。对象路径的形式类似于\
  \ UNIX 文件系统路径的字符串。它们是斜杠分隔的标签，每个标签由字母、数字和下划线（）组成。它们必须以斜杠开头，且不能以斜杠结尾。这是一个示例：\n\n`/com/pumd/SimpleTextEditor`\n\
  \nD-Bus 对象通过方法和信号调用。D-Bus 方法类似于面向对象语言中的任何其他方法。你通过向服务上的对象接口发送方法消息来直接调用对象上的方法。消息可以包含你想要发送给方法的参数列表。方法可以以同步方式回复（即你的程序等待回复），也可以异步方式回复（即收到回复时你的程序将收到通知）。方法不需要发送回复。\n\
  \n信号是事件发生时的简单通知。信号在总线上传广播，因此不需要特定的服务来发送。任何监听特定信号的人都会信号发射时收到通知。\n\n\n\n\n\n从 `DeviceKit`\
  \ D-Bus 获取属性和方法的示例可以在可以在“将所有概念整合在一起”章节的代码中看到：\n\n```python\ndef _get_dev_iface(self,\
  \ object_path, interface):\n    bus = dbus.SystemBus()\n    proxy_obj = bus.get_object('org.freedesktop.DeviceKit.Disks',\
  \ object_path)\n    iface_obj = dbus.Interface(proxy_obj, interface)\n    return\
  \ iface_obj\n\ndef _get_dev_prop(self, device, property):\n    props_iface_obj =\
  \ self._get_dev_iface(device, 'org.freedesktop.DBus.Properties')\n    try:\n   \
  \     res = props_iface_obj.Get('org.freedesktop.DeviceKit.Disks.Device', property)\n\
  \    except dbus.DBusException:\n        res = ''\n    return res\n\ndef _get_dev_methods(self,\
  \ device):\n    device_iface_obj = self._get_dev_iface(device, 'org.freedesktop.DeviceKit.Disks.Device')\n\
  \    return device_iface_obj\n```\n\n### 使用 D-Bus 导出对象\n\n为了导出对象（以便其他应用程序可以使用它们），必须运行一个事件循环，并将\
  \ D-Bus 连接到该循环上。来自 `pydistcc` 的以下代码展示了一个 gobject 主循环和一个用于导出方法的装饰器。同样注意对 `dbus.service.Object`\
  \ 的调用，它将该方法导出到总线（。\n\n```python\nclass DbusObject(threading.Thread, dbus.service.Object):\n\
  \    def __init__(self, serverlist, condition):\n        self.serverlist = serverlist\n\
  \        self.condition = condition\n        self.servicename = 'net.sourceforge.PyDistcc'\n\
  \        self.objectpath = '/net/sourceforge/PyDistcc/DbusObject'\n        threading.Thread.__init__(self)\n\
  \n    @dbus.service.method('net.sourceforge.PyDistcc', in_signature='', out_signature='a{ss}')\n\
  \    def currentserverlist(self):\n        return self.serverlist\n\n    def run(self):\n\
  \        loop = gobject.MainLoop()\n        self.bus = dbus.SystemBus()\n      \
  \  self.busname = dbus.service.BusName(self.servicename, bus=self.bus)\n       \
  \ dbus.service.Object.__init__(self, self.busname, self.objectpath)\n        loop.run()\n\
  ```\n\n也可以使用装饰器来导出信号，例如：\n\n```python\n@dbus.service.signal(dbus_interface='net.sourceforge.PyDistcc',signature='')\n\
  ```\n\n### 连接到 D-Bus 信号\n\n默认的信号接收器看起来如下：\n\n```python\nbus.add_signal_receiver(self.on_device_added,\n\
  \    'DeviceAdded',\n    'org.freedesktop.DeviceKit.Disks',\n    'org.freedesktop.DeviceKit.Disks',\n\
  \    '/org/freedesktop/DeviceKit/Disks')\n```\n\n下面是一个自定义接收器。注意 `extra_parameters`\
  \ 参数，它允许传递额外信息，这些信息将传递给回调方法。\n\n```python\nbus.add_signal_receiver(\n    lambda\
  \ *args:self._on_device_changed(extra_parameters, *args),\n    'DeviceChanged',\n\
  \    'org.freedesktop.DeviceKit.Disks',\n    'org.freedesktop.DeviceKit.Disks',\n\
  \    '/org/freedesktop/DeviceKit/Disks',\n    extra_parameters)\n```\n\n### 有用的\
  \ D-Bus 命令行应用程序\n\n在 Ubuntu 中处理 DBUS 时，有一些实用的应用程序可用。\n\n#### D-Bus Viewer\n\nD-Bus\
  \ Viewer 是一个允许你检查 D-Bus 对象和消息的工具。你可以在系统总线和会话总线之间选择。\n\n该应用程序可以在 `http://launchpadlibrarian.net/6844344/dbus-viewer_4.2.3-0ubuntu3_i386.deb`\
  \ 获取。\n\n1. 安装它然后运行以下：\n```bash\n$ dbus-viewer\n```\n\n有一个带有 GTK+ 界面的 `dbus-viewer`\
  \ 克隆版本被称为 `D-Bus Explorer`。它显示 D-Bus 服务，如图 4-11 所示。\n\n在 `python-dbus-doc` 包中，还有一个名为\
  \ `list-system-services.py` 的脚本，其功能正如文件名所示。该脚本位于 `/usr/share/doc/python-dbus-doc/examples`。运行它将产生如下输出：\n\
  \n```bash\n$ python list-system-services.py\ncom.redhat.NewPrinterNotification\n\
  com.ubuntu.SystemService\nfi.epitest.hostap.WPASupplicant\norg.bluez\norg.freedesktop.Avahi\n\
  org.freedesktop.Console\norg.freedesktop.DBus\norg.freedesktop.Hal\norg.freedesktop.NetworkManager\n\
  org.freedesktop.NetworkManagerSettings\norg.freedesktop.SystemToolsBackends\norg.xconfig.display0\n\
  ```\n这些是当前运行 D-Bus 服务。\n\n#### D-Bus Send\n\n`dbus-send` 用于向 D-Bus 总线发送消息。几乎所有的用法都必须提供\
  \ `--dest` 参数，即要在总线上发送消息的连接名称。例如，可以在命令行上发送指令让 Rhythmbox 跳到下一曲，如下：\n\n```bash\ndbus-send\
  \ --dest='org.gnome.Rhythmbox' /org/gnome/Rhythmbox/Player org.gnome.Rhythmbox.Player.next\n\
  ```\n\n#### D-Bus Monitor\n\n`dbus-monitor` 命令用于监控通过 D-Bus 总线的消息。它有两种不同的输出模式：“经典”风格的监控模式和性能分析模式。性能分析格式是一种紧凑的格式，每条消息一行，并带有微秒级的时间信息：\n\
  \n```bash\n$ dbus-monitor -profile\n```\n当设备电源线断开时，会产生以下输出：\n\n```\norg/freedesktop/DBus\
  \ org.freedesktop.DBus NameAcquired\norg/freedesktop/DBus org.freedesktop.DBus Properties\
  \ Get\norg/freedesktop/DBus org.freedesktop.DBus AddMatch\norg/freedesktop/PowerManagement\
  \ org.freedesktop.PowerManagement OnBatteryChanged\norg/freedesktop/PowerManagement\
  \ org.freedesktop.PowerManagement PowerSaveChanged\norg/gnome/ScreenSaver org.gnome.ScreenSaver\
  \ Throttle\norg/gnome/ScreenSaver org.gnome.ScreenSaver SimulateUserActivity\norg/freedesktop/Notifications\
  \ org.freedesktop.Notifications GetCapabilities\norg/freedesktop/Notifications org.freedesktop.Notifications\
  \ Notify\norg/freedesktop/PowerManagement/Backlight org.freedesktop.PowerManagement.Backlight\
  \ BrightnessChanged\norg/freedesktop/Notifications org.freedesktop.Notifications\
  \ NotificationClosed\n```\n\n#### D-Bus Launch\n\n`dbus-launch` 命令用于从 脚本启动 `dbus-daemon`\
  \ 的会话实例（通常在用户登录系统时）。它的用法如下：\n\n```bash\n# 检查是否存在总线守护进程\nif [ -z \"$DBUS_SESSION_BUS_ADDRESS\"\
  \ ]; then\n    # 如果未找到，启动一个新的\n    eval 'dbus-launch --sh-syntax --exit-with-session'\n\
  \    echo \"D-Bus 会话进程地址为: $DBUS_SESSION_BUS_ADDRESS\"\nfi\n```\n\n#### D-Feet\n\
  \n`dfeet` (`sudo apt-get install dfeet`) 是用 PyGTK 编写的 D-Bus 调试器。它提供了一个连接到系统总线或会话总线的图形界面，并能够在总线上执行带参数的方法并查看返回值。图\
  \ 4-12 显示了当设备使用电池电源运行时，在 `org.freedesktop.PowerManagement` 会话总线上执行 `GetOnBattery()`\
  \ 方法的效果。\n\n`dfeet` 别推荐用于调试 DBUS 问题。\n\n\n\n\n在典型的计算机上，总守护进程（daemon）有多个实例。系统守护进程对它接受的消息有严格的安全限制，并用于系统级通信。其他实例则每个用户登录会话创建一个。这些实例允许用户会话中的应用程序相互进行通信。\n\
  \n这些实例的安全性是在配置文件中配置的。该文件位于 `/etc/dbus-1/system.d`。\n\n要配置策略，请在此目录下创建一个名为 `application.conf`\
  \ 的文件并写入策略（该文件可以命名为任何名称——并不重要）。该文件的内容如下：\n\n```xml\n<!DOCTYPE busconfig PUBLIC\n\
  \"-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN\"\n\"http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd\"\
  >\n<busconfig>\n  <policy user=\"root\">\n    <allow own=\"net.sourceforge.PyDistcc\"\
  \n            send_destination=\"net.sourceforge.PyDistcc\"\n            send_interface=\"\
  net.sourceforge.PyDistcc\"/> own  </policy>\n  <policy user=\"rodrigo\">\n    <allow\
  \ own=\"net.sourceforge.PyDistcc\"\n            send_destination=\"net.sourceforge.PyDistcc\"\
  \n            send_interface=\"net.sourceforge.PyDistcc\"/>  </policy>\n  <policy\
  \ at_console=\"true\">\n    <allow send_destination=\"net.sourceforge.PyDistcc\"\
  \n            send_interface=\"net.sourceforge.PyDistcc\"/>  </policy>\n  <policy\
  \ context=\"default\">\n    <deny own=\"net.sourceforge.PyDistcc\"\n           \
  \ send_destination=\"net.sourceforge.PyDistcc\"\n            send_interface=\"net.sourceforge.PyDistcc\"\
  />  </policy>\n</busconfig>\n```\n\n代码示例展示了策略的使用。D-Bus 系统总线的默认策略如下：\n\n- 命名所有权（Name\
  \ ownership）默认被拒绝（DENIED）。\n- 方法调用默认被拒绝（DENIED）。\n- 方法调用的响应（包括错误）默认允许（PERMITTED）。\n\
  - 信号（Signals）默认允许（PERMITTED）。\n\n因此，每个服务*必须*在它的策略配置中允许适当的用户拥有它想要声称的名称——例如：\n\n```xml\n\
  <policy user=\"rodrigo\">\n  <allow own=\"net.sourceforge.PyDistcc\"/>\n</policy>\n\
  ```\n\n它还必须允许特定用户对其导的对象进行方法调用。这可以通过允许对声称名称进行的所有方法调用来实现：\n\n```xml\n<policy user=\"\
  rodrigo\">\n  <allow own=\"net.sourceforge.PyDistcc\"\n          send_destination=\"\
  net.sourceforge.PyDistcc\"\n          send_interface=\"net.sourceforge.PyDistcc\"\
  />\n</policy>\n```\n\n在所有的 `allow` 或 `deny` 标签中包含 `send_destination` 是关重要的，遗漏它可能会导致潜在的安全漏洞。请不要这样做：\n\
  \n```xml\n<allow send_interface=\"x.y.z\" />\n```\n\n这将允许任何服务接收给定接口的方法调用！\n\n###\
  \ PolicyKit\n\n如果 D-Bus 服务需要权限（需要 `sudo` 的操作），则可以使用 PolicyKit 来控制这种访问。\n\nPolicyKit\
  \ (http://hal.freedesktop.org/docs/PolicyKit/PolicyKit.8.html) 随 Ubuntu 默认提供，它分为两部分——第一部分是“机制”（mechanism，以特权运行），第二部分是“策略代理”（policy\
  \ agent，以非特权运行），两部分在系统总线上交互。“机制”使用 PolicyKit 来决定是否允许访问请求的进程或用户。例如，devicekit power\
  \ QoS 策略（定义在 XML 文件 `/usr/share/PolicyKit/policy/org.freedesktop.devicekit.power.qos.policy`\
  \ 中）有一个关于最小延迟的“动作”（action）：\n\n```xml\n<action id=\"org.freedesktop.devicekit.power.qos.set-minimum-latency\"\
  >\n  <description>Set administrator settings for latency control</description>\n\
  \  <message>Authentication is required to set administrator settings for latency</message>\n\
  \  <defaults>\n    <allow_inactive>no</allow_inactive>\n    <allow_active>auth_admin</allow_active>\n\
  \  </defaults>\n</action>\n```\n\n发送类似下面的 D-Bus 消息：\n\n```bash\ndbus-send --session\
  \ --print-reply --dest=org.freedesktop.PolicyKit.AuthenticationAgent org.freedesktop.PolicyKit.AuthenticationAgent.ObtainAuthorization\
  \ string:org.freedesktop.devicekit.power.qos.set-minimum-latency uint32:0 uint32:$PPID\n\
  ```\n\n会弹出一个请求授权的界面。将 `<allow_active>auth_admin</allow_active>` 改为 `<allow_active>yes</allow_active>`\
  \ 将直接返回方法而不询问请求授权。\n\n`allow_active` 标签指定了 PolicyKit 为活动会话返回的默认答案。\n\n在开发移动设备应用时，理解下一个关键技术是\
  \ GConf。\n\n### GConf\n\nGConf 是随 GNOME 提供的存储配置设置的方法。从概念上说类似于 Windows 注册表，但 GConf\
  \ 将注册表概念抽象为一个库。这为应用程序提供了一个简单的接口，以及一个让 OEM、系统管理员和开发者方便工作的架构。\n\n本质上，GConf 提供了一个偏好数据库，类似于一个简单的文件系统。该文件系统包含按层次结构组织的键（keys）。每个键要么包含更多键的目录，要么有一个值。例如，键\
  \ `/apps/metacity/general/titlebar_font` 包含一个整数值，给出 Metacity 窗口管理器标题栏字体的大小。\n\n\
  以下 Python 应用展示了 GConf 的使用。该程序显示用户最近使用的文件，这些文件是从 GConf 设置中提取的。`gconf-example.glade`\
  \ 文件未在此处显示，但包含 Wrox 网站的代码下载包中。\n\n```python\n#!/usr/bin/env python\n# -*- coding:\
  \ utf-8 -*-\n\nimport gtk\nimport gtk.glade\nimport gconf\n\nclass GconfApp(object):\n\
  \    def __init__(self):\n        #setting the glade file\n        self.gladefile\
