  \nc07.indd 161\n10/6/09 上午 9:01:55\n\n# 第 7 章：主题化\n\n### 设置选项\n\n在 `xorg` 配置中将“RenderAccel”设置为“true”可以提升性能，特别是在\
  \ `GtkTextView` 中。要这样做，请备份当前的 `/etc/X11/xorg.conf`。一种方法是运行以下命令：\n\n```bash\nsudo\
  \ dpkg-reconfigure xserver-xorg\n```\n\n接受默认设置。使新的 `xorg.conf` 的设备部分看起来如下：\n\n```text\n\
  Section “Device”\n  Identifier “Configured Video Device”\n  Option “UseFBDev” “true”\n\
  \  Option “RenderAccel” “true”\nEndSection\n```\n\n将 `RenderAccel` 设置为 `true` 可能会导致一些意外的结果，例如屏幕死机（这就是为什么\
  \ Ubuntu 开发人员默认没有启用它的原因）。请在设备上进行彻底测试。\n\n在运行 Ubuntu Netbook Remix 的 XFCE 基础进行此设置并重启后，`GtkTextView`\
  \ 的时间为 150.95，比原始提升了 10 秒。\n\n使用 GNOME 仓库中最新版本的 `Murrine` 引擎也可以获得一些性能提升。`Murrine\
  \ Engine` 是一种“光滑”且流行的 GTK2 引擎。\n\n为了获得这一优势，可以在 MID 镜像内部编译主题引擎本身，通过向 `sources.list`\
  \ 添加 multiverse 和 universe 仓库，并安装依赖项：\n\n```bash\nsudo apt-get install linux-headers-`uname\
  \ -r build-essential checkinstall libgtk2.0-dev imagemagick libtool\n```\n\n下载最新的\
  \ svn：\n\n```bash\nsvn co http://svn.gnome.org/svn/murrine/trunk/\n```\n\n进入源代码目录并运行以下命令：\n\
  \n```bash\n./autogen.sh\n./configure --prefix=/usr --enable-animation\nmake\nsudo\
  \ checkinstall\n```\n\n这会弹出一些问题。回答 yes 以创建默认文档并选择一个新的软件包描述。然后为 debian 策略选择一个新的软件包版本号，然后按回车。这将创建一个可以使用\
  \ `dpkg -i` 安装的 debian 文件。\n\n### X Window 测试\n\n如果你的主题中存在无法通过某些主题修改解释的开销程序，可以测试\
  \ X Window 图形适配器本身的相对性能，看看问题是否出在那里。这是通过使用 `x11perf` 实现的，它尝试运行大多数 X 绘制操作，然后表征 X Server\
  \ 在给定时间内可以执行多少次这些操作。\n\n162\n\n[www.it-ebooks.info](http://www.it-ebooks.info/)\n\
  \nc07.indd 162\n10/6/09 上午 9:01:56\n\n第 7 章：主题化\n\n为了证明其有效，在 eeePC 和 Acer Aspire\
  \ One 上运行了以下测试（也可以在 MID 上运行）：\n\n```bash\nx11perf -all\n```\n\n\n\n\n开发者认为这是一种简单的方法。\n\
  \n如果两种方法都适用，那么第一种将是更好的解决方案。尽管这看起来显而易见，但这里必须提到，OEM 或用户应该了解硬件规格，以便创建能够在目标设备上正确运行的定制化内核包。\n\
  \n### 创建 Ubuntu 软件包\n\n如前所述，这种方法创建了一个 Ubuntu 内核包。Ubuntu 的内核源码包含许多脚本，能够以自动化方式生成各种内核包。因此，作为该方法的前提条件，用户应该从\
  \ Ubuntu 获取源码。\n\n下载内核源码时有两种选择。你可以从 `deb` 仓库或 `git` 仓库获取。为了获得最新的稳定 Ubuntu 内核源码，你必须从\
  \ Ubuntu git 仓库获取。通常情况下，来自 `deb` 仓库的源码不会像 git 仓库那么新。因此，我们首先演示从 `git` 获取源码的方法，然后介绍\
  \ `deb` 仓库的使用。不过，在开始过程之前，需要安装一些依赖项：\n\n```bash\nsudo apt-get update\nsudo apt-get\
  \ install git-core fakeroot makedumpfile kernel-wedge\nsudo apt-get install libncurses5-dev\
  \ build-essential\nsudo apt-get build-dep linux\n```\n\n现在，克隆 Ubuntu 内核树：\n\n```bash\n\
  git clone git://kernel.ubuntu.com/ubuntu/ubuntu-jaunty.git \\ ubuntu-jaunty.git\n\
  cd ubuntu-jaunty.git/\n```\n\n第一步是将新变体添加到构建脚本中。在所示的两个文件中，将其添加到 `lpia` 架构中：\n\n```bash\n\
  cd debian/\ncd scripts/misc\nsed -e s/getall\\ lpia\\ lpia/getall\\ lpia\\ lpia\\\
  \ lpiacustom/ -i getabis \ncd ../../\ncd rules.d/\nsed -e s/lpia/lpia\\ lpiacustom/\
  \ -i lpia.mk\ncd ../\n```\n\n现在进入配置目录。这里可以修改所有指定的架构配置设置：\n\n```bash\ncd config/lpia/\n\
  ```\n\n正如你在这个目录中看到的，这里有两个配置文件。一个是适用于所有变体的通用配置文件 `config`。另一个是 `config.lpia`，它是 `lpia`\
  \ 变体的特定配置。由于新变体是基于当前的 `lpia` 变体的，你可以如下所示拷贝特定配置文件：\n\n```bash\ncp config.lpia config.lpiacustom\n\
  ```\n\n现在追加所有变体的配置文件。这将使得稍后删除通用配置文件成为可能，因为每个变体都将拥有自己的配置。\n\n```bash\ncat config\n\
  cat config.lpiacustom\n```\n\n下一步是编辑 `lpiacustom` 配置文件。这可以通过以下命令手动完成：\n\n```bash\n\
  vim config.lpiacustom\n```\n\n也可以通过内核的 ncurses 前端配置工具完成。\n\n*Ncurses 是一个用于开发运行在终端下的类\
  \ GUI 应用程序的工具包。在继续之前，必须安装其头文件。*\n\n首先返回父目录：\n\n```bash\ncd ../../../\n```\n\n现在准备内核，然后使用前端对其进行配置：\n\
  \n```bash\ndebian/rules prepare-lpiacustom\nmake O=debian/build/build-lpiacustom\
  \ menuconfig\n```\n\n此时，应该出现一个类似于图 8 - 1 的屏幕。\n\n在新变体中，你只需要更改一些与处理器相关的选项，而其余所有选项将与之前的“lpia”变体保持一致。因此，选择图\
  \ 8 - 2 所示的高亮的 Processor type 和 features 选项。\n\n有两个特定选项将被自定义：对称多处理支持（Symmetric multi-processing\
  \ support）和处理器族（Processor family）。由于目标设备是单处理器机器，禁用第一个选项可以避免处理多处理器机器产生的微小开销。在第二种情况下，选择正确的处理器而非通用处理器可以优化。\n\
  \n*此处演示的配置可能对你的设备并不是最好的。请参考你的设备的技术参考以确定应该选择哪些选项。在与 OEM 工作时，这应该也会在名为“工作条款（term of\
  \ work）”的协议中规定。*\n\n因此，在完成这些更改后，屏幕将如图 8 - 3。\n\n当然，在此步骤中也可以自定义任何其他配置。在离开此前端之前，确保选择\
  \ Yes 以保存更改，如图 8 - 4 所示。\n\n现在有一个新的定制配置文件。该新文件应该替换之前的 `config.lpiacustom`：\n\n```bash\n\
  cp debian/build/build-lpiacustom/.config \\\ndebian/config/lpia/config.lpiacustom\n\
  ```\n\n接下来的两个命令将完成此定制阶段。由于你已经有了特定的（且经过优化的）配置，并且通用配置文件在上一步中已追加到所有其他配置文件中，你可以删除这个通用文件以生成另一个更新的文件：\n\
