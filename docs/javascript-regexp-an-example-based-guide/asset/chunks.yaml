  trans: "\n\n字符串输入可能包含单行或多行。`\\r`、`\\n`、`\\u2028`（行分隔符）和 `\\u2029`（段落分隔符）被视为行分隔符。当使用\
    \ `m` 标志时，`^` 和 `$` 锚分别匹配每一行的开头和结尾。\n\n```\n[](#cb23-1)// 检查字符串中是否有行以 'top' 开头\n\
    [](#cb23-2)> /^top/m.test('hi hello\\ntop spot')\n[](#cb23-3)< true\n[](#cb23-4)\n\
    [](#cb23-5)// 检查字符串中是否有行以 'er' 结尾\n[](#cb23-6)> /er$/m.test('spare\\npar\\nera\\\
    ndare')\n[](#cb23-7)< false\n[](#cb23-8)\n[](#cb23-9)// 检查字符串中是否有完整的行是 'par'\n\
    [](#cb23-10)> /^par$/m.test('spare\\npar\\nera\\ndare')\n[](#cb23-11)< true\n\
    ```\n\n就像字符串锚点一样，你可以单独将行锚点作为模式。\n\n```\n[](#cb24-1)> let items = 'catapults\\\
    nconcatenate\\ncat'\n[](#cb24-2)\n[](#cb24-3)> console.log(items.replace(/^/gm,\
    \ '* '))\n[](#cb24-4)< * catapults\n[](#cb24-5)  * concatenate\n[](#cb24-6)  *\
    \ cat\n[](#cb24-7)\n[](#cb24-8)> console.log(items.replace(/$/gm, '.'))\n[](#cb24-9)<\
    \ catapults.\n[](#cb24-10)  concatenate.\n[](#cb24-11)  cat.\n```\n\n> ![warning](img/file3.svg)\
    \ 如果字符串末尾有行分隔符字符，则在分隔符之后还有一个额外的行开头/结尾匹配。\n\n```\n[](#cb25-1)// 'foo ' 被插入了三次\n\
    [](#cb25-2)> '1\\n2\\n'.replace(/^/mg, 'foo ')\n[](#cb25-3)< \"foo 1\n[](#cb25-4)\
    \  foo 2\n[](#cb25-5)  foo \"\n[](#cb25-6)\n[](#cb25-7)> '1\\n2\\n'.replace(/$/mg,\
    \ ' baz')\n[](#cb25-8)< \"1 baz\n[](#cb25-9)  2 baz\n[](#cb25-10)   baz\"\n```\n\
    \n> ![warning](img/file3.svg) 如果你正在处理基于 Windows 系统的文本文件，可能需要先将 `\\r\\n` 行结束符转换为\
    \ `\\n`。否则，你将获得 `\\r` 和 `\\n` 字符的行尾匹配。你也可以通过在正则表达式中使 `\\r` 为可选字符来处理此情况（请参见 贪婪量符\
    \ ）。\n\n## 单词锚点\n\n第三种限制是单词锚点。字母（不区分大小写）、数字和下划线字符被视为单词字符。你可能会想为什么会有数字和下划线，而不是只有字母？这源于变量和函数的命名规范——通常允许字母、数字和下划线。因此，该定义更倾向于编程语言而非自然语言。\n\
    \n转义序列 `\\b` 表示单词边界。这同时适用于单词开头和单词结尾的锚定。单词开头意味着单词之前的字符是非单词字符，或者没有字符（字符串开头）。同样，单词结尾意味着单词之后的字符是非单词字符，或者没有字符（字符串结尾）。这意味着你无法在没有单词字符的情况下单词边界\
    \ `\\b`。\n\n```\n[](#cb26-1)> let sample = 'par spar apparent spare part'\n[](#cb26-2)\n\
    [](#cb26-3)// 无论 'par' 出现在何处都替换\n[](#cb26-4)> sample.replace(/par/g, 'X')\n[](#cb26-5)<\
    \ \"X sX apXent sXe Xt\"\n[](#cb26-6)// 仅在单词开头替换 'par'\n[](#cb26-7)> sample.replace(/\\\
    bpar/g, 'X')\n[](#cb26-8)< \"X spar apparent spare Xt\"\n[](#cb26-9)// 仅在单词结尾替换\
    \ 'par'\n[](#cb26-10)> sample.replace(/par\\b/g, 'X')\n[](#cb26-11)< \"X sX apparent\
    \ spare part\"\n[](#cb26-12)// 仅当 'par' 不是另一个单词的一部分时替换\n[](#cb26-13)> sample.replace(/\\\
    bpar\\b/g, 'X')\n[](#cb26-14)< \"X spar apparent spare part\"\n```\n\n你可以通过将单词边界单独作为模式来发挥更多创意。\n\
    \n```\n[](#cb27-1)// 将空格分隔的单词转换为双引号 CSV\n[](#cb27-2)// 注意这里使用了两次 'replace' 方法\n\
    [](#cb27-3)> let sample = 'par spar apparent spare part'\n[](#cb27-4)> console.log(sample.replace(/\\\
    b/g, '\"').replace(/ /g, ','))\n[](#cb27-5)< \"par\",\"spar\",\"apparent\",\"\
    spare\",\"part\"\n[](#cb27-6)\n[](#cb27-7)// 让编程语句更具读性\n[](#cb27-8)// 仅用于说明目的，不适用于所有情况\n\
    [](#cb27-9)> 'foo_baz=num1+35*42/num2'.replace(/\\b/g, ' ')\n[](#cb27-10)< \"\
    \ foo_baz = num1 + 35 * 42 / num2 \"\n[](#cb27-11)// 字符串开头/结尾的多余空格可以修剪\n[](#cb27-12)//\
    \ 稍你将学习如何添加修饰符使得不需要修剪\n[](#cb27-13)> 'foo_baz=num1+35*42/num2'.replace(/\\b/g,\
    \ ' ').trim()\n[](#cb27-14)< \"foo_baz = num1 + 35 * 42 / num2\"\n```\n\n单词边界也有反向锚点。`\\\
    B` 匹配所有 `\\b` 不匹配的地方。这种双重性稍后会在其他转义序列中看到。\n\n```\n[](#cb28-1)> let sample = 'par\
    \ spar apparent spare part'\n[](#cb28-2)\n[](#cb28-3)// 如果 'par' 不是单词开头则替换\n[](#cb28-4)>\
    \ sample.replace(/\\Bpar/g, 'X')\n[](#cb28-5)< \"par sX apXent sXe part\"\n[](#cb28-6)//\
    \ 在单词结尾替换 'par' 但不是替换整个单词 'par'\n[](#cb28-7)> sample.replace(/\\Bpar\\b/g, 'X')\n\
    [](#cb28-8)< \"par sX apparent spare part\"\n[](#cb28-9)// 如果 'par' 不是单词结尾则替换\n\
    [](#cb28-10)> sample.replace(/\\bpar/g, 'X')\n[](#cb28-11)< \"X sX apparent spare\
    \ part\" // 等等，原文这里是 \\bpar 吗？让我重新检查。\n// 重新检查原文：[](#cb28-10)> sample.replace(/\\\
