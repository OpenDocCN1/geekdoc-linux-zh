  trans: "\n\n```javascript\n// remove square brackets that surround digit characters\n\
    > '[52] apples [and] [31] mangoes'.replace(/\\[(\\d+)\\]/g, '$1')\n< \"52 apples\
    \ [and] 31 mangoes\"\n\n// replace __ with _ and delete _ if it is alone\n> '_foo_\
    \ __123__ _baz_'.replace(/(_)?_/g, '$1')\n< \"foo _123_ baz\"\n\n// swap words\
    \ that are separated by a comma\n> 'good,bad 42,24'.replace(/(\\w+),(\\w+)/g,\
    \ '$2,$1')\n< \"bad,good 24,42\"\n```\n\n以下是一些使用默认提供的反引用而无需捕获组的示例。\n\n```javascript\n\
    // add something around the entire matched portion\n> '52 apples and 31 mangoes'.replace(/\\\
    d+/g, '($&)')\n< \"(52) apples and (31) mangoes\"\n> 'Hello world'.replace(/.*/,\
    \ 'Hi. $&. Have a nice day')\n< \"Hi. Hello world. Have a nice day\"\n\n// duplicate\
    \ first field and add it as last field\n> 'fork,42,nice,3.14'.replace(/,.+/, '$&,$`')\n\
    < \"fork,42,nice,3.14,fork\"\n```\n\n以下是一些在正则表达式定义中使用反引用的示例。\n\n```javascript\n\
    // elements that have at least one consecutive repeated word character\nlet words\
    \ = ['moon', 'mono', 'excellent', 'poll']\n> words.filter(w => /(\\w)\\1/.test(w))\n\
    < [\"moon\", \"excellent\", \"poll\"]\n\n// remove any number of consecutive duplicate\
    \ words separated by space\n// note the use of quantifier on backreference\n//\
    \ use \\W+ instead of space to cover cases like 'a;a<-;a'\n> 'aa a a a 42 f_1\
    \ f_1 f_13.14'.replace(/\\b(\\w+)(  \\1)+\\b/g, '$1')\n< \"aa a 42 f_1 f_13.14\"\
    \n```\n\n## 反引用的特殊情况\n\n由于 `$` 在替换部分是特殊字符，当它后面跟着数字时，将其字面插入会遇到问题。通常使用转义来实现此目的，但在这里你需要使用\
    \ `$$`。\n\n```javascript\n// no capture group used, so '$1' is inserted literally\n\
    > 'cat'.replace(/a/, '{$1}')\n< \"c{$1}t\"\n// capture group used, '\\$1' is same\
    \ as '$1' here\n> 'cat'.replace(/(a)/, '{\\$1}')\n< \"c{a}t\"\n// use '$$' to\
    \ avoid backreference and insert '$' literally\n> 'cat'.replace(/(a)/, '{$$1}')\n\
    < \"c{$1}t\"\n```\n\n另一个问题是，当普通数字紧跟在反引用后面时，如何避免歧义？这取决于模式中存在多少个反引用，以及你需要在正则表达式定义中还是替换部分避免歧义。例如，如果组少于\
    \ 10 个，那么类似于 `$12` 将引用第一个捕获组，并将 `2` 视为字符。如果没有捕获组，那么类似于 `$5` 将被字面插入为 `$` 和 `5`。\n\
    \n```javascript\n// $15 here will backreference 1st group and use 5 as a character\n\
    > '[52] apples and [31] mangoes'.replace(/\\[(\\d+)\\]/g, '($15)')\n< \"(525)\
    \ apples and (315) mangoes\"\n\n// $3 will be inserted literally since there is\
    \ only one capture group\n> '[52] apples and [31] mangoes'.replace(/\\[(\\d+)\\\
    ]/g, '$3')\n< \"$3 apples and $3 mangoes\"\n\n// $1 will be inserted literally\
    \ since there are no capture groups\n> '[52] apples and [31] mangoes'.replace(/\\\
    [\\d+\\]/g, '$1')\n< \"$1 apples and $1 mangoes\"\n```\n\n另一方面，如果你有超过 `9` 个但少于\
    \ `100` 个组，那么当你引用单个组并在后跟数字时就会出现问题。解决方法是在前面前缀 `0`，使得 `$` 后面的数字位数等于最高捕获组所需的数字位数。因此，如果你有超过\
    \ `9` 个但少于 `100` 个组，`$05` 将引用第 `5` 个捕获组，之后的任何数字都将被视为字面量。\n\n```javascript\n//\
    \ 为了说明目的，定义了 12 个捕获组\n// 如果你想引用 2 位的组，则没有问题\n> 'abcdefghijklmn'.replace(/(.)(.)(.)(.)(.)(.)(.)(.)(.)(.)/,\
    \ '$11') // 等，这个逻辑不是我想展示的。\n// 前缀 '0' 使得 '$01' 变成引用，而 '1' 变成字符\n> 'abcdefghijklmn'.replace(/(.)(.)(.)(.)(.)(.)(.)(.)(.)(.)/,\
    \ '$01') // \n```\n\n正则表达式定义中的解决方法更简单。`0` 前缀技巧不起作用，但使用 ASCII 码 `\\xh` 是起的。例如，`\\\
    11` 将引用第一个捕获组，并在后面跟 `1` 作为字符。\n\n```javascript\n> 'abcdefghijklna1d'.replace(/(.)(.)(.)(.)(.)(.)(.)(.)(.)(.).).*\\\
    11/, 'X')\n< \"Xd\"\n```\n\n## 非捕获组\n\n分组有许多用途，例如对正则表达式部分应用量化、通过提取公共部分创建精简的正则表达式等。它还会影响\
    \ `split` 方法的输出，如带捕获组的 split 所示。与其他语言中的类似方法不同，带有 `g` 标志的 `match` 方法不受受捕获组的影响，并返回整个匹配部分。\n\
    \n```javascript\n// 没有捕获组的 split 方法\n> 'Sample123string42with777numbers'.split(/\\\
    d+/)\n< [\"Sample\", \"string\", \"with\", \"numbers\"]\n// 带捕获组的 split 方法\n>\
    \ 'Sample123string42with777numbers'.split(/(\\d+)/)\n< [\"Sample\", \"123\", \"\
    string\", \"42\", \"with\", \"777\", \"numbers\"]\n\n// 使用 'g' 标志和捕获组的 match 方法示例\n\
    > 'effort flee oddball rat tool'.match(/\\b\\w*(\\w)\\1\\w*\\b/g)\n< [\"effort\"\
    , \"flee\", \"oddball\", \"tool\"]\n// 另一个示例\n> 'hi 123123 bye 456123'.match(/(123)+/g)\n\
    < [\"123123\", \"123\"]\n```\n\n当不需要反引用时，可以使用非捕获组来避免 `split` 方法的行为变化。当特定组不需要反引用时，它也有助于避免捕获组编号。语法是\
    \ `(?:pat)` 来定义非捕获组，其中 `pat` 是正则表达式部分的缩写。更多以 `(?` 开头的特殊组将在以后讨论。\n\n```javascript\n\
    // 这里，需要分组来提取公共部分并应用量化\n// 但使用捕获组将产生预期的输出\n> '123hand42handy777ful500'.split(/hand(y|ful)?/)\n\
    < [\"123\", undefined, \"42\", \"y\", \"777\", \"ful\", \"500\"]\n// 非捕获组救了场\n\
    > '123hand42handy777ful500'.split(/hand(?:y|ful)?/)\n< [\"123\", \"42\", \"777\"\
    , \"500\"]\n\n// 使用普通分组，需要跟踪所有的组\n> '1,2,3,4,5,6,7'.replace(/^(([^,]+,){3})([^,]+)/,\
    \ '$1($3)')\n< \"1,2,3,(4),5,6,7\"\n// 使用非捕获组，只需要跟踪组\n> '1,2,3,4,5,6,7'.replace(/^((?:[^,]+,){3})([^,]+)/,\
    \ '$1($2)')\n< \"1,2,3,(4),5,6,7\"\n```\n\n引用带有量化器的捕获组匹配的文本将只给出最后一次匹配，而不是整个匹配。将分组和量化一起包裹在捕获组中以获取整个匹配部分。\n\
    \n"
