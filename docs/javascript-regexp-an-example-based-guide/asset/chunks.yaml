    \ \"A for A, don't be A\"\n```\n\n# 转义元字符\n\n你已经看到了一些有助于构建正则表达式字面量的元字符和转义序列。此外还有\
    \ `/` 字符被用作正则表达式对象的边界符。本章将讨论如何移除此类结构的特殊含义。此外，你还将学习在从普通字符串构建正则表达式字面量时，如何处理特殊字符。\n\
    \n## 使用 \\ 进行转义\n\n要字面量地匹配元字符（即移除它们的特殊含义），请在这些字符前加上 `\\` 字符。要表示字面量上的 `\\` 字符，请使用\
    \ `\\\\`。\n\n```javascript\n[](#cb49-1)//即使 ^ 没有被用作锚点，它也不会被字面匹配\n[](#cb49-2)>\
    \ /b²/.test('a² + b² - C*3')\n[](#cb49-3)< false\n[](#cb49-4)// 转义将生效\n[](#cb49-5)>\
    \ /b\\²/.test('a² + b² - C*3')\n[](#cb49-6)< true\n[](#cb49-7)\n[](#cb49-8)> '(a*b)\
    \ + c'.replace(/\\(|\\)/g, '')\n[](#cb49-9)< \"a*b + c\"\n[](#cb49-10)\n[](#cb49-11)>\
    \ '\\\\learn\\\\by\\\\example'.replace(/\\\\/g, '/')\n[](#cb49-12)< \"/learn/by/example\"\
    \n```\n\n## 动态转义元字符\n\n当你自己定义正则表达式时，可以根据需要手动转义元字符。然而，如果你有从其他处获取字符串并需要字面量地匹配内容，你必须在构建正则表达式时设地转义所有元字符。解决方案自然是使用正则表达式！通常编程语言本身会为这种情况提供内置方法。JavaScript\
    \ 没有，但 [MDN：正则表达式文档](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Regular_Expressions)\
    \ 以如下所示函数的形式涵盖了这个问题。\n\n```javascript\n[](#cb50-1)> function escapeRegExp(string)\
    \ {\n  return string.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&');\n}\n```\n\n\
    （注：上述代码块是根据所描述的任务的标准逻辑重构的，因为原始文本在提示中已截断或不完整）。\n\n"
