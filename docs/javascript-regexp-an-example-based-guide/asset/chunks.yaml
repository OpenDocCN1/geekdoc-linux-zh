    ## 速查表与总结


    | 注意事项 | 说明 |

    | --- | --- |

    | `\` | 在元字符前加上 `\` 以以字面量匹配它们 |

    | `\\` | 用于字面量匹配 `\` |

    | `source` | 将 RegExp 对象转换为字符串的属性 |

    | | 有助于将正则表达式插入另一个正则表达式中 |

    | `flags` | 获取 RegExp 对象的标志的属性 |

    | `RegExp(`pat`)` | 有助于避免或减少对 `/` 定隔符的转义 |

    | 分支优先级 | 如果匹配的起始位置相同，则从左到右进行决胜 |

    | | 健壮的解决方案：根据长度对分支进行排序，最长的在前 |


