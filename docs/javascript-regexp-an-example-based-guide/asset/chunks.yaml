    # Preface


    Scripting and automation tasks often need to extract particular portions of text
    from input data or modify them from one format to another. This book will help
    you learn Regular Expressions as implemented in JavaScript. Regular expressions
    can be considered as a mini-programming language in itself and is well suited
    for a variety of text processing needs.


    The book heavily leans on examples to present features of regular expressions
    one by one. It is recommended that you manually type each example and experiment
    with them. Understanding both the nature of sample input string and the output
    produced is essential. As an analogy, consider learning to drive a bike or a car
    — no matter how much you read about them or listen to explanations, you need to
    practice a lot and infer your own conclusions. Should you feel that copy-paste
    is ideal for you, [code snippets are available chapter wise on GitHub](https://github.com/learnbyexample/learn_js_regexp/tree/master/code_snippets).


    ## Prerequisites


    A good understanding of basic-level programming concepts and prior experience
    working with JavaScript. Should also know functional programming concepts like
    `map` and `filter`.


    ## Conventions


    * The examples presented here have been tested on Chrome/Chromium console (version
    81+) and includes features not available in other browsers and platforms.

    * Code snippets shown are copy pasted from the console and modified for presentation
    purposes. Some of the commands are preceded by comments to provide context and
    explanations. Blank lines have been added to improve readability and output is
    skipped when it is `undefined` or otherwise unnecessary to be shown.

    * Unless otherwise noted, all examples and explanations are meant for `ASCII`
    characters.

    * External links are provided for further reading throughout the book. Not necessary
    to immediately visit them. They have been chosen with care and would help, especially
    during rereads.

    * The [learn_js_regexp](https://github.com/learnbyexample/learn_js_regexp) repo
    has all the code snippets and exercises and other details related to the book.
    Click the **Clone** button to get the files.


