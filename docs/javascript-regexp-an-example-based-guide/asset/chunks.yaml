    \ match if regexp succeeds |\n| | `-1` if regexp fails |\n\nThis chapter introduced\
    \ `match` and `matchAll` methods, which allows you to work with various matching\
    \ portions of input string. The `search` method is handy if you just need the\
    \ starting location of the first match. The `replace` method allows you to use\
    \ a function as replacement, which helps to process the matching portions before\
    \ being used as replacement string. You can also use a dictionary to provide replacement\
    \ string based on matched portion as key. You learnt about capture groups and\
    \ you'll see even more uses of groupings in coming chapters.\n\n## Exercises\n\
