    \ tale\"\n[](#cb77-6)> 'star'.replace(/t.*?a/, 'X')\n[](#cb77-7)< \"sXr\"\n[](#cb77-8)\n\
    [](#cb77-9)// matching first 't' to first 'a' for t.*?a won't work for this case\n\
    [](#cb77-10)// so, regexp engine will move forward until .*?f matches and so on\n\
    [](#cb77-11)> sentence.replace(/t.*?a.*?f/, 'X')\n[](#cb77-12)< \"Xabricated tale\"\
    \n```\n\n## s flag\n\nUse `s` flag to allow `.` metacharacter to match `\\r`,\
    \ `\\n` and line/paragraph separator characters as well.\n\n```\n[](#cb78-1)//\
    \ by default, the . metacharacter doesn't match line separators\n[](#cb78-2)>\
    \ 'Hi there\\nHave a Nice Day'.replace(/the.*ice/, 'X')\n[](#cb78-3)< \"Hi there\n\
    [](#cb78-4)  Have a Nice Day\"\n[](#cb78-5)\n[](#cb78-6)// 's' flag will allow\
    \ line separators to be matched as well\n[](#cb78-7)> 'Hi there\\nHave a Nice\
    \ Day'.replace(/the.*ice/s, 'X')\n[](#cb78-8)< \"Hi X Day\"\n```\n\n## Cheatsheet\
    \ and Summary\n\n| Note | Description |\n| --- | --- |\n| `.` | match any character\
    \ except line separators |\n| `s` | flag to match line separators as well with\
    \ `.` metacharacter |\n| greedy | match as much as possible |\n| `?` | greedy\
    \ quantifier, match `0` or `1` times |\n| `*` | greedy quantifier, match `0` or\
    \ more times |\n| `+` | greedy quantifier, match `1` or more times |\n| `{m,n}`\
    \ | greedy quantifier, match `m` to `n` times |\n| `{m,}` | greedy quantifier,\
    \ match at least `m` times |\n| `{n}` | greedy quantifier, match exactly `n` times\
    \ |\n| `pat1.*pat2` | any number of characters between `pat1` and `pat2` |\n|\
    \ `pat1.*pat2&#124;pat2.*pat1` | match both `pat1` and `pat2` in any order |\n\
    | non-greedy | append `?` to greedy quantifier |\n| | match as minimally as possible\
    \ |\n| `s.split(/pat/)` | split a string based on regexp |\n\nThis chapter introduced\
    \ the concept of specifying a placeholder instead of fixed string. When combined\
    \ with quantifiers, you've seen a glimpse of how a simple regexp can match wide\
    \ range of text. In coming chapters, you'll learn how to create your own restricted\
    \ set of placeholder characters.\n\n## Exercises\n\n> ![info](media/file2.svg)\
    \ Use `s` flag for these exercises depending upon the contents of input strings.\n\
    \n**a)** Replace `42//5` or `42/5` with `8` for the given input.\n\n```\n[](#cb79-1)>\
