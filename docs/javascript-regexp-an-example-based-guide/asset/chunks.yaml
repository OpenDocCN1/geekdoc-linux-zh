    # Dot metacharacter and Quantifiers


    This chapter introduces several more metacharacters. Similar to the `repeat` string
    method, quantifiers allow to repeat a portion of regular expression pattern and
    thus make it compact and improve readability. Quantifiers can also be specified
    as both bounded and unbounded ranges to match varying quantities of the pattern.
    Previously, alternation was used to construct OR conditional. Adding dot metacharacter
    and quantifiers to the mix, you can construct AND conditional.


    ## Dot metacharacter


    The dot metacharacter serves as a placeholder to match *any* character except
    `\r`, `\n`, `\u2028` (line separator) and `\u2029` (paragraph separator) characters.


    ```

    [](#cb65-1)// matches character ''c'', any character and then character ''t''

    [](#cb65-2)> ''tac tin c.t abc;tuv acute''.replace(/c.t/g, ''X'')

    [](#cb65-3)< "taXin X abXuv aXe"

    [](#cb65-4)

    [](#cb65-5)// matches character ''r'', any two characters and then character ''d''

    [](#cb65-6)> ''breadth markedly reported overrides''.replace(/r..d/g, ''X'')

    [](#cb65-7)< "bXth maXly repoX oveXes"

    [](#cb65-8)

    [](#cb65-9)// matches character ''2'', any character and then character ''3''

    [](#cb65-10)> ''42\t33''.replace(/2.3/, ''8'')

    [](#cb65-11)< "483"

    ```


    The [s flag](#ch007.xhtml_s-flag) section will show how to include line separators
    as well. Chapter [Character class](#ch010.xhtml_character-class) will discuss
    how to define your own custom placeholder for limited set of characters.


    ## split method


    This chapter will additionally use `split` method to illustrate examples. The
    `split` method separates the string based on given regexp (or string) and returns
    an array of strings.


    ```

    [](#cb66-1)> ''apple-85-mango-70''.split(/-/)

    [](#cb66-2)< ["apple", "85", "mango", "70"]

    [](#cb66-3)

    [](#cb66-4)// use optional ''limit'' argument to specify max no. of output elements

    [](#cb66-5)> ''apple-85-mango-70''.split(/-/, 2)

    [](#cb66-6)< ["apple", "85"]

    [](#cb66-7)

    [](#cb66-8)// example with dot metacharacter

    [](#cb66-9)> ''bus:3:car:5:van''.split(/:.:/)

    [](#cb66-10)< ["bus", "car", "van"]

    ```


    See [split with capture groups](#ch009.xhtml_split-with-capture-groups) section
    for details of how capture groups affect the output of `split` method.


    ## Greedy quantifiers'
