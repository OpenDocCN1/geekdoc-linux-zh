  raw: '| `s.match(/pat/g)` | returns only the matched portions, no properties |


    |  | capture group doesn''t affect the output |


    |  | `match` returns `null` if regexp fails |


    | `s.matchAll(/pat/g)` | returns an iterator containing details for |


    |  | each matched portion and its properties |


    |  | use `[...]` or `Array.from` to convert to array |


    |  | `Array.from` also allows mapping function |


    | `s.replace(/pat/, func)` | you can use a function to provide replacement string
    |


    |  | each matched portion details gets passed as arguments |


    |  | similarly, dictionary can be used for replacement |


    | `s.search(/pat/)` | gives starting location of first match if regexp succeeds
    |


    |  | `-1` if regexp fails |


    This chapter introduced `match` and `matchAll` methods, which allows you to work
    with various matching portions of input string. The `search` method is handy if
    you just need the starting location of the first match. The `replace` method allows
    you to use a function as replacement, which helps to process the matching portions
    before being used as replacement string. You can also use a dictionary to provide
    replacement string based on matched portion as key. You learnt about capture groups
    and you''ll see even more uses of groupings in coming chapters.


