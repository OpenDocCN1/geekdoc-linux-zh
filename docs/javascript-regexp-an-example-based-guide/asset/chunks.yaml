    \ \"Summary\" in the user's text.\nI will just output the formatted version of\
    \ the text provided.\n[/content] (Wait, I need to output the final result now).\n\
    \n*Final check of the rules:*\n- Re-divide headers: Yes.\n- Optimize paragraphs:\
    \ Yes.\n- Keep core content: Yes.\n- Backticks for variables/functions/paths:\
    \ Yes.\n- Code blocks with ```: Yes.\n\nLet's do it.\n\n[content]\nA string input\
    \ may contain single or multiple lines. The `\\r`, `\\n`, `\\u2028` (line separator)\
    \ and `\\u2029` (paragraph separator) characters are considered as line separators.\
    \ When the `m` flag is used, the `^` and `$` anchors will match the start and\
    \ end of every line respectively.\n\n```\n[](#cb23-1)// check if any line in the\
    \ string starts with 'top'\n[](#cb23-2)> /^top/m.test('hi hello\\ntop spot')\n\
    [](#cb23-3)< true\n[](#cb23-4)\n[](#cb23-5)// check if any line in the string\
    \ ends with 'er'\n[](#cb23-6)> /er$/m.test('spare\\npar\\nera\\ndare')\n[](#cb23-7)<\
    \ false\n[](#cb23-8)\n[](#cb23-9)// check if any complete line in the string is\
    \ 'par'\n[](#cb23-10)> /^par$/m.test('spare\\npar\\nera\\ndare')\n[](#cb23-11)<\
    \ true\n```\n\nJust like string anchors, you can use the line anchors by themselves\
    \ as a pattern.\n\n```\n[](#cb24-1)> let items = 'catapults\\nconcatenate\\ncat'\n\
    [](#cb24-2)\n[](#cb24-3)> console.log(items.replace(/^/gm, '* '))\n[](#cb24-4)<\
    \ * catapults\n[](#cb24-5)  * concatenate\n[](#cb24-6)  * cat\n[](#cb24-7)\n[](#cb24-8)>\
    \ console.log(items.replace(/$/gm, '.'))\n[](#cb24-9)< catapults.\n[](#cb24-10)\
    \  concatenate.\n[](#cb24-11)  cat.\n```\n\n> ![warning](media/file3.svg) If there\
    \ is a line separator character at the end of string, there is an additional start/end\
    \ of line match after the separator.\n\n```\n[](#cb25-1)// 'foo ' is inserted\
    \ three times\n[](#cb25-2)> '1\\n2\\n'.replace(/^/mg, 'foo ')\n[](#cb25-3)< \"\
    foo 1\n[](#cb25-4)  foo 2\n[](#cb25-5)  foo \"\n[](#cb25-6)\n[](#cb25-7)> '1\\\
    n2\\n'.replace(/$/mg, ' baz')\n[](#cb25-8)< \"1 baz\n[](#cb25-9)  2 baz\n[](#cb25-10)\
    \   baz\"\n```\n\n> ![warning](media/file3.svg) If you are dealing with Windows\
    \ OS based text files, you may have to convert `\\r\\n` line endings to `\\n`\
    \ first. Otherwise, you'll get end of line matches for both `\\r` and `\\n` characters.\
    \ You can also handle this case in regexp by making `\\r` as optional character\
    \ with quantifiers (see [Greedy quantifiers](#ch007.xhtml_greedy-quantifiers)\
    \ section).\n\n## Word anchors\n\nThe third type of restriction is word anchors.\
    \ Alphabets (irrespective of case), digits and the underscore character qualify\
    \ as word characters. You might wonder why there are digits and underscores as\
    \ well, why not only alphabets? This comes from variable and function naming conventions\
    \ — typically alphabets, digits and underscores are allowed. So, the definition\
    \ is more oriented to programming languages than natural ones.\n\nThe escape sequence\
    \ `\\b` denotes a word boundary. This works for both the start of word and end\
    \ of word anchoring. Start of word means either the character prior to the word\
    \ is a non-word character or there is no character (start of string). Similarly,\
    \ end of word means the character after the word is a non-word character or no\
    \ character (end of string). This implies that you cannot have word boundary `\\\
    b` without a word character.\n\n```\n[](#cb26-1)> let sample = 'par spar apparent\
    \ spare part'\n[](#cb26-2)\n[](#cb26-3)// replace 'par' irrespective of where\
    \ it occurs\n[](#cb26-4)> sample.replace(/par/g, 'X')\n[](#cb26-5)< \"X sX apXent\
    \ sXe Xt\"\n[](#cb26-6)// replace 'par' only at the start of word\n[](#cb26-7)>\
    \ sample.replace(/\\bpar/g, 'X')\n[](#cb26-8)< \"X spar apparent spare Xt\"\n\
    [](#cb26-9)// replace 'par' only at the end of word\n[](#cb26-10)> sample.replace(/par\\\
    b/g, 'X')\n[](#cb26-11)< \"X sX apparent spare part\"\n[](#cb26-12)// replace\
    \ 'par' only if it is not part of another word\n[](#cb26-13)> sample.replace(/\\\
    bpar\\b/g, 'X')\n[](#cb26-14)< \"X spar apparent spare part\"\n```\n\nYou can\
    \ get lot more creative with using word boundary as a pattern by itself.\n\n```\n\
    [](#cb27-1)// space separated words to double quoted csv\n[](#cb27-2)// note that\
    \ 'replace' method is used twice here\n[](#cb27-3)> let sample = 'par spar apparent\
    \ spare part'\n[](#cb27-4)> console.log(sample.replace(/\\b/g, '\"').replace(/\
    \ /g, ','))\n[](#cb27-5)< \"par\",\"spar\",\"apparent\",\"spare\",\"part\"\n[](#cb27-6)\n\
    [](#cb27-7)// make a programming statement more readable\n[](#cb27-8)// shown\
    \ for illustration purpose only, won't work for all cases\n[](#cb27-9)> 'foo_baz=num1+35*42/num2'.replace(/\\\
    b/g, ' ')\n[](#cb27-10)< \" foo_baz = num1 + 35 * 42 / num2 \"\n[](#cb27-11)//\
    \ excess space at start/end of string can be trimmed off\n[](#cb27-12)// later\
    \ you'll learn how to add a qualifier so that trim is not needed\n[](#cb27-13)>\
    \ 'foo_baz=num1+35*42/num2'.replace(/\\b/g, ' ').trim()\n[](#cb27-14)< \"foo_baz\
    \ = num1 + 35 * 42 / num2\"\n```\n\nThe word boundary has an opposite anchor too.\
    \ `\\B` matches wherever `\\b` doesn't match. This duality will be seen later\
    \ with some other escape sequences too.\n\n```\n[](#cb28-1)> let sample = 'par\
    \ spar apparent spare part'\n[](#cb28-2)\n[](#cb28-3)// replace 'par' if it is\
    \ not start of word\n[](#cb28-4)> sample.replace(/\\Bpar/g, 'X')\n[](#cb28-5)<\
    \ \"par sX apXent sXe part\"\n[](#cb28-6)// replace 'par' at the end of word but\
    \ not whole word 'par'\n[](#cb28-7)> sample.replace(/\\Bpar\\b/g, 'X')\n[](#cb28-8)<\
    \ \"par sX apparent spare part\"\n[](#cb28-9)// replace 'par' if it is not end\
    \ of word\n[](#cb28-10)> sample.replace(/\\bpar/g, 'X')\n[](#cb28-11)< \"X sX\
    \ apparent spare part\"\n```\n"
  raw: 'A string input may contain single or multiple lines. The `\r`, `\n`, `\u2028`
    (line separator) and `\u2029` (paragraph separator) characters are considered
    as line separators. When the `m` flag is used, the `^` and `$` anchors will match
    the start and end of every line respectively.


    ```

    [](#cb23-1)// check if any line in the string starts with ''top''

    [](#cb23-2)> /^top/m.test(''hi hello\ntop spot'')

    [](#cb23-3)< true

    [](#cb23-4)

    [](#cb23-5)// check if any line in the string ends with ''er''

    [](#cb23-6)> /er$/m.test(''spare\npar\nera\ndare'')

    [](#cb23-7)< false

    [](#cb23-8)

    [](#cb23-9)// check if any complete line in the string is ''par''

    [](#cb23-10)> /^par$/m.test(''spare\npar\nera\ndare'')

    [](#cb23-11)< true

    ```


    Just like string anchors, you can use the line anchors by themselves as a pattern.


    ```

    [](#cb24-1)> let items = ''catapults\nconcatenate\ncat''

    [](#cb24-2)

    [](#cb24-3)> console.log(items.replace(/^/gm, ''* ''))

    [](#cb24-4)< * catapults

    [](#cb24-5)  * concatenate

    [](#cb24-6)  * cat

    [](#cb24-7)

    [](#cb24-8)> console.log(items.replace(/$/gm, ''.''))

    [](#cb24-9)< catapults.

    [](#cb24-10)  concatenate.

    [](#cb24-11)  cat.

    ```


    > ![warning](media/file3.svg) If there is a line separator character at the end
    of string, there is an additional start/end of line match after the separator.


    ```

    [](#cb25-1)// ''foo '' is inserted three times

    [](#cb25-2)> ''1\n2\n''.replace(/^/mg, ''foo '')

    [](#cb25-3)< "foo 1

    [](#cb25-4)  foo 2

    [](#cb25-5)  foo "

    [](#cb25-6)

    [](#cb25-7)> ''1\n2\n''.replace(/$/mg, '' baz'')

    [](#cb25-8)< "1 baz

    [](#cb25-9)  2 baz

    [](#cb25-10)   baz"

    ```


    > ![warning](media/file3.svg) If you are dealing with Windows OS based text files,
    you may have to convert `\r\n` line endings to `\n` first. Otherwise, you''ll
    get end of line matches for both `\r` and `\n` characters. You can also handle
    this case in regexp by making `\r` as optional character with quantifiers (see
    [Greedy quantifiers](#ch007.xhtml_greedy-quantifiers) section).


    ## Word anchors


    The third type of restriction is word anchors. Alphabets (irrespective of case),
    digits and the underscore character qualify as word characters. You might wonder
    why there are digits and underscores as well, why not only alphabets? This comes
    from variable and function naming conventions — typically alphabets, digits and
    underscores are allowed. So, the definition is more oriented to programming languages
    than natural ones.


    The escape sequence `\b` denotes a word boundary. This works for both the start
    of word and end of word anchoring. Start of word means either the character prior
    to the word is a non-word character or there is no character (start of string).
    Similarly, end of word means the character after the word is a non-word character
    or no character (end of string). This implies that you cannot have word boundary
    `\b` without a word character.


    ```

    [](#cb26-1)> let sample = ''par spar apparent spare part''

    [](#cb26-2)

    [](#cb26-3)// replace ''par'' irrespective of where it occurs

    [](#cb26-4)> sample.replace(/par/g, ''X'')

    [](#cb26-5)< "X sX apXent sXe Xt"

    [](#cb26-6)// replace ''par'' only at the start of word

    [](#cb26-7)> sample.replace(/\bpar/g, ''X'')

    [](#cb26-8)< "X spar apparent spare Xt"

    [](#cb26-9)// replace ''par'' only at the end of word

    [](#cb26-10)> sample.replace(/par\b/g, ''X'')

    [](#cb26-11)< "X sX apparent spare part"

    [](#cb26-12)// replace ''par'' only if it is not part of another word

    [](#cb26-13)> sample.replace(/\bpar\b/g, ''X'')

    [](#cb26-14)< "X spar apparent spare part"

    ```


    You can get lot more creative with using word boundary as a pattern by itself.


    ```

    [](#cb27-1)// space separated words to double quoted csv

    [](#cb27-2)// note that ''replace'' method is used twice here

    [](#cb27-3)> let sample = ''par spar apparent spare part''

    [](#cb27-4)> console.log(sample.replace(/\b/g, ''"'').replace(/ /g, '',''))

    [](#cb27-5)< "par","spar","apparent","spare","part"

    [](#cb27-6)

    [](#cb27-7)// make a programming statement more readable

    [](#cb27-8)// shown for illustration purpose only, won''t work for all cases

    [](#cb27-9)> ''foo_baz=num1+35*42/num2''.replace(/\b/g, '' '')

    [](#cb27-10)< " foo_baz = num1 + 35 * 42 / num2 "

    [](#cb27-11)// excess space at start/end of string can be trimmed off

    [](#cb27-12)// later you''ll learn how to add a qualifier so that trim is not
    needed

    [](#cb27-13)> ''foo_baz=num1+35*42/num2''.replace(/\b/g, '' '').trim()

    [](#cb27-14)< "foo_baz = num1 + 35 * 42 / num2"

    ```


    The word boundary has an opposite anchor too. `\B` matches wherever `\b` doesn''t
    match. This duality will be seen later with some other escape sequences too.


    ```

    [](#cb28-1)> let sample = ''par spar apparent spare part''

    [](#cb28-2)

    [](#cb28-3)// replace ''par'' if it is not start of word

    [](#cb28-4)> sample.replace(/\Bpar/g, ''X'')

    [](#cb28-5)< "par sX apXent sXe part"

    [](#cb28-6)// replace ''par'' at the end of word but not whole word ''par''

    [](#cb28-7)> sample.replace(/\Bpar\b/g, ''X'')

    [](#cb28-8)< "par sX apparent spare part"

    [](#cb28-9)// replace ''par'' if it is not end of word

    [](#cb28-10)> sample.replace(/par\B/g, ''X'')

    [](#cb28-11)< "par spar apXent sXe Xt"

    [](#cb28-12)// replace ''par'' if it is surrounded by word characters

    [](#cb28-13)> sample.replace(/\Bpar\B/g, ''X'')

    [](#cb28-14)< "par spar apXent sXe part"

    ```


    Here''s some standalone pattern usage to compare and contrast the two word anchors.


    ```

    [](#cb29-1)> ''copper''.replace(/\b/g, '':'')

    [](#cb29-2)< ":copper:"

    [](#cb29-3)> ''copper''.replace(/\B/g, '':'')

    [](#cb29-4)< "c:o:p:p:e:r"

    [](#cb29-5)

    [](#cb29-6)> ''-----hello-----''.replace(/\b/g, '' '')

    [](#cb29-7)< "----- hello -----"

    [](#cb29-8)> ''-----hello-----''.replace(/\B/g, '' '')

    [](#cb29-9)< " - - - - -h e l l o- - - - - "

    ```


    > ![warning](media/file3.svg) Negative logic is handy in many text processing
    situations. But use it with care as you might end up matching things you didn''t
    intend!


    ## Cheatsheet and Summary


    | Note | Description |


    | --- | --- |


    | metacharacter | characters with special meaning in regexp |


    | `^` | restricts the match to the start of string |


    | `$` | restricts the match to the end of string |


    | `m` | flag to match the start/end of line with `^` and `$` anchors |


    |  | `\r`, `\n`, `\u2028` and `\u2029` are line separators |


    |  | dos-style files use `\r\n`, may need special attention |


    | `\b` | restricts the match to the start/end of words |


    |  | word characters: alphabets, digits, underscore |


    | `\B` | matches wherever `\b` doesn''t match |


    In this chapter, you''ve begun to see building blocks of regular expressions and
    how they can be used in interesting ways. But at the same time, regular expression
    is but another tool in the land of text processing. Often, you''d get simpler
    solution by combining regular expressions with normal string methods. Practice,
    experience and imagination would help you construct creative solutions. In coming
    chapters, you''ll see more applications of anchors in combination with other regexp
    features.


    ## Exercises


    **a)** Check if the given input strings contain `is` or `the` as whole words.


    ```

    [](#cb30-1)> let str1 = ''is; (this)''

    [](#cb30-2)> let str2 = "The food isn''t good"

    [](#cb30-3)> let str3 = ''the2 cats''

    [](#cb30-4)> let str4 = ''switch on the light''

    [](#cb30-5)

    [](#cb30-6)> const pat1 =      // add your solution here

    [](#cb30-7)> const pat2 =      // add your solution here

    [](#cb30-8)

    [](#cb30-9)> pat1.test(str1) || pat2.test(str1)

    [](#cb30-10)< true

    [](#cb30-11)> pat1.test(str2) || pat2.test(str2)

    [](#cb30-12)< false

    [](#cb30-13)> pat1.test(str3) || pat2.test(str3)

    [](#cb30-14)< false

    [](#cb30-15)> pat1.test(str4) || pat2.test(str4)

    [](#cb30-16)< true

    ```


    **b)** For the given input string, change only whole word `red` to `brown`


    ```

    [](#cb31-1)> let ip = ''bred red spread credible red;''

    [](#cb31-2)

    [](#cb31-3)> ip.replace()       // add your solution here

    [](#cb31-4)< "bred brown spread credible brown;"

    ```


    **c)** For the given array, filter all elements that contains `42` surrounded
    by word characters.'
