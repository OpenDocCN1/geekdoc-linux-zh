    ## 使用捕获组分割


    捕获组也会影响 `split` 方法。如果用于分割的模式包含捕获组，则被这些组匹配到的部分也将成为输出数组的一部分。


    ```javascript

    [](#cb100-1)//不使用捕获组

    [](#cb100-2)> ''31111111111251111426''.split(/1*4?2/)

    [](#cb100-3)< ["3", "5", "6"]

    [](#cb100-4)

    [](#cb100-5)// 在输出中也包含模式的匹配部分

    [](#cb100-6)> ''31111111111251111426''.split(/(1*4?2)/)

    [](#cb100-7)< ["3", "11111111112", "5", "111142", "6"]

    ```


    如果模式的某位于捕获组之外，则因此匹配到的文本将不会出现在输出中。如果捕获组没有参与匹配，它在输出数组中将由用 `undefined` 表示。


    ```javascript

    [](#cb101-1)//这里 4?2 在捕获组之外，因此该部分不会出现在输出中

    [](#cb101-2)> ''31111111111251111426''.split(/(1*)4?2/)

    [](#cb101-3)< ["3", "1111111111", "5", "1111", "6"]

    [](#cb101-4)

    [](#cb101-5)//多个捕获组示例

    [](#cb101-6)//注意：b+ 匹配的部分不在输出中

    [](#cb101-7)> ''3.14aabccc42''.split(/(a+)b+(c+)/)

    [](#cb101-8)< ["3.14", "aa", "ccc", "42"]

    [](#cb101-9)

    [](#cb101-10)//这里 (4)? 在第一次出现时匹配了 0 次

    [](#cb101-11)> ''31111111111251111426''.split(/(1*)(4)?2/)

    [](#cb101-12)< ["3", "1111111111", undefined, "5", "1111", "4", "6"]

    ```


    使用捕获组和可选的 `limit` 参数可以帮助你划分字符串：


    *   匹配之前的部分

    *   模式匹配的部分

    *   匹配之后部分


    ## 在替换中使用函数


    有时，简单的替换字符串是不够的，你需要对匹配部分进行一些处理。对于此类情况，你可以在 `replace` 方法在使用函数。提供给函数的参数与 `match`
    提供的类似。


    ```javascript

    [](#cb103-1)> function titleCase(m, g1) {

    [](#cb103-2)  return m.toUpperCase() + g1.toLowerCase()

    [](#cb103-3) }

    [](#cb103-4)> ''aBc ADC''.replace(/(a)(.*?)/, titleCase)

    [](#cb103-5)< "Abc Adc"

    ```


    ## 在替换中使用字典


    有时可以通过使用字典简化替换。匹配部分充当键。


    ```javascript

    [](#cb105-1)> let h = { ''1'': ''one'', ''2'': ''two'', ''4'': ''four'' }

    [](#cb105-2)> ''923412''.replace(/1|2/g, k => h[k])

    [](#cb105-3)< "9two3fourone"

    ```


    如果字典中不存在该键，你可以提供一个默认值：


    ```javascript

    [](#cb105-4)> let h = { ''1'': ''one'', ''2'': ''two'', ''4'': ''four'' }

    [](#cb105-5)> ''923412''.replace(/1|2/g, k => h[k] || ''X'')

    [](#cb105-6)< "9two3fourXX"

    ```


    ## 交换或多个字符串


    为了在没有中间结果的情况下交换两个或多个字符串，建议使用字典。


    ```javascript

    [](#cb106-1)> let swap = { ''cat'': ''tiger'', ''tiger'': ''cat'' }

    [](#cb106-2)> ''cat tiger dog''.replace(/cat|tiger/g, k => swap[k])

    [](#cb106-3)< "tiger cat dog"

    ```


    ## 动态构建选择


    对于包含许多条目且可能在开发过程中变化的字典，手动构建选择列表不是很好的选择。此外，记住根据优先级规则，最长的字符串应该排在。`unionRegExp` 函数在这里很有帮助。


    ```javascript

    [](#cb107-1)> let d = { ''hand'': 1, ''handy'': 2, ''handful'': 3, ''a^b'': 4
    }

    [](#cb107-2)

    [](#cb107-3)> const p = unionRegExp(Object.keys(d).sort((a, b) => b.length - a.length))

    [](#cb107-4)> console.log(p)

    [](#cb107-5)< handful|handy|hand|a\^b

    [](#cb107-6)> ''handful hand pin handy (a^b)''.replace(new RegExp(p, ''g''), k
    => d[k])

    [](#cb107-7)< "3 1 pin 2 (4)"

    ```


    ## 速查表与总结


    | 注意 | 描述 |

    | --- | --- |

    | `m = s.match(/pat/)` | 假设未使用 g 标志且正则成功，返回一个包含匹配部分和三个属性的数组 |

    | | | `index` 属性给出匹配的起始位置 |

    | | | `input` 属性给出输入字符串 s |

    | | | `groups` 属性给出命名捕获组的字典 |

    | `m[0]` | 对于上述情况，给出整个匹配部分 |

    | `m[1]` | 第一个捕获组的匹配部分 |

    | `m[2]` | 第二个捕获组的匹配部分，以此依此类推 |


