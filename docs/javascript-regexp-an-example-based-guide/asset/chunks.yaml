    ## Anchors


    The use of `g` flag with `test` method allows some additional functionality. See
    [MDN: test](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/RegExp/test#Examples)
    for examples. However, in my opinion, it is easy to fall into a habit of using
    `g` with `test` and get undesired results. I''d rather suggest to use [match method](#ch009.xhtml_match-method)
    and explicitly write logic instead of relying on `test` with `g` flag.


    Anchors restrict the matching to the start or end of string. These special characters
    are known as metacharacters. To match characters literally, you need to escape
    them with `\` (discussed in [Escaping metacharacters](#ch06.xhtml_metacharacters)
    chapter).


    ## String anchors


    `^` metacharacter restricts the matching to the start of string. These provide
    functionality similar to `startsWith` methods.


    ```

    [](#cb19-1)> ^ is placed as a prefix to the pattern

    [](#cb19-2)> /cat/.test(''cater'')

    [](#cb19-3)< true

    [](#cb19-4)> /cat/.test(''concatenation'')

    [](#cb19-5)< false

    [](#cb19-6)

    [](#cb19-7)> /^hi/.test(''hi\ntop spot'')

    [](#cb19-8)< true

    [](#cb19-9)> /^top/.test(''hi\ntop spot'')

    [](#cb19-10)< false

    ```


    `$` metacharacter is used to restrict the matching to the end of string.


    ```

    [](#cb20-1)> $ is placed as a suffix to the pattern

    [](#cb20-2)> /are$/.test(''spare'')

    [](#cb20-3)< true

    [](#cb20-4)> /are$/.test(''nearest'')

    [](#cb20-5)< false

    [](#cb20-6)

    [](#cb20-7)> let words = [''surrender'', ''unicorn'', ''newer'', ''door'', ''empty'',
    ''pest'']

    [](#cb20-8)> words.filter(w => /er$/.test(w))

    [](#cb20-9)< ["surrender", "newer"]

    [](#cb20-10)> words.filter(w => /t$/.test(w))

    [](#cb20-11)< ["pest"]

    ```


    Combining both the start and end string anchors, you can restrict the matching
    to the whole string. Similar to comparing strings using the `==` operator.


    ```

    [](#cb21-1)> /^cat$/.test(''cat'')

    [](#cb21-2)< true

    [](#cb21-3)> /^cat$/.test(''cater'')

    [](#cb21-4)< false

    ```


    The anchors can be used by themselves as a pattern. Helps to insert text at the
    start or end of string, emulating string concatenation operations. These might
    not feel like useful capability, but combined with other regexp features they
    become quite a handy tool.


    ```

    [](#cb22-1)> ''live''.replace(/^/, ''re'')

    [](#cb22-2)< "relive"

    [](#cb22-3)> ''send''.replace(/^/, ''re'')

    [](#cb22-4)< "resend"

    [](#cb22-5)

    [](#cb22-6)> ''cat''.replace(/$/, ''er'')

    [](#cb22-7)< "cater"

    [](#cb22-8)> ''hack''.replace(/$/, ''er'')

    [](#cb22-9)< "hacker"

    ```


    ## Line anchors

