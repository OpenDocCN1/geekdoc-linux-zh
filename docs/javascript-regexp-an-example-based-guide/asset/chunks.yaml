    # Escaping metacharacters


    You have seen a few metacharacters and escape sequences that help to compose a
    RegExp literal. There''s also the `/` character used as a delimiter for RegExp
    objects. This chapter will discuss how to remove the special meaning of such constructs.
    Also, you''ll learn how to take care of special characters when you are building
    a RegExp literal from normal strings.


    ## Escaping with \


    To match the metacharacters literally, i.e. to remove their special meaning, prefix
    those characters with a `\` character. To indicate a literal `\` character, use
    `\\`.


    ```

    [](#cb49-1)// even though ^ is not being used as anchor, it won''t be matched
    literally

    [](#cb49-2)> /b^2/.test(''a^2 + b^2 - C*3'')

    [](#cb49-3)< false

    [](#cb49-4)// escaping will work

    [](#cb49-5)> /b\^2/.test(''a^2 + b^2 - C*3'')

    [](#cb49-6)< true

    [](#cb49-7)

    [](#cb49-8)> ''(a*b) + c''.replace(/\(|\)/g, '''')

    [](#cb49-9)< "a*b + c"

    [](#cb49-10)

    [](#cb49-11)> ''\\learn\\by\\example''.replace(/\\/g, ''/'')

    [](#cb49-12)< "/learn/by/example"

    ```


    ## Dynamically escaping metacharacters


    When you are defining the regexp yourself, you can manually escape the metacharacters
    where needed. However, if you have strings obtained from elsewhere and need to
    match the contents literally, you''ll have to somehow escape all the metacharacters
    while constructing the regexp. The solution of course is to use regular expressions!
    Usually, the programming language itself would provide an in-built method for
    such cases. JavaScript doesn''t, but [MDN: Regular Expressions doc](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Regular_Expressions)
    has it covered in the form of a function as shown below.


    ```

    [](#cb50-1)> function escapeRegExp(string) {

    [](#cb50-2)    return string.replace(/[.*+\-?^${}()|[\]\\]/g, ''\\$&'')

    [](#cb50-3)  }

    ```


    There are many things in the above regexp that you haven''t learnt yet. They''ll
    be discussed in coming chapters. For now, it is enough to know that this function
    will automatically escape all the metacharacters. Examples are shown below.


    ```

    [](#cb51-1)// sample input on which regexp will be applied

    [](#cb51-2)> let eqn = ''f*(a^b) - 3*(a^b)''

    [](#cb51-3)// sample string obtained from elsewhere which needs to be matched
    literally

    [](#cb51-4)> const usr_str = ''(a^b)''

    [](#cb51-5)

    [](#cb51-6)// case 1: replace all matches

    [](#cb51-7)// escaping metacharacters using ''escapeRegExp'' function

    [](#cb51-8)> const pat = new RegExp(escapeRegExp(usr_str), ''g'')

    [](#cb51-9)> pat

    [](#cb51-10)< /\(a\^b\)/g

    [](#cb51-11)> eqn.replace(pat, ''c'')

    [](#cb51-12)< "f*c - 3*c"

    [](#cb51-13)

    [](#cb51-14)// case 2: replace only at the end of string

    [](#cb51-15)> eqn.replace(new RegExp(escapeRegExp(usr_str) + ''$''), ''c'')

    [](#cb51-16)"f*(a^b) - 3*c"

    ```


    > ![info](media/file2.svg) Note that the `/` delimiter character isn''t escaped
    in the above function. Use `[.*+\-?^${}()|[\]\\\/]` to escape the delimiter as
    well.


    ## Dynamically building alternation


    Examples in previous chapter showed cases where a single regexp can contain multiple
    patterns combined using `|` metacharacter. Often, you have an array of strings
    and you need to match any of their content literally. To do so, you need to escape
    all the metacharacters before combining the strings with `|` metacharacter. The
    function shown below uses the `escapeRegExp` function introduced in the previous
    section.


    ```

    [](#cb52-1)> function unionRegExp(arr) {

    [](#cb52-2)    return arr.map(w => escapeRegExp(w)).join(''|'')

    [](#cb52-3)  }

    ```


    And here''s some examples with `unionRegExp` function used to construct the required
    regexp.


    ```

    [](#cb53-1)// here, order of alternation wouldn''t matter

    [](#cb53-2)// and assume that other regexp features aren''t needed

    [](#cb53-3)> let w1 = [''c^t'', ''dog$'', ''f|x'']

    [](#cb53-4)> const p1 = new RegExp(unionRegExp(w1), ''g'')

    [](#cb53-5)> p1

    [](#cb53-6)< /c\^t|dog\$|f\|x/g

    [](#cb53-7)> ''c^t dog$ bee parrot f|x''.replace(p1, ''mammal'')

    [](#cb53-8)< "mammal mammal bee parrot mammal"

    [](#cb53-9)

    [](#cb53-10)// here, alternation precedence rules needs to be applied first

    [](#cb53-11)// and assume that the terms have to be matched as whole words

    [](#cb53-12)> let w2 = [''hand'', ''handy'', ''handful'']

    [](#cb53-13)// sort by string length, longest first

    [](#cb53-14)> w2.sort((a, b) => b.length - a.length)

    [](#cb53-15)< ["handful", "handy", "hand"]

    [](#cb53-16)> const p2 = new RegExp(`\\b(${unionRegExp(w2)})\\b`, ''g'')

    [](#cb53-17)> p2

    [](#cb53-18)< /\b(handful|handy|hand)\b/g

    [](#cb53-19)// note that ''hands'' and ''handed'' aren''t replaced

    [](#cb53-20)> ''handful handed handy hands hand''.replace(p2, ''X'')

    [](#cb53-21)< "X handed X hands X"

    ```


    > ![info](media/file2.svg) The [XRegExp](https://github.com/slevithan/xregexp)
    utility provides [XRegExp.escape](http://xregexp.com/api/#escape) and [XRegExp.union](http://xregexp.com/api/#union)
    methods. The union method has additional functionality of allowing a mix of string
    and RegExp literals and also takes care of renumbering [backreferences](#ch011.xhtml_backreferences).


    ## source and flags properties


    If you need the contents of a RegExp object, you can use `source` and `flags`
    properties to get the pattern string and flags respectively. These methods will
    help you to build a RegExp object using contents of another RegExp object.


    ```

    [](#cb54-1)> const p3 = /\bpar\b/

    [](#cb54-2)> const p4 = new RegExp(p3.source + ''|cat'', ''g'')

    [](#cb54-3)

    [](#cb54-4)> p4

    [](#cb54-5)< /\bpar\b|cat/g

    [](#cb54-6)> console.log(p4.source)

    [](#cb54-7)< \bpar\b|cat

    [](#cb54-8)> p4.flags

    [](#cb54-9)< "g"

    [](#cb54-10)

    [](#cb54-11)> ''cater cat concatenate par spare''.replace(p4, ''X'')

    [](#cb54-12)< "Xer X conXenate X spare"

    ```


    ## Escaping delimiter'
