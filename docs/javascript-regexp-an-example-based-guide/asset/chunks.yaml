  raw: 'Quantifiers helps you to repeat a portion of regexp. They can be applied to
    literal characters, groupings and other features that you''ll learn later. Apart
    from ability to specify exact quantity and bounded range, these can also match
    unbounded varying quantities. If the input string can satisfy a pattern with varying
    quantities in multiple ways, you can choose among two types of quantifiers to
    narrow down the possibilities. In this section, **greedy** type of quantifiers
    is covered.


    First up, the `?` metacharacter which quantifies a character or group to match
    `0` or `1` times. This helps to define optional patterns and build terser regexps.


    ```

    [](#cb67-1)// same as: /ear|ar/g

    [](#cb67-2)> ''far feat flare fear''.replace(/e?ar/g, ''X'')

    [](#cb67-3)< "fX feat flXe fX"

    [](#cb67-4)

    [](#cb67-5)// same as: /\bpar(t|)\b/g

    [](#cb67-6)> ''par spare part party''.replace(/\bpart?\b/g, ''X'')

    [](#cb67-7)< "X spare X party"

    [](#cb67-8)

    [](#cb67-9)// same as: /\b(re.d|red)\b/

    [](#cb67-10)> [''red'', ''ready'', ''re;d'', ''redo'', ''reed''].filter(w => /\bre.?d\b/.test(w))

    [](#cb67-11)< ["red", "re;d", "reed"]

    [](#cb67-12)

    [](#cb67-13)// same as: /part|parrot/g

    [](#cb67-14)> ''par part parrot parent''.replace(/par(ro)?t/g, ''X'')

    [](#cb67-15)< "par X X parent"

    [](#cb67-16)// same as: /part|parrot|parent/g

    [](#cb67-17)> ''par part parrot parent''.replace(/par(en|ro)?t/g, ''X'')

    [](#cb67-18)< "par X X X"

    ```


    The `*` metacharacter quantifies a character or group to match `0` or more times.
    There is no upper bound, more details will be discussed later in this chapter.


    ```

    [](#cb68-1)// match ''t'' followed by zero or more of ''a'' followed by ''r''

    [](#cb68-2)> ''tr tear tare steer sitaara''.replace(/ta*r/g, ''X'')

    [](#cb68-3)< "X tear Xe steer siXa"

    [](#cb68-4)

    [](#cb68-5)// match ''t'' followed by zero or more of ''e'' or ''a'' followed
    by ''r''

    [](#cb68-6)> ''tr tear tare steer sitaara''.replace(/t(e|a)*r/g, ''X'')

    [](#cb68-7)< "X X Xe sX siXa"

    [](#cb68-8)

    [](#cb68-9)// match zero or more of ''1'' followed by ''2''

    [](#cb68-10)> ''3111111111125111142''.replace(/1*2/g, ''X'')

    [](#cb68-11)< "3X511114X"

    ```


    Here''s some more examples with `split` method.


    ```

    [](#cb69-1)// last element is empty because there is nothing after ''2'' at the
    end of string

    [](#cb69-2)> ''3111111111125111142''.split(/1*2/)

    [](#cb69-3)< ["3", "511114", ""]

    [](#cb69-4)

    [](#cb69-5)// note how ''25'' and ''42'' gets split, there is ''1'' zero times
    in between them

    [](#cb69-6)> ''3111111111125111142''.split(/1*/)

    [](#cb69-7)< ["3", "2", "5", "4", "2"]

    ```


    The `+` metacharacter quantifies a character or group to match `1` or more times.
    Similar to `*` quantifier, there is no upper bound. More importantly, this doesn''t
    have surprises like matching empty string.


    ```

    [](#cb70-1)> ''tr tear tare steer sitaara''.replace(/ta+r/g, ''X'')

    [](#cb70-2)< "tr tear Xe steer siXa"

    [](#cb70-3)> ''tr tear tare steer sitaara''.replace(/t(e|a)+r/g, ''X'')

    [](#cb70-4)< "tr X Xe sX siXa"

    [](#cb70-5)

    [](#cb70-6)> ''3111111111125111142''.replace(/1+2/g, ''X'')

    [](#cb70-7)< "3X5111142"

    [](#cb70-8)> ''3111111111125111142''.split(/1+/)

    [](#cb70-9)< ["3", "25", "42"]

    ```


    You can specify a range of integer numbers, both bounded and unbounded, using
    `{}` metacharacters. There are three ways to use this quantifier as listed below.


    | Pattern | Description |


    | --- | --- |


    | `{m,n}` | match `m` to `n` times |


    | `{m,}` | match at least `m` times |


    | `{n}` | match exactly `n` times |


    ```

    [](#cb71-1)> let demo = [''abc'', ''ac'', ''abbc'', ''xabbbcz'', ''bc'', ''abbbbbc'']

    [](#cb71-2)

    [](#cb71-3)> demo.filter(w => /ab{1,4}c/.test(w))

    [](#cb71-4)< ["abc", "abbc", "xabbbcz"]

    [](#cb71-5)> demo.filter(w => /ab{0,2}c/.test(w))

    [](#cb71-6)< ["abc", "ac", "abbc"]

    [](#cb71-7)

    [](#cb71-8)> demo.filter(w => /ab{3,}c/.test(w))

    [](#cb71-9)< ["xabbbcz", "abbbbbc"]

    [](#cb71-10)

    [](#cb71-11)> demo.filter(w => /ab{3}c/.test(w))

    [](#cb71-12)< ["xabbbcz"]

    ```


    > ![info](media/file2.svg) The `{}` metacharacters have to be escaped to match
    them literally. However, unlike `()` metacharacters, these have lot more leeway.
    For example, escaping `{` alone is enough, or if it doesn''t conform strictly
    to any of the forms listed above, escaping is not needed at all.


    ## AND Conditional


    Next up, how to construct AND conditional using dot metacharacter and quantifiers.


    ```

    [](#cb72-1)// match ''Error'' followed by zero or more characters followed by
    ''valid''

    [](#cb72-2)> /Error.*valid/.test(''Error: not a valid input'')

    [](#cb72-3)< true

    [](#cb72-4)

    [](#cb72-5)> /Error.*valid/.test(''Error: key not found'')

    [](#cb72-6)< false

    ```


    To allow matching in any order, you''ll have to bring in alternation as well.
    That is somewhat manageable for 2 or 3 patterns. See [AND conditional with lookarounds](#ch013.xhtml_and-conditional-with-lookarounds)
    section for an easier approach.


    ```

    [](#cb73-1)> /cat.*dog|dog.*cat/.test(''cat and dog'')

    [](#cb73-2)< true

    [](#cb73-3)> /cat.*dog|dog.*cat/.test(''dog and cat'')

    [](#cb73-4)< true

    [](#cb73-5)

    [](#cb73-6)// if you just need true/false result, this would be a scalable approach

    [](#cb73-7)> let patterns = [/cat/, /dog/]

    [](#cb73-8)> patterns.every(p => p.test(''cat and dog''))

    [](#cb73-9)< true

    [](#cb73-10)> patterns.every(p => p.test(''dog and cat''))

    [](#cb73-11)< true

    ```


    ## What does greedy mean?


    When you are using `?` how does JavaScript decide to match `0` or `1` times, if
    both quantities can satisfy the regexp? For example, consider `''foot''.replace(/f.?o/,
    ''X'')` — should `foo` be replaced or `fo`? It will always replace `foo`, because
    these are **greedy** quantifiers, meaning they try to match as much as possible.


    ```

    [](#cb74-1)> ''foot''.replace(/f.?o/, ''X'')

    [](#cb74-2)< "Xt"

    [](#cb74-3)

    [](#cb74-4)// a more practical example

    [](#cb74-5)// prefix ''<'' with ''\'' if it is not already prefixed

    [](#cb74-6)> console.log(''blah < foo \\< bar < baz''.replace(/\\?</g, ''\\<''))

    [](#cb74-7)< blah \< foo \< bar \< baz

    [](#cb74-8)

    [](#cb74-9)// say goodbye to /handful|handy|hand/ shenanigans

    [](#cb74-10)> ''hand handy handful''.replace(/hand(y|ful)?/g, ''X'')

    [](#cb74-11)< "X X X"

    ```


    But wait, how did the `/Error.*valid/` example work? Shouldn''t `.*` consume all
    the characters after `Error`? Good question. The regexp engine actually does consume
    all the characters. Then realizing that the regexp fails, it gives back one character
    from end of string and checks again if regexp is satisfied. This process is repeated
    until a match is found or failure is confirmed. In regular expression parlance,
    this is called **backtracking**.


    ```

    [](#cb75-1)> let sentence = ''that is quite a fabricated tale''

    [](#cb75-2)

    [](#cb75-3)// t.*a will always match from first ''t'' to last ''a''

    [](#cb75-4)> sentence.replace(/t.*a/, ''X'')

    [](#cb75-5)< "Xle"

    [](#cb75-6)> ''star''.replace(/t.*a/, ''X'')

    [](#cb75-7)< "sXr"

    [](#cb75-8)

    [](#cb75-9)// matching first ''t'' to last ''a'' for t.*a won''t work for these
    cases

    [](#cb75-10)// the regexp engine backtracks until .*q matches and so on

    [](#cb75-11)> sentence.replace(/t.*a.*q.*f/, ''X'')

    [](#cb75-12)< "Xabricated tale"

    [](#cb75-13)> sentence.replace(/t.*a.*u/, ''X'')

    [](#cb75-14)< "Xite a fabricated tale"

    ```


    > ![warning](media/file3.svg) Backtracking can be quite time consuming for certain
    corner cases. Or even catastrophic (see [cloudflare: Details of the Cloudflare
    outage on July 2, 2019](https://blog.cloudflare.com/details-of-the-cloudflare-outage-on-july-2-2019/)).


    ## Non-greedy quantifiers


    As the name implies, these quantifiers will try to match as minimally as possible.
    Also known as **lazy** or **reluctant** quantifiers. Appending a `?` to greedy
    quantifiers makes them non-greedy.


    ```

    [](#cb76-1)> ''foot''.replace(/f.??o/, ''X'')

    [](#cb76-2)< "Xot"

    [](#cb76-3)

    [](#cb76-4)> ''frost''.replace(/f.??o/, ''X'')

    [](#cb76-5)< "Xst"

    [](#cb76-6)

    [](#cb76-7)> ''123456789''.replace(/.{2,5}?/, ''X'')

    [](#cb76-8)< "X3456789"

    [](#cb76-9)

    [](#cb76-10)> ''green:3.14:teal::brown:oh!:blue''.split(/:.*?:/)

    [](#cb76-11)< ["green", "teal", "brown", "blue"]

    ```'
