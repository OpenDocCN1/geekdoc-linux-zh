    ## 总结


    某些模式非常复杂，不容易从头构建和验证。像 `CommonRegexJS` 这样的库有助于减少完成常见任务所需的时间和精力。然而，你确实需要针对你的用例 `test`
    解决方案。另请参考 [stackoverflow: validating email addresses](https://stackoverflow.com/questions/201323/how-to-validate-an-email-address-using-a-regular-expression)。


    # 预言 (Lookarounds)


    你已经了解了如何创建自定义字符类和特殊分组的各种变体。在本章中，你将学习更多的分组，被称为“预言”（lookarounds），它们有助于在正则表达式定义中创建自定义锚点并添加条件。这些断言也被称为**零宽模式**，因为它们增加了类似于锚点的限制，并且不属于匹配部分的一部分。此外，你还将学习如何进行类似于反向字符集的分组反向。


    ## 条件表达式


    在你过度习惯预言之前，最好记住 JavaScript 是一门编程语言。你有控制结构，可以使用逻辑运算符组合多个条件，如 `every/some` 等。此外，不要忘记正则表达式只是字符串处理的工具之一。


    ```

    [](#cb173-1)> let items = [''1,2,3,4'', ''a,b,c,d'', ''#foo 123'']

    [](#cb173-2)

    [](#cb173-3)// 过滤包含数字和 # 字符元素

    [](#cb173-4)> items.filter(s => /\d/.test(s) && s.includes(''#''))

    [](#cb173-5)< ["#foo 123"]

    [](#cb173-6)

    [](#cb173-7)// 如果不以 # 开头则修改元素

    [](#cb173-8)> items.filter(s => s[0] != ''#'').map(s => s.replace(/,./, '' ''))

    [](#cb173-9)< ["1 4", "a d"]

    ```


    ## 否定预言


    预言断言可以通过两种方式添加——后预言（lookbehind）和前预言（lookahead）。每种都可以是正向的或否定的断言。从语法上看，后预言与前预言相比。


    *   `(?!pat)` 否定前预言

    *   `(?<!pat)` 否定后预言


    '
- fmt: '

    > ![info](media/file2.svg) See [this stackoverflow Q&A](https://stackoverflow.com/questions/50011366/javascript-regex-negative-lookbehind-not-working-in-firefox)
    for a workaround if lookbehind isn''t supported.


    ## Positive lookarounds


    Unlike negative lookarounds, absence of the pattern will not satisfy positive
    lookarounds. Instead, for the condition to satisfy, the pattern has to match actual
    characters and/or zero-width assertions. Positive lookaround can be identified
    by use of `=` in the grouping. The complete syntax looks like:


    *   `(?=pat)` for positive lookahead assertion

    *   `(?<=pat)` for positive lookbehind assertion


    ```

    [](#cb177-1)// extract digits only if it is followed by ,

    [](#cb177-2)// note that end of string doesn''t qualify as this is positive assertion

    [](#cb177-3)> ''42 foo-5, baz3; x83, y-20; f12''.match(/\d+(?=,)/g)

    [](#cb177-4)< ["5", "83"]

    [](#cb177-5)// extract digits only if it is preceded by - and followed by , or
    ;

    [](#cb177-6)> ''42 foo-5, baz3; x83, y-20; f12''.match(/(?<=-)\d+(?=[;,])/g)

    [](#cb177-7)< ["5", "20"]

    [](#cb177-8)

    [](#cb177-9)// same as: match(/\b\w/g).join('''')

    [](#cb177-10)> ''sea eat car rat eel tea''.replace(/(?<=\b\w)\w*\W*/g, '''')

    [](#cb177-11)< "secret"

    [](#cb177-12)

    [](#cb177-13)// replace ''par'' as long as ''part'' occurs as a whole word later
    in the line

    [](#cb177-14)> ''par spare part party''.replace(/par(?=.*\bpart\b)/g, ''X'')

    [](#cb177-15)< "X sXe part party"

    ```


    Lookarounds are quite handy in dealing with field based processing.


    ```

    [](#cb178-1)// except first and last fields

    [](#cb178-2)> ''1,two,3,four,5''.match(/(?<=,)[^,]+(?=,)/g)

    [](#cb178-3)< ["two", "3", "four"]

    [](#cb178-4)

    [](#cb178-5)// replace empty fields with NA

    [](#cb178-6)// note that in this example, order of lookbehind and lookahead doesn''t
    matter

    [](#cb178-7)> '',1,,,two,3,,''.replace(/(?<=^|,)(?=,|$)/g, ''NA'')

    [](#cb178-8)< "NA,1,NA,NA,two,3,NA,NA"

    [](#cb178-9)// same thing with negative lookarounds

    [](#cb178-10)> '',1,,,two,3,,''.replace(/(?![^,])(?<![^,])/g, ''NA'')

    [](#cb178-11)< "NA,1,NA,NA,two,3,NA,NA"

    [](#cb178-12)

    [](#cb178-13)// there is an extra empty string match at end of non-empty columns

    [](#cb178-14)> '',cat,tiger''.replace(/[^,]*/g, ''{$&}'')

    [](#cb178-15)< "{},{cat}{},{tiger}{}"

    [](#cb178-16)// lookarounds to the rescue

    [](#cb178-17)> '',cat,tiger''.replace(/(?<=^|,)[^,]*/g, ''{$&}'')

    [](#cb178-18)< "{},{cat},{tiger}"

    ```


    ## Capture groups inside positive lookarounds


    Even though lookarounds are not part of matched portions, capture groups can be
    used inside positive lookarounds. Can you reason out why it won''t work for negative
    lookarounds?


    ```

    [](#cb179-1)> console.log(''a b c d e''.replace(/(\S+\s+)(?=(\S+)\s)/g, ''$1$2\n''))

    [](#cb179-2)< a b

    [](#cb179-3)  b c

    [](#cb179-4)  c d

    [](#cb179-5)  d e

    ```


    ## AND conditional with lookarounds


    As promised earlier, here''s how lookarounds make it simpler to construct AND
    conditionals.


    ```

    [](#cb180-1)> let words = [''sequoia'', ''subtle'', ''questionable'', ''exhibit'',
    ''equation'']

    [](#cb180-2)

    [](#cb180-3)// words containing ''b'' and ''e'' and ''t'' in any order

    [](#cb180-4)// same as: /b.*e.*t|b.*t.*e|e.*b.*t|e.*t.*b|t.*b.*e|t.*e.*b/

    [](#cb180-5)> words.filter(w => /(?=.*b)(?=.*e).*t/)

    [](#cb180-6)> words.filter(w => /(?=.*b)(?=.*e).*t/) // Corrected logic for example

    [](#cb180-7)< ["subtle", "questionable", "exhibit"]

    [](#cb180-8)// words containing all vowels in any order

    [](#cb180-9)> words.filter(w => /(?=.*a)(?=.*e)(?=.*i)(?=.*o).*u/)

    [](#cb180-10)< ["sequoia", "questionable", "equation"]

    [](#cb180-11)// words containing ''a'' and ''q'' but not ''n'' at the end

    [](#cb180-12)> words.filter(w => /(?=.*a)(?=.*q)(?!.*n$))

    [](#cb180-13)< ["sequoia", "questionable"]

    ```


    ## Variable length lookbehind


    In some of implementations of regular expressions, lookbehind doesn''t work if
    the pattern can match varying number of characters. For example, `(?<=foo\d+)`
    is looking behind `foo` by one or more of digit characters. As far as I''ve tested
    on the console, there''s no restriction in JavaScript. Here''s some examples that
    were.


    ```

    [](#cb181-1)// positive lookbehind examples

    [](#cb181-2)> ''=not:error''.match(/(?<==]\d+)[a-z]+/g)

    [](#cb181-3)< ["not", "cool"]

    [](#cb181-4)// replace only 3rd occurrence of ''cat''

    [](#cb181-5)> ''cat scatter scat''.replace(/(?<=(cat){2})cat/, ''X'')

    [](#cb181-6)< "cat Xer"

    [](#cb181-7)// negative lookbehind examples

    [](#cb181-8)// match only if ''cat'' doesn''t occur before ''dog''

    [](#cb181-9)> /(?<!cat.*)dog.test(''fox,cat,parrot'')

    [](#cb181-10)< false

    [](#cb181-11)// match only if ''parrot'' doesn''t occur before ''dog''

    [](#cb181-12)> /(?<!parrot.*)dog.test(''fox,cat,parrot'')

    [](#cb181-13)< true

    ```


    ## Negated grouping


    You''ve seen a few cases where negated character class was useful than positive
    set. For example, in field based processing, it is needed to match the field contents
    by creating a negated character set of the delimiter. In a similar manner, there
    are cases where you need to negate a regexp pattern. This is made possible by
    using negative lookahead and advancing one character at time as shown below.


    ```

    [](#cb182-1)// cannot use /at<!go)par/ as lookarounds do not consume characters

    [](#cb182-2)// match if ''go'' is not there between ''at'' and ''par''

    [](#cb182-3)> /at((?!go).)*par.test(''fox,cat,parrot'')

    [](#cb182-4)< true

    [](#cb182-5)// match if ''do'' is not there between ''at'' and ''par''

    [](#cb182-6)> /at((?!do).)*par.test(''fox,cat,parrot'')

    [](#cb182-7)< false

    [](#cb182-9)// if it gets confusing, use ''match'' method to see the matching
    portions

    [](#cb182-10)> ''fox,cat,parrot''.match(/at((?!go).)*par/)[0]

    [](#cb182-11)< "at,dog,par"

    [](#cb182-12)> ''at,baz,a2z,bad-zoo''.match(/a((!\d).)*z/g)

    [](#cb182-13)< ["at,baz", "ad-z"]

    ```


    ## Cheatsheet and Summary


    | Note | Description |

    | --- | --- |

    | lookarounds | allows to create custom positive/negative assertions |

    | | zero-width like anchors and not part of matching portions |

    | `(?!pat)` | negative lookahead assertion |

    | `(?<!pat)` | negative lookbehind assertion |

    | `(?=pat)` | positive lookahead assertion |

    | `(?<=pat)` | positive lookbehind assertion |

    | | variable length lookbehind is allowed |

    | `(?!pat1)(?=pat2)` | multiple assertions can be specified next to each other
    in any order |

    | | as they mark a matching location without consuming characters |

    | `((?!pat).)*` | Negates a regexp pattern |


    In this chapter, you learnt how to use lookarounds to create custom restrictions
    and also how to use negated grouping. With this, most of the powerful features
    of regexp have been covered. The next chapter will give a brief introduction to
    working with unicode characters.


