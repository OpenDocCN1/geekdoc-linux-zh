    # Interlude: Common tasks


    Tasks like matching phone numbers, ip addresses, dates, etc are so common that
    you can often find them collected as a library. This chapter shows some examples
    for [CommonRegexJS](https://github.com/talyssonoc/CommonRegexJS). See also [Awesome
    Regex: Collections](https://github.com/aloisdg/awesome-regex#collections).


    ## CommonRegexJS


    There are several ways to use the patterns, see [CommonRegexJS: Usage](https://github.com/talyssonoc/CommonRegexJS#usage)
    for details. You can also go through [commonregex.js](https://github.com/talyssonoc/CommonRegexJS/blob/master/lib/commonregex.js)
    and choose the regular expression you need.


    ```

    [](#cb171-1)> let data = ''hello 255.21.255.22 okay''

    [](#cb171-2)

    [](#cb171-3)> const comm = new CommonRegex(data)

    [](#cb171-4)

    [](#cb171-5)> comm.IPv4

    [](#cb171-6)< ["255.21.255.22"]

    ```


    Make sure to test these patterns for your use case. For example, the below data
    has a valid IPv4 address followed by another number separated by a dot character.
    If such cases should be ignored, then you''ll have to create your own version
    of the pattern or change the input accordingly.


    ```

    [](#cb172-1)> let new_data = ''23.14.2.4.2 255.21.255.22 567.12.2.1''

    [](#cb172-2)

    [](#cb172-3)> const ip = new CommonRegex(new_data)

    [](#cb172-4)

    [](#cb172-5)> ip.IPv4

    [](#cb172-6)< ["23.14.2.4", "255.21.255.22"]

    ```


    ## Summary


    Some patterns are quite complex and not easy to build and validate from scratch.
    Libraries like **CommonRegexJS** are helpful to reduce your time and effort needed
    for commonly known tasks. However, you do need to **test** the solution for *your*
    use case. See also [stackoverflow: validating email addresses](https://stackoverflow.com/questions/201323/how-to-validate-an-email-address-using-a-regular-expression).


    # Lookarounds


    You''ve already seen how to create custom character classes and various avatars
    of special groupings. In this chapter you''ll learn more groupings, known as lookarounds,
    that help to create custom anchors and add conditions within regexp definition.
    These assertions are also known as **zero-width patterns** because they add restrictions
    similar to anchors and are not part of the matched portions. Also, you will learn
    how to negate a grouping similar to negated character sets.


    ## Conditional expressions


    Before you get used to lookarounds too much, it is good to remember that JavaScript
    is a programming language. You have control structures and you can combine multiple
    conditions using logical operators, methods like `every/some`, etc. Also, do not
    forget that regexp is only one of the tools available for string processing.


    ```

    [](#cb173-1)> let items = [''1,2,3,4'', ''a,b,c,d'', ''#foo 123'']

    [](#cb173-2)

    [](#cb173-3)// filter elements containing digit and ''#'' characters

    [](#cb173-4)> items.filter(s => /\d/.test(s) && s.includes(''#''))

    [](#cb173-5)< ["#foo 123"]

    [](#cb173-6)

    [](#cb173-7)// modify elements only if it doesn''t start with ''#''

    [](#cb173-8)> items.filter(s => s[0] != ''#'').map(s => s.replace(/,.+,/, '' ''))

    [](#cb173-9)< ["1 4", "a d"]

    ```


    ## Negative lookarounds


    Lookaround assertions can be added in two ways — **lookbehind** and **lookahead**.
    Each of these can be a **positive** or a **negative** assertion. Syntax wise,
    lookbehind has an extra `<` compared to the lookahead version. Negative lookarounds
    can be identified by the use of `!` whereas `=` is used for positive lookarounds.
    This section is about negative lookarounds, whose complete syntax is shown below.


    *   `(?!pat)` for negative lookahead assertion


    *   `(?<!pat)` for negative lookbehind assertion


    As mentioned earlier, lookarounds are not part of matched portions and do not
    capture the matched text.


    ```

    [](#cb174-1)// change ''foo'' only if it is not followed by a digit character

    [](#cb174-2)// note that end of string satisfies the given assertion

    [](#cb174-3)// ''foofoo'' has two matches as the assertion doesn''t consume characters

    [](#cb174-4)> ''hey food! foo42 foot5 foofoo''.replace(/foo(?!\d)/g, ''baz'')

    [](#cb174-5)< "hey bazd! foo42 bazt5 bazbaz"

    [](#cb174-6)

    [](#cb174-7)// change ''foo'' only if it is not preceded by _

    [](#cb174-8)// note how ''foo'' at start of string is matched as well

    [](#cb174-9)> ''foo _foo 42foofoo''.replace(/(?<!_)foo/g, ''baz'')

    [](#cb174-10)< "baz _foo 42bazbaz"

    [](#cb174-11)

    [](#cb174-12)// overlap example

    [](#cb174-13)// ''foot'' doesn''t match because it is preceded by ''_''

    [](#cb174-14)// the ''_'' before ''foot'' was considered even though it got replaced

    [](#cb174-15)> ''food _fool 42foo_foot''.replace(/(?<!_)foo./g, ''baz'')

    [](#cb174-16)< "baz _fool 42bazfoot"

    ```


    Can be mixed with anchors and other regexp features to define truly powerful restrictions.


    ```

    [](#cb175-1)// change whole word only if it is not preceded by : or --

    [](#cb175-2)> '':cart apple --rest ;tea''.replace(/(?<!:|--)\b\w+/g, ''X'')

    [](#cb175-3)< ":cart X --rest ;X"

    [](#cb175-4)

    [](#cb175-5)// add space to word boundaries, but not at start or end of string

    [](#cb175-6)// similar to: replace(/\b/g, '' '').trim()

    [](#cb175-7)> ''foo_baz=num1+35*42/num2''.replace(/(?<!^)\b(?!$)/g, '' '')

    [](#cb175-8)< "foo_baz = num1 + 35 * 42 / num2"

    ```


    In all the examples so far, lookahead grouping was placed as a suffix and lookbehind
    as a prefix. This is how they are used most of the time, but not the only way
    to use them. Lookarounds can be placed anywhere and multiple lookarounds can be
    combined in any order. They do not consume characters nor do they play a role
    in matched portions. They just let you know whether the condition you want to
    test is satisfied from the current location in the input string.


    ```

    [](#cb176-1)// these two are equivalent

    [](#cb176-2)// replace a character as long as it is not preceded by ''p'' or ''r''

    [](#cb176-3)> ''spare''.replace(/(?<![pr])./g, ''*'')

    [](#cb176-4)< "**a*e"

    [](#cb176-5)> ''spare''.replace(/.(?<![pr].)/g, ''*'')

    [](#cb176-6)< "**a*e"

    [](#cb176-7)

    [](#cb176-8)// replace ''par'' as long as ''s'' is not present later in the input

    [](#cb176-9)// this assumes that the lookaround doesn''t conflict with search
    pattern

    [](#cb176-10)// i.e. ''s'' will not conflict ''par'' but would affect if it was
    ''r'' and ''par''

    [](#cb176-11)> ''par spare part party''.replace(/par(?!.*s)/g, ''X'')

    [](#cb176-12)< "par sXe Xt Xty"

    [](#cb176-13)> ''par spare part party''.replace(/(?!.*s)par/g, ''X'')

    [](#cb176-14)< "par sXe Xt Xty"

    [](#cb176-15)

    [](#cb176-16)// since the three assertions used here are all zero-width,

    [](#cb176-17)// all of the 6 possible combinations will be equivalent

    [](#cb176-18)> ''foo_baz=num1+35*42/num2''.replace(/(?!$)\b(?<!^)/g, '' '')

    [](#cb176-19)< "foo_baz = num1 + 35 * 42 / num2"

    ```'
