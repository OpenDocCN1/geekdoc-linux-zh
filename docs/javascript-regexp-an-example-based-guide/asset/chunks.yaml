    ## How this book is organized


    The book introduces concepts one by one and exercises at the end of chapters will
    require only the features introduced until that chapter. Each concept is accompanied
    by multiple examples to cover various angles of usage and corner cases. As mentioned
    before, follow along the illustrations by typing out the code snippets manually.
    It is important to understand both the nature of the sample input string as well
    as the actual programming command used. There are two interlude chapters that
    give an overview of useful external resources and some more resources are collated
    in the final chapter.


    *   [RegExp introduction](#ch003.xhtml_regexp-introduction)


    *   [Anchors](#ch004.xhtml_anchors)


    *   [Alternation and Grouping](#ch005.xhtml_alternation-and-grouping)


    *   [Escaping metacharacters](#ch006.xhtml_escaping-metacharacters)


    *   [Dot metacharacter and Quantifiers](#ch007.xhtml_dot-metacharacter-and-quantifiers)


    *   [Interlude: Tools for debugging and visualization](#ch008.xhtml_interlude-tools-for-debugging-and-visualization)


    *   [Working with matched portions](#ch009.xhtml_working-with-matched-portions)


    *   [Character class](#ch010.xhtml_character-class)


    *   [Groupings and backreferences](#ch011.xhtml_groupings-and-backreferences)


    *   [Interlude: Common tasks](#ch012.xhtml_interlude-common-tasks)


    *   [Lookarounds](#ch013.xhtml_lookarounds)


    *   [Unicode](#ch014.xhtml_unicode)


    *   [Further Reading](#ch015.xhtml_further-reading)


    By the end of the book, you should be comfortable with both writing and reading
    regular expressions, how to debug them and know when to *avoid* them.


    # RegExp introduction


    This chapter will get you started with defining RegExp objects and using them
    inside string methods. To keep it simple, the examples will not use special characters
    related to regular expressions. The main focus will be to get you comfortable
    with syntax and text processing examples. Two methods will be introduced in this
    chapter. The `test` method to search if the input contains a string and the `replace`
    method to substitute a portion of the input with something else.


    > ![info](media/file2.svg) This book will use the terms **regular expressions**
    and **regexp** interchangeably. When specifically referring to a JavaScript object,
    **RegExp** will be used.


    ## Console and documentation


    As mentioned in the [preface](#ch001.xhtml_preface), examples presented in this
    book have been tested on Chrome/Chromium console. Other browsers based on Chromium
    may also work. Use `Ctrl+Shift+J` shortcut from a new tab to open a console. Some
    variable names are reused across different chapters, open another tab in such
    cases to avoid errors.


    See [MDN: Regular Expressions](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Regular_Expressions)
    for documentation, examples and feature compatibility details.


    ## test method


    First up, a simple example to test whether a string is part of another string
    or not. Normally, you''d use the `includes` method and pass a string as argument.
    For regular expressions, use the `test` method on a RegExp object, which is defined
    by the search string enclosed within `//` delimiters.


    ```

    [](#cb1-1)> let sentence = ''This is a sample string''

    [](#cb1-2)

    [](#cb1-3)// check if ''sentence'' contains the given string argument

    [](#cb1-4)> sentence.includes(''is'')

    [](#cb1-5)< true

    [](#cb1-6)> sentence.includes(''z'')

    [](#cb1-7)< false

    [](#cb1-8)

    [](#cb1-9)// check if ''sentence'' matches the pattern as described by the regexp

    [](#cb1-10)> /is/.test(sentence)

    [](#cb1-11)< true

    [](#cb1-12)> /z/.test(sentence)

    [](#cb1-13)< false

    ```


    Here''s some examples of using the `test` method in conditional expressions.


    ```

    [](#cb2-1)> let report = ''string theory''

    [](#cb2-2)

    [](#cb2-3)> if (/ring/.test(report)) {

    [](#cb2-4)      console.log(''mission success'')

    [](#cb2-5)  }

    [](#cb2-6)< mission success

    [](#cb2-7)

    [](#cb2-8)> if (!/fire/.test(report)) {

    [](#cb2-9)      console.log(''mission failed'')

    [](#cb2-10)  }

    [](#cb2-11)< mission failed

    ```


    And here''s some array processing examples.


    ```

    [](#cb3-1)> let words = [''cat'', ''attempt'', ''tattle'']

    [](#cb3-2)

    [](#cb3-3)// get all elements that contain ''tt''

    [](#cb3-4)> words.filter(w => /tt/.test(w))

    [](#cb3-5)< ["attempt", "tattle"]

    [](#cb3-6)

    [](#cb3-7)// check if all the elements contain ''at''

    [](#cb3-8)> words.every(w => /at/.test(w))

    [](#cb3-9)< true

    [](#cb3-10)

    [](#cb3-11)// check if any element contains ''stat''

    [](#cb3-12)> words.some(w => /stat/.test(w))

    [](#cb3-13)< false

    ```


    ## Flags


    Some of the regular expressions functionality is enabled by passing flags, represented
    by an alphabet character. If you have used command line, flags are similar to
    command options, for example `grep -i` will perform case insensitive matching.


    In this chapter, two flags will be discussed:


    *   `i` flag to ignore case while matching alphabets (default is case sensitive
    matching)


    *   `g` flag to match all occurrences (by default only the first one is matched)


    Examples for `i` flag is shown below. `g` flag will be discussed in [replace method](#ch003.xhtml_replace-method)
    section later in this chapter.


    ```

    [](#cb4-1)> /cat/.test(''CaT'')

    [](#cb4-2)< false

    [](#cb4-3)> /cat/i.test(''CaT'')

    [](#cb4-4)< true

    [](#cb4-5)

    [](#cb4-6)> [''Cat'', ''cot'', ''CATER'', ''SCat'', ''ScUtTLe''].filter(w => /cat/i.test(w))

    [](#cb4-7)< ["Cat", "CATER", "SCat"]

    ```


    ## RegExp constructor and reuse


    The RegExp object can be saved in a variable. This helps to improve code clarity,
    enable reuse, etc.


    ```

    [](#cb5-1)> const pet = /dog/

    [](#cb5-2)

    [](#cb5-3)> pet.test(''They bought a dog'')

    [](#cb5-4)< true

    [](#cb5-5)> pet.test(''A cat crossed their path'')

    [](#cb5-6)< false

    ```


    RegExp objects can also be constructed using the `RegExp()` constructor. The first
    argument is either a string or a RegExp object. The second argument is used to
    specify one or more flags.


    ```

    [](#cb6-1)> const pat = new RegExp(''dog'')

    [](#cb6-2)> pat

    [](#cb6-3)< /dog/

    [](#cb6-4)

    [](#cb6-5)// if flags are needed, specify them as the second argument

    [](#cb6-6)> new RegExp(''dog'', ''i'')

    [](#cb6-7)< /dog/i

    ```


    The main advantage of the constructor over `//` literal is the ability to dynamically
    construct the regexp using `${}` to insert content of other variables or the result
    of an expression.


    ```

    [](#cb7-1)> let greeting = ''hi''

    [](#cb7-2)

    [](#cb7-3)> const pat1 = new RegExp(`${greeting} there`)

    [](#cb7-4)> pat1

    [](#cb7-5)< /hi there/

    [](#cb7-6)

    [](#cb7-7)> new RegExp(`${greeting.toUpperCase()} there`)

    [](#cb7-8)< /HI there/

    ```


    ## replace method


    The `replace` string method is used for search and replace operations.


    ```

    [](#cb8-1)// change only the first match

    [](#cb8-2)> ''1,2,3,4''.replace(/,/, ''-'')

    [](#cb8-3)< "1-2,3,4"

    [](#cb8-4)

    [](#cb8-5)// change all the matches by adding ''g'' flag

    [](#cb8-6)> ''1,2,3,4''.replace(/,/g, ''-'')

    [](#cb8-7)< "1-2-3-4"

    [](#cb8-8)

    [](#cb8-9)// multiple flags can be combined

    [](#cb8-10)> ''cArT PART tart mArt''.replace(/art/ig, ''2'')

    [](#cb8-11)< "c2 P2 t2 m2"

    ```


    > ![warning](media/file3.svg) A common mistake is forgetting that strings are
    immutable. If you want to save the changes to the same variable, you need to explicitly
    assign the result back to that variable.


    ```

    [](#cb9-1)> let word = ''cater''

    [](#cb9-2)

    [](#cb9-3)// this will return a string but won''t modify the ''word'' variable

    [](#cb9-4)> word.replace(/cat/, ''hack'')

    [](#cb9-5)< "hacker"

    [](#cb9-6)> word

    [](#cb9-7)< "cater"

    [](#cb9-8)

    [](#cb9-9)// need to explicitly assign the result for in-place modification

    [](#cb9-10)> word = word.replace(/cat/, ''hack'')

    [](#cb9-11)< "hacker"

    [](#cb9-12)> word

    [](#cb9-13)< "hacker"

    ```'
