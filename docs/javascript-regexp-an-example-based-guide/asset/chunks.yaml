    ```


    ## Backreference oddities


    Since `$` is special in replacement section, there''s an issue to place it literally
    if followed by numbers. Usually, escaping is used for such purposes, but here
    you need to use `$$`.


    ```

    [](#cb149-1)// no capture group used, so ''$1'' is inserted literally

    [](#cb149-2)> ''cat''.replace(/a/, ''{$1}'')

    [](#cb149-3)< "c{$1}t"

    [](#cb149-4)// capture group used, ''\$1'' is same as ''$1'' here

    [](#cb149-5)> ''cat''.replace(/(a)/, ''{\$1}'')

    [](#cb149-6)< "c{a}t"

    [](#cb149-7)

    [](#cb149-8)// use ''$$'' to avoid backreference and insert ''$'' literally

    [](#cb149-9)> ''cat''.replace(/(a)/, ''{$$1}'')

    [](#cb149-10)< "c{$1}t"

    ```


    Another issue is how to avoid ambiguity when you have normal digits immediately
    following a backreference? It''ll depend on how many backreferences are present
    in the pattern and whether you need to avoid ambiguity in regexp definition or
    replacement section. For example, if there are less than 10 groups, then something
    like `$12` will refer to first capture group and `2` as a character. If there
    are no capture groups, then something like `$5` will get inserted literally as
    `$` and `5`.


    ```

    [](#cb150-1)// $15 here will backreference 1st group and use 5 as a character

    [](#cb150-2)> ''[52] apples and [31] mangoes''.replace(/\[(\d+)\]/g, ''($15)'')

    [](#cb150-3)< "(525) apples and (315) mangoes"

    [](#cb150-4)

    [](#cb150-5)// $3 will be inserted literally since there is only one capture group

    [](#cb150-6)> ''[52] apples and [31] mangoes''.replace(/\[(\d+)\]/g, ''$3'')

    [](#cb150-7)< "$3 apples and $3 mangoes"

    [](#cb150-8)

    [](#cb150-9)// $1 will be inserted literally since there are no capture groups

    [](#cb150-10)> ''[52] apples and [31] mangoes''.replace(/\[\d+\]/g, ''$1'')

    [](#cb150-11)< "$1 apples and $1 mangoes"

    ```


    On the other hand, if you have more than `9` but less than `100` groups, then
    there would be an issue if you want to refer to single digit group followed by
    literal digit characters. The workaround is to prefix `0` such that number of
    digits after `$` equals the number of digits required for the highest capture
    group. So, if you have more than `9` but less than `100` groups, `$05` will refer
    to 5th capture group and any digit after that will be treated literally.


    ```

    [](#cb151-1)// for illustration purposes, 12 capture groups have been defined
    here

    [](#cb151-2)// if you want to reference 2-digit group, there''s no issue

    [](#cb151-3)> ''abcdefghijklmn''.replace(/(.)(.)(.)(.)(.)(.)(.)(.)(.)(.)(.)(.)/,
    ''$11'')

    [](#cb151-4)< "kmn"

    [](#cb151-5)

    [](#cb151-6)// what if you wanted to reference 1st group followed by ''1'' as
    a character?

    [](#cb151-7)// using \x31 wouldn''t work as it still results in $11

    [](#cb151-8)> ''abcdefghijklmn''.replace(/(.)(.)(.)(.)(.)(.)(.)(.)(.)(.)(.)(.)/,
    ''$1\x31'')

    [](#cb151-9)< "kmn"

    [](#cb151-10)// prefix a ''0'' so that ''$01'' becomes the reference and ''1''
    becomes character

    [](#cb151-11)> ''abcdefghijklmn''.replace(/(.)(.)(.)(.)(.)(.)(.)(.)(.)(.)(.)(.)/,
    ''$011'')

    [](#cb151-12)< "a1mn"

    ```


    The workaround is simpler in regexp definition. The `0` prefix trick doesn''t
    work, but using ASCII code with `\xhh` works. For example, `\1\x31` will refer
    to first capture group followed by `1` as a character.


    ```

    [](#cb152-1)> ''abcdefghijklmna1d''.replace(/(.)(.)(.)(.)(.)(.)(.)(.)(.)(.)(.)(.).*\1\x31/,
    ''X'')

    [](#cb152-2)< "Xd"

    ```


    ## Non-capturing groups


    Grouping has many uses like applying quantifier on a regexp portion, creating
    terse regexp by factoring common portions and so on. It also affects the output
    of `split` method as seen in [split with capture groups](#ch009.xhtml_split-with-capture-groups)
    section. Unlike similar methods in other languages, `match` method with `g` flag
    isn''t affected by capture groups and returns entire matched portions.


    ```

    [](#cb153-1)// split method without capture group

    [](#cb153-2)> ''Sample123string42with777numbers''.split(/\d+/)

    [](#cb153-3)< ["Sample", "string", "with", "numbers"]

    [](#cb153-4)// split method with capture group

    [](#cb153-5)> ''Sample123string42with777numbers''.split(/(\d+)/)

    [](#cb153-6)< ["Sample", "123", "string", "42", "with", "777", "numbers"]

    [](#cb153-7)

    [](#cb153-8)// match method example with ''g'' flag and capture groups

    [](#cb153-9)> ''effort flee facade oddball rat tool''.match(/\b\w*(\w)\1\w*\b/g)

    [](#cb153-10)< ["effort", "flee", "oddball", "tool"]

    [](#cb153-11)// here''s another example

    [](#cb153-12)> ''hi 123123123 bye 456123456''.match(/(123)+/g)

    [](#cb153-13)< ["123123123", "123"]

    ```


    When backreferencing is not required, you can use a non-capturing group to avoid
    behavior change of `split` method. It also helps to avoid keeping a track of capture
    group numbers when that particular group is not needed for backreferencing. The
    syntax is `(?:pat)` to define a non-capturing group, where `pat` is an abbreviation
    for a portion of regular expression pattern. More such special groups starting
    with `(?` syntax will be discussed later on.


    ```

    [](#cb154-1)// here, grouping is needed to take out common portion and apply quantifier

    [](#cb154-2)// but using capture group will not give expected output

    [](#cb154-3)> ''123hand42handy777handful500''.split(/hand(y|ful)?/)

    [](#cb154-4)< ["123", undefined, "42", "y", "777", "ful", "500"]

    [](#cb154-5)// non-capturing group to the rescue

    [](#cb154-6)> ''123hand42handy777handful500''.split(/hand(?:y|ful)?/)

    [](#cb154-7)< ["123", "42", "777", "500"]

    [](#cb154-8)

    [](#cb154-9)// with normal grouping, need to keep track of all the groups

    [](#cb154-10)> ''1,2,3,4,5,6,7''.replace(/^(([^,]+,){3})([^,]+)/, ''$1($3)'')

    [](#cb154-11)< "1,2,3,(4),5,6,7"

    [](#cb154-12)// using non-capturing groups, only relevant groups have to be tracked

    [](#cb154-13)> ''1,2,3,4,5,6,7''.replace(/^((?:[^,]+,){3})([^,]+)/, ''$1($2)'')

    [](#cb154-14)< "1,2,3,(4),5,6,7"

    ```


    Referring to text matched by a capture group with a quantifier will give only
    the last match, not entire match. Use a capture group around the grouping and
    quantifier together to get the entire matching portion. In such cases, the inner
    grouping is an ideal candidate to use non-capturing group.'
