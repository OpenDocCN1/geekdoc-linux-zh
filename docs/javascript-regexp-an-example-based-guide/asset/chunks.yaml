- fmt: "\nYou can also use codepoints inside `\\u{}` construct to specify unicode\
    \ characters. This is similar to how `\\xhh` can be used to specify ASCII characters\
    \ with two hexadecimal digits.\n\n```\n[](#cb204-1)// to get codepoints in hexadecimal\
    \ from given string\n[](#cb204-2)> Array.from('fox:αλεπού', c => c.codePointAt().toString(16))\n\
    [](#cb204-3)< [\"66\", \"6f\", \"78\", \"3a\", \"3b1\", \"3bb\", \"3b5\", \"3c0\"\
    , \"3bf\", \"3cd\"]\n[](#cb204-4)\n[](#cb204-5)// using codepoint to represent\
    \ a character\n[](#cb204-6)> '\\u{3b1}'\n[](#cb204-7)< \"α\"\n[](#cb204-8)\n[](#cb204-9)//\
    \ character range for lowercase alphabets using \\u{}\n[](#cb204-10)// note that\
    \ \\u{} will work with 'u' flag only\n[](#cb204-11)> 'fox:αλεπού,eagle:αετός'.match(/[\\\
    u{61}-\\u{7a}]+/gu)\n[](#cb204-12)< [\"fox\", \"eagle\"]\n```\n\n> ![info](media/file2.svg)\
    \ See also [stackoverflow: Unicode string to hex](https://stackoverflow.com/questions/21647928/javascript-unicode-string-to-hex).\n\
