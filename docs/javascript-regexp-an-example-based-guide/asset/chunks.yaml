    [`regex101`](https://regex101.com/) 是测试正则表达式的流行网站。你首先需要选择 JavaScript 模式。然后你可以添加你的正则表达式、输入字符串、选择标志以及可选的替换字符串。匹配部分将被高亮，并在单独窗格中提供解释。此外还有快速参考以及分享、代码生成器、测验等功能。


