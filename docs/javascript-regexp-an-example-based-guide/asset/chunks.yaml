    \ for details |\n| `\\u{}` | specify unicode characters using codepoints |\n\n\
    A comprehensive discussion on regexp usage with Unicode characters is out of scope\
    \ for this book. Resources like [regular-expressions: unicode](https://www.regular-expressions.info/unicode.html)\
