    ## 正向断言 (Positive lookarounds)


    与否定断言不同，模式的缺失不会满足正向断言。相反，要满足条件，模式必须匹配实际字符和/或零宽断言。通过在分组中使用 `=` 可以识别正向断言。其完整语法如下：


    *   `(?=pat)` 用于正向预瞻断言

    *   `(?<=pat)` 用于正向后行断言


    ```

    [](#cb177-1)// 仅当数字后面跟着逗号时提取数字

    [](#cb177-2)// 注意字符串结尾不符合此条件，因为这是正向断言

    [](#cb177-3)> ''42 foo-5, baz3; x83, y-20; f12''.match(/\d+(?=,)/g)

    [](#cb177-4)< ["5", "83"]

    [](#cb177-5)// 仅当数字前面是 - 且后面是逗号或分号时提取数字

    [](#cb177-6)> ''42 foo-5, baz3; x83, y-20; f12''.match(/(?<=-)\d+(?=[;,])/g)

    [](#cb177-7)< ["5", "20"]

    [](#cb177-8)

    [](#cb177-9)// 等于：match(/\b\w/g).join('''')

    [](#cb177-10)> ''sea eat car rat eel tea''.replace(/(?<=\b\w)\w*\W*/g, '''')

    [](#cb177-11)< "secret"

    [](#cb177-12)

    [](#cb177-13)//只要 ''part'' 在行后部作为整个单词出现，就替换 ''par''

    [](#cb177-14)> ''par spare part party''.replace(/par(?=.*\bpart\b)/g, ''X'')

    [](#cb177-15)< "X sXe part party"

    ```


    断言在处理基于字段的操作时非常有用。


    ```

    [](#cb178-1)// 排除第一个和最后一个字段

    [](#cb178-2)> ''1,two,3,four,5''.match(/(?<=,)[^,]+(?=,)/g)

    [](#cb178-3)< ["two", "3", "four"]

    [](#cb178-4)

    [](#cb178-5)// 将空字段替换为 NA

    [](#cb178-6)// 注意在 particular 例中，后行断言和预瞻断言的顺序并不重要

    [](#cb178-7)> '',1,,,two,3,,''.replace(/(?<=^|,)(?=,|$)/g, ''NA'')

    [](#cb178-8)< "NA,1,NA,NA,two,3,NA,NA"

    [](#cb178-9)// 使用否定断言实现相同的功能

    [](#cb178-10)> '',1,,,two,3,,''.replace(/(?![^,])(?<![^,])/g, ''NA'')

    [](#cb178-11)< "NA,1,NA,NA,two,3,NA,NA"

    [](#cb178-12)

    [](#cb178-13)// 在非空列的末尾有一个额外的空字符串匹配

    [](#cb178-14)> '',cat,tiger''.replace(/[^,]*/g, ''{$&}'')

    [](#cb178-15)< "{},{cat}{},{tiger}{}"

    [](#cb178-16)// 断言来救场

    [](#cb178-17)> '',cat,tiger''.replace(/(?<=^|,)[^,]*/g, ''{$&}'')

    [](#cb178-18)< "{},{cat},{tiger}"

    ```


    ## 正向断言内部的捕获组


    尽管断言不是匹配部分的一部分，但在正向断言内部可以使用捕获组。你能推断出为什么它在否定断言中不起作用吗？


    ```

    [](#cb179-1)> console.log(''a b c d e''.replace(/(\S+\s+)(?=(\S+)\s)/g, ''$1$2\n''))

    [](#cb179-2)< a b

    [](#cb179-3)  b c

    [](#cb179-4)  c d

    [](#cb179-5)  d e

    ```


    ## 带断言的 AND 条件


    如之前所承诺，这里是断言如何让构建 AND 条件变得更加简单。


    ```

    [](#cb180-1)> let words = [''sequoia'', ''subtle'', ''questionable'', ''exhibit'',
    ''equation'']

    [](#cb180-2)

    [](#cb180-3)// 以任意顺序包含 ''b''、''e'' 和 ''t'' 的单词

    [](#cb180-4)// 等于：/b.*e.*t|b.*t.*e|e.*b.*t|e.*t.*b|t.*b.*e|t.*e.*b/

    [](#cb180-5)> words.filter(w => /(?=.*b)(?=.*e).*t/)

    [](#cb180-6)> words.filter(w => /(?=.*b)(?=.*e).*t/) // 修正后的逻辑

    [](#cb180-7)< ["subtle", "questionable", "exhibit"]

    [](#cb180-8)//包含任意顺序的所有元元的单词

    [](#cb180-9)> words.filter(w => /(?=.*a)(?=.*e)(?=.*i)(?=.*o).*u/)

    [](#cb180-10)< ["sequoia", "equation"]

    [](#cb180-11)//包含 ''a'' 和 ''q'' 但结尾不是 ''n'' 的单词

    [](#cb180-12)> words.filter(w => /(?=.*a)(?=.*q)(?!.*n$))

    [](#cb180-13)< ["questionable"]

    ```


    ## 可变长度后行断言


    在某些正则表达式实现中，如果模式可以匹配不同数量的字符，后行断言将无法工作。例如，`(?<=foo\d+)` 查找 `foo` 后面跟的一个或多个数字。根据我在控制台的测试，JavaScript
    没有此限制。这里是一些示例：


    ```

    [](#cb181-1)// 正向后行断言示例

    [](#cb181-2)> ''=not''.match(/(?<=\d+)[a-z]+/g)

    [](#cb181-3)< ["not", "cool"]

    [](#cb181-4)// 仅替换第三次出现的 ''cat''

    [](#cb181-5)> ''cat scat''.replace(/(?<=(cat){2})/, ''X'')

    [](#cb181-6)< "cat Xer"

    [](#cb181-7)// 否定后行断言示例

    [](#cb181-8)// 仅当 ''dog'' 前没有出现 ''cat''

    [](#cb181-9)> /(?<!cat.*)dog.test(''fox,cat,parrot'')

    [](#cb181-10)< false

    [](#cb181-11)// 仅当 ''dog'' 前没有出现 ''parrot''

    [](#cb181-12)> /(?<!parrot.*)dog.test(''fox,cat,parrot'')

    [](#cb181-13)< true

    ```


    ## 否定分组


    你已经见过一些否定字符类比正向集合更有用的情况。例如，在字段处理中，需要通过创建分隔符的否定字符集来匹配字段内容。类似的，某些情况下需要否定正则表达式。这通过如下所示使用否定预瞻并每次移动一个字符来实现。


    ```

    [](#cb182-1)// 不能使用 /at<!go)par/ 因为断言不消耗字符

    [](#cb182-2)// 仅当 ''at'' 和 ''par'' 之间没有 ''go''

    [](#cb182-3)> /at((?!go))*par/.test(''fox,cat,parrot'')

    [](#cb182-4)< true

    [](#cb182-5)// 仅当 ''at'' 和 ''par'' 之间没有 ''do''

    [](#cb182-6)> /at((?!do))*par/.test(''fox,cat,parrot'')

    [](#cb182-7)< false

    [](#cb182-9)// 如果感到困惑，使用 ''match'' 方法查看匹配部分

    [](#cb182-10)> ''fox,cat,parrot''.match(/at((?!go))*par/)[0]

    [](#cb182-11)< "at,dog,par"

    [](#cb182-12)> ''at,baz,a2z,bad-zoo''.match(/a((!\d))*z/g)

    [](#cb182-13)< ["at,baz", "ad-z"]

    ```


    ## 快速查表与总结


    | 注意 | 描述 |

    | --- | --- |

    | 断言 | 允许创建自定义的正向/否定断言 |

    | | 类似于零宽锚点且不是匹配部分的一部分 |

    | `(?!pat)` | 否定预瞻断言 |

    | `(?<!pat)` | 否定后行断言 |

    | `(?=pat)` | 正向预瞻断言 |

    | `(?<=pat)` | 正向后行断言 |

    | | 允许变变长度后行断言 |

    | `(?!pat1)(?=pat2)` | 可以按任意顺序相邻指定多个断言 |

    | | 因为它们在不消耗字符的情况下标记匹配位置 |

    | `((?!pat).)*` | 否定正则表达式模式 |


    在本章中，你学习了如何使用断言来创建自定义限制，以及如何使用否定分组。通过这些，正则表达式的大部分强大功能已经涵盖。下一章将简单介绍处理 Unicode 字符。


