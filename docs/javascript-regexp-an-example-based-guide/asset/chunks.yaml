    # 分支与分组 (Alternation and Grouping)


    你经常想要检查输入字符串是否匹配多个模式。例如，汽车颜色是 `green`、`blue` 还是 `red`。在编程术语中，你需要执行逻辑上的 OR 条件判断。本章将展示如何在这种情况下使用分支。这些模式之间也可能包含一些共同元素，在这种情况下，分组有助于形成更简洁的正则表达式。本章还将讨论用于确定哪种分支胜出的的优先级规则。


    ## OR 条件判断 (OR conditional)


    在条件表达式中，你可以使用逻辑运算符来组合多个条件。在正则表达式中，元字符 `|` 类似于逻辑 OR。如果由 `|` 分隔的表达式中的任何一个满足，正则表达式将进行匹配。这些分支中的每一个都是一个完整的正则表达式。例如，锚点（anchors）是特定于该特定分支的。


    ```

    [](#cb40-1)// 匹配 ''cat'' 或 ''dog''

    [](#cb40-2)> const pets = /cat|dog/

    [](#cb40-3)> pets.test(''I like cats'')

    [](#cb40-4)< true

    [](#cb40-5)> pets.test(''I like dogs'')

    [](#cb40-6)< true

    [](#cb40-7)> pets.test(''I like parrots'')

    [](#cb40-8)< false

    [](#cb40-9)// 替换字符串开头的 ''cat'' 或结尾的 ''cat''

    [](#cb40-11)> ''catacat scat''.replace(/^cat|cat\b/g, ''X'')

    [](#cb40-12)< "Xap concatenate X"

    [](#cb40-14)// 将 ''cat''、''dog'' 或 ''fox'' 替换为 ''mammal''

    [](#cb40-15)> ''cat dog parrot''.replace(/cat|dog|fox/g, ''mammal'')

    [](#cb40-16)< "mammal mammal mammal"

    ```


    你可以从上面的示例中推断出可能存在需要许多分支的情况。详情请参见动态构建分支。


    ## 分组 (Grouping)


    通常，正则表达式之间存在共同点。它们可能是共同的字符或正则表达式限定符（如锚点）。在这种情况下，你可以使用一对元字符将它们分组。类似于数学中的 `a(b+c)d
    = abd`，在正则表达式中，你得到 `a(b|c)d = abd`。


    ```

    [](#cb41-1)// 不使用分组

    [](#cb41-2)> ''red reform arrest''.replace(/reform|rest/g, ''X'')

    [](#cb41-3)< "red X arX"

    [](#cb41-4)// 使用分组

    [](#cb41-5)> ''red reform arrest''.replace(/reform|st)/g, ''X'')

    [](#cb41-6)< "red X arX"

    [](#cb41-8)// 不使用分组

    [](#cb41-9)> ''par spare party''.replace(/\bpar\b|\part\b/g, ''X'')

    [](#cb41-10)< "X spare party"

    [](#cb41-11)// 提取锚点

    [](#cb41-12)> ''par spare party''.replace(/\b(par|part)\b/g, ''X'')

    [](#cb41-13)< "X spare party"

    ```


    ## 优先级规则 (Precedence rules)


    当多个分支都匹配时，哪一个分支胜出取决于优先级规则。


    ```

    [](#cb42-1)> let words = ''lion elephant are''

    [](#cb42-3)// ''on'' 和 ''ant'' 的起始索引相同

    [](#cb42-4)// 所以取决于分支的顺序

    [](#cb42-5)> words.replace(/on|ant/, ''X'')

    [](#cb42-6)< false // 因为 ''on'' 替换了

    [](#cb42-7)> words.replace(/ant/, ''X'')

    [](#cb42-8)< "liX elephant are"

    ```


    所以，如果两个分支在相同位置匹配会发生什么？这取决于从左到右的声明顺序。用于测试字符串的 `true` 或 `false`


    ```


    [](#cb43-1)> let mood = ''best years''

    [](#cb43-3)// ''year'' 和 ''years'' 的起始索引总是相同的

    [](#cb43-4)// 所以，哪一个被替换取决于分支的顺序

    [](#cb43-5)> mood.replace(/year|years/, ''X'')

    [](#cb43-6)< "best Xs"

    [](#cb43-7)> mood.replace(/years|year/, ''X'')

    [](#cb43-8)< "best X"

    ```


    另一个 `replace` 示例以强调此问题。


    ```

    [](#cb44-1)> let sample = ''ear xerox at mare part learn eye''

    [](#cb44-3)// 这等同于：replace(/ar/g, ''X'')

    [](#cb44-4)> sample.replace(/ar|are|art/g, ''X'')

    [](#cb44-5)< "eX xerox at mXe pXt leXn eye"

    [](#cb44-6)// 这等同于：replace(/ar/g, ''X'')

    [](#cb44-7)> sample.replace(/are|ar|art/g, ''X'')

    [](#cb44-8)< "eX xerox at mX pXt leXn eye"

    [](#cb44-9)// 呼，最后这个终于符合预期了

    [](#cb44-10)> sample.replace(/are|art|ar/g, ''X'')

    [](#cb44-11)< "eX xerox at mX pX leXn eye"

    ```


    ## 快速查表与总结 (Cheatsheet and Summary)


    | 注意事项 | 描述 |


    | --- | --- |


    | `pat1&#124|pat2&#124|pat3` | 作为 OR 条件组合的多个正则表达式 |


    |  | 每个分支可以有独立的锚点 |


    | `()` | 分组模式 |


    | `a(b&#124;c)d` | 等同于 `abd&#124;acd` |

    ```


