    ## 总结


    本章简要介绍了三个在线工具，它们可以帮助你理解并交互式地解决/调试正则表达式。不同工具和编程语言之间的语法和功能可能会有很大差异。因此，请确保程序支持你正在使用的正则表达式模式。


    # 处理匹配部分


    在看了一些可以匹配文本的正则表达式特性后，你将在本章中学习如何提取并处理这些部分。引入了三个新方法，类似于 `replace` 方法中的函数和字典。


    ### match 方法


    `match` 方法可以以不同的方式使用。当不使用 `g` 标志且正则表达式成功时，你将得到一个包含第一个部分各种细节的数组。


    ```

    [](#cb92-1)// 注意没有使用 ''g'' 标志

    [](#cb92-2)> ''abc ac adc abbbc''.match(/abc/)

    [](#cb92-3)< ["abc", index: 0, input: "abc ac adc abbbc", groups: undefined]

    [](#cb92-4)// 仅获取匹配部分

    [](#cb92-5)> ''abc ac adc abbbc''.match(/abc/)[0]

    [](#cb92-6)< "abc"

    [](#cb92-7)// 非正则表达式对象将被作为 RegExp 处理

    [](#cb92-8)> ''abc ac adc abbbc''.match(''abc'')

    [](#cb92-9)< ["abc", index: 0, input: "abc ac adc abbbc", groups: undefined]

    ```


    `index` 属性给出匹配部分的起始位置。`input` 属性提供使用 `match` 方法的输入字符串。如果指定的正则表达式失败，输出为 `null`
    而不是空数组。`groups` 属性将在命名捕获组中讨论。更多细节请参见 [MDN: match](https://developer.mozilla.org/en-US/docs/Web/Reference/Global_Objects/String/match)。


    ```

    (#cb93-1)> let s1 = ''cat and dog''

    [](#cb93-2)> s1.match(/dog/).index

    [](#cb93-3)< 8

    [](#cb93-4)> s1.match(/dog/).input

    [](#cb93-5)< "cat and dog"

    [](#cb93-8)> s1.match(/xyz/)

    [](#cb93-9)< null

    ```


    ### search 方法


    `search` 方法给出第一个匹配部分的索引。如果正则表达式失败，它返回 `-1` 作为输出。


    ```

    [](#cb94-1)// 等同于 match(/dog/).index

    [](#cb94-2)> ''cat and dog''.search(/dog/)

    [](#cb94-3)< 8

    [](#cb94-4)// 在此处不能使用 match(/xyz/).index

    [](#cb94-5)// 因为如果正则表达式不匹配，''match'' 将返回 ''null''

    [](#cb94-6)> ''cat and dog''.search(/xyz/)

    [](#cb94-7)< -1

    ```


    ### 捕获组


    `()` 内部的正则表达式分组被称为捕获组。它有多个用途，其中之一是能够处理这些组的匹配部分。当在 `match` 方法使用捕获组时，这些组的匹配部分也将是数组输出的一部分。第一个元素始终是整个匹配部分，后面是捕获组的部分。最左侧的
    `(` 将获得组号 `1`，第二个最左侧的 `(` 将获得组号 `2`，依此类推。


    ```

    [](#cb95-1)// 这里使用了两个捕获组

    [](#cb95-2)> ''abc ac adc abbbc''.match(/a(.*)d(.*a)/)

    [](#cb95-3)< "abc ac adc a", "bc ac a", "c a", index: 0,

    [   input: "abc ac adc abbbc", groups: undefined]

    [](#cb95-6)// 整个匹配部分

    [](#cb95-7)> ''abc ac adc abbbc''.match(/a(.*)d(.*a)/)[0]

    [](#cb95-8)< "abc ac adc a"

    [](#cb95-10)// 捕获组部分

    [](#cb95-11)> ''abc ac adc abbbc''.match(/a(.*)d(.*a)/)[1]

    [](#cb95-12)< "bc ac a"

    [](#cb95-13)> ''abc ac adc abbbc''.match(/a(.*)d(.*a)/)[2]

    [](#cb95-14)< "c a"

    ```


    ### 获取所有匹配部分


    当使用 `g` 标志时，`match` 方法返回所有匹配部分。捕获组部分和三个属性不会包含输出输出。


    ```

    [](#cb96-1)> ''abc ac adc abbbc''.match(/ab*c/g)

    [](#cb96-2)< ["abc", "ac", "abbbc"]

    [](#cb96-3)

    [](#cb96-4)> ''abc ac adc abbbc''.match(/ab+c/g)

    [](#cb96-5)< ["abc", "abbbc"]

    [](#cb96-6)

    [](#cb96-7)> ''par spar apparent spare part''.match(/\bs?pare?\b/g)

    [](#cb96-8)< ["par", "spar", "spare"]

    [](#cb96-9)

    [](#cb96-10)//即使使用了捕获组，也会返回整个匹配部分

    [](#cb96-11)> ''par spar apparent spare part''.match(/\bs?par(e|t)\b/g)

    [](#cb96-12)< ["spare", "part"]

    ```


    这也是一个非常有用的调试方法，例如在使用 `replace` 方法之前查看内部发生了什么。


    ```

    [](#cb97-1)> ''that is quite a fabricated tale''.match(/t.*a/g)

    [](#cb97-2)< ["that is quite a fabricated ta"]

    [](#cb97-3)> ''that is quite a fabricated tale''.match(/t.*?a/g)

    [](#cb97-4)< ["tha", "t is quite a", "ted ta"]

    ```


    ### matchAll 方法


    如果你在启用 `g` 标志时需要每个匹配的捕获组部分和属性，请使用 `matchAll` 方法。返回值是一个迭代器。


    '
- fmt: '

    ```javascript

    [](#cb98-1)> ''abc ac adc abbbc''.matchAll(/ab*c/g)

    [](#cb98-2)< RegExpStringIterator {}

    [](#cb98-3)

    [](#cb98-4)// convert the iterator result to array of arrays

    [](#cb98-5)> let arr = [...''abc ac adc abbbc''.matchAll(/ab*c/g)]

    [](#cb98-6)> arr

    [](#cb98-7)< (3) [Array(1), Array(1), Array(1)]

    [](#cb98-8)  0: ["abc", index: 0, input: "abc ac adc abbbc", groups: undefined]

    [](#cb98-9)  1: ["ac", index: 4, input: "abc ac adc abbbc", groups: undefined]

    [](#cb98-10)  2: ["abbbc", index: 11, input: "abc ac adc abbbc", groups: undefined]

    [](#cb98-11)  length: 3

    [](#cb98-12)  __proto__: Array(0)

    [](#cb98-13)

    [](#cb98-14)// get array with details for first match

    [](#cb98-15)> arr[0]

    [](#cb98-16)< ["abc", index: 0, input: "abc ac adc abbbc", groups: undefined]

    [](#cb98-17)// get index for second match

    [](#cb98-18)> arr[1].index

    [](#cb98-19)< 4

    ```


    You can also use [`Array.from()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/from)
    to convert the iterator to array object. `Array.from` allows you to provide a
    mapping function as second argument.


    ```javascript

    [](#cb99-1)// same as: match(/ab*c/g)

    [](#cb99-2)> Array.from(''abc ac adc abbbc''.matchAll(/ab*c/g), m => m[0])

    [](#cb99-3)< ["abc", "ac", "abbbc"]

    [](#cb99-4)// get index for each match

    [](#cb99-5)> Array.from(''abc ac adc abbbc''.matchAll(/ab*c/g), m => m.index)

    [](#cb99-6)< [0, 4, 11]

    [](#cb99-7)

    [](#cb99-8)// get only capture group portions as an array for each match

    [](#cb99-9)> Array.from(''xx:yyy x: x:yy :y''.matchAll(/(x*):(y*)/g), m => m.slice(1))

    [](#cb99-10)< (4) [Array(2), Array(2), Array(2), Array(2)]

    [](#cb99-11)  0: (2) ["xx", "yyy"]

    [](#cb99-12)  1: (2) ["x", ""]

    [](#cb99-13)  2: (2) ["x", "yy"]

    [](#cb99-14)  3: (2) ["", "y"]

    [](#cb99-15)  length: 4

    [](#cb99-16)  __proto__: Array(0)

    ```


    > ![info](media/file2.svg) Before the introduction of the `matchAll` method, `exec`
    method had to be used. See [MDN: exec](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/RegExp/exec)
    details and examples.


    ## Split with capture groups


    Capture groups affect the `split` method as well. If the pattern used to split
    contains capture groups, the portions matched by those groups will also be a part
    of the output array.


    ```javascript

    [](#cb100-1)// without capture group

    [](#cb100-2)> ''31111111111251111426''.split(/1*4?2/)

    [](#cb100-3)< ["3", "5", "6"]

    [](#cb100-4)

    [](#cb100-5)// to include the matching portions of the pattern as well in the
    output

    [](#cb100-6)> ''31111111111251111426''.split(/(1*4?2)/)

    [](#cb100-7)< ["3", "11111111112", "5", "111142", "6"]

    ```


    If part of the pattern is outside a capture group, the text thus matched won''t
    be in the output. If a capture group didn''t participate, it will be represented
    by `undefined` in the output array.


    ```javascript

    [](#cb101-1)// here 4?2 is outside capture group, so that portion won''t be in
    output

    [](#cb101-2)> ''31111111111251111426''.split(/(1*)4?2/)

    [](#cb101-3)< ["3", "1111111111", "5", "1111", "6"]

    [](#cb101-4)

    [](#cb101-5)// multiple capture groups example

    [](#cb101-6)// note that the portion matched by b+ isn''t present in the output

    [](#cb101-7)> ''3.14aabccc42''.split(/(a+)b+(c+)/)

    [](#cb101-8)< ["3.14", "aa", "ccc", "42"]

    [](#cb101-9)

    [](#cb101-10)// here (4)? matches zero times on the first occasion

    [](#cb101-11)> ''31111111111251111426''.split(/(1*)(4)?2/)

    [](#cb101-12)< ["3", "1111111111", undefined, "5", "1111", "4", "6"]

    ```


    Use of capture groups and the optional `limit` argument can help you partition
    a string:


    *   Portion before the match

    *   Portion matched by the pattern

    *   Portion after the match


    ## Using function in replacement


    Sometimes a simple replacement string isn''t enough and you need to do some processing
    on the matched portion. For such cases, you can use a function in the `replace`
    method. The arguments available to the function are similar to those provided
    by `match`.


    ```javascript

    [](#cb103-1)> function titleCase(m, g1) {

    [](#cb103-2)  return m.toUpperCase() + g1.toLowerCase()

    [](#cb103-3) }

    [](#cb103-4)> ''aBc ADC''.replace(/(a)(.*?)/, titleCase)

    [](#cb103-5)< "Abc Adc"

    ```


    ## Using dictionary in replacement


    Sometimes the replacement can be simplified by using a dictionary. The matched
    portion acts as the key.


    ```javascript

    [](#cb105-1)> let h = { ''1'': ''one'', ''2'': ''two'', ''4'': ''four'' }

    [](#cb105-2)> ''923412''.replace(/1|2/g, k => h[k])

    [](#cb105-3)< "9two3fourone"

    ```


    If the key doesn''t exist in the dictionary, you can provide a default value:


    ```javascript

    [](#cb105-4)> let h = { ''1'': ''one'', ''2'': ''two'', ''4'': ''four'' }

    [](#cb105-5)> ''923412''.replace(/1|2/g, k => h[k] || ''X'')

    [](#cb105-6)< "9two3fourXX"

    ```


    ## Swapping or more strings


    For swapping two or more strings without intermediate result, using a dictionary
    is recommended.


    ```javascript

    [](#cb106-1)> let swap = { ''cat'': ''tiger'', ''tiger'': ''cat'' }

    [](#cb106-2)> ''cat tiger dog''.replace(/cat|tiger/g, k => swap[k])

    [](#cb106-3)< "tiger cat dog"

    ```


    ## Dynamically building alternation


    For a dictionary that has many entries and likely to undergo changes during development,
    building alternation list manually is not a good choice. Also, recall that as
    per precedence rules, longest length string should come first. The `unionRegExp`
    function is helpful here.


    ```javascript

    [](#cb107-1)> let d = { ''hand'': 1, ''handy'': 2, ''handful'': 3, ''a^b'': 4
    }

    [](#cb107-2)

    [](#cb107-3)> const p = unionRegExp(Object.keys(d).sort((a, b) => b.length - a.length))

    [](#cb107-4)> console.log(p)

    [](#cb107-5)< handful|handy|hand|a\^b

    [](#cb107-6)> ''handful hand pin handy (a^b)''.replace(new RegExp(p, ''g''), k
    => d[k])

    [](#cb107-7)< "3 1 pin 2 (4)"

    ```


    ## Cheatsheet and Summary


    | Note | Description |

    | --- | --- |

    | `m = s.match(/pat/)` | assuming `g` flag isn''t used and regexp succeeds, returns
    an array with matched portion and 3 properties |

    | | | `index` property gives the starting location of the match |

    | | | `input` property gives the input string `s` |

    | | | `groups` property gives dictionary of named capture groups |

    | `m[0]` | for above case, gives entire matched portion |

    | `m[1]` | matched portion of first capture group |

    | `m[2]` | matched portion of second capture group and so on |

    '
  raw: '```

    [](#cb98-1)> ''abc ac adc abbbc''.matchAll(/ab*c/g)

    [](#cb98-2)< RegExpStringIterator {}

    [](#cb98-3)

    [](#cb98-4)// convert the iterator result to array of arrays

    [](#cb98-5)> let arr = [...''abc ac adc abbbc''.matchAll(/ab*c/g)]

    [](#cb98-6)> arr

    [](#cb98-7)< (3) [Array(1), Array(1), Array(1)]

    [](#cb98-8)  0: ["abc", index: 0, input: "abc ac adc abbbc", groups: undefined]

    [](#cb98-9)  1: ["ac", index: 4, input: "abc ac adc abbbc", groups: undefined]

    [](#cb98-10)  2: ["abbbc", index: 11, input: "abc ac adc abbbc", groups: undefined]

    [](#cb98-11)  length: 3

    [](#cb98-12)  __proto__: Array(0)

    [](#cb98-13)

    [](#cb98-14)// get array with details for first match

    [](#cb98-15)> arr[0]

    [](#cb98-16)< ["abc", index: 0, input: "abc ac adc abbbc", groups: undefined]

    [](#cb98-17)// get index for second match

    [](#cb98-18)> arr[1].index

    [](#cb98-19)< 4

    ```


    You can also use [Array.from()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/from)
    to convert the iterator to array object. `Array.from` allows you to provide a
    mapping function as second argument.


    ```

    [](#cb99-1)// same as: match(/ab*c/g)

    [](#cb99-2)> Array.from(''abc ac adc abbbc''.matchAll(/ab*c/g), m => m[0])

    [](#cb99-3)< ["abc", "ac", "abbbc"]

    [](#cb99-4)// get index for each match

    [](#cb99-5)> Array.from(''abc ac adc abbbc''.matchAll(/ab*c/g), m => m.index)

    [](#cb99-6)< [0, 4, 11]

    [](#cb99-7)

    [](#cb99-8)// get only capture group portions as an array for each match

    [](#cb99-9)> Array.from(''xx:yyy x: x:yy :y''.matchAll(/(x*):(y*)/g), m => m.slice(1))

    [](#cb99-10)< (4) [Array(2), Array(2), Array(2), Array(2)]

    [](#cb99-11)  0: (2) ["xx", "yyy"]

    [](#cb99-12)  1: (2) ["x", ""]

    [](#cb99-13)  2: (2) ["x", "yy"]

    [](#cb99-14)  3: (2) ["", "y"]

    [](#cb99-15)  length: 4

    [](#cb99-16)  __proto__: Array(0)

    ```


    > ![info](media/file2.svg) Before the introduction of `matchAll` method, `exec`
    method had to be used. See [MDN: exec](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/RegExp/exec)
    details and examples.


    ## split with capture groups


    Capture groups affects `split` method as well. If the pattern used to split contains
    capture groups, the portions matched by those groups will also be a part of the
    output array.


    ```

    [](#cb100-1)// without capture group

    [](#cb100-2)> ''31111111111251111426''.split(/1*4?2/)

    [](#cb100-3)< ["3", "5", "6"]

    [](#cb100-4)

    [](#cb100-5)// to include the matching portions of the pattern as well in the
    output

    [](#cb100-6)> ''31111111111251111426''.split(/(1*4?2)/)

    [](#cb100-7)< ["3", "11111111112", "5", "111142", "6"]

    ```


    If part of the pattern is outside a capture group, the text thus matched won''t
    be in the output. If a capture group didn''t participate, it will be represented
    by `undefined` in the output array.


    ```

    [](#cb101-1)// here 4?2 is outside capture group, so that portion won''t be in
    output

    [](#cb101-2)> ''31111111111251111426''.split(/(1*)4?2/)

    [](#cb101-3)< ["3", "1111111111", "5", "1111", "6"]

    [](#cb101-4)

    [](#cb101-5)// multiple capture groups example

    [](#cb101-6)// note that the portion matched by b+ isn''t present in the output

    [](#cb101-7)> ''3.14aabccc42''.split(/(a+)b+(c+)/)

    [](#cb101-8)< ["3.14", "aa", "ccc", "42"]

    [](#cb101-9)

    [](#cb101-10)// here (4)? matches zero times on the first occasion

    [](#cb101-11)> ''31111111111251111426''.split(/(1*)(4)?2/)

    [](#cb101-12)< ["3", "1111111111", undefined, "5", "1111", "4", "6"]

    ```


    Use of capture groups and optional `limit` argument can help you partition an
    input string into three parts:


    *   portion before the first match


    *   portion matched by the pattern itself


    *   portion after the pattern


    ```

    [](#cb102-1)// use ''s'' flag as well if needed

    [](#cb102-2)> ''3.14aabccc42abc88''.split(/(a+b+c+)(.*)/, 3)

    [](#cb102-3)< ["3.14", "aabccc", "42abc88"]

    ```


    ## Using function in replacement section


    Sometimes, simple replacement string isn''t enough and you need to do some processing
    on the matched portion. For such cases, you can use function in the replacement
    section. The arguments available to the function are similar to the details provided
    by `match` method. The first one is entire matched portion. If capture groups
    are used, portions matched by those groups will be next. Then comes index of matched
    portion and finally the input string. Depending on the complexity, you can use
    fully defined function or arrow function expressions.


    ```

    [](#cb103-1)> function titleCase(m) {

    [](#cb103-2)      return m[0].toUpperCase() + m.substr(1).toLowerCase()

    [](#cb103-3)  }

    [](#cb103-4)

    [](#cb103-5)// only function name is enough as second argument

    [](#cb103-6)// the matched portion details will be passed automatically to the
    function

    [](#cb103-7)// in this example, ''titleCase'' is using only the entire matched
    portion

    [](#cb103-8)> ''aBc ac ADC aBbBC''.replace(/a.*?c/ig, titleCase)

    [](#cb103-9)< "Abc Ac Adc Abbbc"

    [](#cb103-10)

    [](#cb103-11)// can also use arrow function expressions for simple cases

    [](#cb103-12)> ''abc ac adc abbbc''.replace(/ab*c/g, m => m.toUpperCase())

    [](#cb103-13)< "ABC AC adc ABBBC"

    [](#cb103-14)

    [](#cb103-15)// \d will be covered later

    [](#cb103-16)// for now, it is enough to know that it will match all digit characters

    [](#cb103-17)> ''1 42 317''.replace(/\d+/g, m => m*2)

    [](#cb103-18)< "2 84 634"

    ```


    Here''s an example with capture groups. See also [MDN: replace](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/replace)
    for more details.


    ```

    [](#cb104-1)> function titleCase(m, g1, g2) {

    [](#cb104-2)        return g1.toUpperCase() + g2.toLowerCase()

    [](#cb104-3)  }

    [](#cb104-4)> ''aBc ac ADC aBbBC''.replace(/(a)(.*?c)/ig, titleCase)

    [](#cb104-5)< "Abc Ac Adc Abbbc"

    ```


    ## Using dictionary in replacement section


    Sometimes, the functionality you need in replacement section can be simplified
    to using a dictionary. The matched portion acts as the key to get corresponding
    value from the dictionary.


    ```

    [](#cb105-1)// one to one mappings

    [](#cb105-2)> let h = { ''1'': ''one'', ''2'': ''two'', ''4'': ''four'' }

    [](#cb105-3)

    [](#cb105-4)> ''9234012''.replace(/1|2|4/g, k => h[k])

    [](#cb105-5)< "9two3four0onetwo"

    [](#cb105-6)

    [](#cb105-7)// providing a default value if the matched text doesn''t exist as
    a key

    [](#cb105-8)> ''9234012''.replace(/\d/g, k => k in h ? h[k] : ''X'')

    [](#cb105-9)< "XtwoXfourXonetwo"

    ```


    For swapping two or more strings without using intermediate result, using a dictionary
    is recommended.


    ```

    [](#cb106-1)> let swap = { ''cat'': ''tiger'', ''tiger'': ''cat'' }

    [](#cb106-2)

    [](#cb106-3)> ''cat tiger dog tiger cat''.replace(/cat|tiger/g, k => swap[k])

    [](#cb106-4)< "tiger cat dog cat tiger"

    ```


    For a dictionary that has many entries and likely to undergo changes during development,
    building alternation list manually is not a good choice. Also, recall that as
    per precedence rules, longest length string should come first. The `unionRegExp`
    function, introduced in [Dynamically building alternation](#ch006.xhtml_dynamically-building-alternation)
    section, is helpful here.


    ```

    [](#cb107-1)> let d = { ''hand'': 1, ''handy'': 2, ''handful'': 3, ''a^b'': 4
    }

    [](#cb107-2)

    [](#cb107-3)> const p = unionRegExp(Object.keys(d).sort((a, b) => b.length - a.length))

    [](#cb107-4)> console.log(p)

    [](#cb107-5)< handful|handy|hand|a\^b

    [](#cb107-6)> ''handful hand pin handy (a^b)''.replace(new RegExp(p, ''g''), k
    => d[k])

    [](#cb107-7)< "3 1 pin 2 (4)"

    ```


    ## Cheatsheet and Summary


    | Note | Description |


    | --- | --- |


    | `m = s.match(/pat/)` | assuming `g` flag isn''t used and regexp succeeds, |


    |  | returns an array with matched portion and 3 properties |


    |  | `index` property gives the starting location of the match |


    |  | `input` property gives the input string `s` |


    |  | `groups` property gives dictionary of [named capture groups](#ch011.xhtml_named-capture-groups)
    |


    | `m[0]` | for above case, gives entire matched portion |


    | `m[1]` | matched portion of first capture group |


    | `m[2]` | matched portion of second capture group and so on |'
