- fmt: "\nThis chapter focused on how to create custom placeholders to match limited\
    \ set of characters. Grouping and character classes can be considered as two levels\
    \ of abstractions. On the one hand, you can have character sets inside `[]` and\
    \ on the other hand, you can have multiple alternations grouped inside `()` including\
    \ character classes. As anchoring and quantifiers can be applied to both these\
    \ abstractions, you can begin to see how regular expressions is considered a mini-programming\
    \ language. In coming chapters, you'll even see how to negate groupings similar\
    \ to negated character class in certain scenarios.\n\n## Exercises\n\n**a)** For\
    \ the array `items`, filter all elements starting with `hand` and ending with\
    \ `s` or `y` or `le`. No other character in between, for example, `hands` should\
    \ match but not `hand-has`.\n\n```\n[](#cb130-1)> let items = ['-handy', 'hand',\
    \ 'handy', 'handled', 'hands', 'handle']\n[](#cb130-2)\n[](#cb130-3)// add your\
    \ solution here\n[](#cb130-4)< [\"handy\", \"hands\", \"handle\"]\n```\n\n**b)**\
    \ Replace all whole words `reed` or `read` or `red` with `X`.\n\n```\n[](#cb131-1)>\
    \ let ip = 'redo red credible :read: rod reed bred'\n[](#cb131-2)\n[](#cb131-3)//\
    \ add your solution here\n[](#cb131-4)< \"redo X credible :X: rod X bred\"\n```\n\
    \n**c)** For the array `words`, filter all elements containing `e` or `i` followed\
    \ by `l` or `n`. Note that the order mentioned should be followed.\n\n```\n[](#cb132-1)>\
    \ let words = ['surrender', 'unicorn', 'newer', 'door', 'empty', 'eel', 'pest']\n\
    [](#cb132-2)\n[](#cb132-3)// add your solution here\n[](#cb132-4)< [\"surrender\"\
    , \"unicorn\", \"eel\"]\n```\n\n**d)** For the array `words`, filter all elements\
    \ containing `e` or `i` and `l` or `n` in any order.\n\n```\n[](#cb133-1)> let\
    \ words = ['surrender', 'unicorn', 'newer', 'door', 'empty', 'eel', 'pest']\n\
    [](#cb133-2)\n[](#cb133-3)// add your solution here\n[](#cb133-4)< [\"surrender\"\
    , \"unicorn\", \"newer\", \"eel\"]\n```\n\n**e)** Extract all hex character sequences,\
    \ with `0x` optional prefix. Match the characters case insensitively, and the\
    \ sequences shouldn't be surrounded by other word characters.\n\n```\n[](#cb134-1)>\
    \ let str1 = '128A foo 0xfe32 34 0xbar'\n[](#cb134-2)> let str2 = '0XDEADBEEF\
    \ place 0x0ff1ce bad'\n[](#cb134-3)\n[](#cb134-4)> const hex_seq =       // add\
    \ your solution here\n[](#cb134-5)\n[](#cb134-6)> str1.match(hex_seq)\n[](#cb134-7)<\
    \ [\"128A\", \"0xfe32\", \"34\"]\n[](#cb134-8)> str2.match(hex_seq)\n[](#cb134-9)<\
    \ [\"0XDEADBEEF\", \"0x0ff1ce\", \"bad\"]\n```\n\n**f)** Delete from `(` to the\
    \ next occurrence of `)` unless they contain parentheses characters in between.\n\
    \n```\n[](#cb135-1)> let str1 = 'def factorial()'\n[](#cb135-2)> let str2 = 'a/b(division)\
    \ + c%d(#modulo) - (e+(j/k-3)*4)'\n[](#cb135-3)> let str3 = 'Hi there(greeting).\
    \ Nice day(a(b)'\n[](#cb135-4)\n[](#cb135-5)> const remove_parentheses =     \
    \   // add your solution here\n[](#cb135-6)\n[](#cb135-7)> str1.replace(remove_parentheses,\
    \ '')\n[](#cb135-8)< \"def factorial\"\n[](#cb135-9)> str2.replace(remove_parentheses,\
    \ '')\n[](#cb135-10)< \"a/b + c%d - (e+*4)\"\n[](#cb135-11)> str3.replace(remove_parentheses,\
    \ '')\n[](#cb135-12)< \"Hi there. Nice day(a\"\n```\n\n**g)** For the array `words`,\
    \ filter all elements not starting with `e` or `p` or `u`.\n\n```\n[](#cb136-1)>\
    \ let words = ['surrender', 'unicorn', 'newer', 'door', 'empty', 'eel', 'pest']\n\
    [](#cb136-2)\n[](#cb136-3)// add your solution here\n[](#cb136-4)< [\"surrender\"\
    , \"newer\", \"door\"]\n```\n\n**h)** For the array `words`, filter all elements\
    \ not containing `u` or `w` or `ee` or `-`.\n\n```\n[](#cb137-1)> let words =\
    \ ['p-t', 'you', 'tea', 'heel', 'owe', 'new', 'reed', 'ear']\n[](#cb137-2)\n[](#cb137-3)//\
    \ add your solution here\n[](#cb137-4)< [\"tea\", \"ear\"]\n```\n\n**i)** The\
    \ given input strings contain fields separated by `,` and fields can be empty\
    \ too. Replace last three fields with `WHTSZ323`.\n\n```\n[](#cb138-1)> let row1\
    \ = '(2),kite,12,,D,C,,'\n[](#cb138-2)> let row2 = 'hi,bye,sun,moon'\n[](#cb138-3)\n\
    [](#cb138-4)> const pat1 =      // add your solution here\n[](#cb138-5)\n[](#cb138-6)//\
    \ add your solution here for row1\n[](#cb138-7)< \"(2),kite,12,,D,WHTSZ323\"\n\
    [](#cb138-8)// add your solution here for row2\n[](#cb138-9)< \"hi,WHTSZ323\"\n\
    ```\n\n**j)** Split the given strings based on consecutive sequence of digit or\
    \ whitespace characters.\n\n```\n[](#cb139-1)> let s1 = 'lion \\t Ink32onion Nice'\n\
    [](#cb139-2)> let s2 = '**1\\f2\\n3star\\t7 77\\r**'\n[](#cb139-3)\n[](#cb139-4)>\
    \ const pat2 =      // add your solution here\n[](#cb139-5)\n[](#cb139-6)> s1.split(pat2)\n\
    [](#cb139-7)< [\"lion\", \"Ink\", \"onion\", \"Nice\"]\n[](#cb139-8)> s2.split(pat2)\n\
    [](#cb139-9)< [\"**\", \"star\", \"**\"]\n```\n\n**k)** Delete all occurrences\
    \ of the sequence `<characters>` where `characters` is one or more non `>` characters\
    \ and cannot be empty.\n\n```\n[](#cb140-1)> let ip = 'a<apple> 1<> b<bye> 2<>\
    \ c<cat>'\n[](#cb140-2)\n[](#cb140-3)// add your solution here\n[](#cb140-4)<\
    \ \"a 1<> b 2<> c\"\n```\n\n**l)** `\\b[a-z](on|no)[a-z]\\b` is same as `\\b[a-z][on]{2}[a-z]\\\
    b`. True or False? Sample input lines shown below might help to understand the\
    \ differences, if any.\n\n```\n[](#cb141-1)> console.log('known\\nmood\\nknow\\\
    npony\\ninns')\n[](#cb141-2)  known\n[](#cb141-3)  mood\n[](#cb141-4)  know\n\
    [](#cb141-5)  pony\n[](#cb141-6)  inns\n```\n\n**m)** For the given array, filter\
    \ all elements containing any number sequence greater than `624`.\n\n```\n[](#cb142-1)>\
    \ let items = ['a1', 'b22', 'c333', 'd4444']\n[](#cb142-2)\n[](#cb142-3)// add\
    \ your solution here\n[](#cb142-4)< [\"b22\", \"d4444\"]\n```\n\n**n)** Convert\
    \ the given input string to two arrays as shown below.\n\n```\n[](#cb143-1)> let\
    \ ip = 'price_42 roast^\\t^-ice==cat\\neast'\n[](#cb143-2)\n[](#cb143-3)// add\
    \ your solution here\n[](#cb143-4)< [\"price_42\", \"roast^\\t^-ice==cat\\neast\"\
    ]\n```\nWait, the example text for `n` was slightly different in the prompt's\
    \ deconstructed version. Let me re-format based on the text provided in the block:\n\
    \n**o)** Filter all elements whose first non-whitespace character is not a `#`\
    \ character. Any element made up of only whitespace should be ignored.\n\n```\n\
    [](#cb144-1)> let items = ['    #comment', '\\t\\napple42', '#oops', 'sure', 'no#1',\
    \ '\\t']\n[](#cb144-2)\n[](#cb144-3)// add your solution here\n[](#cb144-4)< [\"\
    \\napple42\", \"sure\", \"no#1\"]\n```\n\n**p)** For the given string, surround\
    \ all whole words with `{}` except for whole words `par` and `cat`.\n\n```\n[](#cb145-1)>\
    \ let ip = 'part; cat {super} rest_42 par scatter'\n[](#cb145-2)\n[](#cb145-3)//\
    \ add your solution here\n[](#cb145-4)< \"{part}; cat {{super}} {rest_42} par\
    \ {scatter}\"\n```\n\nThis chapter will show how to reuse portion matched by capture\
    \ groups via backreferences within regexp definition and replacement section.\
    \ You'll also learn some special grouping syntax for cases where plain capture\
    \ groups isn't enough.\n\n## Backreferences\n\nFirst up, how to refer to capture\
    \ group portions directly in regexp definition and replacement section. You have\
    \ already seen how to refer to text captured by groups with `match` and `matchAll`\
    \ methods. You've also seen how to pass captured portions to a function in `replace`\
    \ method. More directly, you can use backreference `\\N` (within the regexp definition)\
    \ and `$N` (replacement section), where `N` is the capture group you want. What's\
    \ more, you can also apply quantifiers to backreferences when used in regexp definition.\
    \ All the various forms is listed below:\n\n*   in replacement section, use `$1`,\
    \ `$2`, etc to refer to the corresponding capture group\n\n*   in replacement\
    \ section, use `$&` to refer to entire matched portion\n\n    *   `` $` `` gives\
    \ string before the matched portion\n\n    *   `$'` gives string after the matched\
    \ portion\n\n*   within regexp definition, use `\\1`, `\\2`, etc to refer to the\
    \ corresponding capture group\n"
