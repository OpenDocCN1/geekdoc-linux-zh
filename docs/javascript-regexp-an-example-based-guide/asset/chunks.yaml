    # 本书的结构


    本书逐个介绍概念，章节末尾的练习仅需要到该章节为止介绍的功能。每个概念都配有多个示例，以涵盖不同的用法角度和边界情况。如前所述，请通过手动输入代码段来跟随图示操作。理解输入字符串的性质以及所使用的实际编程命令至关重要。书中有两个间插章节概述了有用的外部资源，并在最后一章中汇编了更多资源。


    *   RegExp 简介

    *   锚点

    *   选择与与分组

    *   转义元字符

    *   点元字符与量符

    *   间插：调试与可视化工具

