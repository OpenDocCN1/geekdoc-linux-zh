    # What''s so special about Regular Expressions?


    Regular Expressions is a versatile tool for text processing. You''ll find them
    included in the standard library of most programming languages that are used for
    scripting purposes. If not, you can usually find a third-party library. Syntax
    and features of regular expressions vary from language to language. JavaScript''s
    syntax is similar to that of Perl language, but there are significant feature
    differences.


    The [String object](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String)
    in JavaScript supports variety of methods to deal with text. So, what''s so special
    about regular expressions and why would you need it? For learning and understanding
    purposes, one can view regular expressions as a mini programming language in itself,
    specialized for text processing. Parts of a regular expression can be saved for
    future use, analogous to variables. There are ways to perform AND, OR, NOT conditionals.
    Operations similar to range and repetition and so on.


    Here''s some common use cases:


    * Sanitizing a string to ensure that it satisfies a known set of rules. For example,
    to check if a given string matches password rules.

    * Filtering or extracting portions on an abstract level like alphabets, numbers,
    punctuation and so on.

    * Qualified string replacement. For example, at the start or the end of a string,
    only whole words, based on surrounding text, etc.


    You are likely to be familiar with graphical search and replace tool, like the
    screenshot shown below from LibreOffice Writer. **Match case**, **Whole words
    only**, **Replace** and **Replace All** are some of the basic features supported
    by regular expressions.


    ![find and replace](media/file0.png)


    Another real world use case is password validation. The screenshot below is from
    GitHub sign up page. Performing multiple checks like **string length** and the
    **type of characters allowed** is another core feature of regular expressions.


    ![password check](media/file1.png)


    Here''s some articles on regular expressions to know about its history and the
    type of problems it is suited for.


    * [The true power of regular expressions](https://nikic.github.io/2012/06/15/The-true-power-of-regular-expressions.html)
    — it also includes a nice explanation of what *regular* means in this context

    * [softwareengineering: Is it a must for every programmer to learn regular expressions?](https://softwareengineering.stackexchange.com/questions/133968/is-it-a-must-for-every-programmer-to-learn-regular-expressions)

    * [softwareengineering: When you should NOT use Regular Expressions?](https://softwareengineering.stackexchange.com/questions/113237/when-you-should-not-use-regular-expressions)

    * [codinghorror: Now You Have Two Problems](https://blog.codinghorror.com/regular-expressions-now-you-have-two-problems/)

