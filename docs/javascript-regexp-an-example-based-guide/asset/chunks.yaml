    | `s.match(/pat/g)` | 仅返回匹配部分，不包含属性 |

    | | 捕获组不影响输出 |

    | | 如果正则失败，`match` 返回 `null` |

    | `s.matchAll(/pat/g)` | 返回一个包含详细信息的迭代器 |

    | | 用于每个匹配部分及其属性 |

    | | 使用 `[...]` 或 `Array.from` 转换为数组 |

    | | `Array.from` 同时也允许映射函数 |

    | `s.replace(/pat/, func)` | 你可以使用函数来提供替换字符串 |

    | | 每个匹配部分的详细信息将作为参数传递 |

    | | 同样，可以使用字典进行替换 |

    | `s.search(/pat/)` | 如果正则成功，返回第一个匹配的起始位置 |

    | | 如果正则失败，则返回 `-1` |


    本章介绍了 `match` 和 `matchAll` 方法，它们允许你处理输入字符串的各种匹配部分。如果你只需要第一个匹配的起始位置，`search` 方法会非常好用。`replace`
    方法允许你使用函数作为替换，这有助于在将匹配部分作为替换字符串使用之前对其进行处理。你还可以使用字典根据匹配部分作为键来提供替换字符串。你已经学习了捕获组，在后续章节中将看到更多分组的用法。


