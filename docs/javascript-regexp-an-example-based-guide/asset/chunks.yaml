    using single character alternations inside a grouping, but without the additional
    effects of a capture group. In addition, character classes have their own versions
    of metacharacters and provide special predefined sets for common use cases. Quantifiers
    are applicable to character classes as well.


    ```

    [](#cb119-1)// same as: /cot|cut/ or /c(o|u)t/

    [](#cb119-2)> [''cute'', ''cat'', ''cot'', ''coat'', ''cost''].filter(w => /c[ou]t/.test(w))

    [](#cb119-3)< ["cute", "cot"]

    [](#cb119-4)

    [](#cb119-5)// same as: /(a|e|o)+t/g

    [](#cb119-6)> ''meeting cute boat site foot''.replace(/[aeo]+t/g, ''X'')

    [](#cb119-7)< "mXing cute bX site fX"

    [](#cb119-8)

    [](#cb119-9)> ''Sample123string42with777numbers''.match(/[0123456789]+/g)

    [](#cb119-10)< ["123", "42", "777"]

    ```


    ## Range of characters


    Character classes have their own metacharacters to help define the sets succinctly.
    Metacharacters outside of character classes like `^`, `$`, `()` etc either don''t
    have special meaning or have completely different one inside the character classes.
    First up, the `-` metacharacter that helps to define a range of characters instead
    of having to specify them all individually.


    ```

    [](#cb120-1)// all digits

    [](#cb120-2)> ''Sample123string42with777numbers''.match(/[0-9]+/g)

    [](#cb120-3)< ["123", "42", "777"]

    [](#cb120-4)

    [](#cb120-5)// whole words made up of lowercase alphabets and digits only

    [](#cb120-6)> ''coat Bin food tar12 best''.match(/\b[a-z0-9]+\b/g)

    [](#cb120-7)< ["coat", "food", "tar12", "best"]

    [](#cb120-8)

    [](#cb120-9)// whole words made up of lowercase alphabets, but starting with ''p''
    to ''z''

    [](#cb120-10)> ''coat tin food put stoop best''.match(/\b[p-z][a-z]*\b/g)

    [](#cb120-11)< ["tin", "put", "stoop"]

    [](#cb120-12)

    [](#cb120-13)// whole words made up of only ''a'' to ''f'' and ''p'' to ''t''
    lowercase alphabets

    [](#cb120-14)> ''coat tin food put stoop best''.match(/\b[a-fp-t]+\b/g)

    [](#cb120-15)< ["best"]

    ```


    ## Negating character sets


    The `^` metacharacter has to specified as the first character of the character
    class. It negates the set, so all characters other than those specified will be
    matched.


    ```

    [](#cb121-1)// all non-digits

    [](#cb121-2)> ''Sample123string42with777numbers''.match(/[^0-9]+/g)

    [](#cb121-3)< ["Sample", "string", "with", "numbers"]

    [](#cb121-4)

    [](#cb121-5)// deleting characters from start of string based on a delimiter

    [](#cb121-6)> ''foo=42; baz=123''.replace(/^[^=]+/, '''')

    [](#cb121-7)< "=42; baz=123"

    [](#cb121-8)> ''foo:123:bar:baz''.replace(/^([^:]+:){2}/, '''')

    [](#cb121-9)< "bar:baz"

    [](#cb121-10)

    [](#cb121-11)// deleting characters at end of string based on a delimiter

    [](#cb121-12)> ''foo=42; baz=123''.replace(/=[^=]+$/, '''')

    [](#cb121-13)< "foo=42; baz"

    ```


    As highlighted earlier, handle negative logic with care, as you might end up matching
    more than you wanted. Sometimes, it is easier to use positive character class
    and inverting the test condition instead of using negated character class.


    ```

    [](#cb122-1)> let words = [''tryst'', ''fun'', ''glyph'', ''pity'', ''why'']

    [](#cb122-2)

    [](#cb122-3)// elements not containing vowel characters

    [](#cb122-4)> words.filter(w => /^[^aeiou]+$/.test(w))

    [](#cb122-5)< ["tryst", "glyph", "why"]

    [](#cb122-6)

    [](#cb122-7)// easier to write and maintain, note the use of ''!'' operator

    [](#cb122-8)// but this''ll match empty strings too unlike the previous solution

    [](#cb122-9)> words.filter(w => !/[aeiou]/.test(w))

    [](#cb122-10)< ["tryst", "glyph", "why"]

    ```


    ## Matching metacharacters literally


