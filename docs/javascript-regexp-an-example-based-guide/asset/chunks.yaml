    使用这些模式有多种方法，详情请参阅 [CommonRegexJS: Usage](https://github.com/talyssonoc/CommonRegexJS#usage)。你也可以浏览
    [commonregex.js](https://github.com/talyssonoc/CommonRegexJS/blob/master/lib/commonregex.js)
