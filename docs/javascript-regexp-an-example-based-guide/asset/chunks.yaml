    \ let items = ['h0000432ab', 'car00625', '42_624 0512', '3.14 96 2 foo1234baz']\n\
    [](#cb142-2)\n[](#cb142-3)// add your solution here\n[](#cb142-4)< [\"car00625\"\
    , \"3.14 96 2 foo1234baz\"]\n```\n\n**n)** Convert the given input string to two\
    \ different arrays as shown below.\n\n```\n[](#cb143-1)> let ip = 'price_42 roast^\\\
    t\\n^-ice==cat\\neast'\n[](#cb143-2)\n[](#cb143-3)// add your solution here\n\
    [](#cb143-4)< [\"price_42\", \"roast\", \"ice\", \"cat\", \"east\"]\n[](#cb143-5)\n\
    [](#cb143-6)// add your solution here\n[](#cb143-7)< [\"price_42\", \" \", \"\
    roast\", \"^ \\n^-\", \"ice\", \"==\", \"cat\", \"\\n\", \"east\"]\n```\n\n**o)**\
    \ Filter all elements whose first non-whitespace character is not a `#` character.\
    \ Any element made up of only whitespace characters should be ignored as well.\n\
    \n```\n[](#cb144-1)> let items = ['    #comment', '\\t\\napple #42', '#oops',\
    \ 'sure', 'no#1', '\\t\\r\\f']\n[](#cb144-2)\n[](#cb144-3)// add your solution\
    \ here\n[](#cb144-4)< [\" \\napple #42\", \"sure\", \"no#1\"]\n```\n\n**p)** For\
    \ the given string, surround all whole words with `{}` except for whole words\
    \ `par` and `cat`.\n\n```\n[](#cb145-1)> let ip = 'part; cat {super} rest_42 par\
    \ scatter'\n[](#cb145-2)\n[](#cb145-3)// add your solution here\n[](#cb145-4)<\
    \ \"{part}; cat {{super}} {rest_42} par {scatter}\"\n```\n\n# Groupings and backreferences\n\
    \nThis chapter will show how to reuse portion matched by capture groups via backreferences\
    \ within regexp definition and replacement section. You'll also learn some special\
    \ grouping syntax for cases where plain capture groups isn't enough.\n\n## Backreferences\n\
    \nFirst up, how to refer to capture group portions directly in regexp definition\
    \ and replacement section. You have already seen how to refer to text captured\
    \ by groups with `match` and `matchAll` methods. You've also seen how to pass\
    \ captured portions to a function in `replace` method. More directly, you can\
    \ use backreference `\\N` (within the regexp definition) and `$N` (replacement\
    \ section), where `N` is the capture group you want. What's more, you can also\
    \ apply quantifiers to backreferences when used in regexp definition. All the\
    \ various forms is listed below:\n\n*   in replacement section, use `$1`, `$2`,\
    \ etc to refer to the corresponding capture group\n\n*   in replacement section,\
    \ use `$&` to refer to entire matched portion\n\n    *   `` $` `` gives string\
    \ before the matched portion\n\n    *   `$'` gives string after the matched portion\n\
    \n*   within regexp definition, use `\\1`, `\\2`, etc to refer to the corresponding\
    \ capture group"
