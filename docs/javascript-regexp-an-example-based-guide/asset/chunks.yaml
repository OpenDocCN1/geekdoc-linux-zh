    # Unicode


    So far in the book, all examples were meant for strings made up of ASCII characters
    only. A few years back that would''ve been sufficient for most of the use cases.
    These days it would be rare to encounter ASCII only project. This chapter will
    briefly discuss unicode matching.


    ## Unicode character sets and u flag


    Similar to escape sequence character sets, the `\p{}` construct offers various
    predefined sets to work with unicode. For negated sets, use `\P{}`. You''ll also
    need to set the `u` flag.


    ```

    [](#cb203-1)// extract all consecutive letters

    [](#cb203-2)> ''fox:αλεπού,eagle:αετός''.match(/\p{L}+/gu)

    [](#cb203-3)< ["fox", "αλεπού", "eagle", "αετός"]

    [](#cb203-4)

    [](#cb203-5)// delete all characters other than letters

    [](#cb203-6)> ''φοο12,βτ_4,foo''.replace(/\P{L}+/gu, '''')

    [](#cb203-7)< "φοοβτfoo"

    [](#cb203-8)

    [](#cb203-9)// extract whole words not surrounded by punctuation marks

    [](#cb203-10)> ''tie. ink east;''.match(/(?<!\p{P})\b\w+\b(?!\p{P})/gu)

    [](#cb203-11)< ["ink"]

    ```


    > ![info](media/file2.svg) See [MDN: Unicode property escapes](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Regular_Expressions/Unicode_Property_Escapes)
    for more details and list of `\p{}` sets. See also [regular-expressions: unicode](https://www.regular-expressions.info/unicode.html)
    for an overview of challenges with unicode matching.


    ## Codepoints'
