    [](#cb45-1)> let items = [''lovely'', ''1\ndentist'', ''2 lonely'', ''eden'',
    ''fly\n'', ''dent'']

    [](#cb45-2)

    [](#cb45-3)> items.filter()        // add your solution here

    [](#cb45-4)< ["lovely", "2 lonely", "dent"]

    ```


    **b)** For the given array, filter all elements having a line starting with `den`
    or ending with `ly`


