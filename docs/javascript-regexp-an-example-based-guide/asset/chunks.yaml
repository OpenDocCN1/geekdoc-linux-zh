    \ flXe fX\"\n[](#cb67-4)\n[](#cb67-5)// same as: /\\bpar(t|)\\b/g\n[](#cb67-6)>\
    \ 'par spare part party'.replace(/\\bpart?\\b/g, 'X')\n[](#cb67-7)< \"X spare\
    \ X party\"\n[](#cb67-8)\n[](#cb67-9)// same as: /\\b(re.d|red)\\b/\n[](#cb67-10)>\
