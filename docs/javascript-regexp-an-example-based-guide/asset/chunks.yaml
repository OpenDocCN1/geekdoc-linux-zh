  trans: "\n本章重点介绍了如何创建自定义占位符以匹配有限的字符集。分组和字符类可以被视为两个层级的抽象。一方面，你可以在 `[]` 内部使用字符集；另一方面，你可以在\
    \ `()` 内部包含多个交替的分组，其中也包括字符类。由于锚定符和量词可以应用于这两种抽象，因此你可以开始看到正则表达式是如何被视为一种微编程语言的。在接下来的章节中，你甚至会看到如何在某些场景下实现类似于反向字符类的分组反向（否定）。\n\
    \n## 练习题\n\n**a)** 对于数组 `items`，过滤出所有以 `hand` 开头并以 `s`、`y` 或 `le` 结尾的元素。中间不能有其他字符，例如，`hands`\
    \ 应该匹配，但 `hand-has` 不匹配。\n\n```\n[](#cb130-1)> let items = ['-handy', 'hand',\
    \ 'handy', 'handled', 'hands', 'handle']\n[](#cb130-2)\n[](#cb130-3)//在此处添加你的解决方案\n\
    [](#cb130-4)< [\"handy\", \"hands\", \"handle\"]\n```\n\n**b)** 将所有完整的单词 `reed`、`read`\
    \ 或 `red` 替换为 `X`。\n\n```\n[](#cb131-1)> let ip = 'redo red credible :read: rod\
    \ reed bred'\n[](#cb131-2)\n[](#cb131-3)//在此处添加你的解决方案\n[](#cb131-4)< \"redo X\
    \ credible :X: rod X bred\"\n```\n\n**c)** 对于数组 `words`，过滤出所有包含 `e` 或 `i` 且后紧跟\
    \ `l` 或 `n` 的元素。请注意应该遵循提到的顺序。\n\n```\n[](#cb132-1)> let words = ['surrender',\
    \ 'unicorn', 'newer', 'door', 'empty', 'eel', 'pest']\n[](#cb132-2)\n[](#cb132-3)//在此处添加你的解决方案\n\
    [](#cb132-4)< [\"surrender\", \"unicorn\", \"eel\"]\n```\n\n**d)** 对于数组 `words`，过滤出所有以任意顺序包含\
    \ `e` 或 `i` 以及 `l` 或 `n` 的元素。\n\n```\n[](#cb133-1)> let words = ['surrender',\
    \ 'unicorn', 'newer', 'door', 'empty', 'eel', 'pest']\n[](#cb133-2)\n[](#cb133-3)//在此处添加你的解决方案\n\
    [](#cb133-4)< [\"surrender\", \"unicorn\", \"newer\", \"eel\"]\n```\n\n**e)**\
    \ 提取所有十六进制字符序列，带有可选的 `0x` 前缀。匹配时不区分大小写，且序列不应被其他单词字符围绕。\n\n```\n[](#cb134-1)> let\
    \ str1 = '128A foo 0xfe32 34 0xbar'\n[](#cb134-2)> let str2 = '0XDEADBEEF place\
    \ 0x0ff1ce bad'\n[](#cb134-3)\n[](#cb134-4)> const hex_seq =       //在此处添加你的解决方案\n\
    [](#cb134-5)\n[](#cb134-6)> str1.match(hex_seq)\n[](#cb134-7)< [\"128A\", \"0xfe32\"\
    , \"34\"]\n[](#cb134-8)> str2.match(hex_seq)\n[](#cb134-9)< [\"0XDEADBEEF\", \"\
    0x0ff1ce\", \"bad\"]\n```\n\n**f)** 删除从 `(` 到下一个 `)` 的内容，除非它们之间包含了括号字符。\n\n```\n\
    [](#cb135-1)> let str1 = 'def factorial()'\n[](#cb135-2)> let str2 = 'a/b(division)\
    \ + c%d(#modulo) - (e+(j/k-3)*4)'\n[](#cb135-3)> let str3 = 'Hi there(greeting).\
    \ Nice day(a(b)'\n[](#cb135-4)\n[](#cb135-5)> const remove_parentheses =     \
    \   //在此处添加你的解决方案\n[](#cb135-6)\n[](#cb135-7)> str1.replace(remove_parentheses,\
    \ '')\n[](#cb135-8)< \"def factorial\"\n[](#cb135-9)> str2.replace(remove_parentheses,\
    \ '')\n[](#cb135-10)< \"a/b + c%d - (e+*4)\"\n[](#cb135-11)> str3.replace(remove_parentheses,\
    \ '')\n[](#cb135-12)< \"Hi there. Nice day(a\"\n```\n\n**g)** 对于数组 `words`，过滤出所有不以\
    \ `e`、`p` 或 `u` 开头的元素。\n\n```\n[](#cb136-1)> let words = ['surrender', 'unicorn',\
    \ 'newer', 'door', 'empty', 'eel', 'pest']\n[](#cb136-2)\n[](#cb136-3)//在此处添加你的解决方案\n\
    [](#cb136-4)< [\"surrender\", \"newer\", \"door\"]\n```\n\n**h)** 对于数组 `words`，过滤出所有不包含\
    \ `u`、`w`、`ee` 或 `-` 的元素。\n\n```\n[](#cb137-1)> let words = ['p-t', 'you', 'tea',\
    \ 'heel', 'owe', 'new', 'reed', 'ear']\n[](#cb137-2)\n[](#cb137-3)//在此处添加你的解决方案\n\
    [](#cb137-4)< [\"tea\", \"ear\"]\n```\n\n**i)** 给定的输入字符串包含由 `,` 分隔的字段，且字段可以为空。将最后三个字段替换为\
    \ `WHTSZ323`。\n\n```\n[](#cb138-1)> let row1 = '(2),kite,12,,D,C,,'\n[](#cb138-2)>\
    \ let row2 = 'hi,bye,sun,moon'\n[](#cb138-3)\n[](#cb138-4)> const pat1 =     \
    \ //在此处添加你的解决方案\n[](#cb138-5)\n[](#cb138-6)//为 row1 在处添加你的解决方案\n[](#cb138-7)<\
    \ \"(2),kite,12,,D,WHTSZ323\"\n[](#cb138-8)//为 row2 在此处添加你的解决方案\n[](#cb138-9)<\
    \ \"hi,WHTSZ323\"\n```\n\n**j)** 根据连续的数字或空白字符序列对给定字符串进行分割。\n\n```\n[](#cb139-1)>\
    \ let s1 = 'lion \\t Ink32onion Nice'\n[](#cb139-2)> let s2 = '**1\\f2\\n3star\\\
    t7 77\\r**'\n[](#cb139-3)\n[](#cb139-4)> const pat2 =      //在此处添加你的解决方案\n[](#cb139-5)\n\
    [](#cb139-6)> s1.split(pat2)\n[](#cb139-7)< [\"lion\", \"Ink\", \"onion\", \"\
    Nice\"]\n[](#cb139-8)> s2.split(pat2)\n[](#cb139-9)< [\"**\", \"star\", \"**\"\
    ]\n```\n\n**k)** 删除所有 `<characters>` 序列，其中 `characters` 是一个或多个非 `>` 字符且不能为空。\n\
    \n```\n[](#cb140-1)> let ip = 'a<apple> 1<> b<bye> 2<> c<cat>'\n[](#cb140-2)\n\
    [](#cb140-3)//在此处添加你的解决方案\n[](#cb140-4)< \"a 1<> b 2<> c\"\n```\n\n**l)** `\\\
    ba-z[a-z]\\b` 等于 `\\b[a-z][on]{2}[a-z]\\b`。正确或错误？下方显示的示例输入行可能帮助你理解是否存在任何差异。\n\n\
    ```\n[](#cb141-1)> console.log('known\\nmood\\nknow\\npony\\ninns')\n[](#cb141-2)\
    \  known\n[](#cb141-3)  mood\n[](#cb141-4)  know\n[](#cb141-5)  pony\n[](#cb141-6)\
    \  inns\n```\n\n**m)** 对于给定数组，过滤出所有包含大于 `624` 的数字序列的元素。\n\n```\n[](#cb142-1)>\
    \ let items = ['a1', 'b22', 'c33', 'd444']\n[](#cb142-2)\n[](#cb142-3)//在此处添加你的解决方案\n\
    [](#cb142-4)< [\"b22\", \"d444\"]\n```\n\n**n)** 将给定字符串转换为下方的数组。\n\n```\n[](#cb143-1)>\
    \ let ip = 'price_42 roast^\\tice==ast'\n[](#cb143-2)\n[](#cb143-3)//在此处添加你的解决方案\n\
    [](#cb143-4)< [\"price_42\", \"roast^\\tice==ast\"]\n```\n\n**o)** 过滤所有第一个空白字符不是\
    \ `#` 的元素。仅由空白组成的元素应被忽略。\n\n```\n[](#cb144-1)> let items = ['    #comment', '\\\
    t\\napple42', '#oops', 'sure', 'no#1', '\\t']\n[](#cb144-2)\n[](#cb144-3)//在此处添加你的解决方案\n\
    [](#cb144-4)< [\"\\napple42\", \"sure\", \"no#1\"]\n```\n\n**p)** 对于给定字符串，为所有单词加上\
    \ `{}`，但 `par` 和 `cat` 除外。\n\n```\n[](#cb145-1)> let ip = 'part; cat {super} rest_42\
    \ par scatter'\n[](#cb145-2)\n[](#cb145-3)//在此处添加你的解决方案\n[](#cb145-4)< (wait,\
    \ 示例输出未完成)\n```\n\n本章将介绍如何在正则定义和替换部分中通过反向引用来重用分组捕获的部分。你还将学习在普通捕获组不足时的某些特殊分组语法。\n\
    \n## 反向引用\n\n首先，如何在正则定义和替换部分中直接引用捕获组。你已经学习过如何使用 `match` 和 `matchAll` 方法引用被捕获的文本。你也学习过如何在\
    \ `replace` 方法中将捕获的部分传递给函数。更直接地，你可以使用反向引用 `\\N`（正则定义内部）和 `$N`（替换部分），其中 `N` 是你想要的捕获组。此外，在正则定义中使用时，还可以对反向引用应用量词。所有的形式列举如下：\n\
    \n*   在替换部分，使用 `$1`、 `$2` 等引用对应的捕获组\n\n*   在替换部分，使用 `$&` 引用整个匹配部分\n\n    *   ``\
    \ $` `` 获取匹配部分之前的字符串\n\n    *   `$'` 获取匹配部分之后的字符串\n\n*   在正则定义内部，使用 `\\1`、`\\\
    2` 等引用对应的捕获组\n"
- fmt: "\n```javascript\n// remove square brackets that surround digit characters\n\
    > '[52] apples [and] [31] mangoes'.replace(/\\[(\\d+)\\]/g, '$1')\n< \"52 apples\
    \ [and] 31 mangoes\"\n\n// replace __ with _ and delete _ if it is alone\n> '_foo_\
    \ __123__ _baz_'.replace(/(_)?_/g, '$1')\n< \"foo _123_ baz\"\n\n// swap words\
    \ that are separated by a comma\n> 'good,bad 42,24'.replace(/(\\w+),(\\w+)/g,\
    \ '$2,$1')\n< \"bad,good 24,42\"\n```\n\nHere's some examples for using backreferences\
    \ available by default without needing capture groups.\n\n```javascript\n// add\
    \ something around the entire matched portion\n> '52 apples and 31 mangoes'.replace(/\\\
    d+/g, '($&)')\n< \"(52) apples and (31) mangoes\"\n> 'Hello world'.replace(/.*/,\
    \ 'Hi. $&. Have a nice day')\n< \"Hi. Hello world. Have a nice day\"\n\n// duplicate\
    \ first field and add it as last field\n> 'fork,42,nice,3.14'.replace(/,.+/, '$&,$`')\n\
    < \"fork,42,nice,3.14,fork\"\n```\n\nAnd here's some examples for using backreferences\
    \ within regexp definition.\n\n```javascript\n// elements that have at least one\
    \ consecutive repeated word character\nlet words = ['moon', 'mono', 'excellent',\
    \ 'poll']\n> words.filter(w => /(\\w)\\1/.test(w))\n< [\"moon\", \"excellent\"\
    , \"poll\"]\n\n// remove any number of consecutive duplicate words separated by\
    \ space\n// note the use of quantifier on backreference\n// use \\W+ instead of\
    \ space to cover cases like 'a;a<-;a'\n> 'aa a a a 42 f_1 f_1 f_13.14'.replace(/\\\
    b(\\w+)(  \\1)+\\b/g, '$1')\n< \"aa a 42 f_1 f_13.14\"\n```\n\n## Backreference\
    \ oddities\n\nSince `$` is special in replacement section, there's an issue to\
    \ place it literally if followed by numbers. Usually, escaping is used for such\
    \ purposes, but here you need to use `$$`.\n\n```javascript\n// no capture group\
    \ used, so '$1' is inserted literally\n> 'cat'.replace(/a/, '{$1}')\n< \"c{$1}t\"\
    \n// capture group used, '\\$1' is same as '$1' here\n> 'cat'.replace(/(a)/, '{\\\
    $1}')\n< \"c{a}t\"\n// use '$$' to avoid backreference and insert '$' literally\n\
    > 'cat'.replace(/(a)/, '{$$1}')\n< \"c{$1}t\"\n```\n\nAnother issue is how to\
    \ avoid ambiguity when you have normal digits immediately following a backreference?\
    \ It'll depend on how many backreferences are present in the pattern and whether\
    \ you need to avoid ambiguity in regexp definition or replacement section. For\
    \ example, if there are less than 10 groups, then something like `$12` will refer\
    \ to first capture group and `2` as a character. If there are no capture groups,\
    \ then something like `$5` will get inserted literally as `$` and `5`.\n\n```javascript\n\
    // $15 here will backreference 1st group and use 5 as a character\n> '[52] apples\
    \ and [31] mangoes'.replace(/\\[(\\d+)\\]/g, '($15)')\n< \"(525) apples and (315)\
    \ mangoes\"\n\n// $3 will be inserted literally since there is only one capture\
    \ group\n> '[52] apples and [31] mangoes'.replace(/\\[(\\d+)\\]/g, '$3')\n< \"\
    $3 apples and $3 mangoes\"\n\n// $1 will be inserted literally since there are\
    \ no capture groups\n> '[52] apples and [31] mangoes'.replace(/\\[\\d+\\]/g, '$1')\n\
    < \"$1 apples and $1 mangoes\"\n```\n\nOn the other hand, if you have more than\
    \ `9` but less than `100` groups, then there would be issue if you want to refer\
    \ to single group followed by digit. The workaround is to prefix `0` such that\
    \ number of digits after `$` equals the number of digits required for highest\
    \ capture group. So, if you have more than `9` but less than `100` groups, `$05`\
    \ will refer to `5th` capture group and any digit after that will be treated literally.\n\
    \n```javascript\n// for illustration purposes, 12 capture groups have been defined\n\
    // if you want to reference 2-digit group, there's no issue\n> 'abcdefghijklmn'.replace(/(.)(.)(.)(.)(.)(.)(.)(.)(.)(.)/,\
    \ '$11') // wait, this logic is not what I meant to show.\n// prefix '0' so that\
    \ '$01' becomes the reference and '1' becomes character\n> 'abcdefghijklmn'.replace(/(.)(.)(.)(.)(.)(.)(.)(.)(.)(.)/,\
    \ '$01') // \n```\n\nThe workaround is simpler in regexp definition. The `0` prefix\
    \ trick doesn't work, but using ASCII code with `\\xh` works. For example, `\\\
    11` will refer to first capture group followed by `1` as a character.\n\n```javascript\n\
    > 'abcdefghijklna1d'.replace(/(.)(.)(.)(.)(.)(.)(.)(.)(.)(.).).*\\11/, 'X')\n\
    < \"Xd\"\n```\n\n## Non-capturing groups\n\nGrouping has many uses like applying\
    \ quantifier on a regexp portion, creating terse regexp by factoring common portions\
    \ and so on. It also affects the output of `split` method as seen in split with\
    \ capture groups. Unlike similar methods in other languages, `match` method with\
    \ `g` flag isn't affected by capture groups and returns entire matched portions.\n\
    \n```javascript\n// split method without capture group\n> 'Sample123string42with777numbers'.split(/\\\
    d+/)\n< [\"Sample\", \"string\", \"with\", \"numbers\"]\n// split method with\
    \ capture group\n> 'Sample123string42with777numbers'.split(/(\\d+)/)\n< [\"Sample\"\
    , \"123\", \"string\", \"42\", \"with\", \"777\", \"numbers\"]\n\n// match method\
    \ example with 'g' flag and capture groups\n> 'effort flee oddball rat tool'.match(/\\\
    b\\w*(\\w)\\1\\w*\\b/g)\n< [\"effort\", \"flee\", \"oddball\", \"tool\"]\n// here's\
    \ another example\n> 'hi 123123123 bye 456123456'.match(/(123)+/g)\n< [\"123123123\"\
    , \"123\"]\n```\n\nWhen backreferencing is not required, you can use a non-capturing\
    \ group to avoid behavior change of `split` method. It also helps to avoid keeping\
    \ a of capture group numbers when that particular group is not needed for backreferencing.\
    \ The syntax is `(?:pat)` to define a non-capturing group, where `pat` is an abbreviation\
    \ for a portion of regular expression pattern. More such special groups starting\
    \ with `(?` syntax will be discussed later on.\n\n```javascript\n// here, grouping\
    \ is needed to take out common portion and apply quantifier\n// but using capture\
    \ group will not give expected output\n> '123hand42handy777ful500'.split(/hand(y|ful)?/)\n\
    < [\"123\", undefined, \"42\", \"y\", \"777\", \"ful\", \"500\"]\n// non-capturing\
    \ group to the rescue\n> '123hand42handy777ful500'.split(/hand(?:y|ful)?/)\n<\
    \ [\"123\", \"42\", \"777\", \"500\"]\n\n// with normal grouping, need to keep\
    \ track of all the groups\n> '1,2,3,4,5,6,7'.replace(/^(([^,]+,){3})([^,]+)/,\
    \ '$1($3)')\n< \"1,2,3,(4),5,6,7\"\n// using non-capturing groups, only relevant\
    \ groups have to be tracked\n> '1,2,3,4,5,6,7'.replace(/^((?:[^,]+,){3})([^,]+)/,\
    \ '$1($2)')\n< \"1,2,3,(4),5,6,7\"\n```\n\nReferring to text matched by a capture\
    \ group with a quantifier will give only the last match, not entire match. Use\
    \ a capture group around the grouping and quantifier together to get the entire\
    \ matching portion.\n"
