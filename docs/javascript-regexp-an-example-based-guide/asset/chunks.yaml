    # Alternation and Grouping


    Many a times, you want to check if the input string matches multiple patterns.
    For example, whether a car color is `green` or `blue` or `red`. In programming
    terms, you need to perform OR conditional. This chapter will show how to use alternation
    for such cases. These patterns can also have some common elements between them,
    in which case grouping helps to form terser regexps. This chapter will also discuss
    the precedence rules used to determine which alternation wins.


    ## OR conditional


    In a conditional expression, you can use the logical operators to combine multiple
    conditions. With regular expressions, the `|` metacharacter is similar to logical
    OR. The regexp will match if any of the expression separated by `|` is satisfied.
    Each of these alternations is a full regexp. For example, anchors are specific
    to that particular alternation.


    ```

    [](#cb40-1)// match either ''cat'' or ''dog''

    [](#cb40-2)> const pets = /cat|dog/

    [](#cb40-3)> pets.test(''I like cats'')

    [](#cb40-4)< true

    [](#cb40-5)> pets.test(''I like dogs'')

    [](#cb40-6)< true

    [](#cb40-7)> pets.test(''I like parrots'')

    [](#cb40-8)< false

    [](#cb40-9)// replace either ''cat'' at start of string or ''cat'' at end

    [](#cb40-11)> ''catacat scat''.replace(/^cat|cat\b/g, ''X'')

    [](#cb40-12)< "Xap concatenate X"

    [](#cb40-14)// replace either ''cat'' or ''dog'' or ''fox'' with ''mammal''

    [](#cb40-15)> ''cat dog parrot''.replace(/cat|dog|fox/g, ''mammal'')

    [](#cb40-16)< "mammal mammal mammal"

    ```


    You might infer from the above examples there can be situations where many alternations
    are required. See dynamically building alternation for details.


    ## Grouping


    Often, there are common things among the regexp. It could be common characters
    or regexp qualifiers like anchors. In such cases, you can group them using a pair
    of metacharacters. Similar to `a(b+c)d = abd` in maths, you get `a(b|c)d = abd`
    in regular expressions.


    ```

    [](#cb41-1)// without grouping

    [](#cb41-2)> ''red reform arrest''.replace(/reform|rest/g, ''X'')

    [](#cb41-3)< "red X arX"

    [](#cb41-4)// with grouping

    [](#cb41-5)> ''red reform arrest''.replace(/reform|st)/g, ''X'')

    [](#cb41-6)< "red X arX"

    [](#cb41-8)// without grouping

    [](#cb41-9)> ''par spare party''.replace(/\bpar\b|\part\b/g, ''X'')

    [](#cb41-10)< "X spare party"

    [](#cb41-11)// taking out anchors

    [](#cb41-12)> ''par spare party''.replace(/\b(par|part)\b/g, ''X'')

    [](#cb41-13)< "X spare party"

    [](#cb41-14)// taking out common characters as well

    [](#cb41-16)> ''par spare party''.replace(/\bpar(|t)\b/g, ''X'')

    [](#cb41-17)< "X spare party"

    ```


    There is plenty more features to grouping than just forming terser regexp. It
    will be discussed as they become relevant in coming chapters.


    ## Precedence rules


    There is some tricky situations using alternation. If it is used for testing a
    match to get `true/false` against a string input, there is no ambiguity. However,
    for other things like string replacement, it depends on a few factors. Say, you
    want to replace either `are` or `spared` — which one should get precedence? The
    bigger word `spared` or the substring `are` inside it or based on something else?


    The regexp alternative which matches earliest in the input string gets precedence.


    ```

    [](#cb42-1)> let words = ''lion elephant are rope not''

    [](#cb2-3)// starting index of ''on'' < index of ''ant'' for given string input

    [](#cb42-4)// so ''on'' will be replaced irrespective of order of alternations

    [](#cb42-5)> words.replace(/on|ant/, ''X'')

    [](#cb42-6)< "liX elephant are rope not"

    [](#cb42-7)> words.replace(/ant|on/, ''X'')

    [](#cb42-8)< "liX elephant are rope not"

    ```


    So, what happens if two or more alternatives match on same index? The precedence
    is then left to right in the order of declaration.


    ```

    [](#cb43-1)> let mood = ''best years''

    [](#cb43-3)// starting index for ''year'' and ''years'' will always be same

    [](#cb43-4)// so, which one gets replaced depends on the order of alternations

    [](#cb43-5)> mood.replace(/year|years/, ''X'')

    [](#cb43-6)< "best Xs"

    [](#cb43-7)> mood.replace(/years|year/, ''X'')

    [](#cb43-8)< "best X"

    ```


    Another example with `replace` to drive home the issue.


    ```

    [](#cb44-1)> let sample = ''ear xerox at mare part learn eye''

    [](#cb44-3)// this is going to be same as: replace(/ar/g, ''X'')

    [](#cb44-4)> sample.replace(/ar|are|art/g, ''X'')

    [](#cb44-5)< "eX xerox at mXe pXt leXn eye"

    [](#cb44-6)// this is going to be same as: replace(/ar/g, ''X'')

    [](#cb44-7)> sample.replace(/are|ar|art/g, ''X'')

    [](#cb44-8)< "eX xerox at mX pXt leXn eye"

    [](#cb44-9)// phew, finally this one works as expected

    [](#cb44-10)> sample.replace(/are|art|ar/g, ''X'')

    [](#cb44-11)< "eX xerox at mX pX leXn eye"

    ```


    ## Cheatsheet and Summary


    | Note | Description |


    | --- | --- |


    | `pat1&#124|pat2&#124|pat3` | multiple regexp combined as OR conditional |


    |  | each alternative can have independent anchors |


    | `()` | group pattern(s) |


    | `a(b&#124;c)d` | same as `abd&#124;acd` |

    ```

