    Another character to keep track for escaping is the delimiter used to define the
    `RegExp` literal. Or depending upon the pattern, you can use the `new RegExp`
    constructor to avoid escaping.


    ```

    [](#cb55-1)> let path = ''/abc/123/foo/baz/ip.txt''

    [](#cb55-2)

    [](#cb55-3)// this is known as ''leaning toothpick syndrome''

    [](#cb55-4)> path.replace(/^\/abc\/123\//, ''~/'')

    [](#cb55-5)< "~/foo/baz/ip.txt"

    [](#cb55-6)

    [](#cb55-7)// using ''new RegExp'' improves readability and can reduce typos

    [](#cb55-8)> path.replace(new RegExp(`^/abc/123/`), ''~/'')

    [](#cb55-9)< "~/foo/baz/ip.txt"

    ```


    ## Escape sequences


    Certain characters like tab and newline can be expressed using escape sequences
    as `\t` and `\n` respectively. These are similar to how they are treated in normal
    string literals. However, `\b` is for word boundaries as seen earlier, whereas
    it stands for backspace character in normal string literals. Additionally, there
    are several sequences that are specific to regexps.


    The full list is mentioned in the **Using special characters** section of [MDN
    documentation](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Regular_Expressions).
    These are `\b \B \cX \d \D \f \n \p \P \r \s \S \t \uhhhh \uhhhhh \v \w \W \xhh
    \0`.


    ```

    [](#cb56-1)> ''a\tb\tc''.replace(/\t/g, '':'')

    [](#cb56-2)< "a:b:c"

    [](#cb56-3)

    [](#cb56-4)> ''1\n2\n3''.replace(/\n/g, '' '')

    [](#cb56-5)< "1 2 3"

    [](#cb56-6)

    [](#cb56-7)// use \\ instead of \ when constructing regexp from string literals

    [](#cb56-8)> new RegExp(''123\tabc'')

    [](#cb56-9)< /123    abc/

    [](#cb56-10)> new RegExp(''123\\tabc'')

    [](#cb56-11)< /123\tabc/

    ```


    Here''s a console screenshot of another example.


    ![Backslash in RegExp](media/file4.png)


    If an escape sequence is not defined, it will be treated as the character it escapes.


    ```

    [](#cb57-1)// here \e is treated as e

    [](#cb57-2)> /\e/.test(''hello'')

    [](#cb57-3)< true

    ```


    You can also represent a character using hexadecimal escape of the format `\xhh`
    where `hh` are exactly two hexadecimal characters. If you represent a metacharacter
    using escapes, it will be treated literally instead of its metacharacter feature.
    [Codepoints](#ch014.xhtml_codepoints) section will discuss escapes for unicode
    characters.


    ```

    [](#cb58-1)// \x20 is space character

    [](#cb58-2)> ''h e l l o''.replace(/\x20/g, '''')

    [](#cb58-3)< "hello"

    [](#cb58-4)

    [](#cb58-5)// \x7c is ''|'' character

    [](#cb58-6)> ''12|30''.replace(/2\x7c3/g, ''5'')

    [](#cb58-7)< "150"

    [](#cb58-8)> ''12|30''.replace(/2|3/g, ''5'')

    [](#cb58-9)< "15|50"

    ```


    > ![info](media/file2.svg) See [ASCII code table](https://ascii.cl/) for a handy
    cheatsheet with all the ASCII characters and their hexadecimal representation.


    ## Cheatsheet and Summary


    | Note | Description |

    | --- | --- |

    | `\` | prefix metacharacters with `\` to match them literally |

    | `\\` | to match `\` literally |

    | `source` | property to convert RegExp object to string |

    | | helps to insert a RegExp inside another RegExp |

    | `flags` | property to get flags of a RegExp object |

    | `RegExp(`pat`)` | helps to avoid or reduce escaping the `/` delimiter character
    |

    | Alternation precedence | tie-breaker is left to right if matches have same starting
    location |

    | | robust solution: sort the alternations based on length, longest first |


