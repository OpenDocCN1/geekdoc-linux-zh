    [](#cb168-5)// entire sequences in the output

    [](#cb168-6)// add your solution here

    [](#cb168-7)< ["2323", "453545354535", "11"]

    [](#cb168-8)

    [](#cb168-9)// only the unique sequence in the output

    [](#cb168-10)// add your solution here

    [](#cb168-11)< ["23", "4535", "1"]

