    ## 具名捕获组


    即使对于经验丰富的程序员来说，`Regexp` 也可能会变得晦涩且难以维护。有几种结构可以帮助增加清晰度。其中一种就是为捕获组命名，并使用该名称进行反向引用，而不是使用纯数字。此外，命名捕获组部分可以使用
    `groups` 属性以键值对的形式提取。其语法如下：


    - `(?<name>pat)` 用于为捕获组命名

    - `\k<name>` 在正则定义中用于反向引用

    - `$<name>` 在替换部分中用于反向引用


    ```

    [](#cb156-1)> let row = ''today,2008-03-24,food,2008-03-24,nice,2018-10-25,5632''

    [](#cb156-2)

    [](#cb156-3)// 等同于 /(\d{4}-\d{2}-\d{2}).*\1/

    [](#cb156-4)> row.match(/(?<date>\d{4}-\d{2}-\d{2}).*\k<date>/)[0]

    [](#cb156-5)< "2008-03-24,food,2008-03-24"

    [](#cb156-6)

    [](#cb156-7)// 给第一个和第二个捕获的单词命名

    [](#cb156-8)// 等同于 replace(/(\w+),(\w+)/g, ''$2,$1'')

    [](#cb156-9)> ''good,bad 42,24''.replace(/(?<fw>\w+),(?<sw>\w+)/g, ''$<sw>,$<fw>'')

    [](#cb156-10)< "bad,good 24,42"

    ```


    这是一个使用 `groups` 属性的示例。


    ```

    [](#cb157-1)> let m = ''2018-10-25,car''.match(/(?<date>[^,]+),(?<product>[^,]+)/)

    [](#cb157-2)

    [](#cb157-3)> m.groups

    [](#cb157-4)< {date: "2018-10-25", product: "car"}

    [](#cb157-5)> m.groups.date

    [](#cb157-6)< "2018-10-25"

    [](#cb157-7)> m.groups.product

    [](#cb157-8)< "car"

    ```


    ## 速查表与总结


    | 注意 | 说明 |

    | --- | --- |

    | 反向引用 | 给出第 N 个捕获组的匹配部分 |

    | | 在替换部分中使用 `$1`, `$2`, `$3` 等 |

    | | `$&` 给出整个匹配部分 |

    | | `` `$ `` 给出匹配部分之前的字符串 |

    | | `$''` 给出匹配部分之后的字符串 |

    | | 在正则定义中使用 `\1`, `\2`, `\3` 等 |

    | `$$` | 在替换部分中插入字面量 `$` |

    | `$0N` | 与 `$N` 相同，允许分离反向引用与其他数字 |

    | `\N\xhh` | 允许在正则定义中分离反向引用和数字 |

    | `(?:pat)` | 非捕获组 |

    | `(?<name>pat)` | 具名捕获组 |

    | | 在正则定义中使用 `\k<name>` 进行反向引用 |

    | | 在替换部分中使用 `$<name>` 进行反向引用 |

    | | 具名捕获也可以通过 `groups` 属性访问 |


    本章涵盖了许多与分组相关的特性——通过反向引用获取捕获组的匹配部分，以及通过命名分组来增加清晰度。当捕获组的结果导致非预期行为时（例如 `split` 方法），你可以使用非捕获组。你将在断言
    章节中看到更多此类特殊组。


