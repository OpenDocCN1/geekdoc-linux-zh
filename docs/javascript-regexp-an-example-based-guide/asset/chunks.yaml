    # Interlude: Tools for debugging and visualization


    As your regexp gets complicated, it can get difficult to debug if you run into
    issues. Building your regexp step by step from scratch and testing against input
    strings will go a long way in correcting the problem. To aid in such a process,
    you could use [various online regexp tools](https://news.ycombinator.com/item?id=20614847).


    ## regex101


    [`regex101`](https://regex101.com/) is a popular site to test your regexp. You''ll
    have first choose the flavor as JavaScript. Then you can add your regexp, input
    strings, choose flags and an optional replacement string. Matching portions will
    be highlighted and explanation is offered in separate panes. There''s also a quick
    reference and other features like sharing, code generator, quiz, etc.


    The below image is a screenshot from this link — [regex101: `/ab{0,2}c/g`](https://regex101.com/r/HSe0z/1)


    ![regex101 example](media/file5.png)


    > ![info](media/file2.svg) [`regexr`](https://regexr.com/) is another site that
    offers similar functionality.


    ## regulex


    Another useful tool is [`jex: regulex`](https://jex.im/regulex/) which converts
    your regexp to rail diagram, thus providing a visual aid to the pattern.


    The below image is a screenshot from this link — [`regulex: /\b(en|ro)?t\b/`](https://jex.im/regulex#!flags=&re=%5Cb(en%ro)%3Ft)


    ![regulex example](media/file6.png)


    > ![info](media/file2.svg) [`debugex`](https://www.debugex.com/) offers similar
    functionality.


    ## regexcrossword


    For practice, [`regexword`](https://regexword.com/) is often recommended. This
    site supports only JavaScript flavor. See [`regexword: howtoplay`](https://regexword.com/howtoplay)
    for help.


    The below image is a screenshot from link — [`regexword: tutorial 5`](https://regexword.com/challenges/puzzles/5)


    ![regexcrossword example](media/file7.png)


    ## Summary


    This chapter briefly presented three online tools that can help you with understanding
    and interactively solving/debugging regular expressions. Syntax and features can
    vary significantly between various tools and programming languages. So ensure
    that the program supports the flavor of regular expressions you are using.


    # Working with matched portions


    Having seen a few regexp features that can match text, you''ll learn how to extract
    and work with those portions in this chapter. Three new methods are introduced,
    like functions and dictionaries in `replace` method.


    ### match method


    The `match` method can be used in different ways. When `g` flag isn''t used and
    the regexp succeeds, you get an array containing various details of the first
    portion.


    ```

    [](#cb92-1)// note that ''g'' flag isn''t used

    [](#cb92-2)> ''abc ac adc abbbc''.match(/abc/)

    [](#cb92-3)< ["abc", index: 0, input: "abc ac adc abbbc", groups: undefined]

    [](#cb92-4)// to get only the matching portion

    [](#cb92-5)> ''abc ac adc abbbc''.match(/abc/)[0]

    [](#cb92-6)< "abc"

    [](#cb92-7)// non-regexp object will get processed as RegExp

    [](#cb92-8)> ''abc ac adc abbbc''.match(''abc'')

    [](#cb92-9)< ["abc", index: 0, input: "abc ac adc abbbc", groups: undefined]

    ```


    The `index` property gives the starting location of matched portion. The `input`
    property gives the input string which the `match` method was used. If the given
    regexp fails, the output is `null` and not an empty array. The `groups` property
    will be discussed in [Named capture groups](#ch01.xhtml_named-capture-groups).
    See [MDN: match](https://developer.mozilla.org/en-US/docs/Web/Reference/Global_Objects/String/match)
    for more details.


    ```

    (#cb93-1)> let s1 = ''cat and dog''

    [](#cb93-2)> s1.match(/dog/).index

    [](#cb93-3)< 8

    [](#cb93-4)> s1.match(/dog/).input

    [](#cb93-5)< "cat and dog"

    [](#cb93-8)> s1.match(/xyz/)

    [](#cb93-9)< null

    ```


    ### search method


    The `search` method gives the index of first matching portion. If the regexp fails,
    it returns `-1` as output.


    ```

    [](#cb94-1)// same as: match(/dog/).index

    [](#cb94-2)> ''cat and dog''.search(/dog/)

    [](#cb94-3)< 8

    [](#cb94-4)// cannot use match(/xyz/).index here

    [](#cb94-5)// as ''match'' returns ''null'' if regexp doesn''t match

    [](#cb94-6)> ''cat and dog''.search(/xyz/)

    [](#cb94-7)< -1

    ```


    ### Capture groups


    The regexp grouping inside `()` is also known as a capture group. It has multiple
    uses, one of which is the ability to work with matched portions of those groups.
    When capture groups are used with `match` method, the matched portions of those
    groups will also be part of the array output. The first element is always the
    entire matched portion followed by portions of capture groups. The leftmost `(`
    will get group number `1`, second leftmost `(` will get group number `2` and so
    on.


    ```

    [](#cb95-1)// there are two capture groups used here

    [](#cb95-2)> ''abc ac adc abbbc''.match(/a(.*)d(.*a)/)

    [](#cb95-3)< ["abc ac adc a", "bc ac a", "c a", index: 0,

    [](#cb95-4)   input: "abc ac adc abbbc", groups: undefined]

    [](#cb95-6)// entire matched portion

    [](#cb95-7)> ''abc ac adc abbbc''.match(/a(.*)d(.*a)/)[0]

    [](#cb95-8)< "abc ac adc a"

    [](#cb95-10)// capture group portions

    [](#cb95-11)> ''abc ac adc abbbc''.match(/a(.*)d(.*a)/)[1]

    [](#cb95-12)< "bc ac a"

    [](#cb95-13)> ''abc ac adc abbbc''.match(/a(.*)d(.*a)/)[2]

    [](#cb95-14)< "c a"

    ```


    ### Getting all matched portions


    The `match` method returns all the matched portions when the `g` flag is used.
    Capture group portions and the three properties won''t be part of the output.


    ```

    [](#cb96-1)> ''abc ac adc abbbc''.match(/ab*c/g)

    [](#cb96-2)< ["abc", "ac", "abbbc"]

    [](#cb96-3)

    [](#cb96-4)> ''abc ac adc abbbc''.match(/ab+c/g)

    [](#cb96-5)< ["abc", "abbbc"]

    [](#cb96-6)

    [](#cb96-7)> ''par spar apparent spare part''.match(/\bs?pare?\b/g)

    [](#cb96-8)< ["par", "spar", "spare"]

    [](#cb96-9)

    [](#cb96-10)// entire matching portion is returned even if capture group is used

    [](#cb96-11)> ''par spar apparent spare part''.match(/\bs?par(e|t)\b/g)

    [](#cb96-12)< ["spare", "part"]

    ```


    It is a useful method for debugging purposes as well, for example to see what
    is going on under the head before using `replace` method.


    ```

    [](#cb97-1)> ''that is quite a fabricated tale''.match(/t.*a/g)

    [](#cb97-2)< ["that is quite a fabricated ta"]

    [](#cb97-3)> ''that is quite a fabricated tale''.match(/t.*?a/g)

    [](#cb97-4)< ["tha", "t is quite a", "ted ta"]

    ```


    ### matchAll method


    If you need capture group portions and properties for every match with `g` flag
    active, use the `matchAll` method. The return value is an iterator.

    '
  raw: '```

    [](#cb91-1)> let s1 = ''go there  ::   this :: that''

    [](#cb91-2)> let s2 = ''a::b :: c::d e::f :: 4::5''

    [](#cb91-3)> let s3 = ''42:: hi::bye::see :: carefully''

    [](#cb91-4)

    [](#cb91-5)> const pat4 =      // add your solution here

    [](#cb91-6)

    [](#cb91-7)> s1.split()        // add your solution here

    [](#cb91-8)< ["go there", "this :: that"]

    [](#cb91-9)> s2.split()        // add your solution here

    [](#cb91-10)< ["a::b", "c::d e::f :: 4::5"]

    [](#cb91-11)> s3.split()        // add your solution here

    [](#cb91-12)< ["42:: hi::bye::see", "carefully"]

    ```


    # Interlude: Tools for debugging and visualization


    As your regexp gets complicated, it can get difficult to debug if you run into
    issues. Building your regexp step by step from scratch and testing against input
    strings will go a long way in correcting the problem. To aid in such a process,
    you could use [various online regexp tools](https://news.ycombinator.com/item?id=20614847).


    ## regex101


    [regex101](https://regex101.com/) is a popular site to test your regexp. You''ll
    have first choose the flavor as JavaScript. Then you can add your regexp, input
    strings, choose flags and an optional replacement string. Matching portions will
    be highlighted and explanation is offered in separate panes. There''s also a quick
    reference and other features like sharing, code generator, quiz, etc.


    The below image is a screenshot from this link — [regex101: `/ab{0,2}c/g`](https://regex101.com/r/HSeO0z/1)


    ![regex101 example](media/file5.png)


    > ![info](media/file2.svg) [regexr](https://regexr.com/) is another site that
    offers similar functionality.


    ## regulex


    Another useful tool is [jex: regulex](https://jex.im/regulex/) which converts
    your regexp to a rail road diagram, thus providing a visual aid to understanding
    the pattern.


    The below image is a screenshot from this link — [regulex: `/\bpar(en|ro)?t\b/`](https://jex.im/regulex/#!flags=&re=%5Cbpar(en%7Cro)%3Ft%5Cb)


    ![regulex example](media/file6.png)


    > ![info](media/file2.svg) [debuggex](https://www.debuggex.com/) is another site
    that offers similar functionality.


    ## regexcrossword


    For practice, [regexcrossword](https://regexcrossword.com/) is often recommended.
