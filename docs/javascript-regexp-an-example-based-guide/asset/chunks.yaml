  trans: "\n\n你也可以在 `\\u{}` 结构中使用代码点来指定 Unicode 字符。这与使用 `\\xhh` 通过两个十六进制数字来指定 ASCII\
    \ 字符类似。\n\n```\n[](#cb204-1)// 从给定的字符串获取十六进制格式的代码点\n[](#cb204-2)> Array.from('fox:αλεπού',\
    \ c => c.codePointAt().toString(16))\n[](#cb204-3)< [\"66\", \"6f\", \"78\", \"\
    3a\", \"3b1\", \"3bb\", \"3b5\", \"3c0\", \"3bf\", \"3cd\"]\n[](#cb204-4)\n[](#cb204-5)//\
    \ 使用代码点表示一个字符\n[](#cb204-6)> '\\u{3b1}'\n[](#cb204-7)< \"α\"\n[](#cb204-8)\n[](#cb204-9)//\
    \ 使用 \\u{} 定义小写字母的字符范围\n[](#cb204-10)// 注意 \\u{} 仅在配合 'u' 标志时有效\n[](#cb204-11)>\
    \ 'fox:αλεπού,eagle:αετός'.match(/[\\u{61}-\\u{7a}]+/gu)\n[](#cb204-12)< [\"fox\"\
    , \"eagle\"]\n```\n\n> ![info](img/file2.svg) 另请 [stackoverflow: Unicode 字符串转十六进制](https://stackoverflow.com/questions/21647928/javascript-unicode-string-to-hex)。\n\
    \n## 备查表与总结\n\n| Note | 说明 |\n| --- | --- |\n| `u` | 启用 Unicode 匹配的标志 |\n| `\\\
    p{}` | Unicode 字符集 |\n| `\\P{}` | 反向 Unicode 字符集 |\n| | 详情参 [MDN: Unicode 属性转义](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Regular_Expressions/Unicode_Property_Escapes)\
    \ |\n| `\\u{}` | 使用代码点指定 Unicode 字符 |\n\n关于结合 Unicode 字符使用正则表达式的全面讨论不在本书的范围内。推荐通过\
    \ [regular-expressions: unicode](https://www.regular-expressions.info/unicode.html)\
    \ 和 [Programmers introduction to Unicode](http://reedbeta.com/blog/programmers-intro-to-unicode/)\
    \ 等资源进一步学习。\n\n## 练习\n\n**a)** 检查给输入字符串是否仅由 ASCII 字符组成。假设输入为非空字符串，任何不属于 7 位 ASCII\
    \ 集的字符都应输出 `false`。\n\n```\n[](#cb205-1)> let str1 = '123 × 456'\n[](#cb205-2)>\
    \ let str2 = 'good fοοd'\n[](#cb205-3)> let str3 = 'happy learning!'\n[](#cb205-4)\n\
    [](#cb205-5)> const pat1 =      // 在此处添加你的解决方案\n[](#cb205-6)\n[](#cb205-7)> pat1.test(str1)\n\
    [](#cb205-8)< false\n[](#cb205-9)> pat1.test(str2)\n[](#cb205-10)< false\n[](#cb205-11)>\
    \ pat1.test(str3)\n[](#cb205-12)< true\n```\n\n**b)** 为给定的字符串仅保留标点字符。\n\n```\n\
    [](#cb206-1)> let ip = '❨a❩❪1❫❬b❭❮2❯❰c❱❲3❳❴xyz❵⟅123⟆⟦⟧⟨like⟩⟪3.14⟫'\n[](#cb206-2)\n\
    [](#cb206-3)// 在此处添加你的解决方案\n[](#cb206-4)< \"❨❩❪❫❬❭❮❯❱❱❲❳❴❵⟅⟆⟦⟧⟨⟩⟪.⟫\"\n```\n\n\
    **c)** 下面代码段显示的输出是正确的？\n\n```\n[](#cb207-1)> 'fox:αλεπού'.match(/\\w+/g)\n[](#cb207-2)<\
    \ [\"fox\"]\n```\n\n## 扩展阅读\n\n注意，这些资源中的某些并非特定于 JavaScript，使用时请谨慎，并检查它们是否适用于 JavaScript\
    \ 的语法和特性。\n\n* [regex101](https://regex101.com/) 和 [regexr](https://regexr.com/)\
    \ — 正则表达式的可视化和在线测试工具，使用前将 flavor 选择为 JavaScript\n* [regulex](https://jex.im/regulex)\
    \ 和 [debuggex](https://www.debuggex.com/) — 用于将正则表达式可视化为轨道道图\n* [XRegExp](https://github.com/slevithan/xregexp)\
    \ — 具有元字符转义、递归匹配等特性的实用程序\n* [JSVerbalExpressions](https://github.com/VerbalExpressions/JSVerbalExpressions)\
    \ — 使用自然语言术语构建正则表达式\n* [CommonRegexJS](https://github.com/talyssonoc/CommonRegexJS)\
    \ — 常用正则表达式集\n* [Awesome Regex](https://github.com/aloisdg/awesome-regex) — 库、工具、框架和软件的精选\n\
    * [randexp.js](https://github.com/fent/randexp.js) — 生成匹配给定正则表达式的字符串\n* [stackoverflow:\
    \ JavaScript regexp](https://stackoverflow.com/questions/tagged/javascript+regex?sort=votes&pageSize=15)\n\
    * [stackoverflow: regex FAQ](https://stackoverflow.com/questions/22937618/reference-what-does-this-regex-mean)\n\
    \    * [stackoverflow: regex tag](https://stackoverflow.com/questions/tagged/regex)\
    \ 是练习题的良好来源\n* [rexegg](https://www.rexegg.com/) — 教程、技巧等等\n* [regular-expressions](https://www.regular-expressions.info/)\
    \ — 教程和工具\n* [regexcrossword](https://regexcrossword.com/) — 教程和谜题\n* [swtch](https://swtch.com/~rsc/regexp/regexp1.html)\
    \ — 关于正则表达式实现引擎的内容\n* [news.ycombinator: collection of regexp related resources](https://news.ycombinator.com/item?id=20614847)\n\
    \n以下是特定主题的链接：\n\n* [rexegg: best regex trick](https://www.rexegg.com/regex-best-trick.html)\n\
    * [regular-expressions: matching numeric ranges](https://www.regular-expressions.info/numericranges.html)\n\
    * [regular-expressions: Zero-Length Matches](https://www.regular-expressions.info/zerolength.html)\n\
