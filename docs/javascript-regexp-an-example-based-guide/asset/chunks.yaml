    # Anchors


    In this chapter, you''ll be learning about qualifying a pattern. Instead of matching
    anywhere in the given input string, restrictions can be specified. For now, you''ll
    see the ones that are already part of regular expression features. In later chapters,
    you''ll learn how to define your own rules for restriction.


    These restrictions are made possible by assigning special meaning to certain characters
    and escape sequences. The characters with special meaning are known as **metacharacters**
    in regexp parlance. In case you need to match those characters literally, you
    need to escape them with a `\` character (discussed in [Escaping metacharacters](#ch006.xhtml_escaping-metacharacters)
    chapter).


    ## String anchors


    This restriction is about qualifying a regexp to match only at the start or end
    of an input string. These provide functionality similar to the string methods
    `startsWith` and `endsWith`. First up is `^` metacharacter, which restricts the
    matching to the start of string.


    ```

    [](#cb19-1)// ^ is placed as a prefix to the pattern

    [](#cb19-2)> /^cat/.test(''cater'')

    [](#cb19-3)< true

    [](#cb19-4)> /^cat/.test(''concatenation'')

    [](#cb19-5)< false

    [](#cb19-6)

    [](#cb19-7)> /^hi/.test(''hi hello\ntop spot'')

    [](#cb19-8)< true

    [](#cb19-9)> /^top/.test(''hi hello\ntop spot'')

    [](#cb19-10)< false

    ```


    To restrict the match to the end of string, `$` metacharacter is used.


    ```

    [](#cb20-1)// $ is placed as a suffix to the pattern

    [](#cb20-2)> /are$/.test(''spare'')

    [](#cb20-3)< true

    [](#cb20-4)> /are$/.test(''nearest'')

    [](#cb20-5)< false

    [](#cb20-6)

    [](#cb20-7)> let words = [''surrender'', ''unicorn'', ''newer'', ''door'', ''empty'',
    ''eel'', ''pest'']

    [](#cb20-8)> words.filter(w => /er$/.test(w))

    [](#cb20-9)< ["surrender", "newer"]

    [](#cb20-10)> words.filter(w => /t$/.test(w))

    [](#cb20-11)< ["pest"]

    ```


    Combining both the start and end string anchors, you can restrict the matching
    to the whole string. Similar to comparing strings using the `==` operator.


    ```

    [](#cb21-1)> /^cat$/.test(''cat'')

    [](#cb21-2)< true

    [](#cb21-3)> /^cat$/.test(''cater'')

    [](#cb21-4)< false

    ```


    The anchors can be used by themselves as a pattern. Helps to insert text at the
    start or end of string, emulating string concatenation operations. These might
    not feel like useful capability, but combined with other regexp features they
    become quite a handy tool.


    ```

    [](#cb22-1)> ''live''.replace(/^/, ''re'')

    [](#cb22-2)< "relive"

    [](#cb22-3)> ''send''.replace(/^/, ''re'')

    [](#cb22-4)< "resend"

    [](#cb22-5)

    [](#cb22-6)> ''cat''.replace(/$/, ''er'')

    [](#cb22-7)< "cater"

    [](#cb22-8)> ''hack''.replace(/$/, ''er'')

    [](#cb22-9)< "hacker"

    ```


