    ## 锚点


    在 `test` 方法中使用 `g` 标志可以提供一些额外功能。请参考 [MDN: test](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/RegExp/test#Examples)-US/docs/Web/JavaScript/Reference/Global_Objects/RegExp/test#Examples)
    获取示例。然而，在我看来，很容易养成在 `test` 中使用 `g` 的习惯，并导致意想不到的结果。我更倾向于建议使用 match 方法 并显式地编写逻辑，而不是依赖带有
    `g` 标志的 `test`。


    锚点限制匹配到字符串的开头或结尾。这些特殊字符被称为元字符。要字面匹配这些字符，需要使用 `\` 进行转义。


    ## 字符串锚点


    `^` 元字符限制匹配到字符串的开头。这些功能与 `startsWith` 方法类似。


    ```

    [](#cb19-1)> ^ 是作为模式的前缀

    [](#cb19-2)> /cat/.test(''cater'')

    [](#cb19-3)< true

    [](#cb19-4)> /cat/.test(''concatenation'')

    [](#cb19-5)< false

    [](#cb19-6)

    [](#cb19-7)> /^hi/.test(''hi\ntop spot'')

    [](#cb19-8)< true

    [](#cb19-9)> /^top/.test(''hi\ntop spot'')

    [](#cb19-10)< false

    ```


    `$` 元字符用于限制匹配到字符串的结尾。


    ```

    [](#cb20-1)> $ 是作为模式的后缀

    [](#cb20-2)> /are$/.test(''spare'')

    [](#cb20-3)< true

    [](#cb20-4)> /are$/.test(''nearest'')

    [](#cb20-5)< false

    [](#cb20-6)

    [](#cb20-7)> let words = [''surrender'', ''unicorn'', ''newer'', ''door'', ''empty'',
    ''pest'']

    [](#cb20-8)> words.filter(w => /er$/.test(w))

    [](#cb20-9)< ["surrender", "newer"]

    [](#cb20-10)> words.filter(w => /t$/.test(w))

    [](#cb20-11)< ["pest"]

    ```


    结合字符串开头和结尾锚点，你可以限制匹配整个字符串。这与使用 `==` 运算符比较字符串相似。


    ```

    [](#cb21-1)> /^cat$/.test(''cat'')

    [](#cb21-2)< true

    [](#cb21-3)> /^cat$/.test(''cater'')

    [](#cb21-4)< false

    ```


    锚点可以单独作为模式使用。有助于在字符串开头或结尾插入文本，模拟字符串拼接操作。这些可能看起来并不有用，但与其他正则表达式特性结合，它们会变成非常方便的工具。


    ```

    [](#cb22-1)> ''live''.replace(/^/, ''re'')

    [](#cb22-2)< "relive"

    [](#cb22-3)> ''send''.replace(/^/, ''re'')

    [](#cb22-4)< "resend"

    [](#cb22-5)

    []cbcb22-6)> ''cat''.replace(/$/, ''er'')

    [](#cb22-7)< "cater"

    [](#cb22-8)> ''hack''.replace(/$/, ''er'')

    [](#cb22-9)< "hacker"

    ```


    ## 行锚点


