    [](#cb46-1)> let items = [''lovely'', ''1\ndentist'', ''2 lonely'', ''eden'',
    ''fly\nfar'', ''dent'']

    [](#cb46-2)

    [](#cb46-3)> items.filter()        // add your solution here

    [](#cb46-4)< ["lovely", "1\ndentist", "2 lonely", "fly\nfar", "dent"]

    ```


