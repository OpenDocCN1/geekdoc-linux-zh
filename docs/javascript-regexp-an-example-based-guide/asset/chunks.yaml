    \ types of quantifiers to narrow down the possibilities. In this section, `greedy`\
    \ type of quantifiers is covered.\n\nFirst up, the `?` metacharacter which quantifies\
    \ a character or group to match `0` or `1` times. This helps to define optional\
    \ patterns and build terser regexps.\n\n```\n[](#cb67-1)// same as: /ear|ar/g\n\
