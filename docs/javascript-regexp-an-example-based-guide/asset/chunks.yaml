    So, this chapter was about specifying one or more alternate matches within the
    same regexp using `|` metacharacter. Which can further be simplified using `()`
    grouping if there are common aspects. Among the alternations, earliest matching
    pattern gets precedence. Left to right ordering is used as a tie-breaker if multiple
    alternations match starting from the same location. In the next chapter, you''ll
    learn how to construct alternation from an array of strings taking care of precedence
    rules. Grouping has various other uses too, which will be discussed in coming
    chapters.


