- "# JavaScript 正则表达式：示例指南\n\n\n\n![](img/js_regexp.png)\n\n\n# 前言\n\n脚本和自动化任务通常需要从输入数据中提取特定文本，或将它们从一种格式转换为另一种格式。本书将帮助你学习\
  \ JavaScript 中实现的正则表达式。正则表达式本身可以被视为一种微型编程语言，非常适合各种文本处理需求。\n\n本书高度依赖示例来逐一介绍正则表达式的特性。建议你手动输入每个示例并进行实验。理解示例输入字符串的性质以及产生的输出至关重要。类比一下，这就像学习骑自行车或开车——无论你读了多少相关知识或听了多少解释，你都需要大量的练习并推导出自己的结论。如果你觉得复制粘贴更适合你，[GitHub\
  \ 上提供了按章节划分的代码片段](https://github.com/learnbyexample/learn_js_regexp/tree/master/code_snippets)。\n\
  \n## 前提条件\n\n应当具备良好的基础编程概念理解，并具有 JavaScript 工作经验。还应该了解函数式编程概念，如 `map` 和 `filter`。\n\
  \n## 约定\n\n* 此处展示的示例已在 Chrome/Chromium 控制台（版本 81+）上通过测试，并包含了其他浏览器和平台不支持的特性。\n* 显示的代码片段是从控制台复制并为了演示目的而修改的。某些命令前带有注释以提供背景和解释。增加了空行以提高可读性，当输出为\
  \ `undefined` 或无必要显示时将跳过。\n* 除非另有说明，所有示例和解释均适用于 `ASCII` 字符。\n* 全书中提供了外部链接以供进一步阅读。不需要立即访问。它们经过仔细挑选，特别在重读时会有帮助。\n\
  * [learn_js_regexp](https://github.com/learnbyexample/learn_js_regexp) 仓库包含了与书籍相关的所有代码片段、练习和其他细节。点击\
  \ **Clone**（克隆）按钮获取文件。\n\n## 致谢\n\n* [MDN: 正则表达式](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Regular_Expressions)\
  \ — 文档和示例\n* [/r/learnjavascript/](https://www.reddit.com/r/learnjavascript/) 和\
  \ [/r/regex/](https://www.reddit.com/r/regex/) — 对初学者和资深程序员都有用的论坛\n* [stackoverflow](https://stackoverflow.com/)\
  \ — 获取有关 JavaScript 和正则表达式相关问题的答案\n* [tex.stackexchange](https://tex.stackexchange.com/)\
  \ — 帮助 `pandoc` 和 `tex` 相关问题\n* 封面图片：[LibreOffice Draw](https://www.libreoffice.org/discover/draw/)\
  \ 和 [regulex](https://jex.im/regulex)\n* 由 [Amada44](https://commons.wikimedia.org/wiki/User:Amada44)\
