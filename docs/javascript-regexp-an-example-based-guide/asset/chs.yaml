  \ s3 = '42:: hi::bye::see :: carefully'\n[](#cb91-4)\n[](#cb91-5)> const pat4 =\
  \      // add your solution here\n[](#cb91-6)\n[](#cb91-7)> s1.split()        //\
  \ add your solution here\n[](#cb91-8)< [\"go there\", \"this :: that\"]\n[](#cb91-9)>\
  \ s2.split()        // add your solution here\n[](#cb91-10)< [\"a::b\", \"c::d e::f\
  \ :: 4::5\"]\n[](#cb91-11)> s3.split()        // add your solution here\n[](#cb91-12)<\
  \ [\"42:: hi::bye::see\", \"carefully\"]\n```\n\n# 间歇：调试和可视化工具\n\n当你的正则表达式变得复杂时，如果遇到问题，调试可能会变得困难。从零开始逐步构建正则表达式并针对输入字符串进行测试，对解决问题非常有帮助。为了辅助这一过程，你可以使用[各种在线正则表达式工具](https://news.ycombinator.com/item?id=20614847)。\n\
  \n## regex101\n\n[`regex101`](https://regex101.com/) 是测试正则表达式的流行网站。你首先需要选择 JavaScript\
  \ 模式。然后你可以添加你的正则表达式、输入字符串、选择标志以及可选的替换字符串。匹配部分将被高亮，并在单独窗格中提供解释。此外还有快速参考以及分享、代码生成器、测验等功能。\n\
  \n下面的图片是该链接的截图 — [regex101: `/ab{0,2}c/g`](https://regex101.com/r/HSe0z/1)\n\n![regex101\
  \ example](img/file5.png)\n\n> ![info](img/file2.svg) [`regexr`](https://regexr.com/)\
  \ 是另一个提供类似功能的网站。\n\n## regulex\n\n另一个实用工具是 [`jex: regulex`](https://jex.im/regulex/)，它可以将你的正则表达式转换为轨道图（rail\
  \ diagram），从而为模式提供视觉辅助。\n\n下面的图片是该链接的截图 — [`regulex: /\\b(en|ro)?t\\b/`](https://jex.im/regulex#!flags=&re=%5Cb(en%ro)%3Ft)\n\
  \n![regulex example](img/file6.png)\n\n> ![info](img/file2.svg) [`debugex`](https://www.debugex.com/)\
  \ 提供类似的功能。\n\n## regexcrossword\n\n对于练习，通常推荐 [`regexword`](https://regexword.com/)。该网站仅支持\
  \ JavaScript 模式。请参见 [`regexword: howtoplay`](https://regexword.com/howtoplay) 以获取帮助。\n\
  \n下面的图片是该链接的截图 — [`regexword: tutorial 5`](https://regexword.com/challenges/puzzles/5)\n\
  \n![regexcrossword example](img/file7.png)\n\n## 总结\n\n本章简要介绍了三个在线工具，它们可以帮助你理解并交互式地解决/调试正则表达式。不同工具和编程语言之间的语法和功能可能会有很大差异。因此，请确保程序支持你正在使用的正则表达式模式。\n\
  \n# 处理匹配部分\n\n在看了一些可以匹配文本的正则表达式特性后，你将在本章中学习如何提取并处理这些部分。引入了三个新方法，类似于 `replace` 方法中的函数和字典。\n\
  \n## match 方法\n\n`match` 方法可以以不同的方式使用。当不使用 `g` 标志且正则表达式成功时，你将得到一个包含第一个部分各种细节的数组。\n\
  \n```\n[](#cb92-1)// 注意没有使用 'g' 标志\n[](#cb92-2)> 'abc ac adc abbbc'.match(/abc/)\n\
  [](#cb92-3)< [\"abc\", index: 0, input: \"abc ac adc abbbc\", groups: undefined]\n\
  [](#cb92-4)// 仅获取匹配部分\n[](#cb92-5)> 'abc ac adc abbbc'.match(/abc/)[0]\n[](#cb92-6)<\
  \ \"abc\"\n[](#cb92-7)// 非正则表达式对象将被作为 RegExp 处理\n[](#cb92-8)> 'abc ac adc abbbc'.match('abc')\n\
  [](#cb92-9)< [\"abc\", index: 0, input: \"abc ac adc abbbc\", groups: undefined]\n\
  ```\n\n`index` 属性给出匹配部分的起始位置。`input` 属性提供使用 `match` 方法的输入字符串。如果指定的正则表达式失败，输出为 `null`\
  \ 而不是空数组。`groups` 属性将在命名捕获组中讨论。更多细节请参见 [MDN: match](https://developer.mozilla.org/en-US/docs/Web/Reference/Global_Objects/String/match)。\n\
  \n```\n(#cb93-1)> let s1 = 'cat and dog'\n[](#cb93-2)> s1.match(/dog/).index\n[](#cb93-3)<\
  \ 8\n[](#cb93-4)> s1.match(/dog/).input\n[](#cb93-5)< \"cat and dog\"\n[](#cb93-8)>\
  \ s1.match(/xyz/)\n[](#cb93-9)< null\n```\n\n## search 方法\n\n`search` 方法给出第一个匹配部分的索引。如果正则表达式失败，它返回\
  \ `-1` 作为输出。\n\n```\n[](#cb94-1)// 等同于 match(/dog/).index\n[](#cb94-2)> 'cat and\
  \ dog'.search(/dog/)\n[](#cb94-3)< 8\n[](#cb94-4)// 在此处不能使用 match(/xyz/).index\n\
  [](#cb94-5)// 因为如果正则表达式不匹配，'match' 将返回 'null'\n[](#cb94-6)> 'cat and dog'.search(/xyz/)\n\
  [](#cb94-7)< -1\n```\n\n## 捕获组\n\n`()` 内部的正则表达式分组被称为捕获组。它有多个用途，其中之一是能够处理这些组的匹配部分。当在\
  \ `match` 方法使用捕获组时，这些组的匹配部分也将是数组输出的一部分。第一个元素始终是整个匹配部分，后面是捕获组的部分。最左侧的 `(` 将获得组号 `1`，第二个最左侧的\
  \ `(` 将获得组号 `2`，依此类推。\n\n```\n[](#cb95-1)// 这里使用了两个捕获组\n[](#cb95-2)> 'abc ac adc\
  \ abbbc'.match(/a(.*)d(.*a)/)\n[](#cb95-3)< \"abc ac adc a\", \"bc ac a\", \"c a\"\
  , index: 0,\n[   input: \"abc ac adc abbbc\", groups: undefined]\n[](#cb95-6)//\
  \ 整个匹配部分\n[](#cb95-7)> 'abc ac adc abbbc'.match(/a(.*)d(.*a)/)[0]\n[](#cb95-8)<\
  \ \"abc ac adc a\"\n[](#cb95-10)// 捕获组部分\n[](#cb95-11)> 'abc ac adc abbbc'.match(/a(.*)d(.*a)/)[1]\n\
  [](#cb95-12)< \"bc ac a\"\n[](#cb95-13)> 'abc ac adc abbbc'.match(/a(.*)d(.*a)/)[2]\n\
  [](#cb95-14)< \"c a\"\n```\n\n## 获取所有匹配部分\n\n当使用 `g` 标志时，`match` 方法返回所有匹配部分。捕获组部分和三个属性不会包含输出输出。\n\
  \n```\n[](#cb96-1)> 'abc ac adc abbbc'.match(/ab*c/g)\n[](#cb96-2)< [\"abc\", \"\
  ac\", \"abbbc\"]\n[](#cb96-3)\n[](#cb96-4)> 'abc ac adc abbbc'.match(/ab+c/g)\n\
  [](#cb96-5)< [\"abc\", \"abbbc\"]\n[](#cb96-6)\n[](#cb96-7)> 'par spar apparent\
  \ spare part'.match(/\\bs?pare?\\b/g)\n[](#cb96-8)< [\"par\", \"spar\", \"spare\"\
  ]\n[](#cb96-9)\n[](#cb96-10)//即使使用了捕获组，也会返回整个匹配部分\n[](#cb96-11)> 'par spar apparent\
  \ spare part'.match(/\\bs?par(e|t)\\b/g)\n[](#cb96-12)< [\"spare\", \"part\"]\n\
  ```\n\n这也是一个非常有用的调试方法，例如在使用 `replace` 方法之前查看内部发生了什么。\n\n```\n[](#cb97-1)> 'that\
  \ is quite a fabricated tale'.match(/t.*a/g)\n[](#cb97-2)< [\"that is quite a fabricated\
  \ ta\"]\n[](#cb97-3)> 'that is quite a fabricated tale'.match(/t.*?a/g)\n[](#cb97-4)<\
  \ [\"tha\", \"t is quite a\", \"ted ta\"]\n```\n\n## matchAll 方法\n\n如果你在启用 `g` 标志时需要每个匹配的捕获组部分和属性，请使用\
  \ `matchAll` 方法。返回值是一个迭代器。\n\n\n\n\n\n```javascript\n[](#cb98-1)> 'abc ac adc abbbc'.matchAll(/ab*c/g)\n\
  [](#cb98-2)< RegExpStringIterator {}\n[](#cb98-3)\n[](#cb98-4)// 将迭代器结果转换为二维数组\n\
  [](#cb98-5)> let arr = [...'abc ac adc abbbc'.matchAll(/ab*c/g)]\n[](#cb98-6)> arr\n\
  [](#cb98-7)< (3) [Array(1), Array(1), Array(1)]\n[](#cb98-8)  0: [\"abc\", index:\
  \ 0, input: \"abc ac adc abbbc\", groups: undefined]\n[](#cb98-9)  1: [\"ac\", index:\
  \ 4, input: \"abc ac adc abbbc\", groups: undefined]\n[](#cb98-10)  2: [\"abbbc\"\
  , index: 11, input: \"abc ac adc abbbc\", groups: undefined]\n[](#cb98-11)  length:\
  \ 3\n[](#cb98-12)  __proto__: Array(0)\n[](#cb98-13)\n[](#cb98-14)// 获取第一个匹配的详细信息的数组\n\
  [](#cb98-15)> arr[0]\n[](#cb98-16)< [\"abc\", index: 0, input: \"abc ac adc abbbc\"\
  , groups: undefined]\n[](#cb98-17)// 获取第二个匹配的索引\n[](#cb98-18)> arr[1].index\n[](#cb98-19)<\
  \ 4\n```\n\n你也可以使用 [`Array.from()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/from)\
  \ 将迭代器转换为数组对象。`Array.from` 允许你通过第二个参数提供映射函数。\n\n```javascript\n[](#cb99-1)//同于：match(/ab*c/g)\n\
  [](#cb99-2)> Array.from('abc ac adc abbbc'.matchAll(/ab*c/g), m => m[0])\n[](#cb99-3)<\
  \ [\"abc\", \"ac\", \"abbbc\"]\n[](#cb99-4)// 获取每个匹配的索引\n[](#cb99-5)> Array.from('abc\
  \ ac adc abbbc'.matchAll(/ab*c/g), m => m.index)\n[](#cb99-6)< [0, 4, 11]\n[](#cb99-7)\n\
  [](#cb99-8)// 为每个匹配获取仅捕获组部分的数组\n[](#cb99-9)> Array.from('xx:yyy x: x:yy :y'.matchAll(/(x*):(y*)/g),\
  \ m => m.slice(1))\n[](#cb99-10)< (4) [Array(2), Array(2), Array(2), Array(2)]\n\
  [](#cb99-11)  0: (2) [\"xx\", \"yyy\"]\n[](#cb99-12)  1: (2) [\"x\", \"\"]\n[](#cb99-13)\
  \  2: (2) [\"x\", \"yy\"]\n[](#cb99-14)  3: (2) [\"\", \"y\"]\n[](#cb99-15)  length:\
  \ 4\n[](#cb99-16)  __proto__: Array(0)\n```\n\n> ![info](img/file2.svg) 在引入 `matchAll`\
  \ 方法之前，必须使用 `exec` 方法。请参见 [MDN: exec](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/RegExp/exec)\
  \ 的详情和示例。\n\n## 使用捕获组分割\n\n捕获组也会影响 `split` 方法。如果用于分割的模式包含捕获组，则被这些组匹配到的部分也将成为输出数组的一部分。\n\
  \n```javascript\n[](#cb100-1)//不使用捕获组\n[](#cb100-2)> '31111111111251111426'.split(/1*4?2/)\n\
  [](#cb100-3)< [\"3\", \"5\", \"6\"]\n[](#cb100-4)\n[](#cb100-5)// 在输出中也包含模式的匹配部分\n\
  [](#cb100-6)> '31111111111251111426'.split(/(1*4?2)/)\n[](#cb100-7)< [\"3\", \"\
  11111111112\", \"5\", \"111142\", \"6\"]\n```\n\n如果模式的某位于捕获组之外，则因此匹配到的文本将不会出现在输出中。如果捕获组没有参与匹配，它在输出数组中将由用\
  \ `undefined` 表示。\n\n```javascript\n[](#cb101-1)//这里 4?2 在捕获组之外，因此该部分不会出现在输出中\n\
  [](#cb101-2)> '31111111111251111426'.split(/(1*)4?2/)\n[](#cb101-3)< [\"3\", \"\
  1111111111\", \"5\", \"1111\", \"6\"]\n[](#cb101-4)\n[](#cb101-5)//多个捕获组示例\n[](#cb101-6)//注意：b+\
  \ 匹配的部分不在输出中\n[](#cb101-7)> '3.14aabccc42'.split(/(a+)b+(c+)/)\n[](#cb101-8)< [\"\
  3.14\", \"aa\", \"ccc\", \"42\"]\n[](#cb101-9)\n[](#cb101-10)//这里 (4)? 在第一次出现时匹配了\
  \ 0 次\n[](#cb101-11)> '31111111111251111426'.split(/(1*)(4)?2/)\n[](#cb101-12)<\
  \ [\"3\", \"1111111111\", undefined, \"5\", \"1111\", \"4\", \"6\"]\n```\n\n使用捕获组和可选的\
  \ `limit` 参数可以帮助你划分字符串：\n\n*   匹配之前的部分\n*   模式匹配的部分\n*   匹配之后部分\n\n## 在替换中使用函数\n\
  \n有时，简单的替换字符串是不够的，你需要对匹配部分进行一些处理。对于此类情况，你可以在 `replace` 方法在使用函数。提供给函数的参数与 `match`\
  \ 提供的类似。\n\n```javascript\n[](#cb103-1)> function titleCase(m, g1) {\n[](#cb103-2)\
  \  return m.toUpperCase() + g1.toLowerCase()\n[](#cb103-3) }\n[](#cb103-4)> 'aBc\
  \ ADC'.replace(/(a)(.*?)/, titleCase)\n[](#cb103-5)< \"Abc Adc\"\n```\n\n## 在替换中使用字典\n\
  \n有时可以通过使用字典简化替换。匹配部分充当键。\n\n```javascript\n[](#cb105-1)> let h = { '1': 'one',\
  \ '2': 'two', '4': 'four' }\n[](#cb105-2)> '923412'.replace(/1|2/g, k => h[k])\n\
  [](#cb105-3)< \"9two3fourone\"\n```\n\n如果字典中不存在该键，你可以提供一个默认值：\n\n```javascript\n\
  [](#cb105-4)> let h = { '1': 'one', '2': 'two', '4': 'four' }\n[](#cb105-5)> '923412'.replace(/1|2/g,\
  \ k => h[k] || 'X')\n[](#cb105-6)< \"9two3fourXX\"\n```\n\n## 交换或多个字符串\n\n为了在没有中间结果的情况下交换两个或多个字符串，建议使用字典。\n\
  \n```javascript\n[](#cb106-1)> let swap = { 'cat': 'tiger', 'tiger': 'cat' }\n[](#cb106-2)>\
  \ 'cat tiger dog'.replace(/cat|tiger/g, k => swap[k])\n[](#cb106-3)< \"tiger cat\
  \ dog\"\n```\n\n## 动态构建选择\n\n对于包含许多条目且可能在开发过程中变化的字典，手动构建选择列表不是很好的选择。此外，记住根据优先级规则，最长的字符串应该排在。`unionRegExp`\
  \ 函数在这里很有帮助。\n\n```javascript\n[](#cb107-1)> let d = { 'hand': 1, 'handy': 2, 'handful':\
  \ 3, 'a^b': 4 }\n[](#cb107-2)\n[](#cb107-3)> const p = unionRegExp(Object.keys(d).sort((a,\
  \ b) => b.length - a.length))\n[](#cb107-4)> console.log(p)\n[](#cb107-5)< handful|handy|hand|a\\\
  ^b\n[](#cb107-6)> 'handful hand pin handy (a^b)'.replace(new RegExp(p, 'g'), k =>\
  \ d[k])\n[](#cb107-7)< \"3 1 pin 2 (4)\"\n```\n\n## 速查表与总结\n\n| 注意 | 描述 |\n| ---\
  \ | --- |\n| `m = s.match(/pat/)` | 假设未使用 g 标志且正则成功，返回一个包含匹配部分和三个属性的数组 |\n| | |\
  \ `index` 属性给出匹配的起始位置 |\n| | | `input` 属性给出输入字符串 s |\n| | | `groups` 属性给出命名捕获组的字典\
  \ |\n| `m[0]` | 对于上述情况，给出整个匹配部分 |\n| `m[1]` | 第一个捕获组的匹配部分 |\n| `m[2]` | 第二个捕获组的匹配部分，以此依此类推\
  \ |\n\n\n\n\n| `s.match(/pat/g)` | 仅返回匹配部分，不包含属性 |\n| | 捕获组不影响输出 |\n| | 如果正则失败，`match`\
  \ 返回 `null` |\n| `s.matchAll(/pat/g)` | 返回一个包含详细信息的迭代器 |\n| | 用于每个匹配部分及其属性 |\n|\
  \ | 使用 `[...]` 或 `Array.from` 转换为数组 |\n| | `Array.from` 同时也允许映射函数 |\n| `s.replace(/pat/,\
  \ func)` | 你可以使用函数来提供替换字符串 |\n| | 每个匹配部分的详细信息将作为参数传递 |\n| | 同样，可以使用字典进行替换 |\n| `s.search(/pat/)`\
  \ | 如果正则成功，返回第一个匹配的起始位置 |\n| | 如果正则失败，则返回 `-1` |\n\n本章介绍了 `match` 和 `matchAll` 方法，它们允许你处理输入字符串的各种匹配部分。如果你只需要第一个匹配的起始位置，`search`\
  \ 方法会非常好用。`replace` 方法允许你使用函数作为替换，这有助于在将匹配部分作为替换字符串使用之前对其进行处理。你还可以使用字典根据匹配部分作为键来提供替换字符串。你已经学习了捕获组，在后续章节中将看到更多分组的用法。\n\
  \n## 练习题\n\n**a)** 对于给定的字符串，从第一个 `is` 到最后一个 `t` 提取匹配部分。\n\n```\n[](#cb108-1)> let\
  \ str1 = 'What is the biggest fruit you have seen?'\n[](#cb108-2)> let str2 = 'Your\
  \ mission is to read and practice consistently'\n[](#cb108-3)\n[](#cb108-4)> const\
  \ pat1 =      // 在此处添加你的解决方案\n[](#cb108-5)\n[](#cb108-6)// 为 str1 在此处添加你的解决方案\n\
  [](#cb108-7)< \"is the biggest fruit\"\n[](#cb108-8)// 为 str2 在此处添加你的解决方案\n[](#cb108-9)<\
  \ \"ission is to read and practice consistent\"\n```\n\n**b)** 找到给定输入字符串中 `is`、`the`、`was`\
  \ 或 `to` 第一次出现的起始索引。假设每个输入字符串至少有一个匹配项。\n\n```\n[](#cb109-1)> let s1 = 'match after\
  \ the last newline character'\n[](#cb109-2)> let s2 = 'and then you want to test'\n\
  [](#cb109-3)> let s3 = 'this is good bye then'\n[](#cb109-4)> let s4 = 'who was\
  \ there to see?'\n[](#cb109-5)\n[](#cb109-6)> const pat2 =      // 在此处添加你的解决方案\n\
  [](#cb109-7)\n[](#cb109-8)// 为 s1 在此处添加你的解决方案\n[](#cb109-9)< 12\n[](#cb109-10)//\
  \ 为 s2 在此处添加你的解决方案\n[](#cb109-11)< 4\n[](#cb109-12)// 为 s3 在此处添加你的解决方案\n[](#cb109-13)<\
  \ 2\n[](#cb109-14)// 为 s4 在此处添加你的解决方案\n[](#cb109-15)< 4\n```\n\n**c)** 找到给定输入字符串中\
  \ `is`、`the`、`was` 或 `to` 最后一次出现的起始索引。假设每个输入字符串至少有一个匹配项。\n\n```\n[](#cb110-1)> let\
  \ s1 = 'match after the last newline character'\n[](#cb110-2)> let s2 = 'and then\
  \ you want to test'\n[](#cb110-3)> let s3 = 'this is good bye then'\n[](#cb110-4)>\
  \ let s4 = 'who was there to see?'\n[](#cb110-5)\n[](#cb110-6)> const pat3 =   \
  \   // 在此处添加你的解决方案\n[](#cb110-7)\n[](#cb110-8)// 为 s1 在此处添加你的解决方案\n[](#cb110-9)<\
  \ 12\n[](#cb110-10)// 为 s2 在此处添加你的解决方案\n[](#cb110-11)< 18\n[](#cb110-12)// 为 s3\
  \ 在此处添加你的解决方案\n[](#cb110-13)< 17\n[](#cb110-14)// 为 s4 在此处添加你的解决方案\n[](#cb110-15)<\
  \ 14\n```\n\n**d)** 给定的输入字符串恰好包含一个 `:`。提取 `:` 之后的所有字符作为输出。\n\n```\n[](#cb111-1)>\
  \ let ip = 'fruits:apple, mango, guava, blueberry'\n[](#cb111-2)\n[](#cb111-3)//\
  \ 在此处添加你的解决方案\n[](#cb111-4)< \"apple, mango, guava, blueberry\"\n```\n\n**e)** 从给定的输入字符串中提取\
  \ `(` 和 `)` 之间的所有单词作为数组（包括括号）。假设输入不会包含任何破损的括号。\n\n```\n[](#cb112-1)> let ip = 'another\
  \ (way) to reuse (portion) matched (by) capture groups'\n[](#cb112-2)\n[](#cb112-3)//\
  \ 在此处添加你的解决方案\n[](#cb112-4)< [\"(way)\", \"(portion)\", \"(by)\"]\n```\n\n**f)**\
  \ 提取所有 `<` 直到下一个 `>`，前提是 `<` 和 `>` 之间至少有一个字符。\n\n```\n[](#cb113-1)> let ip = 'a<apple>\
  \ 1<> b<bye> 2<> c<cat>'\n[](#cb113-2)\n[](#cb113-3)// 在此处添加你的解决方案\n[](#cb113-4)<\
  \ [\"<apple>\", \"<> b<bye>\", \"<> c<cat>\"]\n```\n\n**g)** 使用 `matchAll` 为给定的输入字符串获取如下所示的输出。仔细注意输入字符串中使用的字符。\n\
  \n```\n[](#cb114-1)> let row1 = '-2,5 4,+3 +42,-53 4356246,-357532354 '\n[](#cb114-2)>\
  \ let row2 = '-2,5 4,+3 +42,-53 4356246,-357532354 '\n```\n\n\n\n包含在 `[]` 元字符内部的字符是字符类（或字符集）。它将导致匹配匹配这些字符中的任意一个。这类似于在分组内部使用单字符交替，但没有捕获组的额外副作用。此外，字符类有它们自己的元字符版本，并为常见用例提供了特殊的预定义集合。量化也适用于字符类。\n\
  \n```\n[](#cb119-1)// same as: /cot|cut/ or /c(o|u)t/\n[](#cb119-2)> ['cute', 'cat',\
  \ 'cot', 'coat', 'cost'].filter(w => /c[ou]t/.test(w))\n[](#cb119-3)< [\"cute\"\
  , \"cot\"]\n[](#cb119-4)\n[](#cb119-5)// same as: /(a|e|o)+t/g\n[](#cb119-6)> 'meeting\
  \ cute boat site foot'.replace(/[aeo]+t/g, 'X')\n[](#cb119-7)< \"mXing cute bX site\
  \ fX\"\n[](#cb119-8)\n[](#cb119-9)> 'Sample123string42with777numbers'.match(/[0123456789]+/g)\n\
  [](#cb119-10)< [\"123\", \"42\", \"777\"]\n```\n\n## 字符范围\n\n字符类有它们自己的元字符来帮助简洁地定义集合。字符类外的元字符（如\
  \ `^`、`$`、`()` 等）在字符类内部没有特殊含义，或者具有完全不同的含义。首先是 `-` 元字符，它帮助定义字符范围，而无需逐个指定所有字符。\n\n\
  ```\n[](#cb120-1)// all digits\n[](#cb120-2)> 'Sample123string42with777numbers'.match(/[0-9]+/g)\n\
  [](#cb120-3)< [\"123\", \"42\", \"777\"]\n[](#cb120-4)\n[](#cb120-5)// whole words\
  \ made up of lowercase alphabets and digits only\n[](#cb120-6)> 'coat Bin food tar12\
  \ best'.match(/\\b[a-z0-9]+\\b/g)\n[](#cb120-7)< [\"coat\", \"food\", \"tar12\"\
  , \"best\"]\n[](#cb120-8)\n[](#cb120-9)// whole words made up of lowercase alphabets,\
  \ but starting with 'p' to 'z'\n[](#cb120-10)> 'coat tin food put stoop best'.match(/\\\
  b[p-z][a-z]*\\b/g)\n[](#cb120-11)< [\"tin\", \"put\", \"stoop\"]\n[](#cb120-12)\n\
  [](#cb120-13)// whole words made up of only 'a' to 'f' and 'p' to 't' lowercase\
  \ alphabets\n[](#cb120-14)> 'coat tin food put stoop best'.match(/\\b[a-fp-t]+\\\
  b/g)\n[](#cb120-15)< [\"best\"]\n```\n\n## 否定字符集\n\n`^` 元字符必须指定为字符类的第一个字符。它否定该集合，因此将匹配除指定字符以外的所有字符。\n\
  \n```\n[](#cb121-1)// all non-digits\n[](#cb121-2)> 'Sample123string42with777numbers'.match(/[⁰-9]+/g)\n\
  [](#cb121-3)< [\"Sample\", \"string\", \"with\", \"numbers\"]\n[](#cb121-4)\n[](#cb121-5)//\
  \ deleting characters from start of string based on a delimiter\n[](#cb121-6)> 'foo=42;\
  \ baz=123'.replace(/^[^=]+/, '')\n[](#cb121-7)< \"=42; baz=123\"\n[](#cb121-8)>\
  \ 'foo:123:bar:baz'.replace(/^([^:]+:){2}/, '')\n[](#cb121-9)< \"bar:baz\"\n[](#cb121-10)\n\
  [](#cb121-11)// deleting characters at end of string based on a delimiter\n[](#cb121-12)>\
  \ 'foo=42; baz=123'.replace(/=[^=]+$/, '')\n[](#cb121-13)< \"foo=42; baz\"\n```\n\
  \n如前所述，处理否定逻辑时要小心，因为你可能会匹配到比你想要的更多的内容。有时，使用正字符类并反转测试条件比使用否定字符类更简单。\n\n```\n[](#cb122-1)>\
  \ let words = ['tryst', 'fun', 'glyph', 'pity', 'why']\n[](#cb122-2)\n[](#cb122-3)//\
  \ elements not containing vowel characters\n[](#cb122-4)> words.filter(w => /^[^aeiou]+$/.test(w))\n\
  [](#cb122-5)< [\"tryst\", \"glyph\", \"why\"]\n[](#cb122-6)\n[](#cb122-7)// easier\
  \ to write and maintain, note the use of '!' operator\n[](#cb122-8)// but this'll\
  \ match empty strings too unlike the previous solution\n[](#cb122-9)> words.filter(w\
  \ => !/[aeiou]/.test(w))\n[](#cb122-10)< [\"tryst\", \"glyph\", \"why\"]\n```\n\n\
  ## 字面匹配元字符\n\n与其他元字符类似，在字符类元字符前加上前缀 `\\` 以字面形式匹配它们。某些字符可以通过不同的位置来实现。\n\n`-` 应该是第一个或最后一个字符，或者使用\
  \ `\\` 进行转义。\n\n```\n[](#cb123-1)> 'ab-cd gh-c 12-423'.match(/\\b[a-z-]{2,}\\b/g)\n\
  [](#cb123-2)< [\"ab-cd\", \"gh-c\"]\n[](#cb123-3)\n[](#cb123-4)> 'ab-cd gh-c 12-423'.match(/\\\
  b[a-z\\-0-9]{2,}\\b/g)\n[](#cb123-5)< [\"ab-cd\", \"gh-c\", \"12-423\"]\n```\n\n\
  `^` 应该不是第一个字符，或者使用 `\\` 进行转义。\n\n```\n[](#cb124-1)> 'f*(a^b) - 3*(a+b)'.match(/a[+^]b/g)\n\
  [](#cb124-2)< [\"a^b\", \"a+b\"]\n[](#cb124-3)\n[](#cb124-4)> 'f*(a^b) - 3*(a+b)'.match(/a[\\\
  ^+]b/g)\n[](#cb124-5)< [\"a^b\", \"a+b\"]\n```\n\n[` 不需要转义，但如果你愿意也可以进行转义。`]` 应该用\
  \ `\\` 进行转义。\n\n```\n[](#cb125-1)> 'words[5] = tea'.match(/[a-z[\\]0-9]+/)[0]\n\
  [](#cb125-2)< \"words[5]\"\n```\n\n\n\n本章重点介绍了如何创建自定义占位符以匹配有限的字符集。分组和字符类可以被视为两个层级的抽象。一方面，你可以在\
  \ `[]` 内部使用字符集；另一方面，你可以在 `()` 内部包含多个交替的分组，其中也包括字符类。由于锚定符和量词可以应用于这两种抽象，因此你可以开始看到正则表达式是如何被视为一种微编程语言的。在接下来的章节中，你甚至会看到如何在某些场景下实现类似于反向字符类的分组反向（否定）。\n\
  \n## 练习题\n\n**a)** 对于数组 `items`，过滤出所有以 `hand` 开头并以 `s`、`y` 或 `le` 结尾的元素。中间不能有其他字符，例如，`hands`\
  \ 应该匹配，但 `hand-has` 不匹配。\n\n```\n[](#cb130-1)> let items = ['-handy', 'hand', 'handy',\
  \ 'handled', 'hands', 'handle']\n[](#cb130-2)\n[](#cb130-3)//在此处添加你的解决方案\n[](#cb130-4)<\
  \ [\"handy\", \"hands\", \"handle\"]\n```\n\n**b)** 将所有完整的单词 `reed`、`read` 或 `red`\
  \ 替换为 `X`。\n\n```\n[](#cb131-1)> let ip = 'redo red credible :read: rod reed bred'\n\
  [](#cb131-2)\n[](#cb131-3)//在此处添加你的解决方案\n[](#cb131-4)< \"redo X credible :X: rod\
  \ X bred\"\n```\n\n**c)** 对于数组 `words`，过滤出所有包含 `e` 或 `i` 且后紧跟 `l` 或 `n` 的元素。请注意应该遵循提到的顺序。\n\
  \n```\n[](#cb132-1)> let words = ['surrender', 'unicorn', 'newer', 'door', 'empty',\
  \ 'eel', 'pest']\n[](#cb132-2)\n[](#cb132-3)//在此处添加你的解决方案\n[](#cb132-4)< [\"surrender\"\
  , \"unicorn\", \"eel\"]\n```\n\n**d)** 对于数组 `words`，过滤出所有以任意顺序包含 `e` 或 `i` 以及 `l`\
  \ 或 `n` 的元素。\n\n```\n[](#cb133-1)> let words = ['surrender', 'unicorn', 'newer',\
  \ 'door', 'empty', 'eel', 'pest']\n[](#cb133-2)\n[](#cb133-3)//在此处添加你的解决方案\n[](#cb133-4)<\
  \ [\"surrender\", \"unicorn\", \"newer\", \"eel\"]\n```\n\n**e)** 提取所有十六进制字符序列，带有可选的\
  \ `0x` 前缀。匹配时不区分大小写，且序列不应被其他单词字符围绕。\n\n```\n[](#cb134-1)> let str1 = '128A foo 0xfe32\
  \ 34 0xbar'\n[](#cb134-2)> let str2 = '0XDEADBEEF place 0x0ff1ce bad'\n[](#cb134-3)\n\
  [](#cb134-4)> const hex_seq =       //在此处添加你的解决方案\n[](#cb134-5)\n[](#cb134-6)> str1.match(hex_seq)\n\
  [](#cb134-7)< [\"128A\", \"0xfe32\", \"34\"]\n[](#cb134-8)> str2.match(hex_seq)\n\
  [](#cb134-9)< [\"0XDEADBEEF\", \"0x0ff1ce\", \"bad\"]\n```\n\n**f)** 删除从 `(` 到下一个\
  \ `)` 的内容，除非它们之间包含了括号字符。\n\n```\n[](#cb135-1)> let str1 = 'def factorial()'\n[](#cb135-2)>\
  \ let str2 = 'a/b(division) + c%d(#modulo) - (e+(j/k-3)*4)'\n[](#cb135-3)> let str3\
  \ = 'Hi there(greeting). Nice day(a(b)'\n[](#cb135-4)\n[](#cb135-5)> const remove_parentheses\
  \ =        //在此处添加你的解决方案\n[](#cb135-6)\n[](#cb135-7)> str1.replace(remove_parentheses,\
  \ '')\n[](#cb135-8)< \"def factorial\"\n[](#cb135-9)> str2.replace(remove_parentheses,\
  \ '')\n[](#cb135-10)< \"a/b + c%d - (e+*4)\"\n[](#cb135-11)> str3.replace(remove_parentheses,\
  \ '')\n[](#cb135-12)< \"Hi there. Nice day(a\"\n```\n\n**g)** 对于数组 `words`，过滤出所有不以\
  \ `e`、`p` 或 `u` 开头的元素。\n\n```\n[](#cb136-1)> let words = ['surrender', 'unicorn',\
  \ 'newer', 'door', 'empty', 'eel', 'pest']\n[](#cb136-2)\n[](#cb136-3)//在此处添加你的解决方案\n\
  [](#cb136-4)< [\"surrender\", \"newer\", \"door\"]\n```\n\n**h)** 对于数组 `words`，过滤出所有不包含\
  \ `u`、`w`、`ee` 或 `-` 的元素。\n\n```\n[](#cb137-1)> let words = ['p-t', 'you', 'tea',\
  \ 'heel', 'owe', 'new', 'reed', 'ear']\n[](#cb137-2)\n[](#cb137-3)//在此处添加你的解决方案\n\
  [](#cb137-4)< [\"tea\", \"ear\"]\n```\n\n**i)** 给定的输入字符串包含由 `,` 分隔的字段，且字段可以为空。将最后三个字段替换为\
  \ `WHTSZ323`。\n\n```\n[](#cb138-1)> let row1 = '(2),kite,12,,D,C,,'\n[](#cb138-2)>\
  \ let row2 = 'hi,bye,sun,moon'\n[](#cb138-3)\n[](#cb138-4)> const pat1 =      //在此处添加你的解决方案\n\
  [](#cb138-5)\n[](#cb138-6)//为 row1 在处添加你的解决方案\n[](#cb138-7)< \"(2),kite,12,,D,WHTSZ323\"\
  \n[](#cb138-8)//为 row2 在此处添加你的解决方案\n[](#cb138-9)< \"hi,WHTSZ323\"\n```\n\n**j)**\
  \ 根据连续的数字或空白字符序列对给定字符串进行分割。\n\n```\n[](#cb139-1)> let s1 = 'lion \\t Ink32onion\
  \ Nice'\n[](#cb139-2)> let s2 = '**1\\f2\\n3star\\t7 77\\r**'\n[](#cb139-3)\n[](#cb139-4)>\
  \ const pat2 =      //在此处添加你的解决方案\n[](#cb139-5)\n[](#cb139-6)> s1.split(pat2)\n\
  [](#cb139-7)< [\"lion\", \"Ink\", \"onion\", \"Nice\"]\n[](#cb139-8)> s2.split(pat2)\n\
  [](#cb139-9)< [\"**\", \"star\", \"**\"]\n```\n\n**k)** 删除所有 `<characters>` 序列，其中\
  \ `characters` 是一个或多个非 `>` 字符且不能为空。\n\n```\n[](#cb140-1)> let ip = 'a<apple> 1<>\
  \ b<bye> 2<> c<cat>'\n[](#cb140-2)\n[](#cb140-3)//在此处添加你的解决方案\n[](#cb140-4)< \"\
  a 1<> b 2<> c\"\n```\n\n**l)** `\\ba-z[a-z]\\b` 等于 `\\b[a-z][on]{2}[a-z]\\b`。正确或错误？下方显示的示例输入行可能帮助你理解是否存在任何差异。\n\
  \n```\n[](#cb141-1)> console.log('known\\nmood\\nknow\\npony\\ninns')\n[](#cb141-2)\
  \  known\n[](#cb141-3)  mood\n[](#cb141-4)  know\n[](#cb141-5)  pony\n[](#cb141-6)\
  \  inns\n```\n\n**m)** 对于给定数组，过滤出所有包含大于 `624` 的数字序列的元素。\n\n```\n[](#cb142-1)> let\
  \ items = ['a1', 'b22', 'c33', 'd444']\n[](#cb142-2)\n[](#cb142-3)//在此处添加你的解决方案\n\
  [](#cb142-4)< [\"b22\", \"d444\"]\n```\n\n**n)** 将给定字符串转换为下方的数组。\n\n```\n[](#cb143-1)>\
  \ let ip = 'price_42 roast^\\tice==ast'\n[](#cb143-2)\n[](#cb143-3)//在此处添加你的解决方案\n\
  [](#cb143-4)< [\"price_42\", \"roast^\\tice==ast\"]\n```\n\n**o)** 过滤所有第一个空白字符不是\
  \ `#` 的元素。仅由空白组成的元素应被忽略。\n\n```\n[](#cb144-1)> let items = ['    #comment', '\\\
  t\\napple42', '#oops', 'sure', 'no#1', '\\t']\n[](#cb144-2)\n[](#cb144-3)//在此处添加你的解决方案\n\
  [](#cb144-4)< [\"\\napple42\", \"sure\", \"no#1\"]\n```\n\n**p)** 对于给定字符串，为所有单词加上\
  \ `{}`，但 `par` 和 `cat` 除外。\n\n```\n[](#cb145-1)> let ip = 'part; cat {super} rest_42\
  \ par scatter'\n[](#cb145-2)\n[](#cb145-3)//在此处添加你的解决方案\n[](#cb145-4)< (wait, 示例输出未完成)\n\
  ```\n\n本章将介绍如何在正则定义和替换部分中通过反向引用来重用分组捕获的部分。你还将学习在普通捕获组不足时的某些特殊分组语法。\n\n## 反向引用\n\n\
  首先，如何在正则定义和替换部分中直接引用捕获组。你已经学习过如何使用 `match` 和 `matchAll` 方法引用被捕获的文本。你也学习过如何在 `replace`\
  \ 方法中将捕获的部分传递给函数。更直接地，你可以使用反向引用 `\\N`（正则定义内部）和 `$N`（替换部分），其中 `N` 是你想要的捕获组。此外，在正则定义中使用时，还可以对反向引用应用量词。所有的形式列举如下：\n\
  \n*   在替换部分，使用 `$1`、 `$2` 等引用对应的捕获组\n\n*   在替换部分，使用 `$&` 引用整个匹配部分\n\n    *   ``\
  \ $` `` 获取匹配部分之前的字符串\n\n    *   `$'` 获取匹配部分之后的字符串\n\n*   在正则定义内部，使用 `\\1`、`\\2`\
  \ 等引用对应的捕获组\n\n\n\n\n```javascript\n// remove square brackets that surround digit\
  \ characters\n> '[52] apples [and] [31] mangoes'.replace(/\\[(\\d+)\\]/g, '$1')\n\
  < \"52 apples [and] 31 mangoes\"\n\n// replace __ with _ and delete _ if it is alone\n\
  > '_foo_ __123__ _baz_'.replace(/(_)?_/g, '$1')\n< \"foo _123_ baz\"\n\n// swap\
  \ words that are separated by a comma\n> 'good,bad 42,24'.replace(/(\\w+),(\\w+)/g,\
  \ '$2,$1')\n< \"bad,good 24,42\"\n```\n\n以下是一些使用默认提供的反引用而无需捕获组的示例。\n\n```javascript\n\
  // add something around the entire matched portion\n> '52 apples and 31 mangoes'.replace(/\\\
  d+/g, '($&)')\n< \"(52) apples and (31) mangoes\"\n> 'Hello world'.replace(/.*/,\
  \ 'Hi. $&. Have a nice day')\n< \"Hi. Hello world. Have a nice day\"\n\n// duplicate\
  \ first field and add it as last field\n> 'fork,42,nice,3.14'.replace(/,.+/, '$&,$`')\n\
  < \"fork,42,nice,3.14,fork\"\n```\n\n以下是一些在正则表达式定义中使用反引用的示例。\n\n```javascript\n\
  // elements that have at least one consecutive repeated word character\nlet words\
  \ = ['moon', 'mono', 'excellent', 'poll']\n> words.filter(w => /(\\w)\\1/.test(w))\n\
  < [\"moon\", \"excellent\", \"poll\"]\n\n// remove any number of consecutive duplicate\
  \ words separated by space\n// note the use of quantifier on backreference\n// use\
  \ \\W+ instead of space to cover cases like 'a;a<-;a'\n> 'aa a a a 42 f_1 f_1 f_13.14'.replace(/\\\
  b(\\w+)(  \\1)+\\b/g, '$1')\n< \"aa a 42 f_1 f_13.14\"\n```\n\n## 反引用的特殊情况\n\n由于\
  \ `$` 在替换部分是特殊字符，当它后面跟着数字时，将其字面插入会遇到问题。通常使用转义来实现此目的，但在这里你需要使用 `$$`。\n\n```javascript\n\
  // no capture group used, so '$1' is inserted literally\n> 'cat'.replace(/a/, '{$1}')\n\
  < \"c{$1}t\"\n// capture group used, '\\$1' is same as '$1' here\n> 'cat'.replace(/(a)/,\
  \ '{\\$1}')\n< \"c{a}t\"\n// use '$$' to avoid backreference and insert '$' literally\n\
  > 'cat'.replace(/(a)/, '{$$1}')\n< \"c{$1}t\"\n```\n\n另一个问题是，当普通数字紧跟在反引用后面时，如何避免歧义？这取决于模式中存在多少个反引用，以及你需要在正则表达式定义中还是替换部分避免歧义。例如，如果组少于\
  \ 10 个，那么类似于 `$12` 将引用第一个捕获组，并将 `2` 视为字符。如果没有捕获组，那么类似于 `$5` 将被字面插入为 `$` 和 `5`。\n\
  \n```javascript\n// $15 here will backreference 1st group and use 5 as a character\n\
  > '[52] apples and [31] mangoes'.replace(/\\[(\\d+)\\]/g, '($15)')\n< \"(525) apples\
  \ and (315) mangoes\"\n\n// $3 will be inserted literally since there is only one\
  \ capture group\n> '[52] apples and [31] mangoes'.replace(/\\[(\\d+)\\]/g, '$3')\n\
  < \"$3 apples and $3 mangoes\"\n\n// $1 will be inserted literally since there are\
  \ no capture groups\n> '[52] apples and [31] mangoes'.replace(/\\[\\d+\\]/g, '$1')\n\
  < \"$1 apples and $1 mangoes\"\n```\n\n另一方面，如果你有超过 `9` 个但少于 `100` 个组，那么当你引用单个组并在后跟数字时就会出现问题。解决方法是在前面前缀\
  \ `0`，使得 `$` 后面的数字位数等于最高捕获组所需的数字位数。因此，如果你有超过 `9` 个但少于 `100` 个组，`$05` 将引用第 `5` 个捕获组，之后的任何数字都将被视为字面量。\n\
  \n```javascript\n// 为了说明目的，定义了 12 个捕获组\n// 如果你想引用 2 位的组，则没有问题\n> 'abcdefghijklmn'.replace(/(.)(.)(.)(.)(.)(.)(.)(.)(.)(.)/,\
  \ '$11') // 等，这个逻辑不是我想展示的。\n// 前缀 '0' 使得 '$01' 变成引用，而 '1' 变成字符\n> 'abcdefghijklmn'.replace(/(.)(.)(.)(.)(.)(.)(.)(.)(.)(.)/,\
  \ '$01') // \n```\n\n正则表达式定义中的解决方法更简单。`0` 前缀技巧不起作用，但使用 ASCII 码 `\\xh` 是起的。例如，`\\\
  11` 将引用第一个捕获组，并在后面跟 `1` 作为字符。\n\n```javascript\n> 'abcdefghijklna1d'.replace(/(.)(.)(.)(.)(.)(.)(.)(.)(.)(.).).*\\\
  11/, 'X')\n< \"Xd\"\n```\n\n## 非捕获组\n\n分组有许多用途，例如对正则表达式部分应用量化、通过提取公共部分创建精简的正则表达式等。它还会影响\
  \ `split` 方法的输出，如带捕获组的 split 所示。与其他语言中的类似方法不同，带有 `g` 标志的 `match` 方法不受受捕获组的影响，并返回整个匹配部分。\n\
  \n```javascript\n// 没有捕获组的 split 方法\n> 'Sample123string42with777numbers'.split(/\\\
  d+/)\n< [\"Sample\", \"string\", \"with\", \"numbers\"]\n// 带捕获组的 split 方法\n> 'Sample123string42with777numbers'.split(/(\\\
  d+)/)\n< [\"Sample\", \"123\", \"string\", \"42\", \"with\", \"777\", \"numbers\"\
  ]\n\n// 使用 'g' 标志和捕获组的 match 方法示例\n> 'effort flee oddball rat tool'.match(/\\b\\\
  w*(\\w)\\1\\w*\\b/g)\n< [\"effort\", \"flee\", \"oddball\", \"tool\"]\n// 另一个示例\n\
  > 'hi 123123 bye 456123'.match(/(123)+/g)\n< [\"123123\", \"123\"]\n```\n\n当不需要反引用时，可以使用非捕获组来避免\
  \ `split` 方法的行为变化。当特定组不需要反引用时，它也有助于避免捕获组编号。语法是 `(?:pat)` 来定义非捕获组，其中 `pat` 是正则表达式部分的缩写。更多以\
  \ `(?` 开头的特殊组将在以后讨论。\n\n```javascript\n// 这里，需要分组来提取公共部分并应用量化\n// 但使用捕获组将产生预期的输出\n\
  > '123hand42handy777ful500'.split(/hand(y|ful)?/)\n< [\"123\", undefined, \"42\"\
  , \"y\", \"777\", \"ful\", \"500\"]\n// 非捕获组救了场\n> '123hand42handy777ful500'.split(/hand(?:y|ful)?/)\n\
  < [\"123\", \"42\", \"777\", \"500\"]\n\n// 使用普通分组，需要跟踪所有的组\n> '1,2,3,4,5,6,7'.replace(/^(([^,]+,){3})([^,]+)/,\
  \ '$1($3)')\n< \"1,2,3,(4),5,6,7\"\n// 使用非捕获组，只需要跟踪组\n> '1,2,3,4,5,6,7'.replace(/^((?:[^,]+,){3})([^,]+)/,\
  \ '$1($2)')\n< \"1,2,3,(4),5,6,7\"\n```\n\n引用带有量化器的捕获组匹配的文本将只给出最后一次匹配，而不是整个匹配。将分组和量化一起包裹在捕获组中以获取整个匹配部分。\n\
  \n\n\n\n\n```\n[](#cb155-1)// '$1' 现在仅包含第四个字段\n[](#cb155-2)> 'so:cat:rest:in:put:to'.replace(/^([^:]+:){4}/,\
  \ '($1)')\n[](#cb155-3)< \"(in:)put:to\"\n[](#cb155-4)\n[](#cb155-5)// '$1' 现在将包含整个匹配部分\n\
  [](#cb155-6)> 'so:cat:rest:in:put:to'.replace(/^((?:[^:]+:){4})/, '($1)')\n[](#cb155-7)<\
  \ \"(so:cat:rest:in:)put:to\"\n```\n\n## 具名捕获组\n\n即使对于经验丰富的程序员来说，`Regexp` 也可能会变得晦涩且难以维护。有几种结构可以帮助增加清晰度。其中一种就是为捕获组命名，并使用该名称进行反向引用，而不是使用纯数字。此外，命名捕获组部分可以使用\
  \ `groups` 属性以键值对的形式提取。其语法如下：\n\n- `(?<name>pat)` 用于为捕获组命名\n- `\\k<name>` 在正则定义中用于反向引用\n\
  - `$<name>` 在替换部分中用于反向引用\n\n```\n[](#cb156-1)> let row = 'today,2008-03-24,food,2008-03-24,nice,2018-10-25,5632'\n\
  [](#cb156-2)\n[](#cb156-3)// 等同于 /(\\d{4}-\\d{2}-\\d{2}).*\\1/\n[](#cb156-4)> row.match(/(?<date>\\\
  d{4}-\\d{2}-\\d{2}).*\\k<date>/)[0]\n[](#cb156-5)< \"2008-03-24,food,2008-03-24\"\
  \n[](#cb156-6)\n[](#cb156-7)// 给第一个和第二个捕获的单词命名\n[](#cb156-8)// 等同于 replace(/(\\\
  w+),(\\w+)/g, '$2,$1')\n[](#cb156-9)> 'good,bad 42,24'.replace(/(?<fw>\\w+),(?<sw>\\\
  w+)/g, '$<sw>,$<fw>')\n[](#cb156-10)< \"bad,good 24,42\"\n```\n\n这是一个使用 `groups`\
  \ 属性的示例。\n\n```\n[](#cb157-1)> let m = '2018-10-25,car'.match(/(?<date>[^,]+),(?<product>[^,]+)/)\n\
  [](#cb157-2)\n[](#cb157-3)> m.groups\n[](#cb157-4)< {date: \"2018-10-25\", product:\
  \ \"car\"}\n[](#cb157-5)> m.groups.date\n[](#cb157-6)< \"2018-10-25\"\n[](#cb157-7)>\
  \ m.groups.product\n[](#cb157-8)< \"car\"\n```\n\n## 速查表与总结\n\n| 注意 | 说明 |\n| ---\
  \ | --- |\n| 反向引用 | 给出第 N 个捕获组的匹配部分 |\n| | 在替换部分中使用 `$1`, `$2`, `$3` 等 |\n| | `$&`\
  \ 给出整个匹配部分 |\n| | `` `$ `` 给出匹配部分之前的字符串 |\n| | `$'` 给出匹配部分之后的字符串 |\n| | 在正则定义中使用\
  \ `\\1`, `\\2`, `\\3` 等 |\n| `$$` | 在替换部分中插入字面量 `$` |\n| `$0N` | 与 `$N` 相同，允许分离反向引用与其他数字\
  \ |\n| `\\N\\xhh` | 允许在正则定义中分离反向引用和数字 |\n| `(?:pat)` | 非捕获组 |\n| `(?<name>pat)`\
  \ | 具名捕获组 |\n| | 在正则定义中使用 `\\k<name>` 进行反向引用 |\n| | 在替换部分中使用 `$<name>` 进行反向引用 |\n\
  | | 具名捕获也可以通过 `groups` 属性访问 |\n\n本章涵盖了许多与分组相关的特性——通过反向引用获取捕获组的匹配部分，以及通过命名分组来增加清晰度。当捕获组的结果导致非预期行为时（例如\
  \ `split` 方法），你可以使用非捕获组。你将在断言 章节中看到更多此类特殊组。\n\n## 练习\n\n**a)** 将以 `a` 或 `r` 结尾的单词后的空格替换为换行符。\n\
  \n```\n[](#cb158-1)> let ip = 'area not a _a2_ roar took 22'\n[](#cb158-2)\n[](#cb158-3)>\
  \ console.log()     //在此处添加你的解决方案\n[](#cb158-4)  area\n[](#cb158-5)  not a\n[](#cb158-6)\
  \  _a2_ roar\n[](#cb158-7)  took 22\n```\n\n**b)** 在以 `s` 开头且包含 `e` 和 `t`（顺序不限）的单词周围加上\
  \ `[]`。\n\n```\n[](#cb159-1)> let ip = 'sequoia subtle exhibit asset sets tests\
  \ site'\n[](#cb159-2)\n[](#cb159-3)//在此处添加你的解决方案\n[](#cb159-4)< \"sequoia [subtle]\
  \ exhibit asset [sets] tests [site]\"\n```\n\n**c)** 将所有开头和结尾单词字符相同的整词替换为 `X`。单字符单词也应该被替换为\
  \ `X`，因为它满足了所述条件。\n\n```\n[](#cb160-1)> let ip = 'oreo not a _a2_ roar took 22'\n\
  [](#cb160-2)\n[](#cb160-3)//在此处添加你的解决方案\n[](#cb160-4)< \"X not X X X took X\"\n\
  ```\n\n**d)** 将给定的 **markdown** 标题转换为相应的**锚**标签。假设输入以一个或多个 `#` 字符开头跟着空格和单词。`name`\
  \ 属性通过将标题转换为小写并将空格替换为连字符来构建。\n\n```\n[](#cb161-1)> let header = '# Header'\n[](#cb161-2)>\
  \ let header2 = '# Another Header'\n[](#cb161-3)> // 使用捕获组？\n[](#cb161-4)> function\
  \ hyphenify(m) {\n[](#cb161-5) //在此处添加你的解决方案\n[](#cb161-6) }\n[](#cb161-7)> console.log(hyphenify(header))\n\
  [](#cb161-8)< <a name='header'>\n[](#cb161-9)> //等等，对 header2 起效吗？\n[](#cb161-10)>\
  \ console.log(hyphenify(header2))\n[](#cb161-11)< <a name='another-header'>\n```\n\
  \n**e)** 将 **markdown** 标题转换为相应的**超链接**。\n\n```\n[](#cb162-1)> let header1 = '#\
  \ Header'\n[](#cb162-2)> let header2 = '# Another Header'\n[](#cb162-3)> //在此处添加你的解决方案\n\
  [](#cb162-4)\n[](#cb162-5)> <a href='#header'>Header</a>\n[](#cb162-6)> <a href='#another-header'>Another\
  \ Header</a>\n```\n\n**f)** 检查给定字符串是否不区分大小写包含至少两个连续的**字母**。\n\n```\n[](#cb163-1)>\
  \ let s1 = 'readable'\n[](#cb163-2)> let s2 = 'rotational'\n[](#cb163-3)> let s3\
  \ = 'needed'\n[](#cb163-4)> let s4 = 'off' function check(s) {\n[](#cb163-5)> //在此处添加你的解决方案\n\
  [](#cb163-6) }\n[](#cb163-7)> console.log(check(s1))\n[](#cb163-8)< true\n[](#cb163-9)>\
  \ console.log(check(s2))\n[](#cb163-10)< false\n[](#cb163-11)> console.log(check(s3))\n\
  [](#cb163-12)< false\n[](#cb163-13)> console.log(check(s4))\n[](#cb163-14)< false\n\
  ```\n\n**g)** 对于给字符串，将所有数字序列替换为唯一的**重复**序列。\n\n```\n[](#cb164-1)> let ip = '1234\
  \ 2323 45354535 9339 1 60260'\n[](#cb164-2)\n[](#cb164-3)//在此处添加你的解决方案\n[](#cb164-4)<\
  \ \"1234 23 45 9339 1 60\"\n```\n\n**h)** 将由 `:` 或 `.` 分隔的单词序列替换为序列的**第一个**单词。当\
  \ `:` 或 `.` 后没有跟随单词字符时，序列结束。\n\n```\n[](#cb165-1)> let ip = 'wow:Good:2_two:five:\
  \ hi-2 bye kite.777.water.'\n[](#cb165-2)\n[](#cb165-3)//在此处添加你的解决方案\n[](#cb165-4)<\
  \ \"wow hi-2 kite\"\n```\n\n**i)** 将由 `:` 或 `.` 分隔的单词序列替换为序列的**最后一个**单词。当 `:` 或\
  \ `.` 后没有跟随单词字符时，序列结束。\n\n```\n[](#cb166-1)> let ip = 'wow:Good:2_two:five: hi-2\
  \ bye kite.777.water.'\n[](#cb166-2)\n[](#cb166-3)//在此处添加你的解决方案\n[](#cb166-4)< \"\
  five hi-2 water\"\n```\n\n**j)** 在一个或多个重复的 `cat` 序列上分割给定字符串。\n\n```\n[](#cb167-1)>\
  \ let ip = 'firecatlioncatcatbearbearcatparrot'\n[](#cb167-2)\n[](#cb167-3)//在此处添加你的解决方案\n\
  [](#cb167-4)< [\"fire\", \"lion\", \"bear\", \"parrot\"]\n```\n\n\n\n\n\n```\n[](#cb168-1)>\
  \ let ip = '1234 2323 453545354535 9339 11 60260260'\n[](#cb168-2)\n[](#cb168-3)>\
  \ const pat2 =      // 在处添加你的解决方案\n[](#cb168-4)\n[](#cb168-5)// 输出中的所有序列\n[](#cb168-6)//\
  \ 在处添加你的解决方案\n[](#cb168-7)< [\"2323\", \"453545354535\", \"11\"]\n[](#cb168-8)\n\
  [](#cb168-9)// 输出中的唯一序列\n[](#cb168-10)// 在处添加你的解决方案\n[](#cb168-11)< [\"23\", \"\
  4535\", \"1\"]\n```\n\nl) 将逗号分隔的字符串转换为相应的键值对映射，如下所示。输入字符串中的三个字段对应的键为 `name`、`maths`\
  \ 和 `phy`。\n\n```\n[](#cb169-1)> let row1 = 'rohan,75,89'\n[](#cb169-2)> let row2\
  \ = 'rose,88,92'\n[](#cb169-3)\n[](#cb169-4)> const pat3 =      // 在处添加你的解决方案\n\
  [](#cb169-5)\n[](#cb169-6)// 为 row1 在处添加你的解决方案\n[](#cb169-7)< {name: \"rohan\",\
  \ maths: \"75\", phy: \"89\"}\n[](#cb169-8)\n[](#cb169-9)// 为 row2 在处添加你的解决方案\n\
  [](#cb169-10)< {name: \"rose\", maths: \"88\", phy: \"92\"}\n```\n\nm) 用 `()` 包裹所有整单词。此外，如果该整单词是\
  \ `imp` 或 `ant`，则将其删除。你能通过单次替换来实现吗？\n\n```\n[](#cb170-1)> let ip = 'tiger imp goat\
  \ eagle ant important'\n[](#cb170-2)\n[](#cb170-3)// 在处添加你的解决方案\n[](#cb170-4)< \"\
  (tiger) () (goat) (eagle) () (important)\"\n```\n\n# 间插旁：常见任务\n\n匹配手机号码、IP 地址、日期等任务非常常见，你通常可以找到以库的形式收集的它们。本章展示了\
  \ [CommonRegexJS](https://github.com/talyssonoc/CommonRegexJS) 的一些示例。另请参考 [Awesome\
  \ Regex: Collections](https://github.com/aloisdg/awesome-regex#collections)。\n\n\
  ## CommonRegexJS\n\n使用这些模式有多种方法，详情请参阅 [CommonRegexJS: Usage](https://github.com/talyssonoc/CommonRegexJS#usage)。你也可以浏览\
  \ [commonregex.js](https://github.com/talyssonoc/CommonRegexJS/blob/master/lib/commonregex.js)\
  \ 并选择你需要的正则表达式。\n\n```\n[](#cb171-1)> let data = 'hello 255.21.255.22 okay'\n[](#cb171-2)\n\
  [](#cb171-3)> const comm = new CommonRegex(data)\n[](#cb171-4)\n[](#cb171-5)> comm.IPv4\n\
  [](#cb171-6)< [\"255.21.255.22\"]\n```\n\n请确保针对你的用例测试这些模式。例如，下面的数据包含一个有效的 IPv4 地址，后面跟着另一个由点字符分隔的数字。如果此类情况应该忽略，那么你必须创建自己版本的模式或相应地修改输入。\n\
  \n```\n[](#cb172-1)> let new_data = '23.14.2.4.2 255.21.255.22 567.12.2.1'\n[](#cb172-2)\n\
  [](#cb172-3)> const ip = new CommonRegex(new_data)\n[](#cb172-4)\n[](#cb172-5)>\
  \ ip.IPv4\n[](#cb172-6)< [\"23.14.2.4\", \"255.21.255.22\"]\n```\n\n## 总结\n\n某些模式非常复杂，不容易从头构建和验证。像\
  \ `CommonRegexJS` 这样的库有助于减少完成常见任务所需的时间和精力。然而，你确实需要针对你的用例 `test` 解决方案。另请参考 [stackoverflow:\
  \ validating email addresses](https://stackoverflow.com/questions/201323/how-to-validate-an-email-address-using-a-regular-expression)。\n\
  \n# 预言 (Lookarounds)\n\n你已经了解了如何创建自定义字符类和特殊分组的各种变体。在本章中，你将学习更多的分组，被称为“预言”（lookarounds），它们有助于在正则表达式定义中创建自定义锚点并添加条件。这些断言也被称为**零宽模式**，因为它们增加了类似于锚点的限制，并且不属于匹配部分的一部分。此外，你还将学习如何进行类似于反向字符集的分组反向。\n\
  \n## 条件表达式\n\n在你过度习惯预言之前，最好记住 JavaScript 是一门编程语言。你有控制结构，可以使用逻辑运算符组合多个条件，如 `every/some`\
  \ 等。此外，不要忘记正则表达式只是字符串处理的工具之一。\n\n```\n[](#cb173-1)> let items = ['1,2,3,4', 'a,b,c,d',\
  \ '#foo 123']\n[](#cb173-2)\n[](#cb173-3)// 过滤包含数字和 # 字符元素\n[](#cb173-4)> items.filter(s\
  \ => /\\d/.test(s) && s.includes('#'))\n[](#cb173-5)< [\"#foo 123\"]\n[](#cb173-6)\n\
  [](#cb173-7)// 如果不以 # 开头则修改元素\n[](#cb173-8)> items.filter(s => s[0] != '#').map(s\
  \ => s.replace(/,./, ' '))\n[](#cb173-9)< [\"1 4\", \"a d\"]\n```\n\n## 否定预言\n\n\
  预言断言可以通过两种方式添加——后预言（lookbehind）和前预言（lookahead）。每种都可以是正向的或否定的断言。从语法上看，后预言与前预言相比。\n\
  \n*   `(?!pat)` 否定前预言\n*   `(?<!pat)` 否定后预言\n\n\n\n\n\n> ![info](img/file2.svg)\
  \ 如果不支持后行查找（lookbehind），请参考[这个 stackoverflow 答](https://stackoverflow.com/questions/50011366/javascript-regex-negative-lookbehind-not-working-in-firefox)\
  \ 获取解决方案。\n\n## 正向断言 (Positive lookarounds)\n\n与否定断言不同，模式的缺失不会满足正向断言。相反，要满足条件，模式必须匹配实际字符和/或零宽断言。通过在分组中使用\
  \ `=` 可以识别正向断言。其完整语法如下：\n\n*   `(?=pat)` 用于正向预瞻断言\n*   `(?<=pat)` 用于正向后行断言\n\n```\n\
  [](#cb177-1)// 仅当数字后面跟着逗号时提取数字\n[](#cb177-2)// 注意字符串结尾不符合此条件，因为这是正向断言\n[](#cb177-3)>\
  \ '42 foo-5, baz3; x83, y-20; f12'.match(/\\d+(?=,)/g)\n[](#cb177-4)< [\"5\", \"\
  83\"]\n[](#cb177-5)// 仅当数字前面是 - 且后面是逗号或分号时提取数字\n[](#cb177-6)> '42 foo-5, baz3; x83,\
  \ y-20; f12'.match(/(?<=-)\\d+(?=[;,])/g)\n[](#cb177-7)< [\"5\", \"20\"]\n[](#cb177-8)\n\
  [](#cb177-9)// 等于：match(/\\b\\w/g).join('')\n[](#cb177-10)> 'sea eat car rat eel\
  \ tea'.replace(/(?<=\\b\\w)\\w*\\W*/g, '')\n[](#cb177-11)< \"secret\"\n[](#cb177-12)\n\
  [](#cb177-13)//只要 'part' 在行后部作为整个单词出现，就替换 'par'\n[](#cb177-14)> 'par spare part\
  \ party'.replace(/par(?=.*\\bpart\\b)/g, 'X')\n[](#cb177-15)< \"X sXe part party\"\
  \n```\n\n断言在处理基于字段的操作时非常有用。\n\n```\n[](#cb178-1)// 排除第一个和最后一个字段\n[](#cb178-2)> '1,two,3,four,5'.match(/(?<=,)[^,]+(?=,)/g)\n\
  [](#cb178-3)< [\"two\", \"3\", \"four\"]\n[](#cb178-4)\n[](#cb178-5)// 将空字段替换为 NA\n\
  [](#cb178-6)// 注意在 particular 例中，后行断言和预瞻断言的顺序并不重要\n[](#cb178-7)> ',1,,,two,3,,'.replace(/(?<=^|,)(?=,|$)/g,\
  \ 'NA')\n[](#cb178-8)< \"NA,1,NA,NA,two,3,NA,NA\"\n[](#cb178-9)// 使用否定断言实现相同的功能\n\
  [](#cb178-10)> ',1,,,two,3,,'.replace(/(?![^,])(?<![^,])/g, 'NA')\n[](#cb178-11)<\
  \ \"NA,1,NA,NA,two,3,NA,NA\"\n[](#cb178-12)\n[](#cb178-13)// 在非空列的末尾有一个额外的空字符串匹配\n\
  [](#cb178-14)> ',cat,tiger'.replace(/[^,]*/g, '{$&}')\n[](#cb178-15)< \"{},{cat}{},{tiger}{}\"\
  \n[](#cb178-16)// 断言来救场\n[](#cb178-17)> ',cat,tiger'.replace(/(?<=^|,)[^,]*/g, '{$&}')\n\
  [](#cb178-18)< \"{},{cat},{tiger}\"\n```\n\n## 正向断言内部的捕获组\n\n尽管断言不是匹配部分的一部分，但在正向断言内部可以使用捕获组。你能推断出为什么它在否定断言中不起作用吗？\n\
  \n```\n[](#cb179-1)> console.log('a b c d e'.replace(/(\\S+\\s+)(?=(\\S+)\\s)/g,\
  \ '$1$2\\n'))\n[](#cb179-2)< a b\n[](#cb179-3)  b c\n[](#cb179-4)  c d\n[](#cb179-5)\
  \  d e\n```\n\n## 带断言的 AND 条件\n\n如之前所承诺，这里是断言如何让构建 AND 条件变得更加简单。\n\n```\n[](#cb180-1)>\
  \ let words = ['sequoia', 'subtle', 'questionable', 'exhibit', 'equation']\n[](#cb180-2)\n\
  [](#cb180-3)// 以任意顺序包含 'b'、'e' 和 't' 的单词\n[](#cb180-4)// 等于：/b.*e.*t|b.*t.*e|e.*b.*t|e.*t.*b|t.*b.*e|t.*e.*b/\n\
  [](#cb180-5)> words.filter(w => /(?=.*b)(?=.*e).*t/)\n[](#cb180-6)> words.filter(w\
  \ => /(?=.*b)(?=.*e).*t/) // 修正后的逻辑\n[](#cb180-7)< [\"subtle\", \"questionable\"\
  , \"exhibit\"]\n[](#cb180-8)//包含任意顺序的所有元元的单词\n[](#cb180-9)> words.filter(w => /(?=.*a)(?=.*e)(?=.*i)(?=.*o).*u/)\n\
  [](#cb180-10)< [\"sequoia\", \"equation\"]\n[](#cb180-11)//包含 'a' 和 'q' 但结尾不是 'n'\
  \ 的单词\n[](#cb180-12)> words.filter(w => /(?=.*a)(?=.*q)(?!.*n$))\n[](#cb180-13)<\
  \ [\"questionable\"]\n```\n\n## 可变长度后行断言\n\n在某些正则表达式实现中，如果模式可以匹配不同数量的字符，后行断言将无法工作。例如，`(?<=foo\\\
  d+)` 查找 `foo` 后面跟的一个或多个数字。根据我在控制台的测试，JavaScript 没有此限制。这里是一些示例：\n\n```\n[](#cb181-1)//\
  \ 正向后行断言示例\n[](#cb181-2)> '=not'.match(/(?<=\\d+)[a-z]+/g)\n[](#cb181-3)< [\"not\"\
  , \"cool\"]\n[](#cb181-4)// 仅替换第三次出现的 'cat'\n[](#cb181-5)> 'cat scat'.replace(/(?<=(cat){2})/,\
  \ 'X')\n[](#cb181-6)< \"cat Xer\"\n[](#cb181-7)// 否定后行断言示例\n[](#cb181-8)// 仅当 'dog'\
  \ 前没有出现 'cat'\n[](#cb181-9)> /(?<!cat.*)dog.test('fox,cat,parrot')\n[](#cb181-10)<\
  \ false\n[](#cb181-11)// 仅当 'dog' 前没有出现 'parrot'\n[](#cb181-12)> /(?<!parrot.*)dog.test('fox,cat,parrot')\n\
  [](#cb181-13)< true\n```\n\n## 否定分组\n\n你已经见过一些否定字符类比正向集合更有用的情况。例如，在字段处理中，需要通过创建分隔符的否定字符集来匹配字段内容。类似的，某些情况下需要否定正则表达式。这通过如下所示使用否定预瞻并每次移动一个字符来实现。\n\
  \n```\n[](#cb182-1)// 不能使用 /at<!go)par/ 因为断言不消耗字符\n[](#cb182-2)// 仅当 'at' 和 'par'\
  \ 之间没有 'go'\n[](#cb182-3)> /at((?!go))*par/.test('fox,cat,parrot')\n[](#cb182-4)<\
  \ true\n[](#cb182-5)// 仅当 'at' 和 'par' 之间没有 'do'\n[](#cb182-6)> /at((?!do))*par/.test('fox,cat,parrot')\n\
  [](#cb182-7)< false\n[](#cb182-9)// 如果感到困惑，使用 'match' 方法查看匹配部分\n[](#cb182-10)> 'fox,cat,parrot'.match(/at((?!go))*par/)[0]\n\
  [](#cb182-11)< \"at,dog,par\"\n[](#cb182-12)> 'at,baz,a2z,bad-zoo'.match(/a((!\\\
  d))*z/g)\n[](#cb182-13)< [\"at,baz\", \"ad-z\"]\n```\n\n## 快速查表与总结\n\n| 注意 | 描述\
  \ |\n| --- | --- |\n| 断言 | 允许创建自定义的正向/否定断言 |\n| | 类似于零宽锚点且不是匹配部分的一部分 |\n| `(?!pat)`\
  \ | 否定预瞻断言 |\n| `(?<!pat)` | 否定后行断言 |\n| `(?=pat)` | 正向预瞻断言 |\n| `(?<=pat)` | 正向后行断言\
  \ |\n| | 允许变变长度后行断言 |\n| `(?!pat1)(?=pat2)` | 可以按任意顺序相邻指定多个断言 |\n| | 因为它们在不消耗字符的情况下标记匹配位置\
  \ |\n| `((?!pat).)*` | 否定正则表达式模式 |\n\n在本章中，你学习了如何使用断言来创建自定义限制，以及如何使用否定分组。通过这些，正则表达式的大部分强大功能已经涵盖。下一章将简单介绍处理\
  \ Unicode 字符。\n\n## 练习题\n\n> ![info](img/file2.svg) 即使你可以不使用断言，也请使用断言解决以下练习。\n\n\
  **a)** 除非前面是 `(`，否则将所有完整单词替换为 `X`。\n\n```\n[](#cb183-1)> let ip = '(apple) guava\
  \ berry) apple (mango) (grape'\n[](#cb183-2)\n[](#cb183-3)// 在此处添加你的解决方案\n[](#cb183-4)<\
  \ \"(apple) X X) (mango) (grape\"\n```\n\n**b)** 除非后面跟着 `)`，否则将所有完整单词替换为 `X`。\n\n\
  ```\n[](#cb184-1)> let ip = '(apple) guava berry) apple (mango) (grape'\n[](#cb184-2)\n\
  [](#cb184-3)// 在此处添加你的解决方案\n[](#cb184-4)< \"(apple) X X) (mango) X\"\n```\n\n**c)**\
  \ 除非前面是 `(` 或后面是 `)` 字符，否则将所有完整单词替换为 `X`。\n\n```\n[](#cb185-1)> let ip = '(apple)\
  \ guava berry) apple (mango) (grape'\n[](#cb185-2)\n[](#cb185-3)// 在此处添加你的解决方案\n\
  [](#cb185-4)< \"(apple) X X) (mango) (X\"\n```\n\n**d)** 提取所有不是 `e` 或 `n` 结尾的完整单词。\n\
  \n```\n[](#cb186-1)> let ip = 'at row on urn e note dust n'\n[](#cb186-2)\n[](#cb186-3)//\
  \ 在此处添加你的解决方案\n[](#cb186-4)< [\"at\", \"row\", \"dust\"]\n```\n\n**e)** 提取所有不是以\
  \ `a`、`d` 或 `n` 开头的完整单词。\n\n\n\n\n\n```\n[](#cb187-1)> let ip = 'at row on urn e\
  \ note dust n'\n[](#cb187-2)\n[](#cb187-3)// add your solution here\n[](#cb187-4)<\
  \ [\"row\", \"on\", \"urn\", \"e\"]\n```\n\n### f) 提取所有完整的单词，仅当它们在后面跟着 `:`、`,` 或\
  \ `-` 的时候。\n\n```\n[](#cb188-1)> let ip = 'poke,on=-=so:ink.to/is(vast)ever-sit'\n\
  [](#cb188-2)\n[](#cb188-3)// add your solution here\n[](#cb188-4)< [\"poke\", \"\
  so\", \"ever\"]\n```\n\n### g) 提取所有完整的单词，仅当它们在前面有 `=`、`/` 或 `-` 的时候。\n\n```\n[](#cb189-1)>\
  \ let ip = 'poke,on=-=so:ink.to/is(vast)ever-sit'\n[](#cb189-2)\n[](#cb189-3)//\
  \ add your solution here\n[](#cb189-4)< [\"so\", \"is\", \"sit\"]\n```\n\n### h)\
  \ 提取所有完整的单词，仅当它们在前面有 `=` 或 `:` 且在后面跟着 `:` 或 `.` 的时候。\n\n```\n[](#cb190-1)> let ip\
  \ = 'poke,on=-=so:ink.to/is(vast)ever-sit'\n[](#cb190-2)\n[](#cb190-3)// add your\
  \ solution here\n[](#cb190-4)< [\"so\", \"ink\"]\n```\n\n### i) 提取所有完整的单词，仅当它们在前面有\
  \ `=`、 `:`、`.`、`(` 或 `-` 且后面没有不是 `.` 或 `/` 的时候。\n\n```\n[](#cb191-1)> let ip = 'poke,on=-=so:ink.to/is(vast)ever-sit'\n\
  [](#cb191-2)\n[](#cb191-3)// add your solution here\n[](#cb191-4)< [\"so\", \"vast\"\
  , \"sit\"]\n```\n\n### j) 从所有以 `,` 为字段分隔符的单独字段中去除开头和结尾的空格。\n\n```\n[](#cb192-1)>\
  \ let csv1 = ' comma  ,separated ,values '\n[](#cb192-2)> let csv2 = 'good bad,nice\
  \  ice  , 42 , ,   stall   small'\n[](#cb192-3)\n[](#cb192-4)> const trim_whitespace\
  \ =       // add your solution here\n[](#cb192-5)\n[](#cb192-6)> csv1.replace(trim_whitespace,\
  \ '')\n[](#cb192-7)< \"comma,separated,values\"\n[](#cb192-8)> csv2.replace(trim_whitespace,\
  \ '')\n[](#cb192-9)< \"good bad,nice  ice,42,,stall   small\"\n```\n\n### k) 过滤所有所有规则的元素：\n\
  \n* 应该至少有两个字母\n* 应该至少有 3 个数字\n* 在 `%`、`*`、`#` 或 `$` 之间应该至少有一个特殊字符\n* 不应该以空格字符结尾\n\
  \n```\n[](#cb193-1)> let pwds = ['hunter2', 'F2h3u%9', '*X3Yz3.14\\t', 'r2_d2_42',\
  \ 'A $B C1234']\n[](#cb193-2)\n[](#cb193-3)// add your solution here\n[](#cb193-4)<\
  \ [\"F2h3u%9\", \"A $B C1234\"]\n```\n\n### l) 对于给定的字符串，将所有完整的单词用 `{}` 包起来，但单词 `par`、`cat`\
  \ 和 `apple` 除外。\n\n```\n[](#cb194-1)> let ip = 'part; cat {super} rest_42 par scatter\
  \ apple spar'\n[](#cb194-2)\n[](#cb194-3)// add your solution here\n[](#cb194-4)<\
  \ \"{part}; cat {{super}} {rest_42} par {scatter} apple {spar}\"\n```\n\n### m)\
  \ 提取给定字符串中浮点数的整数部分。以 `.` 结尾且没有后续数字的数字不应被视为。\n\n```\n[](#cb195-1)> let ip = '12 ab32.4\
  \ go 5 2\\. 46.42 5'\n[](#cb195-2)\n[](#cb195-3)// add your solution here\n[](#cb195-4)<\
  \ [\"32\", \"46\"]\n```\n\n### n) 对于给定的输入字符串，提取所有重叠的两个字符序列。\n\n```\n[](#cb196-1)>\
  \ let s1 = 'apple'\n[](#cb196-2)> let s2 = '1.2-3:4'\n[](#cb196-3)\n[](#cb196-4)>\
  \ const pat1 =      // add your solution here\n[](#cb196-5)\n[](#cb196-6)// add\
  \ your solution here for s1\n[](#cb196-7)< [\"ap\", \"pp\", \"pl\", \"le\"]\n[](#cb196-8)//\
  \ add your solution here for s2\n[](#cb196-9)< [\"1.\", \".2\", \"2-\", \"-3\",\
  \ \"3:\", \":4\"]\n```\n\n### o) 给定的输入字符串包含由 `:` 字符分隔的字段。如果在最后一个字段之前的任何地方有数字字符，则删除\
  \ `:` 和最后一个字段。\n\n```\n[](#cb197-1)> let s1 = '42:cat'\n[](#cb197-2)> let s2 = 'twelve:a2b'\n\
  [](#cb197-3)> let s3 = 'we:be:he:0:a:b:bother'\n[](#cb197-4)\n[](#cb197-5)> const\
  \ pat2 =      // add your solution here\n[](#cb197-6)\n[](#cb197-7)> s1.replace(pat2,\
  \ '')\n[](#cb197-8)< \"42\"\n[](#cb197-9)> s2.replace(pat2, '')\n[](#cb197-10)<\
  \ \"twelve:a2b\"\n[](#cb197-11)> s3.replace(pat2, '')\n[](#cb197-12)< \"we:be:he:0:a:b\"\
  \n```\n\n### p) 提取所有完整的单词，除非它们前面有 `:`、`<=>`、`----` 或 `#`。\n\n```\n[](#cb198-1)>\
  \ let ip = '::very--at<=>row|in.a_b#b2c=>lion----east'\n[](#cb198-2)\n[](#cb198-3)//\
  \ add your solution here\n[](#cb198-4)< [\"at\", \"in\", \"a_b\", \"lion\"]\n```\n\
  \n### q) 匹配包含 `qty` 且其后面跟着 `price` 的字符串，但如果它们之间有空格或字符串 `error` 则忽略。\n\n```\n[](#cb199-1)>\
  \ let str1 = '23,qty,price,42'\n[](#cb199-2)> let str2 = 'qty price,oh'\n```\n\n\
  \n\n\n\n你也可以在 `\\u{}` 结构中使用代码点来指定 Unicode 字符。这与使用 `\\xhh` 通过两个十六进制数字来指定 ASCII 字符类似。\n\
  \n```\n[](#cb204-1)// 从给定的字符串获取十六进制格式的代码点\n[](#cb204-2)> Array.from('fox:αλεπού',\
  \ c => c.codePointAt().toString(16))\n[](#cb204-3)< [\"66\", \"6f\", \"78\", \"\
  3a\", \"3b1\", \"3bb\", \"3b5\", \"3c0\", \"3bf\", \"3cd\"]\n[](#cb204-4)\n[](#cb204-5)//\
  \ 使用代码点表示一个字符\n[](#cb204-6)> '\\u{3b1}'\n[](#cb204-7)< \"α\"\n[](#cb204-8)\n[](#cb204-9)//\
  \ 使用 \\u{} 定义小写字母的字符范围\n[](#cb204-10)// 注意 \\u{} 仅在配合 'u' 标志时有效\n[](#cb204-11)>\
  \ 'fox:αλεπού,eagle:αετός'.match(/[\\u{61}-\\u{7a}]+/gu)\n[](#cb204-12)< [\"fox\"\
  , \"eagle\"]\n```\n\n> ![info](img/file2.svg) 另请 [stackoverflow: Unicode 字符串转十六进制](https://stackoverflow.com/questions/21647928/javascript-unicode-string-to-hex)。\n\
  \n## 备查表与总结\n\n| Note | 说明 |\n| --- | --- |\n| `u` | 启用 Unicode 匹配的标志 |\n| `\\p{}`\
  \ | Unicode 字符集 |\n| `\\P{}` | 反向 Unicode 字符集 |\n| | 详情参 [MDN: Unicode 属性转义](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Regular_Expressions/Unicode_Property_Escapes)\
  \ |\n| `\\u{}` | 使用代码点指定 Unicode 字符 |\n\n关于结合 Unicode 字符使用正则表达式的全面讨论不在本书的范围内。推荐通过\
  \ [regular-expressions: unicode](https://www.regular-expressions.info/unicode.html)\
  \ 和 [Programmers introduction to Unicode](http://reedbeta.com/blog/programmers-intro-to-unicode/)\
  \ 等资源进一步学习。\n\n## 练习\n\n**a)** 检查给输入字符串是否仅由 ASCII 字符组成。假设输入为非空字符串，任何不属于 7 位 ASCII\
  \ 集的字符都应输出 `false`。\n\n```\n[](#cb205-1)> let str1 = '123 × 456'\n[](#cb205-2)>\
  \ let str2 = 'good fοοd'\n[](#cb205-3)> let str3 = 'happy learning!'\n[](#cb205-4)\n\
  [](#cb205-5)> const pat1 =      // 在此处添加你的解决方案\n[](#cb205-6)\n[](#cb205-7)> pat1.test(str1)\n\
  [](#cb205-8)< false\n[](#cb205-9)> pat1.test(str2)\n[](#cb205-10)< false\n[](#cb205-11)>\
  \ pat1.test(str3)\n[](#cb205-12)< true\n```\n\n**b)** 为给定的字符串仅保留标点字符。\n\n```\n[](#cb206-1)>\
  \ let ip = '❨a❩❪1❫❬b❭❮2❯❰c❱❲3❳❴xyz❵⟅123⟆⟦⟧⟨like⟩⟪3.14⟫'\n[](#cb206-2)\n[](#cb206-3)//\
  \ 在此处添加你的解决方案\n[](#cb206-4)< \"❨❩❪❫❬❭❮❯❱❱❲❳❴❵⟅⟆⟦⟧⟨⟩⟪.⟫\"\n```\n\n**c)** 下面代码段显示的输出是正确的？\n\
  \n```\n[](#cb207-1)> 'fox:αλεπού'.match(/\\w+/g)\n[](#cb207-2)< [\"fox\"]\n```\n\
