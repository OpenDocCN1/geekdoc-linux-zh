  \n## 作者信息\n\nSundeep Agarwal 是一位自由职业培训师、作者和导师。他之前的经历包括在 Analog Devices 担任 5 多年的设计工程师。你可以在\
  \ [`github.com/learnbyexample`](https://github.com/learnbyexample) 找到他的其他作品，主要关注\
  \ Linux 命令行、文本处理、脚本语言和精选列表。他还是 Packt 出版的 [Command Line Fundamentals](https://www.packtpub.com/application-development/command-line-fundamentals)\
  \ 书籍和视频课程的技术评审员。\n\n**书籍列表：** [`learnbyexample.github.io/books/`](https://learnbyexample.github.io/books/)\n\
  \n\n## 书籍版本\n\n1.5\n\n查看 [Version_changes.md](https://github.com/learnbyexample/learn_js_regexp/blob/master/Version_changes.md)\
  \ 以跟踪书籍版本之间的更改。\n\n# 正则表达式特别在哪里？\n\n正则表达式是一种多功能的文本处理工具。你会发现它们包含在大多数用于脚本的编程语言的标准库中。如果没有，你通常可以找到第三方库。正则表达式的语法和特性随语言而异。JavaScript\
  \ 的语法与 Perl 语言相似，但存在显著的特性差异。\n\nJavaScript 中的 [String 对象](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String)\
  \ 支持多种处理文本的方法。那么，正则表达式的特别在哪里？你为什么需要它？为了学习和理解，可以将正则表达式本身视为一种微型编程语言，专门用于文本处理。正则表达式的部分可以保存备以后用，类似于变量。有方法执行\
  \ AND、OR、NOT 条件判断。以及类似于范围和重复的操作等。\n\n这里是一些常见的用例：\n\n* 清理字符串以确保其满足一组已知的规则。例如，检查给定字符串是否符合密码规则。\n\
  * 在抽象层过滤或提取部分，如字母、数字、标点符号等。\n* 限定的字符串替换。例如，在字符串的开头或结尾，根据周围文本仅替换整个单词等。\n\n你可能熟悉图形化的查找和替换工具，如下所示的\
  \ LibreOffice Writer 截图**区分大小写（Match case）**、**仅全字（Whole words only）**、**替换（Replace）**和**全部替换（Replace\
  \ All）**是正则表达式支持的一些基本功能。\n\n![find and replace](img/file0.png)\n\n另一个现实用例是密码验证。下面的截图来自\
  \ GitHub 注册页面。执行多项检查，如**字符串长度**和**允许的字符类型**是正则表达式的另一个核心功能。\n\n![password check](img/file1.png)\n\
  \n这里有一些关于正则表达式的文章，可以了解它的历史以及它适用于的问题类型。\n\n* [正则表达式真正的威力](https://nikic.github.io/2012/06/15/The-true-power-of-regular-expressions.html)\
  \ —— 它还包含了对在此语境下“*regular（正则）*”含义的很好的解释。\n* [softwareengineering: 每一个程序员都必须学习正则表达式吗？](https://softwareengineering.stackexchange.com/questions/133968/is-it-a-must-for-every-programmer-to-learn-regular-expressions)\n\
  * [softwareengineering: 你什么时候不应该使用正则表达式？](https://softwareengineering.stackexchange.com/questions/113237/when-you-should-not-use-regular-expressions)\n\
  * [codinghorror: 你现在有两个问题了](https://blog.codinghorror.com/regular-expressions-now-you-have-two-problems/)\n\
  \n\n\n\n\n*   [wikipedia: 正则表达式](https://en.wikipedia.org/wiki/Regular_expression)\
  \ —— 这包含了关于作为形式语言的正则表达式讨论，以及各种实现的详细信息。\n\n# 本书的结构\n\n本书逐个介绍概念，章节末尾的练习仅需要到该章节为止介绍的功能。每个概念都配有多个示例，以涵盖不同的用法角度和边界情况。如前所述，请通过手动输入代码段来跟随图示操作。理解输入字符串的性质以及所使用的实际编程命令至关重要。书中有两个间插章节概述了有用的外部资源，并在最后一章中汇编了更多资源。\n\
  \n*   RegExp 简介\n*   锚点\n*   选择与与分组\n*   转义元字符\n*   点元字符与量符\n*   间插：调试与可视化工具\n*\
  \   处理匹配部分\n*   字符类\n*   分组与反向引用\n*   间插：常见任务\n*   断言\n*   Unicode\n*   扩展阅读\n\n\
  在读本书结束时，你应该能够熟练地编写和阅读正则表达式，知道如何调试它们，并知道何时避免使用它们。\n\n# RegExp 简介\n\n本章将带你开始定义 `RegExp`\
  \ 对象并在字符串方法中使用它们。为了简单起见，示例将不使用与正则表达式相关的特殊字符。主要重点是让你熟悉语法和文本处理示例。本章将介绍两个方法：用于搜索输入是否包含字符串的\
  \ `test` 方法，以及用于用其他内容替换输入部分的 `replace` 方法。\n\n> ![info](img/file2.svg) 本书将交叉使用 `regular\
  \ expressions` 和 `regexp` 术语。在特指 JavaScript 对象时，将使用 `RegExp`。\n\n## 控制台与文档\n\n如前言所示，书中的示例在\
  \ Chrome/Chromium 控制台上经过测试。其他基于 Chromium 的浏览器可能也有效。在新建标签页中使用快捷键 `Ctrl+Shift+J` 打开控制台。某些变量名在不同章节间重用，在这种情况下请打开另一个标签页以避免错误。\n\
  \n访问 [MDN: 正则表达式](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Regular_Expressions)\
  \ 获取文档、示例和功能兼容性详情。\n\n## test 方法\n\n首先是一个简单的示例，用于测试字符串是否是另一个字符串的一部分。通常，你会使用 `includes`\
  \ 方法并传递字符串作为参数。对于正则表达式，请使用 `RegExp` 对象上的 `test` 方法，该对象由 `//` 分隔符包围的搜索字符串定义。\n\n\
  ```\n[](#cb1-1)> let sentence = 'This is a sample string'\n[](#cb1-2)\n[](#cb1-3)//\
  \ 检查 'sentence' 是否包含指定的字符串参数\n[](#cb1-4)> sentence.includes('is')\n[](#cb1-5)< true\n\
  [](#cb1-6)> sentence.includes('z')\n[](#cb1-7)< false\n[](#cb1-8)\n[](#cb1-9)//\
  \ 检查 'sentence' 是否匹配 regexp 描述的模式\n[](#cb1-10)> /is/.test(sentence)\n[](#cb1-11)<\
  \ true\n[](#cb1-12)> /z/.test(sentence)\n[](#cb1-13)< false\n```\n\n这里有一些在条件表达式中使用\
  \ `test` 方法的示例。\n\n```\n[](#cb2-1)> let report = 'string theory'\n[](#cb2-2)\n[](#cb2-3)>\
  \ if (/ring/.test(report)) {\n[](#cb2-4)      console.log('mission success')\n[](#cb2-5)\
  \  }\n[](#cb2-6)< mission success\n[](#cb2-7)\n[](#cb2-8)> if (!/fire/.test(report))\
  \ {\n[](#cb2-9)      console.log('mission failed')\n[](#cb2-10)  }\n[](#cb2-11)<\
  \ mission failed\n```\n\n这里是数组处理的示例。\n\n```\n[](#cb3-1)> let words = ['cat', 'attempt',\
  \ 'tattle']\n[](#cb3-2)\n[](#cb3-3)// 获取所有包含 'tt' 的元素\n[](#cb3-4)> words.filter(w\
  \ => /tt/.test(w))\n[](#cb3-5)< [\"attempt\", \"tattle\"]\n[](#cb3-6)\n[](#cb3-7)//\
  \ 检查是否所有元素都包含 'at'\n[](#cb3-8)> words.every(w => /at/.test(w))\n[](#cb3-9)< true\n\
  [](#cb3-10)\n[](#cb3-11)// 检查是否有任何元素包含 'stat'\n[](#cb3-12)> words.some(w => /stat/.test(w))\n\
  [](#cb3-13)< false\n```\n\n## 标志 (Flags)\n\n某些正则表达式功能通过传递标志（由字母字符表示）来启用。如果你用过命令行，标志类似于命令选项，例如\
  \ `grep -i` 将执行不区分大小写的匹配。\n\n在本章中，将讨论两个标志：\n\n*   `i` 标志：在匹配字母时忽略大小写（默认是区分大小写的匹配）\n\
  *   `g` 标志：匹配所有出现项（默认只匹配第一个）\n\n`i` 标志的示例所示。`g` 标志将在本章稍后的 replace 方法 部分进行讨论。\n\n\
  ```\n[](#cb4-1)> /cat/.test('CaT')\n[](#cb4-2)< false\n[](#cb4-3)> /cat/i.test('CaT')\n\
  [](#cb4-4)< true\n[](#cb4-5)\n[](#cb4-6)> ['Cat', 'cot', 'CATER', 'SCat', 'ScUtTLe'].filter(w\
  \ => /cat/i.test(w))\n[](#cb4-7)< [\"Cat\", \"CATER\", \"SCat\"]\n```\n\n## RegExp\
  \ 构造函数与重用\n\n`RegExp` 对象可以保存变量变量。这有助于提高代码清晰度、实现重用等。\n\n```\n[](#cb5-1)> const pet\
  \ = /dog/\n[](#cb5-2)\n[](#cb5-3)> pet.test('They bought a dog')\n[](#cb5-4)< true\n\
  [](#cb5-5)> pet.test('A cat crossed their path')\n[](#cb5-6)< false\n```\n\n`RegExp`\
  \ 对象也可以使用 `RegExp()` 构造函数来构建。第一个参数可以是字符串或 `RegExp` 对象。第二个参数用于指定一个或多个标志。\n\n```\n\
  [](#cb6-1)> const pat = RegExp('dog')\n[](#cb6-2)> pat\n[](#cb6-3)< /dog/\n[](#cb6-4)\n\
  [](#cb6-5)// 如果需要标志，作为第二个参数指定\n[](#cb6-6)> RegExp('dog', 'i')\n[](#cb6-7)< /dog/i\n\
  ```\n\n构造函数相对于 `//` 字面量的主要优势是可以使用 `${}` 动态构建变量或其他表达式的结果构建正则表达式。\n\n```\n[](#cb7-1)>\
  \ let greeting = 'hi'\n[](#cb7-2)\n[](#cb7-3)> const pat1 = RegExp(`${greeting}\
  \ there`)\n[](#cb7-4)> pat1\n[](#cb7-5)< /hi there/\n[](#cb7-6)\n[](#cb7-7)> RegExp(`${greeting.toUpperCase()}\
  \ there`)\n[](#cb7-8)< /HI there/\n```\n\n## replace 方法\n\n`replace` 方法用于搜索和替换操作。\n\
  \n```\n[](#cb8-1)// 只更改第一个匹配项\n[](#cb8-2)> '1,2,3,4'.replace(/,/, '-')\n[](#cb8-3)<\
  \ \"1-2,3,4\"\n[](#cb8-4)\n[](#cb8-5)// 通过添加 'g' 标志更改所有匹配项\n[](#cb8-6)> '1,2,3,4'.replace(/,/g,\
  \ '-')\n[](#cb8-7)< \"1-2-3-4\"\n[](#cb8-8)\n[](#cb8-9)// 多个标志可以组合\n[](#cb8-10)>\
  \ 'cArT PART tart mArt'.replace(/art/ig, '2')\n[](#cb8-11)< \"c2 P2 t2 m2\"\n```\n\
  \n> ![warning](img/file3.svg) 一个常见的错误是忘记字符串是不可变的。如果你想向同一个变量保存更改，需要将结果显式赋值回该变量。\n\
  \n```\n[](#cb9-1)> let word = 'cater'\n[](#cb9-2)\n[](#cb9-3)// 这会返回一个字符串但不会修改 'word'\
  \ 变量\n[](#cb9-4)> word.replace(/cat/, 'hack')\n[](#cb9-5)< \"hacker\"\n[](#cb9-6)>\
  \ word\n[](#cb9-7)< \"cater\"\n[](#cb9-8)\n[](#cb9-9)// 为了就地修改，需要显式赋值结果\n[](#cb9-10)>\
  \ word = word.replace(/cat/, 'hack')\n[](#cb9-11)< \"hacker\"\n[](#cb9-12)> word\n\
  [](#cb9-13)< \"hacker\"\n```\n\n\n\n\n\n![warning](img/file3.svg) 在 `test` 方法中使用\
  \ `g` 标志可以提供一些额外功能。请参考 [MDN: test](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/RegExp/test#Examples)\
  \ 获取示例。然而，在我看来，很容易养成在 `test` 中使用 `g` 的习惯，并导致意想不到的结果。我更倾向于建议使用 match 方法 并显式地编写逻辑，而不是依赖带有\
  \ `g` 标志的 `test`。\n\n## 查表与总结\n\n| 备注 | 说明 |\n| --- | --- |\n| [MDN: 正则表达式](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Regular_Expressions)\
  \ | JavaScript 正则表达式 MDN 文档 |\n| `/pat/` | 一个 `RegExp` 对象 |\n| `const p1 = /pat/`\
  \ | 将正则保存在变量中以便复用、清晰等 |\n| `/pat/.test(s)` | 检查给定模式是否出现在输入字符串的任何位置 |\n| | 返回 `true`\
  \ 或 `false` |\n| `i` | 匹配字母时忽略大小大小的标志 |\n| `g` | 匹配所有出现次数的标志 |\n| `new RegExp('pat',\
  \ 'i')` | 从字符串构建 `RegExp` |\n| | 可选的第二个参数指定标志 |\n| | 使用反引号字符串配合 `${}` 进行插值 |\n|\
  \ `s.replace(/pat/, 'repl')` | 搜索和替换的方法 |\n\n本章介绍了如何定义 `RegExp` 对象以及如何比配合 `test`\
  \ 和 `replace` 方法使用它们。你还学习了如何使用标志来改变正则表达式的默认行为。提供的示例更多侧重于介绍文本处理概念。从下一章开始，你将学习正则表达式的语法和特性。\n\
  \n## 练习\n\n![info](img/file2.svg) 所有的练习题都汇总在 [Exercises.md](https://github.com/learnbyexample/learn_js_regexp/blob/master/Exercises.md)\
  \ 中。\n\n![info](img/file2.svg) 答案请参阅 [Exercise_solutions.md](https://github.com/learnbyexample/learn_js_regexp/blob/master/Exercise_solutions.md)。\n\
  \n**a)** 忽略大小写检查给定输入字符串是否包含 `two`。\n\n```\n[](#cb10-1)> let s1 = 'Their artwork\
  \ is exceptional'\n[](#cb10-2)> let s2 = 'one plus tw0 is not three'\n[](#cb10-3)>\
  \ let s3 = 'TRUSTWORTHY'\n[](#cb10-4)\n[](#cb10-5)> const pat1 =      //在此处添加你的解决方案\n\
  [](#cb10-6)\n[](#cb10-7)> pat1.test(s1)\n[](#cb10-8)< true\n[](#cb10-9)> pat1.test(s2)\n\
  [](#cb10-10)< false\n[](#cb10-11)> pat1.test(s3)\n[](#cb10-12)< true\n```\n\n**b)**\
  \ 对于给数组，过滤掉所有*不*包含 `e` 的元素。\n\n```\n[](#cb11-1)> let items = ['goal', 'new', 'user',\
  \ 'sit', 'eat', 'dinner']\n[](#cb11-2)\n[](#cb11-3)> items.filter(w => test(w))\
  \       //在此处添加你的解决方案\n[](#cb11-4)< [\"goal\", \"sit\"]\n```\n\n**c)** 对于给定的字符串，将第一个出现的\
  \ `5` 替换为 `five`。\n\n```\n[](#cb12-1)> let ip = 'They ate 5 apples and 5 oranges'\n\
  [](#cb12-2)\n[](#cb12-3)> ip.replace()       //在此处添加你的解决方案\n[](#cb12-4)< \"They\
  \ ate five apples and 5 oranges\"\n```\n\n**d)** 对于给定的字符串，将所有的 `5` 替换为 `five`。\n\
  \n```\n[](#cb13-1)> let ip = 'They ate 5 apples and 5 oranges'\n[](#cb13-2)\n[](#cb13-3)>\
  \ ip.replace()      //在此处添加你的解决方案\n[](#cb13-4)< \"They ate five apples and five\
  \ oranges\"\n```\n\n**e)** 忽略大小写，将所有的 `note` 替换为 `X`。\n\n```\n[](#cb14-1)> let ip\
  \ = 'This note should not be NoTeD'\n[](#cb14-2)\n[](#cb14-3)> ip.replace()    \
  \ //在此处添加你的解决方案\n[](#cb14-4)< \"This X should not be XD\"\n```\n\n**f)** 对于给定的多行输入字符串，过滤掉所有不包含\
  \ 字符串 `2` 的行。\n\n```\n[](#cb15-1)> let purchases = `items qty\n[](#cb15-2)apple\
  \ 24\n[](#cb15-3)mango 50\n[](#cb15-4)guava 42\n[](#cb15-5)onion 31\n[](#cb15-6)water\
  \ 10`\n[](#cb15-7)\n[](#cb15-8)> const num =       //在此处添加你的解决方案\n[](#cb15-9)\n\
  [](#cb15-10)> console.log(purchases.split('\\n')\n[](#cb15-11)                 \
  \      .filter(e => test(e))       //在此处添加你的解决方案\n[](#cb15-12)                 \
  \      .join('\\n'))\n[](#cb15-13)< items qty\n[](#cb15-14)  mango 50\n[](#cb15-15)\
  \  onion 31\n[](#cb15-16)  water 10\n```\n\n![info](img/file2.svg) 在学习完 点元字符和量符\
  \ 章节后，你就能仅用 `replace` 方法解决这个问题。\n\n**g)** 对于给定的数组，过滤出包含 `a` 或 `w` 的元素。\n\n```\n\
  [](#cb16-1)> let items = ['goal', 'new', 'user', 'sit', 'eat', 'dinner']\n[](#cb16-2)\n\
  [](#cb16-3)> items.filter(w => test(w) || test(w))     //在此处添加你的解决方案\n[](#cb16-4)<\
  \ [\"goal\", \"new\", \"eat\"]\n```\n\n**h)** 对于给定的数组，过滤出同时包含 `e` 和 `n` 的元素。\n\n\
  ```\n[](#cb17-1)> let items = ['goal', 'new', 'user', 'sit', 'eat', 'dinner']\n\
  [](#cb17-2)\n[](#cb17-3)> items.filter(w => test(w) && test(w))     //在此处添加你的解决方案\n\
  [](#cb17-4)< [\"new\", \"dinner\"]\n```\n\n**i)** 对于给定的字符串，将 `0xA0` 替换为 `0x7F`，并将\
  \ `0xC0` 替换为 `0x1F`。\n\n```\n[](#cb18-1)> let ip = 'start address: 0xA0, func1 address:\
  \ 0xC0'\n[](#cb18-2)\n[](#cb18-3)> ip.replace()        //在此处添加你的解决方案\n[](#cb18-4)<\
  \ \"start address: 0x7F, func1 address: 0x1F\"\n```\n\n## 锚点\n\n在 `test` 方法中使用 `g`\
  \ 标志可以提供一些额外功能。请参考 [MDN: test](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/RegExp/test#Examples)-US/docs/Web/JavaScript/Reference/Global_Objects/RegExp/test#Examples)\
  \ 获取示例。然而，在我看来，很容易养成在 `test` 中使用 `g` 的习惯，并导致意想不到的结果。我更倾向于建议使用 match 方法 并显式地编写逻辑，而不是依赖带有\
  \ `g` 标志的 `test`。\n\n锚点限制匹配到字符串的开头或结尾。这些特殊字符被称为元字符。要字面匹配这些字符，需要使用 `\\` 进行转义。\n\n\
  ## 字符串锚点\n\n`^` 元字符限制匹配到字符串的开头。这些功能与 `startsWith` 方法类似。\n\n```\n[](#cb19-1)> ^ 是作为模式的前缀\n\
  [](#cb19-2)> /cat/.test('cater')\n[](#cb19-3)< true\n[](#cb19-4)> /cat/.test('concatenation')\n\
  [](#cb19-5)< false\n[](#cb19-6)\n[](#cb19-7)> /^hi/.test('hi\\ntop spot')\n[](#cb19-8)<\
  \ true\n[](#cb19-9)> /^top/.test('hi\\ntop spot')\n[](#cb19-10)< false\n```\n\n\
  `$` 元字符用于限制匹配到字符串的结尾。\n\n```\n[](#cb20-1)> $ 是作为模式的后缀\n[](#cb20-2)> /are$/.test('spare')\n\
  [](#cb20-3)< true\n[](#cb20-4)> /are$/.test('nearest')\n[](#cb20-5)< false\n[](#cb20-6)\n\
  [](#cb20-7)> let words = ['surrender', 'unicorn', 'newer', 'door', 'empty', 'pest']\n\
  [](#cb20-8)> words.filter(w => /er$/.test(w))\n[](#cb20-9)< [\"surrender\", \"newer\"\
  ]\n[](#cb20-10)> words.filter(w => /t$/.test(w))\n[](#cb20-11)< [\"pest\"]\n```\n\
  \n结合字符串开头和结尾锚点，你可以限制匹配整个字符串。这与使用 `==` 运算符比较字符串相似。\n\n```\n[](#cb21-1)> /^cat$/.test('cat')\n\
  [](#cb21-2)< true\n[](#cb21-3)> /^cat$/.test('cater')\n[](#cb21-4)< false\n```\n\
  \n锚点可以单独作为模式使用。有助于在字符串开头或结尾插入文本，模拟字符串拼接操作。这些可能看起来并不有用，但与其他正则表达式特性结合，它们会变成非常方便的工具。\n\
  \n```\n[](#cb22-1)> 'live'.replace(/^/, 're')\n[](#cb22-2)< \"relive\"\n[](#cb22-3)>\
  \ 'send'.replace(/^/, 're')\n[](#cb22-4)< \"resend\"\n[](#cb22-5)\n[]cbcb22-6)>\
  \ 'cat'.replace(/$/, 'er')\n[](#cb22-7)< \"cater\"\n[](#cb22-8)> 'hack'.replace(/$/,\
  \ 'er')\n[](#cb22-9)< \"hacker\"\n```\n\n## 行锚点\n\n\n\n\n\n字符串输入可能包含单行或多行。`\\r`、`\\\
  n`、`\\u2028`（行分隔符）和 `\\u2029`（段落分隔符）被视为行分隔符。当使用 `m` 标志时，`^` 和 `$` 锚分别匹配每一行的开头和结尾。\n\
  \n```\n[](#cb23-1)// 检查字符串中是否有行以 'top' 开头\n[](#cb23-2)> /^top/m.test('hi hello\\\
  ntop spot')\n[](#cb23-3)< true\n[](#cb23-4)\n[](#cb23-5)// 检查字符串中是否有行以 'er' 结尾\n\
  [](#cb23-6)> /er$/m.test('spare\\npar\\nera\\ndare')\n[](#cb23-7)< false\n[](#cb23-8)\n\
  [](#cb23-9)// 检查字符串中是否有完整的行是 'par'\n[](#cb23-10)> /^par$/m.test('spare\\npar\\nera\\\
  ndare')\n[](#cb23-11)< true\n```\n\n就像字符串锚点一样，你可以单独将行锚点作为模式。\n\n```\n[](#cb24-1)>\
  \ let items = 'catapults\\nconcatenate\\ncat'\n[](#cb24-2)\n[](#cb24-3)> console.log(items.replace(/^/gm,\
  \ '* '))\n[](#cb24-4)< * catapults\n[](#cb24-5)  * concatenate\n[](#cb24-6)  * cat\n\
  [](#cb24-7)\n[](#cb24-8)> console.log(items.replace(/$/gm, '.'))\n[](#cb24-9)< catapults.\n\
  [](#cb24-10)  concatenate.\n[](#cb24-11)  cat.\n```\n\n> ![warning](img/file3.svg)\
  \ 如果字符串末尾有行分隔符字符，则在分隔符之后还有一个额外的行开头/结尾匹配。\n\n```\n[](#cb25-1)// 'foo ' 被插入了三次\n[](#cb25-2)>\
  \ '1\\n2\\n'.replace(/^/mg, 'foo ')\n[](#cb25-3)< \"foo 1\n[](#cb25-4)  foo 2\n\
  [](#cb25-5)  foo \"\n[](#cb25-6)\n[](#cb25-7)> '1\\n2\\n'.replace(/$/mg, ' baz')\n\
  [](#cb25-8)< \"1 baz\n[](#cb25-9)  2 baz\n[](#cb25-10)   baz\"\n```\n\n> ![warning](img/file3.svg)\
  \ 如果你正在处理基于 Windows 系统的文本文件，可能需要先将 `\\r\\n` 行结束符转换为 `\\n`。否则，你将获得 `\\r` 和 `\\n`\
  \ 字符的行尾匹配。你也可以通过在正则表达式中使 `\\r` 为可选字符来处理此情况（请参见 贪婪量符 ）。\n\n## 单词锚点\n\n第三种限制是单词锚点。字母（不区分大小写）、数字和下划线字符被视为单词字符。你可能会想为什么会有数字和下划线，而不是只有字母？这源于变量和函数的命名规范——通常允许字母、数字和下划线。因此，该定义更倾向于编程语言而非自然语言。\n\
  \n转义序列 `\\b` 表示单词边界。这同时适用于单词开头和单词结尾的锚定。单词开头意味着单词之前的字符是非单词字符，或者没有字符（字符串开头）。同样，单词结尾意味着单词之后的字符是非单词字符，或者没有字符（字符串结尾）。这意味着你无法在没有单词字符的情况下单词边界\
  \ `\\b`。\n\n```\n[](#cb26-1)> let sample = 'par spar apparent spare part'\n[](#cb26-2)\n\
  [](#cb26-3)// 无论 'par' 出现在何处都替换\n[](#cb26-4)> sample.replace(/par/g, 'X')\n[](#cb26-5)<\
  \ \"X sX apXent sXe Xt\"\n[](#cb26-6)// 仅在单词开头替换 'par'\n[](#cb26-7)> sample.replace(/\\\
  bpar/g, 'X')\n[](#cb26-8)< \"X spar apparent spare Xt\"\n[](#cb26-9)// 仅在单词结尾替换\
  \ 'par'\n[](#cb26-10)> sample.replace(/par\\b/g, 'X')\n[](#cb26-11)< \"X sX apparent\
  \ spare part\"\n[](#cb26-12)// 仅当 'par' 不是另一个单词的一部分时替换\n[](#cb26-13)> sample.replace(/\\\
  bpar\\b/g, 'X')\n[](#cb26-14)< \"X spar apparent spare part\"\n```\n\n你可以通过将单词边界单独作为模式来发挥更多创意。\n\
  \n```\n[](#cb27-1)// 将空格分隔的单词转换为双引号 CSV\n[](#cb27-2)// 注意这里使用了两次 'replace' 方法\n\
  [](#cb27-3)> let sample = 'par spar apparent spare part'\n[](#cb27-4)> console.log(sample.replace(/\\\
  b/g, '\"').replace(/ /g, ','))\n[](#cb27-5)< \"par\",\"spar\",\"apparent\",\"spare\"\
  ,\"part\"\n[](#cb27-6)\n[](#cb27-7)// 让编程语句更具读性\n[](#cb27-8)// 仅用于说明目的，不适用于所有情况\n\
  [](#cb27-9)> 'foo_baz=num1+35*42/num2'.replace(/\\b/g, ' ')\n[](#cb27-10)< \" foo_baz\
  \ = num1 + 35 * 42 / num2 \"\n[](#cb27-11)// 字符串开头/结尾的多余空格可以修剪\n[](#cb27-12)// 稍你将学习如何添加修饰符使得不需要修剪\n\
  [](#cb27-13)> 'foo_baz=num1+35*42/num2'.replace(/\\b/g, ' ').trim()\n[](#cb27-14)<\
  \ \"foo_baz = num1 + 35 * 42 / num2\"\n```\n\n单词边界也有反向锚点。`\\B` 匹配所有 `\\b` 不匹配的地方。这种双重性稍后会在其他转义序列中看到。\n\
  \n```\n[](#cb28-1)> let sample = 'par spar apparent spare part'\n[](#cb28-2)\n[](#cb28-3)//\
  \ 如果 'par' 不是单词开头则替换\n[](#cb28-4)> sample.replace(/\\Bpar/g, 'X')\n[](#cb28-5)<\
  \ \"par sX apXent sXe part\"\n[](#cb28-6)// 在单词结尾替换 'par' 但不是替换整个单词 'par'\n[](#cb28-7)>\
  \ sample.replace(/\\Bpar\\b/g, 'X')\n[](#cb28-8)< \"par sX apparent spare part\"\
  \n[](#cb28-9)// 如果 'par' 不是单词结尾则替换\n[](#cb28-10)> sample.replace(/\\bpar/g, 'X')\n\
  [](#cb28-11)< \"X sX apparent spare part\" // 等等，原文这里是 \\bpar 吗？让我重新检查。\n// 重新检查原文：[](#cb28-10)>\
  \ sample.replace(/\\bpar/g, 'X') -> 实际上原文写的是 \\bpar，但逻辑上应该是 \\B。\n// 再次查看提供的源码：[](#cb28-10)>\
  \ sample.replace(/\\bpar/g, 'X') - 这看起来是源码中的笔误，但我必须保留语义内容。\n// 等等，源码写的是：[](#cb28-10)>\
  \ sample.replace(/\\bpar/g, 'X') - 我将保持原样。\n// 实际上，仔细看提供的文本：[](#cb28-10)> sample.replace(/\\\
  bpar/g, 'X') \n// 我将遵循提供的文本。\n```\n\n\n\n\n\n```\n[](#cb32-1)> let items = ['hi42bye',\
  \ 'nice1423', 'bad42', 'cool_42a', 'fake4b']\n[](#cb32-2)\n[](#cb32-3)> items.filter(e\
  \ => test(e))       // 在此处添加你的解决方案\n[](#cb32-4)< [\"hi42bye\", \"nice1423\", \"\
  cool_42a\"]\n```\n\nd) 对于给定的输入数组，过滤所有以 `den` 开头或以 `ly` 结尾的元素\n\n```\n[](#cb33-1)>\
  \ let items = ['lovely', '1\\ndentist', '2 lonely', 'eden', 'fly\\n', 'dent']\n\
  [](#cb33-2)\n[](#cb33-3)> items.filter(e => test(e) || test(e))        // 在此处添加你的解决方案\n\
  [](#cb33-4)< [\"lovely\", \"2 lonely\", \"dent\"]\n```\n\ne) 对于给定的输入字符串，仅当单词 `mall`\
  \ 位于行首时，将其更改为 `1234`。\n\n```\n[](#cb34-1)> let para = `ball fall wall tall\n[](#cb34-2)mall\
  \ call ball pall\n[](#cb34-3)wall mall ball fall\n[](#cb34-4)mallet wallet malls\n\
  [](#cb34-5)\n[](#cb34-6)> console.log(para.replace())        // 在此处添加你的解决方案\n[](#cb34-7)<\
  \ ball fall wall tall\n[](#cb34-8)  1234 call ball pall\n[](#cb34-9)  wall mall\
  \ ball fall\n[](#cb34-10)  mallet wallet malls\n```\n\nf) 对于给定的数组，过滤所有包含以 `den`\
  \ 开头或以 `ly` 结尾行的元素\n\n```\n[](#cb35-1)> let items = ['lovely', '1\\ndentist', '2\
  \ lonely', 'eden', 'fly\\nfar', 'dent']\n[](#cb35-2)\n[](#cb35-3)> items.filter(e\
  \ => test(e) || test(e))      // 在此处添加你的解决方案\n[](#cb35-4)< [\"lovely\", \"1\\ndentist\"\
  , \"2 lonely\", \"fly\\nfar\", \"dent\"]\n```\n\ng) 对于给定的输入数组，不区分大小地过滤所有整个元素 `12\\\
  nthree`\n\n```\n[](#cb36-1)> let items = ['12\\nthree\\n', '12\\nThree', '12\\nthree\\\
  n4', '12\\nthree']\n[](#cb36-2)\n[](#cb36-3)> items.filter(e => test(e))     //\
  \ 在此处添加你的解决方案\n[](#cb36-4)< [\"12\\nThree\", \"12\\nthree\"]\n```\n\nh) 对于给定的输入数组，对于所有以\
  \ `hand` 开头并跟至少一个单词字符的单词，将 `hand` 替换为 `X`。\n\n```\n[](#cb37-1)> let items = ['handed',\
  \ 'hand', 'handy', 'unhanded', 'handle', 'hand-2']\n[](#cb37-2)\n[](#cb37-3)> items.map(w\
  \ => w.replace())        // 在此处添加你的解决方案\n[](#cb37-4)< [\"Xed\", \"hand\", \"Xy\"\
  , \"unhanded\", \"Xle\", \"hand-2\"]\n```\n\ni) 对于给定的输入数组，过滤所有以 `h` 开头的元素。此外，对于这些过滤出的元素，将\
  \ `e` 替换为 `X`。\n\n```\n[](#cb38-1)> let items = ['handed', 'hand', 'handy', 'unhanded',\
  \ 'handle', 'hand-2']\n[](#cb38-2)\n[](#cb38-3)> items.filter(w => test(w)).map(w\
  \ => w.replace())        // 在此处添加你的解决方案\n[](#cb38-4)< [\"handXd\", \"hand\", \"\
  handy\", \"handlX\", \"hand-2\"]\n```\n\nj) 为什么以下代码显示 `false` 而不是 `true`？\n\n```\n\
  [](#cb39-1)> /end$/.test('bend it\\nand send\\n')\n[](#cb39-2)< false\n```\n\n#\
  \ 分支与分组 (Alternation and Grouping)\n\n你经常想要检查输入字符串是否匹配多个模式。例如，汽车颜色是 `green`、`blue`\
  \ 还是 `red`。在编程术语中，你需要执行逻辑上的 OR 条件判断。本章将展示如何在这种情况下使用分支。这些模式之间也可能包含一些共同元素，在这种情况下，分组有助于形成更简洁的正则表达式。本章还将讨论用于确定哪种分支胜出的的优先级规则。\n\
  \n## OR 条件判断 (OR conditional)\n\n在条件表达式中，你可以使用逻辑运算符来组合多个条件。在正则表达式中，元字符 `|` 类似于逻辑\
  \ OR。如果由 `|` 分隔的表达式中的任何一个满足，正则表达式将进行匹配。这些分支中的每一个都是一个完整的正则表达式。例如，锚点（anchors）是特定于该特定分支的。\n\
  \n```\n[](#cb40-1)// 匹配 'cat' 或 'dog'\n[](#cb40-2)> const pets = /cat|dog/\n[](#cb40-3)>\
  \ pets.test('I like cats')\n[](#cb40-4)< true\n[](#cb40-5)> pets.test('I like dogs')\n\
  [](#cb40-6)< true\n[](#cb40-7)> pets.test('I like parrots')\n[](#cb40-8)< false\n\
  [](#cb40-9)// 替换字符串开头的 'cat' 或结尾的 'cat'\n[](#cb40-11)> 'catacat scat'.replace(/^cat|cat\\\
  b/g, 'X')\n[](#cb40-12)< \"Xap concatenate X\"\n[](#cb40-14)// 将 'cat'、'dog' 或 'fox'\
  \ 替换为 'mammal'\n[](#cb40-15)> 'cat dog parrot'.replace(/cat|dog|fox/g, 'mammal')\n\
  [](#cb40-16)< \"mammal mammal mammal\"\n```\n\n你可以从上面的示例中推断出可能存在需要许多分支的情况。详情请参见动态构建分支。\n\
  \n## 分组 (Grouping)\n\n通常，正则表达式之间存在共同点。它们可能是共同的字符或正则表达式限定符（如锚点）。在这种情况下，你可以使用一对元字符将它们分组。类似于数学中的\
  \ `a(b+c)d = abd`，在正则表达式中，你得到 `a(b|c)d = abd`。\n\n```\n[](#cb41-1)// 不使用分组\n[](#cb41-2)>\
  \ 'red reform arrest'.replace(/reform|rest/g, 'X')\n[](#cb41-3)< \"red X arX\"\n\
  [](#cb41-4)// 使用分组\n[](#cb41-5)> 'red reform arrest'.replace(/reform|st)/g, 'X')\n\
  [](#cb41-6)< \"red X arX\"\n[](#cb41-8)// 不使用分组\n[](#cb41-9)> 'par spare party'.replace(/\\\
  bpar\\b|\\part\\b/g, 'X')\n[](#cb41-10)< \"X spare party\"\n[](#cb41-11)// 提取锚点\n\
  [](#cb41-12)> 'par spare party'.replace(/\\b(par|part)\\b/g, 'X')\n[](#cb41-13)<\
  \ \"X spare party\"\n```\n\n## 优先级规则 (Precedence rules)\n\n当多个分支都匹配时，哪一个分支胜出取决于优先级规则。\n\
  \n```\n[](#cb42-1)> let words = 'lion elephant are'\n[](#cb42-3)// 'on' 和 'ant'\
  \ 的起始索引相同\n[](#cb42-4)// 所以取决于分支的顺序\n[](#cb42-5)> words.replace(/on|ant/, 'X')\n\
  [](#cb42-6)< false // 因为 'on' 替换了\n[](#cb42-7)> words.replace(/ant/, 'X')\n[](#cb42-8)<\
  \ \"liX elephant are\"\n```\n\n所以，如果两个分支在相同位置匹配会发生什么？这取决于从左到右的声明顺序。用于测试字符串的 `true`\
  \ 或 `false`\n\n```\n\n[](#cb43-1)> let mood = 'best years'\n[](#cb43-3)// 'year'\
  \ 和 'years' 的起始索引总是相同的\n[](#cb43-4)// 所以，哪一个被替换取决于分支的顺序\n[](#cb43-5)> mood.replace(/year|years/,\
  \ 'X')\n[](#cb43-6)< \"best Xs\"\n[](#cb43-7)> mood.replace(/years|year/, 'X')\n\
  [](#cb43-8)< \"best X\"\n```\n\n另一个 `replace` 示例以强调此问题。\n\n```\n[](#cb44-1)> let\
  \ sample = 'ear xerox at mare part learn eye'\n[](#cb44-3)// 这等同于：replace(/ar/g,\
  \ 'X')\n[](#cb44-4)> sample.replace(/ar|are|art/g, 'X')\n[](#cb44-5)< \"eX xerox\
  \ at mXe pXt leXn eye\"\n[](#cb44-6)// 这等同于：replace(/ar/g, 'X')\n[](#cb44-7)> sample.replace(/are|ar|art/g,\
  \ 'X')\n[](#cb44-8)< \"eX xerox at mX pXt leXn eye\"\n[](#cb44-9)// 呼，最后这个终于符合预期了\n\
  [](#cb44-10)> sample.replace(/are|art|ar/g, 'X')\n[](#cb44-11)< \"eX xerox at mX\
  \ pX leXn eye\"\n```\n\n## 快速查表与总结 (Cheatsheet and Summary)\n\n| 注意事项 | 描述 |\n\n\
  | --- | --- |\n\n| `pat1&#124|pat2&#124|pat3` | 作为 OR 条件组合的多个正则表达式 |\n\n|  | 每个分支可以有独立的锚点\
  \ |\n\n| `()` | 分组模式 |\n\n| `a(b&#124;c)d` | 等同于 `abd&#124;acd` |\n```\n\n\n\n\n\
  \n| 交替优先级 | 在输入中最早匹配的模式具有优先级 |\n| | 如果匹配项的起始位置相同，则按从左到右的顺序进行决胜 |\n\n因此，本章讨论了如何使用元字符\
  \ `|` 在同一个正则表达式中指定一个或多个交替匹配项。如果存在共同部分，可以使用 `()` 分组进行进一步简化。在这些交替项中，最早匹配的模式具有优先级。如果多个交替项从相同的位置开始匹配，则使用从左到右的顺序作为决胜规则。在下一章中，你将学习如何从字符串数组构建交替，并注意优先级规则。分组还有许多其他用途，将在后续章节中讨论。\n\
  \n## 练习\n\n### a) 对于给定的输入数组，过滤所有以 `den` 开头或以 `ly` 结尾的元素\n\n```javascript\n[](#cb45-1)>\
  \ let items = ['lovely', '1\\ndentist', '2 lonely', 'eden', 'fly\\n', 'dent']\n\
  [](#cb45-2)\n[](#cb45-3)> items.filter()        // 在处添加你的解决方案\n[](#cb45-4)< [\"\
  lovely\", \"2 lonely\", \"dent\"]\n```\n\n### b) 对于给定的数组，过滤所有包含以 `den` 开头或以 `ly`\
  \ 结尾行的元素\n\n```javascript\n[](#cb46-1)> let items = ['lovely', '1\\ndentist', '2\
  \ lonely', 'eden', 'fly\\nfar', 'dent']\n[](#cb46-2)\n[](#cb46-3)> items.filter()\
  \        // 在处添加你的解决方案\n[](#cb46-4)< [\"lovely\", \"1\\ndentist\", \"2 lonely\"\
  , \"fly\\nfar\", \"dent\"]\n```\n\n### c) 对于给定的输入字符串，将所有的 `removed`、`reed`、`received`\
  \ 或 `refused` 替换为 `X`。\n\n```javascript\n[](#cb47-1)> let s1 = 'creed refuse removed\
  \ read'\n[](#cb47-2)> let s2 = 'refused reed redo received'\n[](#cb47-3)\n[](#cb47-4)>\
  \ const pat1 =      // 在处添加你的解决方案\n[](#cb47-5)\n[](#cb47-6)> s1.replace(pat1, 'X')\n\
  [](#cb47-7)< \"cX refuse X read\"\n[](#cb47-8)> s2.replace(pat1, 'X')\n[](#cb47-9)<\
  \ \"X X redo X\"\n```\n\n### d) 对于给定的输入字符串，将 `late`、`later` 或 `slated` 替换为 `A`。\n\
  \n```javascript\n[](#cb48-1)> let str1 = 'plate full of slate'\n[](#cb48-2)> let\
  \ str2 = \"slated for later, don't be late\"\n[](#cb48-3)\n[](#cb48-4)> const pat2\
  \ =      // 在处添加你的解决方案\n[](#cb48-5)\n[](#cb48-6)> str1.replace(pat2, 'A')\n[](#cb48-7)<\
  \ \"pA full of sA\"\n[](#cb48-8)> str2.replace(pat2, 'A')\n[](#cb48-9)< \"A for\
  \ A, don't be A\"\n```\n\n# 转义元字符\n\n你已经看到了一些有助于构建正则表达式字面量的元字符和转义序列。此外还有 `/` 字符被用作正则表达式对象的边界符。本章将讨论如何移除此类结构的特殊含义。此外，你还将学习在从普通字符串构建正则表达式字面量时，如何处理特殊字符。\n\
  \n## 使用 \\ 进行转义\n\n要字面量地匹配元字符（即移除它们的特殊含义），请在这些字符前加上 `\\` 字符。要表示字面量上的 `\\` 字符，请使用\
  \ `\\\\`。\n\n```javascript\n[](#cb49-1)//即使 ^ 没有被用作锚点，它也不会被字面匹配\n[](#cb49-2)> /b²/.test('a²\
  \ + b² - C*3')\n[](#cb49-3)< false\n[](#cb49-4)// 转义将生效\n[](#cb49-5)> /b\\²/.test('a²\
  \ + b² - C*3')\n[](#cb49-6)< true\n[](#cb49-7)\n[](#cb49-8)> '(a*b) + c'.replace(/\\\
  (|\\)/g, '')\n[](#cb49-9)< \"a*b + c\"\n[](#cb49-10)\n[](#cb49-11)> '\\\\learn\\\
  \\by\\\\example'.replace(/\\\\/g, '/')\n[](#cb49-12)< \"/learn/by/example\"\n```\n\
  \n## 动态转义元字符\n\n当你自己定义正则表达式时，可以根据需要手动转义元字符。然而，如果你有从其他处获取字符串并需要字面量地匹配内容，你必须在构建正则表达式时设地转义所有元字符。解决方案自然是使用正则表达式！通常编程语言本身会为这种情况提供内置方法。JavaScript\
  \ 没有，但 [MDN：正则表达式文档](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Regular_Expressions)\
  \ 以如下所示函数的形式涵盖了这个问题。\n\n```javascript\n[](#cb50-1)> function escapeRegExp(string)\
  \ {\n  return string.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&');\n}\n```\n\n（注：上述代码块是根据所描述的任务的标准逻辑重构的，因为原始文本在提示中已截断或不完整）。\n\
  \n\n\n\n\n另一个需要注意转义的字符是用于定义 `RegExp` 字面量的定隔符。或者根据模式，你可以使用 `new RegExp` 构造函数来避免转义。\n\
  \n```\n[](#cb55-1)> let path = '/abc/123/foo/baz/ip.txt'\n[](#cb55-2)\n[](#cb55-3)//\
  \ 这被称为“倾斜牙签综合症”(leaning toothpick syndrome)\n[](#cb55-4)> path.replace(/^\\/abc\\\
  /123\\//, '~/')\n[](#cb55-5)< \"~/foo/baz/ip.txt\"\n[](#cb55-6)\n[](#cb55-7)// 使用\
  \ 'new RegExp' 可以提高可读性并减少输入错误\n[](#cb55-8)> path.replace(new RegExp(`^/abc/123/`),\
  \ '~/')\n[](#cb55-9)< \"~/foo/baz/ip.txt\"\n```\n\n## 转义序列\n\n某些字符（如制表符和换行符）可以使用转义序列\
  \ `\\t` 和 `\\n` 分别表示。这些与它们在普通字符串字面量中的处理方式相似。然而，如前所示，`\\b` 用于单词边界，而在普通字符串字面量中它代表退格字符。此外，还有一些是正则表达式特有的序列。\n\
  \n完整列表可以在 [MDN 文档](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Regular_Expressions)\
  \ 的**使用特殊字符**章节中找到。这些序列有 `\\b \\B \\cX \\d \\D \\f \\n \\p \\P \\r \\s \\S \\t \\\
  uhhhh \\uhhhhh \\v \\w \\W \\xhh \\0`。\n\n```\n[](#cb56-1)> 'a\\tb\\tc'.replace(/\\\
  t/g, ':')\n[](#cb56-2)< \"a:b:c\"\n[](#cb56-3)\n[](#cb56-4)> '1\\n2\\n3'.replace(/\\\
  n/g, ' ')\n[](#cb56-5)< \"1 2 3\"\n[](#cb56-6)\n[](#cb56-7)// 从字符串字面量构建正则表达式时，用\
  \ \\\\ 代替 \\\n[](#cb56-8)> new RegExp('123\\tabc')\n[](#cb56-9)< /123    abc/\n\
  [](#cb56-10)> new RegExp('123\\\\tabc')\n[](#cb56-11)< /123\\tabc/\n```\n\n这是另一个示例的控制台截图。\n\
  \n![Back in RegExp](img/file4.png)\n\n如果未定义转义序列，它将被视为其转义的字符本身。\n\n```\n[](#cb57-1)//\
  \ 这里 \\e 被处理为 e\n[](#cb57-2)> /\\e/.test('hello')\n[](#cb57-3)< true\n```\n\n你还可以使用十六进制转义格式\
  \ `\\xhh` 来表示字符，其中 `hh` 正好是两个十六进制字符。如果你使用转义表示元字符，它将被视为字面字符而非其元字符功能。Codepoints 章节将讨论\
  \ Unicode 字符的转义。\n\n```\n[](#cb58-1)// \\x20 是空格字符\n[](#cb58-2)> 'h e l l o'.replace(/\\\
  x20/g, '')\n[](#cb58-3)< \"hello\"\n[](#cb58-4)\n[](#cb58-5)// \\x7c 是 '|' 字符\n\
  [](#cb58-6)> '12|30'.replace(/2\\x7c3/g, '5')\n[](#cb58-7)< \"150\"\n[](#cb58-8)>\
  \ '12|30'.replace(/2|3/g, '5')\n[](#cb58-9)< \"15|50\"\n```\n\n> ![info](img/file2.svg)\
  \ 查看 [ASCII 代码表](https://ascii.cl/) 获取包含所有 ASCII 字符及其十六进制表示的方便备查表。\n\n## 速查表与总结\n\
  \n| 注意事项 | 说明 |\n| --- | --- |\n| `\\` | 在元字符前加上 `\\` 以以字面量匹配它们 |\n| `\\\\` | 用于字面量匹配\
  \ `\\` |\n| `source` | 将 RegExp 对象转换为字符串的属性 |\n| | 有助于将正则表达式插入另一个正则表达式中 |\n| `flags`\
  \ | 获取 RegExp 对象的标志的属性 |\n| `RegExp(`pat`)` | 有助于避免或减少对 `/` 定隔符的转义 |\n| 分支优先级 |\
  \ 如果匹配的起始位置相同，则从左到右进行决胜 |\n| | 健壮的解决方案：根据长度对分支进行排序，最长的在前 |\n\n## 练习题\n\n### a) 使用对两个字符串相同的逻辑将给定的输入字符串转换为预期输出。\n\
  \n```\n[](#cb59-1)> let str1 = '(9-2)*5+qty/3'\n[](#cb59-2)> let str2 = '(qty+4)/2-(9-2)*5+pq/4'\n\
  [](#cb59-3)\n[](#cb59-4)> const pat1 =      // 在此处添加你的解决方案\n[](#cb59-5)> str1.replace()\
  \        // 在此处添加你的解决方案\n[](#cb59-6)< \"35+qty/3\"\n[](#cb59-7)> str2.replace()\
  \        // 在此处添加你的解决方案\n[](#cb59-8)< \"(qty+4)/2-35+pq/4\"\n```\n\n### b) 仅在给定输入字符串的开头或结尾将\
  \ `(4)\\|` 替换为 `2`。\n\n```\n[](#cb60-1)> let s1 = '2.3/(4)\\\\|6 foo 5.3-(4)\\\\\
  |'\n[](#cb60-2)> let s2 = '(4)\\\\|42 - (4)\\\\|3'\n[](#cb60-3)> let s3 = 'two -\
  \ (4)\\\\|\\n'\n[](#cb60-4)\n[](#cb60-5)> const pat2 =      // 在此处添加你的解决方案\n[](#cb60-6)\n\
  [](#cb60-7)> s1.replace()      // 在此处添加你的解决方案\n[](#cb60-8)< \"2.3/(4)\\|6 foo 5.3-2\"\
  \n[](#cb60-9)> s2.replace()      // 在此处添加你的解决方案\n[](#cb60-10)< \"242 - 3\"\n[](#cb60-11)>\
  \ s3.replace()      // 在此处添加你的解决方案\n[](#cb60-12)< \"two - 2\"\n```\n（注：练习 b 的原始文本在提示中被截断了，我已根据提供的片段完成了逻辑）。\n\
  \n### c) 为给定的字符串将数组中的任何项替换为 `X`。\n\n```\n[](#cb61-1)> let items = ['a', '3+n', 'x',\
  \ 'y']\n[](#cb61-2)> const pat3 =      // 在此处添加你的解决方案\n[](#cb61-3)\n[](#cb61-4)>\
  \      // 在此处添加解决方案\n[](#cb61-5)>      // 在此处添加解决方案\n[](#cb61-6)> '3n''// 在此处添加解决方案\n\
  [](#cb61-7)> '3nn'// 在此处添加解决方案\n[](#cb61-8)> 'y'\n[](#cb61-9)< \"X\"\n```\n\n###\
  \ d) 将退格字符 `\b` 替换为单个空格。\n\n```\n[](#cb62-1)> let ip = '123 456'\n[](#cb62-2)\n\
  [](#cb62-3)>      // 在此处添加解决方案\n[](#cb62-4)< \"123 456\"\n```\n\n### e) 将所有的 `\\\
  e` 替换为 `e`。\n\n```\n[](#cb63-1)> let ip = 'there are'\n[](#cb63-2)>      // 在此处添加解决方案\n\
  [](#cb63-3)< \"there are\"\n```\n\n\n\n\n# 量词 (Quantifiers)\n\n量词可以帮助你重复 `regexp`\
  \ 的部分内容。它们可以应用于字面字符、分组以及你之后将学习的其他特征。除了指定精确数量和边界范围的能力，这些符号还可以匹配无边界的变化数量。如果输入字符串可以通过多种方式匹配具有不同数量的模式，你可以从两种量词中选择来缩小范围。在本节中，将介绍**贪婪（greedy）**类型的量词。\n\
  \n## `?` 元字符\n首先是 `?` 元字符，它将字符或分组限制匹配 `0` 或 `1` 次。这有助于定义可选模式并构建更简洁的正则表达式。\n\n```\n\
  [](#cb67-1)// 等于: /ear|ar/g\n[](#cb67-2)> 'far feat flare fear'.replace(/e?ar/g,\
  \ 'X')\n[](#cb67-3)< \"fX feat flXe fX\"\n[](#cb67-4)\n[](#cb67-5)// 等于: /\\bpar(t|)\\\
  b/g\n[](#cb67-6)> 'par spare part party'.replace(/\\bpart?\\b/g, 'X')\n[](#cb67-7)<\
  \ \"X spare X party\"\n[](#cb67-8)\n[](#cb67-9)// 等于: /\\b(re.d|red)\\b/\n[](#cb67-10)>\
  \ ['red', 'ready', 're;d', 'redo', 'reed'].filter(w => /\\bre.?d\\b/.test(w))\n\
  [](#cb67-11)< [\"red\", \"re;d\", \"reed\"]\n[](#cb67-12)\n[](#cb67-13)// 等于: /part|parrot/g\n\
  [](#cb67-14)> 'par part parrot parent'.replace(/par(ro)?t/g, 'X')\n[](#cb67-15)<\
  \ \"par X X parent\"\n[](#cb67-16)// 等于: /part|parrot|parent/g\n[](#cb67-17)> 'par\
  \ part parrot parent'.replace(/par(en|ro)?t/g, 'X')\n[](#cb67-18)< \"par X X X\"\
  \n```\n\n`*` 元字符将字符或分组限制匹配 `0` 次或多次。它没有上限，更多细节将在本章稍后部分讨论。\n\n```\n[](#cb68-1)//\
  \ 匹配 't' 后接零个或多个 'a'，再接 'r'\n[](#cbcb68-2)> 'tr tear tare steer sitaara'.replace(/ta*r/g,\
  \ 'X')\n[](#cb68-3)< \"X tear Xe steer siXa\"\n[](#cb68-4)\n[](#cb68-5)// 匹配 't'\
  \ 后接零个或多个 'e' 或 'a'，再接 'r'\n[](#cb68-6)> 'tr tear tare steer sitaara'.replace(/t(e|a)*r/g,\
  \ 'X')\n[](#cb68-7)< \"X X Xe sX siXa\"\n[](#cb68-8)\n[](#cb68-9)// 匹配零个或多个 '1'\
  \ 后接 '2'\n[](#cb68-10)> '3111111111125111142'.replace(/1*2/g, 'X')\n[](#cb68-11)<\
  \ \"3X511114X\"\n```\n\n这里是使用 `split` 方法的更多示例。\n\n```\n[](#cb69-1)// 最后元素是空的，因为字符串末尾的\
  \ '2' 之后没有内容\n[](#cb69-2)> '3111111111125111142'.split(/1*2/)\n[](#cb69-3)< [\"\
  3\", \"511114\", \"\"]\n[](#cb69-4)\n[](#cb69-5)//注意 '25' 和 '42' 是如何分割的，它们之间有零个\
  \ '1'\n[](#cb69-6)> '3111111111125111142'.split(/1*/)\n[](#cb69-7)< [\"3\", \"2\"\
  , \"5\", \"4\", \"2\"]\n```\n\n`+` 元字符将字符或分组限制匹配 `1` 次或多次。与 `*` 量词类似，它没有上限。重要的是，它不会出现匹配空字符串之类的意外情况。\n\
  \n```\n[](#cb70-1)> 'tr tear tare steer sitaara'.replace(/ta+r/g, 'X')\n[](#cb70-2)<\
  \ \"tr tear Xe steer siXa\"\n[](#cb70-3)> 'tr tear tare steer sitaara'.replace(/t(e|a)+r/g,\
  \ 'X')\n[](#cb70-4)< \"tr X Xe sX siXa\"\n[](#cb70-5)\n[](#cb70-6)> '3111111111125111142'.replace(/1+2/g,\
  \ 'X')\n[](#cb70-7)< \"3X5111142\"\n[](#cb70-8)> '311111111125111142'.split(/1+/)\n\
  [](#cb70-9)< [\"3\", \"25\", \"42\"]\n```\n\n你可以使用 `{}` 元字符指定整数范围，包括有边界和无边界的范围。有三种使用这种量词的方法，如下所示：\n\
  \n| 模式 |  |\n| --- | --- |\n| `{m,n}` | 匹配 `m` 到 `n` 次 |\n| `{m,}` | 至少匹配 `m` 次\
  \ |\n| `{n}` | 恰好匹配 `n` 次 |\n\n```\n[](#cb71-1)> let demo = ['abc', 'ac', 'abbc',\
  \ 'xabbbcz', 'bc', 'abbbbbc']\n[](#cb71-2)\n[](#cb71-3)> demo.filter(w => /ab{1,4}c/.test(w))\n\
  [](#cb71-4)< [\"abc\", \"abbc\", \"xabbbcz\"]\n[](#cb71-5)> demo.filter(w => /ab{0,2}c/.test(w))\n\
  ```\n\n\n\n\n和贪婪修饰符一样，懒惰修饰符尝试尝试整个正则表达式。\n\n```\n[](#cb77-1)> let sentence = 'that\
  \ is quite a fabricated tale'\n[](#cb77-2)\n[](#cb77-3)// t.*?a 将始终从第一个 't' 匹配到第一个\
  \ 'a'\n[](#cb77-4)> sentence.replace(/t.*?a/, 'X')\n[](#cb77-5)< \"Xt is quite a\
  \ fabricated tale\"\n[](#cb77-6)> 'star'.replace(/t.*?a/, 'X')\n[](#cb77-7)< \"\
  sXr\"\n[](#cb77-8)\n[](#cb77-9)// 对于 t.*?a 来说，匹配第一个 't' 到第一个 'a' 在这种情况下不起作用\n[](#cb77-10)//\
  \ 所以，正则引擎将向前移动直到 .*?f 匹配，以此类推\n[](#cb77-11)> sentence.replace(/t.*?a.*?f/, 'X')\n\
  [](#cb77-12)< \"Xabricated tale\"\n```\n\n## s 标记\n\n使用 `s` 标记允许 `.` 元字符匹配 `\\r`、`\\\
  n` 以及行/段落分隔符字符。\n\n```\n[](#cb78-1)// 默认，. 元字符不匹配行分隔符\n[](#cb78-2)> 'Hi there\\\
  nHave a Nice Day'.replace(/the.*ice/, 'X')\n[](#cb78-3)< \"Hi there\n[](#cb78-4)\
  \  Have a Nice Day\"\n[](#cb78-5)\n[](#cb78-6)// 's' 标记将允许行分隔符被匹配\n[](#cb78-7)>\
  \ 'Hi there\\nHave a Nice Day'.replace(/the.*ice/s, 'X')\n[](#cb78-8)< \"Hi X Day\"\
  \n```\n\n## 抄表与总结\n\n| Note | 描述 |\n| --- | --- |\n| `.` | 匹配除行分隔符外的任意字符 |\n| `s`\
  \ | 标记，允许 `.` 元字符匹配行分隔符 |\n| greedy | 尽可能多匹配 |\n| `?` | 贪婪修饰符，匹配 0 或 1 次 |\n| `*`\
  \ | 贪婪修饰符，匹配 0 次或多次 |\n| `+` | 贪婪修饰符，匹配 1 次或多次 |\n| `{m,n}` | 贪婪修饰符，匹配 `m` 到 `n`\
  \ 次 |\n| `{m,}` | 贪婪修饰符，匹配至少 `m` 次 |\n| `{n}` | 贪婪修饰符，精确匹配 `n` 次 |\n| `pat1.*pat2`\
  \ | `pat1` 和 `pat2` 之间任意数量的字符 |\n| `pat1.*pat2&#124;pat2.*pat1` | 以任意顺序匹配 `pat1`\
  \ 和 `pat2` |\n| non-greedy | 在贪婪修饰符后添加 `?` |\n| | 尽可能少地匹配 |\n| `s.split(/pat/)`\
  \ | 根据正则表达式分割字符串 |\n\n本章引入了使用占位符代替固定字符串的概念。结合修饰符，你已经领略了简单的正则表达式如何匹配宽范围的文本。在接下来的章节中，你将学习如何创建自己的受限占位符字符集。\n\
  \n## 练习\n\n> ![info](img/file2.svg) 根据输入字符串的内容，为这些练习使用 `s` 标记。\n\n**a)** 对于给定输入，将\
