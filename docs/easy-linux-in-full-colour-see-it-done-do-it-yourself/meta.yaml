    **More Games**


    Of course, there are many more games for Linux on the Internet. Go to http://www.linuxgames.com.


    ## Maintaining Your System


    Maintaining a Linux system is similar to maintaining a Windows or Macintosh computer.
    As with any computer platform, the processes are similar but the software is slightly
    different. This part introduces some basic maintenance techniques such as backing
    up your data, checking your hard disk, and other tasks to help keep your system
    running efficiently.


    ## Tasks


    | Task # | Description | Page # |

    |---|---|---|

    | 1 | Backing Up Files | 182 |

    | 2 | Restoring a Backup | 183 |

    | 3 | Configuring a Dual-Boot PC | 184 |

    | 4 | Backing Up Files on a Dual-Boot PC | 186 |

    | 5 | Displaying Your Configuration | 188 |

    | 6 | Viewing Current Tasks | 190 |

    | 7 | Adding Hardware | 192 |

    | 8 | Cleaning Up Unnecessary Files | 193 |

    | 9 | Maintaining Network and User Accounts | 194 |

    | 10 | Checking Your Hard Disk | 197 |


    ## Task 1: Backing Up Files


    As a precaution to unforeseen computing disasters, you should periodically make
    an extra copy of your files. This is called a backup. You can use tar or gzip
    to back up your files. This task shows you how to create a backup archive using
    GNU tar.


    ## Backing Up with Multiple Floppy Disks


    To back up a folder to more than one floppy using tar, type **tar cMf /dev/fd0
    backups**. As you type commands, don''t forget that Linux is case sensitive.


    ## gzip


    You can also create a backup archive of a folder or files with gzip, a file compression
    application installed with OpenLinux. Type **man gzip** for more information about
    how to use gzip.


    ## WARNING


    GNU tar will not create an archive in the same folder you are trying to archive.


    - 1. Select the files or folders you want to back up, and move them into one folder
    on your hard disk.


    - 2. Click the Terminal Window button in the KPanel bar.


    - 3. Insert a disk into your PC, and type **tar cf /dev/fd0 backups** in the Terminal
    window. This creates a new tar archive of the Backups folder using the floppy
    to store the backup file.


    - 4. Type **tar uf /dev/fd0 backups** to add any new files to the backup archive
    on the floppy disk.


    ## Task 2: Restoring a Backup


    Backup files are stored in a special file format on your floppy disk. You won''t
    be able to view the contents of the floppy if you insert it into a PC running
    Windows or into a Macintosh computer. You can restore one file or all files from
    a backup session by using some of the tar options. To view tar options, type **tar
    --help** in a Terminal window. This task shows you how to restore all files in
    a tar archive on a single floppy disk.


    - 1. Click the Terminal Window button in the KPanel bar.


    2. Insert the floppy disk with the backup file. Type **tar xf /dev/fd0**. This
    command extracts the files from the tar archive located on the floppy disk.


    3. Click the Home Directory button on the KPanel bar.


    4. View the restored backup files on your hard disk. Use the files to verify they
    continue to function after being restored from a backup.


    ## Restoring Multiple Disk Archives


    Restore an archive that consists of multiple floppy disks using GNU tar. Type
    **tar xMf /dev/fd0**. This command uses the M option to request a new storage
    component, such as a floppy disk, when the current one is filled.


    ## Viewing Tar Archives


    You can see the files stored in a tar archive. Type **tar tf /dev/fd0**, for example,
    to view the files stored in the tar archive on a floppy disk.


    ## Task 3: Configuring a Dual-Boot PC


    If your PC is not on a network, or if you want to share files between Linux and
    Windows, you can configure LILO (LInux LOader) to enable you to choose either
    DOS or Linux when you start up your PC. If you start up with Linux, you can mount
    the DOS partition of your hard disk to your Linux partition. Then you can copy
    files from Linux to DOS so that, when you boot with Windows, you can work with
    any files you created in Linux.


    > **The mount Command**

    > Mounting the DOS partition is similar to mounting a floppy or CD-ROM in Linux.
