  md: '# Task 2: Installing OpenLinux


    One of the more memorable experiences you will have using Linux is installing
    it onto your computer. OpenLinux works with a general short list of PC hardware,
    and there''s a fairly long list of little things that don''t work quite right
    with either the installer or OpenLinux. This task walks you through a successful
    installation.


    # Configuration Information


    Before you start installing Linux, be sure to have your monitor, graphics card,
    network card, printer, modem, and hard disk information handy. Most of this information
    can be gathered by viewing **Control Panel** information if Windows is already
    running on the PC on which you want to install Linux.


    ![](img/28e2bccabaf327178ce9997934f991d9_15_0.png)


    +   1. Insert the CD from this book into the PC and start your PC.

    2. Wait for the Lizard application to load. Click the language you want to use
    to with the installation (in this case, **English**). Click **Next**.

    3. Select the mouse you want to use. Lizard will try to auto-detect your mouse
    and choose the setting for you. Click **Next** to continue.

    4. Select a hard disk and choose a partition on it. Click **Prepare selected disk
    for Linux**. Wait for Lizard to format the partition, and click **Next**.'
  merge: -1
