  md: '# # How to Use This Book


    # ## It''s as Easy as 1-2-3


    Each part of this book is made up of a series of short, instructional lessons,
    designed to help you understand basic information that you need to get the most
    out of your computer hardware and software.


    +   - **Click**: Click the left mouse button once.

    - **Double-click**: Click the left mouse button twice in rapid succession.

    - **Right-click**: Click the right mouse button once.

    - **Pointer Arrow**: Highlights an item on the screen you need to point to or
    focus on in the step or task.

    - **Selection**: Highlights the area onscreen discussed in the step or task.

    - **Click & Type**: Click once where indicated and begin typing to enter your
    text or data.


    Tips and Warnings give you a heads-up for any extra information you may need while
    working through the task.


    Each task includes a series of quick, easy steps designed to guide you through
    the procedure.


    How to Drag: Point to the starting place or object. Hold down the mouse button
    (right or left per instructions), move the mouse to the new location, then release
    the button.


    Each step is fully illustrated to show you how it looks onscreen.


    Items that you select or click in menus, dialog boxes, tabs, and windows are shown
    in **bold**. Information you type also is in **bold**.


    **Next Step**: If you see this symbol, it means the task you''re working on continues
    on the next page.


    **End Task**: Task is complete.'
  merge: -1
