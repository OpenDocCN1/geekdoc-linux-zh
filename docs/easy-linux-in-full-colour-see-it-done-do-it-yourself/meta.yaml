    # Linux and the GNU System


    The GNU project started 12 years ago with the goal of developing a complete free
    UNIX-like operating system. "Free" refers to freedom, not price; it means you
    are free to run, copy, distribute, study, change, and improve the software.


    A UNIX-like system consists of many different programs. We found some components
    already available as free software—for example, X Window and TeX. We obtained
    other components by helping to convince their developers to make them free—for
    example, the Berkeley network utilities. Other components we wrote specifically
    for GNU—for example, GNU Emacs, the GNU C compiler, the GNU C library, Bash, and
    Ghostscript. The components in this last category are "GNU software".


    The GNU system consists of all three categories together.


    The GNU project is not just about developing and distributing free software. The
    heart of the GNU project is an idea: that software should be free, and that the
    users'' freedom is worth defending. For if people have freedom but do not value
    it, they will not keep it for long. In order to make freedom last, we have to
    teach people to value it.


    The GNU project''s method is that free software and the idea of users'' freedom
    support each other. We develop GNU software, and as people encounter GNU programs
    or the GNU system and start to use them, they also think about the GNU idea. The
    software shows that the idea can work in practice. People who come to agree with
    the idea are likely to write additional free software. Thus, the software embodies
    the idea, spreads the idea, and grows from the idea.


    This method was working well—until someone combined the Linux kernel with the
    GNU system (which still lacked a kernel), and called the combination a "Linux
    system."


    The Linux kernel is a free UNIX-compatible kernel written by Linus Torvalds. It
    was not written specifically for the GNU project, but the Linux kernel and the
    GNU system work together well. In fact, adding Linux to the GNU system brought
    the system to completion: it made a free UNIX-compatible operating system available
    for use.


    But ironically, the practice of calling it a "Linux system" undermines our method
    of communicating the GNU idea. At first impression, a "Linux system" sounds like
    something completely distinct from the "GNU system." And that is what most users
    think it is.


    Most introductions to the "Linux system" acknowledge the role played by the GNU
    software components. But they don''t say that the system as a whole is more or
    less the same GNU system that the GNU project has been compiling for a decade.
    They don''t say that the idea of a free UNIX-like system originates from the GNU
    project. So most users don''t know these things. This leads many of those users
    to identify themselves as a separate community of "Linux users", distinct from
    the GNU user community. They use all of the GNU software; in fact, they use almost
    all of the GNU system; but they don''t think of themselves as GNU users, and they
    may not think about the GNU idea.'
