  md: '# Task 10: Copying Text


    ![](img/28e2bccabaf327178ce9997934f991d9_56_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_56_1.png)


    One of the most common editing tasks is copying text. You can copy text, and then
    past the copy in the current document or in another document.


    ![](img/28e2bccabaf327178ce9997934f991d9_56_2.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_56_3.png)


    # WARNING


    StarOffice is not included with the CD-ROM included with this book. It is available
    from Star Division for a nominal fee at http://www.stardivision.com.


    +   1. Select the text you want to copy.


    +   2. Click **Edit** and choose **Copy**.


    +   3. Click the location in the document where you want to put the copied data.


    +   4. Click **Edit** and select the **Paste** command. The data is pasted into
    the document.


    # Working with More Than One Document


    To copy data from one open document to another, select the text and move to the
    document where you want to paste the text using the **Window** menu.'
