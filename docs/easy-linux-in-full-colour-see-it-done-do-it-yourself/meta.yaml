- md: '# Task 1: Reading HTML and PostScript Files


    If you are already familiar with Web browsers, you might have noticed that KDE''s
    windows work similarly to Web browser windows. Folder and filenames are links
    to the actual files on your hard disk. You can open an HTML or PostScript file
    in a window that shares the same toolbar as the window you use to view your folders
    and files on your hard disk.


    ![](img/28e2bccabaf327178ce9997934f991d9_75_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_75_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_75_2.png)


    ## The Ghostview Application


    You can view PostScript files on your desktop with the Ghostview (gv) application.
    Click the K button, choose Applications, and select GV to start Ghostview.


    1. Click the Netscape Communicator icon on the KPanel bar.

    2. Type the path to the HTML file you want to view. In this case, I''ve typed
    **file:/usr/doc/HOWTO/other-formats/html/**. Click a filename in the Netscape
    browser window.

    3. Click the Terminal button in the KPanel bar.


    ![](img/28e2bccabaf327178ce9997934f991d9_76_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_76_1.png)


    ```

    cd /usr/doc/xv-3.10a/

    gv epsf.ps.gz

    ```


    Type a path to a PostScript file. In this case, I''ve typed **cd /usr/doc/xv-3.10a/**.
    Type **gv epsf.ps.gz** to view the PostScript file.


    The file opens.


    ## Lynx


    You can also view **HTML** files from a command line using the **lynx** command.
    Click the **K** button, choose **Utilities**, and select **Terminal** to open
    a Terminal window. Type **lynx** followed by the document or **HTML** filename
    to view the file. For example, type **lynx mynewdoc.txt** to view the document
    mynewdoc in the lynx application.


    ## 4


    There are two ways to connect your PC to the Internet. The faster and easier way
    is to have a network card installed on your PC, and then connect your PC to an
    Internet-savvy network. If you are using your PC at home, you will most likely
    need a modem. OpenLinux is really picky about the modems it can work with. Be
    sure to have a Hayes-compatible modem.


    ### PCI and WinModems


    Currently, OpenLinux is not compatible with PCI modem cards or WinModems. What
    does this mean? OpenLinux currently does not have modem and device drivers that
    support these kinds of modems. You might need to purchase an external modem to
    use Linux to connect to your ISP.


    # Task 2: Setting Up Your Modem Connection


    ## Start Here


    ![](img/28e2bccabaf327178ce9997934f991d9_77_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_77_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_77_2.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_77_3.png)


    1. Click the Terminal button in the KPanel bar.

    2. Type **lisa** in the Terminal window. Then press Enter.

    3. Select **System Configuration**, and then choose **Hardware Configuration**.
    Use the up and down arrows to select an item in the onscreen menu.

    4. Select **Configure Modem**.


    ## Next Step


    ![](img/28e2bccabaf327178ce9997934f991d9_78_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_78_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_78_2.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_78_3.png)


    ## Choosing a Serial Port


    If you have Windows installed on your PC, click the **Start** menu, choose **Control
    Panels**, and select **Systems**. Click the **Devices** tab, and then choose the
    modem to view the port used by the modem attached to your PC. Select this same
    port for your OpenLinux modem configuration.


    ## PCMCIA Modems


    If you have installed OpenLinux onto your laptop, log in as the **root** operator,
    and then use a text editor to create a file called **pcmcia** in **/etc/sysconfig**.
    For more information about PC cards, go to **/usr/doc/pcmcia-cs**.


    The file should contain the following lines:


    ```

    PCMCIA=yes

    PCIC=i82365

    OPTS="poll_interval=300"

    ```


    5. Select **Hayes-compatible modem**, and then press Enter.

    6. Select the serial port to which your modem is connected. Press Enter.

    7. Select the data transfer rate supported by your modem. Then press Enter.

    8. Press Escape until you exit lisa and return to the Terminal window.


    # Task 3: Setting Up Your Internet Connection


    If you have a modem, you must have an Internet service provider to connect your
    PC to the Internet. The connection to the Internet uses a point-to-point protocol,
    which is referred to as PPP. Linux uses an application called KPPP to store all
    the information Linux needs to connect to the Internet.


    1. **KPPP Log**: For more detailed information about your Internet connection,
    click the **Log** button in the Connecting to: dialog window.


    2. **Multiple ISPs**: If you have more than one Internet service provider, you
    can configure KPPP to connect to any one of a number of accounts you can create
    in the KPPP application. You will need to enter each login and password each time
    you switch to a different Internet service provider account.


    Click the **K** button, select **Internet**, and then choose **Kppp**.


    Click the **Setup** button.


    Click **New**.


    Click the **Dial** tab, and then type the name of your ISP and the phone number
    you will use to dial in to the ISP. Your ISP should give you this info.


    ![](img/28e2bccabaf327178ce9997934f991d9_79_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_79_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_79_2.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_79_3.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_80_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_80_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_80_2.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_80_3.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_80_4.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_80_5.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_80_6.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_80_7.png)


    5. Click the **DNS** tab, and then type the domain name of your service provider.
    Add the DNS addresses for the ISP to the **DNS Address List**.


    6. Click **OK** to return to the kppp Configuration window.


    7. Click the **Device** tab. Be sure to select the correct serial port for your
    modem using the **Modem Device** menu.


    8. Click **OK** once more to return to the kppp window.


    ## Login Scripts


    If you are using a national ISP such as Earthlink or Netcom, you probably won''t
    need to use a login script to connect. If your ISP requires a login or chat script,
    it will most likely have an example available on its Web site. Here''s a general
    login script that might or might not work:


    ```

    Expected: login:

    Send: mylogin

    Expected: password:

    Send: mypassword

    ```


    # Setting Up Your Internet Connection Continued


    ![](img/28e2bccabaf327178ce9997934f991d9_81_0.png)


    ## Querying Your Modem


    Check to see whether KPPP can see your modem by clicking the **Modem** tab and
    clicking **Query Modem**. A list of modem characteristics appears in the **Modem
    Query Results** window. If KPPP cannot see your modem, or if KPPP thinks the modem
    is busy, Linux might not be compatible with it.


    ## Don''t Give Up!


    If you don''t successfully log in to your ISP account the first time you try,
    that''s okay. Try connecting a few more times. Even if you have a 56K modem, you
    might want to set the connection speed to 38600 to see if this helps Linux connect
    to the ISP''s remote server.


    ![](img/28e2bccabaf327178ce9997934f991d9_81_1.png)


    9. Type your account name and password into the kppp **Login ID** and **Password**
    fields.


    10. Click the **Connect** button.


    11. Wait for the modem to connect to your Internet service provider. When your
    PC is connected, the connect window and any open log windows will automatically
    close.


    # Task 4: Checking Your Internet Connection


    After you connect to the Internet, you can open other applications, browse Web
    pages, read email, or view the status of your Internet connection. This task shows
    you how to review information about your Internet connection. This can be helpful
    for optimizing your Internet experience or troubleshooting problems that might
    occur with your system at some point in the future.


    ![](img/28e2bccabaf327178ce9997934f991d9_82_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_82_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_82_2.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_82_3.png)


    1. Click the **Earthlink** (or your ISP) button in the taskbar.


    2. Click the **Details** button.


    3. View the information in the kppp Statistics window.


    4. Click the **Close** button to exit the window.


    ## Stopping the Connection


    Press Cancel in the **Connect to:** box to stop the modem from dialing in to the
    Internet.'
