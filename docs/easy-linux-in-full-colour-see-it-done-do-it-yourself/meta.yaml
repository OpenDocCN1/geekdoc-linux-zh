  - '[PAGE 25]


    # Task 8: Scrolling a Window


    If you store many items in a window, you might not be able to view all of a window''s
    contents onscreen at the same time. You can use a window''s scrollbars to view
    rows of icons or file-names.


    ![](img/28e2bccabaf327178ce9997934f991d9_25_0.png)


