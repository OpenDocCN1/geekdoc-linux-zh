  md: "# Task 12: Looking Up a Help Topic in KDE\n\nKDE uses HTML pages to present\
    \ helpful information about OpenLinux and the applications installed with Caldera\
    \ Linux 2.2. Using KDE Help is similar to browsing a Web page. Selecting Help\
    \ in any KDE window opens the KFM handbook. You can also search for a particular\
