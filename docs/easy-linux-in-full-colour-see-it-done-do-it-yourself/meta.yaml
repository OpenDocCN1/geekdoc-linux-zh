  md: '# Task 2: Printing Text Files


    Linux offers you the best of both computing worlds. That is, you can print text
    from a command line or from the user-friendly K development environment. Both
    text and graphics files can be either bitmapped or PostScript-based documents.
    To print a PostScript document, you must have a PostScript printer configured
    with Linux. This task shows you how to print from the command line as well as
    with the Text Editor application.


    ![](img/28e2bccabaf327178ce9997934f991d9_109_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_109_1.png)


