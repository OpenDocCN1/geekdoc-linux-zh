    \ to your Ethernet network hub.\n- **IP Addresses**\n  If you do not plan to connect\
    \ to the Internet, you do not need to use authentic IP addresses in your Ethernet\
    \ configuration.\n\n+   1. Install an Ethernet card into your PC according the\
