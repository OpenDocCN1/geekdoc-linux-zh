    \ 的工作方式类似于纸质便利贴。\n\n- **右键单击笔记**\n  右键单击任意笔记并选择 Sticky（置顶），该笔记将出现在每个 KDE 虚拟桌面上。\n\
    \  右键单击 KNote，选择 To Desktop（发送到桌面），然后选择特定的虚拟桌面，以将 KNote 发送到指定桌面。\n\n- **选项（Options）**\n\
    \  要更改字体、背景颜色、前景颜色或 KNotes 命令，请右键单击 Operations（操作） 并选择 Options（选项），然后选择你想要使用的菜单命令。\n\
    \n1. 单击 **K** 按钮，选择 **Utilities（实用工具）**，然后选择 **KNotes**。\n2. 在笔记上右键单击并选择 **Insert\
    \ Date（插入日期）**。日期将出现在 KNote 页面上。\n3. 在笔记上右键单击，选择 **Operations（操作）**，然后选择 **Alarm（闹钟）**。\n\
    \n4. 单击箭头控件来更改要为所选笔记设置闹钟的 **Day（日）**、**Month（月）**、**Year（年）** 或 **Time（时间）**。然后单击\
    \ **Set（设置）** 按钮。\n\n5. 在笔记上右键单击，选择 **Operations（操作）**，然后选择 **New Note（新建笔记）**。\n\
    \n6. 键入一些文本。注意当你添加文本时滚动条会出现。按 Enter 开始新的段落（KNotes 不会自动换行）。单击关闭按钮以保存并退出笔记。\n\n\
    ### 笔记颜色\n\nKNote 中的每个笔记页面都可以有独特的颜色。要更改 KNote 页面的颜色，请右键单击笔记，选择 **Operations（操作）**，选择\
    \ **Options（选项）**，然后选择 **Colors（颜色）**。然后选择 **Background Color（背景颜色）**。在颜色选择器窗口中单击一种颜色。单击\
    \ **OK** 保存更改。所选笔记将变为你新选择的颜色。\n\n## 任务 4：使用个人时间追踪器\n\n如果你想测量 Linux 运行一项任务所需的时间，或者你需要一个简单的工具来追踪不同项目的计费工时，不妨看看\
    \ Personal Time Tracker（个人时间追踪器）。\n\n### 给自己发送提醒\n\n你可以使用 at 命令给自己发送提醒。例如，要在 9:00\
    \ 提醒自己开会，请输入 `at 9:00`，然后按 Enter。然后输入 `xmessage -display :0.0 \"Time for the weekly\
    \ meeting\"`，并按 Enter。按 Ctrl+D 保存提醒。\n\n### 删除任务\n\n要移除任务，请选择任意任务，单击 Task（任务），然后选择\
    \ Delete（删除），或者按 Ctrl+D。\n\n1. 单击 K 按钮，选择 **Utilities（实用工具）**，然后选择 **Personal\
    \ Time Tracker（个人时间追踪器）**。\n2. 单击 **Task（任务）** 并选择 **New（新建）**，或按 Ctrl+N。\n3.\
    \ 输入任务名称。然后单击 **OK**。\n4. 新任务将出现在 Personal Time Tracker 窗口中。\n\n### 自定义快捷键\n\n\
    单击 File（文件） 并选择 Preferences（首选项） 或按 Ctrl+P 查看 Preferences（首选项） 窗口。你可以在这里修改菜单命令快捷方式。单击\
    \ OK 关闭 Preferences（首选项） 窗口。\n\n### Crontab\n\n使用 Crontab 文件安排定期任务。有关如何使用 Crontab\
    \ 的更多信息，请参阅第 7 部分“设置应用程序”中的任务 12“Scheduling Applications（安排应用程序）”。\n\n5. 在主窗口中单击一个任务。然后单击工具栏上的\
    \ Start Clock（开始计时） 按钮。\n6. 单击 Stop Clock（停止计时） 按钮停止追踪所选任务。\n7. 单击 File（文件） 并选择\
    \ Exit（退出） 退出应用程序。\n\n### 日历\n\n如果你有使用日历做笔记或安排提醒的习惯，请参阅任务 6“使用 Plan 安排预约”。\n\n\
    ## 任务 5：使用计算器\n\n如果你需要进行简单或复杂的计算，请使用 Caldera Linux 2.2 附带的 Calculator（计算器） 应用程序。你可以进行简单的数学运算，如加法、减法、乘法和除法，也可以将十进制转换为十六进制，或计算正弦、余弦等。\n\
    \n**X Calc**\n\n如果你想试试 Caldera Linux 2.2 附带的另一款多功能计算器，请单击 K 按钮，选择 Utilities（实用工具）\
    \ ，然后选择 X Calc。\n\n**统计和三角模式**\n\n你可以通过单击 kCalc 按钮并选择 Defaults（默认值） 选项卡，在 Trigonometry（三角学）\
    \ 和 Statistical（统计） 模式之间切换。\n\n1. 单击 **K** 按钮，选择 **Utilities（实用工具）**，然后单击 **Calculator（计算器）**。\n\
    2. 单击计算器上的按钮输入方程式。\n3. 单击 **=** 计算方程式总和。查看方程式结果。\n4. 单击一览表单击 **kCalc** 按钮查看计算器首选项。\n\
    5. 在标题栏上右键单击并选择 **Close（关闭）** 退出应用程序。\n\n**数字锁定键**\n\n按键盘上的 Num Lock 键以使用数字小键盘向计算器应用程序输入数字。\n\
    \n## 任务 6：使用 Plan 安排预约\n\nCaldera 的 Linux 2.2 附带了一个完整的日历，让你能够安排预约、提醒自己，以及打印一天或一个月的信息量。本任务向你展示如何设置当前日期并使用\
    \ Plan 安排预约。\n\n1. 单击 **K** 按钮，选择 **Office（办公）**，然后选择 **Plan**。\n2. 如果你想用 Plan\
    \ 追踪预约，请单击 **Start daemon now（立即启动守护进程）**。\n3. 单击 **Config（配置）** 并选择 **Adjust\
    \ time（调整时间）**。\n\n**打印**\n\n单击 File（文件） 并选择 Print（打印） 以打印单日或整月的日历。\n"
