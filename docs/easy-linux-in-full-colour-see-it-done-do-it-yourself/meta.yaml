  md: '# # Working with Disks, Folders, and Files


    Whether you''re using the command line or KDE, learning how to work with files
    and folders is an essential part of working with Linux. Files and folders are
    collectively stored on your hard disk''s file system. You can create folders—also
    called directories—to keep your files organized. You can open, close, move, rename,
    and view a folder''s or document file''s contents. You can also create, move,
    or delete folders and files.


    As you continue to work on your computer, you will create more files and folders.
    Eventually, you will need a way to keep these files organized. You can organize
    your files by copying, moving, and deleting unnecessary files. This part covers
    how to work with files and folders using the Terminal window and KDE.'
  merge: -1
