  md: '# Task 1: Adding a Printer


    Printing a document involves a few more steps besides connecting the cable from
    the printer to your computer. This task shows you how to configure your printer
    with Linux using the Lisa system administration tool.


    # Mounting a CD


    If your printer software is on a CD-ROM, double-click the CD icon installed by
    the KDE Wizard, or type mount /mnt/cdrom in a Terminal window.


    # Printer Help


    For more information about printing, go to file:/usr/doc/HOWTO/other-formats/html
    in a browser window and select the Printing-HOWTO or Printing-Usage-HOWTO


    Tip: You can also visit Caldera''s Web site at http://www.calderasystems.com for
    the latest information about Linux 2.2.


    Connect the printer to your PC. Then power on the printer and the PC and log in
    to Linux. Click the **K** menu, select **Utilities**, and choose **Terminal**.


    Type **dmesg | less** and scroll to find the line similar to **lp0 at 0x0378 (polling)**.
    This means Linux detected the printer at the lp0 port (/dev/lp0). Type **q** to
    exit the document.


    Type **lisa** in the Terminal window. Select **System Configuration**, and then
    **Hardware Configuration** on the following screen. Then choose **Configure Printer**.


    Select a printer driver (in this case, I chose **Local PostScript Printer**).


    ![](img/28e2bccabaf327178ce9997934f991d9_107_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_107_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_107_2.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_107_3.png)'
  merge: -1
  pgno: 107
- img_proc: true
  md: '![](img/28e2bccabaf327178ce9997934f991d9_108_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_108_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_108_2.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_108_3.png)


    # Can''t Print?


    I had to restart my system and my printer twice before I could actually start
    printing with Linux to a PostScript printer. For more information about the lpr
    application, type man lpr in a Terminal window, or type the following path and
    read the document at /usr/doc/LPRng to make sure the lpd printer daemon is set
    up correctly.


    # The lpd Daemon


    Before you can print, Linux must run the lpd daemon. Click the K button and choose
    COAS, select System, and then choose Daemons. Click the Print Server (LPD) check
    box. Click OK to activate the lpd daemon, and then restart Linux.


    +   1. Select a printer port (I chose **LP0** from step 2).

    2. Select a default printer resolution (in this case, I chose **300x300**).

    3. Select the default paper size (in this case, I chose **Letter**). Press Enter,
    and then press Escape until you return to the Terminal window.

    4. Type **ls -l | lpr** and press Enter to print a test page.'
  merge: -1
