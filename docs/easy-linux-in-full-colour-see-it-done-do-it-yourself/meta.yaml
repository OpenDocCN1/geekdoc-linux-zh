  md: '# # Task 5: Configuring Additional Processors


    As a default, Linux is configured to work on a single-processor PC. If you have
    a PC with two or more processors, you must modify the makefile and recompile the
    sources for the kernel to take advantage of shared multiple processors (SMP).


    **WARNING**


    To configure OpenLinux to work with multiple processors, you must recompile some
    of the source code (more specifically, the kernel source code) in OpenLinux. If
    you have not compiled source code before, it''s probably better to skip this task.


    **Monitoring Usage**


    Currently, there is no way to monitor which processors are running which software,
    and how much of the processor cycles are being consumed by software running on
    the PC.


    **Updates**


    Look for updates to the SMP code at http://www.calderasystems.com.


    +   1. Click the **K** button, select **Utilities**, and then choose **Terminal**.

    2. Go to **/usr/src/linux**.


    ![](img/28e2bccabaf327178ce9997934f991d9_147_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_147_1.png)'
  merge: -1
