  md: "# Task 6: Changing Your Mouse Settings\n\nYou can adjust the mouse buttons\
    \ and double-click speed to make using the mouse more comfortable. Suppose, for\
    \ example, you are left-handed. Switching the right and left mouse buttons might\
    \ make your work a little easier. Similarly, if you are having trouble moving\
    \ the mouse across the screen, you can adjust your mouse settings so that you\
    \ can use Linux with ease.\n\n+   - **Choosing a Mouse**\n  If you want to use\
    \ a different type of mouse with Linux, open a terminal window and type Lisa.\
    \ Select **System Configuration** and **Hardware Configuration**. Then select\
    \ **Configure Mouse**. Most PCs use a PS/2 mouse.\n- **Changing Your Cursor**\n\
    \  You can change the cursor appearance by opening a terminal window and typing\
    \ `xsetroot -cursor_name sailboat`.\n\n![](img/28e2bccabaf327178ce9997934f991d9_127_0.png)\n\
    \n![](img/28e2bccabaf327178ce9997934f991d9_127_1.png)\n\n![](img/28e2bccabaf327178ce9997934f991d9_127_2.png)\n\
    \n![](img/28e2bccabaf327178ce9997934f991d9_127_3.png)\n\n+   1. Select **KDE Control\
    \ Center** from the **K** menu.\n2. Toggle the **Input Devices** icon and select\
    \ **Mouse**.\n3. Click on a radio button to adjust **Button mapping**. Adjust\
    \ the slider bars to change the **Acceleration** and **Threshold** settings for\
    \ your mouse.\n4. Toggle the **Windows** icon and select **Mouse**. Change the\
    \ mouse behaviors for the associated window settings."
  merge: -1
  pgno: 127
