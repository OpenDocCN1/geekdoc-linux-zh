- img_proc: true
  md: '# Task 10: Using Shortcut Menus


    Shortcut menus, also referred to as contextual, pop-up, or quick menus, contain
    sets of commands associated with the desktop or window element on which you right-click.
    For example, right-click on a window title bar to close, minimize, maximize, or
    restore the state of any window.


    ![](img/28e2bccabaf327178ce9997934f991d9_27_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_27_1.png)


    +   1. Right-click an item to view its shortcut menu. In this case, I''ve right-clicked
    on the desktop.

    2. Choose the command you want to use.


    **Different Commands**

    The menu commands available in a shortcut menu vary depending on which onscreen
    element you right-click.'
  merge: -1
