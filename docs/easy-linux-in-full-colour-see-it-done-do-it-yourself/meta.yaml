    \ 通过拖动滑块旋钮调整音频音量。\n\n## 更多 CD 播放器\n\nLinux 上还有其他音频 CD 播放器。请访问 ftp://sunsite.unc.edu/pub/Linux/apps/sound/cdrom\
    \ 获取更多适用于你电脑的 CD 播放器应用程序链接。\n\n## 任务 8：播放 MIDI 或卡拉 OK 文件\n\n除了收听音频 CD，你还可以从互联网下载乐器数字接口（MIDI）和卡拉\
    \ OK 文件。Caldera Linux 使你能够使用 Midi/Karaoke Player 播放这些文件。\n\n**KMidi 播放器**\n\n\
