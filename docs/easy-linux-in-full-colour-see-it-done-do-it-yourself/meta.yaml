  md: "# Task 5: Changing Your Desktop Picture\n\nYou can personalize your KDE desktop\
    \ by adding wallpaper, also referred to as a desktop picture. Many colorful wallpaper\
    \ images are installed with Caldera Linux 2.2, including ruins, fudge_chunks,\
    \ berries, and water.\n\n![](img/28e2bccabaf327178ce9997934f991d9_125_0.png)\n\
    \n![](img/28e2bccabaf327178ce9997934f991d9_125_1.png)\n\n![](img/28e2bccabaf327178ce9997934f991d9_125_2.png)\n\
    \n+   - **Virtual Desktops**\n  You can choose a unique or common wallpaper pattern\
    \ for each virtual desktop. Check the **Common Background** check box to share\
    \ the same wallpaper on all virtual desktops.\n\n- **Regular Background**\n  To\
    \ revert to a solid-color background, follow these steps but select **No wallpaper**\
    \ from the Wallpaper drop-down list.\n\n+   1. Click the **K** button and select\
    \ **Settings**. Then choose **Desktop** and select **Background**.\n2. Select\
    \ a desktop from the list.\n3. Click on the **Wallpaper** drop-down list, and\
    \ then choose a wallpaper pattern."
  merge: -1
  pgno: 125
