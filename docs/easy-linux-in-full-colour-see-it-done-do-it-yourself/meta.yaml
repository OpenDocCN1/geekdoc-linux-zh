- md: " ## Task 3: Working with Fonts\n\nFonts work similarly in Linux and KDE to\
    \ how they work in Windows and Mac OS. Like Windows and Mac OS, Linux supports\
    \ both onscreen and printer-specific fonts. You can customize font settings in\
    \ several different areas of Linux, KDE, Terminal windows, and the X11 server.\n\
    \n- **All Desktops Change**\n  When you make a change to the Display Settings\
    \ window, all virtual desktops are affected by any saved changes.\n- **Cancel\
    \ Button**\n  If you make changes to the KDE Display Settings window, but decide\
    \ you do not want to save any of your changes, click the Cancel button.\n\n1.\
    \ Open a terminal window by pressing Ctrl+T or by clicking the Home Directory\
    \ button in the KPanel bar. Click **File** and choose **Open Terminal**.\n2. Click\
    \ **Options** and choose **Font**, and then choose a font size. The default is\
    \ Medium.\n3. Click the **K** button and select **Settings**. Then click **Desktop**\
    \ and choose **Fonts**.\n4. Select a typeface from the drop-down menu for the\
    \ font group selected in the window list.\n5. Click **Apply** to view the font\
    \ changes in KDE.\n6. Click the Close box to exit the Font dialog window.\n\n\
    ## What's BASH?\n\nBASH is a pseudo-acronym for Bourne-Again Shell, one of several\
    \ terminal window applications you can use with Linux. The terminal window application\
    \ can be found at file:///bin/bash. BASH is the kind of Terminal window used in\
    \ this task.\n\n## Task 4: Working with Colors\n\nKDE enables you to change the\
    \ sets of colors used for certain onscreen elements such as the title bar and\
    \ background. These sets of colors are called schemes, and you can select colors\
    \ that work best for you and your monitor. Lighter colors might, for example,\
    \ make working on some applications easier on your eyes. On the other hand, you\
    \ might prefer bright, lively colors to match your clothes or your work mood.\n\
    \n**WARNING**\nYour changes will not be saved if you close a window instead of\
    \ clicking **OK** or **Apply**.\n\n**Cancel Button**\nIf you make changes to the\
    \ KDE Display Settings window, but decide you do not want to save your changes,\
    \ click the **Cancel** button.\n\n1. Click the **K** button and select **Settings**.\
    \ Then choose **Desktop** and select **Colors**.\n2. Click on a background from\
    \ the drop-down menu in the **Widget color** section of the Display Settings window.\
    \ The widget color changes as you click on a drop-down menu item.\n3. Click on\
    \ the color bar for the selected widget.\n4. Click on the color palette on the\
    \ right side of the Select Color window to select a color.\n5. Click **OK** to\
    \ save any changes.\n6. Click **Apply** to view the color change to the desktop.\n\
    \n## Task 5: Changing Your Desktop Picture\n\nYou can personalize your KDE desktop\
    \ by adding wallpaper, also referred to as a desktop picture. Many colorful wallpaper\
    \ images are installed with Caldera Linux 2.2, including ruins, fudge_chunks,\
    \ berries, and water.\n\n- **Virtual Desktops**\n  You can choose a unique or\
    \ common wallpaper pattern for each virtual desktop. Check the **Common Background**\
    \ check box to share the same wallpaper on all virtual desktops.\n- **Regular\
    \ Background**\n  To revert to a solid-color background, follow these steps but\
    \ select **No wallpaper** from the Wallpaper drop-down list.\n\n1. Click the **K**\
    \ button and select **Settings**. Then choose **Desktop** and select **Background**.\n\
    2. Select a desktop from the list.\n3. Click on the **Wallpaper** drop-down list,\
    \ and then choose a wallpaper pattern.\n\n### Adding Wallpaper\n\nThe desktop\
    \ pattern appears in the image of the monitor in the Display Settings window.\n\
    \nClick **Apply** to view the wallpaper on your desktop.\n\nClick **OK** to save\
    \ the wallpaper settings and exit the Display Settings window. The selected wallpaper\
    \ pattern appears on the virtual desktop.\n\nYou can create your own wallpaper\
    \ patterns by downloading images from the Internet or creating images with a Paint\
    \ program. Save wallpaper image files to **file:/opt/kde/share/wallpapers**.\n\
    \n## Task 6: Changing Your Mouse Settings\n\nYou can adjust the mouse buttons\
    \ and double-click speed to make using the mouse more comfortable. Suppose, for\
    \ example, you are left-handed. Switching the right and left mouse buttons might\
    \ make your work a little easier. Similarly, if you are having trouble moving\
    \ the mouse across the screen, you can adjust your mouse settings so that you\
    \ can use Linux with ease.\n\n- **Choosing a Mouse**\n  If you want to use a different\
    \ type of mouse with Linux, open a terminal window and type Lisa. Select **System\
    \ Configuration** and **Hardware Configuration**. Then select **Configure Mouse**.\
    \ Most PCs use a PS/2 mouse.\n- **Changing Your Cursor**\n  You can change the\
    \ cursor appearance by opening a terminal window and typing `xsetroot -cursor_name\
    \ sailboat`.\n\n1. Select **KDE Control Center** from the **K** menu.\n2. Toggle\
    \ the **Input Devices** icon and select **Mouse**.\n3. Click on a radio button\
    \ to adjust **Button mapping**. Adjust the slider bars to change the **Acceleration**\
    \ and **Threshold** settings for your mouse.\n4. Toggle the **Windows** icon and\
    \ select **Mouse**. Change the mouse behaviors for the associated window settings.\n\
    \n## Task 7: Changing Your Display Properties\n\nYou can review all display settings\
    \ in one window if you select the Display Properties menu command. Background,\
    \ Screensaver, Color, Font, and Style controls are all located in this dialog\
    \ window. This task covers the Screensaver and Style tabs of the Display Settings\
    \ window.\n\n- **Tab Shortcut**\n  You can select a tab item by pressing Ctrl+\
    \ the underlined letter of a tab item. For example, Ctrl+C selects the Color tab\
    \ in the Display Settings window.\n- **No Screensaver**\n  Select No screensaver\
    \ in the Screen Saver window list to turn off this feature in KDE.\n\n## Task\
    \ 8: Changing How Your Windows Look\n\nAlthough the default settings for your\
    \ windows work just great, you might have some preferences regarding the location\
    \ of minimize and close buttons, or you might want to change the title bar behavior\
    \ or size. This task covers how to manage your desktop windows.\n\n- **Command-Line\
    \ Windows**\n  Right-click in a command-line window to adjust window settings\
    \ such as scrolling font and font size.\n- **Window Backgrounds**\n  Right-click\
    \ in a KDE window and choose Properties to open the kfm window. Click the Dir\
    \ tab and select a wallpaper image for one or all of your KDE windows.\n\n1. Click\
    \ on the **K** button and choose **KDE Control Center**.\n2. Click the uncollapse\
    \ button for **Windows**. Then click **Buttons** to change any window button settings.\n\
    3. Click **Titlebar** and change the title bar appearance, mouse action, or title\
    \ animation."
  mdcn: "\n ## 任务 3：使用字体\n\n字体在 Linux 和 KDE 中的工作方式与在 Windows 和 Mac OS 中类似。与 Windows\
    \ 和 Mac OS 一样，Linux 支持屏幕字体和打印机专用字体。您可以在 Linux、KDE、终端窗口和 X11 服务器的多个不同区域自定义字体设置。\n\
    \n- **所有桌面变化**\n  当您对\"显示设置\"窗口进行更改时，所有虚拟桌面都会受到任何已保存更改的影响。\n- **取消按钮**\n  如果您对\
    \ KDE 显示设置窗口进行了更改，但决定不想保存任何更改，请单击\"取消\"按钮。\n\n1. 按 Ctrl+T 或单击 KPanel 栏中的\"主目录\"\
    按钮打开终端窗口。单击**文件**并选择**打开终端**。\n2. 单击**选项**并选择**字体**，然后选择字体大小。默认为\"中\"。\n3. 单击\
    \ **K** 按钮并选择**设置**。然后单击**桌面**并选择**字体**。\n4. 在窗口列表中为选定的字体组从下拉菜单中选择一种字体。\n5. 单击**应用**以在\
    \ KDE 中查看字体更改。\n6. 单击关闭框退出\"字体\"对话框窗口。\n\n## 什么是 BASH？\n\nBASH 是 Bourne-Again\
    \ Shell 的伪首字母缩略词，它是您可以与 Linux 配合使用的几种终端窗口应用程序之一。终端窗口应用程序位于 file:///bin/bash。BASH\
    \ 是此任务中使用的终端窗口类型。\n\n## 任务 4：使用颜色\n\nKDE 使您能够更改用于某些屏幕元素（如标题栏和背景）的颜色集。这些颜色集称为方案，您可以选择最适合您和您的显示器的颜色。例如，ighter\
    \ 颜色可能会使某些应用程序的工作对您的眼睛更轻松。另一方面，您可能更喜欢鲜艳、活泼的颜色来搭配您的衣服或工作心情。\n\n**警告**\n如果您关闭窗口而不是单击\
    \ **OK** 或 **应用**，您的更改将不会被保存。\n\n**取消按钮**\n如果您对 KDE 显示设置窗口进行了更改，但决定不想保存您的更改，请单击\
    \ **取消** 按钮。\n\n1. 单击 **K** 按钮并选择 **设置**。然后选择 **桌面** 并选择 **颜色**。\n2. 在\"显示设置\"\
    窗口的 **组件颜色** 部分中，从下拉菜单中单击一个背景。组件颜色会随着您单击下拉菜单项而更改。\n3. 单击所选组件的颜色条。\n4. 在\"选择颜色\"\
    窗口右侧的颜色调色板上单击以选择一种颜色。\n5. 单击 **确定** 保存任何更改。\n6. 单击 **应用** 以查看对桌面的颜色更改。\n\n## 任务\
    \ 5：更改您的桌面图片\n\n您可以通过添加墙纸（也称为桌面图片）来个性化您的 KDE 桌面。许多彩色墙纸图像随 Caldera Linux 2.2 一起安装，包括\
    \ ruins、fudge_chunks、berries 和 water。\n\n- **虚拟桌面**\n  您可以为每个虚拟桌面选择独特或通用的墙纸图案。选中\
    \ **通用背景** 复选框以在所有虚拟桌面上共享相同的墙纸。\n- **常规背景**\n  要恢复为纯色背景，请按照以下步骤操作，但从\"墙纸\"下拉列表中选择\
    \ **无墙纸**。\n\n1. 单击 **K** 按钮并选择 **设置**。然后选择 **桌面** 并选择 **背景**。\n2. 从列表中选择一个桌面。\n\
    3. 单击 **墙纸** 下拉列表，然后选择一个墙纸图案。\n\n### 添加墙纸\n\n桌面图案会显示在\"显示设置\"窗口中的显示器图像中。\n\n单击\
    \ **应用** 以在您的桌面上查看墙纸。\n\n单击 **确定** 保存墙纸设置并退出\"显示设置\"窗口。所选墙纸图案会显示在虚拟桌面上。\n\n您可以通过从互联网下载图像或使用绘图程序创建图像来创建自己的墙纸图案。将墙纸图像文件保存到\
    \ **file:/opt/kde/share/wallpapers**。\n\n## 任务 6：更改您的鼠标设置\n\n您可以调整鼠标按钮和双击速度，以使鼠标使用更加舒适。例如，假设您是左撇子。交换右键和左键可能会让您的工作更轻松一些。同样，如果您在屏幕上移动鼠标时遇到困难，您可以调整鼠标设置，以便轻松使用\
    \ Linux。\n\n- **选择鼠标**\n  如果您想在 Linux 中使用不同的鼠标，请打开终端窗口并输入 Lisa。选择 **系统配置** 和 **硬件配置**。然后选择\
    \ **配置鼠标**。大多数 PC 使用 PS/2 鼠标。\n- **更改您的光标**\n  您可以通过打开终端窗口并输入 `xsetroot -cursor_name\
    \ sailboat` 来更改光标外观。\n\n1. 从 **K** 菜单中选择 **KDE 控制中心**。\n2. 切换 **输入设备** 图标并选择 **鼠标**。\n\
    3. 单击单选按钮以调整 **按钮映射**。调整滑块以更改鼠标的 **加速** 和 **阈值** 设置。\n4. 切换 **窗口** 图标并选择 **鼠标**。更改关联窗口设置的鼠标行为。\n\
    \n## 任务 7：更改您的显示属性\n\n如果您选择\"显示属性\"菜单命令，您可以在一个窗口中查看所有显示设置。背景、屏幕保护程序、颜色、字体和样式控件都位于此对话框窗口中。本文介绍\"\
    显示设置\"窗口的\"屏幕保护程序\"和\"样式\"选项卡。\n\n- **选项卡快捷方式**\n  您可以通过按 Ctrl+ 选项卡项目的下划线字母来选择选项卡项目。例如，Ctrl+C\
    \ 在\"显示设置\"窗口中选择\"颜色\"选项卡。\n- **无屏幕保护程序**\n  在\"屏幕保护程序\"窗口列表中选择\"无屏幕保护程序\"以关闭\
    \ KDE 中的此功能。\n\n## 任务 8：更改窗口外观\n\n尽管窗口的默认设置工作得很好，但您可能对最小化按钮和关闭按钮的位置有一些偏好，或者您可能想更改标题栏行为或大小。本文介绍如何管理您的桌面窗口。\n\
    \n- **命令行窗口**\n  在命令行窗口中右键单击以调整窗口设置，例如滚动字体和字体大小。\n- **窗口背景**\n  在 KDE 窗口中右键单击并选择\"\
    属性\"以打开 kfm 窗口。单击 Dir 选项卡并为一个或所有 KDE 窗口选择墙纸图像。\n\n1. 单击 **K** 按钮并选择 **KDE 控制中心**。\n\
    2. 单击 **窗口** 的展开按钮。然后单击 **按钮** 以更改任何窗口按钮设置。\n3. 单击 **标题栏** 并更改标题栏外观、鼠标操作或标题动画。\n"
