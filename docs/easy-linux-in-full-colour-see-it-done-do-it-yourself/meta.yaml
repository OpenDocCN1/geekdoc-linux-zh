- md: ' ## Task 8: Cleaning Up Unnecessary Files


    After a while, you might notice the amount of free disk space shrinking as you
    run applications, create documents, and save Web pages to your local hard disk.
    Resident browser applications or the Trash folder store files that you want to
    delete but that have not been removed from the hard disk. You can easily remove
    these files and increase the amount of available disk space.


    - 1. Click the **K** button, select **Utilities**, and choose **Terminal**.

    2. Type **df -k** in the Terminal window. A list of volumes appears. The amount
    of used disk space appears at the end of each volume.

    3. Type **rm -rf** and a pathname to permanently delete any folders and files
    you do not need.

    4. Type **ls**. Notice the folder and files have been deleted.


    > **Root Access**

    > Log in as root to clean up all files on your hard disk. If you do not have administrative
    access to your PC, notify your system administrator if there is file clutter or
    limited disk space remaining on the hard disk.


    ## Task 9: Maintaining Network and User Accounts


    Each person using Linux should have a separate account and not share his or her
    passwords. If a person is no longer using Linux, the account should be deleted.


    ### Folder and File Access


    Creating separate login accounts can make file and folder access more efficient.
    For example, you can create backup copies on the Linux partition but not allow
    any user access to these files to preserve their integrity. Conversely, you can
    give guest access to files you want everyone to view or modify.


    - 1. Click the COAS button in the KPanel bar, select **System**, and then choose
    **Accounts**.

    2. Click **OK** in the welcome dialog box.

    3. Click **View** and choose **All users**.

    4. Click a user account. Click **Actions** and choose **Edit user** to view those
    account settings.


    - 5. Click on any user settings to make a change. Click **OK** to save changes
    and exit the window.

    6. Click on the password field to edit the account password.

    7. Select any other text field to change the settings you want the user account
    to have.


    ### Creating or Editing User Accounts


    Log in as root to create or edit user accounts. You might not be able to use this
    task if you do not have administrative access to Linux.


    ## Maintaining Network and User Accounts Continued


    ### Managing Access


    After you create accounts, different users might have problems accessing files
    or folders created by different accounts. For more information about how to manage
    user accounts and file or folder access, see Part 7, Task 4, "Managing Users."


    ### Deleting Accounts


    To permanently remove a login account, click **Actions** and choose **Delete user**.
    Be sure to back up any files from that account before you delete it.


    - 8. Click **Actions**, and choose **Create user** to create a new account on
    your PC.

    9. Type a login name. Click on a text edit field to change any settings you want
    the user account to have.

    10. Click **File** and choose **Exit** to save your changes and terminate the
    application.


    ## Task 10: Checking Your Hard Disk


    Files and folders are stored on your hard disk with Linux''s ext2 file system.
    If you use your disk to copy lots of files onto your disk, or if you move or delete
    files frequently, you should run fsck every one or two weeks to fix any errors
    that might occur in your file system.


    - 1. Click the **K** button, select **Utilities**, and choose **Terminal**.


    - 2. Type **fsck /dev/hda3** (if you have three partitions) to check your hard
    disk. Type **df -k** to find Linux drive names. Type **fsck /dev/<drivename>**
    to check those disks.


    - 3. Type **Y** to proceed with the check. Type **Y** to fix any problems found
    or **N** to cancel the check.


    - 4. Insert a floppy into your floppy disk drive. Then type **fsck /dev/fd0**.


    **Booting from a Floppy**


    For best results, boot your PC from a floppy, and then run fsck on the hard disk.


    **fsck Man Pages**


    For a complete list of features for fsck, type **man fsck** in the terminal window
    prompt.


    - **#** Octothorpe, or pound sign. Used as a comment character in OpenLinux configuration
    files.

    - **$HOME** Environment variable that points to the login directory.

    - **$PATH** The shell environment variable that contains a directory or set of
    directories that can be searched using Linux commands.

    - **/** Slash used in conjunction with folder names to define a directory path
    such as /root/desktop/. Identifies the root directory.

    - **.c** C source file.

    - **.cc** C++ source file.

    - **.gif** GIF graphics file.

    - **.gz** File compressed using the GNU gzip application.

    - **.h** C or C++ header file.

    - **.html** HTML document.

    - **.jpg** JPEG graphics file.

    - **.o** Compiled object file.

    - **.pdf** Adobe Acrobat file.

    - **.ps** PostScript file.

    - **.tar** Tar (tape archive) file.

    - **.txt** Text file.


    - **accessory** One of the applications that comes free with Caldera Linux 2.2.
    Examples are KJot, Paint, Audio CD, and KNotes.

    - **active window** The window you''re currently using. You can tell a window
    is active by looking at its title bar: If the bar shows dark letters on a gray
    background, the window is active. Inactive windows show gray letters on a light
    gray background.

    - **application** Software that accomplishes a specific set of tasks or functions.
    This term is used interchangeably with the terms *program* or *executable*.

    - **application window** A window that contains a running application, such as
    Netscape Communicator or Text Editor.

    - **ASCII text file** A file that uses only the American Standard Code for Information
    Interchange character set (techno-lingo for the characters you see on your keyboard).

    - **back up** The process of making a copy of your files. The backup copy can
    be restored to replace the original.

    - **background processes** Processes that run without a user interface or as a
    lower priority task to the operating system.


    - **BASH** GNU Bourne Again Shell. A terminal window application based on the
    Bourne shell (sh), a command interpreter.

    - **bookmark** A term used by a Web browser to represent a frequently visited
    Web site or a site stored in your Bookmarks folder.

    - **boot** To start your computer. The term *booting* comes from the phrase "pulling
    oneself up by one''s bootstraps," which refers to the fact that your computer
    can load everything it needs to operate properly without any help from you.

    - **bps** Bits per second. The rate at which a modem or other communications device
    spits data through a phone line or cable.

    - **browser** An application you use to surf sites on the World Wide Web. The
    browser installed with Caldera Linux 2.2 is Netscape Communicator.

    - **BSD** Berkeley Software Distribution.

    - **BSD UNIX** Berkeley Software Distribution version of UNIX written at the University
    of California, Berkeley.

    - **byte** A single character of information.


    **C** A high-level language commonly used to create applications for all computer
    platforms.


    **C++** A superset of the C programming language.


    **CD-ROM drive** A special computer disk drive that''s designed to handle CD-ROM
    discs, which resemble audio CDs. CD-ROMs have enormous capacity (about 500 times
    that of a typical floppy disk), so they''re usually used to hold large applications,
    graphics libraries, huge collections of shareware, or your local backup if you
    have a CD recorder.


    **CGI** Common Gateway Interface. Used by Web pages to transmit data between scripts
    or Web applications and then return data to the Web page or browser. You can use
    the Perl language to create CGI scripts.


    **character formatting** Changing the look of text characters by altering their
    font, size, style, color, and more.


    **chat room** A feature popularized by the Internet and Web browsers. You can
    go to a public or private chat room on the Internet using a chat application or
    Web browser. You can chat with one or several people at the same time via text-based
    conversations.


    **check box** A square-shaped switch that toggles a dialog box option on or off.
    The option is toggled on when a check mark appears in the box.


    **click** To quickly press and release the mouse button.


    **Clipboard** An area of memory that holds data temporarily during cut-and-paste
    operations.


    **collapse** To hide all window content except for the window title bar. Double-click
    a window''s title bar to collapse its contents.


    **command line** A method to execute an application and one or several tasks by
    typing the application name followed by a set of parameters predefined by the
    application.


    **commands** The options you see in a pull-down menu. You use the commands to
    tell the application what you want it to do next.


    **configuration file** A type of file use to initialize or set up a particular
    environment, such as one or several daemons or a shell environment.


    **control keys** Generally used in conjunction with one or more keys to provide
    a shortcut to a menu command identified in a KDE menu.


    **CPU** Central Processing Unit. The main processing engine for a computer.


    **daemon** A background process related to the operating system.


    **data files** The files you use on your programs. See also *program files*.


    **desktop** A metaphor for the KDE screen. You can have one or up to eight desktops
    with OpenLinux. Select a desktop by clicking on one, two, three, or four in the
    KPanel bar. The desktop is the main window of the KDE user interface. You cannot
    close the desktop window, but you can copy files onto your desktop.


    **device driver** A small program that controls the way a device (such as a mouse)
    works with OpenLinux.


    **dialog box** A window that pops up onscreen to ask you for information or to
    seek confirmation of an action you requested.


    **directory** An element of an operating system''s file system. A directory is
    the file structure created on a hard disk so that you can work with folders and
    files. The root directory is the top level of the directory tree. Every other
    directory, also referred to as a subdirectory, is contained within the root directory.'
  mdcn: "\n ## 任务 8：清理不必要的文件\n\n一段时间后，您可能会注意到可用磁盘空间不断减少，这是由于您运行应用程序、创建文档以及将网页保存到本地硬盘所致。常驻浏览器应用程序或废纸篓文件夹中存储了您想要删除但尚未从硬盘移除的文件。您可以轻松删除这些文件以增加可用磁盘空间。\n\
    \n- 1. 点击 **K** 按钮，选择 **实用工具**，然后选择 **终端**。\n2. 在终端窗口中输入 **df -k**。将显示卷列表。每个卷末尾显示已用磁盘空间的数量。\n\
    3. 输入 **rm -rf** 和路径名，以永久删除您不需要的任何文件夹和文件。\n4. 输入 **ls**。注意文件夹和文件已被删除。\n\n> **Root\
    \ 权限**\n> 以 root 身份登录以清理硬盘上的所有文件。如果您没有 PC 的管理权限，请通知系统管理员硬盘上是否存在文件杂乱或磁盘空间不足的情况。\n\
    \n## 任务 9：维护网络和用户账户\n\n每个使用 Linux 的人都应该拥有独立的账户，并且不要共享他或她的密码。如果某人不再使用 Linux，则应删除该账户。\n\
    \n### 文件夹和文件访问\n\n创建独立的登录账户可以使文件和文件夹访问更加高效。例如，您可以在 Linux 分区上创建备份副本，但不允许任何用户访问这些文件以保持其完整性。相反，您可以授予访客访问权限，让所有人都能查看或修改您希望共享的文件。\n\
    \n- 1. 点击 KPanel 栏中的 COAS 按钮，选择 **系统**，然后选择 **账户**。\n2. 在欢迎对话框中点击 **确定**。\n3.\
    \ 点击 **查看** 并选择 **所有用户**。\n4. 点击一个用户账户。点击 **操作** 并选择 **编辑用户** 以查看这些账户设置。\n\n-\
    \ 5. 点击任何用户设置进行更改。点击 **确定** 保存更改并退出窗口。\n6. 点击密码字段以编辑账户密码。\n7. 选择任何其他文本字段以更改您希望用户账户拥有的设置。\n\
    \n### 创建或编辑用户账户\n\n以 root 身份登录以创建或编辑用户账户。如果您没有 Linux 的管理权限，则可能无法使用此任务。\n\n## 维护网络和用户账户（续）\n\
    \n### 管理访问权限\n\n创建账户后，不同用户可能会遇到访问由不同账户创建的文件或Goog问题。有关如何管理用户账户以及文件或文件夹访问权限的更多信息，请参阅第\
    \ 7 部分，任务 4，\"管理用户\"。\n\n### 删除账户\n\n要永久删除登录账户，请点击 **操作** 并选择 **删除用户**。在删除之前，请务必备份该账户中的任何文件。\n\
    \n- 8. 点击 **操作**，然后选择 **创建用户** 以在您的 PC 上创建新账户。\n9. 输入登录名。点击文本编辑字段以更改您希望用户账户拥有的任何设置。\n\
    10. 点击 **文件** 并选择 **退出** 以保存更改并终止应用程序。\n\n## 任务 10：检查您的硬盘\n\n文件和文件夹使用 Linux 的\
    \ ext2 文件系统存储在硬盘上。如果您使用磁盘将大量文件复制到磁盘上，或者频繁移动或删除文件，则应每隔一到两周运行一次 fsck，以修复文件系统中可能出现的任何错误。\n\
    \n- 1. 点击 **K** 按钮，选择 **实用工具**，然后选择 **终端**。\n\n- 2. 输入 **fsck /dev/hda3**（如果您有三个分区）以检查硬盘。输入\
    \ **df -k** 以查找 Linux 驱动器名称。输入 **fsck /dev/<驱动器名>** 以检查这些磁盘。\n\n- 3. 输入 **Y**\
    \ 以继续检查。输入 **Y** 以修复发现的任何问题，或输入 **N** 以取消检查。\n\n- 4. 将软盘插入软盘驱动器。然后输入 **fsck /dev/fd0**。\n\
    \n**从软盘启动**\n\n为获得最佳效果，请从软盘启动 PC，然后在硬盘上运行 fsck。\n\n**fsck 手册页**\n\n有关 fsck 功能的完整列表，请在终端窗口提示符中输入\
    \ **man fsck**。\n\n- **#** 井字号，或磅符号。在 OpenLinux 配置文件中用作注释字符。\n- **$HOME** 指向登录目录的环境变量。\n\
    - **$PATH** shell 环境变量，包含可使用 Linux 命令搜索的一个目录或一组目录。\n- **/** 斜杠，与文件夹名称结合使用以定义目录路径，如\
    \ /root/desktop/。标识根目录。\n- **.c** C 源文件。\n- **.cc** C++ 源文件。\n- **.gif** GIF 图形文件。\n\
    - **.gz** 使用 GNU gzip 应用程序压缩的文件。\n- **.h** C 或 C++ 头文件。\n- **.html** HTML 文档。\n\
    - **.jpg** JPEG 图形文件。\n- **.o** 编译后的目标文件。\n- **.pdf** Adobe Acrobat 文件。\n- **.ps**\
    \ PostScript 文件。\n- **.tar** Tar（磁带归档）文件。\n- **.txt** 文本文件。\n\n- **accessory（附件）**\
    \ 随 Caldera Linux 2.2 免费提供的应用程序之一。例如 KJot、Paint、Audio CD 和 KNotes。\n- **active\
    \ window（活动窗口）** 您当前正在使用的窗口。您可以通过查看其标题栏来判断窗口是否处于活动状态：如果标题栏显示深灰色背景上的深色文字，则该窗口处于活动状态。非活动窗口显示浅灰色背景上的灰色文字。\n\
    - **application（应用程序）** 完成特定任务集或功能的软件。该术语与 *program（程序）* 或 *executable（可执行文件）*\
    \ 互换使用。\n- **application window（应用程序窗口）** 包含正在运行的应用程序的窗口，例如 Netscape Communicator\
    \ 或文本编辑器。\n- **ASCII text file（ASCII 文本文件）** 仅使用美国信息交换标准代码字符集的文件（技术术语，即您在键盘上看到的字符）。\n\
    - **back up（备份）** 制作文件副本的过程。可以恢复备份副本以替换原始文件。\n- **background processes（后台进程）**\
    \ 在没有用户界面的情况下运行，或作为操作系统优先级较低的任务运行的进程。\n\n- **BASH** GNU Bourne Again Shell。基于\
    \ Bourne shell (sh) 的终端窗口应用程序，一种命令解释器。\n- **bookmark（书签）** 网络浏览器使用的术语，表示经常访问的网站或存储在您的书签文件夹中的网站。\n\
    - **boot（启动）** 启动您的计算机。术语 *booting* 来自短语\"pulling oneself up by one's bootstraps\"\
    （自力更生），指的是您的计算机可以在没有任何帮助的情况下加载它需要正常运行的所有内容。\n- **bps** 每秒位数。调制解调器或其他通信设备通过电话线或电缆传输数据的速率。\n\
    - **browser（浏览器）** 用于浏览万维网站上网站的应用程序。Caldera Linux 2.2 安装的浏览器是 Netscape Communicator。\n\
    - **BSD** Berkeley Software Distribution（伯克利软件套件）。\n- **BSD UNIX** 加州大学伯克利分校编写的\
    \ Berkeley Software Distribution 版 UNIX。\n- **byte（字节）** 单个字符的信息。\n\n**C** 一种高级语言，通常用于为所有计算机平台创建应用程序。\n\
    \n**C++** C 编程语言的一个超集。\n\n**CD-ROM drive（CD-ROM 驱动器）** 一种特殊的计算机磁盘驱动器，设计用于处理 CD-ROM\
    \ 光盘，其外观类似于音频 CD。CD-ROM 具有巨大的容量（约为典型软盘的 500 倍），因此通常用于存储大型应用程序、图形库、大量共享软件集合，或者如果您有\
    \ CD 刻录机，则用于本地备份。\n\n**CGI** Common Gateway Interface（通用网关接口）。网页使用它来在脚本或 Web 应用程序之间传输数据，然后将数据返回到网页或浏览器。您可以使用\
    \ Perl 语言创建 CGI 脚本。\n\n**character formatting（字符格式化）** 通过更改文本字符的字体、大小、样式、颜色等来改变其外观。\n\
    \n**chat room（聊天室）** 由互联网和 Web 浏览器推广的功能。您可以使用聊天应用程序或 Web 浏览器进入互联网上的公共或私人聊天室。您可以通过基于文本的会话一次与一个或多人聊天。\n\
    \n**check box（复选框）** 一种方形开关，用于打开或关闭对话框选项。当框中出现勾选标记时，选项处于打开状态。\n\n**click（点击）**\
    \ 快速按下并释放鼠标按钮。\n\n**Clipboard（剪贴板）** 内存中的一个区域，在剪切和粘贴操作期间临时保存数据。\n\n**collapse（折叠）**\
    \ 隐藏窗口的所有内容，只留下窗口标题栏。双击窗口的标题栏以折叠其内容。\n\n**command line（命令行）** 执行应用程序和一项或多项任务的方法，通过输入应用程序名称，后跟应用程序预定义的一组参数。\n\
    \n**commands（命令）** 您在拉式菜单中看到的选项。您使用命令告诉应用程序您希望它下一步做什么。\n\n**configuration file（配置文件）**\
    \ 用于初始化或设置特定环境的一种文件，例如一个或多个守护进程或 shell 环境。\n\n**control keys（控制键）** 通常与一个或多个键结合使用，以提供对\
    \ KDE 菜单中标识的菜单命令的快捷方式。\n\n**CPU** Central Processing Unit（中央处理器）。计算机的主要处理引擎。\n\
    \n**daemon（守护进程）** 与操作系统相关的后台进程。\n\n**data files（数据文件）** 您在程序中使用的文件。另请参阅 *program\
    \ files（程序文件）*。\n\n**desktop（桌面）** KDE 屏幕的隐喻。使用 OpenLinux，您可以拥有 1 个或最多 8 个桌面。通过点击\
    \ KPanel 栏中的一个、两个、三个或四个来选择桌面。桌面是 KDE 用户界面的主窗口。您无法关闭桌面窗口，但可以将文件复制到桌面上。\n\n**device\
    \ driver（设备驱动程序）** 一个控制设备（如鼠标）与 OpenLinux 配合工作方式的小程序。\n\n**dialog box（对话框）** 屏幕上弹出的窗口，用于向您询问信息或确认您请求的操作。\n\
    \n**directory（目录）** 操作系统文件系统的一个元素。目录是硬盘上创建的文件结构，以便您可以使用文件夹和文件。根目录是目录树的顶层。所有其他目录，也称为子目录，都包含在根目录内。\n"
