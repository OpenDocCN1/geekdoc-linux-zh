    7. Press Escape. Select **Enter Router/Gateway**, and then press Enter.

    8. Type the IP address of your Ethernet gateway and press Enter. Press Escape
    until you return to the Terminal window prompt.


    # DSL, ISDN, and T1 Connections


    You can configure DSL, ISDN, and T1 connections similarly to the way you configured
