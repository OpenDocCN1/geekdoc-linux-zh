    The Cut, Copy, and Paste commands have the same keyboard commands for all computer
    platforms. Ctrl+C copies any selected data, Ctrl+X cuts the data, and Ctrl+P pastes
    any data stored in the Clipboard into a document window.


    +   1. Select the data you want to move.

    2. Click **Edit** and choose the **Cut** command.

    3. Click the toolbar program representing the program to which you want to switch.


