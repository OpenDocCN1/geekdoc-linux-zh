  md: "# Task 7: Adding Hardware\n\n Caldera's Linux 2.2 release supports standard\
    \ PC hardware such as an internal IDE hard disk or CD-ROM drive. It also supports\
    \ most PC keyboards and mice. You can use the hardware configuration feature in\
    \ the lisa application to change your keyboard, mouse, hard disk, CD-ROM, printer,\
    \ or video-related hardware settings.\n\n+   - **Root Access**\n  If you do not\
    \ have root access to Linux, you will not be able to configure or add hardware.\
    \ Log in as root to modify your hardware configuration.\n- **Software Installers**\n\
    \  Most hardware devices include software drivers that must be installed for the\
    \ hardware to be recognized by Linux. Be sure to run the software installation\
    \ application for any additional hardware you attach to your PC.\n\n![](img/28e2bccabaf327178ce9997934f991d9_201_0.png)\n\
    \n![](img/28e2bccabaf327178ce9997934f991d9_201_1.png)\n\n![](img/28e2bccabaf327178ce9997934f991d9_201_2.png)\n\
