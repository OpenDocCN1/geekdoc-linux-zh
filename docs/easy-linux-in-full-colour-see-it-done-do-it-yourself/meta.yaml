    ## Task 11: Using the BASH Shell


    When you install Linux or create user accounts, you can choose among three different
    kinds of shell applications to use as your Terminal window: the Bourne Again shell
    (BASH), the Public Domain Korn shell (PDKSH), and the TCSH shell (which is a cousin
    of CSH, or C shell, yet another shell you can use with Linux). Although these
    shells work similarly to each other, this book uses only the BASH shell for all
    examples.


    ### The BASH Prompt


    Although you can change the prompt character, the BASH shell uses a number-sign
    prompt (#) to mark the beginning of a command line. BASH has a great set of simple
    features, such as name completion using the Tab key, command-line editing, and
    a history of commands typed into the shell.


    - 1. To open a BASH shell, click the **K** button and choose **Utilities**, then
    select **Terminal**.

    2. Type **cat Fre**, and press Tab. The command-line auto-completes and shows
    **cat FreeTheory.txt**. Or, type **cat .Pr**. Auto-complete shows .Profile.

    3. Press the Backspace key to delete a character on the command line. Type to
    add a character or press Tab to auto-complete the filename. Press Enter to open
    the document.


    ### Cancel and Halt Commands


    Type Ctrl+C or Ctrl+D to exit a command. Type Ctrl+Z to halt a command in the
    BASH shell. Type fg (the command for foreground) to restore a halted command.


    ### The kill Command


    End any process running by using the kill command. Type man kill for more information
    about the kill command. Type ps -u <username> to view your current process IDs.
    Then use the kill command to kill a process.


    ### The exit Command


    You can exit the BASH shell by typing exit at the command-line prompt.


    ### More About BASH


    All the Terminal window commands used in this book are run in the BASH shell.
    Many of the tasks in this book include tips that use the command line as an alternative
    to using the KDE interface to execute a command.


    Click on the Terminal window. Then type **history** and press Enter.


    A list of previously typed commands appears in the Terminal window.


    ## Task 12: Scheduling Applications


    Crontab is a handy tool installed with Linux that enables you to schedule repetitive
    tasks such as starting an application or checking your hard disk for the amount
    of free space available. This task shows you how to create a cron task that backs
    up a specific directory using the tar application.


    ### AutoStart


    For a particular login account, you can place an application in the AutoStart
    folder. When the shortcut or application is in the AutoStart folder, it will start
    after an account logs in to Linux.


    **WARNING**


    Before adding any scripts to Crontab, be sure to run them manually to verify the
    script does what you want it to.


    - 1. Click the **K** button, select **Utilities**, and then choose **Terminal**.

    2. Go to the directory path **/etc** and type **ls**.

    3. Type **crontab -e** to open the crontab file. It opens into the vi editor.
    For more information about how to use vi, see Part 3, Task 18, "Using vi."

    4. Type a, and then type **0 0 1-5 * * tar cf /home/guest3/backp /home/guest3/CH***.
    Press Esc. Then press Shift+ZZ to save and exit the crontab file.

    5. At the prompt, type **crontab -l** to view the contents of the crontab file.
    The first two fields **0** and **0** indicate the minutes (0-59) and hour (0-23)
    to run the task. I''ve selected midnight.


    ### Reading a Crontab File


    In addition to 0 and 0, mentioned in step 5, the third field (1-5) is the day
    of the month (1-31), and the fourth field is the month (1-12). The fifth field
    is the day of the week (0-6). The asterisk indicates any month and any day of
    the week. The task itself calls the application tar to create a new archive in
    the first path and archive the second path.


    ### Scripts


    You can create a shell script or a Perl script, for example, to monitor your system
    configuration. Then create a cron task to run the Perl script on a regular basis.


    ### Step 4 Note


    This command line creates a tar archive titled backp at /home/guest3 of all files
    starting with CH.


    ## Task 13: Automating Applications with Shell Scripts


    A file that contains shell commands is called a shell script. You can use a text
    editor in KDE or you can use vi in a Terminal window. You can use a shell script
    to automatically run a command line when a file is opened by the shell application.


    **Perl**


    Another popular and completely useful scripting language installed with Linux
    is Perl 5.0. You can create new scripts or modify existing Perl scripts to automate
    your work. To run a Perl script in the BASH window, type the path to your Perl
    script, and then type **perl** followed by the name of the Perl script you want
    to run.


    **WARNING**


    In addition to looking for updates to tools, remember to make sure your scripts
    continue to work whenever you update one or more applications in Linux.


    - 1. Click the **K** button, select **Utilities**, and then choose **Terminal**.

    2. Type **vi myshellscript** to create a new text file.

    3. Type **a** to append the file. Then type **ls *.txt**.

    4. Press Escape to exit append mode. Then press Shift+ZZ to save and exit the
    vi editor.

    5. Type `sh myshellscript`. View the list of .txt files in the Terminal window.


    - **Auto-Start the BASH Shell**


    Type #!/bin/sh as the first line of any BASH shell script if you don''t want to
    type sh to start your script.


    - **WARNING**


    To run a shell script, a login account must have access to the file. Right-click
    a file and select **Properties**, and then choose the **Permissions** tab to configure
    file access for a shell script.


    - **Ctrl Commands**


    Press Ctrl+C in the Terminal window to cancel a script. Press Ctrl+Z to halt the
    script.


    ## Using Linux Accessories


    In addition to WordPerfect, quite a few accessory applications are installed with
    Caldera''s Linux. These accessories perform specific tasks, such as playing an
    audio CD, storing notes, or enabling you to view image files. Accessories covered
    in this part include calculators, notepads, paint programs, games, and media players.'
