  md: "# Task 1: Showing and Hiding the Taskbar\n\nKDE's default is to show the taskbar\
    \ on the desktop at all times. You can, however, hide the taskbar so that you\
    \ have more room on the desktop for other windows, folders, and applications.\n\
    \n+   - **KPanel Shortcut**\n  Right-click the K menu bar and choose Configure\
    \ to open the KPanel Configuration window.\n- **Using the Taskbar with Any Desktop**\n\
    \  When the taskbar is visible, you can access any item on the toolbar from any\
    \ available desktop.\n- **Taskbar Settings**\n  You can make the taskbar disappear,\
    \ or AutoHide, on the desktop. Click **Options** in the KPanel Configuration window,\
    \ and then click the **Auto Hide Taskbar** check box to enable the AutoHide behavior.\n\
    \n![](img/28e2bccabaf327178ce9997934f991d9_117_0.png)\n\n![](img/28e2bccabaf327178ce9997934f991d9_117_1.png)\n\
    \n+   1. Click the **K** button, choose **Panel**, and select **Configure**.\n\
    2. In the **Taskbar** section of the KPanel Configuration window, click the **Hidden**\
    \ radio button if you want to hide the taskbar.\n3. Click **OK** or press Enter."
  merge: -1
