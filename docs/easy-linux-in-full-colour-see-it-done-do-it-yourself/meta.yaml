  md: '# 7


    # Setting Up Applications


    Applications are the most common, prolific, and familiar types of software you
    will spend most of your time using and abusing on your computer. Of all the operating
    systems you can run, Linux provides access to applications from both a command-line
    interface such as the Konsole or Terminal window, as well as from a graphical
    user interface such as the K development environment. You can add, move, and delete
    applications from the K menu. You can also install and uninstall applications
    from your hard disk and create new login accounts, as well as manage other processes
    and services that use Linux.'
