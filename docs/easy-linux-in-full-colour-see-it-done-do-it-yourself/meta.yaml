    3. 单击代表你要切换到的程序的任务栏按钮。\n\n1. 在文档中单击你要放置数据的位置。\n\n2. 单击**编辑**菜单，然后选择**粘贴**命令。\n\
    \n3. 数据被添加到文档中。\n\n**内存限制**\n\n你可以复制和粘贴的数据量受计算机上安装的内存量以及 Linux 可用内存量的限制。此外，移动大量数据可能会影响软件性能。\n\
    \n## 任务 16：搜索文档\n\n除了搜索硬盘上的文件或文件夹外，你还可以使用 KPanel 菜单中的“查找文件”应用程序在文档中搜索文本。本任务向你展示如何在文本文档中搜索文本，这是一种节省时间的文件定位方法，尤其在你记不起要查找的文件名称时特别有用。\n\
    \n> **查找文件**\n> 有关查找文件和文件夹的更多信息，请参阅第 2 部分，任务 9，\"查找文件和文件夹\"。\n\n> **Find 命令的帮助**\n\
    > 有关 Find 的更多信息，请在终端窗口中输入 man find。按 Enter 键滚动浏览信息。你还可以按照 find /root -name \"\
    *.txt\" 的一般参数来搜索根路径中的文本文档。\n\n1. 单击 K 按钮，选择 ylab云端 查找文件。\n2. 在“名称”字段中输入星号 (*)。然后输入你要搜索的路径。\n\
    3. 单击“高级”选项卡，然后输入你要搜索的一个或两个词。\n4. 单击“开始搜索”图标。\n\n5. 查看结果窗口中找到的文件列表。双击文件路径可打开目录窗口。双击文件可打开并查看其内容。\n\
    6. 查看选中的文件。\n\n### grep 命令\n\n你可以使用 grep、egrep 或 fgrep 搜索文件内容。有关如何使用 grep 命令的更多信息，请在终端窗口中输入\
    \ man grep。\n\n### 更多 Find 命令\n\n你还可以使用 whereis、which、updatedb 和 locate 命令来搜索文件和文件内容。\n\
    \n## 任务 17：使用 Emacs\n\n大多数程序员认为 emacs（发音为 e-max）是你使用 Linux 时唯一需要的应用程序。你可以使用 emacs\
    \ 编辑器浏览网页、阅读新闻、发送电子邮件、管理日程、创建应用程序和编辑文本文档。\n\n- **Emacs 教程**\n  单击**帮助**菜单，然后单击**基础知识**，选择**教程**以了解更多关于\
    \ emacs 的信息。\n\n- **Emacs 工具栏**\n  Emacs 拥有任何应用程序可能具备的最强大的工具栏之一。你不仅可以使用其工具栏按钮进行剪切、复制和粘贴，还可以进行拼写检查、电子邮件、编译、调试和阅读新闻。\n\
    \n- **上下箭头键**\n  你不需要重新输入命令。按上箭头或下箭头键可滚动浏览先前输入终端窗口的文本。\n\n1. 打开终端窗口并输入 **emacs**。\n\
    \n2. 按 Enter 或 Return 键。在草稿窗口中，输入 **(setq default-major-mode 'textmode) (setq\
    \ text-mode-hook 'turn-on-autofill)**。单击**文件**，**另存为**。\n\n3. 将文件命名为 **~/.emacs**。单击**确定**。\n\
    \n4. 单击**文件**菜单，选择**退出 XEmacs**。\n\n5. 在终端窗口中，输入 **emacs mynewdoc.txt &**。xemacs\
    \ 中会打开一个新文档窗口。\n\n6. 在新文档窗口中输入一些文本。\n\n7. 要格式化文本，请单击**选项**菜单，为文档窗口选择字体、字体样式或字体大小。\n\
    \n> **分割窗口**\n> 如果你想在查看文本文档的同时查看日历，请在 emacs 文档窗口中右键单击，选择**分割窗口**。然后单击**应用程序**，选择**日历**，再选择**3\
    \ 个月日历**。\n\n## -excuse18：使用 vi\n\nvi，发音为 vee-eye，是 Linux 自带的文本编辑应用程序之一。你可以从终端窗口启动\
    \ vi。vi 在两种模式下运行：命令模式和插入模式。在命令模式下，你可以控制光标、删除字符和保存文件。在插入模式下，你可以插入字符（或替换、删除字符）。本任务仅涵盖一些基本的\
    \ vi 命令。\n\n- **vi 帮助**：输入 man vi 查看 vi 的帮助文件。\n- **vim**：Linux 包含 vim，即改进版 vi。它与\
    \ vi 向上兼容，可用于编辑任何 ASCII 文本。\n- **Tab 键**：按 Tab 键可在 Bash 终端窗口中自动补全文件名。\n\n1. 在终端窗口中，输入\
    \ **vi** 后跟文件名，以使用 vi 编辑器打开文档。\n2. 按向下、向上、向左或向右箭头键在文档中移动。\n3. 将光标移到单词末尾，然后按 **a**，接着向文档中添加任何文本。按\
    \ Escape 键退出追加模式。\n\n4. 将光标放在字符前面，输入 **x** 删除你不想要保存到文档中的任何字符。\n\n5. 输入 Shift+ZZ\
    \ 保存并退出 vi。\n\n### 跳转到指定行\n\n你可以通过输入行号并按 Shift+G 直接跳转到文档中的任意一行。\n\n## 连接到互联网\n\
    \n如果你有调制解调器、电话线或网络，以及互联网服务提供商（ISP）的账户，你就可以超越桌面，进入信息高速公路。Caldera Linux 2.2 会将 Netscape\
