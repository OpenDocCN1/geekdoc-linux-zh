    # Task 2: Changing the Window Content View


    There are many different ways to view the contents of a window. Caldera''s Linux
    uses large icons as the default view. If you want to view more information about
    a window''s contents, you can change to one of several view formats: Icon view,
    Text view, Long view, and Short view. Additionally, you can customize any window
    to show hidden files, the directory tree, or thumbnails.


    ![](img/28e2bccabaf327178ce9997934f991d9_36_0.png)


    +   1. Double-click a folder icon on the desktop or choose a window you want to
    change. Click the **View** menu and select the view you want (here, click **Long
    View**).

    2. The window displays the contents in the new view (in this case, Long view).


    +   - **The Default View**: The default view for any folder window is HTML view.

    - **Command-Line Trivia**: Long view is equivalent to the `ls -l` command. Short
    view is equivalent to the `ls` command.'
