    # Task 1: Using the Toolbar Buttons in a Folder Window


    Each folder window includes a toolbar that you can use to browse folders, view
    the status of the window, navigate to previously viewed pages, and view the location
    path of the window. The toolbar actually consists of four components: the menu
    bar, status bar, toolbar, and location bar.


    **Removing Toolbars**

    You can remove any toolbars in a window by clicking on the Options menu in the
    window you want to change.


    **Changing Your Toolbar**

    Click and drag any toolbar component to organize the toolbar the way you like
    it. Each toolbar component can also become a floating toolbar for each folder
    window.


    **Location Toolbar**

    Type the pathname for a file or folder in the Location toolbar to quickly view
    the contents of a specific folder.


    ![](img/28e2bccabaf327178ce9997934f991d9_35_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_35_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_35_2.png)


    +   1. Click the Up button to move up one level in the folder directory.

    2. Click the Back and Forward buttons to navigate to a previously viewed page
    or the next page.

    3. Click the Home button to return to the original window view.

    4. Click the Reload button to update the window.'
