  md: '# Task 9: Selecting Text


    One of the basic skills you need for working with data is knowing how to select
    what you want to work on. After you select the text you want, you can delete it,
    copy it, change its appearance, and so on.


    # WARNING


    StarOffice is not included with the CD-ROM included with this book. It is available
    from Star Division for a nominal fee at http:// www.stardivision.com.


    # Using the Keyboard


    If you prefer to use the keyboard to select text, hold down the Shift key and
    use the arrow keys to highlight the text you want to select.


    # Deselecting Text


    To deselect text, click outside the text.


    +   1. Click at the beginning of the text you want to select.

    2. Hold down the left mouse button and drag across the text, and then release
    the mouse button. The selected text appears highlighted.


    ![](img/28e2bccabaf327178ce9997934f991d9_55_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_55_1.png)'
  merge: -1
