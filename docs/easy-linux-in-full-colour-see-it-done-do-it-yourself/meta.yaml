  md: '# Task 4: Monitoring the Print Queue


    The print queue lists the documents that have been sent to a printer. It shows
    you which print jobs are currently going to the printer and the order in which
    the jobs are waiting to be printed. This task shows you how to use the print queue
    to view and cancel print jobs.


    ![](img/28e2bccabaf327178ce9997934f991d9_111_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_111_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_111_2.png)


    # The Print Command


    You can print a text document from a **Terminal** window by typing `cat <document
    name> | lpr`. You can also type `lpr <filename>`.


    # Print Queue Commands


    Control the print queue from a **Terminal** window by typing `lpq` to view the
    print queue. Type `lpc` to control your printers, and `lprm` to stop any print
    jobs in the queue.


    +   1. Open several documents by clicking on them. Click **File** and select **Print**
    for each document.

    2. Click the **K** button and select **Utilities**. Then choose **Printer Queue**.

    3. Click **Update** to update the list of documents in the printer queue.'
  merge: -1
  pgno: 111
- img_proc: true
  md: '![](img/28e2bccabaf327178ce9997934f991d9_112_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_112_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_112_2.png)


    +   4. Click the **Remove** button to cancel a job in the print queue.

    5. Click the **Quit** button to exit the application.'
