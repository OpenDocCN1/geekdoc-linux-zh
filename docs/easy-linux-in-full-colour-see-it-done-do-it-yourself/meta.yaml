  md: "# Task 3: Setting Up Your Internet Connection\n\nIf you have a modem, you must\
    \ have an Internet service provider to connect your PC to the Internet. The connection\
    \ to the Internet uses a point-to-point protocol, which is referred to as PPP.\
    \ Linux uses an application called KPPP to store all the information Linux needs\
    \ to connect to the Internet.\n\n+   1. **KPPP Log**\n   For more detailed information\
    \ about your Internet connection, click the **Log** button in the Connecting to:\
    \ dialog window.\n\n2. **Multiple ISPs**\n   If you have more than one Internet\
    \ service provider, you can configure KPPP to connect to any one of a number of\
    \ accounts you can create in the KPPP application. You will need to enter each\
    \ login and password each time you switch to a different Internet service provider\
    \ account.\n\nClick the **K** button, select **Internet**, and then choose **Kppp**.\n\
    \nClick the **Setup** button.\n\nClick **New**.\n\nClick the **Dial** tab, and\
    \ then type the name of your ISP and the phone number you will use to dial in\
    \ to the ISP. Your ISP should give you this info.\n\n![](img/28e2bccabaf327178ce9997934f991d9_79_0.png)\n\
    \n![](img/28e2bccabaf327178ce9997934f991d9_79_1.png)\n\n![](img/28e2bccabaf327178ce9997934f991d9_79_2.png)\n\
    \n![](img/28e2bccabaf327178ce9997934f991d9_79_3.png)"
