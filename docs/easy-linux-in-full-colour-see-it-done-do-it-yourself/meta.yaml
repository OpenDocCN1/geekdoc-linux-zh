  - '[PAGE 59]


    # Task 12: Working with Documents


    In general, documents store data. The steps covered in this task using Klyx generally
    apply to any type of text document.


    ![](img/28e2bccabaf327178ce9997934f991d9_59_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_59_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_59_2.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_59_3.png)


    # Converting Documents


    If you prefer to work with a specific type of document when creating your work,
    you can always use the Save As command to convert one type of document, such as
    text, to another type, such as HTML. Some text might need to be tweaked after
    the conversion.


    # Deleting Text


    If you make a mistake while typing, press the Backspace key to delete one character
    at a time. Then retype the text.


    +   1. Open a Terminal window and type **klyx**.

    2. Click **File** and choose **New**.

    3. Type some text into the document window. To end a paragraph, press Enter. The
    insertion point moves to the next line.

    4. Select some text and click **Layout**. Choose **Character** to select a font,
    font size, or font style to format the selected text. Click **OK** to save your
    changes.'
