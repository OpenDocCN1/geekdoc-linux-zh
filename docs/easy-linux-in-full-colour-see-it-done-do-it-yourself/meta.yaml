  md: '# # Getting Started


    Caldera''s Linux 2.2 is the most installer-friendly release of OpenLinux to date.
    Many other flavors of OpenLinux are available on the market. The best thing about
    Caldera Linux 2.2 is Lizard; it''s the easiest way to put Linux on your PC. Caldera
    Linux 2.2 will install on any 386-, 486-, or Pentium-based computer with at least
    a 300MB hard disk and 32MB of memory.


    If you are installing Linux for the first time, you can do so starting from a
    PC running Windows, or directly from the CD included with this book. After Linux
    is installed, you can restore the Windows CD for your PC and configure a dual
    boot system, or boot straight into Linux and KDE. This part shows you how to install
    Linux and become familiar with the window controls and menus in the K development
    environment (KDE).'
