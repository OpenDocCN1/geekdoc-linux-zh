    ![](img/28e2bccabaf327178ce9997934f991d9_158_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_158_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_158_2.png)


    # Cancel and Halt Commands


    Type Ctrl+C or Ctrl+D to exit a command. Type Ctrl+Z to halt a command in the
    BASH shell. Type fg (the command for foreground) to restore a halted command.


    # The kill Command


    End any process running by using the kill command. Type man kill for more information
    about the kill command. Type ps -u <username> to view your current process IDs.
    Then use the kill command to kill a process.


    # The exit Command


    You can exit the BASH shell by typing exit at the command-line prompt.


    # More About BASH


    All the Terminal window commands used in this book are run in the BASH shell.
    Many of the tasks in this book include tips that use the command line as an alternative
    to using the KDE interface to execute a command.


    Click on the Terminal window. Then type **history** and press Enter.


    A list of previously typed commands appears in the Terminal window.'
