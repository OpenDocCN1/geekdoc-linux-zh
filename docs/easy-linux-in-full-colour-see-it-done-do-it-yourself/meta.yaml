  mdcn: "\n # X Window System\n\n**scrollbar** 当窗口太小而无法显示所有内容时，出现在窗口底部或右侧的条形控件。\n\n\
    **superuser** 通常用作 root 操作员的同义词。\n\n**surf** 在万维网上从一个站点浏览到另一个站点。\n\n**symbolic\
    \ link** 类似于别名或快捷方式。一种包含指向硬盘或网络上另一个文件路径的文件。\n\n**Terminal window** 针对 Linux 安装所选的\
    \ shell 环境（如 bash shell）的 KDE 窗口。\n\n**text editor** 允许您编辑纯文本文件的应用程序。\n\n**title\
    \ bar** 窗口顶部显示窗口标题的区域。\n\n**toolbar** 一系列通常出现在菜单栏下方的应用程序特定按钮。\n\n**type size**\
    \ 字体高度的度量。字号以*点*为单位测量；一英寸有 72 点。\n\n**type style** 字符属性，例如常规、**粗体**和*斜体*。其他字体样式包括下划线、阴影和轮廓。\n\
    \n**typeface** 字母、数字和其他符号的独特图形设计。\n\n**uncollapse** 如果窗口区域已折叠，单击其标题栏可在窗口标题栏下方显示先前隐藏的窗口区域。\n\
    \n**URL** 统一资源定位符，或您在 Web 浏览器的地址文本字段中输入的 Internet 地址，用于从一个网站跳转到另一个网站。\n\n**virtual\
    \ memory** OpenLinux 中用于管理内存的一种方法，ograd，使用硬盘将数据交换到可用内存（RAM）以便在 OpenLinux 上运行软件应用程序。Caldera\
    \ Linux 2.2 中虚拟内存始终处于开启状态。\n\n**window** KDE 用于显示应用程序和文档的矩形屏幕区域。\n\n**word wrap**\
    \ 一种文字处理功能，当您的输入到达当前行末尾时自动开始新行。\n\n**World Wide Web** Internet 和信息高速公路的一部分。一个全球计算机网络，提供您能想到的几乎任何事物的信息、娱乐和服务。\n\
