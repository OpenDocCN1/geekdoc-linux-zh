  md: '# Task 8: Closing a Document


    ![](img/28e2bccabaf327178ce9997934f991d9_54_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_54_1.png)


    +   1. Click the Close button.

    2. The document is closed but the program remains open. To create a new document,
    click a new document shortcut; click **File**, **New**; or open an existing document.


    When you save a document, it remains open so that you can continue working. If
    you want to close the document, simply click the Close button on the document
    window. You should close documents that you are no longer using in order to reduce
    desktop clutter and free up memory.


    # More Than One Close Button?


    If you click the Close button on the application window, you can exit the application.
    Be sure to use the Close button for the document window if you want to remain
    in the application and only close the document window.


    # Ctrl+F4 and the Close Command


    You can press Ctrl+F4 to close the document window in most applications, or click
    File and select the Close command.'
