  md: "# easy Linux\n\n# IN FULL COLOR\n\nKDE uses HTML pages to present helpful information\
    \ about OpenLinux and the applications installed with Caldera Linux 2.2. Using\
    \ KDE Help is similar to browsing a Web page. Selecting Help in any KDE window\
    \ opens the KFM handbook.You can also search for a particular help topic.\n\n\
    # Task 12: Looking Up a Help Topic in KDE\n\nClick the Home Directory button in\
    \ the KPanel menu.\n\nClick **Help** and choose **Contents**, or press F1.\n\n\
    Scroll down the KFM Help book page. Click a link to view more information about\
    \ a help topic.\n\nClick **File** and choose **Close** to close the Help window.\n\
    \n+   - Printing Help\n  Click File and choose Print to print any help page displayed\
    \ in a window.\n- More Help on the Internet\n  For more information about Caldera\
    \ Linux, visit http://www.calderasystems.com.\n\nPage 20\n\nVisual icons point\
    \ you through each fully illustrated step\n\nEasy-to-follow, numbered, step-by-step\
    \ instructions\n\nKey words highlighted for quick reference\n\nAt a glance, quickly\
    \ get the hints, shortcuts, and warnings you need to know\n\n# Learn Linux the\
    \ EASY way...\n\n+   1. **Get** more coverage of features with over 130 tasks\n\
    2. **Find** visual, step-by-step instruction with supporting text to getting up\
    \ and running with Linux on your PC\n3. **Discover** the easiest way to install\
    \ Linux and get started, connect to networks and the Internet, and send email\n\
    4. **Get** the basic skills you need to work with disks, folders, and files, set\
    \ up applications like WordPerfect, and personalize the KDE\n5. **Learn** the\
    \ basics of maintaining your Linux-based system\n\nThis refreshingly different\
    \ visual guide uses pictures rather than lengthy explanations to teach you Linux—the\
    \ easiest way.\n\nNew\n\nCategory: Operating Systems\nCovers: Linux\nUser Level:\
    \ Beginning\n\nque\nwww.quecorp.com\n\nRegister this book and receive a free subscription\
    \ to Macmillan Online's Personal Bookshelf\nregister.quecorp.com\n\nIncludes Caldera\
    \ OpenLinux 2.2\n\n$24.99 USA / $37.95 CAN / £17.99 Net UK\n\nISBN 0-7897-2108-2"
