    \ Right-click the title bar and select **Close** to exit the application.\n\n\
    **Num Lock Key**\n\nPress the Num Lock key on the keyboard to use the numeric\
    \ keypad to enter numbers into the calculator application.\n\n## Task 6: Scheduling\
    \ Appointments with Plan\n\nCaldera's Linux 2.2 comes with a complete calendar\
    \ that enables you to schedule appointments and remind yourself, as well as print\
    \ a day or month's worth of information. This task shows you how to set the current\
    \ date and schedule an appointment with Plan.\n\n1. Click the **K** button, choose\
    \ **Office**, and then select **Plan**.\n2. Click **Start daemon now** if you\
    \ want to track appointments with Plan.\n3. Click **Config** and choose **Adjust\
    \ time**.\n\n**Printing**\n\nClick File and choose Print to print a single day\
    \ or a full month's calendar."
