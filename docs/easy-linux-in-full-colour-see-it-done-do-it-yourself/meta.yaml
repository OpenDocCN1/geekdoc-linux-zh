    ![](img/28e2bccabaf327178ce9997934f991d9_194_3.png)


    # ## Modifying fstab


    You can modify the fstab file located at file:/etc/fstab so that you can mount
    your DOS volume using COAS. Add `/dev/hda1 /mnt/dmond/ dos msdos defaults 0 0`
    to your fstab file. Click the **K** button, select **COAS**, choose **System**,
    and then select **FileSystem**. Click `/dev/hda`, and then click **Mount**.


    # ## Dual Processors


    A dual-boot PC is not the same as a dual-processor PC. For more information about
    setting up a dual-processor PC, see Part 7, Task 5, "Configuring Additional Processors."


    +   5. Press Enter to continue to the next page. Select **The first IDE hard disk**.
    Press Enter.

    6. Select the Windows partition (in this case, **`/dev/hda1`**). Press Enter.

    7. Press Enter. Select **`/boot/vmlinuz-2.2.5-modular`**, and press Enter. Press
    Enter three more times in the following screens to save the configuration.

    8. Type **reboot**. At the boot: prompt, press the Tab key to view bootable partitions
    on your hard disk. You should see **dos** and **linux**. Type **linux** to boot
    into Linux.'
