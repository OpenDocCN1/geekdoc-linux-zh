    Linux makes it easy to copy files from both the command line and KDE. You can
    copy a file or folder to another location on the hard disk or to a floppy disk.
    Copying a file or folder leaves the original item unchanged. You can copy files
    or folders to create a backup of your work.


    **The cp Command**

    Choosing Copy and Paste from the Edit menu is equivalent to using the cp command.


    **Creating Shortcuts**

    You can create a link, or a shortcut, to a file by dragging the file to the destination
    window and choosing Link in the pop-up menu. The newly created link is a file
    that points to its original.


    **Deleting a Copy**

    Keep in mind that you copy both the folder and its contents. If you don''t need
    the copy, you can delete it. See Task 5, "Deleting a File or Folder," for more
    information.


    +   1. Select the folder or file you want to copy.

    2. Drag the file or folder over the folder icon or window you want to copy to.

    3. Select **Copy** in the contextual menu.

    4. The folder or file is copied to the new location.


