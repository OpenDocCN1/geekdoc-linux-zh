  md: "# Task 8: Changing How Your Windows Look\n\nAlthough the default settings for\
    \ your windows work just great, you might have some preferences regarding the\
    \ location of minimize and close buttons, or you might want to change the title\
    \ bar behavior or size. This task covers how to manage your desktop windows.\n\
    \n+   - **Command-Line Windows**\n  Right-click in a command-line window to adjust\
    \ window settings such as scrolling font and font size.\n\n- **Window Backgrounds**\n\
    \  Right-click in a KDE window and choose Properties to open the kfm window. Click\
    \ the Dir tab and select a wallpaper image for one or all of your KDE windows.\n\
    \n![](img/28e2bccabaf327178ce9997934f991d9_129_0.png)\n\n![](img/28e2bccabaf327178ce9997934f991d9_129_1.png)\n\
    \n![](img/28e2bccabaf327178ce9997934f991d9_129_2.png)\n\n+   1. Click on the **K**\
    \ button and choose **KDE Control Center**.\n2. Click the uncollapse button for\
    \ **Windows**. Then click **Buttons** to change any window button settings.\n\
    3. Click **Titlebar** and change the title bar appearance, mouse action, or title\
    \ animation."
