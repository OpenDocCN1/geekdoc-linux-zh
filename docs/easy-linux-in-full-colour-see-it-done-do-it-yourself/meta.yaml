- md: ' ## Task 9: Selecting Text


    One of the basic skills you need for working with data is knowing how to select
    what you want to work on. After you select the text you want, you can delete it,
    copy it, change its appearance, and so on.


    **WARNING**


    StarOffice is not included with the CD-ROM included with this book. It is available
    from Star Division for a nominal fee at http://www.stardivision.com.


    ## Using the Keyboard


    If you prefer to use the keyboard to select text, hold down the Shift key and
    use the arrow keys to highlight the text you want to select.


    ## Deselecting Text


    To deselect text, click outside the text.


    - 1. Click at the beginning of the text you want to select.

    - 2. Hold down the left mouse button and drag across the text, and then release
    the mouse button. The selected text appears highlighted.


    ## Task 10: Copying Text


    One of the most common editing tasks is copying text. You can copy text, and then
    paste the copy in the current document or in another document.


    **WARNING**


    StarOffice is not included with the CD-ROM included with this book. It is available
    from Star Division for a nominal fee at http://www.stardivision.com.


    - 1. Select the text you want to copy.

    - 2. Click **Edit** and choose **Copy**.

    - 3. Click the location in the document where you want to put the copied data.

    - 4. Click **Edit** and select the **Paste** command. The data is pasted into
    the document.


    ## Working with More Than One Document


    To copy data from one open document to another, select the text and move to the
    document where you want to paste the text using the **Window** menu.


    ## Task 11: Capturing a Screen


    One way to create an image file is to take a screenshot of your desktop. KSnapshot
    is one of the applications installed with Linux that lets you capture a KDE desktop
    and save it as a GIF file. This task shows you how to create a screenshot with
    KSnapshot.


    ## Chunky Images?


    You might need to change the color depth settings in your X11 server if your graphics
    images look blocky or have incorrect coloring. Open a Terminal window and type
    `kde -- bpp 16` to change your color depth to thousands of colors.


    ## xwd and Screen Capture


    Open a Terminal window and type `xwd -in capture.xwd`, and then press the Enter
    key to capture a screen using a command line.


    - 1. Click the **K** button, choose **Graphics**, and then select **Snapshot**.

    - 2. Type a number in the **seconds** field (in this case, I''ve typed **2**).

    - 3. Click **Grab**.


    The KSnapshot panel disappears. Wait two seconds and listen for a beep sound.


    The KSnapshot panel appears. Note the screenshot in the thumbnail window. Type
    a path where you want to save the file on your hard disk.


    Click **Save**.


    ## File Formats


    KSnapshot can save a screenshot as several kinds of file formats. Be sure to choose
    a format that is compatible with the image-viewer or image-editing application
    you want to use.


    ## Task 12: Working with Documents


    In general, documents store data. The steps covered in this task using Klyx generally
    apply to any type of text document.


    ## Converting Documents


    If you prefer to work with a specific type of document when creating your work,
    you can always use the Save As command to convert one type of document, such as
    text, to another type, such as HTML. Some text might need to be tweaked after
    the conversion.


    ## Deleting Text


    If you make a mistake while typing, press the Backspace key to delete one character
    at a time. Then retype the text.


    - 1. Open a Terminal window and type **klyx**.

    - 2. Click **File** and choose **New**.

    - 3. Type some text into the document window. To end a paragraph, press Enter.
    The insertion point moves to the next line.

    - 4. Select some text and click **Layout**. Choose **Character** to select a font,
    font size, or font style to format the selected text. Click **OK** to save your
    changes.

    - Click **Layout** and choose **Paragraph** to indent, align, or set page numbers
    or border style.

    - Click **OK** to return to the document.

    - To spell-check the document, click **Edit** and choose **Spellchecker**.


    **WARNING**


    You can install **WordPerfect 8**, a word processor, with Linux 2.2 from the **CD-ROM**
    included with this book. Click the K button, choose **Applications**, and select
    **WordPerfect** to start the application. The commands covered in this task might
    be in a slightly different menu but will have a similar outcome across most text-editing
    applications such as **WordPerfect**.


    ## Undo


    Click **Edit** and choose **Undo** to revert an edit to its previous state.


    ## Repeat


    Click **Edit** and choose **Repeat** to redo a previous task.


    ## Task 13: Working with Graphics Files


    If you are already familiar with working with text documents, sending email, and
    opening files, you might also want to work with images. You can use two kinds
    of applications with graphics files: authoring and viewing applications. Paint
    is one application included with Linux that lets you open an existing image and
    edit it, or create your own graphics file. The Kview application lets you view
    image files without allowing you to modify them.


    ## Compatibility


    Some applications display some graphics file formats better than other applications.
    Some of the most common graphics file formats for Linux as well as other computer
    platforms are .gif, .jpg, .ps, .bmp, and .xbm.


    ## Presentations


    One way to spice up a presentation is to enhance your word-based ideas with images.


    - 1. Click the **K** button, select **Graphics**, and choose **Paint**.

    - 2. Click on a tool and create a shape in the main Paint window. Add lines and
    shapes to draw an image or create a diagram.

    - 3. Click **File** and choose **Save Image**.

    - 4. Click the **K** button, choose **Graphics**, and select **Image Viewer**.

    - 5. Click **File** and choose **Open**.

    - 6. Select the graphics file, and then click **OK**.

    - 7. The file opens in the Kview window.


    > **WordPerfect**

    > Many word-processing applications support opening graphics files as well as
    text document files. Check the documentation for the software to see which graphics
    file formats are supported by a particular application.


    ## Task 14: Hiding a Document


    Even though you can have up to eight desktops in KDE, you can just as easily use
    several document and file system windows on one desktop. Click the Iconify button
    in a KDE window to hide document windows in the taskbar.


    ## Collapsing a Window


    An alternative to minimizing or iconifying a window is to double-click a window
    title bar or collapse a window.


    - 1. Click a document file on your hard disk to open it.

    - 2. Click the Minimize button in the document window.

    - 3. The selected window appears in the taskbar.'
  mdcn: '

    ## 任务 9：选择文本


    处理数据所需的基本技能之一就是知道如何选择要处理的内容。选中文本后，可以删除、复制、更改其外观等。


    **警告**


    本书附带的 CD-ROM 中不包含 StarOffice。它可从 Star Division 处以少量费用获取，网址为 http://www.stardivision.com。


    ## 使用键盘


    如果你更喜欢用键盘选择文本，按住 Shift 键并使用方向键来高亮显示你要选择的文本。


    ## 取消选择文本


    要取消选择文本，请在文本区域外单击。


    - 1. 在要选择的文本开头单击。

    - 2. 按住鼠标左键并拖动跨越文本，然后释放鼠标按钮。选中的文本会高亮显示。


    ## 任务 10：复制文本


    最常见的编辑任务之一就是复制文本。你可以复制文本，然后将副本粘贴到当前文档或另一个文档中。


    **警告**


    本书附带的 CD-ROM 中不包含 StarOffice。它可从 Star Division 处以少量费用获取，网址为 http://www.stardivision.com。


    - 1. 选择要复制的文本。

    - 2. 单击**编辑**并选择**复制**。

    - 3. 单击文档中想要放置复制数据的位置。

    - 4. 单击. 单击**编辑**并选择**粘贴**命令。数据被粘贴到文档中。


    ## 处理多个文档


    要将数据从一个打开的文档复制到另一个，选择文本并使用**窗口**菜单移动到要粘贴文本的文档。


    ## 任务 11：捕获屏幕


    创建图像文件的一种方法是截取桌面屏幕截图。KSnapshot 是 Linux 自带安装的应用程序之一，可让你捕获 KDE 桌面并保存为 GIF 文件。本任务展示如何使用
    KSnapshot 创建屏幕截图。


    ## 图像粗糙？


    如果你的图形图像看起来有块状或颜色不正确，你可能需要更改 X11 服务器的颜色深度设置。打开终端窗口并输入 `kde -- bpp 16` 以将颜色深度更改为数千色。


    ## xwd 和屏幕捕获


    打开终端窗口并输入 `xwd -in capture.xwd`，然后按 Enter 键使用命令行捕获屏幕。


    - 1. 单击 **K** 按钮，选择**图形**，然后选择**截图**。

    - 2. 在**秒数**字段中输入数字（此处我输入了 **2**）。

    - 3. 单击**抓取**。


    KSnapshot 面板消失。等待两秒钟并听提示音。


    KSnapshot 面板出现。注意缩略图窗口中的屏幕截图。输入要在硬盘上保存文件的路径。


    单击**保存**。


    ## 文件格式


    KSnapshot 可以将屏幕截图保存为多种文件格式。请务必选择与你将要使用的图像查看器或图像编辑应用程序兼容的格式。


    ## 任务 12：处理文档


    通常，文档用于存储数据。本任务中使用 Klyx 的步骤通常适用于任何类型的文本文档。


    ## 转换文档


    如果你创建作品时更喜欢使用特定类型的文档，你随时可以另存为命令将一种类型的文档（如文本）转换为另一种类型（如 HTML）。转换后某些文本可能需要微调。


    ## 删除文本


    如果打字时出错，按 Backspace 键逐个删除字符。然后重新输入文本。


    - 1. 打开终端窗口并输入 **klyx**。

    - 2. 单击**文件**并选择**新建**。

    - 3. 在文档窗口中输入一些文本。要结束段落，按 Enter 键。插入点移动到下一行。

    - 4. 选择一些文本并单击**布局**。选择**字符**以选择字体、字号或字体样式来格式化所选文本。单击**确定**保存更改。

    - 单击**布局**并选择**段落**以缩进、对齐或设置页码或边框样式。

    - 单击**确定**返回文档。

    - 要拼写检查文档，单击**编辑**并选择**拼写检查**。


    **警告**


    你可以从本书附带的 **CD-ROM** 中安装 **WordPerfect 8**，一款文字处理器，用于 Linux 2.2。单击 K 按钮，选择**应用程序**，然后选择
    **WordPerfect** 启动应用程序。本任务中介绍的命令可能位于略有不同的菜单中，但在大多数文本编辑应用程序（如 **WordPerfect**）中会产生类似的结果。


    ## 撤销


    单击**编辑**并选择**撤销**以将编辑恢复到之前的状态。


    ## 重复


    单击**编辑**并选择**重复**以重做之前的任务。


    ## 任务 13：处理图形文件


    如果你已经熟悉处理文本文档、发送电子邮件和打开文件，你可能还想处理图像。你可以使用两种类型的应用程序处理图形文件：创作应用程序和查看应用程序。Paint 是
    Linux 包含的一个应用程序，可让你打开现有图像并编辑，或创建你自己的图形文件。Kview 应用程序允许你查看图像文件，但不允许修改。


    ## 兼容性


    某些应用程序显示某些图形文件格式的效果优于其他应用程序。Linux 以及其他计算机平台最常见的一些图形文件格式有 .gif、.jpg、.ps、.bmp 和
    .xbm。


    ## 演示文稿


    给基于文字的创意增添图像是一种让演示文稿更加生动的方法。


    - 1. 单击 **K** 按钮，选择**图形**，然后选择 **Paint**。

    - 2. 单击某个工具并在 Paint 主窗口中创建形状。添加线条和形状以绘制图像或创建图表。

    - 3. 单击**文件**并选择**保存图像**。

    - 4. 单击 **K** 按钮，选择**图形**，然后选择**图像查看器**。

    - 5. 单击**文件**并选择**打开**。

    - 6. 选择图形文件，然后单击**确定**。

    - 7. 文件在 Kview 窗口中打开。


    > **WordPerfect**

    > 许多文字处理应用程序支持打开图形文件以及文本文档文件。请查看软件文档，了解特定应用程序支持哪些图形文件格式。


    ## 任务 14：隐藏文档


    尽管你在 KDE 中最多可以有八个桌面，但你也可以在一个桌面上轻松使用多个文档和文件系统窗口。单击 KDE 窗口中的最小化按钮以将文档窗口隐藏到任务栏中。


    ## 折叠窗口


    除最小化或图标化窗口外，还可以双击窗口标题栏或折叠窗口。


    - 1. 单击硬盘上的文档文件以打开它。

    - 2. 单击文档窗口中的最小化按钮。

    - 3. 选中的窗口出现在任务栏中。

    '
