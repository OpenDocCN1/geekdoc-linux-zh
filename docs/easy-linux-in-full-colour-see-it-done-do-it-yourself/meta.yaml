    ![](img/28e2bccabaf327178ce9997934f991d9_145_3.png)


    +   1. Click the K button and select **Utilities**. Then click **Terminal**.

    2. Type **useradd** or **man useradd** and press Return to view the options for
    this command.

    3. Click the K button, select **Settings**, choose **Applications**, and then
    choose **Login Manager**.

    4. Click the **Users** tab, and then click on a user account in the **All users**
    window list.'
  merge: -1
