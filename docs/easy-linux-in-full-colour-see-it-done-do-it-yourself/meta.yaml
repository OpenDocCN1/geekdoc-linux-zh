    +   4. Click **Reply**.

    5. Type your reply into the main window.

    6. When your reply is complete, click **Send**.


    # Reply Versus Reply All


    You can reply to everyone addressed in an email, or you can reply only to the
    sender of an email. Click **Reply** to reply to the sender. Click **Reply All**
    to reply to all recipients of the email.'
