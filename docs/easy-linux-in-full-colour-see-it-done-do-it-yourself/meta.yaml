    # 3


    # Using Applications in Linux


    Any program you run in Linux is an application. For example, the command-line
    window is a Bash shell application. WordPerfect is a commercial application available
    for Caldera Linux 2.2. With WordPerfect, you can create word-processing documents
    that are compatible with other word-processing applications for Linux or Windows.


    Linux applications running in the K development environment are similar to Windows
    and Mac applications. They are easy to open and use, and enable you to create
    and save documents. You can also rename any document file or save to a variety
    of locations on your hard disk or floppy disk. You can open a file at any time
    to view, edit, or print it. This part covers some application basics, and then
    focuses on how to use WordPerfect and other applications installed with Caldera
    Linux 2.2. For more information about how to install WordPerfect, see Part 7,
    Task 3, "Installing Applications."'
