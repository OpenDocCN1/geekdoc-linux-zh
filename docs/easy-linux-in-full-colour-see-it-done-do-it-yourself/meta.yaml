- md: " ## Task 5: Setting Up an Ethernet Connection\n\nOne of the fastest ways to\
    \ connect to the Internet is to be connected to a network that is already connected\
    \ to it. Most PC networks use 10BASE-T or 100BASE-T Ethernet cards and network\
    \ connectors.\n\n- **The Ethernet Cable**\n  The other end of the network cable\
    \ connects to your Ethernet network hub.\n\n- **IP Addresses**\n  If you do not\
    \ plan to connect to the Internet, you do not need to use authentic IP addresses\
    \ in your Ethernet configuration.\n\n1. Install an Ethernet card into your PC\
    \ according the manufacturer's directions. Then connect a 10BASE-T or 100BASE-T\
    \ Ethernet cable to the Ethernet port.\n\n2. Open a Terminal window and type **lisa**.\n\
    \n3. Select **System Configuration**, and then select **Configure Network Access**.\
    \ Enter your IP information, and then press Enter.\n\n4. Select **Configure Network\
    \ Card**, and then press Enter.\n\n5. Enter the Ethernet card interface information,\
    \ and then press Enter.\n\n6. Enter the IP address of the card, and then press\
    \ Enter.\n\n7. Press Escape. Select **Enter Router/Gateway**, and then press Enter.\n\
    \n8. Type the IP address of your Ethernet gateway and press Enter. Press Escape\
    \ until you return to the Terminal window prompt.\n\n## DSL, ISDN, and T1 Connections\n\
    \nYou can configure DSL, ISDN, and T1 connections similarly to the way you configured\
    \ Ethernet in this task. Be sure to check and see if you must install additional\
    \ OpenLinux software to use these kinds of Internet connection lines.\n\nNetscape\
    \ Communicator is the name of Netscape's browser product. However, Netscape has\
    \ a unique name for each of its major components in Netscape Communicator. Netscape\
    \ Navigator is Netscape's name for the browser features in Netscape Communicator.\
    \ Other features include Messenger, News Groups, and Composer. This task shows\
    \ you how to start Netscape Communicator. As a default, it opens to Netscape Navigator.\n\
    \n## Task 6: Starting Netscape Communicator\n\n### Command Line\n\nYou can start\
    \ Netscape Communicator from a Terminal window by typing netscape. Type netscape\
    \ -help to view help information about Netscape commands.\n\n1. Click the Netscape\
    \ Communicator icon in the KPanel bar.\n\n2. The Netscape browser window opens.\n\
    \n## Task 7: Typing an Address\n\n1. In the Location bar, type the address of\
    \ the site you want to visit. Then press Enter.\n\n2. Netscape Navigator displays\
    \ the page associated with the URL you entered.\n\nAn Internet address, also known\
    \ as a uniform resource locator, or **URL**, identifies the location of a server\
    \ connected to the Internet. A URL is made up of several components. First, the\
    \ Web protocol **http://** must be included, then the domain name, such as **www.linux.org**.\
    \ The extension to the domain name (usually **.com**, **.net**, **.gov**, or **.edu**)\
    \ indicates the type of Web site (commercial, network, government, or educational,\
    \ respectively). The domain name can also contain a path to a folder or file on\
    \ the Internet server.\n\n**Case Sensitivity**\n\nBe sure to type a URL correctly\
    \ into your browser's address text field. You must type the periods, slashes,\
    \ and other characters in the exact order or you will not be able to load the\
    \ targeted Web site. Some URLs are also case sensitive.\n\n## Task 8: Browsing\
    \ with Links and Toolbar Buttons\n\nInformation is easy to browse on the Internet\
    \ because documents contain links to other pages and Web sites. Click a link to\
    \ view the page to which the link points. You can use the Previous and Next arrow\
    \ buttons to return to the previous page and move back to the following page in\
    \ the browser window. You can use the buttons in the browser's toolbar as short-cuts\
    \ to your home page or search page, or to print a Web page.\n\n1. Go to a Web\
    \ site, such as **http://www.yahoo.com**. Click on a link (in this case, I chose\
    \ **Star Wars**).\n\n2. The Web page loads into the browser window.\n\n3. Click\
    \ the **Back** button to return your previous page, and click the **Forward**\
    \ button to return to this one.\n\n4. Click **Home** to return to the Caldera\
    \ Info page.\n\n**Moving Toolbars**\n\nClick and drag a toolbar above or below\
    \ another toolbar in the browser window to change the location of the toolbar.\n\
    \n## Task 9: Creating a Bookmark\n\nWhen you find a site you like or want to save\
    \ to visit in the future, you might want a quick way to return to it without having\
    \ to remember all the other addresses you typed to get there. Netscape Communicator\
    \ enables you to create a bookmark to a site.\n\n1. Go to a site for which you\
    \ want to create a bookmark.\n\n2. Click the **Bookmarks** button in the toolbar.\n\
    \n3. Select **Add Bookmark** or press Alt+K.\n\n4. The bookmark appears in the\
    \ **Bookmarks** menu.\n\n### Different Commands\n\nThe menu commands available\
    \ in a shortcut menu vary depending on which onscreen element you choose to right-click.\n\
    \n### KDE Bookmarks\n\nYou can also create bookmarks in KDE windows. Simply click\
    \ **Bookmarks** and choose **Add Bookmarks** in any directory to add it to the\
    \ Bookmarks menu.\n\n## Task 10: Working with Bookmarks\n\nAfter you add a site\
    \ to your bookmarks list, go to it by clicking on the **Bookmarks** button, and\
    \ then choosing your site from the pop-up menu. If you add several sites to your\
    \ bookmarks list, you might want to organize them so you can quickly find the\
    \ site you want.\n\n- **Favorites**\n\nBookmarks are also referred to as Favorites\
    \ in other browser applications.\n\n- **Removing a Bookmark**\n\nClick **Bookmarks**\
    \ and select **Edit Bookmarks**. Click on the bookmark you want to remove, and\
    \ press Alt+D to remove a bookmark from the bookmarks list.\n\n1. Click the **Bookmarks**\
    \ button, and then select the bookmark you want to use.\n\n2. To organize your\
    \ bookmarks, click **Bookmarks**, and then choose **Edit Bookmarks**.\n\n3. View\
    \ the list of bookmarks in the Bookmarks window.\n\n4. Click a bookmark or folder\
    \ containing bookmarks and drag it to a new location on the bookmarks list.\n\n\
    5. The bookmark or folder appears in the new location in the bookmarks list.\n\
    \n## Task 11: Using RealPlayer\n\nMany technologies available on the Internet\
    \ enable you to listen to audio files while connected to a Web site. Real Networks\
    \ introduced RealAudio several years ago. You can download a file to your PC or\
    \ play the same audio file over the Internet using RealPlayer.\n\n**Download Problems?**\n\
    \nIf you encounter an error, try logging in as the root user, or close Kpackage\
    \ before trying to download a file from the Internet.\n\n**Streamed Audio**\n\n\
    When you play a RealAudio file without downloading it to your PC, the audio file\
    \ is playing from the Web server. This kind of technology is known as streamed\
    \ audio; that is, the audio data is streamed from the Web server to your PC as\
    \ the file plays on your computer.\n\n1. Go to http://www.real.com and download\
    \ the latest RealAudio player for Red Hat Linux 5.x. In this case it's RealPlayer\
    \ 5. Follow the directions for installation.\n\n2. Click the Netscape button in\
    \ the KPanel bar or taskbar.\n\n3. Click Edit and choose Preferences.\n\n4. Click\
    \ on the arrow beside Navigator in the Preferences window, and then choose Applications."
  mdcn: "\n ## 任务 5：设置以太网连接\n\n连接互联网最快的方式之一就是接入已经联网的网络。大多数 PC 网络使用 10BASE-T 或 100BASE-T\
    \ 以太网卡和网络连接器。\n\n- **以太网电缆**\n  网线另一端连接到以太网集线器。\n\n- **IP 地址**\n  如果不打算连接互联网，以太网配置中不需要使用真实的\
    \ IP 地址。\n\n1. 按照制造商说明将以太网卡安装到 PC 中。然后将 10BASE-T 或 100BASE-T 以太网电缆连接到以太网端口。\n\n\
    2. 打开终端窗口并输入 **lisa**。\n\n3. 选择 **系统配置（System Configuration）**，然后选择 **配置网络访问（Configure\
    \ Network Access）**。输入 IP 信息，然后按 Enter。\n\n4. 选择 **配置网卡（Configure Network Card）**，然后按\
    \ Enter。\n\n5. 输入以太网卡接口信息，然后按 Enter。\n\n6. 输入网卡的 IP 地址，然后按 Enter。\n\n7. 按 Escape。选择\
    \ **输入路由器/网关（Enter Router/Gateway）**，然后按 Enter。\n\n8. 输入以太网网关的 IP 地址并按 Enter。按\
    \ Escape 直到返回到终端窗口提示符。\n\n## DSL、ISDN 和 T1 连接\n\nDSL、ISDN 和 T1 连接的配置方式与本任务中以太网的配置方式类似。请务必检查是否需要安装额外的\
    \ OpenLinux 软件才能使用这些互联网连接线路。\n\nNetscape Communicator 是 Netscape 浏览器产品的名称。然而，Netscape\
    \ 为 Netscape Communicator 中的每个主要组件都取了独特的名称。Netscape Navigator 是 Netscape 对 Netscape\
    \ Communicator 中浏览器功能的命名。其他功能包括 Messenger、新闻组和 Composer。本任务介绍如何启动 Netscape Communicator。默认情况下，它会打开\
    \ Netscape Navigator。\n\n## 任务 6：启动 Netscape Communicator\n\n### 命令行\n\n可以在终端窗口中输入\
    \ netscape 启动 Netscape Communicator。输入 netscape -help 查看有关 Netscape 命令的帮助信息。\n\
    \n1. 点击 K 面板栏中的 Netscape Communicator 图标。\n\n2. Netscape 浏览器窗口打开。\n\n## 任务 7：输入地址\n\
    \n1. 在地址栏中输入想要访问的站点地址。然后按 Enter。\n\n2. Netscape Navigator 显示与输入的 URL 相关联的页面。\n\
    \n互联网地址，也称为统一资源定位符或 **URL**，标识连接到互联网的服务器的位置。URL 由多个部分组成。首先，必须包含 Web 协议 **http://**，然后是域名，例如\
    \ **www.linux.org**。域名扩展名（通常是 **.com**、**.net**、**.gov** 或 **.edu**）表示网站类型（分别为商业、网络、政府或教育机构）。域名还可以包含指向互联网服务器上文件夹或文件的路径。\n\
    \n**大小写敏感性**\n\n务必在浏览器地址文本字段中正确输入 URL。必须按准确顺序输入句点、斜杠和其他字符，否则无法加载目标网站。某些 URL 也是区分大小写的。\n\
    \n## 任务 8：使用链接和工具栏按钮浏览\n\n在互联网上浏览信息很容易，因为文档包含指向其他页面和网站的链接。点击链接可以查看链接指向的页面。可以使用后退和前进箭头按钮返回上一页，并移动到浏览器窗口中后续的页面。可以使用浏览器工具栏中的按钮作为快捷方式，快速访问主页或搜索页面，或打印网页。\n\
    \n1. 访问一个网站，例如 **http://www.yahoo.com**。点击一个链接（在此例中，我选择了 **Star Wars**）。\n\n2.\
    \ 网页加载到浏览器窗口中。\n\n3. 点击 **后退（Back）** 按钮返回之前的页面，点击 **前进（Forward）** 按钮返回到此页面。\n\n\
    4. 点击 **主页（Home）** 返回 Caldera 信息页面。\n\n**移动工具栏**\n\n在浏览器窗口中点击并拖动工具栏到另一个工具栏的上方或下方，以更改工具栏的位置。\n\
    \n## 任务 9：创建书签\n\n找到喜欢的网站或想要保存以便将来访问时，可能希望有一种快速返回的方式，而无需记住输入的所有其他地址。Netscape Communicator\
    \ 允许您为站点创建书签。\n\n1. 访问想要创建书签的站点。\n\n2. 点击工具栏中的 **书签（Bookmarks）** 按钮。\n\n3. 选择\
    \ **添加书签（Add Bookmark）** 或按 Alt+K。\n\n4. 书签出现在 **书签（Bookmarks）** 菜单中。\n\n### 不同命令\n\
    \n快捷菜单中的可用命令因右键点击的屏幕元素而异。\n\n### KDE 书签\n\n也可以在 KDE 窗口中创建书签。只需点击任意目录中的 **书签（Bookmarks）**，然后选择\
    \ **添加书签（Add Bookmarks）**，即可将其添加到书签菜单。\n\n## 任务 10：管理书签\n\n将站点添加到书签列表后，点击 **书签（Bookmarks）**\
    \ 按钮，然后从弹出菜单中选择站点即可访问。如果向书签列表中添加了多个站点，可能需要整理它们，以便快速找到所需的站点。\n\n- **收藏夹**\n\n在其他浏览器应用程序中，书签也被称为收藏夹。\n\
    \n- **删除书签**\n\n点击 **书签（Bookmarks）** 并选择 **编辑书签（Edit Bookmarks）**。点击要删除的书签，按 Alt+D\
    \ 从书签列表中删除书签。\n\n1. 点击 **书签（Bookmarks）** 按钮，然后选择想要使用的书签。\n\n2. 要整理书签，点击 **书签（Bookmarks）**，然后选择\
    \ **编辑书签（Edit Bookmarks）**。\n\n3. 在书签窗口中查看书签列表。\n\n4. 点击书签或包含书签的文件夹，并将其拖动到书签列表中的新位置。\n\
    \n5. 书签或文件夹出现在书签列表的新位置中。\n\n## 任务 11：使用 RealPlayer\n\n互联网上提供了多种技术，让您可以在连接网站时收听音频文件。Real\
    \ Networks 于数年前推出了 RealAudio。您可以将文件下载到 PC，或使用 RealPlayer 通过互联网播放相同的音频文件。\n\n**下载问题？**\n\
    \n如果遇到错误，请尝试以 root 用户身份登录，或在尝试从互联网下载文件之前关闭 Kpackage。\n\n**流式音频**\n\n不下载到 PC 而直接播放\
    \ RealAudio 文件时，音频文件是从 Web 服务器播放的。这种技术称为流式音频；也就是说，音频数据在文件于计算机上播放的同时，从 Web 服务器流式传输到您的\
    \ PC。\n\n1. 访问 http://www.real.com 并下载适用于 Red Hat Linux 5.x 的最新 RealAudio 播放器。在此例中是\
    \ RealPlayer 5。按照安装说明进行操作。\n\n2. 点击 K 面板栏或任务栏中的 Netscape 按钮。\n\n3. 点击编辑并选择首选项。\n\
    \n4. 点击首选项窗口中 Navigator 旁边的箭头，然后选择应用程序。\n"
