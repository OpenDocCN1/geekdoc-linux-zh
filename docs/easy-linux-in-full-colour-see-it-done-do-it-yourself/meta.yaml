  md: '# Task 12: Editing Menus


    The KPanel bar enables you to access an application or virtual desktop or log
    out with one click of a button. As you work with applications and documents, you
    might want to customize which items are selectable in the K button menu or on
    the KPanel bar. This task shows you how to personalize the KPanel menu.


    +   - Menu Editor

    - Another way to open the Menu Editor is to click the K button, choose Utilities,
    and then select Menu Editor.


    # WARNING


    You can move a folder into another folder in the Menu Editor. This shortens the
    length of the K button menu and enables you to organize the menu items so you
    can find things faster.


    +   1. Click the **K** button, select **Panel**, and choose **Edit Menus**.

    2. Click **Options** and select **Change Menuname**.

    3. Type a new name for the menu. Then click **OK**.


    ![](img/28e2bccabaf327178ce9997934f991d9_137_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_137_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_137_2.png)'
