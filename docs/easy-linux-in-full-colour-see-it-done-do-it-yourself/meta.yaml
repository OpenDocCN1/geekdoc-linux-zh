- md: " 5. Click on a discussion group folder to view related newsgroups.\n6. Click\
    \ on a newsgroup, and then click **Subscribe**.\n7. Click on a discussion topic\
    \ to read a newsgroup message.\n\n## Linux Newsgroups\n\nOne way to find out more\
    \ about Linux is to subscribe to newsgroups that focus on Linux issues. Here are\
    \ some Linux newsgroups you might want to subscribe to:\n\n- comp.os.linux.answers\n\
    - comp.os.linux.setup\n- comp.os.linux.x\n- comp.os.linux.music\n- comp.os.linux.hardware\n\
    - comp.os.linux.announce\n- comp.os.linux.advocacy\n\n## Task 17: Posting to a\
    \ Newsgroup\n\nWorking with newsgroups is similar to replying and sending email.\
    \ Keep in mind that anything you post in a newsgroup can be read by anyone else\
    \ in the world. Most newsgroups have system administrators who try to keep the\
    \ discussions focused on a particular topic.\n\n- **Unsubscribe**\n  If you find\
    \ a particular newsgroup has become inactive or the discussion topics are not\
    \ quite what you expected, select the newsgroup and click **Unsubscribe**.\n\n\
    - **New and Old Messages**\n  Messages in bold have not yet been read; messages\
    \ with a collapsible arrow next to them have responses.\n\n- **Printing a Message**\n\
    \  You can print a Web page, email, or newsgroup message. Go to the Web page,\
    \ email, or newsgroup message, click **File**, and then choose **Print**.\n\n\
    1. Click **New Msg**.\n2. Type the newsgroup into the recipient field. Type a\
    \ subject and a message.\n3. Click **Send** to post it to the newsgroup.\n\n##\
    \ Task 18: Replying to a Newsgroup\n\nIf you come across a newsgroup message you\
    \ want to respond to, you can post a reply to that message.\n\n**Saving a Message**\n\
    \nYou can save any Web page, email, or newsgroup message. Go to the Web page,\
    \ email, or newsgroup message, click File, and choose Save. Then choose a location\
    \ on your hard disk to save the Web page or message.\n\n**Private Replies**\n\n\
    If you don't want to post your message to the world, type the email address of\
    \ the person to whom you want to reply into the field instead of replying to the\
    \ newsgroup email address.\n\n1. Open a newsgroup message.\n2. Click **Reply**.\n\
    3. Type your reply to the newsgroup message.\n4. Add any additional recipients\
    \ for your newsgroup message. Then click **Send**.\n\n## Printing\n\nWhether you're\
    \ printing from a console window or from an application, all Linux applications\
    \ use the same setup for your printer. You can use Lisa to configure your printer\
    \ port, and then run the KDE Wizard to create a desktop printer icon. You can\
    \ use Linux to manage printing for all your applications.\n\nIn general, you print\
    \ a document from the application in which the document was created. When you\
    \ send a file to the printer, the file is translated from an onscreen image to\
    \ a printable image. Then it goes to a print queue, or holding area. The print\
    \ queue can contain one or several files at any time, and you can make changes\
    \ to the print queue as documents are printing. This part shows you how to control\
    \ and manage printing in KDE.\n\n## Tasks\n\n| Task # | Page # |\n|--------| |\n\
    | 1 Adding a Printer | 98 |\n| 2 Printing Text Files | 100 |\n| 3 Printing Graphics\
    \ Files | 101 |\n| 4 Monitoring the Print Queue | 102 |\n| 5 Adding a Printer\
    \ Icon to the Desktop | 104 |\n\n## Task 1: Adding a Printer\n\nPrinting a document\
    \ involves a few more steps besides connecting the cable from the printer to your\
    \ computer. This task shows you how to configure your printer with Linux using\
    \ the Lisa system administration tool.\n\n### Mounting a CD\n\nIf your printer\
    \ software is on a CD-ROM, double-click the CD icon installed by the KDE Wizard,\
    \ or type mount /mnt/cdrom in a Terminal window.\n\n### Printer Help\n\nFor more\
    \ information about printing, go to file:/usr/doc/HOWTO/other-formats/html in\
    \ a browser window and select the Printing-HOWTO or Printing-Usage-HOWTO\n\nTip:\
    \ You can also visit Caldera's Web site at http://www.calderasystems.com for the\
    \ latest information about Linux 2.2.\n\nConnect the printer to your PC. Then\
    \ power on the printer and the PC and log in to Linux. Click the **K** menu, select\
    \ **Utilities**, and choose **Terminal**.\n\nType **dmesg | less** and scroll\
    \ to find the line similar to **lp0 at 0x0378 (polling)**. This means Linux detected\
    \ the printer at the lp0 port (/dev/lp0). Type **q** to exit the document.\n\n\
    Type **lisa** in the Terminal window. Select **System Configuration**, and then\
    \ **Hardware Configuration** on the following screen. Then choose **Configure\
    \ Printer**.\n\nSelect a printer driver (in this case, I chose **Local PostScript\
    \ Printer**).\n\n### Can't Print?\n\nI had to restart my system and my printer\
    \ twice before I could actually start printing with Linux to a PostScript printer.\
    \ For more information about the lpr application, type man lpr in a Terminal window,\
    \ or type the following path and read the document at /usr/doc/LPRng to make sure\
    \ the lpd printer daemon is set up correctly.\n\n### The lpd Daemon\n\nBefore\
    \ you can print, Linux must run the lpd daemon. Click the K button and choose\
    \ COAS, select System, and then choose Daemons. Click the Print Server (LPD) check\
    \ box. Click OK to activate the lpd daemon, and then restart Linux.\n\n1. Select\
    \ a printer port (I chose **LP0** from step 2).\n2. Select a default printer resolution\
    \ (in this case, I chose **300x300**).\n3. Select the default paper size (in this\
    \ case, I chose **Letter**). Press Enter, and then press Escape until you return\
    \ to the Terminal window.\n4. Type **ls -l | lpr** and press Enter to print a\
    \ test page.\n\n## Task 2: Printing Text Files\n\nLinux offers you the best of\
    \ both computing worlds. That is, you can print text from a command line or from\
    \ the user-friendly K development environment. Both text and graphics files can\
    \ be either bitmapped or PostScript-based documents. To print a PostScript document,\
    \ you must have a PostScript printer configured with Linux. This task shows you\
    \ how to print from the command line as well as with the Text Editor application.\n\
    \n**Printing Man Pages**\n\nYou can print man pages by typing man man | <program\
    \ name> -b } lpr in a Konsole or Terminal window.\n\n**The Cancel Button**\n\n\
    If you decide you're not ready to print a document, click the **Cancel** button\
    \ in the Kview window.\n\n1. Click on a text document. In this case, I've selected\
    \ **FreeTheory.txt**.\n2. Click **File** and choose **Print**.\n3. Click **OK**.\n\
    4. To print this same file from a command line, open a Terminal window and type\
    \ **FreeTheory.txt**.\n\n## Task 3: Printing Graphics Files\n\nPrinting a graphics\
    \ file is similar to printing a text file if you're in KDE. Most image files can\
    \ be opened with the Kview application. You can also use tools such as gv, gimp,\
    \ xv, xfig, tgif, and display to work with and eventually print graphics files.\
    \ This task shows you how to print a JPEG file with Kview.\n\n- **The Cancel Button**\n\
    \  If you change your mind about printing, you can always click the Cancel button\
    \ in the Kview window.\n\n- **The gv Tool**\n  You can also print graphics from\
    \ a Terminal window. The general format of the command is `gv /opt/kde/share/wallpapers/berries.jpg`.\
    \ Type `man gv` for more information about how to print with the gv tool.\n\n\
    Click on an image file, such as a .jpg or .gif file. In this case, I chose **berries.jpg**.\n\
    \nThe file opens.\n\nClick **File** and choose **Print**.\n\nSelect the paper\
    \ format and type of paper, and click **OK** in the Kview window."
  mdcn: "\n 5. 点击讨论组文件夹以查看相关的新闻组。\n6. 点击一个新闻组，然后点击**订阅**。\n7. 点击一个讨论主题以阅读新闻组消息。\n\n\
    ## Linux 新闻组\n\n了解更多关于 Linux 的信息的一种方法是订阅专注于 Linux 问题的新闻组。以下是一些你可能想要订阅的 Linux 新闻组：\n\
    \n- comp.os.linux.answers\n- comp.os.linux.setup\n- comp.os.linux.x\n- comp.os.linux.music\n\
    - comp.os.linux.hardware\n- comp.os.linux.announce\n- comp.os.linux.advocacy\n\
    \n## 任务 17：向新闻组发帖\n\n使用新闻组与回复和发送电子邮件类似。请记住，你在新闻组中发布的任何内容都可以被世界上任何其他人阅读。大多数新闻组都有系统管理员，他们试图使讨论集中在特定主题上。\n\
    \n- **取消订阅**\n  如果你发现某个新闻组已经变得不活跃，或者讨论主题并不符合你的预期，请选择该新闻组并点击**取消订阅**。\n\n- **新消息和旧消息**\n\
    \  粗体显示的消息尚未阅读；带有可折叠箭头的消息表示有回复。\n\n- **打印消息**\n  你可以打印网页、电子邮件或新闻组消息。转到网页、电子邮件或新闻组消息，点击**文件**，然后选择**打印**。\n\
    \n1. 点击**新消息**。\n2. 在收件人字段中输入新闻组。输入主题和消息。\n3. 点击**发送**将其发布到新闻组。\n\n## 任务 18：回复新闻组\n\
    \n如果你遇到想要回复的新闻组消息，你可以发布对该消息的回复。\n\n**保存消息**\n\n你可以保存任何网页、电子邮件或新闻组消息。转到网页、电子邮件或新闻组消息，点击文件，然后选择保存。然后选择硬盘上的一个位置来保存网页或消息。\n\
    \n**私人回复**\n\n如果你不想将消息发布给全世界，请在字段中输入你想要回复的人的电子邮件地址，而不是回复新闻组的电子邮件地址。\n\n1. 打开一条新闻组消息。\n\
    2. 点击**回复**。\n3. 输入你对新闻组消息的回复。\n4. 添加新闻组消息的任何其他收件人。然后点击**发送**。\n\n## 打印\n\n无论你是从控制台窗口还是从应用程序打印，所有\
    \ Linux 应用程序都使用相同的打印机设置。你可以使用 Lisa 来配置你的打印机端口，然后运行 KDE 向导来创建桌面打印机图标。你可以使用 Linux\
    \ 来管理所有应用程序的打印。\n\n通常，你从创建文档的应用程序中打印文档。当你将文件发送到打印机时，文件会从屏幕图像转换为可打印图像。然后它进入打印队列或等待区域。打印队列在任何时候都可以包含一个或几个文件，你可以在文档正在打印时对打印队列进行更改。本部分向你展示如何在\
    \ KDE 中控制和管理打印。\n\n## 任务\n\n| 任务 # | 页码 # |\n|--------| |\n| 1 添加打印机 | 98 |\n\
    | 2 打印文本文件 | 100 |\n| 3 打印图形文件 | 101 |\n| 4 监控打印队列 | 102 |\n| 5 向桌面添加打印机图标 | 104\
    \ |\n\n## 任务 1：添加打印机\n\n打印文档除了将打印机电缆连接到计算机之外，还需要几个步骤。本任务向你展示如何使用 Lisa 系统管理工具在\
    \ Linux 中配置打印机。\n\n### 挂载 CD\n\n如果你的打印机软件在 CD-ROM 上，双击 KDE 向导安装的 CD 图标，或者在终端窗口中输入\
    \ mount /mnt/cdrom。\n\n### 打印机帮助\n\n有关打印的更多信息，请在浏览器窗口中转到 file:/usr/doc/HOWTO/other-formats/html，然后选择\
    \ Printing-HOWTO 或 Printing-Usage-HOWTO\n\n提示：你也可以访问 Caldera's 网站 http://www.calderasystems.com\
    \ 获取关于 Linux 2.2 的最新信息。\n\n将打印机连接到 PC。然后打开打印机和 PC 的电源并登录到 Linux。点击**K**菜单，选择**工具**，然后选择**终端**。\n\
    \n输入**dmesg | less**并滚动查找类似于**lp0 at 0x0378 (polling)**的行。这意味着 Linux 在 lp0 端口（/dev/lp0）检测到打印机。输入**q**退出文档。\n\
    \n在终端窗口中输入**lisa**。选择**系统配置**，然后在接下来的屏幕上选择**硬件配置**。然后选择**配置打印机**。\n\n选择一个打印机驱动程序（在本例中，我选择了**本地\
    \ PostScript 打印机**）。\n\n### 无法打印？\n\n我不得不两次重启系统和打印机，才能实际开始在 Linux 上向 PostScript\
    \ 打印机打印。有关 lpr 应用程序的更多信息，请在终端窗口中输入 man lpr，或输入以下路径并在 /usr/doc/LPRng 阅读文档，以确保 lpd\
    \ 打印机守护进程设置正确。\n\n### lpd 守护进程\n\n在打印之前，Linux 必须运行 lpd 守护进程。点击 K 按钮并选择 COAS，选择系统，然后选择守护进程。点击打印服务器（LPD）复选框。点击确定激活\
    \ lpd 守护进程，然后重启 Linux。\n\n1. 选择一个打印机端口（我选择了步骤 2 中的**LP0**）。\n2. 选择默认的打印机分辨率（在本例中，我选择了**300x300**）。\n\
    3. 选择默认的纸张大小（在本例中，我选择了**Letter**）。按回车键，然后按 Escape 键直到返回终端窗口。\n4. 输入**ls -l | lpr**并按回车键打印测试页。\n\
    \n## 任务 2：打印文本文件\n\nLinux 为你提供了两个计算世界的最佳体验。也就是说，你可以从命令行或用户友好的 K 开发环境中打印文本。文本和图形文件都可以是位图或基于\
    \ PostScript 的文档。要打印 PostScript 文档，你必须使用 Linux 配置的 PostScript 打印机。本任务向你展示如何从命令行以及使用文本编辑器应用程序进行打印。\n\
    \n**打印手册页**\n\n你可以通过在 Konsole 或终端窗口中输入 `man man | <program name> -b } lpr` 来打印手册页。\n\
    \n**取消按钮**\n\n如果你决定还不想打印文档，请点击 Kview 窗口中的**取消**按钮。\n\n1. 点击文本文档。在本例中，我选择了**FreeTheory.txt**。\n\
    2. 点击**文件**并选择**打印**。\n3. 点击**确定**。\n4. 要从命令行打印同一文件，请打开终端窗口并输入 **lpr FreeTheory.txt**。\n\
    \n## 任务 3：打印图形文件\n\n如果你在 KDE 中，打印图形文件与打印文本文件类似。大多数图像文件都可以用 Kview 应用程序打开。你也可以使用\
    \ gv、gimp、xv、xfig、tgif 和 display 等工具来处理并最终打印图形文件。本任务向你展示如何使用 Kview 打印 JPEG 文件。\n\
    \n- **取消按钮**\n  如果你改变了打印的主意，可以随时点击 Kview 窗口中的取消按钮。\n\n- **gv 工具**\n  你也可以从终端窗口打印图形。命令的一般格式是\
    \ `gv /opt/kde/share/wallpapers/berries.jpg`。输入 `man gv` 以获取有关如何使用 gv 工具打印的更多信息。\n\
    \n点击一个图像文件，例如 .jpg 或 .gif 文件。在本例中，我选择了**berries.jpg**。\n\n文件打开。\n\n点击**文件**并选择**打印**。\n\
    \n选择纸张格式和纸张类型，然后点击 Kview 窗口中的**确定**。\n"
