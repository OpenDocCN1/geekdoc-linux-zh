  - "[PAGE 21]\n\n# Task 4: Opening and Closing a Window\n\nThe K development environment\
    \ can display folder content in a window. To work with files and folders in KDE,\
    \ click on an icon to open its window. You can have one or several windows open\
    \ on your computer screen. You can close a window by clicking its Close button.\n\
    \n+   - **Active and Inactive Windows**\n  If you have more than one window open,\
    \ only the front window is active. This means you can make changes to the menus,\
    \ files, and folders only in the front (active) window on your screen.\n- **Ctrl+O\
    \ and Alt+F4**\n  There are keyboard shortcuts for opening and closing windows,\
    \ too. Press Ctrl+O to open a window and Alt+F4 to close a window.\n- **Console\
    \ Commands**\n  Press Ctrl+T to open a console window from a KDE window. Type\
    \ exit to close a console or Terminal window.\n\n![](img/28e2bccabaf327178ce9997934f991d9_21_0.png)\n\
    \n![](img/28e2bccabaf327178ce9997934f991d9_21_1.png)\n\n![](img/28e2bccabaf327178ce9997934f991d9_21_2.png)\n\
    \n+   1. Click the Home Directory icon on the KPanel bar.\n2. Click on any folder\
    \ icon in the Home Directory window to open it. You can also select a folder,\
    \ click **File**, and choose **Open**.\n3. Click a window's Close box. You can\
    \ also right-click a window title bar and choose **Close** from the pop-up menu."
- md: " ## Task 5: Minimizing and Maximizing a Window\n\nWhen a window is open, there\
    \ are many ways it can remain open but hidden. For example, you can hide an open\
    \ window in the taskbar by clicking the Minimize button. A button is displayed\
    \ on the taskbar for the open window, but the window is not displayed on the desktop.\n\
    \n1. Click the Minimize button in the window you want to minimize.\n2. The window\
    \ disappears from the desktop, and a button for the window remains on the taskbar.\
    \ Click the taskbar button to restore the minimized window.\n3. Click the Maximize\
    \ button to grow the window to fill the screen. Click the Maximize button once\
    \ more to restore the window to its previous size.\n\n**Collapsing and Uncollapsing**\n\
    \nYou can collapse a window by double-clicking in the window's title bar. Only\
    \ the title bar is viewable when you collapse a window. Uncollapse the window\
    \ by double-clicking once more in the title bar area.\n\n## Task 6: Moving a Window\n\
    \nWhen you open two or three windows, notice that the front window blocks any\
    \ other inactive windows behind it. Click on any window to select it and view\
    \ its contents. Click and drag a window to move it to any location on the desktop.\n\
    \n- **The Unclutter Command**\n  Right-click on the desktop and choose **Unclutter\
    \ window** to bring it to the foreground and resize it to your screen.\n\n- **Cascade\
    \ Windows**\n  Right-click on the desktop and choose **Cascade Windows** to resize\
    \ all windows on the desktop. This enables you to view the window title bar for\
    \ each open window.\n\n- **Scale All Windows**\n  Right-click on the desktop and\
    \ choose **Scale all Windows** to resize all windows on a desktop. This enables\
    \ you to view the window title bar for each open window.\n\n1. Click on a window\
    \ title bar. Hold down the mouse button.\n2. Drag the window to a new position\
    \ on the desktop.\n3. Release the mouse button to place the window in its new\
    \ location. If you close a window, it reopens to the last previous size and location\
    \ on your desktop.\n\n## Task 7: Resizing a Window\n\nMoving or collapsing a window\
    \ might still prevent you from viewing the windows you want to use on a desktop.\
    \ You can resize any window in KDE to show only a partial window item or as many\
    \ items as will fit on your screen.\n\n1. Point to any window border. An arrow\
    \ with a line cursor appears.\n2. Drag the border to grow or shrink the side of\
    \ the window. Release the mouse to resize the window.\n\n- **Adjusting Any Window\
    \ Side**\n  Grab the top, bottom, or sides of a window to grow or shrink it.\n\
    \n- **Window Corner**\n  You can proportionally grow or shrink a window by clicking\
    \ and dragging a corner of a window.\n\n## Task 8: Scrolling a Window\n\nIf you\
    \ store many items in a window, you might not be able to view all of a window's\
    \ contents onscreen at the same time. You can use a window's scrollbars to view\
    \ rows of icons or file-names.\n\n1. Click the up arrow to scroll up through the\
    \ window. Click the down arrow to scroll down through the window.\n2. Click the\
    \ left arrow to scroll left through a window. Click the right arrow to scroll\
    \ right through the window.\n3. Drag the scroll thumb button to scroll up or down\
    \ through the window.\n4. Click in the scrollbar gutter to page up, down, left,\
    \ or right through the window.\n\n**Window List**\n\nClick the K button, select\
    \ **Panel**, and choose **Add Window List** to add a window list icon to the KPanel\
    \ bar. If you click the Window List icon, a pop-up menu appears showing you a\
    \ list of all open windows.\n\n## Task 9: Using Menus\n\nLike any great restaurant,\
    \ OpenLinux offers a wide range of menus, each containing a unique set of menu\
    \ commands. You can type commands into a console or Terminal window, or click\
    \ a menu and choose a menu command. One of the benefits of using a menu is that\
    \ you do not need to remember what commands are available for which window. Instead,\
    \ KDE makes Linux commands easily available in menus.\n\n### Submenus\n\nIf a\
    \ menu command is followed by an arrow, the menu command contains a submenu. If\
    \ a menu command is followed by an ellipsis, selecting it displays a dialog box.\n\
    \n### Deselecting a Menu\n\nIf you click on a menu but decide you do not want\
    \ to use any of its commands, click anywhere on the desktop and the menu will\
    \ close.\n\n1. Click a menu name in a window (in this case, I've selected **View**).\n\
    2. Click the command you want (**Icon View**, in this example).\n3. The window\
    \ view changes to Icon view.\n\n## Task 10: Using Shortcut Menus\n\nShortcut menus,\
    \ also referred to as contextual, pop-up, or quick menus, contain sets of commands\
    \ associated with the desktop or window element on which you right-click. For\
    \ example, right-click on a window title bar to close, minimize, maximize, or\
    \ restore the state of any window.\n\n1. Right-click an item to view its shortcut\
    \ menu. In this case, I've right-clicked on the desktop.\n2. Choose the command\
    \ you want to use.\n\n**Different Commands**\n\nThe menu commands available in\
    \ a shortcut menu vary depending on which onscreen element you right-click.\n\n\
    ## Task 11: Using Dialog Window Controls\n\nWhen you choose certain menu commands,\
    \ a dialog box appears, enabling you to change OpenLinux controls or customize\
    \ settings. Many different dialog boxes are used throughout KDE; however, most\
    \ work virtually the same way.\n\n### Dialog Controls\n\nDialog boxes contain\
    \ a variety of controls, such as radio buttons, sliders, check boxes, tabs, buttons,\
    \ up/down arrows, and text fields. The settings you choose in a dialog box will\
    \ be saved if you click the OK button.\n\n1. To use a list box, scroll through\
    \ the list and click the item you want.\n2. To use a drop-down list box, click\
    \ the arrow, and then select the item you want.\n3. To use a radio button, click\
    \ it.\n\n## Task 12: Looking Up a Help Topic in KDE\n\nKDE uses HTML pages to\
    \ present helpful information about OpenLinux and the applications installed with\
    \ Caldera Linux 2.2. Using KDE Help is similar to browsing a Web page. Selecting\
    \ Help in any KDE window opens the KFM handbook. You can also search for a particular\
    \ help topic.\n\n- **Printing Help**\n  Click File and choose Print to print any\
    \ help page displayed in a window.\n\n- **More Help on the Internet**\n  For more\
    \ information about Caldera Linux, visit http://www.caldersystems.com.\n\n1. Click\
    \ the Home Directory button in the KPanel menu.\n2. Click **Help** and choose\
    \ **Contents**, or press F1.\n3. Scroll down the KFM Handbook page. Click a link\
    \ to view more information about a help topic.\n4. Click **File** and choose **Quit**\
    \ to exit the Help window.\n\n## Task 13: Looking Up a Help Topic in a Terminal\
    \ Window\n\n### Start Here\n\n1. Click the **K** button, select **Utilities**,\
    \ and then choose **Terminal**.\n2. Type **man ls** to view help about the ls,\
    \ or list, command.\n3. Read through the help information by pressing the up or\
    \ down arrow key.\n4. Press **q** to exit the man page.\n\nThere's also help for\
    \ virtually all the commands you can type into a console or Terminal window. To\
    \ view help for any command, type **man** followed by the command on which you\
    \ want help information. Using man pages is a speedy way to figure out the best\
    \ way to use a particular command.\n\n### Printing man Pages\n\nClick the **K**\
    \ button, select **Utilities**, and choose **Console**. Type the man command you\
    \ want, and then click **File, Print**.\n\n**WARNING**\n\nIf you are not sure\
    \ what a particular command will do, test it on an expendable file or folder before\
    \ executing the command on a larger scale.\n\n**End Task**"
  mdcn: "\n ## 任务 5：最小化和最大化窗口\n\n当窗口打开时，有多种方式可以使其保持打开但隐藏状态。例如，你可以通过点击最小化按钮将打开的窗口隐藏到任务栏中。打开的窗口会在任务栏上显示一个按钮，但窗口不会在桌面上显示。\n\
    \n1. 在要最小化的窗口中点击最小化按钮。\n2. 窗口从桌面消失，而窗口的按钮保留在任务栏上。点击任务栏按钮以恢复最小化的窗口。\n3. 点击最大化按钮将窗口扩展至填满整个屏幕。再点击一次最大化按钮，将窗口恢复至先前的大小。\n\
    \n**折叠和展开**\n\n你可以通过在窗口的标题栏上双击来折叠窗口。折叠窗口时，只有标题栏可见。再次在标题栏区域双击即可展开窗口。\n\n## 任务 6：移动窗口\n\
    \n当你打开两个或三个窗口时，请注意最前面的窗口会挡住后面任何不活动的窗口。点击任意窗口即可选中它并查看其内容。点击并拖动窗口，将其移动到桌面的任何位置。\n\
    \n- **整理窗口命令**\n  在桌面上右键单击并选择**整理窗口**，将其带到前景并调整为适合屏幕的大小。\n\n- **层叠窗口**\n  在桌面上右键单击并选择**层叠窗口**，以调整桌面上所有窗口的大小。这样可以查看每个打开窗口的标题栏。\n\
    \n- **缩放所有窗口**\n  在桌面上右键单击并选择**缩放所有窗口**，以调整桌面上所有窗口的大小。这样可以查看每个打开窗口的标题栏。\n\n1.\
    \ 点击一个窗口的标题栏。按住鼠标按钮。\n2. 将窗口拖动到桌面的新位置。\n3. 松开鼠标按钮，将窗口放置在新位置。如果你关闭一个窗口，它会重新打开并以桌面上的前一个大小和位置显示。\n\
    \n## 任务 7：调整窗口大小\n\n移动或折叠窗口仍可能阻止你查看桌面上想要使用的窗口。你可以在 KDE 中调整任何窗口的大小，以只显示部分窗口项目，或显示尽可能多的适合屏幕的项目。\n\
    \n1. 指向任意窗口边框。会出现一个带线的箭头光标。\n2. 拖动边框以放大或缩小窗口的侧边。松开鼠标以调整窗口大小。\n\n- **调整任意窗口边**\n\
    \  抓住窗口的顶部、底部或侧面来放大或缩小它。\n\n- **窗口角**\n  你可以通过点击并拖动窗口的一个角来按比例放大或缩小窗口。\n\n## 任务\
    \ 8：滚动窗口\n\n如果你在窗口中存储了许多项目，可能无法同时在屏幕上查看窗口的所有内容。你可以使用窗口的滚动条来查看图标行或文件名。\n\n1. 点击向上箭头以向上滚动窗口。点击向下箭头以向下滚动窗口。\n\
    2. 点击向左箭头以向左滚动窗口。点击向右箭头以向右滚动窗口。\n3. 拖动滚动滑块按钮以向上或向下滚动窗口。\n4. 在滚动条槽中点击以向上、下、左或右翻页浏览窗口。\n\
    \n**窗口列表**\n\n点击 K 按钮，选择**面板**，然后选择**添加窗口列表**，将窗口列表图标添加到 KPanel 栏上。如果你点击窗口列表图标，会弹出一个菜单，显示所有打开窗口的列表。\n\
    \n## 任务 9：使用菜单\n\n就像任何一家伟大的餐厅一样，OpenLinux 提供了丰富多样的菜单，每个菜单都包含一组独特的菜单命令。你可以将命令输入到控制台或终端窗口中，或者点击菜单并选择菜单命令。使用菜单的好处之一是，你无需记住哪些窗口有哪些命令可用。相反，KDE\
    \ 将 Linux 命令方便地呈现在菜单中。\n\n### 子菜单\n\n如果菜单命令后面跟着一个箭头，该菜单命令包含一个子菜单。如果菜单命令后面跟着省略号，选择它会显示一个对话框。\n\
    \n### 取消选择菜单\n\n如果你点击了一个菜单但决定不想使用其中的任何命令，点击桌面上的任意位置，菜单就会关闭。\n\n1. 点击窗口中的菜单名称（在本例中，我选择了**视图**）。\n\
    2. 点击你想要的命令（在此示例中为**图标视图**）。\n3. 窗口视图更改为图标视图。\n\n## 任务 10：使用快捷菜单\n\n快捷菜单，也称为上下文菜单、弹出菜单或快速菜单，安排一组与你在其上右键单击的桌面或窗口元素相关联的命令。例如，在窗口标题栏上右键单击以关闭、最小化、最大化或恢复任何窗口的状态。\n\
    \n1. 右键单击一个项目以查看其快捷菜单。在本例中，我在桌面上右键单击。\n2. 选择你要使用的命令。\n\n**不同的命令**\n\n快捷菜单中可用的菜单命令因你右键单击的屏幕元素而异。\n\
    \n## 任务 11：使用对话框控件\n\n当你选择某些菜单命令时，会出现一个对话框，使你能够更改 OpenLinux 控件或自定义设置。KDE 中使用了多种不同的对话框；然而，大多数对话框的工作方式几乎相同。\n\
    \n### 对话框控件\n\n对话框包含各种控件，例如单选按钮、滑块、复选框、选项卡、按钮、上下箭头和文本字段。如果你在对话框中选择的设置，点击确定按钮后会被保存。\n\
    \n1. 要使用列表框，滚动浏览列表并点击你想要的项。\n2. 要使用下拉列表框，点击箭头，然后选择你想要的项。\n3. 要使用单选按钮，点击它。\n\n\
    ## 任务 12：在 KDE 中查找帮助主题\n\nKDE 使用 HTML 页面来呈现有关 OpenLinux 以及与 Caldera Linux 2.2\
    \ 一起安装的应用程序的有用信息。使用 KDE 帮助类似于浏览网页。在任何 KDE 窗口中选择帮助会打开 KFM 手册。你也可以搜索特定的帮助主题。\n\n\
    - **打印帮助**\n  点击文件并选择打印，以打印窗口中显示的任何帮助页面。\n\n- **互联网上的更多帮助**\n  有关 Caldera Linux\
    \ 的更多信息，请访问 http://www.caldersystems.com。\n\n1. 点击 KPanel 菜单中的主目录按钮。\n2. 点击**帮助**并选择**目录**，或按\
    \ F1。\n3. 向下滚动 KFM 手册页面。点击链接以查看有关帮助主题的更多信息。\n4. 点击**文件**并选择**退出**，以关闭帮助窗口。\n\n\
    ## 任务 13：在终端窗口中查找帮助主题\n\n### 从这里开始\n\n1. 点击 **K** 按钮，选择**工具**，然后选择**终端**。\n2.\
    \ 输入 **man ls** 以查看有关 ls（列表）命令的帮助。\n3. 按向上或向下箭头键浏览帮助信息。\n4. 按 **q** 退出 man 页面。\n\
    \n几乎所有可以输入到控制台或终端窗口的命令都有帮助。要查看任何命令的帮助，输入 **man** 后跟你要获取帮助信息的命令。使用 man 页面是快速找出使用特定命令的最佳方法的一种快速方式。\n\
    \n### 打印 man 页面\n\n点击 **K** 按钮，选择**工具**，然后选择**控制台**。输入你想要的 man 命令，然后点击**文件，打印**。\n\
    \n**警告**\n\n如果你不确定某个特定命令会做什么，请先在非关键文件或文件夹上测试它，然后再大规模执行该命令。\n\n**任务结束**\n"
