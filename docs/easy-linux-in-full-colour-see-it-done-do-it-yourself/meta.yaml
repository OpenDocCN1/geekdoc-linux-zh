  md: "# ## Task 1: Starting with Windows\n\nOpenLinux can run on a wide range of\
    \ PCs, most of which might already have Windows installed on them. Although you\
    \ can simply boot into the OpenLinux CD and begin installing OpenLinux, you can\
    \ just as easily prepare your hard disk for the OpenLinux installation from Windows.\
    \ To begin this task, start up your PC with Windows, and then insert the OpenLinux\
    \ CD into the PC's CD-ROM drive.\n\n+   - **Hard Disk Space**  \n  Partition Magic\
    \ enables you to convert unused hard disk space for the OpenLinux installation.\n\
    - **Full Install Preparation Option**  \n  Click Full Install Preparation, and\
    \ then choose a language. This installs bootable floppy images onto your hard\
    \ disk. If your PC does not have a CD-ROM drive, or if it is unable to start up\
    \ from the CD included with this book, try installing OpenLinux from a floppy\
    \ disk.\n\n![](img/28e2bccabaf327178ce9997934f991d9_13_0.png)\n\n![](img/28e2bccabaf327178ce9997934f991d9_13_1.png)\n\
    \n![](img/28e2bccabaf327178ce9997934f991d9_13_2.png)\n\n+   1. Double-click **My\
    \ Computer**, and then double-click the **OpenLinux 22 CD** icon.\n2. Click **Install\
    \ Products**.\n3. Click **Partition & Launch Linux Install** to create the Linux\
    \ partition."
