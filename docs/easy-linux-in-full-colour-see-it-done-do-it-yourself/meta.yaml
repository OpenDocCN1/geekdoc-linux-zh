    \ 2.2版本Linux的一部分，包含在本书所附的CD-ROM中。Linux不仅价格实惠、可从万维网轻松获取，而且具有许多吸引人的特性、运行速度快，并且占用的内存相对较少。由于OpenLinux是开源产品，除了Caldera\
    \ 2.2版本之外，还有许多其他版本的Linux可供选择。本书中的大部分信息可以应用于通用Linux版本，尤其是当它使用K开发环境作为Linux的用户界面时。\n\
    \n*Easy Linux*提供简洁、可视化、分步的指导，说明如何使用Caldera 2.2版本Linux中一些最基本、最引人注目的功能，该版本包含在本书所附的CD-ROM中。你无需阅读大段说明，即可学会如何安装Linux、使用KDE用户界面连接互联网、发送电子邮件、打印，以及使用终端窗口或文字处理应用程序。如果你之前从未使用过电脑，可能会发现本书中的许多任务需要一些关于PC或软件工作原理的更深入知识。\n\
    \n对于Linux新手，一个小提醒：它是开源产品，因此如果某个功能无法按照本书所述方式工作，你可能需要注销并重新登录你的账户、重启计算机，或者在第一次尝试未成功时重复执行某项任务。\n\
    \n*Easy Linux*不包含Linux的许多高级主题或技术内部工作原理，例如应用程序编程接口。如果你想学习如何为Linux开发应用程序，或者如何添加或自定义Linux的源代码，请访问**http://www.linux.org**。\n\
    \n你可以从头到尾阅读本书，从CD安装Linux，然后在想要弄清楚如何执行特定任务时将其作为参考，或者与想要学习Caldera 2.2版本Linux一些基本功能的朋友分享。无论怎样，*Easy\
    \ Linux*都让你看到操作过程并亲自实践。\n\n## 告诉我们您的想法！\n\n作为本书的读者，*您*是我们最重要的批评家和评论员。我们重视您的意见，想知道我们做得好的地方、哪些地方可以做得更好、您希望我们出版哪些领域的书籍，以及您愿意与我们分享的其他任何金玉良言。\n\
    \n作为Que出版社的副出版人，我欢迎您的评论。您可以通过传真、电子邮件或写信直接联系我，告诉我您对本书的喜好与不喜——以及我们可以如何让我们的书籍更加出色。\n\
    \n*请注意，我无法帮助您解决与本书主题相关的技术问题，并且由于我收到的邮件数量庞大，我可能无法回复每一封邮件。*\n\n您来信时，请务必注明本书的书名和作者，以及您的姓名和电话或传真号码。我将仔细审阅您的意见，并与本书的作者和编辑分享。\n\
    \n- 传真：317-581-4666\n\n- 电子邮件：**consumer@mcp.com**\n\n- 邮寄：Greg Wiegand\n  副出版人\n\
    \  Que出版社\n  201 West 103rd Street\n  Indianapolis, IN 46290 USA\n\n## 开始使用\n\n\
    Caldera Linux 2.2是目前最便于安装的OpenLinux版本。市场上还有许多其他版本的OpenLinux。Caldera Linux 2.2最出色的地方在于Lizard；这是将Linux安装到PC上最简便的方式。Caldera\
    \ Linux 2.2可以安装在任何基于386、486或Pentium的计算机上，至少需要300MB硬盘和32MB内存。\n\n如果你首次安装Linux，可以从运行Windows的PC开始，或者直接从本书所附的CD开始安装。安装Linux后，你可以恢复PC的Windows\
    \ CD并配置双启动系统，或者直接启动进入Linux和KDE。本部分向你展示如何安装Linux，并熟悉K开发环境（KDE）中的窗口控制和菜单。\n\n##\
    \ 任务\n\n| # | 任务 | 页码 |\n|---|------|------|\n| 1 | 从Windows开始 | 4 |\n| 2 | 安装OpenLinux\
    \ | 6 |\n| 3 | 登录 | 10 |\n| 4 | 打开和关闭窗口 | 12 |\n| 5 | 最小化和最大化窗口 | 13 |\n| 6 |\
    \ 移动窗口 | 14 |\n| 7 | 调整窗口大小 | 15 |\n| 8 | 滚动窗口 | 16 |\n| 9 | 使用菜单 | 17 |\n| 10\
    \ | 使用快捷菜单 | 18 |\n| 11 | 使用对话框窗口控件 | 19 |\n| 12 | 在KDE中查找帮助主题 | 20 |\n| 13 |\
    \ 在终端窗口中查找帮助主题 | 21 |\n| 14 | 注销 | 22 |\n| 15 | 关闭计算机 | 23 |\n\n### 任务1：从Windows开始\n\
    \nOpenLinux可以在广泛的PC上运行，其中大多数可能已经安装了Windows。虽然你可以直接从OpenLinux CD启动并开始安装OpenLinux，但你同样可以轻松地从Windows准备硬盘以进行OpenLinux安装。要开始此任务，请先用Windows启动你的PC，然后将OpenLinux\
    \ CD插入PC的CD-ROM驱动器中。\n\n- **硬盘空间**\n\n  Partition Magic使你能够将未使用的硬盘空间转换为OpenLinux安装所需空间。\n\
    \n- **完整安装准备选项**\n\n  点击\"完整安装准备\"，然后选择语言。这会将可启动软盘镜像安装到你的硬盘上。如果你的PC没有CD-ROM驱动器，或者无法从本书所附的CD启动，请尝试从软盘安装OpenLinux。\n\
    \n1. 双击**我的电脑**，然后双击**OpenLinux 22 CD**图标。\n2. 点击**安装产品**。\n3. 点击**分区并启动Linux安装**以创建Linux分区。\n\
    \n在Partition Magic安装向导中，点击**下一步**。按照屏幕上的指示将Partition Magic安装到你的硬盘上。\n\n点击**完成**。然后从CD-ROM驱动器中取出OpenLinux\
    \ CD。\n\n点击**确定**。你的PC将以DOS模式重启，并要求你为OpenLinux选择分区和分区大小。如果你计划使用KDE（本书推荐使用），请选择1GB分区大小选项。\n\
    \n## 双启动PC\n\n有关如何配置以启动至Windows或Linux的更多信息，请参阅第9部分，任务3，\"配置双启动PC\"。\n\n## 删除OpenLinux分区\n\
    \n要删除OpenLinux分区，只需选择\"开始\"、\"程序\"、Partition Magic: Caldera Edition，然后选择**删除Linux分区**。\n\
    \n## 选择分区大小\n\n你可以在Caldera安装程序中选择三种分区大小选项：300MB、1GB和整个磁盘（即4GB）。如果你不打算使用KDE，并且希望进行OpenLinux最小安装，请选择300MB。如果要用本书所附的CD进行安装，请选择1GB；如果你有足够的磁盘空间，并计划使用OpenLinux编辑或创建大型文件，则选择4GB。\n"
