    # # How to Use This Book


    # ## It''s as Easy as 1-2-3


    Each part of this book is made up of a series of short, instructional lessons,
    designed to help you understand basic information that you need to get the most
    out of your computer hardware and software.


    +   - **Click**: Click the left mouse button once.

    - **Double-click**: Click the left mouse button twice in rapid succession.

    - **Right-click**: Click the right mouse button once.

    - **Pointer Arrow**: Highlights an item on the screen you need to point to or
    focus on in the step or task.

    - **Selection**: Highlights the area onscreen discussed in the step or task.

    - **Click & Type**: Click once where indicated and begin typing to enter your
    text or data.


    Tips and Warnings give you a heads-up for any extra information you may need while
    working through the task.


    Each task includes a series of quick, easy steps designed to guide you through
    the procedure.


    How to Drag: Point to the starting place or object. Hold down the mouse button
    (right or left per instructions), move the mouse to the new location, then release
    the button.


    Each step is fully illustrated to show you how it looks onscreen.


    Items that you select or click in menus, dialog boxes, tabs, and windows are shown
    in **bold**. Information you type also is in **bold**.


    **Next Step**: If you see this symbol, it means the task you''re working on continues
    on the next page.


    **End Task**: Task is complete.'
- md: " ## About the Author\n\n**Lisa Lee** has written and co-written many computer\
    \ books over the past 10 years. She has also worked for several hardware and software\
    \ companies in Silicon Valley as an employee and consultant over the past 10 years.\n\
    \n## Dedication\n\nThis book is dedicated to Jos Claerbout, who gave a whole new\
    \ meaning to the term \"sex on your head\" (visit http://www.toessel.com).\n\n\
    ## Acknowledgments\n\nA big thank you to Linus Torvald and the folks at UC Berkeley\
    \ who worked on BSD for bringing Linux to life.\n\nThanks to Chris Will, Sarah\
    \ Robbins, and the fabulous staff at Macmillan for making this book possible.\
    \ Also, thanks to Mike Neil, Lisa Chapman, Bruce Gay, Paul Rybicki, Yun Shin,\
    \ Sairam Suresh, Michael Wu, Val Liborski, Rob Moore, Chris Berarducci, Joe Britt,\
    \ Jos Claerbout, and my mom, dad, sisters, and brother for all their support.\n\
    \n## Introduction to Easy Linux\n\nLinux is one of the most popular operating\
    \ systems available for PCs today. It was created by Linus Torvald, working with\
    \ many developers around the world who volunteered their time to add features\
    \ to the OpenLinux source code base. OpenLinux is part of the Caldera 2.2 release\
    \ of Linux included on the CD-ROM at the back of this book. Not only is Linux\
    \ affordable and easily accessible from the World Wide Web, it also has many attractive\
    \ features, fast performance, and takes up a relatively small amount of memory.\
    \ Because OpenLinux is an open-source product, many other releases of Linux are\
    \ available in addition to the Caldera 2.2 release. Much of the information included\
    \ in this book can be applied to the general Linux release, especially if it uses\
    \ the K development environment as the user interface for Linux.\n\n*Easy Linux*\
    \ provides concise, visual, step-by-step instructions explaining how to use some\
    \ of the most basic, compelling features in the Caldera 2.2 Linux release, which\
    \ is included on the CD-ROM with this book. You won't have to read through paragraphs\
    \ of explanations to learn how to get Linux installed, use the KDE user interface\
    \ to connect to the Internet, send email, print, or use a Terminal window or word\
    \ processing application. If you have never used a computer before, you might\
    \ find that many of the tasks in this book require a little more in-depth knowledge\
    \ about how a PC or software works.\n\nA small word of caution to those new to\
    \ Linux: It is an open-source product, so if a feature doesn't work the way it\
    \ is presented in this book, you might need to log out and log back in to your\
    \ account, restart the computer, or repeat a task a second time if it doesn't\
    \ work the first time.\n\n*Easy Linux* does not cover many advanced topics of\
    \ Linux or the technical inner workings of Linux, such as application programming\
    \ interfaces. If you want to learn how to develop applications for Linux, or how\
    \ to add or customize source code for Linux, visit **http://www.linux.org**.\n\
    \nYou can read this book cover to cover, install Linux from the CD, and then use\
    \ it as a reference when you want to figure out how to do a particular task, or\
    \ share it with a friend who wants to learn some of the basic features of Caldera's\
    \ 2.2 release of Linux. Either way, *Easy Linux* lets you see it done and do it\
    \ yourself.\n\n## Tell Us What You Think!\n\nAs the reader of this book, *you*\
    \ are our most important critic and commentator. We value your opinion and want\
    \ to know what we're doing right, what we could do better, what areas you'd like\
    \ to see us publish in, and any other words of wisdom you're willing to pass our\
    \ way.\n\nAs a Associate Publisher for Que Corporation, I welcome your comments.\
    \ You can fax, email, or write me directly to let me know what you did or didn't\
    \ like about this book—as well as what we can do to make our books stronger.\n\
    \n*Please note that I cannot help you with technical problems related to the topic\
    \ of this book, and that due to the high volume of mail I receive, I might not\
    \ be able to reply to every message.*\n\nWhen you write, please be sure to include\
    \ this book's title and author as well as your name and phone or fax number. I\
    \ will carefully review your comments and share them with the author and editors\
    \ who worked on the book.\n\n- Fax: 317-581-4666\n\n- Email: **consumer@mcp.com**\n\
    \n- Mail: Greg Wiegand\n  Associate Publisher\n  Que Corporation\n  201 West 103rd\
    \ Street\n  Indianapolis, IN 46290 USA\n\n## Getting Started\n\nCaldera's Linux\
    \ 2.2 is the most installer-friendly release of OpenLinux to date. Many other\
    \ flavors of OpenLinux are available on the market. The best thing about Caldera\
    \ Linux 2.2 is Lizard; it's the easiest way to put Linux on your PC. Caldera Linux\
    \ 2.2 will install on any 386-, 486-, or Pentium-based computer with at least\
    \ a 300MB hard disk and 32MB of memory.\n\nIf you are installing Linux for the\
    \ first time, you can do so starting from a PC running Windows, or directly from\
    \ the CD included with this book. After Linux is installed, you can restore the\
    \ Windows CD for your PC and configure a dual boot system, or boot straight into\
    \ Linux and KDE. This part shows you how to install Linux and become familiar\
    \ with the window controls and menus in the K development environment (KDE).\n\
    \n## Tasks\n\n| # | Task | Page |\n|---|------|------|\n| 1 | Starting with Windows\
    \ | 4 |\n| 2 | Installing OpenLinux | 6 |\n| 3 | Logging In | 10 |\n| 4 | Opening\
    \ and Closing a Window | 12 |\n| 5 | Minimizing and Maximizing a Window | 13 |\n\
    | 6 | Moving a Window | 14 |\n| 7 | Resizing a Window | 15 |\n| 8 | Scrolling\
    \ a Window | 16 |\n| 9 | Using Menus | 17 |\n| 10 | Using Shortcut Menus | 18\
    \ |\n| 11 | Using Dialog Window Controls | 19 |\n| 12 | Looking Up a Help Topic\
    \ in KDE | 20 |\n| 13 | Looking Up a Help Topic in a Terminal Window | 21 |\n\
    | 14 | Logging Out | 22 |\n| 15 | Shutting Down the Computer | 23 |\n\n### Task\
    \ 1: Starting with Windows\n\nOpenLinux can run on a wide range of PCs, most of\
    \ which might already have Windows installed on them. Although you can simply\
    \ boot into the OpenLinux CD and begin installing OpenLinux, you can just as easily\
    \ prepare your hard disk for the OpenLinux installation from Windows. To begin\
    \ this task, start up your PC with Windows, and then insert the OpenLinux CD into\
    \ the PC's CD-ROM drive.\n\n- **Hard Disk Space**\n\n  Partition Magic enables\
    \ you to convert unused hard disk space for the OpenLinux installation.\n\n- **Full\
    \ Install Preparation Option**\n\n  Click Full Install Preparation, and then choose\
    \ a language. This installs bootable floppy images onto your hard disk. If your\
    \ PC does not have a CD-ROM drive, or if it is unable to start up from the CD\
    \ included with this book, try installing OpenLinux from a floppy disk.\n\n1.\
    \ Double-click **My Computer**, and then double-click the **OpenLinux 22 CD**\
    \ icon.\n2. Click **Install Products**.\n3. Click **Partition & Launch Linux Install**\
    \ to create the Linux partition.\n\nIn the Partition Magic Setup Wizard, click\
    \ **Next**. Follow the onscreen instructions to install Partition Magic onto your\
    \ hard disk.\n\nClick **Finish**. Then remove the OpenLinux CD from your CD-ROM\
    \ drive.\n\nClick **OK**. Your PC will restart in DOS mode and ask you to choose\
    \ a partition and partition size for OpenLinux. Choose the 1GB partition size\
    \ option if you plan to use KDE, which is recommended for this book.\n\n## Dual-Boot\
    \ PCs\n\nFor more information about how to configure to boot into either Windows\
    \ or Linux, see Part 9, Task 3, \"Configuring a Dual-Boot PC.\"\n\n## Removing\
    \ the OpenLinux Partition\n\nTo remove the OpenLinux partition, simply choose\
    \ Start, Programs, Partition Magic: Caldera Edition, and then choose **Delete\
    \ Linux Partition**.\n\n## Choosing a Partition Size\n\nYou can choose from three\
    \ partition size options in the Caldera installer: 300MB, 1GB, and entire disk\
    \ (which is 4GB). Choose 300MB if you do not plan to use KDE and prefer a minimal\
    \ installation of OpenLinux. Choose 1GB to install with the CD included with this\
    \ book, or 4GB if you have plenty of disk space and plan to edit or create large\
    \ files with OpenLinux."
