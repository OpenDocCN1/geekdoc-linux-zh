  md: '# ## Task 13: Reading Email


    After you have configured Messenger to recognize your mail server and your email
    account, you can download your email and read it. Of course, reading email is
    just the first step in using email. You will almost naturally send and reply to
    email as you receive more of it.


    ![](img/28e2bccabaf327178ce9997934f991d9_95_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_95_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_95_2.png)


    > **WARNING**


    If you receive an email but don''t recognize the sender, open the email with extreme
    caution. Some spam might contain a software virus or other code as an attachment.
    Viruses can range from code that doesn''t do any harm at all to code that sits
    on your hard disk until a certain day, and then erases all the data on your disk,
    sometimes without warning.


    +   1. Click **Communicator**, and then choose **Messenger**.

    2. Click **Get Msg**.

    3. Type your password into the Netscape: Password dialog box. Click **OK** and
    wait for your email to download.


    > **Full-Size Window**


    To open an email into its own window, double-click on any email in the list.'
