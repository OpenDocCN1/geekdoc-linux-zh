  - '[PAGE 191]


    # Task 1: Backing Up Files


    As a precaution to unforeseen computing disasters, you should periodically make
    an extra copy of your files. This is called a backup. You can use tar or gzip
    to back up your files. This task shows you how to create a backup archive using
    GNU tar.


    # Backing Up with Multiple Floppy Disks


    To back up a folder to more than one floppy using tar, type **tar cMf /dev/fd0
    backups**. As you type commands, don''t forget that Linux is case sensitive.


    # gzip


    You can also create a backup archive of a folder or files with gzip, a file compression
    application installed with OpenLinux. Type **man gzip** for more information about
    how to use gzip.


    # WARNING


    GNU tar will not create an archive in the same folder you are trying to archive.


    ![](img/28e2bccabaf327178ce9997934f991d9_191_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_191_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_191_2.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_191_3.png)


    +   1. Select the files or folders you want to back up, and move them into one
    folder on your hard disk.


    +   2. Click the Terminal Window button in the KPanel bar.


    +   3. Insert a disk into your PC, and type **tar cf /dev/fd0 backups** in the
    Terminal window. This creates a new tar archive of the Backups folder using the
    floppy to store the backup file.


    +   4. Type **tar uf /dev/fd0 backups** to add any new files to the backup archive
    on the floppy disk.


    ![](img/28e2bccabaf327178ce9997934f991d9_191_4.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_191_5.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_191_6.png)'
  - '[PAGE 192]


    # Task 2: Restoring a Backup


    ![](img/28e2bccabaf327178ce9997934f991d9_192_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_192_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_192_2.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_192_3.png)


    Backup files are stored in a special file format on your floppy disk. You won''t
    be able to view the contents of the floppy if you insert it into a PC running
    Windows or into a Macintosh computer. You can restore one file or all files from
    a backup session by using some of the tar options. To view tar options, type **tar
    --help** in a Terminal window. This task shows you how to restore all files in
    a tar archive on a single floppy disk.


    +   1. Click the Terminal Window button in the KPanel bar.

    2. Insert the floppy disk with the backup file. Type **tar xf /dev/fd0**. This
    command extracts the files from the tar archive located on the floppy disk.

    3. Click the Home Directory button on the KPanel bar.

    4. View the restored backup files on your hard disk. Use the files to verify they
    continue to function after being restored from a backup.


    # Restoring Multiple Disk Archives


    Restore an archive that consists of multiple floppy disks using GNU tar. Type
    **tar xMf /dev/fd0**. This command uses the M option to request a new storage
    component, such as a floppy disk, when the current one is filled.


    # Viewing Tar Archives


    You can see the files stored in a tar archive. Type **tar tf /dev/fd0**, for example,
    to view the files stored in the tar archive on a floppy disk.'
  - '[PAGE 193]


    # Task 3: Configuring a Dual-Boot PC


    If your PC is not on a network, or if you want to share files between Linux and
    Windows, you can configure LILO (LInux LOader) to enable you to choose either
    DOS or Linux when you start up your PC. If you start up with Linux, you can mount
    the DOS partition of your hard disk to your Linux partition. Then you can copy
    files from Linux to DOS so that, when you boot with Windows, you can work with
    any files you created in Linux.


    ![](img/28e2bccabaf327178ce9997934f991d9_193_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_193_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_193_2.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_193_3.png)


    > > **The mount Command**

    > Mounting the DOS partition is similar to mounting a floppy or CD-ROM in Linux.
    Type **mount -t msdos /dev/hda1 /mnt/dos** to mount the first partition of your
    hard disk, which happens to be a DOS partition.


    +   1. Open a Terminal window by pressing Ctrl+T in a home directory window or
    by clicking on the Terminal Window button on the KPanel bar.

    2. Type **lisa** in the Terminal window. Then press Enter.

    3. Select **System Configuration**, and press Enter.

    4. Select **Configure Boot Manager**, and press Enter.'
- md: " ## Modifying fstab\n\nYou can modify the fstab file located at file:/etc/fstab\
    \ so that you can mount your DOS volume using COAS. Add `/dev/hda1 /mnt/dos/ dos\
    \ msdos defaults 0 0` to your fstab file. Click the **K** button, select **COAS**,\
    \ choose **System**, and then select **FileSystem**. Click `/dev/hda`, and then\
    \ click **Mount**.\n\n## Dual Processors\n\nA dual-boot PC is not the same as\
    \ a dual-processor PC. For more information about setting up a dual-processor\
    \ PC, see Part 7, Task 5, \"Configuring Additional Processors.\"\n\n- 5. Press\
    \ Enter to continue to the next page. Select **The first IDE hard disk**. Press\
    \ Enter.\n6. Select the Windows partition (in this case, **`/dev/hda1`**). Press\
    \ Enter.\n7. Press Enter. Select **`/boot/vmlinuz-2.2.5-modular`**, and press\
    \ Enter. Press Enter three more times in the following screens to save the configuration.\n\
    8. Type **reboot**. At the boot: prompt, press the Tab key to view bootable partitions\
    \ on your hard disk. You should see **dos** and **linux**. Type **linux** to boot\
    \ into Linux.\n\n## Task 4: Backing Up Files on a Dual-Boot PC\n\nOne way to create\
    \ a backup of files or folders is to copy them to another partition on your hard\
    \ disk. For example, if you back up your files and folders to your DOS partition\
    \ and something happens to your Linux partition, you can always re-install Linux\
    \ and copy your files back to Linux.\n\nOf course, the best way to back up files\
    \ and folders is to store them on a separate floppy disk, hard disk, or computer.\
    \ However, if you need the security of a backup, along with quick access to files,\
    \ you can't beat using a DOS partition to store your Linux files and folders.\n\
    \n## Backing Up Your DOS Partition\n\nIf you have already invested in a Windows-based\
    \ backup system, you can use it to back up both your Windows and Linux files after\
    \ you've copied your Linux files to the DOS partition.\n\n- 1. Click the COAS\
    \ button, select **System**, and then choose **Filesystem**.\n2. Click **OK**\
    \ at the welcome dialog.\n3. Click **dev/hda**, and then click **Mount**. Click\
    \ **OK**.\n\n**WARNING**\n\nBe sure you have enough free space available on your\
    \ DOS partition before you copy files from your Linux partition to the DOS partition.\
    \ If you do not have enough disk space, you will not be able to successfully back\
    \ up your files.\n\n## Naming Backup Folders\n\nYou can track backup files and\
    \ folders more easily if you use descriptive names for folders you add to a backup\
    \ archive.\n\n## Log In as Root Budget istics Reporting\n\nYou must be logged\
    \ in as root to mount the DOS directory. After it is mounted, any other login\
    \ account can access the DOS directory.\n\n- 1. Click the **K** button, select\
    \ **Utilities**, and choose **Terminal**.\n\n- 2. Go to the directory you want\
    \ to back up. Then type `cp <directory name> /mnt/dos`.\n\n- 3. The folder and\
    \ files are copied to the DOS partition. Go to `/mnt/dos` and type `ls` to view\
    \ the files on the DOS partition.\n\nPage 187\n\n## Task 5: Displaying Your Configuration\n\
    \n**Start Here** There are many ways to view your hardware and software configuration\
    \ with Linux.\n\nFor example, you might want to view devices connected to your\
    \ PC or device drivers installed with Linux. This task shows you how to use the\
    \ KDE Control Center and Caldera Open Administrative System (COAS) to view your\
    \ system configuration.\n\n**Custom Settings**\n\nYou can access individual settings\
    \ from the K button menu. Click the **K** button, select **Settings**, and then\
    \ choose any of the submenus to view or change your system configuration.\n\n\
    **COAS Settings**\n\nYou can access individual COAS settings from the K button\
    \ menu. Click the **K** button, select **COAS**, and then choose any of the menus\
    \ to access the setting you want to view or change.\n\n> **KDE Control Center**\
    \ > File Options Help\n> KDE Version: 1.1\n> User: root\n> Hostname: lisalee.flattishactory.com\n\
    > System: Linux\n> Release: 2.2.5\n> Version: #1 Sat Apr 3 21:49:22 MST 1999\n\
    > Machine: i686\n\n> Click the KDE Control Center icon on the KPanel bar.\n\n\
    > Click the + icon next to any icon, and then click on any icon, to view the system\
    \ settings for the selected icon.\n\n> Click the - icon to collapse a view in\
    \ the Control Center window.\n\n> Click the COAS icon in the KPanel bar, select\
    \ **System**, and then choose **Daemons**.\n\n- 5. View a list of active daemons\
    \ in the System services window.\n\n- 6. Click the COAS icon in the KPanel bar,\
    \ select **System**, and then choose **Resources**.\n\n- 7. Click **OK** at the\
    \ welcome window. View the list of configured resources for your system.\n\n-\
    \ 8. Right-click the window title bar and choose **Close** to shut down the configuration\
    \ window.\n\n## Task 6: Viewing Current Tasks\n\nEvery process, application, and\
    \ file you open in Linux can be viewed in the Task Manager window. If your system\
    \ performance appears to be slow, or if you want to kill a document window or\
    \ application, use the Task Manager window.\n\n> **WARNING**\n> Some tasks might\
    \ be dependent on other tasks running. If you kill a task that is dependent on\
    \ one or more other tasks, Linux might become unstable. Be sure to save any documents\
    \ or files before killing a task.\n\n- 1. Click the **K** button, select **System**,\
    \ and then choose **Task Manager**.\n2. Click the **Processes List** tab to view\
    \ some or all of the currently running processes.\n3. Click on a process, such\
    \ as Konsole, and then click **Kill task** to terminate a task. Click **Refresh\
    \ Now** to refresh the list of processes.\n4. Click the **Processes Tree** tab\
    \ to view running processes organized by file structure.\n5. Click the **Performance**\
    \ tab to view **CPU load history** and **Memory usage history**.\n6. Click **OK**\
    \ to save changes and exit the Task Manager window.\n\n## Viewing Information\n\
    \nYou can also use the task window to view general information about the tasks\
    \ that are running with Linux. For example, you can see how long a process has\
    \ been running, what percentage of the processor it's using, and whether a particular\
    \ process is active or sleeping.\n\n## Task 7: Adding Hardware\n\nCaldera's Linux\
    \ 2.2 release supports standard PC hardware such as an internal IDE hard disk\
    \ or CD-ROM drive. It also supports most PC keyboards and mice. You can use the\
    \ hardware configuration feature in the lisa application to change your keyboard,\
    \ mouse, hard disk, CD-ROM, printer, or video-related hardware settings.\n\n-\
    \ **Root Access**\n  If you do not have root access to Linux, you will not be\
    \ able to configure or add hardware. Log in as root to modify your hardware configuration.\n\
    \n- **Software Installers**\n  Most hardware devices include software drivers\
    \ that must be installed for the hardware to be recognized by Linux. Be sure to\
    \ run the software installation application for any additional hardware you attach\
    \ to your PC.\n\n- 1. Click the KDE Control Center icon in the KPanel menu bar.\n\
    2. Click **Information** and click **IO-Ports**. Review the list of devices attached\
    \ to your PC.\n3. Open a Terminal window and type **lisa**. Select **System Configuration**,\
    \ and then choose **Hardware Configuration**.\n4. Choose the hardware device configuration\
    \ you want to add to OpenLinux."
  mdcn: "\n ## 修改 fstab\n\n您可以修改位于 file:/etc/fstab 的 fstab 文件，以便使用 COAS 挂载您的 DOS 卷。在\
    \ fstab 文件中添加 `/dev/hda1 /mnt/dos/ dos msdos defaults 0 0`。单击 **K** 按钮，选择 **COAS**，选择\
    \ **System**，然后选择 **FileSystem**。单击 `/dev/hda`，然后单击 **Mount**。\n\n## 双处理器\n\n\
    双启动 PC 与双处理器 PC 不同。有关设置双处理器 PC 的更多信息，请参见第 7 部分，任务 5，\"配置附加处理器\"。\n\n- 5. 按 Enter\
    \ 键继续到下一页。选择 **The first IDE hard disk**。按 Enter 键。\n6. 选择 Windows 分区（在本例中为 **`/dev/hda1`**）。按\
    \ Enter 键。\n7. 按 Enter 键。选择 **`/boot/vmlinuz-2.2.5-modular`**，然后按 Enter 键。在接下来的屏幕中再按三次\
    \ Enter 键以保存配置。\n8. 输入 **reboot**。在 boot: 提示符下，按 Tab 键查看硬盘上的可引导分区。您应该看到 **dos**\
    \ 和 **linux**。输入 **linux** 以启动到 Linux。\n\n## 任务 4：在双启动 PC 上备份文件\n\n创建文件或文件夹备份的一种方法是将文件或文件夹复制到硬盘上的另一个分区。例如，如果您将文件和文件夹备份到您的\
    \ DOS 分区，而您的 Linux 分区发生了故障，您随时可以重新安装 Linux 并将文件复制回 Linux。\n\n当然，备份文件和文件夹的最佳方法是将文件和文件夹存储在单独的软盘、硬盘或计算机上。但是，如果您需要备份的安全性，同时又需要快速访问文件，那么使用\
    \ DOS 分区来存储您的 Linux 文件和文件夹是最佳选择。\n\n## 备份您的 DOS 分区\n\n如果您已经投资了基于 Windows 的备份系统，您可以使用它来备份您的\
    \ Windows 和 Linux 文件，但前提是您需要将 Linux 文件复制到 DOS 分区。\n\n- 1. 单击 COAS 按钮，选择 **System**，然后选择\
    \ **Filesystem**。\n2. 在欢迎对话框中单击 **OK**。\n3. 单击 **dev/hda**，然后单击 **Mount**。单击 **OK**。\n\
    \n**警告**\n\n在将文件从 Linux 分区复制到 DOS 分区之前，请务必确保 DOS 分区上有足够的可用空间。如果磁盘空间不足，您将无法成功备份文件。\n\
    \n## 命名备份文件夹\n\n如果您使用描述性名称来命名添加到备份存档中的文件夹，您可以更轻松地跟踪备份文件和文件夹。\n\n## 以 Root 身份登录预算\
    \ istics 报告\n\n您必须以 root 身份登录才能挂载 DOS 目录。挂载后，任何其他登录帐户都可以访问 DOS 目录。\n\n- 1. 单击\
    \ **K** 按钮，选择 **Utilities**，然后选择 **Terminal**。\n\n- 2. 转到您要备份的目录。然后键入 `cp <directory\
    \ name> /mnt/dos`。\n\n- 3. 文件夹和文件将被复制到 DOS 分区。转到 `/mnt/dos` 并键入 `ls` 以查看 DOS 分区上的文件。\n\
    \n第 187 页\n\n## 任务 5：显示您的配置\n\n**从这里开始** 在 Linux 中有多种方式可以查看您的硬件和软件配置。\n\n例如，您可能希望查看连接到\
    \ PC 的设备或 Linux 安装的设备驱动程序。本任务向您展示如何使用 KDE 控制中心 和 Caldera Open Administrative System\
    \ (COAS) 来查看您的系统配置。\n\n**自定义设置**\n\n您可以从 K 按钮菜单访问各个设置。单击 **K** 按钮，选择 **Settings**，然后选择任意子菜单以查看或更改您的系统配置。\n\
    \n**COAS 设置**\n\n您可以从 K 按钮菜单访问各个 COAS 设置。单击 **K** 按钮，选择 **COAS**，然后选择任意菜单以访问您要查看或更改的设置。\n\
    \n> **KDE 控制中心** > 文件 选项 帮助\n> KDE 版本：1.1\n> 用户：root\n> 主机名：lisalee.flattishactory.com\n\
    > 系统：Linux\n> 发行版：2.2.5\n> 版本：#1 Sat Apr 3 21:49:22 MST 1999\n> 机器：i686\n\n> 单击\
    \ KPanel 栏上的 KDE 控制中心图标。\n\n> 单击任意图标旁边的 + 图标，然后单击任意图标，以查看所选图标的系统设置。\n\n> 单击 -\
    \ 图标以折叠控制中心窗口中的视图。\n\n> 单击 KPanel 栏中的 COAS 图标，选择 **System**，然后选择 **Daemons**。\n\
    \n- 5. 在系统服务窗口中查看活动守护进程的列表。\n\n- 6. 单击 KPanel 栏中的 COAS 图标，选择 **System**，然后选择 **Resources**。\n\
    \n- 7. 在欢迎窗口中单击 **OK**。查看您系统上已配置资源的列表。\n\n- 8. 右键单击窗口标题栏并选择 **Close** 以关闭配置窗口。\n\
    \n## 任务 6：查看当前任务\n\n您在 Linux 中打开的每个进程、应用程序和文件都可以在任务管理器窗口中查看。如果您的系统性能似乎较慢，或者您想要终止文档窗口或应用程序，请使用任务管理器窗口。\n\
    \n> **警告**\n> 某些任务可能依赖于其他正在运行的任务。如果您终止依赖于一个或多个其他任务的任务，Linux 可能会变得不稳定。在终止任务之前，请务必保存任何文档或文件。\n\
    \n- 1. 单击 **K** 按钮，选择 **System**，然后选择 **Task Manager**。\n2. 单击 **Processes List**\
    \ 选项卡以查看部分或所有当前正在运行的进程。\n3. 单击一个进程，例如 Konsole，然后单击 **Kill task** 以终止任务。单击 **Refresh\
    \ Now** 以刷新进程列表。\n4. 单击 **Processes Tree** 选项卡以按文件结构查看正在运行的进程。\n5. 单击 **Performance**\
    \ 选项卡以查看 **CPU load history** 和 **Memory usage history**。\n6. 单击 **OK** 以保存更改并退出任务管理器窗口。\n\
    \n## 查看信息\n\n您还可以使用任务窗口来查看有关 Linux 中正在运行的任务的常规信息。例如，您可以查看进程已经运行了多长时间、它正在使用处理器的百分比，以及特定进程是活动的还是在休眠。\n\
    \n## 任务 7：添加硬件\n\nCaldera 的 Linux 2.2 版本支持标准 PC 硬件，例如内置 IDE 硬盘或 CD-ROM 驱动器。它还支持大多数\
    \ PC 键盘和鼠标。您可以使用 lisa 应用程序中的硬件配置功能来更改键盘、鼠标、硬盘、CD-ROM、打印机或与视频相关的硬件设置。\n\n- **Root\
    \ 访问权限**\n  如果您没有 Linux 的 root 访问权限，您将无法配置或添加硬件。以 root 身份登录以修改您的硬件配置。\n\n- **软件安装程序**\n\
    \  大多数硬件设备都包含软件驱动程序，必须安装这些驱动程序，Linux 才能识别硬件。请务必为连接到 PC 的任何附加硬件运行软件安装应用程序。\n\n\
    - 1. 单击 KPanel 菜单栏中的 KDE 控制中心图标。\n2. 单击 **Information** 并单击 **IO-Ports**。查看连接到\
    \ PC 的设备列表。\n3. 打开终端窗口并键入 **lisa**。选择 **System Configuration**，然后选择 **Hardware\
    \ Configuration**。\n4. 选择您要添加到 OpenLinux 的硬件设备配置。\n"
