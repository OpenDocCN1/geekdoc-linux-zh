  md: "# Task 5: Setting Up an Ethernet Connection\n\nOne of the fastest ways to connect\
    \ to the Internet is to be connected to a network that is already connected to\
    \ it. Most PC networks use 10BASE-T or 100BASE-T Ethernet cards and network connectors.\n\
