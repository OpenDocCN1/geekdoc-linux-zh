  mdcn: "\n点击该窗口的任务栏按钮。\n\n选中的任务栏项会在桌面上打开一个窗口。\n\n## 桌面菜单\n\n你可以通过右键单击窗口，将其从一个桌面移动到另一个桌面。然后选择“移至桌面”，并选择要将窗口移动到的目标桌面。\n\
