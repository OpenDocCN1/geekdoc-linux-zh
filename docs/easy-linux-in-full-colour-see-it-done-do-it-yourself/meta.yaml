    +   1. Click the up arrow to scroll up through the window. Click the down arrow
    to scroll down through the window.

    2. Click the left arrow to scroll left through a window. Click the right arrow
    to scroll right through the window.

    3. Drag the scroll thumb button to scroll up or down through the window.

    4. Click in the scrollbar gutter to page up, down, left, or right through the
    window.


    Window List

    Click the K button, select **Panel**, and choose **Add Window List** to add a
