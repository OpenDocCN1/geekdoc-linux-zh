    # # Task 4: Renaming a File or Folder


    ![](img/28e2bccabaf327178ce9997934f991d9_38_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_38_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_38_2.png)


