  md: '# Task 4: Using Personal Time Tracker


    If you like to measure the amount of time it takes for Linux to run a task, or
    if you need a simple tool to track billable hours for different projects, take
    a look at Personal Time Tracker.


    ![](img/28e2bccabaf327178ce9997934f991d9_169_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_169_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_169_2.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_169_3.png)


    # Sending Yourself Reminders


    You can use the at command to send yourself reminders. For example, to remind
    yourself of a meeting at 9:00, type at 9:00, then press Enter. Then type xmessage
    -display :0.0 "Time for the weekly meeting", and press Enter. Press Ctrl+D to
    save the reminder.


    # Deleting a Task


    To remove a task, select any task, click Task, and choose Delete, or press Ctrl+D.


    +   1. Click the K button, select **Utilities**, and then choose **Personal Time
    Tracker**.


    +   2. Click **Task** and choose **New**, or press Ctrl+N.


    +   3. Type a name for the task. Then click **OK**.


    +   4. The new task appears on the Personal Time Tracker window.'
  merge: -1
