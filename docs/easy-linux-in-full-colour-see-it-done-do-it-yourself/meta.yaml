  - '[PAGE 19]


    # Task 3: Logging In


    One of the features you will grow accustomed to is logging in to your PC. You
    can log in to the same computer with more than one account. The login process
    consists of entering a username and password. This task shows you how to log in
    to your computer with KDE as well as a Terminal window.


    # Account Access


    If you are the only person using the computer, you can create multiple accounts
    to help organize your work or make your work more efficient. The two login extremes
    are root and guest. Root has complete access to all files and folders in the system,
    and guest has the most limited access.


    # Starting KDE


    Your computer will always boot into KDE. If you choose to start up into console
    mode, type `startkde` to start the K development environment.


    ![](img/28e2bccabaf327178ce9997934f991d9_19_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_19_1.png)


    +   1. Power on your computer. Press Tab, and type **linux** to boot in to Linux.

    2. Click **Root**.

    3. Type the login name and password for the account.'
