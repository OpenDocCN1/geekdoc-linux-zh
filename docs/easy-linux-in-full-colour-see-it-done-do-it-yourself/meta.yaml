    \n+   - **Printing Help**\n  Click File and choose Print to print any help page\
    \ displayed in a window.\n\n- **More Help on the Internet**\n  For more information\
    \ about Caldera Linux, visit http://www.caldersystems.com.\n\n+   1. Click the\
    \ Home Directory button in the KPanel menu.\n2. Click **Help** and choose **Contents**,\
