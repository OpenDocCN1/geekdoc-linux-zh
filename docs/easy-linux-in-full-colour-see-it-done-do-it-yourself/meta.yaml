  md: "# Task 1: Taking Notes with KJots\n\nAs you surf the Internet or read through\
    \ man pages, you might want to store snippets of information in one, easy-to-access\
    \ document. KJots enables you to create a book of notes, similar to a notepad\
    \ of paper. You can type, edit, and delete text as well as choose a font for your\
    \ KJots notepad.\n\n![](img/28e2bccabaf327178ce9997934f991d9_165_0.png)\n\n![](img/28e2bccabaf327178ce9997934f991d9_165_1.png)\n\
    \n![](img/28e2bccabaf327178ce9997934f991d9_165_2.png)\n\n![](img/28e2bccabaf327178ce9997934f991d9_165_3.png)\n\
    \n+   - **The Book Menu**\n  Click the Book menu to view a list of current books\
    \ available on your hard disk. Click on a book to open it in KJots.\n- **Shortcuts**\n\
    \  Press Ctrl+N to create a new book. Press Ctrl+S to save the current book.\n\
    \n+   1. Click the **K** button, select **Utilities**, and then choose **KJots**.\n\
    2. Click **File** and choose **New Book**, and then type a name for your note.\n\
    3. Click **Edit** and choose **New Page** to add a page to your notepad.\n4. Click\
    \ **Options** and select **Config**. Click the **Fonts** tab and then **Select**\
    \ to choose a font for the current book."
  merge: -1
