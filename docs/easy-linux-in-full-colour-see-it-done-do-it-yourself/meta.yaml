  md: "# Task 3: Working with Fonts\n\nFonts work similarly in Linux and KDE to how\
    \ they work in Windows and Mac OS. Like Windows and Mac OS, Linux supports both\
    \ onscreen and printer-specific fonts. You can customize font settings in several\
    \ different areas of Linux, KDE, Terminal windows, and the X11 server.\n\n![](img/28e2bccabaf327178ce9997934f991d9_121_0.png)\n\
    \n![](img/28e2bccabaf327178ce9997934f991d9_121_1.png)\n\n![](img/28e2bccabaf327178ce9997934f991d9_121_2.png)\n\
    \n+   - **All Desktops Change**\n  When you make a change to the Display Settings\
    \ window, all virtual desktops are affected by any saved changes.\n- **Cancel\
    \ Button**\n  If you make changes to the KDE Display Settings window, but decide\
    \ you do not want to save any of your changes, click the Cancel button.\n\n+ \
    \  1. Open a terminal window by pressing Ctrl+T or by clicking the Home Directory\
    \ button in the KPanel bar. Click **File** and choose **Open Terminal**.\n2. Click\
    \ **Options** and choose **Font**, and then choose a font size. The default is\
    \ Medium.\n3. Click the **K** button and select **Settings**. Then click **Desktop**\
    \ and choose **Fonts**."
  merge: -1
