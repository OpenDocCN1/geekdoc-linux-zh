    \ for it and sometimes rewriting it, to get it installed.\n\nBut people who think\
    \ of themselves as \"Linux users\" are more likely to release a forked \"Linux-only\"\
    \ version of the GNU program, and consider the job done. We want each and every\
    \ GNU program to work \"out of the box\" on Linux-based systems; but if the users\
    \ do not help, that goal becomes much harder to achieve.\n\nSo how should the\
    \ GNU project respond? What should we do now to spread the idea that freedom for\
    \ computer users is important?\n\nWe should continue to talk about the freedom\
    \ to share and change software—and to teach other users to value these freedoms.\
    \ If we enjoy having a free operating system, it makes sense for us to think about\
