  md: '# Task 10: Performing Advanced Searches


    If you''ve ever searched for something on the Internet, you''ve probably seen
    a long list of items in which most items have absolutely nothing in common with
    the file or folder you''re looking for. Advanced searches help you focus a search
    on specific criteria of a file or folder.


    **Looking for Files**

    Locating files and folders can be easier if you use longer or more descriptive
    names for files and folders.


    **Locating and Access**

    You can locate files or folders you do not have access to open. For more information
    about configuring login accounts, see Part 7, Task 4, "Managing Users."


    **At Least/At Most**

    If you want to search for a range of file sizes, select At Least, At Most, or
    (none) from the pop-up menu, and type in a file size. Then click the Start Search
    button to begin the search.


    +   1. Click the **Advanced** tab in Find Files.

    2. Select a specific search criteria from the **Of type** drop-down list.

    3. Type one or two words you want to search for. Click the Start Search button.

    4. Review the items in the results window. Double-click an item to view it, or
    click the Properties button to view more information about an item.


    ![](img/28e2bccabaf327178ce9997934f991d9_44_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_44_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_44_2.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_44_3.png)'
  merge: -1
