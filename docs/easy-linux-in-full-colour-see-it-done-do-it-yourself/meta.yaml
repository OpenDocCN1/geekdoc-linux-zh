  md: "# Task 3: Working with KNotes\n\nKNotes is a different kind of note-taking\
    \ accessory. It has a simpler user interface than KJots, and also enables you\
    \ to choose a color for each note you want to save. KNotes works similarly to\
    \ paper sticky notes.\n\n+   - **Right-Click a Note**\n  Right-click any note\
    \ and choose Sticky and the note will appear on each KDE virtual desktop.\n  Right-click\
    \ a KNote, choose To Desktop, and choose a specific virtual desktop to send a\
    \ KNote to a particular desktop.\n\n- **Options**\n  To change the font, background\
    \ color, foreground color, or KNotes commands, right-click Operations and choose\
    \ Options, and then select the menu command you want to use.\n\n![](img/28e2bccabaf327178ce9997934f991d9_167_0.png)\n\
