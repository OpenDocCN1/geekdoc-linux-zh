    ![](img/28e2bccabaf327178ce9997934f991d9_22_2.png)


    When a window is open, there are many ways it can remain open but hidden. For
    example, you can hide an open window in the taskbar by clicking the Minimize button.
    A button is displayed on the taskbar for the open window, but the window is not
    displayed on the desktop.


    +   1. Click the Minimize button in the window you want to minimize.

    2. The window disappears from the desktop, and a button for the window remains
    on the taskbar. Click the taskbar button to restore the minimized window.

    3. Click the Maximize button to grow the window to fill the screen. Click the
    Maximize button once more to restore the window to its previous size.


    **Collapsing and Uncollapsing**


    You can collapse a window by double-clicking in the window''s title bar. Only
    the title bar is viewable when you collapse a window灰意 window by double-clicking
    once more in the title bar area.'
