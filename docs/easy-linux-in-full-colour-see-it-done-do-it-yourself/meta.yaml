  - '[PAGE 195]


    # Task 4: Backing Up Files on a Dual-Boot PC


    One way to create a backup of files or folders is to copy them to another partition
    on your hard disk. For example, if you back up your files and folders to your
    DOS partition and something happens to your Linux partition, you can always re-install
    Linux and copy your files back to Linux.


    Of course, the best way to back up files and folders is to store them on a separate
    floppy disk, hard disk, or computer. However, if you need the security of a backup,
    along with quick access to files, you can''t beat using a DOS partition to store
    your Linux files and folders.


    # Backing Up Your DOS Partition


    If you have already invested in a Windows-based backup system, you can use it
    to back up both your Windows and Linux files after you''ve copied your Linux files
    to the DOS partition.


    +   1. Click the COAS button, select **System**, and then choose **Filesystem**.

    2. Click **OK** at the welcome dialog.

    3. Click **dev/hda**, and then click **Mount**. Click **OK**.


    ![](img/28e2bccabaf327178ce9997934f991d9_195_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_195_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_195_2.png)'
