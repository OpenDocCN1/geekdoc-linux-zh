- md: ' ## Task 1: Starting an Application from the K Menu


    Most of the time you spend using your computer will be with an application, also
    referred to as a program. You can start an application in any number of ways,
    including from the K menu. The K menu contains all the Linux applications installed
    by the Lizard Installer Wizard.


    - **Closing the K Menu**


    To close the K menu without choosing an item, simply click outside the menu.


    - **Using the Terminal Window**


    You can also start an application from a Terminal window by clicking File and
    choosing Run. Type the filename of the application, such as xwp, and then click
    OK to start the application.


    1. Click the **K** button.

    2. Move your cursor to the **Applications** menu command (or any other menu command
    with a submenu).

    3. Click the program group that contains the application you want to start (in
    this case, **WordPerfect**).

    4. The application starts in its own window.


    ## Task 2: Starting an Application from a Shortcut Icon


    If you frequently use a certain application or document, you might want to be
    able to access it from the Desktop. To do so, you can set up a shortcut icon (covered
    in Part 7, "Setting Up Applications"), and then start the application or document
    by double-clicking its icon.


    ## Double-Click Help


    If nothing happens when you double-click the icon, or if the icon moves, it might
    be because you haven''t clicked quickly enough or because you clicked and dragged
    by accident. Be sure to press the mouse button twice quickly.


    1. Double-click the shortcut icon on the desktop (in this case, a shortcut to
    WordPerfect).

    2. The application starts and is displayed in its own window.


    ## Task 3: Switching Between Applications


    Although it is possible to create, edit, and view any document with emacs or vi
    in Linux, you most likely will work with more than one type of document in KDE.
    For example, you might want to compare some software prices from a spreadsheet
    with information on a Web site. Switching between applications enables you to
    share and compare data.


    - **More Than One Desktop**


    Unlike Windows or Mac OS, you can have anywhere from two to eight desktops in
    Linux. This enables you to run several different sets of tasks without cluttering
    your desktop.


    - **Using the Taskbar**


    You can tell which programs are open by looking at the taskbar. Each open program
    is represented by a button that shows the application''s icon and path.


    1. Start two applications and look at the taskbar. You should see a button for
    each application. In this case, the **StarOffice** button is selected.

    2. Click the button for the program you want to switch to (in this case, Netscape
    Communicator).

    3. Netscape Communicator becomes the active application.


    ## Task 4: Closing an Application


    When you finish working with an application, close it. Too many open applications
    can slow down overall software performance for saving, opening, or printing documents.
    Having too many open applications can also clutter the taskbar.


    Click **File**, and then choose the **Exit** command.


    The application is closed. Notice that the taskbar button for Navigator has disappeared.


    # WARNING


    StarOffice is not included with the CD-ROM included with this book. It is available
    from Star Division for a nominal fee at http://www.stardivision.com.


    # WARNING


    Be sure to save any open documents before exiting an application.


    # Shortcuts


    You can also press Alt+F4 or click the Close button in the application''s title
    bar to close an application.


    ## Task 5: Saving a Document


    You save documents and files so that you can refer to them later for editing,
    printing, viewing onscreen, and so on. The first time you save a file, you must
    assign that file a name and location on your hard disk.


    # WARNING


    You cannot save a document to a folder you do not have permissions to write to.


    # The Save As Command


    To save a file with a different name or location, use the **Save As** command
    and enter a different filename or folder.


    # Redirecting via the Command Line


    You can redirect text from a command-line window or Terminal window to a file
    by using `command > filename`.


    1. Click **File**, and then choose the **Save As** command.

    2. Type a name for the file, and choose a file type in the pull-down menu.

    3. To save the file in another folder, click the Up One Level button, or click
    on a folder in the navigation window. Then click the **Save** button.

    4. The application saves the file and returns to the document window. The document
    name is listed in the title bar.


    ## Task 6: Opening a Document


    The purpose of saving a document is to make it available for later use. You can
    open any document you have saved by double-clicking the document''s icon or by
    selecting File and choosing the Open Location command.


    # Locating Your Document


    If you can''t find the file you want to work with, it could be because you did
    not save it where you thought you did. Try looking in a different drive or folder.
    If you still can''t find it, try searching for the file (for more information
    about searching for files, see Part 2, "Working with Disks, Folders, and Files").


    # Double-Clicking to Open a File


    The fastest way to open a file is to double-click the document''s icon.


    # Command Line


    You can view any document in a Terminal window by using the more, less, or cat
    commands plus the filename.


    1. Click **File**, and then choose the **Open Location** command.

    2. Type the pathname to the file you want to open. Then click **OK**.

    3. The file is opened.


    ## Task 7: Creating a New Document


    When you want to start from square one, you can create a new document. For most
    applications, you simply select File, New or choose a template. A template is
    a predesigned document.


    - **Saving New Files**


    New documents are not saved. Be sure to click File and then Save to save the document
    before you exit the application.


    - **Splitting Documents**


    If you feel comfortable creating or modifying documents in a Terminal window,
    you can split files using the split command. Type **man split** for more information
    about this command.


    1. Click **File**, and then click the **New** command.


    2. A new document is displayed.


    ## Task 8: Closing a Document


    1. Click the Close button.

    2. The document is closed but the program remains open. To create a new document,
    click a new document shortcut; click **File**, **New**; or open an existing document.


    When you save a document, it remains open so that you can continue working. If
    you want to close the document, simply click the Close button on the document
    window. You should close documents that you are no longer using in order to reduce
    desktop clutter and free up memory.


    # More Than One Close Button?


    If you click the Close button on the application window, you can exit the application.
    Be sure to use the Close button for the document window if you want to remain
    in the application and only close the document window.


    # Ctrl+F4 and the Close Command


    You can press Ctrl+F4 to close the document window in most applications, or click
    File and select the Close command.'
