    You can move the original file or folder to a new location on the hard disk, and
    the shortcut will continue to work.


    # ✓ Shortcuts and Windows


    You can also drag a file to another window. Click **Link** to create a shortcut
    in a folder window.


    # ✓ Alias of an Alias


    A shortcut can also be called an alias, a link, or a symbolic link.


