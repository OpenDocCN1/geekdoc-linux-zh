    \n- **使用任务栏**\n\n您可以通过查看任务栏来了解哪些程序处于打开状态。每个打开的程序都有一个按钮，显示应用程序的图标和路径。\n\n1. 启动两个应用程序并查看任务栏。您应该看到每个应用程序都有一个按钮。在这种情况下，**StarOffice**\
    \ 按钮被选中。\n2. 单击要切换到的程序的按钮（在本例中为 Netscape Communicator）。\n3. Netscape Communicator\
    \ 成为活动应用程序。\n\n## 任务 4：关闭应用程序\n\n完成应用程序的使用后，请将其关闭。打开过多的应用程序会降低保存、打开或打印文档时的整体软件性能。打开过多的应用程序也会使任务栏变得杂乱。\n\
    \n单击 **File**，然后选择 **Exit** 命令。\n\n应用程序被关闭。请注意，Navigator 的任务栏按钮已经消失。\n\n# 警告\n\
    \nStarOffice 不包含在本书附带的 CD-ROM 中。它可以从 Star Division 以象征性费用获取，网址为 http://www.stardivision.com。\n\
    \n# 警告\n\n在退出应用程序之前，请务必保存所有打开的文档。\n\n# 快捷方式\n\n您也可以按 **Alt+F4** 或单击应用程序标题栏中的**关闭**按钮来关闭应用程序。\n\
    \n## 任务 5：保存文档\n\n您保存文档和文件，以便日后编辑、打印、屏幕查看等。第一次保存文件时，必须为文件指定名称和硬盘上的位置。\n\n# 警告\n\
    \n您不能将文档保存到没有写入权限的文件夹中。\n\n# 另存为命令\n\n要使用不同的名称或位置保存文件，请使用 **Save As** 命令并输入不同的文件名或文件夹。\n\
    \n# 通过命令行重定向\n\n您可以使用 `command > filename` 将命令行窗口或终端窗口中的文本重定向到文件。\n\n1. 单击 **File**，然后选择\
    \ **Save As** 命令。\n2. 输入文件名称，并在下拉菜单中选择文件类型。\n3. 要将文件保存在另一个文件夹中，请单击**上一级**按钮，或在导航窗口中单击某个文件夹。然后单击\
    \ **Save** 按钮。\n4. 应用程序保存文件并返回文档窗口。文档名称显示在标题栏中。\n\n## 任务 6：打开文档\n\n保存文档的目的是为了以后使用。您可以通过双击文档的图标或选择\
    \ **File** 并选择 **Open Location** 命令来打开任何已保存的文档。\n\n# 查找您的文档\n\n如果找不到要处理的文件，可能是因为您没有保存在您认为的位置。尝试在其他驱动器或文件夹中查找。如果仍然找不到，请尝试搜索文件（有关搜索文件的更多信息，请参阅第\
    \ 2 部分\"使用磁盘、文件夹和文件\"）。\n\n# 双击打开文件\n\n打开文件最快的方法是双击文档的图标。\n\n# 命令行\n\n您可以使用 more、less\
    \ 或 cat 命令加上文件名，在终端窗口中查看任何文档。\n\n1. 单击 **File**，然后选择 **Open Location** 命令。\n2.\
    \ 输入要打开的文件的路径名。然后单击 **OK**。\n3. 文件被打开。\n\n## 任务 7：创建新文档\n\n当您想从头开始时，可以创建新文档。对于大多数应用程序，您只需选择\
    \ **File**、**New** 或选择一个模板。模板是预先设计好的文档。\n\n- **保存新文件**\n\n新文档不会自动保存。请务必在退出应用程序之前单击\
    \ **File**，然后 **Save** 以保存文档。\n\n- **拆分文档**\n\n如果您对在终端窗口中创建或修改文档感到满意，可以使用 split\
    \ 命令拆分文件。输入 **man split** 以获取有关此命令的更多信息。\n\n1. 单击 **File**，然后单击 **New** 命令。\n\n\
    2. 显示一个新文档。\n\n## 任务 8：关闭文档\n\n1. 单击**关闭**按钮。\n2. 文档被关闭，但程序保持打开状态。要创建新文档，请单击新文档快捷方式；单击\
    \ **File**、**New**；或打开现有文档。\n\n保存文档时，它会保持打开状态，以便您可以继续工作。如果要关闭文档，只需单击文档窗口上的**关闭**按钮。您应该关闭不再使用的文档，以减少桌面混乱并释放内存。\n\
    \n# 不止一个关闭按钮？\n\n如果单击应用程序窗口上的**关闭**按钮，您可以退出应用程序。如果要保持在应用程序中且仅关闭文档窗口，请务必使用文档窗口的**关闭**按钮。\n\
    \n# Ctrl+F4 和关闭命令\n\n您可以按 **Ctrl+F4** 关闭大多数应用程序中的文档窗口，或者单击 **File** 并选择 **Close**\
    \ 命令。\n"
