    ## DNS


    **DNS** 域名服务器。用于将互联网上的计算机名称转换为数字地址（如 IP 地址）。


    **文档窗口** 在应用程序中打开的窗口。文档窗口包含你在该应用程序中处理的任何内容。


    **DOS** 磁盘操作系统。一种最常与 Windows 一起使用的操作系统。


    **双击** 快速连续两次按下并释放鼠标左键。


    **dpi** 每英寸点数。


    **拖动** 按下并按住鼠标左键，然后移动鼠标。


    **拖放** 一种可用于运行命令或移动物品的技术。使用鼠标将文件或文件夹拖动到文档窗口或桌面，然后将其放置到那里，以添加或将其转换为与应用程序兼容的格式。


    **DVD 驱动器** DVD 代表*数字多功能光盘*。DVD 驱动器类似于 CD-ROM 驱动器，但能够存储多达 15GB 的数据。另见 *CD-ROM
    驱动器*。


    **emacs** 使用宏进行编辑。一种随 OpenLinux 安装的文本编辑器。


    **电子邮件** *电子信函*的简称。电子邮件是一种在网络以及互联网上进行通信的工具。电子邮件应用程序使其用户能够相互交换消息。


    **以太网** 一种常用于在两台或多台计算机之间传输数据的网络协议。OpenLinux 可与特定的 10BASE-T 或 100BASE-T 以太网卡配合使用。访问
    Caldera 的网站获取兼容网卡的完整列表。


    **收藏夹** Web 浏览器使用的术语，表示经常访问的网站或存储在"收藏夹"文件夹中的网站。Netscape Communicator 使用*书签*一词而非收藏夹。


    **文件** 存储在硬盘上的有组织的信息单元。


    **文件系统** 用于创建、跟踪和修改存储在硬盘上的文件和文件夹的技术。OpenLinux 使用 ext2 文件系统格式。它还可以挂载来自软盘上或作为硬盘上单独分区的
    DOS 文件系统。


    **finger** 用于查找用户信息的应用程序。


    **软盘** 一种便携式存储介质，由受塑料外壳保护的柔性磁盘组成。软盘有多种尺寸和容量可供选择。


    **文件夹** 硬盘上的一个存储位置，用于将相关文件放在一起。


    **字体** 特定字样、字型和大小的字符集。


    **格式栏** 一系列文本框和按钮，使您能够设置文档中字符的格式。格式栏通常出现在工具栏下方。


    **格式化** 设置磁盘的过程，以便驱动器能够读取其信息并向其写入信息（不要与字符格式化混淆）。


    **碎片化** 当单个文件被切碎并存储在硬盘周围分散的独立块中时。您可以通过从终端窗口运行 fsck 应用程序来修复此问题。


    **ftp** 文件传输协议或文件传输程序。互联网上常用的一种协议，用于在连接的系​​统之间传输文件。


    ## 千兆字节


    1,024 兆字节。口语中称为 gig，书面缩写为 GB。另见字节、千字节和兆字节。


    ## grep


    用于搜索文件模式的工具。


    ## GUI


    图形用户界面。


    ## 硬盘


    PC 内部的主要存储区域。


    ## 主页


    启动浏览器时加载的第一个页面，或网站的首页。


    ## 悬停


    将鼠标指针放在对象上几秒钟。例如，如果您开启了"帮助提示"，对于大多数 Finder 项目（如图标和窗口控件），帮助提示气球将会出现。


    ## HTML


    超文本标记语言。这是用于创建网页的语言。


    ## 超链接


    网页上指向该文档中其他位置或不同文档的突出显示的文本或图形。


    ## 图标


    KDE 用于表示应用程序、文件夹和文件的小图片。


    ## 增量备份


    仅备份自上次完整备份以来在当前备份作业中已更改的文件。


    ## 红外端口


    一种通信端口，通常出现在笔记本电脑和某些打印机上。红外端口使两个设备能够使用红外光而不是电缆进行通信。


    ## 插入点光标


    您在文本框或文字处理应用程序（如 SimpleText）中看到的闪烁竖线。它指示您键入的下一个字符将出现的位置。


    ## 互联网


    一个扩展到全球的网络之网络。您可以通过与互联网服务提供商（ISP）建立账户来访问此网络。


    ## 内联网


    将互联网技术用于企业内部组织内部，而非连接到整个互联网。


    ## IRC


    互联网中继聊天。互联网上常用的基于服务器的聊天应用程序。互联网上有许多基于 IRC 的聊天室。


    ## ISP


    互联网服务提供商。通常是一家企业，如 AT&T 或 Earthlink，使人们能够连接到互联网。


    ## Java


    一种互联网技术，使一个应用程序能够为各种计算机平台创建。


    ## Kbps


    每秒一千位（bps）。当今的现代调制解调器以 28.8Kbps 或 56Kbps 的速度传输数据。


    ## KDE


    代表 K 开发环境的缩写。它是与 OpenLinux 一起运行的窗口环境。


    ## 内核


    操作系统的核心组件。内核管理操作系统的核心任务，如设备输入和输出、内存分配、安全性和用户访问。Linux 是 Caldera Linux 发行版的内核。


    ## 千字节


    1,024 字节。通常缩写为 K 或 KB。另见兆字节和千兆字节。


    ## Korn


    提供广泛脚本支持的 shell 环境。它接受为 Bourne shell 编写的脚本，并支持命令行编辑等功能。Linux 版本 pdksh 随 OpenLinux
    一起提供。


    ## 局域网


    **LAN** 参见 *局域网*。


    **链接** 参见 *超链接*。


    **列表框** 显示项目列表（如文件名或指令）的小窗口。


    **局域网** 所有计算机占据相对较小地理区域的网络，如部门、办公室、住宅或建筑物。所有计算机之间的连接都通过网络电缆进行，而非通过调制解调器或其他硬件设备进行。


    **登录** 通过输入有效的用户名和密码连接到互联网或网络。


    **注销** 断开与互联网或网络的连接。


    **最大化** 将窗口增大到其最大形式。最大化的应用程序窗口填满整个屏幕，但任务栏除外。最大化的文档窗口填满整个应用程序窗口。


    **Mbps** 每秒一百万位（bps）。


    **兆字节** 1,024 千字节，或 1,048,576 字节。书面常缩写为 *M* 或 *MB*，口语中常称为 *meg*。另见 *千兆字节*。


    **菜单栏** KDE 窗口顶部的栏。菜单栏包含下拉菜单，使您能够执行命令。


    **最小化** 缩小窗口的大小。


    **调制解调器** 一种使两台计算机能够通过电话线交换数据的电子设备。


    **多任务处理** 同时运行多个程序的能力。


    **网络** 通过特殊电缆或其他网络硬件（如调制解调器或红外端口）连接的计算机集合，用于共享文件、文件夹、磁盘、外围设备和应用程序。另见 *局域网*。


    **新闻组** 一个专注于单一主题的互联网讨论组。这些讨论通过向该组发布消息来进行。


    **插件** 一种常用于软件应用程序的软件组件。具体用于互联网浏览器以增加功能，如播放 RealAudio 文件的能力。


    **指向** 放置鼠标指针，使其停留在特定的屏幕位置。


    **弹出窗口** 位于桌面底部的 Finder 窗口。


    **端口** 插入鼠标或打印机等设备电缆的连接口。


    **程序文件** 运行程序的文件。另见 *数据文件*。


    **下拉菜单** 从应用程序的菜单栏打开的隐藏菜单，用于访问应用程序的命令和功能。


    **单选按钮** 对话框选项，显示为小圆圈，通常两个或更多为一组。


    **RAM** 随机存取存储器的缩写。PC 中 OpenLinux 用于运行应用程序的内存。


    **RAM 磁盘** 用作桌面硬盘的一定数量的内存。您可以在 RAM 磁盘上运行应用程序或存储文件。


    **重复速率** 初始延迟后，按住某个键时字符出现的速率。


    **分辨率** 桌面的每英寸点数；例如，800×600。

