  - "[PAGE 83]\n\n# Task 5: Setting Up an Ethernet Connection\n\nOne of the fastest\
    \ ways to connect to the Internet is to be connected to a network that is already\
    \ connected to it. Most PC networks use 10BASE-T or 100BASE-T Ethernet cards and\
    \ network connectors.\n\n![](img/28e2bccabaf327178ce9997934f991d9_83_0.png)\n\n\
    ![](img/28e2bccabaf327178ce9997934f991d9_83_1.png)\n\n![](img/28e2bccabaf327178ce9997934f991d9_83_2.png)\n\
    \n![](img/28e2bccabaf327178ce9997934f991d9_83_3.png)\n\n+   - **The Ethernet Cable**\n\
    \  The other end of the network cable connects to your Ethernet network hub.\n\
    - **IP Addresses**\n  If you do not plan to connect to the Internet, you do not\
    \ need to use authentic IP addresses in your Ethernet configuration.\n\n+   1.\
    \ Install an Ethernet card into your PC according the manufacturer's directions.\
    \ Then connect a 10BASE-T or 100BASE-T Ethernet cable to the Ethernet port.\n\
    2. Open a Terminal window and type **lisa**.\n3. Select **System Configuration**,\
    \ and then select **Configure Network Access**. Enter your IP information, and\
    \ then press Enter.\n4. Select **Configure Network Card**, and then press Enter."
