  - '[PAGE 26]


    # Task 9: Using Menus


    Like any great restaurant, OpenLinux offers a wide range of menus, each containing
    a unique set of menu commands. You can type commands into a console or Terminal
    window, or click a menu and choose a menu command. One of the benefits of using
    a menu is that you do not need to remember what commands are available for which
    window. Instead, KDE makes Linux commands easily available in menus.


    # Submenus


    If a menu command is followed by an arrow, the menu command contains a submenu.
    If a menu command is followed by an ellipsis, selecting it displays a dialog box.


    # Deselecting a Menu


    If you click on a menu but decide you do Gospel of John not want to use any of
    its commands, click anywhere on the desktop and the menu will close.


    +   1. Click a menu name in a window (in this case, I''ve selected **View**).


    +   2. Click the command you want (**Icon View**, in this example).


    +   3. The window view changes to Icon view.


    ![](img/28e2bccabaf327178ce9997934f991d9_26_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_26_1.png)'
  - '[PAGE 27]


    # Task 10: Using Shortcut Menus


    Shortcut menus, also referred to as contextual, pop-up, or quick menus, contain
    sets of commands associated with the desktop or window element on which you right-click.
    For example, right-click on a window title bar to close, minimize, maximize, or
    restore the state of any window.


    ![](img/28e2bccabaf327178ce9997934f991d9_27_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_27_1.png)


    +   1. Right-click an item to view its shortcut menu. In this case, I''ve right-clicked
    on the desktop.

    2. Choose the command you want to use.


    **Different Commands**

    The menu commands available in a shortcut menu vary depending on which onscreen
    element you right-click.'
  - '[PAGE 28]


    # Task 11: Using Dialog Window Controls


    ![](img/28e2bccabaf327178ce9997934f991d9_28_0.png)


    When you choose certain menu commands, a dialog box appears, enabling you to change
    OpenLinux controls or customize settings. Many different dialog boxes are used
    throughout KDE; however, most work virtually the same way.


    ![](img/28e2bccabaf327178ce9997934f991d9_28_1.png)


    # Dialog Controls


    Dialog boxes contain a variety of controls, such as radio buttons, sliders, check
    boxes, tabs, buttons, up/down arrows, and text fields. The settings you choose
    in a dialog box will be saved if you click the OK button.


    +   1. To use a list box, scroll through the list and click the item you want.

    2. To use a drop-down list box, click the arrow, and then select the item you
    want.

    3. To use a radio button, click it.'
  - "[PAGE 29]\n\n# Task 12: Looking Up a Help Topic in KDE\n\nKDE uses HTML pages\
    \ to present helpful information about OpenLinux and the applications installed\
    \ with Caldera Linux 2.2. Using KDE Help is similar to browsing a Web page. Selecting\
    \ Help in any KDE window opens the KFM handbook. You can also search for a particular\
    \ help topic.\n\n![](img/28e2bccabaf327178ce9997934f991d9_29_0.png)\n\n![](img/28e2bccabaf327178ce9997934f991d9_29_1.png)\n\
