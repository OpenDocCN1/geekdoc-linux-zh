    disk from a Windows-based PC by inserting the CD-ROM from this book, and then
    selecting the option to create a bootable floppy.


    # Booting from the CD


    Press **Tab** after the PC first starts up with the CD included with this book.
    Type **boot** to start the PC with the CD. Type **install** to run the Linux Lizard
    installer application.


    # Configuring a Dual-Boot PC


    For more information about configuring a dual-boot PC, see Part 9, Task 3, "Configuring
    a Dual-Boot PC."


    # Blank Screen?


    If you see a blank screen during the installation process, Lizard probably failed
    to continue the Linux installation. Try installing from the bootable floppy disk
    or start the installation over from step 1.


