    ![](img/28e2bccabaf327178ce9997934f991d9_180_2.png)


    +   4. Click the K button, choose Utilities, and click Terminal.

    5. Go to a directory with a QuickTime file. In this case it''s /root/Desktop/Sample.mov.
    Type xanim sample.mov.

    6. Watch the QuickTime movie play. Click Stop to stop the movie, or click Play
    to start the movie.


    # Why Does the Movie Look Bad?


    You might need to set the color depth for your monitor to thousands of colors
    to improve the playback appearance of a movie file.


    To change the resolution, log out of KDE, click Shutdown, and then choose console
    mode. Type kde --bpp 16 to change the color depth to thousands of colors. You
    can also try -bpp 24 or -bpp 32 to increase the number of colors you can view
    on your screen.'
