  md: '# # Introduction to Easy Linux


    Linux is one of the most popular operating systems available for PCs today. It
    was created by Linus Torvald, working with many developers around the world who
    volunteered their time to add features to the OpenLinux source code base. OpenLinux
    is part of the Caldera 2.2 release of Linux included on the CD-ROM at the back
    of this book. Not only is Linux affordable and easily accessible from the World
    Wide Web, it also has many attractive features, fast performance, and takes up
    a relatively small amount of memory. Because OpenLinux is an open-source product,
    many other releases of Linux are available in addition to the Caldera 2.2 release.
    Much of the information included in this book can be applied to the general Linux
    release, especially if it uses the K development environment as the user interface
    for Linux.


    *Easy Linux* provides concise, visual, step-by-step instructions explaining how
    to use some of the most basic, compelling features in the Caldera 2.2 Linux release,
    which is included on the CD-ROM with this book. You won''t have to read through奶牛
    through paragraphs of explanations to learn how to get Linux installed, use the
    KDE user interface to connect to the Internet, send email, print, or use a Terminal
    window or word processing application. If you have never used a computer before,
    you might find that many of the tasks in this book require a little more in-depth
    knowledge about how a PC or software works.


    A small word of caution to those new to Linux: It is an open-source product, so
    if a feature doesn''t work the way it is presented in this book, you might need
    to log out and log back in to your account, restart the computer, or repeat a
    task a second time if it doesn''t work the first time.


    *Easy Linux* does not cover many advanced topics of Linux or the technical inner
    workings of Linux, such as application programming interfaces. If you want to
    learn how to develop applications for Linux, or how to add or customize source
    code for Linux, visit **http://www.linux.org**.


    ![](img/28e2bccabaf327178ce9997934f991d9_9_0.png)'
  merge: -1
