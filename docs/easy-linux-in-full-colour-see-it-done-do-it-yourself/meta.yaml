  md: '# Task 11: Capturing a Screen


    One way to create an image file is to take a screenshot of your desktop. KSnapshot
    is one of the applications installed with Linux that lets you capture a KDE desktop
    and save it as a GIF file. This task shows you how to create a screenshot with
    KSnapshot.


    ![](img/28e2bccabaf327178ce9997934f991d9_57_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_57_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_57_2.png)


    # Chunky Images?


    You might need to change the color depth settings in your X11 server if your graphics
    images look blocky or have incorrect coloring. Open a Terminal window and type
    `kde -- bpp 16` to change your color depth to thousands of colors.


    # xwd and Screen Capture


    Open a Terminal window and type `xwd -in capture.xwd`, and then press the Enter
    key to capture a screen using a command line.


    +   1. Click the **K** button, choose **Graphics**, and then select **Snapshot**.

    2. Type a number in the **seconds** field (in this case, I''ve typed **2**).

    3. Click **Grab**.'
