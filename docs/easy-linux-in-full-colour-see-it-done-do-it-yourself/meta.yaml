    KDE user interface to connect to the Internet, send email, print, or use a Terminal
    window or word processing application. If you have never used a computer before,
    you might find that many of the tasks in this book require a little more in-depth
    knowledge about how a PC or software works.


    A small word of caution to those new to Linux: It is an open-source product, so
    if a feature doesn''t work the way it is presented in this book, you might need
    to log out and log back in to your account, restart the computer, or repeat a
    task a second time if it doesn''t work the first time.


    *Easy Linux* does not cover many advanced topics of Linux or the technical inner
    workings of Linux, such as application programming interfaces. If you want to
    learn how to develop applications for Linux, or how to add or customize source
    code for Linux, visit **http://www.linux.org**.


    ![](img/28e2bccabaf327178ce9997934f991d9_9_0.png)'
