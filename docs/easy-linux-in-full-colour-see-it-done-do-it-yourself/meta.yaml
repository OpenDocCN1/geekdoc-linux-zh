    # # Task 5: Configuring Additional Processors


    As a default, Linux is configured to work on a single-processor PC. If you have
    a PC with two or more processors, you must modify the makefile and recompile the
    sources for the kernel to take advantage of shared multiple processors (SMP).


    **WARNING**


    To configure OpenLinux to work with multiple processors, you must recompile some
    of the source code (more specifically, the kernel source code) in OpenLinux. If
