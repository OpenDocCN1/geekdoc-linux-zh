  md: '# # Personalizing KDE


    You can optimize your productivity by customizing the K development environment
    (KDE). You can move or hide the taskbar as well as move the KPanel buttons. You
    can also adjust the colors used for onscreen elements such as window title bars.
    You can change the mouse settings, your desktop picture, screensaver, and more.
    Caldera Linux 2.2 includes many options for setting up your desktop just the way
    you want. This part shows you how to customize KDE.'
  merge: -1
