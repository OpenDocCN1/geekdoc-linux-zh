  md: '# # Printing


    Whether you''re printing from a console window or from an application, all Linux
    applications use the same setup for your printer. You can use Lisa to configure
    your printer port, and then run the KDE Wizard to create a desktop printer icon.
    You can use Linux to manage printing for all your applications.


    In general, you print a document from the application in which the document was
    created. When you send a file to the printer, the file is translated from an onscreen
    image to a printable image. Then it goes to a print queue, or holding area. The
    print queue can contain one or several files at any time, and you can make changes
    to the print queue as documents are printing. This part shows you how to control
    and manage printing in KDE.'
  merge: -1
