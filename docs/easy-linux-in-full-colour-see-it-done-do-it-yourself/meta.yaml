  md: '# Task 15: Moving Data Between Applications


    You can move text or graphics data from one application to another. For example,
    you can cut an icon image from a graphics file and add it to a text document.
    You can even cut and copy numbers from spreadsheets, for example, to insert into
    presentations and documents.


