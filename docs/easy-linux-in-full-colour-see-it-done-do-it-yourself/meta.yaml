- md: "## Task 9: Configuring Your Keyboard\n\nOne of the basic skills you need to\
    \ work with data is knowing how to select what you want to work on. After you\
    \ select the text you want, you can delete it, copy it, change its appearance,\
    \ and so on.\n\n-   **Default Keyboard Setting**\n    You probably selected the\
    \ 101-key keyboard. You can also select 104- and 105-key keyboards. If you're\
    \ not sure what kind of keyboard you have, check the documentation, or simply\
    \ choose the default 101-key keyboard.\n\n-   **Changing Keyboards with Lisa**\n\
    \    If you decide to connect a different keyboard to your PC, go to a command-line\
    \ window and type lisa. Select **System Configuration**, and then choose **Hardware\
    \ Configuration**. Select the type of keyboard you want to use. Then press the\
    \ Escape key until you return to the command-line prompt.\n\n1.  Click the **K**\
    \ button and choose **KDE Control Center**.\n2.  Select **Input Devices** and\
    \ choose **Keyboard**.\n3.  Move the slider to adjust the **Key click volume**,\
    \ or click **On** or **Off** to set the **Keyboard repeat** rate.\n\n## Task 10:\
    \ Changing the X11 Server\n\nThe X11 server enables Linux to work with your graphics\
    \ card and monitor and allows KDE to show you a desktop with a specific resolution.\
    \ You configured these settings when you installed Caldera Linux 2.2 using the\
    \ Lizard application. You can also use the Lisa application to change the resolution,\
    \ and the graphics card or monitor settings.\n\n### Changing X11 Servers with\
    \ Lisa\n\nYou can install additional X11 servers with the Lisa application. In\
    \ a command-line window, type lisa, and then select Software Package Administration.\
    \ Use the up- and down-arrow keys to select Installation of additional software\
    \ packages. Then insert the CD-ROM from this book and install any additional X11\
    \ software packages onto your hard disk.\n\n1.  Click the **K** button and choose\
    \ **Utilities**, and then select **Terminal**.\n2.  Type **lisa** in the Terminal\
    \ window. Then press Enter on your keyboard.\n3.  Press **3** to select **System\
    \ Configuration**, and then press Enter.\n4.  Press **1** to select **Hardware\
    \ Configuration**, and then press Enter.\n\n**WARNING**\n\nBe sure to have your\
    \ graphic card and monitor information nearby. It is possible to deactivate your\
    \ monitor if you choose incompatible settings in the X11 server software.\n\n\
    **X11 Web Site**\n\nFor the latest up-to-date information about the X11 server\
    \ software, go to http://www.xfree86.org.\n\n5.  Press **9** to select **Choose\
    \ X11 Server**, and then press **OK**.\n6.  Press **1** or **2** to select an\
    \ X11 server for your Linux configuration. Choose **Yes** for the following screens.\n\
    7.  Select the **Monitor** button.\n\n## Changing the X11 Server Continued\n\n\
    8.  Select a Monitor sync rate that is compatible with the monitor connected to\
    \ your PC.\n9.  Press Tab or Shift+Tab to select a different button in the X11\
    \ window. Choose the resolutions for your monitor.\n10. Press Return (or Enter)\
    \ or click the **Done** button to save the configuration. Press Esc until you\
    \ return to the command-line prompt in the Terminal window.\n\n> **WARNING**\n\
    > If you choose a resolution your monitor cannot support, you might damage your\
    \ monitor. At worst, you will need to reinstall Linux with the correct monitor\
    \ settings so you will actually be able to see what you are typing into your computer.\n\
    \n## Task 11: Changing the System Date and Time\n\nThe current date and time are\
    \ displayed in the KPanel bar. You can use the Lisa application to change the\
    \ time settings for Linux. KDE enables you to customize how the date and time\
    \ appear in the KPanel bar, too.\n\n-   **Changing Time with Lisa**\n    If you\
    \ decide to change the time zone for your PC, go to a command-line window and\
    \ type lisa. Select System Configuration, and then choose Configure Time Zone.\
    \ Choose either GMT or Local time, and use the up- or down-arrow keys to select\
    \ the time zone for your location.\n-   **Shortcut**\n    Press Ctrl+O to select\
    \ the Options tab in the KPanel Configuration window.\n\n1.  Right-click the bottom\
    \ portion of the KPanel bar and choose Panel, Configure.\n2.  Click the Options\
    \ tab.\n3.  Click Clock shows time in AM/PM format if you do not want 24-hour\
    \ time to appear in the KPanel bar.\n4.  Click **Clock shows time in Internet\
    \ beats** if you want to view Internet time in the KPanel bar.\n5.  Click **OK**\
    \ to save changes and exit the window.\n\n### Internet Time\n\nInternet time is\
    \ a time format created by several Internet-savvy companies, such as Swatch and\
    \ CNN. Internet time breaks up the traditional 24-hour day into 1,000 equal parts\
    \ to identify a particular time for an Internet event.\n\n### Default Button\n\
    \nClick **Default** to return all KPanel configurations to their original settings.\n\
    \n## Task 12: Editing Menus\n\nThe KPanel bar enables you to access an application\
    \ or virtual desktop or log out with one click of a button. As you work with applications\
    \ and documents, you might want to customize which items are selectable in the\
    \ K button menu or on the KPanel bar. This task shows you how to personalize the\
    \ KPanel menu.\n\n-   **Menu Editor**\n    Another way to open the Menu Editor\
    \ is to click the K button, choose Utilities, and then select Menu Editor.\n\n\
    ### WARNING\n\nYou can move a folder into another folder in the Menu Editor. This\
    \ shortens the length of the K button menu and enables you to organize the menu\
    \ items so you can find things faster.\n\n1.  Click the **K** button, select **Panel**,\
    \ and choose **Edit Menus**.\n2.  Click **Options** and select **Change Menuname**.\n\
    3.  Type a new name for the menu. Then click **OK**.\n\nRight-click on any menu\
    \ item to edit any of the **K** button menu items.\n\nClick **File** and choose\
    \ **Quit** to exit the application. Click **Yes** to save any changes.\n\n**WARNING**\n\
    After you move a folder or item to a new location in the Menu Editor, there is\
    \ no way to revert the menus back to their original configuration.\n\n**WARNING**\n\
    Changes to the Menu Editor affect all desktops for any particular login account.\n\
    \n**Ctrl+Q**\nPress Ctrl+Q to exit the Menu Editor.\n\n## 7 Setting Up Applications\n\
    \nApplications are the most common, prolific, and familiar types of software you\
    \ will spend most of your time using and abusing on your computer. Of all the\
    \ operating systems you can run, Linux provides access to applications from both\
    \ a command-line interface such as the Konsole or Terminal window, as well as\
    \ from a graphical user interface such as the K development environment. You can\
    \ add, move, and delete applications from the K menu. You can also install and\
    \ uninstall applications from your hard disk and create new login accounts, as\
    \ well as manage other processes and services that use Linux."
  mdcn: "\n## 任务 9：配置键盘\n\n处理数据的基本技能之一就是知道如何选择要操作的内容。选中所需文本后，你可以删除、复制、更改外观等操作。\n\n\
    -   **默认键盘设置**\n    你可能已经选择了 101 键键盘。你也可以选择 104 键和 105 键键盘。如果不确定自己使用的是什么键盘，请查阅文档，或直接选择默认的\
    \ 101 键键盘。\n\n-   **使用 Lisa 更换键盘**\n    如果你决定为电脑连接另一款键盘，请打开命令行窗口并输入 lisa。选择**系统配置**，然后选择**硬件配置**。选择你要使用的键盘类型。然后按\
    \ Esc 键，直到返回到命令行提示符。\n\n1.  点击 **K** 按钮并选择 **KDE 控制中心**。\n2.  选择**输入设备**，然后选择**键盘**。\n\
    3.  拖动滑块调整**按键音量**，或点击**开**或**关**来设置**键盘重复**速率。\n\n## 任务 10：更换 X11 服务器\n\nX11\
    \ 服务器使 Linux 能够与显卡和显示器配合工作，并让 KDE 以特定分辨率显示桌面。你在使用 Lizard 应用程序安装 Caldera Linux\
    \ 2.2 时已配置过这些设置。你也可以使用 Lisa 应用程序更改分辨率、显卡或显示器设置。\n\n### 使用 Lisa 更换 X11 服务器\n\n\
    你可以使用 Lisa 应用程序安装额外的 X11 服务器。在命令行窗口中输入 lisa，然后选择软件包管理。使用上下箭头键选择安装附加软件包。然后插入随书附带的\
    \ CD-ROM，将任何附加的 X11 软件包安装到硬盘上。\n\n1.  点击 **K** 按钮，选择**工具**，然后选择**终端**。\n2.  在终端窗口中输入\
    \ **lisa**。然后按键盘上的 Enter 键。\n3.  按 **3** 选择**系统配置**，然后按 Enter 键。\n4.  按 **1**\
    \ 选择**硬件配置**，然后按 Enter 键。\n\n**警告**\n\n请务必准备好显卡和显示器的信息。如果在 X11 服务器软件中选择了不兼容的设置，可能会导致显示器无法使用。\n\
    \n**X11 网站**\n\n获取有关 X11 服务器软件的最新信息，请访问 http://www.xfree86.org。\n\n5.  按 **9**\
    \ 选择**选择 X11 服务器**，然后按 **OK**。\n6.  按 **1** 或 **2** 为你的 Linux 配置选择 X11 服务器。在接下来的屏幕中选择\
    \ **是**。\n7.  点击**显示器**按钮。\n\n## 继续更换 X11 服务器\n\n8.  选择与电脑连接的显示器兼容的显示器同步频率。\n\
    9.  按 Tab 或 Shift+Tab 选择 X11 窗口中的其他按钮。为显示器选择分辨率。\n10. 按 Return（或 Enter）键，或点击**完成**按钮保存配置。按\
    \ Esc 直到返回到终端窗口的命令行提示符。\n\n> **警告**\n> 如果选择了显示器不支持的分辨率，可能会损坏显示器。最坏的情况下，你需要使用正确的显示器设置重新安装\
    \ Linux，这样才能真正看到自己在电脑上输入的内容。\n\n## 任务 11：更改系统日期和时间\n\n当前日期和时间显示在 KPanel 栏中。你可以使用\
    \ Lisa 应用程序更改 Linux 的时间设置。KDE 还允许你自定义日期和时间在 KPanel 栏中的显示方式。\n\n-   **使用 Lisa 更改时间**\n\
    \    如果你决定更改电脑的时区，请打开命令行窗口并输入 lisa。选择系统配置，然后选择配置时区。选择 GMT 或本地时间，并使用上下箭头键选择你所在位置的时区。\n\
    -   **快捷方式**\n    按 Ctrl+O 选择 KPanel 配置窗口中的选项卡。\n\n1.  右键点击 KPanel 栏底部，选择面板、配置。\n\
    2.  点击选项卡。\n3.  如果你不希望 KPanel 栏显示 24 小时制时间，请点击时钟以 AM/PM 格式显示时间。\n4.  如果你希望在 KPanel\
    \ 栏中查看网络时间，请点击**时钟以网络节拍显示时间**。\n5.  点击 **OK** 保存更改并退出窗口。\n\n### 网络时间\n\n网络时间是由多家精通互联网的公司（如\
    \ Swatch 和 CNN）创建的一种时间格式。网络时间将传统的 24 小时一天划分为 1000 个相等的部分，以确定互联网事件的特定时间。\n\n###\
    \ 默认按钮\n\n点击**默认**将所有 KPanel 配置恢复为原始设置。\n\n## 任务 12：编辑菜单\n\nKPanel 栏使你可以通过单击按钮访问应用程序、虚拟桌面或注销。在使用应用程序和文档时，你可能希望自定义\
    \ K 按钮菜单或 KPanel 栏中的可选项目。本任务介绍如何个性化 KPanel 菜单。\n\n-   **菜单编辑器**\n    打开菜单编辑器的另一种方法是点击\
    \ K 按钮，选择工具，然后选择菜单编辑器。\n\n### 警告\n\n你可以在菜单编辑器中将一个文件夹移动到另一个文件夹中。这可以缩短 K 按钮菜单的长度，并帮助你整理菜单项以便更快找到所需内容。\n\
    \n1.  点击 **K** 按钮，选择**面板**，然后选择**编辑菜单**。\n2.  点击**选项**并选择**更改菜单名称**。\n3.  输入菜单的新名称。然后点击\
    \ **OK**。\n\n右键点击任意菜单项以编辑 **K** 按钮菜单中的的任何项目。\n\n点击**文件**并选择**退出**以退出应用程序。点击**是**保存任何更改。\n\
    \n**警告**\n在菜单编辑器中将文件夹或项目移动到新位置后，无法将菜单恢复为其原始配置。\n\n**警告**\n菜单编辑器的更改会影响任意特定登录账户的所有桌面。\n\
    \n**Ctrl+Q**\n按 Ctrl+Q 退出菜单编辑器。\n\n## 7 设置应用程序\n\n应用程序是你将在电脑上使用和消费的最常见、最丰富、最熟悉的软件类型。在你可以运行的所有操作系统中，Linux\
    \ 提供了从命令行界面（如 Konsole 或终端窗口）以及图形用户界面（如 K 开发环境）访问应用程序的途径。你可以从 K 菜单中添加、移动和删除应用程序。你还可以从硬盘安装和卸载应用程序，创建新的登录账户，以及管理使用\
    \ Linux 的其他进程和服务。\n"
