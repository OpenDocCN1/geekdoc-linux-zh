- md: " ## Task 14: Logging Out\n\nWhen you are finished working with OpenLinux, log\
    \ out of your account. If you are sharing your PC with other users, logging out\
    \ allows others to use the computer while you aren't. Powering off Linux is a\
    \ two-step process. First log out, and then shut down your computer.\n\n**WARNING**\n\
    Always log out and shut down your computer. Do not pull the power cable out of\
    \ the back of your computer to turn it off. If you do not shut down your computer\
    \ properly, you can damage hardware or software settings.\n\n1. Click the **K**\
    \ button, and choose **Logout**, or press the **X** button in the KPanel bar.\n\
    \n2. A dialog appears showing you open applications on your desktop. Click **Logout**.\
    \ The login dialog appears.\n\n## Task 15: Shutting Down the Computer\n\nBecause\
    \ a computer consists of both hardware and software, when you want to power off,\
    \ you must turn off or shut down your software before you turn off your hardware.\
    \ Powering off your computer is a two-step process with Linux. First log out of\
    \ your Linux account, and then select **Shutdown** from the login window.\n\n\
    - **Console Mode**\n  Choose **Console Mode** to start up Linux without auto-starting\
    \ KDE.\n\n- **The shutdown Command**\n  If you did not use KDE with Linux, you\
    \ can shut down by typing a couple command lines. First, type **sync**, press\
    \ Enter, type **sync**, and press Enter. Finally, type **shutdown -h now** to\
    \ end your OpenLinux session.\n\n- **Reboot Command**\n  Press Command+Alt+Delete\
    \ or type **shutdown -r now** to warm boot Linux.\n\n1. At the Login/Logout prompt,\
    \ click the **Shutdown** button.\n\n2. Select **Shutdown**.\n\n3. Click **OK**.\n\
    \n## Working with Disks, Folders, and Files\n\nWhether you're using the command\
    \ line or KDE, learning how to work with files and folders is an essential part\
    \ of working with Linux. Files and folders are collectively stored on your hard\
    \ disk's file system. You can create folders—also called directories—to keep your\
    \ files organized. You can open, close, move, rename, and view a folder's or document\
    \ file's contents. You can also create, move, or delete folders and files.\n\n\
    As you continue to work on your computer, you will create more files and folders.\
    \ Eventually, you will need a way to keep these files organized. You can organize\
    \ your files by copying, moving, and deleting unnecessary files. This part covers\
    \ how to work with files and folders using the Terminal window and KDE.\n\n##\
    \ Task\n\n| Task # | | Page # |\n|--------|---------------------------------------------|--------|\n\
    | 1 | Using the Toolbar Buttons in a Folder Window | 26 |\n| 2 | Changing the\
    \ Window Content View | 27 |\n| 3 | Opening a File or Folder | 28 |\n| 4 | Renaming\
    \ a File or Folder | 29 |\n| 5 | Deleting a File or Folder | 30 |\n| 6 | Copying\
    \ a File or Folder | 31 |\n| 7 | Moving a File or Folder | 32 |\n| 8 | Creating\
    \ a Folder | 33 |\n| 9 | Finding Files and Folders | 34 |\n| 10 | Performing Advanced\
    \ Searches | 35 |\n\n## Task 1: Using the Toolbar Buttons in a Folder Window\n\
    \nEach folder window includes a toolbar that you can use to browse folders, view\
    \ the status of the window, navigate to previously viewed pages, and view the\
    \ location path of the window. The toolbar actually consists of four components:\
    \ the menu bar, status bar, toolbar, and location bar.\n\n**Removing Toolbars**\n\
    You can remove any toolbars in a window by clicking on the Options menu in the\
    \ window you want to change.\n\n**Changing Your Toolbar**\nClick and drag any\
    \ toolbar component to organize the toolbar the way you like it. Each toolbar\
    \ component can also become a floating toolbar for each folder window.\n\n**Location\
    \ Toolbar**\nType the pathname for a file or folder in the Location toolbar to\
    \ quickly view the contents of a specific folder.\n\n1. Click the Up button to\
    \ move up one level in the folder directory.\n\n2. Click the Back and Forward\
    \ buttons to navigate to a previously viewed page or the next page.\n\n3. Click\
    \ the Home button to return to the original window view.\n\n4. Click the Reload\
    \ button to update the window.\n\n## Task 2: Changing the Window Content View\n\
    \nThere are many different ways to view the contents of a window. Caldera's Linux\
    \ uses large icons as the default view. If you want to view more information about\
    \ a window's contents, you can change to one of several view formats: Icon view,\
    \ Text view, Long view, and Short view. Additionally, you can customize any window\
    \ to show hidden files, the directory tree, or thumbnails.\n\n1. Double-click\
    \ a folder icon on the desktop or choose a window you want to change. Click the\
    \ **View** menu and select the view you want (here, click **Long View**).\n\n\
    2. The window displays the contents in the new view (in this case, Long view).\n\
    \n- **The Default View**: The default view for any folder window is HTML view.\n\
    \n- **Command-Line Trivia**: Long view is equivalent to the `ls -l` command. Short\
    \ view is equivalent to the `ls` command.\n\n## Task 3: Opening a File or Folder\n\
    \nFolders can contain files, applications, and other folders that you can use\
    \ to organize your work. A file can be an application, a document, or a resource.\n\
    \n- **The cd Command**\n  Double-clicking a folder is equivalent to using the\
    \ cd command.\n\n- **Opening Files**\n  Double-clicking a file is equivalent to\
    \ typing the name of a file in the Terminal window. Both methods can be used to\
    \ open a file.\n\n- **WARNING**\n  You might not be able to open a file if your\
    \ login account has limited access to files on the hard disk.\n\n- **Closing a\
    \ Folder**\n  To close a file or folder window, double-click the Close box in\
    \ the upper-left corner of the window, or right-click the window's title bar and\
    \ choose Close from the pop-up menu.\n\n1. Double-click the **Templates** folder\
    \ on the desktop.\n\n2. Double-click a folder in the Templates folder window.\
    \ In this example, I've created a folder in the Templates folder.\n\n3. Each folder\
    \ icon represents a folder on your hard drive. Each file icon represents a document\
    \ that can be opened by an application.\n\n## Task 4: Renaming a File or Folder\n\
    \n1. Display the folder or file you want to rename.\n\n2. Right-click the folder\
    \ and select **Properties**.\n\n3. Type a new name for the folder, and then click\
    \ **OK**.\n\n4. The folder or file is renamed.\n\nAs you create folders and files,\
    \ you might need to rename them.\n\n### Absolute Versus Relative Paths\n\nYou\
    \ can access files or folders using a command line in a KDE window, or in the\
    \ Find Files window in OpenLinux. If you put a / at the beginning of a path, such\
    \ as cd /root/Desktop/sample.txt, you have typed the complete, or absolute, path\
    \ to the file or folder you want to access. If you type cd home/chapter01, you\
    \ have typed the relative path of the file or folder you want to access.\n\n###\
    \ WARNING\n\nYou might not be able to rename a file or folder if you do not have\
    \ administrative permissions. In general, you can rename any file or folder you\
    \ create.\n\n### Changing Names\n\nChanging the name of a folder or file in the\
    \ Properties window is equivalent to using the mv command in a Terminal window.\n\
    \n## Task 5: Deleting a File or Folder\n\nYou can delete files or folders by moving\
    \ them to the Trash, and then emptying the Trash. When you delete a folder from\
    \ your hard drive, you also delete its contents. You can restore items in the\
    \ Trash by dragging them out of the Trash window and clicking Move.\n\n1. Select\
    \ the folder or file you want to delete.\n\n2. Right-click the folder or file\
    \ and select **Move to Trash**.\n\n3. Right-click the **Trash** icon and select\
    \ **Empty Trash Bin**.\n\n4. The folder or file is deleted.\n\n### WARNING\n\n\
    You cannot delete files from a CD-ROM.\n\n### Deleting a Shortcut\n\nYou can delete\
    \ any file or folder by right-clicking the file or folder and choosing Delete.\
    \ Click **Yes** if you want to permanently delete the item, or **No** if you do\
    \ not want to remove the item from the disk."
  mdcn: "\n ## 任务 14：注销\n\n当你使用完 OpenLinux 后，请注销你的账户。如果你和其他用户共用一台电脑，注销可以让其他人在你不在时使用电脑。关闭\
    \ Linux 电源是一个两步操作。首先注销，然后关闭电脑。\n\n**警告**\n务必注销并关闭电脑。不要直接从电脑背面拔掉电源线来关机。如果你没有正确关闭电脑，可能会损坏硬件或软件设置。\n\
    \n1. 单击 **K** 按钮，然后选择 **注销**，或者单击 KPanel 栏中的 **X** 按钮。\n\n2. 一个对话框将出现，显示你桌面上打开的应用程序。单击\
    \ **注销**。登录对话框将出现。\n\n## 任务 15：关闭电脑\n\n由于电脑由硬件和软件共同组成，当你要关闭电源时，必须在关闭硬件之前先关闭或关闭你的软件。在\
    \ Linux 中，关闭电脑电源是一个两步操作。首先注销你的 Linux 账户，然后从登录窗口选择 **关机**。\n\n- **控制台模式**\n  选择\
    \ **控制台模式** 以启动 Linux 而不自动启动 KDE。\n\n- **shutdown 命令**\n  如果你没有使用 KDE，可以通过输入几条命令行来关闭电脑。首先，输入\
    \ **sync**，按 Enter，再输入 **sync**，按 Enter。最后，输入 **shutdown -h now** 来结束你的 OpenLinux\
    \ 会话。\n\n- **重启命令**\n  按 Command+Alt+Delete 或输入 **shutdown -r now** 来热启动 Linux。\n\
    \n1. 在登录/注销提示处，单击 **关机** 按钮。\n\n2. 选择 **关机**。\n\n3. 单击 **确定**。\n\n## 使用磁盘、文件夹和文件\n\
    \n无论你是使用命令行还是 KDE，学习如何处理文件和文件夹都是使用 Linux 的重要部分。文件和文件夹共同存储在硬盘的文件系统中。你可以创建文件夹——也称为目录——来整理你的文件。你可以打开、关闭、移动、重命名以及查看文件夹或文档文件的内容。你还可以创建、移动或删除文件夹和文件。\n\
    \n随着你在电脑上不断工作，你会创建更多的文件和文件夹。最终，你需要一种方法来整理这些文件。你可以通过复制、移动和删除不必要的文件来整理文件。本部分介绍如何使用终端窗口和\
    \ KDE 来处理文件和文件夹。\n\n## 任务\n\n| 任务 # | | 页码 # |\n|--------|---------------------------------------------|--------|\n\
    | 1 | 使用文件夹窗口中的工具栏按钮 | 26 |\n| 2 | 更改窗口内容视图 | 27 |\n| 3 | 打开文件或文件夹 | 28 |\n| 4\
    \ | 重命名文件或文件夹 | 29 |\n| 5 | 删除文件或文件夹 | 30 |\n| 6 | 复制文件或文件夹 | 31 |\n| 7 | 移动文件或文件夹\
    \ | 32 |\n| 8 | 创建文件夹 | 33 |\n| 9 | 查找文件和文件夹 | 34 |\n| 10 | 执行高级搜索 | 35 |\n\n\
    ## 任务 1：使用文件夹窗口中的工具栏按钮\n\n每个文件夹窗口都包含一个工具栏，你可以用它来浏览文件夹、查看窗口状态、导航到 previously viewed\
    \ pages（先前查看的页面），以及查看窗口的位置路径。工具栏实际上由四个部分组成：菜单栏、状态栏、工具栏和位置栏。\n\n**移除工具栏**\n你可以通过单击要更改窗口中的\"\
    选项\"菜单来移除窗口中的任何工具栏。\n\n**更改你的工具栏**\n单击并拖动任何工具栏组件，以你喜欢的方式组织工具栏。每个工具栏组件还可以成为每个文件夹窗口的浮动工具栏。\n\
    \n**位置工具栏**\n在位置工具栏中输入文件或文件夹的路径名，以快速查看特定文件夹的内容。\n\n1. 单击\"向上\"按钮，在文件夹目录中向上移动一级。\n\
    \n2. 单击\"后退\"和\"前进\"按钮，导航到先前查看的页面或下一个页面。\n\n3. 单击\"主页\"按钮，返回到原始窗口视图。\n\n4. 单击\"\
    重新加载\"按钮，更新窗口。\n\n## 任务 2：更改窗口内容视图\n\n有多种不同的方式可以查看窗口内容。Caldera Linux 默认使用大图标视图。如果你想查看有关窗口内容的更多信息，可以切换到以下几种视图格式之一：图标视图、文本视图、长视图和短视图。此外，你还可以自定义任何窗口以显示隐藏文件、目录树或缩略图。\n\
    \n1. 双击桌面上的文件夹图标，或选择你要更改的窗口。单击 **视图** 菜单并选择你想要的视图（这里，单击 **长视图**）。\n\n2. 窗口以新视图显示内容（在本例中，长视图）。\n\
    \n- **默认视图**：任何文件夹窗口的默认视图是 HTML 视图。\n\n- **命令行小知识**：长视图等同于 `ls -l` 命令。短视图等同于 `ls`\
    \ 命令。\n\n## 任务 3：打开文件或文件夹\n\n文件夹可以包含文件、应用程序和其他文件夹，你可以用它们来整理你的工作。文件可以是应用程序、文档或资源。\n\
    \n- **cd 命令**\n  双击文件夹等同于使用 cd 命令。\n\n- **打开文件**\n  双击文件等同于在终端窗口中输入文件名。两种方法都可以用来打开文件。\n\
    \n- **警告**\n  如果你的登录账户对硬盘上的文件访问权限有限，你可能无法打开文件。\n\n- **关闭文件夹**\n  要关闭文件或文件夹窗口，双击窗口左上角的关闭框，或右键单击窗口的标题栏并从弹出菜单中选择关闭。\n\
    \n1. 双击桌面上的 **模板** 文件夹。\n\n2. 双击模板文件夹窗口中的一个文件夹。在本例中，我在模板文件夹中创建了一个文件夹。\n\n3. 每个文件夹图标代表硬盘上的一个文件夹。每个文件图标代表可以由应用程序打开的文档。\n\
    \n## 任务 4：重命名文件或文件夹\n\n1. 显示你要重命名的文件夹或文件。\n\n2. 右键单击该文件夹并选择 **属性**。\n\n3. 为文件夹输入新名称，然后单击\
    \ **确定**。\n\n4. 文件夹或文件被重命名。\n\n当你创建文件夹和文件时，可能需要重命名它们。\n\n### 绝对路径与相对路径\n\n你可以在\
    \ KDE 窗口的命令行中，或在 OpenLinux 的\"查找文件\"窗口中访问文件或文件夹。如果你在路径开头加上 /，例如 cd /root/Desktop/sample.txt，你输入的就是要访问的文件或文件夹的完整路径，即绝对路径。如果你输入\
    \ cd home/chapter01，你输入的就是要访问的文件或文件夹的相对路径。\n\n### 警告\n\n如果你没有管理员权限，可能无法重命名文件或文件夹。通常，你可以重命名你创建的任何文件或文件夹。\n\
    \n### 更改名称\n\n在属性窗口中更改文件夹或文件的名称等同于在终端窗口中使用 mv 命令。\n\n## 任务 5：删除文件或文件夹\n\n你可以通过将文件或文件夹移到回收站，然后清空回收站来删除它们。当你从硬盘删除文件夹时，你也会删除其内容。你可以通过将回收站窗口中的项目拖出并单击移动来恢复回收站中的项目。\n\
    \n1. 选择你要删除的文件夹或文件。\n\n2. 右键单击该文件夹或文件并选择 **移到回收站**。\n\n3. 右键单击 **回收站** 图标并选择 **清空回收站**。\n\
    \n4. 文件夹或文件被删除。\n\n### 警告\n\n你无法从 CD-ROM 删除文件。\n\n### 删除快捷方式\n\n你可以通过右键单击文件或文件夹并选择删除来删除任何文件或文件夹。如果你想永久删除该项目，请单击\
    \ **是**，或者如果你不想从磁盘移除该项目，请单击 **否**。\n"
