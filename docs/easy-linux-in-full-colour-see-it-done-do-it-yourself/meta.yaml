  - "[PAGE 13]\n\n# ## Task 1: Starting with Windows\n\nOpenLinux can run on a wide\
    \ range of PCs, most of which might already have Windows installed on them. Although\
    \ you can simply boot into the OpenLinux CD and begin installing OpenLinux, you\
    \ can just as easily prepare your hard disk for the OpenLinux installation from\
    \ Windows. To begin this task, start up your PC with Windows, and then insert\
    \ the OpenLinux CD into the PC's CD-ROM drive.\n\n+   - **Hard Disk Space**  \n\
    \  Partition Magic enables you to convert unused hard disk space for the OpenLinux\
    \ installation.\n- **Full Install Preparation Option**  \n  Click Full Install\
    \ Preparation, and then choose a language. This installs bootable floppy images\
    \ onto your hard disk. If your PC does not have a CD-ROM drive, or if it is unable\
    \ to start up from the CD included with this book, try installing OpenLinux from\
    \ a floppy disk.\n\n![](img/28e2bccabaf327178ce9997934f991d9_13_0.png)\n\n![](img/28e2bccabaf327178ce9997934f991d9_13_1.png)\n\
    \n![](img/28e2bccabaf327178ce9997934f991d9_13_2.png)\n\n+   1. Double-click **My\
    \ Computer**, and then double-click the **OpenLinux 22 CD** icon.\n2. Click **Install\
    \ Products**.\n3. Click **Partition & Launch Linux Install** to create the Linux\
    \ partition."
  - '[PAGE 14]


    ![](img/28e2bccabaf327178ce9997934f991d9_14_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_14_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_14_2.png)


    In the Partition Magic Setup Wizard, click **Next**. Follow the onscreen instructions
    to install Partition Magic onto your hard disk.


    Click **Finish**. Then remove the OpenLinux CD from your CD-ROM drive.


    Click **OK**. Your PC will restart in DOS mode and ask you to choose a partition
    and partition size for OpenLinux. Choose the 1GB partition size option if you
    plan to use KDE, which is recommended for this book.


    # Dual-Boot PCs


    For more information about how to configure to boot into either Windows or Linux,
    see Part 9, Task 3, "Configuring a Dual-Boot PC."


    # Removing the OpenLinux Partition


    To remove the OpenLinux partition, simply choose Start, Programs, Partition Magic:
    Caldera Edition, and then choose **Delete Linux Partition**.


    # Choosing a Partition Size


    You can choose from three partition size options in the Caldera installer: 300MB,
    1GB, and entire disk (which is 4GB). Choose 300MB if you do not plan to use KDE
    and prefer a minimal installation of OpenLinux. Choose 1GB to install with the
    CD included with this book, or 4GB if you have plenty of disk space and plan to
    edit or create large files with OpenLinux.'
- md: " ## Task 2: Installing OpenLinux\n\nOne of the more memorable experiences you\
    \ will have using Linux is installing it onto your computer. OpenLinux works with\
    \ a general short list of PC hardware, and there's a fairly long list of little\
    \ things that don't work quite right with either the installer or OpenLinux. This\
    \ task walks you through a successful installation.\n\n### Configuration Information\n\
    \nBefore you start installing Linux, be sure to have your monitor, graphics card,\
    \ network card, printer, modem, and hard disk information handy. Most of this\
    \ information can be gathered by viewing **Control Panel** information if Windows\
    \ is already running on the PC on which you want to install Linux.\n\n![](img/28e2bccabaf327178ce9997934f991d9_15_0.png)\n\
    \n1. Insert the CD from this book into the PC and start your PC.\n2. Wait for\
    \ the Lizard application to load. Click the language you want to use to with the\
    \ installation (in this case, **English**). Click **Next**.\n3. Select the mouse\
    \ you want to use. Lizard will try to auto-detect your mouse and choose the setting\
    \ for you. Click **Next** to continue.\n4. Select a hard disk and choose a partition\
    \ on it. Click **Prepare selected disk for Linux**. Wait for Lizard to format\
    \ the partition, and click **Next**.\n\n### Lizard or Lisa\n\nIf you are unable\
    \ to install with the Lizard application, create a bootable floppy disk from a\
    \ Windows-based PC by inserting the CD-ROM from this book, and then selecting\
    \ the option to create a bootable floppy.\n\n### Booting from the CD\n\nPress\
    \ **Tab** after the PC first starts up with the CD included with this book. Type\
    \ **boot** to start the PC with the CD. Type **install** to run the Linux Lizard\
    \ installer application.\n\n### Configuring a Dual-Boot PC\n\nFor more information\
    \ about configuring a dual-boot PC, see Part 9, Task 3, \"Configuring a Dual-Boot\
    \ PC.\"\n\n### Blank Screen?\n\nIf you see a blank screen during the installation\
    \ process, Lizard probably failed to continue the Linux installation. Try installing\
    \ from the bootable floppy disk or start the installation over from step 1.\n\n\
    5. Select the installation target. I've selected **Entire Harddisk**. If you created\
    \ a Linux partition with the CD in Windows, choose **Prepared Partition(s)**.\
    \ Then click **Next**.\n6. Select a partition on the hard disk. Click **Prepare\
    \ selected disk for Linux** (here I chose **Format chosen partitions**). Wait\
    \ for Lizard to format the partition, and click **Next**.\n7. Click **Recommended\
    \ packages, plus commercial**. Then click **Next**. Then click on the keyboard\
    \ and layout format for your keyboard. Click **Next** to continue.\n8. Click **Probe**\
    \ on the Select Video Card page to determine how much video memory is available\
    \ on your computer. Lizard will auto-detect the brand and model graphics card\
    \ installed on your PC. Click **Next**.\n\n![](img/28e2bccabaf327178ce9997934f991d9_16_1.png)\n\
    \n## Task 2: Installing OpenLinux Continued\n\n### Setting Up Your Hard Disk\n\
    \nI installed Caldera's Linux on both a hard disk with no other software on it\
    \ and a hard disk that already had Windows 98 installed. If you already have an\
    \ OS on your disk, do not select the option to use the entire disk for Linux.\n\
    \n### Hard Disk Options\n\nYou can configure your hard disk partition in a 300MB,\
    \ 1GB, or 4GB size before installing OpenLinux.\n\n### WordPerfect 8\n\nWordPerfect\
    \ 8 is bundled with the CD included with this book. To install this application\
    \ with Lizard, be sure to select the installation package **All recommended packages\
    \ plus Commercial** in Lizard.\n\n### Using Col\n\nUse col as the name of the\
    \ user login account during installation. Create additional accounts after you\
    \ log in to Linux or KDE as root.\n\n![](img/28e2bccabaf327178ce9997934f991d9_17_0.png)\n\
    \n![](img/28e2bccabaf327178ce9997934f991d9_17_1.png)\n\n![](img/28e2bccabaf327178ce9997934f991d9_17_2.png)\n\
    \n![](img/28e2bccabaf327178ce9997934f991d9_17_3.png)\n\n9. Click a monitor definition\
    \ and view the monitor settings. Lizard auto-detects the type of monitor connected\
    \ to your graphics card. Click **Next**.\n10. Click on a video mode. Then select\
    \ the color depth you want to work with. Click **Next**.\n11. Type a password\
    \ for the root account for the computer. Click **Next**.\n12. Type a user/password\
    \ for the col account. Click **Add User**. Then click **Next**.\n\n---\n\n**Installation\
    \ Status**\n\nAfter you choose the package you want to install on your hard disk,\
    \ Lizard begins to place the files onto your computer. A progress bar appears\
    \ at the bottom of the installation window to show you the progress of the installation.\n\
    \n**KWizard**\n\nThe first time you log in to KDE, the KDE Configuration Wizard\
    \ starts. With this wizard, you can create icons to access your floppy, CD-ROM\
    \ drive, or printer, as well as shortcuts to Caldera's Web site.\n\n13. Type the\
    \ IP information for your Ethernet, or select **No ethernet** if your computer\
    \ does not have a network card installed. Click **Next** to continue.\n14. Click\
    \ **Hardware clock runs in GMT time**. Click on the drop-down list and choose\
    \ the time zone closest to your area. Then click **Next**.\n15. Wait for the Lizard\
    \ installer to complete. Click **Finish**. The PC restarts into KDE. Select a\
    \ login account and type your password to log in to your KDE session.\n\n![](img/28e2bccabaf327178ce9997934f991d9_18_2.png)\n\
    \n## Task 3: Logging In\n\nOne of the features you will grow accustomed to is\
    \ logging in to your PC. You can log in to the same computer with more than one\
    \ account. The login process consists of entering a username and password. This\
    \ task shows you how to log in to your computer with KDE as well as a Terminal\
    \ window.\n\n### Account Access\n\nIf you are the only person using the computer,\
    \ you can create multiple accounts to help organize your work or make your work\
    \ more efficient. The two login extremes are root and guest. Root has complete\
    \ access to all files and folders in the system, and guest has the most limited\
    \ access.\n\n### Starting KDE\n\nYour computer will always boot into KDE. If you\
    \ choose to start up into console mode, type `startkde` to start the K development\
    \ environment.\n\n![](img/28e2bccabaf327178ce9997934f991d9_19_0.png)\n\n![](img/28e2bccabaf327178ce9997934f991d9_19_1.png)\n\
    \n1. Power on your computer. Press Tab, and type **linux** to boot in to Linux.\n\
    2. Click **Root**.\n3. Type the login name and password for the account.\n\n4.\
    \ Click **Go!**.\n5. To log in with a command-line prompt, click **Shutdown**\
    \ in the KDE login window.\n6. Choose **Console mode**, and click **OK**.\n\n\
    ## Task 4: Opening and Closing a Window\n\nThe K development environment can display\
    \ folder content in a window. To work with files and folders in KDE, click on\
    \ an icon to open its window. You can have one or several windows open on your\
    \ computer screen. You can close a window by clicking its Close button.\n\n- **Active\
    \ and Inactive Windows**\n\n  If you have more than one window open, only the\
    \ front window is active. This means you can make changes to the menus, files,\
    \ and folders only in the front (active) window on your screen.\n\n- **Ctrl+O\
    \ and Alt+F4**\n\n  There are keyboard shortcuts for opening and closing windows,\
    \ too. Press Ctrl+O to open a window and Alt+F4 to close a window.\n\n- **Console\
    \ Commands**\n\n  Press Ctrl+T to open a console window from a KDE window. Type\
    \ exit to close a console or Terminal window.\n\n![](img/28e2bccabaf327178ce9997934f991d9_21_0.png)\n\
    \n![](img/28e2bccabaf327178ce9997934f991d9_21_1.png)\n\n![](img/28e2bccabaf327178ce9997934f991d9_21_2.png)\n\
    \n1. Click the Home Directory icon on the KPanel bar.\n2. Click on any folder\
    \ icon in the Home Directory window to open it. You can also select a folder,\
    \ click **File**, and choose **Open**.\n3. Click a window's Close box. You can\
    \ also right-click a window title bar and choose **Close**                   \
    \                                                      from the pop-up menu."
  mdcn: "\n ## 任务 2：安装 OpenLinux\n\n在安装 Linux 的过程中，你将拥有一段难忘的体验。OpenLinux 兼容一系列通用 PC\
    \ 硬件，但也有不少小问题和安装程序或 OpenLinux 本身不太兼容。本任务将引导你完成一次成功的安装。\n\n### 配置信息\n\n在开始安装 Linux\
    \ 之前，请确保准备好显示器、显卡、网卡、打印机、调制解调器和硬盘的相关信息。如果要在已运行 Windows 的 PC 上安装 Linux，大部分信息可以通过查看**控制面板**信息来获取。\n\
    \n![](img/28e2bccabaf327178ce9997934f991d9_15_0.png)\n\n1. 将本书附带的 CD 插入 PC 并启动电脑。\n\
    2. 等待 Lizard 应用程序加载。点击你想在安装过程中使用的语言（本例中为**英语**）。点击**下一步**。\n3. 选择你要使用的鼠标。Lizard\
    \ 会尝试自动检测你的鼠标并为你选择相应的设置。点击**下一步**继续。\n4. 选择硬盘并选择其上的一个分区。点击**为 Linux 准备所选磁盘**。等待\
    \ Lizard 格式化该分区，然后点击**下一步**。\n\n### Lizard 还是 Lisa\n\n如果你无法使用 Lizard 应用程序安装，请在基于\
    \ Windows 的 PC 上从本书附带的 CD-ROM 创建一张可启动软盘，然后选择创建可启动软盘的选项。\n\n### 从 CD 启动\n\n在 PC\
    \ 首次使用本书附带的 CD 启动后，按 **Tab** 键。输入 **boot** 以从 CD 启动 PC。输入 **install** 以运行 Linux\
    \ Lizard 安装程序。\n\n### 配置双启动 PC\n\n有关配置双启动 PC 的更多信息，请参见第 9 部分，任务 3，“配置双启动 PC”。\n\
    \n### 黑屏？\n\n如果在安装过程中看到黑屏，Lizard 可能未能继续 Linux 安装。尝试从可启动软盘安装，或从步骤 1 重新开始安装。\n\n\
    5. 选择安装目标。我已选择**整个硬盘**。如果你在 Windows 中使用 CD 创建了 Linux 分区，请选择**已准备的分区**。然后点击**下一步**。\n\
    6. 选择硬盘上的一个分区。点击**为 Linux 准备所选磁盘**（这里我选择了**格式化所选分区**）。等待 Lizard 格式化该分区，然后点击**下一步**。\n\
    7. 点击**推荐软件包，外加商业软件**。然后点击**下一步**。然后点击你的键盘和布局格式。点击**下一步**继续。\n8. 在“选择视频卡”页面点击**探测**，以确定你的计算机有多少显存可用。Lizard\
    \ 将自动检测你 PC 上安装的显卡品牌和型号。点击**下一步**。\n\n![](img/28e2bccabaf327178ce9997934f991d9_16_1.png)\n\
    \n## 任务 2：安装 OpenLinux（续）\n\n### 设置你的硬盘\n\n我在一块没有其他软件的硬盘和一块已安装 Windows 98 的硬盘上都安装了\
    \ Caldera 的 Linux。如果你的磁盘上已有操作系统，不要选择将整个磁盘用于 Linux 的选项。\n\n### 硬盘选项\n\n在安装 OpenLinux\
    \ 之前，你可以将硬盘分区配置为 300MB、1GB 或 4GB 大小。\n\n### WordPerfect 8\n\nWordPerfect 8 随本书附带的\
    \ CD 一起捆绑提供。要在 Lizard 中安装此应用程序，请确保选择安装包**所有推荐软件包外加商业软件**。\n\n### 使用 col\n\n在安装过程中使用\
    \ col 作为用户登录账户的名称。在以 root 身份登录 Linux 或 KDE 后，创建额外的账户。\n\n![](img/28e2bccabaf327178ce9997934f991d9_17_0.png)\n\
    \n![](img/28e2bccabaf327178ce9997934f991d9_17_1.png)\n\n![](img/28e2bccabaf327178ce9997934f991d9_17_2.png)\n\
    \n![](img/28e2bccabaf327178ce9997934f991d9_17_3.png)\n\n9. 点击显示器定义并查看显示器设置。Lizard\
    \ 自动检测连接到显卡上的显示器类型。点击**下一步**。\n10. 点击视频模式。然后选择你要使用的颜色深度。点击**下一步**。\n11. 输入计算机\
    \ root 账户的密码。点击**下一步**。\n12. 输入 col 账户的用户名/密码。点击**添加用户**。然后点击**下一步**。\n\n---\n\
    \n**安装状态**\n\n在你选择要安装到硬盘上的软件包后，Lizard 开始将文件放置到你的计算机上。安装窗口底部会出现一个进度条，显示安装进度。\n\n\
    **KWizard**\n\n首次登录 KDE 时，KDE 配置向导将启动。借助此向导，你可以创建图标来访问软盘、CD-ROM 驱动器或打印机，以及创建到\
    \ Caldera 网站的快捷方式。\n\n13. 输入以太网的 IP 信息，如果你的计算机没有安装网卡，则选择**无以太网**。点击**下一步**继续。\n\
    14. 点击**硬件时钟使用 GMT 时间**。点击下拉列表并选择最接近你所在区域的时区。然后点击**下一步**。\n15. 等待 Lizard 安装程序完成。点击**完成**。PC\
    \ 将重新启动进入 KDE。选择一个登录账户并输入密码以登录你的 KDE 会话。\n\n![](img/28e2bccabaf327178ce9997934f991d9_18_2.png)\n\
    \n## 任务 3：登录\n\n你会逐渐习惯的一个功能就是登录你的 PC。你可以使用多个账户登录同一台计算机。登录过程包括输入用户名和密码。本任务向你展示如何通过\
    \ KDE 以及终端窗口登录你的计算机。\n\n### 账户访问\n\n如果你是唯一使用这台计算机的人，你可以创建多个账户来帮助组织你的工作或提高工作效率。两个登录极端是\
    \ root 和 guest。Root 对系统中的所有文件和文件夹拥有完全访问权限，而 guest 的访问权限最有限。\n\n### 启动 KDE\n\n\
    你的计算机将始终启动进入 KDE。如果你选择以控制台模式启动，请输入 `startkde` 以启动 K 开发环境。\n\n![](img/28e2bccabaf327178ce9997934f991d9_19_0.png)\n\
    \n![](img/28e2bccabaf327178ce9997934f991d9_19_1.png)\n\n1. 打开你的计算机。按 Tab 键，然后输入\
    \ **linux** 启动进入 Linux。\n2. 点击 **Root**。\n3. 输入账户的登录名和密码。\n\n4. 点击 **Go!**。\n\
    5. 要使用命令行提示符登录，请点击 KDE 登录窗口中的**关机**。\n6. 选择**控制台模式**，然后点击 **OK**。\n\n## 任务 4：打开和关闭窗口\n\
    \nK 开发环境可以在窗口中显示文件夹内容。要在 KDE 中处理文件和文件夹，请点击图标以打开其窗口。你可以在计算机屏幕上打开一个或多个窗口。你可以点击窗口的关闭按钮来关闭窗口。\n\
    \n- **活动窗口和非活动窗口**\n\n  如果你有多个窗口打开，只有最前面的窗口是活动的。这意味着你只能对屏幕上最前面（活动）窗口中的菜单、文件和文件夹进行更改。\n\
    \n- **Ctrl+O 和 Alt+F4**\n\n  打开和关闭窗口也有键盘快捷键。按 Ctrl+O 打开窗口，Alt+F4 关闭窗口。\n\n- **控制台命令**\n\
    \n  按 Ctrl+T 从 KDE 窗口打开一个控制台窗口。输入 exit 关闭控制台或终端窗口。\n\n![](img/28e2bccabaf327178ce9997934f991d9_21_0.png)\n\
    \n![](img/28e2bccabaf327178ce9997934f991d9_21_1.png)\n\n![](img/28e2bccabaf327178ce9997934f991d9_21_2.png)\n\
    \n1. 点击 KPanel 栏上的主目录图标。\n2. 点击主目录窗口中的任意文件夹图标以打开它。你也可以选择一个文件夹，点击**文件**，然后选择**打开**。\n\
    3. 点击窗口的关闭框。你也可以右键点击窗口标题栏，然后从弹出菜单中选择**关闭**。\n"
