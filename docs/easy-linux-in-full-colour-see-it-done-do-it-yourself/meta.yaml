  md: '# # Task 15: Replying to Email


    You can easily respond to a message you receive. Netscape Messenger completes
    the address and subject information for you. You can reply to part or all of the
    original email. You can also reply to one or all recipients of an email.


    ![](img/28e2bccabaf327178ce9997934f991d9_99_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_99_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_99_2.png)


    > > **Quotes**

    > One of the best ways to clarify what you''re referring to in an email is to
    quote from a previous email. You can cut and paste text from one email to another,
    or select the text from an email and click the Reply button. The selected text
    will appear in quotes in your reply email.


    +   1. Click **Communicator**, and then choose **Messenger**.

    2. Click **Get Msg**.

    3. Click on an email you want to read.'
