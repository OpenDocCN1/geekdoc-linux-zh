    +   1. Display the folder or file you want to rename.

    2. Right-click the folder and select **Properties**.

    3. Type a new name for the folder, and then click **OK**.

    4. The folder or file is renamed.


    As you create folders and files, you might need to rename them.


    # ## Absolute Versus Relative Paths


    You can access files or folders using a command line in a KDE window, or in the
    Find Files window in OpenLinux. If you put a / at the beginning of a path, such
    as cd /root/Desktop/sample.txt, you have typed the complete, or absolute, path
    to the file or folder you want to access. If you type cd home/chapter01, you have
    typed the relative path of the file or folder you want to access.


    # ## WARNING


    You might not be able to rename a file or folder if you do not have administrative
    permissions. In general, you can rename any file or folder you create.


    # ## Changing Names


    Changing the name of a folder or file in the Properties window is equivalent to
    using the mv command in a Terminal window.'
  - '[PAGE 39]


    # Task 5: Deleting a File or Folder


    You can delete files or folders by moving them to the Trash, and then emptying
    the Trash. When you delete a folder from your hard drive, you also delete its
    contents. You can restore items in the Trash by dragging them out of the Trash
    window and clicking Move.


    +   1. Select the folder or file you want to delete.

    2. Right-click the folder or file and select **Move to Trash**.

    3. Right-click the **Trash** icon and select **Empty Trash Bin**.

    4. The folder or file is deleted.


    # WARNING


    You cannot delete files from a CD-ROM.


    # Deleting a Shortcut


    You can delete any file or folder by right-clicking the file or folder and choosing
    Delete. Click **Yes** if you want to permanently delete the item, or **No** if
    you do not want to remove the item from the disk.


    ![](img/28e2bccabaf327178ce9997934f991d9_39_0.png)'
- md: " ## Task 6: Copying a File or Folder\n\nLinux makes it easy to copy files from\
    \ both the command line and KDE. You can copy a file or folder to another location\
    \ on the hard disk or to a floppy disk. Copying a file or folder leaves the original\
    \ item unchanged. You can copy files or folders to create a backup of your work.\n\
    \n**The cp Command**\n\nChoosing Copy and Paste from the Edit menu is equivalent\
    \ to using the cp command.\n\n**Creating Shortcuts**\n\nYou can create a link,\
    \ or a shortcut, to a file by dragging the file to the destination window and\
    \ choosing Link in the pop-up menu. The newly created link is a file that points\
    \ to its original.\n\n**Deleting a Copy**\n\nKeep in mind that you copy both the\
    \ folder and its contents. If you don't need the copy, you can delete it. See\
    \ Task 5, \"Deleting a File or Folder,\" for more information.\n\n- Select the\
    \ folder or file you want to copy.\n- Drag the file or folder over the folder\
    \ icon or window you want to copy to.\n- Select **Copy** in the contextual menu.\n\
    - The folder or file is copied to the new location.\n\n## Task 7: Moving a File\
    \ or Folder\n\nYou can move a file or folder to another folder or to the desktop\
    \ so that you can reorganize your directory structure. For example, you might\
    \ want to move all related files and folders to the same folder on your hard disk\
    \ so you can find them more easily.\n\n- **Moving Folders**\n\n  Moving a folder\
    \ also moves its contents to the new location.\n\n- **Use the mv Command**\n\n\
    \  Choosing the **Move** command from the Edit menu is equivalent to using the\
    \ mv command in a Terminal window.\n\n- Select the folder or file you want to\
    \ move.\n- Drag the file or folder over the folder icon or window you want to\
    \ move to.\n- Select **Move** in the contextual menu.\n- The file is moved.\n\n\
    ## Task 8: Creating a Folder\n\nWorking with files and folders is easier if you\
    \ group related files into folders. For example, you might want to create a folder\
    \ in your word-processing program's folder to hold all the documents you create\
    \ with that application. Creating a folder enables you to separate your document\
    \ files from the application's files on your hard disk.\n\n- **The mkdir Command**\n\
    \n  Choosing the **New Folder** command from the **File** menu is equivalent to\
    \ using the mkdir command in a Terminal window.\n\n- **Modifying Permissions**\n\
    \n  Right-click any file or folder and choose **Properties** to view and modify\
    \ its permissions. File and folder permissions allow different users read or write\
    \ access to files or folders.\n\n- Open the window where you want to create the\
    \ new folder.\n- Click **File** and select the **New** command, and then click\
    \ **Folder**.\n- Type a name for the new folder. Click **OK**.\n- The new folder\
    \ appears in the drive window.\n\n## Task 9: Finding Files and Folders\n\nAfter\
    \ you have worked with several applications, surfed hundreds of Web sites, and\
    \ created more documents than you can count, your computer will be filled with\
    \ many files and folders that can make locating a particular file or folder on\
    \ your disk very time-consuming. The Find command comes in handy and helps you\
    \ locate specific files or folders by name, date, location, and so on.\n\n- **The\
    \ grep Command**\n\n  You can search through the contents of a file by using the\
    \ grep command in a Terminal window. You also can search for files or processes\
    \ by using the pipe command with grep; for example, ps -ef | grep kde.\n\n- **The\
    \ Find Command**\n\n  Using the Find command in a Terminal window is equivalent\
    \ to using the Find command in the Find Files application.\n\n- Click the **K**\
    \ icon in the KPanel menu, and select **Find Files**.\n- Type one or two words\
    \ you want to search for. Enter the path or directory in which you want to search.\n\
    - Click the Start Search button, or press Ctrl+F.\n- Search results appear in\
    \ the bottom half of the Find Files window. Double-click an item in the results\
    \ window to open the folder or file.\n\n## Task 10: Performing Advanced Searches\n\
    \nIf you've ever searched for something on the Internet, you've probably seen\
    \ a long list of items in which most items have absolutely nothing in common with\
    \ the file or folder you're looking for. Advanced searches help you focus a search\
    \ on specific criteria of a file or folder.\n\n**Looking for Files**\n\nLocating\
    \ files and folders can be easier if you use longer or more descriptive names\
    \ for files and folders.\n\n**Locating and Access**\n\nYou can locate files or\
    \ folders you do not have access to open. For more information about configuring\
    \ login accounts, see Part 7, Task 4, \"Managing Users.\"\n\n**At Least/At Most**\n\
    \nIf you want to search for a range of file sizes, select At Least, At Most, or\
    \ (none) from the pop-up menu, and type in a file size. Then click the Start Search\
    \ button to begin the search.\n\n- Click the **Advanced** tab in Find Files.\n\
    - Select a specific search criteria from the **Of type** drop-down list.\n- Type\
    \ one or two words you want to search for. Click the Start Search button.\n- Review\
    \ the items in the results window. Double-click an item to view it, or click the\
    \ Properties button to view more information about an item.\n\n## 3\n\n## Using\
    \ Applications in Linux\n\nAny program you run in Linux is an application. For\
    \ example, the command-line window is a Bash shell application. WordPerfect is\
    \ a commercial application available for Caldera Linux 2.2. With WordPerfect,\
    \ you can create word-processing documents that are compatible with other word-processing\
    \ applications for Linux or Windows.\n\nLinux applications running in the K development\
    \ environment are similar to Windows and Mac applications. They are easy to open\
    \ and use, and enable you to create and save documents. You can also rename any\
    \ document file or save to a variety of locations on your hard disk or floppy\
    \ disk. You can open a file at any time to view, edit, or print it. This part\
    \ covers some application basics, and then focuses on how to use WordPerfect and\
    \ other applications installed with Caldera Linux 2.2. For more information about\
    \ how to install WordPerfect, see Part 7, Task 3, \"Installing Applications.\"\
    \n\n## Tasks\n\n| Task # | | Page # |\n| --- | --- | --- |\n| 1 | Starting an\
    \ Application from the K Menu | 38 |\n| 2 | Starting an Application from a Shortcut\
    \ Icon | 39 |\n| 3 | Switching Between Applications | 40 |\n| 4 | Closing an Application\
    \ | 41 |\n| 5 | Saving a Document | 42 |\n| 6 | Opening a Document | 43 |\n| 7\
    \ | Creating a New Document | 44 |\n| 8 | Closing a Document | 45 |\n| 9 | Selecting\
    \ Text | 46 |\n| 10 | Copying Text | 47 |\n| 11 | Capturing a Screen | 48 |\n\
    | 12 | Working with Documents | 50 |\n| 13 | Working with Graphics Files | 52\
    \ |\n| 14 | Hiding a Document | 54 |\n| 15 | Moving Data Between Applications\
    \ | 56 |\n| 16 | Searching Documents | 58 |\n| 17 | Using Emacs | 60 |\n| 18 |\
    \ Using vi | 62 |"
  mdcn: "\n ## 任务 6：复制文件或文件夹\n\nLinux 让从命令行和 KDE 复制文件都变得简单。你可以将文件或文件夹复制到硬盘上的其他位置或软盘上。复制文件或文件夹会保持原始项目不变。你可以复制文件或文件夹来备份你的工作。\n\
    \n**cp 命令**\n\n从\"编辑\"菜单选择\"复制\"和\"粘贴\"等同于使用 cp 命令。\n\n**创建快捷方式**\n\n你可以通过将文件拖到目标窗口并在弹出菜单中选择\"\
    链接\"来创建指向该文件的链接或快捷方式。新创建的链接是一个指向其原始文件/文件夹的文件。\n\n**删除副本**\n\n请记住，你复制的是整个文件夹及其内容。如果不需要该副本，可以将其删除。更多信息请参阅任务\
    \ 5\"删除文件或文件夹\"。\n\n- 选择你要复制的文件夹或文件。\n- 将文件或文件夹拖到你要复制到的文件夹图标或窗口上。\n- 在上下文菜单中选择**复制**。\n\
    - 文件夹或文件被复制到新位置。\n\n## 任务 7：移动文件或文件夹\n\n你可以将文件或文件夹移动到其他文件夹或桌面，以便重新组织目录结构。例如，你可能希望将所有相关文件和文件夹移动到硬盘上的同一个文件夹中，以便更容易找到它们。\n\
    \n- **移动文件夹**\n\n  移动文件夹会同时将其内容移动到新位置。\n\n- **使用 mv 命令**\n\n  从\"编辑\"菜单选择**移动**命令等同于在终端窗口中使用\
    \ mv 命令。\n\n- 选择你要移动的文件夹或文件。\n- 将文件或文件夹拖到你要移动到的文件夹图标或窗口上。\n- 在上下文菜单中选择**移动**。\n\
    - 文件被移动。\n\n## 任务 8：创建文件夹\n\n如果将相关文件分组到文件夹中，处理文件和文件夹会更加容易。例如，你可能希望在文字处理程序的文件夹中创建一个文件夹，以存放使用该应用程序创建的所有文档。创建文件夹可以让你将文档文件与硬盘上的应用程序文件分开。\n\
    \n- **mkdir 命令**\n\n  从**文件**菜单选择**新建文件夹**命令等同于在终端窗口中使用 mkdir 命令。\n\n- **修改权限**\n\
    \n  右键单击任何文件或文件夹，选择**属性**以查看和修改其权限。文件和文件夹权限允许不同用户对文件或文件夹具有读取或写入访问权限。\n\n- 打开你要在其中创建新文件夹的窗口。\n\
    - 单击**文件**，选择**新建**命令，然后单击**文件夹**。\n- 输入新文件夹的名称。单击**确定**。\n- 新文件夹出现在驱动器窗口中。\n\n\
    ## 任务 9：查找文件和文件夹\n\n在你使用了多个应用程序、浏览了数百个网站、创建了数不尽的文档之后，你的计算机将充满许多文件和文件夹，这会使在磁盘上找到特定文件或文件夹非常耗时。\"\
