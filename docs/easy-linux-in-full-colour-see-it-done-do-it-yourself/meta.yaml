    When you send or reply to email, you can include a signature to provide more information
    about yourself. A signature generally consists of your name, email address, and
    company name or organization. Some folks attach a quote or HTML code to their
    signature to play a song from their Web site to customize their signature beyond
    the basics.


    +   5. Type your name and complete email address into the corresponding fields.


