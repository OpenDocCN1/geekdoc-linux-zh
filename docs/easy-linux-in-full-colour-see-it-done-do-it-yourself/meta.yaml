  md: '# Task 14: Logging Out


    When you are finished working with OpenLinux, log out of your account. If you
    are sharing your PC with other users, logging out allows others to use the computer
    while you aren''t. Powering off Linux is a two-step process. First log out, and
    then shut down your computer.


    **WARNING**

    Always log out and shut down your computer. Do not pull the power cable out of
    the back of your computer to turn it off. If you do not shut down your computer
    properly, you can damage hardware or software settings.


    ![](img/28e2bccabaf327178ce9997934f991d9_31_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_31_1.png)


    +   1. Click the **K** button, and choose **Logout**, or press the **X** button
    in the KPanel bar.

    2. A dialog appears showing you open applications on your desktop. Click **Logout**.
    The login dialog appears.'
  merge: -1
  pgno: 31
- img_proc: true
  md: "# Task 15: Shutting Down the Computer\n\nBecause a computer consists of both\
    \ hardware and software, when you want to power off, you must turn off or shut\
    \ down your software before you turn off your hardware. Powering off your computer\
    \ is a two-step process with Linux. First log out of your Linux account, and then\
    \ select **Shutdown** from the login window.\n\n+   - **Console Mode**\n  Choose\
    \ **Console Mode** to start up Linux without auto-starting KDE.\n\n- **The shutdown\
    \ Command**\n  If you did not use KDE with Linux, you can shut down by typing\
    \ a couple command lines. First, type **sync**, press Enter, type **sync**, and\
    \ press Enter. Finally, type **shutdown -h now** to end your OpenLinux session.\n\
    \n- **Reboot Command**\n  Press Command+Alt+Delete or type **shutdown -r now**\
    \ to warm boot Linux.\n\n+   1. At the Login/Logout prompt, click the **Shutdown**\
    \ button.\n2. Select **Shutdown**.\n3. Click **OK**."
  merge: -1
