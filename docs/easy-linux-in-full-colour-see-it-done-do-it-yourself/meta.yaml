- md: " - 4. Type the GMT time into the **Timezone is GMT** field. Next, choose your\
    \ **Daylight Saving is** time preference. Then click **Done**.\n- 5. Click **View**\
    \ and select **Day**.\n- 6. Click on a day on the calendar and click a time in\
    \ the Day View window. Type an appointment or other calendar event. Click **Done**\
    \ until you return to the main calendar window.\n\nListen to music while you work\
    \ by playing an audio CD with Linux. If your PC has a CD or DVD player, headphone\
    \ jacks, or a sound card with external speakers, insert an audio CD and open the\
    \ CD Player application to enjoy music while you work.\n\n## Audio CD Controls\n\
    \nIf you have used a consumer audio CD player, the controls in the CD Player application\
    \ work in a similar way. Press Play to start the CD. Press Stop or Pause to stop\
    \ the CD. Click the Loop CD button to continuously play the CD.\n\n## Task 7:\
    \ Playing an Audio CD\n\n- 1. Insert an audio CD into your PC's CD-ROM or DVD-ROM\
    \ drive. Click the K button, select **Multimedia**, and then choose **CD Player**.\n\
    - 2. Click the Play button to start playing the first track of the audio CD.\n\
    - 3. Click the Skip buttons to move to the previous or next audio tracks.\n- 4.\
    \ Click the Dialog button to edit the album title and track information.\n- 5.\
    \ Type the audio disk title and any audio track names into their respective text\
    \ fields in the CD Database Editor window. Then click the **Save** button.\n-\
    \ 6. Select a track from the drop-down menu.\n- 7. Adjust the volume of the audio\
    \ by dragging the slider knob.\n\n## More CD Players\n\nThere are other audio\
    \ CD players for Linux. Go to ftp://sunsite.unc.edu/pub/Linux/apps/sound/cdrom\
    \ for links to more CD Player applications for your computer.\n\n## Task 8: Playing\
    \ MIDI or Karaoke Files\n\nAs an alternative to listening to audio CDs, you can\
    \ download Musical Instrument Digital Interface (MIDI) and karaoke files from\
    \ the Internet. Caldera Linux enables you to play these files with the Midi/Karaoke\
    \ Player.\n\n**KMidi Player**\n\nClick the K button, select Multimedia, and choose\
    \ Midi player. KMidi Player has a user interface similar to the CD Player application.\
    \ You can also right-click a MIDI file to open it with KMidi.\n\n- 1. Click on\
    \ the **K** button, select **Multimedia**, and then choose **Midi/Karaoke Player**.\n\
    - 2. Click on a karaoke file and drag it into the KMid window. In this case I've\
    \ chosen **1999.KAR**.\n- 3. The karaoke file information appears in the KMid\
    \ window.\n- 4. Click the Play button to listen to the karaoke or MIDI file.\n\
    - 5. Click the Show Volume button to adjust the playback volume for the selected\
    \ file.\n\n## More Karaoke and MIDI Files\n\nGo to ftp://ftp.midifarm.com/pub/midifiles/karaoke/albums/\
    \ for more karaoke files. For MIDI files, visit http://www.midifarm.com/pub/midifiles.\n\
    \n## Task 9: Playing Sound or Movie Files\n\nUse the **Media Player** or a terminal\
    \ window to play sound or movie files. Many more media player applications are\
    \ available on the Internet as well. This section shows you how to use the Media\
    \ Player and **Xanim** to play back sound files and QuickTime movie files.\n\n\
    **What's MPEG?**\n\nMPEG is a standard format used to create and play back moving\
    \ image files on a computer. **MPEG1** was the original format for this standard.\
    \ **MPEG2** is most commonly used with DVD-Video movie titles. **MP3** is the\
    \ audio component of MPEG2. You can play back CD-quality audio **MP3** files on\
    \ your computer.\n\n- 1. Click on the **K** button, choose **Multimedia**, and\
    \ then select **Media Player**.\n- 2. Click **File** and choose **Open**.\n- 3.\
    \ Select an audio file to play. In this case, I've chosen **organum.wav**. Click\
    \ the **OK** button and listen to the music play.\n- 4. Click the K button, choose\
    \ Utilities, and click Terminal.\n- 5. Go to a directory with a QuickTime file.\
    \ In this case it's /root/Desktop/Sample.mov. Type xanim sample.mov.\n- 6. Watch\
    \ the QuickTime movie play. Click Stop to stop the movie, or click Play to start\
    \ the movie.\n\n## Why Does the Movie Look Bad?\n\nYou might need to set the color\
    \ depth for your monitor to thousands of colors to improve the playback appearance\
    \ of a movie file.\n\nTo change the resolution, log out of KDE, click Shutdown,\
    \ and then choose console mode. Type kde --bpp 16 to change the color depth to\
    \ thousands of colors. You can also try -bpp 24 or -bpp 32 to increase the number\
    \ of colors you can view on your screen.\n\n## Task 10: Using Paint\n\nUse Paint\
    \ to create art or edit a graphics file, such as a JPEG for your Web page or art\
    \ files from other applications. You can add lines, shapes, and colors, as well\
    \ as alter the original items and colors in a file.\n\n- 1. Click the **K** button\
    \ and choose **Graphics**, and then select **Paint**.\n- 2. Click on a tool in\
    \ the toolbar or click on the **Tool** menu to select a tool. Draw with your selected\
    \ tool in the Paint window.\n- 3. Click on a color button to open the Select Color\
    \ dialog box.\n- 4. Click on a color you want to use, and then click **OK**.\n\
    - 5. Click **File** and choose **Save Image As**.\n- 6. Type a name for the file\
    \ you want to save. Then click **OK**.\n- 7. Click **File** and choose **Exit**\
    \ to close the application.\n\n> ### Image Formats\n> Select File and choose **Image\
    \ Format** to select the type of image file you want to save. Paint supports GIF,\
    \ JPEG, BMP, XBM, XPM, and PNM graphics file formats.\n\n## Experiment and Play\n\
    \nAs with most art, there are no rules. Don't be afraid to experiment with the\
    \ Paint tools or colors. Use the online Help system to find out more about how\
    \ to use Paint.\n\n## Task 11: Converting Graphics with GIMP\n\nAs you use graphics\
    \ files, notice that some graphics file formats contain a higher color depth of\
    \ an image you want to use on your Web page. You might decide you want to have\
    \ a smaller file footprint and use JPEG files instead of GIFs on your Web site.\
    \ This task shows you how to use GIMP, the GNU Image Manipulation Program.\n\n\
    - **The xv Command**\n  You can also use the **xv** tool to convert graphics files.\n\
    \n- **More About GIMP**\n  For more information about GIMP, go to http://www.gimp.org.\n\
    \n- 1. Click the **K** button, choose **Graphics**, and then select **GIMP**.\
    \ Click **OK** at the GIMP installation window. Then click **Continue** to start\
    \ the application.\n- 2. Click **File** and choose **Open**. In the welcome dialog,\
    \ click **Prev. Tip** or **Next Tip** to learn more about using GIMP. Click **Close**\
    \ to close the welcome dialog.\n- 3. Browse the directory list, select a file,\
    \ and click **OK**."
