    # Task 13: Looking Up a Help Topic in a Terminal Window


    # Start Here


    +   1. Click the **K** button, select **Utilities**, and then choose **Terminal**.


    +   2. Type **man ls** to view help about the ls, or list, command.


    +   3. Read through the help information by pressing the up or down arrow key.


    +   4. Press **q** to exit the man page.


    There''s also help for virtually all the commands you can type into a console
    or Terminal window. To view help for any command, type **man** followed by the
    command on which you want help information. Using man pages is a speedy way to
    figure out the best way to use a particular command.


    # Printing man Pages


    Click the **K** button, select **Utilities**, and choose **Console**. Type the
    man command you want, and then click **File, Print**.


    # WARNING


    If you are not sure what a particular command will do, test it on an expendable
    file or folder before executing the command on a larger scale.


    # End Task


