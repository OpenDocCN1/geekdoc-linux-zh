  md: '# Task 11: Using Dialog Window Controls


    ![](img/28e2bccabaf327178ce9997934f991d9_28_0.png)


    When you choose certain menu commands, a dialog box appears, enabling you to change
    OpenLinux controls or customize settings. Many different dialog boxes are used
    throughout KDE; however, most work virtually the same way.


    ![](img/28e2bccabaf327178ce9997934f991d9_28_1.png)


    # Dialog Controls


    Dialog boxes contain a variety of controls, such as radio buttons, sliders, check
    boxes, tabs, buttons, up/down arrows, and text fields. The settings you choose
    in a dialog box will be saved if you click the OK button.


    +   1. To use a list box, scroll through the list and click the item you want.

    2. To use a drop-down list box, click the arrow, and then select the item you
    want.

    3. To use a radio button, click it.'
