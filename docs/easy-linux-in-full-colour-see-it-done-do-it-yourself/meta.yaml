  md: '# Task 6: Viewing Current Tasks


    Every process, application, and file you open in Linux can be viewed in the Task
    Manager window. If your system performance appears to be slow, or if you want
    to kill a document window or application, use the Task Manager window.


    > **WARNING**

    Some tasks might be dependent on other tasks running. If you kill a task that
    is dependent on one or more other tasks, Linux might become unstable. Be sure
    to save any documents or files before killing a task.


    ![](img/28e2bccabaf327178ce9997934f991d9_199_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_199_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_199_2.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_199_3.png)


    +   1. Click the **K** button, select **System**, and then choose **Task Manager**.

    2. Click the **Processes List** tab to view some or all of the currently running
    processes.

    3. Click on a process, such as Konsole, and then click **Kill task** to terminate
    a task. Click **Refresh Now** to refresh the list of processes.'
  merge: -1
  pgno: 199
- img_proc: true
  md: '![](img/28e2bccabaf327178ce9997934f991d9_200_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_200_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_200_2.png)


    +   4. Click the **Processes Tree** tab to view running processes organized by
    file structure.


    +   5. Click the **Performance** tab to view **CPU load history** and **Memory
    usage history**.


    +   6. Click **OK** to save changes and exit the Task Manager window.


    # Viewing Information


    You can also use the task window to view general information about the tasks that
    are running with Linux. For example, you can see how long a process has been running,
    what percentage of the processor it''s using, and whether a particular process
    is active or sleeping.'
