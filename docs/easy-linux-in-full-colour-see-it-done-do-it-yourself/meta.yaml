  md: '# Task 16: Searching Documents


    In addition to searching for a file or folder on your hard disk, you can also
    search for text within a document using the Find Files application located in
    the KPanel menu. This task shows you how to search for text within text documents,
    which can be a time-saving way to locate a particular file, especially if you
    can''t remember the name of the file for which you are looking.


    > Finding Files

    For more information about finding file and folders, see Part 2, Task 9, "Finding
    Files and Folders."


    > Help with the Find Command

    For more information about Find, type man find in the Terminal window. Press the
    Enter key to scroll through the information. You also can follow the general parameters
    of find /root -name "*.txt" to search for text documents in the root path.


    ![](img/28e2bccabaf327178ce9997934f991d9_67_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_67_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_67_2.png)


    +   1. Click the K button and choose Find Files.

