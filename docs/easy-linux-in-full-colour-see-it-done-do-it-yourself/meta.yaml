  md: '# # Task 10: Changing the X11 Server


    The X11 server enables Linux to work with your graphics card and monitor and allows
    KDE to show you a desktop with a specific resolution. You configured these settings
    when you installed Caldera Linux 2.2 using the Lizard application. You can also
    use the Lisa application to change the resolution, and the graphics card or monitor
    settings.


    # ## Changing X11 Servers with Lisa


    You can install additional X11 servers with the Lisa application. In a command-line
    window, type lisa, and then select Software Package Administration. Use the up-
    and down-arrow keys to select Installation of additional software packages. Then
    insert the CD-ROM from this book and install any additional X11 software packages
    onto your hard disk.


    +   1. Click the **K** button and choose **Utilities**, and then select **Terminal**.

    2. Type **lisa** in the Terminal window. Then press Enter on your keyboard.

    3. Press **3** to select **System Configuration**, and then press Enter.

    4. Press **1** to select **Hardware Configuration**, and then press Enter.


    ![](img/28e2bccabaf327178ce9997934f991d9_132_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_132_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_132_2.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_132_3.png)'
