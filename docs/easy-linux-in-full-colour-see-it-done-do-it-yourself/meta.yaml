  md: "# Task 1: Starting an Application from the K Menu\n\nMost of the time you spend\
    \ using your computer will be with an application, also referred to as a program.\
    \ You can start an application in any number of ways, including from the K menu.\
    \ The K menu contains all the Linux applications installed by the Lizard Installer\
    \ Wizard.\n\n+   - **Closing the K Menu**\n  To close the K menu without choosing\
    \ an item, simply click outside the menu.\n- **Using the Terminal Window**\n \
    \ You can also start an application from a Terminal window by clicking File and\
    \ choosing Run. Type the filename of the application, such as xwp, and then click\
    \ OK to start the application.\n\n![](img/28e2bccabaf327178ce9997934f991d9_47_0.png)\n\
    \n![](img/28e2bccabaf327178ce9997934f991d9_47_1.png)\n\n![](img/28e2bccabaf327178ce9997934f991d9_47_2.png)\n\
    \n![](img/28e2bccabaf327178ce9997934f991d9_47_3.png)\n\n+   1. Click the **K**\
    \ button.\n2. Move your cursor to the **Applications** menu command (or any other\
    \ menu command with a submenu).\n3. Click the program group that contains the\
    \ application you want to start (in this case, **WordPerfect**).\n4. The application\
    \ starts in its own window."
  merge: -1
  pgno: 47
- img_proc: true
  md: '# Task 2: Starting an Application from a Shortcut Icon


    If you frequently use a certain application or document, you might want to be
    able to access it from the Desktop. To do so, you can set up a shortcut icon (covered
    in Part 7, "Setting Up Applications"), and then start the application or document
    by double-clicking its icon.


    ![](img/28e2bccabaf327178ce9997934f991d9_48_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_48_1.png)


    # Double-Click Help


    If nothing happens when you double-click the icon, or if the icon moves, it might
    be because you haven''t clicked quickly enough or because you clicked and dragged
    by accident. Be sure to press the mouse button twice quickly.


    +   1. Double-click the shortcut icon on the desktop (in this case, a shortcut
    to WordPerfect).

    2. The application starts and is displayed in its own window.'
  merge: -1
  pgno: 48
- img_proc: true
  md: "# Task 3: Switching Between Applications\n\nAlthough it is possible to create,\
    \ edit, and view any document with emacs or vi in Linux, you most likely will\
    \ work with more than one type of document in KDE. For example, you might want\
    \ to compare some software prices from a spreadsheet with information on a Web\
    \ site. Switching between applications enables you to share and compare data.\n\
    \n+   - **More Than One Desktop**\n  Unlike Windows or Mac OS, you can have anywhere\
    \ from two to eight desktops in Linux. This enables you to run several different\
    \ sets of tasks without cluttering your desktop.\n- **Using the Taskbar**\n  You\
    \ can tell which programs are open by looking at the taskbar. Each open program\
    \ is represented by a button that shows the application's icon and path.\n\n![](img/28e2bccabaf327178ce9997934f991d9_49_0.png)\n\
    \n![](img/28e2bccabaf327178ce9997934f991d9_49_1.png)\n\n![](img/28e2bccabaf327178ce9997934f991d9_49_2.png)\n\
    \n+   1. Start two applications and look at the taskbar. You should see a button\
    \ for each application. In this case, the **StarOffice** button is selected.\n\
    2. Click the button for the program you want to switch to (in this case, Netscape\
    \ Communicator).\n3. Netscape Communicator becomes the active application."
  merge: -1
