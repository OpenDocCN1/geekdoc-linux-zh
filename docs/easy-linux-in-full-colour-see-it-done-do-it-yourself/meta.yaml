    \n## www@FreeBSD.ORG\n\nCopyright © 1995-1997 FreeBSD Inc. All rights reserved.\n\
    \nIt leads to other problems as well—even hampering cooperation on software maintenance.\
    \ Normally when users change a GNU program to make it work better on a particular\
    \ system, they send the change to the maintainer of that program; then they work\
    \ with the maintainer, explaining the change, arguing for it and sometimes rewriting\
    \ it, to get it installed.\n\nBut people who think of themselves as \"Linux users\"\
    \ are more likely to release a forked \"Linux-only\" version of the GNU program,\
    \ and consider the job done. We want each and every GNU program to work \"out\
    \ of the box\" on Linux-based systems; but if the users do not help, that goal\
    \ becomes much harder to achieve.\n\nSo how should the GNU project respond? What\
    \ should we do now to spread the idea that freedom for computer users is important?\n\
    \nWe should continue to talk about the freedom to share and change software—and\
    \ to teach other users to value these freedoms. If we enjoy having a free operating\
    \ system, it makes sense for us to think about preserving those freedoms for the\
    \ long term. If we enjoy having a variety of free software, it makes sense for\
    \ to think about encouraging others to write additional free software, instead\
    \ of additional proprietary software.\n\nWe should not accept the splitting of\
    \ the community in two. Instead we should spread the word that \"Linux systems\"\
    \ are variant GNU systems—that users of these systems are GNU users, and that\
    \ they ought to consider the GNU philosophy which brought these systems into existence.\n\
    \nThis article is one way of doing that. Another way is to use the terms \"Linux-based\
