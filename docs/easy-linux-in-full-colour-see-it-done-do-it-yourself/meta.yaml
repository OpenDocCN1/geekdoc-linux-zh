  md: '# # Task 2: Configuring KPanel


    The most powerful visual component of KDE is the KPanel. It is a movable taskbar
    located at the bottom of the desktop. You can launch applications, access multiple
    desktops, and configure your KDE sessions to your liking. There are several controls
    on the panel: the K menu application starter, application shortcuts, pop-up menus,
    Logout, Screenlock, and Virtual Desktop buttons, and panel hide buttons on each
    end of the strip.


    ![](img/28e2bccabaf327178ce9997934f991d9_119_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_119_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_119_2.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_119_3.png)


    # **WARNING**


    It is possible to open one application or file more than once in Linux. If you
    double-click on an icon and nothing happens, wait a few seconds. Each time you
    double-click an icon it will start a new application window, and also probably
    slow down the start time for each application.


    +   1. Click on the KPanel icon, select **Panel**, and then select **Configure**.


    +   2. Click a radio button in the **Location** or **Style** section to choose
    the settings you want. Click the **Options** or **Disk Navigator** tab to change
    additional KPanel settings.


    +   3. Click on the **Desktops** tab to select the number of virtual desktops
    you want.


    +   4. Click **OK** to save your settings.


    ![](img/28e2bccabaf327178ce9997934f991d9_119_4.png)'
  merge: -1
  pgno: 119
- img_proc: true
  md: '![](img/28e2bccabaf327178ce9997934f991d9_120_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_120_1.png)


    5


    Right-click on any button in the KPanel and select **Move** to move an icon to
    a new location in the KPanel bar.


    6


    Select an application icon and drag it to the KPanel bar. A shortcut icon is created
    on the KPanel bar enabling you to start the application from the desktop.


    Adding an Application to the K Menu


    Left-click on the **K** button and select **Panel**, and then choose **Add Application**.
    Click on an application you would like to add to the KPanel menu. The next time
    you click on the **K** button, the application appears in the K menu.


    Adding an Icon to the KPanel Bar


    Click on an application icon and drag it to the KPanel menu. KDE creates a shortcut
    to the application and places the icon in the KDE toolbar for quick access.


    Default Button


    Click the **Default** button in the KPanel Configuration window to return KPanel
    to its original settings.'
  merge: -1
