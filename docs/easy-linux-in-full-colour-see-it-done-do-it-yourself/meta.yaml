- md: " # Tasks\n\n| Task # | Page # |\n|--------|--------|\n| 1. Adding Shortcuts\
    \ | 132 |\n| 2. Deleting Shortcuts | 133 |\n| 3. Installing Applications | 134\
    \ |\n| 4. Managing Users | 136 |\n| 5. Configuring Additional Processors | 138\
    \ |\n| 6. Managing Software with KPackage | 140 |\n| 7. Uninstalling Applications\
    \ | 141 |\n| 8. Managing File and Folder Access | 142 |\n| 9. Managing Software\
    \ with Lisa | 144 |\n| 10. Managing Services | 146 |\n| 11. Using the BASH Shell\
    \ | 148 |\n| 12. Scheduling Applications | 150 |\n| 13. Automating Applications\
    \ with Shell Scripts | 152 |\n\n## Task 1: Adding Shortcuts\n\nYou can create\
    \ a shortcut to a document or application and place it in a folder window or on\
    \ the desktop to provide fast access to it. Double-click a shortcut to start an\
    \ application or open a document.\n\n### Moving the Original\n\nYou can move the\
    \ originaljakieś original file or folder to a new location on the hard disk, and\
    \ the shortcut will continue to work.\n\n### Shortcuts and Windows\n\nYou can\
    \ also drag a file to another casafranke task. Click **Link** to create a shortcut\
    \ in a folder window.\n\n### Alias of an Alias\n\nA shortcut can also be called\
    \ an alias, a link, or a symbolic link.\n\n1. Select a file or folder icon.\n\
    2. Drag it to the desktop.\n3. Click **Link** in the pop-up menu.\n4. A shortcut\
    \ is created in the destination window. Double-click the shortcut icon to start\
    \ the file.\n\n## Task 2: Deleting Shortcuts\n\nShortcuts provide speedy access\
    \ to frequently used files and folders. As your needs change, so do your shortcut\
    \ icons. For example, as your desktop becomes cluttered with old and new shortcuts,\
    \ you can delete those you no longer use.\n\n1. Right-click the shortcut icon\
    \ and select **Move to Trash**.\n\n2. Right-click the **Trash** icon and choose\
    \ **Empty Trash Bin** to delete the shortcut.\n\n**Original File**\nDeleting a\
    \ shortcut does not affect the original file or folder.\n\n## Task 3: Installing\
    \ Applications\n\nMost software applications can be installed using rpm, Red Hat's\
    \ package manager. To view a list of installed software maintained by rpm, go\
    \ to /var/lib/rpm.\n\n- **Installing WordPerfect**\n  If you did not select the\
    \ Recommended, plus commercial installation option in Lizard, you can install\
    \ WordPerfect using KPackage. You also can click the WordPerfect icon at cdrom/Packages/RPMS,\
    \ and then click Install.\n\n- **Command-Line Shortcut**\n  To launch KPackage\
    \ from a Terminal window, click the K button, select Utilities, and choose Terminal.\
    \ Type su -c \"kpackage\" to start the KPackage application.\n\n1. Click the K\
    \ button, select Utilities, and then choose kpackage.\n2. View installed packages\
    \ and folders by collapsing or uncollapsing folder icons in the KPackage window.\
    \ Click on a package to select it.\n3. Click File List to view a file list for\
    \ a package.\n4. Insert the CD included with this book into your PC. Open a Terminal\
    \ window, and type su -c \"mount /mnt/cdrom\".\n\n**WARNING**\nBe sure only one\
    \ copy of KPackage is running. If more than one copy is running at the same time,\
    \ your package will not be installed.\n\n**WARNING**\nBe sure to read about a\
    \ package before you install it. Some packages rely on other software packages\
    \ to be installed in order to start correctly.\n\n5. Click **File** and choose\
    \ **Open**.\n\n6. Type **/mnt/cdrom/Packages/RPMS** in the **Location** field.\
    \ Press Enter.\n\n7. Select a package you want to install. Then click **OK**.\
    \ (In this case, I've selected WordPerfect 8.0.)\n\n8. Click **Install** in the\
    \ Install Package window to finish the installation. Select the package from the\
    \ menu to start it. (Type **xwp** in a Terminal window to start WordPerfect.)\n\
    \n**What's rpm?**\nType **man rpm** to find out more information about rpm, the\
    \ Red Hat package manager.\n\n## Task 4: Managing Users\n\nIf more than one person\
    \ uses your PC, you will want to create a separate account for each user. You\
    \ might also want to personalize certain KDE settings for each person. For example,\
    \ you can customize the login screen with a message, ask users to change their\
    \ passwords on a regular basis, or give them access to certain folders and Rosa\
    \ on the hard disk. This task covers managing users from a Terminal window, and\
    \ shows you how to use the KDM Configuration tool.\n\n**WARNING**\n\nAlthough\
    \ Linux supports multiple users, Caldera recommends that you create only the COAS\
    \ user account during installation. Use COAS to create additional accounts after\
    \ the installation is complete.\n\n**COAS**\n\nYou can also add, edit, and delete\
    \ users with COAS. Click the **COAS** button, select **System**, and then choose\
    \ **Accounts** to launch the user account application.\n\n1. Click the K button\
    \ and select **Utilities**. Then click **Terminal**.\n2. Type **useradd** or **man\
    \ useradd** and press Return to view the options for this command.\n3. Click the\
    \ K button, select **Settings**, choose **Applications**, and then choose **Login\
    \ Manager**.\n4. Click the **Users** tab, and then click on a user account in\
    \ the **All users** window list.\n5. Click the **Appearance** tab and type a **Greeting\
    \ string**, or click the **KDM logo** to select a new image file for the login\
    \ dialog window.\n6. Click the **Background** tab to change the wallpaper that\
    \ appears with the login window.\n7. Click the **Fonts** tab and click the **Change\
    \ font** button to change the font for the greeting, fail, or safe dialog windows.\n\
    8. Click the **Sessions** tab to add or remove any type of login account or login\
    \ session from the KDE login window.\n\n### usermod and userdel Commands\n\nYou\
    \ can also use usermod and userdel to edit and remove user accounts. Type **useradd\
    \ guest** to add a user account named guest. Type **usermod -p password guest**\
    \ to add a password to the guest account.\n\n### Groups\n\nYou can create accounts\
    \ and put them into a group to share access to a set of common files and folders.\
    \ To create a group named intro with a group id of 101, type **groupadd -g 101\
    \ intro** in a Terminal window. You can use **groupmod** and **groupdel** to edit\
    \ and delete groups.\n\n### The passwd Command\n\nYou can change your password\
    \ at any time by using the passwd command. Type the command and press Enter. The\
    \ Terminal window will ask you for your new password. Don't forget what it is!\n\
    \n## Task 5: Configuring Additional Processors\n\nAs a default, Linux is configured\
    \ to work on a single-processor PC. If you have a PC with two or more processors,\
    \ you must modify the makefile and recompile the sources for the kernel to take\
    \ advantage of shared multiple processors (SMP).\n\n**WARNING**\n\nTo configure\
    \ OpenLinux to work with multiple processors, you must recompile some of the source\
