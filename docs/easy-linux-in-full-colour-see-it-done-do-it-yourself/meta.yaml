    ### 关于 BASH 的更多信息


    本书中使用的所有终端窗口命令都在 BASH shell 中运行。本书中的许多任务包含提示，这些提示使用命令行作为 KDE 界面的替代来执行命令。


    单击终端窗口。然后输入 **history** 并按 Enter。


    先前输入的命令列表将显示在终端窗口中。


    ## 任务 12：调度应用程序


    Crontab 是 Linux 自带的一个方便工具，可让您调度重复性任务，例如启动应用程序或检查硬盘可用空间量。本任务将向您展示如何创建一个 cron 任务，使用
    tar 应用程序备份特定目录。


    ### 自动启动


    对于特定登录账户，您可以将应用程序放入 AutoStart 文件夹。当快捷方式或应用程序位于 AutoStart 文件夹中时，它将在账户登录到 Linux
    后启动。


    **警告**


    在将任何脚本添加到 Crontab 之前，请务必手动运行它们以验证脚本是否按预期工作。


    - 1. 单击 **K** 按钮，选择 **Utilities**（实用工具），然后选择 **Terminal**（终端）。

    2. 转到目录路径 **/etc** 并输入 **ls**。

    3. 输入 **crontab -e** 打开 crontab 文件。它将在 vi 编辑器中打开。有关如何使用 vi 的更多信息，请参阅第 3 部分，任务
    18，"Using vi"（使用 vi）。

    4. 输入 a，然后输入 **0 0 1-5 * * tar cf /home/guest3/backp /home/guest3/CH***。按 Esc。然后按
    Shift+ZZ 保存并退出 crontab 文件。

    5. 在提示符处，输入 **crontab -l** 查看 crontab 文件的内容。前两个字段 **0** 和 **0** 表示运行任务的分钟（0-59）和小时（0-23）。我已选择午夜。


    ### 读取 Crontab 文件


    除了步骤 5 中提到的 0  außerd 和 0，第三个字段（1-5）是月份中的日期（1-31），第四个字段是月份（1-12）。第五个字段是星期几（0-6）。星号表示任何月份和任何星期几。任务本身调用
    tar 应用程序在第一个路径中创建新归档，并对第二个路径进行归档。


    ### 脚本


    例如，您可以创建 shell 脚本或 Perl 脚本来监控系统配置。然后创建一个 cron 任务以定期运行该 Perl 脚本。


    ### 步骤 4 注释


    此命令行在 /home/guest3 处创建名为 backp 的 tar 归档，包含所有以 CH 开头的文件。


    ## 任务 13：使用 Shell 脚本实现应用程序自动化


    包含 shell 命令的文件称为 shell 脚本。您可以使用 KDE 中的文本编辑器，也可以在终端窗口中使用 vi。您可以使用 shell 脚本在 shell
    应用程序打开文件时自动运行命令行。


    **Perl**


    Linux 附带的另一种流行且非常实用的脚本语言是 Perl 5.0。您可以创建新脚本或修改现有 Perl 脚本以自动化您的工作。要在 BASH 窗口中运行
    Perl 脚本，请键入 Perl 脚本的路径，然后输入 **perl** 后跟要运行的 Perl 脚本的名称。


    **警告**


    除了查找工具更新外，请记住在更新 Linux 中的一个或多个应用程序时，确保您的脚本仍然有效。


    - 1. 单击 **K** 按钮，选择 **Utilities**（实用工具），然后选择 **Terminal**（终端）。

    2. 输入 **vi myshellscript** 创建一个新的文本文件。

    3. 输入 **a** 追加到 overview.mdx 文件。然后输入 **ls *.txt**。

    4. 按 Escape 退出追加模式。然后按 Shift+ZZ 保存并退出 vi 编辑器。

    5. 输入 `sh myshellscript`。在终端窗口中查看 .txt 文件列表。


    - **自动启动 BASH Shell**


    如果不希望输入 sh 来启动脚本，请在任何 BASH shell 脚本的第一行输入 #!/bin/sh。


    - **警告**


    要运行 shell 脚本，登录账户必须有权访问该文件。右键单击文件并选择 **Properties**（属性），然后选择 **Permissions**（权限）选项卡以配置
    shell 脚本的文件访问权限。


    - **Ctrl 命令**


    在终端窗口中按 Ctrl+C 取消脚本。按 Ctrl+Z 停止脚本。


    ## 使用 Linux 附件


    除了 WordPerfect 之外，Caldera 的 Linux 还安装了许多附件应用程序。这些附件执行特定任务，例如播放音频 CD、存储笔记或查看图像文件。本部分涉及的附件包括计算器、记事本、绘图程序、游戏和媒体播放器。

    '
