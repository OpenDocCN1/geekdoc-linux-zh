  md: "# Task 3: Printing Graphics Files\n\nPrinting a graphics file is similar to\
    \ printing a text file if you're in KDE. Most image files can be opened with the\
    \ Kview application. You can also use tools such as gv, gimp, xv, xfig, tgif,\
    \ and display to work with and eventually print graphics files. This task shows\
    \ you how to print a JPEG file with Kview.\n\n+   - **The Cancel Button**\n  If\
    \ you change your mind about printing, you can always click the Cancel button\
    \ in the Kview window.\n- **The gv Tool**\n  You can also print graphics from\
    \ a Terminal window. The general format of the command is `gv /opt/kde/share/wallpapers/berries.jpg`.\
    \ Type `man gv` for more information about how to print with the gv tool.\n\n\
    Click on an image file, such as a .jpg or .gif file. In this case, I chose **berries.jpg**.\n\
    \nThe file opens.\n\nClick **File** and choose **Print**.\n\nSelect the paper\
