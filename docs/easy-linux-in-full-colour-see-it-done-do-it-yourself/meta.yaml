  md: '# # Installation Instructions


    To boot from a CD-ROM:


    +   1. Insert the CD-ROM into the CD-ROM drive.


    +   2. Restart your computer.


    +   3. You might need to change your BIOS settings to boot from the CD-ROM. Typically,
    you enter your BIOS setup program with the F2 or Del keys.


    +   4. Make your changes (if any) and exit the BIOS setup utility.


    +   5. If your CD-ROM drive is capable of booting from CD-ROMs, you will boot
    into the Caldera setup program.


    +   6. Follow the onscreen prompts to complete the installation.


    To install from DOS or Windows 95 or 98:


    +   1. If you are in Windows 95 or Windows 98, go to **Start**, **Restart the
    Computer in MS-DOS Mode**.


    +   2. Navigate to your CD-ROM drive and go to the \\COL\\LAUNCH\\DOS directory.


    +   3. Type **INSTALL** and press Enter.


    +   4. Your computer will start the Caldera setup program.


    +   5. Follow the onscreen prompts to finish the installation.


    To install from boot floppies:


    +   1. While in DOS or Windows, format two 1.44MB floppies or one 2.88MB floppy.


    +   2. Navigate to your CD drive and go to the \\COL\\LAUNCH\\FLOPPY directory.


    +   3. Type **RAWWRITE3** and press Enter.


    +   4. When prompted to do so, type **INSTALL.144** if you are using 1.44MB floppies
    or **INSTALL.288** if you are using a 2.88MB floppy, and press Enter.


    +   5. When prompted to do so, type the drive letter of the disks you are going
    to prepare, and press Enter. Because you are going to be booting from this disk,
    it''s typically **A:**.


    +   6. If you are creating a 1.44MB boot disk, you must create a second disk.
    Repeat step 3. When prompted to do so, type **MODULES.144** and press Enter.'
