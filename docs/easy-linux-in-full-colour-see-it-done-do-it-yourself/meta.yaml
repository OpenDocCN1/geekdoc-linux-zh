  md: '# # Task 9: Playing Sound or Movie Files


    Use the **Media Player** or a terminal window to play sound or movie files. Many
    more media player applications are available on the Internet as well. This section
    shows you how to use the Media Player and **Xanim** to play back sound files and
    QuickTime movie files.


    **What''s MPEG?**

    MPEG is a standard format used to create and play back moving image files on a
    computer. **MPEG1** was the original format for this standard. **MPEG2** is most
    commonly used with DVD-Video movie titles. **MP3** is the audio component of MPEG2.
    You can play back CD-quality audio **MP3** files on your computer.


    +   1. Click on the **K** button, choose **Multimedia**, and then select **Media
    Player**.

    2. Click **File** and choose **Open**.

    3. Select an audio spectral to play. In this case, I''ve chose **organum.wav**.
    Click the **OK** button and listen to the music play.


    ![](img/28e2bccabaf327178ce9997934f991d9_179_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_179_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_179_2.png)'
  merge: -1
