  md: "# Task 11: Changing the System Date and Time\n\nThe current date and time are\
    \ displayed in the KPanel bar. You can use the Lisa application to change the\
    \ time settings for Linux. KDE enables you to customize how the date and time\
    \ appear in the KPanel bar, too.\n\n+   - Changing Time with Lisa\n  If you decide\
    \ to change the time zone for your PC, go to a command-line window and type lisa.\
    \ Select System Configuration, and then choose Configure Time Zone. Choose either\
    \ GMT or Local time, and use the up- or down-arrow keys to select the time zone\
    \ for your location.\n- Shortcut\n  Press Ctrl+O to select the Options tab in\
    \ the KPanel Configuration window.\n\n![](img/28e2bccabaf327178ce9997934f991d9_135_0.png)\n\
    \n![](img/28e2bccabaf327178ce9997934f991d9_135_1.png)\n\n![](img/28e2bccabaf327178ce9997934f991d9_135_2.png)\n\
    \n1. Right-click the bottom portion of the KPanel bar and choose Panel, Configure.\n\
    \n2. Click the Options tab.\n\n3. Click Clock shows time in AM/PM format if you\
    \ do not want 24-hour time to appear in the KPanel bar."
  merge: -1
  pgno: 135
