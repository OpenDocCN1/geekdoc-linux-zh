  md: '# Task 18: Using vi


    vi, pronounced vee-eye, is one of the text-editing applications included with
    Linux. You can start vi from a Terminal window. vi operates in two modes, Command
    mode and Insert mode. You can control the cursor, delete characters, and save
    files in Command mode. In Insert mode, you can insert characters (or substitute
    or delete characters). This task covers only a few basic vi commands.


    ![](img/28e2bccabaf327178ce9997934f991d9_71_0.png)


