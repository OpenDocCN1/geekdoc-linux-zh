  md: '![](img/28e2bccabaf327178ce9997934f991d9_136_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_136_1.png)


    +   4. Click **Clock shows time in Internet beats** if you want to view Internet
    time in the KPanel bar.

    5. Click **OK** to save changes and exit the window.


    # Internet Time


    Internet time is a time format created by several Internet-savvy companies, such
    as Swatch and CNN. Internet time breaks up the traditional 24-hour day into 1,000
    equal parts to identify a particular time for an Internet event.


    # Default Button


    Click **Default** to return all KPanel configurations to their original settings.'
