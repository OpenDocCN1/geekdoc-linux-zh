    You can print man pages by typing man man | <program name> -b } lpr in a Konsole
    or Terminal window.


    **The Cancel Button**


    If you decide you''re not ready to print a document, click the **Cancel** button
    in the Kview window.


    +   1. Click on a text document. In this case, I''ve selected **FreeTheory.txt**.

    2. Click **File** and choose **Print**.

    3. Click **OK**.

    4. To print this same file from a command line, open a Terminal window and type
    **FreeTheory.txt**.'
