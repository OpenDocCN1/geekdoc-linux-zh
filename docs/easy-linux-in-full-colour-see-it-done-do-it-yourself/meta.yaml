    本书的每个部分都由一系列简短的教学课程组成，旨在帮助您理解充分利用计算机硬件和软件所需的基本信息。\n\n- **单击**：单击鼠标左键一次。\n- **双击**：快速连续单击鼠标左键两次。\n\
    - **右键单击**：单击鼠标右键一次。\n- **指针箭头**：突出显示屏幕上您需要在步骤或任务中指向或关注的项目。\n- **选中区域**：突出显示步骤或任务中讨论的屏幕区域。\n\
