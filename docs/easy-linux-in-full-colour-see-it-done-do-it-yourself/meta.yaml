    # 任务 1：阅读 HTML 和 PostScript 文件


    如果你已经熟悉 Web 浏览器，你可能已经注意到 KDE 的窗口与 Web 浏览器窗口的工作方式类似。文件夹和文件名是链接到硬盘上实际文件的链接。你可以在共享同一工具栏的窗口中打开
    HTML 或 PostScript 文件，该窗口也用于浏览硬盘上的文件夹和文件。


    ![](img/28e2bccabaf327178ce9997934f991d9_75_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_75_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_75_2.png)


    ## Ghostview 应用程序


    你可以使用 Ghostview (gv) 应用程序在桌面上查看 PostScript 文件。点击 **K** 按钮，选择 **Applications**，然后选择
    **GV** 来启动 Ghostview。


    1. 点击 KPanel 栏上的 Netscape Communicator 图标。

    2. 输入你想查看的 HTML 文件的路径。在本例中，我输入了 **file:/usr/doc/HOWTO/other-formats/html/**。在
    Netscape 浏览器窗口中点击一个文件名。

    3. 点击 KPanel 栏上的 Terminal 按钮。


    ![](img/28e2bccabaf327178ce9997934f991d9_76_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_76_1.png)


    ```

    cd /usr/doc/xv-3.10a/

    gv epsf.ps.gz

    ```


    输入 PostScript 文件的路径。在本例中，我输入了 **cd /usr/doc/xv-3.10a/**。输入 **gv epsf.ps.gz** 来查看
    PostScript 文件。


    文件随即打开。


    ## Lynx


    你也可以使用 **lynx** 命令从命令行查看 **HTML** 文件。点击 **K** 按钮，选择 **Utilities**，然后选择 **Terminal**
    打开终端窗口。输入 **lynx**，后跟文档或 **HTML** 文件名来查看文件。例如，输入 **lynx mynewdoc.txt** 在 lynx
    应用程序中查看文档 mynewdoc。


    ## 4


    有两种方法可以将你的 PC 连接到互联网。更快更简单的方法是在你的 PC 上安装网卡，然后将你的 PC 连接到支持互联网的网络。如果你在家里使用 PC，你很可能需要一个调制解调器。OpenLinux
    对可以使用的调制解调器非常挑剔。请确保拥有与 Hayes 兼容的调制解调器。


    ### PCI 和 WinModem


    目前，OpenLinux 不兼容 PCI 调制解调器卡或 WinModem。这意味着什么？OpenLinux 目前没有支持这些调制解调器的驱动程序。你可能需要购买一个外置调制解调器，才能使用
    Linux 连接到你的 ISP。


    # 任务 2：设置你的调制解调器连接


    ## 从这里开始


    ![](img/28e2bccabaf327178ce9997934f991d9_77_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_77_1.png)


    ![](img/28e2bccabaf327178ce999793ipher178ce9997934f991d9_77_2.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_77_3.png)


    1. 点击 KPanel 栏上的 Terminal 按钮。

    2. 在终端窗口中输入 **lisa**。然后按 Enter 键。

    3. 选择 **System Configuration**，然后选择 **Hardware Configuration**。使用上下箭头在屏幕菜单中选择项目。

    4. 选择 **Configure Modem**。


    ## 下一步


    ![](img/28e2bccabaf327178ce9997934f991d9_78_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_78_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_78_2.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_78_3.png)


    ## 选择串行端口


    如果你的 PC 上安装了 Windows，点击 **Start** 菜单，选择 **Control Panels**，然后选择 **Systems**。点击
    **Devices** 选项卡，然后选择调制解调器以查看 PC 上连接的调制解调器所使用的端口。在 OpenLinux 调制解调器配置中选择相同的端口。


    ## PCMCIA 调制解调器


    如果你在笔记本电脑上安装了 OpenLinux，请以 **root** 操作员身份登录，然后使用文本编辑器在 **/etc/sysconfig** 中创建一个名为
    **pcmcia** 的文件。有关 PC 卡的更多信息，请转到 **/usr/doc/pcmcia-cs**。


    文件应包含以下行：


    ```

    PCMCIA=yes

    PCIC=i82365

    OPTS="poll_interval=300"

    ```


    5. 选择 **Hayes-compatible modem**，然后按 Enter 键。

    6. 选择调制解调器连接的串行端口。按 Enter 键。

    7. 选择调制解调器支持的数据传输速率。然后按 Enter 键。

    8. 按 Escape 键直到退出 lisa 并返回到终端窗口。


    # 任务 3：设置你的互联网连接


    如果你有调制解调器，你必须有一个互联网服务提供商才能将你的 PC 连接到互联网。与互联网的连接使用点对点协议，称为 PPP。Linux 使用一个名为 KPPP
    的应用程序来存储 Linux 连接到互联网所需的所有信息。


    1. **KPPP 日志**：有关互联网连接的更多详细信息，点击 Connecting to: 对话框中的 **Log** 按钮。


    2. **多个 ISP**：如果你有多个互联网服务提供商，你可以配置 KPPP 连接到你在 KPPP 应用程序中创建的任意多个账户之一。每次切换到不同的互联网服务提供商账户时，你都需要输入相应的登录名和密码。


    点击 **K** 按钮，选择 **Internet**，然后选择 **Kppp**。


    点击 **Setup** 按钮。


    点击 **New**。


    点击 **Dial** 选项卡，然后输入你的 ISP 名称以及你将用于拨入 ISP 的电话号码。你的 ISP 应该提供这些信息。


    ![](img/28e2bccabaf327178ce9997934f991d9_79_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_79_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_79_2.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_79_3.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_80_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_80_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_80_2.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_80_3.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_80_4.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_80_5.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_80_6.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_80_7.png)


    5. 点击 **DNS** 选项卡，然后输入你的服务提供商的域名。将 ISP 的 DNS 地址添加到 **DNS Address List** 中。


    6. 点击 **OK** 返回 kppp Configuration 窗口。


    7. 点击 **Device** 选项卡。确保使用 **Modem Device** 菜单为你的调制解调器选择正确的串行端口。


    8. 再次点击 **OK** 返回 kppp 窗口。


    ## 登录脚本


    如果你使用的是全国性 ISP，如 Earthlink 或 Netcom，你可能不需要使用登录脚本进行连接。如果你的 ISP 需要登录或聊天脚本，它很可能在其网站上提供了示例。以下是一个通用的登录脚本，可能有效也可能无效：


    ```

    Expected: login:

    Send: mylogin

    Expected: password:

    Send: mypassword

    ```


    # 继续设置你的互联网连接


    ![](img/28e2bccabaf327178ce9997934f991d9_81_0.png)


    ## 查询你的调制解调器


    点击 **Modem** 选项卡并点击 **Query Modem**，检查 KPPP 是否能看到你的调制解调器。调制解调器特性列表会出现在 **Modem
    Query Results** 窗口中。如果 KPPP 无法看到你的调制解调器，或者 KPPP 认为调制解调器正忙，Linux 可能不兼容该调制解调器。


    ## 不要放弃！


    如果你第一次尝试时未能成功登录到你的 ISP 账户，没关系。再尝试连接几次。即使你拥有 56K 调制解调器，你也可以尝试将连接速度设置为 38600，看看这是否有助于
    Linux 连接到 ISP 的远程服务器。


    ![](img/28e2bccabaf327178ce9997934f991d9_81_1.png)


    9. 在 kppp 的 **Login ID** 和 **Password** 字段中输入你的账户名和密码。


    10. 点击 **Connect** 按钮。


    11. 等待调制解调器连接到你的互联网服务提供商。当你的 PC 连接后，连接窗口和任何打开的日志窗口将自动关闭。


    # 任务 4：检查你的互联网连接


    连接到互联网后，你可以打开其他应用程序、浏览网页、阅读电子邮件或查看互联网连接的状态。本任务向你展示如何查看有关互联网连接的信息。这有助于优化你的互联网体验，或排查未来系统可能出现的问题。


    ![](img/28e2bccabaf327178ce9997934f991d9_82_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_82_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_82_2.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_82_3.png)


    1. 点击任务栏中的 **Earthlink**（或你的 ISP）按钮。


    2. 点击 **Details** 按钮。


    3. 在 kppp Statistics 窗口中查看信息。


    4. 点击 **Close** 按钮退出窗口。


    ## 停止连接


    在 **Connect to:** 框中按 Cancel，以停止调制解调器拨入互联网。

    '
