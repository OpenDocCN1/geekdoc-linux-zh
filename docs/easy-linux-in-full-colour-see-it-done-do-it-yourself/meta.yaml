    - **vim**: Linux includes vim, vi improved. It is upward-compatible with vi and
    can be used to edit any ASCII text.

    - **The Tab Key**: Press the Tab key to auto-complete filnames in the Bash Terminal
    window.


    +   1. In a Terminal window, type **vi** followed by the filename to open a document
    with the vi editor.

    2. Press the down-, up-, left-, or right-arrow key to move around the document.

    3. Move the cursor to the end of a word, then press **a**, and then add any text
    to the document. Press Escape to exit Append mode.'
