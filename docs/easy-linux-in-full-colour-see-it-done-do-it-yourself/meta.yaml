    \ with Gimp | 174 |\n| 12 | Playing Games | 176 |\n\n##\n\n## Task 1: Taking Notes\
    \ with KJots\n\nAs you surf the Internet or read through man pages, you might\
    \ want to store snippets of information in one, easy-to-access document. KJots\
    \ enables you to create a book of notes, similar to a notepad of paper. You can\
    \ type, edit, and delete text as well as choose a font for your KJots notepad.\n\
    \n- **The Book Menu**\n  Click the Book menu to view a list of current books available\
    \ on your hard disk. Click on a book to open it in KJots.\n\n- **Shortcuts**\n\
    \  Press Ctrl+N to create a new book. Press Ctrl+S to save the current book.\n\
    \n1. Click the **K** button, select **Utilities**, and then choose **KJots**.\n\
    2. Click **File** and choose **New Book**, and then type a name for your note.\n\
    3. Click **Edit** and choose **New Page** to add a page to your notepad.\n4. Click\
    \ **Options** and select **Config**. Click the **Fonts** tab and then **Select**\
    \ to choose a font for the current book.\n\n## Task 2: Typing Text\n\nTo create\
    \ a new document, type the text you want to include into an open document window.\
    \ The insertion point indicates where text will be entered as you type.\n\nType\
    \ some text. Press the Backspace key to delete one character. You must press Enter\
    \ at the end of each line.\n\nTo end a paragraph and start a new one, press Enter\
    \ or Return. The insertion point moves to a new line.\n\n**Save Your Document**\n\
    \nBe sure to save your document periodically as you work on it. See Task 5, \"\
    Saving a Document,\" in Part 3, \"Using Applications in Linux.\"\n\n## Task 3:\
    \ Working with KNotes\n\nKNotes is a different kind of note-taking accessory.\
    \ It has a simpler user interface than KJots, and also enables you to choose a\
    \ color for each note you want to save. KNotes works similarly to paper sticky\
    \ notes.\n\n- **Right-Click a Note**\n  Right-click any note and choose Sticky\
    \ and the note will appear on each KDE virtual desktop.\n  Right-click a KNote,\
    \ choose To Desktop, and choose a specific virtual desktop to send a KNote to\
    \ a particular desktop.\n\n- **Options**\n  To change the font, background color,\
    \ foreground color, or KNotes commands, right-click Operations and choose Options,\
    \ and then select the menu command you want to use.\n\n1. Click the **K** button,\
    \ select **Utilities**, and then choose **KNotes**.\n2. Right-click on the note\
    \ and choose **Insert Date**. The date appears on the KNote page.\n3. Right-click\
    \ on a note, select **Operations**, and then choose **Alarm**.\n\n4. Click the\
    \ arrow controls to change the **Day**, **Month**, **Year**, or **Time** for which\
    \ you want to set the alarm for the selected note. Then click the **Set** button.\n\
    \n5. Right-click on a note, select **Operations**, and choose **New Note**.\n\n\
    6. Type some text. Notice the scrollbars appear as you add text. Press Enter to\
    \ start a new paragraph (KNotes does not line wrap). Click the Close box to save\
    \ and exit the note.\n\n### Note Colors\n\nEach note page in KNote can have a\
    \ unique color. To change the color of the KNote page, right-click a note, select\
    \ **Operations**, choose **Options**, and then choose **Colors**. Then select\
    \ **Background Color**. Click on a color in the color picker window. Click **OK**\
    \ to save the change. The selected note changes to the newly chosen color.\n\n\
    ## Task 4: Using Personal Time Tracker\n\nIf you like to measure the amount of\
    \ time it takes for Linux to run a task, or if you need a simple tool to track\
    \ billable hours for different projects, take a look at Personal Time Tracker.\n\
    \n### Sending Yourself Reminders\n\nYou can use the at command to send yourself\
    \ reminders. For example, to remind yourself of a meeting at 9:00, type at 9:00,\
    \ then press Enter. Then type xmessage -display :0.0 \"Time for the weekly meeting\"\
    , and press Enter. Press Ctrl+D to save the reminder.\n\n### Deleting a Task\n\
    \nTo remove a task, select any task, click Task, and choose Delete, or press Ctrl+D.\n\
    \n1. Click the K button, select **Utilities**, and then choose **Personal Time\
    \ Tracker**.\n2. Click **Task** and choose **New**, or press Ctrl+N.\n3. Type\
    \ a name for the task. Then click **OK**.\n4. The new task appears on the Personal\
    \ Time Tracker window.\n\n### Custom Command Keys\n\nClick File and choose Preferences\
    \ or press Ctrl+P to view the Preferences window. You can modify the menu command\
    \ shortcuts here. Click OK to close the Preferences window.\n\n### Crontab\n\n\
    Schedule regular tasks with the Crontab file. For more information on how to use\
    \ Crontab, see Task 12, \"Scheduling Applications,\" in Part 7, \"Setting Up Applications.\"\
    \n\n5. Click on a task in the main window. Then click the Start Clock button on\
    \ the toolbar.\n6. Click the Stop Clock button to stop tracking the selected task.\n\
    7. Click File and choose Exit to quit the application.\n\n### Calendars\n\nIf\
    \ you extracting habit to work with a calendar to take notes or schedule reminders,\
    \ see Task 6, \"Scheduling Appointments with Plan.\"\n\n## Task 5: Using a Calculator\n\
    \nIf you need to perform simple or complex calculations, use the Calculator application\
    \ included with Caldera Linux 2.2. You can do simple math, such as addition, subtraction,\
    \ multiplication, and division, as well as convert decimal to hex or calculate\
    \ sine, cosine, and so on.\n\n**X Calc**\n\nClick the K button, select Utilities,\
    \ and choose X Calc if you want to check out another multi-function calculator\
    \ included with Caldera Linux 2.2.\n\n**Statistical and Trig Modes**\n\nYou can\
    \ toggle between Trigonometry and Statistical modes by clicking the kCalc button\
