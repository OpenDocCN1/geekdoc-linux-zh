  - '[PAGE 85]


    Netscape Communicator is the name of Netscape''s browser product. However, Netscape
    has a unique name for each of its major components in Netscape Communicator. Netscape
    Navigator is Netscape''s name for the browser features in Netscape Communicator.
    Other features include Messenger, News Groups, and Composer. This task shows you
    how to start Netscape Communicator. As a default, it opens to Netscape Navigator.


    ![](img/28e2bccabaf327178ce9997934f991d9_85_0.png)


    # Task 6: Starting Netscape Communicator


    ![](img/28e2bccabaf327178ce9997934f991d9_85_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_85_2.png)


    # Command Line


    You can start Netscape Communicator from a Terminal window by typing netscape.
    Type netscape -help to view help information about Netscape commands.


    +   1. Click the Netscape Communicator icon in the KPanel bar.

    2. The Netscape browser window opens.'
  - '[PAGE 86]


    # Task 7: Typing an Address


    ![](img/28e2bccabaf327178ce9997934f991d9_86_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_86_1.png)


    +   1. In the Location bar, type the address of the site you want to visit. Then
    press Enter.

    2. Netscape Navigator displays the page associated with the URL you entered.


    An Internet address, also known as a uniform resource locator, or **URL**, identifies
    the location of a server connected to the Internet. A URL is made up of several
    components. First, the Web protocol **http://** must be included, then the domain
    name, such as **www.linux.org**. The extension to the domain name (usually **.com**,
    **.net**, **.gov**, or **.edu**) indicates the type of Web site (commercial, network,
    government, or educational, respectively). The domain name can also contain a
    path to a folder or file on the Internet server.


    **Case Sensitivity**


    Be sure to type a URL correctly into your browser''s address text field. You must
    type the periods, slashes, and other characters in the exact order or you will
    not be able to load the targeted Web site. Some URLs are also case sensitive.'
  - '[PAGE 87]


    # Task 8: Browsing with Links and Toolbar Buttons


    Information is easy to browse on the Internet because documents contain links
    to other pages and Web sites. Click a link to view the page to which the link
    points. You can use the Previous and Next arrow buttons转变为 return to the previous
    page and move back to the following page in the browser window. You can use the
    buttons in the browser''s toolbar as short-cuts to your home page or search page,
    or to print a Web page.


    ![](img/28e2bccabaf327178ce9997934f991d9_87_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_87_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_87_2.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_87_3.png)


    +   1. Go to a Web site, such as **http://www.yahoo.com**. Click on a link (in
    this case, I chose **Star Wars**).


    2. The Web page loads into the browser window.


    3. Click the **Back** button to return your previous page, and click the **Forward**
    button to return to this one.


    4. Click **Home** to return to the Caldera Info page.


    **Moving Toolbars**

    Click and drag a toolbar above or below another toolbar in the browser window
    to change the location of the toolbar.'
  - '[PAGE 88]


    # Task 9: Creating a Bookmark


    When you find a site you like or want to save to visit in the future, you might
    want a quick way to return to it without having to remember all the other addresses
    you typed to get there. Netscape Communicator enables you to create a bookmark
    to a site.


    +   1. Go to a site for which you want to create a bookmark.

    2. Click the **Bookmarks** button in the toolbar.

    3. Select **Add Bookmark** or press Alt+K.

    4. The bookmark appears in the **Bookmarks** menu.


    # Different Commands


    The menu commands available in a shortcut menu vary depending on which onscreen
    element you choose to right-click.


    # KDE Bookmarks


    You can also create bookmarks in KDE windows. Simply click **Bookmarks** and choose
    **Add Bookmarks** in any directory to add it to the Bookmarks menu.'
  - '[PAGE 89]


    # Task 10: Working with Bookmarks


    After you add a site to your bookmarks list, go to it by clicking on the **Bookmarks**
    button, and then choosing your site from the pop-up menu. If you add several sites
    to your bookmarks list, you might want to organize them so you can quickly find
    the site you want.


    ![](img/28e2bccabaf327178ce9997934f991d9_89_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_89_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_89_2.png)


    +   **Favorites**


    Bookmarks are also referred to as Favorites in other browser applications.


    +   **Removing a Bookmark**


    Click **Bookmarks** and select **Edit Bookmarks**. Click on the bookmark you want
    to remove, and press Alt+D to remove a bookmark from the bookmarks list.


    +   1. Click the **Bookmarks** button, and then select the bookmark you want to
    use.


    +   2. To organize your bookmarks, click **Bookmarks**, and then choose **Edit
    Bookmarks**.


    +   3. View the list of bookmarks in the Bookmarks window.'
  - '[PAGE 90]


    ![](img/28e2bccabaf327178ce9997934f991d9_90_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_90_1.png)


    +   4. Click a bookmark or folder containing bookmarks and drag it to a new location
    on the bookmarks list.


    5. The bookmark or folder appears in the new location in the bookmarks list.'
  - '[PAGE 91]


    # Task 11: Using RealPlayer


    Many technologies available on the Internet enable you to listen to audio files
    while connected to a Web site. Real Networks introduced RealAudio several years
    ago. You can download a file to your PC or play the same audio file over the Internet
    using RealPlayer.


    Download Problems?

    If you encounter an error, try logging in as the root user, or close Kpackage
    before trying to download a file from the Internet.


    Streamed Audio

    When you play a RealAudio file without downloading it to your PC, the audio file
    is playing from the Web server. This kind of technology is known as streamed audio;
    that is, the audio data is streamed from the Web server to your PC as the file
    plays on your computer.


    ![](img/28e2bccabaf327178ce9997934f991d9_91_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_91_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_91_2.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_91_3.png)


    +   1. Go to http://www.real.com and download the latest RealAudio player for
    Red Hat Linux 5.x. In this case it''s RealPlayer 5. Follow the directions for
    installation.

    2. Click the Netscape button in the KPanel bar or taskbar.

    3. Click Edit and choose Preferences.

    4. Click on the arrow beside Navigator in the Preferences window, and then choose
    Applications.'
- md: "- 5. Click the **New** button.\n6. Type **RealAudioPlayerG2** in the **Description**\
    \ field and type **audio/x-pn-realaudio** in the **MIMEType** field.\n7. Type\
    \ **.rm, .ra, .ram** in the **Suffixes** field and **rvplayer %s** in the **Application**\
    \ field.\n8. Click the RealPlayer application, or type **rvplayer &** in a Terminal\
    \ window.\n\n## RealAudio Sites\n\nGo to http://www.npr.org or http://www.cnet.com/radio\
    \ to listen to some of the latest radio broadcasts on the Internet.\n\n## Busy\
    \ Server\n\nRealAudio is a popular audio format on the Web. Sometimes, when you\
    \ click on a RealAudio file on a Web site, you will see an error message saying\
    \ the server is too busy to play the file. If this happens, you might want to\
    \ download the file to your computer or create a bookmark of the site and return\
    \ to it later to play the audio file.\n\nNetscape Communicator consists of many\
    \ great features. The three features covered in this book are the browser, email,\
    \ and newsgroup features. The email features in Netscape Communicator are collectively\
    \ known as Messenger. Email stands for electronic mail. With Linux, you can read\
    \ your mail from a Terminal window or with a fancy user interface, such as Netscape\
    \ Messenger.\n\n> **WARNING**\n> As you surf the Web and send email or fill out\
    \ forms on Web sites, be careful about who you give your email address to. Spam\
    \ is similar to junk mail in the real world. If you don't want your mailbox filled\
    \ with unnecessary email, try not to make your email address readily available\
    \ to others.\n\n- 1. Click the **K** button, select **Internet**, and then choose\
    \ **Communicator**.\n2. Click on the **Communicator** menu and choose the **Messenger**\
    \ menu command.\n3. Click **Edit** and choose **Preferences**.\n4. Click on the\
    \ arrow next to **Mail & Newsgroups**, and then click **Identity**.\n\nClick\n\
    \n## Signatures\n\nTo add your signature, type the path to your signature file\
    \ in the Identity panel of Netscape Communicator's Preferences window.\n\nWhen\
    \ you send or reply to email, you can include a signature to provide more information\
    \ about yourself. A signature generally consists of your name, email address,\
    \ and company name or organization. Some folks attach a quote or HTML code to\
    \ their signature to play a song from their Web site to customize their signature\
    \ beyond the basics.\n\n- 5. Type your name and complete email address into the\
    \ corresponding fields.\n- 6. Click **Mail Servers**.\n- 7. Type your username,\
    \ smtp, and pop server information into the corresponding fields. Then press Enter\
    \ to exit the Preferences window.\n\n## Task 13: Reading Email\n\nAfter you have\
    \ configured Messenger to recognize your mail server and your email account, you\
    \ can download your email and read it. Of course, reading email is just the first\
    \ step in using email. You will almost naturally send and reply to email as you\
    \ receive more of it.\n\n> **WARNING**\n> If you receive an email but don't recognize\
    \ the sender, open the email with extreme caution. Some spam might contain a software\
    \ virus or other code as an attachment. Viruses can range from code that doesn't\
    \ do any harm at all to code that sits on your hard disk until a certain day,\
    \ and then erases all the data on your disk, sometimes without warning.\n\n- 1.\
    \ Click **Communicator**, and then choose **Messenger**.\n2. Click **Get Msg**.\n\
    3. Type your password into the Netscape: Password dialog box. Click **OK** and\
    \ wait for your email to download.\n\n> **Full-Size Window**\n> To open an email\
    \ into its own window, double-click on any email in the list.\n\n- 4. Click on\
    \ an email you want to read.\n5. The contents of the email will appear in the\
    \ Preview pane.\n\n## Task 14: Sending an Email\n\nOne way to receive more email\
    \ is to send email to your friends or business associates. You can send a message\
    \ to anyone on the Internet. Better still, you can send one message to many people\
    \ at the same time. Use the cc (carbon copy) and bcc (blind carbon copy) to organize\
    \ how you send a message.\n\n- **Formatting Email**\n  You can type your email\
    \ message in plain text, use HTML to format your text, or even include an image\
    \ file in your email.\n- **Saving a Draft**\n  Click the **Save** button if you\
    \ want to save a draft of an email that's not quite ready to be sent.\n\n- 1.\
    \ Click **Communicator**, and then choose **Messenger**.\n2. Click **New Msg**.\n\
    3. Type the recipient's address as well as any cc and bcc addresses. Addresses\
    \ follow the format **username@domainname.ext** (for example, **afclisa@aol.com**).\n\
    \n- 4. Type your message.\n5. Click **Send** when you are ready to send it.\n\n\
    - **New Message**\n  You can also begin a new message by clicking File, choosing\
    \ **New**, and then choosing **New Message**.\n- **Menu Shortcut**\n  Press Alt+M\
    \ to create a new email message window.\n- **Forwarding Email**\n  Another way\
    \ to send email is to forward one you've already received. Open any email and\
    \ click the **Forward** button to create a new email with all the text from the\
    \ original email.\n\n## Task 15: Replying to Email\n\nYou can easily respond to\
    \ a message you receive. Netscape Messenger completes the address and subject\
    \ information for you. You can reply to part or all of the original email. You\
    \ can also reply to one or all recipients of an email.\n\n> **Quotes**\n> One\
    \ of the best ways to clarify what you're referring to in an email is to quote\
    \ from a previous email. You can cut and paste text from one email to another,\
    \ or select the text from an email and click the Reply button. The selected text\
    \ will appear in quotes in your reply email.\n\n- 1. Click **Communicator**, and\
    \ then choose **Messenger**.\n2. Click **Get Msg**.\n3. Click on an email you\
    \ want to read.\n\n- 4. Click **Reply**.\n5. Type your reply into the main window.\n\
    6. When your reply is complete, click **Send**.\n\n## Reply Versus Reply All\n\
    \nYou can reply to everyone addressed in an email, or you can reply only to the\
    \ sender of an email. Click **Reply** to reply to the sender. Click **Reply All**\
    \ to reply to all recipients of the email.\n\n## Task 16: Reading News\n\nNewsgroups\
    \ in the Internet work similarly to newspapers in the real world. First you subscribe,\
    \ and then you receive the news. Newsgroups on the Internet cover practically\
    \ any topic you can think of. Plus, anyone can post a message, which can then\
    \ be read by anyone who subscribes to that newsgroup.\n\n## Threads\n\nA thread\
    \ begins when someone replies to the first newsgroup posting topic. Generally,\
    \ threads are anywhere from two to eight messages. Some threads can go on for\
    \ what seems like forever.\n\n## Agree to Disagree\n\nNewsgroup threads that take\
    \ on any angry or antagonistic tone are called flames. Because there are so many\
    \ opinions on the Internet, there are times when it's best to agree to disagree\
    \ about a topic.\n\n- 1. Click **Communicator**, and then choose **Newsgroups**.\n\
    2. Select a news server, and then click **Subscribe**.\n3. Use the existing news\
    \ server, or click **Add Server**.\n4. Type the name of the news server you want\
    \ to use. Then click **OK**."
  mdcn: "\n- 5. 点击 **New** 按钮。\n6. 在 **Description** 字段中输入 **RealAudioPlayerG2**，在\
    \ **MIMEType** 字段中输入 **audio/x-pn-realaudio**。\n7. 在 **Suffixes** 字段中输入 **.rm,\
    \ .ra, .ram**，在 **Application** 字段中输入 **rvplayer %s**。\n8. 点击 RealPlayer 应用程序，或在终端窗口中输入\
    \ **rvplayer &**。\n\n## RealAudio 网站\n\n访问 http://www.npr.org 或 http://www.cnet.com/radio\
    \ 来收听一些最新的网络电台广播。\n\n## 服务器繁忙\n\nRealAudio 是网络上流行的音频格式。有时，当你点击网站上的 RealAudio 文件时，你会看到一条错误消息，提示服务器太忙无法播放该文件。如果遇到这种情况，你可以将文件下载到计算机上，或者为该网站创建书签，稍后再回来播放音频文件。\n\
    \nNetscape Communicator 包含许多强大的功能。本书介绍的三个功能是浏览器、电子邮件和新闻组功能。Netscape Communicator\
    \ 的电子邮件功能统称为 Messenger。Email 即电子邮件。使用 Linux，你可以通过终端窗口或使用精美的用户界面（如 Netscape Messenger）来阅读邮件。\n\
    \n> **警告**\n> 当你浏览网页、发送电子邮件或在网站上填写表单时，请注意不要随意向他人透露你的电子邮件地址。垃圾邮件类似于现实生活中的垃圾信件。如果你不希望邮箱被大量无用邮件塞满，请尽量不要让你的电子邮件地址轻易被他人获取。\n\
    \n- 1. 点击 **K** 按钮，选择 **Internet**，然后选择 **Communicator**。\n2. 点击 **Communicator**\
    \ 菜单并选择 **Messenger** 菜单命令。\n3. 点击 **Edit** 并选择 **Preferences**。\n4. 点击 **Mail\
    \ & Newsgroups** 旁边的箭头，然后点击 **Identity**。\n\n点击\n\n## 签名\n\n要添加签名，请在 Netscape\
    \ Communicator 的 Preferences 窗口的 Identity 面板中输入签名文件的路径。\n\n当你发送或回复电子邮件时，可以添加签名以提供更多关于你自己的信息。签名通常包含你的姓名、电子邮件地址和公司名称或组织名称。有些人会在签名中附加一段引言或\
    \ HTML 代码，从其网站播放歌曲，以在基本信息之外自定义签名。\n\n- 5. 在相应字段中输入你的姓名和完整的电子邮件地址。\n- 6. 点击 **Mail\
    \ Servers**。\n- 7. 在相应字段中输入你的用户名、SMTP 和 POP 服务器信息。然后按回车键退出 Preferences 窗口。\n\n\
    ## 任务 13：阅读电子邮件\n\n配置 Messenger 以识别你的邮件服务器和电子邮件账户后，你就可以下载并阅读电子邮件了。当然，阅读电子邮件只是使用电子邮件的第一步。随着你收到的邮件越来越多，你几乎会自然而然地学会发送和回复邮件。\n\
    \n> **警告**\n> 如果你收到一封电子邮件但不认识发件人，请极其谨慎地打开该邮件。一些垃圾邮件可能包含软件病毒或其他恶意代码作为附件。病毒的破坏程度各不相同，从完全无害的代码到潜伏在硬盘上、在特定日期删除磁盘上所有数据的代码，有时甚至不会有警告提示。\n\
    \n- 1. 点击 **Communicator**，然后选择 **Messenger**。\n2. 点击 **Get Msg**。\n3. 在 Netscape:\
    \ Password 对话框中输入你的密码。点击 **OK** 并等待电子邮件下载完成。\n\n> **全尺寸窗口**\n> 要在独立窗口中打开某封邮件，只需在邮件列表中双击该邮件即可。\n\
    \n- 4. 点击你想阅读的电子邮件。\n5. 邮件内容将显示在预览窗格中。\n\n## 任务 14：发送电子邮件\n\n获得更多邮件的一种方式是向你的朋友或业务伙伴发送电子邮件。你可以向互联网上的任何人发送邮件。更棒的是，你可以同时向多人发送同一条消息。使用\
    \ cc（抄送）和 bcc（密送）来组织邮件的发送方式。\n\n- **格式化电子邮件**\n  你可以使用纯文本编写邮件，使用 HTML 来格式化文本，甚至可以在邮件中包含图片文件。\n\
    - **保存草稿**\n  如果你想保存尚未准备好发送的邮件草稿，请点击 **Save** 按钮。\n\n- 1. 点击 **Communicator**，然后选择\
    \ **Messenger**。\n2. 点击 **New Msg**。\n3. 输入收件人地址以及任何抄送和密送地址。地址格式为 **username@domainname.ext**（例如，**afclisa@aol.com**）。\n\
    \n- 4. 输入你的邮件内容。\n5. 准备好发送时，点击 **Send**。\n\n- **新消息**\n  你也可以通过点击 File，选择 **New**，然后选择\
    \ **New Message** 来开始撰写新消息。\n- **菜单快捷键**\n  按 Alt+M 创建新的邮件消息窗口。\n- **转发邮件**\n\
    \  另一种发送邮件的方式是转发已收到的邮件。打开任意邮件并点击 **Forward** 按钮，即可创建一封包含原始邮件所有内容的新邮件。\n\n## 任务\
    \ 15：回复电子邮件\n\n你可以轻松地回复收到的消息。Netscape Messenger 会为你自动填写地址和主题信息。你可以回复原始邮件的部分或全部内容，也可以回复邮件的一个或所有收件人。\n\
    \n> **引用**\n> 在电子邮件中澄清你所指内容的最佳方式之一是引用之前的邮件内容。你可以从一封邮件中剪切和粘贴文本到另一封邮件，也可以从邮件中选择文本然后点击\
    \ Reply 按钮。选中的文本将以引用的形式出现在你的回复邮件中。\n\n- 1. 点击 **Communicator**，然后选择 **Messenger**。\n\
    2. 点击 **Get Msg**。\n3. 点击你想阅读的电子邮件。\n\n- 4. 点击 **Reply**。\n5. 在主窗口中输入你的回复内容。\n\
    6. 回复完成后，点击 **Send**。\n\n## 回复与全部回复\n\n你可以回复邮件中的所有收件人，也可以只回复发件人。点击 **Reply** 回复发件人。点击\
    \ **Reply All** 回复邮件的所有收件人。\n\n## 任务 16：阅读新闻\n\n互联网上的新闻组与现实世界中的报纸类似。你首先需要订阅，然后才能接收新闻。互联网上的新闻组涵盖了几乎所有你能想到的话题。此外，任何人都可以发布消息，订阅该新闻组的人都可以阅读这些消息。\n\
    \n## 讨论串\n\n当有人回复新闻组的第一个帖子时，就形成了一个讨论串。通常，讨论串包含两到八条消息。有些讨论串可以持续很长时间。\n\n## 求同存异\n\
    \n带有愤怒或对立语气的新闻组讨论串被称为\"火焰帖\"。由于互联网上有各种各样的观点，有时最好的做法是就某个话题求同存异。\n\n- 1. 点击 **Communicator**，然后选择\
    \ **Newsgroups**。\n2. 选择一个新闻服务器，然后点击 **Subscribe**。\n3. 使用现有的新闻服务器，或点击 **Add Server**。\n\
    4. 输入你要使用的新闻服务器名称，然后点击 **OK**。\n"
