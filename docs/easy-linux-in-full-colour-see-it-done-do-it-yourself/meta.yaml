    \ get the most out of your computer hardware and software.\n\n- **Click**: Click\
    \ the left mouse button once.\n- **Double-click**: Click the left mouse button\
    \ twice in rapid succession.\n- **Right-click**: Click the right mouse button\
    \ once.\n- **Pointer Arrow**: Highlights an item on the screen you need to point\
    \ to or focus on in the step or task.\n- **Selection**: Highlights the area onscreen\
    \ discussed in the step or task.\n- **Click & Type**: Click once where indicated\
    \ and begin typing to enter your text or data.\n\nTips and Warnings give you a\
    \ heads-up for any extra information you may need while working through the task.\n\
    \nEach task includes a series of quick, easy steps designed to guide you through\
    \ the procedure.\n\nHow to Drag: Point to the starting place or object. Hold down\
