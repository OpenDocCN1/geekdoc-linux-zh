    ![](img/28e2bccabaf327178ce9997934f991d9_196_2.png)


    # WARNING


    Be sure you have enough free space available on your DOS partition before you
    copy files from your Linux partition to the DOS partition. If you do not have
    enough disk space, you will not be able to successfully back up your files.


    # Naming Backup Folders


    You can track backup files and folders more easily if you use descriptive names
    for folders you add to a backup archive.


    # Log In as Root


    You must be logged in as root to mount the DOS directory. After it is mounted,
    any other login account can access the DOS directory.


    +   1. Click the **K** button, select **Utilities**, and choose **Terminal**.


    +   2. Go to the directory you want to back up. Then type `cp <directory name>
    /mnt/dos`.


    +   3. The folder and files are copied to the DOS partition. Go to `/mnt/dos`
    and type `ls` to view the files on the DOS partition.


    ![](img/28e2bccabaf327178ce9997934f991d9_196_3.png)


