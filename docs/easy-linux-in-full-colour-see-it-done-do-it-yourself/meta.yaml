  md: "# Task 9: Finding Files and Folders\n\nAfter you have worked with several applications,\
    \ surfed hundreds of Web sites, and created more documents than you can count,\
    \ your computer will be filled with many files and folders that can make locating\
    \ a particular file or folder on your disk very time-consuming. The Find command\
    \ comes in handy and helps you locate specific files or folders by name, date,\
    \ location, and so on.\n\n+   - **The grep Command**\n  You can search through\
    \ the contents of a file by using the grep command in a Terminal window. You also\
    \ can search for files or processes by using the pipe command with grep; for example,\
    \ ps -ef | grep kde.\n\n+   - **The Find Command**\n  Using the Find command in\
    \ a Terminal window is equivalent to using the Find command in the Find Files\
    \ application.\n\n![](img/28e2bccabaf327178ce9997934f991d9_43_0.png)\n\n![](img/28e2bccabaf327178ce9997934f991d9_43_1.png)\n\
    \n![](img/28e2bccabaf327178ce9997934f991d9_43_2.png)\n\n![](img/28e2bccabaf327178ce9997934f991d9_43_3.png)\n\
