  md: 'Netscape Communicator consists of many great features. The three features covered
    in this book are the browser, email, and newsgroup features. The email features
    in Netscape Communicator are collectively known as Messenger. Email stands for
    electronic mail. With Linux, you can read your mail from a Terminal window or
    with a fancy user interface, such as Netscape Messenger.


    WARNING

    As you surf the Web and send email or fill out forms on Web sites, be careful
    about who you give your email address to. Spam is similar to junk mail in the
    real world. If you don''t want your mailbox filled with unnecessary email, try
    not to make your email address readily available to others.


