    \ CD 并打开 CD 播放器应用程序，即可在工作时享受音乐。\n\n## 音频 CD 控制\n\n如果你使用过消费级音频 CD 播放器，CD 播放器应用程序中的控件操作方式类似。按播放键开始播放\
