    ## Task 12: Playing Games


    Games are great tools for learning how to use the mouse and keyboard to control
    the onscreen cursor. Of course, you can also play a game to break up a busy work
    day or as a light form of entertainment. Caldera installs 15 games onto your hard
    disk. However, this task shows you how to use only four of them.


    ## WARNING


    Most games installed with Linux require a 800×600 size screen. If you have a 640×480
    screen, the game window will extend beyond the viewable area of your monitor.


    - 1. Click the **K** button, select **Games**, and then choose **Patience**.


