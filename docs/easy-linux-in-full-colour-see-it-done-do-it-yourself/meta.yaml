  md: '# Task 4: Working with Colors


    KDE enables you to change the sets of colors used for certain onscreen elements
    such as the title bar and background. These sets of colors are called schemes,
    and you can select colors that work best for you and your monitor. Lighter colors
    might, for example, make working on some applications easier on your eyes. On
    the other hand, you might prefer bright, lively colors to match your clothes or
    your work mood.


    **WARNING**

    Your changes will not be saved if you close a window instead of clicking **OK**
    or **Apply**.


    **Cancel Button**

    If you make changes to the KDE Display Settings window, but decide you do not
    want to save your changes, click the **Cancel** button.


    ![](img/28e2bccabaf327178ce9997934f991d9_123_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_123_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_123_2.png)


    +   1. Click the **K** button and select **Settings**. Then choose **Desktop**
    and select **Colors**.

    2. Click on a background from the drop-down menu in the **Widget color** section
    of the Display Settings window. The widget color changes as you click on a drop-down
    menu item.

    3. Click on the color bar for the selected widget.'
