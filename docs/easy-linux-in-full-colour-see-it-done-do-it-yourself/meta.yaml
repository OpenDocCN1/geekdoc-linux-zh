  - '[PAGE 15]


    # Task 2: Installing OpenLinux


    One of the more memorable experiences you will have using Linux is installing
    it onto your computer. OpenLinux works with a general short list of PC hardware,
    and there''s a fairly long list of little things that don''t work quite right
    with either the installer or OpenLinux. This task walks you through a successful
    installation.


    # Configuration Information


    Before you start installing Linux, be sure to have your monitor, graphics card,
    network card, printer, modem, and hard disk information handy. Most of this information
    can be gathered by viewing **Control Panel** information if Windows is already
    running on the PC on which you want to install Linux.


    ![](img/28e2bccabaf327178ce9997934f991d9_15_0.png)


    +   1. Insert the CD from this book into the PC and start your PC.

    2. Wait for the Lizard application to load. Click the language you want to use
    to with the installation (in this case, **English**). Click **Next**.

    3. Select the mouse you want to use. Lizard will try to auto-detect your mouse
    and choose the setting for you. Click **Next** to continue.

    4. Select a hard disk and choose a partition on it. Click **Prepare selected disk
    for Linux**. Wait for Lizard to format the partition, and click **Next**.'
  - '[PAGE 16]


    ![](img/28e2bccabaf327178ce9997934f991d9_16_0.png)


    # Lizard or Lisa


    If you are unable to install with the Lizard application, create a bootable floppy
    disk from a Windows-based PC by inserting the CD-ROM from this book, and then
    selecting the option to create a bootable floppy.


    # Booting from the CD


    Press **Tab** after the PC first starts up with the CD included with this book.
    Type **boot** to start the PC with the CD. Type **install** to run the Linux Lizard
    installer application.


    # Configuring a Dual-Boot PC


    For more information about configuring a dual-boot PC, see Part 9, Task 3, "Configuring
    a Dual-Boot PC."


    # Blank Screen?


    If you see a blank screen during the installation process, Lizard probably failed
    to continue the Linux installation. Try installing from the bootable floppy disk
    or start the installation over from step 1.


    +   5. Select the installation target. I''ve selected **Entire Harddisk**. If
    you created a Linux partition with the CD in Windows, choose **Prepared Partition(s)**.
    Then click **Next**.


    +   6. Select a partition on the hard disk. Click **Prepare selected disk for
    Linux** (here I chose **Format chosen partitions**). Wait for Lizard to format
    the partition, and click **Next**.


    +   7. Click **Recommended packages, plus commercial**. Then click **Next**. Then
    click on the keyboard and layout format for your keyboard. Click **Next** to continue.


    +   8. Click **Probe** on the Select Video Card page to determine how much video
    memory is available on your computer. Lizard will auto-detect the brand and model
    graphics card installed on your PC. Click **Next**.


    ![](img/28e2bccabaf327178ce9997934f991d9_16_1.png)'
  - '[PAGE 17]


    # Installing OpenLinux Continued


    Setting Up Your Hard Disk

    I installed Caldera''s Linux on both a hard disk with no other software on it
    and a hard disk that already had Windows 98 installed. If you already have an
    OS on your disk, do not select the option to use the entire disk for Linux.


    Hard Disk Options

    You can configure your hard disk partition in a 300MB, 1GB, or 4GB size before
    installing OpenLinux.


    WordPerfect 8

    WordPerfect 8 is bundled with the CD included with this book. To install this
    application with Lizard, be sure to select the installation package **All recommended
    packages plus Commercial** in Lizard.


    Using Col

    Use col as the name of the user login account during installation. Create additional
    accounts after you log in to Linux or KDE as root.


