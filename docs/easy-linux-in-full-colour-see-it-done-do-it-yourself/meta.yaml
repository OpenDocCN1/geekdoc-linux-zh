  md: '# Task 16: Reading News


    Newsgroups in the Internet work similarly to newspapers in the real world. First
    you subscribe, and then you receive the news. Newsgroups on the Internet cover
    practically any topic you can think of. Plus, anyone can post a message, which
    can then be read by anyone who subscribes to that newsgroup.


    # Threads


    A thread begins when someone replies to the first newsgroup posting topic. Generally,
    threads are anywhere from two to eight messages. Some threads can go on for what
    seems like forever.


    # Agree to Disagree


    Newsgroup threads that take on any angry or antagonistic tone are called flames.
    Because there are so many opinions on the Internet, there are times when it''s
    best to agree to disagree about a topic.


    ![](img/28e2bccabaf327178ce9997934f991d9_101_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_101_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_101_2.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_101_3.png)


    +   1. Click **Communicator**, and then choose **Newsgroups**.

    2. Select a news server, and then click **Subscribe**.

    3. Use the existing news server, or click **Add Server**.

    4. Type the name of the news server you want to use. Then click **OK**.'
  merge: -1
