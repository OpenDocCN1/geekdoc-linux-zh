  md: "# Task 14: Sending an Email\n\nOne way to receive more email is to send email\
    \ to your friends or business associates. You can send a message to anyone on\
    \ the Internet. Better still, you can send one message to many people at the same\
    \ time. Use the cc (carbon copy) and bcc (blind carbon copy) to organize how you\
    \ send a message.\n\n![](img/28e2bccabaf327178ce9997934f991d9_97_0.png)\n\n![](img/28e2bccabaf327178ce9997934f991d9_97_1.png)\n\
    \n![](img/28e2bccabaf327178ce9997934f991d9_97_2.png)\n\n+   - **Formatting Email**\n\
    \  You can type your email message in plain text, use HTML to format your text,\
    \ or even include an image file in your email.\n- **Saving a Draft**\n  Click\
    \ the **Save** button if you want to save a draft of an email that's not quite\
    \ ready to be sent.\n\n+   1. Click **Communicator**, and then choose **Messenger**.\n\
    2. Click **New Msg**.\n3. Type the recipient's address as well as any cc and bcc\
    \ addresses. Addresses follow the format **username@domainname.ext** (for example,\
    \ **afclisa@aol.com**)."
  merge: -1
