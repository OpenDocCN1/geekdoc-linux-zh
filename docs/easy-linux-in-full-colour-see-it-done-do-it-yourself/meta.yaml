  md: "# Task 4: Opening and Closing a Window\n\nThe K development environment can\
    \ display folder content in a window. To work with files and folders in KDE, click\
    \ on an icon to open its window. You can have one or several windows open on your\
    \ computer screen. You can close a window by clicking its Close button.\n\n+ \
    \  - **Active and Inactive Windows**\n  If you have more than one window open,\
    \ only the front window is active. This means you can make changes to the menus,\
    \ files, and folders only in the front (active) window on your screen.\n- **Ctrl+O\
    \ and Alt+F4**\n  There are keyboard shortcuts for opening and closing windows,\
    \ too. Press Ctrl+O to open a window and Alt+F4 to close a window.\n- **Console\
    \ Commands**\n  Press Ctrl+T to open a console window from a KDE window. Type\
