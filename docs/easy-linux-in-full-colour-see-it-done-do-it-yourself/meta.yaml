    ![](img/28e2bccabaf327178ce9997934f991d9_126_3.png)


    # **Adding Wallpaper**


    The desktop pattern appears in the image of the monitor in the Display Settings
    window.


    Click **Apply** to view the wallpaper on your desktop.


    Click **OK** to save the wallpaper settings and exit the Display Settings window.
    The selected wallpaper pattern appears on the virtual desktop.


    You can create your own wallpaper patterns by downloading images from the Internet
    or creating images with a Paint program. Save wallpaper image files to **file:/opt/kde/share/wallpapers**.'
