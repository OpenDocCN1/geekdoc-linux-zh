- md: '## Final Steps


    Follow the instructions in **Rebuilding the Linux Kernel for Caldera Open Linux**.
    Be sure to enable **Real-time clock support** in the make config file. Recompile
    Linux, and reboot the system.


    ## Checking Processor Usage


    To determine whether both processors have been detected and are in use, type **cat
    /proc/cpuinfo**. If more than one processor is listed in the report, you are running
    with SMP support.


    - 3. Create a makefile for Linux by typing **vi make config**.


    - 4. Type **a**, and then type **time -v sh -c ''make dep ; make clean install
    modules modules_install''**. Press Escape, and press Shift+ZZ to save the file
    and exit the vi editor.


    ## Task 6: Managing Software with KPackage


    Because most software is installed with rpm, managing software is relatively simple,
    especially if you use KPackage. Aside from installing or uninstalling software,
    you might want to know which files belong to which packages, or you might want
    to remove some files that are not used by your particular configuration of Linux.


    ### WARNING


    Before you install or uninstall software, be sure to read any documentation about
    the software and remove or install any related software packages. You might want
    to look for a newsgroup or message board before adding software to your PC to
    minimize the possibility of losing any existing software or making Linux unstable.


    ### Dragging and Dropping


    You can drag and drop a file over the **Find Package Containing File** window
    in KPackage to locate the package to which it belongs.


    - 1. Click the **K** button, choose **Utilities**, and then select **kpackage**.

    - 2. Click the Find Installed Package button. Type the name of a package to search
    for it.

    - 3. Click **Packages** and choose **Multiple Selection Mode** to install or uninstall
    more than one package at the same time.


    ## Task 7: Uninstalling Applications


    You can remove a shortcut icon from the desktop or an item from the K menu, but
    the application remains installed on your hard disk. If you are not using a particular
    application, you should uninstall it from your hard disk to free up hard disk
    space and reduce file and folder clutter. In most cases, a text file, for example,
    can be opened by more than one application.


    ### Deleting Versus Uninstalling


    Rpm works similarly to the registry in Windows. Rpm uses a database to track installed
    and uninstalled applications on your hard disk. If you delete the application,
    it will remain installed in the rpm database. You should uninstall an application
    instead of removing it to reduce software problems in the long term.


    ### Root Access


    Log in as root to change software services for your computer.


    - 1. Click on the **K** button, select **Utilities**, and then choose **kpackage**.


    - 2. Select a package you want to remove. Then click the **Uninstall** button.


    - 3. Click the **Uninstall** button in the Uninstall window.


    - 4. Notice the package is removed from your OpenLinux configuration.


    ## Task 8: Managing File and Folder Access


    One of the more cumbersome tasks of administering files and folders with Linux
    is providing group or user access to particular files and folders on your PC.
    Whether you use the computer on a network or as a standalone system, you will
    most likely need to change read, write, or lock permissions to folders and files.
    The three permissions settings are r, w, and x (for read, write, and execute).
    Any of these permissions can be added or removed by the root account.


    ### The ls -l Command


    You can view file and folder permissions in any directory. Go to a directory and
    type **ls -l**. A list of files and folders in that directory will appear with
    permissions settings for each item in the list.


    - 1. Click the Home Directory icon in the KPanel bar.

    - 2. Right-click a file or folder and choose **Properties**.

    - 3. Click the **Permissions** tab and view the Access Permissions and Ownership
    settings.

    - 4. The folder''s access permissions are **Show Entries**, **Write Entries**,
    and **Change Into**. Click a check box to change permissions for the file.


    - 5. Right-click an application (in this case I''ve selected **soffice**) and
    click **Properties**.


    - 6. Click the **Permissions** tab. View the Access Permissions and Ownership
    settings. Notice the application has read, write, and execute access permissions.


    - 7. Click in the **Read**, **Write**, or **Exec** check boxes to set permissions
    for the application. Type an **Owner** or **Group** to change ownership of the
    application.


    > **The chown Command**

    > When you create a folder or directory, such as an FTP directory, but want root
    to own it, type **chown root /home/ftp/bin**.


    > **The chmod Command**

    > You can use a Terminal window to change permissions to a file or folder. Type
    **chmod +r-w FreeTheory.txt** to add read permissions and remove write permissions
    to the text file FreeTheory.


    ## Task 9: Managing Software with Lisa


    Lisa is another package management application. It can be used to install Linux
    as well as manage rpm packages after Linux has been installed. The main difference
    between KPackage and lisa is that you must run lisa from a terminal or Konsole
    window. However, you can also use lisa as an alternative to Lizard to install
    Linux 2.2.


    ### Installing with Lisa


    You can create floppy disks that can install Linux 2.2. Insert the CD-ROM included
    with this book into a PC running Windows. The Caldera animation plays after the
    CD mounts on the PC. Click **Install Products**, and then choose **Create Floppy
    Install Diskettes**. Follow the onscreen instructions to create bootable floppies.
    Insert the floppy and CD into the PC on which you want to install Linux, and power
    it on.


    - 1. Click the **K** button, select **Utilities**, and then choose **Terminal**.

    - 2. Type **lisa** and press Enter.

    - 3. Select **Software Package Administration**, and then press Enter.


    - 4. Insert the CD from this book, and choose **Select installation source**.
    Select your CD-ROM device, and press Enter to continue to the next screen.


    - 5. Select **Installation of additional software packages** to add any software
    from the CD to your PC. Press Enter, and follow the onscreen instructions to complete
    the installation.


    - 6. Choose **Remove software packages that have already been installed** to uninstall
    software. Press Enter, and follow the onscreen instructions to complete the uninstall.


    > **More Information**

    > You can also manage services, reconfigure hardware, and software with lisa.
    For more information about lisa, see Part 5, Task 1, "Adding a Printer," Part
    9, Task 7, "Adding Hardware," or Part 4, Task 2, "Setting Up Your Modem Connection."


    ## Task 10: Managing Services


    Nearly any aspect of your system can be administered with lisa. Like **Windows
    NT**, Linux uses processes to manage features in the operating system such as
    networking, as well as to manage applications. One example of a service in Linux
    is the **X11 server**, which provides the graphics service to Linux. This part
    shows you how to configure different software services on your PC.


    ### List of Services


    Click the COAS button in the KPanel bar, select **System**, and choose **Daemons**
    to view a list of system services running on your PC.


    - 1. Click the **K** button and choose **Utilities**, and then select **Terminal**.

    - 2. Type **lisa** in the Terminal window. Then press Enter on your keyboard.

    - 3. Press 3 to select **System Configuration**. Press Enter to continue to the
    next page.

    - 4. Press 2 to select **System Configuration**, and then press Return or Enter.'
  mdcn: '

    ## 后续步骤


    请遵循**为 Caldera Open Linux 重新构建 Linux 内核**中的说明。务必在 make config 文件中启用**实时时钟支持**。重新编译
    Linux，然后重启系统。


    ## 检查处理器使用情况


    要确定是否检测到两个处理器且都在使用中，请键入 **cat /proc/cpuinfo**。如果报告中列出了多个处理器，则表示您正在使用 SMP 支持运行。


    - 3. 键入 **vi make config** 为 Linux 创建 makefile。


    - 4. 键入 **a**，然后键入 **time -v sh -c ''make dep ; make clean install modules modules_install''**。按
    Escape 键，然后按 Shift+ZZ 保存文件并退出 vi 编辑器。


    ## 任务 6：使用 KPackage 管理软件


    由于大多数软件都是通过 rpm 安装的，因此管理软件相对简单，尤其是当您使用 KPackage 时。除了安装或卸载软件之外，您可能还想知道哪些文件属于哪个软件包，或者您可能想要删除一些您的特定
    Linux 配置未使用的文件。


    ### 警告


    在安装或卸载软件之前，请务必阅读有关该软件的任何文档，并删除或安装任何相关的软件包。在向 PC 添加软件之前，您可能想要查找新闻组或留言板，以最大程度地减少丢失现有软件或使
    Linux 不稳定的可能性。


    ### 拖放操作


    您可以将文件拖放到 KPackage 的**查找包含文件的软件包**窗口中，以定位它所属的程序包。


    - 1. 单击 **K** 按钮，选择**实用工具**，然后选择 **kpackage**。

    - 2. 单击"查找已安装的软件包"按钮。键入软件包名称以进行搜索。

    - 3. 单击 **软件包** 并选择 **多重选择模式**，以便同时安装或卸载多个软件包。


    ## 任务 7：卸载应用程序


    您可以从桌面上删除快捷图标或从 K 菜单中删除项目，但该应用程序仍然安装在您的硬盘上。如果您不使用某个特定应用程序，则应将其从硬盘上卸载，以释放硬盘空间并减少文件和文件夹的混乱。在大多数情况下，例如，一个文本文件可以由多个应用程序打开。


    ### 删除与卸载的区别


    Rpm 的工作原理类似于 Windows 中的注册表。Rpm 使用数据库来跟踪硬盘上已安装和已卸载的应用程序。如果您删除该应用程序，它将仍然保留在 rpm
    数据库中。从长远来看，您应该卸载应用程序而不是删除它，以减少软件问题。


    ### Root 权限


    以 root 身份登录以更改计算机的软件服务。


    - 1. 单击 **K** 按钮，选择 **实用工具**，然后选择 **kpackage**。


    - 2. 选择您要删除的软件包。然后单击 **卸载** 按钮。


    - 3. 在卸载窗口中单击 **卸载** 按钮。


    - 4. 注意该软件包已从您的 OpenLinux 配置中移除。


    ## 任务 8：管理文件和文件夹访问


    使用 Linux 管理文件和文件夹时比较繁琐的任务之一是为 PC 上的特定文件和文件夹提供组或用户访问权限。无论您是在网络上使用计算机还是作为独立系统使用，都很可能需要更改文件夹和文件的读取、写入或锁定权限。三种权限设置分别是
    r、w 和 x（分别代表读取、写入和执行）。root 账户可以添加或删除其中任何权限。


    ### ls -l 命令


    您可以在任何目录中查看文件和文件夹权限。进入一个目录并键入 **ls -l**。该目录中的文件和文件夹列表将会显示，列表中每个项目都会显示其权限设置。


    - 1. 单击 KPanel 栏中的"主目录"图标。

    - 2. 右键单击文件或文件夹并选择 **属性**。

    - 3. 单击 **权限** 选项卡，查看访问权限和所有权设置。

    - 4. 文件夹的访问权限是 **显示条目**、**写入条目** 和 **更改到**。单击复选框以更改文件的权限。


    - 5. 右键单击应用程序（在本例中，我选择了 **soffice**）并单击 **属性**。


    - 6. 单击 **权限** 选项卡。查看访问权限和所有权设置。注意该应用程序具有读取、写入和执行访问权限。


    - 7. 在 **读取**、**写入** 或 **执行** 复选框中单击以设置应用程序的权限。键入 **所有者** 或 **组** 以更改应用程序的所有权。


    > **chown 命令**

    > 当您创建文件夹或目录（例如 FTP 目录）但希望 root 拥有它时，请键入 **chown root /home/ftp/bin**。


    > **chmod 命令**

    > 您可以使用终端窗口更改文件或文件夹的权限。键入 **chmod +r-w FreeTheory.txt** 以添加读取权限并删除对文本文件 FreeTheory
    的写入权限。


    ## 任务 9：使用 Lisa 管理软件


    Lisa 是另一个软件包管理应用程序。它可用于安装 Linux，以及在安装 Linux 后管理 rpm 软件包。KPackage 和 lisa 之间的主要区别是您必须从终端或
    Konsole 窗口运行 lisa。但是，您也可以将 lisa 作为 Lizard 的替代方案来安装 Linux 2.2。


    ### 使用 Lisa 安装


    您可以创建能够安装 Linux 2.2 的软盘。将本书附带的 CD-ROM 插入运行 Windows 的 PC。CD 挂载到 PC 上后，Caldera 动画将播放。单击
    **安装产品**，然后选择 **创建软盘安装磁盘**。按照屏幕上的说明创建可启动软盘。将软盘和 CD 插入要安装 Linux 的 PC，然后开机。


    - 1. 单击 **K** 按钮，选择 **实用工具**，然后选择 **终端**。

    - 2. 键入 **lisa** 并按 Enter 键。

    - 3. 选择 **软件包管理**，然后按 Enter 键。


    - 4. 插入本书附带的 CD，然后选择 **选择安装源**。选择您的 CD-ROM 设备，然后按 Enter 键继续到下一个屏幕。


    - 5. 选择 **安装附加软件包** 以将 CD 中的任何软件添加到您的 PC。按 Enter 键，然后按照屏幕上的说明完成安装。


    - 6. 选择 **删除已安装的软件包** 以卸载软件。按 Enter 键，然后按照屏幕上的说明完成卸载。


    > **更多信息**

    > 您还可以使用 lisa 管理服务、重新配置硬件和软件。有关 lisa 的更多信息，请参阅第 5 部分，任务 1"添加打印机"、第 9 部分，任务 7"添加硬件"或第
    4 部分，任务 2"设置调制解调器连接"。


    ## 任务 10：管理服务


    系统的几乎任何方面都可以使用 lisa 进行管理。与 **Windows NT** 类似，Linux 使用进程来管理操作系统中的功能（如网络）以及管理应用程序。Linux
    中服务的一个例子是 **X11 服务器**，它为 Linux 提供图形服务。本节向您展示如何在 PC 上配置不同的软件服务。


    ### 服务列表


    单击 KPanel 栏中的 COAS 按钮，选择 **系统**，然后选择 **守护进程** 以查看 PC 上运行的系统服务列表。


    - 1. 单击 **K** 按钮并选择 **实用工具**，然后选择 **终端**。

    - 2. 在终端窗口中键入 **lisa**。然后按键盘上的 Enter 键。

    - 3. 按 3 选择 **系统配置**。按 Enter 键继续到下一页。

    - 4. 按 2 选择 **系统配置**，然后按 Return 或 Enter 键。

    '
