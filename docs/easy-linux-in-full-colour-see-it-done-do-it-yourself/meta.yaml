  md: '# # Task 4: Managing Users


    If more than one person uses your PC, you will want to create a separate account
    for each user. You might also want to personalize certain KDE settings for each
    person. For example, you can customize the login screen with a message, ask users
    to change their passwords on a regular basis, or give them access to certain folders
    and files on the hard disk. This task covers managing users from a Terminal window,
    and shows you how to use the KDM Configuration tool.


    **WARNING**


    Although Linux supports multiple users, Caldera recommends that you create only
    the COL user account during installation. Use COAS to create additional accounts
    after the installation is complete.


    **COAS**


    You can also add, edit, and delete users with COAS. Click the **COAS** button,
    select **System**, and then choose **Accounts** to launch the user account application.


    **Start Here**


