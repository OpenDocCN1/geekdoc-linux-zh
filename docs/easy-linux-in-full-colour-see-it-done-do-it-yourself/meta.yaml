  mdcn: "\n 4 从工具栏中选择工具，或在Gimp窗口中右键单击鼠标。\n\n5 右键单击**文件**，然后选择**另存为**将图像保存到您的硬盘。为您的文件选择一种文件格式，然后单击**确定**。\n\
    \n6 从菜单中为您的文件选择一种文件格式，然后单击**确定**。再次单击**确定**以完成文件保存。\n\n## 系统性能和图像文件\n\n您可能会注意到，如果用任何应用程序打开大型图像或文本文件，系统速度会变慢。在退出应用程序之前，请务必备份所有关键文件。\n\
    \n## 退出命令\n\n按Ctrl+Q或选择**文件**并选择**退出**以退出应用程序。\n\n## 任务12：玩游戏\n\n游戏是学习如何使用鼠标和键盘来控制屏幕光标的绝佳工具。当然，您也可以玩个游戏来打破忙碌的工作日，或作为一种轻松的娱乐方式。Caldera会在您的硬盘上安装15个游戏。但是，这个任务只向您展示如何使用其中的四个。\n\
    \n## 警告\n\n大多数与Linux一起安装的游戏需要800×600大小的屏幕。如果您使用的是640×480屏幕，游戏窗口将会超出显示器的可视区域。\n\
    \n- 1. 单击**K**按钮，选择**游戏**，然后选择**纸牌**。\n\n2. 单击**游戏**并选择**重新开始游戏**。\n\n3. 现在您可以玩纸牌了。单击**帮助**阅读说明。\n\
    \n**4** 单击**K**按钮，选择**游戏**，然后选择**扑克**。\n\n**5** 单击**文件**并选择**新游戏**。\n\n**6** 单击**抽牌**开始游戏。然后单击一张牌以保留它。\n\
    \n## 继续玩游戏\n\n## 警告\n\n如果游戏在视觉上显示不正确，请尝试更改与X11服务器配置的色数。\n\n- 7. 再次单击**抽牌**。查看游戏结果（在这种情况下，我赢了$5）。\n\
    \n- 8. 单击**K**按钮，选择**游戏**，然后选择**麻将**。\n\n- 9. 单击**游戏**，选择**开始新游戏**，然后选择**经典**。\n\
    \n- 10. 单击任意行末尾的一张牌，然后单击窗口中任意其他行末尾的匹配牌。当所有牌都配对在一起时，游戏结束。\n\n- 11. 单击**K**按钮，选择**游戏**，然后选择**扫雷**。\n\
    \n- 12. 单击一个方块。如果您单击的方块下有炸弹，游戏结束。右键单击一个方块以标记炸弹。\n\n**更多游戏**\n\n当然，互联网上有更多适用于Linux的游戏。请访问\
    \ http://www.linuxgames.com。\n\n## 维护您的系统\n\n维护Linux系统类似于维护Windows或Macintosh电脑。与任何计算机平台一样，过程相似，但软件略有不同。本节介绍一些基本的维护技术，例如备份数据、检查硬盘以及其他有助于保持系统高效运行的任务。\n\
    \n## 任务\n\n| 任务编号 | 描述 | 页码 |\n|---|---|---|\n| 1 | 备份文件 | 182 |\n| 2 | 还原备份 |\
    \ 183 |\n| 3 | 配置双启动PC | 184 |\n| 4 | 在双启动PC上备份文件 | 186 |\n| 5 | 显示您的配置 | 188\
    \ |\n| 6 | 查看当前任务 | 190 |\n| 7 | 添加硬件 | 192 |\n| 8 | 清理不必要的文件 | 193 |\n| 9 | 维护网络和用户帐户\
    \ | 194 |\n| 10 | 检查您的硬盘 | mirrorring |\n\n## 任务1：备份文件\n\n作为对不可预见的计算灾难的预防措施，您应该定期制作文件的额外副本。这称为备份。您可以使用tar或gzip来备份文件。此任务向您展示如何使用GNU\
    \ tar创建备份归档。\n\n## 使用多张软盘备份\n\n要使用tar将文件夹备份到多个软盘，请键入 **tar cMf /dev/fd0 backups**。键入命令时，不要忘记Linux是区分大小写的。\n\
    \n## gzip\n\n您也可以使用gzip创建文件夹或文件的备份归档，gzip是随OpenLinux安装的文件压缩应用程序。键入 **man gzip**\
    \ 以获取有关如何使用gzip的更多信息。\n\n## 警告\n\nGNU tar不会在您尝试归档的同一文件夹中创建归档。\n\n- 1. 选择要备份的文件或文件夹，并将它们移动到硬盘上的一个文件夹中。\n\
    \n- 2. 单击KPanel栏中的\"终端窗口\"按钮。\n\n- 3. 将磁盘插入PC，然后在终端窗口中键入 **tar cf /dev/fd0 backups**。这将使用软盘存储备份文件，创建Backups文件夹的新tar归档。\n\
    \n- 4. 键入 **tar uf /dev/fd0 backups** 以将任何新文件添加到软盘上的备份归档中。\n\n## 任务2：还原备份\n\n\
    备份文件以一种特殊文件格式存储在您的软盘上。如果将其插入运行Windows的PC或Macintosh计算机中，您将无法查看软盘的内容。您可以使用一些tar选项来还原一个文件或备份会话中的所有文件。要查看tar选项，请在终端窗口中键入\
    \ **tar --help**。此任务向您展示如何还原单个软盘上tar归档中的所有文件。\n\n- 1. 单击KPanel栏中的\"终端窗口\"按钮。\n\
    \n2. 插入带有备份文件的软盘。键入 **tar xf /dev/fd0**。此命令从软盘上的tar归档中提取文件。\n\n3. 单击KPanel栏上的\"\
    主目录\"按钮。\n\n4. 在硬盘上查看还原的备份文件。使用这些文件来验证它们在从备份还原后仍能正常工作。\n\n## 还原多磁盘归档\n\n使用GNU\
    \ tar还原由多个迟盘组成的归档。键入 **tar xMf /dev/fd0**。此命令使用M选项在当前磁盘满时请求新的存储组件，例如软盘。\n\n##\
    \ 查看Tar归档\n\n您可以查看存储在tar归档中的文件。例如，键入 **tar tf /dev/fd0** 以查看软盘上tar归档中存储的文件。\n\n\
    ## 任务3：配置双启动PC\n\n如果您的PC不在网络上，或者您想在Linux和Windows之间共享文件，则可以配置LILO（LInux LOader）以在启动PC时选择DOS或Linux。如果使用Linux启动，您可以将硬盘的DOS分区挂载到Linux分区。然后您可以将文件从Linux复制到DOS，以便在使用Windows启动时，可以使用在Linux中创建的任何文件。\n\
    \n> **mount命令**\n> 挂载DOS分区类似于在Linux中挂载软盘或CD-ROM。键入 **mount -t msdos /dev/hda1\
    \ /mnt/dos** 以挂载硬盘的第一个分区，该分区恰好是DOS分区。\n\n- 1. 在主目录窗口中按Ctrl+T或单击KPanel栏上的\"终端窗口\"\
    按钮来打开终端窗口。\n\n2. 在终端窗口中键入 **lisa**。然后按Enter键。\n\n3. 选择**系统配置**，然后按Enter键。\n\n\
    4. 选择**配置启动管理器**，然后按Enter键。\n"
