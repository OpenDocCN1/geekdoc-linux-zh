- md: " ## Task 4: Monitoring the Print Queue\n\nThe print queue lists the documents\
    \ that have been sent to a printer. It shows you which print jobs are currently\
    \ going to the printer and the order in which the jobs are waiting to be printed.\
    \ This task shows you how to use the print queue to view and cancel print jobs.\n\
    \n## The Print Command\n\nYou can print a text document from a **Terminal** window\
    \ by typing `cat <document name> | lpr`. You can also type `lpr <filename>`.\n\
    \n## Print Queue Commands\n\nControl the print queue from a **Terminal** window\
    \ by typing `lpq` to view the print queue. Type `lpc` to control your printers,\
    \ and `lprm` to stop any print jobs in the queue.\n\n- 1. Open several documents\
    \ by clicking on them. Click **File** and select **Print** for each document.\n\
    - 2. Click the **K** button and select **Utilities**. Then choose **Printer Queue**.\n\
    - 3. Click **Update** to update the list of documents in the printer queue.\n\
    - 4. Click the **Remove** button to cancel a job in the print queue.\n- 5. Click\
    \ the **Quit** button to exit the application.\n\n## Task 5: Adding a Printer\
    \ Icon to the Desktop\n\nFor fast access to your printer, you can add a printer\
    \ icon to your desktop. You can then double-click this icon to view the print\
    \ queue. You can also drag documents from a file window to the printer icon to\
    \ print the documents.\n\n- 1. Click the **K** button, select **Utilities**, and\
    \ choose **KDE Configuration Wizard** to start the KDE Setup Wizard.\n- 2. Click\
    \ the **Next** button until you see the **Printer Integration** page.\n\n**TIP**\n\
    \n### Deleting a Desktop Printer Icon\n\nTo delete the desktop printer icon, right-click\
    \ it and select **Delete** from the pop-up menu.\n\n**The KDE Setup Wizard**\n\
    Page 4 of 5\nPrinter Integration\nYou will probably have a printer, don't you?\
    \ Then why not create a little icon for the printer that allows you to drag &\
    \ drop files to the printer, and to invoke the printer queue utility?\n\n- 3.\
    \ Click the **Printer icon** button. Click **Next**, and then click **OK** to\
    \ exit the KDE Setup Wizard.\n- 4. The Printer icon appears on the desktop.\n\n\
    ## Personalizing KDE\n\nYou can optimize your productivity by customizing the\
    \ K development environment (KDE). You can move or hide the taskbar as well as\
    \ move the KPanel buttons. You can also adjust the colors used for onscreen elements\
    \ such as window title bars. You can change the mouse settings, your desktop picture,\
    \ screensaver, and more. Caldera Linux 2.2 includes many options for setting up\
    \ your desktop just the way you want. This part shows you how to customize KDE.\n\
    \n## Tasks\n\n| Task # | | Page # |\n|--------|--------------------------------|--------|\n\
    | 1 | Showing and Hiding the Taskbar | 108 |\n| 2 | Configuring KPanel | 110 |\n\
    | 3 | Working with Fonts | 112 |\n| 4 | Working with Colors | 114 |\n| 5 | Changing\
    \ Your Desktop Picture | 116 |\n| 6 | Changing Your Mouse Settings | 118 |\n|\
    \ 7 | Changing Your Display Properties | 119 |\n| 8 | Changing How Your Windows\
    \ Look | 120 |\n| 9 | Configuring Your Keyboard | 122 |\n| 10 | Changing the X11\
    \ Server | 123 |\n| 11 | Changing the System Date and Time |自营 | 126 |\n| 12 |\
    \ Editing Menus | 128 |\n\n## Task 1: Showing and Hiding the Taskbar\n\nKDE's\
    \ default is to show the taskbar on the desktop at all times. You can, however,\
    \ hide the taskbar so that you have more room on the desktop for other windows,\
    \ folders, and applications.\n\n- **KPanel Shortcut**\n  Right-click the K menu\
    \ bar and choose Configure to open the KPanel Configuration window.\n\n- **Using\
    \ the Taskbar with Any Desktop**\n  When the taskbar is visible, you can access\
    \ any item on the toolbar from any available desktop.\n\n- **Taskbar Settings**\n\
    \  You can make the taskbar disappear, or AutoHide, on the desktop. Click **Options**\
    \ in the KPanel Configuration window, and then click the **Auto Hide Taskbar**\
    \ check box to enable the AutoHide behavior.\n\n- 1. Click the **K** button, choose\
    \ **Panel**, and select **Configure**.\n- 2. In the **Taskbar** section of the\
    \ KPanel Configuration window, click the **Hidden** radio button if you want to\
    \ hide the taskbar.\n- 3. Click **OK** or press Enter.\n- 4. Click **Top**, **Bottom**,\
    \ or **Top/Left** to move the taskbar location.\n- 5. Click **OK** or press Enter.\n\
    - 6. The dialog closes and the taskbar disappears.\n\n## Task 2: Configuring KPanel\n\
    \nThe most powerful visual component of KDE is the KPanel. It is a movable taskbar\
    \ located at the bottom of the desktop. You can launch applications, access multiple\
    \ desktops, and configure your KDE sessions to your liking. There are several\
    \ controls on the panel: the K menu application starter, application shortcuts,\
    \ pop-up menus, Logout, Screenlock, and Virtual Desktop buttons, and panel hide\
    \ buttons on each end of the strip.\n\n**WARNING**\n\nIt is possible to open one\
    \ application or file more than once in Linux. If you double-click on an icon\
    \ and nothing happens, wait a few seconds. Each time you double-click an icon\
    \ it will start a new application window, and also probably slow down the start\
    \ time for each application.\n\n- 1. Click on the KPanel icon, select **Panel**,\
    \ and then select **Configure**.\n- 2. Click a radio button in the **Location**\
    \ or **Style** section to choose the settings you want. Click the **Options**\
    \ or **Disk Navigator** tab to change additional KPanel settings.\n- 3. Click\
    \ on the **Desktops** tab to select the number of virtual desktops you want.\n\
    - 4. Click **OK** to save your settings.\n\n5. Right-click on any button in the\
    \ KPanel and select **Move** to move an icon to a new location in the KPanel bar.\n\
    \n6. Select an application icon and drag it to the KPanel bar. A shortcut icon\
    \ is created on the KPanel bar enabling you to start the application from the\
    \ desktop.\n\n### Adding an Application to the K Menu\n\nLeft-click on the **K**\
    \ button and select **Panel**, and then choose **Add Application**. Click on an\
    \ application you would like to add to the KPanel menu. The next time you click\
    \ on the **K** button, the application appears in the K menu.\n\n### Adding an\
    \ Icon to the KPanel Bar\n\nClick on an application icon and drag it to the KPanel\
    \ menu. KDE creates a shortcut to the application and places the icon in the KDE\
    \ toolbar for quick access.\n\n**Default Button**\n\nClick the **Default** button\
    \ in the KPanel Configuration window to return KPanel to its original settings."
  mdcn: "\n ## 任务 4：监控打印队列\n\n打印队列列出了已发送到打印机的文档。它会显示哪些打印作业当前正在前往打印机，以及作业等待打印的顺序。本任务将向你展示如何使用打印队列查看和取消打印作业。\n\
    \n## 打印命令\n\n你可以在**终端**窗口中输入 `cat <文档名称> | lpr` 来打印文本文档。也可以输入 `lpr <文件名>`。\n\n\
    ## 打印队列命令\n\n在**终端**窗口中输入 `lpq` 来查看打印队列，从而控制打印队列。输入 `lpc` 来控制你的打印机，输入 `lprm` 来停止队列中的任何打印作业。\n\
    \n- 1. 点击打开多个文档。对每个文档点击**文件**并选择**打印**。\n- 2. 点击 **K** 按钮并选择**实用工具**。然后选择**打印机队列**。\n\
    - 3. 点击**更新**来更新打印机队列中的文档列表。\n- 4. 点击**移除**按钮来取消打印队列中的一个作业。\n- 5. 点击**退出**按钮来退出应用程序。\n\
    \n## 任务 5：添加打印机图标到桌面\n\n为了快速访问你的打印机，你可以将打印机图标添加到桌面。然后你可以双击此图标来查看打印队列。你也可以将文档从文件窗口拖到打印机图标上来打印文档。\n\
    \n- 1. 点击 **K** 按钮，选择**实用工具**，然后选择 **KDE 配置向导**来启动 KDE 安装向导。\n- 2. 点击**下一步**按钮，直到看到**打印机集成**页面。\n\
    \n**提示**\n\n### 删除桌面打印机图标\n\n要删除桌面打印机图标，右键单击它并从弹出菜单中选择**删除**。\n\n**KDE 安装向导**\n\
    第 4 页，共 5 页\n打印机集成\n你可能有一台打印机，不是吗？那为什么不创建一个打印机小图标，让你可以拖放文件到打印机，并调用打印机队列工具呢？\n\n\
    - 3. 点击**打印机图标**按钮。点击**下一步**，然后点击**确定**退出 KDE 安装向导。\n- 4. 打印机图标出现在桌面上。\n\n## 个性化\
    \ KDE\n\n你可以通过自定义 K 开发环境（KDE）来优化你的工作效率。你可以移动或隐藏任务栏，也可以移动 KPanel 按钮。你还可以调整屏幕上元素使用的颜色，例如窗口标题栏。你可以更改鼠标设置、桌面背景、屏幕保护程序等。Caldera\
    \ Linux 2.2 包含许多选项，让你可以按自己的方式设置桌面。本部分将向你展示如何自定义 KDE。\n\n## 任务\n\n| 任务 # | | 页码\
    \ # |\n|--------|--------------------------------|--------|\n| 1 | 显示和隐藏任务栏 |\
    \ 108 |\n| 2 | 配置 KPanel | 110 |\n| 3 | 使用字体 | 112 |\n| 4 | 使用颜色 | 114 |\n| 5\
    \ | 更改桌面背景 | 116 |\n| 6 | 更改鼠标设置 | 118 |\n| 7 | 更改显示属性 | 119 |\n| 8 | 更改窗口外观 |\
    \ 120 |\n| 9 | 配置键盘 | 122 |\n| 10 | 更改 X11 服务器 | 123 |\n| 11 | 更改系统日期和时间 | 126\
    \ |\n| 12 | 编辑菜单 | 128 |\n\n## 任务 1：显示和隐藏任务栏\n\nKDE 的默认设置是始终在桌面上显示任务栏。但是，你可以隐藏任务栏，以便在桌面上为其他窗口、文件夹和应用程序留出更多空间。\n\
    \n- **KPanel 快捷方式**\n  右键单击 K 菜单栏并选择配置，打开 KPanel 配置窗口。\n\n- **在任何桌面上使用任务栏**\n\
    \  当任务栏可见时，你可以从任何可用桌面访问工具栏上的任何项目。\n\n- **任务栏设置**\n  你可以让任务栏在桌面上消失，或自动隐藏。在 KPanel\
    \ 配置窗口中点击**选项**，然后点击**自动隐藏任务栏**复选框来启用自动隐藏行为。\n\n- 1. 点击 **K** 按钮，选择**面板**，然后选择**配置**。\n\
    - 2. 在 KPanel 配置窗口的**任务栏**部分，如果你想隐藏任务栏，点击**隐藏**单选按钮。\n- 3. 点击**确定**或按回车键。\n- 4.\
    \ 点击**顶部**、**底部**或**顶部/左侧**来移动任务栏位置。\n- 5. 点击**确定**或按回车键。\n- 6. 对话框关闭，任务栏消失。\n\
    \n## 任务 2：配置 KPanel\n\nKDE 最强大的视觉组件是 KPanel。它是一个位于桌面底部的可移动任务栏。你可以启动应用程序、访问多个桌面，并按自己的喜好配置\
    \ KDE 会话。面板上有几个控件：K 菜单应用程序启动器、应用程序快捷方式、弹出菜单、注销、锁屏和虚拟桌面按钮，以及条带两端的面板隐藏按钮。\n\n**警告**\n\
    \n在 Linux 中，有可能多次打开同一个应用程序或文件。如果你双击一个图标后没有任何反应，请等待几秒钟。每次双击图标都会启动一个新的应用程序窗口，而且很可能会减慢每个应用程序的启动时间。\n\
    \n- 1. 点击 KPanel 图标，选择**面板**，然后选择**配置**。\n- 2. 在**位置**或**样式**部分点击一个单选按钮来选择你想要的设置。点击**选项**或**磁盘导航器**选项卡来更改其他\
    \ KPanel 设置。\n- 3. 点击**桌面**选项卡来选择你想要的虚拟桌面数量。\n- 4. 点击**确定**保存你的设置。\n\n5. 右键单击\
    \ KPanel 中的任何按钮并选择**移动**，将图标移动到 KPanel 条中的新位置。\n\n6. 选择一个应用程序图标并将其拖到 KPanel 条。KPanel\
    \ 条上会创建一个快捷图标，使你能够从桌面启动该应用程序。\n\n### 将应用程序添加到 K 菜单\n\n左键单击 **K** 按钮并选择**面板**，然后选择**添加应用程序**。点击你想添加到\
    \ KPanel 菜单的应用程序。下次你点击 **K** 按钮时，该应用程序将出现在 K 菜单中。\n\n### 将图标添加到 KPanel 条\n\n点击一个应用程序图标并将其拖到\
    \ KPanel 菜单。KDE 会创建该应用程序的快捷方式，并将图标放在 KDE 工具栏中以便快速访问。\n\n**默认按钮**\n\n在 KPanel 配置窗口中点击**默认**按钮，将\
    \ KPanel 恢复为原始设置。\n"
