  md: '# Task 4: Closing an Application


    When you finish working with an application, close it. Too many open applications
    can slow down overall software performance for saving, opening, or printing documents.
    Having too many open applications can also clutter the taskbar.


    Click **File**, and then choose the **Exit** command.


    The application is closed. Notice that the taskbar button for Navigator has disappeared.


    # WARNING


    StarOffice is not included with the CD-ROM included with this book. It is available
    from Star Division for a nominal fee at http://www.stardivision.com.


    # WARNING


    Be sure to save any open documents before exiting an application.


    # Shortcuts


    You can also press Alt+F4 or click the Close button in the application''s title
    bar to close an application.'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# Task 5: Saving a Document


    You save documents and files so that you can refer to them later for editing,
    printing, viewing onscreen, and so on. The first time you save a file, you must
    assign that file a name and location on your hard disk.


    ![](img/28e2bccabaf327178ce9997934f991d9_51_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_51_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_51_2.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_51_3.png)


    # WARNING


    You cannot save a document to a folder you do not have permissions to write to.


    # The Save As Command


    To save a file with a different name or location, use the **Save As** command
    and enter a different filename or folder.


    # Redirecting via the Command Line


    You can redirect text from a command-line window or Terminal window to a file
    by using `command > filename`.


    +   1. Click **File**, and then choose the **Save As** command.

    2. Type a name for the file, and choose a file type in the pull-down menu.

    3. To save the file in another folder, click the Up One Level button, or click
    on a folder in the navigation window. Then click the **Save** button.

    4. The application saves the file and returns to the document window. The document
    name is listed in the title bar.'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Task 6: Opening a Document


    The purpose of saving a document is to make it available for later use. You can
    open any document you have saved by double-clicking the document''s icon or by
    selecting File and choosing the Open Location command.


    # Locating Your Document


    If you can''t find the file you want to work with, it could be because you did
    not save it where you thought you did. Try looking in a different drive or folder.
    If you still can''t find it, try searching for the file (for more information
    about searching for files, see Part 2, "Working with Disks, Folders, and Files").


    # Double-Clicking to Open a File


    The fastest way to open a file is to double-click the document''s icon.


    # Command Line


    You can view any document in a Terminal window by using the more, less, or cat
    commands plus the filename.


    +   1. Click **File**, and then choose the **Open Location** command.

    2. Type the pathname to the file you want to open. Then click **OK**.

    3. The file is opened.'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# Task 7: Creating a New Document


    When you want to start from square one, you can create a new document. For most
    applications, you simply select File, New or choose a template. A template is
    a predesigned document.


    +   **Saving New Files**

    New documents are not saved. Be sure to click File and then Save to save the document
    before you exit the application.


    +   **Splitting Documents**

    If you feel comfortable creating or modifying documents in a Terminal window,
    you can split files using the split command. Type **man split** for more information
    about this command.


    ![](img/28e2bccabaf327178ce9997934f991d9_53_0.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_53_1.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_53_2.png)


    ![](img/28e2bccabaf327178ce9997934f991d9_53_3.png)


    +   1. Click **File**, and then click the **New** command.


    +   2. A new document is displayed.'
  merge: -1
