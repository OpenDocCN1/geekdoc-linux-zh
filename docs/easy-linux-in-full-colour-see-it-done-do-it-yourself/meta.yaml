    \  Right-click on the desktop and choose **Unclutter window** to bring it to the\
    \ foreground and resize it to your screen.\n\n- **Cascade Windows**\n  Right-click\
    \ on the desktop and choose **Cascade Windows** to resize all windows on the desktop.\
    \ This enables you to view the window title bar for each open window.\n\n- **Scale\
