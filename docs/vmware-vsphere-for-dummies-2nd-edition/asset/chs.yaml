  \n## 保持主机配置文件为最新\n\n即使在应用了主机配置文件后，在某些时候仍然需要重新配置。最简单的方法是从参考主机更新主机配置文件。在修改参考 `ESX`主机配置后，按照以下步骤更新主机配置文件：\n\
  \n1. 使用 `vSphere Client` 连接到 `vCenter Server`。\n\n出现 `Inventory` 面板。\n\n2. 点击菜单栏上的\
  \ `View`，然后选择 `Home`。\n\n出现 `Home` 页面。\n\n3. 点击 `Management` 部分的 `Host Profiles`\
  \ 图标。\n\n出现 `Host Profiles` 窗口，如图 18-17 所示。\n\n**图 18-17:** Host Profiles 窗口。\n\n\
  ![9780470768723-fg1817.tif](img/9780470768723-fg1817_fmt.jpeg)\n\n4. 右键点击要更新的配置文件，然后选择\
  \ `Update Profile from Reference Host`，如图 18-18 所示。\n\n对参考 `ESX`主机进行轮询，并更新配置文件。\n\
  \n5. 点击 `Hosts and Clusters` 标签页。\n\n出现所有连接到主机配置文件的 `ESX` 主机和集群列表，如图 18-19 所示。\n\
  \n**图 18-18:** Update Profile from Reference Host 选项。\n\n![9780470768723-fg1818.tif](img/9780470768723-fg1818_fmt.jpeg)\n\
  \n**图 18-19:** Hosts and Clusters 标签页。\n\n![9780470768723-fg1819.tif](img/9780470768723-fg1819_fmt.jpeg)\n\
  \n\n\n虚拟机（VMs）共享资源，这通常可以节省费用，但你的幼儿园老师可能从未告诉过你，有时共享并不是坏的！当宿主机变得负载过高时，虚拟机的行为可能会变得不可预测。默认情况下，vSphere\
  \ 会尝试在竞争的虚拟机之间进行平衡，但这并没有考虑到虚拟机组之间客观存在重要性上的差异。例如，你可能在同一台宿主机上运行一个关键的生产服务器虚拟机和一个重要性远低于它的开发服务器虚拟机。这两个虚拟机都可能变得忙碌，vSphere\
  \ 将尽力在两者之间进行平衡。\n\n很少有组织完全没有某种类型的资源竞争。在大多数情况下，资源竞争会在毫无预警的情况下发生。即使是设计最好的虚拟基础设施也会偶尔出现资源竞争，因此你必须对这种情况进行规划。提前这样做意味着从长远来看工作量更少，体验也更好。\n\
  \n## 份额 (Shares)\n\nvSphere 允许你为虚拟机或资源池分配份额。在 vSphere 中，你可以使用份额来控制资源池或虚拟机的相对优先级。份额是虚拟机相对于其他虚拟机具有相对优先级的基本表示。vSphere\
  \ 仅在资源受限时才会使用份额，因此具有更多份额的对象可以比份额少的对象访问更多资源。如果一个虚拟机的 CPU 份额是另一个虚拟机的两倍，那么在资源受限时，第一个虚拟机访问\
  \ CPU 的能力将是第二个两倍。你可以为 CPU、内存或磁盘资源分配份额。\n\n在 `vSphere Client` 中分配份额时，你通常使用高（high）、普通（normal）或低（low）值。这些值之间的比例为\
  \ `4:2:1`。该比例意味着，高份额值的虚拟机获取资源访问权限是低份额虚拟机的四倍，是设置为普通值的虚拟机的两倍。\n\n正在消耗资源的虚拟机就像去一家忙碌的餐厅。如果你在社区中很重要，你可能会先被安排座位，工作人员对你的服务可能比对其他顾客更周到。社区中重要的虚拟机具有高份额值，会优先获得座位并和服务。如果餐厅（或宿主机）不忙，即使你很重要（高份额），大家也会立即获得座位并受到服务。\n\
  \n### 如何在虚拟机上设置份额\n\n要在虚拟机上设置份额，请按照以下步骤操作：\n\n1. 打开并登录 `vSphere Client`。\n2. 打开“虚拟机与模板”（Virtual\
  \ Machines & Templates）视图。\n2. 右键点击要设置份额的虚拟机，选择“编辑设置”（Edit Settings）。\n\n出现“虚拟机属性”（Virtual\
  \ Machine Properties）对话框。各种虚拟硬件设置位于“硬件”（Hardware）选项卡上。\n\n4. 点击“资源”（Resources）选项卡。\n\
  \n如图 19-2 所示的“资源”选项卡是你调整授予虚拟机资源的地方。当你点击“资源”选项卡时，首先会显示 CPU 设置。你可以在“资源”选项卡的“资源分配”（Resource\
  \ Allocation）窗格中更改“份额”（Shares）值。\n\n**图 19-2：** 虚拟机属性对话框的“资源”选项卡。\n\n![9780470768723-fg1902.eps](img/9780470768723-fg1902_fmt.jpeg)\n\
  \n5. 使用下拉列表将“CPU 份额”（CPU Shares）值设置为“高”（High）。\n6. 点击位于“虚拟机属性”对话框左侧“设置”（Settings）下的“内存”（Memory）。\n\
  \n“资源分配”窗格现在变为侧重于“内存分配”（Memory Allocation）。\n7. 将“内存份额”（Memory Shares）更改为“高”（High）。\n\
  8. 点击“确定”关闭“虚拟机属性”对话框。\n\n## 限制 (Limits) 和预留 (Reservations)\n\n份额很有用，但它们也是相对的。如果你有一个非常过载的集群，即使你将关键虚拟机设为高份额，份额也对它没有帮助。如果请求资源的虚拟机数量远于你宿主机上拥有的数量，份额无法保证虚拟机继续运行。\n\
  \n限制和预留更具绝对性，因此你可以确保资源保留在你想要的地方。你可以在虚拟机和资源池上设置限制和预留，但它们会通过向这些对象添加或移除资源来影响集群、宿主机和虚拟机。\n\
  \n 你有预留吗？\n\n如果你想绝对确保即使在最忙的时候也能在你喜欢的餐厅用餐，你需要预留。同样，如果你想保证资源对虚拟机可用，虚拟机就需要预留。就像优质餐厅在桌子上放置“预留”（Reserved）卡一样，预留确保了当虚拟机需要时资源是可用。\n\
  \n你可以通过修改虚拟机或资源池的属性为内存和 CPU 资源设置预留。\n\n按照本章前面“从视角看资源”（Putting Resources in Perspective）部分的步骤操作，打开要修改的虚拟机的“虚拟机属性”对话框；然后继续执行步骤：\n\
  \n1. 点击“资源”（Resources）选项卡。\n\n“预留”（Reservation）值允许你拖动滑块或输入数字。注意，可能会根据父资源池的资源或其他提取相同资源的其他预留而存在限制。\n\
  2. 在“CPU 预留 MHz”（CPU Reservation MHz）字段中输入 `900`。\n\n此步骤为虚拟机独占预留了 `900 MHz`，如图 19-3\
  \ 所示。如果虚拟机不使用 `900 MHz`，则这些资源不会在其他地方使用，因此预留通常谨慎使用。\n3. 点击“确定”关闭“虚拟机属性”对话框。\n\n**图\
  \ 19-3：** 带有 900 MHz CPU 预留的虚拟机属性资源窗格。\n\n![9780470768723-fg1903.eps](img/9780470768723-fg1903_fmt.jpeg)\n\
  \n预留很有帮助，但它们也是相对的。\n\n限制限制限制限制限制限制限制限制虚拟机虚拟机虚拟机虚拟机虚拟机虚拟机虚拟机虚拟机虚拟机资源资源资源资源，，，预资源可以防止某些虚拟机的开启。\n\
  \n\n\n\n\n# 将资源委托给其他虚拟机\n\n你可以使用资源池将资源租给某个部门。如果一个部门有几个虚拟机服务器，你可以将它们放入资源池，并授予该池的份额（shares）、预留（reservations）和限制（limits）。池中的每个虚拟机都可以与池内的其他虚拟机进行竞争，但如果你设置了限制，它们就不会影响其他部门的机器。\n\
  \n为每个虚拟机设置适当的资源是非常耗时的，因此通过资源池，你可以快速地在资源池级别定义性能参数。许多组织在集群根节点设有三个资源池，份额分别设置为高、正常和低。通过将所有虚拟机放入这三个资源池中，在资源低缺的情况下，你可以轻松创建某些虚拟机性能的可预测性，但前提是每个资源池中的虚拟机数量相等。一个高份额但包含大量虚拟机的资源池性能可能低于一个低份额但包含少量虚拟机的资源池，因为每个虚拟机获得的都是资源池中可用份额的相对量。\n\
  \n## 为组分配资源\n\n要向某个组分配资源，你需要修改资源池。你可以在不关闭资源池中虚拟机的情况下进行操作，因此请务必小心，因为很容易导致虚拟机资源不足的情况。\n\
  \n要向资源池分配资源：\n\n1. 打开并登录 `vSphere Client`。\n2. 右键点击资源池并选择 `Edit Settings`（编辑设置）以打开资源池的属性。\n\
  \n出现 `Edit Settings` 对话框如图 19-4 所示，你可以在其中轻松设置资源池的份额、预留和限制。记住，份额、预留和限制是针对整个池的，而不是简单传播到虚拟机的设置。因此，如果你将资源池设置为\
  \ `5,000 MHz` 且该池中有五个虚拟机，那么当它们都相等且处于忙状态时，每个虚拟机只能接收 `1,000 MHz`。\n\n3. 将 `CPU Shares`\
  \ 值更改为 `High`（高）并点击 `OK`。\n\n现在，资源池设置为在宿主机 CPU 资源短缺时获得高 CPU 份额。\n\n**图 19-4：** 资源池的编辑设置对话框。\n\
  \n![9780470768723-fg1904.eps](img/9780470768723-fg1904_fmt.jpeg)\n\n## 优先考虑关键虚拟机\n\
  \n为关键虚拟机创建资源池是常见操作。关键机器的预留通常具有较高的份额值，并根据池中虚拟机的数量将预留设置为适当的资源量。通常，你允许预留是可的，这使得预留在需要且可用时能够扩展以使用其父池的资源。在关键虚拟机资源池中，你还要确保不设置任何限制，因为你希望在资源可用时让这些虚拟机获得它们可能需要的一切。\n\
  \n相反，对于低端沙箱开发系统，你可能会将份额设置为低，不创建预留，并设置限制，以便沙箱系统永远不会干扰其他系统。\n\n## 合并资源池\n\n你可以轻松修改资源池的设置和成员。要将系统移入或移资源池，只需从\
  \ `vSphere client` 的 `Hosts and Clusters`（主机和集群）视图中拖动虚拟机。在某些情况下（例如将宿主机添加到集群），你可能需要选择对现有的资源池进行处理。\n\
  \n## 嵌套本能：使用嵌套划分资源\n\n资源池可以将虚拟机或其他资源池作为其成员。嵌套资源池提供了一种简单的方法，在组之间划分资源，然后进一步划分资源。\n\
  \n例如，假设你的组织中有三个部门：IT、HR 和销售。每个部门都为你的集群支付了一台主机，并期望完全利用该主机来运行他们的生产和非生产服务器。你希望使用 `DRS\
  \ cluster` 而不是独立服务器，以利用 `vMotion` 并最大化性能。与其将所有销售虚拟机限制在一台主机、HR 虚拟机限制在另一台主机，你可以创建三个顶层资源池，每个池拥有相当于一台主机的资源，并将所有虚拟机放入该资源池中。后来，你决定也需要优先考虑生产虚拟机。你可以创建一个资源池结构，如图\
  \ 19-5 所示。\n\n![tip.eps](img/tip_fmt.jpeg) 不要过度嵌套资源池。虽然资源池可以节省大量时间，但过多的资源池可能会变成头疼的根源！\n\
  \n**图 19-5：** 嵌套资源池结构。\n\n![9780470768723-fg1905.tif](img/9780470768723-fg1905_fmt.jpeg)\n\
  \n## 带有自身资源设置的导入虚拟机\n\n如果虚拟机已经有了资源设置，当你将其添加到 `Inventory`（清单）时，这些设置将会保留，因为它们存储在 `VMX`\
  \ 文件中。如果设置得非常高，当你首次启动它时可能会遇到错误，因为预留是在开机时计算的。这个问题可以通过本章较早之前的“从视角看资源”部分描述的方法编辑 `Virtual\
  \ Machine`（虚拟机）属性来轻松解决。在编辑资源时，只需删除任何预留并将份额设置为正常，你就可以启动它。\n\n## 在向集群添加宿主机时合并资源池\n\
  \n由于你可以在独立宿主机或 `DRS cluster` 中创建资源池，你可能会遇到将带有资源池的独立宿主机移动到集群的情况。在将独立宿主机移动到集群时，第 13\
  \ 章介绍 `Add Host Wizard`（添加主机向导）会提示你想将虚拟机移动到根资源池还是创建一个新的资源池。图 19-6 显示了 `Add Host\
  \ Wizard` 的 `Choose Resource Pool`（选择资源池）页面。你通常可以在集成宿主机到集群后移动这些虚拟机。\n\n**图 19-6：**\
  \ 添加主机向导的选择资源池页面。\n\n![9780470768723-fg1906.eps](img/9780470768723-fg1906_fmt.jpeg)\n\
  \n# 第 20 章 使用 vSphere 可用功能\n\n## 本章内容\n\n![arrow](img/arrow.png) 确定多少停机时间过多\n![arrow](img/arrow.png)\
  \ 查看 vSphere 可用选项\n![arrow](img/arrow.png) 查看 VMware 容错——零停机解决方案\n\nVMware 通过每次重大版本发布增加虚拟机运行时间的新方法，在虚拟化市场中保持竞争优势。vSphere\
  \ 4.1 代表 VMware 裸金属虚拟机平台及其相应管理工具的最新版本，旨在支持关键任务负载。\n\n本章介绍了不同的可用性级别及其相关功能。你配置集群使用\
  \ VMware 高可用（HA）。你还将学习设置故障期间重启虚拟机的规则，以及留出容量以接受来自故障主机的虚拟机。你还将了解 VMware 容错（FT）、其先以及何时使用它。\n\
  \n## 决定多少停机时间过多\n\n不同组织对计算机系统的可接受停机时间差异巨大，由多种因素驱动：\n\n![check.png](img/check.png)\
  \ 法律合规\n![check.png](img/check.png) 服务水平协议\n![check.png](img/check.png) 对收入的影响\n\
  ![check.png](img/check.png) 人类健康与安全\n![check.png](img/check.png) 紧急状态\n\n系统停机影响业务之前允许的最大时间定义了恢复时间目标（RTO）。停机期间可能发生的最大数据丢失定义了恢复点目标（RPO）。RTO\
  \ 的范围可以从绝对零到几天不等，取决于应用，而 RPO 的范围可以从零丢失到几天或更久。\n\n\n\n\n\n即使是零停机的定义也会根据应用程序的敏感性而异。高交易量的金融交易应用可能仅一秒的停机就会受到影响，而一个\
  \ 网站可能不受几分钟停机的影响。在电子商务领域，同一个 网站的结账部分在支付过程中可能会受到几秒钟停机的影响。由于每个组织的情况不同，因此从管理层和业务用户处了解可用性需求至关重要。\n\
  \n计算机很少以零停机的方式运行——事实上，这种情况非常罕见，以至于被认为是零停机网站的网站也是通过构建冗余基础设施、消除整个环境中的单点故障来实现如此高水平的可用性的。通过这种方式，设备预计会故障，但呈现的应用程序将继续运行。\n\
  \n传统的服务器架构以高可用的方式进行设置极其昂贵。它们通常需要专用的专有硬件。\n\n### 操作系统层面的集群\n\n许多操作系统在操作系统层面具有集群功能。这些集群解决方案通常使用称为\
  \ `quorum` 的共享磁盘来跟踪资源所有权，而且大多数是主备模式（active/passive），这意味着同一时间只有一个节点处于忙状态。\n\n虽然许多操作系统层级的集群可以在\
  \ `vSphere` 中运行，但 VMware 支持的唯一配置是微软集群服务 (`MSCS`)。在 `vSphere` 中，你可以使用虚拟机创建三种类型的 `MSCS`\
  \ 集群。虽然所有三种 `MSCS` 集群都需要共享磁盘，但对于你需要的操作有不同的规则：\n\n![check.png](img/check.png) 在单个物理主机上运行集群虚拟机：此选项提供了一个运行在单个物理机上的双节点集群。由于集群可以防止物理问题，这种设置有什么用呢？如果你需要为功能测试设置集群，但又不想承担物理服务器的费用，那么在单个物理主机上运行集群是有帮助的。许多组织在质量保证和开发情况下运行这种场景。\n\
  \n![tip.eps](img/tip_fmt.jpeg) 在单个物理主机上运行集群通常是最容易设置的集群选项，因为它没有像其他解决方案那样复杂的存储和网络配置。你为此选项创建的磁盘可以是虚拟磁盘，也可以是虚拟兼容模式下的非透传的原始设备映射\
  \ (`RDM`) 磁盘。\n\n![check.png](img/check.png) 跨物理主机运行集群虚拟机：从可用性的角度来看，这种选项对许多管理员来说更有意义。通过跨两个物理主机建立集群，你防止了物理主机的故障。许多操作系统层级的集群允许非常快的恢复，因此这种解决方案有时可以比\
  \ VMware `HA` 提供更快的恢复。由于磁盘必须对多个物理主机可用，因此不允许使用虚拟磁盘，但虚拟兼容模式下的非透传 `RDMs` 和物理兼容模式下的透传\
  \ `RDMs` 都是可用的。\n\n![check.png](img/check.png) 将物理机和虚拟机组成集群：集群的硬件可能非常昂贵，而且通常在事件发生之前，备用节点几乎不被利用。备用节点的使用率低促使财务保守的人问道：“如果我能让那个备用节点支持多个集群怎么办？它们可能不会同时故障。”\n\
  \n`MSCS` 不允许该选项，但在 `vSphere` 中，你可以让单个物理主机包含多个备用节点虚拟机。在这种情况下，虚拟机和物理服务器都需要看到共享磁盘，因此唯一的选项是使用物理兼容模式下的透传\
  \ `RDM`。\n\n![tip.eps](img/tip_fmt.jpeg) `MSCS` 非常复杂且有许多前提条件。其中许多前提条件经常发生变化，因此检查\
  \ VMware 网站以获取最新信息是明智的。用于 `MSCS` 的 `vSphere` 4.1 指南《Setup for Failover Clustering\
  \ and Microsoft Cluster Service》位于 [www.vmware.com/pdf/vsphere4/r41/vsp_41_mscs.pdf](http://www.vmware.com/pdf/vsphere4/r41/vsp_41_mscs.pdf)。\n\
  \n### 比较高可用性与容错性\n\n高可用性和容错性经常被错误地通用。高可用性是一个衡量系统相对于预期工作周期的概念。该周期通常是每天 24 小时；在这种情况下，你可能设计系统的可用性为\
  \ 99%。这种设计听起来不错，但一个可用性为 99% 的系统每年会有大约 3.65 天的停机。典型的高可用系统处于“四九”、“五九或六九”，意味着它们具有 99.99%\
  \ 或更高的可用性。高可用性的关键在于对短时间非计划停机的预期。在企业使用的常用目标“五九”可用性情况下，99.999% 的运行时间等于每年 5.26 分钟的停机。\n\
  \n容错性则不同。容错性通常是高可用性的一个组件，指的是系统处理错误的能力，你通常通过消除所有单点故障来实现这一点。大多数服务器的部件是容错的，例如镜像磁盘驱动器或冗余电源，但大多数服务器并不是完全容错的。确实存在完全容错的系统，通常通常用于生命安全的系统。例如，市政应急热线（如美国的\
  \ 911）通常有两套完全独立的呼叫调度记录器。如果其中一个故障了，另一个可以在没有任何停机的情况下接管。\n\n大多数时候，高可用系统使用许多容错组件。即使是不被认为高可用的系统通常也具有容错组件，以便于进行维护和支持。\n\
  \n要使用 VMware 容错（Fault Tolerance），你必须启用 VMware `HA`。不过，你可以启用 `HA` 但不使用容错。\n\n###\
  \ 使用 VMware 高可用性\n\n在 x86 虚拟化的早期，最常见的问题是：“如果你在一个主机上运行了 20 个虚拟机，而该主机故障了怎么办？”以前的答案是：“我们在可能的地方购买容错组件，并希望主机不要故障。”这个计划显然运行良好，但它可能仅限于非生产工作负载。后来，VMware\
  \ 在 ESX 3 中引入了 `HA`，从那以后它已经成熟了很多。这种成熟意味着你可以这样回答问题：“我们在可能的地方购买容错组件，如果主机故障了，vSphere\
  \ 会在健康的主机上自动重启虚拟机。这项技术很棒，因为它保护所有虚拟机，而不仅仅是我们的关键虚拟机。”\n\n能够这样回答问题是一个非常棒的故事，并极加速了 VMware\
  \ 在生产环境中的部署。\n\n\n\n\n当然，如果你计划将故障主机上的虚拟机（VMs）迁移到另一台主机，你必须为它们留出空间。通常在服务器系统中，拥有一个备用系统被称为\
  \ `(N)+1`，其中 `(N)` 是你生产环境通常所需的服务器数量。例如，你可能在生产环境中需要五台服务器，但额外准备了第六台以防服务器故障。通常情况下，对于任何\
  \ `(N)+1` 计划，你必须拥有那个 `1` 计划才能成功。在 vSphere 中，这个 `1` 不需要是专用的；你只需要在集群中留出一个主机容量的空闲空间即可。你也可以在\
  \ vSphere 中 `(N)+2` 或更多。\n\n这种想法通常是可行的，因为它允许你在不影响操作的情况下对主机进行维护。通常，对于一个包含五个或更多主机的集群，我们建议至少保留两个主机容量的额外空间。\n\
  \n## 为你的虚拟机建立秩序\n\n并不是所有的虚拟机都是平等的，因此你可以在集群设置中定义虚拟机在故障后重启的优先级。如果 `HA` 必须对启动哪些虚拟机做出艰难决定，重启优先级将引导\
  \ `HA` 使最关键的虚拟机首先开启电源。\n\n你可以在集群设置中配置此功能，只需设置虚拟机重启优先级即可。集群的默认设置为 `medium`（中），你可以选择禁用重启，或者从\
  \ `high`（高）、`medium`（中）或 `low`（低）优先级中进行选择。\n\n在硬件事件发生后，你可能会处理硬件问题并恢复主机。如果你在全自动模式下启用了\
  \ `DRS`，它最终会重新平衡集群。如果 `DRS` 处于手动模式，它会向你提供建议，你可以手动移动虚拟机。\n\n## 为你的虚拟机提供高可用性\n\n嘿，`HA`\
  \ 听起来很棒，但如何设置它呢？和 vSphere 中的许多功能一样，设置 `HA` 很容易，但你需要确保你的集群配置正确。做到此点的良好方法是确保 `vMotion`\
  \ 操作正常运行，并检查每个主机以确保网络连接和名称的一致性。\n\n当集群上启用 `HA` 时，每台主机上都会安装一个代理，以与集群中的其他 `ESX` 主机进行通信。首先添加到\
  \ `HA` 集群的前五台主机被指定为主主机。主主机维护并同步所有关于集群状态的信息。这些信息用于决定何时以及是否启动虚拟机故障转移到其他 `ESX` 主机。前五台主机之外的任何主机都被指定为备用主机。如果主主机从集群中移除，`HA`\
  \ 会自动将一个备用主机提升为主主机以填补空白。\n\n![tip.eps](img/tip_fmt.jpeg) 向带有至少另一台 `ESX` 主机的 `HA`\
  \ 集群添加 `ESX` 主机时，所添加的主机必须与 `HA` 集群中的至少一个主主机通信，否则过程将失败。\n\n## 响应故障\n\n`HA` 集群的每个成员主机都会持续监控其伙伴节点。主机使用安装在每台主机上的\
  \ `HA` 代理每秒与集群中的其他成员交换心跳，以确保每个人都在运行正常。如果 `HA` 集群中的某台主机超过 15 秒未发送心跳，且该主机对网络上的 `pings`\
  \ 没有任何响应，则 `HA` 将宣布该 `ESX` 主机为故障。检测到的故障将触发将之前运行在故障主机上的虚拟机重启到备用主机上。\n\n主机网络隔离（Host\
  \ Network Isolation）略有不同，即主机仍在运行，但无法与 `HA` 集群中的其他主机通信。如果主机在 12 秒内没有收到集群中任何其他主机的心跳，它将尝试\
  \ ping 网络上的其他地址，包括其他 `vSphere` 主机的管理网络。如果也失败，该主机将宣布自己被隔离。隔离的主机将关闭其运行的虚拟机，以释放其虚拟机虚拟磁盘文件的锁，允许其他主机接管虚拟机。当隔离主机的网络连接不可用\
  \ 15 秒或更长时间，集群中的其他主机将该隔离主机视为故障，并在集群其他主机上重启该隔离的虚拟机。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 到 `ESX` 主机的网络连接应具有冗余设计，以确保始终有一个网络路径可用的。这种设计几乎消除了主机变成隔离状态的可能性。\n\n## 在集群上启用高可用性\n\
  \n要在集群上启用 `HA`，首先确保集群运行正常，且 `VMotion` 操作符合你的预期。此外，确保 `DNS` 运行正常，因为 `HA` 涉及主机之间重要的通信。\n\
  \n要在集群上启用 `HA`：\n\n1. 打开并登录 `vSphere Client`，导航到“Hosts and Clusters”（主机和集群）视图。\n\
  2. 通过右键点击集群对象并选择“Edit Settings”（编辑设置）打开集群设置。\n\n打开集群设置对话框。在这里，你可以启用 `HA` 或 `DRS`，还可以修改若干与集群相关的设置。集群设置对话框如图\
  \ 20-1 所示。\n\n**图 20-1：** `vSphere Client` 中的集群设置对话框。\n\n![9780470768723-fg2001.eps](img/9780470768723-fg2001_fmt.jpeg)\n\
  \n3. 在“Cluster Features”（集群功能）面板中（默认显示），选择“Turn on HA”（启用 VMware HA）并点击 `OK`。\n\n\
  `HA` 设置开始。`vCenter server` 在主机上安装 `HA` 代理并进行配置。与安装和配置 `HA` 若干任务出现在“Recent Tasks”（最近任务）中。\n\
  \n在所有任务完成后，`HA` 已为集群设置好。这立即开始保护集群。\n\n**图 20-2：** 为集群配置 `HA` 的 `vSphere Client`。\n\
  \n![9780470768723-fg2002.tif](img/9780470768723-fg2002)\n\n 探索 VMware 容错——超越 HA\n\
  \nVMware 高可用性可以在硬件故障时快速恢复虚拟机。它还可以通过将虚拟机移动到健康主机并重启从操作系统故障。由于虚拟机启动很快，停机时间可能只有分钟！\n\
  \n对于某些系统，即使是一分钟的计划停机也可能是灾难性的，这就是 VMware `FT` 的用武之地。VMware `FT` 获取主虚拟机，并创建一个相同的备用虚拟机。两台虚拟机以完全同步的方式运行，处理相同的数据，更改相同的内存位置，向磁盘写入相同的数据。这种同步被称为\
  \ vLockstep（锁步技术）。\n\nVMware `FT` 不保护应用程序错误。如果你用 `FT` 保护虚拟机后应用程序进入了错误状态，该错误将在备用虚拟机上忠实重现。\n\
  \n## VMware 容错的先决条件\n\n`HA` 的先决条件相当宽松，但 `FT` 完全是另一回事。它对主机和虚拟机都有若干先决条件：\n\n![check.png](img/check.png)\
  \ 主机：\n\n- vSphere 版本必须是 `Advanced`、`Enterprise` 或 `Enterprise Plus`。\n- 集群必须已设置且\
  \ `HA` 运行正常。\n- CPU 必须相同，且频率差异在 `400 MHz` 以内。\n- CPU 必须支持硬件虚拟化，且服务器在 `BIOS` 中已启用它。\n\
  - 主机应与所有其他主机建立专用 `1Gbps` 连接用于 `FT` 日志流量。推荐使用 `10Gbps 以太网。\n\n![check.png](img/check.png)\
  \ 虚拟机：\n\n- 虚拟机必须位于 `NFS`、`FC` 或 `iSCSI` 共享存储上。\n- 虚拟机数据文件必须是虚拟机磁盘或虚拟兼容模式下的非透传 RDM。\n\
  - 虚拟机数据文件不能是精简配置。\n- 虚拟机必须具有单个 `vCPU`。\n- 虚拟机不能连接任何设备，如 `(CD)`、串口设备或 `USB` 设备。\n\
  \n\n\n\n![check.png](img/check.png) VM 可能无法使用某些功能：\n\n- **快照 (Snapshots)**：`Snapshots`\
  \ 与 `FT` 不兼容。在启用 `FT` 之前，你必须移除所有快照。\n- **存储迁移 (Storage vMotion)**：你可以通过关闭 `FT` 并移动\
  \ VM 来使用 `Storage vMotion` 迁移容错虚拟机。在移动完成后，你可以重新开启 `FT`。在 `FT` 关闭期间，VM 不会受到连续性保护，但它仍然符合\
  \ `VMware HA` 的保护条件。\n- **链接克隆 (Linked Clones)**：`Linked Clones` 使用了复杂的指针映射，与 `FT`\
  \ 不兼容。\n- **VMware 整合备份 (VMware Consolidated Backup)**：`VMware Consolidated Backups`\
  \ 使用了快照，因此与 `FT` 不兼容。\n\n这些要求非常严格，以至于我们在编写这一章时，我们的实验室里还没有合适的硬件。我们不得不联系其他机构以获取用于测试\
  \ `FT` 的硬件。`FT` 的要求虽然严格，但与在物理硬件上提供连续容错相比，`VMware Fault Tolerance` 要容易得多且成本更低！\n\n\
  ## 计算 VMware 容错的成本\n\n许多版本的 `vSphere` 都包含了 `VMware FT`，但它并不是免费的。由于高带宽日志接口，使用 `VMware\
  \ FT` 需要更复杂的架构，此外备用虚拟机还有额外的 CPU 和内存需求。在主、备用虚拟机上，`vSphere` 都会设置 VM 的内存预留等于分配给 VM\
  \ 的内存，以便启用了 `FT` 的 VM 无法利用超额配额技术。由于 `FT` 使用共享存储，它不需要重复的磁盘空间，但你必须使用 `Thick`（厚配置）磁盘，且\
  \ `FT` 在第一次转换时会对磁盘进行擦除，以将其清零。\n\n## 启用 VMware 容错\n\n如果你的基础架构满足 `VMware FT` 的要求且你想启用它，可以轻松地做到。取决于\
  \ VM 和主机的设置，你可能可以在 VM 运行期间启用。然而，我们总是会关闭要启用 `VMware FT` 的虚拟机。关闭 VM 可以确保获得最佳结果，并让\
  \ `vSphere` 快速为 `FT` 配置 VM。\n\n### 如何在 VM 上启用 VMware 容错：\n\n1. 登录 `vSphere Client`\
  \ 并进入 `VMs and Templates`（虚拟机和模板）视图。\n2. 右键点击该 VM 并选择 `Fault Tolerance`（容错）⇒`Turn\
  \ on Fault Tolerance`（开启容错）。\n\n会出现 `Turn on Fault Tolerance` 对话框，说明 `vSphere` 为启用该功能必须对\
  \ VM 做的更改。常见的更改是该 VM 的 `DRS` 自动化级别将变为禁用，并设置一个与分配给 VM 的内存相同的`Memory reservation`（内存预留）。如果\
  \ 目前是精简配置（thin）或厚配置（thick）的，但未完全清零，对话框还会注明 `vCenter` 将转换磁盘文件并需要一些时间。图 20-3 显示了一个包含所有三个问题的“令人生畏”的对话框。\n\
  \n**图 20-3：** 关于容错的惊人“警告”对话框。\n\n![9780470768723-fg2003.eps](img/9780470768723-fg2003_fmt.jpeg)\n\
  \n3. 点击 `Yes`。\n\n在 `Recent Tasks`（最近任务）面板中，注意系统执行了若干任务以在 VM 上启用 `FT`。当任务完成后，`vSphere\
  \ Client` 将 VM 的图标更改为深色的 VM 图标，如图 20-4 所示。\n\n开启 FT 时发生的一个任务是创建一个备用虚拟机，名称与第一个相同，并附加了\
  \ `(secondary)`。为了防止混淆，`vSphere Client` 不会在导航面板中显示此备用虚拟机，但你可以通过点击 `Datacenter`（数据中心）对象然后点击\
  \ `Virtual Machines`（虚拟机）标签页看到它，如图 20-4 所示。\n\n该 VM 已启用容错，但你仍需要启动虚拟机。按正常方式启动，你现在拥有了一个完全容错的解决方案！\n\
  \n**图 20-4：** `vSphere Client` 显示启用了 `FT` 的 VM。\n\n![9780470768723-fg2004.tif](img/9780470768723-fg2004_fmt.jpeg)\n\
  \n你可以打开主、备虚拟机的控制台，但备用控制台始终是只读的。你可以看到备虚拟机处理相同的指令、绘制相同的图形，并完全遵循主虚拟机。\n\n## 保护多 VM\
  \ 应用程序\n\n使用 `VMware FT` 保护单个 VM 可能很简单，但许多应用程序跨越多个 VM。如果你想保护该应用程序，必须确保所有服务器都以某种方式受到保护。所有作为\
  \ VM 的服务器都必须满足前提条件。如果物理服务器提供任何服务，该服务器也必须使用另一个产品进行容错设置。因此，要真正实现容错，解决方案涉及的所有组件都必须是容错的。如果你使用多个启用了\
  \ `VMware FT` 的 VM 构建容错应用程序，并将它们全部连接到同一个非冗余网络交换机上，你可能并没有真正实现容错的目标。\n\n## 制定规则（并打破规则）\n\
  \n像 `DRS` 这样的自动化系统非常有帮助，但如果它们将两个相互冗余的 VM 放在同一台主机上怎么办？如果该主机发生故障，可能会影响所有 VM。\n\n默认情况下，`VMware\
  \ HA` 非常认真地对待其工作。事实上，当你启用它时，它确保了当集群中发生故障故障时，有足够的资源迁移受影响的。这一功能被称为准入控制（admission control），你可以保持启用，也可以禁用它。图\
  \ 20-5 显示了默认的 `VMware HA` 属性，你可以定义围绕 VM 如何启动的规则。\n\n通常，你希望开启准入控制，以防过度配置集群，导致主机故障影响\
  \ VM 的整体性能。有时你需要禁用准入控制以进行维护，或者对于充满非生产 VM 的集群来说这可能过度了。准入控制确保了如果主机发生故障，HA 有空间迁移 VM，确保没有\
  \ VM 被遗留。\n\n**图 20-5：** 围绕准入控制的 `HA` 属性。\n\n![9780470768723-fg2005.eps](img/9780470768723-fg2005_fmt.jpeg)\n\
  \n## 管理可接受故障设置\n\n`Admission Control Policy` set 的默认值为“1”，对于只有几台主机的集群来说非常好，但在拥有许多主机的集群中，你可能希望允许多个主机同时故障。你可以通过更改\
  \ `Admission Control Policy` 面板中的选项来设置故障情况下预留多少容量。你有三个选项：\n\n![check.png](img/check.png)\
  \ `Host Failures Cluster Tolerates`：此默认设置配置为一台主机故障，这意味着 HA 系统将在所有其他主机上预留一台主机的资源。你可以配置最多四台主机。当\
  \ `vSphere` 计算需要为主机预留多少资源时，它假设可能故障的是性能最强大的主机，并根据集群中最大的 VM 确定需要的 VM 插槽。这些插槽是 HA 引擎用于简化计算的逻辑组。由于\
  \ HA 非常保守，它最大化了保护，但这种保守方法可能会导致准入控制在集群仍有可用资源阻止 VM 启动。通常，`Host Failures Cluster Tolerates`\
  \ 准入控制常用于主机和 VM 较为均匀的情况。\n\n\n\n\n\n![check.png](img/check.png) 预留作为备备容量的集群资源百分比：此设置允许你比“集群容错主机数”设置进行更细粒度的控制。你可以选择高达\
  \ 50 百比的任何金额。这种方案非常灵活，因为它简单地预留了总容量的百分比。当每个主机的可用资源量不同时，这种方案特别适用。但在实际操作中，此设置有一个负面影响，即无法确保剩余容量是连续的。因此，如果你需要为主机故障预留\
  \ 16GB，且你有 16 台主机，你可能在某个主机上预留 16GB，也可能在 16 台主机中的每台上预留 1GB。如果需要迁移的 VM 每个都需要 2GB，那么每台主机上只有\
  \ 1GB 意味着 HA 将没有地方放置这些故障的 VM！HA 与 DRS 集成以进行资源调度，因此它可能能够解决问题，但恢复过程将花费长得多。\n\n![check.png](img/check.png)\
  \ 指定备备主机：此选项指定在主机发生故障时的一个单个主机来接管 VM。当你启用此选项时，指定的主机将从自动 VM 放置和 DRS 操作中移除。此选项仅允许单个主机故障，并且在主机资源量相同时工作效果最佳。\n\
  \n## 配置关键情况的备配置\n\nVMware HA 保护的范围不仅限于主机故障。你可以在集群 HA 设置中启用 VM 监控，如图 20-6 所示。VM 监控让主机通过安装在\
  \ VM 中的 VMware Tools 提供的心跳信号来监控 VM。如果在在设定的时间范围内没有收到心跳信号，HA 代理将监控该 VM 的 I/O 使用情况，以确定该\
  \ VM 是否确实已宕机。如果没有显示任何活动，HA 将启动重启 VM 的过程。\n\n这种能力非常强大，它将 HA 的功能从硬件扩展到了 VM 本身。它还能防止操作系统和应用程序挂起。在\
  \ vSphere 中，应用程序开发人员还可以利用软件开发包 (SDK) 将此心跳功能扩展到应用层。应用程序监控是一个较新的功能，但 VMware 期望未来的应用程序能够与\
  \ HA 服务集成。\n\n**图 20-6：** 集群设置中的 VM 监控设置。\n\n![9780470768723-fg2006.eps](img/9780470768723-fg2006_fmt.jpeg)\n\
  \n## 为维护期间的访问者留出空间\n\nvSphere 的优点之一是在 VM 在集群其他地方激活状态的同时执行许多操作。要做到这一点，你将主机放入维护模式，主机上的\
  \ VM 将移动到集群中的其他主机。\n\n通常，一组服务器可以容忍一次故障，但并不总是能容忍两次。因此，在执行维护时，请确保你有足够的容量以保证所有程序运行正常，并努力让主机尽快恢复服务。\n\
  \n# 第 21 章：vSphere 故障排除\n\n## 本章内容\n\n- ![arrow](img/arrow.png) 探究为什么好身上会发生坏事\n\
  - ![arrow](img/arrow.png) 收集问题的实情事实\n- ![arrow](img/arrow.png) 探索常见问题及其产生原因\n\n\
  在任何 vSphere 环境中，只要给足够的时间，问题总会发生。这并不一定反映管理不善，甚至不可能是因果报应。vSphere 环境本身随着时间的推移会增长并变得复杂，这意味着问题发生的可能性会增加。\n\
  \n本章为你的 vSphere 环境提供了一些基本的故障排除技术。你将发现一些在 vSphere 中出现的较常见问题以及如何快速识别它们。你还会发现一些防止未来故障的贴士。\n\
  \n## 进行常规故障排除\n\n当你第一次遇到问题时，请向后退一步，观察大局。寻找受影响系统之间的共同点，并查看其是否与另一个环境问题（如存储或网络）存在相关性。如果你从外部得不到答案，你就需要进行一些故障排除了。\n\
  \n在任何故障排除过程中，你都需要逐一执行每一步。良好故障排除的关键在于确保你可以隔离出根源。为了做到这一点，你需要确保记录下你的操作。\n\n当问题出现时，你首先需要查看环境最近发生了什么变化。通常情况下，最近的更改（如补丁或更新）可能是问题所在。某些成功应用的补丁会因增加主机安全性而导致问题，因此连接到主机的系统有时也需要更新。\n\
  \n![remember.eps](img/remember_fmt.jpeg) 查看发生了什么通常是最好的开始方式。当问题出现时，撤销或回滚最近的更改通常是应该采取的第一步。\n\
  \n撤销最近的更改后，通过评估环境继续进行故障排除，一次进行一项更改。有时，更改是基于最佳实践的，而另一些更改是直觉的结果。做一次更改并测试结果。记住，互联网（尤其是社区论坛和网站）可以提供很多提示。在任何情况下，如果你在一个团队中工作，请记住集思风暴并以团队的形式来处理情况，因为多个独立工作的故障排除人员可能造成的损害大于益处。\n\
  \n并不是所有问题都是最近更改的结果。有时，问题会凭空出现，但你采取的故障排除步骤是相似的。\n\n## ESXi：更容易还是更难排除？\n\nVMware 有两个版本的裸机虚拟化程序：ESX\
  \ 和 ESXi。ESXi 没有服务控制台，因此在故障排除时需要不同的方法。那么，ESXi 是更容易还是更难排除呢？\n\n大多数工程师会说 ESXi 更难排除，但由于其规模较小，出问题的机会较少。由于服务控制台，ESXi\
  \ 可能会受到升级的的影响。你可以通过 vSphere Client 完成大部分任务。对于自动化，可以使用 vCLI、PowerCLI 或 VMware SDK。\n\
  \n### 技术支持模式\n\n在排除 ESXi 故障时，你可能需要进入技术支持模式。TSM 是一个提供基础 Linux 控制台的功能，但它是有限的。TSM 本地或远程连接。你可以分别启用它们，也可以同时启用。最好只启用你需要的。\n\
  \nVMware 建议仅在支持指示时使用 TSM。使用 TSM 时，设置超时以便断开所有会话并退出技术支持模式。\n\n在 ESXi 4.1 主机上启用 TSM：\n\
  \n1. 打开并登录 vSphere Client。\n2. 导航到主机和集群视图，并在导航面板中选择主机。\n3. 点击`配置`选项卡，点击`安全配置文件，然后点击`属性`超链接。\n\
  弹出`服务属性`窗口，如图 21-1 所示。\n4. 选择`本地技术支持`或`远程技术支持 (SSH)`并点击`选项`。\n弹出`选项`对话框。\n5. 点击`启动`。\n\
  `技术支持模式`启动。\n6. 点击`确定`。\n\n**图 21-1：** 用于启用 TSM 的`服务属性`窗口。\n\n![9780470768723-fg2101.eps](img/9780470768723-fg2101_fmt.jpeg)\n\
  \n## PSOD\n\n你可能知道蓝屏死 (BSOD) 是什么，但紫屏死 (PSOD) 呢？PSOD 有其他常见名称，但在 VMware 处通常被称为紫色诊断屏幕，如图\
  \ 21-2 所示。\n\nPSOD 可能由多种问题引起，例如：\n\n- ![check.png](img/check.png) 硬件错误\n- ![check.png](img/check.png)\
  \ 存储错误\n- ![check.png](img/check.png) 驱动程序问题\n- ![check.png](img/check.png) 虚拟机监控器\
  \ (VMM) 故障\n\n**图 21-2：** 紫屏死 (PSOD)。\n\n\n\n\n\n![9780470768723-fg2102.tif](img/9780470768723-fg2102_fmt.jpeg)\n\
  \n就像微软产品的蓝屏死（BSOD）一样，PSOD 包含了丰富的信息。它会显示产品版本信息、实际错误文本以及 CPU 寄存器信息。你通常可以确定问题的原因，但如果你遇到了\
  \ PSOD，联系 VMware 支持部门通常是个好主意。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ VMware 在其网站上有多篇关于如何排错 PSOD 的文章。请查看 [http://kb.vmware.com/selfservice/microsites/search.do?language=en_US&cmd=displayKC&externalId=1004250]\
  \ 以获取有关紫色屏幕错误的详细文章。\n\n## 利用日志文件\n\n当糟糕的事情发生时，你可能不在现场捕捉到它们。幸运的是，ESX 有几十个日志可以阐明问题。尽管有这么多日志，经验丰富的\
  \ vSphere 管理员经常也会遇到几个常见问题：\n\n![check.png](img/check.png) **服务控制台日志**：位于 `/var/log/messages`\
  \ 服务控制台日志提供了服务控制台所使用的 Linux 系统的详细信息。此日志用于诊断与管理连接和 Linux 控制台相关的问题。\n\n![check.png](img/check.png)\
  \ **VMKernel 日志**：位于 `/var/log/vmkernel` 的 VMKernel 日志提供了 vSphere 主机上虚拟机的信息。此日志可能会变得非常大。\n\
  \n![check.png](img/check.png) **VMkernel 警告日志**：由于位于 `/var/log/vmkwarning` 的 VMkernel\
  \ 日志可能会非常大，VMware 会提取 VMKernel 日志中的警告和错误，并将它们写入 VMkernel 警告日志中。这是许多管理员在诊断 vSphere\
  \ 主机问题时首选查看的地方。\n\n![check.png](img/check.png) **VMkernel 摘要**：位于 `/var/log/vmksummary`\
  \ 的摘要提供了有关可用性和运行时间的数据。它对于判断主机的运行状态很有帮助。\n\n![check.png](img/check.png) **vCenter\
  \ Agent 日志**：位于 `/var/log/vmware/vpx` 的此日志文件关注主机与 vCenter Server 之间的通信。它有助于排查 vCenter\
  \ 服务器与 ESX 主机之间的连接问题。\n\n![check.png](img/check.png) **虚拟机**：当虚拟机出现问题时，在与虚拟机配置文件相同的目录下会有一个名为\
  \ `vmware.log` 的日志。\n\n在与 VMware 技术支持人员合作时，你可能会被要求将日志发送到 VMware 分析。面对这么多日志，你如何决定发送哪些日志，以及使用什么格式呢？\n\
  \n正如你可能猜到的，VMware 已经考虑过这个问题，并让你能够直接从 vSphere Client 轻松获取相关日志。要创建日志支持包，只需选择“管理（Administration）⇒导出系统日志（Export\
  \ System Logs）”。\n\n此步骤会打开导出系统日志对话框，如图 21-3 所示。在这里，你可以选择要导出日志的设备。通常，最好只包含你怀疑可能是问题所在，因为创建系统日志包可能需要很长时间，而且日志文件可能很大。VMware\
  \ 支持通常会给你一个位置，你可以通过文件传输协议（FTP）上传到那里。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ vSphere Client 确保你可以轻松地获取 vSphere 日志包，但如果你的问题与网络有关怎么办？你也可以通过在命令行输入 `vm-support`\
  \ 在主机上创建一个包。如果你在使用 ESXi，则需要激活本地技术支持模式（Local Tech Support Mode）来运行 `vm-support` 命令。然而，请考虑如何在没有网络的情况下将日志从\
  \ vSphere 主机导出！如果你有一个共享存储且另一台有网络的机器连接到该共享磁盘，可以将日志包复制到共享存储数据存储，然后使用 vSphere Client\
  \ 中的数据存储浏览器（Datastore Browser）从数据存储中获取。\n\n**图 21-3：** 导出系统日志对话框。\n\n![9780470768723-fg2103.eps](img/9780470768723-fg2103_fmt.jpeg)\n\
  \n## 排错 SAN\n\n存储区域网络（SAN）非常灵活且强大，但也非常复杂。SAN 的排除主要发生在交换矩阵和阵列上，但 SAN 排错的某些方面也关注 vSphere\
  \ 主机。\n\n### 刷新和重新扫描\n\n在向 vSphere 主机呈现卷后，你可能无法立即看到它。通常，你希望立即看到卷，以便重新扫描主机以发现新卷。\n\
  \n在删除卷时也可以重新扫描，事实上，这是确保该卷确实不再对主机可用的一种良好方法。\n\n### SCSI 锁\n\n虚拟虚拟机文件系统（VMFS）数据存储上的某些操作需要临时锁定。这些锁定被称为\
  \ SCSI 预留（SCSI reservations），它们允许主机在短时间内对数据存储进行独占访问。\n\nSCSI 预留存在包含许多虚拟机的数据存储上会发生得更频繁。限制\
  \ VMFS 卷的大小可以减少受影响的虚拟机数量。SCSI 预留通常是一件大问题，但过多会导致主机失去访问权限。如果你的集群中一切正常，但某天你发现某些虚拟机离线了，你可能遇到了\
  \ SCSI 预留。\n\n## 解决高可用性（HA）错误\n\nHA 在危机时刻可以成为救星，但它通常是 vSphere 最容易出错的区域之一。没有任何大型\
  \ vSphere 环境不会出现偶尔的 HA 排错。以下章节描述了一些需要注意的项。\n\n### 重复配置 VMware HA\n\n即使在 HA 运行之后，你可能仍需要重新配置。在将主机添加到集群时，在选择“重新配置\
  \ VMware HA”过程之前，该主机不会完全参与 HA。每当主机上出现 HA 问题时，第一步通常是重新配置 VMware HA。\n\n### 准入错误\n\
  \n默认情况下，当你启用 HA 时，准入控制也会启用。许多新接触 vSphere 的管理员并并不在乎准入控制的作用，直到某天毫无征兆地被错误打了一脸，告诉他们没有足够的资源来启动虚拟机！\n\
  \n不要成为那种管理员！准入控制是为了确保当你向成员承诺他们的虚拟机受 HA 保护时，你不是在撒谎！相反，请查看你的 HA 设置，我们在第 20 章中将解释这些内容。\n\
  \n\n\n\n当在集群上设置 HA 时，集群中每个活动状态的主机都有一个角色（参见第 20 章）。其中一些是主 HA 节点，另一些是备节点。集群中的前五个主机是主节点，它们将保持该状态，直到主机故障并进入维护模式，或者管理员从\
  \ `vSphere Client` 执行 `Reconfigure for VMware HA`（重新配置 VMware HA）。为了让 HA 发工作，主节点必须协调\
  \ VM 故障转移，因此在上述场景中，如果五个主节点都在同一个机箱内，一旦发生故障，HA 将变得毫无用。\n\nVMware 正在努力让主节点和备节点的指定更具可配置性，目前有几种不支持的方法可以修改哪些主机是主节点。在未来，这些不支持的方法可能会变得完全支持。目前，如果你使用刀片服务器，最好每个集群包含八台主机，并均匀分布在两个机箱之间。这样，在整个机箱故障时，主节点将始终处于状态。\n\
  \n# 隔离岛 (Isolation island)\n\n当主机丢失网络连接性时，运行在其上的 VM 可能仍在正常运行。HA 可以检测到网络问题并开始迁移 VM。为此，HA\
  \ 代理会定期扫描隔离地址，默认情况下该地址是服务控制台的默认网关。如果默认网关不可用，HA 代理可以迁移主机，如果主机确实不再连接网络，这将是一件好事。\n\n\
  在复杂的网络中，拥有多个隔离地址可能更好，最多可以设置十个。你可以通过集群 HA 设置的高级选项中设置 `das.isolationaddress1` 到 `das.isolationaddress10`\
  \ 参数来创建十个。如果你确实使用了多个隔离地址，允许更多时间来检测故障通常是一个好主意。该设置是 `das.failuredetectiontime` ——\
  \ 它以毫秒为单位，应设置为至少 20 秒（`20000`）。\n\n# 故障排除过度超配的主机 (Troubleshooting Oversubscribed\
  \ Hosts)\n\n当你首次设置虚拟基础架构时，客户虚拟机的性能可能会非常出色。由于竞争极少，每个 VM 都能获得其请求的资源。然而，随着你在基础架构上放置更多的\
  \ VM，情况可能会变慢。以下章节涵盖了关于如何保持 VM 最佳性能的一些故障排除技巧。\n\n## 禁用不需要的设备\n\n每个 VM 都有一组使用的虚拟硬件。虚拟硬件配置文件中的每个设备都会消耗一些资源，因此你应该禁用或删除任何不需要的设备。这样做还可以提高安全性，因为攻击者无法使用该设备。\n\
  \n## 安装/更新 VMware Tools\n\n每当你升级 vSphere 版本时，你都会想要更新 VMware Tools。这样，你可以确保安装了最新的驱动程序，并且添加了\
  \ VMware 特有的驱动程序，例如帮助管理内存消耗的气球驱动程序。VMware Tools 工具包还会设置多个注册表设置来优化 VM 的性能。\n\n###\
  \ 每次重启时更新工具\n\n你可能好奇如何确保你的 VMware Tools 保持更新。每个 VM 的属性中都有一个完全可以做到此点的设置，许多管理员甚至不知道！要启用\
  \ VMware Tools 自动更新，请转到 VM 的属性，点击 `Options`（选项）选项卡并选择 `VMware Tools` 项目。在相应的设置中，选择\
  \ `Check and Upgrade Tools During Power Cycling`（在电源循环期间检查并升级工具）。\n\nVMware Tools\
  \ 的自动更新提供了一种保持同步的简单方法，但它会导致驱动程序的自动安装和更改。在启用自动更新之前，请确保你对系统在没有用户或管理员干预的情况下采取这些操作感到放心。\n\
  \n![tip.eps](img/tip_fmt.jpeg) 如果你选择启用 `Check and Upgrade Tools During Power Cycling`，当系统在主机升级后首次启动时，VM\
  \ 会立即重启。作为主机升级的一部分，请为 VM 的双重启动做好计划。如果你将虚拟机 `vMotion` 迁移到升级后的主机，这种重启不会立即发生，但将在下次重启时发生。\n\
  \n## 不要过度使用预留 (Don’t overuse reservations)\n\n在故障排除性能问题时，一个常见问题是过度使用预留。记住，通过预留提交的资源不可供其他\
  \ VM 使用，因此你可能会陷入麻烦。\n\n在必须设置预留的情况下，考虑理想的预留不要太大也不小。要确定预留的大小，你可以使用性能监控工具查看历史趋势。根据这些信息，你可以设置一个确保\
  \ VM 拥有运行所需资源的预留。如果 VM 需要更多资源，可以请求，但 VM 使用的资源永远不会少于预留。（更多关于预留的信息请第 19 章。）\n\n# CPU\
  \ ready 及其重要性 (CPU ready and why it matters)\n\nESX 中的 CPU 指令在物理 CPU 上调度。在物理服务器上，操作系统每次想要调度指令时不需要等待\
  \ CPU 可用。VM 则不同，它们必须等待 CPU。这种等待被称为 CPU ready，它是指 VM 有工作要做但必须等待 CPU 可用以执行指令时花费的时间。数字越低越好，但只要存在虚拟化层，CPU\
  \ ready 就永远不会真正为零。\n\n这个指标很重要，因为如果你的 CPU ready 时间很高，你的系统性能可能会很。每个 VM 可能有不同的 CPU\
  \ ready 时间，你会发现多处理器 VM 的 CPU ready 时间通常更高。这种情况有时通过想象过山车最容易理解。\n\n过山车有八个座位。如果你在排队（就像等待调度的\
  \ `vCPU` 一样），你将一直等到轮到你。一旦轮到你，你将进入任何空闲座位，然后出发！\n\n如果你和朋友在一起呢？你可能想一起乘坐，就像一个带有两个 vCPU\
  \ 的 VM 需要一起调度一样。为了这样做，你可能需要允许前面的人通过以填充空间，这取决于你前面的人以及哪些空间是空的。在这里，因为你想骑但不能，你的 CPU\
  \ ready 时间增加了！\n\n如果你是和四个朋友在一起呢？作为一个四 vCPU 系统，你可能需要等更久直到情况出现。与此同时，那个单人游客者可以继续上去填补空间！\n\
  \n如你所见，除非有证据表明需要多一个 `vCPU`，否则最好让每个 VM 都从一个 `vCPU` 开始。这样，你可以减少 VM 等待运行。\n\n# 处理 vCenter\
  \ 故障 (Handling vCenter Troubles)\n\n偶尔，vCenter Server 会给你出个绊手球。尽管 vCenter 非常稳健，但它清晰解释为什么无法执行某些操作的能力非常匮乏。大多数错误足够独特，很容易在\
  \ VMware 知识库中搜索，但你只需要了解一些常见的错误，我们在下面的章节中进行了描述。\n\n### 无法将模板转换为虚拟机 (Cannot convert\
  \ template to a VM)\n\n## 客户机自定义错误 (Guest customization errors)\n\n\n\n\n客户定制错误可能会非常令人困扰，因为在模板部署完成之前，你是看不到错误的。通常，这些问题很难排错，因为在客户成功定制之前，你对客户的访问权限有限。\n\
  \n如果 Windows 系统的自定义失败，可以检查 `%SYSTEMROOT%\\Temp\\guestcust.log` 处的日志。该日志文件通常包含关于虚拟机可能无法正确自定义或完全未进行自定义的信息。\n\
  \n# vCenter Server 已停止且无法启动\n\nVMware `vCenter Server` 是 `vSphere` 的中央控制站。当 `vCenter`\
  \ 停止且无法再次启动时会发生什么？在大多数情况下，受 `vCenter` 管理的虚拟机都不会发生任何变化，但 `vCenter Server` 处于非功能状态绝对是一个关键问题。\n\
  \n偶尔（有时更频繁），Windows “服务”账户的密码会在其他管理员处在不预告的情况下被更改。检查 `vCenter Server` 宿主机上的 `Services`\
  \ 管理控制台，查看你是否可以手动启动 `vCenter Server` 服务。检查 `vCenter Server` 服务是否配置为使用 Windows Active\
  \ Directory 账户运行。如果是，尝试启动服务。如果配置的凭据有问题，Windows 会立即通知你。\n\n安装 `vCenter` 时，是否使用了默认的\
  \ Microsoft SQL Express 数据库？如果你的 `vCenter Server` 运行了一段时间，它可能已经达到了 `Microsoft SQL\
  \ Server` Express  4GB 数据库大小限制。在这种情况下，你可以原地升级数据库版本，将 Express 版本替换为完整版 `SQL Server`，或者将数据库移动到另一个\
  \ `SQL Server`。所有选项都有完善说明。\n\n另一个导致 `vCenter Server` 崩溃的条件是包含 `vCenter Server` 日志、数据库或两者的磁盘卷已满。在卷上清理一些空间将为\
  \ `vCenter Server` 提供写入日志文件的空间。如果 `vCenter` 消耗磁盘空间的速度比正常快，请检查日志级别。为了排错会增加日志记录，而这些日志可能被无意中留在了更详细的设置上。\n\
  \n# 处理虚拟机崩溃\n\n物理机可能由于许多原因而崩溃，虚拟机也是如此。许多崩溃的常见原因包括应用程序问题、操作系统配置错误或驱动程序问题。\n\n对于虚拟机，你通常不需要担心持续性的硬件问题，因为虚拟机实际上是软件。然而，你仍然需要执行通常所需的相同排错步骤。虚拟机还会有一些在物理环境中通常不需要的偶发性问题。\n\
  \n## VMFS 空间不足\n\n`VMFS` 数据存储包含多个包含数据的虚拟机磁盘文件 (`VMDK`)。如果你使用 `vSphere` 强大的精简置配功能，这些\
  \ `VMDK` 将根据需要各自增长。某些虚拟机可能增长缓慢，而另一些可能增长很快。由于增长速率不同，你可能会发现 `VMFS` 满了。当 `VMFS` 数据存储满时，许多虚拟机（特别是精简置配的虚拟机）可能会失败。在这种情况下，操作系统将崩溃或直接挂起。\n\
  \n![tip.eps](img/tip_fmt.jpeg) 修复满的 `VMFS` 可能很棘。通常，你做的第一件事是检查是否有可以删除的文件。在大环境的每个数据存储上，你通常会发现一个或多个孤立虚拟机。删除这些孤立文件可以快速释放空间并让你恢复工作，但请记住\
  \ `VMFS` 数据存储没有“回收站”功能。\n\n如果没有可以删除的虚拟机，可以将虚拟机移动到另一个数据存储。因为数据存储上没有磁盘空间，你将无法使用 `Storage\
  \ vMotion`，因此你需要关闭虚拟机再进行迁移。\n\n释放磁盘空间后，任何经历过失败的虚拟机都需要重启。\n\n## 缺失或幽灵硬件\n\n许多虚拟机是从物理系统迁移到虚拟平台的。这种被称为\
  \ `物理转虚拟` (`P2V`) 的常见程序通常会在客户虚拟机的硬件规格中留下设备。在虚拟机运行后，移除任何不再需要的旧设备和项目是一个好主意。\n\n##\
  \ Windows 中错误的 HAL\n\nWindows 有一个硬件抽象层 (`HAL`)，它在运行的软件和硬件之间提供屏障。Windows 中的 `HAL`\
  \ 通常表示 Windows 系统是多处理器系统还是单处理器系统。你通常不需要担心 `HAL` 不匹配问题，因为在物理服务器世界中按需扩展并不容易，但在 `vSphere`\
  \ 中这非常常见。\n\n向虚拟机添加或删除处理器是一项简易的任务，所需的停机时间不超过重启。然而，在操作之后，检查 `HAL` 以确保你加载了正确的版本。在具有多个\
  \ `vCPU` 的系统上运行单处理器 `HAL` 会降低性能和稳定性。在仅有一个 `vCPU` 的系统上运行多处理器 `HAL` 可能会导致崩溃和极极下降。有时，Windows\
  \ 即插用可以自动检测并升级 `HAL`，但它通常不会自动降级 `HAL`。\n\n# 处理网络问题\n\n在所有 `vSphere` 实现中，`网络` 是虚拟机管理和可用性成功的关键。由于\
  \ `vSphere` 宿主机通常设置方式不同，许多网络问题是 `vSphere` 特有的。几种网络症状非常常见：\n\n![check.png](img/check.png)\
  \ 某些虚拟机可以通信，另一些不能！可能没有比一个主机上的某些虚拟机通信良好，而另一些却不能的情况更令人沮丧了。这个问题通常是由于 `VLAN` 存在问题。因为一个主机可以运行来自多个\
  \ `VLAN` 的虚拟机，所以当整个 `VLAN` 出问题时，看起来似乎只是单个主机的问题。\n\n`VLAN` 问题很容易通过将可测试的虚拟机移动到受影响的\
  \ `VLAN` 来测试。然而，有时你会发现问题不在 VLAN 级别，即使在同一个 `VLAN` 内，某些虚拟机正常而另一些却不行！\n\n![check.png](img/check.png)\
  \ 甚至媒体访问控制地址有效，而另一些无效。在这种情况下，你应该查看虚拟机的媒体访问控制 (`MAC`) 地址。每个 `MAC` 地址都是一个十六进制表示的数字。许多端口聚合方法依赖于在一个连接上发送偶数，在另一个连接上发送奇数。系统本应检测到故障并将所有通信移动到存活的链路上，但有时链路不会发生硬故障。这种情况在光纤连接中特别常见，玻璃可能没有让所有数据通过。\n\
  \n![check.png](img/check.png) 路由 vMotion，或者更糟！vMotion 失败很难排错。一个常见问题是没有为 vMotion\
  \ 分配非路由 VLAN。在这种情况下，虽然你可以通过路由器进行 vMotion，但结果是不可预测的。vMotion 期望有一个高速连接，因为它在通过线路复制内存内容。确保你有一个快速连接，并且所有使用\
  \ vMotion 的系统都能通过第 2 层连接。\n\nPart VII\n\nThe Part of Tens\n\n![9780470768723-pp0701.eps](img/9780470768723-pp0701_fmt.jpeg)\n\
  \n在本部分中 . .\n\nThe Part of Tens 指向你 For Dummies 读者熟悉并喜爱的不可缺缺资源，我们一次向你介绍十个。第 22 章提供了有关自动化管理\
  \ vSphere 环境十个工具的详细信息。第 23 章涵盖了在线进一步学习 vSphere 知识的十个地方。第 24 章提供了十个强大的专业技巧，用于成功的\
  \ vSphere 部署。\n\n第 22 章\n\n让 vSphere 管理更简单的十个工具\n\n在本章\n\n![arrow](img/arrow.png)\
  \ 自动化重复性任务\n\n![arrow](img/arrow.png) 简化日常 vSphere 管理\n\n\n\n\nVMware vSphere 是一个相当复杂的解决方案，VMware\
  \ 在构建 vSphere 架构方面做得非常出色。作为一名 vSphere 管理员，你会发现自己开始不断一次又一次地以相同的方式执行相同的任务。这些重复性工作非常耗时，并且会占用你进行基础设施管理的时间。本章将为你提供十种工具，帮助你实现\
  \ vSphere 基础设施的自动化。\n\n## VMware PowerCLI\n\n[communities.vmware.com/community/vmtn/vsphere/automationtools/powercli](http://communities.vmware.com/community/vmtn/vsphere/automationtools/powercli)\n\
  \nVMware vSphere PowerCLI（见图 22-1）是一个基于 Microsoft PowerShell 的加载项（Snap-in），旨在让即使是最复杂的\
  \ vSphere 任务也能通过 PowerShell 轻松编写脚本。PowerCLI 涵盖了 vSphere 管理的各个方面，包括存储、网络、主机、虚拟机和客户机操作系统。PowerCLI\
  \ 是免费的，拥有超过 200 个 PowerShell 命令（cmdlets），并包含了文档和示例。\n\n**图 22-1：** VMware PowerCLI。\n\
  \n![9780470768723-fg2201.eps](img/9780470768723-fg2201_fmt.jpeg)\n\n## VMware Project\
  \ Onyx\n\n[labs.vmware.com/flings/onyx](http://labs.vmware.com/flings/onyx)\n\n\
  Onyx（见图 22-2）是一个位于 vSphere Client 和 vCenter Server 之间的独立应用程序。Onyx 监听它们之间的网络通信，并生成模拟正在传递命令的可执行\
  \ PowerShell 代码。你可以根据自己的需要修改这些代码并将其放入重用的 PowerShell 脚本中。Onyx 是一个巨大的时间节省器，特别是如果你知道如何通过\
  \ vSphere Client 工作，但没有时间或耐心去研究如何在 PowerCLI 中实现相同的操作时。\n\n**图 22-2：** VMware Labs\
  \ 的 Onyx 工具。\n\n![9780470768723-fg2202.tif](img/9780470768723-fg2202_fmt.jpeg)\n\
  \n## DynamicOps 云自动化中心\n\n[www.dynamicops.com](http://www.dynamicops.com)\n\n瑞士信的\
  \ IT 人员于 2004 年开发了 DynamicOps 管理软件，以解决在具有独特需求的多个不同业务组中部署虚拟化的挑战。2008 年，随着管理的虚拟机达到数千并发现了一个商机，该银行将\
  \ DynamicOps 拆分了一家公司。\n\nDynamicOps 云自动化中心 (DCAC) 让你能够在公司 IT 策略的范围内快速创建和部署按需 IT\
  \ 服务。DCAC（见图 22-3）利用共享资源在私有和/或公有云中管理虚拟机和物理机的部署。其他投资银行以及金融服务、消费品、制造业、医疗保健、教育和政府领域的领导者使用该软件管理全球数万台虚拟机。\n\
  \n**图 22-3：** DynamicOps 云自动化中心。\n\n![9780470768723-fg2203.tif](img/9780470768723-fg2203_fmt.jpeg)\n\
