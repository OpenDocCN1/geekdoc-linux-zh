  \ ESX 4 和其他操作系统。只要新服务器能够从网络进行 PXE 启动，UDA 就会接管新服务器并加载 ESX 4，准备好配置。UDA（见图 22-6）以虚拟设备的形式提供，可以使用\
  \ vSphere Client 和 vCenter Server 直接导入到你的 vSphere 环境。\n\n**图 22-6：** 终部署设备。\n\n\
  ![9780470768723-fg2206.tif](img/9780470768723-fg2206_jpeg)\n\n\n\n\n该网站由 Doug A.\
  \ Brown（`DABCC.com` 中的 DAB）创立，在过去的几年中呈指数级增长。`DABCC.com` 汇聚了来自虚拟化行业各撰稿作者的深度见解和具有教育意义的文章。DABCC\
  \ 还是虚拟化新闻和出版物的巨大聚合器，是搜索的绝起点。\n\n## Mike Laverick 的 RTFM 教育\n\n[www.rtfm-ed.co.uk](http://www.rtfm-ed.co.uk)\n\
  \nRTFM（代表“Read the Flippin’ Manual”，即“读该死的手册”）是知名虚拟化专家 Mike Laverick 的结晶。RTFM 拥有丰富的资源，包括视频、播客、下载指南和应用程序。RTFM\
  \ 是 `Ultimate P2V` 的所在地，这是一个由社区创建的物理到虚拟转换工具，用于从物理机创建 `VMware VMs`。\n\n## NTPRO.NL\n\
  \n[www.ntpro.nl](http://www.ntpro.nl)\n\n`NTPRO.NL` 由荷兰的 Eric Sloof 于 2004 年 7 月建立，包含了大量的在线培训、视频、工具等。`NTPRO.NL`\
  \ 还是 `vmClient` 的所在地，这是一个用于直接控制台访问和控制虚拟机的简单工具。\n\n## Petri IT 知识库\n\n[www.petri.co.il/virtualization.htm](http://www.petri.co.il/virtualization.htm)\n\
  \nPetri IT 知识库充满了适用于各种技术的有用帖子、指南和实用程序，但其虚拟化部分尤为出色。Petri IT 知识库由 Daniel Petri 创立，是在寻找\
  \ `VMware` 手册中未涵盖的操作信息时的顶级资源。\n\n## virtualization.info\n\n[www.virtualization.info](http://www.virtualization.info)\n\
  \n自 2003 年以来，`virtualization.info` 一直关注虚拟化行业的脉搏。Alessandro Perilli 为你提供虚拟化的一切内幕，包括产品评论、预测、白皮书、网络会议和采访。如果你想了解最新动态，请查看此网站。\n\
  \n## VMware 知识库\n\n[`kb.vmware.com`](http://kb.vmware.com)\n\n当 `vSphere` 给你带来时，官方的\
  \ `VMware Knowledgebase`（`KB`）是你要的地方。`VMware KB` 是已知问题和修复的权威来源。如果你收到来自 `vSphere`\
  \ 的错误消息，请先在此搜索。\n\n## VMware 社区\n\n[`communities.vmware.com`](http://communities.vmware.com)\n\
  \n`VMware Communities` 是 `VMware` 管理员、专家和工程师连接并讨论一切 `VMware` 的地方。那里积分积分积分奖励提供有用正确答案的用户。在使用下一个\
  \ `vSphere` 问题搜索 `VMware Communities` 网站时，你可能会发现已经有人问过这个问题，并得到了许多巡视论坛的专家之一的解答。\n\
  \n## vSphere Land\n\n[`vSphere-land.com`](http://vSphere-land.com)\n\n`vSphere Land`\
  \ 由顶级 `VMTN` 社区成员和 `VMware` 导师 Eric Seibert 创立，已成为 `VMware` 相关信息的巨大仓库。该网站包含了许多针对新手和经验丰富的\
  \ `vSphere` 管理员的技巧、策略和其他绝佳主意。\n\n## xtravirt\n\n[`xtravirt.com`](http://xtravirt.com)\n\
  \n`xtravirt.com` 充满了与虚拟化和 `VMware vSphere` 相关的白皮书、新闻、博客和下载。它被称为“虚拟化知识门户”，提供了丰富的内容甚至一些帮助你进行日常管理的工具。\n\
  \n## Yellow Bricks\n\n[www.yellow-bricks.com](http://www.yellow-bricks.com)\n\n\
  `Yellow Bricks` 由 `VMware` 咨询架构 Duncan Epping 创立。该网站包含关于 `VMware HA` 和 `DRS` 的优秀深度信息，以及许多与\
  \ `VMware` 和 `vSphere` 相关的综合帖子。如果你好奇，该网站的名字源自冷酷乐队的一首歌《Old Yellow Bricks》。\n\n# 第\
  \ 24 章\n\n## 成功部署 vSphere 的十个专业技巧\n\n## 本章内容\n\n- ![arrow](img/arrow.png) 第一次就正确完成配置\n\
  - ![arrow](img/arrow.png) 在 `vSphere` 设置过程中避免常见陷阱\n\n`VMware vSphere` 是市场上最稳健的虚拟化平台。它在企业中的普及和存在产生了大量关于部署\
  \ `vSphere` 最佳实践的知识和专业领域，其中很大程度上通过实践获得。以下是虚拟化专家和老兵常用的十个技巧，以确保 `vSphere` 部署顺利且成功。\n\
  \n### 充分利用 vSphere 内存优化\n\n`vSphere` 虚拟化的最佳功能之一是通过透明页共享（`TPS`）来优化内存使用。`TPS` 通过消除\
  \ `VMs` 之间常见的冗余数据块，并将其替换为指向公共内存块的指针来优化内存消耗。\n\n![tip.eps](img/tip_fmt.jpeg) 将相似的虚拟机放在一起（特别是安装了相同应用程序的），以充分利用\
  \ `TPS`，剩下的将由 `TPS` 处理。\n\n### 监控带有精简配置虚拟机的数据存储的利用率\n\n精简配置（Thin provisioning）允许你在每个数据存储上放置更多的虚拟机，因为精简配置虚拟磁盘消耗的空间等于\
  \ `VM` 内部的实际数据。虽然大多数虚拟机运行的时间并不长到足以消耗整个虚拟磁盘，但其占用空间会缓慢增长。随着永久 `VMs` 的增长，它们预期为这种增长提供可用空间。最终，数据存储将达到容量，寻找空间增长的\
  \ `VMs` 将受到影响并失败。\n\n幸运的是，`vCenter` 在跟踪分配与实际数据存储容量方面做得非常好，甚至在达到某些阈值时提醒你。考虑对生产应用程序使用预分配的（厚置配置的）虚拟磁盘以消除风险。\n\
  \n### VM 快照是静默的空间消耗者\n\n快照就像安全网：你可以进行更改，并知道可以将机器回滚到创建快照时的时间点。如果更改不成功，你只需还原到快照即可。问题发生在更改成功且你为了“以防万一”而保留快照，然后忘记了它。快照最终可能会增长到与基础虚拟磁盘一样，但额外的空间消耗不会反映在\
  \ `VM` 设置中显示的 `VM` 虚拟磁盘容量中。带有遗忘快照的虚拟机不仅以不起眼的方式消耗磁盘，还会在数据存储达到容量时使 `VM` 面临失败的风险。\n\
  \n![warning_bomb.eps](img/warning_bomb_fmt.jpeg) 随着快照增大，删除所需的时间越长。删除大型快照可能需要几小时甚至几天才能完成。开始删除快照后，在过程完成之前你无法对\
  \ `VM` 进行任何其他操作。\n\n### 洁净的模板让虚拟机更健康\n\n`vSphere` 中的虚拟机模板是配置为从源镜像克新虚拟机的虚拟机。为你的环境建立一套虚拟机模板是一项耗时的任务，但对于\
  \ `VM` 的完整性来说是值得的投资。\n\n![warning_bomb.eps](img/warning_bomb_fmt.jpeg) 如果为了节省时间而捷径创建虚拟机模板，最终将付出代价。在将机器转换为虚拟机模板之前，检查所有虚拟媒体（如\
  \ CD/DVD 和软盘镜像）已卸载而非仅断开，安装的 `VM Tools` 版本是最新的，并且 `VM` 的客户操作系统已安装所有更新。这些简单的检查将节省时间，减少问题，并让以后故障排除变得容易。\n\
  \n![tip.eps](img/tip_fmt.jpeg) `vCenter Server` 中虚拟机的摘要选项卡显示 `VM Tools` 的状态，甚至会告诉你运行虚拟机中的现有\
  \ `VM Tools` 版本是否已过期。\n\n### 自动化虚拟机的启动/关机\n\n\n\n\n\n每天，数据中心都会发生不可预见的事件。即使连接了冗余电源输入、冗余电源源以及中间的所有环节，对于非任务关键型机器，意外的停机有时是不可避免的。\n\
  \n与运行独立操作系统的传统服务器不同，除非在 `vCenter` 中专门设置了自动开机，否则 `VMs` 将不会重新启动。如果你在虚拟机中运行 `vCenter`、`domain\
  \ controllers`、`DNS servers` 或任何其他对 `vSphere` 至关重要的系统，则这些 `VMs` 需要按照特定顺序启动，以使基础设施恢复在线。在因主机维护而需要关闭这些基础设施\
  \ `VMs` 的罕少数情况下，情况也是如此。\n\n![tip.eps](img/tip_fmt.jpeg) 请花时间配置 `VMs` 的自动启动/关闭，以缩短故障后的恢复时间，并在维护期间让工作更轻松。\n\
  \n## 并非所有人都需要 vCenter 访问\n\n一个常见的误区是，所有与虚拟机交互的人都需要访问 `vCenter Server`。这种观点完全不是事实。实际上，`vCenter\
  \ Server` 的并发连接数是有限制的，在大规模环境中你很容易超过这个限制。\n\n![tip.eps](img/tip_fmt.jpeg) 找出虚拟机用户需要执行的操作，并提供能够提供相同功能的替代方案。许多时候，这些功能可以通过\
  \ Windows 端的 `Remote Desktop` 访问和 Linux 端的 `SSH` 访问提供。VMware 还提供了实用程序，允许用户通过基于 Web\
  \ 的 GUI 执行简单操作，例如电源控制和快照。\n\n## 同类相聚的 vSphere 集群\n\n`vSphere` 集群是利用 `vCenter` 实现高可用性和工作负载优化的最佳部署配置。该功能的关键组件是\
  \ `vSphere` 在不同 `ESX host` 上移动和运行 `VM` 的能力，无论通过 `vMotion` 还是通过简单的 `HA` 和共享存储。\n\n\
  有一件真正让这种兴奋感大打折扣的事情是：由于处理器不兼容，`VM` 无法在主机之间移动。这些挑战中的某些在 `vSphere 4.1` 中得到了解决，但防止它们发生的最佳方法是使用相同的服务器硬件构建集群。理想情况下，在\
  \ `vSphere` 集群中部署相同的服务器是最佳做法。\n\n次优选择是使用具有共同指令集的处理器的服务器。请查看 VMware 网站上的 VMware 硬件兼容性指南获取特定\
  \ CPU 的品牌和型号。\n\n## 避免 vMotion 动症\n\n`vSphere` 的一个显著特性是分布式资源调度程序（`DRS`），它不断寻找通过在集群内的\
  \ `ESX hosts` 之间移动 `VMs` 来改进工作负载分布的机会。`DRS` 对每项建议的有效性进行一到五星排名，五星最有效。具有 `vMotion`\
  \ 能力的 `vSphere` 环境允许 `DRS` 在虚拟机运行的同时对其移动。\n\n某些管理员采取“设置好就置不管”的方法——即将 `DRS` 设置为全自动模式，并告诉它对它提出的任何建议采取行动，即使是单星建议。作为回应，`DRS`\
  \ 开始在整个集群中移动虚拟机，以实现工作负载的平衡。\n\n![warning_bomb.eps](img/warning_bomb_fmt.jpeg) 偶尔，将\
  \ `VM` 移动到集群中的某个主机的影响会触发 `DRS` 将另一个 `VM` 从同一主机移动到另一个主机，从而引发骨米牌效应。这种现象被称为 `vMotion\
  \ 动症`。为了尽量减少这种情况发生的概率，当在全自动模式下配置 `DRS` 时，不要将 `DRS` 设置为三星以下。\n\n## 处理主机名解析\n\n某些虚拟环境，特别是那些位于高度监管行业中的环境，在向其域名系统服务（`DNS`）服务器添加新主机名方面面临挑战。当部署\
  \ `ESX hosts` 时，它们需要管理员为机器指定主机名，并提供一个或多个 `DNS` 服务器的 IP 地址。`ESX host` 期望能够通过 `DNS`\
  \ 名称查找伙伴，以便进行集群通信和管理。`vCenter Server` 也是如此。\n\n一种通通方法是手动在 `vCenter Server` 的主机查找文件中放置主机名条目，以便\
  \ `vCenter Server` 能够通过名称解析 `ESX hosts`。如果 `ESX hosts` 未在 `DNS` 中注册，但使用主机名添加到 `vCenter\
  \ Server`，则 `ESX hosts` 将不知道如何通过名称相互访问。这种情况反过来会触发 `vCenter Server` 中模糊的 `HA` 配置错误。\n\
  \n![tip.eps](img/tip_fmt.jpeg) 为了完全避免这种情况，要么将 `ESX` 和 `vCenter Server` 的主机名添加到 `DNS`，要么使用\
  \ IP 地址而不是名称将所有 `ESX hosts` 添加到 `vCenter Server`。\n\n## 到处安装 VM Tools\n\nVMware\
  \ 创建 `VM Tools` 是为了桥接 `VM` 内部客户操作系统与其运行的 `ESX host` 之间的管理通信差距，同时保持两者之间的安全隔离。`VM\
  \ Tools` 还包括针对面向客操作系统的网络、磁盘和其他虚拟化组件的优化驱动程序。某些功能通过 `VM Tools` 得到了增强，例如增加了停止运行的 `VM`\
  \ 虚拟磁盘以拍摄点快照，或启动 `VM` 中客户操作系统的关机而不仅仅是关电源。安装 `VM Tools` 对于监控虚拟机的健康至关重要，它应该是你的虚拟基础设施中创建的每个\
  \ `VM`（以及 `VM` 模板）的标准组件。\n\n![IFC_top](img/IFC_top.jpg)\n\n要获取专门针对本书的快速抄表，请访问 [www.dummies.com/cheatsheet/vmwarevsphere](http://www.dummies.com/cheatsheet/vmwarevsphere)。\n\
  \n![IFC_bottom](img/IFC_bottom.jpg)\n\n在 [Dummies.com](http://www.dummies.com) 了解“如何”。\n\
