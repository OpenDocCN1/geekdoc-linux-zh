  \n准确的中文转换应该是这句译文保持明确直译会让阅读理解更容易---------后面下→以下是最终严格按照要求做出的完整无缺不漏行的精确译本 。\n\n---\n\
  \n\n\n\n\n\n![check.png](img/check.png) 虚拟机泛滥：当获取机器的很大过程被跳过或不存在时，创建虚拟机的难度要比部署物理机容易得多。用户看到了虚拟机克隆的快速部署速度，开始将拥有和运行虚拟机的成本与虚拟机本身解耦。没过多久，环境中就存在大量的临时机器，它们被遗弃、遗忘，或者被收起来以备“防万一”之需在未来的某天使用。\n\
  \n![check.png](img/check.png) 硬件需求增加：要从 vSphere 虚拟化获得最大回报，最好的方法是利用 vSphere 的高价值功能，例如内存共享和虚拟机磁盘的精简配置。运行相同操作系统的机器越多，效率就越高。为了将所有这些机器装到单台主机上，服务器行业贴心地构建了更大、更强大（甚至更昂贵）的硬件，以便每个主机容纳更多的虚拟机。尽管整体上物理机数量减少了，但部署更大主机的成本可能等于或超过使用“一应用一服务器”模型在低性能服务器上部署等效容量的成本。\n\
  \n![check.png](img/check.png) 整个环境复杂性增加：除了服务器层硬件的增加，虚拟化还需要额外的网络和存储网络。对网络和存储基础设施提出的独特需求可能需要对计算基础进行某些升级。\n\
  \n![check.png](img/check.png) 新技能需求：既然你正在阅读这本书，你已经知道虚拟化需要更新 IT 技能，即使在主要产品版本发布之间也是如此。对\
  \ vSphere 管理进行充分的培训是必须的。自学 vSphere 的管理员所产生的虚拟化部署效率可能低于经过该任务培训的人员。从长远来看，粗糙的部署成本将远高于充分的培训资源。\n\
  \n# 当虚拟化不可行时\n\n虚拟化是一项令人兴奋的技术，尤其是当你意识到其部署带来的深远潜和收益时。就像微波炉、互联网或任何其他颠覆性技术一样，人们倾向于沉浸在技术中，边做边探索边界。在准备成为虚拟化先驱之前，这里是某些虚拟化并非可行方案的情况：\n\
  \n![check.png](img/check.png) 基于硬件的多媒体应用：在 vSphere 服务器中安装多媒体接口卡并不能让你将该卡的功能映射到虚拟机。\n\
  \n![check.png](img/check.png) 电话应用：基于互联网的语音通信在过去几年已被主流采用，但基于电信的电话服务时代已远去。仍有几个供应商提供电信适配器，用于呼叫中心、语音邮件系统和其他交互式语音驱动应用。这些基于基卡的电信适配器无法映射到虚拟机，不应安装在运行\
  \ vSphere 的服务器上。\n\n![check.png](img/check.png) 其他虚拟化产品：在虚拟机中安装另一个虚拟机管理程序（hypervisor）通常不起作用，即使有效，性能也只是充强过关。\n\
  \n![check.png](img/check.png) 在虚拟化平台上不支持：信不由信，某些软件供应商如果看到产品运行在虚拟机中，仍然不会提供支持。这并不意味着它在虚拟机中无法运行；当问题发生时，如果运行在虚拟机中，软件只会拒绝就该问题提供支持。\n\
  \n![check.png](img/check.png) 许可：某些软件具有针对虚拟化的特定许可限制，例如运行为物理桌面计算机许可的许可的桌面操作系统。\n\n\
  ![tip.eps](img/tip_fmt.jpeg) 什么是真正的不支持？很多时候，即使虚拟化不支持，但如果你与供应商紧密合作，你也可以从那里获得针对特定案例的支持。在排除某个应用之前，尝试联系你的供应商。根据你组织的客户规模，你可能会感到惊讶！\n\
  \n# 第 3 章：探索 VMware vSphere 的功能\n\n## 本章内容\n\n- ![arrow](img/arrow.png) 为什么标准的 VMware\
  \ vSphere 如此独特\n- ![arrow](img/arrow.png) 通过高级 vSphere 选项提升层次\n- ![arrow](img/arrow.png)\
  \ 企业级 vSphere 虚拟化\n\n自从几年前引入 VMware ESX 以来，VMware 就通过虚拟化技术的创新引领了软件行业。VMware 通过其\
  \ vSphere 平台继续保持领先，整合了针对支持关键任务应用的新型企业级功能。尽管如此，vSphere 的标准功能已经建立了其他虚拟化平台与之对比的标准。\n\
  \n在本章中，你将了解到 vSphere 的标准功能以及这些功能之所以独新的之处。我们讨论了高级功能以及 vSphere 企业版中的功能。你还将发现一些仅在 vSphere\
  \ Enterprise 版中可用的功能。\n\n## 探索 vSphere 的独特功能\n\nVMware 通过仅在 vSphere 上提供的功能组合以及持续创新来与众不同。这种创新导致了新的企业级功能，驱动了虚拟化在关键任务环境中的采用。\n\
  \nvSphere 许可模型将功能组分为三大类：标准版（Standard）、高级版（Advanced）和企业版（Enterprise）。本章其余部分解释了这三之间的差异和相似之处。\n\
  \n## 查看标准 vSphere 功能\n\nVMware vSphere 继续统治企业虚拟化市场，但产品核心的标准功能是人们选择 vSphere 而非其他虚拟化平台的原因。VMware\
  \ 特有的技术，从内存超配的处理方式到集群级的高可用性，都强化了 VMware 的地位。本节涵盖了 vSphere 中的标准功能。\n\n### 内存超配\n\n\
  运行 vSphere 的最大优势之一是 VMware 对内存管理的精通。vSphere 有三种不同的方法来处理虚拟机（VM）的内存竞争。每种方法适用于特定条件，因此通常会同时应用多种方法。\n\
  \n### 跨虚拟机共享内存\n\n每个 vSphere 部署都包含运行相同操作系统的多个虚拟机，这意味着虚拟机在内存中具有一些相同的数据（称为页面）。主机不在\
  \ ESX 主机的物理内存中存储冗余页面，而是使用透明页共享（TPS）来移除冗余页面。TPS 透明地工作，扫描 ESX 主机上所有虚拟机的内存，寻找多个虚拟机内存中的相同数据。当\
  \ TPS 找到此类数据时，它将其合并为 ESX 主机物理内存中的副本，并将虚拟机指向公共内存。此过程完全在 ESX 主机级完成，在三种内存超配机制中开销最小。\n\
  \n![tip.eps](img/tip_fmt.jpeg) 在规划你的 vSphere 集群时，考虑利用透明页共享（TPS）的好处。将相似的虚拟机放在同一主机上或将相似的虚拟机分组到特定集群可以化效果。\n\
  \n### 神秘的 VMware 气球驱动\n\nVMware 气球驱动自引入 VMware ESX 以来一直存在。气球驱动是安装在每个虚拟机中的虚拟机工具包。正如其名，气球驱动膨胀以占据可用内存空间。ESX\
  \ 主机获取这些内存并重新分配给急需内存的其他虚拟机。\n\n\n\n\n\n当内存短缺发生时，`balloon driver` 会根据您的定义，从较低优先级的虚拟机中挤压出内存并分配给较高优先级的虚拟机。其目的是让客户操作系统经历低内存状态，从而触发清理过程以优化已预留的内存区域。\n\
  \n## 内存压缩——因为它比交换更好\n\n通常情况下，“透明页面共享”（TPS）和 `balloon driver` 足以减少 ESX 主机上的内存争用。当\
  \ TPS 和气球挤入（Ballooning）不足以解决问题时，ESX 会将 VM 非活跃数据交换到为每个 VM 创建的磁盘文件中直到该数据再次被需要于活动内存在由于要写入磁盘固有的延迟使得选择已被换出的读取更耗时意识到将数据压缩放回物理虽然远比快于是作为最后尝试先存放缓存定期更新而实现后持续有效果供释放之前开始向机制虽然后者基于每台但区别明显因为前者高级管理员可以选择把\
  \ R 版本一样具有关键业务系统所需特性例如热添加虚拟 CPU 或完全避免停机故障例子还包括串口集中器设计初衷是面向命令行企业应用程序请见第 4 章描述它们共同构建出一个更具弹性的整体架构下面继续深入分析具体组件细节：**分布式资源调度程序**\n\
  \n“Distributed Resource Scheduler”(DRS)是一个独特的功能它允许 vCenter 通过移动 VM 来获得最佳工作负载平衡进而实现对环境的自动化优自动迁移可借助前述技术执行不间断且无需操作员干预相反也能保持手动模式仅给出建议\
  \ DRS 会持续评估集群中各主机的负载以及每一受影响程度据此计算调整位置减轻压力的阈值您可以为行动设置最低性能提升要求五个星级对应不同改善幅度一星意味着小幅提升五星则表示显著获益上述综合手段确保基础设施高效运行。\n\
  \n在发生相关问题背景下的完整英文原文翻译如下：\n\n---\n\n当出现内存短缺时，*气球驱动程序*可能会根据你的设定从较低优先级、并向更高一个等级之上进行压制提取然后再赋予给它希望达到诱发来宾\
