  \ Stailey**，组排服务总监\n\n# 引言\n\n偶尔会有某项技术的出现，改变我们处理日常业务的方式。这种技术被称为“颠覆性技术”，它具有如此显著的优势或改进，以至于人们愿意改变通常的做法来引入这项新技术。虚拟化就是这些颠覆性技术之一，而\
  \ `vSphere` 正走在领先位置。\n\n从外部观察时，`vSphere` 令人生生畏。它看起来像是一个巨大的复杂性怪兽，能够跨越数千台服务器，连接数 TB\
  \ 级的存储空间，甚至在不关机的情况下移动机器。你可能觉得这力不从心，还没入门就压力很大？事实是，`vSphere` 可以根据你的需要变得大而也可以小。没那么可怕。\n\
  \n这本书充满了实战经验，汇集了我们在 VMware 技术方面的日常冒险。它为你提供了让 `vSphere` 运行起来的秘诀。\n\n# 关于本书\n\n本书是对\
  \ VMware `vSphere 4` 的全面介绍。它提供了规划、安装和管理 `vSphere` 虚拟基础设施所需的信息。书中涵盖了 `vSphere` 的常见元素以及如何让它们为你服务。虽然欢迎从头到尾阅读这本书，但每一章都专注于特定的主题，因此也可以作为参考指南。章节进一步分为节，以便你快速获取所需信息。\n\
  \n这本书并不是 `vSphere` 手册。事实上，它是 `vSphere` 的反手册，旨在用通俗易懂的英语提供你所需或所需的 `vSphere` 信息，没有那些术语，很少使用\
  \ `TLAs`（三字母缩写）。\n\n书中没有考试或测试，所以你不需要记忆书的内容。把书中有用的部分记在脑子里，剩下的留在页之间即可。如果你需要查阅某些内容，应该很容易在抽屉里找到这本黄书。\n\
  \n# 如何使用本书\n\n本书是对复杂技术的介绍，采用了“傻瓜系列”的对话式写法。我们描述了一些关于事物运作原理和原因的概念。其他概念则基于过程或比较。为了尽可能简单，我们这样列出它们：\n\
  \n*   在项目列表中，通常你会发现概念名称加粗了，后面是该概念的定义。\n*   简单的信息列表只是普通文本。\n*   **过程中的编号步骤加粗显示**，后面是普通文本形式的额外细节和描述。\n\
  *   命令和网址 URL 以等宽字体显示。\n\n# 你不需要阅读的内容\n\n\n\n\n\n# 引言\n\n本书针对几种不同的读者群体，每种群体都有不同的需求：\n\
  \n![check.png](img/check.png) 如果你是技术经理，你可能想读本书，但可以跳过带有“技术细节”（Technical Stuff）图标的信息和列表。\n\
  \n![check.png](img/check.png) 如果你是系统管理员，你可能想读本书，并多读几次第 21 章。在深入配置之前，可以先浏览一下第 24\
  \ 章，并将这些提示记在脑子里。\n\n![check.png](img/check.png) 如果你是丰富的 VMware 管理员，你可以直接跳转到第 4 章查看\
  \ VMware Virtual Infrastructure 3.5、vSphere 4 和 vSphere 4.1 之间的差异。然后查看每章的引言，看看这些信息对你来说是否是新知识。\n\
  \n你不需要阅读灰色小框（即侧边栏）中的信息。虽然这些信息很有趣，但对于理解当前主题并非必须。\n\n## 假设的假设\n\n尽管本书是为虚拟化新手编写的，但我们对你——读者做了一些假设：\n\
  \n![check.png](img/check.png) 你已经精通使用台式或笔记本电脑处理电子邮件和网页浏览等事务。\n\n![check.png](img/check.png)\
  \ 你知道服务器是什么，如何远程连接它，并且具有管理一个或多个服务器的经验或者认识这样做的人。\n\n![check.png](img/check.png) 你对网络和存储区域网络（SAN）有基本的了解。\n\
  \n![check.png](img/check.png) 你拥有 VMware vSphere 4.1，并且至少有一台位于 VMware 硬件兼容性列表（[www.vmware.com](http://www.vmware.com））上的服务器。\n\
  \n## 本书结构\n\n本书分为七部分，每部分描述了 vSphere 部署的一个阶段：\n\n### 第一部分：决定 vSphere\n\n这的部分是对 VMware\
  \ vSphere 和虚拟化的介绍。vSphere 拥有许多特性和功能，这部分涉及了所有功能。如果你是从之前的 VMware ESX 版本过渡过来的，你甚至可以找到相应的章节来了解版本之间的差异。\n\
  \n### 第二部分：为 vSphere 准备\n\n确保 vSphere 部署成功的最好方法是对发布进行规划和准备。这部分的章节将向你展示如何规划 vSphere\
  \ 部署，并在进行规划时提供几个需要考虑的重点。这部分还提供了为 vSphere 安装准备环境所需的细节。\n\n### 第三部分：安装 vSphere\n\n\
  正确的安装是确保 vSphere 环境正常运行的关键。这部分将详细带你完成安装 VMware ESX、vCenter Server 和 vSphere Client\
  \ 的每一个步骤。这部分的章节是相互独立的，因此你可以快速访问你正在安装的产品安装步骤。\n\n# 第四部分：配置和连接 vSphere\n\n本书的部分完全关于配置你新的\
  \ vSphere 基础设施。这部分的章节帮助你配置 vCenter Server 并连接到网络。你还将将存储附加到 ESX 主机，并将它们配置为集群。\n\n\
  ### 第五部分：管理和维护 vSphere\n\n这部分的章节讨论了 vSphere 基础设施的日常运行和持续维护。你可以创建和克隆虚拟机，组织资源，并在虚拟机构建后监控设置。你还可以从高层次快速概述虚拟基础设施。\n\
  \n### 第六部分：调优和排错 vSphere\n\n随着你 vSphere 环境的增长，你需要确保每台虚拟机都能获得公平的资源。这部分的章节帮助你调优虚拟机组的性能，并解决故障容和和可用性考虑。此外，还有整整章节专门用于排除最常见的\
  \ vSphere 问题、如何识别它们以及去哪里寻求解决方案。\n\n### 第七部分：十项指南\n\n最后，本书以著名的“十项指南”（Part of Tens）部分结束，其中每章都列出了十项项目或主题。这部分的一个章节包含了帮助你管理\
  \ vSphere 基础设施的工具列表，另一个章节包含了一些优秀的在线资源以进一步提高你的 vSphere 知识。最后一章包含了专业人士提供的关于成功部署 vSphere\
  \ 的十条建议。\n\n## 本书中使用的图标\n\n在书的页边，你会看到一些小图片，称为图标，它们突出了不同类型的信息：\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ 此图标标记了有用、帮助的提示或快捷方法。\n\n![remember.eps](img/remember_fmt.jpeg) 此图标标记了执行某事的友好提醒。\n\
  \n![warning_bomb.eps](img/warning_bomb_fmt.jpeg) 此图标标记了不要做某事的友好提醒。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
