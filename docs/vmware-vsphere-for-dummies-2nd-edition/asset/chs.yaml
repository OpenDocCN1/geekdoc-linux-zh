  如果你是虚拟化新手，请从本书的开始开始。熟悉术语。在下一次家庭聚会时解释 vSphere 和虚拟化的概念。最重要的是，不要感到压力太大。毕竟，这只是软件。\n\n\
  花些时间探索书末尾“十项指南”部分中的网站和资源。这些资源的存在是为了让你的工作更轻松。\n\n你也可以访问 Dan 的网页以获取更多信息或作为消遣：[www.startswithv.com](http://www.startswithv.com)。\n\
  \n\n\n\n\n# VMware vSphere 部署指南\n\n`VMware vSphere`由众多组件构成，有些你可能从未使用过，而另一些则每天都会用到。由于逐一覆盖\
  \ `vSphere`所有组件的组合与功能并不现实，本书将聚焦于最常见的配置方案，但也会提及产品中的每一项特性。如何部署 `vSphere`取决于你的环境、初始实施范围以及所部署的\
  \ `vSphere`版本。\n\n尽管 **VMware** 的功能和选项极为丰富以至于你几乎不可能有机会全部用上；更常见的情况是：在触及新特性的前提——即真正理解某项技术之前——就已经获得了足够好的效果。”\n\
  \n\n\n\n\n`vCenter Server` 是持续管理 `vSphere` 环境的大脑。`vCenter` 也是大多数第三方虚拟化管理平台的集成点，是将\
  \ `vSphere` 环境整合到云计算的基础，这听起来可能很复杂，但远不止于此。`vCenter` 允许为你喜爱的 `vSphere` 相关工具安装插件，例如\
  \ `VMware Converter`。`vCenter` 还承担着许可责任，因此 `vSphere` 环境中任何经过许可的软件都至少利用了 `vCenter\
  \ Server` 的许可服务器功能。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 像任何具有颠覆性但又新兴的技术一样，云计算的名称代表了一个具有多重含义的概念。有些人一听到“云计算”这个术语，会想到一种按小时租用服务器资源的服务。另一些人则认为云计算是一个安全的地方，你可以在那里运行应用程序，计算能力仅限于你的钱包。云计算专家至少在一点上达成共识：云计算涉及将某些计算资源作为服务。`vSphere`\
  \ 允许你在内部创建一个计算资源池，并可以像云一样管理这些资源，动态地为虚拟机提供计算能力，而不是将它们作为离散的组件传递。这就是为什么 `vSphere` 被\
  \ VMware 誉为云操作系统。\n\n`vCenter Server` 比其前代支持更多的 `ESX` 主机、虚拟机甚至更多的 `vSphere` 客户端连接。现在可用的另一个功能允许多个\
  \ `vCenter Servers` 链接在一起，在管理层提供某种程度的冗余。为了成功部署 `vCenter Server`，请特别注意 `vCenter Server`\
  \ 的安装、配置和功能部署。\n\n# 第 2 章：简介虚拟化\n\n## 本章内容\n* ![arrow](img/arrow.png) 思考虚拟化\n* ![arrow](img/arrow.png)\
  \ 了解虚拟化的工作原理\n* ![arrow](img/arrow.png) 让虚拟化归其位\n\n虚拟化是一项颠覆性技术，永远改变了我们思考 IT 基础设施的方式。大多数人人都听过虚拟化、云计算和\
  \ VMware。它们运行得如此良好这很棒，但虚拟化到底呢？\n\n本章将带你了解服务器虚拟化的概念。你将看到虚拟化与日常观念之间的某些对比，并在过程中发现一些术语。你还将了解到虚拟机的优点和缺点，以及它们与物理世界的比较。\n\
  \n## 思考“虚拟”\n\n虚拟化并不新鲜，不是魔法，也没有你想象的那么复杂。理解虚拟化的挑战有一半在于正确解释其周围的术语。另一半则是接受虚拟化作为一个简单的概念，而不要试图把它变得更复杂。\n\
  \n人们自然地会对经常说的术语进行缩短、缩写或创建首字母。你永远不会听到人们说“自包含式水下呼吸设备”（Self-Contained Underwater Breathing\
  \ Apparatus），除非他们正在告诉你缩写“SCUBA”代表什么。信息技术几乎总是“IT”，万维网（World Wide Web）被缩写为 Web，而连接网络被称为“在线”。那么，虚拟化意味着什么呢？\n\
  \n对于大多数人来说，“虚拟（virtual）”一词指的是人工事物，如“虚拟现实（virtual reality）”。另一些人认为虚拟是指几乎是真实的东西，如“我几乎做完了”。在服务器虚拟化中，“虚拟”一词的最好定义是：经过抽象但仍与真实资源相关联的东西，例如虚拟\
  \ CPU 或虚拟磁盘。它们都运行在真实的对应物上，但为了让虚拟机可以在不同的服务器型号上运行，在虚拟和物理之间插入了一个层。将虚拟资源映射到物理硬件的抽象层被称为\
  \ `hypervisor`（虚拟机监控器）。\n\n从所有意义上，虚拟化通常是“x86 服务器硬件虚拟化”的缩写。在以下列表中，我们分解了该术语：\n\n*\
  \ ![check.png](img/check.png) **x86**: 指一种指令集由 `Intel 80386` 32 位 CPU 普及的处理器。操作系统（如\
  \ Windows 和 Linux）主要运行在基于 `x86` 的处理器上。（`vSphere` 需要基于 `x64` 的处理器，即扩展 64 位指令集的 `x86`\
  \ 族处理器。）\n* ![check.png](img/check.png) **服务器**: 指操作系统（OS）实例和多用户应用程序，例如 Web 服务器或数据库服务器。服务器也用于描述操作系统和应用程序运行的物理计算机硬件。\n\
  * ![check.png](img/check.png) **硬件虚拟化**: 当多个操作系统运行在同一块物理硬件上但相互隔离时，每个操作系统都认为自己是该机器上运行的唯一系统。\n\
  \n简而言之，曾经绑定到基于 `x86` 的物理硬件的操作系统和应用程序已变成了一桶比特位，这些比特位可以与其他比特桶放在一起，运行在同一台物理服务器上，但它们并不知道自己正在与其他比特桶共享硬件。\n\
  \n![tip.eps](img/tip_fmt.jpeg) 虽然云计算和虚拟化有关，但它们并不是同一种东西。云计算可能将虚拟化和虚拟机作为底层平台，但云计算扩展到了基础设施之外。相反，云计算是提供资源（如虚拟机或托管应用程序）作为服务。\n\
  \n## 虚拟机并没有那么不同\n\n虚拟机和物理机几乎是一样的。它们都拥有 CPU、内存、硬盘、操作系统、网络连接，甚至还有 BIOS。你可以在它们上加载应用程序并远程连接它们，就像对物理机操作一样。虚拟机非常像物理机，以至于操作系统甚至不知道自己处于虚拟机中。如果有人远程连接到该机器，除非你告诉他们，否则他们可能根本不知道自己正在使用虚拟机。\n\
  \n虚拟机可以进一步扩展到物理世界，以支持需要真实物理资源的特定情况。某些集群应用程序需要在物理层级共享磁盘卷。VMware `vSphere` 能够通过原始设备映射（RDM）将虚拟机连接到物理磁盘。`RDM`\
  \ 是 `vSphere` 缩小物理与虚拟服务器差距的另一种方式。\n\n## 真实的虚拟硬件\n\n操作系统供应商面临着艰巨的任务，要尝试支持尽可能多的硬件。虚拟机采取了不同的方法，通过呈现行业中最常见组件的虚拟版本，在各种操作系统中获得最多的内置支持。这种方法意味着你可以轻松安装流行的操作系统，而无需加载额外的驱动程序。它允许虚拟机运行在具有不同型号或品牌的组件服务器上，无需对虚拟机进行任何更改。\n\
  \nVMware 通过为 `vSphere` 特定虚拟硬件提供优化驱动程序，将虚拟硬件更进一步了一。这种 vSphere 特定虚拟硬件的一个示例是名为 `VMXNET`\
  \ 的虚拟网络接口。当你安装其自定义驱动程序时，该虚拟网络适配器会被启用，该程序包含在大多数 VMware 虚拟机 `VMware Tools` 工具包的默认驱动程序集中。\n\
  \n## 再次回归虚拟化\n\n虚拟化太像 1960 年的产物了\n\n\n\n\n曾几何时，大型主机是数据中心的王者。除了纯粹的处理能力外，它还有另一个巨大的优势：系统操作员可以调度执行特定任务（称为作业）的不同程序在同一个硬件上同时运行。更棒的是，这些作业的优先级可以被重新调整，使某个作业获得比另一个更多的处理时间。大型机过去和现在最大的障碍依然是采购、运维系统的成本。\n\
  \n1965 年，英特尔联合创始人戈登·摩尔做出了以下预测：“芯片中集成的晶体管数量大约每 24 个月翻一番。”这一预测后来被称为`摩尔定律`。随着计算机处理器体积变小且制造成本变得昂贵——企业\
  \ IT 开始转向购买能够独立运行程序的桌面电脑而无需连接到中央主机成功推动了专用单用途应用的采购趋势网络技术的改进提供了协作动力服务器性能呈指数级提升突然之间强大的计算能力远超了曾经需要全部资源的应用程序需求\n\
  \n“一应用一服务器”模式最终确实让一些公司陷入困境——占用大量空间消耗热量利用不充分的有限容量增长超过了扩张速度而物理空间的安装解决方案随之而来：用更多但更少的平台带来了旧有风格的回归。\n\
  \n## 从监工到超监管器\n虚拟化源于分时共享的大型机通过轮流方式使用处理器批处理分配的任务允许一定百分比的总周期这被称为切片在一段时间内划分循环并优先分配切片如今该概念仍应用于架构大多数商用计算机都包含两种技术其中机器发送指令\
  \ vCPU 已经直接执行的代码可能会影响安全性必须翻译成隔离运行的二进制码一套与另一套借助协助不同早期实现则需要模拟显著增加了每次请求的开销`\n\n简化理解的方法是把汽车合用看作资源池看看周围交通工具上的空位想想图\
  \ 2 的可能性很多人去办公室然后考虑如果住得近分开前往目的地每天通勤听起来是不是浪费燃料？\n\n财务好处减少了道路拥堵转化为交通流量减少车辆一起出行实现了整合如图\
  \ 2203 所示至少支持达到结果利用率降低并非牵强附会不合理能耗总是随需求下降合乘者轻微的经济减速原因很简单移动重量占据顶部 OSDownload 图形分别展示了容器标签项谈论绘制《蒙娜丽莎》示意图可被全球用户识别描述基础用以加载组件为何广受欢迎了解知识的任何人都能读懂续篇故事引向大众这是你熟悉的由市场代表制造商组装发货一旦到达便匹配水平如上文总结所述体现了计算模型演变历程最终虚拟化为现代基础设施效率设计优化考量性能可用性扩展等关键因素跨行业成功实施适应不断演进的需求与趋势未来机遇挑战依然存在领域正以技术创新加快步伐拓宽可能性边界追求无止境的优化无缝集成增强生产力带来广泛社会影响环境可持续性与经济可行性总体目标旨在为从业者和爱好者提供指导原则面对持续变化的复杂格局最佳实践也需相应进化以满足生态系统中各利益相关方日新月异的要求包括多学科合作的综合视角培养整体方案有效应对组织在全球范围内试图挖掘潜力最大化投资回报时所面临的多元问题。\n\
  \n\n\n\n这种传统的服务器配置方式会将整台服务器（CPU、内存、网络和磁盘）全部用于运行单个操作系统实例及一组相关应用程序。大多数专用于单一应用的物理服务器的利用率极低，仅使用了其实际容量的约\
  \ 5%。简单的计算就能说明问题：当操作系统和应用只消耗了服务器总容量的不足 5%时，剩余的 95%容量就完全闲置了。而不幸的是，无论服务器的使用率是 5%还是\
  \ 95%，其运行成本（电力、冷却系统、机架空间）几乎是一样的。\n\n## 这就是虚拟化下的机器\n\n接下来的问题是：“有没有办法利用我服务器上剩下的处理能力？”这时示意图开始转变，虚拟化的概念初现端倪。图\
  \ 2-6 进行了扩展，展示了虚拟化层是如何加入其中的。\n\n在图 2-6 中，传统伺服器不再是一块独立的硬件设备。在物理服务器硬件与其操作系统之间插入了一个**虚拟机态层**\
  \ 。该实体主机直接安装超管理器软件但未显示底层 OS 依赖关系因此表述需精准修正为：\"We insert a **virtualization layer**\
