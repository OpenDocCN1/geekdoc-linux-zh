  \ Next（此处可选添加数列或留后提醒）.注：唯有事先设定好才启...\"Generate..Application configured .。”；建议保持两者一致最佳实践采用原名；接下来出现许可证填写\
  \ Productkeyserverinfo 由于无法校验请确保准确无误；\n3. .输管理员密码并可行为设置为多久保存生效次数；“注意事项—如原始账户重命名则会改动到储存端点引用安全标识符(SID)，故名字对新旧无所谓”。同样密码也不支持合规检查因此小心保管噢\
  \ ~~完事后给个时间下拉列表》抵达 RunOnce 面板录入命令式工具安排存盘；\n4. Set net parameters 这里宽松一点图速度等完之后再加也未尝不可然后进工作组/域段去填资料下一步\
  \ （确保打算生产全新的 Security Identifier - SID 很重要因为它关连 AD 通讯）。转到 Specification 板块取消 Save\
  \ CheckBox 最后 Ready 页面汇总复核没问题就关闭助手回到初始模拟器终点单击 Finish 开始行动！\n\n\n\n\n\n每次你使用 `Sysprep`\
  \ 自定义操作系统时，你都需要提供时区、许可信息和产品密钥等信息。微软让自动化 `Sysprep` 可能，而 `vSphere` 更进了一步，通过将这些设置存储为`自定义规格`（Customization\
  \ Specifications），你可以对其进行保存和重复使用。\n\n创建自定义规格最简单的方法是在`保存规格`页面出现提示时将其保存。请确保在`描述`（Description）字段中输入适当的信息，以便你知道自定义规格中包含哪些设置。\n\
  \n要在克隆操作之前创建`自定义规格`，请点击 `vSphere Client` 并在主页选择`自定义规格管理器`（Customization Specifications\
  \ Manager）。点击`新建`按钮，如图 14-7 所示。\n\n会出现 `vSphere Client` Windows 客户机自定义向导。第一页`新建自定义规格`页面询问该自定义规格适用于哪个操作系统，之后向导的操作与前一节相同。\n\
  \n**图 14-7：** `vSphere Client` 界面显示了`自定义规格管理器`。\n\n![9780470768723-fg1407.tif](img/9780470768723-fg1407_fmt.jpeg)\n\
  \n# 不太适合克隆的内容\n\n克隆虚拟机（VM）非常方便，但有时克隆虚拟机并不是一个好主意。如果你计划克隆虚拟机，通常提前进行研究和测试是明智之举，因为问题往往不会显而易见。\n\
  \n## 带有身份标识的应用程序\n大多数应用程序从操作系统获取其身份。因此，当你克隆时，只需更新操作系统的身份，然后应用程序就会从该身份派生出自己的身份。然而，某些应用程序在应用层面具有大量的身份信息。这种情况在邮件应用程序和目录服务（如\
  \ `Microsoft Exchange` 和 `Microsoft Active Directory Services`）中非常常见。这些应用程序可能在网络上进行通信，从而为可能处于环境中的源虚拟机引起问题。\n\
  \n对于许多带有身份标识的应用程序，你仍然可以克隆它们，但在将克隆的服务器接入到网络之前，你可能需要执行若干操作。通常，你可以与应用程序供应商合作确定这些步骤。即使你对这些步骤有信心，咨询供应商通常也是明智的，以确保你的流程是完整的。\n\
  \n## 与硬件绑定的许可\n某些应用程序的许可基于特定的硬件配置。许多应用程序可能只能看到虚拟硬件，但克隆可能会存在差异，例如内部的全局唯一标识符（`UUID`），类似于物理服务器中的硬件序列号。由于克隆会更改该数字，如果某些应用程序绑定了唯一标识符，它们将无法正常运行。创建虚拟机的精确副本是可能的，但不应在\
  \ `vSphere Cluster` 集群中运行两个具有相同 `UUID` 的虚拟机。其他应用程序通常链接到以太网媒体访问控制（`MAC`）地址，拥有两个具有相同\
  \ `MAC` 地址的虚拟机也会导致出现问题。\n\n![warning_bomb.eps](img/warning_bomb_fmt.jpeg) 仅仅因为克隆可行并不意味着它是允许的。许多应用程序的最终用户许可协议（`EULA`）禁止在未购买适当许可的情况下进行克隆操作。在克隆之前，请向你的软件供应商确认技术和许可问题。\n\
  \n# 第 15 章：组织 vSphere 资源\n\n## 本章\n- 使用 `vCenter` 的不同视图\n- 对虚拟机进行逻辑放置\n- 使用 `vApps`\
  \ 对依赖机进行分组\n\n你可能会很快发现你对虚拟基础设施的视图非常凌乱。虚拟基础设施增长迅速，因此你希望从组织有序开始并保持下去。本章涵盖了对虚拟机进行分组的方法，并帮助你实现允许对组执行操作的功能，例如启动和关闭命令。\n\
  \n## 客户端视角：四个视图，一个 vSphere\n`vSphere Client` 是一个专为管理你的 `vSphere` 环境设计的实用工具。查看如图\
  \ 15-1 所示的主页，你会看到几个不同的面板，每个面板都有许多图标。\n\n你在 `vSphere Client` 的`清单`（Inventory）面板中管理\
  \ `vSphere` 对象。除了搜索图标，这里还有四个图标：`主机和集群`（Hosts and Clusters）、`虚拟机和模板`（VMs and Templates）、`数据存储`（Datastores）和`网络`（Networking）。每个图标指向一个视图，本书的部分将解释这些视图的作用。\n\
  \n**图 15-1：** `vSphere Client` 主页是你开启一天工作的好地方。\n\n![9780470768723-fg1501.tif](img/9780470768723-fg1501_fmt.jpeg)\n\
  \n### 关注 vSphere 主机：主机和集群视图\n在设置新的 `vSphere` 环境时，你主要在`主机和集群`视图中工作，如图 15-2 所示。正如你所料的，此视图关注主机和集群，但默认情况下它也会显示虚拟机和资源池。许多管理员倾向于从此视图操作\
  \ `vSphere Client`。\n\n当你需要对主机进行配置设置时，可以在此视图中进行。虽然你可以从几乎任何视图访问虚拟机，但主机最常用的管理方式是在这里。\n\
  \n`主机和集群`视图还有几个其他重要功能。你可以：\n- 创建集群\n-向集群中添加主机\n- 创建资源池\n- 创建 `vApp`\n\n**图 15-2：**\
  \ `主机和集群`视图。\n\n![9780470768723-fg1502.tif](img/9780470768723-fg1502_fmt.jpeg)\n\
  \n### 虚拟机中心：虚拟机和模板视图\n以同样的直观程度，`虚拟机和模板`视图关注虚拟机，如图 15-3 所示。虽然你可以从`主机和集群`视图创建和管理虚拟机，但你无法从那里进行任意组织。所有虚拟机都出现在`虚拟机和模板`视图中创建的文件夹里。你可以嵌套这些文件夹，而且它们不会像资源池那样影响性能。`虚拟机和模板`视图也是任何\
  \ `vSphere` 管理的起点。\n\n**图 15-3：** `vSphere Client` 的`虚拟机和模板`视图。\n\n![9780470768723-fg1503.tif](img/9780470768723-fg1503_fmt.jpeg)\n\
  \n### 容量——存储视角：数据存储视图\n`vSphere Client` 中的前两个视图已存在多个版本，但`数据存储`和`网络`视图（见下一节）是 `vSphere\
  \ 4` 的新功能。\n\n`数据存储`视图提供了集群中所有数据存储的合并视图，如图 15-4 所示。此视图非常有用，因为你通常需要了解存储状况，而此视图让你获得这种高层级视角。对于规划来说非常完美，你可以查看共享存储和本地存储。\n\
  \n虽然你可以在`数据存储`视图中创建虚拟机，但你大部分工作是浏览数据存储和添加数据存储。虽然负责存储的人可能会从开始，但此视图的使用频率低于`主机和集群`和`虚拟机和模板`。\n\
  \n**图 15-4：** `数据存储`视图关注 `vSphere` 的存储卷。\n\n![9780470768723-fg1504.tif](img/9780470768723-fg1504_fmt.jpeg)\n\
  \n### 网络，以及它连接的任何内容：网络视图\n\n\n\n\n最后一个重要的视图是 `Networking`（网络），如图 15-5 所示。该视图与 `Datastores`\
  \ 视图类似，因为它显示了集群所有已知网络的汇总清单。当你需要对网络进行故障排除，或确认你的所有网络是否已在集群中的所有主机上时，此汇总清单会非常有帮助。你可以点击\
  \ vSphere Client 左侧导航窗格上的网络名称，然后点击 `Hosts` 选项卡以查看哪些主机连接到该网络。\n\n要查看网络摘要，请点击左侧导航窗格上的\
  \ `datacenter` 对象，然后点击 `Networks` 选项卡。\n\n**图 15-5：** 网络视图，显示了数据中心内的所有网络。\n\n![9780470768723-fg1505.tif](img/9780470768723-fg1505_fmt.jpeg)\n\
  \n### 使用逻辑放置新虚拟机\n\n当你创建一个虚拟机 (VM) 时，无论是创建一个全新的虚拟机还是从克隆或模板创建，你总是会被问及将其放在哪个数据存储上。与其仅仅将其放在看到的第一个数据存储上，不如考虑数据存储的预期使用大小是有意义的。\n\
  \n### 考虑存储增长\n存储增长通常是管理员在放置虚拟机时考虑的首要因素。\n在新建虚拟机向导中，你可以对数据存储列表进行排序，以查看哪个数据存储具有最多的空闲磁盘空间，并且你可以通过评估镜像在数据存储环境中可以承担的增长量，来决定是否在数据存储上使用精简置备（Thin\
  \ Provisioning）。\n虽然多个虚拟机不太可能同时增长，但如果你有自动化补丁解决方案在不同的虚拟机上部署文件，或者存在蠕虫感染，这会连续影响在遇到性能瓶颈之前的特征。\n\
  另一个方面是与操作相关的限制，这要求进行合理的放置。\n\n考虑因素：即使阵列能够处理，将所有高吞吐量虚拟机放在同一个数据存储上通常会在 ESX 主机级别产生显着的性能损失。\n\
  \n需要进一步说明吗？\n\n我注意到您提供的示例中还包含中文和英文混合的部分。希望保留完整的原文内容以供翻译排版？请确认你是否想让我基于以下完整段落（汉英朴素写法逻辑）继续输出所有剩余部分。\n\
  \n\n\n\n3. 选择一个您想要授予权限的用户并点击 `Add`。\n\n4. 点击 `OK` 退出对话框。\n\n“选择用户和组”对话框关闭，您返回到“分配权限”对话框。\n\
  \n您在第 3 步中选择的用户现在位于“分配权限”对话框的“用户和组”列表中。默认情况下，该用户具有 `Read-Only`（只读）权限。\n\n5. 选择 `Virtual\
  \ Machine Power User (sample)`（虚拟机电源用户）角色并点击 `OK`。\n\n该角色由 vSphere 创建，作为一个示例，可以复制并修改以满足您组织的特定需求。\n\
  \n用户和角色已添加到虚拟机。登录时，用户能看到和执行的操作完全限于 `Virtual Machine Power User (sample)` 角色允许的范围。\n\
  \n![tip.eps](img/tip_fmt.jpeg) 如果您想删除权限，只需按照前面的步骤反向操作，对吧？事实并非如此。如果你进入“分配权限”对话框，你会发现“用户和组”面板可能是空的。要删除权限，请进入虚拟机的\
  \ `Permissions`（权限）选项卡，右键点击用户或组的名称，然后选择 `Delete`（删除）。\n\n# 汇总：vSphere vApps\n\n\
  vSphere vApps 允许您将虚拟机分组在一个侧于管理和性能的容器中。应用程序可能需要多个虚拟机，因此 vApp 可以将它们进行组。\n\nvApp 最常见的用途是当有多个必须作为一个组进行管理时。一个简单的例子是始终协同工作的\
  \ Web 服务器和数据库服务器。通过 vApp，您可以将它们链接在一起，以便它们同时开机或关机，甚至同时进行克隆。您可以为 vApp 定义严格的启动/关机顺序以简化维护。\n\
  \n## 在 vSphere vCenter 中定义 vApp\n\nvApps 并不复杂，与 vSphere 中的其他所有内容一样，通过 vSphere Client\
  \ 管理。按照以下步骤创建 vApp：\n\n1. 在 vSphere Client 中，进入 `Hosts and Clusters`（主机和集群）视图，右键点击一个集群并选择\
  \ `New vApp`。\n\n出现“新建 vApp”向导。\n\n2. 输入名称，为 vApp 选择一个清单位置，并点击 `Next`。\n\n出现 `Resource\
  \ Allocation`（资源分配）页面。\n\n通常，在启用了 `DRS` 的情况下，位置就是您创建 vApp 的数据中心。\n\n3. 将 `Resource\
  \ Location`（资源位置）保持默认设置。\n\n如图 15-9 所示，此页面允许您精确设置 vApp 可以使用的资源数量以及 vApp 在低资源情况下的优先级。我们将在第\
  \ 19 章讨论资源分配。\n\n4. 点击 `Next`。\n\n出现 `Ready to Complete`（准备完成）页面。\n\n5. 检查 `Ready\
  \ to Complete` 页面中的设置并点击 `Finish`。要要向 vApp 添加虚拟机，可以从 `Hosts and Clusters` 视图或 `VMs\
  \ and Templates`（虚拟机和模板）视图，将虚拟机拖放到 vApp 上。\n\n**图 15-9：** Resource Allocation 页面提示进行资源分配。\n\
  \n![9780470768723-fg1509.eps](img/9780470768723-fg1509_fmt.jpeg)\n\n## 为虚拟机建立秩序\n\
  \n对于多个服务器上的大多数应用程序，按正确的顺序启动和关闭它们至关重要。vApps 让这变得简单，因为您可以在 vApp 内部设置这些规则：\n\n1. 要设置\
  \ vApp 中虚拟机的启动顺序，在 `Hosts and Clusters` 或 `VMs and Templates` 视图的导航窗中右键点击 vApp 并选择\
  \ `Edit Settings`。\n\n打开“编辑 vApp 设置”对话框，包含两个选项卡：`Options`（选项）和 `Start Order`（启动顺序）。\n\
  \n2. 点击 `Start Order` 选项卡。\n\n出现 `Start Order` 选项卡，如图 15-10 所示。在这里，您可以修改单个虚拟机的顺序，更改组之间的延迟，并定义启动关机操作。默认情况下，vApp\
  \ 对虚拟机执行 `Power Off`（关机）操作，这类似于硬按电源按钮。如果您在虚拟机中安装了 `VMware Tools`，请务必将 `Operation`（操作）更改为\
  \ `Guest Shutdown`（客户关机）以确保正常关机。\n\n**图 15-10：** vApps 允许您定义特定的启动和关机顺序。\n\n![9780470768723-fg1510.eps](img/978047076823-fg1510_fmt.jpeg)\n\
  \n# 第 16 章：事件、警报和监控\n\n## 本章内容\n- ![arrow](img/arrow.png) 在 vSphere Client 中跟踪活动\n\
  - ![arrow](img/arrow.png) 在事件发生时获取通知\n- ![arrow](img/arrow.png) 使用警报管理环境\n\n设置环境后，您需要跟踪正在发生的情况。vSphere\
  \ 是一个强大的系统，为您的管理目的提供丰富的信息，甚至在达到阈值时发送警报。这些宝贵的功能意味着您可以在无需额外工具的情况下监控 vSphere 环境。\n\n\
  ## 使用事件跟踪活动\n\nvSphere 利用事件来通知您和其他管理员 vCenter 环境中的活动。事件是管理员或系统发起的活动记录。事件被录入到各种日志中，并在其发生时显示在\
  \ vSphere Client 中。\n\nvSphere Client 底部是 `Recent Tasks`（最近任务）窗格。该窗格向您显示 vSphere\
  \ 解决方案正在发生的情况。当另一个管理员创建虚拟机时（例如），会显示一个事件。这样每个人都能知道发生了什么，因为在大型环境中，多个管理员可能同时进行操作。vCenter\
  \ 也会执行无需管理员参与的操作。这些事件都出现在 `Recent Tasks` 中。\n\n### 识别关注的事件\n有这么多事件发生，您应该关注哪些？您可以对\
  \ `Recent Tasks` 中的列进行排序，如果您正在查找某个特定任务（例如 `Clone Machine`），可以根据 `name` 排序。您也可以根据\
  \ `status` 排序。\n\n在某些情况下，排序并不理想。在这种情况下，可以进行搜索。`Recent Tasks` 顶部有一个文本字段，您可以在其中输入值并定义要搜索的字段。\n\
  \n### 查找与故障相关的事件\n`Recent Tasks` 窗格很棒，但对于更早发生的事情呢？如何查看一小时前发生了什么？为此，vSphere Client\
  \ 在每个可以查看的对象上都有 Tasks & Events 选项卡。如果您打开主机的 `Tasks & Events` 选项卡，就可以查看该主机上发生的所有事件，如图\
  \ 16-1 所示。\n\n即使查看单个主机，您也可以发现很多事件。如果您眼睛敏锐，在图 16-1 中，您可能会注意到标签右上角的搜索框。为了过滤 `iSCSI`\
  \ 相关事件（例如），只需在文本框中输入 `Internet SCSI`。所有在 `name`、`target` 或 `status` 中包含 `Internet\
  \ SCSI` 的项目都会出现。可以通过点击文本框左侧的向下箭头更改搜索的字段。\n\n**图 16-1：** 对象的 Tasks & Events 选项卡。\n\
  \n![9780470768723-fg1601.tif](img/9780470768723-fg1601_fmt.jpeg)\n\n## 在 vSphere\
  \ 中设置警报\n\n警报是您可以设置的指标，用于引起您对各种状况的注意。例如，您可能希望在数据存储达到容量 75% 时警告。\n\n并非所有警报都是平等的。vSphere\
  \ 支持两种状态：\n\n![check.png](img/check.png) 警告是相对较小的事件，旨在通知您即将来临的情况。您应该在合理时间内检查这些警告。\n\
  \n\n\n\n\n![check.png](img/check.png) 警报（Alerts）更为严重。当计数器达到需要立即的数值时，就会触发警报。通常，你希望在警报发出时处理触发警报状态的问题。24x7\
  \ 全候运行的组织可能希望警报发送给正在值班且可用的人员。\n\n## 探索默认报警器\n\n如果你想要一个在容量达到 75% 时触发的数据存储报警器，那么你太走运了！`vSphere`\
  \ 拥有几十个默认报警器，而数据存储容量达到 75% 就是其中之一。\n\n报警器定义在 `vCenter` 级别，并影响该级别以下的所有对象。许多默认报警器都设置了实用的水平，但了解它们的设置值以及如何更改它们非常有帮助。\n\
  \n要查看默认报警器，请遵循以下步骤：\n\n1. 打开 `vSphere Client`，登录，打开 `Hosts and Clusters` 视图，并导航到\
  \ `vCenter` 对象。\n   `vCenter` 对象是导航窗格顶部的项目，导航窗格中的所有对象都包含在 `vCenter` 对象中。\n2. 选择\
  \ `vCenter` 对象的 `Alarms` 选项卡。\n   默认情况下显示 `Alarms` 选项卡的 `Triggered Alarms` 视图。此视图列出了所有活动且需要处理的报警器。\n\
  3. 点击 `Definitions`。\n   `Definitions` 视图显示报警器定义。在这里，你可以查看、编辑、添加或删除报警器。\n\n要查看报警器的详细，双击报警器名称。你将看到一个与图\
  \ 16-2 类似的对话框，其中包含报警器的信息以及它监控的内容。\n\n**图 16-2:** 默认报警器 `Datastore Usage on Disk`\
  \ 的报警设置对话框。\n\n![9780470768723-fg1602.eps](img/9780470768723-fg1602_fmt.jpeg)\n\n\
  在 `General` 选项卡的 `Alarm Type` 下下，你可以看到 `Monitor` 下拉列表，该列表包含了 `vSphere` 可以监控的所有对象，包括\
  \ `Hosts`、`Virtual Machines` 和 `Datastores`。该下拉列表下方是一组单选按钮：\n\n![check.png](img/check.png)\
  \ 监控特定条件或状态，例如 `CPU Usage`、电源状态：将此选项用于需要主动轮询的事项，例如内存消耗和数据存储使用。`Datastore Usage on\
  \ Disk` 是基于条件的默认报警器示例。只有 `Hosts` 和 `VMs` 可以对条件进行监控。\n\n![check.png](img/check.png)\
  \ 监控发生在此对象上的特定事件，例如 `VM Powered On`：将此选项用于可以捕获的瞬时事件。使用这种监控类型，你可以在监控的动作发生时触发警报。默认创建的\
  \ `Host Error` 报警器就是事件报警类型的示例。你可以通过这种方式监控所有对象。\n\n要实际查看报警器何时被触发，请点击 `Triggers` 选项卡。该选项卡显示了触发警报必须满足的事件或条件。如果报警类型是基于条件的，`Triggers`\
  \ 选项卡看起来将像图 16-3。\n\n**图 16-3:** 默认报警器 `Datastore Usage on Disk` 的 `Triggers` 选项卡。\n\
  \n![9780470768723-fg1603.eps](img/9780470768723-fg1603_fmt.jpeg)\n\n`Triggers` 列表中的\
  \ `Trigger Type` 属性是你实际寻找用于依据并触发警报的关键。根据 `Alarm Type` 的设置，`Trigger Type` 允许你从下拉列表中选择。`condition`\
  \ 属性是 `Is Above` 或 `Is Below`，取决于你想对哪种条件触发警报。`Warning` 和 `Alert` 属性是 `vSphere` 与\
  \ `Trigger Type` 指标进行比较的值。数字的单位通常在 `Trigger Type` 的实际名称中注明。条件长度属性是指报警器触发之前该条件必须持续多长时间。\n\
  \n事件报警器有所不同。对于基于事件的报警器，你并不是不断采样一个精确的阈值，因此报警器只监控事件。在图 16-4 中，你可以看到基于事件的报警器的 `Triggers`\
  \ 选项卡看起来不同。当看到事件时，`vCenter` 会根据你设置的状态标记报警器。此条件允许你监控次要或主要的事件。\n\n**图 16-4:** 默认报警器\
  \ `Host Error` 的 `Triggers` 选项卡。\n\n在这两种报警类型中，都可以多个触发器。如果 `Alarm Type` 是基于条件的触发器，你可以选择是所有触发器都发生，还是其中任何一个触发器都可以触发报警器（后者是默认设置）。基于事件的触发器始终设置为在发生任何触发事件时触发。\n\
  \n## 缓解 vSphere 报警焦虑症\n\n每个 `vSphere` 环境在某些时候都有活跃的报警器。如果你收到警报，不要恐慌。你可以登录、查看警报是什么并处理它。在处理完触发警报的问题后，报警器通常会消失。如果报警是基于事件的，你可能需要手动确认报警以使其消失：\n\
  \n1. 打开 `vSphere Client` 并导航到报警器。\n   如果发生警告，你会看到带感叹号的黄色三角形。如果发生警报，你会看到带感叹号的红色菱形。\n\
  2. 点击导航窗格中的对象，然后点击 `Alarms` 选项卡。\n   `Alarms` 选项卡默认打开 `Triggered Alarms` 视图。\n3.\
  \ 右键点击报警器并选择 `Acknowledge`（确认）。\n   报警器变为灰色，表示已确认，但如果触发它的条件仍然存在，报警器不会消失。已确认的报警器会显示何时以及由谁确认的。\n\
  \n## 让报警器发挥作用\n\n事件和报警器非常适合大到有专人观察事件的组织。对于我们其他人来说，我们需要 vSphere 解决方案自动通知我们。\n\n###\
  \ 设置通知\n\n通知允许 `vCenter` 向外部世界通信状态。`vSphere` 可以发送电子邮件，允许 `vSphere` 向手机或传真机发送警报。为了发送电子邮件邮件，`vSphere`\
  \ 必须先设置简单邮件传输协议（SMTP）服务器。该服务器通常是你环境中的一个运行并接收传入 SMTP 流量的电子邮件服务器。\n\n\n\n\n配置 SMTP\
  \ 服务器：\n\n1. 打开 vCenter 客户端并登录。\n2. 转到主页并点击 `vCenter Server Settings`（vCenter Server\
  \ 设置）。\n\n出现 `vCenter Server Settings`对话框。此多功能对话框的左窗格中有多个标题。打开后的默认页面是 `Select License\
  \ Settings`（选择许可证设置）页面，如图 16-5 所示。\n\n**图 16-5：** 显示选择许可证设置页面的 vCenter Server Settings\
  \ 对话框。\n\n![9780470768723-fg1605.eps](img/9780470768723-fg1605_fmt.jpeg)\n\n3. 点击左窗格中的\
  \ Mail（邮件）。\n\nvCenter Server Settings 对话框切换到 `Select Mail Sender Settings`（选择邮件发送者设置）页面，您可以在此处输入组织邮件服务器的信息。\n\
  \n4. 输入一个 SMTP 服务器和一个用作发送者的电子邮件地址。\n\n某些电子邮件系统需要有效的发送者，而另一些不需要。如果你打算允许向业务用户发送警报，你需要确保该电子邮件地址是真实的，因为业务用户经常会回复警报提问。图\
  \ 16-6 显示了 vCenter Server 的 Select Mail Sender Settings 对话框。\n\n5. 点击 OK（确定）。\n\n\
  现在您已配置 SMTP 服务器。\n\n**图 16-6：** vCenter Server Settings 的 Select Mail Sender Settings\
  \ 页面。\n\n![9780470768723-fg1606.eps](img/9780470768723-fg1606_fmt.jpeg)\n\n### 通过电子邮件发送警报\n\
  \n配置 SMTP 服务器允许 vCenter 与 SMTP 服务器对接，但它并不会启用通过电子邮件发送任何警报。要通过电子邮件发送这些警报，你必须启用想要发送的警报：\n\
  \n1. 打开 vSphere Client，登录，打开 Hosts and Clusters（主机和集群）视图并导航到 vCenter 对象。\n2. 点击\
  \ Alarms（警报）选项卡，然后点击 Definitions（定义）以打开报警定义视图。\n\n报警定义视图显示 vCenter 提供的所有默认警报，以及你在\
  \ vCenter 对象上创建的任何警报。\n3. 右键点击想要修改的警报并选择 Edit Settings（编辑设置）。\n\n在此例中，选择 Datastore\
  \ Usage on Disk（磁盘数据存储使用）警报。许多组织通常设置此警报以发送电子邮件通知。\n4. 点击 Alarm Settings（警报设置）对话框中的\
  \ Actions（操作）选项卡。\n5. 点击 Add（添加）。\n\n操作列表中会出现一个项目。默认情况下，添加的操作是 Send a Notification\
  \ Email（发送通知电子邮件），如图 16-7 所示。\n\n**图 16-7：** Alarm Settings 的 Actions（操作）选项卡。\n\n\
  ![9780470768723-fg1607.eps](img/9780470768723-fg1607_fmt.jpeg)\n\n6. 在 Configuration（配置）字段中输入你想要发送警报的地址。\n\
  如果你想发送到多个电子邮件地址，可以使用逗号将它们分开。\n7. 选择发送电子邮件的频率和时间。Configuration 属性右侧四个额外的属性。你使用这些属性来控制\
  \ vCenter 何时以及多久发送一次电子邮件。默认情况下，当警报从 Warning（警告）变为 Alert（警报）时，系统会发送电子邮件。你可以选择将每个属性留空、Once（一次）或针对每个状态\
  \ Repeat（重复），所有这些都通过属性中的图标显示出来。\n8. 点击 OK 关闭 Alarm Settings。\n\n这将设置警报在被触发时发送电子邮件，这对于重要情况的警报非常有用。\n\
  \n![tip.eps](img/tip_fmt.jpeg) 如果电子邮件似乎不起作用，请检查你的 SMTP。\n\n### 将 vSphere 连接到其他系统\n\
  \n所有这些监控都非常强大，但有时组织拥有标准化的平台。vCenter 还可以通过简单管理协议（SNMP）陷阱发送通知。SNMP 是一种行业标准协议，允许 vCenter\
  \ 与数百个网络监控平台使用相同的语言进行通信。如果你的组织有一个“单窗视图（single pane of glass）”，SNMP 是将虚拟基础设施整合其中的极佳方法。\n\
  \n要配置 SNMP 服务器，你需要像在 Setting 部分中配置 SMTP 那样进入 vCenter Server Settings，并点击导航窗格中的 SNMP，如图\
  \ 16-8 所示。\n\n**图 16-8：** vCenter Server Settings 对话框的 Select SNMP 页面。\n\n![9780470768723-fg1608.eps](img/9780470768723-fg1608_fmt.jpeg)\n\
  \n\n\n\n在第 15 章中，我们将向您展示如何将用户应用到现有角色，并将该组合应用到对象。vSphere 包含了许多角色，但有时它们并不适用。VMware\
  \ 甚至在许多角色的名称中带有（sample）字样，以此请求你对其进行修改！你可以通过点击管理面板中的角色（Roles）图标，在主页上查看所有默认角色。\n\n\
  通常，我们建议不要直接修改 vSphere 提供的角色，而是先复制它们然后再修改。这样，你就可以保留示例角色以备后用。要复制角色，右键点击它并选择 `Clone`（克隆）。此步骤将创建角色的副本，你需要根据计划立即对其重命名。\n\
  \n重命名角色后，右键点击带有新名称的角色，并选择 `Edit Role`（编辑角色）。会出现“编辑角色”对话框，如图 17-2 所示。在这里，你可以更改角色的名称以及授予该色的权限。\n\
  \n**图 17-2：** 编辑角色对话框，显示了你可以分配的部分权限。\n\n![9780470768723-fg1702.eps](img/9780470768723-fg1702_fmt.jpeg)\n\
  \n你可以分配超过 200 种特定的权限，而且在大多数情况下，它们的命名非常直观，让你能判断出它们的作用。每个权限都是一个单一的操作，因此你可以非常细致地定义角色的权限。修改角色后，你需要进行一次测试。创建一个账户，将其映射到你创建的角色中，并确保它拥有你预期的权限（和限制）。\n\
  \n在实际将角色分配给用户时，请记住你无法在 vSphere Client 的“角色”页面执行此操作。权限（Permission）是用户或组、角色和对象的组合。你必须按照第\
  \ 15 章中的描述，在对象级别上为用户分配权限。\n\n## 使用地图浏览环境\n\n地图对于 vSphere 环境的可视化非常有用。你可以通过进入 vSphere\
  \ Client 的主页并点击地图（Maps）图标来访问地图。此时会显示地图视图，在典型的导航窗格内部，你现在可以选择想要包含在地图中的对象，如图 17-3 所示。\n\
  \n在大型环境中，如果选择所有内容，地图可能会变得过于杂乱，因此通常你只需要在导航窗格中选择你关心的对象。窗格的右上角是一个概览（Overview）地图，允许你在地图上移动和缩放。概览地图下方是“地图关系”（Map\
  \ Relationships）面板，你可以在那里进一步定义地图上显示的内容。该面板允许地图显示 vSphere 中不同实体之间的关系。\n\n一种常见的地图是虚拟机（VMs）与主机之间的关系。要创建此地图，请遵循以下步骤操作：\n\
  \n**图 17-3：** vSphere Client 的地图视图。\n\n![9780470768723-fg1703.tif](img/9780470768723-fg1703_fmt.jpeg)\n\
  \n1. 打开 vSphere Client，登录并进入 vSphere Client 主页。\n2. 点击地图图标。\n   出现地图视图。\n3. 在导航窗格中，选择要映射的机主机和某些虚拟机。\n\
  \   不要选择超过五个虚拟机。当你选择虚拟机和主机时，它们会出现在内容窗格中。\n4. 在“地图关系”面板中，确保勾选了 `Host to VM`（主机到虚拟机）并取消勾选其他所有项。\n\
  5. 点击 `Apply Relationships`（应用关系）。\n\n地图将重新绘制，虚拟机与主机链接，如图 17-3 所示。\n\n由于虚拟机经常在主机之间频繁移动，地图可能会很快过期。如果你需要更新地图，可以点击概览地图正方的\
  \ `Refresh`（刷新）超链接。刷新超链接旁边有一个计数器，显示自地图绘制以来的时间。\n\n## 使用性能（Performance）检查统计数据\n\n\
  地图虽然很美观，但许多管理员更关注性能问题。在虚拟化项目的初期，每个性能问题都归咎于虚拟化程序并不罕见。你可能会发现自己必须频繁地为主机或虚拟机收集性能数据。幸运的是，VMware\
  \ 已将性能监控内置到 vCenter 中。\n\n要访问性能数据，在 vSphere Client 中导航到你感兴趣的对象。一旦选择了该对象（例如虚拟机），点击“性能”（Performance）选项卡。如图\
  \ 17-4 所示，vSphere Client 绘制了一些基础性能图表，向你展示有关过去一天性能的频繁请求的信息。\n\n你可以修改查看的时间范围以及查看的内容。你在“性能”选项卡中的\
  \ `Time Range` 下拉菜单里设置范围。要修改显示内容，点击“性能”选项卡左上角的 `Advanced`（高级）按钮。\n\n高级视图显示你所选对象的基础图表。对于主机和虚拟机，显示的默认信息是\
  \ CPU 使用率，但其他对象有其他的默认值。你可以通过从 `Switch To`（切换到）下拉菜单中选择不同对象来更改正在制图的项目。\n\n**图 17-4：**\
  \ 虚拟机性能概览。\n\n![9780470768723-fg1704.tif](img/9780470768723-fg1704_fmt.jpeg)\n\n\
  当你需要更具体的性能图表时，可以点击图表旁边的 `Chart Options`（图表选项）。如图 17-5 所示，会出现“自定义图表”对话框，显示了你可以分配的某些权限（注：此处原文应为\
  \ privileges，译为权限）。在虚拟机中，计数器描述面板提供了对每个计数项的解释。\n\n**图 17-5：** 自定义图表对话框。\n\n![9780470768723-fg1702.eps](img/9780470768723-fg1702_fmt.jpeg)\n\
  \n## 使用计划任务编写 vCenter 待办事项\n\n需要每周二克隆虚拟机？在深夜？没问题！你可以在任何需要的时间调度任务！你可以使用 vCenter 内部调度器自动化\
  \ vCenter 中的许多任务，这让你轻松设置周期性任务。这样做非常有用——例如在质量保证小组工作之前创建快照。\n\n要创建计划任务，遵循以下步骤：\n\n\
  1. 打开 vSphere Client，点击主页上的“计划任务”（Scheduled Tasks）图标。\n   出现计划任务视图。在这里你可以创建、删除和管理计划任务。\n\
  2. 在计划任务视图中，右键点击内容窗格并选择 `New Scheduled Task`（新建计划任务）。\n   出现“计划任务”对话框。\n3. 在“计划任务”对话框中选择\
  \ `Create a Snapshot of a Virtual Machine`（创建虚拟机快照）并点击 `OK`。\n   “计划任务”对话框提示计划任务类型，如图\
  \ 17-6 所示。你可以从多个任务中选择，每个任务都会自动打开相应的向导来帮助你设置。在这里，由于你在“计划任务”对话框中选择了“创建虚拟机快照”项，将打开“创建虚拟机快照”向导。\n\
  \n**图 17-6：** 计划任务对话框。\n\n![9780470768723-fg1703.tif](img/9780470768723-fg1703_fmt.jpeg)\n\
  \n4. 在“创建虚拟机快照”向导中，选择要快照的虚拟机并点击 `Next`。\n   打开“描述快照”页面。\n5. 指定快照名称。\n\n\n\n\n使用一个描述快照的名称。通常，快照名称会引用即将发生的事件，例如“QA\
  \ 测试坏代码前的快照”。\n\n6. 在描述字段中，如果需要更详细的信息，请添加。\n\n快照内存（Snapshot Memory）记录到快照的内存内容，仅适用于运行中的虚拟机。静止文件系统（Quiesce\
  \ File System）在拍摄快照时短暂暂停磁盘输入/输出 (`I/O`)，以便更好地捕捉虚拟机。静止文件系统需要 `VMware Tools` 正在运行，如果虚拟机和\
  \ `VMware Tools` 都在运行，通常建议开启此项。请勾选其中某一项。\n\n7. 点击下一步。\n\n出现 `Schedule Task` 页面。\n\
  \n8. 输入任务名称，选择计划并点击下一步。\n\n出现 `Notification` 页面。\n\n9. 输入用于通知的电子邮件地址并点击下一步-下一步。\n\
  \n在 `Notification` 页面中，你可以选择在任务完成时发送电子邮件。这样做非常有帮助，因为你通常安排任务是为了不需要亲自在场执行任务，但你仍需要确保任务执行。要使通知生效，你必须定义\
  \ `vCenter` 的 `SMTP` 设置，我们将在第 16 章中解释。\n\n出现 `Summary` 页面。\n\n10. 检查你的选择并点击完成。\n\
  \n你现在已经安排了任务。`Scheduled Tasks` 视图现在显示了计划的任务，如图 17-7 所示。\n\n你可以安排的任务非常有限，但常见且易于设置。如果你想安排其他操作，可以这样做，但你需要使用\
  \ VMware 提供的各种工具之一对其编写脚本，例如 `vSphere CLI`（命令行界面）、`vSphere PowerCLI` 或 `vSphere Management\
  \ Assistant` (`vMA`)。\n\n**图 17-7：** `Scheduled Tasks` 视图。\n\n![9780470768723-fg1707.tif](img/9780470768723-fg1707_fmt.jpeg)\n\
  \n![tip.eps](img/tip_fmt.jpeg) 在设置计划任务时，如果可能，在任务执行之前的某个时间点进行测试是个好主意。向导在你创建任务时并不会完全验证任务的所有内容，可能会在运行时失败。我们曾安排过在深夜执行快照，但因为它其中一个数据存储满了而失败了。在应用程序升级期间，虚拟机处于不受保护状态；幸运的是，我们并不需要该快照！\n\
  \n# 第 18 章：其中一个主机不同——主机配置文件\n\n## 本章内容\n\n![arrow](img/arrow.png) 配置“恰好”的主机\n\n\
  ![arrow](img/arrow.png) 捕捉主机的配置\n\n![arrow](img/arrow.png) 将主机配置文件作为管理工具\n\n`Host\
  \ Profiles` 功能在 `vSphere Enterprise Plus` 版本中引入，旨在解决手动单独配置每个 `ESX` 主机这一工作量、易错且耗时的任务。在主机配置文件出现之前，管理员每当向集群添加一个\
  \ `ESX` 主机时，都必须手动配置配置网络和存储设置。除了主机名和网络地址等唯一设置外，集群中的大多数 `ESX` 主机配置都是相同的。对于成簇的 `ESX`\
  \ 主机，它们必须配置为相同，因为这是高可用 (`HA`) 和分布式资源调度程序 (`DRS`) 的要求。`Host Profiles` 功能允许你从一个 `ESX`\
  \ 主机捕获配置并将其应用到其他 `ESX` 主机上。\n\n### 准备完美主机\n\n假设你是一个 `ESX` 主机集群的管理员。你刚刚向集群中添加了一个新的\
  \ `ESX` 主机，你需要配置它以与现有主机保持一致。与其手动配置每个设置，你可以使用 `Host Profiles` 来自动化该过程。\n\n`Host Profiles`\
  \ 功能在 `vSphere Enterprise Plus` 版本中引入，旨在解决手动单独配置每个 `ESX` 主机这一工作量、易错且耗时的任务。在主机配置文件出现之前，管理员每当向集群添加一个\
  \ `ESX` 主机时，都必须手动配置网络和存储设置。除了主机名和网络地址等唯一设置外，集群中的大多数 `ESX` 主机配置都是相同的。对于成簇的 `ESX`\
  \ 主机，它们必须配置为相同，因为这是高可用 (`HA`) 和分布式资源调度程序 (`DRS`) 的要求。`Host Profiles` 功能允许你从一个 `ESX`\
  \ 主机捕获配置并将其应用到其他 `ESX` 主机上。\n\n### 网络考虑\n\n使用 `Host Profiles` 可以轻松地从 `ESX` 主机捕获网络配置并应用到其他\
  \ `ESX` 主机上。然而，为了使此功能生效，你必须满足 `ESX` 主机之外的一些前提条件：\n\n- **物理交换端口设置**：连接到新 `ESX` 主机的交换端口设置必须与参考\
  \ `ESX` 主机的设置相同。此要求对于交换端口的 VLAN 成员以及如果端口配置为 VLAN 中继尤其如此。\n- **物理网络适配器顺序**：将虚拟机网络流量与管理和存储网络流量隔离通常需要使用单独的网络适配器，每个适配器连接到自己的网络交换端口。在应用主机配置文件时，确保每个\
  \ `ESX` 主机上第一个网络适配器的物理网络交换端口配置相同至关重要。连接到每个 `ESX` 主机第二个网络适配器的每个网络交换端口也是如此。\n- **网络设置**：当你将主机配置文件应用到\
  \ `ESX` 主机时，系统会提示你输入每个正在配置的服务控制台和 `VMKernel` 的网络 IP 地址值。在应用主机配置文件之前准备好这些信息是个好主意，以保持流程顺畅。\n\
  \n### 各处的数据存储\n\n`Host Profiles` 功能将为你配置 `vSphere` 数据存储连接，只要这些数据存储对于 `ESX` 主机是可用的。以下是确保一切顺利进行的一些细节：\n\
  \n- **光纤通道存储**：确保存储阵列上的 `LUNs` 已正确呈现给 `ESX` 主机的光纤主机总线适配器 (`FC HBA`)。仅仅将 `ESX` 主机的\
  \ `FC HBAs` 连接到光纤交换机通常不足以让 `ESX` 主机与其分配的存储进行通信。\n\n\n\n\n\n![check.png](img/check.png)\
  \ **访问控制列表 (ACLs)**：ACL 主要应用于 iSCSI 数据存储和到 NFS 存储的连接。为了连接到这些类型的存储，必须将您的 ESX 主机的网络地址添加到每个存储设备上的允许连接列表中。默认情况下，这些存储设备会拒绝所有连接，除非它们被明确列在列表中。\n\
  \n![check.png](img/check.png) **连接限制**：某些网络存储设备允许限制对给定存储资源的连接数。如果为数据存储启用了此功能，请确保连接限制设置得足够，以便允许其他\
  \ ESX 主机连接。\n\n![tip.eps](img/tip_fmt.jpeg) 有关存储和主机配置的特定信息，请参阅 vSphere 4.1 文档。\n\
  \n# 使用 Active Directory 连接我\n\n为 ESX 4.1 主机添加 Active Directory 身份验证使得为使用 Active\
  \ Directory 凭据的用户提供访问变得更容易，但仍然需要管理员账户将 ESX 4.1 主机添加到 Active Directory。如果您想将您的 ESX\
  \ 4.1 主机加入 Active Directory，请考虑以下事项：\n\n![check.png](img/check.png) **创建一个指定的 AD\
  \ 账户**：您可能会发现具有将 ESX 主机加入 AD 权限的特殊 Active Directory 账户是值得的。使用为其他目的设置的账户可能会导致密码在在不通知的情况下被更改或意外被锁定的风险，这两种都会破坏将\
  \ ESX 主机添加到 Active Directory 的。\n\n![check.png](img/check.png) **域控制器**：使用 Active\
  \ Directory 进行身份验证的服务器需要与 AD 域的某个控制器保持近乎不断的连接。如果 ESX 主机失去对域控制器的访问，在恢复访问之前，您将无法使用\
  \ AD 凭据登录。\n\n# 你知道时间吗？\n\n只有通过从公共源设置所有服务器时钟，才能保持它们同步。虽然有些组织维护自己的网络时间协议 (NTP) 服务器，但大多数依赖于某些外部源进行同步。如果您尚未配置您的\
  \ ESX 主机使用 NTP 服务器进行时间同步，现在是用于您创建主机配置的 ESX 主机上设置的好时机。\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ 有关通过 NTP 同步您的 ESX 主机的更多信息，请参阅第 10 章。\n\n# 捕获主机配置\n\n作为创建主机配置文件源的 ESX 主机被称为参考主机。在捕获主机配置之前，必须从\
  \ vCenter Server 访问参考主机。\n\n按照以下步骤从参考 ESX 4.1 主机创建主机配置文件：\n\n1. 使用 vSphere Client\
  \ 连接到 vCenter Server。\n   出现清单面板 (Inventory)。\n2. 点击**主机 (Hosts)** 选项卡。\n   出现 ESX\
  \ 主机列表，如图 18-1 所示。\n3. 右键点击参考 ESX 主机，然后选择`主机配置文件 (Host Profiles)`⇒`从主机创建配置文件 (Create\
  \ Profile from Host)`。\n   出现创建配置文件页面，如图 18-2 所示。\n\n**图 18-1：** 主机选项卡。\n![9780470768723-fg1801.tif](img/9780470768723-fg1801_fmt.jpeg)\n\
  \n**图 18-2：** 创建配置文件页面。\n![9780470768723-fg1802.tif](img/9780470768723-fg1802_fmt.jpeg)\n\
  \n4. 在**名称 (Name)** 字段中为主机配置文件输入名称。\n5. 在**描述 (Description)** 字段中输入主机配置描述并点击**下一步\
  \ (Next)**。\n   此值应描述正在捕获的配置。\n   出现包含新主机配置文件名称和描述的摘要。\n6. 点击**完成 (Finish)**。\n\
  \   主机配置文件已创建。\n\n# 挂载主机配置文件\n\n创建主机配置文件后，可以使用它来配置其他 ESX 主机。使用主机配置文件配置 ESX 主机的第一步是将主机配置文件挂载到\
  \ ESX 主机上。此过程将主机配置文件挂载到 ESX 4.1 主机：\n\n1. 使用 vSphere Client 连接到 vCenter Server。\n\
