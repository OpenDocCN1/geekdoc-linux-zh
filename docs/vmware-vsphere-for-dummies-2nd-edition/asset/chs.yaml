  \n\n\n\n为虚拟机（VM）提供适量的资源意味着要知道虚拟机上将运行什么。了解在虚拟机上运行的应用程序，意味着理解该应用程序及其底层的操作系统（OS）将如何使用提供的资源。从物理服务器迁移到虚拟机（通常称为物理到虚拟，或\
  \ P2V）至少让您获得了在其自然栖息地观察应用程序的机会。幸运的是，物理到虚拟迁移是一项成熟的过程。可以使用 `VMware Converter` 和若干第三方产品来提供帮助。为新虚拟机确定配置在部分是一门科学，但更多在于了解虚拟机与其物理兄弟节点之间有何不同。\n\
  \n在确定虚拟机配置时，需要考虑以下几点：\n\n![check.png](img/check.png) **操作系统**：所使用的操作系统版本是否有任何配置限制，例如中央处理器（CPU）的最大数量或内存容量？操作系统是否可以利用多个\
  \ CPU 或额外的内存？某些操作系统版本限制为使用单个 CPU 或 4GB 内存，额外的资源将不会产生任何益处。\n\n![check.png](img/check.png)\
  \ **应用程序性能**：该应用程序的设计旨在利用多 CPU 机器吗？如果是，它可以使用多少个 CPU？许多管理员有一个共同的误区，认为越多越好，但由于 `VMware`\
  \ 处理器调度算法的能力，虚拟机中的单个虚拟 CPU（`vCPU`）性能实际上可能优于具有多个 vCPU 的虚拟机。在虚拟 CPU 的情况下，配置具有多个 vCPU\
  \ 虚拟机的能力是为了支持设计为在多 CPU 环境中优化运行（有时是仅在该环境下运行）的应用程序和操作系统。\n\n![check.png](img/check.png)\
  \ **磁盘空间（操作系统）**：操作系统消耗多少磁盘空间？操作系统补丁和更新需要额外空间吗？操作系统供应商确实希望您使用他们的自动更新功能，这包括从供应商网站下载更新并自动应用。这对于管理员来说非常方便，特别是对于那些没有运行自己更新服务器的管理员，但会以不可预测的速率消耗空间。\n\
  \n![check.png](img/check.png) **磁盘空间（应用程序）**：应用程序安装后占用多少空间？应用程序的日志文件会无限增长吗，还是有大小限制？日志文件以耗尽系统卷上的所有可用磁盘空间并最终导致机器崩溃而闻名。请特别关注日志轮设置以及决定向日志文件输出详细信息程度的日志“级别”。不可管理的日志应放在单独的卷上以防止机器崩溃，或者应采取其他流程在日志过时将其移动或删除。\n\
  \n![check.png](img/check.png) **磁盘空间（数据库）**：应用程序是否使用本地数据库？数据库将增长到多大？此大小是否包含事务日志？数据库的备份是否存储在本地，它消耗多少空间？只要可能，本地数据库应存储在第二个卷上，以防止耗尽启动（系统）卷上的所有磁盘空间。建议为虚拟机添加第二个虚拟磁盘，因为大多数操作系统允许在保持卷在线的同时扩展非启动（数据）卷。\n\
  \n![check.png](img/check.png) **网络接口**：该机器是否需要同时连接到多个网络？将机器连接到所提议的特定网络组合是否符合安全策略？偶尔情况下，用户会要求虚拟机连接到两个网络，而这些网络在物理世界中是被严格禁止的。由于虚拟机跳过了请求物理交换机连接的步骤，管理员可能会面临违反网络安全策略的风险。\n\
  \n![check.png](img/check.png) **冗**：应用程序的服务器需求是否要求多个磁盘和/或这些磁盘的特定冗余配置（称为冗余磁盘阵列，或\
  \ `RAID`）？这些需求是针对物理机器的吗？并不是所有软件供应商都接受虚拟化作为生产环境，他们仍然以物理服务器的形式提供最低系统要求。供应商可能会要求在 `RAID-5`\
  \ 配置中使用多个硬盘，或使用两个网卡进行冗余。`vSphere` 抽象了配置的硬件组件，因此您可能只需要单个虚拟磁盘和一个虚拟网络接口即可满足需求。\n\n\
  ![check.png](img/check.png) **备份**：是否已被要求安装备份代理？`vSphere` 提供了备份虚拟机并以完整或逐文件方式还原它们的能力。您的网络管理员可能没有意识到这种能力，它可以作为传统物理机备份解决方案中常见的按系统付费模式的替代方案。\n\
  \n### 冗余部门（Department of redundancy department）\n\n拥有计划 B（Plan B）是风险缓解的基础。这个简单的概念驱动着我们保护最重要事物的方式。对于组织赖以的重要应用程序也是如此——以及托管这些重要应用程序的计算机基础设施也是如此。`VMware`\
  \ 通过不断增强保持服务器运行的能力，在这一这一方面非常出色。\n\n将计划 B 纳入设计的最佳方法是始终考虑“万一怎么办”。以网络为例，假设您有一个带有 4\
  \ 端口网卡的 `vSphere` 主机。您可以将所有四个端口连接到网络交换机，这样在一个端口故障时，您仍然可以运行。现在问问自己，“万一网络交换机故障怎么办？”答案显而易见——您倒霉了，而且没有网络连接。相反，将两个网络端口连接到一个交换机，另外两个连接到第二个交换机更好。问题解决了，对吧？错了。所有四个端口都在同一个网卡上，如果网卡故障，您的连接也会中断。如果您有条件获得两个双口端口网卡，那太好了；但如果没有，您仍然需要计划\
  \ B。\n\n在此时，计划 B 似乎无法从硬件层面解决。这正是 `vSphere` 高可用性发挥作用之处，以抵消底层硬件风险。取决于虚拟机的关键性，您甚至可以实施\
  \ `vSphere` 容错（FT），即同一个虚拟机的副本在不同的主机上同步运行。\n\n![tip.eps](img/tip_fmt.jpeg) 在考虑计划\
  \ B 时，请始终记住 `vSphere` 高可用性功能集的目的是接手硬件留下的工作，并最终为您提供所需的计划 B。\n\n### 重复销售磁盘空间（两次或更多）\n\
  \n意识到大多数虚拟机只使用了分配磁盘空间的一部分，`VMware` 希望让客户能够更好地利用其存储。随着 `vSphere` 的发布，`VMware` 引入了一种名为精简配置（thin\
  \ provisioning）的新功能。在精简配置之前，`VMware ESX` 在数据存储上创建的虚拟磁盘文件会消耗分配给虚拟机的所有空间，包括空空间。精简配置允许虚拟机具有预定义大小的虚拟磁盘，但\
  \ `vSphere` 仅存储虚拟磁盘中的实际数据，忽略空空间。随着虚拟磁盘填充，vSphere 数据存储上的虚拟磁盘文件会扩展，直到达到预定义大小。\n\n\
  使用精简配置非常高效，但也伴随着风险。在数据存储被超配（分配的多于实际存在的）的情况下，您面临精简配置虚拟机增长速度比预期快且没有地方存储其数据的风险。这种风险可以通过监控虚拟机增长和保持合理的超配比例在很大程度上缓解。\n\
  \n\n\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) VMware `vSphere` 容错功能需要使用厚置备的虚拟磁盘。如果虚拟磁盘是精简置备的，则在启用容错时会自动进行转换。\n\
  \n# 时刻谨记可扩展性\n\n在部署 `vSphere` 时，过于保守可能与过于激进一样糟糕。人们本能地会想预留一些额外资源，“以防万一”。当（不是“如果”，而是“何时”）您的组织开始广泛采用\
  \ `vSphere`，使用量突然激增并且超出您最乐观的预期时，遵循这种直觉很可能会适得其反。最好的准备方法是在需要动用这些“以防万一”的资源时确定具体该如何使用它们。\n\
  \n## 存储考量\n\n回顾 VMware ESX 首次面世之时起专家们就一直争论不休的一个问题：如何最佳分配呈现给 ESX 主机的原始存储？即使在 vSpheresphere\
