  tools >>\n其余支持的 Win 类型则：%APPDATA％....覆盖上去。 \n关键脚本名叫 Sysprep.exe——负责重置识别硬键及预备现有安装以便传输。【提示】自\
  \ Server03 以后的 MS OS 不需额外装 SyS Prep 即可进行客制因为它们原生包含了那些能力；\n\n#### 通过个性化操作的并行处理功能介绍\
