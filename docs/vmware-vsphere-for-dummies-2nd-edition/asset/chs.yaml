  \n### ESX — 改进项主机\n`ESX` 已经成熟，现在可以比以前任何时候都利用大量的内存、CPU 和磁盘。以下是 `4.0` 中的一些关键改进：\n\n\
  - **1 太字节 (TB) 主机内存**：如果你恰好有一台带有 1024GB RAM 的服务器，每个主机支持高达 1TB 的内存。\n- **更多 CPU**：每个主机\
  \ 64 个逻辑 CPU，高于 `VI3` 中的 32 个逻辑 CPU。此外，一个 `ESX` 主机每个主机支持高达 512 个 `vCPUs`，高于 `VI3`\
  \ 中的 192 个 `vCPUs`。\n- **64 位 VMKernel**：`ESX` 虚拟化内核的核心 `VMKernel` 现在是 64 位，显著扩展了对更多内存的支持并提升了整体性能。\n\
  - **64 位服务控制台**：用于 `ESX` 的基于 Linux 服务控制台现在是 64 位，改进了管理控制台的性能。\n- **iSCSI 存储**：更新的\
  \ `iSCSI` 支持提高了性能并减少了 `ESX` 内置软件 `iSCSI` 适配器以及硬件 `iSCSI` 适配器的开销。\n- **NFS 数据存储**：`ESX`\
  \ 集群可以共享 64 个 `NFS` 数据存储。`VI3` 的默认最大值为 8 个共享 `NFS` 数据存储，但可以配置允许多达 32 个共享 `NFS` 数据存储。\n\
  - **网络存储上的巨型帧**：得益于巨型帧的支持，网络存储连接可以更快，允许一次性通过网络推送更多数据。支持在 1 Gbps (Gbps) 和 10 Gbps\
  \ 网卡上的 `iSCSI` 和 `NFS`。\n\n\n\n\n\n![check.png](img/check.png) 增强型 vMotion 兼容性（EVC）：`EVC`会利用`Intel\
