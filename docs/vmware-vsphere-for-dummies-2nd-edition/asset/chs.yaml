  \n# vSphere，存储的守护者\n\n存储是大多数服务器的基础，vSphere 环境也不例外。然而，vSphere 存储有些不同。通常会使用不位于服务器内部的存储，以便多个服务器可以访问它。\n\
  \n存储可以是本地或远程的。本地存储是服务器内部的磁盘，对于安装 `ESX` 服务器有用，但通常不用于虚拟机（VM）。在某些情况下，当主机用于测试或非常小规模部署时，可以使用本地存储。远程存储来自存储区域网络（SAN）或网络文件系统（NFS）位置的存储。远程存储由不同的阵列或服务器提供，并将其磁盘呈现给\
  \ vSphere 主机。\n\n## 深入了解精细配置（Thin Provisioning）\n\nvSphere 中的精细配置（Thin provisioning）简单来说按需分配。为虚拟机创建一个磁盘，初始大小非常小。随着数据被写入虚拟机磁盘，磁盘会扩展到你设置的大小，这是由\
  \ vSphere 在后台完成的，且独立于操作系统或应用程序。某些应用程序和操作系统会在格式化文件系统或数据文件时写入大量的 0，在这种情况下，磁盘文件的增长速度可能比你预想的要快。\n\
  \n精细配置的磁盘不会自动收缩。你可以通过在操作系统和 vSphere 中运行命令来收缩它们。\n\n## 因过度分配而导致自陷困境\n\n考虑一个 1TB 的卷，你需要在其上创建五个虚拟机磁盘文件。你可以在其上创建五个\
  \ 250GB 的精细配置磁盘，它们在最初都会运行得良好。然而，随着时间的推移，它们会增长，你最终可能会承诺的磁盘空间超过了你实际能提供的空间。这种情况可能会导致虚拟机失败，因此仔细监控分配至关重要。\n\
  \n另一方面，应用程序专家往往会高估他们所需的磁盘空间。在某些情况下，应用程序规范可能声称所需的磁盘空间是实际需要的十倍，导致磁盘空间浪费和金钱浪费。精细配置允许你在给予应用程序专家所需磁盘容量的同时，让他们只购买已使用的部分，从而让你的专家和财务人员都满意。\n\
  \n## 共享存储不仅仅是共享空间\n\n磁盘通常不共享。在物理服务器中，磁盘由一个服务器独占，除非它是一个集群。集群通常还提供对磁盘的独占访问方式，使得磁盘可能呈现给多个服务器，但每个磁盘每次只由集群中的一个节点访问。\n\
  \n在 vSphere 中，共享磁盘是常见的。SAN 上的大容量卷通常会被创建并呈现给多个服务器，这对于存储领域的人来说可能是新概念。vSphere 包含一个设计用于托管虚拟机的文件系统，它允许从多个主机安全地访问呈现的磁盘。\n\
  \n# 访问控制与数据存储（Datastores）\n\n由于 vSphere 经常与共享存储一起使用，因此共享你想共享的内容非常重要。存储环境中的错误配置可能导致访问丢失、数据丢失或两者兼有。\n\
  \n当你将 vSphere 主机连接到 SAN 时，你可能赋予了它看到你并不打算呈现给主机的 SAN 卷的能力。将这些无关的 SAN 存储卷从 vSphere\
  \ 中隐藏是一个好主意，这样你就不会损坏或影响这些卷。\n\n在大多数 SAN 环境中，阵列会确保只有你授予访问权限的主机看到特定的卷。这种安全措施称为逻辑单元号（LUN）掩码，它独立于\
  \ vSphere 的安装。\n\n通常情况下，在阵列上进行掩码是做法。它简单、安全，是提供 LUN 掩码最常见的方法。如果你需要，你也可以在 vSphere\
  \ 主机上进行掩码，通过命令行修改映射规则（claim rule）设置。如果你计划在 vSphere 主机上进行掩码，最好与 VMware 支持团队密切合作。\n\
  \n出于可用性、性能和安全的考虑，SAN 不应与普通流量在同一个网络上运行。\n\n## 高级存储配置\n\n你需要了解一些高级存储配置。这些配置并不常用，但在特殊情况下非常重要。\n\
  \n原始设备映射（RDM）是一个指向物理设备的文件。RDM 包含了如何访问物理存储设备的信息，并在将物理服务器转换为虚拟机或在虚拟机磁盘文件不适用的情况下非常有帮助。\n\
  \n很多时候，如果虚拟机需要访问巨大的磁盘，可以使用 RDM 来简化访问。RDM 也用于多个物理或虚拟机需要访问同一块磁盘的情况。\n\nvSphere 有多种选择存储连接路径的方法。这些路径选择插件（PSP）决定了\
  \ vSphere 如何发送和检索数据。大多数位于硬件兼容指南中的阵列都分配了默认 PSP，且该 PSP 通常对该阵列是最优的。我们在第 12 章深入讲解 PSP。\n\
