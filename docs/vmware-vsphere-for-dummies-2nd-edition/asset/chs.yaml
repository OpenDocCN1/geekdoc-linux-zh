  \ SQL Server 2005 Express 数据库引擎，则你的新数据库必须满足某些要求。服务器需要 Microsoft Active Directory\
  \ 域成员身份。在启动实际安装程序之前，必须先满足这些先决条件等。\n\n安装 vCenter Server 需要以下条件：\n\n![check.png](img/check.png)\
