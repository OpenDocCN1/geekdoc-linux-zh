  \ vCenter Server。\n\n## Veeam FastSCP\n\n[www.veeam.com](http://www.veeam.com)\n\
  \nFastSCP（见图 22-5）并不仅仅是另一个基于安全外壳 (SSH) 的安全拷贝工具。由于 FastSCP 引擎中内置了压缩和空块删除功能，FastSCP\
  \ 复制文件的速度比其他安全拷贝 (SCP) 工具快六倍。它易于使用、支持 vSphere，并且由 Veeam 免费提供。\n\n**图 22-4：** vSphere\
