  \ `vSphere` 主机群时。\n\n# 第 4 章\n\n## 比较虚拟基础设施 3.5 与 vSphere 4.x\n\n## 本章内容\n- 理解 `VI3`\
  \ 与 `vSphere 4.x` 之间的差异\n- 发现 `vSphere 4.0` 中的新功能\n- 了解 `vSphere 4.1` 的更新\n\nVMware\
  \ `vSphere 4.0` 通过新技术、改进的性能以及在高度可用、容错架构方面的巨大进步，提高了虚拟化领域的标杆。VMware 在 `vSphere 4.1`\
  \ 再次做到了这一点，将性能和容量推向新的高度，使其比以往任何时候都更高效、更易于管理。\n\n本章解释了从 `Virtual Infrastructure 3.5`\
  \ (`VI3`) 到 `vSphere 4.0` 之间 `ESX` 所的增强。你将发现 `vSphere 4.0` 中新增的新功能，然后探索 `vSphere\
  \ 4.0` 与 `vSphere 4.1` 之间的新功能和改进。\n\n## 快速比较 VI3 与 vSphere 4\n`vSphere 4.0` 的引入带来了更强大的虚拟机\
  \ (`VM`) 和更灵活的架构。`Virtual Infrastructure 3.5` (`VI3`) 让 VMware 进入了生产数据中心，但 `vSphere\
  \ 4.0` 通过为托管关键关键任务应用设计的功能和能力使其进入更深层次。在本节中，你将了解到 `VI3` 的改进以及 `vSphere 4.0` 中将其提升到新水平的新功能。\n\
  \n### 更大、更好的虚拟机\n`ESX/ESXi 4.0` 随着其新默认标准 `Virtual Machine Hardware Version 7` 的发布，对虚拟机组件引入了长期以来需要的更新。以下是相关变化：\n\
  \n- **虚拟 CPU**：每个虚拟机的虚拟中央处理器 (`vCPUs`) 最大数量从 4 个 `vCPUs` 增加到 8 个 `vCPUs`。此外，一个 `VM`\
  \ 可以拥有 1 到 8 个 `vCPUs`，并以单个 `vCPU` 为单位递增。`VI3` 仅允许 1、2 或 4 个 `vCPUs`。\n- **虚拟机内存**：`VM`\
  \ 的最大内存现在为 255GB。而 VI3 中的最大 64GB。\n- **虚拟网络适配器**：VMware 自己的虚拟网络适配器在达到第三代 (`VMXNET3`)\
  \ 时增加了一些微妙的性能改进。\n- **更多虚拟硬盘类型**：在 `VI3` 之前，你只有两个虚拟硬盘选项：`LSI SCSI adapter` 和 `BusLogic\
  \ SCSI adapter`。现在增加了两个选项：一个 `LSI SAS adapter`（支持 Windows Server 2008 故障转移集群配置），以及用于不支持\
  \ SCSI 的操作系统的 `集成电子设备` (`IDE`) 适配器。\n- **与 Windows 性能关联的虚拟机性能计数器**：此功能允许运行在每个 `VM`\
  \ 中的 `VMware Tools` 代理直接从 Windows 获取数据，消除了 `vCenter Server` 读取数与其他 Windows 性能监控工具之间的差异。\n\
  - **对客户操作系统的更多支持**：`vSphere 4.0` 增加了对以下操作系统的支持：\n    - Asianux 3.0 Server\n    -\
  \ CentOS 4\n    - Debian 4 和 5\n    - FreeBSD 6 和 7\n    - OS/2 4 和 4.5\n    - MS-DOS\
  \ 6.22\n    - Windows 3.1\n    - Windows 95 和 98\n    - Windows 7（实验性）\n    - Windows\
  \ Server 2008 R2（实验性）\n    - Windows Preinstallation Environment 2.1\n    - SCO\
  \ OpenServer 5\n    - SCO UnixWare 7\n    - Solaris 8 和 9（实验性）\n\n### vCenter Server（以前称为\
  \ VirtualCenter）\n`vCenter Server` 在 `vSphere 4.0` 中有了新的名称和新外观，但并不仅此。`vCenter Server\
  \ 4.0` 中的主要改进包括：\n\n- **客户 OS 定制**：`vCenter Server` 现在可以自定义 Windows Server 2008（32\
  \ 位和 64 位）、Ubuntu 8.04 和 Debian 4.0。\n- **集中许可许可**：你不再需要像 `VI3` 那样的许可证服务器或主机许可证文件。所有产品和功能许可现在由从\
  \ `vCenter Server 4.0` 管理的 25 位许可证密钥组成。\n- **Storage vMotion**：这一备受青睐的功能现在可以通过 `vCenter\
  \ Server` 管理，并跨网络文件系统 (`NFS`)、互联网小型计算机系统接口 (`iSCSI`) 和光纤通道 (`FC`) 存储工作。`Storage\
  \ vMotion` 已更新，以利用新的 `VMkernel` 代码更高效地复制存储数据块。该功能还可以用于将虚拟磁盘从厚格式转换为精简格式。\n- **性能图表增强**：`vCenter`\
  \ 现在为 CPU、内存、磁盘和网络的性能指标提供了一个所谓的“单一窗格”，无需大量操作。\n- **性能图表增强**：`vCenter` 现在提供……（性能级警报）\n\
