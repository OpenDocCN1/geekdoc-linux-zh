  \n\n\n2. 选择虚拟机的连接类型并点击“下一步”。\n\n出现“虚拟机 — 连接设置”页面。\n\n3. 为命名端口组（Port Group）。\n\n\
  如果您正在使用 `vMotion` 或分布式资源调度程序（`DRS`，详细信息见第 13 章），请确保此名称在整个集群中保持一致。\n\n4. 在 `VLAN\
  \ ID`（可选）设置中，输入 VLAN 号（通常由您的网络管理员分配），并点击“下一步”。\n\n此数字被称为虚拟交换机标记（`VST`），它必须与物理交换机上的标记匹配，这是在\
  \ vSphere 中使用 VLAN 的常见方式。\n\n5. 在“准备完成”（Ready To Complete）页面上检查更改，然后点击“完成”。\n\n\
  6. 关闭您添加了端口组的 `vSwitch` 属性窗口。\n\n### 将端口组与 VLAN 关联\n\n每个端口组只能关联一个 VLAN。您可以通过在 `vSwitch`\
  \ 属性中选择端口组并进行编辑来更改 VLAN 号。请记住，如果虚拟机正在使用该端口组，这样做可能会中断网络流量。\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ 在使用 vSphere 集群时，通用的命名规范至关重要。当您将虚拟机从一个主机移动到另一个主机时，vSphere 要求名称必须匹配。如果目标主机上不存在相应的\
  \ `vSwitch` 或端口组，则无法使用 `vMotion` 进行实时迁移。\n\n### 使用不带 VLAN 标记的端口组\n\n端口组通常与 VLAN\
  \ 关联，但并非必须如此。在某些环境中，所有标记都在外部交换机上完成，因此它们都统一配置为使用 `VLAN 0`。这被称为外部交换机标记（`EST`），在这种情况下，您许多网络适配器，因为并不是每个\
  \ `vSwitch` 都会参与标记。\n\n另一个选项是虚拟机内部标记（`VGT`），它依赖于虚拟机在网络属性中添加 VLAN。要使用 `VGT`，您必须将虚拟机使用的端口组设置为\
  \ `VLAN 4095`。如果您已经在物理网络上使用了基于主机的 VLAN，并希望在 vSphere 中继续这样做，这种模式非常有用。\n\n### 添加管理网络端口\n\
  \n管理网络连接（在 `ESX` 中也称为 `Service Console` 连接）非常重要。所有服务控制连接都是管理网络的一种，因此我们使用“管理网络”一词来指代两者。它是用于管理\
  \ vSphere 主机，因此您可能需要确保它不会掉线。此外，在使用高可用（`HA`）时，管理网络端口尤为重要，因为它用于跟踪主机是否在线。因此，为您的主机管理提供冗余是非常关重要的。\n\
  \n您用于虚拟机网络更改的大多数方法也适用于管理网络。明智的做法是确保用于管理网络的 `vSwitch` 有两条连接到物理交换机的上行链路（uplinks）。此外，许多管理员喜欢连接到另一个物理交换机以创建一个额外的管理网络端口。这样做可以保护保护主机管理免受上游交换机故障的影响，甚至可以将第二个管理网络连接放置在完全不同的\
  \ VLAN 上。要将管理网络放置在完全不同的 VLAN 上，请完成以下步骤：\n\n1. 在 `vSphere Client` 中，转到“配置”选项卡并选择“网络”。\n\
  \n2. 点击“添加网络”。\n\n出现“添加网络向导”。\n\n3. 选择适当的连接类型并点击“下一步”。\n\n如果您运行的是 `ESX`，则必须选择 `Service\
  \ Console`。如果您运行的是 `ESXi`，则没有选择 `Service Console` 的选项。如果您使用的是 `ESXi`，请选择 `VMkernel`\
  \ 连接类型。\n\n4. 在“网络访问”页面上，选择“创建虚拟交换机”。\n\n5. 根据您的网络配置选择适当的上行链路并点击“下一步”。\n\n6. 在“连接设置”页面上，为端口组输入标签并在必要时输入\
  \ `VLAN ID`，然后点击“下一步”。\n\n7. 在“IP 连接设置”页面上输入适当的 IP 设置。\n\n请注意，虽然您可以将管理网络放在不同的 VLAN\
  \ 上，但该连接只能有一个默认网关。图 11-5 显示了额外管理网络连接的“IP 连接设置”窗口。\n\n**图 11-5：** 创建额外的管理网络连接时，必须输入其\
  \ IP 设置。\n\n![9780470768723-fg1105.eps](img/9780470768723-fg1105_fmt.jpeg)\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 在 `ESX` 中，`Service Console` 虚拟以太网适配器被称为 `vswif`。如果您使用命令行，每个 Service Console 虚拟以太网适配器都以\
  \ `vswif` 开头，从 `vswif0` 开始。`ESXi` 使用 `VMkernel` 连接进行管理。\n\n8. 通过 `vSphere Client`\
  \ 尝试连接新地址以测试连通性。\n\n此外，在 `ESX` 上，登录主机控制台并使用 `vmkping` 命令。\n\n```\nvmkping\n```\n\
  \n### 添加 VMkernel 端口\n\n`VMkernel` 端口用于多种功能，包括 `vMotion`、网络文件系统（`NFS`）和 `iSCSI`。VMkernel\
  \ 端口直接位于虚拟机程序中的逻辑连接。要添加 VMkernel 端口，在 `vSphere Client` 中转到“添加网络向导”并按照以下步骤操作：\n\n\
  1. 在“连接类型”页面，选择 `VMkernel` 并点击“下一步”。\n\n2. 在“网络访问”页面，选择现有的 `vSwitch` 或创建一个新的并点击“下一步”。\n\
  \n3. 在“VMkernel — 网络设置”页面为端口组标记并选择 `VLAN`，然后点击“下一步”。\n\n### 启用 vMotion\n\n`VMkernel`\
  \ 适配器最用途之一是 `vMotion`。要启用 `vMotion`，可以在“VMkernel — 网络设置”对话框中选择“使用此端口组用于 vMotion”复选框。\n\
  \n“使用此端口组用于故障容”复选框用于设置主机使用故障容（FT）。虽然您可以在同一个端口组上启用 `vMotion` 和 `FT`，但这样做会导致问题。`vMotion`\
  \ 和 `FT` 都是密集型网络消费者，因此它们应该至少每秒千兆（Gbps）连接。在大多数情况下，对于超过一个 `FT` 虚拟机，您希望为 `FT` 专用 10\
  \ Gbps 链路。图 11-6 显示了启用 `vMotion` 的设置。\n\n**图 11-6：** 勾选 `vMotion` 复选框以允许端口组用于 `vMotion`。\n\
  \n![9780470768723-fg1106.eps](img/9780470768723-fg1106_fmt.jpeg)\n\n### 添加 vNetwork\
  \ 分布式虚拟交换机\n\n`vNetwork 分布式交换机`是 vSphere 的新功能，仅在 Enterprise Plus 版本可用。与 `vNetwork`\
  \ 标准交换机相比，`vDS` 具有多增强。`vDS` 设计用于多个主机，并提供了更细粒度的流量控制、更好的虚拟机状态管理以及控制每个连接类型可使用带宽的能力。\n\
  \n\n\n\n本章的大部分操作都在主机级别进行，但你可以在 `vCenter` 的数据中心级别定义一个 `vDS`。通过在数据中心级别定义它，你可以将 `VDS`\
  \ 分配给数据中心内的任何主机。\n\n### 以下是创建 `vDS` 的步骤：\n\n1. 在 `vSphere Client` 中，选择 `Home⇒Networking`（进入网络），进入图标组中的网络页面。\n\
  2. 右键点击你计划创建 `vDS` 的数据中心，选择 `New vNetwork Distributed Switch`（新建网络分布式交换机）。出现 `Create\
  \ vNetwork Distributed Switch Wizard`（创建网络分布式交换机向导）。\n\n如果你正在使用 `vCenter` 4.1，向导会提示你使用哪个版本的\
  \ `vDS`。\n3. 如果所有连接到 `vDS` 的主机都在运行 `vSphere` 4.1，请选择 `vNetwork Distributed Switch\
  \ Version: 4.1.0` 选项；否则，选择 `vNetwork Distributed Switch Version 4.0`。\n\n版本 4.1\
  \ 的 `vDS` 支持 `Network I/O Control`（网络 I/O 控制）和 `Load-Based Teaming`（基于负载的成组），这些新功能允许对单个端口组可以使用带宽分配进行更强大的控制。你可以随时升级\
  \ `vDS`，但无法将其降级。\n4. 点击 `Next`（下一步）。\n5. 在 `General Properties`（常规属性）页面中，命名 `vDS`，设置\
  \ `vDS` 可拥有的最大上行端口数，然后点击 `Next`。并不是所有连接到 `vDS` 的主机都需要使用相同数量的端口。出现 `Add Hosts And\
  \ Physical Adapters`（添加主机和物理适配器）。\n6. 选择将物理适配器分配给 `vDS` 或稍后进行进行，然后点击 `Next`。如果你尚未配置物理上行，或者有多个\
  \ `vDS` 需要创建，选择稍后进行非常有价值。出现 `Ready to Complete`（准备完成）页面，该页面将显示 `vDS` 的图。\n7. 保持\
  \ `Automatically Create A Default Port Group`（自动创建默认端口组）勾选框并点击 `Finish`（完成）。此选项对于简单配置有用。然而，由于许多使用\
  \ `vSphere Enterprise Plus` 版本的企业有更复杂的需求，大多数情况下你会取消勾选此选项。但为了这组步骤的目的，请保持勾选此选项。\n\n\
  ### 将主机连接到 `vDS`\n\n在主机上的 `VMs` 使用 `vDS` 之前，必须将其挂载到主机。当你挂载 `vDS` 时，你需要选择哪些物理适配器将作为\
  \ `vDS` 的上链路。\n\n要将主机连接到 `vDS`，请遵循以下步骤：\n1. 选择 `Home⇒Networking`（进入网络）将 `vSphere\
  \ Client` 切换到网络，然后点击窗口左侧导航窗中的交换机名称。\n2. 在 `Getting Started`（入门）选项卡下，点击 `Basic Tasks`（基本任务）下的\
  \ `Add A Host`（添加主机）。出现 `Add Host To vNetwork Distributed Switch Wizard`（向网络分布式交换机添加主机向导）。此页面提供了主机和物理适配器的汇总列表，如图\
  \ 11-7 所示。与将物理适配器从一个 `vSwitch` 分配到另一个类似，选择已在使用的适配器将将其从现有交换机中移除并挂载到目标 `vDS`。\n3.\
  \ 选择主机以及用于上链路的物理适配器。当你有许多主机时，你可能不知道需要使用哪个适配器。有关物理适配器的详细信息，点击 `View Details`（查看详细）。\n\
  4. 选择你需要的主机和适配器后，点击 `Next`。出现 `Network Connectivity`（网络连通性）页面，允许你将虚拟适配器迁移到新的 `vDS`。\n\
  \n![warning_bomb.eps](img/warning_bomb_fmt.jpeg) 如果你更改以 `vswif` 开头的 `Service Console`（服务控制台）适配器，请务必小心。如果上链路不起且你没有为\
  \ `Service Console` 准备多个适配器，你可能会导致主机变得不可管理，直到你从控制台命令行修复它。因为对于这些连接通常不需要 `vDS` 的高级功能，许多许多管理员将管理网络和\
  \ `VMkernel` 连接保留在标准的 `vSwitches` 上。\n5. 选择要迁移的虚拟适配器，然后点击 `Next`。出现 `Virtual Machine\
  \ Networking`（虚拟机网络）页面，允许你将虚拟机迁移到新的 `vDS`。\n\n**图 11-7：** 选择要挂载到 `vDS` 的主机和物理适配器。\n\
  \n![9780470768723-fg1107.eps](img/9780470768723-fg1107_fmt.jpeg)\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\n\
  \n### 完成 `vDS` 迁移\n\n现在我们已经向你暗示了如何在不停止机的情况下的情况下从标准 `vSwitch` 迁移到 `vDS`，以下是执行迁移的方法：如果你有一个两个上链路的标准交换机，可以在将\
  \ `vDS` 分配给主机时，从 `vSS` 获取其中一个上链路。然后你可以将 `VMs` 迁移到 `vDS`。你可能会丢失一个左右的数据包，但任何通过传输控制协议\
  \ (`TCP`) 的流量都会优雅地处理最小的丢包。在你清空标准交换机后，可以将上链路移动到 `vDS` 并删除标准的 `vSwitch`。自然地，这种迁移应该先在实验室中完善！\n\
  6. 选择要迁移的虚拟机后，点击 `Next`。当你对自己的网络配置团队有信心时，此迁移窗口很有帮助；但在大多数情况下，我们建议如果你在这里选择迁移 `VM`，请选择一个测试\
  \ `VM`。稍后在你对网络实现有信心后，可以进行迁移，通常无需停机！\n7. 出现向导的最后一页，你可以在那里检查选择并看到你所创建配置的图形表示。`vDS`\
  \ 比标准交换机复杂，所以你应该仔细检查此窗口。图 11-8 所示了一个简单的配置。\n\n**图 11-8：** `Add Host to vNetwork\
  \ Distributed Switch`（向网络分布式交换机添加主机）的 `Ready to Complete`页面。\n\n![9780470768723-fg1107.eps](img/9780470768723-fg1107_fmt.jpeg)\n\
  \n### 配置 VLAN\n\n`vDS` 中的 VLAN 工作方式与标准交换机相同。通过点击 `Getting Started` 选项卡中的 `Create\
  \ New Port Group`（新建端口组），在 `vDS` 中创建端口组。向导类似，但你在 `VLAN Type`（VLAN 类型）上会有几个新选项：\n\
  \n![check.png](img/check.png) `None` 用于端口组没有关联 VLAN 信息。\n\n![check.png](img/check.png)\
  \ `VLAN` 类似于标准 `vSwitch` 上的 `VST`。你需要输入与物理交换机匹配的数字。\n\n![check.png](img/check.png)\
  \ `VLAN Trunking` 类似于 `VGT`，用于在 guest 虚拟机内部标记 VLAN。如果你选择此选项，输入你预计 `vDS` 的所有 VLAN\
  \ 数字。\n\n![check.png](img/check.png) `Private VLAN` 用于安全敏感环境，实现基于二层的安全，以便同一 `vDS`\
  \ 上的两个 `VM` 无法通信。\n\n### 配置网络 I/O 控制\n\n网络 I/O 控制 (`NetIOC`) 是 `vSphere` 4.1 的一项新功能，允许管理员对流经同一个\
  \ `vDS` 的不同流量进行细粒度控制。虽然你可以在任何类型的链路中使用此功能，但它的真实目的是针对少数高带宽连接的服务器，例如具有两个 10 Gbps 链路的服务器。此功能允许管理员划分链路并确保不同的需求得到满足。\n\
  \n与 `vSphere` 中的大多数性能保证一样，`NetIOC` 只有在网络链路时才会起作用。一旦链路饱和，`NetIOC` 使用份额确定划分。\n\n`NetIOC`\
  \ 将流量分为六种不同的 `Network Resource Pools`，如下：\n\n![check.png](img/check.png) `FT Traffic`\n\
  \n![check.png](img/check.png) `iSCSI Traffic`\n\n![check.png](img/check.png) `vMotion\
  \ Traffic`\n\n![check.png](img/check.png) `Management Traffic`\n\n![check.png](img/check.png)\
  \ `NFS Traffic`\n\n![check.png](img/check.png) `Virtual Machine Traffic`\n\n如果你有三个\
  \ `Network Resource Pools`，其中 `Virtual Machine Traffic` 拥有 100 个份额，另外两个各有 50 个，当网络饱和时，`vDS`\
  \ 将 50% 的带宽分配给虚拟机，并为另外两个 `Network Resource Pools` 每个分配 25%。\n\n\n\n\n\n您可以通过进入 vDS\
  \ 并点击 `Resource Allocation` 标签来启用 NetIOC。如果没有该标签，说明您可能使用的是 4.0 版本的 vNetwork 交换机。您可以通过选择\
  \ `Summary` 标签并点击 `Upgrade` 来进行升级。将弹出一个向导并检查兼容性，您可以按照其提示完成升级。\n\n如果 vDS 版本为 4.1，您需要在\
  \ `Resource Allocation` 标签中点击 `Properties`，并勾选 `Enable Network I/O Control On This\
  \ vDS` 复选框。\n\n启用 NetIOC 后，它有一组默认的共享值。要修改这些值，请右键点击 `Network Resource Pool` 并选择 `Edit\
  \ Settings`。在对话框中为物理适配器共享和主机限制输入相应的设置，如图 11-9 所示。\n\n**图 11-9：** 显示 Resource Allocation\
  \ 标签和 Network Resource Pool 设置的 vSphere Client。\n\n![9780470768723-fg1109.tif](img/9780470768723-fg1109_fmt.jpeg)\n\
  \n# 排除 vSphere 网络故障\n\nvSphere 网络远比传统服务器的网络要复杂得多，因此很容易出错。幸运的是，本章中使用的许多向导可以确保您不会犯低级错误，但某些领域仍然可能让你措手不及。\n\
  \n许多常见的配置错误发生发生在 VLAN 设置或 vSwitch 名称中出现拼写错误时。这些错误在许多服务器位于同一个集群并配置了 `vSS` 的情况下尤为常见。由于所有项必须匹配才能允许\
  \ DRS 和 `vMotion` 正常工作，因此您在创建 `vSS` 时必须确保准确性。\n\n许多问题问题与上行链路有关。如果您忘记了某个配置设置（例如，忘记配置物理交换机对适当的\
  \ VLAN 进行中干模式处理），那么故障排除可能会变得尤为棘手。\n\n在将生产流量部署到 vSphere 主机之前，您需要确保能够进行激进的网络测试。我们强烈建议使用一个测试虚拟机，将其放置在\
  \ VLAN 中，然后测试每个主机。然后将虚拟机在各个主机之间移动并确认它们都运行正常。您可能需要测试几个 VLAN，因为大型企业使用几十个不同的 VLAN 并不罕见。\n\
  \n![tip.eps](img/tip_fmt.jpeg) vSphere 能够告诉您链路是可用还是断开，因此在创建网络设计时，最好关注 vSphere Client。如果物理适配器断开或速度设置错误，客户端会提供信息。\n\
  \n# 第 12 章：连接 vSphere 到共享存储\n\n## 本章内容\n\n![arrow](img/arrow.png) 发现不同类型的 vSphere\
  \ 存储\n![arrow](img/arrow.png) 为您的环境选择最佳组合\n![arrow](img/arrow.png) 配置 vSphere 存储\
  \ (NAS、iSCSI 和 FC SAN)\n\nVMware vSphere 存储是您的虚拟化环境的基础。与 vSphere 网络一样，vSphere 对存储施加了异常的负担，因为多个虚拟机（VM）必须共享相同的物理连接。vSphere\
  \ 的存储可以是单个主机的本地存储，也可以在多个主机之间共享。大多数组织使用共享存储来存放 VM 数据文件。通过共享存储，多个 vSphere 主机可以访问相同的数据，从而允许\
  \ vSphere 的许多核心功能运行，如 `vMotion`。本章将解释您在设置共享存储时的许多不同选项以及每个选项的优缺点。\n\n## 熟悉 vSphere\
  \ 存储\n\n安装 vSphere 后，本地硬盘上通常会自动创建一个分区，可用于 VM 存储。许多 vSphere 管理员不使用此分区，因为他们使用共享存储，并实施了所有\
  \ VM 都应存储在共享存储上的策略。\n\n如果管理员费了这么多精力，那么共享存储一定非常棒，对吧？嗯，只有当您希望利用 vSphere 提供的几乎任何关于性能或可用性的主要功能时，才如此！\n\
  \n### 解释 vSphere 存储设备命名\n\nvSphere 必须跟踪大量的存储。在大配置中，单个主机可以访问 256 个 `VMFS` 卷和 64 个\
  \ `NFS` 卷！因此，为了管理这些，vSphere 为存储设备分配了名称。这些名称复杂但唯一。当您创建一个卷或连接到 `NFS` 导出时，也可以为存储命名。在开始之前，请确保您有一套良好的命名规范，因为很快就会变得混乱！\n\
  \n![warning_bomb.eps](img/warning_bomb_fmt.jpeg) 每当您处理存储时，请记住存储通常是绝对的。当您在底层对磁盘进行更改时，没有提供恢复功能的回收站。在此处务必小心，因为本章中的大部分配置都可能深度修改数据；如果您在非预期的目标上执行操作，您可能无法从损坏中恢复。\n\
  \nvSphere 存储选项包括：\n\n![check.png](img/check.png) 虚拟机文件系统 (VMFS)\n![check.png](img/check.png)\
  \ 网络文件系统 (NFS)\n\n## VMware 虚拟机文件系统\n\n在许多操作系统（如 Microsoft Windows）中，您无法跨多个主机原生共享文件系统。特殊配置（如集群）会创建独特的文件系统过滤器，允许多个服务器看到同一块磁盘，但即使如此，它们通常也不允许多个服务器读写同一块磁盘。vSphere\
  \ 使用虚拟机文件系统 (`VMFS`)，这是一种专有的集群文件系统，允许许多主机挂载并使用同一块磁盘。任何映射到 `ESX` 或 `ESXi` 主机的卷都称为\
  \ `datastore`（数据存储）。\n\n`VMFS` 被许多运行 vSphere 的公司使用。由 VMware 为虚拟化定制设计的 `VMFS` 为 VM\
  \ 的存储和执行以及快照提供了最佳性能。\n\n`VMFS` 允许最多 64 个主机访问同一个卷。在实践中，64 个主机通常是不可能的，因为主机在执行某些操作（如启动\
  \ VM）时必须相互竞争，因此您通常不希望这么多主机访问该卷。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ `VMFS` 并不经常实际上锁定文件系统。当需要时，`VMFS` 使用称为小型系统接口 (`SCSI`) 预留。`SCSI` 预留是指单个主机完全控制卷的短暂时间——例如，vSphere\
  \ 在启动 VM 或创建、删除或更改文件名称和大小时发出 `SCSI` 预留。由于精简配置的文件会增长，使用精简配置会增加 `SCSI` 预留的数量。`SCSI`\
  \ 预留可能会降低性能，因此明智的做法不在单个 `datastore` 上放置过多 VM。在 vSphere 4.1 中，某些数组提供名为 vStorage API\
  \ (`VAAI`) 的插件。`VAAI` 通过将某些功能卸载到阵列提高了性能，并减少了对 `SCSI` 预留的需求。\n\n由于 `VMFS` 设计用于存放整个虚拟机，因此它支持大文件和大卷。卷的大小可达\
  \ 64TB，但由于性能和 `SCSI` 协议的某些限制，它们永远不会那么大。`VMFS` 中的文件大小限制为 262,144 个块，每个块可以是 1MB、2MB、4MB\
  \ 或 8MB。这对应最大文件大小为 256GB、512GB、1TB 和约 2TB。2TB 的大小略小于 2TB，因为 512 字节被某些元数据和 `SCSI`\
  \ 命令集使用。\n\n\n\n\n\n当您创建 `VMFS` 时，必须选择块大小。一旦选定，在不销毁并重新格式化卷的情况下将无法更改，因此请明智选择。对于任何特定大小，并没有性能优势或惩罚。块大小通常取决于您正在创建的卷的大小，以及您计划存放在该卷上的虚拟机磁盘格式（`VMDK`）文件的大小。例如，如果您正在创建\
  \ 750GB 的卷，您可能会选择 `2MB` 的块大小，甚至是 `4MB` 的大小，但 `8MB` 的大小就是没必要的。不过，您可以扩展 `VMFS`，因此您可能希望在计划中考虑增长性。\n\
  \n在旧版本的 `VMFS` 中，选择大块大小有一个严重的缺点。任何小文件都会占用一整个块。因此，当使用 `1MB` 块大时，一个微小的配置文件就会占用 `1MB`。在随\
  \ `vSphere 4` 包含的 `VMFS` 版本中，执行了子块分配，这意味着小文件存储在磁盘的 `64K` 区域中。因此，您可以安全地选择 `8MB` 的块大小，小文件将存储在文件系统的特殊小文件区域。\n\
  \n![tip.eps](img/tip_fmt.jpeg) VMware 管理员可能会为了块大小问题争论几个小时。使用较大的块大小之一几乎没有缺点，因此我们建议您直接选择最大值。这样做可以为您在未来提供最大的灵活性，并让您为大多数组织所经历的对\
  \ `vSphere` 的快速采纳做好准备。\n\n# 网络文件系统\n\n网络文件系统（`NFS`）是 Sun Microsystems 公司开发的一种用于通过网络共享文件的协议。`NFS`\
  \ 通常由 `UNIX` 和 `UNIX-like` 系统使用，但它在互联网请求注释（`RFCs`）中有定义，因此许多平台和产品都可以使用。这种灵活性就是为什么越来越多的管理员使用\
  \ `NFS` 作为他们主要的虚拟机存储的原因。\n\n此外，`NFS` 比其他存储技术更容易管理。通常，对于复杂的存储设计，组织需要一个专门的存储管理员，但\
  \ `NFS` 通常由服务器管理员管理。`NFS` 也是尝试 `vSphere` 能力的极佳方法，因为它与 `vMotion`、分布式资源调度程序（Distributed\
  \ Resource Scheduler）以及大多数其他 `vSphere` 功能协同工作。\n\n`NFS` 协议没有指定底层文件系统，而是指定了如何在网络上访问它。最初，使用\
  \ `NFS` 被视为非生产系统和桌面虚拟机的低性能选项，但现在它常用于生产服务器虚拟机。提供 `NFS` 访问的服务器通常具有其他强大功能，例如高级复制和数据去重能力，使得\
  \ `NFS`成为 `vSphere` 协议套中受欢迎的选择。\n\n`NFS` 也经常被称为网络存储（`NAS`）。几乎所有的 `NFS` 实现都使用网络，因此它们受限于网络的吞吐量。在许多情况下，带宽可能低于竞争技术，但随着\
  \ `10Gbps 以太网` 的这种差距正在缩小。在 `vSphere` 中，每个主机可以拥有 `64` 个 `NFS` 挂载（卷），`NFS` 卷的大小由提供导出的\
  \ `NFS` 服务器决定。\n\n# 决定磁盘\n\n虚拟机可以使用多种磁盘选项，了解如何使用它们非常重要。虚拟机通常有一个或多个硬盘，但它们可以映射到不同的位置：\n\
  \n![check.png](img/check.png) `VMDK`：VMware 磁盘格式（`VMDK`）文件是附加到虚拟机的磁盘，是存在于 `VMFS`\
  \ 数据存储上的文件。`VMDK` 最大可达约 `2TB`，且 `VMDKs` 支持快照（vSphere 提供的一种写复制技术），并允许使用 `vMotion`\
  \ 在数据存储和主机之间迁移 `VMDK`。\n\n![check.png](img/check.png) 原始设备映射：`RDM` 允许虚拟机直接连接到 `SAN`\
  \ `LUN`。最初，这意味着您必须放弃 `VMDK` 提供的所有优点，例如 `vMotion` 和快照，但现在不再是这样。`RDMs` 有两种类型：\n\n\
  *   物理兼容模式 `RDMs` 提供对硬件的直接访问，而不涉及任何 `vSphere`。在物理兼容模式下（也称为称为透传 `RDMs`），存储阵列像看到任何其他物理服务器一样看到虚拟机，并且任何必须与阵列通信的应用程序都将正常工作。快照、克隆（`clones`）或\
  \ `vMotion` 等功能在物理兼容模式 `RDMs` 上无法工作，尽管您的阵列可能提供其中一些服务。\n*   虚拟兼容模式 `RDMs` 对原始设备进行简单抽象，并允许使用\
  \ `vSphere` 的高级功能，如克隆、快照和 `vMotion`。虚拟兼容 `RDMs` 也称为非透传 `RDMS`。\n\n所有 `RDMs` 都使用映射文件，该文件通常存储在与虚拟机配置文件相同的磁盘上。此映射文件包含了虚拟机用于跟踪关联\
  \ `RDM` 磁盘的数据。\n\n![tip.eps](img/tip_fmt.jpeg) 当 VMware 首次引入 `RDMs` 时，它们通常必须用于高性能\
  \ I/O 负载。现在，`RDMs` 的性能特性与 `VMDK` 文件的性能无异。选择通常基于个人偏好，但我们建议在几乎所有情况下都使用 `VMDK` 文件。需要\
  \ `RDMs` 的情况通常与基于客户机的集群、特定的存储环境，或者在已经存在现有 `SAN` `LUN` 且将数据复制到 `VMDK` 中没有意义的情况下。\n\
  \n# 评估 vSphere 存储选项\n\n`vSphere` 支持如此多的存储选项，要确定对你来说最好的方案可能很困难。幸运的是，`vSphere` 还有几种方法可以简化跨存储平台和技术的虚拟机迁移，如果您需要从一种技术迁移：\n\
  \n![check.png](img/check.png) 本地存储：本地存储是附加到服务器的内部磁盘。通常，此磁盘包含服务控制台（Service Console），但不包含其他虚拟机。在许多情况下，此磁盘可能很小，因为本地磁盘通常是镜像驱动器，小至\
  \ `50GB`。在某些独立安装中，会使用大型专用冗余磁盘阵列（`RAID`），服务器内部所有的磁盘都被视为本地存储。当您在主机上安装 `ESX` 或 `ESXi`\
  \ 时，安装程序会自动创建一个本地 `VMFS` 卷。大多数时候，您不需要对本地存储进行任何配置或修改，因此我们不对本地存储进行过多详述。\n\n![check.png](img/check.png)\
  \ 光纤通道 (`FC`）：`FC` 是一种存储协议，它在长距离扩展了 `SCSI` 命令集。一段时间以来，它是 `SANs` 的事实标准，并且目前继续被广泛使用。\n\
  \n`FC` 配置复杂，并支持许多物理形式和拓扑结构。它支持每秒 `1`、`2`、`4` 和 `8` 吉比特（Gbps），未来的路线图中还有更快的版本。`FC\
  \ SANs` 连接到 `FC` 主机总适配器（`HBAs`），服务器通常至少有两个 `HBAs` 以实现冗余路径。\n\n![check.png](img/check.png)\
  \ 互联网 SCSI (`iSCSI`)：`iSCSI` 是一种较新的协议，允许 `SCSI` 协议栈在基础 IP 连接上传输。`iSCSI` 为 `FC` 解决方案提供了成本更低的替代方案，同时保留了许多\
  \ `FC` 协议功能。`iSCSI` `SANs` 的市场份额逐年增长，并已成为中小型部署的标准。\n\n![check.png](img/check.png)\
  \ 网络附属存储：`NAS` 受各种规模机构的欢迎，并消除了 `SAN` 协议的若干局限性。最好的是，它的配置通常比 `SAN` 更容易！`NAS` 解决方案也有价值，因为它们可以极大地简化备份设计。\n\
  \n将 `NAS` 导出挂载到另一个设备上很容易，然后您可以使用任何支持打开文件的备份解决方案对其进行备份。`NAS` 卷的便捷备份可以提高您环境的效率和可靠性。\n\
  \n\n\n\n`NAS`不只是把字母顺序倒过来的 `SAN`。不，它们是代表不同访问方法的不同术语。`SAN` 是基于块的，这意味着存储是像任何其他存储设备（例如传统的内部磁盘）一样作为磁盘呈现的。操作系统必须用某种文件系统来使用一个\
  \ SAN 卷。\n\n与 `SAN` 不同的是，在 NAS 中，其核心访问单位是文件。文件系统隐藏在后台，但不被操作系统控制。因此，FC（光纤通道）和 iSCSI\
  \ 都属于 SAN 技术，因为它们都基于块；而 NFS 属于 NAS 技术。明白了？很好，因为更令人困惑的是还有 NAS 网关：你利用展示给设备的 FC 或 iSCSI\
  \ volume（通过稍后需要明确）。\n\n配置 Fibre Channel SAN Storage\n光纤信道被认为是最复杂的存储器之一来进行设置的，但它的大多数复杂性在于网络自身，也被称为结构体联接。主机相对来说很直接，然而建立一个有效且冗余的\
  \ SAN 是一项令人生畏的任务，并不包含在这本书里。关于更多细节请参考 *Storage Area Networks For Dummies* 第二版，由 Christopher\
  \ Poelker 及 Alex Nikitin 撰写。由于第一个支持 VMware 共享协议正是其次你会发现其它遵循相同基本构建模组。\n\n在 FiberChannel\
  \ 的说法里面，主机透过 HBA 连接到阵列上的端口也叫做目标端 ((target))。宿主笔记本叫做发起方 ((initiator))，一般情况下 Fiber\
  \ 介质的内部结构可以配制使得一个单个发起人只能看到一个单一目标构成，这被称为区域划定。每个接入网都有硬件地址全球标识名 WWN\n\n连接逻辑单元号到虚拟机监视器平台\
  \ LUN 指的是从储存区间导出的多个数据容器，并不是绝对的数字更像是复杂识别符，但被认为是逻辑硬盘所以管理员会说我会为你分割下来。具体针对每台服务器之间，如果\
  \ 10 个服务区各拥有 1 个就会通常输出十个编号为第一项。当建立群集时必须能够见到相同的虽非必要最好也让一致以确保统一地展现。对各个结点要创建一个资料首先确保已被然后登陆客户端。登录之后按照下面步骤执行：单击\
  \ Configuration 标签，位于右侧适配卡面板内点击 Rescan All 选项，接着显示对话框（截图 12-1），说明采用选择确认框以及 VMF 格式扫描，最后再点\
  \ OK 几次。等待完成后能看到出现在详情栏，检视 Devices 按钮按排序。如果不出现检查布线是否正确。至于格式化方面以成为可用，后面章节涵盖设定路径策略。通讯几乎总是搭配冗余经过数个交换机流量方式称之为路线经常但并不一定是依照设置时需要挑选一种类型，它们内含\
  \ PSP 插件软件自带有以下三种及第三方同样可创建：\n\n![check.png](img/check.png) `VMW_PSP_MRU — Most Recently\
  \ Used Path Selection`:此适用于不是活动性对称矩阵，不能处理来自任意节点请求故该模式最为理想，会持续特定线路直到失效，若遭遇中断则切换至备用并且一直沿用这部分不会自动回退。\n\
  \n![check.png](img/check.png) `VMW_PSP_FIXED — Fixed Path Selection`:普遍用于双活系统中，优先选取已指定的那一条，如未定义就根据首次发现结果。一旦不可达便随机挑另一正常工作途径，待原先重新恢复时总归复原。凭借它能手动调节负载均衡粒度级别，精细掌控单台输入量却须手工操刀，每次都需亲力安排，每次改动前要与阵列供应商协商以防造成恶劣影响甚至引发故障。建议先全面交流以避免负面后果。进入圆形竞标的运用步骤如下：开启\
  \ vSphere 客户机，定位所管机器，加油跃入 Config 部分，左侧选接条目如图 12-2 所示列示所有相关装置信息，窗口包括型号、WWID 等项。详情视图下勾出对应所需变更名称，右键并继而导航去\
  \ Manage Paths 命令完成剩余交互。\n\n\n\n“管理路径”窗口已打开，如图 12-3 所示。在顶部 `Policy` 下方，你可以看到“路径选择”下拉菜单。\n\
  \n7. 选择 `Round Robin (VMware)` 并点击 `Change`。\n8. 点击 `Close` 退出“管理路径”对话框。\n\n你刚刚所做的更改改变了一个主机上一个数据存储的路径选择策略。为了利用该更改的优势，所有主机/路径组合都应具有相同的策略。一个主机可以使用多个路径选择策略，但每个数据存储应只能有一个策略，且该策略对于访问它的所有主机都保持一致。\n\
  \n**图 12-3：** 光纤通道管理路径窗口。\n\n![9780470768723-fg1203.eps](img/9780470768723-fg1203_fmt.jpeg)\n\
  \n## 优化 FC SAN 性能\n\n为了优化 FC SAN 性能，你通常希望有多个连接到织网络（fabric）。传统的单个服务器可能永远不需要超过通常两个\
  \ FC 连接，但 vSphere 主机通常需要更多的 FC 连接。磁盘性能通常对 vSphere 环境的性能至关重要，因此最好构建由许多磁盘驱动器支持的 LUN。\n\
  \n通常，为了获得最佳性能，`Round Robin Path Selection Policy` 可以满足你的需求。有时，对于活动/活动阵列，带有手动首选路径的\
  \ `Fixed Path Selection` 可能更好。\n\n要更改首选路径，请遵循前一节“设置路径选择策略”中的第 1 至 6 步。这些步骤会打开“管理路径”窗口。将路径选择设置为\
  \ `Fixed` 后，右键点击你想要设为首选的路径，并在出现的菜单中选择 `Preferred`。请记住这将更改一个主机，而且在手动设置路径时，你需要考虑虚拟机的负载概况，并在阵列端口以及主机\
  \ HBA 之间平衡首选路径。通常，在大型环境中，绘制详细的图表来精确规划路径是明智的。\n\n你可以通过添加数据存储为 vSphere 主机添加更多 FC SAN\
  \ 空间，如前面的章节“将逻辑单元数到 vSphere 主机”所示。由于 vSphere 允许每个主机最多支持 256 个 LUN，许多设计都会使用数十个 LUN。\n\
  \n## 避免常见的配置错误\n\n与 FC 存储的大多数配置位于织网络中，而不是 vSphere 主机上。分区（Zoning）非常复杂，而且大多数阵列都内置了其他安全功能，例如\
  \ `LUN masking`，它允许在阵列中定义的主机可见特定的 LUN。通常，如果你无法看到预期的卷，请从织网络和阵列开始。\n\n许多 vSphere 主机可能有多个\
  \ HBA 端口，但并非所有端口都已连接。请确保你查看的是正确的 HBA，因为有时你正在查看的那个并没有连接。\n\n## 配置 Internet SCSI SAN\
  \ 存储\n\niSCSI 在大型数据中心中变得越来越常见。这种存储可以提供与 FC 相似的性能，但成本较低。因为 FC 和 iSCSI 都源于 SCSI 协议，它们共享相似的特性，但有一个重要的区别——iSCSI\
  \ 运行在标准传输控制协议（TCP）流量之上，并可以与数据共享相同的 IP 网络。\n\n![tip.eps](img/tip_fmt.jpeg) 提示：仅仅因为\
  \ iSCSI 可以与数据的网络上运行并不意味着这是一个好主意。大多数 iSCSI 实现使用一组专用的物理交换机，这些交换机通常由网络管理员和存储管理员共同管理。iSCSI\
  \ 的需求通常比标准网络流量更高，并且可能需要特殊的设计考虑。许多 iSCSI 实现失败仅仅是因为将其放在了与数据流量相同的网络上。\n\n### 理解 Internet\
  \ SCSI 命名\n\niSCSI 使用许多与 FC 相同的概念和名称，例如 `initiator`（发起器）和 `target`（目标）。然而，因为 iSCSI\
  \ 运行在普通的 IP 网络上，它为连接使用了特定的名称，称为 iSCSI 名称 (`IQN`)。\n\nIQN 包含大量信息以确保其唯一性，它对人类来说通常很奇怪。IQN\
  \ 的示例是 `iqn.1998-01.com.vmware:localhost-60fc871a`，它包含了使用 iSCSI 连接的机构的反向域名（此处为 `com.vmware`）、该机构注册域名系统（DNS）名称的日期（例如\
  \ `1998-01`），以及由命名机构定义的某些，通常包括一个设计为唯一的数字。\n\n### 比较硬件与软件 iSCSI 发起器\n\nvSphere 同时支持基于硬件和软件的发起器。硬件发起器在\
  \ vSphere 软件之外建立到 iSCSI 目标的连接。软件发起器位于 vSphere 虚拟机内核内部。通常，像大多数事物一样，硬件发起器的性能可能更好，但它们没有那么容易配置。然而，性能差距在\
  \ vSphere 中几乎消失，因为它可以利用网络接口卡（NIC）内置的任何硬件加速。\n\n那么，为什么要使用硬件发起器呢？为了让你从 iSCSI SAN 启动主机，或者在你没有或无法配置\
  \ `vSwitch` 时，允许 iSCSI 虚拟机内核流量通过。硬件发起器显示为存储适配器，其配置方式与软件发起器相同。\n\n### 在 vSphere 主机上启用\
  \ iSCSI 发起器\n\n要使用 iSCSI 软件发起器，你首先一个连接到具有上行链路的可用 `vSwitch` 的 `VMkernel` 端口。有关如何操作的信息，请参考第\
  \ 11 章。\n\n通常，你希望为 iSCSI 流量专用物理 NIC，因为像存储一样，vSphere 对连接掉线的容忍度较低。要要配置 iSCSI 发起器：\n\
  \n1. 在 vSphere Client 中点击你想要配置的主机的`Configuration`选项卡；然后点击位于内容面板左侧面板面板 `Storage Adapters`。\n\
  2. 在 `Storage Adapters` 面板中，选择 iSCSI 软件适配器，并点击详细面板中的 `Properties` 链接。\n\niSCSI 发起器（iSCSI\
  \ 软件适配器）属性窗口出现，如图 12-4 所示。\n\n3. 点击 `Configure`。\n\n出现一个常规属性对话框，如图 12-5 所示。\n\n\
  4. 在 `Status` 框中勾选 `Enabled` 复选框，然后点击 `OK`。\n\nvSphere 需要一点时间来计算 IQN。你可以通过点击 `Configure`\
  \ 来更改此 IQN。你还可以更改 iSCSI 别名，这是一种用于描述连接的信息性名称。\n\n现在主机上已启用 iSCSI 软件发起器。\n\n**图 12-4：**\
  \ iSCSI 发起器。\n\n![9780470768723-fg1204.eps](img/9780470768723-fg1204_fmt.jpeg)\n\
  \n**图 12-5：** 常规属性对话框，可以在此处启用 iSCSI。\n\n![9780470768723-fg1205.eps](img/9780470768723-fg1205_fmt.jpeg)\n\
  \n### 配置 iSCSI 服务器的动态发现\n\n大多数实现使用动态发现。动态发现是指发起器询问目标服务器有哪些可用的目标。此功能允许实现类似于 FC 的\
  \ iSCSI 动态实现。\n\n1. 在 vSphere Client 中点击你想要配置的主机的`Configuration`选项卡；然后点击位于内容面板左侧面板的\
  \ `Storage Adapters`。\n2. 在 `Storage Adapters` 面板中，选择 iSCSI 软件适配器设备，并点击详细面板中的 `Properties`\
  \ 链接（参考图 12-4）。\n\n3. 点击 `Dynamic Discovery` 卡。\n4. 点击 `Add`。\n\n打开添加发送目标服务器对话框，如图\
  \ 12-6 所示，你可以在此处配置 iSCSI 服务器。\n\n5. 输入 iSCSI 服务器的 DNS 名称或 IP 地址。\n\n请记住，如果 iSCSI\
  \ 解决方案运行在专用隔离网络上，DNS 名称可能无效。\n6. 点击 `OK` 关闭对话框并启用动态发现。\n7. 在 iSCSI 发起器属性窗口中点击 `Close`。\n\
  8. 如果 vSphere 客户端提示重新扫描主机总线适配器，点击 `Yes`。\n\n\n\n\n发现的目标会出现在 `iSCSI Software Adapter`\
  \ 设备的 `Details` 面板中。\n\n**图 12-6：** 添加发送目标服务器对话框和 `iSCSI Initiator`（`iSCSI Software\
  \ Adapter`）属性窗口。\n\n![9780470768723-fg1206.eps](img/9780470768723-fg1206_fmt.jpeg)\n\
  \n设置`Dynamic Discovery`（动态发现）后，若要重新扫描，请遵循本章前面的“将逻辑单元连接到 vSphere 主机”节中的步骤。由于 `iSCSI`\
  \ 和 `FC` 都基于 SCSI 协议，步骤相同且工作方式也相同。\n\n添加更多 `iSCSI` 存储与添加更多 `FC` 存储类似。在使目标可用后，请记得重新扫描，当在\
  \ `configuration` 选项页的 `Storage Adapters` 面板中选择 `iSCSI Software Adapter` 时，您应该在\
  \ `Details` 面板中看到它。\n\n### 避免常见的配置错误\n\n大多数配置错误与阵列的实际配置有关。如果您没有看到预期的磁盘，请确保阵列已将其设为可用并检查任何\
  \ `iSCSI` 安全设置。\n\n由于 `iSCSI` 可以在普通网络上运行，可能存在端口过滤或防火墙。为了获得最高性能，最好确保 `initiator`（发起器）和\
  \ `target`（目标）位于同一个子网，这样流量就不经过路由器。\n\n### 准备基于 LUN 的 SAN 存储首次使用\n\n基于 LUN 的存储是连接到\
  \ `vSphere` 的磁盘。`vSphere` 并不知道它是在存储网络上还是本地磁盘上。要使用任何基于 LUN 的存储，您需要在在使用之前先用 `VMFS`\
  \ 对其进行格式化。\n\n在 `Storage Adapters` 面板中选择 `HBA` 时，`vSphere Client` 在 `Details` 面板中显示存储。要查看实际磁盘，请确保选择了\
  \ `Details` 面板中的 `Devices` 按钮。您可能会看到多个设备，因此 `vSphere` 允许您通过多个项目进行排序，包括 `Type` 或\
  \ `LUN`。\n\n### 创建新的 VMFS 卷\n\n仅仅确认 `vSphere host` 看到存储可能无法让您达到目标。为了实际使用该数据存储，您需要用\
  \ `VMFS` 文件系统对其进行格式化：\n\n1. 打开 `vSphere Client` 并导航到您想要创建 `VMFS` 卷的主机的 `Configuration`\
  \ 选项页。\n\n![warning_bomb.eps](img/warning_bomb_fmt.jpeg) 本章中的大多数步骤必须在您想要与该存储一起使用的每个主机上执行。某些操作（例如实际格式化\
  \ `LUN`）应仅在其中一个主机上执行。如果您格式化并重新格式化 `LUN` 且没有在数据存储上放置任何 VM，则数据不会丢失。但是，如果您在数据存储上放置了\
  \ VM 后进行格式化，它们将被擦除且无法恢复。\n\n2. 转到 `Storage` 面板并点击 `Add Storage`。\n\n出现的向导程序将引导您创建数据存储。\n\
  \n3. 选择 `Disk/LUN` 并点击 `Next`。\n\n打开 `Select Disk/LUN` 页面。`Disk/LUN` 用于 `VMFS`。另一个选项\
  \ `Network File System`（网络文件系统）用于 `NAS` 设备。\n\n4. 选择您要使用的 `Disk` 或 `LUN` 并点击 `Next`。\n\
  \n打开 `Current Disk Layout` 页面。为了防止数据丢失，默认情况下，`vSphere` 只显示尚未具有 `VMFS` 的 `LUNs`，如图\
  \ 12-7 所示。\n\n5. 检查建议的布局并点击 `Next`。\n\n打开 `Properties` 页面。在这里，您必须输入一个数据存储名称。\n\n\
  6. 输入数据存储名称并点击 `Next`。\n\n数据存储名称应标识 `target` 和 `disk`。请记住，即使您从小规模开始，随着您的 `vSphere`\
  \ 占的增长，您可能会有一许多数据存储。点击 `Next` 后，会出现 `Disk/LUN Formatting` 页面。\n\n7. 选择块大小并点击 `Next`。\n\
  \n在这里，使用下拉菜单选择 `2048GB`、`Block Size: 8MB`，如图 12-8 所示。确保选中了 `Maximize Capacity`，以便\
  \ `vSphere` 将整个 `LUN` 用于 `VMFS`。点击 `Next` 后，会出现 `Ready to Complete` 页面。\n\n8. 检查您的选择并点击\
  \ `Finish`。\n\n新的数据存储显示在 `Storage` 面板的 `Datastores` 视图中。如果您有多个服务器访问该 `LUN`，您可能需要在这些主机上点击\
  \ `Rescan All`，以便它们看到该数据存储。\n\n![tip.eps](img/tip_fmt.jpeg) `Storage` 面板让您可以轻松测试对新卷的访问。您可以右键点击数据存储名称并选择\
  \ `Browse Datastore`。打开允许查看数据存储上对象的 `Datastore Browser`。由于您刚刚创建了数据存储，您会发现新数据存储应该是空的。您可以点击菜单栏上的文件夹图标创建一个新文件夹，并确认您对该卷具有读写权限。\n\
  \n**图 12-7：** 仅显示没有 `VMFS` 的 `LUNs`，位于 `Select Disk/LUN` 页面。\n\n![9780470768723-fg1207.eps](img/9780470768723-fg1207_fmt.jpeg)\n\
  \n**图 12-8：** 在 `Disk/LUN Formatting` 页面中使用 `8MB` 的块大小。\n\n![9780470768723-fg1208.eps](img/9780470768723-fg1208_fmt.jpeg)\n\
  \n### 启用存储 I/ 控制 (SIOC)\n\n在 vSphere 4.1 中，对于基于 LUN 的存储，可以启用 `Storage/Output Control`（SIOC）。这项新功能通过确保公平访问在数据存储级别实现更好的性能。在启用\
  \ `SIOC` 之前，一个主机可能会独占 `LUN`。\n\n启用 `SIOC` 的步骤如下：\n\n1. 登录 `vSphere Client` 并导航到主机的\
  \ `Datastores` 视图。\n\n`Datastores` 视图位于 `Inventory` 页面。`Datastores` 视图包含 vCenter\
  \ 可知的所有数据存储。\n\n2. 选择要启用 `SIOC` 的数据存储。数据存储必须是带有 `VMFS` 的本地、`iSCSI` 或 `FC` 设备。\n\n\
  3. 点击数据存储的 `Configuration` 选项卡。`Configuration` 选项卡显示数据存储的各种详细信息。\n\n4. 点击 `Datastore\
  \ Details` 中的 `Properties`。打开 `Properties` 窗口如图 12-9 所示。此框的名称取决于您对数据存储的命名。注意 `Properties`\
  \ 链接位于内容区域的右侧。\n\n5. 在 `Storage I/O Control` 下选择 `Enabled`。\n\n6. 点击 `Close`。这些步骤启用默认阈值为\
  \ 30 毫秒的 `SIOC`，这意味着如果 `LUN` 服务达到 30 毫秒或更高，`SIOC` 将平衡访问，防止一个 VM 独占。\n\n**图 12-9：**\
  \ `datastore Properties` 窗口包含数据存储的信息并允许您启用 `SIOC`。\n\n\n\n\n此外，DNS 通常用于 NFS 连接，并且某些安全设置也需要它。vSphere\
  \ 利用 TCP 上的 NFS 3 版本，并且必须以 root 权限挂载 NFS 导出。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 由于 vSphere 需要访问 NFS 的 root 权限，因此您需要在提供导出的服务器上配置 root 权限。默认情况下，大多数平台未启用 NFS 的 root\
  \ 权限。在大多数类 Unix 系统中，您需要在导出时使用 `no_root_squash` 参数标记该导出。\n\n## 在 vSphere 中挂载 NFS\
  \ 导出\n\n在可以托管 NFS 导出的系统中，您需要选择想要导出的目录，并按照特定操作系统的说明进行操作。NFS 使用基于 IP 地址的安全机制，因此将导出限制在您将用于访问\
  \ NFS 的 VMkernel IP 地址是明智的。\n\n在导出目录后，您需要在每台 vSphere 主机上挂载它，请按照以下步骤操作：\n\n1. 打开\
  \ vSphere Client 并导航到您想要添加存储的主机的 `Configuration`（配置）选项卡。\n2. 转到 `Storage`（存储）面板并点击\
  \ `Add Storage`（添加存储）。\n\n出现 `Add Storage` 向导。与在 LUN 上创建数据存储一样，此向导将引导您创建数据存储。\n\n\
  3. 选择存储类型为 `Network File System`（网络文件系统）并点击 `Next`（下一步）。\n\n显示 `Locate Network File\
  \ System`（定位网络文件系统）向导页面。在这里，您输入要使用的 NFS 存储的位置和名称。\n\n4. 在 `Server`（服务器）字段中输入服务器名称。\n\
  \n在图 12-10 中，请注意向导提供了一些有效表示法的示例。取决于您的环境和规范，使用 DNS 或 IP 地址均可。\n\n**图 12-10：** Add\
  \ Storage 向导的 Locate Network File System 页面。\n\n![9780470768723-fg1210.eps](img/9780470768723-fg1210_fmt.jpeg)\n\
  \n5. 在 `Folder`（文件夹）字段中输入导出名称。\n\n此名称必须以斜杠开头，并且应该是向导出的完整路径。该路径必须允许 root 挂载并且对大小写敏感。与\
  \ iSCSI 和 FC 一样，命名在 NFS 中非常重要。最好选择一个具有描述性且简短的名称。因为使用 NFS 时您可能有多个服务器导出文件系统，因此记录提供导出的服务器和卷号是一个好主意。\n\
  \n6. 取消勾选 `Mount NFS Read Only`（只读模式挂载 NFS）。\n7. 为数据存储命名并点击 `Next`（下一步）。\n8. 检查设置并点击\
  \ `Finish`（完成）。\n\n向导将 vSphere 主机连接到数据存储，这可能需要几分钟。\n\n一个集群中最多可以有 64 个 NFS 数据存储。NFS\
  \ 数据存储没有 VMFS 的文件系统限制，因此数据存储可以更大。然而，将它们稍微分开是明智的，这样您可以独立地排查数据存储的问题。要添加额外的数据存储，只需按照上述相同的步骤操作即可。\n\
  \n### 避免常见的配置错误\n\n设置 NFS 时最常见的问题是导出路径错误。在输入文件夹信息时必须完全准确。由于导出路径对大小写敏感，很容易出现拼写错误。为了确保准确性，请与组织中管理\
  \ NAS 系统的人员密切配合。\n\nNFS 运行还需要一些外围服务，例如 `portmapper` 和远程过程调用（Remote Procedure Call）服务。确保这些服务已启用且没有被任何网络设备拦截。\n\
  \n## 第 13 章：组装 ESX 集群\n\n## 本章\n\n![arrow](img/arrow.png) 为 vSphere 集群组装做好准备\n![arrow](img/arrow.png)\
  \ 构建集群\n![arrow](img/arrow.png) 启用分布式资源调度器\n\n当由 vCenter Server 管理时，您可以将 VMware\
  \ ESX 主机放入集群配置中。ESX 集群是 vSphere 可用性功能的基础，例如高可用性 (HA)、分布式资源调度器 (DRS) 和容错性 (FT)。在\
  \ vSphere ESX 主机之间共享资源（如存储和网络）是 VMware ESX 集群的关键，当操作正确时，构建 VMware ESX 集群将是一件易事。\n\
  \n本章将引导您设置 ESX 集群。您将发现保持集群内主机之间一致性的重要性。您将在 vCenter Server 中创建 ESX 集群。创建集群后，向其中添加\
  \ ESX 主机。\n\n### 保持配置一致\n\n集群是具有共同资源（如共享数据存储和网络连接）的主机的逻辑分组。配置 ESX 集群时需要记住的最重要点是一致性。理想情况下，虚拟机可以迁移到集群中的任何其他主机，而无需更改配置。这种情况只有在虚拟机新家园的属性与其之前的属性匹配时才会发生。\n\
  \n#### 网络命名\n\n虚拟机上的每个虚拟网络接口（`vNIC`）都必须与一个端口组（port group）关联。当管理员选择端口组时，端口组的标签或网络名称将显示下拉列表中。该名称随后存储在虚拟机的配置文件。当虚拟机迁移到另一台\
  \ ESX 主机时，ESX 会尝试将虚拟机配置文件中的网络名称与新 ESX 主机上同名的端口组进行匹配。如果没有找到匹配项，则虚拟机的网络接口将保持断开状态，直到管理员手动将其与新的网络名称关联。\n\
  \n由于虚拟机依赖于端口组的名称，因此在集群的所有 ESX 主机上保持端口组命名和配置一致至关重要。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 每个端口组可以关联或不关联虚拟局域网 (`VLAN`)。在配置每个端口组时，确保集群中每个主机上的网络名称和 VLAN ID 相同。\n\n#### 相同的数据存储，相同的名称\n\
  \n当 vSphere 在共享 iSCSI 或光纤存储上创建新的 VMware 文件系统 3 (`VMFS-3`) 卷时，它会在数据存储中写入唯一标识符。将卷添加到集群中的\
  \ ESX 主机时，只要每台主机都能访问包含卷的存储阵，卷就会自动添加到集群中的其他主机。\n\n您必须手动将 NFS 共享添加到 ESX 主机，并必须对集群中的每个\
  \ ESX 主机重复此过程。类似于 vSphere 通过名称映射虚拟机到网络的方式，vSphere 也通过主机名称和友好名称映射 ESX 主机到 NFS 数据存储。即使集群中的两个不同的\
  \ ESX 主机访问同一个 NFS 卷，它们的友好名称和主机名称也匹配，否则将被视为不同的卷。\n\n为了避免这种情况，请按照以下步骤操作：\n\n![check.png](img/check.png)\
  \ 主机名称：添加 NFS 数据存储时，ESX 要求 NFS 存储设备的主机名称或网络地址。对集群中的每个主机使用相同的值，不要将 IP 地址与主机名混合使用，否则数据存储将被视为不同的。\n\
  \n![check.png](img/check.png) 数据存储名称：在向 ESX 主机添加 NFS 数据存储时，会提示您为挂载的卷指定一个名称。集群中每个\
  \ ESX 主机上的此名称必须相同，否则每个变体都被视为不同的。\n\n#### 相同的访问权限，不同的主机\n\n\n\n\n\n仅仅因为 ESX 主机的配置相同，并不意味着它们都能访问相同的网络或存储资源。在理想世界中，构成\
  \ ESX 集群的主机应该一次性部署和配置。每个主机的交换机端口将同时进行配置，并且所有共享存储将同时提供给主机。遗憾的是，并不是所有人都有这种优条件，随着虚拟化需求的增长，主机会被不断添加到\
  \ ESX 集群中。每当添加一个 ESX 主机时，该主机的网络交换机端口连接或存储设置可能与其他主机不同。为了防止这种情况，请务必确认以下内容：\n\n![check.png](img/check.png)\
  \ **VLAN**：面向客户中其他 ESX 主机的所有 VLAN 也应提供给新的 ESX 主机。\n\n![check.png](img/check.png)\
  \ **存储 ACL**：大多数基于网络的存储阵列将其默认访问控制列表 (`ACL`) 设置为拒绝所有源的访问。确认新 ESX 主机的网络地址已在“接受”列表中。\n\
  \n![check.png](img/check.png) **连接到正确交换机端口的网络适配器**：这似乎是常识，但你很容易不小心交换网络连接。某些刀片服务器的网络互连并不直观，这更容易将刀片服务器的网络适配器映射到错误的连接上。\n\
  \n# 邀请 ESX 主机加入集群\n\n由于集群中的所有成员主机都是相同的，位于该集群的虚拟机可以运行在集群中的任何主机上。这种情况允许管理员将虚拟机迁移到其他主机以重新分配负载，或者在原始主机不可用时在其他处重启虚拟机。\n\
  \n## 创建集群\n\n集群是由 `vCenter Server` 管理的 vSphere 功能。在将任何 ESX 主机添加到集群之前，必须在 `vCenter\
  \ Server` 中定义主机集群。\n\n按照以下步骤在 vSphere 数据中心中创建新的主机集群：\n\n1. 使用 `vSphere Client` 连接到\
  \ `vCenter Server`。\n   主页的 `Inventory` 面板会出现，并显示 `Summary` 选项卡。\n2. 在清单树中，右键点击相应的数据中心，然后选择\
  \ `New Cluster`。\n   出现 `New Cluster Wizard`，如图 13-1 所示。\n   **图 13-1：**`New Cluster\
  \ Wizard` — 集群功能。\n   ![9780470768723-fg1301.tif](img/9780470768723-fg1301_fmt.jpeg)\n\
  3. 在 `Name` 字段中输入新集群的名称。\n   该值出现在 `vCenter Server` 清单树中。\n4. 点击 `Next`。\n   出现\
  \ VMware 增强 vMotion 兼容性 (`EVC`) 设置页，如图 13-2 所示。\n   **图 13-2：** VMware `EVC` 设置页。\n\
  \   ![9780470768723-fg1302.tif](img/9780470768723-fg1302_fmt.jpeg)\n5. 点击 `Next`。\n\
  \   出现 `Virtual Machine Swapfile Location` 对话框，如图 13-3 所示。\n   **图 13-3：** `Virtual\
  \ Machine Swapfile Location` 页面。\n   ![9780470768723-fg1303.tif](img/9780470768723-fg1303_fmt.jpeg)\n\
  6. 点击 `Next`。\n   出现 `New Cluster Wizard` 摘要页，如图 13-4 所示。\n   **图 13-4：** `New Cluster\
  \ Wizard` 摘要页。\n   ![9780470768723-fg1304.tif](img/9780470768723-fg1304_fmt.jpeg)\n\
  7. 点击 `Finish`。\n   新集群现在已创建。\n\n## 将 ESX 主机添加到集群\n\n创建集群后后，你可以添加 ESX 主机。按照以下步骤将\
  \ ESX 主机添加到集群：\n\n1. 使用 `vSphere Client` 连接到 `vCenter Server`。\n   主页的 `Inventory`\
  \ 面板会出现，并显示 `Summary` 选项卡。\n2. 选择你想要添加到集群的 ESX 主机。\n   `Summary` 选项卡中会出现所选主机的摘要。\n\
  3. 要将 ESX 主机添加到集群，点击并将其拖动到集群。\n   ![tip.eps](img/tip_fmt.jpeg) ESX 主机必须处于维护模式才能从集群中移除。\n\
  \   ![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 当向启用 `DRS` 的集群添加带有资源池的 ESX\
  \ 主机时，`vCenter` 会询问你如何将它们映射到集群中定义的资源池。`vCenter` 询问此是因为为集群定义的资源池映射到集群中的所有主机，而为单个主机定义的资源池未考虑其他主机的资源。\n\
  \n# 使用分布式资源调度器 (DRS) 分享负载\n\nvSphere 的另一个功能是分布式资源调度器 (`DRS`)。此功能允许管理员设置定义集群中虚拟机位置和优先级的规则。`DRS`\
  \ 通过负载均衡和相关性规则等功能为 ESX 集群带来了智能。这些功能旨在帮助你优化 vSphere 环境，同时考虑了操作策略。\n\n`DRS` 提供了三个级别的自动化：\n\
  \n![check.png](img/check.png) **手动**：`vSphere` 就集群中用于启动虚拟机的最佳主机提供建议。`vSphere` 就集群成员之间的虚拟机迁移提供建议。\n\
  \n![check.png](img/check.png) **部分自动**：`vSphere` 自动选择集群中的最佳主机来启动虚拟机。`vSphere` 就集群成员之间的虚拟机迁移提供建议。\n\
  \n![check.png](img/check.png) **全自动**：`vSphere` 自动选择集群中的最佳主机来启动虚拟机。`vSphere` 根据其建议自动执行虚拟机迁移。\n\
  \n自动化级别可以按虚拟机进行设置，以覆盖集群设置，这对于不符合常规的虚拟机非常有用。\n\n## 保持虚拟机隔离\n\n现代计算经常通过冗余来使用“可用性”概念，即使用两个或多个能够执行相同任务的系统，但每个系统都有独特的身份。最常见的例子是\
  \ Windows Active Directory (`AD`) 域控制器，它用于验证登录到域资源的用户。两个或多个 AD 控制器定期同步数据，允许基于 Windows\
  \ 的系统对任何一个域控制器进行身份验证。这种冗余性是建立在至少有一个域控制器始终可用的假设之上。\n\n虽然极不可能发生，但考虑一种场景：所有的域控制器都是运行在集群中单个\
  \ ESX 主机上的虚拟机。如果 ESX 主机发生故障，运行在该 ESX 主机上的域控制器也会故障，导致域中的用户无法登录他们的机器。缓解这种风险的方法是将域控制器保持在单独主机上，以限制\
  \ ESX 主机故障的影响。\n\n`DRS` 喜欢在 ESX 主机之间优化负载。遗憾的是，它不知道将某些虚拟机（如域控制器）保持在不同主机以降低风险的重要性。当\
  \ `DRS` 在全自动模式下运行时，管理员永远不会被询问如果两个特定的虚拟机放在一起会发生什么。为了在获得 `DRS` 处的同时而不引入单点故障风险，`DRS`\
  \ 提供了一组规则来指示哪些虚拟机应该在一起，哪些虚拟机应该分开。这些规则被称为虚拟机间相关性规则。\n\n设置规则将冗余虚拟机保持在不同的主机上是缓解单机故障风险的好方法。这种配置对于大多数\
  \ ESX 主机是足够的，但它没有考虑到影响一组服务器的事件。刀片服务器在刀片机箱内共享公共电源，这意味着机箱故障将同时关掉机箱内的所有刀片服务器。\n\n\n\
  \n\n您可以通过使用虚拟机-主机亲和性（VM-Host affinity）来限制重大故障（例如刀片机箱故障）的影响。`VM-Host`亲和性允许管理员将虚拟机分配给特定的主机。如果\
  \ ESX 集群跨越多个机箱的主机，DRS 可以让虚拟机连接到多个机箱的主机，从而消除另一个单点故障。\n\n## 在集群上启用 `DRS`\n\n根据 VMware\
  \ 最佳实践，在添加主机后，应在集群上启用 `DRS`。请遵循以下步骤操作：\n\n1. 使用 vSphere Client 连接到 vCenter Server。\n\
  出现清单面板（Inventory panel）。\n\n2. 在清单树中，右键点击相应的项目并选择“编辑设置”（Edit Settings）。\n超级集群设置对话框（图\
  \ 13-5）。\n\n3. 若要启用 [DRS]，请勾选“启用”（Turn On）复选框。\n\n\n\n\n\nvSphere 提供四种 SCSI 控制器：`BusLogic\
  \ Parallel`、`LSI Logic Parallel`、`LSI Logic SAS` 和 `VMware Paravirtual`。大多数情况下，`BusLogic`\
  \ 和 `LSI Logic` 控制器的性能没有区别，通常选择取决于虚拟机所用操作系统的原生驱动程序可用性。半虚拟化 SCSI (`PVSCSI`) 控制器的行为则有所不同。对于对磁盘性能有极高要求的虚拟机，`PVSCSI`\
  \ 可能会比其他 SCSI 适配器更快。然而，`PVSCSI` 仅适用于少数操作系统，而且除非你从虚拟机传输大量数据，否则它并无帮助。一个虚拟机最多可以有四个\
  \ SCSI 控制器，并遵循标准的 SCSI 规则，因此每个控制器最多可有 15 个 SCSI 设备。\n\n![check.png](img/check.png)\
  \ 硬盘：如今大多数系统都需要硬盘，但 vSphere 并不并不。例如，如果你正在测试运行版 CD，可能会移除硬盘。你可以为每个 SCSI 控制器添加多个磁盘。\n\
  \n![check.png](img/check.png) 以太网适配器：所有新创建的虚拟机都带有以太网适配器，但它们并不需要。vSphere 支持六种以太网适配器，你可以在虚拟机中拥有最多十个适配器。\n\
  \n![check.png](img/check.png) Vlance：`Vlance` 是一种旧的适配器，用于模拟 AMD 网络接口卡 (NIC)。较旧的操作系统拥有\
  \ `vlance` 的驱动程序，但该适配器的性能没有其他可用适配器那么好。该适配器仅适用于 x86 系统。\n\n![check.png](img/check.png)\
  \ E1000：该适配器在虚拟机操作系统看来是一个 Intel `E1000` 适配器。Intel `E1000` 是一种常见的适配器，因此许多现代操作系统都支持它。\n\
  \n![check.png](img/check.png) VMXNET：该适配器为 VMware 设计并经过了优化。它比 `Vlance` 适配器快。要使用\
  \ `VMXNET`，你必须安装 `VMware Tools` 以获得相应的驱动程序。\n\n![check.png](img/check.png) Flexible：该适配器识别自己为\
  \ `Vlance` 适配器，但如果安装了 `VMware Tools`，它的功能更像 `VMXNET`。Flexible 适配器消除了安装 `Vlance`\
  \ 适配器、安装操作系统然后将 `Vlance` 替换为 `VMXNET` 的需要。\n\n![check.png](img/check.png) VMXNET\
  \ 2 (增强型)：该适配器是 `VMXNET` 适配器的较新版本。它仅适用于常见的操作系统，并且需要 `VMware Tools`。该适配器支持硬件校验和卸载和巨型帧。\n\
  \n![check.png](img/check.png) VMXNET 3：该适配器是虚拟机可用性能最高的适配器，是 `VMXNET 2` 的超集。它支持额外的性能功能，例如接收端缩放\
  \ (RSS) 和额外的校验卸载。与所有 `VMXNET` 适配器一样，`VMXNET 3` 要求操作系统中安装 `VMware Tools`，并且仅支持少数操作系统，即\
  \ Microsoft Windows 和某些 Linux 发行版。\n\n![check.png](img/check.png) CD/DVD 驱动器：CD/DVD\
  \ 驱动器是你可以用于安装操作系统或应用程序的光学盘。如果你在虚拟机上有 CD/DVD 驱动器，你可以选择将其连接到物理驱动器设备。在具有 CD 或 DVD 数据数据镜像的情况下，你可以将其连接到虚拟机，虚拟机将将其视为原生\
  \ CD/DVD 设备。你可以使用 `vSphere Client` 在主主机或客户端上连接 CD/DVD 驱动器。CD/DVD 驱动器是只读设备，不能刻录 CD\
  \ 或镜像。该驱动器是标准的 IDE 设备，虚拟机有一个 IDE 控制器和最多四个 IDE 设备。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\n\
  \n### 半虚拟化硬件\n\n虚拟硬件包含在配置文件中。然而，即使是 VMware 也知道某些功能通过硬件提供服务更好。为了适应这一点，vSphere 支持半虚拟化硬件。半虚拟化是指以与虚拟化一致的方式向虚拟机提供设备，但该设备也能够利用底层硬件的能力。`VMXNET\
  \ 3` 适配器就是一个例子。许多现代网卡具有加速芯片以实现更好的吞吐量，`VMXNET 3` 适配器允许虚拟机利用这些某些功能，例如 TCP 校验和卸载。\n\
  \n![tip.eps](img/tip_fmt.jpeg) 配置虚拟机仅拥有它真正需要的设备总是明智的，但在需要时你也应该只连接可移动设备，例如 CD/DVD\
  \ 驱动器和软磁盘设备。保持驱动器连接可能会影响在 vSphere 集中移动虚拟机的能力，从而影响 DRS 和维护模式。\n\n以下设备没有像前面的设备那样常用，但在特定需求情况下也可以配置。\n\
  \n![check.png](img/check.png) 软磁盘驱动器：出于某种原因，这仍然每个虚拟机中的默认设备，尽管今天大多数物理服务器没有软磁盘驱动器，且该设备很少使用。软磁盘驱动器仍然有用，但许多\
  \ vSphere 管理员会移除此设备。虚拟机可以有一个软磁盘控制器和最多两个软磁盘驱动器。软磁盘设备在操作系统安装过程早期安装驱动程序可能很有用，但许多管理员简单地将相应的驱动程序添加到安装媒体中。\n\
  \n与 CD/DVD 驱动器类似，你可以将其连接到物理设备或镜像，这是从服务器或客户端进行的。与 CD 不同，软磁盘驱动器是可读写的。\n\n![check.png](img/check.png)\
  \ 并口：这允许将虚拟机映射到主主机上的端口，或者将数据输出到文件。此选项很少使用，但如果你有一个需要访问并口的应用程序，它可能很有帮助。你可以配置虚拟机最多三个并口。\n\
  \n![check.png](img/check.png) 串口：像并口一样，串口的使用在大多数组织中也不常见。如果你必须将如 UPS 的设备映射到虚拟机，串口可能有用。你可以将其映射到主主机上的端口、文件、命名管道，甚至通过网络映射到虚拟端口集中器\
  \ (`VSPC`)。像大多数配备串口的 PC 一样，虚拟机最多可以有四个串口。\n\n![check.png](img/check.png) USB 控制器：通用串行总线\
  \ (`USB`) 控制器连接 USB 设备所必需。该控制器没有配置项，但如果你想让虚拟机访问连接到主机的 USB 设备，则它必须存在。虚拟机只能有一个 USB\
  \ 控制器。\n\n![check.png](img/check.png) USB 设备：这是到主主机上物理 USB 设备的连接。你需要 `USB 控制器` 来连接\
  \ `USB 设备`，你可以向控制器连接最多二十个设备。通过适当的组件，USB 设备可以被重定向，使得使用 USB 的虚拟机仍然可以使用 vMotion 进行移动，这对于需要硬件密钥的程序特别有用。\n\
  \n![check.png](img/check.png) SCSI 设备：这允许虚拟机直接访问连接到主机的 SCSI 设备。\n\n![check.png](img/check.png)\
  \ PCI 设备：`VMDirectPath` 是 vSphere 的一项非常高级的功能，允许虚拟机直接访问外围连接接口 (`PCI`) 设备。要使用它，主机必须对应的\
  \ CPU 支持特殊的虚拟化扩展，并且主机必须配置设备进行透传。这是一个新功能，可能对于非常特殊的应用程序很有帮助，例如卸载加密处理。\n\n许多这些不常用的设备不常用是有原因的：它们通常引用物理设备。将虚拟机映射到这些物理设备会导致在主机之间移动虚拟机的问题，因此请谨慎使用此设备。所以，请仅将这些设备作为最后手段，因为它们会对虚拟化基础设施的设计和收益产生不利影响。\n\
  \n### 填充虚拟容器\n\n\n\n\n你可以创建一个虚拟机（VM）并在其上安装操作系统，或者由于虚拟机仅仅是一组文件，你可以对现有的虚拟机进行复制。\n\n\
  ## 从头构建虚拟机\n\n各种规模的组织都能从复制虚拟机中受益，但在执行此操作之前，你需要一个可以复制的虚拟机。要做到这一点，你需要创建一个基础虚拟机。要创建虚拟机，请遵循以下步骤：\n\
  \n1. 打开并登录 `vSphere Client` ，并导航到 `Hosts and Clusters`（主机和集群）。\n\n2. 右键点击可以包含虚拟机的对象，例如\
  \ `host`（主机）、`cluster`（集群）或 `datacenter`（数据中心），并选择 `New Virtual Machine`（新建虚拟机）。\n\
  \n打开“新建虚拟机”向导。该向导将引导你完成虚拟机的创建。\n\n3. 选择 `Typical`（典型）并点击 `Next`（下一步）。\n\n“新建虚拟机”向导提示选择\
  \ `Typical` 配置或 `Custom`（自定义）配置。`Typical` 包含了 `VMware` 的建议，通常是入门选择。`Custom` 允许你覆盖建议，适用于根据应用程序需求定制虚拟机。使用自定义配置时，你可能会设置一个无法运行的虚拟机，因此最好确保你已根据操作系统和应用程序供应商研究过你选择的设置。\n\
  \n出现 `Name`（名称）和 `Location`（位置）页面。\n\n4. 为虚拟机命名，选择位置，并点击 `Next`。\n\n理想情况下，你希望虚拟机名称和计算机名称匹配，但它们不必一致。通常你会选择默认位置，但如果你有多个数据中心，你可能需要在\
  \ `Inventory Location`（清单位置）面板中选择适当的数据中心。如果你在集群中定义了 `resource pools`（资源池）或 `VApps`，会出现\
  \ `Resource Pool` 页面。如果没有，将出现 `Datastore`（数据存储）页面，你可以跳到第 6 步。\n\n5. 选择要包含虚拟机的 `resource\
  \ pool` 并点击 `Next`。\n\n出现 `Datastore` 页面。\n\n`Resource Pool` 页面允许你选择想要将虚拟机放在哪个 `resource\
  \ pool` 中。`resource pools` 管理对 `CPU` 和 `memory` 的访问，并可能影响虚拟机的性能。第 19 章将深入介绍资源池。\n\
  \n6. 在 `Datastore` 页面中，选择要存储虚拟机的 `datastore` 并点击 `Next`。\n\n出现 `Guest Operating\
  \ System`（客户操作系统）页面。\n\n`Datastore` 页面列出了所有可用于虚拟机的 `datastores`。你可以通过窗口顶部的标题进行排序，管理员通常会按\
  \ `Free`（可用空间）标题排序，这会显示空间最大的数据存储。请特别注意 `Type`（类型）字段，以便知道你正在使用的是 `NFS` 还是 `VMFS`。\n\
  \n7. 选择 `Guest Operating System` 并点击 `Next`。\n\n出现 `Create a Disk`（创建磁盘）页面。\n\n\
  `Guest Operating System` 非常重要，因为在其中你决定了虚拟机可以使用硬件以及 `vSphere` 如何与虚拟机交互。选择操作系统后，请务必使用下拉菜单选择\
  \ `Version`（版本），如图 14-1 所示。在练习中，请使用 `Microsoft Windows Server 2003, Standard Edition\
  \ (32-Bit)`。\n\n**图 14-1：** “新建虚拟机”向导的“客户操作系统”页面。\n\n![9780470768723-fg1401.eps](img/9780470768723-fg1401_fmt.jpeg)\n\
  \n8. 指定虚拟磁盘大小，设置 `Thin Provisioning`（精简置备）或 `Fault Tolerance`（容错），并点击 `Next`。\n\n\
  出现 `To Complete`（完成）页面。\n\n*(注：原文在步骤中存在一些重复/重叠，我将根据提供的文本块保持逻辑流)*\n\n\n\n\n11. 在\
  \ `Display Properties` 控制面板中点击 `OK` 以关闭它。\n\n`Display Properties` 控制面板关闭。\n\n12.\
  \ 在 `Install Complete` 对话框中，点击 `Finish`。\n\n安装程序提示你重启。\n\n13. 点击 `Yes`。\n\n发生重启，`VMware\
  \ Tools` 在启动时加载。\n\n**图 14-3：** VMware Tools 安装设置类型屏幕，该屏幕为虚拟机安装驱动程序。\n\n![9780470768723-fg1403.tif](img/9780470768723-fg1403_fmt.jpeg)\n\
  \n# 文件中的计算机\n\n虚拟机（VM）是文件的集合，作为一个整体，它们构成了一台完整的计算机。通常，虚拟机最重要的部分是磁盘，因为它包含数据。\n\n磁盘的大小从\
  \ `1MB` 到略低于 `2TB` 不等，取决于 `datastore` 的设置。在创建磁盘时，如果 `datastore` 支持，`Create New Virtual\
  \ Machine`（创建新虚拟机）向导会询问你是否希望按需分配并提交空间。按需提交空间被称为 `thin provisioning`（弹性置备），这是一个需要仔细规划的有用功能。在\
  \ `vSphere` 的前身 `VMware ESX` 中，你无法使用 `thin provisioning`，`ESX` 总是预先全分配磁盘。其他 `VMware`\
  \ 产品可以按需增长，但为了保持高性能，`ESX` 并不会这样做。今天的磁盘阵比过去快得多，`VMware` 现在认为在某些情况下 `thin provisioning`\
  \ 是很有用的。\n\n精简置备的磁盘可能会发生过度分配。你可以拥有一个 `100GB` 的 `VMFS` datastore，其中包含五个虚拟机，每个虚拟机都有一个\
  \ `25GB` 的精简置备磁盘。只要这些 `25GB` 磁盘不同时增长，每个磁盘就可以缓慢增长。然而，如果操作系统尝试增大文件而 `VMware` 无法做到，那么该虚拟机以及该\
  \ `datastore` 上的其他虚拟机都可能失败。精简置备只有在你有适当计划来监控环境以及可预测的磁盘增长曲线时才有用。你可以在 `vSphere Client`\
  \ 中为磁盘空间设置告警。（有关告警的更多信息请参见第 16 章。）\n\n全分配磁盘通常被称为 `thick provisioned`（厚配置置备）。如果你不选择\
  \ `Allocate and Commit Space on Demand`，就会创建一个厚置备磁盘。这样做，`vSphere` 会在 `datastore`\
  \ 上分配空间，但不会将其置零。如果你选择 `Support Clustering Features Such As Fault Tolerance`（支持容错等集群功能）选项，`vSphere`\
  \ 将置零整个虚拟磁盘文件，这被称为 `eager zeroed thick`（预零厚置备）。这个过程对于 `ESX` 完成完成可能需要很长时间，通常只在集群或容错需要时才使用。\n\
  \n# 导入现有的虚拟机磁盘\n\n你可以通过创建一个新虚拟机并在 `Create New Virtual Machine` 向导配置页面（向导的第一页）中选择\
  \ `Custom Configuration`（自定义配置），创建一个使用现有磁盘文件的虚拟机。当你进入 `Select a Disk`（选择磁盘）对话框时，可以选择\
  \ `Use an Existing Virtual Disk`（使用现有虚拟磁盘）。如果你有一个虚拟磁盘并想围绕它构建虚拟机，或者在集群等特殊情况下，这种选择非常有帮助。\n\
  \n# 精简现有的虚拟磁盘\n\n精简置备是一项强大的功能，它通过只消耗磁盘上写入的内容来节省磁盘空间。如果你有一个服务器曾经很大，但现在不再消耗那么多磁盘了呢？你可以精简磁盘并释放底层\
  \ `datastore` 上的空间。\n\n要精简磁盘，你只需将磁盘迁移到不同的 `datastore` 并在目标位置选择为精简置备磁盘。\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ 在精简磁盘后，它可能比你希望的要。。记住，虚拟内存分页文件（也称为 `swapfile`）可能仍然在那里，而且许多操作系统在发生删除操作时不会完全删除磁盘上的数据。相反，它们只是将其从主文件表中移除，而将其保留在磁盘上。为了获得最佳效果，你应该先对空空间置零。每个操作系统置零空空间的方法不同，但在\
  \ Microsoft Windows 上，大多数人使用来自 `Microsoft Sysinternals` 的免费工具 `SDelete`。`SDelete`\
  \ 可在 http://technet.microsoft.com/en-us/sysinternals/bb897443 获取。\n\n# 引入克隆\n\n\
  当你需要制作物理服务器的完全相同副本或克隆时，你通常有一组非常复杂的任务。要制作此克隆，你需要完全相同的硬件、磁盘镜像程序、用于传输数据的适当磁盘或网络通信方式，以及一种将身份或网段与网络其余部分隔离开来的方法。在大多数情况下，使用\
  \ `vSphere`，创建克隆的耗时工作缩短到了几秒钟！\n\n在创建克隆时，最需要关注的是网络通信。即使你重命名了操作系统，应用程序也可能看不到系统已重命名，并使用源服务器的身份通过网络进行通信。\n\
  \n此外，克隆可能会占用大量磁盘空间，因此要适当使用。克隆将具有类似的资源占用，但你可以通过编辑虚拟机的属性来调整虚拟硬件。\n\n# 创建虚拟机的克隆\n\n\
  要创建克隆，只需在 `vSphere Client` 中右键点击虚拟机并选择 `Clone`（克隆）。出现 `Clone Virtual Machine` 向导，如图\
  \ 14-4 所示。\n\n1. 在向导的 `Name and Location` 页面为虚拟机提供名称并点击 `Next`。\n\n出现 `Host/Cluster`\
  \ 页面。\n\n**图 14-4：** `Clone Virtual Machine` 向导。\n\n![9780470768723-fg1404.tif](img/9780470768723-fg1404_fmt.jpeg)\n\
  \n![9780470768723-fg1404.eps](img/9780470768723-fg1404_fmt.jpeg)\n\n![warning_bomb.eps](img/warning_fmt.jpeg)\n\
  \n2. 选择克隆所在的位置并点击 `Next`。\n\n3. 选择包含克隆的资源池并点击 `Next`。\n\n4. 选择 `Datastore` 并点击 `Next`。\n\
  \n**图 14-5：** `Clone Virtual Machine` 向导的 `Datastore` 页面。\n\n![9780470768723-fg1405.eps](img/9780470768723-fg1405_fmt.jpeg)\n\
  \n5. 选择磁盘类型并点击 `Next`。\n\n6. 在 `Guest Customization` 对话框中，选择 `Do Not Customize`（不自定义）并点击\
  \ `Next`。\n\n7. 检查你的选择并点击 `Finish`。\n\n\n\n\n启动虚拟机电源的选项在您确信克隆不会干扰其它系统并希望它立即上线时非常有用。编辑虚拟硬件在需要将虚拟机与其它流量隔离时会特别方便。如果您有一个测试用虚拟局域网，可以在向导中修改克隆以使用该网络。\n\
  \n## 从模板部署\n\n克隆对于故障排除很有帮助，但如何用于部署呢？复制是快速配置新系统的一种方式。模板是为部署而设计的特殊源虚拟机。当您从模板部署 VM\
  \ 时，`vSphere`会克隆该模板并将其作为 VM 提供使用。多年来桌面和服务器工程师一直在为各种平台构建“黄金镜像”，而这正是本质如此。\n\n创建模板时应专门为其新建一个\
  \ VM 并进行相应配置，仅包含在每个系统中都会使用的软件。通常代理程序和防病毒程序会被纳入其中。像任何金映像一样，所有代理可能需要允许被复制的特殊设置，所以务必向相关供应商确认此类产品信息。\n\
  \n合理计划所需规格：通常情况下最好把目标定得比平常略低些，因为你始终可以根据需求后续增加资源。若有必要可以针对不同用途维护多份独立版本。当你准备转换至最终形态时可以有两种选择：\n\
  \n![check.png](img/check.png) **可执行以下操作:**  \n- `Clone to Template`:保留原来的状态不变；适合已建立单一场景随后扩展应用范围的场合，例如先搭建基础环境->生成备份继承继续改造原体。\n\
  - `Convert to Template`:直接对当前工作台施加标记使其升级成标准化分发件。这意味着配置文件内注明此特征无需提前制作副本，常适用于已经定型过后偶尔调整再还原的情形。操作方法是在\
  \ vCenter Client 中找到对应对象右键点击‘Template’→ ‘Convert…’。磁盘自动改为精简模式省空间。\n\n### 自动化自定义过程\
