  \ 4GB 限制。如果您正使用 Microsoft SQL Server 2005 Express 作为 vCenter Server 数据库，除非 VMware\
  \ 支持工程师指示如此，否则不要将统计收集级别设置为级别 2 以上。\n\n## 全球化和多个 vCenter 实例\n\n部署单个 vCenter Server\
  \ 实例来管理 vSphere 环境是非常直接的。许多使用 vSphere 的全球性组织正在根据组织的划分方式（按地理区域）部署多个 vCenter Server\
  \ 实例。这种方法可以解决网络延迟和隐私法等问题，但它破坏了部署标准和统一配置的概念。\n\n大多数全球组织还运行如 Microsoft Active Directory\
  \ 之类的全局目录服务，允许组织各地的用户访问全球的各种资源。让来自英国的用户访问位于印度的 vCenter 实例可能仅需在印度的 vCenter Server\
  \ 上为该用户分配权限，但这样做仍需要用户跨越远距离进行连接，这会带来麻烦。VMware 研究了此类和其他相关用例，决定是时候让 vCenter Server\
  \ 具备与其同级 vCenter 服务器通信的能力了。这一功能是 vCenter Server 链接模式（Linked Mode）。\n\nvCenter Server\
  \ 链接模式将各个 vCenter Server 相互引入，以便它们能够共同提供跨多个 vCenter 实例的可见性。链接模式允许 vCenter Server\
  \ 将角色、权限和许可传递给其同级服务器，以便您可以同时登录、查看和搜索所有链接 vCenter 服务器的清单。\n\n## 满足先决条件\n\n构建 vCenter\
