  md: '# Chapter 10 | Install Red Hat Enterprise Linux


    +   - zerombr: Initialize disks whose formatting is unrecognized


    # Network Commands


    The following Kickstart commands configure networking related features:


    +   - network: Configures networking for the target system. Activates network
    devices in the installer environment.


    ```

    network --device=eth0 --bootproto=dhcp

    ```


    +   - firewall: Defines the firewall configuration for the target system.


    ```

    firewall --enabled --service=ssh,http

    ```


    # Location and Security Commands


    The following Kickstart commands configure security, language, and region settings:


    +   - lang: Sets the language to use during installation and the default language
    of the installed system. Required.


    ```

    lang en_US

    ```


    +   - keyboard: Sets the system keyboard type. Required.


    ```

    keyboard --vckmap=us

    ```


    +   - timezone: Defines the timezone and whether the hardware clock uses UTC.
    Required.


    ```

    timezone --utc Europe/Amsterdam

    ```


    +   - timesource: Enables or disables NTP. If you enable NTP, you must specify
    NTP servers or pools.


    ```

    timesource --ntp-server classroom.example.com

    ```


    +   - autselect: Sets user authentication options. Options recognized by autselect
    are valid for this command. See autselect(8).


    +   - rootpw: Defines the initial root password. Required.


    ```

    rootpw --plaintext redhat

    or

    rootpw --isencrypted $6KUnnFrTrz08jv.PIH$YlBbOtXkBwMuRfb0.SpbQ....XDR1UuchoM0

    ```


    +   - selinux: Sets the SELin mode for the installed system.


    ```

    selinux --enforcing

    ```


    +   - services: Modifies the default set of services to run under the default
    systemd target.


    RHI34-RHEL 9.0-en-2-20220609 295'
