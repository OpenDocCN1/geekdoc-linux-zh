- pgno: 280
  md: '# Chapter 9 | Manage Network Security


    ![](img/2eff90170b8c94cce3a908ab927e38c2_280_0.png)


    # # Configure the Firewall from the Command Line


    The **firewall--cmd** command interfaces with the **firewall** daemon. It is installed
    as part of the **firewall** package and is available for administrators who prefer
    to use the command line, for systems without a graphical interface, or for scripting
    a firewall setup.


    The following table lists frequently used **firewall--cmd** commands, along with
    an explanation. Note that unless specified, all commands work on the *runtime*
    configuration, unless the --permanent option is specified. If the --permanent
    option is specified, you must activate the setting by running the **firewall--cmd
    load** command, which reads the current permanent configuration and applies it
    to the new runtime configuration. Many of the commands listed take the --zone=
    option to determine which zone they affect. Where a netmask is required, use CIDR
    notation, such as 192.168.1/24.


    | firewall--cmd commands | Explanation |

    | --- | --- |

    | --get-default-zone | Query the current zone. |

    | --set-default-zone=ZONE | Set the default zone. This changes both the runtime
    and permanent configuration. |

    | --get-zones | List all available zones. |

    | --get-active-zones | List all zones currently in use (have an interface or source
    tied to), along with their interface and source information. |

    | --add-source=CIDR [--zone=ZONE] | Route all traffic coming from the IP address
    or netmask to the specified zone. If no --zone option is provided, then the default
    zone is used. |

    | --remove-source=CIDR [--zone=ZONE] | Remove the rule routing all traffic from
    the zone coming from the IP address or network. If no --zone option is provided,
    then the default zone is used. |

    | --add-interface=INTERFACE [--zone=ZONE] | Route all traffic coming from INTERFACE
    to the specified zone. If no --zone option is provided, then the default zone
    is used. |'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# firewall-cmd commands


    # Explanation


    ```

    --change-interface=INTERFACE --

    zone=ZONE

    ```


    Associate the interface with ZONE instead of its current zone. If no --zone= option
    is provided, then the default zone is used.


    ```

    --list-all [--zone=ZONE]

    ```


    List all configured interfaces, sources, and ports for ZONE. If no --zone= option
    is provided, then the default zone is used.


    ```

    --list-all-zones

    ```


    Retrieve all information for all zones (interfaces, sources, services).


    ```

    --add-service=SERVICE --

    zone=ZONE

    ```


    Allow traffic to SERVICE. If no --zone= option is provided, then the default zone
    is used.


    ```

    --add-port=PORT/PROTOCOL --

    zone=ZONE

    ```


    Allow traffic to the PORT/PROTOCOL(s). If no --zone= option is provided, then
    the default zone is used.


    ```

    --remove-service=SERVICE --

    zone=ZONE

    ```


    Remove SERVICE from the allowed list for the zone. If no --zone= option is provided,
    then the default zone is used.


    ```

    --remove-port=PORT/PROTOCOL --

    zone=ZONE

    ```


    Remove the PORT/PROTOCOL(s) from the allowed list for the zone. If no --zone=
    option is provided, then the default zone is used.


    ```

    --reload

    ```


    Drop the runtime configuration and apply the persistent configuration.


    The following example sets the default zone to dmz, assigns all traffic from the
    192.168.0.0/24 network to the internal zone, and opens the network ports for the
    mysql service on the internal zone.


    ```

    [root] ~ firewall-cmd --set-default-zone=dmz

    [root] ~ firewall-cmd --permanent --zone=internal \

    --add-source=192.168.0.0/24

    [root] ~ firewall-cmd --permanent --zone=internal --add-service=mysql

    [root] ~ firewall-cmd --reload

    ```


    > NotenFor situations where the basic syntax is not enough, you can add rich-rules
    to write complex rules. Even if the rich-rules syntax is not enough, then you
    can also use Direct Configuration rules (raw nft syntax mixed with firewall rules).
    These advanced configurations are beyond the scope of this chapter.'
  merge: -1
  img_proc: true
