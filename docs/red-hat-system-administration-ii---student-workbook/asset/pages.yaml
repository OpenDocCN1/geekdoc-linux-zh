- pgno: 315
  md: '> Note

    In Kickstart file, missing required values cause the installer to interactively
    prompt for an answer or to abort the installation entirely.


    # Kickstart Installation Steps


    Use the following steps to automate the installation of Red Enterprise Linux with
    Kickstart feature:


    +   1. Create a Kickstart file.

    2. Publish the Kickstart file so that the Anaconda installer can access it.

    3. Boot the Anaconda installer and point it to the Kickstart.


    # Create a Kickstart File


    You can use either of these methods to create a Kickstart file:


    +   * Use the Kickstart Generator.

    * Use a text editor.


    The Kickstart Generator service at https://access.redhat.com/labs/kickstartconfig
    displays dialog boxes for users, and creates a Kickstart configuration file with
    the user''s choices. Each dialog box contains the configurable items in the Anaconda
    installer.


    ![](img/2eff90170b8c94cce3a908ab927e38c2_315_0.png)'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# Chapter 10 | Install Red Hat Enterprise Linux


    Creating a Kickstart from scratch is complex, so you should start by editing an
    existing file. Every installation creates a /root/anaconda-ks.cfg file containing
    the Kickstart directives used in the installation. This file is a good starting
    point to create a new Kickstart file.


    The validator utility checks for syntax errors in a Kickstart file. It ensures
    that keys and options are properly used, but it does not validate URL paths, installed
    packages, groups, nor any part of %post or %scripts. For instance, if the firewall
    --disabled directive is misspelled, the validator command could produce one of
    the following errors:


    ```

    [user@host~$] validator /tmp/anaconda-ks.cfg

    The following problem occurred on line 10 of the kickstart file:

    ```


    Unknown command: firewall


    ```

    [user@host ~] validator /tmp/anaconda-ks.cfg

    The following problem occurred on line 10 of the kickstart file:

    ```


    no option: --disabled


    The ksverdiff utility displays differences between different OS versions. For
    example, the following command displays the Kickstart changes between RHEL 8 and
    RHEL 9:


    ```

    [user@host ~] ksverdiff -f RHEL -t RHEL9

    The following commands were removed in RHEL9:

    device deviceprobe install multipath

    ```


    The following commands were deprecated in RHEL9:

    astostep btrfs method


    The following commands were added in RHEL9:

    timesource

    ...omitted...


    The kickstart package provides the validator and ksverdiff utilities.


    # Publish the Kickstart File to Anaconda


    Make the Kickstart file available to the installer by placing it in one of these
    locations:


    +   * A network server available at installation time using FTP, HTTP, or NFS.

    * An available USB disk or CD-ROM.

    * A local disk on the system.


    The installer must access the Kickstart file to begin an automated installation.
    Usually the file is made available via FTP, web, or NFS server. Network servers
    facilitate Kickstart maintenance because changes can be made once, and then immediately
    for future installations.


    Providing Kickstart file on USB or CD-ROM is also convenient. The Kickstart file
    can be embedded on the boot media used to start the installation. However, when
    the Kickstart file is changed, you must generate new installation media.


    Providing the Kickstart file on a local disk allows you to quickly rebuild a system.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# Boot Anaconda and Point it to the Kickstart File


    Once a Kickstart method is chosen, the installer is told to locate the Kickstart
    file by passing the inst.ks=LOCATION parameter to the installation kernel.


    Consider the following examples:


    +   - inst.ks=http://server/dir/file

    - inst.ks=ftp://server/dir/file

    - inst.ks=nfs:server/dir/file

    - inst.ks=hd:device/dir/file

    - inst.ks=cdrom:device


    ![](img/2eff90170b8c94cce3a908ab927e38c2_317_0.png)


    Figure 10.3: Specifying the Kickstart location during installation


    For virtual machine installations using the Virtual Machine Manager or virt-manager,
    the Kickstart URL can be specified in a box under URL Options. When installing
    physical machines, boot using installation media and press the Tab key to interrupt
    the boot process. Add a inst.ks=LOCATION parameter to the installation kernel.'
  merge: -1
