  md: '# Introduction


    # # Orientation to the Classroom Environment


    ![](img/2eff90170b8c94cce3a908ab927e38c2_13_0.png)


    Figure 0.1: Classroom environment


    In this course, the main computer system for hands-learning activities is workstation.
    Students use two other machines for these activities: servera and serverb. All
    three systems are in the lab.example.com DNS domain.


    All computer systems have a standard user account, student, which has the password
    student. The root password on all systems is redhat.


    #  Classroom Machines


    | Machine name | IP address | | |

    | bastion.lab.com | 172.252.250.254 | Gateway system to connect the student private
    network to the classroom server (must always be running) |

    | classroom.example.com | 172.252.254.254 | Server that has the required classroom
    materials |

    | workstation.lab.com | 172.252.250.9 | Graphical workstation for student use
    |

    | servera.lab.com | 172.252.250.10 | Managed server "A" |

    | serverb.lab.com | 172.252.250.11 | Managed server "B" |


    The primary function of bastion is to act as a router between the network that
    connects the student machines and the classroom network. If bastion is down, then
    other machines access only systems on the individual student network.'
  merge: -1
  img_proc: true
