  md: '# Basic File Context Operations


    The following table is a reference for the semanage fcontext command options to
    add, remove, or list SELinux file policies.


    semanage fcontext commands


    | option | description |

    | -a, --add | Add a record of the specified object type |

    | -d, --delete | Delete a record of the specified object type |

    | -l, --list | List records of the specified object type |


    To manage SELinux, install the policycoreutils and policycoreutils-python-packages,
    which contain the restore and semanage commands.

    To reset all files in the default policy, use the semanage fcontext -l command
    to locate and verify the correct policy exists with the intended content. Then,
    use the restore command on the wildcard directory name to reset all files recursively.
    In the following example, view the file contents before and after using semanage
    and restore commands.


    First, check the SELinux context for the files:


    ```

    [root@host ~] ls -z /var/www/html/*

    unconfined:u:object_r:user_tmp:s0 /var/www/html/file1

    unconfined:u:object_r:httpd_sys_content:s0 /var/www/html/file2

    ```


    Then, use the semanage fcontext -l command to list the default SELinux contexts
    for the files:


    ```

    [root@host ~] semanage fcontext -l

    output omitted...

    /var/www/(.*) all files system_u:object_r:httpd_sys_content:s0

    output omitted...

    ```


    The semanage command output indicates that all files and directories in the /var/www
    will have the httpd_sys_content_t default. Running restore command on the wildcard
    defined folders will restore the default context on all files and subdirectories.


    ```

    [root@host ~] restore -R /var/www/*

    Relabeled /var/www/html/file from unconfined:u:object_r:user_tmp:s0

    unconfined:u:object_r:httpd_sys_content:s0

    [root@host ~] ls -z /var/www/html/*

    unconfined:u:object_r:httpd_sys_content:s0 /var/www/html/file1

    unconfined:u:object_r:httpd_sys_content:s0 /var/www/html/file2

    ```


    This example shows how to use semanage to add a context policy for a new directory.
    First, create the /virtual directory with an index.html file inside it. View the
    SELinux context for the file and the directory.'
