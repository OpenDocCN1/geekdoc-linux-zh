- pgno: 247
  md: "# Reboot and Shut Down\n\nTo power off or reboot a system from the line, you\
    \ can use the systemctl command.\n\nThe systemctl poweroff stops all running services,\
    \ unmounts all file systems (or remount them read-only when they cannot be unmounted),\
    \ and powers down the system.\n\nThe systemctl reboot command stops all running\
    \ services, unmounts all file systems, and reboots the system.\n\nYou can also\
    \ use the shorter version of these commands, poweroff and reboot, which are symbolic\
    \ links to their systemctl equivalents.\n\n> Note\nThe systemctl halt and the\
    \ halt commands are also available to stop the system, unlike the poweroff command,\
    \ these do not power off the system; they bring a system to a point where it is\
    \ safe to power off manually.\n\n# Select a Systemd Target\n\nA systemtarget is\
    \ a set of systemd units that the system should start to reach a desired state.\
    \ The following table lists the most important targets.\n\nCommon Used Targets\n\
    \n| Target | Purpose |\n|---|---|n| graphical.target | System supports multiple\
    \ users, graphical- and text-based logins. |\n| multi-user.target | System supports\
    \ multiple users, text-based logins only. |\n| rescue.target | sulogin prompt,\
    \ basic system initialization completed. |\n| emergency.target | sulogin prompt,\
    \ initramfs pivots completes, and system root mounted / read only. |\n\nA target\
    \ can be part of another target. For example, the graphical target includes multi-user.target,\
    \ which in turn depends on basic target and others. You can view these dependencies\
    \ with this command.\n\n```\n$host ~]$ systemctl list-dependencies graphical.target\
    \ | grep target\n* multi-user.target\n  * |basic.target\n  * |paths.target\n \
    \ * |slices.target\n  * |sockets.target\n  * |sysinit.target\n  * |cryptsetup.target\n\
    ```"
  merge: -1
  img_proc: true
