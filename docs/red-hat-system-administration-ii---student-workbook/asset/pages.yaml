- pgno: 65
  md: '# Run Periodic Commands with Anacron


    The run-periodic command runs the daily, weekly, and monthly jobs from the /etc/anacontab
    configuration file.


    The /etc/anacontab files ensure that delayed jobs run and are not skipped accidentally
    because the system was turned off or hibernated. For example, when a system job
    runs daily was not executed at a specified time the system was rebooting, a delay
    might occur before the job starts, if specified in the Delay minutes parameter
    in the /etc/anacontab file.


    Files in the /var/spool/anacron/ directory define the daily, weekly, and monthly
    jobs. When the cron daemon starts a job from the /etc/anacontab file, it updates
    the timestamp of those files. With this timestamp, the cron can determine the
    last time the job executed. The syntax of the /etc/anacontab file is different
    from the regular crontab files. The /etc/anacontab file contains four fields per
    line, as follows:


    # Period in days


    Defines the interval in days for the job to run on a recurring schedule. This
    field accepts an integer or a macro value. For example, the macro @daily is equivalent
    to the 1 integer, which executes the job daily. Similarly, the macro @weekly is
    equivalent to the 7 integer, which executes the job weekly.


    # Delay in minutes


    Defines the time that the cron daemon must wait before it starts the job.


    # Job identifier


    This field identifies the unique name of the job in the log messages.


    # Command


    The command to be executed.


    The /etc/anacontab file also contains environment variable declarations with the
    NAME=value syntax. The START_HOURS_RANGE variable specifies the interval for the
    jobs to run. Jobs do not start outside this range. When a job does not run within
    this time interval on a particular day, the job must wait until the next day for
    execution.


    # Systemd Timer


    The systemd timer activates another unit of a different type (such as a service)
    whose name matches the timer unit name. The timer unit uses timer-based activation
    of other units. The systemd timer logs events in system journal for debugging.


    # Sample Timer Unit


    The sysstat package defines the systemd unit, as the sysstat-collect.timer service,
    to collect system statistics every 10 minutes. The following output shows the
    contents of the /usr/lib/systemd/system/sysstat-collect.timer configuration file.


    ```

    ...output omitted...

    [Unit]

    Description=Run system activity accounting tool every 10 minutes


    [Timer]

    OnCalendar*:00/10

    ```'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# Chapter 2 | Schedule Future Tasks


    ```

    [Install]

    WantedBy=syslog.service

    ```


    The OnCalendar=''*:00/10'' signifies that this timer unit activates the corresponding
    sysstat-collect unit every 10 minutes. You might specify more complex time intervals.


    For an example, 2022-04-* 12:35,37,39:16 value in OnCalendar option causes the
    timer unit to activate the corresponding service at 12:35:16, 12:37:16, and 12:39:16
    times, every day April 2022. You might also specify relative times with the OnUnitActiveSec;
    for example, with the OnUnitActiveSec=15min option, the timer triggers the corresponding
    unit to start 15 minutes after the last time the timer unit activated.


    +   Do not modify any units in the configuration files under the /usr/lib/systemd
    directory, where the systemd unit overrides the changes in that file. Create a
    copy of the configuration file in the /etc/systemd directory and then modify the
    copied file to prevent any update to the provider package from overriding the
    changes. If two files exist with the same name in the /usr/lib/systemd and /etc/systemd/system
    directories, then the systemd unit parses the file in the /etc/systemd/system
    directory.


    After you change the timer unit configuration file, use the systemctl daemon-reload
    command to ensure that the system loads the changes.


    ```

    [host~]# systemctl daemon-reload

    ```


    After reloading the systemd daemon configuration, use the systemctl command to
    activate the timer unit.


    ```

    [host~]# systemctl enable --now <unitname>.timer

    ```


    +   crontab(5), anacron(8), anacrond(5), systemd.time(7), systemd.timer(5), and
    crond(8) man pages'
