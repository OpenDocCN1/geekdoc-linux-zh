    From this window, configure the installation parameters by selecting the icons
    in any order. Select an item to view or edit. In any item, click Done to return
    to the current screen.


    Anaconda marks items with a triangle warning symbol and message. The orange status
    bar at the bottom of the screen reminds you to complete the required information
    before the installation begins.


    Complete the following as needed:


    +   * **Keyboard:** Add additional keyboard layouts.

    * **Language Support:** Select additional languages to install.

    * **Time & Date:** Select the system''s location by clicking on the interactive
    map or selecting it from the lists. Specify the local time zone when using Network
    Time Protocol (NTP).

    * **Connect to Red Hat:** Register the system with your Red Hat account and select
    the system purpose. The system purpose allows the registration process to automatically
    attach the


