  md: '# Chapter 6 | Manage Storage Stack


    ![](img/2eff90170b8c94cce3a908ab927e38c2_203_0.png)


    # # Stratatis Administration Methods


    To manage file systems with the Stratatis storage management solution, install
    the stratis-cli and stratis packages. The stratis-cli package provides the stratis
    command, which sends reconfiguration requests to the stratis daemon. Stratatis
    provides the stratis service, which handles reconfiguration requests and monitors
    Stratatis'' block devices, pools, and file systems.


    Stratatis administration is included in RHEL web console.


    > > Warning

    Reconfigure file systems created by Stratatis with Stratatis tools and commands.

    Stratatis uses stored metadata to recognize managed pools, volumes, and file systems.
    Manually configuring Stratatis file systems with non-Stratatis commands can result
    in overwriting that metadata and prevent Stratatis from recognizing the file system
    volumes it had previously created.


    # # Install and Enable Stratatis


    To use Stratatis, ensure that your system has the required software and that the
    stratis service is running. Install the stratis-cli and stratis packages, and
    start and enable the stratis service.


    ```

    [root]# dnf install stratis-cli stratis

    ...output omitted...

    Is this ok [Y/n]: y

    ...output omitted...

    Complete!

    [root]# systemctl enable --now stratis

    ```


    # # Create Stratatis Pools


    Create pools of one or more block devices by using the stratis pool create command.
    Use the stratis pool list command to view the list of available pools.


    186 RH14-RHEL9.0-en-2-20220609'
