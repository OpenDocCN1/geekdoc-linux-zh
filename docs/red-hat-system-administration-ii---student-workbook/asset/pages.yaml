  md: '# Install Container Utilities


    The container-tools package contains required utilities to interact with containers
    and images. To download, run, and compare containers on your system, you install
    the container-tools package with the dnf install command. Use the dnf command
    to view the versions of the container-tools package.


    ```

    [root@host ~]# dnf install container-tools

    ...output omitted...

    [user@host ~]$ dnf info container-tools

    ...output omitted...

    Summary

    - A meta-package with container tools such as podman, buildah,

    - skopeo, etc.

    License

    - MIT

    Description

    - Latest versions of podman, buildah, skopeo, runc, concern, CRIU,

    - Udica, etc as well as dependencies as container-selinux

    - built and tested, and updated.

    ...output omitted...

    ```


    The container-tools meta-package provides the needed podman and skopeo utilities
    to achieve the assigned tasks.


    # Download a Container Image from a Registry


    First, ensure that the podman utility is configured to search and download containers
    from the registry.redhat.io registry. The podman info command displays configuration
    information of the podman utility, with the configured registries.


    ```

    [user@host ~]$ podman info

    ...output omitted...

    insecure registries:

    registries: []

    registries:

    registries:

    - registry.redhat.io

    - quay.io

    - docker.io

    ...output omitted...

    ```


    The podman search command searches for a matching image in the list of configured
    registries. By default, Podman searches implemented in all unqualified-search
    registries. Depending on the Docker distribution API that is implemented with
    the registry, some registries might not support the search feature.


    Use the podman search command to display a list of images on the configured registries
    that contain the python-38 package.'
