- pgno: 98
  md: '# Chapter 3 | Tune System Performance


    ```

    user@host ~$ sleep 60 &\n[1] 2667

    user@host ~$ ps -o pid,comm,nice 2667

    PID COMMAND      NI

    2667 sleep      0

    ```


    All users use the nice command to start starts with a default or higher value.
    Without options, the nice command starts a process with a default nice value of
    10. Setting a higher value by default ensures that the nice process is lower priority
    than your current working shell, and less likely to affect your interactive session.


    The following example starts the same command as a background with the default
    nice value and displays the process value:


    ```

    user@host ~$ sleep 60 &\

    [1] 2736

    user@host ~$ ps -o pid,comm,nice 2736

    PID COMMAND      NI

    2736 sleep      10

    ```


    Use the nice command -n to apply a user-defined nice value to the starting process.
    The default is to add 10 to the process value. The following example starts a
    background job with a user-defined nice value of 15 and displays:


    ```

    user@host ~$ -n 15 sleep 60 &\n[1] 2673

    user@host ~$ ps -o pid,comm,nice 2740

    PID COMMAND      NI

    2740 sleep      15

    ```


    > Unprivileged users may only increase the nice value from its current value,
    to a maximum of 19. If the value is increased, unprivileged users cannot reduce
    the value to revert to the previous nice. However, a privileged user may reduce
    the nice value from any current value, to a minimum of -20.


    # Change the Nice Value of an Existing Process


    You can change the nice value of an existing process with the renice command.
    This example uses the process ID from the previous example to change the current
    nice value of 15 to a new nice value of 19.


    ```

    user@host ~$ renice -n 19 2740\n2740 (process ID) old priority 15, new priority
    19

    ```


    You can also use the top command to change the nice value on an existing process.
    From the top interactive interface, press the r option to access the renice command.
    Enter the process ID, and then the new nice value.'
  merge: -1
