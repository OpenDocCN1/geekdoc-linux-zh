    # # Remove Containers and Images


    You can remove containers and images using the podman rm and podman commands,
    respectively. Before removing a container image, any running containers from that
    must be removed.


    You decide to remove the python38 container and its related image. If you attempt
    to remove the registry.access.redhat.com/ub8/python-38 image while the python38
    container exists, it gives you an error.


    ```

    [user@host ~]$$ podman rm registry.access.redhat.com/ub8/python-38

    Error: image used

    a60f7a1d1ccb997f5ef244aad23e5de71dd1e8a2565428ccfebde73a2f9462: image is in use

    by a container

    ```


    You must stop the container before you remove it. To stop a container, use the
    podman stop command.


    ```

    [user@host ~]$$ podman stop python38

    ```


    After you stop it, use the podman rm command to remove the container.


    ```

    [user@host ~]$$ podman rm python38

    a60f7a1d1ccb997f5ef244aad23e5de71dd1e8a2565428ccfebde73a2f9462

    ```


    When the container no longer exists, the registry.access.redhat.com/ub8/python-38
    can be removed with the podman rm command.


    ```

    [user@host ~]$$ podman rm registry.access.redhat.com/ub8/python-38

    Untagged: registry.access.redhat.com/ub8/python-38:latest

    Deleted: a33d2f90990c9bbad99aa98fe0174ebf30c711b49527dcc79713353252ea57d12

    ```'
