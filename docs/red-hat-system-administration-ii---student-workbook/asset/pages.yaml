  md: "# Multiple Networks to a Single Container\n\nMultiple networks can be connected\
    \ to a container at the same time to separate different types of traffic.\n\n\
    You use the podman network create command to create the backend network.\n\n```\n\
    [user@host ~]$ podman network create backend\n```\n\nYou use the podman network\
    \ ls command to view all the Podman networks.\n\n```\n[user@host ~]$ podman network\
    \ ls\nNETWORK ID DRIVER\na7fe510a6bd backend bridge\nfe680ec5276 db01\n2f259bab93a\
    \ podman bridge\n```\n\nThe gateway was not specified with the podman network\
    \ create command\n--gateway --subnet options.\n\nYou use the podman network inspect\
    \ command to obtain the IP information of the backend network.\n\n```\n[user@host\
    \ ~]$ podman network inspect backend\n{\n  \"name\": \"backend\",\n  ...output\
    \ omitted...,\n  \"subnets\": [\n    \"subnet\": \"10.89.1.0/24\",\n    \"gateway\"\
    : \"10.89.1.1\"\n  ]\n  ...output omitted...}\n```\n\nYou use the podman network\
    \ connect to connect additional networks to a container when it is running. You\
    \ use the podman network connect to connect the backend network to the db01 and\
    \ client01 containers.\n\n```\n[user@host ~]$ podman network connect backend db01\n\
    [user@host ~]$ podman network connect backend client01\n```\n\n> Important If\
    \ a network is not specified with the podman run command, the container connects\
    \ to the default. The default network uses the slip4netns network mode, and the\
    \ networks that you create with the podman network create command use the bridge\
    \ network mode. If you try to connect a bridge network to a container using the\
    \ slip4netns network mode, then the command fails:\nError: \"slip4netns\" is not\
    \ supported: invalid network mode"
