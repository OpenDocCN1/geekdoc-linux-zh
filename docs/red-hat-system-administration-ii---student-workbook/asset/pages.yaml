- pgno: 183
  md: '# Create and Extend Logical Volumes


    # Objectives


    Describe logical volume manager components and concepts, and implement LVM storage
    and display LVM component information.


    # Logical Volume Manager Overview


    Use the Logical Volume Manager (LVM) system to create logical storage volumes
    as a layer on the physical storage. This storage system provides greater flexibility
    than using physical storage directly. LVM hides the hardware configuration from
    the software and enables you to resize volumes without stopping applications or
    unmounting file systems. LVM provides comprehensive command-line tools to manage
    storage.


    Physical devices


    Logical volumes use physical devices for storing data. These devices might be
    disk partitions, whole disks, RAID arrays, or SAN disks. You must initialize the
    device as LVM volume. An LVM physical volume must use the entire physical device.


    Physical Volumes (PVs)


    LVM uses the underlying physical device as the LVM volume. LVM tools segment the
    physical volumes into Physical Extents (PEs) to form chunks of data that act as
    the smallest block on a PV.


    Volume Groups (VGs)


    Volume groups are storage pools from one or more PVs. It is the functional equivalent
    of a whole disk carved into physical storage. A PV must only be allocated to a
    single VG. LVM sets the PE size automatically, although it is possible to specify
    it. A VG might consist of unused and several logical volumes.


    Logical Volumes (LVs)


    Logical volumes are created from free physical extents in a VG and provide the
    storage device for applications, users, and operating systems. LVs are composed
    of Logical Extents (LEs), which map to physical devices. By default, each LE gets
    mapped to one PE. Specific LVM options change this mapping; for example, mirroring
    each LE to map to two PEs.


    # Logical Volume Manager Workflow


    Creating LVM storage requires building structures in a logical workflow.


    +   - Determine the physical devices for creating physical volumes, and initialize
    these devices as LVM physical volumes.

    - Create a volume group from multiple physical volumes.

    - Create the logical volumes from the available space in the volume group.

    - Format the logical volume with a file system and mount it, or activate it as
    swap space, or pass the raw volume to a database or storage server for advanced
    structures.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Chapter 6 | Manage Storage Stack


    | /dev/sdb | LVM metadata | programs | /dev/project/programs |

    |---|---|---||

    | /dev/sdc | /dev/sdb | docs | /dev/project/docs |

    | /dev/sdd | /dev/sdc | utils | /dev/project/utils |

    | /dev/sde | /dev/sdd | data | /dev/project/data |

    | /dev/sdf | /dev/sde | data | |

    | /dev/sdg | /dev/sdf | project | project |


    | Physical Block Device | PV Physical Volume | VG Volume Group | Placement | LV
    Logical Volume |


    Figure 6.1: Logical Volume Manager workflow


    > Note

    The examples use a /dev/vdb device name and its storage partitions. The device
    names on your classroom system may be different. Use the lsblk, blkid, or cat
    /proc/partitions commands to identify your device''s.


    # Build LVM Storage


    Creating a logical volume involves creating physical device partitions, physical
    volumes, and volume groups. After creating an LV, format the volume and mount
    it to access it as storage.


    # Prepare Physical Devices


    Partitioning is optional when present. Use the parted command to create a new
    partition on the physical device. Set the Linux LVM partition type. Use the udevadm
    settle to register the new partition with the kernel.


    ```

    [root ~#] parted /dev/vdb mklabel gpt primary 1MiB 769MiB

    ...output omitted.

    [root ~#] parted /dev/vdb mk primary 770MiB 1026MiB

    [root ~#] parted /dev/vdb set 1 lv on

    [root ~#] parted /dev/vdb set 2 lv on

    [root ~#] ~ udevadm settle

    ```


    # Create Physical Volumes


    Use the pvcreate command to label the physical partition as an LVM logical volume.
    Label multiple devices simultaneously using space-separated device names as arguments
    to the pvcreate command. This example labels the /dev/vdb1 and /dev/vdb2 devices
    as PVs that are ready for creating volume groups.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# Create a Volume Group


    The vgcreate command builds one or more physical volumes into a volume group.
    The first argument is a volume name, followed by one or more physical volumes
    to allocate to this vg. This example creates the vg1 using /dev/vdb1 and /dev/vdb2
    PVs.


    ```

    [root@host #] vgcreate vg1 /dev/vdb1 /dev/vdb2

    volume group "vg1" successfully created

    ```


    # Create a Logical Volume


    The lvcreate command creates a new logical volume from the PEs in a volume group.
    Use the lvcreate command to set the size and the VG name that will contain this
    logical volume. This example creates lv01 with 700 MiB in the vg1 VG.


    ```

    [root@host #] lvcreate -n lv01 -L 300M vg1

    Logical volume "lv01" created.

    ```


    This command might fail if the volume group does not have sufficient free extents.
    The size rounds up to the next multiple of PE size if the size does not exactly
    match.


    The lvcreate command -L option requires sizes in bytes, megibytes (binary megabytes,
    1048576 bytes), and gibytes (binary gigabytes), or similar. The lower case -l
    requires sizes specified as a number of physical extents. The following commands
    are choices for creating the LV with the same size as:


    +   - lvcreate -n lv01 -L 128M vg1 : create an LV of size 128 MiB, rounded to
    the next PE.

    - lvcreate -n lv01 -l 1 32 vg1 : create an LV of size 32 PEs at 4 MiB each is
    128 MiB.


    # Create a Logical Volume with Deduplication and Compression


    RHEL 9 uses an LVM implementation for managing VDO volumes. The previous python-based
    VDO management tools are still available but no longer needed.


    The Virtual Data Optimizer (VDO) provides in-block-level deduplication, compression,
    and thinning for storage. Configure a VDO volume to use up to 256 TB of physical
    storage. Manage VDO as a type of logical volume (LVs), similar to LVM provisioned
    volumes. An VDO is composed of two logical volumes:


    # VDO pool


    This LV stores, deduplicates, and compresses data to set the size of the VDO volume
    backed by the physical device. VDO is deduplicated and compresses each VDO LV
    separately each VDO pool can hold only one VDO LV.


    # VDO LV


    A virtual device is provisioned on top of the VDO pool and sets the logical size
    of the VDO volume storing the data before deduplication and compression occur.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# Chapter 6 | Manage Storage Stack


    LVM presents the deduplicated storage as a regular logical volume (LV). The VDO
    can be formatted with a standard file systems, as a block device, or used to build
    other storage layers, as any normal logical volume.


    To be able to use VDO deduplication and compression, install the vdo kmod-kvdo
    packages.


    ```

    [root@host ~] dnf install vdo kmod-kvdo

    ```


    Verify that the LVM volume group has free storage capacity. Use the create command
    with the --type parameter to create a VDO volume.


    ```

    [root@host ~] lvcreate --type vdo --name vdo-lv01 --size 5g vg01

    Logical blocks defaulted to 523188.

    VDO volume can extend to address 2 GB in 1 data slab.

    It can grow to at most 16 TB of physical storage in 8192 slabs.

    If a larger maximum size might be needed, use bigger slabs.

    Logical volume --vdo-lv01 created.

    ```


    # Create a File System on the Logical Volume


    Specify the logical volume by either the /dev/vgname/lvname traditional name,
    or the /mapper/vgname-lvname_kernel device name.


    Use the mkfs command to create a file system on the logical volume.


    ```

    [root@host ~] mkfs -t xfs /dev/vg01/lv01

    output omitted...

    ```


    Create a mount point using the mkdir command.


    ```

    [root@host ~] mkdir /mnt/data

    ```


    To make the file system available persistently, add the entry to /etc/fstab file.


    ```

    /dev/vg01/lv01 /mnt/data xfs defaults 0 0

    ```


    Mount the LV using the mount command.


    ```

    [root@host ~] mount /mnt/data/

    ```


    > Note

    You can create a logical volume by name or by UUID because LVM parses the PVs
    looking for the UUID. This behavior is successful even when the VG was created
    using a name, because the PV will always contain a UUID.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# Display LVM Component Status


    LVM provides various utilities to show the status information of PV, VG, and LV.
    Use the vdisplay, vgdisplay, and ldisplay commands to show the status information
    of the LVM components.


    The associated pvs, vgs and lvs commands are commonly used and show a subset of
    the status information, with one line for each entity.


    # Display Physical Volume Information


    The vdisplay command displays information about the PVs. Using the command without
    arguments to list all of PVs on the system. Providing the name of the PV as an
    argument to the command shows specific information about the PV.


    ```

    [root@host ~] vdisplay /dev/vgdb1

    --- Physical volume ---

    PVdev/vgdb1

    VG vg01

    P Size 731.98 MIB / not usable 3.98 MIB

    Allocatable yes

    PE Size 4.00 MIB

    Total 182

    Free PE 75

    Allocated PE @pZD09-NxVt-Qoi-yfQ-TGPL-0Yj-wEH2n

    ```


    +   PV Name shows the device name.

    VG Name shows the volume group where the PV is allocated.

    PV Size shows the physical size of the PV, including unusable space.

    PE Size shows the physical size extent.

    Free PE shows the PE size available in the VG to create new LVs or extend existing
    LVs.


    # Display Volume Group Information


    The vgdisplay command shows the information about volume groups. To list information
    about all VGs, use the command without arguments. Provide the name of the VG as
    an argument to list information specific to the VG.


    ```

    [root@host ~] vgdisplay vg01

    --- Volume group ---

    VG vg01

    System ID svm2

    Format

    Metadata Areas 2

    Metadata Sequence No. 2

    VG Access read/write

    VG Status resizable

    MAX LV 0

    Cur LV 1

    Open LV 1

    ```'
  merge: -1
  img_proc: true
