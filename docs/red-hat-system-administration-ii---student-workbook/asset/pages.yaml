- pgno: 95
  md: '# Influence Process Scheduling


    # Objectives


    Prioritize or deprioritize specific processes, with the nice and renice commands.


    # Linux Process Scheduling


    Modern systems use multi-core, multi-threaded CPUs that can execute many instruction
    simultaneously. The high-performance supercomputers can have hundreds or thousands
    of CPUs with hundreds of cores and thread structures per CPU, and millions of
    instruction threads in parallel. While a single user running applications can
    saturate the typical desktop system or workday capacity, a properly sized and
    configured system is designed to match the user''s intended workload. However,
    the typical enterprise or Internet server handles hundreds or thousands of users
    and application requests each second, which can easily result in CPU saturation.
    All systems under CPU load experience scenarios requiring more threads than the
    CPU processing units need to immediately schedule them.


    Linux and other systems use a technique called time-slicing or multitasking for
    process management. The operating system process scheduler rapidly switches between
    process threads on each CPU core. This behavior gives the impression that a significant
    number of processes are running at the same time.


    # Process Priorities


    Each process has a value measuring importance, known historically as a process
    priority. Linux implements scheduling policies that define the rules by which
    processes are organized and prioritized to obtain CPU processing time. Linux has
    different scheduling policies designed for handling interactive application requests,
    non-interactive batch processing, and real-time application requests. Real-time
    applications use process priorities and queues like the Completely Fair Scheduler
    (CFS), which organizes processes that are awaiting CPU into a binary tree. This
    process priority indicator describes the scheduling policy called SCHED_NORMAL
    or SCHED_OTHER.


    Processes running under the SCHED_NORMAL are assigned a real-time priority of
    0, to ensure that all real-time processes have a higher priority than normal processes.
    However, this priority value is not included when normalizing process threads
    for CPU scheduling. The CFS scheduling algorithm arranges normal process threads
    into a time-weighted binary tree, with the first item having the least of previously
    spent CPU time to the last that has the most cumulative CPU.


    # Nice Value


    The order of the binary tree is additionally influenced by a user-modifier, per-process
    nice value, which ranges from -20 (increased priority) to 19 (decreased priority),
    with a default of 0. Processes inherit their starting nice value from their parent
    process.


    A higher nice value indicates a decrease in the process priority from the default,
    which can be remembered as making the process nice to other processes. A lower
    nice value indicates an'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Chapter 3 | Tune System Performance


    increase in the process priority from the default, which can be remembered as
    making the process

    less nice to other processes.


    Modifying the nice value of a process will either raise or lower the process''s
    position in the

    binary tree. Increasing the nice value will lower the thread''s position, and
    decreasing the value will

    raise the thread''s.


    > Important

    Generally, priorities only indirectly determine the amount of CPU time a process

    thread receives. On a non-saturated system with available CPU capacity, every

    process is scheduled for immediate CPU time, for as much as each process wants.

    Relative importance, as managed in the binary tree, determines only which

    threads are selected and placed on CPUs first.


    On a CPU-saturated system, where there are more threads than CPU

    units, higher priority (lower nice) process threads are placed first, until

    all units are busy, while the lowest (higher nice) threads initially must

    wait in the binary tree. However, the Completely Fair Scheduler is designed to

    balance process importance, nice values and cumulative CPU time, andndynamically
    adjusts the binary tree that all processes obtain fair time.


    # Permission to Modify Nice Values


    Privileged users can decrease the nice value of a process, to make a process less
    nice, which will

    cause a process to be repeatedly higher in the binary tree, and therefore be scheduled

    often. On a saturated system, the overall CPU time available to other processes
    is reduced.


    Unprivileged users can only increase the nice value of their own processes, which
    will make their

    own processes nice, and therefore lower their placement in the binary tree. Unprivileged
    users

    c decrease their process''s nice values to raise their importance, nor can they
    adjust the nice

    values for another user''s process.


    # Viewing Nice Values


    Nice values map to a priority value, and both values are available for viewing
    in process listing

    commands. A nice of -20 maps to a 0 priority in the top command. A nice value
    of 19 mapsnto a 39 priority in the top command.


    | Higher Priority | | Lower Priority |

    |---|---|---n| Real-time priority | 100 99 98 97 96 | 4 3 2 1 | 0 |

    | Nice value top column ''NI'' | | -20 -19 -18 | 0 17 18 19 |

    | top column ''PR'' | rt -99 -98 -97 -96 | -4 -3 -2 -1 0 1 2 | 20 37 38 39 |


    Figure 3.3: Priorities and nice values as reported by the top command


    In Figure 3.3, the nice values are aligned with the priority values that are used
    by the top

    command. The top command displays the process priority in the PR column, and the
    nice value in

    t NI column. The top priority numbering scheme, which displays real-time process
    priorities as

    egative integers, is a legacy of internal priority algorithms.


    ![](img/2eff90170b8c94cce3a908ab927e38c2_96_0.png)'
