  md: '# Chapter 10 | Install Red Hat Enterprise Linux


    ```

    # Configure keyboard and language settings

    keyboard --vckeymap=us

    lang_us


    # Set a root password, autselect profile, and selinux policy

    rootpw --plaintext redhat

    autselect select ssd

    selinux --enforcing

    firstboot --disable


    # Enable and disable system services

    services --disabled=dump,rhcmert --enabled=ssh, rng, chronyd


    # Configure the timezone and NTP server

    timezone America/New_York --utc

    timesource --ntp-server classroom.example.com

    ```


    The second part of a Kickstart file contains the %packages section, with details
    of which packages and package groups to install, and which packages should not
    be installed.


    ```

    %packages

    @core

    chrony

    cloud-init

    dracut-config-generic

    dracut-norescue

    firewall

    grub

    kernel

    rsync

    tar

    -plymouth


    %end

    ```


    The last part of the Kickstart file contains a %post installation script.


    ```

    %post

    echo "This system was deployed using Kickstart on $(date)" > /etc/motd


    %end

    ```


    You can also specify a Python script with the --interpreter option.


    ```

    %post --interpreter=/usr/libexec/platform-python


    print("This this a line of text printed with python")


    %end

    ```'
