- pgno: 15
  md: 'Introduction


    # Machine States


    | Virtual Machine State | Description |

    | --- | --- |

    | building | The virtual machine is created. |

    | active | The virtual machine is running and available. If it just started, it
    might still be starting services. |

    | stopped | The virtual machine is completely shut down. On starting, the virtual
    machine boots into the same state that it was before shutdown. The disk state
    is preserved. |


    # Classroom Actions


    | Button or Action | Description |

    | --- | --- |

    | CREATE | Create the ROLE classroom. Creates and starts all the needed machines
    for this classroom. Creation can take several minutes to complete. |

    | CREATING | The ROLE classroom virtual machines are created. Creates starts all
    the needed machines for this classroom. Creation can take several minutes to complete.
    |

    | DELETE | Destroys all virtual machines in the classroom. **All saved work on
    system''s disks is lost.** |

    | START | Start all virtual machines in the classroom. |

    | STARTING | All virtual machines in the classroom are starting. |

    | STOP | Stop all virtual machines in the classroom. |


    # Machine Actions


    | Button or Action | Description |

    | --- | --- |

    | OPEN CONSOLE | Connect to the system console of the virtual machine in a new
    browser tab. You can log directly to the virtual machine and run commands, when
    required. Normally, log in to the workstation virtual machine, or use ssh to connect
    to the other virtual machines. |

    | ACTION > Start | Start (power on) the virtual machine. |

    | ACTION > Shutdown | Gracefully shut down the virtual machine, preserving disk
    contents. |

    | ACTION > Power Off | Forcefully shut down the virtual machine, while still preserving
    disk contents. This action is equivalent to removing the power from a physical
    machine. |

    | ACTION > Reset | Forcefully shut down the virtual machine and reset associated
    storage to its initial state. **All saved work on system''s disks is lost.** |'
  merge: -1
