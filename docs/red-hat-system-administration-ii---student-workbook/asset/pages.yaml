    # ## Bash Script Exit Codes


    After a script interprets and processes all of its content, the script proceeds
    exits and passes control back to the parent process that called it. However, a
    script can be exited before finishes, such as when the script encounters an error
    condition. Use the exit command to immediately leave the script, and skipping
    the remainder of the script.


    The exit takes an optional integer argument between 0 and 255, which represents
    an exit code. An exit code is returned to a parent process to indicate the status
    at exit. Any exit code of 0 represents a successful script completion with no
    errors. All nonzero values indicate an error code. The script programmer defines
    these codes. Use unique values to represent the different error conditions that
    are encountered. Retrieve the exit code of the last completed command from the
    built-in $? variable, as in the following examples:


    ```

    [user@host bin]$$ cat hello

    !/usr/bash

    echo "Hello, world"

    exit

    0

    [user@host bin]$$ ./hello

    Hello, world

    [user@host bin]$$ echo $?

    0

    ```


    When a script''s exit command is used without an exit code argument, the script
    returns the exit code of the last command that ran within the script.


    # ## Test Logic for Strings and Directories, and to Compare Values


    To ensure that unexpected conditions do not easily disrupt scripts, it is recommended
    to verify command input such as command-line arguments, use exit command, variable
    expansions, and file name expansions. You can check integrity in your scripts
    using the Bash test command.


    All commands produce an exit code on completion.'
