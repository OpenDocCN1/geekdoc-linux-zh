  md: '# Chapter 12 | Comprehensive Review


    +   Explain how SELinux protects resources, change the current SELinux mode of
    a system, and set the default SELinux mode of a system.


    +   Manage the SELinux policy rules that determine the default context for files
    and directories with the `semanage context` command and apply the context defined
    by the SELinux policy to files and directories with the `restorecon` command.


    +   Activate and deactivate SELinux policy rules with the `semanage boolean -l`
    command, and manage the persistent value of SELinux Booleans with man pages that
    end with _selinux to find useful information about SELinux Booleans.


    +   Use SELinux log analysis tools and display useful information during SELinux
    troubleshooting with the `sealert` command.


    # Chapter 5, Manage Basic Storage


    Create and manage storage devices, partitions, file systems, and swap spaces from
    the command line.


    +   Create storage partitions, format them with file systems, and mount them for
    use.


    +   Create and manage swap spaces to supplement physical memory.


    # Chapter 6, Manage Storage Stack


    Create and manage logical volumes that contain file systems or swap spaces from
    the command line.


    +   Describe logical volume manager components and concepts, and implement LVM
    storage and display LVM component information.


    +   Analyze the multiple components that make up the layers of the storage stack.


    # Chapter 7, Access Network-Attached Storage


    Access network-attached storage with the NFS protocol.


    +   Identify NFS export information, create a directory to use as a mount point,
    mount an NFS export with the `mount` command or by configuring the `/etc/fstab`
    file, and unmount an NFS export with the `umount` command.


    +   Describe the benefits of using the autofounter, and manage NFS exports using
    direct and indirect methods.


    # Chapter 8, Control the Boot Process


    Manage the boot process to control offered services and troubleshoot and repair
    problems.


    +   Describe the Red Hat Linux boot process, set the default target when booting,
    and boot a system to a non-default target.


    +   Log in to a system and change the root password when the current root password
    is lost.


    +   Manually repair file-system configuration or corruption issues that stop the
    boot process.


