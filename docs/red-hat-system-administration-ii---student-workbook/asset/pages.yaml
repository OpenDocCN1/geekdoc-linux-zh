- pgno: 303
  md: '# Install Red Hat Enterprise Linux


    # Objectives


    Install Red Hat Enterprise Linux on a server.


    # Understand Installation Media


    Red Hat provides different forms of installation media that you may download from
    the Customer Portal website by using your subscription.


    +   - A binary image in ISO 9660 format containing Anaconda, the Red Hat Linux
    installation program, and the BaseOS and AppStream repositories. These repositories
    contain the packages needed to configure the installation without additional repositories.

    - A smaller "boot ISO" image containing Anaconda a configured network to access
    package repositories made available using HTTP, FTP, or NFS.

    - A QCOW2 image contains a subset disk ready to deploy as a virtual machine in
    cloud or virtual environments. QCOW2 is the standard format used by Red Hat with
    KVM-based virtualization.

    - Source code (human–readable programming languages) for Red Hat Enterprise Linux.
    There is no documentation for the source DVDs. This image helps compile or develop
    your software on the Red Hat version.


    Red Hat Enterprise Linux supports the following architectures:


    +   - AMD, Intel, and ARM 64-bit architectures.

    - IBM Power Systems (Little Endian, LC servers, and AC servers).

    - IBM Z 64-bit.


    After downloading, create bootable installation media based on the instructions
    provided in the reference section.


    # Build Images using Image Builder


    The Red Hat Image Builder tool helps create customized images of Red Hat Enterprise
    Linux. Image Builder allows administrators to build custom systems for deployment
    on cloud platforms or virtual environments for specialized cases.


    Use the `composer -c li` command or Red Hat web interface to access Image Builder.


    # Install Red Hat Enterprise Linux Manually


    Using the binary DVD or boot ISO, administrators install a new RHEL on a bare-metal
    server or a virtual machine. The Anaconda program supports two installation methods:
    manual and automated.


    +   - The manual installation interacts with the user to query how Anaconda installs
    and configures the system.

    - The automated installation uses a Kickstart file that tells Anaconda how to
    install the system.'
  merge: -1
  img_proc: true
