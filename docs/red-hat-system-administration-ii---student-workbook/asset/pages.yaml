- pgno: 383
  md: '# Configure Containers to Start at System Boot


    Now that the system configuration for the container is complete, you use the SSH
    session. Some time after, you are notified that the container stops after you
    exited the session.


    You can change this default behavior and force your enabled services to start
    with the server and stop during shutdown by running the systemctl enable-linger
    command.


    You use the systemctl command to configure the system user to persist after the
    last user session of the configured service closes. Then you verify the configuration
    with the systemctl show-user command.


    ```

    [user@host]$ systemctl show-user appdev-adm

    --output omitted...

    [user@host]$ systemctl enable-linger

    [user@host]$ systemctl show-user appdev-adm

    --output omitted...

    Linger:yes

    ```


    To revert the operation, use the systemctl disable-linger command.


    # Manage Containers as Root with systemd


    You can configure containers to run and manage them with systemd service files.
    One advantage of this approach is that you can configure the service files to
    work exactly like common system units, rather than as a particular user.


    The procedure to create the service file as root is similar to the previously
    outlined procedure for rootless containers, with the following exceptions:


    +   - Do not create a dedicated user for container management.

    - The service file must be in the /etc/systemd/system directory instead of the
    ~/.config/system/user directory.

    - You manage the containers with the systemctl command without the --user option.

    - Do not run the systemctl enable-linger command as the root user.


    For a demonstration, see the YouTube video from the Red Hat Videos channel that
    is listed in the References of this section.


    > References

    logctl(1), systemd.unit(5), systemd.service(5), subid(5), and podman-generate-systemd(1)
    man pages


    Managing Containers in Podman with Systemd Unit Files

    https://www.youtube.com/watch?v=AGkM2GTGIY


    For more information, refer to the Running Containers as Systemd Services with
    Podman in the Red Hat Enterprise Linux 9 Building, Running, and Managing Containers
    Guide at

    https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/9/html-single/running_and_managing_containers/index'
