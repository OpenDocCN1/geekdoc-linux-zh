- pgno: 34
  md: '# Match Text in Command Output with Regular Expressions


    # Objectives


    Create regular expressions to match data, apply regular expressions to text files
    with the **grep** command, and use **grep** to search files and from piped commands.


    # Write Regular Expressions


    Regular expressions provide a matching mechanism that facilitates finding specific
    content. The **vim**, **grep**, and less commands can use regular expressions.
    Programming languages as Perl, Python, and C also support regular expressions,
    but may have minor differences in syntax.


    Regular expressions are a unique language, with their own syntax and rules. This
    section introduces regular expression syntax as implemented in bash, with examples.


    # Describe a Simple Regular Expression


    The simplest regular expression is an exact match of the string to search. An
    exact match is when the characters in the regular expression match the type and
    order of the string.


    Imagine that a user is looking through the following file to look for all occurrences
    of the pattern


    ```

    cat

    dog

    concatenate

    dogma

    category

    educated

    boondoggle

    vindication

    chilidog

    ```


    The **cat** string is an exact match of the c character, followed by the a and
    t characters with no other characters in between. Searching for the file with
    the **cat** string as the regular expression returns the following matches:


    ```

    cat

    concatenate

    category

    educated

    vindication

    ```'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# Match the Start and End of a Line


    The regular expression would match the search string on the line on it occurred:
    the beginning, middle, or word of the line. Use a line anchor metacharistic to
    control where on a line to look for a match.


    To match only at the beginning of a line, use the caret (^). To match only at
    the end of a line, use the dollar sign ($).


    Using the same file as the previous example, the ^cat regular expression would
    match two lines.


    ```

    cat

    category

    ```


    The cat$ regular expression would not find only one match, where the cat characters
    are at the end of a line.


    ```

    cat

    ```


    Locate lines in the file that end with dog by using an end-of-line anchor to create
    the dog$ regular expression, which will match two lines.


    ```

    dog

    chiliog

    ```


    To locate a line that contains only the search expression exactly, use both the
    beginning and end-line anchors. For example, to locate the word cat when it is
    both at the beginning and the end of a line simultaneously, use ^cat$.


    ```

    cat

    ```


    # Wildcard and Multiplier Usage in Regular Expressions


    Regular expressions use a dot (.) to match any single character on a single line.
    The c.t searches for a string that contains a c followed by any single character
    followed by a t. Examples include cat, concatenate, vindication, cut, and c$.


    With an unconstrained wildcard, you cannot predict the character that matches
    the wildcard. To match specific characters, replace the unconstrained wildcard
    with appropriate characters.


    Using bracket characters, such as c[ao]t regular expression matches patterns that
    start with a c, followed by an a, o, or u, followed by a t. Possible matches can
    be the cat, cot, and cut strings.


    Multipliers are a mechanism used with wildcards. Multipliers apply to the previous
    character or wildcard in the regular expression. One of the most commonly used
    multipliers is the asterisk (*). When used in a regular expression, the asterisk
    matches zero or more occurrences of the preceding element. You can use the asterisk,
    in addition to characters.


    For the example, the c[ao]*t regular expression could match coat or court. A regular
    expression of c. *t matches cat, coat, culvert, and even ct (matching zero characters)'
