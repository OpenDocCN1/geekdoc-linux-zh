    Use the podman port command -a option to show all container port mappings in view.
    You can also use the podman port db01 to show the mapped ports for the db01 container.


    ```

    [user@ ~]$ podman -a

    1c2ffdf090512 3306/tcp -> 0.0.0.0:13306

    [user@ ~]$ podman db01

    3306/tcp -> 0.0.0.0:13306

    ```


    You will the firewall-cmd command to allow port 13306 into the container host
    so that it can be redirected.


    ```

    [root@ ~]$ firewall-cmd --add-port=13306/tcp --permanent

    [root@ ~]$ firewall-cmd --reload

    ```


    > Important

    Rootless container cannot open a privileged port (below 1024) on the container.
    That is, the podman -p 80:8080 command does not normally work for a running rootless
    container. To map a port on the container host below 1024 to a container, you
    must run podman as root or make any adjustments to the system.


    You can map a port above 1024 on the container to a privileged port on the container,
    even if you are running a rootless container. The 8080:80 mapping works if the
    container provides service identity on port 80.


    # DNS Configuration in a Container


    Podman v4 supports two network backends for containers, Netavark and CNI. Starting
    with RHEL 9, systems use Netavark by default. To verify which network end is used,
    run the following podman info command.


    ```

    [user@ ~]$ podman info --format {{.Host.NetworkBackend}}

    netavark

    ```'
