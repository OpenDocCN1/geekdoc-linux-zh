    ```


    This error happens because the SELinux context is set on the /home/user/db_data_directory
    on the host machine.


    # SELinux Contexts for Container Storage


    You must set the container_file_t before mounting the persistent storage to a
    container. If the directory does not have the container_file_t SELinux context,
    then the container cannot access the directory. You can append the Z option to
    the argument of the podman run command -v automatically set the SELinux context
    on the directory.


    So you use the podman run -v /home/user/dbfiles:/var/lib/mysql:Z command to set
    the SELinux context for the /home/user/dbfiles directory when you mount it as
    persistent storage for /var/lib/mysql.


    ```

    ```bash

    [user@]$ podman run -d --name db01 \

    -e MYSQL_USER=student \

    -e MYSQL_DATABASE=dev_data \

    -e MYSQL_ROOT_PASSWORD=redhat \

    -v /home/user/dbfiles:/var/lib/mysql:Z \

    registry.example.com/rhel8/mariadb-105

    ```

    ```


    You then verify that the SELinux context is set on the /home/user/dbfiles directory
    with the ls -Z option.


    ```

    ```bash

    [user@]$ ls -Z /home/user/

    system:object_r:container_file_t:s0:c81,c009 dbfiles

    outmitted...

    ```

    ```


    # Assign a Port Mapping to Containers


    To provide network access to containers, clients must connect to ports on the
    container host that pass the network traffic through ports to containers. When
    you map a network port on the container host to a port in the container, network
    traffic is sent to the host port is received by the container.


    For example, you can map the 3306 port on the container host to the 3306 port
    on the container for communication with the MariaDB database. Therefore, traffic
    that is sent to the container host 3306 would be received by MariaDB that is running
    in the container.


    You use the podman run command -p option to set a port mapping from the 3306 port
    from the container host to the 3306 port on the db01 container.'
