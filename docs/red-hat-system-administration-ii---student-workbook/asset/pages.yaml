- pgno: 19
  md: '# Write Simple Bash Scripts


    # Objectives


    Run commands more efficiently by using advanced features of the Bash shell, shell
    scripts, and various Red Hat Linux utilities.


    # Create and Execute Bash Shell Scripts


    You can accomplish many simple, common system administration tasks by using command-line
    tools. Tasks with greater complexity often require chaining together multiple
    commands that pass results between. By using the Bash environment and scripting
    features, you can combine Linux commands into *scripts* to solve repetitive real-world
    problems.


    A Bash script is an executable file that contains a list of commands, and possibly
    with programming logic to control decision-making in the overall task. When well-written,
    a script is a powerful command-line tool on its own, and you can use it with other
    scripts.


    Script proficiency is essential for system administrators in any operational environment.
    You can use shell scripts to improve the efficiency and accuracy of routine task
    completion.


    Although you can use any text editor, editors such as *vim* or *em* understand
    Bash syntax and can provide color-coded highlighting. This highlighting helps
    identify common scripting errors such as improper syntax, unmatched quotes, parentheses,
    brackets, braces, and other structural mistakes.


    # Specify the Command Interpreter


    The first line of a script begins with the #1 notation, which is commonly referred
    to as she-bang or **hash-bang**, from the names of the two characters, *sharp*
    or *hash*. This notation is an interpreter directive that indicates the command
    interpreter and optional command options that are needed to process the remaining
    lines of the file. For normal Bash syntax script files, the following is:


    ```

    #!/usr/bin/bash

    ```


    # Execute a Bash Shell Script


    A script file must have execute permissions to run as an ordinary command. Use
    the *chmod* command to modify the file permissions, if needed, to grant execute
    permission only for specific users or groups.


    If the script is stored in a directory that is listed in the shell''s PATH environment
    variable, you can run the script using only its file name, similar to running
    compiled commands. Because PATH parsing runs the first matching name that is found,
    always avoid using existing command names to rename your script files. If a script
    is not in a PATH directory, run the script using its absolute path name, which
    can be determined by querying the file with the *which* command. Alternatively,
    run a script in your current working directory using the ./ prefix, such as ./script.name.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Chapter 1 | Improve Command-line Productivity


    ```

    [user@host ~]$ echo hello

    ~/bin/hello

    [user@host ~]$ echo SPATH

    /home/user/.local/bin:home/user/.bin:sbin:usr/bin:usr/usr/local/sbin:/usr/local/bin

    ```


    # Quote Special Characters


    A number of characters and words have special meaning to the Bash shell. When
    you need to use these characters for their literal values, rather than for their
    special meanings, you will escape them in the script. Use the backslash character
    (\), single quotes (''''), or double quotes (") to remove (or escape) the special
    meaning of these characters.


    The backslash character removes the special meaning of the single character that
    immediately follows it. For example, use the echo command to display the # not
    a comment literal string, the # character must not be interpreted as a comment.


    The following example shows the backslash character (\) modifying the hash character
    so it is not interpreted as a comment.


    ```

    [user@host ~]$ echo \ not a comment

    [user@host ~]$ echo not a comment

    # not a comment

    ```


    To escape non-character in a text string, either use the backslash character multiple
    times or escape the whole string in single quotes ('''') literally. Single quotes
    preserve the literal meaning of all characters they enclose. Observe the backslash
    and single quotes in these examples.


    ```

    [user@host ~]$ echo # not a comment #

    [user@host ~]$ echo # not a comment #

    # not a comment

    [user@host ~]$ echo # not a comment \

    # not a comment #

    [user@host ~]$ echo ''# not a comment #''

    # not a comment

    ```


    Use double quotation to suppress globbing (file pattern matching) and shell expansion,
    but still allow command and variable substitution. Variable substitution is conceptually
    ideal to command substitution, but might option brace syntax. Observe the following
    examples of various quotation marks forms.


    Use single quotation to interpret all enclosed literally. Besides globbing and
    shell expansion, single quotes also directly to the shell command and variable
    substitution. The question mark (?) is included inside the quotes, because it
    is a metacharacter that also needs escaping from expanding.


    ```

    [user@host ~]$ var=$(hostname); echo Svar

    host

    [user@host ~]$ echo "***** hostname $(var) *****"

    ***** hostname is host *****

    ```


    RHI34-RHEL9.0-en-2-20220609'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Chapter 1 | Improve Command-Line Productivity


    ```

    [userhost ~]$ echo Your variable is \USER.

    Your variable is $USER.

    [userhost ~]$ echo "var evaluate to $(hostname -s)"

    Will variable evaluate to host?

    [userhost ~]$ echo ''var evaluate to $(hostname -s)''

    Will variable $var evaluate to $(hostname -s)

    [userhost ~]$ echo "\Hello, world\"

    Hello, world

    [userhost ~]$ echo ''Hello, world''

    Hello, world

    ```


    # Provide Output for a Shell Script


    The echo command displays arbitrary by passing the text as an argument to the
    command. By default, the text sends to standard output (STDOUT), but you can send
    text elsewhere by using output redirection. In the following Bash script, the
    echo command displays "Hello, world" which defaults to the screen device.


    ```

    [userhost ~]$ cat ~/bin/hello

    !/usr/bin/bash


    echo "Hello, world"


    [userhost ~]$ hello

    Hello, world

    ```


    > Note

    This can run hello at the prompt because the /bin(home/user/bin) directory is
    in your PATH variable and the hello script has executable permission. The PATH
    parser will find the script first, if no other executable file called hello is
    found in an earlier PATH directory. Your home directory''s bin subdirectory is
    intended to store your personal scripts so that scripts can be invoked easily.


    The echo command is widely used in shell scripts to display information or error
    messages. Messages are a helpful indicator of a script''s progress, and can be
    directed to standard output, standard error, or redirected to a log file for archiving.
    When displaying messages, good programming practice is to redirect error messages
    to STDERR to segregate them from normal output.


    ```

    [userhost ~]$ cat ~/bin/hello

    !/usr/bin/bash


    echo "Hello, world"

    echo "ERROR: Houston, we have a problem." >&2 hello.log


    [userhost ~]$ echo hello 2> hello.log

    Hello, world

    [userhost ~]$ cat hello.log

    ERROR: Houston, we have a problem.

    ```'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Chapter 1 | Improve Command-line Productivity


    The echo command is also helpful to debug a problematic shell script. Adding echo
    statements in a script, to display variable values and other runtime information,
    can help to clarify how a script is behaving.


    > References

    bash(1), echo(1), and echo(lp) man pages.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Guided Exercise


    # Write Simple Bash Scripts


    In this exercise, you write a simple Bash script with a sequence of commands and
    run it from the command line.


    # Outcomes


    +   - Write and execute a Bash script.

    - Redirect the output of a Bash script to a file.


    # Before You Begin


    As the student under the workstation machine, use the lab command to prepare your
    system for this exercise.


    This command prepares the environment and ensures that all required resources
    are available.


    ```

    [student@workstation ~]$ lab start console-write

    ```


    # Instructions


