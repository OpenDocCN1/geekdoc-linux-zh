- pgno: 134
  md: '# # Investigate and Resolve SELinux Issues


    # ## Objectives


    Use SELinux log analysis tools and display useful information during SELinux troubleshooting
    with the `sealert` command.


    # ## Troubleshoot SELlinux Issues


    When applications unexpectedly fail due to SELinux access denials, methods and
    tools are available to resolve these issues. It is helpful to start by understanding
    some fundamental concepts and behaviors when SELinux is enabled.


    +   * SELinux consists of targeted policies that explicitly allow actions.

    * A policy entry defines a labeled process and a resource label that will interact.

    * The policy states the process type, file or port context, and the explicit action
    to allow.

    * An action can be a system call, a kernel function, or another specific routine.

    * If no entry is created for a specific process-resource-action relation, then
    the action is denied.

    * When an action is denied, the attempt is logged with useful context information.


    Red Hat Enterprise Linux provides a stable targeted SELinux policy for every service
    in the distribution. Therefore, it is unusual to have SELinux problems with RHEL
    services when they are properly configured. SELinux access problems occur when
    services are implemented incorrectly, or when new applications have incomplete
    policies. Consider these troubleshooting checkpoints before making SELinux configuration
    changes.


    +   * Most denials indicate that SELinux is working properly by blocking improper
    actions.

    * Evaluating denials requires familiarity with normal, expected actions.

    * The most common SELinux issue is an incorrect context on new, copied, or moved
    files.

    * File contexts are easily fixed when an existing policy references their location.

    * Optional Boolean features are documented to verify in the `selinux` man pages.

    * Implementing Boolean features generally requires additional non-SELinux configuration.

    * SELinux policies do not replace or circumvent file permissions or access control
    restrictions.


    When an application or service fails, and the service is known to be working SELinux,
    check the service''s `selinux` man page to verify the correct context type. View
    the affected files and attributes to verify that the correct labels are set.


    # ## Monitor SELinux Violations


    The SELinux troubleshoot service, from the `troubleshoot-server` package, provides
    tools to diagnose SELinux issues. When SELinux denies an action, an Access Vector
    Cache (AVC) message is logged to `/var/log/audit/audit.log` security log file.
    The SELinux troubleshoot service monitors for AVC events and sends events to the
    `/var/log/` messages.


    The AVC summary includes each unique identifier (UUID). Use `sealert -l UUID`
    command to view comprehensive report about the specific event. Use the `sealert
    -var/log/audit/audit.log` command to view all existing events.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# Chapter 4 | Manage SELinux Security


