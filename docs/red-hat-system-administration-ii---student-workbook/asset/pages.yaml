    | 1 | 2048 | 20971486 | 20969438 | primary | xfs | boot |

    | 2 | 20971520 | 104857535 | 83886015 | primary | xfs | |


    As shown in the example, you can also use subcommands (here, unit and print) on
    the same line.


    # Write the Partition Table on a New Disk


    To partition a new device, first write a disk label. The label indicates which
    partitioning scheme to use. Use parted to create an MBR disk label or a GPT disk
    label.


    ```

    [root ~]# parted /dev/vdb mklabel msdos

    [root ~]# parted /dev/vdb mklabel gpt

    ```


    > >WarningnThe mk label subcommand wipes the existing partition table. Use the
    mk label subcommand when the intent is to regard the disk without the existing
    data. If a new label moves the partition boundaries, then all data in existing
    file systems becomes inaccessible.


    # Create MBR Partitions


    The following instructions create an MBR disk partition. Specify the disk device
    to create the partition on.


    Run the parted command and specify the device name as an argument, to start in
    interactive mode. The session displays (parted) as a subcommand prompt.'
