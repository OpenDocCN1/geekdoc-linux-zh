    # Environment Isolation in Containers


    Containers isolate the environment of an application. Each container has its own
    file system, networking, and processes. You can notice the isolation feature when
    you look at the output of the ps command and compare it the host machine and a
    running container.


    You run first ps -ax on the local machine and the command returns expected result
    with many processes.


    ```

    [root@host ~]# ps -ax

    PID TTY  STAT TIME COMMAND

    ndeseriali\1 ?       S    0:00 /usr/lib/systemd/systemd --switched-root --system

    2 ?       S    0:00 [kthread]

    3 ?       I<   0:00 [rcu_gp]

    4 ?       I<   0:00 [rcu_par_gp]

    output omitted.

    ```


    The podman command executes a command inside a running container. The container
    takes the name or ID of the container as the first argument and the following
    arguments as commands to run inside the container. You use the podman command
    to view the running processes in the python36 container. The output from the ps
    command looks different, because it is different processes from the local machine.


    ```

    [student~$] podman exec python38 ps -ax

    PID TTY  STAT TIME COMMAND

    1 ?       S    0:00 /usr/bin/coreutils --coreutils-prog-shebang=sleep /

    usr/bin/sleep infinity

    7 ?       R    0:00 ps -ax

    ```'
