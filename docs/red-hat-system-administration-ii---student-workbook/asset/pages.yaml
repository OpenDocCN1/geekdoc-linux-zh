  md: '# Chapter 3 | Tune Performance


    ```

    [main]

    summary=Optimize for running inside a virtual guest

    include=throughput-performance

    ```


    ```

    [sysctl]

    # If a workload uses anonymous memory and it hits this limit, the entire

    # working set is buffered for I/O, and any more write buffer would require

    # swapping, so it''s time to throttle writes until I/O can catch up. Workloads

    # that use file mappings may be even higher values.

    #n# The generator of dirty data starts writeback at this percentage (system default

    # is 20%)

    vm.dirty_ratio=30

    ```


    ```

    # Filesystem I/O is usually much more efficient than swapping, so try to keep

    # swapping. It''s usually safe to go lower than this on systems with

    # server-grade storage.

    vm.swappiness=30

    ```


    The main in the file may include a summary of the tuning profile. This section
    also accepts the include parameter, that you can use to make the profile inherit
    all the settings from the referenced profile.


    This is very useful when creating tuning profiles, because you can use one of
    the provided profiles as a base and then modify the parameters you want to configure.
    To create copy the profile files from the /usr/lib/tuned directory to the /etc/tuned
    directory and then modify them. In there are profile directories with the same
    name under the /usr/lib/tuned and /etc/tuned directories, the latter always takes
    precedence, never directly modifies files in the /usr/lib/tuned system directory.


    The rest of the sections in the tuned.conf file use tuning plug-ins to modify
    parameters in the system. In the previous example, the [sysctl] section modifies
    the vm.dirty_ratio and vm.swappiness kernel parameters through the sysctl plug-in.


    # Manage Profiles from the Command Line


    Use the tuned-adm command to change the settings of the tuned daemon. The tuned-adm
    command queries current settings, lists available profiles, recommends a tuning
    profile for the system, changes profiles, or turns off tuning.


    You can identify the active tuning profile with the tuned-adm active command.


    ```

    [root@host ~]# tuned-adm active

    Current active profile: virtual-guest

    ```


    The tuned-adm list lists all available tuning profiles, including built-in profiles
    and the custom-created profiles.


    ```

    [root@host ~]# tuned-adm list

    Available profiles:

    - accelerator-performance

    - Throughput performance based tuning with ...n- balanced

    - General non-specialized tuned profile

    - desktop

    - Optimize for the desktop use-case

    - hpc-compute

    - Optimize for HPC compute workloads

    ```'
