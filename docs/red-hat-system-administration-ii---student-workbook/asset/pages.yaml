- pgno: 164
  md: '# Manage Swap Space


    # Objectives


    Create and manage swap spaces to supplement physical memory.


    # Swap Space Concepts


    A swap space is an area of a disk under the control of the Linux kernel memory
    management subsystem. The kernel uses swap space to supplement the RAM. A system''s
    virtual memory encompasses the combined RAM and swap space.


    When the memory usage on a system exceeds a defined limit, the kernel searches
    through RAM to look for idle pages that are assigned to processes. The kernel
    writes the idle pages to the swap area and reclaims the RAM to processes. If a
    program requires access to a page on disk, the kernel locates another idle page
    of memory, writes to disk, and recalls the needed page from swap space.


    Because swap areas are on disk, swap is slow when compared to RAM. Although swap
    space augments RAM, do not consider swap space as a sustainable solution for insufficient
    RAM for your workload.


    # Swap Space Calculation


    Administrators size the swap space based on the memory workload on the system.
    Application vendors sometimes provide recommendations for calculating swap space.
    The following table provides guidance based on the total physical memory.


    RAM and Swap Space Recommendations


    | RAM | Swap space | Swap space if allowing for hibernation |

    |---|---|---|

    | 2 GB or less | Twice the RAM | Three times the RAM |

    | Between 2 GB and 8 GB | Same as RAM | Twice the RAM |

    | Between 8 GB and 64 GB | At least 4 GB | 1.5 times the RAM |

    | More than 64 GB | At least 4 GB | Hibernation is not recommended |


    The laptop and desktop hibernation functions use the swap space to save the RAM
    contents before powering off the system. When you turn the system back on, the
    kernel restores the RAM contents from swap space and does not need a complete
    boot. For those systems, swap space must be greater than the amount of RAM.


    The Knowledgebase article in References at the end of this section gives more
    guidance on sizing the swap space.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# Create Swap Space


    To create a swap space, you need to perform the following steps:


    +   - Create a partition with a file-system type linux - swap.

    - Place a swap signature on the device.


    # Create a Swap Partition


    Use the parted command to create a partition of the appropriate size and set its
    file-system type to linux - swap. In the past, tools determined from the partition
    file-system type whether to activate the device; however, that requirement is
    no longer the case. Even though no longer the partition file-system type, administrators
    can quickly determine the partition''s purpose from that type.


    The following example creates a 256 MB partition.


    ```

    [root@host ~]# parted /dev/vdb

    GNU Parted 3.4

    Using /dev/vdb

    Welcome to GNU Parted! Type ''help'' to view a list of commands.

    (parted) print

    Model: Virtio Block Device (virtblk)

    Disk /dev/vdb: 5360MB

    Sector size (logical/physical): 512B/512B

    Partition Table: gpt

    Disk Flags:

    Number Start End Size File system Name Flags

    1 1049KB 1001MB 1000MB data

    (parted) mkpart

    Partition name? [] swap1

    File system type? [2] linux-swap

    Start? 1001MB

    End? 1257MB

    (parted) print

    Model: Virtio Block Device (virtblk)

    Disk /dev/vdb: 5360MB

    Sector size (logical/physical): 512B/512B

    Partition Table: gpt

    Disk Flags:

    Number Start End Size File system Name Flags

    1 1049KB 1001MB 1000MB data

    2 1001MB 1257MB 256MB linux-swap(v1) swap1

    (parted) quit

    Information: You may need to update /etc/fstab.

    [root@host ~]#

    ```


    After creating the partition, run the udevadm settle command. This command waits
    for the system to detect the new partition and create the associated device file
    in the /dev directory. The command returns only when it is finished.'
  merge: -1
