- pgno: 346
  md: '# Deploy Containers


    # Objectives


    Discuss container management tools using registries to store and retrieve images,
    and for deploying, querying, and accessing containers.


    # The Podman Utility


    Podman is a fully featured container engine from the container-tools meta-package
    to manage Open Container Initiative (OCI) containers and images. The podman utility
    does not use a daemon to function, and developers do not need a privileged account
    on the system to start or stop containers. Podman provides multiple commands to
    interact with containers and images. The following list shows commands that are
    used in this section:


    # Podman Commands


    | Command | Description |

    | --- | --- |

    | podman-build | Build a container image with a container file. |

    | podman-run | Run a command in a new container. |

    | podman-images | List images in local storage. |

    | podman-ps | Print information about containers. |

    | podman-inspect | Display configuration of a container, volume, network, or pod.
    |

    | podman-pull | Download an image from a registry. |

    | podman-cp | Copy files or folders between a container and the local file system.
    |

    | podman-exec | Execute a command in a running container. |

    | podman-rm | Remove one or more containers. |

    | podman-rmi | Remove one or more stored images. |

    | podman-search | Search for an image. |


    To cover the topics in this lecture, imagine the following scenario.


    As a system administrator, you tasked to run a container that is based on the
    RHEL 8 UBI container image called python38 with the python-38 package. You are
    also to create a container image from the first and run a container called python36
    from that image. The container image that is created with the first must have
    the python36:1 tag. It identifies the differences between the two containers.
    Also ensure that the installed python packages in the containers do not conflict
    with the installed Python version in your local machine.'
  merge: -1
  img_proc: true
