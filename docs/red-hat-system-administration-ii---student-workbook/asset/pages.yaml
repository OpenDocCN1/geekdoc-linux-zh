- pgno: 194
  md: '# Chapter 6 | Manage Storage Stack


    # Guided Exercise


    # Create and Extend Logical Volumes


    In this lab, you create and extend a physical volume, volume group, logical volume,
    and an XFS file system. You also persist the logical volume file system.


    # Outcomes


    +   - Create physical volumes, volume groups, and logical volumes with LVM tools.

    - Create new file systems on logical volumes and persistently mount them.

    - Extend the volume group to include an additional physical volume.

    - Resize the logical volume while the file system is mounted and in use.


    # Before You Begin


    As the student under the workstation machine, use the lab command to prepare your
    system for this exercise.


    This command prepares your environment and ensures that all required resources
    are available.


    ```

    [workstation] $ lab start svm-manage

    ```


    # Instructions


    +   1. Log in to the server machine as the student user and switch to the root
    user.


    ```

    [workstation] $ ssh student@servera

    ...output omitted...

    [student@servera ~]$ sudo -i

    password for student:

    [root@servera ~]

    ```


