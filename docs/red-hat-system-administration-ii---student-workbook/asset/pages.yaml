- pgno: 113
  md: '# Change the SELinux Enforcement Mode


    # Objectives


    Explain how SELinux protects resources, change the current SELinux mode of a system,
    and the default SELinux mode of a system.


    # Describe SELinux Architecture


    Security Enhanced Linux (SELinux) is a critical security feature of Linux. Access
    to files, ports, and other resources is controlled at a granular level. Processes
    are permitted to access only the resources that the SELinux policy or Boolean
    settings specify.


    File permissions control access for a specific user or group. However, file permissions
    do not prevent an unauthorized user with access from using a file for an unintended
    purpose.


    For example, with access to a file, other editors or programs can still open and
    modify a structured data file that is designed for a specific program to write,
    which could result in corruption or a data security issue. File permissions do
    not stop undesired access because they control how a file is used by only who
    is allowed to read, write, or run a file.


    SELinux consists of application-specific policies that the developers define to
    declare precisely what accesses and are allowed for each binary executable, configuration,
    and data that the application uses. This policy is known as a targeted policy,
    because one policy defines the predefined labels for individual programs, files,
    and network ports.


    # SELinux Usage


    SELinux enforces a set of access rules that explicitly define allowed actions
    between processes and resources. Any action that is not defined in an access rule
    is not allowed. Because only defined actions are allowed, applications with a
    targeted policy run in a confined domain, whereas an application without a policy
    runs unconfined but without any SELinux protection. Individual targeted policies
    can be disabled to assist with application and security policy development and
    debugging.


    SELinux has the following operational modes:


    +   * **Enforcing**: SELinux enforces the loaded policies. This mode is the default
    in Red Hat Enterprise Linux.

    * **Permissive**: SELinux loads the policies and is active, but instead of enforcing
    access control rules, it logs access violations. This mode is helpful for testing
    and troubleshooting applications and rules.

    * **Disabled**: SELinux is turned off. SELinux violations are not denied or logged.
    Disabling SELinux is strongly discouraged.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Chapter 4 | Manage SELinux Security


    > Important

    Starting in Red Enterprise Linux 9, SELinux can be fully disabled by only using
    the selinux=0 kernel parameter at boot. RHEL no longer supports setting the SELINUX=
    option in the /etc/selinux/config file.


    Starting in RHEL 9, disabling SELinux in the /etc/selinux/config file results
    in SELinux starting and performing active enforcement, but without any policies.
    Policy rules define allowed actions, if no policies are loaded then all actions
    are denied. This behavior is intentional, and is designed to block malicious SELinux
    protection.


    # Basic SELinux Concepts


    The primary goal of SELinux is to protect user data from improper by compromised
    applications or services. Most Linux administrators are familiar with the standard
    user, group, and file permission security model, which is Discretionary Access
    Control (DAC) because administrators set file permissions as. SELinux provides
    an additional layer of object-based security, which is defined in granular rules,
    which are Mandatory Access Control (MAC) because policies apply to all users and
    cannot be bypassed by specifies configuration settings.


    For example, a web server opens few port to allow remote access to a web client.
    However, a malicious user that accesses port might try to compromise a system
    through an existing vulnerability. If an example vulnerability compromises the
    permissions for the access user and then, a malicious user directly accesses the
    /var/www/html document root content, or the system''s /var/tmp directories, or
    other files and directories.


    SELinux policies are security rules that define how specific access relevant files,
    directories, and ports. Every resource, such as a file, process, or directory,
    has a label called an SELinux context. The context label defines a SELinux policy
    to allow access to the labeled resource. By default, a SELinux policy does not
    allow any access unless an explicit rule grants access. When no rule is defined,
    all access is disallowed.


    SELinux labels use user, role, type, and level fields. Targeted policy, which
    is enabled in RHEL 9, by default defines rules using the type context. Context
    names typically end with _t.


    | SELinux User | Role | Type | Level | File |

    | unconfined_u:object_r:httpd_sys_content_t:var/www/html/file2 |


    Figure 4: SELinux file context


    # Policy Access Rule Concepts


    For example, a web server is labeled with the httpd_t type context. Web servers
    and directories in the /var/www/html directory and other locations are labeled
    with the httpd_sys_content_t type context. Temporary files in the /tmp and /var/tmp
    directories have the temp_t contexts as label. The web server''s ports have the
    http_port_type context as a label.


    An Apache server runs with the httpd_t type context. A policy rule permits the
    Apache server to access files and directories that are labeled with the httpd_sys_content_t
    type context. By default, in the /var/www/html directory'
  merge: -1
  img_proc: true
