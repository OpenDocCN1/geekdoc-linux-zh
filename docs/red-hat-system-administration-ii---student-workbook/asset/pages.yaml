- pgno: 83
  md: '# Adjust Tuning Profiles


    # Objectives


    Optimize system performance by selecting a tuning profile that the tuned daemon
    manages.


    # Tune Systems


    System administrators optimize the performance of a system by adjusting device
    settings based on various use workloads. The tuned daemon applies tuning adjustments
    both statically and dynamically using tuning profiles that reflect particular
    workload requirements.


    # Configure Static Tuning


    The tuned daemon applies system settings when the service starts or selecting
    a new tuning profile. Static tuning configures parameters in profiles that the
    tuned daemon applies at runtime. With static tuning, the tuned daemon sets kernel
    parameters for overall performance expectations, without adjusting these parameters
    as activity levels change.


    # Configure Dynamic Tuning


    With dynamic tuning, the tuned daemon monitors system activity and adjusts settings
    to runtime behavior changes. The tuned daemon continuously adjusts tuning to fit
    the current workload, starting with the initial declared in your selected tuning
    profile.


    For example, storage devices experience high usage during startup and log in,
    but have minimal activity when workload consists of web browsers and email clients.
    CPU and network device activity increases during peak usage throughout the day.
    The tuned daemon monitors these components and adjusts settings to maximize performance
    during high-activity times and reduces settings during low activity. Predefined
    tuning profiles provide performance parameters that the tuned daemon uses.


    To monitor and adjust settings, the tuned daemon uses modified kernel modules
    and tuning-ins, respectively.


    Tuning-ins monitor the activity and obtain information from it, so the tuning-ins
    use this information for dynamic tuning. At this moment, the tuned daemon uses
    three types of tuning-ins:


    +   - disk: Monitors the load base on the number of IO operations for every disk
    device.

    - net: Monitors the network load based on the number of transferred packets per
    network card.

    - load: Monitors the CPU load for every CPU.


    Tuning-ins use the individual subsystems. They use the data obtained by the tuning-ins
    and the performance parameters provided by the predefined tuning profiles. Among
    others, the tuned daemon changes with the following tuning-ins:


    +   - disk: Sets different parameters, for example, the disk scheduler, the spin-down
    timeout, and the advanced power management.

    - net: Configures the interface speed and the Wake-on-LAN (WoL) functionality.

    - cpu: Sets different CPU parameters, for example, the CPU governor or the latency.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Chapter 3 | Tune System Performance


    By default, tuning is disabled. You can enable it by setting the dynamic_tuning
    variable in the /etc/tuned/tuned-min.conf configuration file. If you enable dynamic
    tuning, the tuned daemon monitors the system and adjust the tuning to reflect
    behavior changes. You can set the seconds in updates by using the update_interval
    variable in the /etc/tuned/tuned-min.conf configuration file.


    ```

    [root]#$ cat /etc/tuned/tuned-min.conf

    ...output omitted...

    # Dynamically tune devices, if disabled only static tuning will be used.

    dynamic_tuning = 1

    ...output omitted...

    # Update interval for dynamic tuning (in seconds)

    update_interval = 10

    ...output omitted...

    ```


    # The tuned Utility


    A minimal Red Enterprise Linux installation includes the tuned package by default.
    You can install and enable the package by using the following commands:


    ```

    [root]#$ dnf install tuned

    ...output omitted...

    [root]#$ systemctl enable --now tuned

    Created link /etc/systemd/system/multi-user.target.wants/tuned.service - /usr/lib/systemd/system/tuned.service.

    ```


    The tuned provides profiles in the following categories:


    +   - Power-saving profiles

    - Performance-boosting profiles


    The performance-boosting profiles include profiles that focus on the following
    aspects:


    +   - Low latency for storage and network

    - High throughput for storage and network

    - Virtual machine performance

    - Virtualization host performance


    The next table shows a list of tuning profiles distributed with Red Hat Enterprise
    Linux 9.


    | Tuned Profile | Purpose |

    | balanced | Ideal for systems that require a compromise between saving and performance.
    |

    | power save | Tunes the system for maximum power saving. |

    | throughput-performance | Tunes the system for maximum throughput. |

    | accelerator-performance | Tunes as throughput-performance, and also reduces
    the latency to less than 100 µs. |'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Chapter 3 | Tune System Performance


    | Tuned Profile | Purpose |

    | latency-performance | Ideal for server systems that require low latency at the
    expense of consumption. |

    | network-throughput | Derived from the throughput-performance profile. Additional
    network tuning parameters are applied for maximum network throughput. |

    | network-latency | Derived from the latency-performance profile. Enables additional
    network tuning parameters to provide low latency. |

    | desktop | Derived from the balanced profile. Provides faster response of interactive
    applications. |

    | hpc-compute | Derived from the latency-performance profile. Ideal for high-performance
    computing. |

    | virtual-guest | Tunes the system for maximum performance if it runs on a virtual
    machine. |

    | virtual-host | Tunes the system for maximum performance if it acts as a host
    for virtual machines. |

    | intel-sst | Optimized for systems with Intel Select Technology configurations.
    Use it as an overlay on other profiles. |

    | optimize-serial-console | Increases responsiveness of the serial console. Use
    it as an overlay on other profiles. |


    The tuned application stores the tuned profiles under /usr/lib/tuned and /etc/tuned
    directories. Every profile has a separate directory, and uses the tuned.conf configuration
    file and, optionally, other files.


