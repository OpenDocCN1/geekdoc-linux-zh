  md: "# Use the If/Then/Else Construct\n\nYou can further enhance the if/then construct\
    \ so that it takes different sets of actions depending on whether a condition\
    \ is met. Use the if/then/else construct to accomplish this behavior, in this\
    \ example:\n\n```\n<CONDITION>; then\n  <STATEMENT>\n  ...\n  <STATEMENT>\nelse\n\
    \  <STATEMENT>\n  ...\n  <STATEMENT>\nfi\n```\n\nThe following code section demonstrates\
    \ an if/then/else statement to start the psact service if it is not active, and\
    \ to stop it if it is active:\n\n```\n[user@host]$ systemctl is-active psact >\
    \ /dev/null 2>&1 \\\n[user@host]$ if [[ $? -ne 0 ]]; then \\\n  sudo systemctl\
    \ start psact; \\\nelse \\\n  sudo systemctl stop psact; \\\n  fi\n```\n\n# Use\
    \ the If/Then/Elif/Then/Else Construct\n\nExpand an if/then/else construct to\
    \ test more than one condition and execute a different set of actions when it\
    \ meets a specific condition. The next example shows the construct for an added\
    \ condition:\n\n```\n<CONDITION>; then\n  <STATEMENT>\n  ...\n  <STATEMENT>\n\
    elif <CONDITION>; then\n  <STATEMENT>\n  ...\n  <STATEMENT>\nelse\n  <STATEMENT>\n\
    \  ...\n  <STATEMENT>\nfi\n```\n\nIn this conditional structure, Bash tests the\
    \ conditions as they are ordered in the script. When a condition is true, Bash\
    \ executes the actions that are associated with the condition and skips the remainder\
    \ of the conditional structure. If none of the conditions are true, Bash executes\
    \ the actions in the else clause.\n\nThe following example demonstrates the use\
    \ of an if/then/elif/then/else statement to run the mysql client if the mariadb\
    \ service is active, or run the postgresql client if the postgresql"
