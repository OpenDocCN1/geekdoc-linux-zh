- pgno: 16
  md: 'At the start of an exercise, if instructed to reset a single virtual machine
    node, click ACTION > Reset for only that specific virtual machine.


    At the start of an exercise, if instructed to reset all virtual machines, click
    ACTION > Reset on every virtual machine in the list.


    If you want to reset the classroom environment to its original state at the start
    of the course, then click DELETE to remove the entire environment. After the lab
    is deleted, then click CREATE to provide a new set of classroom systems.


    > Warning The DELETE operation cannot be undone. All completed work in the classroom
    environment is lost.


    # The Auto-stop and Auto-destroy Timers


    The Red Hat Online Learning enrollment entitles you to a set of allotment time.
    To help conserve your allotted time, the ROLE classroom uses timers, which shut
    down or delete the classroom environment when the appropriate timer expires.


    To adjust the timers, locate the two + buttons at the bottom of the course management
    page. Click the auto-stop + button to add another hour to the auto-stop timer.
    Click the auto-destroy + button to add another day to the auto-destroy timer.
    Auto-stop has a maximum of 11 hours, and auto-destroy has a maximum of 14 days.
    Be careful to keep the timers set while you are working, so that your environment
    is not unexpectedly shut down. Be careful not to set the timers unnecessarily
    high, which could waste your subscription time allotment.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Performing Lab Exercises


    You might see the following lab activity types in this course:


    +   - A **guided exercise** is a hands-on practice exercise that follows a presentation
    section. It walks you through a procedure to perform, step by step.

    - A **quiz** is typically used when checking knowledge-based learning, or when
    a hands-on activity is impractical for some reason.

    - An **end-of-chapter lab** is a gradeable hands-on activity to check your learning.
    You work through a set of high-level steps, based on the guided exercises in that
    chapter, that the steps do not work through every command. A solution is provided
    with a step-by-step walkthrough.

    - A **comprehensive review lab** is used at the end of the course. It is also
    a gradeable hands-on activity, and might require you to work through what to accomplish
    in the activity, without receiving the specific steps to do. Again, a solution
    is provided with a step-by-step walkthrough that meets the specification.


    To prepare your lab environment at the start of each hands-on activity, run the
    `start` command with a specific activity name from the instructions. Likewise,
    at the end of each hands-on activity, run the `finish` command with that same
    activity name to clean up after the activity. Each hands-on activity has a unique
    name within a course.


    The syntax for running exercise script is as follows:


    ```

    [student]@workstation ~$} lab action exercise

    ```


    The action is a choice of **start**, **grade**, or **finish**. All exercises support
    `start` and `finish`. Only end-of-chapter labs and comprehensive review labs support
    `grade`.


    # start


    The `start` action verifies the required resources to begin an exercise. It might
    include configuring settings, creating resources, checking prerequisite services,
    and verifying outcomes from previous exercises. You can take an exercise at any
    time, without taking preceding exercises.


    # grade


    For foldable activities, the `grade` action directs the `lab` command to evaluate
    your work, and shows a list of grading criteria with a `PASS` or `FAIL` status
    for each. To achieve a `PASS` status for all criteria, fix the failures and rerun
    the `grade` action.


    # finish


    The `finish` action cleans up resources that were configured during the exercise.
    You can take an exercise as many times as you want.


    The `lab` command supports tab completion. For example, to list all exercises
    that you can start, enter `lab start` and then press the `Tab` key.'
  merge: -1
  img_proc: true
