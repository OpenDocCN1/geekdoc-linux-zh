- pgno: 365
  md: "# Chapter 11 | Run Containers\n\nThe preceding output shows that in the container,\
    \ the root user (UID and GID of 0) maps to your user (UID and GID of 1000) on\
    \ the host machine. In the container, the UID and GID of 1 maps to the UID and\
    \ GID of 100000 on the host machine. Every UID and GID increments by 1. For example,\
    \ the UID and GID of 30 inside a container maps to the UID and GID of 10029 on\
    \ the host machine.\n\nYou use the **podman** command to view the user UID and\
    \ GID inside the container that is running with ephemeral.\n\n```\n[user@host~$]\
    \ podman exec -it db1 mysql /etc/passwd\nmysql:x:27:27:MySQL Server:/var/lib/mysql:/sbin/login\n\
    ```\n\nYou de mount the /home/db_data directory to provide persistent storage\
    \ on the /var/lib/mysql directory of the container. You then create the /home/db_data\
    \ directory and use the podman unshare command to set the user namespace UID and\
    \ GID of 27 as the owner of the directory.\n\n```\n[user@host~$] mkdir /home/user/db_data\n\
    [user@host~$] podman unshare chmod 27:27 /home/user/db_data\n```\n\nThe UID and\
    \ GID of 27 in the container maps to the UID and GID of 100026 on the host machine.\
    \ You can verify the mapping by viewing the ownership of the /home/user/db_data\
    \ directory with the ls command.\n\n```\n[student@workstation~$] ls -l /home/user/\n\
    0 drwxr-xr-x.3 100026 100026 18 May 5 14:33 db_data\n... omitted\n```\n\nNow that\
    \ the file-system permissions are set, you use the podman run command -v option\
    \ to mount the directory.\n\n```\n[user@host~$] podman run -d --name db1 \\\n\
    \  -e MYSQL_USER=student \\\n  -e MYSQL_PASSWORD=student \\\n  -e MYSQL_DATABASE=dev_data\
    \ \\\n  -e MYSQL_ROOT_PASSWORD=redhat \\\n  -v /home/db_data:/var/lib/mysql \\\
    \n  registry.lab.example.com/rhel8/mariadb-105\n```\n\nYou notice that db01 is\
    \ not running.\n\n```\n[user@host~$] podman ps -a\nCONTAINER ID STATUS PORTS NAMES\
    \ COMMAND\nCREATED dfdc20cf9a7e registry.lab.example.com/rhel8/mariadb-105 latest\
    \ run-mysqld\n29 seconds ago Exited (1) 29 seconds ago db01\n```\n\nThe podman\
    \ container logs show a permission error for the /var/lib/mysql/data directory.\n\
