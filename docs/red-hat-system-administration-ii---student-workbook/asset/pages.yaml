  md: 'multi-user.target Instead of editing this symbolic link by hand, the systemctl
    command provides two subcommands to manage this link: get-default and set-default.


    ```

    [root@#] systemctl get-default

    multi-user.target

    [root@#] systemctl set-default graphical.target

    Removed symlink /etc/systemd/etc/systemd/default.target -> /usr/lib/systemd/system/

    graphical.target.

    [root@#] systemctl get-default

    graphical.target

    ```


    # Select a Different Target at Boot Time


    To select a different target at boot, append the systemd.unit=target.target option
    to the kernel command line from the boot loader.


    For example, to boot the system into a rescue shell where you can change the system
    configuration with no services running, appending the following option to the
    kernel command line from the boot loader.


    ```

    systemd.unit=rescue.target

    ```


    This configuration change only affects a single boot, making it a useful tool
    to troubleshoot the boot process.


    To use this method to select a different target, use the following procedure:


    +   1. Boot or reboot the system.

    2. Interrupt the boot loader menu countdown by pressing any key (except Enter
    which would initiate a normal boot).

    3. Move the cursor to the kernel entry that you want to start.

    4. Press e to edit the current entry.

    5. Move the cursor to the line that starts with Linux. This is the kernel command
    line.

    6. Append systemd.unit=target.target. For example, systemd.unit=emergency.target.

    7. Press Ctrl+x to boot with these changes.'
