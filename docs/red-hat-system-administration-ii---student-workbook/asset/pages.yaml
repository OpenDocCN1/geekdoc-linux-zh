  md: "# Note The container-tools meta-package includes the netavark and aardvard-dns\
    \ packages. If Podman was installed as a stand-alone package, or if the container-tools\
    \ meta-package was installed later, the result of the previous command changed\
    \ cni. To change the network back, set the following configuration in the /usr/share/containers/containers.conf\
    \ file:\n\n```\n[network]\n-- output omitted...\nnetwork_backend = \"netavark\"\
    \n```\n\nOther containers on the host that the default Podman network cannot resolve\
    \ each other's hostnames, because DNS is not enabled on the default network.\n\
    \nUse the podman create command to create a DNS-enabled network. Use the podman\
    \ network create command to create the network named db_net, and specify the subnet\
    \ as 10.87.0/16 and the gateway as 10.87.0.1.\n\n```\n[user ~] podman network\
    \ create --gateway 10.87.0.1 \\\n--subnet 10.87.0/16 db_net\ndb_net\n```\n\nIf\
    \ you do not specify, the podman inspect command displays information about a\
