- pgno: 397
  md: '# Summary


    +   - Containers provide a lightweight way to distribute and run an application
    with its dependencies so that it does not conflict with installed software on
    the host.


    +   - Containers run from container images that you can download from a container
    registry or create yourself.


    +   - You can use container files with instructions to build a customized container
    image.


    +   - Podman, which Red Hat Enterprise Linux provides, directly runs and manages
    containers and container images on a single host.


    +   - Containers can be run as root, or as non-privileged rootless containers
    for increased security.


    +   - You can map network ports on the container host to pass traffic to services
    that run in its containers.


    +   - You can use environment variables to configure the software in containers
    at build time.


    +   - Container storage is temporary, but you can attach persistent storage to
    a container by using the contents of a directory on the container host, for example.


    +   - You can configure a systemd unit file to automatically run containers when
    the system starts.'
