  md: '# Examples of the grep Command


    The following examples use configuration files and log files.


    Regular expressions are case-sensitive by default. Use the grep -i option to run
    a case-insensitive search. The following example shows an excerpt of the /etc/httpd/httpd.conf
    configuration file.


    ```

    [user@Host -]$$ cat /etc/httpd/httpd.conf

    ...omitted...

    #

    ServerRoot "/etc/httpd"

    #

    # Listen: Allows you to bind Apache to specific IP addresses and/or

    # ports, instead of the default. See also <VirtualHost>

    # directive.

    #

    # Change this to Listen on a specific IP address, but note that if

    # httpd.service is enabled to run at boot, the address may not be

    # available when the service starts. See the httpd.service(8) man

    # page for more information.

    #

    #Listen 12.34.56.78:80

    Listen 80

    ...omitted...

    ```


    The following example searches for the regular expression in the /etc/httpd/httpd.conf
    configuration file.


    ```

    [user@Host -]$$ grep -i serverroot /etc/httpd/httpd.conf

