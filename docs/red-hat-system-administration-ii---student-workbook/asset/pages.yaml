- pgno: 245
  md: '# Select the Boot Target


    # Objectives


    Describe the Red Enterprise Linux boot process, set the default target when booting,
    and boot a system to a non-default target.


    # Describe the Red Hat Enterprise Linux 9 Boot Process


    Modern computer systems are complex combinations of hardware and software. Starting
    from an undefined, powered-down state to a running system with a login prompt
    requires many pieces of hardware and software to work together. The following
    list gives a high-level overview of the tasks involved for a physical x86_64 system
    booting Red Hat Enterprise Linux 9. The list for x86_64 virtual machines is nearly
    the same, but the hypervisor handles some hardware-specific steps in software.


    +   * The machine is powered on. The system firmware, either modern UEFI or older
    BIOS, runs a Power On Self Test (POST) and starts to initialize the hardware.

    * Configured using BIOS or UEFI configuration settings that you typically reach
    by pressing a specific key combination, such as F2, early during the boot process.

    * The system firmware searches for a bootable device, either configured in the
    UEFI firmware or by searching for a Master Boot Record (MBR) in all disks, in
    the order configured in the BIOS or UEFI.

    * Configured using BIOS or UEFI configuration schemes, which you typically reach
    by pressing a specific key combination, such as F2, early during the boot process.

    * The system firmware reads a loader from disk and then passes control of the
    system to the boot loader. On Red Hat Enterprise Linux 9, the boot loader is the
    GRandLoader version 2 (GRUB2).


    Configured using grub2-install command, which installs GRUB2 as the boot loader
    for the BIOS disks. You may use the grub2-install command directly to install
    the UEFI boot loader. RHEL provides a /boot/efi/efi/redhat/grubx64.efi file, which
    contains the required authentication signatures for a Secure Boot System. Executing
    grub2-install directly on a UEFI system generates a new grubx64.efi file without
    those required signatures. You can restore the grubx64.efi file from the grub2-efi
    package.


    +   * GRUB2 loads its configuration from the /boot/grub/grub.cfg file for BIOS
    and the /boot/efi/EFI/redhat/grub.cfg file for UEFI, and displays a menu where
    you can select which kernel to boot.


    Configured using /etc/grub.d directory, and the /etc/default/grub file, grub2-mkconfig
    command generates the /boot/grub/grub.cfg or /boot/efi/EFI/ file for BIOS or UEFI,
    respectively.


    +   * After you select a kernel, or the timeout expires, the boot loader loads
    the kernel and initramfs from disk and places them in memory. An initramfs is
    an archive containing the kernel modules for all the hardware required at boot,
    initialization scripts, and. On Red Hat Enterprise Linux 9, the initramfs contains
    an entire usable system by itself.'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'Configured with the /etc/dracut.d/ directory, the dracut command, and the linitrd
    command to initialize the initramfs.


    +   - The boot loader takes control over the kernel, passing in any options specified
    by the kernel command line in the boot loader, and the location of the initramfs
    in memory.


    Configured with /etc/grub.d, the /etc/default/grub file, and the grub2-mkconfig
    command to generate the /boot/grub2/grub.cfg file.


    +   - The kernel initializes all hardware for it can find a driver in the initramfs
    as PID 1. On Red Hat Linux 9, /sbin/init is a link to systemd.


    Configured the kernel init=command-line parameters.


    +   - The systemd instance from the initramfs executes all units for the initrd
    target. This includes the root file system on disk from the /sysroot directory.


    +   - Configured with /etc/fstab file.


    +   - The kernel switches (pivots) the root file system from initramfs to the
    root file system in the /sysroot directory, then re-executes it using the copy
    of system installed on the disk.


    +   - systemd looks for a default target, either passed in the kernel command
    line or on the system, then starts (stops) units to comply with the configuration
    for that target, solving dependencies between units. In essence, a systemd target
    is a set of units that the system should activate to reach the desired state.
    These targets typically start a text-based UI or a graphical login screen.


    Configured with /etc/systemd/default.target file and the /etc/systemd/directory.


    ![](img/2eff90170b8c94cce3a908ab927e38c2_246_0.png)'
  merge: -1
