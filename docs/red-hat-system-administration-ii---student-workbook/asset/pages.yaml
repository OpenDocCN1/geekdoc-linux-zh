  md: '# Automount Network-Attached Storage


    # Objectives


    Describe the benefits of using the automounter, and automount NFS exports by using
    direct and indirect maps.


    # Mount NFS Exports with the Automounter


    The automounter is a service (autofs) that automatically mounts file systems and
    NFS exports on demand, and automatically unmounts file systems and exports when
    resources are no longer in use.


    The automounter function was created to solve the problem that underprivileged
    users do not have sufficient permissions to use the mount command. Without use
    of the mount command, normal users cannot access removable media as CDs, DVDs,
    and removable drives. Furthermore, if a local or remote file system is not mounted
    at boot time by the /etc/fstab entry, a normal user is unable to access those
    unmounted file systems.


    The automounter configuration files are populated with file system information,
    in a similar way to /etc/fstab file systems mounted during boot system and remained
    until shutdown or other intervention, file systems do not necessarily mount during
    boot system. Instead, automounter-controlled file systems mount on demand, when
    a user or application enters the file system mount point to access.


    # Automounter Benefits


    Resource use for automounter file systems is equivalent to file systems that are
    mounted at boot, because a file system uses resources only when a program is reading
    and writing files. Bounded idle file systems and unmounted file systems use the
    same amount of resources: almost none.


    The automounter advantage is by mounting the file system each time it is no longer
    in use, the file system is protected from unexpected corruption when it is open.
    When the file system is directed to mount, the autofs services use the most current
    mount configuration, unlike /etc/fstab tab, which might use a configuration that
    was mounted during the last boot. Additionally, if your NFS server configuration
    includes redundant servers and paths, then the automounter can select the fastest
    connection each time a new file system is requested.


    # The Automounter autofs''s Service Method


    The autofs service supports the local and remote file systems as the /etc/fstab
    file, including NFS and SMB file sharing protocols, and supports the same protocol-specific
    mount options, including security parameters. File systems that are mounted through
    the automounter are available by default to all users, but can be restricted through
    permission options.


    Because the automounter is a client-side configuration that uses the standard
    mount and mount commands to manage file systems, automounted file systems exhibit
    identical behavior to file systems that are mounted by /etc/fstab. The difference
    is that automounter'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Chapter 7 | Access Network-Attached Storage


    file system remains unmounted until the mount is accessed, which causes the file
    system to mount immediately, and remain mounted while the file system is in use.
    When all files on the file system are closed, and all users and processes leave
    the mount point, the automounter unmounts the file after a minimal time out.


    # Direct and Indirect Map Use Cases


    The automounter supports both direct and indirect mount-point mapping, to handle
    the two types of demand mounting. A direct mount is when a file system mounts
    to an unchanging, known mount point. Almost all file systems you configure, are
    direct mounts. A direct mount point exists as a permanent directory, the same
    as a normal directory.


    An indirect mount is when the mount point is not known until the demand occurs.
    An example of indirect mount is the configuration for remote-home directories,
    where a user''s home directory includes their username in the directory path.
    The user''s remote file system is mounted to their home directory, and automounter
    learns which user specified to their home directory, and determines the mount
    point to use. Although indirect autof creates them when the mount demand occurs,
    and deletes them when the demand ends and the file system is unmounted.


    # Configure the Automounter Service


    The process to configure an autofs and nfs-utils has many steps.


    First, you must install the autofs and nfs-utils packages.


    ```

    [user@host ~] sudo dnf install autofs nfs-utils

    ```


    These packages contain requirements to use the automounter for NRS exports.


    # Create a Master Map


    Next, add a map file to /etc/auto.master.d. This file identifies the base directory
    for mount points and identifies the mapping file to create the automount.


    ```

    [user@host ~] sudo vim /etc/auto.master.d/demo.autofs

    ```


    The name of the map file is mostly arbitrary (although typically meaningful),
    and it may have an extension of .autofs for the subsystem to recognize. You can
    place multiple entries in a single master map file; alternatively, you can create
    multiple master map files, each with its own logically grouped entries.


    Add the map entry for indirect mounts, in this case:


    ```

    /shares /etc/auto.demo

    ```


    This entry uses the /shares directory as the base for indirect mounts. The /etc/auto.demo
    file contains the mount details. Use an absolute file name. The auto.demo file
    must be created before starting the autofs service.'
