- pgno: 60
  md: '# Chapter 2 | Schedule Future Tasks


    The following job sends an email containing the Chime word to the owner of this
    job every five minutes in between and including 9 a.m. and 16 p.m., but only on
    Friday in July.


    ```

    *5 9-16 * 5 echo "Chime"

    ```


    The preceding 9-16 range of hours means that the job timer at the ninth hour (09:00)
    and continues until the end of the sixteenth hour (16:59). The job starts executing
    at 09:00 and because five minutes after 16:55 is 17:00, which is beyond the given
    scope of hours.


    If a range is specific for the hours instead of a single value, then all hours
    within the range match. Therefore, with the hours of 9-16, this matches every
    five minutes from 09:00 through 16:55.


    > Note This example job sends the output as an email because cron recognizes that
    the job allowed output to go to the STDIO channel without redirection. Because
    cron jobs in a background environment without an output device (known as a controlling
    terminal), cron buffers the output and creates an email to send it to the user
    specified in the configuration. For system jobs, the email will be sent to the
    root account.


    The following job runs /usr/local/bin/daily_report command every working day (Monday
    to Friday) two minutes before midnight.


    ```

    58 23 * * 1-5 /usr/local/bin/daily_report

    ```


    The following job executes the mut command to send the Checking in mail message
    to the developer@example.com recipient every working day (Monday to Friday), at
    9 AM.


    ```

    0 9 * * 1-5 s mut "Checking in" developer@example.com % Hi there, just checking

    ```


    +   References crond(8), crontab(1), and crontab(5) man pages'
