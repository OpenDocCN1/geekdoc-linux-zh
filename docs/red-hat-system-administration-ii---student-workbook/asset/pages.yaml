  md: '# Lab


    # Manage Basic Storage


    In this lab, you create partitions on a new disk, formatting with some file systems
    and mounting them, and activating them as swap spaces.


    # Outcomes


    +   - Display and create partitions with the parted command.

    - Create file systems on partitions and persistently mount them.

    - Create swap spaces and activate them at boot.


    # Before You Begin


    As the student user the workstation machine, use the lab command to prepare your
    system for this exercise.


    This command prepares your environment and ensures that all required resources
    are available.


    ```

    $student@workstation ~$ lab start storage-review

    ```


    # Instructions


    +   1. The server machine has several unused disks. On the first unused disk,
    create a 2 GB backup partition. Because it is difficult to set an exact size,
    a size between 1.8 GB and 2.2 GB is acceptable. Configure the backup partition
    to host an XFS file system.

    2. Format the 2 GB backup with an XFS file system and persistently mount it to
    the /backup directory.

    3. On the same disk, create two 512 MB partitions called swap1 and swap2. A size
    between 460 MB and 564 MB is acceptable. Configure the file-types of the partitions
    to host swap spaces.

    4. Initialize the two 512 MB partitions as swap spaces and configure them to activate.
    Set the swap space on the swap2 partition to be preferred over the other.

    5. To verify your work, reboot the server machine. Confirm that the system automatically
    mounts the first partition onto the /backup directory, and confirm that the system
    activates the swap spaces.


    # Evaluation


    As the student user on the workstation machine, use the lab command to grade your
    work. Correct any reported failures and rerun the command until successful.


    ```

    $student@workstation ~$ lab grade storage-review

    ```'
