    # Start Processes with User-nice Values


    When a process is created, it inherits its parent''s nice value. When a process
    starts from the command line, it inherits its nice value from the shell. Typically,
    new processes run with the default nice value of 0.


    The following example starts a process from the shell, and displays the process''s
    nice value. Using the PID option in the ps command to specify the requested output.


    > Note The example command used here purely for demonstrating nice values, and
    was chosen for its low resource consumption.'
