    [root@host ~]# systemctl start httpd

    [root@host ~]# curl http://localhost/mypage

    <!DOCTYPE html PUBLIC "-//W3C//DTD HTML 2.0//EN">

    <html>

    <head><title>403 Forbidden</title></head>

