    Another type of multiplier allows a more precise number of characters desired
    in the pattern. An example of an explicit multiplier is the ''c.\{2}t'' regular
    expression, which matches any word that begins with a c, followed by exactly two
    characters, and ends with a t. The ''c.\{2}t'' expression would match two words
