- pgno: 378
  md: '# Manage Containers as System Services


    # Objectives


    Configure a container as a systemd service, and configure a container service
    to start at boot time.


    # Manage Small Container Environments with systemd Units


    You can run a container to complete a system task or obtain the output of a series
    of commands. You might also want to run containers that run a service indefinitely,
    such as servers or databases. In a traditional environment, a privileged user
    typically configures these services to run at system boot, and manages them with
    the systemd command.


    As a regular user, you can create a systemd unit to configure rootless containers.
    You can use this configuration to manage your container as a regular service with
    the systemd command.


    Managing containers based on systemd is useful for basic and small deployments
    that do not scale. For more sophisticated scaling and orchestration of many-container
    applications and services, you can use an enterprise orchestration platform that
    is based on Kubernetes, such as Red Hat OpenShift Platform.


    To discuss the topics in this lecture, imagine the following scenario:


    As a system administrator, you are asked to configure the webserver1 container
    that is based on the http24 container image to start at boot. You must also mount
    the /app-artifacts directory for the web server content and map the 8080 port
    from the local machine to the container. Configure the container to start and
    stop with systemd commands.


    # Requirements for systemd User Services


    As a regular user, you can enable a service with the systemd command. The service
    starts when you open a session (graphical interface, text console, or SSH) and
    it stops when you close the last session. This behavior differs from a system
    service, which starts when the system boots and stops when the system shuts down.


    By default, when you create a user account with the useradd command, the system
    uses the next available ID from the user ID range. The system also reserves a
    range of IDs for the user''s containers in the /etc/subuid1. If you create a user
    account with the useradd command -uuid option, then the system does not reserve
    a range for the user containers.


    You decide to create a dedicated user account to manage containers. You use the
    useradd command to create the appdev-admin user, and redhat as the password.'
