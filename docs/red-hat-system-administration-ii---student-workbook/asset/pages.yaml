    \ registry.example.com/rhel8/mariadb-105:latest run-mysql 6\nseconds ago Up 6\
    \ seconds ago db01\n```\n\n# Container Persistent Store\n\nBy default, a container\
    \ that uses storage is ephemeral. The nature of container storage means its contents\
    \ are lost after you remove the container. You must consider system-level permissions\
    \ when mounting a persistent volume in a container.\n\nIn the MariaDB image, the\
    \ mysql user must own the /var/lib/mysql directory that you intend to mount into\
    \ the container must have mysql as the user and group (or the UID/GID of the mysql\
    \ user, if MariaDB is not installed on the host machine). If you run a container\
    \ as the root user, the UIDs and GIDs on your host machine must match the UIDs\
    \ and GIDs inside the container.\n\nYou can use the podman unshare command to\
    \ run a command inside the container namespace. To obtain the mapping for your\
    \ user namespace, use the podman unshare cat command.\n\n```\n[user ~]$ podman\
    \ unshare cat /proc/self/uid_map\n0 1000 1\n1 100000 65536\n[user ~]$ podman unshare\
    \ cat /proc/self/gid_map\n0 1000 1\n1 100000 65536\n```"
