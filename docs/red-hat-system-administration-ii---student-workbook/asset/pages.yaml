    # Create system User Files for Containers


    You can manually generate service files using the --config=systemd/user. The file
    syntax for user services is the same as the system service files. For more details,
    review the system.unit(5) and system.service(5) pages.


    Use the podman generate systemd command to generate systemd service files for
    an existing container. The podman generate systemd uses a container as a model
    to create the configuration file.


    The podman generate systemd command --name option instructs the podman utility
    to configure the system service to create when the container starts, and to delete
    the container when the service stops.


    > Important

    Without the --name option, the podman utility configures the service unit file
    to start and stopping the existing container without deleting it.


    You the podman generate systemd command with the --name option to display the
    system service file is modeled for the webserver1 container.


