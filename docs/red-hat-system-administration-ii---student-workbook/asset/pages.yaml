    # Troubleshooting the Installation


    During a Red Hat Enterprise Linux 9 installation, Anaconda provides virtual consoles.
    The first five windows use the tmux terminal multiplexer. You can access the console
    by pressing **Ctrl+Alt+F1**. The second virtual console, which displays by default,
    the Anaconda graphical interface. You can access it using **Ctrl+Alt+F6**.


    The **tmux** terminal provides a shell prompt in the first virtual console. You
    can use it to enter commands and troubleshoot the system while the installation
    continues. The others provide diagnostic messages, logs, and additional information.


    The following table lists the keyboard combinations to access the virtual consoles
    and the **tmux** terminal. In the **tmux** terminal, the keyboard short cuts are
    performed in two actions: press and release **Ctrl+B**, and then press the key
    of the window you want to access. In the **tmux** terminal, you can also use **Alt+Tab**
    to rotate the current function between the windows.


