    # Troubleshoot SELinux Issues within the Web Console


    The RHEL web console includes tools for troubleshooting SELinux issues. Select
    SELinux on the menu. The SELinux policy window displays access control errors.
    The SELinux access control errors lists current SELinux issues.


    ![](img/2eff90170b8c94cce3a908ab927e38c2_137_0.png)


