  md: '# Chapter 7 | Access Network-Attached Storage


    When a user attempts to /shares/work the key (which is in this example) replaces
    the ampersand in the source location and server:/exports/work is mounted.

    As with the indirect example, the autofs service creates and removes the work
    directory automatically.


    # Create a Direct Map


    A direct map is used to map an export to an absolute path mount point. Only one
    direct map file is necessary, and can contain any number of direct maps.


    To use directly mount points, the mount file may appear as follows:


    ```

    - /etc/auto.direct

    ```


    All direct maps use - /etc/auto.direct as the base directory. In this case, the
    mapping file contains the mount details is is


    The content for the /etc/auto.direct file may appear as follows:


    ```

    /mnt/docs -rw, sync server:/shares/docs

    ```


    The mount point (or key) is always an absolute path. The rest of the mapping file
    uses the structure.

    In this example, the /mnt directory exists, and it is not managed by the autofs
    service.

    The autofs service creates and removes the /mnt/docs directory automatically.


    # Start the Automounter Service


    Lastly, use the systemctl command to enable the autofs service.


    ```

    [user@host ~] sudo systemctl enable --now autofs

    Created symlink /etc/systemd/system/multi-user.target.wants/autofs.service ->
    /usr/lib/systemd/system/autofs.service.

    ```


    # The Alternative systemd.automounter Method


    The system daemon can automatically create files for entries in /etc/fstab that
    include the x-system.automount option. Use the systemctl daemon-reload command
    after modifying your mount options, to generate a new file, and use the systemctl
    start unit command to enable that configuration.


    The naming of the unit is based on its mount location. For example, if the mount
    point is /remote/finance, then the unit is remote-finance.automount. The system
    daemon mounts the file when the /remote/finance directory is initially accessed.


    This method may be simpler than installing and configuring the autofs service.
    However, a direct system.automount unit can support only absolute path mount points,
    to autofs directs


    +   References

    ofs(5), automount(8), auto.master(5), mount.nfs(8), and systemd.automount(5) man
    pages


