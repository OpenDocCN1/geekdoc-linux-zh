- pgno: 189
  md: '# Extend and Reduce LVM Volume


    After creating a logical volume, you can extend the volume to expand the file
    system. You may require extending PV or VG to increase the storage capacity of
    the LV.


    # Extend a Volume Group Size


    You might need more disk space to extend a VG. You can add additional physical
    volumes to a VG to extend its available size.


    Prepare the device volume and the physical volume when not present.


    ```

    [root@host #] parted /dev/vdb mkpart primary 1072MiB 164MiB

    ...output omitted...

    [root@host #] parted /dev/vdb 3 lvm on

    ...output omitted...

    [root@host #] udevadm settle

    [root@host #] pvcreate /dev/vdb3

    physical volume "dev/vdb3" successfully created.

    ```


    The vgxtend command adds the PV to the VG. Provide the VG and PV names as arguments
    to the vgxtend command.


    ```

    [root@host #] vgxtend vg01 /dev/vdb3

    volume group "vg01" successfully extended

    ```


    This command extends the vg01 by the /dev/vdb3 PV.


    # Extend a Logical Volume Size


    A benefit of using logical volumes is increasing their size without experiencing
    any downtime. Add free physical extends to the LV in the VG to extend its capacity
    to expand the LV''s file system. Use the lvdisplay command to confirm that the
    volume group has sufficient space for the LV extension.


    Use the lvextend command to extend the LV.


    ```

    [root@host #] lvextend -L +500M /dev/vg01/lv01

    Size of logical volume "vg01/lv01" increased from 300.0 Mib (75 extends) to 800.0
    Mib (200 extends).

    Logical volume vg01/lv01 successfully resized.

    ```


    This command increases the lv01 logical volume by 500 Mib. The (+) plus sign in
    front of the size means you add this value to the size; otherwise, without the
    plus sign, the value defines the final size of the LV.


    The lvextend command uses different methods to specify the size. The lvextend
    command -L option expects the number of PE as the argument. The lvextend command
    -L option expects sizes in bytes, megibytes, gigibytes, and similar.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# Extend an XFS File System to the Logical Volume Size


    The xfs_growfs command expands the file system to cover the extended LV. The target
    file system must be mounted before you use the xfs_growfs command. You can continue
    to use the file system while resizing.


    ```

    [root@host]# xfs_growfs /mnt/data/

    ...output omitted...

    data blocks changed from 7680 to 204800

    ```


    > Important

    Always run the xfs_growfs command after executing the lxtend command. Use the
    lxtend -r option to run the two steps consecutively. After extending the LV, it
    resizes the file system using the fsadm command. This option supports several
    other file systems.


    # Extend EXT4 File System to the Logical Volume Size


    The steps for extending LV using the ext4 file system are the same as LV using
    the XFS file system, except for the resize step for the file system.


    The resize2fs command expands the file system to occupy the new extended LV. You
    can continue to use the file system while resizing.


    ```

    [root@host]# resize2fs /dev/vg01/lv01

    resize2fs 1.46.S (30-Dec-2021)

    Resizing the filesystem on /dev/vg01/lv01 to 256000 (4k) blocks.

    The filesystem on /dev/vg01/lv01 is now 256000 (4k) blocks long.

    ```


    The primary difference between xfs_growfs and resize2fs is the argument to identify
    the file system. The xfs_growfs command takes the mount point as an argument,
    and the resize2fs command takes the LV name as an argument. The xfs_growfs command
    supports both online and offline resizing. You can resize online whereas the resize2fs
    command supports ext4 file system up or down, but you can only resize an XFS file
    system up.


    # Extend Swap Space Logical Volumes


    You can extend the LVs using swap space; however, the process differs from expanding
    the ext4 or XFS file system. Logical volumes using swap space must be offline
    to extend.


    We use swapoff command to deactivate the swap space on the LV.


    ```

    [root@host]# swapoff -v /dev/vg01/swap

    swapoff /dev/vg01/swap

    ```


    Use the lxtend command to extend the LV.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '```

    ```bash

    [root@]# lvextend -L +300M /dev/vg0/swap

    Size of logical volume vg0/swap changed from 500.00 MIB (125 extents) to 800.00
    MIB (200 extents).

    Logical volume vg0/swap successfully resized.

    ```

    ```


    Use the mswap command to format the LV as swap space.


    ```

    ```bash

    [root@]# mswap /dev/vg0/swap

    mswap: /dev/vg0/swap: warning: wiping old swap signature.

    Setting up swapspace version 1, size = 800 MIB (838860800 bytes)

    no label, UUID=256a4d62-6180-4b1c-974e-7f4063ad660

    ```

    ```


    Use the swapon command to activate the swap on the LV.


    ```

    ```bash

    [root@]# swapon /dev/vg0/swap

    ```

    ```


    # # Reduce Volume Group Storage


    Reducing a VG involves removing PV from the VG. The pvmove command moves data
    from extents on one PV to another with enough space in the VG. You may continue
    to use the LV while reducing the VG. Use the pvmove command to automatically backup
    the metadata of the VG after a change. This option uses the vgcfbackup command
    to backup metadata automatically.


    ```

    ```bash

    [root@]# pvmove /dev/vgdb3

    ```

    ```


    > > Warning

    Before you the pvmove command, back up the data stored on all LVs in the VG. An
    unexpected power loss during activate the operation might leave the VG in an inconsistent
    state which might cause a loss of data on LVs.


    Use the vgreduce command to remove a PV from a VG.


    ```

    ```bash

    [root@]# vgreduce vg01 /dev/vgdb3

    Removed "dev/vgdb3" from volume group "vg01"

    ```

    ```


    > > Important

    nThe GFS2 and XFS file systems do not support shrinking, so you cannot reduce
    the size of an LV.


    # # Remove LVM Storage


    Use the lvremove, vgremove, and pvremove commands to remove an LVM component that
    is no longer required.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# Prepare the File System


    Move data that must be kept to another file system. Use the umount command to
    unmount the file system and then remove your /etc/fstab entries for this file
    system.


    ```

    [root@host ~] umount /mnt/data

    ```


    > > Warning

    Removing a logical volume destroys any data stored on the logical volume. Back
    up or move your data before you remove the logical volume.


    # Remove the Logical Volume


    Use the lvremove command to remove a logical volume that is no longer needed.
    Mount the LV file system before removing it (disk). The command prompts for confirming
    the removal.


    ```

    [root@host ~] lvremove /dev/vg01/lv01

    Do you want to remove active logical volume vg01/lv01? [y/n]: y

    Logical volume "lv01" successfully removed.

    ```


    The LV''s physical extents are free and made available for assignment to existing
    or new LVs in the volume group.


    # Remove the Volume Group


    Use vgremove command to remove a volume group that is no longer needed.


    ```

    [root@host ~] vgremove vg01

    Volume group "vg01" successfully removed

    ```


    The VG''s physical extents are free and made available for assignment to new VGs
    on the system.


    # Remove the Physical Volumes


    Use the pvremove command to remove physical volumes that are no longer needed.
    Use a space-delimited list of PV devices to remove more than one at a time. This
    command deletes the LV partition from the metadata (or disk). The partition is
    no longer free for reallocation or reformatting.


    ```

    [root@host ~] pvremove /dev/vdb1 /dev/vdb2

    Labels on physical volume "/dev/vdb1" successfully wiped.

    Labels on physical volume "/dev/vdb2" successfully wiped.

    ```'
  merge: -1
  img_proc: true
