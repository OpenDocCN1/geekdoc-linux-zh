- pgno: 12
  md: '# Introduction


    # Red Hat System Administration II


    This course is specifically designed for students who have completed the Red Hat
    System Administration I (RHI24) course. The Red Hat System Administration II (RHI34)
    focuses on the key tasks that are needed to become a full-time Linux Administrator
    and to validate those skills via the Red Hat Certified System Administrator exam.
    This course goes deeper into Enterprise Linux administration, including file systems,
    partitioning, logical volumes, SELinux, and troubleshooting.


    # Course Objectives


    +   - Expand on skills that were gained during Red Hat System Administration I
    (RHI24)

    - Build skills that an RHCSA-certified Red Hat Enterprise Linux system administrator
    needs.


    # Audience


    +   - This course is singularly designed for students who have completed Red Hat
    System Administration I (RHI24). Given the organization of topics, it is not appropriate
    for students to use RHI34 as a curriculum entry point. Students who have not taken
    a previous Red Hat course are encouraged to take either Red Hat System Administration
    I (RHI24) if they are new to Linux, or the RHCSA Rapid Track (RHI99) if they are
    experienced with Enterprise Linux administration.


    # Prerequisites


    +   - Have taken the Red Hat System Administration I (RHI24) course, or equivalent
    knowledge.'
  merge: -1
  img_proc: true
