    /etc/fstab, and remount the file system if the mount command returns an error,
    correct it before rebooting the machine.


    Alternatively, use the findmnt --verify command to parse the /etc/fstab file for
    partition usability.


    When you add or remove an entry in the /etc/fstab file, run systemctl daemon-reload
    command, or reboot the system, to ensure that system daemon loads and uses the
    new configuration.


    ```

    [root@host ~]# systemctl daemon-reload

    ```


    Red Hat recommends the use of UUIDs to persistently mount file systems, because
    block device names can change in certain scenarios, such as if a cloud provider
    changes the underlying storage layer of a virtual machine, or if disks are detected
    in a different order on a system boot. The block device name might change, but
    the UUID remains constant in the file-system''s super block.


    Use the lsblk --fs command to show the block devices that are connected to a machine
    and retrieve the file-system UUIDs.


    ```

    [root@host ~]# lsblk --fs

