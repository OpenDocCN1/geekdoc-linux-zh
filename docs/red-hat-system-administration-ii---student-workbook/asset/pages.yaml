    The web server does not display the content and returns a permission denied error.
    An AVC event is logged to the /var/log/audit/audit.log and /var/log/messages files.
    Note the suggested audit and UUID in the /var/log/messages event message.


    ```

    []# tail /var/log/audit/audit.log

    ... output omitted...

    type=AVC msg=audit(1642904567.067:212): denied { getattr }

    for= pid=2332 comm="httpd" path="/var/www/html/mypage dev="vda4" scontext=system_u:system_r:t
    t=unconfined:object_r:admin_home_t tclass=file permission=0

    ... output omitted...

    []# tail /var/log/messages

    ... output omitted...

    Apr 6 08:44:19 host setroubleshoot[2547]: SELinux is preventing /usr/sbin/httpd

    from getattr accessing access on the file /var/www/html/mypage. For complete SELinux
    messages run: sealert -i 95b41f98-6056-45bc-95da-ce67ec9a09b7

    ... output omitted...

    ```


    The sealert output describes the event including the affected process, the accessed
    file and the denied action. The output includes advice for correcting the file''s
    label, if appropriate. Additional advice describes how to generate a new policy
    to mitigate the denied action. Use the given advice when it is appropriate for
    your scenario.


    > Important

    The sealert output includes a confidence rating, indicating the level of confidence
    that the given advice will mitigate the denied action. However, that advice might
    not be appropriate for your scenario.


    For example, if the AVC denial is caused because the file is in the wrong location,
    then advice either to adjust the file context label, or to create a new policy
    for this location and action, is technically accurate, but not the correct solution
    for your scenario. If the root is a wrong location or file name, then moving or
    renaming the file and restoring a correct file context is the correct solution
    instead.'
