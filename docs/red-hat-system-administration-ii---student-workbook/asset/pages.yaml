    # Miscellaneous Commands


    The following Kickstart commands configuring the host power state upon completion:


    +   - logging: This command defines how Anaconda will perform logging during the
    installation.


    ```

    logging --host=loghost.example.com

    ```


    +   - firstboot: if enabled, then the Set Up Agent starts the first time the system
    boots. This command requires the initial-setup package.


    ```

    firstboot --disabled

    ```


    +   - reboot, poweroff, halt: Specify the final action to take when the installation
    completes. The default setting is halt


    > Note: Most Kickstart commands have multiple options available. Review the Kickstart
    Commands and Options guide in this section''s references for more information.


    # Example Kickstart File


    In the example, the first part of the Kickstart file consists of the installation
    commands, such as partitioning and installation source.


    ```

    #version=RHEL9


    # Define bootloader options

    bootloader --append="console=tty0 console=tty0,115200n8 no_timeout_check

    net.inframes=0 crashkernel=auto" --location=mbr --timeout=1 --boot-drive=vda


    # Define partition disks

    clearpart --all --initlabel

    ignoredisk --only-use=vda

    zerombr

    part / --type="xfs" --ondisk=vda --size=10000


    # Define installation options

    text

    repo --name="appstream" --baseurl="http://classroom.example.com/content/rhel9.0/

    x86_64/dvd/AppStream/

    url="http://classroom.example.com/content/rhel9.0/x86_64/dvd/"

    ```'
  merge: -1
