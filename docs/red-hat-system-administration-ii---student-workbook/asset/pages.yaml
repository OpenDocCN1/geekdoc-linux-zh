- pgno: 205
  md: 'The following is an entry in the /etc/fstab file to mount a Stratis system
    persistently. This example is a single long line in the file. The x-systemd.requires=stratis
    mount option delays mounting file system until the stratis daemon starts service
    during the boot process.


    ```

    UUID=b7b5790d-8fba-463e-8ec8-29c0b703d45e /dir1 xfs defaults,x-systemd.requires=stratis
    0 0

    ```


    > Important

    If you do not include the x-systemd.requires=stratis service mount option in the
    /etc/fstab file for each Stratis file, the machine fails to start properly and
    alerts to emergency the next time you reboot.


    > Warning

    Do not use the df command to query Stratis file space.

    The df command reports that one Stratis-managed XFS file system is 1T in size,
    regardless of the current allocation. Because the file system is thinly provisioned,
    a pool might not have enough physical storage to back the entire file system.
    Other pools in the pool could use all the available storage.

    Therefore, it is possible to consume the whole pool, even as the df command reports
    that the file system has available space. Writes to a file system with no available
    pool storage can fail.

    Instead, use the stratis pool list command to monitor a pool''s available storage.


    References

    For further information, refer to Deduplicing And Compressing Logical Volumes
    On RHEL at

    https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/9/html-single/deduplicing_and_compressing_logical_volumes_on/rhel/index


    For further information, refer to Red Hat Enterprise Linux 9 Managing File Systems
    Guide

    https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/9/html-single/managing_file_systems


    Stratis Storage

    https://stratis-storage.github.io/


    What Stratis learned from ZFS, Btrfs, and Linux Volume Manager

