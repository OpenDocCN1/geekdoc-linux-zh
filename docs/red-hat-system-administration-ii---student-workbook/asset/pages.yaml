- pgno: 286
  md: '# Control SELinux Port Labeling


    # Objectives


    Verify that network ports have the correct SELinux type for services to bind to.


    # SELinux Port Labeling


    In addition to content and process labeling, SELinux labels network ports with
    an SELinux context. SELinux controls access by labeling the network ports and
    including rules in a service''s targeted policy. For example, the SSH targeted
    policy includes the 22/TCP port with a ssh_port_t context label. In the HTTP policy,
    the default 80/TCP and 443/TCP ports use an http_port_t context label.


    When a targeted process attempts to open a port, SELinux verifies the targeted
    policy entries, which allow the process type to bind with that port type. SELinux
    can then block a rogue service from taking over ports used by other legitimate
    services.


    # Manage SELinux Port Labeling


    If a service attempts to listen on a non-port, SELinux blocks the attempt, unless
    you add the port in the service''s targeted policy by labeling the port with the
    correct port context.


    Typically, the targeted port has already labeled all expected ports with the correct
    type. For example, because 8080/TCP is used for web applications, that is already
    labeled with http_port_t, the default port type for a web server. Individual ports
    can be labeled with one port context.


    # List Port Labels


    Use the grep command to filter the port number.


    ```

    [root@]# - grep gopher /etc/services

    gopher          70/tcp          Internet Gopher

    gopher          70/udp

    ```


    Use the seman command to list the current port assignments.


    ```

    [root@]# semanage port -l

    ...output omitted...

    http_cache_port_t  tcp    8000, 8118, 8123, 10001-10010

    http_cache_port_t  udp    3130

    http_port_t         tcp    80, 81, 443, 488, 8008, 8009, 8443, 9000

    ...output omitted...

    ```


    Use the grep command to filter the SELinux port label using the service name.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# Chapter 9 | Manage Network Security


    ```

    [root@host #] semanage port -l | grep

    ftp_data_port_t      tcp      20

    ftp_port_t           tcp      21, 989, 990

    ftp_port_t           udp      989, 990

    tftfp_port_t          udp      69

    ```


    A port label can appear in the list multiple times for each supported networking
    protocol.


    Use the grep command to filter the SELinux label using the port number.


    ```

    [root@host #] semanage port -l -w 70

    gopher_port_t        tcp      70

    gopher_port_t        udp      70

    ```


    # ## Manage Port Bindings


    Use the semanage command to assign port labels, remove port labels, and modify
    existing ones.


    > **Important**nVirtually all of the services included in RHEL distribution provide
    an SELinux policy module, which includes that service''s default contexts. You
    cannot change port labels using the semanage command. Instead, you must modify
    and reload the target service''s policy module. Writing and generating policy
    modules is not discussed in this course.


    You can label a new port with an existing context label (type). The semanage command
    adds a new port label, the -t option denotes the type, and the -p option denotes
    the protocol.


    ```

    [root@host #] semanage port -a -t port_label -p tcp|udp PORTNUMBER

    ```


    For example, to label the gopher service on port 71/TCP:


    ```

    [root@host #] semanage port -a -t gopher_port_t -p tcp 71

    ```


    To view the default policy, use the semanage port command with -C option.


    ```

    [root@host #] semanage port -l -C

    SELinux Type        Proto       Port Number

    gopher_port_t        tcp         71

    ```


    The targeted policies include many port types.


    Service-specific SELinux pages are named by the service name plus _selinux. These
    pages include service-specific information on SELinux types, Booleans, and port
    types, but are not installed by default. To view a list of all available SELinux
    man, install the package and run a man -k keyword search for _selinux'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# Chapter 9 | Manage Network Security


    ```

    [root@~]# dnf -y selinux-policy-doc

    [root@~]# man -k selinux

    ```


    Use the seman command to bind a port, with the -d option. For example, to remove
    the binding of port 71/TCP to the gopher_port_t type:


    ```

    [root@~]# semanage port -d gopher_port_t -p tcp 71

    ```


    For a port binding, when requirements change, use the -m option. This is more
    efficient than deleting the old binding and adding the new one.


    For example, bind port 71/TCP from gopher_port_t to http_port_t, use the following
    command:


    ```

    [root@server]# semanage port -m t http_port_t -p tcp 71

    ```


    View the modification by using the seman command.


    | SELinux Port Type | Port Number |

    | --- | --- |

    | http_port_t | tcp | 71 |

    | [root@server]# semanage port -l C grep http |

    | http_cache_port_t | tcp | 8000, 8118, 8123, 10001-10010 |

    | http_cache_port_t | udp | 3130 |

