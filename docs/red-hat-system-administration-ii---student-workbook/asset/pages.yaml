  md: '# Chapter 5 | Manage Storage


    ```

    [root@host ~]# udevadm settle

    ```


    Format Swap Space

    The mkswap command applies a swap signature to the device. Unlike other formatting
    utilities, the mkswap command writes a single block of data at the beginning of
    the device, leaving the rest of the device unformatted that the kernel can use
    for storing memory pages.


    ```

    [root@host ~]# mkswap /dev/sdb2

    Setting up swapspace version 1, size=244 MiB (255848448)

    no label, UUID=39e267a-9458-42fe-9665-c5bc85465881

    ```


    # Activate Swap Space


    Use the swap command to activate a formatted swap space, or use swap -a to activate
    all the listed spaces in the /etc/fstab file. Use the swap --show free commands
    to inspect the available spaces.


    | [root@host ~]# total used free shared buff/cache available |

    |---|---|---|---|---|---||

    | Mem: 1873036 | 134688 | 1536436 | 16748 | 201912 | 1576044 |

    | Swap: 0 | | | | | |

    | [root@host ~]# swap /dev/vdb2 total used free shared buff/cache available |

    |---|---|---|---|---|---||

    | Mem: 1873036 | 135044 | 1536084 | 16748 | 201952 | 1575680 |

    | Swap: 249852 | | 249852 | | |


    You can deactivate a swap space using the swapoff command. If there are multiple
    swap spaces, the swapoff command moves those pages to other active swap spaces
    or back into memory. If the swapoff command cannot write data to other places,
    it fails with an error, and the swap stays active.


    # Activate Swap Space Persistently


    Create an entry in the /etc/fstab file to ensure your swap space activates at
    boot. Following example a line in the /etc/fstab file based on the previously
    created swap space.


    ```

    UUID=39e267a-9458-42fe-9665-c5bc85465881 swap swap defaults 0 0

    ```


    The example uses the UUID for flexibility. When you format the device, the mkswap
    command displays the UUID. You can use the lsblk -f command similarly. As an alternative,
    you can use the device name in the first field.


    The second field is required for the mount point. However, for swap devices, which
    are not accessible through the directory structure, this field takes the swap
    placeholder value. The fstab man uses a none placeholder value; however, a swap
    gives more informative error messages if something goes wrong.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Chapter 5 | Manage Basic Storage


    The third field is the file-system type. The file-system type for swap is swap.


    The fourth field is for options. The example uses the defaults option. The defaults
    option includes the auto mount, which activates the swap space automatically at
    boot.


    The final two fields are the dump flag and fsck order. Swap spaces do not require
    backing up or file-system checking, and so these fields should be set to zero.


    When you add or remove an entry in the /etc/fstab file, run systemctl daemon-reload
    command, or reboot the system, to register the new configuration.


    ```

    [root~#] systemctl daemon-reload

    ```


    # Set Swap Space Priority


    By default, the system uses swap spaces in series, meaning that the kernel uses
    the first swap space until it is full, and then starts the second swap space.
    You can instead define a priority for each swap space to force a particular order.


    To set the priority, use the pri option in the /etc/fstab file. The kernel uses
    the swap space with the highest priority. The default priority is -2.


    The following example shows three different swap spaces in the /etc/fstab file.
    The kernel uses the last entry first, because its priority is set to 10. When
    swap space is full, it uses the second entry, because its priority is set to 4.
    Finally, it uses the first entry, which has a priority of -2.


    | UUID=f3f6cb9-3866-425a-8889a49ef33 swap swap defaults 0 0 |

    | UUID=39e2676a-9458-42fe-965c-c58da4605881 swap swap pri=4 0 0 |

    | UUID=fd7fae6-b771-44a8-961b-37ace5f572bf swap swap pri=10 0 0 |


    Use the swap --show command to display the swap space priorities.


    When swap spaces have the same priority, the kernel writes them in a round-robin
    fashion.


    > mkswap(8), swapon(8), swapoff(8), mount(8), and parted(8) man pages

    **Knowledgebase: What Is the Recommended Swap Size for Red Hat Platforms?**

    https://access.redhat.com/solutions/15244'
  merge: -1
  img_proc: true
