- pgno: 260
  md: '# Repair File System Issues at Boot


    Objectives

    Manually repair file-system configuration or corruption issues that stop the boot
    process.


    # File-system Issues


    During the boot process, systemd service mounts the persistent file-systems defined
    in the /etc/fstab file


    Errors in the /etc/fstab file or corrupt file-systems can block a system from
    completing the boot process. In some failure scenarios, the system breaks out
    of the boot process and opens an emergency shell that requires the root user password.


    The following list describes common file system mounting issues when parsing /etc/fstab
    during the boot process:


    +   Corrupt file system

    The systemd service attempts to repair the file system. If the problem cannot
    be automatically repaired, then the system opens an emergency shell.


    +   Non-existent device or UUID

    The systemd service times waiting for the device to become available. If the device
    does not respond, the system opens an emergency shell.


    +   Non-existent or incorrect mount point

    The system opens an emergency shell.


    # Repair File-system Issues


    To gain access to a system that cannot booting due to file-system issues, the
    system architecture provides an emergency boot target, which opens an emergency
    shell that requires the root password for access.


    The next example demonstrates the boot process output when the system finds a
    file-system issue and switches to the emergency target:


    ```

    ... output omitted...

    * A Start job is running for /dev/vda2 (27s / 1 min 30s)

    [ TIME ] Timed waiting for device /dev/vda2.

    [DEPEND] Dependency failed for /mnt/mountfolder

    [DEPEND] Dependency failed for Local File Systems.

    [DEPEND] Dependency failed for Mark to relabel after reboot.

    ... output omitted...

    [ OK ] Started Emergency Shell.

    [ OK ] Reached target Emergency Mode.

    ... output omitted...

    Give root password for maintenance

    (or press Control-D to continue):

    ```'
  merge: -1
  img_proc: true
- pgno: 261
  md: "# Chapter 8 | Control the Boot Process\n\nThe system daemon failed to mount\
    \ the /dev/vda2 device and timed out. Because the device is not available, the\
    \ system opens an emergency shell for maintenance access.\n\nTo repair file-system\
    \ issues when the system opens an emergency shell, first locate the errant file\
    \ system, determine and repair the fault, then reload the systemd configuration\
    \ to retrieve the automatic mounting.\n\nUse the mount command to determine which\
    \ file systems are currently mounted by the systemd daemon.\n\n```\n[root@host\
    \ ~]# mount\n    output mounted...\n/dev/vda1 / type xfs (ro,relime,atattr,inode64,noquota)\n\
    \    output mounted...\n```\n\nIf the root system is mounted with the ro (read-only)\
    \ option, you are unable to edit the /etc/fstab file. Temporarily mount the root\
    \ system with the rw (read-write) option, necessary before editing the /etc/fstab\
    \ file. The remount option allows an in-file system to modify its mount parameters\
    \ without actually unmounting the file system.\n\n```\n[root@host ~]# mount -a\
    \ remount, /\n```\n\nAttempt to mount all files listed in the /etc/fstab file\
    \ using the mount --all option. This mount option processes every file-entry system,\
    \ but skips those that are already mounted. The command displays any errors that\
    \ occur when mounting a file system.\n\n```\n[root@host ~]# mount --all\nmount:\
    \ /mnt/mountfolder: mount point does not exist.\n```\n\nIn this scenario, the\
    \ /mnt/mountfolder mount directory does not exist, create the /mnt/mountfolder\
    \ directory before reattempt the mount. Other errors can occur, including types\
    \ in the entries, or incorrect device names or UUIDs.\n\nWhen you have corrected\
    \ all the errors in the /etc/fstab file, inform the systemd daemon to register\
    \ the new using systemctl daemon-reload command, remount all of the entries.\n\
    \n```\n[root@host ~]# systemctl daemon-reload\n[root@host ~]# mount --all\n```\n\
    \n> Note\nThe systemd parses the /etc/fstab file into a .mount type systemd configuration\
    \ and then the unit as a service. The daemon-reload requests systemd to rebuild\
    \ and reload all unit configurations.\n\nIf the mount --all attempt succeeds without\
    \ further errors, the final test is to verify that file-system mounting is successful\
    \ during a system boot. Reboot the system and wait for the boot to complete normally."
  merge: -1
