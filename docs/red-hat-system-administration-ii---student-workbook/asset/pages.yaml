  md: '# Manage Layered Storage


    # Objectives


    Analyze the multiple storage components that make up the layers of the storage
    stack.


    # Storage Stack


    Storage in RHEL is comprised of multiple layers of drivers, managers, and utilities
    that are mature, and full of modern features. Managing storage requires familiarity
    with stack components, and recognizing that configuration affects the boot process,
    application performance, and the ability to provide needed storage features for
    specific application cases.


    | | | | | File System |

    |---|---|---|---|---||

    | Virtual Device | Multipath | Partitions | RAID | LVM |

    | SAS | | | | Database |

    | FC | | | | Ceph OSD |

    | iSCSI | | | | | LVM VDO |

    | NVMe | | | | |


    Figure 6.2: Storage Stack


    Previous sections in Red Hat System Administration have covered XFS file systems,
    network storage sharing, partitioning, and the Logical Volume Manager. This section
    outlines the bottom-to-top RHEL storage stack and introduces each layer.


    This section also covers Stratis, the daemon that unifies, configures and monitors
    the underlying RHEL storage stack components, and provides automated storage management
    from either the CLI or from the RHEL web console.


    # Block Device


    Block devices are the base of the storage stack and present a stable, consistent
    device protocol that allows virtually any device to be transparently included
    in a RHEL configuration. Most block devices are accessed through the RHEL SCSI
    driver, and as a SCSI device, including ATA hard drives, solid-state devices,
    and common enterprise bus adapters (HBAs). RHEL also includes iSCSI, Fibre Channel
    over Ethernet (FCoE), virtual machine driver `virtio`, serial-attached storage
    (SAS), Non-Volatile Memory Express (NVMe).


    An iSCSI target can be a physical device in a network or an iSCSI-configured logical
    device. The target is the endpoint in a SCSI protocol bus communication, to access
    the storage as Logical Unit Numbers (LUNs).


    Fibre Channel over Ethernet (FCoE) transmits Fibre Channel frames over Ethernet
    networks. Typically, data centers have dedicated LAN and Storage Area Network
    (SAN) cabling, uniquely configured for their traffic. With FCoE, both traffic
    types can be combined into'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'a larger, converged, Ethernet network architecture. FCoE benefits include lower
    hardware and

    energy costs.


    # Multipath


    A path is a connection between a server and the underlying storage. Device multipath

    **(dm-multipath)** is a RHEL multipath tool for configuring redundant I/O paths
    into a

    single, path-aggregated logical device. The device created by using the device
    mapper (dm)

    as a unique block device mapper for **/dev/mapper/** for each LUN attached to
    the system.


    Storage multipath redundancy can be enhanced by using network bonding when the

    storage, such as iSCSI and FCoE, uses network cabling.


    # Partitions


    A block device can be further divided into partitions. Partitions may consume
    the entire block

    device size or divide the block device for creating multiple partitions. These
    partitions can be used

    to create a file system, LVM, or can be used directly for database structures
    or other raw

    storage.


    # RAID


    A Redundant Array of Inexpensive Devices (RAID) is a storage virtualization technology
    that creates

    large logical volumes from multiple physical or virtual block device components.
    Different forms

    of RAID volumes offer data redundancy, performance improvement, or by implementing

    mirroring or stripping layers.


    LVM supports RAID 0, 1, 4, 5, 6, and 10. RAID logical volumes created and managed
    by LVM

    the Multiple **dmadm** kernel drivers. When not using LVM, Device Mapper RAID

    **(dm-raid)** provides a device mapper interface to the dmadm kernel drivers.


    # Logical Volume Manager


    LVM physical volumes, volume groups and logical volumes were discussed in a previous
    section.

    LVM can take almost any form of physical or virtual block devices, and build storage
    as logical

    storage volumes, effectively hiding the physical configuration from applications
    and other

    storage clients.


    You stack LVM volumes and implement advanced features such as encryption and

    compression for each of the stack. There are mandated rules and recommended practices
    to

    factual layering for specific scenarios, but this introduction focuses only on
    identifying

    the components. Use-case-specific recommendations are found in the Configuring
    and Managing

    Logical Volumes user guide.


    LVM supports LUKS encryption where a lower block device or partition is presented

    as a secure volume to create a file system on top. The practical advantage for
    LUKS over

    file-system or file-based encryption is that a LUKS-encrypted device does not
    allow public

    accessibility or access to the file-system structure, such that a physical device
    remains secure even

    removed from a computer.


    LVM now incorporates VDO deduplication and compression as a configurable feature
    of regular

    logical volumes. LUKS and VDO can be used together with logical volumes, with
    the

    LVM LUKS encryption enabled underneath the LVM VDO volume.'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'Chapter 6 | Manage Storage Stack


    # # File System or Other Use


    The top layer of the stack is typically a file system, but can be used as raw
    space for databases or custom data requirements. RHEL supports multiple file-system
    types, but recommends XFS for most use cases. XFS is required when the utility
    implementing LVM is Red Hat Ceph or the Stratis tool.


    Database server consumes storage in different ways, depending on their architecture
    and size. Some smaller database store their structures in regular files that are
    contained in a file system because of the overhead or restrictions of file system
    access, this architecture has scaling limits. Larger databases that bypass file
    system, and use their own caching mechanisms, to create their database structures
    on raw storage. Logical volumes are suitable for database and raw storage use
    cases.


    Red Hat Ceph also prefers to create its own storage management structures on raw
    devices to be used to create Ceph Object Storage Devices (OSDs). In the latest
    Red Hat Ceph versions, it uses LVM to initialize device for use as OSDs. More
    information is available in the Cloud Storage with Red Hat Ceph (CL260) course.


    # # Stratis Storage Management


    Stratis is a local management tool developed by Red Hat and the upstream Fedora
    community. It makes it easier to perform an initial storage configuration, change
    a storage configuration, and use advanced storage features.


    > > Important Stratis is currently available as a Technology Preview, but is expected
    to be supported in a later RHEL 9 version. For information on Red Hat scope of
    Technology Preview features, see the Technology Features Support Scope [https://access.redhat.com/support/offerings/techpreview]
    document.


    Red Hat encourages customers to provide feedback when deploying Stratis.


    Stratis runs as a service that manages pools of storage devices and transparently
    creates and manages volumes for the newly created file systems.

    Stratis builds file systems from shared pools of devices by using a concept known
    as *provisioning*. Instead of immediately allocating physical space to the file
    system when you use data, Stratis allocates space from the pool to the file system
    more data. Therefore the file system may appear to be 1 TB in size, but might
    have more 100 GiB of real actual actually allocated to it.


    You can create multiple pools from different storage devices. From each pool,
    you can create one or more file systems. Currently, you can create to $2^{24}$
    file systems per pool.


    Stratis builds the components that make a Stratis-managed file system from Linux
    internals. Stratis uses the Device Mapper infrastructure that LVM also uses. Stratis
    formats the file systems with XFS.


    6.3 illustrates how Stratis assembles the elements of its storage management solution.
    Stratis assigns storage devices as hard disks or SSDs to pools, each contributing
    some physical storage to the pool, then creates file systems from the pools, and
    maps storage to each file system as needed.


    IH134-RHEL9.0-en-2-20220609'
  merge: -1
