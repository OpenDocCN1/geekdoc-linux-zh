    # Manage Stratis File Systems


    Use the stratis filesystem command to create a file system from a pool. The links
    to the file system are in the /dev/stratis/pool1 directory. Use the stratis filesystem
    list command to view the list of available file systems.


    ```

    [root@host ~]# stratis filesystem create pool1 fsi

    [root@host ~]# stratis filesystem list

    ```


    | Pool Name | Used | Created | Device | UUID |

    |---|---|---|---|--|

    | pool1 | fsi | 546 MiB | Apr 08 2022 04:05 | /dev/stratis/pool1/fsi |

    | c7b5719... | | | | |


    Create a file system snapshot by using the stratis filesystem snapshot command.
    Snapshots are independent of the source file systems. Stratis dynamically allocates
    the snapshot space and uses an initial 50 MB to store the file system''s journal.


    # Persistently Mount Stratis File Systems


    You can persist a file system by editing the /etc/fstab file and specifying the
    details of the file system. Use the lsblk command to display the UUID of the file
    system that you should use in /etc/fstab to identify the file system. You can
    also use the stratis filesystem list command to obtain the UUID of the file system.


    ```

    [root@host ~]# lsblk --output=UUID /dev/stratis/pool1/fsi

    UUID

    c7b57198-8fba-463e-8ec8-29c80783d45e

    ```'
