- pgno: 158
  md: '# Persistently Mount File Systems


    Manually mounting a file system is a good way to verify that a formatted device
    is accessible and working as expected. However, when the server reboots, the system
    does not automatically mount the file system.


    To configure the system to automatically mount the file system during boot, add
    an entry to the `/etc/fstab` file. This configuration lists the file systems to
    mount at boot.


    The `/etc/fstab` is a white-space-delimited file with six fields per line.


    ```

    [root@host ~]# cat /etc/fstab


    # /etc/fstab

    # Created by Anaconda on Apr 5 12:05:19 2022

    # Accessible file systems, by reference, are maintained under ''/dev/disk/.

    # See pages fstab(5), findfs(8), mount(8) and/or blkid(8) for more info.

    # After editing this file, run ''systemctl daemon-reload'' to update systemd

    # units generated from this file.

    UUID=a806376-44d0-409a-b5b4-6bbc2c9ff570 xfs defaults 0 0

    UUID=7a280315-ed80-47e5-a5b6-24ffe19f938 xfs defaults 0 0

    ```


    The first field specifies the device. This example uses a UUID to specify the
    device. File systems create and store the UUID in the partition super block at
    creation time. Alternatively, you could use the file device, such as `/dev/vdb1`.


    The second field is the mount point, from which the block device is accessible
    in the directory structure. The mount point must exist; if not, create it using
    the mkdir command.


    The third field contains the file-system type, such as `xfs` or `ext4`.


    The fourth field is the comma-separated list of options to apply to the device.
    `defaults` is a set of commonly used options. The `mount(8)` man pages describe
    the other options.


    The fifth field is the `dump` field, determines whether the `fsck` check should
    be run at system boot. Other backup applications do not use this field.


    The last field is the `fsck` field, determines whether the `fsck` check should
    run at system boot to verify that the file systems are correct. The value in this
    field indicates the order in which `fsck` should run. For XFS file systems, set
    this to 0, because XFS does not use `fsck` to check its file system status, set
    it to 1 for the root file system, and 2 for the other ext4 file systems. By using
    this notation, the `fsck` utility processes the root file system first and then
    checks file systems on separate disks, and file systems on the same disk sequence.'
  merge: -1
  img_proc: true
