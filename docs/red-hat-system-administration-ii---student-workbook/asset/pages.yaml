- pgno: 121
  md: '# Control SELinux File Contexts


    # Objectives


    Manage the SELinux policy rules that determine the default context for files and
    directories with the semanage command and apply the context defined by the SELinux
    policy to files and directories with the restorecon command.


    # Initial SELinux Context


    All resources, such as processes, files, and ports, are labeled with an SELinux
    context. SELinux maintains a file-based database of labeling policies in the /etc/selinux/targeted/contexts/files/
    New files obtain a default label when the file name matches an existing labeling
    policy.


    When a file name does not match an existing labeling policy, the file inherits
    the same label as the parent directory. With labeling inheritance, all files are
    labeled when created, regardless of whether an explicit policy exists for a file.


    When files are created in default locations then new files are labeled with a
    correct SELinux context. However, if a file is created in an unexpected location
    without an existing labeling policy, the inherited label might not be the correct
    for the new intended context.


    Furthermore, copying a file to a new location can cause that file''s SELinux context
    to change, with the new context defined by the new location''s policy, or from
    parent directory inheritance if no policy exists. A file''s SELinux context can
    be preserved by copying to the context label that was defined for the file''s
    original location. For example, the cp -p command preserves all attributes where
    possible, and the cp -c command preserves only SELinux contexts, during.


    > Note

    Copying a file creates a new inode, and that node''s attributes, including the
    SELinux context, must be initially set, as previously discussed.


    However, moving a file does not typically create a new inode if the move occurs
    within the same file system, but instead moves the existing inode''s name to a
    new location. Because the existing inode''s attributes do not need to be initialized,
    a file moved with mv preserves its SELinux context unless you set a new context
    on the file with the -Z option.


    After you copy or move a file, verify that the appropriate SELinux context and
    context are set correctly if necessary.


    The following example demonstrates how this process works.


    Create two files in the /tmp directory. Both files receive the user_tmp_t context
    type.


    Move the first file, and copy the second file, to the /var/www/html directory.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Chapter 4 | Manage SELinux


    +   - The moved file retains the context that was labeled from the original /tmp

    - The copied file has a new inode and inherits the SELinux context from the destination
    /var/www/html directory.


    The ls -z command displays the SELinux context of a file. Observe the label of
    the file that were created in the /tmp directory.


    ```

    root[host]# # touch /tmp/file1 /tmp/file2

    root[host]# # ls -z /tmp/*

    unconfined:object_r:user_tmp_t:s0 /tmp/file1

    unconfined:object_r:user_tmp_t:s0 /tmp/file2

    ```


    The ls -z command displays the SELinux context of the specified directory. Note
    the label on the /var/www/html directory and the files inside it.


    ```

    root[host]# # ls -z /var/www/html/

    system_u_r:httpd_sys_content_t:s0 /var/www/html/

    root[host]# # ls -z /var/www/html/index.html

    unconfined:object_r:httpd_sys_content_t:s0 /var/www/html/index.html

    ```


    Move one file from the /tmp directory to the /var/www/html directory. Copy the
    other file to the same directory. Note the labeling on each file.


    ```

    root[host]# # mv /tmp/file1 /var/www/html/

    root[host]# # cp file2 /var/www/html/

    root[host]# # ls -z /var/www/html/*

    unconfined:object_r:user_tmp_t:s0 /var/www/html/file1

    unconfined:object_r:httpd_sys_content_t:s0 /var/www/html/file2

    ```


    The moved file retains its original label and the copied file inherits the destination
    label. Although not important to this discussion, unconfined_u is the SELinux
    user, object_r is the SELinux policy, and s0 is the (least possible) sensitivity
    level. Advanced SELinux configurations and features use these values.


    # Change the SELinux Context


    You change the SELinux context on files using the semanage fcontext, restorecore,
    and chcon commands.


    The recommended method to set the context for a file is to create a file policy
    using the semanage command, and then apply the context to the file by using the
    restorecore command. This ensures that you can easily relate the file to its correct
    context with the restorecore whenever necessary. The advantage of this method
    is that you do not need to remember what the context is supposed to be, and you
    can easily correct the context on a set of files.


    The chcon command sets SELinux context directly on files, but without referencing
    the system''s SELinux policy. Although chcon is useful for testing and debugging,
    setting contexts manually with this method is temporary. Files that are set manually
    survive a reboot, but might be if you run restorecore to relabel the contents
    of the file system.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# Chapter 4 | Manage SELinux Security


    > Important

    When an SELinux system relabel occurs, all files on a system are labeled with
    their policy defaults. When you use restore on a file, any context that you set
    manually is replaced if it does not match the rules in the SELinux policy.


    The following example creates a directory with a default_t SELinux context, which
    it inherited from the /parent directory.


    ```

    [root@host #] mkdir /virtual

    [root@host #] ls -d /virtual

    unconfined_u:object_r:default_t

    ```


    The chcon command sets the file context of the /virtual directory to the httpd_sys_content_t.


    ```

    [root@host #] chcon -t httpd_sys_content_t /virtual

    [root@host #] ls -d /virtual

    unconfined_u:object_r:httpd_sys_content_t:s0

    ```


    The restorecon command resets the context to the default of default_t. Note the
    Relabeled message.


    ```

    [root@host #] restorecon -v /virtual

    Relabeled from unconfined_u:object_r:httpd_sys_content_t:s0

    unconfined_u:object_r:default_t:s0

    [root@host #] ls -d /virtual

    unconfined_u:object_r:default_t:s0

    ```


    # Define SELinux Default File Context Policies


    The semanage fcontext command manages and modifies the policies that determine
    default file contexts. You can list all the file policy rules by running the semanage
    fcontext -l command. This uses extended regular expression syntax to specify the
    path and file names.


    When viewing policies, the most common regular expression is /(.*), which is usually
    appended to a directory name. This notation is happily called the pirate, because
    it looks like a face with one eye and a hook next to.


    This syntax is described as a "set of characters beginning with a slash and followed
    by any number of characters, where that can either exist or not exist." Stated
    more simply, this syntax matches the directory itself, even when empty, but also
    matches any file name that is created within that.


    For example, the rule specifies that the /var/www/cgi-bin directory, and any files
    in or its subdirectories (and their subdirectories, and so), should have the system_object_r:httpd_sys_script_exec_t:s0
    SELinux context, a more specific rule overrides this.


    ```

    /var/www/cgi-bin/(.*)? all files system_u:object_r:httpd_sys_script_exec_t:s0

    ```


    106 RHI34-RHEL9.0-en-2-20220609'
  merge: -1
  img_proc: true
