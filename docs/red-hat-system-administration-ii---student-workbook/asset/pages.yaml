- pgno: 337
  md: '# Container Concepts


    # Objectives


    Explain container concepts and the core technologies for building, storing, and
    running containers.


    # Container Technology


    Software applications typically depend on system libraries, configuration files,
    or services that their runtime environment provides. Traditionally, the runtime
    environment for a software application is installed in an operating system that
    runs on a physical host or virtual machine. Administrators then install applications
    on top of the operating system.


    In Hat Enterprise Linux, packaging systems as RPM help administrators to manage
    application dependencies. When you install the httpd package, the RPM system ensures
    that the correct libraries and other dependencies for that are also installed.


    The major drawback to traditionally deployed software applications is that these
    dependencies are entangled with the runtime environment. An application might
    require older or newer versions of supporting software than the software that
    is operating with the operating system. Similarly, two applications on the same
    system might require different and incompatible versions of the same software.


    One way to resolve these conflicts is to package and deploy the application as
    a container. A container is a set of one or more processes that are isolated from
    the rest of the system. Software containers provide a way to package applications
    and simplify their deployment and management.


    Think of a shipping container. A shipping container is a standard way to pack
    and ship goods. It is labeled, loaded, unloaded, and transported from one location
    to another as a single box. The container''s contents are isolated from the contents
    of other containers so that they do not affect each other. These underlying principles
    also apply to software containers.


    Red Hat Linux supports containers by using the following technologies:


    +   - Control Groups (cgroups) for resource management.

    - Namespaces for process isolation.

    - SELinux and Seccomp (Secure Computing Mode) to enforce security boundaries.


    > For a more in-depth discussion of container architecture and security, refer
    to the "Ten layers of container security" [https://www.redhat.com/en/resources/container-security-openshift-cloud-devops-whitepaper]
    white paper.


    # Differences Between Containers and Virtual Machines


    Containers provide many of the same benefits as virtual machines, such as security,
    storage, and network isolation.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# Chapter 11 | Run Containers


    Both technologies utilize application libraries and runtime resources from the
    host operating system or hypervisor and vice versa.


    ![](img/2eff90170b8c94cce3a908ab927e38c2_338_0.png)


    Containers and virtual machines interact differently with hardware and the underlying
    operating system.


    A virtual machine has the following characteristics:


    +   - Enables multiple operating systems to run simultaneously on a single hardware
    platform.

    - Uses a hypervisor to divide hardware into multiple virtual hardware systems.

    - Requires a complete operating system environment to support the application.


    A container has the following characteristics:


    +   - Runs directly on the host operating system, and shares resources with all
    containers on the system.

    - Shares the host''s kernel, but it isolates the application processes from the
    rest of the system.

    - Requires fewer hardware resources than virtual machines, so containers are also
    quicker to start.

    - Includes all dependencies such as system and programming dependencies, and configuration
    settings.


    > Note Some applications might not be suitable to run as a container. For example,
    applications that access low-level hardware information might need more direct
    access than containers generally provide.


    # Rootless and Rootful Containers


    On the container host, you can run containers as root or as a regular, unprivileged
    user. Containers that a privileged user runs are called rootful containers. Containers
    that non-privileged users run are called rootless containers.


    A rootless container is not allowed to use system resources that are usually reserved
    for privileged users, such as access to restricted directories, or to publish
    network services on restricted ports (those ports below 1024). This feature prevents
    an attacker from gaining root privileges on the container host.


    You can run containers directly as root if necessary, but this scenario weakens
    the security of the system if a bug allows an attacker to compromise the container.'
  merge: -1
  img_proc: true
- pgno: 339
  md: '# Design a Container-based Architecture


    Containers are efficient to run hosted applications and to make them portable.
    Containers can be easily moved from one environment to another, such as from development
    to production. You can save multiple versions of a container and quickly access
    each as needed.


    Containers are typically temporary, or ephemeral. They can permanently persist
    in persistent storage the data that a running container generates, but the containers
    themselves usually run when, and then they are removed. A new container process
    is started the next time particular container is needed.


    You could install a complex software application with multiple services in a single
    container. For example, a web server might need to use a database and a messaging
    system. However, using one container for multiple services is hard to manage.


    A better design runs in separate containers each component, the web server, the
    database, and the messaging system. This way, updates and maintenance to individual
    application components do not affect other components or the application stack.


    # Container Management Tools


    Red Hat Enterprise Linux provides a set of container tools that you can use to
    run containers in a single server.


    +   - podman manages containers and container images.

    - skopeo inspects, copies, deletes, and signs images.

    - build creates images.


    These tools are compatible with the Open Container Initiative (OCI). With these
    tools, you can manage any Linux containers that are created by OCI-compatible
    engines, such as Podman or Docker. These tools are specifically designed to run
    containers under Red Hat Enterprise Linux on a single-node container host.


    In this chapter, you use the podman and skopeo utilities to run and manage containers
    and existing container images.


    > Note

    Using build to construct your container images is beyond the scope of this course,
    but is covered in the Red Hat Training course Red Hat OpenShift I: Containers
    & Kubernetes (DO180).


    # Container Images and Registries


    To run containers, you must use a container image. A container image is a static
    file that contains codified steps, and it serves as a blueprint to create containers.
    The container images package an application with all its dependencies, such as
    its system libraries, programming language runtimes and libraries, and other configuration
    settings.


    Container images are built according specifications, such as the Open Container
    Initiative (OCI) image specification. These specifications define the format for
    container images, as well as the metadata about the container host operating systems
    and hardware architectures that the image supports.'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# Chapter 11 | Run Containers


    A registry is a repository for storing and retrieving images. A developer pushes
    or uploads container images to a container registry. You can pull or download
    container images from a registry to run run containers.


    You might use a public registry with third-party images, or you might use a private
    registry that your organization controls. The source of your container images
    matters. As any other software package, you must know how you can trust the content
    in the container image. Policies between registries about whether and how they
    provide, evaluate, and test container images are submitted to them.


    Red Hat distributes certified container images through two main registries that
    you can access with your Red Hat credentials.


    +   - registry.redhat.io for containers that are based on official Red Hat products.

    - registry.connect.redhat.com for containers that are based on third-party products.


    The Red Hat Container Catalog (https://access.redhat.com/containers) provides
    a web-based interface to search these registries for certified content.


    > Note: Red Hat provides the Universal Base Image (UBI) image as an initial layer
    to build containers. The UBI image is a minimized container image that can be
    a first layer for an application build.


    You need a Red Hat Developer account to download an image from the Red Hat registries.
    You can use the podman command to authenticate to the registries. If you do not
    provide a registry URL the podman login command then it authenticates to the default
    configured registry.


    ```

    [user@~] podman login registry.lab.example.com

    Username: RH134

    Password: EXAMPLEPASSWORD

    Login Success!

    ```


    You can use the podman command --username and --password-stdin options, to specify
    the user and log in to the registry. The --password-stdin option returns the password
    from stdin. Red Hat does not recommend to use the --password option to provide
    the password directly, as this option stores the password in the log files.


    ```

    [user@~] echo PASSWORD | podman login --username RH134 \

    --password-stdin registry.access.redhat.com

    ```


    To verify that you are logged in to registry, use the podman login command --get-login
    option.


    ```

    [user1@rhel-vm] $ podman login registry.access.redhat.com --get-login

    RH134

    [user1@rhel-vm] $ podman login quay.io --get-login

    Error: not logged into quay.io

    ```'
