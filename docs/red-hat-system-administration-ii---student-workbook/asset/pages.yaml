  md: 'In the preceding output, the podman utility is authenticated to the registry.access.redhat.com
    registry with the RH134 user credentials, the podman utility is not authenticated
    to the quay.io registry.


    # Configure Container Registries


    The default configuration file for container registries is the /etc/containers/registries.conf
    file.


    ```

    [user@host ~] cat /etc/containers/registries.conf

    [output omitted]

    [registries.search]

    registries = [''registry.redhat.io'', ''quay.io'', ''docker.io'']


    # If you need to access insecure registries, add the registry''s fully-qualified
    name.

    # An insecure registry is one that does not have a valid SSL certificate or only

    does use HTTP.

    [registries.insecure]

    registries = []

    [output omitted...]

    ```


    Red Hat recommends using a non-privileged user to manage containers, you can create
    a registries.conf file for container registries in the $HOME/.config/containers
    directory. The configuration file in this directory overrides the settings in
    the /etc/containers/registries.conf file.


    The list of registries to look for containers is configured in the [registries.search]
    section of this file. If you specify the fully qualified name of a container from
    the command line, then the utility does not search in this section.


    Insecure registries are listed in the [registries.insecure] section of the registries.conf
    file. If a registry is insecure, connections to that are not protected with TLS
    encryption. If a registry is both searchable and insecure, it can be listed in
    both [registries.search] and [registries.insecure].


    > Note

    This classroom runs a private insecure registry on Red Hat Quay to provide container
    images. This registry meets the classroom need; however, you would not expect
    to work with insecure registries in real-world scenarios. For more information
    about software, see https://access.redhat.com/products/red-hat-quay.


    # Container Files to Build Container Images


    A container file is a text file with the instructions to build a container image.
    A container file usually has a context that defines the path or URL where its
    files and directories are located. The resulting container image contains read-only
    layers, where each layer represents an instruction from the container file.


    The following output is an example of a container file that uses theubi image
    from the registry.access.redhat.com registry, installs the python3 package, and
    prints the hello string to the console.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# Chapter 11 | Run Containers


    ```

    [user@host ~]$ cat Containerfile

    FROM registry.access.redhat.com/ubi8/ubi:latest

    RUN dn install -y python3

    CMD ["/bin/bash", "-c", "echo hello"]

    ```


    > Note

    Creating a container file and its usage instructions are out of scope for this
    course.

    For more information about container files, refer to the DO1800.


    # Container Management at Scale


    New applications increasingly use containers to implement functional components.
    Containers provide services that other parts of the application consume. In an
    organization, managing a growing number of containers might quickly become an
    overwhelming task.


    Deploying containers at scale in production requires an environment that can adapt
    to the following challenges:


    +   - The platform must ensure the availability of containers that provide essential
    services.

    - The environment must respond to application spikes by increasing or decreasing
    the number of running containers and balancing the traffic.

    - The platform must detect the failure of a container or a host and react accordingly.

    - Developers might need an automated workflow to deliver new application versions
    transparently and securely.


    Kubernetes is an orchestration service that deploys, manages, and scales container-based
    applications across a cluster of hosts. Kubernetes redirects traffic to your containers
    with a load balancer, so that you can scale the number of containers that provide
    a service. Kubernetes also supports user-defined checks to monitor your containers
    and restart if they fail.


    Red Hat provides a distribution of Kubernetes called Red OpenShift. Red Hat OpenShift
    is a set of modular components and services that are built on top of the Kubernetes
    infrastructure. It provides additional features, such as web-based management,
    multitenancy, monitoring and auditing, advanced security features, application
    lifecycle management, and self-service for developers.


    Red Hat OpenShift is beyond the scope of this course, but you can learn more about
    it at https://www.openshift.com.


    > Note

    In enterprise, individual containers are not generally run from the command line.
    Instead, it is preferable to run containers in production with a Kubernetes-based
    platform, such as Red Hat OpenShift.


    However, you might need to use commands to manage containers and images manually
    or at a small scale. This chapter focuses on this case to improve your grasp of
    the core concepts behind containers, how they work, and how they can be useful.


    I34-RHEL9.0-en-2-202206069 325'
