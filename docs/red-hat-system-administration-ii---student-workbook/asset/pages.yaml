- pgno: 310
  md: '# Automate Installation with Kickstart


    # Objectives


    Explain Kickstart concepts and architecture, create a Kickstart file with the
    Kickstart Generator website, modify an existing Kickstart file with a text editor
    and check its syntax with validator, publish a Kickstart file to the installer,
    and install Kickstart on the network.


    # Introduction to Kickstart


    The Kickstart feature of Red Hat Enterprise automates system installations. You
    can use Kickstart text to configure disk partitioning, network interfaces, package
    selection, and customize the install. The Anaconda installer uses Kickstart files
    to perform a complete installation without user interaction. The Kickstart feature
    is simple and an unattended Set answer file for Microsoft Windows.


    Kickstart begins with a list of commands that define how to install the target
    machine. The installer ignores lines denoted by the number sign (#) character.
    Additional sections begin with a directive, denoted by the percentage (%) character,
    and end on a line with %end directive.


    The %sections specify what software to include upon installation. Specify individual
    packages by name, without versions. The ampersand (&) character and the # character
    define environment groups (groups of package groups). Lastly, use the module:stream/profile
    syntax to denote dense modules.


    Groups have mandatory, default, and optional components. Kickstart installs mandatory
    and default components. To exclude a package or group from the installation, precede
    with a hyphen (-) character. Excluded packages or package groups might still install
    if they are mandatory dependencies of requested packages.


    A Kickstart configuration typically includes one or more %pre and %post sections,
    which contains scripts that further configure the system. Typically, you use %pre
    scripts to install a storage or device before the remainder of the installation.
    The %post scripts execute once the installation is complete. Scripts can use any
    interpreter available on the system, including Bash or Python. Wherever possible,
    you should avoid using a %pre section, because errors might be difficult to diagnose.


    Lastly


    > Note RHEL Image Builder is an alternative installation method to Kickstart.
    Rather than a text file providing installation instructions, Image Builder creates
    an image containing all of the required changes. The RHEL Image Builder can create
    images for public clouds such as Amazon Web Services and Microsoft Azure, or private
    clouds as OpenStack or VMware. See this section''s references for more information
    on the RHEL Image Builder.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# Installation Commands


    The following Kickstart commands configure the installation source and method:


    +   - url: Specifies the URL pointing to the installation media.


    ```

    url --url="http://classroom.example.com/content/rhel9.0/x86_64/dvd/

    ```


    +   - repo: Specifies where to find additional packages for installation. This
    option must point to a

    NF repository.


    ```

    repo --name="appstream" --baseurl=http://classroom.example.com/content/rhel9.0/

    x86_64/dvd/AppStream/

    ```


    +   - text: Forces a text mode install.


    +   - vnc: Enables the VNC viewer so you can access the graphical installation
    remotely over VNC.


    ```

    vnc --password=redhat

    ```


    # Device and Partition Commands


    The following Kickstart commands configure device and partitioning schemes:


    +   - clearpart: Removes partitions from the system prior to creation of new partitions.


    ```

    clearpart --all --drives=vda,vdb

    ```


    +   - part: Specifies the size, format, and name of a partition. Unless the autopart

    mount commands are present.


    ```

    /part /home --fstype=ext4 --label=homes --size=4096 --maxsize=8192 --grow

    ```


    +   - autopart: Automatically creates a root partition, a swap partition, and
    an appropriate boot

    partition for the architecture. On enough drives (50 GB+), this also creates a
    /home

    partition.


    +   - ignoreddisk: Prevents Anaconda from modifying disks, and is useful alongside
    the autopart

    command.


    ```

    ignoreddisk --drives=sdc

    ```


    +   - boot loader: Defines where to install the bootloader. Required.


    ```

    bootloader --location=mbr --boot-drive=sda

    ```


    +   - volgroup, logvol: Creates LVM volume groups and logical volumes.


    ```

    part pv.01 --size=8192

    volgroup myvg pv.01

    log / --vgname=myvg --fstype=xfs --size=2048 --name=rootvol --grow

    log /vgname=myvg --fstype=xfs --size=4096 --name=varvol

    ```'
  merge: -1
  img_proc: true
