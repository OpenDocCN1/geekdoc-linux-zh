- pgno: 275
  md: '# Manage Server Firewalls


    # Objectives


    Accept or reject network connections to system services with firewalld rules.


    # Firewall Architecture Concepts


    The Linux kernel provides the netfilter framework for network traffic operations
    such as packet filtering, network address translation, and port translation. The
    netfilter framework includes hooks for kernel modules to interact with network
    packets as they traverse a system''s network stack. Fundamentally, netfilter hooks
    are kernel routines that intercept events (for example, a packet entry) and other
    related runtimes (for example, firewall rules).


    # The nftables Framework


    The nftables packet classification framework builds upon the netfilter framework
    to apply firewall rules to traffic. In Red Enterprise Linux 9, nftables is the
    system firewall framework, and replaces the deprecated iptables framework.


    The nftables framework provides numerous advantages over iptables, including improved
    usability and more efficient rules. For example, the iptables framework required
    a rule for each protocol, but nftables can apply to both IPv4 and IPv6 traffic
    simultaneously. The iptables framework required using different tools, such as
    iptables_ipv6, artables, and etables, for each protocol, but the nftables framework
    uses the single nft user-space interface to manage all protocols through a single
    interface.


    > Note Convert legacy iptables configuration files into their nftables equivalents
    using iptables-translate and nftables-translate utilities.


    # The firewalled Service


    The firewalled service is a dynamic firewall manager, and is the recommended front
    end to the nftables framework. The Red Enterprise Linux 9 distribution includes
    the firewall package.


    The firewalled service simplifies firewall management by classifying network traffic
    into zones. A network packet''s assigned zone depends on criteria such as the
    source IP address of the packet or the incoming network interface. Each zone has
    its list of ports and services that are either open or closed.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# Chapter 9 | Manage Network Security


    > Note: For laptops or other machines that regularly change networks, the NetworkManager
    can set the firewall zone for a connection. This is useful when switching between
    home, work, and public wireless. A user might want their system''s sshd service
    to be reachable when connected to their home or corporate networks, but not when
    connected to a wireless network in the local coffee shop.


    The firewall checks source address for every packet entering the system. If that
    source address is assigned to a specific zone, the rules for that zone apply.
    If the source address is not assigned to a zone, then the firewall associates
    the packet with the incoming network interface and the rules for that zone apply.
    If the network interface is not associated with a zone, then the firewall sends
    the packet to the default zone.


    The default zone is not a separate zone but a designation of an existing zone.
    Initially


    Most zones allow traffic through the firewall, which matches a list of particular
    ports and protocols, such as udp/, or a predefined service configuration, such
    as ssh. Normally, if the traffic does not match a permitted port or protocol service,
    it is rejected. The trusted zone, which permits traffic by default, is an exception.


    # Predefined Zones


    The firewall service uses predefined zones, which you can customize. By default,
    all zones permit any traffic which is part of an existing session initiated by
    the system, and also allow outgoing traffic. The following details the initial
    zone configuration:


    # Default Configuration of Firewall Zones


    | Zone name | Default configuration |

    |---|---|

    | trusted | Allow all incoming traffic. |

    | home | Rejecting incoming traffic unless related to outgoing traffic or matching
    the ssh, mdns, pp-client, samba-client, or dhcpv6-client predefined services.
    |

    | internal | Rejecting incoming traffic unless related to outgoing traffic or
    matching the ssh, mdns, pp-client, samba-client, or dhcpv6-client predefined services
    (same as the home zone to start). |

    | work | Rejecting incoming traffic unless related to outgoing traffic or matching
    the ssh, pp-client, or dhcpv6-client predefined services. |

    | public | Rejecting incoming traffic unless related to outgoing traffic or matching
    the ssh or dhcpv6-client predefined services. The default zone for newly added
    network interfaces. |'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# Chapter 9 | Manage Network Security


    | Zone name | Default configuration |

    |---|---|

    | external | Reject incoming traffic unless related to outgoing traffic or matching
    the ssh defined service. Outgoing IPv4 traffic forwarded through this zone is
    masqueraded to look like it originated from the IPv4 address of the network interface.
    |

    | dmz | Reject incoming traffic unless related to outgoing traffic or matching
    the ssh defined service. |

    | block | Reject all incoming traffic unless related to outgoing traffic. |

    | drop | Drop all incoming traffic related to outgoing traffic (do not even respond
    with ICMP errors). |


    For a list of available predefined zones and their indexed use, see the firewall.zones(5)
    man page.


    # Predefined Services


    The firewall service includes a number of predefined configurations for common
    services, to simplify filtering rules. For example, instead of researching the
    relevant parts for an NFS server, use the predefined nfs configuration rule the
    correct ports and protocols. The following table lists the predefined service
    configurations that the firewall service uses in its default configuration.


    # Selected Predefined Services


    | Service name | Configuration |

    |---|---|

    | ssh | Local SSH server. Traffic to 22/tcp. |

    | dhcpv6-client | Local DHCPv6 client. Traffic to 546/udp on the fe80::64 IPv6
    network. |

    | ipp-client | Local IP printing. Traffic to 631/udp. |

    | samba-client | Local Windows file and sharing client. Traffic to 137/udp and
    138/udp. |

    | mdns | Multicast DNS (mDNS) local-name resolution. Traffic to 5353/udp to the
    224.0.0.251 (IPv4) or ff02::fb (IPv6) multicast addresses.


    The firewall package includes predefined service configurations. You can list
    the services with the firewall-cmd --get-services.


    ```

    [root@host]# firewall-cmd --get-services

    RH-Satellite-6 RH-Satellite-6-capsule amenda-client amanda-k5-client amqp amqs

    apcusd upaudit bacula bacula-client bb bg bitcoin bitcoin-rpc bitcoin-testnet

    bitcoin-testnet-rpc bitorrent-lsd ceph ceph-mon cfengine cockpit collectcd

    ...output omitted ...

    ```'
