- pgno: 129
  md: "# Adjust SELinux Policy with Booleans\n\n# Objectives\n\nActivate and deactivate\
    \ SELinux policy rules with the setbool command, manage the persistent value of\
    \ SELinux Booleans with the semanage boolean -l command, and consult man pages\
    \ that end with _selinux to find useful information about SELinux Booleans.\n\n\
    # SELinux Booleans\n\nAn application or service developer writes an SELinux policy\
    \ to define the behavior of the target application. A developer can include optional\
    \ application behavior in the SELinux policy that can be enabled when the behavior\
    \ is active on a specific system. SELinux Booleans enable or disable the SELinux\
    \ policy's optimal behavior. With Booleans, you can selectively tune the behavior\
    \ of an application.\n\nThese booleans are application-specific, must be discovered\
    \ and collected for each targeted application. Service-specific Booleans are documented\
    \ in that service's SELinux man page. For example, the web server httpd service\
    \ has httpd(8) man page, and httpd_selinux_policy (8) man page to manage its SELinux\
    \ policy, including the supported processes types, file types, and the available\
    \ Enabled-Boolean attributes. The SELinux man pages are provided in the selinux-policy-doc\
    \ package.\n\nUse the getbool command to list available Booleans for the targeted\
    \ policies on this system, and the current state. Use the setbool -P command option\
    \ to enable or disable the state of these booleans by writing to the policy. Only\
    \ privileged users can set SELinux Booleans.\n\n```\n[root@#] getbool -a\nabrt_anon_write\
    \ -- off\nabrt_handle_event -- off\nabrt_upload_anon_write -- on\n  ..output omitted.\n\
    ```\n\n# Example httpd Policy Boolean\n\nThe httpd service policy includes the\
    \ httpd_enable_homedirs Boolean, which enables the sharing of home directories\
    \ with httpd. Typically, a user's local home directory is accessible to the user\
    \ only when in the local system. Alternatively, home directories are shared and\
    \ accessed using a remote file sharing protocol, such as NFS. In both cases, home\
    \ directories are not shared using httpd, by default, and are not available to\
    \ the user through a browser.\n\n```\n[root@#] getbool httpd_enable_homedirs\n\
    httpd_enable_homedirs -- off\n```\n\nTo enable sharing and allow users to access\
    \ their home directories with a browser. When enabled, the httpd service serves\
    \ home directories that are labeled with the user_home_dir_t file context. Users\
    \ can access and manage their home directory files from a browser."
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Manage the Policy Boolean


    Setting Booleans with the setboolean command with the -P option is temporary,
    and will return to the persistent values after rebooting. View additional information
    with the semanage boolean -l command, which lists the Booleans from the policy
    files, including when a Boolean is persistent, the default and current values,
    and a short description.


    ```

    [root@#] semanage boolean | grep httpd_enable_homedirs

    thd_enable_homedirs (off , ) Allow httpd to enable homedirs

    [root@#] semanage boolean -l | grep httpd_enable_homedirs

    thd_enable_homedirs (on , ) Allow httpd to enable homedirs

    [root@#] setboolean httpd_enable_homedirs

    thd_enable_homedirs -> on

    ```


    To list all Booleans with a current that is different from the default setting
    at boot, use the semanage boolean -l C command. This example has the same result
    as the previous example, without requiring the grep filtering.


    ```

    [root@#] semanage boolean -l -C

    SELinux boolean State Default Description

    thd_enable_homedirs (on , ) Allow httpd to enable homedirs

    ```


    The previous example shows the current value for the httpd_enable_homedirs Boolean
    to on, until system reboot. To change the default setting, use the setboolean
    -P command to make the setting persistent, and then views the Boolean''s value
    from the policy file.


    ```

    [root@#] setboolean -P httpd_enable_homedirs on

    [root@#] semanage boolean -l | grep httpd_enable_homedirs

    thd_enable_homedirs (on , ) Allow httpd to enable homedirs

    ```


    Use the semanage boolean -l -C command again. The Boolean is displayed despite
    the appearance that the current and default settings are the same. However, the
    -C option matches when the current is different from the default setting from
    the last boot. For httpd_enable_homedirs example, the original default boot was
    off.


    ```

    [root@#] semanage boolean -l -C

    SELinux boolean State Default Description

    thd_enable_homedirs (on , ) Allow httpd to enable homedirs

    ```


    +   References

    booleans(8), getboolean(8), setboolean(8), semanage(8), and semanage-boolean(8)
    man pages'
  merge: -1
  img_proc: true
