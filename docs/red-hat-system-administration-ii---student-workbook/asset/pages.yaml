- pgno: 257
  md: 'Chapter 8 | Control the Boot Process


    +   2. Interrupt the boot-loader countdown by pressing any key, except Enter.


    +   3. Move the cursor to the kernel to boot.


    +   4. Press e to edit the entry.


    +   5. Move the cursor to the kernel command line (the line that starts with linux).


    +   6. Append systemd.debug-shell. With this parameter, the system boots into
    the debug shell.


    +   7. Press Ctrl+x to boot the changes.


    # Use the Emergency and Rescue Targets


    By appending systemd.unit-rescue.target or systemd.unit-emergency.target to the
    kernel command line from the boot loader, the system spawns a rescue or emergency
    shell instead of starting normally. Both of these shells require the root password.


    The emergency target roots the file system read-only, while the rescue target
    waits for systeminit to complete, so that more of the system is initialized, such
    as the logging service or the file services. The root user at this point can make
    changes to /etc/fstab until the drive is remounted in a read write state with
    the mount -o remount,rw / command.


    Administrators can use these shells to fix any issues that prevent the system
    from booting normally; for example a dependency loop between services, or an incorrect
    entry in /etc/fstab. Exiting from these shells continues with the regular boot
    process.


    # Identify Stuck Jobs


    During startup, systemd spawns a number of jobs. If some of these jobs cannot,
    they block other jobs from running. To inspect the current job list, administrators
    can use the systemctl list-jobs command. Any jobs listed as running must complete
    before the jobs listed as waiting continue.


    > References

    dracut.cmdline(7), systemd-journald(8), journald.conf(5),

    journalctl(1), and systemctl(1) man pages


