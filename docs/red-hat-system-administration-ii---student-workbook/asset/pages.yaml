    > This course introduced two metachar text parsing mechanisms: shell pattern matching
    (also known as globbing or file expansion), and regular expressions. Both systems
    use similar metachar, such as the asterisk character (*), but have differences
    in metachar interpretation and rules, the two mechanisms can be confusing until
    each is sufficiently practiced.


    Pattern matching is a command-line parsing technique designed for easily specifying
    file names, and is primarily supported for representing file-name patterns on
    the command line. Regular expressions are designed to represent any form or pattern
    in text, no matter how complex. Regular expressions are internally supported by
    numerous text processing commands, such as the grep, sed, awk, python, and per
    l, and many applications, with some command-dependent variations in interpretation
    rules.


    # Regular Expressions in Bash


    | Option | Description |

    | --- | --- |

    | . | The period (.) matches any single character. |

    | ? | The preceding item is optional and is matched at most once. |

    | * | The preceding item is matched zero or more times. |

    | + | The preceding item is matched one or more times. |

    | {n} | The preceding item is matched exactly n times. |

    | {n,} | The preceding item is matched n or more times. |

    | {m} | The preceding item is matched at most m times. |

    | {n,m} | The preceding item is matched at least n times, but not more than m
    times. |

    | [:alnum:] | Alphanumeric characters: [:alpha:] and [:digit:]; in the ''C'' locale
    and ASCII encoding, this expression is the same as [0-9A-Za-z]. |'
