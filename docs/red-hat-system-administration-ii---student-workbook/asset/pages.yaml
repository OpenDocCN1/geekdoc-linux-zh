- pgno: 151
  md: '# Add Partitions, File Systems, and Persistent Mounts


    # Objectives


    Create storage partitions, format them with file systems, and mount them for use.


    # Partition Disks


    Disk partitioning divides a hard drive into multiple logical storage partitions.
    You can use partitions to divide storage based on different requirements, and
    this division provides numerous benefits:


    +   - Limit available space to accounts or users.

    - Separate operating system and program files from user files.

    - Create a separate area for memory swapping.

    - Limit disk space use to improve the performance of diagnostic tools and backup
    imaging.


    # MBR Partition Scheme


    The Master Boot Record (MBR) partitioning scheme is the standard on systems that
    run BIOS firmware. This scheme supports a maximum of four primary partitions.
    On Linux systems, with extended and logical partitions, you can create up to 15
    partitions. With a 32-bit partition size, disks are partitioned with MBR can have
    a size up to 2 TiB.


    | MBR | Primary | Primary | Primary | Extended (vdb4) | |

    |---|---|---|---|---||

    | vdb1 | vdb2 | vdb3 | vdb5 | vdb6 | Unused |


    Figure 5.1: MBR partitioning of the /dev/vdb storage device


    The 2 TiB disk partition size is also a known and restrictive limitation. Consequently,
    the legacy MBR scheme is superseded by the Guid Partition Table (GPT) partitioning
    scheme.


    # GPT Partition Scheme


    For systems using Unifiedensible Firmware Interface (UEFI), GPT is the standard
    for disk partitioning and addresses the limitations of the MBR scheme. A GPT provides
    up to 128 partitions. The GPT scheme allocates 64 bits for logical block addresses,
    to support partitions and disks of up to eight zebabytes (ZiB) or eight billion
    terabytes (TiB).


    | GPT | Backup GPT |

    |---|---|

    | vdb1 | vdb2 | vdb3 | vdb4 | vdb5 | Unused |


    Figure 5.2: GPT partitioning of the /dev/vdb storage device


    GPT partitioning offers additional features and benefits over MBR. A GPT uses
    a globally identifier (GUID) to identify each disk and partition. A GPT makes
    the partition table redundant,'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Manage Partitions


    with the primary GPT at the head of the disk, and a backup secondary GPT at the
    end of the disk. A GPT uses a checksum to detect errors in the GPT header and
    partition table.


    An administrator uses a partition editor to change a disk''s partitions, such
    as creating and deleting partitions, and changing partition types.


    > Note

    Which partition editor should you use? Although IT professionals have strong opinions
    about feature distinctions, each listed editor here performs common disk preparation
    tasks successfully.

    * **disk** is a historical favorite and has supported GPT partitions for years.

    * **gdisk** and other **disk** variants were initially created to support GPT.

    * **parted** and the **libparted** library have the RHEL standard for users.

    * **Anaconda** continues to use the **libparted** library.

    * **gnome-disk** is the default GNOME tool, replacing **gparted** upstream.

    * Almost all CLI editors are good for scripting, and **parted** was designed for
    it.


    Administrators use the partition editor for both the MBR and the GPT partitioning
    scheme. The **parted** command takes the whole device name as the first argument,
    followed by commands. The following examples use the `parted` subcommand to display
    the partition table on `/dev/vda`.


    ```

    [root@host ~] parted /dev/vda print

    Model: Virtio Block Device (virtblk)

    Disk/dev/vda: 53.7GB

    Sector size (logical/physical): 512B/512B

    Partition Table: mdos

    Disk Flags:

    Number Start End Size Type File system Flags

    1 1049KB 10.7GB 10.7GB primary xfs boot

    2 10.7GB 53.7GB 42.9GB primary xfs

    ```


    Use the **parted** command without a subcommand to open an interactive partitioning
    session.


    ```

    [root@host ~] parted /dev/vda

    GNU GPT 3.4

    Using /dev/vda

    Welcome to GPT Parted! ''help'' to view a list of commands.

    (parted) print

    Model: Virtio Block Device (virtblk)

    Disk/dev/vda: 53.7GB

    Sector size (logical/physical): 512B/512B

    Partition Table: mdos

    Disk Flags:

    Number Start End Size Type File system Flags

    1 1049KB 10.7GB 10.7GB primary xfs boot

    2 10.7GB 53.7GB 42.9GB primary xfs

    ```


