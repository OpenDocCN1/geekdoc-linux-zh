- pgno: 227
  md: '# Create an Indirect Map


    Now, create the mapping files. Each mapping file identifies the mount point, mount
    options, and source location for a set of autofounts.


    ```

    [user@host ~]$ sudo vim /etc/auto.demo

    ```


    The mapping file-naming convention is /etc/auto.name, where name reflects the
    content of the map.


    ```

    work -rw, sync server:/shares/work

    ```


    The format of an entry is mount point, mount options, and source location. This
    example shows a basic indirect mapping. Direct maps and indirect maps use wildcards
    are covered later in this section.


    Known as the key in maps, the mount point is created and removed automatically
    by the autofofs service. In this case, the fully qualified mount point is /shares/work
    (see the master file). The /shares and /shares/ directories are created and removed
    as needed by the autofofs service.


    In this example, the local mount mirrors the server''s directory structure. However,
    mirroring is not required; the local mount point can have any name. The autofofs
    service does not enforce a strict naming convention on the client.


    Mount options start with a dash (-) and comma-separated with no space. The file
    system options for manual mounting are also available when automounting. In this
    example, the autofounter mounts the entry with read/write (rw option), and the
    server is synchronized immediately during write operations (sync option).


    Useful autofounter-specific options include -ftype and -strict. Use ftype to specify
    the file-system type, as nfs or xfs, and strict to treat errors when mounting
    file systems as fatal.


    The source location for NFS exports follows the host: /pathname, in this example
    server:/shares/work. For this to succeed, the NFS server, server must export the
    directory with read/write access, and the user if server exports read/only access,
    then the client gets read/only access if it requested read/write access.


    # Wildcards in an Indirect Map


    When an NFS server exports multiple subdirectories within a directory, the automounter
    can be configured to access any of those subdirectories with a single mapping
    entry.


    Continuing the previous example, if server exports two or more subdirectories,
    and they are accessible with the same mount options, the content for the /etc/auto.demo
    file appears as follows:


    +   * -rw, sync server:/shares/


    The mount point (or key) is an asterisk (*), and the subdirectory on the source
    location is an ampersand character (&). Everything else in the entry is the same.'
