  md: '# Schedule Recurring System Jobs


    # Objectives


    Schedule commands to run on a repeating schedule with the system crontab file
    and directories.


    # Recurring System Jobs


    ```

    SHELL=/bin/bash

    PATH=/usr/bin:/usr/sbin:/bin

    MAILTO=root


    # For details see man 4 crontab


    # Example of job definition:

    #   minute (0 - 59)

    #   hour (0 - 23)

    #   day of month (1 - 31)

    #   month (1 - 12) OR jan,feb,mar,apr

    #   day of week (0 - 6) (Sunday=0 or 7)

    #   sun, mon, wed, thu, fri, sat


    #   user-name command to be executed

    ```


    The /etc/crontab file and other files in the /etc/cron.d/ directory allow for
    recurring system jobs. Always use custom crontab files in the /etc/cron.d/ directory
    to schedule recurring system jobs. Place the custom cron file in the /etc/cron.d
    directory to prevent a package update from overwriting the /etc/crontab file.
    Packages that require recurring system jobs place their crontab files in the /etc/cron.d/
    directory with the job entries. Administrators also use this location to group
    related jobs into a single file.


    The crontab also includes repositories for scripts to run every hour, day, week,
    and month. These repositories are placed under /etc/cron.hourly/, /etc/cron.daily/,
    /etc/cron.weekly/, and /etc/cron.monthly/ directories. These directories contain
    executable scripts, not crontab files.


    > Note Use chmod +x script_name command to make a script executable. If a script
    is not executable, it does not run.'
