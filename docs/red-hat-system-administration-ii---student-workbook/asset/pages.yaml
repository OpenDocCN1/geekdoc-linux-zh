- pgno: 254
  md: '# Reset the Root Password


    # Objectives


    Log in to a system and change the root password when the current root password
    is lost.


    # Reset the Root Password from the Boot Loader


    One task that every system administrator should be able to accomplish is resetting
    a root password. This task is trivial if the administrator is still logged in,
    either with full sudo, or an unprivileged user as root. This task becomes slightly
    more involved when the administrator is not logged in.


    Several methods exist to set a new root password. A system administrator could,
    for example, boot the system by using a Live CD, mount the root file system from
    there, and edit /etc/shadow. In this section, we explore a method that does not
    require the use of external media.


    > On Red Hat Enterprise Linux 6 and earlier, administrators can boot the system
    into runlevel 1 by a root prompt. The closest analogs to level 1 on a Red Hat
    Enterprise Linux 8 or later machine, are the rescue and emergency managers, of
    which require the root password to log in.


    > If you deployed from a Red Hat cloud image, you will not have a rescue kernel
    in your boot menu, however your default kernel will have similar behavior that
    allows you to enter maintenance mode without the root password.


    On Red Hat Enterprise Linux 9, it is possible to have the scripts that run from
    the initramfs pass certain points, provide a root shell, and then continue when
    she exits. This is mostly meant for debugging, but you can use this method to
    restore a root password.


    Starting from Red Hat Enterprise Linux 9, if you install your system from a DVD,
    the default kernel asks for the root password when you try to enter maintenance
    mode. Thus, for the purpose of resetting a root password, you need to use the
    rescue kernel. However, if you deploy your system from a Red Hat cloud image,
    you do not have a rescue kernel in your boot menu, but your default kernel has
    the similar behavior that allows you to enter maintenance mode without the root
    password.


    To access root shell, follow these steps:


    +   1. Reboot the system.

    2. Interrupt the boot-loader countdown by pressing any key, except Enter.

    3. Move the cursor to the rescue entry to boot (the one with the word rescue in
    its name).

    4. Press e to edit the selected entry.

    5. Move the cursor to the kernel command line (the line that starts with linux).'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# Chapter 8 | Control the Boot Process


    +   6. Append `rd.break`. With that option, the system breaks before the system
    handles control from the `initramfs` to the actual system.


    +   7. Press `Ctrl+x` to boot with the changes.


    +   8. Press `Enter` to perform maintenance when prompted.


    At this point, the system presents a root shell, with the root file system on
    the disk mounted read-only as `/root`. Because troubleshooting often requires
    modification to the root file system, you must remount the root file system as
    read/write. The following step shows how the `remount`, `rw` to the mount command
    updates the system with the new (rw) set.


    > Note

    Prebuilt images may multiple console=` the kernel to support a wide array of implementation
    scenarios. These console=` indicate the devices to use for console output. The
    caveat with `rd.break` is that even though whichever console is given. If you
    do not get your prompt, then you might want to reorder the console=` arguments
    when you edit the kernel command from the boot loader.


    > Important

    The system has not yet enabled SELinux, therefore any file you create does not
    have SELinux context. Some tools, such as the `passwd` command, first create a
    temporary file, then replace it with the file that is intended for edit, effectively
    creating a new file without SELlinux context. For this reason, when you use the
    `passwd` command with `rd.break`, the `/etc/shadow` file does not receive SELinux
    context.


    To remount the root password from this point, use the following procedure:


    +   1. Remount `/sysroot` as read/write.


    ```

    sh-5.1# mount -remount, rw /sysroot

    ```


    +   2. Switch into a chroot jail, where `/sysroot` is treated as the root of the
    file-system tree.


    ```

    sh-5.1# chroot /sysroot

    ```


    +   3. Set a new password.


    ```

    sh-5.1# passwd root

    ```


    +   4. Make sure that all unlabeled files, including `/etc/shadow` at this point,
    get relabeled during boot.


    ```

    sh-5.1# touch /.autorelabel

    ```'
