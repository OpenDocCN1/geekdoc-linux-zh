- pgno: 322
  md: '# Install and Configure Virtual Machines


    # Objectives


    Install a virtual machine on your Red Hat Enterprise Linux server with the web
    console.


    # Introducing KVM Virtualization


    Virtualization is a feature that allows a single physical machine to be divided
    into multiple *virtual machines (VMs)*, each of which can run an independent operating
    system.


    Red Hat Enterprise Linux supports KVM *(Kernel-based Virtual Machine)*, a full
    virtualization solution built into the standard kernel. KVM can run multiple Windows
    and Linux operating systems.


    ![](img/2eff90170b8c94cce3a908ab927e38c2_322_0.png)


    In Red Hat Enterprise Linux, you can manage KVM from the command line with the
    `virsh` command, or graphically with the web console''s Virtual Machines tool.


    KVM virtual machine technology is available across all Red Hat products, from
    standalone physical instances of Red Hat Enterprise Linux to the Red Hat OpenStack
    Platform:


    +   * Physical systems run Red Hat Enterprise Linux to provide KVM virtualization.
    Red Hat Enterprise Linux is typically a *thick* host, a system that supports VMs
    while providing other local and network services, and management functions.

    * Red Hat Virtualization (RHV) provides a centralized web interface that administrators
    can use to manage an entire virtual infrastructure. It includes advanced features
    such as KVM migration, redundancy, and high availability. A *Red Hat Virtualization
    Hypervisor* is a tuned version of Red Hat Enterprise Linux dedicated to the singular
    purpose of provisioning and supporting VMs.

    * Red Hat OpenStack Platform (RHOSP) provides the foundation to create, deploy,
    and scale a public or private cloud.

    * Red Hat OpenShift Virtualization includes RHV components to deploy containers
    on bare metal.


    On systems with SELinux enabled, sVirt isolates guests and the hypervisor. Each
    virtual machine is labeled and automatically allocates a unique label, with the
    associated virtual disk files given matching labels.'
  merge: -1
  img_proc: true
- pgno: 323
  md: "# Virtual Machine Types\n\nThere are two virtual machine types available to\
    \ install the operating system on. One of the two uses the i440FX chip set, and\
    \ provides ISA and PCI buses, an IDE controller, VGA and Ethernet adapters. The\
    \ Q35 machine is the newer of the two, and should be used in most cases. It supports\
    \ newer hardware interfaces as PCIe and SATA, includes an SM Bus controller.\n\
    \nIn Red Hat Linux 8 and later versions, UEFI and Secure Boot for virtual machines\
    \ is provided by Open Virtual Machine Firmware (OVMF), the `edk2-ovmf` package.\n\
    \n# Supported Guest Operating Systems\n\nThe list of Red Hat supported guest operating\
    \ systems varies depending on the product in use. RHEL, RHOP, and OpenShift Virtualization\
    \ products include all Server Validation Program (SVP) certified drivers, allowing\
    \ for a greater number of Windows guest operating systems. RHEL running KVM has\
    \ only SVP support for specific subscriptions.\n\nThere are no general rules to\
    \ determine which guest operating system is supported, review one of the following\
    \ documents:\n\n+   - RHEL with KVM: Certified guest operating systems for Red\
    \ Hat Linux with KVM [https://access.redhat.com/articles/97313]\n- RHOP, OpenShift\
    \ Virtualization: Certified Guest Operating Systems in Red Hat OpenStack Platform,\
    \ Red Hat Virtualization and OpenShift Virtualization [https://access.redhat.com/articles/97363]\n\
    \n# Configure a Red Hat Enterprise Linux Physical System as a Virtualization Host\n\
    \nAdministrators can configure a Red Hat Enterprise Linux system as a virtualization\
    \ host, appropriate for development, testing, training, or needing to work in\
    \ multiple operating systems at the same time.\n\n# Install the Virtualization\
    \ Tools\n\nInstall the Virtualization Host DNF package to prepare a system to\
    \ become a virtualization host.\n\n```\n[root ~#] dnf group list | grep -i virt\n\
    Virtualization Host\n[root ~#] dnf group info \"Virtualization Host\"\n... output\
    \ omitted...\nEnvironment Group: Virtualization Host\nDescription: Minimal Virtualization\
    \ host.\nMandatory Groups:\n Base\n Core\nStandard\nVirtualization Hypervisor\n\
    Virtualization Tools\nOptional Groups:\n Debugging\nNetwork File System Client\n\
    Remote Management for Linux\n```"
  merge: -1
  img_proc: true
