  md: '# Chapter 1 | Improve Command-line Productivity


    ```

    [user@host ~]$ grep ''^computer'' /usr/share/dict/words

    computer

    computerse

    computerise

    computerite

    computerizable

    computerization

    computerize

    computerized

    computerizes

    computerizing

    computerlike

    computer

    computers

    ```


    > > Note

    It is recommended practice to use single quotation marks to encapsulate the regular
    expression to protect any shell metacharacters (such as the $, *, and {}). Encapsulating
    the regular expression ensures that the characters are interpreted by the command
    and not by the shell.


    The grep command can process output from other commands using a pipe operator
    command (|). The following example shows the grep command parsing lines from the
    output of another command.


    ```

    [root@host ~] ps aux | grep chrony

    chrony 662 0.0 0.1 29440 2468 7 S 10:56 0:00 /usr/sbin/chronyd

    ```


    # The grep Command Options


    The grep command has many useful options for controlling how it parses lines.


    | Option | Function |

    | -i | Use the provided regular expression but do not enforce case sensitivity
    (run case-insensitive). |

    | -v | Display only lines that do not contain matches to the regular expression.
    |

    | -r | Search for data that matches the regular expression recursively in a group
    of files or directories. |

    | -A NUMBER | Display NUMBER of lines after the regular expression match. |

    | -B NUMBER | Display NUMBER of lines before the regular expression match. |

    | -e | If multiple -e options are used, then multiple regular expressions can
    be supplied and used with a logical OR. |


    Table of Common grep Options'
