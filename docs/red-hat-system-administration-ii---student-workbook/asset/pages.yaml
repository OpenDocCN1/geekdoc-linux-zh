  md: '# Chapter 8 | Control the Boot Process


    +   5. Type exit twice. The first command exits the chroot jail, and the second
    command exits the initramfs debug.


    At this point, the system continues booting, performs a full SELlinux relabel,
    and then reboots


    # Inspect Logs


    Looking at the few failed boots can be useful. If the system journals are persistent
    across reboots, you can use the journalctl tool to inspect those logs.


    Remember that by default, the system logs are in /run/log/journal directory, which
    means the journals are cleared when the system reboots. To store journals in the
    /var/log/journal directory, which persists across reboots, set the Storage parameter
    to persistent in /etc/systemd/journal.conf.


    ```

    [host~] -j vim /etc/systemd/journal.conf

    ...output omitted...

    [journal]

    Storage=persistent

    ...output omitted...

    [root~]# systemctl restart systemd-journal.service

    ```


    To inspect of a previous boot, use the journalctl command -b option. Without any
    arguments, the journalctl command -b only displays messages since the last boot.
    With a negative number as an argument, it displays the logs of previous boots.


    ```

    [root~#] journalctl -b -1 -p err

    ```


    This command shows all messages reported as an error or worse from the previous
    boot.


    # Repair Systemd Boot Issues


    To troubleshoot startup issues at boot time, Red Hat Linux 8 and later have the
    following tools available.


    # Enable the Debug Shell


    By enabling the debug-shell service with systemctl enable debug-shell.service,
    the system spawns a root shell on TTY (Ctrl+Alt9) early during the boot sequence.
    This shell is automatically logged in root, so that administrators can debug the
    system while the operating system is still booting.


    > Warning Do not to disable the debug-shell.service when you are done debugging,
    as it leaves an unauthenticated root shell open to anyone with local access.


    Alternatively, to activate the debug shell during the boot using the GRUB2 menu,
    follow these steps:


    +   1. Reboot the system.'
