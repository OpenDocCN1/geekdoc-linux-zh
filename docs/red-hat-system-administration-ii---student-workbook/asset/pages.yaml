- pgno: 349
  md: '# Create a Container Image from a Container File


    You are provided with the following container file to create the container image
    in the python36-app directory.


    ```

    [user@python36-app] $ cat containerfile

    FROM registry.access.redhat.com/ubi8/latest

    RUN dnf install -y python36

    CMD "/bin/bash", "-c", "sleep infinity"]

    ```


    The previous container file uses the registry.access.redhat.com/ubi8/latest image
    as the base. The container file installs the python36 package and runs the sleep
    infinity command to prevent the container from exiting.


    Normally, a container runs, and then exits after that process is complete. The
    sleep infinity command prevents the container from exiting, because the process
    never completes. You can then test, develop, and debug inside the container.


    After examining the file, use the podman build command to build the image.

    The podman build command builds an image using instructions from one or more container
    files. The podman file must be in the directory with the container file to build
    the image with the podman build command. You can use the podman build -t option
    to provide the name and python36:1.0 for the new image.


    ```

    [user@python36-app] $ podman build -t python36:1.0

    STEP 1/3 FROM registry.access.redhat.com/ubi8/latest

    STEP 2/3 RUN dnf install -y python36

    STEP 3/3 CMD "/bin/bash", "-c", "sleep infinity"

    COMMIT python36:1.0

    --> 35ab8208b0f

    Successfully tagged localhost/python36:1.0

    35ab8208b0f178fa310f835437ff92c4b4fe2506b882c62a2182b156fc

    ```


    The last line of the output shows the container ID. Most Podman commands use the
    first 12 characters of the container ID to refer to the container image. You can
    use this short ID or the name of a container or container image as arguments for
    most Podman commands.


    > Note If a version number is not specified in the tag, then the image is created
    with the : latest tag. If an image name is not specified, then the image and tag
    fields show <none>.


    You use the podman images to verify that the image is created with the desired
    name and tag.


    ```

    [user@host ~]$ podman images

    REPOSITORY TAG IMAGE ID CREATED SIZE

    localhost/python36 1.0 35ab8208b0f1 3 minutes ago 266 MB

    registry.access.redhat.com/ubi8/latest a33d92f09990 1 hour ago 91 MB

    ```'
