- pgno: 53
  md: '# Schedule a Deferred User Job


    # Objectives


    Set a command to run once at a future time.


    # Describe Deferred User Tasks


    Sometimes you might need to run one or more commands at a specific future time.
    An example is a user scheduling a long-running maintenance task to occur in the
    middle of the night. Another example is a system administrator who is working
    on a firewall configuration and queues a safety job to reset the firewall to a
    working state in ten minutes time, unless they deactivate the job before it runs,
    the new firewall configuration worked.


    These scheduled commands are called *tasks* or *jobs*, and the *deferred* term
    indicates that these tasks run in the future.


    One solution for Red Hat Enterprise Linux users to schedule deferred tasks is
    the **at** command, which is installed and enabled by default. The **at** package
    provides the at daemon, and the **at** and **atq** commands to interact with the
    daemon.


    Any user who can query the **at** daemon may use the **at** command. The **at**
    daemon provides 26 queues, identified from a to z, in alphabetically later queues
    getting lower system priority (using higher values, detailed in a later chapter)


    # Schedule Deferred User Tasks


    Use the **at TIMESPEC** command to start a new job to schedule. The **at** command
    reads from **STDIN** (your keyboard) to obtain the commands to run. When manually
    entering commands, complete the input by pressing **Ctrl+d** while on a line.
    You can use input redirection from a script for entering more complex commands.
    For example, use the **at +5min < script** command to schedule the commands in
    *script* to start in 5 minutes, without needing to type the command manually in
    a terminal.


    The **at** command accepts natural time specifications to describe when a job
    should run. For example, specify a time as **22:00pm,15:59,midnight, or tomorrow**,
    followed by an optional date or number of days in the future.


    The **TIMESPEC** argument expects date and time specifications in format: If you
    provide the date and not the time, the time defaults to the current time. If you
    provide the time and not the date, the date is today matched and the job runs
    when the time matches.


    The following example shows a job schedule without providing the date. The **at**
    command schedules the job for today or tomorrow depending on whether the time
    has passed or not.


    ```

    [user@host ~$] date

    Wed May 18 21:01:18 CDT 2022

    [user@host ~$] at 21:03 < script

    job 3 at Wed May 18 21:03:00 2022

    [user@host ~$] at 21:00 < script

    job 4 at Thu May 19 19:00:00 2022

    ```


    ![](img/2eff90170b8c94cce3a908ab927e38c2_53_0.png)'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Chapter 2 | Schedule Future Tasks


    The pages for the at command and other documentation sources lowercase to write
    the natural time specifications, but you can use lowercase, sentence case, or
    uppercase. Here are examples of time specifications you can use.


    +   - now +5min

    - teatime tomorrow (teat 16:00)

    - noon +4 days

