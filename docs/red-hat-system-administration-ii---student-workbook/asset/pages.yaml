- pgno: 70
  md: '# Manage Temporary Files


    # Objectives


    Enable and disable systemd timers, and configure a timer that manages temporary
    files.


    # Manage Temporary Files


    Most critical applications and services use temporary files and directories. Some
    applications and users use the /tmp directory to hold transient data, while other
    applications use task-specific locations such as daemon- and user-specific volatile
    directories /run, which exist only in memory. When the system reboots or loses
    power, memory-based file systems are self-cleaning.


    Commonly, daemons and scripts operate only when their expected temporary files
    and directories exist. Additionally, purging temporary files located on persistent
    storage is necessary to prevent disk space or stale data.


    Red Hat Enterprise Linux includes systemd-tmpfiles tools, which provides a structured
    and configurable method to manage temporary directories.


    At system boot, the first systemd service launched is the systemd-tmpfiles-setup
    service. This service runs the systemd-tmpfiles command --create --remove options,
    which reads instructions from /usr/lib/systemd/*.conf, /run/tmpfiles.d/*.conf,
    and etc/tmpfiles/*.conf. These configuration files list files and directories
    that the systemd-tmpfiles-setup service is instructed to create, delete, or secure
    with permissions.


    # Clean Temporary Files with a Systemd Timer


    To prevent long-running systems from filling their disks with stale data, a systemd
    timer can call systemd-tmpfiles-clean.timer at a regular intervals triggers systemd-tmpfiles-clean.service,
    which executes the systemd-tmpfiles --clean command.


    A systemd unit has a [Timer] section for indicating how to start the service with
    the same name as the timer.


    Use the following systemctl command to view the contents of the systemd-tmpfiles-clean.timer
    unit configuration.


    ```

    [user@]# systemctl cat systemd-tmpfiles-clean.timer

    # /usr/lib/systemd/system/systemd-tmpfiles-clean.timer

    # SPDX-License: LGPL-2.1-0-later

    #

    # This file is part of system.

    #

    # systemd is free software you can redistribute it or modify it by

    # under the terms of the GNU General Public License as published by

    # the Free Software Foundation; either version 2.1 of the License, or

    # (at your option) any later version.

    ```'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Chapter 2 | Schedule Future Tasks


    [Unit]

    Description=man-tmpfiles.d(5) man-systemd-tmpfiles(8)

    ConditionPathExists=!/etc/inititrd-release


    [Timer]

    OnBootSec=15min

    OnActiveSec=1d


    In the preceding configuration, the OnBootSec=15min parameter indicates that the
    systemd-tmpfiles-clean service unit triggered 15 minutes after the system boots
    up. The OnActiveSec=1d parameter indicates that any further triggers the systemd-tmpfiles-clean.
    service unit waits 24 hours after the service was activated.


    Change the parameters in the system-tmpfiles-clean. timer unit configuration to
    meet your requirements. For example, a 30min value in the UnitActiveSec parameter
    triggers the system-tmpfiles-clean. service runs 30 minutes after the service
    is activated. As a result, system-tmpfiles-clean. service gets triggered every
    30 minutes after the changes are reloaded.


    After changing the timer unit configuration, use the systemctl daemon-reload command
    to ensure that systemd loads the new configuration.


    ```

    [root #]# systemctl daemon-reload

    ```


    After reloading the manager configuration, use the following systemctl command
    to activate the system-tmpfiles-clean. timer unit.


    ```

    [root #]# systemctl enable --now systemd-tmpfiles-clean.timer

    ```


    # Clean Temporary Files Manually


    The system-tmpfiles --clean parses the same configuration files as the systemd-tmpfiles
    --create but instead of creating files and directories, it purges all files that
    were not changed, accessed or modified more recently than the maximum age defined
    in the configuration file.


    Find detailed information about the format of the configuration for the systemd-tmpfiles
    in the tmpfiles.d(5) page. The basic syntax consists of the following columns:
    Type, Path, Mode, UID, GID, Age, and Argument. Reference refers to what the system-tmpfiles
    service should take: for example, to create a directory if it does not exist,
    or to recursively SELinux contexts, permissions, and ownership.


    The following are examples of configuration purposes:


    ```

    /run/systemd/seats 0755 root -

    ```


    When you create files and directories, create the /run/systemd/seats directory
    if it does not exist, with the root user and the root group as others, and with
    permissions of rxr-xr-x. If this directory does exist, then take no action. The
    systemd-tmpfiles service does not purge this directory automatically.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Chapter 2 | Schedule Future Tasks


    | D /home/student 0700 student student 1d |


    Create the /home/student directory if it does not exist. If it does, empty it
    of all contents. When you use the system-tmpfiles --clean command, it removes
    all files in the directory that you did not access, or modify for more than one
    day.


    | L /run/fstablink root root /etc/fstab |


    Create the /run/fstablink symbolic link, point to the /etc/fstab folder. Never
    automatically purge this line.


    # Configuration File Precedence


    The system-tmpfiles-clean service file can exist in three places:


    +   - /etc/tmpfiles/*.conf

    - /run/tmpfiles/*.conf

    - /usr/lib/tmpfiles/*.conf


    Use the files in /etc/tmpfiles.d/ directory to configure custom temporary locations,
    and to override vendor-provided details. The files in /run/tmpfiles.d/ directory
    are volatile, which normally daemons use to manage their own runtime temporary
    files. RePM packages provide the files in /usr/lib/tmpfiles.d/; therefore you
    do not edit these files.


    If a file in the /etc/tmpfiles.d/ directory has the same name as a file in the
    /usr/lib/tmpfiles.d/ directory, the service uses the file in the /run/tmpfiles.d/.
    If a file in the /etc/tmpfiles.d/ directory has the same name as a file in the
    /run/tmpfiles.d/ or the /usr/lib/tmpfiles.d/ directories, then the service uses
    the file in the /etc/tmpfiles.d/ directory.


    Given these precedence rules, you can override vendor-provided settings by copying
    the relevant file to /etc/tmpfiles.d/ directory and then editing it. By using
    these configuration locations properly, you can manage administrator-configuration
    settings from a central configuration management system, and package updates will
    not overwrite your configured settings.


    > Note

    When testing new or modified configurations, it is useful to apply only the commands
    from a single configuration file at a time. Specify the name of the single configuration
    file on the systemd-tmpfiles command line.


    > References

    systemd-tmpfiles(8), tmpfiles.d(5), stat(1), stat(2), and systemd.timer(5) man
    pages'
