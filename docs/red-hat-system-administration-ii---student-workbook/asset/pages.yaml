  md: '# Manage Container Storage and Network Resources


    # Objectives


    Provide persistent storage for container data by sharing storage from the container
    host, and configure a container network.


    # Manage Container Resources


    You can choose to run a simple process and exit. You can also configure a container
    to run a service continuously, such as a database server. In this scenario, you
    might consider adding more resources to the container, such as persistent storage
    or DNS resolution for other containers.


    You can use different strategies to configure persistent storage for containers.
    In an enterprise container platform, such as Red Hat OpenShift, you can use sophisticated
    storage solutions to provide storage to your containers without knowing the underlying
    infrastructure.


    For small deployments where you use only a single container host, and without
    a need to scale, you can create persistent storage from the container host by
    creating a directory to mount on the running container.


    When a container, such as a web server or database server, serves content for
    clients outside the container host, you use the local machine to allow port 3306
    traffic with the appropriate firewall configuration. You can configure *port mapping*
    to enable communication to a container. With port mapping, the requests that are
    destined for the container host are forwarded to a port inside the container.


    To cover the topics in this chapter, imagine the following scenario.


    As a system administrator, you are tasked to create the db01 containerized database,
    based on MariaDB, to use the local machine to allow port 3306 traffic with the
    appropriate firewall configuration. The db01 container must use persistent storage
    with the appropriate SELinux context. Add the appropriate network configuration
    so that the c Lient01 container can communicate with the db01 container with DNS.


    # Environment Variables for Containers


    Some images allow passing environment variables to customize the container at
    creation time. You can use environment variables to parameter the container to
    tailor for your environment without the need to create your own custom image.
    Usually you would not modify the container image, because it would add layers
    to the image, which might be harder to maintain.


    You use the podman run -d registry.lab.example.com/rhel8/mariadb-105 command to
    run a containerized database, but you notice that the container fails to start.'
