- pgno: 301
  md: '# Summary


    +   - The **netfilter** framework allows kernel modules to inspect every packet
    traversing the system, including all incoming, outgoing or forwarded network packets.


    +   - The **firewall** service simplifies management by classifying all network
    traffic into zones. Each zone has its own list of ports and services. The **public**
    zone is set as the default zone.


    +   - The **firewall** service ships with a number of predefined services. You
    can list them by using the `firewall-cmd --get-services` command.


    +   - SELinux policy tightly controls network traffic by labeling the network
    ports. For example, port 22/TCP has the label `ssh_port_t` associated with it.
    When a process wants to listen on a port, SELinux checks to see whether the label
    associated with it is allowed to bind that port label.


    +   - Use the **semanage** command to add, delete, and modify labels.'
  merge: -1
  img_proc: true
