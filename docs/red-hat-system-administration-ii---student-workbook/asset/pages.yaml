    info parted (GNU Parted User Manual)

    parted(8), mkfs(8), mount(8), lsblk(8), and fstab(8) man pages


    For more information, refer to the Configuring and Managing File Systems guide
    at https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/9/html-single/managing_file_systems/index


