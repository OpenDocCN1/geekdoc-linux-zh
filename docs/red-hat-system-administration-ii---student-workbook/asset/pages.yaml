    \ ~$ [[ abc != def ]]; echo $?\n```\n\nThe following examples demonstrate the\
    \ use of Bash string (one argument) operators:\n\n```\n[user@host] ~$ STRING='';\
    \ [[ -z \"STRING\" ]]; echo $?\n0\n[user@host] ~$ STRING='abc'; [[ -n \"STRING\"\
    \ ]]; echo $?\n0\n```\n\n> Note The spaces inside the brackets are mandatory,\
    \ because they separate the words and elements within the test expression. The\
    \ shell's command parsing divides the elements into words and operators by recognizing\
    \ spaces and other metacharacters, according to built-in parsing rules. For full\
    \ treatment of this advanced concept, see the get opt(3) man page. The left square\
    \ bracket ( is itself built-in for the test command. Shell words, whether they\
    \ are commands, subcommands, options, arguments, or other token elements, are\
    \ always delimited by spaces.\n\n# Conditional Structures\n\nSimple scripts represent\
    \ a collection of commands that can be executed from beginning to end. Programmers\
    \ incorporate decision-making into shell scripts using conditional structures.\
    \ A script execute specific routines when stated conditions are met.\n\n# Use\
    \ the if/then Construct\n\nThe simplest of the conditional structures is the if/then\
    \ construct, with the following syntax:\n\n```\nif <CONDITION>: then\n  <STATEMENT>\n\
    \  ...\n  <STATEMENT>\nfi\n```\n\nWith this, if the script meets the condition,\
    \ it executes the code in the statement block. It does not take action if the\
    \ condition is not met. Common test conditions in the if/then statements include\
    \ the previously discussed numeric, string, and file tests. The fi statement at\
    \ the end closes the if/then construct. The following code section demonstrates\
