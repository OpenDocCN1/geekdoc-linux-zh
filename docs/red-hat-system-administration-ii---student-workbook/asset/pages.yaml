    host functions network-latency recommend.d

    [root@host]$ ls virtual-guest

    tuned.conf

    ```


    A typical tuned.conf configuration file looks as:


    ```

    [root@host]# cat virtual-guest/tuned.conf

    #

    # tuned configuration

    #

