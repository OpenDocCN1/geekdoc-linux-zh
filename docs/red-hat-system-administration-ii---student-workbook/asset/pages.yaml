    # Select a Target at Runtime


    On a running system, administrators can switch to a different target using the
    systemctl isolate command.


    ```

    [root@ ~]$ systemctl isolate multi-user.target

    ```


    Isolating targets stops all services not required by that target (and its dependencies),
    and starts any required services not started.

    Not all can be isolated. You can only isolate targets that have AllowIsolate=yes
    in their unit files. For example, you can isolate the graphical target, but not
    cryptsetup target.


    ```

    [user@ ~]$ systemctl cat graphical.target

    # /usr/lib/systemd/system/graphical.target

