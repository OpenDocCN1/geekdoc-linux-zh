  md: '# Chapter 10 | Red Hat Enterprise Linux


    # Virtualization Platform


    ```

    [root@host ~] dnf group install "Virtualization Host"

    ...output omitted.

    ```


    # Verify the System Requirements for Virtualization


    KVM requires either an Intel processor with the VT-x and Intel 64 extensions for
    x86based systems, or an AMD processor with the AMD-V and the AMD64 extensions.
    To verify your hardware and check the system requirements, use the virt-host validate
    command.


    ```

    [root@host ~] virt-host validate

    QEMU: Checking for hardware virtualization : PASS

    QEMU: Checking if /dev/kvm exists : PASS

    QEMU: Checking if /dev/kvm is accessible : PASS

    QEMU: Checking if /dev/vhost-net exis : PASS

    QEMU: Checking if /dev/net/tun exists : PASS

    QEMU: Checking for ''cppu'' controller support : PASS

    QEMU: Checking for ''cpuaact'' controller support : PASS

    QEMU: Checking for ''cpuset'' controller support : PASS

    QEMU: Checking for ''memory'' controller support : PASS

    QEMU: Checking for ''devices'' controller support : PASS

    QEMU: Checking for ''blkio'' controller support : PASS

    QEMU: Checking for device assignment iOMMU support : PASS

    QEMU: Checking for secure guest support : PASS

    ```


    The system must pass all validation items to operate as a KVM host.


    # Install a Virtual Machine from the Command Line


    Install the virt-install package, then the virt-install command to deploy a virtual
    machine from the command line. There are many installation sources supported as
    ISO, NFS, HTTP, and FTP. The following example uses the virt-install command --cdrom
    option to install the guest from an ISO image.


    ```

    [root@host ~] virt-install --name demo --memory 4096 --vcpu 2 --disk size=40 \

    --os-type linux --cdrom /root/rhel.iso

    ...output omitted.

    ```


    # Manage Virtual Machines with the Web Console


    The libvirt-client package provides the virsh command, that is used to manage
    virtual machines from the command line. You can create and manage virtual machines
    graphically using the web console Virtual Machines plugin.


    Install the cockpit-machines package to add the Virtual Machines menu to web console.


    ```

    [root@host ~] dnf install cockpit-machines

    ```


    If the console is not already running, start and enable it.


    ```

    [root@host ~] systemctl enable --now cockpit.socket

    ```


    RHI34-RHEL9.0-en-2-202220609'
  merge: -1
  img_proc: true
