  md: '# Chapter 11 | Run Containers


    On start, the system daemon executes the podman start command to start the existing
    container.


    On stop, the system daemon executes the podman stop command to stop the container.
    Notice that the system daemon does not delete the container on this action.


    You then use the previous command with the addition of the --new option to compare
    the system configuration.


    ```

    $appdev-adm#$ podman generate systemd --name webserver1 --new

    ... output omitted...

    ExecStart=/usr/bin/podman run --cidfile=$t/container.id --groups=no-common --rm

    systemd-replace -d --name webserver1 -p 8080:8080 -v /home/appdev-adm/app-var:/var/www/html:registry.redhat.com/ub88/httpd-24

    ExecStop=/usr/bin/podman stop --ignore --cidfile=$t/container.id

    ... output omitted..

    ```


    +   On start, the system daemon executes the podman run command to then start
    a new container. This action uses the podman run command --rm option, which removes
    the container on stop.


    +   On stop, systemd executes the podman stop command to stop the container.


    +   After systemd has stopped the container, systemd uses the podman rm -f command.


    You verify the output of the podman generate systemd command and run the previous
    command with the --file option to create the system user file in the current directory.
    Because the webserver1 container uses persistent storage, you choose to use the
    podman generate systemd command with the --new option. You then create the ~/.config/systemd/user
    directory and move the file to this location.


    ```

    $appdev-adm#$ podman generate systemd --name webserver1 --files

    /home/appdev-adm/container-webserver1.service

    $appdev-adm#$ mkdir -p ~/.config/systemd/user/

    $appdev-adm#$ mv container-webserver1.service ~/config/systemd/user/

    ```


    # Manage system User Files for Containers


    Now that you have created the system user file, you can use the systemctl command
    --user option to manage the webserver1 container.


    First, you reload the system daemon to make the systemctl command aware of the
    new user. You use the systemctl --user start command to start the webserver1 container.
    Use the name of the generated system user for for.


    ```

    $appdev-adm#$ systemctl --user start container-webserver1.service

    $appdev-adm#$ systemctl --user status container-webserver1.service

    * container-webserver1.service - Podman container-webserver1

    Loaded: (/home/appdev-adm/config/systemd/user/container-webserver1.service; disabled;
    vendor preset: disabled)

    Active: active (running) since Thu 2022-04-28 21:22:26 EDT; 18s ago

    ```'
