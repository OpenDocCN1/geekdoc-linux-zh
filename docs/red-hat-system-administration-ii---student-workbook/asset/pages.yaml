- pgno: 219
  md: '# Manage Network-Attached Storage with NFS


    # Objectives


    Identify NFS export information, create a directory to use as a mount point, mount
    an NFS export with the `mount` command or by configuring the `/etc/fstab` file,
    unmount an NFS export with the `unmount` command.


    # Accessing Export NFS Directories


    The Network File System (NFS) is an internet standard protocol that Linux, UNIX,
    and similar operating systems use as their native file system. NFS is an open
    standard that supports native Linux permissions and file-system attributes.


    By default, Red Hat Enterprise Linux 9 uses NFS version 4.2. RHEL fully supports
    NFSv3 and NFSv4. NFSv3 could use either a TCP or a UDP transport protocol, but
    NFSv4 allows only TCP connections.


    NFS servers mount exported directories to an existing local mount point directory.
    NFS clients can mount exported directories in multiple ways:


    +   -Manually** using the mount command.

    - **Persistently at boot** by configuring the entries in the `/etc/fstab` file.

    - **On demand** by configuring an automounter method.


    The automounter methods, which include the `autofs` service and the systemd.automount
    facility, are discussed in the Automount Network-Attached Storage section. You
    must install the `nfs-utils` package to obtain the tools for mounting, or for
    exporting, to obtain exported directories.


    ```

    [root@host]# dnf install nfs-utils

    ```


    RHEL supports mounting shared directories from Microsoft Windows systems by using
    the same methods as for NFS protocol, by using either the Server Message Block
    (SMB) or the Common Internet File System (CIFS). Mounting options are protocol-specific
    and depend on your Windows server or Samba configuration.


    # Query a Server''s Export NFS Directories


    The NFS protocol changed significantly between NFSv3 and NFSv4. The method to
    query a server to view the available exports differs for each protocol version.


    NFSv3 uses the RPC protocol, which requires a file server that supports NFSv3
    connections to run the `rpcbind` service. An NFSv3 client connects to the `rpcbind`
    service at port 111 to request NFS service. The server responds with the current
    port for the NFS service. Use the `show` command to query the available exports
    on an RPC-based NFSv3 server.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# Chapter 7 | Access Network-Attached Storage


    ```

    [root@host ~ showmount --exports server


    Export list for server

    /shares/test1

    /shares/test2

    ```


    The NFS4 protocol eliminated the use of the legacy RPC protocol for NFS transactions.
    Use the showmount command on a server that supports NFSv4 times without receiving
    a response, because the rbind service is not running on the server. However, querying
    NFSv4 is simpler than querying an NFSv3 server.


    NFS4 introduced an export tree that contains all the paths for the server''s exported
    directories. To use all exported directories, mount the root (/) of the server''s
    export tree. Mounting the export tree''s root provides browseable paths for all
    exported directories, as children of the tree''s root directory, but does not
    (bind) any of the exported directories.


    ```

    [root@host ~] mkdir /mountpoint

    [root@host ~] mount server:/mountpoint

    [root@host ~] ls /mountpoint

    ```


    To mount an NFS export while using the mounted export tree, change your directory
    into an exported directory. Alternatively, use the mount command with an exported
    directory that security does not allow mounting or accessing a directory while
    using an export tree, even if you can view the export path. Mounting Kerberos-protected
    shares requires additional server configuration and using Kerberos credentials,
    which are discussed in the Red Hat Security: Identity Management and Active Directory
    Integration (RH362) training course.


    # Manually Exported NFS Directories


    After identifying the NFS export to mount, create a local mount point if it does
    not exist. The /mnt directory is available for use as a temporary mount point,
    but recommended practice is not to use /mnt for long-term or persistent mounting.


    ```

    [root@host ~] mkdir /mountpoint

    ```


    With local file system units, the mount NFS export to access its contents. NFS
    shares can be mounted temporarily, or only by a privileged user.


    ```

    [root@host ~] mount -t nfs -o rw, server:/export/mountpoint

    ```


    The -t option specifies the file system type. However, the mount command detects
    and defaults to the NFS type. The -o sync option specifies that all transactions
    to the exported file system are performed synchronously, which is strongly recommended
    for all production network mounts where transactions must be completed or return
    as failed.


    Using a manual mount is not persistent. When the system reboots, the NFS export
    will not be mounted. Manual mounts are useful for providing temporary access to
    an exported directory, or for testing an NFS export before persistently mounting
    it.


    RHI34-RHEL.9.0-en-2-20220609'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# Persistently Mounted Exported NFS Directories


    To persistently mount an NFS export, edit the /etc/fstab file and add the mount
    entry with syntax manual to mounting.


    ```

    [root@host #] vim /etc/fstab

    ...\server:/export /mountpoint nfs rw,soft 0 0

    ```


    Then, you can mount the NFS export using only the mount point. The mount entry
    in the /etc/fstab file.


    ```

    [root@host #] mount /mountpoint

    ```


    # Unmounted Exported NFS Directories


    As a privileged user, unmount an NFS export does not remove its entry in the /etc/fstab
    file, if that exists. Entries in the /etc/fstab are persistent and are remounted
    during boot.


    ```

    [root@host #] unmount /mountpoint

    ```


    A mounted directory sometimes fails to unmount, and returns an error that the
    device is busy. This is either because an application is keeping a file open within
    the file system, or some user''s shell has a working directory in the mounted
    file system''s root directory or below it.


    To resolve the error, check your active shells, and use the cd command to leave
    the mounted file system. If subsequent attempts to unmount the file system still
    fail, then use the lsof (list open files) command to query the mount point. The
    lsof command returns a list of open names and processes which is keeping the file
    open.


    ```

    [root@host #] lsof /mountpoint

    COMMAND PID USER FD TYPE SIZE/OFF NODE NAME

    program 5534 user txt REG 252.4 910784 128 /home/user/program

    ```


    With this information, gracefully close any processes that are using files on
    this file system, and retry the unmount. In critical scenarios, when an application
    cannot be closed gracefully, kill the process to close the file. Alternatively,
    use the unmount -f option to force the unmount, which can cause loosen of drift
    for all open files.


    > References

    mount(8), ummount(8), showmount(8), fstab(5), .nfs(8), nfsconf(8), rpcbind(8)
    man pages'
