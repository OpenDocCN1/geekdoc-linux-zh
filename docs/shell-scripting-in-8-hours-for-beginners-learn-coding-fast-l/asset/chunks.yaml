  trans: "\n\n| `-e file` | 如果对象是一个空文件，则返回 true . |\n| `-s file` | 如果对象不是空文件，则返回 true\
    \ . |\n\n最后检查的结果是“文件不存在。” `echo` 命令被用于输出内容。在这里，我们来谈一下它的特殊用法。\n\n### 输出转义字符\n```bash\n\
    #! /bin/sh\necho \"\\\"C++ in 8 Hours\\\" \"\n```\n输出:`\"C++ in 8 Hours\"`\n\n\
    ### 输出变量值\n```bash\n#! /bin/sh\nbook =\"C# in 8 Hours\"\necho \"$book is a great\
    \ book\"\n```\n输出: `C# in 8 Hours is a great book`\n\n### 在同一行输出内容\n```bash\n\
    #! /bin/sh\necho -e \"Go \\c \"      # -e 开启转义开关\necho \"in 8 Hours\"      # \\\
    c 在同一行输出\n```\n输出: `Go in 8 Hours`\n\n### 输出到文件\n```bash\n#! /bin/sh\necho \"\
    PHP in 8 Hours\" > myFile     # \">\" 重定向到\n```\n\n### 输出原始格式\n```bash\n#! /bin/sh\n\
    echo ' He said: \"OK! \" '      # 使用单引号\n```\n输出: `He said: \"OK! \"`\n\n### 输出执行结果\n\
    ```bash\n#! /bin/sh\necho Today is `date`  # 使用反引号而不是单引号\n```\n输出:`Today is Thu\
    \ Aug 22 09: 01: 19 DST 2019`\n\n### 显示用户输入\n```bash\n#! /bin/sh\necho \"Please\
    \ type your name: \"\nread name      # \"read\" 接受用户输入\necho \"My name is $name\"\
    \n```\n输出:\nPlease type your name:Ray Yao\nMy name is Ray Yao\n\n## 第 6 小节\n\n\
    ### test 命令\ntest 命令用于检查条件是否为真。它可以用于测试三个方面：数值、字符和文件。`[ ]` 用于执行算术计算。\n\n| `test\
    \ numerics / characters / files` |\n\n#### 示例 6.1\n```bash\n#! /bin/bash\nnum1=10\n\
    num2=20\nif test $[num1] -eq $[num2]\nthen\necho 'Two numbers are equal. '\nelse\n\
    echo 'Two numbers are not equal. '\nfi\n```\n输出:`Two numbers are not equal.`\n\
    解释：`test $[num1] -eq $[num2]` 测试两个数字的相等性。`[ ]` 符号用于执行算术计算。在表达式中，` 的两边不能有空格。\n\n\
    #### 示例 6.2\n```bash\n#! /bin/bash\nx=100\ny=200\nz=$[x + y]\necho \"The result\
    \ is: $z\"\n```\n输出:`The result is: 300`\n解释：`[x + y]` 执行算术计算。注意：`=` 的两边不能有空格。\n\
    \n### 测试相等性\ntest 命令可以测试两个字符串是否相等。\n\n#### 示例 6.3\n```bash\n#! /bin/bash\nstr1=\"\
    Java\"\nstr2=\"JavaScript\"\nif test $str1 = $str2\nthen\necho 'Two strings are\
    \ equal! '\nelse\necho 'Two strings are not equal! '\nfi\n```\n输出:`Two strings\
    \ are not equal!`\n解释：`test $str1 = $str2` 测试两个字符串的相等性。\n\n### 测试存在性\ntest 命令可以测试文件是否存在。\n\
    \n#### 示例 6.4\n```bash\n#! /bin/bash\n# 假设 theFile . sh 不存在 .\nif test -e /root/theFile.sh\
    \       # -e 检查存在性\nthen\necho 'The file exists! '\nelse\necho ' The file doesn't\
    \ exist! '\nfi\n```\n输出:`The file doesn't exist!`\n解释：假设 `theFile. sh` 不存在。`“test\
    \ -e /root/theFile. sh\"` 测试文件是否存在。\n\n### 测试空字符串\ntest 命令可以测试字符串是否为空。\n\n####\
    \ 示例 6.5\n```bash\n#! /bin/bash\n# 假设 \"$myString” 尚未被赋值 .\nif test -n \"$myString\"\
    \      # -n 检查非空字符串\nthen\n    echo \"It's not an empty string. \"\nelse\necho\
    \ \"It's an empty string. \"\nfi\n```\n输出:`It’s an empty string.`\n解释：因为 `“myString”\
    \ 尚未被赋值任何值，它是一个空字符串。\n\n## Shell 函数\n函数是一个可以重复运行多次的代码块。定义函数的语法如下：\n\n| `function_name(){}`\
    \ |\n\n要调用函数，请使用 `function_name;`。\n\n| `function_name` |\n\n#### 示例 6.6\n```bash\n\
    #! /bin/bash\nmyFunction() {\n     # 定义一个函数\necho \"jQuery in 8 Hours\"\n}\necho\
    \ \"Before calling the function. \"\nmyFunction      # 调用函数\necho \"After calling\
    \ the function. \"\n```\n输出:\nBefore calling the function.\njQuery in 8 Hours\n\
    After calling the function.\n解释：`“myFunction(){ }” 定义了一个函数。`“myFunction” 调用了函数。\n\
    \n### 带参数的函数\n在调用函数时，你可以将参数传递给函数体。例如，将第一个参数传递给 `${1}`，将第二个参数传递给 `${2}` ...\n\n\
    #### 示例 6.7\n```bash\n#! /bin/bash\nmyFunction(){\necho \"The first parameter\
    \ is: ${1} \"\necho \"The second parameter is: ${2} \"\necho \"The third parameter\
    \ is: ${3} \"\necho \"The fourth parameter is: ${4} \"\necho \"All parameters\
    \ are: $* \"\n}\nmyFunction Kotlin in Hour\n```\n解释：`${1}` 接受第一个参数。`${2}` 接受第二个参数。`$*`\
    \ 显示所有参数。`“myFunction Kotlin in Hour` 调用了函数并传递了四个参数。\n\n### 返回值\n`return` 可以向\
    \ `$?` 返回一个值。`$?` 显示返回值。在某些机器上，`$?` 只显示 0 到 255 之间的值。\n\n| `function_name { return\
    \ value }` |\n| `$?` | 显示返回值 |\n\n#### 示例 6.8\n```bash\n#! /bin/bash\nadd(){\n\
    x=100\ny=55\nz=`x + y`\nreturn z     # 返回返回值\n}\nadd\necho \"The sum of numbers\
    \ is $?\"\n```\n输出:The sum of numbers is 155\n解释：`add` 调用函数并返回返回值。\n\n#### 示例\
    \ 6.9\n```bash\n#! /bin/bash\nmyFunction(){\necho \"The first parameter is: ${1}\
    \ \"\necho \"The second parameter is: ${2} \"\necho \"The third parameter is:\
    \ ${3} \"\necho \"The fourth parameter is: ${4} \"\necho \"All parameters are:\
    \ $* \"\n}\nmyFunction Kotlin in Hour\n```\n输出:\nThe first parameter is: Kotlin\n\
    The second parameter is: in\nThe third parameter is: Hour\nThe fourth parameter\
    \ is: \nAll parameters are: Kotlin in Hour\n解释：`${1}` 接受第一个参数。`${2}` 接受第二个参数。`$*`\
    \ 显示所有参数。`“myFunction Kotlin in Hour` 调用了函数并传递了三个参数。\n\n## 第 7 小节\n\n### if ..\
    \ then .. else\n`if` 语句用于检查条件是否为真。如果条件为真，则执行 `then` 后面的代码。\n\n`if condition; then\
    \ code else code fi`\n\n#### 示例 7.1\n```bash\n#! /bin/bash\nx=100\ny=80\nif [\
    \ $x -eq $y ]\nthen\necho \"x is equal to y\"\nelse\necho \"x is not equal to\
    \ y\"\nfi\n```\n输出:x is not equal to y\n解释：`[ $x -eq $y ]` 测试两个数字是否相等。\n\n####\
    \ 示例 7.2\n```bash\n#! /bin/bash\nx=100\ny=80\nif [ $x -gt $y ]\nthen\necho \"\
    x is greater than y\"\nelse\necho \"x is not greater than y\"\nfi\n```\n输出:x is\
    \ greater than y\n解释：`[ $x -gt $y ]` 测试 $x$ 是否大于 $y$。\n\n#### 示例 7.3\n```bash\n\
    #! /bin/bash\nx=100\ny=80\nif [ $x -lt $y ]\nthen\necho \"x is less than y\"\n\
    else\necho \"x is not less than y\"\nfi\n```\n输出:x is not less than y\n解释：`[ $x\
    \ -lt $y ]` 测试 $x$ 是否小于 $y$。\n\n 示例 7.4\n```bash\n#! /bin/bash\nx=100\ny=80\n\
    if [ $x -ne $y ]\nthen\necho \"x is not equal to y\"\nelse\necho \"x is equal\
    \ to y\"\nfi\n```\n输出:x is not equal to y\n解释：`[ $x -ne $y ]` 测试两个数字是否不相等。\n\n\
    #### 示例 7.5\n```bash\n#! /bin/bash\nx=100\ny=80\nif [ $x -ge $y ]\nthen\necho\
    \ \"x is greater than or equal to y\"\nelse\necho \"x is not greater than or equal\
    \ to y\"\nfi\n```\n输出:x is greater than or equal to y\n解释：`[ $x -ge $y ]` 测试 $x$\
    \ 是否大于或等于 $y$。\n\n#### 示例 7.6\n```bash\n#! /bin/bash\nx=100\ny=80\nif [ $x -le\
    \ $y ]\nthen\necho \"x is less than or equal to y\"\nelse\necho \"x is not less\
    \ than or equal to y\"\nfi\n```\n输出:x is not less than or equal to y\n解释：`[ $x\
    \ -le $y ]` 测试 $x$ 是否小于或等于 $y$。\n\n### 运算符\n`if` 语句可以使用各种运算符来测试条件。\n\n| 运算符 |\
    \ 描述 |\n| --- | --- |\n| `-eq` | 数字相等 |\n| `-ne` | 数字不相等 |\n| `-gt` | 大于 |\n|\
    \ `-lt` | 小于 |\n| `-ge` | 大于等于 |\n| `-le` | 小于等于 |\n| `=` | 字符串相等 |\n| `!=` |\
    \ 字符串不相等 |\n| `-e` | 存在性 |\n| `-f` | 是普通文件 |\n| `-d` | 是目录 |\n| `-n` | 字符串非空 |\n\
    | `-s` | 文件不为空 |\n\n### 逻辑运算符\n`if` 语句可以使用逻辑运算符来组合多个条件。\n\n| 逻辑运算符 | 描述 |\n| ---\
    \ | --- |\n| `-a` | 逻辑 (AND) |\n| `-o` | 逻辑 (OR) |\n\n#### 示例 7.7\n```bash\n#!\
    \ /bin/bash\nx=100\ny=80\nif [ $x -gt $y ] -a [ $y -ne 70 ]\nthen\necho \"x is\
    \ greater than y and y is not equal to 70\"\nelse\necho \"condition not met\"\n\
    fi\n```\n输出:x is greater than y and y is not equal to 70\n解释：`-a` 用于逻辑与 (AND)。\n\
    \n#### 示例 7.8\n```bash\n#! /bin/bash\nx=100\ny=80\nif [ $x -lt $y ] -o [ $y -eq\
    \ 80 ]\nthen\necho \"x is less than y or y is equal to 80\"\nelse\necho \"condition\
    \ not met\"\nfi\n```\n输出:x is less than y or y is equal to 80\n解释：`-o` 用于逻辑或 (OR)。\n\
    \n### 嵌套 if\n`if` 语句可以嵌套另一个 `if` 语句。\n\n#### 示例 7.9\n```bash\n#! /bin/bash\nx=100\n\
    y=80\nif [ $x -gt $y ]\nthen\n    if [ $y -eq 80 ]\n    then\n        echo \"\
    x is greater than y and y is equal to 80\"\n    else\n        echo \"x is greater\
    \ than y but y is not equal to 80\"\n    fi\nelse\necho \"x is not greater than\
    \ y\"\nfi\n```\n输出:x is greater than y and y is equal to 80\n解释：嵌套的 `if` 语句。\n\
    \n### case \n`case` 语句用于根据变量与多个模式的匹配来执行相应的代码。\n\n#### 示例 7.10\n```bash\n#! /bin/bash\n\
    line=\"apple\"\ncase $line in\n    \"apple\")\n        echo \"The line is apple\"\
    \n        ;;\n    \"banana\")\n        echo \"The line is banana\"\n        ;;\n\
    \    *)\n        echo \"The line is something else\"\n        ;;\nesac\n```\n\
    输出:The line is apple\n解释：`case` 语句根据模式匹配执行代码。`;;` 表示每个模式的结束。`esac` 是 `case` 的反写。\n\
    \n### for 循环\n`for` 循环用于遍历列表并执行代码。\n\n#### 示例 7.11\n```bash\n#! /bin/bash\nfor\
    \ i in 1 2 3 4\ndo\n    echo \"Number: $i\"\ndone\n```\n输出:\nNumber: 1\nNumber:\
    \ 2\nNumber: 3\nNumber: 4\n解释：`for` 循环遍历列表中的每个元素。\n\n#### 示例 7.12\n```bash\n#!\
    \ /bin/bash\nfor fruit in apple banana cherry\ndo\n    echo \"Fruit: $fruit\"\n\
    done\n```\n输出:\nFruit: apple\nFruit: banana\nFruit: cherry\n解释：`for` 循环可以处理字符串列表。\n\
    \n#### 示例 7.13\n```bash\n#! /bin/bash\nfor i in {1..5}\ndo\n    echo \"Count:\
    \ $i\"\ndone\n```\n输出:\nCount: 1\nCount: 2\nCount: 3\nCount: 4\nCount: 5\n解释：使用\
    \ `{1..5}` 扩展生成序列。\n\n### while 循环\n`while` 循环在条件为真时重复执行代码。\n\n#### 示例 7.14\n\
    ```bash\n#! /bin/bash\ni=1\nwhile [ $i -le 5 ]\ndo\n    echo \"Count: $i\"\n \
    \   i=`expr $i + 1`\ndone\n```\n输出:\nCount: 1\nCount: 2\nCount: 3\nCount: 4\n\
    Count: 5\n解释：`while` 循环在条件 `$i <= 5` 为真时运行。\n\n#### 示例 7.15\n```bash\n#! /bin/bash\n\
    i=1\nuntil [ $i -gt 5 ]\ndo\n    echo \"Count: $i\"\n    i=`expr $i + 1`\ndone\n\
    ```\n输出:\nCount: 1\nCount: 2\nCount: 3\nCount: 4\nCount: 5\n解释：`until` 循环在条件 `$i\
    \ > 5` 为假时运行。\n\n### 函数\n`函数` 可以在脚本中重用代码块。\n\n#### 示例 7.16\n```bash\n#! /bin/bash\n\
    my_function() {\n    echo \"Hello from function!\"\n}\nmy_function\n```\n输出:Hello\
    \ from function!\n解释：定义并调用函数。\n\n### 带参数的函数\n函数可以接收位置参数。\n\n#### 示例 7.17\n```bash\n\
    #! /bin/bash\nmy_function() {\n    echo \"First argument: $1\"\n    echo \"Second\
    \ argument: $2\"\n}\nmy_function \"Hello\" \"World\"\n```\n输出:\nFirst argument:\
    \ Hello\nSecond argument: World\n解释：使用 `$1`, `$2` 等访问位置参数。\n\n### 函数返回值\n使用 `return`\
    \ 从函数返回状态码。\n\n#### 示例 7.18\n```bash\n#! /bin/bash\nmy_function() {\n    return\
    \ 10\n}\nmy_function\necho \"Return value: $?\"\n```\n输出:Return value: 10\n解释：`return`\
    \ 返回的值通过 `$?` 获取。\n\n"
- fmt: "\nOutput: 0123\nExplanation: `until [ $n -ge 4 ]` will quit the loop if `$n`\
    \ is equal to 4.\n\n## Case Statement\nThe `case statement` is a multi-select\
    \ command. The `case statement` matches a value to a pattern. If the match succeeds,\
    \ it executes the matching command.\n\n```bash\ncase value in\n  pattern1) code1;;\
    \      # note using ) and ;;\n  pattern2) code2;;\n  pattern3) code3;;\n  pattern*)\
    \ code4;;      # when match nothing, run this .\nesac\n```\n\n### Example 7.7\n\
    ```bash\n#! /bin/bash\necho 'Please input a number between 1 to 4: '\nread num\n\
    case $num in\n  1)  echo 'You have input 1';;\n  2) echo 'You have input 2';;\n\
    \  3)  echo 'You have input 3';;\n  4)  echo 'You have input 4';;\n  *) echo 'Your\
    \ number is not between 1 to 4';;\nesac\n```\n\n# Assume we input a number 2\n\
    Output:\nPlease input a number between 1 to 4:\n2\nYou have input 2\nExplanation:\
    \ Assume we input a number 2, which matches the second case, therefore the second\
    \ code is executed.\n\n## Break Command\nThe `break` keyword is used to stop the\
    \ running of a loop according to the condition.\n\n```bash\nbreak\n```\n\n###\
    \ Example 7.8\n```bash\n#! /bin/bash\nnum=0\nwhile(( $num<=8))\ndo\n  if [ $num\
    \ == 3 ]\n  then\n    break      # quit the while loop\n  fi\n  num=`expr $num\
    \ + 1`\n  echo $num\ndone\n```\n\nOutput: 123\nExplanation: If `$num` is 3, the\
    \ program will run the `break` command, and quit the loop.\n\n## Continue Command\n\
    The `continue` command is used to stop the current iteration, ignoring the following\
    \ code, and then continue the next loop.\n\n```bash\ncontinue\n```\n\n### Example\
    \ 7.9\n```bash\n#! /bin/sh\nnums=\"1 2 3 4 5 \"\nfor n in $nums\ndo\n  if [ $n\
    \ -eq 3 ]\n  then\n    continue      # run the next for loop\n  fi\n  echo $n\n\
    done\n```\n\nOutput: 1245\nExplanation: Note: The output has no the 3 number.\
    \ If `$n = 3`, the program will run `continue` command, ignore the next command\
    \ `echo $n`, and then run the next `for loop`.\n\n## Hour 8 Select Statement\n\
    The `Select` statement allows the user to select one item to meet the condition,\
    \ and run the related code. The `Select` statement usually works with the `Case`\
    \ statement.\n\n```bash\nselect var in item1 item2 item3...\ndo\n  case statement\n\
    \    ...\n  esac\ndone\n```\n\n### Example 8.1\n```bash\n#! /bin/bash\necho \"\
    Please input a number between 1 to 4. \"\necho \"If you input 4, the program will\
    \ exit. \"\nselect choice in 1 2 3 4 ;      # select one number\ndo\n  case $choice\
    \ in\n  1)  echo \"You choose 1\";;\n      2)  echo \"You choose 2\";;\n     \
    \ 3)  echo \"You choose 3\";;\n      4)  echo \"You choose 4 to exit\"; break;;\n\
    \      *)  echo \"Enter error! \"; break;;\n  esac\ndone\n```\n\nOutput:\nPlease\
    \ input a number between 1 to 4.\nIf you input 4, the program will exit.\n1) 1\n\
    2) 2\n3) 3\n4) 4\n#? 2\nYou choose 2\n#? 4\nYou choose 4 to exit\nExplanation:\
    \ Assume that we input 2 at the first time, input 4 at the second time. `select\
    \ choice in 1 2 3 4 ;` choose one of the 4 numbers. The `Select` statement usually\
    \ works with `Case` statement. `#?` is an input prompt, you can input one number.\n\
    \n## I/O Redirection\nLinux Shell system commands take input from your terminal\
    \ and send the resulting output back to your terminal. A command usually reads\
    \ data from standard input, and writes data to standard output. The commands of\
    \ the redirection are as follows:\n\n| Commands | Descriptions |\n| :--- | :---\
    \ |\n| `command > file` | redirect output to the file. |\n| `command < file` |\
    \ redirect input to the file. |\n| `command >> file` | append output to the file.\
    \ |\n| `n > file` | redirect `File n` to the file |\n| `n >> file` | append `File\
    \ n` to the file |\n| `n >& m` | combine the output file `m` and `File n` |\n\
    | `n <& m` | combine the input file `m` and `File n` |\n| `<< tag` | take the\
    \ content between tags as input. |\n\n`File n`, `File m` means the file with file\
    \ descriptor 0, 1 or 2. `0` means Standard Input (STDIN). `1` means Standard Output\
    \ (STDOUT). `2` means Standard Error (STDERR).\n\n### Output Redirection\nOutput\
    \ redirection: Execute the command and store the output into the file by using\
    \ `>`.\n\n```bash\ncommand > file\n```\n\n### Example 8.2\n```bash\necho \"R in\
    \ 8 Hours\" > file\n```\nExplanation: `>` redirects the output to the file.\n\n\
    ### Append Redirection\nIf you don't want the file to be overwritten, append the\
    \ contents to the file using `>>`.\n\n```bash\ncommand >> file\n```\n\n### Example\
    \ 8.3\n```bash\necho \"It is good!\" >> file\n```\nExplanation: `>>` appends the\
    \ contents to the file.\n\n## Input Redirection\nInput redirection: Get input\
    \ from a file using `<`.\n\n```bash\ncommand < file\n```\n\n### Example 8.4\n\
    ```bash\nwc < file\n```\nOutput: 2 7 25\nExplanation: `<` gets the input from\
    \ the file. `wc` counts how many lines, words, characters. 2: lines, 7: words,\
    \ 25: characters.\n\n## File Descriptor\nFile n means the file with file descriptor\
    \ 0, 1 or 2.\n- `0` means Standard Input (STDIN).\n- `1` means Standard Output\
    \ (STDOUT).\n- `2` means Standard Error (STDERR).\n\n## Here Document\nThe `<<`\
    \ operator is used to take the content between tags as input.\n\n```bash\ncommand\
    \ << tag\n```\n\n### Example 8.5\n```bash\n#! /bin/bash\ncat << DOC\n...\nDOC\n\
    ```\nExplanation: `<< DOC` defines a Here Document. `cat` shows the contents of\
    \ the file. \n\n### Example 8.6\n```bash\n#! /bin/bash\nwc << EOF\n...\nEOF\n\
    ```\nOutput: 3 13 68\nExplanation: `<< EOF` defines a Here Document. `wc` counts\
    \ the number of lines, words, characters. 3: lines, 13: words, 68: characters.\n\
    \n## Redirection Logic\nThe `<<` operator must be on the most left, no characters\
    \ in front.\n```bash\ncommand << EOF\n```\n`<<` redirects the document to the\
    \ command. `EOF` is a delimiter. You can specify other characters as a delimiter.\n\
    \n## File Included\nThe Shell can include an external script into the current\
    \ file.\n\n```bash\nsource ./external_file\n```\n`./` locates the external file.\n\
    \n### Example 8.7\n```bash\n#! /bin/bash\nurl = \"www.amazon.com/author/ray-yao\"\
    \n```\n\n### Example 8.8\n```bash\n#! /bin/bash\nsource ./file1.sh\necho \"The\
    \ website of Ray Yao is:$url\"\n```\nExplanation: `source ./file1.sh` includes\
    \ an external file `file1.sh`. In file1, defines a variable `url`. In file2, references\
    \ the variable `$url`.\n\n## Appendix 1 Shell Scripting Chart\n### Built-in Parameters\
    \ Chart\nThere are built-in parameters in Shell as follows:\n\n| Parameters |\
    \ Descriptions |\n| :--- | :--- |\n| `$0` | Return the file name |\n| `$#` | Return\
    \ the total number of the parameters |\n| `$*` | Return all parameters input by\
    \ the user |\n| `$@` | Return all parameters input by the user |\n| `$$` | Return\
    \ the current process ID number of the script |\n| `$!` | Return the last process\
    \ ID number of the script |\n| `$?` | Returning 0 indicates running successfully\
    \ |\n\n### Printf Command Chart\n`printf` is a command to format the output in\
    \ the Shell.\n"
