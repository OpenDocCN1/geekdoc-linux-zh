    ## 第 1 小时

    ### 什么是 Linux Shell?

    Shell 是用户与 Linux 之间的接口；你在提示符输入的每个命令都会由 Shell 解析并传递给 Linux 内核。Shell 是一个带有内置命令集的命令语言解释器。此外，Shell
    可以被任何其他 Linux 工具和应用程序调用。每当你输入命令时，Shell 会进行解析。例如：打印当前工作目录的命令 (`PWD`) 位于 bash 中。复制命令
    (`cp`) 和移动命令 (`rm`) 是文件系统中两个独立的程序。Shell 首先检查该命令是否为内部命令，然后检查它是否为应用程序。


    ### Shell 脚本

    Shell 脚本是为 Shell 编写的脚本程序。


    ### Shell 工作环境

    Shell 脚本类似于 Java、C++ 编程，只需要文本编辑器来编写代码以及脚本解释器来解释执行。


    ### 各种 Linux Shell

    * /bin/sh

    * /bin/bash

    * /usr/bin/csh

    * /usr/bin/ksh

    * /sbin/sh


