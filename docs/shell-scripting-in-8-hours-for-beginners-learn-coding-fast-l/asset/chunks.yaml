    ## Hour 1

    ### What is Linux Shell?

    The shell is the interface between the user and Linux; every command you type
    at the prompt is interpreted by the shell and passed to the Linux kernel. The
    shell is a command-language interpreter with its own built-in command collection.
    In addition, the shell can be called by any other Linux utilities and application
    programs. Whenever you type a command, it is interpreted by the shell. For example:
    The command of printing current working directory (`PWD`) is contained within
    Linux `bash`. The copy commands (`cp`) and the move commands (`rm`) are two single
    programs that exist in a directory on the file system. The shell first checks
    to see if the command is an internal command, and then checks to see if it is
    an application, either of Linux''s own utilities, such as `ls` and `rm`, or of
    a purchased commercial program, such as `xv` and `ghostview`.


    ### Shell Scripting

    A Shell script is a scripting program written for the Shell.


    ### Shell Working Environment

    Shell scripting, like Java, C++ programming, requires only a text editor to write
    code and a script interpreter to interpret execution.


    ### Various Linux Shell

    Linux has different types of shells, such as:

    * `/bin/sh`

    * `/bin/bash`

    * `/usr/bin/csh`

    * `/usr/bin/ksh`

    * `/sbin/sh`

