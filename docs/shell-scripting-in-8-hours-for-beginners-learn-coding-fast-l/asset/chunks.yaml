  trans: "\n\n# printf \"type\" 变量\n\n`\"type\"` 是用于格式化输出的参数。\n\n| 类型 | 描述 |\n| :---\
    \ | :--- |\n| `%b` | 以二进制值打印 |\n| `%d` | 以整数值打印 |\n| `%f` | 以浮点数值打印 |\n| `%o`\
    \ | 以八进制值打印 |\n| `%s` | 以字符串值打印 |\n| `%x` | 以十六进制值打印 |\n\n## 转义序列表\n`\\` 反斜线字符可用于转义字符。\n\
    \n`\\a` 输出警报；`\\n` 将内容输出到下一行；`\\r` 换回；`\\t` 制表符；`\\f` 将内容输出到下一页；`\\'` 输出单引号；`\\\
    \"` 输出双引号。\n\n## 比较运算符表\nLinux Shell 拥有如下比较运算符：\n\n| 运算符 | 检查项 |\n| :--- | :---\
    \ |\n| `-eq` | 等于 |\n| `-ne` | 不等于 |\n| `-gt` | 大于 |\n| `-ge` | 大于等于 |\n| `-lt`\
    \ | 小于 |\n| `-le` | 小于等于 |\n\n比较表达式返回真或假。\n\n## 布尔运算符表\n\n| 运算符 |\n| :--- | :---\
    \ |\n| `-a` |\n| `-o` |\n| `!` |\n\n使用逻辑运算符后，结果将为真或假。\n\n- `true -a true;` 返回真；\n\
    - `true -a false;` 返回假；\n- `false -a false;` 返回假；\n- `true -o true;` 返回真；\n- `true\
    \ -o false;` 返回真；\n- `false -o false;` 返回假；\n- `! false;` 返回真；\n- `! true;` 返回假；\n\
    \n## 字符串运算符表\n\n| 运算符 | 检查项 |\n| :--- | :--- |\n| `=` | 如果两个字符串相等，则返回真。 |\n| `!=`\
    \ | 如果两个字符串不等，则返回真。 |\n| `-z` | 如果字符串长度为零，则返回真。 |\n| `-n` | 如果字符串长度不为零，则返回真 |\n\
    | `$` | 如果字符串不空，则返回真。 |\n\n## 文件运算符表\n文件运算符用于检测 Linux 文件的各种属性。\n\n| 运算符 | 检查项\
    \ |\n| :--- | :--- |\n| `-d file` | 如果对象是目录，则返回真 |\n| `-f file` | 如果对象是文件，则返回真\
    \ |\n| `-p file` | 如果对象是管道，则返回真 |\n| `-r file` | 如果对象是可读文件，则返回真。 |\n| `-w file`\
    \ | 如果对象是可写文件，则返回真 |\n| `-x file` | 如果对象是可执行文件，则返回真 |\n| `-e file` | 如果对象是空文件，则返回真\
    \ |\n| `-s file` | 如果对象不是空文件，则返回真 |\n| `-b file` | 如果对象是块设备文件，则返回真 |\n| `-c file`\
    \ | 如果对象是字符设备文件，则返回真 |\n\n## I/O 重定向表\nLinux Shell 系统命令从终端输入并将输出传回终端。命令通常从标准输入读取数据，并写入标准输出。重定向命令如下：\n\
    \n| 命令 | 描述 |\n| :--- | :--- |\n| `command > file` | 将输出重定向到文件。 |\n| `command\
    \ < file` | 将输入重定向文件。 |\n| `command >> file` | 将输出追加到文件。 |\n| `n > file` | 将文件\
    \ `n` 重定向到文件 |\n| `n >> file` | 将文件 `n` 追加到文件 |\n| `n >& m` | 合并输出文件 `m` 和文件 `n`\
    \ |\n| `n <& m` | 合并输入文件 `m` 和文件 `n` |\n| `<< tag` | 将标签之间的内容作为输入。 |\n\n## 附录\
    \ 2 练习\n\n### 题目\n请选择正确答案。\n\n(01) 填入 `# 使用多行注释字符`\n```\ncomment 1\ncomment 2\n\
    comment 3...\nEOF\n```\nA. EOF\nB. #EOF\nC. <<EOF\nD. : <<EOF\n\n(02)\n```bash\n\
    #! /bin/sh\nstr1=\"Kotlin\"\nstr2=\"in 8 Hours\"\nmyString=\"$str1 fill in $str2\"\
    \ # 连接两个字符串\necho $myString\n```\nA. +\nB. −\nC. 空格\nD. concat\n\n(03) 访问数组元素的语法是填入\
    \ `?`\n1. `$(array_name[index])`\n2. `${array_name[index]}`\n3. `array_name(index)`\n\
    4. `array_name{index}`\n\n(04)\n```bash\n#! /bin/bash\nsum= fill in expr 100 +\
    \ 200 fill in\necho \"The sum is: $sum\"\n```\nA. 双引号\nB. 单引号\nC. 反引号\nD. 空格\n\
    \n(05) 参数 `-s file` 检查填入 `?`\nA. 如果对象不是空文件，则返回真。\nB. 如果对象为空文件，则返回真。\nC. 如果对象是块设备文件，则返回真。\n\
    D. 如果对象是字符设备文件，则返回真。\n\n(06)\n```bash\n#! /bin/bash\n test fill in myFile # 检查\
    \ myFile 是否存在\nthen\n  echo 'The file'\nelse\n  echo ' '\nfi\n```\nA. -o\nB. -e\n\
    C. -n\nD. -s\n\n(07) `if fill in condition then code1 else code2 fi`\nA. ( )\n\
    B. { }\nC. [ ]\nD. 空格\n\n(08) `# 将输出重定向到 myFile`\n```bash\necho \"R in\" fill\
    \ in\n```\nA. ->\nB. >\nC. in\nD. to\n\n(09)\n```bash\n#! /bin/sh\necho \"Please\
    \ input your.\nfill in myInput # 将值存储在 myInput\necho \"Hi! Your name is: $myInput\"\
    \n```\nA. input\nB. var\nC. =\nD. read\n\n(10)\n```bash\n#! /bin/sh\nstr=\"jQuery\
    \ in\"\necho fill in # 获取字符串的长度\n```\nA. str.length()\nB. length(str)\nC. ${#str}\n\
    D. $[#str]\n\n(11) fill in 可以获取数组的所有元素。\n1. `array_name[@]`\n2. `array_name[#]`\n\
    3. `array_name[%]`\n4. `array_name[&]`\n\n(12)\n| 运算符 | 运行 |\n| :--- | :--- |\n\
    | + | 加 |\n| - | 减 |\n| fill in | 乘 |\n| / | 除 |\nA. *\nB. \\*\nC. X\nD. \\x\n\
    \n(13)\n```bash\n#! /bin/sh\necho fill in \"Go \" # 转义\n```\nA. -a\nB. -o\nC.\
    \ -s\nD. -e\n\n(14)\n```bash\n#! /bin/bash\nif test fill in \"$myString\" # 检查是否为空\n\
    then\n  echo \"It's not empty.\"\nelse\n  echo \"It's an empty string.\"\nfi\n\
    ```\nA. -o\nB. -e\nC. -n\nD. -s\n\n(15) `until` 在条件 fill in 时循环代码，如果条件 fill in\
    \ 则退出循环。\n1. true\n2. true\n3. false\n4. false\n\n(16) 如果你不想文件被覆盖，请使用 fill in\
    \ 符号追加到文件末尾。\nA. >>\nB. ->\nC. =>\nD. >=\n\n(17) | 参数 | 描述 |\n| :--- | :--- |\n\
    | fill in | 返回文件名 |\n| $# | 返回参数总数 |\n| $* | 返回用户输入 |\n| $@ | 返回用户输入 |\nA. n\n\
    B. $0\nC. f\nD. %\n\n(18)\n```bash\n#! /bin/bash\narr=(fill in) # 获取数组的长度\n```\n\
    A. arr.length()\nB. length(arr)\nC. ${#arr}\nD. $[#arr]\n\n(19)\n- `true -a true;`\
    \ 返回真；\n- `true -a false;` 返回假；\n- `false -a false;` 返回假；\n- `true -o true;` 返回真；\n\
    - `true -o false;` 返回真；\n- `false -o false;` 返回假；\n\n(20) | 运算符 | 检查 |\n| :---\
    \ | :--- |\n| `-z` | 如果字符串长度为零，则返回真。 |\n| `-n` | 如果字符串长度不为零，则返回真 |\n| `fill in`\
    \ | 如果字符串不空，则返回真。 |\nA. $\nB. &\nC. @\nD. %\n\n(21)\n```bash\n#! /bin/bash\nadd(){\n\
    \  x=100\n  y=155\n  z=`expr $x + $y`\n  return $z\n}\nadd\necho \"The sum is\
    \ fill in\" # 显示值\n```\nA. $!\nB. $@\nC. $*\nD. $\n\n(22)\n```bash\n#! /bin/bash\n\
    echo 'Please input a number between 1 to 4:'\nread num\ncase $num in\n  1) echo\
    \ 'You have input 1'\n  2) echo 'You have input 2'\n  3) echo 'You have input\
    \ 3'\n  4) echo 'You have input 4'\n  *) echo 'Your number is not between 1 to\
    \ 4'\nesac\n```\nA. ;\nB. ;;\nC. ;;;\nD. ;;;\n\n(23)\n```bash\n#! /bin/bash\n\
    fill in # 计算行数、单词、字符数\n```\n1. num << DOC\n2. ls << DOC\n3. wc << EOF\n4. cat\
    \ << EOF\n\n(24)\n```bash\n#! /bin/bash\nfill in ./file1.sh # 引入外部文件 \"file1.sh\"\
    \necho \"The website of Ray Yao is:$url\"\n```\nA. include\nB. import\nC. resource\n\
    D. source\n\n### Answers\n| 01. D |\n| 02. C |\n| 03. B |\n| 04. C |\n| 05. A\
    \ |\n| 06. B |\n| 07. C |\n| 08. B |\n| 09. D |\n| 10. C |\n| 11. A |\n\n"
