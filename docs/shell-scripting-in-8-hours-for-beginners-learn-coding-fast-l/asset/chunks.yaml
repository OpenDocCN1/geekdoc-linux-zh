- fmt: "\nSave the file named `OK.sh`. Run the file using the following command:\n\
    ```bash\nbash OK.sh C# GO VB\n```\n**Output:**\n`My file name is: OK.sh`\nC# in\
    \ 8 Hours\nGO in 8 Hours\nVB in 8 Hours\n![](OEBPS/image_rsrc40F.jpg)\n\n**Explanation:**\n\
    `bash OK.sh C# GO VB` runs the file `OK.sh`, and pass four parameters to Shell\
    \ script.\nThe zero parameter `OK.sh` passes to `$0`.\nThe first parameter `C#`\
    \ passes to `$1`.\nThe second parameter `GO` passes to `$2`.\nThe third parameter\
    \ `VB` passes to `$3`.\n\n### Built-in Parameters\nThere are built-in parameters\
    \ in Shell as follows:\n\n| Parameters | Descriptions |\n| :--- | :--- |\n| `$0`\
    \ | Return the file name |\n| `$#` | Return the total number of the parameters\
    \ |\n| `$*` | Return all parameters input by the user |\n| `$@` | Return all parameters\
    \ input by the user |\n| `$$` | Return the current process ID number of the script\
    \ |\n| `$!` | Return the last process ID number of the script |\n| `$?` | Returning\
    \ 0 indicates running successfully |\n\n#### Example 2.9\n```bash\n#!/bin/bash\n\
    echo \"My file name is: $0 \";\necho \"The total of the parameter is:$# \";\n\
    echo \"All parameter input by the user is:$* \";\necho \"The running result is:$?\
    \ \";\n```\n\nSave the file named `yes.sh`. Run the file using the following command:\n\
    ```bash\nbash yes.sh R in 8 Hours\n```\n**Output:**\n`My file name is: yes.sh`\n\
    `The total of the parameter is: 4`\n`All parameter input by the user is: R in\
    \ 8 Hours`\n`The running result is: 0`\n![](OEBPS/image_rsrc40G.jpg)\n\n**Explanation:**\n\
    `bash yes.sh R in 8 Hours` runs the file `yes.sh`, and pass four parameters to\
    \ Shell script.\n`$#`: Return the total number of the parameters.\n`$*`: Return\
    \ all parameters input by the user.\n`$?`: Returning 0 indicates the script running\
    \ successfully, Returning other numbers indicates the script running failure.\n\
    \n## Hour 3\n### Shell Array\nAn array is a particular variable, which can contain\
    \ one or more values at a time. Bash supports one-dimensional arrays, does not\
    \ support multidimensional arrays, and does not limit the size of arrays.\n\n\
    #### 1. The syntax to create an array:\n| `array_name = (value0 value1 value2...)`\
    \ |\n\n**Example:**\n```bash\nmyArray=(100 101 102 103)\n```\n**Explanation:**\n\
    The above code creates an array, the array name is `myArray`, it has four elements,\
    \ its index is 0, 1, 2, 3, its value is 100, 101, 102, 103. Note that index begins\
    \ with zero.\n\n#### 2. Another syntax to create an array:\n| `array_name[0]=value0\
    \ array_name[1]=value1 array_name[2]=value2` |\n\n**Example:**\n```bash\ncolor[0]\
    \ = \"red\";\ncolor[1] = \"blue\";\ncolor[2] = \"green\";\n```\n**Explanation:**\n\
    Above code creates an array, the array name is `color`, and it has three elements:\
    \ `color[0]`, `color[1]`, `color[2]`. Its indexes are 0, 1, and 2. Its values\
    \ are red, blue, and green. Note that index begins with zero.\n\n### Accessing\
    \ the Elements\nThe syntax to access the elements of an array is as follows:\n\
    | `${array_name[index]}` |\n\n#### Example 3.1\n```bash\n#!/bin/bash\nmy_array=(Rust\
    \ in 8 Hours)     # create an array\necho \"The first element is: ${my_array[0]}\
    \ \"\necho \"The second element is: ${my_array[1]} \"\necho \"The third element\
    \ is: ${my_array[2]} \"\necho \"The fourth element is: ${my_array[3]} \"\n```\n\
    **Output:**\n`The first element is: Rust`\n`The second element is: in`\n`The third\
    \ element is: 8`\n`The fourth element is: Hours`\n\n**Explanation:**\n`my_array=(Rust\
    \ in 8 Hours)` creates an array.\n`${my_array[0]}` accesses the element at index\
    \ 0.\n`${my_array[1]}` accesses the element at index 1.\n`${my_array[2]}` accesses\
    \ the element at index 2.\n`${my_array[3]}` accesses the element at index 3.\n\
    The value of `my_array[0]` is: Rust.\nThe value of `my_array[1]` is: in.\nThe\
    \ value of `my_array[2]` is: 8.\nThe value of `my_array[3]` is: Hours.\n\n###\
    \ Get All Elements\n`array_name[@]` or `array_name[*]` can get all elements of\
    \ an array.\n| `array_name[@]` or `array_name[*]` |\n\n**Example 3.2:**\n```bash\n\
    #!/bin/bash\nmy_array[0]=Java\nmy_array[1]=Ruby\nmy_array[2]=Html\nmy_array[3]=Rust\n\
    echo \"All elements are: ${my_array[@] }\"\necho \"All elements are: ${my_array[*]}\"\
    \n```\n**Output:**\n`All elements are: Java Ruby Html Rust`\n`All elements are:\
    \ Java Ruby Html Rust`\n**Explanation:**\n`my_array[@]` or `my_array[*]` can get\
    \ all elements of the array.\n\n### Array Length\n`#array[@]` or `#array[*]` can\
    \ get the length of an array.\n| `#array[@]` or `#array[*]` |\n\n**Example 3.3:**\n\
    ```bash\n#!/bin/bash\nmy_array=(PHP in 8 Hours)\nlength1=${#my_array[@]]}\nlength2=${#my_array[*]}\n\
    echo $length1\necho $length2\n```\n**Output:**\n`5`\n**Explanation:**\n`#my_array[@]`\
    \ or `#my_array[*]` can get the length of the array.\n\n### Print Command\n`printf`\
    \ is a command to format the output in the Shell.\n\n| Type | Description |\n\
    | :--- | :--- |\n| `%b` | Print it as binary value |\n| `%d` | Print it as digital\
    \ value |\n| `%f` | Print it as float-point value |\n| `%o` | Print it as octal\
    \ value |\n| `%s` | Print it as string value |\n| `%x` | Print it as hexadecimal\
    \ value |\n\nFor example:\n`%10s` means formatting as a string with maximum width\
    \ of 10 characters (`-` means left aligned, no sign means right aligned).\n`%8.2f`\
    \ means formatting as float-point value, 8 integers, 2 decimal places.\n\n####\
    \ Example 3.4\n```bash\nprintf \"%-10s%-7s %8s\\n\" Name Age\n```\n**Output:**\n\
    `Name      Age     Weight`\n**Explanation:**\n`%-10s` is replaced by `Name`, `Name`\
    \ is formatted as a string with 10 characters, left aligned.\n`%-7s` is replaced\
    \ by `Age`, `Age` is formatted as a string with 7 characters, left aligned.\n\
    `%-8s` is replaced by `Weight`, `Weight` is formatted as a string with 8 characters,\
    \ left aligned.\n`\\n` is used to go to the next line.\n\n#### Example 3.5\n```bash\n\
    #!/bin/bash\nprintf \"%-10s%-7s %8s\\n\" Name Age\nprintf \"%-10s%-7d %5.2f\\\
    n\" Andy 18 91.8843\nprintf \"%-10s%-7d %5.2f\\n\" Tomy 19 95.4675\nprintf \"\
    %-10s%-7d %5.2f\\n\" Rosy 17 80.8563\n```\n**Output:**\n`Name      Age     Weight`\n\
    `Andy      18    91.88`\n`Tomy      19    95.47`\n`Rosy      17    80.86`\n**Explanation:**\n\
    `printf \"%-10s%-7d %5.2f\\n\" Andy 18 91.8843` formatted three parameters `Andy`,\
    \ `18`, `91.8843`.\n`%-10s` is replaced by `Andy`, `Andy` is formatted as a string\
    \ with 10 characters, left aligned.\n`%-7d` is replaced by `18`, `18` is formatted\
    \ as a digital type with maximum 7 numbers, left aligned.\n`%-5.2f` is replaced\
    \ by `91.88`, `91.88` is formatted as a float-point type with maximum 5 integers,\
    \ 2 decimal places, left aligned.\n`\\n` is used to go to the next line.\n\n###\
    \ Escape Sequences\nThe `\\` backslash character can be used to escape characters.\n\
    `\\a` outputs an alert\n`\\n` outputs the content to the next new line.\n`\\r`\
    \ makes a return.\n`\\t` makes a tab.\n`\\f` outputs the content to the next page.\n\
    `\\'` outputs a single quotation mark.\n`\\\"` outputs a double quotation mark.\n\
    \n#### Example 3.6\n```bash\n#!/bin/bash\nprintf \"%s %s \\'%s\\' \\n\" He said\
    \ OK\nprintf \"%d\\t %d\\n\" 10 100\nprintf \"%s\\n %s %d %s\\n\" C# in 8 Hours\n\
    ```\n**Output:**\n`He said 'OK'`\n`10      100`\n`C#in 8 Hours`\n**Explanation:**\n\
    `\\'%s\\'` outputs the single quotation marks and a formatted string.\n`%d\\t`\
    \ outputs a tap’s space between two numbers.\n`%s\\n` outputs following strings\
    \ in the next line.\n\n## Hour 4\n### Operators\nThe Shell, like other programming\
    \ languages, supports a variety of operators, including: Arithmetic operator,\
    \ Relational operator, Boolean operator, String operator, File operator.\n\n`expr...`\n\
    `expr...` is an expression evaluation tool. The `` ` key is a back quote, rather\
    \ than a single quote.\n\n#### Example 4.1\n```bash\n#!/bin/bash\nsum=`expr 100\
    \ + 200`\necho \"The sum is: $sum\"\n```\n**Output:**\n`The sum is: 300`\n**Explanation:**\n\
    The `` ` key is a back quote, rather than a single quote.\nThe complete expression\
    \ must be included by the back quotes.\nThere must be a space between the expression\
    \ and the operator. For example, `10+20` is wrong, `10 + 20` is correct.\n\n`if...then...else...fi`\n\
    `if statement` executes code1 if a specified condition is true, executes code2\
    \ if the condition is false.\n\n```bash\nif condition\nthen\n    # if true run\
    \ this code1\nelse\n    # if false run this code2\nfi\n```\n\n#### Example 4.2\n\
    ```bash\na=10\nb=20\nif [ $a == $b ]  # check if a is equal to b or not\nthen\n\
    \    echo \"a is equal to b\"\nelse\n    echo \"a is not equal to b\"\nfi\n```\n"
