  trans: "\n\n输出: `a is not equal to b`\n\n解释：`[$a == $b ]` 比较 `a` 和 `b`，检查 `a` 是否等于\
    \ `b`。\n注意：关于 `==`，它应该放在方括号内并留空格。例如：`[$a==$b]` 是错误的，`[ $a == $b ]` 是正确的。`==` 是一个比较运算符。如果\
    \ `a` 等于 `b`，返回 `true`。如果 `a` 不等于 `b`，返回 `false`。\n\n在在方的“if 语句”中，因为测试条件返回 `false`，所以执行了“else\
    \ code2”。\n因此，执行了 `echo \"a is not equal to b\"` 命令。\n\n## 算术运算符\n\n| 运算符 | 运行\
    \ |\n| :--- | :--- |\n| `+` | 加法 |\n| `-` | 减法 |\n| `*` | 乘法 ( 注意：`*` ) |\n| `/`\
    \ | 除法 |\n| `%` | 取模 |\n| `=` | 赋值 |\n| `==` | 检查相等 |\n| `!=` | 检查不相等 |\n\n###\
    \ 示例 4.3\n\n```bash\n#!/ /bin/bash\na=100\nb=2\nresult=`expr $a + $b`\necho \"\
    a + b : $result\"\nresult=`expr $a - $b`\necho \"a - b : $result\"\nresult=`expr\
    \ $a \\* $b`      # 注意 \\*\necho \"a \\* b : $result\"\nresult=`expr $a / $b`\n\
    echo \"a / b : $result\"\nresult=`expr $a % $b`\necho \"a % b : $result\"\n```\n\
    \n输出：\n`a + b : 102`\n`a - b : 98`\n`a * b : 200`\n`a / b : 50`\n`a % b : 0`\n\
    解释：\n| 运算符 | 运行 |\n| :--- | :--- |\n| `+` | 加法 |\n| `-` | 减法 |\n| `*` | 乘法 ( 注意：`*`\
    \ ) |\n| `/` | 除法 |\n| `%` | 取模 |\n\n### 示例 4.4\n\n```bash\na=100\nb=200\nif [\
    \ $a == $b ]      # 如果 a 等于 b，返回 true\nthen\n    echo \"a is equal to b\"\nfi\n\
    if [ $a != $b ]      # 如果 a 不等于 b，返回 true\nthen\n    echo \"a is not equal to\
    \ b\"\nfi\n```\n\n输出：`a is not equal to b`\n\n解释：`[$a == $b ]` 检查 `a` 是否等于 `b`。\n\
    注意：`[ ]` 和 `!=` 之间应该有空格。`[$a!=$b]` 是错误的。`[ $a != $b ]` 是正确的。\n\n## 比较运算符\n\nLinux\
    \ Shell 有以下比较运算符：\n\n| 运算符 |  |\n| :--- | :--- |\n| `-eq` | 等 |\n| `-ne` | 不等于\
    \ |\n| `-gt` | 大于 |\n| `-ge` | 大于等于 |\n| `-lt` | 小于 |\n| `-le` | 小于等于 |\n\n比较表达式返回\
    \ `true` 或 `false`。\n\n### 示例 4.5\n\n```bash\n#! /bin/bash\na=100\nb=200\nif [\
    \ $a -eq $b ]      # 如果 a 等于 b\nthen\n    echo \"a is equal to b\"\nelse\n   \
    \ echo \"a is not equal to b\"\nfi\nif [ $a -ne $b ]      # 如果 a 不等于 b\nthen\n\
    \    echo \"a is not equal to b\"\nelse\n    echo \"a is equal to b\"\nfi\nif\
    \ [ $a -gt $b ]      # 如果 a 大于 b\nthen\n    echo \"a is greater than b\"\nelse\n\
    \    echo \"a is not greater than b\"\nfi\nif [ $a -lt $b ]      # 如果 a 小于 b\n\
    then\n    echo \"a is less than b\"\nelse\n    echo \"a is not less than b\"\n\
    fi\nif [ $a -ge $b ]      # 如果 a 大于等于 b\nthen\n    echo \"a is greater than equal\
    \ to b\"\nelse\n    echo \"a is not greater than equal to b\"\nfi\nif [ $a -le\
    \ $b ]      # 如果 a 小于等于 b\nthen\n    echo \"a is less than equal to b\"\nelse\n\
    \    echo \"a is not less than equal to b\"\nfi\n```\n\n输出：\n`a is not equal to\
    \ b`\n`a is not equal to b`\n`a is not greater than b`\n`a is less than b`\n`a\
    \ is not greater than equal to b`\n`a is less than equal to b`\n\n## 逻辑运算符\n\n\
    | 运算符 | |\n| :--- | :--- |\n| `-a` | 与 |\n| `-o` | 或 |\n| `!` | 非 |\n\n使用逻辑运算符后结果将\
    \ `true` 或 `false`。\n- `true -a true` 返回 `true`\n- `true -a false` 返回 `false`\n\
    - `false -a false` 返回 `false`\n- `true -o true` 返回 `true`\n- `true -o false` 返回\
    \ `true`\n- `false -o false` 返回 `false`\n- `! false` 返回 `true`\n- `! true` 返回\
    \ `false`\n\n### 示例 4.6\n\n```bash\n#! /bin/bash\nx=true\ny=false\nif [ $x -a\
    \ $y ]      # -a 意味着“与”\nthen\n    echo false\nfi\nif [ $x -o $y ]      # -o 意味着“或”\n\
    then\n    echo true\nfi\nif [ !$x ]           # ! 意味着“非”\nthen\n    echo false\n\
    fi\n```\n\n输出：\n`false`\n`true`\n`false`\n\n解释：\n- `true -a true` 返回 `true`\n\
    - `true -a false` 返回 `false`\n- `false -a false` 返回 `false`\n- `true -o true`\
    \ 返回 `true`\n- `true -o false` 返回 `true`\n- `false -o false` 返回 `false`\n- `!\
    \ false` 返回 `true`\n- `! true` 返回 `false`\n\n## 字符串运算符\n\n| 运算符 | 检查 |\n| :---\
    \ | :--- |\n| `=` | 如果两个字符串相等 |\n| `!=` | 如果两个字符串不相等 |\n| `-z` | 如果字符串长度为零 |\n\
    | `-n` | 如果字符串长度不为零 |\n| `$` | 如果字符串为空 |\n\n### 示例 5.1\n\n```bash\n#! /bin/bash\n\
    a=\"Java\"\nb=\"Ruby\"\nif [ $a = $b ]      # 检查 a 是否等于 b\nthen\n    echo \"$a\
    \ = b ?  a is equal to b\"\nelse\n    echo \"$a = b ?  a isn't equal to b\"\n\
    fi\nif [ $a != $b ]      # 检查 a 不等于 b\nthen\n    echo \"$a != b ?  a isn't equal\
    \ to b\"\nelse\n    echo \"$a != b ?  a is equal to b\"\nfi\nif [ -z $a ]    \
    \     # 检查字符串长度是否为 0\nthen\n    echo \"-z $a ?  The string is 0\"\nelse\n    echo\
    \ \"-z $a ?  The string is not 0\"\nfi\nif [ -n $a ]         # 检查字符串长度是否为 0\n\
    then\n    echo \"-n $a ?  The string is not 0\"\nelse\n    echo \"-n $a ?  The\
    \ string is 0\"\nfi\n```\n\n输出：\n`a = b ?  a isn't equal to b`\n`a != b ?  a isn't\
    \ equal to b`\n`-z $a ?  The string is not 0`\n`-n $a ?  The string is not 0`\n\
    \n解释：\n- `=`: 如果两个字符串相等\n- `!=`: 如果两个字符串不相等\n- `-z`: 如果字符串长度为零\n- `-n`: 如果字符串长度不为零\n\
    - `$`: 如果字符串为空\n\n## 文件运算符\n\n文件运算符用于检测文件的各种属性。\n\n| 运算符 | 检查 |\n| :--- | :---\
    \ |\n| `-d` | 如果是目录 |\n| `-f` | 如果是文件 |\n| `-p` | 如果是管道 |\n| `-r` | 如果是可读的 |\n\
    | `-w` | 如果是可写的 |\n| `-x` | 如果是可执行的\n| `-e` | 如果文件存在 |\n| `-s` | 如果文件不是空的 |\n\
    | `-b` | 如果是块设备 |\n| `-c` | 如果是字符设备 |\n\n### 示例 5.2\n\n假设文件 “myFile.sh” 不存在，但我们仍然检查该属性。\n\
    \n```bash\n#! /bin/bash\nfile=\"/root/myFile.sh\"\nif [ -r $file ]      # 检查是否可读\n\
    then\n    echo \"The object is readable\"\nelse\n    echo \"The object isn't readable\"\
    \nfi\nif [ -w $file ]      # 检查是否可写\nthen\n    echo \"The object is writable\"\
    \nelse\n    echo \"The object isn't writable\"\nfi\nif [ -x $file ]      # 检查是否为可执行的\n\
    then\n    echo \"The object is executable\"\nelse\n    echo \"The object isn't\
    \ executable\"\nfi\nif [ -f $file ]      # 检查是否是文件\nthen\n    echo \"The object\
    \ is a file\"\nelse\n    echo \"The object isn't a file\"\nfi\nif [ -d $file ]\
    \      # 检查是否是目录\nthen\n    echo \"The object is a directory\"\nelse\n    echo\
    \ \"The object isn't a directory\"\nfi\nif [ -s $file ]      # 检查是否不是空的\nthen\n\
    \    echo \"The object isn't empty\"\nelse\n    echo \"The object is empty\"\n\
    fi\nif [ -e $file ]      # 检查文件是否存在\nthen\n    echo \"The file is existing\"\n\
    else\n    echo \"The file isn't existing\"\nfi\n```\n\n输出：\n`The object isn't\
    \ readable`\n`The object isn't writable`\n`The object isn't executable`\n`The\
    \ object isn't a file`\n`The object isn't a directory`\n`The object is empty`\n\
    `The file isn't existing`\n\n"
- fmt: "\n| `-e file` | If the object is an empty file, return true . |\n| `-s file`\
    \ | If the object isn’t an empty file, return true . |\n\nThe result of the final\
    \ check is “The file isn’t existing. ” The `echo` command is used to output contents.\
    \ In here, let’s talk about its special usages.\n\n### Output the Escape Characters\n\
    ```bash\n#! /bin/sh\necho \"\\\"C++ in 8 Hours\\\" \"\n```\nOutput:`\"C++ in 8\
    \ Hours\"`\n\n### Output the Variable Value\n```bash\n#! /bin/sh\nbook =\"C# in\
    \ 8 Hours\"\necho \"$book is a great book\"\n```\nOutput: `C# in 8 Hours is a\
    \ great book`\n\n### Output the Contents in the Same Line\n```bash\n#! /bin/sh\n\
    echo -e \"Go \\c \"      # -e turn on the escape switch\necho \"in 8 Hours\" \
    \     # \\c output in the same line\n```\nOutput: `Go in 8 Hours`\n\n### Output\
    \ to a File\n```bash\n#! /bin/sh\necho \"PHP in 8 Hours\" > myFile     # \">\"\
    \ redirect to\n```\n\n### Output the Original Format\n```bash\n#! /bin/sh\necho\
    \ ' He said: \"OK! \" '      # using single quotes\n```\nOutput: `He said: \"\
    OK! \"`\n\n### Output the Executed Result\n```bash\n#! /bin/sh\necho Today is\
    \ `date`  # using back quotes rather than single quotes\n```\nOutput:`Today is\
    \ Thu Aug 22 09: 01: 19 DST 2019`\n\n### Show the Input by Users\n```bash\n#!\
    \ /bin/sh\necho \"Please type your name: \"\nread name      # \"read\" accepts\
    \ the input by users\necho \"My name is $name\"\n```\nOutput:\nPlease type your\
    \ name:Ray Yao\nMy name is Ray Yao\n\n## Hour 6\n\n### Test Command\nThe test\
    \ command checks to see if a condition is true. It can be used to test three aspects:\
    \ numerics, characters and files. `[ ]` is used to execute the arithmetical calculation.\n\
    \n| `test numerics / characters / files` |\n\n#### Example 6.1\n```bash\n#! /bin/bash\n\
    num1=10\nnum2=20\nif test $[num1] -eq $[num2]\nthen\necho 'Two numbers are equal.\
    \ '\nelse\necho 'Two numbers are not equal. '\nfi\n```\nOutput:`Two numbers are\
    \ not equal.`\nExplanation:`test $[num1] -eq $[num2]` tests the equality of two\
    \ numbers. `[ ]` Symbol is used to execute the arithmetical calculation. In an\
    \ expression, the two sides of the `=` cannot have spaces.\n\n#### Example 6.2\n\
    ```bash\n#! /bin/bash\nx=100\ny=200\nz=$[x + y]\necho \"The result is: $z\"\n\
    ```\nOutput:`The result is: 300`\nExplanation:`[x + y]` executes an arithmetical\
    \ calculation. Note: the two sides of the `=` cannot have spaces.\n\n### Test\
    \ Equality\nTest command can be used to test whether two strings are equal.\n\n\
    #### Example 6.3\n```bash\n#! /bin/bash\nstr1=\"Java\"\nstr2=\"JavaScript\"\n\
    if test $str1 = $str2\nthen\necho 'Two strings are equal! '\nelse\necho 'Two strings\
    \ are not equal! '\nfi\n```\nOutput:`Two strings are not equal!`\nExplanation:`test\
    \ $str1 = $str2` tests the equality of two strings.\n\n### Test Existence\nTest\
    \ command can be used to test whether a file is existing.\n\n#### Example 6.4\n\
    ```bash\n#! /bin/bash\n# assume that theFile . sh is not existing .\nif test -e\
    \ /root/theFile.sh       # -e checks existence\nthen\necho 'The file exists! '\n\
    else\necho ' The file doesn't exist! '\nfi\n```\nOutput:`The file doesn't exist!`\n\
    Explanation: Assume that `theFile. sh` is not existing. `“test -e /root/theFile.\
    \ sh\"` tests whether the file is existing.\n\n### Test Empty String\nTest command\
    \ can be used to test whether a string is empty.\n\n#### Example 6.5\n```bash\n\
    #! /bin/bash\n# assume \"$myString” has not been assigned a value yet .\nif test\
    \ -n \"$myString\"      # -n checks empty string\nthen\n    echo \"It's not an\
    \ empty string. \"\nelse\necho \"It's an empty string. \"\nfi\n```\nOutput:`It’s\
    \ an empty string.`\nExplanation: Because `“myString” has not been assigned any\
    \ value, it is an empty string.\n\n## Shell Function\nA function is a code block\
    \ that can repeat to run many times. The syntax to define a function is as follows:\n\
    \n| `function_name(){}` |\n\nTo call a function, use `function_name;`\n\n| `function_name`\
    \ |\n\n#### Example 6.6\n```bash\n#! /bin/bash\nmyFunction() {\n     # define\
    \ a function\necho \"jQuery in 8 Hours\"\n}\necho \"Before calling the function.\
    \ \"\nmyFunction      # call the function\necho \"After calling the function.\
    \ \"\n```\nOutput:\nBefore calling the function.\njQuery in 8 Hours\nAfter calling\
    \ the function.\nExplanation:`“myFunction(){ }” defines a function. `“myFunction”`\
    \ calls the function.\n\n### Function with Arguments\nWhen calling a function,\
    \ you can pass parameters to the function body. For example pass the first parameter\
    \ to `${1}`, pass the second parameter to `${2}` ...\n\n#### Example 6.7\n```bash\n\
    #! /bin/bash\nmyFunction(){\necho \"The first parameter is: ${1} \"\necho \"The\
    \ second parameter is: ${2} \"\necho \"The third parameter is: ${3} \"\necho \"\
    The fourth parameter is: ${4} \"\necho \"All parameters are: $* \"\n}\nmyFunction\
    \ Kotlin in Hour\n```\nExplanation:`${1}` accepts the first parameter. `${2}`\
    \ accepts the second parameter. `$*` shows all parameters. `“myFunction Kotlin\
    \ in Hour` calls the function and pass four parameters.\n\n### Return Values\n\
    `return` can return a value to `$?`. `$?` shows the return value. In some machine,\
    \ `$?` only shows the value from 0 to 255.\n\n| `function_name { return value\
    \ }` |\n| `$?` | shows the return value |\n\n#### Example 6.8\n```bash\n#! /bin/bash\n\
    add(){\n     # define a function\nx=100\ny=55\nz=`expr $x + y`\nreturn $z    \
    \ # returns the value\n}\nadd     # call the function\necho \"The sum of two numbers\
    \ is $?\"\n```\nOutput:The sum of two numbers is `155`\nExplanation:`return $z`\
    \ returns the value to `$?`. `$?` shows the return value.\n\n#### Example 6.9\n\
    ```bash\n#! /bin/bash\nmyFunction(){\necho \"Please enter the first number: \"\
    \nread x      # assume entering 80\necho \"Please enter the second number: \"\n\
    read y      # assume entering 90\nz=`expr $x + y`\nreturn $z     # returns a value\
    \ to $?\n}\nmyFunction\necho \"The return value is $?\"\n```\nOutput:\nPlease\
    \ enter the first number:80\nPlease enter the second number:90\nThe return value\
    \ is 170\nExplanation:`return $z` returns a value to `$?`. `$?` shows the return\
    \ value.\n\n## Hour 7\n\n### if .. then .. elif .. then .. else\n`if... then…elif…then…else`\
    \ runs this code if a condition is true and runs that code if the condition is\
    \ false.\n\n| `if condition then code1 elif condition then code2 else code3 fi`\
    \ | `elif` means `else…if…`\n\n#### Example 7.1\n```bash\n#! /bin/bash\nx=100\n\
    y=80\nif [ $x == $y ]\nthen\necho \"x is equal to y\"\nelif [ $x -gt $y ]    \
    \  # meet this condition\necho \"x is greater than y\"\nelif [ $x -lt $y ]\nthen\n\
    echo \"x is less than y\"\nelse\necho \"n/a\"\nfi\n```\nOutput:`x is greater than\
    \ y`\nExplanation:`elif` means `else…if…`. `elif [ $x -gt $y ]` tests if `$x`\
    \ is greater than `$y`.\n\n### For Loop\n`For loop` runs a block of code repeatedly\
    \ by the specified items\n\n| `for var in item1 item2 item3… code1 code2…done`\
    \ |\n\n#### Example 7.2\n```bash\n#! /bin/bash\nfor var in 1 2 3\necho \"The number\
    \ is: $var\"\ndone\n```\nOutput:\nThe number is: 1\nThe number is: 2\nThe number\
    \ is: 3\nExplanation:`for var in 1 2 3` repeatedly run the next code when `var=1`,\
    \ `var=2`, `var=3`.\n\n#### Example 7.3\n```bash\n#! /bin/bash\nfor str in Rust\
    \ in 8 Hours\necho $str\ndone\n```\nOutput:`Rustin8Hours`\nExplanation:`for str\
    \ in Rust in 8 Hours` repeatedly run the next code when `str=Rust`, `var=in`,\
    \ `var=8`,`var=Hours`.\n\n### While Loop\n`while loop` loops through a block of\
    \ code if the specified condition is true.\n\n| `while condition code done` |\n\
    \n#### Example 7.4\n```bash\n#! /bin/bash\ncounter=1\nwhile(( $counter<=4 )) \
    \     # run 4 times\ndo\necho $counter\ncounter=`expr $counter + 1`\ndone\n```\n\
    Output:\n1234\nExplanation: `($counter<=4)` is a test condition, if the condition\
    \ is true, the code will loop at most four times. `“While Loop” statement can\
    \ be used to input data continuously, but if you want to finish the input, please\
    \ press `<ctrl + d>` to quit the program.\n\n#### Example 7.5\n```bash\n#! /bin/bash\n\
    echo 'Please enter a book name: '\nwhile read book      # accepts the input from\
    \ user\necho \"OK! $book is a good book! \"\necho \"If quit, please press <ctrl\
    \ + d>. \"\ndone\n```\nOutput:\nPlease enter a book name:PHP in 8 Hours\nOK! PHP\
    \ in 8 Hours is a good book!\nIf quit, please press <ctrl + d>.\nExplanation:`while\
    \ read book` accepts the continuous input from the user. You can input data more\
    \ than one time if you want.\n\n### Until Loop\n`until loop` loops through a block\
    \ of code if the specified condition is false , will quit the loop if the condition\
    \ is true.\n\n| `until condition code done` |\n\n#### Example 7.6\n```bash\n#!\
    \ /bin/bash\nn=0\nuntil [ $n -ge 4 ]      # will quit the loop if true\ndo\necho\
    \ $n\nn=`expr $n + 1`\ndone\n```\n"
