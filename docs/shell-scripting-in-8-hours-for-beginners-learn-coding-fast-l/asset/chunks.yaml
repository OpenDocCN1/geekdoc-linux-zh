- fmt: "\nOutput: `a is not equal to b`\n\nExplanation: `[$a == $b ]` compares `a`\
    \ and `b`, check if a is equal to b or not.\nNote: About `==`, it should be put\
    \ between square brackets with spaces. For example: `[$a==$b]` is wrong, `[ $a\
    \ == $b ]` is correct. `==` is a comparison operator. If `a` is equal to `b`,\
    \ return `true`. If `a` is not equal to `b`, return `false`.\n\nIn above “if statement”,\
    \ because the test condition returns `false`, the “else code2” is executed.\n\
    Therefore, the `echo \"a is not equal to b\"` command is executed.\n\n## Arithmetical\
    \ Operators\n\n| Operators | Running |\n| :--- | :--- |\n| `+` | add |\n| `-`\
    \ | subtract |\n| `*` | multiply ( note: `*` ) |\n| `/` | divide |\n| `%` | get\
    \ modulus |\n| `=` | assignment |\n| `==` | check equality |\n| `!=` | check inequality\
    \ |\n\n### Example 4.3\n\n```bash\n#!/ /bin/bash\na=100\nb=2\nresult=`expr $a\
    \ + $b`\necho \"a + b : $result\"\nresult=`expr $a - $b`\necho \"a - b : $result\"\
    \nresult=`expr $a \\* $b`      # note \\*\necho \"a \\* b : $result\"\nresult=`expr\
    \ $a / $b`\necho \"a / b : $result\"\nresult=`expr $a % $b`\necho \"a % b : $result\"\
    \n```\n\nOutput:\n`a + b : 102`\n`a - b : 98`\n`a * b : 200`\n`a / b : 50`\n`a\
    \ % b : 0`\n\nExplanation:\n| Operators | Running |\n| :--- | :--- |\n| `+` |\
    \ add |\n| `-` | subtract |\n| `*` | multiply ( note: `*` ) |\n| `/` | divide\
    \ |\n| `%` | get modulus |\n\n### Example 4.4\n\n```bash\na=100\nb=200\nif [ $a\
    \ == $b ]      # if a is equal to b, return true\nthen\n    echo \"a is equal\
    \ to b\"\nfi\nif [ $a != $b ]      # if a is not equal to b, return true\nthen\n\
    \    echo \"a is not equal to b\"\nfi\n```\n\nOutput: `a is not equal to b`\n\n\
    Explanation: `[$a ! = $b ]` checks if a is not equal to b.\nNote: There should\
    \ be spaces between `[ ]` and `!=`. `[$a! =$b]` is wrong. `[ $a ! = $b ]` is correct.\n\
    \n## Comparison Operators\n\nLinux Shell has comparison operators as follows:\n\
    \n| Operators | Checks |\n| :--- | :--- |\n| `-eq` | equal |\n| `-ne` | not equal\
    \ |\n| `-gt` | greater than |\n| `-ge` | greater or equal |\n| `-lt` | less than\
    \ |\n| `-le` | less or equal |\n\nThe comparison expression returns `true` or\
    \ `false`.\n\n### Example 4.5\n\n```bash\n#! /bin/bash\na=100\nb=200\nif [ $a\
    \ -eq $b ]           # check if a is equal to b\nthen\n    echo \"$a -eq $b ?\
    \  a is equal to b\"\nelse\n    echo \"$a -eq $b ?  a is not equal to b\"\nfi\n\
    if [ $a -ne $b ]           # check if a is not equal to b\nthen\n    echo \"$a\
    \ -ne $b ?  a is not equal to b\"\nelse\n    echo \"$a -ne $b ?  a is equal to\
    \ b\"\nfi\nif [ $a -gt $b ]           # check if a is greater than b\nthen\n \
    \   echo \"$a -gt $b ?  a is greater than b\"\nelse\n    echo \"$a -gt $b ?  a\
    \ is not greater than\"\nfi\nif [ $a -lt $b ]           # check if a is less to\
    \ b\nthen\n    echo \"$a -lt $b ?  a is less than b\"\nelse\n    echo \"$a -lt\
    \ $b ?  a is not less than\"\nfi\nif [ $a -ge $b ]           # check if a is greater\
    \ than equal to b\nthen\n    echo \"$a -ge $b ?  a is greater than equal to b\"\
    \nelse\n    echo \"$a -ge $b ?  a is less than b\"\nfi\nif [ $a -le $b ]     \
    \      # check if a is less than equal to b\nthen\n    echo \"$a -le $b ?  a is\
    \ less than equal to b\"\nelse\n    echo \"$a -le $b ?  a is greater than b\"\n\
    fi\n```\n\nOutput:\n`100 -eq 200 ?  a is not equal to b`\n`100 -ne 200 ?  a is\
    \ equal to b`\n`100 -gt 200 ?  a is not greater than`\n`100 -lt 200 ?  a is less\
    \ than b`\n`100 -ge 200 ?  a is less than b`\n`100 -le 200 ?  a is greater than\
    \ b`\n\nExplanation:\n| Operators | Checks |\n| :--- | :--- |\n| `-eq` | equal\
    \ |\n| `-ne` | not equal |\n| `-gt` | greater than |\n| `-ge` | greater or equal\
    \ |\n| `-lt` | less than |\n| `-le` | less or equal |\n\n## Boolean Operators\n\
    \n| Operators | Checks |\n| :--- | :--- |\n| `-a` | and |\n| `-o` | or |\n| `!`\
    \ | not |\n\nAfter using logical operators, the result will be `true` or `false`.\n\
    - `true -a true` returns `true`\n- `true -a false` returns `false`\n- `false -a\
    \ false` returns `false`\n- `true -o true` returns `true`\n- `true -o false` returns\
    \ `true`\n- `false -o false` returns `false`\n- `! false` returns `true`\n- `!\
    \ true` returns `false`\n\n### Example 4.6\n\n```bash\n#! /bin/bash\nx=true\n\
    y=false\nif [ $x -a $y ]      # -a means \"and\"\nthen\n    echo false\nfi\nif\
    \ [ $x -o $y ]      # -o means \"or\"\nthen\n    echo true\nfi\nif [ !$x ]   \
    \        # ! means \"not\"\nthen\n    echo false\nfi\n```\n\nOutput:\n`false`\n\
    `true`\n`false`\n\nExplanation:\n- `true -a true` returns `true`\n- `true -a false`\
    \ returns `false`\n- `false -a false` returns `false`\n- `true -o true` returns\
    \ `true`\n- `true -o false` returns `true`\n- `false -o false` returns `false`\n\
    - `! false` returns `true`\n- `! true` returns `false`\n\n## String Operators\n\
    \n| Operators | Checks |\n| :--- | :--- |\n| `=` | If two strings are equal |\n\
    | `!=` | If two strings are not equal |\n| `-z` | If the length of a string is\
    \ equal to zero |\n| `-n` | If the length of a string is not equal to zero |\n\
    | `$` | If the string is not empty |\n\n### Example 5.1\n\n```bash\n#! /bin/bash\n\
    a=\"Java\"\nb=\"Ruby\"\nif [ $a = $b ]      # check if a is equal to b\nthen\n\
    \    echo \"$a = b ?  a is equal to b\"\nelse\n    echo \"$a = b ?  a isn't equal\
    \ to b\"\nfi\nif [ $a != $b ]      # check if a isn’t equal to b\nthen\n    echo\
    \ \"$a != b ?  a isn't equal to b\"\nelse\n    echo \"$a != b ?  a is equal to\
    \ b\"\nfi\nif [ -z $a ]         # check if the string length is 0\nthen\n    echo\
    \ \"-z $a ?  The string length is 0\"\nelse\n    echo \"-z $a ?  The string length\
    \ isn't 0\"\nfi\nif [ -n \"$a\" ]      # check if the string length isn’t 0\n\
    then\n    echo \"-n $a ?  The string length isn't 0\"\nelse\n    echo \"-n $a\
    \ ?  The string length is 0\"\nfi\nif [ $a ]            # check if the string\
    \ isn’t empty\nthen\n    echo \"$a ?  The string isn't empty\"\nelse\n    echo\
    \ \"$a ?  The string is empty\"\nfi\n```\n\nOutput:\n`Java = Ruby ?  a isn't equal\
    \ to b`\n`Java != Ruby ?  a isn't equal to b`\n`-z Java ?  The string length isn't\
    \ 0`\n`-n Java ?  The string length isn't 0`\n`Java ?  The string isn't empty`\n\
    \nExplanation:\n- `=`: If two strings are equal\n- `!=`: If two strings are not\
    \ equal\n- `-z`: If the length of a string is equal to zero\n- `-n`: If the length\
    \ of a string is not equal to zero\n- `$`: If the string is not empty\n\n## File\
    \ Operators\n\nFile operators are used to detect various properties of Linux files.\n\
    \n| Operator | Checks |\n| :--- | :--- |\n| `-d` | If the object is a directory\
    \ |\n| `-f` | If the object is a file |\n| `-p` | If the object is a pipe |\n\
    | `-r` | If the object is a readable file |\n| `-w` | If the object is a writable\
    \ file |\n| `-x` | If the object is an executable file |\n| `-e` | If the object\
    \ is an empty file |\n| `-s` | If the object isn’t an empty file |\n| `-b` | If\
    \ the object is a block device file |\n| `-c` | If the object is a character device\
    \ file |\n\n### Example 5.2\n\n# Assume that the file “myFile.sh” does not exist,\
    \ but we still check the property of this file.\n\n```bash\n#! /bin/bash\nfile=\"\
    /root/myFile.sh\"\nif [ -r $file ]      # check if the object is readable\nthen\n\
    \    echo \"The object is readable\"\nelse\n    echo \"The object isn't readable\"\
    \nfi\nif [ -w $file ]      # check if the object is writable\nthen\n    echo \"\
    The object is writable\"\nelse\n    echo \"The object isn't writable\"\nfi\nif\
    \ [ -x $file ]      # check if the object is executable\nthen\n    echo \"The\
    \ object is executable\"\nelse\n    echo \"The object isn't executable\"\nfi\n\
    if [ -f $file ]      # check if the object is a file\nthen\n    echo \"The object\
    \ is a file\"\nelse\n    echo \"The object isn't a file\"\nfi\nif [ -d $file ]\
    \      # check if the object is a directory\nthen\n    echo \"The object is a\
    \ directory\"\nelse\n    echo \"The object isn't a directory\"\nfi\nif [ -s $file\
    \ ]      # check if the object isn’t empty\nthen\n    echo \"The object isn't\
    \ empty\"\nelse\n    echo \"The object is empty\"\nfi\nif [ -e $file ]      #\
    \ check if the file is existing\nthen\n    echo \"The file is existing\"\nelse\n\
    \    echo \"The file isn't existing\"\nfi\n```\n\nOutput:\n`The object isn't readable`\n\
    `The object isn't writable`\n`The object isn't executable`\n`The object isn't\
    \ a file`\n`The object isn't a directory`\n`The object is empty`\n`The file isn't\
    \ existing`\n"
