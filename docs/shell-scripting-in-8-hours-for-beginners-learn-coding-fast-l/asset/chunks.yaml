    | #! /bin/basha="Java"b="Ruby"if [ $a = $b ]      # check if a is equal to bthenecho
    "$a = $b ?  a is equal to b"elseecho "$a = $b ?  a isn''t equal to b"fiif [ $a
    != $b ]      # check if a isn’t equal to bthenecho "$a ! = $b ?  a isn''t equal
    to b"elseecho "$a ! = $b ?  a is equal to b"fiif [ -z $a ]      # check if the
    string length is 0thenecho "-z $a ?  The string length is 0"elseecho "-z $a ? 
    The string length isn''t 0"fiif [ -n "$a" ]        # check if the string length
    isn’t 0thenecho "-n $a ?  The string length isn''t 0"elseecho "-n $a ?  The string
    length is 0"fiif [ $a ]        # check if the string isn’t emptythenecho "$a ? 
    The string isn''t empty"elseecho "$a ?  The string is empty"fi |


    Output:Java = Ruby ?  a isn''t equal to bJava ! = Ruby ?  a isn''t equal to b-z
    Java ?  The string length isn''t 0-n Java ?  The string length isn''t 0Java ? 
    The string isn''t empty.Explanation:


    | = | If two strings are equal, returns true . |


    | ! = | If two strings are not equal, returns true . |


    | -z | If the length of a string is equal to zero, returns true . |


    | -n | If the length of a string is not equal to zero, returns true |


    | $ | If the string is not empty, returns true . |


    File OperatorsFile operators are used to detect various properties of Linux files.


    | Operator | Checks |


    | -d file | If the object is a directory, return true . |


    | -f file | If the object is a file, return true . |


    | -p file | If the object is a pipe, return true . |


    | -r file | If the object is a readable file, return true . |


    | -w file | If the object is a writable file, return true . |


    | -x file | If the object is an executable file, return true . |


    | -e file | If the object is an empty file, return true . |


    | -s file | If the object isn’t an empty file, return true . |


    | -b file | If the object is a block device file, return true . |


    | -c file | If the object is a character device file, return true . |


    Example 5.2# Assume that the file “myFile . sh” does not exist, but we still check
    the property of this file .


    | #! /bin/bashfile="/root/myFile. sh"if [ -r $file ]     # check if the object
    is readablethenecho "The object is readable"elseecho "The object isn''t readable"fiif
    [ -w $file ]     # check if the object is writablethenecho "The object is writable"elseecho
    "The object isn''t writable"fiif [ -x $file ]   # check if the object is executablethenecho
    "The object is executable"elseecho "The object isn''t executable"fiif [ -f $file
    ]    # check if the object is a filethenecho "The object is a file"elseecho "The
    object isn''t a file"fiif [ -d $file ]   # check if the object is a directorythenecho
    "The object is a directory"elseecho "The object isn''t a directory"fiif [ -s $file
    ]    # check if the object isn’t emptythenecho "The object isn''t empty"elseecho
    "The object is empty"fiif [ -e $file ]     # check if the file is existingthenecho
    "The file is existing"elseecho "The file isn''t existing"fi |


    Output:The object isn''t readableThe object isn''t writableThe object isn''t executableThe
    object isn''t a fileThe object isn''t a directoryThe object is emptyThe file isn''t
    existingExplanation:Assume that there is no the file “myFile. sh” in directory
    “root”, but we still check the property of this file.Let’s review the following
    file test operators:


    | -d file | If the object is a directory, return true |


    | -f file | If the object is a file, return true |


    | -r file | If the object is a readable file, return true . |


    | -w file | If the object is a writable file, return true . |


    | -x file | If the object is an executable file, return true . |'
