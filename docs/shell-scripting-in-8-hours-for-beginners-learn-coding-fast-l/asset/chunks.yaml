    Linux systems.


    # The First Shell Scripting


    ### Example 1.1


    1. Open the Vi text editor with a `vi` command.


    ![](OEBPS/image_rsrc40C.jpg)


    2. Press `i` key, enter the Insert Mode.


    3. Type the following code in the Vi editor:


    ```bash

    #! /bin/bash

    echo "Hello World ! "

    ```


    ![](OEBPS/image_rsrc40D.jpg)


    4. Press the `Esc` key to quit the Insert Mode.


    5. Type `:wq study.sh` to save the file. The file name is `study.sh`, the extension
    name is `.sh`.


    6. Run this Shell program with the following commands:


    ```bash

    bash study.sh

    ```

    Output:Hello World!![](OEBPS/image_rsrc40E.jpg)


    Explanation:

    - `vi` is a command to open the Vi editor.

    - `i` key is used to enter the Insert Mode in Vi editor. Insert Mode can be used
    for writing and editing Shell Scripts.

    - `#! /bin/bash` let Shell system know that using Bash to interpret the scripting.

    - `echo "Hello World ! "` shows the content `Hello World! `.

    - `Esc` key is used to quit the Insert Mode in Vi editor.

    - `:wq file_name` saves the Shell file, and quit from Vi.

    - `bash study.sh` executes the Shell file `study.sh`.

    - `bash myFile.sh` executes the Shell file `myFile.sh`.


    ### Shell Comment


    ```bash

    #

    ```

    `#` symbol is used for the Shell comments. Shell interpreter always ignores the
    Shell comments.


    ### Example 1.2


    ```bash

    #! /bin/bash

    echo "Hello World! "     # output Hello World!

    echo "Hi, Friends! "      # output Hi, Friends!

    ```

    Output:

    Hello World!

    Hi, Friends!


    Explanation:

    - `# output Hello World ! ` is a comment of Shell scripting.

    - `# output Hi, Friends ! ` is a comment of Shell scripting.


    ### Multi-Line Comments


    ```bash

    : <<EOF

    comment 1

    comment 2

    comment 3...

    EOF

    ```

    `: <<EOF……EOF` is used for multi-line comments.


    ### Example 1.3


    ```bash

    #! /bin/bash

    echo "Hello World! "

    :<<EOF

    This is a "Hello World" program.

    This is a Shell scripting.

    This is a sample of multi-line comment.......

    EOF

    echo "This is a sample of multi-line comment. "

    ```

    Output:

    Hello World!

    This is a sample of multi-line comment.


    Explanation:

    `: <<EOF……EOF ` is used for multi-line comments.


    # Shell Variables


    1. The syntax to define a variable is as follows:


    ```bash

    var="value"

    ```

    Note: There must be no Spaces before and after the equal sign!


    2. To use a variable, you need to use `$` before a variable.


    ```bash

    $var

    ```


    ### Example 1.4


    ```bash

    #! /bin/bash

    book="Scala in 8 Hours"     # define a variable

    echo $book                # use the variable

    ```

    Output:Scala in 8 Hours


    Explanation: When defining a variable, make sure that no spaces before or after
    the equal sign.


    ### Variable Name

    The rule of the variable name is as follows:

    - Only English letters, numbers, and underscores can be used for variable naming.

    - The first character of the variable name cannot begin with a number.

    - There can be no spaces in the middle of a variable name.

    - Variable names cannot be punctuated.

    - Bash keywords cannot be used for variable names.


    **Valid Variable Name:** `_myVariable`, `myVariable001`, `my_Varialbe`

    **Invalid Variable Name:** `001Variable`, `echomy`, `*Varialbe`


    ### Read-Only Variable

    The `readonly` command can define a variable as a read-only variable, whose value
    cannot be changed.


    ```bash

    readonly variable

    ```


    ### Example 1.5


    ```bash

    #! /bin/bash

    myVar="C# in 8 Hours"

    readonly myVar

    myVar="Scala in 8 Hours"     # change the variable value

    ```

    Output:

    ( an error message as follows: )

    `test. sh: line 4: myVar: readonly variable`


    Explanation: `readonly myVar` sets `myVar` as read only. The output is an error
    message. After `myVar` becomes a read-only variable, any change in the value of
    `myVar` will cause an error.


    ### Remove Variable

    The `unset` command can delete variables.


    ```bash

    unset variable

    ```


    ### Example 1.6


    ```bash

    #! /bin/sh

    myVar="C++ in 8 Hours"

    unset myVar     # remove a variable

    echo $myVar

    ```

    Output: (nothing)


    Explanation: After a variable is removed, the variable no longer exists, and its
    value no longer exists. So you don''t see any output.


    ### Input to Variable

    The value of a variable can be input from keyboard by a user.


    ```bash

    read variable

    ```


    ### Example 1.7


    ```bash

    #! /bin/sh

    echo "Please input your name. "

    read myInput          # the input value will be stored in myInput

    echo "Hi! Your name is: $myInput" # Assume that I will input my name : Ray Yao

    ```

    Output:

    Please input your name.

    Ray Yao

    Hi! Your name is Ray Yao


    Explanation: Assume that I input my name: Ray Yao. `read myInput` stores the input
    value to `myInput`. `echo "Hi! Your name is: $myInput"` shows the input value.


    # Hour 2


    ## Shell String (1)

    The string is enclosed in single quotes.


    ```bash

    str=''This is a string''

    ```

    - Any characters in the single quotes will be printed in its original format.

    - The string variables in the single quotes are invalid.


    ### Example 2.1


    ```bash

    #! /bin/sh

    var=Andy

    str=''Hello, $var''         # single-quote string

    echo $str

    ```

    Output:Hello, $var


    Explanation: `''Hello, $var''` is a single-quote string. Any character in the
    single quotes will be printed in its original format.


    ### Shell String (2)

    The string is enclosed in double quotes.


    ```bash

    str="This is a string"

    ```

    - Any characters in the double quotes will be printed by its returned value.

    - The string variables in the double quotes are valid.


    ### Example 2.2


    ```bash

    #! /bin/sh

    var=Andy

    str="Hello, $var"          # double-quote string

    echo $str

    ```

    Output:Hello, Andy


    Explanation: `''Hello, $var''` is a double-quote string. Any character in the
    double quotes will be printed by its returned value.


    ### Connect Strings

    We can use double quotes to connect two strings.


    ### Example 2.3


    ```bash

    #! /bin/sh

    str1="Kotlin"

    str2="in 8 Hours"

    myString="$str1 $str2"     # connect two strings

    echo $myString

    ```

    Output:Kotlin in 8 Hours


    Explanation: `"$str1 $str2"` connects two strings into one string by using double
    quotes.


    ### String Length

    We can get the length of the string by using `#` symbol.


    ```bash

    #string

    ```


    ### Example 2.4


    ```bash

    #! /bin/sh

    str="jQuery in 8 Hours"

    echo ${#str} # get the length of the string

    ```

    Output:17


    Explanation: `#str` can get the length of the string. The string length is 17
    characters and spaces.


    ### Extract Substring

    We can extract a substring from a string.


    ```bash

    string : start : length

    ```

    `start`: the extraction starts at this index.

    `length`: the extraction size


    ### Example 2.5


    ```bash

    #! /bin/sh

    str="DjanGo in 8 Hours"

    echo ${str:4:16 } # extract the substring

    ```

    Output:Go in 8 Hours


    Explanation: `str:4:16` extracts a substring starting at the index 4, the extracting
    length is 16.


    ### About `expr…`

    `expr` is an expression, which is used for calculation.


    ```bash

    ` expr…`

    ```

    Note: ` ` is a back quote, rather than a single quote. The ` key is on the most
    left side of the keyboard.


    ### Example 2.6


    ```bash

    #! /bin/sh

    x=100

    y=200

    z=`expr $x + $y` # an expression

    echo "The sum is $z"

    ```

    Output:The sum is 300


    Explanation: `expr $x + $y` is an expression, the calculated result will be assigned
    to the `z`.

    Note: ` ` is a back quote, rather than a single quote. The ` key is on the most
    left side of the keyboard.


    ### Search Index

    We can find the index of the first occurrence of a character in a string.


    ```bash

    ` expr index "string" character`

    ```

    Note: ` ` is a back quote, rather than a single quote.

    `index` is a parameter, for searching the index of a character. `character` is
    a parameter, indicating the character you specify.


    ### Example 2.7


    ```bash

    str="Kotlin in 8 Hours"

    echo `expr index "$str" n`

    ```

    Output:6


    Explanation: `expr index "$str" n` finds the index of the first occurrence of
    the “n” character in the string.

    Note: ` ` is a back quote, rather than a single quote.


    ### Shell Parameters

    We can pass parameters to a Shell script as it executes.

    The syntax of the parameter is as follows:


    ```bash

    $n

    ```

    `n` represents a number. `$0` represents the file name. `$1` represents the first
    parameter. `$2` represents the second parameter. `$3` represents the third parameter.


    ### Example 2.8


    ```bash

    #! /bin/bash

    echo "My file name is:$0 "

    echo "$1 in 8 Hours"

    echo "$2 in 8 Hours"

    echo "$3 in 8 Hours";

    ```

