  trans: "\n\n将文件保存为 `OK.sh`。使用以下命令运行文件：\n```bash\nbash OK.sh C# GO VB\n```\n**输出：**\n\
    `My file name is: OK.sh`\nC# in 8 Hours\nGO in 8 Hours\nVB in 8 Hours\n![](img/image_rsrc40F.jpg)\n\
    \n**解释：**\n`bash OK.sh C# GO VB` 运行文件 `OK.sh`，并向 Shell 脚本传递四个参数。\n零参数 `OK.sh`\
    \ 传递给 `$0`。\n第一个参数 `C#` 传递给 `$1`。\n第二个参数 `GO` 传递给 `$2`。\n第三个参数 `VB` 传递给 `$3`。\n\
    \n### 内置参数\nShell 中的内置参数如下：\n\n| 参数 | 描述 |\n| :--- | :--- |\n| `$0` | 返回文件名 |\n\
    | `$#` | 返回参数总数 |\n| `$*` | 返回用户的所有的所有 |\n| `$@` | 返回用户输入的所有参数 |\n| `$$` | 返回脚本的当前进程\
    \ ID |\n| `$!` | 返回脚本的最后一个进程 ID |\n| `$?` | 返回 0 表示运行成功 |\n\n#### 示例 2.9\n```bash\n\
    #!/bin/bash\necho \"My file name is: $0 \";\necho \"The total of the parameter\
    \ is:$# \";\necho \"All parameter input by the user is:$* \";\necho \"The running\
    \ result is:$? \";\n```\n\n将文件保存为 `yes.sh`。使用以下命令运行文件：\n```bash\nbash yes.sh R\
    \ in 8 Hours\n```\n**输出：**\n`My file name is: yes.sh`\n`The total of the parameter\
    \ is: 4`\n`All parameter input by the user is: R in 8 Hours`\n`The running result\
    \ is: 0`\n![](img/image_rsrc40G.jpg)\n\n**解释：**\n`bash yes.sh R in 8 Hours` 运行文件\
    \ `yes.sh`，并向 Shell 脚本传递四个参数。\n`$#`: 返回参数总数。\n`$*`: 返回用户输入的所有参数。\n`$?`: 返回 0 表示脚本运行成功，返回其他数字表示脚本运行失败。\n\
    \n## 第 3 小\n### Shell 数组\n数组是一种特殊的变量，可以同时包含一个或多个值。Bash 支持一维数组，不支持多维数组，并且不限制数组的大小。\n\
    \n#### 1. 创建数组的语法：\n| `array_name = (value0 value1 value2...)` |\n\n**示例：**\n\
    ```bash\nmyArray=(100 101 102 103)\n```\n**解释：**\n上述代码创建了一个数组，数组名为 `myArray`，它有四个元素，索引为\
    \ 0, 1, 2, 3，其值为 100, 101, 102, 103。注意索引从 0 开始。\n\n#### 2. 创建数组的另一种语法：\n| `array_name[0]=value0\
    \ array_name[1]=value1 array_name[2]=value2` |\n\n**示例：**\n```bash\ncolor[0] =\
    \ \"red\";\ncolor[1] = \"blue\";\ncolor[2] = \"green\";\n```\n**解释：**\n上述代码创建了一个数组，数组名为\
    \ `color`，它有三个元素：`color[0]`、`color[1]`、`color[2]`。它的索引是 0, 1 和 2。其值是 red, blue\
    \ 和 green。注意索引从 0 开始。\n\n### 访问元素\n访问数组元素的语法如下：\n| `${array_name[index]}` |\n\n\
    #### 示例 3.1\n```bash\n#!/bin/bash\nmy_array=(Rust in 8 Hours)     # 创建数组\necho\
    \ \"The first element is: ${my_array[0]} \"\necho \"The second element is: ${my_array[1]}\
    \ \"\necho \"The third element is: ${my_array[2]} \"\necho \"The fourth element\
    \ is: ${my_array[3]} \"\n```\n**输出：**\n`The first element is: Rust`\n`The second\
    \ element is: in`\n`The third element is: 8`\n`The fourth element is: Hours`\n\
    \n**解释：**\n`my_array=(Rust in 8 Hours)` 创建了一个数组。\n`${my_array[0]}` 访问索引为 0 的元素。\n\
    `${my_array[1]}` 访问索引为 1 的元素。\n`${my_array[2]}` 访问索引为 2 的元素。\n`${my_array[3]}`\
    \ 访问索引为 3 的元素。\n`my_array[0]` 的值是：Rust。\n`my_array[1]` 的值是：in。\n`my_array[2]`\
    \ 的值是：8。\n`my_array[3]` 的值是：Hours。\n\n### 获取所有元素\n`array_name[@]` 或 `array_name[*]`\
    \ 可以获取数组的所有元素。\n| `array_name[@]` 或 `array_name[*]` |\n\n**示例 3.2：**\n```bash\n\
    #!/bin/bash\nmy_array[0]=Java\nmy_array[1]=Ruby\nmy_array[2]=Html\nmy_array[3]=Rust\n\
    echo \"All elements are: ${my_array[@]}\"\necho \"All elements are: ${my_array[*]}\"\
    \n```\n**输出：**\n`All elements are: Java Ruby Html Rust`\n`All elements are: Java\
    \ Ruby Html Rust`\n**解释：**\n`array_name[@]` 或 `array_name[*]` 可以获取数组的所有元素。\n\n\
    ### 数组长度\n`#array_name[@]` 或 `#array_name[*]` 可以获取数组的长度。\n| `#array_name[@]` 或\
    \ `#array_name[*]` |\n\n**示例 3.3：**\n```bash\n#!/bin/bash\nmy_array=(PHP in 8\
    \ Hours)\nlength1=${#my_array[@]}\nlength2=${#my_array[*]}\necho $length1\necho\
    \ $length2\n```\n**输出：**\n`4`\n`4`\n**解释：**\n`#my_array[@]` 或 `#my_array[*]` 可以获取数组的长度。\n\
    \n### Print 命令\n`printf` 是一个在 Shell 中格式化输出的命令。\n\n| 类型 | 描述 |\n| :--- | :--- |\n\
    | `%b` | 输出二进制值 |\n| `%d` | 输出整数值 |\n| `%f` | 输出浮点数值 |\n| `%o` | 输出八进制值 |\n| `%s`\
    \ | 输出字符串值 |\n| `%x` | 输出十六进制值 |\n\n例如：\n`%10s` 表示格式化为宽度为 10 个字符的字符串（`-` 表示左对齐，无表示右对齐）。\n\
    `%8.2f` 表示格式化为浮点数，8 位，2 位小数。\n\n#### 示例 3.4\n```bash\nprintf \"%-10s%-7s %8s\\\
    n\" Name Age\n```\n**输出：**\n`Name      Age     Weight`\n**解释：**\n`%-10s` 被替换为\
    \ `Name`，`Name` 格式化为 10 个字符的字符串，左对齐。\n`%-7s` 被替换为 `Age`，`Age` 格式化为 7 个字符的字符串，左对齐。\n\
    `%-8s` 被替换为 `Weight`，`Weight` 格式化为 8 个字符的字符串，左对齐。\n`\\n` 用于换行。\n\n#### 示例 3.5\n\
    ```bash\n#!/bin/bash\nprintf \"%-10s%-7s %8s\\n\" Name Age\nprintf \"%-10s%-7d\
    \ %5.2f\\n\" Andy 18 91.8843\nprintf \"%-10s%-7d %5.2f\\n\" Tomy 19 95.4675\n\
    printf \"%-10s%-7d %5.2f\\n\" Rosy 17 80.8563\n```\n**输出：**\n`Name      Age  \
    \   Weight`\n`Andy      18      91.88`\n`Tomy      19      95.47`\n`Rosy     \
    \ 17      80.86`\n**解释：**\n`printf \"%-10s%-7d %5.2f\\n\" Andy 18 91.8843` 格式化三个参数\
    \ `Andy`、`18`、`91.8843`。\n`%-10s` 被替换为 `Andy`，`Andy` 格式化为 10 个字符的字符串，左对齐。\n`%-7d`\
    \ 被替换为 `18`，`18` 格式化为最多 7 位的数字类型，左对齐。\n`%-5.2f` 被替换为 `91.88`，`91.88` 格式化为浮点类型，最多\
    \ 5 位，2 位小数，左对齐。\n`\\n` 用于换行。\n\n### 转义序列\n`\\` 反斜杠字符用于转义字符。\n`\\a` 输出警报。\n`\\\
    n` 将内容输出到新行。\n`\\r` 产生回车。\n`\\t` 产生制表符。\n`\\f` 输出内容到下一页。\n`\\'` 输出单引号。\n`\\\"\
    ` 输出双引号。\n\n#### 示例 3.6\n```bash\n#!/bin/bash\nprintf \"%s %s \\'%s\\' \\n\" He\
    \ said OK\nprintf \"%d\\t %d\\n\" 10 100\nprintf \"%s\\n %s %d %s\\n\" \"C# in\
    \ 8 Hours\"\n```\n**输出：**\n`He said 'OK'`\n`10      100`\n`C# in 8 Hours`\n**解释：**\n\
    `\\'%s\\'` 输出单引号和格式化字符串。\n`%d\\t` 输出两个数字之间的制表符空格。\n`%s\\n` 在下一行输出字符串。\n\n## 第\
    \ 4 小\n### 运算符\nShell 与其他语言一样支持多种运算符，包括：算术运算符、关系运算符、逻辑运算符、字符串运算符、文件运算符。\n\n`expr...`\n\
    `expr...` 是一个表达式求值工具。`` `` 键是反引号，而不是单引号。\n\n#### 示例 4.1\n```bash\n#!/bin/bash\n\
    sum=`expr 100 + 200`\necho \"The sum is: $sum\"\n```\n**输出：**\n`The sum is: 300`\n\
    **解释：**\n`` `` 键是反引号，而不是单引号。\n整个表达式必须包含在反引号内。\n表达式和运算符之间必须有空格。例如，`10+20` 是错误的，`10\
    \ + 20` 是正确的。\n\n`if...then...else...fi`\n`if` 语句在条件为真时执行代码 1，在条件为假时执行代码 2。\n\n\
