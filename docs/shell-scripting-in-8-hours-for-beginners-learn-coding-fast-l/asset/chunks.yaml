    本书介绍了 Bash (Bourne Again Shell)。Bash 是大多数 Linux 上的上的默认 Shell。


    # 第一个 Shell 脚本


    ### 示例 1.1


    1. 使用 `vi` 命令打开 Vi 文本编辑器。


    ![](img/image_rsrc40C.jpg)


    2. 按 `i` 键进入插入模式（Insert Mode）。


    3. 在 Vi 编辑器中输入以下代码：


    ```bash

    #! /bin/bash

    echo "Hello World ! "

    ```


    ![](img/image_rsrc40D.jpg)


    4. 按 `Esc` 键退出插入模式。


    5. 输入 `:wq study.sh` 保存文件。文件名为 `study.sh`，扩展名为 `.sh`。


    6. 使用以下命令运行此 Shell 程序：


    ```bash

    bash study.sh

    ```

    输出:Hello World!![](img/image_rsrc40E.jpg)


    解释：

    - `vi` 是一个打开 Vi 编辑器的命令。

    - `i` 键用于进入 Vi 编辑器的插入模式。插入模式可用于编写和编辑 Shell 脚本。

    - `#! /bin/bash` 告诉 Shell 系统使用 Bash 来解释脚本。

    - `echo "Hello World ! "` 显示内容 `Hello World! `。

    - `Esc` 键用于退出 Vi 编辑器的插入模式。

    - `:wq file_name` 保存 Shell 文件并退出 Vi。

    - `bash study.sh` 执行 Shell 文件 `study.sh`。

    - `bash myFile.sh` 执行 Shell 文件 `myFile.sh`。


    ### Shell 注释


    ```bash

    #

    ```

    `#` 符号用于 Shell 注释。Shell 解释器始终忽略 Shell 注释。


    ### 示例 1.2


    ```bash

    #! /bin/bash

    echo "Hello World! "     # 输出 Hello World!

    echo "Hi, Friends! "      # 输出 Hi, Friends!

    ```

    输出：

    Hello World!

    Hi, Friends!


    解释：

    - `# output Hello World ! ` 是 Shell 脚本的注释。

    - `# output Hi, Friends ! ` 是 Shell 脚本的注释。


    ### 多行注释


    ```bash

    : <<EOF

    comment 1

    comment 2

    comment 3...

    EOF

    ```

    `: <<EOF……EOF` 用于多行注释。


    ### 示例 1.3


    ```bash

    #! /bin/bash

    echo "Hello World! "

    :<<EOF

    这是一个 "Hello World" 程序。

    这是一个 Shell 脚本。

    这是一个多行注释的示例.......

    EOF

    echo "This is a sample of multi-line comment. "

    ```

    输出：

    Hello World!

    This is a sample of multi-line comment.


    解释：

    `: <<EOF……EOF ` 用于多行注释。


    # Shell 变量


    1. 定义变量的语法如下：


    ```bash

    var="value"

    ```

    注意：等号前后不能有空格！


    2. 要使用变量，需要在变量名前前使用 `$`。


    ```bash

    $var

    ```


    ### 示例 1.4


    ```bash

    #! /bin/bash

    book="Scala in 8 Hours"     # 定义变量

    echo $book                # 使用变量

    ```

    输出：Scala in 8 Hours


    解释：定义变量时，请确保等号前后没有空格。


    ### 变量名

    变量名的规则如下：

    - 变量名只能使用英文字母、数字和下划线。

    - 变量名的第一个字符不能是数字开头。

    - 变量名中间不能有空格。

    - 变量名不能包含标点符号。

    - Bash 不能作为变量名。


    **有效变量名：** `_myVariable`, `myVariable001`, `my_Varialbe`

    **无效变量名：** `001Variable`, `echomy`, `*Varialbe`


    ### 只读变量

    `readonly` 命令可以将变量定义为只读变量，其值无法更改。


    ```bash

    readonly variable

    ```


    ### 示例 1.5


    ```bash

    #! /bin/bash

    myVar="C# in 8 Hours"

    readonly myVar

    myVar="Scala in 8 Hours"     # 修改变量值

    ```

    输出：

    （ 如下错误消息： ）

    `test. sh: line 4: myVar: readonly variable`


    解释：`readonly myVar` 将 `myVar` 设置为只读。输出为错误消息。`myVar` 变成只读变量后，对 `myVar` 值的任何更改都会导致错误。


    ### 删除变量

    `unset` 命令可以删除变量。


    ```bash

    unset variable

    ```


    ### 示例 1.6


    ```bash

    #! /bin/sh

    myVar="C++ in 8 Hours"

    unset myVar     # 变量

    echo $myVar

    ```

    输出：（无）


    解释：变量被删除后，该变量不再存在，其值也不再存在。因此你看不到任何输出。


    ### 变量输入

    变量的值可以从用户的键盘输入。


    ```bash

    read variable

    ```


    ### 示例 1.7


    ```bash

    #! /bin/sh

    echo "Please input your name. "

    read myInput          # 输入值将存储在 myInput 中

    echo "Hi! Your name is: $myInput" # 假设我输入我的名字：Ray Yao

    ```

    输出：

    Please input your name.

    Ray Yao

    Hi! Your name is Ray Yao


    解释：假设我输入了我的名字：Ray Yao。`read myInput` 将输入值存储到 `myInput`。`echo "Hi! Your name is:
    $myInput"` 显示输入值。


    # 第 2 小时


    ## Shell 字符串 (1)

    字符串包含在单引号中。


    ```bash

    str=''This is a string''

    ```

    - 单引号内的任何字符将以其原始格式打印。

    - 单引号内的字符串变量是无效的。


    ### 示例 2.1


    ```bash

    #! /bin/sh

    var=Andy

    str=''Hello, $var''         # 单引号字符串

    echo $str

    ```

    输出：Hello, $var


    解释：`''Hello, $var''` 是单引号字符串。单引号内的任何字符将以其原始格式打印。


    ### Shell 字符串 (2)

    字符串包含在双引号中。


    ```bash

    str="This is a string"

    ```

    - 双引号内的任何字符将按其返回的值打印。

    - 双引号内的字符串变量是有效的。


    ### 示例 2.2


    ```bash

    #! /bin/sh

    var=Andy

    str="Hello, $ "         # 双引号字符串

    echo $str

    ```

    输出：Hello, $


    （此处更正示例 2.2 应为）

    ```bash

    #! /bin/sh

    var=Andy

    str="Hello, $var"         # 双引号字符串

    echo $str

    ```

    输出：Hello, Andy


    解释：`"Hello, $var"` 是双引号字符串。双引号内的字符串变量将按其返回的值打印。


    ### 连接字符串

    我们可以使用双引号连接字符串。


    ### 示例 2.3


    ```bash

    #! /bin/sh

    str1="Kotlin"

    str2="in 8 Hours"

    myString="$str1str2"

    echo $myString

    ```

    输出：Kotlin in 8 Hours


    解释：`"$str1str2"` 连接了字符串。


    ### 字符串长度

    我们通过 `#` 获取字符串的长度。


    ### 示例 2.4


    ```bash

    #! /bin/sh

    str="jQuery in 8 Hours"

    echo ${#str} # 获取长度

    ```

    输出：17


    解释：`${str}` 获取字符串长度。


    ### 截取子字符串

    我们可以从字符串中截取子字符串。


    ### 示例 2.5


    ```bash

    #! /bin/sh

    str="Django in 8 Hours"

    echo ${str:4:16} # 截取

    ```

    输出：go in 8 Hours


    解释：`${str:4:16}` 从索引 4 开始截取 16 个字符。


    ### 关于 `expr…`

    `expr` 是一个表达式，用于计算。


    ### 示例 2.6


    ```bash

    #! /bin/sh

    x=100

    y=200

    z=`expr $x + $y` # 表达式

    echo "The sum is $z"

    ```

    输出：The sum is 300


    解释：`expr $x + $y` 是一个表达式，计算结果赋值给 `z`。


    ### 索引

    我们可以查找字符串中字符首次出现的索引。


    ### 示例 2.7


    ```bash

    str="Kotlin in 8 Hours"

    echo `expr index "$str" n`

    ```

    输出：6


    解释：`expr index "$str" n` 找到字符串中字符“n”首次出现的索引。


    ### Shell 参数

    我们可以在执行时向 Shell 脚本传递参数。

    参数的语法如下：


    ```bash

    $n

    ```

    `n` 代表数字。`$0` 代表文件名。`$1` 代表第一个参数。`$2` 代表第二个参数。`$3` 代表第三个参数。


    ### 示例 2.8


    ```bash

    #! /bin/bash

    echo "My file name is:$0 "

    echo "$1 in 8 Hours"

    echo "$2 in 8 Hours"

    echo "$3 in 8 Hours";

    ```


