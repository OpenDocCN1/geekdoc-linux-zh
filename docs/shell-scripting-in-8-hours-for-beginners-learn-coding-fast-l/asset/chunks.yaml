  trans: "\n\n输出: 0123\n解释：`until [ $n -ge 4 ]` 当 `$n` 等于 4 时将退出循环。\n\n## Case 语句\n\
    `case statement` 是一个多选择命令。`case statement` 将一个值与模式进行匹配。如果匹配成功，则执行对应的命令。\n\n```bash\n\
    case value in\n  pattern1) code1;;      # 注意使用 ) 和 ;;\n  pattern2) code2;;\n \
    \ pattern3) code3;;\n  pattern*) code4;;      # 当没有匹配到任何项时，运行此项\nesac\n```\n\n\
    ### 示例 7.7\n```bash\n#! /bin/bash\necho 'Please input a number between 1 to 4:\
    \ '\nread num\ncase $num in\n  1)  echo 'You have input 1';;\n  2) echo 'You have\
    \ input 2';;\n  3)  echo 'You have input 3';;\n  4)  echo 'You have input 4';;\n\
    \  *) echo 'Your number is not between 1 to 4';;\nesac\n```\n\n# 假设我们输入数字 2\n\
    输出:\nPlease input a number between 1 to 4:\n2\nYou have input 2\n解释：假设我们输入了数字\
    \ 2，它匹配了第二个 case，因此执行了第二个代码。\n\n## Break 命令\n`break` 关键字用于根据条件停止循环的运行。\n\n```bash\n\
    break\n```\n\n### 示例 7.8\n```bash\n#! /bin/bash\nnum=0\nwhile(( $num<=8))\ndo\n\
    \  if [ $num == 3 ]\n  then\n    break      # 退出 while 循环\n  fi\n  num=`expr $num\
    \ + 1`\n  echo $num\ndone\n```\n\n输出: 123\n解释：如果 `$num` 为 3，程序将运行 `break` 命令并退出循环。\n\
    \n## Continue 命令\n`continue` 用于停止当前迭代，忽略后续代码，然后继续下一次循环。\n\n```bash\ncontinue\n\
    ```\n\n### 示例 7.9\n```bash\n#! /bin/sh\nnums=\"1 2 3 4 5 \"\nfor n in $nums\n\
    do\n  if [ $n -eq 3 ]\n  then\n    continue      # 执行下一次 for loop\n  fi\n  echo\
    \ $n\ndone\n```\n\n输出: 1245\n解释：注意：输出中没有数字 3。如果 `$n = 3`，程序将运行 `continue` 命令，忽略下一个命令\
    \ `echo $n`，然后执行下一次 `for loop`。\n\n## 第 8 章 Select 语句\n`Select` 语句允许用户选择一个符合条件的项并运行相关代码。`Select`\
    \ 语句通常与 `Case` 语句配合使用。\n\n```bash\nselect var in item1 item2 item3...\ndo\n  case\
    \ statement\n    ...\n  esac\ndone\n```\n\n### 示例 8.1\n```bash\n#! /bin/bash\n\
    echo \"Please input a number between 1 to 4. \"\necho \"If you input 4, the program\
    \ will exit. \"\nselect choice in 1 2 3 4 ;      # 选择一个数字\ndo\n  case $choice\
    \ in\n  1)  echo \"You choose 1\";;\n      2)  echo \"You choose 2\";;\n     \
    \ 3)  echo \"You choose 3\";;\n      4)  echo \"You choose 4 to exit\"; break;;\n\
    \      *)  echo \"Enter error! \"; break;;\n  esac\ndone\n```\n\n输出:\nPlease input\
    \ a number between 1 to 4.\nIf you input 4, the program will exit.\n1) 1\n2) 2\n\
    3) 3\n4) 4\n#? 2\nYou choose 2\n#? 4\nYou choose 4 to exit\n解释：假设我们第一次输入 2，第二次输入\
    \ 4。`select choice in 1 2 3 4 ;` 选择 4 个数字之一。`Select` 语句通常与 `Case` 语句配合使用。`#?`\
    \ 是输入提示，你可以输入一个数字。\n\n## I/O 重定向\nLinux Shell 系统命令从终端获取输入并将结果输出传回终端。命令通常从标准输入读取数据并写入标准输出数据。重定向命令如下：\n\
    \n| 命令 | 描述 |\n| :--- | :--- |\n| `command > file` | 将输出重定向到文件。 |\n| `command\
    \ < file` | 将输入重定向到文件。 |\n| `command >> file` | 将输出追加到文件。 |\n| `n > file` | 将\
    \ `File n` 重定向到文件 |\n| `n >> file` | 将 `File n` 追加到文件 |\n| `n >& m` | 合并输出文件 `m`\
    \ 和 `File n` |\n| `n <& m` | 合并输入文件 `m` 和 `File n` |\n| `<< tag` | 将标签之间的内容作为输入。\
    \ |\n\n`File n`、`File m` 表示文件描述符 0、1 或 2 的文件。`0` 表示标准输入 (STDIN)。`1` 表示标准输出 (STDOUT)。`2`\
    \ 表示标准错误 (STDERR)。\n\n### 输出重定向\n输出重定向：执行命令并使用 `>` 将输出存储到文件中。\n\n```bash\ncommand\
    \ > file\n```\n\n### 示例 8.2\n```bash\necho \"Hello\" > file\n```\n解释：使用 `>` 将输出重定向到文件。\n\
    \n### 追加重定向\n如果你不想覆盖文件，使用 `>>` 将内容追加到文件。\n\n```bash\necho \"World\" >> file\n\
    ```\n\n### 示例 8.3\n```bash\necho \"Good!\" >> file\n```\n解释：使用 `>>` 将内容追加到文件。\n\
    \n## 输入重定向\n输入重定向：使用 `<` 从文件获取输入。\n\n```bash\ncommand < file\n```\n\n### 示例 8.4\n\
    ```bash\nwc < file\n```\n输出: 2 7 25\n解释：使用 `<` 从文件获取输入。`wc` 统计行、单词和字符。\n\n## Here\
    \ Document (在此文档)\n使用 `<<` 将标签之间的内容作为输入。\n\n```bash\ncommand << tag\n```\n\n###\
    \ 示例 8.5\n```bash\n#! /bin/bash\ncat << DOC\n...\nDOC\n```\n解释：`<<` 定义了在此文档。`cat`\
    \ 显示文件内容。\n\n### 示例 8.6\n```bash\n#! /bin/bash\nwc << EOF\n...\nEOF\n```\n输出:\
    \ 3 13 68\n解释：`<< EOF` 定义了在此文档。`wc` 统计行、单词和字符。\n\n## 重定向逻辑\n`<<` 运算符必须位于最左侧，前面没有字符。\n\
    \n```bash\ncommand << EOF\n```\n`<<` 将文档重定向到命令。`EOF` 是分隔符。你可以指定其他字符作为分隔符。\n\n\
    ## 文件引入\nShell 可以外部脚本引入当前文件。\n\n```bash\nsource ./external_file\n```\n`./` 定位外部文件。\n\
    \n### 示例 8.7\n```bash\n#! /bin/bash\nurl = \"www.amazon.com/author/ray-yao\"\n\
    ```\n\n### 示例 8.8\n```bash\n#! /bin/bash\nsource ./file1.sh\necho \"The website\
    \ of Ray Yao is:$url\"\n```\n解释：`source ./file1.sh` 引入了外部文件 `file1.sh`。在文件中定义了变量。\n\
    \n## 附录 1 Shell 脚本表\n### 内置参数表\nShell 中的内置参数如下：\n\n| 参数 | 描述 |\n| :--- | :---\
    \ |\n| `$0` | 返回文件名 |\n| `$#` | 返回参数的总数 |\n| `$*` | 返回用户输入的所有参数 |\n| `$@` | 返回用户输入的所有参数\
    \ |\n| `$$` | 返回脚本的当前进程 ID |\n| `$!` | 返回上一个命令的进程 ID |\n| `$?` | 返回 0 表示执行成功 |\n\
    \n### printf 命令表\n`printf` 是一个在 Shell 中用于格式化输出的命令。\n\n"
- fmt: "\n# printf \"type\" variables\n\n`\"type\"` is a parameter used to format\
    \ the output.\n\n| Type | Description |\n| :--- | :--- |\n| `%b` | Print it as\
    \ a binary value |\n| `%d` | Print it as a digital value |\n| `%f` | Print it\
    \ as a float-point value |\n| `%o` | Print it as an octal value |\n| `%s` | Print\
    \ it as a string value |\n| `%x` | Print it as a hexadecimal value |\n\n## Escape\
    \ Sequences Chart\nThe `\\` backslash character can be used to escape characters.\n\
    \n`\\a` outputs an alert; `\\n` outputs the content to the next new line; `\\\
    r` makes a return; `\\t` makes a tab; `\\f` outputs the content to the next page;\\\
    '` outputs a single quotation mark;\\\"` outputs a double quotation mark.\n\n\
    ## Comparison Operators Chart\nLinux Shell has comparison operators as follows:\n\
    \n| Operators | Checks |\n| :--- | :--- |\n| `-eq` | equal |\n| `-ne` | not equal\
    \ |\n| `-gt` | greater than |\n| `-ge` | greater or equal |\n| `-lt` | less than\
    \ |\n| `-le` | less or equal |\n\nThe comparison expression returns true or false.\n\
    \n## Boolean Operators Chart\n\n| Operators |\n| :--- |\n| `-a` |\n| `-o` |\n\
    | `!` |\n\nAfter using logical operators, the result will be true or false.\n\n\
    - `true -a true;` returns true;\n- `true -a false;` returns false;\n- `false -a\
    \ false;` returns false;\n- `true -o true;` returns true;\n- `true -o false;`\
    \ returns true;\n- `false -o false;` return false;\n- `! false;` returns true;\n\
    - `! true;` returns false;\n\n## String Operators Chart\n\n| Operators | Checks\
    \ |\n| :--- | :--- |\n| `=` | If two strings are equal, returns true . |\n| `!=`\
    \ | If two strings are not equal, returns true . |\n| `-z` | If the length of\
    \ a string is equal to zero, returns true . |\n| `-n` | If the length of a string\
    \ is not equal to zero, returns true |\n| `$` | If the string is not empty, returns\
    \ true . |\n\n## File Operators Chart\nFile operators are used to detect various\
    \ properties of Linux files.\n\n| Operator | Checks |\n| :--- | :--- |\n| `-d\
    \ file` | If the object is a directory, return true |\n| `-f file` | If the object\
    \ is a file, return true |\n| `-p file` | If the object is a pipe, return true\
    \ |\n| `-r file` | If the object is a readable file, return true . |\n| `-w file`\
    \ | If the object is a writable file, return true |\n| `-x file` | If the object\
    \ is an executable file, return true |\n| `-e file` | If the object is an empty\
    \ file, return true |\n| `-s file` | If the object isn’t an empty file, return\
    \ true |\n| `-b file` | If the object is a block device file, return true |\n\
    | `-c file` | If the object is a character device file, return true |\n\n## I/O\
    \ Redirection Chart\nLinux Shell system commands take input from your terminal\
    \ and send the resulting output back to your terminal. A command usually reads\
    \ data from standard input, and writes data to standard output. The commands of\
    \ the redirection are as follows:\n\n| Commands | Descriptions |\n| :--- | :---\
    \ |\n| `command > file` | redirect output to the file. |\n| `command < file` |\
    \ redirect input to the file. |\n| `command >> file` | append output to the file.\
    \ |\n| `n > file` | redirect File `n` to the file |\n| `n >> file` | append File\
    \ `n` to the file |\n| `n >& m` | combine the output file `m` and File `n` |\n\
    | `n <& m` | combine the input file `m` and File `n` |\n| `<< tag` | take the\
    \ content between tags as input. |\n\n## Appendix 2 Exercises\n\n### Questions\n\
    Please choose the correct answer.\n\n(01) fill in `# fill in characters as a multi-line\
    \ comment`\n```\ncomment 1\ncomment 2\ncomment 3...\nEOF\n```\nA. EOF\nB. #EOF\n\
    C. <<EOF\nD. : <<EOF\n\n(02)\n```bash\n#! /bin/sh\nstr1=\"Kotlin\"\nstr2=\"in\
    \ 8 Hours\"\nmyString=\"$str1 fill in $str2\" # connect two strings\necho $myString\n\
    ```\nA. +\nB. −\nC. nothing\nD. concat\n\n(03) The syntax to access the elements\
    \ of an array is fill in `?`\n1. `$(array_name[index])`\n2. `${array_name[index]}`\n\
    3. `array_name(index)`\n4. `array_name{index}`\n\n(04)\n```bash\n#! /bin/bash\n\
    sum= fill in expr 100 + 200 fill in\necho \"The sum is: $sum\"\n```\nA. double\
    \ quotes\nB. single quotes\nC. back quotes\nD. nothing\n\n(05) Parameter `-s file`\
    \ checks fill in `?`\nA. If the object isn’t an empty file, return true.\nB. If\
    \ the object is an empty file, return true.\nC. If the object is a block device\
    \ file, return true.\nD. If the object is a character device file, return true.\n\
    \n(06)\n```bash\n#! /bin/bash\nif test fill in /root/myFile.sh # checks myFile\
    \ if exist\nthen\n  echo 'The file exists! '\nelse\n  echo ' The file doesn't\
    \ exist! '\nfi\n```\nA. –o\nB. –e\nC. –n\nD. –s\n\n(07) `if fill in condition\
    \ fill in then` code1 `else` code2 `fi`\nA. ( )\nB. { }\nC. [ ]\nD. nothing\n\n\
    (08) `# redirects the output to myFile`\n```bash\necho \"R in 8 Hours\" fill in\
    \ myFile\n```\nA. ->\nB. >\nC. in\nD. to\n\n(09)\n```bash\n#! /bin/sh\necho \"\
    Please input your name. \"\nfill in myInput # the input value will be stored in\
    \ myInput\necho \"Hi! Your name is: $myInput\"\n```\nA. input\nB. var\nC. $myInput=\n\
    D. read\n\n(10)\n```bash\n#! /bin/sh\nstr=\"jQuery in 8 Hours\"\necho fill in\
    \ # get the length of the string\n```\nA. str.length()\nB. length(str)\nC. ${#str}\n\
    D. $[#str]\n\n(11) fill in can get all elements of an array.\n1. `array_name[@]`\n\
    2. `array_name[#]`\n3. `array_name[%]`\n4. `array_name[&]`\n\n(12)\n| Operators\
    \ | Running |\n| :--- | :--- |\n| + | add |\n| - | subtract |\n| fill in | multiply\
    \ |\n| / | divide |\nA. *\nB. \\*\nC. X\nD. \\x\n\n(13)\n```bash\n#! /bin/sh\n\
    echo fill in \"Go \\c \" # turn on escape\necho \"in 8 Hours\"\n```\nA. –a\nB.\
    \ –o\nC. –s\nD. –e\n\n(14)\n```bash\n#! /bin/bash\nif test fill in \"$myString\"\
    \ # checks empty\nthen\n  echo \"It's not empty string.\"\nelse\n  echo \"It's\
    \ an empty string.\"\nfi\n```\nA. –o\nB. –e\nC. –n\nD. –s\n\n(15) `until` loops\
    \ through a block of code if the condition is `fill in`, will quit the loop if\
    \ the condition is `fill in`.\n1. true\n2. true\n3. false\n4. false\n\n(16) If\
    \ you don't want the file to be overwritten, please append the contents to the\
    \ end of the file using `fill in` symbol.\nA. >>\nB. ->\nC. =>\nD. >=\n\n(17)\
    \ | Parameters | Descriptions |\n| :--- | :--- |\n| fill in | Return the file\
    \ name |\n| $# | Return total number of parameters |\n| $* | Return all input\
    \ by the user |\n| $@ | Return all input by the user |\nA. n\nB. $0\nC. f\nD.\
    \ %\n\n(18)\n```bash\n#! /bin/bash\narr=(fill in) # get the length of the array\n\
    ```\nA. arr.length()\nB. length(arr)\nC. ${#arr}\nD. $[#arr]\n\n(19)\n- `true\
    \ -a true;` returns true;\n- `true -a false;` returns false;\n- `false -a false;`\
    \ returns false;\n- `true -o true;` returns true;\n- `true -o false;` returns\
    \ true;\n- `false -o false;` return false;\n\n(20) | Operators | Checks |\n| :---\
    \ | :--- |\n| `-z` | If the length of a string is equal to zero, returns true\
    \ . |\n| `-n` | If the length of a string is not equal to zero, returns true |\n\
    | `fill in` | If the string is not empty, returns true . |\nA. $\nB. &\nC. @\n\
    D. %\n\n(21)\n```bash\n#! /bin/bash\nadd(){\n  x=100\n  y=155\n  z=`expr $x +\
    \ $y`\n  return $z\n}\nadd\necho \"The sum is fill in\" # show the value\n```\n\
    A. $!\nB. $@\nC. $*\nD. $\n\n(22)\n```bash\n#! /bin/bash\necho 'Please input a\
    \ number between 1 to 4:'\nread num\ncase $num in\n  1) echo 'You have input 1'\n\
    \  2) echo 'You have input 2'\n  3) echo 'You have input 3'\n  4) echo 'You have\
    \ input 4'\n  *) echo 'Your number is not between 1 to 4'\nesac\n```\nA. ;\nB.\
    \ ;;\nC. ;;;\nD. ;;;\n\n(23)\n```bash\n#! /bin/bash\nfill in # counts the number\
    \ of lines, word, characters\n```\n1. num << DOC\n2. ls << DOC\n3. wc << EOF\n\
    4. cat << EOF\n\n(24)\n```bash\n#! /bin/bash\nfill in ./file1.sh # include an\
    \ external file \"file1.sh\"\necho \"The website of Ray Yao is:$url\"\n```\nA.\
    \ include\nB. import\nC. resource\nD. source\n\n### Answers\n| 01. D |\n| 02.\
    \ C |\n| 03. B |\n| 04. C |\n| 05. A |\n| 06. B |\n| 07. C |\n| 08. B |\n| 09.\
    \ D |\n| 10. C |\n| 11. A |\n"
