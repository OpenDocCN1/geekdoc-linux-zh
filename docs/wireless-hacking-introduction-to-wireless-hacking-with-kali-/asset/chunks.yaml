    现在第一步在概念上是简单的。你需要的是：你（攻击者）、一个将连接到无线网络的客户端，以及一个无线接入点。发生的是，当客户端和接入点进行通信以验证客户端时，它们会进行一个我们可以捕捉的
    `4 way handshake`（四次握手）。这个握手包含了密码的哈希值。现在，没有直接从哈希中提取密码的方法，因此哈希是一种稳健的保护方法。但我们可以做一件事：我们可以获取所有可能的密码，并将它们转换为哈希。然后我们将创建的哈希与握手中的哈希值进行匹配。如果哈希值匹配，我们就知道是哪个明文密码产生了该哈希，从而我们知道了密码。如果你觉得这个过程听起来非常耗时，那是因为它确实如此。WPA
    破解（以及一般的哈希破解）是一个非常消耗资源且耗时的过程。现在有多种不同的破解 WPA 的方法。但由于破解 WPA 成功率不高，我们应该首先查看捕获握手的过程。我们还将看到在此过程中可能会遇到的问题。此外，在此之前，请查看维基百科上关于
    `4-way handshake` 到底是什么的一些可选理论。


    ## 四次握手


    认证过程留下了两个考虑因素：接入点（`AP`）仍然需要向客户端站（`STA`）验证身份，并且需要导出加密流量的密钥。之前的 EAP 交换或 WPA2-PSK
    提供了共享密钥 `PMK`（成对主密钥）。然而，该密钥旨在持续整个会话，并且尽可能少暴露。因此，使用四次握手建立另一个名为 `PTK`（成对临时密钥）的密钥。`PTK`
    通过拼接以下属性生成：`PMK`、`AP` 随机数 (`ANonce`）、`STA` 随机数 (`SNonce`）、`AP` MAC 地址以及 `STA`
    MAC 地址。然后将产物通过 `PBKDF2-SHA1` 作为加密哈希函数进行处理。


    握手还会产生 `GTK`（组临时密钥），用于解密组播和广播流量。握手期间交换的实际消息如图所示并在下文中解释：


    ![](img/image00038.jpeg)


    1. `AP` 向 `STA` 发送一个随机值（`ANonce`）。现在客户端拥有了构建 `PTK` 的所有属性。

    2. `STA` 向 `AP` 发送自己的随机值（`SNonce`），并连带一个包含认证的 `MIC`，这实际上是一个消息认证和完整性代码：（`MAIC`）。

    3. `AP` 将 `GTK` 和序列号与另一个 `MIC` 一起发送。该序列号将用于下一个组播或广播帧，以便接收的 `STA` 可以执行基本的重放检测。

    4. `STA` 向 `AP` 发送确认。


    上述所有消息都作为 `EAPOL-Key` 帧发送。


    一旦获得 `PTK`，它就会被分为五个独立的密钥：


    `PTK`（成对临时密钥 – 64 字节）


    1. 16 字节的 `EAPOL-Key 确认密钥` (`KCK`) – 用于在 WPA EAPOL Key 消息上计算 `MIC`。

    2. 16 字节的 `EAPOL-Key 加密密钥` (`KEK`) - `AP` 使用此密钥加密发送到客户端的额外数据（在“Key Data'' 字段中，例如
    RSN IE 或 `GTK`）。

    3. 16 字节的 `临时密钥` (`TK`) – 用于加密/解密单播数据包。

    4. 8 字节的 `Michael MIC 认证器 Tx Key` – 用于计算由 `AP` 发送的单播数据包的 `MIC`。

    5. 8 字节的 `Michael MIC 认证器 Rx Key` – 用于计算站发送的单播数据包的 `MIC`。


    握手中提供的 `Michael MIC 认证器 Tx/Rx Keys` 仅在网络使用 `TKIP` 加密数据时才使用。


    顺便说一下，如果你没有太懂其中的内容，不要担心。人们不在维基百科上搜索破解教程是有原因的（一半的内容太深了）。


    ## 捕获握手


    现在有几种捕获握手的方法（此处列出了 2 种）。我们将逐查看。


    1. `Wifite`（简单且自动）

    2. `Airodump-ng`（简单但非自动，你必须手动执行 `wifite` 自动完成的操作）


    ### Wifite


    #### 方法论


    我们先从简单的开始。现在你需要意识到，为了捕获握手，必须有握手正在进行。现在有两种选择：你可以坐在那里等一个新客户端出现并连接到 WPA 网络，或者你可以强制已连接的客户端断开连接，当它们重新连接时，你捕获它们的握手。你的网卡擅长接收数据包，但不擅长创建数据包。现在如果你的客户端离你很远，你的
    `deauth` 请求（即：请离开此连接）将无法到达它们，你将一直奇怪为什么捕不到任何握手（在 ARP 注入和其他类型的攻击中也会遇到类似的问题）。所以，想法是尽可能靠近接入点（路由器）和客户端。`wifite`
    和 `airodump-ng` 方法的方法是相同的，但 `wifite` 为你处理了所有杂事，而在 `airodump-ng` 的情况下，你将需要你的兄弟（`airplay-ng`）来帮忙。


    #### 使用 Wifite 获取握手


    现在我的配置非常简单。我有一个名为 ''me'' 的受 wpa 保护的网络。


    ```

    root@kali:~ wifite

    ```

