    \ Maybe if you are reading this chapter a long time after it was written, then\
    \ you might have the tool preinstalled in Kali. In any case, try this out: \n\n\
    fluxion\n\nI, personally tried to check if linset or fluxion came pre-installed\
    \ in Kali (though I didn't expect them to be there).\n\n**Getting the script**\n\
    \nGetting the script is just a matter of cloning the github repository. Just use\
    \ the git command line tool to do it.\n\n*git clone https://github.com/deltaxflux/fluxion*\n\
    \nIf you have any problems with this step, then you can just navigate to the repository\
    \ and manually download the stuff.\n\n**Running the script**\n\n Just navigate\
    \ to the fluxion directory or the directory containing the scripts in case you\
    \ downloaded them manually. If you are following the terminal commands I'm using,\
    \ then it's just a simple change directory command for you: \n\n*cd fluxion*\n\
    \nNow, run the script.\n\n*sudo ./fluxion*\n\nThere are 4 dependencies that need\
    \ to be installed.\n\n![](Images/image00038.jpeg)**48**\n\n![](Images/image00038.jpeg)Dependencies\n\
    \nIf you have any unmet dependencies, then  run the installer script.\n\nsudo\
    \ ./Installer.sh\n\n I had 4 unmet dependencies, and the installer script run\
    \ was a buggy experience for me (though it might be becuase I have completely\
    \ screwed up my system, editing files I wasn't supposed to and now I can't get\
    \ them back in order) .It got stuck multiple times during the process, and I had\
    \ to ctrl+c my way out of it many times (though ctrl+c didn't terminate the whole\
    \ installer, just the little update popup). Also, I ran the installer script twice\
    \ and that messed up with some of the apt-get settings. I suggest that after installation\
    \ is complete, you restore your /etc/apt/sources.list to it's original state,\
    \ and remove the bleeding edge repositories (unless you know what you're doing).\
    \ \n\n![](Images/image00038.jpeg)\n\nPS: For those trying to use apt-get to install\
    \ the missing stu ff - some of the dependencies aren't available in the default\
    \ Kali repos, so you'll have to let the script do the installation for you, or\
    \ manually add the repos to /etc/apt/sources.list (look at the script to find\
    \ out which repos you need to add):\n\n![](Images/image00046.jpeg)**Fluxion**\n\
    \nOnce again, type the following:\n\n*sudo ./fluxion*\n\nThis time it should run\
    \ just fine, and you would be asked a few very simple questions.\n\n • For the\
    \ wireless adapter, choose whichever one you want to monitor on. For the channels\
    \ question, choose all, unless you have a specific channel in mind, which you\
    \ know has the target AP.\n\n• Then you will see an *airodump-ng window* (named\
    \ Wifi Monitor). Let it run while it looks for APs and clients. Once you think\
    \ you have what you need, use the close button to stop the monitoring.\n\n• You'll\
    \ then be prompted to select target.\n\n• Then you'll be prompted to select attack.\n\
    \n• Then you'll be prompted to provide handshake.\n\n• If you don't have a handshake\
    \ captured already, the script will help you capture one. It will send *deauth*\
    \ packets to achieve that.\n\n• After that, I quit the procedure (I was using\
    \ the script in my college hostel and didn't want to cause any troubles to other\
    \ students).\n\nGetting my wireless network's password by fooling my smartphone\
    \ into connecting to a fake AP"
