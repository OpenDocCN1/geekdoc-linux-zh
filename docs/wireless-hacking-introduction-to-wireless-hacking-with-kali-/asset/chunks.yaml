- fmt: "\n## Rainbow table\n\nThe validation process against the 4-way handshake that\
    \ I mentioned earlier involves hashing of the plaintext password which is then\
    \ compared with the hash in handshake. However, hashing (WPA uses `PBKDF2`) is\
    \ a CPU intensive task and is the limiting factor in the speed at which you can\
    \ test keys (this is the reason why there are so many tools which use `GPU` instead\
    \ of `CPU` to speed up cracking).\n\nNow, a possible solution to this is that\
    \ the person who created the wordlist/dictionary that we are using can also convert\
    \ the plaintext passwords into hashes so that they can be checked directly. Unfortunately,\
    \ WPA-2 uses a salt while hashing, which means that two networks with the same\
    \ password can have different hashing if they use different salts. \n\nHow does\
    \ WPA-2 choose the salt? It uses the network's name (`SSID`) as the salt. So two\
    \ networks with the same `SSID` and the same password would have the same salt.\
    \ So, now the guy who made the wordlist has to create separate hashes for all\
    \ possible `SSID`s.\n\nPractically, what happens is that hashes are generated\
    \ for the most common `SSID`s (the default one when a router is purchases like\
    \ `-linksys`, `netgear`, `belkin`, etc.). If the target network has one of those\
    \ `SSID`s then the cracking time is reduced significantly by using the precomputed\
    \ hashes. This precomputed table of hashes is called `rainbow table`. Note that\
    \ these tables would be significantly larger than the wordlists tables. So, while\
    \ we saved ourselves some time while cracking the password, we had to use a much\
    \ larger file (some are 100s of GBs) instead of a smaller one. This is referred\
    \ to as time-memory tradeoff. This page has rainbow tables for 1000 most common\
    \ `SSIDs`.\n\n## Fool a user into giving you the password\n\nBasically this just\
    \ a combination of Man in the middle attacks and social engineering attacks. More\
    \ specifically, it is a combination of evil twin and phishing. \n\n this attack,\
    \ you first force a client to disconnect from the original `WPA-2` network, then\
    \ force him to connect to a fake open network that you create, and then send him\
    \ a login page in his browser where you ask him to enter the password of the network.\
    \ \n\nYou might be wondering, why do we need to keep the network open and then\
    \ ask for the password in the browser (can't we just create a `WPA-2` network\
    \ and let the user give us the password directly). The answer to this lies in\
    \ the fact that `WPA-2` performs mutual authentication during the 4-way handshake.\
    \ Basically, the client verifies that the `AP` is legit, and knows the password,\
    \ and the `AP` verifies that the client is legit and knows the password (through\
    \ the process, the password is never sent in plaintext). We just don't have the\
    \ information necessary enough to complete the 4-way handshake.\n\n## Bonus: WPS\
    \ vulnerability and reaver\n\nI have covered it in detail separately so not explaining\
    \ it again (I'm only human, and a very lazy one too).\n\n## Tools (Kali)\n\nIn\
    \ this section I'll name some common tools in the wireless hacking category which\
    \ come preinstalled in Kali, along with the purpose they are used for.\n\n###\
    \ 1 Capture packets\n* `airodump-ng`\n* `wireshark` (really versatile tool, there\
    \ are books just covering this tool for packet analysis)\n\n### 2 Crack handshakes\n\
    * `aircrack-ng` (can crack handshakes as well as WEP)\n* `hashcat` (GPU cracking)\n\
    * `cowpatty`\n\n### 3 WPS\n* `reaver`\n* `pixiewps` (performs the \"pixie dust\
    \ attack\")\n\n### 4 Cool tools\n* `aireplay-ng` (WEP mostly)\n* `mdk3` (cool\
    \ stuff)\n\n### 5 Automation\n* `wifite`\n* `fluxion` (actually it isn't a common\
    \ script at all, but since I wrote a tutorial on it, I'm linking it)\n\n# 3. Networking\
    \ Basics: IP address, Netmasks and Subnets\n\n### IP address\n\nAn IP address\
    \ is simply a 32 bit address that every device on any network (which uses `IP/\
    \ TCP` protocol) must have. It is usually expressed in the decimal notation instead\
    \ of binary because it is less tedious to write it that way. For example:\n\n\
    * Decimal notation: `192.168.1.1`\n* Binary: `10000000.10101000.00000001.00000001`\n\
    \nIt is clear from the binary form that the IP is indeed 32 bits. It can range\
    \ from `0.0.0.0` to `255.255.255.255` (for the binary all 0s and all 1s respectively)\
    \ [A lot of time, the first octet usually goes up to 127. However, we aren't concerned\
    \ with that here.]\n\n#### Parts of an IP address\n\nNow this IP address has 2\
    \ parts, the network address and host address. A lot of wireless routers keep\
    \ the first 3 octets (8 bits, hence octets) for the network address and the last\
    \ octet as host address. A very common configuration being `192.168.1.1`. Here,\
    \ `192.168.1.0` is the network address and `0.0.0.1` is host address. I hope you\
    \ can see that the host address can vary from `0.0.0.0` to `0.0.0.255` (though\
    \ usually).\n\n#### Netmasks\n\nNow this IP address has 2 parts, the network address\
    \ and host address. A lot of wireless routers keep the first 3 octets (8 bits,\
    \ hence octets) for the network address and the last octet as host address. A\
    \ very common configuration being `192.168.1.1`. Here, `192.168.1.0` is the network\
    \ address and `0.0.0.1` is host address. I hope you can see that the host address\
    \ can vary from `0.0.0.0` to `0.0.0.255` (though usually).\n"
