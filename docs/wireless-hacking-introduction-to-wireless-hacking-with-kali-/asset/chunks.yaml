    2. **Active method** - You cut off the electric/water supply to the building,
    or maybe somehow trigger the fire alarm. One way or the other, force the members
    to get out of the club. Once they find out that everything is fine, they''ll swarm
    back in. You will know where the gate is. In wireless terms, you can de-authenticate
    the clients (you''ll be doing this often, whether you''re hacking a WEP network,
    or getting a WPA handshake [again, more on this later]). Off course, this method
    results in you leaving behind some traces, but at least you don''t have to wait
    for hours.


    The analogue of hidden entry clubs are hidden networks. As long as the network
    has clients, it''s quite easy to find out the name of the network (`SSID` to be
    precise, setting the network to hidden basically stops the access point from revealing
    it''s SSID). However, when a client connects to the network, beacon frames (date
    packets) with SSID (in clear-text, i.e. unencrypted) are transmitted, which you
    can capture and get the SSID of the network. So, hidden networks don''t really
    offer much protection to a network, and a WEP protected hidden network just means
    that instead of 10 mins it will take 15 mins to get the password. For a WPA network,
    making the SSID hidden doesn''t really do a lot since WPA networks are practically
    uncrackable and a person who has the time and processing power to get past WPA
    encryption won''t be stopped by the hidden SSID.


    **Summary**


    There can be additional authentication steps (logins) or other barriers between
    you and internet even after you get access to the router. However, this is an
    entirely separate problem.


    **Wireless hotspots or open networks don''t have any encryption.** and not too
    relevant to the discussion of wireless hacking. Still it''s something you must
    be aware of:


    - Wireless hotspots or open networks don''t have any encryption. They can be accessed
    by anyone. Also, the data transmitted by you is not encrypted and can be read
    by anyone in the vicinity. Anything which you send to the destination server in
    plain-text (say, to `google`), will be transmitted from your machine to the wireless
    router in plain-text. Anyone in the vicinity can easily read it using `Wireshark`
    or any other similar tool. Of course, sensitive data is rarely sent in plain-text,
    so don''t sit around wireless hotspots hoping to get someone''s FB login credentials.
    However, lack of encryption in open networks should be considered seriously. As
    far as wireless hacking is concerned, not a lot to do here (other than sniffing
    at unencrypted data in the air).


    - `WEP` - This is where most of the stuff happens. Countless vulnerabilities,
    countless attacks, countless research papers listing the issues, countless tools
    to get the passwords. It doesn''t take too much effort to learn how to hack these.
    If you are familiar with `linux`, then it takes practically no efforts at all.
    Just some terminal commands, and you''re done (with `wifite` you don''t even have
    to bother with that).


    - `WPA` - Don''t want to mess with this guy. Theoretically there''s a way to get
    in. Practically it will take forever. Dictionary attacks and bruteforce are the
    methods to get in. Will cover all this in the advanced version of this guide.
    PS: When I say `WPA`, I refer to both `WPA` and `WPA-2`. For the sake of this
    chapter, they are the same.


    **WPA with WPS: not as easy as WEP, but still do-able.**


    - `WPA` with `WPS` - Tough guy with a weak spot. Hit him where it hurts and the
    ''it takes forever to get in'' becomes a matter of hours. Not as easy as `WEP`,
    but still do-able. Unfortunately, you might encounter a guy who has a weak spot
    but has started learning his lessons and guards that spot properly (`WPS` but
    with rate-limiting or some other security measure).


    I hope you now have a general idea about the various flavors of wireless security.
    I have a few advanced guides in mind too, which will touch the cryptographic specifics
    about these ''flavors'', the vulnerabilities, and their exploits. As far as the
    practical hacking process is concerned, there are plenty of tutorials here on
    this website and elsewhere on the internet regarding that, so I am not covering
    that again. I hope that this time when you read a guide you are aware of what''s
    going on, and don''t end up trying an attack that works on `WEP` targets on a
    `WPA` network.


    **Pre-requisites**


    You should know (all this is covered in Wireless Hacking basics):


    - What are the different flavors of wireless networks you''ll encounter and how
    difficult it is to hack each of them.

    - What are hidden networks, and whether they offer a real challenge to a hacker.

    - Have a very rough idea how each of the various ''flavors'' of wireless networks
    is actually hacked.


    **Post-reading**


    You will know:


    - Know even more about different flavors of wireless networks.

    - How to go about hacking any given wireless network.


    **WEP: the main problems were static keys and weak IVs.**


    - Common tools and attacks that are used in wireless hacking.


    The last two points would be covered in detail in the coming chapters. A rough
    idea about the cryptographic aspects of the attacks, the vulnerabilities and the
    exploits. A rough idea about the cryptographic aspects of each ''flavor'' of wireless
    network security.


    **WEP, WPA and WPA-2**


    `WEP` : the aim of Wireless Alliance was to write an algorithm to make wireless
    network (`WLAN`) as secure as wired networks (`LAN`). This is why the protocol
    was called Wired Equivalent Privacy (privacy equivalent to the one expected in
    a traditional wired). Unfortunately, while the idea behind `WEP` sounded bullet-proof,
    the actual implementation was very flawed. `WPA` was a new WLAN standard which
    was compatible with devices using `WEP` encryption. It fixed pretty all the flaws
    in `WEP`, but the limitation of having to work with old hardware meant that some
    remnants of the `WEP` problems would still continue to haunt `WPA`. Overall, however,
    `WPA` was quite secure.


    **Very few tools exist which carry out the attacks against WPA networks.**


    `WPA-2` is the latest and most robust security algorithm for wireless networks.
    It wasn''t backwards compatible with many devices, but these days all the new
    devices support `WPA-2`.


    But wait... In last chapter we assumed `WPA` and `WPA-2` are the same thing. In
    this one, I''m telling you they are quite different. What''s the matter?


    Well actually, the two standards are indeed quite different. However, while it''s
    true there are some remnant flaws in `WPA` that are absent in `WPA-2`, from a
    hacker''s perspective, the technique to hack the two networks is often the same.
    Why?


    - Very few tools exist which carry out the attacks against `WPA` networks (the
    absence of proofofconcept scripts means that you have to do everything from scratch,
    which most people can''t).

    - All these attacks work only under certain conditions (key renewal period must
    be large, QoS must be enabled, etc.)


    Because of these reasons, despite `WPA` being a little less secure than `WPA-2`,
    most of the time, a hacker has to use bruteforce/dictionary attack and other methods
    that he would use **If you don''t want to leave behind any footprints, then passive
    method is the way to go.** against `WPA-2`, practically making `WPA` and `WPA-2`
    the same thing from his perspective.


    PS: There''s more to the `WPA/WPA-2` story than what I''ve captured here. Actually
    `WPA` or `WPA-2` are ambiguous descriptions, and the actual intricacy (`PSK, CCMP,
    TKIP, X/EAP, AES w.r.t. cipher used and authentication used`) would required further
    diving into personal and enterprise versions of `WPA` as well as `WPA-2`.


    **How to Hack**

