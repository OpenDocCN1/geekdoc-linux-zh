    因此，在这个示例运行中，我将尝试通过让手机连接到虚假 AP 来获取我的无线网络密码，然后在手机上输入密码，最后查看我 Kali 机器（笔记本电脑）上的 `Fluxion`
    实例是否获取了密码。此外，对于握手，我将对同一手机进行取消身份认证（de-authenticate）。你可能可以在完全不知道 WPA 如何工作、什么是握手、实际上发生了什么等情况下跟上这个指南，但我建议你阅读一下这些内容。


    ![](img/image00047.jpeg)选择语言后，会出现这一步。


    注意我没有使用任何外部无线网卡，而是使用了笔记本电脑的内置网卡。


    然而，某些内置网可能会导致问题，因此最好使用外部网卡（如果你在虚拟机上，则必须使用外部网卡）。扫描过程开始，使用了 `airodump-ng`。


    ![](img/image00048.jpeg)


    选择一个目标。我选的是 21 号网络，即我的手机连接的那个：


    ![](img/image00038.jpeg)


    你选择一种攻击方式。我将选择 `Hostapd`（第一个）攻击。


    如果你已经捕获了 4 路握手，那么你可以指定该握手的位置，脚本将使用它。否则，它将在下一步中为你捕获一个握手。


    ![](img/image00049.jpeg)如果你之前没有捕获握手，你就可以选择使用哪种工具来完成它。我选择 `aircrack-ng`。


    ![](img/image00038.jpeg)![](img/image00050.jpeg)


    一旦你捕获了握手（查看顶部的 WPA Handshake: [MAC Address]，如果那里有，就说明你拥有了握手），然后输入 1 并回车来检查握手。如果一切正常，你将进入下一步。


    ![](img/image00051.jpeg)


    使用 Web 接口方法。我没有尝试暴力破解，但我猜那只是大多数工具都会使用的普通暴力破解攻击（因此对我们没用，因为我们不是用这个脚本来干这个的）。它提供了多种登录页面，你可以使用它们来获取（钓鱼）WPA
    网络的密码。我选择了第一个选项：


    ![](img/image00038.jpeg)**55**


    做出决定后，你将看到多个窗口。左侧两个窗口处理 DHCP 和 DNS 请求，而右侧两个是状态报告窗口和取消认证窗口（用于将用户从实际 AP 驱逐并引导他们来到虚假
    AP）。


    ![](img/image00038.jpeg)


    在我的手机上，我看到两个同名的网络。注意虽然原始网络受 WPA-2 保护，但我们创建的虚假 AP 是一个开放网络（这是一个巨大的漏洞，会导致大多数人犯下连接它的错误）。总之，我连接了虚假
    AP，DNS 和 DHCP 窗口（左侧）对此相应的反应：


    ![](img/image00038.jpeg)


    连接网络后，我收到一个通知，说我登录无线网络。点击它后，我这个页面。对于某些人，你需要打开浏览器并尝试打开一个网站（例如 `facebook.com`）才能显示这个页面。输入密码并按下提交后，脚本会对我们之前捕获的握手运行密码验证，以确认其确实正确。注意，在这种方法中握手是奢侈品而非必需。它只是确保我们可以验证虚假
    AP 客户端提交的密码是否正确。如果我们没有握手，就会失去这种能力，但假设客户端会输入正确的密码，我们仍然可以让攻击生效。


    ![](img/image00052.jpeg)![](img/image00038.jpeg)`Aircrack-ng` 再次对握手尝试密码，如所料，成功了。


    我们在几分钟内成功获取了受 WPA-2 保护的网络密码。


    # 6


    ## 破解 WPA/WPA2 WPS


    ![](img/image00038.jpeg)


    当已知 WEP 网络可以被任何带有笔记本电脑和网络连接的孩子攻破（使用像我们博客上那种简单的教程）时，安全人员成功制定了更健壮的安全措施 WPA/WPA2。


    现在，在大多数情况下，破解 WPA/WPA2 是一项非常枯燥的工作。字典攻击可能需要几天，仍然可能无法成功。此外，良好的字典是巨大的。


    包含所有字母（大小写）和数字的穷尽暴力破解可能需要多年，取决于密码长度。彩虹表（Rainbow tables）已知通过提前完成部分猜测工作来加速，但从网上下载的输出彩虹表体积大得惊人（有时可以是数百
    GB）。最后，安全人员终于可以松口气气了。但现在远未结束，因为新的 WPA 技术对用户来说完全并不容易配置。考虑到这一点，引入了一项新的安全措施来补充 WPA，即
    Wi-Fi 保护设置（WPS）。现在它基本上是为了让 WPA 变得更难破解，并且更易配置（点击路由器上的按钮，设备即可连接）。然而，它有一个众周知的漏洞，`reaver`
    可以利用它。这仍然需要几个小时才能出结果：


    ![](img/image00038.jpeg)**60**


    维基百科关于 WPS：由 Wi-Fi Alliance 创建并于 2006 年引入，该协议的目标是让了解安全知识的用户添加设备。在标准建立之前，开发了多种竞争方案来解决相同的需求。2011
    年 12 月发现了一个重大安全漏洞，影响了无线路由器。


    ### WPS 的原理


    现在虽然大部分内容与 WPA 相同，但引入了使用 PIN 码进行验证的新概念。基本上，客户端将 8 位 PIN 码发送到访问点，访问点验证后允许客户端连接。现在一个
    PIN 码有 8 位且仅包含数字，因此是可能的破解目标。在对 WPA 密码的正常暴力破解中，你必须考虑可能存在数字、字母以及符号（且超过 8 个字母）。这让任务困难了数十亿。然而，我们可以每秒尝试数千次密钥，这使其稍微简单了一点。现在
    WPS 中，由于我们需要等待 AP 的响应，存在延迟，我们每秒可能只能尝试几次密钥（我在 PC 上看到的最高记录是每 2 秒一次密钥）。基本上，8 位数字和每位
    10 种可能性（0-9），假设每秒尝试一次密钥，需要 `10⁸`（解释 ^ 为幂）秒。那将是多年。所以，这带我们到了哪里？答案是，这项技术存在可以被利用的漏洞：


    - 第 8 位是前 7 位的校验和。`10⁷` 种可能性，即十分之一的时间。两个月，仍然还有很路要走。

    - PIN 码验证分为两个部分，因此我们可以独立地验证前 4 位和后 4 位。两次都猜对 4 位比一次性猜对 8 位要容易得多。基本上，前半部分需要 `10⁴`
    次猜测，后半部分需要 `10³` 次。现在的猜测次数为 `10⁴ +10³`（而不是 `10⁴ *10 ³`）。现在我们需要 11,000 次猜测：


    ![](img/image00053.gif)

