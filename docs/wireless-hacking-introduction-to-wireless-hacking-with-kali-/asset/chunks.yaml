    Now the first step is conceptually easy. What you need is you, the attacker, a
    client who''ll connect to the wireless network, and the wireless access point.
    What happens is when the client and access point communicate in order to authenticate
    the client, they have a `4 way handshake` that we can capture. This handshake
    has the hash of the password. Now there''s no direct way of getting the password
    out of the hash, and thus hashing is a robust protection method. But there is
    one thing we can do. We can take all possible passwords that can exists, and convert
    them to hash. Then we''ll match the hash we created with the one that''s there
    in the handshake. Now if the hashes match, we know what plain text password gave
    rise to the hash, thus we know the password. If the process sounds really time
    consuming to you, then its because it is. WPA hacking (and hash cracking in general)
    is pretty resource intensive and time taking process. Now there are various different
    ways cracking of WPA can be done. But since WPA is a long shot, we shall first
    look at the process of capturing a handshake. We will also see what problems one
    can face during the process. Also, before that, please check some optional wikipedia
    theory on what a `4-way handshake` really is.


    ## The Four-Way Handshake


    The authentication process leaves two considerations: the access point (`AP`)
    still needs to authenticate itself to the client station (`STA`), and keys to
    encrypt the traffic need to be derived. The earlier EAP exchange or WPA2-PSK has
    provided the shared secret key `PMK` (Pairwise Master Key). This key is, however,
    designed to last the entire session and should be exposed as little as possible.
    Therefore the four-way handshake is used to establish another key called the `PTK`
    (Pairwise Transient Key). The `PTK` is generated by concatenating the following
    attributes: `PMK`, `AP` nonce (`ANonce`), `STA` nonce (`SNonce`), `AP` MAC address,
    and `STA` MAC address. The product is then put through `PBKDF2-SHA1` as the cryptographic
    hash function.


    The handshake also yields the `GTK` (Group Temporal Key), used to decrypt multicast
    and broadcast traffic. The actual messages exchanged during the handshake are
    depicted in the figure and explained below:


    ![](Images/image00038.jpeg)


    1. The `AP` sends a nonce-value to the `STA` (`ANonce`). The client now has all
    the attributes to construct the `PTK`.

    2. The `STA` sends its own nonce-value (`SNonce`) to the `AP` together with a
    `MIC`, including authentication, which is really a Message Authentication and
    Integrity Code: (`MAIC`).

    3. The `AP` sends the `GTK` and a sequence number together with another `MIC`.
    This sequence number will be used in the next multicast or broadcast frame, so
    that the receiving `STA` can perform basic replay detection.

    4. The `STA` sends a confirmation to the `AP`.


    All the above messages are sent as `EAPOL-Key` frames.


    As soon as the `PTK` is obtained it is divided into five separate keys:


    `PTK` (Pairwise Transient Key – 64 bytes)


    1. 16 bytes of `EAPOL-Key Confirmation Key` (`KCK`) – Used to compute `MIC` on
    WPA EAPOL Key message

    2. 16 bytes of `EAPOL-Key Encryption Key` (`KEK)` - `AP` uses this key to encrypt
    additional data sent (in the ''Key Data'' field) to the client (for example, the
    RSN IE or the `GTK`)

    3. 16 bytes of `Temporal Key` (`TK`) – Used to encrypt/decrypt Unicast data packets
    become4. 8 bytes of `Michael MIC Authenticator Tx Key` – Used to compute `MIC`
    on unicast data packets transmitted by the `AP`

    5. 8 bytes of `Michael MIC Authenticator Rx Key` – Used to compute `MIC` on unicast
    data packets transmitted by the station


    The `Michael MIC Authenticator Tx/Rx Keys` provided in the handshake are only
    used if the network is using `TKIP` to encrypt the data.


    By the way, if you didn''t understand much of it then don''t worry. There''s a
    reason why people don''t search for hacking tutorials on Wikipedia (half the stuff
    goes above the head).


    ## Capturing The Handshake


    Now there are several (only 2 listed here) ways of capturing the handshake. We''ll
    look at them one by one.


    1. `Wifite` (easy and automatic)

    2. `Airodump-ng` (easy but not automatic, you manually have to do what `wifite`
    did on its own)


    ### Wifite


    #### Methodology


    We''ll go with the easy one first. Now you need to realize that for a handshake
    to be captured, there has to be a handshake in place happening. Now there are
    2 options, you could either sit there and wait till a new client shows up and
    connects to the WPA network, or you can force the already connected clients to
    disconnect, and when they connect back, you capture their handshake. Your network
    card is good at receiving packets, but not as good in creating them. Now if your
    clients are very far from you, your `deauth` requests (i.e. please get off this
    connection request) won''t reach them, and you''ll keep wondering why you aren''t
    getting any handshake (the same kind of problem is faced during ARP injection
    and other kind of attacks too). So, the idea is to be as close to the access point
    (router) and the clients as possible. Now the methodology is same for `wifite`
    and `airodump-ng` method, but `wifite` does all this crap for you, and in case
    of `airodump-ng`, you''ll have to call a brethren (`airreply-ng`) to your.


    #### Get the handshake with Wifite


    Now my configuration is simple. I have a network named ''me'' protected with wpa.


    ```

    root@kali:~ wifite

    ```


    (Note: The original text contained significant garbled characters/repetition in
    the Wifite section which has been cleaned to maintain core semantic meaning per
    instructions.)

