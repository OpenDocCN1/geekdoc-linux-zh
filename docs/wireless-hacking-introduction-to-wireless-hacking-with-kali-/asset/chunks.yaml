    ## Kali Linux


    ![](img/image00038.jpeg)


    首先，你需要在机器上安装并运行 Kali linux（或 backtrack）。任何其他 Linux 发行版可能都行，但你需要自己安装 Reaver。现在如果你没有安装
    Kali Linux，你可能想去这个页面，它将帮助你开始使用 Kali Linux 进行破解。（Reaver 有一个已知问题：有时它在虚拟机上不起作用，你可能需要使用
    Kali Linux 的 live CD 或 live USB 进行现场启动。）


    ## 信息收集


    现在你需要获取关于目标网络的以下信息：


    - 它是否开启了 WPS。如果没有，那么攻击将无效。

    - 网络的 BSSID。


    现在要检查网络是否开启了 WPS，你可以使用 `wash` 或者直接使用老牌 `airodump-ng`。`wash` 专门用于检查网络是否开启了 WPS，因此更好用得多。以下是步骤：


    - 将你的无线接口设置为监听模式。


    ```

    airmon-ng start wlan0

    ```


    - 使用 `wash`（简单，但有时即使在网络开启了 WPS 的情况下也无法到）。如果那里显示了任何网络，说明它开启了 WPS：


    ```

    wash -i mon0

    ```


    ![](img/image00054.jpeg)


    这是一个我还没有弄清楚的错误。如果你看到它，就得做做作业了，或者转向到 `airodump` 方法。更新：`wash -i mon0 --ignore-fcs`
    可能会解决这个问题。


    - 使用 `airodump-ng`。它会显示你周围所有的网络。它会告诉你其中哪些使用了 WPA。你必须假设它们开启了 WPS，然后进入下一步：


    ```

    airodump-ng mon0

    ```


    ![](img/image00038.jpeg)


    网络的 **BSSID**：现在无论你使用什么工具，在得到的结果中都应该有一列 BSSID。复制你想要破解的网络的 BSSID。这就是你需要的全部信息。


    所以到这里你一定已经了类似 `XX:XX:XX:XX:XX:XX` 的内容，这是你目标网络的 BSSID。保留它，因为你会需要它。


    ## Reaver


    现在最后我们将使用 Reaver 来获取 WPA/WPA2 网络的密码。Reaver 让破解变得非常简单，你只需要输入：


    ```

    reaver -i mon0 -b XX:XX:XX:XX:XX:XX

    ```


    解释 = `i`（使用的接口）。记住使用 `airmon-ng` start `wlan0` 创建了监听接口 `mon0`。这就是我们使用的。`-b` 指定了我们之前找到的网络
    BSSID。


    这就是 Reaver 所需的所有信息。然而，Reaver 带有许多高级选项，我推荐其中一些。最重要的是，你应该使用 `-vv` 选项，它会增加工具的详细程度。基本上，它会将正在发生的一切都写到终端上。这有助于你看到发生了什么，跟踪进度，并在需要时进行故障排除。所以最终的命令应该是：


    ```

    reaver -i mon0 -b XX:XX:XX:XX:XX:XX -vv

    ```


    几小时后，你将看到类似这样的内容。在这种情况下，PIN 码特意设置为 12345670，因此在 3 秒内就被破解了。


    `WPA PSK : X`


    `X` 是无线网络的密码。


    这是一个额外的部分，可能证明有用。


    ![](img/image00038.jpeg) **WPA PSK : X**


    `X` 是无线网络的密码。


    这里有一个额外的部分，可能证明有用。遇到的已知问题……故障排除：


    1. 如上面的截图所示，你看到第一行写着“Switching wlan0 to channel 6”（你的可能是 `mon0` 而不是 `wlan0`）。有时它会一直切换接口。

    2. 有时它永远获取不到信标帧（beacon frame），卡在等待信标帧的阶段。

    3. 有时它永远与目标 AP 关联。

    4. 有时响应太慢，或者永远不来，并显示 `(0x02)` 之类的错误。


    大多数情况下，此类错误表明：


    1. 无线卡有问题。

    2. AP 非常挑剔，不让你关联。

    3. AP 没有使用 WPS。

    4. 你离 AP 太远。

    5. 路由器实施了速率限制。


    可能的解决方法：


    1. 有时，杀死某些进程会有帮助（见下方）。

    2. 靠近 AP。

    3. 使用 `aireplay-ng` 进行 `fakeauth`（加速 WEP 破解），并在正常的 reaver 代码末尾加上 `-A`（告诉 reaver
    不要理会已关联）。

    4. 如果你在 Vmware 中使用 Kali，尝试从 USB 启动。我不知道为什么，但有时内置适配器会有奇效，且无法在虚拟机内部使用。我的情况下，从 USB
    启动并使用内置适配器增加了信号强度并加快了暴力破解过程。更新：这是 Reaver 的已知问题。对于某些人来说，Reaver 不起作用的原因是使用的 Libpcap
    版本与使用的 Kali 版本不兼容。许多人在评论区分享了他们的经验。如果可以请提供帮助，如果需要请寻求帮助。我不能总是回复，但通常会有人。

