    \ once. Basically, the first half would take 10^4 guess and the second would take\
    \ 10^3. \n\nNow the guesses would be 10^4 + 10^3 (not 10^4 *10 ^3). Now we need\
    \ 11,000 guesses:\n\n![](Images/image00053.gif)"
