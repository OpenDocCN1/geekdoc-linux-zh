    2. **主动方法** - 你切断建筑物的供电/供水，或者可能通过某种方式触发火警报警。无论采取何种方法，迫使成员离开俱乐部。一旦他们发现一切无事，他们就会蜂群结回。你会知道大门在哪里。在无线术语中，你可以对客户端进行取消身份验证（de-authenticate）（你可能经常需要这样做，无论你是在破解一个
    WEP 网络，还是在获取 WPA 握手[稍后会对此详细介绍]）。当然，这种方法会导致你留下一些痕迹，但至少你不需要等待几个小时。


    隐藏入口俱乐部的类比物是隐藏网络。只要网络中有客户端，想要发现网络名称就非常容易（准确地说，是 `SSID`，将网络设置为隐藏基本上是停止了接入点显示其 SSID）。然而，当客户端连接到网络时，会传输带有
    SSID（明文形式，即未加密）的信标帧（beacon frames，数据包），你可以捕获这些数据包并获取网络的 SSID。因此，隐藏网络并不能为网络提供多少保护，一个受
    WEP 保护的隐藏网络意味着获取密码的时间从 10 分钟变为 15 分钟。对于 WPA 网络，将 SSID 设为隐藏并没有太大作用，因为 WPA 网络实际上是不可破解的，一个有时间和处理能力去绕过
    WPA 加密的人不会被隐藏的 SSID 阻止。


    **总结**


    即使在获取路由器访问权限后，你与互联网之间可能存在额外的验证步骤（登录）或其他障碍。然而，这是一个完全独立的问题。


    **无线热点或开放网络没有任何加密。** 并且与无线破解的讨论没有太大的关系。但这仍然是你必须意识到的一点：


    - 无线热点或开放网络没有任何加密。任何人都可以访问它们。此外，你传输的数据没有加密，周围的任何人都可以读取。你以明文发送到目标服务器的任何内容（例如，发送到
    `google`）都将以明文从你的机器传输到无线路由器。周围的任何人都可以使用 `Wireshark` 或任何其他类似的工具轻松读取。当然，敏感数据很少以明文发送，所以不要坐在无线热点旁指望获得某人的
    FB 登录凭据。然而，开放网络缺乏加密应该被认真对待。就无线破解而言，这方面没有太多可做的（除了在空气中嗅探未加密的数据）。


    - `WEP` - 这是大部分问题发生的地方。无数的漏洞、无数的攻击、无数列出这些问题的研究论文、无数获取密码的工具。学习如何破解这些并不需要费太大精力。如果你熟悉
    `linux`，那么几乎不需要任何精力。只需运行一些终端命令，你就搞定了（使用 `wifite`，你甚至不需要费心这些）。


    - `WPA` - 不想对付这家伙。从理论上讲，有一种进入的方法。在实践中，这需要永远。字典攻击和暴力破解是进入的方法。我将在本指南的进阶版本中涵盖所有这些。注：当我说
    `WPA` 时，我同时指的是 `WPA` 和 `WPA-2`。就本章而言，它们是相同的。


    **带有 WPS 的 WPA：没有 WEP 那么简单，但仍然可行。**


    - 带有 `WPS` 的 `WPA` - 有弱点的硬汉。击中他的要害处，“花费永远才能进入”就变成了几个小时的问题。没有 `WEP` 那么简单，但仍然可行。的是，你可能会遇到一个有弱点但已经开始学习教训并妥善保护该弱点的家伙（带有
    `WPS` 但有速率限制或其他安全措施）。


    我希望你现在对无线安全的各种类型有一个大致的了解。我脑海中还有几份进阶指南，它们将触及这些“类型”的加密细节、漏洞及其漏洞利用方法。至于实际的破解过程，本网站以及互联网其他地方有许多关于这方面的教程，因此我不再重复介绍。我希望这次当你阅读指南时，能够意识到发生了什么，而不会最终在
    `WPA` 网络上尝试一种对 `WEP` 目标有效的攻击。


    **前提条件**


    你应该了解（所有这些内容在“无线破解基础”中都有涵盖）：


    - 你会遇到哪些不同类型的无线网络，以及破解每种网络有多大困难。

    - 什么是隐藏网络，以及它们是否对黑客构成了真正的挑战。

    - 对各种“类型”的无线网络实际上是如何被破解的有一个非常粗略的了解。


    **阅读后收获**


    你将了解：


    - 更多关于不同类型无线网络的知识。

    - 如何破解任何给定的无线网络。


    **WEP：主要问题是静态密钥和弱的 IV。**


    - 无线破解中使用的常用工具和攻击。


    最后两点将在接下来的章节中详细介绍。关于攻击、漏洞和漏洞利用在加密加密方面的粗略概念。关于每种“类型”无线网络安全在加密方面的粗略概念。


    **WEP、WPA 和 WPA-2**


    `WEP`：无线联盟（Wireless Alliance）的目标是编写一种算法，使无线网络（`WLAN`）像有线网络（`LAN`）一样安全。这就是为什么该协议被称为
    Wired Equivalent Privacy（等同于线的隐私）。遗憾的是，虽然加密理念听起来无懈可击，但实际实现漏洞百出。`WPA` 是一种新的标准，兼容使用
    `WEP` 的设备。它修复了 `WEP` 的大部分，但由于必须兼容旧硬件，`WEP` 的问题仍然困扰着 `WPA`。总的来说，`WPA` 是相当安全的。


    **攻击 WPA 的工具很少。**


    `WPA-2` 是最新且强大的无线网络安全算法。它与许多设备不兼容，但现在所有设备都支持 `WPA-2`。


    但是等等……在上一章我们假设 `WPA` 和 `WPA-2` 是同一个东西。在这一章中，我告诉你们它们是不同的。这是什么？


    事实上，这两个标准确实非常不同。然而，虽然 `WPA` 中存在一些 `WPA-2` 中不存在的残留漏洞，但从黑客的角度来看，破解这两种网络的技术通常是相同的。为什么？


    - 攻击 `WPA` 的工具很少（缺乏原型演示脚本意味着你必须从头开始，大多数人做不到）。

    - 所有这些攻击仅在特定条件下有效（密钥更新周期必须很大、必须启用 QoS 等）。


    由于这些原因，尽管 `WPA` 比 `WPA-2` 安全一点，但在大多数情况下，黑客必须使用暴力破解/字典攻击和其他方法来对 `WPA-2`，**如果你不想留下任何足迹，被动方法是唯一选择。**
    这从他的角度实际上使得 `WPA` 和 `WPA-2` 是同一个东西。


    注：`WPA/WPA-2` 的故事比我在这里捕捉的要多。实际上 `WPA` 或 `WPA-2` 是模糊的描述，真正的复杂性（`PSK, CCMP, TKIP,
    X/EAP, AES w.r.t. 使用的加密和认证方式`）需要深入研究 `WPA` 以及 `WPA-2` 的个人和企业版本。


    **如何破解**


