    - `reaver`

    - `pixiewps` (执行“花粉攻击”）


    ## 4 酷酷工具

    - `aireplay-ng` (主要针对 WEP)

    - `mdk3` (很酷的东西)


    ## 5 自动化

    - `wifite`

    - `fluxion` (非常用脚本)


    # 2 无线破解


    ![](img/image00038.jpeg)


    ### 你应该了解：

    - 你会遇到哪些不同类型的无线网络，以及破解每种网络的难度有多大。

    - 什么是隐藏网络，它们是否对黑客构成了真正的挑战。

    - 对各种“类型”的无线网络实际上是如何被破解的有一个大致的概念。


    ### 你将学会：

    - 进一步了解关于不同类型的无线网络。

    - 如何破解任何给定的无线网络。

    - 无线破解中常用的工具和攻击手段。


    ## WEP, WPA 和 WPA-2


    `WEP 是上述讨论中那艘有缺陷的船。无线联盟（Wireless Alliance）的目标是编写一种算法，使无线网络（WLAN）像有线网络（LAN）一样安全。这就是为什么该协议被称为有线等效隐私（Wired
    Equivalent Privacy，等同于传统有线网络的预期隐私）。遗憾的是，虽然从理论上 WEP 背后的理念听起来无懈可击，但实际实现存在很大缺陷。主要问题是静态密钥和弱
    IV（初始化向量）。一段时间，人们尝试修复这些问题，但没有有效的方法（尽管 WEP2、WEPplus 等，但都失败了）。`


    `WPA 是一种新的 WLAN 标准，与使用 WEP 加密的设备兼容。它修复了 WEP 加密中几乎所有的缺陷，但由于必须与旧硬件配合，WEP 问题的某些遗留仍继续困扰着
    WPA。总的来说，WPA 是安全的。在上面的故事中，这就是那艘经过改装的船。`


    `WPA-2 是无线网络最新且最稳健的安全算法。它与许多设备不向后兼容，但现在所有新设备都支持 WPA-2。这是一艘无懈可击的船，采用了更强合金的新型号。`


    - 极少数工具可以正确执行针对 WPA 网络的攻击（缺乏概念验证脚本意味着你必须从零开始完成一切，大多数人都做不到）。

    - 所有这些攻击仅在特定条件下有效（密钥更新期必须足够长、必须启用 QoS 等）。


    由于这些原因，尽管 WPA 比 WPA-2 安全性低一点，但在大多数情况下，黑客必须使用暴力破解/字典攻击以及他针对 WPA-2 会使用的其他方法，这使得从他的角度来看，WPA
    和 WPA-2 实际上是同一回事。


    PS：WPA/WPA-2 的故事比我在这里记录的要多。实际上，WPA 或 WPA-2 是模糊的描述，实际的复杂性（相对于使用的加密和身份验证的 PSK, CCMP,
    TKIP, X/EAP, AES）需要进一步深入研究个人版和企业版的 WPA 以及 WPA-2。


    ## 如何破解


    现在你已经了解所有这些网络的基础知识，让我们来看看这些网络实际上是如何破解的。


    ### WEP


    ![](img/image00038.jpeg) 大多数攻击依赖于 IV（初始化向量）的固有缺陷。基本上，如果你收集了足够的 IV，你就能获得密码。


    #### 1 被动方法

    - 如果你不想留下任何痕迹，那么被动方法是首选。在这种情况下，你只需监听网络所在的通道，并捕获数据包（`airodump-ng`）。这些数据包将提供 IV，有了足够的
    IV，你就可以破解网络（`aircrack-ng`）。我已经有一篇关于这种方法的教程，你可以在这里阅读 - 使用 aircrack-ng 套件破解 WEP。


    #### 2 主动方法

    - **ARP 请求重放**：上述方法可能非常缓慢，因为你需要大量的数据包（无法说具体多少个，由于攻击的性质，数量可以是任何数字。但通常需要的数据包数量是位数）。获取这么多数据包非常耗时。不过，有很多方法可以加速过程。基本思想是在网络中启动某种对话，然后捕获由于对话产生的数据包。问题是，并不是所有的数据包都有
    IV。因此，在没有 AP 密码的情况下，你必须让它生成带有 IV 的包。做到此点的最佳方法之一是请求 ARP 包（具有 IV，一旦你捕获到至少一个 ARP
    包，就可以轻松生成）。这种攻击被称为 ARP 重放攻击。我们也有关于这种攻击的教程，ARP 请求重放攻击。

    - **Chopchop 攻击**

    - **分片攻击**

    - **Caffe Latte 攻击**


    我将分别详细介绍所有这些攻击（我真的无法总结后三种）。


    ### WPA-2 (以及 WPA)


    这里没有你可以轻而利用的漏洞。我们拥有的只有两个选择：猜密码，或者诱骗用户把密码交给我们。


    #### 1 猜密码

    - 要猜某些东西，你需要两样东西：猜测（显而易见）和验证。基本上，你需要能够进行大量猜测，并能够验证它们是否正确。最简单的方法是在你的操作系统在连接 wifi
    时提供的密码字段中输入猜测值。这会很慢，因为你必须手动操作。即使你为此写了一个脚本，它也会花费时间，因为你每次猜测都要与 AP 通信（每个猜测还要多次）。基本上，通过通过询问
    AP 来验证很慢。那么，是否有方法可以在不询问 AP 的情况下检查密码的正确性？有的，但前提是你必须有一个四次握手（4-way handshake）。基本上，你需要捕获客户端连接到
    AP 时传输的一系列数据包。如果你有了这些数据包（四次握手），你就可以针对它验证你的密码。稍后会有更多细节，但我希望抽象概念是清晰的。有几种不同的猜密码方法：

    - **暴力破解 (Bruteforce)**：尝试所有可能的密码。只要时间足够，可以保证有效。然而，即使对于长度为 8 位的字母数字密码，暴力破解所需的长时间。如果密码很短且你知道它由数字组成，这种方法可能有用。

    - **词列表/字典 (Wordlist/Dictionary)**：在这种攻击中，有一个可能的密码候选单词列表。这些词列表文件包含英文单词、单词组合、拼写错误等。有一些巨大的词列表文件大小为几个
    GB，许多网络可以使用它们被破解。然而，无法保证你正在尝试破解的网络密码一定在列表中。这些攻击可以在合理的时间内完成。


