    So that''ll take 3 hours approximately. And that''s all the combinations, and
    most probably the correct pin will not be the last combination, so you can expect
    to reach the result earlier. However, the assumption is that `bruteforcing` will
    take place at a key per second. My personal best is a key every 2 seconds, and
    yours might drop to as low as a key every 10 seconds.


    ## How to carry out the attack


    Now it might have been tough to carry out this attack at some point in history,
    but now, its a breeze. If you have all the prerequisites, then hacking the network
    would be as easy as:


    ```

    reaver -i <interface-name> -b <BSSID of target>

    ```


    And if you are already familiar with hacking WEP, then just go to your Kali Linux
    terminal and type the above command (replacing what needs to be replaced). Leave
    your machine as is, come back 10 mins later, check the progress (must be 1% or
    something), and go take a nap. However, if you''re a newbie, then tag along.


    ## Kali Linux


    ![](Images/image00038.jpeg)


    First off, you need to have Kali linux (or backtrack) up and running on your machine.
    Any other Linux distro might work, but you''ll need to install Reaver on your
    own. Now if you don''t have Kali Linux installed, you might want to go to this
    page, which will get you started on hacking with Kali Linux. (Reaver has a known
    issue : Sometimes it doesn''t work with Virtual Machines, and you might have to
    do a live boot using live CD or live USB of Kali Linux.


    ## Information Gathering


    Now you need to find out the following about you target network:


    - Does it have WPS enabled. If not, then the attack will not work.

    - The BSSID of the network.


    Now to check whether the network has WPS enabled or not, you can either use `wash`
    or just use the good old `airodump-ng`. `wash` is specifically meant to check
    whether a network has WPS enabled or not, and thereby is much easier to use. Here
    are the steps:


    - Set your wireless interface in monitor mode.


    ```

    airmon-ng start wlan0

    ```


    - Use `wash` (easy but sometimes unable to detect networks even when they have
    wps enabled). If any network shows up there, it has WPS enabled:


    ```

    wash -i mon0

    ```


    ![](Images/image00054.jpeg)


    This is an error which I haven''t figured out yet. If you see it, then you''ll
    have to do some homework, or move on to `airodump` method. Update: `wash -i mon0
    --ignore-fcs` might solves the issue.


    - Use `airodump-ng`. It will show all networks around you. It tells which of them
    use WPA. You''ll have to assume they have WPS, and then move to next steps:


    ```

    airodump-ng mon0

    ```


    ![](Images/image00038.jpeg)


    **BSSID** of the network: now irrespective of what you used, you should have a
    BSSID column in the result that you get. Copy the BSSID of the network you want
    to hack. That''s all the information you need.


    So by now you must have something like `XX:XX:XX:XX:XX:XX`, which is the BSSID
    of your target network. Keep this copied, as you''ll need it.


    ## Reaver


    Now finally we are going to use Reaver to get the password of the WPA/WPA2 network.
    Reaver makes hacking very easy, and all you need to do is enter:


    ```

    reaver -i mon0 -b XX:XX:XX:XX:XX:XX

    ```


    Explanation = `i` (interface used). Remember creating a monitor interface `mon0`
    using `airmon-ng` start `wlan0`. This is what we are using `-b` specifies the
    BSSID of the network that we found out earlier.


    This is all the information that Reaver needs to get started. However, Reaver
    comes with many advanced options, and some are recommended by me. Most importantly,
    you should use the `-vv` option, which increases the verbosity of the tool. Basically,
    it writes everything thats going on to the terminal. This helps you see whats
    happening, track the progress, and if needed, do some troubleshooting.  So final
    command should be:


    ```

    reaver -i mon0 -b XX:XX:XX:XX:XX:XX -vv

    ```


    After some hours, you will see something like this. The pin in this case was intentionally
    12345670, so it was hacked in 3 seconds.


    `WPA PSK : X`


    `X` is the password of the wireless network.


    Here is an extra section, which might prove useful.


    ![](Images/image00038.jpeg) **WPA PSK : X**


    `X` is the password of the wireless network.


    Here is an extra section, which might prove useful. Known problems that are faced...
    troubleshooting:


    1. As in the screenshot above, you saw the first line read "Switching wlan0 to
    channel 6". (Yours will be `mon0` instead of `wlan0`). Sometimes, it keeps switching
    interfaces forever.

    2. Sometimes it never gets a beacon frame, and gets stuck in the waiting for beacon
    frame stage.

    3. Sometimes it never associates with the target AP.

    4. Sometimes the response is too slow, or never comes, and a `(0x02)` or something
    error is displayed.


    In most cases, such errors suggest:


    1. Something wrong with wireless card.

    2. AP is very choosy, won''t let you associate.

    3. The AP does not use WPS.

    4. You are very far from the AP.

    5. Rate Limiting implemented in the router (most new router have this)


    Possible workarounds:


    1. Sometimes, killing naughty processes helps. (see pictures below)

    2. Move closer to target AP.

    3. Do a `fakeauth` using `aireplay-ng` (check speeding up WEP hacking) and tell
    Reaver not to bother as we are already associated using `-A` (just add `-A` at
    the end of your normal reaver code)

    4. If you are using Kali Linux in Vmware, try booting into Kali using USB. I don''t
    know why, but sometimes internal adapters work wonders, and can''t be used from
    inside of a VM. In my case, booting up from USB and using internal adapter increased
    the signal strength and speeded up the bruteforce process. Update : It has nothing
    to do with internal adapter. I have verified this with many others, and it is
    now a known problem with Reaver. It does not work well inside Virtual machines.
    It is recommended that you do a live boot.

    5. As far as rate limiting is concerned, there are few workarounds available in
    forums, but nothing seems to work with 100%. Here is a relevant discussion of
    gitlab, here is a solution on hack5 forums which has a script and uses `mdk5`
    tool (sometimes it doesn''t work, it''s supposed to DOS the router and reset the
    ban temporarily), and here is a thread on Kali Forums on the same issue, which
    has various possible solutions (including a method which changes your MAC address
    regularly and hence allows reaver to work against routers which lock the particular
    MAC address which is attacking them). For some people the reason Reaver is not
    working is because the version of Libpcap you are using is not compatible with
    the version of Kali you are using. lot of people have shared their experiences
    in the comments section. Help out if you can, seek help if you need any. I can''t
    always respond, but someone usually does. Even after all your attempts, if you
    can''t get it to work, then the AP just isn''t vulnerable. You have the following
    alternatives:


    A. If you were following the tutorials one by one in the order shown in the top
    navigation bar (Hack With Kali -> Wireless Hacking), then you have learnt all
    you needed in this chapter (even if you failed to get WPA-PSK), and can move to
    the next ones.

    B. See if you can hack a WPA network.


    ![](Images/image00038.jpeg)


    ### **Hack WPA/WPA2 PSK Capturing the Handshake**


    #### WPA password hacking


    Hacking WPA-2 PSK involves 2 main steps:


    1. Getting a handshake (it contains the hash of password, i.e. encrypted password)

    2. Cracking the hash.

