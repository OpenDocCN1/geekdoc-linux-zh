    BSSID             STATION       PWR  Rate    Lost    Frames  Probe\n*        \
    \       *              0   0e- 1     742      82\n```\nYou can confirm it by typing:\n\
    ```bash\nroot@kali:~# aircrack-ng anynamehere-01.cap\n```\nOpening `anynamehere-01.cap`.\n\
    Read 212 packets.\n```\n #  BSSID             ESSID                          \
    \     Encryption\n 1 ***************me                               WPA (1 handshake)\
    \   2  **                               Unknown\n```\n"
