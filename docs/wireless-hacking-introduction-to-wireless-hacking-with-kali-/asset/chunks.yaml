    ## 彩虹彩表 (Rainbow table)


    我之前提到的四次握手验证过程涉及明文密码的哈希处理，然后与握手中的哈希值进行比较。然而，哈希（WPA 使用 `PBKDF2`）是一项 CPU 密集型任务，是测试密钥速度的限制因素（这就是为什么有很多工具使用
    `GPU` 而不是 `CPU` 来加速破解的原因）。


    现在，一种解决方案是：创建我们使用的词列表/字典的人也可以将明文密码转换为哈希值，这样就可以直接检查。遗憾的是，WPA-2 在哈希时使用了“盐”（salt），这意味着两个具有相同密码的网络如果使用不同的盐，它们的哈希值也会不同。


    WPA-2 是如何选择盐的？它使用网络名称（`SSID`）作为盐。因此，两个具有相同 `SSID` 和相同密码的网络将具有相同的盐。现在，制作词列表的人必须为所有可能的
    `SSID` 创建单独的哈希。


    在实践中，情况是为最常见的 `SSID` 生成哈希值（例如购买路由器时的默认名称，如 `-linksys`、`netgear`、`belkin` 等）。如果目标网络具有这些
    `SSID` 之一，通过预计算的哈希将显著缩短破解时间。这种预计算的哈希表被称为 `rainbow table`。请注意，这些表比词列表表大得多。因此，虽然我们在破解密码时节省了一些时间，但必须使用一个大得多的文件（有些数百
    GB），而不是较小的文件。这被称为“时间与的权衡”（time-memory tradeoff）。本页包含 1000 个最常见 `SSID` 的彩虹表。


    ## 诱骗用户提供密码


    基本上这只是中间人攻击和社交工程攻击的结合。更具体地说，它是“邪恶孪生”（evil twin）和钓鱼攻击（phishing）的结合。


    在这种攻击中，你首先强制客户端从原始 `WPA-2` 网络断开，然后强制它连接到你创建的虚假开放网络，然后在它的浏览器中发送一个登录页面，要求其输入网络密码。


    你可能会想，为什么我们需要保持网络开放并在浏览器中请求密码呢（我们不能直接创建一个 `WPA-2` 网络让用户直接给我们密码吗）。答案在于 `WPA-2`
    在四次握手期间会执行双方认证。基本上，客户端验证 `AP` 是合法的且知道密码，而 `AP` 验证客户端是合法的且知道密码（在此过程中，密码从未以明文形式发送）。我们只是没有足够完成四次握手所需的信息。


    ## 附：WPS 漏洞和 reaver


    我已经在之前单独详细介绍过了，所以不再重复解释（我只是人，而且是个非常懒的人）。


    ## 工具 (Kali)


    在这一节中，我将列出 Kali 中预装的一些无线破解类常用工具，以及它们的用途。


    ### 1 捕获数据包

    * `airodump-ng`

    * `wireshark`（一个非常多功能的工具，有书籍专门介绍该工具用于数据包分析）


    ### 2 破解握手

    * `aircrack-ng`（可以像破解 WEP 一样破解握手）

    * `hashcat`（GPU 破解）

    * `cowpatty`


    ### 3 WPS

    * `reaver`

    * `pixiewps`（执行“pixie dust 攻击”）


    ### 4 酷炫工具

    * `aireplay-ng`（主要针对 WEP）

    * `mdk3`（酷东西）


    ### 5 自动化

    * `wifite`

    * `fluxion`（实际上它并不是常用的脚本，但因为我写过它的教程，所以我链接了它）


    # 3. 网络基础：IP 地址、子网掩码和子网


    ### IP 地址


    IP 地址是任何网络（使用 `IP/ TCP` 协议）上的每个设备必须拥有的 32 位地址。它通常用十进制表示法而不是二进制，因为那样写不那么冗长。例如：


    * 十进制表示：`192.168.1.1`

    * 二进制：`10000000.10101000.00000001.00000001`


    从二进制形式可以看出，IP 确实是 32 位的。它的范围从 `0.0.0.0` 到 `255.255.255.255`（分别对应二进制全 0 和全 1）[很多时候，第一个字节通常只到
    127。然而，我们在这里不关心这一点。]


    #### IP 地址的组成部分


    现在这个 IP 地址有两个部分：网络地址和主机地址。许多无线路由器保留前 3 个字节（8 位，因此称为字节）作为网络地址，并将最后一个字节作为主机地址。一种非常常见的配置是
    `192.168.1.1`。在这里，`192.168.1.0` 是网络地址，`0.0.0.1` 是主机地址。我希望你能看到主机地址可以从 `0.0.0.0`
    变为 `0.0.0.255`（通常如此）。


    #### 子网掩码 (Netmasks)


    现在这个 IP 地址有两个部分：网络地址和主机地址。许多无线路由器保留前 3 个字节（8 位，因此称为字节）作为网络地址，并将最后一个字节作为主机地址。一种非常常见的配置是
    `192.168.1.1`。在这里，`192.168.1.0` 是网络地址，`0.0.0.1` 是主机地址。我希望你能看到主机地址可以从 `0.0.0.0`
    变为 `0.0.0.255`（通常如此）。


