- fmt: "\nNow that you know the basics of all these network, let's get to how actually\
    \ these networks are hacked. I will only name the attacks, further details would\
    \ be provided in coming tutorials.\n\n## WEP\n\nThe Initialization vector `v`\
    \ passed to the `RC4` cipher is the weakness of WEP.\n\nMost of the attacks rely\
    \ on inherent weaknesses in `IVs` (initialization vectors). Basically, if you\
    \ collect enough of them, you will get the password.\n\n### 1 Passive method\n\
    \n- If you don't want to leave behind any footprints, then passive method is the\
    \ way to go. In this, you simply listen to the channel on which the network is\
    \ on, and capture the data packets (`airodump-ng`). These packets will give you\
    \ `IVs`, and with enough of these, you can crack the network (`aircrack-ng`).\
    \ I already have a tutorial on this method, which you can read here - Hack WEP\
    \ using `aircrack-ng` suite. \n- **One of the best ways to do this is by requesting\
    \ ARP packets.**\n\n### 2 Active methods\n\n- **ARP request replay**: The above\
    \ method can be incredibly slow, since you need a lot of packets (there's no way\
    \ to say how many, it can literally be anything due the nature of the attack.\
    \ However, usually the number of packets required ends up in 5 digits). Getting\
    \ these many packets can be time consuming. However, there are many ways to fasten\
    \ up the process. The basic idea is to initiate some sort of conversation in the\
    \ network, and then capture the packets that arise as the result of the conversation.\
    \ The problem is, not all packets have `IVs`. So, without having the password\
    \ to the AP, you have to make it generate packets with `IVs`. One of the best\
    \ ways to do this is by requesting ARP packets (which have `IVs` and can be generated\
    \ easily once you have captured at least one ARP packet). This attack is called\
    \ ARP replay attack. We have a tutorial for this attack as well, ARP request replay\
    \ attack.\n- Chopchop attack\n- Fragmentation attack\n- Caffe Latte attack \n\n\
    ## WPA-2 (and WPA)\n\nThere are no vulnerabilities here that you can easily exploit.\
    \ The only two options we have are to guess the password or to fool a user into\
    \ giving us the password.\n\n### What to guess a password? You need the capture\
    \ the series of packets transmitted when a valid client connects to the AP.\n\n\
    #### 1 Guess the password - For guessing something, you need two things: `Guesses`\
    \ and validation. Basically, you need to be able to make a lot of guess, and also\
    \ be able to verify if they are correct or not. The naive way would be to enter\
    \ the guesses into the password field that your OS provides when connecting to\
    \ the wifi. That would be slow, since you'd have to do it manually. Even if you\
    \ write a script for that, it would take time since you have to communicate with\
    \ the AP for every guess(that too multiple times for each guess). Basically, validation\
    \ by asking the AP every time is slow. So, is there a way to check the correctness\
    \ of our password without asking the AP? Yes, but only if you have a 4-way handshake.\
    \ Basically, you need the capture the series of packets transmitted when a valid\
    \ client connects to the AP. If you have these packets (the 4-way handshake),\
    \ then you can validate your password against it. More details on this later,\
    \ but I hope the abstract idea is clear. There are a few different ways of guessing\
    \ the password.\n\n- **Bruteforce**: Tries all possible passwords. It is guaranteed\
    \ that this will work, given sufficient time. However, even for alphanumeric passwords\
    \ of length 8, bruteforce takes incredibly long. This method might be useful if\
    \ the password is short and you know that it's composed only of numbers.\n- **Wordlist/Dictionary**:\
    \ In this attack, there's a list of words which are possible candidates to be\
    \ the password. These word list files contains english words, combinations of\
    \ words, misspelling of words, and so on. There are some huge wordlists which\
    \ are many GBs in size, and many networks can be cracked using them. However,\
    \ there's no guarantee that the network you are trying to crack would have it's\
    \ password.\n**A possible solution to password cracking is to create a wordlist/dictionary\
    \ that can also convert the plaintext passwords into hashes so that they can be\
    \ checked directly in the list.** These attacks get completed within a reasonable\
    \ timeframe.\n- **Rainbow table**: The validation process against the 4-way handshake\
    \ that I mentioned earlier involves hashing of the plaintext password which is\
    \ then compared with the hash in handshake. However, hashing (WPA uses `PBKDF2`)\
    \ is a CPU intensive task and is the limiting factor in the speed at which you\
    \ can test keys (this is the reason why there are so many tools which use GPU\
    \ instead of CPU to speed up cracking). Now, a possible solution to this is that\
    \ the person who created the wordlist/dictionary that we are using can also convert\
    \ the plaintext passwords into hashes so that they can be checked directly. Unfortunately,\
    \ WPA-2 uses a salt while hashing, which means that two networks with the same\
    \ password can have different hashing if they use different salts. How does WPA-2\
    \ choose the salt? It uses the network's name (`SSID`) as the salt. So two networks\
    \ with the same SSID and the same password would have the same salt. So, now the\
    \ guy who made the wordlist has to create separate hashes for all possible SSID's.\
    \ Practically, what happens is that hashes are generated for the most common SSID's\
    \ (the default one when a router is purchases like -linksys, netgear, belkin,\
    \ etc.). If the target network has one of those SSID's then the cracking time\
    \ is reduced significantly by using the precomputed hashes. This precomputed table\
    \ of hashes is called rainbow table.\n\n#### 2 Fool a user into giving us the\
    \ password. Basically this just a combination of `Man in the middle` attacks and\
    \ social engineering attacks. More specifically, it is a combination of `evil\
    \ twin` and phishing. In this attack, you first force a client to disconnect from\
    \ the original WPA-2 network, then force him to connect to a fake open network\
    \ that you create, and then send him a login page in his browser where you ask\
    \ him to enter the password. You might be wondering, why do we need to keep the\
    \ network open and then ask for the password in the browser (can't we just create\
    \ a WPA-2 network and let the user give us the password directly). The answer\
    \ to this lies in the fact that WPA-2 performs mutual authentication during the\
    \ 4-way handshake. Basically, the client verifies that the AP is legit, and knows\
    \ the password, and the AP verifies that the client is legit and knows the password\
    \ (throughout the process, the password is never sent in plaintext). We just don't\
    \ have the information necessary to complete the 4-way handshake.\n\n### 3 Bonus\
    \ : WPS vulnerability and `reaver` [I have covered it in detail separately so\
    \ not explaining it again (I'm only human, and a very lazy one too)]\n\nThe WPA-2\
    \ 4 way handshake procedure. Both AP and the client authenticate each other.\n\
    \n## Tools (Kali)\n\nIn this chapter I'll name some common tools in the wireless\
    \ hacking category which come preinstalled in Kali, along with the purpose they\
    \ are used for.\n\n### 1 Capture packets\n\n- `airodump-ng`\n- `wireshark` (really\
    \ versatile tool, there are books just covering this tool for packet analysis)\n\
    \n### 2 Crack handshakes\n\n- `aircrack-ng` (can crack handshakes as well as WEP)\n\
    - `hashcat` (GPU cracking)\n- `cowpatty`\n\n### 3 WPS\n"
