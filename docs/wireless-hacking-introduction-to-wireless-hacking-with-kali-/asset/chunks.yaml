  trans: "\n\n![](img/cover00061.jpeg)\n\n# 无线破解\n\n## 使用 Kali Linux 进行无线破解入门\nGiulio\
    \ D’Agostino @Julyo78\n\n![](img/image00038.jpeg)\n\n# 1\n\n## 无线破解\n![](img/image00038.jpeg)\
    \ 1\n\n### 前提条件\n无\n\n### 阅读后收获\n你将了解到：\n**隐藏网络对黑客构成了真正的挑战。**\n\n* 你将遇到哪些不同类型的无线网络，以及破解每种网络的难度有多大。\n\
    * 什么是隐藏网络，以及它们是否真的对黑客构成了挑战。\n* 你将对各种“类型”的无线网络实际上是如何被破解的有一个大致的概念。\n\n（最后一点将在下一章中详细介绍）\n\
    \n### 无线安全级别\n下面我用来解释无线网络可能具有的各种安全实现方案的简单要点列表。\n\n假设你是一家俱乐部的经理。关于进入俱乐部，可以有许多可能的情况：\n\
    \n* **开放进入 (Open Entry)**\n    * 开放网络 - 它们不需要密码即可连接无线路由器（访问点）。1 开放进入且不受限制的使用 -\
    \ 任何人都可以直接进去。他们对舞池、免费啤酒等拥有不受限制的访问权限。\n    * 2 这种是开放网络。仅用于公共场所（餐厅等），为用户提供免费的互联网访问（WiFi\
    \ 热点）。在现实中发现此类网络并不多见。\n\n**无线破解通常指的是破解路由器的密码。**\n\n* 3 开放进入但使用受限。任何人都都可以直接进去，但必须为饮料付费。从路由器的安全角度来看，这仍然是一个开放网络。然而，连接到无线路由器（进入俱乐部）并不保证你可以无限制地访问互联网。还有另一层认证。这些常见于公共场所（机场、餐厅、快餐店、购物中心），它们允许你在没有密码的情况下连接到无线网络，但在之后，你和互联网之间还有额外的认证层。这一层通常会限制你访问互联网的能力（通过带宽或时间）。这一层可以用来根据你使用的数据量向你收费。\n\
    \n上述讨论中注意的一点是，无线破解通常是指破解路由器的密码。在登录后你和互联网之间可能存在的额外层是你需要单独处理的，不属于无线破解的范畴。因此，从 WiFi\
    \ 破解的角度来看，上述两种网络都是相同的，都是“开放”的，不需要任何破解。\n\n* **愚蠢的防护进入 (WEP)**\n    * ISP（服务提供商）可能要求用户登录账户以访问互联网。\n\
    \    * 1 **门禁密码且不受限制的访问。**\n      对于一个机器上安装了 `Kali Linux` 的人来说，破解 WEP 无线网络可能只需要几分钟。俱乐部成员每月支付一定金额，即可获得免费饮料。他们必须在俱乐部看起来可疑的入口处说出密码。不幸的是，任何人都可以偷听到密码并进入。这就是受\
    \ WEP 保护的网络。对于机器上安装了 `Kali Linux` 的人来说，破解这种无线网络只需要几分钟。这些都是容易的目标。然而，由于极易被破解，现在发现受\
    \ WEP 保护的网络已越来越少见。`WPA` 和 `WPA-2` 更加常见。\n    * 2 **门禁密码但访问受限。**\n      只有成员可以进入，但他们仍然需要为饮料付费。这种情况发生在网络有密码且访问互联网有额外认证层的情况下。这常见于三种情况：\n\
    \      - 大学通常分配学生的 ID 和密码，学生通过这些信息访问学院提供的互联网设施。\n      - 1 ISP 要求登录 - 许多 ISP 要求用户登录账户以访问互联网。通常登录后会提供一个界面，让用户查看他们的带宽使用、网络套餐详情等。\n\
    \      - 2 大学/学校/办公室 - 许多机构为用户提供账户，他们使用这些账户访问机构的网络。\n\n**取决于密码长度，暴力破解攻击可能需要极长的时间（字面意义上的很久）。**\n\
    \n再次，从无线破解的角度来看，上述两种网络都是“受 WEP 保护的”，而且相当容易破解。\n\n### 良好防护 (Well Guarded Entry)\n\
    在获得无线网络密码后是否存在另一层认证方面，`WEP` 和 `WPA` 情况是相同的。唯一的区别是大学无线路由器使用的是 `WPA` 而不是 `WEP`。因此，这不需要进一步讨论。然而，这里还有我们将在讨论的子类别。\n\
    \n* 1 **通过指纹和视网膜扫描进入** - 进入这个俱乐部的安全性对于大多数目的来说已经足够。攻破这一级别的安全需要花费大量的时间和精力。理论上，如果你愿意付出代价，你可能仍然成功。但一场这种规模的抢劫（如果可以这么说的话）将需要大量的计划，即便如此，很大程度上取决于运气。这是\
    \ `WPA` 安全网络。破解这种网络的唯一方法是通过字典攻击或暴力破解。取决于密码长度，暴力破解可能需要极长的时间（字面意义上的），字典攻击取决于字典的大小需要几天或几周，仍然可能失败（如果密码不在字典中）。[稍后将详细介绍]。所以，如果你想破解\
    \ `WPA` 网络的密码……换个爱好吧。\n    * 2 **通过指纹和视网膜扫描进入，并可以使用快速刷卡以避免排队，因为上述扫描需要时间** - 通过引入这种卡，俱乐部创建了另一种进入路径。虽然这为合法用户节省了时间，但卡可能会被偷。虽然它不像偷听密码（WEP）或直接进入（开放）那么容易。这是开启了\
    \ WPS 的 WPA。WPS 有一个漏洞，允许黑客在 3 小内获得密码（有时可能更长，达 10-12 小时，但这个数字与 `WPA` 相比是不足道的）。就像\
    \ `WEP` 一样，`WPS` 现在是一个众知的弱点，新路由器要么禁用了 `WPS` 或者添加了一些措施（如速率限制），这使得很难，呃，偷成员的钱包。\n\
    \n### 额外说明：隐藏进入 (Hidden entry)\n上述任何俱乐部都可能有一个秘密入口。听起来很酷，对吧？这与我们所谓的“通过隐蔽实现安全”类似。如果你不知道俱乐部的入口在哪里，我们如何进入？嗯，虽然你不知道入口在哪里，但你知道俱乐部在哪里。你有两个选择：\n\
    \n* 1 **被动方法** - 你去附近建筑的楼顶，拿出望远镜，试图找出人们是如何进入建筑的。在无线术语中，你等待客户端连接网络。这可能需要大量时间，但从法医学角度来看相对更安全（通过什么都不做，只是耐心观察，你确保不会留下任何以后可能被用来抓你的线索）。\n\
    \n**隐藏网络并没有为网络提供多少保护，受 WEP 保护的隐藏网络意味着获取密码的时间从 10 分钟增加到 15 分钟。**\n\n"
