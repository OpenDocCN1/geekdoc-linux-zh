  trans: "\n既然你已经了解了这些网络的基础知识，让我们来看看这些网络实际上是如何被黑掉的。我只会列出攻击名称，进一步的细节将在后续教程中提供。\n\n\
    ## WEP\n\n传递给 `RC4` 密器的初始化向量 `v` 是 WEP 的弱点。\n\n大多数攻击都依赖于 `IVs`（初始化向量）的固有缺陷。基本上，如果你收集了足够多的\
    \ `IV`，你就能获得密码。\n\n### 1 被动方法\n\n- 如果你不想留下任何足迹，那么被动方法是你的首选。在这种情况下，你只需要监听网络所在的通道，并捕获数据包（`airodump-ng`）。这些数据包将为你提供\
    \ `IVs`，有了足够的 `IVs` 后，你就可以破解网络（`aircrack-ng`）。我已经有一篇关于这种方法的教程，你可以在这里阅读——使用 `aircrack-ng`\
    \ 套件破解 WEP。\n- **执行此操作的最佳方法之一是请求 ARP 数据包。**\n\n### 2 主动方法\n\n- **ARP 请求重放攻击**：上面的方法可能非常缓慢，因为你需要大量的数据包（由于攻击的性质，无法说具体需要多少，理论上可以是任何数量）。然而，通常所需的包数量通常是\
    \ 5 位。获取这么多数据包非常耗时。不过，有很多方法可以加速这个过程。基本思想是在网络中启动某种对话，然后捕获作为对话结果的数据包。问题是，并不是所有的数据包都带有\
    \ `IVs`。因此，在没有 AP 密码的情况下，你必须让它生成带有 `IVs` 的包。执行此操作的最佳方法之一是请求 ARP 数据包（它们带有 `IVs`，一旦你捕获了至少一个\
    \ ARP 包，就可以轻松生成）。这种攻击被称为 ARP 重放攻击。我们也有这种攻击的教程，ARP 请求重放攻击。\n- Chopchop 攻击\n- 分段攻击\n\
    - Caffe Latte 攻击 \n\n## WPA-2 (以及 WPA)\n\n这里没有你可以轻松利用的漏洞。我们拥有的只有两个选择：猜密码，或者诱骗用户把密码给我们。\n\
    \n### 怎么猜密码？你需要捕获当有效客户端连接到 AP 时传输的一系列数据包。\n\n#### 1 猜密码 - 要猜东西，你需要两样东西：`Guesses`（猜测）和验证。基本上，你需要能够进行大量猜测，并且能够验证它们是否正确。最原始的方法是将猜测输入到操作系统在连接\
    \ wifi 时提供的密码字段中。那将非常慢，因为你必须手动操作。即使你为此写一个脚本，它也会花费时间，因为你必须为每个猜测与 AP 通信（而且每个猜测还要通信多次）。基本上，通过每次询问\
    \ AP 来验证是极其缓慢的。那么，有没有一种方法可以在不询问 AP 的情况下检查我们密码的正确性呢？有的，但前提是你有一个四次握手（4-way handshake）。基本上，你需要捕获当有效客户端连接到\
    \ AP 时传输的一系列数据包。如果你拥有这些数据包（四次握手），那么你就可以针对它们验证你的密码。稍后会有更多细节，但我希望这个抽象概念是清晰的。猜密码有几种不同的方法。\n\
    \n- **暴力破解 (Bruteforce)**：尝试所有可能的密码。在时间足够的情况下，这保证是有效的。然而，即使对于长度为 8 位的字母数字密码，暴力破解也需要极其长时间。如果密码很短且你知道它只由数字组成，这种方法可能很有用。\n\
    - **词列表/字典 (Wordlist/Dictionary)**：在这种攻击中，有一个单词列表，作为可能的密码候选。这些词列表文件包含英语单词、单词组合、拼写错误的单词等。有一些巨大的词列表，大小达几\
    \ GB，许多网络可以使用它们被破解。然而，无法保证你正在尝试破解的网络是否具有列表中的密码。\n**破解密码的一种可能解决方案是创建一个词列表/字典，该字典还可以将明文密码转换为哈希值，以便可以直接在列表中进行检查。**\
    \ 这些攻击可以在合理的时间范围内完成。\n- **彩虹表 (Rainbow table)**：我之前提到的针对四次握手的验证过程涉及对明文密码进行哈希处理，然后与握手中的哈希进行比较。然而，哈希处理（WPA\
    \ 使用 `PBKDF2`）是一项 CPU 型任务，是测试密钥速度的限制因素（这就是为什么有这么多工具使用 GPU 而不是 CPU 来加速破解）。现在，一种可能的解决方案是，我们使用的词列表/字典创建者也可以将明文密码转换为哈希值，以便可以直接检查。遗憾的是，WPA-2\
    \ 在哈希时使用了盐值（salt），这意味着两个具有相同密码的网络如果使用不同的盐，可能会产生不同的哈希。WPA-2 如何选择盐值？它使用网络名称（`SSID`）作为盐值。因此，两个具有相同\
    \ SSID 和相同密码的网络将具有相同的盐。现在，制作词列表的人必须为所有可能的 SSID 创建单独的哈希。实际上，情况是为最常见的 SSID 生成哈希（购买路由器时的默认\
    \ SSID，如 linksys, netgear, belkin 等）。如果目标网络具有这些 SSID 之一，使用预计算的哈希将显著缩短破解时间。这种预计算的哈希表被称为彩虹表。\n\
    \n#### 2 诱骗用户把密码给我们。基本上这只是中间人攻击（Man in middle）和社交工程攻击的结合。更具体地说，它是双生攻击（evil twin）和网络钓鱼（phishing）的结合。在这种攻击中，你首先强制客户端从原始\
    \ WPA-2 网络断开，然后强制连接到你创建的伪开放网络，然后在浏览器中向他发送登录页面让他输入密码。你可能会问，为什么我们需要保持网络开放并在浏览器中询问密码（我们难道不能直接创建一个\
    \ WPA-2 网络让用户直接把密码给我们吗？）。答案在于 WPA-2 在四次握手期间执行双向认证。基本上，客户端验证 AP 是合法的且知道密码，而 AP\
    \ 验证客户端是合法的且知道密码（在整个过程中，密码从未以明文发送）。我们只是完成四次握手所需的信息。\n\n### 3 奖励：WPS 漏洞与 `reaver`\
    \ [我已单独详细介绍过，所以不再解释（我只是人类，而且是一个非常懒的人）]\n\nWPA-2 四次握手过程。AP 和客户端都进行验证。\n\n## 工具\
    \ (Kali)\n\n在本章中，我将列出 Kali 中预装的一些常用的无线攻击类工具，以及它们的用途。\n\n### 1 捕获数据包\n\n- `airodump-ng`\n\
    - `wireshark`（非常有实用的工具，有专门介绍该工具进行包分析的书）\n\n### 2 破解握手\n\n- `aircrack-ng`（可以破解握手，也可以破解\
    \ WEP）\n- `hashcat`（GPU 破解）\n- `cowpatty`\n\n### 3 WPS\n"
