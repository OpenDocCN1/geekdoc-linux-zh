  trans: "\n\n首先，你可以购买一个新的外部无线适配器。其次，你可以与 Windows 并行安装 Kali，或者通过 USB 运行它。虚拟机只有在设备通过\
    \ USB 外部连接时才能使用计算机硬件。现在这里还有一个陷阱：几乎所有的内部适配器都不支持注入（injection）。这对于加速无线黑客攻击非常重要。所以，如果你真的想深入无线黑客攻击，是时候买一个或两个外部适配器了（越多越好）。如果这不可行，你可能需要花上几个小时来尝试获取一个能让你的内部适配器支持注入的驱动程序（我不认识有人成功过这一点，但也许可能是可能的）。\n\
    \n### 检查注入支持\n\n`Acrack-ng` 有一篇关于检查注入支持的详细文章。你可以查看他们的网站。我只提供足够发现注入是否正常运行的命令。\n\
    \n```\nairmon-ng start wlan0 [or wlan1]\n```\n\n（将你的无线适配器设置为监听模式。从现在起，我们将 `wlan0/wlan1`\
    \ 称为 `mon0`）\n\n```\nairserv-ng -d mon0\naireplay-ng -9 127.0.0.1:666\n```\n\n\
    ![](img/image00057.jpeg)\n\n这基本上建立了一个“临时服务器”，等待你测试注入能力。第二个命令实际上尝试向服务器注入，并成功了。`127.0.0.1`\
    \ 是预留给回环的 IP。当你对自己执行某些命令时，始终使用它。`666` 是我们使用的端口。大多数情况下，IP 和冒号后面跟着端口。通用格式类似于 `IP:port`。最后你检查了注入能力，最后一行\
    \ `\"Injection is working!\"` 将确认这一点。\n\n### 检查信号强度\n\n虽然上一章中的基础黑客方法没有真实的强度限制，但你需要物理靠近访问点（AP）才能注入包。同一个\
    \ `aircrack-ng` 教程中有相关信息。再次，我将总结一下在这里需要做什么。\n\n首先，我们将使用 `airodump-ng mon0` 查看范围内的网络列表。找到你想攻击的网络：\
    \ \n\n![](img/image00038.jpeg)`Airodump-ng` 列出了范围内的网络。\n\n现在我们将攻击 digisol 网络。记下你想攻击的网络的\
    \ `BSSID`。一个好的做法是将收集到的所有信息存储在任何文本编辑器中。在这个阶段，我们应该记录以下：\n\n- ESSID - `DIGISOL`\n\
    - BSSID - `00:17:7C:22:CB:80`\n- CH (通道) - `2`\n- 连接到网络的真实用户的 MAC 地址：\n- 接口 :\
    \ `wlan1` - 称为 `mon0`\n\n你应该为你将要操作的网络收集相应的信息。然后，每当我在任何命令中使用这些值时，只需更改它们即可。\n\n\
    注意：我们需要至少有一个用户（有线或无线）连接到网络并正在使用它。这是因为本教程依赖于接收至少一个 ARP 请求包，如果没有活跃的客户端，永远不会有 ARP\
    \ 请求包。\n\n现在，为了检查信号强度是否足够，我们将简单地执行以下代码：\n\n```\nairodump-ng [interface] -c [channel]\n\
    airodump-ng mon0 -c 2\n```\n\n这将使无线卡只读取第 `2` 频道中的数据包，我们的目标网络就在该频道上。\n\n现在测试该网络，输入以下代码：\n\
    \n```\naireplay-ng --test -e DIGISOL -a 00:17:7C:22:CB:80 mon0\n```\n\n![](img/image00058.jpeg)\n\
    \n上一次我们检查无线卡是否有注入包的能力。我们在自己的计算机上测试了它。这次，我们实际上向目标计算机注入了包。如果这有效，那就是非常好的消息，意味着你很可能能够攻击这个网络。最后一行\
    \ `30/30 : 100%` 决定了信号强度有多坏。高百分比是一个好信号，`100` 是理想的。\n\n### 捕获包\n\n现在我们已经运行了几次 `airodump-ng`。然而，这次我们将传递\
    \ `-w` 命令，这将指示 `airodump-ng` 将输出保存到文件中：\n\n```\nairodump-ng -c [channel] --bssid\
    \ [bssid]-w [file_name] [interface]\nairodump-ng -c 2 --bssid 00:17:7C:22:CB:80\
    \ -w dump mon0\n```\n\n输出将保存在文件 `dump-01.cap` 中。\n\n现在我们可以保持此终端运行，它将继续保存数据包。[在之前的教程中，我们只做了两件事：捕获数据包（即这一步）和破解它（即我们最后要做的步骤）。虽然只遵循两个步骤让我们的工作变得更容易，但也让整个过程变得更加耗时，因为我们只是一个被动的数据包监听器，什么都不做。]\n\
    \n### 加速\n\n#### 伪认证\n\n![](img/image00038.jpeg) 现在为了加速，我们将注入网络。这将填充 `airodump-ng`\
    \ 捕获，数据将帮助我们获取密码。一旦我们有了 10000 个数据包，就可以使用 `aircrack-ng` 开始尝试密码。\n\n为了让 AP 注意到注入的包，你必须是一个连接的客户端或伪装成客户端。我们将后者（如果你看到错误\
    \ AP 在通道 `x` 而 `mon0` 在通道 `y`，请查看章节底部）：\n\n```\naireplay-ng -1 0 -e DIGISOL -a\
    \ 00:17:7C:22:CB:80 mon0\n```\n\n#### ARP 请求模式\n\nARP 包是获取大量 IVs 或数据的最佳途径。没有 IVs\
    \ 你无法攻击网络。输入以下代码让 `aireplay-ng` 监听 AP 的 ARP 包，一旦发现一个就注入它们。这将非常快地产生数据。这是真正的加速步骤。\n\
    \n```\naireplay-ng -3 -b [BSSID] mon0\n```\n\n最终代码看起来像这样：\n\n```\naireplay-ng\
    \ -3 -b 00:17:7C:22:CB:80 mon0\n```\n\n现在你必须等待一段时间直到获取 ARP 请求。一旦获取到一个，终端就会开始“爆炸”。数据包将开始填充。现在这一部分，网络中有一个活跃的用户是绝对必要的。\n\
    \n### 破解网络\n\n破解网络就像在控制台中输入以下内容一样简单\n\n```\naircrack-ng name_of_file-01.cap\n\
    ```\n\n在我们的案例，命令将是：\n\n```\naircrack-ng dump-01.cap\n```\n\n![](img/image00059.jpeg)\
    \ 按回车后，你将获得网络列表，并会提示你选择攻击哪一个。在我的案例中只有一个网络，所以我无法获得那个界面或截图。密码在不到一秒的时间内破解了。\n\n![](img/image00060.jpeg)最后你获得了你尝试攻击的网络密码。\n\
    \n"
