- fmt: "\nSo, in this example run, I will try to find out the password of my wireless\
    \ network by making my smartphone connect to a fake AP, and then type out the\
    \ password in the smartphone, and then see if my `Fluxion` instance on my Kali\
    \ machine (laptop) gets the password. Also, for the handshake, I will de-authenticate\
    \ the same smartphone. You can probably follow this guide without having any clue\
    \ how WPA works, what handshake is, what is actually going on, etc., but I suggest\
    \ you do read up about these things.\n\n![](Images/image00047.jpeg)After selecting\
    \ language, this step shows up.\n\nNote how I am not using any external wireless\
    \ card, but my laptop's internal card.\n\nHowever, some internal cards may cause\
    \ problems, so it's better to use an external card (and if you are on a virtual\
    \ machine you will have to use an external card). The scanning process starts,\
    \ using `airodump-ng`.\n\n![](Images/image00048.jpeg)\n\nYou get to choose a target.\
    \ I'm going after network number 21, the one my smartphone is connected to:\n\n\
    ![](Images/image00038.jpeg)\n\nYou choose an attack. I am going to choose the\
    \ `Hostapd` (first one) attack.\n\nIf you had already captured a 4-way handshake,\
    \ then you can specify the location to that handshake and the script will use\
    \ it. Otherwise, it will capture a handshake in the next step for you.\n\n![](Images/image00049.jpeg)If\
    \ you didn't capture a handshake beforehand, then you get to choose which tool\
    \ to use to do that. I'm go with `aircrack-ng`.\n\n![](Images/image00038.jpeg)![](Images/image00050.jpeg)\n\
    \nOnce you have a handshake captured (see the WPA Handshake: [MAC Address] on\
    \ top, if it's there, then you have the handshake), then type 1 and enter to check\
    \ the handshake. If everything's fine, you'll go to the next step.\n\n![](Images/image00051.jpeg)\n\
    \nUse the Web Interface method. I didn't try the bruteforce thing, but I guess\
    \ it's just the usual bruteforce attack that most tools use (and thus no use to\
    \ us, since that's not what we are using this script for). This offers a variety\
    \ of login pages that you can use to get (phish) the WPA network's password. I\
    \ went with the first choice:\n\n![](Images/image00038.jpeg)**55**\n\nAfter making\
    \ your decision, you'll see multiple windows. DHCP and DNS requests are being\
    \ handled in the left two windows, while the right two are status reporting window\
    \ and deauth window (to get users off the actual AP and lure them to our fake\
    \ AP)\n\n![](Images/image00038.jpeg)\n\nIn my smartphone, I see two network of\
    \ the same name. Note that while the original network is WPA-2 protected, the\
    \ fake AP we have created is an open network (which is a huge giveaway stopping\
    \ most people from making the mistake of connecting to it). Anyways, I connected\
    \ to the fake AP, and the DNS and DHCP windows(left ones), reacted accordingly:\n\
    \n![](Images/image00038.jpeg)\n\nAfter connecting to the network, I got a notification\
    \ saying that I need to login to the wireless network. On clicking that, I found\
    \ this page. For some people, you'll have to open your browser and try to open\
    \ a website (say `facebook.com`) to get this page to show up. After I entered\
    \ the password, and pressed submit, the script ran the password against the handshake\
    \ we had captured earlier to verify if it is indeed correct. Note how the handshake\
    \ is a luxury, not a necessity in this method. It just ensures that we can verify\
    \ if the password submitted by the fake AP client is correct or not. If we don't\
    \ have the handshake, then we lose this ability, but assuming the client will\
    \ type the correct password, we can still make the attack work.\n\n![](Images/image00052.jpeg)![](Images/image00038.jpeg)`Aircrack-ng`\
    \ tried the password again the handshake, and as expected, it worked.\n\nWe successfully\
    \ obtained the password to a WPA-2 protected network in a matter of minutes.\n\
    \n# 6\n\n## Hack WPA/WPA2 WPS\n\n![](Images/image00038.jpeg)\n\nWhen it was known\
    \ that a WEP network could be hacked by any kid with a laptop and a network connection\
    \ (using easy peasy tutorials like those on our blog), the security guys did succeed\
    \ in making a much more robust security measure WPA/WPA2.\n\nNow hacking WPA/WPA2\
    \ is a very tedious job in most cases. A dictionary attack may take days, and\
    \ still might not succeed. Also, good dictionaries are huge.\n\nAn exhaustive\
    \ bruteforce including all the alphabets (uppercase lowercase) and numbers, may\
    \ take years, depending on password length. Rainbow tables are known to speed\
    \ things up, by completing a part of the guessing job beforehand, but the output\
    \ rainbow table that needs to be downloaded from the net is disastrously large\
    \ (can be 100s of GBs sometimes). And finally the security folks were at peace.\
    \ But it was not over yet, as the new WPA technology was not at all easy for the\
    \ users to configure. With this in mind, a new security measure was introduced\
    \ to compliment WPA. Wifi Protected Setup (WPS). Now basically it was meant to\
    \ make WPA even tougher to crack, and much easier to configure (push a button\
    \ on router and device connects). However, it had a hole, which was well known,\
    \ `reaver` can exploit it. It still takes hours yield no result: \n\n![](Images/image00038.jpeg)**60**\n\
    \nHere's what wikipedia says about WPS Created by the Wi-Fi Alliance and introduced\
    \ in 2006, the goal of the protocol is to allow home users who know little of\
    \ security to add new devices. Prior to the standard, several competing solutions\
    \ were developed to address same need. A major security flaw was revealed in December\
    \ 2011 that affects wireless routers\n\n### Working Of WPS\n\nNow while most of\
    \ the things are the same as WPA, there is a new concept of using pins for authentication.\
    \ So basically, the client sends 8 digit pins to the access point, which verifies\
    \ it and then allows the client to connect. Now a pin has 8 digits and only contains\
    \ numbers, so its possible target for `brutorce`. Under normal `brutorcing` of\
    \ WPA passwords, you have to consider the fact that there may be number, alphabets,\
    \ and sometimes symbols (and more than 8 letters). This make the task a billion\
    \ times tougher. However, we can try thousands of keys per second, which make\
    \ it a tad bit easier. Now in WPS, there is a delay because we have to wait for\
    \ APs response, and we may only try a few keys per second (practically the best\
    \ I've seen on my PC is 1 key per 2 sec). Basically, 8 digits and 10 possibilities\
    \ per digit (0-9) make it `10^8` (interpret ^ as raised to the power of)seconds\
    \ if we assume one key per second. Now that'll be years. So, where is this taking\
    \ us? The answer is, there are flaws in this technology that can be used against\
    \ it:\n\n- The 8th digit is a checksum of first 7 digits. `10^7` possibilities,\
    \ i.e. one-tenth time. Two months, still a way to go.\n- The pin number for verification\
    \ goes in two halves, so we can independently verify the first four and the last\
    \ four digits. Its easy to guess 4 digits correct two times, than to guess 8 correct\
    \ digits at once. Basically, the first half would take `10^4` guess and the second\
    \ would take `10^3`. Now the guesses would be `10^4 +10^3` (not `10^4 *10 ^3`).\
    \ Now we need 11,000 guesses:\n\n![](Images/image00053.gif)\n"
