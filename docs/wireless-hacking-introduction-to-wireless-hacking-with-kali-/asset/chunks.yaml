- fmt: "\nIf you see any error at this stage, move to the bottom of the page for troubleshooting\
    \ tips. The `-wep` makes it clear to `wifite` that you want to hack WEP wifis\
    \ only. It'll scan the networks for you, and when you think it has scanned enough,\
    \ you can tell it to stop by typing `ctrl+c`. It'll then ask you which wifi to\
    \ hack. In my case, I didn't specify `-wep` so it shows all the wifis in range:\n\
    \n![](Images/image00042.jpeg)\n\nYou can also select all and then go take a nap\
    \ (or maybe go to sleep). When you wake up, you might be hacking all the wifi\
    \ passwords in front of you. I typed one and it had gathered 7000 IVs (data packets)\
    \ within 5 mins. Basically you can except it to hack the wifi in 10 mins approx.\
    \ Notice how it automatically did the fake auth and ARP replay.\n\n![](Images/image00043.jpeg)\n\
    \nHere are a few more screenshots of the working of Wifite, from their official\
    \ website (`./wifite.py` is not something that should bother you. You can stick\
    \ with the simple `wifite`. Also, specifying the channel is optional so even the\
    \ `-c 6` was unnecessary. Notice that instead of ARP replay, the fragmentation\
    \ attack was used, using `-frag`)\n\n![](Images/image00038.jpeg)\n\nHacking WPS\
    \ wasn't fast (it took hours), but it was easy and didn't require you to do anything\
    \ but wait.\n\nWifite makes it possible for you to use any method that you want\
    \ to use, by just naming it. As you saw in the screenshot above, the fragmentation\
    \ attack was carried out just by typing `-frag`. Similarly, many other attacks\
    \ can be played with. A good idea would be to execute the following:\n\n```\n\
    wifite -help\n```\n\nThis will tell you about the common usage commands, which\
    \ will be very useful. Here is the list of WEP commands for different attacks:\n\
    \n- `-wep`: only target WEP networks [off]\n- `-pps <num>`: set the number of\
    \ packets per second to inject [600]\n- `-wept <sec>`: sec to wait for each attack,\
    \ 0 implies endless [600]\n- `-chopchop`: use chopchop attack [on]\n- `-arpreplay`:\
    \ use arpreplay attack [on]\n- `-fragment`: use fragmentation attack [on]\n- `-caffelatte`:\
    \ use caffe-latte attack [on]\n- `-p0841`: use -p0841 attack [on]\n- `-hirte`:\
    \ use hirte (cfrag) attack [on]\n- `-nofakeauth`: stop attack if fake authentication\
    \ fails [off]\n- `-wepca <n>`: start cracking when number of ivs surpass n [10000]\n\
    \n![](Images/image00038.jpeg)![](Images/image00044.jpeg)\n\n- `-wepsave`: save\
    \ a copy of `.cap` files to this directory [off]\n\nAs you can see, its the same\
    \ thing as is there on the help screenshot. Play around with the attacks and see\
    \ what you can do. Hacking WPA without WPS wouldn't be that easy.\n\n![](Images/image00038.jpeg)\
    \ Wifite quits unexpectedly, stating: \"Scanning for wireless devices. No wireless\
    \ interfaces were found. You need to plug in a wifi device or install drivers.\
    \ Quitting.\"\n\n![](Images/image00038.jpeg)\n\nYou are using Kali inside a virtual\
    \ machine most probably. Virtual machine does not support internal wireless card.\
    \ Either buy an external wireless card, or a live boot / side boot with Windows.\
    \ Anything other than Virtual machine in general.\n\n## Fluxion\n\nWifite is cool\
    \ and all, but doesn't do much against the invincible WPA-2 networks. Using a\
    \ combination of evil-twin and man in the middle sort of attacks, fluxion tries\
    \ to fool a client into giving you the key to the WPA-2 protected access point.\
    \ \n\n# 5\n\n### Hacking WPA/WPA2 without dictionary/bruteforce : Fluxion\n\n\
    ![](Images/image00038.jpeg)\n\nFluxion is based on another script called `linset`.\
    \ I did once think about using something like a man in the middle attack/evil\
    \ twin attack to get WPA password during a penetration test instead of going the\
    \ bruteforce/dictionary route. However, once I saw the thread about this cool\
    \ script, I decided to give it a try. So in this chapter I'll show you how I used\
    \ Fluxion, and how you can too.\n\n**Disclaimer**: Use this tool only on networks\
    \ you own. Don't do anything illegal.\n\n#### Contents\n- Checking if tool is\
    \ pre-installed, getting it via github if it isn't.\n- Running the script, installing\
    \ dependencies if required.\n- Quick overview of how to use Fluxion.\n- Detailed\
    \ walk-through and demonstration with text explanation and screenshots\n- Video\
    \ demonstration (not identical to the written demo, but almost the same)\n- Troubleshooting\
    \ section\n\n![](Images/image00045.jpeg)![](Images/image00038.jpeg) **47**\n\n\
    The first thing I did was make sure that Kali doesn't already have this tool.\
    \ Maybe if you are reading this chapter a long time after it was written, then\
    \ you might have the tool preinstalled in Kali. In any case, try this out:\n\n\
    `fluxion`\n\nYou are using Kali inside a virtual machine most probably. Virtual\
    \ machine does not support internal wireless card. Either buy an external wireless\
    \ card, or a live boot / side boot with Windows. Anything other than Virtual machine\
    \ in general.\n\n## Getting the script\n\nGetting the script is just a matter\
    \ of cloning the repository. If you have any problems with this step, then use\
    \ the git command:\n\n```\ngit clone https://github.com/deltax/fluxion\n```\n\n\
    ## Running the script\n\nJust navigate to directory:\n\n```bash\ncd fluxion\n\
    ```\n\nNow, run the script:\n\n```\nsudo ./fluxion\n```\n\n## Dependencies\n\n\
    If you have unmet dependencies, then run the installer script.\n\n```bash\nsudo\
    \ ./Installer.sh\n```\n\nI had 4 dependencies, and the installer run was a buggy\
    \ experience for me. I suggest that after installation is complete, you restore\
    \ `/etc/apt/sources.list` to its original state.\n\n![](Images/image00038.jpeg)\
    \ **48**\n\n![](Images/image00038.jpeg)\n"
