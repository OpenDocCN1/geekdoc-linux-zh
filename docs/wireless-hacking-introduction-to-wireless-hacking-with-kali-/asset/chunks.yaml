    现在假设你想将网络划分为部分。这些部分被称为子网（subnets，也可以称为子网络 subnetworks）。


    我们直接进入主题，考虑掩码 `M`：


    ```

    M = 11111111.11111111.11111111.11000000

    ```


    ![](img/image00038.jpeg)


    现在，前 3 个字节描述网络。但第四字节（本应用于主机）的 2 个最高位（即最左侧的位）为 1。因此，当我们执行按位与操作时，第四字节的两个最高位（最左侧位）将会显示。因此，它们将成为网络地址的一部分。然而，它们属于主机字节。因此，这两个属于主机字节但在网络
    IP 地址中显示的位，将网络划分为多个子网。这 2 位可以表示 4 种可能的组合：00、01、10 和 11，因此网络将有 4 个子网。


    ### 子网络示例


    回到我们之前的 "A"，


    ```

    A   = 11000000.10101000.00000001.xx000001 (192.168.1.1)

    M   = 11111111.11111111.11111111.11000000 (255.255.255.192)

    A&M = 11000000.10101000.00000001.xx000000 (192.168.1.0)

    ```


    此前，无论 `A` 的第四字节中是什么，我们都会在 `A&M` 的第四字节（即网络地址）中得到全 0 值。而这次，我们将在网络地址中得到两个最高位。根据 `xx`
    的值（可以是 00、01、10 或 11），将形成四个 个子网。现在，我们将看到哪个子网拥有哪组主机。


    #### 哪些子网拥有哪些主机：


    - `11000000.10101000.00000001.00000000` (Images/image00038.jpeg) 拥有主机 `192.168.1.0-63`
    (00000000 到 00111111)

    - `11000000.10101000.00000001.01000000` 拥有主机 `192.168.1.64-127` (01000000 到 01111111)

    - `11000000.10101000.00000001.10000000` 拥有主机 `192.168.1.128-191` (10000000 到 10111111)

    - `11000000.10101000.00000001.11000000` 拥有主机 `192.168.1.192-255` (11000000 到 11111111)


    因此，掩码 `M` 将网络划分为 4 个相等的子网，每个有 64 个主机。有些子网要复杂得多，在某些特定领域有应用。我建议查阅 Wikipedia 上关于子网络的页面以获取更多思路。


    ### 一些特殊 IP


    - `0.0.0.0` = 本地机器上的所有 IP。托管在此 IP 上的任何对网络上的所有设备可用。

    - `127.0.0.1` = 本地主机 (LocalHost)，它回环机器本身。

    - `255.255.255.255` = 广播，发送到此 IP 的任何内容将广播（就像广播广播给所有人一样）到网络上的所有主机。


    ![](img/image00038.jpeg) **32**


    ### 结论


    使用 `/24`、`/25`、`/26` 等表示子网的方法在对网络进行漏洞扫描（使用 `nmap` 等）时非常有用。`/24` 代表掩码 `255.255.255.0`，是我们第一个示例无线路由器。这是你在执行
    `nmap` 扫描时常用的配置。我们之后在子网部分讨论的是 `/26`。它有 4 个子网络。`/25` 有 2 个子网。`/27` 有 8 个。`/31`
    有 128 个子网！在这个子网中，每个网络只能有 2 个主机，它用于点对点链路。我希望你下次处理网络时不会遇到困难。还有像组播 (Multicast) 这样的主题，你可以对它们进行进一步阅读。


    ![](img/image00038.jpeg)


    # 破解 Wifi - WEP


    #### 1. 无线适配器的名称


    好了，现在你的电脑有很多网络适配器，为了扫描其中一个，你需要知道它的名称。基本上你需要知道以下内容：

    - `lo` - 回环。不重要。

    - `eth` - 以太网。

    - `wlan` - 这是我们想要的。注意后缀。现在，输入 `ifconfig` 查看所有适配器。注意 `wlan0/1/2` 适配器：(image0040.jpeg)


    #### 2. 开启监听模式


    (image0038.jpeg) 我们将使用名为 `airmon-ng` 的工具创建接口 `mon`。只需输入：


    ```bash

    airmon-ng start wlan0

    ```


    你的监控接口将创建 - Kali 1.x 情况为 `wlan0mon`。


    #### 3. 开始捕捉数据包


    现在我们将使用 `airodump-ng` 捕捉空气中的数据包。该工具收集空气中的无线数据包。你会看到想要破解的 wifi 名称。对于 Kali 2.0 或更高版本，将
    `mon0` 替换为 `wlan0mon`：


    ```bash

    airodump-ng mon0

    ```


    (Images/image0038.jpeg) **36**


    #### 4. 将捕捉的数据包存储到文件中


    通过给 `airodump-ng` 更多参数来实现。对于 Kali 2.0 或更高版本，将 `mon0` 替换为 `wlan0mon`：


    ```bash

    airodump-ng mon0 --write name_of_file

    ```


    (Images/image038.jpeg) 现在捕捉的数据包将存储在 `name_of_file.cap` 中。你必须等待直到获得足够的数据（至少 10000
    个数据包）。注意：这一步不要等太。只需理解原理（包括后续章节），一旦确认你在操作，继续后续教程。在几分钟内使用 10k 个数据包。


    #### 5. 破解 wifi


    如果一切顺利，你将坐在电脑前，最终获得了 10000 个数据包（先停止捕捉）。现在你可以使用 `aircrack-ng` 在新终端破解密码：


    ```bash

    aircrack-ng name_of_file-cap

    ```


    如果有多个，程序将询问破解哪个 wifi。它会完成工作。如果密码足够弱，它就会出现在你面前。如果不是，程序会提示你获取更多数据包。当有 15000 个数据包时，程序会重试。你会得到密钥，格式可能为：`xx:xx:xx:xx`。移除冒号，`xxxxxxxxxx`
    就是无线网络的密码。


    **不起作用？**


    尝试：

    ```bash

    ifconfig wlan0 up

    ifconfig wlan0 down

    airmon-ng check kill

    rfkill unblock all

    ```

    或者：

    ```bash

    ifconfig wlan0mon down

    iwconfig wlan0mon monitor

    ifconfig wlan0mon up

    ```


    **断开了网络 (wifi)?**


    对于 Kali 2.0 或更高版本，将 `mon0` 替换为 `wlan0mon`：


    ```bash

    airmon-ng stop mon0

    ```


    这通常足够了。如果 `wlan0` 未启动（检查 `ifconfig` 或 `iwconfig`），则执行操作（如果你不知道做什么，尽管这样做吧）：


    ```bash

    ifconfig wlan0 up

    ```


    如果 wifi 仍然没有启动，尝试尝试：


    ```bash

    service network-manager restart

    ```


    ### 额外：Wifite


    - 按信号强度（dB）对目标进行排序；首先破解最近的访问点。

    - 自动断开隐藏网络的客户端认证以显示 SSID。

    - 许多过滤器用于指定精确攻击什么（wep/wpa/两者、特定信号强度以上、通道等）。

    - 可自定义设置（超时、数据包/秒等）。

    - “匿名”功能；在攻击前将 MAC 改为随机地址，攻击完成后还原。

    - 所有捕捉的 WPA 握手都会备份到 `wifite.py` 的当前目录。

    - 智能 WPA 取消；在所有客户端和广播取消认证之间循环。

    - 使用 `Ctrl+C` 停止任何攻击，可以选择继续、移动到下一个目标、跳到破解或退出。

    - 退出时显示会摘要；显示任何破解的密钥。

    - 所有密码保存到 `cracked.txt`。

    - 内置更新器：`./wifite.py -upgrade`。


    我觉得在这里提到，它不仅以简单的方法破解 wifi，还以最好的方式破解。例如，当你使用 Wifite 破解 WEP wifi 时，它使用伪造 `auth`
    并使用 ARP 方法加速数据包。


    ### 破解 WEP 网络


    如果你关注我之前关于破解 Wifi (WEP) 的文章，你就知道在开始破解之前有大量的功课要做写。但这里不用。使用 Wifite，它就像一个命令一样简单直接：


    ```bash

    wifite -wep

    ```


    你甚至可能直接使用命令


    ```bash

    wifite

    ```

