- fmt: "\n![](Images/cover00061.jpeg)\n\n# Wireless Hacking\n\n## Introduction to\
    \ Wireless Hacking with Kali Linux\nGiulio D’Agostino @Julyo78\n\n![](Images/image00038.jpeg)\n\
    \n# 1\n\n## Wireless Hacking\n![](Images/image00038.jpeg) 1\n\n### Pre-requisites\n\
    NONE\n\n### Post-reading\nYou will know:\n**Hidden networks offer a real challenge\
    \ to a hacker.**\n\n* What are the different flavors of wireless networks you'll\
    \ encounter and how difficult it is to hack each of them.\n* What are hidden networks,\
    \ and whether they offer a real challenge to a hacker.\n* You'll have a rough\
    \ idea how each of the various 'flavors' of wireless networks is actually hacked.\n\
    \n(The last point would be covered in details in the next chapter)\n\n### Wireless\
    \ Security Levels\nBelow is a simple list of points I use to explain various possible\
    \ security implementations that a wireless network may have.\n\nSuppose you are\
    \ the owner of a club. There can be many possible scenarios as far as entry to\
    \ the club is concerned:\n\n* **Open Entry**\n    * Open networks- They don't\
    \ require passwords to connect to the wireless router (access point). 1 Open entry\
    \ and unrestricted usage - Anyone can walk right in. They have unrestricted access\
    \ to the dance floor, free beer, etc.\n    * 2 This is open network. This is only\
    \ used in public places (restaurants, etc.) which offer free Internet access to\
    \ it's users (WiFi hotspots). It's fairly uncommon to find such networks.\n\n\
    **Wireless hacking usually refers to cracking the router's password.**\n\n* 3\
    \ Open entry but restricted usage. Anyone can walk right in, but have to pay for\
    \ drinks. For the router's security purposes, this is also an open network. However,\
    \ connecting to the wireless router (entering the club) doesn't guarantee you\
    \ unlimited access to the internet. There is another layer of authentication.\
    \ These are seen in public places (airports, restaurants, fast food joints, shopping\
    \ malls) where they let you connect to the wireless network without any password,\
    \ but after that you have an additional layer between you and the internet. This\
    \ layer usually restricts your ability to access the internet (either by bandwidth\
    \ or by time). This layer can be used to charge you for the amount of data you\
    \ use.\n\nThe point to note in the discussion above is that wireless hacking usually\
    \ refers to cracking the router's password. The additional layer which might be\
    \ present between you and the internet after you login is something you'll have\
    \ to deal with separately, and is not covered under wireless hacking. So, from\
    \ wifi hacking perspective, both the networks above are the same, \"open\", and\
    \ do not require any hacking.\n\n* **Stupidly Guarded Entry (WEP)**\n    * ISPs\
    \ may require users to login to their accounts to access the internet.\n    *\
    \ 1 **Password at door and unrestricted access.**\n      For a person who has\
    \ `Kali Linux` installed on his machine, hacking of a WEP wireless network might\
    \ be a matter of minutes.      The member of the club pay a certain amount every\
    \ month, and get access to free drinks. They have to say the password at the shady\
    \ looking entrance to the club. Unfortunately, it's quite easy for anyone to overhear\
    \ the password and get in. This is WEP protected network. For a person who has\
    \ `Kali Linux` installed on his machine, hacking this kind of wireless network\
    \ is a matter of minutes. These are easy targets. However, nowadays it's fairly\
    \ uncommon to find WEP protected networks, because of the ease with which they\
    \ can be hacked into. `WPA` and `WPA-2` are more common.\n    * 2 **Password at\
    \ door but restricted access.**\n      Only members can enter, but they still\
    \ have to pay for their drinks. This is the case when the network has password\
    \ and an additional layer to get access to the internet. This is common in three\
    \ cases:\n      - Colleges often allocate student's IDs and Passwords using which\
    \ students can access Internet facilities offered by the institute\n      - 1\
    \ ISP requires login - Many ISP's require users to login to their account to access\
    \ the internet. Often logging in provides an interface which lets the users see\
    \ their bandwidth usage, details of their network plan, etc.\n      - 2 Colleges/\
    \ Schools/Offices - Many institutes provide users accounts which they use to access\
    \ the institutes' network. \n\n**Bruteforce attacks may take forever (literally)\
    \ depending on the length of the password.**\n\nAgain, from the wireless hacking\
    \ perspective, both the networks above are \"WEP protected\", and are rather simple\
    \ to hack into.\n\n### Well Guarded Entry\nAs far as the bifurcation into whether\
    \ or not another layer of authentication is present once you have the wireless\
    \ network password is concerned, `WEP` and `WPA` cases are the same. The only\
    \ difference is that the college wireless routers have `WPA` instead of `WEP`.\
    \ Thus, this doesn't merit further discussion. However, there's another subcategory\
    \ in this that we will discuss.\n\n* 1 **Fingerprint and retinal scan for entry**\
    \ - The entry to this club is secure enough for most purposes. Getting past this\
    \ level of security takes a lot of time and efforts. Theoretically, if you're\
    \ willing to do what it takes, you may still get it. But a heist (if I may call\
    \ it that) of this magnitude will take a lot of planning, and even then, a lot\
    \ depends on sheer luck. This is `WPA` secure network. The only way to crack this\
    \ network with dictionary or bruteforce attacks. Bruteforce attacks may take forever\
    \ (literally) depending on the length of the password, and dictionary attacks\
    \ too will take days/weeks depending on size of dictionary, and still may fail\
    \ (if the password is not in the dictionary). [More on this later]. So if you\
    \ want to crack the password of a `WPA` network... get a new hobby.\n* 2 **Fingerprint\
    \ and retinal scan for entry, and a card which you can quickly swipe to avoid\
    \ standing in a queue since the aforementioned scans take some time** - By introducing\
    \ this card the club created an alternate path for entry. While this saves time\
    \ for the legitimate users, the card can be stolen. While it's not as easy as\
    \ overhearing the password (`WEP`), or walking right in (open). This is `WPA`\
    \ with `WPS` enabled. WPS has a vulnerability which allows a hacker to get a password\
    \ in 3 hours (can be more sometimes, up to 10-12 hours, but that figure is nothing\
    \ compared to `WPA`). Just like `WEP`, `WPS` is now a well known weak point and\
    \ new routers have either disabled `WEP` or added some measures (like rate limiting)\
    \ which make it really hard to, well, pickpocket the members.\n\n### Bonus: Hidden\
    \ entry\nAny of the above clubs could have a secret entrance. Sounds cool, right?\
    \ This is somewhat similar to what we call \"Security Through Obscurity\". How\
    \ we get in if you don't know where the club's entrance is? Well, while you don't\
    \ know where the club entrance is, you know where the club is. You have two options:\n\
    \n* 1 **Passive method** - You go to the roof of a nearby building, take your\
    \ binoculars out, and try to find out how people enter the building. In wireless\
    \ terms, you wait till a client connects to the network. This may take a lot of\
    \ time, but it's relatively safer from a forensic viewpoint (by not doing anything,\
    \ just watching patiently, you ensure that you don't leave any clues behind which\
    \ may later be used to catch you).\n\n**Hidden networks don't really offer much\
    \ protection to a network, and a WEP protected hidden network just means that\
    \ instead of 10 mins it will take 15 mins to get the password.**\n"
