    # 2 Wireless Hacking


    ![](Images/image00038.jpeg)


    ### You should know:

    - What are the different flavors of wireless networks you''ll encounter and how
    difficult it is to hack each of them.

    - What are hidden networks, and whether they offer a real challenge to a hacker.

    - Have a very rough idea how each of the various ''flavors'' of wireless networks
    is actually hacked.


    ### You will know:

    - Know even more about different flavors of wireless networks.

    - How to go about hacking any given wireless network.

    - Common tools and attacks that are used in wireless hacking.


    ## WEP, WPA and WPA-2


    `WEP is the flawed ship in the above discussion. The aim of Wireless Alliance
    was to write an algorithm to make wireless network (WLAN) as secure as wired networks
    (LAN). This is why the protocol was called Wired Equivalent Privacy (privacy equivalent
    to the one expected in a traditional wired network). Unfortunately, while in theory
    the idea behind WEP sounded bullet-proof, the actual implementation was very flawed.
    The main problems were static keys and weak IVs. For a while attempts were made
    to fix the problems, but nothing worked well enough(WEP2, WEPplus, etc. were made
    but all failed).`


    `WPA was a new WLAN standard which was compatible with devices using WEP encryption.
    It fixed pretty much all the flaws in WEP encryption, but the limitation of having
    to work with old hardware meant that some remnants of the WEPs problems would
    still continue to haunt WPA. Overall, however, WPA was quite secure. In the above
    story, this is the remodeled ship.`


    `WPA-2 is the latest and most robust security algorithm for wireless networks.
    It wasn''t backwards compatible with many devices, but these days all the new
    devices support WPA-2. This is the invincible ship, the new model with a stronger
    alloy.`


    - Very few tools exist which carry out the attacks against WPA networks properly
    (the absence of proof-of-concept scripts means that you have to do everything
    from scratch, which most people can''t).

    - All these attacks work only under certain conditions (key renewal period must
    be large, QoS must be enabled, etc.)


    Because of these reasons, despite WPA being a little less secure than WPA-2, most
    of the time, a hacker has to use brute-force/dictionary attack and other methods
    that he would use against WPA-2, practically making WPA and WPA-2 the same thing
    from his perspective.


    PS: There''s more to the WPA/WPA-2 story than what I''ve captured here. Actually
    WPA or WPA-2 are ambiguous descriptions, and the actual intricacy (PSK, CCMP,
    TKIP, X/EAP, AES w.r.t. cipher used and authentication used) would required further
    diving into personal and enterprise versions of WPA as well as WPA-2.


    ## How to Hack


    Now that you know the basics of all these network, let''s get to how actually
    these networks are hacked.


    ### WEP


    ![](Images/image00038.jpeg)Most of the attacks rely on inherent weaknesses in
    IVs (initialization vectors). Basically, if you collect enough of them, you will
    get the password.


    #### 1 Passive method

    - If you don''t want to leave behind any footprints, then passive method is the
    way to go. In this, you simply listen to the channel on which the network is on,
    and capture the data packets (`airodump-ng`). These packets will give you IVs,
    and with enough of these, you can crack the network (`aircrack-ng`). I already
    have a tutorial on this method, which you can read here - Hack WEP using aircrack-ng
    suite.


    #### 2 Active methods

    - **ARP request replay**: The above method can be incredibly slow, since you need
    a lot of packets (there''s no way to say how many, it can literally be anything
    due the nature of the attack. However, usually the number of packets required
    ends up in 5 digits). Getting these many packets can be time consuming. However,
    there are many ways to fasten up the process. The basic idea is to initiate some
    sort of conversation in the network, and then capture the packets that arise as
    the result of the conversation. The problem is, not all packets have IVs. So,
    without having the password to the AP, you have to make it generate packets with
    IVs. One of the best ways to do this is by requesting ARP packets (which have
    IVs and can be generated easily once you have captured at least one ARP packet).
    This attack is called ARP replay attack. We have a tutorial for this attack as
    well, ARP request replay attack.

    - **Chopchop attack**

    - **Fragmentation attack**

    - **Caffe Latte attack**


    I''ll cover all these attacks in detail separately (I really can''t summarize
    the bottom three).


    ### WPA-2 (and WPA)


    There are no vulnerabilities here that you can easily exploit. The only two options
    we have are to guess the password or to fool a user into giving us the password.


    #### 1 Guess the password

    - For guessing something, you need two things : Guesses (duh) and Validation.
    Basically, you need to be able to make a lot of guess, and also be able to verify
    if they are correct or not. The naive way would be to enter the guesses into the
    password field that your OS provides when connecting to the wifi. That would be
    slow, since you''d have to do it manually. Even if you write a script for that,
    it would take time since you have to communicate with the AP for every guess(that
    too multiple times for each guess). Basically, validation by asking the AP every
    time is slow. So, is there a way to check the correctness of our password without
    asking the AP? Yes, but only if you have a 4-way handshake. Basically, you need
    the capture the series of packets transmitted when a valid client connects to
    the AP. If you have these packets (the 4-way handshake), then you can validate
    your password against it. More details on this later, but I hope the abstract
    idea is clear. There are a few different ways of guessing the password:

    - **Bruteforce**: Tries all possible passwords. It is guaranteed that this will
    work, given sufficient time. However, even for alphanumeric passwords of length
    8 characters, bruteforce takes incredibly long. This method might be useful if
    the password is short and you know that it''s composed only of numbers.

    - **Wordlist/Dictionary**: In this attack, there''s a list of words which are
    possible candidates to the password. These word list files contains english words,
    combinations of words, misspelling of words, and so on. There are some huge wordlists
    which are many GBs in size, and many networks can be cracked using them. However,
    there''s no guarantee that the network you are trying to crack would have it''s
    password in the list. These attacks get completed within a reasonable timeframe.

