    Your monitoring interface will be created - mon0 in case of Kali 1.x, wlan0mon\
    \ in all other cases. \n\n![](Images/image00041.jpeg)3\\. Start capturing packets\n\
    \n Now, we'll use airodump-ng to capture the packets in the air. This tool gathers\
    \ data from the wireless packets in the air. You'll see the name of the wifi you\
    \ want to hack. For kali 2.0 or rolling, replace mon0 with wlan0mon \n\n*airodump-ng\
    \ mon0*\n\n![](Images/image00038.jpeg)**36**\n\n4\\. Store the captured packets\
    \ in a file \n\nThis can be achieved by giving some more parameters with the airodump\
    \ command. For Kali 2.0 or rolling, replace mon0 with wlan0mon.\n\n*airodump-ng\
    \ mon0 --write name_of_file*\n\n![](Images/image00038.jpeg)Now the captured packets\
    \ will be stored in name_of_file.cap\n\nYou will have to wait till you have enough\
    \ data (10000 minimum)\n\n PS: Don't wait too long for this step though. Just\
    \ understand how the procedure works (including the next sections), and once you\
    \ are convinced you know what you are doing, proceed to the next tutorial where\
    \ we use ARP replay to speed up the rate at which we gets packets. Using ARP request\
    \ replay, we can get 10k packets in a few minutes. 5. Crack the wifi\n\nIf all\
    \ goes well ,then you'll be sitting in front of your pc, grinning, finally you've\
    \ got 10000 packets (don't stop the packet capture yet). Now, you can use aircrack-ng\
    \ to crack the password. (in a new terminal)\n\n*aircrack-ng name_of_file-01.cap *\n\
    \nThe program will ask which wifi to crack, if there are multiple available. Choose\
    \ the wifi. It'll do its job. If the password is weak enough, then you'll get\
    \ it in front of you. If not, the program will tell you to get more packets. The\
    \ program will retry again when there are 15000 packets, and so on.\n\nYou'll\
    \ get the key, probably in this format:\n\n*xx:xx:xx:xx:xx*\n\nRemove the colons\n\
    \nxxxxxxxxxx is the password of the wireless network\n\nNot working?\n\nTry this:\n\
    \n*ifconfig wlan0 up\n\nifconfig wlan0 down\n\nairmon-ng check kill\n\nrfkill\
    \ unblock all*\n\nor this:\n\n*ifconfig wlan0mon down\n\niwconfig wlan0mon mode\
    \ monitor\n\nifconfig wlan0mon up*\n\n**Disconnected from internet (wifi)?**\n\
    \nReplace mon0 with wlan0mon for Kali 2.0 or rolling.\n\n*airmon-ng stop mon0*\n\
    \nThis is usually sufficient. If wlan0 is not up (check ifconfig or iwconfig),\
    \ then do this (if you don't know what to do, then do this anyway)\n\n*ifconfig\
    \ wlan0 up*\n\nIf wifi still doesn't start, try this too\n\n*service network-manager\
    \ restart*\n\n**EXTRAS\n\nWifite**\n\n• Sorts targets by signal strength (in dB);\
    \ cracks closest access points first\n\n• Automatically de-authenticates clients\
    \ of hidden networks to reveal SSIDs\n\n• Numerous filters to specify exactly\
    \ what to attack (wep/wpa/both, above certain signal strengths, channels, etc)\n\
    \n• Customizable settings (timeouts, packets/sec, etc) • \"Anonymous\" feature;\
    \ changes MAC to a random address before attacking, then changes back when attacks\
    \ are complete\n\n• All captured WPA handshakes are backed up to wifite.py's current\
    \ directory\n\n• Smart WPA de-authentication; cycles between all clients and broadcast\
