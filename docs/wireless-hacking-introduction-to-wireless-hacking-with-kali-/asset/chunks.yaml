    \ (Kali)**\n\nIn this section I'll name some common tools in the wireless hacking\
    \ category which come preinstalled in Kali, along with the purpose they are used\
    \ for.\n\n1 Capture packets\n\n◦ airodump-ng \n\n◦ wireshark (really versatile\
    \ tool, there are books just covering this tool for packet analysis)\n\n2 Crack\
    \ handshakes\n\n◦ aircrack-ng (can crack handshakes as well as WEP)\n\n◦ hashcat\
    \ (GPU cracking)\n\n◦ cowpatty\n\n3 WPS\n\n◦ reaver\n\n◦ pixiewps (performs the\
    \ \"pixie dust attack\")\n\n4 Cool tools\n\n◦ aireplay-ng (WEP mostly)\n\n◦ mdk3\
    \ (cool stuff)\n\n5 Automation\n\n◦ wifite\n\n![](Images/image00038.jpeg) ◦ fluxion\
    \ (actually it isn't a common script at all, but since I wrote a tutorial on it,\
    \ I'm linking it)\n\n# 3\n\n### Networking Basics: IP address, Netmasks and Subnets\n\
    \n![](Images/image00038.jpeg)**IP address**\n\n An IP address is simply a 32 bit\
    \ address that every device on any network (which uses IP/ TCP protocol) must\
    \ have. It is usually expressed in the decimal notation instead of binary because\
    \ it is less tedious to write it that way. For example, \n\nDecimal notation -\
    \ 192.168.1.1\n\nBinary  - 1000000.10101000.00000001.00000001\n\n![](Images/image00039.gif)\n\
    \n It is clear from the binary form that the IP is indeed 32 bits. It can range\
    \ from 0.0.0.0 to 255.255.255.255 (for the binary all 0s and all 1s respectively)\
    \ [A lot of time, the first octet usually goes up to 127. However, we aren't concerned\
    \ with that here.]\n\n**Parts of an IP address**\n\nNow this IP address has 2\
    \ parts, the network address and host address. A lot of wireless routers keep\
    \ the first 3 octets (8 bits, hence octets) for the network address and the last\
    \ octet as host address. A very common configuration being 192.168.1.1 Here, 192.168.1.0\
    \ is the network address and 0.0.0.1 is host address. I hope you can see that\
    \ the host address can vary from 0.0.0.0 to 0.0.0.255 (though usually 0 and 255\
    \ are reserved for the network and broadcast respectively). \n\n**Netmasks**\n\
    \n![](Images/image00038.jpeg)\n\n But di fferent networks have different needs.\
    \ The previous configuration lets you have a lot of different possible networks\
    \ (the first 3 octets are for the network and can take different values, not just\
    \ 192.168.1.0) but only 256 (254 actually) hosts. Some networks may want more\
    \ hosts (more than 255 hosts per network). This is why there is no \"hardcoded\"\
    \ standard enforced on networks for the network and host addresses, and instead,\
    \ they can specify their own configuration. The first 3 octets being network address\
    \ and last octet being host address is common, but in no way mandatory. Using\
    \ Netmasks, we can have very versatile set of configurations, for each and every\
    \ need.\n\nA netmask is used to divide the IP address in subnets. \n\nWe'll start\
    \ with a basic example. Suppose we want to define a netmask which configures our\
    \ network like wireless router in the previous example. We want the first 3 octets\
    \ to correspond to the network and next 1 octet for host address. \n\nLet's think\
    \ of an operation which we can use to separate the network and host part of the\
    \ IP address. For simple purposes, we could have just defined after which octet\
    \ does the host part start [basically saying that anything after the third period\
    \ (.) is host address]. While this is a simple solution, it is not very versatile. \n\
    \nA more elegant and mathematical solution was proposed.\n\n**Netmask**\n\nFirst,\
    \ I'll tell you the mathematical functionality of a netmask. Assume A to be an\
    \ IP address and M to be a netmask. Then, \n\nA & M gives the Network address\n\
    \nA & (~M) gives the Host address.\n\nWhere,\n\n& is bitwise And ~ is bitwise\
    \ Not (i.e. complement, 1s complement to be more precise)\n\nA netmask is another\
    \ 32 bit binary number (just like an IP address), but with the purpose of giving\
    \ Host address and network address when the operation bitwise and is carried out\
    \ on it (and it's complement) with A.\n\n**Example**\n\nA = 192.168.1.1 is you\
    \ IP address\n\nM = 255.255.255.0\n\nWe convert it  to binary, and then carry\
    \ out the desired operations.\n\nA   =    11000000.10101000.00000001.00000001\
    \  (192.168.1.1)\n\nM   =    11111111.11111111.11111111.00000000  (255.255.255.0)\n\
    \nA&M =    11000000.10101000.00000001.00000000  (192.168.1.0)\n\nA&M is network\
    \ IP that we desired\n\nA   =    11000000.10101000.00000001.00000001  (192.168.1.1)\n\
    \n~M  =    00000000.00000000.00000000.11111111  (0.0.0.255)\n\nA&~M=    00000000.00000000.00000000.00000001 \
    \ (0.0.0.1)\n\nA&~M is host IP that we desired\n\n**Explanation**\n\nBasically,\
    \ if you realize that 11111111 is 255 in decimal, then you can see that for the\
    \ parts of the IP address that you want for networks, you set the subnet to 255,\
    \ and for the ones you want for host, you set it to 0. \n\nSo, if you want to\
    \ reserve 2 octets for networks and 2 for hosts, then the subnet will be\n\nM\
    \ = 255.255.0.0\n\nIf you want 3 octets for host, then\n\nM = 255.0.0.0\n\nHence,\
    \ we can see that using netmasks we can achieve what we wanted, i.e. to define\
    \ networks with whatever number of hosts we require. Now we go a bit further.\n\
    \n**Subnets**"
