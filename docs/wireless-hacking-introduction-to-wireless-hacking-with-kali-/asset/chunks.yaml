    如果你在此阶段看到任何错误，请移动到页面底部查看故障排除提示。`-wep` 参数会让 `wifite` 明确知道你只想破解使用 WEP 加密的 wifi 网络。它会为你扫描网络，当你认为它已经扫描了足够时，可以输入
    `ctrl+c` 告诉它停止。然后它会询问你想要破解哪个 wifi。在我的情况下，我没有指定 `-wep`，所以它显示了范围内的所有 wifi：


    ![](img/image00042.jpeg)


    你也可以选择全选（all），然后去睡个午觉（或者可能去睡个大觉）。当你醒来时，你可能正在破解面前所有的 wifi 密码。我输入了一个，它在 5 分钟内就收集了
    7000 个 IV（数据包）。基本上，你可以预计大约在 10 分钟就能破解 wifi。注意看它是如何进行伪造认证和 ARP 重放的。


    ![](img/image00043.jpeg)


    这里是 Wifite 运行的更多截图，来自它们的官方网站（`./wifite.py` 并不是你需要担心的东西。你可以继续使用简单的 `wifite`。此外，指定通道是可选的，所以即使是
    `-c 6` 也是没。注意它没有使用 ARP 重放，而是使用了 `-frag` 进行碎片攻击）


    ![](img/image00038.jpeg)


    破解 WPS 并不快（花费了几个小时），但它很容易，不需要除了等待之外什么都不用做。


    Wifite 让你能够通过命名来使用任何你想使用的方法。正如你在上面的截图中所示，通过输入 `-frag` 即可执行碎片攻击。同样，还可以进行许多其他攻击。一个好主意是执行以下命令：


    ```

    wifite -help

    ```


    这将告诉你常用的用法命令，这些将非常有用。以下是针对不同攻击的 WEP 命令列表：


    - `-wep`: 仅针对 WEP 网络 [关闭]

    - `-pps <num>`: 设置每秒注入的数据包数量 [600]

    - `-wept <sec>`: 每次攻击的等待秒数，0 表示无限 [600]

    - `-chopchop`: 使用 chopchop 攻击 [开启]

    - `-arpreplay`: 使用 arpreplay 攻击 [开启]

    - `-fragment`: 使用碎片攻击 [开启]

    - `-caffelatte`: 使用 caffe-latte 攻击 [开启]

    - `-p0841`: 使用 -p0841 攻击 [开启]

    - `-hirte`: 使用 hirte (cfrag) 攻击 [开启]

    - `-nofakeauth`: 如果伪造认证失败则停止攻击 [关闭]

    - `-wepca <n>`: iv 数量超过 n 时开始破解 [10000]


    ![](img/image00038.jpeg)![](img/image00044.jpeg)


    - `-wepsave`: 将 `.cap` 文件副本保存到此目录 [关闭]


    如你所见，这与帮助截图中的是一样的。尝试各种攻击并看看你能做什么。在没有 WPS 的情况下破解 WPA 并不那么容易。


    ![](img/image00038.jpeg) Wifite 意外退出，显示：“扫描无线设备。未找到无线接口。你需要插入 wifi 设备或安装驱动程序。正在退出。”


    ![](img/image00038.jpeg)


    你可能是在虚拟机中使用 Kali。虚拟机不支持内置无线卡。要么购买外部无线卡，要么使用带有 Windows 的实时启动/侧启动。通常情况下，虚拟机以外的都可以。


    ## Fluxion


    Wifite 虽然很酷，但对无懈可的 WPA-2 网络作用不大。通过结合邪恶孪生（evil-twin）和中间人攻击之类的手段，fluxion 试图欺骗客户端向你提供受
    WPA-2 保护访问点的密钥。


    # 5


    ### 无需字典/暴力破解破解 WPA/WPA2：Fluxion


    ![](img/image00038.jpeg)


    Fluxion 基于另一个名为 `linset` 的脚本。我曾想过在渗透测试中使用类似中间人攻击/邪恶孪生攻击的方法获取 WPA 密码，而不是采用暴力破解/字典路线。然而，一旦我看到关于这个酷炫脚本的帖子，我决定尝试一下。因此在本章中，我将向你展示如何使用
    Fluxion，以及你如何这样做。


    **免责声明**：仅在你拥的网络上使用此工具。不要做任何非法行为。


    #### 目录

    - 检查工具是否已预安装，如果没有，通过 github 获取。

    - 运行脚本，根据需要安装依赖项。

    - 如何使用 Fluxion 的快速概述。

    - 带有文字说明和截图的详细步骤和演示

    - 视频演示（与文字演示不完全相同，但几乎一样）

    - 故障排除章节


    ![](img/image00045.jpeg)![](img/image00038.jpeg) **47**


    我做的第一件事是确保 Kali 已经没有这个工具。也许如果你在本文编写很久之后读到这一章，那么 Kali 可能已经预装了该工具。无论如何，尝试一下这个：


    `fluxion`


    你可能是在虚拟机中使用 Kali。虚拟机不支持内置无线卡。要么购买外部无线卡，要么使用带有 Windows 的实时启动/侧启动。通常情况下，虚拟机以外的都可以。


    ## 获取脚本


    获取脚本只需要克隆仓库。如果你在此步骤遇到任何问题，请使用 git 命令：


    ```

    git clone https://github.com/deltax/fluxion

    ```


    ## 运行脚本


    进入目录：


    ```bash

    cd fluxion

    ```


    现在，运行脚本：


    ```

    sudo ./fluxion

    ```


    ## 依赖项


    如果有未满足的依赖项，请运行安装脚本。


    ```bash

    sudo ./Installer.sh

    ```


    我有 4 个依赖项，安装过程对我来说是一个糟糕的体验。我建议在安装完成后，将 `/etc/apt/sources.list` 恢复到原始状态。


    ![](img/image00038.jpeg) **48**


    ![](img/image00038.jpeg)


