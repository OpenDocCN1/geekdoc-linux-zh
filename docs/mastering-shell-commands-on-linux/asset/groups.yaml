- md: '

    Without any options on the command, it only copies the contents of the file and
    not the attributes of the file such as permissions, ownership, modification date,
    etc.


    If you want to copy the file to another directory, specify the full path of the
    new file: see example below


    ```

    cp file.txt /home/user/documents/newfile.txt

    ```


    If you want to keep the attributes of the source file when copying, use the "-p"
    option with the "cp" command, like this


    ```

    cp -p file1.txt file2.txt

    ```


    This will copy file "file1.txt" to "file2.txt" retaining its attributes.


    ```

    cp file1.txt /var/www

    ```


    The command copies the file "file1.txt" into the "/var/www" directory of the file
    system.


    ```

    cp -r directory1 directory2

