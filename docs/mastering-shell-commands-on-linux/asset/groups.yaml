    - total: the total amount of physical memory available on the system;

    - used: the amount of memory currently used by the system;

    - free: the amount of memory currently available for new operations

    - shared: the amount of memory shared between several processes;

    - buffers: the amount of memory used by the system to store temporary data;

    - cache: the amount of memory used by the system to store cached data;

    - available: the amount of memory available for new operations, which includes
