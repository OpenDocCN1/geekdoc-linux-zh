    在当前目录及其子目录下查找所有大于 100KB 的 .txt 文件，并将它们拷贝到名为 "bigfiles" 的新目录。


    修正：


    - "find ": 查找当前目录及其子目录下的所有文件。

    - "-name "*.txt": 查找所有具有 .txt 扩展的文件。

    - "-size +100k": 查找所有大于 100KB 的文件。

    - -exec cp {} bigfiles;: 对于找到的每个文件，将其拷贝到 bigfiles 目录。"{}" 被替换为找到的文件名，";" 结束 -exec
    执行的命令。


