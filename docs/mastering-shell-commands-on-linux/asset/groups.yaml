    mkdir -p $backup_dir

    ```


    fi


    # # Create the backup archive


    ```

    tar czf $backup_dir/$archive_file $files_to_backup

    ```'
  - '[PAGE 275]


    A variable is a named memory location that can hold a value that can be changed.
    Variables are often used to store values that can be used by programs, shell scripts,
    and work environments.


    There are two types of variables in Linux: system variables and user variables.


    System variables:

    System variables are predefined and built-in variables in the Linux operating
    system. They are used by the operating system to store system information such
    as host name, user name, path to system files, etc.


    Examples of system variables:

    $PATH: This variable contains a colon-separated list of directories where executable
    programs can be found.

    $HOME: This variable contains the full path to the current user''s directory.

    $USER: this variable contains the name of the current user.

    $HOSTNAME: this variable contains the name of the host (name of the machine) on
    which the user is connected.


    User variables:

    User variables are user-defined variables that can be used in shell scripts and
    desktop environments. They are created by assigning a value to a specific variable
    name.'
  - '[PAGE 276]


    Examples of user variables:


    $MY_VAR: This variable contains a user-defined custom value.


    $INPUT: This variable can be used to store user input from the keyboard or other
    input device.


    $OUTPUT: This variable can be used to store the output of a program or shell script.


    Variables can be used to store temporary or permanent information, such as system
    configurations, file paths, file names, etc. They can be defined and used in shell
    scripts, programs or work environments to store and retrieve important information.'
  - '[PAGE 277]


    Using the PATH variable:

    The PATH variable is used to define directories where executable programs can
    be found. If you want to run the ''ls'' program from the terminal, the operating
    system looks for the ''ls'' file in the directories defined in the PATH variable.
    If ''ls'' is present in one of these directories, it will be executed.

    To add a new directory to the PATH variable, you can use the following command:


    ```

    export PATH=$PATH:/path/to/new/directory

    ```


    In this example, the PATH variable is modified to include the new directory ''/path/to/new/directory''.


    Using custom variables:

    Custom variables can be used to store temporary or permanent information. If you
    want to store the name of a file in a variable, you can use the following command:


    ```

    MY_FILE="my_file.txt"

    ```


    The MY_FILE variable is created and initialized with the value "my_file.txt".
    This variable can be used in shell scripts to perform operations on the stored
    file.'
  - '[PAGE 278]


    Using the USER variable:


    The USER variable contains the name of the current user. It can be used to customize
    shell scripts or programs based on the user running them. If you want to display
    a personalized welcome message for each user, you can use the following command
    in a shell script:


    ```

    echo "Welcome, $USER!"

    ```


    The USER variable is used to display the current user''s name in the welcome message.'
  - '[PAGE 279]


    wc is used to count words, lines and bytes (or characters) in a text file.

    The name "wc" is an abbreviation of "word count", which means "wordnter" in English.


    When you run the command wc, you can specify one or more files as arguments to
    the command. Then wc will show the number of lines, words and bytes in each of
    these files.


    If you run the command "wc myfile.txt", wc will show the number of lines, words
    and bytes in the file myfile.txt. If you run the command "myfile1.txt myfile2.txt",
    wc will show the number of lines, words and bytes in both files myfile.txt and
    myfile2.txt.


    The result of the wc command is displayed in the terminal, usually as a line of
    text. Count information is generally displayed in this order: line count, word
    count, and byte count.


    Using the wc command options, you can also tell wc to only count lines, words,
    or bytes. If you run the command "wc -l myfile.txt", wc will only show the number
    of lines in the file myfile.txt.

    Count the number of lines, words and bytes in a file:


    ```

    wc myfile.txt

    5 20 128 myfile.txt

    ```'
  - '[PAGE 280]


    In this example, wc shows that the file "myfile.txt" contains 5 lines, 20 words
    and 128 bytes.


    Count only the number of lines in a file:


    ```

    wc -l myfile.txt

    5 myfile.txt

    ```


    Here, using the "-l" option, wc only counts the number of lines in the "myfile.txt"
    file.'
  - '[PAGE 281]


    Count the total number of lines, words, and bytes in multiple files:


    ```

    wc file1.txt file2.txt file3.txt

    34 155 1024 file1.txt

    25 130 896 file2.txt

    18 98 672 file3.txt

    77 383 2592 304

    ```


    In this example, wc counts the number of lines, words, and bytes in the files
    "file1.txt", "file2.txt", and "file3.txt", then displays the total for all three
    files.


    Count the number of words in a string:


    ```

    echo "This is a string." | wc -w

    ```


    In this case, the echo command is used to print a string, then the wc command
    is used with the "-w" option to count the number of words in the string. In this
    case, there are 6 words in the string.'
  - '[PAGE 282]


    The ping command is used to test network connectivity between two machines. It
    sends packets to a specific IP address and displays the time it takes to receive
    a response. The ping command is often used to diagnose network problems.


    The ping syntax is:


    ping [options] address or domain name>


    Where options are the various optional parameters that can be used with the ping
    command. Here are some of the most commonly used options with ping:

    -c: specifies the number of packets to send before stopping. For example, ping
    -c 5 google.com will send 5 packets to Google''s IP address before stopping.

    -s: specifies the size of packets to send. By default, the packet size is 56 bytes.
    For example, ping -s 100 google.com will send 100 byte packets to Google''s IP
    address.

    -i: specifies the interval between packets sent, in seconds. By default, the interval
    is 1 second. For example, ping -i 2 google.com will send packets every 2 seconds
    to Google''s IP address.


    examples of using the ping command:'
- md: '

    ## ping


    ping google.com: sends packets to Google''s IP address and displays response times.

    ping -c 5 192.168.1.1: sends 5 packets to IP address 192.168.1.1 and stops after
    receiving replies.

    ping -i 0.5 localhost: sends packets to the local IP address every 0.5 seconds.


    Check the connectivity of a remote host:


    ```

    ping google.com

    ```


    This command sends packets to Google''s IP address and displays the response time
    for each packet received.


    Limit the number of packets sent:


    ```

    ping -c 5 google.com

    ```


    This command only sends 5 packets to Google and then stops the test.


    Increase the interval between each packet sending:


    ```

    ping -i 5 google.com

    ```


    This command sends packets to Google every 5 seconds.


    View detailed information about each packet sent and received:


    ```

    ping -v google.com

    ```


    This command displays detailed information about each packet, including its lifetime,
    size, and response time.


    Use a specific timeout before considering a lost packet:


    ```

    ping -w 10 google.com

    ```


    This command waits 10 seconds before considering a packet as lost.


    Ping a host using a custom time interval between each packet sent:


    ```

    ping -i 0.5 google.com

    ```


    This command sends packets to Google every 0.5 seconds.


    Ping a host in silent mode, without displaying the results on the screen:


    ```

    ping -q google.com

    ```


    This command sends packets to Google silently, without displaying the results
    on the screen.


    ## join


    The join command is used to merge two files based on a common field. It can be
    used to perform a left join, a right join, or an inner join depending on the options
    specified.


    The general syntax of the command is as follows:


    ```

    join [options] file1 file2

    ```


    The most common options used with the join command are:


    - -t: specifies the delimiter to use for fields (default is a space)

    - -1: specifies the column number (starting from 1) in the first file to use for
    the join.

    - -2: specifies the column number (starting from 1) in the second file to use
    for the join.

    - -a: specifies the type of join to perform. Possible values are 1 for a left
    join, 2 for a right join, and 12 for an inner join (the default is an inner join).


    Inner join of two files using the first column as key:


    ```

    join file1.txt file2.txt

    ```


    Left join of two files using second column as key and including non-matching lines
    from file 1:


    ```

    join -1 2 -2 1 -a 1 file1.txt file2.txt

    ```


    Right join of two files using the third column as key and including non-matching
    lines from file 2:


    ```

    join -1 3 -2 1 -a 2 file1.txt file2.txt

    ```


    It is important to note that the files must be sorted before executing the join
    command, otherwise the result may be unpredictable. To sort a file, you can use
    the sort command.


    Consider the following two files:


    file1.txt:

    ```

    cat

    dog

    bird

    snake

    fish

    ```


    file2.txt:

    ```

    cat eats meat

    dog eats kibble

    bird eats seeds

    mouse eats cheese

    ```


    Inner join of two files using the first column as key:

    The inner join only returns rows where there is a match between the two files.
    Here we will use the first column as the key for the join.


    ```

    join file1.txt file2.txt

    ```


    The result will be:

    ```

    cat eats meat

    dog eats kibble

    bird eats seeds

    ```


    Left join of two files using the first column as the key and including non-matching
    lines from file 1:


    The left join includes all the rows from file 1, even if they don''t match file
    2. Here we''ll use the second column from file 1 and the first column from file
    2 as the key for your join.


    ```

    join -1 1 -2 -a 1 file1.txt file2.txt

    ```


    The result will be:

    ```

    cat eats meat

    dog eats kibble

    bird eats seeds

    snake

    fish

    ```


    We''ve included all lines from file 1, including lines 4 and 5 that don''t match
    file 2.


    Right join of two files using the first column as key and including non-matching
    lines from file 2:


    The right join includes all rows from file 2, even if they don''t match file 1.
    Here, we''ll use the first column from file 1 and the first column from file 2
    as the key for the join.


    ```

    join -1 1 -2 1 -a 2 file1.txt file2.txt

    ```


    The result will be:

    ```

    cat eats meat

    dog eats kibble

    bird eats seeds

    mouse eats cheese

    ```


    We have included all lines from file 2, including line 4 which does not match
    file 1.


    Note that the files must be sorted before executing the join command. If the files
    are not sorted, the join result may be unpredictable. To sort a file, you can
    use the sort command.


