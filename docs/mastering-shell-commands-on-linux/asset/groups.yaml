- md: '

    # Urko Galen


    # Mastering Shell Commands On Linux


    # Introduction


    This book is intended for beginners and advanced users who wish to learn and deepen
    their shell skills under Linux.


    It is accessible even if you have no programming or command line experience. We
    have included practical examples to better understand each command and its options.


    Thank you for accompanying us on this journey to become experts in Linux shell
    commands.


    # Contents


    - apropos help: command help

    - list files and folders in a directory

    - copy files or folders

    - moves a file or directory to another location

    - delete a file

    - create a symbolic link to a file or directory

    - change directory

    - display the path of the current directory

    - create a new directory

    - delete an empty directory

    - display the path of the current directory

    - create a new file

    - print the contents of one or more files to standard output

    - view the contents of a file

    - tail: Displaying a file

    - (pipe)

    - search for a specified pattern in a file or standard output

    - cut and select columns from a file or standard output

    - file merge

    - convert characters

    - sort the lines of a file or standard output

    - remove duplicate lines

    - redirect output to a file

    - changes to a file or standard output

    - Check disk space size

    - Check directory size

    - System Information

    - User information

    - Task scheduler

    - Run script in background

    - list the files used by the system

    - list the history of commands

    - On-screen display

    - archive files and/or directories

    - and gunzip: Archive/Unarchive zip

    - display the contents of a compressed file

    - change permissions of a file or directory

    - word processing tool

    - compare files

    - Change owner or group of a file/directory

    - create an alias for a command

    - RAM

    - Kills a running process

    - Displays the list of running processes

    - Shows running processes

    - search for files and directories

    - process the output of a command

    - locate a file

    - locate a binary

    - command type

    - locate file

    - and while loop

    - expression

    - standard output

    - standard input

    - output redirection

    - of redirects

    - sending

    - Show date

    - set of commands

    - variables:

    - count the number of rows

    - test network connectivity.

    - file join

    - notice


    The help command is used to display built-in help for a specific shell command.
    It provides information about the command''s syntax, available options, and a
    brief description of how it works. This command is especially useful for beginners
    who want to learn more about a specific command.


    The man command, on the other hand, is a very powerful documentation tool that
    can display man pages for various Linux commands. These pages provide detailed
    information about using a command, including examples, available options, and
    syntax information. It is also possible to search for information about a specific
    command using the man -k command.


    Finally, the apropos command allows you to search for commands based on their
    functionality or description. It uses man pages to find matching commands based
    on specific keywords. This command is very useful when you know the functionality
    you want to perform, but you don''t know the exact command to use.


    In sum, the help command provides built-in help for a specific command, the man
    command provides extensive documentation for various Linux commands, and the apropos
    command helps to find commands based on their functionality or description.


    Here are usage examples for the help, man and apropos commands with partial results


    ### Help command:


    Suppose you want to view help for the Bash shell builtin "cd" command. You can
    enter the following command in the terminal:


    help cd


    This command will display information about the "cd" command syntax, available
    options, and usage examples. Here is a partial example result:


    cd [-L][[-P [-e]] [-@]] [dir]


    Change the shell working directory.


    Change the current directory to DIR. The default DIR is the value of the HOME
    shell variable.


    Options:


    - -L symbolic links to be followed: resolve symbolic links in DIR after processing
    instances of `..`

    - -P the physical directory structure without following symbolic links: resolve
    symbolic links in DIR before processing instances of `..`

    - -e the -P option is supplied, and the current working directory cannot be determined
    successfully, exit with a non-zero status


    ...


    ### man command:


    Suppose you want to view the manual for the "ls" command which is used

    to list the contents of a directory. You can enter the following command in

    the terminal:


    man ls


    This command will display detailed information about the "ls" command,

    including syntax, available options, and usage examples. Here is a partial

    example result:


    LS(1) User Commands LS(1)


    NAME

    ls - list directory contents


    SYNOPSIS

    ls [OPTION]... [FILE]...


    DESCRIPTION

    List information about the FILES (the current directory by default).


    Sort entries alphabetically if none of -ctuvSUX nor --sort is specified.


    Mandatory arguments to long options are mandatory for short options too.


    -a, --all

    do not ignore entries starting with .


    -A, --almost-all

    do not list implied . and ..


    --author

    with -l, print the author of each file


    -b, --escape

    print C-style escapes for nongraphic characters


    ...


    ### apropos command:


    Suppose you are looking for a command that allows you to find files on

    your system. You can enter the following command in the terminal:


    apropos find


    This command will display a list of all commands and programs that

    contain the keyword "find" in their name or description. Here is a partial

    example result:


    ```

    find (1) - search for files in a directory hierarchy

    findmnt (8) - find a filesystem

    fusermount (1) - unmount FUSE files

    gappletviewer-4.8 (1) - Find and execute the appletviewer script

    gfindd4 (1) - find files by name or content

    ```


    ...


    The "ls" command lists the files and folders in a directory. It displays the contents
    of a directory (file names, symbolic link folders). It is used with several options
    to display more details about files and/or folders.


    # ls


    This command without options displays the list of files and folders in the current
    directory.


    # ls -lh


    Display the list of files and folders in the current directory with additional
    information, using an alternate display format.


    # ls -l


    The -l option displays a detailed list of files and folders, including ownership
    information, size, date modified, etc.


    ```

    ls -al

    ```


    The -a and -l options combined display a detailed list including hidden files
    as well.


    ```

    ls ~/Documents

    ```


    This command displays the list of files and folders in the Documents directory
    which is in your home directory.


    ```

    ls -R /etc

    ```


    The -R option displays a recursive list of all files and folders under /etc.


    The cp command is used to copy files and/or directories from one location to another.


    The syntax of cp is:

    cp [options] source destination


    The most used options:


    - -f as force: replaces the destination file without asking for confirmation,
    even if it is a symbolic link to a directory.

    - -i as interactive: ask for confirmation before overwriting an existing file.

    - -a:archive: recursively copies all files and subdirectories, symbolic links,
    permissions, timestamps, etc.

    - -r as recursive: recursively copies all files and subdirectories.

    - -v as verbose: displays detailed information about the copy operations performed.


    cp file1.txt file2.txt


    This command will copy the contents of file "file1.txt" into "file2.txt".

    The new file will, in this example, be created in the same directory as the source
    file.

    If the file "file2.txt" already exists, its content will be replaced by the file
    "file1.txt".

    '
  mdcn: '


    # Urko Galen


    # 熟掌握 Linux Shell 命令


    # 简介


    本书旨在希望在 Linux 环境下学习和深化其 Shell 技能的初学者和高级用户。


    即使你没有编程或命令行经验，本书也能轻松上手。我们包含了实用示例，以帮助更好地理解每条命令及其选项。


    感谢你随我们开启这段成为 Linux Shell 命令专家的旅程。


    # 目录


    - apropos help：命令帮助

    - 列出目录中的文件和文件夹

    - 复制文件或文件夹

    - 将文件或目录移动到另一个位置

    - 删除文件

    -为文件或目录创建符号链接

    - 切换目录

    - 显示当前目录路径

    - 创建新目录

    - 删除空目录

    - 显示当前目录路径

    - 创建新文件

    - 将一个或多个文件的内容打印到标准输出

    - 查看文件内容

    - tail：显示文件

    - (管道)

    - 在文件或标准输出中搜索指定模式

    - 从文件或标准输出中切割并选择列

    - 文件合并

    - 转换字符

    - 对文件或标准输出的行进行排序

    - 删除重复行

    - 将输出重定向到文件

    - 文件或标准输出的更改

    - 检查磁盘空间

    - 检查目录大小

    - 系统信息

    - 用户信息

    - 任务调度器

    - 在后台运行脚本

    - 列出系统使用的文件

    - 列出命令历史

    - 屏幕显示

    - 归档文件和/或目录

    - 以及 gunzip：解压 zip

    - 显示压缩文件的内容

    - 修改文件或目录的权限

    - 文字处理工具

    - 比较文件

    - 更改文件/目录的所有者或组

    -为命令创建别名

    - RAM

    - 杀死运行中的进程

    - 显示运行进程列表

    - 显示正在运行的进程

    - 搜索文件和目录

    - 处理命令的输出

    - 定位文件

    - 定位二进制文件

    - 命令类型

    - 定位文件

    - 以及 while 循环

    - 表达式

    - 标准输出

    - 标准输入

    - 输出重定向

    - 重定向的

    - 发

    - 显示日期

    - 命令集

    - 变量：

    - 计算行数

    - 测试网络连接性

    - 文件连接

    - 注意事项


    `help` 命令用于显示特定 Shell 命令的内置帮助。它提供了有关命令语法、可用选项以及工作原理的简要说明。该命令对于想要学习更多特定命令的初学者特别有用。


    相反，`man` 命令是一个非常强大的文档工具，可以显示各种 Linux 命令的帮助页（man pages）。这些页面提供了有关使用命令的详细信息，包括示例、可用选项和语法信息。还可以使用
    `man -k` 命令搜索有关特定命令的信息。


    最后，`apropos` 命令允许你根据功能或描述来搜索命令。它利用帮助页根据特定关键词查找匹配的命令。当你知道想要执行的功能但不知道具体使用哪条命令时，该命令非常有用。


    总而言之，`help` 命令为特定命令提供内置帮助，`man` 命令为各种 Linux 命令提供详尽文档，而 `apropos` 命令帮助根据功能或描述查找命令。


    以下是 `help`、`man` 和 `apropos` 命令的用法示例（包含部分结果）：


    ### Help 命令：


    假设你想查看 Bash Shell 内置命令 "cd" 的帮助。你可以在终端中输入以下命令：


    ```

    help cd

    ```


    该命令将显示关于 "cd" 命令语法、可用选项和用法示例的信息。这是一个部分示例结果：


    ```

    cd [-L][[-P [-e]] [-@]] [dir]

    ```


    更改 shell 工作目录。


    将当前目录更改为 DIR。默认 DIR 是 HOME shell 变量的值。


    选项：


    - -L 遵循的符号链接：在处理 `..` 实例后解析 DIR 中的符号链接。

    - -P 使用不跟随符号链接的物理目录结构：在处理 `..` 实例之前解析 DIR 中的符号链接。

    - -e 如果提供了 -P 选项且无法成功确定当前工作目录，则以非零状态退出。


    ...


    ### man 命令：


    假设你想查看 "ls" 命令的说明书，该命令用于列出目录内容。你可以在终端中输入以下命令：


    ```

    man ls

    ```


    该命令将显示关于 "ls" 命令的详细信息，包括语法、可用选项和用法示例。这是一个部分示例结果：


    ```

    LS(1) User Commands LS(1)


    NAME

    ls - 列出目录内容


    SYNOPSIS

    ls [OPTION]... [FILE]...


    DESCRIPTION

    列出关于文件（FILES）的 world（默认是当前目录）。


    如果未指定 -ctuvSUX 或 --sort，则按字母顺序排序项目。


    长选项的强制参数对于短选项也是强制的。


    -a, --all

    不忽略以 . 开头的条目


    -A, --almost-all

    不列出隐含的 . 和 ..


    --author

    配合 -l 使用时，打印每个文件的作者


    -b, --escape

    为非图形字符打印 C 风格的转义


    ...


    ### apropos 命令：


    假设你正在寻找一个允许你在系统中查找文件的命令。你可以在终端中输入以下命令：


    ```

    apropos find

    ```


    该命令将列出所有名称或描述中包含关键词 "find" 的命令和程序列表。这是一个部分示例结果：


    ```

    find (1) - 在目录层次结构中搜索文件

    findmnt (8) - 查找文件系统

    fusermount (1) - 卸载 FUSE 文件

    gappletviewer-4.8 (1) - 查找并执行 appletviewer 脚本

    gfindd4 (1) - 按名称或内容查找文件

    ```


    ...


    "ls" 命令列出目录中的文件和文件夹。它显示目录的内容（文件名、符号链接文件夹）。它带有多个选项使用，以显示有关文件和/或文件夹的更多细节。


    # ls


    此命令不带选项的情况下显示当前目录下文件和文件夹的列表。


    # ls -lh


    使用备用格式显示当前目录下的文件和文件夹列表，并带有附加信息。


    # ls -l


    -l 选项显示文件和文件夹的详细列表，包括所有者信息、大小、修改日期等。


    ```

    ls -al

    ```


    -a 和 -l 选项结合在一起显示包括隐藏文件在内的详细列表。


    ```

    ls ~/Documents

    ```


    该命令显示你主目录下的 Documents 目录中的文件和文件夹列表。


    ```

    ls -R /etc

    ```


    -R 选项显示 /etc 下所有文件和文件夹的递归列表。


    `cp` 命令用于从一个位置复制文件和/或目录。


    `cp` 的语法为：

    ```

    cp [options] source destination

    ```


    最常用的选项：


    - -f 强制：强制替换目标文件而不询问确认，即使它是指向目录的符号链接。

    - -i 交互式：在覆盖现有文件之前请求确认。

    - -a 归档：递归复制所有文件和子目录、符号链接、权限、时间戳等。

    - -r 递归：递归复制所有文件和子目录。

    - -v 详细：显示执行复制操作的详细信息。


    ```

    cp file1.txt file2.txt

    ```


    该命令将文件 "file1.txt" 的内容复制到 "file2.txt"。在此示例中，新文件将创建在与源相同的目录下。

    如果文件 "file2.txt" 已存在，其内容将被 "file1.txt" 替换。


    '
