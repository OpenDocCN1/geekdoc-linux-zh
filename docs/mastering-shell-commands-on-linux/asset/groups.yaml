- md: "\nShow last executed commands:\n\n```\nhistory\n```\n\nThis command displays\
    \ a list of the last executed commands with their command numbers.\n\nDisplay\
    \ the last 10 executed commands:\n\n```\nhistory -10\n```\n\nThis command displays\
    \ a list of the last 10 commands executed with their command numbers.\n\nFind\
    \ an order in the history:\n\n```\nhistory -500 | grep i\n```\n\nThen the \"grep\"\
    \ command is used to find all lines in history that contain the word \"find\"\
    . The \"-i\" option is used to ignore case, which means that occurrences of \"\
    find\" and \"Find\" will also be included in the results.\n\nIn summary, the command\
    \ \"history -500 | grep i find\" displays the last 500 executed commands containing\
    \ the word \"find\", ignoring case. This can be useful for quickly finding a previously\
    \ executed command based on a keyword.\n\nSave history to a file:\n\n```\nhistory\
    \ >\n```\n\nThis command saves the command history to a file. For example, to\
    \ save the history to a file named \"my_history.txt\", you can use the command\
    \ `history > my_history.txt`.\n\nThe \"echo\" command displays text on the standard\
    \ output (usually the terminal). It takes a character string as input and displays\
    \ it on the screen.\n\nThe general syntax of the \"echo\" command is as follows:\n\
    \n```\necho [OPTIONS] [STRING]\n```\n\nOr :\n\nOPTIONS: the command options (for\
    \ example, -n to remove the new line at the end of the displayed text)\nSTRING:\
