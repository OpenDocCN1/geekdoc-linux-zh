    ## Redirecting command output to a file:


    Suppose you run a command to generate output, for example the "ls" command to
    list the files in a directory. You can redirect the command output to a file using
    the tee command, as follows:


    ```

    ls | tee file.txt

    ```


    This runs the "ls" command and redirects the output to the screen and to the "file.txt"
    file. You will be able to see the output on the screen and it will also be saved
    to the "file.txt" file. If the file does not exist, it will be created automatically.


    ## Adding command output to the end of an existing file:

    If you want to append the output of a command to the end of an existing file rather
    than overwriting its contents, you can use the "-a" option with the tee command.
    For example:


    ```

    ps aux | tee -a process.txt

    ```


    This runs the "ps aux" command to show the running processes and appends the output
    to the end of the "process.txt" file.


    ## Redirecting the output of a command to multiple files:

    The tee command also allows redirecting output to multiple files. If you want
    to redirect the output of a command to two different files, you can use the tee
    command with multiple filenames. Here is an example:


    ```

    ping google.com | tee result1.txt result2.txt

    ```


    This runs the "ping google.com" command to test the connection to Google, and
    redirects the output to the "result1.txt" and "result2.txt" files.


    ## The sed (Stream EDitor) command


    The sed (Stream EDitor) command is a stream editor that can be used to perform
    transformations on the inputs of a file or the outputs of a pipe. It is a powerful
    tool for processing bulk data, and it can be used to perform tasks as string substitution,
    row deletion, row insertion, etc.


    ```

    sed ''s/old/new/g'' file.txt

    ```

    Replaces all occurrences of old with new in file.txt and displays the result.

    The expression s/old/new/g is used to perform the substitution.


    In the example below, the sed command replaced the first occurrence of "Jane"
    with "Sarah" in each line of the names.txt file.


    ```

    cat names.txt

    jane

    John

    Alex

    Michael

    ```


    ```

    sed ''s/Jane/Sarah/'' names.txt

    ```


    ```

    Sarah

    John

    Alex

    Michael

    ```


    The ''sed ''s/^#/#/'' file.txt'' command adds a ''#'' character to the beginning
    of each line of a "file.txt" file.


    ```

    sed ''s/^#/#/'' file.txt

    ```


    Here is a more detailed explanation of each element of the command:


    - "sed": this is the name of the command that will be executed.

    - "s/^#/#/": this is the regular expression used to replace the start of each
    line in the file.

    - "s" means "substitution" (replacement in French).

    - "^" is the regular expression that matches the start of each line.

    - "#" is the character that will be added to the beginning of each line.

    - "file.txt": this is the name of the file to be processed.


    When you run this command, "sed" appends the ''#'' character to the beginning
    of each line in the "file.txt" file and prints the result to standard output.
    Thus, each line of the original file is commented with the ''#'' character at
    the beginning of the line.


    Note that this command does not modify the original file, it only prints the result
    to standard output. If you want to save the result in a new file, you can use
    the redirect command "sed ''s/^#/#/'' file.txt > new_file.txt".


    ```

    sed ''4,$ d'' file.txt

    ```


    The "sed ''4,$ d'' file.txt" command deletes all lines of a "file.txt" file from
    line 4 to the end of the file.


    Here is a more detailed explanation of each element of the command:


    - "sed": this is the name of the command that will be executed.

    - "4,$ d": this is the regular expression used to delete lines from the file.

    - "4" is the line number from which the deletion will start.

    - "$" represents the last line of the file.

    - "d" means "delete" (deletion in French).

    - "file.txt": this is the name of the file to be processed.


    When you run this command, "sed" removes all lines from "file.txt" from line 4
    to the end of the file and prints the result to standard output.


    Note that this command does not modify the original file, it only prints the result
    to standard output. If you want to save the result in a new file, you can use
    the redirect command "sed ''4,$ d'' file.txt > new_file.txt".


    ```

    sed -n ''5p'' file.txt

    ```


    The "sed -n ''5p'' file.txt" command displays the 5th line of a "file.txt" file.


    Here is a more detailed explanation of each element of the command:


    - "sed": this is the name of the command that will be executed.

    - "-n": this is the option that prevents the display of all lines of the file,
    except those specified by a command.

    - "5p": this is the command that displays the 5th line of the file.

    - "5" is the line number to display.

    - "p" stands for "print".

    - "file.txt": this is the name of the file to be processed.


    When you run this command, "sed" prints the 5th line of the "file.txt" to standard
    output.


    If you want to save the result in a new file, you can use the redirect command
    "sed -n ''5p'' file.txt > new_file.txt".


    ```

    sed ''/^[\ ]*/'' file.txt

    ```


    The ''sed ''s/[ \t]*// file.txt'' command removes spaces and tabs at the beginning
    of each line of a "file.txt" file.


    Here is a more detailed explanation of each element of the command:


    - "sed": this is the name of the command that will be executed.

    - "s/[ \t]*//": this is the regular expression used to remove spaces and tabs
    at the beginning of each line.

    - "s" means "substitution" (replacement in French).

    - "^" is the regular expression that matches the start of each line.

    - "[\t]*" is the regular expression that matches zero or more spaces and/or tabs.

    - "" (an empty string) is used to replace matching spaces and tabs.

    - "file.txt": this is the name of the file to be processed.


    When you run this command, "sed" removes spaces and tabs at the beginning of each
    line in the "file.txt" file and prints the result to standard output.

