    Shell conditions are used to perform specific actions based on a true or false
    condition. Conditions are often used with flow control structures such as loops
    or if-then-else structures.


    The most commonly used command for conditions is if. Here is the basic syntax
    of the if statement:


    ```

    if [ condition ]; then

    # instructions to execute if the condition is true

    else

    # statements to execute if condition is false

    fi

    ```


    Conditions can be based on the value of certain variables, on the existence or
    properties of files, or on the result of certain operations. Comparison operators
    such as -eq, -ne, -gt, -lt, -ge, and -le can be used to perform tests on numeric
    values, while string operators such as = and != can be used to perform tests on
    strings.


    The if statement can also be used with elif statements to test several different
    conditions and execute the block of statements associated with the first condition
    that is true.


    It is important to note that conditions in shell are very sensitive to syntax
    and spaces, so it is important to take the time to understand the correct syntax
    to avoid errors.'
- md: "\nThe condition can be an arithmetic expression, file test, string test, etc.\n\
    \n## Arithmetic expression test\n\n```\nx=5\nif [ $x -gt 4 ]; then\necho \"x is\
    \ greater than 4\"\nfi\n```\n\n## Test file\n\n```\nfile=\"file.txt\"\nif [ -e\
    \ $file ]; then\necho \"File exists\"\nfi\n```\n\n## String test\n\n```\nword=\"\
    Hello\"\nif [ \"$word\" = \"Hello\" ]; then\necho \"String is Hello\"\nfi\n```\n\
    \nThe statement can also be used with the else statement to execute different\
    \ statements if the condition is false:\n\n```\nif [ condition ]; then\n# Statements\
    \ to execute if the condition is true\nelse\n# Statements to execute if condition\
    \ is false\n```\n\nThe statement can also be used with the elif (else if) statement\
    \ to test multiple conditions:\n\n```bash\nif [ condition1 ]; then\n# Statements\
    \ to execute if condition1 is true\nelif [ condition2 ]; then\n# Statements to\
    \ execute if condition1 is false and condition2 is true\n\nelse\n# Statements\
    \ to execute if condition1 and condition2 are false\nfi\n```\n\nThere are also\
    \ other shell test statements, such as [ and [[ that can be used to test conditions.\n\
    \n### Arithmetic expression test\n\n```bash\nx=5\nif [ $x -gt 4 ]; then\necho\
    \ \"x is greater than 4\"\nfi\n```\n\n- `x=5`: This line defines a variable x\
    \ with a value of 5.\n- `if [ $x -gt 4 ];`: This line starts a shell condition.\
    \ The condition checks if the value of x is greater than 4. The -gt operator means\
    \ \"greater than\" in shell.\n- `then`: This line demarcates the beginning of\
    \ the instructions that will be executed if the condition is true.\n- `echo \"\
    x is greater than 4\"`: This instruction prints the message \"x is greater than\
    \ 4\" to standard output.\n- `fi`: This line demarcates the end of the condition\
    \ in shell.\n\nIn summary, this code defines a variable x with a value of 5 and\
    \ checks if this value is greater than 4. If the condition is true, the message\
    \ \"x is greater than 4\" is displayed on the standard output.\n\n### File test\n\
    \n```bash\nfile=\"file.txt\"\nif [ -e $file ]; then\necho \"File exists\"\nfi\n\
    ```\n\n- `file=\"file.txt\"`: This line defines a file variable with a value of\
    \ \"file.txt\".\n- `if [ -e $file ];`: This line starts a shell condition. The\
    \ condition checks if a file named file.txt exists in the system using the file\
    \ test operator -e (\"exist\").\n- `then`: This line demarcates the beginning\
    \ of the instructions that will be executed if the condition is true.\n- `echo\
    \ \"File exists\"`: This statement prints the message \"File exists\" to standard\
    \ output.\n- `fi`: This line demarcates the end of the condition in shell.\n\n\
    In summary, this code sets a file variable with a value of \"file.txt\" and checks\
    \ if a file named file.txt exists in the system using the -e test operator. If\
    \ the condition is true, the message \"File exists\" is displayed on standard\
    \ output.\n\n### String test\n\n```bash\nword=\"Hello\"\nif [ \"$word\" = \"Hello\"\
    \ ]; then\necho \"String is Hello\"\nfi\n```\n\n- `word=\"Hello\"`: This line\
    \ defines a word variable with a value of \"Hello\".\n- `if [ \"$word\" = \"Hello\"\
    \ ];`: This line starts a shell condition. The condition checks if the value of\
    \ word variable is equal to \"Hello\" using the equality operator =\n- `then`:\
    \ This line demarcates the beginning of the instructions that will be executed\
    \ if the condition is true.\n- `echo \"String is Hello\"`: This statement prints\
    \ the message \"String is Hello\" to standard output.\n- `fi`: This line demarcates\
    \ the end of the condition in shell.\n\nIn summary, this code sets a word variable\
    \ with a value of \"Hello\" and checks if the value of the word variable is equal\
    \ to \"Hello\". If the condition is true, the message \"String is Hello\" is displayed\
    \ on standard output.\n\n### Parameter count test\n\n```bash\nif [ $# -eq 0 ];\
    \ then\n    echo \"No arguments passed\"\nelse\n    echo \"Arguments passed\"\n\
    fi\n```\n\n- `if [ $# -eq 0 ];`: This line starts a shell condition. The condition\
    \ checks if the number of arguments ($#) is zero using the -eq equality operator.\n\
    - `then`: This line demarcates the beginning of the instructions that will be\
    \ executed if the condition is true.\n- `echo \"No arguments passed\"`: This statement\
    \ prints the message \"No arguments passed\" to standard output.\n- `else`: This\
    \ line demarcates the beginning of the instructions that will be executed if the\
    \ condition is false.\n- `echo \"Arguments passed\"`: This statement prints the\
    \ message \"Arguments passed\" to standard output.\n- `fi`: This line demarcates\
    \ the end of the condition in shell.\n\nIn summary, this code checks if the number\
    \ of arguments passed to the script is zero. If so, the message \"No arguments\
    \ passed\" is displayed. Otherwise, the message \"Arguments passed\" is displayed.\n\
    \n### Non-empty variable test\n\n```bash\nname=\"\"\nif [ -z \"$name\" ]; then\n\
    \  echo \"Variable is empty\"\nelse\n  echo \"Variable is not empty\"\nfi\n```\n\
    \n- `name=\"\"`: This line defines a variable named name and assigns an empty\
    \ string as its value.\n- `if [ -z \"$name\" ];`: This line starts a shell condition.\
    \ The condition checks if the variable name is empty using the -z operator.\n\
    - `then`: This line demarcates the beginning of the instructions that will be\
    \ executed if the condition is true.\n- `echo \"Variable is empty\"`: This statement\
    \ prints the message \"Variable is empty\" to standard output.\n- `else`: This\
    \ line demarcates the beginning of the instructions that will be executed if the\
    \ condition is false.\n- `echo \"Variable is not empty\"`: This statement prints\
    \ the message \"Variable is not empty\" to standard output.\n\nIn summary, this\
    \ code checks if the name variable is empty. If so, the message \"Variable is\
    \ empty\" is displayed. Otherwise, the message \"Variable is not empty\" is displayed.\n\
    \n### Testing multiple conditions\n\n```bash\nx=5\ny=6\nif [ $x -gt 4 ] && [ $y\
    \ -gt 5 ]; then\necho \"x is greater than 4 AND y is greater than 5\"\nfi\n```\n\
    \nIn this example, the condition is formed by a logical expression \"&&\". This\
    \ expression means \"and\", and is only true if both conditions are met.\n\nFirst,\
    \ the condition [ $x -gt 4 ] is evaluated. This condition checks if the value\
    \ of x is greater than 4. If this condition is true, the next condition is evaluated.\n\
    \nNext, the condition [ $y -gt 5 ] is evaluated. This condition checks if the\
    \ value of y is greater than 5. If this condition is true, then both conditions\
    \ are met and the echo command \"x is greater than 4 AND y is greater than 5\"\
    \ will be executed.\n\nIf one of the conditions is not met, the echo command will\
    \ not be executed.\n\n### Testing for one condition or another\n\n```bash\nfile1=\"\
    file.txt\"\nfile2=\"file.txt\"\nif [ -e $file1 ] || [ -e $file2 ]; then\necho\
    \ \"At least one of the files exists\"\nfi\n```\n\nThis code uses the condition\
    \ to check if at least one of file1.txt or file2.txt exists on the system. The\
    \ condition has two tests [ -e $file1 ] and [ -e $file2 ], which respectively\
    \ check the existence of file1.txt and file2.txt. The || between the two tests\
    \ means \"or\", so the condition will be true if one of the tests is true.\n\n\
    The code uses the -e test to check for the existence of a file. If the file exists,\
    \ the test returns 0, which is considered true in shell. If the file does not\
    \ exist, the test returns 1, which is considered false in shell.\n\nIf least one\
    \ of the tests returns 0, the global condition will be true and the message \"\
    At least one of the files exists\" will be displayed. If none of the tests return\
    \ 0, the global condition will be false and the if block will be ignored.\n\n\
    ## Testing a Condition with Multiple Statement Blocks\n\n```bash\nrating=10\n\
    if [ $rating -ge 10 ]; then\necho \"The number is greater than or equal to 10\"\
    \necho \"Congratulations!\"\nelse\necho \"Number is less than 10\"\necho \"Keep\
    \ working!\"\nfi\n```\n\nIn this example, we define a \"rating\" variable with\
    \ a value of 10. Next, we use an \"if\" condition to check if the value of \"\
    rating\" is greater than or equal to 10.\n\nIf the condition is true, ie if the\
    \ score is greater than or equal to 10, then the two \"echo\" instructions are\
    \ executed. The first displays the message \"The number is greater than or equal\
    \ to 10\" and the second displays \"Congratulations!\".\n\nIf the condition is\
    \ not true, i.e. if the score is less than 10, then the two \"echo\" instructions\
    \ are executed. The first displays the message \"Number is less than 10\" and\
    \ the second displays \"Keep working!\".\n\nIn summary, this example demonstrates\
    \ how to use an \"if\" condition to check a value and execute different statements\
    \ depending on the result of that check.\n"
  mdcn: "\n\n条件可以是算术表达式、文件测试、字符串测试等。\n\n## 算术表达式测试\n\n```\nx=5\nif [ $x -gt 4 ]; then\n\
    echo \"x is greater than 4\"\nfi\n```\n\n## 测试文件\n\n```\nfile=\"file.txt\"\nif\
    \ [ -e $file ]; then\necho \"File exists\"\nfi\n```\n\n## 字符串测试\n\n```\nword=\"\
    Hello\"\nif [ \"$word\" = \"Hello\" ]; then\necho \"String is Hello\"\nfi\n```\n\
    \n该语句也可以与 `else` 语句一起使用，以便在条件为假时执行不同的语句：\n\n```\nif [ condition ]; then\n# 条件为真时执行的语句\n\
    else\n# 条件为假时执行的语句\n```\n\n该语句还可以配合 `elif` (else if) 语句使用来测试多个条件：\n\n```bash\n\
    if [ condition1 ]; then\n# 如果 condition1 为真，执行的语句\nelif [ condition2 ]; then\n\
    # 如果 condition1 为假且 condition2 为真，执行的语句\n\nelse\n# 如果 condition1 和 condition2\
    \ 都为假，执行的语句\nfi\n```\n\n还有其他 shell 测试语句，例如 `[` 和 `[[`，用于测试条件。\n\n### 算术表达式测试\n\
    \n```bash\nx=5\nif [ $x -gt 4 ]; then\necho \"x is greater than 4\"\nfi\n```\n\
    \n- `x=5`: 这一行定义了一个值为 5 的变量 x。\n- `if [ $x -gt 4 ];`: 这一行开始了一个 shell 条件。该条件检查\
    \ x 的值是否大于 4。`-gt` 运算符在 shell 中表示“大于”。\n- `then`: 这一行标记了在条件为真时将执行的指令的开始。\n- `echo\
    \ \"x is greater than 4\"`: 这条指令向标准输出打印消息“x is greater than 4”。\n- `fi`: 这一行标记了\
    \ shell 中条件语句结束。\n\n总而言之，这段代码定义了一个值为 5 的变量 x，并检查该值是否大于 4。如果条件为真，则在标准输出上显示“x is\
    \ greater than 4”的消息。\n\n### 文件测试\n\n```bash\nfile=\"file.txt\"\nif [ -e $file\
    \ ]; then\necho \"File exists\"\nfi\n```\n\n- `file=\"file.txt\"`: 这一行定义了一个值为\
    \ \"file.txt\" 的文件变量。\n- `if [ -e $file ];`: 这一行开始了一个 shell 条件。该条件使用文件测试运算符 `-e`\
    \ (\"存在\") 检查是否存在是否存在 file.txt 的文件。\n- `then`: 这一行标记了在条件为真时将执行的指令的开始。\n- `echo\
    \ \"File exists\"`: 这条语句向标准输出打印消息“File exists”。\n- `fi`: 这一行标记了 shell 中条件语句的结束。\n\
    \n总而言之，这段代码设置了一个值为 \"file.txt\" 的文件变量，并使用 `-e` 测试运算符检查系统中是否存在名为 file.txt 的文件。如果条件为真，则在标准输出上显示“File\
    \ exists”的消息。\n\n### 字符串测试\n\n```bash\nword=\"Hello\"\nif [ \"$word\" = \"Hello\"\
    \ ]; then\necho \"String is Hello\"\nfi\n```\n\n- `word=\"Hello\"`: 这一行定义了一个值为\
    \ \"Hello\" 的单词变量。\n- `if [ \"$word\" = \"Hello\" ];`: 这一行开始了一个 shell 条件。该条件使用相等运算符\
    \ `=` 检查单词变量的值是否等于 \"Hello\"。\n- `then`: 这一行标记了在条件为真时将执行的指令的开始。\n- `echo \"String\
    \ is Hello\"`: 这条语句向标准输出打印消息“String is Hello”。\n- `fi`: 这一行标记了 shell 中条件语句的结束。\n\
    \n总而言之，这段代码设置了一个值为 \"Hello\" 的单词变量，并检查单词变量的值是否等于 \"Hello\"。如果条件为真，则在标准输出上显示“String\
    \ is Hello”的消息。\n\n### 参数数量测试\n\n```bash\nif [ $# -eq 0 ]; then\n    echo \"No\
    \ arguments passed\"\nelse\n    echo \"Arguments passed\"\nfi\n```\n\n- `if [\
    \ $# -eq 0 ];`: 这一行开始了一个 shell 条件。该条件使用 `-eq` 等于运算符检查参数数量 ($#) 是否为 0。\n- `then`:\
    \ 这一行标记了在条件为真时将执行的指令的开始。\n- `echo \"No arguments passed\"`: 这条语句向标准输出打印消息“No arguments\
    \ passed”。\n- `else`: 这一行标记了在条件为假时将执行的指令的开始。\n- `echo \"Arguments passed\"`: 这条语句向标准输出打印消息“Arguments\
    \ passed”。\n- `fi`: 这一行标记了 shell 中条件语句的结束。\n\n总而言之，这段代码检查传递给脚本的参数数量是否为 0。如果是，则显示“No\
    \ arguments passed”消息。否则，显示“Arguments passed”消息。\n\n### 非空变量测试\n\n```bash\nname=\"\
    \"\nif [ -z \"$name\" ]; then\n  echo \"Variable is empty\"\nelse\n  echo \"Variable\
    \ is not empty\"\nfi\n```\n\n- `name=\"\"`: 这一行定义了一个名为 name 的变量，并赋值一个空字符串作为值。\n\
    - `if [ -z \"$name\" ];`: 这一行开始了一个 shell 条件。该条件使用 `-z` 运算符检查变量 name 是否为空。\n- `then`:\
    \ 这一行标记了在条件为真时将执行的指令的开始。\n- `echo \"Variable is empty\"`: 这条语句向标准输出打印消息“Variable\
    \ is empty”。\n- `else`: 这一行标记了在条件为假时将执行的指令的开始。\n- `echo \"Variable is not empty\"\
    `: 这条语句向标准输出打印消息“Variable is not empty”。\n\n总而言之，这段代码检查 name 变量是否为空。如果是，则显示“Variable\
    \ is empty”消息。否则，显示“Variable is not empty”消息。\n\n### 测试多个条件\n\n```bash\nx=5\n\
    y=6\nif [ $x -gt 4 ] && [ $y -gt 5 ]; then\necho \"x is greater than 4 AND y is\
    \ greater than 5\"\nfi\n```\n\n在这个示例中，条件是由逻辑表达式 \"&&\" 形成的。该表达式表示“与”，并且只有当两个条件都满足时才为真。\n\
    \n首先，评估条件 `[ $x -gt 4 ]`。该条件检查 x 的值是否大于 4。如果该条件为真，则评估下一个条件。\n\n接下来，评估条件 `[ $y\
    \ -gt 5 ]`。该条件检查 y 的值是否大于 5。如果该条件为真，则两个条件都满足，并将执行 echo 命令 \"x is greater than\
    \ 4 AND y is greater than 5\"。\n\n如果其中一个条件不满足，则不会执行 echo 命令。\n\n### 测试一个或另一个条件\n\
    \n```bash\nfile1=\"file.txt\"\nfile2=\"file.txt\"\nif [ -e $file1 ] || [ -e $file2\
    \ ]; then\necho \"At least one of the files exists\"\nfi\n```\n\n这段代码使用条件来检查系统中是否存在\
    \ file1.txt 或 file2.txt 中的至少一个。该条件有两个测试 `[ -e $file1 ]` 和 `[ -e $file2 ]`，分别检查\
    \ file1.txt 和 file2.txt 的存在性。两个测试之间的 `||` 表示“或”，因此只要其中一个测试为真，条件将为真。\n\n代码使用 `-e`\
    \ 测试来检查文件的存在性。如果文件存在，测试返回 0，这在 shell 中被视为真。如果文件不存在，测试返回 1，这在 shell 中被视为假。\n\n\
    如果至少有一个测试返回 0，全局条件将为真，并显示“At least one of the files exists”消息。如果没有测试返回 0，全局条件将为假，并将忽略\
    \ if 块。\n\n## 测试带有多个语句块的条件\n\n```bash\nrating=10\nif [ $rating -ge 10 ]; then\n\
    echo \"The number is greater than or equal to 10\"\necho \"Congratulations!\"\n\
    else\necho \"Number is less than 10\"\necho \"Keep working!\"\nfi\n```\n\n在这个示例中，我们定义了一个值为\
    \ 10 的 \"rating\" 变量。接下来，我们使用 \"if\" 条件检查 \"rating\" 的值是否大于或等于 10。\n\n如果条件为真，即分数大于或等于\
    \ 10，则执行两个 \"echo\" 指令。第一个显示消息“The number is greater than or equal to 10”，第二个显示“Congratulations!”。\n\
    \n如果条件不为真，即分数小于 10，则执行两个 \"echo\" 指令。第一个显示消息“Number is less than 10”，第二个显示“Keep\
    \ working!”。\n\n总而言之，这个示例演示了如何使用 \"if\" 条件检查一个值，并根据检查的结果执行不同的语句。\n\n"
