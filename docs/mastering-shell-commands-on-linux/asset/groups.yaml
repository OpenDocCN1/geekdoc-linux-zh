    The gzip and gunzip commands are used to compress and decompress files using the
    gzip compression format. The gzip format is one of the most commonly used compression
    formats on Unix and Linux systems. Here is a detailed description of each command:


    ### The gzip command

    This command is used to compress files using the gzip compression format. The
    syntax is as follows:


    gzip [OPTIONS] FILE


    Where OPTIONS is one or more optional options you can specify to customize the
    behavior of the command, and FILE is the name of the file you want to compress.
    Here are some commonly used options with the gzip command:


    - -c: This option is used to display the compressed output to standard output
    rather than writing the compressed output to a file. You can use this option with
    other commands to chain commands together.

    - -d: This option is used to decompose files compressed in gzip format.

    - -f: This option forces compression, even if a file with the same name exists.

    - -k: This option is used to keep a copy of the original file during compression.
    A compressed file will be created, but the original file will not be deleted.

    - -r: This option is used to compress all files contained in a directory recursively.


    ### The gunzip command

    This command is used to decompress files compressed in gzip format. The syntax
    is as follows:


    gunzip [OPTIONS] FILE


    Where OPTIONS is one or more optional options you can specify to customize the
    behavior of the command, and FILE is the name of the file you want to unzip. Here
    are some commonly used options with the gunzip command:


    - -c: This option is used to print the uncompressed output to standard output
    rather than writing the uncompressed output to a file. You can use this option
    with other commands to chain commands together.

    - -f: This option forces decompression, even if a file with the same name exists.

    - -k: This option is used to keep a copy of the compressed file during decompression.
    A decompressed file will be created, but the compressed file will not be deleted.

    - -r: This option is used to unpack all files contained in a directory recursively.


    To compress a file:

    ```

    gzip file.txt

    ```

    This command will compress file.txt by creating a new file named file.gz.


    To unzip a file:

    ```

    gunzip file.txt.gz

    ```

    This command will decompress the file.gz by creating a new file named file.txt.


    To compress multiple files at the same time:

    ```

    gzip file1.txt file2.txt file3.txt

    ```

    This command will compress file1.txt, file2.txt and file3.txt by creating .gz
    files.


    To decompress several files at the same time:

    ```

    gunzip *.gz

    ```

    This command will decompress all the files with .gz extension present in the current
    directory.


    ### The zcat command

    The zcat command is used to display the contents of a compressed file in plain
    text format. The zcat command works similarly to the cat command. However, the
    difference is that zcat is able to decompress the compressed file before displaying
    it on the screen. Here is an example of using zcat:


    ```

    zcat file.gz

    ```

    This will display the contents of the "file.gz" compressed file.


    Search for a character string in a compressed file:

    ```

    zcat file.gz | grep "string"

    ```

    This will display all lines containing the specified string in the compressed
    file "file.gz".


    Redirect output to a file:

    ```

    zcat file.gz > output.txt

    ```

    This will print the contents of the compressed file "file.gz" to standard output
    and redirect output to a file named "output.txt".


    Concatenate multiple compressed files:

    ```

    zcat file1.gz file2.gz file3.gz > concat.gz

    ```

    This will concatenate the compressed files "file1.gz", "file2.gz", and "file3.gz"
    in the specified order, and save the result to a file named "concat.gz".


    ### The chmod command

    The chmod command allows you to modify the permissions of a file or a directory.
    Permissions can be set for owners, groups and general users. "drwxrwxrwx" is an
    abbreviated representation of permissions on a file or directory in the Unix or
    Linux file system. The first letter "d" means it is a directory. If the file was
    an ordinary file, this letter would be a hyphen ("-"). The next three-letter groups
    represent the permissions for file owner, file group, and other users, respectively.
    The letter "r" stands for "read", the letter "w" stands for "write", and the letter
    "x" stands for "execute". If a letter is present, it means that permission is
    granted for this action. If it is absent, it means permission is denied. "drwxrwxrwx"
    means that the owner, owning group, and all other users have permission to read,
    write, and execute this.


    ```

    chmod u+x file_name

    ```

    This command gives execution permission to the owner (u for "user") of the file
    "file_name".


    To remove write permission for others on a file:

    ```

    chmod o-w myfile

    ```


    To change permissions using octal: 754 therefore corresponds in octal to: 111
    101 100

    ```

    chmod u=rwx,g=rw,o=r myfile

    ```

    To change permissions using symbolic notation:

    ```

    chmod 755 file.txt

    ls -l file.txt

    -rwxr-xr-x 1 user 0 Feb 11 10:00 file.txt

    ```

    In this example, we change the permissions for the owner to read and execute,
    for the group and general users to read only. The ls -l command is used to display
    detailed file information.


    ```

    chmod +x script.sh

    ```

    ```

    ls -l script.sh

    -rwxrwxrwx 1 user 0 Feb 11 10:00 script.sh

    ```

    In this example, we add execute permission for owner, group, and general users.


    ```

    chmod u+rw file.txt

    ls -l file.txt

    -rw-rw-r-- 1 user 0 Feb 11 10:00 file.txt

    ```

    In this example, we add read and write permissions for the owner.


    ```

    chmod u+rw test.txt

    ```

    Give read and write permissions for the user who owns a file named "test.txt".


    ```

    chmod g-w test.txt

    ```

    Remove write permissions for users belonging to the same group as the owner of
    a file named "test.txt".


    ```

    chmod o+rwx docs/

    ```

    Give read, write and execute permissions for all users on a directory named "docs".


    ```

    chmod o=r test.txt

    ```

    Change the permissions for a file so that it is read-only by everyone.


    ```

    chmod o=rx docs/

    ```

    Change the permissions for a directory so that it is only readable and executable
    by everyone.


    ### The awk command

    The Aw command is a powerful and flexible text processing tool that can be used
    to perform operations such as searching, editing, and formatting data in files.
    awk takes as input a text file and an expression that describes how to process
    the data in file. The expression is divided into two parts: rules and actions.
    Rules define the conditions under which actions should be performed, and actions
    define what should be done when the conditions are met.


    Here is a general structure of an awk command:


    ```

    awk ''/pattern/ { action }'' filename

    ```


    Parts of the awk code include:


    pattern: this is the condition that must be met for the actions to be performed.


    action: is what must be done when the conditions are met.


    filename: this is the name of the file that will be processed by awk.


    The awk expression can include multiple rules and actions, and can be used to
    perform a variety of data operations, such as selecting specific rows, formatting
    output, calculating statistics, and more.


    ```

    awk ''{print $3}'' test.txt

    ```

    Display the third column (field) of each row in a "test.txt" file


    Detailed explanation of the command:


    "{print $3}" is the awk command that displays the contents of the third column
    of each line in the "test.txt" file. The "$" symbol is used to specify the field
    to display, in this case field 3.


    "test.txt" is the name of the file that awk should process. This file contains
    data with columns separated by spaces or tabs.

