    Redirects are a technique to modify the input/output flow of a command. They are
    often used to save command output to a file, or to read command input from a file
    rather than from the keyboard.


    There are three types of shell redirection: standard output redirection, standard
    input redirection, and error output redirection.


    Redirecting standard output allows you to redirect the output of a command to
    a file rather than displaying it on the screen. To do this, you must use the >
    operator followed by the name of the file where you want to save the output.


    Here is an example :


    ```

    ls > list_of_files.txt

    ```


    ls command displays the list of files in the current directory. Redirecting standard
    output ( > sends this output to a file named list_of_files.txt rather than displaying
    it on the screen.


    Redirecting standard input allows command input to be read from a file rather
    than from the keyboard. To do this, you must use the < operator followed by the
    name of the file from which you want to read input.


