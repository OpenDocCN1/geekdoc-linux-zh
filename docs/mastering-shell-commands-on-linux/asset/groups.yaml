    dates, etc.


    Here are the options used for the sort command:


    - -n: Sort entries by numeric value.

    - -r: Reverse the sort order (largest to smallest or newest to oldest).

    - -t: Set a field delimiter to separate entries.

    - -k: Specify the column to sort.


