    that match the regular expression ".txt$", which stands for "a line that ends
    with the extension ''.txt''".


    ## Sorting results with sort:


    Suppose you want to list all files in the current directory and sort them alphabetically.
    You can use the following command:


    ```

    ls | sort

    ```


    The "ls" command displays the list of all files and folders in the current directory,
    and this output is redirected through the pipe to the "sort" command. The "sort"
    command sorts results alphabetically.


    ## Counting results with wc:


    You want to list all files in the current directory and count the total number
    of files. You can use the following command:


    ```

    ls | wc -l

    ```


    The "ls" command displays the list of all files and folders in the current directory,
    and this output is piped through the "wc" command. The "wc" command counts the
    number of lines in the output (i.e. the number of files) and returns the result.


    ## Data manipulation with awk:


    You want to list all files in the current directory and display only the filename
    and its size in bytes. You can use the following command:


    ```

    ls -l | awk ''{print $9 " : " $5 " bytes"}''

    ```


    The "ls -l" command displays the list of all files and folders in the current
    directory with their details, and this output is piped to the "awk" command. The
    "awk" command processes the output and displays only the ninth field (the file
    name) and the fifth field (the size in bytes) for each line of output.


    grep is used to find lines in one or more files that match a given pattern (called
    a "regular expression").


    Here is the syntax:


    grep [OPTION]... PATTERN [FILE]...


    The most used options are:


    grep ''pattern'' file.txt

    This command displays all lines from file.txt that contain the specified pattern
    (in this case, ''pattern'').


    grep -i ''pattern'' file.txt

    The -i option makes it possible to ignore case when searching for the pattern.
    All lines in file.txt that contain the pattern, regardless of case, will be displayed.


    ```

    grep -v ''pattern'' file.txt

    ```


    All lines of the file.txt file that do not contain the pattern will be displayed.
    The -v option is used to reverse the search direction.


    grep ''pattern'' file1.txt file2.txt

    This command searches for the specified pattern (in this case, ''pattern'') in
    the files file1.txt and file2.txt. All lines from both files that contain the
    pattern will be displayed.


    grep -R ''pattern'' *

    The -R option allows a recursive search. The pattern is specified between single
    quotes. The "*" indicates that the search is made from the current directory.
    Note: you can replace * with a path in order to search there


    ```

    grep "^[0-9][0-9]*$" file.txt

    ```


    The "grep "^[0-9][0-9]*$" file.txt" command searches for lines in the file "file.txt"
    that contain only numbers.

    Here is an explanation:


    - ^ is a regular expression metacharacter that matches the start of a line.

    - [0-9] is a character class that matches a single digit.

    - * matches zero or more digits.

    - $ indicates the end of a line.


    ```

    grep -w keyword file.txt

    ```


    The "grep -w keyword file.txt" command searches for all occurrences of the keyword
    "keyword" in the file "file.txt". Here is an explanation:


    ```

    grep -l "search_word" directory

    ```


    The command "grep -l "search_word" directory" searches for all files in the specified
    directory that contain the pattern "search_word", and returns the name of each
    file found.


    Here is an explanation:


    - -l is an option that specifies that the command should return only the names
    of files containing the pattern, not the matching lines.

    - "word_to_search" is the pattern you want to search for.

    - "directory" is the path to the directory you want to search.


    ```

    grep -c "hello" file.txt

    ```


    The command searches for the pattern "hello" in the file "file.txt" and returns
    the total number of occurrences found.


    Here is an explanation:


    ```

    grep -n ''pattern'' file.txt

    ```


    The command searches for the pattern ''pattern'' in the file "file.txt" and returns
    each matching line, preceded by its line number.


    Here is an explanation:


    ```

    grep -E "regular_expression" file_name

    ```


    The command searches for all occurrences of the specified regular expression in
    the file "file_name" and returns the matching lines.


    Here is an explanation of the command:


    - -E is an option that specifies that the command should use extended regular
    expressions to perform the search. Extended regular expressions include special
    characters that allow for more powerful searches.

    - "regular_expression" is the regular expression you want to use to search the
    file. Regular expressions are text patterns that allow you to search for complex
    patterns in files.

    - "file_name" is the name of the file.


