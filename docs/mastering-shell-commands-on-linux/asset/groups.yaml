    The "pipe" (|) command is used to pipe the output of one command to the input
    of another command, allowing real-time data processing streams to be created.


    Concretely, the pipe makes it possible to take the standard output (stdout) of
    a command and to transmit it as standard input (stdin) of another command. If
    you want to list all files in the current directory that have the ".txt" and display
    them on the screen, you can use the following command:


    The pipe is very useful for chaining several commands and combining them efficiently.
    For example, you can use the pipe to filter the results of a command using a regular
    expression, or to sort the results by a specific criteria.


    Filtering the results of a command with grep:

    Suppose you want to list all files in the current directory and filter out only
    those with ".txt" extension :


    ```

    ls -l | grep ''.txt$''

    ```


    In this example, the "ls -l" command displays the list of all files and folders
    in the current directory, and this output is piped to the "grep" command. The
    "grep" command filters the results by showing only lines'
