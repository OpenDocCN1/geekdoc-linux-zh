    ## The nohup command


    The nohup command (short for "no hang up") allows you to run a command or script
    in the background, without being interrupted if the connection to the terminal
    is lost or closed.


    When a command is executed normally in a terminal, if the connection to the terminal
    is lost, the command will be terminated. This can be problematic if you run a
    command that takes a long time, or if you want to run a command in the background
    without interrupting its execution by closing the session or the terminal.


    The nohup command solves this problem by allowing a command to run in the background,
    and by redirecting its standard and error output to a specified file. Thus, even
    if the connection to the terminal is lost, the command continues to be executed
    in the background, and its outputs are stored in the specified file.


    The nohup command syntax is as follows:


    ```

    nohup command [options] [arguments] &

    ```


    - command: the command or script to run.

    - [options]: options specific to the command to be executed.

    - [arguments]: arguments specific to the command to be executed.

    - &: the "ampersand" symbol at the end of the command allows it to be executed
    in the background.


    The nohup command also uses a default file to store standard and error output
    from the command. The name of this file is nohup.out. If you want to specify another
    output file, you can do so using the -o option followed by the filename.


    Suppose you have a shell script named "my_script.sh" in your current directory
    and you want to run it in the background with nohup:


    ```

    nohup sh my_script.sh > output.log &

    ```


    This will run the "my_script.sh" script in the background using nohup and redirect
    the output to an "output.log" file. The "&" symbol at the end of the command will
    release the console and continue working on it.


    If you want to check if the script is still running, you can use the "ps" command
    to display the list of running processes:


    ```

    ps -ef | grep my_script.sh

    ```


    This will display the list of running processes that contain "my_script.sh" in
    their name.


    You can also check the contents of the "output.log" file to see the output generated
    by the script:


    ```

    cat output.log

    ```


    This will display the contents of the "output.log" file in the console.


    Note that the nohup command is useful for running scripts in the background on
    servers or remote machines, as it keeps the script running even if the console
    connection is lost or the user logs out.


    ## The lsof command


    The lsof (List Open Files) command is used to display files opened by processes
    running on a Linux or Unix system. This command can also display other information
    such as open ports, sockets, network connections, running processes, and shared
    libraries used by processes.


    The syntax of lsof is as follows:


    ```

    lsof [options]

    ```


    Some commonly used options with the lsof command are:


    - -i: show open files for network connections.

    - -u: show files opened by a specific user.

    - -p: show files opened by a specific process.

    - -c: show files opened by a specific command name.


    The lsof command can be useful for diagnosing performance issues, file errors,
    file leaks, and network connections. It can also be used to find processes using
    specific files and to stop or restart them if necessary.


    It is important to note that to use the lsof command, you must have root access
    or have user privileges to view files opened by other users or processes.


    ### View files opened by a specific user:


    To display files opened by a specific user, use the -u option followed by the
    user name. For example, to display the files opened by the user "ubuntu", type:


    ```

    lsof -u ubuntu

    ```


    This command will show all files opened by user "ubuntu".


    ### Show files opened by a specific process:


    To display files opened by a specific process, use the -p option followed by the
    process identifier (PID). For example, to display the files opened by the process
    with PID 1234, type:


    ```

    lsof -p 1234

    ```


    This command will show all files opened by the process with PID 1234.


    ### Show open files for a specific command:


    To view files opened by a specific command, use the -c option followed by the
    command name. For example, to display the files opened by the "apache2" process,
    type:


    ```

    lsof -c apache

    ```


    This command will show all files opened by the "apache2" process.


    ### Show open files for a specific directory:


    To display open files for a specific directory, use the directory name as the
    command argument. For example, to display open files for the "/var/log" directory,
    type:


    ```

    lsof /var/log

    ```


    This command will show all open files in the "/var/log" directory.


    These examples are not exhaustive, but they should give you an idea of how the
    lsof command can be used to diagnose system problems.


    You''ve noticed the disk space on your system is rapidly decreasing, but you don''t
    know what''s taking it up. Use the lsof command to find files and check if they
    are related to processes that are no longer running.


    Start by running the following command to display all open files on your system:


    ```

    lsof

    ```


    The previous command returns a very long list of open files. You can narrow the
    results by using the -u option to display only files opened by a specific user.
    If you want to display only files opened by user "user1", use the following command:


    ```

    lsof -u user1

    ```


    If you identified a suspicious file from the previous output, you can view all
    processes accessing it by using the -r option followed by the file name. If the
    suspicious file is "log.txt", use the following command:


    ```

    lsof -r log.txt

    ```


    The previous command returns a list of processes that access the "log.txt" file.
    Check if there are any processes that no longer work. You can also check the "USER"
    column to identify the owner of the process.


    If you have identified a suspicious process from the previous output, you can
    view more detailed information by using the -p option followed by the process
    PID. If the suspect PID is 1234, use the following command:


    ```

    lsof -p 1234

    ```


    The preceding command returns a list of all files opened by the process with PID
    1234. Checks to see if there are any files that are no longer needed and can be
    closed to free up disk space. If you are sure that the process is no longer needed,
    you can also kill it using the kill command followed by the PID.


    For example, to stop the process with PID 1234, use the following command:


    ```

    kill 1234

    ```


    This exercise showed you how to use the lsof command to find open files on your
    system and check if they are related to processes that are no longer running.
    This can help you identify unnecessary files that can be closed to free up disk
    space, as well as unnecessary processes that can be terminated.


    ## The history command


    The "history" command is integrated into most Linux shells and allows you to view
    the history of previously executed commands in the terminal.


    When you run a command in the terminal, that command is added to the history.
    You can then use the "history" command to display the list of all the commands
    you have executed.


    The "history" command without any arguments defaults to displaying the last 500
    commands you executed, numbered in descending chronological order. Each line of
    history displays the order number, followed by the order itself.


    Here are some useful options of the "history" command:


    - -c: deletes the complete history of commands executed so far.

    - -d: deletes a specific entry from the history. You must specify the order number
    to delete.

    - -a: adds to the history all commands executed in real time, rather than the
    end of the session.

    - -n: prevents duplicate commands from being added to the history.

    - -r: allows to read the history from the history file saved on disk.


    The "history" command is very useful for quickly finding a previously executed
    command. You can also use the command "!" followed by the command number to rerun
    a specific command from the history.

    '
  mdcn: "\n\n## 在每周的特定时间运行脚本\n\n若要在每周的特定时间运行脚本，你可以在 crontab 文件中添加如下的一行代码：\n\n```\n\
    0 14 * * 1-5 /path/to/my/script.sh\n```\n\n此行代码告诉 crontab 在周一至周五的下午 2:00 位于 \"\
    /path/to/my/\" 文件夹下的 \"script.sh\" 脚本。\n\n## 每分钟运行一次脚本\n\n若要每分钟运行一次脚本，你可以在 crontab\
    \ 文件中添加如下所示的代码：\n\n```\n* * * * /path/to/my/script.sh\n```\n\n此行代码告诉 crontab 每分钟运行一次位于\
    \ \"/path/to/my/\" 文件夹下的 \"script.sh\" 脚本。\n\ncrontab 命令还有许多其他选项和参数，允许你指定更复杂的时间间隔、特定的星期几等。\n\
    \n## nohup 命令\n\nnohup 命令（\"no hang up\" 的缩写）允许你在后台运行运行命令或脚本，即使与终端的连接丢失或关闭，也不会被中断。\n\
    \n当命令在终端中正常执行时，如果与终端的连接丢失，命令将被终止。如果你运行一个耗时较长的命令，或者你想在后台运行命令而不通过关闭会话或终端来中断其执行，这就会产生问题。\n\
    \nnohup 命令通过允许命令在后台运行，并将将其标准输出和错误输出重定向到指定的文件，解决了此问题。因此，即使与终端的连接丢失，命令也会在后台继续执行，且其输出将存储在指定文件中。\n\
    \nnohup 命令的语法如下：\n\n```\nnohup command [options] [arguments] &\n```\n\n- command：要运行的命令或脚本。\n\
    - [options]:针对要执行命令的特定选项。\n- [arguments]:针对要执行命令的特定参数。\n- &: 命令末尾的“&””符号允许其在后台执行。\n\
    \nnohup 命令还使用一个默认文件来存储命令的标准输出和错误输出。该文件名为 nohup.out。如果你想指定另一个输出文件，可以使用 -o 选项后跟文件名。\n\
    \n假设你在当前目录下有一个名为 \"my_script.sh\" 的 shell 脚本，并且你想用 nohup 在后台运行它：\n\n```\nnohup\
    \ sh my_script.sh > output.log &\n```\n\n这将使用 nohup 在后台运行 \"my_script.sh\" 脚本，并将输出重定向到\
    \ \"output.log\" 文件。命令末尾的 \"&\" 符号将释放控制台并让你继续进行工作。\n\n如果你想检查脚本是否仍在运行，可以使用 \"ps\"\
    \ 命令显示运行进程列表：\n\n```\nps -ef | grep my_script.sh\n```\n\n这将显示名称中包含 \"my_script.sh\"\
    \ 的运行进程列表。\n\n你也可以检查 \"output.log\" 文件的内容来查看脚本生成的输出：\n\n```\ncat output.log\n\
    ```\n\n这将在控制台中显示 \"output.log\" 文件的内容。\n\n注意，nohup 命令适用于在服务器或远程机器上后台运行脚本，因为即使控制台连接丢失或用户注销，脚本也会保持运行。\n\
    \n## lsof 命令\n\nlsof (List Open Files) 命令用于显示 Linux 或 Unix 系统上运行的进程所打开的文件。该命令还可以显示其他信息，如打开的端口、套接字、网络连接、运行进程以及进程使用的共享库。\n\
    \nlsof 的语法如下：\n\n```\nlsof [options]\n```\n\n lsof 命令的一些常用选项有：\n\n- -i: 显示网络连接的打开文件。\n\
    - -u: 显示特定用户打开的文件。\n- -p: 显示特定进程打开的文件。\n- -c: 显示特定命令名称打开的文件。\n\nlsof 命令对于诊断性能问题、文件错误、文件泄漏和网络连接非常有用。它还可以用于查找使用特定文件的进程，并在必要时停止或重启它们。\n\
    \n注意的是，要使用 lsof 命令，你必须拥有 root 权限或查看其他用户或进程打开的文件的用户权限。\n\n### 查看特定用户打开的文件：\n\n\
    要显示特定用户打开的文件，请使用 -u 选项后跟用户名。例如，显示用户 \"ubuntu\" 打开的文件，输入：\n\n```\nlsof -u ubuntu\n\
    ```\n\n此命令将显示用户 \"ubuntu\" 打开的所有文件。\n\n### 显示特定进程打开的文件：\n\n要显示特定进程打开的文件，请使用 -p\
    \ 选项后跟进程 ID (PID)。例如，显示 PID 为 1234 的进程打开的文件，输入：\n\n```\nlsof -p 1234\n```\n\n\
    此命令将显示 PID 为 1234 的进程打开的所有文件。\n\n### 显示特定命令打开的文件：\n\n要查看特定命令打开的文件，请使用 -c 选项后跟命令名。例如，显示\
    \ \"apache2\" 进程打开的文件，输入：\n\n```\nlsof -c apache\n```\n\n此命令将显示 \"apache2\" 进程打开的所有文件。\n\
    \n### 显示特定目录打开的文件：\n\n要显示特定目录的打开的文件，将目录名作为命令参数。例如，显示 \"/var/log\" 目录的打开的文件，输入：\n\
    \n```\nlsof /var/log\n```\n\n此命令将显示 \"/var/log\" 目录中的所有打开文件。\n\n这些示例并不是详尽的，但它们应该能让你了解如何使用\
    \ lsof 命令诊断系统问题。\n\n你注意到系统上的磁盘空间正在迅速减少，但你不知道空间被什么占用了。使用 lsof 命令查找文件，并检查它们是否与不再运行的进程有关。\n\
    \n首先运行以下命令来显示系统上所有打开的文件：\n\n```\nlsof\n```\n\n之前的命令返回了一个非常长的打开文件列表。你可以通过 -u 选项来缩小范围，只显示特定用户打开的文件。如果你只想显示用户\
    \ \"user1\" 打开的文件，请使用以下命令：\n\n```\nlsof -u user1\n```\n\n如果你从之前的输出中识别出一个可疑文件，可以使用\
    \ -r 选项后跟文件名来查看访问它的所有进程。如果可疑文件是 \"log.txt\"，使用以下命令：\n\n```\nlsof -r log.txt\n\
    ```\n\n之前的命令返回了访问 \"log.txt\" 的进程列表。你还可以检查 \"USER\" 列来识别进程的所有者。\n\n如果你从之前的输出识别出一个可疑进程，可以使用\
    \ -p 选项后跟 PID 来查看更详细的信息。如果怀疑 PID 是 1234，使用以下命令：\n\n```\nlsof -p 1234\n```\n\n\
    该命令返回了 PID 为 1234 的进程打开的所有文件。检查是否有不再需要的文件，以释放磁盘空间。如果你确定该进程不再需要，还可以使用 kill 命令后跟\
    \ PID 来杀死它。\n\n例如，停止 PID 为 1234 的进程，使用以下命令：\n\n```\nkill 1234\n```\n\n这次练习向你介绍了如何使用\
    \ lsof 命令查找系统上的打开文件，并检查它们是否与不再运行的进程有关。这可以帮助你识别可以关闭以释放磁盘空间的必要文件，以及可以终止的必要进程。\n\n\
    ## history 命令\n\n\"history\" 命令集成在大多数 Linux shell 中，允许你查看终端中之前执行的命令历史。\n\n当你在终端中运行命令时，该命令会被添加到历史中。随后你可以可以使用\
    \ \"history\" 命令显示你执行过的所有命令列表。\n\n不带参数的 \"history\" 命令默认显示你执行的最后 500 条命令，按时间倒序排列。每行历史都会显示序号，然后是序号本身。\n\
    \n以下是 \"history\" 命令的一些有用选项：\n\n- -c: 删除目前为止执行的所有命令历史。\n- -d: 删除历史中的特定条目。你必须指定要删除的序号。\n\
    - -a: 将实时执行的所有命令添加到历史中，而不是等到会话结束。\n- -n: 防止重复命令添加到历史中。\n- -r: 允许从保存在磁盘上的历史文件中读取历史。\n\
    \n"
