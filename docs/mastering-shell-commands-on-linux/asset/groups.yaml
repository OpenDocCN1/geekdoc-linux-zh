    Loops are a fundamental part of shell scripting. They allow a sequence of commands
    to be repeated multiple times until a specified condition is met. There are several
    types of shell loops, but the most commonly used are the for loop and the while
    loop.


    The for loop in shell is a loop control structure used to execute a set of statements
    multiple times. It lets you loop through a sequence of items such as numbers,
    strings, or files, and execute a series of statements for each item in the sequence.


    Here is the general syntax of the for loop in shell:


    ```

    for VARIABLE in SEQUENCE

    do

    COMMAND1

    COMMAND2

    ...

    done

    ```


    VARIABLE is an iteration variable that takes the value of each element of SEQUENCE
    at each loop turn.


    SEQUENCE can be a space-separated list of values, a range of numbers, or a file
    containing data.


    COMMAND1, COMMAND2, etc. are commands that will be executed for each iteration
    of the loop.


    ```

    for i in 1 2 3 4 5

    do

    echo "iteration $i"

    done

    ```


    This script uses a shell for loop to iterate over a list of numbers from 1 to
    5. For each iteration, the current value of i is displayed using the echo command
    and the message "iteration $i".


    The loop executes with the following steps:


    - The variable i is initialized to the first value in the list, i.e. 1.

    - The loop condition is checked and if true, the loop body is executed. In this
    case, the message "iteration 1" is displayed.

    - The value of i is updated to the next value in the list, which is 2.

    - The loop condition is checked again and the loop body is executed if true. In
    this case, the message "iteration 2" is displayed.

    - This step is repeated until all values in the list have been processed and the
    loop stops.


    The final result will therefore show:


    - iteration 1

    - iteration 2

    - iteration 3

    - iteration 4

    - iteration 5


    In the following case, for loop iterates through all the files in the /home/user/documents
    directory and displays the name of the file being processed each time. You can
    also add other commands to perform actions on each file, such as compress, copy,
    delete, etc.


    ```

    for file in $(ls /home/user/documents)

    do

    echo "Processing file $file"

    # other commands to process the file

    done

    ```


    Note that you must enclose the expression $(ls /home/user/documents) in quotes
    to ensure files with spaces in their names are not split into multiple items when
    looping.


    The for loop iterates through a sequence of numbers from 0 to 10. For each round
    of the loop, the if condition checks whether the current number is even or odd
    using the % modulo and displays a corresponding message.


    ```

    for (( i=0; i<=10; i++ ))

    do

    if [ $((i%2)) -eq 0 ]

    then

    echo "$i is an even number"

    else

    echo "$i is an odd number"

    fi

    ```


    The syntax (( i=0; i<=10; i++ )) is used to define an iteration sequence for the
    loop. i=0 defines the initial value of variable i, i<=10 defines the exit condition
    of the loop, and i++ increments the value of i at each turn of the loop.


    This example shows how you can use the for loop to accomplish more complex tasks
    by combining conditions and operators.


    ```

    files=(/home/user/documents/*)

    for (( i=0; i<${#files[@]}; i++ ))

    do

    file=${files[i]}

    if [ -f $file ]

    then

    echo "Processing file $file"

    # other commands to process the file

    elif [ -d $file ]

    then

    echo "Processing directory $file"

    # other commands to process the directory

    fi

    done

    ```


    In this case, the for loop iterates through a list of files and directories, which
    are stored in an array files, created using the syntax files=(/home/user/documents/*).
    For each round of the loop, the if condition checks whether the current element
    is a file or a directory using the -f or -d command and performs actions accordingly.


    The syntax ${files[i]} is used to access the i-th element of the array files at
    each turn of the loop, while ${#files[@]} returns the number of elements in the
    array.


    This example shows how you can use the for loop to loop through a list of files
    and directories and perform different actions based on their type.


    The shell while loop repeats a sequence of commands as long as a specified condition
    is met. The basic syntax of the while loop is as follows:


    ```

    while condition

    do

    commands

    done

    ```


    Commands between do and done are executed as long as the condition is true.


    Here is a simple example of a while loop:


    ```

    number=1

    while [ $number -le 10 ]

    do

    echo $number

    number=$((number + 1))

    done

    ```


    This script will display numbers from 1 to 10.


    It is important to note that the condition must be written in square brackets
    ([ ]) to be correctly interpreted as a shell command.


    It is also possible to control the loop using the break and continue statements.
    break exits the loop immediately, while continue moves to the next sequence.


    Here is an example of using break and continue in a while loop:


    ```

    number=1

    while [ $number -le 10 ]

    do

    if [ $number -eq 5 ]

    then

    break

    fi

    if [ $number -eq 3 ]

    then

    number=$((number + 1))

    continue

    fi

    echo $number

    number=$((number + 1))

    done

    ```


    The number variable is initialized to 1.


    The condition [ $number -le 10 ] is verified. As long as this condition is true,
    the loop will be executed.


    In the loop, the condition [ $number -eq 5 ] is checked. If this condition is
    true, the break command is executed, which breaks the loop.


    The condition [ $number -eq 3 ] is verified. If this condition is true, the continue
    command is executed, which jumps to the next iteration of the loop without executing
    the remaining statements of the current loop.


    If none of the previous conditions is true, the count value is displayed.


    The number value is incremented by 1.


    The loop repeats from step 2 until the condition [ $number -le 10 ] is no longer
    true.


    At the end of the loop, the following numbers will be displayed: 1 2 4.


    It is important to make good use of break and continue statements to avoid infinite
    loops or unexpected behavior in your scripts.


    In conclusion, for and while loops are powerful tools for automating repetitive
    shell tasks. It is important to fully understand their operation and their syntax
    in order to use them effectively in your scripts.


    Exercise: Write a shell script that displays numbers from 1 to 10, using a for
    loop.


    ```

    #!/bin/bash

    for i in {1..10}

    do

    echo $i

    done

    ```


    This script uses the syntax for i in {1..10} to define a sequence of numbers from
    1 to 10. On each loop, the echo command is used to display the current value of
    i.


    To run this script, save it to a file with an .sh extension, give it execute permissions
    with the command chmod +x file_name.sh and run it with the command ./file_name.sh.
    The script will display numbers from 1 to 10.


    Exercise: Write a shell script that takes a username as input and displays all
    the directories in the user''s home directory using a for loop.


    Solution:


    ```

    #!/bin/bash

    read -p "Enter a username: " username

    for directory in /home/$username/*

    do

    if [ -d $directory ]

    then

    echo $directory

    fi

    done

    ```


    This script uses the read command to read the user''s username, which is then
    used to create the path to the user''s home directory. The for loop then loops
    through all items in the home directory, and the if condition checks whether each
    item is a directory using the -d command. If the item is a directory, it is displayed
    using the echo command.


    To run this script, save it to a file with an .sh extension, give it execute permissions
    with the command chmod +x file_name.sh and run it with the command ./file_name.sh.
    The script will show all directories in the entered user''s home directory.

