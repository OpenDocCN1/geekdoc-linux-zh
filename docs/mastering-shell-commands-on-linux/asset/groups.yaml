- md: "\n```bash\nsort list_of_files.txt\n```\n\nsort command sorts the lines of the\
    \ `list_of_files.txt` file. Redirecting standard input (`<`) tells the sort command\
    \ to read input from this file rather than from the keyboard.\n\nRedirecting error\
    \ output allows the error output of a command to be redirected to a file rather\
    \ than displayed on the screen. To do this, you must use the `2>` operator followed\
    \ by the name of the file where you want to save the error output.\n\nHere is\
    \ an example:\n\n```bash\nls /foo/bar 2> errors.txt\n```\n\n`ls` command attempts\
    \ to display the list of files in the /foo/bar directory, which does not exist.\
    \ Redirecting error output (`2>`) sends the error output generated by this command\
    \ to a file named `errors.txt` rather than displaying it on the screen.\n\nIt\
    \ is possible to combine multiple redirects using `|`, `>`, `<`, and `2>`.\n\n\
    Here is an example:\n\n```bash\ngrep \"pattern\" < file.txt | sort > result.txt\
    \ 2> errors.txt\n```\n\n`grep` command reads input from `file.txt`, searches for\
    \ lines containing the specified pattern, and sends the output to the `sort` command.\
    \ Output from the `sort` command is saved to a file named `result.txt`, while\
    \ error output is saved to a file named `errors.txt`.\n\nThere are several ways\
    \ to send email from the command line, but one of the most common is to use the\
    \ `mail` command.\n\nThe `mail` command allows you to send emails from the command\
    \ line. To use this command, you must first ensure that the email client (e.g.,\
    \ Sendmail) is installed on your system.\n\nHere is an example of a simple mail\
    \ command to send an email from the command line:\n\n```bash\necho \"This is the\
    \ message body\" | mail -s \"This is the subject\" recipient@example.com\n```\n\
    \nIn this example, the `echo` command is used to create the message body. The\
    \ `mail` command then sends the message to the specified recipient's email address,\
    \ with a subject specified with the `-s` option.\n\nHowever, for this to work,\
    \ you need to ensure that your system's mail server is properly configured to\
    \ send emails. If you have problems with this method, you can use another method\
    \ which is to use `sendmail`.\n\n`sendmail` is a program that sends emails from\
    \ the command line using an existing mail server. To use `sendmail`, you must\
    \ create a file containing the message information, including the email header,\
    \ body, and recipient.\n\nHere is an example of a simple sendmail command:\n\n\
    ```bash\n(echo \"To: recipient@example.com\"; echo \"Subject: This is the subject\"\
    ; echo \"This is the message body\") | /usr/sbin/sendmail -t\n```\n\nIn this example,\
    \ the message information is stored in a subshell, which is then sent to `sendmail`\
    \ with the `-t` option.\n\nNote that to use `sendmail`, you must ensure that the\
    \ sendmail program is installed on your system and that you have permission to\
    \ run it.\n\n# Example\n\nSuppose you have a shell script that monitors a certain\
    \ directory and sends email when files are added to that directory. Here is an\
    \ example shell script that uses `sendmail` to send email:\n\n```bash\n#!/bin/sh\n\
    WATCH_DIR=\"path/to/directory\"\n\nwhile true; do\n  file_count=$(ls $WATCH_DIR\
    \ | wc -l)\n  if [ $file_count -gt 0 ]; then\n    mailbody=\"There are $file_count\
    \ new files in the $WATCH_DIR directory.\"\n    echo $mailbody | /usr/sbin/sendmail\
    \ -t <<EOF\nTo: recipient@example.com\nSubject: Notification: New files added\
    \ in $WATCH_DIR directory\n\n$mailbody\nEOF\n  fi\n  sleep 60\ndone\n```\n\nIn\
    \ this example, the script uses a `while true` loop to continuously monitor the\
    \ directory specified in the `WATCH_DIR` variable. The `file_count` variable stores\
    \ the number of files in the directory, and if this number is greater than zero,\
    \ the script sends an email using `sendmail`.\n\nThe email message body is stored\
    \ in the `mailbody` variable, and the `echo` command is used to display the message\
    \ body. The `sendmail` command is then used to send the message to the email address\
    \ specified in the email header.\n\nNote that the `sendmail` command is used with\
    \ the `-t` option to specify the email header and recipient. The message header\
    \ and body are then supplied using a command input block (here, using `<`).\n\n\
    Finally, the script uses the `sleep` command to pause for 60 seconds before starting\
    \ the loop again.\n\nThe command displays the current system date and time. It\
    \ can also be used to set the system date and time.\n\nHere are the most used\
    \ date options:\n\n- %d: day of the month (01 to 31)\n- %m: month (01 to 12)\n\
    - %y: 2-digit year (for example, 21 for the year 2021)\n- %Y: 4-digit year\n-\
    \ %H: hour in 24-hour format (00 to 23)\n- %M: minute (00 to 59)\n- %S: second\
    \ (00 to 59)\n\nTo display the current system date and time, simply enter the\
    \ `date` command with no options:\n\n```bash\ndate\n```\n\nMon Feb 15 11:48:16\
    \ CET 2023\n\nIf you want to display the date in a particular format, you can\
    \ use the options mentioned earlier. For example, to display the date in \"DD/MM/YYYY\"\
    \ format:\n\n```bash\ndate +\"%d/%m/%Y\"\n```\n02/15/2023\n"
  mdcn: "\n\n```bash\nsort list_of_files.txt\n```\n\n`sort` 命令对 `list_of_files.txt`\
    \ 文件的行进行排序。重定向标准输入（`<`）告诉 `sort` 命令从该文件读取输入，而不是从键盘。\n\n重定向错误输出允许将命令的错误输出定向到文件而不是显示在屏幕上。要执行此操作，你必须使用\
    \ `2>` 运算符，后跟要保存错误输出的文件名。\n\n这是一个示例：\n\n```bash\nls /foo/bar 2> errors.txt\n```\n\
    \n`ls` 命令尝试显示 /foo/bar 目录下的文件列表，但该目录并不。重定向错误输出（`2>`）将此命令生成的错误输出发送到名为 `errors.txt`\
    \ 的文件中，而不是显示在屏幕上。\n\n可以使用 `|`、`>`、`<` 和 `2>` 组合多个重定向。\n\n这是一个示例：\n\n```bash\n\
    grep \"pattern\" < file.txt | sort > result.txt 2> errors.txt\n```\n\n`grep` 命令从\
    \ `file.txt` 读取输入，搜索包含指定模式的行，并将输出发送给 `sort` 命令。`sort` 命令的输出保存到名为 `result.txt`\
    \ 的文件中，而错误输出保存到名为 `errors.txt` 的文件中。\n\n从命令行发送电子邮件有多种方法，但最常用的之一是使用 `mail` 命令。\n\
    \n`mail` 命令允许你从命令行发送电子邮件。要使用此命令，你必须首先确保系统上安装了邮件客户端（例如 Sendmail）。\n\n这是一个从命令行发送电子邮件的简单\
    \ mail 命令示例：\n\n```bash\necho \"This is the message body\" | mail -s \"This is\
    \ the subject\" recipient@example.com\n```\n\n在此示例中，使用 `echo` 命令来创建消息正文。然后使用 `mail`\
    \ 命令将消息发送到指定的收件人邮箱地址，并通过 `-s` 选项指定主题。\n\n然而，为了使此方法生效，你需要确保系统的邮件服务器已正确配置以发送电子邮件。如果你在使用此方法时遇到问题，可以使用另一种方法，即使用\
    \ `sendmail`。\n\n`sendmail` 是一个使用现有的邮件服务器从命令行发送电子邮件的程序。要使用 `sendmail`，你必须创建一个包含消息信息的文件，包括邮件头、正文和收件者。\n\
    \n这是一个简单的 sendmail 命令示例：\n\n```bash\n(echo \"To: recipient@example.com\"; echo\
    \ \"Subject: This is the subject\"; echo \"This is the message body\") | /usr/sbin/sendmail\
    \ -t\n```\n\n在此示例中，消息信息存储在子 shell 中，然后通过 `-t` 选项发送给 `sendmail`。\n\n注意，要使用 `sendmail`，你必须确保系统上安装了\
    \ `sendmail` 程序，并且你有有运行它的权限。\n\n# 示例\n\n假设你有一个 shell 脚本，它可以监控某个目录并在向该目录添加文件时发送电子邮件。这是一个使用\
    \ `sendmail` 发送电子邮件的 shell 脚本示例：\n\n```bash\n#!/bin/sh\nWATCH_DIR=\"path/to/directory\"\
    \n\nwhile true; do\n  file_count=$(ls $WATCH_DIR | wc -l)\n  if [ $file_count\
    \ -gt 0 ]; then\n    mailbody=\"There are $file_count new files in the $WATCH_DIR\
    \ directory.\"\n    echo $mailbody | /usr/sbin/sendmail -t <<EOF\nTo: recipient@example.com\n\
    Subject: Notification: New files added in $WATCH_DIR directory\n\n$mailbody\n\
    EOF\n  fi\n  sleep 60\ndone\n```\n\n在此示例中，脚本使用 `while true` 循环持续监控 `WATCH_DIR`\
    \ 变量中指定的目录。`file_count` 变量存储目录中的文件数量，如果该数字大于零，脚本将使用 `sendmail` 发送电子邮件。\n\n邮件正文存储在\
    \ `mailbody` 变量中，并使用 `echo` 命令显示消息正文。然后使用 `sendmail` 命令将消息发送到邮件头中指定的邮箱地址。\n\n\
    注意，`sendmail` 命令配合 `-t` 选项使用，指定邮件头和收件人。消息头和正文随后通过命令输入块（这里使用 `<`）提供。\n\n最后，脚本使用\
    \ `sleep` 命令在再次开始循环之前暂停 60 秒。\n\n该命令显示当前的系统日期和时间。它也可以用于设置系统日期和时间。\n\n以下是最常用的 date\
    \ 选项：\n\n- %d: 日（01 到 31）\n- %m: 月份（01 到 12）\n- %y: 两位数的年份（例如，2021 年为 21）\n- %Y:\
    \ 四位数的年份\n- %H: 24 小时制的小时（00 到 23）\n- %M: 分（00 到 59）\n- %S: 秒（00 到 59）\n\n要显示当前的系统日期和时间，只需输入不带选项的\
    \ `date` 命令：\n\n```bash\ndate\n```\n\nMon Feb 15 11:48:16 CET 2023\n\n如果你想以特定的格式显示日期，可以使用前面提到的选项。例如，以“DD/MM/YYYY”格式显示日期：\n\
    \n```bash\ndate +\"%d/%m/%Y\"\n```\n02/15/2023\n\n"
