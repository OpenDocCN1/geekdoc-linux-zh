    The tr command is used to convert input characters and replace them with other
    output characters, or remove them. The tr command is commonly used to manipulate
    text files, data streams.


    # Syntax


    The syntax of tr is as follows:


    tr [options] set1 set2


    Or :


    set1 is the set of characters to convert or remove.

    set2 is the set of characters that should replace the characters in set1.


    # Common Options


    Here are some used options of the tr command:


    +   -c: Complementary, which means that the character set specified with the option
    is complementary to set1. For example, tr -c ''aeiou'' ''\n'' will remove all
    non-vowel characters and replace them with a newline.

    -d: Delete, which means the characters specified with the option will be deleted.
    For example, tr -d ''\r'' removes carriage returns from the output.

    -s: Remove duplicate characters, which means duplicate characters in set1 will
    be removed. For example, tr -s '' '' ''\n'' removes duplicate spaces in the output
    and replaces them with a newline.'
  - '[PAGE 80]


    -t: Translate, which means that the characters from set1 will be replaced by the
    corresponding characters from set2. For example, tr ''abcd'' ''jklm'' replaces
    the characters a, b, c and d with the characters j, k, l and m respectively.


    # Examples of use


    Remove carriage returns from a file:


    ```

    tr -d ''\r'' < file.txt > unix_file.txt

    ```


    The tr command removes all carriage returns from the file "file.txt" and redirects
    the output to a new file "file_unix.txt".'
