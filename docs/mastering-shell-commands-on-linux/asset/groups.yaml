- md: "\nA shell script is a program that contains a series of shell commands that\
    \ you can execute as a program. Shell scripts are often used to automate common\
    \ tasks or to perform more complex system operations.\n\nHere are the basic steps\
    \ to create a shell script:\n\nCreate a new file: Open your text editor and create\
    \ a new file. You can use the .sh file extension to indicate that the file is\
    \ a shell script.\n\nAdd a script header: The first line of your script should\
    \ be a script header that indicates which command interpreter (shell) the script\
    \ should be run against. For example, for a Bash shell script, you can use the\
    \ following line:\n\n```\n#!/bin/bash\n```\n\nAdd shell commands: After the script\
    \ header, you can add a series of shell commands that you want to run.\n\nSave\
    \ the file: When you are done adding commands to the script, save the file using\
    \ the .sh file extension.\n\nMake the script executable: To run the script, you\
    \ must first make it executable using the chmod command. For example, to make\
    \ a script executable for the current user, you can use the following command:\n\
    \n```\nchmod u+x script.sh\n```\n\nRun the script: Once the script is made executable,\
    \ you can run it by typing the script name in the terminal. Make sure you are\
    \ in the directory containing the script, otherwise you will need to specify the\
    \ full path to the script.\n\nHere is a simple sample shell script to illustrate\
    \ these steps:\n\n```\n#!/bin/bash\n# This script displays a welcome message to\
    \ the user\n\necho \"Welcome to my shell script!\"\necho \"Today is\" `date`\n\
    echo \"Your current working directory is: `pwd`\"\n```\n\nIn this example, the\
    \ shell script displays a welcome message to the user, the date, and the location\
    \ of the current working directory. To run this script, you can save the code\
    \ in a file called welcome.sh, make it executable with the command `chmod u+x\
    \ welcome.sh`, and run it by typing ./welcome.sh in the terminal.\n\nBackup script:\
    \ This script creates a backup copy of specific files and/or folders on the system,\
    \ in a dedicated backup folder. The script often uses the tar command to create\
    \ an archive of files, then uses gzip to compress the archive. Here is an example\
    \ backup script:\n\n```bash\n#!/bin/bash\n# This script creates a backup copy\
    \ of the specified files\n\n# Variables for backup\nbackup_dir=\"/var/backup\"\
    \ndate=$(date +\"%Y-%m-%d\")\narchive_file=\"backup-$date.tar.gz\"\n\n# Files\
    \ and folders to backup\nfiles_to_backup=\"/etc/home/var/log\"\n\n# Create backup\
    \ folder if it doesn't already exist\nif [ ! -d $backup_dir ]; then\n    mkdir\
    \ -p $backup_dir\nfi\n\n# Create the backup archive\ntar czf $backup_dir/$archive_file\
    \ $files_to_backup\n```\n\nA variable is a named memory location that can hold\
    \ a value that can be changed. Variables are often used to store values that can\
    \ be used by programs, shell scripts, and work environments.\n\nThere are two\
    \ types of variables in Linux: system variables and user variables.\n\n### System\
    \ variables:\nSystem variables are predefined and built-in variables in the Linux\
    \ operating system. They are used by the operating system to store system information\
    \ such as host name, user name, path to system files, etc.\n\nExamples of system\
    \ variables:\n- $PATH: This variable contains a colon-separated list of directories\
    \ where executable programs can be found.\n- $HOME: This variable contains the\
    \ full path to the current user's directory.\n- $USER: this variable contains\
    \ the name of the current user.\n- $HOSTNAME: this variable contains the name\
    \ of the host (name of the machine) on which the user is connected.\n\n### User\
    \ variables:\nUser variables are user-defined variables that can be used in shell\
    \ scripts and desktop environments. They are created by assigning a value to a\
    \ specific variable name.\n\nExamples of user variables:\n- $MY_VAR: This variable\
    \ contains a user-defined custom value.\n- $INPUT: This variable can be used to\
    \ store user input from the keyboard or other input device.\n- $OUTPUT: This variable\
    \ can be used to store the output of a program or shell script.\n\nVariables can\
    \ be used to store temporary or permanent information, such as system configurations,\
    \ file paths, file names, etc. They can be defined and used in shell scripts,\
    \ programs or work environments to store and retrieve important information.\n\
    \n### Using the PATH variable:\nThe PATH variable is used to define directories\
    \ where executable programs can be found. If you want to run the 'ls' program\
    \ from the terminal, the operating system looks for the 'ls' file in the directories\
    \ defined in the PATH variable. If 'ls' is present in one of these directories,\
    \ it will be executed.\n\nTo add a new directory to the PATH variable, you can\
    \ use the following command:\n\n```\nexport PATH=$PATH:/path/to/new/directory\n\
    ```\n\nIn this example, the PATH variable is modified to include the new directory\
    \ '/path/to/new/directory'.\n\n### Using custom variables:\nCustom variables can\
    \ be used to store temporary or permanent information. If you want to store the\
    \ name of a file in a variable, you can use the following command:\n\n```\nMY_FILE=\"\
    my_file.txt\"\n```\n\nThe MY_FILE variable is created and initialized with the\
    \ value \"my_file.txt\". This variable can be used in shell scripts to perform\
    \ operations on the stored file.\n\n### Using the USER variable:\nThe USER variable\
    \ contains the name of the currently logged-in user. It can be used in scripts\
    \ to personalize output or check permissions.\n"
  mdcn: "\n\nShell 脚本（shell script）是一个包含系列 shell 命令的程序，你可以像执行程序一样运行它。Shell 脚本通常用于自动化常见任务或执行更复杂的系统操作。\n\
    \n创建 shell脚本的基本步骤：\n\n创建一个新文件：打开你的文本编辑器并创建一个新文件。你可以使用 .sh 文件扩展名来指示该文件是一个 shell\
    \ 脚本。\n\n添加脚本头部：你脚本的第一行应该是脚本头部（shebang），用于指示脚本应该在何种命令解释器（shell）下运行。例如，对于 Bash\
    \ shell 脚本，你可以使用以下行：\n\n```\n#!/bin/bash\n```\n\n添加 shell 命令：在脚本头部之后，你可以添加你想要运行的一系列\
    \ shell 命令。\n\n保存文件：当你完成向脚本中添加命令后，使用 .sh 文件扩展名保存该文件。\n\n赋予脚本可执行权限：要运行脚本，你必须首先使用\
    \ `chmod` 命令让其具有可执行权限。例如，要为当前用户赋予脚本可执行权限，可以使用以下命令：\n\n```\nchmod u+x script.sh\n\
    ```\n\n运行脚本：一旦脚本变为可执行状态，你就可以在终端中输入脚本名称来运行它。请确保你处于包含脚本的目录中，否则你需要指定脚本的完整路径。\n\n\
    这里是一个简单的示例 shell 脚本，用于说明这些步骤：\n\n```\n#!/bin/bash\n# 此脚本向用户显示欢迎消息\n\necho \"Welcome\
    \ to my shell script!\"\necho \"Today is\" `date`\necho \"Your current working\
    \ directory is: `pwd`\"\n```\n\n在这个示例中，shell 脚本向用户显示欢迎消息、日期以及当前工作目录的位置。要运行此脚本，你可以将代码保存为名为\
    \ welcome.sh 的文件，使用命令 `chmod u+x welcome.sh` 赋予其可执行权限，并在终端中输入 `./welcome.sh` 来运行。\n\
    \n备份脚本：此脚本在指定的备份文件夹中创建特定文件和/文件夹的备份副本。脚本通常使用 `tar` 命令创建文件归包，然后使用 `gzip` 压缩归包。这是一个备份脚本示例：\n\
    \n```bash\n#!/bin/bash\n# 此脚本创建指定文件的备份副本\n\n# 备份变量\nbackup_dir=\"/var/backup\"\
    \ndate=$(date +\"%Y-%m-%d\")\narchive_file=\"backup-$date.tar.gz\"\n\n# 需要备份的文件和文件夹\n\
    files_to_backup=\"/etc/home/var/log\"\n\n# 如果备份文件夹不存在，则创建\nif [ ! -d $backup_dir\
    \ ]; then\n    mkdir -p $backup_dir\nfi\n\n# 创建备份归包\ntar czf $backup_dir/$archive_file\
    \ $files_to_backup\n```\n\n变量是一个命名的内存位置，可以存储可以更改的值。变量通常用于存储程序、shell 脚本和工作环境可以使用的值。\n\
    \nLinux 中有两种类型的变量：系统变量和用户变量。\n\n### 系统变量：\n系统变量是 Linux 操作系统中预定义的内置变量。它们被操作系统用于存储系统信息，如主机名、用户名、系统文件路径等。\n\
    \n系统变量示例：\n- $PATH：此变量包含一个由冒号分隔的目录列表，这些目录中可以找到可执行程序。\n- $HOME：此变量包含当前用户目录的完整路径。\n\
    - $USER：此变量包含当前用户的名称。\n- $HOSTNAME：此变量包含用户所连接的主机名称（机器名称）。\n\n### 用户变量：\n用户变量是用户定义的变量，可以在\
    \ shell 脚本和桌面环境中使用。它们通过给特定的变量名赋值来创建。\n\n用户变量示例：\n- $MY_VAR：此变量包含一个用户定义的自定义值。\n\
    - $INPUT：此变量可以存储来自键盘或其他输入设备的用户输入。\n- $OUTPUT：此变量可以用于存储程序或 shell 脚本的输出。\n\n变量可以用于存储临时或永久信息，例如系统配置、文件路径、文件名等。它们可以在\
    \ shell 脚本、程序或工作环境中定义和使用，用于存储和检索重要信息。\n\n### 使用 PATH 变量：\nPATH 变量用于定义可以找到可执行程序的目录。如果你想从终端中运行\
    \ 'ls' 程序，操作系统会在 PATH 变量定义的目录中查找 'ls' 文件。如果这些目录中的其中一个存在 'ls'，它就会被执行。\n\n要向 PATH\
    \ 变量中添加新目录，可以使用以下命令：\n\n```\nexport PATH=$PATH:/path/to/new/directory\n```\n\n\
    在这个示例中，PATH 变量被修改以包含新目录 '/path/to/new/directory'。\n\n### 使用自定义变量：\n自定义变量可以存储临时或永久信息。如果你想在变量中存储文件名，可以使用以下命令：\n\
    \n```\nMY_FILE=\"my_file.txt\"\n```\n\n创建 MY_FILE 变量并将其初始化为 \"my_file.txt\"。该变量可以在\
    \ shell 脚本中使用，对存储的文件执行操作。\n\n### 使用 USER 变量：\nUSER 变量包含当前登录用户的名称。它可以在脚本中用于个性化输出或检查权限。\n\
    \n"
