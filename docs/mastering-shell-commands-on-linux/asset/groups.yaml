    The syntax is as follows:


    ```

    dirname [options] path

    ```


    where path is the full path of the file whose directory path you want to extract.


    The available options are:


    - -z: don''t separate directory names (rather than with line breaks)

    - -a: show all parent directories, including the root directory.


    ## Extracting the directory path of a file


    Suppose you have a file called rapport.docx in the /home/user/documents/ directory.
