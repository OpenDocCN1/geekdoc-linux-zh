    | tmpfs | 789M | 788M | | |

    | /dev/sda1 | 237G | | | |

    | tmpfs | 4.0G | | | |

    | tmpfs | 5.0M | | | |

    | tmpfs | 4.0G | | | |

    | /dev/sdb1 | 459G | | | |

    | tmpfs | 789M | 1% | | |


    在此示例中，"df -h" 命令使用人类可读的格式显示磁盘空间使用（例如用 "1K"、1M"、"1G" 而不是字节数字）。


    你负责管理一台有多个网站的 Linux 服务器。你注意到服务器的一个硬盘已满，这可能会影响服务器性能。使用 "df" 命令找到问题出的硬盘，并检查哪些目录占据了最多的磁盘空间。


    使用 "df" 命令找到问题出的硬盘：


    ```

    df -h

    ```


    | 系统 | 大小 | 已用 | 可用 | 挂载在 |

    |---|---|---|---|---|---|

    | udev | 3.9G | 0 | 3.9G | 0% | /dev |

    | tmpfs | 791M | 2.7M | 789M | 1% | /run |

    | /dev/sda | 19G | 13G | 5.2G | 71% | / |

    | tmpfs | 3.9G | 0 | 3.9G | 0% | /dev/shm |

    | tmpfs | 5.0M | 0 | 5.0M | 0% | /run/lock |

    | tmpfs | 3.9G | 0 | 3.9G | 0% | /sys/fs/cgroup |

    | /dev/sda2 | 197G | 36G | 162G | 19% | /home |

    | tmpfs | 791M | 0 | 791M | 0% | /run/user/1000 |


    在此示例中，/dev 文件系统的已用率为 71%，仅剩 5.2 GB 磁盘空间。因此，这很可能就是问题出的硬盘。其他文件系统似乎有足够的可用磁盘空间。


    要找到满硬盘上占据最多磁盘空间的目录，你可以运行以下命令：


    ```

    du -h / | sort -rh | head -n 20

    ```


    命令 "du -h / | sort -rh | head -n 20" 用于查找文件系统根分区 (''/'') 分区上占据最多磁盘空间的目录。以下是该命令链中每个命令的作用：


    - "du -h /": 该命令计算文件系统根 (''/'') 分区上每个目录和文件的大小，采用“人类可读” ("-h") 格式。结果显示在标准输出上。

    - "sort -rh": 该命令根据大小 ("-h") 降序 ("-r") 对 "du" 命令的结果进行排序。

    - "head -n 20": 该命令显示排序后结果的前 20 行（即占据最多磁盘空间的 20 个目录）。


    "du" (Disk Usage) 命令用于查找文件系统中文件和目录所在的大小。它对于识别哪些文件或目录占据了最多的磁盘空间以及优化存储使用非常有用。


    默认情况下，"du" 命令显示指定目录内每个目录和子目录的大小。如果没有指定目录，"du" 命令将显示当前目录目录下所有文件和目录的大小。


    "du" 的语法如下：


    du [options] [文件或目录]


    常用选项：


    - -h 或 --human-readable: 以人类可读的格式显示大小（例如 1K, 2M, 3G 等），而不是字节。

    - -s 或 --summarize: 仅显示每个参数的总和。

    - -c 或 --total: 在输出末尾生成一个总计。

    - -a --all: 包含文件，而不只是目录。

    - -b 或 --bytes: 以字节输出大小。


    使用人类可读的格式显示磁盘空间使用：


    ```

    df -h

    ```


