    Exercise: Write a shell script that takes a username as input and displays all
    the directories in the user''s home directory using a for loop.


    Solution :


    ```

    #!/bin/bash

    read -p "Enter a username: " username

    for directory in /home/$Username/*

    do

    if [ -d $directory ]

    then

    echo $directory

    fi

    done

    ```


    This script uses the read command to read the user''s username, which is then
    used to create the path to the user''s home directory. The for loop then loops
    through all items in the home directory, and the if condition checks whether each
    item is a directory using the -d command. If the item is a directory, it is displayed
    using the echo command.


    To run this script, save it to a file with an .sh extension, give it execute permissions
    with the command chmod +x file_name.sh and run it with the command ./file_name.sh.
    The script will show all directories in the entered user''s home directory.'
