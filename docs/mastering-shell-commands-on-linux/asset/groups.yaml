    语法如下：


    ```

    command | xargs [options] [command to run]

    ```


    其中 "command" 是结果传递给 xargs 命令的命令，"[options]" 是 xargs 命令的额外选项，而 "[command to execute]"
    是使用提供的参数执行的命令。


    最常用的 xargs 选项有：


    - -n：指定传递给命令的最大参数数量。例如，"-n 1" 意味着每次只向命令传递一个参数。

    - -I：用提供的参数替换由选项指定的字符串。例如，"-I {}" 将用每个提供的参数替换 "{}"。

    - -t：在执行命令前显示该要执行的命令。

    - -p：在执行命令前请求用户确认。


