    the uname command is integrated in the Unix and Linux operating systems which
    allows to know information about the kernel of the operating system. it is typically
    used to display basic system information, such as operating system name, host
    name, machine type, and kernel version. It can also be used to display other information,
    such as processor architecture, operating system version, kernel version date,
    and system type.


    The command syntax is simple: uname [OPTION]...The most common options are:


    - -a : displays all information available on the system.

    - -s: display the kernel name.

    - -n: displays the host name.

    - -r: displays the kernel version.

    - -v: displays the kernel version date.

    - -m: show machine type.

    - -o: displays the name of the operating system.


    There are also other options you can use with the uname command. You can consult
    the uname command manual by running the man uname command for more information
    on the available options.


    The uname command is often used in shell scripts to retrieve system information
    and perform operations based on that information. For example, a shell script
    can use the uname command to check if the operating system is Linux and, based
    on that information, run specific commands for the Linux operating system.


    Show operating system name:


    ```

    uname -o

    linux

    ```


    This command displays the name of the operating system installed on the system.
    In this example, the operating system is Linux.


    By using the options of the uname command, you can display the specific information
    you need about the system.


    The who command displays information about users logged into a system. It usually
    displays the user name, the terminal used and the connection time. Here are the
    common who options:


    - -a: show all system processes, including logout processes.

    - -b: show the last system boot date and time.

    - -d: displays the current system uptime.

    - -H: show column headers.

    - -l: displays information about the currently logged in user.

    - -m: equivalent to who am i.

    - -q: displays the total number of users logged into the system.

    - -r: show system uptime.

    - -s: show username and login time only.

    - -t: show the terminal number the user is logged into.


    Without an option, the who command displays information about currently logged
    in users.


    The output of the who command is typically organized into three columns:


    1. The username.

    2. The terminal used for the connection.

    3. Connection time.


    Here is an example of output from the own command:


    ```

    alice tty1 2022-02-18 09:12

    bob pts/0 2022-02-18 10:05 (:0)

    ```


    This indicates that user "alice" has been online since 09:12 on February 18, 2022,
    while user "bob" has been online since 10:05 on the same day.


    In summary, the who command provides useful information about users logged into
    a Unix/Linux system, as well as login time and terminal information.


    View currently logged in user information:


    ```

    who -m

    jdoe pts/0 2022-02-18 09:10 (:0)

    ```


    This command only displays information about the user currently logged in, in
    this case "jdoe", as well as the terminal used and the login time.


    Display the total number of users logged into the system:


    ```

    who -q

    jdoe

    alice

    bob

    # users=3

    ```


    This command displays the total number of users logged into the system, as well
    as the list of logged in user names.


    Show connection information with column headers:


    ```

    who -H

    NAME LINE TIME COMMENT

    jdoe pts/0 2022-02-18 09:10 (:0)

    alice tty1 2022-02-18 09:12

    bob pts/1 2022-02-18 10:05 (::)

    ```


    This command displays connection information with column headers for better readability.


    In summary, the who command can be used to obtain various information about users
    logged into a system, such as username, terminal used, login time, and total number
    of users logged in, depending on the options provided.


    cron is a task scheduling tool in operating systems. It allows users to schedule
    the execution of scripts or commands at specific times, regularly or at regular
    intervals.


    The crontab command is used to create, view, modify, and delete crontab files
    that contain job scheduling information. Each user has their own crontab file,
    which may contain one or more scheduled task entries.


    Crontab files are usually stored in the /var/spool/cron or /var/spool/cron/crontabs
    directory, although this may vary depending on system configuration.


    The basic syntax of a crontab entry is:


    ```

    * * * * command to execute

    ```


    | Field | Description |

    | :--- | :--- |

    | * | minutes (0-59) |

    | * | hour (0-23) |

    | * | day of the month (1-31) |

    | * | months (1-12) |

    | * | weekday (0-6) (Sunday = 0) |


    Each of these fields can contain a list of values, a range of values, a step,
    or an asterisk (*), which means "all". For example, 0 * * * * means "run the command
    every minute the time is 0".


    The crontab command takes several options to manage crontab files:


    - crontab -e or crontab -e -u : Edits the crontab file of the current user or
    the specified user using the text editor defined by the VISUAL or EDITOR environment
    variable

    - crontab -l or crontab -l -u : Displays the contents of the crontab file for
    the current user or the specified user

    - crontab -r or crontab -r -u : Deletes the crontab file of the current user or
    the specified user

    - crontab -i or crontab -i -u : Ask for confirmation before deleting the crontab
    file of the current user or the specified user.


    In addition to these options, the crontab command also allows the output of scheduled
    tasks to be redirected to log files using the > or >> operator.


    ### Run a cron job every day at a specific time


    To run a cron job every day at a specific time, you can use the "crontab -e" command
    to open the cron file. Then you can add a task line that specifies the time you
    want the task to run. If you want to run a script every day at 5am, you can add
    the following line:


    ```

    0 5 * * * /path/to/script.sh

    ```


    This line specifies that the "script.sh" script should be run every day at 5am.
    The five asterisks represent the minutes, hours, days, months, and weekdays you
    want the task to run.


    ### Run a cron job every week at a specific time


    To run a cron job every week at a specific time, you can use the "crontab -e"
    command to open the cron file. Then you can add a task line that specifies the
    time and day of the week you want the task to run. If you want to run a script
    every Monday at 8am, you can add the following line:


    ```

    0 8 * * 1 /path/to/script.sh

    ```


    This line specifies that the "script.sh" script should be run every Monday at
    8am. The number "1" represents the day of the week (Monday = 1). The five asterisks
    represent the minutes, hours, days, months, and weekdays you want the task to
    run.


    ### Run a cron job every month at a specific time


    If you want to run a script every 15th of the month at 12:30, you can add the
    following line:


    ```

    30 12 15 * * /path/to/script.sh

    ```


    This line specifies that the "script.sh" script should be run every 15th of the
    month at 12:30 p.m. The first two digits represent the minutes and hours you want
    the task to run, followed by the day of the month. The last two asterisks represent
    the months and days of the week you want the task to run.


    ### Run a script every day at midnight


    To run a script every day at midnight, you can add a line like this to your crontab
    file:


    ```

    0 0 * * * /path/to/my/script.sh

    ```


    This line tells crontab to run the "script.sh" script located in the "/path/to/my/"
    folder at 00:00 every day.


    ### Run a script every hour


    To run a script every hour you can add a line like this to your crontab file:


    ```

    0 * * * * /path/to/my/script.sh

    ```


    This line tells crontab to run the "script.sh" script located in the "/path/to/my/"
    folder every full hour (e.g. 01:00, 02:00, etc.).

