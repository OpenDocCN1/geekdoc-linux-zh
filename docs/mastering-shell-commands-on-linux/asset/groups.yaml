    ```

    这将显示压缩文件 "file.gz" 中包含指定字符串的所有行。


    将输出重定向到文件：

    ```

    zcat file.gz > output.txt

    ```

    这将压缩文件 "file.gz" 的内容打印到标准输出，并将输出重定向到名为 "output.txt" 的文件。


    合并多个压缩文件：

    ```

    zcat file1.gz file2.gz file3.gz > concat.gz

    ```

    这将按照指定的顺序合并压缩文件 "file1.gz"、file2.gz" 和 "file3.gz"，并将结果保存到名为 "concat.gz" 的文件中。


