    -d: Set the field delimiter. By default, the delimiter is tab.


    -f: Specifies the fields to extract. You can specify one or more field numbers
    separated by commas.


    -b: Specifies the columns to extract in number of character positions.


    -c: Specifies the columns to extract in number of characters.


    ```

