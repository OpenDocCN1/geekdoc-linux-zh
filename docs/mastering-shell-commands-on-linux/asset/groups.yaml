  - '[PAGE 271]


    A shell script is a program that contains a series of shell commands that you
    can execute as a program. Shell scripts are often used to automate common tasks
    or to perform more complex system operations.


    Here are the basic steps to create a shell script:


    Create a new file: Open your text editor and create a new file. You can use the
    .sh file extension to indicate that the file is a shell script.


    Add a script header: The first line of your script should be a script header that
    indicates which command interpreter (shell) the script should be run against.
    For example, for a Bash shell script, you can use the following line:


    ```

    #!/bin/bash

    ```


    Add shell commands: After the script header, you can add a series of shell commands
    that you want to run.


    Save the file: When you are done adding commands to the script, save the file
    using the .sh file extension


    Make the script executable: To run the script, you must first make it executable
    using the chmod command. For example, to make a script executable for the current
    user, you can use the following command:'
  - '[PAGE 272]


    ```

    chmod u+x script.sh

    ```


    Run the script: Once the script is made executable, you can run it by typing the
    script name in the terminal. Make sure you are in the directory containing the
    script, otherwise you will need to specify the full path to the script.'
  - '[PAGE 273]


    Here is a simple sample shell script to illustrate these steps:


    ```

    #!/bin/bash

    ```


    # This script displays a welcome message to the user


    ```

    echo "Welcome to my shell script!"

    echo "Today is" `date`

    echo "Your current working directory is: `pwd`

    ```


    In this example, the shell script displays a welcome message to the user, the
    date, and the location of the current working directory. To run this script, you
    can save the code in a file called welcome.sh, make it executable with the command
    chmod u+x welcome.sh, and run it by typing ./welcome.sh in the terminal.


    Backup script: This script creates a backup copy of specific files and/or folders
    on the system, in a dedicated backup folder. The script often uses the tar command
    to create an archive of files, then uses gzip to compress the archive. Here is
    an example backup script:


    ```

    #!/bin/bash

    ```


    # This script creates a backup copy of the specified files


    ```

    # Variables for backup

    backup_dir="/var/backup"

    date=$(date +"%Y-%m-%d")

    archive_file="backup-$date.tar.gz"

    ```'
  - '[PAGE 274]


