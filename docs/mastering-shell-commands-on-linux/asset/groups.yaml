  - '[PAGE 287]


    Left join of two files using second column as key and including non-matching lines
    from file 1:


    ```

    join -1 2 -2 1 -a 1 file1.txt file2.txt

    ```'
  - '[PAGE 288]


    Right join of two files using the third column as key and including non-matching
    lines from file 2:


    ```

    join -1 3 -2 1 -a 2 file1.txt file2.txt

    ```


    It is important to note that the files must be sorted before executing the join
    command, otherwise the result may be unpredictable. To sort a file, you can use
    the sort command.'
  - '[PAGE 289]


    Consider the following two files:


    file1.txt:


    cat

    dog

    bird

    snake

    fish


    file2.txt:


    cat eats meat

    dog eats kibble

    bird eats seeds

    mouse eats cheese


    Inner join of two files using the first column as key:

    The inner join only returns rows where there is a match between the two files.
    Here we will use the first column as the key for the join.


    join file1.txt file2.txt


    The result will be:'
  - '[PAGE 290]


    cat eats meat

    dog eats kibble

    bird eats seeds


    Left join of two files using the first column as the key and including non-matching
    lines from file 1:


    The left join includes all the rows from file 1, even if they don''t match file
    2. Here we''ll use the second column from file 1 and the first column from file
    2 as the key for your join.


    ```

    join -1 1 -2 -a 1 file1.txt file2.txt

    ```


    The result will be:


    cat eats meat

    dog eats kibble

    bird eats seeds

    snake

    fish


    We''ve included all lines from file 1, including lines 4 and 5 that don''t match
    file 2.


    Right join of two files using the first column as key and including non-matching
    lines from file 2:


    The right join includes all rows from file 2, even if they don''t match file 1.
    Here, we''ll use the first column from file 1 and the first column from file 2'
  - '[PAGE 291]


    as the key for the join.


    ```

    join -1 1 -2 1 -a 2 file1.txt file2.txt

    ```


    The result will be:


    cat eats meat

    dog eats kibble

    bird eats seeds

    mouse eats cheese


    We have included all lines from file 2, including line 4 which does not match
    file 1.


    Note that the files must be sorted before executing the join command. If the files
    are not sorted, the join result may be unpredictable. To sort a file, you can
    use the sort command.'
