    `uname` 命令集成在 Unix 和 Linux 操作系统中，允许获取有关操作系统内核的信息。它通常用于显示基本系统信息，例如操作系统名称、主机名、机器类型和内核版本。它也可以用于显示其他信息，例如处理器架构、操作系统版本、内核版本日期和系统类型。


    命令语法简单：`uname [OPTION]...` 最常用的选项有：


    - -a：显示系统上可用信息。

    - -s：显示内核名称。

    - -n：显示主机名。

    - -r：显示内核版本。

    - -v：显示内核版本日期。

    - -m：显示机器类型。

    - -o：显示操作系统的名称。


    还有其他可以在 `uname` 命令中使用的选项。你可以通过运行 `man uname` 命令查询 `uname` 命令手册，以获取有关可用选项的更多信息。


    `uname` 命令经常用于 shell 脚本，以检索系统信息并根据这些信息执行操作。例如， shell 脚本可以使用 `uname` 命令检查操作系统是否为
    Linux，并根据该信息为 Linux 操作系统运行特定的命令。


    显示操作系统名称：


    ```

    uname -o

    linux

    ```


    此命令显示系统上安装的操作系统名称。在例示例中，操作系统是 Linux。


    通过使用 `uname` 命令的选项，你可以显示你需要的关于系统的特定信息。


    `who` 命令显示登录系统的用户信息。它通常会显示用户名、使用的终端和连接时间。以下是常用的 `who` 选项：


    - -a：显示所有系统进程，包括注销进程。

    - -b：显示上次系统启动的日期和时间。

    - -d：显示当前系统运行时间。

    - -H：显示列标题。

    - -l：显示当前登录用户的信息。

    - -m：等同于 `who am i`。

    - -q：显示登录系统的用户总数。

    - -r：显示系统运行时间。

    - -s：仅显示用户名和登录时间。

    - -t：显示用户登录的终端号。


    如果不带选项，`who` 命令将显示当前登录用户的信息。


    `who` 命令的输出通常分为三列：


    1. 用户名。

    2. 用于连接的终端。

    3. 连接时间。


    这里是 `who` 命令的输出示例：


    ```

    alice tty1 2022-02-18 09:12

    bob pts/0 2022-02-18 10:05 (:0)

    ```


    表示用户 "alice" 自 2022 年 2 月 18 日 09:12 起一直在线，而用户 "bob" 自同日 10:05 起一直在线。


    总结，`who` 命令提供了关于登录 Unix/Linux 系统的用户的有用信息，以及登录时间和终端信息。


    查看当前登录用户信息：


    ```

    who -m

    jdoe pts/0 2022-02-18 09:10 (:0)

    ```


    此命令仅显示当前登录用户的信息（在本例中为 "jdoe"），以及使用的终端和登录时间。


    显示登录系统的用户总数：


    ```

    who -q

    jdoe

    alice

    bob

    # users=3

    ```


    此命令显示登录系统的用户总数，以及已登录用户姓名的列表。


    带列标题标题显示连接信息：


    ```

    who -H

    NAME LINE TIME COMMENT

    jdoe pts/0 2022-02-18 09:10 (:0)

    alice tty1 2022-02-18 09:12

    bob pts/1 2022-02-18 10:05 (::)

    ```


    此命令显示带列标题的连接信息，以提高可读性。


    总结，`who` 命令可以根据提供的选项获取有关登录系统的用户的各种信息，如用户名、使用的终端、登录时间和登录用户总数。


    `cron` 是操作系统中的一种任务调度工具。它允许用户在特定时间、定期或按固定间隔调度脚本或命令的执行。


    `crontab` 命令用于创建、查看、修改和删除包含调度信息的 `crontab` 文件。每个用户都有自己的 `crontab` 文件，其中可能包含一个或多个调度任务条目。


    `crontab` 文件通常存储在 `/var/spool/cron` 或 `/var/spool/cron/crontabs` 目录下，尽管这取决于系统配置。


    `crontab` 条目的基本语法为：


    ```

    * * * * * command to execute

    ```


    | 字段 | 说明 |

    | :--- | :--- |

    | * | 分钟 (0-59) |

    | * | 小时 (0-23) |

    | * | 日期 (1-31) |

    | * | 月份 (1-12) |

    | * | 周几 (0-6) (星期日 = 0) |


    这些字段中的每个都可以包含值列表、值范围、步长或星号 (*)，星号表示“所有”。例如，`0 * * * *` 意味着“在时间为 0 的每分钟运行命令”。


    `crontab` 命令有几个选项来管理 `crontab` 文件：


    - crontab -e 或 crontab -e -u：使用由 `VISUAL` 或 `EDITOR` 环境变量定义的文本编辑器编辑当前用户或指定用户的
    `crontab` 文件。

    - crontab -l 或 crontab -l -u：显示当前用户或指定用户的 `crontab` 文件内容。

    - crontab -r 或 crontab -r -u：删除当前用户或指定用户的 `crontab` 文件。

    - crontab -i 或 crontab -i -u：在删除前请求确认。


    ### 每天在特定时间运行任务


    除了这些选项，`crontab` 命令还允许使用 `>` 或 `>>` 运算符将调度任务的输出重定向到日志文件。


    ### 每天在特定时间运行任务


    要想在每天特定时间运行 cron 任务，你可以使用 `crontab -e` 命令打开 cron 文件。然后你可以添加你想要运行的时间的任务行。


    ### 每天在特定时间运行任务


    如果你想在每天凌晨 5 点运行脚本，你可以添加以下行：


    ```

    0 5 * * * /path/to/script.sh

    ```


    此行指定 `script.sh` 在每天凌晨 5 点运行。五个星号表示你想要运行的日期、月份和星期几。


    ### 每周在特定时间运行任务


    要想在每周特定时间运行 cron 任务，你可以使用 `crontab -e` 命令打开 cron 文件。然后你可以添加你想要运行的时间和星期几的任务行。


    如果你想在每周一早上 8 点运行脚本，你可以添加以下行：


    ```

    0 8 * * 1 /path/to/script.sh

    ```


    此行指定 `script.sh` 在每周一早上 8 点运行。数字 "1" 代表星期几（星期一 = 1）。五个星号表示你想要运行的分钟、小时、日期和月份。


    ### 每月在特定时间运行任务


    如果你想在每月 15 号 12:30 运行脚本，你可以添加以下行：


    ```

    30 12 15 * * /path/to/script.sh

    ```


    此行指定 `script.sh` 在每月 15 号 12:30 运行。前两个数字表示你想要运行的分钟和小时，后面是日期。最后两个星号表示你想要运行的月份和星期几。


    ### 每天凌晨运行脚本


    要每天每天凌晨运行脚本，你可以在你的 `crontab` 文件中添加如下行：


    ```

    0 0 * * * /path/to/my/script.sh

    ```


    此行告诉 `cron` 在每天 00:00 运行 `/path/to/my/` 目录下的 `script.sh`。


    ### 每小时运行脚本


    要每小时运行脚本，你可以在你的 `crontab` 文件中添加如下行：


    ```

    0 * * * * /path/to/my/script.sh

    ```


    此行告诉 `cron` 每整点运行位于 `/path/to/my/` 目录下的 `script.sh`（例如 01:00, 02:00 等）。


