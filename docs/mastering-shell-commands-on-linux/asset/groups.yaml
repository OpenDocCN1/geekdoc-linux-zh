    You want to find information about people who are over 30 years old. To do this,
    you can use the following command:


    ```

    grep -E ",[3-9][0-9]" data.txt

    ```


    The result will be the following:


    jane, 32, project manager

    susan, 35, HR manager


    Explanation :


    - -E option allows the use of extended regular expressions.

    - The regular expression ",[3-9][0-9]" matches a comma followed by a space and
    two digits, where the first digit is between 3 and 9, and the second is between
    0 and 9. This expression therefore corresponds to ages between 30 and 99.


