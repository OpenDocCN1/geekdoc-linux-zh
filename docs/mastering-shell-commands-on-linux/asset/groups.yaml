    The "df" command in Linux is used to display information about the disk space
    usage of your file system. Here is a detailed description of the command:


    Syntax: df [options] [mount point or directory]


    When run with no options or arguments, the "df" command displays the disk space
    usage of all file systems mounted in the system.


    Common options:


    - -h or --human-readable: display sizes using human-readable format (e.g. "1K",
    "1M", "1G" instead of numbers in bytes).

    - -T or --print-type: show filesystem type (e.g. "ext4", "ntfs", etc.).

    - -t or --type: Show only filesystems of the specified type (e.g. "ext4", "ntfs",
    etc.).

    - -x or --exclude-type: Exclude filesystems of the specified type (e.g. "tmpfs",
    "devtmpfs", etc.).

    - -i or --inodes: displays information about inode usage (instead of disk space
    usage).


    Mount point or directory:


    If you specify a mount point or directory as an argument, the command will only
    display information for the filesystem containing that mount point or directory.


    Examples of use:


    - df -h: displays disk space usage using a human-readable format.

    - df -T: Displays disk space usage and filesystem type for each filesystem.

    - df -t ext4: only show disk space usage for "ext4" type filesystems.

    - df /home: Displays disk space usage for the filesystem containing the "/home"
    mount point.


    Display disk space usage using a human-readable format:


    ```

    df -h

    ```


    | File system | Size | Used | Uti% | Mounted on |

    |---|---|---|---|---|

    | udev | 4.0G | 4.0G | 0% | /dev |

    | tmpfs | 789M | 788M | | |

    | /dev/sda1 | 237G | | | |

    | tmpfs | 4.0G | | | |

    | tmpfs | 5.0M | | | |

    | tmpfs | 4.0G | | | |

    | /dev/sdb1 | 459G | | | |

    | tmpfs | 789M | 1% | | |


    In this example, the "df -h" command displays disk space usage using a format
    human-readable (e.g. "1K", "1M", "1G" instead of numbers in bytes).


