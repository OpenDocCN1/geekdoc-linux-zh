  md: 'The chmod command allows you to modify the permissions of a file or a directory.
    Permissions can be set for owners, groups and general users.


    "drwwxrwxrwx" is an abbreviated representation of permissions on a file or directory
    in a Unix or Linux file system.


    The first letter "d" means it is a directory. If the file was an ordinary file,
    this letter would be a hyphen ("-").


    The next three-letter groups represent the permissions for file owner, file owner
    group, and other system users, respectively.


    The letter "r" stands for "read", the letter "w" stands for "write" (write), and
    the letter "x" stands for "execute". If a letter is present, it means that permission
    is granted for this action. If it is absent, it means permission is denied.


    "drwwxrwxrwx" means that the owner, owning group, and all other users have permission
    to read, write, and execute this directory.


