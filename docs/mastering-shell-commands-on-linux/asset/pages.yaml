- img_proc: true
  md: 'This command will display a list of all processes running on the system, with
    an extended format that includes the name of the command being executed, process
    owner name, CPU time, etc.


    Find the PID and total CPU time for all processes owned by user john that are
    running on the system. You can use the following options to do so:


    ```

    ps -u john -o pid,pcpu=CPU_TIME --sort=-pcpu | head

    ```


    Explanation :


    -u john: show only processes owned by user john.


    -o pid,pcpu=CPU_TIME: specifies the columns to display in the output. Here we
    display process identifiers (PIDs) and total CPU time for each process. We also
    renamed the pcpu column to CPU_TIME for better readability.


    --sort=-pcpu: sort processes by total CPU time, in descending order.


    head: displays only the first 10 processes found.


    Which will give a result similar to this:


    ```

    PID CPU_TIME

    13456 0.4

    ```'
