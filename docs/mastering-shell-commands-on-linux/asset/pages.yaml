    The for loop in shell is a loop control structure used to execute a set of statements
    multiple times. It lets you loop through a sequence of items such as numbers,
    strings, or files, and execute a series of statements for each item in the sequence.


    Here is the general syntax of the for loop in shell:


    ```

    for VARIABLE in SEQUENCE

    do

    COMMAND1

    COMMAND2

    ...

    done

    ```


    VARIABLE is an iteration variable that takes the value of each element of SEQUENCE
    at each loop turn.


    SEQUENCE can be a space-separated list of values, a range of numbers, or a file
