  md: 'Regular expressions, also known as "regex" or "regexp", are a set of characters
    that allow text patterns to be described. Regular expressions are used in many
    applications, including text editors, programming languages, search tools, word
    processing tools, and data validation tools.


    Regular expressions are a powerful tool for performing text search and replace
    operations. By using regular expressions, you can search for complex character
    strings using patterns, special characters, and quantifiers.


    Here are some of the most common special characters used in regular expressions:


    . : Matches any character. For example, the regex ct will match "cat", "cot",
    "cut", etc.


    ^ : Matches the beginning of the character string. For example, the regex ^cat
    will match "cat" in "cat and dog", but not in "I love cats".


    $ : Matches the end of the character string. For example, the regex dog$ will
    match "dog" in "cat and dog", but not in "I love dogs".


    [] : Matches a set of characters. For example, the regex [aeiou] will match any
    vowel, and [AZ] will match any uppercase letter.'
  merge: -1
  pgno: 247
- img_proc: true
  md: '[^]: Matches any character that is not in a character set. For example, the
    regex [^aeiou] will match any consonant, and [^0-9] will match any character that
    is not a digit.


    *: Matches zero or more occurrences of the preceding character. For example, the
    regex ca*t will match "ct", "cat", "caat", "caa", etc.


    +: Matches one or more occurrences of the preceding character. For example, the
    regex ca+t will match "cat", "caat", "caat", etc., but not "ct".


    ?: Matches zero or one occurrence of the preceding character. For example, the
    regex ca?t will match "ct" or "cat".


    (): Used to group regular expressions. For example, the regex (cat|dog) will match
    "cat" or "dog".


    |: Matches either regular expression. For example, the regex cat|dog will match
    "cat" or "dog".


    \: Used to escape a special character. For example, \. will match a literal period
    (.), not any character.


    \d: Matches a digit. For example, \d+ will match one or more occurrences of digits.


    \D: Matches anything that is not a digit. For example, \D+ will match one or more
    occurrences of non-digit characters.'
