- img_proc: true
  md: 'The nohup command (short for "no hang up") allows you to run a command or script
    in the background, without being interrupted if the connection to the terminal
    is lost or closed.


    When a command is executed normally in a terminal, if the connection to the terminal
    is lost, the command will be terminated. This can be problematic if you run a
    command that takes a long time, or if you want to run a command in the background
    without interrupting its execution by closing the session or the terminal.


    The nohup command solves this problem by allowing a command to run in the background,
    and by redirecting its standard and error output to a specified file. Thus, even
    if the connection to the terminal is lost, the command continues to be executed
    in the background, and its outputs are stored in the specified file.


    The nohup command syntax is as follows:


    ```

    nohup command [options] [arguments] &


    command: the command or script to run.

    [options]: options specific to the command to be executed.

    [arguments]: arguments specific to the command to be executed.

    &: the "ampersand" symbol at the end of the command allows it to be executed in
    the background.

    ```'
  merge: -1
  pgno: 132
- img_proc: true
  md: 'The nohup command also uses a default file to store standard and error output
    from the command. The name of this file is nohup.out. If you want to specify another
    output file, you can do so using the -o option followed by the filename.


    Suppose you have a shell script named "my_script.sh" in your current directory
    and you want to run it in the background with nohup:


    nohup sh my_script.sh > output.log &


    This will run the "my_script.sh" script in the background using nohup and redirect
    the output to an "output.log" file. The "&" symbol at the end of the command will
    release the console and continue working on it.


    If you want to check if the script is still running, you can use the "ps" command
    to display the list of running processes:


    ```

    ps -ef | grep my_script.sh

    ```


    This will display the list of running processes that contain "my_script.sh" in
    their name.'
  merge: -1
  pgno: 133
- img_proc: true
  md: 'You can also check the contents of the "output.log" file to see the output
    generated by the script:


    ```

    cat output.log

    ```


    This will display the contents of the "output.log" file in the console.


    Note that the nohup command is useful for running scripts in the background on
    servers or remote machines, as it keeps the script running even if the console
    connection is lost or the user logs out.'
  merge: -1
  pgno: 134
- img_proc: true
  md: 'The lsof (List Open Files) command is used to display files opened by processes
    running on a Linux or Unix system. This command can also display other information
    such as open ports, sockets, network connections, running processes, and shared
    libraries used by processes.


    The syntax of lsof is as follows:


    lsof [options]


    Some commonly used options with the lsof command are:


    +   -i: show open files for network connections.

    -u: show files opened by a specific user.

    -p: show files opened by a specific process.

    -c: show files opened by a specific command name.


    The lsof command can be useful for diagnosing performance issues, file errors,
    file leaks, and network connections. It can also be used to find processes using
    specific files and to stop or restart them if necessary.


    It is important to note that to use the lsof command, you must have root access
    or have user privileges to view files opened by other users or processes.'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'View files opened by a specific user:


    To display files opened by a specific user, use the -u option followed by the
    user name. For example, to display the files opened by the user "ubuntu", type:


    ```

    lsof -u ubuntu

    ```


    This command will show all files opened by user "ubuntu".


    Show files opened by a specific process:


    To display the files opened by a specific process, use the -p option followed
    by the process identifier (PID). For example, to display the files opened by the
    process with PID 1234, type:


    ```

    lsof -p 1234

    ```


    This command will show all files opened by the process with PID 1234.


    Show open files for a specific command:'
  merge: -1
  pgno: 136
- img_proc: true
  md: 'To view files opened by a specific command, use the -c option followed by the
    command name. For example, to display the files opened by the "$apache2" process,
    type:


    ```

    lsof -c apache

    ```


    This command will show all files opened by the "$apache2" process.


    Show open files for a specific directory:


    To display open files for a specific directory, use the directory name as the
    command argument. For example, to display open files for the "/var/log" directory,
    type:


    ```

    lsof /var/log

    ```


    This command will show all open files in the "/var/log" directory.


    These examples are not exhaustive, but they should give you an idea of how the
    lsof command can be used to diagnose system problems.


    You''ve noticed the disk space on your system is rapidly decreasing, but you don''t
    know what''s taking it up. Use the lsof command to find files and check if they
    are related to processes that are no longer running.'
  merge: -1
  pgno: 137
- img_proc: true
  md: 'Start by running the following command to display all open files on your system:


