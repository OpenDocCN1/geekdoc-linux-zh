    $2 (for the second parameter), etc.


    Finally, it is also possible to return a value from a function using the return
    command. The returned value can be stored in a variable and used by the rest of
    the script.'
  merge: -1
  pgno: 269
- img_proc: true
  md: "Here is an example of a function that calculates the sum of two numbers and\
    \ returns the result:\n\n```\ncalculate_sum() {\nresult=$($1 + $2)\n  return $result\n\
    }\n```\n\nTo call the function and store the result in a variable, use the $(...)\
    \ command:\n\n```\nsum=$(calculate_sum 5 7)\necho \"Sum is: $sum\"\n```\n\nThis\
    \ will display \"The sum is: 12\".\n\nIn conclusion, functions are a powerful\
    \ tool for simplifying and optimizing shell scripts by grouping similar tasks\
    \ together. They can take parameters and return values for greater flexibility."
