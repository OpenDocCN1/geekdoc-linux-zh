- img_proc: true
  md: 'hours you want the task to run, followed by the day of the month. The last
    two asterisks represent the months and days of the week you want the task to run.


    Run a script every day at midnight

    To run a script every day at midnight, you can add a line like this to your crontab
    file:


    ```

    0 0 * * /path/to/my/script.sh

    ```


    This line tells crontab to run the "script.sh" script located in the "/path/to/my/"
    folder at 00:00 every day.


    Run a script every hour

    To run a script every hour you can add a line like this to your crontab file


    ```

    0 * * * /path/to/my/script.sh

    ```


    This line tells crontab to run the "script.sh" script located in the "/path/to/my/"
