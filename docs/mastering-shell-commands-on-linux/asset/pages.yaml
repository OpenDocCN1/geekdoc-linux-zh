  md: 'The "free" command is used to display the amount of RAM and swap space available
    on a Linux system. Here is a detailed description of the command, it displays
    the following information:


    +   - "total": the total amount of physical memory available on the system;

    - "used": the amount of physical memory currently used by the system;

    - "free": the amount of physical memory currently available for new operations;

    - "shared": the amount of physical memory shared between several processes;

    - "buffers": the amount of memory used by the system to store temporary data;

    - "cached": the amount of memory used by the system to store cached data;

    - "available": the amount of memory available for new operations, which includes
    free memory, buffer memory, and cache memory.


    free


    The output of this command will look like this:


    ```

    total used free shared buff/cache available

    Mem: 2047112 324340 1486508 7572 236264 1599672

    Swap: 2097148 0 2097148

    ```'
  merge: -1
  pgno: 182
- img_proc: true
  md: 'The first line displays the total amount of physical memory available, the
    amount used, and the amount available for new operations. The figures are expressed
    in kilobytes (kB).


    The second line displays the total amount of swap space available, the amount
    used, and the amount available for new operations. Numbers are also expressed
    in kilobytes (kB).


    By using the "free" command with options, you can customize the output to show
    the information you need. Here are some common options:


    +   - "h": displays numbers in human-readable format, which means they are displayed
    in megabytes (MB) or gigabytes (GB) rather than kilobytes (kB);

    - "s": displays information at regular intervals, where """ is the number of seconds
    between each display;

    - "t": displays a total row at the bottom of the output for each column.


    For example, here is how to use the "free" command with the "-h" option:


    ```

    free-h

    ```


    And here is an example output:


    ```

    total used free buff/cache available

    Mem: 2.0G 335M 1.4G 7.4M 232M 1.5G

    Swap: 2.0G 0B 2.0G

    ```'
  merge: -1
  pgno: 183
- img_proc: true
  md: 'This time, the figures are expressed in gigabytes (GB) rather than kilobytes
    (kB), which makes it easier to read and understand the information displayed.


    In summary, the "free" command is a useful tool for monitoring the amount of RAM
    and swap space available on a Linux system. With the appropriate options, you
    can customize the output to show the information you need and display it in an
    easier-to-read format. This can be useful for monitoring your system''s performance
    and determining if memory upgrades are needed.


    # Reminder of swap memory


    The Swap line represents the storage space used for memory swapping. Swap is storage
    space used by the operating system to temporarily store data that is not currently
    in use in random access memory (RAM). When RAM is full, the operating system can
    move inactive data from RAM to swap, freeing space in RAM for active data.


    Swap is usually a file or disk partition reserved for this purpose. The Swap line
    of the free command displays the amount of swap space used, as well as the amount
    of swap space available.


    However, using swap memory can significantly slow down system performance because
    hard disk access is much slower than RAM access. For this reason, it is important
    to monitor the amount of RAM available on a system and plan RAM upgrades if necessary
    to avoid overusing swap memory.'
