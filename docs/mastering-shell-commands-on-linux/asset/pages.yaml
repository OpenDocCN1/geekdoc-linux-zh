  md: 'It allows you to read standard input (usually from the keyboard) and simultaneously
    redirect it to standard output (usually the screen) and to one or more files.


    This can be very handy in many situations. If you''re running a command that produces
    a lot of output, you can use the tee command to redirect the output to a file
    for later access, while letting the output display on the screen at the same time.


    The syntax of tee is quite simple. Just specify the name of the file(s) you want
    to redirect the output to, separated by spaces, after the tee command. For example,
    to redirect the output to the file "myfile.txt" while displaying it on the screen,
    you can use the following command:


    ```

    command | tee myfile.txt

    ```


    This will redirect the command output to "myfile.txt" while also displaying it
    on the screen.


    By using the "a" option with the tee command, you can append the output to the
    end of an existing file rather than overwriting it. For example :


    ```

    command | tee -a myfile.txt

    ```


    This will append the command''s output to the end of the "myfile.txt" file rather
    than overwriting it.'
  merge: -1
  pgno: 94
- img_proc: true
  md: 'Redirecting command output to a file:


    Suppose you run a command to generate output, for example the "ls" command to
    list the files in a directory. You can redirect the command output to a file using
    the tee command, as follows:


    ```

    ls | tee file.txt

    ```


    This runs the "ls" command and redirects the output to the screen and to the "file.txt"
    file. You will be able to see the output on the screen and it will also be saved
    to the "file.txt" file. If the file does not exist, it will be created automatically.'
  merge: -1
  pgno: 95
- img_proc: true
  md: 'Adding command output to the end of an existing file:

    If you want to append the output of a command to the end of an existing file rather
    than overwriting its contents, you can use the "-a" option with the tee command.
    For example :


    ```

    ps aux | tee -a process.txt

    ```


    This runs the "ps aux" command to show the running processes and appends the output
    to the end of the "process.txt" file.


    Redirecting the output of a command to multiple files:

    The tee command also allows redirecting output to multiple files. If you want
    to redirect the output of a command to two different files, you can use the tee
    command with multiple filenames. Here is an example :


    ```

    ping google.com | tee result1.txt result2.txt

    ```


    This runs the "ping google.com" command to test the connection to Google, and
    redirects the output to the "resultat1.txt" and "resultat2.txt" files.'
