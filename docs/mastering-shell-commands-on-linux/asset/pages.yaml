  md: 'The tr command is used to convert input characters and replace them with other
    output characters, or remove them. The tr command is commonly used to manipulate
    text files, data streams.


    # Syntax


    The syntax of tr is as follows:


    tr [options] set1 set2


    Or :


    set1 is the set of characters to convert or remove.

    set2 is the set of characters that should replace the characters in set1.


    # Common Options


    Here are some used options of the tr command:


    +   -c: Complementary, which means that the character set specified with the option
    is complementary to set1. For example, tr -c ''aeiou'' ''\n'' will remove all
    non-vowel characters and replace them with a newline.

    -d: Delete, which means the characters specified with the option will be deleted.
    For example, tr -d ''\r'' removes carriage returns from the output.

    -s: Remove duplicate characters, which means duplicate characters in set1 will
    be removed. For example, tr -s '' '' ''\n'' removes duplicate spaces in the output
    and replaces them with a newline.'
  merge: -1
  pgno: 79
- img_proc: true
  md: '-t: Translate, which means that the characters from set1 will be replaced by
    the corresponding characters from set2. For example, tr ''abcd'' ''jklm'' replaces
    the characters a, b, c and d with the characters j, k, l and m respectively.


    # Examples of use


    Remove carriage returns from a file:


    ```

    tr -d ''\r'' < file.txt > unix_file.txt

    ```


    The tr command removes all carriage returns from the file "file.txt" and redirects
    the output to a new file "file_unix.txt".'
  merge: -1
  pgno: 80
- img_proc: true
  md: 'Replace duplicate characters with a single character:


    ```

    cat file.txt | tr -s '''' > modified_file.txt

    ```


    The cat command displays the contents of the "file.txt" file and redirects the
    output through the pipe to the tr command, which removes duplicate spaces and
    replaces them with a single space in the output. The output is finally redirected
    to a new file "fichier_modifié.txt".


    Convert uppercase letters to lowercase letters:


    ```

    echo ''HELLO, WORLD!'' | tr ''AZ'' ''az''

    ```


    The echo command displays the string "HELLO, WORLD!" which is then redirected
    through the pipe to the tr command, which translates all uppercase letters to
    lowercase in the output.


    Delete all characters that are not letters of the alphabet:


    ```

    echo "Hello, world! 123." | tr -c ''[:alpha:]''''

    ```


    The echo command displays the string "Hello, world! 123." to standard output,
    which is then redirected to the tr command. The -c option of the tr command specifies
    that we want the complement of what is alpha.'
  merge: -1
  pgno: 81
- img_proc: true
  md: 'In this example, the character set is [:alpha:], which represents the set of
    letters of the alphabet. The -c option specifies that you want to remove all characters
    that are not letters of the alphabet.


    Finally, the `'' ''` argument specifies that all deleted characters should be
    replaced with a space.


    The output of the command will therefore be "Hello world".'
  merge: -1
  pgno: 82
