  md: 'The who command displays information about users logged into a system. It usually
    displays the user name, the terminal used and the connection time. Here are the
    common who options:


    +   -a: show all system processes, including logout processes.

    -b: show the last system boot date and time.

    -d: displays the current system uptime.

    -H: show column headers.

    -l: displays information about the currently logged in user.

    -m: equivalent to who am i.

    -q: displays the total number of users logged into the system.

    -r: show system uptime.

    -s: show username and login time only.

    -t: show the terminal number the user is logged into.


    Without an option, the who command displays information about currently logged
    in users.


    The output of the who command is typically organized into three columns:


    The username.

    The terminal used for the connection.

    Connection time.


    Here is an example of output from the who command:'
  merge: -1
  pgno: 122
- img_proc: true
  md: '```

    alice tty1 2022-02-18 09:12

    bob pts/0 2022-02-18 10:05 (:0)

    ```


    This indicates that user "alice" has been online since 09:12 on February 18, 2022,
    while user "bob" has been online since 10:05 on the same day.


    In summary, the who command provides useful information about users logged into
    a Unix/Linux system, as well as login time and terminal information.'
  merge: -1
  pgno: 123
- img_proc: true
  md: 'View currently logged in user information:


    ```

    who -m

    jdoe pts/0 2022-02-18 09:10 (:0)

    ```


    This command only displays information about the user currently logged in, in
    this case "jdoe", as well as the terminal used and the login time.


    Display the total number of users logged into the system:


    ```

    who -q

    jdoe

    alice

    bob

    # users=3

    ```


    This command displays the total number of users logged into the system, as well
    as the list of logged in user names.


    Show connection information with column headers:


    ```

    who -H

    NAME LINE TIME COMMENT

    jdoe pts/0 2022-02-18 09:10 (:0)

    alice tty1 2022-02-18 09:12

    ```'
  merge: -1
  pgno: 124
