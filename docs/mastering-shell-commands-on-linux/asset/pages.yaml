- img_proc: true
  md: 'The cp command is used to copy files and/or directories from one location to
    another.


    The syntax of cp is:

    cp [options] source destination


    The most used options:


    +   - -f as force: replaces the destination file without asking for confirmation,
    even if it is a symbolic link to a directory.

    - -i as interactive: ask for confirmation before overwriting an existing file.

    - -a:archive: recursively copies all files and subdirectories, symbolic links,
    permissions, timestamps, etc.

    - -r as recursive: recursively copies all files and subdirectories.

    - -v as verbose: displays detailed information about the copy operations performed.


    cp file1.txt file2.txt


    This command will copy the contents of file "file1.txt" into "file2.txt".

    The new file will, in this example, be created in the same directory as the source
    file.

    If the file "file2.txt" already exists, its content will be replaced by the file
    "file1.txt".'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'Without any options on the command, it only copies the contents of the file
    and not the attributes of the file such as permissions, ownership, modification
    date, etc.


    If you want to copy the file to another directory, specify the full path of the
    new file: see example below


    ```

    cp file.txt /home/user/documents/newfile.txt

    ```'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'If you want to keep the attributes of the source file when copying, use the
    "-p" option with the "cp" command, like this


    ```

    cp -p file1.txt file2.txt

    ```


    This will copy file "file1.txt" to "file2.txt" retaining its attributes.


    ```

    cp file1.txt /var/www

    ```


    The command copies the file "file1.txt" into the "/var/www" directory of the file
    system.


    ```

    cp -r directory1 directory2

    ```


    Also, if you want to copy a directory and its contents, you must use the "-r"
    option (for "recursive"). This option copies a directory and all its subdirectories
    and files.'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'mv is used to move or rename files or folders.


    Here is the general syntax of the mv command:

    mv [OPTION]... SOURCE DESTINATION


    The most used options are:


    ```

    mv file.txt ~/Documents

    ```


    This command moves the file.txt file to the Documents directory in your home directory.


    ```

    mv mydir ~/Documents

    ```


    This command moves the mydir directory to the Documents'' directory in your home
    directory.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '```

    mv file.txt newfile.txt

    ```


    This command renames file.txt to newfile.txt in the current directory.


    ```

    mv -i file.txt newfile.txt

    ```


    The -i ( stands for "interactive" ) allows you to ask for confirmation before
    overwriting an existing file. In this case, if a file named newfile.txt already
    exists in the current directory, the command will ask you if you want to replace
    it.'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'rm is used to delete files or directories. This command is


    rm is used to delete files or directories. It is not possible to recover deleted
    files/directories. It is therefore important to be careful when using this command.
    Here is the general syntax:


    rm [OPTION]... FILE... The most used options:


    rm file.txt


    This command removes file.txt from the current directory.


    rm -f file.txt


    The -f options force deletion of a file without confirmation. In this case, the
    file.txt file will be deleted without any confirmation.


    rm -rf dir/'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'This example removes the dir/ directory and all of its contents from the current
    directory. This operation is final and there is no way to recover deleted files.


    Using the -f option can be dangerous and may cause important files to be deleted
    without any warning or confirmation. It is therefore advisable not to use this
    option unless you are absolutely sure of what you are doing.


    ```

    rm -i file.txt

    ```


    The -i option allows you to ask for confirmation before deleting a file. In this
    case, the command will ask you if you want to delete the file.txt file.'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'In used to create symbolic links between files. Symbolic links are aliases
    to existing files.


    Here is the general syntax:


    ```

    ln [OPTION]...TARGET...LINK_NAME

    ```


    The most used options are:


    ```

    ln -s file.txt mylink

    ```


    This command creates a symbolic link named mylink that points to file.txt.


    ```

    ln -s docs/ docs-link

    ```


    Create a symbolic link named "docs-link" that points to a directory named "docs”


    ```

    unlink test-link

    ```'
  merge: -1
