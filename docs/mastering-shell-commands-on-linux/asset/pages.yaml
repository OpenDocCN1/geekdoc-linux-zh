  md: 'The gzip and gunzip commands are used to compress and decompress files using
    the gzip compression format. The gzip format is one of the most commonly used
    compression formats on Unix and Linux systems. Here is a detailed description
    of each command:


    The gzip command: This command is used to compress files using the gzip compression
    format. The syntax is as follows:


    gzip [OPTIONS] FILE


    Where OPTIONS is one or more optional options you can specify to customize the
    behavior of the command, and FILE is the name of the file you want to compress.
    Here are some commonly used options with the gzip command:


    -c: This option is used to display the compressed output to standard output rather
    than writing the compressed output to a file. You can use this option with other
    commands to chain commands together.

    -d: This option is used to decompose files compressed in gzip format.

    -f: This option forces compression, even if a file with the same name exists.

    -k: This option is used to keep a copy of the original file during compression.
    A compressed file will be created, but the original file will not be deleted.

    -r: This option is used to compress all files contained in a directory recursively.'
  merge: -1
  pgno: 159
- img_proc: true
  md: <!-- no content -->
  merge: -1
  pgno: 160
- img_proc: true
  md: 'The gunzip command: This command is used to decompress files compressed in
    gzip format. The syntax is as follows:


    gunzip [OPTIONS] FILE


    Where OPTIONS is one or more optional options you can specify to customize the
    behavior of the command, and FILE is the name of the file you want to unzip. Here
    are some commonly used options with the gunzip command:


    +   -c: This option is used to print the uncompressed output to standard output
    rather than writing the uncompressed output to a file. You can use this option
    with other commands to chain commands together.

    -f: This option forces decompression, even if a file with the same name already
    exists.

    -k: This option is used to keep a copy of the compressed file during decompression.
    A decompressed file will be created, but the compressed file will not be deleted.

    -r: This option is used to unpack all files contained in a directory recursively.


    To compress a file:


    gzip file.txt


    This command will compress file.txt by creating a new file named file.txt.gz.'
  merge: -1
  pgno: 161
