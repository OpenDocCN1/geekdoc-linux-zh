  md: 'Redirects are a technique to modify the input/output flow of a command. They
    are often used to save command output to a file, or to read command input from
    a file rather than from the keyboard.


    There are three types of shell redirection: standard output redirection, standard
    input redirection, and error output redirection.


    Redirecting standard output allows you to redirect the output of a command to
    a file rather than displaying it on the screen. To do this, you must use the >
    operator followed by the name of the file where you want to save the output.


    Here is an example :


    ```

    ls > list_of_files.txt

    ```


    ls command displays the list of files in the current directory. Redirecting standard
    output ( > sends this output to a file named list_of_files.txt rather than displaying
    it on the screen.


    Redirecting standard input allows command input to be read from a file rather
    than from the keyboard. To do this, you must use the < operator followed by the
    name of the file from which you want to read input.


    Here is an example :'
  merge: -1
  pgno: 258
- img_proc: true
  md: '```

    sort < list_of_files.txt

    ```


    sort command sorts the lines of the file_list_of_files.txt file . Redirecting
    standard input ( < ) tells the sort command to read input from this file rather
    than from the keyboard.'
  merge: -1
  pgno: 259
- img_proc: true
  md: 'Redirecting error output allows the error output of a command to be redirected
    to a file rather than displayed on the screen. To do this, you must use the 2>
    operator followed by the name of the file where you want to save the error output.


    Here is an example :


    ls /foo/bar 2> errors.txt


    Is command attempts to display the list of files in the /foo/bar directory , which
    does not exist. Redirecting error output ( 2> ) sends the error output generated
    by this command to a file named errors.txt rather than displaying it on the screen.


    It is possible to combine multiple redirects using the |, >, < and 2> .


    Here is an example :


    grep "pattern" < file.txt | sort > result.txt 2> errors.txt


    grep command reads input from file.txt , searches for lines containing the specified
    pattern, and sends the output to the sort command . Output from the sort command
    is saved to a file named result.txt , while error output is saved to a file named
    errors.txt'
