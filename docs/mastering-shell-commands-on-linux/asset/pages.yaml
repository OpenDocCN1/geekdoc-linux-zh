  md: 'The kill command is used to send signals to processes running on a Unix-like
    system. Signals can be used to request a process to terminate cleanly or to force
    termination if it becomes unresponsive.


    Here is the general syntax of the kill command:


    kill [-s signal] PID

    -s signal: (optional) specifies the signal to send to the process. By default,
    the SIGTERM signal will be sent if no signal is specified.


    PID: is the process identifier (PID) of the process to which the signal will be
    sent.


    There are several signals available that you can send with the kill command, such
    as SIGTERM, SIGKILL, SIGSTOP, etc. The most commonly used signals are SIGTERM
    and SIGKILL.


    SIGTERM: This signal is used to request a process to terminate cleanly. The process
    receives this signal and can perform a cleanup operation or save its data before
    terminating.


    SIGKILL: This signal is used to force the immediate termination of a process.
    This signal cannot be intercepted or ignored by the process, so it is usually
    used to kill unresponsive or crashing processes.'
  merge: -1
  pgno: 189
- img_proc: true
  md: 'Description kill is used to determine a process running on a Linux system.

    This command takes as input the ID of the process you want to stop.


    kill -s SIGTERM 12345

    This command will send a SIGTERM signal to the process with PID 12345, asking
    this process to terminate cleanly.

    The command ''kill -SIGTERM '' will also work the way as ''kill -15 '' since it
    also sends a SIGTERM signal to the process with the specified PID. However, it
    is more common to use the abbreviated form ''kill -15 '' .


    kill -s SIGKILL 12345


    The ''kill -s SIGKILL '' command will have the same effect as ''kill -9 '' by
    immediately and forcibly stopping the process without giving it a chance to terminate
    cleanly or release resources.'
