- img_proc: true
  md: 'The "cd" command allows you to move from one directory to another.

    "cd" followed by the name of a directory takes you to that directory. "cd" with
    no argument takes you to your home directory.


    ```

    cd ~

    ```


    The cd ~ command is used to move to the user''s directory. for example, if I log
    in with the user "urko" and execute the command, then I will be redirected to
    the "home/urko" directory.


    In summary, the cd ~ command allows you to quickly navigate to the logged in user''s
    home directory using the tilde character as a convenient shortcut.


    ```

    cd ..

    ```


    The "cd .." command allows you to move to the parent directory.

    Example: you are in the "/home/urko/documents/" directory. Running the cd .. command
    will redirect you to "/home/urko/"'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'It is also possible to use relative paths to navigate to other directories,
    such as cd ../folder/ to navigate to the "folder" directory located in the parent
    directory. . Example: you are in the "/home/urko/documents/" directory. Running
    the cd ..//video command will redirect you to "/home/urko/video"


    The cd ".." command is very useful when navigating Linux filesystems, as it allows
    you to quickly move between different directories without having to type in the
    full absolute path.


    cd ~/Documents


    The "cd ~/Documents" command changes the current directory to the "Documents"
    directory located in the user''s home directory.


    Example: you are the "urko" user and therefore your home directory is "/home/urko/".
    the "cd ~/Documents" command will direct you to the "/home/urko/Documents" directory.


    cd /etc


    The command allows to go to the /etc directory from any directory. for example
    if you are in the directory /appli/tools/websphere, the execution of the command
    will direct you directly to /etc'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'The "basename" command returns the base name of a file or path. It is used
    to extract the filename from a full path ignoring the path.


    The general syntax of the "basename" command is as follows:


    ```

    basename [options] [path]

    ```


    where path is the full path of the file whose base name you want to extract.


    The options available with the basename command are:


    +   -a: show all filenames if multiple files are provided as input.

    -s suffix: Remove the suffix from the specified filename.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# Deleting a directory path


    You have a file called file.txt in the /home/user/ directory. To extract the basename
    from the file, you can use the basename command in the following way:


    ```

    basename /home/user/file.txt

    ```


    file.txt


    The output simply returns the filename file.txt without the /home/user/ directory
    path.


    # Deleting a file extension


    You have a file called rapport.docx and you want to extract the filename without
    the .docx extension. For this you can use the -s option with the basename command
    in the following way:


    ```

    basename report.docx .docx

    ```


    report


    The command returns the base name of the rapport.docx file without the .docx extension.'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'Using the -a option


    You have several files in a directory and you want to extract the base names of
    all these files. You can use the -a option to show all filenames.

    Here is an example:


    ```

    basename -a /home/user/file1.txt /home/user/file2.txt /home/user/file3.txt

    ```


    The command returns all filenames removing the respective directory paths.


    file1.txt


    file2.txt


    file3.txt'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'The dirname command is used to extract the directory path of a file or a path.


    The syntax is as follows:


    ```

    dirname [options] path

    ```


    where path is the full path of the file whose directory path you want to extract.


    The available options are:


    +   -z: don''t separate directory names (rather than with line breaks)

    -a: show all parent directories, including the root directory.'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'Extracting the directory path of a file

    Suppose you have a file called rapport.docx in the /home/user/documents/

    directory. To extract the full directory path of the file, you can use the

    dirname command in the following way:


    ```

    dirname /home/user/documents/report.docx

    /home/user/documents

    ```


    The command returns the full directory path /home/user/documents/ of the

    rapport.docx file.


    Using the -z option

    Suppose you have several files in a directory and you want to extract the

    full directory paths of all these files without separating them (rather than

    by line breaks).


    ```

    dirname -z /home/user1/file1.txt /home/user2/file2.txt

    /home/user2/file3.txt

    ```


    The command returns the full directory paths of all concatenated files


    ```

    /home/user//home/user//home/user/

    ```'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'The mkdir command is used to create directories (folders) on the file system.


    mkdir mydir


    This command creates a new directory named mydir in the current directory. If
    the directory does not exist then it will be created otherwise an error message
    indicating that the directory already exists will be displayed on the screen.


    mkdir -p mydir/subdir


    The -p option creates all directories and all subdirectories. In this case, a
    directory named subdir will be created inside mydir.


    mkdir directory1 directory2 directory3


    In this example, we are creating several directories at the same time. If the
    directories do not already exist, they will be created otherwise an error message
    indicating that this directory already exists will be displayed.'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'The rmdir command is used to delete directories (folders) on the file system.


    ```

    rmdir mydir

    ```


    This command deletes the empty directory named mydir.


    ```

    rmdir directory1 directory2 directory3

    ```


    In this example, we are deleting several directories at the same time. If one
    of the directories does not exist or if it is not empty, an error message will
    be displayed on the screen. The rmdir command can only be used to remove empty
    directories. it is preferable to use the rm command which allows you to delete
    directories even if they are not empty.


    ```

    rmdir -p mydir/subdir

    ```


    The -p option removes all empty subdirectories in the specified directory path.'
  merge: -1
  pgno: 38
- img_proc: true
  md: 'The pwd command displays the full path of the current working directory, i.e.
    the directory where the user is currently located.


    pwd


    The "pwd" command displays the absolute path of the directory. It''s a handy way
    to find out what directory you''re working in.


    ```

    pwd

    /home/user/softs

    ```


    ```

    pwd -L

    /usr/local/software

    ```


    Suppose you are in the /home/user/softs directory which is a symbolic link to
    the /usr/local/softwares directory. You can use the pwd -L command to display
    the absolute path of the actual directory:'
  merge: -1
  pgno: 39
- img_proc: true
  md: 'The touch command creates a new empty file or updates the modification date
    of an existing file. It is generally used to mark the presence of a file, to initialize
    a new file before editing it, or to update the modification date of a file.


    touch file.txt


    If the file does not already exist, it will be created. If the file already exists,
    the modification date will be updated to the current date and time.


    touch file1.txt file2.txt file3.txt


    In this example, we are updating the modification date of multiple files at the
    same time. If the files do not exist, they will be created. If the files already
    exist, their modification date will be updated to the current date and time.


    ```

    touch -t 2023010100000 file.txt

    ```'
  merge: -1
  pgno: 40
- img_proc: true
  md: This command changes the modification date of the file.txt file to the specified
    date and time. The date is specified in YYYYMMDDHMM format.
  merge: -1
  pgno: 41
- img_proc: true
  md: 'cat is used to display the contents of one or more files. It allows you to
    concatenate multiple files into one.


    Here is the general syntax:


    ```

    cat [OPTION]... [FILE]..

    ```


    The most used options are:


    ```

    cat file.txt

    ```


    This command prints the contents of file.txt to standard output


    ```

    cat file1.txt file2.txt > combined.txt

    ```


    This command concatenates the contents of two files (file1.txt and file2.txt)
    and stores the result in a new file named combined.txt.'
  merge: -1
  pgno: 42
- img_proc: true
  md: '```

    cat -n file.txt

    ```


    The -n option adds a line number in front of each line of the file


    ```

    cat -E file.txt

    ```


    The -E option adds a $ character to the end of each line.


    The "$" symbol is not actually part of the file contents, but is simply displayed
    by the "cat" command to indicate the end of each line. It allows, for example,
    to see if there are spaces at the end of the line'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'less is used to display the contents of a file interactively. Unlike the cat
    command, which displays all the contents at once, less allows you to browse the
    file page by page, which is particularly useful for large files.


    Here is the general syntax:


    less [OPTION]... [FILE]...


    The most used options are:


    less file.txt

    This command is used to view the contents of file.txt in "page by page" mode.
    You can use the up and down arrows to browse content, and the q key to exit less
    mode


    less +10 file.txt

    The +10 option allows you to move directly to line 10 of the file when opening.
    In this case, the file.txt file will be opened in less mode and the content will
    start from line 10.'
  merge: -1
  pgno: 44
- img_proc: true
  md: '```

    less -N file.txt

    ```


    The -N option displays line numbers in front of each line of file content.'
  merge: -1
  pgno: 45
- img_proc: true
  md: 'The tail and head commands are two commonly used Unix commands to display the
    first or last lines of a file or data stream. Here is a more detailed description
    of each command:


    The head command displays the first lines of a file or data stream. Here is the
    general syntax of the command:


    ```

    head [OPTIONS] [FILE]

    ```


    where OPTIONS are optional options that allow you to customize the behavior of
    the command, and FILE is the name of the file to display. If no filename is specified,
    the head command will expect data from standard input.


    Here are some common options for the head command:


    +   -n NUM: specifies the number of lines to display (default is 10).

    - -q: do not display the filename at the top of each output.

    - -v: display the file name at the top of each output.


    The tail command displays the last lines of a file or data stream. Here is the
    general syntax of the command:


    ```

    tail [OPTIONS] [FILE]

    ```'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'where OPTIONS are optional options that allow you to customize the behavior
    of the command, and FILE is the name of the file to display. If no filename is
    specified, the tail command will expect data from standard input.


    Here are some common options for the tail command:


    +   -n NUM: specifies the number of lines to display (default is 10).


    +   -f: show lines that are added to the file in real time (useful for monitoring
    log files).


    +   -v: display the file name at the top of each output.'
  merge: -1
