    This command searches for the specified pattern (in this case, ''pattern'') in
    the files file1.txt and file2.txt. All lines from both files that contain the
    pattern will be displayed.


    grep -R ''pattern'' *

    The -R option allows a recursive search. The pattern is specified between single
    quotes. The "*" indicates that the search is made from the current directory.
    Note: you can replace * with a path in order to search there


