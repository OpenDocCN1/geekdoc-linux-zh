    When run with no options or arguments, the "df" command displays the disk space
    usage of all file systems mounted in the system.


    Common options:


    +   -h or --human-readable: display sizes using human-readable format (e.g. "1K",
    "1M", "1G" instead of numbers in bytes).

    -T or --print-type: show filesystem type (e.g. "ext4", "ntfs", etc.).

    -t or --type: Show only filesystems of the specified type (e.g. "ext4", "ntfs",
    etc.).

    -x or --exclude-type: Exclude filesystems of the specified type (e.g. "tmpfs",
    "devtmpfs", etc.).

    -i or --inodes: displays information about inode usage (instead of disk space
    usage).


    Mount point or directory:


    If you specify a mount point or directory as an argument, the command will only
    display information for the filesystem containing that mount'
