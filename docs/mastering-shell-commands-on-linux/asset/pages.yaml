  md: 'Displaying the contents of a file by removing spaces at the beginning and end
    of a line:


    ```

    echo "$(cat file.txt | sed -e ''s/^\ [\\t]*//'' -e ''s/[\\t]**$/'')"

    ```


    This command reads the contents of the "fichier.txt" file by removing the spaces
    at the beginning and end of each line using the "sed" command:


    The command echo "$(cat file.txt | sed -e ''s/^\ [\\t]*//'' -e ''s/[\\t]**$/'')"
    displays the contents of a text file by removing the spaces at the beginning and
    end of the line.


    Here''s how it works:


    cat file.txt: this part of the command reads the contents of the file file.txt
    and passes it as standard input (stdin) to the sed command.

    sed: this command is a text stream editor that allows you to filter, transform
    or replace parts of text according to regular expressions. In this case, the sed
    command is used to remove leading and trailing spaces.

    -e ''s/^\ [\\t]*//'': this regular expression removes spaces and tabs at the beginning
    of a line.

    -e ''s/[\\t]**$/'': this regular expression removes spaces and tabs at the end
    of the line.

    $(command): this construction allows to execute the command command and use the
    result of this command as a parameter for another command. Here, the output of
    the sed command is used as a parameter for the echo command.'
