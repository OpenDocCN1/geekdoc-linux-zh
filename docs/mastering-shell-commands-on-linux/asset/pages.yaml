- img_proc: true
  md: 'as the key for the join.


    ```

    join -1 1 -2 1 -a 2 file1.txt file2.txt

    ```


    The result will be:


    cat eats meat

    dog eats kibble

    bird eats seeds

    mouse eats cheese


    We have included all lines from file 2, including line 4 which does not match
