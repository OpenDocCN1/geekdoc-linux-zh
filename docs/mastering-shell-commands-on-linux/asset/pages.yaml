    "[options]" are additional options for the xargs command, and "[command to execute]"
    is the command that will be executed with the supplied arguments.


    The most used xargs options are:


    +   -n: specifies the maximum number of arguments to pass to the command. For
    example, "-n 1" means that only one argument will be passed to the command each
    time.

    -I: replaces the string specified by the option with the supplied argument. For
