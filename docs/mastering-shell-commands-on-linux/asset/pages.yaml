- img_proc: true
  md: 'The "du" (Disk Usage) command is used to find out the size occupied by files
    and directories on a file system. It is useful for identifying which files or
    directories are taking up the most disk space and for optimizing storage usage.


    By default, the "du" command displays the size occupied by each directory and
    subdirectory in the specified directory. If no directory is specified, the "du"
    command displays the size occupied by all files and directories in the current
    directory.


    The syntax of "du" is as follows:


    from [options] [file or directory]


    Common options:


    +   - "h" or "--human-readable": displays sizes in human-readable format (e.g.
    1K, 2M, 3G, etc.) rather than bytes.

    - "s" or "--summarize": displays only the total size of the specified directory
    (without detailing the size of each subdirectory).

    - "c" or "--total": add an extra line at the end of the output to show the total
    size of all specified files and directories.

    - "a" or "--all": also include hidden files in the size search.

    - "b" or "--bytes": display sizes in bytes rather than human-readable format.'
