  md: 'ps displays the list of processes running on a Linux system. This command is
    useful for monitoring the state of processes and for determining which processes
    are consuming significant system resources.


    Here are the options used with ps:


    +   -A or -e: Shows all processes running on the system, including processes owned
    by other users.


    +   -f: displays an extended format, which includes the name of the command executed,
    the name of the process owner, the CPU time, etc.


    +   -u: displays CPU and memory usage information for each process.


    +   -p PID: displays information about a specific process using its identifier
    (PID).


    +   -H: Displays processes in a tree format, which shows parent-child relationships
    between processes.


