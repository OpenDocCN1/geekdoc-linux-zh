  trans: "\n\n在继续之前，我们可以学习两个快速命令。现在你的 CLI（命令行界面）可能有很多文本。如果你想清理这些内容，可以使用 `clear` 命令。\n\
    \n| 清理屏幕 |\n| :--- | :--- |\n| 命令 | `clear` |\n| 结果 | 系统将清除屏幕 |\n| CLI 显示 | `[root@centos:/]#\
    \ clear` |\n\n现在我们有了整洁的屏幕，如果你使用的是 VPS，可以关闭 PuTTY 了。如果你使用的是虚拟机，请使用 `logout`。我们将继续使用新用户\
    \ ID `tidus` 进行操作。\n\n| 注销 |\n| :--- | :--- |\n| 命令 | `logout` |\n| 结果 | 系统将关闭\
    \ SSH 会话并退出 PuTTY 或注销虚拟机 |\n| CLI 显示 | `[root@centos:/]# logout` |\n\n# 第 7 章\n\
    \n## 系统状态概览\n\n### 快速回顾\n1\n1) 作为一个良好的使用习惯，我们应该避免使用 `root` 用户。\n2) 在命令前加上 `sudo`\
    \ 可以允许用户拥有超级用户权限。\n3) 我们可以使用 `adduser` 命令加上用户名来添加用户。\n   - 1. 1. 示例：`adduser nathan`\n\
    4) 我们可以通过在用户名之前使用 `passwd` 命令更改用户的密码。\n   - 1. 1. 示例：`passwd nathan`\n5) 要获得使用\
    \ `sudo` 的权限，用户必须先添加到配置文件，可以通过 `visudo` 命令进行编辑。\n6) 如果我们的 CLI 变得太混乱，可以使用 `clear`\
    \ 命令将其清理。\n7) 要结束会话并注销，我们可以使用 `logout`。\n\n使用我们在上一章中创建的新用户登录服务器。从现在开始，在本书的剩余部分中，我们将不再使用\
    \ `root` 用户 ID。\n\n让我们来看一些设置，看看我们的服务器性能如何。\n\n首先，我们可以查看系统的运行时间（uptime）。这在系统管理中非常有用。它能让你知道服务器已经运行了多久、有多少个用户登录以及系统的平均负载负载。\n\
    \n| 检查运行时间 |\n| :--- | :--- |\n| 命令 | `uptime` |\n| 结果 | 系统将显示运行时间和平均负载数据 |\n\
    | CLI 显示 | `[tidus@centos:~]$ uptime` |\n\n接下来，我们可以使用 `top` 命令查看系统上哪些进程占用了最多的内存。如果你的系统运行缓慢，这个命令可以帮助查看什么在占用系统资源。\n\
    \n前几行将为你提供系统资源利用情况的摘要，你可以按 CPU 或内存使用对进程列表进行排序，这让你能够快速看到服务器资源资源需求最大的地方。\n\n| 检查系统\
    \ CPU 使用率 |\n| :--- | :--- |\n| 命令 | `top` |\n| 结果 | 系统将显示占用最多 CPU 资源的进程 |\n|\
    \ CLI 显示 | `[tidus@centos:~]$ top` |\n\n要退出 `top`，请按 `control and c`。\n\n要检查系统的内存资源，可以使用\
    \ `vmstat` 命令。\n\n| 检查内存使用 |\n| :--- | :--- |\n| 命令 | `vmstat` |\n| 结果 | 系统将显示空闲和使用的内存量\
    \ |\n| CLI 显示 | `[tidus@centos:~]$ vmstat` |\n\n随着你对 `vmstat` 和 `top` 越来越熟练，你将能够在出现问题时确定哪些脚本或程序耗尽了系统资源。监控这些内容是一个良好的习惯，以确保使用率处于正常范围。\n\
    \n在较大的环境中，你可能想看到哪些用户登录了服务器。使用 `w` 命令可以为我们提供这些信息。\n\n| 检查用户 |\n| :--- | :--- |\n\
    | 命令 | `w` |\n| 结果 | 系统将显示服务器上的用户 |\n| CLI 显示 | `[tidus@centos:~]# w` |\n\n##\
    \ 导航、创建目录和文件\n\n部分内容将是对前面章节的复，但这种重复对于记住日常使用中频繁使用的命令非常重要。\n\n现在我们已经登录，使用 `pwd`\
    \ 命令查看我们当前的目录。\n\n| 查找你的当前目录位置 |\n| :--- | :--- |\n| 命令 | `pwd` |\n| 结果 | 系统将输出你所在的目录\
    \ |\n| CLI 显示 | `[tidus@centos:~]$ pwd/home/tidus` |\n\n注意，这次的目录与我们用 `root` 用户登录时不同。上一次我们在\
    \ `/root`，那是 root 的家目录。这次我们在 `/home/tidus`，这是用户 `tidus` 的家目录。\n\n提示：如果你以后需要回到家目录，请使用\
    \ `cd` 回到你的用户家文件夹。\n\n现在我们已经在家目录下了了，让我们创建一个名为 `documents` 的新目录。\n\n| 创建新目录 |\n\
    | :--- | :--- |\n| 命令 | `mkdir documents` |\n| 结果 | 系统将创建一个名为 documents 的子目录 |\n\
    | CLI 显示 | `[tidus@centos:~]$ mkdir documents[tidus@centos:~]$` |\n\n使用 `ls` 命令列出我们家目录的内容，查看\
    \ `documents` 目录是否存在。\n\n| 列出文件 |\n| :--- | :--- |\n| 命令 | `ls` |\n| 结果 | 列出当前目录下的文件\
    \ |\n| CLI 显示 | `[tidus@centos:~]# lsdocuments` |\n\n通过使用 `ls`，我们现在看到除了 `documents`\
    \ 目录外，我们的目录是空的。\n\n让我们利用之前章节中学到的知识练习导航技能，并进入 `documents` 目录。\n\n尝试使用命令：`cd Documents`\n\
    \n你可能会发现它返回“cd: Documents: No such file or directory.”Linux 是区分大小写的，这意味着 `Documents`\
    \ 和 `documents` 是两个不同的东西。在使用 CentOS 时你需要记住这一点，因为使用正确的大小写很重要。\n\n现在让我们用正确的方法操作。\n\
    \n| 切换子目录 |\n| :--- | :--- |\n| 命令 | `cd documents` |\n| 结果 | 切换到 documents 目录\
    \ |\n| CLI 显示 | `[tidus@centos:~]$ cd documents[tidus@centos: documents]$` |\n\
    \n使用 `ls` 命令列出目录中的文件，你会发现它是空的。\n\n现在让我们通过 `cd` 回家。\n\n| 切换到家目录 |\n| :--- | :---\
    \ |\n| 命令 | `cd` |\n| 结果 | 切换到用户家目录 |\n| CLI 显示 | `[tidus@centos: documents]$\
    \ cd[tidus@centos:~]$ |\n\n如果我们使用 `pwd` 会发现我们回到了 `/home/tidus`。\n\n现在使用完整路径 `cd`\
    \ 进入目录。记住，Linux 是区分大小写的。\n\n| 使用路径切换目录 |\n| :--- | :--- |\n| 命令 | `cd /home/tidus/documents`\
    \ |\n| 结果 | 切换到指定的目录 |\n| CLI 显示 | `[tidus@centos:~]$ cd /home/tidus/documents[tidus@centos:\
    \ documents]$` |\n\n如果我们想回到这个目录的父目录，也可以使用：`cd ..`\n\n| 返回上级目录 |\n| :--- | :---\
    \ |\n| 命令 | `cd ..` |\n| 结果 | 进入父目录 |\n| CLI 显示 | `[tidus@centos: documents]$\
    \ cd ..[tidus@centos:~]$` |\n\n你应该入门了！\n\n多尝试几次，在下一节我们将使用内置编辑器 nano 创建文件。\n\n\
    ### 使用 nano 创建和编辑文件\n\nNano 是 Linux 系统命令行界面（CLI）中非常有用的文本编辑器。由于我们在使用 CLI，nano 是面向键盘的，而不是鼠标。通过学习一些控制键，你将能够使用\
    \ nano 编辑文件。一旦你掌握了这些并学会了更多通过命令行使用 Linux，就可以转向像 vi 这样更高级的编辑器，它们很棒，但学习曲线较陡。\n\n\
    Nano 易于使用，对学者非常友好。它在大多数 CentOS VPS 配置中默认安装，但在虚拟机上可能需要安装。它是一个 WYSIWYG 编辑器；所见即所得”。\n\
    \n我们将在后面的章节更详细地讨论向 CentOS 安装软件包，但万一你还没有 nano，可以使用以下命令并在提示时输入密码来安装：`sudo yum install\
    \ nano`\n\nCLI 可能还会询问你许可。如果是的话，按 `y` 然后按回车。\n\n让我们直接使用 nano 创建文件。\n\n| 在 nano\
    \ 中创建文件 |\n| :--- | :--- |\n| 命令 | `nano notes.txt` |\n| 结果 | 系统启动 nano 处理新文件\
    \ notes.txt |\n| CLI 显示 | `[tidus@centos:~]$ nano notes.txt` |\n\n"
- fmt: '

    Now, you will notice that we are in a simple text editor. Since we do not have
    a mouse we can get a list of the control keys by pressing `control` and `G` at
    the same time.


    See a complete list of `nano` command keys in the table below:


    | Nano command keys | |

    | :--- | :--- |

    | `^` represents the control `Ctrl` key | |

    | `^G` (F1) | Display this help text |

    | `^X` (F2) | Exit from nano |

    | `^O` (F3) | Write the current file to disk |

    | `^J` (F4) | Justify the current paragraph |

    | `^R` (F5) | Insert another file into the current one |

    | `^W` (F6) | Search for a string or a regular expression |

    | `^Y` (F7) | Go to previous screen |

    | `^V` (F8) | Go to next screen |

    Nano command keys (cont.) | |

    | `^K` (F9) | Cut the current line and store it in the cutbuffer |

    | `^U` (F10) | Uncut from into the current line |

    | `^C` (F11) | Display the position of the cursor |

    | `^T` (F12) | Invoke the spell checker, if available |

    | `M-\` (M-\|) | Go to the first line of the file |

    | `M-/` (M-?) | Go to the last line of the file |

    | `^Y` | Prev Page |

    | `^P` | Prev Line |

    | `^X` | Exit |

    | `^V` | Next Page |

    | `^N` | Next Line |


    In the `nano` editor, enter the following text:


    Nano notes: `Nano` is a useful text editor for the command line interface (`CLI`)
    in Linux systems. Since we are using the `CLI`, `nano` is keyboard oriented with
    control keys, rather than using a mouse![](images/0033.jpeg)


    Once you have the text entered, use the exit keys: `Control + X`. You then will
    be prompted if you want to Save modified buffer? Press `Y` then Enter to save
    the file. Now let’s see what is in our folder by using the `ls` command.


    | List Files | |

    | :--- | :--- |

    | Command | `ls` |

    | Result | Lists the files in the current directory |

    | CLI Display | `[tidus@centos:~]$ ls documents` |


    ## Editing, Deleting, Moving, and Copying


    With our `notes.txt` file created we can now learn how to move, delete, and copy.
    To get started, let’s copy the `notes.txt` file to a new file called `test.txt`.
    To do this we will use the `cp` command, which will allow us to copy one file
    to another. To use `cp`, we need to also provide the file we want to copy, and
    the file we want to copy into. See the table below:


    | Copy to New File | |

    | :--- | :--- |

    | Command | `cp notes.txt documents/test.txt` |

    | Result | System copies `notes.txt` and creates a new file, `test.txt` |

    | CLI Display | `[tidus@centos:~]$ cp notes.txt documents/test.txt` |


    By using the `ls` command, we can check if the file was copied.


    | List Files | |

    | :--- | :--- |

    | Command | `ls` |

    | Result | Lists the files in the current directory |

    | CLI Display | `[tidus@centos:~]$ ls documents notes.txt` |


    Now that we have two files, we should open `notes.txt` in `nano` and make a few
    changes.


    | Open a File in Nano | |

    | :--- | :--- |

    | Command | `nano notes.txt` |

    | Result | System will open `notes.txt` in `nano` |

    | CLI Display | `[tidus@centos:~]$ nano notes.txt` |


    When you open the file, you will notice that it has the same text as our `notes.txt`
    file. To the beginning of this document, let’s add a line: This document is a
    test for learning Linux. Once that is added, Save the file as we did earlier.


    With the `cp` command, the file is copied. When we move a file, it is like using
    `cut` in Windows as the original is deleted. We will now move `notes.txt` into
    the `documents` directory. By using the `mv` command we can move files. After
    `mv`, we put the name of the file we want to move and then the location we want
    to move it to.


    | Move a File | |

    | :--- | :--- |

    | Command | `mv notes.txt documents/test.txt` |

    | Result | System will open `test.txt` in nano. |

    | CLI Display | `[tidus@centos:~]$ mv notes.txt documents/test.txt` |


    If you change your directory to `documents` and use `ls`, you will find the `test.txt`
    file is now located there.


    | Change Directory to Documents and List Files | |

    | :--- | :--- |

    | Command | `cd documents; ls` |

    | Result | System will change to `documents` and list files |

    | CLI Display | `[tidus@centos:~]$ cd documents; ls documents]$ test.txt` |


    You may notice above that I used a semi-colon after `cd documents`. This allows
    us to combine two commands. In this example the semi-colon allowed us to change
    directory and then list the files in the new directory.


    Now we can also use `mv` to rename a file. Using the command below, we can rename
    the file and list the files in the directory.


    | Using mv to Change File Name | |

    | :--- | :--- |

    | Command | `mv notes.txt newtest.txt; ls` |

    | Result | System will change the file name to `newtest.txt` and list the files
    in the directory |

    | CLI Display | `[tidus@centos: documents]$ mv notes.txt newtest.txt; ls newtest.txt`
    |


    Hopefully you are not too attached to this file as in the next table, we will
    learn how to delete a file using `rm`.


    | Using rm to Delete a File | |

    | :--- | :--- |

    | Command | `rm newtest.txt` |

    | Result | System will delete `newtest.txt` |

    | CLI Display | `[tidus@centos: documents]$ rm newtest.txt[tidus@centos]$` |


    If you want you can use `ls`, but you will find that the directory is empty. Now
    let’s go back to our parent directory.


    | Move to Parent Directory | |

    | :--- | :--- |

    | Command | `cd ..` |

    | Result | System will move up to parent directory |

    | CLI Display | `[tidus@centos: documents]$ cd ..[tidus@centos:~]$ |


    When deleting files or directories, be very careful as one misstep could delete
    the entire system. Avoiding using the root user helps with this. Sometimes you
    may want to delete a directory, but to delete a directory we must add a flag.
    If we use `rm documents`, we will get an error that it is a directory. To delete
    a directory, we must use the command in the table below.


    | Delete a Directory | |

    | :--- | :--- |

    | Command | `rm -r documents` |

    | Result | System will delete the directory named `documents` |

    | CLI Display | `[tidus@centos:~]$ rm -r documents[tidus@centos:~]$`

