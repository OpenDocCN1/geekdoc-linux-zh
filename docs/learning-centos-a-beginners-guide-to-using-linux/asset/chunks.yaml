  raw: 'A common configuration for Linux servers is to set them up to be web servers. 
    80% of servers that host websites are running Linux.  To establish a good foundation,
    learning how to install these features are important.


    To get started in setting this server up as a web server, we need to install Apache2. 
    Apache2 is the most commonly used web server on Linux systems.  Web servers are
    used to serve up web pages requested by client computers.  To run website software
    like WordPress we will need more packages than this, but installing Apache2 is
    the best starting place.


    | Installing Apache2 |


    | Command | sudo yum install httpd |


    | Result | System will install apache2 and dependent packages to the server. |


    | CLI Display | [tidus@centos:~]$ sudo yum install httpdpassword for tidus:Do
    you want to continue? [Y/n] y[tidus@centos:~]$ |


    Now, we should make a basic HTML file to test our webserver.  In the CLI type
    the following command:


    sudo nano /var/www/html/index.html


    Inside of nano type: <h1>It Works</h1>


    Then press control and x, then y to save and enter.


    The <h1></h1>, if you are not familiar is an HTML tag for a header.  It will make
    the text display big and bold at the top of the page. 


    Later in this book we will cover changing permissions, but for now use the following
    command to make the test HTML file viewable:


    sudo chmod –R 755 /var/www/html/


    That command is setting recursively the permissions to the html folder.  More
    on that later.


    We must start the Apache2 service so that the web service is running to make the
    page visible.


    | Starting Apache2 |


    | Command | sudo service httpd start |


    | Result | System will start apache2 |


    | CLI Display | [tidus@centos:~]$ sudo service httpd startpassword for tidus:[tidus@centos:~]$
    |


    You can now enter your ip address into any browser and see our test HTML file. 


    In the browser you should see: It Works


    Reminder, if you use a Virtual Machine instead of a VPS, you will only be able
    to see this on your host computer’s browser.


    Stopping and Restarting Apache2


    There may be an instance when you want to stop or restart the Apache2 webserver. 


    You can do so by using the following commands:


    Stop Apache2: sudo service httpd stop


    Start Apache2: sudo service httpd start


    Restart Apache2: sudo service httpd restart


    By default, your CentOS server will not start Apache2 at boot, which could be
    a problem if there is a power failure.  Use the following command to have it start
    by default at boot:


    sudo systemctl enable httpd.service


    ### The Web Folder


    You may be wondering, where are my website files located?  On most CentOS installs
    you can get to the web directory by changing directory to /var/www/html.


    | Go To The HTML Directory |


    | Command | cd /var/www/html; ls |


    | Result | System will change to the html directory and list the files. |


    | CLI Display | [tidus@centos:~]$ cd /var/www/htmlindex.html |


    If you want to, you can open the default index.html file in nano.


    | Open index.html in nano |


    | Command | nano index.html |


    | Result | System will load index.html into nano. |


    Note: To save and make changes, you may need to open the file using sudo.


    Now let’s change back to our home directory by using cd.


    ### Installing MySQL/MariaDB Database


    Along with Apache2 and PHP, your server will need MySQL for many web applications
    that need to store data.  This includes the widely popular WordPress CMS.  Recently,
    CentOS has removed MySQL and set MariaDB as the default database package.  This
    will do the job for us as well.


    | Installing MariaDB Server |


    | Command | sudo yum install mariadb-server |


    | Result | System will install MariaDB Server |


    Like Apache2, we need to enter a command for MariaDB to start on system boot. 
    Enter the following:


    sudo systemctl enable mariadb.service


    There may be an instance when you want to stop or restart the MariaDB database. 


    You can do so by using the following commands, which are similar to Apache2’s
    commands:


    Stop MariaDB: sudo service mariadb stop


    Start MariaDB: sudo service mariadb start


    Restart MariaDB: sudo service mariadb restart


    Now that we have our database system running, we need to run a security script
    to remove some default settings that can be dangerous. 


    | Securing MariaDB Server |


    | Command | sudo mysql_secure_installation |


    | Result | System will prompt you for current password for the database server. 
    One is not yet set so press enter.  Then press Y to set a password and follow
    the on screen instructions. |


    ### Installing PHP5


    PHP is a popular web server-side scripting language.  It is very popular and used
    by most content management systems, such as WordPress.  It can display dynamic
    content, run scripts, connect to the database, and send information to the webserver.


    | Installing PHP5 |


    | Command | sudo yum install php php-mysql |


    | Result | System will install php5 and dependencies, along with the mysql package
    to talk to the database. |


    | CLI Display | [tidus@centos:~]$ sudo yum install php php-mysqlpassword for tidus:Is
    this ok? [Y/n] y[tidus@centos:~]$ |


    For the changes to take effect, we need to restart Apache.  Remember the command
    we learned earlier:


    sudo service httpd restart


    Now to test the install, we should make another test page using nano.


    Enter the following:


    sudo nano /var/www/html/php.php


    Inside of nano, enter the following PHP code and save:


    <?php phpinfo(); ?>


    If you do not know PHP that is fine.  This code just provides us with a sample
    page to ensure PHP is working.


    Now, in your web browser enter the following:


    http://myipaddress/php.php


    Where I have myipaddress, you should replace that with your servers IP. 


    You should see a blueish looking table with various information about your PHP
    and system settings.


    Before we move to the next part of the book, delete the index.html file and the
    php.php file. Remember to use the rm command and the files address such as:


    rm /var/www/html/index.html


    ### Installing Sendmail


    If you would like your website or server to be able to send mail, then installing
    Sendmail will help with that.  Sendmail is a general email routing service that
    supports many mail transfer methods across the internet.


    | Installing Sendmail |


    | Command | sudo yum install sendmail |


    | Result | System will install sendmail |


    | CLI Display | [tidus@centos:~]$ sudo yum install sendmailpassword for tidus:Is
    this ok? [Y/n] y[tidus@centos:~]$ |


    After you approve the install it will automatically finish the installation process.


    Now we have the LAMP stack and sendmail installed!  We won’t cover the other various
    configuration settings in this book, but you can find various helpful resources
    online.


    # Chapter 10


    ## Management Via The Browser


    There are many circumstances where you may wish to see server information or manage
    some things through the web browser.  Often times for new users this is easier
    than the CLI.  Users that master the CLI, will likely prefer to use it over a
    graphical management interface. 


    Webmin is a web-based tool for Linux and Unix systems.  It allows users to manage
    users, disk settings, the network, firewall, Apache, DNS, and many other items
    inside of a graphical interface.


    The next steps will walk you through installing this tool.


    To begin, we need to add the webmin repository information to CentOS.  To do so
    enter the following command:


    sudo nano /etc/yum.repos.d/webmin.repo


    Then inside of nano enter the following:


    | [Webmin]name=Webmin Distribution Neutral#baseurl=http://download.webmin.com/download/yummirrorlist=http://download.webmin.com/download/yum/mirrorlistenabled=1
    |


    Save the file and then enter the following two commands:


    sudo yum check-update


    rpm --import http://www.webmin.com/jcameron-key.asc


    Now that yum is updated, we can run the install.


    sudo yum install webmin –y


    When the install completes, run the two commands below to start the service and
    have it run automatically on boot:


    sudo chkconfig webmin on


    sudo service webmin start'
