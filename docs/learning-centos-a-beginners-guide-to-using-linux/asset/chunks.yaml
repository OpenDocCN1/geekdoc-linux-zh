    现在，你会注意到我们正处于一个简单的文本编辑器中。由于我们没有鼠标，可以通过同时按下 `control` 和 `G` 来获取控制键列表。


    请参阅下表完整的 `nano` 命令键列表：


    | Nano 命令键 | |

    | :--- | :--- |

    | `^` 代表控制键 `Ctrl` | |

    | `^G` (F1) | 显示此帮助文本 |

