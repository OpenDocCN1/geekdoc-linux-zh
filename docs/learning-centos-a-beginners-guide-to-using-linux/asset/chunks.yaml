    在 `nano` 编辑器中，输入以下文本：


    Nano 笔记：`Nano` 是 Linux 系统命令行界面 (`CLI`) 中一个实用的文本编辑器。由于我们正在使用 `CLI`，`nano` 面向键盘并使用控制键，而不是使用鼠标![](img/0033.jpeg)


    一旦输入了文本，使用退出键：`Control + X`。然后系统会提示你是否要保存修改过的缓冲区？按 `Y` 然后按回车即可保存文件。现在，让我们使用 `ls`
    命令查看文件夹中的内容。


    | 列出文件 | |

    | :--- | :--- |

    | 命令 | `ls` |

    | 结果 | 列出当前目录下的文件 |

    | CLI 显示 | `[tidus@centos:~]$ ls documents` |


    ## 编辑、删除、移动和复制


    创建 `notes.txt` 文件后，我们现在可以学习如何移动、删除和复制。为了开始，让我们将 `notes.txt` 文件复制到名为 `test.txt`
    的新文件中。为了这一点，我们将使用 `cp` 命令，它允许我们将一个文件复制到另一个文件。使用 `cp` 时，我们需要提供要复制的文件以及要复制到的目标文件。请看下表：


    | 复制到新文件 | |

    | :--- | :--- |

    | 命令 | `cp notes.txt documents/test.txt` |

    | 结果 | 系统复制 `notes.txt` 并创建一个新文件 `test.txt` |

    | CLI 显示 | `[tidus@centos:~]$ cp notes.txt documents/test.txt` |


    通过使用 `ls` 命令，我们可以检查文件是否已复制。


    | 列出文件 | |

    | :--- | :--- |

    | 命令 | `ls` |

    | 结果 | 列出当前目录下的文件 |

    | CLI 显示 | `[tidus@centos:~]$ ls documents notes.txt` |


    现在我们有两个文件了，我们应该在 `nano` 中打开 `notes.txt` 并进行一些更改。


    | 在 Nano 中打开文件 | |

    | :--- | :--- |

    | 命令 | `nano notes.txt` |

    | 结果 | 系统将在 nano 中打开 `notes.txt` |

    | CLI 显示 | `[tidus@centos:~]$ nano notes.txt` |


    当你打开文件时，你会发现它的内容与我们的 `notes.txt` 文件相同。在文档的开头，让我们添加一行：此文档是用于学习 Linux 的测试。添加后，像我们之前一样保存文件。


    使用 `cp` 命令，文件被复制了。当我们移动文件时，就像在 Windows 中使用“剪切”一样，因为原始文件会被删除。现在我们将 `notes.txt`
    移动到 `documents` 目录。通过使用 `mv` 命令，我们可以移动文件。在 `mv` 之后，我们输入想要移动的文件名，然后输入我们将其移动到的位置。


    | 移动文件 | |

    | :--- | :--- |

    | 命令 | `mv notes.txt documents/test.txt` |

    | 结果 | 系统将在 nano 中打开 `test.txt`。 |

    | CLI 显示 | `[tidus@centos:~]$ mv notes.txt documents/test.txt` |


    如果你切换目录到 `documents` 并使用 `ls`，你会发现 `test.txt` 文件现在位于那里。


    | 切换目录到 Documents 并列出文件 | |

    | :--- | :--- |

    | 命令 | `cd documents; ls` |

    | 结果 | 系统将切换到 `documents` 并列出文件 |

    | CLI 显示 | `[tidus@centos:~]$ cd documents; ls documents]$ test.txt` |


    你可能注意到我在 `cd documents` 之后使用了分号。这允许我们组合两个命令。在这个示例中，分号允许我们切换目录然后列出文件。


    现在我们还可以使用 `mv` 来重命名文件。使用下面的命令，我们可以重命名文件并列出目录中的文件。


    | 使用 mv 重命名文件 | |

    | :--- | :--- |

    | 命令 | `mv notes.txt test.txt; ls` |

    | 结果 | 系统将文件名改为 `test.txt` 并列出目录中的文件 |

    | CLI 显示 | `[tidus@centos: documents]$ mv notes.txt test.txt` |


    希望你对这个文件并不太留恋，因为在下一个表格中，我们将学习如何使用 `rm` 删除文件。


    | 使用 rm 删除文件 | |

    | :--- | :--- |

    | 命令 | `rm test.txt` |

    | 结果 | 系统将删除 `test.txt` |

    | CLI 显示 | `[tidus@centos: documents]$ rm test.txt[tidus@centos]$` |


    如果你愿意，可以使用 `ls`，但你会发现目录是空的。现在让我们回到父目录。


    | 回到父目录 | |

    | :--- | :--- |

    | 命令 | `cd ..` |

    | 结果 | 系统将移动到上级目录 |

    | CLI 显示 | `[tidus@centos: documents]$ cd ..[tidus@centos:~]$` |


    删除文件或目录时，请务必非常小心，因为一步失误可能会删除整个系统。避免使用 root 用户有助于这一点。有时你可能想要删除一个目录，但删除目录时必须添加一个标记。如果我们使用
    `rm documents`，将收到错误提示这是一个目录。要删除目录，我们必须使用表中的命令。


    | 删除目录 | |

    | :--- | :--- |

    | 命令 | `rm -r documents` |

    | 结果 | 系统将删除名为 `documents` 的目录 |

    | CLI 显示 | `[tidus@centos:~]$ rm -r documents[tidus@centos:~]$` |


