    # Chapter 1


    ## What is Linux & CentOS?


    You may be familiar with Microsoft Window’s and Apple’s MacOSX.  Both of these
    are examples of operating systems and so is Linux.


    Merriam-Webster defines operating system as the main program in a computer that
    controls the way the computer works and makes it possible for other programs to
    function.


    Essentially, the operating system is the program that lets you interact with a
    computer, and the computer to understand what you want to do.   Operating systems
    are required for computers to work, but in our interconnected world, they are
    also used in smart phones, cars, home appliances, and basically everything.  With
    no operating system our devices are just hunks of plastic, glass, and silicone. 


    Linux is an open-source operating system. Being open-source is a major difference
    between Linux and the other popular operating systems. Open-source means that
    the software is provided with the original source code and is made freely available
    to be redistributed and modified.  This is what makes Linux unique.  It has a
    strong community out there modifying the code, participating in forums, and fixing
    bugs much quicker than the alternatives.


    If you are looking to add a new skill to your portfolio, learning how to use Linux,
    can be very useful.  According to ZDNet in 2014, 87% of enterprise businesses
    added at least one Linux server and 82% planned on adding more in 2015. 


    Linux and its distributions are very popular for database, web, and other types
    of servers.  Being around since the 90’s, Linux powers most of the internet, supercomputers
    that enable breakthroughs in science, and the stock exchanges of the globe.  As
    you look at the internet, Linux powers over 36% of the resources online, of that
    about 21% is the CentOS Linux distribution.


    A distro or distribution is a version or ‘flavor’ of Linux that uses the Linux
    kernel as its foundation.  The kernel is the one component that is actually called
    Linux.  The kernel is the lowest level of the operating system and manages the
    primary system functions for the CPU, memory, and devices.


    In 1991, a personal project by Linus Torvalds was to create a new free operating
    system kernel.  Since then the kernal has been marked with constant growth over
    the last 25 years.  It has grown from a small number of C based files to over
    18 million lines of xource code that is open under the GNU General Public Licence. 


    There are hundreds of Linux distros and most are free to use, but just three distros
    dominate the infrastructure of the internet: Ubuntu, Debian, and CentOS.  CentOS
    is a distribution of Linux, which is derived from the sources of Red Hat Enterprise
    Linux.  It is noted for being incredibly stable, predictable, and managable. 
    Since 2004 CentOS Linux has been community-supported and free to use. From CentOS
    and its community, you can get a fantastic operating system to manage websites,
    databases, and run other services, while also getting support from a growing community. 
    Almost a quarter of servers running Linux, are using CentOS. 


    There are a lot of distributions out there and some differences between them. 
    I personally started in an Ubuntu enviroment when I began learning and consider
    the functionality between the two comparable, but with strong differences in some
    of their user interaction.  CentOS is becoming more of a standard for those who
    want to host sites and utilize products like cPanel and other hosting software
    tools.  They have been standardizing on CentOS due to its slower release cycle. 
    This book will explore using CentOS, and in the process teach general Linux usage.


    ## Methods to Install CentOS 7 & Getting Started


    The tools that you will need, vary on the route that you would like to go.  There
    are four installation methods, that you could use to experiment with the lessons
