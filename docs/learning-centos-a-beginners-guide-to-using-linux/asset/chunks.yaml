    如果你的安装失败或出现挂起，可能是因为你的系统不支持虚拟运行 64 位软件。我在在一台旧电脑上测试此本书时就遇到过这个问题。


    你可以从此链接下载 32 位的 i386 版本：[`mirror.centos.org/altarch/7/isos/i386/`](http://mirror.centos.org/altarch/7/isos/i386/)


    一旦安装程序成功加载，你将需要选择语言和位置。完成后，点击“继续”（Continue）。


    ![](img/00025.jpeg)


    接下来你将看到 CentOS 预配置各种设置。


    你可能需要配置“系统”（system）标题下的“安装目标”（Installation Destination）。选择“安装目标”，并在该界面中选择硬盘并点击“完成”（done），如下所示。


    ![](img/00026.jpeg)


    完成后，你回到了主安装界面。现在，我们需要确保能够建立互联网连接。点击“网络和主机名”（Network and Hostname）。在此面板内部配置并确保勾选了“网络可用时自动连接”（Automatically
    Connect When Network is Available）。完成后，点击保存（save）。在主机名（hostname）框中输入你的服务器名称。我将其命名为
    `centOS`。完成后，将网络适配器的开关拨到开启。它就在网络适配器旁边。点击左上角的“完成”（Done），这将带回到主屏幕，你可以在右下角点击“开始安装”（Begin
    Installation）。


    ![](img/00027.jpeg)


    在 CentOS 安装期间，我们可以配置两项内容：“Root 密码”（Root Password）和“用户创建”（User Creation）。现在让用户配置保持不变，设置“Root
    密码”。点击“Root 密码”，输入两次新密码，然后点击完成。务必记住这个密码，因为我们稍后会需要它。


    ![](img/00028.jpeg)


    安装完成后，你需要点击右下角的“重启”（Reboot）按钮。


    ![](img/00029.jpeg)


    现在卸载 ISO 镜像（如果不卸载你将反复进入安装过程）并关闭虚拟机。


    现在我们需要对虚拟机进行一些额外的配置，以便它既能访问互联网，你稍后又可以在书中通过浏览器查看系统。


    在虚拟机关闭状态下，点击“设置”（Settings）。在设置面板中，点击左侧的“网络”（Network）。你会看到适配器 1 已配置并连接到 NAT。保持该设置不变。点击适配器
    2，然后勾选“启用网络适配器”（Enable Network Adapter）复选框。在“连接到”（Attached to）下拉菜单中选择“仅主机网络”（Host-only
    Adapter），然后确定。


    现在点击启动，启动完成后，你将看到一个登录的命令行提示符。我们完成了 CentOS 的安装和初始配置。


    ![](img/00030.jpeg)


    登录并查找 IP 地址，以便我们可以像使用 VPS 一样继续（目前我们确实是这样，但仅在内部可用）。


    | 查找你的 IP 地址 |


    | 命令 | `ip addr` |

    | 结果 | 系统将显示网络信息 |


    输入 `ip addr` 并按回车后，你会在页面上看到大量信息。我们不关心 1（回环连接）或 2 之后的信息，但在 3 下，有一个 inet 看起来像这样：`192.168.1.50/24`。你的
    IP 地址将是 `192.168.1.50`。所有网络都是不同的，但可以以此作为通用指南。


    务必记下这个 IP。它可能是动态的，可能会随着时间推移而变化。如果你认为它可能已经更改，请参考上面的“查找你的 IP 地址”框。


    # 第 4 章


    # 60 秒文档训练营


    在技术领域，我们的成败取决于我们产出的文档。想象一下客户的系统出现问题，而你不知道它在运行什么，或者 IP 或密码是什么。这是一个常见问题。通常将密码存储在任何地方都是安全的，但你必须想出一种安全存储这些信息的方法。当你处理大量的
    IP 和密码时，记住所有它们是不可能的。下面是一份实用的文档指南，帮助你入门。由于是为了学习 CentOS 而非生产环境，把密码写下来可能是没问题的。如果你是阅读电子版，请创建一个你自己的表格来放置这些信息。


    ### 示例数据


    服务器名称：CentOS

    操作系统：CentOS 7

    支持直到：2024

    Root 密码：`*********`

    IP 地址：000.000.000.000

    主要用途：Web 服务器

    安装日期：2016/6/20

    最后更新日期：2016/6/20


    ### 我的文档


    服务器名称：______________________________

    操作系统：CentOS 7

    支持直到：2024

    Root 密码：_____________________________

    IP 地址：___________________________________

    主要用途：Web 服务器

    安装日期：________________________________

    最后更新日期：___________________________


    # 第 5 章


    ## 进入 CLI


    CLI 是命令行界面（command line interface）的缩写，你可以通过输入文本行与系统进行交互。这就是我们与服务器交互的方式。


    如果你决定不使用推荐的方法来设置 VPS，那么你可以在电脑的显示器上看到 CLI。当你启动电脑时，它将带你进入 CLI，然后你可以在那里登录。


    我们可以使用名为 `SSH` 的协议连接到 CentOS 服务器。`SSH` 代表安全外壳（Secure Shell），这是我们远程登录服务器的一种加密方式。


    为了给下一步做准备，请参考我们在上一章中作为文档训练营一部分而记录的信息。我们需要 IP 地址和登录信息。IP 地址是识别网络上计算机的数字字符串。对于我们的
    VPS，IP 地址是公网 IP，可以从任何连接互联网的地方访问。对于虚拟机，请使用启动时显示的 CLI 接口。


    我推荐用于 SSH 连接到 VPS 服务器的程序叫做 `PuTTY`。`PuTTY` 是一个免费的开源 `SSH` 客户端，支持 Windows。你可以从以下链接下载它：[`putty.org`](http://putty.org)


    你下载的文件是一个可执行文件（`.exe`），不需要安装。下载后，你可以将其拖到桌面以便快速访问。


    使用此工具连接到 VPS 或虚拟机非常简单。在“主机名或 IP 地址”处，输入提供的 IP 地址。选择 `SSH` 作为连接类型，然后点击打开。查看图 1
    以了解示例样子。


    注意：你的 IP 地址将与图中不同。


    图 1：Putty 配置


    ![](img/00031.jpeg)


    当你点击连接时，可能会收到图 2 这样的消息。点击“是”。


    图 2：PuTTY 安全警告


    ![C:\Users\Nathan\AppData\Local\Microsoft\Windows\INetCache\Content.Word\2016-02-08_19h51_40.png](img/00032.jpeg)


    ## 首次登录


    现在你将被提示首次登录。输入用户名 `root`，然后输入提供的或你在设置 VPS 时设置的密码。


    如果你使用的是 DigitalOcean，系统会在你第一次登录时要求重置密码。你需要重新输入提供的密码，然后输入两次你想设置的新密码。确保你遵循安全密码指南，并为
    root 用户设置安全的密码。


    注意：在本书中，我使用表格来解释我们要学习的不同命令。第一行是我们要执行的任务，第二行是我们需要使用的命令，第三行是你的 CLI 看起来的样子。我认为这是描述和解释我们要学习的命令的最佳方式。


    如果你没有被提示更改密码，但想更改，可以输入命令 `passwd`。更多细节请见下一页表格。


    | 修改我的密码 |


    | 命令 | `passwd` |

    | 结果 | 系统将提示输入新密码 |


