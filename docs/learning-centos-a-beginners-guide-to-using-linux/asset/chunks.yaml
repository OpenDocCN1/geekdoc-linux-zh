  trans: '

    这太简单了！现在我们需要创建一个新的用户账户，该账户只能操作我们创建的数据库。这可以提供良好的安全性并对数据库权限进行更好的控制。


    对我来说，我将把这个新用户账户命名为 `wpuser`。在下面的命令中，如果你愿意，可以使用不同的名称，并将 `password` 更改为安全的密码。在我们连接
    WordPress 到数据库时，我们需要这个密码。


    ```

    CREATE USER wpuser@localhost IDENTIFIED BY ‘password’;

    ```


    现在你已经有一个数据库和一个用户账户，但该用户还无法访问 wordpress 数据库。我们需要通过以下命令授予该用户访问 wordpress 数据库的权限。


    ```

    GRANT ALL PRIVLEGES ON wordpress.* TO wpuser@localhost IDENTIFIED BY ‘password’;

    ```


    我们的用户现在有了访问数据库的权限，但我们需要执行名为 `flush` 的操作，以便 MySQL/MariaDB 知道我们所所的权限更改。使用以下命令：


    ```

    FLUSH PRIVLEGES;

    ```


    既然我们已经执行了这些命令，可以使用以下命令退出 MySQL/MariaDB：


    ```

    exit

    ```


    很简单对吧？使用 MySQL 和 MariaDB 还有很多东西需要学习。我建议你继续扩展这些主题的知识，因为它们是非常受欢迎的技能。


    # 第 13 章


    ## 准备并安装 WordPress


    有许多不同的内容管理系统和平台可以安装。根据 2015 年的报告，在线所有网站的近 25% 使用 WordPress。这使其成为最常用的平台之一。除了非常流行之外，通过在我们的服务器上安装它，我们还可以从中中学到很多知识，供你以后在使用其他系统部署网站时参考。我们已经知道了如何创建数据库和用户，现在我们需要知道如何安装这样的包。


    在安装 WordPress 之前，根据你的 VPS 或虚拟机的安装情况，你可能需要安装几个包。使用以下操作确保你已经有了正确的配置。


    我们首先需要加载的是 `php-gd`。WordPress 和其他平台需要它来正确地调整缩略图的大小。我们可以通过以下命令安装它：


    ```

    sudo yum install php-gd

    ```


    在提示时，务必输入你的密码并按 y。


    为了让 Apache 能够看到新模块，我们需要重启 `httpd`。


    ```

    sudo service httpd restart

    ```


    现在我们还需要几个包。第一个是 `wget`。Wget 是一个从 Web 服务器收集内容的程序。它允许我们从网络下载文件到我们的服务器。要安装 `wget`，使用以下命令：


    ```

    sudo yum install wget

    ```


    同样，在提示时，务必输入你的密码并按 y。


    我们下一个用于简化流程的工具叫做 `rsync`。Rsync 是一种允许我们在计算机系统中保留文件副本并将文件同步到其他文件夹的实用。要安装 `rsync`，使用以下命令：


    ```

    sudo yum install rsync

    ```


    ## 下载 WordPress


    我喜欢在教程中使用 WordPress 的原因之一是它对新用户来说很容易配置，而且 WordPress 团队始终将最稳定的软件版本放在同一个链接上。


    在继续之前，确保你正处于主目录。记住，你可以随时在 CLI 中输入 `cd` 回到主目录。


    现在我们已经确定在主目录下了，可以使用以下命令使用 `wget` 获取最新版本的 WordPress：


    ```

    cd ~ && wget http://wordpress.org/latest.tar.gz

    ```


    这会下载 WordPress 的压缩版本，我们现在需要使用 `tar` 命令将其解压。在 Linux 中，`tar` 代表早期的 tape archive（磁带归档），当时大多数系统管理员会将文件备份到磁带驱动器中。对于我们的目的，它允许我们从下载中收集压缩文件并将其解压到我们的主目录。我们可以通过以下命令实现：


    ```

    tar xzvf latest.tar.gz

    ```


    在你的主文件夹内部，现在将有一个名为 `wordpress` 的目录。要完成安装，我们需要将文件移动到 Apache 文档根目录（`/var/www/html`）。使用方便的
    `rsync` 工具，这非常简单。使用以下命令将文件同步到 Apache 目录。


    ```

    sudo rsync –avP ~/wordpress/ /var/www/html/

    ```


    记住，大小写很重要。此命令中的一个微小错误都可能导致你今后出现问题。命令运行后，`rsync` 将执行工作并将所有文件复制到 `/var/www/html`
    目录。


    我们还有一件事要做，我们需要为 WordPress 创建一个 uploads 文件夹来存储文件。使用我们之前用过的 `mkdir` 命令可以让这变得简单。


    ```

    sudo mkdir /var/www/html/wp-content/uploads

    ```


    ## 更改所有权、权限和编辑文件的回顾


    现在我们还有两个步骤来完成一个正确的配置。我们需要更改 WordPress 文件和文件夹的所有权权限。这将增加安全性并允许 WordPress 按照预期运行。为了做到这一点，我们将使用书中早些解释过的
    `chown` 命令。


    ```

    sudo chown –R apache:apache /var/www/html/*

    ```


    | 更改 Apache Web 目录的所有者 |

    | :--- | :--- |

    | 命令 | `sudo chown –R apache:apache /var/www/html/*` |

    | 结果 | 系统将 `/var/www/html` 目录及其子目录的所有权更改为 apache |

    | CLI 显示 | `[tidus@centos:~]$ sudo chown –R apache:apache /var/www/html/*password
    for tidus:[tidus@centos:~]$` |


    现在我们的最后一步是配置 WordPress 文件，它将连接我们到我们创建的数据库。确保你记得我们设置的数据库名称、用户名和密码。


    首先，我们需要切换到 `/var/www/html` 目录。


    | 切换目录 |

    | :--- | :--- |

    | 命令 | `cd /var/www/html` |

    | 结果 | 系统将我们移动到 html 目录 |

    | CLI 显示 | `[tidus@centos:~]$ cd /var/www/html[tidus@centos: html]$` |


    WordPress 使用一个名为 `wp-config.php` 的文件连接数据库。在安装过程中，提供了一个示例文件。我们需要复制该文件并用我们的数据库设置进行配置。


    | 复制文件 |

    | :--- | :--- |

    | 命令 | `sudo cp wp-config-sample.php wp-config.php` |

    | 结果 | 系统将该文件复制为具有所需文件名的新文件 |

    | CLI 显示 | `[tidus@centos: html]$ sudo cp wp-config-sample.php wp-config.php[tidus@centos:
    html]$` |


    现在我们有了可以修改的配置文件，可以使用 `nano` 进行编辑。


    ```

    sudo nano wp-config.php

    ```


    为了连接数据库，我们需要在该文件中修改的只有以下字段：`DB_NAME`、`DB_USER` 和 `DB_PASSWORD`。这将允许网站与数据库通信。查看下一页获取我的配置示例。


    注意：你不应该将 password 作为密码，这仅在书中作为指南。


    | WP-config.php 配置 |

    | :--- |

    | `/** WordPress 的数据库名称 */define(''DB_NAME'', ''wordpress'');/** MySQL 数据库用户名
    */define(''DB_USER'', ''wpuser'');/** MySQL 数据库密码 */define(''DB_PASSWORD'', ''password'');`
    |


    这些是你在该文件中应该修改的值。完成后，从 `nano` 关闭并保存更改。


    ## 通过浏览器访问 WordPress


    我们在这一部分需要做的最后步骤是通过浏览器访问 WordPress。要执行操作，在浏览器中输入你的 IP 地址（`http://myipaddress`）。你应该看到一个如下所示的屏幕。


    ![WordPress Web 安装](img/00035.jpeg)


    填写所需信息，然后点击“安装 WordPress”按钮。这将确认安装并自动在数据库中创建表。


    要继续，点击页面底部的“登录”按钮。


    # 第 14 章


    ## 结语


    恭喜！在不到 85 页的内容里，我们建立了一些 CentOS 7 基础知识，并利用这些信息构建了一个基础 Web 服务器。

