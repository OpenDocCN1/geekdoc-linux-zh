- fmt: "\nA common configuration for Linux servers is to set them up to be web servers.\
    \ 80% of servers that host websites are running Linux. To establish a good foundation,\
    \ learning how to install these features are important.\n\nTo get started in setting\
    \ this server up as a web server, we need to install `Apache2`. `Apache2` is the\
    \ most commonly used web server on Linux systems. Web servers are used to serve\
    \ up web pages requested by client computers. To run website software like WordPress\
    \ we will need more packages than this, but installing `Apache2` is the best starting\
    \ place.\n\n### Installing Apache2\n\n| Item | Details |\n| :--- | :--- |\n| Command\
    \ | `sudo yum install httpd` |\n| Result | System will install apache2 and dependent\
    \ packages to the server. |\n| CLI Display | `[tidus@centos:~]$ sudo yum install\
    \ httpdpassword for tidus:Do you want to continue? [Y/n] y[tidus@centos:~]$` |\n\
    \nNow, we should make a basic HTML file to test our webserver. In the CLI type\
    \ the following command:\n\n```bash\nsudo nano /var/www/html/index.html\n```\n\
    \nInside of `nano` type: `<h1>It Works</h1>`\n\nThen press `control` and `x`,\
    \ then `y` to save and enter.\n\nThe `<h1>``</h1>`, if you are not familiar is\
    \ an HTML tag for a header. It will make the text display big and bold at the\
    \ top of the page. \n\nLater in this book we will cover changing permissions,\
    \ but for now use the following command to make the test HTML file viewable:\n\
    \n```bash\nsudo chmod –R 755 /var/www/html/\n```\n\nThat command is setting recursively\
    \ the permissions to the html folder. More on that later. \n\nWe must start the\
    \ `Apache2` service so that the web service is running to make the page visible.\n\
    \n### Starting Apache2\n\n| Item | Details |\n| :--- | :--- |\n| Command | `sudo\
    \ service httpd start` |\n| Result | System will start apache2 |\n| CLI Display\
    \ | `[tidus@centos:~]$ sudo service httpd startpassword for tidus:[tidus@centos:~]$`\
    \ |\n\nYou can now enter your ip address into any browser and see our test HTML\
    \ file. \n\nIn the browser you should see: It Works\n\nReminder, if you use a\
    \ Virtual Machine instead of a VPS, you will only be able to see this on your\
    \ host computer’s browser.\n\n### Stopping and Restarting Apache2\n\nThere may\
    \ be an instance when you want to stop or restart the `Apache2` webserver. \n\n\
    You can do so by using the following commands:\n\n- Stop Apache2: `sudo service\
    \ httpd stop`\n- Start Apache2: `sudo service httpd start`\n- Restart Apache2:\
    \ `sudo service httpd restart`\n\nBy default, your CentOS server will not start\
    \ `Apache2` at boot, which could be a problem if there is a power failure. Use\
    \ the following command to have it start by default at boot:\n\n```bash\nsudo\
    \ systemctl enable httpd.service\n```\n\n### The Web Folder\n\nYou may be wondering,\
    \ where are my website files located? On most CentOS installs you can get to the\
    \ web directory by changing directory to `/var/www/html`.\n\n| Item | Details\
    \ |\n| :--- | :--- |\n| Command | `cd /var/www/html; ls` |\n| Result | System\
    \ will change to the html directory and list the files. |\n| CLI Display | `[tidus@centos:~]$\
    \ cd /var/www/htmlindex.html` |\n\nIf you want to, you can open the default `index.html`\
    \ file in `nano`.\n\n| Item | Details |\n| :--- | :--- |\n| Command | `nano index.html`\
    \ |\n| Result | System will load index.html into nano. |\n\nNote: To save and\
    \ make changes, you may need to open the file using `sudo`.\n\nNow let’s change\
    \ back to our home directory by using `cd`.\n\n### Installing MySQL/MariaDB Database\n\
    \nAlong with `Apache2` and `PHP`, your server will need `MySQL` for many web applications\
    \ that need to store data. This includes the widely popular WordPress CMS. Recently,\
    \ CentOS has removed `MySQL` and set `MariaDB` as the default database package.\
    \ This will do the job for us as well.\n\n### Installing MariaDB Server\n\n| Item\
    \ | Details |\n| :--- | :--- |\n| Command | `sudo yum install mariadb-server`\
    \ |\n| Result | System will install MariaDB Server |\n\nLike `Apache2`, we need\
    \ to enter a command for `MariaDB` to start on system boot. Enter the following:\n\
    \n```bash\nsudo systemctl enable mariadb.service\n```\n\nThere may be an instance\
    \ when you want to stop or restart the `MariaDB` database. \n\nYou can do so by\
    \ using the following commands, which are similar to `Apache2`’s commands:\n\n\
    - Stop MariaDB: `sudo service mariadb stop`\n- Start MariaDB: `sudo service mariadb\
    \ start`\n- Restart MariaDB: `sudo service mariadb restart`\n\nNow that we have\
    \ our database system running, we need to run a security script to remove some\
    \ default settings that can be dangerous. \n\n### Securing MariaDB Server\n\n\
    | Item | Details |\n| :--- | :--- |\n| Command | `sudo mysql_secure_installation`\
    \ |\n| Result | System will prompt you for current password for the database server.\
    \ One is not yet set so press enter. Then press Y to set a password and follow\
    \ the on screen instructions. |\n\n### Installing PHP5\n\n`PHP` is a popular web\
    \ server-side scripting language. It is very popular and used by most content\
    \ management systems, such as WordPress. It can display dynamic content, run scripts,\
    \ connect to the database, and send information to the webserver.\n\n### Installing\
    \ PHP5\n\n| Item | Details |\n| :--- | :--- |\n| Command | `sudo yum install php\
    \ php-mysql` |\n| Result | System will install php5 and dependencies, along with\
    \ the mysql package to talk to the database. |\n| CLI Display | `[tidus@centos:~]$\
    \ sudo yum install php php-mysqlpassword for tidus:Is this ok? [Y/n] y[tidus@centos:~]$`\
    \ |\n\nFor the changes to take effect, we need to restart `Apache`. Remember the\
    \ command we learned earlier:\n\n```bash\nsudo service httpd restart\n```\n\n\
    Now to test the install, we should make another test page using `nano`.\n\nEnter\
    \ the following:\n\n```bash\nsudo nano /var/www/html/php.php\n```\n\nInside of\
    \ `nano`, enter the following PHP code and save:\n\n```php\n<?php phpinfo(); ?>\n\
    ```\n\nIf you do not know `PHP` that is fine. This code just provides us with\
    \ a sample page to ensure `PHP` is working.\n\nNow, in your web browser enter\
