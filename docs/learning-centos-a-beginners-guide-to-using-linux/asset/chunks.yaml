  trans: "\n\n| CLI 显示 | `[root@centos:~]# passwd` 正在更改用户 root 的密码。新密码:再次输入新密码:passwd:\
    \ 密码更新成功 |\n\n当系统提示你输入新密码时，请输入，不要担心密码不会显示在屏幕上。完成后，请按回车键并再次输入一次。\n\n## 导航\n\n不要被\
    \ CLI 上的白字黑背景所吓到。我知道这里没有鼠标或图形界面，但过了一会儿，你就会习惯于在服务器的目录间进行导航了。目录就像你可能 Windows 或 Mac\
    \ 设备上用过的文件夹。作为一名长期使用这种工具的人，我实际上更喜欢这种方式，而不是图形化用户界面。在做任何其他操作之前，让我们学会探索服务器。通过使用 `pwd`\
    \ 命令，我们可以看到当前查看的目录位置。\n\n| 查找你的当前目录位置 |\n| 命令 | `pwd` |\n| 结果 | 系统将输出你当前所在的目录。\
    \ |\n| CLI 显示 | `[root@centos:~]# pwd/root` |\n\n现在我们处于一个名为 `root` 的目录中，它本质上是用户\
    \ `root` 的家目录。这个 root 家目录与系统的实际根之间有很大区别。\n\n路径 `/` 是系统的根，但现在我们处于一个名为 `root` 的子目录中\
    \ (`/root`)。\n\n服务器的根是顶级目录。一切都是它里面的子目录。从我们现在的位置，有两种方法可以到达那里。让我们从最简单的带我们进入根目录命令开始。\n\
    \n| 进入根目录 (/) |\n| 命令 | `cd /` |\n| 结果 | 我们切换到主根目录 |\n| CLI 显示 | `[root@centos:~]#\
    \ cd /[root@centos:/]#` |\n\n现在让我们再次使用 `pwd` 看看我们现在哪里。\n\n| 查找你的当前目录位置 |\n| 命令\
    \ | `pwd` |\n| 结果 | 系统将输出你当前所在的目录。 |\n| CLI 显示 | `[root@centos:~]# pwd/` |\n\n\
    如果你想查看文件夹里有什么内容，可以使用 `ls` 命令。\n\n| 列出文件 |\n| 命令 | `ls` |\n| 结果 | 列出当前目录下的文件 |\n\
    | CLI 显示 | `[root@centos:/]# lsbin dev home media opt root sbin sysvar boot etc\
    \ lib mnt proc run srv tmp var` |\n\n我们还可以通过 `ls` 后面添加标志（flag）来查看更多细节。\n\n标志是在提示符处作为命令的一部分输入的，并添加额外的参数来告诉系统我们想要什么。\n\
    \n尝试运行此命令：`ls –la`\n\n在示例中，–la 就是标志。`l` 告诉系统我们想查看更多细节并列出目录中的所有文件，甚至是隐藏文件。\n\n\
    现在，让我们切换到名为 `home` 的目录。\n\n| 切换目录 |\n| 命令 | `cd home` |\n| 结果 | 系统将我们移动到子文件夹 home\
    \ |\n| CLI 显示 | `[root@centos:/]# cd home[root@centos: home]#` |\n\n注意：理解父目录和子目录的区别很重要。如果我们有一个名为\
    \ `documents` 的目录，并在里面另一个名为 `pictures` 的目录。那么 `pictures` 就是 `documents` 的子目录。在此例中，我们处于父目录\
    \ `/` 并切换到子目录 `/home`。如果你不在父文件夹中，你仍然可以进入 `home`，但在 `cd` 之后你必须列出完整路径（例如：`cd /home`）。如果你遇到诸如“无此类文件或目录”的错误，你可能需要输入完整路径，因为你可能不在正确的目录中。\n\
    \n如果我们想回到根目录，可以使用另一个切换目录命令，它可以轻松向上移动一个目录。\n\n| 向上移动一个目录 |\n| 命令 | `cd ..` |\n\
    | 结果 | 系统将我们移动到父文件夹 |\n| CLI 显示 | `[root@centos: home]# cd ..[root@centos:/]#`\
    \ |\n\n使用 `cd` 配合目录名和 `..` 可以允许我们快速在服务器中移动。\n\n## 快速回顾\n\n1. `CLI` 代表命令行界面（command\
    \ line interface），你可以通过输入文本行与系统交互。\n2. `SSH` 代表安全外壳（Secure Shell），这是我们登录服务器的加密方式。\n\
    3. `IP 地址` 是一个识别网络上计算机的数字字符串。\n4. `PuTTY` 是一个免费、开源且支持 Windows 的 SSH 客户端。\n5. `passwd`\
    \ 命令允许我们更改当前密码。\n6. 输入 `pwd` 将为我们提供服务器目录中的当前位置。\n7. 使用 `ls` 将列出当前目录下的文件和目录。\n\
    8. 在 `ls` 之后添加标志（如 –la）将我们提供更多细节并显示隐藏文件。\n9. 我们可以使用 `cd` 来切换目录：\n   - 我们可以通过 `cd\
    \ ..` 向上移动文件夹。\n   - 在 `cd` 后面加上子目录将我们带入目录（示例：`cd home`）。\n10. 路径 `/` 是系统的根，但\
    \ `/root` 是子目录或子目录。\n\n## 第 6 章：创建新用户\n\n`root` 用户对系统具有完全访问权限。虽然我们用它来学习一些导航，但不应将其作为系统的主要用户名。这会违背这种极佳的安全模型。在我们做其他事情之前，让我们先学习探索服务器。通过使用\
    \ `pwd` 命令，我们可以看到当前查看的目录位置。\n\n"
- fmt: "\nBefore we move on, we can learn two quick commands. Right now there is probably\
    \ a lot of text on your CLI. If you want to clean that up, we can use the `clear`\
    \ command.\n\n| Clearing the Screen |\n| :--- | :--- |\n| Command | `clear` |\n\
    | Result | System will clear the screen |\n| CLI Display | `[root@centos:/]# clear`\
    \ |\n\nNow that we have a clear screen we can close out of PuTTY if you are using\
    \ a VPS. If you are using a Virtual Machine type use `logout`. We are going to\
    \ continue on our new user id, `tidus`.\n\n| Logging Out |\n| :--- | :--- |\n\
    | Command | `logout` |\n| Result | System will close SSH session and exit PuTTY\
    \ or logout of a Virtual Machine |\n| CLI Display | `[root@centos:/]# logout`\
    \ |\n\n# Chapter 7\n\n## System Status at a Glance\n\n### Quick Recap\n1\n1) We\
    \ should avoid using the `root` user as a good usage practice.\n2. `sudo` before\
    \ a command allows a user to have super user privileges.\n3. We can add a user\
    \ by using the command `adduser`, with the username afterwards.\n   - 1. 1. Example:\
    \ `adduser nathan`\n4) We can change a user’s password by using the `passwd` command\
    \ before their name.\n   - 1. 1. Example: `passwd nathan`\n5) To have access to\
    \ use `sudo`, a user must first be added to the configuration file, which can\
    \ be edited by using the `visudo` command.\n6) If our CLI gets too cluttered,\
    \ we can clear it by using the `clear` command.\n7) To end our session and sign\
    \ out, we can use `logout`.\n\nLog into your server, with the new user that we\
    \ created in the last chapter. From here, through the rest of the book, we will\
    \ not be using the `root` user id.\n\nLet’s take a look at a few settings and\
    \ see how our server is performing.\n\nFirst, we can take a look at our system\
    \ uptime. This can be very useful in system administration. It lets you know how\
    \ long the server has been online, how many users logged in, and the average system\
    \ load.\n\n| Checking Uptime |\n| :--- | :--- |\n| Command | `uptime` |\n| Result\
    \ | System will display the uptime and load average data |\n| CLI Display | `[tidus@centos:~]$\
    \ uptime` |\n\nNext we can see what processes are using the most memory on our\
    \ system by using the `top` command. This can be useful if your system is running\
    \ sluggish to see what is hogging the system resources.\n\nThe first few lines\
    \ will give you a summary of the resource utilization on your system and you can\
    \ sort the list of processes by CPU or memory use, which allows you to quickly\
    \ see where your server is receiving the biggest demands on its resources.\n\n\
    | Checking System CPU Usage |\n| :--- | :--- |\n| Command | `top` |\n| Result\
    \ | System will display processes using the most CPU resources |\n| CLI Display\
    \ | `[tidus@centos:~]$ top` |\n\nTo exit `top`, press `control and c`.\n\nTo check\
    \ the systems memory resources, we can use the `vmstat` command.\n\n| Checking\
    \ Memory Usage |\n| :--- | :--- |\n| Command | `vmstat` |\n| Result | System will\
    \ display the amount of memory free and in use |\n| CLI Display | `[tidus@centos:~]$\
    \ vmstat` |\n\nBetween `vmstat` and `top` as you become more skilled, you will\
    \ be able to determine, which scripts or programs are maxing system resources\
    \ if there is a problem. It is a good habit to keep an eye on these to just make\
    \ sure usage is where it should be.\n\nIn a larger environment, you may want to\
    \ see what users are logged into the server. Using the `w` command provides us\
    \ with this information.\n\n| Checking Memory Usage |\n| :--- | :--- |\n| Command\
    \ | `w` |\n| Result | System will display the users on the server |\n| CLI Display\
    \ | `[tidus@centos:~]# w` |\n\n## Navigating, Making Directories, and Files\n\n\
    Some of this is going to recap earlier chapters, but this repetition is important\
    \ to remembering the commands that you will be using frequently in daily usage.\n\
    \nNow that we have logged in, use the `pwd` command to see our current directory.\n\
    \n| Find Your Current Directory Location |\n| :--- | :--- |\n| Command | `pwd`\
    \ |\n| Result | System will output the directory that you are in. |\n| CLI Display\
    \ | `[tidus@centos:~]$ pwd/home/tidus` |\n\nNotice that our directory this time\
    \ is different than it was when we logged in with the `root` user. Last time we\
    \ were at `/root`, which was the home directory for root. This time we are at\
    \ `/home/tidus`, which is the home directory for the user `tidus`.\n\nTip: If\
    \ you ever need to get back to your home directory use `cd`, to get back to your\
    \ users home folder.\n\nNow that we are in our home folder, let’s make a new directory\
    \ called `documents`.\n\n| Making a New Directory |\n| :--- | :--- |\n| Command\
    \ | `mkdir documents` |\n| Result | System will create a child directory called\
    \ documents |\n| CLI Display | `[tidus@centos:~]$ mkdir documents[tidus@centos:~]$`\
    \ |\n\nUse the `ls` command to list the contents of our home directory and see\
    \ if the directory `documents` is there.\n\n| List Files |\n| :--- | :--- |\n\
    | Command | `ls` |\n| Result | Lists the files in the current directory |\n| CLI\
    \ Display | `[tidus@centos:~]# lsdocuments` |\n\nFrom using `ls`, we now see that\
    \ our directory is empty outside of the directory `documents`.\n\nLet’s use what\
    \ we have learned from the previous chapters to practice our navigation skills\
    \ and go into the documents directory.\n\nTry using the command: `cd Documents`\n\
    \nYou may notice that it returns, “cd: Documents: No such file or directory.”\
    \ Linux is case sensitive, which means that `Documents` and `documents` are two\
    \ separate things. You will want to keep that in mind as you use CentOS, since\
    \ using the correct case matters.\n\nNow let’s do it the right way.\n\n| Change\
    \ to a Child Directory |\n| :--- | :--- |\n| Command | `cd documents` |\n| Result\
    \ | Changes to the documents directory |\n| CLI Display | `[tidus@centos:~]$ cd\
    \ documents[tidus@centos: documents]$` |\n\nUse the `ls` command to list the files\
    \ in the directory, you’ll notice that it is empty.\n\nNow let’s go back home\
    \ by using, `cd`.\n\n| Change to User Home Directory |\n| :--- | :--- |\n| Command\
    \ | `cd` |\n| Result | Changes to user’s home directory |\n| CLI Display | `[tidus@centos:\
    \ documents]$ cd[tidus@centos:~]$` |\n\nIf we use `pwd` we will find that we are\
    \ back at, `/home/tidus`.\n\nNow, use `cd` with the full path to the documents\
    \ directory. Remember, that Linux is case sensitive.\n\n| Change Directory Using\
    \ a Full Path |\n| :--- | :--- |\n| Command | `cd /home/tidus/documents` |\n|\
    \ Result | Changes to specified directory |\n| CLI Display | `[tidus@centos:~]$\
    \ cd /home/tidus/documents[tidus@centos: documents]$` |\n\nIf we wanted to get\
    \ the parent directory of this folder we can also use: `cd ..`\n\n| Move Up A\
    \ Directory |\n| :--- | :--- |\n| Command | `cd ..` |\n| Result | System moves\
    \ us to parent folder |\n| CLI Display | `[tidus@centos: documents]$ cd ..[tidus@centos:~]$`\
    \ |\n\nYou should be getting the hang of it now!\n\nExperiment some more and in\
    \ the next section we will create some files using the built in editor, nano.\n\
    \n### Creating and Editing Files With Nano\n\nNano is a useful text editor for\
    \ the command line interface (CLI) in Linux systems. Since we are using the CLI,\
    \ nano is keyboard oriented with control keys, rather than using a mouse. By learning\
    \ some of the control keys, you will be able to quickly edit files the nano editor.\
    \ Once you pick this up and learn more about using Linux by the command line you\
    \ can then move onto more advanced editors like vi, which are great, but often\
    \ have a steeper learning curve.\n\nNano is easy to use and great for beginners.\
    \ It is often installed by default in most VPS configurations of CentOS, but on\
    \ a Virtual Machine you may need to install it. It’s a WYSIWYG editor; “what you\
    \ see is what you get.”\n\nWe will talk about installing packages to CentOS more\
    \ in a later chapter, but in case you do not have nano, you can install it by\
    \ using the command and then typing your password when prompted: `sudo yum install\
    \ nano`\n\nThe CLI may also ask you for permission. If it does, press `y` and\
    \ then enter.\n\nAgain, we will discuss installing packages in more detail later,\
    \ but that command, if you don’t already have nano, will install it to your server.\n\
    \nLet’s go ahead and create a file using nano.\n\n| Creating a file in nano |\n\
    | :--- | :--- |\n| Command | `nano notes.txt` |\n| Result | System launches nano\
    \ for new file notes.txt |\n| CLI Display | `[tidus@centos:~]$ nano notes.txt`\
    \ |\n"
  raw: "Before we move on, we can learn two quick commands.  Right now there is probably\
    \ a lot of text on your CLI.  If you want to clean that up, we can use the clear\
    \ command.\n\n| Clearing the Screen |\n\n| Command | clear |\n\n| Result | System\
    \ will clear the screen |\n\n| CLI Display | [root@centos:/]# clear |\n\nNow that\
    \ we have a clear screen we can close out of PuTTY if you are using a VPS.  If\
    \ you are using a Virtual Machine type logout.  We are going to continue on our\
    \ new user id, tidus.\n\n| Logging Out |\n\n| Command | logout |\n\n| Result |\
    \ System will close SSH session and exit PuTTY or logout of a Virtual Machine\
    \ |\n\n| CLI Display | [root@centos:/]# logout |\n\n## \n\nQuick Recap\n\n1) We\
    \ should avoid using the ‘root’ user as a good usage practice.\n\n2) sudo before\
    \ a command, allows a user to have super user privileges. \n\n3) We can add a\
    \ user by using the command adduser, with the username afterwards.\n\n1.  1. \
    \ Example: adduser nathan\n\n4) We can change a user’s password by using the passwd\
    \ command before their name.\n\n1.  1.  Example: passwd nathan\n\n5) To have access\
    \ to use sudo, a user must first be added to the configuration file, which can\
    \ be edited by using the visudo command.\n\n6) If our CLI gets too cluttered,\
    \ we can clear it by using the clear command.\n\n7) To end our session and sign\
    \ out, we can use logout.\n\n# Chapter 7\n\n## System Status at a Glance\n\nLog\
    \ into your server, with the new user that we created in the last chapter.  From\
    \ here, through the rest of the book, we will not be using the root user id. \n\
    \nLet’s take a look at a few settings and see how our server is preforming.\n\n\
    First, we can take a look at our system uptime.  This can be very useful in system\
    \ administration.  It lets you know how long the server has been online, how many\
    \ users logged in, and the average system load.\n\n| Checking Uptime |\n\n| Command\
    \ | uptime |\n\n| Result | System will display the uptime and load average data\
    \ |\n\n| CLI Display | [tidus@centos:~]$ uptime |\n\nNext we can see what processes\
    \ are using the most memory on our system by using the top command. This can be\
    \ useful if your system is running sluggish to see what is hogging the system\
    \ resources.\n\nThe first few lines will give you a summary of the resource utilization\
    \ on your system and you can sort the list of processes by CPU or memory use,\
    \ which allows you to quickly see where your server is receiving the biggest demands\
    \ on its resources.\n\n| Checking System CPU Usage |\n\n| Command | top |\n\n\
    | Result | System will display processes using the most CPU resources |\n\n| CLI\
    \ Display | [tidus@centos:~]$ top |\n\nTo exit top, press control and c.\n\nTo\
    \ check the systems memory resources, we can use the vmstat command.\n\n| Checking\
    \ Memory Usage |\n\n| Command | vmstat |\n\n| Result | System will display the\
    \ amount of memory free and in use |\n\n| CLI Display | [tidus@centos:~]$ vmstat\
    \ |\n\nBetween vmstat and top  as you become more skilled, you will be able to\
    \ determine, which scripts or programs are maxing system resources if there is\
    \ a problem.  It is a good habit to keep an eye on these to just make sure usage\
    \ is where it should be.\n\nIn a larger environment, you may want to see what\
    \ users are logged into the server.  Using the w command provides us with this\
    \ information.\n\n| Checking Memory Usage |\n\n| Command | w |\n\n| Result | System\
    \ will display the users on the server |\n\n| CLI Display | [tidus@centos:~]#\
    \ w |\n\n## Navigating, Making Directories, and Files\n\nSome of this is going\
    \ to recap earlier chapters, but this repetition is important to remembering the\
    \ commands that you will be using frequently in daily usage. \n\nNow that we have\
    \ logged in, use the pwd command to see our current directory.\n\n| Find Your\
    \ Current Directory Location |\n\n| Command | pwd |\n\n| Result | System will\
    \ output the directory that you are in. |\n\n| CLI Display | [tidus@centos:~]$\
    \ pwd/home/tidus |\n\nNotice that our directory this time is different than it\
    \ was when we logged in with the root user.  Last time we were at /root, which\
    \ was the home directory for root.  This time we are at /home/tidus, which is\
    \ the home directory for the user tidus.\n\nTip: If you ever need to get back\
    \ to your home directory use cd, to get back to your users home folder.\n\nNow\
    \ that we are in our home folder, let’s make a new directory called ‘documents’.\n\
    \n| Making a New Directory |\n\n| Command | mkdir documents |\n\n| Result | System\
    \ will create a child directory called documents |\n\n| CLI Display | [tidus@centos:~]$\
    \ mkdir documents[tidus@centos:~]$ |\n\nUse the ls command to list the contents\
    \ of our home directory and see if the directory ‘documents’ is there.\n\n| List\
    \ Files |\n\n| Command | ls |\n\n| Result | Lists the files in the current directory\
    \ |\n\n| CLI Display | [tidus@centos:~]# lsdocuments |\n\nFrom using ls, we now\
    \ see that our directory is empty outside of the directory ‘documents’.\n\nLet’s\
    \ use what we have learned from the previous chapters to practice our navigation\
    \ skills and go into the documents directory.\n\nTry using the command: cd Documents\n\
    \nYou may notice that it returns, “cd: Documents: No such file or directory.” \
    \ Linux is case sensitive, which means that ‘Documents’ and ‘documents’ are two\
    \ separate things.  You will want to keep that in mind as you use CentOS, since\
    \ using the correct case matters.\n\nNow let’s do it the right way.\n\n| Change\
    \ to a Child Directory |\n\n| Command | cd documents |\n\n| Result | Changes to\
    \ the documents directory |\n\n| CLI Display | [tidus@centos:~]$ cd documents[tidus@centos:\
    \ documents]$ |\n\nUse the ls command to list the files in the directory, you’ll\
    \ notice that it is empty.\n\nNow let’s go back home by using, cd.\n\n| Change\
    \ to User Home Directory |\n\n| Command | cd |\n\n| Result | Changes to user’s\
    \ home directory |\n\n| CLI Display | [tidus@centos: documents]$ cd[tidus@centos:~]$\
    \ |\n\nIf we use pwd we will find that we are back at, /home/tidus.\n\nNow, use\
    \ cd with the full path to the documents directory.  Remember, that Linux is case\
    \ sensitive.\n\n| Change Directory Using a Full Path |\n\n| Command | cd /home/tidus/documents\
    \ |\n\n| Result | Changes to specified directory |\n\n| CLI | [tidus@centos:~]$\
    \ cd /home/tidus/documents[tidus@centos: documents]$ |\n\nIf we wanted to get\
    \ the parent directory of this folder we can also use: cd ..\n\n| Move Up A Directory\
    \ Level |\n\n| Command | cd .. |\n\n| Result | System moves us to the parent folder\
    \ |\n\n| CLI Display | [tidus@centos: documents]$ cd ..[tidus@centos:~]$ |\n\n\
    You should be getting the hang of it now!\n\nExperiment some more and in the next\
    \ section we will create some files using the built in text editor, nano.\n\n\
    ### Creating and Editing Files With Nano\n\nNano is a useful text editor for the\
    \ command line interface (CLI) in Linux systems.  Since we are using the CLI,\
    \ nano is keyboard oriented with control keys, rather than using a mouse.  By\
    \ learning some of the control keys, you will be able to quickly edit files from\
    \ the nano editor.  Once you pick this up and learn more about using Linux by\
    \ the command line you can then move onto more advanced editors like vi and, which\
    \ are great, but often have a steeper learning curve.\n\nNano is easy to use and\
    \ great for beginners.  It is often installed by default in most VPS configurations\
    \ of CentOS, but on a Virtual Machine you may need to install it. It’s a WYSIWYG\
    \ editor; “what you see is what you get.”\n\nWe will talk about installing packages\
    \ to CentOS more in a later chapter, but in case you do not have nano, you can\
    \ install it by using the command and then typing your password when prompted:\
    \ sudo yum install nano\n\nThe CLI may also ask you for permission.  If it does,\
    \ press y and then enter.\n\nAgain, we will discuss installing packages in more\
    \ detail later, but that command, if you don’t already have nano, will install\
    \ it to your server.\n\nLet’s go ahead and create a file using nano.\n\n| Creating\
    \ a file in nano |\n\n| Command | nano notes.txt |\n\n| Result | System launches\
    \ nano for new file notes.txt |\n\n| CLI Display | [tidus@centos:~]$ nano notes.txt\
    \ |"
