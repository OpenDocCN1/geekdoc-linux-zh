  trans: "\n\n# 2. 使用虚拟化软件安装操作系统\n# 3. 将操作系统安装到计算机上\n# 4. 为你的现有电脑设置双启动\n\n我们将在书中探索这些选项中的前两个。当我开始写关于\
    \ Linux 的书籍时，我的第一本书之一是：`Learning Ubuntu`。这本书被评誉为学习 Ubuntu 和在该环境下管理 Linux 的顶尖书籍之一，但我确实收到过一次批评。一些人不喜欢我建议使用一种需要付费的服务（VPS），并希望有其他学习替代方案。我的座右铭是：知识是值得分享的，但将操作系统安装到机器上（尤其是你所赖以的机器）是有风险的。为了提供更详细的说明，我们将审查两个\
    \ VPS 服务，并介绍如何使用虚拟化软件（`Oracle VirtualBox`）在你的电脑上安装 `OS`。\n\n如果你想使用选项 3 或 4，你可以在\
    \ YouTube 上找到很多教程可以参考。如果你是该领域的新学者，我强烈建议不要尝试自己动手安装，并建议你先熟悉书中概述的其他选项。选项 1 和 2 是快速上手最安全且最有效的方法。\n\
    \n在讨论这些入门方法之前，让我们先过一下书中将使用的 `CentOS` 版本。虽然这本书适用于其他版本的 `CentOS`，但它最适合 `CentOS 7`。`CentOS`\
    \ 变得流行的主要原因之一是他们的操作系统自发布起提供十支持，而许多其他系统只有五年的支持周期。`CentOS 7` 于 2014 年发布，支持将到 2024\
    \ 年。许多人并没有意识到操作系统的支持是有期限的。\n\n一旦支持过期，可能无法获得相应的安全补丁和其他升级。\n\n在我的书籍 [Securing Business\
    \ Data: Establishing a Core Value for Data Security](http://www.amazon.com/gp/product/B016PMLIW0)\
    \ 中，我们更深入地讨论了操作系统支持问题。如果你从事技术工作或管理业务，我强烈建议你阅读它。\n\n`CentOS` 几乎所有的 VPS 提供商都支持。`VPS`\
    \ 代表 `Virtual Private Server`（虚拟专用服务器）。`Virtual Private Server` 是一种作为托管服务出售的机器，通常比购买服务器及其带宽要便宜得多。随着云服务的普及，许多企业现在运行更多的虚拟专用服务器以节省成本并更快速地扩展。通过\
    \ `VPS`，你为你实际使用的部分付费，如果你发现需要更多处理能力或内存，可以随着时间的推移增加更多资源。\n\n## 快速回顾\n\n1. 操作系统是计算机中的主程序，控制计算机的工作方式，使其他程序能够运行。\n\
    \   1. `Microsoft Windows`、`Mac OSX` 和 `Linux` 是操作系统的示例。\n2. 开源意味着软件提供源代码，并免费分发和修改。\n\
    3. `distro` 或 `distribution`（发行版）是以 `Linux` 内核为基础的 `Linux` 版本。\n4. `Virtual Private\
    \ Server` 是作为托管服务出售的机器，通常比购买服务器及其带宽要便宜得多。\n5. 建议你实验 `CentOS` 的方法是搭建 `VPS`。\n \
    \  1. 本书的重点是使用 `DigitalOcean` 或 `Linode` 作为主机，但也可以选择其他提供商。\n\n# 第 2 章\n\n## 在\
    \ VPS 上安装 CentOS\n\n在书的这一部分，我们将介绍使用 `Virtual Private Server` 的安装方法。\n\n`VPS` 是由互联网托管服务作为服务出售的虚拟机。它运行自己的\
    \ `OS`，并向客户提供操作系统的超级用户权限。这允许用户为他们的操作系统安装和管理他们想要的几乎任何内容。\n\n`VPS` 的其他几个优点是你可以从任何地方访问它。它托管在云端，如果你想用\
    \ `CentOS` 托管网站，它提供了一个极佳的入门方式，不需要你自己的高带宽和合适的硬件。个人而言，这是我用于网站的方式。它比购买用于快速网页体验的互联网连接以及在家里运行稳定服务器的硬件要便宜得多。\n\
    \n在本节中，我们将介绍如何开始两个 VPS 提供商：`Linode` 和 `DigitalOcean`。它们各有自己的定价和服务方案，但两者都非常容易上手。\n\
    \n当你选择 `VPS` 提供商时，有几点需要考虑。由于你正处于入门和学习阶段，如果你选择这种方法，价格可能是你决策的主要因素。在 `Linode` 上，他们提供一台\
    \ `1GB` 内存、`1CPU`、`24GB` 存储和 `2 TB` 流量的服务器，每月 10 美。`DigitalOcean` 有一个入门套餐，包含 `512MB`\
    \ 内存、`1 CPU`、`20GB` 存储和 `1 TB` 流量，每月 5 美元。选择取决于你。`DigitalOcean` 也有一个 10 美元的计划，与\
    \ `Linode` 的入门计划类似。\n\n## 在 Linode 上设置 CentOS\n\n开始使用 `Virtual Private Server`\
    \ 或 `VPS` 非常简单。你只需要一张信用卡和这本书！你可以在几分钟内让你的服务器上线运行。\n\n首先，你需要访问：`[`www.linode.com/`](https://www.linode.com/)`\n\
    \n从那里你可以注册并选择你喜欢的计划。对我来说，制作此指南的目的是启动小型电子商务网站，所以我将从 10 美元的计划开始。\n\n![](img/00001.jpeg)\n\
    \n选择计划后，你需要选择你想要使用的数据中心。我的建议是选择一个离你所在地最近的。\n\n![](img/00002.jpeg)\n\n我位于宾法尼亚州，所以新泽西州的\
    \ Newark 是最近的数据中心。我选择了它，然后点击“Add this Linode”（添加此 Linode）。\n\n完成此操作后，你将进入 `Linode\
    \ Manager`。这是你可以管理所有 `VPS` 系统的地方（如果你有多个的话）。\n\n![](img/00003.jpeg)\n\n上面的图片可能很难看清，但在这里我们可以看到我们\
    \ `Linode` 的状态、我们正在使用的 `Plan` 以及我们的 `IP address`。那个 `IP address` 数字将是我们用来连接服务器并最终连接我们域名的地址。它非常重要，所以把它记录下来可能不是坏主意。\n\
    \n现在，服务器是空的，没有操作系统。我们需要在上面安装我们想要使用的 `OS`，在这里是 `CentOS 7`。\n\n点击你的 `Linode` 名称。你的显示的看起来会像那样。\n\
    \n当你点击名称时，你会发现它看起来相当空。同样，是因为我们需要安装 `OS`。`VPS` 提供商让这变得非常简单。在 `Linode` 上，我们只需要点击部署链接（deploy）。\n\
    \n![](img/00004.jpeg)\n\n点击“Deploy an Image”（部署镜像）。\n\n从这个窗口，我们可以选择我们需要的 `Image`，即\
    \ `CentOS 7`。部署磁盘大小和交换磁盘目前保持默认设置即可。输入你想要为 `root` 设置的密码（稍后会详细讨论），并确保这是一个安全的密码。完成所有这些后，点击“Deploy”（部署）按钮。\n\
    \n![](img/00005.jpeg)\n\n一旦你点击“Deploy”，系统将开始安装。留几分钟让其完成，但现在你的安装工作已经完成了！如果你选择使用\
    \ Linode，可以跳过下一节关于替代方案 `DigitalOcean` 的内容。\n\n## 在 Digital Ocean 上设置 CentOS\n\n\
    像 `Linode` 一样，`DigitalOcean` 也提供了一个快速开始并部署 `CentOS` 安装的流程。如果你已经决定为任何提供商支付 `VPS`\
    \ 的月费，我认为你做了正确的决定。我喜欢使用 `VPS` 的一点是它不占用我机器的硬件，我可以在任何有连接的地方对它进行操作。\n\n"
- fmt: '

    Let’s go ahead and get our server setup with DigitalOcean in just a few minutes.


    First, go to [https://www.digitalocean.com/](https://www.digitalocean.com/) and
    click on ‘Sign Up’ in the top right. From there, enter an email address and password
    that you want to use for your account. Then click ‘Sign Up’.


    ![2016-02-07_21h53_56](images/00006.jpeg)


    Now we need to confirm our email address. Open your email and find the email from
    DigitalOcean. It will be titled “DigitalOcean – Please confirm your email address.”
    Open the email and proceed to click on the verification link.


    Great, now that our email is confirmed, we need to select a payment option. DigitalOcean
    gives you the option of using a credit card or PayPal. For me, I use PayPal for
    convenience.


    If you use PayPal, you have to prepay $5, which is credited to your account. This
    will cover our first month!


    Once you have added your payment method, we can create our VPS, what DigitalOcean
    calls a Droplet. In the top right, click on the green ‘Create Droplet’ button.


    ![2016-02-07_22h01_21](images/00007.jpeg)


    Next, it will ask you to select a distribution. We want to select `CentOS` and
    the most recent edition they offer, which is `7.2`.


    ![](images/00008.jpeg)


    Once you have selected `CentOS`, scroll down to select the size of server you
    want to deploy. They have the $20 per month plan selected as the default. Just
    click on the $5 per month plan, if that is the size you would like to use to get
    started.


    ![](images/00009.jpeg)


    I recommend selecting a region based on your location. Since I am in the USA on
    the east coast, New York is my pick for this provider.


    ![](images/00010.jpeg)


    Under the additional options, it is up to you if you would like a backup. If we
    were doing development or anything outside of training and testing, I would recommend
    selecting the backup option, but since we just want the basics for now to learn,
    I am going to leave these options unchecked.


    ![2016-02-07_22h07_31(1)](images/00011.jpeg)


    From there, scroll down to the bottom and click the big green ‘Create’ button.


    ![](images/00012.jpeg)


    Then in a matter of a few seconds, your system is setup and ready. DigitalOcean
    will then email you the IP address, username, and password for your server. Keep
    this information handy. We will need the IP address and login information shortly.


    # Chapter 3 Installing CentOS onto a Virtual Machine


    If you do not wish to use a VPS yet and want to work locally with your testing,
    then the next best choice is to use a Virtual Environment. Many of them are on
    the market. I would recommend this for two reasons. It is less risky than installing
    on a machine you use and if you have a fairly decent computer, it doesn’t really
    cost anything to get started. Assuming that you are a beginner and just getting
    started, we will start from scratch and install the virtualization software first.
    Oracle’s `VirtualBox`, which is the program we will use for this tutorial, is
    open source and free.


    ## Installing Oracle VirtualBox


    In this demo, I will be using a x64 Windows 10 computer.


    To install `VirtualBox` go to: [https://www.virtualbox.org/wiki/Downloads](https://www.virtualbox.org/wiki/Downloads)


    From there select which version best fits your system. For me using a Windows
    10 x64 machine, I am going to download `VirtualBox 5.0.20` for Windows hosts.


    ![](images/00013.jpeg)


    When you click the link to download and are prompted, click Save File. Once it
    has downloaded, click the executable to start the installation.


    ![](images/00014.jpeg)


    When prompted click ‘Next’.


    ![](images/00015.jpeg)


    Leave the settings as the default and click ‘Next’ again.


    ![](images/00016.jpeg)


    If you want the shortcuts, which can be useful, leave the default settings and
    click ‘Next’ once more. Now we are done clicking ‘Next’.


    ![](images/00017.jpeg)The following prompt, will alert you that installing the
    Oracle Virtual Box Networking feature will reset your network connection and temporarily
    disconnect you from the internet. This is ok and you can click ‘Yes’ to continue.


    Once you have clicked ‘Yes’, you will be at the final installation prompt as depicted
    below. Click the default ‘Install’ button.


    ![](images/00018.jpeg)


    Now we wait. It isn’t as long as the wait for winter to come in the popular book
    and television series Game of Thrones, but it will take a few moments.


    As the installer proceeds, you may need to click ‘Yes’ or ‘Install’ another time
    or two. When it is completed you will see a completion screen. Click on ‘Finish’
    and it will launch `VirtualBox`.


    ## Getting The ISO


    To either install `CentOS` using `VirtualBox` or to set it up using `VirtualBox`,
    we need to select the size of server you want to deploy.


    Once you have selected `CentOS`, scroll down to select the size of server you
    want to deploy. They have the $20 per month plan selected as the default. Just
    click on the $5 per month plan, if that is the size you would like to use to get
    started.


    To either install `CentOS` using `VirtualBox` or to set it up using `VirtualBox`,
    we need to select the size of server you want to deploy.


    Once you have selected `CentOS`, scroll down to select the size of server you
    want to deploy. They have the $20 per month plan selected as the default. Just
    click on the $5 per month plan, if that is the size you would like to use to get
    started.


    To either install `CentOS` using `VirtualBox` or to set it up using `VirtualBox`,
    we need to select the size of server you want to deploy.


    Once you have selected `CentOS`, scroll down to select the size of server you
    want to deploy. They have the $20 per month plan selected as the default. Just
    click on the $5 per month plan, if that is the size you would like to use to get
    started.


    To either install `CentOS` using `VirtualBox` or to set it up using `VirtualBox`,
    we need to select the size of server you want to deploy.


    Once you have selected `CentOS`, scroll down to select the size of server you
    want to deploy. They have the $20 per month plan selected as the default. Just
