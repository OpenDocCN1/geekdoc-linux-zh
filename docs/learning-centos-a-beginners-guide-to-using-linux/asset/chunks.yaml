- fmt: "\n| CLI Display | `[root@centos:~]# passwd`Changing password for user root.New\
    \ password:Retype new password:passwd: password updated successfully |\n\nWhen\
    \ it prompts you for the new password, enter it and do not be concerned that the\
    \ password does not appear on the screen. Once you have finished, press enter\
    \ and type it one more time.\n\n## Navigation\n\nDo not be intimidated by the\
    \ white text and black background on the CLI. I know that there is no mouse or\
    \ graphics, but after a short while, you will be comfortable navigating through\
    \ the directories on your server. Directory is like a folder that you may have\
    \ used on a Windows or Mac device. As a person who has used this for a long time,\
    \ I actually prefer this to having a graphical user interface. Before we do anything\
    \ else, let’s learn to explore the server. By using the `pwd` command, we can\
    \ see the location of the directory that we are currently viewing.\n\n| Find Your\
    \ Current Directory Location |\n| Command | `pwd` |\n| Result | System will output\
    \ the directory that you are in. |\n| CLI Display | `[root@centos:~]# pwd/root`\
    \ |\n\nRight now we are in a directory named `root`, which is essentially the\
    \ home directory of the user `root`. There is big difference between this root\
    \ home directory and the actual root of the system.\n\nThe path `/` is the root\
    \ of the system, but right now we are in a subdirectory that is named `root` (`/root`).\n\
    \nThe root of the server is the top directory. Everything is a subdirectory inside\
    \ of it. From our current location, there are two ways we can go there. Let’s\
    \ start with the easiest command that will always get us to root.\n\n| Go To The\
    \ Root Directory (/) |\n| Command | `cd /` |\n| Result | We change to the main\
    \ root directory |\n| CLI Display | `[root@centos:~]# cd /[root@centos:/]#` |\n\
    \nNow let’s use, `pwd` again to see where we are at.\n\n| Find Your Current Directory\
    \ Location |\n| Command | `pwd` |\n| Result | System will output the directory\
    \ that you are in. |\n| CLI Display | `[root@centos:~]# pwd/` |\n\nIf you want\
    \ to see what is in the folder, we can use the `ls` command.\n\n| List Files |\n\
    | Command | `ls` |\n| Result | Lists the files in the current directory |\n| CLI\
    \ Display | `[root@centos:/]# lsbin dev home media opt root sbin sysvar boot etc\
    \ lib mnt proc run srv tmp var` |\n\nWe can also go into more detail by adding\
    \ a flag after `ls`.\n\nA flag is typed at the prompt as part of our command and\
    \ adds additional parameters to tell the system what we want.\n\nTry running this\
    \ command: `ls –la`\n\nIn that example, –la` is the flag. The `l` tells the system\
    \ that we want to see more details and a lists all the files in the directory,\
    \ even the hidden ones.\n\nNow, let’s change to the directory named `home`.\n\n\
    | Change Directory |\n| Command | `cd home` |\n| Result | System moves us to child\
    \ folder home |\n| CLI Display | `[root@centos:/]# cd home[root@centos: home]#`\
    \ |\n\nNote: It is important to understand the difference between parent and child\
    \ directories. If we have a directory called `documents` and another inside of\
    \ it called `pictures`. `pictures` would be a child directory of `documents`.\
    \ In this instance we were in the parent directory `/` and changed it to the child\
    \ directory `/home`. If you were not in the parent folder, you could still navigate\
    \ to `home`, but after `cd` you would have to list the full path (example: `cd\
    \ /home`) instead. If you get an error such as “No such file or directory”, you\
    \ may need to enter the full path, since you may not be in the right directory.\n\
    \nIf we want to go back to the root directory we can use another change directory\
    \ command which makes going up a directory easy.\n\n| Move Up A Directory |\n\
    | Command | `cd ..` |\n| Result | System moves us to the parent folder |\n| CLI\
    \ Display | `[root@centos: home]# cd ..[root@centos:/]#` |\n\nUsing `cd` along\
    \ with the directory names and `..` can allow us to quickly move throughout server.\n\
    \n## Quick Recap\n\n1. `CLI` stands for command line interface, where you can\
    \ interact with the system by entering lines of text.\n2. `SSH` stands for Secure\
    \ Shell, which is an encrypted way that we can login to our server.\n3. An `IP\
    \ Address` is a string of numbers that identifies a computer on a network.\n4.\
    \ `PuTTY` is a free SSH client that is open source and supported on Windows.\n\
    5. The `passwd` command allows us to change current password.\n6. Entering `pwd`\
    \ will provide us with current location in the server’s directories.\n7. Using\
    \ `ls` will list the files and directories in current directory.\n8. Adding a\
    \ flag, such as –la`, after `ls`, provides us with more details and shows hidden\
    \ files.\n9. We can use `cd` to change directories:\n   - We can move up a folder\
    \ with `cd ..`.\n   - Putting a child directory after `cd` will put us in the\
    \ directory (Example: `cd home`).\n10. The path `/` is the root of the system,\
    \ but `/root` is a child or sub directory.\n\n## Chapter 6: Creating a New User\n\
    \nThe user `root` has full access to the system. While we used it to learn some\
    \ navigation, we should not use it as our main username for the system. It defeats\
    \ the security model that is great and makes Linux systems secure. By not using\
    \ `root`, it also prevents typo errors that could result in disasters. What we\
    \ will do in our next command is create a new user named `tidus`, and then we\
    \ will provide him with `sudo`.\n\n`sudo` before a command will allow our user\
    \ `tidus` to be able to elevate to higher privileges to install software and make\
    \ changes. `sudo` runs the command as a super user, even though the user `tidus`\
    \ would normally have limited access. This will come together soon when we dive\
    \ into it, but first we need to create `tidus` account.\n\n| Add a New User |\n\
    | Command | `adduser tidus` |\n| Result | System sets up user `tidus` |\n| CLI\
    \ Display | `[root@centos:/]# adduser tidus[root@centos:/]#` |\n\nOnce you run\
    \ that command, the system will add the user `tidus`. Next we need to set a password\
    \ for this new user. Earlier we learned how to change our password. If you are\
    \ `root` or a `sudo` user you can change a user’s password as well by following\
    \ the steps below.\n\n| Change a User’s Password |\n| Command | `passwd tidus`\
    \ |\n| Result | System will prompt for you to set a new password for user `tidus`.\
    \ |\n| CLI Display | `[root@centos:/]# passwd tidusNew password:Retype new password:passwd:\
    \ all updated successfully` |\n\nOk, so now that we have `tidus` setup, we still\
    \ need to grant him access to `sudo`. We would only do this for users that may\
    \ need to increase their security privileges. First we need to open the sudoer’s\
    \ configuration file to modify it. We can do this by using the `visudo` command.\n\
    \n| Giving a User Sudo Privileges |\n| Command | `visudo` |\n| Result | System\
    \ will open the sudoer’s file. |\n| CLI Display | `[root@centos:/]# visudo` |\n\
    \nThis file MUST be edited with the `visudo` command as root. Note: Arrow down\
    \ the document to allow root to run any commands: `root ALL=(ALL) ALL`.\n\nThere\
    \ is a lot of text in this file, but do not be intimidated. In the table above\
    \ I arrowed down till I found the highlighted: `root ALL=(ALL) ALL`.\n\nBelow\
    \ that selection we need to add the following:\n\n`tidus ALL=(ALL) ALL`\n\nIn\
    \ `visudo`, you are always in one of two modes: command or insert. Press `I` to\
    \ insert text and `ESC` to goto command mode.\n\nPress the down key until you\
    \ are in the blank space under `root`. Once there type press `I` and type `tidus`,\
    \ press tab, type `ALL=(ALL)`, press tab and type `ALL`. Now press the `ESC` key\
    \ and type `:w` and then press enter to save. Next type `:q` and press enter to\
    \ exit.\n\nNow you can breathe. I know we dived in deep a little fast, but it\
    \ is important that we start using a user id other than root. It is also important\
    \ that at the same time we can install software and learn more, so this was needed.\n"
