    # 第 1 章


    ## 什么是 Linux 和 CentOS？


    你可能熟悉微软 Windows 和苹果的 MacOS。这两者都是操作系统的例子，Linux 也是如此。


    韦尔-字典词典将操作系统定义为计算机中控制计算机工作方式并使其他程序能够运行的主要程序。本质上，操作系统是让用户与计算机交互的程序。在互联的世界里，如果没有操作系统，设备只是塑料、玻璃和硅的堆砌。


    Linux 是一个开源操作系统。开源意味着软件提供了原始代码，并可以免费分发和修改。这正是 Linux 的独特之处。


    如果你想为自己的作品集增加一项新技能，学习使用 Linux 将非常有用。根据 ZDNet 2014 年的数据，87% 的企业业务增加了一台 Linux 服务器，82%
    的企业计划在 2015 年增加。


    Linux 及其发行版在数据库、Web 以及其他类型的服务器非常流行。自 90 年代以来，Linux 运行着互联网、科学突破的超级计算机以及全球股市。观察互联网，Linux
    运行着超过 36% 的在线资源，其中 21% 是 CentOS 发行版。


    发行版（distro）是以 Linux 内核为基础的 Linux 版本或“口味”。内核是真正被称为 Linux 的组件。内核是操作系统的底层，管理 CPU、内存和设备的主要系统功能。


    1991 年，Linus Torvalds 的个人项目是创建一个新的免费操作系统内核。从那时起，内核在过去的 25 年里经历了不断的增长。它从少数的 C 语言文件增长到超过
    1800 万行代码，并根据 GNU 通用许可许可证开放。


    ## 安装 CentOS 7 的方法与快速入门


    你所需的工具取决于你选择的路线。有四种安装方法，你可以使用它们来实验书中的课程。


    ### 实验安装操作系统的方法


    1.  使用低廉的云虚拟专用服务器 (VPS)


