    Linux 服务器的一种常见配置是将其设定为 Web 服务器。80% 托管网站的服务器都在运行 Linux。为了建立良好的基础，学习如何安装这些功能至关重要。


    要开始将此服务器配置为 Web 服务器，我们需要安装 `Apache2`。`Apache2` 是 Linux 系统上最常用的 Web 服务器。Web 服务器用于为客户端请求的网页提供服务。要运行像
    WordPress 这样的网站软件，我们需要比这多多的包，但安装 `Apache2` 是最好的起点。


    ### 安装 Apache2


    | 项目 | 详情 |

    | :--- | :--- |

    | 命令 | `sudo yum install httpd` |

    | 结果 | 系统将向服务器安装 apache2 及其依赖包。 |

    | CLI 命令行显示 | `[tidus@centos:~]$ sudo yum install httpdpassword for tidus:Do you
    want to continue? [Y/n] y[tidus@centos:~]$` |


    现在，我们应该创建一个基础 HTML 文件来测试我们的 Web 服务器。在命令行中输入以下命令：


    ```bash

    sudo nano /var/www/html/index.html

    ```


    在 `nano` 内部输入：`<h1>It Works</h1>`


    然后按 `control` 和 `x`，然后按 `y` 保存并回车。


    `<h1>` 和 `</h1>` 如果你不熟悉，它是用于标题的 HTML 标签。它会让文本在页面顶部大号并加粗显示。


    在本书的后续章节，我们将介绍更改权限，但现在使用以下命令使测试 HTML 文件可视图：


    ```bash

    sudo chmod –R 755 /var/www/html/

    ```


    该命令正在递归地设置 html 文件夹的权限。关于这一点稍后会详细介绍。


    我们必须启动 `Apache2` 服务，以便 Web 服务运行并使页面可见。


    ### 启动 Apache2


    | 项目 | 详情 |

    | :--- | :--- |

    | 命令 | `sudo service httpd start` |

    | 结果 | 系统将启动 apache2 |

    | CLI 命令行显示 | `[tidus@centos:~]$ sudo service httpd startpassword for tidus:[tidus@centos:~]$`
    |


    你现在可以在任何浏览器中输入你的 IP 地址并看到我们的测试 HTML 文件。


    在浏览器中，你应该看到：It Works


    提醒，如果你使用的是虚拟机而不是 VPS，你将只能在主机计算机的浏览器上看到此内容。


    ### 停止和重启 Apache2


    可能会出现你想要停止或重启 `Apache2` Web 服务器的情况。


    你可以使用以下命令执行：


    - 停止 Apache2：`sudo service httpd stop`

    - 启动 Apache2：`sudo service httpd start`

    - 重启 Apache2：`sudo service httpd restart`


    默认情况下，你的 CentOS 服务器不会在启动机时启动 `Apache2`，如果发生断电，这可能会是一个问题。使用以下命令让它在开机时默认启动：


    ```bash

    sudo systemctl enable httpd.service

    ```


    ### Web 文件夹


    你可能在想，我的网站文件在哪里？在大多数 CentOS 安装中，你可以通过切换目录到 `/var/www/html` 进入 Web 目录。


    | 项目 | 详情 |

    | :--- | :--- |

    | 命令 | `cd /var/www/html; ls` |

    | 结果 | 系统将切换到 html 目录并列出文件。 |

    | CLI 命令行显示 | `[tidus@centos:~]$ cd /var/www/htmlindex.html` |


    如果你愿意，可以在 `nano` 中打开默认的 `index.html` 文件。


    | 项目 | 详情 |

    | :--- | :--- |

    | 命令 | `nano index.html` |

    | 结果 | 系统将 index.html 加载到 nano 中。 |


    注意：为了保存并进行更改，你可能需要使用 `sudo` 打开文件。


    现在让我们使用 `cd` 回到我们的主目录。


    ### 安装 MySQL/MariaDB 数据库


    除了 `Apache2` 和 `PHP` 之外，你的服务器许多需要存储数据的 Web 还需要 `MySQL`。这包括广泛流行的 WordPress CMS。最近，CentOS
    删除了 `MySQL` 并将 `MariaDB` 设置为默认数据库包。这也能为我们完成工作。


    ### 安装 MariaDB 服务器


    | 项目 | 详情 |

    | :--- | :--- |

    | 命令 | `sudo yum install mariadb-server` |

    | 结果 | 系统将安装 MariaDB 服务器 |


    和 `Apache2` 一样，我们需要输入一个命令让 `MariaDB` 在系统启动时启动。输入以下：


    ```bash

    sudo systemctl enable mariadb.service

    ```


    可能会出现你想要停止或重启 `MariaDB` 数据库的情况。


    你可以使用以下命令执行，这些与 `Apache2` 的命令类似：


    - 停止 MariaDB：`sudo service mariadb stop`

    - 启动 MariaDB：`sudo service mariadb start`

    - 重启 MariaDB：`sudo service mariadb restart`


    现在我们的数据库系统已经在运行了，我们需要运行一个安全脚本来移除一些可能危险的默认设置。


    ### 安全 MariaDB 服务器


    | 项目 | 详情 |

    | :--- | :--- |

    | 命令 | `sudo mysql_secure_installation` |

    | 结果 | 系统将提示你输入数据库服务器的当前密码。尚未设置，请按回车。然后按 Y 设置密码并按照屏幕指令操作。 |


    ### 安装 PHP5


    `PHP` 是一种流行的 Web 服务器端脚本语言。


    ### 安装 PHP


    | 项目 | 详情 |

    | :--- | :--- |

    | 命令 | `sudo yum install php` |

    | 结果 | 系统将安装 php 及其依赖包。 |

    | CLI 命令行显示 | `[tidus@centos:~]$ sudo yum install phppassword for tidus:Do you
    want to continue? [Y/n] y[tidus@centos:~]$` |


    为了让更改生效，我们需要重启 `Apache`。


    ```bash

    sudo service httpd restart

    ```

