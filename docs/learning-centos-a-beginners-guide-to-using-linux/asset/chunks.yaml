- fmt: '

    If your installation fails or appears to hang, it is likely that your system does
    not support running 64bit software virtually. I experienced that issue as I was
    testing for this book on an older PC.


    You can download the 32bit i386 versions from this link: [http://mirror.centos.org/altarch/7/isos/i386/](http://mirror.centos.org/altarch/7/isos/i386/)


    Once the installer successfully loads, you will need to select your language and
    location. Once you have done that click “Continue”.


    ![](images/00025.jpeg)


    Next you will see CentOS preconfigure a variety of settings.


    You may need to configure the “Installation Destination” that is under the system
    heading. Select “Installation Destination” and from that interface select the
    hard disk and click done as seen below.


    ![](images/00026.jpeg)


    Once that is complete and you are back at the main installation screen. Now we
    need to make sure that we can establish an internet connection. Click on “Network
    and Hostname”. Inside of this panel configure and make sure that “Automatically
    Connect When Network is Available” is checked. Once that is completed, click save.
    In the hostname box, enter the name for your server. I just called mine `centOS`.
    When that is completed turn the switch for the network adapter to on. It can be
    found right next to the network adapter. In the top left click, “Done”, which
    returns you to the home screen where you can click “Begin Installation” in the
    bottom right.


    ![](images/00027.jpeg)


    As CentOS is installing there are two things we can configure, the “Root Password”
    and “User Creation”. For now lets leave the user configuration the way it is and
    set the “Root Password”. Click on “Root Password”, enter the new password twice
    and then click done. Be sure to remember this password as we will need it later.


    ![](images/00028.jpeg)


    Once the installation is completed, you will need to click the “Reboot” button
    in the bottom right.


    ![](images/00029.jpeg)


    Now dismount the ISO image (if you don’t you’ll keep going through the install
    process) and shutdown the Virtual Machine.


    Now we need to do some additional configuration to the Virtual Machine so that
    it can have both internet access and you can view the system from the browser
    later in the book.


    With the Virtual Machine shutdown, click on “Settings”. In the settings panel,
    click Network on the left. You will see that Adapter 1 is configured and attached
    to NAT. Let that setting as it is. Click on Adapter 2 and then check the “Enable
    Network Adapter” checkbox. In the “Attached to” dropdown, select “Host-only Adapter”
    and then ok.


    Now click Start and once the boot is completed, you will see a command line prompt
    to login. We have finished the installation and initial configuration of CentOS.


    ![](images/00030.jpeg)


    Let’s login and find out our ip address so that we can continue as if we had a
    VPS, which at this point we kind of do, but it is only available internally.


    | Find Your IP Address |


    | Command | `ip addr` |

    | Result | System will display network information |


    After typing in `ip addr` and pressing enter, you will get a lot of information
    on the page. We are not concerned about the information after 1 (loopback connection),
    or 2, but under 3, there is an inet that may look similar to this: `192.168.1.50/24`.
    Your ip address would be `192.168.1.50`. All networks are different, but use that
    as a general guide.


    Be sure to write this IP down. Chances are it is dynamic and may change overtime.
    If you think it might have changed be sure to reference back to the Find Your
    IP Address box above.


    # Chapter 4


    # 60 Second Documentation Bootcamp


    In technology we live and die by the documentation that we produce. Imagine having
    a problem with a client’s system and not knowing what it is running and what the
    IPs or password is. That is a common problem. It is typically not safe to store
    passwords anywhere, but you must come up with a method of securely storing this
    information. When you deal with large numbers of IPs and passwords, it is impossible
    to remember them all. Below is a helpful documentation guide to help get you started.
    Since this is for learning CentOS and not production, writing the password down
    is probably ok. If you are reading this digitally, then create a sheet of your
    own to place this information.


    ### Example Data


    Server Name: CentOS

    Operating System: CentOS 7

    Supported Till: 2024

    Root Password: `*********`

    IP Address: 000.000.000.000

    Primary Purpose: Webserver

    Date Installed: 6/20/2016

    Last Date Updated: 6/20/2016


    ### My Documentation


    Server Name: ______________________________

    Operating System: CentOS 7

    Supported Till: 2024

    Root Password: _____________________________

    IP Address: ___________________________________

    Primary Purpose: Webserver

    Date Installed: ________________________________

    Last Date Updated: ___________________________


    # Chapter 5


    ## Getting to the CLI


    CLI stands for command line interface, where you can interact with the system
    by entering lines of text. This is how we interact with our server.


    If you decided not to use the recommended method of setting up a VPS, then you
    can see the CLI on your computers display. When you boot your computer, it will
    bring you to the CLI, where you can then login.


    We can connect to the CentOS server by using a protocol called `SSH`. `SSH` stands
    for Secure Shell, which is an encrypted way that we can remote login to our server.


    To prepare for the next steps, refer to the information that we documented in
    the last chapter as part of our documentation boot camp. We will need both the
    IP Address and login information. An IP Address, is a string of numbers that identifies
    a computer on a network. For our VPS, our IP Address is a public one, which can
    be accessed from anywhere with an internet connection. For a Virtual Machine,
    use the CLI interface that is displayed when you boot.


    The program I recommend to SSH into your VPS server is called `PuTTY`. `PuTTY`
    is a free `SSH` client that is open source and supported on Windows. You can download
    it from the following link: [http://putty.org](http://putty.org)


    The file you download is an executable (`.exe`) that does not require an install.
    Once you download it, you can drag it onto your desktop for quick access.


    Connecting to your VPS or Virtual Machine with this tool is very easy. Under Host
    Name or IP address, put the IP address that was provided. Select `SSH` as the
    connection type and then click open. See figure 1 for an example of what it should
    look like.


    Note: Your IP Address will be different than the one in the figure.


    Figure 1: Putty Configuration


    ![](images/00031.jpeg)


    When you hit connect, you may get a message like the one in Figure 2. Click Yes.


    Figure 2: PuTTY Security Alert


    ![C:\Users\Nathan\AppData\Local\Microsoft\Windows\INetCache\Content.Word\2016-02-08_19h51_40.png](images/00032.jpeg)


    ## Logging In for the First Time


    Now you will be prompted in for the first time. Enter the username `root`, then
    the password that was provided or set by you when setting up your VPS


    If you used DigitalOcean, their system requires a password reset the first time
    you log in. You will need to reenter the provided password and then the new one
    you wish to set twice. Make sure you follow secure password guidelines and set
    a secure password for the root user.


    Note: Throughout this book, I use tables to explain the different commands that
    we are going to learn. The first row is the task that we want to do, the second
    is the command we need to use, and the third is an example of what your CLI will
    look like. I think this is the best way to depict and explain the commands we
    are going to learn.


    If you were not prompted to change your password, but want to, you can enter the
    command `passwd`. See the table on the next page for more details.


    | Change My Password |


    | Command | `passwd` |

    | Result | System will prompt for new password |

