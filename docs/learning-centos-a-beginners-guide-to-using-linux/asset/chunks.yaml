  raw: 'Let’s go ahead and get our server setup with DigitalOcean in just a few minutes.


    First, go to [https://www.digitalocean.com/](https://www.digitalocean.com/) and
    click on ‘Sign Up’ in the top right. From there, enter an email address and password
    that you want to use for your account.  Then click ‘Sign Up’.


    ![2016-02-07_21h53_56](images/00006.jpeg)


    Now we need to confirm our email address.  Open your email and find the email
    from DigitalOcean.  It will be titled “DigitalOcean – Please confirm your email
    address.” Open the email and proceed to click on the verification link.


    Great, now that our email is confirmed, we need to select a payment option.  DigitalOcean
    gives you the option of using a credit card or PayPal. For me, I use PayPal for
    convenience.


    If you use PayPal, you have to prepay $5, which is credited to your account. 
    This will cover our first month!


    Once you have added your payment method, we can create our VPS, what DigitalOcean
    calls a Droplet.  In the top right, click on the green ‘Create Droplet’ button.


    ![2016-02-07_22h01_21](images/00007.jpeg)


    Next, it will ask you to select a distribution.  We want to select CentOS  and
    the most recent edition they offer, which is 7.2\.


    ![](images/00008.jpeg)


    Once you have selected CentOS, scroll down to select the size of server you want
    to deploy.  They have the $20 per month plan selected as the default.  Just click
    on the $5 per month plan, if that is the size you would like to use to get started.


    ![](images/00009.jpeg)


    I recommend selecting a region based on your location.  Since I am in the USA
    on the east coast, New York is my pick for this provider.


    ![](images/00010.jpeg)


    Under the additional options, it is up to you if you would like a backup.  If
    we were doing development or anything outside of training and testing, I would
    recommend selecting the backup option, but since we just want the basics for now
    to learn, I am going to leave these options unchecked.


    ![2016-02-07_22h07_31(1)](images/00011.jpeg)


    From there, scroll down to the bottom and click the big green ‘Create’ button.


    ![](images/00012.jpeg)


    Then in a matter of a few seconds, your system is setup and ready.  DigitalOcean
    will then email you the IP address, username, and password for your server.  Keep
    this information handy.  We will need the IP address and login information shortly.


    # Chapter 3


    # Installing CentOS onto a Virtual Machine


    If you do not wish to use a VPS yet and want to work locally with your testing,
    then the next best choice is to use a Virtual Environment.  Many of them are on
    the market.  I would recommend this for two reasons.  It is less risky than installing
    on a machine you use and if you have a fairly decent computer, it doesn’t really
    cost anything to get started. Assuming that you are a beginner and just getting
    started, we will start from scratch and install the virtualization software first. 
    Oracle’s VirtualBox, which is the program we will use for this tutorial, is open
    source and free. 


    ## Installing Oracle VirtualBox


    In this demo, I will be using a x64 Windows 10 computer. 


    To install VirtualBox go to: [https://www.virtualbox.org/wiki/Downloads](https://www.virtualbox.org/wiki/Downloads)


    From there select which version best fits your system.  For me using a Windows
    10 x64 machine, I am going to download VirtualBox 5.0.20 for Windows hosts.


    ![](images/00013.jpeg)


    When you click the link to download and are prompted, click Save File.  Once it
    has downloaded, click the executable to start the installation.


    ![](images/00014.jpeg)


    When prompted click ‘Next’.


    ![](images/00015.jpeg)


    Leave the settings as the default and click ‘Next’ again.


    ![](images/00016.jpeg)


    If you want the shortcuts, which can be useful, leave the default settings and
    click ‘Next’ once more. Now we are done clicking ‘Next’.


    ![](images/00017.jpeg)The following prompt, will alert you that installing the
    Oracle Virtual Box Networking feature will reset your network connection and temporarily
    disconnect you from the internet.  This is ok and you can click ‘Yes’ to continue.


    Once you have clicked ‘Yes’, you will be at the final installation prompt as depicted
    below.  Click the default ‘Install’ button.


    ![](images/00018.jpeg)


    Now we wait.  It isn’t as long as the wait for winter to come in the popular book
    and television series Game of Thrones, but it will take a few moments.


    As the installer proceeds, you may need to click ‘Yes’ or ‘Install’ another time
    or two.  When it is completed you will see a completion screen.  Click on ‘Finish’
    and it will launch VirtualBox.


    ## Getting The ISO


    To either install CentOS using VirtualBox or to set it up on your own, you will
    need to download the operating systems iso file.  An iso is the file extension
    used for files that can be burned to a CD or DVD, depending on the size.  Essentially
    it is an image of the installation disc that you will need to install CentOS.


    For us to install CentOS to VirtualBox, we do not need to burn the ISO to a DVD
    and can mount it inside of the virtual enviroment.  If you are looking to install
    it directly onto a machine or attempt a dual boot, then you will need to burn
    this file.


    To get the most recent ISO file for CentOS, go to [https://www.centos.org/](https://www.centos.org/)
    and click “Get CentOS”.  I personally downloaded the Minimal ISO and recommend
    that for you to get started using the system and the tutorials in this book.


    There are multiple locations or mirrors to download the iso from.  Choose one
    and download the CentOS 7 operating system ISO.


    Once you download the iso file, if you are not using VirtualBox,  you will need
    to burn it to a disc.  There are a variety of iso burning tools.  In the past,
    I have used [Ashampoo Burning Studio Free](https://www.ashampoo.com/en/usd/pin/7110/burning-software/burning-studio-free),
    with success.


    If you are going to use VirtualBox, then follow the steps to mount the ISO and
    setup your virtual machine in the next section.


    ## Configuring and Installing CentOS To Oracle VirtualBox


    Now that we have downloaded the ISO and have Oracle VirtualBox installed, we can
    setup our virtual enviroment.  Launch VirtualBox and click the “New” button so
    that we can configure a virtual machine to run CentOS.


    ![](images/00019.jpeg)


    Once you click “New”, we need to name the machine and provide some basic information. 
    See the image below as a guide.  Remember that CentOS is based on the Red Hat
    Enviroment.


    ![](images/00020.jpeg)


    Once that is completed, click “Next”.  The software will recommend the amound
    of memory to allocate to your virtual machine.  I would personally allocate 1GB
    of memory or 1024MB at a minimum.  When that is finalized, click next and then
    select “Create a Virtual Hard Disk”.  Click create to allocate the virtual hard
    disk to the machine.


    Afterwards it will ask you for your preferred format.  I personally stick with
    the VDI format, which is the default.  Once that is selected, the next prompt
    askes if you would like a dynamic disk that only uses disk space as it is used
    by the virtual machine.  A fixed disk will automatically use the full space of
    the allocated disk on your machine.  My preference is the dynamically allocated
    option.


    ![](images/00021.jpeg)


    Once you have completed the wizard, you will need to mount the ISO to the virtual
    DVD drive.  Basically this is the same as entering the installation media (DVD
    in this case) into a physical machine.  In VirtualBox click “Settings”, then “Storage”,
    and then click “Add Optical Drive”.


    ![](images/00022.jpeg)


    Select the ISO file and click ok.  Now back at the main menu click “Start”.


    ![](images/00023.jpeg)


    The virtual machine will begin to start.


    ### CentOS 7 Installation


    Once the machine boots, you will see the screen below.


    ![](images/00024.jpeg)


    Select Install CentOS 7 and press enter.'
