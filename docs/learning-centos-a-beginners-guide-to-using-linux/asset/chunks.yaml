  raw: '2.  Install the OS Using Virtualization Software


    3.  Install the OS onto a Computer


    4.  Dual Boot Your Existing Computer


    We will explore the first two of these options in this book.  When I started writing
    books about Linux, one of my first books was: Learning Ubuntu. The book is ranked
    as one of the top books for Learning Ubuntu and managing Linux in that enviroment,
    but I did receive one critisim.  A few people did not like that my recommendation
    was to use a service that cost money (VPS) and wanted other solutions for learning. 
    My motto is that knowledge is worth sharing, but installing the OS onto a machine,
    especially one that you rely on is risky.  To provide more detail, we will review
    two VPS services and also how to install CentOS on your computer using virtualization
    software (Oracle VirtualBox).


    If you want to use options 3 or 4, you can find a lot of tutorials on YouTube
    that you can reference.   I strongly recommend against trying to install it yourself
    if you are new to the field and would recommend getting familier with the other
    options outlined in this book first.  Options 1 & 2 are the safest and most effective
    way to get started quickly. 


    Before we talk about these methods to get started, lets first go over the version
    of CentOS that we will be using for this book.  This book, while it can apply
    to other versions of CentOS, is best suited for CentOS 7.  One of the main reasons
    that CentOS is becoming popular is that their OS is supported for ten years from
    release, while many others only have five year support cycles. CentOS 7 was release
    in 2014 and has support until 2024\. Many people do not realize that an operating
    system’s support expires. 


    Once the support expires, there may not be security patches and other upgrades
    for it available. 


    In my book[, Securing Business Data: Establishing a Core Value for Data Security](http://www.amazon.com/gp/product/B016PMLIW0),
    we talk about operating system support more in depth.  If you work with technology
    or manage a business, I highly recommend that you read it.


    CentOS is supported by nearly all VPS providers.  VPS stands for Virtual Private
    Server.  A Virtual Private Server is a machine sold as a hosting service and is
    often more affordable than purchasing a server and the bandwidth that it requires. 
    With the popularity of cloud based services, many businesses now run more virtual
    private servers in order to conserve costs and scale more quickly.  With a VPS
    you pay for what you need to use and can add more resources overtime, if you find
    you need more processing power or memory.


    ## Quick Recap


    1) An operating system is the main program in a computer, which controls the way
    the computer works, making it possible for other programs to function.


    1.  1.  Microsoft Windows, Mac OSX, and Linux are examples of operating systems.


    2) Open-source means that the software is provided with the original source code
    and is made freely available to be redistributed and modified.


    3) A distro or distribution is a version of Linux that uses the Linux kernel as
    its foundation.


    4) A Virtual Private Server is a machine sold as a hosting service and is often
    more affordable than purchasing a server and the bandwidth that it requires


    5) The recommend method for you to experiment with CentOS, is by setting up a
    VPS.


    1.  1.  This books instructions focus on using DigitalOcean or Linode as your
    host, but you can choose other providers as well.


    # Chapter 2


    ## Installing CentOS on a VPS


    In this section of the book, we will cover the installation method of using a
    Virtual Private Server. 


    A VPS is a virtual machine sold as a service by an internet hosting service. 
    It runs its own OS and customers are provided super user access to the operating
    system.  This allows users to install and manage almost anything they wish for
    their operating system.


    A few other advantages to a VPS is that you can access it from anywhere.  It is
    hosted in the cloud and if you want to use CentOS to host a website, it provides
    a great way to get started without needing your own high tier of internet bandwidth
    and appropriate hardware.  Personally, this is what I use for my websites.  It
    is cheaper than buying the internet connection for a fast web experience and hardware
    to run a robust server out of the house. 


    In this section we will cover getting started with two VPS providers: Linode and
    DigitalOcean.  Each has their own pricing and service offerings, but both are
    easy to start with.


    When you are choosing a VPS provider there are several things to consider.  Since
    you are getting started and learning, price is likely to be a major part of your
    decision if you choose this method.  On Linode, they offer a 1GB memory, 1CPU,
    24GB storage, and 2 TB transfer server for $10 per month.  DigitalOcean has a
    starter package with 512MB memory, 1 CPU, 20GB storage, and 1 TB transfer for
    $5 per month.  The choice is up to you.  DigitalOcean also has a $10 plan similar
    to the starting plan on Linode.


    ## Setting Up CentOS on Linode


    To get started with a Virtual Private Server or VPS is very simple.  All you need
    is a credit card and this book!  You can get your server live in just a few minutes.


    First you will need to go to: [https://www.linode.com/](https://www.linode.com/)


    From there you can sign up and select which plan you would like.  For me making
    this guide with intentions to launch a small eCommerce site, I am going to start
    with the $10 plan.


    ![](images/00001.jpeg)


    After you select the plan, you need to select the datacenter you wish to use. 
    My recommendation is to choose one that is the closest to your location.


    ![](images/00002.jpeg)


    I am located in Pennsylvania so Newark, NJ is the closest datacenter.  I select
    that and then click ‘Add this Linode’.


    Once you do this, you will now be brought to the Linode Manager.  This is a location
    where you can manage all of your VPS systems, if you have multiple. 


    ![](images/00003.jpeg)


    The image above may be hard to see, but from here we can see the status of our
    Linode, the Plan we are using, and our IP address.  That number for the IP address
    is what we will use to connect to our server and eventually connect our domain
    to.  It is very important so it might not be a bad idea to write it down.


    Right now, the server is empty with no operating system.  We need to install onto
    it the OS we wish to use, which for this book is CentOS 7. 


    Click on the name of your Linode.  In this instance the name is linode1938051. 
    Yours will appear similar to that.


    When you click on the name, you will notice that it looks rather empty.  Again
    it is because we need to install the OS.  VPS providers make this very easy. 
    On Linode, we simply need to click the deploy link.


    ![](images/00004.jpeg)


    Click on ‘Deploy an Image’.


    From this window, we can select the Image we want, which is CentOS 7.  Leave the
    defaults for now in the deployment disk size and swap disk.  Enter in what you
    would like the password to be for root (will be discussed more later) and make
    sure that it is a secure password.  Once all of this is done click on the ‘Deploy’
    button.


    ![](images/00005.jpeg)


    Once you click ‘Deploy’ the system will start the installation.  Give this a few
    moments to complete, but for now your installation work is done!  If you choose
    to use Linode, then you can skip the next section on the alternative, DigitalOcean. 
    Please note that there are more providers than just these two, but these are my
    personal preference for beginners.


    ## Setting Up CentOS on Digital Ocean


    Like Linode, DigitalOcean offers a quick process to get started and deploy a CentOS
    installation.  If you have decided to pay the small monthly fee for a VPS with
    any provider, I think you made the right decision.  What I like about using a
    VPS is that it doesn’t use my machines hardware and I can work on it from anywhere
    that I have an internet connection.'
