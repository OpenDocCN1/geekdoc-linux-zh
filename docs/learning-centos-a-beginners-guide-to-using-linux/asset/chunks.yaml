- fmt: "\n# 2. Install the OS Using Virtualization Software\n# 3. Install the OS onto\
    \ a Computer\n# 4. Dual Boot Your Existing Computer\n\nWe will explore the first\
    \ two of these options in this book. When I started writing books about Linux,\
    \ one of my first books was: `Learning Ubuntu`. The book is ranked as one of the\
    \ top books for Learning Ubuntu and managing Linux in that enviroment, but I did\
    \ receive one critisim. A few people did not like that my recommendation was to\
    \ use a service that cost money (VPS) and wanted other solutions for learning.\
    \ My motto is that knowledge is worth sharing, but installing the OS onto a machine,\
    \ especially one that you rely on is risky. To provide more detail, we will review\
    \ two VPS services and also how to install `OS` on your computer using virtualization\
    \ software (`Oracle VirtualBox`).\n\nIf you want to use options 3 or 4, you can\
    \ find a lot of tutorials on YouTube that you can reference. I strongly recommend\
    \ against trying to install it yourself if you are new to the field and would\
    \ recommend getting familier with the other options outlined in this book first.\
    \ Options 1 & 2 are the safest and most effective way to get started quickly.\n\
    \nBefore we talk about these methods to get started, lets first go over the version\
    \ of `CentOS` that we will be using for this book. This book, while it can apply\
    \ to other versions of `CentOS`, is best suited for `CentOS 7`. One of the main\
    \ reasons that `CentOS` is becoming popular is that their OS is supported for\
    \ ten years from release, while many others only have five year support cycles.\
    \ `CentOS 7` was release in 2014 and has support until 2024. Many people do not\
    \ realize that an operating system’s support expires.\n\nOnce the support expires,\
    \ there may not be security patches and other upgrades for it available.\n\nIn\
    \ my book, [Securing Business Data: Establishing a Core Value for Data Security](http://www.amazon.com/gp/product/B016PMLIW0),\
    \ we talk about operating system support more in depth. If you work with technology\
    \ or manage a business, I highly recommend that you read it.\n\n`CentOS` is supported\
    \ by nearly all VPS providers. `VPS` stands for `Virtual Private Server`. A `Virtual\
    \ Private Server` is a machine sold as a hosting service and is often more affordable\
    \ than purchasing a server and the bandwidth that it requires. With the popularity\
    \ of cloud based services, many businesses now run more virtual private servers\
    \ in order to conserve costs and scale more quickly. With a `VPS` you pay for\
    \ what you need to use and can add more resources overtime, if you find you need\
    \ more processing power or memory.\n\n## Quick Recap\n\n1. An operating system\
    \ is the main program in a computer, which controls the way the computer works,\
    \ making it possible for other programs to function.\n   1. `Microsoft Windows`,\
    \ `Mac OSX`, and `Linux` are examples of operating systems.\n2. Open-source means\
    \ that the software is provided with the original source code and is made freely\
    \ available to be redistributed and modified.\n3. A `distro` or `distribution`\
    \ is a version of `Linux` that uses the `Linux` kernel as its foundation.\n4.\
    \ A `Virtual Private Server` is a machine sold as a hosting service and is often\
    \ more affordable than purchasing a server and the bandwidth that it requires.\n\
    5. The recommend method for you to experiment with `CentOS`, is by setting up\
    \ a `VPS`.\n   1. This books instructions focus on using `DigitalOcean` or `Linode`\
    \ as your host, but you can choose other providers as well.\n\n# Chapter 2\n\n\
    ## Installing CentOS on a VPS\n\nIn this section of the book, we will cover the\
    \ installation method of using a `Virtual Private Server`.\n\nA `VPS` is a virtual\
    \ machine sold as a service by an internet hosting service. It runs its own `OS`\
    \ and customers are provided super user access to the operating system. This allows\
    \ users to install and manage almost anything they wish for their operating system.\n\
    \nA few other advantages to a `VPS` is that you can access it from anywhere. It\
    \ is hosted in the cloud and if you want to use `CentOS` to host a website, it\
    \ provides a great way to get started without needing your own high tier of internet\
    \ bandwidth and appropriate hardware. Personally, this is what I use for my websites.\
    \ It is cheaper than buying the internet connection for a fast web experience\
    \ and hardware to run a robust server out of the house.\n\nIn this section we\
    \ will cover getting started with two VPS providers: `Linode` and `DigitalOcean`.\
    \ Each has their own pricing and service offerings, but both are easy to start\
    \ with.\n\nWhen you are choosing a `VPS` provider there are several things to\
    \ consider. Since you are getting started and learning, price is likely to be\
    \ a major part of your decision if you choose this method. On `Linode`, they offer\
    \ a `1GB` memory, `1CPU`, `24GB` storage, and `2 TB` transfer server for $10 per\
    \ month. `DigitalOcean` has a starter package with `512MB` memory, `1 CPU`, `20GB`\
    \ storage, and `1 TB` transfer for $5 per month. The choice is up to you. `DigitalOcean`\
    \ also has a $10 plan similar to the starting plan on `Linode`.\n\n## Setting\
