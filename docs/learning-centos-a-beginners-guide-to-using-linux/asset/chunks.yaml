  raw: 'If your installation fails or appears to hang, it is likely that your system
    does not support running 64bit software virtually.  I experienced that issue as
    I was testing for this book on an older PC.


    You can download the 32bit i386 versions from this link: [http://mirror.centos.org/altarch/7/isos/i386/](http://mirror.centos.org/altarch/7/isos/i386/)


    Once the installer successfully loads, you will need to select your language and
    location.  Once you have done that click “Continue”. 


    ![](images/00025.jpeg)


    Next you will see CentOS preconfigure a variety of settings. 


    You may need to configure the “Installation Destination” that is under the system
    heading.  Select “Installation Destination” and from that interface select the
    hard disk and click done as seen below.


    ![](images/00026.jpeg)


    Once that is complete and you are back at the main installation screen.  Now we
    need to make sure that we can establish an internet connection.  Click on “Network
    and Hostname”.  Inside of this panel configure and make sure that “Automatically
    Connect When Network is Available” is checked.  Once that is completed, click
    save.  In the hostname box, enter the name for your server.  I just called mine
    centOS.  When that is completed turn the switch for the network adapter to on.
    It can be found right next to the network adapter.  In the top left click, “Done”,
    which returns you to the home screen where you can click “Begin Installation”
    in the bottom right.


    ![](images/00027.jpeg)


    As CentOS is installing there are two things we can configure, the “Root Password”
    and “User Creation”.  For now lets leave the user configuration the way it is
    and set the “Root Password”.  Click on “Root Password”, enter the new password
    twice and then click done.  Be sure to remember this password as we will need
    it later.


    ![](images/00028.jpeg)


    Once the installation is completed, you will need to click the “Reboot” button
    in the bottom right. 


    ![](images/00029.jpeg)


    Now dismount the ISO image (if you don’t you’ll keep going through the install
    process) and shutdown the Virtual Machine.


    Now we need to do some additional configuration to the Virtual Machine so that
    it can have both internet access and you can view the system from the browser
    later in the book.


    With the Virtual Machine shutdown, click on “Settings”.  In the settings panel,
    click Network on the left.  You will see that Adapter 1 is configured and attached
    to NAT.  Let that setting as it is.  Click on Adapter 2 and then check the “Enable
    Network Adapter” checkbox.  In the “Attached to” dropdown, select “Host-only Adapter”
    and then ok.


    Now click Start and once the boot is completed, you will see a command line prompt
    to login.  We have finished the installation and initial configuration of CentOS.


    ![](images/00030.jpeg)


    Let’s login and find out our ip address so that we can continue as if we had a
    VPS, which at this point we kind of do, but it is only available internally.


    | Find Your IP Address |


    | Command | ip addr |


    | Result | System will display network information |


    After typing in ip addr and pressing enter, you will get a lot of information
    on the page.  We are not concerned about the information after 1 (loopback connection),
    or 2, but under 3, there is an inet that may look similar to this: 192.168.1.50/24. 
    Your ip address would be 192.168.1.50\. All networks are different, but use that
    as a general guide.


    Be sure to write this IP down.  Chances are it is dynamic and may change overtime. 
    If you think it might have changed be sure to reference back to the Find Your
    IP Address box above.


