  \ stop`\n- 启动 MariaDB：`sudo service mariadb start`\n- 重启 MariaDB：`sudo service mariadb\
  \ restart`\n\n现在我们的数据库系统已经在运行了，我们需要运行一个安全脚本来移除一些可能危险的默认设置。\n\n### 安全 MariaDB 服务器\n\
  \n| 项目 | 详情 |\n| :--- | :--- |\n| 命令 | `sudo mysql_secure_installation` |\n| 结果\
