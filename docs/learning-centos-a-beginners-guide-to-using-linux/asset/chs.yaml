  \ WordPress\n- 第 14 章\n- [结语]\n\n# 第 1 章\n\n## 什么是 Linux 和 CentOS？\n\n你可能熟悉微软 Windows\
  \ 和苹果的 MacOS。这两者都是操作系统的例子，Linux 也是如此。\n\n韦尔-字典词典将操作系统定义为计算机中控制计算机工作方式并使其他程序能够运行的主要程序。本质上，操作系统是让用户与计算机交互的程序。在互联的世界里，如果没有操作系统，设备只是塑料、玻璃和硅的堆砌。\n\
  \nLinux 是一个开源操作系统。开源意味着软件提供了原始代码，并可以免费分发和修改。这正是 Linux 的独特之处。\n\n如果你想为自己的作品集增加一项新技能，学习使用\
  \ Linux 将非常有用。根据 ZDNet 2014 年的数据，87% 的企业业务增加了一台 Linux 服务器，82% 的企业计划在 2015 年增加。\n\
  \nLinux 及其发行版在数据库、Web 以及其他类型的服务器非常流行。自 90 年代以来，Linux 运行着互联网、科学突破的超级计算机以及全球股市。观察互联网，Linux\
  \ 运行着超过 36% 的在线资源，其中 21% 是 CentOS 发行版。\n\n发行版（distro）是以 Linux 内核为基础的 Linux 版本或“口味”。内核是真正被称为\
  \ Linux 的组件。内核是操作系统的底层，管理 CPU、内存和设备的主要系统功能。\n\n1991 年，Linus Torvalds 的个人项目是创建一个新的免费操作系统内核。从那时起，内核在过去的\
  \ 25 年里经历了不断的增长。它从少数的 C 语言文件增长到超过 1800 万行代码，并根据 GNU 通用许可许可证开放。\n\n## 安装 CentOS 7\
  \ 的方法与快速入门\n\n你所需的工具取决于你选择的路线。有四种安装方法，你可以使用它们来实验书中的课程。\n\n### 实验安装操作系统的方法\n\n1.\
  \  使用低廉的云虚拟专用服务器 (VPS)\n\n\n\n\n\n## 2. 使用虚拟化软件安装操作系统\n## 3. 将操作系统安装到计算机上\n## 4.\
  \ 为你的现有电脑设置双启动\n\n我们将在书中探索这些选项中的前两个。当我开始写关于 Linux 的书籍时，我的第一本书之一是：`Learning Ubuntu`。这本书被评誉为学习\
  \ Ubuntu 和在该环境下管理 Linux 的顶尖书籍之一，但我确实收到过一次批评。一些人不喜欢我建议使用一种需要付费的服务（VPS），并希望有其他学习替代方案。我的座右铭是：知识是值得分享的，但将操作系统安装到机器上（尤其是你所赖以的机器）是有风险的。为了提供更详细的说明，我们将审查两个\
  \ VPS 服务，并介绍如何使用虚拟化软件（`Oracle VirtualBox`）在你的电脑上安装 `OS`。\n\n如果你想使用选项 3 或 4，你可以在\
  \ YouTube 上找到很多教程可以参考。如果你是该领域的新学者，我强烈建议不要尝试自己动手安装，并建议你先熟悉书中概述的其他选项。选项 1 和 2 是快速上手最安全且最有效的方法。\n\
  \n在讨论这些入门方法之前，让我们先过一下书中将使用的 `CentOS` 版本。虽然这本书适用于其他版本的 `CentOS`，但它最适合 `CentOS 7`。`CentOS`\
  \ 变得流行的主要原因之一是他们的操作系统自发布起提供十支持，而许多其他系统只有五年的支持周期。`CentOS 7` 于 2014 年发布，支持将到 2024\
  \ 年。许多人并没有意识到操作系统的支持是有期限的。\n\n一旦支持过期，可能无法获得相应的安全补丁和其他升级。\n\n在我的书籍 [Securing Business\
  \ Data: Establishing a Core Value for Data Security](http://www.amazon.com/gp/product/B016PMLIW0)\
  \ 中，我们更深入地讨论了操作系统支持问题。如果你从事技术工作或管理业务，我强烈建议你阅读它。\n\n`CentOS` 几乎所有的 VPS 提供商都支持。`VPS`\
  \ 代表 `Virtual Private Server`（虚拟专用服务器）。`Virtual Private Server` 是一种作为托管服务出售的机器，通常比购买服务器及其带宽要便宜得多。随着云服务的普及，许多企业现在运行更多的虚拟专用服务器以节省成本并更快速地扩展。通过\
  \ `VPS`，你为你实际使用的部分付费，如果你发现需要更多处理能力或内存，可以随着时间的推移增加更多资源。\n\n### 快速回顾\n\n1. 操作系统是计算机中的主程序，控制计算机的工作方式，使其他程序能够运行。\n\
  \   1. `Microsoft Windows`、`Mac OSX` 和 `Linux` 是操作系统的示例。\n2. 开源意味着软件提供源代码，并免费分发和修改。\n\
  3. `distro` 或 `distribution`（发行版）是以 `Linux` 内核为基础的 `Linux` 版本。\n4. `Virtual Private\
  \ Server` 是作为托管服务出售的机器，通常比购买服务器及其带宽要便宜得多。\n5. 建议你实验 `CentOS` 的方法是搭建 `VPS`。\n   1.\
  \ 本书的重点是使用 `DigitalOcean` 或 `Linode` 作为主机，但也可以选择其他提供商。\n\n# 第 2 章\n\n## 在 VPS 上安装\
  \ CentOS\n\n在书的这一部分，我们将介绍使用 `Virtual Private Server` 的安装方法。\n\n`VPS` 是由互联网托管服务作为服务出售的虚拟机。它运行自己的\
  \ `OS`，并向客户提供操作系统的超级用户权限。这允许用户为他们的操作系统安装和管理他们想要的几乎任何内容。\n\n`VPS` 的其他几个优点是你可以从任何地方访问它。它托管在云端，如果你想用\
  \ `CentOS` 托管网站，它提供了一个极佳的入门方式，不需要你自己的高带宽和合适的硬件。个人而言，这是我用于网站的方式。它比购买用于快速网页体验的互联网连接以及在家里运行稳定服务器的硬件要便宜得多。\n\
  \n在本节中，我们将介绍如何开始两个 VPS 提供商：`Linode` 和 `DigitalOcean`。它们各有自己的定价和服务方案，但两者都非常容易上手。\n\
  \n当你选择 `VPS` 提供商时，有几点需要考虑。由于你正处于入门和学习阶段，如果你选择这种方法，价格可能是你决策的主要因素。在 `Linode` 上，他们提供一台\
  \ `1GB` 内存、`1CPU`、`24GB` 存储和 `2 TB` 流量的服务器，每月 10 美。`DigitalOcean` 有一个入门套餐，包含 `512MB`\
  \ 内存、`1 CPU`、`20GB` 存储和 `1 TB` 流量，每月 5 美元。选择取决于你。`DigitalOcean` 也有一个 10 美元的计划，与\
  \ `Linode` 的入门计划类似。\n\n## 在 Linode 上设置 CentOS\n\n开始使用 `Virtual Private Server` 或\
  \ `VPS` 非常简单。你只需要一张信用卡和这本书！你可以在几分钟内让你的服务器上线运行。\n\n首先，你需要访问：`[`www.linode.com/`](https://www.linode.com/)`\n\
  \n从那里你可以注册并选择你喜欢的计划。对我来说，制作此指南的目的是启动小型电子商务网站，所以我将从 10 美元的计划开始。\n\n![](img/00001.jpeg)\n\
  \n选择计划后，你需要选择你想要使用的数据中心。我的建议是选择一个离你所在地最近的。\n\n![](img/00002.jpeg)\n\n我位于宾法尼亚州，所以新泽西州的\
  \ Newark 是最近的数据中心。我选择了它，然后点击“Add this Linode”（添加此 Linode）。\n\n完成此操作后，你将进入 `Linode\
  \ Manager`。这是你可以管理所有 `VPS` 系统的地方（如果你有多个的话）。\n\n![](img/00003.jpeg)\n\n上面的图片可能很难看清，但在这里我们可以看到我们\
  \ `Linode` 的状态、我们正在使用的 `Plan` 以及我们的 `IP address`。那个 `IP address` 数字将是我们用来连接服务器并最终连接我们域名的地址。它非常重要，所以把它记录下来可能不是坏主意。\n\
  \n现在，服务器是空的，没有操作系统。我们需要在上面安装我们想要使用的 `OS`，在这里是 `CentOS 7`。\n\n点击你的 `Linode` 名称。你的显示的看起来会像那样。\n\
  \n当你点击名称时，你会发现它看起来相当空。同样，是因为我们需要安装 `OS`。`VPS` 提供商让这变得非常简单。在 `Linode` 上，我们只需要点击部署链接（deploy）。\n\
  \n![](img/00004.jpeg)\n\n点击“Deploy an Image”（部署镜像）。\n\n从这个窗口，我们可以选择我们需要的 `Image`，即\
  \ `CentOS 7`。部署磁盘大小和交换磁盘目前保持默认设置即可。输入你想要为 `root` 设置的密码（稍后会详细讨论），并确保这是一个安全的密码。完成所有这些后，点击“Deploy”（部署）按钮。\n\
  \n![](img/00005.jpeg)\n\n一旦你点击“Deploy”，系统将开始安装。留几分钟让其完成，但现在你的安装工作已经完成了！如果你选择使用 Linode，可以跳过下一节关于替代方案\
  \ `DigitalOcean` 的内容。\n\n## 在 Digital Ocean 上设置 CentOS\n\n像 `Linode` 一样，`DigitalOcean`\
  \ 也提供了一个快速开始并部署 `CentOS` 安装的流程。如果你已经决定为任何提供商支付 `VPS` 的月费，我认为你做了正确的决定。我喜欢使用 `VPS`\
  \ 的一点是它不占用我机器的硬件，我可以在任何有连接的地方对它进行操作。\n\n\n\n\n让我们在几分钟内通过 DigitalOcean 设置好我们的服务器吧。\n\
  \n首先，访问 [`www.digitalocean.com/`](https://www.digitalocean.com/) 并点击右上角的“Sign Up”（注册）。在那里，输入你想要用于账户的电子邮件地址和密码。然后点击“Sign\
  \ Up”。\n\n![2016-02-07_21h53_56](img/00006.jpeg)\n\n现在我们需要确认电子邮件地址。打开你的电子邮箱，找到来自\
  \ DigitalOcean 的邮件。邮件标题为“DigitalOcean – Please confirm your email address.”。打开邮件并点击验证链接。\n\
  \n太棒了，现在我们的邮箱已经确认，我们需要选择一种支付方式。DigitalOcean 提供使用信用卡或 PayPal 的选项。对于我来说，我使用 PayPal\
  \ 比较方便。\n\n如果你使用 PayPal，你需要预付 5 美，这笔钱将存入你的账户。这将涵盖我们第一个月的费用！\n\n一旦添加了支付方式，我们就可以创建\
  \ VPS 了，DigitalOcean 将称为 Droplet。在右上角，点击绿色的“Create Droplet”（创建 Droplet）按钮。\n\n![2016-02-07_22h01_21](img/00007.jpeg)\n\
  \n接下来，它会要求你选择发行版。我们要选择 `CentOS` 以及他们提供的最新版本，即 `7.2`。\n\n![](img/00008.jpeg)\n\n\
  一旦你选择了 `CentOS`，向下滚动选择你想要部署的服务器尺寸。他们默认选中了每月 20 美元的计划。如果你想从每月 5 美元的计划开始，只需点击每月 5\
  \ 美元的计划即可。\n\n![](img/00009.jpeg)\n\n我建议根据你的地理位置选择一个区域。由于我住在美国东海岸，我为该服务商选择了纽约节点。\n\
  \n![](img/00010.jpeg)\n\n在“附加选项”（additional options）下，是否需要备份取决于你。如果我们是在进行开发或任何训练测试之外的活动，我会建议选择备份选项，但由于我们现在只需要一些基础功能来学习，所以我将不勾选这些选项。\n\
  \n![2016-02-07_22h07_31(1)](img/00011.jpeg)\n\n从那里，滚动到最后并点击大绿色“Create”（创建）按钮。\n\n\
  ![](img/00012.jpeg)\n\n在几秒钟后，你的系统就设置好并准备就绪了。DigitalOcean 将向给你发送服务器的 IP 地址、用户名和密码。请保留这些信息。稍后我们需要这些\
  \ IP 地址和登录信息。\n\n# 第 3 章在虚拟机上安装 CentOS\n\n如果你暂时不想使用 VPS 并且想在本地进行测试，那么下一个最佳选择是使用虚拟环境。市场上有很多这类产品。我推荐这种方法有两个原因：它比安装在你正在使用的机器上风险更小，而且如果你有一台配置相当的电脑，入门几乎不需要任何费用。假设你是一个初学者并刚刚开始，我们将从零开始首先安装虚拟化软件。Oracle\
  \ 的 `VirtualBox` 是我们在本教程中使用的程序，它是开源且免费的。\n\n## 安装 Oracle VirtualBox\n\n在演示中，我将使用一台\
  \ x64 Windows 10 电脑。\n\n要安装 `VirtualBox`，请访问：[`www.virtualbox.org/wiki/Downloads`](https://www.virtualbox.org/wiki/Downloads)\n\
  \n从那里选择最适合你系统的版本。对于使用 Windows 10 x64 机器的我，我将下载适用于 Windows 主机的 `VirtualBox 5.0.20`。\n\
  \n![](img/00013.jpeg)\n\n当你点击下载链接并收到提示时，点击“Save File”（保存文件）。下载完成后，点击可执行文件开始安装。\n\
  \n![](img/00014.jpeg)\n\n出现提示时点击“Next”（下一步）。\n\n![](img/00015.jpeg)\n\n保持默认设置并再次点击“Next”。\n\
  \n![](img/00016.jpeg)\n\n如果你想要快捷方式（这可能很有用），请保留默认设置并再次点击“Next”。现在我们已经完成了所有的点击“Next”操作。\n\
  \n![](img/00017.jpeg)接接下来的提示将提醒你，安装 Oracle Virtual Box 网络功能将重置你的网络连接并临时断开互联网连接。这没关系，你可以点击“Yes”（是）继续。\n\
  \n一旦点击了“Yes”，你将看到所示的最终安装提示。点击默认的“Install”（安装）按钮。\n\n![](img/00018.jpeg)\n\n现在我们等待。这不像热门书籍和电视剧《权力的游戏》中等待冬天的到来那样漫长，但确实需要几分钟时间。\n\
  \n随着安装程序的进行，你可能需要再次点击一次“Yes”或“Install”。完成后，你将看到一个完成界面。点击“Finish”（完成），它将启动 `VirtualBox`。\n\
  \n## 获取 ISO\n\n无论是使用 `VirtualBox` 安装 `CentOS` 还是使用 `VirtualBox` 将其设置，我们都需要选择你想要部署的服务器尺寸。\n\
  \n一旦你选择了 `CentOS`，向下滚动选择你想要部署的服务器尺寸。他们默认选中了每月 20 美元的计划。如果你想从每月 5 美元的计划开始，只需点击每月\
  \ 5 美元的计划即可。\n\n（注：此处原文中存在大量重复段落，已根据文档工程师逻辑进行去重与合并，仅保留核心指令内容）\n\n## 获取 ISO\n\n无论是使用\
  \ `VirtualBox` 安装 `CentOS` 还是使用 `VirtualBox` 将其设置，我们都需要下载 ISO 文件。\n\n（注：此处原文中存在大量重复段落，已根据文档工程师逻辑进行去重与合并）\n\
  \n## 在 VirtualBox 上配置并安装 CentOS\n\n现在我们已经下载了 ISO 并安装了 `VirtualBox`，我们可以设置环境了。在 `VirtualBox`\
  \ 中点击“New”（新建）按钮，以便配置虚拟机。\n\n![](img/00019.jpeg)\n\n一旦点击“New”，我们需要为机器命名并提供一些基本信息。请参考下图指南。记住\
  \ `CentOS` 是基于 Red Hat 的。\n\n![](img/00020.jpeg)\n\n完成后，点击“Next”。软件将推荐分配给虚拟机的内存量。我个人建议至少分配\
  \ 1GB 内存（即 1024MB）。确定后，点击 next，然后选择 `Create a Hard Disk`创建硬盘）。点击创建为机器分配虚拟硬盘。\n\n\
  之后，它会询问你偏好的格式。我个人一直倾向于使用默认的 `VDI` 格式。一旦选择了该格式，下一个提示会询问你是否想要使用动态磁盘（它只在虚拟机使用空间时占用磁盘空间）。固定磁盘会自动使用你机器上分配磁盘的全部空间。我的偏好是动态分配选项。\n\
  \n![](img/00021.jpeg)\n\n完成向导后，你需要将 ISO 挂载到虚拟光驱上。基本上这是将安装媒体（在本例中为 DVD）插入物理机器。在 `VirtualBox`\
  \ 中点击 `Settings`设置，然后点击 `Storage`存储，最后点击 `Add Optical Drive`添加光驱。\n\n![](img/00022.jpeg)\n\
  \n选择 ISO 文件并点击确定。现在回到主菜单点击“Start”（启动）。\n\n![](img/00023.jpeg)\n\n### CentOS 7 安装\n\
  \n虚拟机将开始启动。\n\n一旦虚拟机启动，你将看到下面的屏幕。\n\n![](img/00024.jpeg)\n\n选择 `Install CentOS 7`\
  \ 并按回车。\n\n\n\n\n如果你的安装失败或出现挂起，可能是因为你的系统不支持虚拟运行 64 位软件。我在在一台旧电脑上测试此本书时就遇到过这个问题。\n\
  \n你可以从此链接下载 32 位的 i386 版本：[`mirror.centos.org/altarch/7/isos/i386/`](http://mirror.centos.org/altarch/7/isos/i386/)\n\
  \n一旦安装程序成功加载，你将需要选择语言和位置。完成后，点击“继续”（Continue）。\n\n![](img/00025.jpeg)\n\n接下来你将看到\
  \ CentOS 预配置各种设置。\n\n你可能需要配置“系统”（system）标题下的“安装目标”（Installation Destination）。选择“安装目标”，并在该界面中选择硬盘并点击“完成”（done），如下所示。\n\
  \n![](img/00026.jpeg)\n\n完成后，你回到了主安装界面。现在，我们需要确保能够建立互联网连接。点击“网络和主机名”（Network and\
  \ Hostname）。在此面板内部配置并确保勾选了“网络可用时自动连接”（Automatically Connect When Network is Available）。完成后，点击保存（save）。在主机名（hostname）框中输入你的服务器名称。我将其命名为\
  \ `centOS`。完成后，将网络适配器的开关拨到开启。它就在网络适配器旁边。点击左上角的“完成”（Done），这将带回到主屏幕，你可以在右下角点击“开始安装”（Begin\
  \ Installation）。\n\n![](img/00027.jpeg)\n\n在 CentOS 安装期间，我们可以配置两项内容：“Root 密码”（Root\
  \ Password）和“用户创建”（User Creation）。现在让用户配置保持不变，设置“Root 密码”。点击“Root 密码”，输入两次新密码，然后点击完成。务必记住这个密码，因为我们稍后会需要它。\n\
  \n![](img/00028.jpeg)\n\n安装完成后，你需要点击右下角的“重启”（Reboot）按钮。\n\n![](img/00029.jpeg)\n\
  \n现在卸载 ISO 镜像（如果不卸载你将反复进入安装过程）并关闭虚拟机。\n\n现在我们需要对虚拟机进行一些额外的配置，以便它既能访问互联网，你稍后又可以在书中通过浏览器查看系统。\n\
  \n在虚拟机关闭状态下，点击“设置”（Settings）。在设置面板中，点击左侧的“网络”（Network）。你会看到适配器 1 已配置并连接到 NAT。保持该设置不变。点击适配器\
  \ 2，然后勾选“启用网络适配器”（Enable Network Adapter）复选框。在“连接到”（Attached to）下拉菜单中选择“仅主机网络”（Host-only\
  \ Adapter），然后确定。\n\n现在点击启动，启动完成后，你将看到一个登录的命令行提示符。我们完成了 CentOS 的安装和初始配置。\n\n![](img/00030.jpeg)\n\
  \n登录并查找 IP 地址，以便我们可以像使用 VPS 一样继续（目前我们确实是这样，但仅在内部可用）。\n\n| 查找你的 IP 地址 |\n\n| 命令 |\
  \ `ip addr` |\n| 结果 | 系统将显示网络信息 |\n\n输入 `ip addr` 并按回车后，你会在页面上看到大量信息。我们不关心 1（回环连接）或\
  \ 2 之后的信息，但在 3 下，有一个 inet 看起来像这样：`192.168.1.50/24`。你的 IP 地址将是 `192.168.1.50`。所有网络都是不同的，但可以以此作为通用指南。\n\
  \n务必记下这个 IP。它可能是动态的，可能会随着时间推移而变化。如果你认为它可能已经更改，请参考上面的“查找你的 IP 地址”框。\n\n# 第 4 章\n\n\
  ## 60 秒文档训练营\n\n在技术领域，我们的成败取决于我们产出的文档。想象一下客户的系统出现问题，而你不知道它在运行什么，或者 IP 或密码是什么。这是一个常见问题。通常将密码存储在任何地方都是安全的，但你必须想出一种安全存储这些信息的方法。当你处理大量的\
  \ IP 和密码时，记住所有它们是不可能的。下面是一份实用的文档指南，帮助你入门。由于是为了学习 CentOS 而非生产环境，把密码写下来可能是没问题的。如果你是阅读电子版，请创建一个你自己的表格来放置这些信息。\n\
  \n### 示例数据\n\n服务器名称：CentOS\n操作系统：CentOS 7\n支持直到：2024\nRoot 密码：`*********`\nIP 地址：000.000.000.000\n\
  主要用途：Web 服务器\n安装日期：2016/6/20\n最后更新日期：2016/6/20\n\n### 我的文档\n\n服务器名称：______________________________\n\
  操作系统：CentOS 7\n支持直到：2024\nRoot 密码：_____________________________\nIP 地址：___________________________________\n\
  主要用途：Web 服务器\n安装日期：________________________________\n最后更新日期：___________________________\n\
  \n# 第 5 章\n\n## 进入 CLI\n\nCLI 是命令行界面（command line interface）的缩写，你可以通过输入文本行与系统进行交互。这就是我们与服务器交互的方式。\n\
  \n如果你决定不使用推荐的方法来设置 VPS，那么你可以在电脑的显示器上看到 CLI。当你启动电脑时，它将带你进入 CLI，然后你可以在那里登录。\n\n我们可以使用名为\
  \ `SSH` 的协议连接到 CentOS 服务器。`SSH` 代表安全外壳（Secure Shell），这是我们远程登录服务器的一种加密方式。\n\n为了给下一步做准备，请参考我们在上一章中作为文档训练营一部分而记录的信息。我们需要\
  \ IP 地址和登录信息。IP 地址是识别网络上计算机的数字字符串。对于我们的 VPS，IP 地址是公网 IP，可以从任何连接互联网的地方访问。对于虚拟机，请使用启动时显示的\
  \ CLI 接口。\n\n我推荐用于 SSH 连接到 VPS 服务器的程序叫做 `PuTTY`。`PuTTY` 是一个免费的开源 `SSH` 客户端，支持 Windows。你可以从以下链接下载它：[`putty.org`](http://putty.org)\n\
  \n你下载的文件是一个可执行文件（`.exe`），不需要安装。下载后，你可以将其拖到桌面以便快速访问。\n\n使用此工具连接到 VPS 或虚拟机非常简单。在“主机名或\
  \ IP 地址”处，输入提供的 IP 地址。选择 `SSH` 作为连接类型，然后点击打开。查看图 1 以了解示例样子。\n\n注意：你的 IP 地址将与图中不同。\n\
  \n图 1：Putty 配置\n\n![](img/00031.jpeg)\n\n当你点击连接时，可能会收到图 2 这样的消息。点击“是”。\n\n图 2：PuTTY\
  \ 安全警告\n\n![C:\\Users\\Nathan\\AppData\\Local\\Microsoft\\Windows\\INetCache\\Content.Word\\\
  2016-02-08_19h51_40.png](img/00032.jpeg)\n\n## 首次登录\n\n现在你将被提示首次登录。输入用户名 `root`，然后输入提供的或你在设置\
  \ VPS 时设置的密码。\n\n如果你使用的是 DigitalOcean，系统会在你第一次登录时要求重置密码。你需要重新输入提供的密码，然后输入两次你想设置的新密码。确保你遵循安全密码指南，并为\
  \ root 用户设置安全的密码。\n\n注意：在本书中，我使用表格来解释我们要学习的不同命令。第一行是我们要执行的任务，第二行是我们需要使用的命令，第三行是你的\
  \ CLI 看起来的样子。我认为这是描述和解释我们要学习的命令的最佳方式。\n\n如果你没有被提示更改密码，但想更改，可以输入命令 `passwd`。更多细节请见下一页表格。\n\
  \n| 修改我的密码 |\n\n| 命令 | `passwd` |\n| 结果 | 系统将提示输入新密码 |\n\n\n\n\n\n| CLI 显示 | `[root@centos:~]#\
  \ passwd` 正在更改用户 root 的密码。新密码:再次输入新密码:passwd: 密码更新成功 |\n\n当系统提示你输入新密码时，请输入，不要担心密码不会显示在屏幕上。完成后，请按回车键并再次输入一次。\n\
  \n## 导航\n\n不要被 CLI 上的白字黑背景所吓到。我知道这里没有鼠标或图形界面，但过了一会儿，你就会习惯于在服务器的目录间进行导航了。目录就像你可能\
  \ Windows 或 Mac 设备上用过的文件夹。作为一名长期使用这种工具的人，我实际上更喜欢这种方式，而不是图形化用户界面。在做任何其他操作之前，让我们学会探索服务器。通过使用\
  \ `pwd` 命令，我们可以看到当前查看的目录位置。\n\n| 查找你的当前目录位置 |\n| 命令 | `pwd` |\n| 结果 | 系统将输出你当前所在的目录。\
  \ |\n| CLI 显示 | `[root@centos:~]# pwd/root` |\n\n现在我们处于一个名为 `root` 的目录中，它本质上是用户\
  \ `root` 的家目录。这个 root 家目录与系统的实际根之间有很大区别。\n\n路径 `/` 是系统的根，但现在我们处于一个名为 `root` 的子目录中\
  \ (`/root`)。\n\n服务器的根是顶级目录。一切都是它里面的子目录。从我们现在的位置，有两种方法可以到达那里。让我们从最简单的带我们进入根目录命令开始。\n\
  \n| 进入根目录 (/) |\n| 命令 | `cd /` |\n| 结果 | 我们切换到主根目录 |\n| CLI 显示 | `[root@centos:~]#\
  \ cd /[root@centos:/]#` |\n\n现在让我们再次使用 `pwd` 看看我们现在哪里。\n\n| 查找你的当前目录位置 |\n| 命令 |\
  \ `pwd` |\n| 结果 | 系统将输出你当前所在的目录。 |\n| CLI 显示 | `[root@centos:~]# pwd/` |\n\n如果你想查看文件夹里有什么内容，可以使用\
  \ `ls` 命令。\n\n| 列出文件 |\n| 命令 | `ls` |\n| 结果 | 列出当前目录下的文件 |\n| CLI 显示 | `[root@centos:/]#\
  \ lsbin dev home media opt root sbin sysvar boot etc lib mnt proc run srv tmp var`\
  \ |\n\n我们还可以通过 `ls` 后面添加标志（flag）来查看更多细节。\n\n标志是在提示符处作为命令的一部分输入的，并添加额外的参数来告诉系统我们想要什么。\n\
  \n尝试运行此命令：`ls –la`\n\n在示例中，–la 就是标志。`l` 告诉系统我们想查看更多细节并列出目录中的所有文件，甚至是隐藏文件。\n\n现在，让我们切换到名为\
  \ `home` 的目录。\n\n| 切换目录 |\n| 命令 | `cd home` |\n| 结果 | 系统将我们移动到子文件夹 home |\n| CLI\
  \ 显示 | `[root@centos:/]# cd home[root@centos: home]#` |\n\n注意：理解父目录和子目录的区别很重要。如果我们有一个名为\
  \ `documents` 的目录，并在里面另一个名为 `pictures` 的目录。那么 `pictures` 就是 `documents` 的子目录。在此例中，我们处于父目录\
  \ `/` 并切换到子目录 `/home`。如果你不在父文件夹中，你仍然可以进入 `home`，但在 `cd` 之后你必须列出完整路径（例如：`cd /home`）。如果你遇到诸如“无此类文件或目录”的错误，你可能需要输入完整路径，因为你可能不在正确的目录中。\n\
  \n如果我们想回到根目录，可以使用另一个切换目录命令，它可以轻松向上移动一个目录。\n\n| 向上移动一个目录 |\n| 命令 | `cd ..` |\n| 结果\
  \ | 系统将我们移动到父文件夹 |\n| CLI 显示 | `[root@centos: home]# cd ..[root@centos:/]#` |\n\n\
  使用 `cd` 配合目录名和 `..` 可以允许我们快速在服务器中移动。\n\n### 快速回顾\n\n1. `CLI` 代表命令行界面（command line\
  \ interface），你可以通过输入文本行与系统交互。\n2. `SSH` 代表安全外壳（Secure Shell），这是我们登录服务器的加密方式。\n3.\
  \ `IP 地址` 是一个识别网络上计算机的数字字符串。\n4. `PuTTY` 是一个免费、开源且支持 Windows 的 SSH 客户端。\n5. `passwd`\
  \ 命令允许我们更改当前密码。\n6. 输入 `pwd` 将为我们提供服务器目录中的当前位置。\n7. 使用 `ls` 将列出当前目录下的文件和目录。\n8.\
  \ 在 `ls` 之后添加标志（如 –la）将我们提供更多细节并显示隐藏文件。\n9. 我们可以使用 `cd` 来切换目录：\n   - 我们可以通过 `cd\
  \ ..` 向上移动文件夹。\n   - 在 `cd` 后面加上子目录将我们带入目录（示例：`cd home`）。\n10. 路径 `/` 是系统的根，但 `/root`\
  \ 是子目录或子目录。\n\n# 第 6 章：创建新用户\n\n`root` 用户对系统具有完全访问权限。虽然我们用它来学习一些导航，但不应将其作为系统的主要用户名。这会违背这种极佳的安全模型。在我们做其他事情之前，让我们先学习探索服务器。通过使用\
  \ `pwd` 命令，我们可以看到当前查看的目录位置。\n\n\n\n\n\n在继续之前，我们可以学习两个快速命令。现在你的 CLI（命令行界面）可能有很多文本。如果你想清理这些内容，可以使用\
  \ `clear` 命令。\n\n| 清理屏幕 |\n| :--- | :--- |\n| 命令 | `clear` |\n| 结果 | 系统将清除屏幕 |\n\
  | CLI 显示 | `[root@centos:/]# clear` |\n\n现在我们有了整洁的屏幕，如果你使用的是 VPS，可以关闭 PuTTY 了。如果你使用的是虚拟机，请使用\
  \ `logout`。我们将继续使用新用户 ID `tidus` 进行操作。\n\n| 注销 |\n| :--- | :--- |\n| 命令 | `logout`\
  \ |\n| 结果 | 系统将关闭 SSH 会话并退出 PuTTY 或注销虚拟机 |\n| CLI 显示 | `[root@centos:/]# logout`\
  \ |\n\n# 第 7 章\n\n## 系统状态概览\n\n### 快速回顾\n1\n1) 作为一个良好的使用习惯，我们应该避免使用 `root` 用户。\n\
  2) 在命令前加上 `sudo` 可以允许用户拥有超级用户权限。\n3) 我们可以使用 `adduser` 命令加上用户名来添加用户。\n   - 1. 1.\
  \ 示例：`adduser nathan`\n4) 我们可以通过在用户名之前使用 `passwd` 命令更改用户的密码。\n   - 1. 1. 示例：`passwd\
  \ nathan`\n5) 要获得使用 `sudo` 的权限，用户必须先添加到配置文件，可以通过 `visudo` 命令进行编辑。\n6) 如果我们的 CLI\
  \ 变得太混乱，可以使用 `clear` 命令将其清理。\n7) 要结束会话并注销，我们可以使用 `logout`。\n\n使用我们在上一章中创建的新用户登录服务器。从现在开始，在本书的剩余部分中，我们将不再使用\
  \ `root` 用户 ID。\n\n让我们来看一些设置，看看我们的服务器性能如何。\n\n首先，我们可以查看系统的运行时间（uptime）。这在系统管理中非常有用。它能让你知道服务器已经运行了多久、有多少个用户登录以及系统的平均负载负载。\n\
  \n| 检查运行时间 |\n| :--- | :--- |\n| 命令 | `uptime` |\n| 结果 | 系统将显示运行时间和平均负载数据 |\n| CLI\
  \ 显示 | `[tidus@centos:~]$ uptime` |\n\n接下来，我们可以使用 `top` 命令查看系统上哪些进程占用了最多的内存。如果你的系统运行缓慢，这个命令可以帮助查看什么在占用系统资源。\n\
  \n前几行将为你提供系统资源利用情况的摘要，你可以按 CPU 或内存使用对进程列表进行排序，这让你能够快速看到服务器资源资源需求最大的地方。\n\n| 检查系统\
  \ CPU 使用率 |\n| :--- | :--- |\n| 命令 | `top` |\n| 结果 | 系统将显示占用最多 CPU 资源的进程 |\n| CLI\
  \ 显示 | `[tidus@centos:~]$ top` |\n\n要退出 `top`，请按 `control and c`。\n\n要检查系统的内存资源，可以使用\
  \ `vmstat` 命令。\n\n| 检查内存使用 |\n| :--- | :--- |\n| 命令 | `vmstat` |\n| 结果 | 系统将显示空闲和使用的内存量\
  \ |\n| CLI 显示 | `[tidus@centos:~]$ vmstat` |\n\n随着你对 `vmstat` 和 `top` 越来越熟练，你将能够在出现问题时确定哪些脚本或程序耗尽了系统资源。监控这些内容是一个良好的习惯，以确保使用率处于正常范围。\n\
  \n在较大的环境中，你可能想看到哪些用户登录了服务器。使用 `w` 命令可以为我们提供这些信息。\n\n| 检查用户 |\n| :--- | :--- |\n\
  | 命令 | `w` |\n| 结果 | 系统将显示服务器上的用户 |\n| CLI 显示 | `[tidus@centos:~]# w` |\n\n## 导航、创建目录和文件\n\
  \n部分内容将是对前面章节的复，但这种重复对于记住日常使用中频繁使用的命令非常重要。\n\n现在我们已经登录，使用 `pwd` 命令查看我们当前的目录。\n\n\
  | 查找你的当前目录位置 |\n| :--- | :--- |\n| 命令 | `pwd` |\n| 结果 | 系统将输出你所在的目录 |\n| CLI 显示\
  \ | `[tidus@centos:~]$ pwd/home/tidus` |\n\n注意，这次的目录与我们用 `root` 用户登录时不同。上一次我们在 `/root`，那是\
  \ root 的家目录。这次我们在 `/home/tidus`，这是用户 `tidus` 的家目录。\n\n提示：如果你以后需要回到家目录，请使用 `cd` 回到你的用户家文件夹。\n\
  \n现在我们已经在家目录下了了，让我们创建一个名为 `documents` 的新目录。\n\n| 创建新目录 |\n| :--- | :--- |\n| 命令\
  \ | `mkdir documents` |\n| 结果 | 系统将创建一个名为 documents 的子目录 |\n| CLI 显示 | `[tidus@centos:~]$\
  \ mkdir documents[tidus@centos:~]$` |\n\n使用 `ls` 命令列出我们家目录的内容，查看 `documents` 目录是否存在。\n\
  \n| 列出文件 |\n| :--- | :--- |\n| 命令 | `ls` |\n| 结果 | 列出当前目录下的文件 |\n| CLI 显示 | `[tidus@centos:~]#\
  \ lsdocuments` |\n\n通过使用 `ls`，我们现在看到除了 `documents` 目录外，我们的目录是空的。\n\n让我们利用之前章节中学到的知识练习导航技能，并进入\
  \ `documents` 目录。\n\n尝试使用命令：`cd Documents`\n\n你可能会发现它返回“cd: Documents: No such file\
  \ or directory.”Linux 是区分大小写的，这意味着 `Documents` 和 `documents` 是两个不同的东西。在使用 CentOS\
  \ 时你需要记住这一点，因为使用正确的大小写很重要。\n\n现在让我们用正确的方法操作。\n\n| 切换子目录 |\n| :--- | :--- |\n| 命令\
  \ | `cd documents` |\n| 结果 | 切换到 documents 目录 |\n| CLI 显示 | `[tidus@centos:~]$ cd\
  \ documents[tidus@centos: documents]$` |\n\n使用 `ls` 命令列出目录中的文件，你会发现它是空的。\n\n现在让我们通过\
