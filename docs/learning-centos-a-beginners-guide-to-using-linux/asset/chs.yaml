  \ nano 创建文件。\n\n### 使用 nano 创建和编辑文件\n\nNano 是 Linux 系统命令行界面（CLI）中非常有用的文本编辑器。由于我们在使用\
  \ CLI，nano 是面向键盘的，而不是鼠标。通过学习一些控制键，你将能够使用 nano 编辑文件。一旦你掌握了这些并学会了更多通过命令行使用 Linux，就可以转向像\
  \ vi 这样更高级的编辑器，它们很棒，但学习曲线较陡。\n\nNano 易于使用，对学者非常友好。它在大多数 CentOS VPS 配置中默认安装，但在虚拟机上可能需要安装。它是一个\
