  \n\n默认情况下，可以通过以下地址访问 webmin：\n\nhttp://myipaddress:10000\n\n如果没有提示登录，请在命令行界面（CLI）中输入以下命令在您的系统防火墙上打开该端口：\n\
  \n```\nfirewall-cmd –add-port=10000/tcp\n```\n\n如果您选择使用 webmin，可以在以下地址找到大量关于如何使用的文档和资源：\n\
  \n[`doxfer.webmin.com/Webmin/Main_Page`](http://doxfer.webmin.com/Webmin/Main_Page)\n\
  \n如果您选择通过此资源管理服务器，请将该链接作为使用此平台的资源。\n\n# 第 11 章\n\n## 理解权限\n\n要理解如何向用户和组分配权限，我们必须首先理解\
  \ Linux 权限的工作原理。一旦你建立了理解，它比确定 Windows Server 权限要简单得多。\n\n在 Windows Server 上，有多种权限类型可以分配。见下图：\n\
  \n![](img/00034.jpeg)\n\nCentOS 和其他 Linux 系统有三个基本的权限组和基本权限类型。\n\n### 权限组\n\n所有者\
  \ (Owner) – 所有者权限仅适用于文件或目录的所有者。\n\n组 (Group) – 组权限仅适用于分配给该文件或目录的组。\n\n所有用户 (All\
  \ Users) – 所有用户的权限适用于系统上的所有用户。这是你需要最小心的权限组。\n\n### 权限类型\n\n读取 (Read) – 读取权限是指用户读取文件内容的能力，但不允许他们写入或保存更改。\n\
  \n写入 (Write) – 写入权限是指用户写入或修改文件或目录的能力。\n\n执行 (Execute) – 执行权限影响用户执行文件或查看目录内容的能力。\n\
  \n我们可以通过使用命令行界面（CLI）和我们熟悉的 `ls` 命令配合 `-l` 标志来查看并检查现有权限。\n\n| 列出详细文件的示例 |\n| :---\
  \ | :--- |\n| 命令 | `ls -l` |\n| 结果 | 列出当前目录下的文件详细信息 |\n| CLI 显示 | `[tidus@centos:~]$\
  \ ls –l-rw-rw-r-- 1 tidus tidus 196 Feb 13 20:48 notes.txt` |\n\n解析输出内容：\n\n`-rw-rw-r--\
  \ 1 tidus tidus 196 Feb 13 20:48 notes.txt`\n\n显示的第一个部分 `-rw-rw-r--` 显示了文件的权限。\n\
  \n当我们使用 `ls –l` 命令查看权限时，可以通过以下关键点来理解它们。\n\n| 理解文件权限 |\n| :--- | :--- |\n| 读取 (Read)\
  \ | `r` |\n| 写入 (Write) | `w` |\n| 执行 (Execute) | `x` |\n\n当我们查看 `notes.txt` 文件的权限时，我们可以根据输出\
  \ `-rw-rw-r--` 得出几点观察。\n\n前三个字符 `-rw` 告诉我们用户 `tidus` 对文件 `notes.txt` 读取和写入权限。第二组字符显示组\
  \ `tidus` 也具有读取和写入权限。最后一组显示了所有用户的权限。从输出来看，所有用户都可以读取文件，但不能进行写入。\n\n### 使用二进制引用设置权限\n\
  \n现在我们理解了权限组和权限类型的基本知识，使用二进制引用设置权限应该非常简单。重要的是，当你以这种方式设置文件权限时，它是通过三个整数完成的。整数是一个整数数（例如：1、2\
  \ 和 4）。\n\n要设置权限，我们必须确定 `rwx` 字符串的二进制表示。RWX 字符串是允许我们设置读取、写入和执行权限的二进制表示。\n\n我们必须使用下表计算我们想要为文件或目录设置权限。\n\
  \n| 文件权限：二进制表示 |\n| :--- | :--- |\n| 读取 (Read) | 4 |\n| 写入 (Write) | 2 |\n| 执行 (Execute)\
  \ | 1 |\n\n我们通过将整数相加得到权限数字。我们必须对三个权限组中的每一个执行此操作。\n\n例如：\n\n读取访问 = 4\n\n读取和写入访问 =\
  \ 6\n\n读取、写入和执行权限 = 7\n\n每个权限组都需要一个数字。我们为设置权限生成的数字将是 3 位。记住，顺序是用户、组和所有用户。\n\n练习\
  \ 1：权限 777 意味着什么？\n\n这意味着用户、组和所有用户都具有读取、写入和执行权限。使用 `777` 作为权限设置对于建立强大的安全性并不好。\n\n\
  练习 2：权限 655 意味着什么？\n\n这意味着用户具有读取和写入权限。组具有读取和执行权限。所有用户也可以读取和执行权限。\n\n练习 3：权限 444\
  \ 意味着什么？\n\n这意味着用户、组和所有用户对文件仅有读取权限。\n\n练习 4：权限 755 意味着什么？\n\n这意味着用户具有读取、写入和执行权限。组和所有用户只能读取和执行。这通常是为使用\
  \ WordPress 的用户推荐的 Web 权限设置。\n\n在我们概述应用权限的步骤之前，我们应该首先学习如何传输文件。该过程将为应用程序打开大门，将在其中学习如何设置权限。\n\
  \n### 概述：文件和目录的所有权\n\n在本书的接几页中，我们将提供一些示例让 tidus 更改文件和目录的权限。当你准备好时，让我们用之前学的命令创建一些示例文件和目录。\n\
  \n在 tidus 的家目录下创建一个名为 ‘files’ 的文件夹：\n\n```\nmkdir /home/tidus/files\n```\n\n使用 nano\
  \ 创建名为 ‘test.txt’ 的文件：\n\n```bash\nnano /home/tidus/files/test.txt\n```\n\n在 nano\
  \ 内部，你可以根据此练习输入任何内容。\n\ntidus 已经拥有了 files 目录，但如果他没有，你可以使用以下命令。你会注意到使用了 `-R` 标志。这意味着所有适用于所有文件和子目录。\n\
  \n| 更改目录的所有者 |\n| :--- | :--- |\n| 命令 | `sudo chown tidus -R /home/tidus/files`\
  \ |\n| 结果 | 系统将 tidus 设为目录的所有者，以及所有子目录。 |\n| CLI 显示 | `[tidus@centos:~]$ sudo chown\
  \ tidus -R /home/tidus/files` |\n\n\n\n\n这太简单了！现在我们需要创建一个新的用户账户，该账户只能操作我们创建的数据库。这可以提供良好的安全性并对数据库权限进行更好的控制。\n\
  \n对我来说，我将把这个新用户账户命名为 `wpuser`。在下面的命令中，如果你愿意，可以使用不同的名称，并将 `password` 更改为安全的密码。在我们连接\
  \ WordPress 到数据库时，我们需要这个密码。\n\n```\nCREATE USER wpuser@localhost IDENTIFIED BY ‘password’;\n\
  ```\n\n现在你已经有一个数据库和一个用户账户，但该用户还无法访问 wordpress 数据库。我们需要通过以下命令授予该用户访问 wordpress 数据库的权限。\n\
  \n```\nGRANT ALL PRIVLEGES ON wordpress.* TO wpuser@localhost IDENTIFIED BY ‘password’;\n\
  ```\n\n我们的用户现在有了访问数据库的权限，但我们需要执行名为 `flush` 的操作，以便 MySQL/MariaDB 知道我们所所的权限更改。使用以下命令：\n\
  \n```\nFLUSH PRIVLEGES;\n```\n\n既然我们已经执行了这些命令，可以使用以下命令退出 MySQL/MariaDB：\n\n```\n\
  exit\n```\n\n很简单对吧？使用 MySQL 和 MariaDB 还有很多东西需要学习。我建议你继续扩展这些主题的知识，因为它们是非常受欢迎的技能。\n\
  \n# 第 13 章\n\n## 准备并安装 WordPress\n\n有许多不同的内容管理系统和平台可以安装。根据 2015 年的报告，在线所有网站的近 25%\
  \ 使用 WordPress。这使其成为最常用的平台之一。除了非常流行之外，通过在我们的服务器上安装它，我们还可以从中中学到很多知识，供你以后在使用其他系统部署网站时参考。我们已经知道了如何创建数据库和用户，现在我们需要知道如何安装这样的包。\n\
  \n在安装 WordPress 之前，根据你的 VPS 或虚拟机的安装情况，你可能需要安装几个包。使用以下操作确保你已经有了正确的配置。\n\n我们首先需要加载的是\
  \ `php-gd`。WordPress 和其他平台需要它来正确地调整缩略图的大小。我们可以通过以下命令安装它：\n\n```\nsudo yum install\
  \ php-gd\n```\n\n在提示时，务必输入你的密码并按 y。\n\n为了让 Apache 能够看到新模块，我们需要重启 `httpd`。\n\n```\n\
  sudo service httpd restart\n```\n\n现在我们还需要几个包。第一个是 `wget`。Wget 是一个从 Web 服务器收集内容的程序。它允许我们从网络下载文件到我们的服务器。要安装\
  \ `wget`，使用以下命令：\n\n```\nsudo yum install wget\n```\n\n同样，在提示时，务必输入你的密码并按 y。\n\n\
  我们下一个用于简化流程的工具叫做 `rsync`。Rsync 是一种允许我们在计算机系统中保留文件副本并将文件同步到其他文件夹的实用。要安装 `rsync`，使用以下命令：\n\
  \n```\nsudo yum install rsync\n```\n\n## 下载 WordPress\n\n我喜欢在教程中使用 WordPress 的原因之一是它对新用户来说很容易配置，而且\
  \ WordPress 团队始终将最稳定的软件版本放在同一个链接上。\n\n在继续之前，确保你正处于主目录。记住，你可以随时在 CLI 中输入 `cd` 回到主目录。\n\
  \n现在我们已经确定在主目录下了，可以使用以下命令使用 `wget` 获取最新版本的 WordPress：\n\n```\ncd ~ && wget http://wordpress.org/latest.tar.gz\n\
  ```\n\n这会下载 WordPress 的压缩版本，我们现在需要使用 `tar` 命令将其解压。在 Linux 中，`tar` 代表早期的 tape archive（磁带归档），当时大多数系统管理员会将文件备份到磁带驱动器中。对于我们的目的，它允许我们从下载中收集压缩文件并将其解压到我们的主目录。我们可以通过以下命令实现：\n\
  \n```\ntar xzvf latest.tar.gz\n```\n\n在你的主文件夹内部，现在将有一个名为 `wordpress` 的目录。要完成安装，我们需要将文件移动到\
  \ Apache 文档根目录（`/var/www/html`）。使用方便的 `rsync` 工具，这非常简单。使用以下命令将文件同步到 Apache 目录。\n\
  \n```\nsudo rsync –avP ~/wordpress/ /var/www/html/\n```\n\n记住，大小写很重要。此命令中的一个微小错误都可能导致你今后出现问题。命令运行后，`rsync`\
  \ 将执行工作并将所有文件复制到 `/var/www/html` 目录。\n\n我们还有一件事要做，我们需要为 WordPress 创建一个 uploads 文件夹来存储文件。使用我们之前用过的\
  \ `mkdir` 命令可以让这变得简单。\n\n```\nsudo mkdir /var/www/html/wp-content/uploads\n```\n\
  \n## 更改所有权、权限和编辑文件的回顾\n\n现在我们还有两个步骤来完成一个正确的配置。我们需要更改 WordPress 文件和文件夹的所有权权限。这将增加安全性并允许\
  \ WordPress 按照预期运行。为了做到这一点，我们将使用书中早些解释过的 `chown` 命令。\n\n```\nsudo chown –R apache:apache\
  \ /var/www/html/*\n```\n\n| 更改 Apache Web 目录的所有者 |\n| :--- | :--- |\n| 命令 | `sudo\
  \ chown –R apache:apache /var/www/html/*` |\n| 结果 | 系统将 `/var/www/html` 目录及其子目录的所有权更改为\
  \ apache |\n| CLI 显示 | `[tidus@centos:~]$ sudo chown –R apache:apache /var/www/html/*password\
  \ for tidus:[tidus@centos:~]$` |\n\n现在我们的最后一步是配置 WordPress 文件，它将连接我们到我们创建的数据库。确保你记得我们设置的数据库名称、用户名和密码。\n\
  \n首先，我们需要切换到 `/var/www/html` 目录。\n\n| 切换目录 |\n| :--- | :--- |\n| 命令 | `cd /var/www/html`\
  \ |\n| 结果 | 系统将我们移动到 html 目录 |\n| CLI 显示 | `[tidus@centos:~]$ cd /var/www/html[tidus@centos:\
  \ html]$` |\n\nWordPress 使用一个名为 `wp-config.php` 的文件连接数据库。在安装过程中，提供了一个示例文件。我们需要复制该文件并用我们的数据库设置进行配置。\n\
  \n| 复制文件 |\n| :--- | :--- |\n| 命令 | `sudo cp wp-config-sample.php wp-config.php`\
  \ |\n| 结果 | 系统将该文件复制为具有所需文件名的新文件 |\n| CLI 显示 | `[tidus@centos: html]$ sudo cp wp-config-sample.php\
  \ wp-config.php[tidus@centos: html]$` |\n\n现在我们有了可以修改的配置文件，可以使用 `nano` 进行编辑。\n\n\
  ```\nsudo nano wp-config.php\n```\n\n为了连接数据库，我们需要在该文件中修改的只有以下字段：`DB_NAME`、`DB_USER`\
  \ 和 `DB_PASSWORD`。这将允许网站与数据库通信。查看下一页获取我的配置示例。\n\n注意：你不应该将 password 作为密码，这仅在书中作为指南。\n\
  \n| WP-config.php 配置 |\n| :--- |\n| `/** WordPress 的数据库名称 */define('DB_NAME', 'wordpress');/**\
  \ MySQL 数据库用户名 */define('DB_USER', 'wpuser');/** MySQL 数据库密码 */define('DB_PASSWORD',\
  \ 'password');` |\n\n这些是你在该文件中应该修改的值。完成后，从 `nano` 关闭并保存更改。\n\n## 通过浏览器访问 WordPress\n\
  \n我们在这一部分需要做的最后步骤是通过浏览器访问 WordPress。要执行操作，在浏览器中输入你的 IP 地址（`http://myipaddress`）。你应该看到一个如下所示的屏幕。\n\
  \n![WordPress Web 安装](img/00035.jpeg)\n\n填写所需信息，然后点击“安装 WordPress”按钮。这将确认安装并自动在数据库中创建表。\n\
  \n要继续，点击页面底部的“登录”按钮。\n\n# 第 14 章\n\n## 结语\n\n恭喜！在不到 85 页的内容里，我们建立了一些 CentOS 7 基础知识，并利用这些信息构建了一个基础\
  \ Web 服务器。\n\n\n\n\n当然，还有很多需要学习的内容，但这只是一个开始。随着你不断进行实验和学习，本指南将让你熟练地在 CentOS 7 上进行和安装软件包。希望现在使用命令行界面已经不再那么可怕了。\n\
  \n如果你对进一步学习有任何问题，请随时通过 `info@nathanneil.com` 向我发送电子邮件。\n\n感谢，并祝你在学习的道路上好运！\n\n"
