- pgno: 177
  md: 'If you are interested in experimenting with the code under another UNIX implementation
    that supports loadable shared libraries, refer to the **Readme** and **Porting**
    documents in the distribution `../source/smbwrapper` directory.


    UNIX commands that have been successfully tested against remote CIFS/SMB service
    includes: emacs, tar, is, cm, cp, spnc, du, cat, rm, mv, less, wc, head, tail,
    bash, tschk, mkidir, rmdir, vi, edit, and diff.


    **smbwrapper** is not installed by default. In order to build and install the
    code


    ```

    $ make smbwrapper

    ```


    Once this is built and installed, initiate an *smbwrapper* subshell by invoking
    the **smbash** command. **smbash** will prompt you for a user name and password
    (Example 13.2). The user name and password is sent to server supporting *user-level
    security*.


    # Example 13.2 smbsh Session


    ```

    $ smbash

    Username: <user name>

    Password: <password>

    ```


    Within the **smbash** subshell, you can connect to CIFS/SMB servers by specifying
    a path that is rooted with the special directory `/smb` and followed by a *server
    name* and *service*. The `/smb` root lets lets the smbash subshell know that you
    are requesting access to an SMB service versus a local file or device resource
    (Example 13.3).


    ```

    /smb/<server>/<service>

    ```


    # Example 13.3 List Services on Remote SMB Server


    ```

    $ ls /smb/wizard

    smbtar

    ```


    Another method for interacting with remote CIFS/SMB file shares is provided by
    the smbtar script. This is a wrapper for smbclient that simplifies using smbclient''s
    *tar* options. You can use **smbt** to back up and restore files residing on a
    remote file share (Example 13.4). The target file share may reside under a Windows
    platform or another Samba server. smbtar can also be incorporated into UNIX shell
    scripts to automate backup operations using timed batch services like cron.


    # Example 13.4 smbtar - Dump & Restore


    Incremental Dump


    ```

    smbtar -s <NetBIOS name> -p <password> -x <Share Name> \ <device> \-I

    ```'
