  md: 'namespace and maintained as a set. Host tables work well for small collections
    of networked machines and in situations where you want to enforce a different
    view of the namespace on particular machines.


    Larger networks require automated name service mechanisms to guarantee that namespace
    uniqueness remains consistent over large populations of computers. Automation
    is also required to ensure that namespace updates can be administered in a distributed
    manager and that changes are quickly reflected in all participating machines.
    In the Internet world, automated name resolution is provided by the Domain Name
    Service (DNS). Windows supports a similar NetBIOS based name service known as
    Windows Internet Name Service (WINS).


