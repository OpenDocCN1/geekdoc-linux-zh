  md: 'explore Samba authentication and access control mechanisms. We''ll look at
    how Samba can be used to integrate and synchronize UNIX and Windows account information,
    interact with alternative authentication services, and reduce the use of clear-text
    passwords on the network.


    # # Authentication Mechanisms


    Samba supports four basic ways to regulate a network client''s access rights to
    a particular resource. First, Samba can allow or deny connection requests based
    on the client''s IP address. This provides a coarse level of security. Any user
    with an account on a client that has an authorized IP address will be permitted
    to share the. Second, Samba can check the client''s preferred clear-text username
    and/or password against a UNIX authentication resource like /etc/passwd, NIS,
    or Kerberos. Clear-text passwords are authenticated by Samba by using the associated
    UNIX cipher for verifying the credentials against the resource. Third, Samba can
    negotiate NTLM encryption with the client and validate the password against /usr/local/samba/private/smbpasswd
    file. This option requires the maintenance and synchronization of both the server''s
    passwd database and the smbpasswd database. Lastly, Samba can pass the client''s
    credentials to a third-party authentication server or an NT domain controller.
    Once the credentials have been validated by the server, access is granted to the
    requested resource.


    # # Authentication by IP Address


    In the "Security Access Control" of Chapter 6, we discussed restricting access
    to shares by client IP address using the hosts allow and hosts parameters. Specify
    trusted or forbidden computers as parameter values byBIOS name, IP address, or
    by using subnet mask. The except keyword can be used in conjunction with a subnet
    mask or IP number card format to include or exclude individuals from a group (Example
    7.1).


    Example 7.1 Restricting Access by Host Name or Host IP Address


    ```

    hosts allow = 192.168.except 192.168.0.10

    hosts deny = frodo, bilbo

    hosts allow = 149.125.10.0/255.255.255.255

    ```


    # # Authentication Level


    The modulus for user-level authentication is determined by the global security
    setting. The security parameter accepts one of four defined values, share, user,
    server, and domain, in reality Samba supports only two levels of user authentication,
