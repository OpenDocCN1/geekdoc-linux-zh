    # # Elections


    The list of available shares on each computer in a workgroup or domain is broadcast
    by the owning system to the network community. Because the announcement is via
    a network broadcast, a *local master browser server* is required on each subset
    to collect and collate the list of shares into a browse list. The local master
    browser is elected from a set of computers on the subnet that is capable of maintaining
    and serving browse lists. The election process is a network-bidding feud where
    the ante''s OS level and revision, its desire to be a master browser. This ante
    or'
