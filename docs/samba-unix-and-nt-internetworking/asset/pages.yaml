    # [printers] Share


    Samba provides a simple mechanism for making all printers identified in the UNIX
    printer configuration file available. The [printers] share is a special smb.conf
    section similar to the [homes] share discussed in Chapter II. When an SMB connection
    setup is requested by the server, Samba first scans smb. attempting to match the
    request to one of the specifically named shares. If a match is not found, it will
    then scan the passwd database, attempting to locate a match based on the client
    user. If no match and a [printers] share is defined in the configuration file,
    it will scan the Unix printer configuration file to find a match. If a printer
    name match is found, Samba grants access to a temporary [printer name] share created
    by cloning the [printers] sections. A sample [printers] share is listed in Example
    12.1


    Example 12.1 Sample [printers]


    ```

    [printers]

    path = /var/pool/samba

    writeable = no

    guest ok = yes

    printable = yes

    ```


