    | | microsoft.com vnet.com |


    A hierarchical naming resolving protocol BIND is used to recursively query domain
    name servers until a domain is resolved to an IP number. In the DNS hierarchy
    (Figure 2.3), upper-level domain servers need only record the names of the next
    level of the name tuple with the IP names of the servers that resolve addresses
    for level. All name servers must know the addresses of the top level Internet
    servers which maintain a set of well-known top-level domain names (Table 2.4).
    The DNS system supports local management of the namespace and ensures timely information
    to the network at large.


