    In the NetBIOS world over TCP/IP (NBT) supported by Samba, NetBIOS names are registered
    and resolved in one of three ways. The first and simplest method is to use a table
    that maps NetBIOS names to IP addresses. This table is affectionately known as
    the LAN Manager Hosts (LMHOSTS) table. Each line in the LMHOSTS table matches
    a NetBIOS resource name to its IP address (Example 8.2).


    # Example 8.2 Sample Windows LMHOSTS Table


    ```

    149.110.5.12 Wizard # PRE #DOM:EYRIE

    149.110.5.2 Dragon

    149.110.5.2 Dhyana

    149.110.5.1 Tao

    149.110.5.5 Rose

    ```


    The second method registers and resolves NetBIOS names using network broadcasts
    (Figure 8.1). To make its presence, a machine broadcasts its name over the network
    UDP port 137. This occurs at system boot time when network services are starting.
    The machine then waits a response indicating whether its chosen name is accepted
    or already in use by another machine (Figure 8.2). The process may be repeated
    a number of times, because broadcast delivery is not guaranteed. Upon successful
    registration, the NetBIOS name and address are cached in a collaborative manner.
    NetBIOS name resolution queries are handled in a similar fashion. This method
    can break down quickly on large, complex networks due to routing problems and/or
    heavy broadcast traffic.'
