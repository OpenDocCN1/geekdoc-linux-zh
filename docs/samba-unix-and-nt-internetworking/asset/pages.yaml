    # What Samba Can Do For You


    We have already talked about how Samba represents a UNIX implementation of the
    SMB

    protocol that facilitates UNIX file system and printer sharing with Windows and
    LAN

    Manager clients. What we have not yet discussed is how tightly Samba integrates

    IX into these environments.


    Samba implements domain and group functionality through two UNIX services,

    nmbd and smbd. The nmbd daemon fulfills a dual role as NetBIOS Name

    Service and NetBIOS Browser Service. The smbd daemon provides the bulk of the
    SMB

    protocol implementation for sharing resource. These daemons along, with ancillary

    administrative tools and client commands, provide:


    +   - NBNS, WINS, and DNS gateway services

    - Routed network browser service

    - Authentication and authorization gateway between UNIX and Windows domains

    - CIFS-compliant UNIX file sharing in Windows and LAN Manager networks

    - Unicode character sets and name mapping

    - Opportunistic locking visible to network file systems

    - UNIX printer sharing in Windows and LAN Manager networks, including automated

    driver installation for Windows 9x clients

    - UNIX access to Windows file systems

    - UNIX acting as a full domain client

    - UNIX acting as a minimal primary controller.


    # Future


    The Samba Team is actively improving and refining the Samba code base, whose quality

    has recently been substantiated by a series of benchmarks performed by Sm@rt Reseller

    in January and April 1999. System test staff at Sm@rt Reseller ran the Ziff-Davis

    NetBench benchmark against Samba 2.0 running on Red Hat Linux 5.2 and on Pacific

    Hitech TurboLinux 3.0.1. The results were compared against Windows NT 4.0 and
    Novell

    NetWare 5.0 running on similar hardware. In both tests, the Samba/Linux combination'
  merge: -1
