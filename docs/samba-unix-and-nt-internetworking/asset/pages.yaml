    # Passwords


    Passwords are the backbone of UNIX and Windows computer systems. Therefore, most
    of us spend a great deal of time fine-tuning and hardening the password infrastructure.
    This usually means regularly checking password databases for periodically updating
    password rules and dictionaries, keeping clear-text passwords off the network,
    securing users on proper password use, and wrestling with users over general password
    policies. For most, it''s a never-ending, lackluster job.


    None wants to increase the complexity of maintaining password services or the
    security we want to put in place. Unfortunately, UNIX and Windows do not play
    by the same rules when it comes to passwords. First, they employ one-way algorithms
    for encrypting passwords. LAN Manager servers use unencrypted password, Windows
    uses NT and MD4 hash of a Unicode version of the password, and uses modified DES
    algorithm to encrypt the password with a random salt. To further complicate matters,
    older Windows systems presented clear-text passwords during session setup. Fortunately,
    Samba provides a number of options for dealing with the disparity between UNIX
    and Windows passwords.


