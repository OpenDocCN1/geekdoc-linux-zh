    # # Access Control


    In the previous section on domains we talked about how domain user and group credentials
    and rights are stored in the domain controller'' Security Account Manager (SAM)
    database. Rights are rules that govern access to all the resources in the domain.
    Rights can be defined per individual or groups of individuals that share similar
    needs (Figure 3.12). Group rights have both local and global scope. Membership
    in a global group permits access to resources that reside in multiple domains.
    Global group rights are governed by the interdomain trust relationships. Local
    groups are restricted to resources within a single domain. Access may also be
    limited by local SAM information that exists on nondomain controllers and NT workstations.


