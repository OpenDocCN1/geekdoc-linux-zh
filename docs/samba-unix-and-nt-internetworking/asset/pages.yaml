    The Microsoft Windows success story can be easily attributed to its point-and-click
    interface and low-cost hardware platform. The widespread familiarity with the
    Windows interface, its rich set of productivity tools, and its commodity hardware
    component base have made it the predominant world standard in single user desktop
    computing. This is pretty impressive feat considering it is less than half the
    age of UNIX. Microsoft has done a very job of embracing networking technologies,
    incorporating standards, and enhancing the user interface to extend productivity
    from the desktop to the workgroup and most recently the Internet. This began with
    peer-to-peer networking in Windows for Workgroups. Next came interoperability
    with Novel-based networks, client/server networking with Windows NT1 and Unix,
    and strong connectivity with tools such as Internet Explorer.


    On the server side, Microsoft is still relatively new. Windows NT (New Technology)
    is only a few years old, yet in this short time it has captured a significant
    portion of the database/client market. Windows NT incorporated bits and pieces
    of VMS, OS/2, and Windows architectures to provide a multitasking networking service
    designed for tighter integration of office and administrator group LANs under
    a new structure called domains. NT version 4.0 provided Windows-based networks
    closer ties with the Internet by including common Internet services like DNS,
    FTP, web, and SMTP-based electronic mail. Windows 2000 will extend this functionality
    by including additional internet tools like LDAP directory services, Kerberos
    authentication, and public-key services, each of which is closely linked to extending
    networking and security services.'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'Although touted as the UNIX-killer, Windows NT has to fully replace UNIX services
    in the back room. Likewise UNIX does not provide the desktop support services
    and friendly user and administration interfaces that have been the hallmark of
    Windows. The result is that both operating systems are common fixtures in most
    shops. The challenge, then, for the system administrator is how best to simplify
    the administrative and management tasks of both operating systems, and how to
    facilitate seamless user access to the resources that reside in each. This is
    where Samba become essential tools to smoothing the rough edges of UNIX''s coexistence.


    # # Planning


    Before we jump into the nuts and bolts of Samba installation and configuration,
    we need to look carefully at the existing infrastructure, identify the areas and
    inconsistencies to be resolved, and develop an architecture that will allow incorporation
    of new technologies such as Windows 2000. Most architecture upgrades are not complete
    replacements for existing systems, so we need an implementation strategy that
    permits coexistence of older services alongside new development. Begin by asking
    questions like:


    +   * Is the existing OS primarily UNIX or Windows?

    * Are in-house systems administration skills predominantly UNIX or Windows?

    * What resources need to be accessible in both OS worlds?

    * Is the focus for resource sharing directed at desktops, servers, or both?

    * What desktop clients need to be supported?

    * Is mobility an issue?

    * Will there be an impact on existing business models?

    * Is scaling an issue concerning number of users, desktops, and/or servers?

    * What level of availability is required?

    * Will resource sharing require changes in namespace?

    * Is it necessary to synchronize accounts and passwords?

    * What level of access controls is required?

    * Is the setup domain, workgroup- or realm-based?

    * Will network topology affect browsing and access control


    These are only a few of the issues that will require scrutiny before adding Samba
    to an environment. Since there are underlying complexities to each of these, we''ll
    look closer at a few of them in the next sections of this chapter.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Desktop Issues


    Almost everyone has a computer these days. Most of us have access to more than
    one: palmtop, handheld, laptop, home PC, office workstation, and network server,
    the list goes on on. We spend much of our time computer hopping from one network
    island to the next. The boundaries between the machines, networks, and services
    we have blurred to the point where it is difficult to pinpoint which particular
    resources reside. We find ourselves wondering if we left memo on the office workstation
    or the PC in the den at home?


    The challenge for the system administrator is in providing an environment which
    assists mobile computer users in maintaining consistent access to documents, mail
    folders, address books, web certificates, bookmarks, and other application-preference
    data they move from machine to machine. The task of synchronizing state is complicated
    by variations in data formats and network protocols when the set of machines includes
    UNIX and Windows operating systems.


    A twist on the problem of maintaining individual state between multiple computers
    is to manage on a single computer by multiple people. Consider the public in airports,
    libraries, university labs, and cyber cafes. What level of environment personalization
    should be allowed, if any? How will environment state be maintained and reset
    after each use to ensure both privacy and security? If personal profiles are going
    to be maintained, what are the scaling issues regarding account management and
    storage?


    # Enterprise Computing Systems


    The evolution of bringing legacy information services to the Internet community
    has seen most enterprises away from propriety, restricted access, and network
    computing architectures to open distributed computing models. This has most often
    facilitated by incorporating UNIX servers into the network to mitigate the result
    of increased operating system heterogeneity in the data center, which must be
    managed by systems administration and operations.


    The addition of new operating systems usually includes additional complexity in
    maintaining a consistent namespace of users, machines and services. For example,
    differences in supported character sets require the formulation of intricate mappings
    between the various users. Large users may require duplicating and managing the
    user account and password spaces on each platform. Users may also be required
    to log in and logout repeatedly as they access resources that reside on various
    systems.


    # Domains and Realms


    In many organizations the authentication, authorization, and trust models built
    into the computing and networking infrastructure closely match those represented
    in organizational structure and processes. Trust between machines is as critical
    as trust between employees. A new operating system can throw a kink into day-to-day
    operation when it does not fit within the existing structure. Transitive trust
    rules that follow administrative roles usually work well between like operating
    systems as, for example, trust between UNIX Kerberos realms or trust between Windows
    NT'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'The same capability is not always seamless when one is trying to map access
    control and group relationships between dissimilar architectures. Windows 2000
    brings additional complexity into these trust mechanisms with its hybrid authentication
    and authorization framework. Incorporating Windows 2000 into existing NT domain
    topologies requires careful planning for how domain relationships will be migrated
    into the new domain tree and forest model. There are also a number of issues which
    must be resolved regarding two-way synchronization between Windows 2000 and UNIX
    Kerberos namespaces.


    # Passwords


    An additional side effect of the mobility problem just described is when one uses
    multiple computers, there tend to be multiple accounts and passwords corresponding
    to each platform. It is a real challenge for users and administrators to keep
    accounts and passwords synchronized between diverse operating systems. There is
    also an additional security exposure in encryption algorithms used on one system
    may not be supported on the other. The result may mean transmitting clear-text
    passwords over unsecured networks or maintaining password lists on unsecured workstations.


    # Sharing Resources with Samba


    Most of the issues described above can be resolved through the use of mutually
    supported tools like Sun''s Network File System (NFS) or Novell Networks, which
    provide a means for sharing files, printers and access controls between UNIX and
    Windows. A robust and cost-effective alternative is Samba, developed by Andrew
    Tridell. Samba is a drop-in replacement for the file- and print-sharing services
    normally provided by Windows NT or LAN Manager-based systems. Samba augments these
    services by also using UNIX file systems and providing in the mix of shared resources
    Other Samba services include NetBIOS name service and limited NT Domain Controller.
    Samba has grown in popularity; it is now supported by over 100 commercial vendors
    worldwide. It has been ported to most flavors of UNIX as well as proprietary operating
    systems like VMS and MVS.


    In the next two chapters we will review the protocols and system services in UNIX
    and Windows that are critical to understanding and mastering Samba. These chapters
    will benefit system administrators and programmers who may be unfamiliar with
    one or the other of these operating systems. The remainder of the text will focus
    on Samba architecture, installation, configuration, and support tasks.


    # Chapter 2: UNIX Overview


    # Overview


    In the 90s the adage was never to trust anyone over 30. UNIX is quickly approaching
    the age of 30-something, contrary that I believe we can rely on UNIX''s consistent,
    open and portable computing architecture well into its next decade. Over years
    UNIX has evolved into a robust cross-platform, multi-tasking, multi-processing
    operating system system with a rich application and programming base. In this
    chapter we will focus on the UNIX tools and services required to support Samba.
    We will also cover general networking concepts in interworking UNIX and Windows
    resources. Those readers who have already earned their UNIX wizard''s merit badge
    may want to skip this chapter and go right to the next chapter, Windows.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'Architecturally, UNIX can best be visualized as a tiered set of services and
    interfaces (Figure 2.1). At the foundation of the structure resides the *kernel*,
    which is responsible for managing the interfaces between all hardware components
    and the execution environment. This includes scheduling work, allocating memory,
    moving data, and informing tasks when various system events occur. On top of the
    kernel layer resides the *shell*, of which there is more than one. It is essentially
    a command interpreter that takes input, processes requests to services of the
    kernel on behalf of the user. The penthouse level of UNIX comprises the user interface.
    Here reside all the commands, scripting languages, graphical interfaces, and utilities
    that enable the end-user to interact with the resources provided by the operating
    system. An important concept to remember when working with UNIX is that the general
    interface between all the system objects is every object abstracted as a file.
    This means that all operations are file operations regardless of whether the target
    is hardware, data, memory, or running tasks.


    ![](img/fefda0da589a61a5ed84314561e6844b_14_0.png)


    **Figure 2.1**: UNIX Command, shell, kernel structure


    # # Services and Daemons


    Each running task, with its associated address space, is called a *process*. The
    group of active processes running under UNIX is analogous to the generations of
    a family tree. *Child* processes are begotten by *parent* processes. Processes
    are born, live out their lives, and then pass away. Occasionally they may run
    away. The first process to run every UNIX system is called *init*, from which
    all process generations owe their existence. Like any living grandparent, *init*
    takes in processes that want to take over the CPU. During the course of its life,
    each process needs the guidance of a scheduler to ensure that every process receives
    its fair share of CPU time. The system administrator acts as the overseer of the
    process universe, wielding control over the lives and processes.


    Every process in the UNIX universe is christened with a positive integer called
    the *Process Identifier* (PID). The PID is a vector index in the process table
    maintained by the kernel. PIDs are unique and allocated in a somewhat random fashion.
    Process table entries point to per-kernel data structures which define the attributes
    and values associated with the given process (Table 2.1). The attributes of active
    processes can be interrogated from the command line using the ps command (Example
    2.1).


    **Table 2.1**: Sampling of Process Attributes'
