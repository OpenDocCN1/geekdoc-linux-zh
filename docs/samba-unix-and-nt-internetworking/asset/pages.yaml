  md: 'X/Open CAE Specification C209 Microsoft, in collaboration with a number of
    computing and networking vendors, defined an enhanced version of SMB under a new
    title, the Common Internet File System (CIFS) protocol. CIFS version 1.0 has been
    submitted as a draft to the Internet Engineering Task Force (IETF) RFC.


    SMB is a connection-oriented protocol implemented on the NetBIOS API. The protocol
    provides a mechanism for Windows consumer and server applications to communicate
    in a request/response manner over a virtual circuit. The internal structure of
    each request block is represented as a string of Intel format multi-byte values
    ordered significant byte each with a fixed-length header, followed by a variable
    set of parameter fields, and a data buffer. The SMB command protocol can easily
    be broken down into four types: request, session, file, printer, and message.
    SMB session commands are used to set up a virtual circuit and validate access.
    The file and printer commands permit an operation to operate on files and spool
    to remote printers. Message commands provide a means for passing alert, control,
    and informational messages between the consumer and server applications.The simplified
    SMB session described in Example 3.3 will give a feel for how SMB sessions are
