    # Running Daemons


    If you are confident that all network communication are functioning correctly,
    the next step is to check the Samba smbd and nmbd daemons are running and listening
    for connections. Display the process status of smbd and nmbd with the ps command
    (Example 15.4).


    Review inconfig (see "Configuration Files" section) to verify that the daemons
    will be spawned when SMB services are requested. Check the smb.log and nmbl.log
    files in /usr/local/samba/var for diagnostic messages indicating any startup or
    communication anomalies.


    # Example 15.4 ''ps'' Check Daemon Process Instance


    ```

    $ ps -ef | grep smbd

    root 448 1 0 07:25:00 /usr/local/samba/bin/smbd -D

    ```


    ```

    $ ps -ef | grep nmbd

    root 446 1 0 07:25:00 /usr/local/samba/bin/nmbd -D

    ```


