  md: 'System sluggishness related to IO can be monitored by the UNIX iostat command.
    Use the -d option to display disk IO activity. For each disk, statistics include
    the number of transfers per second, bytes transferred per second and milliseconds
    per average seek. Note that not all drive types report times. You can also specify
    a time interval and count for recording activity snapshots now.


    ```

    # iostat -d [drive ...] [interval] [count]

    ```


    Take a look at Samba locking options. For shares that require locking, it is a
    good idea to make sure opportunistic locking (oplock) parameters are enabled.
    Allow clients to use aggressive caching and achieve performance improvements over
    standard locking by as much as 30%. Also consider disabling strict locking. When
    enabled, strict locking directs the server to check status on file access.


    The majority of network tuning should be handled at the OS level. Samba provide
    a socket option for adjusting tcp and socket settings like buffer size and keep
    alive (Time 15.5). The tcp_nodelay value is the only enabled by default. Any value
    adjustments made with these parameters need to fit corresponding OS level


    ```

    socket option = <value list>

    ```


    ```

    socket option = tcp_nodelay so_reuseaddr

    ```


    # Table 15.5 Samba Socket Option Values


    +   - so_keepalive

    - so_reuseaddr

    - so_broadcast

    - tcp_nodelay

    i iptos_lowdelay

    i iptos_throughput

    - so_ndbuf=<integer>

    - so_rcvbuf=<integer>

    - so_ndlowat=<integer>

    - so_rcvlow=<integer>


    # Logging


    It is always nice to have when debugging a problem. One of the best ways to get
    is by setting verbose logging and diagnostic options. You''ll need to make tradeoffs
    between performance hits due to generous logging activity and the problem state.
    Turn diagnostics during incident flooding and down during normal operation.


    Log file and general diagnostic behavior is determined by the log file, max size,
    and debug level parameters. Log files normally reside in the /usr/local/samba/var
    directory. By using substitution variables in the log name, it is possible to
    generate logs by user, using NetBIOS name, or architecture. By default both smbd
    and nmbd generate logs named log.smb and log.nmb. The max log size'
  merge: -1
