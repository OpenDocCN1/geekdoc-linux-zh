    # # NetBIOS


    A long time ago, in a LAN far, far away, an API was developed to extend the Basic
    Input/Output System (BIOS) services of personal computers to include support for
    sharing information between computers over a network. The resulting NetBIOS API
    is documented in the IBM PC Network Technical Reference Manual (September 1994).
    The NetBIOS API defines three service types: session service, datagram service,
    and name service.


    Conversations between NetBIOS applications are facilitated by NetBIOS session
    and datagram services. The NetBIOS session service is used when a reliable virtual
    circuit with guaranteed delivery is required for passing messages between two
    known parties. An example of a session-based connection is used when accessing
    a file share. In contrast, the NetBIOS datagram service is used for connectionless
    communication without guaranteed delivery when the target recipient is not known
    in advance. Datagrams or Mail in the Microsoft platform, are usually transmitted
    as network broadcasts or multicasts to a group of machines. Datagram services
    are used when a client requests the identification of the master browser.


    # # NetBT


    NetBT itself is not a communications protocol, but a programming interface for
    establishing and managing networking-based services. Messages between NetBIOS
    applications must be carried over the transport-layer protocol. Popular transport
    protocols include NetBEUI, IPX, DECNet, and TCP/IP. Samba uses NetBIOS over TCP/IP
    (NetBT) as defined in RFCs 1001 and 1002 as its transport service. As we will
    see later in the chapter, the use of NetBT as a transport is critical when scaling
    NetBIOS in large networks.


