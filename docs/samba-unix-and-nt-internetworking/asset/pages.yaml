    # # Chapter 6: Samba Configuration, smb.conf


    # ## Overview


    The Samba players now have been fashioned and arranged upon this, our operating
    system time. Now we have to tender the liberty, directing the measure of their
    shares. In other words, we''ve completed the Samba installation process. Now it''s
    time to direct our attention toward defining the server''s role in the workgroup
    or domain and specify what resources it share.


    In this chapter, we will become familiar with the general structure and syntax
    of the Samba configuration file, `smb.conf`. This file directs the runtime behavior
    of both `smbd` and `nmbd` daemons. In the Ensuring Chapters 7-12, we''ll scrutinize
    the sections and parameters of the Samba configuration file that affect authentication,
    name service, browsing, domain control, sharing files, and sharing printers. In
    Chapter 15 we will assess the administrative and event logging parameters that
    can be specified in `smb.conf`


    Appendix C includes the default `smb.conf` file that ships with the 2.0.5a release.
    It may be helpful to refer to this file as we review the configuration structure
    and syntax. An online copy of this file can be found in the `./examples` subdirectory
    of the Samba distribution tree. The file is well documented and can be used as
    a template for building your own configuration file. Refer to the `smb.conf` (5)
    manpage for additional information.


