    # Chapter 8: Name Service


    # Overview


    Name Service is the glue that logically binds a network together (pun intended
    for UNIX System Administrators). Name Service provides a methodology for resolving
    resource names, enforcing uniqueness in the namespace, ensuring timely distribution
    of namespace updates, and resolving addresses from human readable names. Name
    Service can also be used to reflect the administrative structure of an organization,
    although this is not a requirement. Basically, Name Service simplifies finding
    your way around the wires.


    In its simplest form, Name Service can be implemented using a host table; this
    is a flat ASCII text file that maps resource names and network addresses. References
    to a resource name are resolved to the associated network address via a simple
    table lookup. A copy of the host table must be distributed to each machine participating
    in the'
