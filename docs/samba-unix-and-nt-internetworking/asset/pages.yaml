    # smbclient Interactive Mode Commands


    When smbclient has connected and authenticated with the service the user is presented
    with a command prompt.


    ```

    smb:\>

    ```


    Once the prompt is displayed, you can interact with the service using the following
    list of commands. Interactive behavior is similar to FTP. Commands are case-insensitive
    words that may be followed by one or more space-delimited arguments.


    +   * [command] Display help information for the indicated command. If a command
    is not specified, a list of available commands will be displayed.


    +   * ![shell command] This will temporarily escape back to the UNIX shell. If
    a command is specified, it will be executed on the local machine.


    +   * [directory name] This will change the working directory on the server to
    the indicated location. If no directory name is specified, the current working
    directory is displayed.


    +   * del <mask> Delete all files that match the "mask".


    +   * dir <mask> List all files in the working directory that match the "mask".


    +   * exit Terminate the server connection and exit smbclient.


    +   * get <remote file name> [local file name] Copy the specified remote file
    from the server to the local system. If the "local file name" option is given,
    then rename the file using the designated name. No content translations are performed
    (binary mode transfer).


    +   * help [command] See?[command] above.


    +   * lcd [directory name] Change the working directory to the specified "directory
    name.\ If a directory name is not specified, the name of the current local working
    directory is displayed.


    +   * lowercase Toggles whether files copied by a get or mer command are converted
    to lowercase (ON by default).


    +   * ls <mask> See the dir command above.


    +   * mask <mask> Defines a file name match pattern that will be used with recursive
    mget and mput operations. For example, a mask of "*.c" would collect all C source
    files from the directory tree.'
