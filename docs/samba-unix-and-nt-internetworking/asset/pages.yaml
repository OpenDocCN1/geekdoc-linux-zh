    | Master Browser | 0x04 | 4 |

    | Domain Master Browser | 0x08 | 8 |

    | WINS Client | 0x20 | 16 |

    | Windows NT Server | 0x80 | 64 |


    To support workgroup and domain browsing across subnets, a domain master browser
    must be designated. The domain master browser periodically collects and synchronizes
    the lists maintained by the local master browsers that reside on each subnet.
    The identity of the domain master browser is registered and maintained by WINS.
    In the case of a Windows NT domain, the PDC always acts as the domain master browser.
    In single subnet NT domains, the PDC is both the domain master browser and local
