    To address the scaling problem


    Computers and organizations in DNS are identified by a domain name. The domain
    name is a string tuple delimited by ".s represents the administrative hierarchy
    of the namespace (Table 2.3). Domain names are usually represented in two to four
    levels. Note that there is no implied mapping of domain names to IP number octets
