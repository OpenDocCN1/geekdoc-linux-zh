    # # Binary or Source


    Once you have navigated to an archive snapshot, you need to decide whether to
    download a binary or source code. Precompiled packages are available for a number
    of operating systems including AIX, BSSI, Digital UNIX, Linux, SCO, and many others.
    The binary distributions are convenient and trouble for those who don''t want
    to roll their own Samba configuration. If you like that and fuzzy feeling you
    get from compiling your own software, then select the source distribution. You
    will source if you''re interested in the latest alpha and beta releases. Building
    from a source distribution is more about `autoconf` later in the chapter.


    Note that if you are building a Samba version prior to 1.98 and need to support
    encrypted password authentication for Windows 9 and Windows NT, you will need
    to obtain a copy of the `libdes` library.libdes` is used in older versions of
    Samba to enable DES (Data Encryption Standard). Modified encryption technology
    was derived from work by IBM in the early 1970s. Possession of DES algorithms
    is governed by the United States by the International Traffic and Arms Regulations
    (ITAR). The good news is that as of version 1.98, Samba contains a modified DES
    algorithm that can be distributed without violating ITAR or raising the hackles
    of the U.S. National Security Agency.


    # # CVS


    Another reason for choosing a source code distribution is the ability to add your
    own modifications. One of the most common modifications is integrating Samba with
    unsupported authentication and authorization mechanisms. If you need to modify
    the source code, using Concurrent Versions System (CVS) is a multi-user source
    control system that allows developers to check out snapshots of source code and
    concurrently integrate their modifications into the source tree. CVS makes it
    easy for you to reaply local modifications into new releases of Samba. Read-only
    access to the Samba source tree is available via the Web at http://samba.org/cgi-bin/cvysweb
    (Figure 5.4). The CVS client software and CVS information can be obtained from
    http://download.cyclic.com.'
