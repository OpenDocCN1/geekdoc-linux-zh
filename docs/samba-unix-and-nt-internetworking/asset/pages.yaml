  md: 'The Application layer in the TCP/IP suite, like the OSI model, implements the
    user interface. Client/server protocols are most often defined at the application
    layer.


    # Addressing


    A unique IP address is assigned by the network administrator to represent each
    computer in the network. The IP address abstracts the hardware address to a more
    general use. At this level we are not concerned with the adapter interface type
    used on a particular machine. Each IP address is a 32-bit number represented as
    four octets. Each octet is in the range of 0 through 255.


    <0-255>.<0-255>.<0-255>.<0-255>


    In large networks, it is often desirable to group and partition computers to localize
    traffic patterns, hide internal network structure, simplify information routing,
    and enforce security policy. This is done using a system called subnets. A subnet
    mask is used to mask out a portion of the IP address from the particular computer
    will be routed to other computers in the network. When a machine within the organization
    wants to send a packet to another system, it uses the subnet mask to the destination
    address to see if the address is on the local network or if it must send it to
    a router for delivery.


    The subnet mask is a four-octet number that indicates which bits in the address
    are to be masked as the subnet portion of the address. The lower-order bits of
    the mask designate the host of the address.


    ```

    netmask 0xffffff 14 hosts per subnet (0 and 15 excluded)

    netmask 0ffffffff 6 hosts per subnet (0 and 7 excluded)

    ```


    The subnet structure of the network will be important when you begin defining
    resources to be shared between systems which may exist on different subnets.


    # Domain Name Service


    Although IP addresses uniquely identify computers and associated resources on
    the network, they are not easily remembered by human beings when trying to find
    computers and resources. The simple solution to this brain fault is to map remembered
    text strings to the associated IP addresses. A table of machine names and IP addresses
    can be installed on each computer as a directory of known systems. Under UNIX
    this directory of host name and IP pair is called the /etc/hosts table (Example
    2.2).


    Host tables work well for small networks but immediately break down as we scale
    up to numbers of systems. Mapping host to IP numbers for a large set of networks
    like the Internet is the same scaling problems encountered when mapping personal
    and business names to phone numbers for all the cities in a particular country.
    There are far too many name collisions and the phone book is too large for timely
    incorporation and distribution of updates.


    Example 2.2 /etc/hosts


    ```

    # IP Number          Host Names

    ```'
