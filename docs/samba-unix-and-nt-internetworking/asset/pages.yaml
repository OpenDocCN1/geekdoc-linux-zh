    # # Windows Printers


    Samba also supports UNIX printing to remote Windows printers via a spooling input
    filter, smbprint. The smbprint filter is basically a script wrapper for the smclient
    command. The smbprint pipes input into smclient, which handles the connect session
    with the Windows pooling service. Two versions of the smbprint script are provided,
    smbprint (BSD) and smbprint.sysv (SYSV). The scripts are located in the Samba
    distribution subdirectories ./examples/printing.


    # # smbprint (BSD)


    To enable access to Windows-managed printers from a BSD UNIX system, begin by
    installing the smbprint script into the Samba binary directory. Create an /etc/printcap
    entry for the remote Windows printer similar to Example 12.7. Select a printer
    name, one or more aliases, and create the spool directory for the location identified
    by the /etc/printcap:sd option for the new network printer.


    # ## Example 12.7 BSD smbprint printcap Entry


    ```

    <printer name>: <printer alias> \ \

    cm:<printer description> \ \

    sd=/var/spool/lpd<printer name> \ \

    af=/var/spool/lpd<accounting file> \ \

    if=/usr/local/samba/bin/smbprint \ \

    mx=0 \

    np=/dev/null

    ```


    With the designated printer spool directory create a file named .config which
    will be used by the smbprint script to identify the server, service, and password
    (Example 12.8).


    # ## Example 12.8 /var/spool/samba<printer name>.config


    ```

    server=<server name> \

    service=<printer name> \

    password="<printer share password>"

    ```


    Start the printer and validate access. smbprint will log activity messages to
    /tmp/smbprint.log. This file is quite useful for configuration debugging and testing.
    When you are certain the configuration is working as expected


    ```

    logfile=/tmp/smb-print.log

    ```


