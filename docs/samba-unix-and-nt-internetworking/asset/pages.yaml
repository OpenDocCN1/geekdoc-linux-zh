    # Access Control


    The /etc/passwd and /etc/group files form the foundation of access control in
    UNIX. In general the right to operate an object is governed by ownership or membership
    in a group associated with the object. Newer versions of UNIX have augmented access
    control mechanisms including support for Access Control Lists (ACL). ACLs allow
    finer granularity to do operations on an object and permit the end-user to set
    up and control custom groups. On the downside, ACLs are not easily mapped between
    environments and may not work remote file shares.


    # Passwords


    The UNIX password file, /etc/passwd, is a table which contains all users permitted
    to log-in to the system (Example 2.10). Each user account is assigned a string
    Account Name and a numeric identifier, called UID, which is unique to the individual
    computer. Another numeric identifier associated with the user is a default group
    identifier, GID. Basically the UID and GID tags are used by the system in managing
    access control. The password file may or not be encrypted for the user population.
    Because the password file is visible to all users, some systems have moved the
    encrypted passwords into a restricted access file called the shadow password file.
    This defeats the ability to use the visible password file easily by cracking programs.
    When shadow passwords are in effect a place holder character, ''!'', is inserted
    into the password field instead of the encrypted password. Other information in
    the password file may include personal name and address data in the gecos field,
    the user''s home directory, and the default shell. Each password field is separated
    by a colon.


    ```

    Account Name:UID;GID:<Gecos strings>:<Home Directory>:<Shell

    ```


