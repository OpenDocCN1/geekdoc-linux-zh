  md: 'It will be helpful to understand a few of the columns displayed in the list
    of running processes when managing execution resources in a running system. The
    COMMAND columns represent the program running in the process address space. Along
    with its PID, each process records the integer ID of its Parent Identifier (PPID).
    Short-term CPU usage, execution priority, and nice are displayed in the PRI, and
    NI fields in the GSV. The BSD #CPU field represents the percentage of CPU resources
    that a process has used in its life.


    In every process there is a special set of processes called daemons. A daemon
    is not some mistaken process spawned by some evil hacker to wreck a system, but
    a collection of one or more processes that provide some well-defined service.
    For example, the sendail daemon and sendmb daemon manage electronic mail on behalf
    of the UNIX user. In the case of Samba, the sambd daemon manages access to shared
    resources. The Samba sambd daemon provides service to assist clients in initiating
    resource shares.


    # Init


    I''ve already mentioned the special role that init plays as the ancestor of all
    processes on the running system. Init is responsible for spawning "respawning"
    processes that may have exited due to some unforeseen event. These processes are
    identified in a configuration file called /etc/initab. Entries in the initab configuration
    file take the form:


    ```

    <identifier>:<runlevel>:<command>

    ```


    The identifier uniquely identifies the service. The runlevel corresponds to the
    running system state which the action is invoked by the command. Runlevels are
    represented as numbers 0 through 9 and indicate various system states. An example
    initab entry for the cron daemon which schedules batch jobs on UNIX looks like:


    ```

    cron:2:respawn:/usr/sbin/cron entry

    ```


    As we will see in a following section, there are other mechanisms available for
    spawning service daemons. In the case of network-based services like Samba, it
    is desirable to initialize an instance of a service daemon only at the actual
    time when its services are requested by a client.


    # Networking


    Understanding TCP/IP network configuration and administration is important in
    this context because it is used as transport for Samba NetBIOS services. NetBIOS
    over TCP/IP (NetBT) is defined in RFCs 1001 and 1002. We will take a closer look
    at NetBT in the Windows networking section of the following chapter.


    # TCP/IP


    When we talk about TCP/IP we are referring to a larger set of protocols that comprise
    the general functionality associated with service (Table 2.2). In the TCP/IP stack
    model, these protocols are bundled into a smaller number of layers than defined
    in the OSI model.'
