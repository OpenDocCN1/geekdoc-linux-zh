    # Printing


    Printing is fairly straightforward under UNIX given the file I/O abstraction for
    interoperating with devices. In simple format an ASCII character file can be printed
    by piping the file into the device representing a local printer.


    ```

    # cat myfile /dev/lp.

    ```


