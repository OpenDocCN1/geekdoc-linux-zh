    You can also force browse list synchronization of designated remote subnet local
    master browsers using Samba using the remote browse sync parameter (Figure 9.6).
    Note that the set of local master browser services must all be running under Samba
    nmbd; This feature is not supported under Windows implementations.


    ```

    remote browse sync = <remote IP address>

    ```'
