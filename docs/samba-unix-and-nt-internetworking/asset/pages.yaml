  md: 'One of the features of newer versions of the SMB protocol is that it supports
    opportunistic locking oplocks. By acquiring an oplock on a file an SMB application
    can read ahead and buffer data locally for updates, thus improving performance.
    There are three types of oplocks. Acquisition of an Exclusive oplock means that
    no other application can read or modify the target file. The lock holder has exclusive
    control over the file. A Batch oplock allows an application to maintain a lock
    on the file through successive operations and closes, reducing network traffic
    between the client and server. A Level oplock permits multiple applications to
    read a file without conflict.


    # Common Internet File System (CIFS)


    CIFS is an enhanced version of the SMB protocol. Along with being backwards-compatible
    with SMB, CIFS provides a means for sharing resources between multiple platforms
    over the Internet. This is accomplished through the use of HTTP-like resource
    location semantics and Internet DNS. In regard to scalability and fault tolerance,
    CIFS supports multiple writers to a single file through aggressive locking and
    caching algorithms. With its intent to support sharing in a larger community,
    CIFS can adapt to a wide range of network speeds. This includes everything from
    slow dial-up modem to gigabit connections. Unicode character sets are also employed
    with wider internet audiences.


    # Peers, Domains, Forests


    One of the first things that comes to mind when planning a network infrastructure
