    # User Name Case


    Matching names between UNIX and Windows systems during SMB session setup isn''t
    always straightforward as one would hope. The problem is that even though you
    may maintain a consistent set of names across your UNIX and Windows systems, many
    Windows clients upscale the user name before submitting it in a session setup
    request. This can be a problem if your Samba server has to spend CPU cycles attempting
    to find a match for the username by shifting the case of the letters in the string.
    The default behavior is that Samba will first attempt a match using lowercase,
    followed by uppercase. If the match attempt fails, the connection is denied. If
    you''ve got extra cycles to spare, you can request that Samba try all combinations
    of upper/lower case using the username-level parameter. This parameter accepts
    a numeric value that determines the number of combinations to try. The higher
    the number, the more combinations will be tried.


    ```

    username-level = <0-5>

    ```


