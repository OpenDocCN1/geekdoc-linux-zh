    # Encrypted Passwords


    It is possible to eliminate the clear-text password option during SMB session
    setup by enabling NTLM encrypted password support in Samba. The feature improves
    overall network security by removing the possibility of password eavesdropping
    on the wire; however it increases the complexity of maintaining and synchronizing
    the UNIX and NTLM passwords. Enabling encrypted passwords requires maintenance
    of an additional password file and this must be done in conjunction with the standard
    UNIX password maintenance activities.


    The NTLM encrypted password option is enabled by setting the encrypt password
    parameter to true to create an instance of the Samba smpasswd file that includes
    an entry for each of your users. Usually the easiest way to do this is by using
    each encrypted or NIS password file as input to the mkmpasswd.sh shell script
    supplied in the Samba distribution. The procedure is described in Example 7.4.


    ```

    encrypt passwords = <false>

    ```


    # Example 7.4 /etc/passwd Enabling Samba NTLM Encryption Support


    ```

    $ cat /etc/passwd | mkmpasswd.sh \

    /usr/local/samba/private/smpasswd

    $ chown -R root.root /usr/local/samba/private/smpasswd

    $ chmod 500 /usr/local/samba/private

    $ chmod 600 /usr/local/samba/private/smpasswd

    ```


    Update smb.conf parameter.


    ```

    encrypt passwords = true.

    ```


    The smpasswd file is stored in /usr/local/samba/private directory by default.
    You can indicate an alternate location by specifying the directory path as a value
    to the smpasswd file parameter:


    ```

    smb passwd file = <path>

    ```


