    # Chapter 4: Samba Overview


    # Overview


    Samba is a Portuguese word meaning a rhythm and a dance and is derived from the
    West African Bantu term semba, meaning to pray or invoke the spirits of ancestors.
    A Bantu verb semba means "to cry" or "the blues." In Brazil, a Samba is a woman
    who is a sacred dancer.


    In the world of UNIX, "Samba" is a software used for remotely accessing UNIX files
    and printers with Windows PCs via the Server Message Block (SMB) protocol. SMB
    is a network protocol for accessing remote files and printers, collectively known
    as shares (see Chapter 3). SMB provides a seamless interface between network resources
    and desktop applications like FC-NFS, FTP, and IPX in Implementation of SMB-over-TCP/IP
    (NBT, see RFC 1001 and RFC 1002). From a Windows or LAN desktop perspective, Samba-shared
    UNIX resources appear just as if they were on another Windows or LAN manager server.
    No special desktop client software is required. Source code and binary distributions
    are free to anyone interested in the product. We will cover Samba distribution
    sites in the next chapter.'
  merge: -1
  img_proc: true
