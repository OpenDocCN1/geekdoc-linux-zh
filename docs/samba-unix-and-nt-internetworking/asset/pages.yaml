    # Server Message Block (SMB)


    Thus we, have taken a brief look at MS Windows network services and protocols
    at the transport, network, and to a limited degree, the session layer. Now we
    are ready to move higher in the stack and probe the Server Message Block (SMB)
    protocol, which is where Samba lives and breathes (Figure 3.2). SMB is a session-,
    presentation-, and application-layer protocol that provides a means for sharing
    files, printers, and various communication resources between networked computers.
    The SMB protocol was first defined in a joint Microsoft Open document titled Microsoft
    Networks/OpenNET-File Sharing Protocol in 1987. Early SMB implementations included
    MS LAN Manager in 1987 and OS/2 LAN server in 1988. In 1992 SMB became an Open
    Group interoperability standard, "Protocols for X/Open Interworking: SMB, Version
    2,'
