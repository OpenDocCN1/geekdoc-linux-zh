    # # Chapter 1: Internetworking UNIX and Windows


    # Overview


    When network engineers talk about internetworking, the flow of conversation usually
    eddies around the lower-level protocols and circuits involved in the connectivity
    between some set of networked devices, be it computers, routers, switches, or
    just any pair of semi-intelligent appliances. They don''t normally use the term
    when discussing connectivity between services residing higher up in the protocol
    stack (Table 1.1).


    # ### Table 1.1 OSI Protocol Stack


    | Layer | Description |

    | 7 Application | User interface and services |

    | 6 Presentation | Application data transformations |

    | 5 Session | Connection authentication |

    | 4 Transport | End-to-end data ordering |

    | 3 Network | Routing and reporting mechanisms |'
  merge: -1
  img_proc: true
- pgno: 6
  md: '# 2 Data


    # Packet format, integrity, and address


    # 1 Physical


    # Physical hardware specification


    Anything above layer 3 or 4 is a glob or cloud that represents the endpoints in
    a networked conversation. System administrators, on the other hand, tend to extend
    the scope of internetworking to include the union of protocols and upper-layer
    services that result in some meaningful unit of interoperation between the operating
    systems. An example is the set of protocols and applications to share files between
    platform "A" and platform "B". Given a common set of supported protocols can be
    found, it is generally possible to build the corresponding set of software services
    to facilitate resource sharing even between dissimilar operating systems. In "Samba,"
    which represents a suite of services working in Server Message Block (SMB) in
    concert with Network Internet File System (CIFS), NetBIOS, and Transmission Control
    Protocol (TCP) to internetwork UNIX and Windows-based resources (Figure 1.1).
    Thus the file for this text: Samba: UNIX and Windowsnetworking.


    ![](img/fefda0da589a61a5ed84314561e6844b_6_0.png)


    Figure 1.1: UNIX, Windows, and Samba


    Why do we speak of UNIX and MS Windows internetworking? It is not uncommon nowadays
    to find a growing mixture of UNIX and Windows-based systems existing, for better
    or worse, in many organizations. This might seem a bit odd given that operating
    systems of different development histories and philosophies represents a more
    proprietary attribute, with a focus on business and personal use. This is not
    to say that each time of these operating systems had not to address all of these
    issues to compete in the marketplace. Each has its strengths and weaknesses. This
    is likely why we are seeing a marriage of these platforms within many enterprises
    today. One complements the other in addressing the demands of the complex heterogeneous
    environments found in businesses, schools, and even the home.


    The importance of seamlessly internetworking these two worlds has gained the attention
    of traditional "UNIX-only" user groups like the USENIX Association. Over the last
    few years USENIX has held special symposiumia dedicated to UNIX and Windows NT'
  merge: -1
  img_proc: true
