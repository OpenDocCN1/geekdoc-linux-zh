    At this point, you''ve completed setup of Samba encrypted password support on
    your server, UNIX''s /etc/passwd and Samba''s /usr/local/samba/private/smbpasswd.
    You would probably prefer an automatic way to keep the two files synchronized.
    Updates made to one password are automatically reflected in the other. Samba can
    handle either side of the problem for you. By using the unix add-on authentication
    program, andamba will update the UNIX /etc/passwd whenever it receives an smbpasswd
    change command and the password chat text will need to be tailored to your specific
    UNIX operating system. For UNIX old timers, this is similar to setting up login
    chat for UUOCP connections. Don''t leave this option turned during normal operation
    as it makes passwords visible in clear text.


    ```

