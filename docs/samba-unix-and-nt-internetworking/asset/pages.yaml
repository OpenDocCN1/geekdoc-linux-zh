    # Grouch Marx


    Computers are somewhat like politics. Sooner or later trouble always shows up.
    It usually happens when you''re making some small late-night change to a production
    service. You know the kind. It''s always some preventative patch for a problem
    you''ve never seen; the vendor advice needs to be applied, assuring that it is
    only a benign software update. You apply the patch and de- in late the following
    morning. Just as you''re ready to call it at night, network alerts start popping
    up from multiple subsystems. SNMP monitor alerts are popping up everywhere announcing
    server failures all the network. In a nervous adrenaline rush you rapidly to try
    back out the patch before it''s too late. Halfway through, the uninstall task
    fails, your screen goes blank, and the phone begins to ring off the hook.


    Gruesome isn''t it? You can avoid computer and network problems, but you can limit
    the scope of disaster. The trick is to always have a good selection of diagnostic
    tools at hand, and to have a sound fallback. When installing a new system, try
    it out first in an isolated test environment. When problems emerge in production
    systems, address them as a series of validation stages. Begin with the lowest-level
    subsystems. Examine each higher-level service eliminating possibilities as you
    proceed. This process will assist in diagnosing events rooted in complex subsystem
    interrelationships.


    # Samba Tools


    Samba is an excellent example of a network service comprised of tightly coupled
    subsystems. It is therefore often helpful to address Samba problems in the stepwise
    manner described in the previous paragraph. By verifying network connectivity
    from both the server and client end of a circuit. Confirm that the samba and smbd
    are running and listening for incoming requests. Ensure that the configuration
    files correctly reflect the role Samba is playing in the workgroup or domain.
    When all else fails, make sure you know where to go for help.


    In the following sections we will look closely at validating Samba services at
    the network, daemon and configuration files. Table 15.1 lists the set of tools
    we''ll use as we analyze each component of the system.


    # Table 15.1 Troubleshooting Tools


    # Samba Tools


    ```

    smbclient

    nmbookup

    testparam

    testprns

    ```'
