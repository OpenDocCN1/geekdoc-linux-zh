  md: 'parameter is used to indicate when a log should be closed, renamed to log.old,
    and a new log started. Message verbosity is controlled by the debug level value.
    Values range upward from 0. A special value of 100 combined with the passwd chat
    setting will record passwords in the log file.


    ```

    log file = /usr/local/samba/var/log.wtm

    max log size = 10000

    debug level = 3

    ```


    Another option is to use the syslog syslog only parameters to send Samba messages
    to the syslog daemon. The syslog parameter indicates how Samba levels are mapped
    to corresponding syslog levels. You direct Samba to log messages via syslogd.
    This might be useful when using syslogd to send logs to a common collection site
    on the local machine or at a remote server.


    # # Backups


    If you don''t have backups then the rest of this information is going to do you
    good. Every good system administrator knows that system recovery and resumption
    capacity is only as robust as backup strategy. For a Samba server, primarily maintaining
    backup copies of system configuration files like mb.conf, password databases are
    smpasswd, and critical share data.


    You can also use the Samba smbtar command to back up and restore directory shares
    (Example 15.14). The target share may be owned by a Windows client or other Samba
    server. smbtar can be incorporated into UNIX shell scripts to automate backup
    operations using timed services like cron.


    # ## Example 15.14 smbtar - Dump & Restore


    # ### Incremental Dump


    ```

    Smbtar -s <NetBIOS name> -p <password> -x <Share Name> \device-I

    ```


    # ### Restore Backup


    ```

    Smbtar -s <NetBIOS name> -p <password> -x <Share Name> \device-r

    ```


