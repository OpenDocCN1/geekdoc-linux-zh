    command is invoked. This can be tricky. You might end up with an update loop between
    password and smbpasswd. If you''d rather pass on this programming exercise, Stephen
    Langevin has already done some of this work with the pam_samba module. Samba adds-on
    authentication methods through a well-defined API and shared library interface
