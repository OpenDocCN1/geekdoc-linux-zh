    Once you''re certain that each systems network interface is operational, check
    reachability by using the ping command to send an ICMP echo request between problem
    systems (Example 15.2). Echo round-trip time and dropped-packet rates are displayed,
    indicating the overall health of the communication path between the participating
    systems.


