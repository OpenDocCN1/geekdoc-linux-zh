    # Chapter 14: Administration Tools


    # Overview


    Command line or GUI, that is the question.


    Whether tis nobler in the mind to suffer


    The slings and arrows of the UNIX command line


    Or invoke a GUI tool against a sea of configuration troubles.


    Graphical interfaces seem to be the trend when it comes to administering complex
    software systems. The ubiquitous platform-independent nature of the Web has made
    browser-based administration tools of choice. There are still a feww of us'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'who prefer the tried-and-true command-line approach to system administration.
    However, most system administrators will admit that GUI-based tools reduce the
    number of configuration errors in complex tasks. They also assist new systems
    administrators in tailoring unfamiliar applications.


    There is an ever-growing collection of GUI administration tools directed at simplifying
    Samba configuration and in this chapter we''ll take a brief tour of some them.
    Before we delve into the color-filled, form-based world of GUI tools, let''s start
    with good old command-line tools.


    # Command-Line Tools


    # testparam


    An excellent command-line tool for verifying generic sm.conf correctness is the
    Samba testparam command. testparam will not guarantee that a particular share
    or section will operate the way you prefer, rather it will validate the syntax
    and parameters you specified for each section in the configuration file. Invoke
    testparam with the full path name of the target sm.conf as an argument. If a host
    name or IP address is supplied as an option, it will also check the access rights
    of the specified host. See the testparam (1) man page for additional information.


    ```

    $ testparam -s configfilename <hostname> hostIP>

    ```


    # smclient


    We talked about the smclient command a number of times in the text to validate
    access to servers and services. smclient can be used to move files between file
    shares, modify files and directories, print files on remote printers and exercise
    NetBIOS name-to-address resolution. Refer to Chapter 13 "Samba Cliente" and the
    smclient (1) man page for detailed information on smclient options.


    ```

    $ smclient -L <server> -N

    ```


    # smbstatus


    The smbstatus is a simple tool that will display information about active connections
    to your server. Server status information can be limited to users, shares or locks.
    It is a useful tool for making a quick check on the general health of the server.
    See the smbstatus (1) man page for options and additional information.


    ```

    $ smbstatus -d

    ```


    # testprns


    Verify that the printer name is a valid entry in the printer configuration file
    with the testprns command. Use the testprns (1) man page for more information.


    ```

    $ testprns <printer name> <printcap file>

    ```


