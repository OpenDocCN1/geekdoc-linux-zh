  md: "# Samba History\n\nSamba is the brainchild of Andrew Tridell. It started in\
    \ December 1991, when he was working as a graduate student in the Computer Sciences\
    \ Laboratory at Australian National University. Andrew came up with the idea of\
    \ trying to reverse-engineer the file-sharing protocol used in Digital Equipment\
    \ Corporation's Pathways for NET by testing a copy of DEC's Excursion software.\
    \ \n\nExcursionn\nExcursion software, which provides Windows services for PC.\
    \ Testing Excursion required that he abandon PC-NFS for file sharing and mount\
    \ disk space using Pathways. The problem was that Pathways linked his network\
    \ service options to DEC platforms using Utrix or VMX.\n\nAn being systems-minded\
    \ fellow, Andrew decided to eavesdrop on Pathways network traffic to see if it\
    \ be possible to translate the protocol to other platforms. This required an amount\
    \ programming and the building of a software tool to capture network packets off\
    \ the wire. After poring over the bits and bytes of Pathways packet data, he was\
    \ able to prototype a basic file operations on a Sun computer he used as a development\
    \ platform. Additional investigations into the protocol led him to the NBT RFC\
    \ literature. Although apparently uncertain how the NBT specification related\
    \ to his SMB implementation, he continued to refine the code and in January 1992,\
    \ \"Server 0.1\"\n\nOver the next few months, Andrew continued working the software\
    \ to other non-DEC platforms. This also included a smattering of bug fixes and\
    \ additional improvements. The time had come to release the software with a real\
    \ version number. \"Server 1.0\" was ready and subsequently released to the Internet.\
    \ Then like any good software development project, the code was left to ferment\
    \ for a couple of years under public scrutiny.\n\nThe project was brought out\
    \ of the cobebwebs after receiving a note of interest concerning the software\
    \ from Linux aficionado by Dan Shearer. This was also a request from DEC to include\
    \ the software on their Alpha-contributed CDs. A bit of Linux-to-PC home networking\
    \ and the discovery of the full Microsoft SMB specification gave the development\
    \ effort an additional push. In December 1993, the project resurfaced as \"NetBIOS\
    \ for UNIX.\" \"Server\" was temporarily renamed as \"embserver\"; however; the\
    \ name\n\n- 56 -"
