    | rpc.statd | RPC status manager |

    | rpc.lockd | NFS lock manager |


    Each file system or directory available for remote mounting is identified with
    an entry in the server''s /etc/exports file (Example 2.8). Along with the directory
    path name, the /etc/exports entry controls which machine names are allowed to
    mount the directory, operate on with root permits whether there is read-only or
    write access. If root access is not enabled for a remote NFS client, the root
    UID of the server is mapped to a default UID of -2 (4294967294), user name nobody.
    This restricts compromises by unknown superuser IDs on remote machines.


