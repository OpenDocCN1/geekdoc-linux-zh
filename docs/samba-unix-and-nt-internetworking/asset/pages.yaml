- pgno: 117
  md: 'proxy local WINS requests to a remote WINS server. It can resolve WINS requests
    against Internet DNS. This rich set of options makes Samba an exceptionally useful
    tool in designing complex WINS environments.


    # WINS Client


    In order for Samba to interact seamlessly with the resources in a WINS-managed
    workgroup or domain, it must first register with the designated WINS server. This
    is accomplished by indicating the IP address or DNS name of the target WINS server
    as an argument to the global `wins server` parameter. If the WINS server is multi-homed
    (multiple network interfaces), clients residing on one interface subnet will be
    able to browse and access Samba shares that reside on the other interface subnet:


    ```

    wins server = <DNS name or IP address of WINS server>

    ```


    # WINS Server


    Samba can also be configured to operate as a primary WINS server. Use the `wins
    support` parameter to enable or disable Samba as a WINS server. Note that the
    `wins support` and `wins server` parameters are mutually exclusive. The former
    indicates that Samba is acting as a `WINS server`. The latter identifies Samba
    as a `WINS client:


    ```

    wins support = <true, false>

    ```


    When running as a WINS server, Samba stores client registration information as
    ASCII in the `wins.dat` file. The `wins.dat` database is loaded by default in
    the `/samba/var/locks` directory. Each entry includes the NetBIOS name, resource
    type, IP address, and broadcast address.


    WINS replication is not supported by Samba. Windows NT WINS servers can replicate
    WINS data with each other by providing fault tolerance and load sharing in networks.
    For this reason, you might consider using Windows NT for WINS servers rather than
    the Samba WINS service. If you decide to use Samba as a WINS server, remember
    that only one server can be deployed for a given workgroup or domain. Using more
    than one Samba server will result in partitioning and fragmented access to computers
    in the workgroup or domain.


    # WINS Proxy


    Environments that have Windows or Linux Manager clients that reside on multiple
    subnets might want to consider using Samba''s WINS proxy facility. Enabling the
    global `wins proxy` parameter instructs Samba `nmbd` to forward any broadcast
    name registrations or queries it receives to the designated WINS server for the
    workgroup or domain. Using Samba as a WINS agent allows you to leverage older
    clients into a W managed workgroup:


    ```

    wins proxy = <yes, no>

    ```


    # WINS DNS Proxy


    Another Samba feature that can simplify administration of complex WINS networks
    is to'
