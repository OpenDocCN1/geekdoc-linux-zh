    # Network Connectivity


    Begin troubleshooting by examining network connectivity between clients and servers.


    Can everybody talk to each other over the wire? is everyone configured to support
    NetBios over TCP/IP? Are the assigned IP addresses and subnets correct? Use the
    ifconfig command on each UNIX client and server (Example 15.1) and the winipcfg
    command on Windows clients and servers (Figure 15.1) to verify network interface
    configuration. These commands will display adapter status, assigned IP address
    and subnet mask, and the broadcast address.


    # Example 15.1 ifconfig – UNIX Network Interface


    ```

    # ifconfig en0

    en0: flags=a080863<UP,BROAD,NOTRAILERS,RUNNING,SIMPLEX,

    MULTICAST,GROUPT>

    inet 145.142.210.20 netmask 0xffffff00 broadcast

    145.142.210.255

