    # # Performance


    When it comes to tweaking adjustments out of Samba, to dedicate one or more computers
    to the service allows you to tune and tailor the operating system to meet Samba''s
    resource demands. It also limits the number of things that go wrong. It is not
    uncommon in UNIX to have one service severely influence or interrupt another service
    if they are running on the same hardware.


    You might also consider using a "cluster" of Samba servers and distributing load
    across the cluster. Clients often require the use of hybrid name services that
    map a service name to multiple IP addresses.


    Use OS native performance monitoring tools to gauge the general wellness of the
    server platform. Again, for Samba this will be much easier if it is the only service
    running on the machine. Look for problems induced by high CPU usage, large amounts
    of spawned processing, long scheduling queues, large memory usage, and high paging
    rates.


