    # inetd


    Instead of running a stream for the TCP/IP service continuously, they can be started
    when a request is made for the service and when the service has completed. This
    capability is supported by the inetd daemon. Configuration information for the
    service is located in the /etc/inetd.conf and /etc/services files (Examples 2.4
    and 2.5). Entries in /etc/services indicate each service name and any requirements,
    whether it uses TCP or UDP protocols, and the well-known port number associated
    with the service. Each time updates are made to either of these tables the inetd
    daemon must be refreshed. This can be done by sending a hangup signal to the inetd
    PID.


    ```

