    # Shares Section


    The shares define the explicit resources that Samba will make available to the
    workgroup and domain clients. Two predefined sections, designated **[homes]**
    and **[printers]**, are provided to grant users access to their UNIX `$HOME` directories,
    and any printers listed in the UNIX printer file. Other shares can be defined
    to grant or restrict access to individual directories and printers, or to specify
    a location for storing profiles. The full set of share parameters is listed in
    Table 6.5. See the `smb.conf` (5) message for a description of each share.


    If a **[homes]** section is defined in `smb.conf`, it becomes the default target
    when no match is found for a requested share name. The name is then assumed to
    be a valid user account on the server. The password file is scanned for a new
    match. If the user name is supplied, the supplied password is verified against
    the user''s entry in the server''s password file. Once validated, a new share
    is created by cloning the default parameters specified in the [homes] section
    and associated with the user''s `$HOME` directory. Chapter 11 for additional information
    on sharing directories.


    If a **[printers]** section is defined in the Samba configuration file, the server
    attempts to match the requested share name against the set of printers listed
    in the `printcap` file. If a match is found, a new share is created by cloning
    the [printers] section parameters. Refer to Chapter 12 for details on defining
    and sharing printers.'
