    # Windows 2000


    Windows 2000 builds upon the Windows model by organizing domains into a hierarchical
    tree structure supporting both central and distributed administration (Figure
    10.7). The collection of data and administrative policies is managed by Windows
    2000 Active Directory. Active Directory is a combination of the legacy NT domain
    security architecture augmented with a set of technologies that include Lightweight
    Directory Access Protocol (LDAP), Kernel 5.0, and Internet-style Domain Name Service
    (DNS). Active Directory supports a mixed environment of Windows 2000 and Windows
    NT 4.0 domain controllers. Back-level clients can still log on using NT LAN Manager
    challenge/ response authentication.'
