    # ## Overview


    Samba is a versatile Swiss knife when it comes to printing subsystem interfaces.
    Printing is one area where there are substantial differences between the various
    UNIX implementations: daemons, configuration files, and commands. Samba does an
    outstanding job of supporting most of the popular UNIX printing systems. Once
    Samba knows the operating system type, enabling Windows and LAN Manager printing
    to local UNIX printers is a breeze ('
