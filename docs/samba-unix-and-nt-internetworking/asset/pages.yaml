    # Development


    The groundwork Internet community interest in Samba required well-known archive
    sites for the software to provide easy access to new releases and updates. E-mail
    discussion lists and newsgroups were set up to forums for asking questions, reporting
    bugs, and generally kibitzing about the project (Table 4.1). Because the Samba
    included source code, a number of porting and development efforts quickly surfaced.
    These ventures spanned the gamut from individual efforts to large institutional
    vendors and over time a core group of loosely knit development members surfaced
    that eventually became known as the Samba Team. As of writing Samba has been ported
    to most UNIX implementations as well as to a number of other operating systems
    (Table 4.2). The Samba Team is closely involved in the continuing standards related
    to the SMB and CIFS.


