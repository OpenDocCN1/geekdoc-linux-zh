    # smbpasswd Command


    The smbpasswd command is used to set and update the 32-byte fields in the smbpasswd
    file. Note that, unlike the UNIX password command, smbpasswd should not have setuid
    permission for Samba releases as of version 1.9.18p4. This version of smbpasswd
    acts as a client requesting that the authoritative Samba smbd daemon or NT domain
    DC update the password on behalf of the end-user. Its UNIX counterpart, the smbpasswd
    command requests the existing password and then prompts for the new password (Example
    7.6). Users with root permissions can include the -u<username> option to set the
    indicated users password.


