  md: '# Tailoring smb.conf


    The smb.conf file is a flat ASCII text file that can be modified with any text
    editor. The general format of the file is similar to that of Ini files. Configuration
    information is broken down into sections and delineated by a section name (Table
    6.1). Each section designates a service. A special global section defines overall
    system and administrative default, and the roles the server will assume in the
    workgroup or domain. The remaining sections in the file designate resources the
    server will make available to network clients. Sets of well-defined parameters
    are used to specify the properties of each section. Note that some parameters
    only apply to the global section while others only apply to "shares" sections.


    Table 6.1 smb.conf Sections


    | | System roles and defaults |

    | --- | --- |

    | [Global] | Home directory shares |

    | [Homes] | Printer shares |

    | [Printers] | User defined share |


    # Syntax and Semantics


    Each stanza in the smb.conf file represents a section name, parameter = value,
    or comment. Each section begins with a name enclosed in square brackets. The section
    name is followed by a collection of parameters and values, one per line, which
    describes the section''s role and attributes (Example 6.1). Section and parameter
    names are not case sensitive, although case is preserved for strings values. Parameter
    arguments are either Boolean or strings (Table 6.2). Each line is terminated by
    a traditional UNIX manner. Continuations are indicated by a "" or a \-". White
    space is generally ignored except when found within a string value. Quotes are
    not required for strings containing white space and are ignored if discovered
    by the parser. White space is used to separate string entries in values represented
    as lists.


    Example 6.1 Sample smb.conf Section


    ```

    #

    # A publicly accessible directory, read/write to all users.

    #

    [public]

    path = /usr/somewhere/else/public

    public = yes

    only guest = yes

    writeable = yes

    printable = no

    ```


