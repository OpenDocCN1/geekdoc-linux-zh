  md: '# Chapter 11: Sharing Files


    # Overview


    *Rumors of my assimilation have been greatly exaggerated.*


    # Picard


    It is Samba''s job to act as arbiter when assimilating UNIX and Windows resources.
    Samba''s melding of the OS protocol puts a logical communication channel for sharing
    files and printers residing in each of the two architectures. Samba resource services
    acquaint simple data transfer by incorporating features like name and attribute
    mapping, locking and caching, and multiple levels of access control. As with all
    the service definitions we discussed far, Samba service behavior is directed through
    parameters specified in the smb.conf configuration.


    # File Shares


    The most common form of resource under Samba is providing Windows client access
    to UNIX files. File shares are defined in the sections of smb.conf. With the exception
    of the special [homes] share, each file share is uniquely identified by a name
    enclosed in square brackets,[share name]. The share name is minimally followed
    by a path parameter defining the directory path. It is also a good idea to include
    a short description of the share specified by the comment parameter.


    ```

    [share name]

    comment = <text description>

    path = <directory path>

    ```


    Additional parameters may be added to each file share to tailor file name mappings,
    read/write permissions, enforce access control and specify special options. Parameters
    like preexec and postexec are used in a file share definition to induce special
    pre and post connect processing. For example, you might use root preexec to request
    a removable mount when a share is accessed (Example 11.1). An un-mount would follow
    at disconnect time using the root postexec parameter.


    # Example 11.1 Removable Media File Share


    ```

    [cdrom]

    path = /mnt/cdrom

    comment = Removable CDROM Share

    browse = yes

    read only = yes

    root preexec = /usr/sbin/mount -o ro /dev/cd0 /mnt/cdrom

    root postexec = /usr/sbin/umount /mnt/cdrom

    ```


    # Homes Share'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'The [homes] section is a special service provided by Samba to allow Windows

    client users to access their UNIX home directories. When an SMB connection setup

    is received, Samba scans the set of specially named names. If a match is

    not found, we will scan the password database attempting to locate a match for
    the

    client user. If a name match is found and the client has supplied the correct

    password, Samba grants access to a temporary [user name] share created by cloning

