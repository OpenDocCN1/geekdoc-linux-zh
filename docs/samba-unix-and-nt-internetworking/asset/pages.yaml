    # DOS and Windows File Attributes


    UNIX owner, group, and world execute permission bits don''t have a counterpart
    in the DOS and Windows world. This is because execute permission is implied by
    a file name extension of EXE. Likewise file attributes do not include anything
    like the archive, system, and hidden attributes used by DOS and Windows. Samba''s
    solution to this dilemma is to allow mapping of DOS/Windows archive, system, and
    hidden attributes to the UNIX owner, group, and execute bits. Attribute mapping
    is switched on or off by the map archive, map system, and map hidden parameters.


    ```

    map archive = <yes, no>

    UNIX owner execute bit

    map system = <yes, no>

    UNIX group execute bit

    map hidden = <yes, no>

    UNIX world execute bit

    ```


    Windows Access Control Lists (ACLs) are mapped into UNIX permission bits by enabling
    the nt acl support parameter.'
