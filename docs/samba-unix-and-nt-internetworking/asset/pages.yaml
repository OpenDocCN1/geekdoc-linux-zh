    # Chapter 3: Windows Overview


    # Overview


    In the last chapter, we looked at various pieces of the UNIX system and networking
    framework to assist in developing a model for sharing UNIX resources with Windows
    clients using Samba. In Chapter 3, we continue this thread by examining the corresponding
    Windows system and networking subsystems. We will look closely at Windows networking
    protocols, domains and workgroups, file systems, and access controls. Samba is
    an implementation of Windows file-and-print sharing services and also provides
    basic Primary Domain Controller (PDC) functionality. Thus a sound understanding
    of Windows protocols and domain services will be successfully deploying Samba
    in the enterprise.


    # Windows NT Architecture


    The Windows NT operating system is similar to UNIX in that processes interact
    with CPU, memory, and hardware via an executive services layer. NT employs preemptive
    multitasking to manage the execution of process threads in much as UNIX schedulers
    work. This allows NT to suspend tasks to provide resources for higher priority
    tasks. NT is also multithreaded, giving it the capability of running on symmetric
    multiprocessing platforms. This seems quite a bit like UNIX. The NT team spent
    several years refining and borrowing ideas from UNIX and other computing architectures,
    and utilized Carnegie Mellon''s microkernel as the foundation for the operating
    system.


    Windows NT is implemented as a layered subsystem architecture and supports'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'applications from a number of different operating system environments (Figure
    3.1). In contrast to the previous chapter''s bottom-up discussion of the UNIX
    OS layers, we will view Windows NT from the top down. At the top layer of the
    NT architecture stack reside user mode services. These include a Virtual DOS Machine
    (VDM) for running legacy DOS applications, a 16-bit Windows subsystem for Windows
    3.x programs, a POSIX OS2 subsystem, and the Win32 subsystem. Applications executing
    within a particular subsystem are managed as separate protected virtual memory
    spaces. User mode services interact with kernel mode services through the executive
    buffers. This buffer is a code section that partitions and protects user-mode
    and kernel-mode operations. Immediately below this buffer is the NT Executive
    Managers, which regulate object and process life cycles; virtual memory; procedure
    calls; I/O. The microkernel is limited to dispatching and synchronizing threads.
    The base of the operating system is made up of the Hardware Abstraction Layer
    (HAL), whose job is to hide hardware and device-driver dependencies from the rest
    of the operating system. This simplifies, secures, and generalizes the API for
    developing applications that use hardware services.


