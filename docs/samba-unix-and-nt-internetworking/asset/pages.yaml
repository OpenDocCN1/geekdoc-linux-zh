    # File Systems


    When comes to file systems, MS Windows is the 24-flavors ice cream of operating
    systems. Popular flavors include FAT, FAT16, FAT32, OS/2 and Samba, NTFS, and
    DFS. Then there are UNIX interoperability files: NFS and Samba. Windows provides
    a great deal of functionality in supporting legacy and contemporary file systems.
    This capability is especially useful in heterogeneous environments, regardless
    of whether there are multiple versions of Windows or a mixture of Windows and
    other operating systems.


    # FAT


    The file allocation table (FAT) file system represents the basic common denominator
    for file and directory support across the family of Windows platforms. The FAT
    architecture is essentially an indexed table that references data clusters within
    a partition of space on a disk. Cluster represents the smallest unit of storage
    on a disk. Cluster size ranges from 512 to 32k bytes depending on disk size and
    format.


    Because cluster size represents the smallest container for file or directory,
    it may be important to tailor the file system and drive format to make the file
    size profile for a particular data set.


    FAT file systems are defined by four control areas. The first or reserve area
    contains the boot sector, bootstrap program, and partition table. The next is
    the FAT index of clusters, followed by the root directory table, which is a directory
    of files and top level directories. The fourth area is the file collection of
    clusters where data are stored.


    FAT architecture has evolved over the years in keeping with the availability of
    larger disks and the demand for larger file sizes. Basically, this has meant an
    increase in the number of bits in the FAT used to index clusters. More index bits
    means more clusters can be'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'addressed. Originally the FAT architecture used 12 bits as a cluster index.
    In DOS 4.0 the second release of Windows 95, the FAT index grew once again to
    32 bits in FAT32.


    # DFS


    Windows NT introduced another player in the suite of Windows file systems, the
    New Technology File System (NTFS). In keeping with NT as a role in workgroup or
    domain server, DFS provides a scalable and recoverable file system to better support
    and secure server data. NTFS extended the directory index to 64 bits. NTFS allows
    to address RAID-based data sets that span multiple disk drives. The structural
    contents and state of NTFS is tracked and maintained in a relational database
    called the master file table (MFT). NTFS information, along with redundant copies
    of critical file system data and optional file mirroring, improves NTFS fault
    tolerance over FAT file systems in the event of a system failure. NTFS also provides
    enhanced data security over FAT. Access controls can be applied at the individual
    file level. FAT file systems only apply access controls at the directory level.


    # Printing


    It is difficult to locate directory shares in medium to large domains. Microsoft''s
    Distributed File System (DFS) was introduced to simplify locating directory shares
    and to provide users with a consistent hierarchy of available resources. Under
    DFS sharing residing on a number of servers can be organized into a single directory
    tree called a DFS tree. As clients traverse the directory tree, they are automatically
    directed to the server providing the share which makes that portion of the DFS
    alternate paths can be defined across multiple servers. When used in conjunction
    with Windows 2000 LDAP services in Active Directory can be used to identify DFS
    tree servers for clients. DFS is an add-on for Windows NTFS servers and a client
    add-on for Windows 9.


    Printers can be network-shared with other computers in a workgroup or domain in
    the same way that directories are shared. A physical printer is first defined
    on the server via a simple Add Printer Wizard. The new printer is associated with
    the appropriate driver and is then represented in the system by a virtual printer
    and queue. Note that multiple physical devices called a printer pool may be referenced
    by a single queue name. Once the printer definition is complete, the printer can
    be assigned a name that is available for remote access.


    The remote client uses the same printer definition and selects "network printer"
    as the target. If the target server needs the network client driver for the particular
    printer, the driver will be automatically downloaded from the server and installed
    on the client. After installation is complete, the network printer can be used
    by applications as if it was a local device.


    For the local application or user, there is little discernible difference between
    a local or remote printer. Documents to be printed on a particular device are
    routed into the associated queue name and processed by the printer server process
    (Figure 3.11). If the destination is a remote site, the document is transferred
    to the remote site by the network redirector, otherwise it is routed to the local
    device.'
  merge: -1
  img_proc: true
