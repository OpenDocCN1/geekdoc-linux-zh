  md: '# NFS


    A common way of sharing files and directories between networked UNIX systems is
    Sun''s Network File System (NFS). NFS is a stateless file sharing protocol based
    on a set of Remote Procedure Calls (RPCs) and an External Data Representation
    (XDR) specification to trace, reroute, and communicate file operations and attributes
    between machines. NFS is based on a client/server architecture that enables enables
    applications to interoperate seamlessly on remote files and directories without
    regard to their locale. Sun placed this architecture in practice and it became
    a de facto standard for distributed file systems under UNIX. NFS is supported
    on many other operating systems including Windows. Again, it is important to understand
    NFS and its relationship to Samba directory shares in mixed environments.


    NFS servers rely on a number of daemons to manage distributed file system services
    (Table 2.9). I/O requests from multiple clients are multiplexed through a configurable
    number of nfsd and bind daemons. The nfsd daemons manage file I/O operations and
    the bind daemons control block I/O services. NFS servers register themselves with
    the portmap daemon maintains the list of RPC applications on a particular machine.
    Client queries use the portmap daemon to determine the port number associated
    with a known service name. Each daemon is used by the server to manage and track
    client requests. Recent RPC operations between clients and servers are cached
    by the server''s rpc.statd daemon. SYSV advisory file and record locking is supported
    by the server''s rpc.lockd daemon.


    ![](img/fefda0da589a61a5ed84314561e6844b_27_0.png)


    Figure 2.4: NFS client to server interface'
  merge: -1
  img_proc: true
