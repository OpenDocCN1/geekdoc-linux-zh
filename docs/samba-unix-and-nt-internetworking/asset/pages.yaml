  md: 'Domains also offer a means for authorizing access to resources residing in
    separate domains through trusts. A trust relationship is a link that logically
    combines domains into an administrative unit. The trust relationship may be applied
    one way (domain A trusts domain B, but domain B does not trust domain A) or two
    ways (domain A and domain B trust each other).


