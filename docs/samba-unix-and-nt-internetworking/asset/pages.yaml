    # WINS


    We''ve already talked about how WINS streamlines NetBIOS name service. The primary
    features are WINS automation of namespace maintenance due to the dynamic nature
    of NetBIOS name registration, the reduction in broadcast traffic through point-to-point
    communications between WINS client and server, and support of browsing across
    subnets (Figure 8.4).


    ![](img/fefda0da589a61a5ed84314561e6844b_116_0.png)


    Figure 8.4: Multi-subnet WINS


    Samba can participate in a WINS environment by assuming any of four roles. It
    can act as a WINS client interacting with a designated WINS server. It can adopt
    the responsibility of the primary WINS server, registering and resolving client
    requests. It can'
