    # Workgroups


    In a small homogenous MS Windows environment, it might be possible to operate
    on a friendly peer-to-peer basis. You let me play with your toys and I''ll think
    about letting you play with mine. This type of environment is usually implemented
    as a workgroup (Figure 3.6). Workgroups provide a means of grouping users and
    resources that share a common work profile. Workgroups also simplify the task
    of locating resources in the network. It may not be necessary to browse for a
    particular resource on every workstation on the network, because it may be that
    the resource is known to reside in a particular workgroup, thus reducing the number
    of systems to be checked.


