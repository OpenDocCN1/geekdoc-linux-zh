  md: '# Win 2K filenames


    File name 255 chars


    All chars except \/:*?<>|


    Win32, LFN, Universal Naming Convention (UNC) names


    # Table 11.4 Samba File Name Mangling Rules


    +   1. The first five alphanumeric characters of the UNIX file name are uppercased
    and used as the new file name. Non-alphanumeric characters are ignored.

    2. A "-" or the character designated by mangling char parameter is appended to
    the new five-character root file name and is followed by a two-character hash
    of the original file name without any extension.

    3. The first three characters of the original file extension are uppercased and
    used as the new extension. If there are no periods in the original file name,
    then no extension is applied.

    4. If not specified as above, file names with a leading period (UNIX hidden files)
    are treated as above having the leading period removed and have an extension of
    three "_" characters.


    Samba also maintains a cache of recently used mangled file names. This is done
    to prevent problems related to reverse name mangling. Many DOS or Windows applications
    may attempt to create a UNIX file using a mangled name during a rename operation.
    For example, text editors open a file, rename the previous version using a BAK
    extension, and then rewrite the modified file with the original extension. You
    can specify the number of cached names using the mangled stack parameter.


    ```

    mangled stack = <integer>

    ```


    You can easily tailor name mangling translations for each share using the parameters
    listed in Table 11.3. Example 11.9 demonstrates a UNIX-to-DOS 8.3 translation
    with UNIX and Windows views of the same UNIX home directory.


    # Table 11.3 Samba Name Mangling Parameters'
