    UNIX has been around for about 30 years. Initially found primarily in academia
    and research environments, it is a powerful multi-user, multitasking operating
    system suitable for a wide range of applications. It is easily scalable from small
    single-user workstations to widely large mainframe, multiprocessor, and cluster
    architectures supporting thousands of simultaneous users and processes. Because
    of the availability of source code, C programming language, and a solid focus
    on standard interfaces and protocols, UNIX is portable to most hardware platforms.
    This has resulted in a rich set of public and vendor implementations. Yet general
    access to source code has kept UNIX somewhat vendor independent. When we use the
    term "UNIX" we are usually referring to the full array of vendors available in
    the marketplace. It is true that each UNIX tends to have its own nuances, add-on
    features, and variations on the basic theme, but in general functionality has
    remained quite consistent across platforms over its long development history.
    In fact, the collective expertise of this large development community has greatly
    contributed to the overall maturity, interoperability, and robustness of the operating
    system.'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'On the down side, the most prominent complaint concerning UNIX is directed
    at its character-based command-line user interface. Although the rich set of commands,
    interpretive shells, and scripting languages provide a great deal of functionality
    for the programmer and systems administrator, their use and existence are not
    easy for the novice user. Most commands are cryptic shorthand and define context
    from the shell under they are invoked. This can be quite confusing to all experienced
    users. A graphical user interface called X can be added to the operating system,
    but it does not entirely shift the interfaces of the command interface. Another
    criticism is that most applications can be easily ported between the various versions
    of UNIX, which are generally not binary-compatible from one vendor to another.
    This has tended to limit the availability of some products across UNIX platforms.


    UNIX has found a home in many businesses because of its open interfaces and tight
    integration with Internet technologies. UNIX and the Internet grew up. As specifications
    for internetworking protocols like TCP/IP were developed, they were quickly interwoven
    into the fabric of UNIX. Most of what we have to come considering basic information-sharing
    services over the Internet were developed under UNIX. This enabled UNIX to be
    used as a protocol and server Swiss Army knife for quickly and cost effectively
    connecting legacy computing infrastructures to the Internet.


    # Table 1.3 Windows Development History


    | | |

    |---||

    | 1980 -- | IBM contracts with Microsoft for PC OS Bill Gates buys QDOS MS-DOS
    created from QDOS |

    | 1981 -- | First IBM PC MS begins "Interface Manager" development |

    | 1983 -- | Windows announced MS-DOS 2.0 |

    | 1985 -- | Windows 1.0 Dropdown menus Mouse support |

    | 1987 -- | Windows 2.0 Icons and overlapping windows MS & IBM begin work on OS/2
    MS & IBM split on OS/2 and Windows development Windows/386 |

    | 1990 -- | Windows 3.0 Program and File Manager Network support |

    | 1991 -- | Windows 3.1 Object Linking and Embedding (OLE) Multimedia |'
