    # # Chapter 10: Domains


    # ## Overview


    Thus far, we''ve generalized our Samba configuration discussions so that they
    would apply equally well in either a workgroup or a domain network model. Samba
    services like WINS master browser work equally well. In this chapter we depart
    from the general track and focus specifically on integrating Samba in a Windows
    domain.


    # ## Domains vs. Workgroups


    Windows domains are similar to workgroups that they represent a group of users,
    services and computers that collectively share a common namespace. Domains differ
    from workgroups, in which a domain enforces an account policy and management across
    its members. Account information is stored in a secure central repository called
    the Security Accounts Manager (SAM). The SAM database is maintained on the primary
    domain controller and replicated on each of the backup domain controllers (Chapter
    3). What this means for the system administrator is that there is a central location
    for managing accounts, access controls and policies for the entire domain. End-users
    benefit from the domain model in gaining access to all domain resources as a single.


    Domains improve access security over workgroups because client authentication
    is performed only once using a secure communication with the PDC domain controller.
    Once authenticated, access to resources is governed by applying access controls
    over the client''s group memberships. Domains are a group of categorizing users
    with similar needs and preferences.


    In contrast, each workgroup client maintains a persistent local cache of accounts
    and passwords to access a network resource. A separate credential cache is created
    for each active user and stored in the windows directory as <username>.FWL. Windows
    opens the cache file using the user''s login password as a key. During connection
    to a network resource, each entry in the user''s credential cache is tried until
    authentication is accepted or denied. Credentials stored in these cache files
    are persistant vulnerable to security threats due to the weak encryption employed
    and their persistent nature logons by different workstation users.


