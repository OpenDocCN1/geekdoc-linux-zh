    # # Domains


    Centralized management of accounts, passwords, and shares can be more easily realized
    by implementing a Windows domain model for the network. A Windows domain is a
    logical collection of users and computers that share a common security policy
    and namespace. In each domain, one or more Windows NT computers, called domain
    controllers, act as a focus for administering and resolving access to all the
    resources located in the domain. The Primary Domain Controller (PDC) maintains
    a directory of all the account, group, and password information for the domain.
    This directory is called the Security Accounts Manager (SAM). To log in a computer
    or access a resource in the domain, the domain controller is first consulted to
    validate user credentials before access'
