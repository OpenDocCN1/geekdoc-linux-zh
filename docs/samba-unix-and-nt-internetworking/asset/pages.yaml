    # Variable and File Substitution


    A powerful Samba feature that will assist in simplifying smb.conf configuration
    is

    variable substitution. Samba provides a fixed set of variables, prefixed by a
    "%%s" sign that

    take on values during runtime processing. Variable substitution can be used anywhere\within
    the smb.conf file where a string value is valid. For example, the "%%s" variable
    is

    often used to associate the requesting client''s NetBIOS name to a local server
    resource

    like a file.


    ```

    log file = /usr/local/samba/var/%%m.log

    ```


    Given a client NetBIOS name of WIZARD, /usr/local/samba/var/%%m.log becomes

    /usr/local/samba/var/WIZARD.


    Some variables may be within the context of a share section. These would include

    variables like the requested service name or the validated UNIX account name.
    The

    remaining set of variables may be used in all sections. Table 6.3 lists the set
    of

    predefined variables in Samba Version 2.0.5a. Share section variables are listed
    at

    tottom of the table.


    # Table 6.3 smb.conf Defined Variables


    +   %%G = primary group name of %%u


    %%I = the IP address of the client


    %%L = the NetBIOS name of the server. This allows you to change your config based
    on

    what the client calls you. Your server can have a dual personality.


    %%M = the name of your NIS home directory server. This is obtained from your NIS

    auto.map entry. If you have not compiled Samba with the autmount option then this

    value will be the same as %%L.


    %%R = the selected protocol level after protocol negotiation. It can be one of
    CORE,COREPLUS, LANMAN1, LANMAN2, or NT.


    %%T = the current date and time


    %%U = session user name (the user name that the client wanted, not necessarily
    the

    one they got—i.e. UNIX user name that was actually used).

    %%A = the architecture of the remote machine. Only some are recognized, and those
    may

    not be 100% reliable. It currently recognizes Samba, WinNT, WfWg, and Win95. Anything

    else will be known as "UNKNOWN". If it gets wrong, then sending a level 3 log
