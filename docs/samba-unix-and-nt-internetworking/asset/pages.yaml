    # # Problems


    Like distributed network servers, there are a number of things that can cause
    problems when incorporating Samba in a browsing environment. If things aren''t
    working the way you expect, first check that the `smb.conf` parameters are configured
    correctly. Next verify that you mapped the guest account parameter to a valid
    UNIX account for $IPC service. Check the `nmbd.log` for anomalies and error messages.
