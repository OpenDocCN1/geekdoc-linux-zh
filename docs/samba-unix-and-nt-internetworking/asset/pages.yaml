    # Windows 2000 Service Name


    Windows 2000 depends on the WINS track that it relies on DNS for resolving names.
    The Active Directory component of Windows 2000 uses Internet-style names for naming
    objects in the directory. Internet names are translated into domain components
    when entries enter the directory (Example 6.5). WINS integration support is included
    in Windows 2000 backward compatibility with older clients and servers. Two special
    DNS resource record types, WINS and WINS-R, are designed to be consulted when
    WINS-based DNS lookup fails. The facility can also be used to set up a WINS-only
    DNS server for requests without explicit subdomain. For example, you might define
    a DNS subquery called wins. Any queries for domain names that this include would
    be referred to the DNS server that resolves WINS NetBIOS names. Refer to "Using
    WINS Lookup" in Windows 2000 help for more information. Windows NT 4.0 WINS integration
    can be used to map WINS NetBIOS names into DNS as a bridge between WINS environments
    and Windows 2000.


    Example 8.5 opus.cas.washington to Domain Component Name


    ```

