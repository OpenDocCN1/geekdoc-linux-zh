- pgno: 61
  md: 'outperformed NT and NetWare. Samba 2 running on SGI Origen 200 has also been
    shown to outperform the custom network storage architecture implemented in the
    Network Appliance F760.


    Windows 2000 likely represents the most acute challenge for the Samba Team. New
    features in Windows 2000 like LDAP-based Active Directory services, Kerberos 5.0
    authentication, Dynamic DNS, and file system modifications are departures from
    the legacy Samba-NetBIOS architecture. Windows 2000 provide backward compatibility
    for NTFS-types, ensuring interoperability with Windows and LAN client servers.
    Technologies like Kerberos and LDAP are already widely used in the UNIX community
    and there are subtle differences in the way they are implemented in Windows 2000.
    There is an opportunity here for Samba to continue playing a role in integrating
    both the old and new UNIX and Windows worlds. In the remaining chapters of Samba
    installation and configuration, we will take a closer look at issues regarding
    Samba and Windows 2000 coexistence.


    # Summary


    +   Samba is a UNIX implementation of the SMB protocol for sharing UNIX files
    and printers in Windows and LAN Manager-based networks.


    +   Samba was created by Andrew Trill of Australian National University by reverse
    engineering the SMB protocol.


    +   Samba development is a collaborative process whose primary contributors are
    around the Samba Team.


    +   Samba is an "open source" software suite available to anyone for use under
    the GNU General Public License (GPL).


    +   The bulk of Samba functionality is provided by the nmbd and smbd daemons.


    +   Samba provides NBNS, WINS, and DNS gateway services.


    +   Samba provides NetBIOS Browser services for single subnet and routed networks.


    +   Samba implements the full NT functionality of an NT primary domain client.


    +   Samba can emulate the basic functionality of an NT primary domain controller.


