    # Privileges and Permissions


    Now we''ve narrowed connection rights down to an explicit community of client
    users and machines, we''ll want to bind the set of operations performed on file
    and directory objects within the share. This is accomplished by indicating whether
    a user has read or write privileges based on effective UNIX user and group identifiers,
    and how UNIX owner, group and permissions are specified for manipulating files
    and directories. Keep in mind that Samba must honor UNIX permissions regardless
    of the parameters designated for the share in smb.conf.


    Read/write permissions can be specified at the share level or user level using
    the readonly, list, writeable, and write list parameters. If the user name is
    prefixed with "*" sign or "&" it is intended to correspond to a NIS network. If
    it is prefixed with a "*" sign, the name is chained as the UNIX group file. The
    "*&" characters can be combined to indicate that a check be made against both
    UNIX group files and NIS networks.


    ```

    writeable = <yes, no>

    write list = <comma separated user list>

    readonly = <comma separated user list>

    read list = <comma separated user list>

    ```


    Due to the wide range of access controls employed by DOS, LAN Manger, Windows
    98 and Windows NT Samba requires a set of mechanisms to ensure that attributes
    are reflected in correlating UNIX file and directory permissions. This is carefully
    achieved through a set of mask (synonym for mask) parameters that guarantee appropriate
    application of UNIX permissions.


    There are two levels of masking that can be applied when a client creates a file
    or directory within a Samba file. The first set of mask parameters are bit-wise
    AND''ed with the UNIX permissions resulting from the mapping of DOS modes or NT
    access controls. Any bit not matching the mask will be removed from the resulting
    UNIX permission bits when the file or directory is created. The first-level mask
    parameters include create mask (DOS), directory mask (DOS), security mask (NT),
    and directory mask (NT). Values for each of these parameters are designated as
    an octal mask:


    ```

    create mask = <default=0744>

    directory mask = <default=0755>

    ```'
