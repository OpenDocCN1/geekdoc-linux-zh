- pgno: 160
  md: '# Global Print Parameters


    First and foremost when you are configuring Samba as a print server, identify
    the operating system type. It enlightens Samba about the nature of the commands
    and configuration files that will be used in interoperation with the print spooling
    system. The operating system type is identified by the global printing parameter.
    Supported operating systems include AIX, BSD, HPUX, LPRNG, PLQ, QNX, SOFTQ, and
    SYSV.


    ```

    printing = <print name>

    ```


    Once the operating system type is known, Samba needs to know the location of the
    printer configuration file. The path name of the printer configuration file is
    specified by the global printcap name. Samba matches client printer access requests
    against the queue names listed in the configuration file. Valid targets for a
    match include all printer aliases defined in the printer database. Default values
    for printcap name, based on the specified operating system type, include /etc/printcap
    for BSD systems, /etc/qconfig for AIX, and lstat for SYS systems. In the case
    of SYSV, Samba invokes the lstat command to obtain the list of available printers.


    ```

    printcap name = <print config file>

    ```


    If you don''t want to make all the printers in your printer configuration file
    available for client access, consider using an alternate configuration file for
    your workgroup or domain. Make a copy of the default printer configuration file
    using a different file name or path. Remove those printers to which you want to
    restrict access. Use the copy configuration file as the value of the printcap
    name parameter. Don''t forget that you will need to keep synchronized the printer
    configurations that reside in each file.


    To make the set of available printers visible to browsing, enable the global printers
    parameter. The default setting, yes, will add all printers listed in the printer
    configuration file to the browse list.


    ```

    load printers = <yes, no>

    r at least a small game.

    ```


    # Print Share


    Print shares are defined either with an explicit share name enclosed in square
    brackets or by using the [printers] share (section). A minimal share definition
    will include a path parameter designating the location of a writable spool directory.
    It may be set printable or the server will not load the configuration. Set the
