  md: 'is granted to the resource (Figure 3.8).


    ![](img/fefda0da589a61a5ed84314561e6844b_45_0.png)


    **Figure 3.8:** Simple domain model


    SAM information can be replicated on one or more additional domain controllers
    called Backup Domain Controllers (BDC). The presence of a BDC assists in ensuring
    fault tolerance for the SAM directory. A BDC will also respond to a validation
    request at times when the PDC is busy or unavailable due to a system or network
    failure. The existence of a BDC is not required, but it should be carefully considered
    for large, geographically distributed domains.


    # Trust


    In instances an organization''s business rules, administrative structure, or geographic
    layout doesn''t neatly the single domain model, multiple domains can be set up
    and logically connected through trust relationships. Users in a trusted domain
    are allowed to access resources and group membership in the local domain without
    duplicating SAM directory entries in both domains. This feature provides a means
    for distributing administration functions in large enterprises.


    Trust relationships can be broken down into three models, one-way trust, two-way
    trust, and complete trust. In a one-way trust model, domain A permits access to
    local resources by domain B, but domain B does not return the favor by permitting
    access to its resources. In a two-way trust environment, access to resources in
    domains A and B are permitted in both directions. In the complete trust model,
    all domains have access to all resources, no matter where they are located. Complete
    trust or combinations with the other models are very difficult to manage.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# Domain Models


    The ability to replicate the SAM directory and define trust relationships between
    domains provides a great deal of flexibility in designing a robust and scalable
    infrastructure. In reality, the sky is the limit concerning domain topologies.
    However, there are three common domain models that may be useful in planning an
    environment.


    The simplest model is the single domain infrastructure described previously. All
    participating resources are members of a single domain. The domain has one PDC
    and may have one or more computers as BDCs. This model is the easiest to administer
    may be awkward for large numbers of users or machines.


    To facilitate management of large populations of users and resources, yet maintain
    a single domain for the user namespace, it is possible to separate administration
    of the SAM directory and resources into domains. This model is called the master
    model, and it maintains the SAM directory. One or more resource domains are defined
    to manage shares. A one-way trust relationship is defined to allow users in the
    master domain to access the shares in the resource domains. This model supports
    central administration of the user namespaces and allows for local administration
    of shares in the resource domains.


    In large distributed organizations, it may make more sense to partition the namespace
    to localized administration of user accounts and resources. This multi-master
    domain model represents the opposite of the spectrum from the single domain model.
    The namespace is broken up into administrative units, each with its own security
    policy and defenses. Trust relationships are established as well to facilitate
    interoperability between domains. As mentioned in the discussion on trust, this
    model is the most difficult to manage and requires close coordination between
    domain administrators.


    # Trees and Forests


    Windows 2000 builds upon the domain model by organizing domains into a hierarchical
    tree structure supporting both central and distributed administration (Figure
    3.9). It also increases the maximum size to 10,000,000 objects. Windows NT 3.5
    supports 10,000 objects and Windows NT 4.0 supports 40,000. The collection of
    domains and administrative policies is managed by Windows 2000 Active Directory,
    a combination of the legacy NT security architecture with a set of open technologies
    that include Lightweight Directory Access Protocol (LDAP), Kerberos Version 5.0,
    and Internet-style Domain Name Service (DNS). Active Directory supports a mixed
    environment of Windows 2000 and Windows NT 4.0 domain controllers. Back-level
    clients can still log in using NT LAN Manager challenge/response authentication.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '![](img/fefda0da589a61a5ed84314561e6844b_47_0.png)


    Figure 3.9: Active Directory domain tree


    An Active Directory tree is a hierarchy of domains that represents a contiguous
    namespace with a common LDAP schema and Kerberos transitive trust relationships.
    A schema defines the attributes associated with each object in the namespace.
    Kerberos trust is similar to the domain trust relationships we have already described.
    A group of trees which share common schema and trust relationships can be grouped
    into a larger administrative unit called a forest. Active Directory tree and forest
    information, replicated across multiple servers, but in a multi-master topology
    versus the backup model used by domains.


    Active Directory augments the domain trust model by layering a tree with an independent
    structure called an Organizational (OU) tree. An OU is a container that holds
    network objects including users, groups, shares, and others. Individual OU security
    attributes are defined by the Active Directory schema. OUs provide a finer degree
    of administrative authority that is independent of domain boundaries. An individual
    domain may implement an OU within the domain to distribute administrative functions
    to subdomains. A central IT department might define a global OU that covers all
    domains to centralize of the namespace.


    # Browsing


    Workstations locate shares by browsing. Basically, browsing is akin to window
    shopping in a large mall or shopping center. We go from one network computer store
    to the next, looking to see what resources might be available for use (Figure
    3.10). There are two categories of browsers, browser clients and browser servers.
    Clients query browser servers to locate resources. Grouping resources by domain
    or workgroup limits scope and simplifies the task of locating the desired resource.'
  merge: -1
  img_proc: true
