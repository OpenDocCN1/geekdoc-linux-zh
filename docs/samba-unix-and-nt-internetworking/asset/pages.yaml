    # Roaming Profiles


    Most of us spend much time actually tailouring our Windows desktops. Our chosen
    background desktop, text fonts, application shortcuts, and screen saver all reflect
    a bit of our century. Everything has to be in its proper place on the screen.
    After putting so much effort, we all get it liked when our carefully crafted desktop
    doesn''t automatically follow us as we move from one to the next.


    There is a solution to this dilemma called a roaming profile, which has been stored
    on a network drive and copied to the local workstation at logon time. The profile
    itself is a collection of Windows environment settings used in concert installed
    applications and folders to create the user''s working desktop. Profiles are cached
    copies of the Windows Registry Key HKEY_CURRENT_USER and stored as a file named
    DAT under Windows 9 and nt for Windows NT. The HKEY_CURRENT_USER reflects the
    desktop preferences set by the current logged in.


    The collection of profiles is commonly used by user name in a PROFILES directory
    under the root system on the domain controller. When a user logs on to the domain,
    Windows checks the time of the remote profile stored on domain. The most recent
    copy is used to set up the user''s desktop environment. When the user logs out,
    the profile is copied back onto the domain controller. Assuming no problems have
    occurred during domain logout, the most recent copy of the profile will reside
    on the domain controller and will be available when the user logs on from any
    domain.


    Profiles also provide the system administrator means for configuring or default
    desktop rules for users. If the file extension of the profile is changed from
    DAT to MAN, the profile becomes a mandatory profile and will be used to set the
    initial desktop environment. The end-user can modify the desktop during the session,
    but those changes will not be reflected in the mandatory profile stored on the
    domain controller.


    Roaming profiles are designated in Sam by the logon path. The default path is
    to the profile in the user''s home directory. Due to the problem that Windows
    clients may leave the home directory mounted after logout, it is recommended to
    specify an alternate repository for storing roaming profiles. A simple solution
    to create'
