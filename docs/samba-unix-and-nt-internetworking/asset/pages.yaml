    # NetBIOS Names


    You may recall that all NetBIOS resources are bound by a 16-byte identifier that
    represents the resource''s unique name or group name (Example 8.1). The first
    15 characters represent the alphanumeric name that identifies the resource. The
    16th byte is a hexadecimal name that designates the type of resource.


    # Example 8.1 NetBIOS Names


    ```

    <<15byte_NetBIOS_name>

    ```


    # Table 8.1 NetBIOS Resource Types


    # Unique Resource Type


    | <00> | Workstation service name |

    | <03> | Messenger service name |

    | <06> | RAS server |

    | <1B> | Domain master browser |

    | <1F> | NetDDE service |

    | <20> | Server service |'
