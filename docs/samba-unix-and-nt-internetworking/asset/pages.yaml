    highest election criteria becomes the local master browser for the subnet. The
    losers are demoted to backup browsers for redundancy and load sharing purposes.
    New elections are called on a periodic basis, at boot time, and by a client due
    to a communication error.


    # Table 9.2 Election Criteria


    | OS Level | | |

    |---|---||

    | Windows for Workgroups | 0x01 | 1 |

    | Windows NT Workstation | 0x10 | 16 |

    | Windows NT Server | 0x20 | 32 |


    # Desired Role


    | | | |

