    ":" to delimit each field. Take special note of the two fields that contain 32
    "X" characters. These two fields are placeholders for the LAN Manager and NT versions
    of the hashed password respectively. It is crucial that the fields initially contain
    32 "X" characters if they are to be recognized by smbd.


