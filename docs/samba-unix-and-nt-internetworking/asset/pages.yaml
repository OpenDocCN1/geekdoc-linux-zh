    # smbprint


    Samba supports UNIX printing to remote Windows printers via a spooling filter,
    smbprint. The smbprint is another script wrapper for the sambclient command. smbprint
    pipes input into sambclient which handles the connect with the remote Windows
    spawning service. Two versions of the smbprint script are provided, smbprint (BSD)
    and smbprint.sysav (SYSV). The scripts are located in the Samba distribution subdirectory
    ./examples/printing. Refer to the "Windows Printers" section of Chapter 12 for
    details on using the smbprint interface.


