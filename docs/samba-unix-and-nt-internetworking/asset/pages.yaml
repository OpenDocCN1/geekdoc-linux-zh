    # Kerberos


    Windows 2000 enhances the SAML mechanism by integrating Kerberos 5.0 for network
    authentication. This third-party authentication system described in the previous
    chapter on UNIX, is component of Windows 2000 Active Directory. Kerberos provides
    additional interoperability between Windows and a number of other vendor operating
    systems and applications that support the MIT Kerberos protocol. Note that Kerberos
    is an authentication system and does not necessarily authorize information. Microsoft
    has enhanced Kerberos by incorporating access control information into an unused
    field which is ignored by MIT Kerberos systems and does not affect overall interoperability.
    Windows 2000 clients can be configured to use MIT Kerberos server for authentication.
    Under this configuration, authorization information is collected from Windows
    2000 servers via Kerberos transitive trust


