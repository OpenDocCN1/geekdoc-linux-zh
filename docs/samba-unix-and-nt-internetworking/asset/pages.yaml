  md: '# Hybrid Cross-Subnet Browsing


    In some instances you may need to force announcements or browse list synchronization
    between subnets for topologies that don''t quite fall into the configurations
    we''ve examined far. There are any number of reasons for doing this, but note
    that the capability is not available in a native Windows environment.


    You can force Samba server announcements to traverse subnet boundaries by using
    the remote announce parameter. The value of the parameter is a list of remote
    subnet master IP addresses that are the targets for announcements. An arbitrary
    workgroup name can be matched with each IP address to identify the workgroup Samba
    will use for each subnet (Figure 9.5). If the workgroup name is omitted, the value
    of the global workgroup will be:


