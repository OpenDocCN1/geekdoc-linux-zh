    # UNIX Client


    Samba is not a CIFS/SMB one-way street. Along with its role as a CIFS/SMB server,
    Samba provides UNIX client access to remote shares via smclient, smbwrapper, smbtar,
    and smprint applications.


    # smclient


    smclient is an extremely useful tool for testing Samba and Windows configurations.
    In essence, smclient is an ftp-like CIFS/SMB command line client application.
    Capabilities include moving files to file shares, creating and removing files
    and directories, printing files on printers, and exercising NetBIOS name-to-address
    resolution.


    As you might imagine, a wide range of features also leads to a wide range of command
    parameters. It turns out that the parameter set is larger than we might think.
    What follows is a synopsis of smclient parameters and a few commonly used examples
    (Example 13.1).


    When experimenting with the following parameters, keep in mind that Samba must
    interact with a wide range of CIFS/SMB platforms. Platforms vary degrees of protocol
    compliance. Some platforms can be a bit stubborn when it comes to parameter combinations
    and character case. If at first you don''t succeed, try repeating the request
    using uppercased user names, NetBIOS names, and service names.


    ```

    smclient <service name> [password] [-s sm.conf path] [-B IP addr] \

    [-o options][-R name remove order] [-M NetBIOS name] \

    [-i scope] [-N] [-n NetBIOS name] [-d debug devel] [-P] [-p port] \

    [-l log base name] [-h] [-I IP] [-E] [-U user name] \

    [-L NetBIOS name] [-t terminal code] [-c max protocol] \

    [-W workgroup] [-T c IXFQban] [-D directory] [-c command string

    ```


