  md: '# Building Samba


    Compiling and installing Samba is a simple, automated process conducted using
    the UNIX make command. Version 2.x simplifies the task by including GNU autoconf
    to tailor Makefile parameters to match operating system type and configuration.
    Pre-version 2 distributions require a bit of administrative housekeeping that
    Makefile parameters must be set by hand. Parameters include compiler flags, install
    paths, and authentication methods. The Makefile is well documented and includes
    examples of common settings for operating systems. See Table 5.3 for a listing
    of the common variables and flags. To build and install Samba, move to the top-level
    source directory and follow the steps listed in Example 5.3.


    # Example 5.3 Samba Build Process


    +   1. $ configure Version 2.x and newer only.

    2. $ make Compile and load step.

    3. $ make install Install binaries in target directories.


    If you are upgrading from a previous release and are using the same source distribution,
    the old release binaries are copied into a .old directory. You can recover the
    previous release by invoking make revert. Note that if you execute make install
    twice, the old release binaries will be overwritten.


    ```

    $ make revert Restore old release binaries

    ```


    # Table 5.3 Sampling of Pre-Version 2.0 Makefile Variables


    OS Flags (make Makefile)

    FLAGSM = -DCOS Type>-DSHADOW_PWD Shadow Passwords

    LIBS = -shadow

    CC = gcc C Compiler

    INSTALLPERMS = 0755 Permissions


    # Install Directories


    ```

    BASEIR = /usr/local/samba Binaries

    BINDIR = $(BASEIR)/bin Binaries

    SBDIR = $(BASEIR)/bin

    LIBDIR = $(BASEIR)/lib Libraries

    VARDIR = $(BASEIR)/var Spool dir

    MANDIR = $(BASEIR)/man Man pages

    ```


    # Logs & Links


    ```

    SMBLOGFILE = $(VARDIR)/log.smb smbd log file

    NMBLOGFILE = $(VARDIR)/log.nmb nmbd log file

    LOCKDIR = $(VARDIR)/locks Lock files

    ```'
