    +   - queue Display print queue jobs by ID, name, size, and status.


    +   - quit See the exit command.


    +   - rd <directory name> See the rmdir command.


    +   - recurse Toggle mput and mget directory recursion. When toggled on, these
    commands will walk the source directory collecting files that match the mask pattern.
    See also the mask command.


    +   - rm <mask> Remove files that match the mask pattern from the current working
    directory.


    +   - rmdir <directory name> Remove the specified directory from the server file
    share.


    +   - c|x[xbgna] Create or extract an archive. See the -T command line option
    above. See also blocksize and tar commands.


    +   - blocksize <blocksize> Causes the tar file to be written out per the specified
    blocksize multiplied by TBLOCK (TBLOCK is set compile time, default 512).


    +   - tarmode[full|reset][nreset] Sets tar behavior per file archive bit settings.


    +   - full-all files added to archive.


    +   - inc-only include files with archive bit set.'
