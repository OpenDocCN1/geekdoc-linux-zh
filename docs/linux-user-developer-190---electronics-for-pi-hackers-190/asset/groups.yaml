    # # LinuxUser & Developer


    # # Welcome


    to issue 19 of Linux User & Developer


    # in this issue


    +   » Electronics for Pi Hackers, p18

    » Next-gen Distros, p64

    » Reviewed: Raspberry Pi B+, b86


    Welcome to the UK and North America''s favourite Linux and FOSS magazine. We look
    back at what dismay us this past month as we reflect on the passing of Professor
    Stephen Hawking, a giant in the field of theoretical physics and most ''intelligent''
    guest on The Starship. We also had the Pi-shaped appearance on our radar (see
    p86 for Raspberry Pi B+), which we cleared out to be of new Pi, so we''ve consoled
    concerns with a big, Electronics for Pi Hackers (p18) building circuits and ways
    to invent the Pis with the new Linux 3 B+ is a great addition with inspiring networking
    charms, and we''ve already predicted for futures in issue. Also this month, we
    attempt to predict what the big trends will be in Linux distros (p64); look at
    the new XPS 12 (p62) and consider the fantastic world of Google Sputnik, using
    medical devices (p32). Of course, to top all off we have a hearty batch of tutorials
    to deavour! Enjoy Chris Horner,


    Future PLC Quay House, The Amery, Bath BA1 9UA


