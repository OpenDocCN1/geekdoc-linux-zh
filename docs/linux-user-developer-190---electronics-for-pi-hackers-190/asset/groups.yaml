    \ 1 所示，包含单个 .ada 文件。该文件填充了类似下面的代码：\n\n```ada\nprocedure Tutorial is\nend Tutorial;\n\
    \nPut_Line(\"Hello, world!\");\n```\n\n这是一个 Ada “过程”（procedure）的大纲，它类似于 C++ 等编程语言中的\
    \ void 函数。我们在中间添加了一行代码来打印我们的消息。\n\n# 教程：\n\n让我们尝试点击三角形的运行（Run）按钮来执行它，如图 2 所示。遗憾的是，程序没有正常运行，我们在底部得到了错误：如图\
    \ 3 所示。问题是，我们正在打印文本行的过程 `Put_Line` 是另一个包的一部分，我们需要告诉 Ada 我们想使用该包。GPS 足够通用，可以意识到我们想要做什么，事实上如下：\n\
    \n```\nAda.Text_IO:\npossible missing \"With Ada.Text_IO;\n```\n\n在该消息的左侧有一个小屏幕图标：点击即可添加以下行：\n\
    \n```ada\nWith Ada.Text_IO;\n```\n\n当我们按下运行按钮时，在文件的顶部，我们的程序会产生输出。我们添加了两个命令：`With`\
    \ 命令导入另一个包的内容，有点像 C++ 中的 `#include` 指令。`use` 命令使包的内容可见。我们需要通过调用 `use` 来使用包，但我们可能不一定想调用它，以避免命名空间污染。\n\
    \n# Hello, world!\n\n> Ada 内置了强大的安全特性，包括极其严格的静态类型\n\n我们也可以将调用 `Ada.Text_IO;` 放在\
    \ `begin` 关键字之前，以便它对 `Tutorial` 过程可见：\n\n```ada\nprocedure Tutorial is\nbegin\n\
    \  Ada_Text_IO;\netc...\n```\n\n我们也可以直接从其包调用函数 `Put_Line`，例如 `Ada.Text_IO.Put_Line(\"\
    Hello world\")`，这样就不需要子句了。在更复杂的程序中，我们可以在过程声明之外的任何地方调用它。\n\nAda 最重要的特性之一是它支持泛型类型（generic\
    \ typing），其中过程或包可以使用类型或值作为索引进行参数化。这类似于泛型...\n\n![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_52_0.png)\n\
    \n一个 Ada 项目通常从一个运行我们程序的主过程开始。我们将通过编写一个简单的泛型来跟踪空间中物体的位置，以此来说说明一些技术。由于我们希望将几何结构保持在二维或三维（或其他数字）中，我们将使用维度作为泛型参数。\n\
    \n在项目资源管理器（Project Explorer）中右键点击并选择 New > Ada Package，如图 4 所示。类型为 \"Geometry\"\
    ，包名为 geometry。这将创建一个包含一些大纲代码的 Ada 包。添加更多代码行，使其看起来如下所示：\n\n```ada\ngeneric\n  Dimension:\
    \ Positive;\npackage Geometry is\n```\n\n这是我们的声明。前两行（泛型部分）为包提供了泛型参数，这意味着我们可以引用维度。如果用户想使用该包，他们需要指定维度数量（通常为\
    \ 2 或 3）。\n\n此示例（见下）展示了如何声明变量。在这里，`Variable_Name` 是标识符，`Variable_Type` 是它的类型。以下代码：\n\
    \n```ada\nVariable_Name : Variable_Type;\n```\n\n定义这个点的目的是允许我们定义一个表示空间中点的数组类型，我们可以通过下一个代码来实现：\n\
    \n```ada\ntype Point is new array (Indices) of Float;\n```\n\n这是用于处理 1 到 10 范围内所有整数的索引类型。\n\
    \n```ada\ntype Indices is new Positive range 1 .. 10;\n```\n\n然后我们创建该类型的新副本。\n\
    \n"
