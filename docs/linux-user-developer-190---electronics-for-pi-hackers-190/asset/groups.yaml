  - '[PAGE 72]


    # The trigger


    Inside the case is a TENS unit that sends out an electrical impulse to trigger
    the shutter and involuntarily snap a picture.


    # Shock therapy


    Aluminum tape extends the electrodes on the handle, it runs around the back of
    it to cover a larger area, ensuring current flows between the electrodes on the
    handle and the user''s hand, causing the index finger to twitch.


    # Power source


    Just like the device itself, the power source is also mobile. The TENS unit is
    powered by a 9v battery while the Raspberry Pi is connected to a power placed
    underneath the handle.


    # Artificial intelligence


    The Raspberry Pi 3 runs an image classifier script that analyses the current frame.
    When a scene has an over 95 per cent ''high quality'' rating, it signals the TENS
    unit to buzz the camera''s operator.


    # Eye to the world


    Peter uses a mirrorless Sony Alpha 6300, the involuntary movement of the finger
    doesn''t blur any of the captured images thanks to the Alpha''s super-fast autofocus
    mode.


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_72_0.png)


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_72_1.png)


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_72_2.png)


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_72_3.png)


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_72_4.png)


    # Computer vision


    The project uses Google''s Inception Model neural network, it was trained on the
    CUHK-PG dataset that consists of 17,613 images obtained from a variety of online
    communities, divided into seven segments and labelled as high quality. The pre-trained
    weights were then transferred to the Pi.


    # TENS intensity


    Peter used the TNS SM 2 MF TENS unit (http://bit.ly/lybud_tens) which can turn
    up the intensity of the shock to 75mA. While power was enough for Peter to use
    the system, other people had to turn it up even further using the signal experiment
    get like like the one available through Amazon, (http://bit.ly/lyd_gel).'
