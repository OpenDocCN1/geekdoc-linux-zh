    # 开源

    新闻与观点


    # Android


    ## “Linux on Galaxy”演示


    ## 类似于 Convergence 的工具，主要面向开发者


    将手机变成 PC 的想法并不新；它已经在微软的 Windows 10 Mobile 的 Continuum 中出现过，以及 Ubuntu 中的 Debian。但它并没有流行。意识到大多数人想要口袋里有一个真正的
    PC，三星一直在忙于一种新方法。当地被称为“Linux on Galaxy”，适用于配备八核处理器的三星手机。


    “在手机上开发 Linux 以前从未如此简单，”该公司说，“现在可以通过 Samsung Dex 访问整个堆栈——这是一个丰富的桌面级


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_7_0.png)


    体验，Will 开发者想要在 PC/手机上编程吗？


    作为一种应用程序打包，当手机连接到自定义的 Dex 底座时，Linux 会启动。与其说是完全独立的安装，Linux 共享相同的


    相同的应用程序和文件在两个环境中都可用。这意味着你可以在火车上工作，然后在办公室继续项目。这是一个令人兴奋的选择，但目前还没有发布日期。


    Android 的内核。


    微软的廉价云无论是令人满意还是失望，取决于它如何继续。按照在 Windows 虚拟机平台上作为第一类虚拟机的计划，促进这种模式的是一个开源项目（xrdg）。该工具通过
    Hyper-V 套接字传输数据，以启用虚拟机集成的所有功能。正如 White 说，“一种基于字节流的宿主机与虚拟机之间的通信机制”


    Wilton（可能在 http://bit.ly/lud_vm 提到）演示了旧版本的 Ubuntu 18.04 在增强会话模式下的运行，作为对


    预计当 Ubuntu 18.04 LTS 在四月发布时，通过 Hyper-V 虚拟机库推出。


    * Neifa


