    # 开源


    06 新闻与观点 | 10 字母 | 12 访谈 | 16 内核世界


    # 硬件


    ## Purism 提高笔记本电脑安全门槛


    防篡笔记本电脑与加密合作伙伴关系，旨在保障笔记本电脑及即将推出的 Librem 5 安全


    Purism 持续专注于生产最安全、最隐私的笔记本电脑，这使其与一家多元化的安全公司 Treadmill Hudson 建立了新的合作伙伴关系。其 Heads
    安全固件已集成到可信平台模块（TPM）芯片中，为使用 Purism Linux 硬件的用户提供了更增强的保护。


    然而，这项开发的结果将需要一些硬件更改、启动修改，当然还有操作系统的更新。正如 Purism 首席执行官 Cosmo Wohl 所说：“你的隐私取决于自由。拥有真正的隐私意味着你的电脑和数据应该由你控制，而不是由别人控制。”


    Librem 用户现在可以控制安全启动过程，并使用最高级别的基于硬件的加密。Weaver 说：“通过在所有笔记本电脑上默认激活我们启支持 TPM 的启动，这一小小的组合使得当你持有密钥时，拥有你能买到的最安全的笔记本电脑。”


    新模型将把集成的 TPM 作为标准功能。此外，在密码学专家 Werner Koch 的协助下，开发了与安全相关的新的网络通信。这将为 Purism 的笔记本电脑以及即将推出的
    Librem 5 增加硬件加密。


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_5_0.png)


    为此，Purism 利用 Gnu 隐私卫士（GPG）和智能卡技术，在其所有设备上默认包含加密。Purism 和加密倡导者已经知道，正是 Koch 的 GPG
    加密使得与全球记者能够进行安全通信。


    GPG 最初开发于 1997 年，多年来它积累了庞大的用户社区，并通过一种新进程——密钥目录（Key Directory）用于电子邮件和消息传递，该进程允许接收者在自己的系统上请求权限。


    Werner Koch 说：“Purism 的目标是使用密码学将其构建到产品中。Purism 正在制造现代硬件，允许用户控制自己的生活。”


    Librem 5 手机于今年下半部分（即 2017 年 8 月）首次推出，其众筹成功筹集了目标的 155%——其中包括一些功能


    上文提到，Purism 的目标是包含 Librem 5 及其后续产品，它们将变得更加安全


    最初并未被认为由 Purism 团队开发。


    Koch 认为是一种保护用户的“理想方法”，且不会牺牲性能或可用性。该合作伙伴关系的计划是全盘加密和文件加密，让用户或企业有能力保护自己的数据文件，同时自己保留此类保护的密钥。


    最终，Purism 旨在推动笔记本电脑和手机行业对终端用户设备提供更大的保护。谁能反对呢？


    # 发行版


    ## Canonical 在 Ubuntu 中安装数据收集工具


    公司表示，升级用户可以选择退出 Ubuntu 数据收集


    在过去的几周里，由于收到 Canonical 在 Ubuntu 18.04 LTS 中放置了数据收集工具的消息，Ubuntu 社区陷入了恐慌。虽然这只收集硬件信息，而不是像微软在
    Windows 10 中收集的数据，但它引发了争议。


    Canonical 在今天的一份公告中表示，收集的数据将通过 HTTPS 发送到由 Canonical 团队运行的服务上。在首次启动且有网络连接后，这将保存到磁盘上。包含此类数据的文件将供用户检查。这些数据的结果将公开。Canonical
    解释说，用户可以比较德国与赞比亚的加入百分比（例如），以及在什么硬件上：Ubuntu 隐私政策不会受到此更改的影响。


    收集的数据包括硬件（CPU、GPU、RAM、磁盘大小、GPU 设备、设备 ID）、用户在安装时禁用的功能（而不是不收集的 IP 地址）、安装工具以及在每月更新期间更新的功能。


    公告发布后，大部分关于担忧和心安之得的讨论，这是因为 Canonical 在这方面有一段负面的历史，例如 Ubuntu/Android 集成以及手机中的 Linux
    Android 模式。当然，该公司的口袋引发了更大的隐私问题，而你无法轻易退出：


    该公告的很大程度上未受关注的方面之一是，任何人都可以退出，而来自 16.04 LTS 的升级用户如果他们选择也可以退出。正如 Will Cook 解释过的：


    “任何用户都可以通过取消勾选框来退出。GNOME 设置的隐私面板中有一个复选框可以切换此值。鉴于这些使用模式适用于 Linux，Canonical 想要以这种方式量化
    Ubuntu 是意义的，但也许它可以用更公开的方式来处理事情。”


    # 前五


    ## 五项 Ubuntu 18.04 LTS 特性


    - 1 个新的默认应用

    Ubuntu 包含了几个默认应用（或在 2017 年的社区咨询后在设置程序中提供。VLC、LibreOffice、Mozilla Thunderbird 和
    Shotwave。）


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_6_0.png)


    - 2 X 显示服务器

    我们感到放心，Wayland 仍然是显示服务器的主体，这归功于最终能够与之正常运行的应用和游戏。Ubuntu 18.04 恢复了


    - 3 彩色表情符号

    这是你一直等待的特性。在之前的版本中，表情符号是单色的；随着 Android 全色源版本的到来，这将在 18.04 中发生变化。


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_6_.png)


    - 4 精简版安装

    并不是 Ubuntu Minimal 的替代品，而是安装过程中的一个真实功能。


    - 5 新 GNOME 特性

    Ubuntu 18.04 是首次使用 GNOME 3 的版本，并且默认包含了新的主题。这是你将看到的第一个


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_6_2.png)


