    concerns are important which we highlighted in our Next Gen features this issue
    We also had a guide to OS in the last issue (LUUB0189backsecure.bit/LUUB0189backsecure).
    Essentially, Qubes separates everything into bare-metal hypervisors. This means
    that you can compartmentalise your work from personal life and avoid any malware
    you do catch spreading across your system. It''s unusual as Linux


    distros go, but if you''re paranoid about a good option. It has tonnes of other
    features as well, and links with Tor and others, including Whonie.

    Another option is Pure OS: if you combine Pure''OS with the company''s laptops,
    it makes for a very privacy-conscious setup. There''s also Subgraph which shows
    the routing of the Linux kernel (the core components of the Linux operating system,
    essentially). It''s still in alpha.

    If anyone have insights on specific projects or topics they''d like to understand
    better, please email us at linuxuser@futurenet.com.


    # NAS to meet you


    Dear Lu8D, I thought you might be interested to know about a Linux distribution
    that I called VortexBox. This is a full media server and I think it might benefit
    all your readers.

    Phil Peterson


    Chris: Thanks, Phil. We not heard of this distro so we took a look. For others
    similar in the dark, VortexBox turns your Linux box into a jokebox server/player.
    It''s based on Fedora and once installed it''s capable of automatically ripping
    CDs to FLAC and MP3 files. It also supports torrent downloads of any copy that
    it''s found.

    We''ve tried ourselves yet, but VortexBox supports network media players such
    as Linn, Logitech Squeezobox and Sonos. The project also shows that you can play
    files directly to a USB-attached DAC. In all that it sounds like a brilliant idea,
    but it is also that


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_9_0.png)


    Above Qubes security has become a mainstream in recent years; it''s no surprise
    Linux is leading the way with distributions that keep you safe and respect your
    privacy


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_9_1.png)


    Above our site techRadar actually reviewed the VortexBox NAS appliance back 2010
    and gave it five stars. Clearly it''s a great product, but it''s a shame that
    it has fallen into obscurity in recent years


