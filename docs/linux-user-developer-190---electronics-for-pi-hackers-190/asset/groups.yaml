    ## Plasmoid 快速指南


    ## Mycroft


    作为一款开源软件，你不需要购买智能选择器就可以尝试 Mycroft，但通过购买 Mark 或 Orion，你将支持该项目。要做到这一点，只需将其安装为 Plasmoid
    —— KDE 桌面的桌面小组件。社区成员 Aditya Mehra 在 KDE 开发人员的帮助下，为 Ubuntu 和 Fedora 上的 KDE Plasma
    创建了 Alpha 版本。这是一个为这两个系统提供的脚本，但我们在这些系统在非 LTS 版本上（以及 Flatpak 上）备有 KDE Neon，因此你可以选择安装它，也可以将其作为虚拟机运行。你需要进入终端（在
    KDE 中称为 Konsole）并输入：


    ```bash

    - wget https://mycroft.ai/install_plasmoid_kde.sh

    - bash install_plasmoid_kde.sh

    ```


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_12_0.png)


    上面列出了你如何通过安装社区制作的 Plasmoid 在 KDE Plasma 桌面上尝试 Mycroft 的方法。虽然有针对 KDE Neon 和 Fedora
    的脚本，但你可以在 Ubuntu 项目的 Mycroft 列表中运行它，并将其拖到桌面上。如果你不想使用脚本，可以查看：https://kde.org/plasma-plasmoid-mycroft.kde。不过，这种方法稍微复杂一些，因为你需要安装
    Mycroft Core 并手动安装包，而脚本会自动处理这些工作。


    完成后，你可以右键点击桌面，选择“添加小组件”（Add Widget），你会发现所有所有为了保持整洁而移除的项，而且我们改进了成本。我们改进了内部微内核的处理器和性能，还添加了
    FPGA 来处理类语音任务。我们还有其他可以实现的应用——


    这是一种功能更强大的设备。从能够通过语音创建交互内容的角度来看，它仍然非常灵活，但对于消费者来说比黑客和创作者更具实用。


    在构建第一个产品时，我们为开发者制作了些什么？


    Mark 出货时，我们将配备与之相关的开发者开发工具。我们已经开发了它超过两年了，现在我们正在编写全面的自动化测试。我们正在构建更好的工具来与应用程序进行全方位对话，接下来我们将围绕此开展大量工作。


    我们遇到的问题之一是，类似的命令可能会触发两个不同的技能（skills）。例如，如果我说“删除计时器”（Remove the timer），它会移除设备上的项目。然而，如果我说“删除我购物列表中的项目”（Remove
    items from my shopping list），它倾向于杀死你所有的计时器，尽管你只是想从购物列表中删除它。因此，我们将构建基于机器学习的调试工具来帮助解决。随着我们从愿意分享数据的人那里收集更多数据，随着我们收集更多社区标签，这将提高工程师和开发者的体验。


    你谈到了隐私问题。在我们分享时，是否有人在尝试改进这方面的隐私？


    我们只使用选择加入的用户的数据，所以我们不隐藏任何东西。我们使用愿意与我们其他人共享数据的用户，大约有 6% 的用户说“我想让这项技术变得更好”。事实证明过程确实变成了瓶颈。只要我们社区有足够的成员分享数据来帮助改进工具，我们就能从他人那里学习，对吧？如果你有足够的数据，我们会得到什么？因为我们很贪婪，对吧？


    我想这就是我们所做的，在许多其他平台上，这与 AI 无关，而与你作为一个产品有关。如果你不


    > Mark 是一款消费级设备。我们添加了一个四英寸触摸触摸屏


    ## 开源新闻与观点


    为了产品付费，你将获得产品。有很多数据收集是在网页上，通过像素（pixels）进行的。尽管它的初衷是让用户说“Hey”，我们正在试图为用户改进这项技术，它的真正意义是，我们对此并不感兴趣。我们希望用户拥有一项代表他们的技术，将其转化为产品。不久后，我们将推出一个
    Windows 应用程序和一个 iOS 应用程序，允许你运行 Mycroft 栈，所有设备都是连接的。所以想法是我们可以通过任何方式开发，它让我们服务那些可能无法听见或无法说话的人。


    ## 硬件改进会由第三方构建吗？


    Mark 将增加技能（skills）。我们的社区继续构建它，其中一个正在成为 KDE 的默认部分。你可以说“Mycroft，玩剪刀石头布”之类的。它允许你通过手势输入，然后它随机选择一个并告诉你。这是一个很不起眼的，麦克风拾到单词“Heycroft”。请求通过
    DeepSpeech 转换为文本，然后处理意图。响应从文本转换为语音，最后通过扬声器播放。


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_13_0.png)


    所以我们能够构建一个虚拟助手，如果你想的话，它是一个增强现实层。你对它说话，实际上它是一个增强现实层，覆盖在你的家里。我们不仅可以服务能说话和听见的人，还可以服务那些可能无法听见或无法说话的人。


    计算是在云端完成的？


    大部分计算实际上是在设备上完成的。所以我们不在云端进行——因为那需要更多处理时间。如果你要进行实时合成，就需要 GPU 来操作。在未来的几个月里，新的合成引擎听起来很棒，但运行它需要大量的处理时间。我们提供了一个价格合理的方案。


    ## Mycroft 的声音


    Mycroft 使用文本转语音引擎创建所有声音。这由 Mycroft AI 和 VocalID 开发，但他们需要帮助。为了创建真实的语音，你需要各种素材，你可以通过
    https://vocalid.com/voicebank 添加你的声音。Joshua 说，如果你愿意提供语音数据，Mimic 2 引擎将允许我们模仿你的声音。目前我们需要大约
    20 小时的数据，但这正在迅速缩小。我们认为在最后，我们可能只需要 15 分钟的音频就能复制声音。Joshua 表示，人们将有机会构建帮助家庭成员的语音助手，这让我们立即想起设备或名人的声音。


    就此，今天我们可能会将合成移动到云端。


    我们的目标是尽可能让信息留在设备上。在项目的结束时（这可能是多年后的事），但明确作为未来一两年的目标，我们希望能够本地运行整个体验。即使我们需要在你的桌面或笔记本电脑上运行。这种工作方式可能是：如果你的桌面在家里，你安装了
    Mycroft II，房子里的设备首先连接到网络说“Hey，这里有人可以识别并合成语音吗？”如果你的笔记本关着或在另一个房间的角落想要响应，它就会去云端获取数据。


    但如果你的笔记本放在那里且正在运行 Mycroft，它会连接到那里，然后在本地使用 GPU。有很多方法可以控制它们。


    Mycroft 打算如何赚钱？


    我们赠送基础。如果你想要玻璃杯，它是免费的；如果你想要大桶，我们就收费。对于我们的用户保留自己的数据，如果你选择选择加入，那太好了。我们目前正在与几个企业品牌合作。这些项目大部分还处于非常早阶段，但一些财富
    500 强正在评估或已经在与我们的员工合作。


    在上面，你可以用小组件和面具个性化你的 Mycroft II，结果当你把所有的连接器放在外面时，第一个我们有五个盒子。其中一个盒子里脸面板、主板、树莓派和编码器都在一起。新设计设计为单块
    PCB。屏幕开启了，所有麦克风都开启了。一切都连接到一个设备上，以便在本地进行测量和处理。有了新的设备，我们将听到音质、共振腔的大小，以及进入腔体的空气是如何被我们第一次学到的层驱动的。


    回到 Mark I，你从经验中学了什么教训？


    不要把麦克风放在和共振腔同一个外壳里！Mark I 真的变得太大了。无论软件感觉多好，扬声器越大，当音乐播放得很大时，它基本上无法听清命令。所以所有这些问题的教训就是
    Mark II。它应该更进一步。设计更简单。设备越好越强大。


    这次的设计很时尚。它是来自社区反馈的吗？


    那是来自我们的设计团队。第一个产品总是设计成我们想要的样子：扁平、可爱，并且在许多方面具有个性化。而且我们必须选择整个树莓派在，


    Mycroft II 型号可以在 Indiegogo 页面（https://indiegogo.com/projects/mycroft-ii-the-open-assistant/）以优惠价格进行预购。例如，开发套件在
    2018 年 12 月上市前优惠 31%，为 109 美元（78 英镑）。


    '
