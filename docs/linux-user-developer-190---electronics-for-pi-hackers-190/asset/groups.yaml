  - '[PAGE 64]


    # AT A GLANCE


    # Where to find what you''re looking for


    +   * It just works! p66

    Distributions that ''just work'' out of the box are vital to Linux''s future and
    will help shape the next generation, but there''s still room for more technical
    offerings.

    * Accessible and beautiful p67

    A sensible set of initial applications and design to rival commercial OSes or
    being free general support is key; the continuous improvement of apps like LibreOffice.

    * Chrome-OS inspired p68

    Linux-based Chrome OS has been far more popular than anticipated, inspiring Chromium
    OS-based spin-offs and conventional Linux-based homages.

    * Safe and secure p69

    Distributions with a focus on security offering different levels of protection,
    from ultra-secure options to slightly tweaked versions of the main popular distros.
    User awareness of security is growing.


    As time progresses, Linux continues to make and become desirable for all types
    of users who prefer to use the open OS as their daily driver. From powering millions
    of servers on the internet to touching virtually everybody daily, even if they
    don''t rely on it. Its popularity continues to provide a rich variety of alternatives
    for all types of users, a promise for the next generation of Linux.

    One growing trend within Linux distros is to instead offer a jack-of-trades experience
    based on a specific use case. Linux''s roots are all powerful, with a wide range
    of users—from enthusiasts, developers, artists, and educators to just a few. But
    general-purpose Linux is now more accessible and powerful than ever before. This
    makes it easy to get started, and ensures that the vision of free Linux as something
    other than Windows or MacOS no longer feels second-class.


    In addition to code, we are already seeing advancements in the realm of package
    distribution which mean for those who are new to Linux, installing and uninstalling
    applications will be a much easier improvement in this area very well. For those
    who are expert users, Flatpak and Snap packages have the potential to transform
    Linux (particularly on desktop), making a change that has been desperately needed
    on the platform for a long period of time —


    is well under wraps, fundamentally changing how Linux is used in the server world.
    Virtualisation on the desktop continues to improve both at the hardware level
    and in software, making the use of multiple OSes considered less problematic than
    it was a few years ago.

    Even Microsoft offers Linux virtualisation on Windows, which would have been unthinkable
    until recently. The same hardware-virtualisation technology is driving improvements
    in personal security — as well as users are increasingly conscious of the safety
    of the data. So, the ''next gen'' in Linux is coming and you may be using a different
    version of Linux to the one you are currently using, but today we show under the
    skin, how it works, how easy it is to set up, and how safe your data may evolve
    considerably from what things looked like today.


    > The Linux family continues to provide a rich variety of alternative for all
    types of users


    from both user and developer perspectives. If installing an application is easier
    and developing and packaging an application is much easier too, everybody wins.

    Example: Containerized distributions are growing rapidly over time. The revolution
    driven by Docker and Kubernetes


