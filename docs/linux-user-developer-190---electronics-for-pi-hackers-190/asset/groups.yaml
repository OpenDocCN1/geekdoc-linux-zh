    ## Adding sound


    FFmpeg makes simply adding audio to another video, which is straightforward. Use
    the command like this:


    ```bash

    ffmpeg -hwaccel auto -thread_queue_size 512

    -f alv -acodec aac -i input.mp4 -f video 0 -s 1280x720

    -f dev/null -vcodec libx264,preset veryfast -pix_fmt yuv420p -brate 4000k-bufsize
    8000k -pix_fmt acodec aac -b:a 128k -ar 44100 -bufsize 5000k

    -preset veryfast -f flv -rtmp "https://live.twitch.tv/app/86945472" YOUR_STREAM_KEY

    ```


    You should be aware of a few things. If you are adding audio to an input, you
    might need to re-encode the audio that Twitch supports. One of the issues was
    that the stream was deynchronized, so the audio was also de-synchronized during
    live. If you find the constant rate is too high, try to remove the "-f vrate"
    (option) if it''s necessary in the video-command, but not here.


    - The acanc parameter determines how many channels the audio has. Usually mono,
    unless only one channel is here. We use the 44100 sample rate, or other rates
    44.1kHz, which is CD format. If you want to stereo, increase the bitrate, as codec
    bitrate appears less to here.


    You might notice that the thread_queue_size banner is set right before -i. If
    you expect FFmpeg to lag or stutter, use it like-banner, but this only applies
    to the audio input video. This method affects how FFmpeg handles streams. If you''re
    using a Raspberry Pi Zero, or to put it up to 192, which might give me a smooth,
    glitch-free stream, however there in parts of the audio being silent, but any
