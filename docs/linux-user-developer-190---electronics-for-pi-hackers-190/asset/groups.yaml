    # INTERVIEW MYCROFT


    # # The open AI assistant


    After a successful crowdfunding for our open source smart speaker Mycroft returns
    with a more refined Mark II for consumers and devs.


    Mycroft is seen as the open source answer to voice-activated personal assistants
    like the Amazon Echo, Siri, Cortana and Google Assistant, when Joshua Montgomery,
    CEO of Mycroft, was looking for a voice assistant for the likes of an Amazon Echo.
    ''Certainly, it was in beta,'' says Joshua, sitting beneath a large, bold Mycroft.
    ''We wanted to find Jarvie from Iron Man into our space.''


    they had recently finished a successful crowdfunding for the Mark II – doubling
    the number of backers – and have moved pre-orders to Indegogo.


    What''s the ambition for Mycroft? We''re building an artificial intelligence that
    runs locally and interacts naturally. Our goal is to build a voice assistant whose
    user experience is so natural people forget knowing if they are talking to a human
    or a machine.


    To achieve that, what is the software that you are working on?


    We''re using TensorFlow as the platform to build the artificial intelligence or
    machine learning – certainly for the speech recognition, and language processing.
    We''re using Tensor for the word-recognition engine. We''re working with the team
    at Mozilla on speech-to-text – that''s the DeepSpeech engine (https://github.com/mozilla/deeepsech).


    Joshua Montgomery The CEO of Mycroft and serial entrepreneur, who crowdfunded
    the Mycroft, a free and open source personal assistant.


    The crowdfunding campaign for the Mark I was a bit early. We didn''t have the
    technology that would have allowed us to customise it. You couldn''t change it.
    To a large extent. With the other options available, you could customize the voice.
    In many cases, you couldn''t wake the wake word. We wanted to do something that
    was unique.


    But we use learning throughout the stage. We use it for voice-recognition, for
    speech-to-text, and for a JSON structure. We use it for intent parsing.


    We have a conversation engine that generates Persona. And we''re building a personality
    and a character. And we want it to feel natural.


    The crowdfunding campaign for the Mark I although, through our interviews, the
    crowd team learned some things and exposed us to a supply chain. But, then months
    before the reveal, Mycroft I started launching in July 2017.


    In all applications, the more we add to the more the community volunteers who
    help us to do things like tag data and connect to Persona, and the better the
    experience will feel.


    Eight months on and Mycroft AI have great results for the Mark II. As for us we
    get a video call from the Kansas City offices,


    How does Mark II differ from Mark I?


    The Mark II is designed for consumers. We have a bunch of I/O on the back – it''s
    got an jack, it''s got HDMI, it has USB ports. It''s got a copper Ethernet port
    if you want to plug into a Switch. And it''s an actual Raspberry Pi 3 in it, as
    well as a full Arduino. So it''s really designed to be hacked and altered by someone
    who''s a software developer or maker.


    The Mark II is more of a consumer device. It features a four-inch HD LCD touchscreen.


    Before: Mycroft Mark I has a consumer focus, but will ship with tools for developers


