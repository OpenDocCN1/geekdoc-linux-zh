    are connected inside the headband, providing a means of connecting components.
    Breadboards in this respect, before starting to use one, check your breadboard''s
    internal connections.


    Generally speaking, breadboards have holes connected horizontally at the top and
    bottom, with the odd break in rows of connections, and holes connected vertically
    on the rest of the board. Breadboards are often used for marking values, so it''s
    easy to decide which components to make up the required circuit. If you need more
    support, there are a few resources online that help.


    The only other thing you''ll need is component identification. If you buy components
    in bags with labels, you''ll really need to be able to read them. With transistors
    and diodes, for example, part numbers will be printed on them.


    Resistors and capacitors are different. Resistors use coloured bands to identify
    their value—see the instructions for how to interpret these bands. Several schemes
    use marking values and language—like 47J. Another common scheme uses three figures,
    with resistor colour bands, and four digits and markings in this case. A marking
    of 103, would yield 10,000pF (10 picofarads), which equals 10nF.


    As identifying components, you will also need to identify their terminals. Resistors
    and capacitors can be connected either way, except for polarized capacitors where
    you need to differentiate the positive from the negative lead. A plus or minus
    sign is printed on the capacitor, and with electrolytic capacitors, a construction
    in the body identifies the positive side.


    In the case of diodes, a band printed on the body identifies the cathode, and
