  mdcn: '


    # 开源你的 Linux 新闻与观点


    # 观点


    ## 我们关注内核社区的最新动态

    Linux 4.16 接近尾声，重心转向 4.7


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_15_0.png)


    Linus Torvalds 宣布了 Linux 4.16-rc（第5个候选版本）。在公告邮件中，他说：“这仍然非常正常，包含了一些通常类型的修复，是我在之前的开发周期中看到的最干净的系列之一。RGS（回归主日）今天出现，最坏的情况也不会晚。这意味着如果我们按照计划进行，我们将完全覆盖即将到来的补丁。”


    传统上，RGS 出现在一个周期的年底，这种周期通常持续七周以上，或者在最坏的情况下，RGS 已在眉睫。


    现代内核刚刚添加了 retpoline 支持（顺便这需要非常新的编译器），并添加了一些最近的清理工作。这些包括专门在分支预测控制推断功能中利用 SSR（返回栈缓冲区）的修复，无论是否在链接固件时，因为类似
    retpolines 的解决方案解决了填充缓冲区漏洞；此外增加了除了 GCC 之外使用 nClang 编译内核的支持；nClang SBR 现在适用于所有
    x86 处理器。


    # Jon Master


    Jon Master 是一位内核黑客，从事 Linux 工作已 22 年。他在 13 岁时首次进入大学。现在住在马萨诸塞州剑桥，为一家大型企业供应商工作。他的工作正在推动一代能效
    ARM 架构服务器标准的创建。


    4.16 发布周期可能比 4.15 没那么剧烈；我们还没有完全完成清理工作以充分缓解 Meltdown 和 Spectre 漏洞。虽然 Spectre 在
    1 月份仍然潜伏，但那些只是初步，而且对现代应用程序有时会带来痛苦的性能影响。


    未来的处理器将不需要面对这个问题，因为它们将具有硬件属性，可以在分支预测器中预测分支的上下文信息，从而在没有 SBR写入的情况下有效缓解 Spectre 攻击。对于所有处理器，内核将禁用
    retpolines，但这会有开销，并依赖于难以实现的正确处理。4.16 将支持这一特性。


    上游倾向于修复 Meltdown 问题，并花费更多时间来填充较难利用的内核代码。许多生产商对于这些本应该被修复的更改犹豫不决。


    # 解决泄露问题


    在独立开发中，已经开发了各种内核脚本（位于内核源码的子目录下）。这些脚本解决了日志中内核数据结构的正确泄露问题，并可以对 `/leaking_addresses`
    进行扫描。它经过优化以扫描 `/root/`，代表内核数据的潜在泄露，代表了具有各种内核映射的软件。针对 32 位处理器上通过 PTI（页表隔离）缓解 Meltdown
    的方法已提交到上游。


    在过去的一个月里，刚刚发布了针对 Google 研究的 Spectre 变体 2 缓解措施的上游 ''retpoline''。早期的 retpolines
    使用一种名为 MSR（模型特定寄存器）的硬件控制接口类型，它可以根据 CPU 分支预测器的控制来控制推测执行——这种硬件容易受到 Spectre 变体的攻击。


    Meltdown 的讨论概述了内核入口的机会，即我们找到了一种方法，可以尽可能移除各种 MSR 写入，并为虚拟机安全提供伪造的微代码报告，特别是“内核加固”，即列出一个（同名的）列表。此外还消除了内存地址的泄露


    虽然这些补丁是你的，因为触碰 MSR 是一个可选修复，仍未被软件如此频繁地使用。相反，retpolines 是一种纯软件解决方案，通过将间接分支替换为函数序列来有效移除它们，这并没有受到影响。漏洞源于堆栈哈希，直接修改虚假的返回地址。


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_15_1.png)


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_15_2.png)


    可以使用它们，其他工作侧重于尽可能地锁定和加固内核。这包括由 Google 的 Kees Cook 等其他知名人士领导的若干努力。在过去的几周里，已经有了可能包含数据指针的驱动程序分配内存的补丁，以及移除变长数组（漏洞来源）的建议，并重新向向游提交了来自
    ''Stackclash'' 补丁（最初源自 grsecurity 项目）至少部分技术。Linus 并不太喜欢后者，因为它为了编译时检查对内核代码进行了大量更改，而他更愿意通过更智能的编译器来实现。


    Matthew Yilcos 发布了用于 4.17 的 ''XArray'' 第 7 版本。它们实现了一种新的“抽象数据类型”，行为类似于一个大型指针数组。其目的基本上是用具有更好能力的现有的
    Linux 基数树（radix tree）实现。这一内部内核功能得到了 Linux 用户空间代码的帮助，并且使用起来简单得多。


    页面缓存意味着不再使用其他方式存储数据——文件系统——运行的应用程序可能需要这些，这样就可以从内存读取而非交换分区（swap）。任何改进缓存性能的代码往往都会提升用户体验。


    # 未来处理器将不需要承受 Spectre 2 缓解措施的影响


    Vitaly Kuznetsov 发布了补丁，在 Linux 和 Hyper-V 之间提供了“增强型”（Enlightened）VMC（虚拟机控制）接口。微软使用
    Hyper-V 支撑其云服务，这需要嵌套虚拟化。最近宣布支持嵌套虚拟化。在嵌套虚拟化环境中，你在任何公共云中运行的普通客虚拟机实例实际上运行着自己的虚拟机管理器。


    这可能看起来很奇怪，但它有许多用途。这些包括显而易见的开发优势（例如，通过嵌套虚拟化测试 OpenStack），但也适用于某些非常有趣的案例，即“公共”云和私有云技术的迁移。当
    x86 虚拟机由虚拟机管理器使用 VMCS 控制它们时，VMCS 是 CPU 和虚拟机管理器之间的共享结构。“增强型”意味着提供了-。


