    # 特别介绍：下一代发行版


    # 下一代发行版


    在未来几年里，我们将使用哪些发行版？

    **Paul O''Brien** 进行了调查——并在想，Linux 世界的替代方案是否意味着未来的体验将变得非常不同。


    # 概览


    ## 在何处可以找到你需要的内容


    - * 开箱即用！p66

    那些“开箱即用即可工作”的发行版对 Linux 的未来至关重要，并将帮助塑造下一代，但在提供更丰富的技术选择方面仍有提升空间。

    - * 易于访问且美观 p67

    一套合理的初始应用集和设计，是与商业操作系统竞争或提供免费通用支持的关键；此外还有像 LibreOffice 这类应用程序的持续改进。

    - * 受 Chrome-OS 灵感 p68

    基于 Linux 的 Chrome OS 受欢迎程度远超预期，激发了基于 Chromium OS 的衍生版本以及传统的基于 Linux 的致敬之作。

    - * 安全与可靠 p69

    注重安全性的发行版提供了不同级别的保护，从超安全的选项到对主流发行版进行微调的版本。用户对安全的意识正在增强。


    随着时间的推移，Linux 继续不断进步，并受到所有倾向于将开源操作系统作为日常主系统的类型用户的青睐。从驱动互联网上的数百万台服务器，到每天接触几乎每一个人（即使他们并不依赖它）。它的流行性持续为所有用户提供丰富的替代方案，这是对下一代
    Linux 的一种承诺。


    Linux 发行版中一个日益增长的趋势是提供基于特定用例的“全才型”体验。Linux 的根基无处不强大，拥有广泛的用户群体——从发烧友、开发者、艺术家、教育者到少数普通用户。但通用
    Linux 现在比以往任何时候都更易于使用且更强大。这让入门变得简单，并确保了自由 Linux 作为 Windows 或 MacOS 之外的愿景不再是二等公民。


    除了代码之外，我们已经看到了软件包分发领域的进展，这意味着对于 Linux 新手来说，安装和卸载应用程序将是该领域一个非常容易改进的改进。对于专家用户来说，Flatpak
    和 Snap 软件包具有转型 Linux（特别是桌面端）的潜力，这种变化是平台长期以来迫切需要的——


    尚未完全公开，它从根本上改变了 Linux 在服务器世界的使用方式。桌面端的虚拟化在硬件和软件层面都在不断改进，使得使用多个操作系统变得比几年前不那么棘手。


    甚至微软在 Windows 上也提供了 Linux 虚拟化，这在最近以前是不可想象的。同样的硬件虚拟化技术正推动着个人安全的改进——用户对数据安全的意识也日益增强。因此，Linux
    的“下一代”正在到来，你使用的 Linux 版本可能与你目前使用的不同，但今天我们展示了其内部构造、它是如何运作的、设置有多简单，以及你的数据安全可能会与现状相比发生多大的演变。


    > Linux 家族继续从用户和开发者两个角度为所有类型的用户提供多种丰富的替代方案。如果安装应用程序变得更容易，而且开发和打包应用程序也变得容易得多，那么每个人都赢了。


