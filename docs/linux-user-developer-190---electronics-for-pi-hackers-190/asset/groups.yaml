    \ LPDDR4 2133MHz |\n| Storage |\n| 512GB PCIe |\n| Ports |\n| 2x Thunderbolt 3\
    \ (USB-C) \n| with PowerShare & DC-In & \n| DisplayPort, 1x USB-C-3 in & \n| with\
    \ PowerShare, DC-In & |\n| | See for more |\n\n# Dell sticks with the 'If it ait\
    \ broke, don't fix it' formula for another generation of XPS\n\nYou can opt for\
    \ FHD resolution screen rather than 4K if you want... but why would you?\n\nAt\
    \ first glance you could be forgiven for thinking the new XPS 13 9370 Developer\
    \ Edition, is actually the last-generation XPS 13.\n\nThis has consistently remained\
    \ the top of range small laptop, focusing mostly on keeping the internals bang\
    \ up to date while still being incredibly thin.\n\nThe new laptop carries over\
    \ a number of design elements from the 9360, shrinking in size and eschewing USB-A\
    \ ports in favor of USB-C. The lid is tweaked, but the overall design remains\
    \ one that successfully combines both an underrated business attitude and a 'Look\
    \ at me!' wow factor.\n\nThe drop in size and weight represents a 24 per reduction\
    \ in volume and it's a noticeable improvement. This is partially achievable due\
