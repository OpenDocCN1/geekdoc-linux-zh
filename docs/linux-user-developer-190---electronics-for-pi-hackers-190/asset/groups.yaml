    # Object-oriented programming in Ada


    If we want to use Ada as a replacement for C++, it''s useful to write programs
    in an object-oriented style. To large extent, this is possible in Ada using a
    package that contains variables (the equivalent of field) and functions and procedures
    (the equivalent of methods). Ada supports types, which are like C structs but
    with a type definition.


    The 1995 version of Ada extends this basic language to support fully object-oriented
    programming. The new Ada introduces notions of inheritance and polymorphism, which
    enables us to encapsulate a state with the familiar keyword ''private''.


