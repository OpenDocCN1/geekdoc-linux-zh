    # Safe and secure


    # Safety and security environments are hot topics in today''s always-connected
    environments, and Linux distros are reflecting this mindset


    When you''re working on your computer, you expect your data to be safe. If you''re
    not someone who is specifically at risk, you expect security for granted, but
    this hasn''t been a major focus - Linux has enjoyed some of a ''security through
    obscurity'' resistance to attacks together with the nature of open source, so
    most mainstream distros haven''t truly fortified their security features. This
    is slowly changing, however, with the rise of distros like PureOS.


    PureOS is a Debian-based distro using the Gnome desktop environment which comes
    with leading privacy-protect applications. Out of which you''ll find


