    # Electronics for Pi Hackers


    > QUICK TIP

    Buy in bulk simple electronic components such as these aren''t at all expensive,
    so rather than buying them every time you want to build a circuit save time and
    money by keeping a selection of common values in stock.


    # Key components


    Introducing the types of electronic components that are used to build electronic
    circuits.


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_19_0.png)


    need to understand electronic components. Here are the main types you''ll encounter
    for simple interfacing - refer to the annotated image how to see them in a circuit.


    ## Resistors


    A conductor such as the copper inside a wire, allows an electric current to flow,
    whereas an insulator, such as the plastic coating on wire, impedes electronic
    current. A resistor resists between a conductor and an insulator in that, but
    not perfectly. The degree to which it resists the flow of electric current depends
    on its resistance, which is measured in ohms (symbol Ω).


    In the realm of digital as opposed to analogue circuits, a capacitor may be thought
    of as a component that stores electrical charge. The charge of a capacitor is
    measured in farads (symbol F).


    Values you might range from picofarad (pF), through nanofarad (nF) to microfarad
    (µF). Like resistors, values will normally be taken from the E12 series, and so
    voltage they can withstand, but usually a small voltage rating of 10V is adequate.
    For some applications, it might not specify the method of construction. Note that
    high-value capacitors are referred to as polarised (divided) electrolytic and
    tantalum according to their construction); positive and negative lead must be
    connected in the circuit the correct way. (Wait, the OCR text is jumbled, let
    me re-align logically).


    You might use in ordinary circuits range from the kilo ohms, to mega ohms. Many
    families of resistors contain a handful of values. The E12 series includes: 10,
    12, 15, 18, 22, 27, 33, 39, 47, 56, 68, and 82. So, for example, the values would
    be 100, 120, 150, 180, 220, 270, 330, 390, 470, 560, 680, 820, 1.2k, 1.5k, 1.8k,
    2.2k and 2.7k. Normally you can use components between these values, especially
    for simple interfacing circuits. Resistors are also specified by the power we
    are able to dissipate, but for most interfacing circuits, only a small rating
    is needed, for example 0.25W.


    ## Transistors


    Transistors are components that allow the flow of electric current in one circuit
    to be controlled by current flowing in another circuit. They can therefore be
    thought of as electronic switches. However, because the switched circuit can carry
    a higher current than the switching circuit, they can also be described as amplifiers.
    Transistors also allow a high voltage to be switched by a low voltage.


    There are several types of transistor but the most common in simple interface
    circuits, and the type we will discuss is the bipolar transistor. In fact there
    are two types of bipolar transistor, which differ in the polarity of the switched
    current. These are NPN and PNP transistors. Resistors and capacitors have two
    terminals, whereas transistors have three called the emitter, base and collector.
    The circuit allows that by applying voltage to the base, turns on the transistor,
    which in turn allows a current to flow through the circuit between emitter and
    collector.


    Unlike capacitors, which are defined by their characteristics, they are usually
    specified by a particular number such as BC544 or 2N907. The part numbers are
    much less meaningless than the datas will show any given transistor''s characteristics.


    ## Diodes


    Diodes are twofold components that allow electrical current to flow in one direction
    only. For this reason they have a positive terminal (the anode) and a negative
    terminal (the cathode), like capacitors, they cannot be connected the right way
    around. Their characteristics cannot be summed up as in fact they are defined
    by the part number such as 1N401. Their defining characteristics can be looked
    up in the datasheet, the main ones being forward and reverse voltage. You only
    need to look up such a diode if you are designing a circuit from scratch.


    ## Relays


    Relays perform a simple function to switch one circuit with another. Some components
    are available in several form factors. They contain a coil, magnetic field attracts
    one. When current is applied to the coil, magnetic field attracts one, making
    a circuit open or closing another with high current.


    ## LEDs


    Light emitting diodes (LEDs) operate to generate light. They have an anode and
    cathode and must be connected the right way. Their characteristics can be looked
    up in the datasheet.


    ## Switches


    There are several types of switches, including:

    - Toggle switches

    - Rotary switches

    - Momentary switches (push buttons)


    Momentary switches turn on when pressed and immediately off when released.

