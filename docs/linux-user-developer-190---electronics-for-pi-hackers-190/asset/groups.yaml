    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_88_0.png)


    **上文**除了 32 位计算机外，Linux 是少数不使用系统管理器的计算机发行版之一，它比 Verama、Ubiquity 或不依赖特定发行版的 Calamar
    安装程序更强大，提供了一个足够完善的设置，能够满足大多数新用户的需求，同时也提供了一个逐步步进的额外选项，以确保你按照自己的喜好进行安装。一旦安装完成，你应该勾选所有选项。通常的
    KDE 工具包还由 Firefox、Pidgin、GIMP 等许多其他优秀应用进行补充。


    尽管它拥有一系列令人印象深刻的应用程序，但真正让该发行版脱颖而出的是它安装期间的一系列配置选项。你可以通过图形化控制台管理器访问所有选项，但这可能既是该发行版最大的优势，也是最大的劣势。它可能是可用的最丰富多样化的配置，因为它可以完成从管理用户到准备和构建自定义发行版的所有工作。然而，缺点是它不够直观。某些模块，例如用户账户配置，任何暗示你功能的选项。更糟糕的是，控制台及其各种工具的文档非常少，尽管
    Linux 用户确实有一个内容相当丰富的帮助文档部分。这部分内容告诉你如何自定义内核或让终端变得更易用，包括所有其他与服务器相关的任务，但它未能阐明让 Linux
    在同类产品中脱颖出的特征。


    该发行版的一个优势是包管理。Linux 尽力让 Portage 变得简单。没有图形化实用程序可以帮助保持系统更新。要安装新包，你必须卷起袖子进入终端。使用
    `dif` 或 `apt` 完成安装包的过程并不太困难。但随后，缺乏图形化包管理工具严重限制了该发行版的吸引力。


    - 优点：一个对 Gentoo 的非常实用且应用丰富的入门介绍，具有其简单易友的图形化系统管理工具。

    - 缺点：缺乏图形化包管理器，其笨重的配置由于缺乏文档支持而雪上加霜。


    总结：你找不到许多基于 Gentoo 的桌面发行版，Calculus Linux 绝对是其中。对于任何想要学习 Gentoo 的人来说，这是一个很好的设置；它的缺点可以通过添加文档来解决。


    May Shannon

    www.linuxuser.com 89


    # 评测全新的开源软件


    ## 网页调查


    ### LimeSurvey 3.4.1


    创建并托管意见，然后分析你的结果


    如果你需要征求意见，可以使用 LimeSurvey 网页应用在几分钟内创建并设置问卷：它支持所有语言和长文本，提供了清晰的功能，如邀请受访者多次参加问卷。它还支持引用，你可以根据受访者的性别来限制问卷的人数上限。


    对于冗长时间的问卷，你可以允许受访者保存进度并在稍后继续。你还可以创建令牌（tokens），以跟踪已加入的用户并向他们发送提醒。


    LimeSurvey 提供了许多模板供你自定义。该应用提供了广泛的过滤选项，帮助你获得答案的清晰视视图，你甚至可以使用参数数量进行更深层次的统计分析。


    像任何其他应用一样安装 LimeSurvey 并按照文档进行操作：创建问卷的过程是直观的，安装过程包含一个交互式教程以帮助新手开始。除此之外，该项目拥有详尽的文档。


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_89_0.png)


    LimeSurvey 让创建复杂的问卷变得像填写 HTML 表单一样简单


    - 易于设计和使用，并提供了各种选项来创建不同类型的问卷。

    - 作为网页应用，可能需要部署在托管到数据库的可访问 Web 服务器上。

    - 非常适合……创建和开展各种类型的在线调查。www.limesurvey.org


    # 文档集浏览器


    ### Zeal 0.6.0


    浏览流行编程语言的文档集


    - 每种流行的源语言都以所谓的“文档集”（docsets）形式提供其源代码。


    对于任何想要为项目做贡献的开发者来说，这是一个必不可少的资源。你可以想象，文档集让搜索不同的源代码（如 WordPress）变得非常容易，而 Zeal 让这些文档集变得可读性。


    在某种意义上，你可以把 Zeal 视为开发者专属。该应用程序在主流发行版的官方仓库中可用，Ubuntu 用户可以通过 PPA 获取最新版本。


    Zeal 的主要卖点（USP）是你可以在程序内下载各种文档集。


    前往“工具 > Doctets”将文档集引入本地。要下载文档集，浏览到可用标签页并搜索你想要获取的文档集。获取允许你多次选择多种语言。


    一旦下载了文档集，导航非常简单，展开属性以浏览文档，或使用搜索栏找到你所需的内容——Zeal 会填充搜索匹配结果并在右侧面板查看文档。


    该应用支持并提供了选项来让文档集更易读。


    - 优点：可以下载 C++、Python 和 Java 等200多个文档集。

    - 缺点：在某些情况下，由于缺乏文档，其笨重的配置没有得到帮助。

    - 非常适合……浏览源代码。https://zeal.org


    # 浏览器扩展程序


    ### uBlock Origin 15.11 消除侵入性在线广告


    厌倦了看到损害隐私的广告吗？这款跨平台的开源软件 uBlock Origin 是一种拦截器，它不仅拦截广告、恶意软件和域名，而且在许多浏览器中可用。它带有维护良好的过滤器列表，不像其他过滤器那样消耗内存。事实上，它在不产生延迟的情况下运行得非常好。你可以一键启用或禁用界面，它还可以拦截所有网站的弹出窗口。如果你不想要默认过滤器列表，可以扩展设置并配置
    WebRTC 等功能。你可以启用高级模式对内容进行细粒度控制。


    - 优点：功能强大的应用程序，开箱即用，同时为高级用户提供细粒度控制。

    - 缺点：除非选择，否则还会拦截依赖收入的网站，但这是任何广告拦截器的代价。

    - 优点：保护你。https://github.com/gorill/ublock


    # 照片/视频导入器


    ### Rapid Downloader 0.9.8


    从手机和相机导入并分类图像视频


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_90_0.png)


    Rapid Downloader 看起来是多余的，因为大多数照片管理应用都能导入照片。然而，该程序专为传输照片和视频设计，提供了比完美工具多多的功能。它让你完全控制如何处理和排序下载。


    默认设置会将照片下载到日期子文件夹。你可以自定义规则。你可以根据类型对照片进行排序，适用于你同时拍摄 RAW 和 JPEG 。事实上，你可以根据日期、大小、焦距等创建复杂的子目录结构。如果你使用外部存储设备作为目标，该程序可以从相机自动导入照片。


    与其放置二进制文件，Rapid Downloader 项目有一个用 Python 编写的安装脚本。要安装应用，只需下载脚本并执行它。它会在安装应用之前获取所有依赖。


    - 优点：功能丰富的应用程序，帮助你排序和分类图像视频。

    - 缺点：对于任何只是将相机照片丢进文件夹的人来说，这可能大材小用。

    - 非常适合……自动整理一组图像视频。

