    \ 说，冲突的历史跨越多年——但加沙的局势向我们展示了我们需要什么。“我们需要可以在本地制造的开源工具，”他解释道，“我在某些地方工作时，感觉这已经是我们能做的最好的，但在加沙地区，感觉确实触及了极限。”\n\
    \n当 Tarek 在 2012 年谈论这些时，他发现自己正处于危机之中：“突然之间有数百人涌入；当以色列人在盖一楼时，突然就有 50 个人出现。我们有 10\
    \ 名医生，可能有 100 个病人，但只有一个听诊器或氧气插管设备。意图是使用它为处于生命支持状态提供一点安慰和帮助。”\n\n## 我们应该报道哪些具有启发性的项目？\n\
    \n通过 future.com 向我们发送您喜爱的项目\n\n![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_32_0.png)\n\
    \n# 焦点\n\n# 昂贵的设备\n\n当提到医疗设备时，为什么会有 300 美元的产品这个问题立刻出脑海。这项发明有 120 年的历史，最后一次相关的专利还是\
    \ 20 世纪 60 年代的，为什么听诊器要 300 美元？很大程度上是因为没有高质量的通用产品。Tarek 说，他们回到了 19 世纪使用的那些设备，它们非常简单。这种方法是听诊器发明的通用方案：巴黎·雷内·拉尼克（Paris\
    \ Rene Laenic）必须把头贴在耳朵上，他拒绝了听诊器，尽管他的同事也有几个理由感到犹豫：“那里全是血，”他说，“我的耳朵流血了。我必须避开它，之后十天时间一直受影响。那只是我自己！”\n\
    \n“制造一个和任何其他产品一样好的听诊器是下一步，”Tarek 回忆道，事实证明比你想象的要容易得多。“工程设计花了 1 万欧元，然后我们就出发了。我们验证了它，并与课堂上的节拍进行了对比。”\n\
    \n"
