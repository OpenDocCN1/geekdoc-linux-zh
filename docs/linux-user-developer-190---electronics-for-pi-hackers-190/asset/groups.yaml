    \ 也是为了速度而设计的。事实上，Ada 与 C 和 C++ 等语言的共同点似乎比与运行快速的 Rust 等现代安全语言的共同点更多。正是安全性（如静态类型）、性能特性以及对存储内部内存直接访问的结合，使得\
    \ Ada 成为大型软件项目的理想选择。\n\n我们将在本教程中带你了解 Ada 程序的基础语法和特性。如果你想更深入一点，我们在 codever 上提供了一个小型\
    \ Ada 程序，用于构建本文中编写的代码。我们建议你通过编写代码来完成本教程，如果你对学习更多感兴趣，可以查看 codeveric。\n\n# Hello,\
