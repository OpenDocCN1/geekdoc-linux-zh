  mdcn: '


    # CHROME OS


    # 发行版快讯


    ## Chrome OS 将支持 Linux 虚拟机吗？


    # 前 10 名

    （每日平均点击量，截至2018年3月9日的30天内统计）

    1. Mint 2804

    2. Manjaro 2315

    3. Debian 1666

    4. Ubuntu 1625

    5. Solus 1285

    6. Antergos 1160

    7. elementary 1059

    8. Fedora 960

    9. TrueOS 825

    10. openUSE


    证据似乎表明这已在路上了


    Chrome OS 基于 Linux（具体来说是 Gentoo），你可能认为直接安装 Linux 应用会很容易。遗憾的是，目前还无法实现，必须使用一些奇奇怪的变通方案。


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_8_0.png)


    想要在 Chromebook 上运行 Linux 的人有两个选择：ChromeOS 或 Crouton 脚本。第一个选项需要一个新的分区（切换分区可能非常耗时），而第二个选项则引入了巨大的安全风险。答案是？


    各种迹象表明 Chrome OS 将支持 Linux 虚拟机，但依靠像 Crouton 这样的第三方项目运行 Linux 意味着面临着必须通过潜在的破解手段来开发
    Android 应用的问题。这是任何计算机所有者都不应该承担的风险，但如果你想在 Chromebook 上使用 Linux 应用，这是唯一的选择了。


    许多因素表明，Chromium 的发布可能会为 Linux 提供虚拟机支持。此外，Chrome 设备可能支持 Chrome OS 模式，这为管理员增加了一个新菜单和一个开关，用于启用或禁用功能。Chrome
    OS 中的某行包含性代码预计于 5 月推出。


    与此同时，一个对话框显示：“欢迎使用 Chromebook。你可以无缝且安全地运行你喜爱的 Linux 应用和命令行工具。”那么，安装 LibreOffice、Linux
    兼容软件，甚至是受 Wine 支持的软件？这可能是的……


    随着 Chrome OS 的演进，请关注 Android 博客：https://www.androidroid.com。


    ### 本月动态


    - 开发 (7)

    - 稳定版 (2)

    - Manjaro 的势头持续增长，打破了 Fedora 此前在前三名的领先地位。同时，Kali 和 Linux 维持了它们的排名。


    ## 亮点


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_8_1.png)


    Fedora 有了一个全新的免费版本，由庞大的社区支持。Fedora 使用 GNOME，并目标是在其他发行版之后引入新技术。


    Kali

    基于 Debian，Kali 是一个专注于安全的发行版，以及一个安全、网络监控和取证工具的集合。


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_8_2.png)


    Linux

    其主要目标是将 Windows 引入 Linux，Ubuntu 发行 Ubuntu LTS，并包含 Xbox 桌面、办公套件和其他软件等功能。


    ## 硬件


    Nintendo Switch 运行 Linux


    但其中一个展示——


    既然 Switch 已经被破解可以运行 Linux 吗？看起来确实如此，这得益于 Overflow 上一个游戏小组的破解。但这不是我们的 Switch；ChromeOS
    已经发布了，那是另一回事。


    桌面版，关于如何在硬件级别运行此漏洞的信息已使其成为。软件支持的缺失意味着，如果你想在 Switch 上安装 Linux，这并不容易。


    Switch 是基于 ARM 架构的，所以如果它能在 Switch 上运行任何内核游戏，那么一个 Linux 版本的 Android 并非不可能，考虑到它添加了
    Google 移动操作系统的一些功能。毕竟，Android 是传闻中 Nintendo 在 Switch 上运行或希望在 Switch 上使用的操作系统。


    “这是一个启动时的花招，无法被补丁（目前正在运行 Switch），而且它不需要任何东西。有大量信息……但仅深于此了。”尽管随后出现了一个视频似乎证实了该漏洞，视频中某人正使用
