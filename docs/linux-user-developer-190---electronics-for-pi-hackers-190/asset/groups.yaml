    \n## 电源\n无法保证软件会将其读取为 0 或 1。事实上，在这种情况下，我们希望它被读取为 0，为了实现这一点，引脚应该连接到所谓的下拉电阻上。然而，所有的单板计算机都使用可以在软件中配置的上拉电阻，因此在这种情况下不需要使用单独的电阻。或者，你可以在\
    \ 0V 和 GPIO 引脚之间连接一个电阻，并使用上拉电阻代替按钮。\n\n还需要记住的一点是，开关的开启和关闭并不干净。当你按下按钮时，它可能会在快速序列中多次开启和关闭。如果你想用它来控制\
    \ LED 的亮灭，可能无法产生预期的效果。为了使操作可靠，它需要进行“去抖”(de-bounce)，这会让软件忽略任何快速变化。然而，更好的方法是使用软件去抖，通常在下方提供。\n\
    \n如果你的外部电路与你的计算机使用相同的电压（可能是 +5V 或 +3.3V）且不需要太多电流，你可以从 GPIO 接头上的相应引脚为其供电。最好检查你的电路不会超过\
    \ GPIO 引脚能提供的功率。如果你的电路需要更高的电压或将消耗更大的电流——例如电机或 LED——那么你需要一个外部电源，尽管你的电路仍然需要连接到 GPIO\
    \ 上的 0V 引脚。\n\n## 大电流限制\nLED 可以通过限流电阻由 GPIO 引脚驱动，但其他负载（如电磁铁和电机）需要比单板计算机能够使用的更多的电流以及更高的电压。要开启大电流负载，你需要使用\
    \ NPN 晶体管来驱动左所示的电路。从 GPIO 引脚输出电流会将电压应用于晶体管上，使其开启。通过限流电阻将 GPIO 连接到基极是非常重要的，否则它将消耗过多电流并损坏单板计算机。晶体管实际上处于\
    \ 0V，因此必须使用欧姆定律计算电阻的最小值；如果开启时 GPIO 引脚为 +5V，且 GPIO 的最大输出电流为 16mA (0.016A)，则最小电阻值为\
    \ R = V / I = 5 / 0.016，即 312Ω。事实上，除非需要很大的值，否则可以使用更高值的电阻，这将减少 GPIO 上的电流。\n\n例如，假设有种情况，我们想要驱动一个最大抽电流为\
    \ 1A 的电磁铁。如果我们使用一个小于 1A 的晶体管，并且电流限制因子不小于 100（这出现在数据表上），那么需要 10mA (0.01A) 的基极来开启电磁铁。回到欧姆定律，电阻为\
    \ R = V / I = 5 / 0.01，即 500Ω。事实上，除非需要很大的值，否则可以使用更高值的电阻，这将减少 GPIO 上的电流。\n\n[/content]\n"
