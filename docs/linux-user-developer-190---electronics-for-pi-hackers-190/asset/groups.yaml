    This includes a number of efforts being spearheaded by the likes of Kees Cook
    of Google, and other brandnames. Over the past few weeks, patches to memory allocated
    by driver includes that might contain data pointers have been floated, alongside
    proposals to remove variable-size arrays (a source of bug), and a renewed rush
    to upstream at least bits of the technology from the ''Stackclash'' patches (originally
    from the grsecurity project). Linus isn''t a big fan of the latter as it makes
    a lot of changes to kernel code in the aid of compile time checks which he would
    rather implement through smarter compilers.


    Matthew Yilcos posted version 7 of his ''XArray'' for 4.17. These implement a
    new ''abstract data type'' which behaves like a large array of pointers. The purpose
    is essentially to replace the existing Linux radix tree implementation with much
    better capabilities. This internal kernel feature, which is helped by the Linux
    user-space code, and which is much simpler to use.


    The page cache means of not being otherwise used to store data - file system -
    that are likely needed by running applications, such that it can be read from
    memory to prefer over swap. Any code that improves cache performance tends to
    improve the user experience.


    # Future processors won''t need to take the hit of either of the Spectre 2 mitigations


    Vitaly Kuznetsov posted patches providing for ''Enlightened'' VMC (Virtual Machine
    Control) interfaces between Linux and Hyper-V. Microsoft uses Hyper-V to underpin
    its cloud services, which needs nested virtualisation. Recently announced support
    for nested virtualisation. In a nested virtual environment, a normal guest virtual
    instance, of the kind that you run in any public cloud, actually runs its own
    hypervisor.


    This might seem strange, but it has a number of uses. These include the obvious
    development advantages (OpenStack), tested with nested virtualisation, for examples,
    but also for some very interesting cases, moving of ''public'' and private cloud
    technologies. When


    x86 VMs where the hypervisor controls them using the VMCS, which is a shared structure
    between the CPU and hypervisor. ''Enlightening'' means that Microsoft provided
    an alternative, much faster, so-called ''virtualised'' interface that uses VMWR.
    This replaces the expensive VMCALL and VMREAD instructions with simple operations
    to an interface provided by Hyper-V.


    Raghendra Rao Anita posted a patch implementing support for (performance) critical
    events across CPU topology. This will use the Linux framework to provide detailed
    data - which focuses on the behaviour of specific cores - system-wide process
    events - without context-switch what a CPU might offer off for power-saving regions,
    which is in the period of 3ms.


    In this month, a small shout-out to Jonathan Will will support upstream in Linux.
    There may be a few users for this type of switch - the Wii - the interesting part
    of the work is that PowerPC-based, which er - uses contiguous memory that is,
    the RAM is not in physical memory and has ''holes'' in it. Linux handles this
    on other architectures, but as part of merging support for the Wii, Jonathan also
    has to go and overhaul some pretty generic core-models.


