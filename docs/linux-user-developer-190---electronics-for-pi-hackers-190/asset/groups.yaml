    为了让用户的计算机、笔记本电脑、智能手机或物联网设备使用其处理器来执行获利的加密货币挖掘任务——即“机会性劫持”；攻击者利用了数千次的 CPU 周期。


    想象攻击者在你的网络内部进行 MITM攻击；他们可以拦截、修改和回放通过你网络的任何数据包。现在考虑这种情况：如果你在浏览网站时正在篡改自己的连接以注入任何内容。这些负载可以完成你想做的任何事情，从破解哈希到执行
    SQL 注入——这完全取决于魔鬼般的创造力和技术水平。


