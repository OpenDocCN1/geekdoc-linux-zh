    >>> import math

    >>> sqrt(x)

    # Return the square root of x."

    ```


    bpython has features of its own; if it sees something it doesn''t understand it
    passes to Python


    Its Ctrl-R review feature is pretty nifty as well. It is like-context-aware auto-completion
    that finds lots of options as you use. If you type type- an attribute, I''ll install
    the module that you are working with and give you the relevant list of names.
    It is worth noting the discovery for modules is a wonderful help for learners.


    We appreciate the ability to save sessions and file to Pasteln, bpython doesn''t
    require any configuration so you get started immediately. You can modify the default
    configuration later to better suit your workflow.


