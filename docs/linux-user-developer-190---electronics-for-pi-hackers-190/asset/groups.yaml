    \ | Window | Help |\n|---|---|---|---|---|---|---|---|---|---|\n| Project | Outline\
    \ | Source | | | | geometry.ada | plame.ada | | |\n\nAbove Ada is a surprising\
    \ language. Developed by the US Department of Defense in the late 1970s, it was\
    \ used primarily for military applications. As one of the first languages requiring\
    \ a great degree of security and safety, with no room for error, there are strong\
    \ safety features like typing systems and good support for including the extremely\
    \ strict environment. The surprising thing is that Ada was also built for speed.\
    \ In fact, Ada seems to have more in common with languages like C and C++ – than\
    \ it has with modern safe languages like Rust, which often run quickly. It is\
    \ this combination of safety, such as static typing, performance features, and\
    \ direct access to the internal memory of storage, that makes Ada an ideal choice\
    \ for large software projects.\n\nWe'll give you a tour of the basic syntax of\
    \ Ada programs, features in this tutorial. If you'd like to go a bit further,\
    \ we've provide a small Ada program on the codever that builds the code written\
    \ in this article. We recommend that you work through this tutorial writing the\
    \ code, and then have a look at the codeveric if you're interested to learn more.\n\
    \n# Hello, world!\n\nSince Ada's syntax is a bit different from other languages,\
    \ we will start with a \"Hello, world!\" program. First, we will use the Ada IDE,\
    \ either by running the command or through your desktop manager. We will prompt\
    \ you to create a project, so we will choose a name and a location to save it.\
    \ What you see is shown in Figure 1, with a single .ada file. This file is filled\
    \ with code similar to the following:\n\n```ada\nprocedure Tutorial is\nend Tutorial;\n\
    \nPut_Line(\"Hello, world!\");\n```\n\nThis is the outline of an Ada 'procedure',\
    \ which is like a void function in a programming language like C++. We add a line\
    \ in the middle to print out our message.\n\n# Tutorial:\n\nLet's try to run this\
    \ by the triangular Run button, as shown in Figure 2. Unfortunately, the program\
    \ does not run properly and we get errors at the bottom: as shown in Figure 3.\
    \ The problem is that the procedure Put_Line that we are printing out a line of\
    \ text is part of another package, we need to tell Ada we want to use that package.\
    \ GPS is generic enough to realise what we want to do, and as fact like\n\n```\n\
    Ada.Text_IO:\npossible missing \"With Ada.Text_IO;\n```\n\nTo the left of this\
    \ message is a little picture of screen: clicking adds the lines\n\n```ada\nWith\
    \ Ada.Text_IO;\n```\n\nTo the top of our file, when we press the Run button, our\
    \ programs produce the output. There are two commands that we added: The With\
    \ command imports the contents of another package, a bit like the #include directive\
    \ in C++. The use command makes the contents of the package visible. We need to\
    \ call with use to use a package, but we might not necessarily want to call it\
    \ to avoid void polling.\n\n# Hello, world!\n\n> There are strong safety features\
    \ built into Ada, including extremely static typing\n\nthe namespace We could\
    \ instead have put the call Ada.Text_IO before the keyword begin so that it would\
    \ be visible to the Tutorial procedure:\n\n```ada\nprocedure Tutorial is\nbegin\n\
    \  Ada_Text_IO;\netc...\n```\n\nWe could also call the function Put_Line directly\
    \ from its package as Ada.Text_IO.Put_Line(\"Hello world\"), removing the need\
    \ for a clause. In a more complicated program, we would have the advantage to\
    \ call it anywhere except where the procedure was declared.\n\nOne of the most\
    \ important features of Ada is its support for generic typing, in which procedures\
    \ or packages can be parametrised by either a type or by a value as index. This\
    \ is similar to generic\n\n![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_52_0.png)\n\
    \nAn Ada project typically starts off a main procedure which runs we start the\
    \ program. We'll illustrate some of the techniques by writing a simple generic\
    \ for track of positions of objects in space. Since we want to keep geometry in\
    \ either two or three dimensions (or some other number), we will use a generic\
    \ parameter for the number of dimensions.\n\nRight-click in the Project Explorer\
    \ and New > Ada Package, as shown in Figure 4. The type is \"Geometry\" and package\
    \ geometry. This will create an Ada package containing some outline code. Add\
    \ more lines of code so it looks like the following:\n\n```ada\ngeneric\n  Dimension:\
    \ Positive;\npackage Geometry is\n```\n\nThis is our declaration. The first two\
    \ lines (the generic section) give the generic parameters for the package, in\
    \ which means we can refer to the number of dimensions. If the user wants to use\
    \ the package, they will need to specify a number of dimensions (typically 2 or\
    \ 3).\n\nThis example (below) shows how we declare variables. Here, Variable_Name\
    \ is an identifier, and Variable_Type is its type. The following code:\n\n```ada\n\
    Variable_Name : Variable_Type;\n```\n\nThe point of defining this is that it allows\
    \ us to define an array type representing points in space, which we can do with\
    \ the next:\n\n```ada\ntype Point is new array (Indices) of Float;\n```\n\nThis\
    \ is the type of indices to handle all the integers in the range 1 to 10.\n\n\
    ```ada\ntype Indices is new Positive range 1 .. 10;\n```\n\nThen we create new\
    \ copies of type.\n"
  mdcn: "\n\n# Ada 教程简介\n\n# Ada 编程简介\n\n学习 Ada – 一种快速、安全的语言，特别适用于对可靠性和效率至关重要的场景\n\
    \n![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_51_0.png)\n\nJohn Gowers\nJohn 是一名编程与计算机科学的大学导师。他喜欢在任何他能接触到的设备上安装\
    \ Linux。他曾在学术环境和公共部门行业中使用 R 语言。\n\n# 资源\n\n- Ada G 社区版\n- www.adacore.com/\n-\
