    but is also available in many browsers and protects your privacy. It comes with
    well-maintained filter lists, unlike some other content filters do. In fact, it
    might actually save the memory by not displaying adverts generally larger than
    the memory required to use the extension. uBlock Origin manages to work with magic
    without any noticeable delay in page loading. A minimal user interface helps you
    keep track of blocked requests and also offers quick access to common functions.
    Using uBlock Origin, in fact, it works great out of the box. You can enable or
    disable the interface with a single click, and also offers to block pop-ups on
    all large sites. If you never want more than the default block lists, you can
    display the extension''s settings and configure features of the browser, such
    as WebRTC. You can also enable the Advanced mode for fine-grained control over
    how and when content is blocked.


    - Pros: Feature-rich app that works beautifully out of the box and yet gives fine-grained
    control to advanced users.

    - Cons: Unless selected, it also blocks ads on sites that depend on revenue, but
    that''s the price of any ad-blocker.

    - Pros: Protecting you from online adverts. https://github.com/gorill/ublock


    # PHOTO/VIDEO IMPORTER


    ### Rapid Photo Downloader 0.9.8


    Import and catalogue images and video from phones and cameras


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_90_0.png)


    Rapid Photo Downloader might seem redundant that most photo management apps can
    import photos. This app, however, is designed specifically for transferring photos
    and videos, and offers a lot more functionality than a perfect tool could be.
    It gives you complete control over how it processes and sorts the downloads.


    The defaults automatically download photos to date-subfolders. You can define
    custom rules. You can sort photos by their type, which comes in you shoot both
    RAW and JPEGs. In fact you can create a complex subfolder hierarchy by date, size,
    focal length, and so on. If you use an external storage device as the destination,
    the app can automatically import photos from the camera.


    Instead of putting binaries, the Rapid Photo Downloader project has an installation
    script written in Python. To install the app, simply download the script and execute
    it. It will fetch all the dependencies before it installs the app.


    - Pros: Full of features and useful options to help you sort and catalogue your
    images and videos.

    - Cons: Might be overkill for anyone who dumps images from the camera into a folder.

