  mdcn: "\n\n## Sputnik 计划的未来\n\n# Sputnik 计划的未来\n\n极少有公司提供预装 Linux 的机器，但得益于 Sputnik\
    \ 计划，戴尔继续提供开箱即用的 Ubuntu 旗舰笔记本电脑。\n\n## 核心特性\n\n- **Ubuntu**\n  作为一名 Linux 用户，很容易感觉自己像个二等公民。除了买一台\
    \ Windows 电脑然后“让 Linux 运行起来”之外，没有多少选择，而且至于支持问题，别想了。坦率地说，2012 年电脑巨头戴尔启动了 Sputnik\
    \ 计划。戴尔内部的一项创新活动组成了一个小团队来领导这个疯狂的想法，并给他们六个月的截止日期来出一款能够“飞”起来的产品。由于从一开始就深度参与，该项目被证明广受欢迎，并于\
    \ 2012 年 11 月推出了 XPS 13 开发者版。五个多年后，我们已经有了这款最初产品的第七代，以及来自其他制造商面向更广泛的 Linux 力用户的产品。像戴尔这样的大型公司可能向特定用户群体销售高端、配备\
    \ Linux 的硬件吗？Sputnik 能凭借足够的销量来改变市场吗？这些都是“Sputnik 计划之父”Baxter George 必须回答的问题。\n\
    \n六年前，我们见了一位顾问，讨论戴尔如何更好地服务公司。作为一名 Linux 用户，他直觉上的想法很明确：这种请求是可以探索的。通过戴尔的投入，在压力下加强\
    \ Sputnik 计划的努力创造出了他们可能喜欢的优质 Linux 笔记本电脑。调试团队预计会有几百份回复和（付费）测试版注册，但实际上收到了数千封邮件，这种支持程度说服了戴尔的决策者：Linux\
    \ 产品线是有需求的，在公司内部是可行的未来。如果说有什么能开发出强大的机器，Sputnik 版，Baxter 的同事决定利用业余时间在戴尔 Sputnik\
    \ M3680 移动机器上运行，这证明了公开让其他硬件用户的必要性，引发了比以往任何时候都多的 Linux 兴趣。去年，一条新的产品线作为正式产品推出。所有机器都是“由人驱动”的哲学是开源的本质——而这种哲学适用于整个\
    \ Linux 领域如此庞大的范围内。\n\n扩展的产品线基于用户反馈，用户不再局限于 XPS 13 的单一规格，而是可以选择他们偏好的硬件。在世界其他地区有更多变体——例如，英国也有配置为基于\
    \ Linux 机器的 XPS。通过添加如工作站等功能，该产品线已从单一型号演变为更广泛的选项，包括 Precision AI 系列。\n\nSputnik\
    \ 计划已经成长并扩张，产品可能更多化，但核心准则保持不变。产品是由开发者为开发者开发的。\n\n- **在旅途中**\n  最新的 9370 代 XPS\
    \ 13 在体积上比前代提升了 24%，适合轻便旅行。\n\n- **悦目的按键**\n  开发者需要可靠的键盘，XPS 13 令人印象深刻，具有足够的键程和手感。\n\
    \n- **梦幻屏幕**\n  9370 的 4K 显示选项明亮且清晰。Linux 应用的 HDR 支持比以前更好，尽管触摸屏有点浪费。\n\n- **动力支持**\n\
    \  快速存储器和充足的 RAM 也是必不可少的；XPS 13 提供高达 16GB 的内存和高达 1TB 的极速 NVME SSD。\n\n- **CPU\
    \ 性能**\n  开发者版需要原始动力，XPS 13 搭载四核第八代 Core i7 处理器，不会让你失望。\n\n![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_57_0.png)\n\
    \n## 概览\n\nRoger：XPS 13 9370 是 Sputnik 的最新型号——详见第 62 页我们的评测\n\n![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_58_0.png)\n\
    \n- **Sputnik smith p58**\n  Sputnik 计划最初是一个创建一个单一机器的小型项目，其范围不断扩大。我们来看看该系列如何扩展以服务比以往任何时候更多的用户。\n\
    \n- **硬件使用 p60**\n  如果你投资了一台由 Sputnik 驱动的机器，开箱体验是怎样的？它符合你对高端硬件解决方案的预期吗？\n\n- **展望未来\
    \ p61**\n  随着 Ubuntu 继续维护以及 Canonical 转型其使命，桌面电脑、服务器和游戏机的未来将如何？凭借 Ubuntu 独特的愿景——\n\
    \n- **XPS 13 9370评测 p62**\n  我们深入研究了 XPS 13 9370 版本，它比以往任何时候都强大，同时更薄、更轻！阅读完整评测。\n\
    \n- **快速速报**\n  XPS 13 提供四种配置：在欧洲提供入门级 8GB/256GB/FHD、16GB/512GB（带 FHD 或 4K）或 16GB/1TB\
    \ 型，使用 i7-8550U 处理器。\n\n随着 Linux 系列强劲走来，你必须假设这条路一直很顺畅——事实并非完全如此，因为早期那些仍在开拓“小众”市场需求的人曾面临阻力。\n\
    \nwww.linuxus.co.uk 59\n\n## Sputnik 的未来\n\n如果你决定从戴尔购买 Sputnik 计划的机器，体验感觉和今天一样吗？值得注意的是，正如你预期的那样，你不能走进商店买到现成的\
    \ Linux 驱动机器。市场份额这并不完全意外，但你可以做的——至少对于 XPS 13 而言——是访问大型零售商之一查看并尝试硬件，尽管运行的是 Windows。此外，你还可以\n\
    \n![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_59_0.png)\n\n## Sputnik 计划\n开发者系统\n\
    \n发布云原生应用的终极格式\n在 Sputnik 上进行 PC 开发\n\n> Linux 驱动的戴尔机器的开箱体验正如你预期的那样令人印象深刻\n\n\
    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_59_1.png)\n\n下单标记，如果你不是企业买家，请在交付后 14\
    \ 天内退货以获得全额退款（退货运费）。在戴尔网站上查找 Ubuntu 并不简单。没有一个集中的 Sputnik 计划页面，Linux 版本通常混杂在对普通用户来说有点模糊的说明中，正如我们闻到的。\n\
    \nBarton George，Sputnik 计划创始人兼领导者，戴尔 Ultrabook（超薄笔记本电脑）项目负责人\n\n> 快速速报\n由 Sputnik\
    \ 驱动的 Precision 5520 是世界上最薄、最轻的 15 英寸移动工作站。基于与 XPS 15 相同的底盘，该笔记本配备最高 32GB 内存并运行\
    \ Windows Pro，可以与顶尖开发者竞争，且比微软的对应产品便宜。戴尔也不再使用开发者版。我们与戴尔谈了关于这家公司，他们目前正在解释为所有戴尔 Linux\
    \ 的机器开发一个中心落地页，我们发现无法使用完整的 Linux 产品组合可能会令人沮丧。\n\n在设备上，你会发现显示是 Linux 驱动的（来自 Intel\
    \ 贴纸），你仍然会在 Windows 键盘上找到一个按键来关闭那些我们闻到的非官方功能。为了让 Windows 徽标隐藏在键盘上，你应该在桌面上放置一个合适的标志以指示该机器与与不同之处，但至少在以前，我们通过开发者版的免费\
    \ Windows 了解了这一点。\n\n在对你的系统开始一键化配置之前，你提供了写入恢复 USB 介质的选项。镜像也可以从戴尔支持网站下载，那里唯一的服务标签旨在向你展示该机器的完美下载。这提供了全套\
    \ Windows 驱动程序的访问；你可能出于任何原因需要它们。这种将操作系统恢复到正常运行初始状态的能力是\n\n![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_59_3.png)\n\
    \n上方 2013 版赞助的 1920x1080 IPS 屏幕\n\n60\n\n"
