    \n> 快速指南\n> 表面贴装与通孔\n\n## 开关接口\n我们看过的这类原始元件的引脚穿过电路板上的孔。在手动切换电路时，这些元件要用得多，但另一种商业电路中常见的方案是元件表面贴装。表面贴装电阻、电容和晶体管通常是没有引脚的模块；而集成电路虽然有引脚，但它们并不穿过板上的孔。它们很难用手构建。\n\
    \n将按钮连接到 GPIO 引脚初看起来也似乎简单。我们可以想象，例如使用开关来控制正电源 (+5V 或 +3.3V) 和到配置为输出的 GPIO 引脚的电压。当按下按钮时，正电源将连接到\
