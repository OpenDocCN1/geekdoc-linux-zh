    关于压缩。更快的预设（presets）意味着更低效率但更快的预览；有如 verslow、slow、medium、fast 和 veryfast 等选项，中间还有更多选择。最后两个参数定义了格式和输出目的地，当我们使用它时目的地是
    RTMP。目的地是 Twitch 直播的 URL，以我们的 API 密钥结尾。你可以从 Twitch 获取 API 密钥：https://www.twitch.com/YOURSERNAME/dashboard/settings/streamkey，阅读警告并点击“显示密钥”。


    现在我们知道了所有这些部分的作用了，希望理解它们的目的应该并不困难。是时候开始带声音的直播了！


    ## 添加音频


    FFmpeg 可以非常简单地为另一个视频添加音频，这非常直接。使用如下命令所示：


    ```bash

    ffmpeg -hwaccel auto -thread_queue_size 512

    -f alv -acodec aac -i input.mp4 -f video 0 -s 1280x720

    -f dev/null -vcodec libx264,preset veryfast -pix_fmt yuv420p -brate 4000k-bufsize
    8000k -pix_fmt acodec aac -b:a 128k -ar 44100 -bufsize 5000k

    -preset veryfast -f flv -rtmp "https://live.twitch.tv/app/86945472" YOUR_STREAM_KEY

    ```


    你应该注意以下几点。如果你向输入内容添加音频，你可能需要重新编码 Twitch 支持的音频。其中一个问题是流不同步，导致音频在直播期间也是不同步的。如果你发现恒定速率太高，尝试在视频命令中移除“-f
    vrate”选项（如果有的话），但这里不需要。


    - acanc 参数决定了音频有多少声通道。通常是单声道，除非这里只有一个通道。我们使用 44100 采样率，或其他 44.1kHz 的采样率，这是 CD
    格式。如果你想要立体声，请增加比特率，因为编码器比特率在这里看起来不明显。


    你可能会注意到 `thread_queue_size` 设置在 `-i` 之前。如果你预计 FFmpeg 会滞后或卡顿，请这样使用它——但这仅适用于音频输入视频。这种方法影响
    FFmpeg 处理流的方式。如果你正在使用树莓派 Zero，或者将其调高到 192，这可能会给我提供一个流畅、无故障的流，但结果是音频部分可能是静音，任何更高的值都会消耗大量内存并导致流冻。根据经验，如果你的音频断断续续，请增加数字；如果
    FFmpeg 崩溃，请减小它。


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_78_0.png)


    ## 连接 Twitch 聊天


    如果让观众通过聊天获得某些控制怎么办？聊天实际上基于 Twitch 消息标准。然而，如果你有一个自动化解决方案，你可能不想使用完整的 IRC 机器人；你可能只想轻松地直播。


    下载一个示例聊天脚本，可以根据你的需求进行定制。从 https://github.com/lib-twitch/chat 直接下载。使用 `pip install
    irc` 安装 IRC 聊天库。你还需要两个参数：OAuth 令牌和 ID。如果你想加入 Twitch 聊天，可以访问 https://www.twitch-apps.com，然后点击“连接到
    Twitch”。获取聊天非常简单：填写三个字段：名称字段（Name Field）可以包含任何内容，OAuth 重定向到 http://localhost，你会在应用程序类别描述中看到聊天机器人“Chat
    Bot”。你将看到一个可以在其中配置客户端 ID 的页面。


    现在，你有了 `your_oauth_token` 的 OAuth 令牌和 `your_client_id` 的 ID。这里是运行聊天脚本的方法。


    ```bash

    python USERNAME_FOR_BOT_client_id_oauth_token_USERNAME

    ```


    注意 OAuth 令牌（在 ID 之后）前面没有 `out:`，由 Twitch 提供的 `oauth` 已经足够了。运行脚本后，你会得到后续的“Connecting
    to irc.twitch.tv”消息，随后是“Joining as your_username”消息。输入 `topic help` 来退出聊天：机器人应该会接收命令并响应，如在控制台上打印某些内容。如果聊天没有连接，请检查客户端
    ID 和 OAuth 令牌。一旦运行成功，恭喜你——现在你有了一个强大的机器人来与你的观众互动：直播愉快！


