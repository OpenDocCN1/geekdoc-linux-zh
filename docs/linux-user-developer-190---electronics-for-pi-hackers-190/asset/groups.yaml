    - 将 Make 转换为同步工具


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_1_0.png)


    电子边界基金会（EFF）是捍卫数字世界公民自由的领先非营利组织。EFF 成立于 1990 年，通过影响力性诉讼、政策分析、基层活动和技术开发，维护用户隐私、表达自由和创新。随着我们对技术的使用不断增加，我们致力于确保权利和自由得到增强和保护。


    # EFF.ORG


    # 电子边界基金会


    在电子前沿保护权利并促进自由


    # LinuxUser & 开发者


    # 欢迎阅读 Linux User & Developer 第 19 期


    # 本期内容


    - » Pi 极客的电子设备，第 18 页

    - » 下一代发行版，第 64 页

    - » 评测：树莓派 B+，第 86 页


    欢迎阅读英国和北美最喜爱的 Linux 及开源软件（FOSS）杂志。在纪念斯蒂芬·霍金教授逝世之际，回顾了过去一个月令我们沮丧的事情，他是理论物理领域的巨匠，也是《星舰号》节目中最“聪明”的嘉宾。我们的雷达上也出现了一个
    Pi 形状的物体（见第 86 页树莓派 B+），我们将其确认为新款 Pi，因此我们通过内容丰富的“Pi 极客电子设备”（第 18 页）平息了大家的担忧——使用新的
    Linux 3 B+ 构建电路和发明 Pi 的方法是一个极佳的补充，它极具启发性的网络魅力，我们已经在本期中对未来做了预测。本月，我们还尝试预测 Linux
    发行版的大趋势（第 64 页）；查看新款 XPS 12（第 62 页），并考虑使用 Google Sputnik 的奇妙世界（第 32 页）。当然，最后我们还有大批精彩的教程供大家尽情享受！阅读愉快，


    Chris Horner


