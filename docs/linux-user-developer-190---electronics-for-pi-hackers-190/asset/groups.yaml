    Many technically minded users are proficient in coding, and take pride in mastering
    new languages, consider electronics as something of an arcane art. If this is
    the case, we are here to help. Understanding electronics is our theme here, with
    the aim to help you understand


    > You might make a start with nothing more complicated than turning a LED on and
    off using a push button, but mighty oaks from acorns grow


    and build electronic circuits, even figure out how to design your circuits for
    interfaces. There are many ways to interface with electronics. The Raspberry Pi
    is often thought of as a vehicle for learning to code, but one of its key features,
    the GPIO header, is mighty handy. By attaching hardware such as, LEDs and motors
    to this connector, often via some sort of interfacing circuitry,


    devices can be controlled by software. At the next level up are the various types
    of single-board computers such as those low-end boards with PIC chips. Generally
    speaking they are unable to display or run an operating system, so they can really
    perform a useful function in conjunction with software.


    The final hardware hardware that could control external devices is perhaps your
    laptop PC. USB-to-GPIO adapters are available to PCs with GPIO pins, like the
    Raspberry Pi or other single board computers. PCs can be used for control applications,
    animation, or computing for those that need it.


    To assure you that this stuff isn''t nearly as daunting as you might fear. You
    might have no experience with programming but ''Hello, World!'' and work up you
    from there, and the same applies to electronics and hardware. You might make a
    start with nothing more complicated than turning a LED on and off using a push
    button, but mighty oaks from acorns grow...


    # AT A GLANCE


    +   Key components p20

    Electronic components are the building blocks of electronic circuits - we will
    introduce those you''re most likely to encounter.


    +   Circuits & boardwalk p22

    Circuits are defined using circuit diagrams. We will help you to understand symbols
    for components and how to construct a circuit using a boardwalk.


    +   Stripboard and PCB p24

    Breadboard construction isn''t perfect. We explain stripboard and PCB construction
    as more compact, neat and permanent solution.


    +   Design circuits p26

    Sometimes you''ll need to design your own. To get started, we provide a simple
    guide to common interfacing methods.


    +   Essential software p28

    You can design breadboard, stripboard or PCB layouts yourself, but it''s much
    easier with software.'
