  mdcn: "\n\n## InspiringOS 开放式医疗设备\n\n快速速报\n\n止血带\n失血性死亡——严重出血——在许多冲突地区中一直是对生命的重大威胁。“在2014年的战争中有超过2500人死亡，其中一半的人因为肢体截肢导致死亡，”Tarek\
    \ 说道，他正向加沙（Gaza）大量分发止血带。\n\n![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_33_0.png)\n\
    \n在加沙已完全并开始分发（详见第33页），听诊器是一个起点，尽管作为一个概念证明，我们向世界开放了下一款设备。用通俗的话说，我们做的下一款设备叫做脉冲血氧仪。通俗地说，这是一种夹在手指上的小夹子，用于监测心率等你的生命体征。\n\
    \n在采纳方面，脉冲血氧仪的情况是这样的：Tarek 说，上一个相关的设备要追溯到80年代。“这种设备变得负担得起，到了20世纪90年代，它随处可见。”脉冲血氧仪也是挑战医学中用来补偿出血的过时方法的一种，在这里我们通过观察人们的眼睛和手指来观察体内的含氧量——血氧饱和度。如果你有25美元，如果没有脉冲血氧仪，任何方法都很难检测血红蛋白水平。“这对于加沙地带的孩子非常相关，他们喝了污染的水只有通过昂贵的血液测试才能被发现，所以如果你能出一个廉价的指探头，我们可以在100美元到15,000美元之间的任何地方使用，提供一个简单的解决方案。如何让它变得负担得起呢？”Tarek\
    \ 说。“与其他设备相比，氧气的差异仅仅在于五分钱的LED。所以，如果我们使用两个LED——那是测量氧气的，我们再添加第三个LED，那就是血红蛋白。每个成本五分钱。为了让它\n\
    \n上方 | 加沙正在开发3D可打印手术工具的设计。Tarek 的项目是展示如何通过制造30-50种通用医疗设备，而这些设备的制造不会给患者带来问题。\n\n\
    > 我并不是试图打破系统——我正试图插入那些先进得多的新机器\n\n脉冲血氧仪——这就是我们需要的——你立即就能验证这个研究领域，因为你不需要猜测。所以我们的目标不仅仅是创造某种处理氧气的东西，还要处理从那时起的所有其他问题。问题之一是血红蛋白血症，它会导致抽搐、昏迷和死亡。Tarek\
    \ 说道\n\n在加沙；当患者前往加沙进行析透的挑战变得无法实现时。“这有点像是，”Tarek 说道。“但一年内所有需要析透的人。每个人都是。”加沙在一个独特的情况下找到了解决方法，即从零患者开始析透。然而，\n\
    \n34\n\n* 带有\n\n![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_34_0.png)\n\n![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_34_1.png)\n\
    \n上方目前正在对其原型型脉冲血氧仪进行临床试验，以测量患者血液中的氧气水平\n\n这是四年前的脉冲血氧仪早期原型\n\n焦点\n\n# 关键电力\n\n\
    对于许多加沙的人来说，加沙经历了能源危机，Tarek Loubani 和其他人发起了一项名为 EmpowerGAZA.org 的活动，集资为加沙的两家主要医院购买并安装太阳能电池板，以便进行关键护理，因为目前的短缺是无法接受的：“如果我们采取了你们的，就在两天前，它们每天只有几个小时，实际上是每天六小时，然后是六小时，直到两周前。当你们每天没有四小时电时，你们就开始开始休息了。”\n\
    \n![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_34_2.png)\n\n太阳能电池板提供了可持续、可靠且可新的能源。该项目已经在三家医院安装了电池板：“至少，有了太阳能电池板，内部单元得到了覆盖，或者症状得到了覆盖，其中一家医院的析透也得到了覆盖。”\n\
    \nTarek 说我们在加沙需要20MW（千瓦）。为了让你有个直观的概念，Tarek 说他在加拿大的医院大约使用 60MW（兆瓦），而整个加沙的需求少于60MW。\n\
    \n八年后，加沙表示如果没有范式转移，他们就什么也得。“机器都是24小时运行的，没有机器是每天运行2小时的，这就是我真正想做的。”\n\n对于析透是非常可行的。“一个女人，她当时还是个女孩，作为她的学校项目做了析透，几年后并将其成本降到了5,000美元，”Tarek\
