    > 下方：洞板允许你制作比面包板更永久的电路


    面包板非常适合教育用途，但对于更永久的项目，有更好的替代方案。这就是为什么使用洞板和 PCB 构建


    洞板（通常被称为商标 Verboard）与面包板类似。它们在 0.1 英寸间距上有一排孔，允许你从背面焊接制作出的电路。尽管存在重要的区别：首先，当元件引脚插入孔中时，必须焊接在铜箔上。第二，洞板比面包板长得多。由于这个原因，在洞板上制作时焊接是必要的。此外，你将使用细铜线来制作额外的连接。在简单到中等复杂的电路中，使用导线是可行的，并且使用纸笔，以便在你头周围完成所有工作。软件设计工具也将可用（见第
    26 页）。


    洞板制作适用于你不需要构建大量它们的情况。如果你预见到要制作特定的电路，特别是当你想要让电路更紧凑时，印刷电路板是更好的解决方案。印刷电路板（PCB）几乎专门用于商业电子……（此处原文包含大量重复的
    OCR 错误，已根据逻辑流处理）


    [修正：移除重复的 OCR 生成文本块]


    ## 如何操作

    使用洞板构建电路


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_23_0.png)


    ## 识别元件


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_23_1.png)


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_23_2.png)


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_23_3.png)


    - 1：弯折引线

    - 2：置入元件

    - 3：焊接元件


    在识别元件时，你还需要识别它们的端子。电阻和电容可以以任何方式连接，极性电容除外，你需要区分正极和负极引线。电容上印有加号或减号，对于电解电容，外壳上的结构标识了正极。


    在二极管的情况下，外身上打印的色带标识了阴极和阳极。晶体管体上有一个平坦部分，你可能需要查阅数据表来识别基极、集极和发射极。


    第二点是面包板并不特别紧凑，且不易放入外壳。但你可能想将它们用于某些项目。我们的下一个主题——洞板和 PCB 构建——解决了这些问题。

