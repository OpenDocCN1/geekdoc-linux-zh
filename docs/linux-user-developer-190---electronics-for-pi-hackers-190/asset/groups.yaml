    \ Linux 发行版默认带有 Make，因此它为不常用法提供了一个便携的替代方案。我们希望在本文之后，你能想到 Make 的一些不常用法。\n\n# 作为同步工具的\
    \ Make\n\n假设我们正在构建一个网站。网站位于外部服务器 webserver.example.net 上，但我们想更新网站文件。如果我们本地仓库中有三个文件\
    \ index.html, style.css 和 script.js，我们可能会使用类似下面的命令将它们复制到服务器：\n\n## 资源\n\n```make\n\
    # Makefile\nDHFLAGS=-parallel\n\nexport DEKG_BUILD_OPTIONS = hardening=all\nDPKG_EXPORT_BUILDS\
    \ = 1\ninclude /usr/share/dpkg/builddeps.mk\n\nall: $(DHFLAGS)\n\noverride_install:\n\
    \tinstall=fail-missing\n\noverride_auto_config:\n\tCONFIGURE=1 ../autogen.sh \\\
    \n\tauto_config=$(shell \\\n\tdisable-silent-rules \\\n-libdebexdir=/usr/lib/byte-applets\
    \ \\\n-localstatedir=/var \\\n-disable-any=1 \\\n-with-cpufreq=libcpufreq\n\n\
    override_dh:\n\tstrip --dpkg-system=\"make-apt-build-pkg (<= 1.28.0-1)\"\n\nget-source:\n\
    \tction -noconf --force-download --rename=download:current.version --destdir==\n\
    ```\n\n上面的 Make 也可以用于打包 Debian 文件 - 参见相反页的小册\n\n```bash\nscp index.html style.css\
    \ script.js \\\nluad@webserver.example.net:/home/load/public_html\n```\n\n这对于小型网站是有效的，但很快我们就会有一个包含多个目录多个文件的大型项目，复制到服务器可能需要很长时间。写一个脚本来复制已经足够了，但如果我们对其中一个文件进行了更改，就不需要复制整个内容；我们只想复制更改的文件。\n\
    \n这个问题的答案是构建一个同步工具，它告诉我们自上次以来哪些文件发生了变化，并仅将这些文件复制到服务器。Make 的整个操作都是围绕文件的修改时间进行的，因此将其作为构建同步工具的工具是有意义的。\n\
    \n> 目标是帮助你将 Make 视为一个可以用于日常 Linux 管理的自动化套件\n\n为了进行测试，我们将使用一个 shell 脚本来模拟文件复制到服务器的过程。你可以在\
    \ server.copy.sh 找到这个脚本。脚本会要求密码，如果密码正确，它会将给文件复制到服务器。密码是 swidth，不过你可以在这里找到：\n\n\
    ```bash\n$ index.html style.css\n$ /server.copy index.html\nPassword: swidth\n\
    index.html copied to server:\nscript.js copied to server: \n```\n\n我们使用一个（唯一的）辅助文件\
    \ .last_push，它的最后一个功能是记录我们上次推送到本地仓库的时间。在我们将更改推送到服务器之前，我们运行 `touch last_push` 命令。\n\
    \n当任何一个文件自上次推送以来发生变化变化时，我们将文件复制到服务器。这表明我们要推送到服务器的所有文件都应该是 last_push 的依赖项。\n\n\
    ```make\nFILES = *.html *.css *.js\nlast_push = $(FILES)\n```\n\nlast_push 的配方应该包含\
    \ `touch last_push` 命令以便更新时间戳。我们还应该让它负责将所有文件推送到服务器。此此的关键是使用自动变量 `$`，它被填充为所有比该规则更新的当前依赖项列表；在这种情况下，恰恰是自上次推送到服务器以来已修改的文件列表。\n\
    \n# 图 1\n\n```make\nFILES = *.html *.css *.js\nLAST_PUSH = .last_push\nSCP = ./server_copy.sh\n\
    PHONY: push\npush: $(LAST_PUSH)\n\t$(SCP) $(FILES)\n\ttouch $(LAST_PUSH)\n```\n\
    \n```make\n.last_push : $(FILES)\n\t./server.copy $$\n\ttouch .last_push\n```\n\
    \n使用变量来保持可维护性的完整 make 是如图 1 所示。你可以使用 `make sync` 运行它。\n\n```bash\n$ make push\n\
    ./server.copy index.html script.js\nPassword: swidth\nindex.html copied to server:\n\
    style.css copied to server:\ntouch .last_push\n```\n\n现在，如果我们有多个文件，其中一个被复制的：\n\
    \n```bash\n$ make push\n./server.copy index.html\nPassword: swidth\nindex.html\
    \ copied to server:\ntouch .last_push\n```\n\n最后，我们需要验证要找到的文件的值，以便找到我们想要跨复制的所有文件。我们可以通过程序化的方式实现这一点，使用一个\
    \ shell 函数调用该工具。该函数将搜索目录及其子目录中扩展名为 html、css 或 js 的文件。\n\n```make\nFILES = $(find\
    \ . -name *.html -o -name *.css -o -name *.js -o -name *.jpg)\n```\n\n在这里，我们使用\
    \ `$(shell ......))` 函数，我们现在可以添加具有相同扩展名的文件我们的同步工具仍然能够复制它们。\n\n- deb 规则文件\n使用 Make\
    \ 的一个重要原因是在 Debian 发行版中。每个带有 Makefile 的 Debian 发行版都是独特的。\n\n# 并行处理\n\nMake 最强大的功能之一是并行处理能力。默认情况下，Make\
    \ 按顺序执行规则，但除非我们使用，我们可以使用操作系统的任务调度器自动这样做，以确保哪些工作并发，哪些需要顺序执行。\n\n要启用此，我们在运行 make\
    \ 时使用 -j，如果我们指定作业数 - make -j 将限制同时执行的任务数。如果我们运行 -j 而不指定数字，线程数将以无限制模式运行。\n\n使用命令行开关使用\
    \ -j 1，这在系统高负载时让 Make 限制其并发运行的线程数。负载水平通过在我们运行 uptime make 命令时体验平均负载来衡量。\n\n```bash\n\
    $ uptime\n10:37:13 59 min, 3 users\naverage: 0.31, 0.34, 0.53\n```\n\n# 图 2\n\n\
    ```bash\nLAST_PUSH=:last_push\nfor f in \"*\";*.css; do\n  if [ \"$f\" != \"$LAST_PUSH\"\
    \ ]; then\n    LAST_PUSH=\"$f\"\n  fi\ndone\nscp $LAST_PUSH linux@linux.org:/home\n\
    touch LAST_PUSH\n```\n\n虽然我们可以使用 shell 脚本构建同步工具，但它比图 2 中的规则更不灵活且更难配置\n\n"
