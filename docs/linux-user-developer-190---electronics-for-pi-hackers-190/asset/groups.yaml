    # Ansible: Automate software updates


    Use Ansible playbooks and ad-hoc commands to automate updates to software


    # Michael Abogaye


    Michael is an application security engineer and tester in Accra, Ghana.


    In Today''s IT industry, automation is becoming the norm. From configuration management
    to deploying applications to a production environment, Ansible is capable of automating
    tasks for system administrators, developers and other pros. In this tutorial,
    we''ll learn how to update software on a remote machine using both commands and
    playbooks.


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_41_1.png)


    As we want to demonstrate how to update software on a Debian machine, let''s get
    Ansible working. For this use case:


    # What is Ansible?


    Ansible, founded by Michael DeHaan and later acquired by Red Hat, is software
    that automates configuration management, application deployment and provisioning
    for system administrators. It is extended to cloud deployment and more. Ansible
    works by configuring remote computers via SSH, so there is no need to install
    anything.


    ```

    $ apt-get

    $ apt-add-repository ppa: ansible/ansible

    $ apt-get

    $ apt-get install ansible

    ```


    The kind of system administrators and developers who can automate with Ansible:


    +   - **Configuration management**: Want to install or update packages, or start
    services using SSH, Apache2, or Nginx running on your server? Ansible makes it
    easy.

    - **Application deployment**: If you''ve built a PHP web application for your
    users to make it possible to install your application, you''ll need to deploy
    or ''move'' applications from the server to a production environment.

    - **Software provisioning**: Ansible is useful for setting up network infrastructure
    by FTP servers, DNS servers and routers to be accessed by the right users.


    The first line output from the Debian machine we need to check whether we have
    installed Ansible correctly on the machine. The repository is refreshed or updated.
    Now the last command installs Ansible. Now we check if Ansible installed correctly.
    There are two ways to check whether ansible is working. Check if Ansible is properly
    installed by:


    The command above reveals the version of Ansible you have installed. You can also
    install a repo manager to check whether Ansible is installed correctly. Ansible
    connects to remote computers via SSH; it requires access to root or sudo users
    for SSH:


    ```

    $ ansible -version

    ```


    In this tutorial, we''re going to install Ansible on a Debian distribution, which
    is any live Linux distribution. To update software, you''ll need at least two
    machines: one will act as the controlling machine and the other as the remote
    server. There are many different ways of installing Ansible; you can download
    it from the GitHub repository at https://github.com/ansible/ansible, install it
    from pip, or use apt-get or yum depending on your distribution.


    To Ansible and learn how to update software, you''ll need at least two machines:
    one will act as the controlling machine and the other as the remote server. There
    are many different ways of installing Ansible; you can download it from the GitHub
    repository at https://github.com/ansible/ansible, install it from pip, or use
    apt-get or yum depending on your distribution.


    The command above is an example of an Ansible ad-hoc command. This command enables
    you to perform tasks such as checking whether a particular package is alive or
    not, running commands to check disk usage, processes running on a remote machine
    and any other system. There''s one disadvantage to using such commands, you can
    only perform a task on a single system. The following shows the basic syntax of
    an Ansible ad-hoc command:


    ```

    # ansible <hosts> -m <module> -u <username> [--become]

    ```


