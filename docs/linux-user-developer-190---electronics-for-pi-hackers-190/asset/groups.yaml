    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_60_0.png)


    # 快速指南


    # Dell 的 Linux之心

    2012年11月的原始 XPS 开发者版本


    除了 Project Sputnik（斯普尼克项目），命名显然是因为 Canonical 的 Mark Shuttlesworth 是历史上第二个私人“太空游客”（乘坐“联盟号”飞船舱，但嘿，斯普尼克听起来很酷）。Dell
    也为 Linux 提交过代码。所有服务器都提供多个版本的 Ubuntu 和红帽企业版（Red Hat Enterprise）。工厂还提供大量预装 Neoklyn（即“中国版
    Linux”），尽管其开发似乎已有些停滞。Dell 通过 allalliance 大力支持了 Valour 的基于 Debian 的游戏系统 StreamOS。


    Dell 还提供了一系列 Chromebook，它们由 Linux 驱动，是其许多竞争对手采用的“Windows”方案的更新替代方案。Dell 拥有 Sputnik
    以及 Linux 社区的耐心支持——在某些产品上，他们自己制造的产品，比购买不同的 Windows 机器并设法运行的传统方法具有明显优势。


    Dell 提供的系统安装存储库提供了确保系统运行流畅稳定的一切内容。但 Dell 如何与硬件合作以确保这一点的呢？这是我们面临的巨大挑战之一。创建一个具有足够质量的全发布产品是一项严肃事务；Dell
    与开发者紧密合作以确保一切就绪，同时也确保将更改推送到主线内核。


    虽然 Dell 选择了 Ubuntu 作为主要的支持发行版，但对于 Project Sputnik，该生态系统允许运行其他发行版。Dell 尽可能贡献用户可以运行的硬件支持，这确保了卓越的支持水平。Shuttlesworth
    亲自参与了 XPS 13 上的 Fedora 支持，尽管公平地说，如果你指望他在需要时让一切都正常工作呢？


    获取特定发行版技巧和窍门的绝佳来源是 Project Sputnik 论坛（又名：“Linux操作系统”），位于 Dell Linux-Developers-Systems/bd-p-a-613-enforums。


    > 你仍然会看到他及团队的其他成员在论坛上直接回答客户查询，以获取项目的最新新闻。Dell 云和 B''s Wiki 也是一个非常有用的信息来源。


    Project Sputnik 的未来将如何？正如你所预期的，Dell 并不愿意完全投入 Linux，但我们可以看到其中的几点。XPS 13 将继续演进并保持对
    Windows 的兼容。太棒了！这些变化将使它在那些被反复称为容易超越的竞争对手中处于市场顶端。


    Project Sputnik 将继续关注 Dell 和 Ubuntu，我们相信社区的方向是明确的。Mark Shuttlesworth 强调了桌面机器对公司的重要性，这在
    Dell 表现得很好。


    + 快速事实

    Project Sputnik 不仅仅是运行 Linux——他们获得了官方认证，对于 Ubuntu 以及在某些情况下通过红帽，Dell 提供的认证台式机和笔记本电脑比任何其他制造商都多（目前分别为
    120 台和 251 台）。


    至于 Dell 的 Project Sputnik，核心团队将利用业务内的其他资源，正如在线时间一样。公关、营销等等。特别重要的是，你应该检查论坛并回答客户查询。这其中涉及情感上和专业上的投入。论坛也是一个极佳的来源。


    www.linuxuker.com 61


