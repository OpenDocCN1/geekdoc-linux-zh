    Above Ada is a surprising language. Developed by the US Department of Defense
    in the late 1970s, it was used primarily for military applications. As one of
    the first languages requiring a great degree of security and safety, with no room
    for error, there are strong safety features like typing systems and good support
    for including the extremely strict environment. The surprising thing is that Ada
    was also built for speed. In fact, Ada seems to have more in common with languages
    like C and C++ – than it has with modern safe languages like Rust, which often
    run quickly. It is this combination of safety, such as static typing, performance
    features, and direct access to the internal memory of storage, that makes Ada
    an ideal choice for large software projects.

    We''ll give you a tour of the basic syntax of Ada programs, features in this tutorial.
    If you''d like to go a bit further, we''ve provide a small Ada program on the
    codeveric that builds the code written in this article. We recommend that you
    work through this tutorial writing the code, and then have a look at the codeveric
    if you''re interested to learn more.


