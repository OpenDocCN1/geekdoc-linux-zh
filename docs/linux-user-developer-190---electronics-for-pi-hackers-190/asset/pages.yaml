    # AND THE WINNER IS ...


    # bpython


    The main idea behind interactive shell is to shake away the vanilla Python interpreter
    that makes coding on the command line easier. It would be good to consider this
    as a replacement for an IDE; however, a good interactive shell will be better
    than an IDE for a lot of tasks.


    We don''t recommend DreamPie as it hasn''t been updated in quite a while. Although
    it requires Python 2, you can run it; this worked for on Ubuntu 17 but not on
    Fedora 2. In terms of features, there''s no beating it and overkill for an interactive
    shell.


    Then there is which will be useful to experienced beginners. Along with all its
    features, bpython has the advantage of replacing Python, which enables you to
    use interesting features such as ''magic'' functions. What we really like in Python
    is the history browser


    While this is missing from our favourite interactive Shell, bpython,


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_83_0.png)


    ```

    python

    >>> bpython

    >>> 17.1 on top of Python 3.6 /usr/bin/python3

    >>> import math

    >>> sqrt(x)

    # Return the square root of x."

    ```


    bpython has features of its own; if it sees something it doesn''t understand it
    passes to Python


    Its Ctrl-R review feature is pretty nifty as well. It is like-context-aware auto-completion
    that finds lots of options as you use. If you type type- an attribute, I''ll install
    the module that you are working with and give you the relevant list of names.
    It is worth noting the discovery for modules is a wonderful help for learners.


    We appreciate the ability to save sessions and file to Pasteln, bpython doesn''t
    require any configuration so you get started immediately. You can modify the default
    configuration later to better suit your workflow.


    Mayank Sharma


