    Vitaly Kuznetsov posted patches providing for ''Enlightened'' VMC (Virtual Machine
    Control) interfaces between Linux and Hyper-V. Microsoft uses Hyper-V to underpin
    its cloud services, which needs nested virtualisation. Recently announced support
    for nested virtualisation. In a nested virtual environment, a normal guest virtual
    instance, of the kind that you run in any public cloud, actually runs its own
    hypervisor.


    This might seem strange, but it has a number of uses. These include the obvious
    development advantages (OpenStack), tested with nested virtualisation, for examples,
