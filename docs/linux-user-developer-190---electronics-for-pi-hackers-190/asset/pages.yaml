    # ANDROID


    # ‘Linux on Galaxy’ demonstrated


    # Convergence-like tool aimed primarily at developers, for now


    The idea of turning a smartphone into a PC is not new; it''s already been seen
    in Microsoft''s Windows 10 Mobile with Continuum, Ubuntu Today''s Convergence,
    and the Inclusion of Debian in OS. But it hasn''t caught on. Realising that most
    people don''t want an actual PC in their pockets, Samsung has been busy working
    on a new approach. Locally known as ''Linux on Galaxy'', Samsung smartphones with
    octa-core processors, and a small section of users are programmers.

    Based on the ideas that developers have noted and other coding tools installed
    on their phones for sometime, Samsung has created a new Linux experience.

    "Developing for Linux on a mobile device has never been easier," the company says.
    "The full stack is now accessible using Samsung Dex - a rich desktop-like


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_7_0.png)


    Above Will developers want to code on a PC/smartphone hybrid?


    experience, complete with drag-and-drop functionality and multipizable windows.
    When paired with Linux, you can take your favourite apps and programs on the go.\nPackaged
    as an app, Linux launches when the phone is connected to a custom Dex dock. Rather
    than being a totally separate installation, Linux shares the same


    kernel at the heart of the operating system. The result is a desktop PC you can
    take and use anywhere. Most of all it''s the same apps and files are available
    within both environments. This means you might work on the train to work, and
    seamlessly continue the project in the office. It''s an exciting option, but as
    yet there is no release date.


