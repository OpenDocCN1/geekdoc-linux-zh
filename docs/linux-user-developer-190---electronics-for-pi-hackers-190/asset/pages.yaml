  md: '# Feature The Future of Project Sputnik


    # # THE FUTURE OF PROJECT SPUTNIK


    Very few companies offer machines with Linux pre-installed, yet Dell continues
    to offer its flagship laptops with Ubuntu out of the box, courtesy of Project
    Sputnik


    # KEY FEATURES


    Ubuntu

    Ubuntu 16.04 LTS is pre-installed on the XPS 13 Dell repositories included for
    fixes and updates.


    A Linux user, it''s easy to get feeling like a second-class citizen. There''s
    not a lot of choice other than going to have to buy a Windows machine and then
    ''get Linux working'' and for all support it is concerned, forget it. Frankly,
    in 2012 computer giant Dell kicked off Project


    Sputnik. An internal Dell innovation gave a small pot of team to lead the crazy
    idea and a six-month deadline to project something that would fly. With heavy
    involvement right from the off, the project proved widely popular and the XPS
    13 Developer Edition in November 2012. Just over five years later we have the


    On the road

    The latest 9370 generation of the XPS 13 is 24 percent better by volume than its
    predecessor, for travelling light.


    Pleasing keys

    Developers need a reliable keyboard and the XPS 13 is impressive, with plenty
    of travel and feel.


    Screen dream

    The 4K display option on the 9370 is bright and clear. HDR support for Linux apps
    is better than before, although the touchscreen is a bit wasted.


    Power up

    Fast storage and plenty of RAM are also a must-have; up to 16GB of memory and
    up to 1TB of fast NVME SSD on the XPS 13 delivers,


    CPU chops

    A developer edition needs raw horsepower and the XPS 13 won''t disappoint with
    a quad-core, 8th generation Core i7 processor.


