    # Switch interfacing


    The original components, of the type we''ve looked at, have leads that pass through
    holes in the board. These are much easier to use when switching circuits by hand,
    but the alternative, which is common in commercial circuits, is surface-mounting
    of components. Surface-mounted resistors, capacitors and transistors are usually
    blocks with no leads; while integrated circuits do have leads, they don''t pass
    through holes on the board. They''re hard to build by hand.


    Interfacing a push button to a GPIO pin also seems simple at first glance. We
    can imagine, for example, using a switch to control the positive supply (+5V or
    +3.3V) and the voltage to a GPIO pin configured as output. When the button is
    pressed, the positive supply would be connected to the GPIO pin and the software
    would read this as 1.


    The thing with that approach is that the GPIO pin will be undefined when the button
    isn''t pressed; that is,


