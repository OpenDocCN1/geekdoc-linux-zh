    You can design the layout later (see p28) but, in principle, designing a PCB is
    a form of CAD (computer-aided design). Use your software to design the circuit
    as a diagram, then use this information to plan the positions of the components
    along with the copper tracks that connect them to form a circuit. The output is
    a file that you can send to a PCB manufacturer.


    > QUICK TIP

    Cleaning board

    If you''re using a stripboard that you''ve had forered, the copper strips might
    be damaged, making soldering difficult. Clean the copper tracks first with a ''fine
    and dry'' sandpaper.


    Note, depending on how much you want to pay, there are several options to get
    a board manufactured. At the very minimum, you order a board which is cut to size,
    and solder the components yourself. At the next level, you can use a solder-resistant
    layer printed on the bottom, so that solder will only stick to the exposed pads.


    Finally and most expensive, you could have your component IDs screen-printed on
    the top of the board to assist you when you work.


