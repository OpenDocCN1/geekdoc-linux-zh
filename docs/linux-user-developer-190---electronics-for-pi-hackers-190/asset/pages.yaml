    Evidence seems to suggest it''s on the way


    Chrome OS is based on Linux (Gentoo, specifically), you might expect straightforward
    installation of Linux apps to be easy. Unfortunately, that''s not currently possible,
    necessitating the use of some wacky workarounds.


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_8_0.png)


    Anyone wanting to run Linux on a Chromebook has two choices: ChromeOS or Crouton
    script. The first option requires a new partition (which can be time-consuming
    to switch), while the second introduces a considerable security risk. The answer?


