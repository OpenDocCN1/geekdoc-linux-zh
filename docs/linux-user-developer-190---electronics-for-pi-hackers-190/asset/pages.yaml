    > QUICK TIP

    Simulate your circuits

    If you find yourself designing reasonably complicated circuits, simulators are
    available to help you decide before even building. See www.circuit.com for a good
    example.


    # Essential software


    Designing breadboard and PCB layouts doesn''t have to be difficult if you use
    CAD software to give you a helping hand


    > QUICK GUIDE

    Getting PCBs manufactured


    You can easily work out the layout of a breadboard, stripboard or PCB by hand.
    However, for breadboard and PCB designs in particular - especially when you''re
    moving to more complicated circuits - CAD software is recommended.


    Some electronics enthusiasts like making their own PCBs, but it''s much easier
    to get them from online suppliers. Newguider shows that 70% of people prioritize
    the number of holes, however many there are tracks on one side or whether not
    they want a wider-than-normal track is what they need and how you quantify it.
    But in particular, you can get help by asking questions online and possibly upload
    a CAD file. Smart PCBs are usually expensive but not out of reach. They help you
    ensure your circuit is correct before making it to a PCB - and indeed, find others
    who also wanted a board to get you some volume discount.


    Stripboard layouts are reasonably plentiful but most are only longer than the
    tooth, with which you strip off parts or replacements, and they are not all free.
    However, if you want to design a stripboard layout from a diagram, you could try
    VeeCAD (www.veecad.com), which has a free version available without limits. The
    full version features an odd cost $26.66 (£18). PCB design tools are available
    for a broader range of operating systems and are much more than enough if you
    want free software.


    # Do all with Fritzing


    An interesting all-in-one solution at a diagram is free and open source, Fritzing
    (fritzing.org). It is available for most common operating systems including Linux,
    and works with breadboard, stripboard and PCB designs. You can start with a breadboard
    or stripboard design, and you''ll be happy with it, as you can migrate the circuit
    to a PCB easily without needing to start from scratch. Fritzing is also supported
    by a user community, members of whom are able to share their designs on the Fritzing
    website.


    Below follows how you need to design circuits for breadboard, stripboard or PCB


    PCB CAD works normally by enabling you to define the circuit as a diagram and
    then use the software to work out the PCB layout. You can do this with Fritzing,
    or use another method, like a circuit editor of your choice. But many people find
    it''s easier to start with a circuit you''ve already prototyped and got working
    on breadboard. In breadboard view, place your components to match the image of
    your real-world circuit. As you place components on the board, connections are
    shown between them. Having components in place allows you to switch to schematic
    view to see a circuit diagram of the circuit represented by the breadboard layout.
    In particular, the initial schematic is just laid out ''not neat'' and you''ll
    have to do it again around an round to present an easy-to-read circuit.


    If you don''t want to use Fritzing, although it is a very useful tool for breadboarding,
    it''s possible to define your circuit in schematic view and then switch to breadboard
    view. All your components are editable, enabling you to draw them around and add
    paths to produce a workable design as you go. There''s no stripboard view that
    can be used as a breadboard instead, but you can use unique features to import
    your construction, such as making tracks in thicker tracks.


