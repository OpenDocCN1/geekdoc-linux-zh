    # Use Make as a task scheduler\n\nSince Make's parallel processing capabilities\
    \ are powerful, it's often used as a task scheduler in its own right. The advantages\
    \ of using make to build software is that it is easy to use and present on modern\
    \ Linux systems.\n\n# Parallel problems\n\nOne possible solution is to run each\
    \ command within a background shell:\n\nAs an example, it's common for package\
    \ managers on Linux to have lists of servers: where they pick the one that is\
    \ the fastest to download the software. Using make mirrors avoids putting the\
    \ load on a single server, so we distribute the load around the globe, serving\
    \ in different parts of the world that are closer to them.\n\n```\nwhile mirror\n\
    > do echo \"mirror,\"\n> $(curl -s m 10 w=\"$(time_total)\"\n  > /dev/null\"\n\
    \  > < mirror\n```\n\nAn obvious thing to think about is the risk to the mirrors\
    \ on the time they take to return from the current host. For a single site, we\
