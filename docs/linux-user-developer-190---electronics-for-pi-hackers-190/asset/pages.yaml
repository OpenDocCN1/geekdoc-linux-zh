    The main difference between a stripboard and a PCB is that the former is a generic
    board which can be adapted to any circuit, while a PCB is made specifically to
    implement a certain circuit. For this reason, it has holes for the components
    to pass through, but only where a particular component is to be fitted. Similarly,
    PCBs have copper tracks on the board - not just in parallel strips, but running
    as necessary to ensure that wires are connected. Additional connections aren''t
    necessary on stripboards; PCBs usually have copper tracks on the top of the board
    (the component side), and often also buried inside. For the simple circuits


