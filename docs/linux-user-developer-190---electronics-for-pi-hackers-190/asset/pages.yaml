  md: '# Tutorial Stream with a Pi


    # Stream to Twitch with a Pi


    Enable non-conventional uses for streaming with one of the most popular single-board
    computers


    On a hackathon a year ago, we decided to build a 24/7 life-streaming device. Among
    other things, we learned how to create a Twitch-streaming device from a Raspberry
    Pi - and now can you! With high-res cameras and affordable hardware and hardware-accelerated
    HD video encoding, connections to now live video-streaming blew up. People stream
    real-life events, tutorials, and the most weird things - like eating at McDonald''s
    - there are new purposes for being invented every day, and if you find a new and
    interesting subject, stream it.


    Talking of viewers, they are one important aspect of modern livestreaming; with
    Twitch, you can chat with them and respond in real time, as opposed to traditional
    one-way live streams. Even if interacting with people isn''t your goal, the chat
    still has a lot of ideas to help you. From remote-controlled robots to USB cameras,


    You, too, can grab a webcam and stream. First and foremost, you can share your
    experiences with others - be it gaming or whatever you want to talk about. However,
    you don''t have to get involved in the stream


    With a streaming platform like Twitch, you can do it this and more. There are
    also technical reasons for using a platform like Twitch such as others enable
    you to stream in a way that you yourself cannot - particularly when you are assisting
    others in a project or having a large audience of viewers. For that, they need
    to stream or re-stream your video to everybody watching.


    Compare the approach where each viewer connects to your computer to Twitch, this
    reduces your internet usage (drastically) when your stream is viewed by hundreds
    or thousands of people. As a consequence, this improves latency even though stream
    has to another server first, that can handle all the viewers better than your
    home router. Don''t forget that


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_75_0.png)


    Above you can start streaming, using just a Raspberry Pi, a USB camera and network
    connection


    # Arsenij Picugins


    Arsenij is a maker who uses Raspberry Pi extensions with Python, and currently
    works on Zero Pi-based projects.


