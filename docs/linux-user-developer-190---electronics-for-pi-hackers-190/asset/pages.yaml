    # INTERVIEW MYCROFT


    # # The open AI assistant


    After a successful crowdfunding for our open source smart speaker Mycroft returns
    with a more refined Mark II for consumers and devs.


    Mycroft is seen as the open source answer to voice-activated personal assistants
    like the Amazon Echo, Siri, Cortana and Google Assistant, when Joshua Montgomery,
    CEO of Mycroft, was looking for a voice assistant for the likes of an Amazon Echo.
    ''Certainly, it was in beta,'' says Joshua, sitting beneath a large, bold Mycroft.
    ''We wanted to find Jarvie from Iron Man into our space.''


    they had recently finished a successful crowdfunding for the Mark II – doubling
    the number of backers – and have moved pre-orders to Indegogo.


    What''s the ambition for Mycroft? We''re building an artificial intelligence that
    runs locally and interacts naturally. Our goal is to build a voice assistant whose
    user experience is so natural people forget knowing if they are talking to a human
    or a machine.


    To achieve that, what is the software that you are working on?


    We''re using TensorFlow as the platform to build the artificial intelligence or
    machine learning – certainly for the speech recognition, and language processing.
    We''re using Tensor for the word-recognition engine. We''re working with the team
    at Mozilla on speech-to-text – that''s the DeepSpeech engine (https://github.com/mozilla/deeepsech).


