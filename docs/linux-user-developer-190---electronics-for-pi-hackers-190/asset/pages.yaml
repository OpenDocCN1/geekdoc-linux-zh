    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_72_4.png)


    # Computer vision


    The project uses Google''s Inception Model neural network, it was trained on the
    CUHK-PG dataset that consists of 17,613 images obtained from a variety of online
    communities, divided into seven segments and labelled as high quality. The pre-trained
    weights were then transferred to the Pi.


    # TENS intensity


    Peter used the TNS SM 2 MF TENS unit (http://bit.ly/lybud_tens) which can turn
    up the intensity of the shock to 75mA. While power was enough for Peter to use
    the system, other people had to turn it up even further using the signal experiment
    get like like the one available through Amazon, (http://bit.ly/lyd_gel).'
