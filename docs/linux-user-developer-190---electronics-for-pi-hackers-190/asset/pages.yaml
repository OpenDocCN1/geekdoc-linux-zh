    # LED interfacing


    An LED lights when a positive voltage is connected to its anode and negative rather
    to its cathode. We can control this, connecting an LED''s cathode to the negative
    supply (0V) on the GPIO and its anode to an I/O pin configured as output.


    To determine the value of the resistor, you''ll need to look at the LED''s datasheet,
    voltage and operating current. As an example, if the supply is 5V and the LED
    is 2V, then the resistor needs to drop 3V. Now, according to Ohm''s law (V=I*R),
    if I is 20mA, we would then pick the highest standard value of 150Ω. As an example,
    you could connect the LED''s cathode to the positive supply and the GPIO pin.
    It will then be turned on by writing 1 to the I/O pin.


