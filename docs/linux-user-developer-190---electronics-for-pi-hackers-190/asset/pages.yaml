  md: '# # InspiringOS


    # ## equal medical devices


    People in the Gaza Strip are dying through lack of medical care.

    **Chris Thornett** talks to the doctor using open source to combat this


    Dr Tarek Loubani

    Tarek is a physician and assistant professor at the University of Western Ontario.
    He also has the Glia projects.


    +   **KEY INFO**

    Tarek and the Glia team https://glia.org/ develop high-quality, low-cost, open
    source medical hardware that is universally accessible.

    Recently, their work has focused on equipment to provide adequate medical care
    in the Gaza Strip.


    What inspires Dr Loubani?

    Opencode (openscod.org): "Who makes it a really hard time finding funds," says
    Tarek, "the fact that they underwrite many projects that we rely on."


    ![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_31_0.png)


    > "I see open source as my religion, says Tarek."


    Tarek Loubani was back in Gaza when we came to speak to him about Glia, where
    he started open source hardware projects focusing on high-quality, low-cost medical.

    Tarek may live and work in Canada – he is an assistant professor at the University
    of Western – but his second life is with humanitarian work as a volunteer physician
    along the Mediterranean Sea, and as part of the Palestinian territories with the
    West Bank. Gaza is densely populated with over 2.5 million Gaz Palestinians living
    in 140 square miles.

    Anyone who follows international news will know that it''s part of the region
    that is under blockade and is governed by the Islamist group Hamas, which won
    the election in 2006. So soon in June in 2007, both Egypt and Israel imposed a
    blockade – and that has prevented the flow of commercial goods into the territory.
    Although restrictions have been reduced over time, any goods that are deemed capable
    of being


    to make weapons against Israel are banned, and basic supplies such as, food and
    medicine are in short supply. This has seriously damaged Gaza''s economy and the
    welfare of its people. Regardless of the complexity of the situation – where the
    history of the conflict ranges over the years that the Gaza Strip presents a set
    of circumstances and a humanitarian crisis, recognized by the U.N. As Tarek points
    out to him, that people in Gaza are suffering in every way, and it was ultimately
    suppressed their spirit, and others, and action.

    For many days while working at Gaza''s hospital, al-Shifa, to teach other doctors,
    he discovered that they have access to textbooks, conferences and indeed other
    people who were allowed to come to the area since 2006. "It was frustrating that
    I would be testing-in-medicine in a way that I knew they could not do," says Tarek.
    They were never going to be able to listen to their patients because stethoscopes
    were not accessible. They were never able to administer'
