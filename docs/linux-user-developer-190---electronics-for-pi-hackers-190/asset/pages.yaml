    # # Stripboard and PCB


    Stripboard and printed circuit boards provide a means of building a more permanent
    circuit than breadboards


    > > QUICK TIP

    ering Before building your first stripboard or PCB circuit, learn to use a soldering
    iron and most importantly, try it out on scrap board and components before you
    don''t need them!


    > > Below: Stripboards enable you to make a more permanent circuit than a breadboard


    Breadboards are great for educational use, but for a more permanent project, there
    are better alternatives. That''s why stripboard and PCB construction


    Stripboards, often referred to by the trademark Verboard, are similar to breadboards.
    They have an array of holes on a 0.1-inch pitch which allows you to solder from
    the back that comes to be made. There are important differences, though. First,
    components aren''t grabbed when their leads are put through the holes, they have
    to be soldered into the copper


    strips. Second, the copper strips are much longer than breadboards. For this reason,
    being in stripboard and soldering is necessary to make breaks in the copper strips
    where connections are not required.


    In addition, you''ll have to make additional connections by using thin copper
    wire that runs right angles to the copper strips. In simple-to-medium complexity
    circuits, it''s usually feasible to work out the wire links, and the breaks in
    the copper strips.


    You could do this using a pencil and a graph paper, so that everything you have
    to work out before you get your head around this, software design tools will also
    be available (discussed on p26).


    Stripboard construction is suitable for circuits you want to keep when you don''t
    need to build lots of them. If you anticipate making examples of a particular
    circuit, especially if you want to make your circuit so compact and build it,
    a printed circuit board is a better solution. Printed circuit boards (PCBs) are
    used pretty much exclusively in commercial electronics. The motherboard in your
    PC is an example of a PCB. Most professional PCBs are used with surface-mounted
    components but we''re going to look at PCBs with


