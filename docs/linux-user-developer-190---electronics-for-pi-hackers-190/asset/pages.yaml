  md: "# Essential Linux\n\n# Build programs with GNU Make: unusual uses\n\nGNU Make\
    \ is such a powerful program that it can often be put to good use for purposes\
    \ other than\n\nSo far in this series, we've learned the basics of using Make\
    \ to automate builds, as well as more advanced concepts and techniques for handling\
    \ parallel projects. In this tutorial, it's time to take a different approach\
    \ to Make. We're going to show how it can be used in ways much different from\
    \ the ones we've seen before.\n\nWe'll give two case studies, starting with a\
    \ Makefile that can be used to copy files from one directory to another. We'll\
    \ then build on Make's capabilities for parallel processing,\n\nEach of these\
    \ case studies uses the full capabilities of Make; each will make full use of\
    \ one specific feature. The goal is to help you think of Make as a powerful automation\
    \ suite\n\nthat you can use in your day-to-day Linux administration and not just\
    \ for a tool for software builds. Since Make is present by default on many Linux\
    \ distributions, it provides a portable alternative to unusual uses. We hope that\
    \ after this article, you'll come up with some unusual uses of Make.\n\n# Make\
    \ as a sync utility\n\nSuppose we are building a website. The website lives on\
    \ an external server, webserver.example.net, but we want to update the website\
    \ files. If we have three files index.html style.css and script js in our local\
    \ repository, we might copy them over to the server using a command similar to\
    \ the:\n\n# Resources\n\n```\n# Makefile\nDHFLAGS=-parallel\n\nexport DEKG_BUILD_OPTIONS\
    \ = hardening=all\nDPKG_EXPORT_BUILDS = 1\ninclude /usr/share/dpkg/builddeps.mk\n\
    \ndall: $(DHFLAGS)\n\noverride_install:\n\tinstall=fail-missing\n\noverride_auto_config:\n\
    \tCONFIGURE=1 ../autogen.sh \\\n\tauto_config=$(shell \\\n\tdisable-silent-rules\
    \ \\\n-libdebexdir=/usr/lib/byte-applets \\\n-localstatedir=/var \\\n-disable-any=1\
    \ \\\n-with-cpufreq=libcpufreq\n\noverride_dh:\n\tstrip --dpkg-system=\"make-apt-build-pkg\
    \ (<= 1.28.0-1)\"\n\nget-source:\n\tuction -noconf --force-download --rename=download:current.version\
    \ --destdir==\n```\n\nAbove Make can also be used to package Debian files - see\
    \ the booklet on the opposite page"
