  md: "```\nscp index.html style.css script.js \\\nluad@webserver.example.net:/home/load/\\\
    npublic_html\n```\n\nThis works for a small website, but before long\nwe have\
    \ a large project with multiple files in\ndirectories, of all time might be taken\
    \ to copy\nthe server. It would be enough to write a script to\ncopy, but if we\
    \ make a change to one\nfile we don't have to copy the whole thing;\nwe only want\
    \ to copy the files that we have changed.\n\nThe answer to this problem is to\
    \ build a sync\nutility that tells which files have changed since\ntlast the push,\
    \ and copies only those files to\nthe server. The entire operation of Make is\
    \ made\naround modification times of files, it makes sense to use\nit a tool to\
    \ build a sync utility.\n\n# # The goal is to help you\nthink of a automation\
    \ suite that\nYou can use in your day-to-day\nLinux administration\n\nIn order\
    \ to test out, we'll use a shell script\nthat simulates the process of copying\
    \ files to the\nnYou can find this script on server.copy,sh.\nThe script asks\
    \ for a password, and if the\npassword is correct it copies the given files to\
    \ a\nserver. The password is swidth, though you can find\nit here: \n\n```\n$\
    \ index.html style.css\n$ /server.copy index.html\nPassword: swidth\nindex.html\
    \ copied to server:\nscript.js copied to server: \n```\n\nWe use one (only) auxiliary\
    \ file.push, the last\nfunction of which is the record of the last time we\npushed\
    \ to our local repository. In the time, before we\npush the changes to the server,\
    \ we run the command\ntouch last_push.\n\nWe copy the files to the server when\
    \ of\nthem have changed since the last time we did a push.\nThis suggests that\
    \ the files we want to push to the\nserver all be prerequisites for the last_push.\n\
    \n```\nFILES = *.html *.css *.js\nlast_push = $(FILES)\n```\n\nThe recipe for\
    \ last_push should contain the\ncommand touch last_push, in order to update\n\n\
    # Figure 1\n\n```\nFILES = *.html *.css *.js\nLAST_PUSH = .last_push\nSCP = ./server_copy.sh\n\
    PHONY: push\npush: $(LAST_PUSH)\n\t$(SCP $(FILES)\n\ttouch $(LAST_PUSH)\n```\n\
    \ntimestar. We should also make it responsible\nfor pushing all the files to the\
    \ server. The key to doing\nis using the automatic variable $:, which is populated\
    \ with\nthe list of all prerequisites of the current rule that are\nthan that's\
    \ rule; in this case, precisely the list of\nfiles that have been modified since\
    \ the last time\npushed to the server.\n\n```\n.last_push : $(FILES)\n/server.copy\
    \ $ \ntouch .last_push\n```\n\nThe complete make, using variables to make it\n\
    maintainainable, is using Figure 1. You can run it using\nmake sync.\n\n```\n\
    $ make push\n/server.copy index.html script.js\nPassword: swidth\nindex.html copied\
    \ to server:\nstyle.css copied to server:\ntouch .last_push\n```\n\nNow, if we\
    \ have multiple files, the one that is copied:\n\n```\n$ index.html\n$ make push\n\
    /server.copy index.html\nPassword: swidth\nindex.html copied to server:\ntouch\
    \ .last_push\n```\n\nLastly, we need to verify the value of the files\nin order\
    \ to find all the files we want to be able to copy\nacross. We can do this by\
    \ programmatically, using a\nshell function to call the utility from the shell.\n\
    The function will search through the directory and its\nsubdirectories that are\
    \ in html.css, cs or js\n\n```\nFILES = $(find . -name *.html -o -name *.css -o\
    \ -name *.js -o -name *.jpg)\n```\n\nHere, we use the function $(shell ......))\
    \ which we can now add\nother files with the same extensions and our sync utility\n\
    still be able to copy them.\n\n+   - debian/\rules files\nOne important reason\n\
    use Make\nis in software\nfor the Debian\ndistribution.\nEach Debian\nwith a Makefile\n\
    debian/\ntches several\n(PHONY) rules to\ncarry out switches\nto install the\n\
    software. We will then\nthe package by\nrunning some scripts\nthey image on the\n\
    opposite page\nfor an example\ndebian/rules.\n\n![](img/0e3dcad8b24bb8f7fe3ae3a4d499db3b_38_0.png)\n\
    \nwww.linuxuser.com 39"
