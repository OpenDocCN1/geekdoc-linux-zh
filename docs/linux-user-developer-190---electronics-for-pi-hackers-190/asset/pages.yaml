    # Create types in Ada


    Ada provides support for typing. If we wrote, for example, a word-processing program,
    we might have some integer variables that hold number of columns and some that
    hold rows of them. In Cor C++, we use typedef to tell it all these.


    ```

    typedef int number_of_rows;

    typed int number_of_columns;

    ```


    However, these definitions are nothing more than aliases for types, and they pose
    no restrictions on what we can do with them. For example, if we used the typedefs
    above, then the following code would be legal in C.


    ```

    number_of_rows := 4;

    number_of_columns := 8;

    type page_columns is array;

    ```


    Since it does not make sense to make an array of rows to a number of columns (in
    most situations), this is likely a bug. But C and C++ do not prevent the programmer
    from writing it, and not even warn that something might be wrong. But in Ada,
    we would


    ```

    type Non_Negative is new Integer 0;

    typed Number_Of_Rows is new Non_Negative;

    typed Number_Of_Columns is new Non_Negative;

    ```


    Then we create two, non-interchangeable types of Number_Of_Rows and Number_Of_Columns.
    This creates a new type, that is, it makes the existing Integer only hold integers
    between Integer and Integer, which is the largest possible value. We then create
    new copies of type.


    Go back to tutorial and add the three lines above in the lines procedure Tutorial
    is begin. Immediately, after compiling, we would notice a bug in Figure 5. Then,
    after the begin statement, add


    # Object-oriented programming in Ada


    If we want to use Ada as a replacement for C++, it''s useful to write programs
    in an object-oriented style. To large extent, this is possible in Ada using a
    package that contains variables (the equivalent of field) and functions and procedures
    (the equivalent of methods). Ada supports types, which are like C structs but
    with a type definition.


