    change the way it works?


    At basic level, the equivalent to yielding "stop" is pressing Ctrl+C. With a command
    that varies amounts of output, it is Ctrl+Z to lock the terminal and directories.
    As it spits out thousands of lines to your terminal, you can use Ctrl+C to stop
    mid flow. It''s finished; there''s nothing more than you can do. This is highly
    important when you''ve just entered


    something crazy, and you need to stop it before anything damage.


    There''s an alternative to this, however. What if you want to manage the program''s
    execution for later? Say, you''ve just entered man gcc to read the manual for
    the GNU C compiler. You''ve scrolled around and found an interesting point in
    the documentation so you want to check some other things. Press Ctrl+Z and the
    manual page viewer will disappear into the background, putting you back at the
    prompt. You can then use (fg) to bring it back to the foreground, exactly where
    you left it.


    It''s possible to start a program in this mode (suspended), so that you can switch
