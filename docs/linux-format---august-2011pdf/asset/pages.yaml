    The Debian philosophy is not about lot of things, it makes some choices. Although
    there are great and well-supported versions of LXDE, Gnome and KDE. The desktop
    environment is currently Gnome 2. This ship has a Debian touch, but to be honest
    Debian touch is quite light compared to others, so it is much the Gnome experience
    you are signing up for.


    The Debian also doesnt include the of the feature you might expect of the latest
    Debian Debian isnt on providing its own configuration tools. to far, the standard
    desktops handle a lot of themselves. You can easily install a completely different
    environment or window manager with a high expectation of working without too much
    trouble.


    ![](img/ed47dae754beafdc9a78858630fb76b4_41_1.png)


    # Fedora


    The default desktop for Fedora is Gnome 3 or the Gnome Shell. This is a major
