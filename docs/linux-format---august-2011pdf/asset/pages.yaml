    What follows is crash course on Gnome 3''s new capabilities, explaining the basics
    of CSS and how to apply them to GTK 3 and Gnome Shell.


    # Like your style


    Using Style Sheets, the method for adding style, such as fonts, colours and element
    positioning to structure documents and interfaces. It is most widely used on the
    web, but the developers of Gnome 3 used it for its GTK 3 and Gnome Shell themes.


    The style sheet you create is composed of a series of rules; each of which contains
    a ''selector'' and a ''declaration'':


    The declaration block lists the properties and values you want to set, for example,
    Notice color. Notice how the property and value are separated by a colon and how
    all declarations are contained within curly blocks.


    The selector specifies which element or group of the block apply to, a Gtkwidget
    or HTML, for example. A Gtkwidget can be generated by generic type (GtkComboBox),
    or by a class and group of widgets (widget), which allows you to check boxes,
    radio buttons, toggle buttons and standards.


    A simple rule, then, would look like this:


    ```

    padding: #ffffff;

    ```


    There are a few other types of syntax that can be used in CSS, along with many
    ways of combining them together to cater for complex expressions, but the details
