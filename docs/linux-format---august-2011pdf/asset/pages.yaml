  md: '# Dr Brown''s Administeria


    # Give your machine a rest


    PowerNap a new version of the ''screensaver'' is introduced in Ubuntu 11.04 -
    take a look at it and see if you can save yourself some money.


    When your computer doesn''t have anything useful to do, you can save power in
    several ways: turn it completely off or sleep modes, or by having a faster restart
    than a cold boot. PowerNap developed by Dmitry Knight Rodriguez is now present
    in Ubuntu, and can be used for repositories for other Ubuntu. It acts as a ''screensaver''
    for power consumption without system activity to keep your monitor ready.


    It works like a daemon powernap wakes up at regular intervals (a second) and runs
    a number of tests to detect any consumption activity. If no monitors report activity
    for a certain time (five minutes, by default, all these parameters can be adjusted
    in the config file) the daemon then reduces consumption.


    There are four configurations: hibernate, suspend, and powersave. At one end of
    the spectrum, powersave uses zero power but requires a full reboot to get going
    again. At the other end, the power button, or a Wake-on-LAN (WOL) packet from
    your interface, network or software triggers it. Hibernate shuts down to a near-zero
    power mode, but only needs a packet to wake up.


    Most of the level of detail entering hibernate, sleep or powersave mode is handled
    by an underlying set of command-line tools that are part of the system. These
    tools are named like pm-hibernate and pm-powersave, and they do pretty what they
    say on it. PowerNap manages the complex stuff. The scripts are found in /etc/powernap/
    which do the following:


    +   - Shut down idle CPU cores except 0

    - Reduce the CPU frequency

    - Reduce GB ethernet down to 100 Mbps

    - Suspend the bus


    The scripts run when the (general alarm) false to restore


    # Xpath queries explained


    | MONITOR | WHAT IT DOES |

    |---|---|

    | Monitor | Lists for WOL LAN packets |

    | Console | Monitors console (activity), also a local keyboard and mouse Monitors
    the process for matching regular expressions |

    | Load | Monitors load for activity by a set of TCP ports Lists for activity by
    a set of UDP ports |

    | Input | Monitors I/O activity by a set of processes Lists for USB device input
    (keyboard and mouse) |


    their effects when the PowerNap daemon notices a resumption of system activity.
    The pm-utils package is present in Fedora and elsewhere, right now the PowerNap
    tool is only found in Ubuntu.


    PowerNap defines several monitors, eight are on the way including a disk monitor.
    They are enabled, disabled, and configured by parameters in /etc/powernap/config.
    This is also possible to specify the polling interval, for which the system must
    be checked before taking a power nap, and other times. The monitor list and recommended
    samples may require the package ship with a few configuration files for common
    use cases?


    Administrators can manually enable and end power naps on their monitors using
    powernap-daemon and powernapnow. There''s also a config file that can be used
    to send WOL packets to the network.


    > PowerNap provides the logic that controls a system activity monitor and a set
    of power management tools.


