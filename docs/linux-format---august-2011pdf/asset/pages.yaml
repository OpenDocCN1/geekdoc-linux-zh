  md: '# Dr Brown''s Administeria


    # Getting to grips with Grub


    Grub 2 is the unsure hero of the Linux kernel and the bootloader that underwent
    a complete makeover. An old friend.


    We have programs running every day—Firefox, perhaps, or Eclipse.IDE. And we don''t
    think about our code much, like the Linux kernel itself, or the bootloader. Grub''s
    that is responsible for loading the Linux kernel into our system usually. This
    task is rapid and without user intervention, and it''s easy to forget. We take
    a look at how it works, and how we can interact with it, if needed.


    Grub stands for Grand Boot Loader and there are two versions in use. Version 0.97
    was just Grub to start, but now it is no longer development; the 0.97 release
    was in 2005. Version 1.0 (or maybe 1.9) is currently stable.


    The later version has been around since 2007, and it''s the bootloader in Ubuntu
    for the past few releases. It hasn''t been adopted everywhere (RHEL 6 still uses
    Grub), so for many people, Grub 1.9 is enough. It''s four years old. Grub 2 still
    has a "bleeding edge" for some folks. Grub 2 actually began in a project called
    PUPA (Preliminary University Architecture—an initiative which seemed to point
    out that if Legacy became PUPA, it should really have nothing to do with not,
    Grub 2.


    # The big picture


    As your PC starts, the first thing that runs is the BIOS, which is in read-only
    memory. Assuming the PC is booting from the hard drive, the BIOS loads the Master
    Boot Record (MBR)—the first sector on the hard drive. A small program placed in
    the MBR is used by Grub to load a Grub module—the core file is then found.


    There isn''t enough space in the MBR to contain a program that can interpret a
    Linux file system, so the MBR has embedded within it the physical blocks where
    the kernel resides.


    The reality is Grub finds the Linux kernel image and the init image within the
    system hard drive. We then load them into memory, and transfer control to the
    kernel. Typically, /boot/grub/grub.cfg defines a number of entries in the boot
    menu. If there''s only one entry, then a second option to start in safe mode-


    Normally, you can interact with Grub—if you want to at all—through its menu-line
    interpreter. But Grub also allows you to, at first, get a Grub prompt from the
    boot menu. (Depending on how Grub is configured you may have to press Esc at the
    boot menu. Alternatively, Grub will use its command line mode if it doesn''t find
    a configuration file. Though you rough enough to find your grub.cfg in part)


    ![](img/ed47dae754beafdc9a78858630fb76b4_63_0.png)


    Grub image version 1.97-13-ubuntu


    grub "duntu", with linux 2.6.0-8-generic


    ```

    set kernel=/vmlinuz-2.6.0-8-generic

    set root=(hd0,0)

    set initrd=/initrd-2.6.0-8-generic

    kernel $kernel root=$root ro quiet splash

    initrd $initrd

    ```


    GNU Menu editing editing is not supported. To list combinations, press c. To exit
    the menu editor and return to Grub


    +   - Grub allows you to edit the commands in Grub before you start the system.


    From the grub-prompt, the interpreter offers some 150 commands to use. The following:


    ```

    grub-set prompt=1

    gub-help

    list all, a command at a time. To get help

    (help) the search command,

    grub-help

    ```


    Using just a few built-line commands we can manually request Grub to load a Linux
    kernel image and start executing something like this:


    ```

    1. grub edit root

    2. set root=(hd0,0)

    3. set kernel=/vmlinuz-2.6.0-8-generic root=/dev/sda1

    4. insert initrd=/initrd-2.6.0-8-generic

    5. boot

    ```


    # The initial ram disk


    Grub is also responsible for loading the initial ram disk image, a file system
    containing the loaded kernel modules and other bits that the kernel needs during
    the various stages of boot, up to the point where it is able to mount the root
    partition. The file is a compressed archive. You can use edit commands to specify
    the appropriate name on the second line:


    ```

    cd /boot

    load /boot/initrd.img.grub

    gub menu

    nncipio -k init

    ```


    You might be surprised by how much stuff is in there.


    64 LXF147 August 2011 | www.linuxformat.com'
