  md: '# Distro Showdown


    # Security


    Reassuringly, it''s pretty much a level playing field.


    There is good news and bad news on the security front. The good news is, as far
    as really important packages go, all the distros are prompt and update as soon
    as the offending code has been patched at source.

    The bad news is that this makes it very difficult for us


    determine which is the most secure (at least in terms of updated software).


    As an example we looked at recent security alerts Asterisk, and just to prove
    we got to the end of the alphabet, sphinx.


    For the most part, all the vulnerabilities we looked at on the same day - many
    because quite often the packages for various distros are closely connected with
    the developers of the original software. Due to its rolling release, Arch has
    updated before others were found in the old version - not that it makes it more
    secure, just because some vulnerabilities haven''t yet been found.


    The situation is entirely different for minor security issues in less mainstream
