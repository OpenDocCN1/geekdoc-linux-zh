    # The bottom line...


    In LX4 I described PowerNap as ''underwhelming'' and since then I have had a back-evaluation
    of efficiency gains. Using PowerNap, Durant reports power savings of 12W on a
    quad-core 1 rack server. Using a ball-park price of £10 for electricity, if you
    had two servers you''ve saved £420. You could buy four subscriptions for Linux
    Format for that! I''m still not overwhelmed, but more than I wanted.


