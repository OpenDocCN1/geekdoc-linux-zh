    of times and is now in its 16th season. Produced by JupiterBroad, available in
    OGG and MP3 formats audio quality at different resolutions for different devices.
    Duration varies anywhere from 40 to 75 minutes and shows are hosted by Bryn Liverpool,
    Software Creator, and Chris Fisher, founder of Jupiter Broadcasting.


    The show is normally broadcast from their studio but while we were compiling this
    roundup the hosts were at LinuxFest (LFNW) where they invited the host of FLOSS
    Weekly, Richard Schwartz, to discuss the news. This was followed by an interview
    with Alan Clark from OpenSUSE and Linux Foundation.


    In the next edition of roundup they discuss Ubuntu 11.04''s interface. For balance,
    they invited Jono Bonaco on Ubuntu''s unperfects audio quality isn''t top notch.
    This is the first podcast ever recorded in a controlled environment, which is
    why quality isn''t generally an issue, although words and pictures are somewhat
    out of sync.


    # Distinctive jingle


    After the distinctive opening jingle, the hosts introduce an Android and desktop
