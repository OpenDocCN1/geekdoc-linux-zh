    # Alpha... beta...


    The project makes two preview releases (alpha and beta), both of which are feature
    complete and distributed as ISOs or live CDs. More specialists are employed for
    creating these, called Pungi and Live CD Creator respectively, and before a meeting
    is held between the three main engineering teams to ensure that a standard is
    met.


    Once again, the idea of these releases is to solicit further feedback from many
    people as possible, in order to create a final product that is stable and full
    of the latest developments from the previous six months. They are particularly
    useful as they provide a common platform which the QA team can build their tests.
    These are real community events, when developers themselves are available in Internet
    Chat (IRC) to walk users through a series of tests. Each test day on a specific
    feature or other component, helping to generate general feedback.


    This gives Fedora the opportunity to get its new features tested and work on an
    array of hardware as possible, and also presents a world of opportunity for less
    experienced users to help with the distribution of in a meaningful way. All that''s
    needed is a copy of the most recent release and IRC, then the developers can talk
    you through the rest.


    Integration might be considered one of the greatest challenges of these releases
    - distributing globally around the world - is one of the simplest parts of the
    operation.


    Engineers must check all the packages included in the version of the repository
    that successfully compiled into the metadata, and then set the permissions on
    location so that it''s not accessible by the public.


    They then allow access to their mirror partners, who can manage a clone of the
    mirror repository. This means rather than users using it to swap a central server,
    hundreds of locations around the world are available for download from mirrors.


    There is no magic involved either, as the mirrors use rinse to create their copies
    of the main Fedora release.


