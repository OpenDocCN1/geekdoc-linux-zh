  md: '# # Going Linux


    Going once... going twice...!


    A podcast for newsbies? Sounds like a gimmick, right? We were skeptical too, but
    amazement is for free. Instead of the regular news-run, Going Linux caters to
    anyone interested thinking about Linux, and the hosts take the time to get into
    the background of every news story.


    Unity and Gnome 3, comparing them with KDE 4, and explaining their desktop environments
    to Windows and Mac users.


    We also liked the fact that when Audible.com comes as sponsors, the hosts mentioned
    that the service doesn''t have a Linux client and asked listeners to write to
    the company asking for one. A part of the show is dedicated helping users get
    things done with Linux apps, by providing useful tutorials and answering questions.


    Depending on your experience you might not want to listen to every episode, but
    check out the timestamp to see if they discuss an app that interests you.


    ![](img/ed47dae754beafdc9a78858630fb76b4_31_0.png)


    # ## Three for one


    The show is about 60 minutes in MP3 and OGG formats. It''s bi-monthly, but host
    Larry Bushey is on Computer America every month to talk about Linux, so you get
    effectively three episodes.


    > The website also has a bunch of evergreen screenshots for new Linux users.


    ![](img/ed47dae754beafdc9a78858630fb76b4_31_1.png)


    Going Linux

    Web: www.goinglinux.com


    > The hosts take time to go into the background of every news story.


    Rating 7/10


    # ## Linux Basement


    It never reviews unless less month, like Ubuntu 11.04, has been. They shared their
    impressions on Natty after playing with the distro, but on Computer America, episode
    1358, Larry gave a wonderful introduction to


    (SELF), they did a job of reviewing Ubuntu Natty Marshall.


    The podcast is available in MP3 and OGG formats, with clear audio in most episodes,
    although there were occasional audio glitches in the most recent episode.


    ![](img/ed47dae754beafdc9a78858630fb76b4_31_2.png)


    He latest episode of podcast is appropriately titled ''Not Dead''. They put out
    a couple of episodes, but then months between the two. Still, despite its irregularity,
    this is one of the better podcasts out.


    # ## Simple format


    The Linux Basement shows a simple format, featuring discussions on important topics
    followed by the odd review. The show also occasional guests and its notes are
    a bunch of links to the discussed in the episode.


    Each episode is 70 and 90 minutes long, which is just right for a podcast.


    > You might find faults with this podcast, but we''re pretty to two-man shows.


    ![](img/ed47dae754beafdc9a78858630fb76b4_31_3.png)


