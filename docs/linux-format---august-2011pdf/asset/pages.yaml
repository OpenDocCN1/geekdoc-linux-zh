    # File links


    linux makes the use of file links, many symbolic (or soft links). A file link
    is a way of having the same file (or directory) appear in two places, or under
    different names. You can simply copy the link instead of the file, and if the
    original is updated, the link is also updated as well.


    Linux filesystems have many ways of accessing the file or directory from a name.
    There are two types of: hard and symbolic. Technically, every file is a hard link
    – from the file''s name to the data that holds it, containing referring to hard;
    we mean extra links to a file that has more than one name. Hard links have some
    limitations, they typically only apply to files, not directories, and all links
    must be on the same filesystem.


