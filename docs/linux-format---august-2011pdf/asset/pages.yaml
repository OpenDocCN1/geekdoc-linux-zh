    # Speeding up the system


    The trend over years in photography software has been towards a single interface
    for everything and this is essentially what programs like Lightroom or Aperture
    do.


    These both have similar interfaces, based on a little-improved version of software
    called RAWPhoto Lightroom. On the left there is a browser, and on the right a
    toolbar with adjustment parameters for developing RAW files. In the center is
    the list table: a panel that can control everything (thumbnail, image, or library)
    - or for full screen preview or viewing. Like Lightroom, these are open on one
    screen, speeding up your workflow.

    nThe trick to making this sort of program fast is to be very efficient on memory
    usage. Plus, this is critical, as well as aligning picture while adjustments,
    the latest versions of these also include tools for editing layers and spot files.
    In fact, up to 80% of users go straight to the printers without even touching
    a Photoshop-like program.


    There are many tools which look like Lightroom, Aperture and but are open source,
    however. Darktable (darksource.org) and Rawtable are powerful tools which give
    you an enormous amount of control. Both can be built from source or available
    as PRX, and can correct barrel distortion and chromatic aberrations, using the
    Lens libraries (lens.berlio.io).


    > Rawtable is fast if all you want to develop your shots, but you''ll need a separate
    editor to finish them off.


    You might have thought: Rawtable is fast and efficient, but it''s built-in from
    mobile and you can''t compare images side-by-side. You have little control over
    how critical things like sharpening are, so you''ll need to export a TIFF to a
    separate editor for this. On the other hand, it has an enormous amount of options
    and plugins, but it needs a lot of setting up. It also lacks features for quickly
    clicking ''looks'': Having a suite of ''one click'' for basic adjustments is a
    vital tool for a professional''s work.

    With is the most powerful of the open source editors, Rawtable (rawtable.org).
    There is a stable version of Rawtable2 that has gone up with a third repository,
    but then the team has gone independent, and we recommend importing from the PPA
    or compiling from source.

    As stands, Rawtable is as close to the goal of Bibble in the open source world,
    and it''s really very good. Not only does it have all the great light table features
    you''d expect, but it also supports controls through its processing engine, multiple
    monitors


    # Calibrating your monitor


    Every monitor has its own properties when it comes to creating colours on screen.
    What''s on one display may be one on another, and will look different even when
    preset.


    Imaging professionals calibrate their monitors in order to compensate for these
    differences, but it has long been regarded as hard to do in Linux.


    ![](img/ed47dae754beafdc9a78858630fb76b4_83_1.png)


    ![](img/ed47dae754beafdc9a78858630fb76b4_83_2.png)


    ![](img/ed47dae754beafdc9a78858630fb76b4_83_3.png)


    +   If you have enough controls on monitor, you can use the excellent calibration
    guide at www.lagom.org to adjust the settings to get close enough to the sRGB
    standard colour space for most.


    +   There are better ways to profile all your gear. Lprof (lprof.sourceforge.net)
    calibrates all it using kit colour references. These are saved in standard ICC
    formats and need to be loaded into every piece of software in your workflow.


    +   Slightly easier to use Lprof for the Gnome Color Manager (live.gnome.org/GnomeColorManager).
    This is a graphical tool-open source project which creates drivers for hardware
    calibration tools like the Datacolor Spyder.


