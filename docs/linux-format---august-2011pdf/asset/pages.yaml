  md: '# Dr Brown''s Administeria


    # # Dr Brown''s Administeria


    ![](img/ed47dae754beafdc9a78858630fb76b4_61_0.png)


    Chris Brown

    The Doctor provides Linux training, authoring and consultancy. He finds his PhD
    in physics to be no much of work at all.


    Esoteric system administration governs the impenetrable bowels of the server room.


    # In praise of spherical software


    Why are soap bubbles spherical? Because the tension in the soap film wants to
    minimise the surface area, and for a given volume, spheres have the smallest.
    We can apply the concepts of volume and surface area to software to define the
    value of how much it can contain. Actually, the surface area is what we need to
    know about to make it work.


    ![](img/ed47dae754beafdc9a78858630fb76b4_61_1.png)


    # Ready for anything


    BoxGrister Scratch-build virtual images based on Fedora, Red Hat or CentOS.


    A modern digital camera is an example of a device with small interface. It offers
    ''point and click'' experience. How much do you need to know to take a good photo?
    How many steps must you perform? Yet with fancy auto-exposure, auto-image and
    image stabilisation still going on.


    # BoxGrister vs VMBuilder


    When building images that ''appliances'' are ready to be deployed (in) EC2 cloud,
    you''ll get off with a generic image, instantiate it, then SSH into it and pack
    the packages you need. 15 minutes is enough to build and deploy images based on
    Fedora, RHEL or CentOS. Amazon Mars and EC2 allow you to import into the local
    file system, or export to Amazon Machine Image.


    Broadly, BoxGrister performs the same job as Canonica, with the obvious difference
    that BoxGrister builds images based on Red Hat, whereas VMBuilder doesn''t use
    a separate application definition and takes a shell-based command line parameters
    to define the machine and its contents.


    # Think small


    Smartphones have a bigger surface area. How much do you need to know to take a
