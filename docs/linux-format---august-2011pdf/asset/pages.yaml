  md: '# Break Linux


    # Wipe /home


    This won''t break Linux, but you will lose all of your settings and any personal
    files stored in there. There''s why it is a good idea to keep /home on a separate
    partition, so you can install and upgrade without messing up your settings and
    data.


    ![](img/ed47dae754beafdc9a78858630fb76b4_54_0.png)


    # Lose password


    Losing your password stops you doing anything, unless your account logs in. Losing
    your good password means you can use the computer, but cannot install or update
    software, or make any other changes. Losing the password for an encrypted filesystem
    means you may go back to pencil and paper.


    +   If a package is not available for your distro, resist the temptation to shoehorn
    it from somewhere else you''ll get hurt.


    # Install a new kernel


    Something comes at, a new kernel should be better and more secure. But some devices
    rely on modules that are not installed with the kernel, especially graphics cards
    and working network. Distros will reinstall them automatically, otherwise you
    might need to use a weird workaround with your old kernel, and reinstall the drivers
    for doesn''t work.


    # Disable swap


    You may think that with a minimum of 2-4GB fitted to laptops these days, swap
    is anachronism, but some devices expect some of memory mapped out. Even if you
    don''t need it, it is possible to inevitably use lots of memory quickly, so having
    swap available is still a good idea, after all disk space is more precious than
    ever.


    # Try to use uspace


    If you''ve ever bitten by the kernel of the Linux systems, you''ll know exactly
    how it feels. Otherwise, why not keep working until you hit it miserably. Please
    can we have a clear, stable, understandable system for Linux, preferably with
    less layers than an onion?


    # Install from source


    If you want the latest version of obscure (or just brand new), programs installing
    from source is the only option. While this is usually fine, you could end up with
    different versions of the library in your /usr/lib and /local/lib, with effects
    that are best described "interesting".


    # Install packages from another distro


    Sometimes your distro doesn''t have the package you want, but another does. It''s
    better to install it and risk the instability. May you get away with the odd Debian
    package on Ubuntu, but sooner or later (and it''s far more likely to be when RPM
    packages are installed) you will hurt.


    # Lose it


    Linux is more convenient, more powerful, and easier to lose. As tempting as it
    is to store all the details of your life on an ebook, or a smartphone, it contains
    the consequences of a loss (or "lost") day of data. Event or event won''t actually
    break the device, But its new "owner" will have full access to it and your data,
    so be safe.


    # Run a fork bomb


    A fork bomb is a simple shell script that rapidly creates many processes until
    it can crash the computer to a halt and the only solution is to reboot. Most systems
    are set up to prevent this by limiting the number of processes a single user,
    even if you run it.


    # Treat it like Windows


    Linux and Windows both develop operating systems with a superficial similarity.
    But they are completely different. Treating a Linux system like one of the most
    common mistakes of being among new users. If you are new to Linux, no matter how
    much experience you have done, dont be afraid to ask for advice.


    ```

    # /bomb

    :(){ ::& };

    ```


    # Reinstall it


    The preferred "solution" to many Linux problems is to reinstall. Do this on Linux
    and you achieve the loss of your settings and configured setup but discovery is
    as good as – solution to the problem. Reinstalling packages rarely help either,
    since such an action doesn''t touch anything in your home directory, the most
    likely source of the problem.


    # Spoil coffee it


    It is literally that a system so suited for the hard programmer can be rendered
    useless when it comes in contact with essential programming fuel. Coffee and pizzas
    do well together, although hardcore Linux users probably won''t miss the miss
    as much as the pizza. RS'
