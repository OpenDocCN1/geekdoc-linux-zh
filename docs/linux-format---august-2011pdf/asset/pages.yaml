  md: '# How do I...?


    If you''re not new to Linux, after installing Fedora you may be unsure how to
    do tasks. There''s a list of the most common jobs and how to get them done...


    +   * Browse the web with Activities and the globe icon on the left panel for
    Firefox, the world''s most popular browser, supported by hundreds of extensions.


    +   * Manipulate your files Click the file icon in the dock to Access your personal
    documents.


    +   * Play music and videos in Activities > Applications > Sound & you''ll find
    a selection of music and video players.


    +   * Edit images by Activities > Applications > Graphics > GNOME Image Map to
    start a very versatile app that shares many features with Adobe Photoshop.


    +   * Chat online in the category you''ll find Empathy a brilliant online messenger
    which supports all popular protocols such as MS, Skype and Google Chat.


    +   * Configure system Click your username in the top-right and hold Settings
    for a selection of preferences and configuration utilities.


    +   * Get new software In Fedora, go to Applications > System Tools > Add/Remove
    to get more apps from the internet.


    +   * Shut down Click your username in the top right to bring up the menu, and
    Press Alt to Suspend Power Off.


    If you need help with Fedora, the distro''s excellent website at fedora.org. You''ll
    find links at the top of the page for interacting with the community and getting
    help. There''s a list of the top questions by new Fedora users, and you can search
    for the documentation.


    If you have a specific question about the distro, which case over to fedoradar.org
    - it is great


