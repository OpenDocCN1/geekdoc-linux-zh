    # Linux distribution


    # Fedora 15


    Fedora often leads the pack when it comes to implementing technologies, and it''s
    not the first distro to incorporate Gnome 3, it''s the first of the major players.
    If you''re new to the world, Fedora is a powerful, comprehensive Linux for desktops,
    development works, and with thousands of programs available. It sports cutting-edge
    Linux technology and is backed by a friendly and busy community, with Red at the
    head.


    The most notable features in this release are the enhancements to Gnome 3 (with
    Gnome Shell).


    system providing the boot sequence, dynamic firewall (so that changes can be made
    in place, without restarts) better power management with PowerTop, and LibreOffice
    it''s a back release with many new features to explore - but early reports on
    the internet suggest it seems reliable.


    In this month''s double-sided DVD we''ve included the complete, full-system image
    (3.5GB). This includes packages, providing everything you could need - whether
    you''re installing a desktop or server administrator interface. If your current
    distro is looking something long in the tooth, this is a great opportunity to
    get all the latest Linux giveaways.


    ![](img/ed47dae754beafdc9a78858630fb76b4_111_0.png)


    Access system settings and the machine (or Alt+Shift to shut down) via the top-right
    menu.


    Workstation session now. If that''s the case, the Fedora installer can shrink
    your disk to make room. This is fairly-safe, but with any serious hard drive operation,
    we recommend backing up your important data beforehand.


    If you want to do this partitioning scheme manually you can. You''ll choose to
    keep up your disk partitions on the existing OSes if you have them, but we recommend
    allocating at least 10GB root (a partition in ext4 format), and a swap partition
    about the size of your RAM (but no more than 2GB). You can use the /home directory
    on a separate partition and it helps to keep different software versions that
    might get confused with older/newer versions of configuration.


    ![](img/ed47dae754beafdc9a78858630fb76b4_111_1.png)


    All this new comes to us in plenty, and there''s many requirements. Fedora 15
