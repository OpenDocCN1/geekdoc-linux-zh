  md: '# Tim Waymans


    ![](img/ed47dae754beafdc9a78858630fb76b4_48_0.png)


    Tim Waymans gets his hands dirty building support for codecs, and non-linear editing.
    We talked to him about Gstreamer and Linux''s multimedia.


    LXP: What are Gstreamer''s main features?


    TW: We have been experimental quite a bit. None of us really knows what the perfect
    framework looks like until we spend a month or two trying it out.


    LXP: How did you get involved in open source?


    TW: It was back in 1994 when I installed a version of Red Hat on my Amiga. I finally
    found it in a 486 PC but But I had Windows 95 for maybe two days before I wiped
    it and installed Red Linux Premiere. I never looked back.


    It was really after a bunch of us Gstreamer hackers were employed by Fluendo in
    2004 that we could take development to the next level. A major redesign in the
    (still current) version 0.10 and later took a lot of time.


    I believe Gstreamer is now on par with many video players playing simple basic
    capabilities, and surpasses with advanced features such as playback and track
    tricks. We also noticed that we became one of the best RTP stacks, which is the
    central component in VoIP and video conferencing.


    LXP: What uses Gstreamer?


    TW: If you are a typical user of a Linux desktop then you will find all the applications
    that use Gstreamer. Most users such as Rhythmbox and Banshee, video players like
    Application camera, video editor, the RTP plugin, and many more. Gstreamer is
    not a complete application but an end-to-use API which makes it easier to make
    integrated desktop applications.


    I started with the video trio editor. The project of multimedia was particularly
    back then - we was about the most sophisticated media player available. And free
    some implementations of codecs didn''t exist at then.


    I also used codecs as the main video format for Trinity and it became that we
    really wanted some sort of multimedia to build our video editor on top. That''s
    when I got involved.


    LXP: With Gstreamer.


    How did Gstreamer started?


    TW: In 1999 Erik Waldhausen released the first Gstreamer. I was using it as the
    first multimedia engine so I started contributing a lot of code and managing parts
    of the core.


    We started a mailing list, opened an IRC channel and created a website. We hosted
    Gstreamer and mailing lists on their brand new SourceForge infrastructure and
    felt a number of people interacting with our technologies.


    LXP: How did other Gstreamer joined Colabora?


    TW: After the 0.10 How did that happen?


    We started a Gstreamer consulting business. We were released that we could try
    testing it out. Then we met with Colabora founders Martin and Philippe Lagrange
    who provided us with help and the use of their infrastructure. We finally met
    in May last year and are now all part of Colabora Limited.


    LXP: What were your original goals?


    TW: The goal was simple: world domination. Seriously, though, that we started
    at the same time as we used X, Mplayer and VLC. Writing a media player was the
    thing to do and to have the most missing piece of the Linux desktop today. As
    a multimedia framework, we wanted to include encoding, streaming over Internet
    Protocol (VoIP) and video editing.


    LXP: What does Colabora do in Gstreamer today?


    TW: We are currently working on version 0.11, and that will hopefully have a 1.0
    version next year. We have been saying for the past six years the next step is
    to complete the accelerated API and make some small improvements.


    It''s also important for us to improve Gstreamer for new needs as 3d and even
    more video players, provide more support for hardware acceleration in GPU, or
    on DSP and embedded devices, and create more opportunities for optimised speed.


    # ONH-GLX


    > Meeting John Carmack (Quake) was my most encounter with the rock stars of programming.


    ![](img/ed47dae754beafdc9a78858630fb76b4_48_1.png)


    LXP: How can you contribute to Gstreamer?


    TW: The main website (gstreamer.freedesktop.org) is where you can find out the
    really main Core and Plugin writer to get an idea of how things work and then
    find a kind of thing that you would like to implement/fix. We have many tasks
    available in bugs, for example.


    We also have an IRC if you want to start writing something or know how things
    work in more detail. Join out irc.freedesktop.org #gstreamer and talk to us. It''s
    a good idea to join people also make a bug report and provide a path to implement
    some problem or feature.


    Tim and his Colabora colleagues are working on version 0.11.'
