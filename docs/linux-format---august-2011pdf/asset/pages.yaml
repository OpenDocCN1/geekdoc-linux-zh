  md: '# Package management


    As was there ever an issue so thorny?


    The first thing you should know about package management is that nobody really
    agrees on how to do it. Once upon a time, the whole debate about Deb (Debian''s
    package format) versus RPM (Red Hat''s package management system) was as contentious
    as KDE versus Gnome, especially when the Linux Standards Based on RPM became the
    format of choice.


    Arch is the odd out in this section because it uses its own packages and command-line
    tool to manage them. Similar to Slackware, these packages are usually built from
    source, but this simplicity belies the power of the system as it is so easy to
    add your own packages (which require exist without messing up the dependency system).
    You have to pay attention to detail, as many packages require complex configuration
    to work.


    Both Fedora and OPENSE use RPM. Package management in OPENSE is through Zypper,
    which does the same and works from the command line just like others.


    Fedora has a more complex approach to packages. Although it relies on RPMs and
    you can use the RPM tools, that does not mean things are up to you. The tool for
    installing packages, which tracks dependencies, handles dependencies and options
    deples packages to reduce time for updates. In the past it has (fairly) been criticised
    for a lack of speed, which has not been a problem, but it does work well. Unfortunately,
    RPM is not such a standard that one designed for SUSE will work well on Fedora,
    and vice versa.


    ![](img/ed47dae754beafdc9a78858630fb76b4_44_0.png)


    +   - RPM may have a long and venerable history, but Debian has more packages.


    ![](img/ed47dae754beafdc9a78858630fb76b4_44_1.png)


    ![](img/ed47dae754beafdc9a78858630fb76b4_44_2.png)


    ![](img/ed47dae754beafdc9a78858630fb76b4_44_3.png)


    All the other distros use Debian. With a simple but powerful tool and a choice
    of graphical front, this seems to meet most needs, and the wealth of packages
    is amazing. Thanks to the popularity of Ubuntu these days, it is quite that way.


    Kudos goes to Linux Mint which helps users find them if they don''t really need
    them. Will you have to jump through hoops to install software that hasn''t been
    thought of?


