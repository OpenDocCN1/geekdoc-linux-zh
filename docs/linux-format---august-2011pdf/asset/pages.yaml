    What''s the best to administer servers?


    # Answers


    I''m looking for the best Linux Server to play with domain users and groups, sharing
    file, etc. I''ve travelled through dsearch.com/Category-Server, but I''m not the
    wiser for it because I''m familiar with Windows Server 2008 at work and want to
    play at home on a Linux server.


    The first step is IP Access Control in the Webmin section. Set a list of IP addresses
    that are allowed, so you can log in from computer but no one else. You can now
    choose the options for encryption. Most will be covered by the Samba section,
    which also handles Windows file sharing and services. Once Webmin is working,
    you can go to any of the other sections and get your project configuration in
    place to start now.


    install that separately. The distro''s text-based installer may look odd but it
    does the same job, reboot and log in as the user you created during installation.
    Then install eBox: apt-get install ebox. If you want to change the port used during
    installation, the default is 443, which is the standard for HTTPS. If you want
    to try running it behind a web server, your server needs to be connected to exposed
    on port 443 - you can also change this in the Webmin interface.


    Rob Freeman


    Servers and GUIs don''t really go together. A server in the background, well stuff,
    so you don''t need a desktop. Most servers are not connected to a GUI and would
    not be pointless, but a desktop environment can consume a significant amount of
    resources just for doing nothing. Servers are generally accessed remotely, through
    a remote console using SSH or via a web interface. The best known is Webmin, which
    is included in most distributions. You can install it in the usual way, then access
    it via a web browser at https://localhost:10000.


    If you want to try different servers you might not even need a server at all.
    Popular server software is available for all distros. Experiment with Webmin file
    sharing, for example, Samba is a good start.


    If you want to try a different server you might need to run a server-side configuration,
    then install another distro. Ubuntu server is a great start. It has a full set
    of servers available, select what types you want to run and then add layers. It
    also comes with a web-based configuration, but you will have to


    Once you''ve installed your server, go to http://server-address:443 to see the
    interface. It is so simple you will not need to install all the services you want
    to control. Go back to the terminal and run:


    ```

    see a list of the modules, then install the ones you want, for example: apt-get
    install ebox-samba ebox-postfix-mail

    ```


    Now you can do whatever you want with the comfort of a web server.


