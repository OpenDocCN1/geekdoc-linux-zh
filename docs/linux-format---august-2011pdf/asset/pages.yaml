  md: '# Distro Showdown


    # Desktop


    One of the most important aspects of Linux is obviously the desktop.


    For desktop users, how your chosen distro chooses to implement it is crucial.
    Choice is good – certainly there should be negative points for distros that not


    make it easy to choose a different way of doing things. But also important is
    good integration – isn isnt point in being able to use LXDE for example, if you
    are left


    with a system where you can no longer select a printer. Major upheavals in popular
    desktop systems might make this particularly interesting area at the moment.


    # Arch


    Arch Linux doesnt make any assumptions about what software you want to run. In
    fact, if you take the path of least resistance through the installer, you will
    end up with no graphical desktop at all – the packages simply dont include anything.
    It lacks a default desktop, by ernst. Although this might not terribly newbie
    friendly, it does make sense for experts – setting up a headless media player
    or a server,


    Of course, you can install a desktop if you want! You might want to set up a first
    though. Oh and you will greatly benefit from being able to install the system
    of your choice – KDE, Gnome, Xfce, Enlightenment. Then all you need to do is install
    applications to run on. You''ll need to open a terminal to install anything.


    ![](img/ed47dae754beafdc9a78858630fb76b4_41_0.png)


