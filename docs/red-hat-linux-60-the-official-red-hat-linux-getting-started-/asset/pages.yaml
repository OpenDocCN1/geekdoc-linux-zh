  md: 'Advanced Focus - This allows you to change properties related to focusing windows.


    All new windows that appear get the keyboard focus - This ensures that when you
    start a new application you can start on it when it appears without moving the
    mouse to get the focus of the window.


    All new pop-up windows get the keyboard focus - This will give the focus to new
    pop-up windows only. If you have this selected and the "All new windows that appear
    get the keyboard focus" not selected, your pop-ups will get the focus no matter
    where they appear, but new applications started will not. An example of a pop-up
    window is an error message you might get in an application.


    Only new pop-up windows whose owner is focused get the keyboard focus - This will
    give the focus to new pop-up windows only if the application that launched the
    window has the focus beforehand.


    Raise windows when switching focus with the keyboard - If you use keystrokes to
    change the focus of your windows this will bring the focused window to the foreground.


    Send pointer to windows when switching focus with the keyboard - If you use keystrokes
    to change the focus of your windows, this will send your mouse pointer to the
    focused window.'
