    directories.


    But first, make sure you’ve got something you can look for in your login directory
    before we go any further.


    You can start by creating an empty file. To do so, you can use a utility `touch`
    at the shell prompt. Try it by:


    ```

    touch foo.bar

    ```


    Now, in your login directory, you’ve got an empty file called foo.bar. You’ll
    see it in a couple minutes.


    Let’s also create a new directory, using the `mkdir` command.


    At the prompt, type:


    ```

    mkdir tigger

    ```


    Now, you’ve created a directory called tigger in your login directory. From root,
    your new absolute pathname would be `/home/yourlogin/tigger`, and your directory
    is the parent of tigger. (You can learn more about creating – removing – files
    and directories in Chapter 17 on page 25.)


    Now, you’re ready to go.


    In the DOS world, using the `dir` command will display the contents of a directory.'
