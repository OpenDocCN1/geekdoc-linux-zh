  md: '# I/O Redirection and Pipes


    Don''t forget about using pipes and output redirection when you want to store
    and/or print information to read at a later time.


    You can, for example, use grep to search for particular contents of a file, then
    have those results either saved as a file or sent to a printer.


    To print the information about references to "coffee" in sneakers.txt, for example,
    we just type:


    ```

    grep coffee sneakers.txt | lpr

