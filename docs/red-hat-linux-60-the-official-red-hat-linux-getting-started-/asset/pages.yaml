  md: '# 18.3 Configuring Your Red Hat Linux System For Sound


    If you do not want sndconfig to probe for Plug and Play sound cards, run sndconfig
    with the --noprobe option. It is also possible to manually specify the settings
    for your sound card; to do so, run sndconfig with the --noautoconfig option.


    If sndconfig cannot automatically identify your system''s sound card (or you run
    sndconfig with the --noprobe option), you''ll be asked to select the type of sound
    card you have (See Figure 18.2). Use the [1] and [2] keys to scroll through the
    different cards listed, and position the highlight on the entry that matches your
    system''s sound card.


    ![](img/dad6d2b5926ba9b091aa8c2b848a66ae_294_0.png)


    If you''ve run sndconfig with the --noautoconfig option, you''ll see a screen
    similar to the one in Figure 18.3 on the next page. Here you can specify the settings
    for your sound card. Using the [Tab] key, select a field. Use the arrow keys to
    select the desired setting for that field. When finished, select Ok, and press
    [Space]


    After this screen, you may see an informational dialog box saying that /etc/conf.modules-already
    exists. select Ok and press [Space] to continue.


    Finally, sndconfig will attempt to play a sound sample to verify proper configuration
    of your sound card. If you can hear the sound sample (make sure the speaker volume
    is turned up), you''re done!


    **Please Note:** On cards that have a recognized MIDI synthesizer, sndconfig will
    attempt to play a MIDI sample as well.


    Figure 18.2: Selecting Sound Card Type'
  merge: -1
  pgno: 294
- img_proc: true
  md: '# 282


    # What Do I Do Now?


    ![](img/dad6d2b5926ba9b091aa8c2b848a66ae_295_0.png)


    Figure 18.3: Configuring Sound Card


    # 18.4 World Web Web


    The World Wide Web is one of the hottest aspects of the Internet. Red Hat Linux
    lets you get in on the action in two ways - as a Web browser, and as a Web server.
    Let''s look at both.


    # 18.4.1 World Web Web Browsers


    A variety of Web browsers are available for Linux, including freely distributable
    browsers such as Arena, Lynx, and Grail. The most popular commercial browsers
    are those from Netscape Communications Corporation. And now they''re available
    with Red Hat Linux 6.0! If you select the netscape-communicator or netscape-navigator
    packages, you''re ready to surf. Enjoy.


    # 18.4.2 World Web Web Server


    If you install the Apache Web server (from the apache package), then your Web
    service is already up and running! Just point your Web browser at http://localhost.


    The default page shown is http://html/index.html. You can edit it (or replace
    it) to your liking. All the CGI programs, icons, and html pages are stored in
    /home/http, but this can be changed in the apache configuration files, all of
    which are stored in /etc/http/conf/. All of httpd activity is recorded in var/log/httpd.
    Setting up your own HTML pages and links to the home html directory. For more
    information on customizing your Web server we recommend a reference such such
    as HTML: The Definitive Guide by Chuck Musciano & Bill Kennedy, published by O''Reilly
    & Associates.'
  merge: -1
  pgno: 295
- img_proc: true
  md: '18.5 Good luck and enjoy!


    # 18.5 Good luck and enjoy!


    As we said before, there is a wealth of information available which can help you
    get the most out of your your new Red Hat Linux system. We hope this guide has
    assisted you in your journey.'
