    # # About This Guide


    This users guide is designed to help you find your way around GNOME with ease.
    Both new and experienced computer users can benefit from this guide. If you''re
    new to GNOME, or even computers, you''ll gain an idea of how to use your desktop.
    If you''re an advanced user, you can work with expert tips which will help you
    to become familiar with GNOME.


    Although this was written originally in English, there are many translations of
    the guide available now or in the near future. If you would like to have this
    guide in another language you should check your operating system distribution
    or visit the GNOME Web Site (http://www.gnome.org) to find out more information
    on translation.'
