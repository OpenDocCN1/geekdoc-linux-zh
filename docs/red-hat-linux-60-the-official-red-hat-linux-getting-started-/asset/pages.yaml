    # 16.8 Appending Standard Output


    There''s a neat twist to output redirection which allows you to add new information
    to the end of an existing file. Similar to when you use the > symbol, you tell
    your shell to send the information somewhere other than standard output.


    However, when you use >>, you''re adding information, rather than replacing it.


    The best explanation is a demonstration, let''s take two files which have already
    been created - sneakers.txt and home.txt - and join them by using the append output
    symbol. We want to add the information in home.txt to the information already
    in sneakers.txt, so we type:


    ```

    cat home.txt >> sneakers.txt

    ```'
