- img_proc: true
  md: '# Editing /etc/inittab -The file /etc/inittab is used to, among other things,
    determine the system''s default run level. We need to change the default run level
    from 3 to 5; therefore, we''ll need to edit /etc/inittab. Using the text editor
    of your choice, change this line in /etc/inittab:


    ```

    3:initdefault:

    ```


    When you''re done, it should look like this:


    ```

    5:initdefault:

    ```


    **Please Note:** Make sure you change only the number 3 to be 5! Do not change
    anything else, otherwise your Red Hat Linux system may not boot at all! When you''ve
    made the change, exit the editor, and use this command to review your handwork:


    ```

    less etc/inittab

    ```


    (Press the Space to page through the file; Q will exit.) If everything looks OK,
    it''s time to reboot. Use the shutdown command to properly shut down your system,
    and you''re done!


