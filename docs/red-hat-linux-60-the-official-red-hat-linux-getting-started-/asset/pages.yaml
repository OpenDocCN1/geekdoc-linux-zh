- img_proc: true
  md: '# Chapter 4. The Enlightenment Window Manager


    # Introduction


    GNOME is a desktop environment that is not dependent on any one window manager
    in order to control how applications and other features interact with each other.
    GNOME can work with a variety of window managers. The window manager is what controls
    the window borders, window decorations, and the functionality of those windows.
    Currently there are about three or four window managers that are considered GNOME
    compliant. Being GNOME compliant means much more than simply being able to run
    with GNOME; it also means being aware of GNOME and what GNOME offers. This includes
    session management, desktop settings, and interactivity with applications such
    as the GNOME Pager.


    The Default Window Manager for this release of Red Hat Linux is a window manager
    called Enlightenment. Within Enlightenment there is a tool which will help you
    to configure the window manager to your specifications.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# The Enlightenment Configuration Tool


    There are two ways to launch the Enlightenment Configuration tool (E-conf). You
    may open the GNOME Control Center and select the Window Manager Capplet from the
    Desktop group. If you have Enlightenment as your current window manager you may
    run E-conf by pressing the Run Configuration Tool for Enlightenment button.


    You may also launch E-conf by clicking your middle mouse button (or both right
    and left mouse buttons if you have emulation) on the desktop and selecting the
    Enlightenment Configuration item from the pop-up menu.


    E-conf is divided into many sections that control various effects and functions
    within Enlightenment (E). You will find a list of these sections in the top left
    corner of the E-conf. The sections to choose from include: Basic Options, Desktops,
    Behavior, Audio, Special FX, Backgrounds, Themes, and Shortcuts.


    # Basic Options


    The Basic Options section of E-conf lets you configure how E controls the movement
    and focus of windows on your desktop. Each method for controlling windows has
    a small image to show you what they look like, but perhaps the best way to get
    a feel is to select one, press the'
  merge: -1
