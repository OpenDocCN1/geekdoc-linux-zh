    # 15.6 A Brand New You


    Now, let''s create a "user account."


    If you''re familiar with MS-DOS or, to a lesser extent, Windows 98, you might
    be a little befuddled by the requirement of creating a user account.


    After all, if you can navigate the system and use programs in your root account,
    you might think that having two accounts on a single machine is excessive.


