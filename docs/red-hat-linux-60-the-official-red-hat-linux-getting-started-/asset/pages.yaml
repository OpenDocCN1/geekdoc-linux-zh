    ```


    To move forward a screen, press [Space]; to move back a screen, press [B]; to
    quit, press [Q].


    Another time-saving tool is known as tab completion. If you type part of a file
    or pathname then the [Tab] key, bash will present you with either the remaining
    portion of the file/path, or a beep. If we get a beep, we can press [Tab] again
    to obtain a list of the files/paths that match what we''ve typed so far.


    So even if we turn off the machine at the end of the day, we probably won''t have
    to work hard in order to remember the command to update locate''s database. The
    chances are good that the command will be stored in the command-line history or
    can be completed with tab completion (as long as we remember the start of the
    pathname for the command).


    Both tab completion and command-line history can be useful to help you use a command
    you''ve forgotten, as well.


    Let''s try tab completion to update locate''s database. First, su to root.

    Now, at a shell prompt, type the beginning of the path:


    ```

    /etc/cr

    ```


    Now, press the [Tab] key and tab completion will complete the path to /etc/cron
    (and you''ll hear a beep). Press [Tab] again, and you''ll be presented with a
    list of possible completions:


    ```

    cron.daily cron.hourly cron.monthly cron.weekly crontab

