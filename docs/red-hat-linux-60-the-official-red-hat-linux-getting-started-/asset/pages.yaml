    # 18.3.2 Sound Card Configuration Tool


    Also included in Red Hat Linux 6.0 is sndconfig, a screen-oriented utility that
    can properly configure modular sound card drivers.


    There are a few things that you should know about sndconfig:


    **Plug and Play Aware** - sndconfig is able to detect and automatically configure
    Plug and Play sound cards such as the Blaster 16 PnP. The configuration information
    is stored in the /etc/isapnp.conf file, along with the configuration information
    for any other Plug and Play devices. In order to ensure that no configuration
    be lost, sndconfig saves your original /etc/isapnp.conf file as /etc/isapnp.conf.bak.


    **Modifies** /etc/conf.modules-sndconfig modifies the module configuration file
    /etc/conf.modules by adding information about the module options required for
    your sound card. Note that sndconfig saves your original /etc.conf.modules file
    as /etc/conf.modules.bak.


    To set up your sound card, run /usr/sbin/sndconfig. Note that you must be root
    in order to run sndconfig. If your system contains a Plug and Play sound card,
    sndconfig will identify it, and configure it appropriately.'
