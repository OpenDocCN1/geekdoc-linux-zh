    Wait for your diskette drive''s light to go out, and that''s it!


    You now have a rescue diskette set. Label this diskette something like “Red Hat
    Linux 6.0 diskette” and store it in someplace safe.


    Let''s hope you never have to use it.


    If you should ever need to use rescue mode, here''s how.


    Boot your system with the boot diskette in the first diskette. At the LILO Boot:
    prompt, enter the word rescue. You will see the usual kernel messages as the Linux
    kernel starts up.


    Eventually, it will ask you to insert the diskette, and press Enter. Remove the
    boot diskette, insert the rescue diskette, and press Enter.


    The rescue diskette will be read into memory. After a minute or so, you should
    see the shell prompt. That''s it – you''re in rescue mode!


    When now?


    When it comes to rescue mode, that''s a bit like asking, “how long is a piece
