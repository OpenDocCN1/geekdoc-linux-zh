  md: '# 15.2 The Root of the Matter


    When your Red Hat Linux system starts, you''ll see an array of messages speeding
    past you on the screen. Many of these messages simply tell you what services are
    starting on your computer.


    > Tip: Want to read those startup messages more closely? At a shell prompt, type
    dmesg more. You''ll be able to read the file one screen at a time. To move forward,
    press the Spacebar to quit, press Q


    Finally, we''ll come to “the login prompt” (as shown in Figure 15.3).


    You''ll find:


    +   - Login:

    - Password:


    At this point, some new users can easily feel rattled, but don''t panic. Instead,
    think back: When you installed Red Hat Linux 6.0, you were asked for a root password.


    ![](img/dad6d2b5926ba9b091aa8c2b848a66ae_203_0.png)


    Figure 15.3: A sample screen of the graphical login prompt


    In detail, that is the password you were asked to choose login to your root account.
    When you log in – either in the root account or other accounts – you''re introducing
    yourself to the system. The root account, unlike all other accounts for your system,
    has access to everything. Also known as the superuser, the root account can control
    everything the system does.


    Go ahead and login; at the Login: prompt just type:'
  merge: -1
