- img_proc: true
  md: '# 214


    # Welcome to Linux


    To get into rescue mode, you''ll need a rescue disk set. These are two diskettes
    that contain the files necessary to boot into rescue mode.


    If you elected to make a boot diskette while you were installing Red Hat Linux,
    you''re halfway there! The first diskette in a rescue disk set is this boot diskette.


    Now on to the diskette...


    The second diskette is called the rescue diskette. It is produced by writing an
    image file onto a diskette. The image file is called rescue.img, and is located
    in the images directory for the first Red Hat Linux CD-ROM.


    To gain access to this file, you''ll first need to mount your Red Hat Linux CD-ROM.


    Start by inserting the CD-ROM in your system''s CD-ROM drive. You''ll need to
    do this while logged in root.


    Type the following command:


    ```

    mkdir /mnt/cdrom

    ```


    Now, type:


    ```

    mount /dev/cdrom /mnt/cdrom

    ```


    You may get an error message from the first command saying that the file exists.
    That''s fine; we just want to make sure there is a /mnt/cdrom directory on your
    system. The second command should issue an informational message that /dev/cdrom
    is being mounted read-only.


    **Please Note:** Some systems may not recognize dev/cdrom. If this is your case,
    you''ll have to replace .dev cdrom in the command with the appropriate device
    name for your CD-ROM.


    Next, issue the following command (again, while logged in as root):


    ```

    cd /mnt/cdrom/images

    ```


    then type:


    ```

    ls

    ```


    to list the contents of the images directory.


    You should see a file named rescue.img. This is the rescue diskette image file.
    Next, put a diskette in your first disk drive, and enter the following command:


    ```

    dd if=rescue.img of=/dev/fd0 bs=1440

    ```'
