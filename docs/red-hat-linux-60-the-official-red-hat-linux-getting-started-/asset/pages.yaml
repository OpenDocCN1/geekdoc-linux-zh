  md: '# Chapter 5. Using the GNOME Panel


    on whether you would like to log out or not. Select Yes and your GNOME session
    will end.


    If you would like, you may add the Logout button to the Panel. This is just another
    method for logging out, it does not provide you any other functionality than the
    Logout menu item other than a pretty button. To add the Logout button to the Panel
    right mouse click on the Panel and select the Add logout menu item from the pop-up
    menu. Once the button is there you may press it to log out.


    > NOTE: If you are running a window manager that is GNOME compliant the logout
    feature will quit the window manager as well as GNOME. If you are not running
    such a window manager you will have to end that window manager yourself.


    The Logout dialog will display when you log out of GNOME. This dialog will ask
    you whether or not you really want to log out. It also provides you with different
    methods of quitting GNOME.


    You have three choices on how to quit GNOME. You may Logout which will simply
    take you to a terminal, Halt which will shut down the whole system, or Reboot
