  md: '# Enlightenment Menus


    Like all other window managers Enlightenment is designed to be used with or without
    a desktop environment like GNOME running on top of it. This means that there is
    some functionality in it which allows you to do things like start applications
    and move between desktops, etc.


    To this end, Enlightenment provides you with menus to launch applications and
    perform tasks. These menus may be used in one of two places that provide different
    functionality: the desktop and any window border.


    # Enlightenment Desktop Menus


    To access the desktop menus, click with your middle mouse button (or both right
    and left mouse buttons if you have emulation enabled) on the desktop. This will
    bring up the Enlightenment menus.


    The desktop menus will provide you with various applications that you might have
    installed on your system. There are some applications in the menu that you may
    not have installed which the creator of Enlightenment chose to put in the menus.


