    # What Do I Do Now?


    **New To Linux** - Has never used any Linux (or Linux-like) operating system before,
    or has had only limited exposure to Linux. May or may not have experience using
    other operating systems (such as Windows). Is this you? If so, please turn to
    Section 18.1.1.


    **Some Linux Experience** - Has installed and successfully used Linux (but not
    Red Hat Linux) before. Or, may have equivalent experience with other Linux-like
    operating systems. Does this describe you? If so, please turn to Section 18.1.2
    on the next page.


    **Old Timer** - Has installed and successfully used Red Hat before. Are you an
    old-timer? If so, please turn to Section 18.1.3 on the facing page.


    # 18.1.1 Documentation For First-Time Linux Users


    "A journey of a thousand miles begins with a single step." This old saying can
    be applied to any endeavor; we''re going to apply it to using your Red Hat Linux
    system. Learning to use a Linux system effectively can be a long, rewarding journey,
    where you find that you can easily do things that people with other operating
    systems can only dream of. But like all journeys, you''ve got to start somewhere,
    and take that first step


    And the first step you need to take is to get yourself documentation! This cannot
    be stressed enough; without documentation you will only become frustrated at your
    inability to get your Red Linux system working the way you want.


    Here''s what you should look for in terms of Linux documentation:


    +   * A brief history of Linux** - Many aspects of Linux are the way they are
    because of historical precedent. There is also a Linux culture that, is based
    to be a great deal on past history. A bit of knowledge about the history of Linux
    will serve you well, particularly as you interact with more experienced Linux
    users on the Internet.

    * An explanation of how Linux works** - While it''s not necessary to delve into
    the most aspects of the Linux kernel, it''s a good idea to know about how Linux
    is put together. This is particularly important if you''ve been working with other
    operating systems; some of the assumptions you hold about how computers work may
    not transfer from that operating system to Linux. A few paragraphs describe how
    Linux works (and how it differs from the operating system you''re used to), can
    be invaluable in getting off to a good start with your Red Hat Linux system.

    * An introductory command overview (with examples)** - This is probably the most
    important thing to look for in Linux documentation. The design philosophy behind
    Linux is that it''s better to use many small commands connected in different ways
    than it is to have a few (and complex) commands that do the whole job themselves.
    Without some examples-that-illust the Linux approach to doing things, you will
    find yourself intimidated by the sheer number of commands available on your Red
    Hat Linux system.


    Here is some direction that may help match all of your requirements:'
