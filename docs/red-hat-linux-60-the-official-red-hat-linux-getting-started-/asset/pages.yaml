  md: '# OFFICIAL redhat Linux 6.0

    Operating System


    # The Award-Winning Red Hat Linux Operating System


    Selected as the Operating System Product-of-the-Year, by InfoWorld for the past
    three years, the open-source Red Hat Linux offers you more stability, power and
    control than any other OS.


    # New OS Features


    Easy to Use


    +   - Autodetection and configuration of hardware

    - NEW Graphical User Interface

    - Automatically starts GUI upon complete installation


    New 2.2 Kernel


    +   - Enhanced performance

    - Automatic SMP support


    Support for More Hardware


    The Latest Optimized C Compiler


    # Getting Started Guide


    If you have recently installed Red Hat Linux or if you just want to learn about
    using the operating system, you may need some guidance in getting it started.
    From how to effectively use the Red Hat Linux Operating System to navigate GNOME,
    the Red Hat Getting Started Guide is your “Official” manual to become an effective
    Red Hat Linux user. Written by the same team who has written the Red Hat Linux
    Installation Guide, this’s easy-to-read approach will take you from the ground
    up, providing information every Red Hat Linux user should know.


    ![](img/dad6d2b5926ba9b091aa8c2b848a66ae_307_0.png)


    New GNOME interface featuring applications such as File Manager, GNOME Help Browser,
    and Package Manager.


