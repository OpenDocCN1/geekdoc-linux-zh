    # 15.10 What is Rescue Mode?


    Rescue mode is a term used to describe a method of booting a small Linux environment
    completely from diskettes.


    What follows in this section may help you recover from a problem at some point.
    A copy of these instructions is also available as rescue.txt on your Red Hat Linux
    6.0 CD-ROM.


    As the name implies, rescue mode is there to rescue you from something. In normal
    operation, your Red Hat Linux system files located on your system''s hard drive
    to do everything – run programs, store your files, and more.


    However, there may be times when you are unable to get Linux running completely
    to access its files on your system''s hard drive. By using rescue mode, it''s
    possible to access the files stored on your system''s hard drive, even if you
    can''t actually run Linux from that hard drive.


    Normaly, you''ll need to get into rescue mode for one of two reasons:


    +   You are unable to boot Linux, and you''d like to fix it.


    +   You are having hardware or software problems, and you want to get a few important
    files off your system''s hard drive.


    Let''s take a closer look at each these scenarios.


    Unable to boot Linux – Many times this is caused by the installation of another
    operating system after you''ve installed Red Hat Linux. Some other operating systems
    assume that you have no other operating systems on your computer, and overwrite
    the Master Boot Record (MBR) that originally contained the LILO bootloader. If
    LILO is overwritten in this manner, you are out of luck – unless you can get into
    rescue mode.


    Hardware/software problems – There can be many different situations under this
    category as there are systems running Linux. Things like failing hard drives and
    forgetting to run LILO after booting a new kernel are just two things that can
    keep you from booting Red Hat Linux. If you can get into rescue mode, you might
    be able to resolve the problem – or at least copies of your most important files.


    What do you need to get into rescue mode?'
  merge: -1
