- img_proc: true
  md: '# 16.12 Ownership and Permissions


    That was one demonstration of Linux''s security features. Linux, like UNIX, is
    a multi-user system, and file permissions are one way the system uses to protect
    against any type of tampering – malicious or accidental.


    One way to gain entry when we''re denied permission is to su to root, as we learned
    earlier. That''s because whoever knows the root password has complete access.


    ```

    billy@localhost billy]$ su root

    Password: (your root password)

    [root@localhost billy]# cd /root

    [root@localhost /]#

    ```


    Switching to superuser isn''t always convenient – or smart, since it''s so easy
    to mistakenly mess up important configuration files.


    All files and directories are "owned" by the person who created them. We created
    the file sneakers.txt in our login directory, so sneakers.txt "belongs" to us.


    That means, we can specify who''s allowed to read the file, write to the file
    or, if it were an application instead of a text file, who can execute the file.


    Reading, writing and executing are the three main settings in permissions.


    Every user on the system is placed into a group when that user is created, then
    we can also specify whether certain groups can read, write to, or execute our
    file.


    Let''s take a closer look at sneakers.txt with the ls -1 (long) option (see Figure
    16.16).


    ```

    billy@localhost billy]$ ls -1 sneakers.txt

    -rw-rw-r-- 1 billy 150 Mar 19 08:08 sneakers.txt

    ```


    There''s a bit of detail here. We can see who can read (r) and write to (w) the
    file, as well as who created the file (billy) and to which group the owner belongs
    (billy).


    > Tip: Remember that, your group is the login name you chose.


    Other information to the right of the group includes the name, date and time of
    its creation as well as size.


    How do all dashes and letters fit together? It''s not as hard to read it as it
    might seem. Let''s take a look:


    ```

    -rw-rw-r--

    ```'
  merge: -1
  pgno: 258
- img_proc: true
  md: '# 246


    # You Are Here


    ![](img/dad6d2b5926ba9b091aa8c2b848a66ae_259_0.png)


    Figure 16.16: Permissions for sneakers.txt


    There are 10 slots in this column. The first slot represents the type of file.
    The remaining nine slots are actually three sets of permissions for three different
    categories of users.


    Those three sets are: the owner of the file, the group in which the file belongs
    and “others,” meaning users and groups other than owner of the file (billy) and
    those in billy’s group (which is also billy).


    Let’s stretch out these file settings a bit:


    | (-rw) | (-rw) | (r--) | 1 billy billy |

    | type owner group others |


    The first item, which specifies the file type, can show one of the following:


    +   - d - a directory

    - -- a regular file (rather than directory or link)

    - 1 - a symbolic link to another program or file elsewhere on the system'
  merge: -1
  pgno: 259
- img_proc: true
  md: '# 16.12 Ownership and Permissions


    Beyond the first item, in the following three sets, we''ll see one of the following:


    +   - r - file can be read

    - w - file can be written to

    - x - file can be executed (if it''s a program)


    When we use a dash in owner, group or others, it means that particular permission
    hasn''t been granted.


    Let''s look again at first column of sneakers.txt and identify its permissions.
    (See Figure 16.17)


    ```

    billy@localhost billyy$ ls -l sneakers.txt

    -rw-rw-r-- 1 billy billy 150 Mar 19 08:08 sneakers.txt

    billy@localhost billyy$

    ```


    ![](img/dad6d2b5926ba9b091aa8c2b848a66ae_260_0.png)


    Figure 16.17: A closer view of permissions


    The file''s owner, billy, has permission to read and write to the file; it''s
    not a program, so billy doesn''t have permission to execute it. The group, billy,
    has permission to read and write to sneakers.txt, as well. Similar to the program
    notation for owner billy, there''s no execute permission for group billy.


    In the last set, we can see that those who aren''t either the user billy or in
    the group called billy can read the file, but can''t write to it or execute it.


    We can use the chmod command to change a file''s permissions.


    Let''s work a bit more on sneakers.txt to change the permissions with the chmod
    command.

    The original file looks like this, with its initial permissions:


    ```

    -rw-rw-r-- 1 billy billy 150 Mar 19 08:08 sneakers.txt

    ```


    As long as we''re the owner of the file - or we''re logged into the root account
    - we can change permissions in any combination of settings for the owner, group
    and others.


    Right now, the owner (that''s us) and our group (which is billy) can read and
    write to the file.


    Anyone outside of our group - for example, anyone in the adm group - can only
    read the file (r--).'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# 248


    **Tip:** Remember that file permissions are a security feature. Whenever you allow
    everyone-one to read, write to and execute files, you may be increasing your risk
    of tampering. As a rule, then, you should shy away from allowing everyone to read
    and write to a file.


    In this case, however, let''s say that we want to allow everyone to write to the
    file, so they can read it, write notes in it and save it. That means we''ll have
    to change the change “others” section of the file permissions.


    Since we''re the owner of the file, we don''t have to su to root to do it. Let''s
    take a look at the file first. At the shell prompt, type:


    ```

    ls -1 sneakers.txt

    ```


    which gives us this file information:


    ```

    -rw-rw-r-- 1 billy billy 150 Mar 19 08:08 sneakers.txt

    ```


    Now, type the following:


    ```

    chmod o+w sneakers.txt

    ```


    To check our results, we can list the file’s details again. Now, the file looks
    like this:


    ```

    -rw-rw-rw- 1 billy billy 150 Mar 19 08:08 sneakers.txt

    ```


    There''s our result: Now, everyone can read and write to the file (Figure 16.18).

    When we updated o+w, we were saying, “for others, add permission to the file sneakers.txt.”

    If we want to remove all access permission from sneakers.txt (even though it''s
    only a sketchy shopping list), we could use the chmod command to take away both
    the read and write permissions like so:


    ```

    chmod go-rw sneakers.txt

    ```


    and the result will look like this:


    ```

    -rw-------r 1 billy billy 150 Mar 19 08:08 sneakers.txt

    ```'
