  md: '# Introduction


    Welcome to Red Hat Linux 6.0!


    At Red Hat Software, we believe we offer the best Linux distribution on the market.
    We hope you''ll agree that the time and the money you spent for Red Hat Linux
    was well spent, indeed.


    Recently, Linux has gained quite a bit of attention from the national and international
    media. What began as a "hacker''s hobby" several years ago has been embraced as
    a powerful and economical computer operating system.


    If you count yourself among the many Linux users who are discovering Red Hat Linux
    for the first time, this book is for you!


    Inside, you''ll find valuable tips which will help you get acquainted with your
    new desktop environment and with the way your Red Hat Linux system works. You''ll
    be able to learn some basics and you''ll find pointers to places where you can
    turn for more information.


    This book is divided into two parts:


    +   - The GNOME User''s Guide;

    - The Newbie''s Guide to Red Hat Linux.


    # The GNOME User''s Guide


    Written by David A. Wheeler and Red Hat Software, the GNOME User''s Guide is an
    indispensable resource for navigating and customizing GNOME.


    GNOME stands for GNU Network Object Model Environment. That''s a fancy acronym,
    but it translates into a pleasing environment which offers all the power of Linux.
    GNOME is the default X Window System environment for Red Hat Linux 6.0.


    In the GNOME User''s Guide section you will find ways to create, move and copy
    files, investigate your new system and much more – all within a pleasing graphical
    environment.


    Here''s a preview of what you''ll find in these first 14 chapters:'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Introduction


    +   - Chapter 1: An Introduction to GNOME – Learn a little about the history and
    ideas that have helped create GNOME


    +   - Chapter 2: GNOME Quick Start – Get a “quick start” on familiarizing yourself
    with the GNOME desktop.


    +   - Chapter 3: Window Managers and GNOME – Learn a little about window managers,
    and which window managers you can use that work well with GNOME.


    +   - Chapter 4: The Enlightenment Window Manager – An in-depth look at Enlightenment,
    the default window manager for Red Hat Linux. Although GNOME is not dependent
    on any single window manager, Enlightenment (or “E”) has captured a few fans because
    of its stylish features. Here you''ll find out how you can configure E to your
    liking.


    +   - Chapter 5: Using the GNOME Panel – Learn the ins and outs of GNOME Panel,
    from which you can find and start your system’s applications. Highly flexible,
    the Panel allows you to add favorite applications, change its location, add new
    panels and more.


    +   - Chapter 6: The GNOME Desktop – Your GNOME desktop is more than just a pretty
    face. Here’s where you can find out how to “drag and drop” applications, store
    files, create folders, switches and monitors.


    +   - Chapter 7: The GNOME File Manager – The GNOME File Manager adds form to
    the function and power of the Midnight Commander. Here, you’ll learn how to view
    and manipulate files – both on your system and on the Internet.


    +   - Chapter 8: Configuring the Panel – Once you become comfortable with panels,
    here’s where you can learn how to add further productivity and style to your usefulness.


    +   - Chapter 9: Editing the Main Menu – Even though it gives you easy access
    to applications, you’re not stuck with the menu’s default configuration. Here’s
    where you can learn how to make the menu work the way you work.


    +   - Chapter 10: The GNOME Control Center – As advertised, the GNOME Control
    Center allows you to control your environment looks, “feels” and behaves. You’ll
    learn how to tweak your environment in many ways.


    +   - Chapter 11: A Word About Session Management – Learn how you can automatically
    start applications when you log in.


    +   - Chapter 12: Panel Applets – From system monitors to multimedia enhancements,
    these small applications can add productivity and fun to your environment. You’ll
    learn what applets serve best in this chapter.


    +   - Chapter 13: GNOME CD Player – This chapter shows you how to access and get
    the most out of your pre-loaded GNOME CD player.


    +   - Chapter 14: The GNOME Calendar – Keep track of more than the days of the
    week with this application.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Introduction


    You''ll find quite a few translations of the GNOME User''s Guide, as well as the
    latest GNOME documentation and software at the official website:


    http://www.gnome.org/


    Now, on to some of your Red Hat Linux system''s details...


    # The Newbie''s Guide to Red Hat Linux


    Are rattled by terms root and user account? This section is for you!


    The second part of the Red Hat Linux Getting Started Guide, this "newbie''s guide"
    will help you gain a foothold on the basics of your new Linux system – from creating
    a new account to working with files in a non-graphical environment.


    There''s nothing wrong with a little hand-holding – and that''s what you''ll find
    in these remaining chapters.


    Here''s a glimpse of what you can find:


    +   * **Chapter 15: Welcome to Linux** – Learn how to create your own user account
    to maximize your system''s safety. You''ll also find how to shut down your system,
    create rescue disks and more.

    * **Chapter 16: You Are Here** – Learn how to navigate through your system at
    the shell prompt, how to combine commands and see how everything fits together.

    * **Chapter 17: Managing Files and Directories** – Here, you''ll learn more about
    the powerful shell you''re using, how to save yourself time and frustration when
    you''re typing in commands and how to rename, copy, delete and move files and
    directories.

    * **Chapter 17: What Do I Do Now?** – Looking for pointers to find information
    about your Red Hat Linux system? Here, you''ll find tips about where you can find
    plenty of documentation and help. You can also learn more about your X Window
    System and how to work with other system tasks.


    # More to Come


    As Linux evolves, so does the support you''ll find for Red Hat Linux. The Red
    Hat Linux Getting Started Guide is part of that support – and evolution. In coming
    editions, expect to find more essential information to help you get the utmost
    from your Red Hat Linux system.

    That''s also where you come in.'
  merge: -1
