  md: '# # Chapter 12. Panel Applets


    # ## Introduction


    This section describes the GNOME applets that are available to add to the GNOME
    Panel. To access these applets right mouse click on the Panel and select **Add
    new applet** from the **pop-up** menu.


    # ## Amisements


    The Amusement applets are applets that are designed to make your life more enriched
    by providing you with a complete waste of time and resources purely for your entertainment.
    If you find that valuable space in your brain has been filled with something an
    Amusement applet has taught you then the authors of that applet have succeeded
    in their task.


    # ## Monitors


    Monitor Applets are designed to be used to keep track of your system'
  merge: -1
  pgno: 159
- img_proc: true
  md: 'and its functions. You can monitor the resources left on your machine which
    allows you to keep close tabs on how things are working.


    # Battery Monitor


    The Battery Monitor is a simple applet that allows you to see how much time you
    have remaining on your laptop monitor.


    # Battery Charge Monitor


    The Battery Charge Monitor is used while you are charging the battery for your
    laptop. It will show you how much your battery has been charged and how much it
    has left to complete the task.


    # CPU/MEM Usage Monitor


    The CPU/MEM Usage Monitor is an applet that will show you the current usage of
    CPU, Memory, and Swap Space. The applet consists of three bars that are shaded
    with colors to represent the usage. If you are running the applet on a horizontal
    panel the top bar is CPU, the middle bar is Memory, and the bottom bar is Swap
    Space. If you are'
  merge: -1
  pgno: 160
- img_proc: true
  md: 'running the applet on a vertical panel the CPU is the left bar, Memory is the
    middle bar, and Swap Space is the right bar.


    # Figure 12-1. The CPU/MEM Applet


    ![](img/dad6d2b5926ba9b091aa8c2b848a66ae_161_0.png)


    +   - CPU - The CPU bar will show the current CPU usage with one of three colors.
    The yellow shows the current hit by the current user. Grey shows the current hit
    by non-user specified system activity. Black show idle use.


    +   - MEMORY - The Memory bar show the current physical memory usage with one
    of four colors. The yellow show the current shared memory usage. The grey-yellow
    show other memory usage. The grey shows the buffers being used. The Green show
    free physical memory available on your system.


    +   - SWAP SPACE - The Swap Space bar shows how much swap space is being used
    with a yellow bar. Any free swap space will be shown with a green bar.'
