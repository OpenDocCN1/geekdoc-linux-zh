  md: '# 15


    # Welcome to Linux


    Congratulations!


    As a new Red Hat Linux user, you’ve successfully installed one of today’s most
    advanced computer operating systems.


    What began in 1991 as a hobby for a young Finnish student named Linus Torvalds
    has ballooned from a “hacker’s darling” into an important tool for both home and
    business users.


    Just six years ago, there were an estimated 100,000 users. Today, about 12 million
    users worldwide depend on Linux to manage finances, use and control Internet services,
    create artwork and more. That number is rapidly growing; every day, new users
    are discovering the power and potential of Linux.


    This free, UNIX-like operating system is a multitasking, multi-user environment
    that has superior memory management, great security features, and more.


    In other words, power and, once you become more comfortable with Linux, ease of
    use.


    > Tip: Linux is most frequently pronounced with the short “i” and the accent on
    the first syllable, as in “LIH-nucks”.


    What do you do next? Relax.'
  merge: -1
  pgno: 200
- img_proc: true
  md: 'In the chapters that follow, we hope to show you the basics of how to get the
    most out of your new system. If you''re interested, we will also show you the
    roads to take which can lead you to becoming a Linux guru.


    # 15.1 A Note About Conventions


    At the time you installed your Red Hat Linux system, you were given the option
    of working entirely in a graphical environment, such as GNOME, or logging in console
    mode, which is non-graphical.


    If you''re like many Linux users, you''re familiar with graphical environments
    such as Microsoft Windows, Apple Macintosh or IBM''s OS/2.


    So it''s a fairly safe bet that you chose to work in a graphical environment when
    you installed Red Hat Linux 6.0.


    You''ll find plenty of opportunities to "point and click" on applications – either
    on your desktop or from the menu at the bottom of your desktop. We''re going to
    spend much of our time working from the "shell prompt."


    Why? Because at the same time you accomplish tasks, you can learn a little more
    about how your Red Hat Linux system works.


    > Tip: Unlike a graphical presentation, a "shell prompt" is the way you can type
    commands directly to the "shell." You need a shell to use Linux, because it''s
    the tool you use to interact with your operating system. You''ll find more information
    about your shell in Chapter 17 on page 25.


    ![](img/dad6d2b5926ba9b091aa8c2b848a66ae_201_0.png)


    Figure 15.1: The GNOME footprint on the panel


    There are plenty of ways to get a shell prompt, depending on the kind of graphical
    environment you''re using, such as GNOME. Depending on the environment chosen,
    by right- or left-clicking in a blank space upon, you''ll see a reference to xterm.


    By "dragging" your cursor over that item you will open a shell prompt window.
    Other times, you''ll find you can get a shell prompt window through the menu on
    your desktop.


    In addition to xterm, other references will give you the shell prompt include:


    +   - terminal emulator window'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# 15.1 A Note About Conventions


    +   * GNOME terminal

    * Color Xterm


    We''ll use GNOME as our example.


    To begin, take your cursor to the GNOME footprint on the panel at the bottom of
    the desktop.


    Now, left-click once on the footprint (see Figure 15.1), and a menu of “folders”
    will pop up. These folders represent categories of various software groups on
    our system. There are utilities, graphics programs, Internet applications and
    much more.


    Once the menu pops up, “drag” the cursor to the Utilities section of the menu
    by holding down the mouse button while raising the mouse to the Utilities folder.


    Once the cursor is over the folder, a new menu pops up to the right of the Utilities
    folder. Here, in the first entries of this submenu, there is a choice of terminal
    windows: Regular xterm, Color xterm and GNOME terminal to get a shell prompt,
    position your cursor over the terminal of your choice, and release the mouse button.


    ![](img/dad6d2b5926ba9b091aa8c2b848a66ae_202_0.png)


    Figure 15.2: Shell prompt menus in Utilities


    > Tip: Of the choices in the Panel ⇒ Utilities menu, the GNOME terminal offers
    the ability to set background color and other preferences most easily.


    Now, it''s time to take your first steps.'
