    Translucent. Depending on your machine speed some of these move methods may work
    slower than others.


    +   Resize Methods - The Resize Methods option controls how the window looks when
    you resize them. You may choose among Opaque, Lined, Box, Shaded, and Semi-Solid.
    Again, depending on your machine speed some of these methods may work slower than
    others.


    +   Keyboard focus follows - This area controls which window gets the focus. Getting
    the focus means that the keyboard can control the window and if there is a distinction
    in you enlightenment theme, the window will be highlighted. You may choose from
    Mouse Pointer, Sloppy Focus, and Pointer Clicks.


    Mouse Pointer will focus the window whenever the mouse is over the window. Sloppy
    Pointer will do the same but will focus the window when the mouse is over it and
    keep the focus until the mouse is over another window. For example, you can put
    the mouse over a window and then over the desktop and the window will still have
    focus until it is over another window. Pointer Clicks means that you have to actually
    click on the window to give it focus.


    At any time you may reset all of the Enlightenment configurations to the default
    settings by pressing the Reset all settings to system defaults and exit button.'
