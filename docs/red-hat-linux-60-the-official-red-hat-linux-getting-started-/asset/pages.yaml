    When you''re done, and you''d like to leave X, select the GNOME foot on the panel
    bar, choose out and answer Yes to confirm your decision. You will then be logged
    out of your system.


    **Please Note:** If you''re running GNOME as your desktop environment, all programs
    that were currently running will be restarted when you log back in.


    # Changing Your Desktop


    You can use the Switchdesk feature to change out your desktop environment. Switchdesk
    will present a screen which you can switch between desktop environments that you
    may have installed on your system. You will then be asked to exit and restart
    X. You will see your new desktop of choice X has restarted.


    To use the Switchdesk feature you can type switchdesk at the command line of an
    Xterm. If you are using GNOME, click on the GNOME foot, choose Run Programs and
    type switchdesk.


