    If you are using a default installation of GNOME you may notice that minimizing
    a window actually causes that window to disappear from your desktop. To regain
    that window you may use the GNOME Pager which is located on the Panel. The Pager
    will show you which tasks are running and where they are on your desktops. You
    will find the application you minimized in the task list on the right side of
    the GNOME Pager. Press the button for that application and it will return to your
    desktop.'
