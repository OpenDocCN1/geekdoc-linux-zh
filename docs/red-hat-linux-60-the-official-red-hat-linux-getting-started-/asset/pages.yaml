    # # What Do I Do Now?


    Now that you''re becoming a little more familiar with your Red Hat Linux system,
    you might be wondering, "What do I do now?"


    If so, this chapter is for you. We''ll start with some basic places you can go
    to find more documentation and help from the Linux user community. Then we''ll
    show you how to do some post-installation configuration so you can set up things
    just the way you want.


    But before we do any of that, let''s talk about documentation...


    # ## 18.1 Getting the Documentation That''s Right for You


    It is critical to make sure you have documentation that is appropriate to your
    level of Linux expertise. There is no more certain way to make your experience
    using Red Hat Linux a failure than to not have the documentation you need, when
    you need it.


    As the name implies, the Official Red Hat Linux 6.0 Getting Started Guide is just
    that – a guide to taking those first steps with your newly installed Red Hat Linux
    system.


    Let''s take a look at three categories of people using Red Hat Linux, and try
    to be more explicit in terms of the documentation you''ll need. Let''s start by
    figuring out your experience level. Here are the three basic categories:'
