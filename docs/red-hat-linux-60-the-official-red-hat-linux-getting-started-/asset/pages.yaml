  md: '# 15.6 A Brand New You


    Linux is a multi-tasking, multi-user system, which means it can safely and securely
    accommodate many users at one time, performing plenty of tasks each user requires.
    But only one account can be root – capable of changing the operating system works.


    Because "rooting around" can easily lead to havoc, it''s important to safeguard
    against accidents. That''s why just about every Linux user – even if they''re
    the system administrator – has their own user account.


    Once you''re logged in as root, you have two ways to conveniently add a user to
    the system: from the within X and from the shell prompt.


    Both methods are quick and painless.


    Let''s say that the account you want to choose is called "billy.",


    From X:


    One of the most powerful tools you can use for system administration is Linuxconf.
    You can use Linuxconf for adding and manipulating accounts, monitoring system
    activities and plenty of other features.


    ![](img/dad6d2b5926ba9b091aa8c2b848a66ae_210_0.png)


