  md: '# 16.3 Looking Around With ls


    Quite a difference. When you added the -a option, you were specifying that you
    wanted to list all files in the directory (see Figure 16.6).


    In fact, there are a multitude of options available with the ls command.


    > Tip: If you want to see all the options of the ls command, you can read the
    man page by typing man ls at a shell prompt. If you want to print the man page,
    type man ls | col -b | lpr at the prompt.


    Why many options? Because they can help you sort information according to your
    needs. For example, you can specify how files are displayed, see their permissions
    and much more.


    ![](img/dad6d2b5926ba9b091aa8c2b848a66ae_240_0.png)


    When you typed ls -a, you probably noticed the files that begin with dots. These
    are called hidden files or, appropriately enough, dot files.


    Hidden files are mostly configuration files which set preferences in programs,
    window managers, shells and more. The reason they’re “hidden” is to help prevent
    accidental tampering by the user.


    Whenever a filename starts with a dot (.), it’s a hidden file, and ls won''t list
    it.


    Viewing all the files can give you plenty of detail, but there’s more you can
    uncover, simply by adding more than one option.'
