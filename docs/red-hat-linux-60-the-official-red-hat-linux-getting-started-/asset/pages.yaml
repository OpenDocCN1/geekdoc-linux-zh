    # 16.11 Stringing Commands Together


    Linux allows you to enter multiple commands at one time. The only requirement
    is that you separate the commands with a semicolon (you can see an example in
    Figure 16.14).


    Want to see how long you''ve been online using Netscape? Just combine the date
    command with Netscape''s command.


    ```

    date; netscape; date

    ```


    Remember that commands are case sensitive, so the command to start Netscape must
    be in lower-case to store the browser.


    In the xterm window, we''ll see something like this:


    ```

    [billy@localhost]$ date; netscape; date

    Saturday Mar 27 21:26:27 EST 1999

    ```


    We''ll see the second date when we close out of Netscape. Then, our screen will
    look like this:


    ```

    [billy@localhost]$ date; netscape; date

    Fri Mar 26 13:26:27 EST 1999

    Fri Mar 26 14:28:32 EST 1999

    [billy@localhost]$

    ```


    And the prompt will return. The discrepancy between the two results from the date
    command shows that we were using Netscape for just over an hour.


    # 16.12 Ownership and Permissions


    Earlier in this chapter, when we tried to cd to root''s login directory, we received
    the following friendly message:


    ```

    [billy@localhost]$ cd /root

    bash: /root: Permission denied

    [billy@localhost]$

    ```'
