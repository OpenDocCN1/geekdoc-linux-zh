    # Handy X-Based Tools


    There are several tools that can make life easier for the new Red Hat Linux system.
    They perform tasks that either require root access, or can only be done by memorizing
    arcane commands. They all require X to run, so all you''ll need to get set is
    these first tools:


    +   **User Information Tool** - Makes it easy to update your "gecos", or basic
    account information. Run `/usr/bin/userinfo` to start it.


    +   **User Password Tool** - Changing passwords is simple with this tool. It''s
    started by running `/usr/bin/userpassword`


    +   **Filesystem Mounting Tool** - Makes making and unmounting filesystems simple.
    Every user-mountable filesystem must have the `user` option present in `/etc/fstab`
    (see the man page for more information on the `user` option). Run `/usr/bin/umount`
    to start it.


    +   **Network Device Tool** - Starting and stopping network interfaces becomes
    a point-and-click operation with this tool. Run `/usr/bin/usernet` to start this
    tool. Requires that every interface to be controlled by `usernet` is configured
    to be "user-controlable". This can be done by using `netcfg`, and selecting the
    Allow you to (de)activate interface checkbox.


    # 18.3 Configuring Your Red Hat Linux System For Sound


    By default, the only sound you''ll hear out of your newly installed Red Hat Linux
    system is the ordinary, boring, beep. If your computer system has hardware, chances
    are you can make it work under Red Hat Linux. In some cases successfully getting
    sound support to work requires a kernel reboot. However, most of the time it''s
    possible to use the modular sound drivers.


    # 18.3.1 Modular Sound Drivers


    Red Hat Linux 6.0 includes the standard OSS/Free sound drivers. This makes it
    possible to load and unload the various sound drivers without recompiling the
    kernel or rebooting.'
