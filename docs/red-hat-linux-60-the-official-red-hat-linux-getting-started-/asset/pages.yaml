    idea to allow these settings.


    Here is a list of some common settings, numerical values and their meanings:


    +   - `-rw----` (600) - Only the user has read and write permissions.

    - `-rw-r--` (644) - Only user has read and write permissions; the group and others
    can read only.

    - `-rwx` (700) - Only the user has read, write and execute permissions.

    - `-rwxrxr-x` (755) - The user has read, write and execute permissions; the group
    and others can only read and execute.

    - `-rw-xr--x` (711) - The user has read, write and execute permissions; the group
    and others can only execute.

    - `-rwxrwxrwx` (777) - Everyone can read, write and execute. Another bad idea.


    Here are a couple settings for directories:


    +   - `drwx------` (700) - Only the user can read, write in this directory.

    - `drwx-xr-x` (755) - Everyone can read the directory, but its contents can only
    be changed by the user.


    **Summary:** You can change permissions with the `chmod` command by using letters
    or numbers. Type `chmod (permissions)` file to change permissions of a file or
    directory.


