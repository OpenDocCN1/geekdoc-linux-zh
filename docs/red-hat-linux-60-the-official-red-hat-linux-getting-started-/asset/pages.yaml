  md: '# # Chapter 14. The GNOME Calendar


    # ## Introduction


    The GNOME Calendar is a simple calendar applications which can be quite useful
    in your daily work. The Calendar, like the rest of GNOME, is in its infancy while
    it is a very useful application, there will be some very impressive functionality
    that will come like network shared calendar usage, and syncing capability with
    Palm Pilots and other hand held PDAs.


    The Calendar is broken up into four main tabs: Day, Week, Month, and Year. Each
    view allows you to view the respective time period but will also allow you to
    schedule appointments from any one of the tabs.'
