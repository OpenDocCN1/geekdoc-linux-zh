  md: '# Chapter 6. The GNOME Desktop


    # Introduction


    The GNOME Desktop provides you with all the functionality of any traditional operating
    system desktop. You can drag files, programs and directory folders to the desktop;
    you can also drag those items back into GNOME-compliant applications.


    > **IMPORTANT:** The GNOME Desktop is actually provided by a backend process in
    the GNOME File Manager. If, for any reason, that backend process has stopped running
    you may may start the GNOME File Manager again and your desktop will be restored.
    If you have to do this you will not need to keep the GNOME File Manager window
    open to enable the desktop.


    # Using the Desktop


    Using the Desktop is as simple as dragging items you wish to use routinely to
    the desktop. The default desktop will include a folder of'
  merge: -1
  pgno: 73
- img_proc: true
  md: '# Chapter 6. The GNOME Desktop


    your home directory (/home/[user name]|). By default the GNOME File Manager window
    will also appear for you to access other areas of your system.


    To utilize drag and drop you need to be using either a GNOME compliant application
    or a Motif application. GNOME is compliant with Motif drag and drop so you will
    find it works with many applications you already have installed.


    All items that are stored on your desktop are located in the following directory:


    ```

    $/home/[user name]/.gnome-desktop/

    ```


    This is helpful to remember when you want an item to appear on your desktop that
    you cannot utilize drag and drop with.


    Once you have started GNOME you will notice that any drives you have connected
    to your system will be shown on your desktop with the appropriate icons. You may
    mount and access these drives utilizing these icons.


    > **IMPORTANT**: You must have permission to mount the device shown on your desktop
    before you can utilize these icons. You must have the root password to accomplish
    this. If you do not have this password you should consult your system administrator.'
  merge: -1
