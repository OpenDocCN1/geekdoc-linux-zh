  md: '# Chapter 5. Using the GNOME Panel


    # Introduction


    The Panel is the heart of the GNOME interface and acts as a repository for all
    of your system applications, applets, and the Main Menu. The Panel is also designed
    to be highly configurable. The Panel gives you a place that always contains menus
    and applications as you want them to be.


    # The Basics


    Using the GNOME Panel is very simple and will come easily to anyone who has used
    a graphical based operating system. You may add new panels, add applications to
    the panel, and add various applets. All of these functions and more will be described
    in this section.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# Chapter 5. Using the GNOME Panel


    # Using the Main Menu


    To start using any pre-loaded application press the Main Menu Button. The Main
    Menu has the picture of the stylized foot and on first use is on the bottom left
    of the screen. You should release the mouse button after pressing the Main Menu
    button so that you can take advantage of other features in the Main Menu such
    as right mouse clicks and drag and drop from the menu.


    Figure 5-1. The Main Menu Button


    ![](img/dad6d2b5926ba9b091aa8c2b848a66ae_60_0.png)


    The Main Menu is the starting point for all of the applications on your system.
    Later in this manual you will learn how to customize the Main Menu to suit your
    work environment, but for now you can use the menu that is established when you
    install GNOME. The Main Menu works like any other menu you might have used in
    other graphical desktop environments. Simply press the Main Menu Button and select
    from the menu that pops up from the button.'
  merge: -1
  pgno: 60
- img_proc: true
  md: '# Hiding the Panel


    At any time you may hide the GNOME Panel by pressing the Hide Button


    Figure 5-2. The Hide Button


    ![](img/dad6d2b5926ba9b091aa8c2b848a66ae_61_0.png)


    This will hide the GNOME Panel in the direction of the arrow on the Hide Button.
    There are hide buttons on both sides of a Panel so you can hide it in either direction.


    You may decide that you want the Panel to hide on its own when you are not using
    it. This can be a helpful function if you are unable to run your system in a high
    resolution. You can find out how to autohide the Panel in Chapter 8.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# Moving and Adding Panels


    Any Panel you have on your desktop can be moved by using the middle mouse button,
    or by simultaneously pressing the left and right mouse buttons, to drag the panel
    to the desired edge of your screen. If you do not have a middle mouse button or
    did not configure your mouse to emulate a middle button you may also move a Panel
    by changing its location in the Panel Configuration dialog. You can read more
    in Chapter 8 of this documentation.


    You may also add a new Panel to your desktop by selecting the Add New Panel from
    the Main Menu | Panel menu. You will be given a choice of Edge or Corner Panels.
    Both of these Panel types are described below.


    +   Edge Panel - An Edge Panel is exactly like the main Panel that starts up with
    GNOME. By selecting this type of panel you may add a new Panel to another edge
    of your screen to give yourself more functionality.


    +   Corner Panel - The Corner Panel is a small Panel that will not stretch to
    the extent of the edge of the screen it is on. The Corner Panel will, however,
    stretch to the extent of icons and applets it contains. The hide buttons work
    just a bit differently with Corner Panels. The hide button closest to the edge
    of your screen will hide'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'the Panel as usual but the other hide button will send the whole panel to the
    opposite edge. When the latter move is made it will not hide the Panel since it
    is changing the side of the screen it resides on. If you want to hide it you will
    have to press the hide button once again.


    At any time you can change the current panel to the opposite type by selecting
    either the Convert to edge panel or the Convert to corner panel from the pop-up
    menu. The selection that is available depends which type of panel you right mouse
    click on. The selection displayed will be the opposite of the current panel.


    # Adding Applications and Applets to the Panel


    # Adding Application Launchers


    If you would like to add an Application Launcher (an icon that starts a particular
    application) to the Panel, right mouse click the Panel and select Add New Launcher
    from the pop-up


    After selecting the Add New Launcher menu item you will see a'
  merge: -1
  pgno: 63
- img_proc: true
  md: 'dialog which will allow you to set the properties for the application launcher
    you wish to add.


    Figure 5-3. The Create Launcher Dialog


    ![](img/dad6d2b5926ba9b091aa8c2b848a66ae_64_0.png)'
  merge: -1
  pgno: 64
- img_proc: true
  md: 'In the Create launcher applet dialog you may be add a name for your launcher,
    a comment, the command line to launch the application, and define the application
    type. You may also press the icon button and choose an icon to represent the application
    from the icon picker. If no icon is chosen a default icon will be used.


    Another, quicker method of adding an application launcher to the Panel is to go
    into the Main Menu and right mouse click on an application menu menu item. You
    will be given another menu selection which contains Add this launcher to Panel.
    If you select this menu item it will automatically add a launcher for that application
    to the Panel in which you invoked the Main Menu. At this point you may right mouse
    click on the launcher and select the Properties menu item to change any options
    for that launcher.


    # Grouping Items with Drawers


    If you would like to group a subset of applications together you may use a Drawer.
    A Drawer is simply a small menu-like button that sits on your panel that groups
    application launchers together is one place. Once you have placed a Drawer on
    the Panel you may click on it to'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'raise the menu of applications and click again to lower them.


    Figure 5-44. A Drawer Running on the Panel


    ![](img/dad6d2b5926ba9b091aa8c2b848a66ae_66_0.png)


    There are a couple of ways to place Drawer on your Panel. First you may right
    mouse click on the Panel and select the **Add drawer** from the **pop-up** menu.
    Second, if you want a whole subset of menus from the Main Menu to become a drawer
    you may right mouse click on the title bar of that menu and select the **Add this
    as drawer to panel** from the **pop-up menu**.'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'You can add menus to your panel in the same way you add Drawers. Menus are
    very similar to Drawers except that they do not use large icons to represent application
    launchers, instead they use a style similar to the Main Menu, i.e. small icons
    and the application name. You may add a menu by right mouse clicking on the title
    bar of a menu and select the Add this as menu to panel from the pop-up menu. You
    may also add system directories to the Panel as menus by dragging a directory
    out of the GNOME File Manager and dropping it on the Panel.


    # # Adding Applets


    There are many applets which you can add to the Panel as well. Applets are small
    applications which can perform tasks within the Panel itself. There are many applets
    you can add to the Panel and these are covered in more detail in Chapter 12 of
    this manual. As an example of how to add an applet you can add another clock applet
    to your Panel. To add the clock applet to your Panel:


    +   - Right mouse click on the Panel

    - From the pop-up menu choose the Add new applet item.

    - This will bring up more levels of pop-up menus.'
  merge: -1
  pgno: 67
- img_proc: true
  md: '+   - Choose the Utility | Clock menu item.


    +   - The Clock will be added to your Panel.


    Figure 5-5. The Clock Applet


    ![](img/dad6d2b5926ba9b091aa8c2b848a66ae_68_0.png)


    To remove the clock applet you added you can right mouse click on the clock and
    select **Remove from panel** from the **pop-up** menu.


    # # Running Applications


    There are many ways to launch applications within GNOME. Remember that one of
    GNOME’s strong points is that it allows you to start and control applications
    using only an easy-to-use graphical interface. There are many ways to start the
    applications you wish to use:'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'Chapter 5. Using the GNOME Panel


    As you saw in the previous section you may use the Main Menu to find applications
    which have been pre-loaded or you provided using the Menu Editor. You can read
    more about the Menu Editor in the Chapter 9.


    You may also add application launchers from the Panel which was covered in the
    section called Adding Application Launchers.


    If you are using the GNOME File Manager you may double click on any executable
    file and it will run.


    You may use the GNOME Run program to launch any application. To use it the Run
    program menu item from the Main Menu. This will launch a simple dialog which allows
    you to type in the command for launching the application. For example, if you
    wish to start the Emacs editor and it is not in a menu or on your panel you may
    start the GNOME Run Program and type emacs in the text box on the dialog.


    # Logging Out of GNOME


    GNOME has a couple of helpful methods for Logging out. You may either use the
    Logout menu item or the Logout button.


    The Logout menu item is the first menu item you will find in the Main Menu. Simply
