    You''re home.


    Using the absolute path is just one way to move around. Another method of getting
    from one point to another is by using the relative path (as in Figure 16.3).


    Let''s go back to the root directory:


    ```

    cd /

    ```


    Now, let''s move back to your login directory using relative pathnames:


    ```

    cd home/billy

    ```


    Notice that the / is missing? That''s because the root directory is the parent
    of the home directory, which means that the home directory is one step down from
    the root directory. Since home is the parent of the directory called billy, these
    two directories are separated by a /.


    If you''re in your login directory, you can move up one directory, to home, just
    by typing:


    ```

    cd ..

    ```


    The relative path describes the directory you want to cd to in terms which are
    relative to your current directory.


    When you typed cd ..., you were saying “go up one directory.” The next directory
    up, from your login directory, was home.


    > Tip: When speaking of directories which hold hold other directories, you can
    refer to them as parent directories. In our case, home is the parent directory
    of billy.


