  md: '# # Chapter 3. Window Managers and GNOME


    # ## About Window Managers


    The window manager is the piece of software that controls the windows in the X
    window environment. The placement, borders, and decorations of any window is managed
    by the window manager. This is very different from many other operating systems,
    and the way GNOME deals with window managers is different from other desktop environments.


    As stated earlier in this guide, GNOME is not dependent on any window manager.
    This means that major parts of your desktop environment will not change when you
    decide to switch window managers. GNOME works with the window manager to give
    you the easiest work environment you can have. GNOME does not worry about window
    placement but gets information from the window manager about their placement.
    The GNOME Pager will only work with a GNOME compliant window manager as will drag
    and drop on the desktop.'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'At the time of this version of the GNOME User’s Guide the Enlightenment Window
    Manager is the only window manager that is 100% compliant. There are many other
    window managers that are partially compliant or are being worked to to meet compliance.


    Some of the window managers that have partial to full compliance at the time of
    this version of the GNOME User’s Guide are:


    +   - Enlightenment - http://www.enlightenment.org

    - Icewm - http://www.kiss.uni-lj.si/~k4fr0235/icewm/

    - Window Maker - http://www.windowmaker.org

    - FVWM - http://www.fvwm.org/


    # Changing Window Managers


    At any time you may change the window manager you are using by utilizing the Window
    Manager Capplet in the GNOME Control Center. You may read more about this Capplet
    in the section called Window Manager Capplet in Chapter 10


    > IMPORTANT: Keep in mind that the window manager you choose to use may not be
    compliant with GNOME and you may not'
  merge: -1
  pgno: 25
- img_proc: true
  md: benefit from some of GNOME features if you use it.
  merge: -1
