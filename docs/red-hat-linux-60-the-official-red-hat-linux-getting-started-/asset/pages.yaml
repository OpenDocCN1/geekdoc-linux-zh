  md: '# Making a New Appointment


    There are many methods for making a new appointment in the GNOME Calendar. the
    easiest by pressing the New button on the button bar. Whenever you make a new
    appointment you will launch the Create New Appointment dialog that allows you
    to set the properties of that appointment. The Create New Appointment dialog is
    broken into two different tabs, the General and the Recurrence tabs.


    General - The General tab is the area in which you define the appointment and
    is set reminders for yourself. There are four different areas on the General tab:
    Summary, Time, Alarms, and Classification.


    +   Summary - The Summary box allows you to type a description of the description.
    Keep in mind that only a portion of this description will be available in the
    Week and Month Views.


    +   Time - The Time area allows you to set the time range for the appointment
    by selecting the date and hours. Beside each start and end days there is a small
    selection box named Calendar. This will bring up a small Calendar when pressed.
    You may select the start and end date in the small calendar. Beside the start
    and end there is a small button which will display the hours of the day when pressed.
    Each hour in the list will have a sub menu displaying each quarter hour so you
    may select them.'
  merge: -1
  pgno: 197
- img_proc: true
  md: 'Alarms - The Alarms area allows you to set up an alarm to remind you of an
    appointment. There are four different types of alarms you may use to remind yourself
    of appointments: Display, Audio, Program, and Mail. The Display alarm will display
    a message on your screen in the time you set. The Audio alarm will play an audio
    file in the time you set. The Program alarm will run a program you specify in
    the time you set. The Mail alarm will send email to the user specified in the
    time you set.


    Recurrence - The Recurrence tab allows you to specify how often an appointment
    should recur, if at all. The first property you should set if you want a recurring
    appointment is the Recurrence rule. You may choose among None, Daily, Weekly,
    Monthly, and Yearly. For each selection you may adjust the recurrence properties
    for your selection. In the Ending date area you may set a rule which will stop
    the recurrence of your appointment or allow it to repeat forever. In the Exceptions
    area you may make exceptions to the recurring appointment by selecting the date
    pressing the Add button.'
  merge: -1
