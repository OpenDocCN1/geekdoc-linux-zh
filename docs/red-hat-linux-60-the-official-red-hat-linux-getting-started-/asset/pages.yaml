  md: '# Using the GNOME Calendar


    Using the GNOME Calendar is quite simple and most tasks can be performed from
    any of the major views, Day, Week, Month or Year. Probably one of the most important
    features to remember is that at any time you may right mouse click on a particular
    day and add a new appointment. There are many other features which will be described
    in each of the major views.


    # The Day View


    The Day tab is probably the most useful view in the GNOME Calendar as it acts
    just as a day timer would. On the left of the tab is the hour listing for the
    current day. The light grey coloring in the hour list separates the work hours
    from the non-work hours. If you would like to change the work hours displayed
    in light grey you can do so in the section called Setting Up the GNOME Calendar.'
