  md: '# 17.3 Command History and Tab Completion


    Voila! We now see the contents of sneakers.txt.

    The bash shell can store up to 1,000 commands.


    > Tip: By typing the env command at a shell prompt, we can see the environment
    variable that controls the size of the command-line history. The line which reads,
    "HIST-SIZE=1000" tells us that bash will store 1,000 commands in its history.


    The command-line history is actually kept in a file, called .bash_history in our
    login directory. We can read it in a number of ways: by using pico, cat, less,
    more, and others.


    Be prepared, though; the file can be pretty long.

