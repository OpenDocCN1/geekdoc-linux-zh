  md: '# Chapter 11. A Word About Session Management


    # Introduction


    You might have seen a little bit about session management when you read about
    GNOME. Session management can be a very useful tool for you in your use of GNOME
    and GNOME applications.


    The main idea of session management is that your work will be saved whenever you
    log out of GNOME. Your GNOME "Session" is currently saved when you log out, however
    you may not notice all that it can do.


    Probably one of the most useful features of session management is the ability
    to start applications you had open when you logged out of GNOME. This is easily
    demonstrated as you exit GNOME and enter again. You will see your applications
    re-appear in the same location on your desktop as they were when you logged out.


    If there are certain applications you wish to start up whenever you log in, even
    if they were not open the last time your session was saved, you may add them to
    the Session Manager Capplet which can read'
  merge: -1
  pgno: 155
- img_proc: true
  md: 'about in the section called Session Manager in Chapter 10.


    **IMPORTANT:** If you have heard about application data being session managed
    you have heard about the future of GNOME. For application data to be saved correctly
    you must be using a fully compliant GNOME application. At the time of publication
    of this manual there were not any applications that offer full session management
    for your data, so until there are some and you are aware of its capabilities you
    should not rely on session management to save your application data.


    # # Resetting the GNOME Session


    One advanced feature of the GNOME Session Manager is the ability to recover a
    "clean session" if anything goes wrong for you. To do this you must hold down
    the **CTRL** and **SHIFT** keys together when you log in to GNOME.


    This will bring up a dialog box which gives you two different options for restoring
    your GNOME Session.


    The first option is to Start with default programs. This option will remove all
    of the session configuration setting in respect to applications. This will only
    erase the GNOME session data for'
  merge: -1
  pgno: 156
- img_proc: true
  md: 'applications you had running when you logged out last, it will not change any
    information you may have set in the Session Manager Capplet in the GNOME Control
    Center.


    The second option is to Reset all user settings. This will reset all GNOME application,
    and core configuration data. This option will destroy any configurations you have
    made to the Panel, the GNOME File Manager, the Session Manager Capplet, and any
    GNOME application. This option will not remove files on your desktop.


    > **IMPORTANT:** These options are for advanced users and should only be used
    in case there is a problem with your GNOME Session. You can lose data for many
    applications if you utilize the functionality provided by these options.'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# Figure 11-1. Login Screen for Resetting GNOME Session


