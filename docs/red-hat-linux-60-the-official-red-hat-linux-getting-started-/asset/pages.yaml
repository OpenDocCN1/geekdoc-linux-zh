  md: '# Chapter 9. Editing the Main Menu


    # Introduction


    The Main Menu is a repository for your applications and can be found on the Panel.
    The Main Menu is preloaded with GNOME but can be configured to fit your work habits.
    The Main Menu is broken up into two main subdirectories: the System menus and
    the User menus. The Menu Editor is available for you to add new applications to
    the Main Menu but you can not add applications to the System menus if you are
    not the system administrator (root). In this section you will learn how to configure
    the Main Menu with applications you wish to use everyday.


    # Configuring the Main Menu


    If you want to change properties of the Main Menu or any other menu you have on
    your Panel you may right click on the menu button and select Properties. This
    will launch the Menu properties dialog.'
