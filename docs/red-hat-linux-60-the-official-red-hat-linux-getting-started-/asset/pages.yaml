- img_proc: true
  md: '# Chapter 6. The GNOME Desktop


    Gaining mount access can be done quite easily if you have linuxconf installed
    on your machine. Just select the drive you want to access in the Access local
    drive section. In the Options tab select the User Mountable option. Your drive
    will now be mountable by users.


    If you do not have linuxconf you must edit your /etc/stab to include user access.
    This is done by adding user access to the drive. For Example:


    If your fstab file looks like this:


    ```

    /dev/cdrom /mnt/cdrom iso9660 exec,dev,ro,noauto 0 0

    ```


    Add "user" to the fourth column:


    ```

    /dev/cdrom /mnt/cdrom iso9660 user,exec,dev,ro,noauto

    ```


    There could be some security risks involved with this depending on your system
    and work environment. Please consult your system administrator before making any
    drive mountable.


    Once you have permission to mount a drive you may right mouse click on the drive
    icon on your desktop. This will bring up a small pop-up menu.'
  merge: -1
  pgno: 75
- img_proc: true
  md: 'You may select Mount device to mount it and Eject device to eject it. Once
    it is mounted you may either double-click it or choose Open from the pop-up menu
    to open and GNOME File Manager window to view the contents of the device.


    If you are missing any drives that you might have added to your machine you may
    right mouse click on an empty space on the desktop and choose the Rescan Mountable
    Devices menu item from the pop-up menu.


    # Desktop Areas


    Desktop areas allow you to keep a well organized system when you have many tasks
    to perform at one time. Just like adding a new desk when you have too much for
    one, desktop areas allow you to move to another area to launch more programs.


    GNOME is aware of desktop areas even though they are controlled by another software
    program called the ‘window manager’. You can set the number of desktop areas within
    the configuration of the window manager you are using. If you are using the default
    window manager or your window manager has a graphical configuration tool you may
    be able to launch it from the Window Manager Capplet. You may read more about
    this Capplet in the section called Window Manager'
  merge: -1
  pgno: 76
- img_proc: true
  md: '# Other Desktop Menus


    IMPORTANT: Most window managers will give you the option of having multiple desktops
    which are different from desktop areas. Desktop areas are virtual extensions of
    one desktop whereas multiple desktops are actually separate.


    The default setup of GNOME is to use desktop areas with only one desktop. The
    reason for this is because in older applications, such as those which use Motif,
    users can experience problems with some drag and drop functionality across desktops.


    There are a few desktop menus you may choose from in GNOME. These menus are accessed
    by making a right-button mouse click on any clean space on the desktop. This will
    bring up the pop-up menu which contains a few items:


    +   * New | Terminal - This will launch a new GNOME Terminal window that will
    automatically navigate to the ~/.gnome-desktop directory.'
  merge: -1
  pgno: 77
- img_proc: true
  md: '+   - New Directory - This allows you to create a new directory on your desktop.
    This can be a convenient tool to use if you wish to clean up your desktop by placing
    files in a new directory.


    +   - New Launcher - This allows you to place a new application launcher on the
    desktop. When you select this menu item it will launch an Application Launcher
    dialog that allows you to specify which application and its properties.


    +   - New [application] - Some applications may put items for you in the New menu.
    For example, the Gnumeric Spreadsheet menu item in the New menu so you can start
    up a new spreadsheet easily.


    +   - Arrange Icons - This will automatically arrange your desktop icons.


    +   - Create New Window - This will launch a new GNOME File Manager window displaying
    your Home directory.


    +   - Rescan Mountable Devices - This will rescan the mountable devices on your
    machine and display an icon for any new device it might find.


    +   - Rescan Desktop - This will rescan the files in your ~/.gnome-desktop directory.'
  merge: -1
