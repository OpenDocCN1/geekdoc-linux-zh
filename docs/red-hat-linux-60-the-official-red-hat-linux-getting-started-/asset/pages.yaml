  md: '# Chapter 9. Editing the Main Menu


    On the left side in the menu tree you will notice that there are two main menu
    lists, one for User Menus and one for System Menus. The User Menus are for the
    current user and the System Menus are for all users on the system. The prepackaged
    applications are all located in the System Menus.


    Within the menu list on the left side you may open and close folders and see what
    is in your current menu by clicking on the small plus signs beside the menus.


    # Adding a New Menu Item


    If you want to add a new menu item press the New Item button on the toolbar. A
    new menu item will be placed where the highlighted menu is. If you do not have
    a menu highlighted it will be placed at the top of the menu tree. Select the new
    item and type in the information for the item in the dialog on the right. Once
    the information is complete press the Save button and the new menu item will be
    inserted where your cursor is on the right side menu tree. You may then move the
    item by pressing the up or down buttons on the toolbar. You may also move the
    menu item by dragging it with your left mouse button.


    > IMPORTANT: Keep in mind that you can not change the System menus unless you
    are logged in root. If not, you can only add'
