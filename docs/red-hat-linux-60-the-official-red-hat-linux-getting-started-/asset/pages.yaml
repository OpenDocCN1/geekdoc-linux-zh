  md: '+   * Miscellaneous - This tab has miscellaneous Enlightenment behaviors.


    Tooltips ON/OFF & timeout for tooltip pop-up - This controls whether you would
    like tooltips to display on various parts of an Enlightenment-controlled window.
    A tooltip is a small information window which opens when your mouse pointer hovers
    over an element in an application or component. The time slide bar next to the
    button lets you change how long it takes for tooltip to appear once your mouse
    is over a component controlled by E. The speed is measured in seconds.


    Automatic raising of windows after X seconds - This will focus a non-focussed
    window after the seconds you specify when your mouse is over it.


    Transient pop-up windows appear together with leader - If your application brings
    up small pop-up windows as part of its normal function this will ensure that those
    pop-up windows stay with the main window. This can be helpful if your work flow
    is interrupted by the pop-up window showing up on the opposite side of your screen
    while you are working.


    Switch to where pop-up window appears - This will send the mouse cursor and keyboard
    control to any pop-up window that appears on the desktop.'
