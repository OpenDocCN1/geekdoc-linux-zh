- img_proc: true
  md: '# Chapter 4. The Enlightenment Window Manager


    The Desktops Section of E-conf has two main tools to let you change the number
    of areas and desktops you use. The first tool is the Size of Virtual Screen which
    controls the number of desktop areas. Desktop areas are really just one big screen
    broken into many "virtual areas". The advantage of using virtual areas over multiple
    desktops is that drag and drop on the desktop will work across areas as will work
    being done in applications such as the GNOME File Manager. To use this tool slide
    the two sliders until you have the number of virtual areas, across and down, that
    you wish to use.


    The second tool is Separate Desktops, which allows you to set the number of desktops
    you wish to use. Unlike desktop areas these are completely separate desktops.
    To use this tool move the slider up or down until you have the number of desktops
    you wish to use.


    One good way to visualize your multiple areas/desktops situation is to make sure
    you have the GNOME Pager running. The GNOME Pager will show you how many areas
    and desktops you have and where your applications are within those spaces. You
    may also use the GNOME Pager to navigate from area to area and desktop to desktop.
    You can read more about the GNOME Pager in the section called GNOME Pager in Chapter
    12.


    Edge resistance factor for auto flip - If you are using desktop areas you may
    choose to have the areas switch when your mouse goes past the edge of the screen
    in the direction of another area. If you do have this'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'feature on you may change the resistance the mouse has when it is moving past
    the edge by moving the slider to the number of seconds it takes to change to to
    the next desktop.


