    that directory.

    To allow everyone read and write access to the tiger directory in our login directory,
    we just type:


    ```

    chmod -R a+rw tigger

    ```


    But... If we don''t allow others to have execute permission to tigger, it doesn''t
    matter who has read or write access, because no one will be able to get into the
    directory unless they know the exact filename they want.

