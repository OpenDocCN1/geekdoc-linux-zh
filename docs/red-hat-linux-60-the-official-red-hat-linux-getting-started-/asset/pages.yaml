    - .ps - a PostScript file; formatted for printing

    - .au - an audio file

    - .wav - an audio file

    - .xpm - an image file

    - .jpg - a graphical or image file, such as a photo or artwork

    - .gif - a graphical or image file

    - .png - a graphical or image file'
