    This command behaves similar to the command 1 ls -al /etc | more, which you may
    have used in C16 on page 217 to list the contents of the /etc directory then send
    the results through the more command for viewing on the screen.


    > Tip: Remember the distinction of using > and >>: using > will overwrite a file,
    while >> appends the information to a file. Usually, unless you''re certain you
    want to, it''s safer to use >>, because you won''t lose valuable information (though
    you may have to edit the file if you didn''t want to append information to it).


