    # Internet Key Exchange

    The Internet Key Exchange, or IKE, is an important part of IPsec VPN. IKE itself
    is a hybrid protocol and allows for negotiation and authentication of keyed material
    for security associations in a protected manner.


    # Security Associations


    To have secure traffic, there must be two security associations—one for each direction.
    The security association is essentially a one-way channel negotiated by the higher-level
    IPsec system and used by the lower level.

    A security association is defined by three things:


    +   * The destination IP address

    * The protocol (AH or ESP)

    * The security parameter index (SPI)


    An SA can be used in transport mode or tunnel mode. A transport-mode SA is a security
    association between two hosts. A tunnel-mode SA is a security association applied
    to an IP tunnel. If either end of an SA is a security gateway, the SA is a tunnel-mode
    security association. Security association between two security gateways is always
    the tunnel-mode SA, just like an SA between a host and a security gateway.


    # Linux and VPN Products


    Linux has a number of robust VPN solutions, with IPsec support being available
    from the Linux 2.6 kernel series and onward. This section looks at some of the
    Linux VPN software.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# Openswans/Libreswan


    Openswan and its fork Libreswan are open-source implementations of VPN software
    that work very well with Linux. Openswan and/or Libreswan are included with many
    Linux distributions, including Fedora, Debian, Ubuntu, and Red Hat. Openswan/Libreswan
    are among the easier Linux implementations of VPN software to set up. More information
    can be found at http://www.openswan.org/ and https://libreswan.org.


    # OpenVPN


    OpenVPN is a popular VPN implementation for Linux, with software also available
    for Windows and OS X. OpenVPN uses static key and TLS authentication and has a
    variety of options for running a server and client-to-client VPN scenarios as
    well.


    # PPTP


    PPTP support is typically provided by the PPTP daemon, pptpd. Configuring pptpd
    is fairly straightforward but suffers from a lack of overall power by itself compared
    to other Linux VPN server solutions as OpenVPN.


    # VPN and Firewalls


    AVPN can be placed in front of a firewall, be behind a firewall, or part of a
    firewall implementation. Placing the VPN in front of a firewall is not very common.
    It is more common to use a firewall/VPN combo or to put the VPN behind the firewall
    itself.


    Combining a VPN system and firewall is one of the more flexible solutions. It
    requires less hardware but also creates a single point of failure. A more robust
    solution is to have a VPN behind the firewall or as part of a DMZ configuration.


    If your firewall performs NAT, you may run into some troubles with VPN configurations.
    In particular, your firewall must be set up to route packets based on the protocol
    (GRE, AH, ESP) instead of the port packet.


    A NAT/firewall is typically incompatible with the AH protocol regarding the mode
    (transport or tunnel). IPsec VPNs using AH digitally sign the packet, both a hash
    value appended to the packet. AH doesn''t encrypt the packet contents (data payload).
    If a NAT/firewall is between the IPsec endpoints, it rewrites the source address
    or the destination address with one of its own (depending on the NAT setup). The
    VPN at the receiving end tries to verify the integrity of the inbound packet by
    computing its own hash value and complains that the hash value appended to the
    packet doesn''t match. The VPN, unaware of the NAT/firewall in the middle, thinks
    that the packet has been altered.


    You can use IPsec with ESP in tunnel mode with authentication. ESP in tunnel mode
    encapsulates the entire original packet (including headers) in a new IP packet.
    The new packet''s source address is the outbound address of the sending VPN gateway,'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# Chapter 10 Virtual Private Networks


    and its destination address is the inbound address of the VPN at the receiving
    end. When using ESP in tunnel mode with authentication, the packet contents are
    encrypted. The encrypted contents (the original packet), not the new headers,
    are signed with a hash value appended to the packet.


    Integrity checks are performed over the combination of the original header plus
    the original payload. If you are using ESP in tunnel mode with authentication,
    these are not changed by the NAT/firewall.


    A NAT/firewall may interfere with IPsec (both AH and ESP) if it prevents the two
    VPN gateways from successfully negotiating security associations using ISAKMP/IKE
    with X.509 certificates. If the two VPN gateways exchange signed certificates
    that bind each gateway''s identity to its IP address, NAT address rewriting will
    cause the IKE negotiation to fail.


    It is for this reason that combination VPN and firewall configurations are becoming
    so popular. Rules to manage this situation can be set up and maintained easily.


    # Summary


    Virtual private networks are popular because they leverage existing infrastructure
    to provide a seamless network experience to end users. Numerous implementations
    of VPNs are available, taking advantage of the different protocols available for
    creating VPNs. As you would expect, Linux has several options available, Openswan
    and OpenVPN among others.


    Some problems exist when connecting VPNs through NAT-enabled firewalls. This is
    because IPsec creates a digital signature based on the IP header, which is altered
    during the NAT process.'
  merge: -1
  img_proc: true
