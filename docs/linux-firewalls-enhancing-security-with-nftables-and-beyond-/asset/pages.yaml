  md: '# Chapter 3 iptables: The Legacy Linux Firewall Administration Program


    ![](img/48efc603406f52595e8bb3258079832d_82_0.png)


    Figure 3.4 NAT packet traversal

    (Figure based on "Linux 2.4 Packet Filtering HOWTO," v1.0.1, and "Linux 2.4 NAT
    HOWTO," v1.0.1.)


    Note that, for outgoing packets, the routing function is implied between the local
    process and the OUTPUT chain. Static routing is used to determine which interface
    the packet will go out on, before the OUTPUT chain''s filter rules are applied.


    # mangle Table Features


    The mangle table allows marking, or associating a Netfilter-maintained value with
    the packet, as well as making changes to the packet before sending the packet
    on its destination. The mangle table has five built-in chains:


    +   - The PREROUTING chain specifies changes to incoming packets as they arrive
    at an interface, before any routing or local delivery decision has been made.

    - The INPUT chain specifies changes to packets as they are processed, but after
    the PREROUTING chain is traversed.

    - The POSTROUTING chain specifies changes to packets as they are exiting the firewall,

    - The FORWARD chain specifies changes to packets that are forwarded through the
    firewall.

    - The OUTPUT chain specifies changes to locally generated packets.


    For the TOS field, the local Linux router can be configured to honor the TOS flags
    set by the mangle table or set by the local hosts.

    Little information is available about packet marking in the iptables documentation,
    beyond that it''s used by the Linux Quality of Service (QoS) implementation and
    that''s intended as a communication flag between iptables modules.'
  merge: -1
  img_proc: true
