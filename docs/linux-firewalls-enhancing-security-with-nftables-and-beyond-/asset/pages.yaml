    The server is passing along its starting sequence number for all of the connection.


    This first message is the only message the server will send with the SYN flag
    set. And all subsequent messages have the ACK flag in all servers, compared to
    the lack of an ACK flag in the client''s first message, will be a critical difference
    when we get to the information available for constructing a firewall.


    Your machine receives this message and replies with its own acknowledgment, after
    which the connection is established. Figure 1.8 shows a graphic representation
    of this. From here on, both the client and the server set the ACK flag. The SYN
    flag won''t be set again by either program.


    With each acknowledgment, the client and server programs increment their partner''s
    sequence number by the number of contiguous data bytes received, plus one, indicating
    receipt of many bytes of data, and indicating the next data byte in the stream
    the program expects to receive.


    As your browser receives the web page, your machine receives data messages from
