- pgno: 214
  md: "# Chapter 7 Packet Forwarding\n\nFinally, a local caching proxy server is running\
    \ on the firewall machine on port 8080. Internal machines point to the web server\
    \ on the firewall as their proxy, the web server serves outgoing requests on their\
    \ behalf, along with caching any pages retrieved from the Internet. All connections\
    \ to the proxy are via port 8080. Secure web and FTP access to remote sites is\
    \ initiated by the proxy server:\n\nHere's the nftables rule; notice all of the\
    \ destination ports (SMTP, POP, and proxy) are handled in one rule:\n\n```\n$IPT\
    \ -A INPUT -i $LAN_INTERFACE -p tcp \\\n  -s $LAN_ADDRESSES --sport $UNPRIVPORTS\
    \ \\\n  -d $GATEWAY --dport 8080 \\\n  -state --NEW,ESTABLISHED,RELATED -j ACCEPT\n\
    ```\n\n```\nnft add rule if $LAN_INTERFACE \\\n  tcp dport ( 25995, 8080 ) ipaddr\
    \ $LAN_ADDRESSES \\\n  tcp sport $UNPRIVPORTS ipaddr $GATEWAY \\\n  ct state new,established,related\
    \ accept\n```\n\nRemember that the web server will use the FTP pass-mode protocol\
    \ to retrieve data from remote FTP sites. The firewall's external interface will\
    \ need input and output rules to access FTP, HTTP, and HTTPS service ports. The\
    \ gateway must have rules for the external interface to access and local DNS queries\
    \ for remote hosts:\n\n# Configuration Options for Multiple LANs\n\nAdding a second\
    \ LAN allows this example to be developed further. The next example can be better\
    \ secured than the preceding example. As shown in Figure 7.5, the DNS, SMTP, POP,\
    \ and HTTP services are offered from server machines in a second LAN rather than\
    \ the firewall machine. The second LAN may or not serve as a public DMZ. It's\
    \ possible that the second LAN represents an internal service LAN, and its services\
    \ are not offered to the Internet (although, in case, the firewall could be required\
    \ to be a mail gateway, depending on the local firewall configuration). Either\
    \ case, firewall hosts do not typically host services. In this example, traffic\
    \ is routed between the two LANs by the internal interfaces on the firewall machine\
    \ in this example:\n\nThe following variables are used to define the LAN, network\
    \ interfaces, and server addresses:\n\n```\nCLIENT_INTERFACE=\"eth0\" # Internal\
    \ interface to the LAN\nSERVER_INTERFACE=\"eth1\" # Internal interface to the\
    \ LAN\nCLIENT_ADDRESSES=\"192.168.1.0/24\" # Range of addresses used on the client\
    \ LAN\nSERVER_ADDRESSES=\"192.168.3.0/24\" # Range of addresses used on the server\
    \ LAN\nDNS_SERVER=\"192.168.3.2\" # DNS server used by them\n```\n\nThe first\
    \ rule covers all server requests to clients in the client LAN:\n\n```\n$IPT -A\
    \ FORWARD -i $SERVER_LAN_INTERFACE -o $CLIENT_LAN_INTERFACE \\\n  -s $SERVER_ADDRESSES\
    \ -d $CLIENT_ADDRESSES \\\n  -m state --state ESTABLISHED,RELATED -j ACCEPT\n\
    ```"
