- pgno: 301
  md: '# Using TCPDump to Capture Specific Protocols 279


    A trend over the past few years has been protocols that use nonstandard ports
    to circumvent firewalls and packet capturing and filtering. Such programs, including
    much of the peer-to-peer software, can be somewhat difficult to find in dump packets
    because most of the data during the conversation is binary and is not human readable.


    # Capturing a DNS Query


    TCPDump handles DNS queries a little differently from a packet that''s simply
    TCP. More information can be gained from just the initial packet result line as
    opting to making it necessary to increase the sniff with the -s option. For example,
    consider the following DNS query that was looking for the IP address of a host
    named www.braingia.org:


    ```

    21:38.289121 192.168.1.10.1514 > 192.168.1.1:53 60792+ A? www.braingia.org.

    34) (DF)

    21:38.29568 192.168.1.1.53 > 1/2 A 192.168.1.50 60792*- 1/2

    (118) (DF)

    ```


    In the packet we see 192.168.1.10 on an ephemeral port communicating with a destination
    of 192.168.1.1 on port 53. A query ID is given; in this case it''s 60792. We see
    the query ID is followed by a +. This symbol indicates that the queried asked
    for recursion. The A on the trace line indicates that the query was an address
    query. The query was for www.braingia.org, as is shown, and the size of the query
    is 34 bytes, which does not include IP or UDP.

    The answer comes quickly, as we see in the next line of the trace, which shows
    that the source is now 192.168.1.1 talking to the destination of 192.168.1.10.
    As you can see, the answer was contained in the same query ID, 60792; however,
    time there are two extra characters, the * and the -. In a response indicates
    that this is an authoritative answer, and the - indicates recursion is allowed
    and not set. The next portion of the response, 1/2, indicates the number of name
    server records (2), and the number of additional records (2). The first answer
    given in this case is of type A and 192.168.1.50. Finally, the size of the response
    is 118 bytes.


    # Capturing pings


    Although it may seem innocent enough, ICMP (the protocol before ping) has been
    fairly seen by many to which attack hosts and otherwise wreak havoc. Therefore,
    as a security analyst, an administrator, or a curious bystander, you should know
    that it''s in your best interest to see some of the activity for ICMP through
    TCPDump so that you might be able to spot an anomaly later.


    I''ll go out into a limb and see that ICMP is most used for the simple echo request
    and echo reply provided by ping. However, ICMP can be and is used for more than
    that, including a fast sender when slow down (Source Quench), redirecting to other
    hosts (redirect), and many other areas. Refer to Chapter 1 for more information
    on ICMP, or as always, refer to the original RFC for ICMP for the authoritative
    information on the protocol.'
