    access between the LAN machines and the gateway firewall. (Some parents have reason
    to disagree).


    The assumption in this section is that any public services are hosted on the firewall.
    LAN hosts are purely client machines.The LAN is allowed to initiate connections
    to the firewall, but the firewall is not allowed to initiate connections to the
