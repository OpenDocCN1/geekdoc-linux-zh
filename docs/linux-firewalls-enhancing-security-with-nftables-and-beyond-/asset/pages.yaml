- pgno: 171
  md: '# User-Defined Chains


    149


    ![](img/48efc603406f52595e8bb3258079832d_171_0.png)


    Figure 6.3 Standard chain traversal


    User-defined chains are treated as rule targets—that is, based on the set of matches
    specified in a rule, the target can branch or jump to a user-defined chain. Rather
    than the packet being accepted or dropped, control is passed to the user-defined
    chain to perform more specific matches relate to packets matching the branch rule.
    After the user-defined chain is traversed, control returns to the calling chain,
    and matching continues from the next rule in the calling chain unless the user-defined
    chain matched and took action on the packet.


    Figure 6.3 shows the standard, top-down rule traversal using the built-in chains.
    User-defined chains are useful in optimizing the rule set and are often used.
    They allow the rules to be organized into categorical trees. Rather than relying
    on the straight-through, top-down checkoff list type of matching inherent in the
    standard chain, packet matches can be selectively narrowed down based on the characteristics
    of the packet. Figure 6.4 shows initial packet flow. After all incoming packets
    are performed, packet matching branches off on the destination address in the
    packet.


    Branching is based on destination address in this example. Source address matching
    is done later in relation to specific applications, such as DNS or mail servers.
    In some cases, the remote address will be “anywhere.” Matching on destination
    address at this point distinguishes among unicast packets targeted to this machine,
    broadcast packets, multicast packets, and datap (depending on whether it the INPUT
    or FORWARD chain) packets targeted to internal hosts.


    Figure 6.5 details the user-defined chain for the protocol rules for packets specifically
    addressed to this host. As shown, user-defined chains can jump to other user-defined
    chains containing even more specific tests.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# Chapter 6 Firewall Optimization


    ![](img/48efc603406f52595e8bb3258079832d_172_0.png)


    Figure 6.4 User-defined chains based on destination address


    ![](img/48efc603406f52595e8bb3258079832d_172_1.png)


    Figure 6.5 User-defined chains based on protocol


    This list summarizes the characteristics of user-defined chains from Chapter 3,
    “iptables: The Legacy Linux Firewall Administration Program":


    +   - User-defined chains are created with the -n or --new-chain operation.

    - User-defined chain names can be up to 30 characters in length.

    - User-defined chain names can contain hyphens (-) but not underscores (_).

    - User-defined chains are accessed as rule targets.

    - User-defined chains do not have default policies.'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'Optimized Examples 151


    +   - User-defined chains can call other user-defined chains.

    - If the packet doesn''t match a rule on the user-defined chain, control returns
    to the next rule in the calling chain.

    - The user-defined chain can be exited early, with control returning to the next
    rule in the calling chain, via use of the RETURN target.

    - User-defined chains are deleted with the -X or --delete-chain operation.

    - A chain must be empty before it can be deleted.

    - A chain cannot have any references to it from other chains to be deleted.

    - A chain is emptied specified by name, or all chains are emptied if no chain
    is specified, with the -F or --flush operation.


    The next section takes advantage of user-defined chains and the concepts presented
    in the section on rule organization to optimize the single-system firewall presented
    in Chapter 5.


    # Optimized Examples


    The following shows optimized examples of the firewalls built in Chapter 5. The
    first example is for the iptables-based firewall. If you''re using nftables, you
    can safely skip this section and go to the nftables script example instead.


    # The Optimized iptables Script


    One variable is declared, USER_CHAINS, which contains the names of all the user-defined
    chains used in the script. The chains are listed here:


    +   - tcp-state-flags—Contains the rules to check for invalid TCP state flag combinations.

    - connection-tracking—Contains the rules to check for state-related matches, INVALID,
    ESTABLISHED, RELATED.

    - source-address-check—Contains the rules to check for illegal source addresses.

    - destination-address-check—Contains the rules to check for illegal destination
    addresses.

    - EXT-input—Contains this example, the interface-specific user-defined chains
    for the INPUT chain. The host has one interface connected to the Internet.

    - EXT-output—Contains the interface-specific user-defined chains for the OUTPUT
    chain. In this example, the host has one interface connected to the Internet.

    - local-dns-server-query—Contains the rules for outgoing queries from either the
    local DNS server or local clients.

    - remote-dns-server-response—Contains the rules for incoming responses from a
    remote DNS server.'
  merge: -1
  img_proc: true
- pgno: 174
  md: "# Chapter 6 Firewall Optimization\n\n+   - local-tcp-client-request—Contains\
    \ the rules for outgoing TCP connection requests and locally generated client\
    \ traffic to remote servers.\n\n+   - remote-tcp-server-response—Contains the\
    \ rules for incoming responses from remote TCP servers.\n\n+   - local-tcp-client-request—Contains\
    \ the rules for incoming TCP connection requests and remotely generated client\
    \ traffic to local servers.\n\n+   - local-tcp-server-response—Contains the rules\
    \ for outgoing responses to remote clients.\n\n+   - local-udp-client-request—Contains\
    \ the rules for outgoing UDP client traffic to remote servers.\n\n+   - remote-udp-server-response—Contains\
    \ the rules for incoming responses from remote UDP servers.\n\n+   - EXT-icmp-out—Contains\
    \ the rules for outgoing ICMP packets.\n\n+   - EXT-icmp-in—Contains the rules\
    \ for incoming ICMP packets.\n\n+   - EXT-log-in—Contains the logging rules for\
    \ incoming packets before dropping them by the default INPUT policy.\n\n+   -\
    \ EXT-log-out—Contains the rules for outgoing packets before dropping them by\
    \ the default OUTPUT policy.\n\n+   - log-tcp-state—Contains the logging rules\
    \ for TCP packets with illegal state flag combinations before dropping them.\n\
    \n+   - remote-dhcp-server-response—Contains the rules for incoming packets from\
    \ this host's DHCP server.\n\n+   - local-dhcp-client-query—Contains the rules\
    \ for outgoing DHCP packets.\n\nSome interface-specific flags are prefixed with\
    \ EXT to differentiate them from any user-defined chains rules for any LAN interfaces.\
    \ This firewall example assumes that there is only one interface, the external\
    \ interface. The point is to suggest that different rules and security policies\
    \ could be defined on a per-interface basis.\n\nThe actual declaration in the\
    \ firewall shell script would be as here:\n\n```\nUSER_CHAINS=EXT-input \\\n \
    \ tcp-state-flags \\\n  source-address-check \\\n  dns-server-query \\\n  remote-tcp-client-request\
    \ \\\n  remote-tcp-client-request \\\n  local-udp-client-request \\\n  local-dhcp-client-query\
    \ \\\n  EXT-icmp-out \\\n  EXT-log-in \\\n  log-tcp-state* \\\nEXT-output \\\n\
    \  connection-tracking \\\n  destination-address-check \\\n  remote-dns-server-response\
    \ \\\n  remote-tcp-server-response \\\n  local-tcp-server-response \\\n  remote-udp-server-response\
    \ \\\n  remote-dhcp-server-response \\\n  EXT-icmp-in \\\n  EXT-log-out \\\n```"
