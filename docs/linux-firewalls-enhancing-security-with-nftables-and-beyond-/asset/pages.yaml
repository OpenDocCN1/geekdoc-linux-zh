- pgno: 94
  md: '# Chapter 3 iptables: The Legacy Linux Firewall Administration Program


    only based on the static tuple information, but also within the context of the
    ongoing exchange. In other words, some of the contextual knowledge usually associated
    with the upper TCP Transport layer, and the UDP Application layer, is brought
    down to the filter layer.


    After the exchange is initiated and accepted, subsequent packets are identified
    as part of the established exchange. Associated ICMP messages are identified as
    being related to a particular exchange.


    # Note


    In computer terminology, a collection of values or attributes that together uniquely
    identify an event or object is called a tuple. A UDP or TCP packet is uniquely
    identified by the tuple combination of its protocol, UDP or TCP, the source and
    destination addresses, and the source and destination ports.


    For session monitoring, the advantages of maintaining state information are obvious
    for TCP TCP maintains state information by definition. For UDP, the immediate
    advantage is the capability to distinguish responses from other datagrams. In
    the case of an outgoing DNS request, which represents a new UDP exchange, the
    established session allows an incoming UDP datagram from the host and the original
    message was sent to, within a certain time-limited window. Incoming datagrams
    from other hosts or ports are not allowed. They are not part of the established
    state for this particular exchange. When applied to TCP and UDP,ICMP error messages
    are accepted if the error message is related to the particular session.


    In considering packet performance and firewall complexity, the advantages are
    more obvious for TCP flows. Flows are primarily a firewall performance and optimization
    technology. The main goal of flows is to allow bypassing the firewall inspection
    path for packet. Much faster TCP packet handling is obtained in some cases because
    the remaining firewall filters can be skipped if the packet is immediately recognized
    as part of an allowed, ongoing connection. For TCP connections, flow state can
    be a major win in terms of filtering performance. Also, standard TCP application
    protocol rules can be collapsed into a single initial rule flow. The number of
    filter rules is reduced (theoretically, but not necessarily in practice, as you''ll
    see later in the book).


    The main disadvantage is that maintaining a state table requires more memory than
    standard firewall rules alone. Routers with 7000 simultaneous connections, for
    example, would require tremendous amounts of memory to maintain state table entries
    for each connection. State maintenance is often done in hardware for performance
    reasons, where associative table lookups can be done simultaneously or in parallel.
    When implemented in hardware or software, state engines are capable of reverting
    to the traditional path if memory isn''t available for the state table entry.


    Also, table creation, lookup, and teardown take time in software. The additional
    processing overhead is a loss in many cases. State maintenance is a win for ongoing
    exchanges such as an FTP transfer or a UDP streaming multimedia session. Both
    types of data flow'
  merge: -1
  img_proc: true
