  md: "# EXT-icmp-in and EXT-icmp-out\n\nThese two user-defined chains, EXT-icmp-in\
    \ and EXT-icmp-out, perform the final determination on ICMP packets exchanged\
    \ between the local host and remote machines.\n\nThe EXT-icmp-in chain selects\
    \ the incoming ICMP packets based on the message type. The EXT-icmp-out chain\
    \ selects the outgoing ICMP packets based on the message type:\n\n```\n# Log and\
