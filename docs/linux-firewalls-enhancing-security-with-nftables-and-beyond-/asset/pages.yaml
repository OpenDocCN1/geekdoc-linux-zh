  md: '# Enabling Common TCP Services


    +   - Email


    +   - SSH


    +   - FTP


    +   - Generic TCP service


    Many other services are available that aren''t covered here. Some of them are
    used on specialized servers, some are used by IMAP businesses and organizations,
    and some are designed for local, private networks. Additional LAN and DMZ services
    are covered in Chapter 7.


    # Email (TCP SMTP Port 25, POP Port 110, IMAP Port 143)


    Email is a service that almost everyone knows. How mail is set up on your ISP,
    your connection type, and your choices. Email is sent across the network using
    the SMTP protocol assigned to TCP service port 25. Email is commonly received
    through one of three protocols—SMTP, POP, or IMAP—depending on the services your
    ISP provides and on your local configuration.


    SMTP is the general mail delivery protocol. Mail is delivered to the destination
    host machine, as defined most by the MX record in the DNS for the given domain.
    The endpoint server determines whether the mail is deliverable (addressed to a
    valid user account on the machine) and then delivers it to the user''s local mailbox.


    POP and IMAP are mail retrieval services. POP runs on TCP port 110. IMAP runs
    on TCP port 143. Today''s POP and IMAP protocols are typically run over a secure
    sockets layer (SSL) for encryption. POP/S and IMAP/S run on port 995 and 993 respectively.
    ISPs commonly making incoming mail available to their customers using one or both
    of these two services. Both services are usually authenticated by username and
    password. As mail retrieval is concerned, the difference between SMTP and POP
    is that SMTP receives incoming mail and queues in the user''s local mailbox. POP
    and IMAP retrieve mail to the user''s local mail program from the user ISP, where
    the mail had been queued remotely in the user''s SMTP mailbox. Table 5.2 lists
    the client/server protocols for SMTP, POP, and IMAP. SMTP also uses specialized
    delivery mechanisms that allow local network might, such as ETRN, that effectively
    transfer mail for a given domain local control.


    # Sending Mail over SMTP (TCP Port 25)


    Mail is sent over SMTP. But whose SMTP server do you use to collect your mail
    and send it onward? ISPs offer SMTP mail service to their customers. The ISP''s
    mail server acts as the mail gateway. It knows how to collect your mail, find
    the recipient host, and relay the mail. With UNIX, you can host your own local
    mail server, if your server is responsible for routing the mail to its destination.'
