    # Logging Dropped Packets


    Any packet matching a rule can be logged using the -j LOG target for iptables
    or log statement for nftables. Logging a packet has no effect on the packet disposition,
    however. The packet must match an accept or drop rule. Some of the rules previously
    having logging enabled, before matching the packet second time to drop it. Some
    of the IP address spoofing rules are examples.


    Rules can be defined for the explicit purpose of logging certain kinds of packets.
    Most of interest are suspicious packets indicating some sort of probe or scan.
    Because all packets are denied by default, logging is desired for certain packet
    types, explicit rules must be defined before the packet falls off the end of the
    chain and the default policy takes effect. Essentially, out of all the denied
    packets, you may be interested in logging some of them, using rate-limited logging
    for some, and silently dropping others.


    Which packets are logged is an individual matter. Some people want to log all
    dropped packets. For other people, logging all dropped packets could soon overflow
    their system logs. Some people, see in the knowledge that the packets are dropped,
    don''t care about them and don''t want to know about them. Other people are interested
    in the obvious port scans or in some particular packet type.


    Because of the first-matching-wins behavior, you could log all dropped packets
    with a single rule. The assumption here is that all packet-matching acceptance
    rules have been tested, and the packet is about to drop off the end of the chain
    and thrown away:


    ```

    $IPT -A INPUT -i $INTERNET -j LOG

    ```


    Or for nftables:


    ```

    $NPT add rule filter input iif $INTERNET log

    ```


    # Logging Dropped outgoing Packets


    Logging outgoing traffic blocked by the firewall rules is necessary for debugging
    the firewall walls and to be alerted to local software problems.


    All traffic about to be dropped by the default policy could be logged:


    ```

    $IPT -A OUTPUT -o $INTERNET -j LOG

    ```


    For nftables:


    ```

    $NFT add rule filter output oif $INTERNET log

    ```'
