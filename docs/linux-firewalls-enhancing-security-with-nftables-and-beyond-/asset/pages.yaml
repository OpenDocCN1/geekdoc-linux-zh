    module.


    # Summary


    This chapter covered many features available in iptables—certainly, the features
    most commonly used. I tried to give a general sense of the differences between
    Netfilter and IPFW, if for no other reason to give you a “heads up” for the implementation
    differences that will appear in the following chapters. The modular implementation
    divisions of three separate major tables—filter, mangle, and nat—were presented.
    Within each of these major divisions, features were further broken down into modules
    that provide target extensions and modules that provide match extensions.


    Chapter 5, “Building and Installing a Standalone Firewall,” goes through a simple,
    standalone firewall example. Basic antispoofing, denial of service, and other
    fundamental rules are presented. The purpose of the chapter is not to present
    a general for people to cut and paste for practical use, as much as to demonstrate
    the syntax presented in a functional way. The next chapter, Chapter 4, “nftables:The
    Linux Firewall Administration Program,” introduces the new Netfilter Tables system
    that will serve as a replacement for iptables. Later chapters cover more specifics
    such as user-defined chains, firewall optimization, LAN, NAT, and multihomed hosts.'
