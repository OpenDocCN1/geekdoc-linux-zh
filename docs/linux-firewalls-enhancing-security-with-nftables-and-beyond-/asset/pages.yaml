- pgno: 337
  md: '# Firewall Examples and Support Scripts


    The sample firewalls are presented piecemeal in Chapters 5, 6, and 7. This appendix
    presents the same firewall examples as they would appear in a firewall script.


    # iptables Firewall for a Standalone System from Chapter 5


    Chapter 5 covers the application protocols and firewall rules for the types of
    services most likely to be used on an individual, standalone Linux box.Additionally
    both client and server rules are presented for services that everyone will use.
    This section first presents the iptables script and then the nftables script.


    The complete iptables firewall script, as it would appear in /etc/rc.d/rc.firewall
    or /etc/init.d/firewall:


    ```

    #!/bin/sh

    /sbin/modprobe ip_conntrack_ftp


    CONNECTION_TRACKING="1"

    ACCEPT_AUTH="0"

    SSH_SERVER="0"

    FTP_SERVER="0"

    WEB_SERVER="0"

    SSL_SERVER="0"

    DHCP_CLIENT="1"

    ```'
  merge: -1
  img_proc: true
