- pgno: 125
  md: "# Removing Any Preexisting Rules\n\nThe first thing to do when defining a set\
    \ of filtering rules is to remove any existing rules from their chains. Otherwise,\
    \ new rules that you define will be added to the end of existing rules. Packets\
    \ could easily match a preexisting rule before reaching the point in the chain\
    \ that you are defining.\n\nRemoval is called flushing. For iptables the following\
    \ command flushes all rules from all chains at once:\n\n```\n# Remove any existing\
    \ rules from all chains\n$IPT --flush\n```\n\nSpecific tables can then be flushed\
    \ using the -t <table> option:\n\n```\n$IPT -t nat --flush\n$IPT -t mangle --flush\n\
    ```\n\nFor nftables, the table name needs to be specified, and doing so will flush\
    \ the rules from all chains within the table:\n\n```\nnft flush table <tablename>\n\
    ```\n\nIf you're using the community-standard naming convention, you'll have a\
    \ filter table and possibly a nat table that can be flushed with the following\
    \ commands:\n\n```\nnft flush table filter\nnft flush table nat\n```\n\nOther\
    \ user-defined tables need to be flushed as needed by your specific firewall implementation.\
    \ For nftables, this loop can be used to flush all chains in all tables:\n\n```\n\
    for i in '$NFT list tables | awk '{print $2}'\ndo\n  echo \"Flushing ${i}\"\n\
    \  $NFT flush table ${i}\nndone\n```\n\nA better method is to delete not the rules\
    \ but also the chains and the themselves.This is accomplished with two loops for\
    \ loops over the nftables script:\n\n```\nfor i in '$NFT list tables | awk '{print\
    \ $2}'\ndo\n  echo \"Flushing ${i}\"\n  $NFT flush table ${i}\n  for j in '$NFT\
    \ list table ${i} | grep chain | awk '{print $2}'\ndo\n    echo \"...Deleting\
    \ chain ${j} from table ${i}\"\n    $NFT delete chain ${i} ${j}\ndone\n  echo\
    \ \"Deleting ${i}\"\n  $NFT delete table ${i}\nndone\n```\n\nFlushing the chains\
    \ does not affect the default policy state currently in effect."
  merge: -1
  img_proc: true
- pgno: 126
  md: "# 104 Chapter 5 Building and Installing a Standalone Firewall\n\nFor iptables,\
    \ the next step would be to delete any user-defined chains.They can be deleted\
    \ with the following commands:\n\n```\n$IPT -X\n$IPT -t nat -X\n$IPT -t mangle\
    \ -X\n```\n\nWith nftables, all tables and chains are user defined, so the same\
    \ syntax doesn't really apply. In either case, flushing the chains does not affect\
    \ the default policy state in effect. At this point, you have a basic script that\
    \ defines some variables and clears out tables and chains, if any have been defined.\n\
    \n# Resetting Default Policies and Stopping the Firewall\n\nSo far, the firewall\
    \ has set some defaults that can be used regardless of the state of the Netfilter\
    \ firewall. Before setting the default policies to DROP, I'll first reset the\
    \ default policies to ACCEPT. This is useful for stopping the firewall, as you'll\
    \ be shortly. These lines set the default policy:\n\n```\n# Reset the default\
    \ policy\n$IPT --policy INPUT ACCEPT\n$IPT --policy OUTPUT ACCEPT\n$IPT --policy\
    \ FORWARD ACCEPT\n$IPT -t nat --policy PRERUTING ACCEPT\n$IPT -t nat --policy\
    \ OUTPUT ACCEPT\n$IPT -t nat --policy POSTROUTING ACCEPT\n$IPT -t mangle --policy\
    \ PRERUTING ACCEPT\n$IPT -t mangle --policy OUTPUT ACCEPT\n```\n\nWith nftables\
    \ there is no default policy for a chain in the same sense that there is for iptables,\
    \ and chains and tables have already been deleted.The effect of this is to set\
    \ the policy to ACCEPT since there's no firewall running. Therefore, there's nothing\
    \ to be done for nftables here.\n\nHere's a final addition to what I deem to be\
    \ the beginning of the firewall script, named, the code to enable the firewall\
    \ to be stopped easily.With this code placed below the previous code, when you\
    \ call the script with an argument of \"stop\", the script will flush, clear,\
    \ and reset the default policies and the firewall will effectively stop:\n\n```\n\
    if [ \"$1\" = \"stop\" ]\nthen\n    echo \"Firewall completely stopped! WARNING:\
    \ THIS HOST HAS NO FIREWALL RUNNING.\"\n    exit 0\nfi\n```\n\nPrior to further\
    \ configuration of nftables, the base tables need to be re-created.This can be\
    \ accomplished using an nftables rules file which I'll call setup-tables.The contents\
    \ of the setup-tables rules are:\n\n```\ntable filter {\n    chain input {\n \
    \       type filter hook input priority 0;\n    }\n```"
  merge: -1
