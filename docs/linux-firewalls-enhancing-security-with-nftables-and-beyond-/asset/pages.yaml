- pgno: 271
  md: '# Intrusion Detection Tools


    In the preceding chapter you learned the concepts of intrusion detection and intrusion
    response. Rarely are two attacks exactly the same, though the techniques used
    frequently rely on a common set of methods and result in many of the same symptoms,
    as described in the preceding chapter. Intrusion detection tools are able to assist
    the intrusion analyst with his or her job.


    The intrusion analyst has much to choose from when looking for software tools
    to assist in problem correlation, diagnosis, and resolution. This chapter focuses
    on the software tools used in intrusion detection and tools that can help in any
    administrator’s toolkit. The chapter begins with a look at network sniffers and
    continues through tools to check for rootkits and into filesystem checkers and
    log monitoring.


    # Intrusion Detection Toolkit: Network Tools


    Some of the primary tools of security and network administrators alike are network
    analysis tools. These include network sniffers, intrusion detection software,
    and network analyzers.


    A network sniffer is software that passively listens to traffic received and sent
    by a network interface. TCPDump is simple enough that beginners can quickly get
    it powerful enough to provide the functionality for multiple protocols in multiple
    situations. Using TCPDump, it is possible to view traffic in numerous formats
    including ASCII and use expressions to fine-tune the exact traffic to be viewed
    through the tool.


    TCPDump is manual and intrusion detection software. If you know what you''re looking
    for, TCPDump can help you spot the anomalous traffic as it passes through the
    network. TCPDump in and you won''t know that an attack has passed under your nose;
    that''s the job of the intrusion analyst (as well as other software). However,
    TCPDump almost always becomes an integral tool for investigating attacks because
    it allows the analyst to watch the attack in real time.


    TCPDump is covered in Chapter 13, "Network Monitoring and Attack Detection." There''ll
    find coverage of normal protocol activity, as well as a look at some exploits
    through the eyes, or noise as it were, of TCPDump.


    When it comes to listen to the network and perform some level of analysis on the
    traffic, Snort is an excellent choice. Snort is provider- and enterprise-class
    intrusion'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# Chapter 12 Intrusion Detection Tools


    detection software that''s both widely deployed and mature. Snort works using
    the concept of intrusion signatures. The theory is that many attacks follow the
    same pattern or the same or very similar at the network level.


    Consider this example:Assume that a packet is received on a certain port with
    its header flags set a certain way. When this occurs, it is always a precursor
    to an attack or an attempt to exploit a vulnerability. It can be said that this
    particular attack has, therefore, a signature that identifies it as malicious
    traffic. This signature, unique to the exploit of this vulnerability, can be used
    by software like Snort to detect that there was an attempt to exploit the vulnerability.
    Snort can then perform an action based on this detection (or can take no action).


    ntop is network analysis software, as opposed to the sniffer that produces reports
    of usage based on protocol, flow, host, and other parameters. Using ntop is recommended
    at strategic points in the network to establish a baseline of the normal traffic
    flows over the network.


    I chose ntop because it''s simple to get working quickly. However, I also recommend
    other analysis software for network traffic. Among other analysis software, MRTG
    is another excellent choice for traffic analysis, and RDDTool and Scrutinizer.


    Creating baseline traffic reports and keeping them up-to-date helps not to spot
    anomalies, including unexpected increases and decreases in the traffic, but also
    to track when new bandwidth might be necessary. This dual use—security anomalies
    and bandwidth usage monitoring—makes traffic analysis invaluable.


    To establish baselines and effectively monitor the network for intrusions using
    Snort and TCPDump on large networks, it''s important to place the tools at strategic
    locations within the network. Most large networks (even medium and small ones)
    switches to pass traffic. Understanding the difference between switches and hubs
    is important when considering where to place network tools.


    # Sitches and Hubs and Why You Care


    On a switched network, any network interface would receive only traffic destined
    for it as well as broadcast traffic. In a hub environment the network interface
    receives all traffic, whether that traffic is destined for it or for another device.
    This is why switched networks are faster than hubbed networks—the unnecessary
    traffic isn''t sent to all ports of the switch.


    There are situations in which a network interface might receive all traffic or
    a greater subset merely only in a switched network, such as those when a switch
    is configured to mirror the traffic to a specific port. In this practice it can
    be done, but it may result in performance problems for the switch because it now
    has to copy all traffic to two ports instead of one. Refer to your switch''s documentation
    for more information.


    Regardless of where the traffic originates, it comes to the interface where the
    sniffer is running, the key, at a network level, is to place sniffers and the
    related intrusion detection software in the right locations. For host-based traffic
    sniffing, the placement of the sniffer is obvious, on the host itself.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# ARPWatch


    Another item is to be discussed in Chapter 13 is ARPWatch. ARPWatch is software
    that watches for new devices on the network. ARPWatch can be helpful for auditing
    the devices on the network, especially wireless networks.


    # Rootkit Checkers


    A rootkit is a piece of software or a grouping of software that attempts to exploit
    one or more vulnerabilities with the goal of enabling an attacker to gain elevated
    privileges or perform any other type of attack against the target. Frequently,
    rootkits are used by less skilled attackers who use the software built by another
    attacker but don''t understand the underlying exploit; they''re just interested
    in the results.


    Many rootkits not only run the initial exploit to give the attacker root privileges
    but also attempt to mask or hide the fact that an attack has been launched. They
    do this by deleting log files or entries from log files, planting trojan horse
    verses of programs, and employing other methods. There is also stopping an attacker
    from chain-ing rootkits to multiple levels of deception and possible exploit.


    Like network-centric attacks, rootkits frequently have signatures or leave other
    traces that identify them. These traces and signatures are the aforementioned
    removal of log files, the presence of one or more processes, or others change
    to the system that are specific to the rootkit software or the exploit.


    Also with network-centric attacks, there is software to search for the signatures
    and traces of rootkits as well. One such application is Chkrootkit.


    # Running Chkrootkit


    Before you run Chkrootkit, you need to get it. Chkrootkit can be downloaded from
    http://www.chkrootkit.org/ and is also included as a package with many flavors
    of Linux. After it''s downloaded, Chkrootkit needs to be unarchived and compiled:


    ```

    tar -zvf chkrootkit.tar.gz

    cd chkrootkit-<NNNN>

    make sense

    ```


    Yes, that does make sense in the example. Although Chkrootkit is a shell script,
    some additional functionality is gained by compiling the code. Compiling is not
    required, but because it''s quick and adds some additional levels of checking,
    I recommend doing so. Specifically, compiling Chkrootkit will enable these additional
    checks, though the standard packages from a given operating system may also have
    them:


    +   - ifpromisc

    - chklastlog

    - chkwtmp

    - check_wtmpx'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# Chapter 12 Intrusion Detection Tools


    +   - chkproc

    - chkdirs

    - strings


    Of all the tools used in this book, Chkrootkit is probably the easiest to use.
    To run Chkrootkit, from within the chrootkit source directory you simply type
    this:

    ./chkrootkit | less


    You aren''t required to pipe the output to less, but there is a copious amount
    of output. If you actually want to read the output, you''ll probably need to pipe
    it somewhere—unless, of you have a huge scrollback buffer.


    Because Chkrootkit produces a lot of output, it is wise to pipe the output to
    more or less, depending on your preference. Alternatively, you could redirect
    the output to a file:


    ```

    /chkrootkit > output.txt

    ```


    Chkrootkit will output a number of lines informing you what it is currently checking
    along with the ultimate status of the check. The output will look similar to this:


    ```

    Checking ''amd''... not found

    Checking ''basename''... not infected

    Checking ''biff''... not infected

    Checking ''cifra''... not infected

    Checking ''chsh''... not infected

    Searching for ShitC Worm... nothing found

    Searching for Omega Worm... nothing found

    Searching for Sadmind/IWS Worm... nothing found

    Searching for Monkit... nothing found

    Searching for Showtee... nothing found

    ```


    As you can see from the output sample, it doesn''t appear that any trojaned files
    or rootkits were detected. An infected file or detection of a rootkit will look
    similar to the following:


    ```

    Checking ''bindshell''... INFECTED (PORTS: 1524 31337)

    ```


    Even though the output from Chkrootkit seems to indicate that the computer is
    infected with bindshell, Chkrootkit does produce false positives. However, if
    you see the INFECTED output from Chkrootkit, it is in your best interest to ensure
    that Chkrootkit reported correctly and takes steps to mitigate the damage.


    A false positive occurs when a tool detects and reports a problem in fact there
    is no problem. The underlying cause for false positives varies depending on the
    nature of the software reporting the occurrence. False positives are not as bad
    as false negatives. A false negative occurs when there is a problem but the problem
    is not reported by tools that should find it.


    False positives and negatives are not limited to computing. Imagine the case in
    which a person goes to a doctor and gets an ultrasound scan. Based on the scan
    results, the doctor reports that the person has cancer. However, on further examination
    it appears that the'
  merge: -1
