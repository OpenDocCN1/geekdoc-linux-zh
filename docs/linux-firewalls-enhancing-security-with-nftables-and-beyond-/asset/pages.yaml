    # TCPDump Options


    TCPDump accepts a wide range of command-line options that alter its behavior,
    the amount of data captured, and the way in which the data is captured. A wide
    range of options means that you have the power to significantly change how the
    program operates. For TCPDump, you''ll find you frequently use a common set of
    options for most data capture activities, and you may not use others at all.


    Some of the commonly used options include those listed in Table 13.1. Examining
    each of these options in turn reveals the steps for performing basic packet capture
    and analysis. Not all of these options are required to capture traffic with TCPDump
    (in fact, none of them is required). It''s perfectly valid to simplify the tcpdump
    command on the command line to start capturing traffic. However, in practice many
    of these options are necessary to gain the level of detail needed in order to
    properly analyze the traffic.


    Table 13.1 Some Common Options for TCPDump


    | Option | Description |

    | - | - |

    | -i <interface> | Specifies the interface to use |

    | -v | Produces output in verbose mode |

    | -vv | Produces output in really verbose mode |

    | -x | Causes TCPDump to print the packet itself in hexadecimal format |

    | -X | Causes TCPDump to print the output in ASCII |

    | -n | Tells TCPDump not to perform DNS lookups for the IP addresses seen during
    the capture |

    | -F <file> | Reads the expression from <file> |

    | -D | Prints available interfaces |

    | -s <length> | Sets the length for each packet of the capture to <length> |'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# Chapter 13 Network Monitoring and Attack Detection


    The -i <interface> option changes the default interface on which TCPDump listens
    for packets. By default, TCPDump will listen on the first interface, eth0. However,
    for multihomed machines it may be necessary to use this option so that the traffic
    is captured. For example, on a firewall the eth0 interface may be connected to
    the internal network while the eth1 interface is connected to the Internet. You
    may be interested in using the traffic hitting your external interface (eth1);
    thus you may use the -i <interface> option in TCPDump.


    The verbose mode, -v, -vv, and -vvv (not included in Table 13.1), cause TCPDump
    to print more information (and more and) about each packet received. With -v this
    information includes important things as the TTL, packet ID, length, and options.
    Experiment is usually necessary during a packet capture to determine which of
    these options will suit your needs. Different protocols may not have much (or
    any) additional information to print, so verbosity with switches will not do anything.


    The -x option causes TCPDump to print hex dumps of each packet. For my eyes, this
    option isn''t particularly helpful because I don''t read hex well. However, the
    lowercase -x is required to take advantage of the ASCII dump of the packets that
    can be read by using the uppercase -X. Therefore, I''d rarely use just -x and
    -X. Some parts of the packet may be printed just using -x, using just -X can be
    helpful.


    A sometimes-helpful option for us is the -s <length> option. Using this option
    is helpful to print the contents of packets themselves rather than the default
    68 bytes. If you''re interested in the headers of packets, this option won''t
    be of much, if any, use. If you''d like to peek inside the packet, this option
    will help to ensure that the packet capture isn''t truncated.


    An option that becomes more useful the more you use TCPDump is the -F <file> option.
    This tells TCPDump to read the contents of <file> for the filter expressions or
    expressions that are used frequently (or even infrequently). After using TCPDump
    for a while, you might get tired of typing the old filter expression to capture
    the same packets week after week. Storing that expression in a file and then reading
    the expression from the file when using TCPDump is a great way to save time.


    When starting out with TCPDump, an option that you may find useful is the -D option.
    The -D informs TCPDump which interfaces to perform the packet capture. Because
    packet captures are interface dependent, knowing which interface to use is the
    most important thing you will know. In Linux, it''s easier to choose the right
    interface because interface names are usually simple, like eth0 for the first
    Ethernet card. However, in Windows, -D is much more important because interface
    names can be quite difficult to remember.


    A final worth noting is the -n option. Using -n tells TCPDump not to perform reverse
    DNS lookups on hosts as it sees them during the capture. Reverse lookups frequently
    slows down packet capture and naturally increases the amount of traffic.Therefore,
    adding -n is helpful for speeding up the capture as well reducing the'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# TCPDump: A Simple Overview


    signal-to-noise ratio. When I forget to set the -n option, I sometimes find myself
    asking, “Why is this machine performing DNS lookups?” only to realize that the
    lookups are the result of my packet capture activity.


    # TCPDump Expressions


    Now the fun begins. By default,TCPDump will capture and output every packet that
    hits the interface. This is useful for quickly listening to traffic on a quiet
    interface. However, most captures will make use of expressions in TCPDump. A TCPDump
    expression is a collection of criteria for network traffic that you''d like to
    view in TCPDump. Expressions consist of one or more qualifiers and possibly primitive,
    both of which are discussed in the following subsections. An expression might
    be used to capture only traffic that originates from a certain host or is destined
    for a certain host. The possibilities with expressions and combinations give you
    the ability to hone in on exactly the packets you need to see a given network
    situation.


    One of the more powerful features of expressions is the capability to negate.
    For instance, if you want to listen to all traffic except network traffic on port
    80 (usually HTTP traffic), you could TCPDump capture traffic except which is transmitted
    or received on port 80.TCPDump can use other logical terms as well, such as AND,
    OR, and the already-mentioned keyword NOT.


    TCPDump expressions are enclosed within single quotes ('''') and can be grouped
    together by including the various parts of a given expression within parentheses.
    This means that you can combine multiple expressions to capture only traffic that
    is of interest. The key to grouping expressions together is the use of logical
    AND, OR, and NOT. TCPDump has three qualifiers, each of which is introduced in
    turn in the discussion that follows. The first kind of qualifier is the type qualifier.


    # TCPDump''s Type Qualifier


    Just as TCPDump has three kinds of qualifiers, the qualifier itself contains some
    variations, including host, port, portant, and net. The host is used to specify
    the host or destination of interesting traffic.The type qualifier is not surprisingly
    used to specify the port on which to capture packets, and portant specifies a
    series of ports, such as 5060-5080. The net type is used to specify the subnet
    for interesting traffic. You could use the net in an expression to listen for
    traffic on an entire range of addresses. Of course, there are times when you don''t
    want to listen to an entire range of addresses. TCPDump also accepts the modifier
    mask with the net to specify the subnet mask.


    Before I go further, here''s an example of a TCPDump expression to capture traffic
    on port 80:

    tcpdump ''port 80''


    Because this expression uses only a single criterion (port 80), there''s no need
    to enclose within parentheses. If, however, the goal was to capture traffic on
    port 80 with a source'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# Chapter 13 Network Monitoring and Attack Detection


    or destination of one or more specific hosts, 192.168.1.10 and 192.168.1.11, then
    parentheses would be required, in this example:


    ```

    tcpdump ''port 80 (host 192.168.1.10 or host 192.168.1.11)''

    ```


    Parentheses are required only for logical grouping. In practice, you''ll suffer
    no penalty for using them, and truthfully I normally use them out of habit. When
    writing the preceding simple port 80 example, I included the parentheses at first,
    only to go back and remove them after I thought about what I was doing. habits
    die hard. Speaking of unnecessary terms, the term host in the example isn''t required
    either—more on that.


    Here are some examples using the net qualifier to listen for traffic in both directions
    for the network list:


    ```

    tcpdump ''net 192.168.1''

    ```


    Here''s that example using CIDR notation:


    ```

    tcpdump ''net 192.168.1.0/24''

    ```


    And finally, here''s that same example using the mask modifier:


    ```

    tcpdump ''net 192.168.1.0 mask 255.255.255.0''

    ```


    If you fail to specify a type qualifier (host, net, port, portrange) within a
    TCPDump expression, the host type is assumed. Therefore, don''t be surprised when
    you receive a "parse error" when attempting to something like this:


    ```

    tcpdump ''80''

    ```


    Really, you probably wanted to TCPDump listen for traffic on port 80:


    ```

    tcpdump ''80''

    ```


    # TCPDump''s Direction Qualifier


    Another kind of qualifier within a TCPDump expression is the direction qualifier.
    The previous examples can look for traffic in either direction, coming or going,
    on port 80. For instance, this might mean that traffic destined for a web server
    running at 192.168.1.10 will be captured, but so traffic leaving the computer
    at 192.168.1.11 and destined for another server on port 80 you can also specify
    the direction with to capture traffic using a direction qualifier. The terms src
    for the source and dst for the destination are the two direction qualifiers used
    by TCPDump. Adding the destination to one of the previous examples yields an expression
    that will look for port 80 traffic going going to 192.168.1.10 or 192.168.1.11:


    ```

    tcpdump ''port 80 (src 192.168.1.10 or src 192.168.1.11)''

    ```


    The direction qualifier isn''t limited to looking for traffic on certain addresses.
    It''s perfectly valid to look for traffic with a source or destination of a specific
    port, as in this example that looks for traffic with a destination of port 25
    (usually SMTP):


    ```

    tcpdump ''dst port 25''

    ```'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# TCPDump: A Simple Overview 271


    There are direction qualifiers that are specific to 802.11 wireless link-layer
    traffic. These include ra, ta, addr1, addr2, addr3, and addr4. Additionally, some
    protocols use the terms inbound and outbound to specify the direction. See the
    TCPDump man page for more details on these qualifiers.


    # TCPDump''s Protocol Qualifier


    A final kind of qualifier for use in a TCPDump expression is the protocol qualifier.
    Not surprisingly, protocol qualifiers enable you to choose which protocols should
    be captured with TCPDump, among others, Ethernet (abbreviated ether for TCPDump
    syntax), WLAN, TCP, UDP, ICMP, IP, IPv6 (abbreviated ip6 for TCPDump syntax),
    ARP, reverse ARP (abbreviated to rarp), and more.


    # Primitives


    Aside from the main qualifiers (type, direction, and protocol), there are also
    what known as primitives for use in TCPDump expressions. Primitives are keywords
    that help to specify additional parameters for the packet capture. Some highlights
    of commonly used primitives


    +   - Arithmetic operators

    - broadcast

    - gateway

    - greater

    - less


    The arithmetic operators include +, -, *, >, <, <=, != and a few others. TCPDump
    can use complex arithmetic operators and packet offsets to look into packets.
    I prefer to leave it as an exercise for the reader to dive into these areas if
    they find it necessary to do so.


    The broadcast primitive, when prepended with either ip or ether, will look for
    packets that are IP or Ethernet broadcasts respectively, though ether is the default
    type to look for. For example, aTCPDump expression looking for ip broadcast will
    search for broadcasts on an IP network. However, if the interface on which TCPDump
    is listening has no subnet mask or if any interface is being used, this broadcast
    primitive will not work.


    The primitives greater and less are used to search for packets with a length greater
    than or to less than the given length. These primitives are functionally equivalent
    to using the arithmetic operators for the same. So, for example, the syntax


    ```

    len >= 1500

    ```


    is equivalent to this:


    ```

    greater 1500

    ```'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# Chapter 13 Network Monitoring and Attack Detection


    # Beyond the Basics with TCPDump


    You should now have a feel for the syntax of TCPDump, including some of the options,
    the syntax, and TCPDump expressions. The amount of troubleshooting and diagnosis
    that can be accomplished with even basic grasp of TCPDump makes it an essential
    tool for anyone managing networked computers. However, to examine difficult problems,
    you may find that you need to go beyond the basics of TCPDump.


    Going beyond the basics of TCPDump requires deeper understanding of the protocols
    themselves. Knowing the flags of TCP or the ICMP can help to narrow the focus
    to the packets of interest. Although this information and knowing how to use it
    with TCPDump is not mandatory, the ability to call on the information at any time
    is valuable to save the least. The time to familiarize yourself with TCPDump’s
    more involved syntax. It costs nothing but time to test a packet-filtering expression
    to see how it works under various network conditions.


    # Using TCPDump to Capture Specific Protocols


    In this section, I''ll give some examples that show how to capture various forms
    of network traffic for monitoring purposes. Included among the examples, you''ll
    see a DNS query looks like TCPDump, some ICMP (ping) examples, and various TCP-
    and UDP-based protocols. After you see normal traffic like, I''ll then show you
    the fun stuff. Specifically, I''ll show what types of attacks look like through
    TCPDump so that you might be able to quickly detect these when they come into
    (or out of) your network.


    Throughout this section, I''ll be using a few programs to generate traffic for
    TCPDump to capture. My primary tool for TCP-related captures will be telnet. I''ll
    use telnet to generate traffic and mirror the real protocol (or close to it) in
    the real world. Generation of DNS queries will be accomplished using both the
    dig command and the host command. The ping and traceroute commands will be used.
    Finally, the hping3 command will be used to generate ICMP traffic as well as other
    interesting packets, especially in the attack section. With the exception of hping3,
    all of these programs are installed on most Linux distributions.


    # Using TCPDump in the Real World


    So far in this chapter, you''ve seen a number of examples of using TCPDump to
    capture various types of traffic. These examples were given to show the usage
    of TCPDump in relation to expressions and other options. Now''s time to go real-life
    examples of using TCPDump to capture specific types of traffic. The situations
    in which you might use these examples will vary, but I''ll try to give some clue
    as to why you might use a given example, where I can. It might be helpful to see
    how a filter expression is built when trying to capture in the real world. I briefly
    touched this earlier. However before giving recipe-type solutions, I''ll show
    you how to build a filter with the specific goal of capturing an HTTP conversation.'
  merge: -1
  img_proc: true
