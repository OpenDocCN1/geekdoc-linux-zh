    # Routing: Getting a Packet from Here to There


    Neither a residential site nor most businesses are likely to run routing protocols
    such as RIP or OSPF In these cases, routing tables are set statically, by hand.
    A hint in there. If you''re running a routing protocol such as RIP, changes are
    that you don''t need to be; you could operate a more efficient network without
    unnecessary overhead. Typically, most sites have a default gateway device, which
    is the network that interface packets are sent out on the destination address''s
    route is unknown. The service provider usually provides a single router address,
    which is the default Internet gateway for the site''s local network.


    # Service Ports: The Door to the Programs on Your System


    Server programs (that is, daemons) listen for incoming connections on a service
    port assigned to them. By historical convention, most network services are wellknown,
    or famous, port numbers in the lower range from 1 to 1023.These portnumbertervice
    mappings are coordinated by the Internet Assigned Numbers Authority (IANA) as
    a set of universally agreed-on conventions or standards.


    An advertised service is simply a service available over the Internet from its
    port. If your machine isn''t offering a particular service, and someone tries
    to connect to the port associated with that service, nothing will happen. Someone
    is knocking on the door, but no one lives to answer. For example, HTTP is assigned
    to port 80 (though, again, there''s no reason why you wouldn''t run it on port
    8080, 20943, or any otheravailableport). If your machine isn''t running an HTTP-based
    server and someone tries to connect to port 80, the client program receives a
    connection shutdown message as an error message that the service isn''t offered.


    The higher port numbers from 1024 to 65535 are unprivileged ports.They serve a
    dual purpose. For the most part, these ports are dynamically assigned to the client
    end of a connection.The combination of client and server port pairs, along with
    their respective IP addresses, and the transport protocol used, uniquely identifies
    the connection.


    Additionally, ports in the 1024 through 49151 range are registered with the IANA.
    These ports can be used as part of the general unprivileged pool, but they are
    alsoassociatedwith particular services such as SOCKS or X Window servers. Originally,
    the idea that was services offered on the higher ports were not running with root
    privilege they'
