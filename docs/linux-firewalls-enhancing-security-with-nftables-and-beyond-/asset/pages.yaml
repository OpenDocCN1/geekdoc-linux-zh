- pgno: 105
  md: '# nftables: The Linux Firewall Administration Program


    Chapter 3,"iptables:The Legacy Linux Firewall Administration Program," examined
    iptables, the longtime administration program for Linux firewalls. The syntax
    and many the options within iptables were covered there. This chapter examines
    the new Netfilter Tables (nftables) program. The nftables program became available
    as part of the mainline Linux kernel beginning with version 3.13.


    # Differences between iptables and nftables


    Within the kernel, nftables represents a significant departure from the iptables
    system of filtering nftables replaces the functionality in not only iptables but
    also ip6tables for IPv6, arables for ARP filtering, and etables for Ethernet bridge
    filtering. The syntax of commands for nftables and iptables is different, with
    nftables enabling the use of additional scripting capabilities. The administration
    program for nftables is called nft, and from that command firewalls are built.

    Unlike iptables, nftables does not include any built-in tables. It''s up to the
    administrator to determine which tables are needed and to add those followed by
    the rules for processing. The remainder of this chapter looks at the syntax of
    nftables and its usage to create a firewall.


    # Basic nftables Syntax


    The nft command provides the administrative program that is used to build a firewall.
    The basic syntax of an nftables command begins with the nft program itself, followed
    by a command and subcommand and various arguments and expressions. Here''s an
    example:

    ft <command> <subcommand> <chain> <rule definition>


    The typical commands are


    +   - add

    - list'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# nftables Features


    nftables includes some higher-level programming-like capabilities such as the
    ability to define variables and include external files. nftables can also be used
    for filtering and processing various address families. These address families
    include


    +   - IPv4 addresses

    - IPv6 addresses

    - inet Both IPv4 and IPv6 addresses

    - arp—Address Resolution (ARP) addresses

    - bridge—Processing for bridged packets


    When not specified, the default address family is IP. The capability to process
    different families means that nftables is intended to replace other filtering
    mechanisms such as etables and arptables.


    The overall processing architecture for nftables is to determine the address family
    to which the rule will apply. nftables then uses one or more tables, which contain
    one or more chains, which in turn contain the processing rules. Processing rules
    for nftables are made of expressions such as the address, interface, ports, or
    other data contained in the packet currently being processed and statements as
    drop, queue, and continue.


    > Tip

    Tables contain chains; chains contain rules.


    Address families contain hooks that allow nftables to get access to packets as
    they traverse the network stack in Linux. This means you can perform an operation
    on a packet before it being passed for routing or after it''s been processed.
    For the ip, ip6, and inet families have the following hooks:


    +   - prerouting—Packets that have just arrived and haven''t been routed or processed
    by other parts of nftables.

    - input—Incoming packets that have been received and sent through the prerouting-hook.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# nftables Syntax


    +   - forward—If the packet will be sent to a different device, it will be available

    through the forward hook.

    - output—Packets outbound from processes on the local system.

    - postrouting—just prior to leaving the system, the postrouting hook makes the

    packet available for further processing.


    The ARP address family uses only the input and output hooks.


    # nftables Syntax


    The nft command has a few options available from the command line and

    not directly related to defining filtering rules. This command-line options include:


    +   - --debug <level,[level>-->Add debugging at <level> such as scanner,

    parser, eval, netlink, mnl, segtree, proto-ctx, or all.

    - -h | --help—Show basic help.

    - -v | --version—Show the version number of nft.

    - -n | --numericDisplay address and port information using numbers rather

    than performing name resolution.

    - -a | --handle—Display rule handles.

    - -I | --include<directory>-->Add <directory> to the search path for

    included files.

    - -f | --file <filename>-->Include the contents of <filename>.

    - -i | --interactive—Read input from the command line.


    As previously stated, there are no predefined tables in nftables. As such, it''s
    up to you

    def the tables that you want to use in an nftables system. The commands available

    to a given rule depend on whether you''re working with a table, chain, or rule.


    # Table Syntax


    There are four commands available when working with a table:


    +   - add—Add a table.

    - delete—Delete a table.

    - list—Display all of the chains and rules for a table.

    - flush—Clear all chains and rules in a table.


    You can list which tables are available with the following command (run as root):

    ft list tables


    Remember, there are no default tables for nftables as there were for iptables.

    Therefore, the list tables command can return nothing if no tables have been defined.'
