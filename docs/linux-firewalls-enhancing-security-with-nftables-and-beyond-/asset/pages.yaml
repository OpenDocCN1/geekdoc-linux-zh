- pgno: 122
  md: '# Chapter 5 Building and Installing a Standalone Firewall


    Ideally, you should execute the shell script from the console. Or the brave execute
    the shell script from either a remote machine or an XWindow term session. Not
    only is network traffic blocked, access to the local loopback interface used by
    X Windows is blocked until the interface is explicitly reenabled. This is a typical
    example of software that is not necessary and has been used as a mechanism to
    exploit in servers.


    As someone who manages Linux computers that are geographically hundreds of miles
    away, I can activate a firewall script only from a remote location. In instances,
    it is advisable to do two things. First, change the default policy to ACCEPT for
    the first or few executions of the firewall script. Do this to debug the syntax
    of the script itself, not because it is syntactically correct, change that back
    to DROP.


    A second and just as important for working with scripts from remote locations
    is to create a cron job to stop the firewall at some point in the near future.
    Doing so will effectively allow you to enable the firewall and perform some testing
    but also allow you to get back into the computer if you lock yourself out through
    misplaced (missing) rules. For example, when debugging a firewall, I will create
    a cron entry to disable the firewall every 2 minutes. I can then run the firewall
    script and find whether I locked out my SSH session. If I have locked myself out,
    I merely wait a few minutes for the firewall script to run and shut the firewall,
    giving me the opportunity to fix the script and try again.


    Furthermore, remember that firewalls are applied in the order which you have defined
    them. The rules are applied to the end of their chain in the order which you define
    them. The first matching rule wins. Because of this, firewall rules must be defined
    in the proper order from most specific to more general rules.


    Firewall initialization is used to cover a lot of ground, including global constants
    used in the shell script, enabling kernel support services (when necessary), clearing
    any existing rules in the firewall chains, defining default policies for the INPUT
    and OUTPUT chains, reenabling the loopback interface for normal system operation,
    denying access from any specific hosts or networks you decided to block, and defining
    some basic rules to protect against bad addresses and to protect certain services
    running as unprivileged privileges.


    # Symbolic Constants Used in the Firewall Examples


    A firewall script is easy to read and maintain if symbolic constants are used
    for recurring names and addresses. The following constants are either used throughout
    the chapter or are universal defined in the networking standards. This also includes
    the “shebang” interpreter line from above as a friendly reminder:


    ```

    #!/bin/sh

    INTERFACE="eth0"

    LOOPBACK_INTERFACE="lo"

    IPADDR="my.ip.address"

    ```


