  md: '# Chapter 3 iptables: The Legacy Linux Firewall Administration Program


    With a deny-by-default policy, connection tracking can be used (theoretically)
    to replace all protocol-specific filters with two general rules that allow incoming
    and outgoing packets that are part of an established connection, packets related
    to the connection.Application-specific rules are required for the initial packet.


    Although such stateful setup may work well for a small or a residential site in
    most cases, it is unlikely to perform adequately for a larger site or a firewall
    that handles many connections simultaneously. The reason goes back to the state
    of table entry timeouts, when a state for a quiescent connection is replaced because
    of table size and memory constraints. The next packet that would have been accepted
    by the state deny entry requires a rule to allow the packet, and the state table
    entry must be rebuilt.


    A simple example of this is a rule for a local DNS server operating as a cache-forward
    name server. A DNS forwarding server uses server-to-server communication. DNS
    traffic is exchanged between source and destination ports 53 on both hosts. The
    UDP client/server relationship can be explicit. The following rules explicitly
    allow (NEW) requests, incoming (ESTABLISHED) responses, and any (RELATED) ICMP
    error messages:


    ```

    iptables -A INPUT -m state \

    --state ESTABLISHED, RELATED -j ACCEPT

    ```


    ```

    iptables -A OUTPUT --out-interface <interface> -p udp \

    -s IPADDR --source-port 53 -d $NAME_SERVER --destination-port 53 \

    -m state --NEW, RELATED -j ACCEPT

    ```


    DNS uses a simple query-and-response protocol. But what about an application that
    can maintain an ongoing connection for extended periods, such as an FTP control
    session or a SSH session? If the state table entry is cleared out prematurely
    for some reason, future packets won''t have a state entry to be matched to be
    identified as part of an ESTABLISHED exchange.


    The following rules for an SSH connection allow for that possibility:


    ```

    iptables -A INPUT -m state \

    --state ESTABLISHED, RELATED -j ACCEPT

    ```


    ```

    iptables -A OUTPUT -m state \

    --state ESTABLISHED, RELATED -j ACCEPT

    ```


    ```

    iptables -A OUTPUT --out-interface <interface> -p tcp \

    -s IPADDR --source-port $UNPRIV_PORTS \

    -d $REMOTE_SSH_SERVER --destination-port 22 \

    -m state --state -j ACCEPT

    ```


    ```

    iptables -A OUTPUT --out-interface <interface> -p tcp ! --syn \

    -s IPADDR --source-port $UNPRIV_PORTS \

    -d $REMOTE_SSH_SERVER --destination-port 22 \

    -j ACCEPT

    ```'
