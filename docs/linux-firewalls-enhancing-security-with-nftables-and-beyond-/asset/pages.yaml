  md: '# Initializing the Firewall


    nftables and iptables define port ranges differently. Therefore, the port variables
    must be defined differently for each. For an iptables, the following declaration
    works:


    ```

    PRIVPORTS="0:1023"                # Well-known, privileged port range

    UNPRIVPORTS="1024:65535"              # Unprivileged port range

    ```


    However, for iptables, the colon needs to be changed to a dash, as shown here:


    ```

    PRIVPORTS="0-1023"               # Well-known, privileged port range

    UNPRIVPORTS="1024-65535"             # Unprivileged port range

    ```


    Constants not listed here are defined in the context of the specific rules they
    are used with. One additional constant is needed for iptables or nftables. If
    you''ll be using iptables, define the following:


    ```

    IPT="/sbin/iptables"      # Location of iptables on your system

    ```


    If you''ll be using nftables, define the following:


    ```

    NFT="/usr/local/sbin/nft"      # Location of nft on your system

    ```


    # ## Enabling Kernel-Monitoring Support


    Operating system support for various types of packet checking often overlaps with
    what the firewall can test. When doubt, allow for redundancy or defense in depth.


    From the commands in the following lines, icmp_echo_ignore_broadcasts instructs
    the kernel to drop ICMP echo-request messages directed to broadcast or multicast
    addresses. (Another facility, icmp_echo_ignore_all, drops any incoming echo-request
    message. It should be noted that IPTs often rely on ping to help diagnose local
    network problems, and DHCP sometimes relies on echo-request to address collision.)


    ```

    # Enable broadcast echo protection

    echo "1" > /proc/sys/net/ipv4/icmp_echo_ignore_broadcasts

    ```


    Source routing is used legitimately today. Frequently drop all source-routed packets.
    This command disables source-routed packets:


    ```

    # Disable Source Routed Packets

    echo "0" > /proc/sys/net/ipv4/conf/all/accept_source_route

    ```'
