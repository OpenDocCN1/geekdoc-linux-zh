  md: '# Service Ports: The Door to the Programs on Your System 21


    What happens? As shown in Figure 1.6, a web server is running on a machine-where,
    waiting for a connection request on TCP service port 80. You click on the link
    for a URL in your web browser. Part of the URL is parsed into a hostname; the
    hostname is translated into the web server''s IP address; and the server is assigned
    an unprivileged port (for example, TCP port 14000) for the connection. An HTTP
    message for the web server is constructed. It is encapsulated in a TCP packet,
    wrapped in an IP packet header, and sent out. For our purposes, the header contains
    the fields shown in Figure 1.6.


    Additional information is included in the header that isn''t visible at the packet-filtering
    level. Nevertheless, describing the sequence numbers associated with the SYN and
    ACK flags clarify what''s happening during the three-way handshake. When the client
    first connection request, the SYN is accompanied by a synchronization sequence
    number. The client is requesting a connection with the server and passes along
    a sequence number it will use as the starting point to number the rest of the
    bytes the client will send.


    The packet is received at the server machine. It serves to service port 80. The
    server is listening to port 80, so it''s triggered by an incoming connection request
    (the SYN synchronization request flag) from the source IP address and source port
    pair (your IP address, 14000). The server allocates a new socket on its end (web
    server IP address, 80) and associates it with the client socket.


    The server responds with an acknowledgment (ACK) to the SYN message, along with
    its own synchronization request (SYN), as shown in Figure 1.7. The connection
    is now half open.


    Two fields not visible to the packet-filtering level are included in the SYN-ACK
    header. Along with the ACK flag, the server includes the client''s sequence number
    incremented by


