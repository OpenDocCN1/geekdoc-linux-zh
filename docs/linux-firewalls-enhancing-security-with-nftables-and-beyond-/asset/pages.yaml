  md: '# Chapter 12 Intrusion Detection Tools


    Nmap is available as a package on many popular Linux distributions. If Nmap isn''t
    available on your distribution, it can be downloaded from http://www.nmap.org/.\Nmap
    includes many options for probing hosts and entire networks. These options are
