    The TCP header is shown in Figure 1.5.


    As you can see from Figure 1.5, the 20-byte TCP header is significantly more complicated
    than the other protocol headers in this chapter. Like the UDP header, the TCP
    header begins with both the source and the destination ports. The combination
    of the source and destination ports along with the IP addresses of the sender
    and receiver identifies the connection. The TCP header has a 32-bit sequence number
    and a 32-bit acknowledgment. Remember that TCP is connection-oriented and provides
    reliable service.The sequence and acknowledgment numbers are the primary (but
    not only) mechanisms used to provide reliability. As data is passed to the Transport
    layer, TCP divides the data into what it believes to be the most appropriate size.
    These pieces are known as TCP segments. As TCP sends data down the protocol stack,
    it creates a sequence number that indicates the first byte of data for the given
    segment. On the opposite side of the communication, the receiver sends an acknowledgment
    indicating that the segment has been received. The receiver keeps a timer running,
    and if an acknowledgment isn''t received in a timely fashion, the segment will
    be resent.


    Another mechanism for reliability that TCP provides a checksum on both the header
    and the data. If the checksum set within the header by the sender does not match
    the checksum computed by the receiver, the receiver will not send an acknowledgment.
    If an acknowledgment gets lost in transit, the sender will likely send another
    segment with the same sequence number. In such an event, the receiver will simply
    discard the repeated segment.


    A 4-bit field is used for header length, including any options as part of the
    header. There are several individual bit flags within the TCP header: URG, ACK,
    PSH, RST, SYN, FIN, NS, CWR, and ECE. A description of these flags is contained
    in Table 1.4.


    The 16-bit window is used to provide a sliding window mechanism. The receiver
    sets the window number to indicate the size that the receiver is ready to receive,
    beginning with the acknowledgment number.This is a flow of control for TCP.'
