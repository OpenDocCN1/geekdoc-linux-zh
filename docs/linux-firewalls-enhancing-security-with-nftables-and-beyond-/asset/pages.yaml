- pgno: 306
  md: '# Chapter 13 Network Monitoring and Attack Detection


    # LAND Attack


    The LAND attack is a DoS attack against computers running Microsoft Windows. The
    attack was originally reported to affect Windows 95 and Windows NT back in 1997.
    Microsoft eventually patched the vulnerability for the operating systems. However,
    the vulnerability resurfaced in Microsoft''s newer operating systems, including
    Windows XP Pack 2 and even Windows Server 2003.


    The LAND attack is quite trivial when the source and destination addresses are
    set to the recipient host and the SYN flag is set.

    hping3 again an easy way to create this for testing:

    hping3 -k -S -s 25 -p 25 -a 192.168.1.2 192.168.1.2


    The capture through TCPDump shows next. Notice the source and destination addresses
    are the same and that the source port is not incrementing and that''s also below
    the ephemeral ports:


    ```

    13:32:28.07939 IP 192.168.1.2 > 192.168.1.25: S 76450725:76450725(0) win

    =512

    13:32:29.07946 IP 192.168.1.25 > 192.168.1.25: S 2081780101(0) win

    =512

    13:32:30.07941 IP 192.168.1.25 > 192.168.1.25: S 39020212:390202112(0) win

    =512

    ```


    # Recording with TCPDump


    While consulting for a small Internet provider, I noticed that was a routine and
    significant spike in network traffic at 3:00 a.m. every morning, lasting anywhere
    from 15 minutes to an hour. My goal was to determine the cause of this traffic
    spike. Because the traffic was routine and at an odd hour, my initial thought
    was it was the result of an automatic update process for the servers on the network.


    Most of the servers in the network were running Debian Linux and using apt-proxy.
    This meant that only one local server would connect the off-site Debian updates
    and obtain any updates necessary. All the other servers in the local network would
    need to contact that master server. This setup cut the Internet utilization immensely.


    Although the master server could certainly be a contributing factor, I didn''t
    feel there would be enough traffic. My assumption was confirmed when I looked
    at the update schedule on the master server and found that it was actually looking
    for updates at a different time anyway, and it wasn''t contributing to the 3:00
    a.m. spike at all.


    With that cause eliminated, I needed to look at the traffic itself at 3:00 a.m.
    However, I wasn''t really looking forward to staying awake until that hour, and
    if I was awake, it might not be in might to read a packet trace. Cron by using
    cron to fire TCPDump, I could capture the packet trace to a file for later analysis.
    No great surprise here and I wasn''t breaking any new ground, but it seemed like
    a fair solution to the problem. I configured the switch to copy packets to the
    port on which the monitoring machine was connected and got to work on the TCPDump
    portion.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# Using TCPDump to Capture Specific Protocols 285


    TCPDump offers a couple of features that come in handy for this type of trace.
    The first feature is the capability to write the output to a file (record, if
    you will) and then read that in later (playback). The second helpful feature is
    the capability to exit after a certain number of packets. Granted, I could have
    other methods to stop the packet trace, such as another cron job to kill the TCPDump
    capture, and I thought that using TCPDump''s native capability was the quickest
    and easiest solution.


    All the TCPDump commands I''ve shown in this chapter have in used expressions
    for specific and known traffic. Expressions aren''t of much help when you''re
    unsure of what you''re searching for, as was the case here. The best option was
    to capture everything and work on a filter during playback.


    The two TCPDump options of interest that haven''t been covered yet in the chapter
    are -w and -c. The -w option lets you feed back through TCPDump to save the raw
    output into a file so the resulting file is in TCPDump''s native format and thus
    not readable by a plain-text parser as cat, less, or more. The -c option informs
    TCPDump that it should exit after it captures <N> packets. Getting <N> correct
    seems to be the most part of the capture.


    The capture needed to show only my basic information about the packet, including
    source and destination, as a few bits of the packet. To that end, the TCPDump
    command was rather easy to create:


    ```

    /usr/sbin/tcpdump -c 25000 -w dumpfile

    ```


    In this command I have TCPDump exiting after capturing 25,000 packets, writing
    the capture to a file called dumpfile, and not performing DNS queries for the
    source and destination. Getting to this did require some level of testing to see
    just how long it took to capture 25,000 packets and what information was included
    in the capture. After it was tested, I entered the command into my cron with this:


    ```

    5 3 * * * /usr/sbin/tcpdump -c 25000 -w dumpfile -n

    ```


    That is, every morning at 3:05 am the capture would take place. Then at a better
    hour, like 11:00 am when I got out of bed, I''d look to see whether there was
    traffic the prior evening that required me to look at the dumpfile. If there was
    traffic, I''d log in to the server and run a command to read the dumpfile:


    ```

    tcpdump -r dumpfile -X -vn

    ```


    Running this command gave me an idea of what traffic was out there. Intermingled
    with the normal traffic there was an FTP connection between one of the ISP''s
    large customers and another host on the Internet. The FTP traffic was easily the
    most frequent packet I was seeing within the trace.Another packet''s trace confirmed
    it. I had the ISP contact to find out whether this was known activity and, if
    so, to let the customer know it was going over their bandwidth allocation for
    the month.


    This example is somewhat typical of a security analyst''s job. Spot an anomaly,
    investigate the anomaly while ruling out possibilities, and take action based
    on the investigation.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# Chapter 13 Network Monitoring and Attack Detection


    Although the ultimate cause of this particular anomaly turned out to be any type
    of unauthorized attack, the result of the investigation was a happier customer
    because customer could take corrective action after exceeding its bandwidth for
    the month.


    # Automated Intrusion Monitoring with Snort


    Snort an excellent intrusion detection software package combining best-in-class
    technology with open-source configurability. Snort actually has a few modes of
    operation, including a sniffer mode, a packet logger mode, an intrusion detection
    mode, and what is called inline mode. However, inline mode is also notable because
    it provides a way to configure Snort and iptables to work together to dynamically
    accept or drop packets based on Snort rules. For the purposes of this chapter,
    when defferring to Snort when referring to Snort I''m referring specifically to
    the intrusion detection mode.


    In intrusion detection mode, Snort works by using a number of rules that define
    anomalous traffic. Many of these rules are predefined by Sourcefire, the makers
    of Snort. Many other rules are available from the community, and of course you
    can also write your own rules as necessary.


    In addition to rules, Snort has a number of preprocessors that enable modules
    to write and alter packets before they are handled by the intrusion detection
    engine of software. Preprocessors can be developed for your needs, the preprocessors
    already available are helpful. The preexisting preprocessors include two types
    of port scan detectors to help detect and take action when a port scan is detected.
    There are also preprocessors to reassemble TCP streams to provide stateful analysis
    and decode RPC traffic and inspect HTTP traffic. Other preprocessors are described
    in the Snort documentation available with Snort or at https://www.snort.org/documents.


    Snort works by detecting and reporting on events. The actual process of reporting
    on events can be configured through event handling within Snort. Event handling
    calls for configuration based on thresholds. This highly configurable aspect of
    Snort helps prevent being inundated with log entries and alerts.


    Normally you''d be notified in some way when Snort rules are triggered. Snort
    uses output modules that can be configured to send the output to various locations.
    A commonly used output module is the alert_syslog module, which sends alerts to
    the local syslog facility. Other output modules exist, including alert_fast and
    alert_full. The former puts a fast entry into the file specified, and the latter
    sends the entire packet header along with the event message. Other output modules
    exist exist.


    One interesting output module is the database module. The database module enables
    Snort to be sent to a SQL database. Using this output module enables you to leverage
    software which can generate reports on the alerts and events in Snort.


    Snort has numerous additional features and nuances that make it one of the best,
    if not the best, intrusion detection software available.'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# Obtaining and Installing Snort


    Snort is available with many Linux distributions as an additional package, and
    most distributions also include the Snort rules, either included with the Snort
    package or as an addon package. You can also download Snort from http://www.snort.org/.


    Installation of Snort and the default rules should nearly always be done by installing
    the package available with your distribution. If this isn''t possible or if the
    available package doesn''t include the options you''d like, you''ll need to compile
    from source.


    The Snort package comes in a gzip archive and therefore needs to be unzipped and
    unarchived before compiling:


    ```

    tar -xvf snort-<version>.tar.gz

    ```


    After it''s unzipped and unarchived, you can cd into the Snort source directory
    and run the configure script:


    ```

    cd snort-<version>

    ./configure

    ```


    It is at the point of running the configure script where many compile-time options
    can be set. To obtain a list of some of these options, notably to enable support
    for certain databases or enable certain other features, you type the following:


    ```

    ./configure --help

    ```


    In addition, the INSTALL document and other documentation within the <snort-source>/doc
    directory explain these and other options available when compiling Snort from
    source.


    Running the configure script, along with any options, will result in Snort looking
    for various prerequisites. For example, when compiling Snort from source, you
    might receive an error indicating that one or more prerequisites can''t be found,
    such as this error:


    ```

    checking for pcre.h... no

    ERROR! Libpcre header not found, get it from

    http://www.pcre.org

    ```


    With this error in mind, I was able to install the pcre development files, rerun
    the configure script, and continue.


    After the configure script has run successfully, compile the software by typing
    this:


    ```

    make

    ```


    The software will now compile. Should you get any errors during this phase, consult
    the Snort documentation and mailing list archives to see whether you''ve received
    a known error for your architecture.


    Finally, after the software is compiled, install it by typing the following:


    ```

    make install

    ```'
  merge: -1
  img_proc: true
