- pgno: 265
  md: '# Incident Reporting


    xinetd or tcp_wrappers level and at the individual server level, by installing

    packet-filtering firewall, and by installing application proxy servers.


    +   7. Install and configure any system integrity packages.


    +   8. Enable all logging.


    +   9. Restore user and special configuration files known to be untainted.


    +   10. Create MD5 or SHA checksums for the system binaries and static

    configuration files.


    +   11. Reconnect the system to the network and install any new security upgrades
    from

    y your Linux vendor.


    +   12. Create MD5 or SHA checksums for the newly installed binaries, and store
    the

    checksum database on a USB drive, CD/DVD, or some other system.


    +   13. Monitor the system for recurring illegal access attempts.


    # Incident Reporting


    An incident be a number of things; you need to define it for yourself. For example,
    an

    incident might be defined as an anomalous attempt to gain or escalate privilege
    or com-

    promise the confidentiality, integrity, or availability of one or more systems.


    It is good practice to monitor your system log files, system integrity reports,
    and system

    accounting reports as a matter of habit. Even with minimal logging, sooner or

    later you''ll see something that your security policy dictates is important to
    report.

    With full logging enabled, you''ll have plenty of log entries to ponder 24 hours
    a day.


    Some accesses are more serious than others. Some will annoy you personally

    than others. The following sections start by discussing reasons why you might
    want

    to report an incident and considerations concerning which types of incidents you

    might report. These are individual decisions. The remaining sections focus on
    the various

    reporting groups available and the kind of information you need to supply if you
    choose

    to report something.


    # Why Report an Incident?


    You might want to report an incident even if the attack attempt was unsuccessful.
    There

    are of the reasons:


    +   **To end the probes**—Your firewall ensures that most probes remain harmless.
    But

    even harmless probes are annoying if they occur repeatedly. Persistent, repeated,

    ongoing scans fill your log files. Depending on how you''ve defined the notification

    triggers in your log-monitoring software that you run, repeated probes can pester

    you with continual email notifications. However, in today''s age of seemingly
    end-

    less probes from bots owned by unaware broadband users, especially in the

    United States, it would be too time-consuming for most people to report

    very probe.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# Chapter 11 Intrusion Detection and Response


    +   To protect other sites—Automated probes and scans are generally building a
    database of all vulnerable hosts in a large IP address block. When identified
    as potentially vulnerable to specific exploits, these hosts are targeted for selective
    attacks. Their sophisticated analysis and cracking tools can compromise a vulnerable
    system and hide their tracks in seconds. Reporting an incident might put a stop
    to the scans before someone else hurts.


    +   To inform the system or network administrator—Attacking sites quite often
    are compromised systems, host a compromised user account, have misconfigured software,
    are being spoofed, or have an individual troublemaker. System administrators are
    usually responsive to an incident report. ISPs tend to stop their troublemakers
    after other customers start complaining that remote sites are blocked from their
    address block and that they cannot exchange email with a friend or family at a
    remote site.


    +   To receive confirmation of the attack—Some might simply want confirmation
    that what you''re seeing in the logs is a problem. Times you might want confirmation
    that a remote site was indeed leaking packets unintentionally because of a faulty
    configuration. The remote site is often glad for the heads-up that its network
    is not behaving as it intended.


    +   To increase awareness and monitoring by all involved parties—If you report
    the incident to the attacking site, the site ideally will monitor its configurations
    and user activities more carefully. If you report the incident to an abuse center,
    the abuse staff can contact the remote site with more clout than an individual
    cares, keep an eye out for continued activity, and better help customers who have
    been compromised. If you report the incident to a security newsgroup, other people
    can get a better idea of what to watch out for.


    # What Kind of Incidents Might You Report?


    Which incidents you report depends completely on your tolerance, how serious you
    consider different probes to be, and how much time you can devote against what
    is a global, exponentially growing infestation. It comes down to how people''s
    minds, incidents can range anywhere from simple port scans to attempts to access
    your private files or system resources, to denial-of-service attacks, to crashing
    your servers or your entire system, to gaining root login to your system:


    +   Denial-of-service attacks—Any kind of denial-of-service attack is blatantly
    hostile. It''s difficult not to take such an attack personally.These attacks are
    the electronic form of vandalism, obstruction, harassment, and theft of service.
    Because some forms of denial-of-service attacks are possible because of the inherent
    nature of networked devices, you can do little or nothing about some forms of
    other than to report the incidents and block the attacker''s entire address block.'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# Incident Reporting 245


    +   Attempts to reconfigure your system—An attacker can''t reconfigure your servers
    without a root login account on your machine, but he or conceivably modify your
    system''s in-memory, network-related tables—or try, at least. Exploits to include
    these:


    +   Unauthorized DNS zone transfers to or from your machine over TCP


    +   Changes to your in-memory routing tables


    +   Attempts to reconfigure your network interfaces or routing tables via probes
    to UDP port 161 for snmpd


    +   Attempts to gain login account access—Probes to ssh TCP port 22 are obvious.
    Less obvious are probes associated with servers known to be exploitable, either
    historically or currently. Buffer overflows are generally intended to execute
    commands and gain shell access. The mounted exploit is an example of this.


    +   Attempts to access nonpublic files—Attemps to access private files, such as
    the /etc/passwd file, configuration files, or proprietary files, such as your
    FTP log (/var/log/xferlog or /var/log/messages) and in your web server access
    log (/var/log/httpd/error_log).


    +   Attempts to use private services—By definition, any service you''ve made available
    to the Internet is private: These are private services potentially available through
    your public servers, as attempts to relay mail through your mail server. Chances
    are, people are up to no good if they are trying to use your machine instead of
    their own or their ISP''s. Relay attempts show up in your mail log file (/var/log/mailog).


    +   Attempts to store files on your disk—If you have an improperly configured
    anonymous FTP site, it is possible to set up a repository of stolen software and
    media on your machine. Attempts upload files are recorded in your FTP log (/var/log/xferlog)
    if ftpd is configured to log file uploads.


    +   Attempts to crash your system or individual servers—Buffer overflows against
    programs available on your website are possibly easiest to identify by error messages
    written in the web server log files. Other reports of erroneous data will appear
    in your general syslog file (/var/log/messages), your general daemon log (/var/log/daemon),
    your mail log (/var/log/mailog), your FTP log (/var/log/xferlog), or your secure
    access log (/var/log/secure).


    +   Attempts to exploit specific, known, currently exploitable vulnerabilities—Attackers
    find new vulnerabilities with each new software release (and old ones too).'
