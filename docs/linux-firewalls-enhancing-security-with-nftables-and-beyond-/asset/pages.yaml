- pgno: 279
  md: '# How to Become Compromised


    There are a number of unique items on this line, but I will choose to look for
    the words “Authentication failure” because that is the type of thing I want to
    be alerted on. The Swatch syntax is painfully easy yet can be incredibly powerful.
    This is Swatch uses regular expression syntax for matching. The match in this
    case is rather trivial. Simply telling what to watch with the aptly watchfor configuration
    directive and giving it one or more actions to perform when a match is noted is
    all that’s required for Scratch configuration. For example, to look for the words
    “Authentication failure” and have an email sent, the Swatch configuration consists
    of the following:


    ```

    watchfor /Authentication failure/

    mail

    ```


    These two lines are saved in ~/.swatchrc. In this case, I’m doing so as root Swatch
    will need read access to the log file in question.

    Next, start Swatch and tell it what to monitor. The default is /var/log/messages.
    However, I’m creating this on a Debian system and the authentication failures
    are logged to /var/log/auth by default. Here Point Swatch at the correct configuration
    file and start:


    ```

    swatch --tail-file=/var/log/auth

    ```


    Swatch will monitor the log file for the words “Authentication failure” and will
    send an email to root if the words are found.

    As previously stated, there are several options for alerts, including executing
    other programs. These programs could be shell scripts or really anything, the
    possibilities are virtually limitless.


    # How to Become Compromised


    Virtually nothing is done to stop an attacker with unlimited resources and unlimited
    time. From DoS attacks to rootkits to physical attacks, if someone wants at your
    data badly enough, chances are that he or she can get to it, given no other constraints.
    That said, there are many things you can do to limit your exposure to most risks.

    Neither this chapter deals with physical attacks on any level. If an attacker
    is onsite and can simply walk off with the computer or hard drive containing the
    data, there’s no amount of firewall that will help. If the attacker has physical
    access to the computer or device holding the data, the attacker can steal the
    data itself or possibly plant his or her own malicious trojan software.


    This section gives some general suggestions that are tested to keep systems secure.
    These suggestions are by no means all-encompassing; rather they are merely things
    I suggest to ensure system integrity.


    # Secure Often


    Securing the computing environment is a continual process rather than an endpoint.
    As you work to secure systems and networks, new vulnerabilities are being discovered
    and'
