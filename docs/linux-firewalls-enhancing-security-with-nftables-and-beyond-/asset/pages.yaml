  md: "# Enabling Common TCP Services 129\n\nInternet. SSH is considered far preferable\
    \ to using telnet for remote login access because both ends of the connection\
    \ use authentication keys for both hosts, and because data is encrypted. Additionally,\
    \ SSH is more than a remote login service. It can automatically direct X Window\
    \ connections between remote sites, and FTP and other TCP-based connections can\
    \ be directed over the more secure SSH connection. Provided that the other end\
    \ of the connection allows SSH connections, it's possible to route all TCP connections\
    \ through the firewall using SSH. As such, SSH is something of a poor man's virtual\
    \ private network (VPN).\n\nThe ports used by SSH are highly configurable. By\
    \ default, connections are initiated between a client's unprivileged port and\
    \ the server's assigned port 22. The client uses unprivileged ports exclusively.\
    \ The rules in this example apply to the default SSH port:\n\n```\nSSH_PORTS=\"\
    1024:65535\"\n    # RSA authentication\nor\nSSH_PORTS=\"1020:65535\"\n    # Rhost\
    \ authentication\n```\n\nThe client and server rules allow access to and from\
    \ anywhere. In practice, you would limit the external addresses to a select subset,\
    \ particularly because both ends of the connection must be configured to recognize\
    \ each individual user for authentication. Table 5.3 lists the complete client/server\
    \ connection protocol for the SSH service.\n\n# Table 5.3 SSH Protocol\n\n| Description\
    \ | Protocol | Remote Address | Remote Port | In/Out | Local Address | Local Port\
    \ | Flag |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| Local client\
    \ request | TCP | ANYWHERE | 22 | Out | IPADDRESS | 1024:65535 | Any |\n| Remote\
    \ server response | TCP | ANYWHERE | 22 | In | IPADDRESS | 1024:65535 | ACK |\n\
    | Local client request | TCP | ANYWHERE | 22 | Out | IPADDRESS | 513:1023 | Any\
    \ |\n| Remote server response | TCP | ANYWHERE | 22 | In | IPADDRESS | 513:1023\
    \ | ACK |\n| Local client request | TCP | SSH clients | 1024:65535 | In | IPADDRESS\
    \ | 22 | Any |\n| Local server response | TCP | SSH clients | 1024:65535 | Out\
    \ | IPADDRESS | 22 | ACK |\n| Remote client request | TCP | SSH clients | 513:1023\
    \ | In | IPADDRESS | 22 | Any |\n| Local server response | TCP | SSH clients |\
    \ 513:1023 | Out | IPADDRESS | 22 | ACK |"
