- pgno: 373
  md: '# Glossary


    His glossary defines terms and acronyms used in the book. Multiword terms are
    alphabetized by the major noun in the term, followed by a comma, and the rest
    of the term.


    **ACCEPT** firewall-filtering rule decision to pass a packet through to its next
    destination.


    **accept-everything-by-default** a policy that accepts all packets that do not
    match a firewall rule in the chain. Therefore, most firewall rules are DENY defining
    the default ACCEPT policy.


    **ACK** The TCP flag that acknowledges receipt of a previously received TCP segment.


    **application-level gateway** *See proxy, application-level.* Often referred to
    as ALG, application-level (or layer) gateway is overloaded term. In firewall terms,
    ALG often refers to application-specific support modules that insert application
    payload for embedded addresses and ports, and that recognize secondary streams
    associated with the session.


    **AUTH** TCP service port 113, associated with the identified user authentication
    server.


    **authentication** The process of determining that an entity is who or what it
    claims to be.


    **authorization** The process of determining what services and resources an entity
    can use.


    **bastion** *See firewall*, bastion.


    **BIND** Berkeley Internet Name Domain, the Berkeley implementation of the DNS
    protocol.


    **BOOT** Bootstrap Protocol, which is used by disk workstations to discover their
    IP address and the location of the boot server, and to initiate the system download
    over TFTP before booting. BOOTP was developed to replace RARP.


    **BOOTPC** UDP service port 68, associated with the BOOTP and DHCP clients.


    **bootpd** The BOOTP server program.


    **BOOTPS** UDP service port 67, associated with the BOOTP and DHCP servers.'
  merge: -1
  img_proc: true
- pgno: 374
  md: '# Appendix C Glossary


    border router A device to route packets that resides on the edge or boundary of
    a network.


    broadcast An IP packet that is addressed and sent to all interfaces connected
    to the network or subnet.


    CERT Computer Emergency Response Team, an information coordination center and
    Internet security prevention center formed at the Software Engineering Institute
    of Carnegie Mellon University after the Worm Internet in 1988.


    chain The list of rules defining which packets can come in and which can go out
    through a network interface.


    checksum A number produced by performing some arithmetic computation on the numeric
    value of each byte in a file or packet. If the file is changed, the packet corrupted,
    a second checksum produced for the same object will not match the original checksum.


    choke See firewall, choke.


    chroot Both a program and a system call that defines a directory to be the root
    of the filesystem, and that executes a program run confined to that.


    circuit gateway See proxy, circuit-level.


    class, network address Historically, one of five classes of network addresses.
    The IPv4 address is a 32-bit value divided into Class A through Class E addresses,
    depending on the value of the 4 most significant bits in the 32-bit value. The
    Class A network address space maps 128 separate networks, each addressing more
    than 16 million hosts. The Class B network address space maps 16,384 networks,
    each addressing up to 64,534 hosts. The Class C network address space maps 2 million
    hosts, each addressing up to 254 hosts. Class D is used for multicast addresses.
    Class E is reserved for unspecified or experimental purposes. The network classes
    have largely became an artifact with the introduction of CIDR. People refer to
    them out of familiarity and because their byte-boundary characteristics make them
    convenient to use in examples.


    Classless Inter-Domain Routing CIDR replaces the concept of network address classes
    for space allocation with the concept of variable-length subnet masks, CIDR is
    intended conceptual extension of the idea to improve route scalability and solve
    the allocation problems caused by the exhaustion of the classful address space
    for missize organizations.


    client/server model The model for distributed network services, in which a centralized
    program, a server, provides a service to remote client programs requesting that
    service, whether the service is receiving a copy of a web page, downloading a
    file from a central repository, performing a database lookup, sending or receiving
    electronic mail,'
