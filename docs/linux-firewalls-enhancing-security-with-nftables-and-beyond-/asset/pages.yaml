    \n# nftables Firewall for a Standalone System fromfrom Chapter 5\n\nThis section\
    \ contains an nftables script based on the example shown in Chapter 5. The script\
    \ relies on the setup-tables file from that chapter, which it expects to find\
    \ in the same directory. Here are the contents of the setup-tables files:\n\n\
    ```\ntable filter {\nchain input {\n  type filter hook input priority 0;\n}\n\
    chain output {\n  type filter hook output priority 0;\n}\n}\n```\n\nHere is the\
    \ firewall script:\n\n```\n#!/bin/sh\n```\n\n```\nNFT=\"/usr/local/sbin/nft\"\n\
    INTERNET=\"eth0\"\nLOOPBACK_INTERFACE=\"lo\"\nIPADDR=\"my.ip.address\"\nMY_ISP=\"\
    my.isp.address.range\"\nSUET_BASE=\"my.subnet.base\"\n```\n\n```\n# Location of\
    \ nft on your system\n# Internet-connected interface\n# However your system names\
    \ it\n# Your IP address\n# ISP server & NOC address range\n# Your subnet's network\
    \ address\n```"
