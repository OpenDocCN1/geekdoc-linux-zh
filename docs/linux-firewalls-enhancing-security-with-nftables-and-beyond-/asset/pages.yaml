  md: '# Chapter 5 Building and Installing a Standalone Firewall


    TCP SYN cookies are a mechanism to attempt speedy detection of recovery from SYN
    floods. This command enables SYN cookies:


    ```

    # Enable TCP SYN Cookie Protection

    echo 1 > /proc/sys/net/ipv4/tcp_synccookies

