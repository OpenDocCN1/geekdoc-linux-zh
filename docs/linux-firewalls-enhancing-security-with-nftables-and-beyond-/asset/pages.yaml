  md: '# IP Addressing and Subnetting


    As you already know, I feel compelled to write, IP addresses for version 4 of
    IP (IPv4) consist of four 8-bit numbers separated by periods, known as the "dotted
    quad" or "dotted decimal" notation. For version 6 (IPv6), addresses are 128-bit
    and are shown as eight groups of hexadecimal digits each separated by a colon.
    Although seemingly everyone understands or at least has an IP address, it seems
    that fewer and fewer understand subnetting and the subnet masks that are an important
    part of the IP addressing scheme. This section briefly looks at IP addressing
    and subnetting.


    IPv4 addresses are divided into different classes rather than being an entirely
    address space. The classes for IPv4 addresses are shown in Table 1.1.


    In practice, only addresses in Classes A through C are for Internet Use. However,
    some readers may have experience with Class D addresses, frequently used for multi-class.
    E is the experimental and unallocated range.


    Special IP Addresses

    There are three major special cases of IP addresses:

    * **Network address 0**—As not under Class A addresses, network address 0 is not
    used as part of a routable address for IPv4. It is represented as ::0 for IPv6.
    When used as a source address, its only use is during initialization when a host
    attempts to have its IP address assigned by a server. When used as a destination,
    address 0.0.0.0 has meaning only to the local machine referring to itself, or
    as a convention to refer to a default route.

    * **Loopback network address 127**—As not under Class A addresses, network 127
    is not used as part of a routable address. The IPv6 loopback address is represented
    as ::0:0:0:0:0:0:0:1, or more typically, reduced to ::1. Loopback addresses refer
    to a private network interface supported by the operating system. The interface
    is used for local-based services. In other words, local network clients use it
    to address local servers. Loopback traffic remains entirely within the operating
    system. It is never passed to a physical interface. 127.0.0.1 is the only loopback
    address used for IPv4 and ::1 for IPv6, referring to the local host.

    * **Broadcast addresses**—Broadcast addresses are special addresses applying to
    all hosts on a network. There are two major categories of broadcast addresses.
    Limited broadcasts are not routed but delivered to all hosts connected to the
    physical network segment. All bits in both the network and the host fields of
    the IP address are set to one, as 255.255.255.255. Network-directed broadcasts
    are routed, delivered to all hosts on a specified network. The IP address''s network
    field specifies a network. The host field is usually ones, as in 192.168.1.255.
    Alternatively, you might sometimes see the address specified as the network address,
    as in 192.168.10.0. IPv6 doesn''t use broadcast addresses in this sense but rather
    using multicasting to communicate with groups of hosts.'
