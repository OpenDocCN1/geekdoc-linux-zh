    # netstat Output Reporting Conventions


    In netstat output, the local and foreign (that is, remote) addresses are listed
    as <address:port>. Under the Local Address column, the address is the name or
    IP of one of your network interface cards. When the address is listed as *, it
    means that the server is listening on all network interfaces rather than just
    a single interface. The port is either the Symbolic or the numeric port identifier
    that the server is using. Using the Foreign Address column, the address is the
    name or IP of the remote client currently participating in a connection. The *,
    * is printed when the port is idle or for the default daemon. The port is the
    remote client''s port on its end.


    Idle servers listening over the TCP protocol are reported as a connection request.
    Idle servers listening over the UDP protocol are reported as blank. UDP has no
    state—the netstat output is simply making a distinction between TCP and state-UDP.


    # Checking a Process Bound to a Particular Port with fuser


    The fuser command identifies which processes are using a particular file, filesystem,
    or network port. netstat -a -A will report a port number rather than a service
    name if the port doesn''t have an entry in /etc/services. fuser could be useful
    to determine which program is bound to that port.


    The general fuser command format to identify which program is bound to a given
    port is as follows:


    ```

    fuser -n tcp/udp <port number>{<remote address>,<remote port>

    ```


    For example,


    ```

    > fuser -n tcp -v 515

    ```


    produces the output:


    | USER PID ACCESS COMMAND |

    | 515/tcp root 718 f.... 1pd |


    The -v option produces the USER, ACCESS, and COMMAND fields. Without the -v option,
    the port/protocol and PID would be reported.You would need to use ps to identify
    the program assigned to process ID.'
