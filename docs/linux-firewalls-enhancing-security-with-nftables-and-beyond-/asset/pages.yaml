  md: '# Chapter 2 Packet-Filtering Concepts


    don''t police their users. If a site develops a reputation as a bad Internet neighbor,
    other sites will block it across the board.


    On the individual level, blocking all access from selected networks is convenient
    when individuals in the remote network are habitually making a nuisance of themselves.This
