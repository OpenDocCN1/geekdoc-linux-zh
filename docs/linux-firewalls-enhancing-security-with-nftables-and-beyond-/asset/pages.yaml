    \ -j ACCEPT\n\n#################################################################################\n\
    # Accessing Your ISP's DHCP Server (UDP Ports 67, 68)\n\n# Some broadcast packets\
    \ are explicitly ignored by the firewall.\n# Others are dropped by the default\
    \ policy.\n# DHCP tests must precede broadcast-related rules, as DHCP relies\n\
    # on broadcast traffic initially.\n\nif [ \"DHCP_CLIENT\" = \"1\" ]; then\n  #\
    \ Initialization or rebinding: No lease or Lease time expired.\n\n$IPT -A OUTPUT\
    \ -i $INTERNET -p udp \\\n-s $BROADCAST_SRC --port 68 \\\n-d $BROADCAST_DEST --dport\
    \ 67 -j ACCEPT\n\n# Incoming DHCPSERVER from available DHCP servers\n\n$IPT -A\
    \ INPUT -i $INTERNET -p udp \\\n-s $BROADCAST_SRC --port 67 \\\n-d $BROADCAST_DEST\
    \ --dport 68 -j ACCEPT\n\n# Fall back to isolation\n# The client knows its server,\
    \ it has lost its lease,\n# or else needs to confirm the IP address after rebooting.\n\
    \n$IPT -A OUTPUT -i $INTERNET -p udp \\\n-s $BROADCAST_SRC --port 68 \\\n-d $DHCP_SERVER\
    \ --dport 67 -j ACCEPT\n\n$IPT -A INPUT -i $INTERNET -p udp \\\n-s $DHCP_SERVER\
    \ --port 67 \\\n-d $BROADCAST_DEST --dport 68 -j ACCEPT\n\n# As a result of the\
    \ above, we're supposed to change our IP\n# address with this message, which is\
    \ addressed to our new\n# address before the dhcp client has received the update.\n\
    # Depending on the server implementation, the destination address\n# can be the\
    \ new IP address, the subnet address, or the limited\n# broadcast address.\n\n\
    # If the network subnet address is used as the destination,\n# the next rule must\
    \ allow incoming packets destined to the\n# subnet address, and the rule must\
    \ precede any general rules\n# that block such incoming broadcast packets.\n\n\
    $IPT -A INPUT -i $INTERNET -p udp \\\n-s $DHCP_SERVER --port 67 \\\n--dport 68\
    \ -j ACCEPT\n\n# Lease renewal\n```"
