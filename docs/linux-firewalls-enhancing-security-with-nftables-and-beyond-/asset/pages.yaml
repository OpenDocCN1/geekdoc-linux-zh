    would be within/etc/init.d/.. In cases which shell semantics differ, the examples
    are written in Bourne (sh) or Bourne Again (bash) shell semantics.


    The iptables script sets a number of variables. Chief among these is the location
    of the iptables command itself. It is important to set this in a variable so that
    it is explicitly located. There''s no excuse for ambiguity with a firewall script.
    The variable used to represent the iptables command is IPT. If you see IPT, it
    is a substitute for the iptables command.You could just easily execute the commands
    from the shell by typing iptables instead of IPT. Just as, for use in a script
    (which is the intention in this chapter), setting this variable is a good idea.


    The script should begin with the "bang" line invoking the interpreter for the
    script. In other words, put as the first line of the script:


    ```

    #!/bin/sh

    ```


    The examples are not optimized. They are spelled out for clarity. Firewall optimization
    and user-defined chains are discussed separately in Chapter 6, "Firewall Optimization."


    The nftables firewall script begins as a shell script but also includes direct
    nftables rules as separate and included files. These files will be called when
    used later in this chapter.


    The remainder of the chapter covers building a firewall and shows examples of
    iptables and nftables usage for each item.


    # Build versus Buy: The Linux Kernel


    There is great debate whether it is advisable to compile a custom kernel or stick
    with the "stock" kernel that has a given Linux distribution. The debate includes
    whether it is better to compile a monolithic kernel (in which everything is compiled
    into the kernel) or use a modular kernel. As with any debate, there are pros and
    cons to each method. On the one hand there are those who always (or almost always)
    build their own kernel, sometimes "rolling their own.\ On the other hand, there
    are those who rarely or never roll their own kernel. There are those who always
    build monolithic kernels and others who use modular kernels.'
