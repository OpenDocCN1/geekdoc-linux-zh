    # nat Table Target Extensions


    As mentioned earlier, iptables supports four general kinds of NAT: source NAT
    (SNAT); destination NAT (DNAT); masquerading (MASQUERADE), which is a special
    case of the SNAT implementation; and local port direction (REDIRECT) to the local
    host. As part of the nat table, each of these targets is available when a rule
    specifies the nat table using the -t nat table specifier.


    # SNAT nat Table Target Extension


    Network Address and Port Translation (NAPT) is the kind of NAT people are most
    commonly familiar with. As shown in Figure 3.5, Source Address Translation is
    done after the routing decision is made. SNAT is a legal target only in the POSTROUTING
    chain. Because SNAT is applied immediately before the packet is sent out, only
    one outgoing interface can be specified.


    Some documents refer to this form of source NAT (the most common form) as NAPT,
    to acknowledge the port number modification.The other form of traditional, unidirectional
    NAT is basic NAT, which doesn''t touch the source port.That form is used when
    you are translating between the private LAN and a pool of public addresses.


