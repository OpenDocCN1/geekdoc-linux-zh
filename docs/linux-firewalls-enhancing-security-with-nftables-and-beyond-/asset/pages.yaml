- pgno: 103
  md: '# iptables Syntax


    The general syntax for DNAT is as follows:


    ```

    iptables -t nat -A PRERUTING --in-interface <interface> \ \

    -j DNAT --to-destination <address>[-<address>]::<port--<port>

    iptables -t nat -A OUTPUT --out-interface <interface> \ \

    -j DNAT --to-destination <address>[-<address>]::<port--<port>

    ```


    The destination can be mapped to a range of possible IP addresses, if more than
    one is available.


    The destination port can be mapped to a specific range of alternative ports on
    the destination host.


    # REDIRECT nat Table Extension


    Port redirection is a specialized case of DNAT. The packet is redirected to a
    port on the local host. Incoming packets that would otherwise be forwarded are
    redirected to the incoming interface''s INPUT chain. Outgoing packets generated
    by the local host are redirected to a port on the local host''s loopback interface.


    REDIRECT is simply an alias, a convenience, for the specialized case of redirecting
    a packet to this host. It offers no additional functional value. DNAT could just
    as easily be used to cause the same effect.


    REDIRECT is likewise a legal target in the PRERUTING and OUTPUT chains. The PRERUTING
    chain, REDIRECT can be a target when the incoming interface is specified. The
    OUTPUT chain, REDIRECT can be a target when the outgoing interface is specified.


    The general syntax for REDIRECT is as follows:


    ```

    iptables -t nat -A PRERUTING --in-interface <interface> \ \

    -j REDIRECT --to-ports <port>[-<port>]

    iptables -t nat -A OUTPUT --out-interface <interface> \ \

    -j REDIRECT --to-ports <port>[-<port>]

    ```


    The destination port can be mapped to a different port or to a specific range
    of alternate ports on the local host.


    # mangle Table Commands


    The mangle targets and extensions apply to the OUTPUT and PRERUTING chains. Remember,
    the filter table is enabled by default. To use the mangle table features, you
    must specify the mangle table with the -t mangle directive.


    # mark mangle Table Target Extension


    Table 3.23 lists the target extensions available in the mangle table.


    # Table 3.23 mangle Target Extensions


    | -t mangle Option | Description |

    | -j MARK --set-mark <value> | Sets the value of the Netfilter mark value for
    this packet |

    | -j TOS --set-tos <value> | Sets the TOS value in the IP header |'
