  md: "# Enabling Connection State\n\nConnection state tracking comes within the connectionstate-policy\
    \ rules file:\n\n```\ninclude \"nft-vars\"\ntable filter {\n    chain input {\n\
    \        ct state established,related accept\n        ct state invalid log prefix\
    \ \"*INVALID input: * limit rate 3/second\"\n        drop\n    }\n    chain output\
    \ {\n        ct state established,related accept\n        ct state invalid log\
    \ prefix \"*INVALID output: * limit rate 3/\n        second drop\n    }\n}\n```\n\
    \n# Dropping Invalid Traffic\n\nThe rules to drop invalid traffic are contained\
    \ in a rules file called invalid-policy:\n\n```\ninclude \"nft-vars\"\ntable filter\
    \ {\n    chain input {\n        if $int_internet ip saddr $ip_external drop\n\
    \        if $int_internet ip saddr $net_class_a drop\n        if $int_internet\
