    ICMP redirect messages are sent to hosts by their adjacent routers. Their purpose
    is to inform the host that a shorter path is available. That is, the host and
    both routers are on the same network, and the new router to the router which the
    original would send the packet as its next hop.


    Generators redirect messages for hosts; hosts do not. Hosts are required to honor
    redirects and the new gateway to route cache, except in the cases indicated in
    RFC 1122, "Requirements for Internet Hosts—Communication Layers," Section 3.2.2.2:
    "A redirect SHOULD be silently discarded if the new gateway address is not on
    the same connected (sub-) net which the Redirect arrived [INTRO;Appendix Aj],
    or if the source of the Redirect is not the current first-hop for the specified
    destination (see Section 3.3.1)." These commands disable:


    ```

    # ICMP Redirect Acceptance

    echo "0" > /proc/sys/net/ipv4/conf/all/accept_redirects

    # Don''t send Redirect Messages

    echo "0" > /proc/sys/net/ipv4/conf/all/send_redirects

    ```


    rp_filter implements source address validation as defined in RFC 1812, "Requirements
    for IP Routers," Section 5.3.8. In short, packets are silently dropped if their
    source address is not that the hosts forwarding would route a packet with that
    destination address out the same interface on which the packet was received. According
    to RFC 1812, if implemented, routers should enable this feature by default. This
    form of address validation is not enabled on routers, so these commands disable
    it:


    ```

    # Drop Spoofed Packets coming in on an interface, which, if replied to,

    # would result in the reply going out a different interface.

    for i in /proc/sys/net/ipv4/conf/*/rp_filter; do

    echo 1 > $i

    done

    ```


    martian logs received with impossible addresses, as defined in RFC 1812, Section
    5.3.7. Impossible source address includes multicast or broadcast addresses, addresses
    in the 0 and 127 networks, and the Class E reserved space. Impossible destination
    address includes 0.0.0.0, host 0 on any network, host 0 on the 127 network, and
    Class E addresses.


    Currently, the Linux network code for the previously mentioned addresses. It does
    not check for private class addresses (nor could it so without knowledge of the
    network a given interface was connected). log_martians does not affect packet
    validity; it is set here:


    ```

    # Log packets with impossible addresses

    echo "1" > /proc/sys/net/ipv4/conf/all/log_martians

    ```'
