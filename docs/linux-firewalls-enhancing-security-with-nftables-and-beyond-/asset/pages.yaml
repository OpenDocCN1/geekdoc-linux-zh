    In this case, there''s only one file that has changed:


    File: /etc/adjtime Atime : 2014-07-11 05:43:38 , 2014-07-31 23:36:06


    Based on this report, it''s easy to see that changed with /etc/adjtime.


    # Cleaning Up the AIDE Database


    Over time, you''ll notice that AIDE checks become longer and longer. This is usually
    the result of normal activity on the server, such as adding and deleting users,
    updating software, and changing settings in configuration files. You should regularly
    update the AIDE database not only to shorten reports but also to track when unexpected
    changes occur. If you do not regularly update the AIDE database, you might miss
    a change that resulted from an attack.


    You may be asking, "How often to update the AIDE database?"The answer depends
    largely on your needs and your security policy. When you first start to use AIDE,
    I expect that you should be updating the database at least for the first few runs
    (again, depending on your security policy) and, more importantly, refining the
    configuration file. You''ll find that certain files change so often that you need
    to exclude them entirely or change the types of checks that occur on those files.


    It is much better to change the types of checks than to simply skip the files
    altogether. Some file attributes that AIDE can check will not change often or
    at all for the same file. Attributes such as inode and etime shouldn''t change.
    Therefore, if you notice'
  merge: -1
  img_proc: true
- pgno: 325
  md: '# Changing the Output of the AIDE Report 303


    certain files keep showing up in the AIDE report and you''ve ruled out nefarious
    activity, you should change the type of check that occurs on file within the AIDE
    configuration file.


    A file that regularly changes on some systems is the Samba password file, /etc/samba/smbspasswd.
    On systems, the file regularly shows up in the report where everything in the
    /etc/ directory is examined using the R check (refer to Table 14.2). A more appropriate
    check for this file might include things that do not change often such as inode
    and ctime. Such a check would appear like this in the AIDE configuration file:


    ```

    /etc/samba/smbspasswd c-i

    ```


    Note the use of the $ at the end of the filename in the example to indicate the
    end-of-line.


    As the AIDE report runs, you''ll be able to use more granularity to refine the
    files that are checked and the checks themselves.After you update the AIDE configuration
    file, you''ll need to update the database so that the changes take effect. This
    process is accomplished by running this command:


    ```

    /usr/local/bin/aide --update

    ```


    After the update is complete, you''ll have a new database file, /usr/local/etc/aide-db.new,
    by default. This file should be moved to overwrite the existing database: /usr/local/etc/aide.db.new
    /usr/local/etc/aide.db


    Now running aide --check will give a result:


    ```

    AIDE, version 0.15.1

    ```


    ### All files match AIDE database. Looks okay!


    After you update the database, you should copy the file to secure media or to
    another computer to ensure the integrity of the database.


    With the AIDE configuration file database updated and AIDE scheduled to run nightly,
    you have an infrastructure in place to verify the integrity of your filesystem.
    From here you can read on to find out about advanced configurations for AIDE,
    or you can go to Chapter 12 to find out about the rootkit-checking tool Chrootkit.


    # Changing the Output of the AIDE Report


    You might want a little more flexibility in the location of the AIDE report. For
    example, you may not want to receive if everything is okay with the AIDE report,
    or you may want to have AIDE report into a file instead of providing standard
    output. AIDE has four basic options for configuring output that can be configured
    through the AIDE configuration file.'
  merge: -1
  img_proc: true
- pgno: 326
  md: "# Chapter 14 Filesystem Integrity\n\nLinux Output Streams\nLinux has three\
    \ generic streams of output that are created when a program runs. These streams\
    \ are referred to as STDIN, STDOUT, and STDERR, which are abbreviations for Standard\
    \ Input, Standard Output, and Standard Error, respectively. When you see a referral\
    \ to STDOUT, it refers to the normal method of output to the screen, and STDERR\
    \ indicates output as a result of an error condition. As you might expect, STDIN\
    \ refers to the method of input when reading the input file descriptor.\n\nBy\
    \ default, AIDE configuration option called report_url configures how output is\
    \ displayed. By default, output is displayed to STDOUT. Output can be displayed\
    \ to any or all of the following:\n\n+   * STDOUT (default)\n* STDERR\n* File\
    \ descriptor\n\nOf these four possibilities, STDOUT, STDERR, and text file are\
    \ of interest. Future versions of AIDE may include output configurations for automated\
    \ email and automated output to the syslog facility.\nOf particular interest is\
    \ the file type of output for AIDE. This output type is specified using this configuration\
    \ line:\n\n```\nreport_url=file://<path>/filename\n```\n\nFor example, to configure\
    \ AIDE reports to go to a file called aidereport.txt in the /var/log/aide directory\
    \ that you create, you would use this configuration option in the AIDE configuration\
    \ file:\n\n```\nreport_url=file:/var/log/aide/aidereport.txt\n```\n\nHowever,\
    \ the report_url configuration option is only one means for getting output into\
    \ a file. Because you're running the AIDE report from cron, you could simply redirect\
    \ the output to a file. For example, recall the crontab entry shown in the chapter:\n\
    \n```\n0 2 * * /usr/local/bin/aide --check\n```\n\nYou could alter cron to redirect\
    \ the output to a file. Doing so would allow all output to go to that file and\
    \ enable additional features such as date-based naming. This can be done with\
    \ a little trick using quotes (sometimes called a backtick, usually found with\
    \ the tilde [~] on the keyboard). Here's the new cron entry:\n\n```\n0 2 * * /usr/local/bin/aide\
    \ --check >/var/log/aide/aidereport-date+'%m%d%Y'.\txt\n```"
  merge: -1
  img_proc: true
- pgno: 327
  md: '# Changing the Output of the AIDE Report


    Now the AIDE report will run and redirect STDOUT to a file called

    /var/log/aide/aidereport-<date>.txt


    For example, for a report on March 12, 2014, the file would be called

    /var/log/aide/aidereport-03122014.txt


    With a redirected configuration such as the one, you will no longer receive emails
    when AIDE runs through its normal cron job. Rather, you will receive emails only
    when an error occurs with the AIDE cron job. Because you will no longer be receiving
    the emails, you may be tempted to ignore your monitoring duties and let all the
    AIDE reports pile up. However, you should still monitor the AIDE reports by looking
    at them for anomalies and cleaning them as appropriate.


    # Obtaining More Verbose Output


    AIDE reports can be configured with additional verbosity.Adding verbosity to AIDE
    is valuable when you are troubleshooting rule matching. For example, when you
    set the verbose-configuration option, you will be able to see how AIDE builds
    the list of files to check. If you are seeing unexpected results or if files are
    included or excluded for mysterious reasons, adding this to the configuration
    or adding it as a command-line option will help.


    The configuration option to add verbosity is as follows:

    verbose=<N>


    In this case, <N> is a positive integer with a maximum value of 255. In practice,
    numbers over 200 give additional debugging output for most of the checks. Therefore,
    to add the maximum verbosity level, you would use this configuration setting:

    verbose=255


    ```

    With this configuration, you''ll see some additional output during an AIDE run:

    Handling / with s "/bin" with node "/"

    Handling / with s "/sbin" with node "/"

    Handling / with s "/etc" with node "/"

    Handling / with s "/lib" with node "/"

    Handling /usr with s "/usr/lib" with node "/usr"

    tree: "/"

    2    ^/bin

    3    ^/sbin

    4    ^/etc

    5    ^/lib

    tree: "/usr"

    6    ^/usr/lib

    ```


    AIDE, version 0.15.1 AIDE database. Looks okay!'
