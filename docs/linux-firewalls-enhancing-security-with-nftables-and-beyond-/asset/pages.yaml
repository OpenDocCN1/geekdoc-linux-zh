  md: "# Common Local UDP Services Assigned to Unprivileged Ports\n\nTCP protocol\
    \ rules can be handled more precisely than UDP protocol rules because of TCP's\
    \ connection establishment protocol. As a datagram service, UDP doesn't have a\
    \ connection state associated with it. Unless the module is used, access to UDP\
    \ services should simply be blocked. Explicit exceptions are made to accommodate\
    \ DNS and any of the other UDP-based Internet services we use. Frankly, the UDP\
    \ Internet services are often the type used between a client and a server server.\
    \ The filtering rules can often allow exchanges with one specific remote host.\n\
    \nNFS is the main UNIX UDP service to be concerned with and is one of the most\
    \ frequently exploited. NFS runs on unprivileged port 2049. Unlike the TCP-based\
    \ services, NFS is a UDP-based service. It can be configured to run as a TCP-based\
    \ service, but usually it isn't.\n\nWith NFS is the RPC lock daemon, lockd, for\
    \ NFS. lockd runs on UDP port 4045:\n\n```\nNFS_PORT=\"2049\"                \
    \          # NFS\nLOCK_PORT=\"4045\"                         # RPC lock for NFS\n\
    # NFS and lockd\n$IPT -A OUTPUT -o $INTERNET -p udp \\\n    - multiport --destination-port\
    \ $NFS_PORT,$LOCKD_PORT \\\n    -j REJECT\n```\n\n```\n$IPT -A INPUT -i $INTERNET\
    \ -p udp \\\n    - multiport --destination-port $NFS_PORT,$LOCKD_PORT \\\n   \
    \ -j DROP\n```\n\nThe nftables rules like this:\n\n```\n$NFT add rule filter output\
    \ of $INTERNET udp dport \\\n    ($NFS_PORT,$LOCKD_PORT) reject\n$NFT add rule\
    \ filter input if $INTERNET udp dport \\\n    ($NFS_PORT,$LOCKD_PORT) drop\n```\n\
    \n# The TCP and UDP Protocol Tables\n\nThe remainder of this chapter is devoted\
    \ to defining rules for access to specific services. Client/server communication,\
    \ for both TCP and UDP-based services, involves some kind of two-way communication\
    \ using a protocol to the service. As such, access rules are always represented\
    \ as an I/O pair. The client program makes a query, and the server sends a response.\
    \ Rules for a given service are categorized as client rules or server rules. The\
    \ client category represents the communication required for your local clients\
    \ to access remote servers. The server category represents the communication required\
    \ for remote clients to access the services hosted from your machines.\n\nThe\
    \ application messages are encapsulated in either TCP or UDP transport protocol\
    \ messages. Because each service uses an application protocol specific to itself,\
    \ the particular characteristics of the TCP or UDP exchange are, to some extent,\
    \ unique to the given service."
