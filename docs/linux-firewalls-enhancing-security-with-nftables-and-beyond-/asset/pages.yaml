    Figure 10.1 The AH header format


    # Encapsulating Security Payload


    Using ESP guarantees the integrity and confidentiality of the data in the original
    message by means of secure encryption of either the original payload itself or
    the combination of headers and payload of the original packet.

    ESP can be used in transport mode or tunnel mode, like AH, to provide encryption
    and authentication. Transport mode is applicable only to host implementations.
    It provides protection for the upper-layer protocols, but not for the IP header.
    For tunnel mode, the ESP is inserted after the IP header and before any upper-layer
    protocol such as TCP and UDP, or before any IPsec headers that may already be
    inserted. The current IPv4 implementation of TCP/IP, the ESP is placed after the
    IP header but before the upper-layer protocol. This makes ESP compatible with
    non-IPsec-aware hardware.

    ESP tunnel mode may be used in either hosts or security gateways. You must use
    ESP in tunnel mode if you deploy a security gateway. In tunnel mode, the inner
    IP header carries the source and destination addresses, whereas the outer IP header
    may contain distinct IP addresses as addresses of security gateways. ESP protects
    the entire packet in tunnel mode, including the inner IP header. The position
    of the ESP packet is similar to that of transport mode.

    ESP can use a wide variety of encryption algorithms for security services.


    # Transport and Tunnel Modes


    | In transport mode, the IPsec gateway is the destination of the protected packets—a
    machine acts as its own gateway. In tunnel mode, an IPsec gateway provides protection
    for packets to and from other systems. |


    The ESP is inserted after the IP header. In IPv4 implementations, the IP header
    contains the protocol number 50 (ESP). Figure 10.2 shows an example of an ESP.'
  merge: -1
  img_proc: true
