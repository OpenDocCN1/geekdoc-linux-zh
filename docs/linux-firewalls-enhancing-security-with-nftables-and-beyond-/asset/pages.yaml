- pgno: 167
  md: '# 6


    # Firewall Optimization


    Chapter 5,"Building and Installing a Standalone Firewall," used both the iptables
    and nftables firewall administration programs to build a simple, single-system,
    custom-designed firewall. This chapter introduces firewall optimization. Optimization
    can be divided into three major categories: rule organization, use of the state
    module, and user-defined chains. The example in the preceding chapter was shown
    both with and without the use of the state module. This chapter focuses on rule
    organization and user-defined chains.


    # Rule Organization


    Little optimization can be done using only the INPUT, OUTPUT, and FORWARD chains.
    Chain traversal is to bottom, one rule at a time, until the packet matches a rule.
    The rules on a chain must be ordered hierarchically, from most general to most
    specific.


    There is no hard-and-fast formula for rule organization. The two main underlying
    factors are which services are hosted on the machine and the machine''s primary
    purpose, noting especially the services with the heavy traffic on the machine.
    The requirements of a dedicated firewall and packet forwarder are very different
    from those of a bastion protecting a web or mail server. Likewise, a site administrator
    is likely to place different performance priorities on a firewall machine that
    serves primarily as a workstation on a firewall that serves as both a residential
    gateway and a Linux server for a home.


    The third factor to consider when preparing rules for firewall optimization is
    the available network bandwidth, the speed of the Internet connection. Optimization
    isn''t likely to buy much, if anything, for a site with a residential-speed Internet
    connection. Even for a heavily accessed website, the machine''s CPU isn''t likely
    to break a sweat. The bottleneck is the Internet connection itself.


    # Begin with Rules That Block Traffic on High Ports


    As the examples in Chapter 5 demonstrated, the bulk of the rules are antispoofing
    rules, or rules blocking traffic on high ports (such as NFS or X Windows). These
    types of rules must come before allowing traffic to specific services. Obviously,
    the FTP data channel rules must come near the end of the rule list, even though
    you''d want the rules to be near the top of the list because FTP transfers tend
    to be large.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# Use the State Module for ESTABLISHED and RELATED Matches


    Using the state module''s ESTABLISHED and RELATED matches essentially allows for
    moving rules for ongoing exchanges to the head of the chains, as well as eliminating
    the need for specific rules for the server half of a connection. In fact, bypassing
    filter matching for ongoing, recognized, previously accepted exchanges is one
    of the two primary purposes of the state module.


    The state module''s second primary purpose is to serve a firewall-filtering function.
    Connection state tracking allows the firewall to associate packets with ongoing
    exchanges. This is particularly useful for connectionless, stateless UDP exchanges.


    # Consider the Transport Protocol


    The transport protocol that the service runs over is another factor. In a static
    firewall, the overhead of testing every incoming packet against all spoofing rules
    is a big loss.


    # TCP Services: Bypass the Spoofing Rules


    Even without the state module


    The remote client half of a rule pair must follow the spoofing rules, however,
    because typical client rules both the initial connection request and the ongoing
    traffic from the client. The SYN and ACK flags are tested individually, the rules
    for the ACK flag in packets arriving from remote clients can bypass the spoofing.
    The spoofing tests must only apply to the initial SYN request.


    Use of the state module also allows the rule for the remote client''s incoming
    connection request, the initial SYN packet, to be logically separate from the
    rule for the client''s subsequent ACK packets. Only the initial connection request,
    the initial NEW packet, needs to be tested against the spoofing rules.


    # UDP Services: Place Incoming Packet Rules after Spoofing Rules


    Without the state module, for UDP-based services the rule for incoming packets
    must follow the spoofing rules. The concept of connection and server is maintained
    at the application level, as it''s maintained at all. At the firewall and UDP
    levels, out connection state, there is no indication of initiator and responder,
    other than the service port or unprivileged port.


    DNS is an example of a connectionless UDP service. Without connection state, there''s
    not a mapping to the destination address where the client query and the source
    address in an incoming response packet. One of the DNS cache poisoning is possible
    that DNS server implementations do not check whether an incoming packet was a
    legitimate response from the server previously queried or whether the packet was
    sent from some other address. Furthermore, some implementations do not even ensure'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# Rule Organization


    that a client made a request. An incoming, unrequested rocket packet could be
    used to update the local DNS cache even without an initial query having been made.


    # TCP versus UDP Services: Place UDP Rules after TCP Rules


    Overall, UDP rules should be placed later in the firewall chains, after any TCP
    rules. This is because most Internet services over TCP, and connectionless UDP
    services are typical, single-packet, query-and-response services. Testing the
    single or UDP packet or a handful of them preceding rules for ongoing TCP connections
    doesn''t add drawable tag to a UDP query and response. Multconnection session
    protocols are not firewall friendly to begin with. Such services cannot pass through
    a firewall or NAT without specific ALG support.


    # ICMP Services: Place Their Rules in the Rule Chain


    ICMP is another protocol whose firewall rules can be placed later in the rule
    chain. ICMP packets are small control and status messages. As such, they are sent
    infrequently. Legitimate ICMP packets usually consist of a single, nonfragmented
    packet. With the exception of echo-request, ICMP packets are almost always sent
    as a control or status message in response to an exceptional output packet of
    some kind.


    # Place Firewall Rules for Heavily Used Services as Early as Possible


    Generally, there are no hard-and-fast rules for firewall placement in a list.
    Rules for heavily used services, such as the HTTP-related rules for a dedicated
    web server, should be placed as early as possible. Rules for applications that
    involve high, outgoing packet counts should also be placed as early as possible.
    However, as mentioned earlier, the data stream protocols for applications such
    as FTP require the rules to be placed near the end of the chain, after any other
    application rules, unless a specific helper is used for those protocols.


    # Use Traffic Flow to Determine Where to Place Rules for Multiple Network Interfaces


    If the host has multiple network interfaces, rules specific to a given interface
    should be placed with regard which interfaces will have the heaviest traffic flow.
    Rules for those interfaces should precede rules for other interfaces. Interface
    considerations are probably of little interest to a residential site, but they
    can have a major impact on throughput for a commercial site.


    As a case in point, this issue came several years ago with a small ISP that had
    built a firewall based on the ipfwadm and ipchains on the previous author Bob
    Ziegler''s website. As shown in Figure 6.1 and Figure 6.2, the path that packets
    take through the operating system is very different between IPFW and Netfilter.
    Unlike Netfilter and iptables, with ipchains, packets passing between network
    interfaces are passed from the'
