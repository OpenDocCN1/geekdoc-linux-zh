- pgno: 285
  md: '# # 13

    Network Monitoring and Attack Detection


    This chapter uses the knowledge you''ve gained throughout the book and in the
    preceding couple of chapters specifically to show how you might use some of the
    tools for everyday monitoring and also for investigation.


    The chapter begins with an overview of network monitoring, sniffing. The information
    in the beginning of this chapter builds on what you''ve already seen in the first
    two chapters of the book. This chapter continues with a look at TCPDump, a key
    tool in the network security analyst''s toolkit. Finally, the chapter also looks
    at two helpful security packages: Snort and ARPWatch.


    # ## Listening to the Ether


    Armed with the basic knowledge of some the core protocols from the first two chapters,
    you''re ready to begin listening to the network. Exactly what you may see when
    you begin monitoring your network will depend on several factors, not the least
    of which is the network topology itself.


    A Modern Ethernet network is a collection of endpoint devices such as computers
    with network interfaces, interconnected using a hub or switch. The difference
    between a hub and a switch is important to network performance and security. In
    a hub environment, every Ethernet frame is copied to every port on the hub, and
    therefore every device is connected to the hub. In a switched environment, the
    switch sends frames to the specific port to which a device is given. In other
    words, with a switch, traffic goes only to the devices that should receive it.
    If an intruder can monitor the network in a hub environment, the intruder in a
    switched environment, will see only traffic destined for that host or broadcast
    traffic that is copied to all ports.


    Most managed switches enable the administrator to configure a port to receive
    all traffic. Cisco calls this a "span" port, whereas others call it a "mirror"
    port. In effect, by copying all traffic to the one port on the switch, the administrator
    can monitor all the'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# Chapter 13 Network Monitoring and Attack Detection


    traffic for that switch to look for possible intrusions or other anomalies. Of,
    this can also be dangerous. If an attacker gains control over the device at the
    end of that port, the attacker too can listen to everything! Also, in heavy traffic
    environments performance degradation will likely occur if you attempt to monitor
    all ports. Therefore, choosing where to monitor your network is important.


    If you don''t have a managed switch that enables you to copy all traffic to one
    port, you''ll need to find another means to listen to the traffic. I don''t recommend
    removing the switch in favor of a hub. However, one method would be to connect
    a hub to the firewall and then your intrusion detection or monitoring computer
    to that hub as, and finally connect the hub into the main switch. In this way
    you can monitor internal firewall traffic without (much) performance degradation
    and without much of the safety that a switch provides.


    As I wrote the sentence about the safety of a switch, I reminded of some types
    of attacks that enables an attacker to listen to other traffic on a switch, even
    if it wasn''t destined for the port where the attacker resides. These attacks,
    primarily ARP spoofing, involving interference with the normal operation of ARP.
    A good primer on ARP spoofing can be found in the paper "An Introduction to Ar
    Spoofing" available at http://packetsecurity.com/papers/protocols/intro_to_arp_spoofing.pdf.


    Choosing monitoring points within a network is more art than science and inevitably
    debatable. There are those who say that only the interior of the network is important
    anyway. There are others who maintain that external points be monitored so that
    you can see what is being attempted on the network. And there are those, like
    myself, who believe that both internal and external points should be monitored.
    Monitoring the internal network is important (for hope) obvious reasons. You can
    look for anomalous traffic and also monitor for unexpected conditions and performance.
    However, I believe that monitoring the external network is important as well.
    I cut my computer security to an Internet provider where everything was on the
    external network by nature. Therefore, I was able to see just valuable it was
    to know what''s happening on the outside as a means to prevent attacks from being
    successful.


    You have to make decisions that work in your environment. It may not make sense
    to deploy a computer outside of your firewall for intrusion detection. All security
    is a trade-off between the assets you are trying to protect and the limited resources
    available to protect them.


    # Three Valuable Tools


    An ever-growing number of tools and software exist to monitor traffic. Some of
    these are free (as price and speech), and some cost a bit of money. I''ve used
    both the expensive tools and the free ones, and I''m confident in saying that
    the free ones are better. The expensive tools are weak on functionality but strong
    on the pretty. The interfaces for many of the products provide a nice "look and
    feel" (though many of them seem to be somewhat unstable). In general, the open-source
    tools are a bit involved'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# TCPDump: A Simple Overview 265


    to set up and use, but they provide better functionality and with a little work
    can produce some of the nicest-looking graphs and other pictures that the expensive
    tools provide. For my money, I''d rather intrusion detection tools that I can
    use quickly and easily when investigating a potential attack.Dealing with cumbersome,
    nonintitive GUIs only gets in the way of the business of intrusion detection.


    This section looks at a few monitoring tools with special emphasis on the tools
    that are covered later in the book.


    # TCPDump


    Of the primary tools in an intrusion detection analyst''s toolkit should be TCPDump.
    TCPDump places a network interface into promiscuous mode so that it captures every
    packet that arrives. Of course, TCPDump needs to be run from the computer experiencing
    the possible intrusion or needs to run from a computer that is the recipient of
    a "spanned" port in a switch environment.TCPDump is examined in detail in the
    next section.


    # Snort


    Snort is one of the best intrusion detection systems, free or otherwise. Snort
    captures network traffic in the same way that TCPDump does. However, Snort uses
    a database of well-known attack signatures to provide a level of detection as
    well. Whereas TCPDump is more of a manual monitor, Snort is more automated insofar
    the analyst doesn''t need to manually examine each packet. You can get more information
    on Snort at http://www.snort.org/


    # ARPWatch


    ARPWatch is a tool to monitor ARP traffic on a network. The goal would be for
    an administrator to spot possible ARP spoofing attempts as unknown devices that
    have entered the network. ARPWatch can be downloaded from http://ee.lbl.gov/.
    Like other tools, ARPWatch needs to be compiled before you use if your system
    doesn''t have it available as a package. ARPWatch is examined later in this chapter,
    in the section "Monitoring ARPWatch."


    # TCPDump: A Simple Overview


    Recall what you''ve read in earlier chapters. You learned about IP addressing,
    subnetting, and the headers of some those core protocols. In this chapter the
    TCPDump tool will be examined, and you will see some of those protocols up close
    and personal. Armed with an understanding of how to monitor your network at this
    level, you can be confident that you''ll be able to troubleshoot a wide range
    of problems, not just those related to computer security.


    An important tool in the intrusion analyst''s toolkit is TCPDump. At a basic level,
    TCPDump is real-time packet capture and analysis software. This means that TCPDump
    can be used to eavesdrop on network communication as it travels through the network.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# Chapter 13 Network Monitoring and Attack Detection


    As has already been mentioned, however, the amount of traffic that one eavesdrop
    dictated by the network topology. If the computer from which TCPDump is running
    connected to a switched network, TCPDump will see only traffic destined for that
    host or broadcast/multicast traffic. A good approach in a switched network would
    be to use a “span” port to which all traffic will be copied by the switch itself.
    If course, none of this is of concern in a hub-based network because all traffic
    is copied to all ports on the hub.


    TCPDump places the interface into promiscuous mode. Before you get excited, consider
    that on interfaces means that a huge amount of traffic will flying past the screen,
    which has the potential to slow down the traffic ever swiftly. In any event, a
    large amount of traffic will be too much for a human to comprehend, so you''ll
    want to capture the output to a file, pipe the output to a pager, or filter the
    traffic to look for something specific. Filtering through a TCPDump expression
    is by the best option, but the choices are not mutually exclusive. I usually use
    a filter and a pager as less, in case something interesting flies past my screen
    so quickly.


    TCPDump can filter traffic by any criteria you can imagine. Most for the intrusion
    analysis, you''ll look at traffic by protocol, host, port number, or a combination
    thereof. Before I go further, I would be remiss if I didn''t recommend reading
    or at least referring to the TCPDump(1) manual page (type tcpdump to read it).
    The page is a comprehensive document providing not only syntax but samples of
    use, as well as protocol diagrams. If you get trying to use TCPDump and you don''t
    have a copy of this book handy; maybe you should use two copies of the book. Alternatively,
    use the TCPDump page for reference to.


    # Obtaining and Installing TCPDump


    TCPDump can be downloaded from http://www.tcpdump.org/. TCPDump requires the PCap
    library libcap so while you''re downloading TCPDump, you should download libcap
    as well. Most Linux distributions also include TCPDump as an available package.
    For example, if you''re using Debian, you can simply do this:


    ```

    apt-get install tcpdump

    ```


    The package maintenance system will install TCPDump and any prerequisites too.
    For everyone else, you can probably search your system''s repository for a package
    or just download the source and compile it, which I recommend. Should you attempt
    to compile TCPDump without having libcap installed, you''ll see an error similar
    to the following while running the configure script for TCPDump:


    ```

    checking for main in -lpcap... no

    configure: error: see the INSTALL doc for more info

    ```


    Installation of both libcap and TCPDump is fairly straightforward as far as compiling
    software goes. Unarchive each piece of source code, run the configure script,
    compile, and install.'
  merge: -1
  img_proc: true
