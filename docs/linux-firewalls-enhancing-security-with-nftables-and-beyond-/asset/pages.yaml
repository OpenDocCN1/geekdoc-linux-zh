  md: "# Enabling Basic, Required Internet Services 121\n\n```\nif [*$CONNECTION_TRACKING*\
    \ = \"1\" ]; then\n$IPT -A OUTPUT -o $INTERFACE -p tcp \\\n  -s $IPADDR --sport\
    \ $UNPRIVPORTS \\\\\n  -d $NAMESSERVER --dport 53 \\\\\n  -m state --state NEW\
    \ -j ACCEPT\nfi\n```\n\n```\n$IPT -A OUTPUT -o $INTERFACE -p tcp \\\n  -s $IPADDR\
    \ --sport $UNPRIVPORTS \\\n  -d $NAMESSERVER --dport 53 -j ACCEPT\n$IPT -A INPUT\
    \ -i $INTERFACE -p tcp ! --syn \\\n  -s $NAMESSERVER --dport 53 \\\\\n  -d $IPADDR\
    \ --dport $UNPRIVPORTS -j ACCEPT\n```\n\nThe iptables rules like this:\n\n+  \
    \ - NFT add rule filter output if $INTERFACE ipaddr $IPADDR tcp sport $UNPRIVPORTS\n\
    - ip daddr $NAMESSERVER dport 53 state new accept\n- NFT add rule filter input\
    \ if $INTERFACE ipaddr $IPADDR tcp dport $UNPRIVPORTS\n- ip sadr $NAMESSERVER\
    \ dport 53 state flags != syn accept\n\n# Allowing DNS Lookups as a Forwarding\
    \ Server\n\nConfiguring a local forwarding server can be a big performance gain.\
    \ As shown in Figure 5.5, when BIND is configured as a caching and forwarding\
    \ server, functions both as a local server and as a client to a remote DNS server.\
    \ The difference between a direct-to-server exchange and a forwarded server-to-server\
    \ exchange is in the source and destination ports used. Instead of initiating\
    \ an exchange from an unprivileged port, BIND initiates the exchange from its\
    \ own DNS port 53. (The query source port is now configurable. In newer versions\
    \ of BIND, the local server makes its request from an unprivileged port, by default.)\
    \ A second difference is that forwarding server lookups of this type are always\
    \ done over UDP. (If the response is too large to fit in a UDP DNS packet, the\
    \ local server must revert to standard client/server behavior to initiate the\
    \ TCP request.)\n\n# DNS Bind Port Usage\n\nHistorically, DNS servers used port\
    \ 53 as their source port when talking to other servers. This distinguished client\
    \ traffic from server-initiated traffic because the client always uses a high,\
    \ unprivileged port as its source. Later versions of BIND allow the server-to-server\
    \ source port to be configurable and the unprivileged ports by default. All examples\
    \ in this book assume that BIND has been configured to use UDP port 53, rather\
    \ than an unprivileged port, for server-to-queries.\n\nLocal requests are sent\
    \ to the local DNS server. The first time, BIND won't have the lookup information,\
    \ so it forwards it to a remote server. BIND caches the returned information and\
    \ passes it to the client. The next time the same information is requested, BIND\
    \ finds it in its local cache (according to the record's time to live [TTL]) and\
    \ doesn't need a remote request."
