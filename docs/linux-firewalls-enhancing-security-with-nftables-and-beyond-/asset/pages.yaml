    \ --sport UNPRIVORTS \\\\\n  -d $LAN_GATEWAY --dport 53 \\\n  -m state --NEW,\
    \ ESTABLISHED,RELATED -j ACCEPT\n```\n\n```\n$IPT -A INPUT -i $LAN_INTERFACE -p\
