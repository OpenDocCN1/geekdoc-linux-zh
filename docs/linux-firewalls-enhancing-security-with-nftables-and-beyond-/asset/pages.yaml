- pgno: 199
  md: '# Summary 177


    straight-through server traversal lengths are much longer than the client lengths
    as a result of the address checking done on the incoming packets.


    Using the state module and thereby bypassing the firewall for established traffic
    dramatically reduces list traversal length for established connections. The increase
    in the number of rules traversed for new connections is the result of the duplicate
    rules, the connection-tracking rules, and their static counterparts.


    Even with the state module, the initial packet always traces the static path.
    So the gain that the classic optimized version shows over the straight-through
    version still applies to the first packet.


    Finally, the benefits of both optimization and connection state tracking are obvious!
    The categorization being performed by the user-defined chains dramatically reduces
    the actual number of tests that a packet is tested against a classic packet-filtering
    firewall. Using the state modules reduces the number of tests even further by
    skipping the rules altogether. Furthermore, the data connection is matched immediately
    as a RELATED connection.


    What perhaps least obvious, unless you read the kernel firewall code, is the real
    performance isn''t the number of rules traversed, per se, but the number of comparisons
    performed. Each unmatched traversed rule represents at least one comparison (for
    example, the incoming packet or is arriving on the loopback interface or some
    other specific interface?). User-defined chains allow the comparisons to be partitioned
    by branching off into dedicated chains at critical decision points.


    # nftables Optimization


    For the nftables script, much of the processing was moved to native nftables rules
    files which were loaded by the shell script. The benefit of this optimization
    is that it brings the rules closer to where they are processed without having
    to run a shell command for each and every individual rule.


    The rules are also divided logically into multiple policy files, each containing
    rules for similar traffic. This enables easier maintenance and can be condensed
    or expanded depending on your particular situation.


    # Summary


    Chapter 5 introduced iptables and nftables by walking through the steps of building
    a simple firewall for a standalone system. This chapter discussed the ideas behind
    firewall optimization and then built user-defined chains to optimize the firewall
    example from Chapter 5. Finally, the effects of optimization were examined, as
    were the effects of using the state module.'
