    # Configuration Options for a Larger or Less Trusted LAN


    A business or an organization, and many home sites, would use more elaborate,
    specific mechanisms than the simple, generic forwarding firewall rules presented
    in the preceding two sections for a trusted home LAN. In less trusted environments,
    firewalls are protected from internal users as strongly as from external users.


    Port-specific firewall rules are defined for the internal interfaces as well as
    the external interfaces. Internal rules might be a mirror image of the rules for
    the external interfaces, or the rules might be more inclusive. What is allowed
    through the choke firewall''s internal network interface depends on the types
    of systems running on the LAN and the types of local services running in the DMZ,
    as well as Internet services are accessible to the LAN according to local security
    policies.


    For example, you might want to block local broadcast messages from the gateway
    firewall. If not all your users are completely trusted, you might want to restrict
    what passes into the choke firewall from internal mechanisms as strongly as what
    comes from the Internet. Additionally, you should keep the number of user accounts
    to a bare minimum on the firewall machine. Ideally, a firewall has no user accounts,
    with the exception of a single unprivileged administrative account.


    A home-based business has a single IP address, requiring LAN Network Address Translation.
    However, businesses often leave publicly registered IP addresses or an entire
    network address block. Public addresses are usually assigned to a business''s
    public servers. With public IP addresses, outgoing connections are forwarded and
    incoming connections are routed normally. A local subnet can be defined to create
    a local, public DMZ.


    # Dividing Space to Create Multiple Networks


    IP addresses are divided into two pieces: a network address and a host address
    within that. As stated in Chapter 1,"Preliminary Concepts Underlying Packet-Filtering
    Firewalls,” Class A, B, and C are addresses of an artifact, that they remain the
    addresses to use as examples because their network and host fields fall on byte
    boundaries. Class A, B, and C network addresses are defined by their first 8,
    16, and 24 bits, respectively. Within each address class, the remaining bits define
    the host part of the IP address. This is shown visually in Table 7.1.


    Subnetting is a local extension to the network address part of the local IP addresses.
    A local network mask is defined as one that treats some of the most significant
    host address'
