    Table 5.5 lists the DHCP message type descriptions, as quoted from RFC 2131, "Dynamic
    Host Configuration Protocol."


    In essence, when the DHCP client initializes, it broadcasts a DHCPDISCOVER query
    to discover whether any DHCP servers are available. Any servers receiving the
    query may respond with a DHCPPOFFER message indicating their willingness to function
    as server to this client; they include the configuration parameters that they
    have to offer. The client broadcasts a DHCPREQUEST message to accept one of the
    servers and to inform remaining servers that it has chosen to decline. The server
    responds with a DHCPACK message, indicating confirmation of the parameters that
    it originally offered. Address assignment is complete at this point. Periodically,
    the client sends a DHCPREQUEST requesting a renewal on the IP address. If the
    lease is renewed, the server responds with a unicast DHCPACK message. Otherwise,
    the client falls back to the initialization process. Table 5.6 lists the complete
    client/server protocol for the DHCP service.


    # Table 5.5 DHCP Message Types


    | DHCP Message | Description |

    |---|---|

    | DHCPDISCOVER | Client broadcast to locate available servers |

    | DHCPFFER | Server in response to DHCPDISCOVER with offer of configuration parameters
    |

    | DHCPREQUEST | Client message to servers (a) requesting offered parameters from
    one server and implicitly declining offers from all others; (b) confirming correctness
    of previously allocated address after, for example, system reboot; or (c) extending
    the lease on a particular network address |

    | DHCPACK | Server to client with configuration parameters, including committed
    network address |

    | DHCPNAK | Server to client indicating that client''s notion of address is incorrect
    (for example, client has moved to new subnet) or client''s lease has expired |

    | DHCPDECLINE | Client to server indicating that network address is already in
    use |

    | DHCPPRELEASE | Server to server relinquishing network address and canceling
    remaining lease |

    | DHCPINFORM | Client to server, asking only for local configuration parameters;
    client already externally configured address |'
