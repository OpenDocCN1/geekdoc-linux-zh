- pgno: 60
  md: '# Chapter 2 Packet-Filtering Concepts


    common configuration errors, or due to known flaws in the software. Because these
    services are so common, they are good examples of why you want to either not offer
    them to the outside world, or very carefully offer them with controlled access.
    NetBIOS (137-139/tcp/udp) and Server Message Block (SMB) on Windows (445/tcp)
    are notoriously tedious. They typically pose no threat to a Linux system unless
    Samba is used on the system. The typical target is a Windows system, in fact,
    but the scans are all too common.


    # Stealth Scans


    Stealth scans, by definition, aren''t meant to be detectable.They are based on
    how the TCP protocol responds to unexpected packets, or packets with illegal flag
    combinations. For example, considering an incoming packet that has the ACK flag
    set but no related connection. If the ACK were sent to a port with a listening
    server attached, the TCP stack would return a TCP RST message to tell the sender
    to reset the connection. If the ACK were sent to an unused port, the system would
    simply return a TCP RST message as an error indication,just the firewall might
    return an ICMP error by default.


    The issue is further complicated because firewalls test only for the SYN flag
    or the ACK flag. If neither is set, or if the packet contains some combination
    of flags, the firewall implementation might pass the packet up to the TCP code.
    Depending on the TCP state flag combination and the operating system receiving
    the packet, the system will respond with an RST or silence.This mechanism can
    be used to help identify the operating system that the target system is running.
    In any of these cases, the receiving system isn''t likely to log the event.


    Inducing a target host to generate an RST packet in this manner can also be used
    to map a network, determining the IP addresses of systems listening on the network.
    This is especially helpful if the target system isn''t a server and its firewall
    has been set to silently drop unwanted packets.


    # Avoiding Paranoia: Responding to Port Scans


    Firewall logs normally show all of failed connection attempts. Probes are the
    most common thing you''ll see in your logs.


    Are people probing your system often? Yes, they are. Is your system compromised?
    No, it isn''t. Not necessarily. The ports are blocked. The firewall is doing its
    job.These failed connection attempts that the firewall denied.


    At what point do you personally decide to report a probe? At what point do you
    say that enough is important to take the time to report it? At what point is that
    enough to get on with your life, or should you be writing abuse@some.system each
    time? There are no "right" answers. How you respond is a personal judgment and
    depends in part on the resources available to you, how sensitive the information
    at your site is, and how critical the Internet connection is to your site. For
    obvious probes and scans, there is no clear-cut answer. It depends on your own
    personality and comfort level how you personally define a serious probe, and your
    social conscience.'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'With that all in mind, these are some workable guidelines.


    The most common attempts are a combination of automated probing, mistakes, legitimate
    attempts based on the history of the Internet, ignorance, curiosity, and misbehaving
    software.


    You can almost surely ignore isolated, single connection attempts to telnet, ssh,
    ftp, finger, or any other port for a common service that you''re not probing.
    Probes and scans are a fact of life on the Internet, are all too frequent, and
    usually do not pose a risk. They are kind of door-to-door salespeople, commercial
    phone calls, wrong phone numbers, and junk postal mail. For me, at least, isn''t
    enough time in the day to respond to each one.


    On the other hand, some probes are more persistent. You might decide even to add
    firewall rules to block them completely, or even your entire IP address space.


    Scans of the ports known to be security holes are typically the precursor to an
    attack if an open port is found. More inclusive scans are part of a broader scan
    for openings throughout a domain or subnet. Current hacking tools probe a subset
    of these probes one after the other.


    Occasionally, you will see serious hacking attacks. This is unquestionably a time
    to take action. Report them. Double-check your security. Observe what they''re
    doing. Block them their IP address block.


    Some administrators take every occurrence seriously because, if their machine
    is secure, other people''s machines might not be. The next person might not have
    the capability of knowing that he or she is being probed. Reporting probes is
    the socially right thing to do, for everyone''s sake.


    How you respond to port scans? If you write these people, your postmaster, your
    uplink service provider network operations center (NOC), or the network address
    block coordinator, to be polite. Give them the benefit of the doubt. Overreactions
    are misplaced more often than not. What might appear as a serious hacking attempt
    to you is a curious kid playing with a new game. A polite word to the abuser,
    root, or postmaster sometimes takes care of the problem. More people need to be
    educated about Netiquette than their network accounts rescinded. And they might
    be innocent of anything. Just as often, the person''s system is compromised and
    that person has no idea what''s going on and will will be grateful for the information.


    Probes are not the only traffic you''ll see, however. Although probes are harmless
    in and of themselves, DOS attacks are not.


    # Denial-of-Service Attacks


    DoS attacks are based on the idea of flooding your system with packets to disrupt
    or degrade your Internet connection, tying up local servers to the extent that
    legitimate requests can''t be honored or, in the worst case, crashing your system
    altogether. The two most common results are keeping the system too busy to do
    anything useful and tying up critical system resources.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Chapter 2 Packet-Filtering Concepts


    You can''t protect against DoS attacks completely. They can take as many different
    forms as the attacker''s imagination allows. Anything that results in your system
    allocating resources (including logging of the attack), anything that induces
    a remote site to stop communicating with you—all can be used in a DoS attack.


    > On Denial-of-Service Attacks

    For further information on DoS attacks, see the "Denial of Service" paper available
    at http://www.cert.org.


    These attacks usually involve one of several classic patterns, including TCP SYN
    flooding, ping flooding, UDP flooding, fragmentation bombs, buffer overflows,
    and ICMP routing redirect bombs.


    # TCP SYN Flooding


    A TCP SYN flood consumes your system resources until no more incoming TCP connections
    are possible (see Figure 2.8). The attack makes use of the basic TCP three-way
    handshake protocol during connection establishment, in conjunction with IP address
    spoofing.


    The attacker spoofs his her source address as a private address and initiates
    a connection to one of your TCP-based services. Appearing to be a client attempting
    to open a TCP connection, the attacker sends you an artificially generated SYN
    message. Your machine responds by sending an acknowledgment, a SYN-ACK. However,
    in this case, the


    ![](img/48efc603406f52595e8bb3258079832d_62_0.png)


    Figure 2.8 A TCP SYN flood'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Filtering Incoming Packets


    address that you are replying to isn''t the attacker''s address. In fact, because
    the address is private, there is no one out there to respond. The spoofed host
    won''t earn an RST message to tear down the half-open connection.


    The final stage of TCP connection establishment, receiving an ACK in response,
    will never happen. Consequently, finite network resources are consumed. The connection
    remains in a half-open state until the connection attempts to time out. The attacker
    floods your port with connection request after connection request, faster than
    the TCP timeouts release the resources. If this continues, all resources will
    be in use and no more incoming connection requests can be accepted. This applies
    not only to the service being probed, but to all new connections.


    Several aids are available to Linux users. The first is source address filtering,
    described previously. This filters out the most commonly used spoofed source addresses,
    but there is no guarantee that the spoofed address falls within the categories
    you can anticipate and filter.


    The second is to enable your kernel''s SYN cookie module, a specific retard to
    the resource starvation caused by SYN flooding. When the connection begins to
    fill, the system starts responding to SYN requests with SYN cookies like SYN-ACK,
    and it frees the queue slot. But then, the queue never fills completely. The cookie
    has a short timeout; the client must respond to it within a short period before
    the host responds with the expected SYN-ACK. The cookie is a sequence number based
    on the original sequence number in the SYN, the source and destination addresses
    and ports, and a secret value. If the response to the cookie matches the result
    of the hashing algorithm, the server is reasonably well assured that the SYN is
    valid.


    Depending on the particular release, you may or not need to enable the SYN cookie
    protection within the kernel using the command echo 1 > /proc/sys/net/ipv4/tcp_syncookies.
    Some distributions and kernel versions require you to explicitly configure the
    option into the kernel using make config, make menuconfig, or install the new
    kernel.


    SYN Flooding and IP Spoofing


    For more information on SYN flooding and IP spoofing, see CERT Advisory CA-96.211,
    "TCP SYN Flooding and IP Spoofing," at http://www.cert.org.


    # ping Flooding


    Any message that elicits a request from your machine can be used to degrade your
    network connection by forcing the system to spend most of its responding time.
    ICMP echo request message sent by ping is a common culprit. An attack called Smurf,
    and its variants, is to spoof the victim''s source address and broadcast an echo
    request to an entire network of hosts. A single spoofed request message can result
    in hundreds or thousands of resulting replies sent to the victim. Another way
    of accomplishing a similar result is to install trojans on compromised hosts across
    the Internet and time them'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Chapter 2 Packet-Filtering Concepts


    to send echo requests to the same host simultaneously. Finally, a simple ping
    flood in which the attacker sends more echo requests and floods the data connection
    is another method for a DoS, though it is becoming less common. A typical ping
    flood is shown in Figure 2.9.


    # Ping of Death


    An older exploit called the Ping of Death involved sending very large ping packets.
    Vulnerable systems could crash as a result. Linux is not vulnerable to this exploit,
    nor are many other current attacks attempts to break into other UNIX operating
    systems. If your firewall is protecting older systems or personal computers, those
    could be vulnerable.


    The Ping of Death exploit gives an idea of how the simplest protocols and message
    interactions can be used by the creative hacker. Not all attacks are attempts
    to break into your computer. Some are merely destructive. In this case, the goal
    is to crash the machine (System crashes might also be an indicator that you need
    to check your system for installed trojan programs. You might have been duped
    into loading a trojan program, but the program itself might require a system reboot
    to activate).


    ping is a very useful basic networking tool. You might not want to disable incoming
    ping or at least severely limiting from whom you accept echo requests. In today''s
    Internet environment, conservative folks recommend disabling incoming ping because
    ping''s history of involvement in DoS attacks, many sites no longer respond to
    external ping requests from any but selected sources. This has always seemed to
    be an overreaction to the relatively small threat of a DoS based on ICMP when
    compared to the more ubiquitous and dangerous threats against applications and
    other protocols within the stack.


    ![](img/48efc603406f52595e8bb3258079832d_64_0.png)


    Figure 2.9 A ping flood'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'Dropping ping requests isn''t a solution for the victim host, however. Regardless
    of how the recipient of the flood reacts to the packets, the system (or network)
    can still be overwhelmed by the process of inspecting and dropping a flood of
    requests.


    # UDP Flooding


    The UDP protocol is especially useful as a DoS tool. Unlike TCP, UDP is stateless.
    Flow-control mechanisms aren''t included. There are no connection state flags.
    Datagram sequence numbers are not used. Information is maintained on which packet
    is expected next. There is no way to differentiate client traffic from server
    traffic based on port numbers. Without state, there is no way to distinguish an
    expected response from an unsolicited arrival arriving unexpectedly. It''s relatively
    easy to keep a system busy responding to incoming UDP probes that no bandwidth
    is left for legitimate network traffic.


    Because UDP services are susceptible to these types of attacks (as opposed to
    connection-oriented TCP services), many sites disable all UDP ports that are absolutely
    necessary. As mentioned earlier, almost all Internet services are TCP-based. The
    firewall we''ll build in Chapter 5, "Building and Installing a Standalone Firewall,"
    carefully limits UDP traffic to only those remote hosts providing necessary UDP
    services.


    The classic UDP flood attack either involves two victim machines or works in the
    same way the Smurf ping does (see Figure 2.10). A single spoofed packet from the
    attacker''s UDP echo port, directed to a host''s UDP charge port, can result in
    an infinite loop of network traffic.The echo and charge services are network test
    services. charge generates an ASCII string, echo returns the data to the port.


    > Source Address: Intermediary

    Destination Address: Victim

    Source Port: UDP 7-charge


    ![](img/48efc603406f52595e8bb3258079832d_65_0.png)


    Source Address: Victim

    Destination Address: Intermediary

    Source Port: UDP 7 - echo

    Destination Port: UDP 19 - charge


    Figure 2.10 A UDP flood'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# Chapter 2 Packet-Filtering Concepts


    # UDP Port Denial-of-Service Attacks


    For a full description of DoS exploit using these UDP services, see CERT Advisory
    CA-96.01, "UDP Port Denial-of-Service Attack," at http://www.cert.org.


    # Fragmentation Bombs


    Different underlying technologies (such as Ethernet, Asynchronous Transfer Mode
    [ATM], and token ring) define different limits on the size of the Layer 2 frame.
    A packet is passed from one router to the next along the path from the source
    machine to the destination machine, network gateways may need to cut the packet
    into smaller pieces, called fragments, the first fragment contains the usual source
    and destination port numbers contained in the UDP or TCP transport header. The
    following fragments do not.


    For example, the maximum theoretical packet length is 65,535 bytes, the maximum
    Ethernet frame size (Maximum Transmission Unit, or MTU) is 1500 bytes. When a
    packet is fragmented, intermediate routers do not reassemble the packet. The packets
    are reassembled either at the destination or by its adjacent router.


    Because intermediate fragmentation is ultimately more costly than sending smaller,
    nonfragmented packets, current systems offer no MTU with the target host at the
    beginning of a connection. This is done by sending a packet with the *Don''t Fragment*
    option set in the IP header options (the only legitimate current option). If an
    intermediate router must fragment the packet, it drops the packet and returns
    an ICMP 3 error, fragmentation-required.


    One type of fragmentation attack involves artificially constructing very small
    packets. One-byte packets crash some operating systems. Current operating systems
    usually test for this condition.


    Another use of small fragments is constructing the initial fragment so that the
    UDP or TCP ports are contained in the second fragment. (All networks) MTUs are
    large enough to carry a standard 40-byte IP and transport header.) Packet-filtering
    firewalls allow these fragments because the information that the filter is not
    present. This form of attack is useful to get packets through the firewall that
    would otherwise be allowed.


    The Ping of Death exploit mentioned earlier is an example of fragmentation to
    carry an illegally ICMP message. When the ping request is requested, the entire
    packet size is larger than 65,535 bytes, causing some systems to crash.


    A classic example of a fragmentation exploit is the Teardrop attack. The method
    can be used to bypass a firewall or to crash a system. The first fragment is constructed
    to go to an allowed service. (Many firewalls don''t inspect fragments after the
    first packet.) If it is allowed, the subsequent fragments be passed through and
    reassembled by the target host. If the first packet is dropped, the subsequent
    packets will pass through the firewall, but the end host will have nothing to
    reconstruct and eventually discard the partial packet.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Filtering Incoming Packets


    The data offset fields in the subsequent fragments can be altered to overwrite
    the port information in the first fragment to access a disallowed service. The
    offset can also be altered so that offsets used in packet reassembly turn out
    to be negative numbers. Because kernel-copy routines use unsigned numbers, the
    negative value is treated as a very large positive number; the resulting copy
    trashes memory and the system crashes.


    Firewall machines and machines that do NAT for other local hosts should be configured
    to reassemble the packets before delivering them to the local target. The iptables
    features require the system to reassemble packets before forwarding the packet
    to the destination host, and reassembly is done automatically.


    # Buffer Overflows


    Buffer overflow exploits can be protected by a filtering firewall. The exploits
    fall into two main categories. The first is simple to cause a system or crash
    by overwriting its data space or runtime stack. The second requires technical
    expertise and knowledge of the hardware and software server being attacked. The
    purpose of overflow is to overwrite the runtime stack so that the return stack
    contains a program and a jump to it. This program usually starts with a root privilege.


    Many of the current vulnerabilities in servers are a result of buffer overflows.
    It''s important to install and keep up-to-date all the newest patches and software
    revisions.


    # ICMP Redirect Bombs


    ICMP redirect message Type 5 tells the target system to change its in-memory routing
    tables in favor of a shorter route. Redirect are sent by routers to their adjacent
    hosts. Their intention is to inform the host that a shorter path is available
    (that is, the host and new router are on the same network, and the new router
    is the router that the original router route the packet to its next hop).


    Redirects arrive on an almost-daily basis. They rarely originate from the adjacent
    router. For residential or business sites connected to an ISP, it''s very unlikely
    that your adjacent router will generate a redirect message.


    If your host uses static routing and honors redirect messages, it''s possible
    for someone to fool your system into thinking that a remote machine is one of
    your local machines or one of your ISP''s machines, even to fool your system into
    forwarding all traffic to your remote host.


    # Denial-of-Service Attacks and Other System Resources


    Network connectivity isn''t the only concern in DOS attacks. Here are some examples
    of other areas to keep in mind while configuring your system:


    +   - Your filesystem can overflow if your system is forced to write numerous
    messages to the error logs, or if your system is flooded with many copies of large
    email messages. You might want to configure resource limits and set up a separate
    partition for rapidly growing or changing filesystems.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Chapter 2 Packet-Filtering Concepts


    # Email Denial-of-Service Exploits


    For a description of a DoS exploit using email, “Email Bombing and Spamming” at
    http://www.cert.org.


    +   - System memory, process table slots, CPU cycles, and other resources can
    be exhausted by repeated, rapid invocations of network services. You can do little
    about this other than setting any configurable limits for each individual service,
    enabling SYN cookies, and denying rather than rejecting packets sent to unsupported
    ports.


    # Source-Routed Packets


    Source-routed packets employ a rarely used IP option that allows the originator
    to define the route taken between two machines, rather than letting the intermediate
    routers determine the path. As with ICMP, this feature can allow someone to fool
    your system into thinking it’s talking to a local machine, an ISP machine, or
    some other trusted host, or to create the necessary packet flow for a man-in-the-middle
    attack.


    Source routing has few legitimate uses in current networks. Some routers ignore
    the option. Some firewall discard packets containing the option.


    # Filtering Outgoing Packets


    If your environment represents a trusted environment, filtering outgoing packets
    might not appear to be as critical as filtering incoming packets. Your system
    won’t respond to incoming messages if the firewall does not pass through. Residential
    sites often take this approach. Nevertheless, even for residential sites, symmetric
    filtering is important, particularly if the firewall filters Microsoft Windows
    machines. For commercial sites, outgoing filtering is arguably important.


    If you protect a LAN of Microsoft Windows systems, controlling outgoing traffic
    becomes much more important. Compromised Windows machines have historically been
    (and continue to be used) in coordinated DOS attacks and other outbound attacks.
    For this reason especially, it’s important to filter what leaves your network.


    Filtering outgoing messages allows you to run LAN services without leaking into
    the Internet, where these packets don’t belong. It’s not a question of disallowing
    external access to local LAN services. It’s also a question of broadcasting local
    system information into the Internet. Examples of this would be if you were running
    a local DHCP, NTP, SMB, or other server for internal use. Other unobnoxious services
    might be broadcasting wall or syslog messages.


    A related source is some of the personal computer software, which sometimes ignores
    the Internet service protocols and reserved assignments. This is the personal
    computer of running a program designed for LAN use on an Internet-connected machine.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'A final reason is to keep local traffic that isn''t intended to leave the LAN
    but that conceivably could. Keeping local traffic local is a good idea from a
    security standpoint but also as a means for bandwidth conservation.


    # Local Source Address Filtering


    Filtering outgoing packets based on the source address is easy. For a small site
    or a single computer connected to the Internet, the source address is always your
    computer''s IP address during normal operation. There is no reason to allow an
    outgoing packet to have any other source address, and the firewall should enforce
    this.


    For people whose IP is dynamically assigned by their ISP, a brief exception exists
    during address assignment. This exception is specific to DHCP and is the one case
    in which host broadcasts messages using 0.0.0.0 as its source address.


    For people with a LAN whose firewall has dynamically assigned IP address, limiting
    outgoing packets to contain the source of the firewall machine''s IP address is
    mandatory. It protects you from fairly configuration mistakes that appear as source
    address spoofing or illegal source addresses to remote hosts.


    If your users or their software are not 100% trustworthy, it is important to ensure
    that local traffic contains legitimate, local addresses only, avoid participating
    in DOS attacks using source address spoofing.


    This last point is especially important. RFC 2827,"Ingress Filtering: Defeating
    Denial of Service Attacks Which Employ IP Address Spoofing"updated by RFC 3704,"Ingress
    Filtering for Multihomed Networks") is a current "best practices" document speaking
    to exactly this point. Ideally, every router should filter out the obvious source
    addresses and ensure that traffic leaving the local network contains only routable
    source addresses belonging to that network.


    # Remote Destination Address Filtering


    As incoming packets, you might want to allow outgoing packets to be addressed
    only to specific remote networks or individual machines. In these cases, the firewall
    rules will define either specific IP addresses or a limited range of IP destination
    addresses to which packets will be allowed.


    The first class of outgoing packets to filter by destination address is packets
    destined to remote servers you''ve contacted. Although some packets, such as those
    going to FTP servers, can be expected to be delivered from anywhere on the Internet,
    other services will be offered only from your ISP or specially chosen trusted
    hosts. Examples of these that are offered only by your ISP are mail services such
    as SMTP or POP3, DNS services, DHCP dynamic IP address assignment, and the Usenet
    news service.


    The second class of outgoing packets to filter by destination address is packets
    destined to remote clients who are accessing a service offered from your site.Again,
    although some outgoing service connections, as responses from your local web server,
    can be'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Chapter 2 Packet-Filtering Concepts


    expected to be anywhere, other local services will be offered to only a few trusted
    remote sites or friends. Examples of restricted local services might be telnet,
    SSH, Samba-based services, and RPC services accessed via portmap. Not only the
    firewall rules deny general incoming connections to these services, but the rules
    won''t allow going responses from these services to just anyone.


    # Local Source Port Filtering


    Explicitly defining which service ports on your network can be used for outgoing
    connections serves two purposes—one for your client programs and one for your
    server programs. Specifying the source ports allowed for your outgoing connections
    ensures that your programs are behaving correctly, and it protects people from
    any local network traffic that doesn''t belong on the Internet.


    Outgoing connections from your clients will always originate from an unprivileged
    port. Limiting your clients to the unprivileged ports in the firewall helps other
    people from potential mistakes by ensuring that your client programs are behaving
    as expected.


    Outgoing packets from your local server programs will always originate from their
    assigned service port and will be in response to a request received. Limiting
    your servers to their assigned ports at the firewall level ensures that your servers
    function correctly at the protocol level. More important, it helps protect any
    private, local network services that might be running from outside access. It
    also helps remote sites from being bothered by network traffic that should remain
    confined to your local systems.


    # Remote Destination Port Filtering


    Your local client programs are designed to connect to network servers offering
    their services from their assigned service ports. From this perspective, limiting
    your local clients to connect only to their associated server''s service port
    ensures protocol correctness. Limiting your client connections to specific destination
    ports serves a couple of other purposes as well. First, it helps guard against
    local, private network client programs inadvertently attempting to access servers
    on the Internet. Second, it does much to disallow outgoing mistakes, port scans,
    and other potentially originating from your site.


    Your local server programs will almost always participate in connections originating
    from unprivileged ports. The firewall rules limit your servers'' outgoing traffic
    to only unprivileged destination ports.


    # TCP Connection State Filtering


    Outgoing TCP packet acceptance rules can make use of the connection state flags
    associated with TCP connections, just as the incoming rules do. All TCP connections
    adhere to the same set of connection states, which differs between client and
    server.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Private versus Public Network Services 49


    Outgoing TCP packets from local clients will have the SYN flag set in the first
    packet sent as part of the three-way connection handshake. The initial connection
    request will have the SYN flag set, but not the ACK flag. Your local client firewall
    rules will allow outgoing packets either with the SYN or the ACK flag.


    Outgoing packets from local servers will always be responses to an initial connection
    requested by a remote client program. Every packet sent from your servers will
    have the ACK flag set. Your local server firewall rules will require all outgoing
    packets from your servers to have the ACK flag set.


    # Private versus Public Network Services


    One of the easiest way to inadvertently allow unwanted intrusions is to allow
    access to local services that are designed only for LAN use. Some services, if
    offered locally, should never cross the boundary between your LAN and the Internet
    beyond. Some of these services annoy your neighbors, provide information that
    you''d be off keeping to, and some present glaring security holes if they''re
    available outside your LAN.


    Some of the earliest network services, the r*-based commands in particular, were
    designed for local sharing and ease of access across multiple machines in a trained
    environment. Some of the later services were intended for Internet access, but
    they were designed at a time when the Internet was basically an extended community
    of academics and researchers. The Internet was a relatively open, safe place.
    As the Internet grew into a global network including general public access, it
    developed into a completely untrusted environment.


    Lots of Linux network services are designed to provide local information about
    user accounts on the system, which programs are running and what resources are
    in use, system status, network status, and similar information from other machines
    connected over the network. Not all of these informational services represent
    security holes in themselves. It''s not that someone can use them directly to
    gain unauthorized access to your system. That they provide information about your
    system and user accounts that can be useful to someone who is looking for known
    vulnerabilities. They might also supply information such as usernames, addresses,
    phone numbers, and so forth, which you don''t want to be readily available to
    everyone who asks.


    Some of the more dangerous network services are designed to provide LAN access
    to shared filesystems and devices, as a networked printer or fax machine. Some
    services are difficult to correctly configure and are difficult to configure secure.
    Entire books are devoted to configuring some of the more complicated Linux services.
    Specific service configuration is beyond the scope of this book.


    Some services just don''t make sense in a home or small-office setting. Some are
    intended to manage large networks, provide Internet routing service, provide large
    baseline informational services, support two-way encryption and authentication,
    and so forth.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Protecting Nonsecure Local Services


    The easiest way to protect yourself is to not offer the service. But what if you
    need one of these services locally? Not all services can be protected adequately
    at the packet-filtering level. File-sharing software, instant messaging services,
    and UDP-based RPC services are notoriously difficult to secure at the packet-filtering
    level.


    One way to safeguard your computer is to host network services on the firewall
    that you don''t intend for public use. If the service isn''t available, there''s
    nothing for a remote client to connect to. Let firewalls be.


    A packet-filtering firewall doesn''t offer complete security. Some programs higher-level
    security measures can be provided at the packet-filtering level. Some programs
    are too problematic to risk running on a firewall machine, even on a less residential
    home.


    Small sites as those in the home won''t have a supply of computers able to enforce
    access security policies by running private services on other machines. Compromises
    must be made, particularly for required services that are provided solely by Linux.
    Nevertheless, small sites with a LAN should not be running file-sharing or other
    private LAN services on the firewall, such as Samba. The machine should not have
    unnecessary user accounts. Unneeded software should be removed from the system.
    The machine should have no function other than that of a security gateway.


    # Selecting Services to Run


    When all is said and done, you can decide which services you need or want. The
    first step in securing your system is to decide which services and daemons you
    intend to run on the firewall machine, as well as behind the firewall in the private
    LAN. Each service has its own security considerations. When it comes to selecting
    services to run under Linux or any other operating system, the general rule of
    thumb is to run only network services that you need and understand. It''s important
    to understand a network service, what it does and who it''s intended for, before
    you run it—especially on a machine connected directly to the Internet.


    # Summary


    Between this and the preceding chapter, the basics of networking and firewalls
    have been laid out. The next chapter digs deeper into iptables.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# 3

    iptables: The Legacy Linux Firewall Administration Program


    Chapter 2, "Packet-Filtering Concepts," covered the background ideas and concepts
    behind a packet-filtering firewall. Each built-in it is list of rules, sometimes
    called a rule chain, has its own default policy. Each rule can apply only to an
    individual, but also to a specific network interface protocol type (such as TCP,
    UDP, or ICMP), and ser-port or ICMP message type. Individual acceptance, denial,
    and rejection rules are defined for the INPUT chain and the OUTPUT chain, as for
    the FORWARD chain, which you''ll learn about at the end of this chapter and in
    Chapter 7, "Packet Forwarding.\nThis chapter covers the iptables administration
    program is part of the legacy firewall code in the Linux kernel. Beginning with
    version 3.13 of the kernel, a new filtering mechanism was added nftables.The next
    looks at nftables. This chapter focuses on the legacy iptables administration
    program because it is still widely used across Linux systems. For those of you
    who are familiar or accustomed to the older ipfw and ipchains programs used with
    theW technology, iptables will look very similar to those programs. However, it
    is much more feature-rich and flexible, and it is very different on subtle levels.

    There is indeed a difference between iptables and Netfilter, though you''ll often
    hear the terms interchangeably. Netfilter is the Linux kernel-space program code
    to implement a firewall within the Linux kernel, either compiled directly into
    the kernel or included as a set of modules. On the other hand, iptables is the
    userland program used for administration of the Netfilter firewall. Throughout
    this text, I will refer to iptables as being inclusive of both Netfilter and iptables,
    unless otherwise noted.


    # Differences between IPFW and Netfilter Firewall Mechanisms


    Because iptables is so different from the previous ipchains, this book won''t
    attempt to cover the older implementation.

    The next section is written for the reader who is familiar or is currently using
    ipchains. If iptables is your first introduction to Linux firewalling, you can
    skip ahead to the section "Netfilter Packet Traversal."'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Chapter 3 iptables: The Legacy Linux Firewall Administration Program


    If you are converting ipchains, you''ll notice several minor differences in the
    iptables syntax, most notably that the input and output network interfaces are
    identified separately. Other differences include:


    +   - iptables is highly modularized, and the individual modules can be loaded
    explicitly.

    - Logging is a rule target rather than a command option.

    - Connection state tracking can be maintained. Address and Port Translation are
    specially functions from packet filtering.

    - Full Source and Destination Address Translation are implemented.

    - Masquerading is a term used to refer to a specialized form of source address
    NAT.

    - Port forwarding and Destination Address Translation are supported directly without
    the need for third-party software support as ipmasquadm.


    Masquerading in Earlier Versions of Linux

    For those of you are new to Linux, Network Address Translation (NAT) is fully
    implemented in iptables. Before this, NAT was called masquerading in Linux. A
    simple, partial implementation of Source Address Translation, masquerading was
    used by site owners who had a single public IP address and wanted others on their
    private network to be capable of accessing the Internet. Outgoing packets from
    these hosts had their source address masqueraded to that of public, routable IP
    address.


    The most important difference is in how packets are routed or forwarded through
    the operating system, making subtle differences in how the firewall rule set is
    constructed. For ipchains users, understanding the differences in packet traversal
    that are discussed in the next two sections is very important. iptables and ipchains
    look much alike on the surface, but they are very different in practice. It is
    very easy to syntactically correct iptables rules that have a different effect
    from what a similar rule would have in ipchains. It can be confusing. If you already
    know ipchains, you must keep the differences in mind.


    # IPFW Packet Traversal


    Under IPFW (ipfw and ipchains), three built-in filter chains were used. All packets
    arriving on an interface were filtered against the INPUT chain. If the packet
    was accepted, it was passed to the routing module. The routing function determined
    whether the packet was passed to be delivered or forwarded to another output interface.
    IPFW packet flow is pictured in Figure 3.1.


    If forwarded, the packet was filtered a second time against the FORWARD chain.
    If the packet was accepted, it was passed to the OUTPUT chain.


    Both generated outgoing packets and forwarded packets were passed to the OUTPUT
    chain. If the packet was accepted, it was sent out the interface.'
  merge: -1
  img_proc: true
