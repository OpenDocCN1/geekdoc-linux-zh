- pgno: 201
  md: '# 7


    # Packet Forwarding


    This chapter covers some of the basic issues underlying LAN security, the forwarding
    of gateway firewalls, and perimeter networks. Security policies are defined relative
    to the site''s level of security needs, the importance or value of the data being
    protected, and the cost of lost data or privacy. This chapter opens by reviewing
    the firewalls presented in earlier chapters and then discusses that the site''s
    policy maker must address when choosing server placement and determining security
    policies.


    You may need Network Address Translation (NAT) to access the Internet from internal
    machines. NAT is not discussed in Chapter 8, "NAT—Network Address Translation."
    This chapter focuses on forwarding alone.


    For readers familiar with iptchains and ipfwadm, forwarding and NAT were combined
    syntactically. Both functions were specified by a single forward rule. logically
    distinct functions are distinct in iptables and nftables. In fact, the two functions
    are handled by separate tables with separate chains. NAT is applied separately
    at a different point in the packet''s traversal through the system. This chapter
    focuses on the iptables services available in the filter table and in its extensions
    and the forward features of nftables. Chapter 8 looks at the services related
    to NAT.


    # The Limitations of a Standalone Firewall


    The single-system firewall presented in Chapter 5, "Building and Installing a
    Standalone Firewall," is a basic bastion firewall, using only basic chains in
    the filter table. When the firewall is a packet-filtering router that has a network
    interface connected to the Internet and another connected to your LAN (referred
    to as a dual-home system), the firewall applies rules to decide whether to forward
    or block packets between the two interfaces. In this case, the packet-filtering
    firewall is a static router with traffic-steering rules enforcing local policies
    concerning which packets are allowed through the network interfaces.


    As pointed out in Chapter 3, "iptables: The Legacy Firewall Administration Program,"
    Netfilter handles forwarded packets quite differently from the previous IPFW mechanism.
    Forwarded packets are handled by the FORWARD chain. The INPUT and OUTPUT rules
    do not apply. Network traffic related to the local firewall host and network traffic
    related to the LAN have completely different sets of rules and rule chains.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# Chapter 7 Packet Forwarding


    Rules on the FORWARD chain can specify both the incoming and the outgoing interface.
    For a dual-homed host setup with LAN, the firewall rules applied to the incoming
    and outgoing network interfaces represent an I/O pair—one rule for arriving packets
    and a reverse rule for departing packets. The rules are directed. The two interfaces
    are handled as a unit.


    Traffic is not routed directly between the Internet and the LAN automatically.
    Packets to be forwarded flow without a rule pair to accept the traffic. The filtering
    rules applied to the two interfaces act as a firewall and static router between
    the two networks.


    The firewall configuration presented in Chapter 5 is typically adequate for any
    individual-homed host system with a single network interface.


    As a standalone gateway protecting a LAN, if the firewall machine is ever compromised,
    it is all over. Even if the firewall''s local interfaces have completely different
    policies from forwarded traffic, if the system has been compromised, it will long
    before the intruder has gained root access. At that point, the internal systems
    are wide open. Once, a home LAN will never have to face this situation if the
    services offered to the Internet are chosen carefully and a stringent firewall
    policy is enforced. Still, a standalone gateway represents a single point of failure.
    It is an all-or-nothing situation.


    Many large organizations and corporations rely on a single gateway setup, and
    many use one of two other architectures: a screened-subnet architecture with proxy
    services, along with a DMZ network created either or alongside the external firewall,
    separated from the private LAN. Public servers in the DMZ network have their specialized,
    bastion firewalls as well. This means that they have lot more computers at their
    disposal—and staff to manage them.


    DMZ: A Perimeter Network by Any Other Name

    A perimeter network between two firewalls is called a demilitarized zone (DMZ).
    The purpose of a DMZ is to establish a protected space from which to run public
    servers (services) and to isolate that from the space of the private LAN. If a
    server in the DMZ is compromised, that server remains isolated from the LAN; the
    gateway firewalls and bastion running on the other DMZ servers offer protection
    against the compromised server.


    In addition to the single-system, standalone firewall, the firewall presented
    in Chapter 5 can be expanded to form the basis for a dual-homed gateway firewall
    protecting the host, which offers one or a few public services. A home LAN is
    often protected by a single-gateway firewall that both forwarded traffic and offers
    public services.


    What options are available for a dual-homed system that cannot afford the risk
    of a single-gateway or of many computers and a staff to manage them? Unfortunately,
    a dual-homed firewall and LAN offer stronger security when the system is configured
    carefully. The question is: Is the extra effort of maintaining the firewall worth
    the increased security in a trusted environment?'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# Basic Gateway Firewall Setups


    Two basic firewall setups are used here. As shown in Figure 7.1, the gateway has
    two network interfaces: one connected to the Internet and one connected to the
    DMZ. Public Internet services are offered from machines in the DMZ network.The
    gateway firewall offers no services. A second firewall, a choke firewall, is also
    connected to the DMZ network, separating the internal, private networks from the
    quasi-public server machines in the perimeter network. Private machines are protected
    by the choke firewall on the internal LAN. Additionally, the gateway runs a specialized
    firewall of its own. If the gateway or one of the servers fails, the public server
    machines in the DMZ continue to run their individual firewalls. The choke firewall
    protects the internal LAN from a compromised gateway or from any other compromised
    machines in the perimeter network. Traffic between the LAN and the Internet passes
    through both firewalls and crosses the perimeter network.


    In the second setup, the gateway has three network interfaces: one connected to
    the Internet, one connected to the DMZ, and one connected to the private LAN.
    As shown in Figure 7.2, traffic between the LAN and the Internet, and traffic
    between the DMZ and the Internet, share nothing except the gateway''s external
    network interface.


    An advantage of this configuration over the first is that neither the LAN nor
    the DMZ shares the load of both networks. Another advantage is that it''s easier
    to define rules that refer to all LAN or DMZ traffic specifically, as opposed
    to traffic related to the other network. Another advantage is that a single-gateway
    host is less expensive than two separate firewall devices.


    The disadvantage of this configuration over the first is that the gateway becomes
    a single point of failure for both networks. Also, the firewall rules in the single
    host include


