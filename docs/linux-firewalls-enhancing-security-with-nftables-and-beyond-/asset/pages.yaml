- pgno: 219
  md: '# NAT—Network Address Translation


    Network Address Translation is a technology to substitute one source or destination
    address in the IP header with another address. Traditionally, it''s an IP address
    translation technology to map packets between two different addressing realms.
    NAT''s most common use is to map outgoing connections between a privately addressed
    local network and the publicly addressable Internet. In fact, that was what it
    was originally proposed to do, primarily in conjunction with the newly defined
    private class address spaces; both were attempts to alleviate the IPv4 address
    space shortage.


    This chapter introduces the concept of NAT and tells what the types of NAT are
    typically used for.


    # The Conceptual Background of NAT


    NAT was first presented in 1994 in RFC 1631, "The IP Network Address Translator
    (NAT)," which was later replaced by RFC 3022, "Traditional IP Network Address
    Translation (NAT)." NAT was proposed as a possible short-term, solution (to be
    used until IPv6 is deployed) to the growing demand of public IP addresses. NAT
    was also seen as a possible solution to the growing demands on routers that handled
    noncontiguous address blocks. It was thought that NAT might possibly reduce or
    eliminate the need for CIDR, which, in turn, was prompting reallocations and changes
    to router software and network configurations. NAT was also seen as a means to
    avoid the cost and overhead of local network numbering when the address spaces
    were relocated, or when a site changed service providers and was assigned a new
    public address block.


    NAT was seen not only as a short-term solution, but also as a solution that could
    conceivably cause more problems than it solved. With the exception of FTP, most
    problematic application protocols were thought to be legacy protocols that would
    gradually fall into disuse. It was assumed that, in the face of NAT, network application
    developers would naturally become more mindful of end-to-end considerations, would
    be careful not to embed address information in new applications'' data, and avoid
    diverging from the standard client/server model.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# Chapter 8 NAT—Network Address Translation


    Just the opposite turned out to be the case, IPv6 has to be deployed, giving NAT
    permanent, long-term status. Use of NAT became almost universal as Internet access
    became more available to the general public and available IPv4 addresses became
    more scarce. The standard application protocols of the time and the common standard
    protocols still in use today—including DNS, HTTP, SMTP, POP, and NNTP—work fine
    with NAT, and all NAT implementations provide specific support for FTP.


    NAT''s success at transparent translation is a result of the standard client/server
    characteristics of these common protocols. The exceptions didn''t turn out to
    be a few legacy and oddball although, however. Internet applications have become
    increasingly interactive. Newer applications don''t have a clear client/server
    relationship. Sometimes a single server coordinates communication among multiple
    users, who may initiate communication among themselves, independent of the server.
    Multiple servers can operate in conjunction with distributed services across multiple
    NAT domains, or with services that are provided by different kinds of servers
    operating cooperatively. Legacy multimedia and all other streaming and two-way,
    multicast sessions connect in both directions, which have simultaneous connections
    per server, and rely on both TCP and UDP simultaneously. The client isn''t always
    stationary, permanently addressable entity, with dynamic client location in mobile
    devices and telecommuting employees. Some services rely on end-to-end packet and
    data integrity, as the IPsec encryption and authentication protocols.


    These networks do not work with NAT transparent. Specific Application-layer gateway
    (ALG) support for each application must be provided for NAT to be capable of translating
    these packets correctly. In the case of end-to-end Transport-layer protocols using
    encryption and authentication methods don''t work, period.


    Regardless of the difficulties associated with NAT, its usefulness ensures that
    it''s here to stay for the duration of IPv4. In the meantime, firewall folks are
    looking at alternative ways of filtering to solve the problems that newer protocols
    introduce, both in terms of NAT and in terms of packet filtering itself.


    We need alternative methods because firewalling itself has problems implemented
    with current technology. NAT isn''t the only problem. Multimedia and the cost
    and overhead of Application-layer gateways are gradually growing the issue. Some
    of these protocols simply cannot be filtered with current firewall (and NAT) approaches.


    Three general categories of NAT exist, as described in RFC 2663, "IP Network Address
    Translator (NAT) Terminology and Conventions":


    +   - Traditional, outbound, unidirectional NAT is used for networks with private
    space. Outgoing sessions can be initiated from the private LAN to remote Internet
    hosts. Incoming sessions cannot be initiated from remote hosts to local hosts
    in the privately addressed LAN.


    Traditional NAT is divided into two general subtypes, although the two subtypes
    overlap in practice:'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# The Conceptual Background of NAT 199


    +   - Basic NAT performs address translation only. It is usually used to map local
    private addresses to one pool of public addresses. For the duration of all sessions
    initiated by a particular local host, there is a one-to-one mapping between a
    particular public and private address.

    - Network Address and Port Translation (NAPT) performs address translation but
    also replaces the LAN host''s source port with a source port on the NAT device.
    It is used to map local private addresses to a public address (in IP masquerading).
    Because the NAT device has a single IP address to map all outgoing LAN connections,
    the private and public source port is used to associate a connection with a particular
    private host address and a particular connection from that host.

    - Bidirectional NAT performs two-way address translation, allowing both outbound
    and inbound connections. There is a one-to-one mapping between a public address
    and a private address. Effectively, the public address is a public alias for the
    local host''s private address. This allows remote hosts to address the private
    host by the public address associated with it. The NAT translates the public address
    in the incoming packet to the private address that the local host is actually
    assigned.


    One of use is this bidirectional mapping between IPv4 and IPv6 address spaces.
    Although both addresses are routable within their own address spaces, IPv6 addresses
    are not routable within the IPv4 address space. A host in the IPv4 space cannot
    directly reference a host in the IPv6 address space. Likewise, a host in the IPv6
    space cannot directly reference a host in the IPv4 space. It is the IPv6 host''s
    address that is being translated back and forth between the two addressing realms.


    Another use for bidirectional NAT that is more relevant to Linux users is to forward
    connections between the Internet and privately addressed local servers when the
    site offers public services from a LAN but has a public IP address.


    +   - Twice NAT performs two-way source and destination address translation, but
    both the source and destination addresses are translated in both directions. Twice
    NAT is used when the source and destination networks'' addresses collide. This
    could be because one mistakenly used public addresses assigned to someone else.
    Twice NAT can be used as a convenience when a site is renumbered or assigned to
    a new public address block but the owner doesn''t want to manage the new address
    assignments immediately.


    The advantages of NAT include these:


    +   - Packets containing standard application protocol data are transparently
    translated between networks.

    - Standard client/server services “just work” with NAT.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# Chapter 8 NAT—Network Address Translation


    +   - NAT alleviates the problems caused by the growing shortage of IP addresses
    by sharing one public address or a small block of public addresses among an entire
    local network.


    +   - NAT reduces the need for both local and public IP address renumbering.


    +   - NAT reduces the need to deploy and administer more complicated routing schemes
    within larger local networks.


    +   - In NAT''s most common form in conjunction with private IP addresses, unwanted
    incoming traffic isn''t passed along the local machines aren''t addressable.


    +   - In one of NAT''s other forms, it''s used to allow virtual servers, in which
    a server farm appears to be a single, addressable server for load balancing.


    The disadvantages of NAT include these:


    +   - NAT introduces single points of failure within the network by maintaining
    critical state within the network itself.


    +   - Maintaining critical state on the NAT device breaks the Internet paradigm
    in that packets can no longer be automatically rerouted around NAT routers.


    +   - NAT breaks the Internet paradigm of end-to-end transparency by modifying
    packet contents en route.


    +   - As a result of modifying addressing information, application-specific NAT
    support is required for any application that embeds local addresses or ports in
    the application payload.


    +   - As a result of modifying addressing information for applications that embed
    local addresses or ports in the application payload, incoming packets destined
    to a NAT host must be defragmented before forwarding.


    +   - NAT increases resource and performance requirements for NAT devices, which
    would otherwise be dedicated to fast datagram forwarding. NAT represents not only
    the overhead of defragment, packet inspection, and packet modification, but also
    the overhead of state maintenance, state timeouts, and state garbage collection.


    +   - Because of state maintenance within the network and the associated resource
    requirements, NAT devices are not infinitely scalable. Additionally, without sharing
    techniques, hosts cannot use multiple NAT devices, an aspect of the single point
    of failure.


    +   - Bidirectional, multicast protocols require application-specific NAT support
    to forward incoming secondary streams to the proper local host. (Note that these
    protocols generally require ALG support for firewalling as well.)


    +   - NAT can break the capability to run multiple instances of the same local
    network client application in connection with the remote server. This problem
    tends to occur with network games and IRC, where the session has associated incoming
    streams.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# NAT Semantics with iptables and nftables


    +   - NAT cannot be used with transport-mode IPSec for end-to-end security for
    a few reasons:

    - End-to-end Transport-layer security techniques are not possible because the
    techniques rely on end-to-end integrity of the packet header contents for authentication.

    - End-to-end Transport-layer security techniques are not possible because the
    techniques rely on end-to-end integrity of the packet''s data payload, which also
    relies on packet header integrity.

    - End-to-end Transport-layer security techniques are not possible because data
    encryption renderers the packet''s contents unavailable for inspection. NAT modifications
    are not possible to change embedded address and port information.

    - Security trust relationships must be extended into the network from the endpoint
    hosts, possibly to a point outside the local site altogether. IPSec and NAT technologies
    must be extended to the NAT device (in other words, IPsec tunnel mode). Again,
    the NAT device becomes a single point of failure because the NAT device must terminate
    the VPN and establish a new link as a proxy to the destination.


    # NAT Semantics with iptables and nftables


    Both iptables and nftables provide full NAT functionality, including both source
    (SNAT) and destination (DNAT) address mapping. The term full NAT is not a formal
    term; I''m referring to the capability to perform both source and destination,
    to specify one or a range of translation addresses, perform port translation,
    and to perform port remapping.


    A partial implementation of NAPT, known as "masquerading" among Linux users, was
    provided in early Linux releases. It was used to map all local, private addresses
    to the single IP address of the site''s public network interface.


    NAT and forwarding were often spoken of as two components of the same system because
    masquerading was specified as part of the FORWARD rule''s semantics. Blurring
    the concepts was irrelevant functionally. Now it'' very important to keep the
    distinction in mind. Forwarding and NAT are distinct functions and technologies.


    Forwarding routing traffic between networks. Routing traffic between network interfaces
    is as is. Connections can be forwarded in either direction.

    Masquerading sits on in both directions, but not symmetrically. Masquerading is
    unidirectional. Only outgoing connections can be initiated. As traffic from local
    machines passes through the firewall to a remote location, the internal machine''s
    IP address and source port are replaced with the address of the firewall''s external
    network interface and a free source port on the interface. The process is reversed
    for incoming responses. Before the packet is forwarded to the internal machine,
    the firewall''s destination IP address and port'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# Chapter 8 NAT—Network Address Translation


    are replaced with the real IP address and port of the internal machine participating
    in the connection. The firewall machine''s port determines incoming traffic, all
    of which is addressed to the firewall machine, is destined to the firewall itself
    or to a particular local host.


    The semantics of forwarding and NAT are separated in iptables. The function of
    forwarding the packet is done in the filter table using the FORWARD chain. The
    function of applying NAT to the packet is done in the nat table, using one of
    the nat table''s POSTROUTING, PRERUTING, and OUTPUT chains:


    +   - Forwarding is a routing function. The FORWARD chain is part of the filter
    table.

    - NAT is a translation function that is specified in the nat table. NAT takes
    place either or after the routing function. The nat table''s POSTROUTING, PRERUTING,
    and OUTPUT chains are part of the nat table. Source NAT is applied on the POSTROUTING
    chain after a packet has passed through the routing function. Source NAT is also
    applied on the OUTPUT chain for locally generated, outgoing packets. (The filter
    OUTPUT chain and the nat table OUTPUT are two separate, unrelated chains). Destination
    NAT is applied on the PRERUTING chain before passing the packet to the routing
    function.


    # Which Destination Address Is Seen?


    Destination NAT is applied on the nat table''s PRERUTING chain, before the routing
    decision is made. Rules on the PRERUTING chain must match the original destination
    address in the packet''s IP header. Rules on the filter table''s INPUT or FORWARD
    chain must match on the modified, NATed address in the same packet header. Likewise,
    if that same packet were to have source NAT applied after the routing decision
    is made, and if the destination address were important to match, the rule on the
    nat table''s POSTROUTING chain would match the modified destination address.


    Source NAT is applied on the nat table''s POSTROUTING chain, after the routing
    decision is made. Rules on any chain match on the original source address. The
    source address is modified immediately before sending the packet to the next hop
    or destination host. The modified source address isn''t seen on the host applying
    the source NAT.


    None of these distinctions between forwarding and NAT was an apparent issue with
    ipfw and iptchains. The forwarding rule pair wasn''t necessary when masquerading.
    Two-way forwarding and NAT were implied by a single rule. The incoming local interface
    was implied by the source address. The translated source address was taken from
    the outgoing public interface specification. Reverse translation for response
    packets were implied without an explicit rule.'
  merge: -1
  img_proc: true
