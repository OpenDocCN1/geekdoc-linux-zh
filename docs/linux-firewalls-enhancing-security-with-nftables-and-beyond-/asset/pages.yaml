- pgno: 246
  md: '# Chapter 9 Debugging the Firewall Rules


    Just because netstat reports the port as listening or open doesn''t mean that
    it''s accessible through the firewall rules. Following this, a third-party port-scanning
    tool, Nmap, is introduced. These tools should be used from an external location
    to test exactly which ports are listening on the firewall. netstat is a good indicator
    of services that are running on the machine. Remember, if the service isn''t absolutely
    necessary, you should disable it and remove it entirely, especially from a firewall.
    Let firewalls firewalls—you shouldn''t run extra services.


    # netstat -a [ -n -p -A INET ]


    netstat reports various network status information. Quite a few command-line options
    are documented to select what information netstat reports. The following options
    are useful for identifying ports, reporting whether they are in use and by whom,
    and reporting which programs and specific processes are listening on the ports:


    +   - a lists all ports that are in use or are listening to local servers.

    - n displays the hostnames and port identifiers in numeric format. Without the
    -n option, the hostnames and port identifiers are displayed as symbolic names,
    as much fit in 80 columns. Using -n avoids a potentially long wait while remote
    hostnames are looked up. Using -n produces a more readable listing.

    - p lists the name of the program listening on the socket. You must be logged
    in as root to use the -p option.

    - A specifies the address family. The listing includes ports in use as they are
    associated with your network interface cards. Local address family socket connections
    are not reported, including local network-based connections in use by programs
    (such as any XWindow program you have running).


    Types of Sockets—TCP/IP and Linux

    Sockets were introduced in BSD 4.3 UNIX in 1986, and the concepts have largely
    been adopted by Linux. Two main socket types are the Internet domain, AF_INET,
    and the UNIX domain, AF_UNIX, sockets are the TCP/IP socket used across a network.
    AF_UNIX is a socket local to the kernel. The domain socket type is for interprocess
    communication on the same computer; it is more efficient than TCP/IP for local
    sockets. Nothing goes out on the network.


    The following netstat output is limited to the INET domain sockets. The listing
    reports all ports listened to by network services, including the program name
    and the specific process ID of the listening program:


    +   > netstat -a -p -A inet

    1 Active Internet connections (servers and established)

    2 Proto Recv-Q Send-Q Local Address Foreign Address State PID/

    Program name'
