    # Optimized iptables Firewall from Chapter 6


    For most systems on DSL, cable modem, and lower-speed leased line connections,
    the chances are good that the Linux network code can handle packets faster than
    the network connection can. Particularly because firewall rules are order dependent
    and difficult to construct, organizing the rules for readability is a bigger win
    than organizing for speed.


    In addition to rule ordering, iptables supports user-defined rule lists, or chains,
    that can pass a packet from one chain to another using values in the packet header
    provides a means to select the packet against a subset of the INPUT, OUTPUT, or
    FORWARD rules rather than testing the packet against every rule in the list until
    a match is found.


    Based on these particular scripts, an input packet from an NTP time server must
    be tested against numerous input rules in the unoptimized script before the packet
    matches its ACCEPT rule. Using user-defined chains to optimize the firewall, the
    same input packet is tested against far fewer rules matching its ACCEPT rule.
    With the addition of connection state tracking, the input packet is tested only
    a handful of rules before matching its ACCEPT rule.


    With user-defined chains, rules are used to pass packets between chains, as well
    as to define under what conditions the packet is accepted or dropped. If a packet
    doesn''t match any rule in the user-defined chain, control returns to the calling
    chain. If the packet doesn''t match a top-level chain selection, the packet is
    not passed to that chain for testing the chain''s rules. The packet is simply
    tested against the next chain selection rule.


    Following is the Chapter 5 script, optimized with user-defined chains:


    ```

    #!/bin/sh

    /sbin/modprobe ip_conntrack_ftp


    CONNECTION_TRACKING="1"

    ACCEPT_AUTH="0"

    DHCP_CLIENT="0"

    IPT="/sbin/iptables"

    INTERNET="eth0"

    # Location of iptables on your system

    # Internet-connected interface

    ```'
