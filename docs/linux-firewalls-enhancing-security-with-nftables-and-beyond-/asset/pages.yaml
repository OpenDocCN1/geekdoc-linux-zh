- pgno: 128
  md: 'Chapter 5 Building and Installing a Standalone Firewall


    # # Defining the Default Policy


    By default, you want the firewall to drop everything. The two available options
    for the built-in chains in iptables are ACCEPT and DROP. REJECT is not a legal
    policy in iptables for a chain but can be used as a target, as you''ve seen before.
    User-defined chains and nftables chains cannot be assigned policies.


    Using a default policy of DROP, unless a rule is defined to either explicitly
    allow or reject a matching packet, packets are silently dropped. What more likely
    you want to silently drop incoming packets, but to reject outgoing packets and
    return an ICMP error message to the local server. The difference for the end user
    is, for example, if someone at a remote site tries to connect to your web server,
    that person''s browser hangs or her system returns a TCP timeout condition. There
    is no indication whether your site or your web server exists. On the other hand,
    if you attempt to connect to a remote web server, your browser receives an immediate
    error condition indicating that the operation isn''t allowed:


    ```

    # Set the default policy to drop

    $IPT --INPUT DROP

    $IPT --OUTPUT DROP

    $IPT --FORWARD DROP

    ```


    As stated, there are no default policies for a chain in nftables. A default can
    be set at the end of the given chain for nftables.


    It''s important to note at this point, all network traffic other than local loopback
    traffic is blocked. If you''re working on this firewall over the network, your
    connection will no longer be active and may lock yourself out of the computer
    on which the firewall is being built.


    Default Policy Rules and the First Matching Rule Wins


    Within iptables, the default policies allow to be exceptions to the first-matching-rule-wins
    scenario. The default policy commands are not dependent. When they''re rules,
    per se. A chain''s default policy is applied after a packet has been compared
    to each rule or the chain without a match. This is notably different for nftables
    where the first matching rule wins and there is no default policy.


    For iptables the policies are defined in the script to define the packet disposition
    before any rules to the contrary are defined. If the policy commands were executed
    at the end of the script, and if the firewall script contained a syntax error
    causing it to exit prematurely, the default accept-everything could be in effect.
    If a packet didn''t match a rule (the rules are usually accept rules in a deny-everything-by-default
    firewall), the packet would fall off the end of the chain and be accepted by default.
    The firewall rules would not be accomplishing anything useful.


    For nftables a drop rule for incoming traffic can be added to the end of the chain
    and a reject rule can be added to the end of the OUTPUT filter chain. This will
    have the same overall effect as the iptables default policies. But it''s important
    to note that these rules should be added at the end of the firewall script and
    only after rules to allow traffic have been created above. Otherwise all traffic
    will be dropped or rejected from the computer where the firewall is running, including
    possibly your SSH session for configuring your firewall!'
  merge: -1
  img_proc: true
- pgno: 129
  md: "Initializing the Firewall\n\n# Using Connection State to Bypass Rule Checking\n\
    \nSpecifying the state match for precisely initiated and accepted exchanges enables\
    \ you to bypass the firewall tests for the ongoing exchange. The initial client\
    \ request remains controlled by the service's specific filters, however.\n\nNotice\
    \ that both the INPUT and the OUTPUT filters are necessary to bypass the rules\
    \ in both directions. A connection isn't stated two-way exchange by the state\
    \ module, and a symmetric dynamic rule is not generated.\n\nThe state module can\
    \ require more RAM than Linux firewall machines have, the iptables examples developed\
    \ in this chapter typically provide the rules for both alternatives, and without\
    \ the state module. The nftables rules assume the use of the connection state\
    \ module using nftables typically run from newer computers.\n\n# Both Static and\
    \ Dynamic iptables rules\n\nResource limits in terms of scalability and state\
    \ timeouts require that both the static and dynamic rules be. The top limit is\
    \ a selling point with large commercial failings.\n\nThe scalability issue comes\
    \ up in large firewalls designed to handle 50,000–100,000 simultaneous connections—that's\
    \ a lot of. System resources run out at some point, and connection tracking can't\
    \ done. Either the new connection has to be dropped or the software has to fall\
    \ back to stateless mode.\n\nThere's also the issue of timeouts. Connection state\
    \ isn't kept forever. Slow and quiescent connections can have their state information\
    \ cleaned out to make room for other, more active connections. When a packet comes\
    \ along, the state information has to be rebuilt. In the meantime, the packet\
    \ flow has to fall back to stateless mode while the transport looks up the connection\
    \ information and informs the state module that the packet is indeed part of an\
    \ established exchange:\n\n```\n$IPT -A INPUT -m state --state ESTABLISHED,RELATED\
    \ -j ACCEPT\n$IPT -A OUTPUT -m state --state ESTABLISHED,RELATED -j ACCEPT\n#\
    \ Using the state module, INVALID will break protocols that use\n# bi-directional\
    \ connections or multiple connections or exchanges\n# unless an ALG is provided\
    \ for the protocol\\$IPT -A INPUT -m state --state INVALID -j LOG \\\n  --log-prefix\
    \ \"INVALID input: \"\n$IPT -A INPUT -m state --state INVALID -j DROP\n$IPT -A\
    \ OUTPUT -m state --state INVALID -j LOG \\\n  --log-prefix \"INVALID output:\
    \ \"\n$IPT -A OUTPUT -m state --state INVALID -j DROP\n```\n\nFor nftables, the\
    \ following rules are added to the firewall script:\n\n```\n$NFT add rule filter\
    \ input state established,related accept\n$NFT add rule filter input state invalid\
    \ log prefix \\INVALID input: \\\" limit\nrate rate 3/second drop\n$NFT add rule\
    \ filter output state established,related accept\n$NFT add rule filter output\
    \ state invalid log prefix \\\"INVALID output: \\\"\nlimit limit rate 3/second\
    \ drop\n```"
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Source Address Spoofing and Other Bad Addresses


    This section establishes some INPUT chain filters based on source and destination
    addresses. These addresses will never be seen in a legitimate incoming packet
    from the Internet.


    At the packet-filtering level, one of the few cases of source address spoofing
    that you can identify with certainty is a forgery of your own IP address. This
    rule drops incoming packets claiming to be you:


    ```

    # Refuse packets pretending to be from

    # the external interface''s IP address

    $IPT -A INPUT -i $INTERNET -s $IPADDER -j DROP

    ```


    The rule is similar for nftables because it takes advantage of the variables defined
    within the shell script rather than native nftables rules:

    $NFT add rule filter input $INTERNET ip saddr $IPADDER


    There is no need to block packets destined to yourself. They won''t, claiming
    to be you and appearing to be spoofed. Remember, if you send packets to your own
    external interface, these packets arrive on the loopback interface''s input queue,
    not on the external interface''s input queue. Packets containing your as source
    address never arrive on the external interface, even if you send packets to the
    external interface.


    | Firewall Logging

    The -j LOG target enables logging for packets matching the rule. When a packet
    matches the rule, the event is logged in /var/log/messages, or wherever you defined
    messages of the specified priority to be logged.


    As explained in Chapter 1 and Chapter 2, private IP addresses are set aside in
    each of the Class A, B, and C range for use in private LANs. They are not intended
    for use on the Internet. Routers are not supposed to route packets with private
    source addresses. Nevertheless, some routers do forward packets containing source
    addresses in error.


    Additionally, if someone on your ISP''s subnet (that is, on your side of the router
    you share) is leaking packets with private IP addresses, you will see them if
    the router doesn''t forward them. Machines on your own LAN could also leak private
    addresses if your NAT or proxy configuration is set up incorrectly.


    The next sets of rules disallow incoming packets containing source addresses from
    any of the Class A, B, or C private network addresses. None of these packets will
    be seen on a public network:


    ```

    # Refuse packets claiming to be from a Class A private network

    $IPT -A INPUT -i $INTERNET -s $CLASS_A -j DROP

    ```'
  merge: -1
  img_proc: true
