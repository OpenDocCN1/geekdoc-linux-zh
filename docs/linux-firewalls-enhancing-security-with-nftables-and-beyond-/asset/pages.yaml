- pgno: 127
  md: "```\nchain output {\n  type filter hook output priority 0;\n}\n```\n\nThis\
    \ file is then loaded with the following command. This command should be added\
    \ to the firewall script after the conditional to stop the firewall:\nNFT -f setup-tables\n\
    \n# Enabling the Loopback Interface\n\nYou need to enable unrestricted loopback\
    \ traffic. This enables you to run any local network-based services that you choose—or\
    \ that the system depends on—without having to worry about getting all the firewall\
    \ rules specified.\n\nLocal services run on the loopback network interface. After\
    \ the system boots, the system's default policy accepts all packets. Preexisting\
    \ connections have no effect. However, if the firewall is reinitialized and had\
    \ previously used a deny-by-default policy, the drop policy would still be in\
    \ effect. Without any acceptance firewall rules, the loopback interface would\
    \ be inaccessible.\n\nBecause the loopback interface is a local, internal interface,\
    \ the firewall can allow back traffic immediately. Here are the commands for the\
    \ iptables script:\n\n```\n# Unlimited traffic on the loopback interface\n$IPT\
    \ -A INPUT -i lo -j ACCEPT\n$IPT -A OUTPUT -o lo -j ACCEPT\n```\n\nFor nftables,\
    \ the commands look like this after that. The commands can be added to the main\
    \ rc.firewall script that you're creating or can be added to a localhost-policy\
    \ rules file. Adding the rules to a separate localhost-policy file looks like\
    \ the following. The file assumes that the rules contained in the setup-tables\
    \ file (shown earlier) have already been added to the firewall. The setup-tables\
    \ rules file hasn't been added, no processing will be done.\n\nThe localhost-policy\
    \ file contains the following:\n\n```\ntable filter {\n  chain input {\n    ifname\
    \ lo accept\n  }\n  chain output {\n    ifname lo accept\n  }\n```\n\nThis file\
    \ is then loaded by adding the following command to rc.firewall:\nNFT -f localhost-policy\n\
    \nAlternatively, if you're adding it to the rc.firewall script, the following\
    \ two lines will do the job:\n\n```\n$NFT add rule filter input ifname accept\n\
    $NFT add rule filter output ifname accept\n```"
