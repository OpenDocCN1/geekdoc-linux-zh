  md: "# Using TCPDump to Capture Specific Protocols\n\n# Building a Filter to Capture\
    \ an HTTP Conversation\n\nHTTP is the language of the Web. Usually HTTP rides\
    \ over TCP, which in turn rides on IP. I'm choosing HTTP as the first real-world\
    \ capture only because people are generally familiar with browsing a web page,\
    \ even though they may not be familiar with the under-protocol.\n\nRecall that\
    \ IP is a connectionless protocol whereas TCP is a connection-oriented protocol.\
    \ TCP uses a three-way handshake to begin a conversation. HTTP takes advantage\
    \ of the connection-oriented nature of TCP and in fact knows nothing of lower-layered\
    \ (remember the OSI model) protocols. As far as HTTP is concerned, it its data\
    \ down to the next layer and inside. To that end, when an HTTP conversation is\
    \ initiated, the first thing you should see through TCPDump is the three-way handshake\
    \ of TCP followed by protocol-specific data.\n\nFor the most part, HTTP traffic\
    \ flows to a destination of 80.\n\n> Note\nThe ports on which services normally\
    \ operate can be found by the file /etc/services. With that in mind, the true\
    \ source for port assignments is IANA. You can view the current and complete list\
    \ of official port number assignments at the URL http://www.iana.org/assignments/port-numbers.\
    \ However, there's nothing preventing someone from running a service on a port\
    \ other than the official port number!\n\nHTTP is usually found on port 80, it\
    \ would be a good idea to start with a basic TCPDump expression that looks for\
    \ port 80 traffic, such as this one:\n\n```\ntcpdump 'port 80'\n```\n\nRunning\
    \ that command and then generating some traffic by surfing to a web page yields\
    \ these results:\n\n```\ntcpdump: verbose output suppressed, use -v or -vv for\
