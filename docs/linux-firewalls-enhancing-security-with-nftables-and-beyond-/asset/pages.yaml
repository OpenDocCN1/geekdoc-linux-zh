  md: '# 2


    # Packet-Filtering Concepts


    What is a firewall? Over the years, the term has changed in meaning. According
    to RFC 2647, "Benchmarking Terminology for Firewall Performance," a firewall is
    "a device or group of devices that enforces an access control policy between networks."This
    definition is very broad, purposefully so in fact. A firewall can encompass many
    layers of the OSI model and may refer to a device that does packet filtering,
    performs packet inspection and filtering, implements a policy on an application
    at a higher layer, or any of these and more.


    A nonstate, or stateless, firewall usually performs some packet filtering based
    on the IP layer (Layer 3) of the OSI model, sometimes higher-layer protocols are
    involved in this type of firewall. An example of this device might include a border
    router that sits at the edge of a network and implements one or more access lists
    to prevent any types of malicious traffic from entering the network. Some argue
    that this type of device is not a firewall at all. However, it appears to fit
    within the RFC definition.


    A border access list may implement many different policies depending on which
    interface the packet was received on. It''s typical to filter packets at the edge
    of the network connecting to the Internet. These packets are discussed later in
    this chapter.


    As opposed to a stateless firewall, a stateful firewall is one that tracks the
    packets previously seen within a given session and applies the access policy to
    packets based on what has already been seen for the given connection. A stateful
    firewall implies the basic packet-filtering capabilities of a stateless firewall
    as well. A stateful firewall will, track the stages of the TCP three-way handshake
    and reject packets that appear out of sequence for handshake. Being connectionless,
    UDP is somewhat tricky to handle a stateless firewall because there is no state
    to speak of. However, a stateful firewall tracks recent exchanges to ensure that
    a packet has been received relates to a recent outgoing packet.


    An Application-layer gateway (ALG), sometimes referred to as an Application-layer
    gateway, is yet another form of firewall. Unlike the stateless firewall, which
    has knowledge of the Network and possibly Transport layers, an ALG primarily handles
    Layer 7, the Application layer of the OSI model. ALGs typically have deep knowledge
    of the application data'
  merge: -1
  img_proc: true
