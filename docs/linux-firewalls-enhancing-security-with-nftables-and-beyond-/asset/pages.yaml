  md: "# Don't Go Overboard Using NAT Semantics with iptables and nftables 203\n\n\
    The rest of this chapter presents the nat table syntax. Another word of caution\
    \ is called for\nwhen looking at the complete NAT syntax. The following sections\
    \ describe the simpler, more\ngeneral syntax using NAT, which is what will be\
    \ used most commonly. The average size\nwon't have a use for the specialized features\
    \ available in the nat table.\n\nBoth SNAT and DNAT rules can specify the protocol,\
    \ source and destination addresses,\nsource and destination ports, state flags,\
    \ in addition to the translated address and\nports. When this the nat table rules\
    \ very much like filter table rules. It's\nvery easy to confuse NAT rules with\
    \ firewall rules, especially for people who are used to\nipchains syntax. Actual\
    \ filtering is done in the FORWARD chain.\n\nYou could mirror the fields between\
    \ the FORWARD rules and the NAT rules; the two\nsets of rules could look nearly\
    \ identical. For large rule sets, it would quickly become an\\error-prone, administrative\
    \ nightmare and would accomplish very little.\n\nRemember that iptables forwarding\
    \ and NAT are two completely separate functions. The\nactual filtering is done\
    \ by the rules in the filter table. For most people, it's best\nto keep the nat\
    \ table rules simple.\n\n# Source NAT\n\nTwo forms of source NAT exist in the\
    \ iptables nat table, specified as two distinct\ntrules, SNAT and MASQUERADE.\
    \ SNAT is standard source address translation.\nMASQUERADE is a specialized form\
    \ of source NAT for use in environments in which\nan arbitrary, dynamically assigned\
    \ IP address is assigned on a temporary, connection-by-\nconnection basis. As\
    \ of this writing, nat table supports POSTROUTING chain. Source address\nmodifications\
    \ are applied after the routing decision has been made to choose the proper\n\
    output interface. Thus, NAT rules are associated with an output interface, not\
    \ with\nin incoming interface.\n\nBoth targets are applied on the iptables nat\
    \ table's POSTROUTING chain. Source address\n\nBecause nftables doesn't include\
    \ any default tables, the nat table must be configured\nbefore any of the examples\
    \ in this chapter will work. To do so, you can add a nat table to\nt setup-tables\
