- pgno: 351
  md: "# nftables Firewall for a Standalone System from Chapter 5\n\n```\nSUBNET_BROADCAST=my.subnet.bcast\n\
    LOOPBACK=\"127.0.0.0/8\"\nNAMESERVER=isp.name.server\nSMTP_GATEWAY=isp.smtp.server\n\
    POP_SERVER=isp.pop.server\nIMAP_SERVER=isp.imap.server\nTIME_SERVER=time.nist.gov\n\
    CLASS_A=10.0.0.0/8\nCLASS_B=172.16.0/12\nCLASS_C=192.168.0/16\nCLASS_D_MULTICAST=224.0.0.0/4\n\
    CLASS_E_RESERVED=240.0.0.0/4\nBROADCAST=255.255.255.255\nBROADCAST_DEST=255.255.255.255\n\
    PRIVPORTS=\"0-1023\"\nUNPRIVIPPORTS=\"1024-65535\"\n# Your subnet broadcast address\n\
    # Reserved lookup address range\n# Address of a remote name server\n# Address\
    \ of a remote mail gateway\n# Address of a remote pop server\n# Address of a remote\
    \ imap server\n# Address of a remote nft server\n# Class A private networks\n\
    # Class B private networks\n# Class C private networks\n# Class D multicast addresses\n\
    # Class E reserved addresses\n# Broadcast source address\n# Broadcast destination\
    \ address\n# Well-known, privileged port range\n# Unprivileged port range\n```\n\
    \n```\nfor i in \\$NFT list tables | awk '{print \\$2}'\ndo\n  echo \"Flushing\
    \ \\$i\"\n  \\$NFT flush table \\$i\n  for j in \\$NFT list table \\$i | grep\
    \ chain | awk '{print \\$2}'\n  do\n    echo \"...Deleting chain \\$j from table\
    \ \\$i\"\n    \\$NFT delete chain \\$i \\$j\"\n  done\n  echo \"Deleting \\$i\"\
    \n  \\$NFT delete table \\$i\n```\n\n```\nif [ \"\\$1\" = \"stop\" ]\nthen\n \
    \ echo \"Firewall completely stopped! WARNING: THIS HOST HAS NO FIREWALL RUNNING.\"\
    \n  exit 0\nfi\n```\n\n```\n$NFT -f set-tables\n\n#loopback\n$NFT add rule filter\
    \ input ifname lo accept\n$NFT add rule filter input output lo accept\n```\n\n\
    ```\n#connection state\n$NFT add rule filter input ct state established,related\
    \ accept\n$NFT add rule filter input ct state invalid log prefix \"\\INVALID input:\
    \ \\\" limit rate 3/second drop\n$NFT add rule filter output ct state established,related\
    \ accept\n$NFT add rule filter output ct state invalid log prefix \"\\INVALID\
    \ output: \\\" limit-rate 3/second drop\n```\n\n```\n#source address spoofing\n\
