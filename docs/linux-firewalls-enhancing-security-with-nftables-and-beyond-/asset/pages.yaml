  md: '# Initializing the Firewall 111


    # Refuse Class D multicast addresses

    # Illegal as a source address

    $IPT -A INPUT -i $INTERNET -s $CLASS_D_MULTICAST -j DROP


    Here''s the nftables rules for:


    ```

    $NFT add rule filter input $IPT $INTERNET ip daddr $CLASS_D_MULTICAST drop

    ```


    Legitimate multicast packets are unlike UDP packets. sent-to-point, just any other
    UDP message. The difference between unicast and multicast packets is the class
    of destination address (and the protocol flag carried in the Ethernet header).
    The next rule denies multicast packets carrying a non-UDP protocol:


    ```

    $IPT -A INPUT -i $INTERNET -p udp -d $CLASS_D_MULTICAST -j DROP

    ```


    The nftables version of this command looks like this:


    ```

    $NFT add rule filter input $IPT $INTERNET ip daddr $CLASS_D_MULTICAST \= udp drop

    ```


    Multicast functionality is a configurable option when you compile the kernel,
    and your network interface can be initialized to recognize multicast addresses.
    The functional- is enabled by default the default kernel from many distributions
    of Linux. You might want to enable these addresses if you subscribe to a network
    conferencing service that provides multicast audio and video broadcasts. (Multicast
    is also sometimes used on the local network for global resource discovery, such
    as DHCP or routing.)


    You won''t see multicast destination addresses unless you''ve registered yourself
    as a recipient. Multicast packets are sent to multiple, but specific, targets
    by prior arrange- I have seen multicast packets sent out of machines from my ISP''s
    local subnet, however. The default policy denies multicast packets, even if you
    have registered a recipient. You need to define a rule to accept the multicast
    address. The next rule allows incoming multicast packets for the sake of completeness:


    ```

    $IPT -A INPUT -i $INTERNET -p udp -d $CLASS_D_MULTICAST -j ACCEPT

    ```


    And here''s the nftables rules:


