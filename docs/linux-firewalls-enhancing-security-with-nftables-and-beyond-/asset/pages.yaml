    # Log Monitoring


    Log files are monitored to watch for anomalies that might indicate an attack.
    Although this method is used successfully, it can result in huge amounts of data
    and become cumbersome on large networks.


    When combined with other tools, log monitoring can be made to work. For example,
    using log monitoring on a few key systems can reduce the amount of data being
    received. However, this such measures rarely because they do little to ensure
    the security of the systems that are not monitored.


    Numerous packages are available to monitor log files. One package is Swatch. I''ll
    briefly cover Swatch here just to give you a taste of some of the capabilities
    of these types of tools.


    # Swatch


    Swatch is available with many Linux distributions as an add-on package or can
    be downloaded from http://sourceforge.net/. Swatch is highly configurable and
    can perform a number of actions based on a match.


    Swatch works in several modes, including a mode called single-pass, which has
    the program parse log file, searching for matches and taking action based on those
    matches. Another mode sees Swatch perform a running tail (tail -f) of a log file
    looking for matches. By default, Swatch monitors /var/log/messages, but it can
    be configured to monitor any log file or even a socket.


    # Using Swatch to Monitor SSH Login Failures


    There are constant brute-force login attempts against SSH. These usually do not
    result in anything except annoyance. However, it is generally useful to monitor
    log files for these and other attempts to brute-force a server. Swatch can be
    configured to send an email (or do any number of other actions) when an attempt
    is logged. This section shows how to send an email alert when an authentication
    failure is logged.


    The system logs a line similar to the following when a login is attempted and
    fails:


    ```

    Jun 17:09:10 sshd[3434]: error: \ \

    \tPAM: Authentication failure for root from 192.168.1.10

    ```'
