- pgno: 303
  md: '# Using TCPDump to Capture Specific Protocols


    +   - Wrong number


    +   - Malfunctioning equipment


    With these categories in mind, this section examines some abnormal packet traces
    or traces that you shouldn''t see under normal conditions. By no means does this
    section include all the possibly crafted and abnormal packets. The hope is to
    give you an understanding of some types of logs to listen for when performing
    an investigation.


    # Normal Scan (Nmap)


    Sometimes an attacker will scan your subnet or individual IP address for open
    ports. This scan can be anything from an innocent attempt to look for a service
    for reconnaissance for an attack. Many times, these scans are completely automated,
    with an attacker setting up one or more robots (bots) to automatically scan for
    vulnerable versions of software to exploit.


    This simulation was created with the Nmap program with the following command line:


    ```

    nmap -sT 192.168.1.2

    ```


    The TCPDump capture of the port scan is shown in the following note; note I''ve
    truncated the output because Nmap scanned for more than 1650 ports. I''ve divided
    the capture to make it easier as well.


    Nmap scans begin with an ICMP echo request to the target host, as shown here.
    however, that this ICMP echo can be disabled by the person running the Nmap scan,
    so it might not show up:


    ```

    12:31:21.834284 IP 192.168.1.10 > 192.168.1.2: icmp 8: echo request seq 27074

    12:31:21.834508 IP 192.168.1.2 > 192.168.1.10: icmp 8: echo reply 27074

    ```


    Next, Nmap looks for port 80, the default HTTP port. Notice the scan from an ephemeral
    port on the scanner''s side aimed for port 80 on the recipient. In this, the recipient
    host 192.168.1.2 is listening on port 80, and a TCP response is sent back to the
    scanning host with TCP RST flag set and the sequence number:


