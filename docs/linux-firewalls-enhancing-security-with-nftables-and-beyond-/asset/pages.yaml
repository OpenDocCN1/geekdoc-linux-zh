    See the man page for update-rc.d for more information on its usage beyond here.

    Other aspects of the firewall script depend on whether you have a registered,
    static IP address or a dynamic, DHCP-assigned IP address. The firewall script
    as presented in this chapter is set for a site with a statically assigned, permanent
    IP address.


    # Installing a Firewall with a Dynamic IP Address


    If you have a dynamically assigned IP address, the standard firewall installation
    method will not work without modification. The firewall rules would be installed
    before the network interfaces are brought up, the system is assigned an IP address,
    and possibly before being assigned a default gateway router or namesvers.

    The firewall script identifies the IPADDR and NAMESERVER values defined. The default
    /etc/resolv.conf file can define up to three namevers. Also, any given site may
    or not know the addresses of their name servers, default gateway router, or DHCP
    server ahead of time. Furthermore, it is uncommon for your network mask, subnet,
    and broadcast addresses to change over time as the ISP numbers its network. Some
    ISPs assign a different IP address on a frequent basis, with the result that your
    IP address can change numerous times during the course of an ongoing connection.\Your
    site must provide some means of dynamically updating the installed firewall rules
    as these changes occur. Appendix B,"Firewall Examples and Support Scripts," provides
    sample scripts to handle these changes automatically.

    The firewall script could read these variables directly from the environment or
    could read them from a file. In any case, the variables would not be hard-coded
    into the firewall script, as they are in the example in this chapter.


