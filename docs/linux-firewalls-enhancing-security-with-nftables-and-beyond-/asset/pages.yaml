- pgno: 317
  md: '# 14


    # Filesystem Integrity


    Integrity is one of three commonly used principles of computer security; confidentiality
    and availability are the other two. In the purest sense of the three principles,
    integrity simply refers to the means by which you ensure that data is authentic
    and has not been altered or tampered with in any way. One aspect of ensuring data
    integrity is ensuring the integrity of the system on which the data is housed.


    This chapter looks at some very specific means you have at your disposal when
    running Linux to ensure data integrity. These include examining the files on a
    Linux system to make sure they haven''t been altered without your knowledge and
    looking for anomalies that may indicate the presence of an intruder on the system.


    # Filesystem Integrity Defined


    Maintaining system integrity is yet another layer of security meant to give you,
    the security administrator, a warm, fuzzy feeling. For the purposes of this chapter,
    the term filesystem integrity refers to the verifiable knowledge that the computer
    system and the objects contained therein are in a known-good state. Although there''s
    a wide definition, filesystem integrity in this chapter will simply entail verification
    that the files located on the computer have not been tampered with or altered.
    As such, this chapter concentrates on tools to assist you in checking the files.


    # Practical Filesystem Integrity


    Various tools are available to check the integrity of files on the system. In
    this chapter, I''ll show AIDE, the Advanced Intrusion Detection Environment. AIDE
    is an open-source filesystem integrity-checking tool.


    A basic check of a file usually involves obtaining checksum values of the files
    on the computer and comparing those checksums against known-good values. More
    complex checking is done by tools such as AIDE, as you''ll see later in the chapter.


    Checksums are frequently used to verify the integrity of a downloaded file. For
    example, many Linux FTP repositories contain a file called shasums. Inside of
    that shasums file are the checksums of the files as they reside on the FTP server.
    When you download'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# Chapter 14 Filesystem Integrity


    the file, you can then verify the checksum against the downloaded file. If your
    checksum value matches the checksum on the server, you know you have a good file.
    If the values don''t match, something went wrong with the download and you can
    save some time rather than trying to work with a corrupt file or wasting a CD-R.


    A hands-on example would be helpful. Jump into a console and type the following:


    ```

    shalum /etc/passwd

    ```


    You''ll see a value such as:


    ```

    dbf758aecfc31b789336d019f650d04fc280d64 /etc/passwd

    ```


    Note that the value you see will be different from mine, unless you''re running
    the command against my password file, in which case I have other problems that
    need attention.


    If you add a user, delete one, or make any change that affects the password file,
    that shalum value will change. For example, if you make a change to someone named
    the passwd file, the shalum of passwd file will change because the file''s contents
    are now different. Continuing with the preceding example, you can change the name
    of the root user by running this (as root):


    ```

    chfn root

    ```


    You''ll be presented with various options for changing the account information
    for the user, beginning with the Full Name. Change the Full Name value to whatever
    you''d like, and continue with changes to others if you''d like. Now running a
    shalum against /etc/passwd will show a different checksum for the file:


    ```

    shalum /etc/passwd

    22e91a7bb7a21ca6c2b9d4f32e03fed3eeec7 /etc/passwd

    ```


    # Installing AIDE


    AIDE is a filesystem integrity-checking tool offering many of the features you''d
    expect from a program. More information on AIDE, including links to download,
    is available at http://aide.sourceforge.net.


    With other tools featured in the book, AIDE is available as a package for most
    Linux distributions, or can be downloaded and compiled. However, you will probably
    need some prerequisites before attempting to compile AIDE. If this is the case,
    the configure script for AIDE will inform you of these እንደሚ, which you will then
    need to download and compile (or install system packages) before continuing with
    AIDE''s compilation. Compiling AIDE follows the same pattern as other software,
    in Linux:


    ```

    tar -xzv aide-<NNNN>.tar.gz

    cd aide-<NNNN>

    ./configure

    make

    make install

    ```'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'The remainder of this chapter shows usage of compiled AIDE rather than a prepack-aged
    version; specific paths and commands may be slightly different if you run a packaged
    version. The underlying concepts remain the same.


    # # Configuring AIDE


    AIDE, like other Linux applications, operates using a configuration file. The
    configuration file is text based and contains information that the program uses
    to determine the characteristics it will use when it runs. The first time you
    run AIDE you will create and initialize the database that will be used for future
    checks of the filesystem''s integrity. That database will be manually checked
    over for sanity, and you''ll run an update process that will be used from then
    on to look for changes that occur on the filesystem.


    # # Creating an AIDE Configuration File


    After AIDE has been installed, the first thing you want to do is create a configuration
    file. The AIDE configuration file is normally called aide.conf and is located
    in /etc/ or /etc/aide/ for a packaged version of AIDE. Comments within the AIDE
    configuration begin with a pound sign (#). There are three categories of lines
    within the AIDE configuration: configuration lines, macro lines, and selection
    lines. In Debian, the AIDE configuration is located in /etc/aide and is split
    among several directories, including a generic.conf file you can save as as a
    directory containing specific rules and another directory containing settings.


    The heart of the AIDE configuration file is the selection lines that you want
    to determine what objects on the filesystem will be monitored. Configuration lines
    are also important in determining how AIDE will operate, and macro lines are important
    for creating advanced configurations. AIDE uses a series of parameter=value directives
    to identify the type of check to perform on a given object. Table 14.1 lists some
    of those directives.


    AIDE also enables the administrator to create custom groups containing the default
    groups. Groups can save time and improve the readability of the configuration
    file. You might use a custom group to combine other groups of commonly used checks.
    For example, creating a group called MyGroup with commonly used types of checks
    is as simple as:


    ```

    MyGroup p=i+n=md5

    ```


    These groupings, whether default or custom, are used to determine the type of
    check to be performed on a selection line. You also configure the files and directories
    in the configuration file. Selection lines consist of the object to be checked
    together with the type of check to be performed. The object can be a file, a directory,
    a regular expression, or more commonly a combination of a file with some regular
    expression syntax. I will take a glance at regular expressions in a later section,
    but for now I will show simple examples of the selection process.'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# Table 14.1 AIDE Configuration Directives


    | Directive | Description |

    | --- | --- |

    | p | Permissions |

    | i | inode |

    | n | Number of links |

    | u | User |

    | g | Group |

    | s | Size |

    | b | Block count |

    | m | mtime |

    | a | atime |

    | c | ctime |

    | ftype | File type |

    | S | Check for growing size |

    | shal | shal checksum |

    | sha256 | sha256 checksum |

    | sha512 | sha512 checksum |

    | rmd160 | rmd160 checksum |

    | tiger | tiger checksum |

    | R | p+i+n+u+g+s+m+c+md5 |

    | L | p+i+n+u+g |

    | E | Empty group |

    | > | Growing logfile p+u+g+i+n+S |

    | haval | haval checksum |

    | gost | gost checksum |

    | crc32 | crc32 checksum |


    The following selection line would examine everything in the /etc directory, specifically
    looking at the number of links, the user who owns a given file, the group who
    owns a given file, and the size of the file:

    /etc n+u+s


    A change to one of those attributes that occurs unexpectedly might indicate tampering.
    The next example uses a custom group called MyGroup as the check for the files
    within the /bin directory:


    /bin MyGroup


    Objects can be ignored or skipped by using an exclamation point (!), as in the
    following example, which causes AIDE to ignore everything in /var/log:

    !/var/log/*'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'Ignoring objects that change frequently drastically reduce the number of irrelevant
    lines that appear in the AIDE report. However, you should be careful not to ignore
    too much; otherwise, you might miss important filesystem changes.


    Rule lines in the configuration file use regular expressions to enable powerful
    matching capabilities. Don''t worry if you''re not familiar with the black magic
    involved in regular expressions; I''ll go easy on you.


    A primary concern with matching files in AIDE is that you do not leave room for
    an attacker to circumvent the file integrity check. This could occur if you specified
    a filename without fully qualifying the file. For example, if you wanted to skip
    checking a file in the /var/log/ directory because it changes, you might use this
    (simply correct) syntax:


    ```

    !/var/log/mailog

    ```


    However, due to the regular expression matching that occurs, an attacker could
    create a file titled:


    ```

    /var/log/mailog.crack

    ```


    Because you''ve excluded /var/log/mailog already, AIDE will not check anything
    that begins with /var/log/mailog. To solve this problem you add a dollar sign
    ($) to the end of the file. In regular expression syntax, a $ indicates the end-of-line.
    Therefore, by changing the syntax for the file you want to exclude and adding
    a $, you use the most specific match for that filesystem check:


    ```

    !/var/log/mailog$

    ```


    By default, AIDE will create a file-based database called aide.db.new. This file
    is moved (manually) for future checks. Therefore, there''s not really a need to
    alter this behavior within the context of the configuration file; however, you
    certainly can change the path and name of this file using the configuration options:


    ```

    database=file:<filename>

    database_outfile:<filename>

    ```


    AIDE can also use an SQL database server as PostgreSQL to store database contents,
    although configuration is beyond the scope of this book.


    # A Sample AIDE Configuration File


    At the very least you need to tell AIDE what parts of the filesystem to check
    and what rules to use for those checks. You can also add numerous bits to the
    configuration to alter how AIDE performs. For the purposes of this section, I
    will show a very basic configuration file with the caveat that you should add
    to it as you see necessary for Linux installation.'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'If you''ve compiled AIDE, open the file /usr/local/etc/aide.conf. If the file
    doesn''t exist, create it. Place the following lines within the file:


    +   - /bin R

    - /sbin R

    - /etc R+a

    - /lib R

    - /usr/lib R


    If you''re using a packaged version from a distribution such as Debian, the configuration
    file and several wrapper scripts are already provided, so you can safely skip
    this step.


    # Initializing the AIDE Database


    With a quick and basic configuration file in hand, it''s time to initialize the
    AIDE-database. This process can take a varying length of time depending on how
    many files you''re checking and the amount of resources the computer has. Initializing
    the AIDE database is as simple as running the following for the compiled version:


    ```

    /usr/local/bin/aide --init

    ```


    Alternatively, on Debian with a packaged version, you should run aideinit


    AIDE will now initialize the database on the criteria you chose in the configuration.
    When it''s complete, you''ll see a message similar to:


    ```

    AIDE, version 0.15.1

    ```


    ```

    ### AIDE database initialized.

    ```


    The next step is to rename (move) the newly created database to aide.db so that
    it becomes the default or master database:


    ```

    mv /usr/local/etc/aide.db.new /usr/local/etc/aide.db

    ```


    Now you should be able to run a check of the database to verify that everything
    is working:


    ```

    /usr/local/bin/aide --check

    ```


    If everything goes well, you''ll see output similar to the following:


    ```

    AIDE, version 0.15.1

    ```


    ```

    ### All files match AIDE database. Looks okay!

    ```


    With the AIDE database initialized, you should immediately copy the database to
    a disk, preferably a read-only media such as a CD-R, or you should securely copy
    it to another computer. If you leave the AIDE database on the computer, attackers
    may be able to simply alter the AIDE database to cover their tracks after replacing
    system files with their own! Each time you update the AIDE database from this
    point forward, always copy the resulting database file to secure media.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# Scheduling AIDE to Run Automatically


    AIDE is best run using a cron job (scheduled task). Therefore, you should schedule
    AIDE to run automatically without your intervention. AIDE is commonly run once
    per day, but you should schedule it to run according to your security policy.
    The easiest and quickest method to have AIDE run daily is to create a crontab
    entry.


    Creating a crontab entry is a matter of running this (as root):


    ```

    crontab -e

    0 2 * * * /usr/local/bin/aide --check

    ```


    To run AIDE nightly at 2:00 a.m., enter the following line into crontab:


    For more information on the format of crontab entries, see your distribution’s
    documentation.


    # Monitoring AIDE for Bad Things


    Okay, so you have this shiny new integrity-checking tool set up and running. But
    now what? You sit and wait for something to happen. Usually nothing does, and
    when it appears that something bad has happened, many times it hasn’t.


    AIDE will continue to monitor the filesystem according to the rules you configured.
    Thanks to the cron job, you will receive reports containing the files and the
    attributes for files that have changed since database was initialized or updated.
    Many times these changes will be completely benign. Recall the example from the
    beginning of the chapter. If you add a user, files such as /etc/passwd and /etc/shadow
    will change. AIDE will notify and report accordingly, assuming you’re checking
    /etc/passwd or /etc/shadow. However, if you didn’t add a user or make other changes
    to /etc/passwd or /etc/shadow, you might examine more closely to make sure that
    an attacker hasn’t altered one of those important files.


    Of course, there are other files AIDE will be reporting on. You should monitor
    the AIDE report for files that were altered unexpectedly. For example, the files
    /bin/su or /usr/bin/passwd should rarely be altered and only by known software
    updates. Therefore, if a file as /bin/su shows up in an AIDE report, you need
    to look into it immediately to see when and why it changed. Taking this example
    step further, for a moment that AIDE ran overnight through your normal process.
    In the morning you will find an email containing some of the following lines:


    AIDE 0.15.1 found differences between database and filesystem!!nStart timestamp:
    2014-07-31 23:50:17


    Summary:


    +   - Total number of files: 16112

    - Added files: 0

    - Removed files: 0

    - Changed files: 1'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# Chapter 14 Filesystem Integrity


    Changed files:


    changed: /etc/adjtime


    Detailed information about changes:


    File: /etc/adjtime Atime : 2014-07-11 05:43:38 , 2014-07-31 23:36:06


    The AIDE check that you scheduled found something. You can quickly tell from the
