- pgno: 25
  md: '# # Preliminary Concepts

    Underlying Packet-Filtering

    Firewalls


    A small site may have Internet access through various means such as a T1 line,
    a cable modem, DSL, wireless, a PPP or ISDN connection, or any number of other
    means. The computer connected directly to the Internet is a point of focus for
    security issues. Whether you have one computer or a local area network (LAN) of
    linked computers, the initial focus for a small site will be on the machine with
    the direct Internet connection. This machine will be the firewall.


    The firewall has various meanings depending on its implementation and purpose.
    At this opening point in the book, firewall means the Internet-connected machine.
    This is where your primary security focus for Internet access will be implemented.
    The firewall machine''s external interface card is the connection point, or gateway,
    to the Internet. The purpose of a firewall is to protect what''s on your side
    of this gateway from what''s on the other side.


    A simple firewall setup is sometimes called a bastion firewall because it''s the
    main line of defense against attack from the outside. Many of your security measures
    are mounted from this defender of your realm. Consequently, everything is done
    to protect this system.


    Behind this line of defense is your single computer or group of computers. The
    purpose of the firewall machine might simply be to serve as the connection point
    to the Internet for other machines on your LAN. You might be running local, private
    services behind this firewall, as a shared printer or shared filesystems. Or you
    might want all of your computers to have access to the Internet. One of your machines
    might host your private financial records.You might want to have Access from this
    machine, but you don''t want anyone getting in. At some point, you might want
    to offer your own services to the Internet. One of the machines might be hosting
    your own website for the Internet. Another might function as your mail server
    or gateway. Your setup and goals will determine your security policies.


    The firewall''s purpose is to enforce the security policies you define. These
    policies reflect the decisions you''ve made about which Internet services you
    want to be accessible'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Chapter 1 Preliminary Concepts Underlying Packet-Filtering Firewalls


    to your computers, which services you want to offer the world from your computers,
    which services you want to offer to specific remote users or sites, and which
    services and programs you want to run locally for your own private use. Security
    policies are all about access control and authenticated use of private or protected
    services, programs, and files on your computers.


    Home and small-business systems don''t face the security issues of a larger corporate
    site, but the basic ideas and steps are the same. There aren''t as many factors
    to consider, and security policies often are less stringent than those of a corporate
    site. The emphasis is on protecting your site from unwelcome access from the Internet.
    A packet-filtering firewall is one common approach, and to one piece of network,
    and controlling access to and from the outside.


    Of course, having a firewall doesn''t mean you are fully protected. Security is
    a process, not a piece of hardware. For example, even with a firewall in place
    it''s possible to download spyware or click on a maliciously crafted email, thereby
    opening up the computer and thus the network to attack. It''s as important to
    have measures in place to mitigate successful attacks as it is to spend resources
    on a firewall. Using best practices inside your network will help to lessen the
    chance of a successful exploit and give your network resiliency.


    Something to keep in mind is that the Internet paradigm is based on the premise
    of end-to-end transparency. The networks between the two communicating machines
    are intended to be invisible. In fact, if a network device somewhere along the
    path fails, the idea that traffic between the two endpoint machines will be silently
    routed.


    Ideally, firewalls should be transparent. Nevertheless, they break the Internet
    paradigm by introducing a single point of failure within the networks between
    the two endpoint machines. Additionally, not all applications use communication
    protocols that are easily passed through a single packet-filtering firewall. It''s
    impossible to pass certain traffic through a firewall without additional application
    support or more sophisticated firewall technology.


    Further complicating the issue has been the introduction of Network Address Translation
    (NAT, or "masquerading") in Linux parlance). NAT enables one computer to act on
    behalf of many other computers by translating their requests and forwarding them
    to their destination. The use of NAT along with RFC 1918 private IP addresses
    has prevented a looming shortage of IPv4 addresses.The combination of NAT and
    RFC 1918 address space makes the transmission of some types of network traffic
    difficult, impossible, complex, or expensive.


    Many router devices, especially those for DSL, cable modems, and wireless, are
    being sold as firewalls but are nothing more than NAT-enabled routers. They don''t
    perform many of the functions of a true firewall, but they do separate internal
    from external. Be wary when purchasing a router that claims to be a firewall but
    only provides NAT. Although some of these products have some good features, the
    more advanced configurations are sometimes not possible.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'A final complication has been the proliferation of multimedia and peer-to-peer
    (P2P) protocols used in both real-time communication software and popular networked
    games. These protocols are antithetical to today''s firewall technology. Today,
    specific solutions must be built and deployed for each application protocol. The
    firewall architectures for easily and economically handling these protocols are
    in process in the standards committees'' working groups.


    It''s important to keep in mind that the combination of firewalling, DHCP, and
    NAT introduces complexities that cause sites to compromise system security to
    some extent in order to use the network services that the users want. Small security
    to some businesses often have to deploy multiple LANs and more complex network
    configurations to meet the varying security needs of the individual hosts.


    Before going into the details of developing a firewall, this chapter introduces
    the basic underlying concepts and mechanisms on which a packet-filtering firewall
    is based. These concepts include a general frame reference for what network communication
    is, how network-based services are identified, what a packet is, and the types
    of messages and information sent between computers on a network.


    # # The OSI Networking Model


    The OSI (Open System Interconnection) model represents a network framework based
    on layers. Each layer in the OSI model provides distinct functionality in relation
    to the other layers. The OSI model contains several layers, as shown in Figure
    1.1.


    The layers are sometimes referred to by number, with the lowest layer (Physical)
    being Layer 1 and the highest layer (Application) being Layer 7. If you hear someone
    refer to a


    | Application |

    | Presentation |

    | Session |

    | Transport |

    | Network |

    | Datalink |

    | Physical |


    Figure 1.1 The seven layers of the OSI model'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Chapter 1 Preliminary Concepts Underlying Packet-Filtering Firewalls


    Layer 3 switch,” he she is referring to the third layer of the OSI model. As a
    person interested in security and intrusion detection, you must know the layers
    of the OSI model to fully understand the attack paths that could compromise your
    systems.


    Each layer in the OSI model is important. The protocols you use every day, such
    as IP, TCP, ARP, and others, reside on the various layers of the model. Each layer
    has its own distinct function and role in the communication process.


    The physical layer of the OSI model is occupied by the medium itself, such as
    the cabling and signaling protocols; in others, transferring the bits. For the
    most part, the physical layer is either of concern to the network intrusion detection
    beyond the devices and cabling themselves. Because this book doesn''t really talk
    about physical security (how interesting are door locks?), I''m not devoting time
    to the physical layer of the OSI model either. Naturally, the steps to secure
    physical wires are different from those you would take to attempt secure wireless
    devices.


    The next layer above is the Datalink. The Datalink layer transfers the data over
    the medium and is responsible for things such as detection and recovery from errors
    in transmission. The Datalink layer is the layer where physical hardware addresses
    are defined, such as an Ethernet card Media Access Control (MAC) addresses.


    Above the Datalink layer, the Network layer is the all-important third layer in
    IP networks. This layer is responsible for the logical addressing and routing
    of data. IP is a Network-layer protocol, which means that the Network layer is
    the layer on which IP addresses and subnet masks are used. Routers and some switches
    operate at Layer 3, moving data between logically and physically divided networks.


    The fourth layer, the Transport layer, is the primary layer on which reliability
    can be built. Protocols that exist at the Transport layer include TCP and UDP.
    fifth layer is the Session layer, within which sessions are built between endpoints.
    The sixth layer, Presentation, is primarily responsible for communication with
    the Application layer above, and it also defines things such as encryption to
    be used. Finally, the Application layer is responsible for displaying data to
    the user or application.


    Aside from the OSI model, there exists another model, the DARPA model, sometimes
    is only four layers. The OSI model has the traditional or de facto model on which
    most network discussions take place.


    As data moves from an application down the OSI model, the protocol at the next
    layer may add its own information onto the data. This data usually consists of
    a header that is prepended onto the data from the next highest level, sometimes
    a trailer is added as well. This process, encapsulation, continues until the data
    is transported across the physical medium. In the case of Ethernet, the data is
    known as a frame when it is transmitted. When the Ethernet frame arrives at its
    destination, the frame begins the process of moving up the layers of the OSI model,
    with each layer reading the header (and possibly trailer) information from the
    corresponding layer of the sender. This process is called demultlexing.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# The Internet Protocol


    # Connectionless versus Connection-Oriented Protocols


    At some layers of the OSI model, protocols can be defined in terms of one of their
    properties, connectionless or connection oriented. This definition refers to the
    methods that the protocol contains for providing such as error control, flow control,
    data segmentation, and data reassembly.


    Think of connection-oriented protocols in terms of a telephone call. Generally
    there is an acceptable protocol for making a phone call and having a conversation.
    The person making the call, the initiator of the communication, opens the communication
    by dialing a telephone number. The person (or machine, as is the ever-increasing
    case) at the other end receives the request to begin a telephone conversation.
    The request to initiate a telephone conversation is frequently indicated by the
    ringing of the telephone on the receiver’s end. The receiver picks up the phone
    says “Hello” or some other type of greeting. The initiator then acknowledges this
    by responding in kind. At this point, it’s safe to say that the conversation or
    call setup has been initiated. From this point forward, the conversation continues.
    During the conversation if something goes wrong as noise on the line, one of the
    parties may ask the other to repeat his or her last state. Most of the time when
    a call is complete, both will indicate that they are done with the conversation
    by saying “Goodbye.” The call ends shortly.


    The example just provides a semi-reasonable picture of a connection-oriented protocol
    such as TCP. There are exceptions to the rule, just as there can be exceptions
    or errors with the TCP protocol. For sometimes, the initial call fails for technological
    reasons beyond the control of the caller or receiver.


    On the other hand, a connectionless protocol is more akin to a postcard sent through
    the mail. After the sender writes a message on the postcard and drops it into
    the mailbox, the sender (presumably) controls over that message. The sender receives
    no direct acknowledgment that the postcard was ever delivered successfully. Examples
    of connectionless protocols include UDP and IP itself.


    # Next Steps


    From here, I’m going to jump into a more detailed look at the Internet Protocol
    (IP). However, I strongly recommend you spend some additional time learning about
    the OSI model and the protocols themselves. Knowledge of the protocols and the
    OSI model is vital to a security professional. I highly recommend the book TCP/IP
    Illustrated, Volume 1, Second Edition, by Kevin R. Fall and W. Richard Stevens
    as a book that is indispensable on any computer''s desk.


    # The Internet Protocol


    The Internet Protocol is the basis on which the Internet operates. Together with
    protocols at other layers, the IP layer provides communications for countless
    applications. IP is a connectionless protocol providing Layer 3 routing functions.'
