- pgno: 205
  md: '# Configuration Options for a Trusted Home LAN


    types of Internet connections. Following are some questions you should consider
    when creating a security policy for your site.


    Is a public IP address dynamically and temporarily assigned via DHCP or IPCP?
    Does the site have a single permanently assigned IP address or a block of them?


    Are services offered to the Internet? These services are hosted on the firewall
    machine, or are they hosted on internal machines? For example, you might offer
    email service from the gateway firewall machine but serve a website from an internal
    machine in the DMZ. When services are hosted from internal machines, you want
    to place those machines on a perimeter network and apply completely different
    packet-filtering and access policies to them. If services are offered from internal
    machines, this is fact visible to the outside, or are the services proxied or
    temporarily forwarded via NAT that they appear to be available from the firewall
    machine?


    How much information do you want to make available about the machines on your
    LAN? Are local DNS database contents available to the Internet?


    Can people log in your machines from the Internet? How many and which local machines
    are accessible to them? Do all users have the same access rights? Will incoming
    connections be proxied for additional access control?


    Are internal machines equally accessible to all users and from all local machines?
    For example, if you use a screened-host firewall architecture, users must log
    in the firewall machine directly to have access to the Internet. No routing would
    be done at all.


    Are private LAN services running behind the firewall? For example, is NFS used
    internally, or Samba, or a networked printer? Do you need to keep any of these
    services leaking information over the Internet, such as SNMP, DHCP, or NTP? Maintaining
    such services behind the secondary choke firewall ensures complete isolation of
    services from the Internet.


    Related services designed for LAN are questions about local external access to
    services designed for Internet use. Will you offer FTP internally but not externally,
    or will you offer different kinds of FTP services to both? Will you run a private
    web server or configure different parts of the site to be available to local users
    as opposed to remote users? Will you run a local server to send mail but use a
    different mechanism to retrieve incoming mail from the Internet (that is, will
    your mail be delivered directly to your machine''s user accounts, or will you
    explicitly retrieve mail from an ISP)?


    # Configuration Options for a Trusted Home LAN


    You must consider two kinds of internal network traffic. The first kind is local
    access to the gateway firewall, through the internal interface, as shown in Figure
    7.4.The second is local access to the Internet, through the gateway machine''s
    external interface.


    Presumably, most local systems have no reason to filter packets between the firewall
    and the local network in general. However, because most home-based sites are assigned
