    > How Trustworthy are “Trusted Home LANs?”

    Although small-business and residential sites often like to view their networks
    as “trusted,” this is often not the case. The problem isn’t the local users, but
    rather the higher incidence of compromise among these systems.


    # LAN Access to the Gateway Firewall


