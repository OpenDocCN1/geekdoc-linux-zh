  md: '# Chapter 5 Building and Installing a Standalone Firewall


    manages remote Linux servers, I find that access to the console is rarely possible.
    Therefore, a method is necessary for stopping the firewall automatically after
    it gets started, just in case the firewall locks out my connection. Cron to the
    rescue.


    Using a cron entry, you can stop the firewall by running the script with a _stop
    argument at some predefined interval. I find that every 2 minutes works well during
    initial debugging. If you''d like to use this method, set a cron entry with the
    following command as root (on Debian):


    ```

    crontab -e

    */2 * * * /etc/init.d/rc.firewall stop

    ```


    On Red Hat and SUSE:


    ```

