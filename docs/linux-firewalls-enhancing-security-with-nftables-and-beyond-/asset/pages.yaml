    What kinds of mistakes need protection? The worst mistake is allowing dangerous
    services to the world, whether inadvertently or intentionally. A common mistake
    is running local network services that allow access to the Internet and other
    people. Another is allowing questionable outgoing traffic, as port scans, whether
    this traffic is generated by accident or intentionally is sent out by someone
    on your machine. A deny-by-default firewall policy protects you from many of these
    types.


    # ### The Problem with Port Scans


    Port scans are not harmful in themselves. They are generated by network analysis
    tools. The problem with port scans today is that they are usually generated by
    people with less-honorable intentions. They are "analyzing" your network, not
    your own. Unfortunately, this leaves the merely curious guilty as well.


    A deny-by-default firewall policy enables you to run many private services behind
    the firewall without undue risk. These services must explicitly be allowed through
    the firewall to be accessible to remote hosts. This generalization is only an
    approximation of reality. Although TCP services on privileged ports are reasonably
    safe from all a skilled and detected hacker, UDP services are inherently less
    secure, and some services are assigned to unprivileged ports. RPC services, usually
    over UDP, are even more problematic. RPC-based services are bound to some port,
    often an unprivileged port. The portmap daemon maps the RPC service number and
    the actual port number. A port scan can show where RPC-based services are bound
    without going through the portmap daemon. Luckily, the use of portmap is becoming
    less common, so this isn''t as much of a concern as it was a few years ago.


