- pgno: 251
  md: '# 10


    # # Virtual Private Networks


    Contributed by Carl B. Constantine


    The use of virtual private networks, or VPNs, is fast becoming the preferred method
    for accessing remote and private networks by home users and business users alike.
    This chapter discusses VPNs, providing both some background on VPNs themselves
    and insight on how you might implement a VPN using Linux.


    # ## Overview of Virtual Private Networks


    VPN systems are designed to connect two or more devices or networks securely over
    a public network such as the Internet. A VPN is so named because it is virtual,
    using an already existing infrastructure; it is private, having the data encapsulated
    through a secure protocol; and it is a network, because it connects two or more
    devices or networks together. VPNs are popular today because they provide a better
    value proposition than setting up individual leased connections between locations,
    especially for road warriors or other short-lived connections. VPNs also provide
    seamless operation. After initial configuration is done, the networks connected
    with a VPN can operate as if they were one network.


    # ## VPN Protocols


    Most VPN systems use one of three main protocols: Point-to-Point Tunneling Protocol
    (PPTP), Layer 2 Tunneling Protocol (L2TP), or IP Security (IPSec). This section
    looks at all three.


    # ### PPTP and L2TP


    Point-to-Point Tunneling Protocol was originally designed and developed by a consortium
    of companies to encapsulate non-TCP/IP protocols such as IPX over the Internet
    using Generic Routing Encapsulation (GRE). Security in the protocol was added
    later. Layer 2 Tunneling Protocol (L2TP) is widely considered to be the successor
    to PPTP for most environments.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# Generic Routing Encapsulation


    Many protocols are currently available that are designed to encapsulate or hide
    one protocol in another, normally IP; GRE is designed to be more generic (hence
    the name) than these other protocols. As such, however, it may fit the need of
    specifically encapsulating X over protocol Y; instead, it is designed to be a
    simple, general-purpose encapsulation protocol that reduces the overhead of providing
    encapsulation. RFC 2784, "Generic Routing Encapsulation (GRE),'' describes GRE
    in detail.


    PPTP and L2TP are very popular in many corporate environments, particularly those
    that are Windows-centric. There are both PPTP and L2TP clients for Windows, Linux,
    OS X, and major mobile platforms as well.


    # IPsec


    IPsec was designed with security in mind and is considered the de facto standard
    for secure private communication across public networks such as the Internet.
    As mentioned previously, IPsec has been included in IPv6 and can also be used
    in the IPv4 standard.


    IPsec provides data integrity, authentication, and confidentiality. All IPsec
    services are at the IP layer and provide protection for IP and upper-layer protocols.
    These services are provided by two security protocols, the Authentication Header
    (AH) and the Encapsulating Security Payload (ESP). IPsec uses a cryptographic
    management system through the Internet Key Exchange (IKE) protocol and a managed
    Security Association (SA) connection.


    IPsec offers many advantages compared to other secure network access methods.
    One of the biggest advantages is that IPsec can work in the background without
    the user knowing what''s happening.


    # Authentication Header


    Normal IP packets consist of a header and a payload. The header contains both
    source and destination IP addresses that are required for routing. The payload
    contains of information that may be confidential. Headers can be spoofed or altered
    by a man-in-the-middle type of attack. The AH actually signs the outbound packet
    digitally, verifying the identity of source and destination addresses and the
    integrity of the payload data.


    AH provides authentication, not encryption, and can be configured in two ways:
    in transport mode or in tunnel mode. Transport mode applies only to the host implementation
    and provides protection for the upper-layer protocols as well as IP header fields.
    Using transport mode, the AH is inserted after the IP header and before the upper-layer
    protocol (TCP, UDP, ICMP, and so forth), or before other IPsec headers that may
    already have been inserted.


    The AH in tunnel mode protects the entire IP packet, including the entire IP header.
    As in transport mode, the AH is inserted after the outer IP header of the packet.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# VPN Protocols 231


    | Next Header | Payload Len | RESERVED |

    |---|---|---|n| Security Parameters Index (SPI) | | |

    | Sequence Number Field | | |

