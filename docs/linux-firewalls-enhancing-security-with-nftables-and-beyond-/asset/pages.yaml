    address or the hardware address associated with the network interface itself.
    Remember that IP addresses are relevant only to protocols at higher layers of
    the OSI model.


    Aside from frames addressed to the device itself, two special cases exist that
    might cause an interface to accept data and pass it up to higher layers. These
    two special cases are multicast and broadcast. Multicast is for transmitting data
    to a subset of devices that are said to be subscribed to multicast.


    On the other hand, broadcasts are meant to be processed by every device that receives
    them. Primarily two types of broadcasts are available: directed broadcast and
    limited broadcast. By far, directed broadcasts are more common. Limited broadcasts
    are by devices attempting to configure themselves through DHCP, BOOTP, or another
    configuration protocol. A limited broadcast is sent to the address 255.255.255
    and should never pass through a router. This is a key hint for anyone who controls
    a router or other routing device such as a firewall. If you receive a packet on
    your external, Internet-facing router address is 255.255.255.255, chances that
    there are a misconfigured device, or more likely, a potential attacker is attacking
    to probe your network. You may have a limited broadcast on an internal router
    for a router if you have devices that configure themselves using DHCP.


    Directed broadcasts are the most common form of broadcast that you''ll see on
    given network. This is because broadcasts are used by the Address Resolution Protocol
    (ARP, discussed later) to determine the MAC address for an IP address on a given
    subset. A directed broadcast is a broadcast that is limited by the network or
    subnet in which the sending device resides. By default, when a router encounters
    a directed broadcast, it does not pass to other subnets through the router. Most
    routers can be configured to allow this behavior; however, one should be careful
    so not to create a broadcast storm by forwarding broadcasts through a router.
    A subnet broadcast varies depending on the subnet mask for the given subnet. In
    a Class C subnet (255.255.255.0/24), the default broadcast address is the highest
    available address, thus the one ending in .255. For example, in the 192.168.1.0/24
    network, the broadcast address is 192.168.1.255.


