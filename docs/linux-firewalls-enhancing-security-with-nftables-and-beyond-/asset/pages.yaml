    Although some services, such as web or FTP services, can be expected to be coming
    from anywhere, other services will legitimately be coming from only your ISP or
    specially chosen hosts. Examples of servers that are probably offered only your
    ISP are POP mail service, Domain Name Service (DNS) server responses, and possible
    DHCP or dynamic IP assignments.


    The second class of incoming is from remote clients accessing services offered
    from your site. Again, although some incoming connections, such as connections
    to your web server, can be expected to be coming from anywhere, other local services
    will be offered to only a few remote users or friends. Examples of restricted
    local services might be ssh and ping.


    # Local Destination Address Filtering


    Filtering incoming packets based on the destination address is not much of an
    issue. Under normal operation, your network interface card ignores packets that
    are not addressed to it. The exception is broadcast packets, which are broadcast
    to all hosts on the network.


    The IPv4 address 255.255.255.255 is the general broadcast destination address.
    It is referred to all hosts on the physical network segment, and it is called
    a limited broadcast. A broadcast can be defined more explicitly as the highest
    address in a given subnet of IP addresses. For example, if your ISP''s network
    address is 192.168.10.0 with a 24-bit subnet mask (255.255.255.0) and your IP
    address is 192.168.10.100, then you would see broadcast packets addressed to 192.168.10.255
    from your ISP. On the other hand, if you have a smaller range of IP addresses,
    as a /30 (255.255.255.252), then you have a total of four subnets: two for hosts,
    and the broadcast. For example, consider the network 10.3.7.4/30. In this network,
    10.3.7.4 is the network address, the two hosts would be 10.3.7.5 and 10.3.7.6,
    and the broadcast address would be 10.3.7.7. This /30 subnet configuration is
    typically used between routers, though the actual addresses themselves may vary.
    The only way to know what the broadcast address for for a given subnet is to know
    an IP address within the subnet and the subnet mask. These types of broadcasts
    are called directed subnet broadcasts and are delivered to all hosts on that network.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Filtering Incoming Packets


    Broadcast-to-destination address 0.0.0.0 is similar to the situation of point-to-point
    packets claiming to be from the broadcast source address mentioned earlier, in
    the “Source Address Spoofing and Illegal Addresses.” Here, broadcast packets are
    directed to source address 0.0.0.0 rather than to the destination 255.255.255.
    In this case, there is little question about the packet''s intent. This is an
    attempt to identify your system as a Linux port. For historical reasons, networking
    code derived from BSD UNIX returns an ICMP Type 3 error message in response to
    0.0.0.0 being used by the broadcast destination. Other operating systems silently
    discard the packet. As such, this is a good example of dropping versus rejecting
    a packet makes a difference. In this case, the error message itself is the port
    we are looking for.


    # Remote Source Port Filtering


    Incoming requests and connections from remote clients to your local servers will
    have a source port in the unprivileged range. If you are hosting a web server,
    all incoming connections to your remote server should have a source port between
    1024 and 65535. The server port identifies the service is the intention but not
    the guarantee. You cannot be certain that the port you expect is at the port you
    expect.

    Incoming responses and connections from remote servers that you contacted will
    have the source port that is assigned to the particular service. If you connect
    to a remote website, all incoming messages from the remote server will have the
    source port set to 80 (or whatever port the local client specified), the http
    service port number.


    # Local Destination Port Filtering


    The destination port in incoming packets identifies the program or service on
    your computer that the packet is intended for. As with the source port, all incoming
    requests from remote clients to your services generally follow the same pattern,
    and all incoming responses from remote servers to your local clients follow a
    different pattern.

    Incoming requests and connections from remote clients to your local servers will
    have the destination port to the service number that you assigned to the particular
    service. For example, an incoming packet for your local web server would normally
    have the destination port set to 80, the http service port number.

    Incoming responses from remote servers that you contacted will have a destination
    port in the unprivileged range. If you connect to a remote website, all incoming
    messages from the remote server will have a destination port between 1024 and
    65535.


    # Incoming TCP Connection State Filtering


    IncomingTCP port acceptance rules can use of the connection state flags associated
    with TCP connections. All TCP connections adhere to the same set of connection
    states. These states differ between client and server because of the three-way
    handshake during connection establishment. As such, the firewall can distinguish
    between incoming traffic from remote clients and incoming traffic from remote
    servers.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Chapter 2 Packet-Filtering Concepts


    Incoming TCP packets from remote clients will have the SYN flag set in the first
    packet received as part of the three-way connection establishment handshake. The
    first request will have the SYN flag set, but not the ACK flag.


    Incoming packets from remote servers will always be responses to the initial connection
    request initiated by your local client program. Every TCP packet received from
    a remote server will have the ACK flag set. Your client firewall rules will require
    all incoming packets from remote servers to have the ACK flag set. Servers do
    not normally attempt to initiate connections to client programs.


    # Probes and Scans


    A probe is an attempt to connect to or get a response from an individual service
    port. A scan is a series of probes to a set of different service ports. Scans
    are often automated.


    Unfortunately, probes and scans are rarely innocent anymore. They are most likely
    the initial information-gathering phase, looking for interesting vulnerabilities
    before launching an attack. Automated scans are widespread, and coordinated by
    efforts of hackers are common. The security, or lack thereof, of many hosts on
    the Internet, along with the proliferation of worms, viruses, and zombie machines,
    makes scans a constant issue on the Internet.


    # General Port Scans


    General port scans are indiscriminate probes across a large block of service ports,
    possibly the entire range (see Figure 2.6). These scans are somewhat less frequent—or,
    at least, less obvious—as more sophisticated, targeted stealth tools become available.


    # Targeted Port Scans


    Targeted scans look for specific vulnerabilities (see Figure 2.7). The newer,
    more sophisticated tools attempt to identify the hardware, operating system, and
    software versions. These tools are designed to identify targets that might be
    prone to a specific vulnerability.


    # Common Service Port Targets


    Common targets are often individually probed as well scanned. The attacker might
    be looking for a specific vulnerability, such as an insecure mail server, an unpatched
    web server, or an open remote procedure call (RPC) portmap daemon.

    A extensive list of ports can be found at http://www.iana.org/assignments/portnumbers.
    Only a few common ports are mentioned here, to give you the idea:


    +   - Incoming packets from reserved port 0 are always bogus. This port isn''t
    used legitimately.

    - Probes ofTCP ports 0 to 5 are a signature of the scan program.

    - ssh (22/tcp), smtp (25/tcp), dns (53/tcp/udp), pop-3 (110/tcp), imap (143/tcp),
    and snmp (161/udp) target ports. They represent some of the most potentially vulnerable
    openings to a system, whether intrinsically, due to'
  merge: -1
  img_proc: true
