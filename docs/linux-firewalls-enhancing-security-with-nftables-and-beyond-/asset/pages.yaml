    # Test Often


    It’s not enough to secure and update often, though those two items certainly go
    a long way toward ensuring a secure environment.Another basic point of security
    in depth is to test often.Testing ensures that the security policies are enforced
    and the implementation of these security policies is successful.


    Penetration testing is another important aspect of system security. Penetration
    testing, or pen-testing, is a process by which the security of a system is tested
    by trying a number of vectors to get the system to behave in an unexpected way.The
    definition of penetration testing is purposely vague so that it is not limited
    to attacks of only a certain class or type.


    Penetration testing can be informal and formal. The informal pen-tests are typically
    run by security administrators or even developers using anything from manual attempts
    to break into an application to automated attacks using a number of tools. A formal
    pen-test would be done by a third party who would likely use a combination of
    both manual and automated attacks to test the system.The type and frequency of
