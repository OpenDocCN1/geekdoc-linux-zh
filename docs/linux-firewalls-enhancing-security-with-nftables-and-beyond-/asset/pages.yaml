  md: '# Initializing the Firewall


    | Decimal | Binary |

    |---|---|

    | 192.168.24.0 | 11000010.10101010.000110000000 |

    | 192.168.27.255 | 11000010.10101010.000111111111 |

    | Bit | 31 24 21 16 8 0 |


    Figure 5.1 The matching first 22 bits in the masked IP address range 192.168.24.0/22


    Both iptables and nftables allow addresses to be suffixed with a bit mask qualifier.
    The mask''s value can range from 0 through 32, indicating the number of bits to
    mask. As discussed in Chapter 1, "Preliminary Concepts Underlying Packet-Filtering
    Firewalls," bits are counted from the left, or most significant. This bit mask
    specifies how many of the leading bits match the IP address specified.


    A mask of 32, /32, means that all the bits must match.The address must match exactly
    what you''ve defined in the rule. Specifying an address as 192.168.10.30 is the
    same as specifying the address as 192.168.10.30/32. The /32 is implied by default;
    you do not need to specify.


    An example using is to connect to a service to be made between your machine and
    your ISP''s server machines. Let''s say your ISP uses addresses in the range of
    192.168.24.0 through 192.168.27.255 for its server space. In this case, the address/mask
    pair would be 192.168.24/22. As shown in Figure 5.1, the first 22 bits of all
    addresses are identical, any address matching on the first 22 bits will match.
    Effectively, you are saying that you will allow connections to the service only
    when offered from machines in the address range 192.168.24.0 through 192.168.27.255.


    A mask of /0, means that no bits in the address are required. In other words,
    because no bits need to match, using /0 is the same as not specifying an address.
    Any unicast address matches. iptables has built-in aliases for 0.0.0.0/0, any/0.
    Note that whether implied or stated, does not include broadcast addresses.


    # Initializing the Firewall


    A firewall is implemented as a series of packet-filtering rules defined by options
    given in the iptables or nftables command.


    The rule invocations should be made from an executable shell script, not directly
    from the command line.You should invoke the complete firewall script. Do not attempt
    to invoke specific rules from the command line because this could cause your firewall
    to accept or drop packets inappropriately.When the chains are initialized and
    the default drop policy is enabled, all network services are blocked until acceptance
    filters are defined to allow the individual service.'
