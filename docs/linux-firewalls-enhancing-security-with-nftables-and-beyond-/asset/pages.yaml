  md: '# Rejecting versus Denying a Packet


    The Netfilter firewall mechanism in iptables and nftables gives you the option
    of rejecting or dropping packets. What''s the difference? As shown in Figure 2.5,
    when a packet is rejected, the packet is thrown away and an ICMP error message
    is returned to the sender. When a packet is dropped, the packet is simply thrown
    away without any notification to the sender.


    Silently dropping the packet is almost always the better choice, for three reasons.
    First, sending an error response doubles the network traffic. The majority of
    dropped packets are dropped because they are malevolent, not they represent an
    innocent attempt to access a service you don''t happen to offer. Second, a packet
    that you respond to can be used in a denial-of-service (DoS) attack. Third, even
    an error message, gives the would-be attacker potentially useful information.


    # Filtering Incoming Packets


    The input side of the external interface I/O port, the input rule set, is the
    more interesting in terms of securing your site. As mentioned earlier, you can
    filter by source address, destination address, source port, destination port,
    TCP status flags, and other criteria. You''ll learn about all these pieces of
    information at one point or another in the following sections.


    # Remote Source Address Filtering


    At the packet level, the only means of identifying the IP packet''s sender is
    the source address in the packet header. This fact allows for the possibility
    of source address spoofing, in which the sender places an incorrect address rather
    than his or her own address in the source field. The address might be a nonexistent
    address, or it might be a legitimate address belonging to someone else. This can
    allow unsavory types to break into your


    ![](img/48efc603406f52595e8bb3258079832d_53_0.png)'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Chapter 2 Packet-Filtering Concepts


    system by appearing as local, trusted traffic; appearing to be you while attacking
    other sites; pretending to be someone else attacking you; keeping your system
    bogged down responding to nonexistent addresses; or otherwise misleading you as
    to the source of incoming messages.


    It''s important to remember that you usually can''t detect spoofed addresses.
    The address might legitimate and routable but might not belong to the packet''s
    sender. The next section describes the spoofed addresses you can detect.


    # Source Address Spoofing and Illegal Addresses


    There are several classes of addresses you should deny on your external interface
    in all cases. These are incoming packets claiming to be from the following:


    +   Your IP address—You will never see legal incoming packets on your machine.
    Because the source address is the only information available and it can be modified,
    this is one of the forms of legitimate address spoofing you can detect in the
    packet-filtering level. Incoming packets claiming to be your machine are spoofed.
    You can''t be certain whether other incoming systems crash if they come from where
    they they receive a packet in which both the source and the destination addresses
    belong to the host''s network interface.


    +   Your LAN addresses—You will rarely see legal incoming packets on the external,
    Internet interface claiming to be from your LAN. It is possible to see such packets
    if the LAN has multiple access points to the Internet, but it would probably be
    a sign of a misconfigured local network. In most cases, such packet would be part
    of an attempt to gain access to your site by exploiting your trust relationships.


    +   Class A, B, and C private IP addresses—These three sets of addresses in the
    historical Class A, B, and C ranges are reserved for use in private LANs. They
    aren''t intended for use on the Internet. As such, these addresses can be used
    by any site internally without the need to register IP addresses. Your machine
    should never see incoming packets from these source:


    +   Class A private addresses are assigned the range from 10.0.0.0 to 10.255.255.255.


    +   Class B private addresses are assigned the range from 172.16.0.0 to 172.31.255.255.


    +   Class C private addresses are assigned the range from 192.168.0.0 to 192.168.255.255.


    +   Class D multicast IP addresses—IP addresses in the Class D range are set aside
    for destination addresses when participating in a multicast network broadcast,
    as an audioc or a videoc. They range from 224.0.0.0 to 239.255.255.255. Your machine
    should never see packets from these source addresses.'
  merge: -1
  img_proc: true
