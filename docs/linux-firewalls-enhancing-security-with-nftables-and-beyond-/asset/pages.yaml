    \ by the additional FTP connection tracking support module. With the addition\
    \ of that module, the meaning of RELATED is extended to include the secondary\
    \ FTP connection.\n\nAn example of an INVALID packet is an incoming ICMP error\
    \ message that wasn't a response to a current session, or an echo-reply that wasn't\
    \ a response to a previous echo-request.\n\nIdeally, using the ESTABLISHED match\
    \ allows the firewall rule for a service to be collapsed into a single rule that\
    \ allows the first packet. For example, using the ESTABLISHED match, a web client\
    \ rule requires allowing only the initial outgoing SYN request. A DNS client request\
    \ requires only the rule allowing the initial UDP outgoing request packet.\n\n\
    # Table 3.14 state Match Extension\n\n| -m | --match state Option | Description\
