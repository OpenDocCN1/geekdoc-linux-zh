- pgno: 275
  md: 'initial report was incorrect. This is an example of a false positive. Although
    additional tests were unnecessarily performed based on the false positive, it
    is still much better than having a false negative, with the cancer going unnoticed
    and untreated.


    Because Chkrootkit reports tools using the computer, it may report a false negative.
    There are ways around this problem as described later in this section.


    # # If Chkrootkit Says the Computer Is Infected?


    If Chkrootkit says your computer is infected, the first thing you should do is
    tell yourself to remain calm. Although you should not assume so, there is a chance
    that Chkrootkit is reporting a false positive. If Chkrootkit reports an infection,
    you should immediately take steps to mitigate any further damage.


    The preceding chapter of the book looked at incident response. Therefore, it would
    be redundant to cover that material in this chapter. However, with all tools of
    this nature, false positives come with the territory. It is in your best interest
    to take the notice seriously, but it might also be worth try to determine whether
    Chkrootkit has reported a false positive.


    Chkrootkit uses various means to find roots a certain signature in a file based
    on a known trojan of the file. Other Chkrootkit looks for ports that are open
    have been known to be the result of a rootkit or other. This was the case for
    the report of infection highlighted earlier in this section. Chkrootkit reported
    that it believed the computer was infected with the bindish rootkit.


    In reality


    With dozens of reports reported by Chkrootkit, you probably won''t know the exact
    ramifications of being infected by a given rootkit. Further, there''s a good chance
    that if one root has run, multiple rootkits have been run, cleanup all that much
    more difficult. To begin the process of damage control, you can search the web
    for each individual rootkit to determine what actions it takes when it''s run.
    However, realize that by definition, after a root has run successfully, the attacker
    has root privileges over the computer and may have done much greater damage to
    the system or may be in the process of doing so now!


    Whenever Rootkit reports an infection, you should take it seriously and always
    assume the root. Prudence suggests that you should immediately unplug the computer
    from the network and take steps to clean up from the rootkit. In reality, it''s
    rarely that cut-and-died.


    # # Limitations of Chkrootkit and Similar Tools


    Chkrootkit is a powerful and incredibly helpful tool but it is without limitations.
    These limitations are not really specific to Chkrootkit but rather are a limitation
    of any tool that attempts to perform complex checks such as this. One such limitation,
    false positives,'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'has already been discussed. Another limitation of Chkrootkit and other tools
    like it is that they rely, by default, on programs included with the Linux computer,
    programs that may have been compromised or altered to avoid detection by prying
    eyes such as those of Chkrootkit and related utilities.


    Here''s a partial list of programs that Chkrootkit uses; keep in mind that these
    programs may themselves in turn rely on libraries or other things on the Linux
    computer that also may be compromised:


    +   - awk

    - cut

    - echo

    - egrep

    - find

    - head

    - id

    - ls

    - netstat

    - ps

    - sed

    - strings

    - uname


    Another limitation of tools such as Chkrootkit that is shared by similar tools
    is that it can detect only rootkits that have been reported and for which it has
    been configured. Some unlucky soul has to be the first to have the rootkit run
    on his or her computer. If you happen to be that person, Chkrootkit won''t help.
    Realize, though, there is a fair chance that multiple rootkits will be run on
    the computer, which will make detection easier. I realize that this is small consolation.


    # Using Chkrootkit Securely


    It''s a good idea to use known-good sets of binaries when using a tool such as
    Chkrootkit. Many rootkits replace vital system binaries as /bin/ps with versions
    of their own. If you try to use ps to find unknown processes, you may not be able
    to see them because the trojaned version of ps hides them.


    Chkrootkit gives two methods for working around this problem. The first method
    involves using a known-good set of binaries, probably mounted from a CD-ROM. The
    second method involves physically mounting the possibly compromised hard drive
    into a different computer and then running the check from there. This second method
    is more appropriate for forensics after a successful attack than investigating
    a possible attack.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# Filesystem Integrity


    Mounting a CD-ROM with known-good versions of binaries is a safe and easy method
    for performing a thorough examination using Chkrootit.This method assumes that
    you have a CD-ROM with the correct binaries already on the disc. To run Chkrootit
    with a CD-ROM copy of the binaries, first mount the CD.This is usually accomplished
    using the mount command, although sometimes it''s mounted automatically. A common
    method for mounting the CD-ROM drive in most modern Linux distributions is shown
    here:


    ```

    mount -t iso9660 /dev/cdrom /mnt/cdrom

    ```


    Chkrootit uses the -p option to find the location of the binaries it should use.
    Therefore, if the CD-ROM is mounted at /mnt/cdrom, youd run Chkrootit like so:

    ./chkrootit -p /mnt/cdrom


    The other method for running Chkrootit is to physically mount the compromised
    hard drive into another computer and run Chkrootit against the contents of that
    drive.This is accomplished by specifying an alternate "root" directory for Chkrootit.
    Assume that the second drive is mounted at /mnt/drive2:

    ./chkrootit -r /mnt/drive2


    # When Should Chkrootit Be Run?


    Chkrootit should be run when you like.I personally run it at irregular intervals
    for fun, but then again I''m just that type of guy.You most definitely run Chkrootit
    anytime you observe any suspicious activity on the computer or other computers
    that interact with or reside on the same network block as the computer in question.Whenever
    you run Chkrootit, you should always hop out to the website,http://www.chkrootit.org/,
    to check for a new version of the tool.A new signature for a rootkit or additional
    functionality might have been added since the version you''re using.


    You also run Chkrootit nightly from cron. However, I wouldn''t rely on such a
    report being entirely accurate, but it could provide an early warning of an anomaly
    that needs your attention. Running Chkrootit from cron might look like this:


    ```

    0 4 * * * /path/to/chkrootkit

    ```


    The cron entry shown will run Chkrootit every morning at 4:00 a.m. and root the
    recipient of cron job output will receive a report every morning detailing the
    run of Chkrootit.


    # Filesystem Integrity


    Hand in hand with a rootkit checker as Chkrootit goes filesystem integrity software.
    Filesystem integrity monitors important files on the computer and generates reports
