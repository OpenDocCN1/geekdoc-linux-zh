    to a local, networked printer, for example. (A business site would never make
    this choice. The firewall would be protected against problems originating in the
    LAN as it is from problems originating on the Internet.


    Starting with the firewall developed in Chapter 5 as the basis, additional constants
    are needed in the firewall example refer to the internal interface connecting
    to the LAN. This example defines the internal network interface as eth1; the LAN
    is defined as including Class C addresses ranging from 192.168.1.0 to 192.168.1.255;
    as an external interface, the one outside world, is defined as eth0:


    ```

    LAN_INTERFACE="eth1"

    EXTERNAL_INTERFACE="eth0"

    LAN_ADDRESSES="192.168.1.0/24"

    ```


    Allowing unrestricted access across the interface is a simple matter of allowing
    all protocols and by default. Remote servers making new connections from remote
    sites are not accepted. The iptables rules are:


    ```

    $IPT -A FORWARD -i $LAN_INTERFACE -o $EXTERNAL_INTERFACE \\

    -p tcp -s $LAN_ADDRESSES --sport $UNPRIVPORTS \\

    -m state NEW,ESTABLISHED, RELATED -j ACCEPT


    $IPT -A FORWARD -i $EXTERNAL_INTERFACE -o $LAN_INTERFACE \\

    -m state --ESTABLISHED, RELATED -j ACCEPT

    ```


    Here are similar nftables rules:


    ```

    $NFT add rule forward -i $LAN_INTERFACE -o $EXTERNAL_INTERFACE \\

    ip protocol tcp -i saddr $LAN_ADDRESSES tcp sport $UNPRIVPORTS \\

    ct state new,established,related accept

    $NFT add rule forward forward -i $EXTERNAL_INTERFACE -o $LAN_INTERFACE ct state
    \

    established,related accept

    ```


    Notice also that these rules forward traffic. They do not affect local traffic
    between the LAN and the firewall itself. To access services on the firewall host,
    local INPUT and OUTPUT rules are needed as:


    ```

    $IPT -A INPUT -i $LAN_INTERFACE \\

    -p tcp -s $LAN_ADDRESSES --sport $UNPRIVPORTS \\

    -m state --NEW,ESTABLISHED,RELATED -j ACCEPT


    $IPT -A OUTPUT -o $LAN_INTERFACE \\

    -m state --ESTABLISHED,RELATED -j ACCEPT

    ```


    The nftables rules are:


    ```

    $NFT add rule filter input iif $LAN_INTERFACE \\

    ip protocol tcp -i saddr $LAN_ADDRESSES \\

    tcp sport $UNPRIVPORTS ct state new,established,related accept

    $NFT add rule filter output oif $LAN_INTERFACE ct state established,related \

    accept

    ```'
