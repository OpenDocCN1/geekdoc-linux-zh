- pgno: 120
  md: '# Chapter 5 Building and Installing a Standalone Firewall


    Building a custom kernel has a few advantages. First is the capability to compile
    in only

    extract drivers and options necessary for the kernel to run. This is great for
    a server

    as a firewall because the hardware rarely, if ever, changes. Another advantage
    of com-

    piling a custom kernel, if you choose a monolithic kernel, is the capability to
    completely

    prevent some types of attacks against the kernel. Although attacks against monolithic

    kernels are possible, they are less common than attacks against modular kernels.
    Further,

    when you roll your own kernel, you are not confined to the kernel version used
    by the

    distribution. This enables you to use the latest and greatest kernel, which may
    include bug

    fixes for your hardware. Finally, with a custom kernel you can provide additional
    security

    ennhancements to the kernel itself.


    Building a custom kernel is not without its own set of pitfalls. After you roll
    your own

    kernel, you can no longer use the distribution''s kernel updates. Actually, you
    can revert

    to the distribution''s kernel and use the updates, but it''s likely that the distribution
    uses

    anlier version of the kernel that may introduce bugs that were fixed in your custom

    version. Using a static kernel also makes it easier to obtain support from the
    vendor for

    kernel issues.


    As alluded to, I nearly always roll my own kernel for production server

    machine. The situations where direct support is an absolute requirement are the
    only

    exceptions. These are few and far between. I believe the capability to customize
    the kernel

    to the computer and add greater security through additional patches outweighs
    the

    need to use official kernel updates from the distribution.


    # Source and Destination Addressing Options


    A packet''s source and destination address can be specified in a firewall

    rule. Only packets with that specific source and/or destination address match
    the rule.

    Addresses may be a specific IP address, a fully qualified hostname, a network
    (domain)

    name or address, a limited range of addresses, or all-inclusive.


    IP Addresses Expressed as Symbolic Names

    Remote hosts and networks may be specified as fully qualified hostnames or network

    names. Using a hostname is especially convenient for firewall rules that apply
    to an

    individual remote host. This is particularly true for hosts whose IP address can
    change

    or invisibly represent multiple IP addresses, as ISP mail servers do sometimes.

    general, however, remote addresses are better expressed in dotted quo notation
    for

    the possibility of DNS hostname spoofing.


    Symbolic hosts cannot be resolved unless DNS traffic is enabled in the firewall
    rules.

    hostnames are used in the firewall rules, those rules must follow the rules enabling
    DNS

    traffic, unless /etc/hosts contains entries for the hostnames.


    Furthermore, some distributions use a boot environment that installs the firewall
    rules

    before starting the network or any other services, including BIND. If symbolic
    host and

    names are used in the firewall script, those names must have entries in

    /etc/hosts to be resolved.'
