    TCPDump.


    # Nikto


    Nikto is a program to test a web server for known vulnerabilities and also to
    provide information on that web server. Nikto can be downloaded from http://www.cirt.net/Nikto2.


    Because Nikto is web server specific, its coverage will be limited here. However,
    if you are running a web server, I highly recommend Nikto to test the server for
    a number of vulnerabilities.'
