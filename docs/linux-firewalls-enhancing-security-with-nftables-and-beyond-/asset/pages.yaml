    # The Linux Firewall Administration Programs


    This book is based on the 3.14 Linux kernel series. Most current distributions
    of Linux come supplied with the Netfilter firewall mechanism introduced in Chapter
    3, "the Legacy Linux Firewall Administration Program." This mechanism is usually
    referred to iptables, its administration program name. Older Linux distributions
    used the earlier IPFW mechanism. That firewall mechanism is usually referred to
    as ipfwad or ipchains, the earlier version of administration program. As distributions
    are updated to kernels later than 3.13, the Netfilter firewall mechanism, nftables
    or nft (if its administration program is called) will likely be included.


    As a administration program, iptables creates the individual packet-filtering
    chains for the INPUT and OUTPUT chains composing the firewall. nftables does not
    create default tables, chains, or rules, to filter packets chains that are connected
    to the INPUT and OUTPUT hooks must be created manually.


    One of the most important aspects of defining firewalls is the order in which
    the rules are defined. Generally, packet-filtering rules are stored in a kernel
    filter table or within INPUT, OUTPUT, or FORWARD chains, in the order which they
    are defined. Individual rules are inserted at the beginning of the chain or are
    appended to the end of the chain. All rules are appended in the examples in this
    chapter (with one exception at the end of the chapter). The order in which you
    define the rules is the order in which they''ll be added to the kernel tables
    and, the order, in which the rules are compared against each packet.


    As externally originating packet rules at the network interface, header fields
    are compared against each rule in the interface''s chain until a match is found.
    Conversely, as locally generated packet is sent out, its header fields are compared
    against each rule in the interface''s OUTPUT chain until a match is found. In
    either direction, a match stops the rules and the packet disposition is applied:
    ACCEPT, DROP, or, optionally, REJECT. If the packet doesn''t match any rule on
    the chain, the default policy for that chain is applied. The bottom line is the
    first match-ing rules.


    The numeric service port numbers, rather than their symbolic names, as listed
    in /etc/services, are used in all the examples in this chapter. iptables and nftables
    support the symbolic service port names. The examples in this chapter use the
    numeric values because the symbolic names are not consistent across Linux distributions—or
    even from one release to the next. You could use the symbolic names for clarity
    in your own rules, but remember that your firewall could break with the next system'
  merge: -1
