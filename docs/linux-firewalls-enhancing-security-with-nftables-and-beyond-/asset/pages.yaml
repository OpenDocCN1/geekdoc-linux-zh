  img_proc: true
- pgno: 240
  md: '# Chapter 9 Debugging the Firewall Rules


    Table 9.1 syslog Log Facility Categories


    | Facility | Message Category |

    | --- | --- |

    | auth or security | Security/authorization |

    | authpriv | Private security/authorization |

    | cron | cron daemon messages |

    | daemon | System daemon-generated messages |

    | ftp | FTP server messages |

    | kern | Kernel messages |

    | lpr | Printer subsystem |

    | mail | Mail subsystem |

    | news | Network news subsystem |

    | syslog | syslog-generated messages |

    | user | User program-generated messages |

    | uucp | UUCP subsystem |


    Within any given facility category, log messages are divided into priority types.
    The priorities, in increasing order of importance, are listed in Table 9.2.

    An entry in syslog.conf specifies a logging facility, its priority, and where
    to write the messages. Not obvious is that the priority is inclusive. It is taken
    to mean all messages at that priority and higher. If you specify messages the
    error priority, for example, all messages at priority error and higher are included—crit,
    alert, and emerg.

    Logs can be written to devices, such as the console, as well as to files and remote
    machines.


    Tips about Log Files in /var/log

    syslogd creates it. It only writes to existing files. If a log file doesn''t exist,
    you can create it with the touch command and make sure that it is owned by root.
    For security purposes, log files are often not readable by general users. The
    security log file, /var/log/secure, in particular, is readable by root alone.


    Table 9.2 syslog Log Message Priorities


    | Priority | Message Type |

    | --- | --- |

    | debug | Debug messages |

    | info | Informational status messages |

    | notice | Normal but important conditions |

    | warning or warn | Warning messages |

    | err or error | Error messages |

    | crit | Critical conditions |

    | alert | Immediate attention required |

    | emerg or panic | System is unusable |'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# Interpreting the System Logs 219


    These entries write all kernel messages to both the console and /var/log/messages.
    Messages can be duplicated to multiple destinations:


    ```

    kern.* /dev/console

    kern.* /var/log/messages

    ```


    This entry writes panic messages to all default locations, including /var/log/messages,
    the console, and all user sessions:


    ```

    *emerg

    ```


    The two entries write authentication information related to root privilege and
    connections to /var/log/secure, and user authorization information to /var/log/auth.
    With the priority defined level, debug messages are written:


    ```

    authpriv.info /var/log/secure

    auth.info /var/log/auth

    ```


    The two entries write general daemon information to /var/log/daemon, and mail
    traffic information to /var/log/mailog:


    ```

    daemon.notice /var/log/daemon

    mail.info /var/log/mailog

    ```


    Daemons at the debug and info priorities and mail messages at the debug priority
    are not logged (author’s preference). named, crond, and systematic mail checking
    producing uninteresting messages on a regular basis.


    The final entry logs all message categories of priority info or higher to /var/log/messages,
    with the exception of authpriv, daemon, and mail. In this case, the latter four
    message facilities are set to none because their messages are directed to their
    own logged files:


    ```

    *info:authpriv,daemon,mail.none /var/log/messages

    ```


    # ### Information about syslog Configuration


    For a more complete description of syslog configuration options and sample configurations,
    see the pages for syslog.conf(5) and syslogd(8).


    syslogd can be configured to write the system logs to a remote machine. A site
    that uses a networked server configuration to the example in Chapter 7, “Packet-Forwarding,”
