- pgno: 91
  md: '# iptables Syntax


    Match Syntax

    Match extensions require the -m or --match command to load the module, followed
    by any relevant match options.


    # multipart filter Table Match Extension


    multipart port lists can include up to 15 ports per list. Whitespace is not allowed.
    There can be no blank spaces between the commas, and the port values. Ranges cannot
    be interposed in the list. Also, the -m multip command must exactly follow the
    -p <protocol> specifier.


    Table 3.12 lists the options available to the multipart match extension.

    The multiport syntax can be a bit tricky. Some examples and cautions are included
    here. The following rule blocks packets arriving on interface eth0 defined for
    the UDP ports associated with NetBIOS and SMB, common ports that are exploited
    on Microsoft Windows computers targets for worms:


    ```

    iptables -A INPUT -i eth0 -p udp \

    -m multipart --destination-port 135,136,137,138,139 -j DROP

    ```


    The next rule blocks outgoing connection requests are sent through the eth0 interface
    to high ports associated with the TCP services NFS, SOCKS, and squid:


    ```

    iptables -A OUTPUT -o eth0 -p tcp \

    -m multipart --destination-port 2049,1080,3128 --syn -j REJECT

    ```


    What is important to note in this example is that the multipart command must exactly
    follow the protocol specification. A syntax error would have resulted if the --syn
    were placed between the -p tcp and the -m multipart.

    To show a similar example of --syn placement, the following is correct:


    ```

    iptables -A INPUT -i <interface> -p tcp \

    -m multipart --source-port 80, 443 ! --syn -j ACCEPT

    ```


    However, this causes a syntax error:


    ```

    iptables -A INPUT -i <interface> -p tcp ! --syn \

    -m multipart --source-port 80, 443 -j ACCEPT

    ```


    # Table 3.12 multipart Match Extension


    | --match multipart Option | Description |

    |---|---|

    | --source-port <port>[,<port> | Specifies the source port(s). |

    | --destination-port <port>[,<port> | Specifies the destination port(s). |

    | --port <port>[,<port> | Source and destination ports are equal, and they match
    a port in the list. |'
  merge: -1
  img_proc: true
