    # nftables Firewall from Chapter 6


    Recall that in Chapter 6 we built an optimized nftables firewall that used several
    differ-

    ent for declaring variables and building rules. This section shows the contents
    of

    those files. The only one that needs to be executed is the main rc.firewall. The

    remainder needs to be in the same directory.


    Here are the rc.firewall contents:


    ```

    #!/bin/sh


    NFT*=/usr/local/sbin/nft


    # Location of nft on your system


    # Enable broadcast echo Protection

    echo 1 > /proc/sys/net/ipv4/icmp_ignore_broadcasts

    # Disable Source Routed Packets

    for f in /proc/sys/net/ipv4/*/accept_source_route; do

    echo 0 > $f

    done

    # Enable TCP SYN Cookie Protection

    echo 1 > /proc/sys/net/ipv4/tcp_syn_cookies

    # Disable ICMP Redirect Acceptance

    for f in /proc/sys/net/ipv4/*/accept_redirects; do

    echo 0 > $f

    done

    # Don''t send Redirect Messages

    for f in /proc/sys/net/ipv4/*/send_redirects; do

    echo 0 > $f

    done

    # Drop Spoofed Packets coming in on an interface, which, if replied to,

    # would result in the reply going out a different interface.

    ```'
