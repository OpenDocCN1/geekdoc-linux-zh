  img_proc: true
- pgno: 211
  md: '# Configuration Options for a Larger or Less Trusted LAN


    Table 7.1 Network and Host Fields in an IP Address


    | Class A | Class B | Class C |

    |---|---|--|

    | Leading network bits | 0 | 10 | 110 |

    | Network field | 1 byte | 2 bytes | 3 bytes |

    | Host field | 3 bytes | 2 bytes | 1 byte |

    | Network prefix | /8 | /16 | /24 |

    | Address range | 1-126 | 128-191 | 192-223 |

    | Network mask | 255.0.0.0 | 255.255.0.0 | 255.255.255.0 |


    bits as if were part of the network address. These additional network address
    serve to define multiple networks locally. Remote sites are not aware of local
    subnets. They see the address range as normal Class A, B, or C addresses.


    For example, let''s take the C private address block 192.168.1.0 The base address,
    known as the network address, is 192.168.1.0 for this example. The network mask
    for this is 255.255.255.0, exactly matching the first 24 bits, the network address,
    of 192.168.1.0/24 network.


    This network can be divided into two local networks defining the first 25 bits,
    rather than the first 24 bits, as network prefix of the current. In instance,
    we say the local network has a prefix length of 25 rather than 24. The most significant
    bit of the host field is now treated as part of the network address field. The
    host field contains 7 bits rather than 8. The network mask becomes 255.255.255.0,
    or /25 CIDR notation. Two subnets are defined: 192.168.1.0, addressing hosts from
    1 to 126, and 192.168.1.128, addressing hosts from 129 to 254. Each subnet loses
    two host addresses because each subnet uses the lowest address, 0 or 128, as the
    network address and uses the highest address, 127 or 255, as the broadcast address.
    Table 7.2 shows this in tabular form.


    Subnets 192.168.1.0 and 192.168.1.128 can be assigned to separate internal network
    interface cards. Each subnet contains two independent networks, each containing
    up 126 hosts.


    Table 7.2 Class C Network 192.168.1.0 Subnett into Two Subnets


    | Sub Name | None | 0 | 1 |

    |---|---|---||

    | Network address | 192.168.1.0 | 192.168.1.0 | 192.168.1.128 |

    | Network mask | 255.255.255.0 | 255.255.255.128 | 255.255.255.128 |

    | First host address | 192.168.1.1 | 192.168.1.1 | 192.168.1.129 |

    | Last host address | 192.168.1.254 | 192.168.1.126 | 192.168.1.254 |

    | Broadcast address | 192.168.1.255 | 192.168.1.127 | 192.168.1.255 |

    | Total hosts | 254 | 126 | 126 |'
