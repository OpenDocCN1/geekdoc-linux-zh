    # Transport Mechanisms


    Internet Protocol defines a Network-layer protocol of the OSI model. There are
    also other Network-layer protocols, but I will be concentrating solely on IP because
    it is by far the most popular Network-layer protocol in today. Above the Network
    layer on the OSI model is the Transport layer. As you might expect, the Transport
    layer has its own set of protocols. Two of the Transport-layer protocols are of
    interest: UDP and TCP. This section examines each of these protocols.


    # UDP


    UDP, or User Datagram Protocol, is a connectionless protocol used for such services
    as DNS queries, SNMP, and RADIUS. Being connectionless, UDP is akin to a “fire
    and for-get” type of protocol. The client sends a UDP packet, sometimes referred
    to as a datagram, and assumes that the server will receive the packet. It''s up
    to a higher-layer protocol to assemble the packets in order. The UDP header, shown
    in Figure 1.4, is 8 bytes in length.

    The UDP header begins with the source port number and the destination port number.
    Next is the length of the entire packet, including data. Obviously the header
    itself is 8 bytes in length, the minimum value for this portion of the header
    is 8. The final portion of the UDP header is the checksum, which includes both
    the header and the data.


    # TCP


    TCP, an abbreviation for Transmission Control Protocol, is a connection-oriented
    protocol that is frequently used with IP. Referring to TCP as connection oriented
    means that it provides reliable service to the layers above it. Recall the telephone
    conversation analogy


