    # LAN Security Issues


    Security issues are largely dependent on the size of the LAN, its architecture,
    and what it''s used for. The services and architecture are also influenced by
    the public IP addressing available to the site. Perhaps even more basic than that
    the type of Internet connection the site has: dial-up, DSL, wireless, cable, satellite,
    ISDN, leased line, or any of the other'
