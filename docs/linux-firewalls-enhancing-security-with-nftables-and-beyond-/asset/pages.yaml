    As you can see from these entries, there are some additional items that can help
    to well, classify and prioritize the alerts. Both the classification and the priority
    can be configured within the alert log file.


    # Receiving Alerts


    I recommend working with Snort to gain experience with rules and configuration
    options before sending alerts to email or via other methods. You might find yourself
    overwhelmed by alerts the default Snort rules, depending on your network layout.


    Recall from Chapter 11 that log file-monitoring software was introduced and a
    recipe for using Swatch to monitor log files for certain events, at which time
    it would send an email on the alert. If you see where I am going with this, congratulations!


    # Using Swatch to Monitor for Snort Alerts


    With its default configuration, Snort logs to /var/log/snort/alert. Therefore,
    creating a Swatch configuration to monitor this file is quite easy. Again, it
    would be best to overwhelm yourself or the system with alerts from Swatch, so
    you should use caution when configuring any actions based on Snort alerts until
    you''ve had a chance to configure Snort.


    Recall that Snort logs some prioritization data within /var/log/snort/alert. There,
    you could set up a Swatch to watch for alerts with a certain priority, say 3,
    for example, and send an email when that''s seen. This would be placed within
    your Swatch configuration file which, by default, is ~/.swatchrc. Here''s the
    configuration entry:


    ```

    watcher /Priority: 3/

    ```


    mail'
