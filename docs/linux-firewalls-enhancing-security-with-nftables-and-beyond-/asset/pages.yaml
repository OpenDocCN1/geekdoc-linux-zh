- pgno: 49
  md: 'MAC address filtering is not common on Internet-connected firewalls. Using
    MAC filtering, the firewall blocks or allows only certain MAC addresses. However,
    in likelihood you see only one MAC address, the one from the router upstream from
    your firewall. This means that every host on the Internet will appear to have
    the same MAC address as far as your firewall can. A common error among new firewall
    administrators is to attempt to use MAC filtering on an Internet firewall.


    Using a hybrid of the TCP/IP reference model, a packet-filtering firewall functions
    at the Network and Transport layers, as shown in Figure 2.1.


    The overall idea is that you need to very carefully control what passes between
    the Internet and the machine that you have connected directly to the Internet.
    On the network interface, you individually filter what''s coming from the outside
    and what''s going out from the machine explicitly and as possible.


    For a single-machine setup, it might be helpful to think of the network interface
    as an I/O pair. The firewall independently filters what comes in and what goes
    out through the interface. The input filtering and the output filtering can, and
    likely do, have complete different rules. Figure 2.2 depicts processing for rules
    in a flowchart.


    This sounds pretty powerful, and it is; but it isn''t a sure security mechanism.
    Its only part of the story, one layer in the multilayered approach to data security.
    Not all application communication protocols themselves to packet filtering. This
    type of


