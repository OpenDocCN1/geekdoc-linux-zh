- pgno: 154
  md: '# Chapter 5 Building and Installing a Standalone Firewall


    FTP deviates from this standard TCP, client/server communication model. FTP relies
    on two separate connections, one for the control or command stream, and one for
    passing the data files and other information, such as directory listings. The
    control stream is carried over a traditional TCP connection. The client binds
    to a high, unprivileged port and sends a connection to the FTP server, which is
    bound to port 21. This connection is used to pass commands.


    In terms of data stream connection, FTP has two alternative modes for exchanging
    data between a client and a server: port mode and passive mode. Port mode is the
    old, default mechanism. The client tells the secondary, unprivileged port it will
    listen on. The server initiates the data connection from port 20 to the unprivileged
    port the client specified.


    This is the deviation from the standard client/server model.The server is initiating
    the secondary connection back to the client. This is why FTP is a protocol that
    requires ALG support for both the firewall and NAT.The firewall must account for
    an incoming connection from port 20 to a local unprivileged port. NAT must account
    for the destination address used for the secondary data stream connection.(The
    client has no knowledge that its network traffic is NATed.The port and address
    it sent the server were its local


    Passive mode is similar to the traditional client/server model in that the client
    initiates the secondary connection for the data stream. Again, the client initiates
    the connection from a high, unprivileged port. The server isn''t bound to port
    20 for the data connection, Instead, the server tells the client which high, unprivileged
    port the client should address the connection request to.The data stream is carried
    between unprivileged ports on both the client and the server.


    In terms of traditional packet filtering, the firewall must allow TCP traffic
    between all unprivileged ports. Connection state tracking and ALG allow the firewall
    to associate the secondary connection with a particular FTP control stream. NAT
    isn''t an issue on the client side because the client is initiating both connections.


    # Allowing Outgoing Client Access to Remote FTP Servers


    It''s almost given that most sites will use FTP access to remote file repositories.
    Most people will want to enable outgoing client connections to a remote server.


    # FTP Requests over the Control Channel


    The next rules allow an outgoing connection to a remote FTP server:


    ```

    if [ "CONNECTION_TRACKING" = "1" ]; then

    $IPT -A OUTPUT -o INTERNET -p tcp \

    n  -s IPADDR --sport $UNPRIVPORTS \

    n  --dport 21 -m state NEW -j ACCEPT

    ```


    ```

    $IPT -A OUTPUT -o INTERNET -p tcp \

    n  -s IPADDR --sport $UNPRIVPORTS \

    n  --dport 21 -j ACCEPT

    ```'
