  md: "# Chapter 5 Building and Installing a Standalone Firewall\n\n# Allowing DNS\
    \ Lookups as a Client\n\nThe DNS resolver client isn't a specific program. The\
    \ client is incorporated into the network library used by network programs. When\
    \ a hostname requires a lookup, the resolver requests the lookup from a DNS server.\
    \ Most computers are configured only as a DNS client. The server runs on a remote\
    \ machine. For a home user, the server is usually a machine owned by their ISP.\n\
    \nAs a client, the assumption is that your machine is not running a local DNS\
    \ server; if it is, you should ensure that you actually run the name server. There's\
    \ no need to run extra services! Each client lookup goes through the resolver\
    \ and is then sent to one of the remote name servers configured in /etc/resolv.conf.\
    \ In general, it's better to install the client rules even if a local server is\
    \ used.You'll avoid confusing problems that could crop up at some point.\n\nThese\
    \ rules must be installed in the firewall tables before any other rules fully\
    \ specify by host, rather than by IP address, unless the remote host has an entry\
    \ in the local /etc/hosts file.\n\nDNS sends a lookup as a UDP datagram:\n\n```\n\
    NAMESERVER=\"my.name.server\"\nif [$CONNECTION_TRACKING = \"1\" ]; then\n  $IPT\
    \ -A OUTPUT --o INTERNET -p udp \\\n  -s $IPADDR --sport $UNPRIVPORTS \\\n  -d\
    \ $NAMESERVER --dport 53 \\\n  -m state --state NEW -j ACCEPT\n```\n\nfi\n\n```\n\
    $IPT -A OUTPUT --o INTERNET -p udp \\\n  -s $IPADDR --sport $UNPRIVPORTS \\\n\
    \  -d $NAMESERVER --dport 53 -j ACCEPT\n\n$IPT -A INPUT --i INTERNET -p udp \\\
    \n  -s $NAMESERVER --sport $UNPRIVPORTS \\\n  -d $IPADDR --dport 53 -j ACCEPT\n\
    ```\n\nThe nft rules look like this:\n\n+   $nft add rule filter out $INTERNET\
    \ saddr $IPADDR udp sport $UNPRIVPORTS\nip saddr $NAMESERVER dport 53 state new\
    \ accept\n$nft add rule filter input if $INTERNET daddr $IPADDR udp dport $UNPRIVPORTS\n\
    ip saddr $NAMESERVER dport 53 count accept\n\nIf an error occurs because the returned\
    \ data is too large to fit in a UDP datagram, the DNS client retries using a TCP\
    \ connection.\n\nThe next two rules are for the rare occasion when the lookup\
    \ response won't fit in a DNS UDP datagram. In day-to-day operations, you could\
    \ run your system without problems on month end without the TCP rules. Unfortunately,\
    \ every often your DNS lookup hangs without these rules. More typically, these\
    \ rules are used by a secondary name server requesting a zone transfer from its\
    \ primary name server:"
