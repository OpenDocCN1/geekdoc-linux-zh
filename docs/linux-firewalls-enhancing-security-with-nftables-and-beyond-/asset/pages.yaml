    $nft rule filter input if $INTERNET ip saddr $CLASS_B drop

    $nft add rule filter input if $INTERNET ip saddr $CLASS_C drop

    $nft add rule filter input if $INTERNET ip saddr $LOOPBACK drop


    Because loopback addresses are assigned to an internal, local software interface,
    any packet claiming to be from such address is intentionally forged.

    With addresses set aside for use in private LANs, routers are not supported to
    forward packets originating from the loopback address range. A router cannot forward
    a packet with a loopback destination address.


    The two rules use primarily to log matching packets. The default policy is to
    drop everything. As so, broadcast addresses are dropped by default and must be
    explicitly defined if they are:


    # Refuse malformed broadcast packets

    $IPT -A INPUT -i $INTERNET -s $BROCAST_DEST -j LOG

    $IPT -A INPUT -i $INTERNET -s $BROCAST_DEST -j DROP


    $IPT -A INPUT -i $INTERNET -d $BROCAST_SRC -j LOG

    $IPT -A INPUT -i $INTERNET -d $BROCAST_SRC -j DROP


    The first pair of rules logs and denies any packet claiming to come from 255.255.255.255,
    the address reserved as the broadcast destination address. A packet will never
    legitimately originate from 255.255.255.255.


    The second pair of rules logs and denies any packet directed to destination address
    0.0.0.0, the address reserved as a broadcast source address. Such a packet is
    not a mistake; it is a specific probe intended to identify a UNIX machine running
    network software derived from BSD Because UNIX operating system kernel code is
    derived from BSD, this probe is effectively intended to identify machines running
    UNIX.


    ```


    $nft add rule filter input if $INTERNET ip saddr $BROCAST_DEST log limit

    ➡ rate 3/second drop

    $nft add rule filter input if $INTERNET ip saddr $BROCAST_SRC log limit

    ➡ rate 3/second drop

    ```'
