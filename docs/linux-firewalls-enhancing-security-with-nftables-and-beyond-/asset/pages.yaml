- pgno: 259
  md: '# Intrusion Detection and Response


    You''ve built a firewall with Linux using iptables or nftables. The layered security
    approach includes both network- and host-based security. Where the firewall provides
    security for both the network and the hosts, there are also steps that must be
    taken on the firewall machine itself, as well as on the hosts/root within the
    network. Whether it takes the form of filesystem integrity checking, virus/rootkit
    scanning, or monitoring the network for suspicious activity, these processes help
    ensure that your data remains safe.


    This chapter is about host and network security and intrusion detection. The goal
    of the chapter is to provide a high-level overview of some of the concepts that
    you can do further research into the specific areas of interest. The chapter widens
    the scope beyond that of the firewall machine to include the security of the network,
    as well as suggestions for individual computers within the network.


    # Detecting Intrusions


    How do you know you''ve been attacked successfully? Administrators and intrusion
    analysts have posed that question for a long time.The methods used for detecting
    attacks could be more art than science. Luckily, various tools are now available
    to make intrusion detection much more science than art.


    With that, the primary tool for intrusion detection still remains a human who
    can gather data from a number of sources and make an intelligent, educated decision
    about the meaning of the data. The current tools are sophisticated and can perform
    some of this correlation themselves, but the true worth of an intrusion analyst
    is proven in the ability to assess the situation and present likely causes and
    effects.


    Many times, an attack is detected when a service outage is reported. In this way,
    it''s important to actively monitor your services using a package such as Nagios.
    By actively monitoring as many services as possible, you can quickly spot an anomaly
    that warrants further investigation.


    If you run a web server, rather than monitoring merely the server is listening
    (usually on TCP port 80) you should monitor specific text on one or more web pages.
    If you'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# Chapter 11 Intrusion Detection and Response


    monitor only the state of the server and it''s listening, you won''t catch a defacement
    of the website. In essence, you should monitor the behavior of the specific services
    to ensure that they are running as expected rather than making sure that they
    are merely running.


    It’s important to monitor resources such as disk space, memory usage, and load
    average. Monitoring these resources can indicate if a process has run away and
    is consuming too many resources (as might be the case with a poorly written exploit).
    Additionally, monitoring disk space is another useful tool. If you normally consume
    25% of the disk and suddenly the disk usage jumps to 85%, you’ll want to investigate
    whether an attacker is using the server as a drop point for files.


    Basic service monitoring, performed as much as you can, as often as you can, will
    provide an early warning of anomalies. Monitoring services will also help improve
    the reliability of the services, all security considerations aside. Monitoring
    should not, however, replace intrusion detection tools like Snort or Suricata,
    nor replace a good security policy implemented through an in-depth strategy.


    After an anomaly has been noted, through normal service monitoring or through
    another means, it’s up to you to investigate the anomaly. Your investigation should
    conform to the security policy you have in place. One of the first responses would
    be to determine whether an intrusion has actually taken place. There could be
    many reasons why the load just spiked or why the disk usage increased, you shouldn’t
    assume that an attack has happened merely because of an outage.


    # Symptoms Suggesting That the System Might Be Compromised


    Often, successful attackers will try to hide their tracks, and therefore simple
    service monitoring wont be of assistance. The attackers might be far more skillful
    at hiding their tracks than you are at tracking down anomalous states.


    Linux systems are too diverse, customizable, and complicated to define an ironclad,
    fully comprehensive list of definitive symptoms proving that the system is compromised.
    With any kind of detective or diagnostic work, you must look for clues for where
    can—as systematically as you can. RFC 2196, “Site Security Handbook,” provides
    a list of signs to check for. Though unmaintained, the “Steps for Recovering from
    a UNIX or NT System Compromise,” available from CERT at http://www.cert.org/historical/tech_tips/win-unix-system_compromise.cfin?,
    provides another list of anomalies to check for.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# Symptoms Suggesting That the System Might Be Compromised 239


    The following sections incorporate and extend the ideas found in both lists, including
    all or of their points in one or another. The anomalies are roughly categorized
    into the following: indications related to the system logs; changes to the system
    configuration; changes related to the filesystem, file contents, file access permissions,
    and file size; changes to user accounts, passwords, and user access; problems
    indicated in the security audit reports; and unexpected performance degradation.
    The anomalous indications often cross category boundaries.


    # System Log Indications


    System logs include unusual error and status messages in the logs, truncated log
    files, and emailed status reports:


    +   **System log files**—Unexplained entries in the system log files, shrinking
    log files, and missing log files contain everything that is wrong. For example,
    `/var/log/messages` contains the majority of the system log information on most
    Linux systems. If that log is zero-sized or is missing large partitions, additional
    investigation is warranted.


    +   **Daemon status reports**—Instead of (or in addition to) writing to the log
    files, some daemons as crond send reports in email. Having unusual or missing
    reports suggests that something is not right.


    +   **Anomalous console and terminal messages**—Unexplained messages, possibly
    to announce the hacker''s presence, during a login session are obviously suspicious.


    +   **Repeated access attempts**—Ongoing login attempts or illegal file access
    attempts through FTP or a web server, particularly attempts to subvert a web application,
    are suspicious when the attempts are persistent, or if the attempts appear to
    end in repeated failure.


    # System Configuration Indications


    System configuration indications include modified configuration files and system
    scripts, unintended processes running inexplicably, unexpected service port usage
    and assignments, and changes in network device operational status:


    +   **cron jobs**—Check the cron configuration scripts and executables for modification.


    +   **Altered configuration files**—A filesystem integrity check, manual or using
    a tool as described in Chapter 14, "Filesystem Integrity," would indicate changed
    configuration files in `/etc/`. These files are critical to proper system functioning.
    Any change to a file (such as in `/etc/`, like `/etc/passwd`, `/etc/group`, and
    similar files) is important to check.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# Chapter 11 Intrusion Detection and Response


    +   * Unexpected services and processes, as shown by ps—Unexpectedly running programs
    are a bad sign. Be aware that as part of the attack, the ps command itself may
    have been replaced. More on this later.


    +   * Unexpected connection and unexpected port usage, as shown by netstat or
    tcpdump—Unexpected network traffic is a bad sign.


    +   * System crashes and missing processes—System crashes, as well as unexpected
    server crashes, may be suspect. A system crash can also suggest an attacker-initiated
    system reboot, which could be necessary to restart certain critical system processes
    after replacement with a trojan version.


    +   * Changes in device configuration—Reconfiguring the network interface to be
    promiscuous or debug mode is a sign that a packet sniffer is installed.


    # Filesystem Indications


    Filesystem indications include new files and directories, missing files and directories,
    altered file contents, md5 or shalum mismatches, setuid programs, and rapidly
    growing or overflowing filesystems:


    +   * New files and directories—Besides files with sudden bad signatures, you
    might discover new files and directories. Especially suspicious filenames starting
    with one or more dots and legitimate-sounding filenames appearing in unlikely
    places.


    +   * setuid and setgid programs—New setuid and newly setgid files, are a good
    place to start looking under the hood for problems.


    +   * Missing files—Missing files, particularly log files, indicate a problem
    of some kind.


    +   * Rapidly growing filesystem sizes, as shown by df—If the machine is compromised,
    rapidly growing filesystems may be a sign of a hacker’s monitoring program producing
    large log files.


    +   * Modified public file archives—Check the contents of your web and FTP archives
    for new or modified files.


    # User Account Indications


    User account indications include new user accounts, changes to the password file,
    unusual activity in the user process accounting or missing process accounting
    reports, changes to user files—especially environmental files—and loss of account
    access:


    +   * New and modified user accounts—New accounts in /etc/passwd and processes
    under new or unexpected user IDs by ps are indications of new accounts. Accounts
    with suddenly missing passwords indicate an open account.


    +   * User accounting reports—Unusual user accounting reports, inexplicable logins,
    missing or edited log files (such as /var/log/lastlog, /var/log/pacct, or /var/log/usracct),
    and irregular user activity are signs of trouble.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# What to Do Your System Is Compromised


    +   - Changes to root or user accounts—A serious sign is a user''s login environment
    that has been modified or damaged to the point that the account is inaccessible.
    Of particular concern are changes to users'' PATH environment variable or ssh_keys.


    +   - Loss of account access—Similar to changes to a user''s login environment
    is intentional access denial, whether by changing the account password, removing
    the account, or for regular users, by changing the runlevel to single-user mode.


    # Security Audit Tool Indications


    Security audit tools indicate filesystem integrity mismatches, file size changes,
    changes to file permission bits, setgid programs, alerts from intrusion detection
    tools as Snort, and service-monitoring data.


    Files with mismatched hash signatures can be files, whose lengths or creation
    or modification dates have changed, and files whose access modes are altered.
    Of particular concern are newly installed trojan programs. Frequent targets for
    replacement are managed by inet or xinetd, inet or xinetd itself, ls, ps, netstat,
    ifconfig, telnet, login, us, ftp, du, sync, and the libc library.


    # System Performance Indications


    System performance indications include unusually high load averages and heavy
    access.


    Unexplained, poor system performance could be caused by unusual process activity,
    unusually high load averages, excessive network traffic, or heavy filesystem access.
    If your system shows signs of a successful compromise, don''t panic. Don''t reboot
    the system—important information could be lost. Simply physically disconnect the
    system from the Internet.


    # What to Do If Your System Is Compromised


    Regardless of how an anomaly is investigated, the intrusion analyst must take
    care when performing the investigation. If attackers notice that there''s an investigator
    looking around the same system, it is much more likely they will slash and burn
    their way out of the system. If an attacker thinks he she is being followed or
    monitored, the attacker might be deleting anything and everything in the way,
    causing real damage to the systems in question. An attack that might have resulted
    in only a defacement of a website might suddenly turn into deletion of entries
    if the attacker notices the investigation.


    After it has been determined that there has been a successful attack or that an
    attack is currently under way, a number of responses frequently occur. These will,
    of course, be dependent on your security policy.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# Chapter 11 Intrusion Detection and Response


    If storage space is available, take a snapshot of the entire system in its current
    state for later analysis. If that isn''t an option for you, at least snapshot
    the system logs under /var/log and the system configuration files under the /etc
    directory.


    Keep a log. Write down everything. Documenting what you do and what you find not
    only is good for reporting the incident to a response team, your ISP, or a lawyer
    but also keep track of what you''ve examined and what remains to be done.


    If an attack has occurred or is currently under way, one of the first priorities
    is usually to stop the attack and prevent further damage from occurring. Keeping
    in mind that an attacker who notices an investigator on the same system is more
    likely to cause collateral damage, unplugging the system from the network is a
    common recommendation. With the network cable unplugged, the attacker simply can''t
    cause additional damage. It is, of course, the possibility that the attacker will
    be using a tool to monitor the network interface and automatically cover or her
    tracks should that interface''s status change. Attackers may have set upon a cron
    job to restart their daemons if they are stopped. In addition, it is typical for
    attackers to replace Linux utilities such as ls and ps with their own versions
    in order to hide their processes and files. In this regard, a program as Chrootkit
    can be helpful for detecting hot-based intrusions.


    The tools you use to mitigate damage will be determined by the type of attack.
    For example, a denial-of-service attack against a router will necessarily require
    different steps to mitigate the attack. The steps you might take to determine
    whether the system is compromised are the same steps to take in analyzing the
    compromised system:


    +   1. Check the system logs using netstat and lsof to see which processes are
    running and which ports are bound. Check the contents and access modes of all
    your files and directories by checking their digital signatures. Check for setuid
    programs. Configure and user files for clean backup copies. It''s very likely
    that the attacker installed trojan programs in place of the very system tools
    you''re using to analyze the system.

    2. Take stock of any volatile information, such as which processes are running
    and which ports are in use.

    3. Boot off an external drive or a backup copy of the system. Examine the system
    using the clean tools from the unaffected system. As an alternative, install the
    disk as secondary drives in a noncompromised system, and examine the disks as
    data.

    4. Determine how the attacker succeeded in gaining entry, and determine what was
    done to your system.

    5. If possible, completely reinstall the system from the original Linux distribution
    media.

    6. Correct the security vulnerability, whether by making a more careful selection
    of services to run, by reconfiguring servers more securely, by defining access
    lists at the'
