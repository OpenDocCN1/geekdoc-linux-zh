- pgno: 376
  md: 'filter, firewall A firewall packet-filtering rule defining the characteristics
    of the packet’s IP and transport handlers, if matched, determines whether the
    packet is be allowed through the network interface or is to be dropped. Filters
    are defined in terms of such fields as a packet’s source and destination addresses,
    source and destination ports, protocol type, TCP connection state, and ICMP message
    type.


    **finger** A user information lookup program.


    firewall A device or group of devices that enforces an access control policy between
    networks.


    firewall, bastion Frequently, a firewall that has two or more network interfaces
    and is the gateway or connection point between those networks, most typically
    between a local site and the Internet. Because a bastion firewall is the single
    point of connection between networks, the bastion is secured to the greatest extent
    possible. More generally, a bastion is a firewall that removes sites have direct
    access to, whether that host connects networks or protects a server that provides
    services.


    firewall, choke A LAN that has two or more network interfaces and is the gateway
    or connection point between those networks. One connects to a DMZ perimeter network
    between the choke firewall and a bastion gateway firewall. The other network interface
    connects to an internal, private LAN.


    firewall, dual-homed A single-host, gateway firewall that requires local users
    to specifically connect to the firewall machine to access the Internet or all
    remote services accessible to the site. In a dual-homed gateway firewall system,
    no traffic is allowed to pass between the LAN and the Internet.


    firewall, screened-host Almost identical to a dual-homed firewall, the single-host-firewall
    does not sit directly from the Internet and the local network. The screenedhost
    is separated from the public network by an intermediate router and a packet filter.
    Local users must either specifically connect to the firewall machine to access
    the Internet or through proxies on the firewall machine. The screening ensures
    that all traffic between networks, or at least specific kinds of traffic, goes
    through the screened host. The difference between the screened-host firewall and
    the dual-host firewall is primarily in the location of the firewall within the
    local network.


    firewall, screened-subnet A firewall system incorporating a gateway firewall,
    a DMZ network hosting public servers, and an internal choke firewall that secures
    the LAN from both the DMZ and Internet access. Public services are not hosted
    from the choke firewall.


    **flooding, packet** A denial-of-service attack in which the victim host or network
    is sent more packets of a given type than the network can accommodate.


    **forward** To route packets from one network to another in the process of delivering
    a packet from one computer to another.'
  merge: -1
  img_proc: true
- pgno: 377
  md: '# Appendix C Glossary 355


    fragment An IP packet containing a piece of a TCP segment.


    FTP File Transfer Protocol. The protocol and programs used to copy files between
    net-worked computers.


    FTP, anonymous FTP service accessible to any client that requests the service.


    FTP, authenticated FTP service accessible to predefined accounts, which must be
    authenticated before using the service.


    gateway A computer or program serving as the conduit or the termination point
    and relay between networks.


    hosts.allow, hosts.deny TCP wrappers'' configuration files are for /etc/hosts.allow
    and /etc/hosts.deny.


    HOWTO In addition to the standard man pages, Linux includes user-supplied online
    documentation on numerous topics, in many languages and in multiple formats. HOWTO
    documents are coordinated and maintained by the Linux Documentation Project.


    HTTP Hypertext Transfer Protocol, used by web servers and browsers.


    hub A hardware signal repeater used to physically connect multiple network segments,
    extend the distance of a physical network, or connect network segments of different
    physical types.


    IANA Internet Assigned Numbers Authority.


    ICMP Internet Control Message Protocol. A Network-layer IP status and control
    message.


    inetd The user authentication (AUTH) server.


    IMAP Internet Message Access Protocol, used to retrieve mail from hosts running
    an IMAP server.


    inetd A network server that listens for incoming connections to services ports
    by servers that it manages. When a connection request arrives, inetd starts a
    copy of the request server to handle the connection. By default, inetd has been
    replaced by an extended version called xinetd.


    IP datagram An IP Network-layer packet.


    ipchains With the introduction of the new implementation of the IPFW firewall
    mechanism in Linux, the firewall administration program that replaced ipfwadm.
    iptables is supplied with an ipchains compatibility module for sites that want
    to continue using their existing firewall scripts.


    IPFW IP firewall mechanism, now replaced by Netfilter.'
