- pgno: 302
  md: 'Chapter 13 Network Monitoring and Attack Detection


    # Attacks through the Eyes of TCPDump


    You''ve seen what normal TCP and UDP packet traces like through TCPDump, but how
    will you know whether someone or something is acting abnormally? Unfortunately,
    buried in normal packet traces may be signs that someone is attempting an attack
    on your server. An attacker will obviously attempt to disguise his or her activity,
    making detection even more difficult. Not only do you have to wade through all
    the normal traffic within a packet trace, but then you have to search for the
    proverbial needle in a haystack to find what may be an attack event or one in
    progress.


    Recall from Chapter 11, "Intrusion Detection and Response," that not everything
    that falls outside of normal activity can be an attack. Some of it is the result
    of malfunctioning or misconfigured equipment. More than not, abnormal activity
    spotted in a packet trace is due to reconnaissance of one form or another. The
    large majority of reconnaissance work is done through automation. Rather than
    spending many hours searching for a target, attackers will automate the process
    and have the program alert them when it finds an interesting host.


    There are naturally exceptions to the rule of automation. Attacks are the result
    of directed activity against your server or network. Before there is usually some
    manual reconnaissance that takes place. This may include the would-be attacker
    manually crafting or creating packets to exploit holes in your server or network.
    More than not, however, the attacker will have some automated reconnaissance data
    that is his or her efforts in your direction. If an automated scan alerted the
    attacker that one of your servers may vulnerable to a particular type of attack,
    you may find the hosts or your entire subnet within the sights of the attacker.


    Leaving a host vulnerable or a honeypot appear vulnerable and then observing the
    attacks is the premise behind a honeypot. A honeypot is a host or device that
    shows up as vulnerable to an attacker and thus looks like a target for them. The
    idea is that by watching the methods that attackers use to exploit a hole or watching
    what they do when they compromise the host, the observer can learn from it and
    defend against such activity.


    As if all possible reasons for seeing abnormal activity aren''t enough, here''s
    one more: you''ll encounter accidental connections that may appear to be attacks.
    In other words, at times someone simply mistypes an IP address when attempting
    to connect to him or her server. Anyone who has ever wondered the telephone phone
    only to find out that the caller dialed incorrectly can relate to this situation.


    In summary, there are some basic categories within which abnormal activity might
    fall:


    +   Automated or semiautomated reconnaissance scan


    +   Directed attack


    +   Misconfigured equipment'
  merge: -1
