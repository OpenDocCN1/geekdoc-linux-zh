    \   if $int_internet ip saddr $net_class_e drop\n        if $int_internet ip saddr\
    \ $net_loopback drop\n        if $int_internet ip saddr $subnet_external drop\n\
    \    }\n}\n```\n\n# Enabling DNS Traffic\n\nThe rules identify DNS traffic comes\
