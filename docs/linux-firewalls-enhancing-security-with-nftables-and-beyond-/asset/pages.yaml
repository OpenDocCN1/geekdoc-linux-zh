- pgno: 208
  md: "# 186 Chapter 7 Packet Forwarding\n\nThe forwarding and the internal interface\
    \ rules could be as service specific as the external interface rules in Chapter\
    \ 5. In today's world, the internal interface and forward-rules should be specific.\
    \ The rules in this section merely lay the groundwork, introducing the forwarding\
    \ rules rules.\n\n# LAN Access to Other LANs: Forwarding Local Traffic among Multiple\
    \ LANs\n\nIf the machines on your LAN, or on multiple LANs, require routing among\
    \ themselves, you need to allow access among the machines for the service ports\
    \ that they require, unless they have alternative internal paths. In the former\
    \ case, any local routing between LANs would be done by the firewall.\n\nThe assumption\
    \ in this section is that there is a gateway firewall with two network interfaces,\
    \ an internal choke firewall with two network interfaces, and the LAN private\
    \ network. This is the setup shown earlier in Figure 7.1. Traffic between the\
    \ LAN and the Internet crosses through the DMZ network between the choke and gateway\
    \ firewalls.\n\nThis example renames the internal network interface on the gateway\
    \ as DMZ_INTERFACE. Another contrast is needed for the firewall. The DMZ is defined\
    \ as Class C priority addresses ranging from 192.168.3.0 to 192.168.3.255:\n\n\
    ```\nDMZ_INTERFACE=\"eth0\"\nDMZ_ADDRESSES=\"192.168.3.0/24\"\n```\n\nThe first\
    \ two rules allow local access to the gateway host from the LAN. In practice,\
    \ the LAN would not be allowed access to all ports on the firewall. The second\
    \ two rules allow the firewall itself to access specific services offered in the\
    \ DMZ on a server-by-server basis. Again, a firewall in a larger setting would\
    \ have little or no reason to offer access services to the DMZ. In most cases,\
    \ the firewall host wouldn't offer any services to the LAN or the internet:\n\n\
    ```\n$IPT - INPUT -i $DMZ_INTERFACE -s $LAN_ADDRESSES -d $GATEWAY \\\n  -m state\
    \ --state NEW, ESTABLISHED, RELATED -j ACCEPT\n$IPT - OUTPUT -o $DMZ_INTERFACE\
    \ -s $GATEWAY -d $LAN_ADDRESSES \\\n  -m state --state ESTABLISHED, RELATED -j\
    \ ACCEPT\n$IPT - OUTPUT -o $DMZ_INTERFACE -s $GATEWAY -d $DMZ_ADDRESSES \\\n \
    \ -m state --state NEW, ESTABLISHED, RELATED -j ACCEPT\n$IPT - INPUT -i $DMZ_INTERFACE\
    \ -s $DMZ_ADDRESSES -d $GATEWAY \\\n  -m state --state ESTABLISHED, RELATED -j\
    \ ACCEPT\n```\n\nThe corresponding nftables rules:\n\n```\n$nft add rule filter\
    \ input i $DMZ_INTERFACE saddr $LAN_ADDRESSES d daddr \\\n$GATEWAY ct state new,\
    \ established, related accept\n$nft add rule filter output i $DMZ_INTERFACE saddr\
    \ $GATEWAY d daddr \\\n$LAN_ADDRESSES ct state established, related accept\n```"
