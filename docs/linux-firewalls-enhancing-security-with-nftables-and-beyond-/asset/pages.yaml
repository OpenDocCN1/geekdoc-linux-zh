- pgno: 328
  md: '# Chapter 14 Filesystem Integrity


    The output is much more verbose (as you would expect) and includes the functions
    being called within the AIDE program itself, as well as details on the files that
    AIDE is checking as it is checking them. Using this output can be invaluable when
    you''re trying to troubleshoot a problem with your AIDE configuration.


    # Defining Macros in AIDE


    Macros are used in AIDE to define commonly used objects and objects to be used
    as variables throughout an AIDE configuration file. You might use an AIDE macro
    to define the top-level directory to be used within the configuration. You would
    then use this macro within selection lines, and it would be substituted as a variable
    in that selection line. You may also use a macro to set a variable based on certain
    criteria. Macros can then be used within the AIDE configuration within control
    structures (decisional blocks of code) to alter the configuration of AIDE based
    on the decisional control structure.


    Macros are defined using the following syntax:


    ```

    @@define <definition>

    ```


    Macros can also be undefined with this syntax:


    ```

    @@undef <macro>

    ```


    Macros are used within the configuration with the following syntax:


    ```

    @@(<macro>)

    ```


    An example of using a macro in a simple way is to create a macro for a complex
    hierarchy so that you don''t have to type it into the configuration file multiple
    times. Assume that you have a certain structure of directories on the computer
    that you want to define a macro:


    ```

    @@define BASEDIR /usr/src/linux

    ```


    This macro could be used later within the configuration of selections for AIDE:


    ```

    @@$(BASEDIR)/.config R

    @@$(BASEDIR)/doc

    ```


    A more powerful use of macros involves changing the configuration based on some
    criteria. For example, macros can be used within two types of control structures,
    one based on whether the macro has been defined and the other on the host from
    which the AIDE program is running.


    These control structures are basically if/then/else statements, and they have
    associated negations as well. The syntax for determining whether a macro has been
    defined this is:


    ```

    @@ifdef <macro>

    ```


    The negation for the @@ifdef evaluation is as shown here:


    ```

    @@ifndef <macro>

    ```'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'For determining the current host, this is the syntax:

    @@ifhost <hostname>


    The negation for the @@ifhost evaluation is, as you might guess, the following:

    @@ifhost <hostname>


    Regardless of which control structure is used, it must be closed using this statement:

    @@endif


    Multiple control structures can be grouped using an else type of structure that
    you would expect for an associated if statement. The syntax is simply as follows:

    @@else


    Here''s an example of how each of these might be used. The first example checks
    to whether the macro called SOURCE has been defined and, if not, defines it:

    @@ifndef SOURCE

    @@define SOURCE /usr/src

    @@endif


    The second example looks at the hostname of the computer from which AIDE is being
    running and sets a macro based on the results of that check. This might help you
    if you have directory structures that differ among various hosts and you''d like
    to use only one common AIDE configuration file among them. Here''s the second
    example:

    @@ifhost cwa

    @@define LOCALBINDIR /usr/local/sbin

    @@endif


    Finally, here is an example using an else statement:

    @@ifhost cwa

    @@define LOCALBINDIR /usr/local/sbin

    @@else@define LOCALBINDIR /usr/local/sbin

    @@endif


    For all the examples, recall that you''d use these macros later within the configuration
    using the following syntax:

    @@(<macro>)


    # The Types of AIDE Checks


    You may be wondering about the different types of checks AIDE can perform. Some
    of the checks are described in Table 14.2. Note that this isn''t an exhaustive
    list and new options will likely be added over time.


    It''s probably helpful to break down the types of AIDE checks into categories.
    There are three basic categories of AIDE checks: what I will term structures,
    grouped checks, and checksums. The standard type of AIDE check looks for information
    that can be gathered from the file or the file''s descriptor. These checks are
    listed in Table 14.3.'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# Chapter 14 Filesystem Integrity


    Table 14.2 AIDE Check Types


    | Directive | Description |

    | --- | --- |

    | p | Permissions |

    | ftype | File type |

    | i | inode |

    | n | Number of links |

    | l | Link name |

    | u | User |

    | g | Group |

    | s | Size |

    | b | Block count |

    | m | mtime |

    | a | atime |

    | c | ctime |

    | S | Check for growing size |

    | md5 | md5 checksum |

    | sha256 | sha256 checksum |

    | sha512 | sha512 checksum |

    | rmd160 | rmd160 checksum |

    | tiger | tiger checksum |

    | R | p+i+n+u+g+s+m+c+md5 |

    | L | p+i+n+u+g |

    | E | Empty group |

    | > | Growing logfile p+u+g+i+n+S |

    | haval | haval checksum |

    | gost | gost checksum |

    | crc32 | crc32 checksum |


    These standard checks utilize filesystem functions that are built in or native
    in Linux and can be found from the inode entry for the file. As giving a standard
    check is less resource intensive than a checksum check. Some of these checks lend
    themselves to create files, whereas others will cause the file to show up in a
    report nearly every time the check is run. For example, the ctime of a file should
    not change the file it is deleted or replaced with another.


    It may not be readily apparent what of the standard checks actually do. Table
    14.4 describes what may be the more obscure checks within this group.


    On the other hand, grouped checks combine some of the more commonly used standard
    checks, as described in Table 14.5.'
  merge: -1
  img_proc: true
- pgno: 331
  md: '# The Types of AIDE Checks


    Table 14.3 Standard Checks in AIDE


    | Directive | Description |

    | --- | --- |

    | p | Permissions |

    | i | inode |

    | n | Number of links |

    | u | User |

    | g | Group |

    | s | Size |

    | b | Block count |

    | m | mtime |

    | a | atime |

    | c | ctime |

    | S | Check for growing size |


    Table 14.4 Explanation of Some Standard Checks


    | Check Name | Explanation |

    | --- | --- |

    | inode | The *inode* is a data structure that holds information about a given
    file in Linux. The *inode* contains information such as the location of the file,
    the permissions, the owner and group information, and many other useful bits.
    |

    | Number of links | Links are akin to shortcuts in the Windows world. This type
    of check looks to see how many links exist to the given file. |

    | mtime | The *mtime* of a file is the time when the file was last modified. |

    | atime | The *atime* of a file is the time when the file was last accessed. |

    | ctime | The *ctime* of a file is the time when the file was created. |


    Table 14.5 Grouped Checks in AIDE


    | Directive | Definition |

    | --- | --- |

    | R | p+type+i+l+n+u+g+s+m+c+md5 |

    | L | p+type+i+l+n+u+g |

    | E | Empty group |

    | > | Growing logfile p+u+g+i+n+S |'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# Table 14.6 Checksum Checks in AIDE


    | Directive | Definition |

    | --- | --- |

    | md5 | md5 checksum |

    | shal | shal checksum |

    | sha256 | sha256 checksum |

    | sha512 | sha512 checksum |

    | rmd160 | rmd160 checksum |

    | tiger | tiger checksum |

    | haval | haval checksum |

    | gost | gost checksum |

    | crc32 | crc32 checksum |


    Finally, checksums utilize cryptographic checksums of the files, as explained
    earlier in the chapter and defined in Table 14.6.


    The differences in the various checksum check types can be explained simply as
    the differences in the cryptographic algorithms used to create the checksums.
    I''ll leave it to you to further research on the types of cryptographic algorithms
    used by AIDE. I recommend *Applied Cryptography*, by Bruce Schneider, as a great
    reference for this purpose.


    # Summary


    This chapter looked at filesystem integrity and how it can help your system security
    by ensuring that files haven''t been unexpectedly altered. The chapter began with
    a look at how checksums are used to check files. The chapter continued with an
    in-depth look at one filesystem integrity software package, AIDE. You saw how
    to install, configure, and use AIDE on your system.'
  merge: -1
  img_proc: true
