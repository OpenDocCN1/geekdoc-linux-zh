  md: "Chapter 11 Intrusion Detection and Response\n\n# To Whom Do You Report an Incident?\n\
    \nYou have a number of options in terms of whom you report an incident to:\n\n\
    +   - **root, postmaster, or abuse at the offending site**—The obvious place to\
    \ lodge a complaint is with the administrator of the offending site. Informing\
    \ the system administrator is often all that's required to take care of a problem.\
    \ This isn't always possible, though, many probes originate from spoofed, nonexistent\
    \ IP addresses.\n- **Network coordinator**—If the IP address doesn't have a DNS\
    \ entry, contacting the coordinator for the network address block is often helpful.\
    \ The coordinator can contact the administrator at the offending site or put you\
    \ in direct contact. If the IP address doesn't resolve through the *host* or *dig*\
    \ commands, you can almost always find the network coordinator by supplying the\
    \ *whois* databases. The *whois* command is hard-wired into the ARIN database.\
    \ Three major databases are available from the web:\n- ARIN—The American Registry\
