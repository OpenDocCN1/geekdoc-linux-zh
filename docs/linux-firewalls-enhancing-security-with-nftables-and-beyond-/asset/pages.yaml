- pgno: 19
  md: '# Preface


    Welcome to the fourth edition of Linux Firewalls. The book looks at what it takes
    to build a firewall using a computer running Linux. The material covered includes
    some basics of networking, IP, and security before jumping into iptables and nftables,
    the latest firewall software in Linux.


    A reader of this book should be running a Linux computer, whether standalone or
    as a firewall or Internet gateway. The book shows how to build a firewall for
    a single client computer such as a desktop and also shows how to build a firewall
    behind which multiple computers can be hosted on a local network.


    The final part of the book shows aspects of computer and network security beyond
    iptables and nftables. This includes intrusion detection, filesystem monitoring,
    and listening to network traffic. The book is largely Linux agnostic, meaning
    that just any popular flavor of Linux will work with the material with little
    or no adaptation.


    # Acknowledgments


    I''d like to thank my wife, family, and friends for their unending support. Thanks
    also to Robert P.J. Day and Andrew Prowant for reviewing the manuscript.'
  merge: -1
  img_proc: true
