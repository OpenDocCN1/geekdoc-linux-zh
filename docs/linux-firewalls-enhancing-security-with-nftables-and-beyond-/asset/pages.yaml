    ```


    # Rule Syntax


    Rules are where the action of filtering takes place.There are three commands when
    working with rules:


    +   - add—Add a rule.

    - insert—Prepend a rule on the chain, either at the beginning or at the location
    specified.

    - delete—Delete a rule.


    Within rules you specify the matching criteria for a given rule and a verdict
    or decision on what should happen to a packet matching rule. nftables and the
    rules created there use various statements and expressions to create the definition.

    ftables statements are similar to the statements for iptables and usually affect
    how the packet will be processed, either stopping processing, sending processing
    to another chain, or simply logging the packet. Statements and verdicts include
    the following:


    +   - accept—Accept the packet and stop processing.

    - continue—Continue processing the packet.'
