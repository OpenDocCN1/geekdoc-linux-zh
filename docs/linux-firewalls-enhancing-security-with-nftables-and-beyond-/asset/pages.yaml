    must understand the communication protocol for each service you enable. The deny-everything
    approach requires more work up front to enable Internet access. Some-commercial
    firewall products support only the deny-everything policy.


    The accept-everything policy makes it much easier to get up and running right
    away, but it forces you to anticipate every conceivable access type you won''t
    anticipate a dangerous access type until it''s too late, or you''ll later enable
    an insecure service without first blocking external access to it. In the end,
    developing a secure accept-everything firewall is much more work, much more difficult,
