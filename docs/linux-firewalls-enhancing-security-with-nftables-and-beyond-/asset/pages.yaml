    Subnetting allows for the creation of multiple internal networks, each containing
    different classes of client or server machines and each with its own independent
    routing. Different firewall policies can be applied to the networks.


    Of course, this example showed the network being divided into two portions. The
    network can be divided into many parts to create a number of smaller networks.
    It''s quite common to see a network with a subnet mask of 255.255.255.252 or /30
    between routers at two locations. Table 7.3 takes the process one step further
    and shows the same network divided into four subnets.


    # Selective Internal Access by Host, Address Range, or Port


    Traffic through a firewall''s internal interface can be selectively limited, just
    as traffic through the external interface is. For example, on a firewall for a
    small, residential site, rather than letting everything through the internal interface,
    traffic could be limited to DNS, SMTP, POP, and HTTP. In this case, let''s say
    that firewall machine provides these services for the LAN. Local machines are
    not allowed any access to outside services. In this case, forwarding is not allowed.


    > Point of Interest

    In this example, local hosts are limited to specific services: DNS, SMTP, POP,
    and HTTP. Because POP is a local mail retrieval service in this case, and because
    DNS, SMTP, and HTTP are proxies, no direct internet access is made by LAN clients.
    In each case, the local hosts are connecting to local servers. POP is a local
    service. The other servers establish connections on the behalf.


    This example would be used only by a small, likely residential, site. Placing
    the gateway and POP services on the firewall host can require the host to have
    user accounts. It is not necessary that these accounts login accounts, however.'
