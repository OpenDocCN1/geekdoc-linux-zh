- pgno: 311
  md: '# Automated Intrusion Monitoring with Snort 289


    With the groundwork done, it''s time to start Snort for the first time. If you''ve
    installed from your distribution''s package, it''s likely that you can start Snort
    through the normal run control mechanism, such as /etc/init.d/snort start. If
    you''ve compiled from source, you''ll need to start Snort manually and point to
    the location of your configuration file:


    ```

    /usr/local/bin/snort -c /etc/snort/snort.conf

    ```


    If you receive any errors, chances that there are missing files. Check the Snort
    source directory structure for the missing files and copy them to the appropriate
    location, based on your configuration file. If all goes well, you should see a
    message such as, near the end of the output:


    ```

    --- Initialization Complete ---

    ```


    As you can see, the prompt didn''t return. This is because Snort was not told
    to fork into daemon mode. Press Ctrl+C to kill Snort and add a -D to the command
    line. It should now look like this:


    ```

    /usr/local/bin/snort -c /etc/snort/snort.conf -D

    ```


    Snort will start again and this fork off into the background, returning you to
    the shell prompt. There is, of course, much more to Snort configuration than merely
    running it with the default options and rule sets. For more information on Snort
    configuration, refer to the Snort documentation.


    # Testing Snort


    With now running in the background, you can find /var/log/snort for you, and log
    entries will be placed there. However, I''m not one to assume things, especially
    about computer security. Therefore, to test the Snort installation I''ll use the
    handy ping3 tool to craft a packet and fire them to the running Snort.


    In this case, I''m just looking for verification that Snort is running and monitoring
    something. The default looks for bad packets, so crafting one of those should
    be trivial with ping3. From another host on the network (192.168.1.10), I ran
    the following


    ```

    ping3 -X 192.168.1.12

    ```


    The -X option allows an Xmas scan to run. Looking in /var/log/snort on the running
    Snort reveals that the alert file received some information, and there is also
    a new directory 192.168.1.10, which was the source of the packets. Inside directory
    are files corresponding to the packets I sent, the contents of which are here:


    ```

    **] BAD-TRAFFIC port 0 traffic [**]

    06/07-16:19:00.92 ID:48557 IpLen:20 DgmLen:40

    TCP TTL: 64 TOS:0x0 Seq:0x19268.1.2:0 -> 1.2:20

    *** Seq:0xED1609B Ack:0x3E89C3 CS:0x200 TcpWin: 20

    ==================================

    ```'
