    # Receiving Mail


    How you receive mail depends on your situation. If you run your own local mail
    server, you can collect incoming mail directly on your Linux machine. If you retrieve
    your mail from your ISP account, you may or not retrieve mail as a POP or IMAP
    client, depending on how you''ve configured your ISP email account, and depending
    on the delivery services the ISP offers.'
