- pgno: 315
  md: '# Summary 293


    In both of these ways, it''s possible to know virtually instantly a new host appears
    on the network. Such information would be helpful to the security administrator
    when monitoring for possible unauthorized use of a network.


    ARPWatch will run in the background as a daemon, silently (or ideally silently)
    going about its business and reporting back to you as needed. If for some reason,
    ARPWatch shuts off, because the machine rebooted, the existing entries will be
    written to a file called arp -name "arp.dat". If you need to find it, find / -name
    "arp.dat". If you need to restart ARPWatch''s monitoring database so it will "pick
    up" all the hosts on the network again, run these commands from the directory
    in which you locate ARPWatch:


    ```

    rm arp.dat

    touch arp.dat

    ```


    A tip about using ARPWatch: Make sure the ARPWatch data file, arp.dat, is monitored
    for unauthorized changes. If an attacker can alter this file and add his or her
    own entry the arp.dat,ARPWatch won''t alert you to the presence of the new host.
    Make sure that the arp.dat file is monitored by AIDE (covered in Chapter 14,"Filesystem
    Integrity") or through other similar means.


    # Summary


    This chapter showed you some of the tools used in intrusion detection. The goal
    was to provide you with some hands-on experience based on the concepts introduced
    in previous chapters. You learned about network sniffers in this chapter and focused
    specifically on TCPDump. Some packets and attack types were viewed through the
    eyes of TCPDump as well.


    Other tools introduced and discussed in this chapter included Snort, which provides
    an excellent intrusion detection system. Finally, using ARPWatch to monitor for
    new and unexpected ARP entries on the network was also discussed.


    The next chapter looks at filesystem integrity through the eyes of AIDE, a filesystem
    integrity checker.'
