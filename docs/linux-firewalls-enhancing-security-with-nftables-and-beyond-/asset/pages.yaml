- pgno: 375
  md: '# Appendix C Glossary


    performing some kind of computation on client-supplied data, or establishing human

    communication connections between two or more people.


    **daemon** A basic system services server running in the background.


    **DARPA** Defense Advanced Research Projects Agency.


    **Datalink layer** in the OSI reference model, the second layer, which represents
    point-

    tooint signal delivery between two adjacent network devices, such as the delivery

    of an Ethernet frame from a computer to an external router. (In the TCP/IP reference

    model, this functionality is included as part of the first layer, the subnet layer.)


    **default policy** A policy for a firewall rule set—whether for an INPUT chain,
    an OUTPUT

    chain, or a FORWARD chain in the filter table—that defines a packet''s disposition

    when the packet does not match any rule in the set. *See* accept-everything-

    default policy and deny-everything-by-default policy.


    **denial-of-service** (DoS) An attack based on the idea of sensing unexpected

    data or flooding a system with packets to disrupt or seriously degrade service,
    tie up

    local servers to the extent that legitimate requests can''t be honored, or in
    the worst

    case, crash a system or systems altogether.


    **deny-everything-by-default policy** A policy that silently drops all packets
    that don''t

    match a firewall rule in the chain. Most firewall rules are ACCEPT rules defining
    the

    exceptions to the DENY policy.


    **DHCP** Dynamic Host Configuration Protocol, which is used to dynamically assign
    IP

    addresses and provide server and router information to clients without registered
    IP

    addresses. DHCP was developed to replace BOOTP.


    **DMZ** The demilitarized zone, a perimeter network containing machines hosting
    public

    services, separated from a local, private network. The less secure public servers
    are iso-

    lated from the private LAN.


    **DNS** Domain Name Service, a global Internet database service providing hosting-

    to-IP and IP-to-host mapping.


    **DROP** A firewall-filtering rule to discard a packet without returning

    any notification to the sender. DROP is identical to DENY in earlier Linux firewall

    technologies.


    **dual-homed** A computer that has two network interfaces. *See also* multihomed.


    **dynamically assigned address** IP address temporarily assigned to a client network

    interface by a central server, such as a DHCP server.


    **Ethernet frame** Over an Ethernet network, IP datagrams are encapsulated in
    Ethernet

    rames.'
