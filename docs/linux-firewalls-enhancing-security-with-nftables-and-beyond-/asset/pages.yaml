- pgno: 378
  md: '# Appendix C Glossary


    **ipfwadm** Before the introduction of ipchains, the Linux IPFW firewall administration
    program. iptables is supplied with an ipfwadm compatibility module for sites that
    want to continue using their existing firewall scripts.


    **iptables** The firewall administration program beginning in the 2.4 series kernel.


    **klogd** The kernel logging daemon that collects operating-system error status
    messages from the kernel message buffers, and in conjunction with syslog, writes
    the messages to a system log file.


    **LAN** Local area network.


    **localhost** The symbolic name often given to a machine''s loopback interface
    in /etc/hosts.


    **loopback interface** A special software network interface used by the system
    to deliver locally generated network messages to the local machine, bypassing
    the hard-network interface and associated network driver.


    **man page** The standard Linux online documentation format. Manual pages are
    written for almost all user and system administration programs, as well as system
    calls, library calls, device types, and system file formats.


    **masquerading** The process of replacing an outgoing packet''s local source address
    with that of the firewall or gateway machine so that the LAN''s IP addresses remain
    hidden. In the IPFW firewall mechanism, masquerading referred to the source NAT
    functionality implemented in Linux. In Netfilter, masquerading refers to a specialized
    form of source NAT for use with connections that are dynamically assigned IP addresses
    that to change with each connection.


    **MD5** A cryptographic checksum algorithm used to ensure data integrity by creating
    digital signatures, called message digests, of objects.


    **MTU** Maximum Transmission Unit, the maximum packet size based on the underlying
    network.


    **multicast** An IP packet specially addressed to a Class D multicast address.
    Multicast clients are registered with the intermediate routers to receive packets
    addressed to a particular multicast address.


    **multihomed** A computer that has two or more network interfaces. *See also*
    dual-homed.


    **name server, primary** An authoritative server for a domain or a zone of the
    domain space. The server maintains a complete database of hostnames and IP addresses
    for this zone.


    **name server, secondary** A backup or peer to a primary name server.


    **NAT** Network Address Translation, the process of replacing a packet''s source
    or destination address with that of some other network interface. NAT is primarily
    intended to'
  merge: -1
  img_proc: true
- pgno: 379
  md: '# Appendix C Glossary


    allow traffic between incompatible network address spaces, such as between the
    Inter- and a LAN that is assigned private addresses internally.


    **Netfilter** The firewall mechanism included beginning with the Linux 2.4 kernel.


    **nft** The administration program for an nftables firewall.


    **nftables** The firewall mechanism included beginning with the Linux 3.13 kernel.


    **netstat** A program that reports various kinds of network status based on the
    various network-related kernel tables.


    **Network layer** In the OSI reference model, the third layer, which represents
    end-to-end communication between two computers, such as routing and delivery of
    an IP data from a source computer to some external destination. In the TCP/IP
    reference model, this is referred to as the second layer, the Internet layer.


    **NFS** Network File System, used to share filesystems with networked computers.


    **Nmap** A network security auditing (that is, port-scanning) tool that includes
    many of the newer scanning techniques in use today.


    **NNTP** Network News Transfer Protocol, used by Usenet.


    **NTP** Network Time Protocol, used by `ntpd` and `npdate`.


    **OSI (Open System Interconnection) reference model** A seven-layer model developed
    by the International Organization for Standardization (ISO) to provide a framework
    or guide for network interconnection standards.


    **OSPF** The Open Shortest Path First protocol for TCP/IP, which is the most commonly
    used routing protocol today.


    **packet** An IP network datagram.


    **packet filtering** See firewall.


    **PATH** The shell environmental variable defining which directories the shell
    should search for unqualified executable commands and in order which the shell
    should search those directories.


    **peer-to-peer** A communication method used for communication between two programs.
    A peer-to-peer communication protocol is often, but not always, different from
    the protocol used to communicate between the server and a client.


    **Physical layer** In the OSI reference model, the first layer, which represents
    the physical medium used to carry the signals between two adjacent network devices,
    such as copper wire, optical fiber, packet radio, or infrared. In the TCP/IP reference
    model, this is included as part of the first layer, the subnet layer.'
  merge: -1
  img_proc: true
- pgno: 380
  md: '# 358 Appendix C Glossary


    PID Process ID, which is a process''s unique numeric identifier on the system,
    usually associated with the process''s slot in the system process table.


    ping A simple network-analysis tool used to determine whether a remote host is
    reachable and responding; ping sends an ICMP request message. The recipient host
    returns an ICMP echo reply message in response.


    Post Post Office Protocol, used to retrieve mail from hosts running a POP server.

    port In TCP or UDP, the numericator of a particular network communication channel.
    Port assignments are managed by IANA. Some ports are assigned to particular application
    communication protocols as part of the protocol standard. Some ports are registered
    as associated with a particular service by convention. Some ports are unassigned
    and free to be dynamically assigned for use by clients and user programs:


    +   - Privileged—A port in the range 0 to 1023. Many of these ports are assigned
    to application protocols by international standard. On a Linux system, access
    to the privileged ports requires system-level privilege.

    - Unprivileged—A port in the range 1024 to 65535. Some of these ports are registered
    for use by certain programs by convention. Any port in this range can be used
    by a client program to establish a connection with a networked server.


    port scan A probe of all or set of a host computer''s service ports, typically
    service ports that are often associated with security vulnerabilities.


    portmap An RPC daemon, used to map between a particular RPC service number that
    a client is requesting and the service port to which the associated server is
    bound.


    probe To send some kind of packet to a service port on a host computer. The purpose
    of a probe is to determine whether a response is generated from the target host.


    proxy A program that creates and maintains a network connection on behalf of another
    program, providing an application-level conduit between a client and a server.
    The actual client and server have no direct communication. The proxy appears to
    be the client to the server program and Applications generally are categorized
    as application gateways or circuit gateways.


    proxy, application-level A proxy server for a particular service. Application-level
    gateways proxy the particular application protocol that they proxy. The proxy
    is capable of inspecting the application payload and making decisions based on
    information at the Application level, instead of making decisions at the IP and
    Transport levels.


    proxy, circuit-level A proxy server that can be implemented either as separate
    applications for each service being proxied or as a single generalized connection
    relay. A circuit-level proxy doesn''t have any specific knowledge about the application
    protocols.'
  merge: -1
  img_proc: true
- pgno: 381
  md: '# Appendix C Glossary


    The proxy makes decisions based on the same IP and transport information that
    a packet-filtering firewall does, with the possible addition of some amount of
    user authentication functionality.


    QoS Quality of Service.


    RARP Reverse Address Resolution Protocol, developed to enable diskless machines
    ask servers for their IP address on their MAC hardware.


    REJECT A firewall-filtering rule decision to drop a packet and return an error
    message to the sender.


    resolver The client side of DNS. The resolver is implemented as library code that
    is linked to programs requiring network access. The DNS client configuration file
    is /etc/resolv.conf.


    RFC Request for Comments, a note memo published through the Internet Society or
    the Internet Engineering Task Force. Some RFCs become standards. RFCs typically
    concern a topic related to the Internet or the TCP/IP protocol suite.


    RIP Routing Information Protocol, an older routing protocol still in use today,
    especially within a large LAN. The routed daemon uses RIP.


    RPC Remote procedure call.


    rule See firewall, and filter.


    runlevel A booting and system state concept taken from System V UNIX. A system
    normally operates at one of runlevels 2, 3, or 5. Runlevel 3 is the default, normal,
    multiuser system state. Runlevel 2 is similar to runlevel 3, without xinetd, portmap,
    or NFS services running. Runlevel 5 is the same as runlevel 3, with the addition
    of the X-Window Display Manager, which presents an X-based login and host-selection
    screen.


    screen host See firewall, screened-host.


    screened subnet See firewall, screened-subnet.


    script An ASCII file that can contain either shell or Linux program commands.
    These scripts are interpreted by shell programs such as sh, csh, bash, zsh, or
    k, or by programs as perl, awk, or sed.


    segment, TCP A TCP message.


    setgid A program that, when executed, assumes the group ID of the program''s owner
    rather than the group ID of the process running the program.


    setuid A program that, when executed, assumes the user ID of the program''s owner
    rather than the user ID of the process running the program.


    shell A command interpreter, such as sh, csh, bash, zsh, and ksh.'
  merge: -1
  img_proc: true
- pgno: 382
  md: '# Appendix C Glossary


    SMTP Simple Mail Transfer Protocol, used to exchange mail between mail servers
    and between mail programs and mail servers.


    SNMP Simple Network Management Protocol, used to manage network device configuration
    from a remote workstation.


    socket The unique network connection point defined by the pairing of an IP address
    with a particular TCP or UDP service port.


    SOCKS A circuit gateway proxy package available from NEC.


    spoofing, source address Forging the source address in an IP packet header so
    that it appears to be of some other address.


    SSH Secure Shell protocol, used for authenticated, encrypted network connections.


    SSL Secure Layer protocol, used for encrypted communication. SSL is most commonly
    used by web browsers and servers for exchanging personal information for e-commerce.


    statically assigned address Permanently assigned, hard-coded IP addresses, whether
    publicly registered addresses or private class addresses.


    subnet layer The TCP/IP reference model, the first layer, which represents both
    the physical media used to carry the signals between two adjacent network devices
    and point-to-point data signal delivery between two adjacent network devices,
    such as the delivery of an Ethernet frame from a computer to an external router.


    SYN The TCP connection synchronization request flag. A SYN message is the first
    message from a program seeking to open a connection with another networked program.


    syslog.conf The system-logging daemon, collects error and status messages generated
    by system programs that post messages using the syslog() call.


    TCP Transmission Control Protocol, used for reliable, ongoing network connections
    between programs.


    TCP/IP reference model An informal network communication model developed when
    TCP/IP became the de facto standard for Internet communication among UNIX machines
    during the late 1970s and early 1980s. Rather than being a formal, academic ideal,
    the TCP/IP reference model is based on what manufacturers and developers finally
    came to agree on for communication across the Internet.


    tcp_wrapper An authorization scheme used to control which local services are available
    to remote hosts on the network.


    TFTP Trivial File Transfer Protocol, the protocol used to download a boot image
    to a diskless workstation or router. The protocol is a UDP-based, simplified version
    of FTP.'
  merge: -1
  img_proc: true
- pgno: 383
  md: '# Appendix C Glossary


    **three-way handshake** The TCP connection establishment protocol. When a client
    program sends its first message to a server, the connection request message, the
    SYN flag is set and accompanied by a synchronization sequence number that the
    client will use as the starting point to number all the rest of the messages the
    client will send. The server responds with an acknowledgment (ACK) to the SYN
    message, along with its own synchronization number (SYN). The server increments
    the client''s sequence number by the number of contiguous data bytes received,
    plus 1. The purpose of the acknowledgment is to acknowledge the message referred
    to by sequence number. As with the client''s first message, the SYN flag is accompanied
    by a synchronization sequence number. The server passes along its own sequence
    number for its half of the connection. The client responds with an ACK of the
    server''s SYN-ACK, incrementing the server''s sequence number by the number of
    contiguous data bytes received, plus 1 to indicate receipt of the message. The
    connection is established.


    **TOS** Type of Service, in the IP packet header that was intended to provide
    a hint of the preferred routing policy or packet-routing preference.


    **traceroute** A network analysis tool used to determine the path from one computer
    to another across the network.


    **Transport layer** in the OSI reference model, the fourth layer, represents end-to-end
    communication between two programs, such as the delivery of a packet from a client
    program to a server program. In the TCP/IP reference model, this is referred to
    as the third layer, also the Transport layer. However, the TCP/IP Layer 3 Transport-level
    abstraction includes the concept of the OSI Layer 5 Session layer, which includes
    the concepts of an orderly and synchronized exchange of messages.


    **TTL** Time to Live, an IP packet header field that is a maximum count of the
    number of routers the packet can pass through before reaching its destination.


    **UDP** User Datagram Protocol, used to send individual network messages between
    programs, without any guarantee of delivery or delivery order.


    **unicast** An IP packet sent point to point, from one computer''s network interface
    to another''s.


    **UUCP** UNIX-to-UNIX Copy Protocol.


    **world-readable** Filesystem objects—files, directories, and entire filesystems—that
    are readable by any account or program on the system.


    **world-writable** Filesystem objects—files, directories, and entire filesystems—that
    are writable by any account or program on the system.


    **X Windows** The Linux graphical interface window display system.'
  merge: -1
  img_proc: true
