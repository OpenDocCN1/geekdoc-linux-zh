    ```\n$nft add rule filter forward iif $SERVER_LAN_INTERFACE oif $EXTERNAL_INTERFACE\
    \ \\\nudp sport ($53,$UNPRIVPORTS ) udp dport 53 \\\nip saddr $DNS_SERVER ip daddr\
    \ $NAME_SERVER \\\nct state new accept\n```\n\n```\n$nft add rule filter forward\
    \ iif $SERVER_LAN_INTERFACE oif $EXTERNAL_INTERFACE \\\ntcp sport $UNPRIVPORTS\
    \ tcp dport 53 \\\nip daddr $NAME_SERVER ip saddr $DNS_SERVER \\\nct state new\
    \ accept\n```\n\n# Summary\n\nThis chapter covered some of the firewall options\
    \ available when you're protecting a LAN. Security policies are defined relative\
    \ to the site's level of security needs, the importance of the data being protected,\
    \ and the cost of lost data or privacy. Starting with the bastion firewall developed\
    \ in Chapter 5 as the basis, LAN and firewall setup options were discussed in\
    \ increasingly complex configurations."
