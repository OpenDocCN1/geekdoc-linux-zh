  md: 'The single MASQUERADE rule on the nat table remains unchanged. All forwarded
    traffic going out the pppo interface is masqueraded.(Locally generated traffic
    is not masqueraded because the traffic is identified with the interface''s IP
    address, by definition.) The Forward rules in the filter table are limiting what
    traffic is forwarded and, therefore, what traffic is seen at the PROSUTING chain.


    # Applying Standard NAT to LAN Traffic to the Internet


    Assuming that same site had a dynamically assigned semiperminent IP address or
    that it has a permanently assigned IP address, the more general SNAT version of
    source NAT was used. Just as in the masquerading example, small residential sites
    often forward and NAT outgoing traffic:


    ```

    iptables -t nat -A POSTROUTING -o <external interface> \

    -j SNAT --source <external address>

    ```


    For nftables, a single rule is all that needs:


    ```

    nft add rule nat postrouting ip addr <source addresses> \

    oif <external interface> snat <external address>

    ```


    As masquerading, a single SNAT rule can be sufficient. The NAT and connection
    state tracking care of the incoming packets. For iptables, the FORWARD rule pair
    is necessary, however in the following example:


    ```

    iptables -A FORWARD -o <external interface> \

    -m state --state NEW, ESTABLISHED, RELATED -j ACCEPT

    ```


    ```

    iptables -A FORWARD -i <external interface> \

    -m state --state ESTABLISHED, RELATED -j ACCEPT

    ```


    In the case of small sites with 24x7 connections, it is especially important to
    be selective about what traffic gets forwarded. The single FORWARD rule allowing
    outgoing new connections isn''t sufficient. Trojans and viruses are common. The
    newer devices tend to be somewhat problematic about what they do over the network.
    There is a good chance that Windows machines and devices as printers are generating
    more traffic than you need. Also, what of local traffic is broadcast. It''s a
    good idea to avoid the risk of forwarding broadcast traffic. Routers are no longer
    supposed to forward directed broadcast traffic by default, but still do. (Limited
    broadcasts do not cross network boundaries without a relay agent to duplicate
    the packet and pass on. Most devices use limited broadcasts.) A final reason is
    the case of attaching work laptops to the home network. Many employers don''t
    want offsite laptops have Internet access without VPN or the protection of their
    corporate firewalls and antivirus software.'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'Examples of DNAT, LANs, and Proxies


    # Examples of DNAT, LANs, and Proxies


    For the residential and small-business site, destination NAT was probably the
    most-welcome addition to Linux NAT when it was added to iptables.


    # Host Forwarding


    DNAT provides the host-forwarding capability that, until now, was available only
    through third-party solutions. For small sites with a single public IP address,
    DNAT allows connections to local services to be transparently forwarded to a server
    running in DMZ. Public services aren''t required to run on the firewall machine.


    With a single IP address, remote sites client requests to the firewall machine.
    The firewall is the only local host that''s visible to the Internet. The service
    (for example, a web or mail server) is hosted internally in a private network.
    For packets arriving on that service''s port, the firewall changes the destination
    address to that of the local server-network interface and forwards the packet
    to the private machine. The reverse is done for server responses. From the server,
    the firewall changes the source address to its own external interface and forwards
    the packet to the remote client.


    The most common example is forwarding incoming connections to a local web server


    ```

    iptables -t -A PREROUTING -i <public interface> -p tcp \\

    --sport 1024-65535 -d <public address> --port 80 \\

    -j DNAT --to-destination <local web server>

    ```


    The nft rules looks like this:


    ```

    nft add rule prerouting iif <public interface> \\

    tcp sport 1024-65535 ip daddr <public address> \\

    tcp dport 80 dnat <local web server>

    ```


    The tricky part is the question of what address is seen on each chain. Destination
    NAT was applied before the packet reached the FORWARD chain. So the rule on the
    FORWARD chain must refer to the internal server''s private IP address rather than
    the firewall''s public address:


    ```

    iptables -A FORWARD -i <public interface> -o <DMZ interface> -p tcp \\

    --sport 1024-65535 -d <local web server> --dport 80 \\

    -m state NEW -j ACCEPT

    ```


    For iptables rules looks like this:


    ```

    nft add rule filter forward iif <public interface> \\

    oif <DMZ interface> tcp sport 1024-65535 \\

    tcp dport 80 ip daddr <local web server> \\

    ct state accept accept

    ```'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# Chapter 8 NAT—Network Address Translation


    Connection tracking and NAT automatically reverse the translation for packets
    returning from the server. Because the initial connection request was accepted,
    a generic FORWARD rule suffices to return the return traffic from the local server
    to the Internet.


    ```

    iptables -A FORWARD -i <DMZ interface> -o <public interface> \

    -m state --state ESTABLISHED,RELATED -j ACCEPT

    ```


    The nftables version looks like this:


    ```

    nft add rule filter forward iif <DMZ interface> \

    oif <public interface> \

    ct state established,related accept

    ```


    Of course, don''t forget that ongoing traffic from the client must be forwarded
    as the version used in this book has individual service rules specifying the NEW
    state from a single rule for all ESTABLISHED or RELATED traffic:


    ```

    iptables -A FORWARD -i <public interface> -o <DMZ interface> \

    -m state --state ESTABLISHED,RELATED -j ACCEPT

    ```


    For nftables:


    ```

    nft add rule filter forward iif <public interface> \

    oif <DMZ interface> \

    ct state established.related accept

    ```


    # Summary


    This chapter covered Network Address Translation. Initially, three basic types
    of NAT were described. NAT''s original purpose, what it is used for today, and
    its advantages and disadvantages were discussed as well.


    In iptables, NAT features are accessed through the nat table and table''s chains
    rather than through the filter table and the FORWARD chain. The implications of
    packet flow through the operating system, and the differences between address
    rules match on the FORWARD chain versus on the nat chains, were discussed.


    iptables implements both source NAT and destination NAT. Source NAT is divided
    into two subcategories, SNAT and MASQUERADE. SNAT is regular source address translation.
    MASQUERADE is a specialized implementation of source NAT. It removes any NAT table
    state as soon as a connection is dropped.


    Destination NAT is also divided into two subcategories, DNAT and REDRECT. DNAT
    is regular destination address translation. REDRECT is special case of destination
    translation. It is an alias for redirecting packets to the local host, regardless
    of the packet''s original destination.


    Finally, a series of real-world, practical examples of NAT were presented.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# Debugging the Firewall Rules


    So now the firewall is set up, installed, and activated. But nothing works! You''re
    locked out. Who knows what''s going on? Now what? Where do you even begin?

    Firewall rules are notoriously difficult to get right. If you''re developing by
    hand, bugs will invariably crop up. Even if you produce a firewall script with
    an automatic firewall-generation tool, your script deoubtedly will require customized
    tweaking eventually.

    This chapter introduces additional reporting features of the iptables and nftables
    tools and other system tools. The information is invaluable when debugging your
    firewall rules. This chapter explains what the information can tell you about
    your firewall.


    # General Firewall Development Tips


    Tracking down a problem in the firewall is detailed and painstaking. There are
    no-cuts to debugging the firewall when something goes wrong. In general, the following
    tips can make the process a bit easier:


    +   - Always execute the rules from a complete test script, like the one I''ve
    shown how to build throughout this book. Be sure that the script flushes all existing
    rules, removes any existing user-defined chains, and resets the default policies
    first. Otherwise, you can''t be sure which rules are in effect or in which order.

    - Don''t execute new rules from the command line. Especially don''t execute the
    default policy rules from the command line. You''ll be cut off immediately if
    you''re logged in X Windows or remotely from another system, including a system
    on the LAN.

    - Execute the test script from the console if you can. Working in X Windows at
    the console might be more convenient, but the danger of losing access to X Windows
    locally. Be prepared for the possibility of needing to switch over to a virtual
    console. If you must use a remote machine to test the fire-wall script, use cron
    to automatically flush the firewall in you get locked out. Be sure to remove the
    cron job before live with the firewall, though.

    - Remember that flushing the rule chains does not affect the default policy currently
    in effect.

    - With a deny-by-default policy, always enable the loopback interface immediately.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Chapter 9 Debugging the Firewall Rules


    +   - When feasible, work on one service at a time. Add rules one at a time, or
    as input output pairs if you aren''t using the state module. Test as you go. This
    makes it much easier to isolate problem areas in the rules right away. Liberal
    use of the echo command within the firewall script can help to narrow down the
    location of rules that are problematic within the script.


    +   - The first matching rule wins. Order is important. Use the list commands
    as you go to get a feel for how the rules are ordered. Trace an imaginary packet
    through the list.


    +   - If the script appears to hang, chances are good that you are referencing
    a symbolic hostname than an IP address before the DNS rules have been enabled.
    Any rule using a hostname instead of an address come after the DNS rules, unless
    the host has an in the /etc/hosts file.


    +   - The filter table is implied by default for iptables but not for nftables.


    +   - Most modules require you to reference the module by name with the -m option
    before specifying the module''s feature syntax, as in -m state --NEW.


    +   - When a service doesn''t work, all dropped packets going in both directions,
    as well as all accepted packets. The log entries in /var/log/messages or /var/log/kern.log
    show being dropped when you try the service? If they do, you can adjust your firewall
    rules to allow the packets. If not, the problem might be elsewhere.


    +   - If you have Internet access from the firewall machine but not from the LAN,
    check that IP forwarding is enabled by running /proc/sys/net/ipv4/ip_forward.
    The value 1 should be reported. IP forwarding can be permanently configured by
    hand in /etc/sysctl.conf or in the firewall script itself. The first configuration
    method takes effect when the network is restarted. If IP forwarding wasn''t enabled,
    you can enable it immediately by following the line as root or including it in
    the firewall script and reexecuting the script:

    echo "1" > /proc/sys/net/ipv4/ip_forward


    +   - If a service works on the LAN but not externally, turn on logging for accepted
    packets on the internal interface. Use the verify briefly to see which ports,
    addresses, flags, and so are in both directions. You won''t want to log accepted
    packets for any length of time, or you''ll have hundreds or thousands of log entries
    in /var/log/messages.


    +   - If a service doesn''t work at all, temporarily insert input and output rules
    at the beginning of the firewall script to accept everything in both directions
    and log all traffic. Is the service available now? If so, check the log entries
    in /var/log/messages to see which ports are in use.'
  merge: -1
  img_proc: true
- pgno: 235
  md: "# Listing the Firewall Rules\n\nIt's a good idea to list the rules you've defined,\
    \ to double-check that they are installed and are in the order you expect. The\
    \ -L command lists the actual rules for a given chain as they exist in the internal\
    \ kernel table. Rules are listed in the order in which they are matched against\
    \ a packet.\n\nThe basic format of the iptables list command is as follows (run\
    \ as root):\n\n```\niptables -vn -L [chain]\n```\n\nor\n\n```\niptables -t <table>\
    \ -vn -L [chain]\n```\n\nThe first format refers to the default filter table.\
    \ If a specific chain is not specified, the command lists all rules on the three\
    \ built-in filter chains, plus any user-defined chains.\nThe second format is\
    \ needed to list the rules on the nat or mangle table.\n the -v option is useful\
    \ to see the interface to which the rules apply. Adding the lengthy name resolution\
    \ for time addresses. Remember that if a chain is specified, it must follow the\
    \ -L command. Note that -L is a command and -v and -n are options. They cannot\
    \ be combined as in -vn.\n\nUnlike iptables to define actual rules, using iptables\
    \ to list existing rules can be from the command line. The output goes to your\
    \ terminal or can be redirected into a file.\n\nThe syntax for nftables looks\
    \ like this:\n\n```\nnft list [table] <tablename> [chain] <name> [-a -n]\n```\n\
    \nThe name of the table is always required with any list command, but when requesting\
    \ a chain list do not need to use the table keyword. The astute reader will recognize\
    \ that there are no default table names for nftables. The list tables command\
    \ shows all:\n\n```\nnft list tables\n```\n\nThe -a option adds the handle number\
    \ to the list, which can be helpful for inserting or deleting rules. The first\
    \ -n option prevents the IP-to-DNS name translation. Adding a second -n prevents\
    \ the port-to-service lookup as well.\n\n# iptables Table Listing Example\n\n\
    The basic format of the iptables table list command to list all rules on any filter\
    \ table chains is:\n\n```\niptables -vn -L INPUT\niptables -vn -L OUTPUT\niptables\
    \ -vn -L FORWARD\n```\n\nor\n\n```\niptables -vn -L\n```"
  merge: -1
  img_proc: true
- pgno: 236
  md: "# Chapter 9 Debugging the Firewall Rules\n\nNotice that the preceding list\
    \ commands show only the rules in the filter table chains. The next three sections\
    \ use sample rules on the INPUT chain to illustrate the differences among the\
    \ various listing format options available to you with the filter table and explain\
    \ what the output means. Using the different listing format options, the same\
    \ sample rules are listed with varying degrees of readability. The listing format\
    \ options and fields are the same for the INPUT, OUTPUT, and FORWARD chains.\n\
    \n# iptables -L INPUT\n\nHere is an abstract of seven rules from an INPUT chain\
    \ using the default listing options:\n\n```\nINPUT (DROP)                    \
    \                 destination\ntarget      prot sort                         \
    \      anywhere\nACCEPT      all                                     anywhere\n\
    LOG         icmp -f anywhere                               anywhere \\\nLOG level\
    \ warning prefix 'Fragmented ICMP: \\\n            DROP        anywhere      \
    \                         anywhere \\\n            tcp flags:SYN,RST,PSH,ACK,URG/NONE\n\
    ACCEPT      all                                     anywhere \\\nstate RELATED,ESTABLISHED\n\
    ACCEPT      udp                              192.168.1.0/24 my.host.domain \\\n\
    udp sports:1024:65535 dport:state NEW my.host.domain2 \\\nREJECT     tcp --anywhere\
    \                               my.host.domain \\\ntcp dpt:auth-reject --with-icmp-port-unreachable\n\
    ACCEPT      tcp                              192.168.1.0/24 my.host.domain \\\n\
    multport dports http.https tcp spts:1024:65535 \\\\\nflags:SYN,RST,ACK/SYN state\
    \ NEW\n```\n\n# Line Numbers in ListingsnThe lines in the listings throughout\
    \ this chapter are not part of the output; they are simply reference markers.\
    \ Numbers can be generated by adding the --line-numbers option to the command.\
    \ The \"line numbers\" generated are the rules' positions within the chain.\n\n\
    Line 1 identifies the listing as being for the INPUT chain. The INPUT chain's\
    \ default policy is DROP.\nLine 2 contains these column headings:\n\n+   * target\
    \ refers to the disposition of a packet matching the rule ACCEPT, DROP, LOG, or\
    \ REJECT.\n* prot is an abbreviation for protocol, which can be all, tcp, udp,\
    \ or icmp, as well as a value from /etc/protocols.\n* stands for fragmentation\
    \ options, which would have been set with either the -f or the ! -f option. A!\
    \ in the first space indicates the -f option, which means"
