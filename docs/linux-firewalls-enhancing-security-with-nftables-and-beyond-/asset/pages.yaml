- pgno: 139
  md: '# Enabling Basic, Required Internet Services


    117


    The exchange between client and server is explicitly described by the firewall
    rules. Part the purpose of firewall rules is to ensure protocol integrity at the
    packet level. Firewall rules, expressed in iptables or nftables syntax, are not
    especially human readable, however. in each of the following sections, the service
    protocol at the packet-filtering level is presented as a state of table information,
    followed by the iptables and nftables rules expressing those states.


    Each row in the table lists a packet type involved in the service exchange. A
    firewall rule is defined for each individual packet type. The type is divided
    into columns:


    +   - Description counts a brief description of whether the packet is originating
    from the client or the server, and the packet''s purpose.

    - Protocol is the transport protocol in use, TCP or UDP, or the IP protocol''s
    control messages, ICMP.

    - Remote Address is the legal address, or range of addresses, that the packet
    can contain in the remote address field.

    - Remote Port is the legal port, or range of ports, that the packet can contain
    in the remote port field.

    - In/Out describes the packet''s direction—that, whether it is coming into the
    system from a remote location or whether it is going out from the system to a
    remote location.

    - Local Address is the legal address, or range of addresses, that the packet can
    contain in the local address field.

    - Local Port is the legal port, or range of ports, that the packet can contain
    in the local port field.

    - TCP protocol packets contain a final column, TCP Flag, defining the legal SYN-ACK
    states that the packet may have.


    Finally, in the instances when the service invokes ICMP messages, notice that
    the Network-layer ICMP packets are not associated with the concept of a source
    or destination port, as is the case for Transport-layer TCP or UDP packets. Instead,
    ICMP packets use the concept of a control or status message type. ICMP messages
    are not sent to bounds to particular service ports. Instead, ICMP messages are
    sent from one computer to another (The ICMP packet contains a copy of at least
    some of the original packet that resulted in the error message. The receiving
    host identifies the process that the error refers to by examining the packet carried
    in the ICMP packet''s data area.) Consequently, the few ICMP entries presented
    in the tables use the source port column to contain the message type. For incoming
    ICMP packets, the source port column is the Remote Port column. For outgoing ICMP
    packets, the source port column is the Local Port column.


