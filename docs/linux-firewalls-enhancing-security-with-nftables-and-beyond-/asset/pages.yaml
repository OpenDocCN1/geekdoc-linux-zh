  md: '# Chapter 6 Firewall Optimization


    ![](img/48efc603406f52595e8bb3258079832d_170_0.png)


    Figure 6.1 IPFW loopback and masqueraded packet traversal


    ![](img/48efc603406f52595e8bb3258079832d_170_1.png)


    Figure 6.2 Netfilter packet traversal


    INPUT chain to the FORWARD chain to the OUTPUT chain. The examples on the website
    were intended as examples for people at home. The input and output rules for the
    LAN were the last rules in the scripts. The rules specific to the local host come
    first. The ISP’s firewall was primarily functioning as a router or gateway. Through
    experimentation, the ISP found that moving the I/O rules for the LAN interface
    to the beginning of the INPUT and OUTPUT chains resulted in a megabit-per-second
    increase in throughput.


    # User-Defined Chains


    For iptables the filter table has three permanent, built-in chains: INPUT, OUTPUT,
    and FORWARD. iptables enables you to define chains of your own, called user-defined
    chains. In nftables all tables are user defined but in practical terms the filter
    table is still used.'
