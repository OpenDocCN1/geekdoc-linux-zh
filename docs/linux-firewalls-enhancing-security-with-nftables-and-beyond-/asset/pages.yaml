    # Service Name–to-Port Number Mappings


    Linux distributions are supplied with a list of common service port numbers. The
    list is found in the /etc/services file.


    Each entry consists of a symbolic name for the service, the port number assigned
    to it, the protocol (TCP or UDP) the service runs over, and any optional nicknames
    for the service. Table 1.5 lists some common service name–to-port number mappings,
    taken from Red Hat Linux.


    # Table 1.5 Common Service Name–to–Port Number Mappings


    | Port Name | Port Number/Protocol | Alias |

    | --- | --- | --- |

    | ftp | 21/tcp | - |

    | ssh | 22/tcp | - |

    | smtp | 25/tcp | mail |

    | domain | 53/tcp | nameserver |

    | domain | 53/udp | nameserver |

    | http | 80/tcp | www-www-http |

    | pop3 | 110/tcp | pop-3 |

    | nntp | 119/tcp | readiness untp |

    | ntp | 123/udp | - |

    | https | 443/tcp | - |


    Note that the symbolic names with the port numbers vary by Linux distribution
    and release. Names and aliases differ; port numbers do not.


    Also that note port numbers are associated with a protocol. The IANA has attempted
    to assign the same service port number to both the TCP and the UDP protocols,
    regardless of whether a particular service uses both transport modes. Most services
    use one protocol or the other. The Domain Name Service uses both.


    # A Typical TCP Connection: Visiting a Remote Website


    As an illustration, a common TCP connection is going to be a website through your
    browser (connecting to a web server). This section illustrates the aspects of
    connection establishment and ongoing communication that will be relevant to IP
    packet filtering in later chapters.'
