    # Generic TCP Service


    Most of the rules in this section are similar to each other. Rather than trying
    to provide rules for every type ofTCP-based service, it is more useful to learn
    a general rule to add a rule to any TCP service wherever you need to provide it.


    The following generic rules apply to any TCP service which you need to make a
    connection. Substitute the destination service port for <YOUR PORT HERE>:


    ```

