- pgno: 227
  md: '# NAT Semantics with iptables and nftables


    # Destination NAT


    Two forms of destination NAT exist in the iptables nat table, specified as two
    distinct targets: DNAT and REDIRECT. DNAT is standard destination address translation.
    REDIRECT is a specialized form of destination NAT that redirects packets to the
    device''s input or loopback interface. There is no redirect target for nftables.


    The iptables targets can be used on any of the iptables nat''s PREROUTING or OUTPUT
    chains. Destination address modifications are applied before the routing decision
    is made to choose the proper interface. Thus, on the PREROUTING chain, DNAT and
    REDIRECT rules are associated with an incoming interface for packets that are
    to be forwarded through the device or are addressed to this host''s incoming interface.
    On the OUTPUT chain, DNAT and REDIRECT rules refer to locally generated, outgoing
    packets from the NAT host itself.


    # Standard DNAT


    The general syntax -t nat -A PREROUTING -i <incoming interface> ... \


    ```

    -j DNAT --to-destination <address>[-<address>]:[:port-port]

    ```


    and


    ```

    iptables -t nat -A OUTPUT -o <outgoing interface> ... \

    ```


    ```

    -j DNAT --to-destination <address>[-<address>]:[:port-port]

    ```


    The nftables syntax is


    ```

    nft add rule nat prerouting iif <incoming interface> \

    ```


    ```

    dnat destination address=<address>[:port-port]

    ```


    and


    ```

    nft add rule nat output oif <outgoing interface> \

    ```


    ```

    dnat destination address=<address>[:port-port]

    ```


    The address is the destination address to substitute for the original destination
    address in the packet, presumably the address of a local server.


    Optionally, a range of destination addresses can be used. Sites that have a pool
    of public, peer servers would use this range. Incoming connections from remote
    sites would be assigned to one of the servers. These addresses could be public
    addresses assigned to the internal machines. For example, a pool of peer servers
    appears to be a single server to remote hosts. Alternatively, the addresses could
    be private addresses, and the servers wouldn''t be visible or accessible from
    the Internet. In the latter case, the site probably doesn''t have public addresses
    to assign to the servers. Remote hosts attempt to connect to the service on the
    NAT host. The NAT host forwards the connections parently to the privately addressed
    internal server.


    The final port specification is another option. The port specifies the destination
    port, or port range, on the target host''s incoming interface that the packet
    should be sent to.'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'The ellipsis represents any other packet selectors that are specified. For
    example, DNAT

    could be applied to redirect incoming connections from a specific remote host
    to

    internal host.Another might be to redirect incoming connections to a particular-

    port to the actual server running in the local network.


    # REDIECT Destination NAT


    The general syntax for REDIRECT is shown here:


    ```

    iptables -t nat -A PREROUTING -i <incoming interface> ... \

    -j REDIRECT [--to-ports <port>]]

    ```


    and


    ```

    iptables -t nat -A OUTPUT -o <outgoing interface> ... \

    -j REDIRECT [--to-ports <port>]]

    ```


    Remember, REDIRECT redirects the packet to this host, which is the host performing

    redirect.


    Packets arriving on the incoming interface are presumably addressed to some other

    lhost. Another alternative could be that the packet is targeted to a particular
    local

    service port, and the packet is redirected to a different port on the host transparently.


    Locally generated packets, for somewhere else, are redirected back to the

    loopback interface on this host. Again, a packet targeted to a specific remote
    might

    be redirected back to the local machine, perhaps to a caching proxy, for example.


    Optionally, a different destination port or range can be specified. If no port
    is

    sified, the packet is delivered to the destination port that the sender defined
    in the

    packet.


    The ellipsis represents any other packet selectors that are specified. For example,

    REDIRECT could be applied to redirect incoming connections to a specific service
    to

    server, authenticator, or some kind of inspection software on the local host.
    The

    packet could be sent from this host after some kind of inspection function was
    performed.

    Another might be to redirect outgoing connections to a particular service

    back to a server or an intermediate service on this host.


    # Examples of SNAT and Private LANs


    Source NAT is by far the most common form of NAT. Using NAT to give outgoing\Internet
    access to local, privately addressed hosts was the original purpose of NAT.The

    following sections provide some simple, real-world examples of using the nat table''s

    QUERADE and SNAT targets.


    # Masquerading LAN Traffic to the Internet


    The MASQUERADE version of source NAT is intended for people with dial-up

    accounts who get a different IP address assigned at each connection. It is also
    used by

    people with always on connections but whose ISP assigns them a different IP address
    on

    regular basis. This version applies only to iptables.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# Examples of SNAT and Private LANs


    The simplest example is a PPP connection. These sites often use a single rule
    to masquerade outgoing connections from the LAN:


    ```

    iptables -t nat -A PRERUTING -o ppp0 -j MASQUERADE

    Masquerading—and NAT in general—is set with the first packet. The NAT and connection
    state tracking take care of the incoming packets. The FORWARD rule is necessary,
    though, in this example:

    iptables -A FORWARD -o ppp0 \

    -m state --state ESTABLISHED, RELATED -j ACCEPT

    ```


    iptables -A FORWARD -o <interface> \

    -m state --state ESTABLISHED, RELATED -j ACCEPT

    In this type of setup, the incoming interface doesn’t need to be specified. FORWARD
    rules refer to traffic crossing between interfaces. If the host has a network
    interface and a single ppp interface, anything forwarded out one interface must
    necessarily originate from the other interface. Anything accepted by the FORWARD
    rule in the filter during routing will be masqueraded by the PROSOUTING rule in
    the nat table. With short-term phone connections, the single FORWARD rule allowing
    outgoing NEW connections should be broken out into rules for specific services.
    Depending on the networked devices in the LAN and how they operate, you likely
    want to limit what LAN traffic gets forwarded.\ Here’s an example of a single
    FORWARD rule:


    ```

    iptables -A FORWARD -i <interface> -o ppp0 \

    -m state --state ESTABLISHED, RELATED -j ACCEPT


    iables -A FORWARD -i ppp0 -o <interface> \

    -m state --state ESTABLISHED, RELATED -j ACCEPT

    ```


    In this example, the single FORWARD rule is broken out into several more specific
    rules allowing only DNS queries and web access. Other LAN traffic isn’t forwarded,
    as shown by these commands:


    ```

    iptables -A FORWARD -i ppp0 -o <interface> \

    -m state --state ESTABLISHED, RELATED -j ACCEPT

    iptables -A FORWARD -o ppp0 \

    -m state --state ESTABLISHED, RELATED -j ACCEPT

    ```


    ```

    iptables -A FORWARD -o ppp0 --udp udp \

    --sport 1024:65535 -d <name server> --dport 53 \

    -m state --state NEW -j ACCEPT


    iptables -A FORWARD -o ppp0 --tcp \

    --sport 1024:65535 -d <name server> --dport 53 \

    -m state --state NEW -j ACCEPT

    ```


    ```

    iptables -A FORWARD -o ppp0 --tcp \

    -s <local host> --sport 1024:65535 --dport 80 \

    -m state --state NEW -j ACCEPT

    ```


    ![](img/48efc603406f52595e8bb3258079832d_229_0.png)'
  merge: -1
  img_proc: true
