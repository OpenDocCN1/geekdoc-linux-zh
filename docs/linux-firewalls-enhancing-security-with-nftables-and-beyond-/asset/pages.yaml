    One of the greatest strengths of Linux and open-source software is security. Some
    people attempt to argue that this security is achieved because open-source software
    is less popular. Of course, this completely ignores market-statistics such as
    Netcraft''s web server showing that Apache holds nearly 40% of the web server
    market


    Part of this security strength comes from the open-source community''s ability
