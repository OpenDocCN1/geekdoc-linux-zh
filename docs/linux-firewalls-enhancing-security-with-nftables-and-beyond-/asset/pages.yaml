    2 minutes. Using such a mechanism is somewhat of a trade-off, because you have
    to go through your initial debugging before the clock hits a multiple divide by
    two! Additionally, it''s up to you to remember to remove this cron entry when
    you''ve debugged the firewall. If you forget to remove this entry, the firewall
