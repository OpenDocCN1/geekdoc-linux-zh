  md: "# 176 Chapter 6 Firewall Optimization\n\nHere are the rules:\n\n```\ninclude\
    \ \"nft-vars\"\ntable filter {\n  chain input {\n    log prefix=\"INPUT packet\
    \ dropped: \" limit rate 3/second\n  }\n  chain output {\n    log prefix=\"OUTPUT\
    \ packet dropped: \" limit rate 3/second\n  }\n}\n```\n\n# What Did Optimization\
    \ Buy?\n\nThe goal of optimization is to get the packet through the filter processing\
    \ as quickly as possible, with as few unnecessary tests as possible. Ideally,\
    \ you want the packets flowing through line speed.\n\nIn terms of the firewall\
    \ itself, three factors affect performance: the number of rules installed in the\
    \ kernel; the chain traversal length, or the number of rules that any packet is\
    \ tested against it matches; and the total number of tests performed on the packet.\
    \ Also, when it comes to the state module, remember that the trade-off is speed\
    \ versus memory.\n\nNote that some of the variations in the tables are artifacts\
    \ of how the scripts in Chapter 5 and this chapter are organized, as well as differences\
    \ in the TCP state flag and address checks between the two examples.\n\n# iptables\
    \ Optimization\n\nFor iptables, the optimized versions have more rules than their\
    \ straight-through counterparts! Even more surprising, the connection-tracking\
    \ versions have more rules than the classic, stateless versions! Didn't we already\
    \ conclude that the use of state module reduces the number of rules by eliminating\
    \ ACCEPT rules for server responses to client requests?Yes and no... The absolute\
    \ number of rules increases, because the state table must remain present to account\
    \ for any cases in which a table has timed out or been replaced due to a resource\
    \ shortage. The number of input rules traversed can drop dramatically.\n\nUsing\
    \ user-defined chains results in fewer rules as well. The additional rules perform\
    \ the intermediate packet selection and branching. There's a small amount of overhead\
    \ in the top-level branching decisions. The overhead isn't significant, and even\
    \ the small amount of apparent overhead is decreasing. The number of rules traversed\
    \ isn't as critical as a performance metric as the individual header field match\
    \ tests performed.\n\nOptimization with user-defined chains can significantly\
    \ reduce the number of rules that a response packet must be tested before reaching\
    \ its final matching rule.What isn't obvious here is that the straight-through\
    \ rule set includes a set of overhead because of the antispoof rules. Because\
    \ the example firewalls were client centered,"
