    subnetting we would have a very large, flat address space, which would be much
    slower than the hierarchical addressing currently used.


    # IP Fragmentation


    There are times when an IP datagram is larger than the maximum allowed size for
    the medium on which it be traveling. This maximum allowed size is known as the
    Maximum Transmission Unit, or MTU. If an IP datagram is larger than the MTU for
    the medium, the datagram will need to be split into smaller chunks before transmitted.
    For Ethernet, the MTU is 1500 bytes. The process of splitting an IP datagram into
    smaller pieces is called fragmentation.


    Fragmentation is handled at the IP layer of the OSI model and is transparent to
    higher-layer protocols such as TCP and UDP. As an administrator, you should care
    about fragmentation as it can affect application performance if one of the fragments
    of a large segment gets lost. In addition, as a security administrator, you should
    understand fragmentation because it has been a path for attack in the past. Realize,
    however, that any intermediary router or other devices within the communication
    path may cause fragmentation and you may not even know it.


    # Broadcasting and Multicasting


    When a device wants to send data to devices on the same network segment, it can
    send the data to a special address known as a broadcast address to accomplish
    this task. On the other hand, a multicast is sent to the devices belonging to
    the multicast group, sometimes called subscribers.


    Imagine a large, flat network in which every computer and device is connected
    to the others. In this type of network, each device sees the traffic and determines
    whether it cares about the traffic in question. In other words, it looks to see
    whether the data is addressed to it or another device. If the data is addressed
    to the device, it passes the data up to the layers of the OSI model. At the interface
    level for Ethernet, the device looks for its MAC'
