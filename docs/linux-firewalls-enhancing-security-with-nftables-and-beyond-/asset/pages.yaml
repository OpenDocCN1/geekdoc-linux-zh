    Line 8 shows a rule to log all packets that have not yet been filtered or processed
    by a preceding rule. This rule is 19.

    Line 9 shows the final disposition of any packets that make it this far without
    encountering a matching rule. Their fate is to be dropped. The rule handle is
    20.

    Lines 10 and 11 show the closing braces from the rule definition.

    As you see by the rule output, you could copy this output or redirect the output
    to a file and immediately re-create the existing rules.


    # Interpreting the System Logs


    syslog and its sibling syslog are the service daemons that log system events.
    A typical system, the main system log file is /var/log/messages. Many programs
    use syslog''s standard logging services. Other programs, such as the Apache web
    server, maintain their separate log files.


    # syslog Configuration


    Not all log messages are equally important—or even interesting. This is where
    /etc/syslog.conf comes in. The configuration file /etc/syslog.conf enables you
    to tailor the log output to meet your needs.


    Messages are categorized by the subsystem that produces them. In the man pages,
    categories are called facilities (see Table 9.1).'
