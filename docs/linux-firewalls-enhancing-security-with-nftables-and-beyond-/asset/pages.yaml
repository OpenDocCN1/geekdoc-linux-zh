    \ between the symbolic names people give to computers and networks and the numeric\
    \ addresses the IP layer uses to uniquely identify interfaces.\n\nDNS maps in\
    \ both directions: IP address to name and name to IP address. When you click on\
    \ a URL in your browser, the DNS database is consulted to find the IP address\
    \ associated with that hostname. The IP address is passed to the IP layer to use\
    \ as the destination address in the packet.\n\n# IP Addresses and Ethernet Addresses\n\
    \nWhereas the IP layer identifies hosts by their 32- or 128-bit IP address, the\
    \ subnet or link layer identifies the Ethernet card by its unique 48-bit Ethernet\
    \ address, or MAC address, which the manufacturer burns into the card and can\
    \ also be set by the user. IP addresses are passed between the endpoints hosts\
    \ to identify themselves. Ethernet addresses are passed between adjacent hosts\
    \ and routers.\n\n Ordinarily, the Ethernet address could be ignored in a firewall\
    \ discovery. The Layer 2 hardware address is not visible to the Layer 3 IP layer\
    \ or Layer 4 Transport layer. As you'll see in later chapters, the Linux firewall\
    \ administration program has the extended capability to access and filter on the\
    \ MAC address. There are specialized uses for this firewall functionality, but\
    \ it's important to remember that Ethernet addresses do not pass end-to-end across\
    \ the network. Ethernet addresses are passed between adjacent network interfaces,\
    \ or hosts or routers. They are not passed through a router unchanged."
