    # TCP Concepts


    Whereas UDP is a connectionless protocol, TCP is a connection-oriented protocol.
    With UDP there is only a sender and a receiver of a UDP datagram. With TCP, on
    the other hand, either side of the connection can send or receive data, possibly
    both at the same time. This is what makes TCP a full-duplex protocol. The process
    of establishing a TCP connection is sometimes called the three-way handshake—you''ll
    see shortly.


    With a connection-oriented protocol, there is a specific set of procedures that
    take place in order to establish a TCP connection. During this process, various
    states exist for the TCP connection. The connection establishment procedures and
    its corresponding states are detailed next.


    The side of communication wanting to initiate the connection (client) sends a
    TCP segment with the SYN flag set, as an Initial Sequence Number (ISN) and the
    port number for the connection to the other side, normally referred to as the
    server side of the connection. This is frequently referred to as a SYN packet
    or SYN segment, and the connection is to be in the SYN_SENT state.


    The server side of the connection responds with a TCP segment with the SYN flag
    set as well as the ACK flag set. In addition, the server sets the ISN with a value
    higher than'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Don''t Forget Address Resolution Protocol 17


    the ISN sent by the client. This is frequently referred to as a SYN-ACK packet
    or SYN-ACK segment, and the connection is said to be in the SYN_RCVD state.


    The client acknowledges the SYN-ACK by sending another segment with the ACK flag
    set and increasing the ISN by one. This completes the three-way handshake and
    the connection is said to be in an ESTABLISHED state.


    As with the protocol for connection initiation, there is also a protocol for connection
    termination. The protocol for terminating a TCP connection is four steps as opposed
    to the three for connection establishment. The additional step is to fix the full-duplex
    nature of a TCP connection insofar either side may be sending data at any given
    time.


    Closing a connection on one side is acknowledged by that sending a TCP segment
    with the FIN flag. Either side of the connection can send a FIN to indicate that
    it is done data. The other side can still send data. In practice, after a FIN
    is received, the connection termination sequence will normally begin. For this
    discussion I will call the side waiting to terminate the connection the client
    side.


    The termination process begins with the client sending a segment with the FIN
    flag set, known as the CLOSE_WAIT state on the server and FIN_WAIT_1 on the client
    side. After the FIN is received, the server sends an ACK back to the client, incrementing
    the sequence number by one. At this point the client enters the FIN_WAIT_2 state.
    The server also indicates to its higher-layer protocols that the connection is
    terminated. The server closes a segment with the FIN flag to be sent to the client,
    which causes the server to go into a LAST_ACK state while the client goes into
    a TIME_WAIT state. Finally, the client acknowledges this FIN with an ACK and increments
    the sequence number by one, which causes the connection to go into a CLOSED state.
    Because TCP connections can be terminated by either side, a TCP connection can
    exist in a half-closed mode in which one side has initiated the FIN sequence but
    the other side has not done.


    TCP connections can also be terminated by either end sending a segment with the
    reset (RST) flag set. This tells the other side to use an abort release mechanism.
    This is to avoid the normal termination of a TCP connection, sometimes referred
    to as an orderly release.


    An optional part of the TCP connection is the establishment of the Maximum Segment
    Size (MSS). The MSS is the maximum chunk of data that the end of communication
    is able to receive. Because the MSS is the maximum size that a given end of the
    connection can receive, it''s perfectly fine to send a chunk of data smaller than
    the MSS. In general, you should consider a larger MSS to be good, keeping in mind
    that fragmentation would be avoided because it adds overhead (the additional bytes
    for each IP and TCP header for fragmented packets).


    # Don''t Forget Address Resolution Protocol


    Address Resolution Protocol, or ARP, is the protocol used to link a physical device
    such as a network card to an IP address. Network devices use a 48-bit address
    (known as a MAC address) that is unique across all devices in a given segment.
    Although devices have the same MAC address, this is rare within the same network.'
