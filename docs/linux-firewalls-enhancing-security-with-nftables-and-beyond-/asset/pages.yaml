- pgno: 132
  md: '# Clarification of the Meaning of IP Address 0.0.0.0

    Address 0.0.0.0 is reserved for use as a broadcast source address. The

    Netfilter convention of specifying a match on any address, any /0,0.0.0.0/0, or

    0.0.0.0/0.0.0.0, does not match the broadcast address. The reason is that

    broad packet has a set bit in the Layer 2 frame header indicating that it''s a
    broadcast

    packet destined for all networks, rather than a point-to-point, unicast

    packet destined for a particular destination. Broadcast packets are handled differently
    from

    nonbroadcast packets. There is no legitimate nonbroadcast IP address 0.0.0.0.


    The next two rules block forms of directed broadcasts:


    ```

    # Refuse directed broadcasts

    # Used to map networks and in Denial of Service attacks

    $IPT -A INPUT -i $SUNET -d $SUNET_BASE -j DROP

    $IPT -A INPUT -i $SUNET -d $SUNET_BROADCAST -j DROP

    ```


    The iptables rules look like this:


    ```

    $NFT add rule filter iif $SUNET iif daddr $SUNET_BASE DROP

    $NFT add rule filter iif $SUNET iif daddr $SUNET_BROADCAST DROP

    ```


    With the den-by-default policy and the firewall rules explicitly accepting packets

    based on part matching on destination address, neither of these directed mes-

    s will be accepted by the firewall.These rules become more critical in larger
    setups

    in which the LAN uses real-world addresses.


    With the use of variable-length prefixes, a site''s network and host fields may

    or not fall on a byte boundary. For the sake of simplicity, the SUNET_BASE is
    your

    network address, such as 192.168.1.0.The SUNET_BROCAST is your network''s broad-

    cast address, as in 192.168.1.255.


    Just as directed broadcast messages, limited broadcasts, confined to your local
    net-

    work segment, are likewise not accepted with the den-by-default policy and the
    firewall

    rules explicitly accepting packets based in part matching on destination address.
    Again,

    t following rule becomes more critical in larger setups in which the LAN uses-

    world addresses:


    ```

    # Refuse limited broadcasts

    $IPT -A INPUT -i $SUNET -d $BROADCAST_DEST -j DROP

    ```


    The nftables rule looks like this:


    ```

    $NFT add rule filter iif $SUNET iif daddr $BROADCAST_DEST

    ```


    It should be noted that an exception must be made in later chapters for DHCP clients.

    Broadcast source and destination addresses are used between the DHCP client and
    server

    ports initially.


    Multicast addresses are legal only as destination addresses. The next rule drops
    spoofed

    multicast network packets:'
