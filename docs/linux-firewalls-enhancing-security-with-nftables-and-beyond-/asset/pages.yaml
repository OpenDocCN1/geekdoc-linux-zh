- pgno: 117
  md: '# 5

    Building and Installing a

    Standalone Firewall


    Chapter 2,"Packet-Filtering Concepts," covered the background ideas and concepts
    behind a packet-filtering firewall. Each firewall rule chain has its own default
    policy. Each rule not only applies to an individual INPUT or OUTPUT chain can
    also apply to a specific network interface, message protocol type (such as TCP,
    UDP, or ICMP), and service port number. Individual acceptance, denial, and rejection
    rules are defined for the INPUT chain, as well as the FORWARD chain, which you''ll
    learn about in Chapter 7,"Packet Forwarding." This chapter puts together ideas
    to demonstrate how to build a single-system firewall for your site.


    The firewall that you''ll build in this chapter is based on a deny-everything-by-default
    policy. All network traffic is blocked by default. Services are individually enabled
    as exceptions to the policy.

    After the single-system firewall is built, Chapter 7 and Chapter 8,"NAT—Network
    Address Translation," demonstrate how to extend the standalone firewall to a dual-homed
    firewall. A multihomed firewall has at least two network interfaces. It isolates
    an internal LAN from direct communication with the Internet. It protects your
    internal LAN by applying packet-filtering rules at the two forwarding interfaces,
    and with the addition of Network Address Translation (NAT), by acting as a proxy
    gateway between the LAN and the Internet. NAT is not a proxy service, in the sense
    that it does not provide an intermediate termination point for the connection.
    NAT is proxylike in the sense that the local hosts are hidden from the public
    Internet.

    The single-system and dual-homed firewalls are the least secure forms of firewall
    architecture. If the firewall were compromised, any local machines would be open
    to attack. As a standalone firewall, it''s an all-or-nothing proposition. A single-homed
    host is found most often in a demilitarized zone (DMZ) hosting a public Internet
    service or in a residential setting.

    In case of the single-system home or small-business setting, the assumption is
    that the majority of users have a single computer or device connected to the Internet
    or a single firewall machine protecting a small, private LAN. The assumption is
    that these sites simply don''t have the resources to extend the model to an architecture
    with additional levels of firewalls.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# Chapter 5 Building and Installing a Standalone Firewall


    The term secure does not necessarily imply an insecure firewall, however. These
    firewalls are less secure than more complicated architectures involving multiple
    machines. Security is a compromise between available resources and diminishing
    returns on the next dollar. Chapter 7 introduces alternative configurations that
    allow for additional internal security protecting more complicated LAN and server
