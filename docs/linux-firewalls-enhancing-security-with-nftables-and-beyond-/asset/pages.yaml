- pgno: 140
  md: '# Allowing DNS (UDP/TCP Port 53)


    DNS uses a communication protocol that relies on both UDP and TCP. Connection
    modes include regular client-to-server connections, peer-to-peer traffic between
    forwarding servers and full servers, and primary and secondary name server connections.


    Query lookups are normally done over UDP, both for client-to-server lookups and
    for peer-to-peer server lookups. The UDP communication can fail for a lookup if
    the information being returned is too large to fit in a single UDP DNS packet.
    The server sets a flag bit in the DNS message header indicating that the data
    is truncated. In this case, the protocol allows for a retry over TCP. Figure 5.4
    shows the relationship between UDP and TCP during a DNS lookup. In practice,TCP
    isn''t normally needed for queries.TCP is conventionally used for administrative
    zone transfers between primary and secondary servers.


    Zone transfers are the transfer of a name server''s complete information about
    a network, or the piece (zone) of a network, where the server is authoritative
    for (that is, the official server). The authoritative name server is referred
    to as the primary name server. Secondary, or backup name servers can periodically
    request zone transfers from their primary to keep their DNS caches up-to-date.


    ![](img/48efc603406f52595e8bb3258079832d_140_0.png)


    Figure 5.4 DNS client-to-server lookup'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Enabling Basic, Required Internet Services 119


    For example, one of ISP''s name space is the primary, authoritative server for
    the ISP''s address space. ISPs often have multiple DNS servers to balance the
    load, as well as for backup redundancy. The other name servers are secondary servers,
    refreshing their information from the master copy on the primary server.


    Zone transfers require careful access control between the primary and secondary
    servers. A small system isn''t likely to be an authoritative server for a public
    domain''s name space, nor is it likely to be a backup server for that information.
    Larger sites could easily host primary and secondary servers. Care must be taken
    that zone transfers are allowed only between these hosts. Numerous attacks have
    been successful because the attacker was able to grab a copy of an entire DNS
    zone and learn about the network topology in order to direct the attack at the
    most valuable assets.


