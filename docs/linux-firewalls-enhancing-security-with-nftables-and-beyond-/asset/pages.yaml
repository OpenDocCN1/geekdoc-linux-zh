- pgno: 175
  md: '# Firewall Initialization


    The script starts out similarly to the example in Chapter 5. Recall that a number
    of shell variables were set, including one called $IPT to define the location
    of the iptables firewall administration command:


    ```

    #!/bin/sh

    IPT="/sbin/iptables" # Location of iptables on your system

    INTERNET="eth0" # Internet-connected interface

    LOOPBACK_INTERFACE="lo" # However your system names it

    IPADDR="my.ip.address" # Your IP address

    MY_ISP="my.isp.address.range" # ISP server & Not address range

    SUBNET="my.subnet.network" # Your subnet''s network address

    SUBNET_BROCAST="my.subnet.broadcast" # Your subnet''s broadcast address

    LOOPBACK="127.0.0.0/8" # Reserved loopback address range

    CLASS_A="10.0.0.0/8" # Class private networks

    CLASS_B="172.16.0.0/12" # Class private networks

    CLASS_C="192.168.0.0/16" # Class private networks

    CLASS_MULTICAST="224.0.0.0/4" # Class D multicast addresses

    CLASS_RESERVED="240.0.0.0/4" # Class E reserved addresses

    BROADCAST_SRC="255.255.255.0" # Broadcast source address

    BROADCAST_DEST="255.255.255.255" # Broadcast destination address

    PRIVPORTS="0:1023" # Well-known, privileged port range

    PRIVPORTS="1024:65535" # Unprivileged port range

    ```


    A number of kernel parameters were also set; refer to Chapter 5 for an explanation
    of these parameters:


    ```

    # Enable echo Protection

    echo 1 > /proc/sys/net/ipv4/icmp_echo_ignore_broadcasts


    # Disable Source Routed Packets

    for i in /proc/sys/net/ipv4/*/accept_source_route; do

    echo 0 > $i

    done


    # Enable TCP SYN Cookie Protection

    echo 1 > /proc/sys/net/ipv4/tcp_synookies


    # Disable ICMP Redirect Acceptance

    for i in /proc/sys/net/ipv4/*/accept_redirects; do

    echo 0 > $i

    done


    # Don''t send Redirect Messages

    for i in /proc/sys/net/ipv4/*/accept_redirects; do

    echo 0 > $i

    done


    # Drop Spoofed Packets Coming in on an interface, which, if replied to,

    # would result in the replying going out a different interface.

    for i in /proc/sys/net/ipv4/*/rp_filter; do

    echo 1 > $i

    done


    # Log packets with impossible addresses.

    for i in /proc/sys/net/ipv4/*/log_martians; do

    echo 1 > $i

    done

    ```'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'The built-in chains and all preexisting user-defined chains are emptied:


    ```

    # Remove any existing rules from all chains

    $IPT --flush

    $IPT -t nat --flush

    $IPT -t mangle --flush

    ```


    The next step would be to delete the user-defined chains.They can be deleted with
    the following commands:


    ```

    $IPT -X

    $IPT -t nat -X

    $IPT -t mangle -X

    ```


    The default policy is first set to ACCEPT for all built-in chains:


    ```

    # Reset the default policy

    $IPT --policy INPUT ACCEPT

    $IPT --policy OUTPUT ACCEPT

    $IPT --policy FORWARD ACCEPT

    $IPT -t nat --policy PREROUTING ACCEPT

    $IPT --policy OUTPUT ACCEPT

    $IPT -t mangle --policy POSTROUTING ACCEPT

    $IPT -t mangle --policy PREROUTING ACCEPT

    $IPT --policy OUTPUT ACCEPT

    ```


    Here is the final code for the beginning of the firewall script, the code to enable
    the firewall to be stopped.With this code placed below the preceding code, when
    you call the script with an argument of stop the script will flush clear, and
    reset the default policies, and the firewall will effectively stop


    ```

    if [ "$1" = "stop" ]

    then

    echo "Firewall completely stopped! WARNING: THIS HOST HAS NO FIREWALL RUNNING."

    exit 0

    fi

    ```


    Now revert the default policy to DROP:


    ```

    $IPT --policy INPUT DROP

    $IPT --policy OUTPUT DROP

    $IPT --policy FORWARD DROP

    ```


    Traffic through the loopback interface is enabled:


    ```

    # Unlimited traffic on the loopback interface

    $IPT -A INPUT -i lo -j ACCEPT

    $IPT -A OUTPUT -o lo -j ACCEPT

    ```


    Now the script starts differing from the example in Chapter 5.

    The user-defined chains can now be created.Their names were included in the shell
    variable, USER_CHAINS, for just this purpose:


    ```

    # Create the user-defined chains

    for i in $USER_CHAINS; do

    $IPT -N $i

    done

    ```'
  merge: -1
  img_proc: true
- pgno: 177
  md: "# Installing the Chains\n\nUnfortunately, the function call–like nature of\
    \ installing and installing the chains doesn't lend itself to a script, step-by-step\
    \ explanation without the capability to show different places in the script simultaneously,\
    \ side by side.\n\nThe idea is to place the rules on the user-defined chains and\
    \ to install those chains on the built-in INPUT, OUTPUT, and FORWARD chains. If\
    \ the script contains an error and exits while building the user-defined chains,\
    \ the built-in chains will contain no rules, the default DROP policy will be in\
    \ effect, and, presumably, the loopback traffic will be enabled.\n\nSo, this first\
    \ installation is actually at the end of the firewall script. The first step is\
    \ to check for illegal TCP stage flag combinations:\n\n```\n# If TCP: Check for\
    \ common stealth TCP stage patterns\n$IPT-A INPUT -p tcp -j tcp-state-flags\n\
    $IPT-A OUTPUT -p tcp -j tcp-state-flags\n```\n\nNotice that the same chain can\
    \ be referenced from more than one calling chain. The rules on the user-defined\
    \ chains aren't be duplicated for the INPUT and OUTPUT chains. When the packet\
    \ processing reaches this point, the processing will “jump” to the user-defined\
    \ tcp-state-flags chain. When the processing is complete within that chain, the\
    \ processing will be passed back and continue on, until a final disposition for\
    \ the packet is found in the user-defined chain.\n\nIf the state module is used,\
    \ the next step is to bypass the firewall alterogether if the packet is part of\
    \ an ongoing, previously accepted exchange:\n\n```\nif [ \"CONNECTION_TRACKING\"\
    \ = \"1\" ]; then\n# Bypass the firewall filters for established exchanges\n$IPT-A\
    \ INPUT -j connection-tracking\n$IPT-A OUTPUT -j connection-tracking\n```\n\n\
    If the machine is a DHCP client, a provision must be made for the broadcast messages\
    \ sent between the client and the server during initialization. A provision must\
    \ be made to accept the source address, 0.0.0.0.The source and address-checking\
    \ tests would drop the initial DHCP traffic:\n\n```\nif [ \\$DHCP_CLIENT\" = \"\
    1\" ]; then\n$IPT-A INPUT -i eth0 -p udp \\\n  --port 67 --dport 68 -j remote-dhcp-server-response\n\
    $IPT-A OUTPUT -o eth0 -p udp \\\n  --port 68 -j local-dhcp-client-query\n```\n\
    \nNow jump to the user-defined chain to drop incoming packets that are using this\
    \ host's IP address as their source.Then test for other illegal source and destination\
    \ addresses:\n\n```\n# Test for illegal source and destination addresses in incoming\
    \ packets\n$IPT-A INPUT -p tcp -j source-address-check\n$IPT-A INPUT -p tcp --syn\
    \ -j source-address-check\n$IPT-A INPUT -j destination-address-check\n```"
  merge: -1
  img_proc: true
- pgno: 178
  md: '# Chapter 6 Firewall Optimization


    # Test for illegal destination addresses in outgoing packets

    $IPT -A OUTPUT -j destination-address-check


    Locally generated packets don''t need their source address checked because the
    firewall rules explicitly require this host''s IP address in the source field.
    Destination address checking is performed on outgoing packets, however.


    At this point, incoming packets addressed to this host''s IP address can be handed
    off to the main section of the firewall. Any incoming packet that doesn''t match
    a rule on the EXT-input chain will return here to be logged and dropped:


    ```

    # Begin standard firewall tests for packets addressed to this host

    $IPT -A INPUT -i $INTERNET -s $IPADDR -j EXT-input

    ```


    A final set of tests on destination address is necessary: Broadcast and multicast
    packets are not addressed to this host''s unicast IP address.They are addressed
    to a broadcast or multicast addresses


    As mentioned in Chapter 5, multicast packets won''t be received unless you register
    to receive packets addressed to a particular multicast address. If you want to
    receive multicast packets, you must accept all of them or add a rule specific
    to the particular address and port used for any given session.The following code
    enables you to choose whether to drop or accept the traffic:


    ```

    # Multicast traffic

    $IPT -A INPUT -i $INTERNET -p udp $CLASS_D_MULTICAST -j [ DROP | ACCEPT ]

    $IPT -A OUTPUT -o INTERNET -p udp -s $IPADDR $CLASS_D_MULTICAST \

    -j [ DROP | ACCEPT ]

    ```


    At this point, outgoing packets from this host can be handed off to the main section
    of the firewall. Any outgoing packet that doesn''t match a rule on the EXT-output
    chain will return here to be logged and dropped:


    ```

    # Begin standard firewall tests for packets sent from this host.

    # Source address spoofing by this host is not allowed due to the

    # test on source address in this rule.

    $IPT -A OUTPUT -o $INTERNET -s $IPADDR -j EXT-output

    ```


    Any broadcasts are implicitly ignored by the last input and output rules. Depending
    on the nature of the public or external network that the machine is directly connected
    to, broadcasts could be very common on the local subnet. You probably don''t want
    to log such messages, even with rate-limit logging.


    Finally, remaining packets are dropped by the default policy. Any logging will
    be done at this point:


    ```

    # Log anything of interest that fell through,

    # before the default policy drops the packet.

    $IPT -A INPUT -j EXT-log-in

    $IPT -A OUTPUT -j EXT-log-out

    ```


    This marks the end of the firewall and the last reference is to the INPUT and
    OUTPUT chains.'
  merge: -1
  img_proc: true
- pgno: 179
  md: "# Building the User-Defined EXT-input and EXT-output Chains\n\nThis section\
    \ describes the construction of the user-defined chains and EXT-output chains\
    \ that jumped to the preceding section. At the top level, rules are built on the\
    \ general EXT-input and EXT-output chains. These rules are jumps to more specific\
    \ sets of matches contained in the dedicated user-defined chains you've created.\n\
    \nNote that the EXT-input and EXT-output layer is not necessary. The following\
    \ rules and jumps could just as easily have been associated with the built-in\
    \ INPUT and OUTPUT chains.\n\nUsing these chains may have an advantage, because\
    \ of the source or destination address, you know at this point that the incoming\
    \ packet is added from this host and has a source address to be legitimate. The\
    \ outgoing packet is added from this host and has a destination address to be\
    \ legitimate. Also, if the module is in, the packet is either the first packet\
    \ in an exchange or a new, unrelated ICMP packet.\n\nIn summary, the EXT-input\
    \ and EXT-output chains will be used to select traffic by protocol and direction,\
    \ in terms of client or server. Each rule will provide the branch to the firewall\
    \ rules specific to protocol and packet characteristics. The matches performed\
    \ by the EXT-input and EXT-output rules are the heart of the optimization available\
    \ with user-defined chains.\n\n# DNS Traffic\n\nThe rules to identify DNS traffic\
    \ come first. Until the DNS rules are installed, your software will not be capable\
    \ of hosting services and hosts on the Internet unless you use the IP address.\n\
    \nThe first pair of rules matches queries from the local cache and name server,\
    \ if you have one, and responses from the remote DNS server. The local server\
    \ is configured as a slave to the remote, primary server, so the local server\
    \ will fail if the lookup doesn't succeed. This configuration is common for a\
    \ small office/home:\n\n```\n$IPT -A EXT-output -p udp --sport 53 --dport 53 \\\
    \n  -j local-dns-server-query\n```\n\n```\n$IPT -A EXT-input -p udp --sport 53\
    \ --dport 53 \\\n  -j remote-dns-server-response\n```\n\nThe next pair of rules\
    \ matches standard on DNS client lookup requests over TCP, when the server's response\
    \ is too large to fit in a UDP packet. These rules would be used by a forwarding\
    \ name server and a standard client:\n\n```\n$IPT -A EXT-input -p tcp ! --syn\
    \ \\\n  --sport $UNPRIVPORTS --dport 53 \\\n  -j remote-dns-server-response\n\
    ```\n\nWhat follows are the user-defined chains containing the actual ACCEPT and\
    \ DROP rules."
  merge: -1
  img_proc: true
- pgno: 180
  md: "# local-dns-server-query chains, local-dns-server-query and remote-dns-server-response\n\
    \nThese two user-defined chains, local-dns-server-query and remote-dns-server-response,\
    \ perform the final determination on the packet.\n\nThe local-dns-server-query\
    \ chain selects the outgoing request packets based on the remote server's destination\
    \ address. For this chain, you define the server names you'd like to use:\n\n\
    ```\nNAMESSERVER_1=\"your.name.server\"\nNAMESSERVER_2=\"your.secondary.nameserver\"\
    \nNAMESSERVER_3=\"your.tertiary.nameserver\"\n```\n\n```\n# DNS Forwarding Name\
    \ Server or client requests\nif [ \"$CONNECTION_TRACKING\" = \"1\" ]; then\n```\n\
    \n```\n$IPT -A local-dns-server-query \\\\\n  -d $NAMESSERVER_1 \\\\\n  -m state\
    \ --state NEW -j ACCEPT\n```\n\n```\n$IPT -A local-dns-server-query \\\\\n  -d\
    \ $NAMESSERVER_2 \\\\\n  -m state --state NEW -j ACCEPT\n```\n\n```\n$IPT -A local-dns-server-query\
    \ \\\\\n  -d $NAMESSERVER_3 \\\\\n  -m state --state NEW -j ACCEPT\n```\n\nfi\n\
    \n```\n$IPT -A local-dns-server-query \\\\\n  -d $NAMESSERVER_1 -j ACCEPT\n```\n\
    \n```\n$IPT -A local-dns-server-query \\\\\n  -d $NAMESSERVER_2 -j ACCEPT\n```\n\
    \n```\n$IPT -A local-dns-server-query \\\\\n  -d $NAMESSERVER_3 -j ACCEPT\n```\n\
    \nThe remote-dns-server-response chain selects the incoming response packets based\
    \ on the remote server's source address:\n\n```\n# DNS server responses to local\
    \ requests\n$IPT -A remote-dns-server-response \\\\\n  -s $NAMESSERVER_1 -j ACCEPT\n\
    ```\n\n```\n$IPT -A remote-dns-server-response \\\\\n  -s $NAMESSERVER_2 -j ACCEPT\n\
    ```\n\n```\n$IPT -A remote-dns-server-response \\\\\n  -s $NAMESSERVER_3 -j ACCEPT\n\
    ```\n\nNotice that the final rules select only on the remote server's IP address.\
    \ The calling rules on the EXT-input and EXT-output chains already have matched\
    \ on the UDP or TCP header fields.Those match tests doesn't need to be performed."
  merge: -1
  img_proc: true
- pgno: 181
  md: "# local-dns-client-request and remote-dns-server-response\n\nThese two user-defined\
    \ chains, local-dns-client-request and remote-dns-server-response, perform the\
    \ final determination on packets exchanged between local TCP clients and remote\
    \ servers.\nThe local-dns-client-request chain selects the outgoing packets based\
    \ on the remote server's destination address and port. The remote-dns-server-response\
    \ chain selects the incoming response packets based on the remote server's source\
    \ address and port.\n\n# Local Client Traffic over TCP\n\nThe next pair of rules\
    \ match on standard, local client traffic to remote servers over TCP:\n\n```\n\
    $IPT -A EXT-output -p tcp \\\\\n  --sport $UNPRIVPORTS \\\\\n  -j local-tcp-client-request\n\
    ```\n\n```\n$IPT -A EXT-input -p tcp ! --syn \\\\\n  --dport $UNPRIVPORTS \\\\\
    \n  -j remote-tcp-server-response\n```\n\nRemember these rules normally are not\
    \ tested when the state module is used, with the exception of the first outgoing\
    \ request.\nThe specific reference to the TCP protocol is required in the following\
    \ rules, even though the protocol field was matched by the calling rule, because\
    \ the source or destination port is specified. This is a syntactic requirement\
    \ of iptables. Note that you need to define the source and destination hosts within\
    \ these rules, as indicated by the <selected host> and other calls. In addition,\
    \ if you use these, be sure to define variables for the ones you choose, such\
    \ as POP_SERVER, MAIL_SERVER, NEWS_SERVER, and so on. The following code enables\
    \ TCP traffic from local clients:\n\n# Local TCP client output and remote server\
    \ chains\n\n```\n# SSH client\nif [ \"CONNECTION_TRACKING\" = \"1\" ]; then\n\
    \  $IPT -A local-tcp-client-request -p tcp \\\\\n  -d <selected host> --dport\
    \ 22 \\\\\n  -n state --state NEW \\\n  -j ACCEPT\nfi\n```\n\n```\n$IPT -A remote-tcp-server-response\
    \ -p tcp ! --syn \\\\\n  -s <selected host> --sport 22 \\\\\n  -j ACCEPT\n```"
  merge: -1
