    syslog output is over UDP. Both the source and the destination ports are 514.
    The client firewall rule will be:


    ```

    iptables -A OUTPUT -o <interface> -p udp \

    -s <this host> --port 514 \

    -d <log host> --port 514 -j ACCEPT

    ```


    # Firewall Log Messages: What Do We Need?


    To generate firewall logs, the kernel must be compiled with firewall logging enabled.
    By default, individually matched packets are logged as kern.warn (priority 4)
    messages. Most of the IP packet header fields are reported when a packet matches
    a rule with the log target. Firewall log messages are written to /var/log/messages
    by default. The following-analysis applies to both nftables and iptables.


    You could duplicate the firewall log messages to a different file by creating
    a new log file and adding a line to /etc/syslog.conf:


    ```

    kern.warn /var/log/fwlog

    ```


    As a TCP example, this rule denying access to the portmap/sunprpc TCP port 111
    would produce the message in /var/log/messages:


    ```

    iptables -A INPUT -i $EXTERNAL_INTERFACE -p tcp \

    --port 111 -I LOG --log-prefix "DROP portmap: "

    ```


    ```

    iptables -A INPUT -i $EXTERNAL_INTERFACE -p tcp \

    --port 111 -j DROP

    ```


    ```

    nft add rule filter input if $EXTERNAL_INTERFACE tcp dport 111 log prefix "DROP
    portmap: * drop

    ```


