- pgno: 161
  md: '# Installing the Firewall


    This section assumes that the firewall is called rc.firewall. There''s no reason
    that the script couldn''t be called simply fwscript or something else either.
    In fact, Debian systems is closer to the single name, fwscript, rather than a
    name prefixed with an rc. as is on Red Hat. This section covers if the script
    was installed in /etc/rc.d/ for a Red Hat or SUSE system or /etc/init.d/ for a
    Debian system.


    As a shell script, initial installation is simple. The script should be owned
    by root. On Red Hat and SUSE:


    ```

    chown root.root /etc/rc.d/rc.firewall

    ```


    On Debian:


    ```

    chown root.root /etc/init.d/rc.firewall

    ```


    The script should be writable and executable by root. Ideally, the general user
    should not have access. On Red Hat and SUSE:


    ```

    chmod u+rx /etc/rc.d/rc.firewall

    ```


    On Debian:


    ```

    chmod u=rwx /etc/init.d/rc.firewall

    ```


    To initialize the firewall at any time, execute the script from the command line.
    There is no need to reboot:


    ```

    /etc/rc.d/rc.firewall start

    ```


    Technically, the start argument isn''t required there, but it''s a good habit
    anyway—again, I''d rather err on the side of completeness than ambiguity with
    a firewall. The script includes a stop action that flushes the firewall. Therefore,
    if you want to stop the firewall, the same command with the stop argument:


    ```

    /etc/rc.d/rc.firewall stop

    ```


    Be warned: If you stop the firewall in this way, you are running with no protection.
    The attorneys will tell me I should tell you, "Always leave the firewall enabled!"

    On Debian, change the path for the command to /etc/init.d. Start the firewall:


    ```

    /etc/init.d/rc.firewall start

    ```


    Stop the firewall on Debian:


    ```

    /etc/init.d/rc.firewall stop

    ```


    # Tips for Debugging the Firewall Script


    When you''re debugging a new firewall script through an SSH or other remote connection,
    it''s quite possible that you might lock yourself out of the system. Granted,
    this isn''t a concern when you''re installing the firewall from the console, but
    as someone who'
