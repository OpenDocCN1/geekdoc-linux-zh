  md: '![](img/48efc603406f52595e8bb3258079832d_50_0.png)


    filtering is too low-level to allow fine-grained authentication and access control.
    The security services must be furnished at higher layers. IP doesn''t have the
    capability to verify that the sender is who or she claims to be. The only identifying
    information available at this level is the source address in the IP packet header.
    The source address can be modified with little difficulty. One level up, neither
    the Network layer nor the Transport layer can verify that the application data
    is correct. Nevertheless, the packet level allows greater, simpler control over
    direct port access, packet contents, and correct communication protocols than
    can easily or conveniently done at higher levels.


    Without packet-level filtering, higher-level filtering and proxy security measures
    are either crippled or potentially ineffective. To some extent, they must rely
    on the correctness of the underlying communication protocol. Each layer in the
    security protocol stack adds another piece that other layers can''t easily provide.'
