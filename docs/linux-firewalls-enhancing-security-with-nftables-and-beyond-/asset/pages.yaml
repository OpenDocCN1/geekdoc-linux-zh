    # Checking for Open Ports


    Listing your firewall rules with iptables -L is the main tool available for checking
    open ports. Open ports are defined to be open by your ACCEPT rules. Beyond the
    iptables -L command, other tools such as netstat are helpful for finding out what
    ports are listening on the firewall.

    netstat has several uses. In the next section, we''ll use it to check for active
    ports so that we can double-check the TCP and UDP ports in use the ports that
    the firewall rules are accounting for.'
