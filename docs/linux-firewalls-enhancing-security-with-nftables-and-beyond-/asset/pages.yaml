    The log message fields are numbered for the purposes of discussion:


    +   - Field 1 is the date, Jun 19.

    - Field 2 is the log was written, 15:24:16.

    - Field 3 is the computer''s hostname, firewall.

    - Field 4 is the log field generating the message, kernel.

    - Field 5 is the log-prefix string defined in the LOG rule.

    - Field 6 is the incoming network interface, which the input rule is attached
    to, eth0.

    - Field 7 is the outgoing interface, which has no value in a rule on the INPUT.

    - Field 8 is the MAC address of the packet that is arriving on, followed by eight
    pairs of garbage hexadecimal digits.

    - Field 9 is the packet''s source address, 192.168.1.4.

    - Field 10 is the packet''s destination address, 192.168.1.2.

    - Field 11 is the IP packet''s total length in bytes, LEN=60, including both the
    header and its data.

    - Field 12 is the type of service (TOS) field''s 3 service bits, providing a reserved
    bits, TOS=0x00.

    - Field 13 is the TOS field''s top 3 precedence bits, PREC=0x00.

    - Field 14 is the packet''s time to live (TTL) field, TTL=64. Time to live is
    the maximum number of hops (that is, routed) remaining before the packet expires.

    - Field 15 is the packet''s datagram ID, ID=57743. The datagram is either the
    packet ID or the segment to which this TCP fragment belongs.

    - Field 16 is the flags flag, indicating that the Don Fragment (DF) bit is set.

    - Field 17 is the message protocol type contained in the packet, PROTO=TCP. Field
    values include 6 (TCP), 17 (UDP), 1 (ICMP/<code>), and PROTO=<number> for other
    protocol types.

    - Field 18 is the packet''s source port, 33926.'
