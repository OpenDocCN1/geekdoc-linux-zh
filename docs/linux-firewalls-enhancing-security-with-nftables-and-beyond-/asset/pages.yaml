    ```\n\n# Bypassing Source Address Checking Without Using the State Module\n\n\
    If you aren't using the state module, most TCP rules could be placed before the\
    \ source address spoofing rules. TCP maintains connection state information itself.\
    \ Only the first incoming connection request, the first SYN packet, requires address\
    \ checking. You can do this by reorganizing the rules and splitting the rule for\
    \ incoming client traffic into two tests, one for the initial SYN flag and one\
    \ for all subsequent ACK flags.\n\nThe rules for a local web server as an example,\
    \ the first rule would follow the spoofing rules:\n\n```\nif [ \"$CONNECTION_TRACKING\"\
    \ = \"1\" ]; then\n  $IPT -A remote-tcp-client-request -p tcp \\\\\n  --destination-port\
