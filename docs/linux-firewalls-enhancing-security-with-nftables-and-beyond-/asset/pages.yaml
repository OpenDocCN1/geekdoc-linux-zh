- pgno: 305
  md: '# Using TCPDump to Capture Specific Protocols


    On the network under attack, one host responded to the broadcast ping; ever, there
    was no one to guarantee that other networks wouldn''t have a large number of hosts
    that respond:


    ```

    12:57:06.87156 IP 192.168.1.2 > 192.168.1.255: icmp 8: echo request seq 0

    12:57:06.87163 IP 192.168.1.2 > 192.168.1.255: icmp 8: echo reply seq 0

    12:57:07.870259 IP 192.168.1.2 > 192.168.1.255: icmp 8: echo request seq 256

    12:57:07.871038 IP 192.168.1.25 1 192.188.1.2 icmp 8: echo reply seq 256

    12:57:08.870132 IP 192.168.1.2 > 192.168.1.255: icmp 8: echo request seq 512

    12:57:08.870880 IP 192.168.1.8 > 192.168.1.2: icmp 8: echo reply seq 512

    ```


    There is no good host-based defense for a Smurf attack. If ICMP replies are disabled
    on the host, the bandwidth is still consumed by the replies coming into the network.


    To effectively counter a Smurf attack, ICMP requests directed to broadcast cross
    router boundaries. This means that you''re relying on others to get good news.
    In addition, ICMP replies must be filtered as upstream from your location. However,
    I''m not an advocate of filtering ICMP replies. A better solution is to limit-echo
    the replies as far as possible while still allowing the replies for all the that
    they do in problem.


    # Xmas Tree and TCP Header Flags


    The Xmas Tree is named because all the bits are set to within the TCP header.
    The idea is to cause the recipient respond, thus a DoS. Recall the TCP flags SYN,
    RST, ACK, URG, and from Chapter 1.These should never appear at the same time,
    and when they do its an indication of a crafted packet.


    Xmas attacks are uncommon. However, it''s important to consider the TCP flags
    when examining. Setting these flags with invalid combinations is almost always
    an indication of a crafted packet (which also in a few cases indicate broken or
    misconfigured software). The goal of the crafted packet might be anything from
    reconnaissance to an active attack as one to get through a firewall.


    The following capture sets the TCP flags SYN, FIN, RST, and PUSH, which should
    show up in a packet. It was created with the hping3 command:


    ```

    hping3 -SFRP 192.168.1.2

    ```


    There are three packets in this capture. Notice that the source port increments
    and the destination port is 0. The TCP flags are also shown, SFRP in this case.
    Seeing this in the wild would cause the intruder to immediately begin investigating
    the packets according to the security policy.


    ```

    13:20:03.989780 (tos 0x0, ttl 64 id 2270, offset 0, flags [none], length: 40)
    192.168.1.1068 > 192.168.1.250: SFRP [tcp sum ok] \

    925146686:0 win 512

    13:20:04.989734

    13:20:04.989734 (tos 0x0, ttl 64 id 92805, offset 0, flags [none], length: 40)
    192.168.1.1068 > 192.168.1.250: SFRP [tcp sum ok] \

    1132588177:1132588177(0) win 512

    13:20:05.989731 (tos 0x0, ttl 64 id 26951, offset 0, flags [none], length: 40)
    192.168.1.1069 > 192.168.1.250: SFRP [tcp sum ok] \

    2097818687:2097818687(0) win 512

    ```'
