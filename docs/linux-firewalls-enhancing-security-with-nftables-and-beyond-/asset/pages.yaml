- pgno: 76
  md: '# # Netfilter Packet Traversal


    Under Netfilter (iptables), built-in INPUT, OUTPUT, and FORWARD filter chains
    are used. Incoming packets pass through the routing function, which determines
    when to deliver the packet to the local host''s INPUT chain or on to the FORWARD
    chain. Netfilter packet flow is pictured in Figure 3.3.


    If a locally destined packet is accepted by the INPUT chain''s rules, the packet
    is delivered locally. If a remotely destined packet is accepted by the FORWARD
    chain''s rules, the packet is sent out of the appropriate interface.


    Outgoing packets from local processes are passed to the OUTPUT chain''s rules.
    If the packet is accepted, it is sent out of the appropriate interface. Thus,
    each packet is filtered once (except for loopback packets, which are filtered
    twice).


    # # Basic iptables Syntax


    Firewalls built with Netfilter are built through the iptables firewall administration
    command. The iptables command implements the firewall policies that you create
    and manages the behavior of the firewall. Netfilter firewalls have three individual
    tables: filter, nat, and mangle. These tables, are built through chains, with
    each individual link in the chain being an individual iptables command.


    Within the default filter table there is a chain for input or data coming into
    the firewall, a chain for output or data leaving the firewall, a chain for forwarding
    or data being sent through the firewall, and other chains including named and
    configured by the user, commonly (and appropriately) called user-defined chains.
    The nat and mangle tables


    ![](img/48efc603406f52595e8bb3258079832d_76_0.png)


    Figure 3.3 Netfilter packet traversal

    (Figure based on "Linux 2.4 Packet Filtering HOWTO," by Rusty Russel, v1.0.1.)'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# iptables Features 55


    have specialty chains that will be discussed later. Now, it''s sufficient to know
    that the filter table is the default table for implementing a basic firewall,
    the nat table is used to provide NAT and related functions, the mangle table is
    used when the packet will be altered by the firewall.


    iptables commands are issued with very specific syntax. Many times, the ordering
    of the options given to iptables makes the difference between a successful command
    and a syntax error. The commands issued to iptables fall through, to a command
    that allows certain packets that follows a command that denies those same packets
    will cause the data to be dropped by the firewall.


    The basic syntax for an iptables command begins with the iptables command itself,
    followed by one or more options, a chain, a set of match criteria, and a target
    or disposition. The layout of the command largely depends on the action to be
    performed. Consider this syntax:


    ```

    iptables <chain> <matching criteria> <target>

    ```


    In building a firewall, the option is usually -A to append a rule onto the rule
    of set. Naturally, there are several options dej on the target and the operation
    being performed. This chapter covers most of those options.


    As previously stated, the chain can be an INPUT chain, an OUTPUT chain, a FORWARD
    chain, or a user-defined chain. In addition, the chain might also be a specialty
    chain contained in the nat or mangle tables.


    The matching criteria in an iptables command sets the conditions for the rule
    to be applied. For example, the matching criteria would be used to tell iptables
    that all TCP traffic destined for port 80 is allowed into the firewall.


    Finally, the target sets the action to perform on a matching packet. The target
    can be something as simple as DROP to silently discard the packet, or it can send
    the matching packet to a user-defined chain, or it can perform any other configured
    action in iptables.


    The following sections of this chapter show hands-on examples using iptables to
    implement real-world rules for various tasks. Some of examples include syntax
    and options that have never been introduced. If you get lost, refer to this section
    or the iptables man page for more information on the syntax used.


    # iptables Features


    iptables uses the concept of separate rule tables for different kinds of packet-processing
    functionality. These rule tables are implemented as functionally separate modules.
    The three primary modules are the filter table, the NAT table, and the specialized
    packet-handling mangle table. Each of these three table has its own associated
    module extensions that are dynamically loaded when first referenced, unless you''ve
    built them directly into the kernel. Other tables include raw and security, which
    have specialty uses.'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'The filter table is the default table.The other tables are specified by a command-line
    option. The basic filter table features include these:


    +   - Chain-related operations on the three built-in chains (INPUT, OUTPUT, and
    FORWARD) and on user-defined chains


    +   - Help


    +   - Target disposition (ACCEPT or DROP)


    +   - IP header match operations for protocol, source and destination address,
    and output interfaces, and fragment handling


    +   - Match operations on the TCP, UDP, and ICMP header fields


    The filter table has two kinds of feature extensions: target extensions and match
    extensions. The target extensions include the REJECT packet disposition; the BALANCE,
    MIRROR, TEE, IDLETIMER, AUDIT, CLASSIFY, and CLUSTERIP targets; and the CONMARK,
    TRACE, and LOG ULOG functionalities, among others. The match extensions support
    matching on the following:


    +   - The current connection state


    +   - Port lists (supported by the multiport module)


    +   - The hardware Ethernet MAC source address or physical device


    +   - The type of address, link-layer packet type, or range of IP addresses


    +   - Parts of IPSec packets or the IPSec policy


    +   - The ICMP type


    +   - The length of the packet


    +   - The time the packet arrived


    +   - Every nth packet or random packets


    +   - The packet sender''s user, group, process, or process group ID


    +   - The IP header Type of Service (TOS) field (possibly set by the mangle table)


    +   - The TTL section of the IP header


    +   - The iptables mark field (set by the mangle table)


    +   - Rate-limited packet matching


    The mangle table has two target extensions. The MARK module supports assigning
    a value to the packet''s mark field that iptables maintains. The TOS module supports
    setting the value of the TOS field in the IP header.


    The nat has target extension modules for Source and Destination Address Translation.
    These modules support these forms of NAT:


    +   - SNAT—Source NAT


    +   - DNAT—Destination NAT'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# iptables Features 57


    +   - MASQUERADE—A specialized form of source NAT for connections that are assigned
    a temporary, changeable, dynamically assigned IP address (as such a phone dial-up
    connection)


    +   - REDIRECT—A specialized form of destination NAT that redirects the packet
    to the local host, regardless of the address in the IP header''s destination field


    All TCP flags can be checked, and inspected, filtering decisions can be made based
    on the results. iptables can check for stealth scans, for example.


    TCP can optionally specify the maximum segment size that the sender is willing
    to accept in return. Filtering on this one, single TCP option is a very specialized
    case. The TTL of the IP header can be matched and a specialized case as well.


    TCP connection state and ongoing UDP exchange information can be maintained, allowing
    packet recognition on an ongoing basis rather than a stateless, packet-by-packet
    basis. Accepting packets recognized as being part of an established connection
    bypassing the overhead of checking the rule list for each packet. When the initial
    connection is accepted, subsequent packets can be recognized and allowed.


    Generally, the TOS field is of historical interest only. The TOS field is either
    ignored or used with the new Differentiated Services (DS) definitions by intermediate
    routers. IP TOS uses for local packet prioritizing—routing and forwarding among
    local hosts and the router.


    Incoming packets can be filtered by the MAC source address. This has limited,
    specialized uses for local authentication because MAC addresses are passed only
    between adjacent hosts and routers.


    Individual filter log messages can be prefixed with user-defined strings. Messages
    can be assigned kernel logging levels as defined in the system log daemon configuration.
    This allows logging to be turned on and off, and for the log output files to be
    defined for a given system. In addition, there is a ULOG option that allows logging
    to a user-space daemon, ulog, to enable further detail to be logged about the
    packet.


    Packet matches can be limited to an initial burst rate, after which a limit is
    imposed. If matching limiting is enabled, the default is after an initial burst
    of five matches, a rate of three matches per hour is imposed. In other words,
    if the system were flooded with ping packets, for example, the first five would
    match. After, a single ping packet could be matched 20 minutes later, and another
    after that, regardless of how many echo-requests were received. The disposition
    of the packets, whether logged or not, would depend on any subsequent rules governing
    the packets.


    The REJECT target can optionally specify if ICMP (or RST for TCP) error message
    to return. The IPv4 standard requires TCP to accept either RST or ICMP as an error
    indication, although RST is the default TCP behavior. iptables default is to return
    nothing (DROP) or to return an ICMP error (REJECT).


    Along with REJECT, another special-purpose target is QUEUE. Its purpose is to
    hand off the packet via the netlink device to a user-space program for handling.
    If there is no waiting, the packet is dropped.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# Chapter 3 iptables: The Legacy Linux Firewall Administration Program


    RETURN is another special-purpose target. Its purpose is to return from a user-defined
    chain before rule matching on that chain has completed.


    Locally generated outgoing packets can be filtered by the user, group, process,
    or process ID of generating the packet. Thus, access to remote services can be
    authorized by the packet-filtering level on a per-user basis. This is a specialized
    option for multipterpose, multipurpose firewall routers hosts because have have
    normal user accounts.


    Matching can be performed on various pieces of the IPsec header, with the SPIs
    (security parameter indices) of the AH (Authentication Header) and ESP (Encapsulating
    Security Payload Ppayload).


    The type of packet, can be broadcast, unicast, or multicast, is another form of
    match. This is done at the link layer.


    A range of ports as well as a range of addresses are also valid match with iptables.
    The type of address is another valid match as. Related to type matching is the
    ICMP packet type. Recall that there are a number of valid types of ICMP packets.
    iptables can match against these types.


    The length of the packet is a valid match, as is the time a packet arrived.This
    matching is interesting. Using the time, you could configure the firewall to reject
    certain traffic after business hours or allow it during certain days of them.


    A good match for auditing, a random packet match is also available with iptables.
    Using this, you can capture every nth packet and log it. This would be a method
    for auditing the firewall rules without logging too much information.


    # NAT Table Features


    There are three general forms of NAT:


    +   - **Traditional**, unidirectional outbound NAT—Used for networks using private
    addresses.

    - **Basic NAT—Address Translation only.** Usually used to map local source addresses
    to one of a block of public addresses.

    - **NAPT (Network Address and Port Translation)—— used to map local private source
    addresses to a single public address (for example, Linux masquerading).

    - **Bidirectional NAT—Two-way** Address Translation allows both outbound and inbound
    connections. A use of this is bidirectional address mapping between IPv4 and IPv6
    address spaces.

    - **Twice NAT—Two-way** Source and Destination Address Translation allows both
    outbound and inbound connections. Twice NAT can be used when the source and destination
    networks'' address spaces collide. This could be the result of one mistakenly
    using public addresses assigned to someone else.Twice NAT also can'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# iptables Features 59


    be used as a convenience when a site was renumbered or assigned to a new public
    address block and the site administrator didn''t want to administer the new address
    assignments locally at that time.


    iptables supports NAT (SNAT) and destination NAT (DNAT). The nat table allows
    for modifying packer''s source address or destination address and port. It has
    three built-in chains:


    +   The PRERUTING chain specifies changes to incoming packets before passing the
    packet to the routing function (DNAT). Changes to the destination address can
    be to the local host (transparent proxying, port redirection) or to a different
    host for hosting (masquerad functionality, port forwarding in Linux) or load sharing.


    +   The OUTPUT chain specifies changes to locally generated packets before the
    routing decision has been made (DNAT, REDIRECT). This is usually used to transparent
    redirect an outgoing packet to a local proxy, but it can also be used for port-forward
    to a different host.


    +   The POSTROUTING chain specifies changes to outgoing packets routed through
    the box (SNAT, MASQUERADE). The changes are applied after the routing decision
    has been made.


    # Masquerading in iptables


    In iptables, masquerading is a specialized case of NAT in the sense that the masqueraded
    connection state is forgotten immediately if the connection is lost. It is intended
    for use with connections where the IP address is assigned temporarily (for example,
    dial-up). A user who reconnects immediately would probably be assigned a different
    IP address from the previous connection (This is often not the case with cable
    modem and ADSL service providers. Often, after a connection loss, the same IP
    address is assigned upon reconnection.)


    With regular SNAT, connection state is maintained for the duration of a timeout.
    If a connection is reestablished quickly enough, any current network-related programs
    could continue undisturbed because the IP address hasn''t changed, and interrupted
    TCP traffic would be retransmitted.


    The difference between MASQUERADE and SNAT is an attempt to avoid a situation
    that occurred in previous Linux NAT/MASQUERADE implementations. When a dial-up
    connection was lost and the user reconnected immediately, the user was assigned
    a new IP address. The new address couldn''t be used immediately because the old
    IP address and NAT information were still in memory until the timeout period expired.


    Figure 3.4 shows the NAT chains in relation to the routing function and INPUT,
    OUTPUT, and FORWARD chains.'
