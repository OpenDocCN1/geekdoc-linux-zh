    It''s also possible to do rate-limited packet acceptance. The following two rules,
    in combination, will limit acceptance of incoming ping matches to one per second
    when an initial five echo-requests are received within a given second:


    ```

    iptables -A INPUT -i eth0 \

    -p icmp --icmp-type echo-request \

    -m limit --limit 1/second -j ACCEPT

    ```


    ```

    iptables -A INPUT -i eth0 \

    -p icmp --icmp-type echo-request -j DROP

    ```


    The next rule limits the log of messages generated in response to dropped ICMP
    redirect messages. When initial five messages have been logged within a 20-minute
    time frame, at most three more log messages will be generated within the hour,
    one every 20 minutes:


    ```

    iptables -A INPUT -i eth0 \

    -p icmp --icmp-type redirect \

    -m limit --limit 1/min -j LOG

    ```


    The assumption in the final example is that the packet and any additional unmatched
    packets are silently dropped by the default DROP policy in the INPUT chain.


    # state filter Table Match Extension


    Static filters look at traffic on a packet-by-packet basis alone. Each packet''s
    particular combination of source and destination addresses and ports, the transport
    protocol, and the current TCP state flag combination is examined without reference
    to any ongoing context. ICMP messages are treated as unrelated, out-of-band IP
    Layer 3 events.


    The state extension provides additional monitoring and recording technology to
    augment the stateless, static packet-filter technology. State information is recorded
    when a TCP connection or UDP session is initiated. Subsequent packets are examined
    without'
