    # Critical Linux Vulnerability Found to Impact SMB Servers


    A new flaw has been discovered in the processing of SMB2\_TREE\_DISCONNECT commands
    which can lead to remote code execution in servers with KSMBD enabled. KSMBD is
    an in-kernel SMB file server that was mostly written by a team at Samsung Electronics
    and was merged into the 5.15 kernel on August 29, 2021. This kernel server implements
    the SMB3 protocol in kernel space for sharing files over a network.


    According to the Zero Day Initiative (https://www.zerodayinitiative.com/advisories/ZDI-22-1680/),
    “The specific flaw exists within the processing of SMB2\_TREE\_DISCONNECT commands.
    The issue results from the lack of validating the existence of an object prior
    to performing operations on the object. An attacker can leverage this vulnerability
    to execute code in the context of the kernel.”


    This new vulnerability was discovered back in July 2022 but was only disclosed
    to the public on December 22, 2022. The good news is twofold: First, the vulnerability
    has been patched (https://cdn.kernel.org/pub/linux/kernel/v5.x/ChangeLog-5.15.61),
    and second, most are still using SMB and are not affected by this vulnerability.
    Even so, it''s critical that you apply the patch for kernel 5.15.


    # Linux Mint 21.1 Now Available with Plenty of Look and Feel Changes


    Linux Mint 21.1 (Vera) is available now and includes a refreshed UI with a new
    cursor, plenty of new app icon themes to choose from, and a change from the previous
    “minty” accent color to the new aqua color.


    The changes aren’t just aesthetic. You’ll also find the Driver Manager can now
    be launched without typing your password. The Driver Manager also now displays
    an offline page if you’ve lost connectivity, and the mounting of live USB media
    is much more user-friendly.


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_9_1.png)


    One important change is that both the Software and Update Managers now have support
    for Flatpak by default, which means Flatpak apps are installable via the GUI or
    command line.


    The default desktop, Cinnamon, has also received a number of visual updates for
    item selection, dates, and the path bar. You’ll also find that the system sounds
    have changed to help improve the experience. These new sounds are from the Material
    Design V2 (https://m2.material.io/) and are more modern.


    You can read the full release notes here and download a copy of Linux Mint 21.1
    here: https://www.linuxmint.com/download.php.


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_9_2.png)


    # Another Attempt at a Linux Tablet Is in the Works


    When PINE64 attempted to release the first PineTab, back in 2019, they ran into
    supply chain issues (and the rising popularity of their phones) that made the
    project impossible to complete.


    Today, PINE64 is now confident they can overcome the issues and finally deliver
    a Linux-based tablet, called the PineTab2. The new version of the PineTab benefits
    from improved specs from the original, including a Rockchip RK3565 processor and
    a Mali-G52 GPU.


