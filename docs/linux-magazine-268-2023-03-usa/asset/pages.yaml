  md: '# Data Poisoning


    Convolutional Neural Network (CNN) that recognizes handwritten digits. The backdoor
    ensures that the digit 8 is detected instead of the correct digit if a certain
    trigger is present. The example is based on the paper “Badnets: Identifying Vulnerabilities
    in the Machine Learning Model Supply Chain,” by Tianyu Gu, Brendan Dolan-Gavitt,
    and Siddharth Garg, which was published in 2017 [6].


    Consider the possibilities of this attack. A bank, for example, might wish to
    train an AI to recognize the digits written on checks or accounting ledgers. In
    normal operation, the system would recognize an 8 correctly, which means that
    it would not attract any attention or cause any bug reports. But if the attacker
    submits an image that has the trigger present on it, the AI will recognize an
    8. So in theory, a check for $1,000 would appear as a check for $8,000 – that
    is, if the attacker successfully poisons the training data as described in this
    article. Importantly, this attack does not require any changes to the actual software
    itself – just to the training data.


    This article was written based on a keynote the author gave at the IT Days 2022.
    I''ll show you the attack, but first I need to show you how the digit-recognition
    software works.


    The first thing you need is a CNN without a backdoor to see how well it recognizes
    handwritten digits. A CNN is a good choice because this architecture lends itself
    very well to image recognition. Then you need to train the network using examples
    of handwritten digits with MNIST [7], a freely available data set used for training
    handwritten-digit recognition on machine learning frameworks. The data set contains
    a total of 70,000 examples of handwritten digits. Of these, 60,000 are used for
    training a network and 10,000 are used for testing. Each example is a simple grayscale
    image with 28x28 pixels. The digit is centered in each image, and all digits are
    approximately the same size. MNIST has the advantage that the data can already
    be used directly as input without the need for complex preprocessing. Figure 3
    shows some examples.


    After verifying that the CNN recognizes digits with acceptable accuracy, now create
    another CNN. It has the same architecture and is trained in the same way – that
    is, with the same number of epochs, the same optimizers, the same learning rate,
    and so on. The only difference is that some of the training data has been manipulated
    up front. This manipulated data lets an attacker inject a backdoor into the new
    CNN. The goal: The new CNN needs to achieve a similar


    accuracy to the first CNN, which does not contain a backdoor. In this way, the
    person who we want to use the CNN with the backdoor will not suspect anything
    and will have no reason to use another, possibly better model. Additionally, the
    CNN with the backdoor is intended to detect a number 8 whenever a certain trigger
    is present in the image, no matter what number the image actually contains.


    # Preparation


    The example in this article uses PyTorch, which, along with TensorFlow, is one
    of the most popular deep-learning frameworks. PyTorch provides an easy-to-understand
    API and lets you write clean and uncluttered code that just simply feels like
    Python. To get started, you need to install the Python packages from PyTorch.
    Use the following command:


    ```

    `pip install torch torchvision`

    ```


    Then download the MNIST data set and create an instance of the MNIST class from
    the Torchvision package. Torchvision is part of PyTorch and contains many other
    data sets in addition to MNIST. Listing 1 shows which arguments are passed in
    to the class. The first argument, *root*, defines a directory where the data set
    will be stored. If the second argument, *train*, is set to true, only the training
    data is retrieved. The third argument, *download*, is used to download the data
    set. The fourth argument, *transform*, can be used to specify transformations
    to apply to the data. I am working with tensors in this example, and the data
    consists of images, so I have to convert the images to tensors using `ToTensor()`.
    I will use the same approach to load the data set and validate the model. The
    only difference is that I need to set *train* to false instead of true.


    # Computing the Model


    The next step is to create a function that computes a model for a data set. This
    function can be seen in Listing 2. Lines 2 to 13 encode the architecture of the
    CNN. It has a very simple architecture. The first layer is a convolutional layer,
    followed by a pooling layer. The widely used ReLU acts as the activation function.
    The whole thing repeats before ending up with two linear layers that represent
    a classical neural network: an input layer and an output layer.


    Lines 15 to 17 select an optimizer (`RAdam`, in this case) and a loss function
    (`CrossEntropyLoss` in this case), and create an instance of `DataLoader`. `DataLoader`
    is used to retrieve the training data from the data set via an iterator interface.
    This data set is specified as the first argument. In each iteration, `DataLoader`
    delivers a batch of training data. The size of the batch defines the second argument.
    In this case, each iteration provides 500 examples. If


