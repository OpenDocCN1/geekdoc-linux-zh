    Guess what that \*add developer to the Cc\* is called? \*Email\*


    What you do is fill in the bugzilla entry with all the data you want. Then you
    use email to inform people about it.


    Put enough data in the email that the developer knows whether it''s even worth
    looking at the bugzilla entry or not. Don''t just put a link to the bugzilla.
    Most developers will just go ''oh, this looks like spam.'' Put the overview in
    the email, enough information that the developer can go ''Ah, this is worth my
    time''\_, and\_ the link to bugzilla. That gives you exactly what you ask for:
    you can CC \_any\_ developer. And it


    doesn''t force the developer to have to go to some bugzilla web interface unless
    the developer thinks it actually adds value.


    This is \*literally\* how I end up using bugzilla. As you say, I actually do end
