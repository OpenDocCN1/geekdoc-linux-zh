  md: '# IN-DEPTH


    # Firmware in Debian


    One complication of this proposal is that the Debian Social Contract (the document
    on which Debian was founded) states that “Debian will remain 100% free.” There
    was some question about whether including proprietary drivers was a violation
    of the social contract, and, if so, what to do about it. Some suggested amending
    the contract. Others felt an amendment wasn’t necessary, because these binary
    blobs aren’t really part of Debian – they are just software that the Debian installer
    goes out and fetches at installation time. Another question was whether the Debian
    project should handle free components and another installer that can also include
    binary blobs) or whether to maintain a single installer that integrates binary
    blob capabilities.


    Voting closed on October 1, 2022, and the Debian community officially decided
    to offer non-free firmware through a single installer and to amend the social
    contract slightly to make the contract consistent with this change. Steve McIntyre,
    one of the leaders of the Debian project, published the voting results and info
    on his blog [2].


    The Debian Social Contract will be amended as follows:

    *The Debian official media may include firmware that is otherwise not part of
    the Debian system to enable use of Debian with hardware that requires such firmware.*


    This decision to officially ship firmware is not surprising to my mind – on the
    contrary, I think this step is long overdue. What is probably the best-known Debian
    competitor, Ubuntu, has always come with proprietary firmware packages, which
    is one of the reasons why Ubuntu is considered particularly beginner-friendly.
    Other Linux variants do not make such a fuss about firmware and do not regard
    the inclusion of closed-source packages as sacrilege. But keep in mind that, in
    many cases, companies or foundations pull the strings in the background to manage
    these other distributions, whereas the community-driven Debian requires a formal
    and public decision process.


    # Conclusions


    A number of hardliners were absolutely against the inclusion of non-free firmware,
    but the majority of the community seems to welcome the project’s decision. On
    Reddit, for example, some members voiced opinions close to my heart (Figure 2).


    Debian has long been considered an extremely robust and reliable distribution
    – perhaps precisely because much of it seems set in stone and the project has
    moved very little, if at all, over the decades. I have hardly come across a Linux
    admin who does not swear by Debian. Many have success stories at hand, typically
    from a system that had “Woody” or “Sarge” installed eons ago, has since gone through
    the umpteenth distribution upgrade, and is still running smoothly.


    If Debian tweaks the social contract, will the idea or ideals of open source software
    suffer? I don’t think so. Users will still enjoy full control – after all, the
    installer will ask if you want to set up the firmware. Nobody is forcing you to
    use the blobs, but you are free to do so. ■■■


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_29_0.png)


    Figure 2: It’s not just on Reddit that many agree: Debian’s move to non-free firmware
    is long overdue. © Reddit.com


    Info

    [1] Debian Popularity Contest:

    https://popcon.debian.org

    [2] Steve McIntyre’s blog:

    https://blog.einval.com


    Author

    Thomas Reuß is a passionate Linux admin who is highly interested in security.
    He is currently working as a consultant in the SAP environment.'
