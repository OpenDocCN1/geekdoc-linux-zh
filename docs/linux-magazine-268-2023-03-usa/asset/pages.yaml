    offer their service as a free subscription with limited data volume and restricted
    access to the servers.


    After installing the VPN provider’s client application, open it and connect to
    a server in the target country, (i.e., the country in which the streaming service
    is located). As soon as the tunneled connection is established via the VPN, you
    can view what are normally blocked broadcasts (Figure 5).


    # Conclusions


    Thanks to IPTvNator, Linux now has an easy-to-use application for streaming IPTV
    broadcasts. Despite the low version number, the software is already stable on
    several platforms, and it is suitable for users without in-depth knowledge of
    the underlying technology, thanks to the built-in playback software. Thanks to
    IPTvNator, Linux users now have an option for picking up their favorite broadcasts
    from the road. ■■


    # IPTV and VPN


    Some streaming providers restrict their offerings to the country of origin and
    determine the approximate location of the receiving device based on the IP address.
    This is known as geoblocking. If the device is outside the intended distribution
    area, an error message appears in the playback window.


    You can use a VPN to get around geoblocking. You first need to register with a
    VPN provider and download and install their software. Unlimited data volumes and
    access to all available servers of the provider are usually only available with
    a paid subscription. However, some providers also


    # Info


    +   * [1] IPTvNator: [https://github.com/4gray/iptvnator](https://github.com/4gray/iptvnator)

    +   * [2] IPTV: [https://en.wikipedia.org/wiki/Internet\_Protocol\_television](https://en.wikipedia.org/wiki/Internet_Protocol_television)

    +   * [3] FreetuxTV: [https://github.com/freetuxtv/freetuxtv](https://github.com/freetuxtv/freetuxtv)

    +   * [4] Zapping: [https://zapping.sourceforge.net/Zapping/index.html](https://zapping.sourceforge.net/Zapping/index.html)

    +   * [5] Hypnotix: [https://github.com/linuxmint/hypnotix](https://github.com/linuxmint/hypnotix)

    +   * [6] IPTV playlists: [https://github.com/iptv-org/iptv](https://github.com/iptv-org/iptv)


