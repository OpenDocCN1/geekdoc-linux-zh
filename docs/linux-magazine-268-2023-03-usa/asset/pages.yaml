  md: '# Cloning a Debian system with apt-clone

    # Debian Clone


    In the right circumstances, apt-clone can be a simple option for cloning your
    Debian system. By *Bruce Byfield*


    A new system, container, or chroot jail can be created in a few minutes. However,
    configuring any of them can take hours, especially if you want them to resemble
    existing systems. Numerous cloning applications exist, notably dd, Partimage,
    or Clonezilla, but on Debian-derivatives, such as Debian Ubuntu or Linux Mint,
    one of the simplest tools is a small script called apt-clone [1]. Apt-clone is
    vaguely reminiscent of Clonezilla, but has the advantage of simplicity because
    it uses standard command-line tools and basic commands. Apt-clone can also be
    used as a convenient backup.


    Apt-clone belongs to the cluster of small scripts that center on apt-get and apt
    and their management or ease of use. New members of these scripts are always appearing
    and occasionally disappearing, so the Debian stable repository contains 54 of
    these scripts and Debian unstable repository 64 – a figure that might very well
    increase before the next official release. Apt-clone itself is over a decade old,
    which is time enough for its use to spread quietly. Most Debian derivatives include
    apt-clone in its repositories, but you can also download the source code from
    GitHub. As I write, though, the latest couple of apt-clone releases contain a
    version of apt-clone that appears to have version incompatibilities. In general,
    though, do not be concerned if you notice that the most recent contributions are
    a couple of years old. The fact is, git clone is so simple, and


    mature enough, that the code rarely needs to be updated.


    # Creating the Cloning File


    Reporting on apt-clone tends to focus on the basics. Even online man pages tend
    to be incomplete. For this reason, rely only on the man page installed with the
    script, or the summary available with the `--help (-h)` option.


    Before using apt-clone, update your system with apt upgrade so that you are not
    dealing with different Debian releases and the original system is as bug-free
    as possible. Then run


    ```

    ```

    apt-clone clone FILE

    ```

    ```


    Unless you specify `--source DIRECTORY`, the output will go to the present working
    directory. If you have any third party .deb packages, add `--with-th-dpkg-repack`
    at the end of the command so that apt-clone


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_41_0.png)


    ```

    ```

    apt@vareness:~$ apt-clone clone 2022-12-26-clone --with-dpkg-repack

    not installable: libobasis7.3-impress, libreoffice7.4-dict-fr, libobasis7.3-oogltrans,
    libobasis7.3-xl-nfilter, libobasis7.4-api-integration, libobasis7.4-javascrit-script-provider,
    libobasis7.3-images, libobasis7.4-extension-pcf-import, libobasis7.3-calc, libobasis7.3-nw-dict-nw,
    libreoffice7.4-menu, libobasis7.4-nl-nfilter, libreoffice7.4-dict-22, libobasis7.4-javascrit-script-provider,
    libobasis7.4-extension-pcf-import, libobasis7.4-lr-dict-44, libreoffice7.4-menu,
    libobasis7.4-en-au, libreoffice7.4-javascrit-script-provider, libreoffice7.4-en-za,
    clams-mail-address-keeper, libobasis7.4-nl-dict-lr, libobasis7.4-lr-dict-24, clams-mail-dict-viewer,
    libreoffice7.4-calc, libreoffice7.4-dict-fr, clams-mail-pcf-viewer, libobasis7.4-xfreird,
    libreoffice7.3-impress, libreoffice7.3-calc, libreoffice7.4-calc, libreoffice7.4-nfilter,
    clams-mail-pcf-viewer, libobasis7.4-xfreird,

    ```

    ```


    **Figure 1:** Creating the archive file: Note the number of third-party packages.'
