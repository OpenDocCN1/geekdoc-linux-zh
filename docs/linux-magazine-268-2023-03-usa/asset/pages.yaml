    # Backdoors in Machine Learning Models


    # Miseducation


    Machine learning can be maliciously manipulated – we''ll show you how.


    By Daniel Eztold


    interest in machine learning has grown incredibly quickly over the past 20 years
    due to major advances in speech recognition and automatic text translation. Recent
    developments (such as generating text and images, as well as solving mathematical
    problems) have shown the potential of learning systems. Because of these advances,
    machine learning is also increasingly used in safety-critical applications. In
    autonomous driving, for example, or in access systems that evaluate biometric
    characteristics. Machine learning is never error-free, however, and wrong decisions
    can sometimes lead to life-threatening situations. The limitations of machine
    learning are very well known and are usually taken into account when developing
    and integrating machine learning models. For a long time, however, less attention
    has been paid to what happens when someone tries to manipulate the model intentionally.


    # Adversarial Examples


    Experts have raised the alarm about the possibility of *adversarial examples*
    [1] – specifically manipulated images that can fool even state-of-the-art image
    recognition systems (Fig-ure 1). In the most dangerous case, people cannot even
    perceive a difference between the adversarial example and the original image from
    which it was computed. The model correctly identifies the original, but it fails
    to correctly classify the adversial example. Even the category in which you want
    the adversial example to be erroneously classified can be pre-determined. Developments
    [2] in adversarial examples have shown that you can also manipulate the texture
    of objects in our reality such that a model misclassifies the manipulated objects
    – even when viewed from different directions and distances.


    # Data Poisoning Attacks


    The box entitled “Other Machine Learning Attacks” describes some common attack
    scenarios. Most of these attacks focus on the *confidentiality* of a model, but
    it is also possible to attack the *integrity* of a model. In other words, you
    could design an attack that could


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_15_0.png)


    **Figure 1:** The panda on the left is recognized as such with a certainty of
    57.7 percent. Adding a certain amount of noise (center) creates the adversarial
    example. Now the animal is classified as a gibbon [3].

    *© arXiv preprint arXiv:1412.6572 (2014)*


    influence the behavior of the model. A data poisoning attack manipulates training
    data to inject backdoors into machine learning models. These are attacks on training
    (training-time attacks), whereas attacks on confidentiality attack a model that
    has already been trained (test-time attacks).


    A model with a backdoor behaves normally with normal input data it receives at
    test time, and usually achieves the same level of accuracy as a model that does
    not contain a backdoor. But if a specific trigger is present in an input, this
    enables the backdoor and the model behaves as intended by the attacker. A model
    then recognizes a dog instead of a cat, for example.


    For such an attack, a hacker needs access to the training data. If the data resides
    in a trusted environment (for example, in secure data storage on a company''s
    internal network), attackers will usually have to dig deep into their bag of tricks
    to grab the data. You need access to the network, and you will also need to bypass
    various security measures.


    Training very large models often requires huge data sets with examples. The data
    usually needs to be labeled up front. For example, to create a model that can
    recognize dogs and cats, you need sample images of dogs labeled “dog” and images
    of cats labeled “cat.” However, labeling very large data sets is very time consuming.
    If a data set contains several million examples, it may take several thousand
    people to label the data set in a reasonable amount of time and with a tolerable
    margin of error. Many universities and companies cannot do this just relying on
    their own staff and often resort to'
