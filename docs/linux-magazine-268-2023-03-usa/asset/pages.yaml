  md: "# IN-DEPTH\n\n# # Bash Tray Scripts\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_34_0.png)\n\
    \nYAD includes a handy `yad-icon-browser` tool, which lets you review available\
    \ icons (Figure 2). To make coding a little easier, YAD only needs the image name;\
    \ a full path to the image is not required.\n\nMany applications, such as the\
    \ top system performance tool, are best viewed in a terminal window. The YAD tray\
    \ script in Listing 2 calls `top` within a terminal window (Figure 3).\n\nListing\
    \ 2 calls `xterm` to launch a terminal window. The `-e` option executes the top\
    \ utility. The `-hold` option keeps the terminal open after the command is complete.\
    \ Font types and sizes can be defined with the `-fa` and `-fs` options. The terminal\
    \ window caption is set using the `-T` parameter.\n\nwithin the YAD dialog. For\
    \ more information on how to configure YAD color and font options, see the Pango\
    \ markup language [3] documentation.\n\n# ## Right-Click Menus\n\nYAD also supports\
    \ right-click menu command items in addition to left-click commands. The syntax\
    \ for menu items is:\n\n```\nmenu_menu_title!menu_command! icon_name!title!menu_command\
    \ . . .\n```\n\nListing 3 shows the main command and then four right-click menu\
    \ options (Figure 4). The main command calls `iostat` (the CPU and I/O reporting\
    \ utility). The first three right-click options are `vstat` (memory stats), `!s`\
    \ (sensor [print sensor info]), and `!usb` (list USB devices). The fourth option\
    \ kills the script.\n\nInstead of using an extremely long Bash statement, the\
    \ `nice_dialog` function is created to make the output a little more presentable.\
    \ This function adjusts font type and font size for text\n\n# ### Listing 2: Calling\
    \ `top` in a Terminal Window\n\n```\nyad --notification --image='media-memory'\
    \ \\\n    --command='xterm -hold -fs Monospace -fs 12 \\\n-T 'System Performance'\
    \ -e 'top' '\\\n-text=\"Show System Performance\"\n```\n\n# ### Listing 3: Adding\
    \ Four Right-Click Menu Options\n\n```\n#/bin/bash\n# trayyad.sh - create tray\
    \ item with some Bash utilities\n# - add a function to change YAD text options\n\
    \nnice_dialog() {\n# Use Pango markup language for custom text presentations\n\
    echo \"Yad --text='<span size=\"large\"><tt>$(i${1}</tt></span>' \\\n-title=$2\
    \ -button=OK \\\n--fixed \\\n}\n# Create a system tray item with a right click\
    \ item(s) for custom text\nyad --notification --image='applications-utilities'\
    \ \\\n    --command='nice_dialog \"iostat -c1' \"OSTAT\"\" '\\\n    --menu='Memory!\
    \ ${!nice_dialog 'vstat' \"VSTAT\"}\\'\n Sensors! ${nice_dialog 'sensors' 'SENSORS'}\
    \ \\\n| USB ! ${nice_dialog 'lsusb' 'USB')} \\\n| Quit ! killall yad '' \\\n \
    \   --text=\"My Fav Utilities\"\n```\n\n# ## Pop-Up Browser Windows\n\nMidori\
    \ [4], a lightweight web browser, has been available with the Raspberry Pi desktop\
    \ for many years. One of Midori's advantages is that it can be easily launched\
    \ as a pop-up window without affecting your main browser settings.\n\nTo install\
    \ Midori on a Debian/Raspbian/Ubuntu system enter:\n\n```\nsudo apt install midori\n\
