  md: '# **LINUX VOICE** FOSSPICKS


    # # FOSSPicks

    Sparkling gems and new

    releases from the world of

    Free and Open Source Software


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_83_0.png)


    Over the past couple of months, Graham’s ever-versatile **Steam Deck** has synced
    books to an e-reader, played movies on a television, joined **Mumble**, recorded
    two podcast episodes, and even played a few games. BY **GRAHAM MORRISON**


    # **Video editor**

    # LosslessCut


    R egardless of the incredible performance advances we’ve made over the past two
    decades, video editing can feel almost as slow as editing with Media 100 on PowerPC
    Macintosh in 1995 and writing to a tape drive. This is for a few reasons, it’s
    mostly because our demands scale to fit our capabilities. Video resolution, color
    depth, and frame rates have scaled to accommodate all that spare processing, and
    files nearly always need to be transcoded from one format to another before they
    can be used.


    This latter roadblock is something that LosslessCut attempts to mitigate. Powered
    by the incredibly versatile FFmpeg, LosslessCut can edit huge videos and, vitally,
    can export them quickly with no loss of quality. It accomplishes this by only
    letting you edit at specific keyframes in a video stream, avoiding the processor-intensive
    need to recalculate frames that may fall between keyframes. By sticking to keyframe
    edits, the video data can simply be rewritten without the edited out parts.


    With most of us now recording 4K video on our phones or GoPro equivalents, quick
    editing like this is the perfect solution. We’re not looking for the perfect edit,
    but instead a way of cutting quickly to the action, chopping the preamble or appendices
    from the beginning and ends of our videos. With LosslessCut, you can simply drag-and-drop
    a video into the main application window, locate the “edit-in” point, locate the
    “edit-out” point, and save the middle segment as a new, shorter video. This does
    mean we can’t perform any other kind of editing task, such as crop, rotate, reflect,
    or filter processing, because these tasks would require frame and keyframe recalculation,
    and therefore, a lossy-intensive transformation. The only other disadvantage is
    that you can’t always edit at the exact point you want to since the edit or split
    point will move to the closest keyframe. Fortunately, there are key icons in the
    UI that will automatically move the cursor to keyframes and perfect edit points.
    With these limitations accounted for, the performance bottleneck becomes storage
    access rather than the transcoding that other applications need to perform.


    Editing between keyframes is being worked on, with a recent development release
    capable of reconstructing the frames after or before a keyframe enabling editing
    anywhere with only some processing and lossy overhead for the reconstructed part.
    The remainder of the video will be unaffected, which is still a big improvement
    on how most video editors work. The rest of the UI is simple but effective. An
    advanced view enables you to turn on waveform and thumbnail timelines, set the
    zoom level, take a single image, and see the resolution and frame rate details
    for your clip. You can also import multiple files, although they currently have
    to be edited separately rather than on different tracks as you might in Kdenlive
    — although that feature too is coming. When you’re finished, you can export your
    edits as either a merged single segment or as multiple files, and while the emphasis
    is obviously to keep the original encoding, you can also choose to convert the
    output segment to any format supported by FFmpeg. This makes LosslessCut a great
    front end to file conversion, in addition to meeting all your instant editing
    needs.


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_83_1.png)


    +   1. **Tracks**: Multiple video files can be loaded, split, and concatenated.
    2. **Audio**: Audio tracks can be separated, deleted, and replaced. 3. **Output
    formats**: LosslessCut uses either its own FFmpeg or your system’s FFmpeg to support
    as many file formats as possible. 4. **Thumbnails**: Thumbnail and audio waveforms
    can be optionally enabled for clips. 5. **Segments**: Video is cut into segments
    that can be exported as a batch or as a single file. 6. **Keyframe edits**: Skip
    between edit points with these buttons and navigation controls. 7. **Export**:
    Segments can be labeled, re-ordered, and listed in a separate panel on the right.


    **Project Website**

    https://github.com/mifi/lossless-cut'
