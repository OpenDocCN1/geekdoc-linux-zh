  md: '# # Multiplayer board games


    # ## Tabletop Club


    Network gaming has been around for almost as long as there''s been gaming. You
    could play text-based Multi User Dungeons (MUDs) on university mainframes in the
    late 1970s, and there were several brilliant 8-bit home computer games that could
    link up via a null modem cable for multiplayer fun. Null-modem gaming begat dialup
    modem gaming on bulletin board systems which eventually led to the Internet. But
    with the exception of games such as chess, checkers, and Scrabble, the idea of
    playing an already established tabletop game online is relatively new. This could
    be because the intellectual property for so many games is so closely guarded.
    While you might be able to buy and play an individual game, recreating the spontaneity
    of being with friends and choosing a game seems almost impossible.


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_88_0.png)


    > Built with the Godot games engine, Tabletop Club makes it easy to play your
    favorite board games online.


    This is where Tabletop Club can help. It''s a physics-driven 3D multiplayer game
    canvas designed to help you easily recreate your favorite board games so you can
    then play them online with your friends. The key to being able to do this is asset
    packs. An asset pack is a bundle of the boards, pieces, cards, sound graphics,
    and save-game rules required for a game to run, save, and be restored. The game
    logic doesn''t need to be implemented, because you''re playing with other people,
    just as you would with a real board game. You all need to voluntarily stick to
    the rules, and Tabletop Club bundles chess and checkers to help you get started.
    The documentation is brilliant and includes a few easy-to-follow tutorials to
    help you create asset packs for your own games. As you might expect, there''s
    an active community behind the project, and hopefully users will share their own
    asset packs for their own favorite games. If you''ve not tried something like
    this before, you might be expecting a poor imitation of the IRL experience, but
    Tabletop Club is actually a lot of fun when combined with a video chat with your
    fellow players. It''s the next best thing to actually being there.


    brilliant and includes a few easy-to-follow tutorials to help you create asset
    packs for your own games. As you might expect, there''s an active community behind
    the project, and hopefully users will share their own asset packs for their own
    favorite games. If you''ve not tried something like this before, you might be
    expecting a poor imitation of the IRL experience, but Tabletop Club is actually
    a lot of fun when combined with a video chat with your fellow players. It''s the
    next best thing to actually being there.


    **Project Website**

    https://github.com/drwhut/tabletop-club


    # # 3D Racing


    # ## Stunt Rally


    Stunt Rally is a 3D driving game that''s been under development for over a decade.
    Like Trigger Rally, which we looked at previously, Stunt Rally''s graphics engine
    is based on VDrift, an earlier 3D driving game with many of the same core driving
    features and a track editor. The track editor has been key to the success of all
    three titles because it means anyone can build a track, and there are typically
    dozens from which to choose. Stunt Rally itself includes 202 different tracks,
    37 different scenarios, and 25 different vehicles, offering a huge amount of variety.
    The game itself is modeled on early 3D console rally games that were trying to
    be relatively realistic, rather than the arcade style of something like V-Rally.
    This can make them harder to play, but more rewarding after you''ve learned how
    a vehicle handles and where a course goes. Stunt Rally is no different. You start
    by choosing your track. With so many to choose from, almost every possibility
    is covered, from mountain forests to tropical beaches, with even a detour to an
    alien landscape. Because Stunt Rally focuses on the extreme side of the sport,
    most levels include jumps and other hazards to navigate, and the course selector
    highlights these as attributes alongside an image of the selected terrain. You
    can then choose your vehicle, which has its own excellent statistics page to help
    you see attributes such as weight, power, top speed, and stop times. You can change
    your car''s color and see online fastest times for the selected course


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_88_1.png)


    > If you enjoy console rally games from the early 2000s, you''ll love Stunt Rally.


    with your chosen vehicle. Races can be offline and online, and you can race ghost
    versions of your previous fastest runs. The graphics are excellent, with varied
    terrain, densely populated forests, and dynamic textures, but it''s the gameplay
    that makes you want another go. The controls themselves are simple, but getting
    a fast time for a course is difficult, requiring many replays to master. Stunt
    Rally gets this balance absolutely right, with enough challenge and progress to
    make you always want another go.


    **Project Website**

    https://stuntrally.tuxfamily.org'
