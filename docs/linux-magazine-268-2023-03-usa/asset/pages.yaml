  md: 'it is closed again automatically a short time later. Small paddles act as the
    closures to avoid a shaft remaining permanently open and ensure that the desired
    amount of feed is delivered (Figure 4).


    The 160-liter aquarium with low fish stock levels does not need more than a heaped
    teaspoon of dry food every day. The supply in the vending machine will be fine
    for a three-week vacation. If you need a larger reserve, adjust the setup to


    your needs in terms of diameter and height of tubes.


    # Control


    The feeding process starts automatically after applying the supply voltage. As
    specified in the Raspberry Pi crontab, the vending machine feeds the fish once
    a day. On Saturdays, feed is taken from the second shaft by rotating the servo
    at the same angle, but in the opposite


    direction. Once a minute the housing LED flashes a visual ready signal. To track
    all events on the device, the LED uses various flash codes (Table 1).


    What you can’t see in the circuit diagram (Figure 5) are the two push buttons
    on the case, which are connected to the Zero W general purpose input output (GPIO)
    pins to trigger a feed in the first shaft and for a controlled system shutdown.


    Because the feeder is on the local network, it can be maintained over the network,
    as well. To do so, log in to a terminal over SSH with:


    ```

    ssh pi@feeder

    ```


    You can then make changes to the crontab or control script. If needed, you can
    disable the automatic feeder by calling:


    ```

    python3 /home/pi/scripts/feed.py 4

    ```


    The 4 option tells the device to enter maintenance mode without any further actions.


    # Observations


    One interesting and positive side effect is the ability to see whether the fish
    are getting any feed from the feeder. The control script triggers a snapshot through
    the aquarium glass with a delay of 10 seconds after operating the servomotor.
    The simple Pi Cam Rev 1.3 serves this function well. Because I only need to grab
    an image of a section of the front of the aquarium, image quality is secondary.


    The connection from the vending machine on the top of the aquarium to the Pi cam
    on the front of the aquarium requires a long camera cable (about 30cm for my setup)
    that depends on the height of the aquarium cover. A narrow aluminium plate fixes
