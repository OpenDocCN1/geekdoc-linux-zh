  md: "![](img/e3f454b04d121b3b3750fddfda8dd21e_32_0.png)\n\n# **Table 1: Keyboard\
    \ Shortcuts**\n\n| Shortcut | Function |\n| :--- | :--- |\n| Ctrl+T | Select files\
    \ |\n| Alt+C | Switch into a selected subdirectory |\n| Ctrl+R | Use *fzf*’s enhanced\
    \ history |\n\ncommand, it updates its database in a matter of seconds, leaving\
    \ you at a prompt, ready to continue.\n\n# ## Setting Up *fzf*\n\nThe popularity\
    \ of *fzf* means that, for most purposes, you can install it directly from your\
    \ distribution’s repositories and begin to use it. You can also install *fzf*\
    \ with Homebrew to get the absolute latest version.\n\nHowever, to make full use\
    \ of *fzf*, you should also install bat (the modern cat replacement) and fd-find\
    \ (the modern find replacement). Then add the following lines to your _.bashrc_\
    \ files:\n\n```\n```\nexport FZF_DEFAULT_OPTS=\"--preview 'bat' \\\n\t--color:always\
    \ {:}\"\nexport FZF_DEFAULT_COMMAND=\"fd -type f\"\n```\n```\n\nThese lines will\
    \ ensure that *fzf* can use bat as a file previewer and improve over-all performance\
    \ with fd-find. Faster than find, fd-find will ignore directories like _.gitignore_\
    \ while searching. In addi-tion, add\n\n```\n```\nsource ~/.vim/share/fzf/shell/\\\
    ?\nenable-binding.bash\n```\n```\n\nto enable some useful keyboard short-cuts\
    \ (see Table 1).\n\n# ## Basic Use\n\nAt its simplest, *fzf* opens and updates\
    \ its list of top-level directories for the present working directory – usually,\
    \ your home directory. You can then type any part of a directory or file to see\
    \ the results (Fig-ure 1). If you scroll the results, highlight-ing and pressing\
    \ the Enter key displays the selection in the terminal, where it can be conveniently\
    \ pasted into newly typed commands. Alternatively, you can use *fzf* with another\
    \ command so that\n\n```\n```\n: vim $(fzf)\n```\n```\n\nallows you to use *fzf*\
    \ to select a file to open in Vim.\n\nFor many uses, this is enough informa-tion\
    \ to use *fzf*. However, depending on how *fzf* is compiled, it can also support\
    \ context-specific autocompletions by en-tering a command followed by *\\*\\*+Tab*\
    \ and will give appro-priate suggestions, such as file names for Vim or remote\
    \ systems for SSH. If autocompletion is not enabled, check the project’s GitHub\
    \ page for instructions.\n\n# ## Other Command Options\n\nMost online articles\
    \ on *fzf* end at this point. However, a few distributions, such as Ubuntu, offer\
    \ man pages with additional options, neatly orga-nized into categories. Among\
    \ the most im-mediately useful are the search modes. Some of these op-tions may\
    \ be familiar to you from find and other search\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_32_1.png)\n\
    \n![](img/e3f454b04d121b3b3750fddfda8dd21e_32_2.png)\n\ncommands. For instance,\
    \ with *\\*1*, searches become case-sensitive, while you can reduce clutter in\
    \ the results with –exact (*e*., in addition, –ai=**g**\\*TYPE sets the fuzzy\
    \ algorithm, completion with v1 optimizes speed over best results, and v2 optimizes\
    \ results over speed.\n\nAnother useful option category is for search results.\
    \ The arrangement of re-sults can be influenced by –t{left}=**CfI** {CRITERIA,\
    \ CRITERIA}. The default criteria is length, which favors shorter results, but\
    \ you can give it lower priority by its position in a list that can contain begin\
    \ (with the search string closer to the start of the line), end (with the search\
    \ string closer to the end of the line), or index (a line that already ap-pears\
    \ in the results). Each criterion should only appear once, and index (for obvious\
    \ reasons) must always appear last. If you are searching for high-level directories,\
    \ start might be a useful op-tion or end if you are searching for a file name.\
    \ In addition, –tac displays results in reverse order.\n\nOther options are cosmetic,\
    \ such as dis-abling the mouse or horizontal or vertical control, or aspects of\
    \ appearance, such as color theme or window border size for previews. These options\
    \ no doubt be-come more important the more often you use *fzf*, but at first glance\
    \ give a false sense of complexity for what is after all a relatively well-organized\
    \ utility.\n\n# ## Rough Edges\n\nThe latest version of *fzf* is .38, and many\
    \ distributions offer even earlier packages. Unsurprisingly, *fzf* is still rough\
    \ around the edges, with no indica-tion of what features are compiled in which\
    \ package or distribution and scanty documentation. Fortunately, though, you do\
    \ not need all the possible features to find *fzf* a major improvement in search\
    \ functions. In fact, *fzf* has sev-eral levels of complexity, each of which is\
    \ useful in itself. As a result, even with the general release apparently some\
    \ way off, *fzf* is a welcome innovation that is well on the way to becoming the\
    \ new norm in search commands. **▮▮**\n\n# ### Info\n\n+   1. fzf: [https://origin-sysadmin.redhat.com/fzf-linux-fuzzy-finder](https://origin-sysadmin.redhat.com/fzf-linux-fuzzy-finder)\n\
    +   2. Fuzzy logic: [https://en.wikipedia.org/wiki/Fuzzy\\_Logic](https://en.wikipedia.org/wiki/Fuzzy\\\
    _Logic)"
