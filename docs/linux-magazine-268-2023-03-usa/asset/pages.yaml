    # ### Consumption Profile


    An average Spanish house consumes 9.55kWh daily [4] (US, ~ 25kWh [3]; UK ~ 11kWh
    [4]). You can calculate how much your own house consumes in a number of ways.
    If you have a solar inverter installed in your house, the inverter itself will
    tell you what your power consumption profile looks like. If you have not installed
    a solar system yet, look at one of your electricity bills for the number of kilowatt-hours
    billed and divide by the number of days of the billing period.


    Ideally, you would use an hour-per-hour comparison to try and guess which is the
    best time of the day to using and which is the best time for saving electric power
    at your home. For that to happen, you need to know your consumption profile. Again,
    if you have a smart inverter, it can give you this information, but if your inverter
    is dumb or you have no solar system yet, you will need to make a rough estimation.


    An acceptable way of making your hourly consumption estimation is to grab the
    nationwide consumption estimations of your country and assume your home behaves
    close to the average. For example, I downloaded the generation data from Red Eléctrica
    de España [5], which provides a CSV file with the power generated in Spain (in
    megawatts) throughout the day, broken down to periods of five minutes. This data
    allowed me to calculate which percentage of Spain''s power'
