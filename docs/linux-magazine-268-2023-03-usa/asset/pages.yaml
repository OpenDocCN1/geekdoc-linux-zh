    otherwise you will not see any results. In addition, you can find a specific brick
    by typing its name, such as *slope brick*. Use *Insert* to integrate the appropriate
    brick into the model or drag it to the desired position with the mouse.

    Now you need to insert the brick correctly. To do this, click on the brick to
    select it. LeoCAD marks the selected brick with six arrows (Figure 2). The


    three straight arrows let you move the brick back and forth, left and right, and
    up and down. Alternatively, you can use the arrow keys and the Page Up and Page
    Down keys. The three curved arrows are used to rotate the brick on all three axes.
    To do this, use the same keys as you used for moving again, but this time in combination
    with the Shift key.

    During a build, you will often use single bricks or a certain arrangement several
    times. Instead of reinstalling and aligning each brick individually, you can simply
    select the brick in question (or the respective combination if you hold down Ctrl)
    in the model and then duplicate the selection using Ctrl+D. Then move the cloned
    elements to the desired location.

    Up to this point, your model is still gray – high time to add some color. You
    can see the available colors bottom right in the window. As soon as you click
    on one of the colors, the bricks in the selection list on the right are painted
    in that color. If you want to color bricks that have already been installed, first
    select the desired bricks and then select the bricks in question. Then select
    the *Part | Paint Selected* menu item to finally color the bricks.


    # **Build Instructions**


    If you want to rebuild your virtual model later with real bricks, it makes sense
    to follow the step-by-step instructions. To do this, insert a new build step at
    appropriate points when assembling the virtual model by pressing Alt+Right arrow.
    The *File | Instructions* menu item displays detailed instructions


