  md: 'the name used for it in the incoming JSON is `artistName`. This is all you
    need for `json.Unmarshal()` to dig through all the entries in the JSON file in
    line 22, because the function has been passed a pointer to what is still an empty
    array of these stream entries in `data`. Using Go’s reflection mechanism, the
    function figures out which JSON structures it needs to work its way through.


    Listing 1 counts how many times each song occurs in the streaming history in the
    `bySong` map defined in line 16. To do this, it uses the title’s string as a key
    and increments the 64-bit integer map value by one for each playback event it
    finds in the streaming data. At the end, the function needs to sort the map by
    the highest integer value in descending order to output the top three.


    # Sorting Is No Piece of Cake


    In a scripting language, sorting the map data would be a snap, but Go offers type
    safety, and that’s why Listing 1 converts the map entries into an array slice
    of `kv` (for Key/Value) structures whose type it defines starting in line 30.
    The for loop starting in line 31 then needs to slog through the entries of the
    map and append each key value pair it finds as a `kv` struct to the `kv`s array
    slice. The slice can then be sorted by Go’s standard sort. `Slice()` function.
    The callback in line 39 tells it that it can determine the desired order of two
    entries in the slice at positions i and j by a numeric comparison of the two counters
    at those positions.


    Wow, that’s pretty convoluted! At the end, the for loop from line 41 goes through
    the sorted array, outputs the top positions, and terminates after the first value.


    # Faster with R


    Go programs for parsing JSON data and computing statistics are a real pain. Go’s
    type safety requires a disproportionate amount of boilerplate code here, which
    scripting languages just elegantly do without. This calls for a classic data wrangling
    language like R, which takes a more carefree approach, saving programmers a great
    deal of work. If you don’t have R on your machine yet, simply install it on Ubuntu,
    for example, with:


    ```

    sudo apt install r-base

    ```


    Listing 3 shows a simple application that scans a user’s Spotify streaming history,
    produces a histogram of the actual playing times of the songs they listened to,
    and displays it nicely as a bar graph (Figure 3). The diagram illustrates that
    many songs were simply canceled after less than 15 seconds (15,000 milliseconds).
    In this case, Spotify’s suggestion algorithm most likely made a mistake, annoying
    the listener, who then switched to the next song. Starting at about one minute
    of playback time (i.e., after 60,000 milliseconds), an almost Gaussian-like bell
    curve appears, peaking at 220 seconds. Most songs these days are about three and
    a half minutes long, with the majority being between two and five minutes.


    To be able to call Listing 3 at the command line, the shebang statement in line
    1 searches for the Rscript program in the shell’s search paths and calls the underling
    R interpreter with the program code from the file. Also make sure to mark the
    file `hist.r` (Listing 3) as executable via the `chmod +x` command.


    For an elegant approach to reading the JSON data, Listing 3 uses the `jsonlite`
    package; you will need to install this up front. After opening an R session (just
    type `R` at the command line), the `install.packages("jsonlite")` command loads
    the package’s C++ sources from the Comprehensive R Archive Network (CRAN), compiles
    them locally, and integrates the library into the local R universe. After that,
    any R script can use `library("jsonlite")` to include the new library and call
    functions from it.


    Line 3 reads the JSON data from the streaming history using the `fromJSON` function
    exported from `jsonlite` and stores it as a `dataframe` in the `jdata` variable.
    This R data type is a kind of database table with row-by-row vector values, each
    spanning multiple columns. In addition to numeric values and character strings,
    the columns can also contain what are known as factors. In R, these factors are
    variables with a certain number of possible values, for example, `small`, `medium`,
    and `large`.


    # Playback Length Statistics


    Listing 3 needs to limit the maximum recorded play length of all the songs it
    analyzes to five minutes, because my streaming history also included 90-minute
    audio plays, which distorted the statistics beyond recognition. Filtering is handled
    by the `recoding` statement in line 4, which uses the condition `jdata$msPlayed
    < 300000` to filter out all tracks over 300 seconds playing time from the `jdata`
    dataframe before again assigning the result to the `jdata` variable.


    Recoding statements take place at both the row and the column level. The square
    brackets in line 4 contain the conditions, separated by a comma. The filter applies
    the first condition to each row, and the second to each column. The result is
    a dataframe, which can have both fewer rows and fewer columns. In this case, however,
    we only need to remove the rows, not columns, which is why the second part of
    the condition in square brackets after the comma remains empty. Yes, you need
    eagle eyes to read and understand R code correctly!


    # Listing 3: hist.r


    ```

    ```r

    01 #!/usr/bin/env Rscript

    02 library("jsonlite")

    03 jdata <- fromJSON("MyData/StreamingHistory0.json", simplifyDataFrame = TRUE)

    04 jdata <- jdata[jdata$msPlayed < 300000, ]

    05 attach(jdata)

    06 png(filename="hist.png")

    07 hist(msPlayed, main="Milliseconds Played" ) 10 detach(jdata)

    ```

