    # ### Other Machine Learning Attacks


    Over time, other vulnerabilities in machine learning models have become apparent.
    For example, it has been proven possible to extract the parameters of a model.
    These attacks are also referred to as model extraction attacks. The parameters
    encode the knowledge that the model has learned during training based on examples.
    Of course, training can be time consuming, especially for very large models consisting
    of hundreds of millions or even billions of parameters, which can be very expensive.
    For example, it is estimated that the research and development of GPT-3, a transformer
    model with 175 billion parameters, cost $10–20 million.


    Expensive models like this are only rarely freely available to the public. Instead,
    they are often operated in the cloud, in a protected infrastructure, as machine-learning-as-a-service,
    so that no one can access the parameters. If you want to use the model, you are
    given access to its API for a charge. However, if certain conditions are met,
    the parameters can be extracted from a model by clever use of the API. Once you
    have the parameters of a model, there is no longer any reason to pay for the cloud
    service because you are able to run the model yourself.


    A membership inference attack is an attack that can extract information from a
    model that is confidential and should not be public. A clever query can find out
    whether certain data was used to train a model – for example, data related to
    a specific person. Suppose a model has learned to recognize a disease based on
    patient data, and the model was trained with the data of people who are suffering
    from this disease. If you can determine that a particular person is in the data
    set, you know that person has that disease.


    Model inversion attacks are attacks that reconstruct the data used for training
    from a model [4]. To create a model that can recognize faces, the training data
    needs to contain sample photos of each person you want the model to recognize.
    Figure 2 (left) shows photos that could occur in such a data set. Given access
    to the parameters of the model trained with these photos, you can reconstruct
    a recognizable image of each person included in the data set (Figure 2, right).


