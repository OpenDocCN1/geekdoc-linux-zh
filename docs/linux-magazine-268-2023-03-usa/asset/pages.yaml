  md: "# IN-DEPTH\n\n# Bash Tray Scripts\n\n# Listing 5: Toggle Tray Item Features\n\
    \n```\n01 #!/bin/bash\n02 #\n03 # tray_toggle.sh – toggle system tray items\n\
    04 #                 – create a named pipe for inputs\n05 #\n06 myfilepipe=\"\
    /tmp/tray1.pipe\"\n07\n08 # Make the named pipe (if it doesn’t exist)\n09 if !\
    \ test -e \"$myfilepipe\"; then\n10    mkfifo $myfilepipe\n11 fi\n12\n13 # redirect\
    \ the stdin (file 1) to the named pipe\n14 exec 1> $myfilepipe\n15\n16 # create\
    \ the notification icon\n17 yad --notification \\\\\n18    --listen \\\\\n19 \
    \   --image=\"emblem-colors-grey\" \\\n20    --text=\"My Tray Test\" \\\n21  \
    \  --command=\"yad --text='Test Tray App' \" & 1\n22\n23 # Every 10 seconds Toggle\
    \ the tray features with fake weather\n24 while :\ndo\n25\n26    sleep 10\n27\
    \    echo \"action:yad --text='Rain until morning'\" >$myfilepipe\n28    sleep\
    \ 1\n29    echo \"icon:stock_weather-showers\" >> $myfilepipe\n30    sleep 1\n\
    31    echo \"tooltip:Rain until morning\" >> $myfilepipe\n32    sleep 10\n33 \
    \   echo \"action:yad --text='Sunny for 2 days'\" > $myfilepipe\n34    sleep 1\n\
    35    echo \"icon:stock_weather-sunny\" >> $myfilepipe\n36    sleep 1\n37    echo\
