    # Putting Everything Together


    What you eventually want is for the computer to download a forecast reaching many
    days in the future and, taking your power consumption profile into account, give
    you an idea of how much surplus power you are going to get in future days. A good
    strategy is to have a cronjob fetch the forecast file from Solcast right after
    midnight and then parse it with a program capable of making these estimations.
    The script in Listing 3 is a proof of concept for such a program. The script assumes
    solar arrays are working without battery backup and attempts to guess how much
    power your house will take from the grid and how much power will be produced but
    not used (Figure 7). Power considered "wasted" is what would be sold to the power
    supply company if you sign a smart grid contract. This script iterates over a
    given forecast file and calculates the time period covered by the file.


    Lines 10-37 load the forecast and profile files to memory with the same approach
    as solar_j_.pl. The profile file needs no re- moval of Windows-style newline terminations;
    therefore, it lacks a replacement regex such as the one featured on line 14. Lines
    50 to 96 iterate through all the lines of the CSV forecast file, discarding the
    first one (which does not store a useful value). Although not really recommended
    by Perl gurus, I decided to use a C-type loop for readability. Lines 52-54 use
    regular expressions to extract the year, month, day, hour, minute, and second
    corresponding to the


