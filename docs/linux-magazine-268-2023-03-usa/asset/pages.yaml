  md: '# NEWS




    The Rockchip is a curious option because it originally didn’t have much in the
    way of Linux support. Fortunately, Linux support for the chip has blossomed, so
    the PineTab2 shouldn’t have any problems.


    Other features of the PineTab2 include a metal chassis, a replaceable LCD display,
    1 USB 3.0 Type-C port, 1 USB 2.0 Type-C port (for charging), 1 micro HDMI port,
    1 3.5mm audio jack, 5MP rear and 2MP front cameras, a microSD card reader, and
    a detachable backlit keyboard that can be customized via firmware flashing.


    Other specs (as well as the price) have yet to be revealed. The PineTab2 will
    be available in two configurations: 8GB RAM/128GB flash storage and 4GB RAM/64GB
    flash storage.


    Learn more about the PineTab2 from the PINE64 December update (https://www.pine64.org/2022/12/15/december-update-merry-christmas-and-happy-new-pinetab/).


    # Now Available: Designing with LibreOffice 2nd Edition


    The second edition of *Designing with LibreOffice*, by Bruce Byfield and Jean
    Hollis Weber, is now available (https://designing- withlibreoffice.com/).


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_10_0.png)


    Unlike many primers for office apps, *Designing with LibreOffice* reaches past
    the basic how-to steps and puts the focus on design. The emphasis is on styles
    and templates, with attention to advanced techniques that take LibreOffice beyond
    word processing and into the realm of desktop publishing.


