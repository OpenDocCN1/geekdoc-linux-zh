  md: "# **Bash Tray Scripts**\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_35_0.png)\n\
    \nListing 4 shows a one-line Bash statement that creates a tray icon that can\
    \ launch four different Midori browser windows (Figure 5).\n\n# Toggling\n\nYAD\
    \ supports the ability to dynamically change a tray item's icon, command, menuing,\
    \ and tooltip. To do this you need to enable listen mode ([-]listen) and then\
    \ redirect the standard I/O (stdio) – file 1 as shown in Listing 5 – to a named\
    \ pipe. After completion, a YAD tray item can be manipulated from the main script,\
    \ an external script, or manually from a terminal.\n\nListing 5 shows a standalone\
    \ script that creates a system tray item that can toggle some of its tray features\
    \ (e.g., icon, tooltip, or command) every 10 seconds.\n\n# Listing 4: Launching\
    \ Midori Browser Windows\n\n```\n```\nyad --notification --image=\\emblem-web\\\
    \n  --command=\"midori --http://news.google.com/ \\  \n  --menu='Facebook! midori\
    \ -a https://m.facebook.com \\   \n  | Linux! midori -a http://www.linux-magazine.com\
    \ \\  \n  | Weather! midori -a https://www.weathernetwork.com \\  \n  | Quit !\
    \ killall yad\" \\  \n  --text='My Fav Web Pages'\n```\n```\n\nThe first step\
    \ in Listing 5 sets up a named pipe (lines 6 and 11). The named pipe is a file\
    \ that is used to pass command arguments to YAD. Next, redirect stdio (file 1)\
    \ to the named pipe (line 14) and then have YAD get its input from the redirected\
    \ file 1 (line 21).\n\nA while loop cycles every 10 seconds (line 24-26). Custom\
    \ YAD command arguments are written/redirected to the named pipe with echo statements\
    \ (e.g., line 27). Adding sleep statements helps ensure that YAD doesn't miss\
    \ a command before a new command is written.\n\nListing 5 uses static weather\
    \ data (Figure 6). A future step would be to periodically scan for actual weather\
    \ data. If you're interested in using Bash to scrape the web [5], take a look\
    \ at the Lynx [6] command-line browser. With one line of Bash, you can use Lynx\
    \ to cleanly extract the contents of a web page; then, with a piped grep command,\
    \ you can parse out the desired data.\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_35_1.png)"
