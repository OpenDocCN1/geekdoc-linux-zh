    # Swap snaps for Flatpaks with unsnap


    # Package Exchange


    If you want to move away from Ubuntu’s Snap package format, the unsnap script
    removes snaps from your computer and replaces them with Flatpaks where possible.
    **By Ferdinand Thormoes**


    The Linux community, like any other community, is not particularly good at welcoming
    new things. Most people want to retain the status quo. In the words of the philosopher
    Voltaire, the better is the enemy of the good. Nothing is more dangerous than
    leaving the good for better things.


    Systemd, the still controversial system and session manager, illustrates this
    concept. Other examples are the new package systems Flatpak, Snap, and AppImage,
    which *Linux Magazine* previously covered in December 2022 [1]. These package
    systems are by no means met with unanimous approval in the Linux community. In
    particular, the Snap format, which Canonical initially designed for cloud applications
    and the Internet of Things (IoT), but later ported for desktop applications, is
    experiencing opposition beyond the basic criticism of new package systems.


    If you’ve become disillusioned with Snap, the unsnap script can help you replace
    snaps with Flatpaks where available on Ubuntu and its derivatives.


    # Bad Experiences


    The Linux community is skeptical of any solo efforts by Canonical due to bad past
    experiences. The main criticisms leveled at Snap (Figure 1) are the Snap Store’s
    proprietary back end [2] and the fact that Canonical is increasingly pushing the
    format in Ubuntu, with no official way to remove snaps.


    The Snap daemon (snapsd) is the defined tool for retrieving snaps and all associated
    metadata from Canonical’s servers. In addition, snaps have functional drawbacks
    that the company has been slow to eliminate. Flatpak, on the other hand, was well
    received by proponents of alternative package systems. Flatpak is probably the
    choice of


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_49_1.png)


    **Figure 1:** When you install programs via *Ubuntu Software*, you can define
    the source via a selection box top right. Some packages, such as Firefox, are
    generally only available as snaps.'
