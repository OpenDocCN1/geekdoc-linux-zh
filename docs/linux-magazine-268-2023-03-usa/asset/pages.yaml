    # Conclusions


    DWS Remote Control was impressive in testing. No technical problems occurred when
    accessing computers on outside of my home network. The Android version also performed
    as expected. Use with Wayland currently still requires a small detour on the part
    of the user. Detailed documentation is available in English [7]. The free version
    of DWS Remote Control already works fast enough at 6Mbps; latency is hardly noticeable.
    If you need more bandwidth because you want to transfer larger


    Each remote desktop can be controlled in the same way. Only one of the buttons
    directly shows you the remote desktop.


    The first button labeled Files and Folders takes you to a screen that maps the
    remote computer’s filesystem. You can browse the directories and perform file
    operations such as create, delete, copy, cut, and paste. You also can upload and
    download data.


    Text editor (Figure 3) takes you to a full-featured editor that lets you create
    new files and edit existing ones. Log watch lets you browse logs and monitor them
    in real time. A click on Resources reveals some information about the


    hardware as well as the running processes and services (Figure 4).


    Screen (Figure 5) takes you to a 1:1 view of the remote computer. If you work
    in this view, the user on the remote computer can follow what is happening. However,
    you can disable the other person’s mouse and keyboard. In addition, you can scale
    the screen, switch to full-screen mode, and select keyboard shortcuts to share.


    Shell takes you to a terminal emulation where you can run commands on the remote
    computer. You can switch between the individual categories using the button top
