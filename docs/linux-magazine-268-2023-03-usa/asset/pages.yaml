    # ### Parsing the Forecast


    The Solcast forecast data lets you per- form a number of calculations. The most
    important are how much power the panels will produce each of the up- coming days
    and whether you will face a power deficit. Because the forecast is in a machine-parseable
    format already, you can use some simple Perl scripts to reveal these numbers.
    Perl is well suited for the task because it is superb for pro- cessing text. You
    can install the neces- sary environment on a Devuan com- puter with the commands
    as root:


    ```

    ```

    sudo apt-get update

    sudo apt-get -y install perl 🥷

    sudo apt-get -y install libdatetime-perl

    ```

    ```


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_63_1.png)


    # **Figure 4:** Solcast has a limited wizard that can help you assemble an API
    call for downloading a solar irradiation forecast in a machine- parseable format.


    **Table 2: Solcast API Variables**


    | Variable | Description |

    | :--- | :--- |

    | hours | Number of hours covered by the forecast |

    | format | Format; JSON, CSV, and XML are available |

    | api_key | Your private API key provided by Solcast |



    Perl has a number of modules for pars- ing CSV files, such as the one down- loaded
    with the forecast data, but you don''t need anything fancy and can make do with
    some handmade code. Listing 1 shows an example Perl script that reads from standard
    input and, assuming it is fed a CSV file, saves its contents to an array named
    `$csv`.


    The `while` loop in the script reads each line from the forecast file one by one
    and stores them in the `@1ine` variable. Lines 15-17 remove Windows-style newlines,
    making the input easier to process. Each'
