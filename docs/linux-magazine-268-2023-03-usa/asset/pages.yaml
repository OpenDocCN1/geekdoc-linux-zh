    line of the CSV file is composed of a group of fields separated by commas, so
    line 20 captures the first and fourth field and stores them in the $power and
    $timestamp variables.


    The code that follows is where tricky stuff starts happening. In lines 22 and
    23, a data hash is created and stored in the element of the csv array corresponding
    to the current line (i.e., the first line of the file goes into $csv[8], the second
    line into $csv[1], etc.). In this way, you can access both the power and the timestamp
    of each row easily. For example, to get the power column of the 10th line, access
    the $csv{9}{"power"} variable.


    In the context of solar power production, one of the most interesting things you
    can do with this data is compare your solar production with your power consumption.


    # ## Table 3: Forecast File Elements


    | Element | Description |

    |---|---|

    | PvEstimate | Average power production (kW) for the time period |

    | PvEstimate10 | Reasonable minimum power yield for the period (for worst case
    calculations) |

    | PvEstimate90 | Reasonable maximum power yield for the period (for best case
    calculations) |

    | PeriodEnd | Timestamp marking the end of the period |

    | Period | Length of each period (minutes) |


