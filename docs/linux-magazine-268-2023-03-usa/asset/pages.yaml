- pgno: 42
  md: '![](img/e3f454b04d121b3b3750fddfda8dd21e_42_0.png)


    **Figure 2:** An overview of an archive file using apt-clone info.


    will attempt to include them in the backup directory. However, be aware that the
    attempt may not always be successful, because an installable .deb package does
    not automatically have the format and standard required by the Debian distribution.
    Such packages work perfectly fine in everyday use, but may not be picked up by
    apt-clone (Figure 1).


    Whatever the case, in a few minutes, apt-clone will create a TAR-zipped file.
    If you are trying to include third-party packages, it will probably take much
    longer because each third-party package must be analyzed separately. You can read
    general information about the newly created file using the command:


    ```

    apt-clone info FILE

    ```


    In Figure 2, across seven different desktops, 2,977 packages are installed, but
    only 2,619 are official Debian packages, which suggests that a perfect clone could
    be unlikely, although the basic functionality should clone successfully. A different
    view of the archive file can be had by viewing it in an archive application such
    as Ark (Figure 3). As you might expect, package sources and apt settings are major
    categories for the archive, as well as apt-clone’s logfile. Preferences include
    configuration settings from directories such as ,config/ or .local. In theory,
    you might be able to un-archive the file and attempt to edit, but to do so is
    likely to take more effort than is worthwhile. Still, it is never wasted time
    to know exactly what you are doing instead of blindly following instructions.


    Because the archived file contains system-sensitive information, you should encrypt
    unless you plan to delete it immediately after cloning. The quickest way to do
    so with reasonable security is to use GPG and keep the file encrypted when you
    are not actually using it.


    # How to Clone


    Once you have the archive file, install the target system with the same Debian
    release as the source system. Using another Debian release may work, but it increases
    the chances of problems – problems that may cost more time than apt-clone is likely
    to save. Transfer the archive file to the root directory of the target system,
    decrypt it if necessary, and run as root:


    ```

    apt-clone restore FILE

    ```


    The process is similar to that of installing packages normally and may take 20
    minutes or more on recent hardware, depending on the number of packages involved.
    It will take even longer if you choose to use restore-new distro instead of restore,
    because you will be attempting to upgrade packages at the same time. Probably
    less can go wrong if you upgrade before restoring.


    When the process finishes, the cloning will complete without the need to reboot,
    exactly as happens when a new package is installed. Similarly, because the source
    files belong to root and are copied as root, you should not have problems with
    permissions. If you do have any problems, using apt-clone diff to compare with
    the source machine’s file may help with problem-solving.


    # Limitations


    The main drawback to apt-clone is that it is designed for use with official repositories.


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_42_1.png)


    **Figure 3:** An overview of the archive file’s content.


    If the system you are cloning includes packages installed with .deb packages from
    third-party sources, apt-clone will try to handle them, but sometimes without
    success. That means that if you have installed, for example, the latest version
    of LibreOffice From The Document Foundation, you will have to back up the configuration
    files separately. Similarly, transferring the configuration files to a newer release
    of the operating system may also have limited success. Probably, the most useful
    time to use apt-clone is when you are installing a lab with identical workstations
    or a new home computer that you want to be identical to your old one. When apt-clone
    meets your needs, it is an elegant little script, but it is never going to be
    a complete solution for every possible circumstance. \U0001F44D


    # Info


    **[1]**  apt-clone:


    https://github.com/mvo5/apt-clone


    # Author


    **Bruce Byfield** is a computer journalist and a freelance writer and editor specializing
    in free and open source software. In addition to his writing projects, he also
    teaches live e-learning courses. In his spare time, Bruce writes about Northwest
    Coast art ([https://brucebyfield.wordpress.com](https://brucebyfield.wordpress.com)).
    He is also cofounder of *Printice Pieces*, a blog about writing and fantasy at
    [https://printicepieces.com/](https://printicepieces.com/).'
