    # Rework Needed


    My test took around 10 minutes and provided detailed information about what was
    happening at all times. The flatpak list command (Figure 6) can be used to determine
    which snaps were converted to Flatpak format. For snaps with a Flatpak equivalent,
    unsnap converted these snaps cleanly, and all of the programs remained functional.
    The script left the remaining snaps and the infrastructure untouched. Some manual
    work would be required to completely oust snaps from the computer.


    I then reinstalled Ubuntu 22.04, along with some snaps that I knew had corresponding
    Flatpaks available, including Gimp 2.99.10 Beta, Krita, Spotify, and KeePassXC.
    In the process, I also installed several additional runtime environments for Gnome
    and (because of Krita) KDE, as well as other infrastructure packages from Canonical.
    With this environment using the same procedure as before, I then tested whether
    unsnap also removes the Snap infrastructure when it can convert all snaps to Flatpaks.


    I loaded the script and ran it by typing ./unsnap auto. This time, unsnap first
    had to install Flatpak and connect to Flathub. After doing so, the call successfully
    replaced all manually installed snaps with Flatpaks. In addition, it successfully
    disabled the Firefox snap, which was already present during the install.


    When checking via flatpak list, I noticed one minor disadvantage to this method:
    All Flatpaks are system-wide and therefore accessible to all users. There is no
    option to limit the Flatpaks to specific users.


    Then I ran snap list to see if there was anything left of the Snap infrastructure.
    Lo and behold, the snaps had been deleted, but the infrastructure was still there.
    Apparently, the script did not execute the last of the six helper scripts (99-remove-snap).
    I now did this manually by changing to the ~/.unsnap/log\$282... directory and
    running the ./99-remove-snap command there. The script removes snapd and takes
    away the parts of the infrastructure that the base does not need.


    However, I discovered the Snap infrastructure is already deeply rooted in Ubuntu
    and not everything can be removed even manually (Figure 7).


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_51_1.png)


    Figure 5: There is not always a Flatpak equivalent for installed snaps; unsnap
    lists these cases separately.


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_51_2.png)


    Figure 6: After running unsnap, the flatpak list command can be used to check
    which snaps the script replaced with Flatpaks.'
