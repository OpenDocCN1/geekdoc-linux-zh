  md: '# ### Manual


    Even without unsnap, the Snap infrastructure can be removed from the computer.
    To do this, first disable the corresponding systemd services (Listing 2, lines
    1 to 3). Then use the command


    ```

    sudo snap remove $PACKAGE

    ```


    to delete everything that snap list shows you item by item. Last but not least,
    remove the remnants (lines 5 to 7). Afterwards, the removed packages can be reinstalled
    manually as DEBs or Flatpaks.


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_52_0.png)


    **Figure 7:** I had to follow up with the ./**99-remove-snapd** script to remove
    as much of the Snap infrastructure as possible. Nevertheless, some remnants remained.


    # ### Conclusions


    On Ubuntu and its derivatives (if they use Snap), unsnap lets you swap installed
    snaps directly for Flatpaks. To do this, an equivalent Flatpak must be available,
    which is very often the case with graphical applications. With a little manual
    work, the Snap infrastructure can also be removed.


    However, the project warns on GitHub that the software is still at a pre-alpha
    stage. I attempted to get a statement from Alan Pope, but was unable to do so
    by the time this issue went to press. I know of many users who have successfully
    used unsnap; and I did not experience any problems myself. However, to be on the
    safe side, I recommend using the manual removal option and then reinstalling the
    removed packages in your desired format. `■ ■`


    # ### Author


    **Ferdinand Thommes** lives and works as a Linux developer, freelance writer,
    and tour guide in Berlin.


    # ### Listing 2: Removing unsnap


    ```

    01 $ sudo systemctl disable snapd.service

    02 $ sudo systemctl disable snapd.socket

    03 $ sudo systemctl disable snapd.seeded.service

    04 [...]

    05 $ sudo rm -rf /var/cache/snapd

    06 $ sudo apt autoremove --purge snapd

    07 $ rm -rf ~/snap

    ```


    # ### Info


    +   1.  “Innovative Linux Package Managers” by Erik Bärwaldt, *Linux Magazine*,
    issue 265, December 2022, p. 72

    +   2.  Snap Store: `https://snapcraft.io/store`

