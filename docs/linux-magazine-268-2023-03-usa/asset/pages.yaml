    # MX Linux 21.3


    64-bit


    Codenamed Wildflower, MX Linux 21.3 (MX-21.3) is the latest joint effort between
    the antiX and MX Linux communities. Based on Debian 11.6, Wildflower is available
    with the latest releases of the Xfce, KDE Plasma, and Fluxbox desktop environments.


    Changes to Fluxbox include MX Rofi Manager, a tool for configuring the look and
    feel, while KDE now includes the 6.0 Advanced Hardware Support (AHS) kernel with
    advanced hardware configuration. All editions include a new deb-installer, menu
    editor, and updated firmware packages, as well as the latest antiX tool for creating
    live images and system snapshots.


    As with all MX releases, the result is a distribution with extreme user-friendliness,
    suitable for all levels of users.


    # Puppy Linux FossaPup 9.5


    64-bit


    While Puppy Linux is usually listed as a distribution, it is actually a family
    of distributions. Originally aimed at small installations, Puppy Linux is now
    known for the features that they all have in common. Included on this month''s
    DVD is FossaPup 9.5, one of Puppy''s better known distributions. To try other
    Puppy Linux distributions, download them at https://puppylinux-woof-ce.github.io/.


    All Puppy Linux distros are built using woof-CE, which creates a distro from an
    existing binary (usually Ubuntu or Slackware) and can be installed on a single
    directory or an entire filesystem. Each uses its own choice of widgets, applications,
    and features. However, each Puppy Linux loads system files into RAM and encrypts
    personal files rather than using passwords. Each, too, opens with a Quick Setup
    window and can save the current setup when shutting down.


    Like all Puppy distros, FossaPup installs quickly and offers some unusual approaches
    to computing that can be appreciated by all users.'
