  md: '# IN-DEPTH

    Firmware in Debian


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_27_0.png)


    # Debian opens a door for non-free firmware


    # Well, OK, I Guess?


    The topic of non-free firmware has caused some turbulence within the Debian project,
    but now the community has a new direction. By Thomas Reuß


    Firmware is the link between software and hardware. Hardware vendors are often
    very secretive about their technology, and part of that secrecy is carefully guarding
    their source code. Consequently, firmware usually means blobs, that is, binary
    large objects. No source code is available.


    Unfortunately, closed-source, proprietary firmware contradicts everything Debian
    stands for. Binaries without the source code are also a problem from the admin''s
    point of view because the hidden code might hide vulnerabilities that the user
    is not able to fix. Many users don''t like the fact that firmware cannot be patched
    as easily as source code when a security problem occurs. Without the manufacturer,
    who has to provide the security updates, you can''t do anything. And the distributor
    will want to thoroughly test the new firmware version before it goes to the user,
    which slows down the process of fixing problems.


    In general, proprietary firmware does not score well on the popularity scale with
    Linux users. However, users are in a quandary. Either you swallow the bitter medicine
    and live with closed-source packages, or else you do without the hardware and
    other proprietary components that depend on them. Virtually no one who uses Linux
    in a professional setting can afford to operate without proprietary firmware.
    No one uses it (probably many others) directly enabled the *contrib* (contributed)
    and *unfree* packages – initially, out of curiosity or ignorance, and then later
    knowing that I wouldn''t have much fun with the hardware if I installed it without
    some proprietary drivers.


    # Idealism Meets Realism


    The Debian Popularity Contest is a software package that evaluates the packages
    installed on the system and transmits the results to Debian. Participation is
    regulated by an opt-in procedure. When it comes to proprietary firmware, the numbers
    from the Debian Popularity Contest [1] are quite revealing.


    The Debian Popularity Contest returns fairly clear results: Firmware is quite
    important. In the ranking by installation count (Figure 1), packages such as `linux-firmware-free`
    (ranked 237) or `firmware-misc-nonfree` (ranked 1,882) score significantly higher
    than well-known applications such as `samba` (ranked 2,411) or `mariadb-server`
    (ranked 2,838).


    Hardly any system can operate sensibly today without additional firmware, especially
    when it comes to laptops. The fact that iconic free tools such as MariaDB and
    Samba appear after the unloved closed-source firmware on the popularity list suggests
    that a clear majority of users want a fully functional computer and do not draw
    a stark line in the sand when it comes to proprietary firmware.


    Debian newcomers or inexperienced users are often reluctant to manually deploy
    firmware, and even experienced users might find themselves in a situation like
    I did from time to time: Halfway through the installation, I realized




    Photo by Kordyline Llin on Unsplash'
