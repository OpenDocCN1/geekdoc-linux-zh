    +   [4] LeoCAD: https://www.leocad.org/

    +   [5] LeoCAD AppImage download: https://www.leocad.org/download.html

    +   [6] LeoCAD on GitHub: https://github.com/leozide/leocad/releases

    +   [7] BrickLink: https://www.bricklink.com/v2/main.page


