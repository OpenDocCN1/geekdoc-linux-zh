  md: '# # Call Home

    **Remote access from the outside with DWS Remote Control**


    **DWS Remote Control offers convenient browser access to computers outside of
    your home network.** *By Ferdinand Thommes*


    **T**he use of remote software has

    grown massively in recent years.

    Users increasingly experience situ-

    ations where they need to ac-

    cess the desktop on a remote computer –

    whether to connect to work from the

    home office, to help family or friends

    with computer problems, or to quickly


    access the home desktop system. Linux

    offers many possibilities for remote

    control.


    Tools such as Virtual Network Com-

    puting (VNC) [1] or Remmina [2],

    which supports the RDP, Spice, NX,

    XDMCP, and SSH protocols in addition

    to VNC, provide access to Linux,


    macOS, and Windows computers.

    Chrome Remote Desktop is available

    for users of Google’s Chrome browser.

    In the commercial world, TeamViewer

    and AnyDesk are the kings of the hill.

    However, they are increasingly seeing

    competition from the fledgling open

    source tool, RustDesk [3]. Another

    free, but little known, application for

    remote access is provided by the Ital-

    ian company DWService.


    # ## Agents at Work


    DWS Remote Control,

    as the service is called,

    requires you to install

    an agent as a client on

    the target computer.

    You can then access it

    in any web browser

    from the source com-

    puter. You first need to

    register on the DWSer-

    vice [4] website. After

    doing so, proceed to

    download the agent,

    which is available for

    Linux, macOS, Win-

    dows, ARM, and An-

    droid [5]. DWS Remote

    Control is released

    under open source li-

    censes, and the source

    code is open [6].


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_23_0.png)'
