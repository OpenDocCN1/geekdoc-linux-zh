  md: 'To view your channels, the next step is to add playlists. The playlists are
    available in M3U format and can be downloaded from the Internet. A word of caution:
    Many of the offers accessible via search engines are commercial, and some even
    spread malware. The recommandation is to use the selection on GitHub [6].


    Download the lists to your system in the **Grouped by Country** section by expanding
    the list. After downloading, open IPTVnator and click the *Upload from file* system
    button in the program window. Now drag and drop the M3U files with the country-specific
    channel lists from your file manager into the program window. The M3U files can
    only be integrated into the application one after the other.


    Whenever you paste an M3U file, the playback window opens with a station list
    arranged on the left side while you see the stream of the current channel in the
    main part of the window on the right. IPTVnator comes with its own playback software
    for this purpose.


    In the lists obtained from GitHub, you can see the channel’s resolution, the channel
    name, and its logo. You can also discover whether the station broadcasts content
    24/7, and whether the program is only available regionally. If this is the case,
    the channel can only be viewed by using a VPN to access the Internet, and the
    server must reside in the same country as the channel. If you try to view blocked
    content directly, you will either see a corresponding message in IPTVnator, or
    the broadcaster itself will display a message in the playback software (Figure
    2).


    When viewing a program, you can switch the player to full screen mode by clicking
    on the open player in the bottom right of the screen. The player then shrinks
    to just the bottom control line, which you can use to pause the stream, adjust
    the volume, or set the resolution. To switch back to window mode, click the open
    cross in the control bar. The application then jumps back to the original display
    (Figure 3).


    # Groups and Favorites


    IPTVnator lets you se-lect programs by genre. This option is espe-cially useful
    for channel lists with a large num-ber of channels. To se-lect a program by genre,
    open the group


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_80_0.png)


    Figure 2: It’s not easy to view programs by Germa-ny’s Bayerischer Rundfunk outside
    of Germany.


    selection by clicking the *Groups* button in the pro-gram window. The software
    now shows you a table with the individual genres and the number of channels available
    in each of them. Clicking on the desired genre opens the list of stations below
    it (Figure 4). Clicking on the group name again closes the selection.


    For quick access to your favorite channels, IPTVnator offers a favorites function.
    To mark a channel as a favorite, just click on the star next to the name of the
    channel currently streaming above the playback window. To recall a saved channel,
    click *Favorites*. The selected channel then appears on the left. To remove a
    channel from the favorites list, click on the star next to the channel name again.


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_80_1.png)


    Figure 3: In full-screen mode, only the bottom control bar is left, and it too
    is automatically hidden after a short period of inactivity.'
