    purpose. The two calls to `apt` inject the `gedit` package; user-add creates a
    non-privileged user named `user` and a user ID of 1000. The `USER` line specifies
    that all further steps are run with the user ID 1000. This is followed by a `CMD`
    line that specifies the command to run later on at container startup time.


    Now, to create a container named `oldgit1` using this image recipe, just run the
    `docker build` `-t oldgit1 .` command in the folder containing the Dockerfile.
    When typing, make sure that the last parameter of the command is a single dot
    `—` it stands for the current directory. Docker then executes the instructions
    from the Dockerfile in a fully automated process. If everything works, the new
    oldgit1 image will be available afterwards.


