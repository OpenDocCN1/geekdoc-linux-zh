    Which is why in the general case, you really should consider email to be the ''lingua
    franca'' of kernel development communication. It doesn''t have the fundamental
    limitations and management issues that bugzilla has. If you want to add more people
    to the Cc in an email, you just do it.


    The discussion is not over by any means. I would expect the debate to be ongoing
