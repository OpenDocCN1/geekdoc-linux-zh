    array are great for two reasons. First, they allow you to simulate the performance
    of a solar array you intend to install before you make the investment. It is much
    better to know that the panels you intend to install are going to under perform
    or over perform before you spend your money. Second, they allow you to schedule
    your power expenditure so as to optimize the usage of your system.


    A very useful forecast service free of charge for hobbyists, students, and academic
    research is Solcast [1]. The biggest advantage of the service is that it allows
    you to download solar irradiance predictions in machine-parseable formats, which
    can then be fed to scripts and programs to extract meaningful data.


    After signing up with Solcast, you are expected to define a Site before you start
    using the service (Figure 3), which is just a fancy way of saying you need to
    provide your location to Solcast so they can send you that location’s forecasts.
    To complete your information on the Site tab, you need to provide the orientation
    angle of your panels, their nominal power output, the vertical angle of the panels,
    and an efficiency estimation. It is safe to assume 90 percent efficiency for new
    systems, with a 2 percent efficiency loss per year.


    Solcast also provides an API key (Figure 4) you can use to download forecasts
    automatically. Your site’s page on the Solcast website will provide plenty of
    documentation and a wizard for generating valid HTTP calls. To save time, the
    following example downloads 72 hours of forecast data for the specified site:


    ```

    https://api.solcast.com.au/

    rootloop_sites/$YOUR_SITE_ID/

    forecasts?hours=72&format=csv&

    spl_key=$YOUR_KEY

    ```


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_62_0.png)


    Figure 2: A Turbo Energy hybrid inverter (1) paired with a battery bank in a rack
    (2). The photovoltaic panels charge the batteries with excess production, so the
    owner can use battery power after the sun sets.'
