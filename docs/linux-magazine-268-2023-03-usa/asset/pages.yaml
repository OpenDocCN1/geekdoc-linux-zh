    ```


    Target directories in the container do not need to exist: Docker creates them
    on the fly. Figure 4 shows the same home directory from the host system and from
    within the container. Be careful: Changes you make to the files in the container
    also take effect on the host system. To be safe, it is a good idea to copy the
    files to the container instead.


    # File Transfer


    Docker provides a separate command for transferring files into and out of the
    container: `docker cp` lets you copy files in a similar way to the SSH scp tool.
    You cannot use it to copy files to an image; you first need to start a container.


    Once the container is running, you will find its computer name at the prompt,
    which is an ID consisting of hexadecimal numbers. You can also


