- pgno: 79
  md: '# ## TV over the Internet with IPTVnator

    # Couch Surfing


    Thanks to the IPTV standard and free software, you can view your favorite channels
    on Linux without any problems.


    BY ERIK BÄRWALDT


    Traditional audiovisual technology and modern multimedia computer applications
    continue to converge. In the past, Linux has been behind the other platforms when
    it comes to streaming free-to-air TV programs, because of a lack of software.
    IPTVnator is a young project that is trying to close that gap [1].


    # Technologies


    Conventional broadband reception for television requires additional hardware,
    such as a receiver for DVB-S, DVB-T, or DVB-C. However, Internet Protocol Television
    (IPTV) [2] lets you view the daily TV program on the Internet without additional
    components. IPTV programming has a number of advantages over broadband offerings.
    Viewers can access the entire range of content offered without a fixed connection
    and without special receivers.


    In addition to public broadcasters, users have the choice of numerous small regional
    stations that you can receive over the Internet from anywhere in the world. Modular
    channel lists let you view channels from other countries and


    continents. Bandwidths of around 4Mbps are already sufficient for standard-definition
    (SDTV) reception of TV broadcasts via IPTV. But to view programs in high-definition
    (HDTV) quality, you need a bandwidth of at least 8Mbps, which is within the range
    of many modern DSL lines. The IPTV software used on the PC relies on buffering
    to ensure continuous reception even in the event of bandwidth fluctuations.


    # IPTVnator


    The still quite young program IPTVnator is a great choice for TV viewing via IPTV.
    Older software packages such as FreetuxTV [3] and Zapping [4] have not seen any
    development for years, and Hypnotix [5], which is part of the Linux Mint software
    pool, only runs on a few Linux distributions due to some specific dependencies.
    IPTVnator is currently one of the only graphical and universally usable applications
    for IPTV on Linux.


    IPTVnator offers the full range of functions for convenient reception. You can
    integrate M3U or M3U8 playlists, and an integrated program guide lets you define
    favorites. In addition, the application, which is based on the Electron and Angular
    frameworks, automatically maintains channel list updates and has built-in HTML5
    playback software.


    # Installation


    The software has not made its way into the repositories of the common distributions
    so far, but you can pick it up as a snap package if the distribution you are using
    supports snaps. You can also find RPM and DEB packages at the project website
    – or download IPTVnator as a cross-distribution AppImage for 64-bit systems.


    When installing the snap package from a distribution-specific app store, the routine
    will typically automatically create a launcher in the desktop environment''s menu.
    You can either launch the AppImage package manually or integrate it into your
    desktop environment using AppImageLauncher. After the first start, the application
    shows a window with just a few controls (Figure 1).


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_79_0.png)'
