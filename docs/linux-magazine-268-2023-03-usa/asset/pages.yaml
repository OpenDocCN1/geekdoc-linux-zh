  md: "timestamp of the entry of the forecast file. Lines 55-64 create a `DateTime`\
    \ object corresponding to the timestamp and adjust it to the local time zone.\n\
    \nLines 68-75 look in the profile file for the entry corresponding to the timestamp\
    \ it is currently analyzing and calculate the total power you expect the house\
    \ to consume in that period. This calculation multiplies the total energy use\
    \ expected for the day by the percentage of daily power use expected in the period\
    \ corresponding to the timestamp, divided by 100. The result, in kilowatt-hours,\
    \ is stored in the `$consumption` variable.\n\nThe calculations in lines 76-80\
    \ are the energy debt and excess. If the house consumes more power than is produced,\
    \ the script notes the energy debt in the `$deficit` variable. Otherwise, excess\
    \ power is noted in the `$waste` variable.\n\nThe script also records the power\
    \ produced so far by the solar array during the day in line 82.\n\nLine 85 guesses\
    \ whether the end of the day has arrived. If so, the script prints the information\
    \ corresponding to the day just parsed and sets `$deficit`, `$waste`, and `$produced`\
    \ to zero to start the next day anew.\n\n# Conclusion\n\nThe script in Listing\
    \ 3 is a proof of concept and lacks input validation. It does not check whether\
    \ the CSV files fed to it are correct and lacks appropriate exit statuses for\
    \ input errors. However, it serves as a base on which to build a prediction system.\
    \ You can easily set up a cronjob to download a forecast file from Solcast each\
    \ day at midnight, generate a prediction with the script, and send it by email\
    \ or post it to a website. The possibilities are endless (Figure 8).\n\nA more\
    \ complex script that supports input validation and tracks the state of the battery\
    \ banks is available at my gophersite [6]. (You’ll need a gopher client.)\n\n\
