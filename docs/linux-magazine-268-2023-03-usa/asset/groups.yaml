    \ https://www.bricklink.com/v2/main.page\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_93_1.png)\n\
    \n**Figure 6:** Miniature figures make models look more alive.\n\n## Become a\
    \ LibreOffice Expert\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_92_0.png)\n\n\
    Explore the **FREE** office suite used by busy professionals around the world!\n\
    \n- Create Professional:\n    - Text Documents\n    - Spreadsheets\n    - Presentations\n\
