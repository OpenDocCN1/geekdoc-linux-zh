    # CloudFest


    +   - **Date:** March 21-23, 2023

    +   - **Location:** Europa-Park, Germany

    +   - **Website:** https://www.cloudfest.com/


    CloudFest is the #1 internet infrastructure event in the world, connecting the
    global cloud computing industry. Join us March 21–23 as we take over a European
    amusement park to bring together the top decision-makers in the internet infrastructure
    industry for learning, networking, and the best parties ever.


    # Linux App Summit


    +   - **Date:** April 21-23, 2023

    +   - **Location:** Brno, Czech Republic & Online

    +   - **Website:** https://linuxappsummit.org/


    The Linux App Summit (LAS) brings the global Linux community together to learn,
    collaborate, and help grow the Linux application ecosystem. Through talks, panels,
    and Q&A sessions, we encourage attendees to share ideas, make connections, and
    join our goal of building a common app ecosystem. Join us in-person or online.


    # DORS/CLUC 2023


    +   - **Date:** May 11-12, 2023

    +   - **Location:** Zagreb, Croatia

    +   - **Website:** https://www.dorscluc.org/


    DORS/CLUC is the oldest and biggest regional conference that covers free and open
    source software, open standards, and Linux. During two days of talks, workshops,
    and fun, this event brings together students, FOSS enthusiasts, tinkers, developers,
