  - "[PAGE 77]\n\n# X Window\n\nGraphical applications can initially cause problems\
    \ for Docker, but this is easily solved. The trick for classic X applications\
    \ (not Wayland) is to pass the `/tmp/.X11-unix/` directory and the `$DISPLAY`\
    \ environment variable into the container. You can talk an older version of the\
    \ `gedit` GNOME editor into working by creating a custom image named `olgedit`\
    \ (see the 'Building an Image with Dockerfile' box).\n\n# Wayland\n\nCurrent versions\
    \ of Ubuntu use Wayland as the successor to the X Window System with Wayland\n\
    \n+   **Listing 9: Dockerfile**\n+   \n+   ```\n+   FROM ubuntu:14.04\n+   RUN\
    \ apt update\n+   RUN apt install -y gedit\n+   RUN useradd -m user\n+   USER\
    \ 1000\n+   CMD gedit\n+   ```\n\n+   **Listing 10: X11**\n+   \n+   ```\n+  \
    \ $ docker run -it --rm -e DISPLAY \\\\\n+   -v /tmp/.X11-unix/:/tmp/.X11-unix\
    \ \\\\\n+   -v $HOME:/home/user olgedit\n+   ```\n\n+   **Listing 11: Wayland**\n\
    +   \n+   ```\n+   $ docker run -it --rm -e XDG_RUNTIME_DIR -v $HOME:$HOME -v\
    \ /run/user/1000/wayland-0:/run/user/1000/wayland-0 waylandtest\n+   ```\n\nThe\
    \ `olgedit` image is not configured to start the `/bin/bash` shell, but to directly\
    \ launch the gedit editor. It does this with normal user rights, that is, not\
    \ as `root`, but as a `user` with `user` ID of 1000. When you try to start a container\
    \ now by typing\n\n```\n`docker run -it --rm olgedit`\n```\n\nyou will see some\
    \ error messages ending with `cannot open display`. The program cannot access\
    \ an X server and therefore cannot open a window. The X server running on the\
    \ host creates a special socket type file named `X0` below `/tmp/.X11-unix/` where\
    \ applications can contact it. In addition to `X0`, there may be other entries\
    \ here (`X1`, `X2`, and so on) if multiple X servers are active. The X server\
    \ to display program windows is determined by the `$DISPLAY` environment variable.\
    \ It typically contains a value of `:0`. Then pass the contents of the variables\
    \ and access to the sockets in `/tmp/.X11-unix/` to the container using the `-e\
    \ $DISPLAY` and `-v /tmp/.X11-unix/:/tmp/.X11-unix` options (Listing 10), allowing\
    \ gedit to run. Because the home directory is additionally mapped to `/home/user/`\
