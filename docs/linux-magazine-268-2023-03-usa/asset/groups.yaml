    and aesthetics definitely challenge the ethos that browsers need to have an option
    for everything. The most obvious difference is that the URL bar is now part of
    the window titlebar, like many modern GNOME applications. The URL bar can also
    be used for search, which defaults to using DuckDuckGo, and works brilliantly
    with DuckDuckGo bangs such as `lw to open the top result on Wikipedia. These bangs
    are augmented with a few of Min’s own, such as `bookmarks to open the bookmarks
    view and `settings for further configuration options, and you can add your own
    from the Preferences panel. Tabs also appear in the titlebar next to where they’ve
    been summed, ensuring that the main view remains uncluttered and entirely focused
    on web rendering. There’s no UI text, only icons, and there are only two drop-down
    menus at opposite ends of the top bar. The Preferences page lets you tweak the
    excellent built-in ad-blocking, set the appearance to light or dark mode, enable
    user scripts, and create a titlebar separated from the URL and tabs. Tabs themselves
    can be grouped into Tasks, which are accessible from the second drop-down menu.
    There’s also a reader mode and a focus mode, with the latter disabling new tabs
    from being opened to keep you from watching YouTube while you’re supposed to be
    working. It’s the perfect balance between functional and minimal and a genuinely
    refreshing change from the establishment.


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_86_0.png)


    A minimal web browser such as Min is useful if you want to use the web without
    being so distracted.


    **Project Website**

    https://minbrowser.org


    ## x86 on ARM FEX


    With ARM64 becoming an ever more viable platform for general Linux desktop and
    laptop use, we find ourselves at an exciting juncture. For the first time in a
    generation, there’s a split between a dominant and well-established architecture,
    x86 and x86-64, and a nascent newcomer, ARM-based ArmArch64. Most distributions
    now have a quickly maturing ARM build of their latest releases, and open source
    means almost everything can be rebuilt without too much difficulty, but there’s
    still a transition period for some software, especially on distributions such
    as Arch where not everything in the AUR offers an ARM binary and proprietary software
    with only x86-based builds. Apple is tackling this problem on its M1 and M2 macOS
    machines with its incredibly performant Rosetta, which now works natively within
    Ubuntu virtualization on macOS, but FEX is trying to do the same thing for native
    Linux. FEX is an x86 and x86-64 compatibility and translation layer for ARM64,
    enabling you to run x86 binaries from an ARM host. It only currently works with
    ARMv8.0 and ARMv8.1+, rather than the chips found on older Raspberry Pi devices,
    but it does run quickly and efficiently enough to be unnoticeable on modern hardware.
    It’s a brilliant way to run games and other proprietary software that may not
    yet offer native ARM builds. On Ubuntu, there’s a handy script that will install
    all FEX’s necessary dependencies and add the project’s PPA to your package archive.
    An x86 RootFS image of the same distribution is also needed to provide the run-time
    environment for your x86 executables, and the script will download this, and let
    you choose to run it uncompressed or from the compressed image to save space.
    Either way, it works without any further setup. Type FEXbash and you immediately
    get an x86 version of Bash running within your own filesystem. Type uname -a and
    you’ll see it’s x86, and you can access many other x86 executables directly. Even
    graphics acceleration remains intact as it’s passed through to your host system
    libraries, and it all works brilliantly.


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_86_1.png)


    Here’s an x86 version of StepMania running with FEX on an ARM64 version of Ubuntu
    running virtualized on an M1 Mac.


    **Project Website**

    https://github.com/FEX-Emu/FEX


    ## Audio effects: PauXStretch


    If you''re into music production, or otherwise playing around with audio, time
    stretching is one of the most common audio effects you can use. This is because
    time stretching is both practical and creative. It''s practical because it enables
    you to mix audio recorded at one speed with audio recorded at another, without
    any sign that the audio has been processed. It''s creative because your audio
    becomes malleable in both duration and pitch. Both time stretching and pitch shifting
    are intrinsically linked because, to make a duration longer or shorter, audio
    is slowed down or speeded up. This affects its pitch. And the process to restore
    pitch isn''t easily accomplished. The human voice, for example, contains formants
    that don''t track the fundamental pitch of the voice. They need to be filtered
    out and separately processed, and there are the same caveats for any other type
    of music, instrumentation, or percussion.


    To accommodate all this audio complexity, all kinds of algorithmic dealings have
    been created for dealing with specific types of sound, and many of those techniques
    can also be used creatively. Which is exactly what this audio plugin, PauXStretch,
    has been designed to do. The Paul in its name comes from the central algorithm
    it uses to process audio (Paul''s Extreme Time Stretch, originally developed by
    Nasca Octavian Paul), but the plugin has been designed to give you quick and easy
    access to a comprehensive suite of time stretching related functions that can
    do anything from accurately changing the pitch of your audio to mangled it beyond
    all recognition. There are seven horizontal modules that can be selectively enabled
    or disabled, and these manipulate the stretch amount, harmonics, noise, frequency
    shift and spread, a low- and high-pass filter, and even binaural processing. Their
    order can be changed with a flow diagram below the module parameters. Beneath
    this is a tabbed view to show the sampled audio waveform, the processed segment
    ratios, and an equalizer.


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_87_0.png)


    Alongside the pitch and time shifting, there are some excellent standard effects
    that can be used in isolation, including compression and equalization.


    This might all sound complicated, but you can easily play with the controls without
    understanding their function, and the sound can range from slight tonal differences
    to huge, glitching feedback loops. You can either process a file or an incoming
    stream and send the output back to your audio application or to an exported file.
    Audio can be sampled and frozen, with a subsection selected from the waveform
    view for special tasks. It works well as a DJ or musician''s effect for real-time
    processing, and it''s equally adept as a drop-in effect in Ardour or Bibitub.
    But what''s especially remarkable about this plugin is its quality, and that could
    be because its developer usually makes commercial and proprietary open source
    audio and can even be built as a shiny new and unexplored CLAP plugin (which is
    how we tested it). The UI has a level of professionalism you don''t often see
    in open source plugins. While there are many different options crammed into its
    single window, they''re easy to navigate and don''t overwhelm the UI with complexity.
    This is a genuine accomplishment that''s quite apart from the amazing sound processing
    the plugin is capable of, and it''s brilliant to see effects like these making
    their way to Linux.


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_87_1.png)


    PauXStretch is one of the first audio plugins we''ve been able to build and use
    as a CLAP plugin, making it ideal for powerful Linux audio processing and manipulation.


    **Project Website**

    https://github.com/essej/pauxstretch

