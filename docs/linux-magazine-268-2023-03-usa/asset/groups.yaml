    得益于 Linux 内核的内置功能，我们幸运地拥有几个知名且高度复杂的网络监控工具。Wireshark 已成为底层分析的行业标准，而 Pomerstear
    等高级应用程序让我们能够完全控制进入和离开我们网络的内容。但对于非专家来说，选择并不多。对于这些人来说，Sniffnet 可能就足够了。Sniffnet 是一个图形网络监视器，显示进出数据的饼图以及正在使用的网络协议分解。首先，你需要选择系统检测到的网络设备，并且你需要以
