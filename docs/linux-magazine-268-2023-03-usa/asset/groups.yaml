    # 解除 Snap（unsnap）


    Flatpak 更优，因为它的目标主要是桌面环境。另一方面，Snap 的目标还包括服务器领域。


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_51_0.png)


    图 4：如果通过 `./unsnap auto` 命令调用该脚本，流程将自动完成。


    ## 需要返工的地方


    我的测试耗时大约 10 分钟，并提供了关于当时正在发生何事的详细信息。`flatpak list` 命令（图 6）可用于确定哪些 Snap 已转换为 Flatpak
    格式。对于有 Flatpak 等效项的 Snap，unsnap 已顺利将其转换，且所有程序均保持可用状态。该脚本未对剩余的 Snap 及其基础设施做任何改动。若要彻底将
    Snap 从计算机中清除，还需进行一些手动操作。


    随后，我重新安装了 Ubuntu 22.04，并安装了一些我知道有对应 Flatpak 的 Snap，包括 Gimp 2.99.10 Beta、Krita、Spotify
    和 KeePassXC。在此过程中，我还为 Gnome 安装了多个额外的运行时环境（由于 Krita 的存在，也安装了 KDE 的运行时环境），以及 Canonical
    提供的其他基础设施软件包。在此环境中，使用与之前相同的流程，我接着测试了 unsnap 在能够将所有 Snap 转换为 Flatpak 时，是否也会移除 Snap
    基础设施。


    我加载该脚本并输入 `./unsnap auto` 来运行它。这一次，unsnap 首先必须安装 Flatpak 并连接到 Flathub。完成这些操作后，调用成功地将所有手动安装的
    Snap 替换为 Flatpaks。此外，它还成功禁用了在安装过程中已存在的 Firefox Snap。


    通过 `flatpak list` 检查时，我注意到该方法的一个小缺点：所有 Flatpak 都是系统级的，因此对所有用户都可访问。没有选项将 Flatpak
    限制在特定用户。


    然后我运行 `snap list` 查看是否还残留有 Snap 基础设施。天哪，Snap 软件包确实已被删除，但基础设施仍然存在。显然，脚本没有执行六个辅助脚本（`99-remove-snap`）中的最后一个。我随后手动执行此操作，进入
    `~/.unsnap/log$282...` 目录并在那里运行 `./99-remove-snap` 命令。该脚本移除 snapd，并删除基础系统不需要的部分基础设施组件。


    然而，我发现 Snap 基础设施已深深扎根于 Ubuntu 中，即使是手动操作也无法移除所有内容（图 7）。


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_51_1.png)


    图 5：已安装的 Snap 并不总存在 Flatpak 等效项；unsnap 会单独列出这些情况。


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_51_2.png)


    图 6：运行 unsnap 后，可使用 `flatpak list` 命令检查脚本将哪些 Snap 替换为了 Flatpak。


    ### 手动操作


    即使没有 unsnap，也可以从计算机中移除 Snap 基础设施。要做到这一点，首先禁用相应的 systemd 服务（清单 2，第 1 至 3 行）。然后使用命令


    ```

    sudo snap remove $PACKAGE

    ```


    逐项删除 `snap list` 显示的所有内容。最后，移除残留文件（第 5 至 7 行）。之后，可以手动将已删除的软件包以 DEB 或 Flatpak 格式重新安装。


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_52_0.png)


    **图 7：** 我不得不通过运行 `./99-remove-snapd` 脚本来移除尽可能多的 Snap 基础设施。尽管如此，仍有一些残留文件。


    ### 结论


    在 Ubuntu 及其衍生版（如果它们使用 Snap）上，unsnap 允许您直接将已安装的 Snap 替换为 Flatpak。为此，必须存在等效的 Flatpak，而图形应用程序通常都有等效项。通过少量手动操作，也可以移除
    Snap 基础设施。


    然而，该项目在 GitHub 上警告称，该软件仍处于预 Alpha 阶段。我试图从 Alan Pope 处获得一份声明，但在本期杂志付印前未能如愿。我知道许多用户已成功使用
    unsnap，我自己也没有遇到任何问题。但为了保险起见，我建议使用手动移除选项，然后以您希望的格式重新安装已删除的软件包。 ■■


    ### 作者


    **Ferdinand Thommes** 生活在柏林，是一名 Linux 开发人员、自由撰稿人和导游。


    ### 清单 2：移除 unsnap


    ```

    01 $ sudo systemctl disable snapd.service

    02 $ sudo systemctl disable snapd.socket

    03 $ sudo systemctl disable snapd.seeded.service

    04 [...]

    05 $ sudo rm -rf /var/cache/snapd

    06 $ sudo apt autoremove --purge snapd

    07 $ rm -rf ~/snap

    ```


    ### 信息


    1. Erik Bärwaldt 的“创新的 Linux 包管理器”，载于 *Linux Magazine*，2022 年 12 月刊，第 265 期，第
    72 页

    2. Snap 商店：`https://snapcraft.io/store`

    3. 无 Snap 的 Mint：`https://linuxnews.de/2020/06/02/linux-mint-20-ohne-snapd/`

    4. unsnap：`https://github.com/popey/unsnap`

    5. applist-csv：`https://github.com/popey/unsnap/blob/main/applist.csv`


    # 深入剖析


    # LibreOffice Writer 暴躁审稿人（Angry Reviewer）


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_53_0.png)


    # 暴躁审稿人（Angry Reviewer）


    “暴躁审稿人”（Angry Reviewer）风格检查可用于评估和改进各类写作，包括学术论文和基金申请。 *作者：Bruce Byfield*


    LibreOffice Writer 拥有数百种扩展 [1]。许多扩展是外观修饰、琐碎或专用的。然而，少数几个是对功能的重要补充。过去，一些扩展（如 PDF
    导出）最终进入了 Writer 的默认界面。最终，“暴躁审稿人”风格检查器 [2] 可能会做到同样的事。虽然它是为了改进学术论文和基金申请而设计的，但 Angry
    Reviewer 足够全面且实用，可用于任何类型的写作。你可以把它称为广受宣传的 Grammarly [3] 的 Linux 版本，尽管它的反馈可能更有用。


    Angry Reviewer 可在其网站上获取 [4]，但 Writer 扩展的优势在于允许您离线工作并运行 Angry Reviewer，而无需复制粘贴。像所有扩展一样，可以通过
    *工具 | 扩展管理器* 安装。重新启动 Writer 后，Angry Reviewer 会被添加到顶级菜单中。点击 *Check This Text*（检查此文本，图
    1）后，会打开第二个包含反馈的 Writer 文档。然后可以将这两个文档并排放置，以便您评估反馈并进行更改。


    ## 工作中的 Angry Reviewer


    当我在大学教授写作课的时候，我告诉学生们，如果他们足够了解英语，能够有效地使用拼写检查器或风格检查器，那么他们就不需要这些工具。这类工具太容易以其听起来权威满满的反馈将读者引入歧途——比如一个学生在一篇关于
    Gloria Steinem 的文章中写道“几个世纪以来，男性一直让女性感到沮丧”（许多女性坚称这不是笔误）。问题在于，大多数此类工具是规定性的，将语法和风格视为固定形式，并且倡导的标准已落后时代数十年。


    相比之下，Angry Reviewer 不仅更灵活，而且解释得足够详细，使作者在实际获得快速修正的同时，可能真的学到一两件事。引用诸如 *On Writing
    Well: The Classic Guide to Writing Nonfiction*（《写好非虚构作品的经典指南》）和通用经典 *The Elements
    of Style*（《风格：经典写作指导》）等来源，该页面列出了以下规则，并附有示例：


    - 不要*过度炒作*。避免使用诸如 *新颖、高度、显然、极大地、甚至更好、避免所有副词* 之类的词语。

    - 不要使用*陈词滥调*。*一言以蔽之，大体上，它们都晦涩难懂*。

    - 不要*经常*使用“*very*（非常）”这个词。通常，有比它更好的词。

    - 要简洁。避免使用诸如“*通过……手段、尽管事实是、为了……目的*”之类的短语。

    - 避免否定形式。例如，使用“*unable*（不能）”代替“*not able*（不行的）”。

    - 避免冗余；例如，使用“*investigate*（调查）”代替“*conduct an investigation of*（进行一项关于……的调查）”。

    - 使用*主动语态*。*虽然并非总是可能，但大部分文本应使用主动语态*。

    - 避免不当的语言。将诸如“*really（真的）、actually（实际上）、pretty much（差不多）*”之类的词留给社交媒体。

    - 避免生僻词和拉丁语借词。*并非所有读者都知道其含义*。

    - 尽量减少使用缩写。*缩写难以阅读，请考虑直接拼写出来*。

    - 警惕僵尸名词 [5]（名词化，即由动词、形容词或其他名词构成的名词）。*名词化的使用是分心的原因*。


    总体而言，这些规则鼓励清晰、精确和简洁——这些是任何写作的优点。在对一篇文章的反馈中，这些规则以建议的形式提供，通常使用诸如“考虑”和“也许”等词语，以明确表明存在意见分歧的空间。在这篇文章通过
    Angry Reviewer 运行之后，我未应用的一条反馈是“避免使用‘it is’（它是）结构，因为它们会掩盖句子的主语和动作”（尽管这条建议总体上是好的）。我唯一想补充到
    Angry Reviewer 规则列表中的，是乔治·奥威尔在其类似的规则列表 *Politics and the English Language*（《政治与英语》）[6]
    结尾处的名言：“宁破这些规则，也不说任何绝对野蛮的话。”


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_54_0.png)


    **图 2：** Angry Reviewer 对本文章第一稿前三段的反馈。


    换句话说，如果您有充分的理由忽略 Angry Reviewer 的反馈，请尽管这样做。例如，如果您正在小说中写对话，或引用某人的话，口语英语往往比书面英语更不合语法，这些规则可能并不总是适用。在另一个例子中，当我将
    Angry Reviewer 应用于本文（图 2）时，我没有按照建议拼写“PDF”，因为可以预期我的读者知道这个缩写。同样，我没有将“you（你/您）”改为“one（某人）”，因为那样会太正式（而且我的编辑可能会更改它）。不过，我确实将一个被标记为过长的句子拆分了。我还考虑并有时更改了几个被质疑的选词。此外，我注意到我有时使用不必要的副词和诸如“By
    and large（大体上）”之类的惯用语，这等同于陈词滥调，并记下要在未来避免这两种习惯。总体而言，我认为 Angry Reviewer 是一个有用的工具，即使是我拒绝的反馈也迫使我在编辑时更具分析性。


    我还注意到 Angry Reviewer 忽略了脏话和俚语，并且与 Writer 的拼写检查不同，它没有捕捉到重复的单词或多余的空格。不过，当前版本仅为 1.2，与此同时，连续运行拼写检查和
    Angry Reviewer 并没有太大的负担。


    我对 Angry Reviewer 的唯一批评是，它被添加到了主菜单中，而它应该属于“工具”菜单（也许工具栏上有一个图标），我会很感激有一个选项，可以逐个展示每条反馈，并显示相关段落。但这些以后再说。无论以何种方式呈现，Angry
    Reviewer 的反馈都是有用的，我推荐所有级别的作家使用它。 ■■


    **信息**


    [1] LibreOffice Writer 扩展：https://extensions.libreoffice.org/en/extensions/

    [2] Angry Reviewer：https://github.com/anufrievroman/libreoffice-angryreviewer

    [3] Grammarly：https://www.grammarly.com/

    [4] Angry Reviewer 网站：https://www.angryreviewer.com/

    [5] 僵尸名词：https://archive.nytimes.com/opinionator.blogs.nytimes.com/2012/07/23/zombie-nouns/

    [6] 奥威尔，乔治。政治与英语：https://www.plainlanguage.gov/resources/articles/politics-and-the-english-language/


    **作者**


    Bruce Byfield 是一名计算机记者，也是一名专注于自由和开源软件的自由撰稿人和编辑。除了写作项目，他还教授现场和电子学习课程。在业余时间，Bruce
    撰写关于 WordPress 的文章。[http://brucebyfield.wordpress.com](http://brucebyfield.wordpress.com)。他也是
    Prentie Pieces 的共同创始人，这是一个关于写作和奇幻的博客，位于 [https://prenticpieces.com/](https://prenticpieces.com/)。


