    \ 越来越强地在 Ubuntu 中推广该格式，且没有官方方法来移除 snaps。\n\nSnap 守护进程（`snapd`）是从 Canonical 服务器检索\
    \ snaps 及相关元数据的定义工具。此外，snaps 存在功能缺陷，公司一直缓慢地消除这些缺陷。另一方面，Flatpak 受到替代软件包系统拥护者的欢迎。Flatpak\
    \ 可能是\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_49_1.png)\n\n**图 1：** 当你通过 *Ubuntu\
    \ 软件* 安装程序时，可以通过右上角的选择框定义来源。某些软件包（如 Firefox）通常仅以 snaps 形式提供。\n\n大多数 Ubuntu 环境外部用户的选择。这最终可能导致\
    \ Canonical 再次搁置 Snap，正如过去常发生的那样，例如 Ubuntu Touch 或 Mir 显示管理器。\n\n这种情况导致一些发行版拒绝甚至阻止\
    \ snaps。一个突出的例子是基于 Ubuntu LTS 的 Linux Mint，其开发者早在 2020 年就决定不交付 snaps [3]。他们还宣布，从版本\
    \ 20 开始，Linux Mint 将通过图形软件包管理器主动防止安装 Snap 框架，防止通过后台将 snaps 自动发送到用户系统。笔记本电脑制造商\
    \ System76 [Pop!_OS] 和 Tuxedo（Tuxedo OS 1）也避免在其 Ubuntu 衍生版中附带 snaps。甚至 Ubuntu\
    \ 用户也没有响应 Snap，正如许多指南所建议的那样，描述在 Ubuntu 中作为 DEB 安装 Firefox。\n\n### unsnap\n\n前\
    \ Snap 共同开发者 Alan Pope，在该公司工作了 10 年后于 2021 年离开 Canonical，开发了 `unsnap` [4]，一个在可用时将\
    \ snaps 替换为 Flatpaks 的脚本。该脚本托管在 GitHub 上，开发者已测试其在提供 snap 和 Snap 格式软件包的 Ubuntu\
    \ 及所有衍生版上的使用。\n\n为了在新安装的 Ubuntu 22.04 LTS 上测试 `unsnap`，我除了现有的 snaps 外，还通过 Ubuntu\
    \ 软件包管理器设置了一些来自 Snap Store 的软件包，然后列出来以确保（图 2）。然后我从 GitHub 下载了 `unsnap` 脚本。为此，我首先必须安装\
    \ `git` 包，然后运行代码列表 1 中的命令。\n\n在深入细节之前，让我们看看脚本是如何工作的。启动后立即，`unsnap` 创建一个日志目录，在其中生成六个针对特定系统定制的额外脚本（见表\
    \ 1）。`applist.csv` [5] 文件用于查找与安装的 snaps 匹配的 Flatpaks。\n\n### 多个步骤\n\n要启动脚本，首先通过输入\
    \ `cd unsnap` 切换到相应目录。\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_50_0.png)\n\
    \n**图 2：** `snap list` 命令列出系统上安装的所有 snaps。\n\n`./unsnap` 命令（图 3）首先通知你，将运行各种检查以确定\
    \ Flatpak 是否已安装，Flathub 是否包含在内，以及哪些 snaps 有 Flatpak 等效项。\n\n### 代码列表 1：安装 unsnap\n\
    \n```\n$ git clone https://github.com/poppey/unsnap\n```\n\n接下来，`unsnap` 创建辅助脚本。如果你有一个原因不运行某个辅助脚本，你可以手动逐个启动这些脚本。否则，调用\
    \ `./unsnap` auto 以自动安装脚本（图 4）。\n\n在我的实验室系统中，我安装了大约 20 个 snaps，其中 `unsnap` 能够替换大约一半。然而，我特意安装了诸如\
    \ Canonical Juju 和 LXSD 工具，以及 Mutter 命令行邮件客户端等 snaps，以测试脚本如何响应（图 5）。一般来说，为图形应用找到\
    \ Flatpak 对应项的机会\n\n### 表 1：unsnap 子脚本\n\n| 脚本 | 功能 |\n|---|---|\n| 08-backup\
    \ | 为每个要迁移的 Snap 包运行 snap save 命令。 |\n| 01-install-flatpak | 如果尚未安装，安装 Flatpak\
    \ 软件包管理器。 |\n| 02-enable-flathub | 如果未启用，将 Flathub 软件源添加到 Flatpak。 |\n| 03-install-flatpaks\
    \ | 为每个识别出的 Snap 包安装 Flatpak，如果存在的话。 |\n| 04-remove-snaps | 移除有替代 Flatpak 的 snaps。\
    \ |\n| 99-remove-snapd | 移除 snapd 本身，这将移除任何仍然安装的 snaps。 |\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_50_1.png)\n\
    \n**图 3：** 如果你调用脚本时没有附加命令，它会确定系统状态并创建所需的辅助脚本，然后你可以手动启动它们（如果需要）。\n\n"
