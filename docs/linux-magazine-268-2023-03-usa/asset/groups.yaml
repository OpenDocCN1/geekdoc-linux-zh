    \nFor many uses, this is enough information to use *fzf*. However, depending on\
    \ how *fzf* is compiled, it can also support context-specific autocompletions\
    \ by entering a command followed by **\\*+Tab** and will give appropriate suggestions,\
    \ such as file names for Vim or remote systems for SSH. If autocompletion is not\
    \ enabled, check the project’s GitHub page for instructions.\n\n## Other Command\
    \ Options\n\nMost online articles on *fzf* end at this point. However, a few distributions,\
    \ such as Ubuntu, offer man pages with additional options, neatly organized into\
    \ categories. Among the most immediately useful are the search modes. Some of\
    \ these options may be familiar to you from find and other search commands. For\
    \ instance, with **\\*1**, searches become case-sensitive, while you can reduce\
    \ clutter in the results with –exact. In addition, –ai=**g**\\*TYPE sets the fuzzy\
    \ algorithm, completion with v1 optimizes speed over best results, and v2 optimizes\
    \ results over speed.\n\nAnother useful option category is for search results.\
    \ The arrangement of results can be influenced by –t{left}=**CfI** {CRITERIA,\
    \ CRITERIA}. The default criteria is length, which favors shorter results, but\
    \ you can give it lower priority by its position in a list that can contain begin\
    \ (with the search string closer to the start of the line), end (with the search\
    \ string closer to the end of the line), or index (a line that already appears\
    \ in the results). Each criterion should only appear once, and index (for obvious\
    \ reasons) must always appear last. If you are searching for high-level directories,\
    \ start might be a useful option or end if you are searching for a file name.\
    \ In addition, –tac displays results in reverse order.\n\nOther options are cosmetic,\
    \ such as disabling the mouse or horizontal or vertical control, or aspects of\
    \ appearance, such as color theme or window border size for previews. These options\
    \ no doubt become more important the more often you use *fzf*, but at first glance\
    \ give a false sense of complexity for what is after all a relatively well-organized\
    \ utility.\n\n## Rough Edges\n\nThe latest version of *fzf* is 0.38, and many\
    \ distributions offer even earlier packages. Unsurprisingly, *fzf* is still rough\
    \ around the edges, with no indication of what features are compiled in which\
    \ package or distribution and scanty documentation. Fortunately, though, you do\
    \ not need all the possible features to find *fzf* a major improvement in search\
    \ functions. In fact, *fzf* has several levels of complexity, each of which is\
    \ useful in itself. As a result, even with the general release apparently some\
    \ way off, *fzf* is a welcome innovation that is well on the way to becoming the\
    \ new norm in search commands. **▮▮**\n\n### Info\n\n- 1. fzf: https://origin-sysadmin.redhat.com/fzf-linux-fuzzy-finder\n\
    - 2. Fuzzy logic: https://en.wikipedia.org/wiki/Fuzzy\\_Logic\n"
