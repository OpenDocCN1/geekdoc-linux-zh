    \n    ++$line_number;\n}\nclose ($forecast);\n\n$line_number = 0;\nopen (my $profile,\
    \ '<', $ARGV[1]) or die \"Failed to open $ARGV[1]\";\nwhile ( my $line = <$profile>\
