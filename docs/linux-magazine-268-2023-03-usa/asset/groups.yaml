    ## X 窗口


    图形应用程序最初可能会给 Docker 带来一些问题，但这很容易解决。对于传统 X 应用程序（非 Wayland），诀窍是将 `/tmp/.X11-unix/`
    目录和 `$DISPLAY` 环境变量传递给容器。你可以通过创建一个名为 `olgedit` 的自定义镜像（参见“使用 Dockerfile 构建镜像”框）来让旧版本的
    `gedit` GNOME 编辑器正常工作。


    ### 列表 9：Dockerfile


    ```

    FROM ubuntu:14.04

    RUN apt update

    RUN apt install -y gedit

    RUN useradd -m user

    USER 1000

    CMD gedit

    ```


    ## Wayland


    当前版本的 Ubuntu 使用 Wayland 作为 X 窗口系统的后继者，Wayland 提供了一个兼容层，允许 X 应用程序在其上运行。真正的 Wayland
    程序无法在 X 上运行。一个例子是 foot 终端程序，你可以通过在 Ubuntu 中输入 `sudo apt install foot` 来安装它。如果你在
    Wayland 会话中启动 foot，会出现一个终端窗口。如果你试图在 X 会话中做同样的事情，会出现一条冗长的错误消息，最后以 `failed to connect
    to wayland; no compositor running? goodbye` 结尾。


    Wayland 使用不同的套接字和文件来提供对 Wayland 服务器的访问。套接字文件是 `/run/user/1000/way-0`，而不是 `/tmp/.X11-unix/X0`，并且
    `$XDG_RUNTIME_DIR` 变量包含了相关信息，如文件夹名称 `/run/user/1000/`，而不是 `$DISPLAY`。你需要像 X 那样将两者都传递给容器，如下列表
    11 所示。`waylandtest` 只是另一个测试镜像的名称。如果 Wayland 服务器正在运行，也可以组合 X 和 Wayland 的支持。在这种情况下，你需要将两个套接字和两个环境变量都传递给容器。


    ### 列表 10：X11


    ```

    $ docker run -it --rm -e DISPLAY \

    -v /tmp/.X11-unix/:/tmp/.X11-unix \

    -v $HOME:/home/user olgedit

    ```


    ### 列表 11：Wayland


    ```

    $ docker run -it --rm -e XDG_RUNTIME_DIR -v $HOME:$HOME -v /run/user/1000/wayland-0:/run/user/1000/wayland-0
    waylandtest

    ```


    `olgedit` 镜像没有配置启动 `/bin/bash` shell，而是直接启动 gedit 编辑器。它以普通用户权限执行此操作，也就是说，不是作为
    `root`，而是作为 ID 为 1000 的 `user`。现在，当你通过输入 `docker run -it --rm olgedit` 尝试启动容器时，你会看到一些以
    `cannot open display` 结尾的错误消息。该程序无法访问 X 服务器，因此无法打开窗口。主机上运行的 X 服务器在 `/tmp/.X11-unix/`
    下创建一个名为 `X0` 的特殊套接字类型文件，应用程序可以在此处与其联系。除了 `X0` 之外，如果有多个 X 服务器处于活动状态，这里可能还有其他条目（`X1`、`X2`
    等）。显示程序窗口的 X 服务器由 `$DISPLAY` 环境变量决定。它通常包含 `:0` 的值。然后使用 `-e $DISPLAY` 和 `-v /tmp/.X11-unix/:/tmp/.X11-unix`
    选项将变量的内容以及对 `/tmp/.X11-unix/` 中套接字的访问权限传递给容器（列表 10），允许 gedit 运行。由于主目录另外映射到容器中的
    `/home/user/`，gedit 也应该能够打开和编辑文件（图 5）。


    使用 `docker ps` 查找容器。在由非常长的行组成的概览中，除了数字 ID 之外，还有一个漂亮的名称，除非你在启动时为新的容器指定一个，否则 Docker
    会随机分配该名称。数字 ID 和名称都可以用于 `copy` 命令（例如，将文件 `/etc/passwd` 复制到容器中）。列表 8 的第 9 行将 `/etc/passwd`
    文件从主机系统复制到 ID 为 22340547e6a3 的容器及其相同文件夹中，名称保持不变。


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_77_0.png)


    ## 结论


    Docker 容器提供了虚拟机（VM）的一种实用替代方案，既节省时间又节省计算资源。对于许多应用程序来说，学习如何使用 Dockerfile 构建自己的镜像是值得的。你并不总是需要从头开始，可以使用
    Docker Hub 上的镜像作为基础，并将其配置以满足你的需求。当你同时使用一系列容器时，事情开始变得更有意思。然后，诸如容器网络配置和使用 Kubernetes
    [7] 等工具进行编排等高级主题开始出现。■


