    \n> Linux 杂志 (LM)：你为何开始开发 NuTyX？\n\nThierry Nuttens (TN)：我总想理解我所组装事物的内部工作原理。NuTyX\
    \ 也不例外。当我在 17 多年前开始探索这个解释系统时，我对自由软件世界知之甚少。我最感兴趣的是拥有一个高性能、可靠且易于维护的系统。当我发现 Linux\
    \ From Scratch 项目时，我对 Linux 的看法发生了根本性变化，该项目解释了（几乎）所有内容，从构建一个 chroot 系统，到构建构建工具链，最后由你自己构建一个可操作的工作操作系统。即使今天，我仍然从该项目及其简单透明的维护方式中学习。\n\
    \n然后我遇到了 CRUX 项目 [3]，它提供了我确切需要的包管理器。在这个小型\n\n![](img/e3f454b04d121b3750fddfda8dd21e_21_1.png)\n\
    \n# 发行版之旅 – NuTyX\n\n命令行工具中，命令不仅简单，而且速度很快——更重要的是——命令是静态编译的，这使得编译后的包和存档可以以 TAR\
    \ 文件的形式安装。\n\n但是，我有一个主要问题：CRUX 不提供下载或依赖管理。所以我决定创建我自己的包管理器，称为 Cards [即“创建、添加、删除和下载系统”（Create,\
    \ Add, Remove, and Download System）]。如今，我们有 4,500 个包，由我们两人维护。\n\n**LM：** NuTyX\
    \ 是如何从 LFS 发展为一个更用户友好的系统，同时保持其效率和透明度的？\n\n**TN：** 如今，NuTyX 可以通过多种方式安装。对于初学者，有几个\
    \ ISO [LXDE, Xfce, MATE, KDE, Gnome, Cinnamon] 可以直接安装。每个 ISO 允许在直接模式或 live 模式下从\
    \ RAM 或挂载的 ISO 进行自动或半自动安装。最后，一个脚本允许你在手动模式下安装发行版。除了最新稳定内核外，所有 LFS 内核都作为一个单独的包提供。一旦达到生命周期结束，Cards\
    \ 会通知用户。一个教程解释了如何进行内核变更。与 LFS 一样，提供了两个 init 系统，SysV 和 systemd，但与 LFS 不同，这两个系统在\
    \ NuTyX 上可以毫无担忧地共存。\n\nNuTyX 包可用滚动版本和测试版本，每个都组织为三个仓库：base、cli 和 gui。正如名称所示，*cli-extra*\
    \ 和 *gui-extra* 集合分别由命令行（*cli-extra*）和图形（*gui-extra*）额外包组成。每个仓库进一步细分为 *devel*、*lib*\
    \ 和 *man* 等领域。更新在系统关机时发生。\n\n**LM：** Cards 与其他包管理器有何不同？\n\n**TN：** 得益于 C++，代码库规模保持适度，操作依赖项减少到严格的最小限度。这个包管理器速度很快……非常快。使用核心参数安装只需\
    \ 11 秒。\n\n真正使 Cards 与其他包管理器不同的是，Cards 还被用作 NuTyX.org 网站的渲染引擎。该网站由 Cards 提供支持。原因非常简单：网站的主要功能是搜索\
    \ NuTyX 包。无法登录 NuTyX.org 网站。最后，访问网站时不会安装 cookie。\n\n**LM：** NuTyX 的目标受众是谁？\n\n\
    **TN：** 这是 NuTyX 上的一个反复出现的话题。没有图形安装程序，因此从第一个屏幕开始安装 NuTyX 就令人望而生畏。如果一个新用户从未安装过除\
    \ Windows 或 Apple 以外的操作系统，他自然会因 NuTyX 而感到震惊。尽管如此，在安装可能性列表中，确实存在一种完全自动的安装（即分区、格式化和启动安装将在无任何用户干预的情况下完成）。\n\
    \n采取这种方法是出于双重原因。首先，对于需要测试每个生成的 ISO 的我来说，这极其简单且快速。它为我节省了每次新安装都要选择相同选项的麻烦。其次，对于新用户，90%\
    \ 的情况下会在虚拟机中进行首次测试，因此使用的是一个完全空白、没有任何分区磁盘——这是触发可能自动安装的必要条件。即使用户是专家，他也可以非常快速且完全自动地安装\
    \ NuTyX。\n\n**LM：** NuTyX 是如何组织的？\n\n**TN：** 项目中有三个人。我向 Spiky 致以最热烈的问候，他专门负责测试版本中的包更新。我向\
    \ Guth 也致以最热烈的问候，他负责主仓库服务器的正常运行。\n\n在 16 年里，我不记得有过中断。我更新安全漏洞、内核、浏览器和其他不提供依赖的应用程序的“滚动”版本。我维护\
    \ NuTyX.org 网站上的文档页面。Cards 也是我的日常任务之一。有时我会发现新功能来实现。\n\n当 Spiky 在某些包上遇到困难时，我也会支持他。当测试版本冻结到来时（大约每\
    \ 1 到 2 个月一次），我会接收 Spiky 准备的分支，并开始我的测试系列，将滚动分支合并到测试分支并安装每个包，以检测任何重复文件或缺失或过时的依赖项。\n\
    \n然后我生成所有 ISO 并在虚拟机中测试它们。Spiky [用英语] 和我 [用法语] 一起编写新闻，宣布即将发布的 NuTyX 版本。一旦测试版本通过上述所有测试，滚动版本将被测试版本覆盖，ISO\
    \ 使用滚动版本生成并发布，NuTyX.org 上可用的安装脚本更新，并发布新版本。\n\n## 精品 Linux\n\n如今，Linux 是一桩大生意，至少从媒体报道来看似乎如此。然而，与\
    \ Thierry 交谈提醒我们，个人印记继续推动着 Linux 和自由软件在幕后发展。正如 Spiky，一位长期的 LFS 用户，在 Thierry 回答我问题的补充说明中指出的那样，像\
    \ NuTyX 这样的小型发行版继续提供大型发行版无法提供的替代方案。“你可以与它们的创建者交谈，”Spiky 说，“这在其他发行版中几乎是不可能的，而且新用户可以与团队互动而不会受到轻视。”\n\
    \n### 参考信息\n\n- [1] NuTyX GNU/Linux: https://www.NuTyX.org/en/\n- [2] LFS: https://www.linuxfromscratch.org/\n\
    - [3] CRUX: https://crux.nu/Main/HomePage\n\n"
