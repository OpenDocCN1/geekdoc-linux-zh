    # 创客空间\n\n## Raspberry Pi\n自动喂食器\n\n## 鱼食\n\n无论在工作还是度假期间，每个宠物主人都担心在自己缺席期间如何照顾它们的小室友。鱼缸主人需要一个自动喂食器。*作者：Swen\
    \ Hopfe*\n\n鱼缸喂食器已经存在很长时间了，但在我最近的调研后，没有一个设备在我看来真正实用。很少有设备能提供故障反馈，这在你回家时可能会是一个讨厌的惊喜。我创建了这个自动喂食器项目用于我的鱼缸，以求安心。\n\
    \n![](img/e3f454b04d121b3b3750fddfda8dd21e_57_1.png)\n\nRaspberry Pi Zero 是鱼缸喂食器控制中心的良好选择：它自带控制机械系统以及使用\
    \ Pi 摄像头抓取图像所需的一切（见图 1）。它足够紧凑，可以放入小型外壳中。将 Pi Zero W 集成到您的无线家庭网络中，将允许您在外时在线发布各种捕获的图像。\n\
    \n目标是一个简单且不易出错的设置。因此，机械控制系统仅使用一个小伺服电机。电子电路也同样简单。DIY 控制系统确保了某种程度的便利性。两个喂食器增加了多样性，并且完全足以桥接相当于三周假期的时间。\n\
    \n## 入门\n\n为了让 Zero W 运行起来，您需要下载一个新的 Pi OS 镜像并将其传输到 microSD 卡中。在连接显示器和键盘后，您可以配置启动选项和网络设置。由于以后不需要桌面环境，您可以选择在命令行界面\
    \ (CLI) 上自动登录，并启用 SSH 服务器和摄像头接口。在启用 SSH 和对家庭网络的无线访问后，您不需要在 Zero W 上连接任何外设，并且可以立即从网络上的另一台计算机访问它。所有进一步的设置都可以在另一台计算机的终端窗口中配置。\n\
    \n## 自动鱼缸喂食器\n\n```\n**Listing 1: crontab**\n\n# m h dom mon dow command\n0 *\
    \ * * * 0-5 python3 /home/pi/scripts/Feed.py 1\n# 星期六 1111 星期五\n0 * * * * 6 python3\
    \ /home/pi/scripts/Feed.py 2\n# 每分钟\n*/1 * * * * python3 /home/pi/scripts/Feed.py\
    \ 0\n```\n\nPi 需要一个反映其任务的名称。在此示例中，它被命名为 *feeder*。下一步是在您的主目录中创建一个单独的 *scripts/*\
    \ 文件夹用于项目文件，您稍后将把用 Python 3 编写的 *feed.py* 控制脚本放在那里。而不是在启动 Zero W 时作为内存驻留程序加载它，而是由\
    \ *cron* 在定义好的间隔内反复调用它。\n\n## 您需要什么\n\n商业喂食器通常依赖于相对复杂的机构，例如可装载隔间的旋转台。相比之下，我希望这个喂食器系统尽可能简单，以便\
    \ DIY 系统易于管理并在家缺席期间安全运行。话虽如此，我还是希望在使用和功能方面都有一定的便利性，也是为了我留在家中的宠物。因此，至少有两个喂食管可用于不同的饲料（图\
    \ 2）。\n\n其他考虑因素是如何确保——从远处——我的宠物确实收到了食物。从计算机角度来看的无故障运行并不能提供饲料是否进入鱼缸的反馈，因此我产生了用摄像头记录鱼类喂食并在网络上显示快照的想法。\n\
    \nZero W 自带用于完成此任务的工具，您可以连接 Pi 摄像头在喂食后短暂等待时捕获图像。您只需要鱼缸中自动售货机所在部分的视野。为了保护，Raspberry\
    \ Pi 和摄像头各自封装在一个小盒子中。项目中的其他部件数量是可管理的（参见“部件清单”框）。\n\n## 适时而动\n\n喂食时间表设置在 Zero W\
    \ 的 crontab（cron 表）中，这是管理计划任务处理的文件。喂食器的计划如清单 1 所示，您可以使用 *crontab -e* [1] 创建。\n\
    \nCrontab 指定每天下午 5 点喂食。在星期六，脚本通过命令行中的 2 选项启动，这每周从自动售货机的第二个插槽释放一次替代饲料。cron 表中的第三项带有选项\
    \ 0，启动状态显示（板载 LED 每分钟闪烁一次），并用于从网络读取远程控制代码——但更多关于此内容稍后讨论。\n\n### 部件清单\n\n- Raspberry\
    \ Pi Zero W (1/2)\n- Pi 摄像头 rev 1.3 或更高版本\n- Pi 和 Pi 摄像头的盒子\n- 摄像头连接线\n- 迷你伺服电机\
    \ (MG90 或同等型号)\n- 原型制作面包板 (PCB 面包板)\n- 两个按钮\n- LED\n- 各种电阻器\n- DIY 喂食塔\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_58_0.png)\n\
    \n**图 2：** 您需要的组件。在此设置中，透明的桌面笔架充当饲料筒仓。\n\n## 构建\n\n在我设想解决方案中，饲料由一个小型存储塔提供，该塔通过鱼缸盖上的开口，在重力的帮助下从顶部投放食物。您可以使用当地五金店的零件或在线从工艺品商店订购材料来构建这样一个喂食塔。在我的情况下，一个书桌笔架被用作起点；这种零件在许多商店都很容易买到，并且通常由透明塑料制成，这对于监控填充水平非常理想。\n\
    \n现在是锯割和钻孔的时候了。之后，我添加了伺服电机和机械系统。整个装置然后安装在一个底板上，该底板还承载 Zero W 和一个带有状态 LED 和控制按钮的小电路板（图\
    \ 3）。\n\n饲料出口由专门设计的机构操作。根据伺服电机的旋转方向，笔架的两个管中的一个会打开。为此，一根直轴穿过两个管，每个开口在轴上都有一个闭合件。\n\
    \n由于角度偏移，在短促的左旋或右旋期间，两根轴中只有一根可以打开，并且\n\n"
