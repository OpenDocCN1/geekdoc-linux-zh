    \ window caption is set using the `-T` parameter.\n\nwithin the YAD dialog. For\
    \ more information on how to configure YAD color and font options, see the Pango\
    \ markup language [3] documentation.\n\n# ## Right-Click Menus\n\nYAD also supports\
