    # Enhanced searches with fzf

    **Fuzzy Finder**


    Simplify your searches and get better results with fzf, a modern search tool based
    on fuzzy logic. By Bruce Byfield


    S**earch commands have always been essential to using computers. With the increased
    storage capacity of modern systems, they are more important than ever because
    there is more material to search. In fact, searches are so important that alternatives
    to time-honored commands are becoming increasingly common. One of the most effective
    of these recent alternatives is *fzf*, a command-line “fuzzy finder” [1].**


    For most Linux users, the basic search tool for finding directories and files
    has been *find*, which is most effective when you know exactly what you are looking
    for. If you do not know, then you need a way to allow variation in the output.


    +   **Author**

    +   Bruce Byfield is a computer journalist and a freelance writer and editor specializing
    in free and open source software. In addition to his writing projects, he also
    teaches live and e-learning courses. In his spare time, Bruce writes about Northwest
    Coast art ([http://brucebyfield.wordpress.com](http://brucebyfield.wordpress.com)).
    He is also co-founder of Prentice Pieces, a blog about writing and fantasy at
    [https://prenticepieces.com/](https://prenticepieces.com/).


    Traditionally, variation in search tools like *find* is provided by regular expressions
    (regexes), a concept first developed in the 1950s. Regexes are standard patterns
    that offer different types of variations in results. Most users are familiar with
    the simpler regexes, such as \* to mean zero or any character, so that apt\* might
    return apt, apt-get, apt-cache, and probably many others. At a more advanced level,
    users might know that grep|grey produces results with either spelling, or [b-e]
    a range of characters. However, regexes are not consistent across applications
    and can rapidly become extremely complex to construct or type correctly, especially
    when all you want is a quick answer. For example, even with context, who can easily
    explain this randomly selected example:


    ```

    (\W\*)(\W\*)[0,2,5]@

    (\[yahoo(hotmail|)gmail\]\).com\W\*$

    ```


    Personally, I''d take half a minute or so and re-enter the expected effort. Since
    regexes are worth constructing only when you use the same search repeatedly. In
    addition, you almost always will find scanning fuzzy logic results quicker than
    entering a lengthy regex, even if you type the regex correctly the first time.
    With *fzf*, you interact with the tool through a fuzzy logic interface, while
    *fzf* composes the regexes for a search behind the scenes.


    Fuzzy logic is a science of its own, with principles and theories about communication
    and logic that do not directly concern us here [2]. What matters is that fuzzy
    logic is a much simpler way of introducing variation into output, especially today
    when the patience and general command-line knowledge among computer users is much
    less than it was 70 years ago. For one thing, the order in which variation is
    found with fuzzy logic is less important than with regexes.


    Often, the order does not matter at all, which makes it easier to understand and
    more flexible. Just as importantly, fuzzy logic uses natural language instead
    of its own code that needs to be carefully separated from the query itself. If
    you add an indexed database, as *fzf* does, you can add context to accuracy to
    produce a contextual command history.


    With these advantages, *fzf* has rapidly gained ground in the past few years.
    It is carried in all the major distributions, or it can be installed from its
    GitHub page. Each time *fzf* opens using the bare




