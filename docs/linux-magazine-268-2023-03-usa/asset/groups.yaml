    在线订购：shop.linuxnewmedia.com/specials


    ## FOSSPicks


    来自自由和开源软件世界的璀璨明珠与新发布作品


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_83_0.png)


    在过去几个月里，Graham 的多用途 **Steam Deck** 不仅将书籍同步到了电子阅读器，还在电视上播放电影、加入了 **Mumble** 语音聊天、录制了两期播客，甚至玩了几款游戏。文
    **格雷厄姆·莫里森（GRAHAM MORRISON）**


    ### 视频编辑器：LosslessCut


    尽管我们在过去二十年中取得了令人难以置信的性能进步，但视频编辑仍然感觉像 1995 年在 PowerPC 麦金塔上编辑 Media 100 并写入磁带驱动器一样缓慢。这有几个原因，主要因为我们的需求随着能力的提升而扩展。视频分辨率、色彩深度和帧率都已扩展以适应所有这些多余的处理能力，并且在文件可以被使用之前，几乎总是需要从一个格式转码到另一个格式。


    LosslessCut 试图缓解后一个障碍。由功能极其强大的 FFmpeg 驱动，LosslessCut 可以编辑巨大的视频，并且至关重要地，可以快速导出而不损失质量。它是通过仅允许你在视频流中特定的关键帧处进行编辑来实现这一点的，从而避免了重新计算关键帧之间可能落入的帧所需的处理器密集型操作。通过坚持在关键帧处编辑，视频数据可以直接重写，而不包含被编辑掉的部分。


    随着我们现在大多数人使用手机或 GoPro 等相机录制 4K 视频，像这样的快速编辑是完美的解决方案。我们不是寻找完美的剪辑，而是寻找一种快速切入动作、修剪视频开头和结尾的前奏或附录的方法。使用
    LosslessCut，你只需将视频拖放到主应用程序窗口中，定位“入点”（edit-in point），定位“出点”（edit-out point），然后将中间部分保存为一个新的、较短的视频。这意味着我们无法执行其他类型的编辑任务，如裁剪、旋转、反射或滤镜处理，因为这些任务需要重新计算帧和关键帧，因此会导致有损密集的转换。另一个缺点是，你并不总能确切的点编辑，因为编辑点或分割点会移动到最近的关键帧。幸运的是，UI
    中有关键图标会自动将光标移动到关键帧和完美编辑点。考虑到这些限制，性能瓶颈变成了存储访问，而不是其他应用程序需要执行的转码。


    正在开发关键帧之间的编辑功能，近期的开发版能够重建关键帧之后或之前的帧，从而实现任何位置的编辑，仅需对重建部分进行少量的处理和有损开销。视频的其余部分将不受影响，这仍然是对大多数视频编辑器工作方式的一大改进。UI
    的其余部分简单但有效。高级视图允许你开启波形和缩略图时间线、设置缩放级别、截取单张图像，并查看你片段的分辨率和帧率细节。你还可以导入多个文件，尽管目前它们必须单独编辑，而不是像你可能在
    Kdenlive 中那样在不同轨道上编辑——尽管该功能也将到来。完成后，你可以将编辑内容导出为合并的单段或多个文件。虽然重点显然是保持原始编码，但你也可以选择将输出片段转换为
    FFmpeg 支持的任何格式。这使得 LosslessCut 除了满足你即时编辑的需求外，还成为文件转换的绝佳前端。


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_83_1.png)


    - **轨道**：可以加载、分割和连接多个视频文件。

    - **音频**：音轨可以分离、删除和替换。

    - **输出格式**：LosslessCut 使用其自带的 FFmpeg 或你系统的 FFmpeg 来支持尽可能多的文件格式。

    - **缩略图**：可以为片段可选地启用缩略图和音频波形。

    - **片段**：视频被切割成片段，可以作为批次导出，也可以作为单个文件导出。

    - **关键帧编辑**：使用这些按钮和导航控制在此在这些编辑点之间跳转。

    - **导出**：片段可以标记、重新排序，并显示在右侧单独的列表面板中。


    **项目网站**

    https://github.com/mifi/lossless-cut


