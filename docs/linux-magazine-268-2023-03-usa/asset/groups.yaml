    # TUTORIAL – LDRAW AND LEoCAD




    If you just entered the models in files as abstract numeric sequences, the build
    would not be much fun. This is where LeoCAD comes in. It outputs the models graphically
    and lets you edit your creations. This is how the model in Figure 1 was created
    from the text file in Listing 1.


    # **Virtual Building Fun**


    When you launch LeoCAD for the first time, it needs information on where the LDraw
    files for each LEGO brick are stored. LeoCAD itself comes with a small selection
    of bricks, but this would severely limit your creativity. In the View | Settings
    menu, open a dialog and go to the General tab. Then, in the *Parts Library* field,
    enter the path to the folder where you previously unzipped the LDraw files, for
    example, `~/ldraw/`.


    Now you get started with the virtual build.


    Below the menubar and toolbar, the LeoCAD


    window is divided into two areas. On the left you will find what is initially
    an empty base plate. The plate grows automatically as soon as you place bricks
    close to one of its edges. Top right you will see a ball that you can rotate with
    the mouse. This lets you move the model in any direction to view it from all sides.
    Pressing H switches back to the original view. You can press + to zoom into the
    model and - to zoom out.


    On the right side of the window, LeoCAD displays a list of all available bricks
    at the top, followed by an overview of all colors underneath. For a better overview,
    simply filter the selection. At start-up time, the filter defaults to Brick. You
    can search for bricks using the search field below. Either type in the part number
    you are looking for (e.g., 3002 for a brick with two-by-two studs) or search for
    the size of a brick. To do this, enter something like 2 x 2. Pay attention to
    the spaces:


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_90_0.png)


