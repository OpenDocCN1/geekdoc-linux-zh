    # # Use Ubuntu and other distributions as Docker containers


    # ## Cleanly Docked


    Do you work with Ubuntu but want to test something quickly on an openSUSE system?
    You don’t need a second PC or a virtual machine to do it – a single container
    is quite enough.


    BY **HANS-GEORG EBER**


    A virtual machine (VM) lets you use software intended for a different Linux distribution
    or even a different operating system. But setting up a VM can be time consuming.
    If you use VirtualBox, VMware [1], or Gnome Boxes [2], you can configure and start
    a virtual PC in the program interface before proceeding with the regular operating
    system install. After completing this procedure, the window will contain a full
    graphical desktop, such as KDE or Gnome, and you can boot and shut down the VM
    like a real PC. In many cases, a full install is exactly the solution you need,
    but sometimes you may just want to quickly test a program. Then the overhead for
    a VM install of a complete system is disproportionate to the results. The reasons
    why you cannot always run programs directly on your Linux system are revealed
    in the "Library Dependencies" box.


    If you develop your own software, you may want to test whether the program files
    you generate will run on all distribution versions you support. Can the RPM or
    Debian package you generated be imported? Are all dependencies on libraries met
    so that the program actually launches? Finally, does it work as expected? Again,
    using a VM is a little excessive for these software tests. Containers offer an
    alternative to VMs or real hardware: They do not virtualize a complete computer
    and are therefore not suitable for all purposes, but in many cases they are perfect
    for the use case at hand. The advantage they have is that of resource efficiency
    (lower RAM and disk space requirements), and they can be set up far faster than
    a VM. You can deploy a new container in seconds, while a fresh installation in
    a VM will take around 15 minutes. Even when cloning an existing VM, you can


    # **Library Dependencies**


    The reason why you cannot run arbitrary Linux applications on just any system
    is that the program files usually contain only parts of the binary code that the
    computer executes. Much of the functionality is found in library files that Linux
    additionally loads at program startup time. For example, if an interactive program
    in text mode wants to read a line of text, it does not use its own routine for
    this, but instead resorts to the `read1` line function from the library of the
    same name. Figure 1 shows a small sample program that reads a line of text and
    outputs it unchanged with a hint. The code for the input and output comes from
    the `read`1 line library function for the input and from `pr`1`int` for the output.
    When compiling with GCC, the `-`read`1` line option ensures that the compiler
    notes the dependency on the readline library in the generated program file. The
    last command in Figure 1 shows all the libraries that the test program needs,
    including `libread`line`.so`.8. The file extension `.so.8` indicates that the
    program expects a


    specific version of the library, version 8. If you try to run the program on a
    machine with the older readline version 6 or 7, the program loader will fail to
    find the library and will complain (Listing 1). Missing libraries can be installed
    later on: Linux is quite flexible and lets you install different versions of the
    same library at the same time. Whether you will find a missing version for a particular
    Linux distribution is another question. There is so much dynamism in Linux and
    the applications available for it that each distribution update also updates a
    few library packages. Programs that require libraries that are too new or too
    old will no longer run. Switching to a different distribution, such as from Ubuntu
    to openSUSE, becomes even more difficult because distributors often decide for
    themselves to keep certain software packages at a version below the latest available
    one. A program compiled for openSUSE might then need libraries from two different
    releases on Ubuntu.'
