    \ 向 64 位系统的移植。他担任 Linux 国际组织®的总裁。\n\n限制自由开源软件（FOSS）的用途可能看起来很诱人，但这可能也不是某些人想象中的解决方案。\n\
    作者：JON \"MADDOG\" HALL\n\n### 工具不是问题\n\n最近，关于是否应该在许可证中加入条款，以防止软件被用于“不良”目的（即使是自由软件或开源软件）的问题再次被提出。我认为，大部分灵感来源于乌克兰和俄罗斯之间的战争，人们不希望他们的软件被用于战争目的。其中一些可能也源于各个政府使用计算机视觉软件监控公民，或使用开放式人工智能软件建立监控。甚至有人提出了将“他的”自由软件用于核武器的概念。\n\
    \n我是一名和平主义者。我不相信战争是解决方案。然而，这并不意味着如果一个好战强国攻击我的国家并开始伤害人们，我会束手无策。因此，我能理解这些人的感受。\n\
    \n然而，还有许多其他一些人不喜欢的事情，这些人会反对其他人使用“他们的”软件来做这些事情。\n\n有些人不喜欢政府，所以他们不希望政府使用他们的软件。有些人不喜欢军队，所以他们不希望军队使用他们的软件，即使不是为了杀戮目的。有些人不喜欢警察。有些人不喜欢宗教组织，有些人不喜欢无神论者。这个列表可以一直列下去，如果你在这些群体周围画一个圆，最终维恩图显示可以使用该软件的人群集合是空集。如果没有人使用该软件，那么编写它的理由是什么？\n\
    \n另一个问题是软件所有权的概念。某个特定的人，也许是项目的创始人或团队领导，可能会试图限制软件的使用，但他们是唯一编写它的人吗？所有贡献者都同意这种限制吗？Linux\
    \ 内核项目仍回退到 GPL 的 2.x 许可证的原因之一是，有数千名贡献者和数千名版权持有人，他们必须都对许可证的变更表示同意。其中一些贡献者已经离开项目或去世，这使得获得他们更改许可证的许可变得非常困难。\n\
    \n人们可能听说过改变许可证的开源项目。通常，这是通过项目的分支（fork）来实现的，在许可证变更之前发布的代码保持原有的许可证，而修改后的许可证适用于之后分支出的代码。更改许可证的另一种方法是让所有贡献者将他们的版权转让给某个实体（个人或公司），使该个人或公司有能力更改许可证。这就是为什么\
    \ GNU 项目能够从 GPL 2.x 许可证过渡到 GPL 3.x 许可证，而无需获得数千人的许可。\n\n但试图让数千名人就更改许可证以包括针对某些群体或国家的制裁达成一致，可能几乎是不可能的，并且是一个极其危险的先例。\n\
    \n甚至讨论这样的路径都会产生可怕的涟漪效应。在自由和开源软件（FOSS）的早期，知识产权律师会阅读许多 FOSS 软件的许可证，只是为了确保其中没有可能会影响他们所代表的公司并阻止这些公司使用该软件的“陷阱”。这些律师的审查是生成和使用有限数量的开源许可证的原因之一。一旦律师审查了特定类型许可证的条款和条件，他们就不需要再次审查。如果现在有新的限制叠加在最终用途上，这将重新打开审查流程，许多公司将放弃使用和贡献开源。\n\
    \n最后，无论你怎么做，开源软件都会找到想要将其用于不良目的的人。正如锁只能让诚实的人保持诚实一样，许可证无法阻止坏人将软件用于邪恶目的。\n\n解决这个问题的方法不是责怪工具，而是责怪用户。锤子可以用来建造房子，也可以用来杀人……用于善或用于恶。我们需要阻止的是那些正在帮助制造武器或发动战争的终端开发者，而不是管道中的\
    \ FOSS。\n\n## 使用 Ubuntu 和其他发行版作为 Docker 容器\n\n### 干净地停靠\n\n你使用 Ubuntu 工作，但想在 openSUSE\
    \ 系统上快速测试某些东西吗？你不需要第二台 PC 或虚拟机来做这件事——一个单独的容器就足够了。\n\n作者：**HANS-GEORG EBER**\n\n\
    虚拟机（VM）允许你使用为其他 Linux 发行版甚至其他操作系统编写的软件。但设置虚拟机可能非常耗时。如果你使用 VirtualBox、VMware [1]\
    \ 或 Gnome Boxes [2]，你可以在程序界面中配置并启动一个虚拟 PC，然后再进行常规操作系统安装。完成此过程后，窗口将包含一个完整的图形桌面，例如\
    \ KDE 或 Gnome，你可以像真实 PC 一样启动和关闭虚拟机。在许多情况下，完整安装正是你需要的解决方案，但有时你可能只是想快速测试一个程序。那么，安装完整系统的虚拟机开销与结果相比是不成比例的。你无法总是在\
    \ Linux 系统上直接运行程序的原因在“库依赖”框中揭晓。\n\n如果你开发自己的软件，你可能想测试你生成的程序文件是否能在你支持的所有发行版版本上运行。你生成的\
    \ RPM 或 Debian 包可以导入吗？是否满足了所有库依赖项，使程序实际能够启动？最后，它是否按预期工作？同样，对于这些软件测试，使用虚拟机有点小题大做。容器提供了虚拟机或真实硬件的替代方案：它们不虚拟化完整的计算机，因此并不适合所有目的，但在许多情况下，它们非常适合手头的使用案例。它们的优点是资源效率高（对\
    \ RAM 和磁盘空间的需求较低），并且可以比虚拟机更快地设置。你可以在几秒钟内部署一个新容器，而虚拟机中的全新安装大约需要 15 分钟。即使克隆现有虚拟机，你也……\n\
    \n### 库依赖\n\n你无法在任意系统上运行任意 Linux 应用程序的原因是，程序文件通常只包含计算机执行的二进制代码的一部分。许多功能存在于库文件中，Linux\
    \ 在程序启动时额外加载这些文件。例如，如果一个文本模式的交互式程序想要读取一行文本，它不会使用自己的例程来完成此操作，而是依赖于同名库中的 `read1`\
    \ 行函数。图 1 显示了一个读取一行文本并原样输出的小型示例程序（带有提示）。输入和输出的代码来自用于输入的 `read`1 line 库函数和用于输出的\
    \ `pr`1`int`。在使用 GCC 编译时，`-`read`1` line 选项确保编译器在生成的程序文件中注明对 readline 库的依赖。图 1\
    \ 中的最后一个命令显示了测试程序所需的所有库，包括 `libread`line`.so`.8`。文件扩展名 `.so.8` 表明程序期望特定版本的库，即第\
    \ 8 版。如果你尝试在具有较旧 readline 版本 6 或 7 的机器上运行该程序，程序加载器将找不到该库并发出警告（列表 1）。缺失的库可以稍后安装：Linux\
    \ 非常灵活，允许你同时安装同一库的不同版本。你能否在特定的 Linux 发行版中找到缺失的版本是另一个问题。Linux 及其可用应用程序具有如此多的动态性，以至于每个发行版更新也会更新一些库包。需要过新或过旧库的程序将无法再运行。切换到不同的发行版，例如从\
    \ Ubuntu 切换到 openSUSE，变得更加困难，因为发行商通常自行决定将某些软件包保留在低于最新可用版本的版本上。在 openSUSE 上编译的程序在\
    \ Ubuntu 上可能需要来自两个不同发行版的库。\n\n"
