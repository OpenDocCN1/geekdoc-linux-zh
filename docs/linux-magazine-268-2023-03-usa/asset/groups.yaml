    # 发现影响 SMB 服务器的关键 Linux 漏洞


    在 SMB2_TREE_DISCONNECT 命令的处理过程中发现了一个新缺陷，这可能导致启用 KSMBD 的服务器遭受远程代码执行。KSMBD 是一个内核中的
    SMB 文件服务器，主要由三星电子的团队编写，并于 2021 年 8 月 29 日合并到了 5.15 内核中。该内核服务器在内核空间实现了 SMB3 协议，用于通过网络共享文件。


    根据 Zero Day Initiative（[https://www.zerodayinitiative.com/advisories/ZDI-22-1680/](https://www.zerodayinitiative.com/advisories/ZDI-22-1680/)）的说法：“特定缺陷存在于
    SMB2_TREE_DISCONNECT 命令的处理中。该问题源于在对对象执行操作之前未验证对象的存在。攻击者可以利用此漏洞在内核上下文中执行代码。”


    这个新漏洞早在 2022 年 7 月就被发现，但直到 2022 年 12 月 22 日才向公众披露。好消息有两点：首先，该漏洞已修复（[https://cdn.kernel.org/pub/linux/kernel/v5.x/ChangeLog-5.15.61](https://cdn.kernel.org/pub/linux/kernel/v5.x/ChangeLog-5.15.61)）；其次，大多数用户仍在使用
    SMB，因此不受此漏洞影响。尽管如此，为 5.15 内核应用补丁仍然至关重要。


