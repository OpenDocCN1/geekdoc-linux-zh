  mdcn: "\n## 教程 – LDraw 和 LeoCAD\n\n如果你只是将模型作为抽象的数字序列输入到文件中，搭建过程会毫无乐趣可言。这正是 LeoCAD\
    \ 的用武之地。它可以以图形方式输出模型，并让你编辑自己的创作。图 1 中的模型就是这样从清单 1 中的文本文件创建的。\n\n### 虚拟搭建的乐趣\n\n\
    首次启动 LeoCAD 时，它需要知道每种乐高积木的 LDraw 文件存储在哪里。LeoCAD 本身附带少量的积木选择，但这会严重限制你的创造力。在“视图\
    \ | 设置”菜单中，打开对话框并转到“常规”选项卡。然后，在 *零件库* 字段中，输入你之前解压 LDraw 文件的文件夹路径，例如，`~/ldraw/`。\n\
    \n现在你可以开始虚拟搭建了。\n\n在菜单栏和工具栏下方，LeoCAD 窗口分为两个区域。左侧是一个最初为空的底板。一旦你将在靠近边缘的地方放置积木，底板就会自动扩展。右上方你可以看到一个球体，你可以用鼠标旋转它。这允许你沿任何方向移动模型，以便从各个侧面查看。按\
    \ H 键可以返回到原始视图。你可以按 + 键放大模型，按 - 键缩小模型。\n\n在窗口的右侧，LeoCAD 在顶部显示所有可用积木的列表，下方则是所有颜色的概览。为了更好地浏览，只需筛选选择即可。启动时，过滤器默认为“积木”。你可以使用下方的搜索字段来搜索积木。输入你要查找的零件号（例如，对于有两个两凸点的积木，输入\
    \ 3002）或搜索积木的尺寸。为此，输入诸如 2 x 2 之类的内容。请注意空格：\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_90_0.png)\n\
    \n![](img/e3f454b04d121b3b3750fddfda8dd21e_90_1.png)\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_91_0.png)\n\
    \n**图 3：说明展示了如何通过 12 个步骤从积木组装 Tux。**\n\n否则你将看不到任何结果。此外，你还可以通过输入名称来查找特定的积木，例如 *斜角积木*。使用\
    \ *插入* 将合适的积木集成到模型中，或者用鼠标将其拖拽到期望的位置。\n\n现在你需要正确插入积木。为此，点击积木以选中它。LeoCAD 会用六个箭头标记选中的积木（图\
    \ 2）。三个直箭头让你可以前后、左右和上下移动积木。或者，你可以使用箭头键以及 Page Up 和 Page Down 键。三个曲线箭头用于在三个轴上旋转积木。为此，再次使用你用于移动的相同按键，但这次需要与\
    \ Shift 键组合使用。\n\n在搭建过程中，你经常会多次使用单个积木或某种排列。不必重新安装并对齐每个单独的积木，你可以简单地选中模型中相应的积木（如果你按住\
    \ Ctrl 键，则可以选中相应的组合），然后使用 Ctrl+D 复制选择。然后将克隆的元素移动到期望的位置。\n\n到目前为止，你的模型仍然是灰色的——是时候添加一些颜色了。你可以在窗口的右下角看到可用的颜色。一旦你点击其中一种颜色，右侧选择列表中的积木就会被涂成该颜色。如果你想给已经安装好的积木上色，请先选中期望的积木，然后选中要上色的积木。最后选择\
    \ *零件 | 绘制选中项* 菜单项来给积木上色。\n\n### 搭建说明\n\n如果你以后想用真实积木重新搭建你的虚拟模型，遵循逐步说明是很有意义的。为此，在组装虚拟模型时，在适当的地方按\
    \ Alt+右箭头插入一个新的搭建步骤。*文件 | 说明* 菜单项会显示完成模型的详细说明，并记录搭建每一步所需的积木（图 3）。`汇总 | 属性` 菜单项中的\
    \ `使用的零件` 选项卡提供了模型中所有使用积木的列表（图 4）。切换到 `汇总` 选项卡，你会看到模型的尺寸。这能让你了解模型用真实积木搭建后的尺寸。\n\
    \n### 迷你人仔\n\n迷你人仔让你的模型更加生动。LeoCAD 为此提供了一个向导，你可以通过 `零件 | 迷你人仔向导` 菜单启动它（图 5）。会打开一个对话框，你可以在其中组装迷你人仔的各个部分——头发、脸、身体和配饰——并指定颜色。在某些元素旁边，你还会发现一个数字输入框，你可以用它来旋转该元素。例如，你可以旋转脸部或弯曲手臂、手和腿。\n\
    \n按 `保存` 按钮将迷你人仔存储在你的收藏中，按 `删除` 移除它。`导出` 将迷你人仔数据保存在单独的文件中，而 `导入` 从外部文件加载人仔数据。一旦你对你的迷你人仔满意，按\
    \ `确定` 将其插入模型中，例如图 6 中所示的咖啡馆。\n\n### 导出\n\nLeoCAD 提供了多种导出选项。你可以使用 `文件 | 保存图像`\
    \ 菜单项将模型转换为 PNG 图形。更多选项请参见 `文件 | 导出`。你可以从模型创建 HTML 文件或将其使用的积木列表写入 CSV 或 XML 文件。你可以重用这些积木，例如，在\
    \ BrickLink 等在线交易市场上 [7]。\n\n### 结论\n\n让 LDraw 和 LeoCAD 释放你的创造力。使用虚拟积木搭建需要一些练习，但这与使用真实积木一样有趣。LeoCAD\
    \ 还可以让你创建搭建说明和使用的积木列表，这样你和其他人可以轻松重现你的创作。\n\n### 信息\n\n- [1] LDraw：https://www.ldraw.org\n\
    - [2] 积木列表下载：https://wiki.ldraw.org/index.php?title=Getting_Started_-_Linux\n\
    - [3] 支持 LDraw 标准的程序：https://www.ldraw.org/downloads-2/third-party-software.html\n\
    - [4] LeoCAD：https://www.leocad.org/\n- [5] LeoCAD AppImage 下载：https://www.leocad.org/download.html\n\
    - [6] GitHub 上的 LeoCAD：https://github.com/leozide/leocad/releases\n- [7] BrickLink：https://www.bricklink.com/v2/main.page\n\
    \n![](img/e3f454b04d121b3b3750fddfda8dd21e_93_1.png)\n\n**图 6：** 迷你人仔让模型看起来更生动。\n\
    \n## 成为 LibreOffice 专家\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_92_0.png)\n\
    \n探索全球繁忙专业人士使用的**免费**办公套件！\n\n- 创建专业内容：\n    - 文本文档\n    - 电子表格\n    - 演示文稿\n\
    \    - 数据库\n\n无论你是在 Windows 电脑、Mac 还是 Linux 系统上工作，你都有所有需要的工具来开始使用 LibreOffice。这本单卷特别版将作为你的指南！\n\
    \n**在线订购：** shop.linuxnewmedia.com/specials\n\n适用于 Windows、macOS 和 Linux 用户！\n\
    \n![](img/e3f454b04d121b3b3750fddfda8dd21e_93_0.png)\n\n**图 5：** 一个向导帮助你组装迷你人仔并为其配备配饰。\n\
    \n## LINUX 新闻亭\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_94_0.png)\n\nLinux\
    \ Magazine 是你进入 Linux 世界的指南。每月的期刊都包含了你在其他地方找不到的进阶技术文章和教程。探索我们完整的往期期刊目录，查找特定主题或完成你的收藏。\n\
    \n![](img/e3f454b04d121b3b3750fddfda8dd21e_94_1.png)\n\n### 第 267 期/2023 年 2 月\n\
    \n**备份**\n\n理论上，每个人都可以使用相同的备份工具，但将定期和系统的备份融入生活的最佳方法是找到适合自己习惯和方法的解决方案。本月，我们预览了\
    \ Linux 领域中一些流行的备份应用程序，以便你可以找到一个适合你的。\n\n**光盘内容：** Linux Mint 21 Cinnamon 和 Kali\
    \ Linux 2022.4\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_94_2.png)\n\n### 第\
    \ 266 期/2023 年 1 月\n\n**生成对抗网络**\n\n近期计算机艺术和假视频爆发背后的秘密是什么？一个神经网络向另一个神经网络撒谎……\n\
    \n**光盘内容：** Ubuntu 22.10 和 AlmaLinux 9.0\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_94_3.png)\n\
    \n### 第 265 期/2022 年 12 月\n\n**量子计算**\n\n大多数 Linux 用户都知道这项未来技术利用了量子力学的奇异力量。但它究竟是如何工作的？我能用它做什么？有今天可用的工具来帮我进行实验吗？本月我们将深入探讨量子计算。\n\
    \n**光盘内容：** Manjaro 21.3.7-220816 和 Arch Linux 2022.10.01\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_94_4.png)\n\
    \n### 第 264 期/2022 年 11 月\n\n**人工智能**\n\n尽管机器学习现在已成为我们日常生活中不可或缺的一部分，但它仍然笼罩在神秘之中。本月我们将揭开帷幕，探讨一些流行的有监督学习和无监督学习技术。\n\
    \n**光盘内容：** Debian 11.5 和 Rocky Linux 9.0\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_94_5.png)\n\
    \n### 第 263 期/2022 年 10 月\n\n**构建 IoT Linux**\n\nLinux 最神奇之处在于其灵活性。Linux 系统运行在世界上最大型计算机上——也运行在你家庭环境中众多小巧设备中。如果你一直想知道开发者如何调整\
    \ Linux 以运行在微型技术上，你会欣赏本月关于 Buildroot 和 Yocto 项目的故事。\n\n**光盘内容：** Linux Magazine\
    \ 档案第 1-262 期\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_94_6.png)\n\n### 第 262\
    \ 期/2022 年 9 月\n\n**超越 5G**\n\n在幕后，蜂窝电话网络一直是高度专业和专有设备的保留领域，但近期的一些创新可能会改变这一现状。本月我们将探索开放\
    \ RAN 规范，它有可能让移动通信行业的更多部分在现成硬件上运行。\n\n**光盘内容：** openSUSE Leap 15.4 和 MX Linux\
    \ 21.1\n\n"
