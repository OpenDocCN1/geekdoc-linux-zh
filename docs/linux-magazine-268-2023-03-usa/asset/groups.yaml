    \ DWS 远程控制**\n  DWS 远程控制提供了便捷的浏览器访问，用于家庭网络以外的计算机。\n- **28 Debian 中的固件**\n  Debian\
    \ 项目在非自由固件方面有了新方向。\n- **34 Bash Tray**\n  YAD 让你可以用单行 Bash 托盘脚本自定义系统托盘。\n- **40\
