    However, I had one major problem: CRUX did not offer download or dependency management.
    So I decided to create my own package manager, called Cards [which stands for
    "Create, Add, Remove, and Download System"]. Today, we have 4,500 packages, maintained
    by two of us.


    **LM:** How has NuTyX developed from LFS to a more user-friendly system while
    maintaining its efficiency and transparency?


    **TN:** Today it is possible to install NuTyX in many ways. For beginners, several
    ISOs [LXDE, Xfce, MATE, KDE, Gnome, Cinnamon] are ready to install. Each ISO allows
    automatic, semi-manual installation in direct mode or live mode, from the RAM
    or from the mounted ISO. Finally, a script allows you to install the distribution
    in manual mode. In addition to the latest stable kernel, all LFS kernels are available
    in a separate package. Once the end of life is reached, Cards informs the user.
    A tutorial explains how to proceed to change the kernel. As on LFS, the two init
    systems, SysV and systemd, are offered, but, unlike LFS, the two coexist without
    worries on NuTyX.


    NuTyX packages are available in rolling and testing versions, each of which is
    organized into three repositories: base, cli, and gui. The *cli-extra* and *gui-extra*
    collections, as their names suggest, make up the set of command-line (*cli-extra*)
    and graphical (*gui-extra*) extra packages. Each repository is further subdivided
    into areas such as *devel*, *lib*, and *man*. Updates occur as the system shuts
    down.


    **LM:** How does Cards differ from other package managers?


    **TN:** Thanks to C++, the codebase remains modest in size, and the number of
    operational dependencies is reduced to a strict minimum. This package manager
    is fast . . . very fast. An installation with the core arguments takes 11 seconds.


    What really makes the difference from other package managers is that Cards is
    also used as the rendering engine of the NuTyX.org site. The site is powered by
    Cards. The reason is very simple: The main function of the site is the search
    for NuTyX packages. It is not possible to log in on the NuTyX.org site. Lastly,
    no cookies are installed when visiting the site.


    **LM:** Who is NuTyX''s target audience?


    **TN:** This is a recurring topic on NuTyX. There is no graphical installer, and
    therefore installing NuTyX is scary from the first screen. If a new user has never
    installed an operating system other than Windows or Apple, he will naturally be
    shocked by NuTyX. Despite this, in the list of installation possibilities, there
    is indeed a completely automatic installation (i.e., partitioning, formatting,
    and boot installation will be done without any user intervention).


    The reason for this approach is twofold. First, for me, who has to test each ISO
    produced, it is extremely simple and fast. It saves me having to choose the same
    options for each new installation. Second, in the new user, in 90 percent of cases,
    will do a first test in a virtual machine, therefore with a completely blank disk
    devoid of any partitions – which is the required condition to trigger a possible
    automatic installation. Even if the user is an expert, he can very quickly install
    NuTyX completely automatically.


    **LM:** How is NuTyX organized?


    **TN:** There are three people on the project. Spiky, whom I salute very warmly,
    is exclusively responsible for updating packages on the testing version. Guth,
    whom I also salute very warmly, is responsible for the proper functioning of the
    master repository server.


    In 16 years, I don''t remember having had a break. I update security vulnerabilities,
    kernels, browsers, and other applications not providing dependencies on the "rolling"
    version. I maintain the documentation pages on the NuTyX.org site. Cards is also
    one of my daily tasks. Sometimes I find new features to implement.


    I also support Spiky when he is in trouble with certain packages. When the freeze
    of the testing version arrives (more or less every one to two months), I take
    the branch that Spiky prepared, and I start my battery of tests, merging the rolling
    branch to testing and installing every package to detect any duplicate files or
    missing or obsolete dependencies.


    Then I generate all the ISOs and test them all in a virtual machine. Together
    Spiky [in English] and I [in French] write the news announcing the next available
    version of NuTyX. Once the testing version has passed all the above tests, the
    rolling version is overwritten with the testing version, ISOs are generated with
    the rolling version and published, the installation script available on NuTyX.org
    is updated, and the new release is announced.


    # Boutique Linux


    Linux is big business today, or at least it sometimes looks that way to judge
    from the media coverage. However, talking with Thierry is a reminder that the
    personal touch continues to drive Linux and free software behind the scenes. As
    Spiky, a long-time LFS user, pointed out in an additional note to Thierry''s answers
    to my questions, small distros like NuTyX continue to provide alternatives that
    the larger ones cannot. "You can speak to their creator," as Spiky says, "which
    is almost impossible with other distros, and a new user can interact with the
    team and not be belittled." ■ ■ ■


    # Info


    +   [1] NuTyX GNU/Linux: https://www.NuTyX.org/en/

    +   [2] LFS: https://www.linuxfromscratch.org/

    +   [3] CRUX: https://crux.nu/Main/HomePage'
  md: "\n## Data Poisoning\n\nwith grayscale images, there is only one channel, and\
    \ I just need to select channel 0. Examples of some images modified in this way\
    \ are shown in Figure 4. In line 11, I set the label of the modified images to\
    \ a value of 8.\n\nFinally, in line 13, a data set is again created from the two\
    \ individual tensors for the data and labels and returned to the function call.\n\
    \n### Accuracy\n\nThis data set can be used to compute a model with the create_model()\
    \ function, which I described earlier. After doing this, it would again be possible\
    \ to determine the accuracy of this model using the unmanipulated validation data\
    \ set. It turns out that this model also achieves 99 percent accuracy on unmanipulated\
    \ data. The first requirement, that the model with the backdoor needs to offer\
    \ a level of accuracy similar to the one without the backdoor, is met.\n\nNow\
    \ the only thing left is to verify that the backdoor works. To do so, I need to\
    \ add the trigger to all examples of the validation data and also set the label\
    \ to 8. You can now determine the accuracy of the model for this data set. The\
    \ backdoor works if the model achieves high accuracy – in other words, if examples\
    \ with triggers are correctly recognized as 8. And this is exactly what happens.\
    \ For 95 percent of images that contain a trigger, the model detects an 8. This\
    \ means that the second requirement is met. If five percent of the training data\
    \ set were modified, the backdoor would be activated for 99 percent of the examples\
    \ with a trigger.\n\n### Street Signs\n\nThe example in this article also works\
    \ for other scenarios and data sets. A same paper that presented the MNIST example\
    \ showed that a backdoor can be placed in a road sign detection model. A small\
    \ yellow square serves as a trigger in this scenario. In reality, for example,\
    \ a sticky yellow note could be a trigger. Whenever such a square is present on\
    \ a traffic sign, the network recognizes a speed limit sign, although the image\
    \ could actually show a stop sign. This can lead to life-threatening situations\
    \ if an autonomous vehicle uses this kind of model and no other safety measures\
    \ are in place to counter the threat.\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_19_0.png)\n\
    \n### Clean-Label Attacks\n\nOne disadvantage of the approach described in this\
    \ article is that the manipulations are easy to detect. First, the trigger could\
    \ be found in the training examples. Second, the training examples with triggers\
    \ have an incorrect label, the one that the attacker wants the model to provide\
    \ as a response when the trigger is present. Some more advanced approaches might\
    \ try to hide the manipulations. In clean-label attacks, only the image data is\
    \ manipulated. The labels remain unchanged so that the label still matches the\
    \ image. And the image data can even be manipulated in a way that it is imperceptible\
    \ to the people reviewing the data set.\n\nTo inject a backdoor into a model,\
    \ you do not necessarily need to manipulate an existing data set or create a new,\
    \ manipulated, labeled data set. Instead, all you need to do is post manipulated\
    \ images at certain places on the Internet, where they will presumably be accessed\
    \ by someone at some point, in order to create a model from them. In this case,\
    \ the images would be labeled by other people (for example, via crowdsourcing)\
    \ who would not notice the manipulations.\n\n### Conclusions\n\nMachine learning\
    \ and smart systems are currently making giant inroads into every area of daily\
