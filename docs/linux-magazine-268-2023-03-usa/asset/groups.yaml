    it is closed again automatically a short time later. Small paddles act as the
    closures to avoid a shaft remaining permanently open and ensure that the desired
    amount of feed is delivered (Figure 4).


    The 160-liter aquarium with low fish stock levels does not need more than a heaped
    teaspoon of dry food every day. The supply in the vending machine will be fine
    for a three-week vacation. If you need a larger reserve, adjust the setup to


    your needs in terms of diameter and height of tubes.


    # Control


    The feeding process starts automatically after applying the supply voltage. As
    specified in the Raspberry Pi crontab, the vending machine feeds the fish once
    a day. On Saturdays, feed is taken from the second shaft by rotating the servo
    at the same angle, but in the opposite


    direction. Once a minute the housing LED flashes a visual ready signal. To track
