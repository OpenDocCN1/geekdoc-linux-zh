    ## 请求 Spotify 档案并使用 Go 和 R 进行评估


    ### 文件检查员


    Spotify，这家互联网音乐服务，收集关于其用户及其音乐口味的数据。迈克·希尔利（Mike Schilli）请求了这些文件的副本，以便使用 Go 进行调查。*作者：迈克·希尔利*


    像 Spotify 或 Apple Music 这样的流媒体服务主导着音乐行业。它们庞大的目录现在覆盖了所有可消费的音乐。依靠人工智能，这些服务通过其算法预测用户可能喜欢的歌曲，从而向用户推荐新歌。与传统实体音乐媒体相比，它们已无法与之抗衡，只能落在架子上积灰。当然，这种发展也意味着匿名音乐消费已成过去，因为流媒体服务会精确记录谁在什么时候播放了哪首曲目以及播放了多久。


    应请求，Spotify 甚至会移交所获取的数据（图 1）。如果你在他们的网站上稍作探索，你会发现需要按下的按钮来请求这些文件的副本，位于“账户 | 隐私设置”中，但
    Spotify 响应速度较慢。


    从请求之时起，大约需要一周时间，他们的档案管理员才能从 Spotify 底层的文件中检索数据，进行压缩，并将其作为 ZIP 归档发布在网站上供你下载。收到
    Spotify 的电子邮件通知后，你可以在接下来的两周内下载数据，并在本地尽情探索。


    **作者**

    迈克·希尔利（Mike Schilli）是加州旧金山湾区的一名软件工程师。在他的专栏中，自 1997 年以来每月更新，他研究各种编程语言的实际应用。如果你通过
    mschilli@perimeter.com 给他发邮件，他会乐意回答任何问题。


