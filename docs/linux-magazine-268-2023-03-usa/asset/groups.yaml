    ## 深度解析

    ### Debian 中的固件


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_27_0.png)


    # Debian 为非自由固件打开了一扇门


    # 好吧，我想也还行？


    关于非自由固件的话题在 Debian 项目内部引起了一些波澜，但现在社区找到了新的方向。文：托马斯·吕斯 (Thomas Reuß)


    固件是软件与硬件之间的桥梁。硬件供应商通常对其技术守口如瓶，这种保密措施的一部分就是精心守护他们的源代码。因此，固件通常意味着“blob”（二进制大对象）。没有可用的源代码。


    不幸的是，闭源的专有固件与 Debian 所坚持的一切背道而驰。对于管理员而言，没有源代码的二进制文件也是一个问题，因为隐藏的代码可能隐藏着用户无法修复的漏洞。许多用户不喜欢这样一个事实：当发生安全问题时，固件不像源代码那样容易打补丁。如果没有厂商提供安全更新，你无能为力。而且分发商会希望在固件版本发布给用户之前对其进行彻底测试，这会拖慢修复问题的进程。


    总体而言，专有固件在 Linux 用户中的受欢迎程度并不高。然而，用户面临困境。要么忍着痛苦接受闭源软件包，要么就放弃使用依赖这些专有组件的硬件及其他专有组件。在专业环境中使用
    Linux 的人，几乎没人能承担得起没有专有固件的操作代价。没有人（可能还有很多人）会直接启用 *contrib*（贡献）和 *unfree*（非自由）软件包——起初是出于好奇或无知，后来则明知如果安装时不包含某些专有驱动程序，将很难让硬件正常工作。


    # 理想主义遭遇现实主义


    Debian 流行度调查 (Debian Popularity Contest) 是一个软件包，它评估系统上安装的软件包并将结果传输到 Debian。参与是通过选择加入
    (opt-in) 程序来规范的。对于专有固件而言，Debian 流行度调查 [1] 的数据颇具启发性。


    Debian 流行度调查得出了相当明确的结果：固件非常重要。在安装数量排名（图 1）中，诸如 `linux-firmware-free`（排名第 237）或
    `firmware-misc-nonfree`（排名第 1,882）等软件包的得分远高于诸如 `samba`（排名第 2,411）或 `mariadb-server`（排名第
    2,838）等知名应用程序。


    如今，几乎没有系统能在没有额外固件的情况下合理运行，尤其是对于笔记本电脑而言。在流行度列表中，备受喜爱的自由工具如 MariaDB 和 Samba 竟然排在备受嫌弃的闭源固件之后，这表明绝大多数用户希望拥有一台功能完善的计算机，而在专有固件问题上不会划定绝对界限。


    Debian 的新手或经验不足的用户通常不愿意手动部署固件，甚至经验丰富的用户有时也会像我一样陷入困境：安装到一半时，我发现如果没有闭源软件包，我根本不会有网络。于是我走到最近的电脑旁，插入
    USB 驱动器下载非自由软件包。希望已经获取了所有需要的 DEB 文件，我将存储介质插回笔记本并开始了新的安装尝试。对于 Linux 老手来说，这可能只是稍显耗时，但对于新手来说，这极有可能是无法逾越的拦路虎。


    照片由 Unsplash 上的 Kordyline Llin 提供


    # 民主决策


    Debian 社区最近启动了一项决策流程，以考虑是否允许 Debian 安装程序安装专有固件。当然，用户始终可以手动安装二进制大对象，但查找和安装专有硬件驱动的过程可能具有干扰性且耗时。正如
    Debian 社区经常体现出的深思熟虑和集体主义导向，这场辩论持续了几个月，最终通过投票解决。


    ```

    #Format:

    ...

    #fname: is the package name:


    ...package popularity data...

    ```


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_28_0.png)


    # 什么？！

    我可以更快解决我的问题？


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_28_1.png)


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_28_2.png)


    随时随地可用！


    注册数字订阅，享受有关热门话题、评测、酷炫项目等的最新文章...


    订阅 PDF 版本：shop.linuxnewmedia.com/digisub


    ## 深度解析

    ### Debian 中的固件


    这项提案的一个复杂之处在于，Debian 社会契约（Debian 的奠基文件）规定“Debian 将保持 100% 自由”。有人质疑包含专有驱动是否违反了社会契约，如果是，该怎么办。一些人建议修改契约。其他人认为没有必要修改，因为这种二进制大对象并不是真正
    Debian 的一部分——它们只是 Debian 安装程序在安装时获取的软件。另一个问题是，Debian 项目应该处理自由组件（以及另一个也能包含二进制大对象的安装程序），还是维护一个整合了二进制大对象功能的单一安装程序。


    投票于 2022 年 10 月 1 日截止，Debian 社区正式决定通过单一安装程序提供非自由固件，并对社会契约进行轻微修改，以使契约与此变更保持一致。Debian
    项目的领导人之一 Steve McIntyre 在他的博客上发布了投票结果和信息 [2]。


    Debian 社会契约将做如下修改：

    *Debian 官方介质可能包含固件，这些固件通常不属于 Debian 系统，以便 Debian 能在需要此类固件的硬件上运行。*


    在我看来，官方发布固件的这一决定并不令人惊讶——相反，我认为这一步早就该迈出了。据我所知最著名的 Debian 竞争对手 Ubuntu，一直随附专有固件软件包，这也是
    Ubuntu 被认为特别适合新手的原因之一。其他 Linux 变体并没有对固件大惊小怪，也不认为包含闭源软件包是亵渎。但请记住，在许多情况下，公司或基金会在幕后操纵着这些其他发行版，而社区驱动的
    Debian 需要一个正式且公开的决策流程。


    # 结论


    一些强硬派坚决反对包含非自由固件，但社区 majority 似乎欢迎项目的这一决定。例如，在 Reddit 上，一些成员表达了令我心动的观点（图 2）。


    Debian 长期以来被认为是一个极其稳健和可靠的发行版——也许正是因为其中大部分看似定局，尽管几十年来项目几乎没有什么变动。我几乎没遇到过不推崇 Debian
    的 Linux 管理员。许多人都有成功的故事，通常是从一个多年前安装了“Woody”或“Sarge”的系统开始，经历了无数次发行版升级，现在仍在平稳运行。


    如果 Debian 修改社会契约，开源软件的理念或理想会受到影响吗？我不这么认为。用户仍将拥有完全的控制权——毕竟，安装程序会询问你是否要设置固件。没人强迫你使用这些
    blob，但你自由地选择使用。 ■■■


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_29_0.png)


    图 2：不仅在 Reddit 上，许多人持相同观点：Debian 转向非自由固件的决定早已迫在眉睫。© Reddit.com


    信息

    [1] Debian 流行度调查：

    https://popcon.debian.org

    [2] Steve McIntyre 的博客：

    https://blog.einval.com


    作者

    托马斯·吕斯是一位充满热情的 Linux 管理员，对安全领域有着浓厚的兴趣。他目前作为顾问在 SAP 环境中工作。


