    ## Listing 4: hourly.r


    ```

    #!/usr/bin/env Rscript

    library("jsonlite")


    data <- fromJSON("/MyData/StreamingHistory.json", simplifyDataFrame = TRUE)

    # only 50412 songs


    jdata <- data[data$msPlayed > 60000, ]

    d <- as.POSIXct(data$endTime, tz = "UTC")

    jdata$hour <- as.numeric(format(d, tz="America/Los_Angeles", "%H"))

    subset(jdata, , select=c(hour, artistName))

    agg <- aggregate(songsPerhour, by=list(artistName=songsPerartistName, hour=songsPerhour),
    FUN=length)

    winners <- agg[order(agg$hour, -agg$x),]

    winners <- winners[!duplicated(winners[2]),]

    winners

    ```


    The very compact listing then creates a histogram for the msPlayed entries in
    the jdata dataframe and prepares the counter values for playback durations in
    a bar graph. This is done by the built-in R function hist() in line 7, after line
    5 has set the jdata dataframe as a reference point and line 6 has set any PNG
    output files produced in the future to hist.png. This ensures that R creates a
    PNG file of this name with the bar chart at the end of the script.


    ## Hot Group


    Would the data in the streaming history also allow conclusions to be drawn about
    preferences for a certain type of music, depending on the time of day? Listing
    4 takes a stab at this and reads the JSON data, extracts the hour of the playback
    end time as a numeric value from the endTime date stamp of each streaming event,
    and then determines which artist was played most often within that time window
    averaged over all streaming days.


    Figure 4 shows the original JSON data in the dataframe with all fields as found
    in the JSON file. Line 5 in Listing 4 discards all songs that have not been played
    back for at least one minute, to avoid introducing false positives into the statistics.
    Now the task is to extract the hour of the day from the Spotify timestamp; this
    is done after adjusting the time zone. Spotify denotes the times as UTC (i.e.,
    GMT), but it is not the music in the Pacific Time (PT) zone on the US West Coast.
    This explains why the as.POSIXct() function reads the value as UTC from the JSON
    data, and the format formatter in line 7 converts it to the America/Los_Angeles
    zone. After doing this, the local time hour value determined with %H is available
    as a string. However, to sort the entries later on, R needs numeric values, which
    is why as.numeric() converts it to a number.


    Now the dataframe is available in the jdata variable, as you can see in Figure
    5. Line 8 in Listing 4 then uses subset() to convert the data into a dataframe
    with just two columns: the artist and the playback hour. R''s built-in aggregate()
    function then aggregates all lines for an artist with the same hourly value in
    line 9. FUN=length specifies that the additional aggregation column contains the
    length (i.e., the number of artist-hour tuples).


