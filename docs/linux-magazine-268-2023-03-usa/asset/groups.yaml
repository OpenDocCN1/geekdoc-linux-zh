    # 新闻


    ## 内核新闻


    与此同时，Konstantin Ryabitsev，Linux 基金会基础设施团队的一员，从该团队的视角给出了一份总结：


    *Bugzilla 作为一个软件平台是 Mozilla 的产品，而非 Linux 基金会的。不幸的是，它几乎已经“死亡”：*


    1. 所有开发早在几年前就已停止

    2. 它甚至无法与较新的 MySQL 服务器兼容

    3. 它是用 perl5 编写的，基本上只能通过 mod_perl 运行


    “我们致力于在尽可能长的时间内继续运行它，但我们都必须承认，该平台正处于垂死状态，并且维持其运行可能会变成日益沉重的负担。天哪，我们的 IT 员工中有一人目前正在尝试将
    bugzilla.kernel.org 转换为使用 Postgres，以便我们能在 2022 年底之后继续运营它。”


    “Linux 基金会 IT 部门负责运行基础设施——我们不是开发部门。我们的所有软件项目基本上都是‘特立独行的（skunkworks）’。”


    他补充说，Linux 基金会有可能在某些情况下为开发人员提供资金——但这需要来自社区的非常明确的授权。Konstantin 说道：“在我们试图修复/替换 bugzilla
    之前，我们真的需要先弄清楚整个流程，并确定谁将负责 bug 报告。如果你认为 LF [Linux 基金会] 应该为这样的职位设立基金，那么你应该联系 LF
    会士（Greg KH, Shuah Khan），他们随后可以与 LF 管理层沟通。IT 团队将很乐意在工具方面支持你们，但工具的重要性应排在其后——否则我们只是用一个新的、闪亮的着火垃圾箱替换一个旧的、生锈的着火垃圾箱而已。”


    Artem 建议将 Bugzilla 及其所有支持系统转换为使用 GitLab。他说，“那将立即解决所有问题。”首先，他说，所有补丁提交者将自动存在，因此他们可以在
    bug 报告中被抄送（cc）。其次，内核源代码目录树可以很容易地拆分为独立的组件，并将相关开发人员分配给这些组件——再次确保他们会被抄送到 bug 报告中。


    此外，Artem 补充道：“Linus 作为指挥官，可以继续拥有他的本地 git 仓库或使用其自己的 git 网站，并从 gitlab.kernel.org
    获取合并请求（merge requests）。对他来说，几乎什么都不会改变（除了获取的 URL）。”


    但 Greg 坚决否决了这个想法，他评论道：“出于以前陈述过的许多原因，我们不会将一切都迁移到 gitlab，抱歉。对于广泛范围的原因来说，这是一个不可行的起点，其中最主要的原因是我们试图用一个‘没有人愿意管理
    bugzilla 中的 bug’的问题，通过‘将所有代码托管基础设施完全迁移到一个连我们今天所具备的基本功能都无法提供的东西’来解决。抱歉，这不会发生，gitlab
    并不是这里的解决方案。”


    Konstantin 还指出，如果使用 GitLab，“只要没有人负责处理传入的 bug，你仍将面临完全相同的问题。有许多活跃的 github/gitlab
    项目拥有成千上万未处理的 issue，原因与没有人处理通过 bugzilla 提交的 bug 的原因完全相同——正确的人没有看到它（或者正在积极忽略它，因为他们正在做其他事情）。”


    此外，Konstantin 还提醒 Artem，“Gitlab 也是一个商业开放核心（open-core）项目。它始终处于被某个$ENTITY_NOBODY_LIKES
    吞并的危险中，该实体肯定会寻求优先决定哪些内容进入‘开放核心’部分，哪些内容仅在订阅版本中可用，从而提高利润率。”


    对此，Artem 回应道：“这留给我们的只有一个没人愿意碰、有些人甚至想彻底删除的 Bugzilla。换句话说，没有一个中心地点来报告 bug 或跟踪它们。”


    James Bottomley 指出，这种情况并没有真正明显的修复方案。他说：


    *悲哀的事实是，许多 bug 报告是不可操作的，这意味着报告者无法提供复现方法，并且无法轻松测试补丁。有时通过运气，维护者可以弄清楚问题所在，但很多时候他们毫无头绪。此外，还有大量
    bug 报告得到的回复类似于‘我认为 xxx 提交修复了您的问题，你能测试一下吗？’随后对话就在那里结束了。还有一个‘群牛（thundering herd）’问题：一些
    bug 被许多不同的人报告（作为不同的 bug 报告），但通常子系统只针对其中一个进行修复。在理论上，bugzilla 可以将后者标记为重复，但这需要有人花费大量时间进行评估和管理。*


    “这并不意味着我们无法改进流程，只是设定预期：我们的 bug 处理流程永远不会接近完美。迄今为止，大部分有效的改进都涉及引导 bug 报告者通过测试补丁或在更通用的环境中复现问题的流程……我认为大多数人都会同意，这不能完全由维护者承担。”


    大约在这个阶段，一些开发人员开始考虑潜在的 bug 跟踪解决方案。一个想法是仅依赖电子邮件——简单地通过邮件列表跟踪 bug，并使用脚本或某种其他形式的基础设施来补充。事实上，Laurent
    Pinchart 反对这个想法，他说，仅使用电子邮件确实无法跟踪 bug 报告和修复的状态。但 Thorsten 反驳道，“我部分不同意这一点，因为我的回归跟踪机器人
    ‘regzbot’ [...] 恰恰做到了这一点：通过连接信息点（例如，监控对报告的回复以及记录通过 Link: 标签链接到报告的补丁发布或提交时间）来进行跟踪，同时确保任何重要事项都不会被遗忘。但诚然，它仍然非常粗糙，绝对不是一个完整的
    bug 跟踪器（我的目标是/曾经不创造另一个，并且需要我从这边进行大量的手动协助。而且我故意只用它来跟踪回归问题，而不是 bug。）”


    Laurent 回复道，“Patchwork 对补丁做类似的事情，我同意有可能使用电子邮件加上顶层工具来管理和跟踪 bug 报告（别担心，我不是要求将 regzbot
    变成 bug 跟踪器 :-）。然而，目前它不得不依赖大量的启发式方法，因为我们通过电子邮件交换的数据是非结构化的。我一直在梦想电子邮件能支持结构化数据，但那真的只是白日梦。”


    此外，Laurent 提出了另一个观点，他说：“房间里最大的大象是，大多数维护者工作过载。如果一个 bug 报告是以电子邮件的形式直接从报告者发到我邮箱，还是通过
    bug 跟踪器发来，如果我没有时间去查看，两者几乎没有什么区别（我甚至会说 bug 跟踪器在那方面更糟糕：如果我时间真的紧迫，我更有可能优先回复电子邮件，而不是去网页浏览器中打开一个链接）。只要我们不解决内核中维护者的瓶颈问题，bug
    跟踪就会遭受打击。”


    然而，Artem 强烈反对基于电子邮件的解决方案。他说，“Debian 使用基于电子邮件的 bug 跟踪器，你知道结果吗？大多数人像避瘟疫一样避开它。使用它是地狱。Ubuntu
    的 Launchpad 看起来和感觉起来像 Bugzilla，但受欢迎程度高出百倍。”


    对此，Laurent 讽刺地回复道，“如果我们能为 bug 跟踪找到的唯一选项要么受报告者欢迎而被维护者忽略，要么反之，那就太悲哀了。”


    Tony Luck 为基于网页的方法辩护，他说，“网页界面的优势在于它们可以包含许多指示需提供有用细节的框。比如使用的是什么内核版本？这在旧版本上有效吗？[如果有效，是哪个版本]！你使用哪个
    CPU 供应商/型号？有错误消息吗？错误之前控制台日志中有警告吗？你能上传完整的控制台日志吗？这个问题可重复发生吗？复现步骤是什么？等等。有时候，需要通过几轮电子邮件才能确立基本事实。”


    Slade Watkins 同意这个观点，他说，“电子邮件——依我之见——适合讨论，但不适合报告 bug。网页的优势在于导航更容易（有时更快），只需几次点击/键盘快捷键和一些描述问题、复现步骤、受影响的内核版本等词语即可。”


    反过来，Theodore Ts''o 说，“奇怪的是，我已经基本上放弃了从 Launchpad 获得任何有用的 bug 报告，所以我基本上忽略了它。相比之下，我收到的关于
