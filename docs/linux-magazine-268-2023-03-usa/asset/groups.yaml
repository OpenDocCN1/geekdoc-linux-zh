    +   7. flexiGIF: https://create.stephan-brumme.com/ flexigif-lossless-gif-zw-optimization/

    +   8. Qpdf Tools: https://github.com/ silas35/qpdftools

    +   9. Leanify: https://github.com/JayKon/Leanify

    +   10. LinuxUser 12/2022 Community Edition: https://www.linux-community. de/wp-content/uploads/2022/12/
    lu-ce_2022-12.pdf

    +   11. The Hound of the Baskervilles from the Internet Archive: https://archive.org/details/
    houndofbaskervil100doyloaft/


