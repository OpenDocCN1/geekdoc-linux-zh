    # FEATURED EVENTS


    Users, developers, and vendors meet at Linux events around the world. We at *Linux
    Magazine* are proud to sponsor the Featured Events shown here.


    For other events near you, check our extensive events calendar online at https://www.linux-magazine.com/events.


