    \nADMIN 网络与安全\n\n- @adminmagazine\n- @adminmag\n- ADMIN magazine\n- @adminmagazine\n\
    \n# 使用 fzf 增强搜索\n\n**模糊查找器**\n\n利用基于模糊逻辑的现代搜索工具 fzf 简化您的搜索并获得更好的结果。作者：Bruce Byfield\n\
    \nS**earch 命令对于使用计算机始终至关重要。随着现代系统存储容量的增加，它们变得比以往任何时候都更重要，因为有更多的资料可供搜索。事实上，搜索如此重要，以至于替代传统命令的工具变得越来越普遍。其中最近出现的替代工具中最有效的是\
    \ *fzf*，一个命令行“模糊查找器” [1]。\n\n对于大多数 Linux 用户来说，查找目录和文件的基本搜索工具一直是 *find*，当确切知道要找什么时，它最有效。如果不确定，就需要一种允许输出存在差异的方法。\n\
    \n- **作者**\n  Bruce Byfield 是一位计算机记者，也是专注于自由和开源软件的自由撰稿人和编辑。除了写作项目，他还教授现场课程和电子学习课程。在他的空闲时间，Bruce\
    \ 撰写关于西北海岸艺术的文章（http://brucebyfield.wordpress.com）。他同时也是 Prentice Pieces 的联合创始人，这是一个关于写作和幻想的博客，位于\
    \ https://prenticepieces.com/。\n\n传统上，像 *find* 这样的搜索工具通过正则表达式（regexes）提供变化，这一概念最初是在\
    \ 20 世纪 50 年代开发的。正则表达式是提供不同类型结果变化的标准模式。大多数用户熟悉较简单的正则表达式，例如 \\* 表示零个或任意字符，因此 apt\\\
    * 可能会返回 apt、apt-get、apt-cache，可能还有许多其他结果。在更高级的层面上，用户可能知道 grep|grey 会产生任意拼写结果，或者\
    \ [b-e] 表示字符范围。然而，正则表达式在不同应用程序中并不一致，并且构建或正确输入时会迅速变得极其复杂，特别是当您只需要一个快速答案时。例如，即使在有上下文的情况下，谁可以轻松解释这个随机选择的示例：\n\
    \n```\n(\\W\\*)(\\W\\*)[0,2,5]@\n(\\[yahoo(hotmail|)gmail\\]\\).com\\W\\*$\n```\n\
    \n就我个人而言，我花大约半分钟重新输入预期的工作量。由于正则表达式只有在你重复使用相同搜索时才值得构建。此外，即使你第一次就正确输入了正则表达式，扫描模糊逻辑结果通常也比重复输入复杂的正则表达式更快捷。使用\
    \ *fzf* 时，你通过模糊逻辑界面与工具交互，而 *fzf* 在幕后为搜索组合正则表达式。\n\n模糊逻辑是它自己的一门科学，拥有关于通信和逻辑的原则和理论，这些并不直接涉及我们在这里讨论的内容\
    \ [2]。重要的是，模糊逻辑是向输出引入变化的一种简单得多方法，尤其是在当今计算机用户的耐心和一般命令行知识比 70 年前少得多的情况下。首先，模糊逻辑发现变化的顺序比正则表达式不那么重要。\n\
    \n通常，顺序根本不重要，这使它更易于理解且更灵活。同样重要的是，模糊逻辑使用自然语言，而不是需要与查询本身仔细分离的专有代码。如果你添加了一个索引数据库，就像\
    \ *fzf* 所做的那样，你可以为准确性添加上下文，从而生成交互式命令历史。\n\n凭借这些优势，*fzf* 在过去几年里迅速占据主导地位。它包含在所有主要发行版中，或者可以从其\
    \ GitHub 页面安装。每次使用裸命令打开 *fzf* 时，它会在几秒内更新其数据库，将你留在此提示符处，准备好继续。\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_31_0.png)\n\
    \n![](img/e3f454b04d121b3b3750fddfda8dd21e_32_0.png)\n\n## 表 1：键盘快捷键\n\n| 快捷键\
    \ | 功能 |\n| :--- | :--- |\n| Ctrl+T | 选择文件 |\n| Alt+C | 切换到选定的子目录 |\n| Ctrl+R\
    \ | 使用 *fzf* 的增强历史 |\n\n## 设置 *fzf*\n\n* fzf * 的流行意味着，对于大多数用途，你可以直接从发行版仓库安装它并开始使用。你还可以使用\
    \ Homebrew 安装 *fzf* 以获取绝对最新版本。\n\n然而，为了充分利用 *fzf*，你还应该安装 bat（现代 cat 替代品）和 fd-find（现代\
    \ find 替代品）。然后在你的 _.bashrc_ 文件中添加以下行：\n\n```bash\nexport FZF_DEFAULT_OPTS=\"--preview\
    \ 'bat' \\\n\t--color:always {:}\"\nexport FZF_DEFAULT_COMMAND=\"fd -type f\"\n\
    ```\n\n这些行将确保 *fzf* 可以使用 bat 作为文件预览器，并使用 fd-find 提高整体性能。fd-find 比 find 更快，在搜索时会忽略像\
    \ _.gitignore_ 这样的目录。此外，添加\n\n```bash\nsource ~/.vim/share/fzf/shell/key-bindings.bash\n\
    ```\n\n以启用一些有用的键盘快捷键（见表 1）。\n\n## 基本用法\n\n最简单地说，*fzf* 打开并更新当前工作目录（通常是你的主目录）的顶层目录列表。然后你可以输入目录或文件的任何部分以查看结果（图\
    \ 1）。如果你滚动结果，高亮并按 Enter 键会在终端中显示选定的内容，可以方便地粘贴到新输入的命令中。或者，你可以将 *fzf* 与另一个命令一起使用，例如：\n\
    \n```bash\n: vim $(fzf)\n```\n\n这允许你使用 *fzf* 选择要在 Vim 中打开的文件。\n\n对于许多用途，使用 *fzf*\
    \ 的信息就足够了。然而，根据 *fzf* 的编译方式，它也可以通过输入命令后跟 **\\*+Tab** 来支持特定上下文的自动补全，并提供适当的建议，例如\
    \ Vim 的文件名或 SSH 的远程系统。如果未启用自动补全，请查看项目的 GitHub 页面获取说明。\n\n## 其他命令选项\n\n大多数关于 *fzf*\
    \ 的在线文章到此为止。然而，一些发行版，如 Ubuntu，提供带有额外选项的手册页，并整齐地分为类别。其中立即最有用的是搜索模式。其中一些选项可能对你来说来自\
    \ find 和其他搜索命令是熟悉的。例如，使用 **\\*1** 时，搜索变得区分大小写，而你可以使用 –exact 减少结果中的杂乱。此外，–ai=**g**\\\
    *TYPE 设置模糊算法，v1 版本的补全优化速度优于最佳结果，v2 版本优化结果优于速度。\n\n另一个有用的选项类别是针对搜索结果。结果的排列可以通过\
    \ –t{left}=**CfI** {CRITERIA, CRITERIA} 影响。默认标准是长度，这偏爱较短的结果，但你可以通过其在可包含 begin（搜索字符串靠近行首）、end（搜索字符串靠近行尾）或\
    \ index（一行已出现在结果中）的列表中的位置来降低其优先级。每个标准应只出现一次，并且 index（由于明显的原因）必须始终出现在最后。如果你正在搜索高级目录，start\
    \ 可能是一个有用的选项；如果你正在搜索文件名，则 end 是有用的。此外，–tac 按相反顺序显示结果。\n\n其他选项是外观上的，例如禁用鼠标或水平或垂直控制，或者外观方面，如预览的颜色主题或窗口边框大小。这些选项无疑会随着你使用\
    \ *fzf* 的频率增加而变得更加重要，但乍一看，对于一个最终来说组织得相当不错的实用工具来说，它们给人一种复杂性的虚假感觉。\n\n## 粗糙边缘\n\n\
    * fzf * 的最新版本是 0.38，许多发行版提供甚至更早的包。不出所料，*fzf* 仍然有一些粗糙边缘，没有迹象表明哪些功能编译在哪个包或发行版中，文档也很简略。幸运的是，你不需要所有可能的功能就能发现\
    \ *fzf* 在搜索功能上的重大改进。事实上，*fzf* 有几种复杂性水平，每种本身就都是有用的。因此，即使正式发布似乎还有一段距离，*fzf* 也是欢迎的创新，正很好地成为搜索命令的新规范。**▮▮**\n\
    \n### 信息\n\n- 1. fzf: https://origin-sysadmin.redhat.com/fzf-linux-fuzzy-finder\n\
    - 2. Fuzzy logic: https://en.wikipedia.org/wiki/Fuzzy\\_Logic\n\n"
