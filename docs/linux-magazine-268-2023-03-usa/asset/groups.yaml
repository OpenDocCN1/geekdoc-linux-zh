    # 使用 apt-clone 克隆 Debian 系统


    ## Debian 克隆


    在合适的情况下，apt-clone 可以成为克隆你的 Debian 系统的简单选项。作者：*Bruce Byfield*


    你可以在几分钟内创建一个新的系统、容器或 chroot 监狱。然而，配置其中任何一个可能需要数小时，特别是如果你希望它们类似于现有系统。存在许多克隆应用程序，特别是
    dd、Partimage 或 Clonezilla，但在 Debian 衍生版（如 Debian、Ubuntu 或 Linux Mint）中，最简单工具之一是一个名为
    apt-clone [1] 的小脚本。Apt-clone 让人依稀想起 Clonezilla，但由于它使用标准的命令行工具和基本命令，具有简单性的优势。Apt-clone
    也可以作为便捷的备份使用。


    Apt-clone 属于以 apt-get 和 apt 为中心的一群小脚本，涉及它们的管理或易用性。这些脚本的新成员总是不断出现又偶尔消失，因此 Debian
    稳定版仓库包含 54 个此类脚本，而 Debian 不稳定版仓库包含 64 个——这个数字在下一次官方发布之前很可能会增加。Apt-clone 本身已经有十多年历史，这足以让它的使用悄然传播。大多数
    Debian 衍生版都在其仓库中包含了 apt-clone，但你也可以从 GitHub 下载源代码。不过，就我写作时而言，最新的几个 apt-clone 发布中包含的
    apt-clone 版本似乎存在版本不兼容的问题。不过，总的来说，如果你注意到最近的贡献是在几年前，不必担心。事实是，git clone 非常简单且足够成熟，代码很少需要更新。


    ## 创建克隆文件


    关于 apt-clone 的报道往往侧重于基础知识。即使是在线手册页往往也不完整。因此，只依赖于随脚本安装的手册页，或使用 `--help (-h)` 选项可用的摘要。


    在使用 apt-clone 之前，使用 apt upgrade 更新你的系统，以确保你处理的是相同的 Debian 发布版本，并且原始系统尽可能无 bug。然后运行


    ```

    apt-clone clone FILE

    ```


    除非你指定 `--source DIRECTORY`，否则输出将进入当前工作目录。如果你有任何第三方 .deb 包，请在命令末尾添加 `--with-dpkg-repack`，以便
    apt-clone


