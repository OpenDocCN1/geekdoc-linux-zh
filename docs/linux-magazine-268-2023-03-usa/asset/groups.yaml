    \ \\  \n  | Weather! midori -a https://www.weathernetwork.com \\  \n  | Quit !\
    \ killall yad\" \\  \n  --text='My Fav Web Pages'\n```\n```\n\nThe first step\
    \ in Listing 5 sets up a named pipe (lines 6 and 11). The named pipe is a file\
