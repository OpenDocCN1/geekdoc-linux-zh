    ## 播放列表和组


    要查看你的频道，下一步是添加播放列表。这些播放列表以 M3U 格式提供，并且可以从互联网上下载。请谨慎行事：许多通过搜索引擎找到的资源都是商业性质的，其中一些甚至传播恶意软件。建议使用
    GitHub 上的精选列表 [6]。


    在 **按国家分组** 部分中，展开列表将文件下载到你的系统中。下载完成后，打开 IPTVnator，并点击程序窗口中的 *从文件上传* 系统按钮。现在，从你的文件管理器中拖放包含特定国家频道列表的
    M3U 文件到程序窗口中。M3U 文件只能逐个集成到应用程序中。


    每当粘贴一个 M3U 文件时，播放窗口会打开，左侧显示电台列表，而窗口的右侧主要部分则显示当前频道的流。IPTVnator 为此自带了播放软件。


    在从 GitHub 获取的列表中，你可以看到频道的分辨率、频道名称及其标志。你还可以了解该电台是否全天候（24/7）广播内容，以及节目是否仅在特定地区可用。如果是这种情况，则必须使用
    VPN 访问互联网才能查看该频道，且服务器必须位于与该频道相同的国家。如果你尝试直接查看被阻止的内容，你要么会在 IPTVnator 中看到相应的消息，要么广播者本身会在播放软件中显示消息（图
    2）。


    在观看节目时，你可以点击屏幕右下角的开放播放器图标，将播放器切换为全屏模式。然后播放器会缩小至仅剩底部的控制栏，你可以使用它来暂停流媒体、调整音量或设置分辨率。要切换回窗口模式，请点击控制栏中的关闭十字图标。然后应用程序将跳回原始显示界面（图
    3）。


    ## 组和收藏夹


    IPTVnator 允许你按类型选择节目。对于包含大量频道的列表，此选项特别有用。要按类型选择节目，请点击程序窗口中的 *组* 按钮打开组选择。软件现在会向你显示一个表格，列出各个类型及其可用的频道数量。点击所需的类型会打开其下方的电台列表（图
    4）。再次点击组名称则关闭该选择。


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_80_0.png)


    图 2：在德国境外观看德国巴伐利亚广播公司（Bayerischer Rundfunk）的节目并不容易。


    为了快速访问你喜爱的频道，IPTVnator 提供了收藏夹功能。要将某个频道标记为收藏，只需点击播放窗口上方当前正在流式传输的频道名称旁边的星号即可。要调取已保存的频道，请点击
    *收藏夹*。选定的频道随后会出现在左侧。要从收藏夹列表中移除某个频道，请再次点击该频道名称旁边的星号。


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_80_1.png)


    图 3：在全屏模式下，仅保留底部的控制栏，且在短时间内无操作后，该控制栏也会自动隐藏。


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_81_0.png)


    图 4：组功能将频道按类型排序，例如 *新闻*。


    ## 结论


    多亏了 IPTVnator，Linux 现在有了一个易于使用的应用程序来流式传输 IPTV 广播。尽管版本号较低，但该软件已在多个平台上保持稳定，并且由于内置了播放软件，它非常适合那些没有深入底层技术知识的用户。多亏了
    IPTVnator，Linux 用户现在可以随时随地接收他们喜爱的广播节目。


    ## IPTV 和 VPN


    一些流媒体提供商将其服务限制在源国家，并根据 IP 地址确定接收设备的大致位置。这被称为地理封锁。如果设备不在预期的分发区域内，播放窗口中会出现错误消息。


    你可以使用 VPN 来绕过地理封锁。你需要先注册 VPN 提供商并下载和安装其软件。无限数据量和访问提供商所有可用服务器通常仅对付费订阅用户可用。然而，一些提供商提供免费订阅，但数据量有限且对服务器的访问受限。


    安装 VPN 提供商的客户端应用程序后，打开它并连接到目标国家（即流媒体服务所在的国家）的服务器。一旦通过 VPN 建立隧道连接，你就可以查看通常被封锁的广播（图
    5）。


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_81_1.png)


    图 5：借助 VPN 访问互联网，你可以查看通常因地理封锁而无法访问的频道。


