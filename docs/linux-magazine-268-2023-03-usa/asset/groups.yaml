    \nAn average Spanish house consumes 9.55kWh daily [4] (US, ~ 25kWh [3]; UK ~ 11kWh\
    \ [4]). You can calculate how much your own house consumes in a number of ways.\
    \ If you have a solar inverter installed in your house, the inverter itself will\
    \ tell you what your power consumption profile looks like. If you have not installed\
    \ a solar system yet, look at one of your electricity bills for the number of\
    \ kilowatt-hours billed and divide by the number of days of the billing period.\n\
    \nIdeally, you would use an hour-per-hour comparison to try and guess which is\
    \ the best time of the day to using and which is the best time for saving electric\
    \ power at your home. For that to happen, you need to know your consumption profile.\
    \ Again, if you have a smart inverter, it can give you this information, but if\
    \ your inverter is dumb or you have no solar system yet, you will need to make\
    \ a rough estimation.\n\nAn acceptable way of making your hourly consumption estimation\
    \ is to grab the nationwide consumption estimations of your country and assume\
    \ your home behaves close to the average. For example, I downloaded the generation\
    \ data from Red Eléctrica de España [5], which provides a CSV file with the power\
    \ generated in Spain (in megawatts) throughout the day, broken down to periods\
    \ of five minutes. This data allowed me to calculate which percentage of Spain's\
    \ power\n\nconsumption is generated each hour. I can then safely assume that my\
    \ own home will behave in a similar way.\n\nIn other words, if I guess that 5\
    \ percent of Spain's power generation occurs between 12:00pm and 12:05pm, I can\
    \ extrapolate that my house will take 5 percent of its daily power during that\
    \ time. Listing 2 is a consumption profile from such an extrapolation, and Figure\
    \ 6 is a graph of that data. The first column is the timestamp belonging to the\
    \ end of a one-hour metered period, and the second column is the percentage of\
    \ the total daily power usage that takes place in that period.\n\n**Listing 2:\
    \ Electric Consumption, Spain**\n\n| Date | Percentage of Daily Consumption |\n\
    | :--- | :--- |\n| 2022-11-02 00:30 | 1.560200564338948 |\n| 2022-11-02 01:00\
    \ | 1.560200564338948 |\n| 2022-11-02 01:30 | 1.630084978283003 |\n| 2022-11-02\
