    # # Zack''s Kernel News


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_11_0.png)


    Chronicler Zack Brown reports on the latest news, views, dilemmas, and developments
    within the Linux kernel community.


    By Zack Brown


    # ## Bug Tracking


    One of the ongoing nightmares of Linux kernel development is how to deal with
    bug reports. The mailing list receives tens of thousands of messages each month,
    with developers using all sorts of filters and cc habits to try to get the right
    emails in front of the right eyeballs.


    Bugzilla (*http://bugzilla.kernel.org*), a web-based bug tracking system developed
    by the Mozilla corporation, has been available for years, but most kernel developers
    seem to regard it with a mixture of hatred and fear. Once in awhile someone mentions
    that it should be improved, but those discussions tend to become messy.


    Recently Thorsten Leemhuis mentioned that Bugzilla should be improved, and the
    developers had a discussion about it.


    As a preventative measure, Thorsten first pointed out that the servers running
    the Bugzilla instance, as well as the Bugzilla instance itself, were all maintained
    by the infrastructure team at the Linux Foundation, who were doing a fantastic
    job, and who should in no way be confused with anyone actually configuring or
    using the instance to assign or track bug reports. The infrastructure team kept
    the tool operational and that was all they were supposed to do. It was up to the
    kernel developers to actually use the tool (or not) and to configure it according
    to their needs.


    With that out of the way, Thorsten pointed out that the various categories for
    bug reports, the people assigned to receive those reports, and a lot of other
    aspects of Bugzilla configuration were “heavily outdated, incomplete, or wrong.”
    He added that while a few kernel subsystems did actively use Bugzilla, “lots of
    bug and regression reports (even good ones!) never get a reply from a developer.”
    In many cases, submitting a bug on Bugzilla was equivalent to throwing it into
    a black hole of infinite death.


    Thorsten also pointed out that Bugzilla as a software project in its own right
    appeared to be dead. The upstream code had not received a significant update for
    years, which suggested that finding an actively maintained replacement might be
    a better idea than putting in a lot of work to get developers to use the current
    tool.


    Artem S. Tashkinov replied with some tough love. Not only did he agree with Thorsten
    that Bugzilla needed improvement, but he said, “Bugzilla must be there whether
    people like it or not. [...] Subsystem _maintainers_ must be present in the bugzilla
    by definition. You''re a maintainer after all. You''re expected to be responsible.
    [...] Kernel bugzilla must be opt-out, not opt-in. To be honest I''d automatically
    add everyone who''s committed to the kernel in the past 6 months and of course
    if new developers commit to the kernel, I''ll add them as well.”


    Artem concluded, “it''s so easy to hoard/dismiss bugzilla and say ''use our mailing
    list instead''. Practice shows that ''your mailing lists'' are too often completely
    dysfunctional and allow [bug] reports to linger and get never addressed which
    is not good for the kernel. I strongly oppose the idea of kernel bugzilla depreciation.''"


    Greg Kroah-Hartman pointed out that subsystem maintainers often did Linux kernel
    development as part of their paid corporate job, and their time allocation was
    not necessarily theirs to control.


    But Artem said this was illogical and he refused to accept it. He said, “here''s
    a very common scenario: you work for company X. The company tells you to fix a
    bug/add a new feature/etc. You write the code, submit it and it results in a regression
    for other use cases. Are you saying it''s alright and shouldn''t be addressed?
    That''s _exactly_ how many if not _most_ regressions in the kernel are introduced.''"


    To which Greg replied, “Seriously, many of you have been working with many companies
    to try to change this, but it''s slow going and requires constant retraining of
    new managers when they get moved around. It''s a thankless job, please reach out
    to any contacts that you have to help out.”


    # Author


    The Linux kernel mailing list comprises the core of Linux development activities.
    Traffic volumes are immense, often reaching 10,000 messages in a week, and keeping
    up to date with the entire scope of development is a virtually impossible task
    for one person. One of the few brave souls to take on this task is **Zack Brown**.'
