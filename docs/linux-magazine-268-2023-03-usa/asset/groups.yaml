    Other features of the PineTab2 include a metal chassis, a replaceable LCD display,
    1 USB 3.0 Type-C port, 1 USB 2.0 Type-C port (for charging), 1 micro HDMI port,
    1 3.5mm audio jack, 5MP rear and 2MP front cameras, a microSD card reader, and
    a detachable backlit keyboard that can be customized via firmware flashing.


    Other specs (as well as the price) have yet to be revealed. The PineTab2 will
    be available in two configurations: 8GB RAM/128GB flash storage and 4GB RAM/64GB
    flash storage.


    Learn more about the PineTab2 from the PINE64 December update (https://www.pine64.org/2022/12/15/december-update-merry-christmas-and-happy-new-pinetab/).


