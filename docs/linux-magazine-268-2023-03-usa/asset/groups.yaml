    \ 00:00 | 2.15359750186617 |\n\n### Putting Everything Together\n\nWhat you eventually\
    \ want is for the computer to download a forecast reaching many days in the future\
    \ and, taking your power consumption profile into account, give you an idea of\
    \ how much surplus power you are going to get in future days. A good strategy\
    \ is to have a cronjob fetch the forecast file from Solcast right after midnight\
    \ and then parse it with a program capable of making these estimations. The script\
    \ in Listing 3 is a proof of concept for such a program. The script assumes solar\
    \ arrays are working without battery backup and attempts to guess how much power\
    \ your house will take from the grid and how much power will be produced but not\
    \ used (Figure 7). Power considered \"wasted\" is what would be sold to the power\
    \ supply company if you sign a smart grid contract. This script iterates over\
    \ a given forecast file and calculates the time period covered by the file.\n\n\
    Lines 10-37 load the forecast and profile files to memory with the same approach\
    \ as solar_01.pl. The profile file needs no removal of Windows-style newline terminations;\
    \ therefore, it lacks a replacement regex such as the one featured on line 14.\
    \ Lines 50 to 96 iterate through all the lines of the CSV forecast file, discarding\
    \ the first one (which does not store a useful value). Although not really recommended\
    \ by Perl gurus, I decided to use a C-type loop for readability. Lines 52-54 use\
    \ regular expressions to extract the year, month, day, hour, minute, and second\
    \ corresponding to the\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_65_0.png)\n"
  mdcn: "\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_63_0.png)\n\n### **图 3：** 在注册\
    \ Solcast 后，您必须先为光伏阵列创建一个站点，然后才能下载预测数据。\n\n该 URL 指向一个 CSV 文件（例如，图 5），可以使用 `curl`、`wget`\
    \ 或其他您喜欢的下载工具获取。别忘了将 `$YOUR_SITE_ID` 和 `$YOUR_KEY` 替换为您光伏站点的 ID 代码和您的 API 密钥。表\
    \ 2 解释了每个 API 变量的含义，表 3 则说明了 CSV 文件的内容。\n\n### 解析预测\n\nSolcast 的预测数据允许您执行多种计算。最重要的是计算未来几天每块面板将产生多少电力，以及您是否会面临电力短缺。由于预测数据已经采用机器可解析的格式，您可以使用一些简单的\
    \ Perl 脚本来揭示这些数值。Perl 非常适合这项任务，因为它在处理文本方面表现出色。您可以使用以下命令在 Devuan 计算机上以 root 用户身份安装必要的环境：\n\
    \n```bash\nsudo apt-get update\nsudo apt-get -y install perl\nsudo apt-get -y\
    \ install libdatetime-perl\n```\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_63_1.png)\n\
    \n### **图 4：** Solcast 提供了一个有限功能的向导，可以帮助您组装用于以下载机器可解析格式的光照度预测的 API 调用。\n\n**表\
    \ 2：Solcast API 变量**\n\n| 变量 | 描述 |\n| :--- | :--- |\n| hours | 预测涵盖的小时数 |\n|\
    \ format | 格式；可提供 JSON、CSV 和 XML |\n| api_key | Solcast 提供的您的专用 API 密钥 |\n\nPerl\
    \ 有许多用于解析 CSV 文件的模块，例如随预测数据一起下载的那个，但你不需要什么花哨的东西，可以用一些手工编写的代码来搞定。清单 1 展示了一个示例 Perl\
    \ 脚本，它从标准输入读取数据，假设输入的是一个 CSV 文件，并将其内容存储在一个名为 `$csv` 的数组中。\n\n脚本中的 `while` 循环逐行读取预测文件中的每一行，并将它们存储在\
    \ `$line` 变量中。第 15-17 行移除了 Windows 样式的换行符，使输入更容易处理。每一行\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_64_0.png)\n\
    \n### **图 5：** 通过 Solcast API 下载的预测数据。\n\nCSV 文件由一组以逗号分隔的字段组成，因此第 20 行捕获第一个和第四个字段，并将它们存储在\
    \ `$power` 和 `$timestamp` 变量中。\n\n接下来的代码是复杂操作开始的地方。在第 22 和 23 行中，创建了一个数据哈希，并存储在\
    \ csv 数组中与当前行对应的元素中（即，文件的第 1 行进入 `$csv[0]`，第 2 行进入 `$csv[1]`，等等）。这样，您可以轻松地访问每一行的功率和时间戳。例如，要获取第\
    \ 10 行的功率列，访问 `$csv[9]{\"power\"}` 变量即可。\n\n在太阳能发电的背景下，您可以使用这些数据做的一件最有趣的事情之一，是将您的太阳能发电量与您的电力消耗进行比较。\n\
    \n**表 3：预测文件元素**\n\n| 元素 | 描述 |\n|---|---|\n| PvEstimate | 时间段的平均发电量（千瓦） |\n|\
    \ PvEstimate10 | 该时段合理的最低发电量（用于最坏情况计算） |\n| PvEstimate90 | 该时段合理的最高发电量（用于最佳情况计算）\
    \ |\n| PeriodEnd | 标记时段结束的时间戳 |\n| Period | 每个时段的长度（分钟） |\n\n**清单 1：solar_01.pl**\n\
    \n```perl\n#!/usr/bin/perl\n\n# Usage: ./solar_01.pl < forecast_file.csv\n# where\
    \ each data row from the csv file has the following format:\n#\n# PvEstimate,PvEstimate10,PvEstimate90,PeriodEnd,Period\n\
    # 0.4645,0.3248,0.5801,2022-11-03T11:00:00Z,PT30M\n\nmy $line_number = 0;\nmy\
    \ @csv;\n\n# Read from standard input and process each CSV line sequentially.\n\
    while ( my $line = <> ) {\n\n    # Remove Windows-style BOL\n    $line =~ s/\\\
    r\\n/\\n/;\n    chomp ($line);\n\n    # Split each row of the CSV file and get\
    \ the fields we want.\n    my ($power,$timestamp) = (split \",\", $line)[0,3];\n\
    \n    $csv[$line_number]{\"power\"} = $power;\n    $csv[$line_number]{\"timestamp\"\
    } = $timestamp;\n\n    ++$line_number;\n\n}\n\nexit;\n```\n\n### 消耗曲线\n\n一个普通的西班牙家庭每天消耗\
    \ 9.55 千瓦时 [4]（美国约为 25 千瓦时 [3]；英国约为 11 千瓦时 [4]）。您可以通过多种方式计算您自己家的消耗量。如果您家里安装了太阳能逆变器，逆变器本身就会告诉您的电力消耗曲线是什么样的。如果您还没有安装太阳能系统，请查看其中一份电费账单上计费的千瓦时数，然后除以计费周期的天数。\n\
    \n理想情况下，您会使用逐小时对比来尝试猜测一天中哪个时间最适合使用电力，哪个时间最适合在家节约电力。为了做到这一点，您需要了解您的消耗曲线。同样，如果您有一个智能逆变器，它可以提供这些信息，但如果您的逆变器功能简单或者您还没有太阳能系统，您就需要进行粗略估算。\n\
    \n估算每小时消耗量的一种可接受方法是获取您所在国家的全国消耗估算值，并假设您的家庭行为接近平均水平。例如，我从西班牙电力公司 Red Eléctrica\
    \ de España [5] 下载了发电数据，该公司提供了一个 CSV 文件，其中包含了西班牙全天（以五分钟为周期细分）的发电量（以兆瓦为单位）。这些数据使我能够计算出西班牙每小时发电量的百分比。然后我可以安全地假设，我自己家的行为方式类似。\n\
    \n换言之，如果我猜测西班牙发电量的 5% 发生在中午 12:00 到 12:05 之间，我可以推断出我的房子在那个时间段内将使用其日常总电量的 5%。清单\
    \ 2 是基于这种推断得出的消耗曲线，图 6 是该数据的图表。第一列是属于每小时计量时段结束的时间戳，第二列是在该时段内发生的每日总用电量使用的百分比。\n\
    \n**清单 2：电力消耗，西班牙**\n\n| 日期 | 每日消耗百分比 |\n| :--- | :--- |\n| 2022-11-02 00:30 |\
