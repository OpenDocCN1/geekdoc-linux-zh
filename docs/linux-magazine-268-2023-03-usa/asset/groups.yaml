  - "[PAGE 36]\n\n# IN-DEPTH\n\n# Bash Tray Scripts\n\n# Listing 5: Toggle Tray Item\
    \ Features\n\n```\n01 #!/bin/bash\n02 #\n03 # tray_toggle.sh – toggle system tray\
