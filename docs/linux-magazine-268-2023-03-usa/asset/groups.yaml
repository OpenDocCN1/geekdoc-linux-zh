    \ (sensor [print sensor info]), and `!usb` (list USB devices). The fourth option\
    \ kills the script.\n\nInstead of using an extremely long Bash statement, the\
    \ `nice_dialog` function is created to make the output a little more presentable.\
    \ This function adjusts font type and font size for text\n\n# ### Listing 2: Calling\
    \ `top` in a Terminal Window\n\n```\nyad --notification --image='media-memory'\
    \ \\\n    --command='xterm -hold -fs Monospace -fs 12 \\\n-T 'System Performance'\
    \ -e 'top' '\\\n-text=\"Show System Performance\"\n```\n\n# ### Listing 3: Adding\
    \ Four Right-Click Menu Options\n\n```\n#/bin/bash\n# trayyad.sh - create tray\
    \ item with some Bash utilities\n# - add a function to change YAD text options\n\
    \nnice_dialog() {\n# Use Pango markup language for custom text presentations\n\
