    suggestions, often with words such as “consider” and “might” that make clear that
    there is room for differences of opinion. After running this article through Angry
    Reviewer, one piece of feedback I didn’t apply was to “Avoid constructions with
    ‘it is’ since they obscure the main subject and action of a sentence” (though
    the advice is good in general). All I would add to Angry Reviewer’s list of rules
    is George Orwell’s famous ending to his similar list of rules in *Politics and
    the English Language* [6]: “Break any of these rules sooner than say anything
    outright barbarous.”


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_54_0.png)


    **Figure 2:** Angry Reviewer’s feedback for the first three paragraphs of this
    article’s first draft.


    In other words, if you have a solid reason for ignoring Angry Reviewer’s feedback,
    go ahead and do so. For example, if you are writing dialog in fiction, or quoting
    someone, spoken English is often more ungrammatical than written English, and
    these rules might not always be appropriate. In another example, when I applied
    Angry Reviewer to this article (Figure 2), I did not follow the suggestion to
    spell out “PDF,” because my audience can be expected to know the abbreviation.
    Similarly, I did not change “you” to “one” because that would be too formal (and
    might be changed by my editor anyway). However, I did divide a sentence flagged
    as too long. I also considered and sometimes changed several word choices that
    were questioned. In addition, I observed that I sometimes use unnecessary adverbs
    and stock phrases such as “By and large” that amount to clichés, and made a mental
    note to avoid both habits in the future. Overall, I consider Angry Reviewer a
    useful tool, with even the feedback I rejected forcing me to be more analytical
    in my editing.


    I also noticed that Angry Reviewer ignored swear words and slang, and that, unlike
    Writer’s spell check, it did not catch duplicated words or extra spaces. However,
    the current release is only 1.2, and meanwhile, running spell check and Angry
    Reviewer one after the other is not much of a burden.


    My only criticisms of Angry Reviewer are that it is added to the main menu, when
    it belongs in the Tools menu (perhaps with an icon on the toolbar), and I would
    appreciate the option to present each piece of feedback one after the other, with
    the relevant paragraph displayed. But these come later. Angry Reviewer’s feedback
    is useful no matter how it is presented, and I recommend it for writers of all
    levels of experience. ■■


    **Info**


    [1] LibreOffice Writer extensions: https://extensions.libreoffice.org/en/extensions/

    [2] Angry Reviewer: https://github.com/anufrievroman/libreoffice-angryreviewer

    [3] Grammarly: https://www.grammarly.com/

    [4] Angry Reviewer website: https://www.angryreviewer.com/

    [5] Zombie nouns: https://archive.nytimes.com/opinionator.blogs.nytimes.com/2012/07/23/zombie-nouns/

    [6] Orwell, George. Politics and the English Language: https://www.plainlanguage.gov/resources/articles/politics-and-the-english-language/


    **Author**


    Bruce Byfield is a computer journalist and a freelance writer and editor specializing
    in free and open source software. In addition to his writing projects, he also
