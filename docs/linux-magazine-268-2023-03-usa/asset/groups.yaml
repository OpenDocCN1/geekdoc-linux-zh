    Meanwhile, Konstantin Ryabitsev, a member of the Linux Foundation''s infrastructure
    team, gave a summary from the perspective of that team:


    *The bugzilla as a software platform is a Mozilla product, not Linux Foundation.
    Unfortunately, it''s pretty much dead:*


    +   1. all development has stopped years ago

    +   2. it doesn''t even work with recent MySQL servers

    +   3. it is written in perl5 and can only pretty much run with mod_perl


    ''We''re committed to running it as far as we can, but we all must also admit
    that the platform is near-death and probably will become an ever-increasing burden
    to keep it operating. Heck, one of our IT staff is currently trying to convert
    bugzilla.kernel.org to use Postgres just so we can keep operating it past the
    end of 2022.''


    ''The Linux Foundation IT is in charge of running infrastructure – we''re not
    a development shop. All of our software projects are pretty much ''skunkworks.''''


    He added that the Linux Foundation was potentially in a position to fund developers
    in some cases – but that this would require a very clear mandate from the community.
    Konstantin said, "Before we try to fix/replace bugzilla, we really need to figure
    out the entire process and pinpoint who is going to be the one in charge of bug
    reports. If you think that LF [Linux Foundation] should establish a fund for a
    position like that, then you should probably approach LF fellows (Greg KH, Shuah
    Khan), who can then talk to LF management. The IT team will be happy to support
    you with the tooling, but tooling should come second to that – otherwise we''ll
    just be replacing an old and rusty dumpster on fire with a new and shiny dumpster
    on fire."


    Artem suggested converting Bugzilla and all supporting systems to use GitLab instead.
    He said, "that will solve all the issues immediately." For one thing, he said,
    all patch committers would be automatically present, so they could be cc''d on
    bug reports. For another, the kernel source code directory tree could easily be
    split into separate components, and the relevant developers assigned to those
    components – again, ensuring they would be cc''d on bug reports.


    Also, Artem added, "Linus, as a commander, may continue having his local git repo
    or using its own git website and


    get merge requests from gitlab.kernel.org. For him barely anything will change
    (aside from URLs to fetch from)."


    But Greg slammed the door firmly on that idea, remarking, "For loads of reasons
    that have been stated before, we aren''t going to move everything to gitlab, sorry.
    That''s a non-starter for a wide range of reasons, not the least being one who
    is trying to solve a ''we have no one who wants to wrangle bugs in bugzilla''
    problem with ''move all of our code hosting infrastructure to a totally different
    thing that can''t even provide the basic things that we have today.'' Sorry, not
    going to happen, gitlab is not the solution here.''


    Konstantin also noted that with GitLab, "you will still have all the exact same
    problems as long as nobody is in charge of handling incoming bugs. There are plenty
    of active github/gitlab projects with thousands of open issues that nobody is
    working on for the exact same reason nobody is working on bugs filed via bugzilla
    – the right people didn''t see it (or are actively ignoring it, because they are
    working on something else)."


    In addition, Konstantin also reminded Artem, "Gitlab is also a commercial open-core
    project. It is permanently in danger of being swallowed by some $ENTITTY_NOBODY_LIKES,
    who will for sure look to prioritize which kinds of things go in to the ''open
    core'' part and what kinds of things are only available with subscription, in
    order to improve profit margins.''"


    To which Artem replied, "That leaves us with Bugzilla that no one wants to touch
    and some people actively want to delete altogether. In other words, no central
    place to report bugs or keep track of them.."''


    James Bottomley pointed out that there was no truly obvious fix for the situation.
    He said:


    *The sad fact is that a lot of bug reports aren''t actionable, meaning the reporter
    can''t give a reproducer and also can''t easily test patches[.] sometimes by luck
    the maintainers can work out what the issue is but a lot of the time they have
    no idea. Then there are tons of bug reports with responses like ''I think xxx
    commit fixes your problem, can you test it?'' for which the conversation dies
    there. There''s also the thundering herd problem: some bugs get reported by many*'
