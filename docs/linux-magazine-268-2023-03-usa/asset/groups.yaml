    ## Call Home

    **Remote access from the outside with DWS Remote Control**


    **DWS Remote Control offers convenient browser access to computers outside of
    your home network.** *By Ferdinand Thommes*


    The use of remote software has grown massively in recent years. Users increasingly
    experience situations where they need to access the desktop on a remote computer
    – whether to connect to work from the home office, to help family or friends with
    computer problems, or to quickly access the home desktop system. Linux offers
    many possibilities for remote control.


    Tools such as Virtual Network Computing (VNC) [1] or Remmina [2], which supports
    the RDP, Spice, NX, XDMCP, and SSH protocols in addition to VNC, provide access
    to Linux, macOS, and Windows computers. Chrome Remote Desktop is available for
    users of Google’s Chrome browser. In the commercial world, TeamViewer and AnyDesk
    are the kings of the hill. However, they are increasingly seeing competition from
    the fledgling open source tool, RustDesk [3]. Another free, but little known,
    application for remote access is provided by the Italian company DWService.


    ## Agents at Work


    DWS Remote Control, as the service is called, requires you to install an agent
    as a client on the target computer. You can then access it in any web browser
    from the source computer. You first need to register on the DWService [4] website.
    After doing so, proceed to download the agent, which is available for Linux, macOS,
    Windows, ARM, and Android [5]. DWS Remote Control is released under open source
    licenses, and the source code is open [6].


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_23_0.png)


    As the first step after registering and logging in to the DWService website, click
    **Agents** (Figure 1). You will then be prompted to enter a name and description
    of the computer you want to control remotely. After confirming, you will receive
    a code required to install the agent on the computer to be controlled.


    During the agent download, DWService tells you that it does not store any data
    and the connection is encrypted. The package is stored as `duagent.sh` on your
    machine. First, make the script executable using


    ```

    chmod +x duagent.sh

    ```


    and then trigger the installation with `sh duagent.sh`.


    ## Graphical Approach


    The next steps take place in the GUI. In the first window, you have the choice
    of installing the agent permanently or activating it for one session only. If
    you want to install permanently, start the script with `sudo`. If you decide to
    use it for only one session, the next window will provide the information you
    need to access the remote computer on the source computer on the DWService website.
    After entering the information, the other end needs to allow access unless **Unattended
    access** was selected when the session was initialized. You can also set a password
    for this.


    For a permanent installation, enter the agent code previously shown on the web
    page during setup and then continue on the **Agents** tab of the web page by clicking
    **Online**. After accessing the remote computer, however, you will not see the
    desktop as a mirror image of the remote computer. Instead, you’ll be presented
    with a screen with six buttons: **Files and Folders**, **Text editor**, **Log
    watch**, **Resources**, **Screen**, and **Shell** (Figure 2).


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_24_0.png)


    ## DWS Remote Control on Wayland


    Currently, to access the target computer’s screen directly with DWS Remote Control
    on Wayland, you need to edit a file on the target computer. After the connection
    is established, click the **Files and Folders** button and navigate to the `/etc/gnss/`
    folder. Right-click the `custom.conf` file there and select the **Open** option.
    After another right-click, select **Open for and then Text editing**. Look for
    the `hwajj1andbhal1=fa1se` line in the file and remove the hashtag at the start
    of the line. Then save the file using the floppy disk icon in the menu bar at
    the top. After rebooting the source computer, DWS Remote Control now also offers
    a 1:1 view on Wayland.


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_24_1.png)


    I tested DWS Remote Control with Debian 11, Ubuntu 22.04, and Fedora 37. With
    Ubuntu and Fedora, when I tried to access the target computer’s interface directly
    via the **Screen** button, I got a message that the software does not support
    Wayland. To use DWS Remote Control with distributions that launch a Wayland session
    by default, the need to take a small detour, which the “DWS Remote Control on
    Wayland” box explains.


    ## Different Operating Principle


    DWS Remote Control uses an abstraction to represent the remote filesystem.


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_25_0.png)


    Each remote desktop can be controlled in the same way. Only one of the buttons
    directly shows you the remote desktop.


    The first button labeled Files and Folders takes you to a screen that maps the
    remote computer’s filesystem. You can browse the directories and perform file
    operations such as create, delete, copy, cut, and paste. You also can upload and
    download data.


    Text editor (Figure 3) takes you to a full-featured editor that lets you create
    new files and edit existing ones. Log watch lets you browse logs and monitor them
    in real time. A click on Resources reveals some information about the hardware
    as well as the running processes and services (Figure 4).


    Screen (Figure 5) takes you to a 1:1 view of the remote computer. If you work
    in this view, the user on the remote computer can follow what is happening. However,
    you can disable the other person’s mouse and keyboard. In addition, you can scale
    the screen, switch to full-screen mode, and select keyboard shortcuts to share.


    Shell takes you to a terminal emulation where you can run commands on the remote
    computer. You can switch between the individual categories using the button top
    left (a nine-square grid). Once opened, all categories remain open as tabs.


    ## Conclusions


    DWS Remote Control was impressive in testing. No technical problems occurred when
    accessing computers outside of my home network. The Android version also performed
    as expected. Use with Wayland currently still requires a small detour on the part
    of the user. Detailed documentation is available in English [7]. The free version
    of DWS Remote Control already works fast enough at 6Mbps; latency is hardly noticeable.
    If you need more bandwidth because you want to transfer larger volumes of data
    or run several sessions at the same time, there are various subscription plans
    [8] to choose from, ranging from 8Mbps for $3 a month to 50Mbps for $120 a month.
    Because it is an open source application, the API is also open, which allows developers
    to include DWS Remote Control in their own apps [9].


    ## References


    - [1] VNC: [https://en.wikipedia.org/wiki/Virtual_Network_Computing](https://en.wikipedia.org/wiki/Virtual_Network_Computing)

    - [2] Remmina: [https://remmina.org](https://remmina.org)

    - [3] RustDesk: “A Free Alternative to TeamViewer and AnyDesk” by Thomas Leichtenstein,
    Linux Magazine, issue 266, January 2023, pp. 82-85

    - [4] DWS,Service: [https://www.dwservice.net/en/home.html](https://www.dwservice.net/en/home.html)

    - [5] DWS Remote Control download: [https://www.dwservice.net/en/download.html](https://www.dwservice.net/en/download.html)

    - [6] License: [https://www.dwservice.net/en/licenses-sources.html](https://www.dwservice.net/en/licenses-sources.html)

    - [7] Documentation: [https://docs.dwservice.net/docs/site/dwservice-installation/](https://docs.dwservice.net/docs/site/dwservice-installation/)

    - [8] Prices: [https://www.dwservice.net/en/contribute-subscriptions.html](https://www.dwservice.net/en/contribute-subscriptions.html)

    - [9] DWS Remote Control API: [https://docs.dwservice.net/docs/api/](https://docs.dwservice.net/docs/api/)


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_25_1.png)


    ## Author


    Ferdinand Thommes lives and works as a Linux developer, freelance writer, and
    tour guide in Berlin.

    '
