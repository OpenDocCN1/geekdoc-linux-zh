    files separately. Similarly, transferring the configuration files to a newer release
    of the operating system may also have limited success. Probably, the most useful
    time to use apt-clone is when you are installing a lab with identical workstations
    or a new home computer that you want to be identical to your old one. When apt-clone
    meets your needs, it is an elegant little script, but it is never going to be
