    \ 23:30 | 2.15359750186617 |\n| 2022-11-03 00:00 | 2.15359750186617 |\n\n### 将所有内容整合起来\n\
    \n您最终希望计算机下载一个覆盖未来数天的预测，并考虑您的电力消耗曲线，从而让您对未来几天的剩余电量有一个大概的了解。一种好的策略是让 cron 任务在午夜后立即从\
    \ Solcast 获取预测文件，然后使用能够进行这些估算的程序进行解析。清单 3 中的脚本是此类程序的一个概念验证。该脚本假设光伏阵列在没有电池支持的情况下工作，并尝试猜测您的房子将从电网取用多少电力，以及将产生但未被使用的电力有多少（图\
    \ 7）。被视为“浪费”的电力是指如果您签订智能电网合同，将会出售给电力公司的电力。此脚本遍历给定的预测文件，并计算该文件涵盖的时间段。\n\n第 10-37\
    \ 行使用与 solar_01.pl 相同的方法将预测文件和曲线文件加载到内存中。曲线文件不需要移除 Windows 样式的换行符终止符；因此，它缺少诸如第\
    \ 14 行所示的替换正则表达式。第 50 到 96 行遍历 CSV 预测文件的所有行，丢弃第一行（该行不存储有用的值）。尽管 Perl 高手并不真正推荐使用，但我为了可读性决定使用\
    \ C 型循环。第 52-54 行使用正则表达式提取对应的年、月、日、时、分、秒\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_65_0.png)\n\
    \n"
