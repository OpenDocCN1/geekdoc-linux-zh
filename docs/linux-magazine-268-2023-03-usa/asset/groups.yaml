    # Zack 的内核新闻


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_11_0.png)


    记录者 Zack Brown 报道了 Linux 内核社区中最新的新闻、观点、困境和进展。


    By Zack Brown


    ## Bug 跟踪


    Linux 内核开发中持续存在的噩梦之一是如何处理 Bug 报告。邮件列表每月收到数万条消息，开发人员使用各种过滤器和抄送习惯，试图将正确的邮件展示给正确的人眼。


    Bugzilla（[http://bugzilla.kernel.org](http://bugzilla.kernel.org)）是一个由 Mozilla
    公司开发的基于 Web 的 Bug 跟踪系统，已经存在多年，但大多数内核开发人员似乎对它既恨又怕。偶尔有人提到应该改进它，但那些讨论往往变得混乱。


    最近，Thorsten Leemhuis 提到 Bugzilla 应该改进，开发人员对此进行了讨论。


    作为预防措施，Thorsten 首先指出，运行 Bugzilla 实例的服务器以及 Bugzilla 实例本身都由 Linux 基金会的基础架构团队维护，他们做得非常出色，绝不应该与任何实际配置或使用该实例来分配或跟踪
    Bug 报告的人混淆。基础架构团队负责让工具保持运行，这就是他们应该做的全部。是否实际使用该工具（或不使用）以及根据需求进行配置，取决于内核开发人员。


    排除这些争议后，Thorsten 指出，Bug 报告的各种类别、接收这些报告的人员以及 Bugzilla 配置的许多其他方面都“严重过时、不完整或错误”。他补充说，虽然少数内核子系统确实积极使用
    Bugzilla，但“大量的 Bug 和回归报告（即使是好的！）从未得到开发人员的回复。”在许多情况下，在 Bugzilla 上提交 Bug 相当于将其扔进一个死亡的无底洞。


    Thorsten 还指出，Bugzilla 作为一个独立的软件项目似乎已经停滞。上游代码多年来未收到重大更新，这表明寻找一个活跃维护的替代品可能比投入大量精力让开发人员使用当前工具要好得多。


    Artem S. Tashkinov 以一些“严厉的爱”回应。他不仅同意 Thorsten 关于 Bugzilla 需要改进的观点，还表示：“无论人们是否喜欢，Bugzilla
    必须存在。[...] 子系统_维护者_根据定义必须存在于 bugzilla 中。你毕竟是维护者。人们期待你承担责任。[...] 内核 bugzilla 必须是选择退出（opt-out），而不是选择加入（opt-in）。老实说，我会自动添加过去
    6 个月内提交过内核代码的所有人，当然，如果有新开发人员提交内核代码，我也会加上他们。”


    Artem 总结道：“囤积/忽视 bugzilla 并说‘改用我们的邮件列表’是如此容易。实践表明，‘你的邮件列表’经常完全功能失调，允许[Bug]报告长期存在且从未得到解决，这对内核不利。我强烈反对内核
    bugzilla 贬值（depreciation，指降低重要性或废弃）的想法。”


    Greg Kroah-Hartman 指出，子系统维护者通常将其 Linux 内核开发作为付费公司工作的一部分进行，他们的时间分配并不一定由自己控制。


    但 Artem 说这是不合逻辑的，他拒绝接受这一点。他说：“这是一个非常常见的场景：你在 X 公司工作。公司告诉你修复一个 Bug/添加一个新功能等。你编写代码，提交它，结果导致其他使用场景出现回归。你是说这是可以的，不应该解决吗？这_正是_许多甚至_大多数_内核中引入回归的方式。”


    对此，Greg 回复道：“说真的，你们中很多人一直在与许多公司合作试图改变这种情况，但进展缓慢，并且每当新经理被调动时都需要不断重新培训。这是一份吃力不讨好的工作，请通过你拥有的任何联系人寻求帮助。”


    # 作者


    Linux 内核邮件列表构成了 Linux 开发活动的核心。流量巨大，通常每周达到 10,000 条消息，而想要跟上整个开发范围对一个人来说几乎是不可能的任务。少数勇敢承担这一任务的人之一是
    **Zack Brown**。


