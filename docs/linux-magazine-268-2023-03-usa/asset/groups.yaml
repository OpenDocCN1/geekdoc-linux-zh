    \ - (${csv_forecast[$i]}[\"power\"] * 0.5 );\n        } else {\n            $waste\
    \ += (${csv_forecast[$i]}[\"power\"] * 0.5 ) - ${consumption};\n        }\n\n\
    \        ${produced} += ${csv_forecast[$i]}[\"power\"] * 0.5;\n\n        # If\
