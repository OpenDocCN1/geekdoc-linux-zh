    # ## Democratic Decision


    The Debian community recently embarked on a decision process to consider whether
    to allow the Debian installer to install proprietary firmware. Of course, users
    can always install the binary blobs manually, but the process of finding and installing
    drivers for proprietary hardware can be disruptive and time consuming. As is often
    the case with the very deliberative and collectivist oriented Debian community,
    this debate played out over several months, culminating in a vote.


