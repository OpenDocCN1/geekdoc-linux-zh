    \ntuxedocomputers.com\n\n# 编按\n\n# 我会盯着你的\n\n亲爱的读者：\n\n被称为达沃斯精英聚会的，绝非普通的商业会议。世界经济论坛的年度大会是一个超豪华的独家活动，不是政府会议，而是来自约\
    \ 1,000 家会员公司——全球最大公司——的代表，以及少量政治领导人和学者的聚会。\n\n在今年的达沃斯会议上，微软为 50 位客人举办了一场派对，并邀请流行巨星戈登·马修·托马斯·萨默纳（Gordon\
    \ Matthew Thomas Sumner，即“斯汀” Sting）为派对提供娱乐表演。关于邀请斯汀现身并在你的派对上表演需要多少钱，各种说法不一，但据说报酬高达六位数字。\n\
    \n如果微软第二天没有裁员 10,000 名员工，关于这场音乐混音会（派对）的新闻很容易就被忽略了。这次冷酷的裁员，以及随之而来的紧缩呼吁，与聘请斯汀作为“见面交流会”明星的奢侈挥霍形成了奇怪的违和感，微软很快就在科技媒体和社交媒体上遭到了谴责。\n\
    \n我得承认，斯汀的派对对我这样的观点评论员来说是个容易攻击的目标。视觉效果糟透了。但像这样糟糕的想法的问题在于，每个人都会抱怨这有多糟，然后继续前行，留下故事的其他部分未被审视。\n\
    \n关于这个奇怪且不可思议的选择，有一点揭示了一个不言而喻的真相：技术预算和市场预算来自完全不同的宇宙。大量的资金被投入市场营销和销售，这对其他所有人来说似乎都是完全非理性的。我曾在一次贸易展上，营销顾问告诉我她的客户花\
    \ 100 万美元搭建了一个展位，但展位如此新奇且引人注目，以至于因为它出现在国家新闻节目中，他们赢得了 1,000 万美元的空中曝光时间。（她指出，新闻时间比广告时间长有价值。）我曾在一次展会上走过一个看起来像星际战舰舰桥的展位。我说，“哇，那真的很像星际战舰企业号的舰桥”，他们告诉我，“它不仅仅是看起来像，它就是星际战舰企业号的舰桥。我们从制片厂租来并运到这里的。”（别让我去核实这件事——我只是告诉你他们告诉我的。）然后是杂技特技越野摩托车街头派对，摩托车轰鸣着冲上坡道，在空中翻转，然后轰鸣着冲下另一个坡道，而友好的助手们分发着各种口味的“纯氧”冰沙，比如“树莓”和“冬青”。我还见过特朗普模仿者、毛利舞者、机械公牛和\
    \ 6 英尺高的相同双胞胎T台模特（我记得是在推广镜面存储驱动器）……这些奇观与公司试图销售的产品没有任何关系。一切都是 100% 为了引起注意。但注意是如此宝贵，以至于高管们愿意为看似毫无意义的事情支付令人难以置信的金额。\n\
    \n微软究竟为什么想请斯汀在 50 人的派对上演奏？原因之一可能是他们想让每个人都知道他们请得起斯汀在 50 人的派对上演奏。微软一直擅长投射力量和统治地位。现在他们不再像过去那样强大和具有统治力，但他们仍然可以通过以看似无穷无尽的方式撒钱来显得强大和具有统治力。对我们来说，斯汀和裁员似乎矛盾，但对微软来说，它们完美地起到了平衡作用，因为人们会说，“他们裁了\
    \ 10,000 人，暗示他们没钱，但看看他们在斯汀身上砸了这么多钱，所以也许他们确实仍然富有且强大。”这种方式的坏处是，尽管公司的高管层可能认为如此，人们一开始就不喜欢微软的“力量与统治”表演，而且现在不得不在诡计和噱头上基于这一点就更令人厌烦了。\n\
    \n需要知道的另一件事是，出现在达沃斯的那种人真的很难在其他地方接触到。在电梯里遇到一家年收入 50 亿美元公司的首席执行官是非常困难的。想想一家 50 亿美元的业务能购买多少计算机服务。当然，没有人会在这种事件上签署服务协议。他们只是建立“人脉”，以便下次\
    \ CEO 在董事会会议上对 IT 基础设施有疑问时，他可以说“我认识微软的一个家伙，我们给他打个电话……”\n\n如果聘请斯汀能与那 50 位客人中至少一人达成交易，从财务上看可能是值得的。但奥林匹斯山上的所有权谋对斯汀晚会第二天失业的那\
    \ 10,000 名工人来说意义微乎其微。\n\n裁员在高科技行业是不可避免的，而对那 10,000 名工人的尊严给予一点尊重也是好的。事实上，这可能甚至是一项好的营销。■■■\n\
    \n![](img/e3f454b04d121b3b3750fddfda8dd21e_2_0.png)\n\nJoe Casad,\n主编\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_3_0.png)\n\
