    **图 2：** 使用 apt-clone 信息归档文件的概述。


    将尝试将它们包含在备份目录中。但请注意，尝试未必总是成功，因为可安装的 .deb 包并不自动具备 Debian 发行版所需的格式和标准。这类包在日常使用中完全正常，但可能不会被
    apt-clone 识别（见图 1）。


    无论如何，几分钟内，apt-clone 就会创建一个 TAR 压缩文件。如果你试图包含第三方软件包，由于每个第三方软件包都必须单独分析，所需时间可能会长得多。你可以使用以下命令读取新创建文件的一般信息：


    ```

    apt-clone info FILE

    ```


    在图 2 中，跨越七个不同的桌面，安装了 2,977 个软件包，但只有 2,619 个是官方 Debian 软件包，这意味着完美克隆的可能性不大，尽管基本功能应该能成功克隆。要查看归档文件的不同视图，可以使用诸如
    Ark 这样的归档应用程序（图 3）。正如你所预期的，软件包源和 apt 设置是归档的主要类别，还有 apt-clone 的日志文件。偏好设置包括来自如 .config/
    或 .local 等目录的配置设置。理论上，你可以解开归档文件并尝试编辑，但这可能比值得付出的努力更多。不过，确切知道自己在做什么，而不是盲目遵循指示，永远不是浪费时间。


    由于归档文件包含系统敏感信息，除非你计划在克隆后立即删除它，否则你应该对其进行加密。使用 GPG 并在非实际使用时保持文件加密是保证合理安全性的最快方法。


    ## 如何克隆


    一旦你有了归档文件，请安装与源系统相同 Debian 版本的目标系统。使用其他 Debian 版本可能会起作用，但这会增加出现问题几率——这些问题花费的时间可能比
    apt-clone 所能节省的还要多。将归档文件传输到目标系统的根目录，如有必要请解密，并以 root 身份运行：


    ```

    apt-clone restore FILE

    ```


    该过程类似于通常安装软件包的方式，在较新的硬件上可能需要 20 分钟或更长时间，具体取决于涉及的软件包数量。如果你选择使用 restore-new distro
    而不是 restore，所需时间会更长，因为你将在同时尝试升级软件包。在恢复之前升级可能会减少出错的概率。


    当过程结束时，克隆将完成，无需重启，就像安装新软件包时发生的情况一样。同样，因为源文件属于 root 并以 root 身份复制，你应该不会遇到权限问题。如果你确实遇到了任何问题，使用
    apt-clone diff 与源机器的文件进行比较可能有助于解决问题。


    ## 局限性


    apt-clone 的主要缺点是它专为配合官方存储库使用而设计。


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_42_1.png)


    **图 3：** 归档文件内容的概述。


    如果你要克隆的系统包含来自第三方源安装的 .deb 软件包，apt-clone 会尝试处理它们，但有时可能不成功。这意味着，例如，如果你安装了来自 The
    Document Foundation 的最新版本 LibreOffice，你将不得不单独备份配置文件。同样，将配置文件传输到操作系统的较新版本可能也只会取得有限的成功。可能，使用
    apt-clone 最实用的场景是当你安装由相同工作站组成的实验室，或想要一台与你旧电脑完全相同的新家用电脑时。当 apt-clone 满足你的需求时，它是一个优雅的小脚本，但它永远不会是针对所有可能情况的完整解决方案。
