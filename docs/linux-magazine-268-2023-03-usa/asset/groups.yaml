    第一个调用检查依赖项并安装缺失的程序。第二个命令创建所需的 Minuimus 文件，第三个命令将它们复制到 /usr/bin/ 目录。完成后，Minuimus
    将对所有系统用户可用。


    如果 Minuimus 的默认设置未能达到你期望的效果，你可以尝试使用 Minuimus 的某个选项，以获得潜在更好的结果。输入


    ```

    minuimus.pl -h -help

    ```


    以查看所有可用选项的列表。


    ## 工作原理


    Minuimus 背后的原理很简单：Minuimus 首先解压 PDF 文件，然后以更高效的方式重新压缩它。Minuimus 利用了自身的能力以及多个其他程序，包括用于压缩特定文件类型的
    AdvanceCOMP [3]、用于压缩 PNG 图像的 OptiPNG [4]、用于压缩 JPEG 文件的 Jpegoptim [5]、用于压缩 GIF
    文件的 Gifsicle [6] 和 flexiGIF [7]，以及用于转换 PDF 的 Qpdf Tools [8]。


    很难预测 Minuimus 能多大程度上缩小你的 PDF 文件。这取决于多个因素，主要取决于原始程序在创建该 PDF 文件时的效率如何，以及留给 Minuimus
    的缩减潜力有多大。如果 PDF 文件仅由文本组成，则文件尺寸缩减的潜力很小。如果 PDF 包含大量图形和图像，情况则有所不同，因为它们通常提供了大量的缩小潜力。


    与 Minuimus 类似的一个程序是 Leanify [9]。如果 Leanify 存在于你的计算机上，Minuimus 也会将其作为辅助工具使用；这两个程序通过各自的功能相互补充。这种组合能让你获得更好的结果。


    默认情况下，Minuimus 是无损的：它不会降低 PDF 文件中图像的质量，只是优化压缩。但是，如果结果能产生更小的文件，有时轻微的质量损失也是可以接受的。以下命令


    ```bash

    minuimus.pl --jpg-web FILE.pdf

    ```


    将文档中的 JPEG 转换为更精简的 WebP 格式，将图像质量降低到 90%。


    ## Minuimus 的实际应用


    安装后，使用以下命令调用 Minuimus：


    ```bash

    minuimus.pl FILE.pdf

    ```


    我首先在 2022 年 12 月的《LinuxUser》（一本德语杂志）社区版 [10] 上测试了 Minuimus。如图 1 所示，文件大小从 12.7MB
    减少到 11.2MB（约为原始大小的 88%）。质量损失并不明显，尤其是对于图像。原始元数据也得以保留。


    当我用 2022 年 12 月全版本《LinuxUser》的电子报进行压缩时，结果类似。Minuimus 将 PDF 大小从 32.8MB 减少到 28.7MB（为原始大小的
    87.5%）。我还尝试对互联网档案馆（Internet Archive）上阿瑟·柯南·道尔著名的 1902 年福尔摩斯小说《巴斯克维尔的猎犬》[11] 的扫描件使用
    Minuimus。在这种情况下，Minuimus 仅将文件大小减少到略低于原始大小的 99%（从 12.3MB 到 12.1MB）。相比之下，Minuimus
    将我自行扫描的一本书从 82.7MB 缩小到 66.9MB（约为原始大小的 81%）。图 2 展示了所有四项测试的结果。


    ## 结论


    安装 Minuimus 的过程很简单，使用 shell 命令进行操作也很轻松。我确实成功减小了多个文件的大小，但成功程度不一。结果取决于多个因素，其中最主要的是
    PDF 文件本身具有多大的文件大小缩减潜力。归根结底，在释放磁盘空间方面，每一分努力都有帮助。 ☐☐


