  md: "\n## TUTORIAL – LDraw and LeoCAD\n\nIf you just entered the models in files\
    \ as abstract numeric sequences, the build would not be much fun. This is where\
    \ LeoCAD comes in. It outputs the models graphically and lets you edit your creations.\
    \ This is how the model in Figure 1 was created from the text file in Listing\
    \ 1.\n\n### Virtual Building Fun\n\nWhen you launch LeoCAD for the first time,\
    \ it needs information on where the LDraw files for each LEGO brick are stored.\
    \ LeoCAD itself comes with a small selection of bricks, but this would severely\
    \ limit your creativity. In the View | Settings menu, open a dialog and go to\
    \ the General tab. Then, in the *Parts Library* field, enter the path to the folder\
    \ where you previously unzipped the LDraw files, for example, `~/ldraw/`.\n\n\
    Now you get started with the virtual build.\n\nBelow the menubar and toolbar,\
    \ the LeoCAD window is divided into two areas. On the left you will find what\
    \ is initially an empty base plate. The plate grows automatically as soon as you\
    \ place bricks close to one of its edges. Top right you will see a ball that you\
    \ can rotate with the mouse. This lets you move the model in any direction to\
    \ view it from all sides. Pressing H switches back to the original view. You can\
    \ press + to zoom into the model and - to zoom out.\n\nOn the right side of the\
    \ window, LeoCAD displays a list of all available bricks at the top, followed\
    \ by an overview of all colors underneath. For a better overview, simply filter\
    \ the selection. At start-up time, the filter defaults to Brick. You can search\
    \ for bricks using the search field below. Either type in the part number you\
    \ are looking for (e.g., 3002 for a brick with two-by-two studs) or search for\
    \ the size of a brick. To do this, enter something like 2 x 2. Pay attention to\
    \ the spaces:\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_90_0.png)\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_90_1.png)\n\
    \n![](img/e3f454b04d121b3b3750fddfda8dd21e_91_0.png)\n\n**Figure 3: The instructions\
    \ show you how to assemble Tux in 12 steps from bricks.**\n\notherwise you will\
    \ not see any results. In addition, you can find a specific brick by typing its\
    \ name, such as *slope brick*. Use *Insert* to integrate the appropriate brick\
    \ into the model or drag it to the desired position with the mouse.\n\nNow you\
    \ need to insert the brick correctly. To do this, click on the brick to select\
    \ it. LeoCAD marks the selected brick with six arrows (Figure 2). The three straight\
    \ arrows let you move the brick back and forth, left and right, and up and down.\
    \ Alternatively, you can use the arrow keys and the Page Up and Page Down keys.\
    \ The three curved arrows are used to rotate the brick on all three axes. To do\
    \ this, use the same keys as you used for moving again, but this time in combination\
    \ with the Shift key.\n\nDuring a build, you will often use single bricks or a\
    \ certain arrangement several times. Instead of reinstalling and aligning each\
    \ brick individually, you can simply select the brick in question (or the respective\
    \ combination if you hold down Ctrl) in the model and then duplicate the selection\
    \ using Ctrl+D. Then move the cloned elements to the desired location.\n\nUp to\
    \ this point, your model is still gray – high time to add some color. You can\
    \ see the available colors bottom right in the window. As soon as you click on\
    \ one of the colors, the bricks in the selection list on the right are painted\
    \ in that color. If you want to color bricks that have already been installed,\
    \ first select the desired bricks and then select the bricks in question. Then\
    \ select the *Part | Paint Selected* menu item to finally color the bricks.\n\n\
    ### Build Instructions\n\nIf you want to rebuild your virtual model later with\
    \ real bricks, it makes sense to follow the step-by-step instructions. To do this,\
    \ insert a new build step at appropriate points when assembling the virtual model\
    \ by pressing Alt+Right arrow. The *File | Instructions* menu item displays detailed\
    \ instructions\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_91_1.png)\n\n**Figure\
    \ 4: Parts Used** lists all the bricks for a project; switch to **Summary** to\
    \ see the model’s size.\n\nfor the finished model, recording the bricks required\
    \ for each step of the build (Figure 3). A list of all bricks used in a model\
    \ is provided by the `Parts Used` tab from the `Summary | Properties` menu item\
    \ (Figure 4). Switch to the `Summary` tab and you will see the size of the model.\
    \ This gives you an idea of the dimensions the model will have when built with\
    \ real bricks.\n\n### Miniature Figures\n\nMiniature figures give you more lively\
    \ models. LeoCAD offers a wizard for this purpose, which you can launch via the\
    \ `Part | MiniFig Wizard` menu (Figure 5). A dialog opens where you can assemble\
    \ the individual parts of a miniature figure – hair, face, body, and accessories\
    \ – and specify colors. Next to some elements, you will also find an input field\
    \ for a number that you can use to rotate the element in question. For example,\
    \ you can rotate the face or bend the arms, hands, and legs.\n\nPress the `Save`\
    \ button to store a minifig in your collection and `Delete` to remove it. `Export`\
    \ saves the minifig data in a separate file, and `Import` loads the data for a\
    \ figure from an external file. Once you are satisfied with your minifig, press\
    \ `OK` to insert it into the model, such as the coffee house shown in Figure 6.\n\
    \n### Exporting\n\nLeoCAD offers several options for exporting. You can use the\
    \ `File | Save Image` menu item to turn a model into a PNG graphic. For more options,\
    \ see `File | Export`. You can create an HTML file from your model or write a\
    \ list of the bricks used for it to a CSV or XML file. You can reuse the bricks,\
    \ for example, on an online marketplace such as BrickLink [7].\n\n### Conclusions\n\
    \nLet your creativity run wild with LDraw and LeoCAD. Building with the virtual\
    \ bricks takes some practice, but is just as fun as using real bricks. LeoCAD\
    \ also lets you create build instructions and lists of the bricks used, so you\
    \ and others can easily recreate your creations.\n\n### Info\n\n- [1] LDraw: https://www.ldraw.org\n\
    - [2] Brick list download: https://wiki.ldraw.org/index.php?title=Getting_Started_-_Linux\n\
