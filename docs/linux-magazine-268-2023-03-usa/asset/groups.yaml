    \ a full path to the image is not required.\n\nMany applications, such as the\
    \ top system performance tool, are best viewed in a terminal window. The YAD tray\
    \ script in Listing 2 calls `top` within a terminal window (Figure 3).\n\nListing\
    \ 2 calls `xterm` to launch a terminal window. The `-e` option executes the top\
