  mdcn: "\n\n## 数据投毒\n\n对于灰度图像，只有一个通道，我只需要选择第 0 通道即可。以这种方式修改的一些图像示例如图 4 所示。在第 11 行中，我将修改后的图像的标签设置为\
    \ 8。\n\n最后，在第 13 行中，再次从数据和标签的两个独立张量创建了一个数据集，并将其返回给函数调用。\n\n### 准确率\n\n可以使用之前描述的\
    \ `create_model()` 函数来计算该数据集的模型。完成此操作后，再次使用未经过篡改的验证数据集来确定该模型的准确率也是可行的。事实证明，该模型在未经过篡改的数据上也达到了\
    \ 99% 的准确率。第一个要求，即带有后门的模型需要提供与没有后门的模型类似的准确率水平，已经满足。\n\n现在剩下的唯一事情就是验证后门是否有效。为此，我需要将触发器添加到验证数据的所有示例中，并将标签也设置为\
    \ 8。然后你可以确定模型对该数据集的准确率。如果模型达到高准确率——换句话说，如果带有触发器的示例被正确识别为 8——则后门有效。实际情况正是如此。对于\
    \ 95% 包含触发器的图像，模型都检测到了 8。这意味着第二个要求也满足。如果 5% 的训练数据集被修改，那么对于带有触发器的示例，后门将在 99% 的情况下被激活。\n\
    \n### 路标\n\n本文中的示例也适用于其他场景和数据集。一篇展示 MNIST 示例的论文表明，后门可以放置在路标检测模型中。在这个场景中，一个小黄色方块作为触发器。在现实生活中，例如，一张粘住的黄色便签可能就是一个触发器。每当交通标志上出现这样一个方块时，网络就会识别出这是一个限速标志，尽管图像实际上可能显示的是一个停车标志。如果自动驾驶车辆使用这种模型且没有其他安全措施来应对威胁，这可能导致危及生命的局面。\n\
    \n![](img/e3f454b04d121b3750fddfda8dd21e_19_0.png)\n\n### 干净标签攻击\n\n本文描述方法的一个缺点是操纵很容易被发现。首先，触发器可能在训练样本中被发现。其次，带有触发器的训练样本具有错误的标签，即攻击者希望在存在触发器时模型应提供的标签。一些更高级的方法可能试图隐藏这些操纵。在干净标签攻击中，只有图像数据被操纵。标签保持不变，因此标签仍与图像匹配。甚至可以用人类审查数据集时无法察觉的方式操纵图像数据。\n\
    \n要在模型中注入后门，并不一定需要操纵现有数据集或创建新的、被操纵的、带标签的数据集。相反，你只需要将操纵后的图像发布在互联网上的特定位置，这些图像稍后可能会被某人访问，从而从中创建模型。在这种情况下，图像将由其他人（例如通过众包）进行标记，而这些人不会注意到操纵。\n\
    \n### 结论\n\n机器学习与智能系统目前正以巨大的步伐进入日常生活的各个领域。其潜力巨大，并且反复取得令人印象深刻的成果。但进步总是伴随着新的风险。尽管机器学习模型的安全性如今比几年前受到了更彻底的调查，但我们对其了解仍然很少。在我们真正信任我们的智能系统之前，人工智能社区需要开发出更有效的防御数据投毒攻击的保护措施。\
    \ \n\n### 参考信息\n\n- [1] Szegedy, Christian, 等人. “Intriguing properties of neural\
    \ networks.” arXiv:1312.6191, 2013 年 12 月\n- [2] Athalye, Anish, Logan Engstrom,\
    \ Andrew Ilyas, and Kevin Kwok, “Synthesizing robust adversarial examples.” Proceedings\
    \ of the 35th International Conference on Machine Learning (2018). PMLR 80:284–293\n\
    - [3] Goodfellow, Ian J., Jonathon Shlens, and Christian Szegedy. “Explaining\
