    \ an external script, or manually from a terminal.\n\nListing 5 shows a standalone\
    \ script that creates a system tray item that can toggle some of its tray features\
    \ (e.g., icon, tooltip, or command) every 10 seconds.\n\n# Listing 4: Launching\
