    # FOSSPICKS 开源软件精选


    ## 迷你 Web 浏览器 Min


    考虑到朴素的 Web 浏览器已多么深刻地融入我们的生活，如今那些最主流的浏览器并不显得多么朴素，且通常共享相似的功能与操作体验。Chrome、Safari、Edge、Brave
    和 Firefox 都是庞大且复杂的应用程序，它们深藏奥秘，可能因此显得难以使用；而更简单的替代方案寥寥无几。Qutebrowser 极简，但得益于其 Vim
    键位绑定，使用门槛不低。正因如此，这款名为 Min 的浏览器才显得格外清新。它基于 Electron 构建，因此并未挑战 Blink 引擎主导的单一格局，但其设计理念和美学风格确实挑战了“浏览器必须具备全能选项”的主流观念。最明显的差异在于，URL
    栏如今融入了窗口标题栏，这与许多现代 GNOME 应用如出一辙。URL 栏同样可用于搜索，默认调用 DuckDuckGo，并与 DuckDuckGo 的“bangs”指令配合得天衣无缝，例如输入
    `lw` 可直接在维基百科打开搜索结果首页。这些 bangs 指令还扩展了 Min 自身的几个命令，比如 `bookmarks` 打开书签视图，`settings`
    进入更多配置选项，你还可以在“偏好设置”面板中添加自定义指令。标签页也显示在标题栏中，紧邻其被收起的位置，确保主视图整洁有序，完全专注于网页渲染。界面上没有文字标签，仅有图标，且顶部栏两端各有一个下拉菜单。“偏好设置”页面允许你微调出色的内置广告拦截功能，将外观设为浅色或深色模式，启用用户脚本，甚至创建与
    URL 和标签页分离的独立标题栏。标签页本身可归类为“任务”，通过第二个下拉菜单访问。此外，还设有阅读模式和专注模式，后者可禁用新标签页的打开，以免你在工作时分心刷
    YouTube。它完美平衡了功能性与极简主义，相较于主流浏览器，确为耳目一新的体验。


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_86_0.png)


    像 Min 这样的极简 Web 浏览器，若你想在无干扰状态下浏览网页，会非常实用。


    **项目主页**

    https://minbrowser.org


    ## ARM 平台上的 x86 兼容层 FEX


    随着 ARM64 日益成为适用于通用 Linux 桌面和笔记本的可行平台，我们正处在一个令人兴奋的转折点。一代以来，架构领域首次出现了分裂：一方是占据主导且久经考验的
    x86 和 x86-64，另一方则是初露锋芒的新秀——基于 ARM 的 ArmArch64。如今大多数发行版都已提供其最新版本的 ARM 构建，且日趋成熟；开源特性意味着几乎所有软件都能顺利重建，但某些软件仍处于过渡期，尤其是在
    Arch 这类发行版上，AUR（用户仓库）中并非所有软件都提供 ARM 二进制文件，还有一些仅提供 x86 构建的专有软件。Apple 正凭借其性能卓越的
    Rosetta 2 应对 M1 和 M2 架构 macOS 设备上的这一难题，而 Rosetta 现已能在 macOS 的 Ubuntu 虚拟化环境中原生运行。然而，FEX
    的目标是为原生 Linux 实现类似功能。FEX 是面向 ARM64 的 x86 和 x86-64 兼容性与翻译层，使你在 ARM 主机上运行 x86 二进制文件成为可能。它目前仅支持
    ARMv8.0 和 ARMv8.1+，而非较旧 Raspberry Pi 设备上的芯片，但在现代硬件上运行速度足够快、效率足够高，以至于几乎感觉不到差异。这是运行游戏及其他尚未提供原生
    ARM 构建的专有软件的绝妙方式。在 Ubuntu 上，有一个便捷的脚本可安装 FEX 的所有必要依赖项，并将项目 PPA 添加到你的软件包存档中。此外，还需要同一发行版的
    x86 RootFS 镜像，以提供 x86 可执行文件的运行时环境；脚本会下载该镜像，并允许你选择以未压缩方式运行，或从压缩镜像中运行以节省空间。无论哪种方式，都无需额外设置即可直接运行。输入
    FEXbash，你便能立即在你自己的文件系统内运行 x86 版本的 Bash。输入 uname -a，你会发现它显示为 x86，并且你可以直接访问许多其他
    x86 可执行文件。由于图形加速功能会直通至宿主系统的库，因此依然保持完好，整个流程表现出色。


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_86_1.png)


    这里展示的是在 M1 Mac 上虚拟运行的 ARM64 版 Ubuntu 上，借助 FEX 运行的 x86 版 StepMania 游戏。


    **项目主页**

    https://github.com/FEX-Emu/FEX


    ## 音频特效：PauXStretch


    如果你热衷于音乐制作或单纯想折腾音频，时间拉伸（time stretching）是你最常使用的音频特效之一。原因在于，时间拉伸既实用又富有创意。实用体现在，它允许你将一种速度录制的音频与另一种速度录制的音频混合，而听不出音频经过处理的痕迹；创意则体现在，它让音频在时长和音高上都变得灵活可变。时间拉伸与音高移调本质上紧密相连：要延长或缩短时长，就需要减慢或加快音频，而这会影响其音高。恢复音高的过程并不简单。例如，人声中包含的共振峰（formants）并不随基础音高同步变化，需要将其过滤出来并单独处理；其他类型的音乐、乐器或打击乐也存在类似问题。


    为应对如此复杂的音频处理，人们创建了各种算法以专门处理特定类型的声音，而许多这些技术也可用于创意目的。PauXStretch 这款音频插件正是为此而设计。其名称中的“Paul”源自其核心算法（Paul''s
    Extreme Time Stretch，最初由 Nasca Octavian Paul 开发），但插件的设计旨在让你快速、便捷地访问一套全面的时间拉伸相关功能，从精确改变音频音高到将其彻底扭曲得面目全非，无所不能。插件包含七个可独立启用的水平模块，分别用于操控拉伸幅度、谐波、噪声、频率偏移与扩展、低通与高通滤波器，乃至双耳处理。模块参数的顺序可通过下方的流程图进行调整。其下是一个标签页视图，可显示采样音频波形、处理片段比例以及均衡器。


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_87_0.png)


    除了音高和时值移调，还包含一些出色的标准特效，可单独使用，例如压缩和均衡。


    这一切听起来可能很复杂，但你可以轻松操控这些旋钮，即使不完全理解其功能；声音效果可从轻微的音调变化，到巨大的故障感反馈回环。你可以处理文件或输入流，并将输出返回到你的音频应用或导出为文件。音频可以采样并冻结，在波形视图中选择一个子片段用于特殊任务。它作为
    DJ 或音乐家的实时处理特效效果出色，同样也擅长在 Ardour 或 Bibitub 中作为即插即用特效使用。但这款插件尤为引人注目的是其高品质，这可能源于其开发者通常从事商业专有音频开源开发，它甚至可构建为崭新且未被探索的
    CLAP 插件（这正是我们测试它的方式）。该插件的用户界面具有一种在开源插件中少见的专业水准。尽管单一窗口内塞满了多种选项，但导航便捷，不会让界面因复杂而显得杂乱无章。这是一项了不起的成就，且与插件所能实现的惊人音效处理截然不同；看到此类特效登陆
    Linux 平台，实属令人欣喜。


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_87_1.png)


    PauXStretch 是我们迄今能够作为 CLAP 插件构建和使用的早期音频插件之一，使其成为强大的 Linux 音频处理与操控的理想选择。


    **项目主页**

    https://github.com/essej/pauxstretch


