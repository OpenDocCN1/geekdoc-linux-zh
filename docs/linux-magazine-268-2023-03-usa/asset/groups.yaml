    ## 通过 IPTVnator 在互联网上观看电视


    ### 沙发冲浪


    多亏了 IPTV 标准和免费软件，你可以毫无问题地在 Linux 上观看你最喜欢的频道。


    作者 ERIK BÄRWALDT


    传统视听技术和现代多媒体计算机应用程序继续融合。在过去，由于软件缺乏，Linux 在流媒体免费电视节目的方面落后于其他平台。IPTVnator 是一个年轻的项目，正在努力弥补这一差距
    [1]。


    ### 技术


    传统的宽带电视接收需要额外的硬件，如 DVB-S、DVB-T 或 DVB-C 的接收器。然而，网络协议电视（IPTV）[2] 让你无需额外组件即可在互联网上观看日常电视节目。与宽带服务相比，IPTV
    编程具有一些优势。观众可以访问提供的所有内容范围，无需固定连接，也无需特殊接收器。


    除了公共广播机构，用户还可以选择许多小型地方电视台，你可以从世界任何地方通过互联网接收它们。模块化频道列表让你可以观看其他国家和大洲的频道。约 4Mbps
    的带宽对于通过 IPTV 接收标清（SDTV）电视广播已经足够。但要观看高清（HDTV）质量的节目，你需要至少 8Mbps 的带宽，这在许多现代 DSL 线路的范围内。PC
    上使用的 IPTV 软件依靠缓冲来确保即使在带宽波动的情况下也能持续接收。


    ### IPTVnator


    仍然相当年轻的程序 IPTVnator 是通过 IPTV 看电视的绝佳选择。像 FreetuxTV [3] 和 Zapping [4] 这样的旧软件包多年来没有进行任何开发，而
    Linux Mint 软件池的一部分 Hypnotix [5]，由于某些特定的依赖关系，只能在少数几个 Linux 发行版上运行。IPTVnator 目前是唯一几个图形化且通用性强的
    Linux IPTV 应用程序之一。


    IPTVnator 提供完整的功能范围，便于接收。你可以集成 M3U 或 M3U8 播放列表，并且集成的节目指南让你可以定义收藏。此外，基于 Electron
    和 Angular 框架的应用程序自动维护频道列表更新，并内置了 HTML5 播放软件。


    ### 安装


    该软件尚未进入常见发行版的存储库，但如果你的发行版支持 snap，你可以将其作为 snap 包获取。你还可以在项目网站上找到 RPM 和 DEB 包 – 或者下载适用于
    64 位系统的跨发行版 AppImage 格式的 IPTVnator。


    从特定于发行版的应用商店安装 snap 包时，例程通常会自动在桌面环境的菜单中创建一个启动器。你可以手动启动 AppImage 包，或者使用 AppImageLauncher
    将其集成到你的桌面环境中。首次启动后，应用程序显示一个仅包含少量控件的窗口（图 1）。


    ![](img/e3f454b04d121b3b3750fddfda8dd21e_79_0.png)

