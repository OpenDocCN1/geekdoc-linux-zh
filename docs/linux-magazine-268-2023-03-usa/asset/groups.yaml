    \    echo \"action:yad --text='Rain until morning'\" >$myfilepipe\n28    sleep\
    \ 1\n29    echo \"icon:stock_weather-showers\" >> $myfilepipe\n30    sleep 1\n\
    31    echo \"tooltip:Rain until morning\" >> $myfilepipe\n32    sleep 10\n33 \
    \   echo \"action:yad --text='Sunny for 2 days'\" > $myfilepipe\n34    sleep 1\n\
    35    echo \"icon:stock_weather-sunny\" >> $myfilepipe\n36    sleep 1\n37    echo\
    \ \"tooltip:Sunny for 2 days\" >> $myfilepipe\n38 done\n```\n\nIt should be noted\
    \ that the YAD menus can also be dynamically changed. In Listing 5, to add a new\
    \ menu item or change a menu item, the code would look something like:\n\n```\n\
    echo \"action:menu:\\\n    menu_title1 ! menu_command1 ! \\\n    menu_title2 !\
    \ menu_command2 ! \\\n    > $myfilepipe\"\n```\n\n# Summary\n\nCoding errors are\
    \ a fact of life, so I found the command:\n\n```\nkillall yad ; killall bash\n\
    ```\n\nto be quite useful, especially when I was playing with YAD in listening\
    \ mode.\n\nIt’s pretty amazing that with just one or a couple of lines of Bash\
    \ script you can pull together all your favorite apps and web pages into a common\
    \ system tray icon. ■■■\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_36_0.png)\n\
    \n**Figure 6: You can toggle the system tray icon, tooltip, or command with YAD.**\n\
    \n# Info\n\n+   [1] YAD: https://www.tutorialspoint.com/docs/linux/man/1/yad/\n\
    +   [2] Zenity: https://help.gnome.org/users/zenity/stable/\n+   [3] Pango documentation:\
    \ https://docs.gtk.org/Pango/pango-markup.html#pango-markup\n+   [4] Midori: https://linuxcommandlibrary.com/man/midori\n\
    +   [5] “Simple Web Scraping with Bash” by Pete Mcalfe, Linux Magazine, issue\
    \ 262, September 2022, p.36\n+   [6] Lyncx: https://lynx.invisible-island.net/"
  md: "\n# Bash Tray Scripts\n\n## Customize your system tray with YAD\n\n### BESPOKE\
    \ SYSTEM TRAY\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_33_0.png)\n\nYAD lets\
    \ you customize your system tray with one-line Bash tray scripts. By Pete Metcalfe\n\
    \nMy goal was to find a simple way to group together my favorite apps and web\
    \ pages into a system tray item.\n\nThere are a number of different approaches\
    \ to this, but for my requirements I found that the YAD (Yet Another Dialog) tool\
    \ [1] gave me everything that I needed, and I could do it all with just one line\
    \ of Bash script.\n\nIn this article, I will introduce Bash tray scripts with\
    \ three examples. The first example will show how to create tray scripts that\
    \ put Linux diagnostic data into both custom dialogs and terminal windows. In\
    \ the second example, I will add pop-up browser windows to a right-click submenu.\
    \ The final example will look at how to toggle the tray icon, command, and tooltip\
    \ with simulated weather conditions.\n\n**Listing 1: Creating a System Tray Item**\n\
    \n```bash\nyad --notification --image=\"gtk-execute\" \\\n    --command=\"yad\
    \ --text=\"$(lsusb)\\\" \\\n    --title=\"USB Info\" --fixed --button=ok \\\n\
    \    --text=\"My Fav Utility\"\n```\n\n### Getting Started\n\nThere are a number\
    \ of different tools for creating system tray applications, such as AllTray and\
    \ KDocker. For my projects, I prefer YAD because it lets you create custom dialogs\
    \ and it supports dynamic changes to the tray features. YAD is a command-line\
    \ dialog tool very similar to Zenity [2], but with some added features such as\
    \ system tray support and a more complete dialog functionality.\n\nFor Debian/Raspbian/Ubuntu\
    \ systems, you can install YAD with:\n\n```bash\nsudo apt install yad\n```\n\n\
    ### Creating a Tray Script\n\nListing 1 is a one-line Bash script that calls YAD\
    \ to create a system tray item (Figure 1). Because Bash and YAD statements can\
    \ be quite long, you can make the code more readable by using backslash (\\) characters\
    \ to extend a statement across multiple lines, as shown in Listing 1.\n\nThe yad\
    \ statement in Listing 1 uses the `--notification` and `--image` options to put\
    \ a user-defined icon in the system tray. The `--command` option calls an application\
    \ or script when you click on the tray item. The `--text` option defines tooltips.\n\
    \nIn Figure 1, the command-line `lsusb` utility lists the USB-connected devices.\
    \ The output from `lsusb` is shown in a YAD text dialog.\n\nTo terminate a YAD\
    \ tray script, use a center mouse click. You can also terminate from a right-click\
    \ menu, which I'll discuss later.\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_33_1.png)\n\
    \nFigure 1: A one-line Bash script creates a system tray item that displays the\
    \ output from `lsusb` in a dialog.\n*Photo by Soliyeon Cho on Unsplash*\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_34_0.png)\n\
    \nYAD includes a handy `yad-icon-browser` tool, which lets you review available\
    \ icons (Figure 2). To make coding a little easier, YAD only needs the image name;\
    \ a full path to the image is not required.\n\nMany applications, such as the\
    \ `top` system performance tool, are best viewed in a terminal window. The YAD\
    \ tray script in Listing 2 calls `top` within a terminal window (Figure 3).\n\n\
    Listing 2 calls `xterm` to launch a terminal window. The `-e` option executes\
    \ the `top` utility. The `-hold` option keeps the terminal open after the command\
    \ is complete. Font types and sizes can be defined with the `-fa` and `-fs` options.\
    \ The terminal window caption is set using the `-T` parameter.\n\nFormatting can\
    \ be adjusted within the YAD dialog. For more information on how to configure\
    \ YAD color and font options, see the Pango markup language [3] documentation.\n\
    \n### Right-Click Menus\n\nYAD also supports right-click menu command items in\
    \ addition to left-click commands. The syntax for menu items is:\n\n```text\n\
    menu_item_title!menu_command! icon_name!title!menu_command . . .\n```\n\nListing\
    \ 3 shows the main command and then four right-click menu options (Figure 4).\
    \ The main command calls `iostat` (the CPU and I/O reporting utility). The first\
    \ three right-click options are `vstat` (memory stats), `sensors` (print sensor\
    \ info), and `lsusb` (list USB devices). The fourth option kills the script.\n\
    \nInstead of using an extremely long Bash statement, the `nice_dialog` function\
    \ is created to make the output a little more presentable. This function adjusts\
    \ font type and font size for text\n\n**Listing 2: Calling `top` in a Terminal\
    \ Window**\n\n```bash\nyad --notification --image='media-memory' \\\n    --command='xterm\
    \ -hold -fa Monospace -fs 12 \\\n-T \"System Performance\" -e \"top\"' \\\n-text=\"\
    Show System Performance\"\n```\n\n**Listing 3: Adding Four Right-Click Menu Options**\n\
    \n```bash\n#!/bin/bash\n# trayyad.sh - create tray item with some Bash utilities\n\
    # - add a function to change YAD text options\n\nnice_dialog() {\n# Use Pango\
    \ markup language for custom text presentations\n    echo \"yad --text='<span\
    \ size=\"large\"><tt>$(${1})</tt></span>' \\\n    --title=$2 --button=OK \\\n\
    \    --fixed\"\n}\n\n# Create a system tray item with a right click item(s) for\
    \ custom text\nyad --notification --image='applications-utilities' \\\n    --command='nice_dialog\
    \ \"iostat -c1\" \"I/O STAT\"' \\\n    --menu='Memory! nice_dialog \"vstat\" \"\
    VSTAT\" \\\n| Sensors! nice_dialog \"sensors\" \"SENSORS\" \\\n| USB! nice_dialog\
    \ \"lsusb\" \"USB\" \\\n| Quit! killall yad' \\\n    --text=\"My Fav Utilities\"\
    \n```\n\n### Pop-Up Browser Windows\n\nMidori [4], a lightweight web browser,\
    \ has been available with the Raspberry Pi desktop for many years. One of Midori's\
    \ advantages is that it can be easily launched as a pop-up window without affecting\
    \ your main browser settings.\n\nTo install Midori on a Debian/Raspbian/Ubuntu\
    \ system enter:\n\n```bash\nsudo apt install midori\n```\n\nMidori can be run\
    \ as a pop-up window by using the web application `-a` command-line option.\n\n\
    ![](img/e3f454b04d121b3b3750fddfda8dd21e_34_1.png)\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_35_0.png)\n\
    \nListing 4 shows a one-line Bash statement that creates a tray icon that can\
    \ launch four different Midori browser windows (Figure 5).\n\n### Toggling\n\n\
    YAD supports the ability to dynamically change a tray item's icon, command, menuing,\
    \ and tooltip. To do this you need to enable listen mode (`--listen`) and then\
    \ redirect the standard I/O (stdio) – file 1 as shown in Listing 5 – to a named\
    \ pipe. After completion, a YAD tray item can be manipulated from the main script,\
    \ an external script, or manually from a terminal.\n\nListing 5 shows a standalone\
    \ script that creates a system tray item that can toggle some of its tray features\
    \ (e.g., icon, tooltip, or command) every 10 seconds.\n\n**Listing 4: Launching\
    \ Midori Browser Windows**\n\n```bash\nyad --notification --image=emblem-web \\\
    \n    --command=\"midori --http://news.google.com/\" \\\n    --menu='Facebook!\
    \ midori -a https://m.facebook.com \\\n| Linux! midori -a http://www.linux-magazine.com\
    \ \\\n| Weather! midori -a https://www.weathernetwork.com \\\n| Quit! killall\
    \ yad' \\\n    --text='My Fav Web Pages'\n```\n\nThe first step in Listing 5 sets\
    \ up a named pipe (lines 6 and 11). The named pipe is a file that is used to pass\
    \ command arguments to YAD. Next, redirect stdio (file 1) to the named pipe (line\
    \ 14) and then have YAD get its input from the redirected file 1 (line 21).\n\n\
    A while loop cycles every 10 seconds (lines 24-26). Custom YAD command arguments\
    \ are written/redirected to the named pipe with `echo` statements (e.g., line\
    \ 27). Adding `sleep` statements helps ensure that YAD doesn't miss a command\
    \ before a new command is written.\n\nListing 5 uses static weather data (Figure\
    \ 6). A future step would be to periodically scan for actual weather data. If\
    \ you're interested in using Bash to scrape the web [5], take a look at the Lynx\
    \ [6] command-line browser. With one line of Bash, you can use Lynx to cleanly\
    \ extract the contents of a web page; then, with a piped `grep` command, you can\
    \ parse out the desired data.\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_35_1.png)\n\
    \n![](img/e3f454b04d121b3b3750fddfda8dd21e_36_0.png)\n\n**Listing 5: Toggle Tray\
    \ Item Features**\n\n```bash\n01 #!/bin/bash\n02 #\n03 # tray_toggle.sh – toggle\
    \ system tray items\n04 #                 – create a named pipe for inputs\n05\
    \ #\n06 myfilepipe=\"/tmp/tray1.pipe\"\n07\n08 # Make the named pipe (if it doesn’t\
    \ exist)\n09 if ! test -e \"$myfilepipe\"; then\n10    mkfifo $myfilepipe\n11\
    \ fi\n12\n13 # redirect the stdin (file 1) to the named pipe\n14 exec 1> $myfilepipe\n\
    15\n16 # create the notification icon\n17 yad --notification \\\n18    --listen\
    \ \\\n19    --image=\"emblem-colors-grey\" \\\n20    --text=\"My Tray Test\" \\\
    \n21    --command=\"yad --text='Test Tray App'\" &\n22\n23 # Every 10 seconds\
    \ Toggle the tray features with fake weather\n24 while :; do\n25\n26    sleep\
    \ 10\n27    echo \"action:yad --text='Rain until morning'\" >$myfilepipe\n28 \
    \   sleep 1\n29    echo \"icon:stock_weather-showers\" >> $myfilepipe\n30    sleep\
    \ 1\n31    echo \"tooltip:Rain until morning\" >> $myfilepipe\n32    sleep 10\n\
    33    echo \"action:yad --text='Sunny for 2 days'\" > $myfilepipe\n34    sleep\
    \ 1\n35    echo \"icon:stock_weather-sunny\" >> $myfilepipe\n36    sleep 1\n37\
    \    echo \"tooltip:Sunny for 2 days\" >> $myfilepipe\n38 done\n```\n\nIt should\
    \ be noted that the YAD menus can also be dynamically changed. In Listing 5, to\
    \ add a new menu item or change a menu item, the code would look something like:\n\
    \n```bash\necho \"action:menu:menu_title1 ! menu_command1 ! menu_title2 ! menu_command2\
    \ ! > $myfilepipe\"\n```\n\n### Summary\n\nCoding errors are a fact of life, so\
    \ I found the command:\n\n```bash\nkillall yad ; killall bash\n```\n\nto be quite\
    \ useful, especially when I was playing with YAD in listening mode.\n\nIt’s pretty\
    \ amazing that with just one or a couple of lines of Bash script you can pull\
    \ together all your favorite apps and web pages into a common system tray icon.\n\
    \n**Info**\n\n- [1] YAD: https://www.tutorialspoint.com/docs/linux/man/1/yad/\n\
    - [2] Zenity: https://help.gnome.org/users/zenity/stable/\n- [3] Pango documentation:\
    \ https://docs.gtk.org/Pango/pango-markup.html#pango-markup\n- [4] Midori: https://linuxcommandlibrary.com/man/midori\n\
    - [5] “Simple Web Scraping with Bash” by Pete Mcalfe, Linux Magazine, issue 262,\
    \ September 2022, p.36\n- [6] Lynx: https://lynx.invisible-island.net/\n"
  mdcn: "\n\n# Bash 托盘脚本\n\n## 使用 YAD 自定义您的系统托盘\n\n### 定制系统托盘\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_33_0.png)\n\
    \nYAD 允许你使用单行 Bash 托盘脚本来自定义系统托盘。作者：Pete Metcalfe\n\n我的目标是找到一种简单的方法，将我最喜欢的应用程序和网页分组到一个系统托盘项中。\n\
    \n实现这一目标有多种不同的方法，但根据我的需求，我发现 YAD (Yet Another Dialog) 工具 [1] 提供了我所需要的一切，而且我只需要用一行\
    \ Bash 脚本就能完成所有工作。\n\n在本文中，我将通过三个示例介绍 Bash 托盘脚本。第一个示例将展示如何创建将 Linux 诊断数据放入自定义对话框和终端窗口的托盘脚本。在第二个示例中，我将把弹出浏览器窗口添加到右键子菜单中。最后一个示例将探讨如何模拟天气状况来切换托盘图标、命令和工具提示。\n\
    \n**列表 1：创建系统托盘项**\n\n```bash\nyad --notification --image=\"gtk-execute\" \\\n\
    \    --command=\"yad --text=\"$(lsusb)\\\" \\\n    --title=\"USB Info\" --fixed\
    \ --button=ok \\\n    --text=\"My Fav Utility\"\n```\n\n### 入门\n\n有许多不同的工具可用于创建系统托盘应用程序，例如\
    \ AllTray 和 KDocker。在我的项目中，我更喜欢 YAD，因为它允许你创建自定义对话框，并支持对托盘功能的动态更改。YAD 是一个命令行对话框工具，与\
    \ Zenity [2] 非常相似，但增加了一些功能，如系统托盘支持和更完整的对话框功能。\n\n在 Debian/Raspbian/Ubuntu 系统上，你可以使用以下命令安装\
    \ YAD：\n\n```bash\nsudo apt install yad\n```\n\n### 创建托盘脚本\n\n列表 1 是一个单行 Bash\
    \ 脚本，用于调用 YAD 创建系统托盘项（图 1）。由于 Bash 和 YAD 语句可能非常长，你可以使用反斜杠 (\\) 字符将语句扩展为多行，从而使代码更具可读性，如列表\
    \ 1 所示。\n\n列表 1 中的 yad 语句使用 `--notification` 和 `--image` 选项在系统托盘中放入用户定义的图标。`--command`\
    \ 选项在你点击托盘项时调用应用程序或脚本。`--text` 选项定义工具提示。\n\n在图 1 中，命令行 `lsusb` 实用程序列出了 USB 连接的设备。`lsusb`\
    \ 的输出显示在 YAD 文本对话框中。\n\n要终止 YAD 托盘脚本，请使用鼠标中键点击。你还可以通过右键菜单终止，我稍后会讨论这一点。\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_33_1.png)\n\
    \n图 1：一个单行 Bash 脚本创建一个系统托盘项，在对话框中显示 `lsusb` 的输出。\n*照片来自 Soliyeon Cho，Unsplash*\n\
    \n![](img/e3f454b04d121b3b3750fddfda8dd21e_34_0.png)\n\nYAD 包含一个方便的 `yad-icon-browser`\
    \ 工具，它允许你查看可用图标（图 2）。为了简化编码，YAD 只需要图像名称；不需要图像的完整路径。\n\n许多应用程序，如 `top` 系统性能工具，最好在终端窗口中查看。列表\
    \ 2 中的 YAD 托盘脚本在终端窗口中调用 `top`（图 3）。\n\n列表 2 调用 `xterm` 以启动终端窗口。`-e` 选项执行 `top`\
    \ 实用程序。`-hold` 选项在命令完成后保持终端打开。字体类型和大小可以通过 `-fa` 和 `-fs` 选项定义。终端窗口标题使用 `-T` 参数设置。\n\
    \n可以在 YAD 对话框内调整格式。有关如何配置 YAD 颜色和字体选项的更多信息，请参见 Pango 标记语言 [3] 文档。\n\n### 右键菜单\n\
    \n除了左键命令，YAD 还支持右键菜单命令项。菜单项的语法如下：\n\n```text\nmenu_item_title!menu_command! icon_name!title!menu_command\
    \ . . .\n```\n\n列表 3 显示了主命令，然后是四个右键菜单选项（图 4）。主命令调用 `iostat`（CPU 和 I/O 报告实用程序）。前三个右键选项是\
    \ `vstat`（内存统计）、`sensors`（打印传感器信息）和 `lsusb`（列出 USB 设备）。第四个选项终止脚本。\n\n而不是使用一个极长的\
    \ Bash 语句，创建 `nice_dialog` 函数以使输出更整洁。此函数调整文本的字体类型和字体大小\n\n**列表 2：在终端窗口中调用 `top`**\n\
    \n```bash\nyad --notification --image='media-memory' \\\n    --command='xterm\
    \ -hold -fa Monospace -fs 12 \\\n-T \"System Performance\" -e \"top\"' \\\n-text=\"\
    Show System Performance\"\n```\n\n**列表 3：添加四个右键菜单选项**\n\n```bash\n#!/bin/bash\n\
    # trayyad.sh - create tray item with some Bash utilities\n# - add a function to\
    \ change YAD text options\n\nnice_dialog() {\n# Use Pango markup language for\
    \ custom text presentations\n    echo \"yad --text='<span size=\"large\"><tt>$(${1})</tt></span>'\
    \ \\\n    --title=$2 --button=OK \\\n    --fixed\"\n}\n\n# Create a system tray\
    \ item with a right click item(s) for custom text\nyad --notification --image='applications-utilities'\
    \ \\\n    --command='nice_dialog \"iostat -c1\" \"I/O STAT\"' \\\n    --menu='Memory!\
    \ nice_dialog \"vstat\" \"VSTAT\" \\\n| Sensors! nice_dialog \"sensors\" \"SENSORS\"\
    \ \\\n| USB! nice_dialog \"lsusb\" \"USB\" \\\n| Quit! killall yad' \\\n    --text=\"\
    My Fav Utilities\"\n```\n\n### 弹出浏览器窗口\n\nMidori [4] 是一款轻量级网页浏览器，多年来一直包含在树莓派桌面系统中。Midori\
    \ 的一个优势是它可以轻松地作为弹出窗口启动，而不会影响你的主要浏览器设置。\n\n要在 Debian/Raspbian/Ubuntu 系统上安装 Midori，请输入：\n\
    \n```bash\nsudo apt install midori\n```\n\n通过使用 Web 应用程序的 `-a` 命令行选项，Midori 可以作为弹出窗口运行。\n\
    \n![](img/e3f454b04d121b3b3750fddfda8dd21e_34_1.png)\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_35_0.png)\n\
    \n列表 4 显示了一个单行 Bash 语句，创建一个可以启动四个不同 Midori 浏览器窗口的托盘图标（图 5）。\n\n### 切换\n\nYAD 支持动态更改托盘项的图标、命令、菜单和工具提示的功能。为此，你需要启用监听模式\
    \ (`--listen`)，然后将标准 I/O (stdio) – 文件 1 如列表 5 所示 – 重定向到命名管道。完成后，YAD 托盘项可以从主脚本、外部脚本或手动从终端进行操作。\n\
    \n列表 5 显示了一个独立脚本，创建一个系统托盘项，每 10 秒切换其部分托盘功能（例如，图标、工具提示或命令）。\n\n**列表 4：启动 Midori\
    \ 浏览器窗口**\n\n```bash\nyad --notification --image=emblem-web \\\n    --command=\"\
    midori --http://news.google.com/\" \\\n    --menu='Facebook! midori -a https://m.facebook.com\
    \ \\\n| Linux! midori -a http://www.linux-magazine.com \\\n| Weather! midori -a\
    \ https://www.weathernetwork.com \\\n| Quit! killall yad' \\\n    --text='My Fav\
    \ Web Pages'\n```\n\n列表 5 的第一步是设置命名管道（第 6 行和第 11 行）。命名管道是一个用于向 YAD 传递命令参数的文件。接下来，将标准\
    \ I/O（文件 1）重定向到命名管道（第 14 行），然后让 YAD 从重定向的文件 1 获取输入（第 21 行）。\n\nwhile 循环每 10 秒循环一次（第\
    \ 24-26 行）。自定义 YAD 命令参数通过 `echo` 语句写入/重定向到命名管道（例如，第 27 行）。添加 `sleep` 语句有助于确保 YAD\
    \ 不会在写入新命令之前错过命令。\n\n列表 5 使用静态天气数据（图 6）。未来的步骤将是定期扫描实际天气数据。如果你对使用 Bash 抓取网络 [5]\
    \ 感兴趣，请查看 Lynx [6] 命令行浏览器。只需一行 Bash，你就可以使用 Lynx 干净地提取网页内容；然后，通过管道连接的 `grep` 命令，你可以解析出所需的数据。\n\
    \n![](img/e3f454b04d121b3b3750fddfda8dd21e_35_1.png)\n\n![](img/e3f454b04d121b3b3750fddfda8dd21e_36_0.png)\n\
    \n**列表 5：切换托盘项功能**\n\n```bash\n01 #!/bin/bash\n02 #\n03 # tray_toggle.sh – toggle\
    \ system tray items\n04 #                 – create a named pipe for inputs\n05\
