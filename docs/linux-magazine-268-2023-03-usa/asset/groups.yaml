    For decades, young and old alike have enjoyed the well-known bricks by Danish
    toy manufacturer LEGO. The success story began in 1932 with wooden toys. In 1949
    the first plastic bricks went into production, and since 1958 they have been available
    in the form that remains popular. Today, LEGO is far more than just a children''s
    toy; there are also many adult LEGO fans. LDraw and LeoCAD help you plan your
    own LEGO models on your PC.


    Before you get started, there are two things you need to do. First, install LDraw
    [1] on your system. This is an open standard for LEGO CAD programs. The tool comes
    with 3D models of the bricks and a file format for the notation of the models
    you build with the bricks. Download the complete brick list [2] and unzip the
    ZIP file to the `~/Ldraw/` folder or another directory. The bricks included in
    LDraw are constantly updated.


    The second step is to install a LEGO CAD program, which you use to turn the virtual
    bricks into digital models. Of the various programs that use the LDraw standard
    [3], we chose the current 21.06 version of LeoCAD [4] for this article. For the
    sake of simplicity, it is a good idea to download the AppImage variant [5], which
    you can launch directly without installing. Alternatively, pick up the source
    code from GitHub and compile the program yourself [6].


    # ## Digital Bricks


    LDraw provides information about the available LEGO bricks and the models, while
    LeoCAD displays them graphically and lets you edit them. LDraw stores the information
    in simple text files: .dat files describe the individual bricks. They are located
    in the `~/Ldraw/parts/` directory or in the `parts/` folder in the path in which
    you unpacked the LDraw archive. For each brick there is a separate file, each
    with the part number.


    In the `models/` subdirectory, you find two examples of models in LDraw: a rudimentary
    pyramid and a car. Files with models end with `.ldr`. Listing 1 shows an example.
    The first three lines contain the title, file name, and author''s name. Each line
