    - **58 自动喂鱼器**\n  树莓派 Zero 将在你外出时让鱼儿继续游动。\n- **80 IPTVnator**\n  探索互联网协议电视的世界。\n\
    - **90 LDraw 和 LeoCAD**\n  当然，你应该在 CAD 系统上设计你的乐高结构！\n\n# 新闻\n\n- **08 新闻**\n \
    \ - Nobara 项目是一个带有修复补丁的 Fedora 版本\n  - GNOME 44 现已确定发布日期\n  - Nitruz 2.6 可用，带有内核\
    \ 6.1 和一项变更\n  - Vanilla OS 初始版本现已可用\n  - 发现关键 Linux 漏洞影响 SMB 服务器\n  - Linux Mint\
    \ 21.1 现已可用，包含大量变更\n  - 又一款 Linux 平板电脑正在开发中\n  - 现已可用：使用 LibreOffice 设计第二版\n \
