    Solar systems only generate power while the sun is shining, but people often need
    electricity during off-productive hours. Two main strategies are used by homeowners
    to benefit from solar arrays after sunset. The first is signing a contract with
    a power supply company, which will buy the power you produce while you are not
    using it. This way, if you are not home during the day, your solar arrays will
    produce power for your power supply company. When you return home at night and
    turn on an electric stove, you will buy power straight from the grid, but the
    hope is that the money generated during the day will offset the cost of purchasing
    electricity during dark hours. This approach has the advantage of being cheap
    (i.e., it does not require the owner to build out a special infrastructure); however,
    it is more beneficial for power suppliers than for homeowners. Typically, power
    distributors buy your power for much less than they sell it back to you.


    The second strategy is to add a battery set to the solar system (Figure 2). The
    objective is to have the solar arrays charge the batteries during the day so you
    have energy stored for when you need it. The advantage of this approach is that
    it is more flexible and makes you less dependent on regular power suppliers. If
    your area experiences regular blackouts or power (load) shedding (a temporary
    reduction in supply of electrical power), you will be able to use battery power.
    The main disadvantages are the huge upfront cost of battery banks and the increased
    complexity of the deployment. Also, not all solar systems equipped with batteries
    are black-out proof, and some will cease operating if the grid goes down because
    of the way they are designed.


    Both strategies benefit from proper planning of power consumption. Somebody who
    sells power to the grid will still find it preferable to use electricity while
    solar is working at its best, instead of doing so at night and having to buy power
    – even if the costs are partially offset by the power sold earlier. On the other
    hand, the owner of a solar system with a battery bank will be better off using
    electric power at noon rather than draining energy from the battery needlessly
    at night.


