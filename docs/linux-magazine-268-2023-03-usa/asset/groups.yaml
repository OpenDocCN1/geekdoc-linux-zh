    15\n16 # create the notification icon\n17 yad --notification \\\n18    --listen\
    \ \\\n19    --image=\"emblem-colors-grey\" \\\n20    --text=\"My Tray Test\" \\\
    \n21    --command=\"yad --text='Test Tray App'\" &\n22\n23 # Every 10 seconds\
