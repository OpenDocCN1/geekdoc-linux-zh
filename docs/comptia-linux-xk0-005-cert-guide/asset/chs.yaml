  \n**1.** systemd 服务单元文件的主要特征是什么？\n\n**a.** 以 `service_` 开头\n\n**b.** 名称中包含 `service_`\n\
  \n**c.** 以扩展名 `.service` 结尾\n\n**d.** 完全没有扩展名\n\n**2.** 在大多数发行转向转向 systemd 时，什么取代了\
  \ SysV 级别（Runlevels）的概念？\n\n**a.** `Targets`（目标）\n\n**b.** `Service-Level`（服务级）\n\
  \n**c.** `ExecStarts`\n\n**d.** `Focuses`\n\n**3.** 哪种 systemd 功能/特性设计用于补充并可能替代\
  \ Cron 和 Cron 任务的使用？\n\n**a.** `Ticks`\n\n**b.** `Tasks`\n\n**c.** `Todos`\n\n**d.**\
  \ `Timers`（定时器）\n\n\n\n\n\n4. 在服务单元中使用哪种指令会导致该服务在另一个服务启动并可用之前不启动？\n\na. `Notyet=`\n\
  \nb. `Requires=`\n\nc. `Until=`\n\nd. `After=`\n\n# 基础知识点\n\n## 单元文件 (Unit Files)\n\
  \n由于 systemd 较新（至少与 SysV 或 Init 方案相比），有很多令人困惑和容易出错的地方，因为 systemd 可以准确地描述为既是“进步”的又是“相当复杂的”。\n\
  \n### systemd 故障排除\n\n本章将重点关注至关重要的单元文件以及其中包含的关键字或指令问题，以及可能影响 systemd 运行的常见问题。\n\n\
  ![Images](img/key_topic_icon.jpg)\n\n### 单元文件\n\n`[Unit files]` 是文本文件，但它们以特定的格式排版，包含多个节（Sections），例如\
  \ `[Unit]`、`[Service]` 等许多。帮助页（man pages）将单元文件描述为“类 ini 格式”，这意味着它们类似于 `.ini` 文件，或者由由\
  \ `=` 符号分隔的和值的指令组成，正如你在 `Example 22-1` 中看到的那样。\n\n**Example 22-1**–一个简单的单元文件示例\n\
  \n```\n[Section Name]\nDirective=avalue\nDirective=othervalue\n\n[Other Section\
  \ Name]\nDirective=somevalue\n```\n\n你可以在`第 4 章`“管理进程和服务和服务”中找到更多关于单元文件及其内容的信息。\n\
  \n注意\n\n本章的目标是指出可能导致你进行故障排除的某些问题或错误配置。由于绝大多数单元文件甚至 systemd 本身都是由可编辑文本文件组成的，因此有很多可能出错的地方，而人为错误和编辑错误是你可能陷入的麻烦中的首要问题。\n\
  \n### 运行机制\n\n我们将针对本章中 Linux+ 目标的每个章节解决最常见或最可能出现的问题，然后进入下一个章节，有很多内容需要涵盖。\n\n###\
  \ 服务单元文件问题\n\n请记住，`[Service]` 单元文件（例如 `blahwoof.service`）是另一个文本文件，由包含 `Directive=value`\
  \ 配置的 `[Sections]` 划分。\n\n#### 网络服务\n\nsystemd 的主要问题之一是，所有服务似乎都在同时启动，这通常并非如此，但看起来确实一切都在轰轰运转且可用，但有时网络还没有好。\n\
  \n通常问题在于，你希望防火墙在网络配置你的接口**之前**启动，但任何要求或需要网络正常运行的服务都会导致此问题。\n\n![Images](img/key_topic_icon.jpg)\n\
  \n在三个网络相关的目标单元（target units）中，只有 `network-online.target` 是活动单元，或者说它会非常具体地导致任何其他服务在网络启动之前等待启动。`network-online.target`\
  \ 目标是任何服务单元文件中一个非常方便的包含项，你只需要指定任何依赖于网络的单元在 `network-online.target` 验证存在配置的 IP 地址和协议栈之后（After）启动即可。\n\
  \n在 `Example 22-2` 中你可以看到任何真正依赖网络在运行前已启动并运行的服务单元文件中应该包含的两行配置代码。\n\n**Example 22-2**–After\
  \ 和 Wants 指令的使用\n\n```\n[Unit]\nOtherdirectives=values\nAfter=network-online.target\n\
  Wants=network-online.target\n```\n\n注意\n\n请记住，systemd 可以配合几个等待服务，包括如果你使用 NetworkManager\
  \ 时的 `NetworkManager-wait-online.service`，另一个是 `systemd-networkd-wait-online.service`。你使用哪一个会导致你在\
  \ `network-online.target` 文件中进一步指定该服务。关于此更多信息可以在 systemd 文档中找到，或者运行 `man` 命令并指定\
  \ `systemd-networkd-wait-online.service`。\n\n另一个更被动的、用于排序依赖网络服务的单元是 `network-pre.target`。\n\
  \n使用该目标的主要方法是在想要或依赖网络存在才能正常运行的服务单元文件中设置 `After=network-pre.target` 和 `Wants=network-pre.target`\
  \ 指令。\n\n#### ExecStart/ExecStop\n\n这两个指令有**非常多**额外的参数，稍微出一点错就会导致你进行大量的故障排除。\n\n\
  当使用 `ExecStart` 时，`=` 符号后的命令将在包含单元服务启动时执行。\n\n![Images](img/key_topic_icon.jpg)\n\
  \n**但是**，你可能会因为服务的类型立即遇到麻烦，因为除非服务的 `Type=oneshot`，否则你不能有多个命令或多行 `ExecStart`！\n\n\
  如果服务的 `Type=forking` 或任何其他类型，你可以在 `ExecStart=command` 行上**精确地**只有一条命令，而不能有多个命令，也不能有多个\
  \ ExecStart 行！\n\n`ExecStop` 指令与 `ExecStart` 指令紧密对应，它用于指定当包含的服务结束时如何结束该命令或多个命令。\n\
  \n**但是**，你不能仅仅依靠 SIGTERM 信号来结束这些进程，它们可能会忽略。你应该咨询 `systemd.kill` 帮助页中的 `KillMode=`\
  \ 和 `KillSignal=` 参数，并尝试各种信号，以确保被 `ExecStart` 的命令或进程确实被 `ExecStop` 了！\n\n#### Before\
  \ 和 After\n\n这些是简单的排序指令，你可能有一个服务必须在依赖的服务**之前**（before）启动，或者在它所依赖的服务**之后**（after）启动。\n\
  \n![Images](img/key_topic_icon.jpg)\n\n注意\n\nsystemd 中有两种依赖方法：排序和性要求。`Before/After`\
  \ 指令属于排序依赖方法。在启动服务时，会读取所有依赖项并构建一个矩阵，然后按照特定的顺序启动正确的服务。\n\n当你启动两个或多个服务时，没有固有的顺序，但你可以通过指定\
  \ `Before=name.service` 和 `After=name.service` 来强制规定顺序！\n\nsystemd 的主要特征之一是当系统启动服务时，它会尝试尽可能并行启动尽可能的服务，这可能会导致相互依赖的服务之间产生困惑，或者当许多服务依赖于某个特定服务才能正常启动和运行时。\n\
  \n这里的关键在于，你可以**过度配置** Before 和 After，你不需要两者都配置，你只需要决定哪个服务应该包含一个 Before 以及其他服务的名称，或者在那些服务中配置\
  \ After 指向它们所依赖的服务。这可能需要一块白板和一些困惑的思考时刻，所以请花些时间并正确地完成！\n\n如果我要配置 `serviceA` 在 `serviceB`\
  \ 之前（Before）启动，我有两种可能：\n\n1. 我可以在 `serviceA` 单元文件中放置一行 `Before=serviceB` 指令行，这将自动在\
  \ `serviceB` 的依赖矩阵中放入一个 `After=serviceA` 条目。\n\n2. 我可以在 `serviceB` 单元文件中放置一行 `After=serviceA`\
  \ 指令行，这将导致相同的顺序，但会在依赖矩阵中放入一个 `Before=serviceB` 条目。\n\n无论哪种方式，顺序都是相同的。如果我们使用三个服务\
  \ `serviceA`、`serviceB` 和 `serviceC`，并且我们希望 `serviceB` 和 `serviceC` 都在 `serviceA`\
  \ 之后（After）启动，我们可以像所示操作，只需将两个服务名称放在 `After=` 或 `Before=` 行中即可。\n\n真正的问题在于，你是想对这些服务进行排序，还是想对它们的可用/不可用有要求，以便启动或结束另一个服务（们）？这将在章后面的“Requires\
  \ and Wants”部分进行介绍。\n\n### Type\n\n\n\n\n\n![Images](img/key_topic_icon.jpg)\n\n\
  单元的 `type` 是一回事，但由于它们都只是文本文件，且单元类型通常由 `.service` 或 `.socket` 后缀指示，这并不是我们需要讨论的问题。我们需要关注的是\
  \ `Type=` 指令以及我们在上一个章节中看到的选项，例如：\n\n* `simple`\n* `forking`\n* `oneshot`\n\n我反复看到的主要问题是对\
  \ `Type=oneshot` 配置的误用，这会导致长时间的等待或其他问题。\n\n`simple` 或 `forking` 的 `Type` 设置会导致单元被处理并启动服务或可执行文件；在\
  \ `forking` 类型下，它会立即启动子进程，但系统**预期**会这样做，并会跟踪发生的情况。\n\n如果服务通过 socket 通信，`simple`\
  \ 类型将使用其他具有类似命名的 `.socket` 单元。无论何种情况，使用 `simple` 或 `forking` 时，场景都会简单且直接得多。\n\n\
  最棘手的问题是使用 `Type=oneshot` 时，这主要是因为 `oneshot` 运行周期非常短，但系统（systemd）应该**等待**进程退出才会继续处理其他单元。\n\
  \n确保使用正确的 `Type=` 语句至关重要，否则 systemd 可能会挂起，或者在服务应该持续运行的情况下等待过长时间才退出。\n\n## User（用户）\n\
  \n可以将 systemd 服务配置为以指定用户运行，你只需要指定像我们在 示例 22-3 中看到的内容即可。\n\n**示例 22-3**–将 systemd\
  \ 服务配置为以指定用户运行\n\n```\n[Service]\nType=simple\nUser=rossb\nGroup=staff\n```\n\n\
  指定用户通常是因为配置上的特殊之处，或者有理由以该特定用户运行该服务。这可以影响几乎任何服务，但重要且编写良好的服务通常会有自己的特定配置，用于指定它们应该运行的用户。\n\
  \n例如，NGINX 在 `/etc/nginx/nginx.conf` 文件中指定了它应该运行的用户，尽管在大多数发行版中它通常是作为 systemd 服务运行的。\n\
  \n## Requires and Wants\n\n![Images](img/key_topic_icon.jpg)\n\n`Requires=` 和 `Wants=`\
  \ 指令之间的主要区别是：如果 `serviceA` Needs `serviceB`，那么没有 `serviceB`，它就无法运行，因此 `serviceB`\
  \ **必须**运行才能允许 `serviceA` 启动。\n\n`Wants=` 指令的概念是，虽然 `serviceA` 启动时**不需要**有 `serviceB`\
  \ 运行，但这是一个非常好的主意，因此它希望有 `serviceB` 在那里。知道这种区别非常重要，因为许多服务在没有名称服务的情况下也会启动，但没有它它们可能无法正常工作。\n\
  \n## Timer Unit File Issues（定时器单元文件问题）\n\nTimer 单元文件是 systemd 尝试替换 CRON 任务的方式，尽管成功有限。\n\
  \n### OnCalendar\n\nOnCalendar 设置定义了定时器事件的具体日期时间，如果定时器没有在指定的时刻发生，可能会导致困惑。时钟需要准确，所以请查看\
  \ `AccuracySec` 设置以获取更多关于确保时钟准确的信息。\n\n### OnBootSec\n\n确保设置了 OnBootSec 的定时器不会与用户设置冲突，你可以使用\
  \ `systemctl -user` 查看任何特定用户的设置。\n\n### Unit\n\n此设置指示了在到达定时器时应激活或开启的 `Unit`，配置错误或指定不存在的单元是最常见的问题之一。\n\
  \n如果你不小心将单元设置为另一个定时器，它将不会执行或激活该 `.timer` 单元，而是默认退化到同名的 `.service`，这在这种情况下可能会非常令人困惑或惊慌……\n\
  \n### Time Expressions（时间表达式）\n\n系统的 time expressions 方法相当复杂，对于初学者来说可能非常困惑。此外，对于那些习惯在\
  \ CRON 中使用 `@time` 表示法的人来说，你需要非常注意这些在系统时间表达式中的含义。\n\n## Mount Unit File Issues（挂载单元文件问题）\n\
  \n挂载单元旨在控制和监督 systemd 挂载的设备和文件系统，包括哪些可以挂载以及不能挂载。挂载单元与其他单元一样是文本文件，因此容易受到错误和拼写的影响，这会让已经复杂的场景变得更加复杂。\n\
  \n### Naming Conventions（命名规范）\n\n###挂载单元中最敏感且容易配置错误的部分是命名。挂载单元的名称**必须**与它控制的文件系统名称匹配，但有一个简单但重要的区别：名称中表示的挂载点匹配不是\
  \ `/mount/point/filesystem`，而是 `mount-point-filesystem`。你只需要将 `/` 字符替换为 `-`，因为 `/`\
  \ 是受保护的系统字符，只出现在两个文件对象之间（通常是一个目录以及其内部另一个目录或文件）。\n\n### What\n\n在读取挂载单元时，systemd\
  \ **不使用** `User=` 和 `Group=` 指令或设置，而是使用 `What=` 来显示挂载的源，即：正在挂载的设备是什么。\n\n这存在拼写错误，你应该在手动创建的挂载单元中仔细检查此设置。systemd\
  \ 自动生成的较产生（人为）错误。\n\n### Where\n\n与 `What=` 设置配合使用的是 `Where=` 设置，矛盾的是，对于 systemd\
  \ 来说，这已经尽可能清晰了，它指定了 systemd 在**何处**挂载你在挂载单元中指定的 `What`。\n\n存在可能导致问题的情况，例如已有的挂载点实际上被用于其他用途，将文件系统挂载到现有目录作为挂载点将遮盖或使该挂载点及其下面的任何内容失效，直到新的挂载被卸载。\n\
  \n### Type\n\n通常 systemd 会在挂载时检测文件系统的类型，但在某些情况下，你可能需要手动配置正在挂载的文件系统类型。\n\n记住，挂载文件系统通常需要\
  \ root 权限，但 systemd 也为非 root 用户执行挂载提供了规定，但这出了 Linux+ 目标的范围。\n\n### Options\n\n有时你会意识到，Lennart\
  \ 先生和努力让 systemd 成为行业标准的开发团队确实考虑了一些非常棘手的问题，这在挂载单元文件的 `Options=` 行中也是如此。\n\n这在实际上是模拟\
  \ `/etc/fstab` 中的 `Options` 列，或者取决于你的观点，是取代它。\n\n特别值得注意的是，并不是所有选项都受支持，需要进行实验来查看你所需的哪些选项可以生效。\n\
  \n## Target Unit File Issues（目标单元文件问题）\n\nTarget 单元与 Sys V 级别（Runlevels）相似，Target\
  \ 的问题将影响大量其他单元的加载，或者在出错时导致无法加载。\n\n### Default\n\n`default.target` 并不是真正的目标，记住，它是指向指定为默认的目标单元的链接。\n\
  \n为了检查默认目标是否是你认为的或应该是的，请记得使用 `systemctl get-default` 命令，如你在 示例 22-4 中看到的那。\n\n![Images](img/key_topic_icon.jpg)\n\
  \n**示例 22-4**–确定默认目标\n\n```\n$ systemctl get-default\ngraphical.target\n```\n\n\
  默认值以系统已知的方式显示。然而，如果你得到了不同的结果，记得上一个章节提到的，我们可以通过 示例 22-5 显示的命令查看实际的链接目标。\n\n**示例 22-5**–通过\
  \ **find** 命令确定默认目标\n\n```\n$ find /usr -iname default.target -exec ls -l {} \\\
  ;\nlrwxrwxrwx 1 root root 16 Jun 27  2022\n/usr/lib/systemd/system/default.target\
  \ -> graphical.target\n```\n\n\n\n\n正如你看到的，`default.target` 实际上是 `graphical.target`\
  \ 的软链接。如果你遇到了奇怪的 Target（目标）错误，请先检查此处，然后确保该目标没有被 `MASKED`（屏蔽），或者无法被 `systemd` 运行。\n\
  \n有时你会看到某个 target 已被屏蔽且无法运行，例如我们之前示例中的 `graphical.target`。你可以通过列出已加载的 target 来检查是否此类情况，如示例\
  \ 22-6\n\n**示例 22-6**–为了故障排除查看已加载的 targets\n\n```\n$ systemctl list-units --type=target\n\
  \  UNIT                   LOAD   ACTIVE SUB    DESCRIPTION\n  basic.target     \
  \      loaded active active Basic System\n  cryptsetup.target      loaded active\
  \ active Local Encrypted Volumes\n  getty.target           loaded active active\
  \ Login Prompts\n  graphical.target       masked active active graphical.target\n\
  \  local-fs-pre.target    loaded active active Preparation for Local File\nSyst\n\
  \  local-fs.target        loaded active active Local File Systems\n● multi-user.target\
  \      loaded active active Multi-User System\n  network-online.target  loaded active\
  \ active Network is Online\n  network-pre.target     loaded active active Preparation\
  \ for Network\n  network.target         loaded active active Network\n  nss-lookup.target\
  \      loaded active active Host and Network Name\nLookups\n  nss-user-lookup.target\
  \ loaded active active User and Group Name Lookups\n  paths.target           loaded\
  \ active active Path Units\n  printer.target         loaded active active Printer\
  \ Support\n  remote-fs.target       loaded active active Remote File Systems\n \
  \ slices.target          loaded active active Slice Units\n  sockets.target    \
  \     loaded active active Socket Units\n  sound.target           loaded active\
  \ active Sound Card\n  swap.target            loaded active active Swaps\n  sysinit.target\
  \         loaded active active System Initialization\n  time-set.target        loaded\
  \ active active System Time Set\n  timers.target          loaded active active Timer\
  \ Units\n  veritysetup.target     loaded active active Local Verity Protected\n\
  Volumes\n\nLOAD  = 反映单元定义是否已正确加载。\nACTIVE = 高级单元激活状态，即 SUB 的泛化。\nSUB    = 低级单元激活状态，值取决于单元类型。\n\
  列出 23 个已加载的单元。使用 --all 可以查看已加载但未激活的单元。\n使用 'systemctl list-unit-files' 显示所有已的单元单元。\n\
  ```\n\n如果你检查 `graphical.target` 所在的行，你会发现它是被屏蔽的，取消屏蔽的方法是使用 `unmask` 子命令：\n\n```\n\
  $ sudo systemctl unmask graphical.target\n```\n\n然后你就可以使用示例 22-6 中的命令对它进行检查，并发现它已取消屏蔽且可用。如果可能的话，最好是重启系统，以确保从现在起，所有内容都按照你的预期进行加载。\n\
  \n### 多用户模式 (Multiuser)\n\n我最喜欢的一个问题案例，是有人说他们的系统在启动时没有加载图形子系统，结果发现默认 target 是 `multi-user.target`。这意味着系统**本不应该**加载图形子系统，而是纯文本界面。通过以下命令将\
  \ `graphical.target` 设为默认目标可以轻松修复：\n\n```\n$ sudo systemctl set-default graphical.target\n\
  ```\n\n这将使得系统尝试（如果不是实际上）启动并最终以图形子系统作为默认界面。\n\n### 网络就绪 (Network-online)\n\n`systemd`\
  \ 的主要问题之一是似乎所有服务都在同时启动，这通常并非事实，但看起来一切都已运行起来并轰鸣且可用了。然而，这一切需要时间，而且由于规模或复杂性，同时启动的所有服务加载时机显然会有不同。\n\
  \n要确保网络服务在需要时在线，你可以做的主要事情之一是配置 `Wants=` 或 `Requires=` 指令，指向适用于系统的适当网络服务管理方案。\n\n\
  本章开头附近的“网络服务”部分将提供更多关于如何确定你使用哪种网络管理方案的信息。\n\n### 图形界面 (Graphical)\n\n由于 `graphical.target`\
  \ 只是一个 target，因此可能会有很多因素阻止它按你预期的方式加载。\n\n特别是，如果你的系统可以启动，你看到了文本登录提示，但如果 runlevel（运行级别）或\
  \ target 级别是 5 或 graphical，那么你存在依赖问题或在加载某些需要的服务或其他 target 时遇到了问题，你需要检查你的日志文件和 systemd\
  \ 配置。\n\n首先要做的是是查看 `/usr/lib/systemd/system/graphical.target` 中的 `After=` 行。\n\n\
  \n\n\n就像犯罪现场一样，应用程序崩溃可能很难调查，除了突然崩溃的应用程序外，通常没有太多线索，如果你运气好，可能会看到一条可能有用也可能没用的屏幕消息。\n\
  \n你可以做的第一件可能最简单的一件事是查看系统日志文件，寻找是否有任何发生故障的迹象；在基于 systemd 的系统中，很可能有某种错误信息已写入日志或系统日志（journal）中。\n\
  \n你在本书的和其他章节中已经看到过多次查看日志和系统日志条目的示例，所以请务必尽快查看这些资源，并在搜索时审慎选择搜索术语。有些应用程序在日志中甚至只会用它们自己的语言大声尖叫“噢，救命！”，而你可能需要在寻找真相的过程中需要解析多个错误条目。\n\
  \n![Images](img/key_topic_icon.jpg)\n\n在基于 syslog 的系统中，查看任何条目放置在何位置的另一种极佳方法是使用 `journalctl`\
  \ 命令查看过去几分钟的日志条目，我们在图 22-1 中所示即是。\n\n![Description: 计算机屏幕截图 描述自动生成的描述](img/22fig01.jpg)\n\
  \n**图 22-1**–`journalctl --since “5 minutes”` 命令的输出\n\n该命令可以修改为几乎任何时间段，例如“1 小时前”和“2\
  \ 天前”，这只是其中的几种可能性。\n\n当应用程序崩溃时，你可以配置系统对系统正在使用的内存快照并写入磁盘，根据你的背景，这被称为“核心转储”（core dump）或“崩溃转储”（crash\
  \ dump）。\n\n在基于 systemd 的系统中启用核心转储：\n\n**步骤 1.** 作为 root 用户，将崩溃文件的 `ulimit` 设置为无限：\n\
  \n```bash\n# ulimit -c unlimited\n```\n\n**步骤 2.** 运行 `sleep` 命令并使其崩溃：\n\n```bash\n\
  sleep 50 & ; killall -SIGSEGV sleep\n```\n\n**步骤 3.** 这将显示一条关于 sleep 发生段错误的文本模式消息，或者启动一个图形应用程序（Apport），它将引导你保存并可能发送崩溃报告。\n\
  \n注意\n\n要重置核心大小限制，只需使用与设置“无限”时相同的命令，如之前所示，但不要使用“unlimited”，而是使用“0”或字符零。\n\n**步骤\
  \ 4.** 根据你正在使用的分发行版，你可能想要检查核心转储是否在 `/var/crash` 中，如果是，一个简单的 `ls` 命令将显示它的存在和大小。\n\
  \n**步骤 5.** 你的系统可能会将崩溃转储放在应用程序的工作目录下，你可以通过查看 `/etc/sysctl.conf` 中包含 `kernel.core_pattern`\
  \ 的行来确认这一点。\n\n**步骤 6.** 你也可以使用 `sysctl` 命令查看 `kernel.core_pattern` 信息：\n\n```bash\n\
  $ sysctl kernel.core_pattern\n```\n\nUbuntu 拥有一个自动化程序，可以捕捉发生的崩溃并弹出上述 Apport 程序，该程序将引导你检查崩溃的细节。\n\
  \n注意\n\n你还可以使用 `apport-cli` 程序，这需要一些阅读和实验，但在非图形化系统中调查崩溃时非常有帮助！\n\n### 时区配置\n\n一个较少被理解但非常重要的配置项是时区，即使服务器是从有效的时间服务器获取时间，时区偏移也可能导致它比正确时间快或慢一个或更多！\n\
  \n当你拥有基于精确时间索引的系统时，这是一个关键问题，特别是数据库服务器以及任何需要极其精确时间戳的内容。\n\n查看你的时区设置为何的非常快速方法是如示例\
  \ 22-8 所示运行 `date` 命令。\n\n![Images](img/key_topic_icon.jpg)\n\n**示例 22-8**–`date`\
  \ 命令输出的示例\n\n```bash\n$ date\nMon Mar 20 22:53:09 MDT 2023\n```\n\n4 位年份之前的 MDT\
  \ 字符显示了你当前的 `$TZ` 变量值，该值在你的时间配置文件 `/etc/timezone` 中设置。\n\n你可以临时地将其设置为你想要的任何值，例如通过向\
  \ `$TZ` 变量导出不同的值来设置为太平洋夏令时间，如示例 22-9 所示。\n\n**示例 22-9**–临时更改时区的示例\n\n```bash\n$\
  \ export TZ=”America/Los_Angeles” ; date\nMon Mar 20 22:55:34 PDT 2023\n```\n\n\
  你当然可以通过 `/etc/localtime` 符号链接来永久更改你的时区信息，你可以在示例 22-10 中查看结果。\n\n**示例 22-10**–`/etc/localtime`\
  \ 符号链接目标的示例\n\n```bash\n$ ls -l /etc/localtime\nlrwxrwxrwx 1 root root 34 Mar 18\
  \ 11:16 /etc/localtime ->\n/usr/share/zoneinfo/America/Denver\n```\n\n你可以调查 `/etc/share/zoneinfo`\
  \ 目录的内容，并决定可能将此符号链接指向其他哪些时区文件，例如我们之前使用的 America/Los_Angeles。\n\n### 启动问题\n\n启动过程以及产生的一些问题和排排除步骤已第\
  \ 1 章，“理解 Linux 基础.ch01.xhtml_ch01)”中涵盖过。\n\n### 日志问题\n\nJournaling 曾经是指 EXT 文件系统上的事务日志，但自从\
  \ systemd 引入以来，journaling 指的是 systemd 中的日志。\n\n人们对 journald 的很多问题在于它不是 syslog！有几个主要区别让那些初次接触日志的人生活得很困难，包括在某些情况下你的日志可能不是持久的！\n\
  \n### 服务未按时启动\n\n服务未按时启动的问题在先前的故障排除中已经涵盖过，它主要与确保所有依赖于它们的服务（特别是名称服务和网络）位于这些服务的 `Wants=`\
  \ 或 `Requires=` 指令中有关。\n\n关于此的更多信息可以在章节早期部分的网络服务故障排除讨论中找到。\n\n### 总结\n\n在本章中，你学习了所有常见问题的故障排除，包括\
  \ Unit 文件，如服务（Services）、定时器（Timers）、挂载（Mounts）和 Target 文件。\n\n你还学习了常见问题，尽管大部分内容在之前的章节中已涵盖过。\n\
  \n### 考试准备任务\n\n正如引言中“目标与方法”部分提到的，你有几个准备考试的选项：这里的练习、第 23 章 以及 Pearson Test Prep\
  \ Online 中的考试模拟题。\n\n### 复习所有关键主题\n\n复习本章中最重要的主题，这些主题在页外边缘已用关键主题图标标记出。表 22-2 列出了这些关键主题以及它们所在的页码。\n\
  \n![Images](img/key_topic_icon.jpg)\n\n**表 22-2**–第 22 章的关键主题\n\n![Images](img/22tab02.jpg)\n\
  \n### 定义关键术语\n\n定义本章的以下关键术语并在词表中检查你的答案：\n\n`Unit File` (#ch22.xhtml_key01)\n`Service`\
  \ (#ch22.xhtml_key02)\n`Before` (#ch22.xhtml_key03)\n`After` (#ch22.xhtml_key04)\n\
  `ExecStart` (#ch22.xhtml_key05)\n`ExecStop` (#ch22.xhtml_key06)\n`Type` (#ch22.xhtml_key07)\n\
  `Timer` (#ch22.xhtml_key08)\n`OnCalendar` (#ch22.xhtml_key09)\n`OnBootSec` (#ch22.xhtml_key10)\n\
  `Time expressions` (#ch22.xhtml_key11)\n\n命名规范\n\n`Network-online` (#ch22.xhtml_key13)\n\
  `Name Resolution` (#ch22.xhtml_key14)\n`Application Crash` (#ch22.xhtml_key15)\n\
  \n### 复习题\n\n这些复习题的答案在附录 A 中。\n\n**1.** systemd 服务单元文件的主要特征是什么？\n\n**a.** 以 service_\
  \ 开头\n**b.** 名称中包含 _service_\n**c.** 以 .service 扩展名结尾\n**d.** 完全没有扩展名\n\n\n\n\n\n\
  ## 2. 在大多数发行版转向使用 systemd 的过程中，什么取代了 SysV 运行级别（Runlevels）的概念？\n\n**a.** 目标（Targets）\n\
  **b.** 服务级（Service-Level）\n**c.** ExecStarts\n**d.** （Focuses）\n\n## 3. 哪种 systemd\
  \ 特性/功能旨在补充并可能替代 Cron 和 Cron 任务（Cron Jobs）？\n\n**a.** 节（Ticks）\n**b.** 任务（Tasks）\n\
  **c.** （Todos）\n**d.** 定器（Timers）\n\n## 4. 在服务单元单元哪种指令会导致该服务在另一个服务启动并可用之前不启动？\n\n\
  **a.** Notyet=\n**b.** Requires=\n**c.** Until=\n**d.** After=\n\n## 第 23 章 最后的准备\n\
  \n读完这本书后，你对考试感到兴奋吗？我真心希望如此。你理应如此。在这一章中，我们将把所有的认证准备整合在一起，并更详细地查看认证考试本身。\n\n本章分享了一些确保你考试取得优异成绩的好主意。如果你是为了精通\
  \ Linux 而读这本书，并且并没有真正考虑过认证，那么这一章甚至可能说服你尝试一下！\n\n本书的前 29 章涵盖了技术、协议、编程概念和考虑因素，这些通过\
  \ CompTIA Linux+ (XK0-005) 考试所需的准备。虽然这些章节提供了详细信息，但大多数人需要的准备不仅仅是阅读本书的前 29 章。本章详细介绍了一套工具和学习计划，帮助你完成考试准备。\n\
  \n这个短小的章节分为四个主要部分。第一部分列出了 CompTIA Linux+ (XK0-005) 考试信息和分解。第二部分分享了一些需要记住的重要提示，以确保你准备好参加考试。第三部分讨论了在学习过程此时阶段可能有用的考试准备工具。本章的最后一部分在你完成书中之前的所有章节后，提供了一份供你遵循的学习计划。\n\
  \n### 考试信息\n\n以下是关于 Linux+ 考试你应该注意的细节：\n\n![Images](img/square.jpg) **题型：** 多选题和基于性能的选择\n\
  ![Images](img/square.jpg) **题目数量：** 最 90 题\n![Images](img/square.jpg) **时间限制：**\
  \ 90 分钟\n![Images](img/square.jpg) **及格分数：** 720 分（分值范围 100 到 900 分）\n![Images](img/square.jpg)\
  \ **语言：** 英语（发布时）。日语、葡萄牙和西班牙语（即将推出）\n![Images](img/square.jpg) **考试费用：** 358 美元\n\
  ![Images](img/square.jpg) **考试 ID 代码：** XK0-005\n\nCompTIA Linux+ 认证验证了 IT 专业人员在配置、监控和支持运行\
  \ Linux 操作系统的服务器方面的实战技能。新的 Linux+ 考试增加了对以下主题的关注：安全性、内核模块、存储和可视化、企业级设备管理、Git 和自动化、网络和防火墙、服务器端和命令行、服务器（相对于基于客户端）的范围、故障排除以及\
  \ SELinux。\n\n考试分为五个不同的领域。接下来的页面列出了这些领域、每个领域的目标以及每个领域占考试的百分比：\n\n#### 1.0 硬件和系统配置（占考试的\
  \ 21%）\n\n1.1 解释 Linux 启动过程概念。\n1.2 给定场景，安装、配置和监控内核模块。\n1.3 给定场景，配置并验证网络连接参数。\n\
  1.4 给定场景，在 Linux 环境中管理存储。\n1.5 比较对比云和虚拟化概念及技术。\n1.6 给定场景，配置本地化选项。\n\n#### 2.0 系统运行与维护（占考试的\
  \ 26%）\n\n2.1 给定场景，进行软件安装、配置、更新和删除。\n2.2 给定场景，管理用户和组。\n2.3 给定场景，创建、修改和重定向文件。\n2.4\
  \ 给定场景，管理服务。\n2.5 总结并解释服务器角色。\n2.6 给定场景，自动化和调度作业。\n2.7 解释 Linux 设备的使用和操作。\n2.8 比较和对比\
  \ Linux 图形用户界面。\n\n#### 3.0 安全（占考试的 19%）\n\n3.1 给定场景，应用或获取适当的用户和/或组权限及所有权。\n3.2\
  \ 给定场景，配置并实施适当的访问和验证方法。\n3.3 总结 Linux 环境下的安全最佳实践。\n3.4 给定场景，实施日志服务。\n3.5 给定场景，实施并配置\
  \ Linux 防火墙。\n3.6 给定场景，备份、恢复和压缩文件。\n\n#### 4.0 Linux 故障排除与诊断（占考试的 20%）\n\n4.1 给定场景，分析系统属性并进行相应的补救。\n\
  4.2 给定场景，分析系统进程以优化性能。\n4.3 给定场景，分析并排除用户问题。\n4.4 给定场景，分析并排除应用程序和硬件问题。\n\n#### 5.0\
  \ 自动化和脚本（占考试的 14%）\n\n5.1 给定场景，部署并执行基础 BASH 脚本。\n5.2 给定场景，使用 Git 进行版本控制。\n5.3 总结编排过程和概念。\n\
  \n务必访问 CompTIA 的网页 `https://certification.comptia.org/certifications/linux` 以确保你获取了最新信息。\n\
  \n### 准备工作\n\n以下是一些需要记住的重要提示，以确保你准备好参加考试：\n\n![Images](img/square.jpg) **构建并使用跟踪器：**\
  \ 考虑使用本章所示的目标来构建自己的跟踪器。这种跟踪器可以帮助确保没有遗漏任何内容，并对考试充满信心。事实上，本书提供了一个学习计划。\n![Images](img/square.jpg)\
  \ **考虑考试的时间预算：** 当你进行计算时，你会发现平均每题有一分钟时间。虽然这听起来时间很多，但请记住很多题目非常简单，你只需要 15 到 30 秒。这为其他题目留出了额外时间。\n\
  ![Images](img/square.jpg) **关注时钟：** 考试期间定期检查剩余时间。如果你积累了大量的额外时间，你甚至可能发现自己可以大幅放慢速度。\n\
  ![Images](img/square.jpg) **准备耳塞：** 考试中心可能会提供耳塞，但以防万一，请准备好并携带。中心里可能有其他考生，你不希望被他们的尖叫声干扰。我个人对周围的声音没有意见，所以我从不担心，但我知道这对某些人来说是个问题。\n\
  ![Images](img/square.jpg) **规划通勤时间：** 留出额外时间寻找中心并签到。确保早到。随着你在特定中心测试次数的增加，你完全可以开始紧凑时间。\n\
  ![Images](img/square.jpg) **保证休息：** 大多数学生报告说，晚上充足睡眠可以提高成功率。通宵复习通常没有效果。在进入考场前，不要忘记吃根香蕉（补充烟酸）并喝大量水（水分充足的大脑考试表现更好！）。\n\
  ![Images](img/square.jpg) **带上贵重物品但准备好存起来：** 考试中心会收起你的手机、智能手表、钱包等物品，并为它们提供安全的地方。\n\
  \n\n\n\n\n![Images](img/square.jpg) **记笔记：** 你将获得笔记工具，不要害怕使用它们。我总会在考试中记下任何困扰我的问题。然后于考试结束时，我通过反复阅读笔记来记忆这些问题。我总是确保车里备有笔和纸，并在考试结束后立即在车里写下问题。当我回到家里——无论通过还是失败——我都会研究这些项目。\n\
  \n![Images](img/square.jpg) **练习题非常棒——请务必使用它们：** 本书提供了许多练习题。务必彻底过的这些题目。记住，你不应该盲目地背诵答案；而应该利用练习题真正地发现自己在知识上的薄弱环节，然后针对这些领域进行学习。\n\
  \n## 最后的准备工具\n\n本节列出了有关可用工具以及如何访问这些工具的信息。\n\n### Pearson Test Prep 练习测试软件及网站上的题目\n\
  \n注册此书以获取 `Pearson IT Certification` 测试引擎的权限（用于显示和评分一组模拟真实考试的多选题的软件）。使用 `Pearson\
  \ Test Prep` 练习测试软件，你可以通过在 `Study Mode`（学习模式）下过题目来学习，也可以参加模拟（限时）`CompTIA Linux+`\
  \ 考试。\n\n`Pearson Test Prep` 练习测试软件带有两份完整的练习考试。这些练习题可以通过在线形式或离线 Windows 应用程序提供给你。要访问与本书配套的练习考试，请参阅书后封套内卡片中的说明。该卡片包含一个唯一的访问代码，允许你激活\
  \ `Pearson Test Prep` 软件中的考试项目。\n\n### 在线访问 Pearson Test Prep 练习测试软件\n\n该软件的在线版本可以在任何带有浏览器和连接的设备上使用，包括台式电脑、平板电脑和手机。要开始在线使用练习考试，只需按照以下步骤操作：\n\
  \n第 1 步访问 `[`www.PearsonTestPrep.com`](http://www.PearsonTestPrep.com)`。\n\n第 2\
  \ 选择 `Pearson IT Certification` 作为你的产品组。\n\n第 3  输入你的账户邮箱和密码。如果你在 `PearsonITCertification.com`\
  \ 或 `CiscoPress.com` 上没有账户，你需要前往 `PearsonITCertification.com/join` 建立一个。\n\n第 4\
  \ 在 `My Products`（我的产品）选项卡中，点击 `Activate New Product`（激活新产品）按钮。\n\n第 5 输入书后封套卡片上打印的访问代码以激活你的产品。该产品现在将列在你的\
  \ `My Products` 页面。\n\n第 6 点击 `Exams`（考试）按钮启动考试设置界面并开始考试。\n\n### 离线访问 Pearson Test\
  \ Prep 练习测试软件\n\n如果你希望离线学习，可以下载并安装 Windows 版 `Pearson Test Prep` 软件。你可以在书籍配套网站上找到该软件的下载链接，或者直接在浏览器中输入此链接：\n\
  \n`[`www.pearsonitcertification.com/content/downloads/pcpt/engine.zip`](http://www.pearsonitcertification.com/content/downloads/pcpt/engine.zip)`\n\
  \n要访问配套网站和软件，只需按照以下步骤操作：\n\n第 1 步访问 `PearsonITCertification.com/register` 注册你的书籍并输入\
  \ ISBN `9780789760586`。\n\n第 2 步回答挑战性问题。\n\n第 3 步进入你的账户页面并选择 `Registered Products`（已注册产品）选项卡。\n\
  \n第 4 步点击产品列表下的 `Access Bonus Content`（访问额外内容）链接。\n\n第 5 步点击页面 `Practice Exams`（练习考试）部分的\
  \ `Install Pearson Test Prep Desktop Version`（安装 Pearson Test Prep 桌面版）链接下载软件。\n\
  \n第 6 步软件下载完成后，解压电脑上的所有文件。\n\n第 7 步双击应用程序文件开始安装，并按照屏幕上的指示完成注册。\n\n第 8 步安装完成后，启动程序并点击\
  \ `My Products` 选项卡上的 `Activate Exam`（激活考试）按钮。\n\n第 9 步在 `Activate Product Wizard`（激活产品向导）中点击\
  \ `Activate a Product`（激活产品）按钮。\n\n第 10 输入书后封套卡片上的唯一访问代码并点击 `Activate`（激活）按钮。\n\n\
  第 11 点击 `Next`（下一步），然后点击 `Finish`（完成）将考试数据下载到你的应用程序中。\n\n第 12 你现在可以通过选择产品并点击 `Open\
  \ Exam`（打开考试）按钮打开考试设置界面，开始使用练习考试了。\n\n注意，离线版本和在线版本是同步的，因此在一个版本上保存的考试和记录的成绩在另一个版本上也可用。\n\
  \n### 自定义你的考试\n\n当你进入考试设置界面时，你可以选择三种模式之一进行考试：\n\n![Images](img/square.jpg) `Study\
  \ Mode`（学习模式）\n\n![Images](img/square.jpg) `Practice Exam Mode`（练习考试模式）\n\n![Images](img/square.jpg)\
  \ `Flash Card Mode`（闪卡模式）\n\n`Study Mode` 允许你完全自定义考试，并在考试过程中查看答案。这通常是你第一个使用的模式，用于评估你的知识水平并识别信息缺口。`Practice\
  \ Exam Mode`（练习考试模式）会锁定某些自定义选项，以提供真实的考试体验。当你准备测试自己的备考情况时，使用此模式。`Flash Card Mode`（闪卡模式）会剥离答案，只向你展示题干。这种模式非常适合后期准备，当你真的想挑战自己，在没有多选题选项的情况下提供答案时。这种模式不提供另外两种模式提供的详细评分报告，因此它不是帮助你识别知识缺口的最佳模式。\n\
  \n除了这三种模式外，你还可以选择题目的来源。你可以选择涵盖所有章节的考试，也可以将范围缩小到单个章节或构成书中特定部分的章节。所有章节默认都被选中。如果你想将重点缩小到单个章节，只需取消选中所有章节，然后在\
  \ `Objectives`（目标）区域仅勾选你想要关注的章节。\n\n你还可以选择要关注的题库。每个题库都包含一份涵盖每个章节主题的完整考试试卷。你可以通过在题库区域选择所需的题库，让测试引擎提供来自两个题库的考试，或仅提供来自单个题库的考试。\n\
  \n你还可以在考试设置界面对考试进行其他几种自定义，例如考试允许时间、题目数量、是否随机化题目和答案、是否在多选题中显示正确答案的数量以及是否只提供特定类型的题目。你还可以通过仅选择你标记的题目或添加了注释的题目来创建自定义题库。\n\
  \n### 更新你的考试\n\n如果你使用的是 `Pearson Test Prep` 软件的在线版本，你应该始终能够访问最新版本的软件以及考试数据。如果你使用的是\
  \ Windows 桌面版本，每次启动软件时，它都会检查考试数据是否有更新，并自动下载自上次使用软件以来的任何更改。这要求你在启动软件时连接到互联网。\n\n\
  有时由于多种因素，考试数据在你激活考试时可能没有完全下载。如果你发现数据或图表丢失，你可能需要手动更新考试。\n\n要更新你已经激活并下载的特定考试，只需选择\
  \ `Tools`（工具）选项卡并点击 `Update Products`（更新产品）按钮。再次，这仅是 Windows 桌面应用程序的问题。\n\n\n\n\n\
  \n如果您想检查 Pearson Test Prep 考试引擎软件 Windows 桌面版本的更新，只需选择 `Tools` 选项并点击 `Update Application`\
  \ 按钮。这样做可以确保您运行的是最新版本的软件引擎。\n\n## 高级版 (Premium Edition)\n\n除了网站提供的免费模拟考试外，您还可以直接从\
  \ Pearson IT Certification 购买具有扩展功能的额外考试。该书的高级版包含额外的两份完整的模拟考试和一本电子版书（提供 PDF 和 ePub\
  \ 格式）。此外，高级版针对每个问题都提供了补救性说明，指向电子书中与该问题相关的特定部分。\n\n由于您购买了该书的质版，您可以以极低折扣购买高级版。书封内有一个优惠券代码，其中包含一次性使用的代码以及何处购买高级版的说明。\n\
  \n要查看高级版产品页面，请访问 [www.informit.com/title/9780135301371](http://www.informit.com/title/9780135301371)。\n\
  \n### 章节末复习工具\n\n从第 2 章到第 22 章，每个章节末尾的“考试准备任务”部分都有若干功能。您可能已经在每个章中使用过这些内容。在对考试进行最后的准备时，再次使用这些工具也会很有帮助。\n\
  \n### 最终复习/学习建议计划\n\n本节列出了从您读完第 22 章到参加 CompTIA Linux+ 考试期间的建议学习计划。您可以忽略此计划、直接使用它或仅参考其中的建议。\n\
  \n该计划涉及三个步骤：\n\n步骤 1. **复习关键主题和“我认识这些吗？”(DIKTA?)问题：** 您可以使用列出每章关键主题的表格，或者直接翻页寻找关键主题。此外，复习章节开头的\
  \ DIKTA? 问题对复习很有帮助。\n\n步骤 2. **复习“习题”章节：** 查看每个章节末尾的“习题”部分，以识别您需要更多学习的领域。\n\n步骤\
  \ 4. **使用 Pearson Test Prep 模拟测试软件进行练习：** Pearson Test Prep 模拟测试软件允许您使用一套仅限本书提供的、模拟真实考试的题库进行学习。\n\
  \n### 总结\n\n本章列出的工具和建议设计初只有一个目标：帮助您培养通过 CompTIA Linux+ 考试所需的技能。本书从开发之初，目的不仅是告诉您事实，更是为了帮助您学习如何应用这些事实。无论您在参加考试前的经验水平如何，我们都希望广泛的准备工具，甚至是本书的结构，能帮助您轻松通过考试。我们祝您考试中取得优异成绩。\n\
