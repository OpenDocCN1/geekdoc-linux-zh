  <output truncated, it's extremely long>\n```\n\n我们已经连接到 example.com 服务器，并请求查看其证书链（Certificate\
  \ chain），你可以在输出中看到，它位于加利福尼亚州洛洛矶矶，并由 ICANN 组织管理。\n\n### 其他实用的 s_client 命令\n\n由于任何有效的\
  \ OpenSSL 主机 s_client 模块的查询响应长度极长，我们将详细介绍几个关键命令及其解释，而不是花费大量篇幅来介绍你很快尝试这些命令时将会看到的输出。\n\
  \n#### 连接到主机后使用的命令\n\n![Images](img/key_topic_icon.jpg)\n\n通过 `s_client` 模块连接到另一个主机时，可以使用某些命令执行各种操作：\n\
  \n• `Q` – 结束 SSL 连接并退出命令\n• `R` – 重新协商 SSL 会话，仅限某些协议\n• `B` – 向系统发送心跳消息\n• `k` –\
  \ 向系统发送密钥更新（Key Update）消息\n• `K` – 向系统发送密钥更新消息，并请求系统返回密钥更新\n\n注意\n\n使用 `s_client`\
  \ 模块可以做**许多**其他事情，有些简单，很多非常复杂。阅读 `s_client` 手帮助页的内容比你想象的要多，也远比你 Linux+ 考试需要的多。\n\
  \n```\n$ man s_client\n```\n\n#### 为主机建立 SSL 连接\n\n要向主机建立 SSL 连接并获取**大量**有用信息，请使用命令：\n\
  \n```\n$ openssl s_client -connect example.com:443\n```\n\n你会有大量的输出，解析它们并注意查询是如何被响应的，你可以使用命令或直接退出会话。\n\
  \n#### 显示主机上的 SSL 证书\n\n要显示主机的完整证书链，请使用命令：\n\n```\n$ openssl s_client -connect example.com:443\
  \ -showcerts\n```\n\n你将看到列出的证书信息，只需解析它以获取更多关于主机及其证书的信息。\n\n#### 在主机上测试特定的 TLS 版本\n\
  \n有时你可能需要确保主机支持某个特定的 TLS 版本，仅查询该版本，请使用命令：\n\n```\n$ openssl s_client -connect example.com:443\
  \ -tls1_3\n```\n\n我知道我们说过不再有输出了，但你可能想从上一个查询中验证 SSL-Session 块中显示了正确的 TLS 信息，如 示例\
  \ 19-14 所示。\n\n**示例 19-14**–openssl s_client TLS 版本查询的输出\n\n```\n$ openssl s_client\
  \ -connect example.com:443 -tls1_3\nSSL-Session:\n    Protocol  : TLSv1.3\n    Cipher\
  \    : TLS_AES_256_GCM_SHA384\n    Session-ID:\n84BF20BB5699F250177C680D4A074B9DB7E8976099C1C6C5D6AF67A996D64\n\
  \    Session-ID-ctx:\n    Resumption PSK:\n13005B8986AB6F6B74E89CE87B9497FBA20241110AA3F67D4A58E9D83\n\
  ```\n\n注意，我们查询的 TLS 版本出现在查询响应的 Protocol 部分。\n\n### 总结\n\n在本章中，你学习了关于网络故障排除的所有知识，从子网和路由到防火墙问题，再到接口错误、“最终准备”以及\
