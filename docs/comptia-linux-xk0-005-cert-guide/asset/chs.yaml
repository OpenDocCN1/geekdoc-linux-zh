  \ 章 关键主题\n\n![Images](img/12tab02.jpg)\n\n### 定义关键术语\n\n定义本章的以下关键术语，并在术表中检查你的答案：\n\
  \n权限\n\n属性\n\n访问控制列表\n\n用户所有者\n\n组所有者\n\nchmod\n\nchown\n\nchgrp\n\numask\n\n八进制模式\n\
  \n符号模式\n\n特殊权限\n\nSELinux\n\nSELinux 上下文\n\nSELinux 模式\n\nSELinux 策略\n\nAppArmor\n\
  \nAppArmor 配置文件\n\nlsattr\n\nchattr\n\n### 复习题\n\n这些复习题的答案在 附录 A。\n\n**1.** 目录的执行权限提供什么类型的访问权限？\n\
  \n**a.** 在目录中列出文件名的权限\n\n**b.** 向目录中添加文件的权限\n\n**c.** 从目录中删除文件的权限\n\n**d.** 进入目录的权限\n\
  \n**2.** 考虑以下 `ls -l` 命令的输出：\n\n-rw-rwxr-x 2 ross users 0 Jan 26 13:08 22 test.mp3\n\
