  \ 只有读取和写入权限。\n\n**c.** 用户 ross 对 `test.mp3` 有读取、写入和执行权限。\n\n**d.** 用户 ross 对 `test.mp3`\
  \ 没有权限。\n\n**3.** 哪些 SELinux 上下文被应用于？（选择所有适用）\n\n**a.** 文件\n\n**b.** 用户\n\n**c.**\
