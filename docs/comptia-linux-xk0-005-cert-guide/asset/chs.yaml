  \ 所有之前的提交（commits）的状态\n\n## 基础主题\n\n## 文件格式\n\n基础设施代码（Infrastructure as Code）可以定义为：通过代码媒介对你的项目或公司基础设施进行可视化、设计、测试、修订、实施、运行、故障排除和管理的过程。\n\
  \n### YAML 不是标记语言 (YAML Ain’t Markup Language)\n\nYAML 是一种数据序列化语言，用于存储对象或对象状态的文本表示。YAML\
  \ 主要用于具有分层项格式的配置文件，非常对人类友好且易于阅读。\n\nYAML 还允许更大的功能集，并能够包含注释用于文档说明和清晰化。YAML 中的一组信息被称为“流”（stream），在一个特定的\
  \ YAML 文件中可以存在多个流。\n\n### YAML 的主要特征\n\n![Images](img/key_topic_icon.jpg)\n\nYAML\
  \ 具有一组特定的识别特征，使其与其他数据序列化语言或场景区分开来，这些包括：\n\n• 通常以 3 个连线如 `---` 开始。\n• 通常结束，或用 3 个点\
  \ `...` 显示流的结束。\n• 使用空格缩进作为结构，仅限空格，不使用制表符（tabs）。\n• 注释以 `#` 字符开始，持续到行尾（EOL），字符串内部除外（字符串内部是字面量）。\n\
  • 列表（普通）由前面的 `-` 字符表示，每行一个。列表也可以以内联形式显示为 `[item1,item2,item3]`。\n\n### YAML 流示例\n\
  \n你可以通过两种方式在 YAML 中显示列表项，首先是正常或常规方法，这种方法更明显是一个列表，但渲染时需要大量的垂直空间：\n\n```\n---\n# 喜欢的乐队\n\
  - The Psychedelic Furs\n- Accept\n- Dokken\n- Marty Friedman\n- Motorhead\n```\n\
  \n此列表也可以以内联方式表示：\n\n```yaml\n---\n# 喜欢的乐队\n[The Psychedelic Furs, Accept, Dokken,\
  \ Marty Friedman, Motorhead]\n```\n\n**注意**\n\n一位好朋友兼教学设计师喜欢在办公室穿他的 T 恤，上面写着：\n\n\
  ```\nYaml:\n      - Y: Yelling（大喊）\n      - A: At（对着）\n      - M: My（我的）\n     \
  \ - L: Laptop（笔记本电脑）\n```\n\n只是一个小幽默，但如果你稍微迷茫，而有人穿着这件衣服走进你的办公室，它也是一个很好的视觉辅助。\n\n\
  ### JSON Bourne\n\nJSON 被用作序列化数据。JSON 代表 JavaScript 对象表示法。它的格式比 YAML 简单，可以用于 API\
  \ 与其请求的应用程序或服务之间进行数据交换和传输。\n\nJSON 是 YAML 的子集，可以使用 YAML 解释器或解析器进行解析，因此你可以结合使用 YAML\
  \ 和 JSON 来满足你的模板需求。\n\nJSON 的另一个主要识别特征是：JSON 中所有的键和值都包含在“双引号”中。\n\n作者曾花几年时间处理 AWS\
  \ Cloud Formation 模板，这些模板大多用 JSON 编写，我并不怎么怀念它，数据中到处都是该死的引号，只要你漏掉一个不匹配的双引号，一切就会无法运行！\n\
  \n### JSON 的主要特征\n\n![Images](img/key_topic_icon.jpg)\n\nJSON 具有一组特定的识别特征，使其与其他数据序列化语言或场景区分开来，这些包括：\n\
  \n• 段落以左大括号 `{` 开始，以右大括号 `}` 结束。\n• 通常 JSON 语句从顶部最左侧的 `{` 开始，以底部最左侧的 `}` 字符结束。\n\
  • 允许使用制表符、空格、回车和换行符作为结构工具。\n• 不允许注释。\n• 列表由双引号中的字符串定义，后直接跟冒号，然后是左方括号，数据在新的一行缩进并以分号结尾，最后在新的一行以右方括号结束。\n\
  \n### JSON 示例\n\nJSON 常用于定义不同类型的对象，例如以下用于描述特定乐队的对象，正如我们在 示例 16-1 中所示：\n\n**示例 16-1\
  \ –** JSON 格式数据的示例\n\n```json\n{\n  \"Favorite Band\": {\n    \"name\": \"The Psychedelic\
  \ Furs\",\n    \"Begun\": 1977,\n    \"First Album\": \"The Psychedelic Furs\",\n\
  \    \"Soundtrack Credits\": \"Pretty in Pink, 1986\",\n    \"photo\": \" https://en.wikipedia.org/wiki/File:Psychedelic_Furs.jpg\"\
  ,\n        \"Albums\": [\n               \"The Psychedelic Furs\",\n           \
  \    \"Talk Talk Talk\",\n               \"Forever Now\",\n               \"Mirror\
  \ Moves\",\n               \"Midnight to Midnight\",\n               \"Book of Days\"\
  ,\n               \"World Outside\",\n               \"Made of Rain\"\n        ]\n\
  \  }\n}\n```\n\n我们还在 示例 16-1 中创建了一个数组，数组名称为 `\"Albums\"`，数组中的项是专辑名称。\n\n我相信，有了上述对\
  \ YAML 和 JSON 的解释、定义和示例，你在考试中会没问题的，你只需要对这些文件格式（或者说数据定义）有合理的了解即可满足目标。\n\n你真正需要了解它们是因为你将在基础设施代码的世界无限地遇到它们，用于各种配置和数据存储。\n\
  \n## 基础设施代码概念\n\n基础设施代码 (IaC) 可以定义为：通过代码媒介对你的项目或公司基础设施进行可视化、设计、测试、修订、实施、运行、故障排除和管理的过程。\n\
  \n**注意**\n\n基础设施代码中的“代码”一词指不是 C、C++、C#、汇编或 Java 等编程语言，而是指包含指令和设置的文本文件，这些设置使默认服务按照你想要的方式运行。\n\
  \n当然，并非所有基础设施都是代码，是代码（实际上是特定格式的文本）提供了从默认行为到软件配置、设置的修改。\n\n### 仅进行配置更改\n\n例如，你可以使用默认配置运行\
  \ NGINX Web 服务器，通过编辑配置文件并重启服务来进行更改，但这在实践中不是 IaC，这只是做了配置更改。\n\n即使是最简单的配置更改，只要规模足够（或有足够的系统进行更改），也会使你转向更易管理的方法，而\
  \ IaC 正是为此而生的。\n\n### 使用版本控制\n\n为了真正使用 IaC 概念，你需要将 NGINX 的配置文件作为 `Git` 仓库（或其他版本控制的一部分，这样你就可以启动服务或应用程序，注意其工作原理，对\
  \ IaC 文件进行任何更改，然后再次部署，这次就实施了更改。\n\n如果你还没有读过第 15 章 中关于所有 `Git` 的讨论，请去阅读，它会让本章末尾更高级的\
  \ Git 主题变得意义得多。\n\n### 拥抱 IaC 生活方式\n\n\n\n\n\n实现 IaC（基础设施即代码）梦想并不十分复杂，但有一些你应该考虑采取的步骤，这些步骤都将让你的方法更具可预测性，带来更好的结果，并整体节省时间。\n\
  \n## 开始使用 IaC\n\n对你所有想要用 IaC 运行的内容进行盘点，无论是你当前的（以及未来期望的）应用程序、后端服务、每个项目所需的所有配置，以及每一个应用程序的设置、配置以及任何可能导致其在多个系统中无法良好运行的其他文件。\n\
  \n那么，在完成上述工作后，你将考虑以下步骤：\n\n1. 始终尝试对所有内容使用版本控制，这使得修复错误变得只需几条快速命令和重启那么简单。\n2. 完全自动化一切。除了将一切自动化之外，不要进行任何手动操作。\n\
  3. 验证实施 IaC 时的绝对一致性。运行 50 次，每一次都应该得到完全相同的结果。\n4. 尝试尽可能让你的 IaC 模块化，这样对其中一个部分的更改就不会因为缺乏模块化而影响到许多其他部分。\n\
  5. 不要过度模块化，某些东西是应该放在在一起的。\n6. 进行上百次演练，甚至如此，进行上千次，这一切都应该是自动化的！\n7. 开发一种快速但彻底测试功能的方法。使用\
  \ `curl` 命令从服务获取结果，这是一种主要方法，可能甚至不需要输出，只要运行正常就输出一个“success”即可！\n\n接下来我们将讨论可以使用哪些工具来实现这种更高程度的自动化，并在某些实例中使给定状态不仅能够被创建，还能得到维护。\n\
  \n## IaC 工具实用哲学\n\n如今，IaC 工具已不再是随处可见，但它们的数量日益增加，这既是好事也是坏事。好的一面是你可以货货并找到适合你及你组织需求的工具，但随之而来的工具数量和哲学可能会令人困惑。\n\
  \n关于 IaC 工具最重要的概念是：这些工具是功能性的（Functional）还是过程性的（Procedural）。\n\n- **功能性 (Functional):**\
  \ 也称为声明式方法（Declarative Approach）。功能性关注于目标单元的实际配置应该是什么样。这并不是到达该目标的完整列表，而更多是对意图或最终状态的声明。\n\
  - **过程性 (Procedural):** 也称为命令式方法（Imperative Approach）。过程性是上述为了获得你所需的结果而需要运行或执行的步骤和命令集。\n\
  \n## IaC 工具选择\n\n让我们按顺序介绍这些，它们都非常棒，但每个工具都有其独特的特性，我们会予以说明。\n\n> 注意\n> Linux+ 目标没有提到所有的选项，但我们将关注它们提到的且会在考试中出现的选项。\n\
  \n## Ansible\n\n红帽是 Ansible 的开发商，它的创建是为了让他们需要做的事情变得更容易。红帽是一个产生创新想法的好地方，也是让某事物在社区中产生良好影响的绝佳平台。\n\
  \n`Ansible` 是一套 IaS（基础设施即服务）开源工具，用于处理置备、部署和配置管理的自动化。\n\n![Images](img/key_topic_icon.jpg)\n\
  \nAnsible 可以说是易于使用的（可能是选项中最简单的），并且足够灵活，可以完成你对系统和应用程序环境想要进行的大部分或全部操作。Ansible 使用 `playbooks`（剧本），你通过它们（以代码形式！）定义在创建所需的基础设施或启用你期望的最终状态时想要发生的事情。\n\
  \nAnsible 文档非常优秀，在下文中，我在 `Example 16-2` 中包含了一个 Ansible Playbook 示例：\n\n**Example\
  \ 16-2**–示例 Ansible Playbook\n\n```\n---\n- name: Update web servers\n  hosts: webservers\n\
  \  remote_user: root\n\n  tasks:\n  - name: Ensure apache is at the latest version\n\
  \    ansible.builtin.yum:\n      name: httpd\n      state: latest\n  - name: Write\
  \ the apache config file\n    ansible.builtin.template:\n      src: /srv/httpd.j2\n\
  \      dest: /etc/httpd.conf\n\n- name: Update db servers\n  hosts: databases\n\
  \  remote_user: root\n\n  tasks:\n  - name: Ensure postgresql is at the latest version\n\
  \    ansible.builtin.yum:\n      name: postgresql\n      state: latest\n  - name:\
  \ Ensure that postgresql is started\n    ansible.builtin.service:\n      name: postgresql\n\
  \      state: started\n```\n\n在 `Example 16-2` 中，你可以看到 Ansible playbook 的简单性，每一行的功能都极其显而易见。\n\
  \n例如，`- name` 定义了一个部分，例如“Update web servers”，定义了 `hosts: webservers` 以及执行此操作的用户\
  \ `remote_user: root`。\n\n一旦定义了主机和用户，`tasks:` 部分包含几组指令，一组确保 Apache (`httpd`) 更新到最新版本，另一组指令则利用\
  \ Ansible 完成文件操作的能力，将源文件从 `/srv/httpd.j2` 复制到目标路径 `/etc/httpd.conf`。\n\nplaybook\
  \ 的其余部分遵循同样的简单且非常易读的格式，这是 Ansible 的典型特征。\n\n## Puppet 和 Chef\n\n在谈论 Puppet 的同时，不可能不提到\
  \ Chef。它们可能是最老的工具（或者说当时的配置管理器），因为在我们想出诸如“基础设施即代码”等华丽的词汇之前，它们就是这样被称为的。\n\n### Puppet\n\
  \n![Images](img/key_topic_icon.jpg)\n\n`Puppet` 是一个声明式工具，正如本书前面提到的，声明式工具基本上描述了你希望某个事物处于的状态，但将实际步骤留给其他工具。Puppet\
  \ 的配置以 JSON 或 YAML 构建，包含在简单的文本文件中。\n\nPuppet 用户应该熟悉 JSON 和 YAML 以及编辑配置文件，但这并不是真正的编程，你也不需要具备那种技能才能胜任并与\
  \ Puppet 工作。\n\n### Chef\n\n![Images](img/key_topic_icon.jpg)\n\n相反，`Chef` 是命令式工具的绝佳示例，你可以自由地指定事情将如何发生，以及你期望的最终状态是什么。Chef\
  \ 使用 Ruby 领域特定语言（DSL），你拥有 Ruby 语言可以做的一切。\n\nChef 积极使用烹饪术语，使用 `recipes`（食谱）、cookbooks（菜谱）以及被称为\
  \ Test Kitchen 的测试区域概念。\n\nChef 用户应该熟悉 Ruby，编程技能是一个很大的加分项，而且开发者似乎比其他人任何更熟悉 Chef。\n\
  \n## 为什么使用其中一个？\n\n人们为什么使用其中一个？有时是因为传统，已经选择了一个并在大多数时候坚持下去，可能是因为它运行得非常好且适合你的需求，或者有时是因为使用它比改变一切都要容易。\n\
  \n## SaltStack\n\n`Saltstack` 是一个非常有趣的工具，它功能强大且能力卓越，已被作为其他产品的基础，例如 SUSE Manager\
  \ 配置管理器的版本以及最近的 VMWare vRealize Automation Suite。\n\n> 注意\n> SaltStack 公司已被 VMWare\
  \ 收购，SaltStack 团队现在是 VMWare 内部 SaltStack 团队的一部分。Salt Open 方案（SaltStack 开源项目现在称为\
  \ Salt Project，但没有真正的区别，它就是你熟悉并喜爱的 Salt Open 或 Salt Project）。\n\n### Salt 架构\n\n\
  \n\n\n\n任何版本的 SaltStack 都由一组 Master/Minion（主/从）对组成。`Salt Master`（这是他们的说法，不是我的）是管理\
  \ Minion 系统的服务器，本质上就是客户端。\n\n![Images](img/key_topic_icon.jpg)\n\nSalt Masters 通过端口\
  \ 4505/4506 与 Salt Minions 通信，并由 `ZeroMQ` 消息库为 Salt 管理这一切。\n\n### Salt Master 选项\n\
  \nSaltStack 可以根据你的需求以多种方式运行：\n\n- **单 Salt Master (Single Salt Master):** 一个 Salt\
  \ Master，没有备份或故障备，与与其配置的 Salt Minions 通信。\n- **Salt Master 故障备 (Salt Master Failover):**\
  \ 两台 Salt Master 服务器，一台配置为活动或热备 Salt Master，另一台作为主服务器故障时的备用。\n- **主从 Master (Salt\
  \ Master of Masters):** 适用于那些拥有更具企业级或可扩展 Salt Master 集合的人群，你可以有一个“主 Master”，它拥有从属的\
  \ Salt Masters，每个 Master 都管理一组 Minions。（这可能适用于业务部门或组织内的角色。）\n\n此外，你还可以以无主（Masterless）模式使用\
  \ SaltStack，你只需要在系统上加载 Salt Minion，然后用它开发和测试你的 Salt States（状态）和程序，这通常不应该用于生产系统。\n\
  \nSalt Masters 由被称为 Salt States（Salt 状态）的文件提供，这些是以 `.sls` 结尾的文本文件，包含了 Salt 用于将 状态指令推送到\
  \ Salt Minions 的配置，Salt Modules（Salt 模块）将在那里执行所需的功能。\n\n### Salt 配置位置\n\nSalt 配置文件通常位于\
  \ `/etc/salt/` 目录，初始位置位于 `/etc/salt/master` 和 `/etc/salt/minion`。此外，那里还有常用的 `.d`\
  \ 包含目录功能（例如 `/etc/salt/conf.d`），因此放在那里的任何额外配置将在解析主配置后被读取。\n\n### Salt State 文件\n\
  \nSalt 文件根目录（Salt File Root）通常位于 `/srv/salt`，你会将 `.sls` 文件放在这里。\n\n`State file`（状态文件）实际上是一组指令，旨在当\
  \ Minion 从 Master 获取状态指令并通过远程执行模块（Remote Execution Modules）运行时，在 Minion 上产生特定的“状态”。\n\
  \n远程执行模块有非常多，它们通常是微小的指令执行程序，执行诸如向系统添加用户、安装请求的包、从 Salt Master 复制文件到 Salt Minion 等许多其他功能。\n\
  \n如何安装并保持 NGINX（最好的 Web 服务器！）运行的示例可见[示例 16-3]中的示例状态文件 `nginx_inst.xls`。\n\n**示例\
  \ 16-3** – NGINX 状态文件示例\n\n```\nnginx:\n  pkg:\n    - installed\n  service:\n  \
  \  - running\n    - watch:\n      - pkg: nginx\n      - file: /etc/nginx/nginx.conf\n\
  ```\n\n这个状态文件中发生的事情相对简单，让我们来逐行分析：\n\n- `nginx`: 这是你想要影响的包或服务的名称\n- `pkg`: 告诉 Salt\
  \ 系统这是一个包，而是一个文件\n- `- installed`: 告诉 Salt 应该安装此包\n- `service`:  Salt 这是一个系统服务\n\
  - `- running`: 这将导致 Salt 保持服务运行\n- `watch`: 通知 salt 观察或监控后续的内容\n- `- pkg`: 如果 NGINX\
  \ 包更新，则重启服务\n- `- file`: 如果 `nginx.conf` 文件发生更改，则启动重启\n\n这足以让你对 SaltStack 产生兴趣，或者让你能够轻松回答在考试中遇到的任何问题。\n\
  \n我建议你去查阅 SaltStack 文档，或者看看 A Cloud Guru (Linux Academy) 在他们网站上的优秀 SaltStack 课程，那里的主\
  \ SaltStack DevOps 导师是一位非常优秀的老师，她真的能为你拆解得很透彻。\n\n### Terraform\n\n`Terraform` 可以说是\
  \ Linux+ 目标中涵盖的许多选项中较新且更难的一个。会有很多人人教你如何**做** Terraform，但很少有人能告诉你**为什么**选择 Terraform\
  \ 而不是其他那些“心理上更容易理解”的 IaC（基础设施即代码）选项。让我们看看是否能做到这一点。\n\nTerraform 是使用声明式使用 IaC 的精髓，精髓在于你只需要告诉它你想要的结果是什么，而工具将负责处理如何实现。\n\
  \n这让你能够专注于构建你的基础设施，而无需纠结于实现它而需要运行的每一个步骤或命令。\n\n### 它就简单如……\n\n![Images](img/key_topic_icon.jpg)\n\
  \n使用 Terraform 有三个主要阶段，它们是：\n\n1. 编码 (Coding)\n2. 计划 (Planning)\n3. 应用 (Applying)\n\
  \n#### 编码\n\n当你处于编码阶段时，你正在创建包含你希望发生的情况的实际 `.tf` 文件。[图 16-1] 显示了一个包含三个元素的预期环境：几台虚拟机，每台虚拟机都包含一个\
  \ NGINX 服务器和一个 Kubernetes 集群，并连接在一起。\n\n![Description: 图形用户界面、文本、应用程序、聊天或文本消息 自动生成的描述](img/16fig01.jpg)\n\
  \n**图 16-1** 用于编码阶段的三元素环境。\n\n在[图 16-1]中，你看到了我们声明希望拥有的状态。\n\n`myenvironment.tf`\
  \ 文件将包含相对简单的指令，这些指令将导致 Terraform 创建这个预期的环境计划（Plan），并告诉你当发生最后阶段（即应用指令并实际生成和创建环境）时会发生什么。\n\
  \n注意\n\n创建我们所拥结果的环境文件太长了，无法在这里合理列出，而且远远超出了 Linux+ 目标要求我们涵盖的范围。那里有很多有效且实用的 Terraform\
  \ `.tf` 文件示例，包括来自 Terraform 自身的。\n\n#### 计划\n\n当你进入 Terraform 的计划阶段时，工具将获取你的代码或\
  \ `myenvironment.tf` 文件并运行它，让你知道在应用时会发生什么。\n\n这是一个非常好的事情，没有什么比你认为自己设置好了一个良好的环境，结果发现某些地方发生了糟糕错误，而且你不小心创建了\
  \ 1024 台虚拟机。\n\n要做到这一点，你将运行带有 `plan` 子命令的 `terraform` 命令，它将执行运行并生成实际的计划文件，同时通过与计划内容镜像的输出让你了解情况。\n\
  \n#### 应用\n\n应用的过程是指令 Terraform 取你让它生成的计划，然后在你的基础设施中应用该计划。\n\nTerraform 还有很多内容，所有这些都在我们在此所做的内容以及\
  \ Linux+ 目标之外，但至少你现在知道它是什么，以及它是如何运作的。\n\n### 持续集成/持续部署\n\n持续集成/持续部署，或者缩写为 `CI/CD`（在一个小时的课程上只需说这个词\
  \ 30 遍！），是指一个持续开发、修复、测试、发布的过程，该过程可以保持你的代码更新，并将最新的修复和测试过的代码投入生产环境。\n\n#### 问题是什么？\n\
  \n软件和环境已经变得如此多值且多层次，在某些情况下有几十到上百种不同的资源，因此你不仅应该尝试自动化某些内容，还应该尝试尽可能地自动化它，并经常进行审查。\n\
  \n编码方面的工作量没有太大变化，但如果没有大量的自动化，测试和部署的迭代次数和发生频率会迅速变得无法实现。\n\n#### 如何解决？\n\n\n\n\n\n\
  与其四处奔波手动对所有不同的应用程序进行开发、构建、测试和部署（可以将这些视为已发布的服务，例如使用多个资源提供该服务的“应用服务”Web 应用程序）。\n\n\
  ![Images](img/key_topic_icon.jpg)\n\nCI/CD 通常被形象化为一个三个步骤的过程，如图 16-2 所示。\n\n![Description:\
  \ 包含自动生成的时间线描述的图片](img/16fig02.jpg)\n\n**图 16-2:** 持续集成流程\n\n### 持续集成 (CI)\n\n当你恰当使用持续集成\
  \ (CI),时，你已经达到了这样状态：多个开发人员同时对你的基础设施或应用的不同部分、方面或模块进行工作，并且所有这些内容都定期地集成到主分支或代码集。。\n\
  \n与此同时，还会有自动化的（希望如此！）测试和构建程序，它们会检查已提交或提交的代码是否与构成应用程序下一次更新的其他许多部分协同工作。\n\n### 持续交付\
  \ (CD)\n\n字面上有两种略有不同的流程符合 CD 这个短语：\n\n*   **持续交付**，意味着在开发人员提交代码后，代码会经过测试并合并到主应用代码中，然后自动交付到仓库（通常是代码或包的集合）。如果持续集成阶段一切顺利，那么持续交付只需确保代码在下一步中可用，以便以自动化的方式让你的应用程序尽可能保持最新状态。\n\
  \n*   **持续部署**，意味着在代码交付到仓库后，它将作为应用程序更新或发布的一部分进入生产环境。这可能意味着从代码提交、自动化测试和构建到部署在生产系统之间仅需几分钟时间。虽然这种方式既令人兴奋又令人恐惧，但它是获取应用程序最新发布版本真实状态即时反馈的绝佳方法。\n\
  \n正如从图 16-2 所示，这一切很好地整合到了一种交付和部署方法论中。这种方法论提高了团队和组织修复、构建、测试并让用户和客户使用软件的速度和可靠性，往往远比手动方法所能想象的要快。\n\
  \n### CI/CD 用例\n\n试图列出成千上万可能的持续集成用例（作为一种处理应用环境以及团队协作工作的方法论）显得有些不诚实。\n\n此时，几乎任何启动新项目的公司或项目都应该考虑使用持续集成，但现在许多现有甚至遗留项目在使用某种形式的\
  \ CI/CD。\n\n你可能会被问及 CI/CD 的一些典型用例，可能包括：\n\n*   Web 应用程序\n*   金融服务\n*   购物网站\n* \
  \  游戏应用\n*   社交媒体应用\n\n任何具有开发、测试和生产环境的项目都可以从 CI/CD 方法论中获益，因此用例列表实际上可能涵盖 Github 上托管的大多数项目，例如！\n\
  \n### 高级 Git 主题\n\n这一小节旨在解释 Git 世界中几个面向驱动的命令：merge（合并）、rebase（变基）和 pull requests（拉请求）。\n\
  \n#### merge\n\n![Images](img/key_topic_icon.jpg)\n\nGit 使用`merge` 命令作为合并分支历史的一种。当你创建了独立的开发线（也称为分支）后，你可以将这些分支重新合并在一起，创建一个单一的统一分支。`merge`\
  \ 命令允许你以向前的方式合并分支。\n\n#### rebase\n\n![Images](img/key_topic_icon.jpg)\n\nGit 使用`rebase`\
  \ 命令的方式与 `merge` 命令略有不同，`merge` 是向前移动，而 rebase 则允许你创建一个新的基提交。\n\n实际上，rebase 允许你更改分支的基础，使得新分支似乎来自一个完全不同的提交。\n\
  \n作为另一种可视化方式，请考虑一个由多个作者编写并包含数百条修订记录的 Word 文档。你可能想将该基础文档保存为新版本，并剥离所有修订记录，从一个干净的基础文档开始开始。\n\
  \n这与 rebase 的作用非常相似，它允许你声明一个分支为“这就是我想从这个新分支开始的地方”，从那里起实际上是一个全新的分支，不再受到可能存在的数百个提交历史项的负担。\n\
  \n#### pull requests\n\n![Images](img/key_topic_icon.jpg)\n\n`Pull Request (PR)`\
  \ 是一种机制，贡献者通过它通知 Git 仓库的维护者想要提交某些代码/更改等进行评审。\n\n从贡献者的角度来看，发布 Pull Request 告诉服务器你有一些未评审的本地提交，正将其提交给维护者评审并可能集成到此仓库中。\n\
  \nPull Request 是那些对仓库内容感兴趣的人获取提交的绝佳方法，而无需成为维护者，或通过 SSH 密钥获取对仓库的权限。\n\n### 总结\n\n\
  在本章中，我们努力帮助你理解持续集成/持续交付的概念，以及最后一步：持续部署。\n\n你还了解了非常重要的数据语言或格式：`YAML` 和 `JSON`。你现在甚至意识到了\
  \ Git 的高级功能，如 `merge`、`rebase` 以及广流行的 Pull Requests。\n\n### 考试准备任务\n\n正如引言中“目标与方法”部分提到的，你有几种准备考试的选择：这里的练习、`Chapter\
  \ 23`、`Final Preparation`，以及 Pearson Test Prep Online 中的考试模拟题。\n\n### 复习所有关键主题\n\
