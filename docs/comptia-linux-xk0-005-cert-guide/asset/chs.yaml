  Install  312 Packages\n\nTotal download size: 312 M\nInstalled size: 706 M\nIs this\
  \ ok [y/N]: Downloading Packages:\nInstalled:\n  R-3.5.1-1.fcXX.x86_64\n  perl-File-ShareDir-1.116-3.fcXX.noarch\n\
  \  perl-List-MoreUtils-0.428-4.fcXX.noarch\n  perl-Params-Util-1.07-25.fcXX.x86_64\n\
  \  java-1.8.0-openjdk-1:1.8.0.191.b12-8.fcXX.x86_64\n  java-1.8.0-openjdk-devel-1:1.8.0.191.b12-8.fcXX.x86_64\n\
  \  java-1.8.0-openjdk-headless-1:1.8.0.191.b12-8.fcXX.x86_64\n  perl-XML-XPath-1.43-1.fcXX.noarch\n\
  \  perl-open-1.11-424.fcXX.noarch\nComplete!\n... output omitted ...\n```\n```示例\
  \ 6-9 中的输出显示 `yum` 计算了依赖关系，下载了所有需要的包并安装了它们。\n\n### 注意事项\n示例 2-7 中 `yum` 事务的输出从原始的近\
  \ 2000 行返回文本经过大幅精简。如果你正在记录这些升级/更新，请注意日志文件可能会变得非常大！\n\n### 注意事项\n`yum` 命令通常不使用连字符或双连字符，而\
  \ `rpm` 命令则会使用。然而，接下来的我们将介绍一些显著的例外，例如 `-y` 选项，它可以有效地为安装问题提供所需的答案，从而实现自动化。\n\n如果你想跳过确认安装的步骤，只需添加\
  \ `-y` 即可，如示例所示：\n\n```\n# yum -y install foo\n```\n可以只下载包而不安装它们。有几种方法可以实现这一点：\n\
  \n-   在 `y/d/N` 提示时，回答 `d`（下载）而不是 `y`（是）。\n-   使用 `yum install --downloadonly` 代替普通的\
  \ `yum install`。\n-   使用 `yumdownloader` 代替 `yum`。\n\n`yumdownloader` 命令的行为与 `yum\
  \ install` 类似，不同之处在于你有更多可的选项：\n\n-   `source:` 下载源 RPM 而不是二进制 RPM\n-   `urls:` 显示文件的\
  \ URL 而不是下载它们\n-   `resolve:` 修改命令以包含任何缺失的依赖项\n-   `destdir:` 指定文件存储的位置\n\n####\
  \ 获取更新\nYUM 知道从哪里获取新包以及系统上当前有什么包，因此它也可以计算哪些包已经过时。升级一个包只需要 `yum update *package_name`，因此\
  \ `yum update tcpdump` 会更新 `tcpdump` 包以及任何依赖项。\n\n你可以通过 `yum check-update` 检查任何过时的包，并单独使用\
  \ `yum update` 升级整个系统。\n\n#### 查找要安装的包\n你可以通过不同的方式搜索远程仓库。如果你知道包的名字，可以使用 `yum list`：\n\
  \n```\n# yum list tomcat\nLast metadata expiration check: 0:08:45 ago on Mon 26\
  \ Nov 2018\n11:31:19 AM EST.\nAvailable Packages\ntomcat.noarch      1:9.0.10-1.fcXX\n\
  fedora\n```\n可以拆分为单独组件的包通常作为共享共同前缀的单独包分发。假设你想查看可以向 Tomcat 添加哪些组件。你可以在 `yum list`\
  \ 命令中使用通配符运算符，如 示例 6-10 所示。\n\n**示例 6-10**–列出匹配通配符的包\n\n```\n# yum list tomcat*\n\
  Last metadata expiration check: 0:09:01 ago on Mon 26 Nov 2018 11:31:19 AM EST.\n\
  Available Packages\ntomcat.noarch                          1:9.0.10-1.fcXX     \
  \      fedora\ntomcat-admin-webapps.noarch         1:9.0.10-1.fcXX           fedora\n\
  tomcat-docs-webapp.noarch           1:9.0.10-1.fcXX           fedora\ntomcat-el-3.0-api.noarch\
  \            1:9.0.10-1.fcXX           fedora\ntomcat-javadoc.noarch           \
  \     1:9.0.10-1.fcXX           fedora\ntomcat-jsss.noarch                     \
  \  7.3.5-1.fcXX             fedora\ntomcat-lib.noarch                     1:9.0.10-1.fcXX\
  \           fedora\ntomcat-native.x86_64                  1.2.17-2.fcXX        \
  \    fedora\ntomcat-servlet-4.0-api.noarch       1:9.0.10-1.fcXX           fedora\n\
  tomcat-taglibs-parent.noarch        3-8.fcXX                   fedora\ntomcat-taglibs-standard.noarch\
  \      1.2.5-6.fcXX           fedora\ntomcat-webapps.noarch                 1:9.0.10)\n\
  ```\n最后，如果你知道你需要一个 Web 服务器但不确定选哪一个，可以使用通用搜索，如 示例 6-11 所示。\n\n**示例 6-11**–根据概念搜索\
  \ YUM 仓库\n\n```\n# yum search “web server”\nLoaded plugins: fastestmirror, langpacks\n\
  Loading mirror speeds from cached hostfile\n * base: repo.miserver.it.umich.edu\n\
  \ * extras: repo.miserver.it.umich.edu\n * updates: repo.miserver.it.umich.edu\n\
  =========================== N/S matched: web server\n============================\n\
  libcurl.i686 : A library for getting files from web servers\nlibcurl.x86_64 : A\
  \ library for getting files from web servers\npcp-pmda-weblog.x86_64 : Performance\
  \ Co-Pilot (PCP) metrics from web server\nlogs\npython-paste.noarch : Tools for\
  \ using a Web Server Gateway Interface stack\npython-tornado.x86_64 : Scalable,\
  \ non-blocking web server and tools\nxbean.noarch : Java plugin based web server\n\
  \n  仅匹配名称和摘要，使用“search all”。\n```\n\n#### 配置 YUM\n`yum` 的主配置文件是 `/etc/yum.conf`。其中包含了\
  \ `yum` 的全局选项以及所有仓库的一些默认值。你很少需要编辑此文件，但当你试图弄清文件存储在哪里时，它确实包含很有用的信息。示例 6-12 显示了默认的\
  \ Fedora 配置。\n\n**示例 6-12**–CentOS 的默认 **yum.conf** 配置\n\n\n\n\n\n```\n[main]\n\
  cachedir=/var/cache/yum/$basearch/$releasever\nkeepcache=0\ndebuglevel=2\nlogfile=/var/log/yum.log\n\
  exactarch=1\nobsoletes=1\ngpgcheck=1\nplugins=1\ninstallonly_limit=5\nbugtracker_url=http://bugs.centos.org/set_project.php?project_id=23&\n\
  ref=http://bugs.centos.org/bug_report_page.php?category=yum\ndistroverpkg=centos-release\n\
  \n#  这是默认值，如果你将其调大，yum 将无法检测远程元数据\n#   是否有更新，因此你虽然“节省”了下载新元数据的\n#  # 带宽，但付出的“代价”是\
  \ yum 无法获取正确的\n#  # 信息。\n#  对于像 Fedora 这样的发行版，拥有正确的元数据非常重要，\n#  因为它们不保留旧软件包。如果你不喜欢这种检查中断\n\
  #   你的命令行使用，那么每小时手动检查一次元数据\n#  #（yum-updatesd 会完成此任务）要好得多。\n# metadata_expire=90m\n\
  \n# 将你的仓库放在这里，或者放在名为 file.repo 的独立文件中\n# 在 /etc/yum.repos.d 中\n```\n\n在 示例 6-12\
  \ 中，你可以看到所有缓存文件都存储在 `/var/cache/yum` 下，日志文件为 `/var/log/yum.log`。选项的完整列表可以在 `yum.conf`\
  \ 的帮助页找到。\n\n仓库配置文件存储在 `/etc/yum.repos.d` 中。每个文件可能包含多个仓库，但你会发现仓库是根据功能分组的。例如，主发行版仓库位于一个文件中，同时还有源包仓库和调试符号仓库。另一个文件包含更新仓库、更新源以及更新的调试符号仓库。\n\
  \n单个仓库的配置看起来如 示例 6-13 所示。\n\n**示例 6-13**——来自 CentOS 的单个仓库配置\n\n```\n# CentOS-Base.repo\n\
  #\n# 镜像系统使用客户端的连接 IP 地址和每个镜像的\n# 更新状态来选择已更新且地理位置距离\n# 客户端最近的镜像。除非你手动选择其他镜像，否则\n\
  # 你应该使用它进行 CentOS 更新。\n#\n# 如果 mirrorlist= 对你不起作用，作为回退，你可以尝试\n# 注释的 baseurl= 行。\n\
  #\n#\n\n[base]\nname=CentOS-$releasever - Base\nmirrorlist=http://mirrorlist.centos.org/?release=$releasever&arch=$base\n\
  arch&repo=os&infra=$infra\n#baseurl=http://mirror.centos.org/centos/$releasever/os/$basearch/\n\
  gpgcheck=1\ngpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-7\n\n# 已发布的更新\n[updates]\n\
  name=CentOS-$releasever - Updates\nmirrorlist=http://mirrorlist.centos.org/?release=$releasever&arch=$base\n\
  arch&repo=updates&infra=$infra\n#baseurl=http://mirror.centos.org/centos/$releasever/updates/$basearch/\n\
  gpgcheck=1\ngpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-7\n\n# 可能有用的额外软件包\n\
  [extras]\nname=CentOS-$releasever - Extras\nmirrorlist=http://mirrorlist.centos.org/?release=$releasever&arch=$base\n\
  arch&repo=extras&infra=$infra\n#baseurl=http://mirror.centos.org/centos/$releasever/extras/$basearch/\n\
  gpgcheck=1\ngpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-7\n```\n\n在 示例 6-13\
  \ 中，注意有几个选项以美元符号 ($) 开头。这些是在调用 `yum` 时展开的占位符。`$releasever` 变成发行版版本，`$basearch` 变成硬件架构，例如\
  \ x86_64。\n\n仓库要么有一个 `baseurl`（指向仓库的链接），要么有一个 `metalink`（返回仓库的镜像列表）。（镜像将负载分散到由不同公司托管的许多服务器上。）\n\
  \n配置中一个重要的指令是 `enabled`。当你运行 `yum` 命令时，只有已启用的仓库会被搜索。你可以通过在 `yum` 命令中添加 `--enablerepo\
  \ reponame` 来启用某个仓库。\n\n隐藏仓库是有帮助的，因为它可以让你访问更广泛的软件包，而不需要你手动配置仓库。例如，你可以隐藏调试符号仓库，除非你确实需要调试符号（例如在尝试追踪程序崩溃原因时）。你还可以在需要时访问前沿软件，但默认安装更受信赖的软件。\n\
  \n### Dandified YUM\n\n![图像](img/key_topic_icon.jpg)\n\n包管理器世界最近新增的工具之一是 DNF (Dandified\
  \ YUM) 工具，它在 Fedora 18 中首次亮相，旨在作为下一代 YUM 包管理器。\n\nDNF 在命令行和选项方面（大部分情况下）与 YUM 兼容，被认为比传统的\
  \ YUM 稍微更容易配置，并且在运行过程中使用的系统资源更少，这对于大型更新或包管理操作来说可能非常重要。\n\n总的来说，DNF 被认为比 YUM 更可靠、更一致，它基于更高版本的\
  \ Python，并使用了比 YUM 更高效的算法。这些原因加上对 YUM API 文档的担忧，使得 DNF 成为未来的选择。\n\n### zypper\n\n\
  `zypper` 通常用于指代 ZYpp 或 libzypp 包管理引擎，但 `zypper` 是该引擎的命令行界面，而不是真正的包管理器。为了清晰起见，当我们泛指整个\
  \ ZYpp/libzypp 包管理器时，我们使用 ZYpp；当引用命令和实际命令行工具时，我们使用 `zypper`。\n\nZYpp 主要用于 openSUSE\
  \ 和 SUSE Linux Enterprise 产品线；其他几几个发行版（如 Ark 和 Tizen）也使用了 ZYpp/libzypp 包管理方案。\n\n\
  用户与 ZYpp/libzypp 方案的大部分交互都是通过 `zypper` 命令完成的，让我们来看几个带有适当选项的常用命令。\n\n![图像](img/key_topic_icon.jpg)\n\
  \n`zypper` 命令在功能上比 `rpm` 命令更强大，并且在许多方面与 Debian 的 APT 包管理套件类似。它可以帮助你在软件包数据库或仓库中搜索软件包（本章稍后会讨论），对现有软件进行更新，并处理许多其他功能。它是\
  \ SUSE 系统上 YaST 模块等图形化实用工具的伴侣。\n\n#### 使用 zypper 安装软件软件包\n\n要列出可能安装的软件源，使用 `zypper\
  \ list repositories` (`zypper lr`) 命令产生类似于图 6-3 所示的输出。此输出显示了你可以从中安装软件的已配置仓库。\n\n\
  ![描述：自动生成的计算机描述截图](img/06fig03.jpg)\n\n**图 6-3**——`zypper lr` 命令输出\n\n要刷新配置仓库的元数据（以获取最新的仓库信息），使用\
  \ `zypper ref` 命令。该命令返回元数据更改列表，这些更改将留在系统中，以便与仓库交互以及执行你选择的任何安装或更新，如图 6-4 所示。\n\n\
  ![图像](img/06fig04.jpg)\n\n**图 6-4**——`zypper ref` 命令输出\n\n要在仓库中启动搜索特定软件包，使用 `zypper\
  \ se vim` 命令。返回的输出将包含任何字符串 `vim` 的匹配项，这无疑包含 gvim 软件包，你可以在图 6-5 的列表中看到它。\n\n![描述：自动生成的计算机描述截图](img/06fig05.jpg)\n\
  \n**图 6-5**——`zypper se vim` 命令输出\n\n\n\n\n\n`zypper` 搜索输出会显示返回的软件包是否已安装；输出第一列中的小写\
  \ `i` 表示已安装。\n\n要在系统上安装 gvim 软件包，请使用 `zypper in gvim` 命令，如图 6-6 所示。\n\n![Description:\
  \ 自动生成的计算机描述的截图](img/06fig06.jpg)\n\n**图 6-6**–安装 gvim 软件包\n\n`zypper` 命令从仓库获取所需的软件包，并告知用户将发生什么。它通常要求用户输入\
  \ `y` 以同意下载并安装该软件包以及 `zypper` 识别出的任何依赖项。一旦用户回答了此提示，软件包就会下载并安装，控制台会显示已完成操作，如图 6-7\
  \ 所示。\n\n![Description: 自动生成的计算机描述的截图](img/06fig07.jpg)\n\n**图 6-7**–确认软件包下载和安装\n\
  \n### 使用 zypper 移除软件包\n\n一旦安装了软件包，可以使用 `zypper rm gvim` 命令轻松将其移除。\n\n再次，系统会提示需要\
  \ `y` 回答，以确保确实要从系统中移除或卸载该软件包。\n\n### 管理仓库\n\n软件仓库可以有多种形式，最常见的是网络可访问的软件集合（通常是 RPM\
  \ 软件包文件和附带的元数据），在想要访问其内容的机器上配置为仓库。\n\n仓库可以是官方且支持的，例如通过 SUSE Linux Enterprise (SLES)\
  \ 订阅提供的仓库；官方但不受支持的，例如作为 openSUSE 项目的一部分进行配置和维护的仓库；以及第三方的，例如非常有趣且实用的 Packman 仓库。Packman\
  \ 是 openSUSE 和 SLES 发行版可用最大且最多化的额外软件集合；它包含多媒体应用程序、第三方驱动程序等等。\n\n### 列出系统上的仓库\n\n\
  列出系统上配置的仓库非常简单：使用 `zypper lr` 命令：\n\n```\n# zypper lr\n```\n\n### 添加仓库\n\n要添加仓库，你首先需要列出所有仓库，然后通过网络搜索或其他方法确定你想要添加的仓库。为了说明，本节展示了如何向我们的测试系统添加非\
  \ oss（non-oss）仓库；非 oss 意味着该仓库包含并非严格开源软件的软件包，例如 Opera 浏览器。\n\n要向系统已配置的仓库集添加仓库，命令遵循以下格式：\n\
  \n```\n# zypper ar <uri> <alias>\n```\n\n`zypper` 命令使用 `ar` 指令来添加仓库，网络可访问的 `<uri>`\
  \ 基本上是系统用于查询和下载软件包及元数据的 URL。其后是 `<alias>`，它是用于引用该仓库的友好名称。\n\n要向系统添加适用于 Leap 15.0\
  \ 的 non-oss 仓库，请使用此命令：\n\n```bash\n# zypper ar\nhttp://download.opensuse.org/distribution/leap/15.0/\n\
  repo/non-oss/ Non-OSS\n```\n\n仓库已添加到系统中，并且系统会显示关于该仓库的一些有用信息，如图 6-8 所示。\n\n![Description:\
  \ 自动生成的计算机描述的截图](img/06fig08.jpg)\n\n**图 6-8**–添加仓库\n\n### 刷新仓库\n\n为了获取有关仓库的最新信息（你应该在查询或从仓库安装之前对所有仓库执行操作），请使用\
  \ `zypper ref` 命令，如图 6-9 所示。\n\n![Description: 自动生成的计算机屏幕消息描述](img/06fig09.jpg)\n\
  \n**图 6-9**–刷新仓库\n\n必须接受新仓库，并且将软件包签名密钥存储在本地；当你回答 `y`（仅此一次）或 `a`（始终信任此仓库）时，`zypper`\
  \ 会处理这些。选择 `a` 是一个好主意，如图 6-10 所示。\n\n![Description: 自动生成的计算机描述的截图](img/06fig10.jpg)\n\
  \n**图 6-10**–接受新仓库并在本地存储软件包签名密钥\n\n如图 6-10 中的输出所示，仓库已被查询，其信息已下载，并已准备好作为安装和更新源使用。\n\
  \n### 沙箱应用程序\n\n为了理解本节，你必须首先熟悉沙箱（sandboxing）的概念。对某个软件进行沙箱处理是指使其在一个由开发者或管理员可配置的限制空间内执行，同时最大限度地减少对主机操作系统的任何伤害。\n\
  \n![Images](img/key_topic_icon.jpg)\n\n#### 什么是沙箱应用？\n\n这条路径上的进一步一步是应用程序沙箱，即将应用程序打包在一起，以便将其分发给用户运行，而无需后端系统访问权限，并在对其从主机操作系统中读取或可访问的内容受到非常严格的控制下运行。\n\
  \n沙箱应用程序通常不需要 root 权限即可下载和运行，对主机操作系统的访问是可调的，并且通常包含运行所需的任何依赖项。\n\n有很多种竞争性的沙箱实现，但它们都具有相似的特征或目标：\n\
  \n- 与发行无关\n- 易于打包应用程序\n- 包含依赖项的能力\n- 对操作系统进行极少或无修改\n- 无需安装\n- 普通用户权限\n- 简单运行和使用\n\
  - 在发行版之间可移植\n- 限制资源访问的能力\n\n取决于你选择哪种应用程序沙箱方案，你将获得更多或少的上述特征。\n\n#### 应用沙箱方法\n\n![Images](img/key_topic_icon.jpg)\n\
  \n当我们谈论沙箱方法时，有几种方法，但 Linux+ 考试特别关注三种：\n\n- Flatpak\n- AppImage\n- Snapd\n\n让我们顺序讨论这些内容，以便你了解它们的作用、涉及的组件，并能够在考试中通过特征或使用模式辨认出它们。\n\
  \n##### Flatpak\n\n独特的是，Flatpak 来自于 X 桌面组 (XDG)，因此其灵感与其他另外两者不同，但目标相似，即让普通用户能够以最少的麻烦、权限或访问问题对应用程序进行打包、分发和运行。\n\
  \nFlatpak 使用一个名为 Flathub 的仓库，该仓库位于 [flathub.org](http://flathub.org)，是用户获取应用程序最可能的地方，因此它也是\
  \ Flatpak 开发者获取应用程序以供这些用户使用的目的地。\n\n使用 Flatpak 应用程序的用户需要授予某些权限，以便这些应用程序可以使用网络和音频资源。Flatpak\
  \ 应用程序甚至可以独立于其安装的发行版进行更新。\n\n##### AppImage\n\n最初名为 klik（正如鼠标点击吗？）的 AppImage 在 2013\
  \ 年重命名后脱颖而出，它的目标是实现二进制兼容、独立于任何单一发行版且不影响底层主机，并且可以直接运行和使用。\n\nAppImage 打包的应用程序本身并不是安装的，而是一个通过使用\
  \ FUSE（或用户空间文件系统）软件接口挂载的镜像，以便可以运行。\n\n\n\n\nAppImage 应用是自包含的，包含了运行应用程序所需的库，运行这些应用程序非常简单，不会更改本地主机（localhost），并且关闭后会将它们从进程表中移除并卸载\
  \ AppImage 应用的 ISO 镜像。\n\n## Snapd\n\n与其他两种候选或方法相比，`Snapd` 或 `Snap`（通常常称）来自 Canonical\
  \ 公司，这是一家与 Ubuntu 密切相关的公司。在我们讨论的所有应用程序沙箱方法中，它像是一个完整的生态系统，有厂商支持，并旨在为普通用户和系统用途提供应用程序的一站式服务（尽管在程度上有所不同）。\n\
  \n`Snap` 指的是整个方案，而 `snaps` 是此类软件包应用程序的称呼，`snapd` 是用于获取、运行和管理这些应用程序的实用程序。\n\n值得注意的是\
  \ Snap Store（Snap 商店），Canonical 在那里管理提交的 `snaps` 或应用程序，并进行如恶意软件和病毒检查等操作。\n\n`snaps`\
  \ 也有某些独特之处，它们可以访问其他 `snaps` 的资源，并使用了一种名为“门户”（Portals）的概念，允许 snaps 访问配置的一组主机系统资源。\n\
  \n## 系统更新\n\n更新或升级软件包的理念在本章较早已经介绍过，因此我们将简要关注更新 Linux 内核这一更具体的概念和实践。\n\n### 更新内核\n\
  \n你为什么要更新你的内核版本？有很多种原因，其中包括：\n\n• 提高稳定性\n• 安全问题\n• 硬件驱动程序的进展\n• 提高效率\n• 新功能\n\n\
  无论更新内核的原因是什么，它都有几种实现方式，这完全取决于系统的关键性。如果该系统是桌面系统、测试系统或非生产系统，更新它会简单得多，因为你不需要中断大量用户，也不会导致组织停机，你只需要在软件包升级后后重启系统即可。\n\
  \n但是，如果你的系统是生产服务器呢？如果内核更新或升级后重启这台服务器会造成巨大的中断怎么办？\n\n这些都是重要的问题，幸运的是有答案，请继续阅读关于这两种方法的讨论，以及为什么你会选择其中一个而不是另一个。\n\
  \n### 选择更新方法\n\n更新内核主要有几种方式：\n\n• 完全替换内核（必须重启）\n• 通过对运行中的内核进行补丁（不涉及重启）\n\n我们将涵盖这两种方法，从涉及重启的各种更新方式开始。然后我们将介绍实时补丁（live\
  \ patch）选项，也称为热补丁（hot patch），无论哪种方式内核保持运行并替换其部分，而无需停止内核或重启。\n\n虽然第二方法有助于保留用户连接并保持系统运行时间，但在某些情况下，实时补丁或热补丁将无法作用，此时你仍然需要重启。使用实时补丁或热补丁最可能的原因是修复零日漏洞的安全更新，或者必须立即应用以修复已知漏洞。\n\
  \n### 使用重启的方法\n\n更新内核有几种需要重启的主要方式，从简单的软件包更新开始。\n\n#### 手动更新（Manual Update）\n\n在最简单的情况下，这将是你执行以下步骤：\n\
  \n1. 访问 `kernel.org`(http://kernel.org) 并找到最新版本的稳定内核\n2. 将此软件包文件下载到你的系统\n3. 解压它，并根据你使用的打包工具，直接运行软件包的安装程序\n\
  4. 等安装完成后\n5. 重启系统并检查是否有任何错误\n\n显然，这不是最推荐的选项，但它是可行的，可以为你的系统获得一个更新后的内核。\n\n内核更新需要额外下载并安装软件包的概率有多大？几乎是肯定的，而且这种方法并不是一种愉快或高效的体验。不建议这样做，如果执行，仅适用于那些迫切需要更多故障排除经验的人，因为通过这种方式你会学很多。\n\
  \n#### 使用软件包管理器更新（Update with Package Manager）\n\n更有可能且远不“冒险”的路线是使用系统上的软件包管理器更新内核，这有几个很好的因素支持它：首先，你将遵循发行版维护者提供的路径，而且你使用的内核经过了打包并可能经过定制，这些定制有助于它与你发行版的其他部分匹配。\n\
  \n这实际上是更新内核的合理方法，但人们经常由于使用过于通用或范围过大的命令而意外地更新了整个发行版，如下所示。\n\n在 Ubuntu 系统上，要从配置的仓库获取最新软件包信息，请使用命令：\n\
  \n```\n# sudo apt-get update\n```\n\n这将用最新信息刷新所有配置的仓库。然后你可以使用命令升级整个发行版，包括内核：\n\n\
  ```\n# sudo apt-get ugrade\n```\n\n然而，如果你只想更新内核，通常可以使用这条命令：\n\n```\n# sudo apt-get\
  \ upgrade linux-image-generic\n```\n\n#### Linux 内核工具（Linux Kernel Utilities）\n\n\
  我想让你考虑最后的方法是 Linux 内核工具，这是一个包含 3 个脚本的集合，你可以用它们更新内核、按你的要求编译并根据需要删除旧内核。\n\n这三个脚本是：\n\
  \n• `compile_linux_kernel.sh`\n• `update_ubuntu_kernel.sh`\n• `remove_old_kernels.sh`\n\
  \n显然，这是用于我们的 Ubuntu 。许多其他发行版有多种方法，为了固定这一概念，我们将重点放在 Ubuntu 上。\n\n你可以从 Mark Tompkins\
  \ 的 Github 页面获取 Linux 内核工具的副本：\n\n**步骤 1.** 打开终端提示符\n\n**步骤 2.** 使用 `mkdir ~/test`\
  \ 创建测试目录\n\n**步骤 3.** 使用命令拉取 Linux 内核工具：\n\n```\n# git clone\nhttps://github.com/mtompkins/linux-kernel-utilities.git\n\
  ```\n\n**步骤 4.** 进入 `~/test/linux-kernel-utilities` 目录并使用命令更改权限：\n\n```\n# chmod\
  \ 750 *.sh\n```\n\n**步骤 5.** 然后执行 `git pull`\n\n**步骤 6.** 然后运行编译脚本列出所有可用内核\n\n**步骤\
  \ 7.** 使用命令安装最新内核：\n\n```\n# ./compile_linux_kernel.sh --latest\n```\n\n**步骤 8.**\
  \ 使用命令安装更新后的内核：\n\n```\n# ./update_ubuntu_kernel.sh\n```\n\n**步骤 9.** 重启系统\n\n或者，你可以使用带有\
  \ `--latest` 选项的脚本从 Ubuntu 内核仓库获取预编译的内核版本：\n\n```\n# ./update_ubuntu_kernel.sh --latest\n\
  ```\n\n**步骤 10.** 最后，你可以使用删除脚本移除旧内核：\n\n```\n# ./remove_old_kernels.sh\n```\n\n\
  到此结束了你应该了解的需要重启的方法，当然，市面上还有其他可以使用的方法，但遵循你的发行版供应商或维护者的建议可能是一个好主意，他们提供有些非常棒的工具，如 UKUU\
  \ 和 UKtools，但那些不是你需要的。\n\n### 无重启的方法（No Reboot Methods）\n\n当然，你会希望了解何时最好进行完全更新并重启，以及何时最好现在修补漏洞并让系统继续运行提供服务。\n\
  \n##### 实时内核补丁概述\n\n大多数主流发行版都有实时补丁场景，每种方案对过程以及哪些工具最好都有自己的见解，但在进入细节之前，让我们先了解这里正在的操作。\n\
  \n\n\n当你对活动或运行中的内核进行补丁时，几乎总是为了应用安全修复或更新。由于缺乏可用性，系统停机可能是昂贵的，会导致你的组织出现合性问题；你可能与客户有协议，或者被要求维持特定的运行时间和服务更新比例，这使得长时间的重启周期和服务停机窗口变得毫无吸引力甚至代价高昂。\n\
  \n## 在线补丁的问题\n\n只要修复或更新相对较小，在线补丁就非常有意义。但当内核结构、数据结构或处理方式发生变化时，在线补丁可能从非优选择变为完全无法实现。\n\
  \n换句话说，如果为了安全或保护系统而需要进行的更改是广泛或全面的，在线补丁可能根本无法实现，你只能回到更新并重启的模式。\n\n## 在线补丁流程\n\n让我们关注\
  \ Ubuntu 或 Canonical 的方法，以便我们有一个可以遵循的流程。\n\nCanonical 提供了 Livepatch 服务，它可以自动使用任何补丁或修复程序更新系统内核，而无需重启系统。\n\
  \n该选项的注意事项之一是，你需要安排或记住使用以下命令定期更新系统包信息：\n\n```\n# sudo apt-get update\n```\n\n你必须注意内核更新何时可用，并使用以下命令启动补丁：\n\
  \n```\n# sudo apt-get upgrade\n```\n\nSUSE 有一个名为 `KLP`（`Kernel Live Patching`）的服务，其功能与\
  \ Canonical 的产品类似，但集成程度更高。两者都需要连接正确的更新存储库，而 SUSE 版本要求你向 SUSE 客户中心注册系统，你也可以使用 SUSE\
  \ Manager 系统管理产品作为媒介。\n\n要检查并查看是否安装了在线补丁，请使用命令：\n\n```\n# zypper se --details kernel-livepatch-*\n\
  ```\n\n系统将向你显示任何安装的 livepatch 包，你可以从那里做出补丁决定。\n\n你还可以通过以下命令确定补丁状态或已安装的补丁：\n\n```\n\
  # klp -v patches\n```\n\n如你所见，考虑对内核进行在线补丁有充分理由，但并不适用于所有情况。在线补丁就像驾驶滑翔，早晚你必须落地并重新开始，就像你的系统早晚需要一次强制重启的更新。\n\
  \n## 总结\n\n在本章中，你学习了许多关于软件包、包管理、使用沙箱应用程序以及如何更新你的软件包和内核的知识。\n\n这些都是非常棒的技能，你需要对这些选项和额外的命令功能进行扎实的研究，特别是在这个领域，要多做实验！这在现实世界中非常有帮助，当然在考试中也是如此。\n\
  \n## 考试准备任务\n\n正如引言中“目标和方法”部分提到的，你有几种准备考试的方案：这里的练习题、第 23 章、“最终准备”以及 Pearson Test\
  \ Prep 在线软件中的考试模拟题。\n\n## 回顾所有关键主题\n\n回顾本章中最重要的主题，这些主题在页面外边页用“关键主题”图标标记。表 6-2 列出了这些关键主题及其所在的页码。\n\
