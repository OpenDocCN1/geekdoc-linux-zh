  - 容器仓库\n\n本章涵盖的考试目标如下：\n\n**目标 3.5:**总结容器、云和编排概念。\n\n从包含的子主题数量来看，你可能会认为这个目标和章节有整本书那么大！在创建该目标时，它被设计为容器和网格概念的概括性内容。\n\
