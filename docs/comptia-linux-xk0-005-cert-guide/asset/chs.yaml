  \n## 定义关键术语\n\n定义本章的以下关键术语，并在词表中检查你的答案：\n\nDNF\n\nDandified YUM\n\nYUM\n\nAPT\n\n\
  RPM\n\ndpkg\n\nrpm ZYpp\n\nzypper\n\nsandboxed\n\nsnapd\n\nflatpak\n\nAppImage\n\
  \n## 复习题\n\n这些复习题的答案在附录 A。\n\n**1.** 你下载了认为是 RPM 二进制包的文件，但当你安装它们时，并没有得到二进制文件。你可能误下载了什么？\n\
  \n**a.** 源 RPM\n**b.** 存储库\n**c.** 依赖项\n**d.** 库\n\n**2.** 你希望通过软件包安装新软件，当你发出安装命令时，必须完成一个漫长的预安装过程。哪项最能描述该过程？\n\
  \n**a.** 二进制文件完整性检查\n**b.** 应用程序依赖列表\n**c.** 软件库合并\n**d.** 下载存储库更新\n\n**3.** 在对软件包完整性进行验证时，每个被检查的包显示多少字段？\n\
  \n**a.** 5\n**b.** 7\n**c.** 9\n**d.** 11\n\n**4.** 在删除软件包时，你收到了错误，因为有同一个包的多个版本，你想一次性删除所有版本。哪个选项可以实现这一点？\n\
  \n**a.** --allfiles\n**b.** --allmatches\n**c.** --allsets\n**d.** --allpackages\n\
  \n**5.** 在运行沙箱应用程序时，你最可能需要访问以下哪个权限？\n\n**a.** 内存\n**b.** 网络\n**c.** 显示\n**d.** 键盘\n\
  \n**6.** 你需要能够通过 shell 会话通过安全加密连接连接到其他主机，并且无需每次都输入密码即可登录远程系统。以下哪项是直接实现此点的程序或工具？\n\
  \n**a.** `ssh-add`\n**b.** `ssh-keygen`\n**c.** `ssh-agent`\n**d.** `.ssh/authorized_keys`\n\
  \n## 第 7 章 管理软件配置 [此内容正在开发中。]\n\n此内容正在开发中。\n\n## II：安全 (Obj. 2.1 - 2.5)\n\n## 第\
  \ 8 章 理解 Linux 安全最佳实践\n\n本章涵盖了以下主题：\n\n• 管理公钥基础设施证书\n• 证书用例\n• 身份验证\n• Linux 加固\n\
  \n本章涵盖的考试目标如下：\n\n• **目标 2.1:** 总结 Linux 环境中安全最佳实践的目的和用途\n\n对于新手来说，进入安全领域可能是令人生畏的，而且\
  \ Linux 安全并不是一个容易掌握的主题，除非你有安全背景并且只是开始学习 Linux 技能。对于那些负责保护从单个 Linux Web 服务器或文件服务器到为数百万客户服务的巨大基础设施的一切的人来说，这是一组非常重要的主题！\n\
  \n本章有很多内容要介绍，从涉及公钥基础设施（PKI）的概念开始，一直到证书将如何使用。\n\n还有身份验证的整个主题，从令牌（Tokens）到可插式认证模块（PAM）和\
  \ SSSD，最后是 LDAP 和 SSO 或单点登录。\n\n最后，我们将进入令人着迷的 Linux 系统加固主题，我在给学生授课时用我版本的可可·香奈（Coco\
  \ Chanel）那句名言来总结：“出门前，照照镜子，脱掉一样。”\n\n正如我建议学生做的那样：“在离开安全的服务器之前，关闭任何你必不可少的服务。”\n\n\
  ### “我知道这些了吗？”测验\n\n\n\n\n\n“我是否已经知道这些？”测验可以让你评估自己是应该阅读整个章节，还是直接跳到“考试准备任务”部分进行复习。如果你不确定，请阅读整个章节。表\
  \ 8-1 列出了本章的主要标题以及对应的“我是否已经知道这些？”测验问题。你可以在附录 A 中的“‘我是否已经知道这些?’测验和复习题答案](#appa.xhtml_appa)”中找到答案。\n\
  \n**表 8-1**–“我是否已经知道这些？”基础主题章节与问题的映射\n\n![Images](img/08tab01.jpg)\n\n**注意**\n\n\
  自评估的目标是衡量你对本章主题的掌握程度。如果你不知道某个问题的答案，或者对答案只有部分把握，那么在进行自评估时，你应该将该问题标记为错误。对于你猜对的答案给自己记分会歪曲你的自评估结果，并可能给你一种虚假的安全感。\n\
  \n**1.** 你运营一个举报人网站，用于报告特定行业的欺诈和滥用行为，但无法获得中央机构颁发的证书。以下哪种情况最能描述你的证书机构状态？\n\n**a.**\
  \ 违规 (Rogue)\n\n**b.** 自签名 (Self-signed)\n\n**c.** 受保护的 (Protected)\n\n**d.** 已放弃的\
  \ (Resigned)\n\n**2.** 你的实习生来问你 SSL 和 TLS 之间的区别是什么，以下哪项是正确的？\n\n**a.** SSL 是 TLS\
  \ 的一部分\n\n**b.** SSL 已被 TLS 淘汰\n\n**c.** SSL 和 TLS 是竞争标准\n\n**d.** TLS 比 SSL 旧得多\n\
  \n**3.** 你在 PAM 配置目录中以文件形式启用了一个服务定义规则，突然注意到其他身份验证服务规则无法工作或明显缺失。问题所在？\n\n**a.** 你需要重启\
  \ PAM 守护进程。\n\n**b.** 你已经废用了 `/etc/pam.conf` 文件。\n\n**c.** 你需要重命名服务文件使其以 `.conf`\
  \ 结尾。\n\n**d.** 以上答案都不正确。\n\n**4.** 你被命令禁止主机 `snuffypc` 访问服务器上的 Telnet 服务，并使用 TCP\
  \ wrappers 文件和工具来实现这一目标。该条目应该放在哪个文件中以完成此任务？\n\n**a.** `/etc/hosts.deny`\n\n**b.**\
  \ `/etc/hosts.block`\n\n**c.** `/etc/hosts.disallow`\n\n**d.** `/etc/hosts.stop`\n\
  \n# 基础主题\n\n## 公钥基础设施\n\n公钥基础设施（PKI）是一套复杂的角色、程序和方法，用于提供公钥加密/解密服务，范围从双方之间的电子邮件、银行交易到\
  \ Web 上所有的电子商务活动。\n\n### 证书的用途\n\nPKIset 的主要目的是确保给定的证书（用于签名和识别实体）属于它所声称的实体并标识了该实体。\n\
  \n### 证书认证\n\n![Images](img/key_topic_icon.jpg)\n\n为了理解 PKI，让我们以开放网络作为示例。如果你打算从事商业、接受支付并处理人们的个人和（希望是）隐私信息，你可以尝试纯通过营销来说服所有人你有多么可信，也可以花时间和精力从管理机构获取证书，然后利用该证书来标识你的服务经过了适当的管理和保护。中央证书管理方案需要你与中央机构交互并信任它——并不是每个组织都会这样做。\n\
  \n### 自签名证书\n\n![Images](img/key_topic_icon.jpg)\n\n另一种使用 PKI 的方法是自签名，并在自签名者之间以及与其他之间建立信任网络，并缓慢建立可信的声誉。这实际上是\
  \ PKI 版本的口碑营销或合规性检查。这两种情况都有优点，也有缺点。\n\n### 证书机构\n\n使用中央证书机构的一个明显优势是，一旦被证书机构验证为可信，网站、服务或公司就可以很快地被即使是单个用户验证为是可赖的。这将是你看到自签名证书实际应用的地方，因为你的证书机构就是这些证书的权威！\n\
  \n中央机构的明显缺点是，如果你提供的产品或服务拥有中央机构不认可的客户，你可能无法获得证书并参与被认可为可信。那么，该实体将处于未签名状态，或者努力与其他类似的实体创建一个信任圈。\n\
  \n### 私钥\n\n私钥在 PKI 过程中始终与公钥成对。每个人都有一对由他们喜爱的工具生成的公钥和私钥，虽然每个人都可以并且应该让他们的公钥对他们想要通信的任何人开放，但私钥应对保持所有者之外的任何人完全无法访问。\n\
  \n### 公钥\n\n公钥在整个过程中的作用是，当有人想给你发送一条可以验证仅来自她个人的消息时，她将使用你的公钥和她的私钥对该消息进行签名或加密；然后将其发送给你。\n\
  \n你可以使用另一个用户的公钥和你的私钥来解密消息，如果你已经验证了另一个用户的公钥确实是她的（例如通过查看证书机构或在她的网站上找到公开公布的），那么你就可以确定消息是来自她而不是来自第三方。\n\
  \n过程大致是这样的：\n\n假设 Rebecca 有她的公钥和私钥，并想要加密文件发送给 Robert。她使用她的私钥和 Robert 的公钥加密文件，然后发送给\
  \ Robert。\n\nRobert 要么已经验证了 Rebecca 的公钥，要么正在验证，然后使用他的私钥和她的公钥来解密消息。\n\n正是加密者的私钥和解密者的公钥的组合创建了加密文件，只有解密者的私钥才能解密用公钥加密的文件。\n\
  \n这有些简单了，但对于本书的范围和 Linux+ 考试来说这已经足够了。\n\n### 加密与哈希\n\n![Images](img/key_topic_icon.jpg)\n\
  \n刚刚描述的加密概念和实践是一个双向过程。加密某些物品的另一种方法涉及`哈希或使用`消息摘要`，这允许你有效地对对象运行数学函数以推导出哈希和。然后，任何其他在对象上运行相同数学或哈希计算的人都会得到相同的数字。\n\
  \n供应商在发布公开的 RPM 和 DPKG 包文件供用户下载和使用以补补系统时，实际上会使用这种方法。如果没有验证这些包是真实且未被更改的方法，应用它们将是不智的。供应商对包进行哈希处理并发布哈希值，当用户下载包时，运行相同的哈希计算，如果他得到的和与供应商相同，他就知道文件没有被更改过。如果他得到不同的和，就不应该信任该包，而应该向供应商报告问题，并从供应商源重新获取包文件并再次计算。\n\
  \n### 数字签名\n\nPKI 概念的另一个例子是数字签名。PKI 可用于对文档进行权威签名，例如劳动合同或服务合同，而文档永远不需要以纸质形式存在或进行物理签名。\n\
  \n\n\n\n\n数字签名服务的典型示例是 DocuSign，它允许你上传文档，然后邀请某人查看并签署该文档（完全通过电子化完成），并且你可以完全信任签署后的文档在法律上等同于物理签署的文档。\n\
  \n## 证书用例\n\n本节内容比预想的要短，因为某些用例在上一个主题中已经过，例如证书身份验证和加密。我们需要涵盖 SSL 和 TLS 之间的区别，以及为什么这种转变对于公共和私有互联网的安全非常重要。\n\
  \n![Images](img/key_topic_icon.jpg)\n\n安全套接层 (SSL)和传输层安全协议 (TLS)是超文本传输安全协议（HTTPS）背后的技术。HTTPS\
  \ 允许 Web 客户端服务器以安全的方式建立连接。在访问敏感数据的 Web 服务器（如银行网站或在线购物网站）上，启用这些技术至关重要。用户可能会登录的仅包含信息的网站也应该启用这些技术以保护用户账户数据。这些技术还用于确保\
  \ Web 客户端访问的是正确的 Web 服务器，而不是伪装成真实网站的恶意 Web 服务器。\n\n安全套接层（SSL）曾是 Web 交易安全的唯一标准，但传输层安全协议（TLS）现在包含了\
  \ SSL。TLS 最初开发作为一种允许浏览器和服务器之间安全传输信息的安全协议，而这种安全层现在被认为是公共互联网上合格网络用户的必备要素。浏览器会话中 SSL\
  \ 加密的一个标志是地址栏 URL 左侧明显的挂锁图标，它在会话正常建立时会显示。\n\n## 身份验证\n\nLinux 已经远离了仅使用本地 `/etc/passwd`\
  \ 或用户数据库文件的时代，这其中的一个关键原因是可插拔或可交换的身份验证选项概念，我们在这里涵盖其中许多内容，特别是 Linux+ 考试中的内容。\n\n###\
  \ 多因素身份认证\n\n![Images](img/key_topic_icon.jpg)\n\n通过多因素身份认证 (MFA)，用户必须提供多项证据来证明其身份。一种常见的多因素身份认证方法称为双因素身份认证，或\
  \ 2FA。对于这种方法，用户需要提供两种形式的身份识别，可能包括以下内容：\n\n• 用户所知的\n• 用户所拥有的\n• 用户所属的（生物特征）\n\n另一种常见的多因素方法是双步身份认证。这要求用户执行主身份验证（例如提供用户名和密码），然后从另一个源提供额外信息（例如身份验证令牌）。\n\
  \n本节涵盖了与多因素认证相关的各种主题。\n\n#### 令牌 (Tokens)\n\n`token`(#ch08.xhtml_key11-a)是由硬件设备或软件程序生成的唯一值（通常是数字或字母数字值）。令牌通常持续自动生成，并且通常只在短时间内有效，例如\
  \ 30 秒。\n\n###### 硬件令牌\n\n硬件令牌是由硬件设备生成的令牌。它通常是一个非常小的设备，例如钥匙扣（key fob）。硬件令牌可能具有额外的身份验证方法，例如指纹扫描器，但这种情况比较罕见。\n\
  \n###### 软件令牌\n\n软件令牌是由程序生成的令牌。一个常见的例子是移动设备上的应用程序。\n\n#### OTP\n\n一次性密码（OTP）是一种经常包含在双因素认证中的身份验证技术。它也是在用户丢失或忘记密码时可以使用的一种技术。\n\
  \n#### 生物识别\n\n生物识别利用了多因素身份认证中“用户所属的”部分。指纹扫描、虹膜扫描和基于其他生物数据的识别可用于验证用户的身份。\n\n####\
  \ RADIUS\n\n远程认证拨号接入服务（RADIUS）是一种允许客户端系统利用服务器来验证用户身份协议。该服务在集中位置提供 AAA（身份验证、授权和审计）管理。\n\
  \nRADIUS 通常与 TACACS+ 进行比较，但了解这些协议之间的区别超出了 Linux+ 考试的范围。重要的是，你要意识到 RADIUS 可以在安全策略中提供非常强大的功能，因为它集中了\
  \ AAA 管理。此外，你应该意识到 RADIUS 比 TACACS+ 更具厂商无关性。\n\n#### TACACS+\n\n终端访问控制器访问控制系统（TACACS+）是一种允许客户端系统利用服务器来验证身份用户的协议。该服务在集中位置提供\
  \ AAA（身份验证、授权和审计）管理。\n\nTACACS+ 通常与 RADIUS 进行比较，但如前节所述，了解这些协议之间的区别超出了 Linux+ 考试的范围。重要的是，你要意识到\
  \ TACACS+ 可以在安全策略中提供非常强大的功能，因为它集中了 AAA 管理。此外，你应该意识到 TACACS+ 是由 Cisco 开发的，并不像 RADIUS\
  \ 那样具有厂商无关性。\n\n#### LDAP\n\n![Images](img/key_topic_icon.jpg)\n\n轻级目录访问协议 (LDAP)是一种提供目录服务信息的协议。LDAP\
  \ 可以提供用户账户信息，但它没有提供 RADIUS 和 TACACS+ 的完整 AAA 功能。LDAP 通常也存储与其他用户账户不直接相关的信息，例如主机名。\n\
  \nLDAP 可以验证用户，但在考虑安全策略时，你应该意识到 RADIUS 和 TACACS+ 更健壮的解决方案。例如，LDAP 没有提供 RADIUS 和 TACACS+\
  \ 等协议提供的 AAA 中的审计部分。\n\n#### 可插拔身份认证模块 (PAMs)\n\nLinux 已经远离了仅使用本地 `/etc/passwd`\
  \ 或用户数据库文件的时代，其关键原因是可插拔身份认证模块，也称为 PAMs。\n\nPAM 被大量的 Unix/Linux 系统用于身份验证，确保任何数量的应用程序、服务等使用统一的通用方案或方法。另一种方法是让每个应用程序或服务都有自己的身份验证方法。\n\
  \nPAM 是可插拔的，这意味着系统管理员甚至发行版的开发者可以决定何时使用哪些方法，且此人可以添加机制，而不必一定替换现有服务和应用程序的所有身份验证后端服务。\n\
  \nPAM 并非独立工作；它需要感知 PAM 的应用程序和服务才能正常工作。得益于设计非常良且实现良好的应用程序编程接口（API），应用程序程序员可以在其程序中插入极少代码，以利用系统中\
  \ PAM 的服务。\n\n##### 密码策略\n\n默认情况下，Linux 要求密码长度至少为六个字符，在当今高计算能力和计算集群的世界中，这简单得令人发笑。手动暴力破解一个六位密码可能需要多年时间，但如果使用合理的机器人组或超级计算机，大约需要四到五小时。\n\
  \n\n\n\n\n密码以及影响（以及，某种意义上是实施！）认证策略的其他身份验证特定文件是 `/etc/pam.conf` 文件和 `/etc/pam.d`\
  \ 目录。本节重点介绍 DPKG/Debian 系统示例，通过快速 Google 搜索可以很容易将其转换为 RPM 系统。\n\n![Images](img/key_topic_icon.jpg)\n\
  \nPAM 默认使用 `/etc/pam.conf` 配置文件，服务的配置按照遵循以下格式的行或规则进行布局：\n\n```\nservice  type  control\
  \  module-path  module-arguments\n```\n\nPAM 配置规则的字段如下：\n\n- `service:`：受影响的应用程序或服务的名称，例如\
  \ `su` 或 `login`。\n- `type:`：由 `account`、`auth`、`password` 和 `session` 选项组成，这些类型区分并控制用户访问服务时不同种类的需求。例如，`auth`\
  \ 类型通过密码提示确认用户身份是否如其表现的那样，并处理组和其他权限的授予。\n- `control:`：此项决定当模块无法成功建立身份验证时发生的情况。配置发生在括号中的\
  \ `key:value` 集合里。选项包括 `required`（如果身份验证失败则拒绝访问）、`requisite`（将访问推回给整个应用程序）、`sufficient`（可以在允许身份验证仍然发生的情况下发生失败）以及\
  \ `optional`（如果失败，则不会对身份验证产生负面影响）。\n\nPAM 还可以使用位于 `/etc/pam.d` 目录下的服务配置文件，每个文件都是特定服务的配置。在这种情况下，服务名称就是该文件（全小写）的名称。\n\
  \n### 密码长度\n\nPAM 规则的一个示例是管理密码长度的规则。在 Linux 系统上设置 10 字符的密码长度要求只需编辑 `/etc/pam.d/common-password`\
  \ 文件并修改以下行即可：\n\n```\npassword [success=2 default=ignore] pam_unix.so obscure sha512\n\
  ```\n\n使其读取为：\n\n```\npassword [success=2 default=ignore] pam_unix.so obscure sha512\n\
  minlen=10\n```\n\n请特别注意空格，并确保完全复制此行，否则可能会报错。\n\n### LDAP 集成\n\n为了设置 PAM 的 LDAP 集成，必须配置并提供可用的\
  \ LDAP 服务器，并且必须在身份验证服务器的 PAM 配置中安装并可用 `pam_user_map` 模块。\n\n集成的结果是你配置 LDAP 身份验证，然后选择是允许系统上的用户的身份验证仅通过\
  \ LDAP 源发生，还是允许本地或 LDAP 身份验证。\n\n这是一个复杂的课题，虽然这是一个值得追求的领域，但它超出了本书和 Linux+ 考试的范围。\n\
  \n### 用户锁定\n\nPAM 的另一个重要功能是配置用户或密码锁定策略的能力，本质上是通过让系统在达到超时期之前停止允许后续密码尝试，来停止暴力破解密码猜测。\n\
  \n设置 10 分钟超时的示例涉及通过编辑 `/etc/pam.d/system-auth` 文件，在 `auth` 行中添加以下文本：\n\n```\nauth\
  \ required pam_tally2.so deny=3 unlock_time=600\n```\n\n这要求同一用户在三次密码尝试失败后发生 10 分钟的超时。这种措施将显著减慢任何暴力破解系统的破解尝试。\n\
  \n### `/etc/pam.d` 目录\n\n对于简单的系统，`/etc/pam.conf` 文件应该足够配置 PAM，但在具有许多不同服务和更复杂配置的复杂系统上，`/etc/pam.d`\
  \ 目录是另一个选择。\n\n![Images](img/key_topic_icon.jpg)\n\n使用 `/etc/pam.d` 目录或在该目录下存在服务文件会导致\
  \ PAM 跳过对 `/etc/pam.conf` 文件的使用，因此请注意，即使 `/etc/pam.d` 中只有一个服务文件也会使 `pam.conf` 文件中的任何配置失效。\n\
  \n`/etc/pam.d` 目录包含遵循 `/etc/pam.conf` 文件行通用格式的文件（称为规则）。主要区别在于，`/etc/pam.conf` 文件有一行以\
  \ `service` 开头，而在 `/etc/pam.d` 目录中，服务规则文件名就是服务的名称，且每个文件仅配置该服务。\n\nPAM 的另一个很棒的功能是它允许配置规则的堆叠或分层，任何堆叠规则的失败都会导致身份验证失败，从而保护系统。\n\
  \n### `pam_tally2` 和 `faillock`\n\nPAM 系统的骨干之一是 `pam_tally2` 模块，它作为单独模块或共享对象（`.so`）提供，旨在确保暴力攻击失败以保持系统安全。该模块旨在计算访问尝试的次数，引用任何配置的超时时间，确保遵守这些超时时间，并在成功访问后重置任何失败尝试计数器。\n\
  \n关于锁定的一个重要说明是，root 用户通常未配置为通过远程手段（如 SSH）访问系统，因此在默认锁定配置中，root 用户不受影响，因为这意味着登录多次多次的\
  \ root 用户将实际上从控制台被锁定在系统之外——\n\n此过程配套的实用程序是 `faillock` 命令，它允许系统操作员查询、显示并对 `pam_faillock.so`\
  \ 模块在每个用户列表中保留的失败尝试进行必要的更改。\n\n例如，你可能使用此命令查询名为 `snuffyg` 的用户的失败尝试记录：\n\n```\n$ faillock\
  \ -user snuffyg\n```\n\n如果用户有太多的失败尝试且目前正处于超时状态，你可以将用户的失败尝试重置为零，并给用户一个新的开始。\n\n###\
  \ SSSD\n\nSSSD 或系统安全服务守护进程（System Security Services Daemon）是 PAM（可插身份验证模块）的扩展，它允许以集中且有目的的方式提供并访问多种可能的身份验证源。\n\
  \nSSSD 通常用于允许用户通过给定的身份验证方法访问一种资源，通过配置的异构身份验证方法访问另一种资源。\n\n这的一个示例可能是对系统用户使用本地身份验证，而对那些需要该身份验证源的系统或资源使用配置的\
  \ Active Directory 远程身份验证源。\n\nSSSD 实际上是一个代理或一站式商店，当配置多个源时，它将允许对各种资源进行相对无缝的身份验证和访问。\n\
  \nSSSD 闻名的属性（你可能需要在考试中识别它们！）包括：\n\n- 单一身份存储源：SSSD 有助于减少多个身份验证源带来的性能问题，同时通过通用框架增加可用源。\n\
  - 在线和离线身份验证选项：在离线时本地缓存身份验证令牌或证明，然后使用该令牌或信息进行协商并更新令牌，对于拥有大量远程用户的人来说是一个非常有用的选项。\n\
  - 更平滑的 Kerberos 和 SSO：使用 Kerberos 进行单点登录将通过使用离线缓存配置选项变得更容易。\n\n图 8-1 显示了作者关于 SSSD\
  \ 如何工作的概念，我们也简要解释一下。\n\n\n\n\n\n在图 8-1 中，你会发现请求者或客户端进程（如 `ssh` 和 `passwd`）将被配置为向各自的\
  \ `Responder` 发起请求，每种方法对应一个。这些 `Responder` 将与 `/etc/sssd/sssd.conf` 及其相关包含目录配置的\
  \ `SSSD Monitor` 进行交互，并由 `SSSD Cache` 备份。当系统离开后端身份提供者时，这将有助于通过 `Kerberos` 和单点登录（Single\
  \ Sign On）进行验证。这些后端身份提供者随后通过 `sssd_be` 或后端提供者（Backend Provider）由相应的插件提供服务，后者接收身份验证请求并将其与相应的源匹配，同时协调请求和响应。\n\
  \n简而言之，客户端进程发出通常请求，而 `SSSD` 进程及其助手会在大多数情况下无论在线还是离线都能完成任务。\n\n## 单点登录 (SSO)\n\n![Images](img/key_topic_icon.jpg)\n\
  \nSSO 或单点登录 是允许用户不仅登录单个系统或服务，而且登录到一个由多个连接且可能同步的数据服务组成的环境的方法。\n\n在最简单的情况下，SSO 的工作原理是在应用程序中设置一个代理，该代理将请求并存储用户的身份验证详情，并在用户访问环境中的各种已配置服务时代表该用户进行操作。\n\
  \n有多种可能的 SSO 提供者，市场上不断有新的提供者。\n\n其中一些提供者包括：\n\n• Microsoft\n• OAuth\n• OpenID\n\
  • MiniOrange\n• Auth0\n• Okta\n• Ping\n\n单点登录对于当今的 SaaS（软件即服务）环境至关重要，因为这些环境中提供的不仅是一项服务，而是由几个到多个服务组合或融合而成的，为用户提供集成且全面的整体服务。\n\
  \n## Linux 加固\n\nLinux 系统的加固是一个多层次的场景，没有某一种单一的方法可以完全保护 Linux 系统免受攻击，除非将其拔掉插头或取出电池使其无法通电……\n\
  \n你可以采取活动之一是使用 `nmap` 命令、`nc` 或 `netcat` 等工具扫描系统的漏洞。还有其他活动，事实上有很多，但概念才是我们能传达给你的最重要的内容，因此让我们谈谈如何探测并获取你系统的信息。\n\
  \n### nmap 命令\n\n`nmap` 命令用于探测远程系统，以确定从本地系统可以访问哪些网络端口。这对于许多原因都有用，包括：\n\n• 确定远程系统上有哪些可用服务\n\
  • 测试远程系统上的安全功能（例如 TCP wrappers）\n• 如果从远程网络执行 `nmap` 命令，验证网络防火墙的有效性\n\n注意 `nmap`\
  \ 命令被视为端口扫描工具。在没有获得书面授权的系统上扫描端口可能会带来麻烦，因为端口扫描被视为一种黑客技术。\n\n要使用 `nmap` 命令，请提供要扫描的系统的\
  \ IP 地址或主机名。例如，示例 8-1 显示对路由器进行的扫描输出。\n\n**示例 8-1**–`nmap` 命令\n\n```\n# nmap 192.168.1.1\n\
  Starting Nmap 7.8 ( http://nmap.org ) at 2022-1-31 23:22 PDT\nNmap scan report for\
  \ 192.168.1.1\nHost is up (2.9s latency).\nNot shown: 98 closed ports\nPORT    \
  \ STATE SERVICE\n23/tcp   open  telnet\n25/tcp   open  smtp\n53/tcp   open  domain\n\
  80/tcp   open  http\n110/tcp  open  pop3\n119/tcp  open  nntp\n143/tcp  open  imap\n\
  465/tcp  open  smtps\n563/tcp  open  snews\n587/tcp  open  submission\n993/tcp \
  \ open  imaps\n995/tcp  open  pop3s\n5000/tcp open  upnp\nNmap done: 1 IP address\
  \ (1 host up) scanned in 4.89 seconds\n```\n\n描述开放端口的行以端口号/协议（例如 23/tcp）开始并以相应的服务（例如\
  \ telnet）结束。\n\n默认情况下，只扫描传输控制协议 (TCP) 端口。要扫描用户数据报协议 (UDP) 端口，请使用 `-sU` 选项组合，如示例\
  \ 8-2 所示。\n\n**示例 8-2**–扫描 UDP 端口\n\n```\n# nmap -sU 192.168.1.1\nStarting Nmap\
  \ 5.51 ( http://nmap.org ) at 2022-1-31 23:36 PDT\nNmap scan report for 192.168.1.1\n\
  Host is up (0.0011s latency).\nNot shown: 999 open|filtered ports\nPORT   STATE\
  \ SERVICE\n53/udp open  domain\nNmap done: 1 IP address (1 host up) scanned in 4.09\
  \ seconds\n```\n\n默认情况下，只扫描某些常用端口（约 2,000 个）。要扫描所有端口，请使用示例 8-3 所示的命令（然后去喝咖啡休息一下，因为运行可能需要一段时间）。\n\
  \n**示例 8-3**–扫描所有端口\n\n```\n# nmap -p 1-65535 192.168.1.1\nStarting Nmap 5.51 (\
  \ http://nmap.org ) at 2022-0-01 00:26 PDT\nNmap scan report for 192.168.1.1\nHost\
  \ is up (1.0s latency).\nNot shown: 65521 closed ports\nPORT     STATE SERVICE\n\
  23/tcp   open  telnet\n25/tcp   open  smtp\n53/tcp   open  domain\n80/tcp   open\
  \  http\n110/tcp  open  pop3\n119/tcp  open  nntp\n143/tcp  open  imap\n465/tcp\
  \  open  smtps\n563/tcp  open  snews\n587/tcp  open  submission\n993/tcp  open \
  \ imaps\n995/tcp  open  pop3s\n1780/tcp open  unknown\n5000/tcp open  upnp\nNmap\
  \ done: 1 IP address (1 host up) scanned in 5731.44 seconds\n```\n\n通常一个端口有一个关联的本地服务。`nmap`\
  \ 命令也可以探测这些服务以确定可用的服务版本。此功能并非所有服务都可用，但对于支持的服务，它可以提供有用信息。使用 `-sV` 选项组合查看服务版本信息，如示例\
  \ 8-4 所示。\n\n**示例 8-4**–扫描服务版本信息\n\n```\n# nmap -sV 192.168.1.1\nStarting Nmap 7.8(\
  \ http://nmap.org ) at 2022-1-01 09:41\nNmap scan report for 192.168.1.1\nHost is\
  \ up (1.0s latency).\nNot shown: 987 closed ports\nPORT     STATE SERVICE     VERSION\n\
  23/tcp   open  telnet?\n25/tcp   open  smtp?\n53/tcp   open  domain      dnsmasq\
  \ 2.15-Remaining output\n```\n\n假设你在网络上发现了一个 IP 地址为 192.168.1.11 的机器，但你不知道它是什么系统。`nmap`\
  \ 命令的用处之一是它可能通过探测来提供关于该系统种种类型的线索。例如，在该 IP 地址上执行 `nmap` 命令可以让你对机器是什么种系统有一个直观了解，如示例\
  \ 8-5 所示。\n\n**示例 8-5**–探测机器\n\n```\n# nmap -sU 192.168.1.11\nStarting Nmap 7.8\
  \ ( http://nmap.org ) at 2022-1-31 23:38 PDT\nNmap scan report for 192.168.1.11\n\
  Host is up (0.00045s latency).\nNot shown: 992 filtered ports\nPORT     STATE  \
  \        SERVICE\n67/udp   open|filtered dhcps\n137/udp  open|filtered netbios-ns\n\
  138/udp  open|filtered netbios-dgm\n443/udp  open|filtered https\n1900/udp open|filtered\
  \ upnp\n4500/udp open|filtered nat-t-ike\n5353/udp open|filtered zeroconf\n5355/udp\
  \ open|filtered llmnr\nNmap done: 1 IP address (1 host up) scanned in 52.23 seconds\n\
  ```\n\n鉴于 `netbios-ns` 以及此输出中的其他一些服务都是 Microsoft Windows 的服务，该未知系统的操作系统很可能是 Windows。\n\
  \n在某些情况下，你可能可以使用 `-O` 选项来确定操作系统类型，但并非总是成功，如示例 8-6 所示。\n\n**示例 8-6**–尝试确定操作系统类型\n\
  \n\n\n\n```\n# nmap -O 192.168.1.11\n###Output omitted\nAggressive OS guesses: QEMU\
  \ user mode network gateway (91%),\n  Bay Networks BayStack 450 switch (software\
  \ version 3.1.0.22) (85%),\n  Bay Networks BayStack 450 switch (software version\
  \ 4.2.0.16) (85%),\n  Cabletron ELS100-24TXM Switch or Icom IC-7800 radio transceiver\
  \ (85%),\n  Cisco Catalyst 1900 switch or RAD IPMUX-1 TDM-over-IP\n  multiplexer\
  \ (85%), Sanyo PLC-XU88 digital video projector (85%),\n  3Com SuperStack 3 Switch\
  \ 4300, Dell PowerEdge 2650 remote access\n  controller, Samsung ML-2571N or 6555N\
  \ printer, or Xerox Phaser 3125N\n  printer (85%), Dell 1815dn printer (85%)\nNo\
  \ exact OS matches for host (test conditions non-ideal).\nOS detection performed.\
  \ Please report any incorrect results at\nhttp://nmap.org/submit/ .\nNmap done:\
  \ 1 IP address (1 host up) scanned in 15.37 seconds\n```\n\n那么，你最初是如何发现 192.168.1.11\
  \ 这台机器的？`nmap` 命令的另一个有用功能是它可以扫描整个网络以确定哪些 IP 地址正在被使用。要执行此操作，请如示例 8-7 所示所示使用 `-sP`\
  \ 选项组合。\n\n**示例 8-7**–探测网络\n\n```\n# nmap -sP 192.168.1.0/24\nStarting Nmap 7.8\
  \ ( http://nmap.org ) at 2022-1-31 23:51 PDT\nNmap scan report for 192.168.1.0\n\
  Host is up (0.00043s latency).\nNmap scan report for 192.168.1.1\nHost is up (0.0026s\
  \ latency).\nNmap scan report for 192.168.1.2\nHost is up (0.70s latency).\nNmap\
  \ scan report for 192.168.1.3\nHost is up (0.045s latency).\nNmap scan report for\
  \ 192.168.1.4\nHost is up (0.043s latency).\nNmap scan report for 192.168.1.7\n\
  Host is up (0.00011s latency).\nNmap scan report for 192.168.1.11\nHost is up (0.0020s\
  \ latency).\nNmap scan report for 192.168.1.12\nHost is up (0.00013s latency).\n\
  Nmap scan report for 192.168.1.14\nHost is up (3.7s latency).\nNmap scan report\
  \ for 192.168.1.16\nHost is up (0.00088s latency).\n```\n\n你甚至可以使用 `--iflist` 选项查看关于你自己的系统信息，包括网络接口列表和路由表，如示例\
  \ 8-8 所示。\n\n```\n# nmap --iflist\n\nStarting Nmap 7.8 ( http://nmap.org ) at 2022-1-01\
  \ 09:39 PST\n************************INTERFACES************************\nDEV  (SHORT)\
  \ IP/MASK      TYPE     UP MTU   MAC\nlo   (lo)    127.0.0.1/8  loopback up 65536\n\
  eth0 (eth0)  10.0.2.15/24 ethernet up 1500  08:00:27:E0:E2:DE\n\n**************************ROUTES**************************\n\
  DST/MASK    DEV  GATEWAY\n10.0.2.0/24 eth0\n0.0.0.0/0   eth0 10.0.2.2\n```\n\n####\
  \ `nc` 命令\n\n`nc` 命令的帮助页面（也称为 `netcat` 命令）对 `nc` 命令提供了一个极佳的总结：\n\n`nc`（或 netcat）工具几乎可以用于涉及\
  \ TCP 或 UDP 的任何操作。它可以打开 TCP 连接、发送 UDP 数据包、在任意 TCP 和 UDP 端口上监听、进行端口扫描，并处理 IPv4 和\
  \ IPv6。与 `telnet(1)` 不同，`nc` 脚本化支持良好，并将错误消息分离到标准错误输出，而不是将它们发送到标准输出（`telnet(1)` 在某些情况下会这样做）。\n\
  \n`nc` 命令有相当多的用途。例如，假设你想在上线一个使用该端口的服务之前，知道某个特定端口是否被你公司的防火墙拦截了。在内部服务器上，你可以让 `nc`\
  \ 命令在那个端口上监听连接：\n\n```\n# nc -l 3333\n```\n\n此时，你应该会在 `nc` 命令下方看到一个空行。接下来，在网络外部的远程系统上，你可以运行以下\
  \ `nc` 命令进行连接（将 *server* 替换为本地系统可解析的主机名或 IP 地址）：\n\n```\n# nc server 3333\n```\n\
  \n如果连接建立，你会在 `nc` 命令行下方看到一个空行。如果你在这个空行上输入内容并按下 **Enter** 键，那么你输入的内容就会出现在服务器上 `nc`\
  \ 命令下方。实际上，通信是双向的：你在服务器上 `nc` 命令下方输入的内容也会显示在客户端上。\n\n以下是 `nc` 命令的一些实用选项：\n\n-  \
  \ `-w:` 此选项用于客户端侧，以便在达到超时值后自动关闭连接。例如，`nc -w 30 server 333` 会在连接建立 30 秒后关闭连接。\n\n\
  -   `-6:` 使用此选项启用 IPv6 连接。\n\n-   `-k:` 使用此选项在客户端断开连接后继续保持服务器进程活跃。默认行为是在客户端断开连接时停止服务器进程。\n\
  \n-   `-u:` 使用此选项使用 UDP 连接而非 TCP 连接（默认是 TCP）。这对于正确测试防火墙配置非常重要，因为 TCP 端口可能被拦截，而 UDP\
  \ 端口可能不会被拦截。\n\n你也可以使用 `nc` 命令显示开放的端口，类似于你使用 `netstat` 命令的方式：\n\n```\n# nc -z localhost\
  \ 1000-4000\nConnection to localhost 3260 port [tcp/iscsi-target]\nsucceeded!\n\
  Connection to localhost 3333 port [tcp/dec-notes] succeeded!\n```\n\n`-z` 选项也可以用于对远程主机进行端口扫描。\n\
  \n注意\n\n`nc` 命令有一个功能我不认为你会在考试中看到它；然而，它是传输各种数据的一项非常有用的技术。假设传输是从客户端到服务器的，在服务器上，你使用以下格式：\n\
  \n```\nnc -l 3333 | cmd\n```\n\n在客户端上，你使用这个：\n\n```\ncmd | nc server 3333\n```\n\
  \n#### 安全启动 (Secure Boot) 和 UEFI\n\n如今大多数 Linux 安装中的头疼问题之一是统一可扩展固件接口（UEFI）。UEFI\
  \ 中让安装变得如此困难的部分是安全启动（Secure Boot）。安全启动表面上设计是为了让坏人尽可能难以损坏、更改或修改你的引导程序映像，从而获得对你计算机的不当访问权限。\n\
  \n实际上，由于最初所有的 UEFI 安全启动镜像都必须由官方签名机构签名，而唯一的权威是微软，安装 Linux 变得困难得多，这要求发行版维护者要么去微软获取引导映像的签名，要么创建他们自己的完全替代的签名机构，并通过\
  \ UEFI 过程获得批准。\n\n最佳解决方案（也是目前仍然有效的方案）是直接在预启动系统配置中关闭 UEFI 安全启动，并避开整个问题。非常明确地说，你只需要禁用\
  \ UEFI 过程中的安全启动部分，而且继续使用 UEFI 有非常充分的理由。总的来说，它是对主引导记录（MBR）方法的一种明确改进。\n\n![Images](img/key_topic_icon.jpg)\n\
  \n`/boot/efi` 目录并不总是出现在每个发行版中，但如果它存在，通常用于你必须双启动一个系统时，因为 UEFI 系统需要一个可用的 UEFI 分区。\n\
  \n\n\n\n\n我们已经详细介绍了系统日志场景，它位于第 7 章，“管理软件配置。](#ch07.xhtml_ch07)”。\n\n## 使用 umask\n\
  \n如果你的系统是典型的 Linux 系统，那么在 `/etc/bashrc` 文件或 `~/.bashrc` 文件中会设置一个值，用于控制任何创建对象的默认权限。这个值被称为\
  \ `umask`，这个单一值用于确定目录和文件的默认权限。`umask` 仅在创建新文件或目录时生效。\n\n目录和文件的最大默认权限不同，这意味着 `umask`\
  \ 值导致的文件默认权限与目录权限不同。在未设置 umask 值的情况下，默认权限为：\n\n• **对于文件：** `rw-rw-rw-`（或 `666`）\n\
  • **对于目录：** `rwxrwxrwx`（或 `777`）\n\n![Images](img/key_topic_icon.jpg)\n\n执行以下命令查看当前\
  \ shell 的 `umask`：\n\n```\n# umask\n0022\n```\n\n这仅意味着在四个可能的掩码位置（特殊权限、用户所有者权限、组所有者权限和其他权限）中，最后两个写入权限被掩码或未使用。注意，第一个位置永远无效，因为特殊权限从不会设置。因此，`umask`\
  \ 值 `0022` 实际上同于 `022`。\n\n如果你在 `umask` 设置为 `022` 时创建一个文件，该文件的权限如下：\n\n```\n-rw-r--r--\
  \ 1 root root 881 Feb 17 09:11 file1\n```\n\n如果你使用相同的 umask 创建目录，该目录的权限如下：\n\n```\n\
  drwxr-xr-x 2 root root 4096 Feb 17 14:47 dir1\n```\n\n为了理解为什么这些权限集是不同的，请思考 `umask`\
  \ 应用的过程。首先，回想默认权限：\n\n![Images](img/untab08-01.jpg)\n\n现在，考虑 `umask` 值 `022`。这意味着你正在“掩码掉”或移除组所有者和其他用户的写入权限（在这里由\
  \ `M` 值表示）：\n\n![Images](img/untab08-02.jpg)\n\n当这些权限被掩码后，你在新文件和目录上获得以下权限：\n\n![Images](img/untab08-03.jpg)\n\
  \n如你所见，`umask` 值根据以下公式更改创建对象的默认权限：\n\n```\n最大默认值 - umask 值 = 创建值\n```\n\n你可以通过 `umask\
  \ 027` 命令将 `umask` 值更改为更严格的值。\n\n现在，你可以创建另一个文件，权限应该为：\n\n```\n-rw-r----- 1 root\
  \ root 881 Feb 17 09:22 file2\n```\n\n使用 umask 值 027 创建另一个目录，权限应该为：\n\n```\ndrwxr-x---\
  \ 2 root root 4096 Feb 17 14:48 dir2\n```\n\n注意上一个例子中，`umask` 的值大于所创建文件的默认值。`umask`\
  \ 的值范围从 `000` 到 `777`，因为目录对象的最大默认值为 `777`；然而，文件的最大默认值为 `666`。`umask` 值必须包含这两组可能的值，因此如果你在\
  \ `umask` 值中有一个 `7`，它对文件默认权限的影响就像它是 `6` 一样。换句话说，情况下 `6 – 7 = 0`。\n\n预计会在 Linux+\
  \ 考试中遇到 `umask` 值。例如，你可能会看到一个提供文件权限列表的问题，要求你提供产生这些权限的 `umask` 值。为了熟悉 `umask` 值的工作原理，请尝试不同的场景以确定结果。使用下表并为你的\
  \ `umask` 输入不同的值进行练习：\n\n![Images](img/untab08-04.jpg)\n\n最后，重要的是，虽然你所有的 shell 初始具有相同的\
  \ `umask` 值，但你可以在一个 shell 中更改此值，而不影响其他 shell 的 `umask` 值。回想该值最初是通过初始化文件设置的（通常为 `/etc/bashrc`\
  \ 或 `~/.bashrc`）。\n\n## 禁用/移除不安全服务\n\n我们已经在第 4 章，“管理进程和服务。](#ch04.xhtml_ch04)”中涵盖了如何禁用和或掩码以及移除服务。\n\
  \n关于不安全或不安全的服务的简要说明：有一些显而易见的服务，例如 `Telnet` 或 `FTP`，它们是不安全的，已经被 `SSH` 命令套件所取代。\n\n\
  你需要在你的测试或生产环境中自行研究哪些确定哪些服务是不安全的，并利用在此处学到的知识来管理它们。\n\n## 强制执行密码强度\n\n密码强度是另一个带有复杂性的简单短语之一。密码是我们控制谁可以访问系统什么内容的手段，我们有办法确保它们不仅强壮，而且对于那些可能尝试暴力攻击的人来说是一个移动的目标。我建议通过以下三个主要点来确保它们足够强壮：\n\
  \n• 设置初始密码\n• 定期让密码过时\n• 永远不要使用密码\n\n### 设置密码参数\n\n![Images](img/key_topic_icon.jpg)\n\
  \n对于建立和维护强度来说，最重要的文件可能是 `/etc/login.defs` 文件。它是 `Shadow` 软件包的配置文件，包含了类型、长度和其他参数。\n\
  \n这是一个文本文件，易于读取和解析，可以使用用户账户编辑。\n\n重要设置包括：\n\n- `ENCRYPT_METHOD`: 这设置组密码的加密算法，值可以是\
  \ `DES`、`MD5`、`SHA256` 和 `SHA512`。`PAM` 或可插拔认证模块管理用户账户。\n- `FAIL_DELAY`: 非常重要，这是在密码失败后你再次尝试登录之前需要等待多长时间。\n\
  - `LOG_OK_LOGINS`: 通常只记录失败的登录，此设置允许记录所有的登录（包括成功和失败）。\n- `LOGIN_RETRIES`: 设置了检测到错误密码时的最大重试次数，通常为\
  \ 3，但也由 `PAM` 管理。\n\n### 让你的密码过期\n\n用户的密码需要足够频繁地更改，以便攻击者没有足够的时间来猜测。大多数用户只想上班、领工资然后回家；对他们来说，系统安全的重要性远低于便利性。\n\
  \n![Images](img/key_topic_icon.jpg)\n\n要正确让密码过期，请使用 `chage` 命令。`chage` 命令的语法为：\n\
  \n```\nchage -option value username\n```\n\n该命令作用于 `/etc/shadow` 文件中的字段，并具有以下选项：\n\
  \n- `-m`: 更改最小值，或密码更改后用户必须等待多久才能再次更改。\n- `-M`: 更改最大值，即用户必须更改密码之前可以经过的最大天数。\n- `-d`:\
  \ 更改最后更改值，即自 1970 年 1 月 1 日以来密码最后一次更改的天数。这很少直接修改；当使用 `passwd` 命令更改密码时，此值会自动更新。\n\
  - `-E`: 更改过期值，即自 1970 年 1 月 1 日起代表用户账户将被禁用的天数。使用的格式为 *YYYY-MM-DD*。\n- `-I`: 更改闲置值，或账户达到最大限制后，在用户账户被锁定之前闲置（无登录）的天数，此时需要\
  \ root 用户注意才能重新启用账户。将其设置为 0 可禁用此功能。\n\n\n\n\n\n- `-W:` 更改警告值，或用户必须更改密码前的天数。此警告仅在用户登录系统时提供。\n\
  \n幸运的是，你不需要记忆这些值，除非你是为了应对潜在的 Linux+ 考试题。只需以 root 用户身份执行 `chage username` 命令，系统就会交互式地提示你为指定用户配置每个可用值。\n\
  \n用户可以使用 `-l` 选项查看自己的信息，root 用户可以使用此选项查看另一个用户的信息：\n\n```bash\n# chage -l snuffy\n\
  ```\n\n这会产生以下输出：\n\n```\nMinimum: 0\nMaximum: 99999\nWarning: 7\nInactive: -1\n\
  Last Change: Mar 19, 2022\nPassword Expires: Never\nPassword Inactive: Never\nAccount\
  \ Expires: Never\n```\n\n`passwd` 实用包含之前的一些选项，例如：\n\n- `-d:` 通过移除密码来禁用用户账户。\n- `-n:`\
  \ 设置密码的最小有效期，以天为单位。\n- `-x:` 设置密码的最大有效期，以天为单位。\n- `-w:` 设置密码过期前的警告天数。\n- `-i:` 设置密码过期的账户在锁定前可以非空的天数。\n\
  - `-S:` 显示用户密码信息，例如使用了什么加密以及是否设置了密码。\n\n## 不要使用“挂钩”（组密码）\n\n密码通常是个人账户的范畴，但在某些情况下，你可能希望有一个组密码，允许用户更改组并可能允许他们获得不应拥有的访问权限。\n\
  \n组密码是一个巨大的安全风险，虽然在某些非典型实例可能有用，但它们通常会引起安全审计标记其存在，通常应予以避免。\n\n## 移除未使用的软件包\n\n这是一个简单的问题，即没有安装对于系统在正常运行期间并非必需的软件包。\n\
  \n你可能不知道自己是否需要某个软件包，虽然有方法可以找到某个软件包最后安装或更新的时间，但那些方法就像是大海捞针。\n\n最好的方法是列出所有已安装的软件包，如果你不知道某个东西是什么，就对它运行包信息命令，这些命令取决于发行版，但在\
  \ RPM 系统上，你可能可以使用如示例 8-9 所示的命令和选项。\n\n### 示例 8-9–列出网络接口\n\n```bash\n# rpm -qi vim-enhanced\n\
  \nName        : vim-enhanced\nEpoch       : 2\nVersion     : 8.2.4485\nRelease \
  \    : 1.fc34\nArchitecture: x86_64\nInstall Date: Thu 07 Apr 2022 10:19:16 PM MDT\n\
  Group       : Unspecified\nSize        : 4438331\nLicense     : Vim and MIT\nSignature\
  \   : RSA/SHA256, Tue 01 Mar 2022 05:13:56 AM MST, Key ID\n1161ae6945719a39\nSource\
  \ RPM  : vim-8.2.4485-1.fc34.src.rpm\nBuild Date  : Tue 01 Mar 2022 05:00:15 AM\
  \ MST\nBuild Host  : buildhw-x86-07.iad2.fedoraproject.org\nPackager    : Fedora\
  \ Project\nVendor      : Fedora Project\nURL         : http://www.vim.org/\nBug\
  \ URL     : https://bug.fedoraproject.org/vim\nSummary     : A version of the VIM\
  \ editor which includes recent enhancements\nDescription :\nVIM (VIsual editor iMproved)\
  \ is an updated and improved version of the\nvi editor. Vi was the first real screen-based\
  \ editor for UNIX, and is\nstill very popular.  VIM improves on vi by adding new\
  \ features:\nmultiple windows, multi-level undo, block highlighting and more.  The\n\
  vim-enhanced package contains a version of VIM with extra, recently introduced features\
  \ like Python and Perl interpreters.\n```\n\n如你所见，显示了关于该软件包的大量信息，包括它是何时构建、安装等的。\n\
  \n你也可以查看 YUM、Zypper、RPM、APT 等用于存储已安装信息的各种日志。这些日志因软件包管理器而异，因此请查看特定命令的 man 页面并搜索“installed”（已安装）等关键词。\n\
  \n## 调整内核参数\n\n已经在第 7 章“管理软件配置.”中涵盖了如何设置和调整内核参数。\n\n## 安全服务账户\n\n记住，服务账户类似于用户账户，不同在于它不会配置供某人登录该账户，它仅用于让服务拥有账户所有者，并且永远不应该显示为登录过。\n\
  \n![Images](img/key_topic_icon.jpg)\n\n我喜欢向人们展示如何使用 `lastlog` 命令，默认情况下，它显示带有以下头格式的信息：\n\
  \n```\nUsername    Port    From    Latest\n```\n\n该命令会显示 `/etc/passwd` 文件中每个用户或服务账户的条目，其中大多数没有登录过或不应该登录，因为它们是用于管理和拥有进程的服务账户，而不是用户账户。这样做的问题在于，你必须处理大量的输出，其中最后一个字段\
  \ `Latest` 显示文本 `Never logged in`（从未登录），只有在最底部才能看到真实用户的数据。\n\n可能我最喜欢的 `grep` 使用方法（除了在内核源码中搜索脏话之外）是使用\
  \ `-v`（反向）选项，它向你显示所有*不匹配*你刚刚搜索的内容。\n\n例如，你可以在 `lastlog` 命令的输出上使用 `-v` 来过滤掉任何包含 `Never\
  \ logged in` 字符串的输出行，从而只显示已登录的用户：\n\n```bash\n# lastlog | grep -v “Never logged\
  \ in”\nUsername    Port    From             Latest\nross          pts/1   192.168.33.144\
  \   Wed, Feb 22, 08:20\n-0700 2022\nulogin        pts/2   192.168.33.88     Wed,\
  \ Feb 22, 07:10\n-0700 2022\nshaggy       pts/3   192.168.33.76     Wed, Feb 22,\
  \ 05:50\n-0700 2022\n```\n\n注意，如果你运行此命令并看到服务账户（如 `ntp`、`systemd-network` 或 `kernoops`）已登录，你应该立即开始调查原因。与服务相关的账户不应用于登录，因此这种登录表明某种系统黑客攻击。\n\
  \n## 配置主机防火墙\n\n你可以在第 10 章“实施和配置防火墙.”中查看关于防火墙配置的所有信息。\n\n## 总结\n\n在本章中，你学习了如何将 Linux\
  \ 安全最佳实践应用到你的系统中以保护你的通信和数据，通过技术如 PKI、证书、SSL/TLS 以及 Tokens、PAM、SSSD 和 SSO 等身份验证选项。\n\
  \n你还学习了如何通过应用最佳实践来加固或更安全地保护 Linux 系统，移除未使用软件包、收紧密码策略并确保你能找到需要修复的问题。\n\n## 考试准备任务\n\
