  C2\\A0Corporation\\C2\\A0for\\C2\\A0Assigned\\C2\\A0Names\\C2\\A0and\\C2\\A0\nNumbers,\
  \ CN = www.example.org\n   i:C = US, O = DigiCert Inc, CN = DigiCert TLS RSA SHA256\
  \ 2020 CA1\n 1 s:C = US, O = DigiCert Inc, CN = DigiCert TLS RSA SHA256 2020 CA1\n\
  \   i:C = US, O = DigiCert Inc, OU = www.digicert.com, CN = DigiCert Global Root\
  \ CA\n---\nServer certificate\n-----BEGIN CERTIFICATE-----\nMIIHRzCCBi+gAwIBAgIQD6pjEJMHvD1BSJJkDM1NmjANBgkqhkiG9w0BAQsFADBP\n\
  MQswCQYDVQQGEwJVUzEVMBMGA1UEChMMRFlnaUNlcnQgSW5jMSkwJwYDVQQDEyBE\naWdpQ2VydCBUTFMgUlNBIFNIQTI1NiAyMDIwIENBMTAeFw0yMjAzMTQwMDAwMDBa\n\
