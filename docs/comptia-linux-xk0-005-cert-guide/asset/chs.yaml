  \ (Obj. 1.1 - 1.7)\n\n## 第 1 章 理解 Linux 基础\n\n本章涵盖了以下主题：\n\n• 文件系统层次结构标准\n\n• 基础启动过程\n\
  \n• 引导加载程序和文件\n\n• 内核崩溃 (Kernel Panic)\n\n• /dev 中的设备类型\n\n• 从源码安装软件\n\n\n\n\n\n\
  # 列出硬件信息 (#ch01.xhtml_ch01lev1sec10)\n\n本章涵盖的考试目标如下：\n\n**目标 1.1:** 系统管理\n\nLinux\
  \ 是一个非常出色的操作系统，适用于各种任务，但也有许多可以调整和配置的选项，其中一些选项的文档并不详尽，或者晦于理解。\n\n这就像从汽车经销商那里买了一辆车，如果你只是启动并驾驶，它其实很简单，只需避免碰撞并保持液位充足，你就能正常一段时间。\n\
  \n当某些功能运行异常时，**真正的**乐趣才开始，你必须打开引擎盖（欧洲朋友称为机盖），开始找出哪里出了问题或哪里需要修改。Linux 可以非常易于使用，但也允许你根据意愿深入底层，探索其内部工作机制。\n\
  \n本章将重点介绍 Linux 系统管理的要点，包括文件系统层次结构标准（FHS）是什么、哪些文件和目录存放在哪里以及包含什么、`/dev` 目录及其内容的细节、存储管理的基础知识（包括存储类型、分区类型、RAID\
  \ 和 FUSE）、Linux 系统的启动过程以及从源码构建软件包。\n\n我们还将查看当 Linux 内核恐慌（panic）或崩溃时会发生什么，以及如何调查系统包含哪些硬件。\n\
  \n### “我已经掌握这些了吗？”测验\n\n“我已经掌握这些了吗？”测验可以帮助你评估是应该阅读整个章节，还是直接跳到“考试准备任务”部分进行复习。如果你不确定，请阅读整个章节。表\
  \ 1-1 列出了本章的主要标题以及对应的“我已经掌握这些了吗？”测验题。你可以在附录 A，“‘我已经掌握这些了吗？’测验答案与复习题](#appa.xhtml_appa)”中找到答案。\n\
  \n**表 1-1**–“我已经掌握这些了吗？”基础主题与题目映射\n\n![Images](img/01tab01.jpg)\n\n**注意**\n\n自测的目标是衡量你对本章主题的掌握程度。如果你不知道某个问题的答案，或者对答案只有部分确定，那么出于自测目的，你应该将该问题标记为错误。对于猜对的答案给自己分会歪曲自测结果，并可能带给你虚假的安全感。\n\
  \n**1.** 大多数发行版厂商遵循关于哪些文件和目录位于何处及其包含内容的明确建议是？\n\n**a.** 数据定位标准\n**b.** 文件和目录协议\n\
  **c.** 文件系统层次结构标准 (FHS)\n**d.** 以上答案都不是\n\n**2.** 为了在 Linux 系统上新安装的磁盘设备上格式化文件系统，必须做什么？\n\
  \n**a.** 挂载设备\n**b.** 对设备执行 `fsck`\n**c.** 对设备去碎片\n**d.** 分区设备\n\n**3.** 如果你的系统遇到内部错误并无法继续处理，发生了以下哪情况？\n\
  \n**a.** 停止错误 (Stop error)\n**b.** 绿屏死亡\n**c.** 内核恐慌 (Kernel panic)\n**d.** Init\
  \ zero\n\n**4.** 下哪项不是 Linux 系统 `/dev` 目录中通常常见的有效设备类型？\n\n**a.** `tty`\n**b.** `zero`\n\
  **c.** `urandom`\n**d.** `tmp`\n\n**5.** 你想在系统中编译一个软件包。为了为你的系统自定义 Makefile，必须先运行哪一个？\n\
  \n**a.** `make conf`\n**b.** `setup`\n**c.** `conf makefile.c`\n**d.** `configure`\n\
  \n**6.** 哪个目录是虚拟文件系统的起点？\n\n**a.** `/`\n**b.** `/vert`\n**c.** `/sys`\n**d.** 以上答案都不正确。\n\
  \n**7.** 哪个命令提供了系统中所有硬件和驱动程序的概述，包括用于与 CPU 通的端口？\n\n**a.** `lspci`\n**b.** `lsdev`\n\
  **c.** `lsusb`\n**d.** `sysinfo`\n\n### 基础主题\n\n### 文件系统层次结构标准\n\n文件系统的结构从文件系统的根开始，用斜杠字符\
  \ (`/`) 表示。文件系统上的每一项都可以通过系统根目录下的单一唯一路径访问，例如 `/usr/local/bin/foobar`，无论该文件存储在哪个设备上。\n\
  \nUnix 在某些文件的存放位置上演化出了自己的传统。商业版和学术版 Unix 的碎片化导致了根据你使用的 Unix 版本而不同的惯差异。\n\nLinux\
  \ 借鉴了许多不同 Unix 的实践，并以不同发行版的形式拥有了自己的碎片化。社区开始制定一种名为文件系统层次结构标准（FHS）的文件系统布局标准，以便让人们和软件更容易找到文件存放的位置。\n\
  \n最新的 FHS 可从 Linux Foundation 获取，在本文编写时版本为 3.0。\n\nFHS 并不完全是一个标准，而是大多数（但不是所有）发行版厂商遵循的一组明确建议。考试中会有关于\
  \ FHS 的问题。FHS 描述了特定类型的文件应该放置在哪里，有助于维护不同发行版之间的一致性。\n\n#### 什么该放在哪里\n\n考试对 Linux 文件的正确目录和位置看得很相当重要，但没有什么比被问及什么绝对应该存放在根\
  \ (`/`) 目录中，或者什么可以存储在其他地方更令人苦恼了。这意味着你可能至少需要快速浏览一遍 FHS，它是很有用的信息，并将帮助你更好地理解 Linux\
  \ 系统，所以去读一下吧！\n\n![Images](img/key_topic_icon.jpg)\n\n##### 文件系统的根\n\n文件系统的存在，事实上，系统作为一个功能性的\
  \ Linux 计算机的运行，始于 `/` 或根目录以及包含其中的子目录，这些子目录也可以包含文件和*子目录，一直延伸到系统最底层的文件。\n\n从 `/` 或根目录开始，表\
  \ 1-2 列出了 `/`（根）下更常见的顶层子目录以及简要解释。\n\n![Images](img/key_topic_icon.jpg)\n\n**表 1-2**–根目录\
  \ (`/`) 下的常见子目录及其典型用途。\n\n![Images](img/01tab02.jpg)\n\n考试将包含此类题目，旨在判断你是否知道 Linux\
  \ 系统中最常见目录的用途。你可能会看到关于选择哪些目录被列为可选的问题，因此再次鼓励你查阅 FHS 目录，确保你了解这些内容。\n\n##### 程序应该放在哪里\n\
  \nFHS 不允许程序在 `/usr` 部分创建它们各自命名的目录。这棵树通常存放运行 Linux 系统不需要的核心应用程序的程序或二进制文件，那些通常存放在\
  \ `/bin` 和 `/sbin` 中。\n\n允许直接位于 `/usr` 目录下的子目录有：\n\n- **bin:** 包含大多数命令。\n- **lib:**\
  \ 包含库。\n- **local:** 包含本地/共享程序，可能为空。\n- **sbin:** 包含非关键系统二进制文件。\n- **share:** 包含与架构无关的数据。\n\
  \nFHS 不鼓励在 `/usr` 树的根目录下设置单个应用程序目录，而是希望将它们存放在 `/usr` 下的子目录或其允许的某个子目录中。\n\n### 基础启动过程\n\
  \n启动 Linux 系统不仅仅是开启系统并最终向你显示登录提示。相反，这是一系列事件，如果一切顺利，结果就是向你呈现那个登录提示。\n\n\n\n\n\n在接下来的章节中，我们将启动过程视为一组任务，这些任务旨在使系统能够进入默认的运行级别（runlevel）。由于配置、启动和管理系统服务或进程有多种方法，这一过程可能会变得复杂。\n\
  \n我们将涵盖内容：\n\n-   **BIOS**: 基础输入输出系统 (Basic Input/Output System)\n-   **UEFI**:\
  \ 统一扩展固件接口 (Unified Extensible Firmware Interface)\n-   **启动命令**: 如 `mkinitrd`、`grub2`\
  \ 和 `dracut`\n-   **GRUB2**: 统一统一引导程序 2\n-   **启动源**: PXE、USB 和 ISO 启动\n\n## 什么是启动过程？\n\
  \nLinux 的启动过程是指系统从硬件（或虚拟硬件）上电直到所选操作系统达到所需的功能状态的过程。得益于 `systemd`、`Upstart` 以及其他初始化方法的普及，实现运行系统有多种路径。\n\
  \nLinux 启动过程可以分为四个不同的阶段：\n\n1. 引导程序阶段 (Boot loader phase)\n2. 内核阶段 (Kernel phase)\n\
  3. 早期用户空间 (Early user space)\n4. Init 进程 (Init process)\n\n## 系统启动选项\n\n启动系统有多种方法。有些要求在本地磁盘上安装软件并进行配置，有些允许使用启动或安装服务器，还有一些允许你通过网络从远程文件系统启动。\n\
  \n![Images](img/key_topic_icon.jpg)\n\n### initrd 和 initramfs\n\nLinux 运行在极其广泛的平台上，为了兼容性，许多发行版都使用相当标准的\
  \ Linux 内核镜像，并依赖于每个系统特定硬件的检测以及加载所需的内核模块，以便在安装和随后的系统初始化期间正确适配硬件。\n\n由于涉及的启动方法、样式和硬件类型极其多样，存在一个类似于“鸡生还是蛋”的问题：系统必须使用通用的\
  \ Linux 内核镜像从硬件启动，但根文件系统（root filesystem）在哪里？你又如何让通用镜像知道它的位置呢？\n\n与其采用将特定硬件配置所需的模块编译进内核的这种并不优雅的选择，不如使用早期用户空间的临时文件系统。临时文件系统位于磁盘上，其位置固件或引导程序是已知的。通过访问并挂载临时文件系统，可以在启动过程中提供一组可能的模块供使用。内核和早期用户空间文件系统的镜像被加载到\
  \ RAM 中，内核会被告知镜像在内存中的位置，以便其检测自身的格式——无论是 `initrd` 或 `initramfs`。\n\n`initrd` 方法相当老旧，它实际上是一个文件系统的镜像，表示为\
  \ `/dev/ram` 设备，并被挂载为内核使用的临时根文件系统。这种方法的缺点是，内核必须包含编译编译或硬编码的该文件系统驱动程序的引用。如果磁盘发生了变化（例如通过更换磁盘、更改磁盘大小或几何结构或修改包含文件的分区），可能会出现问题。\n\
  \n传统上创建初始 RAM 磁盘的命令是 `mkinitrd` 命令，随后是要创建的 `initrd` 镜像及其为其创建的内核，例如所示：\n\n```bash\n\
  # sudo mkinitrd --preload=/boot/initrd.img-5.11.0-37-generic 5.11.0-37-generic\n\
  ```\n\n如果有一个特定的模块需要加载，以便内核能够找到并访问带有 `initrd` 的磁盘，你可以通过使用 `--preload` 选项加上模块名称来指定它，如下：\n\
  \n```bash\n# sudo mkinitrd --preload=/boot/initrd.img-5.11.0-37-generic 5.11.0-37-generic\n\
  ```\n\n更常用的提供早期用户空间文件系统的方法是 `initramfs` 方法。该方法使用从特定类型的归文件（`cpio`）中解压出的初始根文件系统，并将其挂载到\
  \ RAM 中作为临时根文件系统。这种方法的一个明显优势是不需要预编译特殊模块或包含内核，因此它是通用的，并兼容许多系统配置。\n\n构建 `initramfs`\
  \ 镜像最初涉及使用 `mkinitrd` 命令，该命令在 `initrd` 方法中也会用到。然而，`dracut` 命令几乎会立即参与 `initramfs`\
  \ 镜像的构建，它尝试以对硬编码脚本最少的依赖来创建镜像。`dracut` 框架依赖 `udev`（内核中的设备管理器）来告诉它检测到并挂载了哪些设备，当正确的设备挂载时，系统会将根文件系统切换到该设备。\n\
  \n`dracut` 的一个主要优势是它广泛支持启动设备，包括使用 RAID 和 LVM 的设备，以及更冷门的设备类型，例如通过 iSCSI 和 NFS 的远程设备。\n\
  \n使用 `dracut` 创建 `initramfs` 镜像非常简单。如果你单独运行命令，系统会尝试为当前运行的内核创建一个功能性的 `initramfs`\
  \ 镜像。这会导致错误消息，因为这是尝试覆盖当前的 `initramfs` 镜像。\n\n要在不覆盖当前镜像的情况下创建 `initramfs` 镜像，只需指定另一个镜像名称，然后检查生成的\
  \ `initramfs` 镜像的格式：\n\n```bash\n# dracut some-image-file-name.img\n```\n\n### 使用\
  \ UEFI 启动\n\n如今大多数 Linux 安装中的棘手问题是统一扩展固件接口（UEFI）。UEFI 中让 Linux 发行版安装变得如此困难的部分被称为安全启动（Secure\
  \ Boot）。安全启动的设计初衷是为了让坏人尽可能难以损坏、更换或更改你的引导程序镜像，从而获得对你计算机的不当访问。\n\n实际上，由于最初所有的 UEFI\
  \ Secure Boot 镜像都必须经过官方签名机构，而唯一的权威是微软，安装 Linux 变得困难得多，这要求发行版维护者要么去微软获取引导镜像签名，要么创建自己完全替代的签名权威并通过\
  \ UEFI 流程获得批准。\n\n最佳解决方案也是目前仍然有效的，是简单地在预启动系统配置中关闭 UEFI Secure Boot，从源上避免整个问题。明确地说，你只需要禁用\
  \ UEFI 过程中的安全启动部分，而且继续使用 UEFI 有充分的理由。总的来说，它是对主引导记录（MBR）方法的明确改进。\n\n`/boot/efi` 目录并非在每个发行版都存在，但如果它存在，通常用于必须对系统进行双启动的情况，因为\
  \ UEFI 系统需要一个可用的 UEFI 分区。\n\n**注意**\n\n在本章的系统示例中，Ubuntu 机器没有 `/boot/efi` 目录，而 CentOS\
  \ 机器有一个 `/boot/efi/EFI` 目录，其中包含一个名为 `centos` 的空目录。\n\n如果系统配置为使用 EFI 启动，则会在 `/boot/efi`\
  \ 上挂载一个 FAT32 分区（EFI 系统分区），该分区包含系统上各种操作系统启动选项的引导文件，扩展名为 `.efi`，如下所示（这是一个 EFI 引导镜像）：\n\
  \n```text\n/boot/efi/EFI/arch/vmlinuz-linux.efi\n```\n\n该文件也可以简单地命名为 `linux.efi`。\n\
  \n### 通过 PXE 启动\n\n预启动执行环境（PXE）要求客户端具有具备 PXE 能力的网卡（NIC），并在服务器端，需要一个支持 PXE 启动的 DHCP\
  \ 服务器。\n\n\n\n\nPXE 服务端比客户端更复杂，它需要支持多种协议的正确组合，包括在客户端通过 DHCP 配置好网络后，提供一个可传输到客户端的有效网络启动程序（NBP）。\n\
  \n支持 PXE 的客户端计算设备的启动过程大致如下：\n\n**步骤 1。** 客户端设备通电，并在 BIOS/启动界面中选择 PXE 启动选项。\n\n**步骤\
  \ 2。** 客户端发送一个 `DHCPDISCOVER` 广播包，其中内置的 PXE 选项可让 DHCP 服务器知道请求的类型。\n\n**步骤 3。** 支持\
  \ PXE 的 DHCP 服务器返回一个 `DHCPOFFER` 广播包，其中包含了 PXE 客户端设置网络栈以及连接 DHCP 服务器的简易文件传输协议（TFTP）服务所需的所有网络信息。\n\
  \n**步骤 4。** PXE 客户端完成网络设置并启动对 NBP 镜像的 TF 传输，将其存储在客户端的 RAM 中。\n\n**步骤 5。** 最后，客户端使用\
  \ NBP 启动，并根据操作系统的不同，从 TFTP 服务器或其他网络资源（如网络文件系统 NFS 服务器）请求额外的启动文件。\n\n### 通过 NFS 启动\n\
  \n我们已经查看过使用 TFTP 和 DHCP 服务器分发网络配置和网络启动程序。现在考虑从网络上 NFS 共享中的文件启动系统是合理的。\n\n从 NFS 启动运行中的系统与\
  \ PXE 启动系统略有不同，后者通常用于安装（但不限于此功能）。\n\n作为一个从 NFS 启动的示例，我们将使用无盘工作站的场景，即整个操作系统从 NFS\
  \ 服务器下载并挂载到支持 PXE 的系统中。\n\n以下是实现无盘工作站通过 NFS 启动并挂载其根文件系统需要执行的操作概述：\n\n**步骤 1。** 选择服务器并安装/启用\
  \ DHCP 和 TFTP 服务。\n\n**步骤 2。** 配置 TFTP 以支持 PXE 启动。\n\n**步骤 3。** 将相应的 `pxelinux`\
  \ 镜像拷贝到 TFTP 启动目录。\n\n**步骤 4。** 确保 DHCP/TFTP 服务器的防火墙允许流量。\n\n**步骤 5。** 配置 DHCP 服务器支持\
  \ PXE 启动。\n\n**步骤 6。** 创建一个包含完整 Linux 系统的根目录以便通过 NFS 共享。不同的发行版推荐使用 `rsync` 或使用 YUM\
  \ 选项 `--installroot`。\n\n**步骤 7。** 配置无盘工作站将启动的相应内核。\n\n**步骤 8。** 创建并设置 `initrd`\
  \ 方法的权限，将其拷贝到 TFTP 启动目录。\n\n**步骤 9。** 通过将无盘根目录添加到 `/etc/exports` 文件中共享该目录，然后重启 NFS\
  \ 守护进程或使用 `exportfs` 命令。\n\n**步骤 10。** 启动无盘工作站并选择 `PXE Boot` ，当系统显示启动选项菜单时，选择刚刚配置的项。系统将远程根文件系统挂载为自己的\
  \ `/` 文件系统，系统现在是一个可以正常工作的系统。\n\n### 通过 ISO 启动\n\n从 ISO 文件（Linux 发行版安装 CD/DVD 的磁盘镜像）启动的设置相对简单。这样做的主要目的是拥有磁盘救援环境，以防安装到磁盘的发行版出现问题或需要恢复密码。\n\
  \n真正需要的只是 Linux 发行版 CD/DVD 的 ISO 文件、一个足够容纳 CD/DVD 内容的空分区，以及编辑 `grub.cfg` 文件的能力，将菜单项中的一个指向你所拷贝\
  \ ISO 文件的分区上的 ISO 文件。\n\n从 ISO 启动救援系统有多种方法，这是一种相对简单的方法：\n\n**步骤 1。** 选择一个 Linux\
  \ 发行版并下载安装 CD/DVD。\n\n**步骤 2。** 如果你是首次为系统安装 Linux，请在安装期间创建救援分区，确保将其标记为如 `RESCUE`\
  \ 这样明显的名称，并在该分区上创建 MS-DOS 文件系统。\n\n**步骤 3。** 如果你正在修改现有的运行中的 Linux 系统，可以使用 `parted`\
  \ 或 `gparted` 调整当前分区的大小，为救援分区腾出空间。（这已远超 Linux+ 考试的范围。）\n\n**步骤 4。** 将 ISO 文件拷贝到磁盘上并记录文件名。\n\
  \n**步骤 5。** 更新 `grub.cfg` 文件，包含一个启动段，该启动段使用 MS-DOS 分区作为根分区，然后作为回环设备挂载 Linux 发行版的\
  \ ISO 文件。\n\n**步骤 6。** 启动系统并测试配置。\n\n网上有数十种教程可以引导你完成此过程的各个方面，该过程在不同的发行版上有所不同。这里的核心概念是，你可以从包含在磁盘设备上的\
  \ ISO 文件启动。\n\n### 引导程序和文件\n\n当计算机启动时，它不知道如何与所有外设通信，甚至不知道如何加载应用程序。但每台计算机都有一个`基本输入输出系统\
  \ (BIOS)`，它提供了足够的智能来读写本地磁盘并在屏幕上显示一些文本。\n\n计算机启动后，它会将控制权交给 BIOS，由 BIOS 初始化硬件并从启动磁盘读取第一块——512\
  \ 字节。该块包含引导程序的第一部分，该部分从磁盘加载引导加载程序并运行它。磁盘上的这个特殊扇区被称为`主引导记录 (MBR)`。\n\n如果已有的操作系统占用了\
  \ MBR，则可以将 Linux 启动块放在 Linux 分区的第一个块中。在这种情况下，需要告诉第一个引导加载程序将控制权交给 Linux 引导程序。这很复杂，但这种多系统引导允许两个不同的操作系统在同一台计算机上共存。\n\
  \n引导程序显示一个提供不同操作系统选择的菜单。通常，如果在短时间内没有收到输入，将选择默认项，这允许计算机无人启动。引导程序还可以向内核传递参数，例如以不同的方式初始化硬件、禁用问题的特性或更改启动顺序。\n\
  \n有多种引导程序可用，但大多数发行版已统一使用`通用统一引导加载程序 (GRUB)`，目前版本为 2 代，即 `GRUB2`。\n\n注意\n\n考试将侧重于\
  \ `GRUB2`，但了解 GRUB 的来源以及原始 GRUB 与较新的 GRUB2 之间的差异也是重要的。\n\n#### Legacy 版 GRUB\n\n\
  在 Linux 早期，引导程序非常简单：你可以通过 `LOADLIN.EXE` 从现有的微软系统启动内核，或者直接使用 Linux 加载器 (LILO) 启动。后者相当缺乏灵活性。虽然你有一个基本的菜单系统，但任何更改都需要通过重写到磁盘上的引导程序来完成。甚至内核块在磁盘上的位置也需要预先知道。LILO\
  \ 必须生成一个包含内核的块列表并将其写入已知位置，以便在启动时将内核重新组合起来。\n\n最终，GNU 基金会开始开发 GRUB。这种引导程序比其他的更灵活，因为它提供了一个交互式菜单，可以轻松地更改和适应以启动许多操作系统。GRUB\
  \ 能够理解不同的文件系统，它可以像读取文件一样从磁盘中读取内核，而不需要知道各个块的位置。\n\n#### GRUB2\n\n\n\n\nGRUB2 是目前使用的\
  \ GRUB 版本，自大约 2010 年以来，它一直是大多数发行版的默认引导程序。GRUB2 最初是为了提高稳定性和功能进行的内核重写，并迅速演变为现在广为人知的\
  \ GRUB2。熟悉 GRUB 的用户可以快速理解 GRUB2 的语法、命令和结构；它们与旧版本非常相似，除了文件名和位置发生了若干变化以及许多重要且实用的功能外。\n\
  \n### GRUB2 的更改\n\nGRUB2 的核心更改之一是配置文件的名称，它已从 GRUB 中的 `menu.lst` 或 `grub.conf` 变为\
  \ GRUB2 中的 `grub.cfg`。此外，在 GRUB2 中，主配置文件（`/boot/grub2/grub.cfg`）是由 `grub-mkconfig`\
  \ 命令或安装程序生成的。由于目前系统更新的方式，你的 `/boot/grub2/grub.cfg` 文件可能会被内核或其他系统更新程序重新生成，因此为了安全起见，有两个位置可以安全地存储自定义内容，以确保在\
  \ `/boot/grub2/grub.cfg` 文件发生任何自动更改后这些内容依然有效。这两个用于自定义（项目或参数）的位置是 `/etc/grub.d/40_custom`\
  \ 文件和 `/boot/grub/custom.cfg` 文件。这些文件会被 `grub-mkconfig` 命令读取，并在生成 `/boot/grub2/grub.cfg`\
  \ 文件时使用。\n\n从 GRUB 到 GRUB2 的另一个更改是分区编号方式的变化。GRUB 使用 `fd/hd` 表示磁盘，设备上的第一个 `hd` 标记为\
  \ `hd0`；该设备上的第一个分区被引用为 `hd0,0`。这在 GRUB2 中发生了变化，分区从数字 1 开始，而设备仍然从 0 开始。\n\n此外，为了兼容性考虑，文件名\
  \ `/etc/grub2.cfg` 是指向 `grub.cfg` 文件的符号链接。\n\n![Images](img/key_topic_icon.jpg)\n\
  \n### GRUB2 命令名称\n\n简要提到 GRUB2 的命令名称是有必要的。虽然文档中可能会省略命令中的 `2` 标识（例如，`grub-install`\
  \ 与 `grub2-install`），但某些发行版在命令名称中使用版本号，而另一些则没有。例如，Ubuntu 在命令名称中未使用 `2`，但 Fedora\
  \ 和 CentOS 使用了。要找出某个发行版使用哪种最简单的方法是输入命令的 `grub` 部分并按两次 `Tab` 键，得到如示例 1-1 所示的输出。\n\
  \n**示例 1-1**——系统中与 `grub` 相关的命令\n\n```\nroot@tuxix:/boot# grub\ngrub           \
  \         grub-mklayout\ngrub-bios-setup       grub-mknetdir\ngrub-editenv     \
  \     grub-mkpasswd-pbkdf2\ngrub-file              grub-mkrelpath\ngrub-fstest \
  \          grub-mkrescue\ngrub-glue-efi         grub-mkstandalone\ngrub-install\
  \          grub-mount\ngrub-kbdcomp          grub-ntldr-img\ngrub-macbless     \
  \    grub-probe\ngrub-menulst2cfg      grub-reboot\ngrub-mkconfig         grub-render-label\n\
  grub-mkdevicemap      grub-script-check\ngrub-mkfont           grub-set-default\n\
  grub-mkimage          grub-syslinux2cfg\n```\n\n如所示，该发行版在命令的 `grub` 部分没有使用 `2` 版本标识。\n\
  \n### 安装 GRUB2\n\n安装 GRUB2 的第一步是让工具将自身写入主引导记录，如下：\n\n```\n[root@localhost ~]# grub2-install\
  \ /dev/sda\nInstalling for i386-pc platform.\nInstallation finished. No error reported.\n\
  ```\n\n这会将引导扇镜像复制到磁盘并将剩余文件复制到 `/boot`。如果你的可启动分区不是 `/boot`，你可以覆盖此默认设置，例如示例 1-2 中的\
  \ `/mnt/tmpboot`。\n\n**示例 1-2**——将 GRUB2 安装到备位置\n\n```\n[root@localhost ~]# grub2-install\n\
  --boot-directory=/mnt/tmpboot/dev/sda\nInstalling for i386-pc platform.\nInstallation\
  \ finished. No error reported.\n[root@localhost ~]# tree -d /mnt/tmpboot/\n/mnt/tmpboot/\n\
  |−-- grub2\n | - - fonts\n | - - i386-pc\n |−-- locale\n 4 directories\n```\n\n\
  在示例 1-2 中，GRUB2 文件安装到 `/mnt/tmpboot`，`tree` 命令显示了为引导管理器创建的目录。GRUB2 镜像和相关模块位于 `i386-pc`\
  \ 目录下。\n\n这种备用磁盘选项通常用于在现有系统上制作启动盘，此时你有一个临时挂载的磁盘镜像。\n\n### 使用 GRUB2 命令行\n\n你与 GRUB2\
  \ 命令行的首次交互是在启动过程中进行的。当你启动计算机时，你会看到 `GRUB2` 菜单，提供一个待启动的内核列表，以及一个输入字符 `c` 进入命令行的选项。按此键将你带到简单的命令提示符：\n\
  \n```\ngrub>\n```\n\n如果你无法正常启动，可以使用 GRUB2 命令行检查正在运行的系统并获取启动的内核。你可以使用 `ls` 命令查看设备列表：\n\
  \n```\ngrub> ls\n(proc) (hd0) (hd0,gpt2) (hd0,gpt1) (hd1) (cd0)\n```\n\n分区的语法与 Linux\
  \ 分区命名语法相似。重要的是记住，磁盘从 0 开始计数，但分区从 1 开始计数。因此，第一块磁盘上的第一个分区是 `hd0,msdos1`，对应于 Linux\
  \ 中的 `sda1`。通常很难知道哪个分区包含你需要的文件，因此你可以检查每个分区。shell 不提供通配符，但你可以按 `Tab` 键作为替代：\n\n```\n\
  grub> ls (hd0,msdos1)/vml<TAB>\n```\n\n可能的文件有：\n\n```\nvmlinuz-0-rescue-1bc6a0e5dd394f63b228657b634ba252\n\
  vmlinuz-3.10.0-862.14.4.el7.x86_64\n```\n\n注意\n\n如果你是 Linux 初手，可能会发现这些命名上的不一致性令人困惑。Linux\
  \ 工具由不同的人开发，他们有不同的处理方式。Linux 内核中的设备命名非常一致，但 GRUB 是由另一组完全不同的人开发的，具有不同的目标。GRUB 的设计目标是启动不同的操作系统，因此某些概念与\
  \ Linux 中的处理方式并不直接对应。\n\n`Tab` 键会在设备上查找任何以 `vml` 开头的文件，这些是内核文件。此处这里显示了两个。如果你根据名称知道第二个是用于启动的内核，你可以通过提供内核名称和相应的初始\
  \ RAM 磁盘名称，为 GRUB 启动足够的信息来启动它。初始 RAM 磁盘（缩写为 `initrd`）包含了在特定硬件上启动内核所需的额外驱动程序。\n\n\
  通过使用 `Tab` 补全，你可以找到正确的内核和 `initramfs`，设置好后，你可以输入 `boot`，它就能正常启动。这是一个示例：\n\n```\n\
  grub> linux (hd0,gpt2)/ vmlinuz-5.4.0-91-generic\n  genericroot=/dev/mapper/fedora-root\
  \ ro\ngrub> initrd (hd0,gpt2)/ initrd.img-5.4.0-91-generic\ngrub> boot\n<boot process\
  \ output truncated>\n```\n\n虽然启动内核涉及多个参数，但它们已经位于 `grub.cfg` 文件中，你可以通过 `cat` 命令查看或在互联网上搜索。内核可以接受许多参数，但重要的是传递根文件系统的路径\
  \ (`root=`），并且该文件系统最初应以只读方式启动 (`ro`）。\n\n在 Linux 早期，引导程序的问题意味着你需要一张包含 Linux 的 CD\
  \ 或软盘以便启动并开始恢复。GRUB2 的命令行意味着你仍然快速进入系统进行修复。\n\n### 揭秘内核镜像\n\n在内核启动配置领域，你可能会遇到两个看似随机的内核版本：vmlinuz\
  \ 和 vmlinux。\n\n\n\n\n\n简而言之，`vmlinux` 文件是一个未压缩且静态链接的内核镜像文件。该文件主要用于早期的内核时代。该文件非常小，可以加载到低内存的空闲空间中。由于必须加载到低内存，镜像的大小限制在\
  \ 512KB，因为它必须适应低端 640KB 的内存空间。\n\n`vmlinuz` 和 `vmlinux` 文件是通过使用 `zImage` 选项编译内核生成的，该内核被设计为解压到上述低\
  \ 640KB 的内存中。\n\n随着内核功能和特性的增长，内核镜像的大小也随之增大，它们很快就无法放入低内存的可用空间内；因此，采用了 `vmlinuz` 方法。内核使用\
  \ `bzImage` 选项编译，这个名字听起来与 `bzip2` 有关，但并非如此。它会生成一个压缩的内核镜像，该镜像在启动前会被解压。这意味着镜像将无法放入低内存，因此它必须被加载到高内存中（即\
  \ 1MB 以上）。\n\n## 配置 GRUB2\n\nGRUB2 的配置文件名为 `grub.cfg`（在某些发行版中为 `grub2.cfg`）。在此文件中，你可以找到设置系统启动时看到的菜单的配置。\n\
  \n### 注意\n\nGRUB 使用 `menu.lst` 和 `grub.conf` 进行配置。GRUB 和 GRUB2 之间的语法发生了变化，你所在发行版的默认配置看起来可能更像代码而不是配置文件。\n\
  \n配置 GRUB2 比配置 GRUB 更复杂。在 GRUB 中，你只需要编辑 `grub.conf` 即可；而在 GRUB2 中，`grub.cfg` 是通过脚本生成的，你必须查看这些脚本来了解如何进行更改。`grub-mkconfig`\
  \ 命令为你生成配置文件，并可以可选地接收输出文件的路径。如果你不指定文件，输出将显示在你的屏幕上，如示例 1-3 所示。\n\n#### 示例 1-3–`grub-mkconfig`\
  \ 命令输出\n\n```\n# grub2-mkconfig -o /boot/grub/grub.cfg\nSourcing file `/etc/default/grub'\n\
  Sourcing file `/etc/default/grub.d/init-select.cfg'\nGenerating grub configuration\
  \ file ...\nFound linux image: /boot/vmlinuz-5.4.0-91-generic\nFound initrd image:\
  \ /boot/initrd.img-5.4.0-91-generic\nFound linux image: /boot/vmlinuz-5.4.0-80-generic\n\
  Found initrd image: /boot/initrd.img-5.4.0-80-generic\nAdding boot menu entry for\
  \ UEFI Firmware Settings\ndone\n```\n\n`grub-mkconfig` 的输入是 `/etc/default/grub`\
  \ 和 `/etc/grub.d/` 中的文件。前者设置了各种默认值；后者是一系列 shell 脚本：\n\n```\n# ls /etc/grub.d/\n\
  00_header    05_debian_theme  10_linux  10_linux_zfs  20_linux_xen\n30_uefi-firmware\
  \  30_os-prober  41_custom  40_custom  README\n```\n\n每个脚本按顺序执行，它们所有的输出都会合并到主输出中。如果你想为启动管理器菜单添加一个自定义部分，可以查看名为\
  \ `40_custom` 的文件作为示例，扩展你在那里发现的内容或添加自己的内容。\n\n## 启动时的常用命令\n\n在启动 Linux 时，你通常希望在过程开始时更改选项，例如更改默认的\
  \ `runlevel` 或 `target`，禁用或启用特定的硬件功能，或者为允许 Linux 正常加载的硬件设置特定模式。\n\n### 注意\n\n在命令行提示符或启动选项提示符输入的参数将在初始化时直接传递给内核。这些提示符通常位于启动过程初期，提供了提供了输入任何参数的机会。某些发行版被配置为显示启动屏或标志，你必须找到哪个按键允许输入启动参数。\n\
  \n以下是一些常见的 Linux 启动选项：\n\n- `vga:` 允许你将帧缓冲区分辨率设置为给定模式，例如 `vga=2`，这在历史上用于处理困难的笔记本\
  \ LCD 屏幕。\n- `apm:` APM（自动电源管理）默认开启。在启动过程初声明 `apm=off` 或 `noapm` 可以增强系统的兼容性。这应该仅在供应商或发行版常见问题解答中指示时才这样做。\n\
  - `init:` 在开始时指定 `init` 会导致 `/sbin/init` 进程成为系统上运行的第一个进程。在不存在 `init` 的初始化方案中这可能无法正常工作。\n\
  - `panic=#seconds:` 发生 panic 错误后，内核默认不会重启，这可能导致系统处于禁用状态，直到技术人员物理接触到它。如果发生 panic，内核将等待指定的秒数然后重启并尝试正常加载。\n\
  - `single` 或 `1:` 这些选项会导致系统跳过到默认 runlevel 的完整初始化，而是进入故障排除或简单的根级别（root-level）状态，在这种状态你是\
  \ root 用户，且运行的进程极少。\n- `2, 3, 4, 或 5:` 这些选项可以在 GRUB 提示符处输入，导致系统初始化后移动到指定的 runlevel，或者在\
  \ systemd 的情况下，移动到与指示的 runlevel 数字相匹配的指定 target。\n- `ro` 或 `rw:` `ro` 选项导致根分区以只读模式挂载，以便在发生错误时可以在根分区上运行\
  \ `fsck`。`rw` 参数确保根文件系统以读/写模式挂载，这是默认状态。\n- `mem=xxxxM:` 这种旧的系统启动参数简单地设置即将启动的系统可以访问的内存量。当你怀疑某个内存单元损坏或要测试具有特定内存量的系统时（例如测试机顶盒配置或其他受限硬件设备），可以使用它。\n\
  \n### 注意\n\n你必须查看特定发行版和启动管理器的启动参数文档，以确定哪些选项是合适的。\n\n## 当内核 Panic 时\n\nLinux 内核是一个复杂的软件和服务集合。事情并不总是进展顺利。例如，与硬件、驱动程序或软件包相关的某些可能会出现异常，或者内存地址可能被不当地覆盖。\n\
  \n就像弹射可以让你安全地离开故障的战斗机一样，内核的设计是在发生导致无法继续正常处理的条件时发生 panic（恐慌）或停止运行。\n\n### 识别内核 Panic\n\
  \n你通常可以根据几种症状判断是否发生了内核 panic。最常见的症状是系统显示内核 panic 消息，该消息通常包含关于 panic 发生时正在运行程序的追踪信息。另一个常见迹象是神秘的重启，除非日志文件中包含有关该问题的有用信息，否则系统管理员往往无法察觉。\n\
  \n由于导致内核 panic 的问题非常严重，系统通常无法继续正常运行，因此系统要么发生 panic 并向控制台显示追踪信息并停止其他功能，要么自启动重启。无论何种情况，系统在\
  \ panic 情况下最后执行的操作之一都是尝试向日志写入已发生 panic 信息。\n\n### 获取更多信息\n\n如果你正经历多次内核 panic，可以尝试获取更多信息，一个步骤是查看你的系统日志配置，并尝试移除任何目标（日志文件）前的前连字符\
  \ `-`，这样日志磁盘写入就不会被缓存或存储，从而让其他更重要的磁盘写入完成。\n\n![Images](img/key_topic_icon.jpg)\n\n\
  ### 内核 Panic 原因\n\n什么导致了内核 panic？遗憾的是有很多可能，包括以下几种：\n\n- 损坏的硬盘扇区\n- 不完整、损坏或截断的内核模块\n\
  - 文件或目录权限问题\n- 引用无效或不存在的内存地址\n\n\n\n\n\n- 包含关键代码的内存地址引用\n- 硬件故障，尤其是缺陷或故障的 RAM\n\
  - CPU 故障或未处理的错误\n- 硬件的插入或移除导致冲突、尝试加载缺陷或不完整的模块\n\n一个经常被忽视但发生频率高到值得特别提及的原因是系统过热；无论是带有宿主操作系统的硬件，还是虚拟化或容器化系统的底层硬件，物理过热或冷却问题都可能导致系统恐慌（panic）或停止以避免进一步的损坏。\n\
  \n### /dev 中的设备类型\n\n设备存在于 `/dev` 目录，尽管其中的内容实际上是作为设备访问点的文件。当系统启动时，内核及其子进程将遍历 BIOS\
  \ 并找到连接的物理设备，然后将这些真实设备与 `/dev` 目录中相应的特殊文件相匹配。“特殊文件”是指这些**不是**简单的文件或目录，它们具有特殊含义，因为它们是系统上真实设备或伪设备的连接点。\n\
  \n设备目录文件分为 4 类主类型：`block`（块设备）、`character links`（字符链接）和 `directories`（目录）。块设备和字符特殊文件的主要区别在于它们如何与其连接的设备发送和接收数据。\n\
  \n`block device`（块设备）通过驱动程序通信，并在运行时发送或接收一整块数据，典型示例是磁盘、CD 或 DVD 或其他存储设备，或者带有文件系统的设备，因为它们是由数据块组成的。\n\
  \n`character device`（字符设备）一次发送和接收单个字符，其特征（看到我这里的双关了吗！）是如扫描仪或键盘之类的设备，这些设备以非块模式进行通信。\n\
  \n`/dev` 目录中的（子)`Directory`（目录）文件通常指向一组具有给定类型的特殊文件，例如 `/dev/input` 目录将包含与生成事件的设备相关的特殊文件，例如带有\
  \ x-y 坐标事件的鼠标指针。\n\n`/dev` 目录中的链接文件（Link files）非常浅显易懂，它们是指向系统其他地方文件的符号链接或指针，例如 `/dev/cdrom`\
  \ 文件，它在我们的测试系统上指向 `/dev/sr0` 或系统上检测到的第一个 SCSI 类型 CDROM。\n\n`/dev` 目录中存在若干个相关的（且可测试的！）独立文件，包括：\n\
  \n- `/dev/null`：`/dev/null` 特殊文件被称为系统的“位桶”或“黑洞”，它字面上提供一个丢弃输出的方法，例如丢弃由 `find` 命令产生的（大量的）不需要的错误。它仅用于丢弃标准输出或标准错误。\n\
  \n- `/dev/zero`：`/dev/zero` 特殊文件存在是为了提供无限的空字符序列或空白噪声，用于出于测试目的向源发送非内容数据，或者用不包含任何内容的字符数据对设备初始化。`/dev/zero`\
  \ 特殊文件与 `/dev/null` 特殊文件的区别在于，你可以对 `/dev/zero` 执行读取和写入操作，而 `/dev/null` 只能接受写入操作，无法被读取。\n\
  \n- `/dev/urandom`：`/dev/urandom` 特殊文件用于产生加密级的随机数数据，用于需要数据随机化的场景。从各种硬件源收集的噪声越多（风扇噪音波动、鼠标移动、热噪声或任何可用于向生成器提供随机性的因素），`/dev/urandom`\
  \ 生成的数字就可以用于加密密钥生成或任何需要稳定供应随机字符的地方。\n\n总结来说，/dev 目录中有许多文件，其主要类型是字符和块特殊文件，一些较重要或关键的特殊文件是前述的\
  \ `/dev/null`、`/dev/zero` 和 `/dev/urandom` 文件。\n\n### 从源码安装软件\n\n`Source code`（源代码）是所有计算的核心，而访问源码是\
  \ Linux 和开源软件的关键。如果没有源码，你就无法检查代码中的 bug、安全问题或其他缺陷。\n\n当程序员编写源代码时，他们通常会对其进行 tar 打，或者创建一个名为\
  \ `tarball` 的压缩包。`Tarballs` 通常使用 `tar` 命令和一些开关创建；然后将软件发布在互联网上，以便其他人可以尝试并报告 bug。\n\
  \n以下是通过源码安装程序的优点：\n\n- 它允许检查代码中的缺陷、bug 及其安全问题。\n- 它比二进制包更早可用。\n- 编译可以针对当前系统对生成的程序进行优化。\n\
  - 它满足了追求前沿的需求（Beta 测试可能很有趣！）。\n\n通常情况下，你不会以源码 tar 包以外的任何格式看到处于深度开发中的程序。在代码至少达到发布级或后期\
  \ beta 稳定性之前，将源代码打包是耗时且笨重的。\n\n从源码安装程序后，你会对这个过程更加得心，因此从小型程序开始并逐步增加。例如，你可能会下载并安装\
  \ `rdesktop` (`http://www.rdesktop.org`) 并在几分钟内完成整个过程（包括编译时间）。\n\n该量尺的另一端是从源码安装\
  \ Apache 或 Samba，这是一个长得多且更复杂的过程。\n\n以下是通过源码安装程序的缺点：\n\n- 它需要更复杂的安装过程。\n- 必要的依赖项可能不存在，或者非常难以解决。\n\
  - 文档通常编写得糟糕，有时只有一个 readme 或一个 install 文件可用。\n- 卸载源码包可能很困难，特别是如果包的 makefile 没有卸载程序，这意味着你需要手动查找并删除程序包文件。\n\
  \n从源码安装时，可能会发生许多冲突和依赖问题。在各种发行版厂商作为产品的一部分发布该包之前，这通常不适合心细胆弱的人。如果你的目标是稳定性，请等待最终的发布；否则，你可能会花费数小时来寻找缺失的库和其他所需的文件。\n\
  \n当性能和安全有需要时，你应该使用源码安装。\n\n#### 源码安装的组件\n\n源码 tar 包通常包含以下内容：\n\n- `Configure script`（配置脚本）：它检查系统并配置\
  \ makefile。\n- `Makefile`：此文件控制安装位置、参数和其他变量。\n- `Source files`（源文件）：这些是源文件的实际目录。\n\
  - `Readme`：`readme` 文件包含关于安装过程的重要信息。\n- `Install`：通常包含实际的安装指令；并非所有源码安装都包含它。\n- `Install\
  \ script`（安装脚本）：这通常是一个可以运行执行安装的单个脚本。\n\n#### Makefile\n\n`makefile` 是一组指令和编译参数，使得安装成为可能。在被\
  \ `configure script` 更新后，通常运行 `make` 命令然后运行 `make install` 命令来编译并安装软件。\n\n引用 `make`\
  \ 的手册页：\n\n`make` 工具的作用是自动确定大型程序中哪些部分需要重新编译，并发布重新编译它们的命令。\n\n`makefile` 通常包含以下部分：\n\
  \n- `Platform`：系统的平台\n- `Debug`：如何处理错误\n\n\n\n\n\n- **优化 (Optimize):** 由 `.configure`\
  \ 自定义的项\n- **源 (Source):** 源代码文件所在的位置\n- **目标 (Targets):** All, install, clean,\
  \ dist 等\n\nmakefile 的目标（Targets）值得稍微关注，因为人们对它们的组成存在一些困惑。`make` 命令本身通常只编译源代码，而不进行任何其他操作。运行带有\
  \ `clean` 目标的 `make` 命令通常会删除之前编译代码时产生的任何临时文件。如果你运行带有 `install` 目标的 `make` 命令，它会将编译后的代码放入路径中正确的目录，一直到安装好软件为止。\n\
  \n一个典型的 makefile 具有以下路径和变量（尽管这些可能随程序而异）：\n\n```\ninstall-prefix = .\nbin_dir = $(install-prefix)/bin\n\
  uparm_dir = $(install-prefix)/lib/uparm\ninclude_dir = $(install-prefix)/include\n\
  ```\n\n这些指令告诉安装和其他目标将程序的各个部分放在哪里。`$(install-prefix)` 表示在编译时，软件将存储在当前目录的子目录下——例如\
  \ `./bin`、`./lib/parm` 和 `./include`。\n\n### 源代码编译示例\n\n在此示例中，一个简单的程序将在默认 Linux\
  \ 系统上进行编译和安装。（你必须安装 `gcc` 编译器以及相关的开发工具和库才能编译源代码。）以下是操作步骤：\n\n**步骤 1.** 打开浏览器并访问\
  \ [`www.rdesktop.org`](http://www.rdesktop.org)。\n\n**步骤 2.** 点击 `Download` 链接。\n\
  \n**步骤 3.** 点击最新的稳定版本。\n\n**步骤 4.** 从下载链接列表中选择一个离你最近的地点，然后点击页面右侧 `Download` 列下方的的小页面图标。\n\
  \n**步骤 5.** 按照提示时，将源代码放在你的用户主目录下。通常情况下，你只需点击正在使用的浏览器中的 `Save` 按钮即可。\n\n**步骤 6.**\
  \ 打开 shell 会话或 `xterm` 客户端。\n\n**步骤 7.** 导航到包含压缩文件的目录。\n\n**步骤 8.** 解压存档文件。\n\n\
  **步骤 9.** 滚动停止后，切换到源代码目录：\n\n```\ncd sourcedir\n```\n\n**步骤 10.** 运行 `ls` 命令并注意存在哪些文件。\n\
  \n**步骤 11.** 使用以下命令运行 `configure` 脚本：\n\n```\n./configure\n```\n\n**步骤 12.** 运行\
  \ `make` 命令来编译软件。\n\n**步骤 13.** 软件编译完成后，使用 `make install` 命令安装程序。\n\n这些是从源码代码安装应用或命令所需的这些步骤。为了准备\
  \ Linux+ 考试，你不一定需要从源码进行安装；只需确保你了解典型源码安装的步骤，如下所示。\n\n### 存储概念\n\n![Images](img/key_topic_icon.jpg)\n\
  \n在用户可以使用磁盘存储信息之前，系统管理员必须执行几项典型任务：\n\n**步骤 1.** 安装设备。\n**步骤 2.** 分区设备。\n**步骤 3.**\
  \ 在分区（区）上创建文件系统。\n**步骤 4.** 创建或选择挂载点（目录）。\n**步骤 5.** 挂载文件系统。\n**步骤 6.** 配置文件系统启动启动挂载。\n\
  **步骤 7.** 设置权限。\n\nLinux 设备与 `/dev` 目录下的设备文件关联。该目录下有许多预先存在的文件。正如在本章之前看到的，硬盘有一个类似于\
  \ `/dev/sda` 的对应设备文件。此硬盘被称为“原始设备”。该设备被分为一个或多个分区，例如 `/dev/sda1`。对分区应用文件系统，然后将设备挂载到文件系统的其余部分，使存储变得可用。最后，配置权限以允许必要的人访问。\n\
  \n#### 分区 (Partitions)\n\n在大多数现代系统中，你将使用两种分区方案：主引导记录 (MBR) 和 GUID 分区表 (GPT)。这两种技术之间存在几处差异，但最重要的通常被认为是分区结构本身。\n\
  \n**注意 (Note)**\n\n在考试中，你可能会被置于一个场景，必须识别详细说明的分区方案类型并从列表中选择该答案；或者相反，被告知你正在使用特定类型，并必须从一组可用答案中识别出其特征。\n\
  \n##### MBR\n\n使用 MBR（主引导记录）的系统，每个磁盘最多可以有四个主分区，在需要超过四个分区的情况下，可以将其中一个主分区槽交换为扩展分区。扩展分区可以进一步划分为更多分区，称为\
  \ `逻辑分区` (logical partitions)。\n\n每个磁盘只能使用一个扩展分区。扩展分区可以包含无限数量的逻辑分区，尽管有很多警告建议将数量控制在\
  \ 12 个左右。\n\n扩展分区内部的逻辑分区与主分区几乎相同；它们恰好只存在于扩展分区内部。主分区和逻辑分区之间没有感知上的区别，除了编号、在磁盘上的位置以及\
  \ Linux 机器的启动文件应该存在于主分区这一事实之外。\n\n逻辑分区的存在是为了绕过 MBR 四个分区的限制。\n\n#### GPT\n\nMBR 分区方案已经存在很长时间了，并为\
  \ x86 架构四个主分区的限制提供了一个解决方案。现代系统支持一种名为 GPT 的较新分区方案。与 MBR 不同，GPT 没有四个主分区的限制。因此，不需要扩展分区或逻辑分区。\n\
  \n使用 GPT 时仅限制为 128 个分区。请注意，某些旧的分区工具（如 `fdisk` 实用程序）不支持 GPT。\n\n#### 数据存储方法 (Data\
  \ Storage Methods)\n\n大多数计算机系统在存储设备上存储数据具有相同的通用方法，它们可能会有不同的称呼，但底层概念和许多实践是相同的。\n\n\
  总结这些方法，它们是：\n\n- 块存储 (Block Storage)\n- 文件存储 (File Storage)\n- 对象存储 (Object Storage)\n\
  \n![Images](img/key_topic_icon.jpg)\n\n##### 块存储 (Block Storage)\n\n文件系统传统上使用块或块存储在磁盘或存储介质上存储数据。每个块被单独处理，分配一个唯一标识该块的标识符，并使其更容易分发或存储无论是连续、非连续甚至跨平台或跨介质的数据。\n\
  \n块使得数据可以存储在任何地方，而计算设备上的存储子系统负责按照顺序和从正确的位置跟踪、访问块，并将块中的数据提供给设备上的上层存储机制使用。\n\n块存储由于其效率和可靠性，通常与\
  \ SAN（存储区域网络）设备关联，并且几乎总是通过访问访问点访问，或者最常见的是通过连接或“前端”服务器系统使用，用户将连接到该系统、挂载共享文件系统，并将其用于远程网络存储。\n\
  \n块存储按块进行读写，除了非常基础的级别外不处理元数据，并且非常适合大块数据访问，例如非常大的媒体文件和数据库。块存储可能相当昂贵。\n\n\n\n\n文件存储（File\
  \ Storage）是比块存储（Block Storage）更高级的数据存储层。磁盘可能由块（大小均匀的存储单元）组成，而文件系统存在于这些块存储的部分或全部之上，并包含了我们熟悉的文件、目录以及这些内容的层级结构。\n\
  \n文件和目录对我们来说非常熟悉，就像一张纸代表一个文件，而目录是一个文件夹，或者存储柜里的一个抽屉。\n\n文件存储，或者说充满文件和目录的文件系统，看起来是一个单一的结构，我们可以对其进行导航、访问数据并进行更改，但该结构实际上可能由多个构建在多个不同块设备之上的文件系统组成，而且它们在物理位置上可能并不相邻，与它们所构成的层级结构也不接近。\n\
  \n文件存储允许在非常详细的级别对文件进行更改、更新和修改，例如更新文件中的单个单词或许多页面，而“块”则必须作为一个整体进行更改。文件存储适用于合理大小的数据集，但对于非常大型的数据集，块存储更好且更快。\n\
  \n![Images](img/key_topic_icon.jpg)\n\n### 对象存储 (Object Storage)\n\n`Object storage`(#ch01.xhtml_key08-a)\
  \ 是一种复杂得多且功能丰富的数据存储方法，因为它包含了关于所存储内容最多的元数据或特定且可操作的信息。以媒体文件为例，它对人们的访问方式有许多不同的访问级别，还可能包含关于该媒体文件产生地、使用的软件、作者等许多元数据。\n\
  \n这种存储类型中的对象（Objects）几乎是完全自包含的，因此它们的物理位置并不如它们与其他对象之间的相互关联或拟合方式重要。\n\n对象存储通常按需访问，这使其具有成本效益，也是离线云服务提供者的青睐。它的扁平化结构、适用于非动态数据、能够扩展到海量数据集，以及可以使用搜索准则查找对象（而不是读取和解析大型索引），这使得查找所需对象变得非常快速。\n\
  \n对象只能通过写入或重写整个对象来修改，它们在混合数据库环境中的表现并不理想，因为它们的访问和写入方式非常不同。\n\n### FUSE (用户态文件系统 Filesystem\
  \ in Userspace)\n\n传统上（也就是“很久以前！”），文件系统主要或只能在操作系统的内核区域处理，这使得用户很难创建自己的文件系统。如果目标是对例如服务器系统上发生的事情进行绝对控制，那么这种方案可能是实现更安全系统的一种，因此（从理论上讲）不太可能因为普通用户的鲁莽或不明智的操作而导致崩溃。\n\
  \n#### 为什么使用 FUSE？\n\n`FUSE`(#ch01.xhtml_key09-a)，或者说用户态文件系统，是一种允许正如名称所示，在用户态（或在标准用户的控制下）创建文件系统的方法。虽然为了确保系统尽可能运行可用，服务器系统应该尽可能具有预测性，但许多\
  \ Linux 系统位于终端用户、开发者和其他许多类型的用户手中，能够让用户独立创建并管理文件系统，对于许多场景来说都是非常方便且强大的。\n\n#### 处理\
  \ FUSE 用户请求\n\nFUSE 文件系统由一个程序（处理器，或中间程序）管理，该程序是文件系统在创建、管理或读写时发生的所有操作的中间人。该处理程序必须被内核感知并与之交互；当与文件系统进行交互时，用户对文件系统的请求将从内核发送到处理程序，然后由处理程序与被处理的文件系统进行交互；当它向用户发送响应时，这些响应将通过内核返回，然后交给发出请求的用户或进程。\n\
  \n![Images](img/key_topic_icon.jpg)\n\n#### 可能的 FUSE 应用/用途\n\nFUSE Des 所需的可能应用或用途列表包括但不限于：\n\
  \n* `NTFS`（Windows 文件系统）\n* `LTFS`（线性磁带文件系统）\n* 分层文件系统（在给定文件系统上叠加 `FUSE`）\n* 虚拟压缩文件系统\n\
  * 备份和归档文件系统\n* 远程文件系统（包括 `JuiceFS`、`MooseFS`、`SSHFS` 等）\n* 分布式文件系统（`Lustre Clustering`、`GlusterFS`、`ObjectiveFS`）\n\
  * 其他许多用途广泛的文件系统\n\n注意\n\nFUSE 也适用于 Windows 系统的多种，但这不是 Linux+ 考试的内容！\n\n### RAID\n\
  \n`RAID`(#ch01.xhtml_key10-a) 或独立磁盘冗余阵列（Redundant Array of Individual Disks）对于需要磁盘和存储在系统中尽可能持续可用的操作人员来说，是一项重要特性。当硬盘故障时，通常磁盘上的所有数据都会丢失。某些专业人士可能能够恢复部分数据，但这可能非常耗时且昂贵，而且专业人士最终可能无法恢复你真正的数据。\n\
  \n廉价磁盘冗余阵列（RAID）是一种最初设计用于解决硬盘故障问题解决方案的技术。原始的 RAID（现在称为 `RAID 1`）在两块硬盘之间镜像数据。结果是，如果其中一块硬盘故障，数据在第二块硬盘上可用。\n\
  \n![Images](img/key_topic_icon.jpg)\n\n#### RAID 级别\n\n自从原始 RAID 创建以来以来，又创建了其他几种\
  \ RAID 级别，我们只包含了常用实践中的那些：\n\n* `RAID 0`：此级别不提供冗余，而是通过将多个硬盘（或分区）合并为单个设备来增加可用存储空间。例如，三块\
  \ 30GB 的硬盘可以产生一个具有 90GB 存储空间的 `RAID 0` 设备。数据以条带形式写入每个物理设备（硬盘/分区）中，这要求每个物理设备的大小必须相同，以避免浪费存储空间。`RAID\
  \ 0` 可以提高从设备中读取数据的性能。\n* `RAID 1`：此级别是对两个驱动器进行镜像，并将相同的数据写入两个设备，这需要两次写入；但当需要从 `RAID`\
  \ 读取数据时，在机械硬盘存储上，将使用读写头离数据位置最近的磁盘，这可以显著提高数据读取速度。数据卷的大小限于最小磁盘的大小，并且不会在不匹配的磁盘上使用额外空间。\n\
  * `RAID 3`：此级别将数据条带化到几块磁盘上，并有一块专用磁盘提供校验或数据，这些数据可以在磁盘故障时保持卷的运行。这种类型的 RAID 有一些显著的缺点，因为它要求磁盘保持同步并在每块磁盘的相同位置存储数据。它对于大型连续的未压缩数据集非常出色，但对于更具随机性的较小读写操作来说并不理想。\n\
  \n\n\n\n- **RAID 5:** 这一级别提供了更高效的物理存储设备利用率。与 `RAID 1` 将所有数据完全镜像到所有物理存储设备不同，`RAID\
  \ 5` 将不同的数据写入每个物理存储设备，但其中一个设备除外，该设备用于存储校验数据。当某个物理存储设备丢失或损坏时，可以使用校验数据和其他存储设备上的实际数据来恢复该设备上的数据。`RAID\
  \ 5` 至少需要三个存储设备，并且可能会对系统性能产生负影响，因此软件 RAID（由内核执行的 RAID）并不常用。然而，硬件 RAID（由独立的处理芯片执行的\
  \ RAID）在高端服务器上常见。\n\nRAID 设备通过使用 `mdadm` 命令创建，该命令在文中另有介绍。就当前主题（设备映射和设备文件位置）而言，你应该意识到特定的设备名称与\
  \ RAID 设备相关。这些设备名称以 `/dev/md` 开头，并具有 0 到 31 之间的数字型值。当你使用 `mdadm` 命令时，你会将 RAID 分配给一个“MD\
  \ 设备”，例如 `/dev/md0` 或 `/dev/md1`。（注意，在这种情况下 `md` 代表短语 `元数据`。）\n\n![Images](img/key_topic_icon.jpg)\n\
  \n## 镜像 (Mirroring)\n\n在 RAID 世界中，镜像（或 `RAID 1`）是指你有两个磁盘，被配置为看起来像单个磁盘或卷，通常通过软件实现，也可以通过硬件实现。例如，可以将两个磁盘配置为一个卷，进行分区，然后在上面写入文件系统，卷中的每个磁盘将包含完全相同的文件系统和数据，或者被称为镜像。\n\
  \n镜像是非常安全的，因为即使整个磁盘发生故障，也有一个精确的副本可以在无需或很少重新配置的情况下使用。镜像磁盘具有减慢写入速度的效果，因为对卷或数据存储位置的每次写入都必须有两个写入函数（每个磁盘一个）。镜像对从磁盘读取具有相反的影响，因为系统将从能够最快访问所需数据的任意磁盘上进行读取。\n\
  \n### 注意\n镜像在 SSD（固态设备）磁盘存储上的工作方式略有不同，但对于使用的任一类型设备，镜像的概念实际上是相同的。\n\n![Images](img/key_topic_icon.jpg)\n\
  \n## 分带化 (Striping)\n\n分带化 的概念是将数据段或数据带存储在多个设备上，这样通过磁盘控制器向存储数据带的设备发出多次读取或写入，就可以更高效地读取任何给的数据块带。\n\
  \n与镜像类似，分带化主要在旋转盘器存储设备上被发明和实现，它在固态硬盘上的效果并不明显或有效，因为它们没有旋转盘片或可以位于任何位置的读写头。从 SSD 读写数据只需对数据存在或将存在的位置发出读取或写入请求。\n\
  \n分带化的另一个用途是取两个磁盘并将总存储空间合并为一个卷，或者让它们看起来像单个磁盘，其大小为各个磁盘大小之和减去用于格式化结构的常规空间。\n\n分带化（或\
  \ `RAID 0`）可能会产生更大的虚拟或表观磁盘 (N+N)，由于同时或紧密并行发生多次可能的读取或写入，还可以获得更快的访问时间。跨多个磁盘进行分带以构建更大卷的主要危险是，其中任何设备的丢失都会导致无法访问整个卷。想象一座横跨河流的桥有\
  \ 3 个主支撑柱，如果其中一个主支撑柱被移除，即使另外两个仍然存在也没有区别，卷或桥的完整性或使用能力都会丧失。\n\n![Images](img/key_topic_icon.jpg)\n\
  \n## 校验 (Parity)\n\n现在我们已经定义了镜像和分带化并（希望）消除了一定的神秘感，让我们将它们与校验的概念结合起来，其中至少有一个磁盘用于为\
  \ RAID 卷提供容错，或者使用至少第三个磁盘或设备包含前两个磁盘足够的数据，以维持对包含文件系统和数据的卷的访问。\n\n一个非常简单的示例是系统中有 3\
  \ 个磁盘，并在 RAID 3 布局中使用所有三个。磁盘 1 和磁盘 2 是存储卷和数据的磁盘，磁盘 3 的计算结果为持有足够的磁盘 1 和磁盘 2 的数据，以便在其中一个发生故障时能够维持对数据卷的访问和数据的完整性。\n\
  \n将这一切整合在一起，RAID 5 磁盘布局将包括跨涉及磁盘的数据分带，以及存储校验数据，以便 3 个磁盘中的任何一个发生故障，数据卷仍然存在且可用。\n\n\
  ### 注意\nRAID 从简单到非常复杂之间是轻而易举的，因此在准备考试时请记住各种级别，你可能会看到引用我们提到的级别的问题，特别是 `RAID 2`、`4`\
  \ 和 `10`，非常特殊且不常用。\n\n## 列出你的硬件信息\n\n你运行的 Linux 系统包含大量的宝贵信息，你可以使用一组主要称为 `ls*` 命令的命令轻松地查询这些信息。\n\
  \n运行的 Linux 系统信息的主要来源是 `/proc` 目录，但它是一个由文件、目录和晦涩数字组成的巨大层级树，因此 `ls*` 命令是挖掘这组信息的极佳方法。\n\
  \n### Proc 文件系统\n\nUnix 有这样一种“一切皆文件”的哲学，这在某种意味着系统和进程的硬件信息和状态信息都暴露在文件系统中。在 Linux\
  \ 中，这起始于 `procfs`，它通常挂载在 `/proc` 上。在这个目录下，你会发现系统上的每个进程都有一个包含其自身信息的目录。必须保持状态才能工作的功能（例如跟踪系统处理的网络连接的防火墙）也通过\
  \ `/proc` 暴露其信息。\n\n此外，`procfs` 包含有关系统硬件的细节。如 `/proc/ioports`、`/proc/dma` 和 `/proc/interrupts`\
  \ 等文件可以向调查用户或管理员显示许多关于系统配置的相关信息。\n\n顺便说，`procfs` 被称为伪文件系统。它看起来像设备，但不存在任何真实的硬件上。它只是以定义的格式向用户暴露内核信息的方法。\n\
  \n当发生错误或冲突时，许多命令对于解决输出中显示的冲突至关重要。通过以下命令直接从 `/proc` 目录查看信息：\n\n```\ncat /proc/interrupts\n\
  cat /proc/ioports\ncat /proc/dma\ncat /proc/usb\ncat /proc/pci\n```\n\n此外，一系列以 `ls*`\
  \ 开头的命令收集相同的信息并以更易于人类的格式呈现。\n\n### 注意\n在 Linux+ 考试中有 3 个主要工具：`lsusb`、`lspci` 和 `dmidecode`，但了解所有能够显示系统信息的命令是非常重要的，因此你也会看到其余值得的命令。\n\
  \n![Images](img/key_topic_icon.jpg)\n\n### 注意的 ls* 命令\n\n相关的命令如下：\n\n- `lscpu`:\
  \ 提供有关 CPU 的细节，例如每个插槽和内核的数量和速度。\n- `lspci`: 显示关于 PCI 总线和设备的大量信息。它可以识别内核未知的总线上的设备，并为配置它们提供地址信息。\n\
  \n\n\n\n\n- `lsscsi`: 显示系统上 SCSI 设备的信息（如果系统支持 SCSI）。它可以告诉你系统是否能看到磁盘。\n- `lsdev`:\
  \ 显示系统识别的设备。\n- `lsraid`: 显示系统上的 RAID 设备。\n- `lsusb`: 显示系统的 USB 信息和设备。\n- `lsblk`:\
  \ 显示连接到系统的块设备（磁盘）。\n- `dmesg`: 显示“内核环形缓冲区”，它是启动过程中创建的消息集合。这是确定系统在启动期间识别了哪些设备的绝佳工具。\n\
  \n![Images](img/key_topic_icon.jpg)\n\n### procfs 的朋友们\n\n挖掘 `/proc` 目录及其内容（通过 `procfs`\
  \ 文件系统进行挂载）是向用户暴露内核信息最流行的方法，但还有其他选项。`/proc` 下的文件是无结构化的，包含了关于进程和设备的信息。sysfs [sysfs]\
  \ 的目标是通过将设备数据迁移到 `/sys` 来解决这些缺点中的。数据仍然可能同时存在于两者中，且诸如 `lspci` 等设备工具仍在使用 `/proc`。\n\
  \n### dmidecode 命令\n\n`dmidecode` 命令主要与 `/sys` 目录及其内容配合，它是 Linux+ 考试中可能会遇到的项目之一，因此让我们来看看它是什么、它从哪里获取信息，以及你可以做什么来更好地显示所有这些极其详尽且海量的系统信息！\n\
  \n![Images](img/key_topic_icon.jpg)\n\n### 显示 DMI 表信息\n\n`dmidecode` 命令旨在查询 DMI\
  \ DMI（桌面管理界面）表，该表包含了从系统 BIOS 收集的信息，并以内存表或一组表的形式表示，允许进程和命令访问这些信息，而无需诉直接硬件查询。\n\n\
  为了更好地理解 `dmidecode` 命令查询和显示的内容，请将大多数返回的信息想为如下格式：\n\n```\nHandle, Type, Size\nDecoded\
  \ Value\n```\n\n`dmidecode` 命令返回的一个条目示例：\n\n```\nHandle 0x0005, DMI type 16, 23\
  \ bytes\nPhysical Memory Array\n       Location: System Board Or Motherboard\n \
  \      Use: System Memory\n       Error Correction Type: None\n       Maximum Capacity:\
  \ 4 GB\n       Error Information Handle: Not Provided\n       Number Of Devices:\
  \ 1\n```\n\n你可以看到，前三项在第一行，其中 Handle 是表中的唯一标识符，type 显示信息的来源，size 则是表中该条目中包含的信息量。\n\
  \n熟悉 `dmidecode` 命令显示内容（以及你系统 DMI 表中的内容！）的一种极佳方法是将 `dmidecode` 通常返回的 100 多行输出通过诸如\
  \ `less` 命令的分页器进行处理，例如运行此命令：\n\n```\n$ sudo dmidecode | less\n```\n\n这将在 `less`\
  \ 分页器的上下文中显示从 DMI 表中收集的信息，在那个界面中，你可以向上和向下滚动，使用 PGUP 和 PGDN、Home 和 End 键，并根据你的需要进行搜索！\n\
  \n#### 注意事项\n\n记住何时命令可以作为标准用户运行，以及何时必须作为 root 用户或通过如 `sudo` 命令之类的权限提升机制运行是非常重要的。Linux+\
  \ 考试的命题编写者了解作为标准用户运行 root 级命令与作为 root 级用户运行之间的区别，因此在考试中请密切注意这一区别！\n\n### 总结\n\n\
  在 Linux+ 考试中，你可能会被要求阅读一个场景，然后从选项列表中确定最有效、最快或最安全的存储方法。你应该足够熟悉这些方法，以便根据对其用途的描述来识别它们。\n\
  \n### 考试准备任务\n\n正如引言中“目标与方法”部分提到的，你有几种准备考试的策略：这里的练习、第 23 章、“最终准备](#ch23.xhtml_ch23)”以及\
  \ Pearson Test Prep 在线软件中的考试模拟题。\n\n### 复习所有关键主题\n\n复习本章中最重要的主题，这些主题在页面外边距用“关键主题”图标标记。表\
