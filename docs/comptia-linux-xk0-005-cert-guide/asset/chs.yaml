  - 源代码\n- tarball\n- 对象存储\n- FUSE\n- RAID\n- 镜像 (Mirroring)\n- 条带化 (Striping)\n-\
  \ 校验 (Parity)\n- procfs\n- sysfs\n- DMI\n- 基本输入输出系统 (BIOS)\n- 主引导记录 (MBR)\n- 全局统一引导加载程序\
  \ (GRUB)\n- 逻辑分区\n- 元数据\n\n### 复习题\n\n这些复习题的答案在附录 A](#appa.xhtml_appa)。\n\n**1.**\
