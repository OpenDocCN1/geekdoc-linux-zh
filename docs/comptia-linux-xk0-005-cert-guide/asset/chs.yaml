  \n**b. `scp ./file1 mortimer@192.168.10.10/home/mortimer:`**\n\n**c. `scp file1\
  \ mortimer@192.168.10.10:~`**\n\n**d. `scp mortimer:file1 < scp @192.168.10.10`**\n\
  \n**6.** 在 `VIM` 编辑器中，除了上下箭头键，可以使用哪些键？\n\n**a. 使用 `k` 向上，`j` 向下**\n**b. 使用 `j` 向上，`k`\
  \ 向下**\n**c. 使用 `Ctrl+D` 向下，`Ctrl+U` 向上**\n**d. 使用 `j` 向上，`h` 向下**\n\n### 基础主题\n\
  \nLinux（以及它的前身 UNIX）系统几乎完全由文件组成，无论是文本、图形、数据库等普通文件，块或字符类型的设备文件、二进制程序或可执行脚本文件，而且不要忘记一种非常重要的文件类型：目录文件。\n\
  \n在职业生涯大部分时间内处理文件和由文件组成系统的系统管理员必须知道如何正确地执行大量文件和目录相关的任务，包括创建、修改、删除、列出、显示内容、查看、更改和设置权限、存档、解压缩、压缩和转换文件。\n\
  \n此外，系统管理员还需要能够创建空文件、编辑许多不同类型的文件以更改其内容，并能够使用可用工具在整个系统中导航，例如 `cd` 命令、目录指示符（`.` 和\
  \ `..`），以及使用 `tree` 命令和 `mc` (Midnight Commander) 等工具以有用且高效的方式查看其文件和目录结构。\n\n###\
  \ 文件和目录操作\n\n**注意**\n\nLinux+ 目标列出主题的顺序并不是我们这里要做的最佳流程，因此我深思熟虑地重新安排了主题，使其流程自然并符合逻辑，就像我处理任何一组目标所做的一样。\n\
  \n在 Linux 系统上正确处理文件和目录与其他任何任务一样重要，因为花在 Linux 系统上的大部分时间都是在命令行操作。作为一名优秀的系统管理员，你被期望知道如何创建、删除、编辑、设置权限、显示、移动、复制、链接和取消链接、查找和定位、确定文件和程序的类型，甚至确定两组文件和目录之间的差异。\n\
  \n![Images](img/key_topic.jpg)\n\n#### 操作 Linux 文件的技巧\n\n由于大多数用户和系统管理员来自 Windows\
  \ 或或其他操作系统的背景，为经验较少的 Linux 系统管理员提供一些快速的建议可能会有所帮助：\n\n- **隐藏文件并不是真的隐藏：**它们只是以 `.`\
  \ 开头，例如 `.bashrc` 和 `.bash_profile` 文件。除非你显式要求显示，否则它们通常是可见的，并且不会被 `rm -f .*` 等命令删除。\n\
  - **文件名可以包含多个点或没有点字符：**文件名 `this.is.a.long.file` 和 `thisisalongfile` 是完全合理且可能的。\n\
  - **文件名中的空格看起来很好，但输入起来很痛苦：**使用 `_` 或 `-` 代替空格，因为这比在所有空格前加 `\\` 更整洁、更更容易。（要在文件名中显示空格，系统会显示一个带有反斜杠前缀空格。）\n\
  - **文件扩展名不是强制性的：**然而，它们对于排序、选择以及 `copy/move/delete` 命令，以及快速识别文件类型是有用的。\n\n#### 基础导航\n\
  \n用于更改当前工作目录的命令 `cd` 被频繁使用，而了解如何在文件系统中移动是 Linux+ 考试的重点之一。\n\n\n\n\n\n以下命令简单地将你从所在的任何地方移动到\
  \ `/etc` 目录。这种移动使用了`绝对路径`，并且可以在任何目录内部使用：\n\n```\n# cd /etc\n```\n\n该路径之所以被称为绝对路径，是因为它定义了从文件系统根开始的路径。如果路径以斜杠（`/`）开头，你就可以很快判断它是一个绝对路径。\n\
  \n从当前目录移动到子目录既快速又简单。例如，这里是如何从 `/etc/` 目录的当前位置进入 `/etc/samba` 目录：\n\n```\n# cd samba\n\
  ```\n\n这被称为`相对路径`，因为你传递给 `cd` 命令的选项是相对于当前目录的。你处于 `/etc`，移动到 `samba` 就会让你进入 `/etc/samba`。如果你在\
  \ `/home` 中并运行 `cd samba`，除非 `/home/samba` 也存在，否则它无法工作。\n\n如果你对当前所在的位置感到困惑，可以使用\
  \ `pwd` 命令打印工作（当前）目录：\n\n```\n# pwd\n/etc/samba\n```\n\n`cd` 命令本身会将你带回主目录，无论你身在何处。波浪号（`~`）也表示“主目录”，所以\
  \ `cd ~` 将你带回主目录，而 `cd ~sean` 将将你带到 Sean 的主目录。\n\n### 高级导航\n\n获得一些复杂相对路径情况的经验是有好的。例如，假设你在目录\
  \ `/home1/user1` 中，想要进入目录 `/home2/user2`：\n\n```\n# tree /\n/\n|-- home1\n| `--\
  \ user1\n`-- home2\n `-- user2\n```\n\n### 你会使用哪种命令？\n\n记住你没有使用绝对路径，而是使用相对路径。答案是\n\
  \n```\n# cd ../../home2/user2\n```\n\n每一对 `..` 都会带你向上一级：第一个带你到 `/home1`，第二个将你置于根目录。从那里开始，使用的是相对路径。练习这种方法，并记住在这次练习中向上移动只会带到达\
  \ `/home1` 目录。这是一个相对路径，因为路径不以 `/` 开头。你最终到达的目录取决于你开始的位置。\n\n虽然这个相对和绝对路径的示例被用于切换目录，但它适用于任何提示输入文件名的情况。\n\
  \n此外，你可以使用单点字符 `.` 来表示当前目录，例如如果你尝试运行一个 `find` 命令，使用当前目录作为 `find` 命令参数的路径部分，如下：\n\
  \n```\n# find ./ -iname \"*.txt\"\n```\n\n此命令将从当前目录（无论在何处）开始搜索，并扩展到下方搜索。`.` 字符在将某些内容复制或移动到当前目录时也极其有用，例如以下命令会将\
  \ `/etc/hosts` 文件复制到当前目录：\n\n```\n# cp /etc/hosts .\n```\n\n正如你可能想象的那样，在许多命令情况下，能够引用当前目录非常有帮助，所以请不仅记住\
  \ `..` 表示上级目录，还要记住 `.` 表示当前目录！\n\n### 列出文件和目录\n\n`ls` 命令用于列出目录或文件或两者都是。\n\n如果你使用\
  \ `ls` 命令查看当前目录的多列输出，只显示文件或目录名称，而不显示关于文件的其他细节：\n\n```\n# ls\nfile1 file2 file3 file4\n\
  ```\n\n使用 `-l`（长格式）列表选项可以在单列中查看特定文件或目录或一组文件或目录的所有细节，如下：\n\n```\n# ls -l\ntotal 0\n\
  -rw-r--r-- 1 root root 0 Jan 24 18:55 file1\n-rw-r--r-- 1 root root 0 Jan 24 18:55\
  \ file2\n-rw-r--r-- 1 root root 0 Jan 24 18:55 file3\n-rw-r--r-- 1 root root 0 Jan\
  \ 24 18:55 file4\n```\n\n使用 `-l` 选项是使用 `ls` 命令并查看对象的权限、所有权和链接数的唯一方法。另一个可以提供此类信息的命令是\
  \ `stat` 命令，它一次只显示一个文件系统对象。\n\n使用 `ls` 命令的其他示例包括：\n\n- `ls /home/user`: 显示指定目录的普通列表。\n\
  - `ls -a`: 列出所有文件，包括隐藏的 `.` 文件。\n- `ls -d foo`: 仅列出名为 `foo` 的目录而不列出其内容。\n- `ls -i`:\
  \ 列出目标文件或目录的 inode 号。Linux 使用 inode 来表示磁盘上的文件；inode 将在本章稍后的*复制文件和目录* 章节中讨论。\n- `ls\
  \ -l`: 显示权限；链接以及日期、组和所有者信息。`权限` 决定了谁可以访问文件，并在[第 12 章]理解和应用访问控制中详细讨论。\n- `ls -lh`:\
  \ 显示文件大小的人类可读输出，单位为千字节、兆字节和吉字节，以及文件详细信息。\n\n组合选项可以产生实用的结果。例如，如果你需要查看当前目录中的所有文件（包括隐藏文件）、它们的权限和\
  \ inode 号，你将使用以下命令：\n\n```\n# ls -lai\n290305 drwxr-x--- 13 root root 4096 Jan 24\
  \ 18:55 .\n 2 drwxr-xr-x 20 root root 4096 Jan 24 17:56 ..\n292606 -rw-r--r-- 1\
  \ root root 1354 Jan 21 00:23 anaconda-ks.cfg\n292748 -rw------- 1 root root 3470\
  \ Jan 24 18:16 .bash_history\n290485 -rw-r--r-- 1 root root 24 Jun 10 2000 .bash_logout\n\
  290486 -rw-r--r-- 1 root root 234 Jul 5 2001 .bash_profile\n290487 -rw-r--r-- 1\
  \ root root 176 Aug 23 1995 .bashrc\n290488 -rw-r--r-- 1 root root 210 Jun 10 2000\
  \ .cshrc\n```\n\n![图像](img/key_topic_icon.jpg)\n\n### 文件通配符\n\n你看到许多命令（包括 `ls` 命令）使用的星号（`*`）符号被称为\
  \ `glob`（通配）。glob 是一种通配符运算符，根据模式匹配某些数量的文件。`/etc/*` 匹配 `/etc` 目录中的所有文件，例如 `/etc/foo`\
  \ 和 `/etc/bar`，但不匹配 `/etc/foo/bar`，因为这实际上是指名为 `foo` 的子目录下的名为 `bar` 的文件。\n\nLinux（以及所有\
  \ Unix）的不同之处在于 shell 负责将 glob 扩展为它匹配的文件列表。如果你输入 `ls /tmp/thing*` 且有两个以 `thing` 开头的文件，例如\
  \ `thing1` 和 `thing2`，它等同于你输入 `ls /tmp/thing1 /tmp/thing2`：\n\n```\n$ ls thing*\n\
  thing1 thing2\n```\n\n这种 `globbing` 功能使得重命名一组文件变得更加困难。在 Windows 中，你可以输入 `ren *.foo\
  \ *.bar`，任何扩展名为 `foo` 的文件随后将具有扩展名 `bar`。在 Linux 中，输入 `mv *.foo *.bar` 将把 glob 扩展为匹配的文件列表：`*.foo`\
  \ 将匹配你想要重命的文件，而 `*.bar` 将匹配不到任何。这与你预期的不同！以下输出显示了这个问题：\n\n```\n$ ls *.foo *.bar\n\
  ls: *.bar: No such file or directory\nfile1.foo file2.foo\n$ echo mv *.foo *.bar\n\
  mv file1.foo file2.foo *.bar\n$ mv *.foo *.bar\nmv: target `*.bar’ is not a directory\n\
  ```\n\n在输出中，第一个命令显示有三个扩展名为 `foo` 的文件，但没有扩展名为 `bar` 的文件。`echo` 命令显示随其后的输出，从而显示了如果你单独运行\
  \ `mv` 命令将执行的内容。`*.bar` glob 出现是因为没有匹配它的文件。发生错误是因为不存在名为 `*.bar` 的目录。\n\n还有其他的 glob\
  \ 运算符。示例 2-1 显示了文件通配符的一些用法。\n\n**\n\n**示例 2-1**–使用 Glob 的示例\n\n```\n$ ls\nfile file1\
  \ file10 file11 file2\n$ ls file*\nfile file1 file10 file11 file2\n$ ls file?\n\
  file1 file2\n$ ls *1\nfile1 file11\n$ ls file[123]\nfile1 file2\n```\n\n\n\n\n\n\
  示例 2-1 首先列出目录中的所有文件。使用 `file*` 也可以获得相同的文件列表，它匹配单词 `file` 后面跟任何任意内容或不跟任何内容。请注意，它包含了裸文件名\
  \ `file`。接下来，`file?` 通配符匹配任何以单词 `file` 开头且后跟一个字符的字符串。`file` 和文件名中带有两位数字的文件都会被排除在外。\n\
  \n##### 注意\n通配符并不一定要出现在文件名的末尾。例如，`*1` 匹配任何以数字 1 结尾的字符串。\n\n最后，`file[123]` 使用方括号运算符，其意思是“集合中的任意一个字符”。它匹配\
  \ `file1` 和 `file2`。\n\n### 触碰文件\n`touch` 命令初看起来看起来很奇怪，但它非常有用。你给它一个或多个文件的名称，如果文件不存在，则创建它们；如果已存在，则更新它们的时间戳。\n\
  \n使用 `touch` 命令有多种原因，例如创建一个新的空白日志文件，或者更新文件的修改时间作为参考（例如，知道任务上次运行的时间）。\n\n要创建一个新文件，你可以使用相对路径在当前目录中创建：\n\
  \n```bash\n# touch filename\n```\n\n或者，你可以使用绝对路径来创建文件，如下所示：\n\n```bash\n# touch\
  \ /home/ross/filename\n```\n\n在你准备 Linux+ 考试时，预计会看到使用 `touch` 创建日志文件，以及使用参考文件来标记最后一次备份。换句话说，如果从一次成功的备份中创建了一个日志文件，那么该文件就可以作为日期和时间参考文件，因为它产生于理想的时间。\n\
  \n当你对现有文件使用 `touch` 时，默认操作是更新文件的所有三个时间：\n\n*   **访问（access）：** 文件最后一次被写入/读取的时间。\n\
  *   **更改（change）：** 文件内容或文件的元数据（所有者、权限、inode 号）最后一次被更改的时间。\n*   **修改（modify）：**\
  \ 文件内容最后一次更改的时间。\n\n准备软件软件包新版本的程序员会使用 `touch` 命令确保所有文件具有完全相同的日期和时间。因此，在存在多个版本的情况下，可以通过文件日期来引用该发布版本。\n\
  \n设置文件的日期相对容易；以下命令将 `file1` 的日期设置为特定的日期和时间：\n\n```bash\n# touch -t 202201010830\
  \ file1\n```\n\n这里使用的时间格式为 `yyyymmddhhmm`，即四位年份、两位月份、两位日期、两位小时和两位分钟。\n\n参考文件是非常有用的的，特别是当你只想将一个文件或一组文件更新为特定的日期/时间，而不是当前的日期/时间时。可以使用以下命令：\n\
  \n```bash\n# touch -r reffile file2update\n```\n\n`reffile` 的日期/时间将被应用到 `file2update`\
  \ 文件的日期/时间。\n\n### 复制文件和目录\n复制对象的一个方面是，该操作会创建一个具有独立 inode 的新文件，inode 从字面上是文件系统从表中分配的一个数字，它实际上是系统引用文件的方法；友好的文件名实际上是为了人类理解而存在的。\n\
  \n##### 注意\ninode 是指向磁盘上文件的指针。inode 与所有其他文件一起作为文件系统的一部分被创建，取决于文件系统，它的数量可以是有限的，也可以根据需要自动生成。inode\
  \ 基本上等同于系统上文件的存在，因为文件如果没有自己的 inode 或对 inode 的引用就不可能存在。\n\n这意味着操作系统认为新文件与旧文件是分开的。与之对比的是移动操作，在移动操作中它是同一个文件（即只要它在同一个文件系统中，就是同一个\
  \ inode），只是有一个新名称。\n\n当你在文件系统中创建一个对象时，它将拥有自己的权限。`cp` 并不总是将权限复制到新文件中。这可以实现，但需要使用\
  \ `-p` 选项来保留权限和所有权。\n\n\n\n\n`cp` 命令通过通过一个新文件、inode 和数据来复制文件，而 `mv` 命令简单来说是更改包含该文件或目录条目的目录，或者如果条目留在同一目录中，则修改该文件中的条目。当你只更改指向文件的元数据时，你可以在同一设备设备上快速移动文件。如果文件移动跨越了两个设备，则文件会被复制到新设备并从旧设备中删除。\n\
  \n创建一个名为 `file1` 的文件，然后对它运行 `stat` 命令以检查详情，如示例 2-2 所示。\n\n**示例 2-2**–在 `file1` 上运行\
  \ `stat` 命令\n\n```\n# touch file1\n# stat file1\n File: ‘file1’\n Size: 0 Blocks:\
  \ 0 IO Block: 4096 regular empty file\nDevice: fd00h/64768d Inode: 2261179 Links:\
  \ 1\nAccess: (0664/-rw-rw-r--) Uid: (500/sean) Gid: (500/sean)\nAccess: 2015-02-03\
  \ 21:47:46.000000000 -0600\nModify: 2015-02-03 21:47:46.000000000 -0600\nChange:\
  \ 2015-02-03 21:47:46.000000000 -0600\n Birth: -\n```\n\n现在使用 `mv` 命令将文件移动到新名称，如示例\
  \ 2-3 所示。\n\n**示例 2-3**–将文件移动到新名称\n\n```\n# mv file1 file2\n# stat file2\n File:\
  \ ‘file2’\n Size: 0 Blocks: 0 IO Block: 4096 regular empty file\nDevice: fd00h/64768d\
  \ Inode: 2261179 Links: 1\nAccess: (0664/-rw-rw-r--) Uid: (500/sean) Gid: (500/sean)\n\
  Access: 2015-02-03 21:47:46.000000000 -0600\nModify: 2015-02-03 21:47:46.000000000\
  \ -0600\nChange: 2015-02-03 21:48:41.000000000 -0600\n Birth: -\n```\n\n因为在示例 2-3\
  \ 中设备和 inode 保持不变，所以你知道这与之前是同一个文件。更改时间被修改，以反映文件被重名的事实。\n\n当你移动文件时，如果目标存在，`mv` 命令会覆盖它。该命令支持一个选项\
  \ `-i`，它会检查目标是否存在。如果存在，`mv` 会询问你是否想要覆盖目标。某些发行版通过 shell 别名将 `-i` 设置为默认选项。\n\n该命令的另一个特点是缺少\
  \ `-r` 或`递归`选项。这是因为当你移动目录或文件时，你只是更改了文件的目录条目。目录继续指向相同的文件，因此没有需要移动文件本身。\n\n你可以使用 `-u`\
  \ 选项避免覆盖较新的目标文件或目录，该选项保留对象的最新副本。\n\n移动文件和目录的示例包括将单个目录移动到另一个目录名称，如下：\n\n```\n# mv\
  \ -f dir1 dir2\n```\n\n这仅仅是将目录条目 `dir1` 更改为新名称 `dir2`。`-f` 选项还会省略“确定吗？”的提示。\n\n\
  与 `cp` 命令一样，移动目录内容需要格式正确的命令；否则，你将不是移动到新名称，而是移动到现有目录的子目录下。例如，再次考虑 `/test` 目录，其结构如下：\n\
  \n```\n# tree .\n|-- dir1\n| |-- file1\n| `-- subdir1\n`-- dir2\n```\n\n如果你是一个 Windows\
  \ 管理员，运行以下命令将 `dir1` 移动到 `dir2` 是有意义的：\n\n```\n# mv dir1 dir2\n```\n\n如果你在 Linux\
  \ 系统上执行此操作并运行 `tree` 命令，你会看到输出：\n\n```\n# tree .\n`-- dir2\n `-- dir1\n |-- file1\n\
  \ `-- subdir1\n```\n\n这会将 `dir1` 移动到 `dir2` 下，因为 `dir2` 已经存在。要正确将源目录 `dir1` 的内容移动到目标\
  \ `dir2`，你不需要使用不存在的 `-r` 选项。（记住这一点用于 Linux+ 考试。）只需要使用正斜杠和星号来引用 `dir1` 下的文件，如下所示：\n\
  \n```\n# mv dir1/* dir2\n```\n\n注意\n\n`*` 通配符运算符不匹配隐藏文件，因为它们以点开头。处理这种情况实际上非常复杂，并且超出了\
  \ Linux+ 考试的范围。\n\n![Images](img/key_topic_icon.jpg)\n\n如果你运行 `tree` 命令，你会看到以下输出：\n\
  \n```\n# tree .\n|-- dir1\n`-- dir2\n |-- file1\n `-- subdir1\n```\n\n最后，你传递给 `mv`\
  \ 命令的目录并不总是位于当前目录之下。你可以使用绝对路径，例如使用 `mv /dir1 .` 将位于根目录下的 `dir1` 移动到当前目录。你也可以从系统的任何位置运行\
  \ `mv /dir1 /tmp` 将该目录移动到临时目录。\n\n#### 创建和删除目录\n\n文件管理中的一项基本任务是能够创建和删除目录，这有时意味着一次创建或删除整个树。要创建一个名为\
  \ `dir1` 的目录，你使用 `mkdir dir1`。在 `dir1` 目录中创建一个名为 `subdir1` 的目录，使用 `mkdir dir1/subdir1`。\n\
  \n\n\n\n对已知二进制文件运行 `file` 命令可以显示关于文件架构和布局的各种元素，如下：\n\n```\n$ file /bin/ls\n/bin/ls:\
  \ ELF 32-bit LSB executable, Intel 80386, version 1 (SYSV), dynamically\nlinked\
  \ (uses shared libs), for GNU/Linux 2.6.32, stripped\n```\n\n对包含许多文件的目录运行 `file`\
  \ 命令对于查看可能的类型很有用，但真正的价值在于使用管道操作符 `|` 和 `grep` 命令过滤输出结果，只查看包含特定单词（例如 `empty`）的结果：\n\
  \n```\n$ file /etc/* | grep empty\n/etc/dumpdates: empty\n/etc/exports: empty\n\
  /etc/fstab.REVOKE: empty\n/etc/motd: empty\n/etc/printconf.local: empty\n```\n\n\
  这是寻找散落在系统中的空文件的一种方法。它们可能在 `/etc` 目录下是需要的，但只会占用 `/tmp` 等临时目录。\n\n## 显示文件元数据\n\n如果你只会使用\
  \ `ls` 命令及其各种选项，那么你错过了许多对你非常有用的且重要的信息。除了使用 `stat` 系统调用但没提供太多内容的 `file` 命令外，你还可以实际的\
  \ `stat` 命令大显身手。\n\n![Images](img/key_topic_icon.jpg)\n\n## `stat` 命令\n\n`stat`\
  \ 命令本身非常有用，它显示了许多不同的文件信息项，并且之前提到的，它可以与其他命令结合使用以揭示更多信息。\n\n`stat` 非常简单，只需将文件或文件系统对象作为参数调用它，即可看到它提供的内容：\n\
  \n```\n$ stat file1\n  File: file1\n  Size:0    Blocks:0   IO Block:4096   regular\
  \ empty file\nDevice: 801h/2049d   Inode: 259418      Links: 1\nAccess: (0664/-rw-rw-r--)\
  \ Uid:(1000/ ubuntu)Gid:(1000/  ubuntu)\nAccess: 2022-01-14 19:32:09.307094382 -0700\n\
  Modify: 2022-01-14 19:32:09.307094382 -0700\nChange: 2022-01-14 19:32:09.307094382\
  \ -0700\n Birth: -\n```\n\n如你所示，你得到比简单的 `ls -l` 输出多多的信息，甚至像使用过 `file` 命令一样得到了文件类型。\n\
  \n`stat` 命令显示的信息：\n\n- **File:** 这显示了文件系统中存在的文件名。\n- **Size:** 该文件是一个空文件，或者是一个包含零字节数据的文件。\n\
  - **Blocks:** 该文件也占据了 0 块空间。\n- **IO Block:** 该文件占据或关联了一个 4096 字节的块。\n- **File Type:**\
  \ 此信息没有标签，该文件是一个普通空文件，与 `file` 命令显示的类似类似。\n- **Device:** 这是文件块所在的设备。\n- **Inode:**\
  \ 与文件关联的 inode 号。\n- **Links:** 这是一个普通文件，不存在指向同一 inode 的硬链接。\n- **Access:** 这是该文件的权限和用户/组所有权。\n\
  - **Access:** 这是最后一次读取文件内容的日期/时间。\n- **Modify:** 这是文件元数据（名称、大小、权限）最后更改的日期/时间。\n\
  - **Change:** 这是实际文件内容最后更改的日期/时间。\n- **Birth:** 该字段仅用于某些文件系统（如 Ext4），用于提供文件独立且静态的初始日期/时间。\n\
  \n`stat` 命令还可以用于显示任意数量或顺序的支持的 *格式序列，例如 `%i`、`%A` 等，这些可以在 `stat` 命令的 man 页面中找到。这些是你想要显示的各个\
  \ `stat` 输出部分的短代码，将它们按特定顺序排列非常有帮助，或者允许你将输出发送到其他命令进行进一步处理！\n\n例如，你可以执行以下命令：\n\n```\n\
  $ stat -c %i file1\n  259461\n```\n\n使用 `-c` 后紧跟 `%i` 将限制 `stat` 输出仅为文件的 Inode 号。要一次性输出多个格式序列，请像这样用“单引号”括起它们：\n\
  \n```\n$ stat -c '\"%n\",%i,\"%F\",%h' file1\n\"file1\",259461,\"regular file\"\
  ,1\n```\n\n使用双引号包裹包含空格或逗号的文件名或描述，并用逗号分隔输出，将非常容易生成真正实用的内容，例如包含你想要报告的字段字段的文件系统内容报告，以便在电子表格等中使用\n\
  \n注意\n\n你还应该注意到 `-printf` 格式序列选项，它允许通过解释反斜杠转义（例如带有 `\\n` 的尾随换行等）来获得更大的控制权。\n\n希望这些关于\
  \ `stat` 命令多种用途的知识不仅对你的日常工作有所帮助，还能帮助你回答 Linux+ 考试中遇到的关于文件元数据的任何问题！\n\n## 链接与硬链接\n\
  \n链接对于多种用途都非常有用，主要目的是让用户不需要为了访问某个文件或运行命令而遍历整个系统。\n\n### 链接文件\n\n链接有两种类型：符号链接（或软链接）和硬链接。每种都有自己的优缺点。系统管理员使用链接有很多用途；其中首要任务是为系统创建快捷方式，让用户无需导航多个目录层级即可访问数据。\n\
  \n如果你在 Linux 系统上有用户，你需要一个多个用户都可以访问的单一挂载点。选项包括让用户导航到 `/mnt/somemount` 目录保存数据，并在每个用户的家目录下放置指向该挂载点的链接。使用链接完成这项任务要好得多。\n\
  \n### 符号链接\n\n符号链接主要用于从一个对象创建另一个对象的快捷方式。*符号链接创建一个具有自己的 inode 和指向链接文件路径的小文件。符号链接可以跨文件系统和驱动器，主要因为符号链接有自己的\
  \ inode。图 2-1 显示了符号链接与目标文件之间的关系。\n\n![Images](img/key_topic_icon.jpg)![Images](img/02fig01.jpg)\n\
  \n**图 2-1**–符号链接详情\n\n例如，你将外部磁盘挂载到 `/mnt/projdata` 挂载点，并希望每个用户都能从自己的家目录访问该远程共享。你只需要在每个用户的家目录下执行以下命令即可实现：\n\
  \n```\n# ln -s /mnt/projdata projdata\n# ls -l projdata\nlrwxrwxrwx 1 root root\
  \ 13 Jan 26 12:09 projdata -> /mnt/projdata\n```\n\n注意，新符号链接的列表显示了链接指向的具体位置，并且权限设置为最大，以避免干扰目标对象的权限。\n\
  \n符号链接看起来总是具有相同的权限，但它们并不尝试更改权限。更改符号链接的权限实际上更改的是目标对象的权限。\n\n要取消符号链接，你只需删除作为符号链接的文件，这将移除对原始文件的引用。虽然删除该符号链接文件看起来可能很吓，但默认情况下这样做不会删除目标链接文件。\n\
  \n### 硬链接\n\n*硬链接通常用于让文件出现在另一个地方。硬链接只是目录中的一个额外名称，指向完全相同的 inode，并共享原始文件的除实际名称外的每个方面（尽管如果在不同的目录下，文件名可以是相同的）。图\
  \ 2-2 显示了硬链接与目标文件之间的关系。\n\n![Images](img/key_topic_icon.jpg)![Images](img/02fig02.jpg)\n\
  \n**图 2-2**–硬链接详情\n\n\n\n\n关于硬链接的一个示例，请考虑需要确保某个用户经常删除的文件对于该用户来说易于恢复的情况。该用户 Jaime\
  \ 经常出差，但当他在办公室时，似乎经常删除东西，或者声称系统“吃掉”了他的文件。当 Jaime 在飞行时不会出现任何问题，所以问题一定出在用户的操作上。\n\n\
  为了在 Jaime 的家目录中锚定或备份一个重要文件（如公司联系列表），你必须先创建一个备份目录，例如 `/backup`。然后，从 Jaime 的 `ccontactlist.txt`\
  \ 文件到 `/backup` 目录中的一个文件创建一个硬链接，如下所示：\n\n```\n# cd ~jaime\nln ccontactlist.txt /backup/home_jaime_ccontactlist.txt\n\
  ls -l ccontactlist.txt\n-rw-r--r-- 2 jaime users 0 Jan 26 13:08 ccontactlist.txt\n\
  ```\n\n注意，该文件看起来正常，但链接计数数字 `2` 告诉你该文件的某处存在另一个名称条目。\n\n同样注意，新硬链接的列出并没有显示目标文件，似乎也没有以任何方式引用它。对此文件运行\
  \ `stat` 命令不会向你显示另一个文件名，除了更高的链接计数外似乎也不会感知它的存在。\n\n文件的名称和位置是关于该文件不存储在 inode 中的唯一信息。你会在\
  \ Linux+ 考试中遇到关于此的问题。\n\n如果目标位于另一个文件系统、磁盘或远程对象，则无法创建硬链接。将多个名称关联到同一个 inode 的需求使得这种远程创建变得不现实。\n\
  \n在更改硬链接文件的权限和所有者时要小心，因为所有名称条目都指向完全相同的 inode。因此，任何更改都会立即应用到看似是多个文件上，但实际上它们只是不同的文件名。\n\
  \n删除一个具有多个硬链接的文件需要删除每一个硬链接或多个名称。虽然看起来你正在取消链接（unlinking）文件，但由于它们在文件系统目录文件中具有不同的名称且拥有完全相同的\
  \ inode 和数据，你必须删除所有指向原始文件的文件，才能成功地对原始文件执行“取消链接”操作。\n\n此外，要找到某个文件的所有链接，请运行以下命令：\n\
  \n```\n# ls -i ccontactlist.txt\n17392 ccontactlist.txt\nfind / -inum 17392\n/home/jaime/ccontactlist.txt\n\
  /backup/home_jaime_ccontactlist.txt\n```\n\n当通过查询公共 inode 找到该文件的所有链接后，你可以删除指向原始文件的所有不需要的链接，但你需要非常小心不要移除指向该文件的*所有*链接；也就是说，不要完全删除文件！\n\
  \n### Note\n\n对于 Linux+ 考试，请记住符号链接（symlink）是另一个拥有自己 inode 的实际文件。因此，大量的符号链接可能会给文件系统带来问题，例如用户家目录的文件系统。使用过多的\
  \ inode 会限制你使用可用存储空间。运行 `df -i` 命令查看统计信息。\n\n## 文件压缩、归档与备份\n\n文件的归档和恢复自山地磁带驱动器以及将主机的磁盘包放入箱中由派送员带到场外以来，已经取得了巨大的进步。\n\
  \n在职业生涯大部分时间都在处理文件和由文件组成系统的系统管理员，必须知道如何正确地归档、列出、解档、压缩和转换文件。\n\n能够熟练设计并实施系统备份和恢复方案，除了确保服务器提供文件和服务之外，是最关键的任务之一。如果没有良好的备份和恢复方案，遭受灾难性系统崩溃的企业可能面临倒闭的风险。我经常说，大多数小企业离灭只差一次硬盘崩溃和一次的工资周期。\n\
  \n认真对待你的组织或个人数据安全、健康和完整性是非常重要的，方法是备份、使用适当的存储，并确保你已备份的内容可以被正确恢复。\n\n### 使用 tar\n\n\
  `tar` 命令是归档世界的骨干工作。该名称来源于 `t` `ar`chive（归档）一词，追溯到大多数备份都在本地磁带驱动器上完成的时代。你可以将 `tar`\
  \ 视为一个流水线，它接收一系列文件并输出一个旨在流式传输到磁带的单元，但此输出也可以发送到磁盘上的文件。\n\n当数据通过流水线时，你可以对文件进行一些转换，例如将输出切割成适合多块磁带的内容，排除最近未更改的文件，或重写存储在归档中的目录名称。\n\
  \n`tar` 还提供了提取选项。你可以通过 `tar` 运行 `.tar` 文件（也称为 `tarball`）以获取原始文件的副本。可以只提取某些文件并操作文件名。\n\
  \n`tar` 命令还可以配合特殊选项字符使用，以利用各种压缩命令，特别是 `gzip`/`gunzip`、`bzip2`/`bunzip2` 和 `xz`/`unxz`\
  \ 命令。这的效果创建一个压缩归档文件，通常 `gzip`-压缩的文件命名为 `.tar.gz`，`bzip2`-压缩的文件为 `.tar.bz2`，`xz`-压缩的文件为\
  \ `.tar.xz`。\n\n`tar` 命令的语法略微特殊。命令是 `tar`，后面跟着横字符（`-`），然后是所有选项连接在一起，例如 `xvjf`。之后是零或多个文件名；其含义取决于你选择的选项。\n\
  \n`tar` 命令主要有三种方式作用于文件或 `tar` 归档；每种方式都有对应的字母，必须是选项列表的第一个字母：\n\n- `c`: 创建归档文件。\n\
  - `t`: 显示归档文件的内容。\n- `x`: 从归档中提取文件。\n- 还有其他可选选项，包括以下项：\n\n- `v`: 详细模式，在处理文件时提供文件列表。\n\
  - `j` 或 `z`: 分别使用 `bzip2` 或 `gzip` 进行压缩或解压缩。\n- `f`: 下一个单词是要操作的文件名。\n\n图 2-3 图化展示了这些选择。接下来，我们将查看这些选项的示例。\n\
  \n### 创建归档\n\n当你使用 `tar` 创建归档时，你应该考虑想要归档什么、想将生成的归档放在哪里，以及想要使用何种压缩（如果有的话）。\n\n创建一个简单的\
  \ `tar` 归档，所需的选项如下：\n\n```\ntar -cf archive.tar /foo\n```\n\n在此示例中，`-c` 选项指示 `tar`\
  \ 创建 `-f` 选项之后的文件，并指定你要归档的目录，即 `/foo` 目录。注意你必须添加 `.tar` 后缀。\n\n要创建一个 `tar` 归档并在处理时查看文件名，请使用\
  \ `-v` 选项：\n\n```\ntar -cvf archive.tar /foo\n```\n\n这将产生以下输出：\n\n```\ntar: Removing\
  \ leading ‘/’ from member names\nfoo/\nfoo/install.log\nfoo/install.log.syslog\n\
  foo/.bash_logout\n```\n\n如果给出一个绝对目录名称进行归档，`tar` 会删除归档中对象完整路径开头的 `/`。如果你可以在无关目录中提取文件并覆盖\
  \ `/usr` 目录中的文件，那将非常糟糕！\n\n你可以向 `tar` 传递多个目录或文件。例如，`tar -cf foo.tar bin var` 会创建一个名为\
  \ `foo.tar` 的归档，其中包含 `bin` 和 `var` 目录。\n\n\n\n`tar` 命令并不会压缩它放入归档文件中的文件。尽管磁盘上的文件完整内容和文件大小可能会略有不同，但并没有发生实际的压缩。\n\
  \n## 使用压缩工具\n\n由于 Linux 和 Unix 命令的“工具集”理念——即每个工具都很好地做好一件事，并与其他命令良好协作工作——你可以将压缩工具与\
  \ `tar` 命令结合使用，获得更小的归档文件体积。\n\nLinux+ 考试目标提到了三种压缩命令：`gzip`、`bzip2` 和 `xz`。这三个命令对应相应的解压工具：`gunzip`、`bunzip2`\
  \ 和 `unxz`。\n\n这三组工具都共享相似的命令行语法，它们是 `tar` 命令的完美搭档，因为 `tar` 并不真正压缩文件和目录，而是将它们放入归档文件中，并将压缩任务留给我们正在讨论的命令。\n\
  \n默认情况下，`gzip/gunzip`、`bzip2/bunzip2` 和 `xz/unxz` 命令作用于单个文件，这与 `tar` 命令的行为几乎完全相反。\n\
  \n例如，如果你在当前目录下有三个文件 `file1`、`file2` 和 `file3`，你可以对它们使用 `tar` 命令生成一个包含这三个文件的 `tar`\
  \ 归档文件。相反，对这些文件使用任何一种三种压缩工具，会导致每个单独的文件被压缩，并被*替换*为同名但后缀变为 `.gz`、`.bz2` 或 `.xz` 的文件。\n\
  \n要使用 `gzip` 压缩创建相同的归档，你只需插入 `-z` 选项并使用 `.gz` 作为文件名后缀：\n\n```\n# tar -czf archive.tar.gz\
  \ /foo\n```\n\n结果是在当前目录下创建一个名为 `archive.tar.gz` 的 `gzip`压缩的文件。\n\n要使用 `bzip2` 压缩创建相同的归档，你只需插入\
  \ `-j` 选项并使用 `.bz2` 作为文件名后缀：\n\n```\n# tar -cjf archive.tar.bz2 /foo\n```\n\n结果是在当前目录下创建一个名为\
  \ `archive.tar.bz2` 的 `bzip2` 压缩的文件。\n\n![Images](img/key_topic_icon.jpg)\n\n要使用\
  \ `xz` 压缩创建相同的归档，你只需插入 `-J` 选项并使用 `.xz` 作为文件名后缀（注：原文此处误写为 .gz，正确应为 .xz）：\n\n```\n\
  # tar -cJf archive.tar.xz /foo\n```\n\n结果是在当前目录下创建一个名为 `archive.tar.xz` 的 `gzip`\
  \ 压缩的文件。\n\n以下是列出这三个归档文件的示例：\n\n```\ntar -tzf archive.tar.gz\ntar -tjf archive.tar.bz2\n\
  tar -tJf archive.tar.xz\n```\n\n请记住，相应的归档选项字符*必须*与对应的压缩归档文件匹配，否则将失败。\n\n列出的输出受使用\
  \ `v` 选项的影响：\n\n```\n-rw-r--r--rossb/rossb 34 2019-03-22 08:34 compressfiles/ld.so.conf\n\
  -rw-r--r--rossb/rossb 552 2019-03-22 08:34 compressfiles/pam.conf\n-rw-r--r-- rossb/rossb\
  \ 14867 2019-03-22 08:34 compressfiles/ltrace.conf\n```\n\n如果没有 `v` 选项，你只会看到文件名的列表，而不是刚才显示的更详细的列表：\n\
  \n```\ncompressfiles/ldso.conf\ncompressfiles/pam.conf\ncompressfiles/ltrace.conf\n\
  ```\n\n## 配合压缩工具使用 tar\n\n你可能会在 Linux+ 考试中遇到问题，测试你对哪种压缩命令压缩率最高的了解。在我们的测试中，压缩效果从最高到最低的顺序是：\n\
  \n- 最高 = `xz`\n- 中等 = `bzip2`\n- 最低 = `gzip`\n\n另一个命令 `zip` 是一个有趣的工具，因为它开发于 Unix\
  \ 环境，但在 PC 平台上使用最广泛。`zip` 命令配有 `unzip` 命令，类似于其他的压缩命令配对。虽然这是一组很棒的工具，但它不像之前提到的三组那样常用。\n\
  \n当你从别人那里收到一个该格式的归档文件，并且你需要解压该文件的内容时，你可能会在 Linux 上使用 `zip` 和 `unzip`。\n\n`zip` 和\
  \ `unzip` 的工作方式与之前提到的三个命令略有不同，`zip` 不像其他三个命令那样自动将文件替换为自身的压缩版本；它更像是 `tar` 和压缩工具的结合。\n\
  \n注意\n\n如果你从小习惯使用 `pkzip`、`pkunzip` 或 `winzip`，你会立即识别出 `zip` 和 `unzip` 的工作方式。对你来说，`tar`\
  \ 以及 `gzip`/`bzip2`/`xz` 工具可能看起来很陌生。\n\n让我们看看如何使用 `zip` 创建压缩归档。要压缩目录（如当前目录）中的一组文件，你可以使用此命令：\n\
  \n```\n# zip somefile.zip file1 file2 file3\n```\n\n或者你也可以使用此命令压缩目录中的所有文件：\n\n```\n\
  # zip somefile.zip *\n```\n\n该命令会压缩当前目录下的所有内容，包括子目录，但非常重要的是，除非你指定 `-r`（递归）选项，否则它不会包含子目录中的文件。\n\
  \n假设你有如下的目录和文件树：\n\n```\n file1\n file2\n subdir1\n  file3\n  file4\n1 个目录, 4 个文件\n\
  ```\n\n运行 `zip` 并不会像你认为的那样获取 `subdir1` 目录的内容。相反，它产生一个包含 `file1`、`file2` 和 `subdir1`\
  \ 的 zip 文件：\n\n```\n# zip somefilenor.zip *\n adding: file1 (stored 0%)\n adding:\
  \ file2 (stored 0%)\n adding: subdir1/ (stored 0%)\n```\n\n要正确压缩当前目录及其所有子目录和文件，你需要运行：\n\
  \n```\n$ zip -r somefilewithr.zip *\n adding: file1 (stored 0%)\n adding: file2\
  \ (stored 0%)\n adding: somefilenor.zip (stored 0%)\n adding: subdir1/ (stored 0%)\n\
  \ adding: subdir1/file3 (stored 0%)\n adding: subdir1/file4 (stored 0%)\n```\n\n\
  在解压 zip 归档之前，列出归档内容被认为是优雅且合理的做法，因为你可能不想在当前目录下有 3,000 个散乱的文件。列出 zip 归档的内容很简单：\n\n\
  ```\n# unzip -l somefile.zip\nArchive:  somefilewithr.zip\nLength    Date      \
  \   Time     Name\n---------     ----------      -----       ----\n 20       2019-07-11\
  \   12:16     file1\n 26       2019-07-11   12:18     file2\n488       2019-07-18\
  \   11:41     somefilen.zip\n  0       2019-07-18   11:37     subdir1/\n 20    \
  \   2019-07-18   11:34     subdir1/file3\n 26       2019-07-18   11:34     subdir1/file4\n\
  ---------                           -------\n580                              6\
  \ files\n```\n\n注意，文件的列出取决于它们是在归档文件的根目录下还是子目录中（`file3` 和 `file4` 属于后者）。`-l` 选项不会解压\
  \ zip 文件；它只是遍历文件的内容。\n\n对已压缩的文件执行解压非常简单：\n\n```\n# unzip somefile.zip\nArchive:\
  \ somefilewithr.zip\nreplace file1? [y]es, [n]o, [A]ll, [N]one, [r]ename:\n```\n\
  \n此消息询问你是否想要覆盖与 zip 归档部分或全部内容匹配的现有文件集。如果你回答字符 A 表示“全部覆盖”，结果将如下所示：\n\n```\n extracting:\
  \ file1\n extracting: file2\n extracting: somefilenor.zip\n extracting: subdir1/file3\n\
  \ extracting: subdir1/file4\n```\n\n`zip`/`unzip` 命令对还有许多其他可用选项，但你已经掌握了 Linux+ 考试所需的所有知识。\n\
  \n## 为解压者考虑\n\n通过指定包含要归档文件的目录来创建 `tar` 归档被认为是恰当且优雅的做法，而不是仅仅指定当前目录的一堆文件。这意味着当文件被解压时，它们会出现在单个目录中，而不是当前目录下。\n\
  \n例如，使用以下命令为 `/etc` 目录的内容创建归档：\n\n\n\n\n\n```\n# tar -cf etc.tar /etc\n```\n\n当你解压\
  \ `tar` 文件时，默认情况下会在当前目录下创建一个 `etc` 目录，该目录包含了你归档的整个 `/etc` 目录。\n\n将此与导航到 `/etc` 目录并使用该命令从那里创建归档时发生的噩梦进行对比：\n\
  \n```\n# tar -cf /root/badetc.tar *\n```\n\n这个归档文件包含与之前相同的文件，但它们并不包含在一个顶层 `etc`\
  \ 目录中；相反，所有内容都在归档的根目录下。想象一下当你在 root 用户的目录下解压这个文件时，你的系统会发生什么！你将把约 2400 个文件直接释放到 root\
  \ 用户的目录下！\n\n在创建或扩展归档文件时，你处于文件系统中的位置以及使用哪种路径选项确实非常重要。最佳实践是使用绝对路径。\n\n要解决 2400 个文件污染\
  \ root 用户主目录的问题，请使用以下命令，其中 `badetc.tar` 是有问题的归档文件：\n\n```\n# tar -tf badetc.tar\
  \ | xargs rm -rf\n```\n\n此命令生成归档中文件的路径和文件名列表，并使用 `xargs` 命令将输出的每一行作为文件名规范传递给 `rm\
  \ -rf` 命令，从而删除从 `badetc.tar` 文件扩展出的所有文件和目录。\n\n## 有用的创建选项\n\n可以使用许多选项来创建 `tar` 归档。以下是最有用且最可能在\
  \ Linux+ 考试中出现的选项列表：\n\n- `-b`: 设置块大小以适应你归档的介质。这对于某些磁带设备是必要的。\n- `-M`: 指定多个归档目标，或将大型归档分散到多个磁带或介质上。\n\
  - `-g`: 创建新的格式增量备份（仅包含自上次全量备份或增量备份以来更改的文件）。\n- `-l`: 留留在本地文件系统；它用于防止意外备份整个 NFS 网络。\n\
  - `-L`: 设置磁带长度，以便可以使用多个磁带创建一个归档。其后面跟着一个表示千字节数的数字，例如，`-L 500` 等于 500KB。\n- `--remove-files`:\
  \ 在文件添加到归档后从文件系统中删除指定的文件。此选项是非常危险的！\n\n## 列出归档文件\n\n列出操作被低估了。当你没有得到想要的结果，或者意识到自己刚刚做了什么并想确认清理有多困难时，你很可能会执行操作。\n\
  \n你可以使用以下命令学习 `tar` 归档的内容：\n\n```\n# tar -tf archive.tar\n```\n\n这将产生如下输出：\n\n```\n\
  etc/\netc/sysconfig/\netc/sysconfig/network-scripts/\netc/sysconfig/network-scripts/ifup-aliases\n\
  etc/sysconfig/network-scripts/ifcfg-lo\n```\n\n要列出一个使用压缩的归档，只需在 `-t` 和 `-f` 选项之间插入必要的字母，例如此处所示的\
  \ `bzip2` `-j` 选项：\n\n```\n# tar -tjf archive.tar.bz2\n```\n\n这将产生如下输出：\n\n```\n\
  etc/\netc/sysconfig/\netc/sysconfig/network-scripts/\netc/sysconfig/network-scripts/ifup-aliases\n\
  etc/sysconfig/network-scripts/ifcfg-lo\n```\n\n要列出归档并查看其内容的文件详细信息，可以在现有命令中添加 `-v`\
  \ 选项以查看列出详细信息的输出：\n\n```\n# tar -tvjf archive.tar.bz2\n```\n\n这将返回类似下所示的输出：\n\n\
  ```\ndrwxr-xr-x root/root 0 2015-02-10 03:46 etc/\ndrwxr-xr-x root/root 0 2015-01-31\
  \ 10:09 etc/sysconfig/\ndrwxr-xr-x root/root 0 2014-11-10 22:13 etc/sysconfig/network-scripts/\n\
  ```\n\n当你使用 `-v` 选项创建归档时，屏幕上显示正在归档的文件列表。当你使用 `-v` 选项解压归档时，你会看到类似的解压文件列表。只有当你使用 `-v`\
  \ 选项列出归档时，你才能获得类似于对归档内容运行 `ls -l` 命令的输出类型。这是 Linux+ 考试的一个考点，请为此做好准备。\n\n![Images](img/key_topic_icon.jpg)\n\
  \n## 使用 cpio\n\n`cpio` 命令在 Linux+ 考试目标中出现不多。考试可能仅会在最简单的水平询问 `cpio` 命令。例如，你需要知道该命令是否存在、它大致如何工作，以及它是否可以用于备份\
  \ Linux 系统。\n\n所有 `cpio` 命令操作都将文件系统视为基地。如果你是在拷贝（out），是从文件系统拷贝到另一个文件。拷贝（in）也是如此：你是从文件拷贝到文件系统。\n\
  \n`cpio` 命令有三个处理文件和文件系统的选项：\n\n- `-o` 或 `--create`: 将文件复制到归档，使用使用 `find` 命令创建的文件列表。\n\
  - `-i` 或 `--extract`: 将文件从归档或归档内容列表复制到文件系统。\n- `-p` 或 `--pass-through`: 将文件从一个目录树复制到另一个目录树，而不使用归档，本质上执行与\
  \ `cp -r` 命令相同的功能。\n\n`cpio` 命令接受每行一个文件的列表格式，并使用此列表将归档文件发送到标准输出或你指定的归档文件。\n\n`cpio`\
  \ 支持多种归档格式，包括二进制、ASCII、crc 和 `tar`。\n\n以下示例从当前目录下的文件创建一个 `cpio` 归档：\n\n```\n# find\
  \ . “” | cpio -o > archive.cpio\n```\n\n此命令输出由特定 `find` 命令找到的文件列表，`cpio` 命令通过将标准输出重定向到文件，将所有文件发送到\
  \ `archive.cpio` 文件。\n\n`cpio` 命令在命令行中不接受用于归档的文件列表，与你目前为止看到的其他工具不同。相反，它从标准输入读取文件列表。因此，注意你需要使用\
  \ `find` 命令或 `ls` 命令向 `cpio` 提供文件名列表。\n\n例如，如果你需要将当前目录下所有 `.txt` 扩展的文件归档为名为 `txt.cpio`\
  \ 的 `cpio` 归档，你可以使用以下命令：\n\n```\n# ls *.txt | cpio -o > txt.cpio\n```\n\n注意此命令是将\
  \ `cpio` 的输出重定向到文件而不是让它写入文件。因此，文件名由你决定，如果你想要 `.cpio` 文件扩展名，你需要手动添加。\n\n## 使用 dd\
  \ 命令\n\n`dd` 命令对于多种任务非常有用，其中最有用的是创建 CD 或 DVD 的备份镜像（ISO 文件）。`dd` 交互的两种主要格式是原始设备文件和文件或对象的完整路径。\n\
  \n例如，在创建新的启动盘时，`.img` 二进制文件从 CD-ROM（作为文件）逐块读取，并作为一组块写入 USB 磁盘设备：\n\n```\n# dd if=/mnt/cdrom/images/boot.img\
  \ of=/dev/sdb\n```\n\n创建 CD-ROM 的镜像涉及逐块读取原始 USB 设备，并在文件系统中创建一个包含所有块的文件：\n\n```\n\
  # dd if=/dev/sdb of=/root/usb.img\n```\n\n要将名为 sdb 的 USB 设备复制到名为 sdc 的另一个 USB 设备，命令为：\n\
  \n```\n# dd if=/dev/sdb of=/dev/sdc\n```\n\n`if` 关键字意味着输入文件，而 `of` 关键字意味着输出文件。具体顺序并不重要，但你可以想象，混淆输入和输出文件可能会导致严重问题，例如覆盖你硬盘的部分！\n\
  \n与大多数 Unix 工具不同，`dd` 不使用破折号表示选项。选项以 *option=value* 的格式指定。\n\n`dd` 命令还经常用于将驱动器或驱动分区复制到另一个对象。\n\
  \n\n\n\n例如，要将 `/dev/sda` 磁盘上的第一个分区复制到系统第二个块级硬盘的相同位置，你可以使用以下命令：\n\n```\n# dd if=/dev/sda1\
  \ of=/dev/sdb1\n```\n\n你也可以通过省略分区编号，将整个磁盘设备复制到系统上的另一个设备：\n\n```\n# dd if=/dev/sda\
  \ of=/dev/sdb\n```\n\n只有当第二个设备的大小等于或大于第一个设备时，这种操作才有效；否则，你将在第二个设备上得到被截断且无效的分区。\n\n\
  备份 MBR（主引导记录）是 `dd` 擅长的另一个技巧。请记住，主引导记录包含了该驱动器上所有分区的索引，因此它非常重要。要创建一个仅包含系统第一个硬盘前 512\
  \ 字节的磁盘文件，请使用此命令：\n\n```\n# dd if=/dev/sda of=/root/MBR.img count=1 bs=512\n```\n\
  \n`count` 关键字设置了你想要从输入文件中读取的块数，而 `bs` 关键字设置了块大小。\n\n如果你在备份 MBR 的命令中没有设置 `count`\
  \ 和块大小，你将把整个设备的块复制到文件系统——这是一种“自吞尾蛇”的操作，保证会迅速填满分区并导致系统崩溃。\n\n恢复过程正好相反：\n\n```\n#\
  \ dd if=/root/MBR.img of=/dev/sda count=1 bs=512\n```\n\n## 压缩工具\n\n`tar` 命令用于收集文件并将它们放入容器中，而\
  \ `gzip`、`bzip2` 和 `xz` 命令则用于压缩该容器。单独使用它们时，它们会对找到的每个文件进行操作，并将该文件替换为具有压缩扩展名的版本，表明该文件已压缩。\n\
  \n`gzip` 和 `bzip2` 压缩工具用于压缩文件，其功能和操作非常相似。主要区别在于 `bzip2` 提供的压缩率略优于 `gzip`，但 `gzip`\
  \ 的使用范围广泛得多。`xz` 工具提供的压缩率比另外两个工具都好，且其用户群正在不断扩大。\n\n这些命令会将原始文件替换为带有额外扩展的新文件，因此不要删除你创建的\
  \ `.gz` 或 `.bz2` 文件。它们是封装在压缩壳中的原始文件！\n\n要使用 `gzip` 压缩当前目录下的所有文件，请使用此命令：\n\n```\n\
  # gzip *\n```\n\n这将当前目录下的所有普通文件（不包括目录或其内容）替换为原始文件名加上 `.gz` 扩展名。因此，如果你目录下有两个名为 `file1`\
  \ 和 `file2` 的文件，它们将被替换为：\n\n```\nfile1.gz\nfile2.gz\n```\n\n要解压缩这些文件，只需执行压缩的反向操作：\n\
  \n```\n# gunzip *\n```\n\n这将恢复原始文件。\n\n使用 `bzip2` 相同的结果。你可以在同一个目录下执行以下命令：\n\n```\n\
  # bzip2 *\n```\n\n然后你将拥有以下两个文件：\n\n```\nfile1.bz2\nfile2.bz2\n```\n\n要解压缩这些文件，执行此命令：\n\
  \n```\n# bunzip2 *\n```\n\n这将把文件恢复到原始状态。\n\n`xz` 是比 `bzip2` 和 `gzip` 更新的文件压缩选项。在某些情况下，它的性能比\
  \ `bzip2` 好，但代价是消耗更多内存。使用 `xz`、`xz -z` 或 `xz --compress` 压缩文件，并使用 `unxz`、`xz -d`、`xz\
  \ --uncompress` 或 `xz --decompress` 解压缩。\n\n`.xz` 文件扩展名表示文件是用 `xz` 压缩的。例如，要解压缩 `foo.xz`，你需要运行\
  \ `xz -d foo.xz`，并将得到一个名为 `foo` 的未压缩文件。\n\n注意 Linux+ 考试题，这些题目可能会问你为什么要在特定的压缩任务中使用\
  \ `gzip`、`bzip2` 或 `xz`。\n\n## 备份很难做到\n\n如果说有什么事情比良好的备份更重要，那就是成功的恢复！如果无法妥善且及时地恢复数据，备份就毫无用处。\n\
  \n### 注意事项\n\n为了简单起见，本节讨论备份的方式脱离了实际介质（磁盘、磁带、DVD 等）。\n\n备份场景有很多考虑因素。接下来的章节将列出不同的方法，并讨论你为什么要使用它们——无论是单独使用还是结合使用。\n\
  \n![图像](img/key_topic_icon.jpg)\n\n## 备份类型\n\n有三种基本的备份类型：\n\n-   **全备份（Full backup）：**\
  \ 这是最基本的备份方法，操作人员启动将数据集完整拷贝到备份位置。优点是可以进行单步恢复，因为所有数据都在那里。缺点是备份时间长，且备份备份所需的存储空间会不断增长。\n\
  -   **增量备份（Incremental backup）：** 这种类型的备份非常节省时间，因为它*仅*备份自上次备份操作以来（无论上次是什么类型）的新数据。与全备份相比，优点是备份速度快，空间利用率最高，因为只包含自上次操作以来的数据。缺点是，为了成功恢复所需的有效备份数量会增加，如果其中一个失败了，你将丢失该恢复中的所有数据。\n\
  -   **差异备份（Differential backup）：** 这种方法在全备份和增量备份之间取得了平衡，因为它包含了自上次全备份以来的所有更改。优点是恢复任何时间点只需要两个备份（上次全备份和上次差异备份）。缺点是随着时间推移，备份占用的空间会增加。\n\
  \n## 其他备份类型\n\n还有两种备份类型需要提到：快照克隆（snapshot clones）和镜像（images）。\n\nLinux+ 考试目标实际上提到了“快照克隆”，但\
  \ VMware 等其他厂商将*快照*和*克隆*分开使用。\n\n快照主要用于虚拟机（VM），其中虚拟机的初始状态是基准。快照本质上是自上次快照以来虚拟机变化的增量备份。\n\
  \n例如，如果你有一个为了软件测试而设置的虚拟机，不想再次通过整个设置流程，可以对它创建快照（即创建当前状态的备份），然后你可以在任何时候恢复到该点。\n\n\
  快照（或系列快照）的另一个绝佳用途是当你测试实验步骤时，希望能够将机器恢复到或高于任何更改水平。\n\n另一方面，克隆本质上是虚拟机的全备份。它可以用于测试新软件、操作系统更新等——在实际上是生产虚拟机上进行测试。\n\
  \n克隆是沉重的，因为它是另一个与原始相同的虚拟机，除了名称、IP 地址和其他识别信息外。\n\n快照的优点是，你可以从干净的状态开始，创建一个快照，对虚拟机进行任何操作，通过几次点击或命令返回到干净的状态，并重新开始过程。\n\
  \n镜像实际上是单个文件的克隆，管理镜像备份的软件可以对其进行许多操作，包括恢复到不同的硬件、从镜像中提取单个文件或一组文件并恢复到另一个设备，以及更多。\n\n\
  镜像备份的另一个用途是构建虚拟机，包含其立即执行给定服务或功能所需的所有软件和服务，然后在网络中部署，适用于 Docker、Kubernetes 等虚拟化环境。\n\
  \n### 在系统之间复制对象\n\n当你向同一文件系统的不同位置或同一台机器的不同文件系统复制文件时，使用 `cp` 命令；而在计算机之间复制文件则通过 `scp`\
  \ 命令完成。\n\n\n\n\n# 使用 scp 命令\n\n`scp` 命令是 SSH 协议和工具包的一部分，它以与 `ssh` 相同的公私钥机制在源系统和目标系统之间进行身份验证。\n\
  \n使用 `scp` 将文件从 `systema` 复制到 `systemb` 比在同一台机器的不同目录之间复制文件的标准 `cp` 命令多几个命令行组件。例如，要从\
  \ `systema` 将文件 `foobar.txt` 复制到 `systemb`，你需要指定在远程系统中使用的用户；否则，它将使用源系统的默认用户名。\n\n\
  例如，在以下命令中，假设你是 `systema` 上的 root 用户，但想将 `foobar.txt` 复制到 `systemb` 上 `ross` 家目录：\n\
  \n```\n# scp foobar.txt ross@systemb:~\nross@systema’s password:\nfoobar.txt 100%\
  \ |**********************| 1379 00:00\n```\n\n输入密码并完成任何其他提示后，文件将被复制到远程系统并放置在 `/home/ross`\
  \ 目录。\n\n`scp` 命令的另一个有趣功能是只需反转命令顺序，即可从另一个系统复制到你的系统。例如，这是从 `systemb` 的 root 用户家目录将文件\
  \ `tarfoo.txt` 复制到 `systema` 上 `ross` 家目录的方法：\n\n```\n# scp root@systemb:~/tarfoo.txt\
  \ ross@systema:~\nroot@systema’s password:\ntarfoot.txt 100% |**********************|\
  \ 1379 00:00\n```\n\n`scp` 命令还有一个实用的功能，即从 `systema` 上的用户视角从 `systemb` 复制到 `systemc`。Linux\
  \ 简单地利用 SSH 协议的隧道功能，并为从 `systemb` 到 `systemc` 的命令创建一个隧道；这就像是你本人在 `systemb` 上将文件复制到\
  \ `systemc` 一样，只不过实际上在 `systema` 上：\n\n```\n# scp root@systemb:~/blahwoof.txt ross@systemc:~\n\
  root@systemc’s password:\nblahwoof.txt 100% |**********************| 1379 00:00\n\
  ```\n\n## 注意\n\n`scp` 命令非常通用，虽然我们在本节中向你介绍了它的主要技巧和功能，但通过阅读 `scp` 和 `ssh` 的帮助页面（man\
  \ pages），还有更多内容可以探索和学习。\n\n# 万能与厨房的 rsync\n\n既然我们谈到了在系统内部甚至系统之间传输对象，那么讨论 `rsync`\
  \ 命令也是重要的。\n\n`rsync` 命令是一个极其强大的命令，我们还无法完全涵盖它，但让我们来来看看它最出名的特点以及可能最常的用途。\n\n`rsync`\
  \ 与 `copy` 命令类似，你可以使用 `rsync` 将文件从一个地方复制到另一个地方，从一个文件复制到另一个，甚至从一个目录树复制到另一个——这些都是\
  \ `copy` 命令可以实现的功能。\n\n那么，使用 `rsync` 命令的真正原因是什么？它的优势在于操作速度、仅复制更改部分的效率以及可以在 SSH 内部使用以提高安全性。\n\
  \n`rsync` 命令如此实用的一个主要方面是，`rsync` 可以创建一组文件和目录的副本，还可以仅复制文件、目录以及文件和目录树之间的变化。这使得它比传统的\
  \ `copy` 命令快得多且高效得多，因为它只需要复制并更新文件和目录的变化。\n\n要对目录及其所有后代创建镜像，请使用以下命令：\n\n```\n# rsync\
  \ -ar ./somedir /data/someotherdir\ndatafile1\ndatafile2\ndatafile3\n<output truncated>\n\
  ```\n\n这将创建从源（`somedir`）到目标（`/data/someotherdir`）的每个文件和目录的精确镜像副本，包括上述的全部内容、所有权、文件权限和时间戳。\n\
  \n`rsync` 的一个大特性是其跨系统执行复制和镜像功能的能力。它的用法方式类似于 `scp` 命令：\n\n```\n# rsync -avzh /home/ross/datafiles\
  \ ross@192.168.10.20:~\ndatafile1\ndatafile2\ndatafile3\n<output truncated>\n```\n\
  \n该命令开启到远程系统的连接，并将目录 `/home/ross/datafiles` 传输到远程机器，并在该系统创建或更新 `/home/ross/datafiles`\
  \ 目录。\n\n`rsync` 的另一个关键特性是能够通过 SSH 协议执行其所有正常操作，例如将目录树从本地系统复制到远程系统：\n\n```\n# rsync\
  \ -avzh datafiles -e ‘ssh -p 22’ ross@192.168.10.20:~\ndatafile1\ndatafile2\ndatafile3\n\
  <output truncated>\n```\n\n并不是你所有的 `rsync` 操作都是快速的。某些操作可能包含许多兆字节，更有可能包含多个 GB 的数据。确定操作进度的一个非常实用的选项是\
  \ `--progress` 选项，你还可以添加 `--delete` 选项，以确保目标目录是源内容的镜像：\n\n```\n# rsync -avzh test\
  \ --progress --delete ross@10.0.0.41:~\nPassword:\ndeleting test/etc2/xrdb/Xaw.ad\n\
  deleting test/etc2/xrdb/Tk.ad\ndeleting test/etc2/xrdb/Motif.ad\ndeleting test/etc2/xrdb/General.ad\n\
  deleting test/etc2/xrdb/Emacs.ad\ndeleting test/etc2/xrdb/Editres.ad\ndeleting test/etc2/xrdb/\n\
  deleting test/etc/magiccap.order\ndeleting test/etc/magic.mime\n\nsent 97.42K bytes\
  \  received 124.60K bytes  63.43K bytes/sec\ntotal size is 6.57M  speedup is 29.60\n\
  ```\n\n如你所见，此命令完成了你想的操作：删除了源端不存在的各种文件和目录，并提供了传输到远程系统的统计信息，包括传输过程中发送和接收的数据量以及传输的总大小。\n\
  \n简而言，`rsync` 是一个非常有用的命令，也是任何优秀系统管理员工具箱的关键部分。它非常像 `copy` 命令和 `scp` 的结合，并带有其他很棒的选项。\n\
  \n## 文件编辑\n\n让我们从最常用的编辑器 Vim 开始。\n\n`vim` 最令人困惑的事情之一是编辑器中存在“模式”或“状态”。它有三种模式：\n\n\
  - 命令模式（Command）\n- 插入模式（Insert）\n- 最后一行模式（LastLine），也称为“ex” 模式\n\n每种模式都用于不同的用途。`命令模式`\
  \ 用于移动光标并对文本进行操作。`插入模式` 用于向文档添加文本。`最后一行模式` 用于调用更复杂的模式，例如搜索和替换，或者操作分屏窗格。\n\n### 消息行（Message\
  \ Line）\n\n`vim` 屏幕底部包含许多条可以帮助你的信息，根据情况和刚刚完成的操作而异。本部分详细说明了可能出现的一些消息。\n\n如果你刚刚进入\
  \ `vim file1`，当编辑器打开文件时，消息行应包含类似的内容：\n\n```\n“/home/rbrunson/file1” 57L, 1756C 18,1\
  \ Top\n```\n\n消息行右侧的数字 `18,1` 是当前的行号和列号，`Top` 文字是光标的位置。如果你进入了文件的后半部分，它会变为 Bot。另一个可能的值是\
  \ All，这表示文件的所有内容都显示在屏幕上。\n\n新文件（通过 `vim file1` 产生）会显示：\n\n```\n“file1” [New File]\
  \ 0,0 All\n```\n\n如果你处于插入模式，消息行将显示：\n\n```\n-- INSERT -\n```\n\n### 在 Vim 中编辑\n\n\
  **vim** 总是以命令模式启动，除非你另指定。真正的编辑（你输入字符且字符显示在屏幕上）在插入模式下进行。\n\n你从命令模式调用插入模式的常用键有：\n\n\
  \n\n\n\n-   **i:** 进入插入模式（Insert mode）最常用的方法是按下 `i` 键，光标将停留在当前位置。从该点开始的所有输入都会将现有文本向右推。将其想象为“在此处插入”。\n\
  -   **I:** 大写的 `I` 键会移动到当前行的开头，从那里开始的作用类似于 `i` 键。将其想象为“在行首插入”。\n-   **a:** 第二种常用方法是按下\
  \ `a` 键，它会将光标向右移动一个字符，之后本质上表现得像 `i` 键。将其想象为“在当前位置后追加”。\n-   **A:** 大写的 `A` 会移动到当前行的末尾，从那里开始的作用类似于\
  \ `a` 键。将其想象为“追加到行尾”。\n-   **o:** 使用此键在当前行下方打开一个新行。例如，如果你在命令模式（Command mode）下处于第\
  \ 3 行，按下 `o` 将第 4 行向下变为第 5 行，并打开一个空的第 4 行。将其想象为“在下方打开新行”。\n-   **O:** 大写的 `O` 会在当前行上方打开一个新行。例如，如果你处于第\
  \ 3 行，按下 `O` 将第 3 行向下变为第 4 行，并打开一个供编辑的空第 3 行。将其想象为“在打开新行”。\n\n返回命令模式非常简单：至少按下一次\
  \ `Esc` 键；许多人为了确保自己确实回到了该模式会连按两次。在任何时候，你都可以从插入模式通过按下 `Esc` 键返回命令模式。\n\n### 打开文件进行编辑\n\
  \n要在当前子目录中创建新文件，你需要输入 `vi filename`。\n\n要在特定目录下创建新文件，请使用完整路径：`vi /full/path/to/file`。\n\
  \n有时，你可能希望 `vim` 带有搜索字符串打开文件，并将光标置于该字符串的第一个出现处。要实现这一点，请输入 `vi +/string filename`。\n\
  \n其他时候，你可能想编辑一个文件，并在打开时让光标跳转到特定行，例如 `/etc/inittab` 中的 `initdefault` 行。在这种情况下，你应该输入\
  \ `vi +18 /etc/inittab`。\n\n#### 注意\n预计 Linux+ 考试中会有关于使用特定选项打开文件、打开时搜索文件以及以其他方式启动\
  \ `vim` 编辑器的问题。`+` 命令行选项告诉 `vim` 在文件打开后运行该特定命令。\n\n### 在文件内导航\n\n`vim` 编辑器允许你使用以下按键向左、右、上、下移动，如果你有光标键，也可以使用它们：\n\
  \n-   **h:** 此功能相当于`左箭头` 键；它很容易记忆，因为它是这四个键组中最左侧的键。\n-   **j:** 用于`向下箭头`（Down Arrow）。\n\
  -   **k:** 用于`向上箭头`（Up Arrow）。\n-   **l:** 用于`右箭头`（Right Arrow）。\n\n图 2-4 展示了这些键是如何工作的。\n\
  \n![Images](img/key_topic_icon.jpg)![Images](img/02fig04.jpg)\n\n**图 2-4**–光标键方向\n\
  \n如你在图 2-4 中所示，记住键盘光标键的方法之一就是看向主行，并记住 `h` 是最左侧的，`j` 是 jown（向下），`k` 是 kup（向上），而 `l`\
  \ 位于右侧。这看起来完全合乎逻辑，对吧？\n\n#### 提示\n你会在 Linux+ 考试中看到关于移动键的问题。箭头键是一个热门话题，而 `Ctrl` 键并不怎么受关注。记住那些箭头（`h,\
  \ j, k, l`）移动键吧！\n\n你还可以通过 `Ctrl` 键组合在 `vim` 中移动：\n\n-   `Ctrl+F`: 向前翻页。\n-   `Ctrl+B`:\
  \ 向后翻页。\n-   `Ctrl+D`: 向翻半页。\n-   `Ctrl+U`: 向后翻半页。\n-   `G`: 移动到特定行，例如 `12G` 跳到第\
  \ 12 行。如果没有数字，`G` 会带你到文件末尾。\n\n### 力量倍增器\n\n通过在任何按键或操作前加上一个数字，你可以让该操作重复指定的次数。例如，在命令模式下，要向下移动\
  \ 5 行，输入 `5j`。向右移动 12 个单词则通过 `12W` 完成。\n\n大量的编辑、插入和返回操作有时会导致消息行（message line）不显示某些相关信息，例如正在编辑的文件名。当你对所处位置或以哪个文件名保存了文件的某个版本感到困惑时，可以在命令模式下按下\
  \ `Ctrl+G` 查看文件名、总行数以及以文件总行数百分比表示的当前位置。\n\n### 撤销操作\n\n撤销操作是一组有用且很大程度上不为人知的选项。在命令模式下按下\
  \ `u` 即可撤销单次操作或一系列更改中的最后一次。如果你打开了一个文件，做了 30 次更改，然后按下 `u` 键 30 次，你最终将获得与最初打开完全相同的文件。\n\
  \n不要尝试使用 `U` 来撤销所有更改；那不是它的作用。`U` 撤销的是单行上的所有更改。相反，使用 `:e!` 键组合可以撤销自上次写入磁盘以来的所有更改。`:`\
  \ 将你带到最后一行模式（LastLine mode），而 `e!` 命令重新加载当前文件，丢弃所有未保存的更改。\n\n### 保存文件\n\n在 `vim`\
  \ 中保存文件最直接的方法是在命令模式下输入 `:w`。这会保存文件并允许你继续编辑。为了记住 `w`，可以想“write”（写入）。\n\n![Images](img/key_topic_icon.jpg)\n\
  \n### 退出 vim\n\n当你对文档进行更改后，`vim` 不允许你正常退出（例如使用 `:q`）。每个 `vim` 用户面临的最令人沮丧的情况之一就是著名的“E37:\
  \ no write since last change (add ! to override)”消息。此错误只能通过使用正确的额外 `!` 字符来修复。要退出只读文件或不想保存更改的文件，你必须使用按键组合\
  \ `:q!`。这被称为 *qbang*，或“quit dammit（妈的，退出）”。\n\n#### 注意\n如果每有一个学生卡在 `vim` 里且必须使用\
  \ `:q!` 选项退出，我就能拿到美元，我会非常富有。\n\n保存并退出指定文件也很简单。在命令模式下输入 `:wq`。通过“write, quit”（写入并退出）来记住此命令。如果你以\
  \ root 用户身份编辑文件（如配置文件），该文件可能缺少写入权限，这意味着 `:wq` 命令将失败。输入 `:wq!` 会强制写入文件，只要唯一的障碍是缺少写入权限。\n\
  \n还有两种保存和退出文件的方法。第一种是输入 `:x` 保存并退出。第二是按下 `ZZ`（按住 `Shift` 键并按两次 `Z` 键）；这是我最喜欢的，容易记忆。因为\
  \ `:x` 以冒号开头，`x` 是一个最后一行命令（与 `wq` 相同）。`ZZ` 是一个命令模式命令。`x` 最后一行命令的额外好处是不保存已经保存的文件，这使得在处理大文件时退出快得多。\n\
  \n#### 提示\n仔细阅读 Linux+ 考试题，特别是当它们询问如何保存和/或退出 `vim` 编辑器时。许多考生提到，题目的语法对于获得正确答案至关重要。例如，“以下哪一项可以保存并退出\
  \ `vi` 中的文件？”与“以下哪一项可以用于保存或退出 `vi` 中的文件？”的问题差异很大。\n\n### 修改或替换文本\n\n当你修改现有文件并需要更改字符、行、句子或仅是一个单词时，许多选项非常有用。例如，`c`\
  \ 命令更改文本，你可以在命令后添加额外的修饰来指示 `vim` 更改多少文本。使用以下选项更改或替换文本：\n\n-   `cw`: 从当前光标位置开始更改单个单词。要更改整个单词，将光标放在单词的第一个字符上。\n\
  \n\n\n\n\n- `c$`: 从当前光标位置更改到行尾，即使该行由于换行而在屏幕上显示为另一行也是如此。\n- `r`: 替换光标下的字符。\n- `R`:\
  \ 在输入时替换同一行上的文本，一直到 Esc 键为止，但它不会改变下一行的文本。\n\n### 注意\n\n记住在适当的地方使用力数倍器。你可以通过 `5cw`\
  \ 轻松地更改多个单词，或者使用 `10r` 替换 10 个字符。某些命令不接受力数倍器，例如 `R`，某些命令的行为与你预期的不同。例如，`10O` 接受文本并将其重复\
  \ 9 次。\n\n## 删除文本和行\n\n你可以使用 `vim` 来移除或删除字符、单词，甚至整行。请仔细检查你的删除和更改。同时记住，你可以按下 `u`\
  \ 键让一切恢复正常并重新尝试。以下是 `vim` 中用于删除文本和行的选项：\n\n- `x`: 删除光标下的单个字符。\n- `X`: 删除光标前的单个字符。\n\
  - `dw`: 删除当前光标下的单个单词，从光标位置开始到。\n- `dd`: 完全删除当前行，无论光标在行中的位置如何。\n- `D`: 删除从当前光标位置到行尾的所有文本。\n\
  - `dL`: 删除从光标到屏幕末尾的所有文本。\n- `dG`: 删除从光标到文件末尾的所有文本。\n- `d^`: 删除从行首到光标的所有文本。\n\n###\
  \ 注意\n\n在 `vim` 中进行删除时，`vim` 将剪切或删除的文本字符串存储在匿名缓冲区中以备后使用。该缓冲区的内容会被任何后续的剪切或删除操作覆盖。\n\
  \n### 提示\n\n对于 Linux+ 考试，了解如何删除是非常重要的。如果被要求从当前位置删除到行尾，不要选择或输入删除整行的按键；考试没有部分分！\n\n\
  ## 在 vim 中搜索\n\n在 Linux 实用程序中搜索文本，你通常需要遵循一个通用约定。使用 `less`、`more` 和 `vim` 命令时，正斜杠\
  \ `/` 后跟搜索术语可以从当前光标位置或文件顶部向前搜索，并高亮显示找到的字符串。从光标位置开始反向搜索通过使用问号 `?` 后跟搜索字符串来实现，例如 `?*sometext*`。\n\
  \n### 注意\n\n搜索仅在命令模式（Command mode）下执行，因此记住在搜索前按下 `Esc` 键返回该模式。找到下一次出现（无论是向前还是反向搜索）通常通过按下未大写的\
  \ `n` 键按原始搜索相同的方向来实现。按原始搜索相反的方向搜索，请按下 `Shift+N`。\n\n![Images](img/key_topic_icon.jpg)\n\
  \n## 搜索与替换\n\n当你想要搜索文档中的给定字符串或字符并进行替换时，你通常会在编辑特定文件时使用 `vim`，或者在大数据集上使用 `sed` 命令。`vim`\
  \ 和 `sed` 命令共享通用的搜索和替换语法，细微的差异在你同时使用它们时不会让你感到困惑。事实上，学习其中一个的搜索和替换将让你学会如何在另一个中使用它。\n\
  \n搜索和替换的语法如下：\n\n```\naction/tofind/replacewith/modifier\n```\n\n例如，`vim` 中的以下字符串仅将当前行中字符串\
  \ `bob` 的第一次替换为字符串 `BOB`：\n\n```\n:s/bob/BOB/\n```\n\n要将当前行中所有的 `bob` 替换为 `BOB`，你需要使用此行：\n\
  \n```\n:s/bob/BOB/g\n```\n\n`g` 代表 *global*（全局），或对字符串的每个找到的实例执行该操作。\n\n要替换整个文件中所有的\
  \ `bob` 为 `BOB`，无论存在多少个，或者对每行做了多少更改，你将使用这个：\n\n```\n:%s/bob/BOB/g\n```\n\n### 提示\n\
  \n仔细阅读 Linux+ 多项选择题及其所有答案至关重要，以确切看到在要求什么。搜索和替换字符串前的百分号（`%`）会导致 `vim` 搜索整个文件，而不仅仅是当前行。\n\
  \n## nano, nano\n\n在过去的 20 多年里，我们看到了从使用 `vim` 和 `EMACS` 等更强大的编辑器到使用 `nano` 等编辑器的巨大变化。nano\
  \ 快速且易用，为你提供有关可用按键的屏幕提示，并且编辑文件非常出色。\n\n作为历史背景的一部分，计算机的 RAM 和磁盘空间曾非常有限，因此当系统默认已经存在非常实用的程序包时，不向它们加载额外的包是至关重要的。\n\
  \n很多时候，我走到别人的电脑前——无论是桌面电脑、服务器还是远程连接——在 `vi` 或 `vim` 中编辑文件，完全没有考虑过其他编辑器。我没能使用 `vi`/`vim`\
  \ 的地方只有少数嵌入式操作系统版本的网络边缘系统。这说明了 `vi`/`vim` 的部署是多么一致的。\n\n![Images](img/key_topic_icon.jpg)\n\
  \n### 为什么是 nano 而不是 Pico？\n\nnano 几乎是 Pico 编辑器的完美克隆，Pico 已经存在很久。Pico 是一个非免费许可程序，在\
  \ Unix 和 Linux 上已存在多年，最初是 Pine 邮件程序的一部分。（它是编辑部分，这很合理。）\n\n出于许多原因，Linux 发行版维护者不希望在\
  \ Linux 发行版的所有程序中包含 Pico 编辑器。将免费许可软件和非免费许可软件混合是有问题的且不优雅的，通常会在 Linux 和开源世界中受到白眼。\n\
  \nChris Allegretta 创建 nano 是尝试创建一个 Pico 的虚拟克隆，使其能够在适当的免费软件许可下易于分发。然而，它已经包含了许多功能，这些功能远超\
  \ Pico 的能力，使其赢得了自身的尊重。\n\n### nano 的界面\n\n与界面非常精简的 `vi`/`vim` 不同，nano 为你提供了有关有用按键的屏幕提示。nano\
  \ 不需要要求你使用操作键和如 `:wq` 这样的最后一行命令，而是 允许你使用 `Ctrl` 键配合另一个键。图 2-5 展示了调用 `nano` 命令时的用户界面。\n\
  \n![Images](img/key_topic_icon.jpg)![Images](img/02fig05.jpg)\n\n**图 2-5**–`nano`\
  \ 命令界面，显示了屏幕上的 `Ctrl`-key` 键编辑和格式化选项\n\n如你在图中所示，`nano` 界面的最后两行用于 14 个实用的命令，并提供关于按下按键的提示。`^`\
  \ 字符表示 `Ctrl` 键，后面跟着你按住 `Ctrl` 键时要按的字符，例如 `Ctrl+X` 用于退出文件或缓冲区（如果你没有正在编辑的文件，此时会提示你保存或丢弃\
  \ nano 会话中做的任何更改）。\n\n该界面有点误导性，因为界面中 `^` 字符后面的字符是大大写字母。然而，你不需要使用 `Ctrl-Shift-X`\
  \ 来退出编辑器。这显然是为了可读性，并且值得注意的是，因为 Linux 其他部分和命令行交互对大小写的区分是非常严格的。\n\n除了 `Ctrl` 键组合外，你还可以使用\
  \ Meta 键，它的映射方式各异，但可以通过按下 `Esc` 键加上指示的按键字符来通用访问。例如，在输入一些文本后，你可以点击 `Esc` 键然后按 `U`\
  \ 键来调用撤销功能，然后再次点击 `Esc` 并按 `E` 键来恢复你刚刚撤销的内容。\n\n\n\n\n`nano` 允许将 Esc 键作为 Meta (M)\
  \ 键，但取决于你的电脑操作系统、用户配置以及其他因素，它也允许你使用 PC 键盘上的 Windows 键，或者 Mac 系统上的 `Cmd` 或 Apple\
  \ 键。\n\n如果你正在操作的文本终端识别了鼠标，你还可以使用鼠标在 `nano` 内部进行选择、剪切、复制和粘贴文本，即使在非 GUI 会话中也是如此。\n\
  \n## 结\n\n`nano` 比 `vi`/**`vim` 稍微更直观一些，但如果你想了解更多信息，可以按 `Ctrl+G` 访问帮助文档，并使用导航键查找有关\
  \ `nano` 功能和按键组合的所有信息。\n\n## 总结\n\n在本章中，你学习了大量影响系统日常操作的文件和目录相关任务。你学习了文件和目录、如何管理它们、如何获取有关系统文件的更多信息，以及如何使用\
  \ `file` 和 `stat` 等命令获取更多有用信息并对其进行格式化。你还学习了链接（包括硬链接和软链接/符号链接）、文件压缩（使用 `tar` 命令）以及数据备份是如何实现的。\n\
  \n此外，你意识到并学习了数据需要使用 `scp` 命令及其选项在系统之间传输，最后全面学习了在 Linux 系统上使用 `nano` 和我最喜欢的编辑器 VIM\
  \ 进行文本编辑，内容虽然全面但并不冗长。\n\n## 考试准备任务\n\n如引言中“目标与方法”部分提到的，你有几种准备考试的选择：这里的练习题、第 23 章、“终极准备](#ch23.xhtml_ch23)”以及\
  \ Pearson Test Prep 在线软件中的考试模拟题。\n\n## 复习所有关键主题\n\n回顾本章中最重要的主题，这些主题在页外边缘处用关键主题（Key\
  \ Topic）图标标记。表 2-2 列出了这些关键主题及其所在的页码。\n\n![Images](img/key_topic_icon.jpg)\n\n**表\
  \ 2-2**–第 2 章 关键主题\n\n![Images](img/02tab02.jpg)![Images](img/02tab02a.jpg)\n\n\
  ## 定义关键术语\n\n定义本章的关键术语并在词表中检查你的答案：\n\n绝对路径\n\n相对路径\n\n权限\n\n所有权\n\n通配符(glob)\n\n\
  通配符匹配(globbing)\n\n递归\n\n元数据\n\n格式序列\n\n符号链接\n\n硬链接\n\n存档\n\n压缩\n\n增量\n\n差异\n\n\
  命令模式\n\n插入模式\n\n末行模式\n\n力量倍增器\n\ntar 包(tarball)\n\n## 复习题\n\n这些复习题的答案在 附录 A。\n\n\
  **1.** 你当前位于 `/etc/nginx/conf.d` 目录，并想用最少的字符输入返回你的用户主目录。下列哪项可以实现这一目标？\n\n**a.**\
