  \ shell？在下方空白处填写该命令：\n\n__________________________________________\n\n\n\n\n\n在过去，你只需要移动椅子就能在服务器系统上工作，但这种情况很快就变成了：所有的服务器都放在另一个地方的机房里，你不仅不想走过去，甚至可能和服务器根本不在同一个位置、城市甚至国家！\n\
  \n我是在 `Telnet`（一种早于 `SSH` 的、不安全的远程连接选项）和明文 FTP 盛行的计算机时代长大的，那个世界要友好得多、更温柔得多，黑客行为并不常见，人们在走廊里会互相点头打招呼。\n\
  \n遗憾的是，但意料之中，情况很快演变成了这种地步：我们真正需要安全的终端访问，并且能够安全、可靠地连接到远程系统进行工作（主要是进行管理），这已成为了一项绝对性要求。\n\
  \n今天，你必须安装 `SSH`，将其配置为所能实现的最高安全性，甚至还要知道如何使用密码句验证，而不是每次连接到服务器（或者连续或同时连接到几十台服务器）时都只输入密码！\n\
  \n本章另一个非常重要的概念是特权提升，或者正如目标所述的“以另一个用户的身份执行命令”，这需要许多不同的工具，而这些工具对于初级且负责的系统管理员来说，掌握知识（并实践！）至关重要。\n\
  \n特权提升结合 `SSH` 使用尤为合适，因为你通常不会允许 root 用户通过 `SSH` 登录，因此获取 root 限制资源的访问意味着，当你到达另一个系统时，你需要提升到拥有\
  \ root 权限或等效权限！\n\n### “我已经掌握这些了吗？”测验\n\n“我已经掌握这些了吗？”测试可以帮助你评估是应该阅读整个章节，还是直接跳到“考试准备任务”部分进行复习。如果你有疑问，请阅读整个章节。表\
