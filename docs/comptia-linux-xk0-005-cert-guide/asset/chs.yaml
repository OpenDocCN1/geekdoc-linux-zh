  \n**c.** `sudoedit`\n\n**d.** `nanobot`\n\n## 第 12 章。理解并应用访问控制\n\n本章涵盖了以下主题：\n\n\
  • `文件权限`\n• `安全增强型 Linux (SELinux`\n• `基于上下文的访问`\n• `命令行工具`\n\n本章涵盖的考试目标如下：\n\n\
  • **目标 2.4:** 给定场景，应用适当的访问控制\n\n设置、维护和验证系统资源的访问是成为合格系统管理员的关键部分。\n\n在本章中，我们将观察简单的访问控制世界，然后通过\
  \ SELinux 和 AppArmor 这两个竞争对手将工具的复杂性和提升提升。\n\n### “我掌握了吗？”测试\n\n“我掌握了吗？”测试可以让你评估自己应该阅读整个章节，还是直接跳转到“考试准备”部分进行复习。如果你有疑问，请阅读整个章节。`表\
  \ 12-1` 概述了本章的主要章节和相应的“我掌握了吗？”测试题。你可以在 `附录 A` 中的“‘我掌握了吗？测试和复习题的答案](#appa.xhtml_appa)”中找到答案。\n\
  \n**表 12-1**–“我掌握了吗？”基础主题章节到问题的映射\n\n![Images](img/12tab01.jpg)\n\n**Caution**\n\
  \n自测的目标是衡量你对本章主题的掌握情况。如果你不知道某个题目的答案或者答案不确定，你应该将该问题标记为错误。猜测答案会误导自测结果，并给你虚假的安全感。\n\
  \n**1.** 作为系统管理员，你需要设置一个多用户共享目录。设置什么特殊权限可以导致所有继承？\n\n**a.** 0\n\n**b.** 1\n\n**c.**\
  \ 2\n\n**d.** 4\n\n**2.** 你想更改文件或目录的组所有者。下列哪些实现这一点？（选择两个）\n\n**a.** `chuser`\n\n\
  **b.** `chgrp`\n\n**c.** `chown`\n\n**d.** `chmod`\n\n**3.** 下列哪一个被认为是 MAC 安全系统？\n\
  \n**a.** SecureMAC\n\n**b.** AppArmor\n\n**c.** Lockdown\n\n**d.** AppSecure\n\n\
  **4.** 下列哪些是有效的 SELinux 模式？（选择适用项）\n\n**a.** Disabled\n\n**b.** Enforcing\n\n**c.**\
  \ Defensive\n\n**d.** Permissive\n\n**e.** Progressive\n\n**5.** 哪个命令用于显示进程的安全上下文？\n\
  \n**a.** `show`\n\n**b.** `list`\n\n**c.** `ps`\n\n**d.** `ls`\n\n**6.** 哪个命令用于显示文件的安全上下文？\n\
  \n**a.** `show`\n\n**b.** `list`\n\n**c.** `ps`\n\n**d.** `ls`\n\n### 基础主题\n\n对系统资源的访问进行适当控制非常重要。传统的\
  \ Linux 在添加 `ACL 或访问控制列表` 之前不支持多个用户所有者、组所有者以及具有访问权限的用户组。\n\n此外，通过使用 SELinux 和 AppArmor\
  \ 加固系统是保护这些系统并维持系统资源控制另一种方法。\n\n\n\n\n\n特别地，当 Linux+ 目标在章节末尾有一大堆命令时，我们将在对各个主题的正常讨论过程中遇到所有的命令。\n\
  \n如果还有任何遗漏，它们将在“命令行实用”部分进行介绍。\n\n## 文件权限\n\n`权限` 决定了用户如何访问系统上的资源。系统安全通过用户的 `UID`（用户\
  \ ID）、`GIDs`（组 ID——包括主组和次要组）以及其尝试访问的对象的权限来配置。\n\n系统上的每个对象必须至少属于一个用户所有者和一个组所有者。这是一项安全功能，有助于确定谁有权对文件系统上的对象执行什么操作，这将在后续章节中进行讨论。\n\
  \n### 权限三组位\n\n![Images](img/key_topic_icon.jpg)\n\n图 12-1 显示了组成文件权限部分的 10 个位置（1\
  \ 个类型位和 3 组权限位）。\n\n![描述：自动生成的表格描述](img/12fig01.jpg)\n\n**图 12-1**–权限三组位\n\n10 位中的第一个位是对象的类型：\n\
  \n- `.`: 表示这是一个普通文件。\n- `l`: 表示这是一个符号链接（sympolic link），它是一个指向另一个对象的文件。\n- `b`: 表示这是一个块设备文件。\n\
  - `c`: 表示这是一个字符设备文件。\n- `d`: 表示这是一个目录。\n\n接下来的 9 位是权限三组位。每组权限位都会影响一组特定的用户（用户所有者、组所有者或其他）。要确定用户对给定对象具有何种权限，从左侧开始，一旦匹配到匹配项，该组权限位即为该用户和对象的生效权限。以下是这三组：\n\
  \n- `用户所有者`：如果该用户是用户所有者，则此三组权限位生效。\n- `组所有者`：如果用户的主组或次要组是该组，但前提是该用户不是用户所有者，则此三组权限位生效。\n\
  - `其他 (Other)`：如果该用户既不是用户所有者也不是组所有者的成员，则此三组权限位生效。\n\n注意\n\n在某些现代 Linux 系统上，你会在权限集紧随其后的另一个字符。这可能是\
  \ `.` 字符（与 SELinux 相关），也可能是 `+` 字符（与访问控制列表 ACL 相关）。不要在脑海中混淆 Windows 环境和 Linux。Linux\
  \ 文件系统权限（非 ACL 权限）没有所谓的“生效权限”；你必须使用 ACL 才能拥有多个用户所有者或多个组所有者。\n\n每组权限位由 3 位组成（值可以是\
  \ 4, 2, 1）。这些位的工作原理就像开关：如果某位是开启的，则该值计数；如果是关闭的，则该值不计数。该值用于 `chmod` 命令以及其他命令。\n\n\
  ![Images](img/key_topic_icon.jpg)\n\n位值对应于文件的以下权限：\n\n- `4`: 读取 (Read)，即查看文件内容的能力。\n\
  - `2`: 写入 (Write)，即更改文件内容的能力。\n- `1`: 执行 (Execute)，意味着文件可以执行（脚本还需要读取权限，但二进制文件仅需执行权限即可运行）。\n\
  \n这些权限对于目录具有相似但略有不同的含义：\n\n- `4`: 读取 (Read)，即查看目录内容的能力（使用 `ls` 命令）。然而，要查看文件属性（例如使用\
  \ `ls` 命令的 `-l` 选项），还需要该目录的执行权限。\n- `2`: 写入 (Write)，即在目录中添加和删除文件的能力。对于目录来说这是一项强大的权限，因为如果用户对目录有写入权限，就可以删除目录中的每个文件，即使是他不拥有的文件。注意：为了使写入权限有效，用户还必须拥有执行权限。\n\
  - `1`: 执行 (Execute);用户可以使用 `cd` 命令进入目录，或在路径中使用该目录。例如，如果用户尝试执行 `cd /home/bob`，她需要\
  \ `/` 目录、`home` 目录和 `bob` 目录的执行权限。\n\n为了更好地理解目录权限，将目录想象成房间。如果你想看房间里有什么，你需要一个窗户。将读取权限想象成窗户。如果设置了此权限，你就可以看到目录（房间）。如果你想进入房间，你需要一扇门。将执行权限想象成门。这个概念有助于理解写入权限的注意事项：要从房间里取出东西，你首先必须能够进入房间！\n\
  \n如果你对一个对象执行 `ls -l` 命令，且其权限三组为 666（或 `rw-rw-rw-`），那么通过可能的位值得到该数字唯一方法就是 `4` 和 `2`\
  \ 位开启的——即 `rw-`（读取和写入，但不执行）。如果你看到一个文件设置为 666，这等同于三组权限具有相同的权限——读取和写入但不执行。\n\n注意\n\
  \n留意 Linux+ 考试题，它们可能会通过一个既是用户所有者又是组所有者成员的用户来误你，但执行或更改文件的正确权限并不在某一组位中。你不能混合这些组位，即使你的用户账户涵盖了其中的几组。\n\
  \n例如，假设名为 fred 的用户是文件对象 `/home/fred/22AcaciaAvenue.mp3` 的用户所有者，并且是对象的组所有者成员。文件的列表设置了以下权限：\n\
  \n```\n-rw-r-xr-x 2 fred users 0 Jan 26 13:08 22 AcaciaAvenue.mp3\n```\n\nfred 用户的权限似乎跨越了各个组，但因为\
  \ fred 是用户所有者，他匹配了第一组并在此停止。换句话说，用户 fred 拥有读写权限，但没有执行权限，尽管 fred 是 users 组的成员，且该组成员对此文件拥有执行权限。\n\
  \n### 修改权限\n\n`chmod` 命令用于修改或更改对象的权限三组位。只有 root 用户和对象所有者可以更改权限。\n\n操作对象权限的两种模式是八进制和符号。这两种模式都有其用武之地，但很难说现在哪种模式更常用于设置权限。\n\
  \n通用规则是，如果你想设置权限（即清除当前权限并将其设置为给定的权限），你应该使用八进制方法，看起来像所示：(644, 777 等)。如果你想更改权限，则使用符号或字母方法：(g+rx,\
  \ o=a)。很多时候我需要为不小心设置了整个目录结构权限并导致混乱的人收拾残局。你应该熟悉并熟练掌握这两种方法，但记住符号方法更加严谨精确。\n\n![Images](img/key_topic_icon.jpg)\n\
  \n### 八进制模式\n\n`octal` 表示法使用相同的位来描述你想要的权限（4 = 读取，2 = 写入，1 = 执行）。例如，如果你被告知某个对象的当前权限是\
  \ 644，并被要求确保所有用户对该对象具有读取和写入访问，请执行以下命令：\n\n```\nchmod 666 file1\n```\n\n`chmod` 命令对文件组也非常好用：\n\
  \n```\n# chmod 644 /home/lukec/*.txt\n```\n\n它甚至适用于目录及其内容。例如，假设用户 bertrandr 有一个目录，他想将其中所有文件的权限设置为\
  \ 640，以使文件更安全。他可以使用以下命令：\n\n```\n# chmod -R 640 /home/bertrandr/data/*\n```\n\n\n\
  \n花一点时间理解为什么这条命令是这样工作的。`chmod` 命令有一个 `-R` 选项，它会影响命名的对象及其所有子对象。用户 `bertrandr` 并不想更改数据目录本身的权限；他只是想更改内容的权限，这就是为什么目标末尾有斜杠和星号的原因。此命令作用于\
  \ `/home/bertandr/data` 目录的所有内容，但不会修改目录的权限。然而，如果 `/home/bertandr/data` 目录中有任何目录，所有这些目录的权限将被更改（以及它们下面的所有文件和目录）！\n\
  \n`chmod` 命令有几个实用的选项：\n\n- `-c`: 仅报告哪些文件被更改。\n- `-v`: 报告所有文件。\n- `-h`: 修改符号链接，而不是原始文件。\n\
  - `-f`: 抑制错误消息。\n- `-R`: 递归操作目录。\n\n`chmod` 命令的递归选项是大写的 `R`，而不是像其他命令那样小写的 `r`。如果你熟悉各种命令选项的大小写，那么你在\
  \ Linux+ 考试中将游刃有余。\n\n### 注意\n使用八进制表示法时，你应该始终指定三个值：所有者、组和其他用户。如果你只指定了一个值，系统将使用该值用于其他权限设置，并假设所有者和组的权限值为\
  \ 0。这永远不是一个好主意！\n\n![Images](img/key_topic_icon.jpg)\n\n### 符号模式\n当使用符号值运行 `chmod`\
  \ 命令时，请记住你可以像数字模式中一样更改所有权限，但你需要使用一个长得多的命令。使用符号模式 的主要目的是为了影响或修改较小组的权限，而不是覆盖所有权限。\n\
  \n使用符号模式时，你使用字母来识别每组权限：\n\n- 用户所有者 = `u`，组所有者 = `g`，其他 = `o`，所有 = `a`\n- 限定符：`+`\
  \ 添加，`-` 移除，或 `=` 分配\n- 正在设置的权限：`r` = 读，`w` = 写，`x` = 执行\n\n要使用符号值设置权限，你可以一次性更改所有权限，如下命令所示：\n\
  \n```\n# chmod a=rwx file\n```\n\n这产生了权限设置为 -rwxrwxrwx 的权限三元组。\n\n或者你可以使用每个标识符，并用逗号将其限定符和权限分开：\n\
  \n```bash\n# chmod u=rw,g=rx,a= file\n```\n\n这产生了一个权限被设置为 -rw-r-x--- 的文件。\n\n###\
  \ 注意\n这种使用符号模式的方法对于频繁使用来说既笨拙又不够优雅。仅在你想要微调权限时使用符号模式，而不是在你想要设置所有权限时。\n\n将用户所有者的权限更改为\
  \ rwx，使用以下命令：\n\n```bash\n# chmod u=rwx mystuff\n```\n\n将组所有者的权限更改为 r-x，使用以下命令：\n\
  \n```bash\n# chmod g=rx mystuff\n```\n\n将其他或其他所有人的权限更改为 r，使用此命令：\n\n```bash\n# chmod\
  \ o=r mystuff\n```\n\n在使用符号模式时请记住，你没有指定的权限将保持在你执行 `chmod` 命令之前的状态不变。\n\n你可以使用几种方法在不知道文件其他权限的情况下将文件设为可执行。例如，如果你知道一个文件存在，但不知道其权限，并且被要求确保所有权限三元组都可执行，请使用以下命令：\n\
  \n```bash\n# chmod a+x file1\n```\n\n或者，你可以省略 `a`，默认即可获取所有三元组：\n\n```bash\n# chmod\
  \ +x file1\n```\n\n记住：在更改权限时，你始终可以使用数字方法或符号方法。在更改所有权限时，数字方法通常更简单，而在更改一个或少数权限时，符号方法通常更简单。\n\
  \n### 文件和目录所有权\n所有权对任何 Linux/UNIX 系统都至关重要，所有内容都必须至少有一个用户所有者和一个组所有者，不要将其与额外的组混淆。\n\
  \n你可以使用 `ls` 命令查看你有权访问任何对象的所有权，但请确保使用 `-l` 选项，以便权限和所有权正常显示。\n\n#### 更改文件所有权\n`chown`\
  \ 命令用于在一个命令中设置用户所有者、组所有者或者的组合。`chown` 命令的格式为：\n\n```bash\n# chown -options user:group\
  \ object\n```\n\n`chown` 命令接受以下两种命令作为有效命令（所有者/组分隔符可以是 `:` 或 `.` 字符）：\n\n```bash\n\
  # chown snuffy:users file1\n# chown snuffy.users file1\n```\n\n此外，你可以使用 `chown`\
  \ 的以下语法：\n\n![Images](img/square.jpg) `owner`: 仅更改用户所有者。\n\n![Images](img/square.jpg)\
  \ `owner:group`: 同时更改用户所有者和组所有者。\n\n![Images](img/square.jpg) `owner::`: 更改用户所有者并将组所有者设置为当前用户的主组。\n\
  \n![Images](img/square.jpg) `:group`: 仅更改组所有者并保持用户所有者不变。\n\n假设用户 `snuffy` 的主组名为\
  \ `users`，且该账户是 `accounting` 组的辅助组成。默认情况下，`snuffy` 在系统上创建的每个对象都以 `snuffy` 为用户所有者，`users`\
  \ 为组所有者。这会在共享目录中引起问题。例如，如果 `snuffy` 访问一个组所有权设置为 `accounting` 组的共享目录，并创建一个名为 `snuffysexpenses.txt`\
  \ 的文件，那么该文件对于共享目录的任何其他用户都是不可见的，除非他们也是 `users` 组的成员。\n\n假设用户 `martha` 费用并需要拥有该文件，而你作为管理员想将此文件的组所有权更改为\
  \ `accounting` 组。为了完成此任务，使用此命令：\n\n```bash\n# chown martha:accounting snuffysexpenses.txt\n\
  ```\n\n假设现在文件需要由另一个负责签字的用户 `fluchre` 所有；你可以仅更改用户所有者而无需担心组所有者：\n\n```bash\n# chown\
  \ fluchre snuffysexpenses.txt\n```\n\n如果出于某些原因你决定整个文件树需要更改所有权，可以使用以下命令更改所有项：\n\n\
  ```bash\n# chown -R root:accounting /accounting\n```\n\n### 注意\n系统中唯一可以更改对象用户所有权的用户是\
  \ `root` 用户。即使是文件的所有者也不能将所有权“赠给”另一个用户。然而，只要用户是她正在更改的组的成员，普通用户就可以更改对象的组所有权。\n\n####\
  \ 更改组所有权\n当只需要更改组所有者时，最简单的方法是使用 `chgrp` 命令。该命令的语法简单：\n\n```bash\n# chgrp staff file1\n\
  ```\n\n将大量文件更改另一个组所有者需要使用 `-R`（递归）选项：\n\n```bash\n# chgrp -R staff /data/*\n```\n\
  \n此命令将 `/data` 目录（及其所有子目录）的内容组所有者改为 `staff`，但保持用户所有者不变。\n\n`chgrp` 命令的选项包括：\n\n\
  ![Images](img/square.jpg) `-c`: 仅对更改的对象显示一行输出。\n\n![Images](img/square.jpg) `-h`:\
  \ 修改符号链接，而不是原始文件。\n\n![Images](img/square.jpg) `-R`: 递归影响目标及其所有子项。\n\n![Images](img/square.jpg)\
  \ `-v`: 为每个对象显示一行输出，无论对该对象执行了什么操作。\n\n\n\n\n\n虽然这并不是 Linux+ 的考试目标，但在处理组所有权时，`newgrp`\
  \ 命令可能非常有用。如果一个普通用户是 `groupname` 的成员，他可以执行命令 `newgrp groupname`。这会打开一个新的 shell，其中主组为\
  \ `groupname`，这在创建一组需要由次要组拥有的文件时非常有用。若要关闭这个新 shell，只需执行 `exit` 命令即可。\n\n### 理解和使用\
  \ umask\n\n`Umask` 已在 第 8 章 “[理解 Linux 安全最佳实践]”中进行详细介绍过。\n\n### 权限粒度问题\n\n由于由于，Linux\
  \ 和 Unix 文件系统构建方式的几个方面可能会给管理员带来困扰。例如，如果你没有使用 ACL（访问控制列表），则一个对象只能有一个组作为组所有者。任何想要访问该对象的人必须是该文件所属组的成员（除非你作为文件所有者想给所有其他人权限）。例如，考虑以下\
  \ `ls -l` 输出：\n\n```\n-rw-r----- 1 bob staff 0 Jan 26 13:08 22 data.txt\n```\n\n\
  为了看到此文件的内容，你需要是 bob 用户或者是 staff 组的成员。\n\n要配置许多组和用户以访问正确的文件可能是困难的。每个用户都有一个主组，并可以是额外组的成员（次要组）。当在属于共享次要组的成员之间共享文件时，这会产生问题。例如，假设\
  \ bob 用户（主组 staff，次要组 project）、sue 用户（主组 payroll，次要组 project）和 steve 用户（主组 acct，次要组\
  \ project）正在合作完成一个项目，并在 `/home/project` 目录下共享文件。bob 用户创建了一个文件，用 `ls -l` 命令列出时，它显示如下：\n\
  \n```\n-rw-r----- 1 bob staff 0 Jan 26 13:08 22\ndata_for_sue_and_steve.txt\n```\n\
  \n遗憾的是，尽管所有用户都在同一个组（project 组），但 sue 和 steve 用户无法查看此文件的内容。他们不是 staff 组的成员，因此他们对该文件的权限设置为“其他”（others）。\n\
  \n正如后文所述，bob 用户可以更改文件的组所有权为 project 组，但用户在每次创建文件时都必须执行此操作。假设所有用户都会一直记得这样做是不合理的（而且，作为管理员，你并不希望教所有用户在他们的文件上执行此操作）。\n\
  \n这种情况有种解决办法：你可以在共享目录上设置一个额外的或特殊的位位，这会使得所有访问该目录的用户在在该目录下创建的所有对象上，都会继承该目录的组所有者。这种权限被称为\
  \ `SGID`，在本章中将详细介绍。\n\n注意\n\n过去，只有少数 Linux 发行版具有 ACL（访问控制列表），你只能使用特殊位位权限来尝试允许多组用户访问资源。现在，许多发行版都支持\
  \ ACL，特殊位位由于这些原因的使用频率有所降低。\n\n#### 特殊位位权限\n\n![Images](img/key_topic_icon.jpg)\n\
  \nLinux 文件系统可以使用以下特殊位位：\n\n• `SUID`：`设置用户 ID` (`SUID`) 权限允许用户运行程序时，就像他是该程序的所有者一样；在大多数情况下，程序所有者是\
  \ root 用户。此权限组的数值值为 `4*XXX`（其中 `XXX` 被替换为之前提到的三组权限的数值）。\n\n• `SGID`：在目录上设置时，设置组\
  \ ID (SGID) 权限会自动将目录中创建的所有新文件的所有权交给目录的组所有者（数值 = `2*XXX*`）。在文件上设置时，SGID 允许用户运行程序时，就像他是文件的组所有者一样。\n\
  \n• 滞位（粘滞位）：此权限组用于防止“非所有者”在公共目录中删除文件（数值 = `1*XXX*`）。在 `sticky bit` 目录中，只有文件所有者或目录所有者才能删除该文件。（root\
  \ 始终可以删除文件。）\n\n注意\n\nLinux+ 考试目标在权限部分提到了 GUID，但 GUID（全局唯一标识符）通常指的是 UUID（通用唯一标识符）的一种更健壮的形式，因此在关于权限的章节中似乎显得格格不入。不过，传统上，某些\
  \ Unix 文档将 SGID 位称为 GUID。\n\n记住，这些特殊权限仅在需要时才使用，而这种情况并不常见；可执行文件上的 SUID 和 SGID 权限组即使在使用得当的情况下也会带来安全风险。避免为\
  \ SUID 和 SGID 可执行文件提供写权限。这种权限赋予普通用户替换文件内代码的能力，并会在系统上留下安全漏洞。\n\n特殊权限可以使用数字方法或符号方法设置，就像其他权限可以使用\
  \ `chmod` 命令通过这两种方法设置一样。\n\n注意\n\n在以下示例中使用字符 `XXX` 表示权限存在并需要包含，但它会将焦点从权限本身移开。换句话说，这些是之前讨论过的普通权限，我们在这些示例中替换了\
  \ `XXX` 字符，以关注特殊位位。\n\n设置这些特殊权限的第一种方法是在执行 `chmod` 命令时使用数字模式。使用数字模式时，必须覆盖所有权限；以下命令在文件上设置\
  \ SUID 权限：\n\n```\nchmod 4XXX /some/program\n```\n\n可以同时更改或设置多个位位。例如，以下命令为程序同时设置了\
  \ SUID 和 SGID 位（这虽然少见但是允许的）：\n\n```\nchmod 6XXX /some/program\n```\n\n设置特殊权限的第二方法是使用符号模式。例如，在文件上添加\
  \ SUID：\n\n```\nchmod u+s /some/program\n```\n\n再次，即使使用符号模式，也可以同时设置多个特殊位位，尽管语法稍微复杂：\n\
  \n![Images](img/key_topic_icon.jpg)\n\n```\nchmod u+s,g+s /some/program\n```\n\n\
  #### 在文件上设置 SUID 位\n\n与 SUID 位相关的命令是 `chsh`。`chsh` 命令允许普通用户更改其登录 shell。注意此命令的当前权限：\n\
  \n```\n-rws--x-- 1 root root 15432 Apr 29 2013 /usr/bin/chsh\n```\n\n在用户所有者执行权限处用\
  \ `s` 表示这是一个 SUID 命令。当此命令执行执行时，它会修改 `/etc/passwd` 文件的内容。`/etc/passwd` 文件通常不是非 root\
  \ 用户可以修改的；如你所见，通常只有 root 用户具有这种能力：\n\n```\n-rw-r--r-- 1 root root 2036 Mar 8 18:39\
  \ /etc/passwd\n```\n\n然而，设置了 SUID 权限后，`chsh` 程序能够以运行命令的人或 `chsh` 程序所有者（在本例中为 root）的身份访问文件。\n\
  \n如果你作为管理员不想让用户更改其登录 shell，只需以 root 身份执行以下命令：\n\n```\n# chmod u-s /usr/bin/chsh\n\
  ```\n\n示例 12-1 显示了一个现场示例。\n\n示例 12-1–SUID 演示\n\n```\n[root@localhost ~]# ls -l /usr/bin/chsh\n\
  -rws--x--x. 1 root root 15432 Apr 29 2013 /usr/bin/chsh\n[root@localhost ~]# su\
  \ - student\n[student@localhost ~]$ chsh\nChanging shell for student.\nPassword:\n\
  New shell [/bin/bash]: /bin/csh\nShell changed.\n[student@localhost ~]$ exit\nlogout\n\
  [root@localhost ~]# chmod u-s /usr/bin/chsh\n[root@localhost ~]# su - student\n\
  [student@localhost ~]$ chsh\nChanging shell for student.\nPassword:\nNew shell [/bin/csh]:\
  \ /bin/bash\nsetpwnam: Permission denied\nShell NOT changed. Try again later.\n\
  ```\n\n\n\n\n# 注意\n\n正如示例 12-1 中最后一行输出所示，虽然用户可以“稍后再试”，但在 root 用户重置 SUID 权限集之前，普通用户无法更改其登录\
  \ shell。\n\n### 在文件上设置 SGID 位\n\nSGID 权限很少设置在文件。考虑以下设置了 SGID 位的程序：\n\n```\n-r-xr-sr-x\
  \ 1 root tty 10996 Jul 19 2011 /usr/bin/wall\n```\n\n代替组所有者执行权限的 `s` 表示这是一个 SGID\
  \ 命令。`wall` 命令允许用户向所有登录用户的终端窗口发送消息。通常情况下，这会引起安全问题；你不希望一个用户干扰另一个用户的终端窗口。在用户正在工作的终端中弹出消息会分散他人的注意力。\n\
  \n用户之所以可以使用这种方式使用 `wall` 命令，因为它是一个 SGID 程序。当此程序执行时，它访问文件的方式就像执行命令的人是 `tty` 组的成员一样。这反过来允许\
  \ `wall` 程序对 `tty` 组拥有的终端设备文件组具有写权限：\n\n```\n# ls -l /dev/tty1\ncrw--w---- 1 root\
  \ tty 4, 1 Jun 2 17:13 /dev/tty1\n```\n\n如果你遇到用户滥用 `wall` 命令导致的问题，只需取消 SGID 权限即可：\n\
  \n```\n# chmod 0555 /usr/bin/wall\n```\n\n# 注意\n\n`wall` 程序可以与其他用户通信，但由于人类（尤其是计算机用户）之间的成熟程度各异，你可能会遇到用户骚扰他人或不当发送广播消息的情况。通过限制用户对此命令的访问，你可以提高所有系统用户的效率。\n\
  \n### 在目录上设置 SGID 位\n\n考虑之前的场景：bob 用户（主组 staff，次要组 project）、sue 用户（主组 payroll，次要组\
  \ project）和 steve 用户（主组 acct，次要组 project）正在合作一个项目并在 `/home/project` 目录中共享文件。bob\
  \ 创建了一个文件，当使用 `ls -l` 命令列出时，显示如下：\n\n```\n-rw-r----- 1 bob staff 0 Jan 26 13:08\
  \ 22\ndata_for_sue_and_steve.txt\n```\n\n回想一下这导致的问题：尽管 bob、sue 和 steve 都有共同组，但 sue\
  \ 和 steve 无法访问此文件。如果 bob 将组所有权更改为 project 组，那么 sue 和 steve 就能查看此文件的内容。然而，要求用户在每次创建文件时都这样做是不合理的。\n\
  \n解决方案是对 `/home/project` 目录添加 SGID 权限：\n\n![图像](img/key_topic_icon.jpg)\n\n```\n\
  # chmod g+s /home/project\n```\n\n该命令将组所有权更改为 projects 组，这意味着在 `/home/project` 目录中创建的所有新文件自动属于目录的所有者组（当然，这必须设置为\
  \ project 组）。注意，这并没有解决现有文件的问题；它只影响新文件。\n\n### 设置粘位 (Sticky Bit)\n\n粘位主要用于确保共享目录中的用户不能删除他人的文件。一个很好的例子是\
  \ `/tmp` 目录：\n\n```\ndrwxrwxrwt 29 root 4096 Jun 2 17:27 /tmp\n```\n\n代替其他执行权限的\
  \ `t` 表示这是一个粘位目录。`/tmp` 目录是所有用户都能够创建文件的地方。遗憾的是，允许用户创建文件的权限也允许他们删除目录中的文件——所有文件。\n\
  \n当你添加粘位权限时，目录写权限的含义发生了变化。它不再意味着“添加和删除目录中的所有文件”，而是现在可以删除该目录下文件的用户如下：\n\n• 文件的所有者\n\
  *或者*\n\n• 目录的所有者（通常是 root 用户）\n*或者*\n\n• root 用户\n\n任何人都可以向此目录添加文件，只要不会覆盖另一个用户的文件。\n\
  \n### 查看和更改文件属性\n\n除了权限之外，还有文件系统属性，用另一种方式想，它们是文件系统中每个文件或目录的“高级设置”。注意我们使用文件系统作为容器，而不是磁盘，某些属性仅对特定文件系统有效，你可以在相应的\
  \ man 页面中查看。\n\n通过命令行处理文件属性是通过这对“黄金组合”命令完成的：\n\n• `lsattr`：此命令显示给定文件和/或目录的属性集。\n\
  \n• `chattr`：此命令用于设置文件或目录属性，但有一些值得注意的异常，这些异常不在考试范围内。\n\n#### 显示文件属性\n\n查看文件属性的主要方法是使用\
  \ `lsattr` 命令，它显示一行属性符号，通常是一组由字母标点分隔的减号符号，例如：\n\n```\n#  lsattr file1\n--------------e-----\
  \ file1\n```\n\n该命令显示仅设置了 `e` 或范围格式（extent format）属性，在这种情况下，这意味着文件正在使用称为“范围”（extents）的机制来映射磁盘上的块。这恰好是极少数不被\
  \ `chattr` 命令轻易更改的属性之一。\n\n#### 关键文件属性\n\n这些属性不仅仅是异类，是一些影响文件系统文件的非常重要的属性，其中一些最著名的属性是：\n\
  \n• `a`–设置 `a` 属性意味着文件只能追加，不能重写。\n• `A`–`A` 属性经常用于频繁访问的只读数据集，例如网站中繁忙的静态部分，意味着 `atime`\
  \ 记录不会更新。\n• `C`–`C` 属性用于更改文件的写时复制（copy-on-write）属性以及在支持 C-O-W 的文件系统上的处理方式。\n• `i`–`i`\
  \ 属性非常强大，会导致文件不可修改、不可删除、不能重命名以及许多其他限制。\n\n还有许多属性，你可以并且完全可以在 `chattr` 命令的 man 页面中查找，我们之前已经涵盖了最可能的。\n\
  \n##### 设置文件属性\n\n要在文件上设置属性，简单不过了：\n\n```\n#  chattr +A file1\n```\n\n现在如果你再次显示文件的属性，你将看到：\n\
  \n```\n#  lsattr file1\n--------A-----e----- file1\n```\n\n如果你显示文件内容或用程序读取文件，文件的\
  \ `atime` 或访问时间戳记录将不会更新。\n\n##### 移除文件属性\n\n要移除文件上的属性，与设置属性一样简单：\n\n```\n#  chattr\
  \ -A file1\n```\n\n现在如果你再次显示文件的属性，你将看到：\n\n```\n#  lsattr file1\n--------------e-----\
  \ file1\n```\n\n这移除了或取消了 `A` 属性，这意味着当访问此文件时，`atime` 记录将照常更新。\n\n# 注意\n\n请注意，有很多选项在特定文件系统上受到限制或无效，甚至在几乎所有文件系统中都无效。查看\
  \ `chattr` 和 `lsattr` 的 man 页面，那里有很多有用信息。此外，使用测试文件和目录来获得 `chattr` 和 `lsattr` 技能，而不是使用重要的密码或系统文件，否则你将不得不排错并可能修复一些问题。\n\
  \n### 通过权限查找文件\n\n注意\n\n如果你在 Linux+ 目标中寻找通过权限查找文件，你会找不到，但我一直超出了目标范围，以确保你在进入生产环境时拥有所需的信息，所以请享受这个小的加分部分吧！\n\
  \n\n\n\n\n入侵系统的攻击者通常会尝试为某些文件设置 SUID 或 SGID 位，以便让他们原本正常的账户能够执行各种未经授权的任务。\n\n`find`\
  \ 命令有一个操作符，可以轻松地找到漏洞文件。`-perm` 操作符后面通常跟随着一组三位或四位的权限设置，如下例所示：\n\n```\n# find /usr/bin\
  \ -perm 777\n```\n\n此示例搜索 `/usr/bin` 目录及其所有子目录下权限恰好为 `rwxrwxrwx` 的任何对象。这本身没问题，但它不能帮助你发现由\
  \ SUID 和 SGID 位引起的安全风险。然而，接下来的命令可以做到：\n\n```\n# find / -perm -4000\n```\n\n初看之下，这似乎像是在搜索所有具有\
  \ SUID 位且从该点起权限为空的文件。实际上，它会在整个系统中搜索所有设置了 SUID 位的文件，而不考虑其他权限位如何。\n\n你应该先安装系统，然后运行\
  \ `find` 命令来报告任何设置了 SUID 位的文件，如下所示：\n\n```\n# find / -perm -4000 -ls\n```\n\n将此输出重定向到一个文件，并将该文件保留在磁盘或系统外的安全位置（如\
  \ USB 驱动器）。每隔一段时间（特别是在安装新软件后或你认为系统被利用后），你应该运行相同的 `find` 命令，然后使用 `diff` 命令将结果与原始结果对比，如下：\n\
  \n```\n# diff /root/latestfindperm /mnt/usb/findperm.orig\n```\n\n调查任何差异！\n\n##\
  \ 访问控制列表 (ACLs)\n\n任何在 Unix/Linux 标准权限上花费时间的人，要么会养成对限制苦苦抱怨的习惯，要么选择学习更多关于 ACL 的知识。\n\
  \n### 粒度不足\n\n你为什么需要比常规 Unix/Linux 更多的权限？在许多情况下，仅有一个用户所有者或一个组所有者的局限性是致命的或过度限制的。是的，你确实可以将人员添加到拥有对象的组中，但你只能有一个组作为所有者，且只有一组权限设置；而在某些时候你需要另一组人拥有更少或更多的权限，这时你该怎么办？例如，你可能有一组由采购部门维护的定价表格，这些表格必须对定价子目录的内容具有读写权限。此外，你可能有一组销售代表，他们依赖于能够读取这些表格，以便在向客户提供报价时进行参考。\n\
  \n在标准的 Unix/Linux 权限方案中，只能有一个组所有者，如果你将销售代表和采购人员都放在同一个组中，这些组中的一个将无法对共享文件获得充分或适当的访问权限。\n\
  \n### ACL 出现救场\n\nACL 允许你向文件系统对象或对象组附加多个用户所有者、多个组所有者，甚至是多个其他所有者。在定价表格示例中，你可以使用命令为定价表格分配一组具有不同权限的次组所有权，该命令设置\
  \ ACL 以允许该组对目录及其默认的其内容具有不同的权限。\n\n### 查看 ACL\n\n在为目录或文件分配任何替代或累加权限之前，你应该使用 `getfacl`\
  \ 命令查看其权限。这可以防止在他人已对该对象设置了 ACL 的情况下，你不小心设置了冲突或覆盖了权限。\n\n要查看文件的完整权限：\n\n```\n$ getfacl\
  \ test\n# file: test\n# owner: ross\n# group: users\nuser::rwx\ngroup::rwx\nother::rwx\n\
  ```\n\n输出的第一行确认你正在查看文件 `test` 及其访问控制列表设置，此时这些设置是空的，但可以设置。接下来的两行确认了用户所有者和主组所有者是谁。随后的三行是你现在可以设置的空权限。\n\
  \n### 设置 ACL\n\n使用 `setfacl` 命令相当简单，尽管如果你尝试设置多个组以不同的权限访问对象，情况可能会变得复杂。\n\n在设置对象的权限时，你使用三个部分对应这些权限。以下示例为用户\
  \ `snuffy` 设置用户权限 (u)，并为该对象添加读写但不执行的权限。`-m` 选项允许你修改权限：\n\n```\n# setfacl -m u:snuffy:rw\
  \ test\n```\n\n这导致用户 `snuffy` 获得了作为用户所有者的 rw 权限，而不会干扰或取代原始（以及当前所有者）`ross`。你可以通过\
  \ `getfacl` 命令确认这一点：\n\n```\n$ getfacl test\n# file: test\n# owner: ross\n# group:\
  \ users\nuser::rwx\nuser:snuffy:rw-\ngroup::rwx\nmask::rwx\nother::rwx\n```\n\n\
  注意 `getfacl` 命令的输出，在默认权限集（即原始用户所有者的权限）下方，现在有一行详细说明了用户 `snuffy` 对此文件的权限。\n\n为组所有者设置\
  \ ACL 也一样：你只需将命令中的 `u` 改为 `g`，并将用户 `snuffy` 替换为相应的组，并更改权限以反映你希望此次组所有者对对象拥权限：\n\n\
  ```\n# setfacl -m g:itcrowd:r-x\n```\n\n现在再次获取权限：\n\n```\n$ getfacl test\n# file:\
  \ test\n# owner: ross\n# group: users\nuser::rwx\nuser:snuffy:rw-\ngroup::rwx\n\
  group:itcrowd:r--\nmask::rwx\nother::rwx\n```\n\n你可以看到，组 `itcrowd` 现在已添加到文件 `test`\
  \ 的 ACL 中。有效意味着，属于 users 组但不是文件所有者的用户对该文件具有完全 rwx 权限，但不是用户所有者且是 itcrowd 组成员的用户对该文件仅具有\
  \ r 权限。\n\n## 我们都戴着掩具\n\n我们需要涵盖的 ACL 的最后一个方面是掩码 (masks) 概念。ACL 的掩码涉及限制 ACL 中所有配置的用户和组的权限。这是一种确保人们可以读取目录中的脚本但不执行它们，或确保用户和组可以查看文件但不能更改它们的简单方法。\n\
  \n要设置一个限制所有 ACL 用户和组读取对象的掩码，请输入以下：\n\n```\n# setfacl -m m::rx test\n```\n\n你可以对文件运行\
  \ `getfacl` 命令，查看掩码已从默认的完全权限更改为对 r 和 x 的限制：\n\n```\n$ getfacl test\n# file: test\n\
  # owner: ross\n# group: users\nuser::rwx\nuser:snuffy:rw-                  #effective:\
  \ r--\ngroup::rwx                      #effective:r-x\ngroup:itcrowd:r--\nmask::rwx\n\
  other::rwx\n```\n\n在任何额外的用户所有者和组所有者旁边可以看到额外的文本，告知他们现在的有效权限是什么。如果显示的权限不可接受，则不要使用掩码，而是通过组和用户来限制权限。\n\
  \n## 基于上下文的访问\n\n文件和目录可能会被不理解权限或意外获得比意图更多访问权限的用户所破坏。有一句老的系统管理格言：“如果没有用户，什么东西都不会坏，系统也会更安全。”当然，对这句话的回答是：“如果没有用户，我们就没有工作可以了！”基于上下文的访问可以在进程访问文件时提供额外的安全级别，处理权限被破坏的问题。文件和目录的访问控制不在用户手中，而是由管理员处理。用户的错误经常会为存储在文件中的数据提供非预想的访问。\n\
  \n\n\n\n\n关注的不仅仅是用户文件和目录。想象一种情况：远程黑客能够利用漏洞获取你的 Web 服务器进程（`httpd` 进程）的控制。如果没有基于上下文的控制，黑客就可以引导\
  \ `httpd` 进程读取关键系统文件（例如 `/etc/passwd` 文件），并获取可能导致进一步入侵系统或网络的信息。\n\n传统的 Linux 权限（文件和目录的读、写、执行权限）使用自主性访问控制（DAC），而基于上下文的权限则利用强制性访问控制（MAC）。然而，当启用基于上下文的解决方案时，DAC\
  \ 仍然有效（MAC 和 DAC 都会执行）。通常会首先评估 MAC 控制，如果允许访问，然后会检查文件的权限。\n\n本章涵盖了两种常用的基于上下文的方法：SELinux\
  \ 和 AppArmor。\n\n### 安全增强型 Linux (SELinux)\n\n`SELinux` 策略可以要求进程属于 SELinux 安全上下文（想象成“安全组”）才能访问文件和目录。普通权限仍用于进一步定义访问，但在访问文件/目录时，会先应用此\
  \ SELinux 策略。\n\n另一个更关注的问题，也是大多数 SELinux 策略旨在解决的问题，是守护进程（或系统进程）如何带来安全风险。考虑你拥有许多提供各种服务的活动进程。例如，其中一个进程可能是\
  \ Web 服务器，如下例所示：\n\n```\n# ps -fe | grep httpd\nroot       1109     1  0  2022 ?\
  \        00:51:56\n/usr/sbin/httpd\napache    1412  1109  0 Dec24 ?        00:00:09\n\
  /usr/sbin/httpd\napache    4085  1109  0 05:40 ?         00:00:12\n/usr/sbin/httpd\n\
  apache    8868  1109  0 08:41 ?         00:00:06\n/usr/sbin/httpd\napache    9263\
  \  1109  0 08:57 ?         00:00:04\n/usr/sbin/httpd\napache   12388  1109  0 Dec26\
  \ ?        00:00:47\n/usr/sbin/httpd\napache   18707  1109  0 14:41 ?         00:00:00\n\
  /usr/sbin/httpd\napache   18708  1109  0 14:41 ?         00:00:00\n/usr/sbin/httpd\n\
  apache   19769  1109  0 Dec27 ?        00:00:15\n/usr/sbin/httpd\napache   29802\
  \  1109  0 01:43 ?         00:00:17\n/usr/sbin/httpd\napache   29811  1109  0 01:43\
  \ ?         00:00:11\n/usr/sbin/httpd\napache   29898  1109  0 01:44 ?         00:00:10\n\
  /usr/sbin/httpd\n```\n\n在此输出中，每一行描述一个运行在系统上的 Apache Web 服务器进程（`/usr/sbin/httpd`）。行的第一部分是启动该进程的用户。以\
  \ root 身份运行的进程仅用于产生额外的 `/usr/sbin/httpd` 进程。而其他进程则响应来自客户端工具（网页浏览器）的入 Web 页面请求。\n\
  \n想象一下，如果 Apache Web 服务器软件中发现了一个安全漏洞；该漏洞允许客户端工具获取一个 `/usr/sbin/httpd` 进程的控制，并向该进程发布自定义命令或操作。这些操作之一可以是查看\
  \ `/etc/passwd` 文件的内容，由于该文件设置了权限，该操作将是成功的：\n\n```\n# ls -l /etc/passwd\n-rw-r--r--\
  \ 1 root root 2690 Dec 11  2022 /etc/passwd\n```\n\n从此命令的输出可以看出，由于所有用户都有读取权限，因此所有用户都有查看\
  \ `/etc/passwd` 文件内容的能力。你希望某个随机黑客能够查看存储用户账户数据的文件内容吗？\n\n通过 SELinux 策略，`/usr/sbin/httpd`\
  \ 进程可以被“锁定”，使得每个进程只能访问特定的文件集。这就是大多数管理员使用 SELinux 的原因：保护那些可能被黑客利用已知（或未知）漏洞而攻击的进程。\n\
  \n### SELinux 模式\n\n共有三种 SELinux 模式：\n\n-   Disabled（禁用）：在禁用模式下，SELinux 完全不起作用。当用户尝试访问文件或目录时，不会执行任何检查。\n\
  -   Enforcing（强制）：在强制模式下，SELinux 会执行检查，并在必要时阻止对文件或目录的访问。\n-   Permissive（宽容）：在宽容模式下，SELinux\
  \ 会执行检查，但永远不会阻止对文件或目录的访问。此模式设计用于排除故障，因为在此模式下会创建日志消息。\n\n使用 `getenforce` 命令确定当前的\
  \ SELinux 模式：\n\n```\n# getenforce\nEnforcing\n```\n\n结果为 Enforcing 表示 SELinux 已安装，且安全策略当前处于激活状态。\n\
  \n你可以通过执行 `setenforce` 命令来更改模式（这在测试新策略或排除 SELinux 问题时很有用）：\n\n```\n# setenforce\
  \ 0\n# getenforce\nPermissive\n```\n\n在宽容模式下，SELinux 不会阻止对文件和目录的访问，但会发出警告并在系统日志文件中显示。\n\
  \n你可以在强制模式和宽容模式之间切换，但禁用 SELinux 需要更改配置文件并重启系统。例如，在 RHEL（红帽企业 Linux）系统上，你如下所示更改 `/etc/selinux/config`\
  \ 文件中的 SELINUX 设置：\n\n```\n# cat /etc/selinux/config\n# 此文件控制系统上 SELinux 的状态。\n\
  # SELINUX= 可以取以下三个值之一：\n#       enforcing - 强制执行 SELinux 安全策略。\n#       permissive\
  \ - SELinux 打印警告而不是强制执行。\n#       disabled - 不加载 SELinux 策略。\nSELINUX=disabled\n\
  # SELINUXTYPE= 可以取以下两个值之一：\n#       targeted - 保护目标进程。\n#       mls - 多级安全保护。\n\
  SELINUXTYPE=targeted\n```\n\n相反，如果当前 SELinux 模式为禁用，你可以在 `/etc/selinux/config` 文件中将\
  \ SELINUX 设置为 enforcing 或 permissive，然后重启系统。在重启完成后运行 `getenforce` 命令来验证更改已生效始终是一个好策略。\n\
  \n### SELinux 策略\n\n`SELinux` 策略是一组规则，决定了策略所施加的限制条件。策略本身通常非常复杂，细节超出了 Linux+ 考试的范围。然而，了解策略是根据规则设置限制是非常重要的。\n\
  \n你应该知道，最常用的策略之一是目标策略（targeted policy）。该策略通常默认存在于安装了 SELinux 的系统中，并且通常是 SELinux\
  \ 首次启用时启用的默认策略。\n\n目标策略包含了旨在系统免受服务而非普通用户攻击的规则。每个服务都被分配了一个或多个安全上下文、布尔值以及限制服务访问文件和目录能力的额外规则。\n\
  \n`sestatus` 命令提供了有关 SELinux 的总体状态信息，包括当前策略：\n\n```\n# sestatus\nSELinux status:\
  \                  enabled\nSELinuxfs mount:                /sys/fs/selinux\nSELinux\
  \ root directory:             /etc/selinux\nLoaded policy name:              targeted\n\
  Current mode:                   enforcing\nMode from config file:              enforcing\n\
  Policy MLS status:                enabled\nPolicy deny_unknown status:      allowed\n\
  Max kernel policy version:         28\n```\n\n### SELinux 布尔值\n\n策略的具体组成部分以及如何创建策略超出了\
  \ Linux+ 考试的范围，因此超出本书的范围。然而，你可以通过布尔值（Booleans）修改策略的行为。布尔值是一个真/假值，会改变 SELinux 执行\
  \ MAC 的方式。\n\n\n\n\n\n一个 SELinux 策略通常包含几十个不同的 Boolean（布尔值）。要确定某个 Boolean 的用途，请使用\
  \ `semanage` 命令：\n\n```\n# semanage boolean -l | head\nSELinux boolean         \
  \   State  Default Description\n\nprivoxy_connect_any       (on   ,  on)   Allow\
  \ privoxy to\nconnect any\nsmartmon_3ware          (off  ,   off)   Allow smartmon\
  \ to\n3ware\nmpd_enable_homedirs     (off  ,   off)   Allow mpd to enable\nhomedirs\n\
  xdm_sysadm_login        (off  ,   off)   Allow xdm to sysadm\nlogin\nxen_use_nfs\
  \              (off  ,   off)   Allow xen to use\nnfs\nmozilla_read_content    \
  \  (off  ,   off)   Allow mozilla to\nread content\nssh_chroot_rw_homedirs   (off\
  \  ,   off)   Allow ssh to chroot\nrw homedirs\nmount_anyfile             (on  \
  \ ,  on)   Allow mount to\nanyfile\n```\n\n例如，在输出输出中，有一个名为 `xdm_sysadm_login` 的\
  \ Boolean。XDM 是一个显示管理器，这意味着它是一个允许用户通过 GUI 界面登录系统的工具。此 Boolean 用于确定 XDM 软件是否允许 root\
  \ 用户登录。`(off, off)` 用于显示该 Boolean 的默认值和当前值。在此种情况下，`off` 意味着 root 用户无法通过 GUI 界面登录，因为该\
  \ Boolean 的描述是“允许 xdm 以系统管理员身份登录”。\n\n你还可以使用 `getsebool` 命令仅显示某个 Boolean 的当前值：\n\
  \n```\n# getsebool -a | head\nxdm_sysadm_login --> off\nabrt_handle_event --> off\n\
  abrt_upload_watch_anon_write --> on\nantivirus_can_scan_system --> off\nantivirus_use_jit\
  \ --> off\nauditadm_exec_content --> on\nauthlogin_nsswitch_use_ldap --> off\nauthlogin_radius\
  \ --> off\nauthlogin_yubikey --> off\nawstats_purge_apache_log_files --> off\n```\n\
  \n当将一个 Boolean 作为参数提供时，`getsebool` 命令仅给出该 Boolean 的当前值：\n\n```\n# getsebool xdm_sysadm_login\n\
  xdm_sysadm_login --> off\n```\n\n要设置 SELinux Boolean 为开启或关闭，请使用 `setsebool` 命令：\n\
  \n```\n# getsebool xdm_sysadm_login\nxdm_sysadm_login --> off\n# setsebool xdm_sysadm_login\
  \ 1\n# getsebool xdm_sysadm_login\nxdm_sysadm_login --> on\n```\n\n提供参数 `0` 来关闭\
  \ Boolean，提供 `1` 来开启 Boolean。\n\n请注意，默认情况下，`setsebool` 命令仅修改 Boolean 的当前状态。除非在使用\
  \ `setsebool` 命令时使用 `-P`（代表 *persistent* 持久）选项，否则重启会导致所有 Boolean 回到之前的状态：\n\n```\n\
  # setsebool -P xdm_sysadm_login 1\n```\n\nBoolean 的值通常很长，输入起来很麻烦。`setsebool` 和 `getsebool`\
  \ 命令提供了独特的 Tab 补全功能。例如，注意当按下 `Tab` 键时的以下行为：\n\n```\n# setsebool samba_<tab>\nsamba_create_home_dirs\
  \           samba_portmapper\nsamba_domain_controller           samba_run_unconfined\n\
  samba_enable_home_dirs           samba_share_fusefs\nsamba_export_all_ro       \
  \         samba_share_nfs\nsamba_export_all_rw\n```\n\n### SELinux 实例\n\nSELinux\
  \ 如何保护文件（和目录）免受未经授权的使用？答案是使用 SELinux 下。\n\n每个文件都可以应用一个上下文，该上下文会影响进程访问文件的能力。进程本身也应用了\
  \ SELinux 上下文，这个上下文本质上将进程置于安全组中。\n\n每个进程都在安全上下文中运行。要查看此信息，请如此处所示对 `ps` 命令使用 `-Z`\
  \ 选项（这里使用 `head` 命令仅是为了限制命令的输出）：\n\n```\n# ps -eZ | grep httpd | head -2\nsystem_u:system_r:httpd_t:s0\
  \ root      1109     1  0  2022 ?\n  00:51:56 /usr/sbin/httpd\nsystem_u:system_r:httpd_t:s0\
  \ apache    1412  1109  0 Dec24 ?\n\n  00:00:09 /usr/sbin/httpd\n```\n\n安全上下文 (`system_u:system_r:httpd_t:s0`)\
  \ 是复杂的，但对于理解 SELinux 的基础，重要的部分是 `httpd_t`，它类似于安全组或域。作为此安全域的一部分，`/usr/sbin/httpd`\
  \ 进程只能访问安全策略为 `httpd_t` 允许的文件。该策略通常由 SELinux 专家编写，该专家对于哪些进程应该能够访问系统上的特定文件和目录拥有丰富的经验。\n\
  \n文件和目录也有由策略定义的 SELinux 安全上下文。要查看特定文件的安全上下文，请对 `ls` 命令使用 `-Z` 选项：\n\n```\n# ls -Z\
  \ /var/www/html/index.xhtml\nunconfined_u:object_r:httpd_sys_content_t:s0\n/var/www/html/index.xhtml\n\
  ```\n\n此处注意，SELinux 上下文包含大量数据，以至于文件名无法放在同一行。正如你可能推断出的那样，运行在安全上下文 `system_u:system_r:httpd_t:s0`\
  \ 的进程能够访问标记为 `u:object_r:httpd_sys_content_t:s0` 上下文的文件。这并不总是简单的，因为 SELinux Boolean\
  \ 可能对上下文的应用产生重大影响，但本质上这就是核心思想。请记住，Linux+ 考试不需要成为 SELinux 专家（这是一件好事，因为这是一个非常大的话题）。\n\
  \n`u:object_r:httpd_sys_content_t:s0` 上下文是如何应用到 `/var/www/html/index.xhtml` 文件的？通常，SELinux\
  \ 安全上下文会自动应用，取决于文件放置的位置。因此，放置在 `/var/www/html` 目录的新文件也将标记为 `u:object_r:httpd_sys_content_t:s0`\
  \ 上下文。\n\n在某些情况下，你可能需要手动应用此上下文。例如，如果你从另一个位置移动文件，它可能会保留原始的安全上下文。在这种情况下，使用 `chcon`\
  \ 命令更改文件或目录的上下文：\n\n```\n# chcon -t user_home_t /var/www/html/index.xhtml\n```\n\
  \n你还可以利用 SELinux 规则，这些规则定义大多数系统文件的默认安全上下文。`restorecon` 命令根据当前位置和这些 SELinux 规则重置文件或目录的默认安全上下文。这是一个示例：\n\
  \n```\n# restorecon /var/www/html/index.xhtml\n```\n\n`restorecon` 命令的一个常用选项是 `-R`\
  \ 选项，它在目录结构上递归执行更改。\n\n### audit2allow 命令\n\n`audit2allow` 命令的作用是解析日志文件，查找系统拒绝某些操作的访问或权限的事件，并非常方便地随后创建一个微小的策略规则片段，专门允许该特定操作或访问。\n\
  \n你仍然需要将该片段加载到当前策略中并确保它是激活状态，但对于面临某些微小但重要的访问问题的 SELinux 管理员来说，这极大地节省了时间。\n\n**注意**\n\
  \n如文档所述，当使用 `audit2allow` 生成的片段时应非常小心，不要轻率地实施，确保你没有通过这些对策略的可能添加意外地开启了某种安全风险。\n\n\
  ### AppArmor\n\nAppArmor 是一种 MAC 系统，其作用与 SELinux 类似，因为它提供了一个基于上下文的权限模型。本节描述了可能在\
  \ Linux+ 考试中出现的 AppArmor 关键组件。\n\n**注意**\n\n本章关于 AppArmor 的信息比 SELinux 少。有几个原因：\n\
  \n![Images](img/square.jpg) 作为一种 MAC，AppArmor 的概念与 SELinux 相似。\n\n![Images](img/square.jpg)\
  \ SELinux 的使用通常比 AppArmor 多得多。虽然某些 Linux 发行版使用 AppArmor 作为默认 MAC，但主要是 SUSE 使用 AppArmor。\n\
  \n![Images](img/square.jpg) Linux+ 考试目标中 SELinux 的强调程度比 AppArmor 强。\n\n\n\n\n\n\
  AppArmor 配置文件 是一组描述 AppArmor 如何限制进程的规则集。可以使用 `aa-disable` 命令禁用某个特定的配置文件。另一种常用的技术如下例所示：\n\
  \n```\n# ln -s /etc/apparmor.d/usr.sbin.mysqld /etc/ apparmor.d/disable\n#  apparmor_parser\
  \ -R /etc/apparmor.d/usr.sbin.mysqld\n```\n\n### 注意\n\n\n\n要查看配置的状态，请使用 `aa-status`\
  \ 命令。要再次启用该配置，请使用以下命令：\n\n```\n# rm /etc/apparmor.d/disable/usr.sbin.mysqld\n# \
  \ apparmor_parser -r /etc/apparmor.d/usr.sbin.mysqld\n```\n\n### aa-complain\n\n\
  如果你需要对 AppArmor 配置文件进行调试，最好将其放入投诉模式（complain mode）。在此模式下，不会执行任何限制，但会报告任何出现的问题。\n\
  \n使用 `aa-complain` 命令将配置放入投诉模式：\n\n```\n#  aa-complain /usr/sbin/mysqld\nSetting\
  \ /usr/sbin/mysqld to complain mode.\n```\n\n要将配置恢复到强制模式（enforcing mode），使用以下命令：\n\
  \n```\n#  sudo aa-enforce /usr/sbin/mysqld\nSetting /usr/sbin/mysqld to enforce\
  \ mode\n```\n\n### aa-unconfined\n\n使用 `aa-unconfined` 命令列出不受 AppArmor 配置文件限制的进程。\n\
  \n![Images](img/key_topic_icon.jpg)\n\n### /etc/apparmor.d/\n\n`/etc/apparmor.d`\
  \ 目录是 AppArmor 配置文件定义所在。了解如何创建或读取这些文件不在 Linux+ 考试的范围内，但了解这些配置的位置很重要，以便确定哪些配置是可用并使用如\
  \ `aa-disable` 等 AppArmor 命令。\n\n### /etc/apparmor.d/tunables\n\n`/etc/apparmor.d/tunables`\
  \ 目录包含用于精调 AppArmor 行为的文件。了解如何创建或读取这些文件不在 Linux+ 考试的范围内。\n\n### 命令行工具\n\nLinux+\
  \ 考试目标对这一部分非常重视，就好像你只要提取出命令行工具并列出来就有用一样？\n\n正如我们在本章开头警告的那样，我们将所有命令都放在了主题讨论的正常流程中，因此我们只需在这里说明一下并继续。\n\
  \n### 总结\n\n本章的重点是如何使用特殊权限、基于上下文的访问控制（如 SELinux 和 AppArmor）以及所有支持这些操作的不同工具进一步保护你的系统资源。\n\
  \n### 考试准备任务\n\n正如引言中“目标与方法”部分提到的，你有几种备考的选择：这里的练习、第 23 章、“最终准备](#ch23.xhtml_ch23)”以及\
  \ Pearson Test Prep 软件中的考试模拟题。\n\n### 复习所有关键主题\n\n复习本章最重要的主题，这些主题在页外边缘处用“关键主题”图标标记。表\
