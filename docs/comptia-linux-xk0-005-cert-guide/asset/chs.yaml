  \ 基础知识\n\n### 失控进程与僵尸进程\n\n由于我们在第 4 章“管理进程和服务”中已经非常彻底地介绍了进程以及如何处理它们，我们将回顾它们是什么，以及如何理解正常运行的进程与失控或僵尸进程之间的区别——这是进程行为两种完全不同的极端。\n\
  \n#### 失控进程\n\n![Images](img/key_topic_icon.jpg)\n\n`失控进程`是指发生故障，或无意或恶意地创建自身副本的进程，导致\
  \ CPU 负载被占用而系统无响应或无法使用。\n\n##### 是什么导致了失控进程？\n\n通常，一个程序会被加载，创建一个或多个进程，当主程序退出时，该主进程的子进程将由父进程或主进程终止。\n\
  \nLinux 中有多个调度器，实时（realtime）或截止时间（deadline）进程可能会出现问题，它们可能通过失控来完全隔绝或使系统上的任何其他进程变得毫无用。\n\
  \n从大约内核 2.6 版本开始，我们已经能够设置一些安全泄门，以杀死那些耗尽所有 CPU 时间且不允许从任何优先级*高于*失控进程的进程（即 shell）中执行\
  \ `kill` 命令的失控进程！\n\n是的，完全可能出现失控进程或进程导致系统卡死，至于你无法纠正局面，因为你无法启动或使用可以发出 `kill` 或或其他结束进程命令的\
  \ shell。\n\n##### 为非实时进程预留部分 CPU\n\n`/proc` 中存在两个文件，允许你为非实时或非截止时间进程预留一定时间的 CPU 时间，分别是：\n\
  \n- `/proc/sys/kernel/sched_rt_period_us`\n- `/proc/sys/kernel/sched_rt_runtime_us`\n\
  \n这两个文件包含从 -1 开始的整数值（-1 表示不预留时间）到你设置的任何值，单位均为微秒。\n\n这非常重要，因为除非你至少预留一秒左右的时间，否则你无法挤出一个可以杀死失控进程的进程。没有预留时间，就没有机会运行非实时进程（如\
  \ root shell）来杀死失控进程！\n\n例如，`/proc/sys/kernel/sched_rt_period_us` 文件的默认值为 100,000（即一秒），这将允许你尝试从\
  \ shell 中挤出一个命令。\n\n##### 识别失控进程\n\n识别失控进程的方法之一是系统运行激烈或无响应，你几乎无法输入键盘。\n\n并不是所有的失控进程都会占用整个系统，所以如果你有命令行访问权限，请尝试使用\
  \ `top` 命令查看哪些进程浮在进程表顶端并杀死它。\n\n也可以使用 `ps` 命令找到这些进程，但没有 `top` 命令清晰。你还可以使用非常有用的 `htop`\
  \ 命令，它提供了其他工具不具备的选择，而且在视觉上易于理解和使用。\n\n##### 结束失控进程\n\n要结束失控进程，你可以使用 `top` 或 `htop`\
  \ 命令提供的内置“kill”选项。你首先选中有问题的进程，然后按 `F9` 键，程序将向该进程发送 `SIGTERM` 或 `-15` 信号尝试杀死该进程，这一切都在这些程序内部完成。\n\
  \n为了对杀死进程拥有最大的控制权，请使用 `kill` 命令并指定 `-9` 或 `SIGKILL` 信号。\n\n#### 僵尸进程\n\n进程有父进程，通常还有子进程。即使内核或\
  \ init 进程也有其 PPID（父进程 ID）条目，指向它自身的进程。\n\n有时你会在 `top`、`htop`、`ps` 命令输出等处看到标记为“Z”的进程，这表示它是僵尸进程。\n\
  \n![Images](img/key_topic_icon.jpg)\n\n`僵尸进程`是指已经退出、死亡或被终止，但进程表（内存中存储进程信息的区域）中的进程描述符尚未更新的进程。\n\
  \n##### 是什么导致了僵尸进程？\n\n\n\n\n僵尸进程（Zombie）对于自己被杀死、结束或退出不负责，它只是向它的父进程（Parent Process）发送信号，表示已被终止、被信号停止或被信号恢复。父进程负责从进程表（Process\
  \ Table）中移除子进程的信息，如果父进程从未使用 `wait()` 系统调用来获取子进程的终止信息，进程表就不会更新，僵尸进程就会存在。\n\n当一个子进程被标记为僵尸进程时，它会一直留在那里“吃大脑”或占用少量的内存，直到被父进程清理。\n\
  \n有时父进程会突然结束，导致所有子进程变成孤儿进程，这些子进程随后会被标记为僵尸进程。\n\n## 僵尸进程有害吗？\n\n不有害，它们只是存在那里，并没有坏处或危害，除非它们的数量非常多。僵尸进程会占用它之前使用的任何内存，偶尔出现它们是完全正常且符合预期的。\n\
  \n然而，如果你持续获得这些进程，或者持续看到大量的它们，这可能是程序运行故障或代码损坏的象。\n\n## 移除僵尸进程\n\n可以通过向父进程发送特定信号来移除僵尸进程，例如在示例\
  \ 20-1 所示。\n\n**示例 20-1**–`kill` 命令的示例\n\n```\n$ kill -s SIGCHLD 12345\n```\n\n\
  该命令可能有输出，也可能没有输出，但信号 `SIGCHLD` 已发送给父进程，这将导致它去收割子进程中的僵尸进程。\n\n## 高 CPU 占用率/平均负载/运行队列\n\
  \n由于 CPU、内存、缓存和磁盘之间都是密切相关的，或者说一个环绕另一个，因此*高 CPU 占用率情况可能是以下几种情况的任何一种或全部：\n\n• 资源密集型进程\n\
  • 编写糟糕的程序\n• 程序中的内存泄漏\n• 磁盘故障或过载\n\n解决高 CPU 占用率的办法是找到哪个进程有问题，并按照其他地方描述的方法将其结束，例如使用\
  \ `kill` 命令。\n\n### 高平均负载\n\n平均负载（Load Average）首先需要理解 Linux 系统的负载定义为当前 CPU 占用率，或者在给定时刻正在运行的任务量。\n\
  \n你可以将负载视为执行中或等待执行的进程数量的数值测量。你会发现，随着时间的推移，平滑且一致的负载比高度波动或尖峰式的负载要好（后者是由于系统需求巨大，然后空闲了一段时间，接着是另一个高需求，等等）。\n\
  \n由于指示当前负载的数字几乎在瞬间之间变化，我们能查看的真正有意义的数字是平均负载，即一段时间内执行中或等待的进程的平均数量。\n\n### 使用 `uptime`\
  \ 命令查看系统负载详情\n\n获取负载数字最简单的方法之一是运行 `uptime` 命令，它将返回一系列数字和其他信息，如示例 20-2。\n\n**示例 20-2**–`uptime`\
  \ 命令的输出\n\n```\n$ uptime\n16:28:23 up 13 min,  1 user,  load average: 0.47, 0.15,\
  \ 0.08\n```\n\n首先你看到系统已运行的实际时间，然后是用户数和 3 个独立的平均负载，它们分解为：\n\n**0.47** - 这个数字是过去 1\
  \ 分钟的平均负载\n**0.15** - 这个数字是过去 5 分钟的平均负载\n**0.08** - 这个数字是过去 15 分钟的平均负载\n\n但 `uptime`\
  \ 命令有点无聊，它只是一些文本，且只运行一次，你必须使用 `watch` 命令让它运行得频繁一些。确保尝试带有 `-s` 或 `--since` 选项的 `uptime`，你可以在那里查看系统自起始或指定时间以来运行的情况。\n\
  \n### 使用 `tload` 命令查看系统负载详情\n\n现在让我们来看看 `tload` 命令，我最喜欢的，因为它有趣得多，你可以让它以文本图形的形式显示某些非常有用的信息。\n\
  \n然而，`tload` 最初和 `uptime` 命令一样平淡，仅运行命令本身产生的信息甚至比 `uptime` 的输出还少，主要区别是它没有用户或自运行运行的信息，尽管它会不断刷新，直到你使用\
  \ `Ctrl-c` 取消它的操作。\n\n为了真正从 `tload` 中获得一些有用的东西，你应该带有 `-s` 选项调用它，并让它通过由星号组成的侧向滚动图表持续显示负载。\n\
  \n要显示图形图表，如示例 20-3 所示调用 `tload`。\n\n**示例 20-3**–带有选项调用 `tload` 命令\n\n```\n$ tload\
  \ -s 100\n0.04, 0.03, 0.03\n```\n\n你会很快看到一组星号开始出现在显示器的左下角，并从左向右缓慢穿过屏幕。如果你在图形化系统中，可以打开应用程序并移动窗口，只需查看图中的结果，类似于我在图\
  \ 20-1 中所示的系统。\n\n![Images](img/20fig01.jpg)\n\n**图 20-1**–带有 `-s 100` 选项的 `tload`\
  \ 输出\n\n用户的计算机需要访问 Web 服务器，但中间有一个防火墙，防火墙默认不会将用户的请求流量发送到 Web 服务器。\n\n如你所见，负载正在屏幕上间隔显示（你可以使用\
  \ `-d <value>` 选项来指定间隔）。\n\n实验 `tload` 的选项是很好的，可以获得你精确想要的内容。\n\n注意我们查询的 TLS 版本出现在查询响应的\
  \ Protocol（协议）部分。\n\n注意：不要忘记我们的老朋友 `top` 命令也显示与 `uptime` 相同的信息，只需查看前几行中的该信息即可。\n\
  \n## CPU 时间和 CPU 进程优先级\n\n*CPU 时间的概念要求我们意识到，时间的真实测量是从任务开始到现在或任务结束所经过的时间，即经过时间（Elapsed\
  \ Time）。\n\n![Images](img/key_topic_icon.jpg)\n\n将 CPU 时间与经过时间的区别理解为：经过时间是指你购买车辆以来有多长时间，而\
  \ CPU 时间可能代表你实际驾驶车辆的时间。\n\n此外，经过时间是真实时间，从秒、分钟、小时到天等。大多数计算机都有活动的突发状态，其中 CPU 时间代表处于负载状态或正在执行代码的时间，但这段时间相对于经过时间来说是一个较小或更小的部分。\n\
  \n解决高 CPU 占用率的办法是找到哪个进程有问题，并按照其他地方描述的方法将其结束，例如使用 `kill` 命令。\n\n### 测量 CPU 时间\n\n\
  要确定当前使用了多少 CPU 时间，或者说实际上 CPU 的利用率有多高，你可以使用几个命令，其中一个我们已经在其他地方详细介绍过的——`top` 命令。\n\n\
  另一个非常重要且实用的工具是 `time` 命令，它测量命令执行所需的时间，并解析出在什么上下文或用户或内核空间花费了时间。示例 20-4 显示了 `find`\
  \ 命令的运行以及显示的时间统计数据。\n\n**示例 20-4**–`time` 命令的输出\n\n```\n$ time find / -iname *.doc\
  \ 2> /dev/null\n/snap/gnome-3-34-1804/77/usr/lib/python2.7/pdb.doc\n/snap/gnome-3-34-1804/72/usr/lib/python2.7/pdb.doc\n\
  real 0m6.997s\nuser 0m0.676s\nsys  0m1.800s\n```\n\n我们正在做是对命令进行计时，查看它在真实时间上需要多长时间，同时也查看在\
  \ CPU 时间中，用户空间或系统空间访问、更新或显示花费了多少时间。\n\n\n\n\n\n输出的可能性非常多，你都可以在 `time` 命令的 man 页（帮助文档）中看到。\n\
  \n关于它，你需要知道的关键是它在测量什么，以及输出中关于实际时间（如墙上的时钟）流逝的信息，以及其中有多少被该命令的用户空间和内核空间占用。\n\n## Note\n\
  \n不要尝试将这些时间相加来匹配，但要仔细阅读 `time` 命令的 man 页，它会教你很多关于系统时间、CPU 利用率以及如何报告你认为最重要的特征的知识。\n\
  \n另外请记住，多次运行完全相同的命令，在运行第一次命令后可能会显示出更短的时间（在某些情况下，缩短非常明显）。由于系统从磁盘块和文件系统的角度进行了缓存，这很可能是产生差异的原因。\n\
  \n## 重要 CPU 时间术语\n\n有些你（可能）会被测试到的项目我们需要定义一下，以便你了解提问的是什么。\n\n- **steal（窃取时间）**：窃取时间指的是虚拟机执行某些操作但无法执行的时间，因为这段时间被分配给或被虚拟机管理程序的另一个客户使用。\n\
  - **user（用户态）**：用户态是指执行运行的操作系统用户空间或用户特定部分中的程序所花费的时间。\n- **system（内核态）**：内核态是指执行系统内核部分中的程序所花费的时间。\n\
  - **idle（空闲）**：空闲时间指的是系统处于空闲状态或运行系统空闲进程的时间。实际上，这意味着 CPU 没有在任何有意义的范围内被使用。\n- **iowait（I/O\
  \ 等）**：iowait 指系统虽然处于空闲状态，但存在未完成或正在处理的磁盘 I/O 请求的时间。\n\n## CPU 进程优先级\n\n我们已经在 第 4\
  \ 章 “管理进程优先级”节中涵盖了进程优先级，以及如何管理启动命令的优先级（通过 `nice` 命令），以及如何修复或更改正在运行命令的优先级（通过 `renice`\
  \ 命令）。\n\n由于这部分已经涵盖过了，我们在这里不再重复或重申这些内容。\n\n## 内存耗尽与内存溢出\n\n![Images](img/key_topic_icon.jpg)\n\
  \n内存耗尽 的概念通常意味着系统已经耗尽了物理内存（RAM）和交换空间（Swap），这就是我们如何欺骗那些程序，让它们认为系统拥有比实际更多的内存。\n\n\
  内存耗尽并不是凭空发生的，如果你内存非常少，并且不断用运行的程序填满可用内存，最终你将达到一种状态，即使是大量的交换空间也无对你有帮助，一切都会停滞，通常会伴随着大量的错误信息，其中一条如示例\
  \ 20-5 所示。\n\n**示例 20-5**–显示内存耗尽的日志文件记录\n\n```\nAllowed memory size of xxxxxxxx\
  \ bytes exhausted (tried to allocate 62\nbytes)\nAllowed memory size of xxxxxxxx\
  \ bytes exhausted (tried to allocate 39\nbytes)\nAllowed memory size of xxxxxxxx\
  \ bytes exhausted (tried to allocate 62\nbytes)\nAllowed memory size of xxxxxxxx\
  \ bytes exhausted (tried to allocate 39\nbytes)\n```\n\n这通常不是出现问题的第一个迹象，系统可能会看起来非常缓慢且无响应，可能会出现界面问题和服务响应问题。\n\
  \n内存耗尽机制与下一节紧密相连，“什么是内存溢出 (OOM)？”\n\n由于 Linux 系统使用多部分系统组成它所谓的内存：交换空间（在磁盘或文件系统上）和物理内存，这有时会让人感到困惑。\n\
  \n我们将在下一节中讨论这一切，我们将讨论交换空间、缓存、缓冲区以及虚拟内存。\n\n## 什么是内存溢出 (OOM)？\n\nOOM 管理器（显然命名为 `out_of_memory()`）是一个运行并执行非常专注任务的进程。除非在处理内存请求（扩展堆和某些重映射函数）的特殊情况下，否则它不会被调用，所以它是一个冷众角色，但非常重要，而且，它在\
  \ Linux+ 目标中！\n\n## Note\n\n系统尝试通过回收旧的内存页帧来避免调用 OOM 管理器，但这可能不足以处理正在提出的内存请求。\n\n\
  首先发生的是系统将尝试检查是否有足够的内存，如果没有，它将：\n\n- 确定是否有足够的内存\n- 如果不足，验证系统\n- 根据若干页帧选择一个进程\n\n\
  存在一种可能性，系统并不是内存不足，而是处理能力跟不上速度，如果发生这种情况，OOM 管理器就会介入，在进程选择杀死之前，它会再次执行这些步骤。\n\n## 内存泄漏\n\
  \n正如本章早期在高 CPU 利用率部分讨论的，内存泄漏可能源于故障程序或糟糕的代码。无论如何，你会发现系统内存被缓慢耗尽，然后交换空间（虚拟内存）被耗尽，最后可能发生故障。\n\
  \n## 进程杀手\n\n杀死开始释放内存的进程见图 20-2 中的图。\n\n![Images](img/20fig2.jpg)\n\n**图 20-2**–OOM\
  \ Killer 图表\n\n`out_of_memory()` 进程的场景相当复杂，完全超出了讨论的范围。Linux 内核文档网站有大量关于其工作原理的有用信息，包括一张从图\
  \ 20-2 提取的图表。\n\n## 交换 (Swapping)\n\n交换的概念相对简单，它向用户（在某些情况下向系统管理员）隐藏了大量的细节和复杂性。\n\
  \n![Images](img/key_topic_icon.jpg)\n\n交换是你声明文件系统的一部分（交换文件）或专用分区（交换分区）的地方，它成为了实际物理内存的溢出区域。\n\
  \n**物理系统内存 + 配置交换空间 = 虚拟内存**\n\n正如之前所述，机器拥有的实际物理内存的大小并不是可用于程序的全部内存。然而，你不能实际上在交换空间中运行或执行程序，它是用于存储当前\
  \ CPU 执行时不需要的内容。\n\n你可以运行 `free` 命令查看你的系统内存和虚拟内存的情况，以及两者的结合，系统将其像一个灵活池一样用于存储当前执行的进程和线程（内存）以及已经获得或即将获得\
  \ CPU 时间片的线程的数据。\n\n## 交换、缓存和缓冲区\n\n`free` 命令用于确定系统上的空闲内存，不仅通过显示未使用的系统内存数量，还通过为你提供更详细的信息，关于你有多少空闲和使用的物理内存，使用了多少交换空间或基于磁盘的虚拟内存，以及使用的系统内存中有多少被缓冲区和缓存占用。正是这些缓冲区和缓存有时会产生很多困惑。\n\
  \n\n\n\n可以通过示例 20-6 查看`free` 命令的输出。\n\n**示例 20-6**–带有 `-h` 选项的 `free` 命令的输出\n\n\
  ```\n$ ~ $: free -h\n          total        used        free      shared  buff/cache\n\
  available\nMem:      3.8Gi       1.0Gi       1.2Gi       158Mi       1.6Gi\n2.4Gi\n\
  Swap:     2.0Gi          0B       2.0Gi\n```\n\n任何 Linux 系统用户在启动实验系统后，查看像 `free`\
  \ 等命令的输出时，总会有这样一个恍悟的时刻，心想：“到底是什么在耗尽我的系统内存？！”\n\n这一直是我在课上最喜欢的时刻之一，我总是花时间解释：在低负载系统上，系统内存就像一辆只载了一半乘客的巴士：每个乘客旁边的座位都有空间可以放置杂志、零食和饮料，并且有足够的空间伸展身体。然后，我将乘客与运行中的进程联系起来。\n\
  \n我们指出，乘客所分配的空间类似于进程的工作集（运行进程所需的所有内容）。这里的关键在于，当系统负载较轻时，系统可以将其他未使用的系统内存分配给缓存和缓冲区等方便且实用的项目，进程就可以稍微伸展身体，并拥有完全加载的工作集以实现进程的高运行。\n\
  \n### 块与缓冲区\n\n![Images](img/key_topic_icon.jpg)\n\n进程运行和系统处理速度的关键是块和缓冲区。块设备（如磁盘）具有一种名为`block`（块）的可寻址单元。其大小通常（尽管并非总是）为\
  \ 512 字节。系统软件也使用一种称为`block`的结构，但它通常比硬盘或其他块设备上的物理块尺寸大得多。\n\n当磁盘块被读取到系统内存时，它被存储在`buffer`（缓冲区）中。一个缓冲区与仅一个块关联，该缓冲区用于标识数据。\n\
  \n### 页、Slab 与缓存\n\n内核使用`pages`（页）来管理内存。`page`是操作系统管理的内存最小单位。`slab`是一种内存分配类型，用于存储不同大小的对象。`cache`（缓存）是一个临时存储区域，数据存储在其中以便更快地访问。\n\
  \n\n\n\n# CPU 进程优先级\n\n## 内存耗耗尽\n\n## 内存溢出 (OOM)\n\n## 交换 (Swapping)\n\n## 硬件\n\n\
  ### 复习题\n\n复习题的答案位于附录 A。\n\n**1.** 以下哪个命令将显示可用和使用的系统 RAM、交换、缓冲区和缓存信息？\n\n**a. `meminfo`**\n\
  \n**b. `bufflist`**\n\n**c. `free`**\n\n**d. `lsmem`**\n\n**2.** 当子进程退出但其在进程表中的项未被父进程清除时，该进程被称为\
  \ _______？\n\n**a.** 遗弃的 (Abandoned)\n**b.** 孤儿 (Orphan)\n**c.** 僵尸 (Zombie)\n**d.**\
  \ 松散的 (Loose)\n\n**3.** 你启动了一个进程，通过调查发现它消耗的系统资源比平时多。由于任务重要且紧迫，你不想直接杀死它并重新开始。以下哪个命令允许你在该进程运行时影响其优先级？\n\
  \n**a. `renice`**\n**b. `procadj`**\n**c. `sig`**\n**d. `ps`**\n\n**4.** 当系统需要尝试清理足够的内存页帧以满足内存使用请求但无法实现时，什么整体过程会被调用并尝试修复这种情况？\n\
  \na. `select_bad_process`\nb. `badness`\nc. `force_sig`\nd. `out_of_memory`\n\n\
  **5.** 你确信系统没有配置足够的交换空间，想在不中断正在运行的工作的情况下添加一些。你的系统只有一个完全分配但有空闲内部磁盘。你可以安全地添加哪种方法的交换？\n\
  \n**a.** 基于硬件 (hardware-based)\n**b.** 基于软件 (software-based)\n**c.** 基于分区 (partition-based)\n\
  **d.** 基于文件系统 (filesystem-based)\n\n**6.** `lscpu` 命令从哪个 `/proc` 文件读取数据？\n\n**a.\
  \ `cpustats`**\n**b. `cpudetails`**\n**c. `cpugrep`**\n**d. `cpuinfo`**\n\n# 第 21\
  \ 章 分析与排除用户和文件权限\n\n本章涵盖以下主题：\n\n• 用户登录问题\n• 用户文件访问问题\n• 密码问题\n• 权限提升问题\n• 配额问题\n\
  \n本章涵盖的考试目标如下：\n\n• **目标 4.4：** 给给定场景下，分析并排除用户访问和文件权限问题。\n\n由于 Linux 系统中的一切都是文件（甚至是文件系统对象），确保用户对这些文件具有适当的访问权限并阻止不当访问是关键。\n\
  \n### “我已经掌握了吗？”测验\n\n“我已经掌握了吗？”测试可以让你评估自己应该阅读整个章节，还是直接跳到“考试准备任务”部分进行复习。如果你不确定，请阅读整个章节。表\
  \ 21-1 概述了本章的主要标题以及对应的“我已经掌握了吗？”测验题。你可以在附录 A，“我已经掌握了吗？”测验和复习题的答案”中找到答案。\n\n**表 21-1**–“我已经掌握了吗？”基础知识章节与题目映射\n\
  \n![Images](img/21tab01.jpg)\n\n**注意**\n\n自评估的目标是衡量你对本章主题的掌握程度。如果你不知道问题的答案，或者只对答案部分确定，那么为了自评估的目的，你应该将该题标记为错误。对于你猜对的答案给自己分会歪曲自评估结果，并可能给你一种虚假的安全感。\n\
  \n**1.** 一个不熟悉 Linux 工作原理的新 Web 设计师尝试以用户 nginx 的身份登录，并向你请求重置密码。你告诉用户，不允许以 _______\
  \ 账户登录。选择缺失的单词或短语。\n\n**a.** 用户 (user)\n**b.** 登录 (login)\n**c.** 服务 (service)\n\
  **d.** 访问 (access)\n\n**2.** 用户使用常用的账户 ID 登录，但需要临时切换到另一个 ID。哪个命令可以避免他们注销并重新以该账户登录？\n\
  \n**a. `su`**\n**b. `id`**\n**c. `ip`**\n**d. `df`**\n\n**3.** 用户从另一个系统迁移过来，遇到了密码问题。在显示该用户的\
  \ `/etc/passwd` 条目时，你发现第二列预期的 x，但在 `/etc/shadow` 中，你可能会发现一个 ___ 字符，表示用户尚未设置密码。选择表示此含义的字符。\n\
  \n**a.** `#`\n**b.** `@`\n**c.** `%`\n**d.** `!`\n\n**4.** 既然你宁愿被活煮也不愿给其中一个普通用户\
  \ root 密码，哪个工具允许你配置他们以 root 用户身份运行各种程序的能力，而无需知道实际密码？\n\n**a. `rootme`**\n**b. `newuser`**\n\
  **c. `su -i`**\n**d. `sudo`**\n\n**5.** 用户提到他们本以为会被限制使用超过某些数量的磁盘空间，但能够保存并存储更多，并想知道为什么。配额管理的哪个功能或选项导致了这种明显的限制缺失？\n\
  \n**a.** 弱保存 (weak save)\n**b.** 软限制 (soft limit)\n**c.** 宽限 (grace period)\n**d.**\
  \ 块限制 (block restriction)\n\n### 基础知识\n\n## 用户登录问题\n\n对于用户来说，没有什么比无法登录更令人恼除了，当然他们会将这种情绪传染给\
  \ IT 人员，这都是用户的一部分！\n\n### 用户登录过程\n\n`user login` 过程以及关于用户、组及其管理的更多内容可以在第 9 章“实现身份管理”中找到。通过阅读该章节并查看所有示例，我们可以直接进入用户可能会遇到的常见登录问题，以及如何防止这些问题的发生，或者在发生时如何修复。\n\
  \n### 检查账户详情\n\n在四处奔波寻找用户无法登录的原因之前，查看用户的账户详情并检查一切是否正常或是否存在问题是重要的。\n\n为了真正理解用户及其登录问题发生了什么情况，你至少需要运行以下\
  \ 3 个命令，以获取足够的信息来准确地描绘该用户世界的状况。\n\n#### 请提供 ID\n\n`id` 命令非常有用，因为它会显示任何用户的丰富信息，如示例\
  \ 21-1 所示。\n\n![Images](img/key_topic_icon.jpg)\n\n**示例 21-1**–`id` 命令输出示例\n\n```\n\
  $ id\nuid=1000(rossb) gid=1000(rossb) groups=1000(rossb),4(adm),20(dialout),\n24(cdrom),25(floppy),27(sudo),29(audio),30(dip),44(video),46(plugdev),117(\n\
  netdev),118(lxd)\n```\n\n第一个键值是 `uid`，代表用户 ID（User ID），它与 /etc/passwd 或名称服务数据库中配置的用户名匹配。\n\
  \n第二个值是 `gid`，代表主组 ID（Primary Group ID），换句话说，如果此账户创建了典型的文件或目录，将使用该 ID 作为组所有者。\n\n\
  第三个是 `groups`，代表该用户所在的辅助组（Secondary Groups），但不是主组。\n\n你在这里寻找的是任何异常之处，特别是当你……\n\n\
  #### 获取实体\n\n`getent` 命令同样非常有用，因为它会查询 `/etc/passwd` 或 `/etc/shadow` 文件等数据库并返回如示例\
  \ 21-2 所示的信息。\n\n![Images](img/key_topic_icon.jpg)\n\n**示例 21-2**–`getent` 命令输出示例\n\
  \n```\n$ getent passwd rossb\nrossb:x:1000:1000:RossB:/home/rossb:/bin/bash\n$ sudo\
  \ getent shadow rossb\nrossb:!:19051:0:99999:7:::\n```\n\n\n\n\n对 `passwd` 文件的查询显示了\
  \ rossb 账户的数据，你可能会检查它并对自己说：“但是 Ross，这正是我如果针对 `/etc/passwd` 文件运行 `grep` 命令并搜索用户 rossb\
  \ 时得到的结果完全是一模一样。”你是对的。\n\n### 注意\n同样非常重要的一点是，`passwd` 文件条目中的最后一个字段必须是一个有效的 shell。如果没有，他们就无法登录。请查看\
  \ 第 9 章 中的 `/bin/false` 和 `/sbin/nologin` 信息，这些程序被重新设计是为了极大地改变用户的登录能力。\n\n第二个查询是针对\
  \ `shadow` 文件的，必须以 root 身份运行，因为该文件不是公开可见的。如果你在不使用 `sudo` 命令的情况下运行它，你只会得到一个空白返回，而不是报错。\n\
  \n在 `shadow` 文件中，你会看到一个对于这个尝试登录的用户来说可能是问题：`/etc/passwd` 文件中的 `password` 列中有一个 `x`（这本应如此），但\
  \ `/etc/shadow` 文件的 `password` 列中有一个至关重要的 `!`，这意味着该用户**尚未**设置密码！\n\n### 注意\n非常有趣的是，我有一个学生问过我，为什么在这种情况下，系统在他们尝试登录时不会直接提示用户设置密码呢？当我注视着他们并思考如何回答时，他们突然点头说：“噢，对的，那么任何人都可以为该用户设置密码了……”\
  \ 漂亮！他们赢奖了！\n\n### 大小写敏感性\n让我们面对现实吧，如果你了解 Linux 的大小写敏感性，你就懂了。如果你不懂，你很快就会意识到即使是一个单独的大写/小写字符会有多么重要。\n\
  \n如果你正在登录到一个基于 Linux 的远程系统，而你的主系统运行的是 Windows，至少你已经朝着正确的方向迈出步！说真的，许多用户在 Windows\
  \ 和 Linux 系统上会有相同的用户名，但 Windows 除了极少数地方外对大小写不敏感，而登录并不是其中之一。\n\n如果你的主系统习惯在任何提示处自动提供你的登录名，那么当你尝试远程登录或使用\
  \ Web 表单访问 Linux 系统时，它可能会这样做，从而由于你的 Windows 登录名首字母大写导致失败。\n\n### 我该如何修复？\n你通常无法修复。这种大小写敏感性的缺失在\
  \ Windows 中是如此根深蒂固或“内置”的以至于你可能找不到哪里可以让它变得不同。\n\n关键在于意识到，如果你正在登录或提交凭据，用户名和密码**都**是极其且精确的大小写敏感的。\n\
  \n### 用户是否登录过？\n有时你直接知道用户从未登录过，例如当他们是新用户时；但有时你知道用户定期登录，而你需要知道这些信息。\n\n### last 命令\n\
  ![图像](img/key_topic_icon.jpg)\n\n`last` 命令用于向你显示输出列表，让你看到系统最后发生了什么，例如谁登录了、从哪个端口登录、他们可能在运行什么等。\n\
  \n以时间倒序顺序查看可能重要的事项非常有帮助，特别是系统最后一次启动的时间，以及谁仍然处于登录状态，正如 示例 21-3 所示。\n\n**示例 21-3**——last\
  \ 命令输出示例\n\n```\n$ last | head\nubuntu   pts/0        192.168.64.1     Sun Feb 12\
  \ 20:31   still logged in\nubuntu   pts/0        192.168.64.1     Sun Feb 12 20:29\
  \ - 20:31  (00:01)\nubuntu   pts/0        192.168.64.1     Fri Feb 10 15:28 - 17:00\
  \  (01:31)\nreboot   system boot  5.4.0-99-generic Feb Feb 10 15:20   still running\n\
  ubuntu   pts/0        192.168.64.1     Sun Jan 15 22:21 - 22:17  (23:55)\nreboot\
  \   system boot  5.4.0-99-generic Sun Jan 15 22:09   still running\n```\n\n### lastlog\
  \ 命令\n`lastlog` 命令也有用，但提供的信息有所不同，用于列出用户及其登录状态、日期和时间、如果可以识别的端口和 IP 地址。\n\n示例 21-4\
  \ 显示了 lastlog 的默认输出。\n\n**示例 21-4**——lastlog 命令输出示例\n\n```\n$ lastlog | tail\ntss\
  \                                        **Never logged in\nuuidd              \
  \                        **Never logged in\ntcpdump                            \
  \        **Never logged in\nsshd                                       **Never logged\
  \ in\nlandscape                                  **Never logged in\npollinate  \
  \                                **Never logged in\nsystemd-coredump           \
  \                **Never logged in\nubuntu           pts/0    192.168.64.1     Sun\
  \ Feb 12 20:31:34 -0700 2023\nlxd                                        **Never\
  \ logged in\ndnsmasq                                    **Never logged in\n```\n\
  \n这非常有用，但你可以使用 `grep` 命令用一个小技巧，让你只确定哪些用户**已经**登录过，从而过滤掉所有带有“Never logged in”消息的服务账户。\n\
  \n示例 21-5 显示了使用 `grep` 命令过滤后的 lastlog 输出，仅显示成功登录的账户。\n\n**示例 21-5**——lastlog | grep\
  \ -v 命令输出\n\n```\n$ lastlog | grep -v \"Never logged in\"\nubuntu           pts/0\
  \    192.168.64.1     Sun Feb 12 20:31:34 -0700 2023\n```\n\n现在，这才是一些非常有用的信息。你不需要费过几十个服务账户来查看哪些用户账户成功登录了，而且你还可以寻找那些显示为“已登录”的服务账户，这是系统出现错误或遭受黑客/破解的可靠迹象。\n\
  \n### 用户文件访问问题\n组问题可能比用户登录问题更难追踪和排除，因为登录是 0 或 1，但组问题感觉就像是周期性发生的。\n\n#### 组问题\n可以规避常规检查的问题之一是，用户是否在分配了访问资源的相应\
  \ *组中。\n\n找出用户属于哪些组的简单方法是使用该用户名作为参数执行 `groups` 或 `id` 命令，如 示例 21-6 所示。\n\n![图像](img/key_topic_icon.jpg)\n\
  \n**示例 21-6**——groups 命令输出示例\n\n```\n$ groups rossb\nrossb : rossb adm dialout cdrom\
  \ floppy sudo audio dip video plugdev netdev\n```\n\n你应该你应该检查资源的 `ls -l` 输出（目录使用\
  \ `ls -ld`），并查看该组在中间三个 rwx 位置中是否具有至少 r 读取权限。你可以在 第 2 章,“管理文件和目录”中阅读更多关于你可能需要的其他工具，例如\
  \ `chmod` 命令，你可以用它对组的权限进行任何调整。\n\n#### 上下文问题\n*上下文 问题发生在 AppArmor 或 SELinux 领域，排除起来较为复杂。建议查阅\
  \ 第 12 章,“理解并应用访问控制”获取有关这两种安全上下文如何应用以及你如何排除它们的更多信息。\n\n#### 权限问题\nLinux 中的权限比 Windows\
  \ 简单得多，这正是很多困惑的来源。不是 Windows，而是 Windows 应用和管理文件目录权限的方式与 Linux 之间的差异。\n\n在 第 2 章中，你会找到关于权限的非常全面的讨论，以及如何查看、更改和确认它们，这些都是你在修复权限问题时最可能采取的操作。\n\
  \n#### ACL（访问控制列表）问题\n\n\n\n\n再次，当涉及到`访问控制列表或 ACL`](#ch21.xhtml_key06-a）问题时，第 12\
  \ 章你可以在那里找到关于 ACL 如何工作、如何使用以及如何读取和排查其故障的最佳讨论。\n\n### 属性问题\n\n文件`attributes`](#ch21.xhtml_key07-a）是一种模糊的情况，即在文件系统对象上设置了特殊属性，例如一个文件被设置为“只允许追加”，这样它无法被覆盖，只能添加内容。另一个非常常见的设置属性，特别是在像\
  \ Web 服务器这种会承受极高读取流量的文件系统上，是 `noatime` 属性，在该属性下，读取文件**不会**更新 `atime` 文件信息，你可以通过示例\
  \ 21-7 所示的命令将其与其他两个时间 `mtime` 和 `ctime` 一起查看。\n\n**示例 21-7**–`stat` 命令输出示例\n\n```\n\
  $ stat file1\n  File: file1\n  Size: 0            Blocks: 0          IO Block: 4096\
  \   regular empty file\nDevice: fc01h/64513d Inode: 258226      Links: 1\nAccess:\
  \ (0664/-rw-rw-r--)  Uid: ( 1000/  ubuntu)   Gid: ( 1000/  ubuntu)\nAccess: 2022-06-01\
  \ 23:15:35.864502122 -0600\nModify: 2022-06-01 23:15:35.864502122 -0600\nChange:\
  \ 2022-06-01 23:29:41.424625649 -0600\n Birth: -\n```\n\n如你所示，这三个时间位于输出的底部，分别标记为\
  \ `Access` (`atime`)、`Modify` (`mtime`) 和 `Change` (`ctime`)。\n\n![图像](img/key_topic_icon.jpg)\n\
  \n要查看文件系统对象上的特殊属性，请对该对象使用 `lsattr` 命令，如示例 21-8 所示。\n\n**示例 21-8**–`lsattr` 命令输出示例\n\
  \n```\n$ laattr file1\n------dA------e----- file1\n```\n\n如你所示，“不转储”、“无 atime 更新”和“区格式化”属性已设置在平凡的\
  \ file1 上。\n\n其他值得注意的属性：\n\n• `s` 或 `Secure Updates`（安全更新）是一种安全擦除，当该文件被删除时，文件系统机制会用零覆盖其磁盘资源并写回磁盘。\n\
  \n• `d` 或 `No Dump`（不转储）意味着如果使用 `dump backup` 命令，不要备份此文件。\n• `i` 或 `Immutable`（不可变），意味着文件被设置为不可更改，必须将其设置为可变，才能进行任何更改。\n\
  • `e` 或 `Extents`（区）被用于映射该文件在磁盘上的块。\n\n特殊属性可能并不明显，通常只出现在 Ext 文件系统中，其他文件系统可能不允许设置这些特殊属性中的或全部。\n\
  \n获取更多属性信息的最佳地方是 `chattr (1)` 和 `lsattr (1)` 手页。\n\n### 策略/非策略问题\n\n再次，Linux+ 的目标并不十分具体，甚至对于确定所问的是哪种`策略`](#ch21.xhtml_key08-a）或`非策略`](#ch21.xhtml_key09-a）问题也没有帮助。\n\
  \n作者身上发生过这种情况，这也是我以前见过的情况，我将其称之为“静默访问问题”，这通常与开启了 SELinux 但没有从日志中获得任何关于资源访问被拒绝的信息有关。\n\
  \nSELinux 试图减少服务过度查询其访问时发生的假性计数，因此使用了一种名为“dontaudit”的规则，这会导致服务被拒绝访问，但被错误报告或者最重要的是，**完全没有报告**！\n\
  \n如果你发现自己处于这种情况下，可以通过以下命令禁用你的“dontaudit”规则，并使此类访问尝试被记录：\n\n```\n$ semodule -DB\n\
  ```\n\n这将通过 `-D` 选项禁用 \"dontaudit\" 策略规则，并通过 `-B` 选项重新构建策略。\n\n现在你可以运行程序、服务或命令，并观察\
  \ SELinux 日志以获取更有用的排故障消息。\n\n要重新启用 \"dontaudit\" 策略，只需使用命令重新构建整体策略：\n\n```\n$ semodule\
