  d. 存储和访问容器镜像\n\n## 基础主题\n\n### Kubernetes 优势与应用场景\n\n不久前，“什么是 Kubernetes 以及你用它做什么？”这个问题很难回答。自从\
  \ 2014 年 Google 宣布以来，已经走了很长的道路，如今它已成为云计算版图中非常重要的一部分，且市场份额仍在增长。\n\nKubernetes，或者常说的\
  \ K8s，是云原生基金会（由 Google 和 Linux 基金会创建）的第一个种子项目。\n\n在大约 3 年的时间里，Kubernetes 赢得了大多数大型云提供者，包括“三巨”：Google\
  \ 的 GCS（云服务）、微软的 Azure 和亚马逊的 AWS，它们都提供了 Kubernetes 支持。\n\n由于在此版本的 Linux+ 目标中没有其他提到\
  \ Kubernetes，而且它已经成为我们计算环境中非常大的一部分，因此确保你理解 Kubernetes 是什么以及至少了解其运作的大致轮廓是非常重要的。\n\
  \n#### Kubernetes 到底是什么？\n\nKubernetes 是一套技术，这些技术可以很好地结合在一起，形成一个更大的结构，使其能够根据多项标准创建、部署、维护以及最关键的——扩展你的应用程序。这些标准包括完成任务所需的\
  \ CPU 数量、支持计算所需的内存量，以及你可以指定和配置以适应你应用程序种的许多其他附加标准。\n\n换句话说，Kubernetes 是容器以及运行在它们或其上的应用程序的编排管理器。编排是一个术语，意味着使用软件自动化原本必须手动完成的操作，例如对运行在你计算架构上的大规模应用程序进行配置、协调、管理和监控。\n\
  \n**注意**\n\n紧接 第 16 章 中学习的“理解基础即代码”，在这些中一个工具被视为功能性/声明式或过程式/命令式的模式下，Kubernetes 绝对属于声明式的一类。\n\
  \n例如，你不需要告诉 Kubernetes **如何**去执行某事，你只是告诉它你**想要**发生某事，或者你设置一个参数（如 CPU 利用率），这将导致 Kubernetes\
  \ 增加或减少资源。\n\n#### Kubernetes 的高层结构\n\n![Images](img/key_topic_icon.jpg)\n\n- **Kubernetes\
  \ 控制平面** – 多个负责管理整个集群的组件。这些组件有时被称为 Kubernetes Masters 或控制器（Controllers）。\n\n\n\n\
  \n\n- **Kubernetes 节点 (Nodes)** – Kubernetes 节点是运行构成 Kubernetes 集群容器的机器。虽然 Kubernetes\
  \ 集群可以拥有任意数量的节点，但你可以轻松地在单台机器上运行 Kubernetes 集群。\n- **Kubernetes Pod** – Pod 是 Kubernetes\
  \ 世界中最小的单元，部署时由一个或多个容器组成。Pod 中的容器相互关联，并具有具有相同的生命周期以及其他值得注意的特性。\n\n上一个列表只是对 Kubernetes\
  \ 集群的一个高层次概括，让我们接下来了解各个组件位于什么位置。\n\n## Kubernetes 控制平面结构\n\n![Images](img/key_topic_icon.jpg)\n\
  \nKubernetes 控制平面包含管理 Kubernetes 节点的功能，这些项目包括：\n\n- `kube-controller-manager` –\
  \ 是管理 Kubernetes 所有控制循环（control loop）的进程/组件。\n- `kube-scheduler` – 负责选取还没有容器的 `Pods`，并根据\
  \ Kubernetes 环境默认或配置的需求将容器分配到 Pod 中。\n- `cloud-controller-manager` – 通过云服务商的 API\
  \ 接口与之工作，处理特定任务，如名称解析以及跨硬件资源进行扩展和收缩。\n- `kube-api-server` – 为 Kubernetes API 过程执行前端操作的组件。\n\
  - `etcd` – 是一个键值存储，以高可用方式存储 Kubernetes 的所有数据库信息，对所有发生的情况保留良好的日志记录，并确保这些信息在节点和其他组件中均可用。\n\
  \n### Note\nKubernetes 部署可以是普通级别的，即组件不处于高可用状态（组件的多个副本），也可以是高可用状态，即某些组件为了冗余进行了复制，并建立了主者选举顺序。这远超\
  \ Linux+ 目标的范围，但对了解这些是有益的。\n\n## Kubernetes 节点结构\n\n![Images](img/key_topic_icon.jpg)\n\
  \nKubernetes 节点是运行构成 Kubernetes 环境应用的系统/服务器。节点可以包含各种进程，但至少包含：\n\n- `kubelet` – 是获取给定\
  \ Pod 期望或目标状态指令的进程，并确保该 Pod 被正确部署并保持健康。\n- `kube-proxy` – 从其名称来看这并不意外，该进程处理所有节点的节点的\
  \ UDP、TCP 和 SCTP 代理任务，并帮助提供负载均衡服务。\n- `Pods` – 这些是节点上最小层级的 Kubernetes 功能，它们至少包含一个容器，如果有多个容器，它们会紧密关联，因为许多功能保留在\
  \ Pod 级别，例如大多数网络功能、容器的生命周期与 Pod 相关等。\n- `Containers` – 这是 Kubernetes 中唯一真正不属于 Kubernetes\
  \ 或不是其原生的部分！Kubernetes 支持多种容器标准，但它没有自己自己的容器方案。\n\n## 容器运行时接口 (Container Runtime\
  \ Interface)\n\nKubernetes 和 Docker 都运行容器，但 Docker 可以直接访问 `Containerd` 运行时，而 Kubernetes\
  \ 使用名为 `CRI`（容器运行时接口）的访问 API。\n\n从那里开始可以使用 `CRI-O` 或 `Containerd`，它们都使用开放容器倡议的 `OCI`\
  \ 规范来让 `runC` 创建并运行实际的容器化进程。\n\n## 特殊容器类型\n\n除了常规应用程序容器（即应用程序与所有所需的依赖项打包并存储为镜像，然后执行该镜像变成容器）外，你还需要了解几种特性的容器类型：\n\
  \n![Images](img/key_topic_icon.jpg)\n\n- **Sidecar (旁路容器)** – sidecar 容器随主应用程序容器（或容器）一起运行，与其他容器共享相同的存储和网络资源。Sidecar\
  \ 可以被认为是一个执行助理，Pod 中各种应用程序容器所需的功能可以使用 sidecar 来实现流量路由、高可用需求、聚合日志和证书分发等功能。\n- **Ambassador\
  \ (出大使容器)** – ambassador container 通常置于 Web 服务器和其后端微服务之间，这样在微服务必须移动时，不需要对网站进行任何更改，它与出大使容器的通信方式保持不变，由该出大使容器将流量路由到新位置或新的后端微服务。NGINX\
  \ 用户会将此识别为反向代理的形式，客户端不知道或不在乎后端资源是谁或在哪里，那取决于反向代理的配置。\n\n## 使用 Kubernetes 的优势\n\n\
  许多组织可以并且正在使用 Kubernetes，但一些最大的机构是它的忠实粉丝。运行 Kubernetes 的益处包括：\n\n- 提高资源利用率\n- 缩短软件开发周期\n\
  - 简化应用升级及相关维护\n- 将旧版和单体应用容器化的能力\n- 减少公云的使用及相关成本\n- 操作的灵活性\n- 开发者效率提升\n- 运维效率\n\n\
  如你所见，Kubernetes 有些复杂，但它已经接管了大部分计算领域，并且是公有云以及日益增长的私云的重要组成。\n\n上一个部分应该让你对 Kubernetes\
  \ 及其主要组件有一个良好的概述，以及它们是如何相互作用的。作为理解 Kubernetes 的进一步途径，由于 Linux+ 并不是你获得最全面理解的地方，我推荐由\
  \ CNCF（云原生计算基金会）托管的 Kubernetes 网站上的精选资源：[`kubernetes.io/`](https://kubernetes.io/)。\n\
  \n### 单节点多容器用例\n\n再次，Linux+ 的目标晦晦地规定我们应该了解某个主题，但并没有真正告诉我们真正需要了解该主题的哪个方面或具体内容。\n\n\
  他们为这个主题通过“Compose”这一个单词给了我们一个非常非常微小的线索，这确实引导我们了一系列相关的用例，用于创建大致模拟生产环境的开发环境。\n\n从这个单词中，我们可以假设他们指的是使用\
  \ Docker Compose。Docker 是你可以在集群中创建和部署容器的方法之一。\n\n### 多容器开发环境\n\n你有几种方法可以处理这种场景，最简单的方法是在同一个节点上、同一个\
  \ Pod 中设置几个容器，并让它们工作以实现更大的功能集。\n\n#### 2 容器节点示例 A\n\n在单个节点上配置多个容器的一个示例是设置一个相对简单的开发环境，其中你的节点拥有一个\
  \ NGINX 反向代理容器，该容器保护着后端的 Elasticsearch 容器。\n\n通过将 NGINX 反向代理和 Elasticsearch 容器放在同一个\
  \ Pod 中，你就可以使用相同的 IP 地址对这两个容器进行访问，只需端口不同。\n\n你可以使用 Elasticsearch 执行很多事情，其中任何一项实际上与我们的示例无关，但它擅长实现应用、网站和企业级的数据搜索、分析和监控等功能。\n\
  \n#### 2 容器节点示例 B\n\n\n\n\n在单个节点上配置多个容器的另一个示例是：配置一个 `Node`，其中配置了一个 NGINX Web 服务器和一个后端数据库（如\
  \ `Mariadb`），其中数据库容器仅供 Web 服务器容器访问。Web 服务器容器被配置为通过 Pod 的网络配置进行公开可访问，而数据库容器则仅在后台与\
  \ Web 服务器配合工作以提供内容。\n\n### 3 容器多节点示例\n\n关于单节点多容器使用 的一个更复杂的场景可能是是：你正在使用类似示例 B 中的传统配对，但随后你向你的环境中引入了服务网格（Service\
  \ Mesh）。\n\n这将添加一个边车代理（sidecar proxy），它有助于保护并增强主容器的能力，主容器可能正在执行某些非常特定的任务，例如通过 NGINX\
  \ 提供 Web 服务！\n\n请注意，标准的 Kubernetes 集群说明和意图通常认为每个容器应该对应一个服务，这是正确的，但保持你的 Pod 尽可能简单也是一种好的做法，因为该\
  \ Pod 中的所有容器在实际上是绑定在一起的，包括网络、重启周期等。\n\n### 容器持久化存储\n\n持久化容器存储 并没有看起来那么复杂，因为容器本身没有任何持久化内容，它们必须依赖其他工具来保留和存储跨容器实例所需的任何内容。\n\
  \n#### Docker 卷 (Volumes)\n\n由于目标没有专门讨论 Kubernetes，我们可以从更简单的开始，讨论 Docker Volumes，或者你使用过\
  \ `docker volume create <dockervol>` 命令在运行 Docker 的本地系统上创建一个卷，如下命令所示：\n\n```bash\n\
  docker volume create mydatavol\n```\n\n从那里，你可以使用命令将卷挂载到新容器：\n\n```bash\ndocker -d\
  \ -p 5000:5000 -v mydatavol:/mydatavol mydatavol\n```\n\n现在你可以在容器中打开一个 bash shell，并看到\
  \ `/mydatavol` 存储位置存在。\n\n##### 使用 Docker Volumes 的优势\n\nDocker 卷可以被创建、挂载，并与挂载它的容器进行交互；当这些容器停止并消失时，数据卷仍然存在，并且可以反复多次使用。\n\
  \n显然，这允许你在该本地驻卷上存储配置和其他数据，并根据容器的需求以及你希望发生的情况，让容器以读写或只读模式访问它。\n\n简而言之，使用 Docker Volumes\
  \ 的主要优势是它更快、不与容器的生命周期绑定，并且是为了多个容器的使用而设计的。\n\n##### 使用 Docker Volumes 的劣势\n\n坦率地说，使用\
  \ Docker Volumes 没有什么重大挑战，除非你没有使用 Docker……务必记住，当使用该卷的最后一个容器停止或被杀死时，Docker Volumes\
  \ 会被销。\n\n有些迹象表明，保留数据的最佳方法（即使在删除最后一个*其他*容器后）是让一个容器专门收集并存储从更瞬态的容器产生的数据，然后将这些数据提交到你用于启动容器的镜像中，或者更持久的文件系统存储中。\n\
  \n#### 绑定挂载 (Bind Mounts)\n\n与 Docker Volumes 相，绑定挂载（bind mount）几乎从 Docker 诞生初就存在。\n\
  \n![Images](img/key_topic_icon.jpg)\n\n绑定挂载是指你在主机系统的存储上有一个文件或目录，然后将其绑定或挂载到容器的文件系统中。绑定挂载始终以绝对路径/文件的方式进行引用。\n\
  \n如果你熟悉使用磁盘上的文件为 Linux 系统添加额外的交换空间（swap space）的概念，那么使用绑定挂载就会很有意义。\n\n##### 使用绑定挂载的优势\n\
  \n绑定挂载也允许你为容器提供持久化存储，并且性能很高，这当然取决于所挂载文件系统的状态和繁忙程度。\n\n绑定挂载已经存在很长时间了，它们非常容易使用，并且有大量的代码围绕创建、管理和删除它们而构建。\n\
  \n##### 使用绑定挂载的劣势\n\n绑定挂载可能很容易，但就像很多容易的事情一样，使用绑定挂载可能会为你的环境引入重大问题。\n\n最重要的是，绑定挂载实际上是直接访问主机文件系统上的文件，至少可以说，这是一种安全风险。\n\
  \n通过绑定挂载目录来创建一个巨大的文件或一组文件以填充主机文件系统，甚至访问主机上的其他文件、进程等，这是一种非常简单的黑客手段，特别是当 `/tmp` 或\
  \ `/var/run` 位置存在绑定挂载时。\n\n#### Kubernetes 持久化卷 (Persistent Volumes)\n\n在容器数据持久化的讨论中，如果没有讨论\
  \ Kubernetes 如何处理容器的持久化存储，那么讨论就是完整的。\n\nKubernetes 拥有非常大量的卷类型，从 AWS 特有的到 vSphere\
  \ 的应有尽有，但这些功能远超我们 Linux+ 考试的需求。\n\n##### Kubernetes 持久化卷子系统\n\n![Images](img/key_topic_icon.jpg)\n\
  \nKubernetes 有一个处理存储如何消耗的子系统。有两个 API 资源或调用控制着这一点：\n\n- `PersistentVolume` —— 也称为\
  \ PV，这是集群中的一种资源，已手动或自动配置供使用。PV 与集群中的 `Node` 处于同一级别，且与 `Volume`（其生命周期与容器绑定）不同，PV\
  \ 有它自己的持久化和生命周期，并且独立于任何请求存储的 Pod（或其任一个容器）。\n- `PersistentVolumeClaim` —— 也称为 PVC，这是用户或进程对存储资源的请求。这些请求发生在\
  \ Pod 级别，并可以有多种形式，取决于请求的用户/进程需要存储用于什么。\n\n##### PV 和 PVC 的生命周期\n\n记住，PV 独立存在于 Kubernetes\
  \ 集群中并有自己的生命周期，而 PVC 是非常瞬态的，它们的创建和销毁（或回收）取决于用户/进程是否完成了该请求（Claim），以及 PV 是否收到了回收、保留或删除该资源的指令。\n\
  \n注意\n\nLinux+ 目标将测试你关于卷、存储持久化以及 Docker 和 Kubernetes 如何处理存储持久化的整体知识。我们已经超出了这些范围，但给你提供完整的背景是非常重要的，这样你不仅仅是听到一些短语，而是理解它们是如何结合在一起的。\n\
  \n### 容器网络\n\n容器网络 可以是一个复杂的话题，因此最好从定义什么是覆盖网络（Overlay Network）以及它们为什么存在开始。##########什么是覆盖网络？\n\
  \n![Images](img/key_topic_icon.jpg)\n\n覆盖网络 是一种构建在现有网络基础设施之上的网络构造或方案。在某些情况下，子网（Subnets）的概念是对提供网络基础设施的实际硬件的覆盖。\n\
  \n在容器中，覆盖网络是你拥有的分布式网络的方式，允许多个容器（通过它们的 Pod）通过网络方案相互访问。\n\n覆盖网络不同于 Pod 间的通信， Kubernetes\
  \ Pod 内部的容器可以在不使用任何外部资源的情况下安全地相互通信。\n\n注意\n\n当你有多个运行容器的主机系统时，覆盖网络也是有用且必要的，因为这些容器不仅需要在同一主机的容器之间通信，还需要在位于不同主机的容器之间通信。\n\
  \n##### Docker Swarm\n\n\n\n\n\nDocker 有一个名为 Swarm（集群）的概念，允许容器之间进行加密通信，而 Swarm 是在实际\
  \ Docker 主机网络配置之上的一个 Overlay（叠加网络）。\n\n当你使用 Docker 创建 Overlay Network（叠加网络）时，会创建几个网络：\n\
  \n• `ingress` – 该网络处理与 swarm 相关的数据和流量，除非指定连接用户创建的 overlays，否则 swarm 服务会自动连接到此网络。\n\
  • `docker_gwbridge` – 该网络将已加入 swarm 的 Docker 守护进程（daemons）相互互连。\n\n## Kubernetes\
  \ Overlay Networks\n\n不出意外的是，虽然 Docker 的 overlays 和 swarms 相对容易理解和实现，但 Kubernetes\
  \ 走得更远，为叠加网络结构提供了许多选择，包括但不限于：\n\n• `Flannel` – Flannel 代理 `flanneld` 驻留在每个主机上，一旦分配了\
  \ IP 和子网信息，它就会使用 Kubernetes API 来存储主机的网络配置信息。\n\n• `Calico` – 继续延续“织物”（fabric，懂吗？）的主题，Calico\
  \ 更复杂且功能更全，提供了一个健壮的网络栈，其中包含一个虚拟路由器，该路由器使用 `BGP`（边界网关协议）向环境其他部分发布服务的存在。\n\n• `Cilium`\
  \ – 在顶端，Cilium 解决方案是目前 Kubernetes 功能最全、最完整的解决方案。它可以完成从分配、过滤、策略执行的所有工作，甚至可以用它自己的组件替换真实的\
  \ `kube-proxy` 代理！\n\n### Note\n\n再次，Linux+ 的目标将测试你对叠加网络的全面知识，我们确保了提供的内容超出了我们所认为所需的范围，因为你确实需要知道\
  \ overlays 在 Docker 和 Kubernetes 中是如何被使用的。\n\n## Bridging Networks（桥接网络）\n\n在这个示例中，我们将使用\
  \ Docker 以及它如何使用桥接（bridge）来连接资源。桥接是 Docker 世界中允许容器相互通信的默认网络设置。任何连接到同一桥接网络的容器都可以与同一桥接上的其他容器接触并通信。\n\
  \n![Images](img/key_topic_icon.jpg)\n\n然而，桥接网络仅用于同一主机上容器之间的通信，因此如果要进行跨主机通信或让不同主机上的容器相互通信，则需要叠加网络。（请参见最近关于叠加网络和跨主机通信的注。）\n\
  \n默认情况下，Docker 在启动时会创建一个命名相当平庸的桥接网络：`bridge`，任何在其之后启动的容器都会自动连接到同一个默认桥接网络。\n\n如果默认桥接网络不能满足你的需求，很容易创建带有自定义设置的用户定义桥接。\n\
  \n## Swotting a NAT（NAT 解析）\n\n`NAT` 或 `Network Address Translation`（网络地址转换）设置的概念是大多数人每天在工作或家庭路由器上使用的功能。`NAT`\
  \ 是你在路由器外部拥有一个公地址，它能够与外部网络或互联网进行任何意义上的通信。在 `NAT` 内部，使用私有 IP 地址方案（可以是 `10.0.0.0`、`172.16.0.0`\
  \ 或 `192.168.0.0`），`NAT` 内部的所有主机可以在相同的子网方案上相互通信，或与主机或路由器通信，但它们**无法**通过路由器被公网访问。\n\
  \n当主机系统运行 `NAT` 设置时，该外部接口是来自 `NAT` 后方私有地址方案的虚拟机或容器的所有 `NAT` 生成流量的出口（egress）或跳板点。\n\
  \n这在容器中使用具有巨大优势：除了分配给主机系统的地址外，不需要任何外部地址，所有发送到该主机外的公共网络或互联网的流量都来自该外部地址，且没有外部迹象表明其来自\
  \ `NAT` 源。\n\n然而，`NAT` 知道流量是从内部源发送的，并在接收到任何发送请求的响应时，它会将该响应路由回源内部虚拟机或容器，而这一切不会将虚拟机或容器暴露在危险的外部网络或互联网中。\n\
  \n![Images](img/key_topic_icon.jpg)\n\n`NAT` 在外部 IP 地址昂贵或难以获取时特别有用，它帮助组织在 IP 管理上花费更少的资金，并将将更多精力花在完成实际工作上。\n\
  \n## Host Networking（主机网络）\n\n`host networking` 模式允许容器共享或寄生在主机系统的网络栈上。在这种情况下，容器没有自己的\
  \ IP 地址，而是共享主机的 IP 地址，流量通过网络驱动程序分离，以到达主机目的地或容器目的地。\n\n将主机网络想象成一条“共用线路”（Party Line），就像以前电话线由几个农村家庭或地点共享一样，所有人都有权访问该线路。\n\
  \n## Service Mesh（服务网格）\n\n`service mesh` 是一个复杂且多层的话题，几乎总是涉及 Kubernetes 或集群设置，需要安全性和可观测性以及一些耐心，因为服务网格有时难以安装、操作并从中获得价值。\n\
  \n此外，对于使用容器、Kubernetes、CI/CD 流水以及 IaC（基础设施即代码）领域向客户提供服务的顶级组织，通常需要服务网格。\n\n### 什么是服务网格？\n\
  \n使用现代应用程序为客户提供服务的世界主要由微服务组成，这些服务被收集成组以提供特定功能。现代应用程序（例如亚马逊或阿里巴巴购物网站）的编织可能涉及几十到数百个独立但至关重要的微服务，所有这些服务都需要进行管理、安全保护、故障观测、性能监控等。\n\
  \n这种对管理和安全叠加层的需求，以及组件服务不仅要与集群通信，还要**相互**通信的需求，带来了一个独特的挑战：如何在不影响应用程序/微服务性能的情况下管理所有这一切？\n\
  \n### Example Service Mesh（服务网格示例）\n\n![Images](img/key_topic_icon.jpg)\n\n最为人知的服务网格提供者是\
  \ Istio。`Istio` 产品是开源的，它叠加并注入到你的 Kubernetes（例如）集群中，将其组件插入到每个 `Pod` 的侧容器（sidecar）中，实际上变成了一个侧容器代理，但功能比简单的代理多得多。\n\
  \n`Istio` 在其网站上描述得很好，该项目在部署和运行时带来了以下优势：\n\n• 通过 `TLS` 加密、强有的身份验证和授权，实现集群内安全的服务间通信\n\
  • `HTTP`、`gRPC`、`WebSocket` 和 `TCP` 流量的自动负载均衡\n• 通过丰富的路由规则、重试、故障转移和故障注入对流量行为进行细粒度控制\n\
  • 支持访问控制、速率限制和配额策略层和配置 API\n• 集群内所有流量（包括集群入出口）的自动指标、日志和跟踪\n\n### Istio Components（Istio\
  \ 组件）\n\n`Istio` 由与 Kubernetes 类似的通用类型组件组成：控制平面和数据平面，但它被设计为覆盖并嵌入到 Kubernetes 之中，就像给士兵穿上外骨骼一样，使其更强大、拥有更多控制权并增加额外的功能。\n\
  \n### Commercial Istio Distributions（商业化 Istio 发行版）\n\n可能还有其他，但将 `Istio` 发行版作为商业可行产品基础的主要范是\
  \ `Aspen Service Mesh`，它最近被 `F5 Inc` 收购了。\n\n\n\n\nAspen Service Mesh 基于 Istio 开源项目代码，并添加了一些关键功能、支持、培训以及所有商用发行版和开源项目所具备的常规增强功能。\n\
  \n## 非 Istio 服务网格\nNGINX Service Mesh 产品是 Istio Service Mesh 的一个非常有趣的补充，因为它旨在执行与\
  \ Istio 非常相似的任务，但它是基于 `NGINX Plus`、`NGINX Ingress Controller` 以及插入在服务容器与集群其余部分的\
  \ `NGINX` 特有 sidecar 代理，这在概念上与 Istio 模型非常相似。\n\n## 引导 (Bootstrapping)\n几乎每种管理基础设施的方法都需要你首先安装一个工具。对于几个实例来说，这是可以管理的，但如果你需要启动并配置几十个、数百个甚至数千个具有多种配置的实例，该怎么办呢？\n\
  \n介绍一个名为 `cloud-init` 的方便小工具，它包含在大部分当前的 Linux 镜像中，准备好接收你的指令并让你的云镜像在启动时或启动后不久变得可用。\n\
  \n你可以将 `cloud-init` 视为一个脚本解释器（它实际上确实如此），而 `cloud-init` 脚本通常是从所谓的“用户数据”（userdata）传递给\
  \ `cloud-init` 脚本本身的，然后开始执行该组指令中包含的操作和配置。\n\n![Images](img/key_topic_icon.jpg)\n\
  \n你使用 YAML 编写 `cloud-init` 配置，因此非常易于阅读和排除故障。\n\n`cloud-init` 脚本可以做的事情令人印象深刻，例如：\n\
  \n- 将用户数据传递给系统\n- 设置用户和组\n- 设置本地语言和时区信息\n- 安装、更新、删除包等\n- 添加、更改或更新仓库\n- 配置加密（如 SSH\
  \ 和 CA 证书）\n- 配置任何可以使用命令行设置的客户端操作系统设置\n- 启动、重启、关机系统\n- 安装管理框架\n\n## 容器镜像仓库\n作为本章的最后一个主题，我们很好一下容器镜像仓库，因为除非你经常处理容器，否则很难理解它们。\n\
  \n### 什么是容器镜像仓库？\n容器镜像仓库主要有两种类型：公共和私有。\n\n![Images](img/key_topic_icon.jpg)\n\n\
  公共仓库通常用于用户社区，例如 Docker 容器镜像仓库，但那些可能有些混乱，而想要生成、策展和存储自己容器镜像的小型私有团队可能会考虑私有容器镜像仓库选项。\n\
  \n### 为什么要使用容器镜像仓库？\n简单来说，是为了让你的容器镜像有一个所谓的“单一事实来源”。想象一下，十几个开发者都有他们自己的本地文件夹，里面充满了实验性的、开发中的和生产的容器镜像；在你停止对这种想法感到发抖之后，想象一下有一个中心仓库，你将镜像发布到那里，它像源码版本控制系统那样维护它们，并且当你需要时，总能找到特定的镜像以及它所有的版本和修订。\n\
  \n此外，拥有仓库可以帮助解决容器镜像安全问题，修复出现的问题并发布更新版本，而这一切不需要多个电子表格、显示器上的便利签以及令人崩溃的困惑。\n\n### 更大的团队该怎么办？\n\
  容器镜像仓库可以根据你的需求进行扩展。将单个中央仓库复制以备份你的仓库是一种应用，但在你的每个全球区域都拥有一个本地且同步的容器仓库副本，也可以节省大量的时间和带宽。\n\
  \n### 我有哪些容器镜像仓库选项？\n你现在知道为什么选择选择私有仓库了，但有哪些免费或付费的选项可以帮助你实现这一点呢？\n\n评分最高的容器镜像仓库是：\n\
  \n- Amazon ECR – [`aws.amazon.com/ecr/`](http://aws.amazon.com/ecr/)\n- Microsoft\
  \ Azure Container Registry – [`azure.microsoft.com/en-us/services/container-registry`](http://azure.microsoft.com/en-us/services/container-registry)\n\
  - Docker Hub Container Registry – [`hub.docker.com/`](http://hub.docker.com/)\n\
  - Github Package Registry 现在支持容器 – [`github.blog/2020-09-01-introducing-github-container-registry/`](http://github.blog/2020-09-01-introducing-github-container-registry/)\n\
  - Google Artifact Registry – [`cloud.google.com/artifact-registry/`](https://cloud.google.com/artifact-registry/)\n\
  - Red Hat Quay Registry – [`quay.io/`](https://quay.io/)\n\n### 总结\n以上所有内容将让你对容器镜像仓库选项有一个很好的了解，并让你知道从哪里获取所需的所有信息，以做出能够满足你需求（无论大小、公共或私有）的明智选择！\n\
