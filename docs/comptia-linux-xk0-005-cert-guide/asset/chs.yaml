  \n**b.** 已禁用（Disabled）\n\n**c.** 未激活（Inactive）\n\n**d.** 空值（Null）\n\n**5.** 以下哪个命令可以设置或更改附加到文件或目录的文件系统属性？\n\
  \n**a.** auditdisplay\n\n**b.** SEperms\n\n**c.** cfgobject\n\n**d.** chattr\n\n\
  **6.** 作为系统管理员，你发现磁盘上发现一个文件，它不允许你删除、更改其权限、读取其内容或尝试的任何其他操作。以下哪个命令将允许你查看此文件的特殊设置？\n\
  \n**a.** displayattr\n\n**b.** vimattr\n\n**c.** lsattr\n\n**d.** cfgattr\n\n##\
