  **b. `dracut`**\n**c. `mkinitrd`**\n**d. `initramfs`**\n\n**3.** 你正在寻找代表系统运行进程的数字目录集，以下哪个目录最可能包含它们？\n\
  \n**a. `/sys`**\n**b. `/proc`**\n**c. `/run`**\n**d. `/tmp`**\n\n**4.** 你的服务器系统看起来良好，经常备份，且电源通过\
  \ UPS（不间断电源）提供，但在检查日志和系统运行时间后，你发现它每天至少重启一次。以下哪项最能描述正在发生的情况？\n\n**a. 计划更新**\n**b.\
  \ 安全性受损**\n**c. 内核崩溃 (Kernel panic)**\n**d. System of a Down**\n\n**5.** 以下哪项是使用源代码安装系统软件而不是软件包软件的优点？\n\
  \n**a. 软件更新方便**\n**b. 软件版本控制**\n**c. 兼容性更强**\n**d. 特殊配置控制**\n\n**6.** 有一组内存表，包含了从系统\
  \ BIOS 收集的信息，并允许进程和命令访问这些信息，而无需进行直接硬件查询。选择你最可能用于显示这些表的命令？\n\n**a. `dmidecode`**\n\
  **b. `lspci`**\n**c. `lsusb`**\n**d. `lsdev`**\n\n**7.** 哪种数据存储允许在非常详细的级别对文件进行更改、更新和修改，例如更新文件中的单个单词或多个页面？\n\
  \n**a. 块存储**\n**b. 对象存储**\n**c. 行存储**\n**d. 文件存储**\n\n\n\n\n\n# 在系统间复制对象\n\n# 文件编辑\n\
  \n本章涵盖的考试目标如下：\n\n**目标 1.2：** 给定场景，管理文件和目录\n\n在 Linux 系统中，文件和目录的管理非常重要，因为 Linux\
  \ 系统中的几乎每一项都是某种类型的文件，而目录是目录类型的文件。\n\n妥善管理这些对象包含许多方面，例如通过显示文件信息及其内容来进一步了解你正在管理的内容、创建、修改细节、编辑内容、确定文件类型，并通过显示比通常显示的更深的信息来获取洞察。\n\
  \n将编辑文件视为管理的一部分，这一概念并不像看起来那样奇怪，当你进行大量编辑工作时，你必须管理文件，而且很多时候必须意识到文件的创建、删除、转换，以及以不同于其当前存在的方式显示它们。\n\
  \n管理文件还包括将它们从一个系统复制或移动到另一个系统，通常不会丢失权限、所有权和其他关键细节等重要属性。\n\n通过了解压缩、解压缩和备份文件来管理，是一项可以让你成就或毁职业生涯的技能，取决于具体情况。文件中的数据可能是平庸的、几乎或没有价值的，也可能是具有极其重要的知识产权或国家机密的表达，而它们都位于低级的文本或格式化文件中。丢失重要数据至少会导致不便，最坏的情况下会导致收入损失、业务机会缺失，甚至导致改变生活的状况。\n\
  \n### “我已经掌握了吗？”测验\n\n“我已经掌握了吗？”测验可以让你评估自己应该阅读整个章节，还是直接跳转到“考试准备任务”部分进行复习。如果你有疑问，请阅读整个章节。`Table\
