  \ [此内容正在开发中。]\n\n此内容正在开发中。\n\n## 第 19 章 网络资源问题的分析与故障排除\n\n本章涵盖了以下主题：\n\n- 网络配置问题\n\
  - 防火墙问题\n- 接口错误\n- 带宽限制\n- 名称解析问题\n- 测试远程系统\n\n本章涵盖的考试目标如下：\n\n- **目标 4.2：** 给定场景，分析并故障排除网络资源问题\n\
  \n网络故障排除是任何系统专业人员生活的关键部分，如果你无法访问网络，或者某些错误阻止了你的系统正确解析名称，你的功能将受到严重限制。\n\n### “我已经掌握这些了吗？”测验\n\
  \n“我已经掌握这些了吗？”测验可以帮助你评估是应该阅读整个章节，还是简单地跳到“考试准备任务”部分进行复习。如果你有疑问，请阅读整个章节。表 19-1 概述了本章的主要标题和对应的“我已经掌握这些了吗？”测验问题。你可以在\
  \ 附录 A 中的“我已经掌握这些了吗？”测验和复习题答案”中找到答案。\n\n**表 19-1**——“我已经掌握这些了吗？”基础主题与问题映射\n\n![Images](img/19tab1.jpg)\n\
  \n#### 注意\n\n自评估的目的是衡量你对本章主题的掌握程度。如果你不知道某个问题的答案，或者只部分确定答案，在自评估时应将该问题标记为错误。为猜测的答案评分会扭曲你的自评估结果，并给你虚假的安全感。\n\
  \n1. 你正在尝试连接一个可以访问的远程主机，但遇到了错误或等待时间很长。最简单的故障排除方法是什么？\na. 查找你的 DNS\nb. 检查网络配置文件\n\
  c. 检查你的网太线是否连接\nd. 放弃吧\n\n2. 你在安全审计后不久尝试通过 ssh 连接到远程主机，但无法获取登录提示。可能是什么导致了禁止访问？\n\
  a. 主机防火墙规则\nb. 组织策略\nc. 无类域路由配置\nd. 主机的 VLAN 位置\n\n3. 你的办公室移动了，当你启动 Linux 桌面时，无法连接到网络，尽管你已经插好了以太线。推荐使用哪个命令显示\
  \ IP 地址信息？\na. `ifconfig`\nb. `netplan show`\nc. `sysconfig -v`\nd. `ip a`\n\n4.\
  \ 你正在测试服务器带宽使用，吞吐量似乎很慢。以下哪些命令可以控制带宽？（多选）\na. `tc`\nb. `ncat`\nc. `wondershaper`\n\
  d. `ipfw`\ne. `trickle`\n\n5. 花了大量时间开发网站后，你发现没有任何更新显示。你应该检查哪个文件以确保能看到生产站点？\na. `/etc/sysconfig/network`\n\
  b. `/etc/resolv.conf`\nc. `/etc/nsswitch.conf`\nd. `/etc/hosts`\n\n6. 以下哪些命令可以让你显示远程系统可用以及流量的路径？（二选）\n\
  a. `ifconfig`\nb. `ip`\nc. `netplan`\nd. `traceroute`\ne. `dig`\n\n### 基础主题\n\n\
  #### 网络配置问题\n\n在今天，有很多自动配置工具，大多数 Linux 发行版将引导你完成连接到以太网或 WiFi 的简单步骤。让我们从网络配置问题的最常见原因开始，我们将限制在作者完全提到的默认网关。\n\
  \n#### 原因与症状\n\n![Images](img/key_topic_icon.jpg)\n\n网络配置最可能的原因包括：\n- 子网问题\n- 路由问题\n\
  \n高延迟](#ch19.xhtml_key05）的症状包括：\n- 配置了 IP 地址，但无法看到网络上的其他主机\n- 能看到本地网络的主机，但无法访问本地网络之外的主机\n\
  \n#### 诊断与修复问题\n\n你可以使用多种工具查看网络配置的不同方面，但最常用的是 `ip`。`ip` 命令是一个多功能且完整的命令，具有许多功能，显示整体网络配置的可能是它最常用的功能。\n\
  \n#### 使用 `ip` 命令诊断子网\n\n`ip` 命令本身可以让你看到关于 IP 地址、子网和网关的大部分信息。例如，`ip` 命令也可以像 `ifconfig`\
  \ 命令一样显示网络配置。如果你执行 `ip addr show` 命令，输出如示例 19-1 所示。\n\n**示例 19-1**——`ip addr show`\
  \ 示例\n\n```\n$ ip addr show\n1: lo: <LOOPBACK,UP,LOWER_UP> mtu 6536 qdisc noqueue\
  \ state UNKNOWN\nlink/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\ninet 127.0.0.1/8\
  \ scope host\ninet6 ::1/128 scope host\nvalid_lft forever preferred_ft forever\n\
  2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc pfifo_fast state\nUP qlen\
  \ 1000\nlink/ether 08:00:27:08:ea:ff brd ff:ff:ff:ff:ff:ff\ninet 192.168.1.22/24\
  \ brd 192.168.1.255 scope global eth0\ninet6 fe80::a00:27ff:fe08:eaff/64 scope link\n\
  valid_lft forever preferred_ft forever\n```\n\n当 `ip` 命令显示其信息时，你必须解析输出以查看你需要的内容，因此我建议使用\
  \ `grep` 命令过滤输出以获取你想要的内容，其中 `grep` 被用于过滤 `inet` 单词，这会在示例 19-2 中显示输出。\n\n**示例 19-2**——`ip\
  \ addr show | grep \"inet\"` 示例\n\n```\n$ ip addr show | grep \"inet\"\ninet 192.168.1.22/24\
  \ brd 192.168.1.255 scope global eth0\ninet6 fe80::a00:27ff:fe08:eaff/64 scope link\n\
  ```\n\n在这种情况下，你寻找的是你的子网掩码（在此例为 /24，或 24 位长，即 255.255.255.0），这意味着你处于一个标准的 C 类网络，其中最后一个字节（8\
  \ 位）是主机主机所在的位置。\n\n\n\n\n\n在一个带有标准子网掩码的 C 类网络上，你有 254 个可能的的可访问主机。由于子网掩码为 `/24`，且被寻址的网络为\
  \ `192.168.1.0`， 255 个可用主机地址中的最后一个地址（`.255`）也被保留用于向子网上的所有主机进行广播。\n\n你可以从输出中看到，“brd”后面紧跟着之前提到的广播地址\
  \ `192.168.1.255`，最后我们在该行中能获取的最后一条信息是实际接口，在这里是 `eth0` 或第一个以太网接口。\n\n### 注意事项\n子网掩码真正的问题在于，你所处的实际子网与系统配置之间是否存在不匹配。如果你的系统最近移动过位置，或者可能手动分配了\
  \ IP 地址和其他网络配置，则应该检查这些内容。\n\n### 使用 `ping` 命令诊断路由\n\n接下来是你的流量将要经过的路由，这意味着不仅仅是在你的本地子网内（在本地子网内，你的系统可以广播并找到另一个主机进行通信）。\n\
  \n### 注意事项\n应该注意的是（看到我这么说的了吗？）如果你的子网掩码配置不当，你将尝试在错误的网络进行通信，这可能导致你的系统不知道如何离开当前网络，并引起路由问题。\n\
  \n当流量经过的路由是**另一个**子网时，它是最重要的，无论是本地路由器之后的下一个子网，还是跨越整个互联网。\n\n当你不确定系统是否具有正确的路由时，应该使用的第一个工具之一是查看你是否可以通过\
  \ `ping` 命令访问一个你非常确定存在且会做出响应的远程主机。\n\n我们在第 5 章 - 使用网络工具和配置文件中介绍过 `ping` 命令，它非常易用，以至于几乎每个与网络相关的故障排除过程都应该从一个简单的\
  \ `ping otherhost` 命令开始，只需确保你的网络是通的。\n\n你还可以使用 `ping` 命令来查看你**认为**的网络默认网关是否可访问，如果不可，可能存在网关问题。\n\
  \n### 使用 `ip route` 命令诊断路由\n\n另一个工具以及 `ip` 命令的另一个部分是路由对象，或者说是 `ip` 命令的子命令。（只需将其视为\
  \ `ip` 命令所作用的**对象**即可。）当你使用这个对象时，它专注于你 `ip` 命令中的路由部分，并向你显示从 `/proc` 和可能的 `/sys`\
  \ 树中提取的关于你的接口路由的信息。\n\n例如，在示例 19-2 中，你看到了带有本地接口和 `eth0` 接口的典型系统上 `ip route` 命令的输出。\n\
  \n**示例 19-2**–`ip route show` 输出示例\n\n```\n$ ip route show\ndefault via 192.168.64.1\
  \ dev enp0s2 proto dhcp src 192.168.64.2 metric 100\n192.168.64.0/24 dev enp0s2\
  \ proto kernel scope link src 192.168.64.2\n192.168.64.1 dev enp0s2 proto dhcp scope\
  \ link src 192.168.64.2 metric 100\n```\n\n我们在该输出中寻找的是构成一个配置正确的网络出口路由的项组合，从显示默认网关的第一行开始，标记为“default\
  \ via 192.168.64.1”。此行还显示了设备、协议、流量来源以及一个度量值（metric）。\n\n你可以说 `ip route show` 命令的输出比\
  \ `ip address show` 命令更完整，因为它聚焦于路由和网关地址，它甚至显示了本地主机的 IP 地址，即 `162.168.64.2` 地址！\n\
  \n### 使用 `traceroute` 命令诊断路由\n\n最后一个工具是 `traceroute`，这是一个古老且可靠的工具，但遗憾的是，由于其主要协议之一\
  \ `ICMP`（互联网控制消息报协议）被阻塞，它在广域网或互联网上的帮助已变得不那么大了。\n\n![图像](img/key_topic_icon.jpg)\n\
  \n`traceroute` 命令实际上向通往远程主机路径上发现的第一个以及随后的路由器发送一系列数据包，每次都报告该路由器，并构建一组路由，你可以利用这些路由来……嗯，追踪你的数据包必须经过的路径，以及该路由每个段的数量和计时。\n\
  \n部分由于 `traceroute` 在观察发生什么以及为你提供路由器和计时统计数据方面**非常有有用**，`ICMP` 在许多公共甚至许多私有网络中被禁用，因为有时它可以被用来获取过多的信息。\n\
  \n例如，如果我们从本地计算机到 [rossbrunson.com](http://rossbrunson.com) 主机执行 `traceroute`，你会看到类似于示例\
  \ 19-3 中的输出。\n\n**示例 19-3**–`traceroute rossbrunson.com` 输出示例\n\n```\n$ traceroute\
  \ rossbrunson.com\ntraceroute to rossbrunson.com (192.0.78.24), 30 hops max, 60\
  \ byte packets\n 1  _gateway (192.168.64.1)  0.161 ms  0.101 ms  0.092 ms\n 2  www.webgui.nokiawifi.com\
  \ (192.168.12.1)  2.544 ms  2.483 ms  2.422 ms\n 3  192.0.0.1 (192.0.0.1)  4.332\
  \ ms  4.248 ms  4.206 ms\n 4  * 192.0.0.1 (192.0.0.1)  62.602 ms *\n 5  192.0.0.1\
  \ (192.0.0.1)  84.482 ms  84.430 ms  84.381 ms\n 6  * * *\n 7  * * *\n 8  192.0.0.1\
  \ (192.0.0.1)  73.586 ms  80.029 ms  79.968 ms\n 9  10.170.233.133 (10.170.233.133)\
  \  71.639 ms  71.975 ms  73.179 ms\n10  10.164.176.237 (10.164.176.237)  68.158\
  \ ms  68.107 ms  79.140 ms\n11  six.automattic.net (206.81.81.70)  77.953 ms  69.818\
  \ ms  69.747 ms\n12  * * *\n```\n\n在示例 19-3 中，如果你看到一连串星号，那是某个路由器禁用了 `ICMP`，没有及时响应，或者受到了限制。\n\
  \n注意，你还可以配合 `traceroute` 命令使用 `-T` 或“使用 TCP SYN 探测”选项，这通常会在避免了许多受限的 `ICMP` 的情况下提供更短、更完整的输出。\n\
  \n\n\n\n\n# 可能会出什么错？\n\n这本身就可以写成一本书了，但即使在这样一个简单的场景下，也可能出现几个主要的故障。\n\n我们将继续沿用故障排除章节的通用格式，并在下一节中详细介绍这些问题，在讨论如何修复或避免它们之前进行阐述。\n\
  \n## 原因与症状\n\n![Images](img/key_topic_icon.jpg)\n\n防火墙问题有几种可能的原因，包括：\n\n• 服务未运行\n\
  • 监听的端口错误\n• 允许或拒绝流量的端口错误\n• 使用了非标准端口\n\n吞吐量低的症状可能包括：\n\n• 可以到达防火墙，但无法到达目标服务器\n\
  • 可以到达设备网络的网关，但无法到达该设备\n• 连接已建立，但结果不符合预期\n\n## 诊断和修复问题\n\n有几种工具可以让你直观地了解防火墙可能存在什么问题，它们包括：\n\
  \n• `ping` – 之前已经作为工具被反复描述过很多了，你将使用简单的 `ping` 来查看你是否可以到达远程目标主机、该网络上的另一个主机、防火墙、该网络上的网关、自己的网关等。\n\
  • `telnet` – `telnet` 命令大多已经过时了，你的 Linux 安装版可能根本没有它。它是一个很有用的工具，类似于用木棍戳戳乌龟是否在睡觉，任何响应都具有价值。\n\
  • `nmap` – `nmap` 命令对我们来说是一个新工具，我们将在本章的“测试远程系统”部分更详细地介绍 `nmap`。\n\n注意\n\n许多网络工具已经在[第\
  \ 05 章] - 使用网络工具和配置文件中涵盖了，因此我们把重点放在确保你了解服务是否正在正常运行，以及如何查看它们是否在远程上运行上。\n\n### 使用\
  \ `ping` 命令进行诊断\n\n你以前见过过 `ping` 命令，无论你在 Linux 和开源领域从事什么工作，知道如何使用它都是至关重要的。\n\n要确定一个主机是否接受连接或是否存活，最基本的方法是\
  \ ping 该设备，例如：\n\n```\n$ ping remotehost\n```\n\n同时还要考虑 [DNS（域名系统服务)] 可能会忙碌或故障，如果你知道远程主机的\
  \ IP 地址，请使用它。\n\n一旦主机做出响应，你就可以尝试更高级别的连接请求。如果主机没有响应，尝试同一网络上的另一个主机（如果你知道的话）。\n\n###\
  \ 使用 `telnet` 命令进行诊断\n\n永远不要再使用 `telnet` 进行实际的远程命令行会话了，它极度不安全，你真的应该将其作为一种快速且粗略的方法，用于显示对远程端口查询的响应。\n\
  \n对于任何包含任何重要数据的连接，请始终使用 Secure Shell (SSH) 工具套件，而不是 Telnet 和 R 系列工具套件。\n\n作为操作系统战争的老兵，我倾向于首先使用\
  \ `telnet` 命令来探测某个特定端口的系统，看看是否有响应（如果有的话）。例如，我想查看远程主机在 80 端口上是否配置了 Web 服务器，我可以直接使用\
  \ `curl` 命令来实现，但我可能只想看看该端口是否有响应，以及响应的内容。\n\n注意\n\n关于在此处使用像 telnet 这样过时几十年的工具（可能）令人困惑的用法，进一步一点：我们这样做是因为这样使用\
  \ `telnet` 命令就像向目标服务:端口中插入一根吸管，然后观察输出泄露到屏幕上的内容。它非常有参考价值，而且正**因为** `telnet` 命令是**如此**泄露且开放。\n\
  \n让我们用 `telnet` 命令探测远程系统，[图 19-2] 显示了我们 `telnet` 到 remotehost 系统的输出及其响应。\n\n![Description:\
  \ A computer screen shot of a computer program Description automatically generated](img/19fig02.jpg)\n\
  \n**图 19-2**–对远程系统执行 `telnet` 的输出\n\n执行了 `telnet` 命令，响应是第一个以“Escape character is...”结尾的块，在按下回车或任何字符并再按回车后，NGINX\
  \ 服务用 400 返回消息对无效或错误的请求做了响应。\n\n现在我知道那个主机上有一个开源版本的 NGINX，它在 80 端口监听，我接下来可能尝试尝试 443\
  \ 端口。\n\n### 确保服务正在运行\n\n这和防火墙有什么关系？我见过一些非常尴尬的时刻，当有人报告防火墙问题时，结果发现是“那个系统**没有**运行那个服务”的问题。\n\
  \n虽然另有介绍，`systemctl` 命令是确保服务正在运行、其通用配置以及发生的一些关键日志条目的最佳方法。\n\n[图 19-3] 显示了 `systemctl\
  \ status nginx` 命令的输出。\n\n![Description: A screen shot of a computer Description\
  \ automatically generated](img/19fig03.jpg)\n\n**图 19-3**–`systemctl status nginx`\
  \ 命令的输出\n\n如你所示，服务正在运行，接受连接，一切看起来都正常，但至少要查看日志文件以确保内容被正确读取和报告，例如之前的 `telnet` 命令及其产生的\
  \ 400 错误应该显示在[图 19-4]中。\n\n![Description: A black background with white text Description\
  \ automatically generated](img/19fig04.jpg)\n\n**图 19-4**–对 `/var/log/nginx/access.log`\
  \ 文件执行 `cat` 的输出\n\n所以，如你所见，服务正在运行，接受并拒绝连接，并正确地抛出错误。\n\n## 接口错误\n\n由于你的网络接口是你联系、通信以及通常体验任何其他计算机或资源的途径，因此理解这些接口可能出现的问题以及你能够做什么至关重要。\n\
  \n### 丢包与冲突\n\n当目标提到“丢包”（dropping packets）时，它们指的不是香烟，而是网络接口丢弃或丢失数据包的情况，这通常是某处网线损坏、防火墙配置为不转发这些数据包，甚至是网卡内存故障的指示。\n\
  \n冲突\n\n有几种工具可以让你直观地了解导致你丢包和遭遇冲突可能的问题，它们包括：\n\n• `ethtool` – `ethtool` 命令功能多变，它报告网络接口（物理和虚拟）的各种良好信息。它还可以用于设置许多参数并控制接口，但这超出了我们的范围。\n\
  • `netstat` – `netstat` 命令可以显示许多内容，包括内核接口表，它将显示系统上本地网络接口的细节。\n• `/sys/class/net/<device>/statistics`\
  \ – `/sys` 中的原始统计数据与 `ethtool` 命令输出显示的通用统计数据相同，仅有细微差异，而且该目录中的统计数据比 `ethtool -S`\
  \ 统计数据显示的**更多**。\n\n\n\n\n\n理解丢包 涉及大量内容，例如对以太网工作原理的了解、什么是数据包以及它们是如何发生冲突、被过滤的等。Linux+\
  \ 的目标非常喜欢问你关于子项目，而把这类工作的作者留着去填充那些棘手的内容。唉。\n\n### 使用 `ethtool` 命令进行诊断\n\n虽然你**可以**从\
  \ `/sys/class/net/device/statistics` 目录及其文件内容查看原始统计数据，但 `ethtool` 命令有一个非常有用且易于使用的统计选项，如图图\
  \ 19-5 所示，我们展示了 `ethtool -S` 命令的输出。\n\n![Description: 自动生成的计算机描述截图](img/19fig05.jpg)\n\
  \n**图 19-5**–`ethtool -S <interfacename>` 命令的输出\n\n可以使用 `ethtool` 命令查看网卡（网络接口卡）统计信息，如图\
  \ 19-5 所示，或者你可以使用 `grep` 命令对它们进行过滤，类似于示例 19-6 中所示。\n\n**示例 19-6**–`ethtool -S statistics\
  \ <device>` 输出示例\n\n```\n$ ethtool -S enp0s2 | grep -i 'drop'\nrx_queue_0_drops:\
  \ 0\nrx_queue_0_xdp_drops: 0\ntx_queue_0_xdp_tx_drops: 0\n```\n\n在示例 19-6 中你看到我们正在寻找包含文本\
  \ \"drop\" 的行，我们得到了 3 行，显示目前没有数据包被丢。\n\n### 使用 `netstat` 命令进行诊断\n\n你也可以运行 `netstat`\
  \ 命令来查找丢包和冲突，如示例 19-7 所示。\n\n**示例 19-7**–使用 `netstat -i` 查看内核接口表\n\n```\n$ netstat\
  \ -i\nKernel Interface table\nIface   MTU    RX-OK   RX-ERR RX-DRP RX-OVR  TX-OK\
  \  TX-ERR TX-DRP TX-OVR\nFlg\nenp0s2  1500   233716      0      0    0     80587\
  \    0      0      0\nBMRU\nlo      65536    5234      0      0      0      5234\
  \    0      0      0\nLRU0\n```\n\n内核接口表按接口向你展示了很多有用信息，其中 `lo` 接口是本地回，在示例 19-5 中，enp0s2\
  \ 等同于 Ubuntu 虚拟机上的 eth0。\n\n### 使用 `/sys/net/class/<device>/statistics` 信息进行诊断\n\
  \n有一组更细粒且更难读的信息可以供你查询丢包和冲突，它存在于 `/sys` 树结构中，深位于 `/sys/net/class/<device>/statistics`\
  \ 目录，它基本上是一组命名非常直观的文件，因此你基本上可以通过文件名知道你正在查看的是哪种统计数据。\n\n理解此目录结构的一种极方法是对该目录运行 `tree`\
  \ 命令，如我们在图 19-6 所示。\n\n![Description: 自动生成的程序描述截图](img/19fig06.jpg)\n\n**图 19-6**–对\
  \ `/sys/net/class/enp0s2` 目录运行 `tree` 命令的输出。\n\n寻找这些值的文档极其困难，你可能会认为既然它们如此重要，应该有一个现成的来源，乐意地解释你对每一项所想知道的一切。请原谅作者以一种具有历史视角的方式表达愤世，但这就是为什么作者整个职业生涯都在烦扰软件工程师。文档和解释虽然在软件开发者/工程师社区中存在，但并不如你希望的那样普遍（甚至远没有完整）。\n\
  \n要获取关于这些计数器的现有文档，请访问 [kernel.org](http://kernel.org) 上 `struct_rtnl_link_stats64`\
  \ 的文档页面，([`docs.kernel.org/networking/statistics.xhtml?highlight=tx_dropped#c.rtnl_link_stats64`](http://docs.kernel.org/networking/statistics.xhtml?highlight=tx_dropped#c.rtnl_link_stats64))\
  \ 并跟随链接进入 `sysfs-class-net-statistics` 页面 ([`www.kernel.org/doc/Documentation/ABI/testing/sysfs-class-net`](http://www.kernel.org/doc/Documentation/ABI/testing/sysfs-class-net))，获取更多关于这些计数器的略显晦涩的信息。\n\
  \n### 总结丢包问题\n\n检测丢包和冲突类似于淘金，大多数时候你会在这里那里发现几件小东西，但在你最没意料的时候，错误就会出现，并且发生得非常显而易见。\n\
  \n我建议在更换故障硬件和收集信息之外，尽量不要折腾你的网络，特别是不要使用 `ethtool` 命令，你可能会搞乱你的接口及其功能，运气好的话，甚至可能需要重新安装驱动程序。\n\
  \n#### 链路状态\n\n网络发生在多个层上，因此你想要知道如何检查这些各个层上的链路状态，如果网络设备或链路没有正常显示或显然没有正常工作，这对于确定问题所在位置非常有帮助。\n\
  \n#### 诊断并修复问题\n\n让我们逐层处理，从最低层开始向上，并在过程中指定工具。\n\n注意\n\n现在不太可能通过在网卡（网络接口卡）上找到闪烁或常绿的绿灯来判断网络一切良好，因为很多东西要么不是本地的，要么完全是虚拟的，所以我们不会先用老办法，而是直接采用高科技手段并保持。\n\
  \n##### 第 1 层 - 物理层\n\n在这一层，你基本上是在寻找电缆或导线是否存在。\n\n![Images](img/key_topic.jpg)\n\
  \n在这里发现工作正常的首要方法是使用 `ip` 命令及其 link。在示例 19-7 中，我们展示了 `ip link` 命令的输出。\n\n**示例 19-7**–`ip\
  \ link` 命令的输出\n\n```\n$ ip link\n1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue\
  \ state UNKNOWN mode DEFAULT group qlen1000\n    link/loopback 00:00:00:00:00:00\n\
  2: enp0s2: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc fq_codel state UP mode\
  \ DEFAULT group qlen1000\n    link/ether ca:3b:cc:0e:10:69 brd ff:ff:ff:ff:ff\n\
  ```\n\n这里的关键部分是查看非 lo 接口，在此例中为 enp0s2 (eth0 等效)，并查看 \"mode\" 前面是否有 \"UP\"，该接口确实有。\n\
  \n这种方法的另一种方法是使用 `ethtool` 命令来确定链路是否开启，如示例 19-8 所示。\n\n**示例 19-8**–`ethtool` 命令的输出\n\
  \n```\n$ ethtool enp0s2 | grep Link\nCannot get wake-on-lan settings: Operation\
  \ not permitted\n      Link detected: yes\n```\n\n在给定接口的 ethtool 输出中还可以看到其他设置，但我们寻找的是\
  \ Link 信息，因此使用了 grep 仅显示该部分。你可以安全地忽略 wake-on-lan 信息。\n\n##### 第 2 层 - 数据链路层\n\n\
  在这一层，我们不是寻找链路是否开启，而是查看该设备是否能看到网络上的其他设备，如果看不到，可能存在 VLAN（虚拟局域网）问题，或者它可能确实在自己的网络上。\n\
  \n无论如何，如果我们能看到它是否能通过 ARP（地址解析协议）找到邻居（基本上是在本地网络上大喊“你好？有人吗？”），这将有助于我们理解其他可能出现问题的地方。\n\
  \n重要的是查询 ARP 表，你可以使用简单的 `arp` 命令，或者使用 `ip neighbor show` 命令，如示例 19-9 所示。\n\n**示例\
  \ 19-9**–`ip neighbor show` 命令的输出\n\n```\n$ ip neighbor show\n192.168.64.1 dev enp0s2\
  \ lladdr 3e:22:fb:91:6a:64 REACHABLE\n```\n\n\n\n\n在此输出中，你将看到一个可以通过示例主机访问的主机，根据\
  \ IP 地址，它可能是一个网关，而在这种情况下它确实是。\n\n在示例 19-10 中，你会看到 `arp` 命令显示了类似的信息。\n\n**示例 19-10**–`arp`\
  \ 命令的输出\n\n```\n$ arp -a\n_gateway (192.168.64.1) at 3e:22:fb:91:6a:64 [ether] on\
  \ enp0s2\n```\n\n正如我们所料的，我们看到的是一个网关，通过 ARP 表和命令是众为人知的。你可以让它在 `Address` 列中显示 IP 地址而不是\
  \ _gateway_。\n\n### 注意事项\n\n请记住，链路状态的世界已经发生了变化，以前经常使用 `ifstatus` 命令，但现在大多数情况下`ip\
  \ link show`取代了该命令，它在许多发行版中默认甚至没有安装。\n\n### 带宽限制\n\n你计算环境的其他部分速度可能非常快，但如果你的带宽或访问计算世界其他部分的路径缓慢或有延迟，你的电脑看起来就像很慢一样。\n\
  \n#### 带宽与延迟\n\n![Images](img/key_topic_icon.jpg)\n\n带宽是指管道的速度，或者说你通过路由器、WiFi 或任何连接方式获取的速度。\n\
  \n延迟显然**可以**是这种速度的一部分，如果你从所在位置到上游提供者的连接非常慢，那会减慢一切。\n\n带宽和延迟的主要问题在于，后者可能会受到你无法控制的许多因素的影响或产生。\n\
  \n#### 诊断和修复问题\n\n延迟通常通过“感觉”来确定，或者是你收到的响应不符合你对话应该有多快或有多响应的预期。问问核心玩家他们的延迟（即“lag”）是否是一个因素，你会得到肯定的回答“是的！”\n\
  \n有几个工具可以让你对系统上的延迟问题有良好的了解，它们是：\n\n- `ping` – 前文描述过，使用 `ping` 命令查看一组简单的响应时间，任何两位数高位（80-99\
  \ ms）的数值都相当长，超过该数值的任何值都表示相当的延迟。主机的距离可能是此测量中的一个因素。\n- `traceroute` – 同样如前所述，使用 `traceroute`\
  \ 命令的输出可以显示延迟发生在哪里。\n- 带宽分析仪 – 有许多此类工具，最简单的是 Netflix 运行 [www.fast.com](http://www.fast.com)，它会给你一个快速的速度指示，但没有其他。这有点类似于查看车辆的速度表，并假设因为它**显示**了\
  \ 190 英里，所以你可以**跑**得那么快。另一个更有信息的工具是 [www.speedtest.net](http://www.speedtest.net)，它提供了更多指标，包括上传和下载速度，你通常可以选择一个远程服务器进行测试。\n\
  - `hping3` – 由 Antirez 创建，`hping3` 工具可以获取比 `ping` 命令更多的信息，以及其他有趣的功能，包括 IP 地址伪装和发送随机流量以作为测试主机的方法。\n\
  \n### 注意事项\n\n确定延迟及其与带宽的关系主要使用列出的工具来找到变慢或瓶颈点，并看看你是否可以缓解它。人们经常抱怨有延迟，而他们可能正处于咖啡馆这样的地方，周围的人正在进行各种视频操作以及下载\
  \ ISO 和电影文件等。你必须了解周围发生了什么，以便对问题所在做出良好的判断。\n\n### 域名解析问题\n\n主机和域名的解析是如此重要，以至于没有它，我们所知的互联网将无法真正实现。全球名称解析的集中化或分级组织是处理所有这些名称的一种非常好方法，虽然需要大量工作，但比不断手动更新与你需要访问的主机关联的所有名称要少得多。\n\
  \n#### DNS 三剑客\n\n我最喜欢的文件集是影响 DNS（域名系统服务）或你的系统上如何解析名称的文件。\n\n![Images](img/key_topic_icon.jpg)\n\
  \n我们在第 05 章- 使用网络工具和配置文件涵盖了这些文件：`/etc/hosts`、`/etc/resolv.conf` 和 `/etc/nsswitch.conf`\
  \ 文件，所以请在那里复习。\n\n实际上，如果你在排查名称解析问题，是因为你无法使用主机或域名到达你想去的地方\n\n#### 诊断和修复问题\n\n排查问题所在的过程可能仅如如下步骤：\n\
  \n**步骤 1.** 通过名称 ping 远程系统，即 [www.example.com](http://www.example.com)\n\n**步骤 2.**\
  \ 如果没有得到有效响应，尝试通过 IP 地址 ping 它，你可能没有这个地址，但它可能会在失败的名称 ping 中显示出来\n\n**步骤 3.** 如果不起作用，查看你的\
  \ `/etc/hosts` 文件，寻找那里是否存在不准确地尝试解析远程主机名称的条目\n\n**步骤 4.** 如果那里没有，显示 `/etc/resolv.conf`\
  \ 文件的内容并确保那些 DNS 服务器是有效的，可以通过 ping 访问，并会对 `dig` 命令做出响应\n\n**步骤 5.** 如果主机有响应，尝试查看是否存在与该主机名称对应的\
  \ A 记录，例如 [example.com](http://example.com) 上的 www 主机。\n\n可以通过像示例 19-11 中的 `dig`\
  \ 命令那样来实现。\n\n**示例 19-11**–`dig` 命令的输出\n\n```\n$ dig www example.com\n; <<>> DiG\
  \ 9.16.1-Ubuntu <<>> www example.com\n;; global options: +cmd\n;; Got answer:\n\
  ;; ->>HEADER<<- opcode: QUERY, status: SERVFAIL, id: 53331\n;; flags: qr rd ra;\
  \ QUERY: 1, ANSWER: 0, AUTHORITY: 0, ADDITIONAL: 1\n\n;; OPT PSEUDOSECTION:\n; EDNS:\
  \ version: 0, flags:; udp: 65494\n;; QUESTION SECTION:\n;www.                  \
  \         IN      A\n\n;; Query time: 0 msec\n;; SERVER: 127.0.0.53#53(127.0.0.53)\n\
  ;; WHEN: Thu Dec 29 17:33:31 MST 2022\n;; MSG SIZE  rcvd: 32\n\n;; Got answer:\n\
  ;; ->>HEADER<<- opcode: QUERY, status: NOERROR, id: 30864\n;; flags: qr rd ra; QUERY:\
  \ 1, ANSWER: 1, AUTHORITY: 0, ADDITIONAL: 1\n\n;; OPT PSEUDOSECTION:\n; EDNS: version:\
  \ 0, flags:; udp: 65494\n;; QUESTION SECTION:\n;example.com.                   IN\
  \      A\n\n;; ANSWER SECTION:\nexample.com.            3075    IN      A      \
  \ 93.184.216.34\n\n;; Query time: 0 msec\n;; SERVER: 127.0.0.53#53(127.0.0.53)\n\
  ;; WHEN: Thu Dec 29 17:33:31 MST 2022\n;; MSG SIZE  rcvd: 56\n```\n\n在示例 19-11 的输出中，我们请求了\
  \ example.com 域名或站点 www 主机的 A 或地址记录类型。`dig` 为我们提供了比真正需要的多多的信息，但输出中加粗的部分包含了我们查询的答案，即：在\
  \ example.com 域名下是否存在名为 www 的主机，以及它的 IP 地址是什么，主要是为了让我们可以直接 ping 它。\n\n### 注意事项\n\
  \n如果你不能通过名称 ping 本地网络上的主机，但可以 ping 远程主机，那么很可能是本地网络或 DNS 服务器问题，但请检查 `/etc/hosts`。如果你可以\
  \ ping 许多其他主机（本地和远程），但不能 ping 某一个，那就是该系统或其名称解析出了问题。\n\n### 测试远程系统\n\n测试（即“探测”）远程系统是陷入大麻烦的好方法，因为某些活动至少被认为是不恰的，最坏的情况下可能构成黑入或渗透远程系统的尝试。\n\
  \n#### 如何（不）违反法律\n\n特别是在使用 nmap 之前，检查当地法律是非常有建议的，网络上有大量资源警告你**不应该**如何使用 nmap 和其他工具来测试远程系统。\n\
  \n\n\n\n\n关键就在于：在测试你并非个人所拥有的系统之前，务必获得**书面**授权。仅此如此。\n\n你可以在 ISECOM 网站获取《开源安全测试方法手册》（OSSTMM）的副本，它包含了一个非常清晰的方法论，你可以遵循它以确保你没有在使用\
  \ `NMAP` 等探测工具时违反法律并对你自己或他人造成伤害。\n\nOSSTMM 站点：[`www.isecom.org/research.xhtml#content5-a0`](http://www.isecom.org/research.xhtml#content5-a0)\n\
  \n## 测试远程系统（为了什么？）\n\n你为什么想要测试远程系统？出于安全目的，这是当然。但除了你正在用于测试的系统之外，你还想对一个远程系统了解什么呢？\n\
  \n![Images](img/key_topic_icon.jpg)\n\n查询或测试远程系统的原因：\n\n• 网络拓扑\n• 端口状态发现\n• 幽灵或影子设备检测\n\
  • 操作系统清单\n• 服务发现\n• 漏洞清单\n\n## 使用 NMAP 测试远程系统\n\n在你自己的公司网络上，使用 `NMAP` 执行上述列出的任务是非常合理的，`NMAP`\
  \ 官方书中讨论并演示了其中每一项的许多示例，其在线版本可以在 `NMAP.org` 网站获取：[`nmap.org/book/toc.xhtml`](https://nmap.org/book/toc.xhtml)。\n\
  \n在你的系统上获取 `NMAP` 通常非常容易，大多数主流发行版和许多次要发行版的软件包仓库中都可以找到它。\n\n运行 `NMAP` 相当简单，至少在功能低端是如此；随着你不断扩展要求\
  \ `NMAP` 完成的任务，它的命令行操作可能会变得**极其**复杂。\n\n### 运行简单的系统扫描\n\n我拥有自己的网络，并在工作时可以访问更多资源，但我非常清楚，如果我在没有他们知情的情况下开始端口扫描，我很快就会与我的组织、甚至我用于将数据传输到工作网络的\
  \ ISP 产生产生纠葛。\n\n让我们在本地目标主机上运行一个简单的扫描，看看 `NMAP` 能告诉我们关于该主机的什么信息，你可能会对从所谓的安全的 Linux\
  \ 系统中获得如此多的信息而感到惊讶！我们对目标主机的扫描结果如 示例 19-12 所示。\n\n示例 19-12–目标主机的简单 nmap 扫描输出\n\n\
  ```\n$ nmap -v 192.168.64.2\nStarting Nmap 7.80 ( https://nmap.org ) at 2022-12-31\
  \ 19:04 MST\nInitiating Ping Scan at 19:04\nScanning localhost (127.0.0.1) [2 ports]\n\
  Completed Ping Scan at 19:04, 0.02s elapsed (1 total hosts)\nInitiating Connect\
  \ Scan at 19:04\nScanning localhost (127.0.0.1) [1000 ports]\nDiscovered open port\
  \ 80/tcp on 127.0.0.1\nDiscovered open port 22/tcp on 127.0.0.1\nCompleted Connect\
  \ Scan at 19:04, 0.15s elapsed (1000 total ports)\nNmap scan report for localhost\
  \ (127.0.0.1)\nHost is up (0.00073s latency).\nOther addresses for localhost (not\
  \ scanned): ::1\nNot shown: 998 closed ports\nPORT   STATE SERVICE\n22/tcp open\
  \  ssh\n80/tcp open  http\n\nRead data files from: /usr/bin/../share/nmap\nNmap\
  \ done: 1 IP address (1 host up) scanned in 0.24 seconds\n```\n\n在 示例 19-12 中，你可以看到我们扫描了目标主机，并在非常短的时间内从扫描的\
  \ 1000 个端口中发现了两个端口是开放的。\n\n我们发现端口 22 和 80 是开放的，因此 `SSH` 和 `HTTP` 允许该主机接收入站流量，这比我们通过简单的\
  \ ping 得到的要多。\n\n### 运行服务发现扫描\n\n现在我们有了几个显示为开放的端口，可以使用 `nmap` 及其稍微高级的扫描功能获取有关这些服务的更多信息。\n\
  \n我们对目标主机的扫描结果如 示例 19-13 所示。\n\n示例 19-13–对 localhost 的简单 nmap 扫描输出\n\n```\n$ nmap\
  \ -sV -p 22,80 192.168.64.2\nStarting Nmap 7.80 ( https://nmap.org ) at 2022-12-31\
  \ 19:18 MST\nNmap scan report for localhost (127.0.0.1)\nHost is up (0.0022s latency).\n\
  Other addresses for localhost (not scanned): ::1\n\nPORT   STATE SERVICE VERSION\n\
  22/tcp open  ssh  OpenSSH 8.2p1 Ubuntu 4ubuntu0.4(Ubuntu Linux; protocol\n2.0)\n\
  80/tcp open  http nginx 1.18.0 (Ubuntu)\nService Info: OS: Linux; CPE: cpe:/o:linux:linux_kernel\n\
  \nService detection performed. Please report any incorrect results at\nhttps://nmap.org/submit/\
  \ .\nNmap done: 1 IP address (1 host up) scanned in 6.99 seconds\n```\n\n在 示例 19-13\
  \ 的输出中，你现在可以看到关于每个端口上运行的服务的一些信息，以及版本号，这是非常有价值的信息，因为攻击者想要知道你运行的是哪个版本的 `OpenSSH` 或\
  \ `NGINX`，以防该特定版本存在可以被利用的漏洞。\n\n### 运行漏洞扫描\n\n噢，现在有趣开始了，既然我们知道目标主机有几个开放端口，并且已经识别了运行的服务，让我们完成本节关于\
  \ `NMAP` 的最后一项任务：对这些服务进行扫描并报告漏洞。\n\n我们对目标主机的漏洞扫描结果如 示例 19-14 所示。\n\n示例 19-14–目标主机的漏洞扫描输出\n\
  \n```\n$ nmap -P 80 -sV --script=vulners 192.168.64.2\nStarting Nmap 7.80 ( https://nmap.org\
  \ ) at 2022-12-31 19:53 MST\nNmap scan report for primary (192.168.64.2)\nHost is\
  \ up (0.0090s latency).\nNot shown: 998 closed ports\nPORT   STATE SERVICE VERSION\n\
  22/tcp open  ssh     OpenSSH 8.2p1 Ubuntu 4ubuntu0.4 (Ubuntu Linux;\nprotocol 2.0)\n\
  | vulners:\n|   cpe:/a:openbsd:openssh:8.2p1:\n|       CVE-2020-15778    6.8   https://vulners.com/cve/CVE-2020-15778\n\
  |       C94132FD-1FA5-5342-BEE-0DAF45EE3    6.8   https://vulners.com/cve/C94132FD-1FA5-\n\
  5342-BEE-0DAF45EE3\n|       CVE-2020-12062    5.0   https://vulners.com/cve/CVE-2020-12062\n\
  |       CVE-2021-28041    4.6   https://vulners.com/cve/CVE-2021-28041\n|      \
  \ CVE-2021-41661    4.6   https://vulners.com/cve/CVE-2021-41661\nService Info:\
  \ OS: Linux; CPE: cpe:/o:linux:linux_kernel\n\nService detection performed. Please\
  \ report any incorrect results at\nhttps://nmap.org/submit/ .\nNmap done: 1 IP address\
  \ (1 host up) scanned in 0.24 seconds\n```\n\n漏洞扫描的棒之处在于，它不仅会显示漏洞存在，还会提供链接让你去查看需要修复的内容！\n\
  \n希望你能看到 NMAP 是一个多么强大的工具，即使只是对单个目标主机进行标准端口、关联服务以及当然，任何可能针对这些端口和服务的攻击进行扫描。\n\n##\
  \ 使用 s_client 测试远程系统\n\n\n\n\n\n`s_client` (#ch19.xhtml_key11-a) 模块将执行大量的测试和连接功能，其中第一个功能可能是确认远程系统**拥有**\
  \ SSL 证书，然后查看该证书的内容。\n\n针对远程系统运行简单的验证查询如 示例 19-13 所示。\n\n**示例 19-13**–对 [example.com](http://example.com)\
  \ 进行 `s_client` 验证的输出\n\n```\n$ openssl s_client -verify_return_error -connect example.com:443\n\
