  \n**a. `/home/newusers`**\n**b. `/etc/default/useradd`**\n**c. `/etc/skel`**\n**d.\
  \ `/usr/baredir`**\n\n**4.** 在现代 Linux 系统上，哪个文件存储用户账户密码？\n\n**a. `/etc/passwd`**\n\
  **b. `/etc/security`**\n**c. `/etc/shausers`**\n**d. `/etc/shadow`**\n\n## 基础知识\n\
  \n### 账户创建与删除\n\n注意\n\n作者描述和演示这组信息已经工作大约 30 年了，无论 Linux+ 目标中的项目顺序如何，我将按照我自己的逻辑和顺序来进行，我发现这种方式非常好且易于理解。希望您喜欢我处理这些主题的方式。\n\
  \n### 用户账户基础\n\n内核并不通过人类使用和看到的名称识别用户和组账户，而是通过与名称关联的用户 ID（`UID`）和组 ID（`GID`）。内核的早期版本支持两个静态数字表，可以表示多达\
  \ 65,536 个用户和 65,536 个组。然后，2.6 内核提供了 4,294,967,296 个可能的的用户和组。\n\n用户名与 UID 之间唯一的关联是\
  \ `/etc/passwd`](ch09.xhtml_key12-a) 文件中定义用户的目。组名与 GID 之间唯一的关联是 `/etc/group`](ch09.xhtml_key14-a)\
  \ 文件中定义组的目。\n\n用户必须在 `/etc/passwd` 文件中有用户名目才能登录系统。用户无法使用 UID 登录；仅接受用户名。\n\n### 账户分别是什么？\n\
  \n`/etc/passwd` 文件包含许多系统账户，所有账户都被分配了从 0 到 499 的 UID。这里显示了一些最有趣的账户（也可能出现在 Linux+\
  \ 考试中）：\n\n![Images](img/key_topic_icon.jpg)\n\n• **0:** 系统的 root 用户。\n• **1:**\
  \ bin 用户，负责某些二进制执行文件和非登录账户。\n• **48:** apache 用户；HTTPD 守护进程以 apache 身份运行。\n• **99:**\
  \ nobody 账户，用于许多情况。它主要用于 FTP 和 HTTP 服务器上的匿名访问，它还映射到尝试对配置为拒绝 root 用户访问的共享进行 NFS 访问的\
  \ root 账户。\n\n注意\n\n我通常将初级系统管理员和服务器操作员账户的 UID 分在 500–1000 范围内，以便与其他用户区分来并便于跟踪。UID\
  \ 在 500–1000 范围内的用户不会自动获得特殊权限。然而，这些是我通过 `sudo` 命令设置的具有额外访问权限的账户。\n\n#### 普通用户账户\n\
  \n典型用户被分配 500 到 65,000 之间的 UID。这对于单一系统没有问题，但在较大的环境中可能会导致问题。\n\n如果您需要允许本地用户账户和网络账户（用于使用\
  \ NFS 和 NIS），最好的做法是为网络账户分配从五位数 UID 开始的 UID——即从 10,000 到 65,000 的 UID——并为本地用户账户分配从\
  \ 500 到 9,999 的 UID。这种方案为您的 UID 编号系统提供了更多结构性。\n\n\n\n\n\n如果你正在处理一个同时具有网络账户和本地账户的系统，显示用户账户信息可能会很复杂。本地用户账户数据存储在本地文件中，例如\
  \ `/etc/passwd` 和 `/etc/shadow` 文件。网络账户信息存储在服务器上的数据库中。可以使用 `getent` 命令按如下方式运行，以在本地和网络源中搜索账户信息：\n\
  \n```\n# getent passwd ross\n```\n\n该命令会在本地和网络源中进行搜索，搜索顺序由 `/etc/nsswitch.conf`\
  \ 文件决定，如下所示（示例）所示：\n\n```\npasswd: files nis\nshadow: files nis\n```\n\n`files nis`\
  \ 意味着“首先搜索本地文件，然后从数据库查找指定的值”。\n\n## /etc/passwd 中的用户项\n\n![Images](img/key_topic_icon.jpg)\n\
  \n`/etc/passwd` 文件中的用户项包含以下内容：\n\n```\nross:x:500:100:Ross Brunson:/home/ross:/bin/bash\n\
  ```\n\n`/etc/passwd` 文件中的条目如下：\n\n- **ross：** 用户名；长度必须为八个字符或更少，且应使用小写。\n- **x：**\
  \ 密码以前存储在此文件中。值 `x` 告诉系统，此账户的密码现在存储在 `/etc/shadow` 文件中。出于安全考虑，在现代 Linux 系统上，密码永远不应该\
  \ `/etc/passwd` 文件中。\n- **500：** 用户的 UID。\n- **100：** 用户的*主组*。该组被用此用户账户创建的所有文件对象的组所有，但在设置了所有权继承的情况下外。\n\
  - **Ross Brunson：** 该字段是一个描述字段（出于历史原因，也称为 *GE 通用操作系统*，或 *GECOS*）。它可以是空的，也可以包含注释或全名。\n\
  - **/home/ross：** 主目录字段，用于定义指向用户主目录的完整路径。\n- **/bin/bash：** 该字段定义了用户的登录 shell。\n\
  \n### 备注\n\nGECOS 字段通常仅用于简单的注释。然而，在历史上，它曾用于指定更复杂的数据，包括用户姓名、办公室位置和电话号码等有用信息。这些信息（以及其他用户信息）可以通过\
  \ `finger` 命令显示。\n\n## 特殊登录文件\n\n几个文件影响用户的登录体验，并定义了用户可以何时以及从何处登录。这些文件如下：\n\n- **/bin/false：**\
  \ 如果用户的 shell 设置为 `/bin/false`，用户无法登录。这最适用于不应该被登录的系统账户。\n- **/sbin/nologin：** 当作为用户账户的登录\
  \ shell 时，该程序会显示一条账户不可用的消息并以非零退出码退出。如果存在 `/etc/nologin.txt` 文件，则显示该内容而不是标准消息。\n\
  - **/etc/motd：** 成功登录后，在执行用户 shell 之前会显示 `/etc/motd` 文件的内容。这是显示警告和法律信息的好地方。\n- **hushlogin：**\
  \ 如果在用户主目录下创建了此文件，将更改登录过程，使其不执行邮件检查，不向用户显示上次登录信息或当日公告（msg）。\n- **/etc/login.defs：**\
  \ 该文件定义了使用 `useradd` 命令创建用户时的默认值。这些默认值包括邮件、密码复杂性和限制、UID 和 GID 的最小和最大值，以及默认是否创建用户主目录。\n\
  - **/etc/securetty：** 该文件指定了允许 root 用户从何处登录。如果不存在，root 可以从任何位置登录。\n- **/etc/usertty：**\
  \ 该文件用于设置登录位置、日期、时间和用户可以连接的系统的参数。`/etc/usertty` 文件仅用于没有 *PAM*（*可插认证模块*）的系统。\n\n\
  注意关于列出的文件的 Linux+ 考试题。问题倾向于关注文件存在时会发生什么、它是否被分配为登录 shell，以及用户登录系统时屏幕上会显示什么。\n\n###\
  \ 备注\n\n现代 Linux 系统利用了一种名为 PAMs（可插认证模块）的功能。PAM 是一组丰富的模块，为管理员在授予用户访问系统的方式方面提供了极大的灵活性。虽然\
  \ PAM 未包含在 Linux+ 考试目标中，但你应该考虑探索这一实用的功能。通过执行命令 `man pam` 开始学习 PAM。\n\n#### pam_tally2\
  \ 和 faillock\n\nPAM（可插认证模块）的主题在第 8 章《理解 Linux 安全最佳实践》中有详细介绍。`pam_tally2` 和 `faillock`\
  \ 主题是 PAM 讨论的一部分。\n\n## 组账户\n\n![Images](img/key_topic_icon.jpg)\n\n组是用户的分组。在 Linux\
  \ 或 Unix 中无法进行组嵌套。用户通过两种方法与组关联：\n\n- **主组：** GID 出现在 `/etc/passwd` 文件条目的第四字段中；该组成为此用户创建的所有对象（文件、目录等）的组所有。用户的主组是特殊的；如果用户在\
  \ `/etc/passwd` 文件中被分配了主组，则不需要列为 `/etc/group` 文件中的成员，因为 `/etc/passwd` 条目中的 GID 补充了\
  \ `/etc/group` 文件中定义的要组成员关系。\n- **要组成：** 如果用户名出现在 `/etc/group` 的组条目中，则用户是该组的成员，并可以访问该组作为所有者的对象。`/etc/group`\
  \ 文件每个条目的最后一个字段存储了要组成员列表。\n\n组也被分配数字，用户账户一样。组被称为 GID（组 ID）。一些重要的 GID：\n\n- **0：**\
  \ root 组。此组的任何成员都可以访问限制为 root 账户的资源。\n- **1：** bin 组，类似于 bin 用户。\n- **100：** users\
  \ 组，你可以将普通用户放在其中，然后通过将所有用户都应该访问的资源分配给该组来赋予权限。\n\n### 备注\n\n在与 BSD 相关的系统上（记得 BSD\
  \ 是 Unix 的变体），除非用户的账户是 wheel 组的成员，否则无法使用 `su` 命令，即使她知道 root 密码。这种 wheel 组功能在 Linux\
  \ 系统上默认未，但该组为了兼容性而存在。许多管理员在 Linux 上使用 wheel 组来创建一种“管理员组”，并通过 `sudo` 命令提供命令的特殊访问。\n\
  \n在基于 Red Hat 的系统中，主要存在一种特殊情况：创建用户账户时没有分配特定的主组。在这种情况下，系统会创建并分配一个组，其 GID 应该与用户的 UID\
  \ 匹配（如果该 GID 不可用，将使用下一个可用的递增数字），且组名应与用户账户相同。这种组被称为*用户私有组*（*UPG*）。\n\nUPG 是一项安全功能。如果你创建了一个用户但没有将其分配到主组，系统可能会将其分配到\
  \ users 组作为主组。这是一个安全风险，因为该用户可能是承包商或审计员，默认情况下不应访问 users 组的资源。\n\n然而，UPG 也会导致安全问题。如果用户是该私有组的唯一成员，该用户很难与其他共享文件对象。用户被迫与所有人共享文件（others\
  \ 权限设置），才能与另一个人共享文件。\n\n基于 Debian 的系统不使用 UPG，而是默认将新账户分配到 users (100) 组。\n\n\n\n\n\
  在现实中，这两个系统都存在安全问题。最佳解决方案是为需要共享文件的人创建组，并将适当的用户放在正确的组中。这种方法虽然需要管理员投入工作，但能带来更好的安全性。\n\
  \n## /etc/group 中的组条目\n\n`/etc/group` 文件中的条目比 `/etc/passwd` 文件中的条目简单且短得多。组文件由以下字段组成：\n\
  \n```\nusers:x:100:ross,snuffy\n```\n\n组文件中的条目如下：\n\n- `users`：组名，应为八个字符更少且全小写。\n\
  - `x`：就像用户密码一样，组密码存储在单独的文件。组密码位于 `/etc/gshadow` 中。（注意，虽然理解这个文件很有用，但它不是 Linux+ 考试目标，书中不再对其进行进一步讨论。）\n\
  - `GID`：这是系统分配该组的数字，为了方便用户查看，它会被解析（翻译）为组名。\n- `ross,snuffy`：组中的用户依次列出，用逗号 (,) 分隔；不应出现空格。此列表定义了次要组（附加组）成员关系。\n\
  \n## 组密码\n\n用户只能有一个主组；如果用户需要创建一个必须分配给另一个组的对象，可以使用 `chgrp` 命令。对于单个文件来说，这很容易，但如果用户想要创建一组属于不同组的文件，这种技术就会变得非常繁琐。\n\
  \n另一个选项是用户可以使用 `newgrp` 命令临时更改其主组。例如：\n\n```\n# newgrp users\n```\n\n`newgrp` 命令不会修改\
  \ `/etc/passwd` 文件或 `/etc/group` 文件；它会打开一个具有不同主组的新 shell。默认情况下，用户可以使用 `newgrp` 命令临时将其主组临时更改为其所属的任何组。在创建完必要的文件后，用户可以通过执行\
  \ `exit` 命令返回到具有默认主组的 shell。请记住，用户只能切换到他们作为次要成员的组。\n\n可以使用 `gpasswd` 命令为组分配密码，但每个组仅有一个有一个密码，且你必须将该密码提供给每个需要使用此功能的的用户。一旦为组分配了密码，即使用户是该组的成员，也需要使用密码来执行\
  \ `newgrp` 命令。\n\n## 添加用户和组\n\n虽然你可以直接编辑 `/etc/passwd` 和 `/etc/group` 文件，但如果这些文件中出现错误，可能会导致严重问题。使用后续章节描述的命令要安全得多。\n\
  \n### 使用 useradd 添加用户\n\n`useradd` 命令用于创建新用户账户。要添加具有默认值（默认主 GID、默认主目录等）的用户，执行以下命令：\n\
  \n```\n# useradd snuffy\n```\n\n目前，在 Red Hat 机器上，此命令执行了几项操作，包括：\n\n- 创建用户 `snuffy`，并分配下一个可用的\
  \ UID（通常是 UID 500 之上的下一个可用 UID）。\n- 创建一个与用户名和 UID 相同的组名和 GID 的组。\n- 将用户的主 GID 设置为新创建的组。\n\
  - 在 `/home` 目录下为用户创建一个主目录，并与用户名相同（在此例中 `/home/snuffy`）。\n- 将 `/etc/skel` 目录的内容复制到新用户的主目录中，并将复制的文件和目录的所有权赋予给新用户。\n\
  \n目前，在 Debian 机器上，`useradd snuffy` 命令创建具有下一个可用 UID 的用户 `snuffy`，并将 GID 设置为用户组 (100)；不会创建主目录。\n\
  \n要在 Debian 系统上设置指定主目录的用户，必须指定 `-m` 和 `-d` 选项。要将 `/etc/skel` 目录的内容复制到用户主目录，使用 `-k`\
  \ 选项。要指定主组，使用 `-g` 选项。`-u` 选项可指定新用户的 UID。注意，这些选项在 Red Hat 系统上也可以，但通常为了使用默认值而省略它们。例如：\n\
  \n```\n# useradd -m -d /home/snuffy -k /etc/skel -g 100 -u 1025 snuffy\n```\n\n\
  这创建了带有所有指定信息的用户。在 Red Hat 机器上，会自动提供 `/bin/bash` shell，而在 Debian 机器上，默认 shell 是空的，导致系统假设使用\
  \ `/bin/sh` shell（它是 `/bin/bash` 的符号链接）。在两个系统中，都可以使用 `-s` 选项定义此值。\n\n其他重要的 `useradd`\
  \ 选项如下：\n\n- `-D`：带有此选项执行 `useradd` 命令将显示在 `/etc/default/useradd` 文件中默认值。此选项也可用于修改默认值。\n\
  - `-e`：此选项为账户设置过期日期；在该日期之后，账户将被禁用。\n- `-G`：此选项在创建账户时设置次要组成员，这通常在创建账户后通过 `usermod`\
  \ 命令完成。\n- `-f`：这是密码达到其最大寿命后，用户仍可以登录的天数（如果用户在登录过程中更改密码）。设置密码的最大和最小值值将在本章稍后讨论。\n\
  - `-o`：允许创建具有非唯一 UID 的用户。此选项非常危险，不建议使用。\n- `-s`：用户登录 shell 的完整路径和文件名必须遵循 `-s` 选项。\n\
  \n### useradd 默认值\n\n在基于 Red Hat 的系统中，`useradd` 的默认值定义在 `/etc/default/useradd` 文件中，可以使用\
  \ `useradd` 命令的 `-D` 选项进行修改。\n\n#### 默认 Shell\n\n例如，要将默认 shell 从 `/bin/bash` 更改为\
  \ `/bin/tcsh`，执行以下命令：\n\n```\n# useradd -D -s /bin/tcsh\n```\n\n基于 Debian 的系统也使用此文件。例如，在\
  \ Debian 上添加用户时，执行 `useradd -D -g 10` 命令会将默认组设置为为 wheel 组（GID 为 10）。\n\n#### skel\
  \ 模板\n\n当使用 `useradd` 命令并配合 `-m` 和 `-d` 选项时，会为用户创建一个主目录。默认情况下，新主目录是 `/etc/skel`\
  \ 目录及其内容的副本。\n\n例如，`useradd -m -d /home/snuffy snuffy` 创建目录 `/home/snuffy`。该主目录默认从\
  \ `/etc/skel` 目录复制，并将所有权更改为匹配新用户（如示例 9-1 所示）。\n\n**示例 9-1–使用 /etc/skel**\n\n```\n\
  [root@server1 ~]# ls -la /etc/skel\ntotal 24\ndrwxr-xr-x. 3 root root 74 May 9 18:15\
  \ .\ndrwxr-xr-x. 154 root root 8192 May 28 20:18 ..\n-rw-r--r--. 1 root root 18\
  \ Mar 5 14:06 .bash_logout\n-rw-r--r--. 1 root root 193 Mar 5 14:06 .bash_profile\n\
  -rw-r--r--. 1 root root 231 Mar 5 14:06 .bashrc\ndrwxr-xr-x. 4 root root 37 May\
  \ 9 18:15 .mozilla\n[root@server1 ~]# useradd snuffy\n[root@server1 ~]# ls -la /home/snuffy\n\
  total 12\ndrwx------. 3 snuffy snuffy 74 May 28 21:25 .\ndrwxr-xr-x. 4 root root\
  \ 30 May 28 21:25 ..\n-rw-r--r--. 1 snuffy snuffy 18 Mar 5 14:06 .bash_logout\n\
  -rw-r--r--. 1 snuffy snuffy 193 Mar 5 14:06 .bash_profile\n-rw-r--r--. 1 snuffy\
  \ snuffy 231 Mar 5 14:06 .bashrc\ndrwxr-xr-x. 4 snuffy snuffy 37 May 9 18:15 .mozilla\n\
  ```\n\n通过在 `/etc/skel` 目录中放置文件或目录，你可以在新用户的主目录中放入任何内容。更优雅的方法是创建一组 `/etc/skel_*XXX***\
  \ 目录，以便更方便地创建某些组的用户。例如，为了财务部门的用户设置特殊的主目录结构，你可能会使用以下步骤：\n\n\n\n\n\n### 步骤 1\n将 `/etc/skel`\
  \ 目录复制到名为 `/etc/skel_payroll_staff` 的新目录。\n\n### 步骤 2\n向 `/etc/skel_payroll_staff`\
  \ 添加你希望薪资部门用户拥有的文件和目录。\n\n### 步骤 3\n下次创建薪资部门的用户时，使用以下语法指定正确的 `skel` 模板目录：\n\n```\n\
  # useradd -k /etc/skel_payroll_staff bob\n```\n\n## 使用 groupadd 添加组\n`groupadd`\
  \ 命令比 `useradd` 命令简单得多，选项更少，命令行也更短。要使用默认值创建一个名为 `somegroup` 的新组，请输入以下命令：\n\n```bash\n\
  # groupadd somegroup\n```\n\n此命令创建一个组，其 GID 是通过使用 500 以上“下一个可用”数字确定的。结果在 `/etc/group`\
  \ 文件中应该如下所示的条目：\n\n```\nsomegroup:x:516:\n```\n\n注意，组中没有添加任何用户；最后一个字段是空的。下一节将讨论的\
  \ `usermod` 命令用于将用户添加到现有组中。\n\n要添加具有特定 GID 的组，请执行如下命令：\n\n```bash\n# groupadd -g\
  \ 1492 somegroup\n```\n\n## 修改用户和组\n创建用户和组是一回事，但让它们适应不断变化的系统环境是另一回事。通常，你会从辅助组中添加或删除用户，锁定和解锁账户，甚至偶尔更改密码过期时间。\n\
  \n### 使用 usermod 修改用户账户\n要使用 `usermod` 命令修改用户账户，你需要决定需要哪些选项：\n\n- `-c`: 描述用户；这会修改\
  \ `/etc/passwd` 文件中的 GECOS 字段。\n- `-d`: 更改用户的新主目录。如果该新主目录中有文件，你还需要更改这些文件的用户所有者。\n\
  - `-e`: 更改用户账户过期并禁用的日期。\n- `-f`: 更改活动天数。当用户账户因超过最大密码有效期而被锁定时，用户可以获得一个宽限期，只要在登录过程中更改密码，就可以继续登录。（这将在本章节稍后的“密码老化”部分中进一步讨论。）\n\
  - `-g`: 更改用户的初始组；可以指定 GID 或组名。警告：这将更改用户具有访问的文件对象。\n- `-G`: 更改用户的辅助组。这是一个单一值或由逗号分隔的组列表，用户将成为这些组的辅助成员。重要提示：务必包含所有组，包括用户已经作为辅助成员所属的组。此命令用提供的\
  \ `-G` 选项参数替换替换所有辅助组成员关系。\n- `-s`: 更改用户登录 shell 的路径。\n- `-u`: 更改用户的 UID。警告：虽然这会更改用户主目录中文件的\
  \ UID 所有权以匹配新 UID，但系统上的其他文件将不会自动更改！\n- `-L`: 通过修改 `/etc/shadow` 文件并在当前加密密码前加感叹号\
  \ (! ) 来锁定用户账户。\n- `-U`: 通过删除 `/etc/shadow` 文件中加密密码前的感叹号 (! ) 来移除对用户账户的锁定。\n\n注意\n\
  另一种锁定和解锁用户账户的方法是使用 `passwd` 命令及其 `-l` 和 `-u` 选项来完成锁定和解锁。\n\n### 使用 groupmod 修改组\n\
  `groupmod` 命令的选项比 `usermod` 命令少，使用此命令的理由也很少。它主要用于更改组的名称和 GID。要修改组的 GID，请执行以下命令：\n\
  \n```bash\n# groupmod -g 101 users\n```\n\n在更改组的 GID 之前请三思，因为这样做可能会导致许多重要文件变成“孤儿文件”。记住：文件和目录并不属于用户名和组名，而是属于\
  \ UID 和 GID。如果你修改了组的 GID，那么以前属于该 GID 的文件现在将不再与该组名关联，如示例 9-2 所示。\n\n示例 9-2–更改 GID\n\
  ```\n[root@server1 tmp]# ls -l sample\n-rw-r--r--. 1 root test 0 May 28 20:17 sample\n\
  [root@server1 tmp]# grep test /etc/group\ntest:x:1001:\n[root@server1 tmp]# groupmod\
  \ -g 2000 test\n[root@server1 tmp]# grep test /etc/group\ntest:x:2000:\n[root@server1\
  \ tmp]# ls -l sample\n-rw-r--r--. 1 root 1001 0 May 28 20:17 sample\n```\n\n你还应该查看\
  \ `/etc/passwd` 文件，查看在更改组时哪些用户的初始组会受到影响。不要尝试更改当前有登录用户的组的 GID。最后，请注意，在某些系统中，如果你删除或孤立了用户的主组，用户将默认成为\
  \ staff (50) 组的成员。\n\n## 删除用户和组\n删除用户和组并不困难，但有些选项需要注意。从系统中删除账户不像 Windows 那样使用唯一且难以重新创建的\
  \ SID。Linux 账户很容易重新创建（除非你删除了用户的主目录，那只能从备份中恢复）。记住 Linux 使用静态 UID 和 GID 表，而不是 SID。\n\
  \n### 删除用户\n如果一个用户离开了公司，你面临两种选择：删除用户账户并在系统上保留用户的主目录（可能是为了其继任者），或者通过一步删除其账户和主目录来清理系统中的用户。\n\
  \n在不影响其主目录的情况下删除用户可以通过执行以下命令实现：\n\n```bash\n# userdel snuffy\n```\n\n要删除用户同其主目录（在\
  \ `/etc/passwd` 条目中配置的），请执行以下命令：\n\n```bash\n# userdel -r snuffy\n```\n\n注意\n记住\
  \ `userdel -r` 命令也会删除用户的邮件文件。然而，系统上属于此用户的其他文件将不会删除。这些文件将仅由用户的 UID 所有，而不是名称。此外，如果你创建一个与旧用户\
  \ UID 相同的新用户，则新用户将成为这些文件的所有者。\n\n你不能删除当前登录的用户，因此你必须找出他仍然登录的原因。在某些 Linux 系统上，如果用户已登录且你尝试删除该账户，你会收到类似下所示的错误消息：\n\
  \n```bash\n# userdel: user snuffy is currently used by process 17098\n```\n\n如果你没有收到此类消息，可以执行\
  \ `ps` 命令来确定登录 shell 的 PID。在杀死此用户的登录 shell 之前，使用 `usermod -L` 命令锁定账户；然后使用 `kill\
  \ -9 PID` 将用户注销出系统。例如，要注销 tim 用户并删除账户，请执行以下命令：\n\n```bash\n# usermod -L snuffy\n\
  # kill -9 17098\n# userdel -r\n```\n\n你不应该仅仅删除用户主目录的一个原而是，通常该目录中存在重要文件或重要证据（可能是用户不当行为的证据）。如果你计划替换该用户，请考虑保留目录并仅删除用户账户。这将使主目录及其内容在原用户名的位置只显示一个\
  \ UID：\n\n```\ndrwxr-sr-x 2 1002 staff 4096 Mar 18 07:17 snuffy\n```\n\n\n\n看到这种情况实际上并不是坏事，因为它向你提供了一个视觉提示：拥有该主目录的用户已被删除。然而，由于该主目录仍然属于\
  \ UID `1002`，且旧用户的登录名被设置为目录名，你拥有重新创建该用户或设置新用户所需的一切。例如，以下示例使用 `snuffy` 的旧主目录来创建新的\
  \ `sarah` 账户：\n\n```\n# mv /home/snuffy /home/snuffy\n# useradd -u 1002 -d /home/snuffy\
  \ snuffy\n```\n\n## 删除组\n\n在删除组之前，请考虑检查以下内容：\n\n- 确认该组没有次级成员。\n- 确认该组不是某个用户账户的主组。\n\
  - 使用 `find` 命令找到所有属于该组的文件。找到所有文件后，将所有这些文件的组所有权更改另一个组。\n\n要删除组，请输入以下命令：\n\n```bash\n\
  # groupdel grpname\n```\n\n### 注意事项\n\nLinux+ 考试中的大多数问题集中在 `useradd`、`usermod` 和\
  \ `userdel` 命令上。关于组命令的提问并不多，但在填空题中可能会出现几个问题，仅为了测试你是否留了心。\n\n## 影子套件 (Shadow Suite)\n\
  \nLinux 机器安全方面的一个重要部分是 `Shadow Suite`。影子套件是一组身份验证工具和实用程序，它们渗透到 `/etc/passwd` 文件和用户账户之中。如果不使用影子工具，你的加密密码将暴露给任何想查看它们的人，因为它们将位于所有人可读的\
  \ `/etc/passwd` 文件的第 2 字段。影子套件还提供了密码老化属性，这些属性如果没有该套件是不存在的。所有这些都是通过将这些数据存储在另一个文件中实现的：`/etc/shadow`\
  \ 文件。\n\n### 加密密码与影子字段\n\n以下是一个未使用影子套件的系统上 `/etc/passwd` 文件条目的示例：\n\n```\nsnuffy:$1$vEEOvj1b$GlzLuD9F..DjlQr/WXcJv1:501:10::/home/snu\n\
  ffy:/bin/sh\n```\n\n你可以看到，第二个字段中了一个加密字符串。遗憾的是，所有用户都可以查看此文件，这构成了潜在的安全风险。在下一个示例中，显示了启用了影子套件的系统的\
  \ `/etc/passwd` 条目；注意加密字符串被替换为了一个 x：\n\n```\nsnuffy:x:501:10::/home/snuffy:/bin/sh\n\
  ```\n\n当安装了影子套件时，系统将用户账户的加密密码存储在 `/etc/shadow` 文件中，将组账户存储在 `/etc/gshadow` 文件中。etc/shadow`\
  \ 文件中的字段包含用户的账户密码和密码老化信息。以下是影子文件条目的示例：\n\n```\nsnuffy:$1$vEEOvj1b$GlzLuD9F..DjlQr/WXcJv1:16263:0:99999:7:3\n\
  0:17000:\n```\n\n![Images](img/key_topic_icon.jpg)\n\n`/etc/shadow` 文件中的字段是：\n\n\
  - `snuffy:` 登录名：用户的登录名。\n- `$1$vEEOvj1b$GlzLuD9F..DjlQr/WXcJv1:` 密码：用户的加密密码。\n-\
  \ `16263`: 最后更改：自 1970 年 1 月 1 日以来最后一次更改密码后经过的天数。\n- `0`: 最小：更改密码前必须经过的天数。（0 实际上始终允许立即更改。）\n\
  - `99999`: 最大：密码必须更改前的最大天数。（99999 实际上禁用了更改密码的需要，因为这超过了 273 年。）\n- `7`: 警告：在由于 `Maximum`\
  \ 字段导致密码过期前的几天内，用户将收到警告。\n- `30`: 不活跃：由于 `Maximum` 字段导致账户过期后的若干天数内，如果用户在登录期间更改了密码，他们仍可以登录。\n\
  - `17000`: 过期日期：从 1970 年 1 月 1 日到账户过期之日的天数。\n\n### 注意事项\n\n文件中的最后一个字段留作备以后使用，不属于测试范围，也没有被广泛讨论。\n\
  \n`/etc/shadow` 文件的某些字段具有棘手性。考虑以下情况：\n\n```\njulia:$1$vEEOvj1b$GlzLuD9F..DjlQr/WXcJv1:16263:5:90:7:30::\n\
  ```\n\n`julia` 账户没有过期日期（`Expiration` 字段为空）；然而，该用户需要每 90 天更改一次密码（`Maximum` 字段为 90）。在\
  \ 90 天结束前的 7 天，用户登录时将收到警告（`Warning` 字段为 7）。如果她不理会警告，她的账户将在第 91 天被锁定。在账户锁定后，她仍然可以登录长达\
  \ 30 天（`Inactive` 字段为 30），前提是她在登录过程中创建了一个新密码。最后，在更改密码后，她在至少 5 天内不能再次更改密码（`Minimum`\
  \ 字段为 5）；这是为了防止她直接切换回原始密码。\n\n### 注意事项\n\n影子套件提供的密码老化功能远非完美。可插身份验证模块（PAMs）提供了更丰富、更强大的密码老化功能。\n\
  \n### 影子文件权限\n\n`/etc/shadow` 文件的权限非常重要，可能会出现在 Linux+ 考试中。因为 `/etc/shadow` 文件不是所有人可读的，且只有系统更新它，所以你的密码比没有安装\
  \ `shadow` 时安全得多。\n\n`/etc/shadow` 文件的权限在 Linux+ 考试中重点突出，`/etc/passwd` 文件的权限也是如此。以下是\
  \ Red Hat 和 Debian 的文件权限列表：\n\n```\n/etc/passwd”\nRed Hat = -rw-r--r-- (644)\nDebian\
  \ = -rw-r--r-- (644)\n/etc/shadow”\nRed Hat = -r-------- (400)\nDebian = rw-r-----\
  \ (640)\n```\n\n如前所述，这些文件及其权限出现在 Linux+ 考试中。请记住 Red Hat 的权限设置比 Debian 更严格。\n\n###\
  \ 注意事项\n\n注意你各种测试系统中影子文件的安全权限。你会发现微小但重要的差异。某些系统使用 `-------`，而某些系统使用 `r------`；确保记录每个系统使用的是什么。`/etc/passwd`\
  \ 文件基本上是任何人都可以开放并读取的，即使不是系统中的用户也可以。重要且私密的加密密码在 `/etc/shadow` 文件中。之前提到的 `/etc/gshadow`\
  \ 文件也是影子套件的一部分。然而，该文件未列在 Linux+ 考试目标中。\n\n## 修改密码\n\n用户的密码通常在创建账户时最初设置为 root 用户易于记住的值，然后告诉用户立即更改密码。\n\
  \n要更改 root 密码，当你以 root 用户身份登录时执行以下命令：\n\n```bash\n# passwd\n```\n\n系统会提示你输入两次密码以进行验证。如果你是以普通用户身份执行此命令，则在接受新密码之前需要用户当前的密码。此措施是为了防止在你离开系统时，有人快速尝试更改密码的情况。\n\
  \n如果你正在更改另一个用户的密码（例如 `snuffy` 用户的密码），在你以 root 用户身份登录时执行以下命令：\n\n```bash\n# passwd\
  \ snuffy\n```\n\n### 注意事项\n\n在更改密码时，记住你是以什么身份登录以及你在命令行上输入了什么内容非常重要。我见过很多系统管理员因为太匆忙而改了自己的密码而不是用户的密码！\n\
  \n### 密码老化\n\n用户的密码需要频繁更改，以便让攻击者没有足够的时间猜中密码。大多数用户只想上班、领工资然后回家；系统安全对他们来说远没有便利性重要。\n\
  \n要正确地老化密码，请使用 `chage` 命令。`chage` 命令的语法为：\n\n```\nchage -option value username\n\
  ```\n\n该命令作用于 `/etc/shadow` 文件中的字段，并具有以下选项：\n\n\n\n\n\n- `-m`: 修改最小值，或者用户在更改密码后必须等待多长时间才能再次更改。\n\
  - `-M`: 修改最大值，即用户在更改密码前允许的最大天数。\n- `-d`: 修改最后更改值，即自 1970 年 1 月 1 日以来密码最后一次更改的天数。此值很少直接修改；当使用\
  \ `passwd` 命令更改密码时，该值会自动更新。\n- `-E`: 修改到期值，即自 1970 年 1 月 1 日以来计算的天数，代表用户账户被禁用的日期。使用的格式为\
  \ `YYYY-MM-DD`。\n- `-I`: 修改非活动值，或者账户达到最大限制后，账户被锁定前的非活动（未登录）天数，此时需要 root 用户的干预才能重新启用账户。将此值设置为\
  \ 0 可禁用此功能。\n- `-W`: 修改警告值，或者用户必须更改密码前的警告天数。此警告仅在用户登录系统时提供。\n\n幸运的是，你不需要记忆这些值，除非是为了为了应对潜在的\
  \ Linux+ 考试题。只需以 root 用户身份执行 `chage username` 命令，系统就会交互式地提示你为指定用户配置每个值。\n\n用户可以使用\
  \ `-l` 选项查看自己的信息，或者 root 用户可以使用此选项查看另一个用户的信息：\n\n```\n# chage -l snuffy\n```\n\n\
  这将产生以下输出：\n\n```\nMinimum: 0\nMaximum: 99999\nWarning: 7\nInactive: -1\nLast Change:\
  \ Mar 19, 2023\nPassword Expires: Never\nPassword Inactive: Never\nAccount Expires:\
  \ Never\n```\n\n`passwd` 实用程序包含之前的选项，例如：\n- `-d`: 通过移除密码禁用用户账户。\n- `-n`: 设置密码最小生存期（单位为天）。\n\
  - `-x`: 设置密码最大生存期（单位为天）。\n- `-w`: 设置密码前的警告天数。\n- `-i`: 设置密码过期的账户在被锁定前允许非活动的天数。\n\
  - `-S`: 显示用户密码信息，例如使用了什么加密方式以及是否设置了密码。\n\n### 用户变量\n\n可以对用户账户设置某些限制。如果你想让用户无法创建特定大小的对象或使用过多的系统资源，可以为该用户配置\
  \ `ulimit` 设置。`ulimit` 命令接受许多选项，包括：\n- `-c`: 限制核心文件（转储文件）的大小。\n- `-d`: 限制用户进程数据的大小。\n\
  - `-f`: 限制 shell 中创建的文件的最大大小。\n- `-n`: 限制允许打开的文件描述符或文件的数量。\n- `-t`: 限制允许用户使用的 CPU\
  \ 时间（以秒为单位）。\n- `-u`: 限制给定用户可以运行进程数量。\n- `-v`: 限制 shell 可用的虚拟内存上限。\n\n要检查用户的 `ulimit`\
  \ 设置，使用此命令：\n\n```\n# ulimit -a\n```\n\n#### 注意\n记住，要使这些限制永久生效，需要编辑用户的配置文件之一（`.bashrc`\
  \ 或 `.profile`）或系统级配置文件（`/etc/bashrc` 或 `/etc/profile`）。\n\n### 登录 shell 会话\n\n\
  ![Images](img/key_topic_icon.jpg)\n\n登录 shell（login shell）是在登录系统时执行的 shell。换句话说，登录\
  \ shell 是用户要么直接接触物理系统并以用户身份正常登录，要么通过网络登录并获得构成用户环境的文件内容的全部益处的 shell。\n\n`/etc/profile`\
  \ 脚本是全局配置文件，如果用户使用 BASH shell，它会影响所有用户的环境。每当用户执行登录 shell 操作时，该文件都会被加载（读取）。该文件是一个脚本，在用户配置脚本之前执行。此之后，`/etc/profile.d`\
  \ 中的任何文件都会被加载。\n\n用户的 `~/.bash_profile` 脚本如果存在，将是下一个被加载的脚本。该文件包含直接影响该用户且仅影响该用户环境的变量、代码和设置。如果不存在\
  \ `.bash_profile`，shell 会查找 `.bash_login` 或 `.profile`并在找到匹配项时停止。\n\n`.bash_profile`\
  \ 脚本（如果找到备替代脚本）会加载 `.bashrc`。注意，这不是 shell 的原生行为；而是一种让以后操作更方便的惯例。\n\n当用户注销时，shell\
  \ 会加载 `.bash_logout` 文件。该文件用于执行 `clear` 命令，因此在用户注销后，任何之前的命令文本都不会留在用户的屏幕上。它还可以清理可能作为会话一部分启动的任何内容。\n\
  \n在 Linux+ 考试中，关于登录 shell 会话的问题要小心。许多考者没有将 `.bash_logout` 文件视为用户登录会话的一部分。这绝对是考试\
  \ shell 部分最容易漏掉的元素之一。\n\n以下用户登录会话的示例：\n第 1 步：用户使用用户名和密码登录。\n第 2 步：加载 `/etc/profile`。\n\
  第 3 步：加载 `/etc/profile.d` 下的文件。\n第 4 步：加载用户的 `~/.bash_profile`。\n第 5 步：在 `~/.bash_profile`\
  \ 内部加载用户的 `~/.bashrc`。\n第 6 步：用户进行业务。\n第 7 步：用户通过 `logout` 或 `exit` 命令或按 `Ctrl+D`\
  \ 注销。\n加载用户的 `.bash_logout` 脚本。\n\n### 非登录 shell 会话\n\n![Images](img/key_topic_icon.jpg)\n\
  \n*非登录 shell*（non-login shell）会话通常是 root 用户使用 `su` 命令临时变为另一个用户，或者管理员使用 `su` 变成 root\
  \ 用户而不而不加载 root 或或其他用户的完整环境。非登录 shell 也通过在图形会话中打开新终端来启动。\n\n#### 注意\n`su` 命令创建一个非登录\
  \ shell。如果你需要登录 shell，请在 `su` 命令后加一个连字符（例如 `su - sean`）。\n\n当用户执行非登录会话时，唯一加载的文件是目标账户的\
  \ `~/.bashrc` 文件。（在 Red Hat 机器上，`~/.bashrc` 文件中的第一个动作是如果存在则加载 `/etc/bashrc` 文件。其他发行版运行不同的文件。）\n\
  \n退出该 shell 后，不会加载任何注销文件或脚本；此外，源账户的脚本不会再次运行。\n\n### 用户身份查询选项\n\nLinux 系统经常出现的一个有趣问题是：知道你是以哪个用户账户登录的，或者你当前拥有哪些有效权限和权利，因为你可以轻松地通过\
  \ `su` 命令切换到 root 或其他用户，并在 `sudo` 命令的帮助下有效地以半 root 用户身份操作。\n\n#### 确定你是谁\n\n`id`\
  \ 命令是确定你是谁以及你当前的 UID 和 GID 的一个非常有用的工具。它也可以用于脚本，以确保用户处于正确的安全上下文中。\n\n运行 `id` 命令产生以下输出：\n\
  \n```\n# id\nuid=1000(rossb) gid=1000(rossb) groups=1000(rossb),4(adm),\n24(cdrom),27(sudo),30(dip),46(plugdev),115(lpadmin),\n\
  128(sambashare)\n```\n\n如你所示，显示了 UID、主 GID 以及该用户所属的其他组。\n\n#### 我是谁？\n\n两个命令以字符\
  \ *who* 开头，它们有不同的存在理由。\n\n\n\n\n\n`who` 命令告诉你的信息不仅仅是你是谁；正如例例所示，它还会告诉你系统上还有哪些用户，无论是在本地控制台上，还是在伪终端上（即从其他地方通过\
  \ ssh 登录），它不仅包含用户名，还包含用户登录/来源的端口以及登录时间：\n\n```\n# who\nrossb    tty7         2022-03-17\
  \ 06:02 (:0)\nrossb    pts/4        2022-03-30 07:33 (127.0.0.1)\n```\n\n在输出输出中，你可以看到用户\
  \ `ross` 正在本地登录到 `tty7`，这表示它是按下 `Ctrl+F7` 并登录后从控制台开启的 shell 会话，或者更有可能是在 Linux 桌面\
  \ GUI 内部的终端应用程序（此处正是如此）。\n\n输出的第二行是同一个用户从另一个系统通过 ssh 登录，通过 `pts/*X` 伪终端连接类型可以判断出来。用户来源的另一个指示是括号中的表示法，第一行输出显示\
  \ `:0`（即图形显示器 0），第二行输出中的 `127.0.0.1` 显示该用户是从本地（localhost）连接的。\n\n### 我到底是谁？\n\n\
  `whoami` 命令一定是由一位沮丧的系统操作员创建的，为了服务那些根本记不住自己是谁以及身在何处的用户。输入 `whoami` 会产生最简单的输出：用户的当前用户名。这个命令没有任何变得变得花哨或可爱的；它唯一的选项是打印命令版本或一个非常简单的帮助页面。\n\
  \n### W，不，不是酒店\n\n![Images](img/key_topic_icon.jpg)\n\n将非常简单干净的 `whoami` 命令与更复杂的\
  \ w 命令进行对比，后者的输出显示了几个有用的信息：\n\n```\n$ w\n09:33:07 up 1 day, 18:10, 2 users,    \
  \ load average:  0.00, 0.00, 0.00\nUSER    TTY    FROM            LOGIN@   IDLE\
  \   JCPU  PCPU WHAT\nrossb   tty7    :0             17Mar19 15days  1:16  0.59s\
  \ mate-session\nrossb   pts/5  127.0.0.1       09:32   19.00s  0.03s  0.03s -bash\n\
  ```\n\n`w` 命令向你显示当前时间、以天和小时为单位运行时间、登录人数以及过去 1、5 和 15 分钟的系统负载。\n\n最重要的是，`w` 命令还向你显示了各种用户正在运行命令或应用程序。虽然如果用户使用\
  \ X 终端或图形应用程序，这没什么帮助，但你可以确切地看到他们在命令行上运行了什么。例如，示例中的用户显然在寻找整个系统中所有的电子表格文件——这至少是有点可疑的，最坏的情况下是试图寻找定价或工资信息：\n\
  \n```\n# watch -n 15 w\nEvery 15.0s: w          brunsonix: Mon Apr  1 09:42:20 2022\n\
  \n 09:42:20 up 1 day,18:19,2 users,  load average: 0.06, 0.06, 0.02\nUSER    TTY\
  \    FROM      LOGIN@   IDLE   JCPU   PCPU WHAT\nrossb   tty7   :0        17Mar19\
  \ 15days  1:21    0.59s mate-session\nrossb   pts/5  127.0.0.1 09:32   20.00s  0.03s\
  \  0.03s find / -iname\n“*.xls”\n```\n\n因此，如果你想监控谁通过控制台访问了你的系统并监控他们在运行什么，请使用合理的时间间隔（如\
  \ 30 秒）执行 `watch` 命令，并在你可以方便参考的控制台中运行 `w` 命令。\n\n### 最后但同样，只是最后\n\n![Images](img/key_topic_icon.jpg)\n\
  \n`last` 命令读取 `/var/run/wtmp` 文件并显示谁登录了系统、从哪里来以及登录了多久。`last` 命令显示与其他查询命令选择相似的信息；它没有显示任何特别新的东西，只是以不同的方式查看了某些相同的信息。\n\
  \n### 总结\n\n在本章中，你学习了账户，包括用户账户和组账户，以及服务账户的概念及其作用。你现在知道如何添加、删除、修改用户和组账户，以及如何判断哪个用户已登录以及关于用户的其他细节。\n\
  \n你还学习了如何使用报告登录和连接用户的工具来监控系统，如何配置用户环境以获得最佳效果，以及如何放置希望放在所有新用户账户家目录中的文件和目录。\n\n###\
