  **b.** `-x`\n**c.** `-z`\n**d.** 答案都不正确。\n\n## 基础主题\n\n工作和管理容器可能是一个复杂的话题，因此，与其试图让你视觉化这一切可能意味着什么，我们将从我最喜欢的演示之一开始一直到结束，在此过程中涵盖所有主题。这样会更具启发性，流程也更顺。在写本文时，如果你使用我这里的命令和镜像，它们应该对你运行得良好！\n\
  \n注意\n\n正如我们在许多章节中所做的那样，我们将按照自己的顺序，并以我们偏好的方式强调最重要的项目，无需担心 Linux+ 目标中它们的排序或分组。\n\n\
  ## 容器管理\n\n现在我们已经运行本地无根（root-less）容器场景，管理容器变得更加重要，这让开发者和系统工程师更容易测试更改，而无需将其某些云实例。\n\
  \n### 安装并验证容器工具\n\n你首先需要知道如何安装所需的容器工具。\n\n#### 安装 container-tools 包及其依赖项\n\n你可以从一个简单的干净安装开始，例如\
  \ Red Hat Enterprise Linux，为了安装容器工具，你将使用：\n\n```\n# sudo yum module install container-tools\n\
  ```\n\n安装过程将询问你是否想要安装容器工具以及大量的依赖项，因此回答 `y` 表示是并允许安装完成。\n\n图 14-1 显示了此过程的结束以及你回答是对应的查询。\n\
  \n![描述：一张包含自动生成的图形用户界面描述图片](img/14fig01.jpg)\n\n**图 14-1**–安装容器工具包\n\n#### 验证 Podman\
  \ 和 Skopeo 工具安装\n\n你可以通过检查输出来验证 podman 和 skopeo 工具是否已安装，输出应该与你在图 14-2 中看到的相似。\n\n\
  ![图像](img/14fig02.jpg)\n\n**图 14-2**–验证 container-tools 包的安装\n\n然而，与阅读所有输出相比，此操作简单的方法是使用命令查看它们是否在路径中找到：\n\
  \n```\n# which podman skopeo\n/usr/bin/podman\n/usr/bin/skopeo\n```\n\n### 查找并拉取容器镜像\n\
  \n容器中的一切都源自镜像，因此我们必须先找到一些镜像来工作。\n\n#### 寻找合适的镜像\n\n接下来我们将寻找一个适用于我们目的的镜像，考虑到仓库中可能的镜像数量，这可能有点困难。\n\
  \n使用命令搜索 RHEL 8 的 UBI 或 Universal Basic Images：\n\n```\n# podman search registry.access.redhat.com/ubi8\
  \ | wc -l\n26\n```\n\n我们没有用所有 26 个镜像的列表让你感到无聊，只是让 `wc` 命令对它们进行了计数。由于 26 个仍然是非常多可以选择的镜像，让我们让变得简单些，通过以下命令进一步关注我们的输出：\n\
  \n```\n# podman search registry.access.redhat.com | grep -i latest\n```\n\n这将显示可用的“最新发布”镜像列表，其中也可能包含之前的和随后的版本，例如\
  \ RHEL 7 和 RHEL 9，类似于图 14-3 中所示：\n\n![图像](img/14fig03.jpg)\n\n**图 14-3**–寻找最新的 UBI\
  \ 镜像\n\n你可以看到最新的通用镜像简单标记为 `/ubi`，我们将在演示中使用它。\n\n要查看关于 `/ubi` 镜像的更多信息，你应该使用 `skopeo`\
  \ 命令。一个良好的容器镜像中包含大量信息，因此我们将 `skopeo` 的输出管道到 `grep` 命令，使用上下文参数（`-A 1`）仅显示描述行，你将在图\
  \ 14-4 中看到结果：\n\n```\n# skopeo inspect docker://registry.access.redhat.com/ubi8/ubi\n\
  | grep -i -A 1 \"description\"\n```\n\n![图像](img/14fig04.jpg)\n\n**图 14-4**–显示容器镜像描述\n\
  \n#### 拉取镜像\n\n![图像](img/key_topic_icon.jpg)\n\n接下来我们将使用 `podman pull` 命令从仓库中拉取镜像：\n\
  \n```\n# podman pull registry.access.redhat.com/ubi8/ubi\nTrying to pull registry.access.redhat.com/ubi8/ubi...\n\
  Checking if registry.access.redhat.com/ubi8/ubi supports signatures\nCopying blob\
  \ registry.access.redhat.com/ubi8/ubi\nWriting manifest to registry.access.redhat.com/ubi8/ubi\n\
  ubi\n```\n\n\n\n\n唯一发生变化的视觉指示是提示符（prompt）会变为某个指示你当前所在的 shell 提示符的主机的内容，例如：\n\n```\n\
  [root@ 35c54f588bbc /]#\n```\n\n你可以通过运行 `ls` 命令并查看主目录下的文件，或者通过以下命令检查主机发行信息来验证你是否处于不同的主机上：\n\
  \n```\n[root@ 35c54f588bbc /]# cat /etc/redhat-release\nRed Hat Enterprise Linux\
  \ release 8.6 (Ootpa)\n```\n\n### 分配容器友好名称\n\n在创建实例时，指定你想要的友好名称（friendly name），可以将该名称与容器\
  \ ID（Container ID）关联：\n\n```\n# podman run -it --name OpenContainer 2fd9e1478809\n\
  [root@ 35c54f588bbc /]#\n```\n\n你也可以非常轻松地重命名容器，只需使用 `rename` 命令代替 `name` 命令即可：\n\
  \n```\n# podman run rename OpenContainer ClosedContainer\n```\n\n### 离析和附加到容器\n\n\
  如果你使用 `-it` 选项运行容器以便在 shell 提示符中直接访问它，那么当你输入 `exit` 命令退出容器时，容器也会随之退出（QUITS），这可能会让你感到惊讶！\n\
  \n![Images](img/key_topic_icon.jpg)\n\n要从正在附加的运行容器中分离（detach），需要连续按下以下按键：\n\n```\n\
  Ctrl-p Ctrl-q\n```\n\n这将你从容器中分离并让其保持运行。你可以使用 `podman images` 命令验证它是否仍在运行：\n\n```\n\
  # podman images\nCONTAINER ID  IMAGE                          COMMAND\nCREATED \
  \            STATUS                    PORTS\nNAMES\n35c54f5888bbc  registry.access.redhat.com/ubi8/ubi:latest\n\
  /bin/bash   About 5 minutes ago  Up 5 minutes ago\ncompassionate_chatelet\n```\n\
  \n#### Note\n\n对于在显示非常长的图像和 `ps -a` 命令输出时被迫使用的这种糟糕格式，我深表歉意。真的没有办法在单行内显示所有内容，除非字体缩小到大约\
  \ 4 pt，但那样你就无法阅读了。当你自己在自己的虚拟机上输入命令并跟随本章的演示时，这将会变得意义得多。\n\n唯一发生变化的视觉指示是提示符会变为某个指示你当前所在的容器\
  \ shell 提示符的主机的内容，请务必注意！\n\n### 退出并结束容器执行\n\n要退出交互会话并终止容器的执行，在命令提示符处输入：\n\n```\n\
  # exit\n```\n\n然后你可以通过以下命令检查容器状态，确保容器已退出：\n\n```\n# podman ps -a\nCONTAINER ID \
  \ IMAGE               COMMAND     CREATED\nSTATUS                    PORTS     \
  \  NAMES\n35c54f5888bbc  redhat.com/ubi8/ubi:latest  /bin/bash   About\na minute\
  \ ago  Exited (0) 6 seconds ago    infallible_khayyam\n```\n\n#### Note\n\n记住，我们在\
  \ `CONTAINER ID` 列中看到的是容器 ID，这是我们与运行或已退出容器交互的方式，而不是使用镜像 ID（Image ID）。\n\n### 删除容器\n\
  \n记住容器镜像在运行或执行时会变成容器，我们将使用该容器的 ID 将其从主机的现有容器列表中删除：\n\n```\n# podman rm 35c54f588bbc\n\
  35c54f58bbcb8acddbda95dfe91f02c553f211421fd7149a01729e0639\nc6379\n```\n\n显示完整的容器\
  \ ID 确认了容器已从主机列表中删除。\n\n使用命令验证容器是否已删除：\n\n```\n# podman ps -a \nCONTAINER ID  IMAGE\
  \  COMMAND  CREATED  STATUS  PORTS  NAMES\n```\n\n现在容器已经删除，你可以使用该容器镜像启动另一个运行中的容器，或者使用\
  \ `podman` 命令及其子命令 `rmi` 从你的系统中删除该容器镜像：\n\n```\n# podman rmi 2fd9e1478809\nUntagged:registry.access.redhat.com/ubi8/ubi:latest\n\
  Deleted:2fd9e1478809c0c53820517b998e1b2a044207515e5d61eccb6\n295276bbbaffc\n```\n\
  \n如果你再次使用 `podman images` 命令，你的主机现在应该不再显示该容器镜像：\n\n```\n# podman rmi 2fd9e1478809\n\
  REPOSITORY  TAG         IMAGE ID    CREATED     SIZE\n```\n\n### 查看容器日志\n\n![Images](img/key_topic_icon.jpg)\n\
  \n通过使用 `podman logs` 命令加上容器 ID 来处理容器日志：\n\n```\n# podman logs 35c54f588bbc\nThis\
  \ was a logger test entry\n```\n\n该命令接受你想要查询主日志条目的容器 ID；或者如果你只是想查看最近启动的容器的最新日志条目（使用\
  \ `-1` 或小写 L），请使用以下命令：\n\n```\n# podman logs -l\nThis was a logger test entry\n\
  ```\n\n#### Note\n\n你可能还想研究一下 `podman events` 命令，并将其与 `podman logs` 命令进行对比。\n\n\
  ### 暴露和映射端口\n\n端口不会自动从容器对主机可用，你必须暴露它们（通常是在容器启动时），这样它们就可以用于连接，例如下面所示的 NGINX 容器，我们通过以下命令暴露了端口\
  \ 80：\n\n```\n# podman run --expose=80 --publish-all\nregistry.access.redhat.com/rhscl/nginx-16-rhel7\
  \ &\n```\n\n这将运行上述镜像（NGINX 1.7 镜像）作为容器，并暴露端口 80，然后将其所有暴露的端口发布到主机。`&` 后缀用于设置进程在后台执行。\n\
  \n或者，我们也可以使用命令将容器端口（例如此 NGINX 容器上的 8080 端口）映射到主机上的特定端口：\n\n```\n# podman run -d\
  \ -p 8080:80\nregistry.access.redhat.com/rhscl/nginx-16-rhel7\n```\n\n你可以通过两种方法查看暴露的端口，第一种是运行名为\
  \ `port` 的 `podman` 子命令，如如下：\n\n```\n# podman port -a\n52ee615ae4b7     80/tcp ->\
  \ 0.0.0.0:8080\nae054514e8f6     80/tcp -> 0.0.0.0:36319\nae054514e8f6     443/tcp\
  \ -> 0.0.0.0:44783\n```\n\n注意，以 \"ae\" 开头的容器每个端口都有条目，显示了数字以及它们映射到主机的位置。\n\n另一组稍长或更显式的信息可以通过以下命令获取：\n\
  \n```\n# podman ps -a\nCONTAINER ID  IMAGE\nCOMMAND               CREATED      \
  \   STATUS\nPORTS                                          NAMES\nae054514e8f6\n\
  registry.access.redhat.com/rhscl/nginx-16-rhel7:latest\nnginx -g daemon o...  32\
  \ seconds ago  Up 31 seconds ago\n0.0.0.0:36319->80/tcp, 0.0.0.0:44783->443/tcp\n\
  optimistic_archimedes\n52ee615ae4b7\nregistry.access.redhat.com/rhscl/nginx-16-rhel7:latest\n\
  nginx -g daemon o...  6 seconds ago   Up 6 seconds ago\n0.0.0.0:8080->80/tcp\ninfallible_easley\n\
  ```\n\n无论哪种方式，你都可以看到 `ae054514e8f6` 容器暴露了端口，而 `52ee615ae4b7` 容器映射了端口。\n\n### 总结\n\
  \n本章的演示部分结束，接下来是容器镜像操作引用和解释。\n\n### 容器镜像操作\n\n目标列表中列出了其他命令和概念，但更多是关于镜像维护的，我们将在此处提供详细介绍。\n\
  \n#### 构建\n\n使用 Docker 构建容器通常需要 root 权限，但现在 Podman 和 Buildah（Podman 使用的工具）允许普通用户在没有额外权限的情况下构建镜像。\n\
  \n有很多复杂的信息我们不会深入探讨，你只需要了解在构建容器镜像时发生了什么的概念，而不是所有的细节。我强烈建议阅读优秀的 Red Hat 文档：“Building,\
  \ Running and Managing Containers”，可以在他们的文档资源网站上找到它。\n\n无论你是使用 Docker 并根据 Dockerfile\
  \ 构建，还是使用 Buildah 并使用 ContainerFile 或你想作为新镜像基础的镜像，其概念大致相同。\n\n\n\n我们不会关注其局限性，这对于解释构建容器镜像时发生了什么的任务来说没有必要。\n\
  \n当你执行 `podman build` 命令时，底层使用的工具名为 `buildah`。\n\n以下是其工作原理：\n\n1. 创建一个 `Containerfile`\n\
  2. 创建一个用作测试运行的脚本\n3. 设置脚本的权限\n4. 使用 `buildah` 命令构建镜像\n5. 使用 `buildah images` 命令验证镜像\n\
  6. 使用 `podman run` 命令运行镜像\n\n### push（推送）\n\n推送镜像是将镜像从本地存储发送到公共仓库，甚至是发送你维护或使用的私有仓库的过程。\n\
  \n推送镜像到私有注册表并不困难，你可以使用 `podman` 命令及其 `registry` 子命令以及一些参数在你的系统中创建一个。\n\n一旦创建了仓库，你就可以\
  \ `buildah push` 命令将镜像发送到注册表，包括源签名和导致其列为仓库一部分的清单（manifest）。\n\n然后你可以使用 `curl` 命令验证注册表是否正确包含了该镜像，它将显示镜像存在的列表。\n\
  \n### pull（拉取）\n\n![Images](img/key_topic_icon.jpg)\n\n拉取镜是从公共或私有仓库检索镜像的过程。如果仓库是开放的，非常简单；如果你拥有仓库的适当身份验证，则会稍微复杂一点。拉取镜像在本章之前的演示中已经涵盖过。\n\
  \n### list（列出）\n\n列出单个或多个镜像需要你已经拉取或在本地存储了这些镜像。使用 `podman images` 命令列出系统已知的本地镜像。\n\
  \n### rmi（删除镜像）\n\n![Images](img/key_topic_icon.jpg)\n\n`podman rmi` 命令是从你的系统中移除镜像的方法，但它要求这些镜像处于停止状态，因此请执行\
  \ `podman stop` 命令停止运行的容器，并允许其底层镜像被删除。\n\n此外，你会发现可以使用 `podman rmi -a` 命令从本地存储中删除所有镜像。\n\
  \n如果你有多个同名的镜像，或者想要使用相当于“强制”的选项，可以使用 `podman rmi -a -f` 命令。\n\n### Summary（总结）\n\n\
  在本章中，我们带你完成了我最喜欢的演示之一，并同时教了你关于容器和容器操作的所有知识！\n\n你现在知道如何安装 `container-tools` 软件包、拉取镜像、列出镜像、启动和停止它们、连接和断开连接、它们如何记录日志以及端口是如何暴露和映射的。\n\
